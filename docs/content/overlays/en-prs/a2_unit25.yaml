course:
  title: Dari A2
  description: 'Lower-intermediate Afghan Dari: saying and asking what you have or have never done. The present perfect (past participle plus the short copula) in its written form رفته‌ام and its spoken Kabuli form رفتیم, the negative, and the contrast with the simple past.'
units:
  prs.a2.unit25.have_you_ever:
    title: Have you ever...?
lessons:
  prs.a2.unit25.lesson01.experience_words_and_perfect_forms:
    title: Experience words and the form رفته‌ام
  prs.a2.unit25.lesson02.more_participles_and_spoken_forms:
    title: More participles and the spoken forms
  prs.a2.unit25.lesson03.negative_and_simple_past_contrast:
    title: The negative, and the present perfect against the simple past
  prs.a2.unit25.lesson04.ever_never_already_yet:
    title: Ever, never, already and not yet
  prs.a2.unit25.lesson05.reading_and_listening:
    title: Reading and listening about experiences
  prs.a2.unit25.lesson06.conversation_about_experiences:
    title: A conversation about experiences
teaching:
  prs.a2.unit25.lesson01.teach.ever:
    title: So far, ever
    gloss: so far, until now, ever
    note: '*تا حال* means up to now. In a question it asks about your whole life so far: *آیا تا حال به هرات رفته‌ای؟* is Have you ever been to Herat? *آیا* opens a yes or no question.'
    example_gloss: Have you ever been to Herat?
  prs.a2.unit25.lesson01.teach.herat:
    title: Herat
    gloss: Herat
    note: '*هرات* is a large city in the west of Afghanistan, known for its old citadel and its markets.'
    example_gloss: My friend is from Herat.
  prs.a2.unit25.lesson01.teach.mazar:
    title: Mazar-i-Sharif
    gloss: Mazar-i-Sharif
    note: '*مزار شریف* is the big city in the north of Afghanistan, known for its blue-tiled shrine.'
    example_gloss: My friend lives in Mazar-i-Sharif.
  prs.a2.unit25.lesson01.teach.bamyan:
    title: Bamyan
    gloss: Bamyan
    note: '*بامیان* is a valley in the central highlands of Afghanistan, known for its mountain scenery.'
    example_gloss: My friend has been to Bamyan.
  prs.a2.unit25.lesson01.teach.qabili:
    title: Qabili palaw
    gloss: qabili palaw (rice with meat, carrots and raisins)
    note: '*قابلی پلو* is rice cooked with meat, carrots and raisins, a favourite Afghan dish.'
    example_gloss: Qabili palaw is very good.
  prs.a2.unit25.lesson01.teach.mantu:
    title: Mantu
    gloss: mantu (steamed dumplings)
    note: '*منتو* are steamed dumplings filled with meat and onion.'
    example_gloss: I like mantu.
  prs.a2.unit25.lesson01.teach.plane:
    title: Aeroplane
    gloss: aeroplane
    note: '*طیاره* is the Afghan word for an aeroplane.'
    example_gloss: The plane arrived in Kabul.
  prs.a2.unit25.lesson01.teach.travel:
    title: To travel
    gloss: to travel
    note: '*سفر کردن* is to travel. You say how you travel with *با*: *با بس سفر کردن* is to travel by bus.'
    example_gloss: My friend travelled by bus.
  prs.a2.unit25.lesson01.teach.been_herat:
    title: I have been to Herat
    gloss: I have been to Herat.
    note: '*به* means to. This is the first present perfect sentence of the unit: *رفته‌ام* says that you have been somewhere at some point in your life, without saying when.'
  prs.a2.unit25.lesson01.teach.formal_paradigm:
    title: 'The present perfect, written form: participle plus ending'
    gloss: I have been, you have been, he/she has been, we have been, you (formal or plural) have been, they have been
    note: 'The present perfect tells what you have or have not done in your life up to now, without saying when. It has two parts. First the past participle: take the past stem and add *ه*. The past stem of *رفتن* (to go) is *رفت*, so the participle is *رفته*. Then a short ending that matches the person: *رفته‌ام* (I have been), *رفته‌ای* (you, to a friend), *رفته است* (he or she has been), *رفته‌ایم* (we), *رفته‌این* (you, formal or plural; *رفته‌اید* is also accepted), *رفته‌اند* (they). In writing the endings join the participle with a half-space. The pronoun (*من، تو، او*) is optional, because the ending already shows the person. This is the formal written form, the one you will meet in letters, news and books.'
  prs.a2.unit25.lesson01.teach.spoken_paradigm:
    title: The present perfect, spoken Kabuli form
    gloss: I have been, you have been, he/she has been, we have been, you (formal or plural) have been, they have been
    note: 'In everyday Kabul speech the participle and the ending contract into one short word, built from the past stem: *رفتیم* (I have gone), *رفتی* (you, to a friend), *رفته* (he or she), *رفتیم* (we), *رفتین* (you, plural), *رفتن* (they). The 3rd person singular is just the bare participle *رفته*. Be careful with the 1st person: spoken *رفتیم* (I have gone) is not the simple past *رفتم* (I went); it ends in *-یم*, and it is spelled the same as the plural *رفتیم* (we have gone). Context tells them apart: *تا حال، هرگز، هنوز، قبلا* and an experience question point to the perfect (*تا حال رفتیم* = I have been so far), while a stated time such as *پارسال* or *دیروز* points to the simple past (*پارسال رفتم*). The formal attached forms (*رفته‌ام*) are still taught and this course accepts both in every answer: use the attached forms when you write or speak formally, and the contracted spoken forms with friends and family. The you-plural ending is *-ین* in both: *رفته‌این* and *رفتین*.'
  prs.a2.unit25.lesson02.teach.participle_rule:
    title: 'The past participle: past stem plus ه'
    gloss: gone, eaten, seen, cooked, done
    note: 'One rule makes the participle of almost every verb: start from the infinitive, drop *ن* to get the past stem, and add *ه*. *رفتن* gives *رفت* and then *رفته* (been, gone). *خوردن* gives *خورد* and *خورده* (eaten). *دیدن* gives *دید* and *دیده* (seen). *پختن* gives *پخت* and *پخته* (cooked). *کردن* gives *کرد* and *کرده* (done, made). The participle never changes for person; only the ending after it does.'
  prs.a2.unit25.lesson02.teach.eat_paradigm:
    title: 'Same endings, new verb: to eat'
    gloss: I have eaten, you have eaten, he/she has eaten, we have eaten, you (formal or plural) have eaten, they have eaten
    note: 'The endings you learned with *رفته* work with every participle: *خورده‌ام، خورده‌ای، خورده است، خورده‌ایم، خورده‌این، خورده‌اند*. In speech the same participle contracts: *خوردیم، خوردی، خورده، خوردیم، خوردین، خوردن*. So to say you have seen a movie you can write *فلم دیده‌ام* or say *فلم دیدیم*.'
  prs.a2.unit25.lesson02.teach.spoken_more:
    title: Spoken forms of the same verbs
    gloss: I have eaten, you have eaten, he/she has eaten, you (plural) have eaten, they have eaten; I have seen, you have seen; I have cooked, you have cooked; I have done, you have done
    note: 'The spoken forms work the same way for every verb: take the past stem and add the ending. *خورد* gives *خوردیم، خوردی، خورده، خوردین، خوردن*; *دید* gives *دیدیم، دیدی*; *پخت* gives *پختیم، پختی*; *کرد* gives *کردیم، کردی*. Remember that spoken *خوردیم* (I have eaten) is not the simple past *خوردم* (I ate); a word such as *تا حال* or *هرگز*, or the lack of a stated time, shows the perfect.'
  prs.a2.unit25.lesson02.teach.movie:
    title: Movie
    gloss: movie, film
    note: '*فلم* is the Afghan word for a movie. You see a movie with the verb *دیدن*: *فلم دیدن* is to watch a movie.'
    example_gloss: Last night I saw a movie.
  prs.a2.unit25.lesson02.teach.kebab:
    title: Kebab
    gloss: kebab, grilled meat
    note: '*کباب* is grilled meat, one of the most common dishes you can try in Afghanistan.'
    example_gloss: Yesterday I ate kebab.
  prs.a2.unit25.lesson02.teach.mantu_qabili:
    title: I have eaten mantu and qabili palaw
    gloss: I have eaten mantu and qabili palaw.
    note: '*و* means and. One participle at the end, *خورده‌ام*, covers both dishes.'
  prs.a2.unit25.lesson02.teach.seen_herat:
    title: I have seen Herat
    gloss: I have seen Herat.
    note: '*را* follows a definite thing, such as the name of a city, that receives the action: *هرات را* is the city Herat. *دیده‌ام* is the participle of *دیدن* plus *-ام*.'
  prs.a2.unit25.lesson02.teach.cooked:
    title: I have cooked qabili palaw
    gloss: I have cooked qabili palaw.
    note: '*پخته‌ام* is the participle of *پختن* (to cook) plus *-ام*. In speech: *قابلی پلو پختیم*.'
  prs.a2.unit25.lesson03.teach.last_year:
    title: Last year
    gloss: last year
    note: '*پارسال* is last year. A word like this fixes the event at one moment in time, so the verb after it is the simple past, not the present perfect.'
    example_gloss: Last year I went to Kabul.
  prs.a2.unit25.lesson03.teach.two_years_ago:
    title: Two years ago
    gloss: two years ago
    note: '*پیش* after a time means ago: *دو سال پیش* is two years ago. It is another time word that needs the simple past.'
    example_gloss: Two years ago I went to Mazar-i-Sharif.
  prs.a2.unit25.lesson03.teach.never:
    title: Never
    gloss: never, not ever
    note: '*هرگز* means never. It goes with a negative verb, so the sentence still says no with the *ن*: *به بامیان هرگز نرفته‌ام* is I have never been to Bamyan.'
    example_gloss: I have never been to Bamyan.
  prs.a2.unit25.lesson03.teach.never_alt:
    title: Never (another word)
    gloss: never, at no time
    note: '*هیچ‌وقت* means the same as *هرگز* here and also needs a negative verb: *هیچ‌وقت فلم ندیده‌ام* is I have never seen a movie. It is a little more everyday than *هرگز*.'
    example_gloss: I have never been to Bamyan.
  prs.a2.unit25.lesson03.teach.neg_formal:
    title: 'The negative: ن on the participle'
    gloss: I have not been, you have not been, he/she has not been, we have not been, you (formal or plural) have not been, they have not been
    note: 'To say you have not done something, put *ن* in front of the participle and keep the same endings: *رفته‌ام* (I have been) becomes *نرفته‌ام* (I have not been). The full set is *نرفته‌ام، نرفته‌ای، نرفته است، نرفته‌ایم، نرفته‌این، نرفته‌اند*. The *ن* belongs to the participle, never to the ending.'
  prs.a2.unit25.lesson03.teach.neg_spoken:
    title: The negative in the spoken form
    gloss: I have not been, you have not been, he/she has not been, we have not been, you (formal or plural) have not been, they have not been
    note: 'The spoken negative works the same way: *ن* goes on the contracted form: *نرفتیم، نرفتی، نرفته، نرفتیم، نرفتین، نرفتن*. Both *نرفته‌ام* and *نرفتیم* are correct and mean I have not been. Do not confuse spoken *نرفتیم* (I have not been) with the simple past negative *نرفتم* (I did not go): a stated time such as *دیروز* goes with *نرفتم*.'
  prs.a2.unit25.lesson03.teach.neg_more:
    title: The same ن with other verbs
    gloss: I have not eaten, I have not seen, I have not cooked, I have not done
    note: 'The rule is the same for every verb: *نخورده‌ام* (I have not eaten), *ندیده‌ام* (I have not seen), *نپخته‌ام* (I have not cooked), *نکرده‌ام* (I have not done). With verbs made of a word plus *کردن*, the *ن* goes on *کرده*: *سفر نکرده‌ام* (I have not travelled), never *نسفر کرده‌ام*. Spoken: *نخوردیم، ندیدیم، نپختیم، نکردیم*.'
  prs.a2.unit25.lesson03.teach.contrast:
    title: Present perfect or simple past?
    gloss: Last year I went to Herat. / I have been to Herat. / I go to Herat.
    note: 'Use the simple past when you say when something happened: *پارسال به هرات رفتم* (last year I went to Herat) or *دو سال پیش رفتم*. Use the present perfect when the time is not given and you only say that it is part of your experience: *به هرات رفته‌ام* (I have been to Herat). The present is different again: *به هرات می‌روم* (I go to Herat, or I am going). So a time word such as *پارسال* or *دیروز* goes with *رفتم*, while *تا حال* and *هرگز* go with *رفته‌ام* and *نرفته‌ام*.'
  prs.a2.unit25.lesson04.teach.already:
    title: Already, before
    gloss: already, before
    note: '*قبلا* means before now or already. It goes with an affirmative present perfect: *قبلا به هرات رفته‌ام* is I have already been to Herat.'
    example_gloss: I have already been to Herat.
  prs.a2.unit25.lesson04.teach.not_yet:
    title: Not yet, still
    gloss: yet, still
    note: '*هنوز* with a negative present perfect means not yet: *هنوز به هرات نرفته‌ام* is I have not been to Herat yet.'
    example_gloss: I have not been to Herat yet.
  prs.a2.unit25.lesson04.teach.times:
    title: Once, twice
    gloss: once, twice
    note: '*بار* is a time, an occasion. *یک بار* is once and *دو بار* is twice. The number goes before *بار* and the sentence still uses the present perfect.'
    example_gloss:
    - I have been to Mazar-i-Sharif twice.
    - I have travelled by plane once.
  prs.a2.unit25.lesson04.teach.how_many:
    title: How many times have you been?
    gloss: How many times have you been to Mazar-i-Sharif?
    note: '*چند* means how many. *چند بار* asks how many times, and the answer is a number plus *بار*: *دو بار*.'
  prs.a2.unit25.lesson04.teach.yes_no:
    title: Yes, no
    gloss: yes, no
    note: '*بلی* is yes and *نخیر* is the polite everyday no. A short answer repeats the participle: *بلی، رفته‌ام* or *نخیر، نرفته‌ام*.'
    example_gloss:
    - Yes, I have been to Herat.
    - No, I have not been to Herat yet.
  prs.a2.unit25.lesson04.teach.but:
    title: But
    gloss: but
    note: '*ولی* joins something you have done with something you have not: *به مزار شریف رفته‌ام، ولی به هرات نرفته‌ام*.'
    example_gloss: I have been to Mazar-i-Sharif, but I have not been to Herat.
  prs.a2.unit25.lesson04.teach.qa:
    title: Asking and answering about experience
    gloss: Have you ever been to Herat? Yes, I have. No, I never have.
    note: 'To ask whether someone has ever done something, use *آیا* and *تا حال* with the present perfect: *آیا تا حال به هرات رفته‌ای؟* With a friend you can also use the spoken form: *آیا تا حال به هرات رفتی؟* Answer with *بلی* and the participle (*بلی، رفته‌ام*) or with *نخیر* and the negative (*نخیر، تا حال نرفته‌ام*). You can add how often: *بلی، دو بار رفته‌ام*. The question word *آیا* can be left out in speech when the question mark is clear from your voice.'
  prs.a2.unit25.lesson04.teach.adverbs:
    title: Already, not yet, never
    gloss: I have already been. I have not been yet. I have never been.
    note: 'Three small words answer the question whether you have already done something yet. *قبلا رفته‌ام* means I have already been. *هنوز نرفته‌ام* means I have not been yet, and it suggests you may still go. *هرگز نرفته‌ام* means I have never been, with no such suggestion. *قبلا* goes with an affirmative participle; *هنوز* and *هرگز* go with a negative participle. All three come before the participle, usually after the place: *به هرات هنوز نرفته‌ام*. The spoken forms work in the same way: *هنوز نرفتیم*.'
  prs.a2.unit25.lesson05.teach.also:
    title: Also, too
    gloss: also, too
    note: '*هم* means also or too. It comes right after the thing it adds: *قابلی پلو هم پخته‌ام* is I have cooked qabili palaw too.'
    example_gloss: I have cooked qabili palaw too.
  prs.a2.unit25.lesson05.teach.profile:
    title: Zarmina writes about her experiences
    gloss: I am Zarmina. So far I have been to Herat and Mazar-i-Sharif, but I have not been to Bamyan. I have eaten mantu and qabili palaw. I have cooked qabili palaw too. I have not travelled by plane.
    note: 'A short written profile in the formal written form. Four things she has done and two she has not: *به بامیان نرفته‌ام* and *با طیاره سفر نکرده‌ام*.'
  prs.a2.unit25.lesson05.teach.ex_q:
    title: Homayoun asks Zarmina about flying
    gloss: Zarmina, have you ever travelled by plane?
    note: Homayoun uses the spoken form *سفر کردی* with a friend. The question starts with *آیا تا حال*.
  prs.a2.unit25.lesson05.teach.ex_a:
    title: Zarmina says she never has
    gloss: No, I have never travelled by plane. And you?
    note: '*هرگز* goes before the negative participle *نکردیم*. *تو چطور؟* is a short way to ask and you?'
  prs.a2.unit25.lesson05.teach.ex_a2:
    title: Homayoun answers once
    gloss: Yes, I have travelled once.
    note: '*بلی* answers yes and *یک بار* says how many times. The place is left out because it is clear from the question.'
  prs.a2.unit25.lesson06.teach.turn01:
    title: Zarmina asks Homayoun about Mazar-i-Sharif
    gloss: Homayoun, have you ever been to Mazar-i-Sharif?
    note: Zarmina uses the spoken form *رفتی* with a friend. The question starts with *آیا تا حال*.
  prs.a2.unit25.lesson06.teach.turn02:
    title: Homayoun says twice, then not yet
    gloss: Yes, I have been twice. But I have not been to Herat yet. And you?
    note: '*دو بار* says how many times. *ولی هنوز به هرات نرفتیم* sets a place he has not been to yet against the one he has.'
  prs.a2.unit25.lesson06.teach.turn03:
    title: Zarmina tells about Herat and Bamyan
    gloss: I have been to Herat once, but I have never been to Bamyan.
    note: '*یک بار* is once and *به بامیان هرگز نرفتیم* is never. *هرگز* goes with the negative participle.'
  prs.a2.unit25.lesson06.teach.turn04:
    title: Homayoun asks about cooking
    gloss: Have you ever cooked qabili palaw?
    note: A yes or no question about experience, with *تا حال* and the spoken *پختی*.
  prs.a2.unit25.lesson06.teach.turn05:
    title: Zarmina has already cooked it
    gloss: Yes, I have cooked it before. And you?
    note: '*قبلا پختیم* is I have already cooked it. The dish is left out because both speakers know it.'
  prs.a2.unit25.lesson06.teach.turn06:
    title: Homayoun has not cooked it yet
    gloss: No, I have not cooked it yet. But I have eaten it.
    note: '*هنوز نپختیم* is not yet, with *ن* on the participle. *ولی خوردیم* adds what he has done.'
  prs.a2.unit25.lesson06.teach.turn07:
    title: Zarmina reacts
    gloss: How nice!
    note: '*چه خوب!* is a friendly reaction to good news.'
exercises:
  prs.a2.unit25.lesson01.exercise01.recognize_been_herat:
    instruction: What does this sentence mean?
    correct_option: I have been to Herat
    distractors:
    - I am going to Herat
    - I have never been to Herat
    - He has been to Herat
    accepted_answers:
    - value: I have been to Herat
      status: correct
    feedback: '*رفته‌ام* is the participle *رفته* plus the ending *-ام*: *به هرات رفته‌ام* is I have been to Herat.'
  prs.a2.unit25.lesson01.exercise02.recognize_we_bamyan:
    instruction: What does this sentence mean?
    correct_option: We have been to Bamyan
    distractors:
    - I have been to Bamyan
    - They have been to Bamyan
    - He has been to Bamyan
    accepted_answers:
    - value: We have been to Bamyan
      status: correct
    feedback: 'The ending *-ایم* in *رفته‌ایم* means we: *ما به بامیان رفته‌ایم* is we have been to Bamyan.'
  prs.a2.unit25.lesson01.exercise03.recognize_spoken_you:
    instruction: What does this spoken-form sentence mean?
    correct_option: You have been to Herat (to a friend)
    distractors:
    - I have been to Herat
    - He has been to Herat
    - We have been to Herat
    accepted_answers:
    - value: You have been to Herat (to a friend)
      status: correct
    feedback: 'In the spoken form *-ی* is the you (friend) ending: *تو به هرات رفتی* is you have been to Herat.'
  prs.a2.unit25.lesson01.exercise04.match_perfect_forms:
    instruction: Match each Dari word with its meaning.
    accepted_answers:
    - value:
        رفته‌ام: I have been
        رفته‌ای: you have been (to a friend)
        رفته است: he or she has been
        رفته‌ایم: we have been
        رفته‌این: you have been (formal or plural)
        رفته‌اند: they have been
        هرات: Herat
        بامیان: Bamyan
        مزار شریف: Mazar-i-Sharif
      status: correct
    feedback: 'Each ending shows who has been: *-ام* I, *-ای* you (friend), *است* he or she, *-ایم* we, *-این* you (formal or plural), *-اند* they.'
  prs.a2.unit25.lesson01.exercise05.order_ever_herat:
    instruction: 'Arrange the words to ask a friend: Have you ever been to Herat?'
    accepted_answers:
    - value:
      - آیا
      - تا
      - حال
      - به
      - هرات
      - رفته‌ای
      status: correct
    feedback: '*آیا تا حال به هرات رفته‌ای؟* opens with *آیا*, and the participle with its ending comes last.'
  prs.a2.unit25.lesson01.exercise06.translate_been_herat:
    instruction: 'Translate into Dari, using the present perfect of رفتن: I have been to Herat.'
    accepted_answers:
