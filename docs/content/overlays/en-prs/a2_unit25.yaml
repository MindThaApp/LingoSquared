      status: correct
    - value: من به هرات رفته‌ام
      status: correct
    - value: به هرات رفتیم
      status: correct
    - value: من به هرات رفتیم
      status: correct
    feedback: '*به هرات رفته‌ام* is I have been to Herat. The spoken form *به هرات رفتیم* is just as correct, and *من* is optional.'
  prs.a2.unit25.lesson02.exercise01.recognize_eaten:
    instruction: What does this sentence mean?
    correct_option: I have eaten qabili palaw
    distractors:
    - I have cooked qabili palaw
    - I have seen qabili palaw
    - I have bought qabili palaw
    accepted_answers:
    - value: I have eaten qabili palaw
      status: correct
    feedback: '*خورده‌ام* is the participle of *خوردن* (to eat) plus *-ام*: *قابلی پلو خورده‌ام* is I have eaten qabili palaw.'
  prs.a2.unit25.lesson02.exercise02.recognize_seen_herat:
    instruction: What does this sentence mean?
    correct_option: You have seen Herat
    distractors:
    - I have seen Herat
    - He has seen Herat
    - We have seen Herat
    accepted_answers:
    - value: You have seen Herat
      status: correct
    feedback: '*دیده‌ای* is *دیده* plus the ending *-ای* for you: *هرات را دیده‌ای* is you have seen Herat.'
  prs.a2.unit25.lesson02.exercise03.match_participles:
    instruction: Match each Dari form with its meaning.
    accepted_answers:
    - value:
        رفته: been, gone
        خورده: eaten
        دیده: seen
        پخته: cooked
        کرده: done or made
        خوردیم: I have eaten
        دیدی: you have seen (to a friend)
        پختیم: we have cooked
        کردن: they have done or made
        رفتین: you have been (formal or plural)
      status: correct
    feedback: The participle alone has no person. The spoken ending built into the verb, *-یم، -ی، -یم، -ین، -ن*, shows who, and the 3rd person singular has no ending at all.
  prs.a2.unit25.lesson02.exercise04.order_mantu_qabili:
