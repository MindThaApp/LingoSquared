    - به هرات می‌روم
    - به هرات نرفته‌ام
    accepted_answers:
    - value: به هرات رفته‌ام
      status: correct
    feedback: '*به هرات رفته‌ام* gives no time and states an experience. *پارسال به هرات رفتم* names a time, *به هرات می‌روم* is the present, and *به هرات نرفته‌ام* is the negative.'
  prs.a2.unit25.lesson03.exercise04.match_positive_negative:
    instruction: Match each Dari word with its meaning.
    accepted_answers:
    - value:
        رفته‌ام: I have been
        نرفته‌ام: I have not been
        خورده‌ام: I have eaten
        نخورده‌ام: I have not eaten
        دیده‌ام: I have seen
        ندیده‌ام: I have not seen
        پخته‌ام: I have cooked
        نپخته‌ام: I have not cooked
        پارسال: last year (use the simple past)
        هرگز: never
      status: correct
    feedback: A leading *ن* on the participle makes it negative. *پارسال* names a time and *هرگز* means never.
