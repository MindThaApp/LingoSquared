course:
  title: Dari B1
  description: >-
    Intermediate Kabul Dari: reporting what someone said or asked --
    reported yes/no questions with که آیا ("that whether"), and shifting
    pronouns correctly when reporting a direct statement or question.

units:
  prs.b1.unit11.communication:
    title: Reporting
    description: Report what someone said or asked, including yes/no questions, correctly shifting pronouns and tense as needed.

lessons:
  prs.b1.unit11.lesson01.reported_yes_no_question:
    title: "Asked whether..."
  prs.b1.unit11.lesson02.pronoun_shift_statement:
    title: "Said that he/she..."
  prs.b1.unit11.lesson03.negative_reported_question:
    title: "Asked whether... not"
  prs.b1.unit11.lesson04.dialogue_doctor_visit:
    title: "The doctor visit"
  prs.b1.unit11.lesson05.reading_doctor_visit:
    title: "Reporting the visit"
  prs.b1.unit11.lesson06.wrapup_production:
    title: "Wrap-up"

teaching:
  prs.b1.unit11.lesson01.teach.aya:
    title: Whether
    gloss: whether
    note: "آیا marks a yes/no question -- inside reported speech it follows که."
    example_gloss: "The doctor asked whether I was sick."
  prs.b1.unit11.lesson01.teach.ke_aya:
    title: "That whether"
    gloss: "that whether"
    note: "که آیا together introduce a reported yes/no question."
    example_gloss: "The doctor asked whether I was sick."
  prs.b1.unit11.lesson01.teach.grammar_reported_yesno:
    title: "Reporting a yes/no question"
    gloss: "شما مریض استین؟ (direct) -> داکتر پرسید که آیا مریض استم (reported)"
    note: "A direct yes/no question becomes reported speech with که آیا ('that whether'). Notice the pronoun shift: the direct question's شما (you) becomes من/استم (I) in the report, because the PERSON WHO WAS ASKED is now the one reporting it."
  prs.b1.unit11.lesson01.teach.porsid:
    title: Asked
    gloss: asked
    note: "پرسید is the 3rd person simple past of پرسیدن (to ask)."
    example_gloss: "The doctor asked whether I was sick."
  prs.b1.unit11.lesson01.teach.marize:
    title: Sick
    gloss: sick
    note: "مریض means sick."
    example_gloss: "The doctor asked whether I was sick."
  prs.b1.unit11.lesson01.teach.review_daktar:
    title: Doctor
    gloss: doctor
    note: "داکتر means doctor."
    example_gloss: "The doctor asked whether I was sick."
  prs.b1.unit11.lesson01.teach.review_astam:
    title: I am
    gloss: "I am"
    note: "استم is the 1st person copula, this course's fuller/uncontracted form."
    example_gloss: "The doctor asked whether I was sick."

  prs.b1.unit11.lesson02.teach.oo:
    title: He / she
    gloss: "he / she"
    note: "او means he/she -- used here as the 3rd person a report shifts to."
    example_gloss: "Zarmina said that she was well."
  prs.b1.unit11.lesson02.teach.goft_ke_oo:
    title: "Said that he/she"
    gloss: "said that he/she"
    note: "گفت که او means said that he/she -- introduces a reported statement about a third person."
    example_gloss: "Zarmina said that she was well."
  prs.b1.unit11.lesson02.teach.grammar_pronoun_shift:
    title: "Pronoun shift when a third party reports"
    gloss: "من خوب استم (direct) -> زرمینه گفت که او خوب است (reported)"
    note: "When a THIRD PARTY reports what someone else said, the 1st person (من) of the direct statement shifts to 3rd person (او). The copula also shifts: استم (I am) -> است (he/she is)."
  prs.b1.unit11.lesson02.teach.review_zarmina:
    title: Zarmina
    gloss: Zarmina
    note: "زرمینه -- an established recurring character in this course."
    example_gloss: "Zarmina said that she was well."
  prs.b1.unit11.lesson02.teach.review_khoob:
    title: Well / good
    gloss: "well / good"
    note: "خوب means well or good."
    example_gloss: "Zarmina said that she was well."

  prs.b1.unit11.lesson03.teach.esterahat:
    title: Rest
    gloss: rest
    note: "استراحت means rest."
    example_gloss: "The doctor asked whether I don't rest."
  prs.b1.unit11.lesson03.teach.namikonam:
    title: "I don't do"
    gloss: "I don't do"
    note: "نمی‌کنم is the negative 1st person present of کردن (to do)."
    example_gloss: "The doctor asked whether I don't rest."
  prs.b1.unit11.lesson03.teach.grammar_negative_reported:
    title: "Reporting a negative question"
    gloss: "شما استراحت نمی‌کنین؟ (direct) -> پرسید که آیا استراحت نمی‌کنم (reported)"
    note: "A negative direct question also carries its negation into the reported form. The negative prefix ن- stays exactly where it was, only the pronoun/person-ending shifts."
  prs.b1.unit11.lesson03.teach.review_bayad:
    title: Must / should
    gloss: "must / should"
    note: "باید means must or should."
    example_gloss: "The doctor said that I should rest more."
  prs.b1.unit11.lesson03.teach.esterahat_konam:
    title: "(that) I rest"
    gloss: "(that) I rest"
    note: "استراحت کنم means (that) I rest -- استراحت (rest) + کنم (1st person subjunctive of کردن)."
    example_gloss: "The doctor said that I should rest more."
  prs.b1.unit11.lesson03.teach.review_bishtar:
    title: More
    gloss: more
    note: "بیشتر means more."
    example_gloss: "The doctor said that I should rest more."

  prs.b1.unit11.lesson04.teach.review_molaqat:
    title: Appointment
    gloss: appointment
    note: "ملاقات means appointment -- an established recurring word in this course (Zarmina's doctor's appointment, first set up in an earlier unit)."
    example_gloss: "How was the doctor's appointment?"
  prs.b1.unit11.lesson04.teach.bood:
    title: Was
    gloss: was
    note: "بود is the simple past 3rd person of بودن (to be)."
    example_gloss: "How was the doctor's appointment?"
  prs.b1.unit11.lesson04.teach.che_goftid:
    title: "What did you say?"
    gloss: "what did you say?"
    note: "چه گفتید؟ formally asks what did you say, using شما+گفتید."
    example_gloss: "What did you say?"
  prs.b1.unit11.lesson04.teach.grammar_simple_past_plural:
    title: "The simple-past 2nd-plural exception"
    gloss: "گفتید keeps -ید, unlike present/subjunctive/imperative -ین forms"
    note: "شما چه گفتید؟ (what did you say?) keeps the -ید ending for simple past 2nd person plural/polite -- unlike present/subjunctive/imperative forms (کنین، بگیرین), simple past 2nd-plural verbs in this course are never shortened to -ین. This is a real, established exception, not an inconsistency."
  prs.b1.unit11.lesson04.teach.goftam:
    title: I said
    gloss: "I said"
    note: "گفتم is the 1st person simple past of گفتن (to say)."
    example_gloss: "I said that I was well."
  prs.b1.unit11.lesson04.teach.review_kami:
    title: "A little"
    gloss: "a little"
    note: "کمی means a little."
    example_gloss: "I'm a little tired."
  prs.b1.unit11.lesson04.teach.review_khaste:
    title: Tired
    gloss: tired
    note: "خسته means tired."
    example_gloss: "I'm a little tired."
  prs.b1.unit11.lesson04.teach.review_vali:
    title: But
    gloss: but
    note: "ولی means but."
    example_gloss: "I said that I was well, but I'm a little tired."
  prs.b1.unit11.lesson04.teach.review_homayoun:
    title: Homayoun
    gloss: Homayoun
    note: "همایون -- an established recurring character in this course."
    example_gloss: "Homayoun asked Zarmina."
  prs.b1.unit11.lesson04.teach.review_chetor:
    title: How
    gloss: how
    note: "چطور means how."
    example_gloss: "How was the doctor's appointment?"
  prs.b1.unit11.lesson04.teach.review_che:
    title: What
    gloss: what
    note: "چه means what."
    example_gloss: "What did you say?"
  prs.b1.unit11.lesson04.teach.review_shoma:
    title: You
    gloss: you
    note: "شما is the polite/plural form of you."
    example_gloss: "What did you say?"
  prs.b1.unit11.lesson04.teach.review_az:
    title: From
    gloss: from
    note: "از means from."
    example_gloss: "The doctor asked Zarmina."
  prs.b1.unit11.lesson04.teach.dialogue_homayoun_ask:
    title: "Zarmina, how was the doctor's appointment?"
    gloss: "Zarmina, how was the doctor's appointment?"
    note: "Homayoun asks about her visit."
  prs.b1.unit11.lesson04.teach.dialogue_zarmina_report_question:
    title: "It was good. The doctor asked whether I was sick."
    gloss: "It was good. The doctor asked whether I was sick."
    note: "Zarmina reports the doctor's yes/no question using که آیا."
  prs.b1.unit11.lesson04.teach.dialogue_homayoun_what_did_you_say:
    title: "What did you say?"
    gloss: "what did you say?"
    note: "Homayoun asks formally, using شما+گفتید."
  prs.b1.unit11.lesson04.teach.dialogue_zarmina_report_answer:
    title: "I said that I was well, but I'm a little tired."
    gloss: "I said that I was well, but I'm a little tired."
    note: "Zarmina reports her own answer to the doctor."
  prs.b1.unit11.lesson04.teach.dialogue_homayoun_what_did_doctor_say:
    title: "What did the doctor say?"
    gloss: "what did the doctor say?"
    note: "Homayoun asks about the doctor's advice."
  prs.b1.unit11.lesson04.teach.dialogue_zarmina_report_advice:
    title: "He said that I should rest more."
    gloss: "he said that I should rest more."
    note: "Zarmina reports the doctor's advice."

  prs.b1.unit11.lesson05.teach.raft:
    title: Went
    gloss: went
    note: "رفت is the 3rd person simple past of رفتن (to go)."
    example_gloss: "Zarmina went to the doctor."
  prs.b1.unit11.lesson05.teach.review_be:
    title: To
    gloss: to
    note: "به means to."
    example_gloss: "Zarmina went to the doctor."
  prs.b1.unit11.lesson05.teach.konad:
    title: "(that) he/she do"
    gloss: "(that) he/she do"
    note: "کند is the 3rd person subjunctive of کردن (to do)."
    example_gloss: "The doctor said that she should rest more."
  prs.b1.unit11.lesson05.teach.reading_passage:
    title: "Reporting the visit"
    gloss: "Zarmina went to the doctor. The doctor asked whether she was sick. Zarmina said that she was well, but a little tired. The doctor said that she should rest more."
    note: "A short reading told from a third-party narrator's perspective, contrasting with lesson04's first-person dialogue -- notice the pronoun/copula shift from استم (Zarmina reporting herself) to است (the narrator reporting about Zarmina)."

  prs.b1.unit11.lesson06.teach.grammar_review:
    title: "Review: reporting speech"
    gloss: "Report a yes/no question with که آیا. Report a statement by shifting the pronoun/copula (من -> او, استم -> است). Simple past 2nd-plural (گفتید) always keeps -ید."
    note: "This lesson reviews and combines everything from lessons 1-5."
  prs.b1.unit11.lesson06.teach.review_kar:
    title: Work
    gloss: work
    note: "کار means work."
    example_gloss: "The manager asked whether I have work."
  prs.b1.unit11.lesson06.teach.review_daram:
    title: I have
    gloss: "I have"
    note: "دارم is the 1st person present of داشتن (to have)."
    example_gloss: "The manager asked whether I have work."
  prs.b1.unit11.lesson06.teach.review_modir:
    title: Manager
    gloss: manager
    note: "مدیر means manager -- an established recurring role in this course."
    example_gloss: "The manager asked whether I have work."
  prs.b1.unit11.lesson06.teach.review_waqt:
    title: Time
    gloss: time
    note: "وقت means time."
    example_gloss: "You asked whether I have time."
  prs.b1.unit11.lesson06.teach.porsidid:
    title: You asked
    gloss: "you asked"
    note: "پرسیدید is the 2nd person plural/polite simple past of پرسیدن (to ask) -- correctly keeping -ید, the established simple-past exception."
    example_gloss: "You asked whether I have time."

