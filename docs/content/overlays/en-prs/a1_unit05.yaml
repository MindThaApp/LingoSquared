course:
  title: Dari A1
  description: >-
    Beginner Afghan Dari: naming common city places, asking where something
    is, giving simple location answers, and following basic directions to
    a place.

units:
  prs.a1.unit05.places:
    title: Important places in the city

lessons:
  prs.a1.unit05.lesson01.everyday_places: {title: "Everyday places in the city"}
  prs.a1.unit05.lesson02.civic_and_travel_places: {title: "Civic and travel places"}
  prs.a1.unit05.lesson03.asking_where: {title: "Ask where something is"}
  prs.a1.unit05.lesson04.simple_location_answers: {title: "Near, far, here, and there"}
  prs.a1.unit05.lesson05.prepositions_of_place: {title: "Prepositions of place"}
  prs.a1.unit05.lesson06.finding_pharmacy_dialogue: {title: "Find the pharmacy in the neighborhood"}

teaching:
  prs.a1.unit05.lesson01.teach.bazaar:
    title: "Market"
    gloss: "market / bazaar"
    note: "بازار is the everyday word for a market area, often a whole street or district of shops."
    example_gloss: "The bazaar is close."
  prs.a1.unit05.lesson01.teach.bank:
    title: "Bank"
    gloss: "bank"
    note: "بانک is a direct loanword, used the same way as in English."
    example_gloss: "Where is the bank?"
  prs.a1.unit05.lesson01.teach.mosque:
    title: "Mosque"
    gloss: "mosque"
    note: "مسجد is the standard word for a mosque."
    example_gloss: "The mosque is big."
  prs.a1.unit05.lesson01.teach.hospital:
    title: "Hospital"
    gloss: "hospital"
    note: "شفاخانه is the everyday Afghan Dari word for hospital -- distinct from the Iranian Farsi بیمارستان, which Dari speakers may understand but wouldn't normally use themselves."
    example_gloss: "The hospital is far."
  prs.a1.unit05.lesson01.teach.school:
    title: "School"
    gloss: "school"
    note: "مکتب is the everyday Afghan Dari word for school -- distinct from the Iranian Farsi مدرسه, which in Dari usually implies a religious school specifically."
    example_gloss: "The school is near the house."
  prs.a1.unit05.lesson01.teach.pharmacy:
    title: "Pharmacy"
    gloss: "pharmacy"
    note: "دواخانه is the everyday Afghan Dari word for pharmacy (from دوا, medicine) -- distinct from the Iranian Farsi داروخانه."
    example_gloss: "Where is the pharmacy?"
  prs.a1.unit05.lesson01.teach.va_word:
    title: "And"
    gloss: "and"
    note: "و is the common connecting word used to join a list of places."

  prs.a1.unit05.lesson02.teach.post_office:
    title: "Post office"
    gloss: "post office"
    note: "پوسته خانه combines پوسته (post/mail) with خانه (house/building)."
    example_gloss: "The post office is closed."
  prs.a1.unit05.lesson02.teach.embassy:
    title: "Embassy"
    gloss: "embassy"
    note: "سفارت is the standard word for an embassy."
    example_gloss: "The embassy is in Kabul."
  prs.a1.unit05.lesson02.teach.airport:
    title: "Airport"
    gloss: "airport"
    note: "میدان هوایی is the everyday Afghan Dari term for airport (literally 'air field') -- distinct from the Iranian Farsi فرودگاه."
    example_gloss: "The airport is far."
  prs.a1.unit05.lesson02.teach.office_review:
    title: "Office (review)"
    gloss: "office"
    note: "دفتر was already introduced in an earlier unit; it's included here alongside the other civic places."
    example_gloss: "My office is close."

  prs.a1.unit05.lesson03.teach.kojast_bazaar:
    title: "Ask where the market is"
    gloss: "Where is the market?"
    note: "بازار کجاست؟ is the basic pattern for asking where any place is."
  prs.a1.unit05.lesson03.teach.kojast_hospital:
    title: "Ask where the hospital is"
    gloss: "Where is the hospital?"
    note: "The same کجاست pattern applies to any place noun."
  prs.a1.unit05.lesson03.teach.bebakhshid:
    title: "Politely get someone's attention"
    gloss: "Excuse me, where is the pharmacy?"
    note: "ببخشین politely opens a question to a stranger, the same function as 'excuse me' in English."
  prs.a1.unit05.lesson03.teach.kojast_grammar:
    title: "How کجاست is formed"
    gloss: "کجاست is کجا (where) plus است (is), contracted together."
    note: "Recognizing this breakdown helps learners see the pattern rather than memorizing کجاست as a single unanalyzed block."

  prs.a1.unit05.lesson04.teach.near:
    title: "Near"
    gloss: "near"
    note: "نزدیک describes something close by."
    example_gloss: "The bank is close."
  prs.a1.unit05.lesson04.teach.far:
    title: "Far"
    gloss: "far"
    note: "دور describes something at a distance."
    example_gloss: "The hospital is far."
  prs.a1.unit05.lesson04.teach.here:
    title: "Here"
    gloss: "here"
    note: "این‌جا points to the speaker's current location."
    example_gloss: "The bank is here."
  prs.a1.unit05.lesson04.teach.there:
    title: "There"
    gloss: "there"
    note: "آن‌جا points to a location away from the speaker."
    example_gloss: "The pharmacy is there."
  prs.a1.unit05.lesson04.teach.bazaar_near:
    title: "Say the market is near"
    gloss: "The market is near."
    note: "بازار نزدیک است uses the same است copula seen throughout this course."
  prs.a1.unit05.lesson04.teach.airport_far:
    title: "Say the airport is far"
    gloss: "The airport is far."
    note: "میدان هوایی دور است follows the same pattern with دور instead of نزدیک."

  prs.a1.unit05.lesson05.teach.next_to:
    title: "Next to"
    gloss: "next to"
    note: "در کنار literally means 'at the side of.'"
  prs.a1.unit05.lesson05.teach.behind:
    title: "Behind"
    gloss: "behind"
    note: "پشت indicates something is located behind another place."
    example_gloss: "The pharmacy is behind the school."
  prs.a1.unit05.lesson05.teach.opposite:
    title: "Opposite / across from"
    gloss: "opposite / across from"
    note: "مقابل indicates something is located directly across from another place."
    example_gloss: "The bank is opposite the mosque."
  prs.a1.unit05.lesson05.teach.hospital_next_to_mosque:
    title: "Locate the hospital relative to the mosque"
    gloss: "The hospital is next to the mosque."
    note: "شفاخانه در کنار مسجد است combines a place, the preposition در کنار, and the است copula."

  prs.a1.unit05.lesson06.teach.tashakor_ziad:
    title: "Thanks very much"
    gloss: "Thanks very much."
    note: "تشکر زیاد intensifies the everyday تشکر already taught."
  prs.a1.unit05.lesson06.teach.turn01:
    title: "Zarmina asks for the pharmacy"
    gloss: "Zarmina politely asks a passerby where the pharmacy is."
    note: "ببخشین opens the question respectfully, appropriate for a stranger."
  prs.a1.unit05.lesson06.teach.turn02:
    title: "The passerby gives directions"
    gloss: "The passerby says the pharmacy isn't far, to go straight, and that it's next to the school."
    note: "This combines several patterns from this unit: دور نیست (negated دور), مستقیم بروین, and در کنار."
  prs.a1.unit05.lesson06.teach.turn03:
    title: "Zarmina thanks the passerby"
    gloss: "Zarmina thanks him very much."
    note: "تشکر زیاد closes the exchange politely."
  prs.a1.unit05.lesson06.teach.turn04:
    title: "The passerby's modest reply"
    gloss: "Don't mention it / it's nothing."
    note: "قابلی نداره is a common, modest way to deflect thanks in everyday Afghan Dari, similar in function to خواهش می‌کنم but more casual."

exercises:
  prs.a1.unit05.lesson01.exercise01.recognize_bazaar:
    instruction: "What does this word mean?"
    correct_option: market
    distractors: [bank, mosque, school]
    accepted_answers: [{value: market, status: correct}]
    feedback: "بازار means market."
  prs.a1.unit05.lesson01.exercise02.recognize_hospital:
    instruction: "What does this word mean?"
    correct_option: hospital
    distractors: [pharmacy, school, bank]
    accepted_answers: [{value: hospital, status: correct}]
    feedback: "شفاخانه means hospital, the everyday Afghan Dari term."
  prs.a1.unit05.lesson01.exercise03.recognize_bank_reading:
    instruction: "Which place does بانک mean?"
    correct_option: bank
    distractors: [hospital, school, pharmacy]
    accepted_answers: [{value: bank, status: correct}]
    feedback: "بانک means bank."
  prs.a1.unit05.lesson01.exercise04.match_everyday_places:
    instruction: "Match each place with its English meaning."
    accepted_answers:
      - {value: {بازار: market, بانک: bank, مسجد: mosque, شفاخانه: hospital, مکتب: school, دواخانه: pharmacy}, status: correct}
    feedback: "These six words cover the everyday places in this lesson."
  prs.a1.unit05.lesson01.exercise05.order_places_list:
    instruction: "Arrange the words to say market and bank and mosque."
    accepted_answers: [{value: [بازار, و, بانک, و, مسجد], status: correct}]
    feedback: "بازار و بانک و مسجد lists three places joined with و."
  prs.a1.unit05.lesson01.exercise06.translate_school:
    instruction: "Translate into Dari: school."
    accepted_answers:
      - {value: مکتب, status: correct}
    feedback: "مکتب means school."
  prs.a1.unit05.lesson01.exercise07.write_pharmacy:
    instruction: "Write the Dari word for pharmacy."
    accepted_answers:
      - {value: دواخانه, status: correct}
    feedback: "دواخانه means pharmacy."

  prs.a1.unit05.lesson02.exercise01.recognize_embassy:
    instruction: "What does this word mean?"
    correct_option: embassy
    distractors: ["post office", airport, office]
    accepted_answers: [{value: embassy, status: correct}]
    feedback: "سفارت means embassy."
  prs.a1.unit05.lesson02.exercise02.recognize_airport:
    instruction: "What does this phrase mean?"
    correct_option: airport
    distractors: [embassy, "post office", office]
    accepted_answers: [{value: airport, status: correct}]
    feedback: "میدان هوایی means airport, literally 'air field.'"
  prs.a1.unit05.lesson02.exercise03.recognize_sefarat_reading:
    instruction: "Which place does سفارت mean?"
    correct_option: embassy
    distractors: ["post office", airport, office]
    accepted_answers: [{value: embassy, status: correct}]
    feedback: "سفارت means embassy."
  prs.a1.unit05.lesson02.exercise04.match_civic_places:
    instruction: "Match each place with its English meaning."
    accepted_answers:
      - {value: {"پوسته خانه": "post office", سفارت: embassy, "میدان هوایی": airport, دفتر: office, بازار: market, بانک: bank, مسجد: mosque, شفاخانه: hospital, مکتب: school, دواخانه: pharmacy}, status: correct}
    feedback: "These ten words cover civic, travel, and everyday places (the last six reviewed from lesson01)."
  prs.a1.unit05.lesson02.exercise05.order_post_office:
    instruction: "Arrange the words for post office."
    accepted_answers: [{value: [پوسته, خانه], status: correct}]
    feedback: "پوسته خانه means post office."
  prs.a1.unit05.lesson02.exercise06.translate_airport:
    instruction: "Translate into Dari: airport."
    accepted_answers:
      - {value: "میدان هوایی", status: correct}
    feedback: "میدان هوایی means airport."
  prs.a1.unit05.lesson02.exercise07.write_embassy:
    instruction: "Write the Dari word for embassy."
    accepted_answers:
      - {value: سفارت, status: correct}
    feedback: "سفارت means embassy."

  prs.a1.unit05.lesson03.exercise01.recognize_where_bazaar:
    instruction: "Which phrase asks where the market is?"
    correct_option: "Where is the market?"
    distractors: ["Where is the hospital?", "The market is near.", "What is your phone number?"]
    accepted_answers: [{value: "Where is the market?", status: correct}]
    feedback: "بازار کجاست؟ asks where the market is."
  prs.a1.unit05.lesson03.exercise02.recognize_polite_opener:
    instruction: "Which word politely opens a question to a stranger?"
    correct_option: ببخشین
    distractors: [تشکر, بازار, کجاست]
    accepted_answers: [{value: ببخشین, status: correct}]
    feedback: "ببخشین means excuse me, politely opening a question."
  prs.a1.unit05.lesson03.exercise03.recognize_where_question_reading:
    instruction: "What does this question ask?"
    correct_option: "Where is the market?"
    distractors: ["Where is the hospital?", "Excuse me, where is the pharmacy?", "Where is the bank?"]
    accepted_answers: [{value: "Where is the market?", status: correct}]
    feedback: "بازار کجاست؟ asks where the market is."
  prs.a1.unit05.lesson03.exercise04.match_where_questions:
    instruction: "Match each question with its meaning."
    accepted_answers:
      - {value: {"بازار کجاست؟": "Where is the market?", "شفاخانه کجاست؟": "Where is the hospital?", "ببخشین، دواخانه کجاست؟": "Excuse me, where is the pharmacy?", "بانک کجاست؟": "Where is the bank?", "مسجد کجاست؟": "Where is the mosque?", "مکتب کجاست؟": "Where is the school?", "سفارت کجاست؟": "Where is the embassy?", "دفتر کجاست؟": "Where is the office?"}, status: correct}
    feedback: "کجاست asks where a place is, for any place noun (the last five reuse place nouns from lesson01/lesson02)."
  prs.a1.unit05.lesson03.exercise05.order_where_question:
    instruction: "Arrange the words to politely ask where the pharmacy is."
    accepted_answers: [{value: [ببخشین, دواخانه, کجاست], status: correct}]
    feedback: "ببخشین، دواخانه کجاست؟ politely asks the question."
  prs.a1.unit05.lesson03.exercise06.translate_where_bank:
    instruction: "Translate into Dari: Where is the bank?"
    accepted_answers:
      - {value: "بانک کجاست؟", status: correct}
      - {value: "بانک کجاست", status: correct}
    feedback: "بانک کجاست؟ asks where the bank is."
  prs.a1.unit05.lesson03.exercise07.speak_where_question:
    instruction: "Politely ask a stranger where the school is."
    accepted_answers:
      - {value: "ببخشین، مکتب کجاست؟", status: correct}
      - {value: "ببخشین مکتب کجاست", status: correct}
    feedback: "ببخشین، مکتب کجاست؟ politely asks the question."

  prs.a1.unit05.lesson04.exercise01.recognize_near:
    instruction: "What does this word mean?"
    correct_option: near
    distractors: [far, here, there]
    accepted_answers: [{value: near, status: correct}]
    feedback: "نزدیک means near."
  prs.a1.unit05.lesson04.exercise02.recognize_far:
    instruction: "What does this word mean?"
    correct_option: far
    distractors: [near, here, there]
    accepted_answers: [{value: far, status: correct}]
    feedback: "دور means far."
  prs.a1.unit05.lesson04.exercise03.recognize_near_answer_reading:
    instruction: "What does this sentence mean?"
    correct_option: "The market is near."
    distractors: ["The airport is far.", "Where is the market?", "The hospital is next to the mosque."]
    accepted_answers: [{value: "The market is near.", status: correct}]
    feedback: "بازار نزدیک است means the market is near."
  prs.a1.unit05.lesson04.exercise04.match_location_words:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - {value: {نزدیک: near, دور: far, این‌جا: here, آن‌جا: there}, status: correct}
    feedback: "These four words describe basic locations."
  prs.a1.unit05.lesson04.exercise05.order_airport_far:
    instruction: "Arrange the words to say the airport is far."
    accepted_answers: [{value: [میدان, هوایی, دور, است], status: correct}]
    feedback: "میدان هوایی دور است says the airport is far."
  prs.a1.unit05.lesson04.exercise06.translate_far_answer:
    instruction: "Translate into Dari: The airport is far."
    accepted_answers:
      - {value: "میدان هوایی دور است", status: correct}
    feedback: "میدان هوایی دور است means the airport is far."
  prs.a1.unit05.lesson04.exercise07.translate_bank_here:
    instruction: "Translate into Dari: The bank is here."
    accepted_answers:
      - {value: "بانک این‌جا است", status: correct}
    feedback: "بانک این‌جا است says the bank is here."

  prs.a1.unit05.lesson05.exercise01.recognize_next_to:
    instruction: "What does this phrase mean?"
    correct_option: "next to"
    distractors: [behind, opposite, far]
    accepted_answers: [{value: "next to", status: correct}]
    feedback: "در کنار means next to."
  prs.a1.unit05.lesson05.exercise02.recognize_opposite:
    instruction: "What does this word mean?"
    correct_option: "opposite / across from"
    distractors: [behind, "next to", near]
    accepted_answers: [{value: "opposite / across from", status: correct}]
    feedback: "مقابل means opposite or across from."
  prs.a1.unit05.lesson05.exercise03.recognize_next_to_reading:
    instruction: "What does this sentence mean?"
    correct_option: "The hospital is next to the mosque."
    distractors: ["The market is near.", "The airport is far.", "Where is the market?"]
    accepted_answers: [{value: "The hospital is next to the mosque.", status: correct}]
    feedback: "شفاخانه در کنار مسجد است means the hospital is next to the mosque."
  prs.a1.unit05.lesson05.exercise04.match_prepositions:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - {value: {"در کنار": "next to", پشت: behind, مقابل: opposite, نزدیک: near, دور: far, "این‌جا": here, "آن‌جا": there}, status: correct}
    feedback: "These describe relative location -- the last four review lesson04's near/far/here/there."
  prs.a1.unit05.lesson05.exercise05.order_next_to_mosque:
    instruction: "Arrange the words to say the hospital is next to the mosque."
    accepted_answers: [{value: [شفاخانه, در, کنار, مسجد, است], status: correct}]
    feedback: "شفاخانه در کنار مسجد است locates the hospital relative to the mosque."
  prs.a1.unit05.lesson05.exercise06.translate_bank_behind_school:
    instruction: "Translate into Dari: The bank is behind the school."
    accepted_answers:
      - {value: "بانک پشت مکتب است", status: correct}
    feedback: "بانک پشت مکتب است means the bank is behind the school."
  prs.a1.unit05.lesson05.exercise07.translate_opposite_bank:
    instruction: "Translate into Dari: The pharmacy is across from the bank."
    accepted_answers:
      - {value: "دواخانه مقابل بانک است", status: correct}
    feedback: "دواخانه مقابل بانک است locates the pharmacy relative to the bank."

  prs.a1.unit05.lesson06.exercise01.listen_context:
    instruction: "Listen to the full dialogue. What is Zarmina looking for?"
    correct_option: "the pharmacy"
    distractors: ["the bank", "the school", "the embassy"]
    accepted_answers: [{value: "the pharmacy", status: correct}]
    feedback: "Zarmina asks a passerby where the pharmacy is."
  prs.a1.unit05.lesson06.exercise02.recognize_qabeli_nadare:
    instruction: "What does قابلی نداره mean here?"
    correct_option: "Don't mention it / it's nothing."
    distractors: ["I don't know.", "Please wait.", "Go straight ahead."]
    accepted_answers: [{value: "Don't mention it / it's nothing.", status: correct}]
    feedback: "قابلی نداره modestly deflects thanks."
  prs.a1.unit05.lesson06.exercise03.match_dialogue_facts:
    instruction: "Match each fact to what it describes in the dialogue."
    accepted_answers:
      - {value: {دواخانه: "در کنار مکتب", "دواخانه دور است یا نزدیک": "دور نیست"}, status: correct}
    feedback: "The pharmacy is next to the school and isn't far."
  prs.a1.unit05.lesson06.exercise04.order_polite_thanks:
    instruction: "Arrange the words to say thanks very much."
    accepted_answers: [{value: [تشکر, زیاد], status: correct}]
    feedback: "تشکر زیاد closes the exchange politely."
  prs.a1.unit05.lesson06.exercise05.translate_pharmacy_not_far:
    instruction: "Translate into Dari: The pharmacy isn't far."
    accepted_answers:
      - {value: "دواخانه دور نیست", status: correct}
    feedback: "دواخانه دور نیست means the pharmacy isn't far."
  prs.a1.unit05.lesson06.exercise06.dialogue_response_finding:
    instruction: "You need to find the pharmacy. Politely ask a passerby."
    accepted_answers:
      - {value: "ببخشین، دواخانه کجاست؟", status: correct}
      - {value: "ببخشین دواخانه کجاست", status: correct}
    feedback: "ببخشین، دواخانه کجاست؟ politely asks a stranger."
  prs.a1.unit05.lesson06.exercise07.write_directions_summary:
    instruction: "Write a sentence summarizing where the pharmacy is, based on the dialogue."
    accepted_answers:
      - {value: "دواخانه در کنار مکتب است", status: correct}
    feedback: "دواخانه در کنار مکتب است summarizes the pharmacy's location."
