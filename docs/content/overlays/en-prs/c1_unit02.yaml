    instruction: 'Which Dari label matches: Ahmad says that the report needs another reading. From the context, Farida understands that Ahmad is not satisfied with the wording. When he says excellent after a clear mistake, he means the opposite. Farida says the problem is not very simple, and she means that it is serious. The learner infers the stance of the speaker from the phrase and the context.?'
    correct_option: قرائت کامل
    distractors:
    - اشارهٔ ضمنی
    - بافت کلام
    - طعنه
    accepted_answers:
    - value: قرائت کامل
      status: correct
    feedback: '*قرائت کامل* is the taught label.'
  prs.c1.unit02.manaye_zemni.lesson06.exercise02.match:
    instruction: Match each Dari discourse-move label to the English example of that move.
    accepted_answers:
    - value:
        اشارهٔ ضمنی: Ahmad says that the report needs another reading
        بافت کلام: From the context, Farida understands that Ahmad is not satisfied with the wording
        طعنه: When he says excellent after a clear mistake, he means the opposite
        کم‌نمایی: Farida says the problem is not very simple, and she means that it is serious
        استنباط: The learner infers the stance of the speaker from the phrase and the context
        قرائت کامل: Ahmad says that the report needs another reading. From the context, Farida understands that Ahmad is not satisfied with the wording. When he says excellent after a clear mistake, he means the opposite. Farida says the problem is not very simple, and she means that it is serious. The learner infers the stance of the speaker from the phrase and the context.
      status: correct
    feedback: Each label names the move that its example sentence performs.
