course:
  title: Dari A1
  description: "Beginner Kabul Dari: ask for a haircut or trim at a barbershop, describe a simple style preference (shorter), ask for a beard trim, and understand a basic price and service exchange."
units:
  prs.a1.unit47.personal_care:
    title: Barbershop and haircut
    description: Ask for a haircut or trim at a barbershop, describe a simple style preference, ask for a beard trim, and understand a basic price and service exchange.
lessons:
  prs.a1.unit47.lesson01.barbershop_and_barber_vocabulary:
    title: Barbershop and barber
  prs.a1.unit47.lesson02.style_preference_vocabulary:
    title: Shorter hair and a trim
  prs.a1.unit47.lesson03.beard_and_shaving_vocabulary:
    title: Beard trim and shaving
  prs.a1.unit47.lesson04.barbershop_dialogue:
    title: Barbershop dialogue
  prs.a1.unit47.lesson05.reading:
    title: Reading about a barbershop visit
  prs.a1.unit47.lesson06.wrap_up:
    title: Wrap-up
teaching:
  prs.a1.unit47.lesson01.teach.review_this_is_in:
    title: "Review: this, is, in"
    gloss: this / is / in
    note: "این, است, and در (used throughout this course) are review words used to talk about the barbershop."
  prs.a1.unit47.lesson01.teach.barbershop_word:
    title: Barbershop
    gloss: barbershop
    note: "سلمانی is the everyday Kabul-urban word for a barbershop or hair salon."
    example_gloss: This is a barbershop.
  prs.a1.unit47.lesson01.teach.this_is_barbershop_phrase:
    title: This is a barbershop
    gloss: This is a barbershop.
    note: "این سلمانی است combines the words taught earlier in this lesson."
  prs.a1.unit47.lesson01.teach.barber_word:
    title: Barber
    gloss: barber
    note: "دلاک is the traditional Afghan Dari word for a barber."
    example_gloss: The barber is at the barbershop.
  prs.a1.unit47.lesson01.teach.barber_in_barbershop_phrase:
    title: The barber is at the barbershop
    gloss: The barber is at the barbershop.
    note: "دلاک در سلمانی است combines دلاک (barber) and سلمانی (barbershop)."
  prs.a1.unit47.lesson01.teach.review_appointment_want:
    title: "Review: appointment, I want"
    gloss: appointment / I want
    note: "قرار (from unit42) and می‌خواهم are review words used to ask for an appointment."
  prs.a1.unit47.lesson01.teach.want_appointment_phrase:
    title: I want an appointment
    gloss: I want an appointment.
    note: "قرار می‌خواهم combines قرار (appointment) and می‌خواهم (I want)."
  prs.a1.unit47.lesson02.teach.review_hair_short:
    title: "Review: hair, short"
    gloss: hair / short
    note: "مو, موی, and کوتاه (from unit27) are review words used to describe a hairstyle."
  prs.a1.unit47.lesson02.teach.review_want_want_polite:
    title: "Review: I want, you want (polite)"
    gloss: I want / you want (polite)
    note: "می‌خواهم and می‌خواهین (from earlier units) are review words used to ask for a style."
  prs.a1.unit47.lesson02.teach.shorter_word:
    title: Shorter
    gloss: shorter
    note: "کوتاه‌تر adds the same -تر comparative ending already used for بزرگ‌تر and کوچک‌تر (unit15) to کوتاه (short, unit27)."
    example_gloss: This is shorter.
  prs.a1.unit47.lesson02.teach.shorter_phrase:
    title: I want my hair shorter
    gloss: I want my hair shorter.
    note: "موی کوتاه‌تر می‌خواهم combines موی (hair) and کوتاه‌تر (shorter)."
  prs.a1.unit47.lesson02.teach.shorter_question_phrase:
    title: Do you want your hair shorter?
    gloss: Do you want your hair shorter?
    note: "موی کوتاه‌تر می‌خواهین؟ is a yes/no question formed by rising intonation, without a separate question word."
  prs.a1.unit47.lesson02.teach.review_no_word:
    title: "Review: no"
    gloss: "no"
    note: "نخیر (from earlier units) is a review word used to answer a style question."
  prs.a1.unit47.lesson02.teach.trim_word:
    title: Trim / haircut
    gloss: trim / haircut
    note: "اصلاح is the everyday Dari word for a trim or grooming, used as the thing you ask for."
    example_gloss: I want a trim.
  prs.a1.unit47.lesson02.teach.no_just_trim_phrase:
    title: "No, I just want a trim"
    gloss: "No, I just want a trim."
    note: "نخیر (from earlier units) answers the previous question and names what's actually wanted."
  prs.a1.unit47.lesson03.teach.review_trim_beard:
    title: "Review: trim, beard"
    gloss: trim / beard
    note: "اصلاح (from this unit) and ریش (from unit27) are review words used to ask for a beard trim."
  prs.a1.unit47.lesson03.teach.beard_trim_phrase:
    title: I want a beard trim
    gloss: I want a beard trim.
    note: "اصلاح ریش می‌خواهم combines اصلاح (trim) and ریش (beard)."
  prs.a1.unit47.lesson03.teach.shave_word:
    title: I shave
    gloss: I shave
    note: "می‌تراشم is the first-person present form of تراشیدن, \"to shave.\""
    example_gloss: I shave my beard.
  prs.a1.unit47.lesson03.teach.shave_beard_phrase:
    title: I shave my beard
    gloss: I shave my beard.
    note: "ریش می‌تراشم combines ریش (beard) and می‌تراشم (I shave)."
  prs.a1.unit47.lesson03.teach.review_which_want_polite:
    title: "Review: which, you want (polite)"
    gloss: which / you want (polite)
    note: "کدام (from unit14/unit43) and می‌خواهین (from earlier units) are review words used to ask what service a customer wants."
  prs.a1.unit47.lesson03.teach.which_service_phrase:
    title: Which service do you want?
    gloss: Which service do you want?
    note: "کدام اصلاح می‌خواهین؟ is the polite question a barber would ask."
  prs.a1.unit47.lesson04.teach.review_hello_trim_want:
    title: "Review: hello, trim, I want"
    gloss: hello / trim / I want
    note: "سلام, اصلاح, and می‌خواهم (from earlier units and this unit) are review words used to open the dialogue."
  prs.a1.unit47.lesson04.teach.review_hair_shorter_want_polite:
    title: "Review: hair shorter, you want (polite)"
    gloss: hair shorter / you want (polite)
    note: "موی کوتاه‌تر and می‌خواهین (from this unit) are review words used in the barber's question."
  prs.a1.unit47.lesson04.teach.review_yes_and_beard_too:
    title: "Review: yes, and, beard, also, do (polite)"
    gloss: yes / and / beard / also / do (polite)
    note: "بلی, و, ریش, هم, and کنین (from earlier units) are review words used to ask for the beard too."
  prs.a1.unit47.lesson04.teach.review_very_good_price_is:
    title: "Review: very good, its price, hundred, afghani, is"
    gloss: very good / its price / hundred / afghani / is
    note: "بسیار خوب, قیمتش, صد, and افغانی (from unit10/unit23) are review words used to state the price."
  prs.a1.unit47.lesson04.teach.review_thanks_welcome:
    title: "Review: thanks a lot, you're welcome"
    gloss: thanks a lot / you're welcome
    note: "تشکر زیاد and خواهش می‌کنم (from earlier units) are review words used to close the dialogue."
  prs.a1.unit47.lesson04.teach.dialogue_line1:
    title: "Homayoun: Hello. I want a trim."
    gloss: Hello. I want a trim.
  prs.a1.unit47.lesson04.teach.dialogue_line2:
    title: "Barber: Hello. Do you want your hair shorter?"
    gloss: Hello. Do you want your hair shorter?
  prs.a1.unit47.lesson04.teach.dialogue_line3:
    title: "Homayoun: Yes, and trim the beard too."
    gloss: Yes, and trim the beard too.
  prs.a1.unit47.lesson04.teach.dialogue_line4:
    title: "Barber: Very good. It's 100 afghanis."
    gloss: Very good. It's 100 afghanis.
  prs.a1.unit47.lesson04.teach.dialogue_line5:
    title: "Homayoun: Thanks a lot."
    gloss: Thanks a lot.
  prs.a1.unit47.lesson04.teach.dialogue_line6:
    title: "Barber: You're welcome."
    gloss: You're welcome.
  prs.a1.unit47.lesson05.teach.review_this_is_homayoun_in:
    title: "Review: this, is, Homayoun, in"
    gloss: this / is / Homayoun / in
    note: "این, است, همایون, and در (from earlier units) are review words used in the reading passage."
  prs.a1.unit47.lesson05.teach.review_hair_beard_trim_does_price:
    title: "Review: he/she, hair shorter, beard, trims, its price, 100 afghanis"
    gloss: he/she / hair shorter / beard / trims / its price / 100 afghanis
    note: "او, موی کوتاه‌تر, ریش, اصلاح می‌کند, قیمتش, صد, and افغانی (from this unit and earlier units) are review words used in the reading passage."
  prs.a1.unit47.lesson05.teach.wants_3rd_person_word:
    title: Wants
    gloss: wants
    note: "می‌خواهد is the third-person present form of the same verb already taught as می‌خواهم (I want) and می‌خواهین (you want, polite)."
    example_gloss: He/she wants medicine.
  prs.a1.unit47.lesson05.teach.reading_passage:
    title: Reading about a barbershop visit
    gloss: "Homayoun is at the barbershop. He wants his hair shorter. He also trims his beard. It's 100 afghanis."
  prs.a1.unit47.lesson06.teach.review_but_appointment_suffix:
    title: "Review: but, appointment, your appointment"
    gloss: but / appointment / your appointment
    note: "اما (from earlier units) and قرار (from unit42/this unit) are review words; قرارتان (your appointment) uses the same -تان suffix as نسخه‌تان and نمبر تلفن‌تان elsewhere in this course."
  prs.a1.unit47.lesson06.teach.review_haircut_beard_prices:
    title: "Review: haircut, beard trim, sixty, forty, afghani, is, what day"
    gloss: haircut / beard trim / sixty / forty / afghani / is / what day
    note: "اصلاح مو, اصلاح ریش, شصت, چهل, افغانی, است, چه, and روز (from this unit and earlier units) are review words used to close the unit."
  prs.a1.unit47.lesson06.teach.price_contrast_phrase:
    title: "A haircut is 60, but a beard trim is 40"
    gloss: A haircut is 60 afghanis, but a beard trim is 40 afghanis.
    note: "اما contrasts the two separate service prices."
  prs.a1.unit47.lesson06.teach.your_appointment_question_phrase:
    title: What day is your appointment?
    gloss: What day is your appointment?
    note: "The formal شما-تان-suffixed version of asking about an appointment."
