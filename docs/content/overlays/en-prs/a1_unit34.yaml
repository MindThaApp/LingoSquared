course:
  title: Dari A1
  description: "Beginner Kabul Dari: describe a neighborhood, nearby places, and a neighbor."
units:
  prs.a1.unit34.neighborhood:
    title: Neighborhood
    description: Talk about your neighborhood, say what is nearby, and describe a neighbor.
lessons:
  prs.a1.unit34.lesson01.neighborhood_words:
    title: Neighborhood words
  prs.a1.unit34.lesson02.near_and_far:
    title: Near and far
  prs.a1.unit34.lesson03.which_neighborhood:
    title: Which neighborhood?
  prs.a1.unit34.lesson04.neighborhood_dialogue:
    title: Neighborhood dialogue
  prs.a1.unit34.lesson05.reading_neighborhood:
    title: Reading about a neighborhood
  prs.a1.unit34.lesson06.wrap_up:
    title: Wrap-up
teaching:
  prs.a1.unit34.lesson01.teach.neighborhood_word:
    title: Neighborhood
    gloss: neighborhood
    note: محله means neighborhood or local area.
    example_gloss: My neighborhood is good.
  prs.a1.unit34.lesson01.teach.neighbor_word:
    title: Neighbor
    gloss: neighbor
    note: همسایه means neighbor.
    example_gloss: Our neighbor is good.
  prs.a1.unit34.lesson01.teach.street_word:
    title: Street
    gloss: street / road
    note: سرک is the everyday Afghan Dari word for a street or road.
    example_gloss: The street is near the house.
  prs.a1.unit34.lesson01.teach.shop_word:
    title: Shop
    gloss: shop / store
    note: دوکان is the everyday Afghan Dari word for a small shop or store.
    example_gloss: The shop is near.
  prs.a1.unit34.lesson01.teach.school_word:
    title: School
    gloss: school
    note: مکتب is the Afghan Dari word for school.
    example_gloss: The school is not far.
  prs.a1.unit34.lesson01.teach.review_good_house:
    title: "Review: house and good"
    gloss: my/I / our/we / house / good / is
    note: من, ما, خانه, خوب, and است are review words re-declared for this unit.
  prs.a1.unit34.lesson01.teach.my_neighborhood_phrase:
    title: My neighborhood is good
    gloss: My neighborhood is good.
    note: Combines محله with review words from earlier units.
  prs.a1.unit34.lesson02.teach.near_word:
    title: Near
    gloss: near
    note: نزدیک describes something close by.
    example_gloss: The shop is near the house.
  prs.a1.unit34.lesson02.teach.far_word:
    title: Far
    gloss: far
    note: دور describes something far away.
    example_gloss: The school is far.
  prs.a1.unit34.lesson02.teach.review_not_where:
    title: "Review: not and where"
    gloss: is not / where is it? / in or at
    note: نیست, کجاست, and در are review forms used to talk about nearby places.
  prs.a1.unit34.lesson02.teach.shop_near_house:
    title: The shop is near my house
    gloss: The shop is near my house.
    note: نزدیک comes before the place it describes as nearby.
  prs.a1.unit34.lesson02.teach.school_not_far:
    title: The school is not far
    gloss: The school is not far.
    note: دور نیست is the simple way to say something is not far.
  prs.a1.unit34.lesson02.teach.where_is_shop:
    title: Where is the shop?
    gloss: Where is the shop?
    note: کجاست means "where is it?"
  prs.a1.unit34.lesson02.teach.answer_shop_near:
    title: The shop is near
    gloss: The shop is near.
    note: A short answer using نزدیک.
  prs.a1.unit34.lesson03.teach.review_question_words:
    title: "Review: which and how"
    gloss: which / you (formal) / yes / how
    note: کدام, شما, بلی, and چطور are review words used in neighborhood questions.
  prs.a1.unit34.lesson03.teach.karte_naw:
    title: Karte Naw
    gloss: Karte Naw
    note: کارته نو is a real Kabul neighborhood name used here as an example place.
  prs.a1.unit34.lesson03.teach.which_neighborhood_question:
    title: Which neighborhood is your house in?
    gloss: Which neighborhood is your house in?
    note: A formal question using خانه شما.
  prs.a1.unit34.lesson03.teach.answer_karta_naw:
    title: My house is in Karte Naw
    gloss: My house is in Karte Naw.
    note: A simple answer naming a neighborhood.
  prs.a1.unit34.lesson03.teach.neighbor_how_question:
    title: How is your neighbor?
    gloss: How is your neighbor?
    note: چطور asks "how" someone or something is.
  prs.a1.unit34.lesson03.teach.neighbor_good_answer:
    title: Our neighbor is very good
    gloss: Our neighbor is very good.
    note: بسیار strengthens خوب.
  prs.a1.unit34.lesson04.teach.review_informal_you:
    title: Informal you and and
    gloss: you (informal) / your house / and
    note: تو marks informal address in this dialogue; و means and.
  prs.a1.unit34.lesson04.teach.dialogue_line1:
    title: "Farid: Laila, which neighborhood is your house in?"
    gloss: "Laila, which neighborhood is your house in?"
  prs.a1.unit34.lesson04.teach.dialogue_line2:
    title: "Laila: My house is in Karte Naw."
    gloss: "My house is in Karte Naw."
  prs.a1.unit34.lesson04.teach.dialogue_line3:
    title: "Farid: Is the shop near your house?"
    gloss: "Is the shop near your house?"
  prs.a1.unit34.lesson04.teach.dialogue_line4:
    title: "Laila: Yes, the shop is near and the school is not far."
    gloss: "Yes, the shop is near and the school is not far."
  prs.a1.unit34.lesson04.teach.dialogue_line5:
    title: "Farid: How is your neighbor?"
    gloss: "How is your neighbor?"
  prs.a1.unit34.lesson04.teach.dialogue_line6:
    title: "Laila: Our neighbor is very good."
    gloss: "Our neighbor is very good."
  prs.a1.unit34.lesson05.teach.review_he_she_every_day:
    title: He/she and every day
    gloss: he/she / every day / happy
    note: او is the Dari pronoun for he or she; هر روز and خوشحال are review.
  prs.a1.unit34.lesson05.teach.reading_passage:
    title: Reading about Laila's neighborhood
    gloss: "Laila is in Karte Naw. Her house is near the shop. The school is not far. Her neighbor is good. Laila is happy."
  prs.a1.unit34.lesson06.teach.review_like_but:
    title: I like / but
    gloss: I like / object marker / but / I do not have time
    note: دوست دارم, را, اما, وقت, and ندارم are review words used for the wrap-up message.
  prs.a1.unit34.lesson06.teach.wrap_summary:
    title: I like my neighborhood, but I do not have time
    gloss: "I like my neighborhood, but I do not have time."
    note: Continues the recent A1 wrap-up pattern with اما.
