course:
  title: Dari A2
  description: >-
    Lower-intermediate Afghan Dari: opening a basic bank account —
    vocabulary, requesting the account, reading a bank notice, and the
    bank-counter conversation itself.

units:
  prs.a2.unit11.banking:
    title: Opening a bank account

lessons:
  prs.a2.unit11.lesson01.banking_vocabulary: {title: "Words for the bank"}
  prs.a2.unit11.lesson02.requesting_an_account: {title: "Requesting an account"}
  prs.a2.unit11.lesson03.reading_a_bank_notice: {title: "Reading a bank notice"}
  prs.a2.unit11.lesson04.bank_counter_dialogue: {title: "At the bank counter"}

teaching:
  prs.a2.unit11.lesson01.teach.bank_word:
    title: "Bank"
    gloss: "bank"
    note: "*بانک* is the everyday word for a bank."
    example_gloss: "The bank is close to Homayoun's house."
  prs.a2.unit11.lesson01.teach.account_word:
    title: "Bank account"
    gloss: "bank account"
    note: "*حساب بانکی* -- *حساب* alone means 'account' in general contexts too."
    example_gloss: "Homayoun wants a bank account."
  prs.a2.unit11.lesson01.teach.card_word:
    title: "Bank card"
    gloss: "bank card"
    note: "*کارت بانکی* -- *کارت* alone is the general word for 'card'."
    example_gloss: "I lost my bank card."
  prs.a2.unit11.lesson01.teach.pin_word:
    title: "PIN code"
    gloss: "PIN code / password"
    note: "*رمز* covers both a bank PIN and a general password."
    example_gloss: "I forgot my bank card's PIN."
  prs.a2.unit11.lesson01.teach.balance_word:
    title: "Balance"
    gloss: "balance"
    note: "*موجودی* is the amount of money currently in an account."
    example_gloss: "My account balance is low."
  prs.a2.unit11.lesson01.teach.signature_word:
    title: "Signature"
    gloss: "signature"
    note: "*امضا* means both the act of signing and the signature itself."
    example_gloss: "Please sign here."
  prs.a2.unit11.lesson01.teach.if_grammar:
    title: "If, with اگر"
    gloss: "If you have your national ID booklet, you can open an account."
    note: "*اگر* introduces a conditional clause -- this unit's A2-level grammar step, a new subordinate-clause type beyond unit09's *چون* (because)."
  prs.a2.unit11.lesson01.teach.open_account_word:
    title: "Open an account"
    gloss: "opening an account"
    note: "*باز کردن حساب* -- *باز کردن* means 'to open'."
  prs.a2.unit11.lesson01.teach.va_word:
    title: "And"
    gloss: "and"
    note: "*و* is the common connecting word used throughout this unit."

  prs.a2.unit11.lesson02.teach.request_account:
    title: "Ask to open an account"
    gloss: "I'd like to open a bank account."
    note: "Reuses the already-established *می‌خواستم* softened-request pattern."
  prs.a2.unit11.lesson02.teach.if_documents:
    title: "State the requirement, with اگر"
    gloss: "If you have your national ID booklet and a rent receipt, you can open an account."
    note: "*اگر ... داشته باشین* -- 'if you have...' -- combines this unit's new conditional with the already-established *رسید کرایه خانه* (rent receipt) from unit09."
  prs.a2.unit11.lesson02.teach.card_ready_timeline:
    title: "Say when the card will be ready"
    gloss: "Your bank card will be ready within three days."
    note: "*تا سه روز دیگر* means 'within three more days'."

  prs.a2.unit11.lesson03.teach.fee_word:
    title: "Fee"
    gloss: "fee"
    note: "*کارمزد* is a service or transaction fee."
    example_gloss: "This account has no fee."
  prs.a2.unit11.lesson03.teach.minimum_word:
    title: "Minimum"
    gloss: "minimum"
    note: "*حداقل* means 'minimum' or 'at least'."
    example_gloss: "The minimum account balance is 500 afghanis."
  prs.a2.unit11.lesson03.teach.notice_text:
    title: "A bank notice about opening an account"
    gloss: "To open an account, please bring your national ID booklet and a rent receipt. The minimum account balance is 500 afghanis. There is no monthly fee."
    note: "A short official bank notice, in the formal written register this unit is teaching."

  prs.a2.unit11.lesson04.teach.turn01:
    title: "The clerk greets همایون"
    gloss: "The clerk invites him in and asks what service they can do for him."
    note: "Reuses the same formal greeting an office clerk uses in unit09."
  prs.a2.unit11.lesson04.teach.turn02:
    title: "همایون asks to open an account"
    gloss: "همایون says he'd like to open a bank account."
    note: "Reuses lesson02's *می‌خواستم* request pattern."
  prs.a2.unit11.lesson04.teach.turn03:
    title: "The clerk asks for documents"
    gloss: "The clerk asks if he has his national ID booklet and a rent receipt."
    note: "*دارین؟* -- 'do you have?' -- the formal-plural question form."
  prs.a2.unit11.lesson04.teach.turn04:
    title: "همایون confirms he has them"
    gloss: "Yes, here is his national ID booklet and rent receipt."
    note: "*اینه* is a casual 'here it is' used when handing something over."
  prs.a2.unit11.lesson04.teach.turn05:
    title: "The clerk confirms and gives the timeline"
    gloss: "Good. His bank card will be ready within three days."
    note: "Reuses lesson02's *تا سه روز دیگر آماده می‌شود* exactly, since it's the same real fact."
  prs.a2.unit11.lesson04.teach.turn06:
    title: "همایون asks about the PIN"
    gloss: "He asks when he'll get the PIN."
    note: "*رمزش* -- 'its PIN' -- attaches the possessive suffix *-ش* to *رمز*."
  prs.a2.unit11.lesson04.teach.turn07:
    title: "The clerk answers"
    gloss: "The clerk says the same day he picks up the card."
    note: "*همان روزی که ...* means 'the same day that ...'."
  prs.a2.unit11.lesson04.teach.turn08:
    title: "همایون thanks the clerk"
    gloss: "همایون thanks the clerk for their time."
    note: "Reuses the same closing line as unit09's office visit."

exercises:
  prs.a2.unit11.lesson01.exercise01.recognize_bank:
    instruction: "What does this word mean?"
    correct_option: "bank"
    distractors: ["account", "card", "signature"]
    accepted_answers: [{value: "bank", status: correct}]
    feedback: "*بانک* means bank."
  prs.a2.unit11.lesson01.exercise02.recognize_pin:
    instruction: "What does this word mean?"
    correct_option: "PIN code"
    distractors: ["balance", "signature", "bank account"]
    accepted_answers: [{value: "PIN code", status: correct}]
    feedback: "*رمز* means PIN code or password."
  prs.a2.unit11.lesson01.exercise03.match_banking_words:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - {value: {بانک: bank, "حساب بانکی": "bank account", "کارت بانکی": "bank card", رمز: "PIN code", موجودی: balance, امضا: signature}, status: correct}
    feedback: "These six words cover the basic vocabulary for this unit's bank visit."
  prs.a2.unit11.lesson01.exercise04.order_card_and_pin:
    instruction: "Arrange the words to say bank card and PIN."
    accepted_answers: [{value: ["کارت", بانکی, و, رمز], status: correct}]
    feedback: "*کارت بانکی و رمز* joins the two words with *و*."
  prs.a2.unit11.lesson01.exercise05.write_signature:
    instruction: "Write the Dari word for signature."
    accepted_answers:
      - {value: امضا, status: correct}
    feedback: "*امضا* means signature."

  prs.a2.unit11.lesson02.exercise01.recognize_request_account:
    instruction: "Which phrase politely asks to open a bank account?"
    correct_option: "I'd like to open a bank account."
    distractors: ["If you have your national ID booklet and a rent receipt, you can open an account.", "Your bank card will be ready within three days.", "The minimum account balance is 500 afghanis."]
    accepted_answers: [{value: "I'd like to open a bank account.", status: correct}]
    feedback: "*می‌خواستم یک حساب بانکی باز کنم.* softly requests the account."
  prs.a2.unit11.lesson02.exercise02.order_card_ready_timeline:
    instruction: "Arrange the words to say the card will be ready within three days."
    accepted_answers: [{value: ["کارت", "بانکی‌تان", تا, سه, روز, دیگر, آماده, "می‌شود"], status: correct}]
    feedback: "*کارت بانکی‌تان تا سه روز دیگر آماده می‌شود.* states the timeline."
  prs.a2.unit11.lesson02.exercise03.dialogue_response_why_here:
    instruction: "The clerk asks: 'What service can I do for you?' Answer that you'd like to open a bank account."
    accepted_answers:
      - {value: "می‌خواستم یک حساب بانکی باز کنم.", status: correct}
      - {value: "می‌خواستم یک حساب بانکی باز کنم", status: correct}
    feedback: "*می‌خواستم یک حساب بانکی باز کنم.* is the polite request."
  prs.a2.unit11.lesson02.exercise04.translate_open_account:
    instruction: "Translate: I'd like to open a bank account."
    accepted_answers:
      - {value: "می‌خواستم یک حساب بانکی باز کنم.", status: correct}
      - {value: "می‌خواستم یک حساب بانکی باز کنم", status: correct}
    feedback: "*می‌خواستم یک حساب بانکی باز کنم.* is the polite request."
  prs.a2.unit11.lesson02.exercise05.write_if_documents:
    instruction: "Write that if you have your national ID booklet and a rent receipt, you can open an account."
    accepted_answers:
      - {value: "اگر تذکره و رسید کرایه خانه داشته باشین، می‌توانین حساب باز کنین.", status: correct}
      - {value: "اگر تذکره و رسید کرایه خانه داشته باشین. می‌توانین حساب باز کنین.", status: correct}
      - {value: "اگر تذکره و رسید کرایه خانه داشته باشین و می‌توانین حساب باز کنین", status: correct}
    feedback: "Joining the condition and result with a comma, a period, or *و* are equally natural."

  prs.a2.unit11.lesson03.exercise01.read_required_documents:
    instruction: "According to the notice, what documents do you need to open an account?"
    correct_option: "national ID booklet and a rent receipt"
    distractors: ["a rent receipt only", "a passport and a photo", "nothing, just your name"]
    accepted_answers: [{value: "national ID booklet and a rent receipt", status: correct}]
    feedback: "The notice asks for your *تذکره* and a *رسید کرایه خانه*."
  prs.a2.unit11.lesson03.exercise02.read_minimum_balance:
    instruction: "According to the notice, what is the minimum account balance?"
    correct_option: "500 afghanis"
    distractors: ["1000 afghanis", "50 afghanis", "there is no minimum"]
    accepted_answers: [{value: "500 afghanis", status: correct}]
    feedback: "*حداقل موجودی حساب پنجصد افغانی است* -- the minimum balance is 500 afghanis."
  prs.a2.unit11.lesson03.exercise03.recognize_fee_word:
    instruction: "What does this word mean?"
    correct_option: "fee"
    distractors: ["minimum", "balance", "signature"]
    accepted_answers: [{value: "fee", status: correct}]
    feedback: "*کارمزد* means fee."
  prs.a2.unit11.lesson03.exercise04.order_minimum_balance:
    instruction: "Arrange the words to say the minimum account balance is 500 afghanis."
    accepted_answers: [{value: [حداقل, موجودی, حساب, پنجصد, افغانی, است], status: correct}]
    feedback: "*حداقل موجودی حساب پنجصد افغانی است* states the minimum balance, matching the notice exactly."
  prs.a2.unit11.lesson03.exercise05.write_no_fee:
    instruction: "Write that there is no monthly fee."
    accepted_answers:
      - {value: "کارمزد ماهانه نیست.", status: correct}
      - {value: "کارمزد ماهانه نیست", status: correct}
    feedback: "*کارمزد ماهانه نیست.* says there's no monthly fee."

  prs.a2.unit11.lesson04.exercise01.comprehend_required_documents:
    instruction: "What does the clerk ask همایون for?"
    correct_option: "his national ID booklet and a rent receipt"
    distractors: ["a passport only", "a lease agreement only", "nothing at all"]
    accepted_answers: [{value: "his national ID booklet and a rent receipt", status: correct}]
    feedback: "*تذکره و یک رسید کرایه خانه دارین؟* -- the clerk asks for both documents."
  prs.a2.unit11.lesson04.exercise02.comprehend_card_ready:
    instruction: "When will همایون's bank card be ready?"
    correct_option: "within three days"
    distractors: ["within one day", "within a week", "within a month"]
    accepted_answers: [{value: "within three days", status: correct}]
    feedback: "*کارت بانکی‌تان تا سه روز دیگر آماده می‌شود* -- within three days."
  prs.a2.unit11.lesson04.exercise03.recognize_pin_timing:
    instruction: "When will همایون get his PIN?"
    correct_option: "the same day he picks up the card"
    distractors: ["the day he opens the account", "one week after the card is ready", "he must call to ask"]
    accepted_answers: [{value: "the same day he picks up the card", status: correct}]
    feedback: "*همان روزی که کارت را تحویل می‌گیرین* -- the same day you pick up the card."
  prs.a2.unit11.lesson04.exercise04.order_documents_question:
    instruction: "Arrange the words to ask if someone has their national ID booklet and a rent receipt."
    accepted_answers: [{value: [تذکره, و, یک, رسید, کرایه, خانه, دارین], status: correct}]
    feedback: "*تذکره و یک رسید کرایه خانه دارین؟* asks for both documents."
  prs.a2.unit11.lesson04.exercise05.dialogue_response_as_homayoun:
    instruction: "The clerk asks: 'What service can I do for you?' Answer as همایون."
    accepted_answers:
      - {value: "می‌خواستم یک حساب بانکی باز کنم.", status: correct}
      - {value: "می‌خواستم یک حساب بانکی باز کنم", status: correct}
    feedback: "*می‌خواستم یک حساب بانکی باز کنم.* is همایون's request."
  prs.a2.unit11.lesson04.exercise06.write_pin_summary:
    instruction: "Write, quoting the clerk, when the PIN is given."
    accepted_answers:
      - {value: "رمزش را همان روزی که کارت را تحویل می‌گیرین می‌گیرم.", status: correct}
      - {value: "رمزش را همان روزی که کارت را تحویل می‌گیرین می‌گیرم", status: correct}
    feedback: "*همان روزی که کارت را تحویل می‌گیرین* is the clerk's own answer, restated as a full sentence."
