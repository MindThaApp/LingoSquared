course:
  title: Dari A2
  description: >-
    Lower-intermediate Afghan Dari: a basic job interview — vocabulary,
    describing experience and availability, reading a job posting, and
    the interview itself.

units:
  prs.a2.unit14.job_interview:
    title: Job interview

lessons:
  prs.a2.unit14.lesson01.interview_vocabulary: {title: "Words for a job interview"}
  prs.a2.unit14.lesson02.describing_experience_and_availability: {title: "Describing experience and availability"}
  prs.a2.unit14.lesson03.reading_a_job_posting: {title: "Reading a job posting"}
  prs.a2.unit14.lesson04.interview_dialogue: {title: "The interview"}

teaching:
  prs.a2.unit14.lesson01.teach.experience_word:
    title: "Experience"
    gloss: "experience"
    note: "*تجربه* is the general word for work experience."
    example_gloss: "لیمه has three years of experience."
  prs.a2.unit14.lesson01.teach.skill_word:
    title: "Skill"
    gloss: "skill"
    note: "*مهارت* is a skill or ability."
    example_gloss: "Computer skill is important."
  prs.a2.unit14.lesson01.teach.salary_word:
    title: "Salary"
    gloss: "salary"
    note: "*حقوق* means salary or wages."
    example_gloss: "The salary for this position is 30,000 afghanis."
  prs.a2.unit14.lesson01.teach.position_word:
    title: "Position / job"
    gloss: "position / job"
    note: "*وظیفه* is a general word for a job or position, distinct from the more formal *بست* (an official vacancy)."
    example_gloss: "This position is in an office."
  prs.a2.unit14.lesson01.teach.resume_word:
    title: "Resume / CV"
    gloss: "resume / CV"
    note: "*رزومه* is a borrowed word (from 'resume'), used the same way in Afghanistan."
    example_gloss: "I sent my resume to the interviewer."
  prs.a2.unit14.lesson01.teach.interview_word:
    title: "Interview"
    gloss: "interview"
    note: "*مصاحبه* is a job interview."
    example_gloss: "لیمه's interview is tomorrow."
  prs.a2.unit14.lesson01.teach.how_many_years_grammar:
    title: "How many years, with چند سال"
    gloss: "How many years of experience do you have?"
    note: "*چند سال...؟* -- this unit's A2-level quantity-question pattern for asking about years of experience."

  prs.a2.unit14.lesson02.teach.three_years_experience:
    title: "State your years of experience"
    gloss: "I have three years of experience in this position."
    note: "*در این وظیفه* means 'in this position'."
  prs.a2.unit14.lesson02.teach.can_start_next_week:
    title: "Say when you can start"
    gloss: "I can start from next week."
    note: "*از هفتهٔ آینده* means 'from next week'; reuses the already-established *می‌توانم* (I can)."
  prs.a2.unit14.lesson02.teach.ask_salary:
    title: "Ask about the salary"
    gloss: "What is the salary for this position?"
    note: "*چقدر؟* asks 'how much?'."

  prs.a2.unit14.lesson03.teach.vacancy_word:
    title: "Vacancy / official position"
    gloss: "vacancy / official position"
    note: "*بست* is the authentic Afghan term used in real job postings for an official vacancy, more formal than *وظیفه*."
    example_gloss: "This vacancy is in an office."
  prs.a2.unit14.lesson03.teach.requirements_word:
    title: "Requirements"
    gloss: "requirements"
    note: "*شرایط* lists the requirements or conditions for a position."
    example_gloss: "The requirements for this vacancy are computer skill."
  prs.a2.unit14.lesson03.teach.notice_text:
    title: "A job posting"
    gloss: "For this position, at least two years of experience is required. Requirements: computer skill and English. Salary: 30,000 afghanis per month."
    note: "A short formal job posting, in the register this unit is teaching."

  prs.a2.unit14.lesson04.teach.turn01:
    title: "The interviewer welcomes لیمه"
    gloss: "The interviewer welcomes her and asks her to talk about her experience."
    note: "*خوش آمدین* is a formal 'welcome'."
  prs.a2.unit14.lesson04.teach.turn02:
    title: "لیمه states her experience"
    gloss: "She says she has three years of experience in this position."
    note: "Reuses lesson02's exact phrase."
  prs.a2.unit14.lesson04.teach.turn03:
    title: "The interviewer asks about skills"
    gloss: "The interviewer asks what her skills are."
    note: "*مهارت‌های شما چیست؟* -- 'what are your skills?'."
  prs.a2.unit14.lesson04.teach.turn04:
    title: "لیمه lists her skills"
    gloss: "She has computer skill and English."
    note: "Lists two skills joined with *و*."
  prs.a2.unit14.lesson04.teach.turn05:
    title: "The interviewer asks about start date"
    gloss: "The interviewer asks when she can start."
    note: "*از کی می‌توانین شروع کنین؟* -- 'when can you start?'."
  prs.a2.unit14.lesson04.teach.turn06:
    title: "لیمه answers and asks about salary"
    gloss: "She can start from next week, and asks what the salary is for this position."
    note: "Combines lesson02's start-date phrase with the salary question."
  prs.a2.unit14.lesson04.teach.turn07:
    title: "The interviewer states the salary"
    gloss: "The interviewer says 30,000 afghanis per month."
    note: "Matches lesson03's posted job listing exactly, the same posting."

exercises:
  prs.a2.unit14.lesson01.exercise01.recognize_experience:
    instruction: "What does this word mean?"
    correct_option: "experience"
    distractors: ["skill", "salary", "resume"]
    accepted_answers: [{value: "experience", status: correct}]
    feedback: "*تجربه* means experience."
  prs.a2.unit14.lesson01.exercise02.recognize_skill:
    instruction: "What does this word mean?"
    correct_option: "skill"
    distractors: ["experience", "position", "interview"]
    accepted_answers: [{value: "skill", status: correct}]
    feedback: "*مهارت* means skill."
  prs.a2.unit14.lesson01.exercise03.match_interview_words:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - {value: {تجربه: experience, مهارت: skill, حقوق: salary, وظیفه: position, رزومه: resume, مصاحبه: interview}, status: correct}
    feedback: "These six words cover the basic vocabulary for this unit's job interview."
  prs.a2.unit14.lesson01.exercise04.order_how_many_years:
    instruction: "Arrange the words to ask how many years of experience someone has."
    accepted_answers: [{value: [چند, سال, تجربه, دارین], status: correct}]
    feedback: "*چند سال تجربه دارین؟* asks how many years of experience."
  prs.a2.unit14.lesson01.exercise05.write_resume:
    instruction: "Write the Dari word for resume."
    accepted_answers:
      - {value: رزومه, status: correct}
    feedback: "*رزومه* means resume."

  prs.a2.unit14.lesson02.exercise01.recognize_three_years_experience:
    instruction: "Which sentence states three years of experience in this position?"
    correct_option: "I have three years of experience in this position."
    distractors: ["I can start from next week.", "What is the salary for this position?", "This vacancy is in an office."]
    accepted_answers: [{value: "I have three years of experience in this position.", status: correct}]
    feedback: "*من سه سال تجربه در این وظیفه دارم.* states the experience."
  prs.a2.unit14.lesson02.exercise02.order_can_start_next_week:
    instruction: "Arrange the words to say you can start from next week."
    accepted_answers: [{value: [از, "هفتهٔ", آینده, می‌توانم, شروع, کنم], status: correct}]
    feedback: "*از هفتهٔ آینده می‌توانم شروع کنم.* states the availability."
  prs.a2.unit14.lesson02.exercise03.dialogue_response_years_experience:
    instruction: "The interviewer asks: 'How many years of experience do you have?' Answer with your experience."
    accepted_answers:
      - {value: "من سه سال تجربه در این وظیفه دارم.", status: correct}
      - {value: "من سه سال تجربه در این وظیفه دارم", status: correct}
    feedback: "*من سه سال تجربه در این وظیفه دارم.* states three years of experience."
  prs.a2.unit14.lesson02.exercise04.translate_ask_salary:
    instruction: "Translate: What is the salary for this position?"
    accepted_answers:
      - {value: "حقوق این وظیفه چقدر است؟", status: correct}
      - {value: "حقوق این وظیفه چقدر است", status: correct}
    feedback: "*حقوق این وظیفه چقدر است؟* asks about the salary."
  prs.a2.unit14.lesson02.exercise05.write_can_start_next_week:
    instruction: "Write that you can start from next week."
    accepted_answers:
      - {value: "از هفتهٔ آینده می‌توانم شروع کنم.", status: correct}
      - {value: "از هفتهٔ آینده می‌توانم شروع کنم", status: correct}
    feedback: "*از هفتهٔ آینده می‌توانم شروع کنم.* states the availability."

  prs.a2.unit14.lesson03.exercise01.read_min_experience:
    instruction: "According to the posting, how much experience is required?"
    correct_option: "at least two years"
    distractors: ["at least one year", "at least three years", "no experience required"]
    accepted_answers: [{value: "at least two years", status: correct}]
    feedback: "*حداقل دو سال تجربه لازم است* -- at least two years."
  prs.a2.unit14.lesson03.exercise02.read_required_skills:
    instruction: "According to the posting, what are the requirements?"
    correct_option: "computer skill and English"
    distractors: ["driving and cooking", "computer skill only", "English only"]
    accepted_answers: [{value: "computer skill and English", status: correct}]
    feedback: "*شرایط: مهارت کمپیوتر و زبان انگلیسی* -- computer skill and English."
  prs.a2.unit14.lesson03.exercise03.recognize_vacancy_word:
    instruction: "What does this word mean?"
    correct_option: "vacancy / official position"
    distractors: ["requirements", "salary", "resume"]
    accepted_answers: [{value: "vacancy / official position", status: correct}]
    feedback: "*بست* means an official job vacancy."
  prs.a2.unit14.lesson03.exercise04.order_salary:
    instruction: "Arrange the words to say the salary is 30,000 afghanis per month."
    accepted_answers: [{value: [حقوق, "سی‌هزار", افغانی, در, ماه, است], status: correct}]
    feedback: "*حقوق سی‌هزار افغانی در ماه است* matches the posting exactly."
  prs.a2.unit14.lesson03.exercise05.write_requirements:
    instruction: "Write that the requirements are computer skill and English."
    accepted_answers:
      - {value: "شرایط مهارت کمپیوتر و زبان انگلیسی است.", status: correct}
      - {value: "شرایط مهارت کمپیوتر و زبان انگلیسی است", status: correct}
    feedback: "*شرایط مهارت کمپیوتر و زبان انگلیسی است.* states the requirements."

  prs.a2.unit14.lesson04.exercise01.comprehend_years_experience:
    instruction: "How many years of experience does لیمه have?"
    correct_option: "three years"
    distractors: ["two years", "one year", "five years"]
    accepted_answers: [{value: "three years", status: correct}]
    feedback: "*سه سال تجربه* -- three years of experience."
  prs.a2.unit14.lesson04.exercise02.comprehend_start_date:
    instruction: "When can لیمه start?"
    correct_option: "from next week"
    distractors: ["immediately", "next month", "in two weeks"]
    accepted_answers: [{value: "from next week", status: correct}]
    feedback: "*از هفتهٔ آینده* -- from next week."
  prs.a2.unit14.lesson04.exercise03.recognize_salary_amount:
    instruction: "What salary does the interviewer state?"
    correct_option: "30,000 afghanis per month"
    distractors: ["20,000 afghanis per month", "30,000 afghanis per week", "40,000 afghanis per month"]
    accepted_answers: [{value: "30,000 afghanis per month", status: correct}]
    feedback: "*سی‌هزار افغانی در ماه است* -- 30,000 afghanis per month."
  prs.a2.unit14.lesson04.exercise04.order_skills_question:
    instruction: "Arrange the words to ask what someone's skills are."
    accepted_answers: [{value: ["مهارت‌های", شما, چیست], status: correct}]
    feedback: "*مهارت‌های شما چیست؟* asks about skills."
  prs.a2.unit14.lesson04.exercise05.dialogue_response_as_lima:
    instruction: "The interviewer asks: 'What are your skills?' Answer as لیمه."
    accepted_answers:
      - {value: "مهارت کمپیوتر و زبان انگلیسی دارم.", status: correct}
      - {value: "مهارت کمپیوتر و زبان انگلیسی دارم", status: correct}
    feedback: "*مهارت کمپیوتر و زبان انگلیسی دارم.* lists لیمه's skills."
  prs.a2.unit14.lesson04.exercise06.write_salary_summary:
    instruction: "Write, quoting the interviewer, what the salary is."
    accepted_answers:
      - {value: "سی‌هزار افغانی در ماه است.", status: correct}
      - {value: "سی‌هزار افغانی در ماه است", status: correct}
    feedback: "*سی‌هزار افغانی در ماه است.* is the interviewer's own answer, quoted directly."
