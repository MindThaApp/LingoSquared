teaching:
  prs.a2.unit21.lesson01.teach.tghr_dadn_lghw:
    title: Changing an appointment
    gloss: to move (an appointment) / to cancel
    note: '*قرار را تغییر دادن* means to move it to another time. *لغو کردن* means to cancel it completely.'
    example_gloss:
    - I want to move my appointment.
    - I have to cancel my appointment.
  prs.a2.unit21.lesson01.teach.mtasfanh_bbkhshn:
    title: Saying you are sorry
    gloss: unfortunately / sorry
    note: '*متأسفانه* is a polite way to give bad news. *ببخشین* is the everyday apology.'
    example_gloss:
    - Unfortunately I cannot come.
    - Sorry, I am too late.
  prs.a2.unit21.lesson01.teach.slman:
    title: The hairdresser's
    gloss: the hairdresser's (salon)
    note: '*سلمانی* is the barber''s shop, the place. *دلاک* is the traditional word for the barber himself.'
    example_gloss: The salon is open from nine to six.
  prs.a2.unit21.lesson01.teach.mtwanm_qrarm_ra:
    title: Asking to move an appointment
    gloss: Can I move my appointment?
    note: 'A yes/no question keeps the statement word order and only the tone rises: *می‌توانم قرارم را تغییر بدهم؟* The second verb, *تغییر بدهم*, goes at the end.'
  prs.a2.unit21.lesson01.teach.mn_mtasfanh_nmtwanm:
    title: Saying you cannot come
    gloss: Unfortunately I cannot come.
  prs.a2.unit21.lesson01.teach.njshnbh_nmtwanm_bam:
    title: می‌توانم + subjunctive
    gloss: I cannot come on Thursday. Can I move the appointment?
    note: 'After *می‌توانم* (I can) the second verb is in the subjunctive and stands at the end: *می‌توانم بیایم*. For *cannot* the *ن* goes onto the helper: *نمی‌توانم بیایم*. A day word comes first: *پنجشنبه نمی‌توانم بیایم*. A question has the same word order; only the tone rises: *می‌توانم قرار را تغییر بدهم؟*'
  prs.a2.unit21.lesson02.teach.rwz_dr:
    title: Another day
    gloss: another day
    note: '*دیگر* means other or another and follows the noun: *یک روز دیگر* is another day.'
    example_gloss: Can it also be on another day?
  prs.a2.unit21.lesson02.teach.dwshnbh_hm_mmn:
    title: Suggesting a day
    gloss: Can it also be Monday?
    note: 'No preposition is needed before a weekday: *دوشنبه هم ممکن است؟* *هم* means also and follows the day.'
  prs.a2.unit21.lesson02.teach.jmah_bra_shma:
    title: Does it suit you?
    gloss: Does Friday suit you? (formal)
    note: '*مناسب* means suitable. *برای شما مناسب است* is the polite way to ask whether a time suits someone you do not know well. *برایم* is *برای من* (for me) in short form.'
  prs.a2.unit21.lesson02.teach.bl_bram_mnasb:
    title: Saying yes
    gloss: Yes, that suits me well.
  prs.a2.unit21.lesson02.teach.mtasfanh_nh:
    title: Saying no politely
    gloss: Unfortunately not.
  prs.a2.unit21.lesson02.teach.jmah_bra_shma_2:
    title: Does it suit you?
    gloss: Does Friday suit you? Yes, that suits me well. No, unfortunately not.
    note: To ask whether a time suits someone, use *برای شما مناسب است؟*, with the polite *شما*. Answer *بلی، برایم مناسب است* to confirm, or *متأسفانه نه* to refuse politely. *برای* plus a pronoun ending (*برایم*, *برایتان*) means for me, for you.
  prs.a2.unit21.lesson03.teach.wn_mtasfm:
    title: Because and I am sorry
    gloss: because / I am sorry
    note: '*چون* joins two full sentences and gives the reason. *متأسفم* is a more careful apology than *ببخشین*.'
    example_gloss:
    - I cannot come, because I am ill.
    - I am sorry.
  prs.a2.unit21.lesson03.teach.zhmt:
    title: Inconvenience
    gloss: the inconvenience
    note: '*بابت زحمت ببخشین* is a polite phrase after you have caused someone extra trouble. *زحمت* means trouble or effort.'
    example_gloss: Sorry for the inconvenience.
  prs.a2.unit21.lesson03.teach.nmtwanm_bam_wn:
    title: 'Reason: work'
    gloss: I cannot come, because I have to work.
  prs.a2.unit21.lesson03.teach.nmtwanm_bam_wn_2:
    title: 'Reason: another appointment'
    gloss: I cannot come, because I have another appointment.
  prs.a2.unit21.lesson03.teach.nmtwanm_bam_wn_3:
    title: 'Because: want'
    gloss: I cannot come, because I am ill.
    note: 'After *چون* the sentence is an ordinary one, with its verb at the end. Put a comma before it: *نمی‌توانم بیایم، چون مریض استم.* The form *استم* is the *I* form of *است*.'
  prs.a2.unit21.lesson04.teach.qrar_dhashtn_az:
    title: Agreeing and in advance
    gloss: to arrange / in advance
    note: '*قرار گذاشتن* is to agree on a time or place together. *از قبل* means beforehand, in advance.'
    example_gloss:
    - Shall we arrange something?
    - Call a day in advance.
  prs.a2.unit21.lesson04.teach.dwshnbh_saat_dh:
    title: Accepting a time
    gloss: Monday at ten o'clock is fine.
  prs.a2.unit21.lesson04.teach.dwshnbh_saat_dh_2:
    title: Asking if a time works
    gloss: Can you come on Monday at ten o'clock? (formal)
    note: '*می‌توانین* is the polite *you* form of *می‌توانی*; the plural ending *-ین* goes with *شما*. The second verb, *بیایین*, is at the end.'
  prs.a2.unit21.lesson04.teach.s_shma_ra:
    title: Closing the arrangement
    gloss: Then I will see you on Monday.
  prs.a2.unit21.lesson04.teach.s_qrar_jdd:
    title: Making a new appointment
    gloss: Then I will make a new appointment.
  prs.a2.unit21.lesson04.teach.dwshnbh_saat_dh_3:
    title: Day first, then time
    gloss: Monday at ten o'clock is fine. Can you come on Monday at ten o'clock?
    note: 'When you give a day and a time, the day comes first, then *ساعت* + the number: *دوشنبه ساعت ده*. In a polite question use *می‌توانین ...؟* and put the verb at the end.'
  prs.a2.unit21.lesson05.teach.hmawn_azz_qrartan:
    title: A message from the salon
    gloss: Dear Homayoun, your appointment has been moved. Your new appointment is Monday at ten o'clock. Does this not suit you? Then call us a day in advance. Then we will make a new appointment. See you Monday! Ariana barbershop
    note: This is a typical short message from a business, so it uses the polite *-تان* ending (*قرارتان*, *برایتان*). *تغییر داده شد* means was moved.
    glosses:
      عزیز: dear
      همایون: Homayoun
      قرارتان: your (formal)
      قرار: appointment
      تغییر: moved
      جدیدتان: new
      دوشنبه: Monday
      ده: ten
      ساعت: o'clock
      مناسب: suitable
      این: this
      نیست: not
      برایتان: for you (formal)
      تماس: call
      با: with us (با ما)
      پس: then
      قبل: in advance
      می‌گذاریم: make
      ما: we
      تا: until, see you
      سلمانی: hairdresser's
      آریانا: Ariana
  prs.a2.unit21.lesson06.teach.slman_arana_rwz:
    title: The salon answers
    gloss: 'Barber: Ariana barbershop, good afternoon.'
  prs.a2.unit21.lesson06.teach.rwz_bkhr_hmawn:
    title: Homayoun explains and asks
    gloss: 'Homayoun: Good afternoon, you are speaking to Homayoun. I have an appointment on Thursday, but unfortunately I cannot come. Can I move the appointment?'
  prs.a2.unit21.lesson06.teach.albth_jmah_bra:
    title: The hairdresser suggests Friday
    gloss: 'Hairdresser: Of course. Does Friday suit you?'
  prs.a2.unit21.lesson06.teach.mtasfanh_nh_wn:
    title: Homayoun suggests Monday
    gloss: 'Homayoun: Unfortunately not, because I have to work. Can it also be Monday?'
  prs.a2.unit21.lesson06.teach.dwshnbh_saat_dh:
    title: The hairdresser agrees
    gloss: 'Hairdresser: Monday at ten o''clock is fine.'
  prs.a2.unit21.lesson06.teach.bram_mnasb_ast:
    title: Homayoun accepts and apologises
    gloss: 'Homayoun: That suits me well. Thank you very much and sorry for the inconvenience.'
  prs.a2.unit21.lesson06.teach.mshl_nst_ta:
    title: The hairdresser closes
    gloss: 'Hairdresser: No problem. See you Monday!'
