  notes: "Authored alongside the new prs a1_unit18_work.yaml realization. Follows the established en-prs overlay convention from units 01-17 (English instruction/correct_option/distractors/feedback, target-language Dari accepted_answers, English glosses for recognize_* multiple_choice items). The three multi-clause production exercises (write_work_profile in lesson05, dialogue_response_own_job and write_dialogue_summary in lesson06) carry period-joined, comma-joined, and و-joined accepted_answers variants at EVERY clause boundary, not just the first -- applying from the start the exact §12 gap unit17's fresh-context review found and required fixing after the fact, rather than needing the same retrofit again. FRESH-CONTEXT REVIEW COMPLETED 2026-07-07 (same pass as the paired realization -- see that file's review notes for the full method: Codex still usage-exhausted, fell back to a separate general-purpose subagent with zero access to the authoring reasoning). §12 boundary coverage independently re-derived and confirmed genuinely complete, not just spot-checked. Content_key parity, jargon leaks, script purity, and instruction/answer coherence all independently re-verified clean. One documentation-accuracy correction made here to match the realization's own correction: the دوکاندار teaching note softened from 'the genuine Afghan Dari term' to 'the standard Afghan Dari term' since a web search found it's also recognized (non-standard) in Iranian Farsi, not fully exclusive as the original wording implied. Compiler validate+compile re-run clean (0 errors/0 warnings) after this edit.

    SECOND, FULLY INDEPENDENT FRESH-CONTEXT REVIEW, 2026-07-07 (zero access to any prior reviewer's reasoning, dispatched separately after discovering this file had already been marked reviewed by a concurrent pass mid-task): re-verified content_key parity (32 teaching/30 exercises exact both directions), zero jargon leaks, zero same-script leakage in multiple_choice/reading_comprehension/dialogue_comprehension options, zero duplicate instruction-vs-target_blocks text, and a fresh ZWNJ-aware tokenizer pass against file-scoped introduced_tokens (zero untaught-vocabulary violations) -- all independently re-derived, not trusted from the prior pass's self-report. FOUND AND FIXED a real bug the prior pass missed: lesson06.exercise04's (dialogue_response_own_job) feedback explicitly claimed any of this unit's 4 taught occupation/workplace pairings would be accepted, but accepted_answers only listed 2 of the 4 (معلم/مکتب, داکتر/شفاخانه) -- a learner answering with مهندس/دفتر or دوکاندار/دوکان, both fully valid per this unit's own taught vocabulary, would have been wrongly marked incorrect. Fixed by adding the missing 6 variants (both remaining occupation/workplace pairs x period/comma/و joins), bringing this exercise to the same 4-occupation coverage as write_work_profile and making its feedback's claim accurate. Re-ran validate then compile (not just validate): 0 errors/0 warnings, valid JSON, and directly inspected the compiled dialogue_response_own_job exercise to confirm all 12 accepted variants are present. No further issues found; this file is genuinely clean.

    2026-07-07: AUTHORING_GUIDE.md §19 retrofit -- added example_gloss to all 15 kind:vocabulary teaching entries (1 merged card -- names -- given a positionally-matched example_gloss list), matching the new example: sentences added to the paired realization. schema_version bumped to 1.1. Pending fresh-context review.

    Review 2026-10-20 (en-prs A1 pass): 2 fixes - example gloss for کار دارم changed from I have a job to I have work to do (the Dari does not mean job); added with-pronoun accepted answers (من معلم استم, من در دفتر کار می‌کنم, شما کجا کار می‌کنین؟ etc.). NATIVE FLAGS: کار شما چیست؟ (chist is formal; colloquial would be کارتان چیست or شما چه کار می‌کنین؟); whether کار دارم is natural for I have work to do; هر روز درس می‌دهد for teaches every day."

course:
  title: Dari A1
  description: >-
    Beginner Kabul Dari: basic occupations (teacher, engineer, doctor,
    shopkeeper), workplaces (office, shop, hospital, school), combining
    a job with a workplace, reading a short and then a longer work
    profile, and a dialogue asking about someone's job.

units:
  prs.a1.unit18.work:
    title: Work
    description: State a basic occupation, workplace, and simple work activity.

lessons:
  prs.a1.unit18.lesson01.occupation_words:
    title: "Occupation words"
  prs.a1.unit18.lesson02.workplace_words:
    title: "Workplace words"
  prs.a1.unit18.lesson03.combining_job_and_place:
    title: "Combining a job and a workplace"
  prs.a1.unit18.lesson04.reading_a_work_profile:
    title: "Reading a work profile"
  prs.a1.unit18.lesson05.reading_a_longer_profile:
    title: "Reading a longer work profile"
  prs.a1.unit18.lesson06.job_dialogue:
    title: "A dialogue about someone's job"

teaching:
  prs.a1.unit18.lesson01.teach.teacher_word:
    title: Teacher
    gloss: teacher
    note: "معلم means teacher."
    example_gloss: "I am a teacher."
  prs.a1.unit18.lesson01.teach.engineer_word:
    title: Engineer
    gloss: engineer
    note: "مهندس means engineer."
    example_gloss: "I am an engineer."
  prs.a1.unit18.lesson01.teach.doctor_word:
    title: Doctor
    gloss: doctor
    note: "داکتر is the standard Afghan Dari spelling and pronunciation for doctor."
    example_gloss: "I am a doctor."
  prs.a1.unit18.lesson01.teach.shopkeeper_word:
    title: Shopkeeper
    gloss: shopkeeper
    note: "دوکاندار is the standard Afghan Dari term for shopkeeper, already established in this course's shopping unit."
    example_gloss: "I am a shopkeeper."
  prs.a1.unit18.lesson01.teach.work_word:
    title: "Work / job"
    gloss: "work / job"
    note: "کار means work or job."
    example_gloss: "I have work to do."
  prs.a1.unit18.lesson01.teach.am_word:
    title: "I am"
    gloss: "I am"
    note: "استم is the polite first-person copula, consistent with this course's استم/استین register."
  prs.a1.unit18.lesson02.teach.office_word:
    title: Office
    gloss: office
    note: "دفتر means office."
    example_gloss: "I work in an office."
  prs.a1.unit18.lesson02.teach.shop_word:
    title: Shop
    gloss: shop
    note: "دوکان means shop."
    example_gloss: "I work in a shop."
  prs.a1.unit18.lesson02.teach.hospital_word:
    title: Hospital
    gloss: hospital
    note: "شفاخانه is the genuine Afghan Dari term for hospital, already established in this course's places unit."
    example_gloss: "I work in a hospital."
  prs.a1.unit18.lesson02.teach.school_word:
    title: School
    gloss: school
    note: "مکتب is the genuine Afghan Dari term for school, already established in this course's places unit."
    example_gloss: "I work in a school."
  prs.a1.unit18.lesson02.teach.in_word:
    title: "In / at"
    gloss: "in / at"
    note: "در marks the location where something happens -- در مکتب means at school."
  prs.a1.unit18.lesson02.teach.i_work_word:
    title: "I work"
    gloss: "I do / I work"
    note: "می‌کنم is the first-person present of کردن (to do) -- کار می‌کنم literally means I do work, i.e. I work."
  prs.a1.unit18.lesson03.teach.where_word:
    title: Where
    gloss: where
    note: "کجا means where."
  prs.a1.unit18.lesson03.teach.you_work_word:
    title: "You work (polite)"
    gloss: "you work"
    note: "کار می‌کنین means you work (polite)."
  prs.a1.unit18.lesson03.teach.and_word:
    title: And
    gloss: and
    note: "و means and, joining two clauses or items."
  prs.a1.unit18.lesson04.teach.is_word:
    title: "Is (third person)"
    gloss: "is"
    note: "است is the third-person copula -- معلم است means [she/he] is a teacher."
  prs.a1.unit18.lesson04.teach.he_she_works_word:
    title: "He/she works"
    gloss: "he/she works"
    note: "می‌کند is the third-person present of کردن (to do) -- کار می‌کند means he/she works."
  prs.a1.unit18.lesson04.teach.laila_word:
    title: Laila
    gloss: Laila
    note: "A recurring character name in this course, first introduced in the introductions unit."
    example_gloss: "Laila is a teacher."
  prs.a1.unit18.lesson04.teach.profile_text:
    title: "A short work profile"
    gloss: "Laila is a teacher. She works in a school."
    note: "A short third-person profile stating an occupation and a workplace."
  prs.a1.unit18.lesson05.teach.every_word:
    title: Every
    gloss: every
    note: "هر means every."
    example_gloss: "I work every day."
  prs.a1.unit18.lesson05.teach.day_word:
    title: Day
    gloss: day
    note: "روز means day -- هر روز means every day."
    example_gloss: "She teaches every day."
  prs.a1.unit18.lesson05.teach.lesson_word:
    title: Lesson
    gloss: lesson
    note: "درس means lesson."
    example_gloss: "Laila teaches."
  prs.a1.unit18.lesson05.teach.gives_word:
    title: "He/she gives"
    gloss: "he/she gives"
    note: "می‌دهد is the third-person present of دادن (to give) -- درس می‌دهد literally means gives lessons, i.e. teaches."
  prs.a1.unit18.lesson05.teach.longer_profile_text:
    title: "A longer work profile"
    gloss: "Laila is a teacher. She works in a school. She teaches every day."
    note: "The same profile as lesson04, extended with a daily work activity."
  prs.a1.unit18.lesson06.teach.names:
    title: "Bashir and Negar"
    gloss: "Bashir, Negar"
    note: "Recurring characters in this course."
    example_gloss: ["I am Bashir.", "I am Negar."]
  prs.a1.unit18.lesson06.teach.you_word:
    title: "You (polite)"
    gloss: you
    note: "شما is the polite second-person pronoun."
  prs.a1.unit18.lesson06.teach.what_is_word:
    title: "What is"
    gloss: "what is"
    note: "چیست means what is -- کار شما چیست؟ means what is your job?"
  prs.a1.unit18.lesson06.teach.yes_word:
    title: "Yes"
    gloss: "yes"
    note: "بلی is the polite/formal word for yes, consistent with this course's register."
    example_gloss: "Yes, I work every day."
  prs.a1.unit18.lesson06.teach.dialogue_line1:
    title: "Bashir asks"
    gloss: "What is your job?"
  prs.a1.unit18.lesson06.teach.dialogue_line2:
    title: "Negar answers"
    gloss: "I am a doctor. I work in a hospital."
  prs.a1.unit18.lesson06.teach.dialogue_line3:
    title: "Bashir asks"
    gloss: "Do you work every day?"
  prs.a1.unit18.lesson06.teach.dialogue_line4:
    title: "Negar answers"
    gloss: "Yes, I work every day."

exercises:
  prs.a1.unit18.lesson01.exercise01.recognize_teacher:
    instruction: "What does this word mean?"
    correct_option: teacher
    distractors: [engineer, doctor, shopkeeper]
    accepted_answers: [{value: teacher, status: correct}]
    feedback: "معلم means teacher."
  prs.a1.unit18.lesson01.exercise02.recognize_engineer:
    instruction: "What does this word mean?"
    correct_option: engineer
    distractors: [teacher, doctor, shopkeeper]
    accepted_answers: [{value: engineer, status: correct}]
    feedback: "مهندس means engineer."
  prs.a1.unit18.lesson01.exercise03.match_occupation_words:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - value: {معلم: teacher, مهندس: engineer, داکتر: doctor, دوکاندار: shopkeeper, کار: "work / job", استم: "I am"}
        status: correct
    feedback: "These are this lesson's core occupation words."
  prs.a1.unit18.lesson01.exercise04.translate_i_am_a_teacher:
    instruction: "Translate into Dari: I am a teacher."
    accepted_answers:
      - {value: "معلم استم", status: correct}
      - {value: "من معلم استم", status: correct}
    feedback: "معلم استم means I am a teacher."
  prs.a1.unit18.lesson01.exercise05.translate_i_am_an_engineer:
    instruction: "Translate into Dari: I am an engineer."
    accepted_answers:
      - {value: "مهندس استم", status: correct}
      - {value: "من مهندس استم", status: correct}
    feedback: "مهندس استم means I am an engineer."
  prs.a1.unit18.lesson02.exercise01.recognize_office:
    instruction: "What does this word mean?"
    correct_option: office
    distractors: [shop, hospital, school]
    accepted_answers: [{value: office, status: correct}]
    feedback: "دفتر means office."
  prs.a1.unit18.lesson02.exercise02.recognize_school:
    instruction: "What does this word mean?"
    correct_option: school
    distractors: [office, shop, hospital]
    accepted_answers: [{value: school, status: correct}]
    feedback: "مکتب means school."
  prs.a1.unit18.lesson02.exercise03.match_workplace_words:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - value: {دفتر: office, دوکان: shop, شفاخانه: hospital, مکتب: school, در: "in / at", می‌کنم: "I do / I work"}
        status: correct
    feedback: "These are this lesson's core workplace words."
  prs.a1.unit18.lesson02.exercise04.translate_i_work_in_an_office:
    instruction: "Translate into Dari: I work in an office."
    accepted_answers:
      - {value: "در دفتر کار می‌کنم", status: correct}
      - {value: "من در دفتر کار می‌کنم", status: correct}
    feedback: "در دفتر کار می‌کنم means I work in an office."
  prs.a1.unit18.lesson02.exercise05.translate_i_work_in_a_school:
    instruction: "Translate into Dari: I work in a school."
    accepted_answers:
      - {value: "در مکتب کار می‌کنم", status: correct}
      - {value: "من در مکتب کار می‌کنم", status: correct}
    feedback: "در مکتب کار می‌کنم means I work in a school."
  prs.a1.unit18.lesson03.exercise01.recognize_where_do_you_work:
    instruction: "What does this phrase mean?"
    correct_option: "Where do you work?"
    distractors: ["What is your job?", "I am a teacher", "I work in a school"]
    accepted_answers: [{value: "Where do you work?", status: correct}]
    feedback: "کجا کار می‌کنین؟ means Where do you work?"
  prs.a1.unit18.lesson03.exercise02.recognize_teacher_and_school:
    instruction: "What does this sentence mean?"
    correct_option: "I am a teacher and I work in a school"
    distractors: ["I am an engineer and I work in an office", "Where do you work?", "I am a doctor"]
    accepted_answers: [{value: "I am a teacher and I work in a school", status: correct}]
    feedback: "معلم استم و در مکتب کار می‌کنم means I am a teacher and I work in a school."
  prs.a1.unit18.lesson03.exercise03.match_combining_words:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - value: {کجا: where, می‌کنین: "you work", و: and, معلم: teacher, دفتر: office, مکتب: school, داکتر: doctor}
        status: correct
    feedback: "These combine lesson03's new words with earlier review vocabulary."
  prs.a1.unit18.lesson03.exercise04.translate_where_do_you_work:
    instruction: "Translate into Dari: Where do you work?"
    accepted_answers:
      - {value: "کجا کار می‌کنین؟", status: correct}
      - {value: "شما کجا کار می‌کنین؟", status: correct}
    feedback: "کجا کار می‌کنین؟ means Where do you work?"
  prs.a1.unit18.lesson03.exercise05.translate_teacher_and_school:
    instruction: "Translate into Dari: I am a teacher and I work in a school."
    accepted_answers:
      - {value: "معلم استم و در مکتب کار می‌کنم", status: correct}
      - {value: "من معلم استم و در مکتب کار می‌کنم", status: correct}
    feedback: "معلم استم و در مکتب کار می‌کنم means I am a teacher and I work in a school."
  prs.a1.unit18.lesson04.exercise01.reading_comprehension_occupation:
    instruction: "Read the profile. What is Laila's job?"
    correct_option: Teacher
    distractors: [Engineer, Doctor, Shopkeeper]
    accepted_answers: [{value: Teacher, status: correct}]
    feedback: "The profile says لیلا معلم است -- Laila is a teacher."
  prs.a1.unit18.lesson04.exercise02.reading_comprehension_workplace:
    instruction: "Read the profile. Where does Laila work?"
    correct_option: School
    distractors: [Office, Shop, Hospital]
    accepted_answers: [{value: School, status: correct}]
    feedback: "The profile says در مکتب کار می‌کند -- she works in a school."
  prs.a1.unit18.lesson04.exercise03.match_profile_vocab:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - value: {است: "is", می‌کند: "he/she works", لیلا: Laila, معلم: teacher, مکتب: school, در: "in / at"}
        status: correct
    feedback: "These are the profile's key words."
  prs.a1.unit18.lesson04.exercise04.translate_laila_is_a_teacher:
    instruction: "Translate into Dari: Laila is a teacher."
    accepted_answers:
      - {value: "لیلا معلم است", status: correct}
    feedback: "لیلا معلم است means Laila is a teacher."
  prs.a1.unit18.lesson04.exercise05.write_own_job_sentence:
    instruction: "Write one sentence in Dari about your own job (for example: teacher, engineer, doctor, or shopkeeper)."
    accepted_answers:
      - {value: "معلم استم", status: correct}
      - {value: "مهندس استم", status: correct}
      - {value: "داکتر استم", status: correct}
      - {value: "دوکاندار استم", status: correct}
    feedback: "معلم استم means I am a teacher -- a good model answer. Any true occupation using this lesson's vocabulary is equally accepted."
  prs.a1.unit18.lesson05.exercise01.reading_comprehension_activity:
    instruction: "Read the profile. What does Laila do every day?"
    correct_option: "She teaches"
    distractors: ["She works in an office", "She works in a hospital", "It isn't stated"]
    accepted_answers: [{value: "She teaches", status: correct}]
    feedback: "The profile says هر روز درس می‌دهد -- every day she gives lessons, i.e. she teaches."
  prs.a1.unit18.lesson05.exercise02.reading_comprehension_frequency:
    instruction: "Read the profile. How often does Laila teach?"
    correct_option: "Every day"
    distractors: ["Once a week", "It isn't stated", "Never"]
    accepted_answers: [{value: "Every day", status: correct}]
    feedback: "The profile says هر روز درس می‌دهد -- every day she gives lessons."
  prs.a1.unit18.lesson05.exercise03.match_activity_vocab:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - value: {هر: every, روز: day, درس: lesson, می‌دهد: "he/she gives", معلم: teacher, مکتب: school, کار: "work / job", در: "in / at"}
        status: correct
    feedback: "These combine lesson05's new words with earlier review vocabulary."
  prs.a1.unit18.lesson05.exercise04.reading_comprehension_full_summary:
    instruction: "Read the profile. Which of these is true about Laila?"
    correct_option: "She is a teacher who works in a school and teaches every day"
    distractors: ["She is a doctor who works in a hospital every day", "She is an engineer who works in an office every day", "She is a teacher who works in a shop every day"]
    accepted_answers: [{value: "She is a teacher who works in a school and teaches every day", status: correct}]
    feedback: "لیلا معلم است. در مکتب کار می‌کند. هر روز درس می‌دهد -- Laila is a teacher, works in a school, and teaches every day."
  prs.a1.unit18.lesson05.exercise05.write_work_profile:
    instruction: "Write two or three sentences in Dari about your own work: your job, where you work, and whether you work every day."
    accepted_answers:
      - {value: "معلم استم. در مکتب کار می‌کنم. هر روز کار می‌کنم", status: correct}
      - {value: "معلم استم. در مکتب کار می‌کنم، هر روز کار می‌کنم", status: correct}
      - {value: "معلم استم. در مکتب کار می‌کنم و هر روز کار می‌کنم", status: correct}
      - {value: "معلم استم، در مکتب کار می‌کنم. هر روز کار می‌کنم", status: correct}
      - {value: "معلم استم، در مکتب کار می‌کنم، هر روز کار می‌کنم", status: correct}
      - {value: "معلم استم، در مکتب کار می‌کنم و هر روز کار می‌کنم", status: correct}
      - {value: "معلم استم و در مکتب کار می‌کنم. هر روز کار می‌کنم", status: correct}
      - {value: "معلم استم و در مکتب کار می‌کنم، هر روز کار می‌کنم", status: correct}
      - {value: "معلم استم و در مکتب کار می‌کنم و هر روز کار می‌کنم", status: correct}
      - {value: "داکتر استم. در شفاخانه کار می‌کنم. هر روز کار می‌کنم", status: correct}
      - {value: "دوکاندار استم، در دوکان کار می‌کنم، هر روز کار می‌کنم", status: correct}
      - {value: "مهندس استم و در دفتر کار می‌کنم و هر روز کار می‌کنم", status: correct}
    feedback: "معلم استم، در مکتب کار می‌کنم، هر روز کار می‌کنم means I am a teacher, I work in a school, I work every day -- a good model answer. Any true combination of an occupation, workplace, and frequency from this unit's vocabulary, joined by a period, comma, or و at either boundary, is equally accepted."
  prs.a1.unit18.lesson06.exercise01.dialogue_comprehension_negars_job:
    instruction: "Read the conversation. What is Negar's job?"
    correct_option: Doctor
    distractors: [Teacher, Engineer, Shopkeeper]
    accepted_answers: [{value: Doctor, status: correct}]
    feedback: "نگار says داکتر استم -- I am a doctor."
  prs.a1.unit18.lesson06.exercise02.match_dialogue_vocab:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {"کار شما چیست؟": "What is your job?", داکتر: doctor, شفاخانه: hospital, "هر روز": "every day", بلی: "yes", نگار: Negar}
        status: correct
    feedback: "These are the dialogue's key words and names."
  prs.a1.unit18.lesson06.exercise03.reading_comprehension_negars_workplace:
    instruction: "Read the line. Where does Negar work?"
    correct_option: Hospital
    distractors: [Office, School, Shop]
    accepted_answers: [{value: Hospital, status: correct}]
    feedback: "نگار says در شفاخانه کار می‌کنم -- I work in a hospital."
  prs.a1.unit18.lesson06.exercise04.dialogue_response_own_job:
    instruction: "Bashir asks 'کار شما چیست؟' (What is your job?). Answer, saying your job and where you work."
