course:
  title: Dari B1
  description: >-
    Intermediate Kabul Dari: expressing real/likely conditions with اگر
    (if) plus a compound or regular subjunctive verb, and its negation,
    across a Friday-outing-and-weather scenario.

units:
  prs.b1.unit03.conditions:
    title: Conditions
    description: Say what will happen if a real, likely circumstance occurs (or does not occur), using an if-clause construction.

lessons:
  prs.b1.unit03.lesson01.present_condition_1st2nd:
    title: "If I have / if you have"
  prs.b1.unit03.lesson02.present_condition_all_persons:
    title: "All the persons"
  prs.b1.unit03.lesson03.negative_and_weather_condition:
    title: "If it doesn't rain"
  prs.b1.unit03.lesson04.dialogue_friday_plan:
    title: "Friday plans"
  prs.b1.unit03.lesson05.reading_friday:
    title: "Friday"
  prs.b1.unit03.lesson06.wrapup_production:
    title: "Wrap-up"

teaching:
  prs.b1.unit03.lesson01.teach.agar:
    title: If
    gloss: if
    note: "*اگر* introduces a real/likely condition."
    example_gloss: "If I have time, I'll come."
  prs.b1.unit03.lesson01.teach.dashte_basham:
    title: "If I have"
    gloss: "if I have"
    note: "*داشته باشم* is the compound subjunctive of *داشتن* (to have) -- the past participle *داشته* plus the subjunctive auxiliary *باشم*."
    example_gloss: "If I have time, I'll go to the park."
  prs.b1.unit03.lesson01.teach.grammar_agar:
    title: "The اگر-conditional construction"
    gloss: "اگر + subjunctive introduces a real/likely condition: اگر وقت داشته باشم = if I have time"
    note: "A conditional sentence normally has two clauses: the اگر-clause states the condition, and the second clause states the result. A short follow-up question such as *اگر باران ببارد چه؟* (what if it rains?) can leave the result unsaid."
  prs.b1.unit03.lesson01.teach.dashte_bashi:
    title: "If you have"
    gloss: "if you have"
    note: "*داشته باشی* is the 2nd person singular form."
    example_gloss: "If you have time, will you come?"
  prs.b1.unit03.lesson01.teach.miayam:
    title: "I come"
    gloss: "I come"
    note: "*می‌آیم* is the 1st person present of *آمدن* (to come)."
    example_gloss: "I'm coming to the park."
  prs.b1.unit03.lesson01.teach.miayi:
    title: "You come"
    gloss: "you come"
    note: "*می‌آیی* is the 2nd person singular form."
    example_gloss: "If you have time, will you come?"
  prs.b1.unit03.lesson01.teach.review_vaqt:
    title: Time
    gloss: time
    note: "*وقت* means time."
    example_gloss: "I have time today."
  prs.b1.unit03.lesson01.teach.park:
    title: Park
    gloss: park
    note: "*پارک* means park."
    example_gloss: "I'm going to the park."
  prs.b1.unit03.lesson01.teach.miravam:
    title: "I go"
    gloss: "I go"
    note: "*می‌روم* is the 1st person present of *رفتن* (to go)."
    example_gloss: "I'm going to the park."
  prs.b1.unit03.lesson01.teach.review_ba:
    title: To
    gloss: to
    note: "*به* means to/at."
    example_gloss: "I'm going to the park."

  prs.b1.unit03.lesson02.teach.dashte_bashad:
    title: "If he/she has"
    gloss: "if he/she has"
    note: "*داشته باشد* is the 3rd person singular form, with the standard د ending of *باشد* (the subjunctive of *بودن*) -- the same form you saw in the previous unit's reading (*اگر وقت داشته باشد*)."
    example_gloss: "If Homayoun has time, he'll come."
  prs.b1.unit03.lesson02.teach.dashte_bashim:
    title: "If we have"
    gloss: "if we have"
    note: "*داشته باشیم* is the 1st person plural form."
    example_gloss: "If we have time, we'll come."
  prs.b1.unit03.lesson02.teach.dashte_bashid:
    title: "If you (pl./polite) have"
    gloss: "if you (plural/polite) have"
    note: "*داشته باشین* is the 2nd person plural/polite form."
    example_gloss: "If you have time, will you come?"
  prs.b1.unit03.lesson02.teach.dashte_bashand:
    title: "If they have"
    gloss: "if they have"
    note: "*داشته باشند* is the 3rd person plural form."
    example_gloss: "If they have time, they'll come."
  prs.b1.unit03.lesson02.teach.grammar_agreement:
    title: "Subject agreement in both clauses"
    gloss: "The if-clause and the result clause can have different subjects, and each verb agrees with its own subject"
    note: "داشته باشم، داشته باشی، داشته باشد، داشته باشیم، داشته باشین، داشته باشند -- the subjunctive of *بودن* follows the same م/ی/د/یم/ین/ند person endings as regular present-tense verbs."
  prs.b1.unit03.lesson02.teach.review_homayoun:
    title: Homayoun
    gloss: Homayoun
    note: "*همایون* -- an established recurring character in this course."
    example_gloss: "If Homayoun has time, he'll come."
  prs.b1.unit03.lesson02.teach.review_zarmina:
    title: Zarmina
    gloss: Zarmina
    note: "*زرمینه* -- an established recurring character in this course."
    example_gloss: "If Zarmina has time, she'll come."
  prs.b1.unit03.lesson02.teach.review_anha:
    title: They
    gloss: they
    note: "*آنها* means they."
    example_gloss: "If they have time, they'll come."
  prs.b1.unit03.lesson02.teach.ma:
    title: We
    gloss: we
    note: "*ما* means we."
    example_gloss: "If we have time, we'll come."

  prs.b1.unit03.lesson03.teach.baran:
    title: Rain
    gloss: rain
    note: "*باران* means rain."
    example_gloss: "It's raining today."
  prs.b1.unit03.lesson03.teach.bebarad:
    title: "It rains"
    gloss: "it rains"
    note: "*ببارد* is the subjunctive of *باریدن* (to rain) -- a regular verb's own ب-subjunctive, not the compound *داشته باشد* pattern."
    example_gloss: "If it rains, we'll stay home."
  prs.b1.unit03.lesson03.teach.nabarad:
    title: "It doesn't rain"
    gloss: "it doesn't rain"
    note: "*نبارد* negates *ببارد* by replacing the ب- prefix with ن-."
    example_gloss: "If it doesn't rain, we'll go to the park."
  prs.b1.unit03.lesson03.teach.grammar_negation:
    title: "Negating a regular verb's subjunctive"
    gloss: "A regular verb's subjunctive prefix ب- becomes ن- for negation: ببارد (it rains) -> نبارد (it doesn't rain)"
    note: "This is different from *توانستن*'s negation (نتوانستم; colloquial نتانستم), which just adds ن- directly, since *توانستن* never took a ب- prefix to begin with."
  prs.b1.unit03.lesson03.teach.mimanim:
    title: "We stay"
    gloss: "we stay"
    note: "*می‌مانیم* is the 1st person plural present of *ماندن* (to stay/remain)."
    example_gloss: "If it rains, we'll stay home."
  prs.b1.unit03.lesson03.teach.dar:
    title: "In / at"
    gloss: "in / at"
    note: "*در* means in or at."
    example_gloss: "We stay home."
  prs.b1.unit03.lesson03.teach.khana:
    title: House
    gloss: house
    note: "*خانه* means house."
    example_gloss: "We stay home."
  prs.b1.unit03.lesson03.teach.miravim:
    title: "We go"
    gloss: "we go"
    note: "*می‌رویم* is the 1st person plural present of *رفتن*."
    example_gloss: "If it doesn't rain, we'll go to the park."

  prs.b1.unit03.lesson04.teach.jomee:
    title: Friday
    gloss: Friday
    note: "*جمعه* means Friday."
    example_gloss: "I'm going to the park on Friday."
  prs.b1.unit03.lesson04.teach.chi_kar_mikoni:
    title: "What are you doing?"
    gloss: "what are you doing?"
    note: "*چه کار می‌کنی* is a common everyday question asking about someone's plans."
    example_gloss: "What are you doing on Friday?"
  prs.b1.unit03.lesson04.teach.nemidanam:
    title: "I don't know"
    gloss: "I don't know"
    note: "*نمی‌دانم* is the negative of *می‌دانم* (I know)."
    example_gloss: "I don't know what I'm doing."
  prs.b1.unit03.lesson04.teach.shayad:
    title: Maybe
    gloss: maybe
    note: "*شاید* means maybe/perhaps."
    example_gloss: "Maybe I'll stay home."
  prs.b1.unit03.lesson04.teach.aftabi:
    title: Sunny
    gloss: sunny
    note: "*آفتابی* means sunny."
    example_gloss: "If it's sunny, we'll go to the park."
  prs.b1.unit03.lesson04.teach.chai:
    title: Tea
    gloss: tea
    note: "*چای* means tea."
    example_gloss: "We drink tea at home."
  prs.b1.unit03.lesson04.teach.minushim:
    title: "We drink"
    gloss: "we drink"
    note: "*می‌نوشیم* is the 1st person plural present of *نوشیدن* (to drink)."
    example_gloss: "We drink tea at home."
  prs.b1.unit03.lesson04.teach.khub_ast:
    title: "That's good"
    gloss: "that's good / OK"
    note: "*خوب است* is a common way to say something sounds good or OK."
    example_gloss: "That's good. If it doesn't rain, I'll come."
  prs.b1.unit03.lesson04.teach.va:
    title: And
    gloss: and
    note: "*و* means and."
    example_gloss: "We drink tea and stay home."
  prs.b1.unit03.lesson04.teach.mimanam:
    title: "I stay"
    gloss: "I stay"
    note: "*می‌مانم* is the 1st person singular present of *ماندن*."
    example_gloss: "Maybe I'll stay home."
  prs.b1.unit03.lesson04.teach.dialogue_zarmina_ask:
    title: "Homayoun, what are you doing Friday?"
    gloss: "Homayoun, what are you doing Friday?"
    note: "Zarmina asks about Homayoun's plans."
  prs.b1.unit03.lesson04.teach.dialogue_homayoun_dontknow:
    title: "I don't know. Maybe I'll stay home."
    gloss: "I don't know. Maybe I'll stay home."
    note: "Homayoun hasn't decided yet."
  prs.b1.unit03.lesson04.teach.dialogue_zarmina_plan:
    title: "If it's sunny, we're going to the park."
    gloss: "If it's sunny, we're going to the park."
    note: "Zarmina proposes a plan using the اگر-conditional."
  prs.b1.unit03.lesson04.teach.dialogue_homayoun_agree:
    title: "That's good. If it doesn't rain, I'll come."
    gloss: "That's good. If it doesn't rain, I'll come."
    note: "Homayoun agrees, with his own condition."
  prs.b1.unit03.lesson04.teach.dialogue_zarmina_whatif:
    title: "What if it rains?"
    gloss: "What if it rains?"
    note: "Zarmina asks about the opposite case."
  prs.b1.unit03.lesson04.teach.dialogue_homayoun_response:
    title: "If it rains, we'll stay home and drink tea."
    gloss: "If it rains, we'll stay home and drink tea."
    note: "Homayoun gives a backup plan."

  prs.b1.unit03.lesson05.teach.boud:
    title: Was
    gloss: was
    note: "*بود* is the 3rd person singular past of *بودن* (to be)."
    example_gloss: "Friday was sunny."
  prs.b1.unit03.lesson05.teach.raftand:
    title: "They went"
    gloss: "they went"
    note: "*رفتند* is the 3rd person plural simple past of *رفتن*."
    example_gloss: "Zarmina and Homayoun went to the park."
  prs.b1.unit03.lesson05.teach.mandand:
    title: "They stayed"
    gloss: "they stayed"
    note: "*ماندند* is the 3rd person plural simple past of *ماندن*."
    example_gloss: "They stayed there for an hour."
  prs.b1.unit03.lesson05.teach.rooz:
    title: Day
    gloss: day
    note: "*روز* means day."
    example_gloss: "It was a good day."
  prs.b1.unit03.lesson05.teach.digar:
    title: "Another / other"
    gloss: "another / other"
    note: "*دیگر* means another or other."
    example_gloss: "If next Friday is sunny too, we'll go to the park."
  prs.b1.unit03.lesson05.teach.dobara:
    title: Again
    gloss: again
    note: "*دوباره* means again."
    example_gloss: "They'll go to the park again."
  prs.b1.unit03.lesson05.teach.reading_passage:
    title: "Friday at the park"
    gloss: "Friday was sunny. Zarmina and Homayoun went to the park. They drank tea and stayed there for an hour. It was a good day. If next Friday is sunny too, they'll go to the park again."
    note: "A short reading combining a past narrative with a real conditional, reusing this unit's established characters."

  prs.b1.unit03.lesson06.teach.grammar_review:
    title: "Review: real conditions"
    gloss: "اگر + داشته باشم/باشی/باشد/باشیم/باشین/باشند + result clause states a real condition. A regular verb's own subjunctive (ببارد) negates by swapping ب- for ن- (نبارد)."
    note: "This lesson reviews and combines everything from lessons 1-5."
  prs.b1.unit03.lesson06.teach.hava:
    title: Weather
    gloss: weather
    note: "*هوا* means weather."
    example_gloss: "The weather is sunny today."
  prs.b1.unit03.lesson06.teach.emroz:
    title: Today
    gloss: today
    note: "*امروز* means today."
    example_gloss: "The weather is sunny today."

exercises:
  prs.b1.unit03.lesson01.exercise01.recognize_agar:
    instruction: "What does this word mean?"
    correct_option: "if"
    distractors: ["when", "because", "but"]
    accepted_answers: [{value: "if", status: correct}]
    feedback: "*اگر* means if."

  prs.b1.unit03.lesson01.exercise02.recognize_dashte_basham:
    instruction: "What does this phrase mean?"
    correct_option: "if I have"
    distractors: ["I don't have", "I had", "I want"]
    accepted_answers: [{value: "if I have", status: correct}]
    feedback: "*داشته باشم* means if I have."

  prs.b1.unit03.lesson01.exercise03.order_agar_miayam:
    instruction: "Put the words in order: If I have time, I come."
    accepted_answers:
      - {value: "اگر وقت داشته باشم می‌آیم", status: correct}
    feedback: "*اگر وقت داشته باشم می‌آیم* means if I have time, I come."

  prs.b1.unit03.lesson01.exercise04.match_condition_words:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - value: {اگر: if, "داشته باشم": "if I have", "داشته باشی": "if you have", می‌آیم: "I come", وقت: time, پارک: park}
        status: correct
    feedback: "These are this lesson's core conditional words."

  prs.b1.unit03.lesson01.exercise05.translate_will_you_come:
    instruction: "Translate into Dari: If you have time, will you come?"
    accepted_answers:
      - {value: "اگر وقت داشته باشی، می‌آیی؟", status: correct}
    feedback: "*اگر وقت داشته باشی، می‌آیی؟* means if you have time, will you come?"

  prs.b1.unit03.lesson01.exercise06.speak_if_i_have_time:
    instruction: "Say aloud in Dari: If I have time, I'll come."
    accepted_answers:
      - {value: "اگر وقت داشته باشم، می‌آیم", status: correct}
    feedback: "*اگر وقت داشته باشم، می‌آیم* means if I have time, I'll come."

  prs.b1.unit03.lesson01.exercise07.write_if_i_have_time_park:
    instruction: "Write in Dari: If I have time, I'll go to the park."
    accepted_answers:
      - {value: "اگر وقت داشته باشم، به پارک می‌روم", status: correct}
    feedback: "*اگر وقت داشته باشم، به پارک می‌روم* means if I have time, I'll go to the park."


  prs.b1.unit03.lesson02.exercise01.recognize_dashte_bashad:
    instruction: "What does this phrase mean?"
    correct_option: "if he/she has"
    distractors: ["if we have", "if they have", "if you have"]
    accepted_answers: [{value: "if he/she has", status: correct}]
    feedback: "*داشته باشد* means if he/she has."

  prs.b1.unit03.lesson02.exercise02.recognize_dashte_bashand:
    instruction: "What does this phrase mean?"
    correct_option: "if they have"
    distractors: ["if he/she has", "if we have", "I have"]
    accepted_answers: [{value: "if they have", status: correct}]
    feedback: "*داشته باشند* means if they have."

  prs.b1.unit03.lesson02.exercise03.order_agar_homayoun:
    instruction: "Put the words in order: If Homayoun has time, he comes."
    accepted_answers:
      - {value: "اگر همایون وقت داشته باشد می‌آید", status: correct}
    feedback: "*اگر همایون وقت داشته باشد می‌آید* means if Homayoun has time, he comes."

  prs.b1.unit03.lesson02.exercise04.match_person_forms:
    instruction: "Match each form with its meaning."
    accepted_answers:
      - value: {"داشته باشم": "if I have", "داشته باشی": "if you have", "داشته باشد": "if he/she has", "داشته باشیم": "if we have", "داشته باشین": "if you (pl) have", "داشته باشند": "if they have"}
        status: correct
    feedback: "These are all six persons of the conditional form."

  prs.b1.unit03.lesson02.exercise05.translate_they_will_come:
    instruction: "Translate into Dari: If they have time, they'll come."
    accepted_answers:
      - {value: "اگر آنها وقت داشته باشند، می‌آیند", status: correct}
    feedback: "*اگر آنها وقت داشته باشند، می‌آیند* means if they have time, they'll come."

  prs.b1.unit03.lesson02.exercise06.speak_we_will_come:
    instruction: "Say aloud in Dari: If we have time, we'll come."
    accepted_answers:
      - {value: "اگر ما وقت داشته باشیم، می‌آییم", status: correct}
    feedback: "*اگر ما وقت داشته باشیم، می‌آییم* means if we have time, we'll come."

  prs.b1.unit03.lesson02.exercise07.write_zarmina_will_come:
    instruction: "Write in Dari: If Zarmina has time, she'll come."
    accepted_answers:
      - {value: "اگر زرمینه وقت داشته باشد، می‌آید", status: correct}
    feedback: "*اگر زرمینه وقت داشته باشد، می‌آید* means if Zarmina has time, she'll come."


  prs.b1.unit03.lesson03.exercise01.recognize_bebarad:
    instruction: "What does this word mean?"
    correct_option: "it rains"
    distractors: ["it doesn't rain", "it is cold", "it is sunny"]
    accepted_answers: [{value: "it rains", status: correct}]
    feedback: "*ببارد* means it rains."

  prs.b1.unit03.lesson03.exercise02.recognize_nabarad:
    instruction: "What does this word mean?"
    correct_option: "it doesn't rain"
    distractors: ["it rains", "it will rain", "it rained"]
    accepted_answers: [{value: "it doesn't rain", status: correct}]
    feedback: "*نبارد* means it doesn't rain."

  prs.b1.unit03.lesson03.exercise03.order_agar_baran_nabarad:
    instruction: "Put the words in order: If it doesn't rain, we go to the park."
    accepted_answers:
      - {value: "اگر باران نبارد به پارک می‌رویم", status: correct}
    feedback: "*اگر باران نبارد به پارک می‌رویم* means if it doesn't rain, we go to the park."

  prs.b1.unit03.lesson03.exercise04.match_weather_words:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - value: {باران: rain, ببارد: "it rains", نبارد: "it doesn't rain", می‌مانیم: "we stay", در: "in/at", خانه: house}
