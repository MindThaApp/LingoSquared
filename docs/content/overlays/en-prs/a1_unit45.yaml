  status: unreviewed
  required_next_reviewer: codex_fresh_context
  notes: "Authored with prs a1_unit45_accommodation.yaml for en-prs only. Adapted from DLI Dari Semester 1 (s17-20.pdf) Lesson 19 'At a Hotel' per AUTHORING_GUIDE.md #10 -- heavily simplified from the source's B1-level subjunctive/indirect-question grammar down to A1 simple-present statements and rising-intonation yes/no questions; هوتل/تشناب/شامل/چای صبح/ماندن are genuinely source-verified, وای‌فای/کلید/رزرو/نمبر/خروج are honest modernization additions not in the 1960s/2005 source. No multi-clause translate/write exercise combines two natural clauses without an explicit single conjunction -- the one اما-joined contrast sentence (lesson06) uses a single canonical comma-اما form, matching unit33/39-44's own established precedent. Dialogue content uses structured speakers in the realization, not embedded speaker labels. No bare Yes/No/True/False/On/Off gloss values exist anywhere in this unit, including every matching_pairs right: value (بلی is quoted \"Yes\" where it appears as a gloss)."
course:
  title: Dari A1
  description: "Beginner Kabul Dari: check into a hotel, ask about room features (bathroom, breakfast, wifi) and a key, state how many nights you're staying, read a short booking confirmation, and ask about check-out time."
units:
  prs.a1.unit45.accommodation:
    title: Hotel and room
    description: Check into a hotel, ask about room features and a key, state length of stay, read a booking confirmation, and ask about check-out time.
lessons:
  prs.a1.unit45.lesson01.hotel_room_key_vocabulary:
    title: Hotel, room, and key
  prs.a1.unit45.lesson02.bathroom_and_reservation:
    title: Bathroom and reservation
  prs.a1.unit45.lesson03.room_number_and_nights:
    title: Room number and how many nights
  prs.a1.unit45.lesson04.hotel_checkin_dialogue:
    title: Hotel check-in dialogue
  prs.a1.unit45.lesson05.reading:
    title: Reading about Homayoun's reservation
  prs.a1.unit45.lesson06.wrap_up:
    title: Wrap-up
teaching:
  prs.a1.unit45.lesson01.teach.review_this_is_in:
    title: "Review: this, is, in"
    gloss: this / is / in
    note: "این, است, and در (used throughout this course) are review words used to talk about hotels and rooms."
  prs.a1.unit45.lesson01.teach.hotel_word:
    title: Hotel
    gloss: hotel
    note: "هوتل is the Afghan Dari word for hotel, spelled with a waw -- distinct from Iranian Farsi's هتل."
    example_gloss: This is a hotel.
  prs.a1.unit45.lesson01.teach.room_word:
    title: Room
    gloss: room
    note: "اتاق is the everyday Dari word for a room."
    example_gloss: The room is in the hotel.
  prs.a1.unit45.lesson01.teach.room_in_hotel_phrase:
    title: The room is in the hotel
    gloss: The room is in the hotel.
    note: "اتاق در هوتل است combines the words taught earlier in this lesson."
  prs.a1.unit45.lesson01.teach.key_word:
    title: Key
    gloss: key
    note: "کلید is the standard Dari word for a key."
    example_gloss: This is a key.
  prs.a1.unit45.lesson01.teach.room_key_phrase:
    title: Room key
    gloss: room key
    note: "کلید اتاق combines کلید (key) and اتاق (room)."
  prs.a1.unit45.lesson01.teach.this_is_room_key_phrase:
    title: This is the room key
    gloss: This is the room key.
    note: "این کلید اتاق است combines the words taught earlier in this lesson."
  prs.a1.unit45.lesson02.teach.review_have:
    title: "Review: I have, it has"
    gloss: I have / it has
    note: "دارم and دارد (from unit03) are review words used to ask about room features."
  prs.a1.unit45.lesson02.teach.bathroom_word:
    title: Bathroom
    gloss: bathroom
    note: "تشناب is the everyday Dari word for a bathroom or restroom."
    example_gloss: The room has a bathroom.
  prs.a1.unit45.lesson02.teach.room_has_bathroom_question_phrase:
    title: Does the room have a bathroom?
    gloss: Does the room have a bathroom?
    note: "اتاق تشناب دارد؟ is a yes/no question formed by rising intonation, without a separate question word."
  prs.a1.unit45.lesson02.teach.yes_has_bathroom_phrase:
    title: "Yes, it has a bathroom"
    gloss: "Yes, it has a bathroom."
    note: "بلی (from unit03/unit44) is the review word for yes."
  prs.a1.unit45.lesson02.teach.reservation_word:
    title: Reservation
    gloss: reservation
    note: "رزرو is a widely used loanword for a reservation or booking."
    example_gloss: I have a reservation.
  prs.a1.unit45.lesson02.teach.have_reservation_phrase:
    title: I have a reservation
    gloss: I have a reservation.
    note: "رزرو دارم combines رزرو (reservation) and دارم (I have)."
  prs.a1.unit45.lesson03.teach.review_which_number_for:
    title: "Review: how many/what number, for, I want"
    gloss: how many / what number / for / I want
    note: "چند (from unit09), برای (from unit07), and می‌خواهم (from unit16) are review words used to ask about the room."
  prs.a1.unit45.lesson03.teach.number_word:
    title: Number
    gloss: number
    note: "نمبر is the everyday Afghan Dari loanword for a number, used for room numbers, phone numbers, and similar."
    example_gloss: room number
  prs.a1.unit45.lesson03.teach.what_is_room_number_phrase:
    title: What is the room number?
    gloss: What is the room number?
    note: "نمبر اتاق چند است؟ asks for the room number using چند."
  prs.a1.unit45.lesson03.teach.review_night_numbers:
    title: "Review: night, two, three"
    gloss: night / two / three
    note: "شب (from unit11), دو, and سه (from unit04) are review words used to state length of stay."
  prs.a1.unit45.lesson03.teach.stay_word:
    title: I stay
    gloss: I stay
    note: "می‌مانم comes from ماندن, to stay or remain."
    example_gloss: I'm staying two nights.
  prs.a1.unit45.lesson03.teach.stay_two_nights_phrase:
    title: I'm staying two nights
    gloss: I'm staying two nights.
    note: "دو شب می‌مانم combines دو شب (two nights) and می‌مانم (I stay)."
  prs.a1.unit45.lesson03.teach.for_two_nights_phrase:
    title: I want it for two nights
    gloss: I want it for two nights.
    note: "برای دو شب می‌خواهم uses برای (for) with the review word می‌خواهم."
  prs.a1.unit45.lesson03.teach.review_stay_formal:
    title: "Review: you stay (formal)"
    gloss: you stay (formal)
    note: "می‌مانین is the formal-plural form of می‌مانم, part of the same -ین family as می‌خواهین/می‌مانین elsewhere in this course."
  prs.a1.unit45.lesson03.teach.how_many_nights_formal_phrase:
    title: How many nights are you staying?
    gloss: How many nights are you staying?
    note: "چند شب می‌مانین؟ is the formal question a hotel clerk would ask."
  prs.a1.unit45.lesson04.teach.review_welcome_name_am:
    title: "Review: welcome, what is your name?, I am"
    gloss: welcome / what is your name? / I am
    note: "خوش آمدین, نام‌تان چیست؟, and استم (from unit01/unit02) are review words used at check-in."
  prs.a1.unit45.lesson04.teach.review_also_how_about_please_thanks:
    title: "Review: also, how about, here you go, thanks a lot"
    gloss: also / how about / here you go / thanks a lot
    note: "هم, چطور, بفرمایین, and تشکر زیاد (from earlier units) are review words used to close the dialogue."
  prs.a1.unit45.lesson04.teach.breakfast_phrase:
    title: Breakfast
    gloss: breakfast
    note: "چای صبح literally means \"morning tea\" -- the everyday Afghan Dari way to say breakfast, built from چای (tea, unit08) and صبح (morning, unit16)."
  prs.a1.unit45.lesson04.teach.included_word:
    title: Included
    gloss: included
    note: "شامل means included, used to say a service comes with the room."
    example_gloss: Breakfast is included.
  prs.a1.unit45.lesson04.teach.wifi_word:
    title: Wifi
    gloss: wifi
    note: "وای‌فای is the standard loanword for wifi."
    example_gloss: It also has wifi.
  prs.a1.unit45.lesson04.teach.dialogue_line1:
    title: "Homayoun: Hello. I have a reservation. I'm staying two nights."
    gloss: Hello. I have a reservation. I'm staying two nights.
  prs.a1.unit45.lesson04.teach.dialogue_line2:
    title: "Hotel clerk: Welcome. What is your name?"
    gloss: Welcome. What is your name?
  prs.a1.unit45.lesson04.teach.dialogue_line3:
    title: "Homayoun: I am Homayoun."
    gloss: I am Homayoun.
  prs.a1.unit45.lesson04.teach.dialogue_line4:
    title: "Hotel clerk: Very good. The room has a bathroom, and breakfast is included."
    gloss: Very good. The room has a bathroom, and breakfast is included.
  prs.a1.unit45.lesson04.teach.dialogue_line5:
    title: "Homayoun: What about wifi?"
    gloss: What about wifi?
  prs.a1.unit45.lesson04.teach.dialogue_line6:
    title: "Hotel clerk: Yes, it also has wifi. Here's the key."
    gloss: Yes, it also has wifi. Here's the key.
  prs.a1.unit45.lesson05.teach.review_reading_words:
    title: "Review: reservation, number, five, Monday, Tuesday, and"
    gloss: reservation / number / five / Monday / Tuesday / and
    note: "رزرو, نمبر (from this unit), پنج (from unit04), دوشنبه, سه‌شنبه, and و (from unit09) are review words used in the reading passage."
  prs.a1.unit45.lesson05.teach.review_stays_third_person:
    title: "Review: he/she stays"
    gloss: he/she stays
    note: "می‌ماند is the 3rd-person form of the می‌مانم/می‌مانین family taught earlier in this unit."
  prs.a1.unit45.lesson05.teach.reading_passage:
    title: Reading about Homayoun's reservation
    gloss: "This is Homayoun's reservation. The room is number five. Homayoun is staying two nights: Monday and Tuesday. The room has a bathroom, and breakfast is included."
  prs.a1.unit45.lesson06.teach.review_but_formal_you_hour_time_numbers:
    title: "Review: but, you (formal), hour, time, seven, twelve"
    gloss: "but / you (formal) / hour / time / seven / twelve"
    note: "اما, شما, ساعت, وقت (from earlier units), and هفت/دوازده (from unit04) are review words used to state a schedule."
  prs.a1.unit45.lesson06.teach.checkout_word:
    title: Check-out / exit
    gloss: check-out / exit
    note: "خروج names the check-out time, as in وقت خروج."
    example_gloss: check-out time
  prs.a1.unit45.lesson06.teach.checkout_time_phrase:
    title: Check-out time is twelve o'clock
    gloss: Check-out time is twelve o'clock.
    note: "وقت خروج ساعت دوازده است names the check-out time."
  prs.a1.unit45.lesson06.teach.contrast_breakfast_checkout_phrase:
    title: "Breakfast is at seven, but check-out is at twelve"
    gloss: Breakfast is at seven, but check-out time is twelve o'clock.
    note: "اما contrasts the breakfast time and the check-out time."
  prs.a1.unit45.lesson06.teach.checkout_time_question_phrase:
    title: What is your check-out time?
    gloss: What is your check-out time?
    note: "The formal شما-prefixed version of asking about check-out time."
