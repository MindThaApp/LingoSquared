course:
  title: Dari B1
  description: >-
    Intermediate Kabul Dari: debating a topic with nuance -- conceding a
    valid point with هرچند/اگرچه ("although") before restating your own
    position with اما ("but"), and using با این حال ("nevertheless") to
    add a stronger contrastive point to a multi-part argument.

units:
  prs.b1.unit08.opinions:
    title: Debate
    description: Concede a valid point on the other side using "although," then restate your own position, and structure a multi-point argument with a stronger contrastive connector than "but."

lessons:
  prs.b1.unit08.lesson01.concession_1st2nd:
    title: "Although... but"
  prs.b1.unit08.lesson02.concession_all_persons:
    title: "Nevertheless"
  prs.b1.unit08.lesson03.agree_disagree:
    title: "Agree and disagree"
  prs.b1.unit08.lesson04.dialogue_debate:
    title: "The car debate"
  prs.b1.unit08.lesson05.reading_compromise:
    title: "Compromise"
  prs.b1.unit08.lesson06.wrapup_production:
    title: "Wrap-up"

teaching:
  prs.b1.unit08.lesson01.teach.harchand:
    title: Although
    gloss: although
    note: "هرچند means although / even though -- it introduces a conceded point."
    example_gloss: "Although petrol is expensive, I'll still buy a car."
  prs.b1.unit08.lesson01.teach.ama:
    title: But
    gloss: but
    note: "اما means but -- a slightly more formal/deliberate 'but' than ولی, used to restate your real position after a concession."
    example_gloss: "Although petrol is expensive, I'll still buy a car."
  prs.b1.unit08.lesson01.teach.grammar_concession:
    title: "The concession construction"
    gloss: "هرچند تیل گران است، اما موتر می‌خرم = although petrol is expensive, I'll still buy a car"
    note: "هرچند + clause1 concedes a real, valid point; اما + clause2 restates your own actual position -- both halves must be true statements, not a fake concession."
  prs.b1.unit08.lesson01.teach.teil:
    title: Petrol
    gloss: petrol
    note: "تیل means petrol/fuel."
    example_gloss: "Petrol is expensive."
  prs.b1.unit08.lesson01.teach.geran:
    title: Expensive
    gloss: expensive
    note: "گران means expensive."
    example_gloss: "Petrol is expensive."
  prs.b1.unit08.lesson01.teach.mikharam:
    title: I buy
    gloss: "I buy"
    note: "می‌خرم is the 1st person present of خریدن (to buy)."
    example_gloss: "Although petrol is expensive, I'll still buy a car."
  prs.b1.unit08.lesson01.teach.mikhari:
    title: You buy
    gloss: "you buy"
    note: "می‌خری is the 2nd person singular present form."
    example_gloss: "Although it's expensive, do you still buy a car?"
  prs.b1.unit08.lesson01.teach.review_moter:
    title: Car
    gloss: car
    note: "موتر means car -- an established recurring goal in this course (Homayoun's)."
    example_gloss: "Homayoun buys a car."

  prs.b1.unit08.lesson02.teach.mikharad:
    title: He/she buys
    gloss: "he/she buys"
    note: "می‌خرد is the 3rd person singular present form of خریدن."
    example_gloss: "Although petrol is expensive, Homayoun buys a car."
  prs.b1.unit08.lesson02.teach.ba_in_hal:
    title: Nevertheless
    gloss: nevertheless
    note: "با این حال means nevertheless -- a stronger contrastive connector than a plain but, used to start a new sentence that holds your point after what was just said."
    example_gloss: "Nevertheless, we should save money."
  prs.b1.unit08.lesson02.teach.grammar_ba_in_hal:
    title: "Adding a stronger second point"
    gloss: "با این حال (nevertheless) holds your point firmly after what was just said"
    note: "هرچند تیل گران است، همایون موتر می‌خرد. با این حال، باید پول جمع کنیم. (Although petrol is expensive, Homayoun buys a car. Nevertheless, we should save money.)"
  prs.b1.unit08.lesson02.teach.jam_konim:
    title: "(That) we save"
    gloss: "(that) we save/collect money"
    note: "پول جمع کنیم means that we save/collect money -- جمع کنیم is the 1st person plural subjunctive of کردن."
    example_gloss: "Nevertheless, we should save money."
  prs.b1.unit08.lesson02.teach.review_bayad:
    title: Must / should
    gloss: "must / should"
    note: "باید means must or should."
    example_gloss: "We should save money."
  prs.b1.unit08.lesson02.teach.review_homayoun:
    title: Homayoun
    gloss: Homayoun
    note: "همایون -- an established recurring character in this course."
    example_gloss: "Homayoun buys a car."
  prs.b1.unit08.lesson02.teach.review_zarmina:
    title: Zarmina
    gloss: Zarmina
    note: "زرمینه -- an established recurring character in this course."
    example_gloss: "Zarmina thinks we should save money."

  prs.b1.unit08.lesson03.teach.movafeq_astam:
    title: I agree
    gloss: "I agree"
    note: "موافق استم means I agree."
    example_gloss: "I agree with this opinion."
  prs.b1.unit08.lesson03.teach.mokhalef_astam:
    title: I disagree
    gloss: "I disagree"
    note: "مخالف استم means I disagree."
    example_gloss: "I disagree, but I understand your reason."
  prs.b1.unit08.lesson03.teach.mifahmam:
    title: I understand
    gloss: "I understand"
    note: "می‌فهمم means I understand."
    example_gloss: "I understand your reason."
  prs.b1.unit08.lesson03.teach.agarche:
    title: Although
    gloss: although
    note: "اگرچه means the same as هرچند (although) -- both are correct and interchangeable."
    example_gloss: "Although I disagree, I understand your reason."
  prs.b1.unit08.lesson03.teach.grammar_variant:
    title: "اگرچه as a variant of هرچند"
    gloss: "اگرچه and هرچند both mean although, and are interchangeable"
    note: "من مخالف استم اما دلیل شما را می‌فهمم = I disagree, but I understand your reason -- a short concession works with just اما too, without هرچند/اگرچه, when the conceded point is brief."
  prs.b1.unit08.lesson03.teach.review_dalil:
    title: Reason
    gloss: reason
    note: "دلیل means reason."
    example_gloss: "I understand your reason."
  prs.b1.unit08.lesson03.teach.review_shoma:
    title: You
    gloss: you
    note: "شما is the polite/plural form of you."
    example_gloss: "I understand your reason."
  prs.b1.unit08.lesson03.teach.review_ra:
    title: "(object marker)"
    gloss: "(object marker)"
    note: "را marks the direct object."
    example_gloss: "I understand your reason."
  prs.b1.unit08.lesson03.teach.review_man:
    title: I
    gloss: I
    note: "من means I."
    example_gloss: "I disagree."
  prs.b1.unit08.lesson03.teach.review_nazar:
    title: Opinion
    gloss: opinion
    note: "نظر means opinion."
    example_gloss: "I agree with this opinion."

  prs.b1.unit08.lesson04.teach.zarurat_daram:
    title: I need it
    gloss: "I need (it)"
    note: "ضرورت دارم means I need (it) -- ضرورت (necessity) + دارم (I have)."
    example_gloss: "I need this car right now."
  prs.b1.unit08.lesson04.teach.ajala_nakonim:
    title: "Let's not rush"
    gloss: "let's not rush"
    note: "عجله نکنیم means let's not rush -- نکنیم negates the 1st person plural subjunctive کنیم."
    example_gloss: "I think it's better if we don't rush."
  prs.b1.unit08.lesson04.teach.fekr_mikonam:
    title: I think
    gloss: "I think"
    note: "فکر می‌کنم means I think."
    example_gloss: "I think it's better if we don't rush."
  prs.b1.unit08.lesson04.teach.negaran_astam:
    title: I'm worried
    gloss: "I'm worried"
    note: "نگران استم means I'm worried."
    example_gloss: "Although I'm worried, I agree."
  prs.b1.unit08.lesson04.teach.bashad:
    title: Okay / alright
    gloss: "okay / alright"
    note: "باشد means okay / alright, used to accept an outcome."
    example_gloss: "Okay, I agree."
  prs.b1.unit08.lesson04.teach.review_be_nazar_man:
    title: "In my opinion"
    gloss: "in my opinion"
    note: "به نظر من means in my opinion."
    example_gloss: "In my opinion, we should save more money."
  prs.b1.unit08.lesson04.teach.review_chon:
    title: Because
    gloss: because
    note: "چون means because."
    example_gloss: "I go to work, because I need it."
  prs.b1.unit08.lesson04.teach.review_mohem:
    title: Important
    gloss: important
    note: "مهم means important."
    example_gloss: "Time is important."
  prs.b1.unit08.lesson04.teach.review_bishtar:
    title: More
    gloss: more
    note: "بیشتر means more."
    example_gloss: "We should save more money."
  prs.b1.unit08.lesson04.teach.review_awal:
    title: First
    gloss: first
    note: "اول means first."
    example_gloss: "We should save money first."
  prs.b1.unit08.lesson04.teach.review_che2:
    title: What
    gloss: what
    note: "چه means what."
    example_gloss: "What should they do first?"
  prs.b1.unit08.lesson04.teach.konand:
    title: "(that) they do"
    gloss: "(that) they do"
    note: "کنند is the 3rd person plural subjunctive of کردن (to do)."
    example_gloss: "What should they do first?"
  prs.b1.unit08.lesson04.teach.review_hala:
    title: Now
    gloss: now
    note: "حالا means now."
    example_gloss: "I need it right now."
  prs.b1.unit08.lesson04.teach.review_hamin:
    title: "This very / right"
    gloss: "this very / right"
    note: "همین intensifies حالا -- همین حالا means right now, this very moment."
    example_gloss: "I need it right now."
  prs.b1.unit08.lesson04.teach.dialogue_zarmina_open:
    title: "In my opinion, we should save more money. Petrol is expensive."
    gloss: "In my opinion, we should save more money. Petrol is expensive."
    note: "Zarmina opens the debate with her position and reason."
  prs.b1.unit08.lesson04.teach.dialogue_homayoun_concede:
    title: "Although petrol is expensive, I need this car right now, because I commute to work."
    gloss: "Although petrol is expensive, I need this car right now, because I commute to work."
    note: "Homayoun concedes Zarmina's point (petrol cost) before restating his own position."
  prs.b1.unit08.lesson04.teach.dialogue_zarmina_counter:
    title: "Nevertheless, I think it's better if we don't rush."
    gloss: "Nevertheless, I think it's better if we don't rush."
    note: "Zarmina adds a further point with با این حال."
  prs.b1.unit08.lesson04.teach.dialogue_homayoun_reply:
    title: "I understand your reason, but time is important."
    gloss: "I understand your reason, but time is important."
    note: "Homayoun acknowledges her reason without abandoning his position."
  prs.b1.unit08.lesson04.teach.dialogue_zarmina_concede:
    title: "Okay, although I'm worried, I agree."
    gloss: "Okay, although I'm worried, I agree."
    note: "Zarmina concedes in turn, stating her real feeling (worry) alongside her agreement."

  prs.b1.unit08.lesson05.teach.bahs_kardand:
    title: They debated
    gloss: "they debated"
    note: "بحث کردند means they debated/discussed."
    example_gloss: "Zarmina and Homayoun debated about buying a car."
  prs.b1.unit08.lesson05.teach.movafeqat_kardand:
    title: They agreed
    gloss: "they agreed"
    note: "موافقت کردند means they agreed."
    example_gloss: "They agreed to buy a cheaper car."
  prs.b1.unit08.lesson05.teach.arzantar:
    title: Cheaper
    gloss: cheaper
    note: "ارزان‌تر means cheaper."
    example_gloss: "They agreed to buy a cheaper car."
  prs.b1.unit08.lesson05.teach.dareye:
    title: About
    gloss: about
    note: "دربارهٔ means about/concerning."
    example_gloss: "They debated about buying a car."
  prs.b1.unit08.lesson05.teach.khared:
    title: Buying
    gloss: buying
    note: "خرید means buying/purchase."
    example_gloss: "They debated about buying a car."
  prs.b1.unit08.lesson05.teach.bekharand:
    title: "(that) they buy"
    gloss: "(that) they buy"
    note: "بخرند is the 3rd person plural subjunctive of خریدن."
    example_gloss: "They agreed to buy a cheaper car."
  prs.b1.unit08.lesson05.teach.review_chera:
    title: Why
    gloss: why
    note: "چرا means why."
    example_gloss: "Why did Zarmina say they should save more money?"
  prs.b1.unit08.lesson05.teach.review_anha:
    title: They
    gloss: they
    note: "آنها means they."
    example_gloss: "They agreed."
  prs.b1.unit08.lesson05.teach.review_ke:
    title: That
    gloss: that
    note: "که introduces a subordinate clause -- here, what they agreed to do."
    example_gloss: "They agreed to buy a cheaper car."
  prs.b1.unit08.lesson05.teach.review_yek:
    title: "A / one"
    gloss: "a / one"
    note: "یک means one, used here like the English indefinite article 'a'."
    example_gloss: "They agreed to buy a cheaper car."
  prs.b1.unit08.lesson05.teach.review_va:
    title: And
    gloss: and
    note: "و means and."
    example_gloss: "Zarmina and Homayoun debated."
  prs.b1.unit08.lesson05.teach.reading_passage:
    title: Compromise
    gloss: "Zarmina and Homayoun debated about buying a car. Zarmina said they should save more money, because petrol is expensive. Homayoun said that although petrol is expensive, he needs a car right now. Nevertheless, they agreed to buy a cheaper car."
    note: "A short reading resolving the debate with a genuine compromise, reusing this unit's established characters."

  prs.b1.unit08.lesson06.teach.grammar_review:
    title: "Review: concession and nuance"
    gloss: "Concede with هرچند/اگرچه + clause, then restate with اما + clause. Hold your point with با این حال. موافق/مخالف استم states your position; می‌فهمم acknowledges the other side."
    note: "This lesson reviews and combines everything from lessons 1-5."
  prs.b1.unit08.lesson06.teach.review_nazar:
    title: Opinion
    gloss: opinion
    note: "نظر means opinion."
    example_gloss: "In my opinion, this opinion is good."

