course:
  title: Dari A2
  description: >-
    Lower-intermediate Afghan Dari: a doctor's visit — vocabulary,
    describing a symptom in detail, reading an appointment confirmation,
    and the visit itself.

units:
  prs.a2.unit12.doctor:
    title: Going to the doctor

lessons:
  prs.a2.unit12.lesson01.doctor_vocabulary: {title: "Words for a doctor's visit"}
  prs.a2.unit12.lesson02.describing_a_symptom: {title: "Describing a symptom"}
  prs.a2.unit12.lesson03.reading_an_appointment_confirmation: {title: "Reading an appointment confirmation"}
  prs.a2.unit12.lesson04.doctor_visit_dialogue: {title: "The doctor's visit"}

teaching:
  prs.a2.unit12.lesson01.teach.symptom_word:
    title: "Symptom"
    gloss: "symptom"
    note: "*علامت* is the general word for a symptom or sign of illness."
    example_gloss: "Bashir's symptom is a headache."
  prs.a2.unit12.lesson01.teach.duration_word:
    title: "Duration"
    gloss: "duration / length of time"
    note: "*مدت* asks or states how long something has lasted."
    example_gloss: "The duration of my illness is two days."
  prs.a2.unit12.lesson01.teach.severe_word:
    title: "Severe"
    gloss: "severe / intense"
    note: "*شدید* describes a strong or severe symptom."
    example_gloss: "My headache is very severe."
  prs.a2.unit12.lesson01.teach.exam_word:
    title: "Medical test"
    gloss: "medical test / exam"
    note: "*آزمایش* is a medical test, such as a blood test."
    example_gloss: "The doctor wants a blood test."
  prs.a2.unit12.lesson01.teach.prescription_slip_word:
    title: "Prescription"
    gloss: "prescription (the written slip)"
    note: "*نسخه* is the written prescription slip itself."
    example_gloss: "The doctor wrote me a prescription."
  prs.a2.unit12.lesson01.teach.prescribe_word:
    title: "To prescribe"
    gloss: "to prescribe"
    note: "*تجویز* is the act of prescribing a medicine or treatment."
    example_gloss: "The doctor prescribed a new medicine."
  prs.a2.unit12.lesson01.teach.since_ago_grammar:
    title: "Since ... ago, with از ... پیش"
    gloss: "since two days ago"
    note: "*از ... پیش* -- 'since ... ago' -- this unit's A2-level grammar step for stating how long a symptom has lasted."

  prs.a2.unit12.lesson02.teach.headache_severe_since:
    title: "Describe a severe, ongoing symptom"
    gloss: "My headache is very severe and started two days ago."
    note: "Combines *شدید* (severe) with the *از ... پیش* duration pattern."
  prs.a2.unit12.lesson02.teach.need_test_question:
    title: "Ask if a test is needed"
    gloss: "For this problem, do I need a test?"
    note: "*آیا* marks a yes/no question; *باید* -- already established -- means 'need to'."
  prs.a2.unit12.lesson02.teach.take_medicine_twice:
    title: "Say how to take the medicine"
    gloss: "I need to take this medicine twice a day."
    note: "*روزی دو بار* means 'twice a day' -- literally 'two times per day'."

  prs.a2.unit12.lesson03.teach.confirmation_word:
    title: "Confirmation"
    gloss: "confirmation"
    note: "*تاییدی* is a written confirmation, such as of an appointment."
    example_gloss: "My appointment confirmation arrived."
  prs.a2.unit12.lesson03.teach.checkup_word:
    title: "Examination / check-up"
    gloss: "examination / check-up"
    note: "*معاینه* is the doctor's physical examination itself."
    example_gloss: "The doctor did a brief examination."
  prs.a2.unit12.lesson03.teach.notice_text:
    title: "An appointment confirmation notice"
    gloss: "Your doctor's appointment is Wednesday at nine in the morning. Please bring your national ID booklet. If you can't come, call one day ahead."
    note: "A short official appointment notice, in the formal written register this unit is teaching."

  prs.a2.unit12.lesson04.teach.turn01:
    title: "The doctor greets بشیر"
    gloss: "The doctor greets him and asks what problem he has."
    note: "*چطور استین؟* reuses the already-established greeting question."
  prs.a2.unit12.lesson04.teach.turn02:
    title: "بشیر greets back and names his symptom"
    gloss: "He greets the doctor respectfully and says his headache is very severe."
    note: "*داکتر صاحب* is the respectful Afghan address form for a doctor."
  prs.a2.unit12.lesson04.teach.turn03:
    title: "The doctor asks since when"
    gloss: "The doctor asks since when it started."
    note: "*از کی...؟* -- already established -- asks 'since when'."
  prs.a2.unit12.lesson04.teach.turn04:
    title: "بشیر answers"
    gloss: "Since two days ago."
    note: "Uses this unit's new *از ... پیش* duration pattern."
  prs.a2.unit12.lesson04.teach.turn05:
    title: "The doctor asks about fever"
    gloss: "The doctor also asks if he has a fever."
    note: "*آیا ... هم ...؟* asks 'also, is there...?'."
  prs.a2.unit12.lesson04.teach.turn06:
    title: "بشیر confirms a slight fever"
    gloss: "Yes, he has a slight fever."
    note: "*یک‌کمی* means 'a little bit'."
  prs.a2.unit12.lesson04.teach.turn07:
    title: "The doctor gives instructions"
    gloss: "He needs to take this medicine twice a day. If he doesn't get better, he should come back."
    note: "*اگر بهتر نشدین، دوباره بیایین* -- 'if you don't get better, come again' -- reuses this realization's own established *اگر* conditional pattern from unit11."
  prs.a2.unit12.lesson04.teach.turn08:
    title: "بشیر thanks the doctor"
    gloss: "بشیر thanks the doctor respectfully."
    note: "Reuses *داکتر صاحب* from turn02."

exercises:
  prs.a2.unit12.lesson01.exercise01.recognize_symptom:
    instruction: "What does this word mean?"
    correct_option: "symptom"
    distractors: ["duration", "severe", "prescription"]
    accepted_answers: [{value: "symptom", status: correct}]
    feedback: "*علامت* means symptom."
  prs.a2.unit12.lesson01.exercise02.recognize_severe:
    instruction: "What does this word mean?"
    correct_option: "severe"
    distractors: ["duration", "medical test", "to prescribe"]
    accepted_answers: [{value: "severe", status: correct}]
    feedback: "*شدید* means severe."
  prs.a2.unit12.lesson01.exercise03.match_doctor_words:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - {value: {علامت: symptom, مدت: duration, شدید: severe, آزمایش: "medical test", نسخه: prescription, تجویز: "to prescribe"}, status: correct}
    feedback: "These six words cover the basic vocabulary for this unit's doctor's visit."
  prs.a2.unit12.lesson01.exercise04.order_since_two_days:
    instruction: "Arrange the words to say since two days ago."
    accepted_answers: [{value: [از, دو, روز, پیش], status: correct}]
    feedback: "*از دو روز پیش* means 'since two days ago'."
  prs.a2.unit12.lesson01.exercise05.write_prescription:
    instruction: "Write the Dari word for a prescription."
    accepted_answers:
      - {value: نسخه, status: correct}
    feedback: "*نسخه* means prescription."

  prs.a2.unit12.lesson02.exercise01.recognize_headache_severe_since:
    instruction: "Which sentence describes a severe, two-day-old headache?"
    correct_option: "My headache is very severe and started two days ago."
    distractors: ["Do I need a test?", "I need to take this medicine twice a day.", "The duration of my illness is two days."]
    accepted_answers: [{value: "My headache is very severe and started two days ago.", status: correct}]
    feedback: "*سردردم خیلی شدید است و از دو روز پیش شروع شده.* describes both the severity and the duration."
  prs.a2.unit12.lesson02.exercise02.order_take_medicine_twice:
    instruction: "Arrange the words to say you need to take this medicine twice a day."
    accepted_answers: [{value: [باید, این, دوا, را, روزی, دو, بار, بخورم], status: correct}]
    feedback: "*باید این دوا را روزی دو بار بخورم.* states the instruction."
  prs.a2.unit12.lesson02.exercise03.dialogue_response_describe_problem:
    instruction: "The doctor asks: 'What problem do you have?' Describe your severe headache and when it started."
    accepted_answers:
      - {value: "سردردم خیلی شدید است و از دو روز پیش شروع شده.", status: correct}
      - {value: "سردردم خیلی شدید است. از دو روز پیش شروع شده.", status: correct}
      - {value: "سردردم خیلی شدید است، از دو روز پیش شروع شده.", status: correct}
    feedback: "Joining the severity and the duration with *و*, a period, or a comma are equally natural."
  prs.a2.unit12.lesson02.exercise04.translate_need_test:
    instruction: "Translate: Do I need a test?"
    accepted_answers:
      - {value: "آیا باید آزمایش بدهم؟", status: correct}
      - {value: "آیا باید آزمایش بدهم", status: correct}
    feedback: "*آیا باید آزمایش بدهم؟* asks whether a test is needed."
  prs.a2.unit12.lesson02.exercise05.write_take_medicine_twice:
    instruction: "Write that you need to take this medicine twice a day."
    accepted_answers:
      - {value: "باید این دوا را روزی دو بار بخورم.", status: correct}
      - {value: "باید این دوا را روزی دو بار بخورم", status: correct}
    feedback: "*باید این دوا را روزی دو بار بخورم.* states the instruction."

  prs.a2.unit12.lesson03.exercise01.read_appointment_day:
    instruction: "According to the notice, what day and time is the appointment?"
    correct_option: "Wednesday at nine in the morning"
    distractors: ["Wednesday at nine at night", "Thursday at nine in the morning", "Wednesday at ten in the morning"]
    accepted_answers: [{value: "Wednesday at nine in the morning", status: correct}]
    feedback: "*نوبت داکتر شما روز چهارشنبه ساعت نه صبح است* -- Wednesday at nine in the morning."
  prs.a2.unit12.lesson03.exercise02.read_what_to_bring:
    instruction: "According to the notice, what should you bring to the appointment?"
    correct_option: "national ID booklet"
    distractors: ["a rent receipt", "a passport", "nothing"]
    accepted_answers: [{value: "national ID booklet", status: correct}]
    feedback: "The notice asks you to bring your *تذکره*."
  prs.a2.unit12.lesson03.exercise03.recognize_confirmation_word:
    instruction: "What does this word mean?"
    correct_option: "confirmation"
    distractors: ["examination", "symptom", "duration"]
    accepted_answers: [{value: "confirmation", status: correct}]
    feedback: "*تاییدی* means confirmation."
  prs.a2.unit12.lesson03.exercise04.order_appointment_day:
    instruction: "Arrange the words to say your doctor's appointment is Wednesday at nine in the morning."
    accepted_answers: [{value: [نوبت, داکتر, شما, روز, چهارشنبه, ساعت, نه, صبح, است], status: correct}]
    feedback: "*نوبت داکتر شما روز چهارشنبه ساعت نه صبح است* states the appointment, matching the notice exactly."
  prs.a2.unit12.lesson03.exercise05.write_call_if_cannot_come:
    instruction: "Write that if you can't come, you should call one day ahead."
    accepted_answers:
      - {value: "اگر نتوانین بیایین، یک روز پیش زنگ بزنین.", status: correct}
      - {value: "اگر نتوانین بیایین. یک روز پیش زنگ بزنین.", status: correct}
      - {value: "اگر نتوانین بیایین و یک روز پیش زنگ بزنین", status: correct}
    feedback: "Joining the condition and instruction with a comma, a period, or *و* are equally natural."

  prs.a2.unit12.lesson04.exercise01.comprehend_since_when:
    instruction: "Since when has بشیر had his headache?"
    correct_option: "since two days ago"
    distractors: ["since yesterday", "since one week ago", "since this morning"]
    accepted_answers: [{value: "since two days ago", status: correct}]
    feedback: "*از دو روز پیش* -- since two days ago."
  prs.a2.unit12.lesson04.exercise02.comprehend_medicine_instructions:
    instruction: "How often should بشیر take the medicine?"
    correct_option: "twice a day"
    distractors: ["once a day", "three times a day", "once a week"]
    accepted_answers: [{value: "twice a day", status: correct}]
    feedback: "*روزی دو بار* -- twice a day."
  prs.a2.unit12.lesson04.exercise03.recognize_other_symptom:
    instruction: "Besides the headache, what other symptom does بشیر mention?"
    correct_option: "a slight fever"
    distractors: ["a stomach ache", "a cough", "no other symptom"]
    accepted_answers: [{value: "a slight fever", status: correct}]
    feedback: "*یک‌کمی تب دارم* -- I have a slight fever."
  prs.a2.unit12.lesson04.exercise04.order_since_when_question:
    instruction: "Arrange the words to ask since when a symptom started."
    accepted_answers: [{value: [از, کی, شروع, شده], status: correct}]
    feedback: "*از کی شروع شده؟* asks since when."
  prs.a2.unit12.lesson04.exercise05.dialogue_response_as_bashir:
    instruction: "The doctor asks: 'How are you? What problem do you have?' Answer as بشیر, greeting the doctor respectfully and naming your symptom."
    accepted_answers:
      - {value: "سلام داکتر صاحب. سردردم خیلی شدید است.", status: correct}
      - {value: "سلام داکتر صاحب، سردردم خیلی شدید است.", status: correct}
    feedback: "*سلام داکتر صاحب. سردردم خیلی شدید است.* greets the doctor and names the symptom; a comma joins just as naturally as a period."
  prs.a2.unit12.lesson04.exercise06.write_doctor_instruction:
    instruction: "Write, quoting the doctor, how often to take the medicine."
    accepted_answers:
      - {value: "باید این دوا را روزی دو بار بخورین.", status: correct}
      - {value: "باید این دوا را روزی دو بار بخورین", status: correct}
    feedback: "*باید این دوا را روزی دو بار بخورین.* is the doctor's own instruction, quoted directly."
