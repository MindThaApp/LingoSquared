course:
  title: Dari A1
  description: >-
    Beginner Kabul Dari: simple past tense for three common verbs
    (go, eat, do/work), reading short and then longer yesterday-
    recap texts, and a dialogue asking what someone did yesterday.

units:
  prs.a1.unit20.past_events:
    title: Yesterday's activities
    description: Describe what you did yesterday using simple past tense.

lessons:
  prs.a1.unit20.lesson01.yesterday_went:
    title: "Yesterday I went"
  prs.a1.unit20.lesson02.i_ate:
    title: "I ate"
  prs.a1.unit20.lesson03.i_worked:
    title: "I worked"
  prs.a1.unit20.lesson04.reading_yesterday:
    title: "Reading about yesterday"
  prs.a1.unit20.lesson05.reading_longer_yesterday:
    title: "Reading a fuller day"
  prs.a1.unit20.lesson06.yesterday_dialogue:
    title: "A dialogue about yesterday"

teaching:
  prs.a1.unit20.lesson01.teach.yesterday_word:
    title: Yesterday
    gloss: yesterday
    note: "دیروز means yesterday."
    example_gloss: "Yesterday I went."
  prs.a1.unit20.lesson01.teach.office_word:
    title: "To the office"
    gloss: "to the office"
    note: "به دفتر means to the office -- already familiar from the daily-routines unit."
    example_gloss: "I went to the office."
  prs.a1.unit20.lesson01.teach.went_word:
    title: "I went"
    gloss: "I went"
    note: "رفتم is the first-person simple past of رفتن (to go)."
  prs.a1.unit20.lesson02.teach.breakfast_word:
    title: Breakfast
    gloss: breakfast
    note: "صبحانه means breakfast -- already familiar from the daily-routines unit."
    example_gloss: "I ate breakfast."
  prs.a1.unit20.lesson02.teach.ate_word:
    title: "I ate"
    gloss: "I ate"
    note: "خوردم is the first-person simple past of خوردن (to eat)."
  prs.a1.unit20.lesson03.teach.work_word:
    title: Work
    gloss: work
    note: "کار means work (the noun)."
    example_gloss: "I worked."
  prs.a1.unit20.lesson03.teach.did_word:
    title: "I did"
    gloss: "I did / I made"
    note: "کردم is the first-person simple past of کردن (to do/make) -- کار کردم literally means 'I did work,' i.e. I worked."
  prs.a1.unit20.lesson04.teach.yesterday_text:
    title: "A short yesterday account"
    gloss: "Yesterday I went to the office. I ate breakfast. I worked."
    note: "A short first-person account of what the writer did yesterday, combining this lesson's new past-tense verbs."
  prs.a1.unit20.lesson05.teach.seven_oclock:
    title: "Seven o'clock"
    gloss: "seven o'clock"
    note: "ساعت هفت means seven o'clock -- already familiar from the time and routines units."
    example_gloss: "I went at seven o'clock."
  prs.a1.unit20.lesson05.teach.tired_word:
    title: Tired
    gloss: tired
    note: "خسته means tired."
    example_gloss: "I got tired."
  prs.a1.unit20.lesson05.teach.became_word:
    title: "I became"
    gloss: "I became / I got"
    note: "شدم is the first-person simple past of شدن (to become) -- the same verb as in بیدار می‌شوم (I wake up) from the daily-routines unit. خسته شدم literally means 'I became tired,' i.e. I got tired."
  prs.a1.unit20.lesson05.teach.longer_yesterday_text:
    title: "A longer yesterday account"
    gloss: "Yesterday at seven o'clock I went to the office. I ate breakfast. I worked. I got tired."
    note: "The same account as lesson04, extended with a specific time and how the writer felt afterward."
  prs.a1.unit20.lesson06.teach.names:
    title: "Zarmina and Homayoun"
    gloss: "Zarmina, Homayoun"
    note: "Recurring characters in this course, first introduced in the time and daily-routines units."
    example_gloss: ["I am Zarmina.", "I am Homayoun."]
  prs.a1.unit20.lesson06.teach.where_word:
    title: Where
    gloss: where
    note: "کجا means where."
  prs.a1.unit20.lesson06.teach.you_went_word:
    title: "You went"
    gloss: "you went"
    note: "رفتی is the second-person simple past of رفتن (to go)."
  prs.a1.unit20.lesson06.teach.you_worked_word:
    title: "You worked"
    gloss: "you did / you worked"
    note: "کردی is the second-person simple past of کردن (to do/make)."
  prs.a1.unit20.lesson06.teach.she_went_word:
    title: "She/he went"
    gloss: "she went / he went"
    note: "رفت is the third-person simple past of رفتن -- the bare past stem, with no ending."
  prs.a1.unit20.lesson06.teach.she_worked_word:
    title: "She/he worked"
    gloss: "she did / worked / he did / worked"
    note: "کرد is the third-person simple past of کردن -- the bare past stem."
  prs.a1.unit20.lesson06.teach.she_became_word:
    title: "She/he became"
    gloss: "she became / he became"
    note: "شد is the third-person simple past of شدن -- the bare past stem."
  prs.a1.unit20.lesson06.teach.yes_word:
    title: "Yes"
    gloss: "yes"
    note: "بلی is the polite/formal word for yes, consistent with this course's register."
    example_gloss: "Yes, I worked."
  prs.a1.unit20.lesson06.teach.dialogue_line1:
    title: "Homayoun asks"
    gloss: "Zarmina, where did you go yesterday?"
  prs.a1.unit20.lesson06.teach.dialogue_line2:
    title: "Zarmina answers"
    gloss: "I went to the office."
  prs.a1.unit20.lesson06.teach.dialogue_line3:
    title: "Homayoun asks"
    gloss: "Did you work?"
  prs.a1.unit20.lesson06.teach.dialogue_line4:
    title: "Zarmina answers"
    gloss: "Yes, I worked. I got tired."

exercises:
  prs.a1.unit20.lesson01.exercise01.recognize_yesterday:
    instruction: "What does this word mean?"
    correct_option: yesterday
    distractors: [today, tomorrow, work]
    accepted_answers: [{value: yesterday, status: correct}]
    feedback: "دیروز means yesterday."
  prs.a1.unit20.lesson01.exercise02.recognize_i_went:
    instruction: "What does this sentence mean?"
    correct_option: "Yesterday I went to the office"
    distractors: ["I go to the office", "Yesterday I ate breakfast", "I have an office"]
    accepted_answers: [{value: "Yesterday I went to the office", status: correct}]
    feedback: "دیروز به دفتر رفتم means yesterday I went to the office."
  prs.a1.unit20.lesson01.exercise03.match_yesterday_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {دیروز: yesterday, "به دفتر": "to the office", رفتم: "I went", امروز: today, فردا: tomorrow, ساعت: "hour / clock", خانه: "house / home"}
        status: correct
    feedback: "These are this lesson's core words, plus time and place words from earlier units useful for narrating a day."
  prs.a1.unit20.lesson01.exercise04.translate_yesterday_i_went:
    instruction: "Translate into Dari: Yesterday I went."
    accepted_answers:
      - {value: "دیروز رفتم", status: correct}
      - {value: "من دیروز رفتم", status: correct}
    feedback: "دیروز رفتم means yesterday I went."
  prs.a1.unit20.lesson01.exercise05.translate_i_went_to_the_office:
    instruction: "Translate into Dari: I went to the office."
    accepted_answers:
      - {value: "به دفتر رفتم", status: correct}
      - {value: "من به دفتر رفتم", status: correct}
    feedback: "به دفتر رفتم means I went to the office."
  prs.a1.unit20.lesson02.exercise01.recognize_breakfast:
    instruction: "What does this word mean?"
    correct_option: breakfast
    distractors: [yesterday, work, office]
    accepted_answers: [{value: breakfast, status: correct}]
    feedback: "صبحانه means breakfast."
  prs.a1.unit20.lesson02.exercise02.recognize_i_ate_breakfast:
    instruction: "What does this sentence mean?"
    correct_option: "I ate breakfast"
    distractors: ["I ate at the office", "I went to the office", "I have breakfast (right now)"]
    accepted_answers: [{value: "I ate breakfast", status: correct}]
    feedback: "صبحانه خوردم means I ate breakfast."
  prs.a1.unit20.lesson02.exercise03.match_ate_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {صبحانه: breakfast, خوردم: "I ate", دیروز: yesterday, "به دفتر": "to the office", رفتم: "I went", نان: bread, چای: tea}
        status: correct
    feedback: "These combine lesson02's new words with lesson01's review vocabulary, plus breakfast foods from the food unit."
  prs.a1.unit20.lesson02.exercise04.translate_i_ate_breakfast:
    instruction: "Translate into Dari: I ate breakfast."
    accepted_answers:
      - {value: "صبحانه خوردم", status: correct}
      - {value: "من صبحانه خوردم", status: correct}
    feedback: "صبحانه خوردم means I ate breakfast."
  prs.a1.unit20.lesson02.exercise05.translate_yesterday_i_ate_breakfast:
    instruction: "Translate into Dari: Yesterday I ate breakfast."
    accepted_answers:
      - {value: "دیروز صبحانه خوردم", status: correct}
      - {value: "من دیروز صبحانه خوردم", status: correct}
    feedback: "دیروز صبحانه خوردم means yesterday I ate breakfast."
  prs.a1.unit20.lesson03.exercise01.recognize_work:
    instruction: "What does this word mean?"
    correct_option: work
    distractors: [breakfast, yesterday, office]
    accepted_answers: [{value: work, status: correct}]
    feedback: "کار means work."
  prs.a1.unit20.lesson03.exercise02.recognize_i_worked:
    instruction: "What does this sentence mean?"
    correct_option: "I worked"
    distractors: ["I ate breakfast", "I went to the office", "I work (right now)"]
    accepted_answers: [{value: "I worked", status: correct}]
    feedback: "کار کردم literally means 'I did work,' i.e. I worked."
  prs.a1.unit20.lesson03.exercise03.match_worked_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {کار: work, کردم: "I did / I worked (with کار)", صبحانه: breakfast, خوردم: "I ate", دیروز: yesterday, رفتم: "I went"}
        status: correct
    feedback: "These combine lesson03's new words with earlier review vocabulary."
  prs.a1.unit20.lesson03.exercise04.translate_i_worked:
    instruction: "Translate into Dari: I worked."
    accepted_answers:
      - {value: "کار کردم", status: correct}
      - {value: "من کار کردم", status: correct}
    feedback: "کار کردم means I worked."
  prs.a1.unit20.lesson03.exercise05.translate_yesterday_i_worked:
    instruction: "Translate into Dari: Yesterday I worked."
    accepted_answers:
      - {value: "دیروز کار کردم", status: correct}
      - {value: "من دیروز کار کردم", status: correct}
    feedback: "دیروز کار کردم means yesterday I worked."
  prs.a1.unit20.lesson04.exercise01.reading_comprehension_where_went:
    instruction: "Read the text. Where did the writer go?"
    correct_option: "To the office"
    distractors: ["Home", "Nowhere -- it isn't stated", "To eat breakfast"]
    accepted_answers: [{value: "To the office", status: correct}]
    feedback: "The text says به دفتر رفتم -- I went to the office."
  prs.a1.unit20.lesson04.exercise02.reading_comprehension_what_ate:
    instruction: "Read the text. What did the writer eat?"
    correct_option: Breakfast
    distractors: ["It isn't stated", Dinner, Lunch]
    accepted_answers: [{value: Breakfast, status: correct}]
    feedback: "The text says صبحانه خوردم -- I ate breakfast."
  prs.a1.unit20.lesson04.exercise03.match_reading_vocab:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {دیروز: yesterday, "به دفتر": "to the office", رفتم: "I went", صبحانه: breakfast, خوردم: "I ate", کار: work, کردم: "I did / I worked"}
        status: correct
    feedback: "These are the reading's key words."
  prs.a1.unit20.lesson04.exercise04.translate_full_yesterday_sentence:
    instruction: "Translate into Dari: Yesterday I went to the office."
    accepted_answers:
      - {value: "دیروز به دفتر رفتم", status: correct}
      - {value: "من دیروز به دفتر رفتم", status: correct}
    feedback: "دیروز به دفتر رفتم means yesterday I went to the office."
  prs.a1.unit20.lesson04.exercise05.write_own_yesterday_sentence:
    instruction: "Write one sentence in Dari about something you did yesterday, using this unit's vocabulary."
    accepted_answers:
      - {value: "دیروز صبحانه خوردم", status: correct}
      - {value: "دیروز به دفتر رفتم", status: correct}
      - {value: "دیروز کار کردم", status: correct}
      - {value: "دیروز رفتم", status: correct}
    feedback: "دیروز صبحانه خوردم means yesterday I ate breakfast -- a good model answer. Any true past-tense sentence using this unit's vocabulary is equally accepted."
  prs.a1.unit20.lesson05.exercise01.reading_comprehension_what_time:
    instruction: "Read the text. What time did the writer go to the office?"
    correct_option: "Seven o'clock"
    distractors: ["Six o'clock", "Eight o'clock", "It isn't stated"]
    accepted_answers: [{value: "Seven o'clock", status: correct}]
    feedback: "The text says ساعت هفت به دفتر رفتم -- I went to the office at seven o'clock."
  prs.a1.unit20.lesson05.exercise02.reading_comprehension_how_felt:
    instruction: "Read the text. How did the writer feel at the end of the day?"
    correct_option: Tired
    distractors: [Happy, Hungry, "It isn't stated"]
    accepted_answers: [{value: Tired, status: correct}]
    feedback: "The text says خسته شدم -- I got tired."
  prs.a1.unit20.lesson05.exercise03.match_longer_yesterday_vocab:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {"ساعت هفت": "seven o'clock", خسته: tired, شدم: "I became", کار: work, کردم: "I did / I worked", صبحانه: breakfast, خوردم: "I ate"}
        status: correct
    feedback: "These combine lesson05's new words with earlier review vocabulary."
  prs.a1.unit20.lesson05.exercise04.reading_comprehension_full_check:
    instruction: "Read the text. Which of these is true?"
    correct_option: "The writer went to the office at seven, ate breakfast, worked, and got tired"
    distractors: ["The writer went to the office at six and had dinner", "The writer stayed home all day", "The writer ate breakfast but did not work"]
    accepted_answers: [{value: "The writer went to the office at seven, ate breakfast, worked, and got tired", status: correct}]
    feedback: "دیروز ساعت هفت به دفتر رفتم. صبحانه خوردم. کار کردم. خسته شدم -- yesterday I went to the office at seven, ate breakfast, worked, and got tired."
  prs.a1.unit20.lesson05.exercise05.write_own_longer_yesterday:
    instruction: "Write two or three sentences in Dari about your day yesterday: what time you went somewhere, and how you felt afterward."
    accepted_answers:
      - {value: "ساعت هفت رفتم. کار کردم. خسته شدم", status: correct}
      - {value: "ساعت هفت رفتم، کار کردم. خسته شدم", status: correct}
      - {value: "ساعت هفت رفتم و کار کردم. خسته شدم", status: correct}
      - {value: "ساعت هفت رفتم. کار کردم، خسته شدم", status: correct}
      - {value: "ساعت هفت رفتم. کار کردم و خسته شدم", status: correct}
      - {value: "ساعت هفت رفتم، کار کردم، خسته شدم", status: correct}
      - {value: "ساعت هفت رفتم، کار کردم و خسته شدم", status: correct}
      - {value: "ساعت هفت رفتم و کار کردم، خسته شدم", status: correct}
      - {value: "ساعت هفت رفتم و کار کردم و خسته شدم", status: correct}
      - {value: "دیروز به دفتر رفتم. صبحانه خوردم. خسته شدم", status: correct}
    feedback: "ساعت هفت رفتم، کار کردم، خسته شدم means I went at seven, I worked, I got tired -- a good model answer. Any true combination of a time, an action, and how you felt from this unit's vocabulary, joined by a period, comma, or و at either boundary, is equally accepted."
  prs.a1.unit20.lesson06.exercise01.dialogue_comprehension_where_went:
    instruction: "Read the conversation. Where did Zarmina go yesterday?"
    correct_option: "To the office"
    distractors: ["Home", "Nowhere -- it isn't stated", "To eat breakfast"]
    accepted_answers: [{value: "To the office", status: correct}]
    feedback: "زرمینه says به دفتر رفتم -- I went to the office."
  prs.a1.unit20.lesson06.exercise02.match_dialogue_vocab:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {کجا: where, رفتی: "you went", کردی: "you did / worked", رفت: "she/he went", کرد: "she/he did / worked", شد: "she/he became", بلی: "yes", زرمینه: Zarmina, همایون: Homayoun}
        status: correct
    feedback: "These are the dialogue's key words, names, and both the 2nd- and 3rd-person past forms."
  prs.a1.unit20.lesson06.exercise03.reading_comprehension_worked_and_tired:
    instruction: "Read the lines. Did Zarmina work yesterday, and how did she feel afterward?"
    correct_option: "She worked, and got tired"
    distractors: ["She worked, and felt happy", "She did not work", "It isn't stated whether she worked"]
    accepted_answers: [{value: "She worked, and got tired", status: correct}]
    feedback: "زرمینه says بلی، کار کردم. خسته شدم -- yes, I worked. I got tired."
  prs.a1.unit20.lesson06.exercise04.dialogue_response_own_yesterday:
    instruction: "Homayoun asks 'دیروز کجا رفتی؟' (Where did you go yesterday?). Answer, saying where you went and whether you worked."
    accepted_answers:
      - {value: "به دفتر رفتم. کار کردم", status: correct}
      - {value: "به دفتر رفتم، کار کردم", status: correct}
      - {value: "به دفتر رفتم و کار کردم", status: correct}
    feedback: "به دفتر رفتم، کار کردم means I went to the office, I worked. Any true place and action from this unit's vocabulary, joined by a period, comma, or و, is equally accepted."
  prs.a1.unit20.lesson06.exercise05.write_dialogue_summary:
    instruction: "Write two or three sentences in Dari summarizing the conversation: say where Zarmina went, whether she worked, and how she felt."
    accepted_answers:
      - {value: "زرمینه به دفتر رفت. کار کرد. خسته شد", status: correct}
      - {value: "زرمینه به دفتر رفت، کار کرد. خسته شد", status: correct}
      - {value: "زرمینه به دفتر رفت و کار کرد. خسته شد", status: correct}
      - {value: "زرمینه به دفتر رفت. کار کرد، خسته شد", status: correct}
      - {value: "زرمینه به دفتر رفت. کار کرد و خسته شد", status: correct}
      - {value: "زرمینه به دفتر رفت، کار کرد، خسته شد", status: correct}
      - {value: "زرمینه به دفتر رفت، کار کرد و خسته شد", status: correct}
      - {value: "زرمینه به دفتر رفت و کار کرد، خسته شد", status: correct}
      - {value: "زرمینه به دفتر رفت و کار کرد و خسته شد", status: correct}
    feedback: "زرمینه به دفتر رفت، کار کرد، خسته شد means Zarmina went to the office, worked, got tired -- joined by a period, comma, or و, all equally accepted."
