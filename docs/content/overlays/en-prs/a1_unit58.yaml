    title: "Zoo"
    gloss: "zoo"
    note: "*باغ وحش* (literally 'garden of wild animals') is standard Dari and Farsi for a zoo, the usual word in everyday use."
    example_gloss: "This zoo is nice."
  prs.a1.unit58.lesson01.teach.lion_word:
    title: "Lion"
    gloss: "lion"
    note: "*شیر* is standard Dari and Farsi for lion. Note it is also the word for milk in a different context -- this course only ever uses it here in unambiguous zoo/animal contexts."
    example_gloss: "The lion is at the zoo."
  prs.a1.unit58.lesson01.teach.zoo_is_nice_phrase:
    title: "This zoo is nice"
    gloss: "This zoo is nice."
    note: "This combines zoo and good."
  prs.a1.unit58.lesson01.teach.lion_at_zoo_phrase:
    title: "The lion is at the zoo"
    gloss: "The lion is at the zoo."
