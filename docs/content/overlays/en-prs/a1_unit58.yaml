    gloss: "The zoo is open from eight in the morning until six in the evening. The ticket is fifty afghanis."
  prs.a1.unit58.lesson03.teach.review_big_small:
    title: "Review: big, small"
    gloss: "big / small"
    note: "These are review words used to describe zoo animals."
