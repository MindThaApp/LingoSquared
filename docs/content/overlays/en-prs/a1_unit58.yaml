    title: "Monkeys are interesting too"
    gloss: "Monkeys are interesting too."
  prs.a1.unit58.lesson04.teach.review_want_go_zoo:
    title: "Review: Zarmina, do you want, let's go, zoo"
    gloss: "Zarmina / do you want (informal) / let's go / zoo"
    note: "These are review words used to propose going to the zoo."
  prs.a1.unit58.lesson04.teach.review_great_like_lion:
    title: "Review: yes, great, I, lion, I like"
    gloss: "yes / great / I / lion / I like"
    note: "These are review words used to accept and say you like lions."
  prs.a1.unit58.lesson04.teach.review_elephant:
    title: "Review: elephant"
    gloss: "elephant"
