    gloss: "Homayoun went to the zoo. He saw a lion and an elephant. The zoo was interesting."
  prs.a1.unit58.lesson06.teach.review_names_animals_likes_but:
    title: "Review: Homayoun, Zarmina, elephant, lion, likes, but"
    gloss: "Homayoun / Zarmina / elephant / lion / likes / but"
    note: "These are review words used to contrast Homayoun's and Zarmina's favorite animals."
  prs.a1.unit58.lesson06.teach.favorite_animals_contrast_phrase:
    title: "Homayoun likes elephants, but Zarmina likes lions"
    gloss: "Homayoun likes elephants, but Zarmina likes lions."
    note: "This restates the preferences each character stated earlier in this unit's dialogue."
  prs.a1.unit58.lesson06.teach.review_animal_your_favorite_which:
    title: "Review: animal, your favorite, which, is"
