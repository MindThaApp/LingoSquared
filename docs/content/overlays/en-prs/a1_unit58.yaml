    title: "Review: good, is, let's go"
    gloss: "good / is / let's go"
    note: "These are review words used to close the dialogue."
  prs.a1.unit58.lesson04.teach.dialogue_line1:
    title: "Homayoun: Zarmina, do you want to go to the zoo?"
    gloss: "Zarmina, do you want to go to the zoo?"
