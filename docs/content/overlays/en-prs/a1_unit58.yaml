 conventions: all three are basic, high-frequency, dialect-neutral vocabulary shared identically with Iranian Farsi, no register/dialect-divergence risk (confirmed by the same reasoning already applied to this course's earlier animal words سگ/پرنده/ماهی in unit28). شیر is a genuine Dari/Farsi homograph (lion / milk); this unit only uses it in unambiguous zoo/animal contexts, so no learner-facing ambiguity arises. Four new content words: باغ وحش (DLI-attested), شیر, فیل, میمون. No new grammar beyond ordinary recombination: می‌خواهی/برویم (unit55/unit13), دوست دارم/دوست دارد (unit14/unit39), رفت/دید/بود (unit20/unit53), and the -تان formal-possessive suffix (unit39-57, applied here to محبوب following unit53's own precedent of attaching -تان to the adjective following the head noun) are all reused. Everything else reuses this course's own established vocabulary: این/است/در/خوب/به (multiple early units), از/تا/هشت/شش/صبح/شب/ساعت/پنجاه (unit04), باز/بسته (unit50), بلیط/چند/افغانی (unit04/unit08/unit23/unit53), بزرگ/کوچک (unit15/unit28), هم/جالب (unit14/unit52), بلی/عالی (unit01/unit09/unit10), او/رفت/بود/و (multiple units), دید (unit53), اما (unit33/unit39-57), محبوب/کدام (unit29/unit39/unit09), حیوان (unit28). No bare Yes/No/True/False/On/Off gloss values exist anywhere in this unit. Dialogue content uses structured speakers in the realization, not embedded speaker labels. Lesson04's multiple_choice distractors were checked against the standing same-speaker-distractor rule: every distractor for a tested همایون line is drawn only from زرمینه's three lines, and vice versa -- no exercise draws a distractor from the same character's other lines. This task did not open any fa/a1_unit* file at any point -- fa and prs are separate realizations per universal_spine.yaml's own explicit invariant, and every vocabulary/register choice here was made independently.\n\nReview 2026-10-20 (en-prs A1 pass): 3 fixes - بلیط replaced with تکت in all quoted Dari; removed source-attestation wording from the zoo note; added word-order variants for the zoo question. NATIVE FLAGS: see realization."
course:
  title: Dari A1
  description: "Beginner Kabul Dari: propose and describe a visit to the zoo, name common zoo animals (lions, elephants, monkeys), read a zoo sign giving opening hours and ticket price, and talk about a favorite animal."
units:
  prs.a1.unit58.zoo:
    title: Zoo
    description: "Propose and describe a visit to the zoo, name common zoo animals (lions, elephants, monkeys), read a zoo sign giving opening hours and ticket price, and talk about a favorite animal."
