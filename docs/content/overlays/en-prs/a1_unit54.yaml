    feedback: "می‌خواهین جمعه برویم کنسرت؟ means \"Do you want to go to the concert on Friday?\""
  prs.a1.unit54.lesson03.exercise06.dialogue_response_accept:
    instruction: "Reply accepting the plan: Yes, great! It's agreed."
    accepted_answers:
      - {value: "بلی، عالی است! قبول است", status: correct}
