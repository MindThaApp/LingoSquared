course:
  title: Dari A1
  description: "Beginner Kabul Dari: make plans to go to a concert, read a concert poster, buy a ticket, ask what time it starts, and talk simply about it afterward."
units:
  prs.a1.unit54.concert:
    title: Concert
    description: "Make plans to go to a concert, buy a ticket, ask what time it starts, and talk simply about it afterward."
lessons:
  prs.a1.unit54.lesson01.concert_and_singer_vocabulary:
    title: The concert and the singer
  prs.a1.unit54.lesson02.concert_poster:
    title: The concert poster
  prs.a1.unit54.lesson03.proposing_to_go_to_a_concert:
    title: Proposing to go to a concert
  prs.a1.unit54.lesson04.concert_ticket_dialogue:
    title: Concert ticket dialogue
  prs.a1.unit54.lesson05.reading:
    title: Reading about the concert
  prs.a1.unit54.lesson06.wrap_up:
    title: Wrap-up
teaching:
  prs.a1.unit54.lesson01.teach.review_this_is_in_good:
    title: "Review: this, is, in, good"
    gloss: "this / is / in / good"
    note: "These are review words (used throughout this course) for talking about the concert."
  prs.a1.unit54.lesson01.teach.concert_word:
    title: "Concert"
    gloss: "concert"
    note: "This is a standard modern Dari word for a concert, borrowed from English/French the same way *موزیم* (museum) was borrowed."
    example_gloss: "This concert is good."
  prs.a1.unit54.lesson01.teach.singer_word:
    title: "Singer"
    gloss: "singer"
    note: "This is the plain, common modern Dari word for a singer. A more classical alternative, *آوازخوان*, also exists but is less common in everyday speech."
    example_gloss: "The singer is at the concert."
  prs.a1.unit54.lesson01.teach.this_is_concert_phrase:
    title: "This is a concert"
    gloss: "This is a concert."
    note: "This combines this, is, and concert the same way this course already joins these words elsewhere."
  prs.a1.unit54.lesson01.teach.singer_at_concert_phrase:
    title: "The singer is at the concert"
    gloss: "The singer is at the concert."
    note: "This combines singer, in, and concert."
  prs.a1.unit54.lesson02.teach.review_price_and_time_words:
    title: "Review: how much, afghani, is, thirty, o'clock, eight, evening, happens, in, ticket"
    gloss: "how much / afghani / is / thirty / o'clock / eight / evening / happens / in / ticket"
    note: "These are review words (from earlier units) used to talk about the concert's start time and price."
  prs.a1.unit54.lesson02.teach.start_word:
    title: "Start"
    gloss: "start"
    note: "This combines with *می‌شود* (happens) to mean \"it starts\", the same light-verb pattern this course already uses elsewhere."
    example_gloss: "The concert starts at eight in the evening."
  prs.a1.unit54.lesson02.teach.singer_name_word:
    title: "Sima"
    gloss: "Sima"
    note: "Sima is a common Afghan given name, used here as the concert's singer."
    example_gloss: "Sima is a singer."
  prs.a1.unit54.lesson02.teach.concert_poster_reading:
    title: "Reading the concert poster"
    gloss: "Sima is a singer. The concert starts at eight in the evening. The ticket is 30 afghanis."
  prs.a1.unit54.lesson02.teach.review_when_word:
    title: "Review: when"
    gloss: "when"
    note: "This is a review word used to ask when the concert starts."
  prs.a1.unit54.lesson02.teach.ask_start_time_phrase:
    title: "When does the concert start?"
    gloss: "When does the concert start?"
    note: "This combines the words taught earlier in this lesson."
  prs.a1.unit54.lesson02.teach.answer_start_time_phrase:
    title: "The concert starts at eight in the evening"
    gloss: "The concert starts at eight in the evening."
    note: "This states the concert's start time from the poster."
  prs.a1.unit54.lesson03.teach.review_propose_words:
    title: "Review: do you want (polite), Friday, let's go"
    gloss: "do you want (polite) / Friday / let's go"
    note: "These are review words used to propose a plan, the same frame this course already established for proposing a park outing."
  prs.a1.unit54.lesson03.teach.review_concert_word:
    title: "Review: concert"
    gloss: "concert"
    note: "This is a review word used to propose going to the concert."
  prs.a1.unit54.lesson03.teach.propose_concert_phrase:
    title: "Do you want to go to the concert on Friday?"
    gloss: "Do you want to go to the concert on Friday?"
    note: "This reuses this course's own already-established plan-proposing pattern, applied to the concert."
  prs.a1.unit54.lesson03.teach.review_accept_words:
    title: "Review: yes, great, agreed"
    gloss: "yes / great / agreed"
    note: "These are review words used to accept a plan."
  prs.a1.unit54.lesson03.teach.accept_plan_phrase:
    title: "Yes, great! It's agreed."
    gloss: "Yes, great! It's agreed."
    note: "This accepts the proposed concert plan."
  prs.a1.unit54.lesson04.teach.review_hello_want_ticket:
    title: "Review: hello, one/a, ticket, I want"
    gloss: "hello / one/a / ticket / I want"
    note: "These are review words used to open the dialogue."
  prs.a1.unit54.lesson04.teach.review_welcome_concert_start:
    title: "Review: here you go, concert, Sima, o'clock, eight, evening, starts"
    gloss: "here you go / concert / Sima / o'clock / eight / evening / starts"
    note: "These are review words used to state the concert's start time."
  prs.a1.unit54.lesson04.teach.review_ask_price:
    title: "Review: how much, afghani, is"
    gloss: "how much / afghani / is"
    note: "These are review words used to ask and state the ticket price."
  prs.a1.unit54.lesson04.teach.review_thanks_welcome:
    title: "Review: thanks a lot, you're welcome"
    gloss: "thanks a lot / you're welcome"
    note: "These are review words used to close the dialogue."
  prs.a1.unit54.lesson04.teach.dialogue_line1:
    title: "Homayoun: Hello. I want a concert ticket."
    gloss: "Hello. I want a concert ticket."
  prs.a1.unit54.lesson04.teach.dialogue_line2:
    title: "Staff member: Hello, welcome. Sima's concert starts at eight in the evening."
    gloss: "Hello, welcome. Sima's concert starts at eight in the evening."
  prs.a1.unit54.lesson04.teach.dialogue_line3:
    title: "Homayoun: How much is the ticket?"
    gloss: "How much is the ticket?"
  prs.a1.unit54.lesson04.teach.dialogue_line4:
    title: "Staff member: The ticket is 30 afghanis."
    gloss: "The ticket is 30 afghanis."
  prs.a1.unit54.lesson04.teach.dialogue_line5:
    title: "Homayoun: Thanks a lot."
    gloss: "Thanks a lot."
  prs.a1.unit54.lesson04.teach.dialogue_line6:
    title: "Staff member: You're welcome."
    gloss: "You're welcome."
  prs.a1.unit54.lesson05.teach.review_this_is_in_to:
    title: "Review: this, is, in, to"
    gloss: "this / is / in / to"
    note: "These are review words used in the reading passage."
  prs.a1.unit54.lesson05.teach.review_he_went_object_saw_was:
    title: "Review: he/she, went, (object marker), saw, was, good"
    gloss: "he/she / went / (object marker) / saw / was / good"
    note: "These are review words used in the reading passage."
  prs.a1.unit54.lesson05.teach.review_concert_singer_name:
    title: "Review: concert, singer, Sima"
    gloss: "concert / singer / Sima"
    note: "These are review words used in the reading passage."
  prs.a1.unit54.lesson05.teach.reading_passage:
    title: "Reading about the concert"
    gloss: "Homayoun went to Sima's concert. He saw the singer. The concert was good."
  prs.a1.unit54.lesson06.teach.review_but_second_showtime:
    title: "Review: but, o'clock, ten, fifty, afghani, is, evening"
    gloss: "but / o'clock / ten / fifty / afghani / is / evening"
    note: "But is a review word from earlier units."
  prs.a1.unit54.lesson06.teach.showtime_price_contrast_phrase:
    title: "The 8 o'clock concert is 30 afghanis, but the 10 o'clock concert is 50 afghanis"
    gloss: "The eight o'clock concert is 30 afghanis, but the ten o'clock concert is 50 afghanis."
    note: "But contrasts two different concerts' start times and prices."
  prs.a1.unit54.lesson06.teach.review_your_ticket_how_much:
    title: "Review: your ticket, how much"
    gloss: "your ticket / how much"
    note: "Your ticket uses the same formal suffix as Unit 50's your pool ticket, Unit 52's your cinema ticket, and Unit 53's your museum ticket."
  prs.a1.unit54.lesson06.teach.your_ticket_question_phrase:
    title: "How much is your ticket?"
    gloss: "How much is your ticket?"
    note: "This is the formal suffixed version of asking about a concert ticket's price."
