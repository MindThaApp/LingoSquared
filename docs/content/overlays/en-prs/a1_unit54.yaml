    instruction: "Translate into Dari: When does the concert start?"
    accepted_answers:
      - "کنسرت کی شروع می‌شود؟"
      - "کنسرت کی شروع می‌شود"
    feedback: "کنسرت کی شروع می‌شود؟ means \"When does the concert start?\""
  prs.a1.unit54.lesson02.exercise07.write_answer_start_time:
