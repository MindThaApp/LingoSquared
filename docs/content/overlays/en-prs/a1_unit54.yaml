    instruction: "Select the correct translation."
    correct_option: start
    distractors: [ticket, singer, concert]
    feedback: "شروع means start."
    accepted_answers:
      - {value: start, status: correct}
  prs.a1.unit54.lesson02.exercise02.reading_who_sings:
    instruction: "According to the poster, who is the singer?"
    correct_option: Sima
    distractors: ["Homayoun", "the staff member", "no one is named"]
    feedback: "The poster says سیما خواننده است."
    accepted_answers:
      - {value: Sima, status: correct}
  prs.a1.unit54.lesson02.exercise03.reading_start_time:
    instruction: "According to the poster, what time does the concert start?"
    correct_option: "8 in the evening"
    distractors: ["10 in the evening", "5 in the evening", "8 in the morning"]
    feedback: "The poster says کنسرت ساعت هشت شب شروع می‌شود."
    accepted_answers:
      - {value: "8 in the evening", status: correct}
  prs.a1.unit54.lesson02.exercise04.match_poster_vocab:
