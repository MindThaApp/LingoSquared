    instruction: "Select the correct translation."
    correct_option: concert
    distractors: [singer, this, in]
    feedback: "کنسرت means concert."
    accepted_answers:
      - {value: concert, status: correct}
  prs.a1.unit54.lesson01.exercise02.recognize_singer_word:
    instruction: "Select the correct translation."
    correct_option: singer
    distractors: [concert, this, in]
    feedback: "خواننده means singer."
    accepted_answers:
      - {value: singer, status: correct}
  prs.a1.unit54.lesson01.exercise03.recognize_singer_at_concert:
    instruction: "Select the correct translation."
    correct_option: "The singer is at the concert."
    distractors: ["This is a concert.", "I want a ticket.", "This concert is good."]
    feedback: "خواننده در کنسرت است. means \"The singer is at the concert.\""
    accepted_answers:
      - {value: "The singer is at the concert.", status: correct}
  prs.a1.unit54.lesson01.exercise04.match_concert_singer_vocab:
    instruction: "Match each word or phrase to its meaning."
    accepted_answers:
      - value:
          "کنسرت": concert
          "خواننده": singer
          "این": this
          "است": is
          "در": in
          "این کنسرت است.": "This is a concert."
          "خواننده در کنسرت است.": "The singer is at the concert."
  prs.a1.unit54.lesson01.exercise05.order_singer_at_concert:
    instruction: "Put the words in the correct order."
    accepted_answers: ["خواننده در کنسرت است"]
    feedback: "The correct order is خواننده در کنسرت است."
  prs.a1.unit54.lesson01.exercise06.translate_singer_at_concert:
    instruction: "Translate into Dari: The singer is at the concert."
    accepted_answers:
      - "خواننده در کنسرت است."
      - "خواننده در کنسرت است"
    feedback: "خواننده در کنسرت است. means \"The singer is at the concert.\""
  prs.a1.unit54.lesson01.exercise07.write_concert:
    instruction: "Write the Dari word for concert."
    accepted_answers:
      - "کنسرت"
    feedback: "کنسرت means concert."
