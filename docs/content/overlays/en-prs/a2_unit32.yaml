    - value: بهتر است که تو پیش داکتر بروی.
      status: correct
    - value: بهتر است به داکتر بروی.
      status: correct
    - value: بهتر است پیش داکتر بروی.
      status: correct
    - value: بهتر است تو به داکتر بروی.
