course:
  title: Dari A2
  description: 'Lower-intermediate Afghan Dari: giving and answering simple advice about health, study and money with the subjunctive. Gentle advice with بهتر است که, firm advice with باید and نباید, polite suggestions with پیشنهاد می‌کنم که, asking what to do, and accepting, doubting or declining advice.'
units:
  prs.a2.unit32.giving_advice:
    title: Giving advice
lessons:
  prs.a2.unit32.lesson01.better_to_go:
    title: It is better that you go to the doctor
  prs.a2.unit32.lesson02.must_and_must_not:
    title: Must and must not
  prs.a2.unit32.lesson03.i_suggest:
    title: I suggest that
  prs.a2.unit32.lesson04.ask_and_answer:
    title: Asking for advice and answering it
  prs.a2.unit32.lesson05.reading_and_listening:
    title: Reading and listening about health
  prs.a2.unit32.lesson06.money_conversation:
    title: A conversation about money
teaching:
  prs.a2.unit32.lesson01.teach.doctor:
    title: Doctor
    gloss: doctor
    note: '*داکتر* is the Afghan word for a doctor. To see the doctor you say *به داکتر رفتن*: *به داکتر می‌روم* is I am going to the doctor.'
    example_gloss: The doctor is in the office today.
  prs.a2.unit32.lesson01.teach.medicine:
    title: Medicine
    gloss: medicine
    note: '*دوا* is medicine. You do not drink it or take it: in Dari you eat it, *دوا خوردن*. *دوا را می‌خورم* is I take the medicine.'
    example_gloss: I take the medicine after food.
  prs.a2.unit32.lesson01.teach.sick:
    title: Sick
    gloss: sick, ill
    note: '*مریض* means sick or ill. *مریض استم* is I am sick and *او مریض است* is he or she is sick.'
    example_gloss: My brother is sick.
  prs.a2.unit32.lesson01.teach.rest:
    title: To rest
    gloss: to rest
    note: '*استراحت کردن* is to rest. It is a two-word verb: *استراحت* stays in front and only *کردن* changes, as in *استراحت می‌کنم* (I rest).'
    example_gloss: After work I rest.
  prs.a2.unit32.lesson01.teach.sleep:
    title: To sleep
    gloss: to sleep, to go to bed
    note: '*خوابیدن* is to sleep or to go to bed. *شب‌ها* is at night, in the evenings: *شب‌ها زود می‌خوابم* is in the evenings I go to bed early. *دیر خوابیدن* is to go to bed late.'
    example_gloss: Going to bed early is important.
  prs.a2.unit32.lesson01.teach.head:
    title: My head hurts
    gloss: My head hurts.
    note: 'To say that a part of the body hurts, put *-م* on the body part and add *درد می‌کند*: *سرم درد می‌کند* (my head hurts). This is the usual problem that makes a friend give you advice.'
  prs.a2.unit32.lesson01.teach.stem:
    title: 'Advice uses the subjunctive: command plus ی'
    gloss: 'go: that you go; eat: that you eat; sleep: that you sleep; rest: that you rest'
    note: 'To give advice you use a verb form called the subjunctive. For a friend (*تو*) it is easy: take the command you give a friend and add *ی*. *برو* (go) gives *بروی*, *بخور* (eat) gives *بخوری*, *بخواب* (sleep) gives *بخوابی*, *استراحت کن* (rest) gives *استراحت کنی*. For most verbs the command starts with *ب-*; verbs made with *کردن* have no *ب-* (*کن*, not *بکن*, in this unit).'
  prs.a2.unit32.lesson01.teach.paradigm:
    title: 'The subjunctive of رفتن: all six persons'
    gloss: that I go, that you go (friend), that he/she goes, that we go, that you go (formal or plural), that they go
    note: 'The command stem *برو* takes these endings: *بروم* (I), *بروی* (you, to a friend), *برود* (he or she), *برویم* (we), *بروین* (you, formal or plural), *بروند* (they). The endings are *-م، -ی، -د، -یم، -ین، -ند*. This unit writes the 2pl ending as *-ین*, like the rest of the course. The subjunctive does not say when: the advice or the main verb around it gives the meaning.'
  prs.a2.unit32.lesson01.teach.better:
    title: Giving advice with بهتر است که
    gloss: It is better that you go to the doctor.
    note: '*بهتر است* (it is better) plus *که* plus the subjunctive is the gentle, friendly way to give advice: *بهتر است که به داکتر بروی* is it is better that you go to the doctor. The word *که* can be left out: *بهتر است به داکتر بروی* means the same. This unit always writes the full *است*; there is no shorter form in the written Dari of the course. The person who should act is shown only by the ending of the subjunctive: *بروی* is you.'
  prs.a2.unit32.lesson01.teach.better_more:
    title: More advice for a sick friend
    gloss: It is better that you take the medicine. It is better that you go to bed. It is better that you rest.
    note: 'The same pattern with other verbs: *دوا بخوری* (that you take the medicine), *بخوابی* (that you go to bed), *استراحت کنی* (that you rest). Only the verb at the end changes; *بهتر است که* stays the same.'
  prs.a2.unit32.lesson01.teach.neg:
    title: 'The negative: ن instead of ب'
    gloss: It is better that you do not go. It is better that you do not go to bed late.
    note: 'To say what a friend should not do, put *ن-* in place of *ب-*: *بروی* becomes *نروی*, *بخوری* becomes *نخوری*, *بخوابی* becomes *نخوابی*. With *کردن* verbs the negative is *نکنی*. So *بهتر است که دیر نخوابی* is it is better that you do not go to bed late.'
  prs.a2.unit32.lesson01.teach.formal:
    title: 'Advice to a person you respect: ین'
    gloss: It is better that you go to the doctor. (formal or plural)
    note: 'To someone you respect, an older person, a stranger, or to several people, use *شما* and the ending *-ین*: *بروین، بخورین، بخوابین، کنین*. *بهتر است که شما به داکتر بروین* is it is better that you go to the doctor. With a friend, use *بروی*.'
  prs.a2.unit32.lesson01.teach.water:
    title: Drink plenty of water
    gloss: It is better that you drink a lot of water.
    note: 'In Dari you eat water just like medicine: *آب خوردن* is to drink water. *آب زیاد* is a lot of water. A very common piece of advice for a sick friend.'
  prs.a2.unit32.lesson02.teach.lesson:
    title: Lesson, study
    gloss: lesson, schoolwork
    note: '*درس* is a lesson or schoolwork. *درس خواندن* is to study (literally to read a lesson): *درس می‌خوانم* is I study.'
    example_gloss: Every day I study.
  prs.a2.unit32.lesson02.teach.exam:
    title: Exam
    gloss: exam, test
    note: '*امتحان* is an exam or a test. Advice about study is very often about an *امتحان* that is coming.'
    example_gloss: My exam is tomorrow.
  prs.a2.unit32.lesson02.teach.book:
    title: Book
    gloss: book
    note: '*کتاب* is a book. Add *-م* for my: *کتابم*. The plural is written *کتاب‌ها*.'
    example_gloss: My book is at school.
  prs.a2.unit32.lesson02.teach.review:
    title: To repeat, to review
    gloss: to repeat, to go over again
    note: '*تکرار کردن* is to repeat or to go over something again. It is the usual advice before an exam: *درس را تکرار کن*.'
    example_gloss: Every night I go over the lesson.
  prs.a2.unit32.lesson02.teach.early:
    title: Early, soon
    gloss: early, soon
    note: '*زود* means early or soon. *زود خوابیدن* is to go to bed early, and *صبح زود* is early in the morning.'
    example_gloss: Early in the morning I go to school.
  prs.a2.unit32.lesson02.teach.late:
    title: Late
    gloss: late
    note: '*دیر* means late; it is the opposite of *زود*. *دیر خوابیدن* is to go to bed late.'
    example_gloss: Today he or she came late.
  prs.a2.unit32.lesson02.teach.must:
    title: 'باید plus the subjunctive: must'
    gloss: You must study every day.
    note: '*باید* (must, have to) is also followed by the subjunctive: *باید هر روز درس بخوانی* is you must study every day. *باید* never changes; the ending of the subjunctive shows who. *باید* is stronger than *بهتر است که*: it is a duty or a clear need. The word order is free: *هر روز باید درس بخوانی* is also correct.'
  prs.a2.unit32.lesson02.teach.must_paradigm:
    title: باید with all six persons
    gloss: I must go, you must go, he/she must go, we must go, you must go (formal or plural), they must go
    note: 'Only the ending of the subjunctive changes: *باید بروم* (I must go), *باید بروی* (you must go), *باید برود* (he or she must go), *باید برویم* (we must go), *باید بروین* (you must go, formal or plural), *باید بروند* (they must go).'
  prs.a2.unit32.lesson02.teach.must_not:
    title: 'نباید: must not'
    gloss: You must not go to bed late.
    note: '*نباید* (must not) is *باید* with *ن-* in front. The verb after it stays positive: *نباید دیر بخوابی* is you must not go to bed late. Do not add a second *ن-*: it is *نباید بخوابی*, not *نباید نخوابی*.'
  prs.a2.unit32.lesson02.teach.soft_strong:
    title: Gentle advice and strong advice
    gloss: It is better that you go to bed early. You must go to bed early.
    note: Both sentences give the same advice but with a different strength. *بهتر است که زود بخوابی* is friendly and soft, like it would be better to. *باید زود بخوابی* is firm, like you really have to. Use *بهتر است که* with a friend when you only advise, and *باید* when it matters, for example before an exam.
  prs.a2.unit32.lesson02.teach.review_adv:
    title: Advice before an exam
    gloss: It is better that you go over the lesson.
    note: 'The thing you work on comes before the verb with *را*: *درس را تکرار کنی* (that you go over the lesson). It is a good piece of study advice.'
  prs.a2.unit32.lesson03.teach.money:
    title: Money
    gloss: money
    note: '*پول* is money. *پولم* is my money. *پولم کم است* is I do not have much money.'
    example_gloss: I do not have much money.
  prs.a2.unit32.lesson03.teach.spend:
    title: To spend
    gloss: to spend
    note: '*خرج کردن* is to spend money. The money comes before the verb: *پول خرج کردن*. *زیاد خرج کردن* is to spend a lot.'
    example_gloss: Every month he or she spends a lot of money.
  prs.a2.unit32.lesson03.teach.save:
    title: To save
    gloss: to save (money)
    note: '*پس‌انداز کردن* is to save money. Like *خرج کردن* it is a two-word verb. *پس‌انداز* is written with the small space between *پس* and *انداز*.'
    example_gloss: Every month I save a little money.
  prs.a2.unit32.lesson03.teach.expensive:
    title: Expensive
    gloss: expensive
    note: '*گران* means expensive. The opposite is *ارزان* (cheap).'
    example_gloss: This car is expensive.
  prs.a2.unit32.lesson03.teach.cheap:
    title: Cheap
    gloss: cheap
    note: '*ارزان* means cheap. The opposite is *گران*.'
    example_gloss: This book is cheap.
  prs.a2.unit32.lesson03.teach.month:
    title: Month
    gloss: month
    note: '*ماه* is a month. *هر ماه* is every month. It is a useful word when you speak about money, because many people receive and spend money every month.'
    example_gloss: Every month I go to the bank.
  prs.a2.unit32.lesson03.teach.suggest:
    title: پیشنهاد می‌کنم که plus the subjunctive
    gloss: I suggest that you save money every month.
    note: '*پیشنهاد می‌کنم* means I suggest, and *که* plus the subjunctive says what you suggest: *پیشنهاد می‌کنم که هر ماه پول پس‌انداز کنی* is I suggest that you save money every month. The verb *می‌کنم* has the *می‌* and the ending *-م* (I). The verb after *که* is again the subjunctive: *پس‌انداز کنی*. To suggest something for yourselves together, say *پیشنهاد می‌کنیم که* (we suggest that).'
  prs.a2.unit32.lesson03.teach.three:
    title: Three ways to give the same advice
    gloss: It is better that you save money. You must save money. I suggest that you save money.
    note: You now know three patterns that all take the subjunctive. *بهتر است که* is the gentle friend. *باید* is firm. *پیشنهاد می‌کنم که* is polite and clear, it sounds like a suggestion from someone who respects you, and it is the one to use when you are not close to the person.
  prs.a2.unit32.lesson03.teach.we_suggest:
    title: We suggest
    gloss: We suggest that you go to bed early.
    note: 'For we, the ending of *می‌کنم* becomes *-یم*: *پیشنهاد می‌کنیم* is we suggest. Use it when you speak for a group, for example a family or a team.'
  prs.a2.unit32.lesson03.teach.suggest_neg:
    title: Suggesting what not to do
    gloss: I suggest that you do not spend a lot of money.
    note: 'After *پیشنهاد می‌کنم که* use the negative subjunctive for what not to do: *نکنی* from *کردن*, *نخری* from *خریدن*. The *می‌کنم* part stays positive: you suggest, and what you suggest is negative.'
  prs.a2.unit32.lesson03.teach.expensive_things:
    title: Do not buy expensive things
    gloss: I suggest that you do not buy expensive things.
    note: '*چیزهای گران* is expensive things: the plural of *چیز* is *چیزها*, and a linking *-ی* joins it with the adjective that follows. *نخری* is the negative of *بخری* (that you buy), from *خریدن*.'
  prs.a2.unit32.lesson04.teach.what_do:
    title: What should I do?
    gloss: What should I do?
    note: 'To ask for advice you use the subjunctive too: *چه کار کنم؟* is what should I do? (not what do I do). The plural is *چه کار کنیم؟* (what should we do?). Say the problem first, then ask: *سرم درد می‌کند. چه کار کنم؟*'
  prs.a2.unit32.lesson04.teach.your_view:
    title: To a person you respect
    gloss: In your opinion, what should I do?
    note: '*به نظر شما* is in your opinion. With an older person or a stranger it is the polite way to ask for advice: *به نظر شما چه کار کنم؟*. Then the other person can answer with *بهتر است که* or *پیشنهاد می‌کنم که*.'
  prs.a2.unit32.lesson04.teach.what_suggest:
    title: What do you suggest?
    gloss: What do you suggest?
    note: '*شما چه پیشنهاد می‌کنین؟* asks someone you respect what they suggest. It uses the ending *-ین* of *شما*. With a friend you say *تو چه پیشنهاد می‌کنی؟*.'
  prs.a2.unit32.lesson04.teach.accept:
    title: Accepting the advice
    gloss: That is a good idea. I will do just that.
    note: '*فکر خوبی است* is that is a good idea. *همین کار را می‌کنم* is I will do just that. The present *می‌کنم* is also how you say what you decide to do. Use these two sentences when you want to follow the advice.'
  prs.a2.unit32.lesson04.teach.thanks:
    title: Thanking for the advice
    gloss: Thank you for your suggestion.
    note: '*از پیشنهادت ممنون* is thank you for your suggestion. *پیشنهادت* is *پیشنهاد* with *-ت*, your. It is a friendly way to end the conversation after any advice.'
  prs.a2.unit32.lesson04.teach.decline:
    title: Saying you cannot do it
    gloss: I cannot, because I do not have time.
    note: 'When you cannot follow the advice, say so and give the reason: *نمی‌توانم، چون وقت ندارم* is I cannot, because I have no time. *می‌توانم* is I can, and *نمی‌توانم* is I cannot. The reason comes after *چون*.'
  prs.a2.unit32.lesson04.teach.maybe:
    title: Softer advice with شاید and the subjunctive of بودن
    gloss: Maybe it would be better that you rest. Maybe that is right.
    note: '*شاید* (maybe) is followed by the subjunctive. The subjunctive of *بودن* is *باشم، باشی، باشد، باشیم، باشین، باشند*. So *شاید بهتر باشد که استراحت کنی* is maybe it would be better that you rest: a very soft piece of advice. You can also react to advice with *شاید درست باشد* (maybe that is right) when you are not yet sure. *ممکن است درست باشد* (it may be right) means almost the same.'
  prs.a2.unit32.lesson04.teach.agree:
    title: Agreeing
    gloss: That is right. I will do just that.
    note: '*درست است* is that is right. After advice it means you agree. Together with *همین کار را می‌کنم* it is a clear yes.'
  prs.a2.unit32.lesson05.teach.three:
    title: Three
    gloss: three
    note: '*سه* is three. *سه روز* is three days. A doctor often says how many days you need to rest.'
    example_gloss: I was in Kabul for three days.
  prs.a2.unit32.lesson05.teach.said:
    title: He or she said
    gloss: he or she said
    note: '*گفت* is the past of *گفتن* (to say) for he or she. After *گفت* a short sentence follows, as in *داکتر گفت: ...* (the doctor said: ...).'
    example_gloss: 'He said: I am coming tomorrow.'
  prs.a2.unit32.lesson05.teach.please_wait:
    title: To wait, to be patient
    gloss: to wait, to be patient
    note: '*صبر کردن* is to wait or to be patient. *نباید صبر کنی* is you should not wait, meaning do it at once.'
    example_gloss: Wait a little.
  prs.a2.unit32.lesson05.teach.dlg1_turn01:
    title: Jamila says what is wrong
    gloss: Zakaria, my head hurts and I do not sleep well at night. What should I do?
    note: Jamila describes the problem with *سرم درد می‌کند* and *خوب نمی‌خوابم* (I do not sleep well), then asks for advice with *چه کار کنم؟*.
  prs.a2.unit32.lesson05.teach.dlg1_turn02:
    title: Zakaria gives two pieces of advice
    gloss: It is better that you go to the doctor. You must drink a lot of water.
    note: Zakaria uses the gentle *بهتر است که به داکتر بروی* first, then the firmer *باید آب زیاد بخوری*. He speaks to a friend, so the ending is *-ی*.
  prs.a2.unit32.lesson05.teach.dlg1_turn03:
    title: Jamila accepts and plans for tomorrow
    gloss: That is a good idea. Tomorrow I will go to the doctor.
    note: 'Jamila accepts with *فکر خوبی است*. She plans to go tomorrow: *فردا به داکتر می‌روم*, the present with a time word.'
  prs.a2.unit32.lesson05.teach.dlg1_turn04:
    title: Zakaria says go today
    gloss: I suggest that you go today. You must not wait.
    note: 'Zakaria says it is urgent: *پیشنهاد می‌کنم که امروز بروی*, and with *نباید صبر کنی* he adds do not wait. Notice that he does not repeat *به داکتر*, because it is clear.'
  prs.a2.unit32.lesson05.teach.dlg1_turn05:
    title: Jamila agrees
    gloss: All right, I will go today. Thank you.
    note: 'Jamila changes her plan to today: *امروز می‌روم*. She ends politely with *ممنون*.'
  prs.a2.unit32.lesson05.teach.message:
    title: A message after the doctor
    gloss: 'Hello Zakaria. Thank you for your suggestion. Today I went to the doctor. The doctor said: it is better that you rest for three days, and you must take medicine. You must not go to bed late in the evenings. Tomorrow I am not going to school.'
    note: 'Jamila writes the next message. The doctor gave advice with the same three patterns: *بهتر است که* (rest three days), *باید* (take medicine) and *نباید* (do not go to bed late). The advice is quoted after *گفت:* in the same form.'
  prs.a2.unit32.lesson06.teach.start:
    title: To start
    gloss: to start, to begin
    note: '*شروع کردن* is to start. *از امروز شروع می‌کنم* is I start from today, a promise after you accept advice.'
    example_gloss: I start from tomorrow.
  prs.a2.unit32.lesson06.teach.only:
    title: Only, just
    gloss: only, just
    note: '*فقط* means only or just. *فقط چیزهای مهم* is only the important things.'
    example_gloss: I have only one book.
  prs.a2.unit32.lesson06.teach.dlg2_turn01:
    title: Zakaria says what is wrong
    gloss: Jamila, I do not have much money and every month I spend a lot. What should I do?
    note: 'Zakaria gives the problem in two parts: *پولم کم است* and *هر ماه زیاد خرج می‌کنم*. Then he asks for advice: *چه کار کنم؟*.'
  prs.a2.unit32.lesson06.teach.dlg2_turn02:
    title: Jamila suggests saving
    gloss: I suggest that you save a little money every month.
    note: Jamila uses the polite pattern *پیشنهاد می‌کنم که* plus the subjunctive *پس‌انداز کنی*. *کمی* means a little.
  prs.a2.unit32.lesson06.teach.dlg2_turn03:
    title: Zakaria says he cannot
    gloss: That is a good idea, but I cannot. Everything is expensive.
    note: 'Zakaria says the idea is good but gives a reason why he cannot follow it: *همه چیز گران است* (everything is expensive).'
  prs.a2.unit32.lesson06.teach.dlg2_turn04:
    title: Jamila advises what not to buy
    gloss: Then you must not buy expensive things. It is better that you buy only important things.
    note: 'Jamila changes the advice: *نباید چیزهای گران بخری* (a firm rule) and *بهتر است که فقط چیزهای مهم بخری* (a gentle suggestion).'
  prs.a2.unit32.lesson06.teach.dlg2_turn05:
    title: Zakaria agrees and starts
    gloss: That is right. I will start from today. Thank you.
    note: 'Zakaria agrees with *درست است* and promises: *از امروز شروع می‌کنم*.'
exercises:
  prs.a2.unit32.lesson01.exercise01.recognize_go_doctor:
    instruction: What does this sentence mean?
    correct_option: It is better that you go to the doctor
    distractors:
    - You went to the doctor
    - I will go to the doctor
    - The doctor is here
    accepted_answers:
    - value: It is better that you go to the doctor
      status: correct
    feedback: '*بهتر است که به داکتر بروی* is it is better that you go to the doctor: *بهتر است که* plus the subjunctive *بروی*.'
  prs.a2.unit32.lesson01.exercise02.recognize_rest:
    instruction: What does this sentence mean?
    correct_option: It is better that you rest
    distractors:
    - I rest after work
    - You are resting now
    - The rest is better
    accepted_answers:
    - value: It is better that you rest
      status: correct
    feedback: '*بهتر است که استراحت کنی* is it is better that you rest. *کنی* is the command *کن* plus *ی*.'
  prs.a2.unit32.lesson01.exercise03.match_subjunctive:
    instruction: Match each Dari word with its meaning.
    accepted_answers:
    - value:
        بروم: that I go
        بروی: that you go (to a friend)
        برود: that he or she goes
        برویم: that we go
        بروین: that you go (formal or plural)
        بروند: that they go
        داکتر: doctor
        دوا: medicine
        مریض: sick
      status: correct
    feedback: 'Only the ending changes with the person: *-م* I, *-ی* you (friend), *-د* he or she, *-یم* we, *-ین* you (formal or plural), *-ند* they.'
  prs.a2.unit32.lesson01.exercise04.order_sleep_early:
