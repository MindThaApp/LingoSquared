    instruction: Match each Dari word with its meaning.
    accepted_answers:
    - value:
        باید بروم: I must go
        باید بروی: you must go (to a friend)
        باید برود: he or she must go
        باید برویم: we must go
        باید بروین: you must go (formal or plural)
        باید بروند: they must go
        نباید بروی: you must not go
        درس: lesson
        امتحان: exam
        زود: early
        دیر: late
      status: correct
    feedback: '*باید* stays the same; the subjunctive ending shows the person. *نباید* is the negative: must not.'
