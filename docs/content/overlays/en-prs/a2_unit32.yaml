    feedback: '*بهتر است که زود بخوابی* puts the subjunctive *بخوابی* at the end.'
  prs.a2.unit32.lesson01.exercise05.complete_medicine:
    instruction: 'Complete the sentence: It is better that you take the medicine.'
    accepted_answers:
    - value: بخوری
      status: correct
    feedback: '*بخوری* is the command *بخور* plus *ی*. *بهتر است که دوا بخوری* is it is better that you take the medicine.'
