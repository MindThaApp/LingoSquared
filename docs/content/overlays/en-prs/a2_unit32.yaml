    feedback: '*نمی‌توانم* is I cannot and *چون وقت ندارم* is because I do not have time.'
  prs.a2.unit32.lesson04.exercise02.match_replies:
    instruction: Match each Dari sentence with its meaning.
    accepted_answers:
    - value:
