course:
  title: Dari A1
  description: 'Beginner Kabul Dari: basic feeling words (happy, sad, tired, angry, worried), asking why and giving a reason with چون, and a Zarmina/Homayoun dialogue comparing how they each feel.'
units:
  prs.a1.unit25.emotions:
    title: Emotions
    description: Express and ask about basic feelings and give a simple reason for them.
