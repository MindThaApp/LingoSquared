  prs.a1.unit25.lesson04.teach.dialogue_line1:
    title: 'Homayoun: Zarmina, how are you today?'
    gloss: 'Homayoun: Zarmina, how are you today?'
    note: A common informal greeting between friends, using تو/استی.
  prs.a1.unit25.lesson04.teach.dialogue_line2:
    title: 'Zarmina: I''m a bit tired, because I worked a lot. How are you?'
    gloss: 'Zarmina: I''m a bit tired, because I worked a lot. How are you?'
    note: کمی means "a bit," new in this line.
  prs.a1.unit25.lesson04.teach.dialogue_line3:
    title: 'Homayoun: I''m happy, because today the weather is good'
    gloss: 'Homayoun: I''m happy, because today the weather is good.'
    note: Reuses lesson02's why-happy answer.
  prs.a1.unit25.lesson04.teach.dialogue_line4:
    title: 'Zarmina: Good! I''m also happy after work'
    gloss: 'Zarmina: Good! I''m also happy after work.'
    note: بعد از means "after," new in this line.
  prs.a1.unit25.lesson04.teach.dialogue_line5:
    title: 'Homayoun: I''m also sometimes tired after work'
    gloss: 'Homayoun: I''m also sometimes tired after work.'
    note: گاهی means "sometimes," new in this line.
  prs.a1.unit25.lesson05.teach.reading_passage:
    title: Reading about feelings
    gloss: Homayoun is happy today, because the weather is good. Zarmina is a bit tired, because she has a lot of work. She is sometimes worried, because she has a lot of work.
    note: A short reading passage recapping the unit's feeling words and reasons, introducing او (he/she).
  prs.a1.unit25.lesson06.teach.review_worried:
    title: Worried (review)
    gloss: worried
    note: نگران means worried (review from lesson01).
