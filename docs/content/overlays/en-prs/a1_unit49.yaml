course:
  title: Dari A1
  description: "Beginner Kabul Dari: use a laundry/dry-cleaning shop, ask to have clothes washed (or washed and ironed), ask the price per kilo, and understand a pickup time."
units:
  prs.a1.unit49.laundry:
    title: Laundry
    description: "Use a laundry shop, ask for washing or washing-and-ironing, ask the price per kilo, and understand a pickup time."
lessons:
  prs.a1.unit49.lesson01.laundry_shop_vocabulary:
    title: The laundry shop
  prs.a1.unit49.lesson02.washing_clothes_and_price_per_kilo:
    title: Washing clothes and the price per kilo
  prs.a1.unit49.lesson03.wash_and_iron_and_ready_time:
    title: Washing and ironing, and when it's ready
  prs.a1.unit49.lesson04.laundry_shop_dialogue:
    title: Laundry shop dialogue
  prs.a1.unit49.lesson05.reading:
    title: Reading about the laundry shop
  prs.a1.unit49.lesson06.wrap_up:
    title: Wrap-up
teaching:
  prs.a1.unit49.lesson01.teach.review_this_is_in:
    title: "Review: this, is, in"
    gloss: "this / is / in"
    note: "These are review words (used throughout this course) for talking about the laundry shop."
  prs.a1.unit49.lesson01.teach.review_clothes_shop_shopkeeper:
    title: "Review: clothes, shop, shopkeeper"
    gloss: "clothes / shop / shopkeeper"
    note: "Clothes is a review word from Unit 21; shop and shopkeeper are review words from Unit 10."
  prs.a1.unit49.lesson01.teach.laundry_word:
    title: "Laundry"
    gloss: "laundry"
    note: "This combines this course's own word for clothes with the verb root for washing, giving the everyday Dari word for a laundry shop or laundry service."
    example_gloss: "This is a laundry shop."
  prs.a1.unit49.lesson01.teach.this_is_laundry_shop_phrase:
    title: "This is a laundry shop"
    gloss: "This is a laundry shop."
    note: "This combines this, shop, and laundry the same way this course already joins two nouns together without a linking word."
  prs.a1.unit49.lesson01.teach.shopkeeper_at_shop_phrase:
    title: "The shopkeeper is at the shop"
    gloss: "The shopkeeper is at the shop."
    note: "This combines shopkeeper and shop."
  prs.a1.unit49.lesson02.teach.review_want_object_wash:
    title: "Review: I want, object marker, so that I wash"
    gloss: "I want / (object marker) / so that I wash"
    note: "So that I wash is the expected subjunctive form of the already-taught verb wash, built the same way this course already forms every other subjunctive (so that I take, so that I get)."
  prs.a1.unit49.lesson02.teach.review_clothes_plural:
    title: "Review: the clothes"
    gloss: "the clothes"
    note: "This is the plural of clothes, formed the same way this course already made apples plural."
  prs.a1.unit49.lesson02.teach.want_to_wash_phrase:
    title: "I want to wash the clothes"
    gloss: "I want to wash the clothes."
    note: "This extends the same want-plus-subjunctive pattern already used for library borrowing, making an appointment, and renting a bicycle."
  prs.a1.unit49.lesson02.teach.review_price_per_kilo_price:
    title: "Review: its price, to/per, kilo, how much, afghani, thirty"
    gloss: "its price / to / per / kilo / how much / afghani / thirty"
    note: "These are review words (from Unit 4, Unit 10, and other earlier units) used to ask the price per kilo."
  prs.a1.unit49.lesson02.teach.ask_price_per_kilo_phrase:
    title: "What's the price per kilo?"
    gloss: "What's the price per kilo?"
    note: "This combines the words taught earlier in this lesson."
  prs.a1.unit49.lesson02.teach.price_per_kilo_answer_phrase:
    title: "It's 30 afghanis per kilo"
    gloss: "It's 30 afghanis per kilo."
    note: "This states the price using already-taught numbers and currency."
  prs.a1.unit49.lesson03.teach.iron_word:
    title: "Iron / ironing"
    gloss: "iron / ironing"
    note: "This is the everyday Dari word for ironing clothes, used here for a laundry shop's wash-and-iron service."
    example_gloss: "I iron the clothes."
  prs.a1.unit49.lesson03.teach.review_wash_and:
    title: "Review: washing, and"
    gloss: "washing / and"
    note: "These are review words used to name the two service options."
  prs.a1.unit49.lesson03.teach.want_wash_and_iron_phrase:
    title: "I want washing and ironing"
    gloss: "I want washing and ironing."
    note: "This combines washing, and, and ironing."
  prs.a1.unit49.lesson03.teach.ready_word:
    title: "Ready"
    gloss: "ready"
    note: "This is the everyday Dari word for ready, used here to ask about or state a pickup time."
    example_gloss: "It'll be ready tomorrow."
  prs.a1.unit49.lesson03.teach.review_when_hour_five:
    title: "Review: when, tomorrow, o'clock, five"
    gloss: "when / tomorrow / o'clock / five"
    note: "These are review words (from Unit 9, Unit 16, Unit 48, and earlier units) used to ask and state the pickup time."
  prs.a1.unit49.lesson03.teach.ask_when_ready_phrase:
    title: "When will it be ready?"
    gloss: "When will it be ready?"
    note: "This combines when and ready."
  prs.a1.unit49.lesson03.teach.ready_tomorrow_five_phrase:
    title: "It'll be ready tomorrow at 5 o'clock"
    gloss: "It'll be ready tomorrow at 5 o'clock."
    note: "This states a pickup time using already-taught tomorrow, o'clock, and five."
  prs.a1.unit49.lesson04.teach.review_hello_want_wash:
    title: "Review: hello, I want, so that I wash"
    gloss: "hello / I want / so that I wash"
    note: "These are review words used to open the dialogue."
  prs.a1.unit49.lesson04.teach.review_welcome_wash_and_iron:
    title: "Review: here you go, washing, ironing, you want (polite)"
    gloss: "here you go / washing / ironing / you want (polite)"
    note: "These are review words used to ask about the service type."
  prs.a1.unit49.lesson04.teach.review_yes_price_per_kilo:
    title: "Review: yes, to/per, kilo, how much, afghani, is"
    gloss: "yes / to / per / kilo / how much / afghani / is"
    note: "These are review words used to ask the price."
  prs.a1.unit49.lesson04.teach.review_fifty_ready_tomorrow_five:
    title: "Review: fifty, ready, tomorrow, o'clock, five"
    gloss: "fifty / ready / tomorrow / o'clock / five"
    note: "These are review words used to state the price and pickup time."
  prs.a1.unit49.lesson04.teach.review_very_good_thanks_welcome:
    title: "Review: very good, thanks a lot, you're welcome"
    gloss: "very good / thanks a lot / you're welcome"
    note: "These are review words used to close the dialogue."
  prs.a1.unit49.lesson04.teach.dialogue_line1:
    title: "Homayoun: Hello. I want to wash the clothes."
    gloss: "Hello. I want to wash the clothes."
  prs.a1.unit49.lesson04.teach.dialogue_line2:
    title: "Shopkeeper: Hello, welcome. Do you want washing and ironing?"
    gloss: "Hello, welcome. Do you want washing and ironing?"
  prs.a1.unit49.lesson04.teach.dialogue_line3:
    title: "Homayoun: Yes. How much per kilo?"
    gloss: "Yes. How much per kilo?"
  prs.a1.unit49.lesson04.teach.dialogue_line4:
    title: "Shopkeeper: It's 50 afghanis per kilo. It'll be ready tomorrow at 5 o'clock."
    gloss: "It's 50 afghanis per kilo. It'll be ready tomorrow at 5 o'clock."
  prs.a1.unit49.lesson04.teach.dialogue_line5:
    title: "Homayoun: Very good. Thanks a lot."
    gloss: "Very good. Thanks a lot."
  prs.a1.unit49.lesson04.teach.dialogue_line6:
    title: "Shopkeeper: You're welcome."
    gloss: "You're welcome."
  prs.a1.unit49.lesson05.teach.review_this_is_shopkeeper_in:
    title: "Review: this, is, shopkeeper, in"
    gloss: "this / is / shopkeeper / in"
    note: "These are review words used in the reading passage."
  prs.a1.unit49.lesson05.teach.review_he_wash_iron_price_ready:
    title: "Review: he/she, washing, ironing, per kilo, 50 afghanis, tomorrow, ready"
    gloss: "he/she / washing / ironing / per kilo / 50 afghanis / tomorrow / ready"
    note: "These are review words (from this unit) used in the reading passage."
  prs.a1.unit49.lesson05.teach.wants_3rd_person_word:
    title: "Wants"
    gloss: "wants"
    note: "This is the third-person present form of the same verb already taught as I want."
    example_gloss: "He/she wants laundry service."
  prs.a1.unit49.lesson05.teach.reading_passage:
    title: "Reading about the laundry shop"
    gloss: "Homayoun is at the laundry shop. He wants washing and ironing. It's 50 afghanis per kilo. It'll be ready tomorrow."
  prs.a1.unit49.lesson06.teach.review_but_wash_wash_and_iron:
    title: "Review: but, washing, washing and ironing"
    gloss: "but / washing / washing and ironing"
    note: "But is a review word from earlier units."
  prs.a1.unit49.lesson06.teach.review_price_thirty_fifty:
    title: "Review: per kilo, thirty, fifty, afghani, is"
    gloss: "per kilo / thirty / fifty / afghani / is"
    note: "These are review words (from this unit and earlier units) used to close the unit."
  prs.a1.unit49.lesson06.teach.price_contrast_phrase:
    title: "Washing is 30 afghanis per kilo, but washing and ironing is 50"
    gloss: "Washing is 30 afghanis per kilo, but washing and ironing is 50 afghanis per kilo."
    note: "But contrasts the wash-only rate with the wash-and-iron rate."
  prs.a1.unit49.lesson06.teach.review_your_laundry_how_many_kilos:
    title: "Review: your laundry, how many, kilo"
    gloss: "your laundry / how many / kilo"
    note: "Your laundry uses the same suffix as Unit 48's your rental and Unit 47's your appointment."
  prs.a1.unit49.lesson06.teach.your_laundry_question_phrase:
    title: "How many kilos is your laundry?"
    gloss: "How many kilos is your laundry?"
    note: "This is the formal suffixed version of asking about a laundry drop-off."
