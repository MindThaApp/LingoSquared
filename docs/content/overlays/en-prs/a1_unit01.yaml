course:
  title: Dari A1
  description: >-
    Beginner Afghan Dari focused on reading Perso-Arabic script, understanding
    everyday Afghan speech, exchanging extended greetings, and handling a
    respectful first meeting in a Kabul workplace.

units:
  prs.a1.unit01.greetings:
    title: Greetings and first meetings

lessons:
  prs.a1.unit01.lesson01.script_ramp: {title: "Read the letters used in this unit"}
  prs.a1.unit01.lesson02.everyday_greetings: {title: "Exchange everyday greetings"}
  prs.a1.unit01.lesson03.time_and_farewells: {title: "Greet and say goodbye at different times"}
  prs.a1.unit01.lesson04.formal_informal_small_talk: {title: "Use polite and informal small talk"}
  prs.a1.unit01.lesson05.afghan_hospitality: {title: "Ask after a family and show respect to guests"}
  prs.a1.unit01.lesson06.first_meeting_dialogue: {title: "Start a first day at a Kabul workplace"}

teaching:
  prs.a1.unit01.lesson01.teach.alef_be_te_dal:
    title: "The letters ا، ب، ت and د"
    gloss: "a/ā, b, t, and d"
    note: "Dari is written from right to left. د does not connect onward to the left."
  prs.a1.unit01.lesson01.teach.re_ze:
    title: "The letters ر and ز"
    gloss: "r and z"
    note: "Neither letter connects onward to the following letter."
  prs.a1.unit01.lesson01.teach.sin_shin_sad:
    title: "The letters س، ش and ص"
    gloss: "s, sh, and s"
    note: "س and ص both represent an s sound in ordinary Dari; ش represents sh."
  prs.a1.unit01.lesson01.teach.jim_che_he_khe:
    title: "The letters ج، چ، ح and خ"
    gloss: "j, ch, h, and kh"
    note: "چ is ch. خ is the sound commonly romanized kh."
  prs.a1.unit01.lesson01.teach.ayn_ghayn_fe_qaf:
    title: "The letters ع، غ، ف and ق"
    gloss: "ʿ, gh, f, and q"
    note: "The precise realization of غ and ق varies among Dari speakers; keep them distinct in spelling."
  prs.a1.unit01.lesson01.teach.ke_gaf_lam_mim:
    title: "The letters ک، گ، ل and م"
    gloss: "k, g, l, and m"
    note: "Use the Persian keheh codepoint U+06A9, not Arabic kaf U+0643."
  prs.a1.unit01.lesson01.teach.nun_vav_he_ye:
    title: "The letters ن، و، ه and ی"
    gloss: "n, w/v/o/u, h, and y/long i"
    note: "Use Persian yeh U+06CC, not Arabic yeh U+064A. و may represent a consonant or a long vowel."
  prs.a1.unit01.lesson01.teach.connected_salam:
    title: "Read a connected word"
    gloss: "hello"
    note: "The letters join to form سلام. Short vowels are normally omitted."

  prs.a1.unit01.lesson02.teach.salam_alaikum:
    title: "A respectful everyday greeting"
    gloss: "Peace be upon you / hello"
    note: "سلام علیکم is widespread in Afghanistan and suits both familiar and respectful encounters."
  prs.a1.unit01.lesson02.teach.wa_alaikum_salam:
    title: "Return the greeting"
    gloss: "And peace be upon you"
    note: "وعلیکم سلام conventionally answers سلام علیکم. Forms containing السلام are also accepted."
  prs.a1.unit01.lesson02.teach.salam:
    title: "A short greeting"
    gloss: "hello"
    note: "سلام is a flexible shorter greeting."
  prs.a1.unit01.lesson02.teach.khosh_amadeed:
    title: "Welcome"
    gloss: "welcome"
    note: "خوش آمدید respectfully welcomes one person or addresses several people."
  prs.a1.unit01.lesson02.teach.tashakor:
    title: "Thank you"
    gloss: "thank you"
    note: "تشکر is the preferred Afghan Dari form in this course. ممنون and ممنونم are understood secondary variants."
  prs.a1.unit01.lesson02.teach.khahesh:
    title: "A formal response to thanks"
    gloss: "you're welcome"
    note: "خواهش می‌کنم is a polite cross-regional Persian response. It is not presented as uniquely Afghan colloquial usage."
  prs.a1.unit01.lesson02.teach.khoda_hafez:
    title: "Goodbye"
    gloss: "goodbye"
    note: "خدا حافظ is a conventional Afghan Dari farewell and is often written as two words."

  prs.a1.unit01.lesson03.teach.sobh_bekheyr:
    title: "Morning greeting"
    gloss: "good morning"
    note: "صبح بخیر is used in the morning."
  prs.a1.unit01.lesson03.teach.rooz_bekheyr:
    title: "Daytime greeting"
    gloss: "good day"
    note: "روز بخیر is a polite daytime greeting."
  prs.a1.unit01.lesson03.teach.asr_bekheyr:
    title: "Late-day greeting"
    gloss: "good afternoon / evening"
    note: "عصر بخیر fits the later part of the day."
  prs.a1.unit01.lesson03.teach.shab_bekheyr:
    title: "Night expression"
    gloss: "good night"
    note: "شب بخیر commonly closes an evening rather than opening an ordinary daytime encounter."
  prs.a1.unit01.lesson03.teach.rooz_khosh:
    title: "A polite daytime farewell"
    gloss: "have a good day"
    note: "روز خوش is a polite, somewhat formal cross-regional leave-taking rather than a distinctly Afghan colloquial formula."
  prs.a1.unit01.lesson03.teach.be_omide_didar:
    title: "Until the next meeting"
    gloss: "hope to see you again"
    note: "به امید دیدار is a warm but respectful leave-taking."

  prs.a1.unit01.lesson04.teach.polite_question:
    title: "Ask politely how someone is"
    gloss: "How are you?"
    note: "استین is a common Afghan Dari polite spoken form used with شما."
  prs.a1.unit01.lesson04.teach.informal_question:
    title: "Ask a peer or close friend"
    gloss: "How are you?"
    note: "تو and استی are informal singular; do not use this combination automatically with an elder or new acquaintance."
  prs.a1.unit01.lesson04.teach.good_answer:
    title: "Say that you are well"
    gloss: "I'm well, thank you."
    note: "استم is the characteristic first-person Dari form used throughout this course."
  prs.a1.unit01.lesson04.teach.jor_answer:
    title: "Say that you are healthy or fine"
    gloss: "I'm fine."
    note: "جور carries the sense of being well or in good health and is frequent in Afghan greetings."
  prs.a1.unit01.lesson04.teach.not_bad:
    title: "A restrained answer"
    gloss: "I'm not bad."
    note: "بد نیستم is a neutral response."
  prs.a1.unit01.lesson04.teach.and_you:
    title: "Return the question"
    gloss: "And you?"
    note: "و شما؟ keeps the exchange respectful and concise."
  prs.a1.unit01.lesson04.teach.everyone_well:
    title: "Extend the greeting"
    gloss: "Is everyone well?"
    note: "Afghan greeting sequences may continue with inquiries about the household before business begins."

  prs.a1.unit01.lesson05.teach.family_well:
    title: "Ask after someone's family"
    gloss: "Is your family well?"
    note: "Asking after family is a common part of an extended Afghan greeting. The course writes the possessive form as فامیل‌تان."
  prs.a1.unit01.lesson05.teach.household_well:
    title: "Ask after the household"
    gloss: "Is everyone at home well?"
    note: "اهل خانه refers collectively to members of the household."
  prs.a1.unit01.lesson05.teach.everyone_well:
    title: "Answer the family inquiry"
    gloss: "Thank God, everyone is well."
    note: "شکر is an abbreviated expression of gratitude here, not the word sugar in its literal food sense."
  prs.a1.unit01.lesson05.teach.zenda_bashin:
    title: "Offer a warm polite response"
    gloss: "May you live long / thank you."
    note: "زنده باشین is a locally salient Afghan courtesy formula. باشین is respectful spoken Dari."
  prs.a1.unit01.lesson05.teach.own_home:
    title: "Welcome a guest warmly"
    gloss: "This is your own home."
    note: "خانهٔ خودتان است reassures a guest that they are welcome."
  prs.a1.unit01.lesson05.teach.seat_of_honor:
    title: "Offer the respected place"
    gloss: "Please take the place of honor."
    note: "In a guest room, بالا بفرمایید invites the guest toward the more honored place away from the entrance. It does not necessarily mean upstairs."
  prs.a1.unit01.lesson05.teach.elders_first:
    title: "Greet elders first"
    gloss: "We greet elders first."
    note: >-
      Greeting elders first communicates respect. Physical greetings depend on
      relationship, gender, and individual cues; a learner should not assume
      that a handshake is appropriate.

  prs.a1.unit01.lesson06.teach.daftar:
    title: "Office"
    gloss: "office"
    note: "دفتر names an office or workplace."
  prs.a1.unit01.lesson06.teach.kabul:
    title: "Kabul"
    gloss: "Kabul"
    note: "کابل is the capital of Afghanistan and the setting for this dialogue."
  prs.a1.unit01.lesson06.teach.line01:
    title: "Hamed introduces himself as the new colleague"
    gloss: "Hamed says he is the new colleague."
    note: "Both speakers are adult male colleagues meeting at an office in Kabul."
  prs.a1.unit01.lesson06.teach.line02:
    title: "Najib welcomes him and asks his name"
    gloss: "Najib welcomes him and asks his name."
    note: "خوش آمدین is a respectful spoken Dari counterpart of خوش آمدید."
  prs.a1.unit01.lesson06.teach.line03:
    title: "Hamed gives his name"
    gloss: "Hamed gives his name."
    note: "نام من حامد است is the neutral, slightly formal way to state a name, already established in this unit."
  prs.a1.unit01.lesson06.teach.line04:
    title: "Najib introduces himself and says he is pleased to meet him"
    gloss: "Najib introduces himself and says he is pleased to meet him."
    note: "از آشنایی با شما خوش شدم explicitly refers to becoming acquainted, so it fits a first encounter."
  prs.a1.unit01.lesson06.teach.line05:
    title: "Hamed returns the pleasure and asks how Najib is"
    gloss: "Hamed returns the pleasure and asks how Najib is."
    note: "The exchange maintains respectful شما and استین between new colleagues."
  prs.a1.unit01.lesson06.teach.line06:
    title: "Najib answers"
    gloss: "Najib says he's well, thank you."
    note: "جور استم، تشکر answers the wellbeing question, as taught earlier in this unit."
  prs.a1.unit01.lesson06.teach.line07:
    title: "Najib asks after Hamed's family"
    gloss: "Najib asks after Hamed's family."
    note: "The household inquiry extends the greeting before they turn to work."
  prs.a1.unit01.lesson06.teach.line08:
    title: "Hamed says everyone is well"
    gloss: "Hamed says everyone is well."
    note: "شکر، همه جور استند answers the family inquiry, as taught earlier in this unit."
  prs.a1.unit01.lesson06.teach.line09:
    title: "Najib offers to introduce the other colleagues"
    gloss: "Najib offers to introduce the other colleagues."
    note: "بفرمایید here invites Hamed to follow along, not to sit or take something."
  prs.a1.unit01.lesson06.teach.line10:
    title: "Hamed agrees with thanks"
    gloss: "Hamed agrees with thanks."
    note: "بسیار خوب is introduced here as a clear affirmative response."
  prs.a1.unit01.lesson06.teach.line11:
    title: "Najib responds warmly and identifies Hamed's desk"
    gloss: "Najib responds warmly and identifies Hamed's desk."
    note: "The dialogue ends by beginning the workday rather than repeating a home-visit farewell sequence."
  prs.a1.unit01.lesson06.teach.line12:
    title: "Hamed thanks him"
    gloss: "Hamed thanks him."
    note: "تشکر closes the exchange simply."

exercises:
  prs.a1.unit01.lesson01.exercise01.recognize_sin:
    instruction: "Which letter begins سلام?"
    correct_option: س
    distractors: [ش, ص, چ]
    accepted_answers: [{value: س, status: correct}]
    feedback: "سلام begins with س. This question tests the spelling of the taught word, not which letters may represent the s sound."
  prs.a1.unit01.lesson01.exercise02.recognize_che:
    instruction: "Which letter represents ch?"
    correct_option: چ
    distractors: [ج, خ, ش]
    accepted_answers: [{value: چ, status: correct}]
    feedback: "چ represents ch."
  prs.a1.unit01.lesson01.exercise03.match_ke_gaf:
    instruction: "Match each letter with its sound."
    accepted_answers:
      - {value: {ک: k, گ: g}, status: correct}
    feedback: "ک is k and گ is g."
  prs.a1.unit01.lesson01.exercise04.match_final_group:
    instruction: "Match each letter with its approximate sound value."
    accepted_answers:
      - {value: {ن: n, و: "w/v", ه: h, ی: "y/long i"}, status: correct}
    feedback: "These sound values will recur throughout the unit."
  prs.a1.unit01.lesson01.exercise05.build_salam:
    instruction: "Arrange the letters to build سلام."
    accepted_answers: [{value: [س, ل, ا, م], status: correct}]
    feedback: "س ل ا م forms سلام."
  prs.a1.unit01.lesson01.exercise06.recognize_salam:
    instruction: "Select the connected word meaning hello."
    correct_option: سلام
    distractors: [شلام, سلیم, سال]
    accepted_answers: [{value: سلام, status: correct}]
    feedback: "سلام means hello."
  prs.a1.unit01.lesson01.exercise07.rtl_direction:
    instruction: "Does Dari run from right to left?"
    options: ["yes", "no"]
    accepted_answers: [{value: "yes", status: correct}]
    feedback: "Dari script runs from right to left."
  prs.a1.unit01.lesson01.exercise08.copy_salam:
    instruction: "Copy سلام exactly."
    accepted_answers: [{value: سلام, status: correct}]
    feedback: "The correct spelling is سلام."

  prs.a1.unit01.lesson02.exercise01.listen_greeting:
    instruction: "Listen and select the greeting."
    correct_option: سلام علیکم
    distractors: [خدا حافظ, خوش آمدید, تشکر]
    accepted_answers: [{value: سلام علیکم, status: correct}]
    feedback: "The speaker says سلام علیکم."
  prs.a1.unit01.lesson02.exercise02.listen_response:
    instruction: "Listen and type the conventional response."
    accepted_answers:
      - {value: "وعلیکم سلام", status: correct}
      - {value: "و علیکم سلام", status: acceptable_with_note, note: "Accepted spacing variant."}
      - {value: "وعلیکم السلام", status: acceptable_with_note, note: "Common full response variant."}
      - {value: "و علیکم السلام", status: acceptable_with_note, note: "Common full response with spaced conjunction."}
    feedback: "The recording uses وعلیکم سلام; common full forms containing السلام are also valid responses."
  prs.a1.unit01.lesson02.exercise03.reply_greeting:
    instruction: "Reply to سلام علیکم."
    accepted_answers:
      - {value: "وعلیکم سلام", status: correct}
      - {value: "و علیکم سلام", status: correct}
      - {value: "وعلیکم السلام", status: correct}
      - {value: "و علیکم السلام", status: correct}
      - {value: "سلام", status: acceptable_with_note, note: "Understandable, but less reciprocal than the full response."}
    feedback: "وعلیکم سلام and وعلیکم السلام are conventional full responses."
  prs.a1.unit01.lesson02.exercise04.welcome_meaning:
    instruction: "Select the meaning of خوش آمدید."
    correct_option: welcome
    distractors: [goodbye, "thank you", "good night"]
    accepted_answers: [{value: welcome, status: correct}]
    feedback: "خوش آمدید means welcome."
  prs.a1.unit01.lesson02.exercise05.produce_thanks:
    instruction: "Translate into Dari: Thank you."
    accepted_answers:
      - {value: تشکر, status: correct}
      - {value: ممنون, status: acceptable_with_note, note: "Understood in Dari; تشکر is the preferred course form."}
      - {value: ممنونم, status: acceptable_with_note, note: "Understood in Dari; تشکر is the preferred course form."}
    feedback: "تشکر is the preferred Afghan Dari answer in this course."
  prs.a1.unit01.lesson02.exercise06.order_youre_welcome:
    instruction: "Arrange the formal cross-regional phrase for You're welcome."
    accepted_answers: [{value: [خواهش, می‌کنم], status: correct}]
    feedback: "خواهش می‌کنم is a polite cross-regional response to thanks."
  prs.a1.unit01.lesson02.exercise07.goodbye_meaning:
    instruction: "Select the meaning of خدا حافظ."
    correct_option: goodbye
    distractors: [welcome, hello, "thank you"]
    accepted_answers: [{value: goodbye, status: correct}]
    feedback: "خدا حافظ is a farewell."
  prs.a1.unit01.lesson02.exercise08.speak_exchange:
    instruction: "You hear سلام علیکم. Return the greeting aloud."
    accepted_answers:
      - {value: "وعلیکم سلام", status: correct}
      - {value: "و علیکم سلام", status: correct}
      - {value: "وعلیکم السلام", status: correct}
      - {value: "و علیکم السلام", status: correct}
      - {value: "سلام", status: acceptable_with_note, note: "A shorter but less reciprocal response."}
    feedback: "Use وعلیکم سلام or وعلیکم السلام for a conventional full response."

  prs.a1.unit01.lesson03.exercise01.listen_morning:
    instruction: "Listen and type the morning greeting."
    accepted_answers:
      - {value: "صبح بخیر", status: correct}
      - {value: "صبح به خیر", status: acceptable_with_note, note: "Common spacing variant."}
    feedback: "The audio says صبح بخیر."
  prs.a1.unit01.lesson03.exercise02.listen_day:
    instruction: "Listen and select the daytime greeting."
    correct_option: روز بخیر
    distractors: [شب بخیر, عصر بخیر, روز خوش]
    accepted_answers: [{value: روز بخیر, status: correct}]
    feedback: "The audio says روز بخیر."
  prs.a1.unit01.lesson03.exercise03.evening_meaning:
    instruction: "When is عصر بخیر most appropriate?"
    correct_option: "late afternoon or evening"
    distractors: ["early morning", "when going to sleep", "only at farewell"]
    accepted_answers: [{value: "late afternoon or evening", status: correct}]
    feedback: "عصر بخیر fits the later part of the day."
  prs.a1.unit01.lesson03.exercise04.listen_night:
    instruction: "Listen and type the night expression."
    accepted_answers:
      - {value: "شب بخیر", status: correct}
      - {value: "شب به خیر", status: acceptable_with_note, note: "Common spacing variant."}
    feedback: "The audio says شب بخیر."
  prs.a1.unit01.lesson03.exercise05.choose_leave_taking:
    instruction: "Select the best use of روز خوش."
    correct_option: "a polite daytime leave-taking"
    distractors: ["asking someone's name", "welcoming a guest", "asking how someone is"]
    accepted_answers: [{value: "a polite daytime leave-taking", status: correct}]
    feedback: "روز خوش is a polite, somewhat formal daytime leave-taking."
  prs.a1.unit01.lesson03.exercise06.order_see_you:
    instruction: "Arrange the respectful phrase meaning Hope to see you again."
    accepted_answers: [{value: [به, امید, دیدار], status: correct}]
    feedback: "The correct order is به امید دیدار."
  prs.a1.unit01.lesson03.exercise07.listen_goodbye:
    instruction: "Listen and select the farewell."
    correct_option: خدا حافظ
    distractors: [سلام علیکم, صبح بخیر, خوش آمدید]
    accepted_answers: [{value: خدا حافظ, status: correct}]
    feedback: "The speaker says خدا حافظ."
  prs.a1.unit01.lesson03.exercise08.close_exchange:
    instruction: "Reply appropriately to به امید دیدار."
    accepted_answers:
      - {value: "خدا حافظ", status: correct}
      - {value: "به امید دیدار", status: correct}
      - {value: "روز خوش", status: correct}
    feedback: "Any taught leave-taking closes this exchange appropriately."

  prs.a1.unit01.lesson04.exercise01.choose_polite:
    instruction: "Which phrase politely asks a new adult acquaintance how they are?"
    correct_option: شما چطور استین؟
    distractors: [تو چطور استی؟, جور استم, و شما؟]
    accepted_answers: [{value: "شما چطور استین؟", status: correct}]
    feedback: "شما and استین mark the polite form."
  prs.a1.unit01.lesson04.exercise02.choose_informal:
    instruction: "Which register best describes تو چطور استی؟"
    correct_option: "informal, spoken to one person"
    distractors: ["polite, spoken to a group", "used only in formal writing", "used only in religious ceremonies"]
    accepted_answers: [{value: "informal, spoken to one person", status: correct}]
    feedback: "تو and استی address one person informally."
  prs.a1.unit01.lesson04.exercise03.listen_polite:
    instruction: "Listen and type the polite spoken question."
    accepted_answers:
      - {value: "شما چطور استین؟", status: correct}
      - {value: "شما چطور استین", status: correct}
    feedback: "The audio uses polite Dari استین."
  prs.a1.unit01.lesson04.exercise04.listen_informal:
    instruction: "Listen and select the relationship that best fits the question."
    correct_option: "a close friend or peer"
    distractors: ["an elder met for the first time", "a senior official", "several strangers"]
    accepted_answers: [{value: "a close friend or peer", status: correct}]
