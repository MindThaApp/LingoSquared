teaching:
  prs.a2.unit20.lesson01.teach.rkhst_rkhst_tabstan:
    title: Holidays
    gloss: the holiday / the summer holiday
    note: '*رخصتی* is the everyday word for a holiday or time off, and *رخصتی تابستان* is the long summer break. *تابستان* is summer.'
    example_gloss:
    - In August I have a holiday.
    - The summer holiday starts in July.
  prs.a2.unit20.lesson01.teach.hfth_andh_sal:
    title: When something happens
    gloss: next week / next year / soon
    note: '*آینده* means next or coming, and it follows the noun: *هفته آینده* is next week and *سال آینده* is next year. *به‌زودی* means soon.'
    example_gloss:
    - Next week I have an appointment.
    - Next year I want to go to Belgium.
    - Soon I have a holiday.
  prs.a2.unit20.lesson01.teach.sfr_rdn_rzrw:
    title: Three travel verbs
    gloss: to travel / to book / to stay
    note: '*سفر کردن* is travel plus *کردن*, and *رزرو کردن* is reservation plus *کردن*. In a sentence only *کردن* changes: *سفر می‌کنم*, *رزرو می‌کنم*. *ماندن* means to stay.'
    example_gloss:
    - I like travelling by train.
    - I want to book a room.
    - I'm staying for a week.
  prs.a2.unit20.lesson01.teach.hwtl_m:
    title: Where to stay
    gloss: the hotel / the campsite
    note: '*هوتل* is the usual Afghan spelling of hotel. *کمپ* is a campsite. You sleep *در هوتل* or *در کمپ*.'
    example_gloss:
    - The hotel is close to the beach.
    - We sleep on the campsite.
  prs.a2.unit20.lesson01.teach.dr_rkhst_tabstan:
    title: Asking about holiday plans
    gloss: What are you going to do in the summer holiday?
    note: 'Dari has no special helper for near plans: the ordinary present *می‌کنی* is used, and the question word *چه* stands before the verb at the end of the sentence.'
  prs.a2.unit20.lesson01.teach.dr_mah_ast:
    title: 'Near plans: the present tense'
    gloss: In August I am going to travel to Germany. I am going to book a hotel.
    note: 'To say what you are going to do soon, Dari uses the present tense with a time word: *می‌روم* (I go, I am going) with *در ماه اگست* (in August). Add the present prefix *می‌* and the ending *-م* to the stem: *رزرو می‌کنم*. The verb stays at the very end of the sentence, and the time word can come first: *هفته آینده یک هوتل رزرو می‌کنم*. Without a time word the same form can also mean an everyday habit.'
  prs.a2.unit20.lesson01.teach.mn_hwtl_rzrw:
    title: Booking a hotel
    gloss: I am going to book a hotel.
  prs.a2.unit20.lesson02.teach.wrs_rftn_w:
    title: Three plans for later
    gloss: to take a course / to move house / to save money
    note: '*کورس گرفتن* is the fixed phrase for taking a course. *کوچ کردن* is moving to a new home.'
    example_gloss:
    - I want to take a course.
    - My uncle wants to move house.
    - I want to save for a new bike.
  prs.a2.unit20.lesson02.teach.bad_bad_az:
    title: Further ahead
    gloss: later / in a month
    note: '*بعد از یک ماه* means ''a month from now''. It works with other periods too: *بعد از یک هفته*.'
    example_gloss:
    - Later I want to buy a house.
    - In a month my course starts.
  prs.a2.unit20.lesson02.teach.bad_az_mah:
    title: A course that starts
    gloss: In a month my course starts.
  prs.a2.unit20.lesson02.teach.mn_qsd_darm:
    title: 'Intentions: قصد دارم + subjunctive'
    gloss: I plan to take a course.
    note: 'To say what you intend to do, use *قصد دارم* (I intend) and then the second verb in the subjunctive: *قصد دارم یک کورس بگیرم*. The subjunctive is the prefix *بـ* + the stem + the personal ending: *بـ* + *گیر* + *-م* = *بگیرم*. Compound verbs with *کردن* take no *بـ*: *پس‌انداز کنم*. Use this for things you want to do, not for fixed arrangements.'
  prs.a2.unit20.lesson02.teach.mn_qsd_darm_2:
    title: Planning to move house
    gloss: I plan to move house.
  prs.a2.unit20.lesson02.teach.mn_qsd_darm_3:
    title: Planning to save
    gloss: I plan to save money.
  prs.a2.unit20.lesson02.teach.frda_bh_bazar:
    title: Present tense or قصد دارم?
    gloss: Tomorrow I am going to the market. Later I plan to move house.
    note: 'Use the present tense with a time word for the near, settled future: *فردا به بازار می‌روم*. Use *قصد دارم* + subjunctive for an intention that is further away or less certain: *بعد قصد دارم کوچ کنم*.'
  prs.a2.unit20.lesson03.teach.shad_htma:
    title: Maybe and certainly
    gloss: maybe / certainly
    note: '*شاید* expresses doubt and is followed by the subjunctive. *حتما* means ''certainly'' or ''for sure''.'
    example_gloss:
    - Maybe it will rain tomorrow.
    - That is certainly fun.
  prs.a2.unit20.lesson03.teach.amsal_an_tabstan:
    title: This year, this summer
    gloss: this year / this summer
    note: '*امسال* is one word for this year. *این تابستان* is this summer: *این* means this and comes before the noun.'
    example_gloss:
    - This year I am not going on holiday.
    - This summer I am staying at home.
    - Are you going on holiday this year?
  prs.a2.unit20.lesson03.teach.an_tabstan_dr:
    title: Staying at home
    gloss: This summer I am staying at home.
  prs.a2.unit20.lesson03.teach.frda_ar_mnm:
    title: شاید and the subjunctive
    gloss: Tomorrow I am going to work. Maybe I will go to the cinema later.
    note: 'After *شاید* the verb is in the subjunctive: *شاید بعد به سینما بروم* (*بـ* + the stem *رو* + *-م*), not *می‌روم*. The verb stays at the end of the sentence. After a plain time word the ordinary present is used: *فردا کار می‌کنم*.'
  prs.a2.unit20.lesson03.teach.bh_rkhst_nmrwm:
    title: Saying you are not going to
    gloss: I am not going on holiday. I do not plan to move house.
    note: 'Negate the present tense by putting *ن* in front of the verb prefix: *می‌روم* becomes *نمی‌روم*: *به رخصتی نمی‌روم*. To negate an intention, negate *دارم*: *قصد ندارم کوچ کنم* (I do not intend to move house); the second verb stays in the subjunctive.'
  prs.a2.unit20.lesson04.teach.ba_h_mdt:
    title: Two question phrases
    gloss: with whom / how long
    note: '*با کی* asks who you do something with; *با* means with. *چه مدت* asks about a period of time.'
    example_gloss:
    - Who are you going to the beach with?
    - How long are you staying?
  prs.a2.unit20.lesson04.teach.ja_mrw:
    title: Where are you going?
    gloss: Where are you going (to)?
    note: '*کجا* means where, and with a verb of motion it also means where to: *کجا می‌روی؟* The question word stands in the middle of the sentence, right before the verb.'
  prs.a2.unit20.lesson04.teach.ba_bh_rkhst:
    title: Who with?
    gloss: Who are you going on holiday with?
  prs.a2.unit20.lesson04.teach.h_mdt_anja:
    title: How long?
    gloss: How long are you staying there?
  prs.a2.unit20.lesson04.teach.ba_khwahrm_mrwm:
    title: Answering
    gloss: I am going with my sister.
  prs.a2.unit20.lesson04.teach.hfth_dw_hfth:
    title: Weeks
    gloss: one week / two weeks
    note: 'After a number the noun stays singular in Dari: *دو هفته*, not *دو هفته‌ها*.'
    example_gloss:
    - I am staying for a week.
    - We are staying for two weeks.
  prs.a2.unit20.lesson04.teach.ja_mrw_ba:
    title: Questions about plans
    gloss: Where are you going? Who are you going with? How long are you going to stay?
    note: 'Dari questions keep the normal word order: put the question word where the answer would stand and keep the verb at the end: *با کی به رخصتی می‌روی؟*, *چه مدت می‌مانی؟*. To a friend the verb ends in *-ی*: *می‌روی*, *می‌مانی*.'
  prs.a2.unit20.lesson05.teach.slam_zrmnh_bhzwd:
    title: A message from Maryam
    gloss: Hi Zarmina! Soon I have a holiday. In August I am going to Belgium with my sister and we will stay in a hotel for a week. Then I am going to my parents' for two days. Next year I plan to take a course, and maybe I will move house. What about you?
    note: 'Maryam describes near plans with the present tense and a longer-term intention with *قصد دارم*. Notice that every verb sits at the end of its sentence: *می‌مانیم*, *بگیرم*, *کنم*.'
    glosses:
      به‌زودی: soon
      رخصتی: holiday
      اگست: August
      خواهرم: sister
      به: to
      بلجیم: Belgium
      هوتل: hotel
      می‌مانیم: to stay
      بعد: after that
      والدینم: parents
      روز: days
      آینده: next
      سال: year
      قصد: intention (قصد دارم = I intend to)
      کورس: course
      بگیرم: to take (a course)
      شاید: maybe
      کوچ: to move house
      آن‌وقت: then
      هم: also
  prs.a2.unit20.lesson06.teach.slam_hmawn_bra:
    title: Zarmina asks Homayoun about his plans
    gloss: 'Zarmina: Hi Homayoun! Do you have plans for the summer holiday yet?'
  prs.a2.unit20.lesson06.teach.bl_dr_mah:
    title: Homayoun answers
    gloss: 'Homayoun: Yes! In August I am going to Germany. I am going to book a hotel.'
  prs.a2.unit20.lesson06.teach.aal_ba_mrw:
    title: Zarmina asks who he is going with
    gloss: 'Zarmina: Nice! Who are you going with?'
  prs.a2.unit20.lesson06.teach.ba_aam_ma:
    title: Homayoun says who and how long
    gloss: 'Homayoun: With my uncle. We are going to stay for a week.'
  prs.a2.unit20.lesson06.teach.w_bad_h:
    title: Zarmina asks about later
    gloss: 'Zarmina: And later? What do you plan to do?'
  prs.a2.unit20.lesson06.teach.sal_andh_qsd:
    title: Homayoun names an intention and asks back
    gloss: 'Homayoun: Next year I plan to take a course. And you?'
  prs.a2.unit20.lesson06.teach.dr_mah_jwla:
    title: Zarmina answers
    gloss: 'Zarmina: In July I am going to work. Maybe I will go to my parents'' after that.'
