  notes: "2026-07-10 fresh-context review (Claude): checked against the full checklist (same-speaker-distractor risk in multiple_choice/dialogue_response, stray YAML boolean coercion, untaught vocabulary via the compiler, matching_pairs/word_order answer-shape correctness, cross-lesson fact consistency, internal-jargon leaks, Dari translation/register/script correctness, and exercise-type registration against ExerciseRenderer.tsx) -- no real bugs found in this unit. No listen_select/listen_type/dialogue_comprehension exercises exist in this file (prs has zero TTS/audio coverage per AUTHORING_GUIDE.md #14), so the same-speaker-distractor bug class doesn't structurally arise; every multiple_choice item shows the literal Dari text being translated, not audio, so distractor overlap with other same-speaker lines elsewhere in the dialogue can't create ambiguity the way it does for listen_select. matching_pairs accepted_answers use the established flat-dict shape and word_order accepted_answers use the established space-joined-string shape, both of which the compiler/grade() already canonicalize correctly. Compiler validation (grouped with the rest of the prs A1 corpus, per course-level Course-row scoping) is clean: 0 errors, 0 warnings. Re-verified against the file's own original self-report below, which is accurate. Authored with prs a1_unit60_sports_event.yaml for en-prs only. Firecrawl search was retried fresh and returned HTTP 402 (insufficient credits), so the repo's own cached DLI Dari corpus (.firecrawl/dli-dari-s9-12.txt, s17-20.txt, s21-24.txt, s25-28.txt, s29-32.md) was searched instead via English-keyword and direct Dari-script greps. A genuine, on-topic hit was found this time: dli-dari-s29-32.md (Lesson 30) contains a real narrative sentence about people watching football matches (مسابقات فوتبال) and buzkashi, plus a two-speaker exchange discussing match plans, a ticket price, and a stadium -- confirming مسابقه (match) as real, source-attested Dari vocabulary. The source exchange itself was written in a strongly informal-تو, heavily contracted register that conflicts with this course's established استم/استین polite-first, full-uncontracted register, so it was not copied; its own price and venue were also not reused verbatim, to avoid an unverified factual claim and a near-duplicate price to this unit's own sign. فوتبال (football, unit29) and کرکت (cricket, unit29) were already course-internal vocabulary, needing no fresh sourcing. Two further new words were authored from established convention rather than DLI attestation, disclosed honestly: تیم (team), a standard modern Dari/Farsi loanword (same class as unit53's موزیم and unit54's کنسرت), and برد (won), the native Dari/Persian 3rd-person simple past of بردن (\"to win\"), fitting the same paradigm as the course's already-established رفت/بود/کرد/دید. کابل itself is not new -- established since unit01/02/16/31/35 -- and تیم کابل (\"the Kabul team\") is disclosed honestly as a generic civic-team construction, not a claim about a real specific football club, matching unit54's own سیما-as-invented-performer precedent. No bare Yes/No/True/False/On/Off gloss values exist anywhere in this unit. Dialogue content uses structured speakers in the realization, not embedded speaker labels. Lesson04's multiple_choice distractors were checked against the standing same-speaker-distractor rule: every distractor for a tested همایون line is drawn only from کارمند's three lines, and vice versa -- no exercise draws a distractor from the same character's other lines. This task did not open any fa/a1_unit* file at any point -- fa and prs are separate realizations per universal_spine.yaml's own explicit invariant, and every vocabulary/register choice here was made independently.\n\nReview 2026-10-20 (en-prs A1 pass): 4 fixes - بلیط replaced with تکت in all quoted Dari; evening changed to afternoon for 5 pm and 3 pm; removed source-attestation wording from the match note; added word-order variants for the plan question. NATIVE FLAGS: see realization. Follow-up: gloss of سلام، بفرمایین changed from Hello, please/here you go to Hello, welcome (same as units 48-54)."
course:
  title: Dari A1
  description: "Beginner Kabul Dari: make plans to attend a football match, buy a ticket at the counter, ask about kickoff time and price, and talk simply about the result afterward."
