  prs.a1.unit44.lesson06.wrap_up:
    title: Wrap-up
teaching:
  prs.a1.unit44.lesson01.teach.review_is_in:
    title: "Review: is, in"
    gloss: is / in
    note: "است and در (both used throughout this course) are review words used to talk about where something is."
  prs.a1.unit44.lesson01.teach.review_colors:
    title: "Review: color, green, blue"
    gloss: color / green / blue
    note: "رنگ, سبز, and آبی (from unit38) are review words used to name the two waste bins."
  prs.a1.unit44.lesson01.teach.bin_word:
    title: Bin
    gloss: bin
    note: "سطل is the everyday Dari word for a bin or bucket."
    example_gloss: The bin is green.
  prs.a1.unit44.lesson01.teach.waste_word:
    title: Waste / trash
    gloss: waste / trash
    note: "زباله means household waste or trash."
    example_gloss: The trash is in the bin.
  prs.a1.unit44.lesson01.teach.green_bin_phrase:
    title: Green bin
    gloss: green bin
    note: "سطل سبز combines سطل (bin) and سبز (green)."
  prs.a1.unit44.lesson01.teach.plastic_word:
    title: Plastic
    gloss: plastic
    note: "پلاستیک is a standard loanword used across Persian varieties, including Dari."
    example_gloss: The plastic is in the blue bin.
  prs.a1.unit44.lesson01.teach.waste_in_green_bin_phrase:
    title: The trash is in the green bin
    gloss: The trash is in the green bin.
    note: "زباله در سطل سبز است combines the words taught earlier in this lesson."
  prs.a1.unit44.lesson02.teach.review_which_in_is:
    title: "Review: which, in, is"
    gloss: which / in / is
    note: "کدام (from unit14/unit43), در, and است are review words used to ask which bin something belongs in."
  prs.a1.unit44.lesson02.teach.paper_word:
    title: Paper
    gloss: paper
    note: "کاغذ is the everyday Dari word for paper."
    example_gloss: The paper is in the bin.
  prs.a1.unit44.lesson02.teach.glass_word:
    title: Glass
    gloss: glass
    note: "شیشه is the everyday Dari word for glass."
    example_gloss: The glass is in the bin.
  prs.a1.unit44.lesson02.teach.blue_bin_phrase:
    title: Blue bin
    gloss: blue bin
    note: "سطل آبی combines سطل (bin) and آبی (blue), used for recyclables like paper, plastic, and glass."
  prs.a1.unit44.lesson02.teach.ask_which_bin_paper_phrase:
    title: Which bin is the paper in?
    gloss: Which bin is the paper in?
    note: "کاغذ در کدام سطل است؟ asks which bin an item belongs in."
  prs.a1.unit44.lesson02.teach.paper_blue_bin_phrase:
    title: The paper is in the blue bin
    gloss: The paper is in the blue bin.
    note: "کاغذ در سطل آبی است answers the question with the correct bin."
  prs.a1.unit44.lesson02.teach.glass_blue_bin_phrase:
    title: The glass is in the blue bin
    gloss: The glass is in the blue bin.
    note: "شیشه در سطل آبی است follows the same pattern as the paper sentence."
  prs.a1.unit44.lesson03.teach.review_object_marker_put:
    title: "Review: object marker, I put/throw"
    gloss: (object marker) / I put / throw
    note: "را (from unit14/unit26/unit36/unit43) and می‌اندازم (from unit36, there used for 'I add salt') are review words -- انداختن genuinely covers both 'add/put' and 'throw/discard'."
  prs.a1.unit44.lesson03.teach.away_word:
    title: Away
    gloss: away
    note: "دور (away) combines with می‌اندازم in the standard دور انداختن ('to throw away') construction."
    example_gloss: I throw (it) away.
  prs.a1.unit44.lesson03.teach.throw_away_waste_phrase:
    title: I throw away the trash
    gloss: I throw away the trash.
    note: "زباله را دور می‌اندازم combines زباله را, دور, and می‌اندازم."
  prs.a1.unit44.lesson03.teach.put_plastic_green_bin_phrase:
    title: I put the plastic in the blue bin
    gloss: I put the plastic in the blue bin.
    note: "پلاستیک را در سطل آبی می‌اندازم uses می‌اندازم in its 'put into' sense."
  prs.a1.unit44.lesson03.teach.put_paper_blue_bin_phrase:
    title: I put the paper in the blue bin
    gloss: I put the paper in the blue bin.
    note: "کاغذ را در سطل آبی می‌اندازم follows the same pattern with the blue bin."
  prs.a1.unit44.lesson03.teach.review_negative_put:
    title: "Review: I don't put/throw"
    gloss: I don't put / throw
    note: "نمی‌اندازم is the regular نمی- negative of می‌اندازم."
  prs.a1.unit44.lesson03.teach.not_glass_green_bin_phrase:
    title: I don't put glass in the green bin
    gloss: I don't put glass in the green bin.
    note: "شیشه را در سطل سبز نمی‌اندازم states a sorting rule using the negative form."
  prs.a1.unit44.lesson03.teach.glass_blue_bin_action_phrase:
    title: I put glass in the blue bin
    gloss: I put glass in the blue bin.
    note: "شیشه را در سطل آبی می‌اندازم gives the correct action for glass."
  prs.a1.unit44.lesson04.teach.review_this:
    title: "Review: this"
    gloss: this
    note: "این (from unit04/unit43) is a review word used in the dialogue."
  prs.a1.unit44.lesson04.teach.review_very_good_thanks_welcome:
    title: "Review: very, good, thanks a lot, you're welcome"
    gloss: very / good / thanks a lot / you're welcome
    note: "بسیار, خوب, تشکر زیاد, and خواهش می‌کنم (from unit01/unit06/unit09/unit40/unit43) are review words used to close the dialogue."
  prs.a1.unit44.lesson04.teach.dialogue_line1:
    title: "Wahid: Shukria, which bin do I put this glass in?"
    gloss: Shukria, which bin do I put this glass in?
  prs.a1.unit44.lesson04.teach.dialogue_line2:
    title: "Shukria: The glass is in the blue bin."
    gloss: The glass is in the blue bin.
  prs.a1.unit44.lesson04.teach.dialogue_line3:
    title: "Wahid: Which bin do I put this trash in?"
    gloss: Which bin do I put this trash in?
  prs.a1.unit44.lesson04.teach.dialogue_line4:
    title: "Shukria: The trash is in the green bin."
    gloss: The trash is in the green bin.
  prs.a1.unit44.lesson04.teach.dialogue_line5:
    title: "Wahid: Very good. Thanks a lot."
    gloss: Very good. Thanks a lot.
  prs.a1.unit44.lesson04.teach.dialogue_line6:
    title: "Shukria: You're welcome."
    gloss: You're welcome.
  prs.a1.unit44.lesson05.teach.review_wahid_he_she_every_day:
    title: "Review: Wahid, he/she, every day, also, happy"
    gloss: Wahid / he/she / every day / also / happy
    note: "وحید, او, هر روز, هم, and خوشحال (from unit12/unit25/unit33) are review words used in the reading passage."
  prs.a1.unit44.lesson05.teach.review_throws_third_person:
    title: "Review: he/she throws"
    gloss: he/she puts / throws
    note: "می‌اندازد is the 3rd-person form of the می‌اندازم/نمی‌اندازم family taught earlier in this unit."
  prs.a1.unit44.lesson05.teach.reading_passage:
    title: Reading about Wahid and the waste
    gloss: "Wahid throws away the trash every day. The paper is in the blue bin. The plastic is also in the blue bin. The trash is in the green bin. Wahid is happy."
  prs.a1.unit44.lesson06.teach.review_days_but_formal_you:
    title: "Review: Monday, Tuesday, but, you (formal)"
    gloss: "Monday / Tuesday / but / you (formal)"
    note: "دوشنبه, سه‌شنبه (from unit09/unit43), اما, and شما (from unit03/unit33/unit43) are review words used to state a two-item schedule."
  prs.a1.unit44.lesson06.teach.collection_word:
    title: Collection
    gloss: collection
    note: "جمع‌آوری means collection or gathering, used for waste-collection day the same way \"garbage collection\" is used in English."
    example_gloss: The collection day is Monday.
  prs.a1.unit44.lesson06.teach.paper_collection_day_phrase:
    title: Paper collection day is Monday
    gloss: Paper collection day is Monday.
    note: "روز جمع‌آوری کاغذ دوشنبه است names the item and its collection day."
  prs.a1.unit44.lesson06.teach.waste_collection_day_phrase:
    title: Trash collection day is Tuesday
    gloss: Trash collection day is Tuesday.
    note: "روز جمع‌آوری زباله سه‌شنبه است follows the same pattern for trash."
  prs.a1.unit44.lesson06.teach.contrast_schedule_phrase:
    title: Paper Monday, but trash Tuesday
    gloss: Paper collection day is Monday, but trash collection day is Tuesday.
    note: "اما contrasts the two collection days."
  prs.a1.unit44.lesson06.teach.review_throw_formal:
    title: "Review: you throw/put (formal)"
    gloss: you throw / put (formal)
    note: "می‌اندازین is the formal-plural form, extending the same -ین family as می‌خواهین/کنین."
  prs.a1.unit44.lesson06.teach.formal_question_phrase:
    title: Which day do you throw away the trash?
    gloss: Which day do you throw away the trash?
    note: "The formal شما-prefixed version of asking which day someone throws away the trash."
