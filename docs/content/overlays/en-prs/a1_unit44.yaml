course:
  title: Dari A1
  description: "Beginner Kabul Dari: sort household waste into the correct bin, ask which bin an item belongs in, and read a short two-item collection-day schedule -- talk about trash, paper, plastic, and glass, and confirm green/blue bin sorting with a friend."
units:
  prs.a1.unit44.waste_disposal:
    title: Sorting waste
    description: Sort household waste into the correct bin, ask which bin something belongs in, and understand a simple waste-collection schedule.
lessons:
  prs.a1.unit44.lesson01.waste_bin_vocabulary:
    title: Waste, bin, and plastic vocabulary
