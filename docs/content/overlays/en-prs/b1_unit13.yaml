course:
  title: Dari B1
  description: 'Intermediate Kabul Dari: describing job responsibilities, giving status updates, and asking colleagues for help.'
units:
  prs.b1.unit13.workplace:
    title: Responsibilities and work updates
    description: Describe your responsibilities at work, give a colleague a status update, and ask a colleague for help politely.
lessons:
  prs.b1.unit13.lesson01.responsibilities:
    title: I am responsible for...
  prs.b1.unit13.lesson02.status_update:
    title: Status updates
  prs.b1.unit13.lesson03.ask_for_help:
    title: Asking a colleague for help
