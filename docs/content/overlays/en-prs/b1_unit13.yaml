teaching:
  prs.b1.unit13.lesson01.teach.mas:
    title: Responsible
    gloss: responsible
    note: مسئول means responsible; the area follows, then the copula.
    example_gloss: Homayoun is responsible for the report.
  prs.b1.unit13.lesson01.teach.grammar:
    title: Describing responsibilities
    gloss: من مسئول ... استم
    note: 'To describe your responsibility, say مسئول + the area + استم: من مسئول گزارش‌های هفته‌وار استم (I am responsible for the weekly report). To describe what you do, use the present tense: من گزارش می‌نویسم (I write reports).'
  prs.b1.unit13.lesson01.teach.hafta:
    title: Week
    gloss: week
    note: هفته means week.
    example_gloss: I write a report every week.
  prs.b1.unit13.lesson01.teach.gozaresh:
    title: Report
    gloss: report
    note: گزارش means report.
    example_gloss: This report is important.
  prs.b1.unit13.lesson01.teach.shirkat:
    title: Company
    gloss: company
    note: شرکت means company.
    example_gloss: Zarmina works at a company.
  prs.b1.unit13.lesson01.teach.haftawar:
    title: Weekly
    gloss: weekly
    note: هفته‌وار means weekly.
    example_gloss: This report is weekly.
  prs.b1.unit13.lesson01.teach.minawisam:
    title: I write
    gloss: I write
    note: می‌نویسم is the 1st person present of نوشتن (to write).
    example_gloss: I write a report every week.
  prs.b1.unit13.lesson02.teach.hanuz:
    title: Yet / still
    gloss: yet / still
    note: هنوز means yet or still; with a negative it means "not yet".
    example_gloss: The work is not finished yet.
  prs.b1.unit13.lesson02.teach.grammar:
    title: Giving a status update
    gloss: تمام کردم / هنوز تمام نشده است
    note: 'For a status update, say what is finished and what is not yet: گزارش را تمام کردم (I finished the report); گزارش هنوز تمام نشده است (the report is not finished yet). Add فردا + the present tense for a plan: فردا آن را می‌فرستم (tomorrow I will send it).'
  prs.b1.unit13.lesson02.teach.tamam:
    title: Is not finished
    gloss: is not finished
    note: تمام نشده است means "has not been finished"; the positive is تمام شده است.
    example_gloss: The report is not finished yet.
  prs.b1.unit13.lesson02.teach.tamam_kardam:
    title: I finished
    gloss: I finished
    note: 'تمام کردم is the simple past: I finished.'
    example_gloss: I finished today's work.
  prs.b1.unit13.lesson02.teach.farda:
    title: Tomorrow
    gloss: tomorrow
    note: فردا means tomorrow.
    example_gloss: Tomorrow I will send it.
  prs.b1.unit13.lesson02.teach.mifrestam:
    title: I send
    gloss: I send
    note: می‌فرستم is the 1st person present of فرستادن (to send); with فردا it refers to the future.
    example_gloss: Tomorrow I will send it.
  prs.b1.unit13.lesson03.teach.komak:
    title: Help
    gloss: help
    note: کمک means help; کمک کردن is "to help".
    example_gloss: Could you please help me?
  prs.b1.unit13.lesson03.teach.grammar:
    title: Asking for help politely
    gloss: می‌شود که لطفاً ... کنین؟
    note: 'To ask a colleague for help politely, use می‌شود که لطفاً + the polite subjunctive (-ین) + the topic: می‌شود که لطفاً در این گزارش به من کمک کنین؟ (could you please help me with this report?).'
  prs.b1.unit13.lesson03.teach.komak_konin:
    title: (that) you help
    gloss: (that) you help
    note: کمک کنین is the polite 2nd person plural subjunctive.
    example_gloss: Could you please help me with this report?
  prs.b1.unit13.lesson03.teach.lotfan:
    title: Please
    gloss: please
    note: لطفاً means please and makes a request polite.
    example_gloss: Please send an email.
  prs.b1.unit13.lesson03.teach.bakhsh:
    title: Last section
    gloss: last section
    note: بخش آخر means the last section or part.
    example_gloss: I have a problem in the last section.
  prs.b1.unit13.lesson03.teach.mushkil:
    title: Problem
    gloss: problem
    note: مشکل means problem.
    example_gloss: I have a problem in the last section.
  prs.b1.unit13.lesson04.teach.chetor_shod:
    title: How did it go
    gloss: how did it go
    note: چطور شد؟ asks how something turned out.
    example_gloss: How did your work go?
  prs.b1.unit13.lesson04.teach.bale:
    title: 'Yes'
    gloss: 'yes'
    note: بلی means yes.
    example_gloss: Yes, I will send it tomorrow.
  prs.b1.unit13.lesson04.teach.mifrestad:
    title: He/she sends
    gloss: he/she sends
    note: می‌فرستد is the 3rd person present of فرستادن; with فردا it refers to the future.
    example_gloss: She will send the report tomorrow.
  prs.b1.unit13.lesson04.teach.hatman:
    title: Of course
    gloss: of course
    note: حتماً means certainly or of course.
    example_gloss: Yes, of course I will help.
  prs.b1.unit13.lesson04.teach.tashakor:
    title: Thanks
    gloss: thanks
    note: تشکر means thanks.
    example_gloss: Thank you very much.
  prs.b1.unit13.lesson04.teach.dialogue01:
    title: Zarmina, how did the weekly report go?
    gloss: Zarmina, how did the weekly report go?
    note: Homayoun asks for a status update.
  prs.b1.unit13.lesson04.teach.dialogue02:
    title: It is not finished yet. I will send it tomorrow.
    gloss: It is not finished yet. I will send it tomorrow.
    note: Zarmina says what is not finished and when she will send it.
  prs.b1.unit13.lesson04.teach.dialogue03:
    title: Do you have a problem?
    gloss: Do you have a problem?
    note: Homayoun asks whether there is a problem.
  prs.b1.unit13.lesson04.teach.dialogue04:
    title: Yes. Could you please help me with the last section?
    gloss: Yes. Could you please help me with the last section?
    note: Zarmina asks politely for help with the last section.
  prs.b1.unit13.lesson04.teach.dialogue05:
    title: Yes, of course. I have time in the afternoon.
    gloss: Yes, of course. I have time in the afternoon.
    note: Homayoun agrees and says when he is free.
  prs.b1.unit13.lesson04.teach.dialogue06:
    title: Thank you very much, Homayoun.
    gloss: Thank you very much, Homayoun.
    note: Zarmina thanks him.
  prs.b1.unit13.lesson05.teach.khast:
    title: Asked for / wanted
    gloss: asked for / wanted
    note: خواست is the 3rd person simple past of خواستن; از ... خواست که means "asked ... to".
    example_gloss: She asked Homayoun to help.
  prs.b1.unit13.lesson05.teach.reading:
    title: Zarmina's work
    gloss: Zarmina works at a company. She is responsible for the weekly report. The report is not finished yet, so she asked Homayoun to help. Homayoun said that he has time in the afternoon.
    note: 'A short work update told in the third person: responsibility, status, a polite request for help, and the answer.'
  prs.b1.unit13.lesson06.teach.grammar:
    title: 'Review: work and updates'
    gloss: مسئول، تمام نشده است، کمک کنین
    note: 'Review: say what you are responsible for (من مسئول ... استم), give a status (تمام کردم / هنوز تمام نشده است, فردا ... می‌فرستم), and ask for help politely (می‌شود که لطفاً ... کنین؟).'
  prs.b1.unit13.lesson06.teach.r_modir:
    title: Manager
    gloss: manager
    note: مدیر means manager.
    example_gloss: The manager wants the report.
  prs.b1.unit13.lesson06.teach.r_waqt:
    title: Time
    gloss: time
    note: وقت means time.
    example_gloss: I have no time today.
