  required_next_reviewer: null
  notes: "Authored alongside the new prs a1_unit21_clothing.yaml realization, same worker, same pass. Follows the established en-prs overlay convention from units 01-20 (English instruction/correct_option/distractors/feedback, target-language Dari accepted_answers, English glosses for recognize_* multiple_choice items). The multi-clause production exercises (write_own_label in lesson04, dialogue_response_ask_size and write_purchase_summary in lesson05, write_own_purchase_summary in lesson06) carry period-joined, comma-joined, and و-joined accepted_answers variants at every clause boundary, matching the §12 pattern established in units 12/15/19/20's own reviews.

    FRESH-CONTEXT REVIEW COMPLETED 2026-07-10 (Claude, same pass as the paired realization -- see that file's review notes for the full detail). Found and fixed in this overlay: (1) match_clothing_words expanded from 4 to 6 pairs (added است/گران) to match the paired realization's fix. (2) write_purchase_summary and write_own_purchase_summary expanded from partial to full 3x3 systematic period/comma/و boundary coverage. (3) 16 learner-facing note fields reworded away from the internal-sounding 'reviewed' (e.g. 'گران (expensive) -- reviewed from the shopping unit.' -> '...already familiar from the shopping unit.') -- these notes render directly on the teaching card to real learners. Everything else (instruction/answer coherence, no stray YAML booleans, no jargon leaks elsewhere) confirmed clean. Compiler validate re-run together with units 19/20/22 clean (0 errors/0 warnings) after all fixes.

    Review 2026-10-20 (en-prs A1 pass): 3 fixes - write_purchase_summary accepted answers used the incoherent اندازه‌اش بود (its size was) and now say اندازه‌اش بزرگ بود, with instruction and feedback matched (its size, it was big); added accepted answers این پیراهن چه رنگ است؟ and زرمینه پیراهن خرید. NATIVE FLAGS: لباس vs کالا for clothes; کفش vs بوت for shoes; پنجصد vs پانصد for 500; پطلون vs شلوار; می‌تانم as accepted colloquial form."

course:
  title: Dari A1
  description: >-
    Beginner Kabul Dari: clothing-item vocabulary, colors, sizes,
    trying on a garment, reading a clothing label, and a full store
    dialogue buying a shirt.

units:
  prs.a1.unit21.clothing:
    title: Buying clothes
    description: Identify common clothing items and complete a simple clothing purchase.

lessons:
  prs.a1.unit21.lesson01.clothing_vocabulary:
    title: "Clothing words"
  prs.a1.unit21.lesson02.colors:
    title: "Colors"
  prs.a1.unit21.lesson03.sizes:
    title: "Sizes"
  prs.a1.unit21.lesson04.trying_on_and_reading_a_label:
    title: "Trying on and reading a label"
  prs.a1.unit21.lesson05.clothing_shop_dialogue:
    title: "A dialogue at the clothing shop"
  prs.a1.unit21.lesson06.wrap_up_reading:
    title: "Wrap-up reading"

teaching:
  prs.a1.unit21.lesson01.teach.lebas:
    title: Clothes
    gloss: clothes
    note: "لباس means clothes (the general word)."
    example_gloss: "These are new clothes."
  prs.a1.unit21.lesson01.teach.perahan:
    title: Shirt
    gloss: shirt
    note: "پیراهن means shirt."
    example_gloss: "This shirt is nice."
  prs.a1.unit21.lesson01.teach.patlun:
    title: Trousers
    gloss: trousers
    note: "پطلون means trousers -- the genuine Afghan Dari word (an English loanword via 'pantaloon'), distinct from Iranian Farsi's شلوار."
    example_gloss: "These trousers are expensive."
  prs.a1.unit21.lesson01.teach.kafsh:
    title: Shoes
    gloss: shoes
    note: "کفش means shoes."
    example_gloss: "These shoes are cheap."
  prs.a1.unit21.lesson01.teach.review_ast:
    title: "Is / are"
    gloss: "is"
    note: "است (is) -- already familiar from the greetings unit."
    example_gloss: "This is a shirt."
  prs.a1.unit21.lesson01.teach.review_geran:
    title: Expensive
    gloss: expensive
    note: "گران (expensive) -- already familiar from the shopping unit."
    example_gloss: "These trousers are expensive."
  prs.a1.unit21.lesson02.teach.rang:
    title: Color
    gloss: color
    note: "رنگ means color."
    example_gloss: "What color is this shirt?"
  prs.a1.unit21.lesson02.teach.siyah:
    title: Black
    gloss: black
    note: "سیاه means black."
    example_gloss: "These trousers are black."
  prs.a1.unit21.lesson02.teach.safid:
    title: White
    gloss: white
    note: "سفید means white."
    example_gloss: "This shirt is white."
  prs.a1.unit21.lesson02.teach.sorkh:
    title: Red
    gloss: red
    note: "سرخ means red -- the Dari/Classical-Persian form, not Iranian colloquial قرمز."
    example_gloss: "These shoes are red."
  prs.a1.unit21.lesson03.teach.andaza:
    title: Size
    gloss: size
    note: "اندازه means size (the noun)."
    example_gloss: "What is your size?"
  prs.a1.unit21.lesson03.teach.andazatan_chand:
    title: "What is your size?"
    gloss: "What is your size?"
    note: "اندازه شما چند است؟ literally asks 'your size is how much?'"
  prs.a1.unit21.lesson03.teach.in_andaza_shoma:
    title: "Is this your size?"
    gloss: "Is this your size?"
    note: "این اندازه شما است؟ uses این (this), introduced here."
  prs.a1.unit21.lesson03.teach.review_bozorg:
    title: Big
    gloss: big
    note: "بزرگ (big) -- already familiar from the comparisons unit."
    example_gloss: "This shirt is big."
  prs.a1.unit21.lesson03.teach.review_kochak:
    title: Small
    gloss: small
    note: "کوچک (small) -- already familiar from the comparisons unit."
    example_gloss: "These shoes are small."
  prs.a1.unit21.lesson04.teach.pero_kardan:
    title: "May I try this on?"
    gloss: "May I try this on?"
    note: "پرو کردن means 'to try on' (a French loanword shared by both Dari and Farsi). می‌توانم این را پرو کنم؟ literally 'can I this try-on-do?'"
  prs.a1.unit21.lesson04.teach.mitanin_pero_konin:
    title: "Yes, you can try it on"
    gloss: "Yes, you can try it on."
    note: "می‌توانین پرو کنین is the polite second-person form of the same verb."
  prs.a1.unit21.lesson04.teach.label_text:
    title: "A clothing label"
    gloss: "Shirt: size big, color white, 500 afghanis"
    note: "A simple label showing item, size, color, and price."
  prs.a1.unit21.lesson04.teach.review_ra:
    title: "Object marker"
    gloss: "(object marker)"
    note: "را marks the direct object -- already familiar, seen in earlier units' phrase patterns."
    example_gloss: "I want this shirt."
  prs.a1.unit21.lesson04.teach.review_afghani:
    title: Afghani
    gloss: afghani
    note: "افغانی (afghani) -- the currency, already familiar from the shopping unit."
    example_gloss: "This is 500 afghanis."
  prs.a1.unit21.lesson05.teach.che_rang_darad:
    title: "What color is this shirt?"
    gloss: "What color is this shirt?"
    note: "این پیراهن چه رنگ دارد؟ uses دارد (has), introduced here."
  prs.a1.unit21.lesson05.teach.turn01:
    title: "Shopkeeper greets"
    gloss: "Hello, welcome."
  prs.a1.unit21.lesson05.teach.turn02:
    title: "Zarmina asks"
    gloss: "Hello. What color is this shirt?"
    note: "زرمینه (Zarmina) is a recurring character in this course, first introduced in the time and daily-routines units."
  prs.a1.unit21.lesson05.teach.turn03:
    title: "Shopkeeper answers"
    gloss: "I have black and white."
  prs.a1.unit21.lesson05.teach.turn04:
    title: "Zarmina chooses"
    gloss: "I want the white shirt. Is the size big?"
    note: "اندازه‌اش (its size) attaches the possessive ending to اندازه."
  prs.a1.unit21.lesson05.teach.turn05:
    title: "Shopkeeper confirms"
    gloss: "Yes, it's big. You can try it on."
  prs.a1.unit21.lesson05.teach.turn06:
    title: "Zarmina tries it on"
    gloss: "Thanks. This is my size. How much is it?"
  prs.a1.unit21.lesson05.teach.turn07:
    title: "Shopkeeper states the price"
    gloss: "It's 500 afghanis."
  prs.a1.unit21.lesson05.teach.turn08:
    title: "Zarmina agrees"
    gloss: "Very good, I'll buy it."
    note: "می‌خرم is the first-person present of خریدن (to buy)."
  prs.a1.unit21.lesson05.teach.review_dokandar:
    title: Shopkeeper
    gloss: shopkeeper
    note: "دوکاندار (shopkeeper) -- already familiar from the shopping unit."
    example_gloss: "The shopkeeper sells shirts."
  prs.a1.unit21.lesson05.teach.review_besyar_khoob:
    title: "Very good"
    gloss: "very good"
    note: "بسیار خوب (very good) -- already familiar from the shopping unit."
    example_gloss: "Very good, thanks."
  prs.a1.unit21.lesson05.teach.review_che:
    title: What
    gloss: what
    note: "چه (what) -- already familiar, seen in earlier units' question patterns."
    example_gloss: "What color is this?"
  prs.a1.unit21.lesson06.teach.review_va:
    title: And
    gloss: and
    note: "و (and) -- already familiar from the shopping unit."
    example_gloss: "I'm buying a shirt and trousers."
  prs.a1.unit21.lesson06.teach.review_yak:
    title: One
    gloss: one
    note: "یک (one) -- already familiar from the numbers unit."
    example_gloss: "I'm buying one shirt."
  prs.a1.unit21.lesson06.teach.review_ba:
    title: To
    gloss: to
    note: "به (to) -- already familiar from the directions/daily-routines units."
    example_gloss: "I'm going to the shop."
  prs.a1.unit21.lesson06.teach.review_dokan:
    title: Shop
    gloss: shop
    note: "دوکان (shop) -- already familiar from the shopping unit."
    example_gloss: "This shop is big."
  prs.a1.unit21.lesson06.teach.review_raft:
    title: "Went"
    gloss: "went"
    note: "رفت (went, third person) -- already familiar from the past-events unit."
    example_gloss: "Zarmina went to the shop."
  prs.a1.unit21.lesson06.teach.review_qeymatesh:
    title: "Its price"
    gloss: "its price"
    note: "قیمتش (its price) -- already familiar from the shopping unit."
    example_gloss: "Its price was 500 afghanis."
  prs.a1.unit21.lesson06.teach.summary_text:
    title: "A shopping summary"
    gloss: "Zarmina went to the shop. She bought a white, big shirt. It cost 500 afghanis."
    note: "خرید (bought) and بود (was) are both simple past forms, already familiar from the past-events unit."

exercises:
  prs.a1.unit21.lesson01.exercise01.recognize_lebas:
    instruction: "What does this word mean?"
    correct_option: clothes
    distractors: [shirt, shoes, trousers]
    accepted_answers: [{value: clothes, status: correct}]
    feedback: "لباس means clothes."
  prs.a1.unit21.lesson01.exercise02.recognize_perahan:
    instruction: "What does this word mean?"
    correct_option: shirt
    distractors: [clothes, trousers, shoes]
    accepted_answers: [{value: shirt, status: correct}]
    feedback: "پیراهن means shirt."
  prs.a1.unit21.lesson01.exercise03.recognize_patlun_reading:
    instruction: "What does this word mean?"
    correct_option: trousers
    distractors: [shirt, shoes, clothes]
    accepted_answers: [{value: trousers, status: correct}]
    feedback: "پطلون means trousers."
  prs.a1.unit21.lesson01.exercise04.match_clothing_words:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - value: {لباس: clothes, پیراهن: shirt, پطلون: trousers, کفش: shoes, است: "is / are", گران: expensive}
        status: correct
    feedback: "These are this lesson's core clothing words, plus است and گران from this same lesson's example sentences."
  prs.a1.unit21.lesson01.exercise05.order_perahan_gran:
    instruction: "Put the words in order: The shirt is expensive."
    accepted_answers:
      - {value: "پیراهن گران است", status: correct}
    feedback: "پیراهن گران است means the shirt is expensive."
  prs.a1.unit21.lesson01.exercise06.translate_kafsh:
    instruction: "Translate into Dari: shoes"
    accepted_answers:
      - {value: کفش, status: correct}
    feedback: "کفش means shoes."
  prs.a1.unit21.lesson01.exercise07.write_lebas:
    instruction: "Write the Dari word for clothes."
    accepted_answers:
      - {value: لباس, status: correct}
    feedback: "لباس means clothes."
  prs.a1.unit21.lesson02.exercise01.recognize_rang:
    instruction: "What does this word mean?"
    correct_option: color
    distractors: [size, shirt, shop]
    accepted_answers: [{value: color, status: correct}]
    feedback: "رنگ means color."
  prs.a1.unit21.lesson02.exercise02.recognize_siyah:
    instruction: "What does this word mean?"
    correct_option: black
    distractors: [white, red, color]
    accepted_answers: [{value: black, status: correct}]
    feedback: "سیاه means black."
  prs.a1.unit21.lesson02.exercise03.recognize_safid_reading:
    instruction: "What does this word mean?"
    correct_option: white
    distractors: [black, red, color]
    accepted_answers: [{value: white, status: correct}]
    feedback: "سفید means white."
  prs.a1.unit21.lesson02.exercise04.match_color_words:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - value: {رنگ: color, سیاه: black, سفید: white, سرخ: red, پیراهن: shirt, پطلون: trousers, کفش: shoes}
        status: correct
    feedback: "These combine lesson02's new color words with lesson01's clothing words."
  prs.a1.unit21.lesson02.exercise05.order_perahan_sorkh:
    instruction: "Put the words in order: The shirt is red."
    accepted_answers:
      - {value: "پیراهن سرخ است", status: correct}
    feedback: "پیراهن سرخ است means the shirt is red."
  prs.a1.unit21.lesson02.exercise06.translate_safid:
    instruction: "Translate into Dari: white"
    accepted_answers:
      - {value: سفید, status: correct}
    feedback: "سفید means white."
  prs.a1.unit21.lesson02.exercise07.speak_color_sentence:
    instruction: "Say aloud in Dari: The shirt is black."
    accepted_answers:
      - {value: "پیراهن سیاه است", status: correct}
    feedback: "پیراهن سیاه است means the shirt is black."
  prs.a1.unit21.lesson03.exercise01.recognize_andaza:
    instruction: "What does this word mean?"
    correct_option: size
    distractors: [color, price, shop]
    accepted_answers: [{value: size, status: correct}]
    feedback: "اندازه means size."
  prs.a1.unit21.lesson03.exercise02.recognize_size_question:
    instruction: "What does this sentence mean?"
    correct_option: "What is your size?"
    distractors: ["What color is this?", "How much is this?", "Is this yours?"]
    accepted_answers: [{value: "What is your size?", status: correct}]
    feedback: "اندازه شما چند است؟ means what is your size?"
  prs.a1.unit21.lesson03.exercise03.recognize_this_your_size_reading:
    instruction: "What does this sentence mean?"
    correct_option: "Is this your size?"
    distractors: ["What is your size?", "Is this expensive?", "Is this black?"]
    accepted_answers: [{value: "Is this your size?", status: correct}]
    feedback: "این اندازه شما است؟ means is this your size?"
  prs.a1.unit21.lesson03.exercise04.match_size_phrases:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {اندازه: size, "اندازه شما چند است؟": "What is your size?", "این اندازه شما است؟": "Is this your size?", بزرگ: big, کوچک: small, رنگ: color, سیاه: black}
        status: correct
    feedback: "These combine lesson03's new phrases with earlier review vocabulary (بزرگ/کوچک from the comparisons unit)."
  prs.a1.unit21.lesson03.exercise05.order_andaza_question:
    instruction: "Put the words in order: What is your size?"
    accepted_answers:
      - {value: "اندازه شما چند است", status: correct}
    feedback: "اندازه شما چند است means what is your size."
  prs.a1.unit21.lesson03.exercise06.translate_size_question:
    instruction: "Translate into Dari: What is your size?"
    accepted_answers:
      - {value: "اندازه شما چند است", status: correct}
    feedback: "اندازه شما چند است means what is your size."
  prs.a1.unit21.lesson03.exercise07.speak_ask_size:
    instruction: "Say aloud in Dari: What is your size?"
    accepted_answers:
      - {value: "اندازه شما چند است", status: correct}
    feedback: "اندازه شما چند است means what is your size."
  prs.a1.unit21.lesson04.exercise01.recognize_try_on_request:
    instruction: "What does this sentence mean?"
    correct_option: "May I try this on?"
    distractors: ["What is your size?", "How much is this?", "Is this white?"]
    accepted_answers: [{value: "May I try this on?", status: correct}]
    feedback: "می‌توانم این را پرو کنم؟ means may I try this on?"
  prs.a1.unit21.lesson04.exercise02.recognize_price_on_label:
    instruction: "What does this mean?"
    correct_option: "500 afghanis"
    distractors: ["50 afghanis", "5,000 afghanis", "150 afghanis"]
    accepted_answers: [{value: "500 afghanis", status: correct}]
    feedback: "پنجصد افغانی means 500 afghanis."
  prs.a1.unit21.lesson04.exercise03.recognize_label_reading:
    instruction: "Read the label. What size, color, and price does it show?"
    correct_option: "Big, white, 500 afghanis"
    distractors: ["Small, black, 500 afghanis", "Big, red, 50 afghanis", "It isn't stated"]
    accepted_answers: [{value: "Big, white, 500 afghanis", status: correct}]
    feedback: "اندازه بزرگ، رنگ سفید، پنجصد افغانی means size big, color white, 500 afghanis."
  prs.a1.unit21.lesson04.exercise04.match_label_parts:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {"می‌توانم این را پرو کنم؟": "May I try this on?", اندازه: size, بزرگ: big, رنگ: color, سفید: white, "پنجصد افغانی": "500 afghanis", پیراهن: shirt}
        status: correct
    feedback: "These are the label's key words plus the try-on request."
  prs.a1.unit21.lesson04.exercise05.order_label:
    instruction: "Put the words in order: Shirt, size big, color white."
    accepted_answers:
      - {value: "پیراهن اندازه بزرگ رنگ سفید", status: correct}
    feedback: "پیراهن اندازه بزرگ رنگ سفید means shirt, size big, color white."
  prs.a1.unit21.lesson04.exercise06.translate_try_on_request:
    instruction: "Translate into Dari: May I try this on?"
    accepted_answers:
      - {value: "می‌توانم این را پرو کنم", status: correct}
      - {value: "می‌تانم این را پرو کنم", status: correct}
    feedback: "می‌توانم این را پرو کنم means may I try this on?"
  prs.a1.unit21.lesson04.exercise07.write_own_label:
    instruction: "Write a short clothing label in Dari: an item, a size, a color, and a price."
    accepted_answers:
      - {value: "پیراهن. اندازه بزرگ. رنگ سفید. پنجصد افغانی", status: correct}
      - {value: "پیراهن، اندازه بزرگ، رنگ سفید، پنجصد افغانی", status: correct}
      - {value: "پیراهن و اندازه بزرگ و رنگ سفید و پنجصد افغانی", status: correct}
      - {value: "پطلون سیاه. اندازه کوچک. صد افغانی", status: correct}
    feedback: "پیراهن، اندازه بزرگ، رنگ سفید، پنجصد افغانی is a good model answer -- shirt, size big, color white, 500 afghanis. Any true item/size/color/price combination from this unit's vocabulary, joined by a period, comma, or و, is equally accepted."
  prs.a1.unit21.lesson05.exercise01.listen_context:
    instruction: "Read the conversation. What is happening?"
    correct_option: "Zarmina is buying a shirt at a shop"
    distractors: ["Zarmina is selling a shirt", "Zarmina is asking for directions", "Zarmina is returning a shirt"]
    accepted_answers: [{value: "Zarmina is buying a shirt at a shop", status: correct}]
    feedback: "زرمینه (Zarmina) is buying a white shirt from the دوکاندار (shopkeeper)."
  prs.a1.unit21.lesson05.exercise02.recognize_color_chosen:
    instruction: "What color shirt did Zarmina choose?"
    correct_option: White
    distractors: [Black, Red, "It isn't stated"]
    accepted_answers: [{value: White, status: correct}]
    feedback: "زرمینه says پیراهن سفید را می‌خواهم -- I want the white shirt."
  prs.a1.unit21.lesson05.exercise03.match_dialogue_facts:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {"چه رنگ": "what color", سفید: white, بزرگ: big, "پنجصد افغانی": "500 afghanis", زرمینه: Zarmina, دوکاندار: shopkeeper, می‌خرم: "I'm buying"}
        status: correct
    feedback: "These are the dialogue's key words, names, and the final decision to buy."
  prs.a1.unit21.lesson05.exercise04.order_final_agreement:
    instruction: "Put the words in order: Very good, I'll buy it."
    accepted_answers:
      - {value: "بسیار خوب می‌خرم", status: correct}
    feedback: "بسیار خوب، می‌خرم means very good, I'll buy it."
  prs.a1.unit21.lesson05.exercise05.translate_asking_color:
    instruction: "Translate into Dari: What color is this shirt?"
    accepted_answers:
      - {value: "این پیراهن چه رنگ دارد", status: correct}
      - {value: "این پیراهن چه رنگ است؟", status: correct}
      - {value: "این پیراهن چه رنگ است", status: correct}
