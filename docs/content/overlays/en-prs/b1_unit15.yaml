course:
  title: Dari B1
  description: 'Intermediate Kabul Dari: giving advice with بهتر است که and اگر من جای شما بودم, making suggestions with چرا ... نمی‌کنین؟, and responding to advice.'
units:
  prs.b1.unit15.advice:
    title: Giving advice and suggestions
    description: Give advice and make suggestions in response to a problem, and answer advice politely.
lessons:
  prs.b1.unit15.lesson01.better_to:
    title: It is better that...
  prs.b1.unit15.lesson02.if_i_were_you:
    title: If I were you...
  prs.b1.unit15.lesson03.suggestion:
    title: Why don't you...?
  prs.b1.unit15.lesson04.dialogue_advice:
    title: Advice for Zarmina
  prs.b1.unit15.lesson05.reading_advice:
    title: Homayoun's advice
  prs.b1.unit15.lesson06.wrapup:
    title: Wrap-up
teaching:
  prs.b1.unit15.lesson01.teach.mashwara:
    title: Advice
    gloss: advice
    note: مشوره means advice.
    example_gloss: This advice is good.
  prs.b1.unit15.lesson01.teach.grammar:
    title: Giving advice
    gloss: بهتر است که + subjunctive
    note: 'To give advice, use بهتر است که + the polite subjunctive (-ین): بهتر است که زودتر بخوابین (it is better that you sleep earlier). A shorter way is باید + the subjunctive: باید بیشتر استراحت کنین (you should rest more).'
  prs.b1.unit15.lesson01.teach.behtar:
    title: It is better that
    gloss: it is better that
    note: بهتر است که introduces advice; the verb after که is subjunctive.
    example_gloss: It is better that you sleep earlier.
  prs.b1.unit15.lesson01.teach.khab:
    title: (that) you sleep
    gloss: (that) you sleep
    note: بخوابین is the polite 2nd person plural subjunctive of خوابیدن (to sleep).
    example_gloss: It is better that you sleep earlier.
  prs.b1.unit15.lesson01.teach.khasta:
    title: Tired
    gloss: tired
    note: خسته means tired.
    example_gloss: I am very tired today.
  prs.b1.unit15.lesson01.teach.esterahat_konin:
    title: (that) you rest
    gloss: (that) you rest
    note: استراحت کنین is the polite subjunctive of استراحت کردن (to rest).
    example_gloss: It is better that you rest more.
  prs.b1.unit15.lesson02.teach.jay:
    title: In your place
    gloss: in your place
    note: 'جای شما means "in your place"; the person can change: جای او (in his or her place).'
    example_gloss: If I were you, I would go.
  prs.b1.unit15.lesson02.teach.grammar:
    title: If I were you
    gloss: اگر من جای شما بودم، ...
    note: 'To advise from your own point of view, use اگر من جای شما بودم + می‌رفتم-type verb (the unreal conditional you already know): اگر من جای شما بودم، به داکتر می‌رفتم (if I were you, I would go to the doctor).'
  prs.b1.unit15.lesson02.teach.budam:
    title: I was / I were
    gloss: I was / I were
    note: بودم is the simple past of بودن; after اگر it gives an unreal condition.
    example_gloss: If I were you, I would go.
  prs.b1.unit15.lesson02.teach.daktar_miraftam:
    title: I would go to the doctor
    gloss: I would go to the doctor
    note: می‌رفتم after اگر ... بودم means "I would go".
    example_gloss: If I were you, I would go to the doctor.
  prs.b1.unit15.lesson02.teach.rooz:
    title: Day
    gloss: day
    note: روز means day.
    example_gloss: Today is a good day.
  prs.b1.unit15.lesson03.teach.chera_nemikonin:
    title: Why don't you go
    gloss: why don't you go
    note: 'چرا ... نمی‌روین؟ is a friendly suggestion: "why don''t you go...?"'
    example_gloss: Why do you not go to the doctor?
  prs.b1.unit15.lesson03.teach.grammar:
    title: Making suggestions
    gloss: چرا ... نمی‌روین؟
    note: 'Make a friendly suggestion with چرا + a negative present verb: چرا به داکتر نمی‌روین؟ (why don''t you go to the doctor?). Make a more formal one with پیشنهاد می‌کنم که + the subjunctive: پیشنهاد می‌کنم که فردا بروین (I suggest that you go tomorrow). Accept with فکر خوبی است.'
  prs.b1.unit15.lesson03.teach.pishnehad:
    title: I suggest that
    gloss: I suggest that
    note: پیشنهاد می‌کنم که is a more formal suggestion; the verb after که is subjunctive.
    example_gloss: I suggest that you go to the doctor tomorrow.
  prs.b1.unit15.lesson03.teach.birawin:
    title: (that) you go
    gloss: (that) you go
    note: بروین is the polite 2nd person plural subjunctive of رفتن (to go).
    example_gloss: I suggest that you go to the doctor tomorrow.
  prs.b1.unit15.lesson03.teach.fikr_khub:
    title: That is a good idea
    gloss: that is a good idea
    note: فکر خوبی است is a way to accept a suggestion.
    example_gloss: I will go tomorrow, that is a good idea.
  prs.b1.unit15.lesson04.teach.ziyad:
    title: A lot
    gloss: a lot
    note: زیاد means a lot or much.
    example_gloss: I have a lot of work.
  prs.b1.unit15.lesson04.teach.telefon:
    title: I phone
    gloss: I phone
    note: تیلفون کردن means to telephone or call.
    example_gloss: Tomorrow I will phone.
  prs.b1.unit15.lesson04.teach.nemigirin:
    title: You do not make an appointment
    gloss: you do not make an appointment
    note: ملاقات نمی‌گیرین is the polite negative present, used for a friendly suggestion.
    example_gloss: Why do you not make an appointment today?
  prs.b1.unit15.lesson04.teach.milaqat:
    title: I make an appointment
    gloss: I make an appointment
    note: ملاقات گرفتن means to make an appointment.
    example_gloss: Tomorrow I will make an appointment.
  prs.b1.unit15.lesson04.teach.dialogue01:
    title: Homayoun, I am not sleeping well these days and I am very tired.
    gloss: Homayoun, I am not sleeping well these days and I am very tired.
    note: Zarmina describes her problem.
  prs.b1.unit15.lesson04.teach.dialogue02:
    title: It is better that you sleep earlier.
    gloss: It is better that you sleep earlier.
    note: Homayoun gives advice with بهتر است که.
  prs.b1.unit15.lesson04.teach.dialogue03:
    title: But I have a lot of work.
    gloss: But I have a lot of work.
    note: Zarmina gives a reason why that is hard.
  prs.b1.unit15.lesson04.teach.dialogue04:
    title: If I were you, I would go to the doctor. Why don't you make an appointment?
    gloss: If I were you, I would go to the doctor. Why don't you make an appointment?
    note: Homayoun advises with اگر من جای شما بودم and suggests an appointment.
  prs.b1.unit15.lesson04.teach.dialogue05:
    title: That is a good idea. I will phone tomorrow.
    gloss: That is a good idea. I will phone tomorrow.
    note: Zarmina accepts the suggestion.
  prs.b1.unit15.lesson04.teach.dialogue06:
    title: Good. Rest too.
    gloss: Good. Rest too.
    note: Homayoun adds a last piece of advice.
  prs.b1.unit15.lesson05.teach.bikhabad:
    title: (that) he/she sleep
    gloss: (that) he/she sleep
    note: بخوابد is the 3rd person subjunctive of خوابیدن.
    example_gloss: Homayoun said that it is better for her to sleep earlier.
  prs.b1.unit15.lesson05.teach.berawad:
    title: (that) he/she go
    gloss: (that) he/she go
    note: برود is the 3rd person subjunctive of رفتن.
    example_gloss: He suggested that Zarmina go to the doctor.
  prs.b1.unit15.lesson05.teach.pishnehad_kard:
    title: Suggested
    gloss: suggested
    note: 'پیشنهاد کرد is the 3rd person simple past: he or she suggested.'
    example_gloss: He suggested that Zarmina go to the doctor.
  prs.b1.unit15.lesson05.teach.reading:
    title: Homayoun's advice
    gloss: Zarmina is tired and is not sleeping well. Homayoun said that it is better for her to sleep earlier. He suggested that Zarmina go to the doctor. Zarmina thinks that this is good advice.
    note: 'Advice told in the third person: the subjunctive after بهتر است که and after پیشنهاد کرد که shifts to the 3rd person (بخوابد، برود).'
  prs.b1.unit15.lesson06.teach.grammar:
    title: 'Review: advice and suggestions'
    gloss: بهتر است که؛ اگر من جای شما بودم؛ چرا نمی‌روین؟
    note: 'Review: advise with بهتر است که + subjunctive or باید; advise from your view with اگر من جای شما بودم + می‌رفتم-type verb; suggest with چرا ... نمی‌روین؟ or پیشنهاد می‌کنم که ...; accept with فکر خوبی است.'
  prs.b1.unit15.lesson06.teach.r_kar:
    title: Work
    gloss: work
    note: کار means work.
    example_gloss: I have a lot of work today.
  prs.b1.unit15.lesson06.teach.r_waqt:
    title: Time
    gloss: time
    note: وقت means time.
    example_gloss: I have no time today.
