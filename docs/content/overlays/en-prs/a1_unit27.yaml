course:
  title: Dari A1
  description: 'Beginner Kabul Dari: physical-appearance vocabulary (tall, short, hair, eyes, beard, glasses), asking what someone looks like with قیافه‌اش چطور است؟, hair and eye color (رنگ مو/رنگ چشم), and a Zarmina/Homayoun dialogue about recognizing someone by their appearance.'
units:
  prs.a1.unit27.appearance:
    title: Appearance
    description: Describe a person's basic physical appearance and ask what someone looks like.
lessons:
  prs.a1.unit27.lesson01.appearance_vocabulary:
    title: Appearance words
  prs.a1.unit27.lesson02.appearance_question:
    title: Asking about appearance
  prs.a1.unit27.lesson03.hair_eye_color:
    title: Hair and eye color
  prs.a1.unit27.lesson04.appearance_dialogue:
    title: Appearance dialogue
  prs.a1.unit27.lesson05.reading_appearance:
    title: Reading about appearance
  prs.a1.unit27.lesson06.wrap_up:
    title: Wrap-up
teaching:
  prs.a1.unit27.lesson01.teach.tall_phrase:
    title: Tall
    gloss: tall
    note: قد بلند literally means "long height" -- قد (height) + بلند (long/tall).
    example_gloss: He/she is tall.
  prs.a1.unit27.lesson01.teach.short_phrase:
    title: Short
    gloss: short
    note: قد کوتاه literally means "short height" -- قد (height, review) + کوتاه (short).
    example_gloss: He/she is short.
  prs.a1.unit27.lesson01.teach.hair_word:
    title: Hair
    gloss: hair
    note: مو means hair; موی is the same word in its construct form, used before another word (e.g. موی سیاه, "black hair").
    example_gloss: His/her hair is black.
  prs.a1.unit27.lesson01.teach.eye_word:
    title: Eye
    gloss: eye
    note: چشم means eye (used in the singular for describing eye color, the natural everyday pattern).
    example_gloss: His/her eyes are black.
  prs.a1.unit27.lesson01.teach.beard_word:
    title: Beard
    gloss: beard
    note: ریش means beard.
    example_gloss: He/she has a beard.
  prs.a1.unit27.lesson01.teach.glasses_word:
    title: Glasses
    gloss: glasses
    note: عینک means glasses/eyeglasses.
    example_gloss: He/she has glasses.
  prs.a1.unit27.lesson01.teach.review_ast_dast:
    title: Is / has (3rd person)
    gloss: is / has (3rd person)
    note: است (is) and دارد (has, 3rd person) are both review from earlier in the course, used throughout this unit to describe someone's appearance.
  prs.a1.unit27.lesson02.teach.qiyafa_word:
    title: Appearance / looks
    gloss: appearance / looks
    note: قیافه means a person's looks or appearance (e.g. خوش قیافه, "good-looking").
    example_gloss: His/her appearance is good.
  prs.a1.unit27.lesson02.teach.review_chetor:
    title: How
    gloss: how
    note: چطور means "how" (already introduced earlier in the course, in greetings like چطور استین؟).
  prs.a1.unit27.lesson02.teach.qiyafash_word:
    title: His/her appearance
    gloss: his/her appearance
    note: قیافه‌اش combines قیافه (appearance) with the possessive suffix ‌اش ("his/her").
  prs.a1.unit27.lesson02.teach.question_appearance:
    title: What does he/she look like?
    gloss: What does he/she look like?
    note: 'قیافه‌اش چطور است؟ is the natural way to ask what someone looks like -- deliberately not the bare چطور است؟ alone, which by itself reads as "How is he/she?" (the health/wellbeing greeting).'
  prs.a1.unit27.lesson02.teach.answer_tall:
    title: He/she is tall
    gloss: He/she is tall.
    note: Combines او (he/she, review) with this unit's قد بلند است.
  prs.a1.unit27.lesson02.teach.answer_black_hair:
    title: He/she has black hair
    gloss: He/she has black hair.
    note: Combines موی (hair) with سیاه (black) and دارد (has).
  prs.a1.unit27.lesson02.teach.answer_beard:
    title: He/she has a beard
    gloss: He/she has a beard.
    note: Uses ریش دارد, the same has-pattern as black hair above.
  prs.a1.unit27.lesson03.teach.review_rang:
    title: Color
    gloss: color
    note: رنگ means color (already introduced earlier in the course, unit21 clothing).
  prs.a1.unit27.lesson03.teach.blue_word:
    title: Blue
    gloss: blue
    note: آبی means blue.
    example_gloss: His/her eyes are blue.
  prs.a1.unit27.lesson03.teach.brown_word:
    title: Brown
    gloss: brown
    note: قهوه‌ای means brown (used for hair or eye color).
    example_gloss: His/her hair is brown.
  prs.a1.unit27.lesson03.teach.eye_color_phrase:
    title: Eye color
    gloss: eye color
    note: رنگ چشم literally means "color of eye" -- رنگ (color) + چشم (eye).
  prs.a1.unit27.lesson03.teach.hair_color_phrase:
    title: Hair color
    gloss: hair color
    note: رنگ مو literally means "color of hair" -- رنگ (color) + مو (hair).
  prs.a1.unit27.lesson03.teach.eye_blue_sentence:
    title: His/her eyes are blue
    gloss: His/her eyes are blue.
    note: Applies this lesson's آبی to چشم.
  prs.a1.unit27.lesson03.teach.hair_brown_sentence:
    title: His/her hair is brown
    gloss: His/her hair is brown.
    note: Applies this lesson's قهوه‌ای to موی.
  prs.a1.unit27.lesson04.teach.review_baradar:
    title: Brother / your brother
    gloss: brother / your brother (informal)
    note: برادر (brother) is review from unit03; برادرت adds the informal possessive suffix ‌ت ("your"), matching the established تو/-informal register.
  prs.a1.unit27.lesson04.teach.review_bali_tashakor:
    title: Yes / thanks / also
    gloss: yes / thanks / also / too
    note: بلی (yes), تشکر (thanks), and هم (also/too) are all review from earlier in the course.
  prs.a1.unit27.lesson04.teach.dialogue_line1:
    title: 'Homayoun: Zarmina, what does your brother look like?'
    gloss: 'Homayoun: Zarmina, what does your brother look like?'
    note: An informal question between friends, using the -ت possessive on برادر.
  prs.a1.unit27.lesson04.teach.dialogue_line2:
    title: 'Zarmina: He''s tall, and he has black hair'
    gloss: 'Zarmina: He''s tall, and he has black hair.'
    note: Combines two traits with و (and).
  prs.a1.unit27.lesson04.teach.dialogue_line3:
    title: 'Homayoun: Does he have a beard?'
    gloss: 'Homayoun: Does he have a beard?'
    note: A yes/no question formed simply by rising intonation on ریش دارد.
  prs.a1.unit27.lesson04.teach.dialogue_line4:
    title: 'Zarmina: Yes, he has a beard, and he also has glasses'
    gloss: 'Zarmina: Yes, he has a beard, and he also has glasses.'
    note: Applies هم (also) to a second trait.
  prs.a1.unit27.lesson04.teach.dialogue_line5:
    title: 'Homayoun: Good, thanks'
    gloss: 'Homayoun: Good, thanks.'
    note: خوب (good) is a new, simple closing word; تشکر (thanks) is review.
  prs.a1.unit27.lesson05.teach.reading_passage:
    title: Reading about appearance
    gloss: Karim is tall. He has black hair and brown eyes. He doesn't have a beard, but he has glasses.
    note: A short reading passage recapping the unit's appearance words, introducing the character's name کریم (Karim, reusing the established character from the comparisons unit) and ندارد (doesn't have, the 3rd-person negative of دارد).
  prs.a1.unit27.lesson06.teach.review_ama:
    title: But
    gloss: but
    note: اما means but (introduced earlier this unit, in lesson05's reading passage; also review from earlier units).
  prs.a1.unit27.lesson06.teach.review_astam:
    title: I am / I have
    gloss: I am / I have
    note: استم (I am) and دارم (I have) are both review from earlier in the course, used here for a first-person appearance description.
  prs.a1.unit27.lesson06.teach.wrap_summary:
    title: I am short, but I have black hair
    gloss: I am short, but I have black hair.
    note: Combines two appearance facts using اما.
