course:
  title: Dari A2
  description: 'Lower-intermediate Afghan Dari: telling what you did last weekend, in order, including what you did not do. The simple past as a system (past stem plus endings), the negative past, and the contrast with the present.'
units:
  prs.a2.unit19.last_weekend:
    title: Last weekend
lessons:
  prs.a2.unit19.lesson01.weekend_words_and_past_form:
    title: Weekend words and the past form
  prs.a2.unit19.lesson02.building_the_past:
    title: Building the past with more verbs
  prs.a2.unit19.lesson03.negative_past:
    title: The negative past, and past versus present
  prs.a2.unit19.lesson04.telling_in_order:
    title: Telling it in order
  prs.a2.unit19.lesson05.reading_and_listening:
    title: Reading and listening about a weekend
  prs.a2.unit19.lesson06.weekend_conversation:
    title: A conversation about the weekend
teaching:
  prs.a2.unit19.lesson01.teach.last_weekend:
    title: Last weekend
    gloss: last weekend
    note: '*آخر هفته* is the weekend and *گذشته* means past or last. Together *آخر هفتهٔ گذشته* is last weekend, the time frame for this whole unit.'
    example_gloss: Last weekend I went to the bazaar.
  prs.a2.unit19.lesson01.teach.thursday_friday:
    title: Thursday, Friday
    gloss: Thursday, Friday
    note: In Afghanistan Friday is the weekly holiday, and Thursday afternoon is when many people start their weekend, so *پنجشنبه* and *جمعه* are the two days you will use most for weekend stories.
    example_gloss:
    - On Thursday afternoon I went to the bank.
    - On Friday I went to the park.
  prs.a2.unit19.lesson01.teach.afternoon:
    title: Afternoon
    gloss: afternoon, late afternoon
    note: '*عصر* is the late afternoon. It follows the day: *پنجشنبه عصر* is Thursday afternoon.'
    example_gloss: On Thursday afternoon I went to the bank.
  prs.a2.unit19.lesson01.teach.yesterday:
    title: Yesterday
    gloss: yesterday
    note: '*دیروز* is a review word from the past-events unit. It takes the same past verb you will build in this unit.'
    example_gloss: Yesterday I ate breakfast.
  prs.a2.unit19.lesson01.teach.in_bazaar:
    title: In the bazaar
    gloss: in the bazaar
    note: '*در* means in or at, and *بازار* is the bazaar or market, the place of many weekend errands.'
    example_gloss: In the bazaar I bought bread and fruit.
  prs.a2.unit19.lesson01.teach.bank:
    title: Bank
    gloss: bank
    note: '*بانک* is the bank. It is one more place people go for errands.'
    example_gloss: In the afternoon I went to the bank.
  prs.a2.unit19.lesson01.teach.park:
    title: Park
    gloss: park
    note: '*پارک* is the park, a review word from the outings units.'
    example_gloss: On Friday I went to the park with my friends.
  prs.a2.unit19.lesson01.teach.shopping:
    title: To shop
    gloss: to shop, to do shopping
    note: '*خرید کردن* is the everyday way to say you did some shopping. *خرید* is the shopping and *کردن* is the verb to do.'
    example_gloss: I did some shopping in the bazaar.
  prs.a2.unit19.lesson01.teach.visiting:
    title: To go and visit
    gloss: to go and visit someone
    note: '*به دیدن* plus a person plus *رفتن* means to go and visit that person: *به دیدن فامیلم رفتم* is I went to visit my family. Visits are the second big topic of this unit.'
    example_gloss: On Friday I went to visit my family.
  prs.a2.unit19.lesson01.teach.family:
    title: Family, relatives
    gloss: family, relatives
    note: '*فامیل* is your family and relatives. Add *-م* to say my: *فامیلم* is my family.'
    example_gloss: My family is in Kabul.
  prs.a2.unit19.lesson01.teach.errands:
    title: To have errands
    gloss: to have things to do, to have errands
    note: '*کار* is work, but it also means a task or an errand. *کار داشتن* is to have things to do. *چند* means a few, some, or how many.'
    example_gloss: On Thursday afternoon I had a few errands.
  prs.a2.unit19.lesson01.teach.go_paradigm:
    title: 'The simple past: past stem plus endings'
    gloss: I went, you went, he/she went, we went, you (formal or plural) went, they went
    note: 'The simple past is a system, not a list of words to memorise. Take the infinitive *رفتن* (to go) and drop the final *ن*: the past stem is *رفت*. Then add an ending: *-م* for I (*رفتم*), *-ی* for you to a friend (*رفتی*), nothing for he or she (*رفت*), *-یم* for we (*رفتیم*), *-ین* for you formal or plural (*رفتین*), *-ند* for they (*رفتند*). The pronoun (*من، تو، او*) is optional, because the ending already shows who did it. Note that the past has no *می* in front, which the present has.'
  prs.a2.unit19.lesson02.teach.eat_paradigm:
    title: 'Same rule, new verb: to eat'
    gloss: I ate, you ate, he/she ate, we ate, you (formal or plural) ate, they ate
    note: 'The rule from *رفتن* works for almost every verb. *خوردن* (to eat) loses its *ن* to give the past stem *خورد*, and the same six endings follow: *خوردم، خوردی، خورد، خوردیم، خوردین، خوردند*. The he or she form is just the bare stem, so *خورد* means he or she ate.'
  prs.a2.unit19.lesson02.teach.breakfast:
    title: I ate breakfast yesterday
    gloss: Yesterday I ate breakfast.
    note: '*صبحانه* is breakfast, a review word from the daily-routine units. *خوردم* is the past of *خوردن* with the ending *-م*.'
  prs.a2.unit19.lesson02.teach.bread_fruit:
    title: Bread and fruit
    gloss: bread and fruit
    note: '*نان* is bread and *میوه* is fruit. *و* means and.'
    example_gloss: In the bazaar I bought bread and fruit.
  prs.a2.unit19.lesson02.teach.more_verbs:
    title: Five more verbs, one rule
    gloss: to see, to buy, to do, to become, to have in the past
    note: 'Every verb here follows the same rule: drop *ن*, then add the ending. *دیدن* (to see) gives *دیدم* (I saw) and *دیدی* (you saw). *خریدن* (to buy) gives *خریدم* (I bought). *کردن* (to do or make) gives *کردم* (I did) and *کردی* (you did). *شدن* (to become or get) gives *شدم* (I became). *داشتن* (to have) gives *داشتم* (I had). Only the last part of the verb changes, never the stem. Note that *خرید* is both the past stem of *خریدن* (bought) and the noun shopping, as in *خرید کردن*.'
  prs.a2.unit19.lesson02.teach.movie:
    title: I saw a movie
    gloss: I saw a movie.
    note: '*فلم* is a movie. In Dari you *فلم دیدن*, literally see a movie, so *دیدم* is the verb.'
  prs.a2.unit19.lesson02.teach.exercise:
    title: I exercised
    gloss: I exercised.
    note: '*ورزش* is exercise. *ورزش کردن* means to exercise, and the ending goes on *کردن*: *ورزش کردم*.'
  prs.a2.unit19.lesson02.teach.woke_late:
    title: I woke up late
    gloss: I woke up late.
    note: '*دیر* means late and *بیدار شدن* means to wake up. *بیدار شدم* is I woke up, and *دیر* goes before it.'
  prs.a2.unit19.lesson03.teach.neg_paradigm:
    title: 'The negative past: ن plus the past verb'
    gloss: I did not go, you did not go, he/she did not go, we did not go, you (formal or plural) did not go, they did not go
    note: 'To say you did not do something, put *ن* at the very front of the past verb: *رفتم* (I went) becomes *نرفتم* (I did not go). Nothing else changes, so the same six endings follow: *نرفتم، نرفتی، نرفت، نرفتیم، نرفتین، نرفتند*. There is no *نمی* in the negative simple past. A finished action that did not happen is just *ن* plus the past verb.'
  prs.a2.unit19.lesson03.teach.neg_breakfast:
    title: I did not eat breakfast
    gloss: I did not eat breakfast.
    note: '*نخوردم* is *ن* plus *خوردم*: I did not eat.'
  prs.a2.unit19.lesson03.teach.neg_more:
    title: The same ن with other verbs
    gloss: I did not see, I did not buy, I did not have, I did not do
    note: 'The rule works for every verb you have met: *ندیدم* (I did not see), *نخریدم* (I did not buy), *نداشتم* (I did not have), *نکردم* (I did not do). Always *ن* first, then the past verb. A few verbs that begin with آ change their spelling: *آمدم* (I came) becomes *نیامدم* (I did not come).'
  prs.a2.unit19.lesson03.teach.neg_compound:
    title: Negating verbs that use کردن
    gloss: I did not shop in the bazaar. I did not exercise.
    note: 'Some verbs are a noun plus *کردن*, like *خرید کردن* (to shop) and *ورزش کردن* (to exercise). Put the *ن* on *کردن*, not on the noun: *خرید نکردم*, *ورزش نکردم*. Writing *نخرید کردم* is wrong.'
  prs.a2.unit19.lesson03.teach.past_vs_present:
    title: Past versus present
    gloss: I go to the bazaar. / I went to the bazaar. / I did not go to the bazaar.
    note: 'The present of this verb is *می‌روم* (I go, I am going): *می* plus the present stem *رو* plus the ending. The past is *رفتم*, with no *می*. To negate the present you use *نمی‌روم*, but to negate the past you use only *ن*: *نرفتم*. Use the past for a finished action, such as last weekend, and the present for what you do regularly or are doing now.'
  prs.a2.unit19.lesson04.teach.first:
    title: First
    gloss: first
    note: '*اول* opens a sequence. It is a review word from the weekly-schedule unit.'
    example_gloss: First I ate breakfast.
  prs.a2.unit19.lesson04.teach.then:
    title: Then, after that
    gloss: then, after that
    note: '*بعد* continues the sequence after *اول*.'
    example_gloss: Then I went to the bank.
  prs.a2.unit19.lesson04.teach.but:
    title: But
    gloss: but
    note: '*ولی* joins something you did with something you did not do: it sets the two against each other.'
    example_gloss: I went to the bazaar, but I did not shop.
  prs.a2.unit19.lesson04.teach.no:
    title: 'No'
    gloss: 'no'
    note: '*نخیر* is the polite everyday no in Dari, used to answer a yes or no question.'
    example_gloss: No, I did not see a movie.
  prs.a2.unit19.lesson04.teach.finally:
    title: Finally
    gloss: finally, at the end
    note: '*در آخر* closes a sequence, after *اول* and *بعد*. You already know both words in it.'
    example_gloss: Finally I went to visit my family.
  prs.a2.unit19.lesson04.teach.home:
    title: Home, house
    gloss: home, house
    note: '*خانه* is the house or home, a review word from the housing unit.'
    example_gloss: Finally I went home.
  prs.a2.unit19.lesson04.teach.order_grammar:
    title: Telling a weekend in order
    gloss: On Thursday, first I went to the bank, then I shopped in the bazaar, and finally I went home.
    note: 'To tell what you did in order, give each finished action its own past verb and use *اول، بعد، در آخر* to show the order. The actions come in the order they happened: *اول به بانک رفتم، بعد در بازار خرید کردم و در آخر به خانه رفتم.* You can join the parts with a comma, a full stop or *و*. To add something you did not do, use *ولی* and a negative past verb: *به بازار رفتم، ولی خرید نکردم.*'
  prs.a2.unit19.lesson05.teach.also:
    title: Also, too
    gloss: also, too
    note: '*هم* means also or too and comes after the thing it adds: *فلم هم ندیدم* is I did not see a movie either.'
    example_gloss: I went to the bazaar too.
  prs.a2.unit19.lesson05.teach.my_friend:
    title: My friend
    gloss: my friend
    note: '*دوست* is a friend and *-م* adds my: *دوستم* is my friend.'
    example_gloss: On Friday I went to visit my friend.
  prs.a2.unit19.lesson05.teach.my_friends:
    title: My friends
    gloss: my friends
    note: '*دوستان* is friends (the plural of *دوست*) and *-م* adds my: *دوستانم* is my friends.'
    example_gloss: On Friday I went to the park with my friends.
  prs.a2.unit19.lesson05.teach.with:
    title: With
    gloss: with
    note: '*با* means with. It comes before the person: *با دوستانم* is with my friends.'
    example_gloss: I went to the bazaar with my friends.
  prs.a2.unit19.lesson05.teach.message:
    title: A message about last weekend
    gloss: Last weekend, on Thursday afternoon I had a few errands. First I went to the bank, then I bought bread and fruit in the bazaar. On Friday I woke up late and ate breakfast, then I went to visit my family. I did not exercise and I did not see a movie either.
    note: 'A short written account of a weekend, in the order things happened. Two things did not happen, and each is a negative past verb: *ورزش نکردم* and *فلم ندیدم*.'
  prs.a2.unit19.lesson05.teach.exchange_q:
    title: Homayoun asks Zarmina about Thursday
    gloss: Zarmina, did you go to the bank on Thursday?
    note: Homayoun asks with the past verb *رفتی*, the you (friend) form. It is a yes or no question about a finished action.
  prs.a2.unit19.lesson05.teach.exchange_a:
    title: Zarmina answers
    gloss: No, I did not go to the bank. I saw a movie.
    note: Zarmina says what did not happen, *به بانک نرفتم*, and then what did happen, *فلم دیدم*.
  prs.a2.unit19.lesson06.teach.turn01:
    title: Zarmina asks about last weekend
    gloss: Homayoun, what did you do last weekend?
    note: '*چه کار کردی؟* is what did you do? It asks for a finished action, so it uses the past *کردی*.'
  prs.a2.unit19.lesson06.teach.turn02:
    title: Homayoun tells about his errands and his visit
    gloss: On Thursday afternoon I had a few errands. First I went to the bank, then I bought bread and fruit in the bazaar. On Friday I went to visit my family.
    note: Homayoun gives the errands in order with *اول* and *بعد*, then moves on to Friday.
  prs.a2.unit19.lesson06.teach.turn03:
    title: Zarmina asks about exercise
    gloss: Did you exercise?
    note: A yes or no question about a finished action, with the past *کردی*.
  prs.a2.unit19.lesson06.teach.turn04:
    title: Homayoun says no and asks back
    gloss: No, I did not exercise. And you?
    note: '*نخیر، ورزش نکردم* answers with the negative past. *تو چطور؟* is a short way to ask and you?'
  prs.a2.unit19.lesson06.teach.turn05:
    title: Zarmina tells about her weekend
    gloss: On Thursday I saw a movie. On Friday I went to the bazaar with my friends, but I did not shop.
    note: Zarmina uses *ولی* to set what she did, going to the bazaar, against what she did not do, *خرید نکردم*.
  prs.a2.unit19.lesson06.teach.turn06:
    title: Homayoun reacts
    gloss: How nice!
    note: '*چه خوب!* means how nice or how good, a friendly reaction to good news.'
exercises:
  prs.a2.unit19.lesson01.exercise01.recognize_last_weekend:
    instruction: What does this phrase mean?
    correct_option: last weekend
    distractors:
    - this weekend
    - next weekend
    - every weekend
    accepted_answers:
    - value: last weekend
      status: correct
    feedback: '*آخر هفتهٔ گذشته* is last weekend.'
  prs.a2.unit19.lesson01.exercise02.recognize_went_bazaar:
    instruction: What does this sentence mean?
    correct_option: I went to the bazaar
    distractors:
    - I will go to the bazaar
    - I went to the bank
    - I bought things at the bazaar
    accepted_answers:
    - value: I went to the bazaar
      status: correct
    feedback: '*به بازار رفتم* is I went to the bazaar: the past stem *رفت* plus the ending *-م*.'
  prs.a2.unit19.lesson01.exercise03.recognize_we_went_park:
    instruction: What does this sentence mean?
    correct_option: We went to the park
    distractors:
    - I went to the park
    - They went to the park
    - He went to the park
    accepted_answers:
    - value: We went to the park
      status: correct
    feedback: 'The ending *-یم* in *رفتیم* means we: *ما به پارک رفتیم* is we went to the park.'
  prs.a2.unit19.lesson01.exercise04.match_go_forms:
    instruction: Match each Dari word with its meaning.
    accepted_answers:
    - value:
        رفتم: I went
        رفتی: you went (to a friend)
        رفت: he or she went
        رفتیم: we went
        رفتین: you went (formal or plural)
        رفتند: they went
        بازار: bazaar
        بانک: bank
        پارک: park
      status: correct
    feedback: 'Each ending shows who went: *-م* I, *-ی* you (friend), no ending he or she, *-یم* we, *-ین* you (formal or plural), *-ند* they.'
  prs.a2.unit19.lesson01.exercise05.order_thursday_bank:
    instruction: 'Arrange the words to say: On Thursday afternoon I went to the bank.'
    accepted_answers:
    - value:
      - پنجشنبه
      - عصر
      - به
      - بانک
      - رفتم
      status: correct
    - value:
      - به
      - بانک
      - پنجشنبه
      - عصر
      - رفتم
      status: correct
    feedback: '*پنجشنبه عصر به بانک رفتم* puts the time first, the place next and the past verb last.'
  prs.a2.unit19.lesson01.exercise06.translate_went_bank:
    instruction: 'Translate into Dari, using the past of رفتن: I went to the bank.'
    accepted_answers:
    - value: به بانک رفتم
      status: correct
    - value: من به بانک رفتم
      status: correct
    feedback: '*به بانک رفتم* is I went to the bank. Adding *من* is fine, but the ending *-م* already says I.'
  prs.a2.unit19.lesson02.exercise01.recognize_bought:
    instruction: What does this sentence mean?
    correct_option: I bought bread and fruit
    distractors:
    - I ate bread and fruit
    - I saw bread and fruit
    - I went to the bazaar for bread and fruit
    accepted_answers:
    - value: I bought bread and fruit
      status: correct
    feedback: '*خریدم* is the past of *خریدن*, to buy: *نان و میوه خریدم* is I bought bread and fruit.'
  prs.a2.unit19.lesson02.exercise02.recognize_saw:
    instruction: What does this verb mean?
    correct_option: I saw
    distractors:
    - I did
    - I bought
    - I ate
    accepted_answers:
    - value: I saw
      status: correct
    feedback: '*دیدم* is I saw: the stem *دید* plus the ending *-م*.'
  prs.a2.unit19.lesson02.exercise03.match_past_verbs:
    instruction: Match each past verb with its meaning.
    accepted_answers:
    - value:
        رفتم: I went
        خوردم: I ate
        کردم: I did or made
        دیدم: I saw
        خریدم: I bought
        داشتم: I had
        شدم: I became or got
        خورد: he or she ate
        دیدی: you saw (to a friend)
      status: correct
    feedback: All of these are a past stem plus an ending. The he or she form, *خورد*, has no ending at all.
  prs.a2.unit19.lesson02.exercise04.order_bought_bazaar:
    instruction: 'Arrange the words to say: I bought bread and fruit in the bazaar.'
    accepted_answers:
    - value:
      - در
      - بازار
      - نان
      - و
      - میوه
      - خریدم
      status: correct
    - value:
      - نان
      - و
      - میوه
      - در
      - بازار
      - خریدم
      status: correct
    feedback: '*در بازار نان و میوه خریدم* keeps the past verb *خریدم* at the end.'
  prs.a2.unit19.lesson02.exercise05.complete_ate:
    instruction: 'Complete the sentence: Yesterday I ate breakfast.'
    accepted_answers:
    - value: خوردم
      status: correct
    feedback: '*خوردم* is the past of *خوردن* with the ending *-م*.'
  prs.a2.unit19.lesson02.exercise06.translate_saw_movie:
    instruction: 'Translate into Dari, using the past of دیدن: I saw a movie.'
    accepted_answers:
    - value: فلم دیدم
      status: correct
    - value: من فلم دیدم
      status: correct
    - value: یک فلم دیدم
      status: correct
    - value: من یک فلم دیدم
      status: correct
    feedback: '*فلم دیدم* is I saw a movie. *یک* (a) and *من* (I) are both optional here.'
  prs.a2.unit19.lesson03.exercise01.recognize_negative:
    instruction: What does this sentence mean?
    correct_option: I did not go to the bazaar
    distractors:
    - I went to the bazaar
    - I do not go to the bazaar
    - I will not go to the bazaar
    accepted_answers:
    - value: I did not go to the bazaar
      status: correct
    feedback: '*نرفتم* is *ن* plus *رفتم*: I did not go.'
  prs.a2.unit19.lesson03.exercise02.recognize_present:
    instruction: What does this sentence mean?
    correct_option: I go to the bazaar
    distractors:
    - I went to the bazaar
    - I did not go to the bazaar
    - I bought things at the bazaar
    accepted_answers:
    - value: I go to the bazaar
      status: correct
    feedback: '*می‌روم* is the present, I go or I am going. The past is *رفتم* and the negative past is *نرفتم*.'
  prs.a2.unit19.lesson03.exercise03.match_positive_negative:
    instruction: Match each Dari verb with its meaning.
    accepted_answers:
    - value:
        رفتم: I went
        نرفتم: I did not go
        خوردم: I ate
        نخوردم: I did not eat
        دیدم: I saw
        ندیدم: I did not see
        خریدم: I bought
        نخریدم: I did not buy
        داشتم: I had
        نداشتم: I did not have
        می‌روم: I go (present)
      status: correct
    feedback: A leading *ن* turns a past verb into its negative. The present *می‌روم* has *می*, which the past never has.
  prs.a2.unit19.lesson03.exercise04.order_friday_no_exercise:
    instruction: 'Arrange the words to say: On Friday I did not exercise.'
