  notes: "Fresh-context review completed 2026-07-05 (paired with the prs.a1.unit06 realization; see that file's review notes for the full account, including the گرد کنید -> بپیچید dialect-authenticity fix mirrored into this overlay's notes/instructions/distractors/accepted_answers/feedback). Fixed two factually-wrong teaching notes here specifically: lesson05.teach.opposite_review falsely claimed روبه‌رو was introduced in the places unit (unit05) -- grepped unit05 and confirmed it was never taught there, only مقابل was; reworded to correctly frame روبه‌رو as a new synonym. lesson04.teach.daftar_review claimed دفتر was introduced in 'the introductions unit' -- it was actually introduced in unit01 (greetings), a specific-unit misattribution matching the exact bug class unit05's own review already caught and fixed once; generalized the wording the same way unit05 now reads ('an earlier unit') rather than re-guessing a specific wrong unit. Reworded the lesson06.exercise03 matching_pairs instruction ('Match each step...') which didn't match one of its own pairs (a landmark location fact, not a step). Added missing period-joined accepted_answers per §12 to the 4 free-text exercises combining two direction clauses (previously comma- and و-joined only). Compiler validation clean (0 errors/0 warnings) after fixes."

course:
  title: Dari A1
  description: >-
    Beginner Afghan Dari: basic direction words, giving turn instructions,
    sequencing multi-step directions, politely asking for directions, and
    landmark-based directions.

units:
  prs.a1.unit06.directions:
    title: Giving directions and finding your way

lessons:
  prs.a1.unit06.lesson01.direction_words: {title: "Basic direction words"}
  prs.a1.unit06.lesson02.giving_turn_instructions: {title: "Give turn instructions"}
  prs.a1.unit06.lesson03.sequencing_directions: {title: "Sequence multi-step directions"}
  prs.a1.unit06.lesson04.politely_asking_directions: {title: "Politely ask for directions"}
  prs.a1.unit06.lesson05.landmark_directions: {title: "Give directions using landmarks"}
  prs.a1.unit06.lesson06.giving_directions_dialogue: {title: "Find the way to the pharmacy"}

teaching:
  prs.a1.unit06.lesson01.teach.straight:
    title: "Straight"
    gloss: "straight"
    note: "مستقیم describes moving straight ahead."
  prs.a1.unit06.lesson01.teach.left:
    title: "Left"
    gloss: "left"
    note: "چپ is the direction left."
  prs.a1.unit06.lesson01.teach.right:
    title: "Right"
    gloss: "right"
    note: "راست is the direction right."
  prs.a1.unit06.lesson01.teach.turn_verb:
    title: "Turn (polite imperative)"
    gloss: "turn"
    note: "بپیچید is the polite imperative form of the verb to turn, used when giving directions to someone."
  prs.a1.unit06.lesson01.teach.to_word:
    title: "To / toward"
    gloss: "to / toward"
    note: "به combines with a direction word, as in به چپ (to the left)."

  prs.a1.unit06.lesson02.teach.go_straight:
    title: "Tell someone to go straight"
    gloss: "Go straight."
    note: "مستقیم بروید is the basic direction instruction, polite imperative form."
  prs.a1.unit06.lesson02.teach.turn_left:
    title: "Tell someone to turn left"
    gloss: "Turn left."
    note: "به چپ بپیچید literally means 'turn to the left.'"
  prs.a1.unit06.lesson02.teach.turn_right:
    title: "Tell someone to turn right"
    gloss: "Turn right."
    note: "به راست بپیچید follows the same pattern with راست instead of چپ."

  prs.a1.unit06.lesson03.teach.first_word:
    title: "First"
    gloss: "first"
    note: "اول marks the first step in a sequence of directions."
  prs.a1.unit06.lesson03.teach.then_word:
    title: "Then"
    gloss: "then"
    note: "بعد marks the next step after the first."
  prs.a1.unit06.lesson03.teach.sequenced_example:
    title: "Combine two direction steps"
    gloss: "First go straight, then turn right."
    note: "اول and بعد let you sequence multiple direction steps in one instruction."

  prs.a1.unit06.lesson04.teach.polite_ask:
    title: "Politely ask how to get somewhere"
    gloss: "Could you tell me how to get to the market?"
    note: "می‌توانید بگویید...؟ is the polite question form (already corrected from the Iranian-colloquial می‌شه in an earlier unit) used to ask a stranger for directions."
  prs.a1.unit06.lesson04.teach.bebakhshid_review:
    title: "Ask where a place is (review)"
    gloss: "Excuse me, where is the pharmacy?"
    note: "ببخشید، [place] کجاست؟ was introduced in the places unit; it's a natural opener before asking for directions."
  prs.a1.unit06.lesson04.teach.fahmidam:
    title: "Confirm you understood"
    gloss: "Thanks very much, I understood."
    note: "تشکر زیاد، فهمیدم politely closes the exchange and confirms the directions were clear."
  prs.a1.unit06.lesson04.teach.daftar_review:
    title: "Office (review)"
    gloss: "office"
    note: "دفتر was already introduced in an earlier unit; it's used here as a destination for practicing the polite ask-for-directions pattern."

  prs.a1.unit06.lesson05.teach.after_word:
    title: "After"
    gloss: "after"
    note: "بعد از marks a landmark that comes before the destination."
  prs.a1.unit06.lesson05.teach.opposite_review:
    title: "Across from / opposite"
    gloss: "across from / opposite"
    note: "روبه‌رو is a new synonym for مقابل (opposite), which was introduced in the places unit; both are used for 'opposite' in everyday Dari."
  prs.a1.unit06.lesson05.teach.landmark_example:
    title: "Give a landmark-based direction"
    gloss: "After the mosque, the bank is across from you."
    note: "بعد از مسجد، بانک روبه‌روی شماست combines a landmark (بعد از مسجد) with a relative location (روبه‌روی شماست)."
  prs.a1.unit06.lesson05.teach.maktab_review:
    title: "School (review)"
    gloss: "school"
    note: "مکتب was introduced in the places unit; it's used here as a landmark in the practice sentence."

  prs.a1.unit06.lesson06.teach.turn01:
    title: "Sohaila asks for directions"
    gloss: "Sohaila politely asks a shopkeeper how to get to the pharmacy."
    note: "ببخشید opens the question respectfully, and می‌توانید بگویید؟ is the polite ask-for-directions phrase from lesson04."
  prs.a1.unit06.lesson06.teach.turn02:
    title: "The shopkeeper gives the first step"
    gloss: "The shopkeeper confirms and says to go straight first."
    note: "اول مستقیم بروید begins the sequence of directions."
  prs.a1.unit06.lesson06.teach.turn03:
    title: "Sohaila confirms and asks what's next"
    gloss: "Sohaila repeats 'straight' to confirm, then asks what comes next."
    note: "بعد چطور؟ is a natural, economical way to ask for the next step."
  prs.a1.unit06.lesson06.teach.turn04:
    title: "The shopkeeper gives the second step and the landmark"
    gloss: "The shopkeeper says to turn left, then locates the pharmacy using the mosque and the bank as landmarks."
    note: "This combines the turn instruction from lesson02 with the landmark pattern from lesson05."
  prs.a1.unit06.lesson06.teach.turn05:
    title: "Sohaila thanks him and confirms she understood"
    gloss: "Sohaila thanks him very much and says she understood."
    note: "تشکر زیاد، فهمیدم closes the exchange, as taught in lesson04."
  prs.a1.unit06.lesson06.teach.turn06:
    title: "The shopkeeper's modest reply and farewell"
    gloss: "The shopkeeper deflects the thanks and wishes her a good trip."
    note: "قابلی نداره was introduced in the places unit; سفر خوش (have a good trip / safe travels) is a natural farewell for someone about to walk somewhere."

exercises:
  prs.a1.unit06.lesson01.exercise01.recognize_straight:
    instruction: "Which word means straight?"
    correct_option: مستقیم
    distractors: [چپ, راست, "بپیچید"]
    accepted_answers: [{value: مستقیم, status: correct}]
    feedback: "مستقیم means straight."
  prs.a1.unit06.lesson01.exercise02.recognize_left_right:
    instruction: "Which word means left?"
    correct_option: چپ
    distractors: [راست, مستقیم, "بپیچید"]
    accepted_answers: [{value: چپ, status: correct}]
    feedback: "چپ means left; راست means right."
  prs.a1.unit06.lesson01.exercise03.listen_direction_words:
    instruction: "Listen and select the word you hear."
    correct_option: چپ
    distractors: [مستقیم, راست, "بپیچید"]
    accepted_answers: [{value: چپ, status: correct}]
    feedback: "چپ appears among the direction words in the recording."
  prs.a1.unit06.lesson01.exercise04.match_direction_words:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - {value: {مستقیم: straight, چپ: left, راست: right, "بپیچید": "turn (polite imperative)"}, status: correct}
    feedback: "These four words are the basic building blocks for giving directions."
  prs.a1.unit06.lesson01.exercise05.order_turn_left:
    instruction: "Arrange the words to say turn left."
    accepted_answers: [{value: [به, چپ, بپیچید], status: correct}]
    feedback: "به چپ بپیچید means turn left."
  prs.a1.unit06.lesson01.exercise06.translate_right:
    instruction: "Translate into Dari: right."
    accepted_answers:
      - {value: راست, status: correct}
    feedback: "راست means right."
  prs.a1.unit06.lesson01.exercise07.write_straight:
    instruction: "Write the Dari word for straight."
    accepted_answers:
      - {value: مستقیم, status: correct}
    feedback: "مستقیم means straight."

  prs.a1.unit06.lesson02.exercise01.recognize_go_straight:
    instruction: "Which phrase tells someone to go straight?"
    correct_option: "مستقیم بروید"
    distractors: ["به چپ بپیچید", "به راست بپیچید", "بازار کجاست؟"]
    accepted_answers: [{value: "مستقیم بروید", status: correct}]
    feedback: "مستقیم بروید tells someone to go straight."
  prs.a1.unit06.lesson02.exercise02.recognize_turn_right:
    instruction: "Which phrase tells someone to turn right?"
    correct_option: "به راست بپیچید"
    distractors: ["به چپ بپیچید", "مستقیم بروید", "دواخانه کجاست؟"]
    accepted_answers: [{value: "به راست بپیچید", status: correct}]
    feedback: "به راست بپیچید tells someone to turn right."
  prs.a1.unit06.lesson02.exercise03.listen_go_straight:
    instruction: "Listen and select the instruction you hear."
    correct_option: "مستقیم بروید"
    distractors: ["به چپ بپیچید", "به راست بپیچید", "اول مستقیم بروید"]
    accepted_answers: [{value: "مستقیم بروید", status: correct}]
    feedback: "The speaker says مستقیم بروید."
  prs.a1.unit06.lesson02.exercise04.match_turn_instructions:
    instruction: "Match each instruction with its meaning."
    accepted_answers:
      - {value: {"مستقیم بروید": "Go straight.", "به چپ بپیچید": "Turn left.", "به راست بپیچید": "Turn right."}, status: correct}
    feedback: "These three instructions cover the basic direction commands."
  prs.a1.unit06.lesson02.exercise05.order_turn_right:
    instruction: "Arrange the words to say turn right."
    accepted_answers: [{value: [به, راست, بپیچید], status: correct}]
    feedback: "به راست بپیچید means turn right."
  prs.a1.unit06.lesson02.exercise06.listen_turn_left:
    instruction: "Listen and type what you hear."
    accepted_answers:
      - {value: "به چپ بپیچید", status: correct}
    feedback: "The recording says به چپ بپیچید."
  prs.a1.unit06.lesson02.exercise07.translate_go_straight:
    instruction: "Translate into Dari: Go straight."
    accepted_answers:
      - {value: "مستقیم بروید", status: correct}
    feedback: "مستقیم بروید means go straight."
  prs.a1.unit06.lesson02.exercise08.speak_turn_instruction:
    instruction: "Tell someone to turn right."
    accepted_answers:
      - {value: "به راست بپیچید", status: correct}
    feedback: "به راست بپیچید tells someone to turn right."

  prs.a1.unit06.lesson03.exercise01.recognize_first:
    instruction: "Which word means first?"
    correct_option: اول
    distractors: [بعد, مستقیم, چپ]
    accepted_answers: [{value: اول, status: correct}]
    feedback: "اول means first."
  prs.a1.unit06.lesson03.exercise02.recognize_then:
    instruction: "Which word means then?"
    correct_option: بعد
    distractors: [اول, مستقیم, راست]
    accepted_answers: [{value: بعد, status: correct}]
    feedback: "بعد means then."
  prs.a1.unit06.lesson03.exercise03.listen_sequenced:
    instruction: "Listen and select the full instruction you hear."
    correct_option: "اول مستقیم بروید، بعد به راست بپیچید"
    distractors: ["اول به چپ بپیچید، بعد مستقیم بروید", "مستقیم بروید", "به راست بپیچید"]
    accepted_answers: [{value: "اول مستقیم بروید، بعد به راست بپیچید", status: correct}]
    feedback: "The speaker says اول مستقیم بروید، بعد به راست بپیچید."
  prs.a1.unit06.lesson03.exercise04.match_sequence_words:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - {value: {اول: first, بعد: then}, status: correct}
    feedback: "اول and بعد let you sequence multiple steps."
  prs.a1.unit06.lesson03.exercise05.order_sequenced_directions:
    instruction: "Arrange the words: first go straight, then turn right."
    accepted_answers: [{value: [اول, مستقیم, بروید, بعد, به, راست, بپیچید], status: correct}]
    feedback: "اول مستقیم بروید، بعد به راست بپیچید sequences two steps."
  prs.a1.unit06.lesson03.exercise06.listen_type_sequence:
    instruction: "Listen and type what you hear."
    accepted_answers:
      - {value: "اول مستقیم بروید", status: correct}
    feedback: "The recording says اول مستقیم بروید."
  prs.a1.unit06.lesson03.exercise07.translate_sequenced:
    instruction: "Translate into Dari: First turn left, then go straight."
    accepted_answers:
      - {value: "اول به چپ بپیچید، بعد مستقیم بروید", status: correct}
      - {value: "اول به چپ بپیچید و بعد مستقیم بروید", status: correct}
      - {value: "اول به چپ بپیچید. بعد مستقیم بروید.", status: correct}
    feedback: "اول به چپ بپیچید، بعد مستقیم بروید sequences the two steps -- joining them with a comma, with و, or as two separate sentences are all equally natural."

  prs.a1.unit06.lesson04.exercise01.recognize_polite_ask:
    instruction: "Which phrase politely asks how to get to the market?"
    correct_option: "می‌توانید بگویید چطور به بازار بروم؟"
    distractors: ["ببخشید، دواخانه کجاست؟", "تشکر زیاد، فهمیدم", "بازار کجاست؟"]
    accepted_answers: [{value: "می‌توانید بگویید چطور به بازار بروم؟", status: correct}]
    feedback: "می‌توانید بگویید...؟ politely asks for directions."
  prs.a1.unit06.lesson04.exercise02.recognize_fahmidam:
    instruction: "Which phrase confirms you understood the directions?"
    correct_option: "تشکر زیاد، فهمیدم"
    distractors: ["می‌توانید بگویید چطور به بازار بروم؟", "ببخشید، دواخانه کجاست؟", "مستقیم بروید"]
    accepted_answers: [{value: "تشکر زیاد، فهمیدم", status: correct}]
    feedback: "تشکر زیاد، فهمیدم confirms understanding and closes the exchange politely."
  prs.a1.unit06.lesson04.exercise03.listen_polite_ask:
    instruction: "Listen and select the question you hear."
    correct_option: "می‌توانید بگویید چطور به بازار بروم؟"
    distractors: ["ببخشید، دواخانه کجاست؟", "تشکر زیاد، فهمیدم", "بازار کجاست؟"]
    accepted_answers: [{value: "می‌توانید بگویید چطور به بازار بروم؟", status: correct}]
    feedback: "The speaker asks می‌توانید بگویید چطور به بازار بروم؟"
  prs.a1.unit06.lesson04.exercise04.match_asking_phrases:
    instruction: "Match each phrase with its meaning."
    accepted_answers:
      - {value: {"می‌توانید بگویید چطور به بازار بروم؟": "Could you tell me how to get to the market?", "ببخشید، دواخانه کجاست؟": "Excuse me, where is the pharmacy?", "تشکر زیاد، فهمیدم": "Thanks very much, I understood."}, status: correct}
    feedback: "These three phrases cover opening, asking, and closing a directions exchange."
  prs.a1.unit06.lesson04.exercise05.order_polite_ask:
    instruction: "Arrange the words to politely ask how to get to the market."
    accepted_answers: [{value: [می‌توانید, بگویید, چطور, به, بازار, بروم], status: correct}]
    feedback: "می‌توانید بگویید چطور به بازار بروم؟ politely asks the question."
  prs.a1.unit06.lesson04.exercise06.translate_polite_ask:
    instruction: "Translate into Dari: Could you tell me how to get to the office?"
    accepted_answers:
      - {value: "می‌توانید بگویید چطور به دفتر بروم؟", status: correct}
      - {value: "می‌توانید بگویید چطور به دفتر بروم", status: correct}
    feedback: "می‌توانید بگویید چطور به دفتر بروم؟ substitutes دفتر for بازار in the same pattern."
  prs.a1.unit06.lesson04.exercise07.speak_polite_ask:
    instruction: "Politely ask a stranger how to get to the market."
    accepted_answers:
      - {value: "می‌توانید بگویید چطور به بازار بروم؟", status: correct}
      - {value: "می‌توانید بگویید چطور به بازار بروم", status: correct}
    feedback: "می‌توانید بگویید چطور به بازار بروم؟ politely asks the question."

  prs.a1.unit06.lesson05.exercise01.recognize_after:
    instruction: "Which phrase means after?"
    correct_option: "بعد از"
    distractors: [روبه‌رو, اول, بعد]
    accepted_answers: [{value: "بعد از", status: correct}]
    feedback: "بعد از means after, used before naming a landmark."
  prs.a1.unit06.lesson05.exercise02.recognize_opposite:
    instruction: "Which word means across from / opposite?"
    correct_option: روبه‌رو
    distractors: ["بعد از", اول, بعد]
    accepted_answers: [{value: روبه‌رو, status: correct}]
    feedback: "روبه‌رو means across from or opposite."
  prs.a1.unit06.lesson05.exercise03.listen_landmark:
    instruction: "Listen and select the sentence you hear."
    correct_option: "بعد از مسجد، بانک روبه‌روی شماست"
    distractors: ["مستقیم بروید", "به چپ بپیچید", "بازار کجاست؟"]
    accepted_answers: [{value: "بعد از مسجد، بانک روبه‌روی شماست", status: correct}]
    feedback: "The speaker says بعد از مسجد، بانک روبه‌روی شماست."
  prs.a1.unit06.lesson05.exercise04.match_landmark_words:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - {value: {"بعد از": after, روبه‌رو: "across from / opposite"}, status: correct}
    feedback: "These two words let you locate a place relative to a landmark."
  prs.a1.unit06.lesson05.exercise05.order_landmark_sentence:
    instruction: "Arrange the words: after the mosque, the bank is across from you."
    accepted_answers: [{value: [بعد, از, مسجد, بانک, روبه‌روی, شماست], status: correct}]
    feedback: "بعد از مسجد، بانک روبه‌روی شماست locates the bank using the mosque as a landmark."
  prs.a1.unit06.lesson05.exercise06.listen_type_landmark:
    instruction: "Listen and type what you hear."
    accepted_answers:
      - {value: "بعد از مسجد بانک روبه‌روی شماست", status: correct}
      - {value: "بعد از مسجد، بانک روبه‌روی شماست", status: correct}
    feedback: "The recording says بعد از مسجد، بانک روبه‌روی شماست."
  prs.a1.unit06.lesson05.exercise07.translate_landmark:
    instruction: "Translate into Dari: After the office, the school is across from you."
    accepted_answers:
      - {value: "بعد از دفتر، مکتب روبه‌روی شماست", status: correct}
      - {value: "بعد از دفتر مکتب روبه‌روی شماست", status: correct}
    feedback: "بعد از دفتر، مکتب روبه‌روی شماست follows the same landmark pattern."

  prs.a1.unit06.lesson06.exercise01.listen_context:
    instruction: "Listen to the full dialogue. What is Sohaila looking for?"
    correct_option: "the pharmacy"
    distractors: ["the bank", "the mosque", "the market"]
    accepted_answers: [{value: "the pharmacy", status: correct}]
    feedback: "Sohaila asks a shopkeeper how to get to the pharmacy."
  prs.a1.unit06.lesson06.exercise02.recognize_safar_khosh:
    instruction: "What does سفر خوش mean here?"
    correct_option: "have a good trip / safe travels"
    distractors: ["you're welcome", "I don't understand", "come back tomorrow"]
    accepted_answers: [{value: "have a good trip / safe travels", status: correct}]
    feedback: "سفر خوش is a natural farewell for someone about to walk somewhere."
  prs.a1.unit06.lesson06.exercise03.match_dialogue_facts:
    instruction: "Match each item with the matching detail from the dialogue."
    accepted_answers:
