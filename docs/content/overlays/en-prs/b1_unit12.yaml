course:
  title: Dari B1
  description: 'Intermediate Kabul Dari: stating opinions with a که clause, agreeing and disagreeing, and giving reasons with چون.'
units:
  prs.b1.unit12.debate:
    title: Agreeing and disagreeing with reasons
    description: Say what someone thinks, agree or disagree with them, and give a reason.
lessons:
  prs.b1.unit12.lesson01.thinks_that:
    title: Thinks that...
  prs.b1.unit12.lesson02.agree_with_reason:
    title: Agreeing, with a reason
  prs.b1.unit12.lesson03.disagree_with_reason:
    title: Disagreeing
  prs.b1.unit12.lesson04.dialogue_english_early:
    title: English for children
  prs.b1.unit12.lesson05.reading_debate:
    title: A debate about English
  prs.b1.unit12.lesson06.wrapup:
    title: Wrap-up
teaching:
  prs.b1.unit12.lesson01.teach.fekr:
    title: Thinks
    gloss: thinks
    note: فکر می‌کند is the 3rd person form of "to think"; the opinion follows after که.
    example_gloss: Homayoun thinks that English is important.
  prs.b1.unit12.lesson01.teach.grammar:
    title: Reporting an opinion
    gloss: فکر می‌کند که + opinion
    note: 'To report what someone thinks, use فکر می‌کند + که + the opinion: همایون فکر می‌کند که بچه‌ها باید زودتر انگلیسی یاد بگیرند (Homayoun thinks that children should learn English sooner). The که clause is the other person''s view.'
  prs.b1.unit12.lesson01.teach.bacha:
    title: Children
    gloss: children
    note: بچه‌ها is the plural of بچه (child).
    example_gloss: Children should start sooner.
  prs.b1.unit12.lesson01.teach.englisi:
    title: English
    gloss: English
    note: انگلیسی means English.
    example_gloss: Homayoun thinks that English is important.
  prs.b1.unit12.lesson01.teach.zoodtar:
    title: Sooner
    gloss: sooner
    note: زودتر means sooner or earlier.
    example_gloss: Children should start sooner.
  prs.b1.unit12.lesson01.teach.yad:
    title: (that) they learn
    gloss: (that) they learn
    note: یاد بگیرند is the 3rd person plural subjunctive of یاد گرفتن (to learn).
    example_gloss: Children should learn English.
  prs.b1.unit12.lesson02.teach.movafeq:
    title: I agree with Homayoun
    gloss: I agree with Homayoun
    note: با ... موافق استم means "I agree with ..."; the person comes after با.
    example_gloss: I agree with Homayoun.
  prs.b1.unit12.lesson02.teach.grammar:
    title: Agreeing with a reason
    gloss: موافق استم، چون + reason
    note: 'To agree and give a reason, say موافق استم and then add چون + the reason: من با همایون موافق استم، چون انگلیسی برای کار مهم است (I agree with Homayoun, because English is important for work).'
  prs.b1.unit12.lesson02.teach.chon:
    title: Because
    gloss: because
    note: چون introduces the reason.
    example_gloss: I agree, because English is important for work.
  prs.b1.unit12.lesson02.teach.baraye:
    title: For
    gloss: for
    note: برای means for.
    example_gloss: English is important for work.
  prs.b1.unit12.lesson02.teach.dorost:
    title: Right
    gloss: right
    note: درست means right or correct.
    example_gloss: This opinion is right.
  prs.b1.unit12.lesson03.teach.movafeq_nistam:
    title: I do not agree
    gloss: I do not agree
    note: موافق نیستم is the negative of موافق استم.
    example_gloss: I do not agree.
  prs.b1.unit12.lesson03.teach.grammar:
    title: Disagreeing
    gloss: فکر نمی‌کنم که ... باشد
    note: 'To disagree, say موافق نیستم and give a reason with چون. After a negated فکر نمی‌کنم که the verb is in the subjunctive: فکر نمی‌کنم که زودتر بهتر باشد (I do not think that sooner is better).'
  prs.b1.unit12.lesson03.teach.movafeq_nist:
    title: Does not agree
    gloss: does not agree
    note: 'موافق نیست is the 3rd person form: he or she does not agree.'
    example_gloss: Zarmina does not agree.
  prs.b1.unit12.lesson03.teach.fekr_nemikonam:
    title: I do not think
    gloss: I do not think
    note: فکر نمی‌کنم means I do not think.
    example_gloss: I do not think that sooner is better.
  prs.b1.unit12.lesson03.teach.bashad:
    title: (that) it be
    gloss: (that) it be
    note: باشد is the 3rd person subjunctive of بودن; it is used after a negated فکر می‌کنم.
    example_gloss: I do not think that this is right.
  prs.b1.unit12.lesson03.teach.awal:
    title: First
    gloss: first
    note: اول means first.
    example_gloss: Children should learn Dari first.
  prs.b1.unit12.lesson03.teach.dari:
    title: Dari
    gloss: Dari
    note: دری means Dari.
    example_gloss: Children should learn Dari first.
  prs.b1.unit12.lesson04.teach.che_fekr:
    title: What do you think
    gloss: what do you think
    note: شما چه فکر می‌کنین؟ is the polite way to ask for an opinion.
    example_gloss: Homayoun, what do you think?
  prs.b1.unit12.lesson04.teach.hem:
    title: Also
    gloss: also
    note: هم means also.
    example_gloss: Dari is also important.
  prs.b1.unit12.lesson04.teach.dialogue01:
    title: Zarmina, I think that children should learn English sooner. What do you think?
    gloss: Zarmina, I think that children should learn English sooner. What do you think?
    note: Homayoun gives his opinion with فکر می‌کنم که and asks for hers.
  prs.b1.unit12.lesson04.teach.dialogue02:
    title: I do not agree. I do not think that sooner is better.
    gloss: I do not agree. I do not think that sooner is better.
    note: Zarmina disagrees and says what she does not think.
  prs.b1.unit12.lesson04.teach.dialogue03:
    title: Why?
    gloss: Why?
    note: Homayoun asks for her reason.
  prs.b1.unit12.lesson04.teach.dialogue04:
    title: Because children should learn Dari first.
    gloss: Because children should learn Dari first.
    note: Zarmina gives her reason with چون.
  prs.b1.unit12.lesson04.teach.dialogue05:
    title: That opinion is right. But English is important for work.
    gloss: That opinion is right. But English is important for work.
    note: Homayoun accepts her point, then adds his own.
  prs.b1.unit12.lesson04.teach.dialogue06:
    title: I agree that English is important, but Dari is also important.
    gloss: I agree that English is important, but Dari is also important.
    note: Zarmina agrees on one point and keeps her own.
  prs.b1.unit12.lesson05.teach.bahs:
    title: They debated
    gloss: they debated
    note: بحث کردند is the 3rd person plural simple past of بحث کردن (to debate).
    example_gloss: They debated about English.
  prs.b1.unit12.lesson05.teach.reading:
    title: A debate about English
    gloss: Homayoun and Zarmina debated about English. Homayoun thinks that children should learn English sooner. Zarmina does not agree, because children should learn Dari first. But she agrees that English is important for work.
    note: 'A short debate told in the third person: each person''s view is reported with که, and Zarmina''s reason follows چون.'
  prs.b1.unit12.lesson06.teach.grammar:
    title: 'Review: opinions and reasons'
    gloss: opinion + که, چون + reason
    note: 'Review: report a view with فکر می‌کند که; agree with موافق استم + چون + reason; disagree with موافق نیستم or فکر نمی‌کنم که ... باشد.'
  prs.b1.unit12.lesson06.teach.r_nazar:
    title: Opinion
    gloss: opinion
    note: نظر means opinion or view.
    example_gloss: I agree with your opinion.
  prs.b1.unit12.lesson06.teach.r_modir:
    title: Manager
    gloss: manager
    note: مدیر means manager.
    example_gloss: The manager thinks that this opinion is right.
