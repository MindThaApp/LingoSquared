course:
  title: Dari A2
  description: 'Lower-intermediate Afghan Dari: talking about what happens or will happen if a condition is met, for example if it rains tomorrow or if you have the receipt. اگر plus the subjunctive, with a main clause in the present or a command; weather plans and shop policies.'
units:
  prs.a2.unit37.if_conditions:
    title: If it rains
lessons:
  prs.a2.unit37.lesson01.weather_plans:
    title: If it rains
  prs.a2.unit37.lesson02.more_conditions:
    title: If I have time
  prs.a2.unit37.lesson03.commands_after_if:
    title: If you have time, come
  prs.a2.unit37.lesson04.shop_policies:
    title: If the item is broken
  prs.a2.unit37.lesson05.reading_and_listening:
    title: Reading and listening
  prs.a2.unit37.lesson06.shop_conversation:
    title: A conversation in the shop
teaching:
  prs.a2.unit37.lesson01.teach.weather:
    title: Weather
    gloss: weather, air
    note: '*هوا* is the weather, and also the air. *هوا خوب است* is the weather is good, and *هوا بد است* is the weather is bad.'
    example_gloss: The weather is good today.
  prs.a2.unit37.lesson01.teach.cold:
    title: Cold
    gloss: cold
    note: '*سرد* is cold. Its opposite is *گرم* (warm, hot), which you already know.'
    example_gloss: The weather is cold today.
  prs.a2.unit37.lesson01.teach.outside:
    title: Outside
    gloss: outside
    note: '*بیرون* is outside. *بیرون می‌روم* is I go outside, and *بیرون از خانه* is outside the house.'
    example_gloss: I am outside the house.
  prs.a2.unit37.lesson01.teach.if_pattern:
    title: 'اگر: a real condition'
    gloss: If the weather is good, I go to the park. If it rains, I stay at home.
    note: '*اگر* means if. It starts a condition that may really happen, and the verb of the condition is in the subjunctive: *باشد*, *ببارد*. This is the same form you meet after *باید*: a verb with *ب-* in front of the present stem (*ببارد*), and *باشد* for *بودن*, which takes no *ب-*. The main clause then says what happens, and it uses the plain present with *می‌*: *به پارک می‌روم*. The present with *می‌* also covers the future, so you need no special future form. Put a comma after the condition.'
  prs.a2.unit37.lesson01.teach.paradigm_ro:
    title: The subjunctive of رفتن after اگر
    gloss: if I go, if you go, if he or she goes, if we go, if you go (formal or plural), if they go
    note: 'The present stem of *رفتن* is *رو*. Put *ب-* in front and add the endings: *بروم* (I), *بروی* (you, to a friend), *برود* (he, she or it), *برویم* (we), *بروین* (you, formal or plural), *بروند* (they). Every verb takes the same six endings: *-م، -ی، -د، -یم، -ین، -ند*. The ending *-ین* is the one for you (formal or plural). The forms with *-ید* are also understood, but this course writes *-ین*.'
  prs.a2.unit37.lesson01.teach.snow_phrase:
    title: If it snows, I do not go outside
    gloss: If it snows, I do not go outside.
    note: 'The main clause can be negative. Put *نمی‌* in front of the present stem: *نمی‌روم* is I do not go. The condition stays the same: *اگر برف ببارد* is if it snows.'
  prs.a2.unit37.lesson01.teach.cold_phrase:
    title: If the weather is cold, I stay at home
    gloss: If the weather is cold, I stay at home.
    note: '*اگر هوا سرد باشد* is if the weather is cold. With *هوا* and an adjective, the condition always ends in *باشد*.'
  prs.a2.unit37.lesson02.teach.weekend:
    title: Weekend
    gloss: weekend, end of the week
    note: '*آخر هفته* is the weekend. *آخر* means end, and *هفته* is the week.'
    example_gloss: We go to the park at the weekend.
  prs.a2.unit37.lesson02.teach.tonight:
    title: Tonight
    gloss: tonight, this evening
    note: '*امشب* is tonight. It is a time word, so the main clause with *می‌* can use it: *امشب می‌روم* is I am going tonight.'
    example_gloss: Tonight I go to the cinema.
  prs.a2.unit37.lesson02.teach.formation:
    title: The subjunctive of other verbs
    gloss: that I buy, that I take, that I give, that I come, that I stay, that I eat
    note: 'The rule from *رفتن* works for every verb: present stem plus *ب-* in front, then the endings. *خر* gives *بخرم* (I buy), *گیر* gives *بگیرم* (I take), *ده* gives *بدهم* (I give), *مان* gives *بمانم* (I stay), *خور* gives *بخورم* (I eat). *آمدن* is the one to remember: its subjunctive is *بیایم، بیایی، بیاید، بیاییم، بیایین، بیایند*, with an extra *ی*. After *اگر* each of these means if I buy, if I take, and so on.'
  prs.a2.unit37.lesson02.teach.be_have:
    title: The subjunctive of بودن and داشتن
    gloss: that I be, that you be, that he/she be, that we be, that you be (formal or plural), that they be
    note: '*باشم، باشی، باشد، باشیم، باشین، باشند* are the six subjunctive forms of *بودن*; they take no *ب-*. To say if I have, Dari uses *داشته باشم*: the participle *داشته* plus *باشم*. So *اگر وقت داشته باشم* is if I have time and *اگر پول داشته باشی* is if you have money. For a possible future situation this is the usual form.'
  prs.a2.unit37.lesson02.teach.money_phrase:
    title: If I have money, I buy a book
    gloss: If I have money, I buy a book.
    note: '*اگر پول داشته باشم* is if I have money. The main clause is the plain present: *کتاب می‌خرم* is I buy a book, or I will buy a book.'
  prs.a2.unit37.lesson02.teach.negative:
    title: 'The negative: ن instead of ب'
    gloss: if I do not go, if I do not come, if I do not buy, if it is not, if it does not rain
    note: 'To make the condition negative, replace the *ب-* with *ن-*: *بروم* becomes *نروم*, *بخرم* becomes *نخرم*, and *بیایم* becomes *نیایم*. *باشد* and *ببارد* become *نباشد* and *نبارد*. So *اگر باران نبارد* is if it does not rain.'
  prs.a2.unit37.lesson02.teach.friend_phrase:
    title: If my friend comes, we play football together
    gloss: If my friend comes, we play football together.
    note: 'The condition has *بیاید* (the subjunctive of *آمدن* for he or she). The main clause now says we: *می‌کنیم* is we do or we play, and *می‌رویم* is we go. *با هم* is together.'
  prs.a2.unit37.lesson02.teach.norain_phrase:
    title: If it does not rain, we go to the park
    gloss: If it does not rain, we go to the park.
    note: '*اگر باران نبارد* is if it does not rain. The main clause is positive, and *می‌رویم* is we go.'
  prs.a2.unit37.lesson02.teach.time_phrase:
    title: If I have time, I go to the cinema tonight
    gloss: If I have time, I go to the cinema tonight.
    note: A condition about having time uses *داشته باشم*. The time word *امشب* in the main clause shows that the plan is for tonight.
  prs.a2.unit37.lesson03.teach.clothes:
    title: Clothes
    gloss: clothes, clothing
    note: '*لباس* is clothes or a piece of clothing. *لباس گرم* is warm clothes, for cold weather.'
    example_gloss: I have warm clothes.
  prs.a2.unit37.lesson03.teach.imperative:
    title: 'The command: after اگر the main clause can be an order'
    gloss: take (friend, formal or plural), wear, come, make a phone call
    note: 'The main clause can also be a command. To a friend, a command is *ب-* plus the present stem with no ending: *بگیر* (take), *بپوش* (wear), *بیا* (come). To a formal person or to several people, add *-ین*: *بگیرین، بپوشین، بیایین*. Two-word verbs have no *ب-*: *تیلفون کن* (friend), *تیلفون کنین* (formal or plural). So *اگر باران ببارد، چتر بگیر* is if it rains, take an umbrella.'
  prs.a2.unit37.lesson03.teach.neg_imperative:
    title: The negative command
    gloss: do not go, do not come, do not do (friend, formal or plural)
    note: 'A negative command uses *ن-* in place of *ب-*: *نرو* (do not go), *نیا* (do not come), *نکن* (do not do). The formal or plural forms add *-ین*: *نروین، نیایین، نکنین*. For example, *اگر باران ببارد، بیرون نرو* is if it rains, do not go outside.'
  prs.a2.unit37.lesson03.teach.present_state:
    title: 'The present in the condition: what is true now'
    gloss: If you have time, come. If you are cold, wear warm clothes.
    note: 'When the condition is something true at this moment, the condition can use the ordinary present instead of the subjunctive: *اگر وقت داری* (if you have time now) and *اگر سردت است* (if you are cold). *اگر وقت داشته باشی* is also correct and sounds more like a possible future situation. A person who is cold says *سردم است*; *سردت است* is you are cold.'
  prs.a2.unit37.lesson03.teach.rain_umbrella:
    title: If it rains, take an umbrella
    gloss: If it rains, take an umbrella.
    note: 'The condition is the subjunctive *ببارد*, and the main clause is a command to a friend: *بگیر*.'
  prs.a2.unit37.lesson03.teach.late_phone:
    title: If you are late, phone
    gloss: If you are late, make a phone call.
    note: '*دیر شوی* is the subjunctive of *دیر شدن* for you (friend): if you become late. *تیلفون کن* is the command to a friend.'
  prs.a2.unit37.lesson03.teach.problem_phone:
    title: If you have a problem, phone
    gloss: If you have a problem, make a phone call.
    note: 'Speaking to a customer or to several people, use *-ین* in both clauses: *دارین* (you have) and *کنین* (make a call). A shop would say this in a notice.'
  prs.a2.unit37.lesson04.teach.item:
    title: Goods, item
    gloss: goods, item, product
    note: '*کالا* is goods or an item that you buy in a shop.'
    example_gloss: This item is broken.
  prs.a2.unit37.lesson04.teach.customer:
    title: Customer
    gloss: customer
    note: '*مشتری* is a customer. The plural is *مشتریان*, with the ending *-ان* for people.'
    example_gloss: The customer is in the shop.
  prs.a2.unit37.lesson04.teach.receipt:
    title: Receipt
    gloss: receipt
    note: '*رسید* is a receipt, the paper that shows what you paid. It looks like the past of *رسیدن* (he arrived), but in a shop it means receipt.'
    example_gloss: Do you have the receipt with you?
  prs.a2.unit37.lesson04.teach.exchange:
    title: To exchange
    gloss: to exchange, to change
    note: '*عوض کردن* is to exchange or to change something. You put the thing and *را* before it: *کالا را عوض می‌کنم* is I exchange the item.'
    example_gloss: I want to exchange the book.
  prs.a2.unit37.lesson04.teach.give_back:
    title: To give back
    gloss: to give back, to return, to refund
    note: '*پس دادن* is to give back. A shop that gives money back says *پول را پس می‌دهیم* (we give the money back).'
    example_gloss: We give the money back.
  prs.a2.unit37.lesson04.teach.modal:
    title: 'Can: می‌توانم'
    gloss: I can, you can, he/she can, we can, you can (formal or plural), they can
    note: '*می‌توانم* is I can, and it is always written with *می‌* and a small gap. The six forms are *می‌توانم، می‌توانی، می‌تواند، می‌توانیم، می‌توانین، می‌توانند*. The next verb is in the subjunctive, with the same person: *می‌توانیم عوض کنیم* is we can exchange. For the negative put *ن* in front: *نمی‌توانیم* is we cannot.'
  prs.a2.unit37.lesson04.teach.shop_if:
    title: Shop rules with اگر
    gloss: If the item is broken, we exchange it. If you have the receipt with you, we can exchange the item.
    note: 'Shops use *اگر* to say what they do in each case. The condition has *باشد* (*خراب باشد*, *همراه‌تان باشد*), and the main clause is a plain present (*عوض می‌کنیم*) or *می‌توانیم* with the subjunctive. *همراه‌تان باشد* is you have it with you (literally: it is with you).'
  prs.a2.unit37.lesson04.teach.no_receipt:
    title: 'A rule with a negative: no receipt'
    gloss: If you do not have a receipt, we cannot give the money back.
    note: '*نداشته باشین* is the negative of *داشته باشین* (if you have). The main clause is also negative: *نمی‌توانیم پول را پس بدهیم* is we cannot give the money back. Speaking to a customer, the shop uses *-ین*.'
  prs.a2.unit37.lesson04.teach.seven_days:
    title: If you bring it within seven days, we exchange the item
    gloss: If you bring it within seven days, we exchange the item.
    note: '*تا هفت روز* is up to seven days. *بیاورین* is the subjunctive of *آوردن* for you (formal or plural): if you bring.'
  prs.a2.unit37.lesson05.teach.notice:
    title: A notice in a shop
    gloss: A shop notice for customers about exchanging items and getting money back.
    note: 'This is the kind of notice you see in a shop. Read for the conditions: what the shop does if you have a receipt, if the item is broken, if you have no receipt, and if you have a problem. Every rule is an *اگر* clause plus a main clause.'
  prs.a2.unit37.lesson05.teach.weather_turn01:
    title: Zeynab asks about tomorrow
    gloss: Shahin, what are you doing tomorrow?
    note: Zeynab asks her friend about his plans with the question *فردا چه می‌کنی؟* (what are you doing tomorrow?), using the present for the future.
  prs.a2.unit37.lesson05.teach.weather_turn02:
    title: Shahin gives two plans
    gloss: If the weather is good, I go to the park with my friends. If it rains, I stay at home.
    note: Shahin has two conditions with two plans. Both conditions use the subjunctive (*باشد، ببارد*) and both main clauses use the present (*می‌روم، می‌مانم*).
  prs.a2.unit37.lesson05.teach.weather_turn03:
    title: Zeynab might come
    gloss: If I have time, I will come too.
    note: '*داشته باشم* is the subjunctive for if I have. *من هم* is me too.'
  prs.a2.unit37.lesson05.teach.weather_turn04:
    title: Shahin invites her
    gloss: Great! If you come, we will play football too.
    note: '*بیایی* is the subjunctive of *آمدن* for you (friend). The main clause says we: *می‌کنیم*.'
  prs.a2.unit37.lesson05.teach.weather_turn05:
    title: Zeynab asks about the time
    gloss: What time are you going?
    note: '*می‌روین* is you go (formal or plural): Zeynab asks about the whole group.'
  prs.a2.unit37.lesson05.teach.weather_turn06:
    title: Shahin asks her to phone
    gloss: At ten. If you are late, phone.
    note: The condition is *دیر شوی* and the main clause is the command *تیلفون کن*.
  prs.a2.unit37.lesson05.teach.weather_turn07:
    title: Zeynab makes her own offer
    gloss: OK. If it rains, I will phone.
    note: 'Zeynab also uses *اگر* with *ببارد* and a main clause in the present: *تیلفون می‌کنم*.'
  prs.a2.unit37.lesson06.teach.shop_turn01:
    title: Fariba explains her problem
    gloss: Excuse me, I bought an umbrella from this shop yesterday. The umbrella is broken.
    note: Fariba starts politely with *ببخشین*. She says the umbrella is *خراب* and that she bought it *دیروز*.
  prs.a2.unit37.lesson06.teach.shop_turn02:
    title: The shop assistant gives a condition
    gloss: If you have the receipt with you, we can exchange it.
    note: 'The shop uses the pattern from the notice: a condition with *باشد* and *می‌توانیم* plus the subjunctive. *آن را* is it.'
  prs.a2.unit37.lesson06.teach.shop_turn03:
    title: Fariba has the receipt
    gloss: Yes, here is the receipt.
    note: '*رسید این است* is here is the receipt. *بلی* is yes.'
  prs.a2.unit37.lesson06.teach.shop_turn04:
    title: The shop assistant offers two choices
    gloss: Very well. If you want another umbrella, take one. If you do not want one, we will give your money back.
    note: 'Two conditions, both with the present: *اگر ... می‌خواهین* (if you want) with the command *بگیرین*, and *اگر نمی‌خواهین* (if you do not want) with *پس می‌دهیم*.'
  prs.a2.unit37.lesson06.teach.shop_turn05:
    title: Fariba chooses
    gloss: I am taking another umbrella. Thank you.
    note: 'Fariba answers in the present: *می‌گیرم* is I take, and it means she has decided.'
  prs.a2.unit37.lesson06.teach.want:
    title: If you do not want another umbrella, we give your money back
    gloss: If you do not want another umbrella, we give your money back.
    note: 'For a present wish the condition can use the ordinary present: *می‌خواهین* is you want, and *نمی‌خواهین* is you do not want. The main clause tells what the shop does.'
exercises:
  prs.a2.unit37.lesson01.exercise01.recognize_good_weather:
    instruction: What does this sentence mean?
    correct_option: If the weather is good, I go to the park
    distractors:
    - If it rains, I go to the park
    - The weather was good, so I went to the park
    - I do not go to the park
    accepted_answers:
    - value: If the weather is good, I go to the park
      status: correct
    feedback: '*اگر هوا خوب باشد* is if the weather is good, and *به پارک می‌روم* is what happens then.'
  prs.a2.unit37.lesson01.exercise02.recognize_rain_home:
    instruction: What does this sentence mean?
    correct_option: If it rains, I stay at home
    distractors:
    - If it rains, I go out
    - It rained, so I stayed at home
    - I never stay at home
    accepted_answers:
    - value: If it rains, I stay at home
      status: correct
    feedback: '*اگر باران ببارد* is if it rains, and *در خانه می‌مانم* is I stay at home.'
  prs.a2.unit37.lesson01.exercise03.complete_warm:
    instruction: 'Complete the sentence: If the weather is warm, I go outside.'
    accepted_answers:
    - value: باشد
      status: correct
    feedback: '*باشد* is the subjunctive of *بودن*. After *اگر هوا گرم* it makes the condition: if the weather is warm.'
  prs.a2.unit37.lesson01.exercise04.match_subjunctive_weather:
    instruction: Match each Dari word with its meaning.
    accepted_answers:
    - value:
        اگر بروم: if I go
        اگر بروی: if you go (to a friend)
        اگر برود: if he, she or it goes
        اگر برویم: if we go
        اگر بروین: if you go (formal or plural)
        اگر بروند: if they go
        هوا: weather
        سرد: cold
        بیرون: outside
      status: correct
    feedback: 'Only the ending of the subjunctive changes with the person: *-م* I, *-ی* you (friend), *-د* he or she, *-یم* we, *-ین* you (formal or plural), *-ند* they.'
  prs.a2.unit37.lesson01.exercise05.order_rain_home:
    instruction: 'Arrange the words to say: If it rains, I stay at home.'
    accepted_answers:
    - value:
      - اگر
      - باران
      - ببارد
      - در
      - خانه
      - می‌مانم
      status: correct
    - value:
      - در
      - خانه
      - می‌مانم
      - اگر
      - باران
      - ببارد
      status: correct
    feedback: '*اگر باران ببارد، در خانه می‌مانم.* The condition comes first, but the two clauses can swap places.'
  prs.a2.unit37.lesson01.exercise06.translate_snow:
    instruction: 'Translate into Dari: If it snows, I do not go outside.'
    accepted_answers:
    - value: اگر برف ببارد، بیرون نمی‌روم.
      status: correct
    - value: اگر برف ببارد بیرون نمی‌روم.
      status: correct
    - value: بیرون نمی‌روم، اگر برف ببارد.
      status: correct
    - value: بیرون نمی‌روم اگر برف ببارد.
      status: correct
    - value: اگر برف ببارد، من بیرون نمی‌روم.
      status: correct
    - value: اگر برف ببارد من بیرون نمی‌روم.
      status: correct
    - value: من بیرون نمی‌روم، اگر برف ببارد.
      status: correct
    - value: من بیرون نمی‌روم اگر برف ببارد.
      status: correct
    - value: اگر برف ببارد، از خانه بیرون نمی‌روم.
      status: correct
    - value: اگر برف ببارد از خانه بیرون نمی‌روم.
      status: correct
    - value: از خانه بیرون نمی‌روم، اگر برف ببارد.
      status: correct
    - value: از خانه بیرون نمی‌روم اگر برف ببارد.
      status: correct
    - value: اگر برف بیاید، بیرون نمی‌روم.
      status: correct
    - value: اگر برف بیاید بیرون نمی‌روم.
      status: correct
    - value: بیرون نمی‌روم، اگر برف بیاید.
      status: correct
    - value: بیرون نمی‌روم اگر برف بیاید.
      status: correct
    - value: اگر برف بیاید، من بیرون نمی‌روم.
      status: correct
    - value: اگر برف بیاید من بیرون نمی‌روم.
      status: correct
    - value: من بیرون نمی‌روم، اگر برف بیاید.
      status: correct
