    accepted_answers:
      - {value: "می‌شود که جلسه را زودتر شروع کنیم", status: correct}
    feedback: "می‌شود که جلسه را زودتر شروع کنیم؟ means would it be possible to start the meeting earlier?"
  prs.b1.unit09.lesson03.exercise04.match_polite_words:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - value: {می‌شود: "would it be possible", لطفاً: please, ایمیل: email, بفرستین: "send (pl/polite)", یک: "a / one", که: that}
        status: correct
    feedback: "These are this lesson's key words."
  prs.b1.unit09.lesson03.exercise05.translate_please_send_email:
    instruction: "Translate into Dari: Please send an email."
    accepted_answers:
      - {value: "لطفاً یک ایمیل بفرستین", status: correct}
      - {value: "لطفا یک ایمیل بفرستین", status: correct}
