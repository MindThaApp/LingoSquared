course:
  title: Dari B1
  description: >-
    Intermediate Kabul Dari: communicating professionally in a workplace
    meeting -- softening a suggestion with خوب می‌بود اگر... (it would be
    good if...) or می‌شود که...؟ (would it be possible that...?), making
    a direct professional suggestion with پیشنهاد می‌کنم که..., and
    writing a brief professional message.

units:
  prs.b1.unit09.workplace:
    title: Meetings
    description: Make a formal-register suggestion or request using a softened conditional form, participate in a workplace meeting exchange, and write a brief professional message.

lessons:
  prs.b1.unit09.lesson01.formal_suggestion:
    title: "It would be good if..."
  prs.b1.unit09.lesson02.making_a_suggestion:
    title: "I suggest"
  prs.b1.unit09.lesson03.polite_request:
    title: "Would it be possible...?"
  prs.b1.unit09.lesson04.dialogue_meeting:
    title: "The weekly meeting"
  prs.b1.unit09.lesson05.reading_meeting_note:
    title: "Meeting news"
  prs.b1.unit09.lesson06.wrapup_production:
    title: "Wrap-up"

teaching:
  prs.b1.unit09.lesson01.teach.khoob_mibod:
    title: It would be good
    gloss: "it would be good"
    note: "خوب می‌بود means it would be good -- می‌بود is the conditional 'would be' of بودن (to be)."
    example_gloss: "It would be good if we started the meeting earlier."
  prs.b1.unit09.lesson01.teach.agar:
    title: If
    gloss: if
    note: "اگر means if."
    example_gloss: "It would be good if we started the meeting earlier."
  prs.b1.unit09.lesson01.teach.grammar_formal_suggestion:
    title: "The formal suggestion softener"
    gloss: "خوب می‌بود اگر جلسه را زودتر شروع کنیم = it would be good if we started the meeting earlier"
    note: "خوب می‌بود اگر + subjunctive is a formal, softened way to make a suggestion in a professional setting -- a different softener from an earlier unit's می‌شد/دوست داشتم, used specifically for professional suggestions."
  prs.b1.unit09.lesson01.teach.jalasa:
    title: Meeting
    gloss: meeting
    note: "جلسه means meeting."
    example_gloss: "The meeting is at nine o'clock."
  prs.b1.unit09.lesson01.teach.shoru_konim:
    title: "(that) we start"
    gloss: "(that) we start"
    note: "شروع کنیم means (that) we start -- شروع (start) + کنیم (1st person plural subjunctive of کردن)."
    example_gloss: "It would be good if we started the meeting earlier."
  prs.b1.unit09.lesson01.teach.review_zoodtar:
    title: Earlier
    gloss: earlier
    note: "زودتر means earlier."
    example_gloss: "Let's start the meeting earlier."
  prs.b1.unit09.lesson01.teach.review_ra:
    title: "(object marker)"
    gloss: "(object marker)"
    note: "را marks the direct object."
    example_gloss: "Let's start the meeting earlier."
  prs.b1.unit09.lesson01.teach.review_saat_noh:
    title: "Nine o'clock"
    gloss: "nine o'clock"
    note: "ساعت نه means nine o'clock."
    example_gloss: "The meeting is at nine o'clock."
  prs.b1.unit09.lesson01.teach.review_ast:
    title: Is
    gloss: is
    note: "است means is."
    example_gloss: "The meeting is at nine o'clock."

  prs.b1.unit09.lesson02.teach.pishnahad_mikonam:
    title: I suggest
    gloss: "I suggest"
    note: "پیشنهاد می‌کنم means I suggest -- پیشنهاد (suggestion) + می‌کنم (I do/make)."
    example_gloss: "I suggest that we start the meeting earlier."
  prs.b1.unit09.lesson02.teach.che_pishnahad_mikonin:
    title: "What do you suggest?"
    gloss: "what do you suggest?"
    note: "چه پیشنهاد می‌کنین؟ is how a manager formally asks an employee's opinion, using شما+ین."
    example_gloss: "Homayoun, what do you suggest?"
  prs.b1.unit09.lesson02.teach.grammar_suggestion_verb:
    title: "Making a direct professional suggestion"
    gloss: "پیشنهاد می‌کنم که + subjunctive = I suggest that..."
    note: "A direct, professional way to make a suggestion. A manager can ask چه پیشنهاد می‌کنین؟ (what do you suggest?) using the formal شما+ین register established throughout this course."
  prs.b1.unit09.lesson02.teach.review_homayoun:
    title: Homayoun
    gloss: Homayoun
    note: "همایون -- a recurring character in this course."
    example_gloss: "Homayoun, what do you suggest?"
  prs.b1.unit09.lesson02.teach.review_hafta_war:
    title: Weekly
    gloss: weekly
    note: "هفته‌وار means weekly."
    example_gloss: "Let's start the weekly meetings earlier."
  prs.b1.unit09.lesson02.teach.jalase_ha:
    title: Meetings
    gloss: meetings
    note: "جلسه‌های is the plural of جلسه (meeting)."
    example_gloss: "Let's start the weekly meetings earlier."

  prs.b1.unit09.lesson03.teach.mishavad:
    title: "Would it be possible"
    gloss: "would it be possible"
    note: "می‌شود is the PRESENT tense of شدن (to become), used here to formally ask permission or make a request -- distinct from an earlier unit's PAST-tense می‌شد (used for personal favors)."
    example_gloss: "Would it be possible to start the meeting earlier?"
  prs.b1.unit09.lesson03.teach.grammar_polite_present:
    title: "The formal present-tense request"
    gloss: "می‌شود که جلسه را زودتر شروع کنیم؟ = would it be possible to start the meeting earlier?"
    note: "می‌شود که + subjunctive...؟ politely asks would it be possible / could we...? -- the more formal, meeting-appropriate version of a polite request."
  prs.b1.unit09.lesson03.teach.lotfan:
    title: Please
    gloss: please
    note: "لطفاً means please, used to soften a request or instruction."
    example_gloss: "Please send an email."
  prs.b1.unit09.lesson03.teach.email:
    title: Email
    gloss: email
    note: "ایمیل means email."
    example_gloss: "Please send an email."
  prs.b1.unit09.lesson03.teach.beferestin:
    title: "Send (you pl./polite)"
    gloss: "send (you plural/polite)"
    note: "بفرستین is the 2nd person plural/polite imperative of فرستادن (to send)."
    example_gloss: "Please send an email."
  prs.b1.unit09.lesson03.teach.review_yek:
    title: "A / one"
    gloss: "a / one"
    note: "یک means one, used here like the English indefinite article 'a'."
    example_gloss: "Please send an email."

  prs.b1.unit09.lesson04.teach.hamkaran:
    title: Colleagues
    gloss: colleagues
    note: "همکاران means colleagues."
    example_gloss: "Colleagues are tired in the afternoon."
  prs.b1.unit09.lesson04.teach.bad_az_zohr:
    title: Afternoon
    gloss: afternoon
    note: "بعد از ظهر means afternoon (literally after noon)."
    example_gloss: "Colleagues are tired in the afternoon."
  prs.b1.unit09.lesson04.teach.khaste_astand:
    title: "They are tired"
    gloss: "they are tired"
    note: "خسته استند means they are tired."
    example_gloss: "Colleagues are tired in the afternoon."
  prs.b1.unit09.lesson04.teach.taghyir:
    title: Change
    gloss: change
    note: "تغییر means change."
    example_gloss: "It would be good if we tried this change."
  prs.b1.unit09.lesson04.teach.emtehan_konim:
    title: "(that) we try"
    gloss: "(that) we try"
    note: "امتحان کنیم means (that) we try -- امتحان (trial/test) + کنیم."
    example_gloss: "It would be good if we tried this change."
  prs.b1.unit09.lesson04.teach.hamin_emroz:
    title: "This very day / today"
    gloss: "today (right away)"
    note: "همین امروز emphasizes today -- this very day, right away."
    example_gloss: "I'll send it today."
  prs.b1.unit09.lesson04.teach.mifrestam:
    title: I send
    gloss: "I send"
    note: "می‌فرستم is the 1st person present of فرستادن (to send)."
    example_gloss: "I'll send it today."
  prs.b1.unit09.lesson04.teach.review_chera:
    title: Why
    gloss: why
    note: "چرا means why."
    example_gloss: "Why are they tired?"
  prs.b1.unit09.lesson04.teach.review_chon:
    title: Because
    gloss: because
    note: "چون means because."
    example_gloss: "Because they are tired in the afternoon."
  prs.b1.unit09.lesson04.teach.review_bali:
    title: "Yes"
    gloss: "yes"
    note: "بلی means yes."
    example_gloss: "Yes, I'll send it today."
  prs.b1.unit09.lesson04.teach.review_in:
    title: This
    gloss: this
    note: "این means this."
    example_gloss: "Let's try this change."
  prs.b1.unit09.lesson04.teach.review_modir:
    title: Manager
    gloss: manager
    note: "مدیر means manager -- an established recurring role in this course (Homayoun's workplace)."
    example_gloss: "The manager started the meeting."
  prs.b1.unit09.lesson04.teach.kard:
    title: "He/she did"
    gloss: "he/she did"
    note: "کرد is the 3rd person simple past of کردن (to do/make)."
    example_gloss: "What did Homayoun suggest?"
  prs.b1.unit09.lesson04.teach.dialogue_manager_ask:
    title: "Homayoun, what do you suggest?"
    gloss: "Homayoun, what do you suggest?"
    note: "The manager formally asks Homayoun's opinion."
  prs.b1.unit09.lesson04.teach.dialogue_homayoun_suggest:
    title: "I suggest that we start the weekly meetings earlier."
    gloss: "I suggest that we start the weekly meetings earlier."
    note: "Homayoun makes his suggestion directly."
  prs.b1.unit09.lesson04.teach.dialogue_manager_why:
    title: Why?
    gloss: why?
    note: "The manager asks for a reason."
  prs.b1.unit09.lesson04.teach.dialogue_homayoun_reason:
    title: "Because colleagues are tired in the afternoon."
    gloss: "Because colleagues are tired in the afternoon."
    note: "Homayoun gives his reason."
  prs.b1.unit09.lesson04.teach.dialogue_manager_accept:
    title: "It would be good if we tried this change. Please send an email."
    gloss: "It would be good if we tried this change. Please send an email."
    note: "The manager accepts the suggestion and gives a follow-up task."
  prs.b1.unit09.lesson04.teach.dialogue_homayoun_agree:
    title: "Yes, I'll send it today."
    gloss: "Yes, I'll send it today."
    note: "Homayoun confirms he'll follow up right away."

  prs.b1.unit09.lesson05.teach.pazireft:
    title: Accepted
    gloss: accepted
    note: "پذیرفت is the 3rd person simple past of پذیرفتن (to accept)."
    example_gloss: "The manager accepted Homayoun's suggestion."
  prs.b1.unit09.lesson05.teach.did:
    title: Saw / viewed
    gloss: "saw / viewed"
    note: "دید is the 3rd person simple past of دیدن (to see)."
    example_gloss: "How did the manager view Homayoun's suggestion?"
  prs.b1.unit09.lesson05.teach.review_chetor:
    title: How
    gloss: how
    note: "چطور means how."
    example_gloss: "How did the manager view Homayoun's suggestion?"
  prs.b1.unit09.lesson05.teach.review_hala:
    title: Now
    gloss: now
    note: "حالا means now."
    example_gloss: "Now the weekly meeting is in the morning."
  prs.b1.unit09.lesson05.teach.sobh:
    title: Morning
    gloss: morning
    note: "صبح means morning."
    example_gloss: "Now the weekly meeting is in the morning."
  prs.b1.unit09.lesson05.teach.khoshhal_astand:
    title: "They are happy"
    gloss: "they are happy"
    note: "خوشحال استند means they are happy."
    example_gloss: "Colleagues are happy."
  prs.b1.unit09.lesson05.teach.nistand:
    title: "They aren't"
    gloss: "they aren't"
    note: "نیستند is the 3rd person plural negative copula."
    example_gloss: "They aren't tired in the morning."
  prs.b1.unit09.lesson05.teach.review_ne:
    title: Not
    gloss: not
    note: "نه here means not, contrasting two things (morning, not afternoon)."
    example_gloss: "It's morning, not afternoon."
  prs.b1.unit09.lesson05.teach.reading_passage:
    title: "Meeting news"
    gloss: "The manager accepted Homayoun's suggestion. Now the weekly meeting is in the morning, not the afternoon. Colleagues are happy, because they aren't tired in the morning."
    note: "A short reading that resolves the meeting proposal."

  prs.b1.unit09.lesson06.teach.grammar_review:
    title: "Review: professional register"
    gloss: "خوب می‌بود اگر... softens a suggestion; پیشنهاد می‌کنم که... states it directly; می‌شود که...؟ formally asks possibility/permission; لطفاً + imperative makes a polite formal request."
    note: "This lesson reviews and combines everything from lessons 1-5."
  prs.b1.unit09.lesson06.teach.review_karmandan:
    title: Employees
    gloss: employees
    note: "کارمندان means employees/staff."
    example_gloss: "Please notify the employees."
  prs.b1.unit09.lesson06.teach.khabar_konin:
    title: "Notify (you pl./polite)"
    gloss: "notify (you plural/polite)"
    note: "خبر کنین means notify -- خبر (news) + کنین (2nd person plural/polite subjunctive of کردن)."
    example_gloss: "Please notify the employees."

exercises:
  prs.b1.unit09.lesson01.exercise01.recognize_khoob_mibod:
    instruction: "What does this phrase mean?"
    correct_option: "it would be good"
    distractors: ["it is good", "it was good", "I would like"]
    accepted_answers: [{value: "it would be good", status: correct}]
    feedback: "خوب می‌بود means it would be good."
  prs.b1.unit09.lesson01.exercise02.recognize_jalasa:
    instruction: "What does this word mean?"
    correct_option: meeting
    distractors: [office, email, suggestion]
    accepted_answers: [{value: meeting, status: correct}]
    feedback: "جلسه means meeting."
  prs.b1.unit09.lesson01.exercise03.order_khoob_mibod_jalasa:
    instruction: "Put the words in order: It would be good if we started the meeting earlier."
    accepted_answers:
      - {value: "خوب می‌بود اگر جلسه را زودتر شروع کنیم", status: correct}
    feedback: "خوب می‌بود اگر جلسه را زودتر شروع کنیم means it would be good if we started the meeting earlier."
  prs.b1.unit09.lesson01.exercise04.match_meeting_words:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - value: {جلسه: meeting, شروع: start, زودتر: earlier, ساعت: "hour / o'clock", نه: nine, خوب: good}
        status: correct
    feedback: "These are this lesson's core meeting words."
  prs.b1.unit09.lesson01.exercise05.translate_meeting_at_nine:
    instruction: "Translate into Dari: The meeting is at nine o'clock."
    accepted_answers:
      - {value: "جلسه ساعت نه است", status: correct}
      - {value: "جلسه در ساعت نه است", status: correct}
    feedback: "جلسه ساعت نه است means the meeting is at nine o'clock."
  prs.b1.unit09.lesson01.exercise06.speak_would_be_good:
    instruction: "Say aloud in Dari: It would be good if we started the meeting earlier."
    accepted_answers:
      - {value: "خوب می‌بود اگر جلسه را زودتر شروع کنیم", status: correct}
    feedback: "خوب می‌بود اگر جلسه را زودتر شروع کنیم means it would be good if we started the meeting earlier."
  prs.b1.unit09.lesson01.exercise07.write_would_be_good:
    instruction: "Write in Dari: It would be good if we started the meeting earlier."
    accepted_answers:
      - {value: "خوب می‌بود اگر جلسه را زودتر شروع کنیم", status: correct}
    feedback: "خوب می‌بود اگر جلسه را زودتر شروع کنیم means it would be good if we started the meeting earlier."

  prs.b1.unit09.lesson02.exercise01.recognize_pishnahad:
    instruction: "What does this phrase mean?"
    correct_option: "I suggest"
    distractors: ["I need", "I agree", "I understand"]
    accepted_answers: [{value: "I suggest", status: correct}]
    feedback: "پیشنهاد می‌کنم means I suggest."
  prs.b1.unit09.lesson02.exercise02.recognize_che_pishnahad:
    instruction: "What does this phrase mean?"
    correct_option: "what do you suggest?"
    distractors: ["what do you need?", "what do you think?", "what is your name?"]
    accepted_answers: [{value: "what do you suggest?", status: correct}]
    feedback: "چه پیشنهاد می‌کنین؟ means what do you suggest?"
  prs.b1.unit09.lesson02.exercise03.order_pishnahad_hafte_war:
    instruction: "Put the words in order: I suggest that we start the weekly meetings earlier."
    accepted_answers:
      - {value: "پیشنهاد می‌کنم که جلسه‌های هفته‌وار را زودتر شروع کنیم", status: correct}
    feedback: "پیشنهاد می‌کنم که جلسه‌های هفته‌وار را زودتر شروع کنیم means I suggest that we start the weekly meetings earlier."
  prs.b1.unit09.lesson02.exercise04.match_suggestion_words:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - value: {"پیشنهاد می‌کنم": "I suggest", چه: what, می‌کنین: "you (pl/polite) do", همایون: Homayoun, "هفته‌وار": weekly, "جلسه‌های": meetings}
        status: correct
    feedback: "These are this lesson's key words."
  prs.b1.unit09.lesson02.exercise05.translate_what_do_you_suggest:
    instruction: "Translate into English: همایون، چه پیشنهاد می‌کنین؟"
    accepted_answers:
      - {value: "Homayoun, what do you suggest?", status: correct}
      - {value: "Homayoun, what would you suggest?", status: correct}
      - {value: "Homayoun, what do you propose?", status: correct}
    feedback: "همایون، چه پیشنهاد می‌کنین؟ means Homayoun, what do you suggest?"
  prs.b1.unit09.lesson02.exercise06.speak_i_suggest:
    instruction: "Say aloud in Dari: I suggest that we start the weekly meetings earlier."
    accepted_answers:
      - {value: "پیشنهاد می‌کنم که جلسه‌های هفته‌وار را زودتر شروع کنیم", status: correct}
    feedback: "پیشنهاد می‌کنم که جلسه‌های هفته‌وار را زودتر شروع کنیم means I suggest that we start the weekly meetings earlier."
  prs.b1.unit09.lesson02.exercise07.write_i_suggest:
    instruction: "Write in Dari: I suggest that we start the weekly meetings earlier."
    accepted_answers:
      - {value: "پیشنهاد می‌کنم که جلسه‌های هفته‌وار را زودتر شروع کنیم", status: correct}
    feedback: "پیشنهاد می‌کنم که جلسه‌های هفته‌وار را زودتر شروع کنیم means I suggest that we start the weekly meetings earlier."

  prs.b1.unit09.lesson03.exercise01.recognize_mishavad:
    instruction: "What does this word mean?"
    correct_option: "would it be possible"
    distractors: ["I had", "I would buy", "could it be (past favor)"]
    accepted_answers: [{value: "would it be possible", status: correct}]
