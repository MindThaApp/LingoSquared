course:
  title: Dari B2
  description: Discuss abstract values and respond to another view.
units:
  prs.b2.unit06.abstraction:
    title: Abstraction
    description: Discuss abstract values and respond to another view.
lessons:
  prs.b2.unit06.abstraction.lesson01.values:
    title: Social values
  prs.b2.unit06.abstraction.lesson02.respond:
    title: Responding to a view
  prs.b2.unit06.abstraction.lesson03.culture:
    title: Cultural difference
teaching:
  prs.b2.unit06.abstraction.lesson01.values.teach.card01:
    title: freedom
    gloss: freedom
    note: '*آزادی* is an abstract noun; Dari can discuss it bare without an English-style "the."'
    example_gloss: Freedom is harmed without law.
  prs.b2.unit06.abstraction.lesson01.values.teach.card02:
    title: responsibility
    gloss: responsibility
    note: '*مسئولیت* balances *آزادی* in this lesson, giving the argument a value contrast.'
    example_gloss: Social responsibility starts at home.
  prs.b2.unit06.abstraction.lesson01.values.teach.card03:
    title: does not remain stable
    gloss: does not remain stable
    note: '*پایدار نمی‌ماند* means something fails to stay stable; the negative stays attached to the verb.'
    example_gloss: Trust does not remain stable without honesty.
  prs.b2.unit06.abstraction.lesson01.values.teach.card04:
    title: value
    gloss: value
    note: '*ارزش* lets the discussion move from concrete examples to principles people care about.'
    example_gloss: Every society has several shared values.
  prs.b2.unit06.abstraction.lesson01.values.teach.card05:
    title: trust
    gloss: trust
    note: '*اعتماد* is built or lost over time, so it works well in qualified social claims.'
    example_gloss: Trust is built through action.
  prs.b2.unit06.abstraction.lesson01.values.teach.card06:
    title: honesty
    gloss: honesty
    note: '*صداقت* names honesty as a value; use it as a reason, not merely as a topic label.'
    example_gloss: Honesty is important in dialogue.
  prs.b2.unit06.abstraction.lesson01.values.teach.card07:
    title: on one hand
    gloss: on one hand
    note: '*از یک سو* opens the first side of a balanced argument and expects a matching contrast later.'
    example_gloss: On one hand, freedom is necessary.
  prs.b2.unit06.abstraction.lesson01.values.teach.card08:
    title: on the other hand
    gloss: on the other hand
    note: '*از سوی دیگر* introduces the second side; it should not repeat the first point in different words.'
    example_gloss: On the other hand, order is also necessary.
  prs.b2.unit06.abstraction.lesson01.values.teach.card09:
    title: society
    gloss: society
    note: '*جامعه* is society as a collective idea, useful for B2 arguments about values beyond one person.'
    example_gloss: A society without trust becomes weak.
  prs.b2.unit06.abstraction.lesson01.values.teach.grammar:
    title: Abstraction grammar
    gloss: Abstraction grammar
    note: Abstract nouns like *آزادی*, *اعتماد*, and *مسئولیت* are usually bare in Dari. Do not add a definite article from English.
  prs.b2.unit06.abstraction.lesson02.respond.teach.card01:
    title: I understand your point
    gloss: I understand your point
    note: '*حرف شما را می‌فهمم* acknowledges the other speaker before disagreeing, which keeps the response respectful.'
    example_gloss: I understand your point, but I reach a different conclusion.
  prs.b2.unit06.abstraction.lesson02.respond.teach.card02:
    title: issue
    gloss: issue
    note: '*مسئله* frames trust as an issue to consider, not just a vocabulary word for "problem."'
    example_gloss: The main issue is privacy.
  prs.b2.unit06.abstraction.lesson02.respond.teach.card03:
    title: trust
    gloss: trust
    note: '*اعتماد* reappears as the counterweight to the other view, so keep the abstract topic consistent.'
    example_gloss: People’s trust is not gained easily.
  prs.b2.unit06.abstraction.lesson02.respond.teach.card04:
    title: viewpoint
    gloss: viewpoint
    note: '*دیدگاه* is the view being engaged; it should be answered directly rather than ignored.'
    example_gloss: Your viewpoint shows personal experience.
  prs.b2.unit06.abstraction.lesson02.respond.teach.card05:
    title: I agree with this part
    gloss: I agree with this part
    note: '*با این بخش موافقم* agrees only with part of a view, leaving room for a qualification after it.'
    example_gloss: I agree with this part, but I have another question.
  prs.b2.unit06.abstraction.lesson02.respond.teach.card06:
    title: is not enough
    gloss: is not enough
    note: '*کافی نیست* rejects sufficiency without dismissing the whole idea, a useful B2 nuance.'
    example_gloss: This answer is useful, but it is not enough.
  prs.b2.unit06.abstraction.lesson02.respond.teach.card07:
    title: privacy / protected space
    gloss: privacy / protected space
    note: '*حریم* means a protected personal or family space; "privacy" is the closest English fit here.'
    example_gloss: Family privacy is important for many people.
  prs.b2.unit06.abstraction.lesson02.respond.teach.card08:
    title: private
    gloss: private
    note: '*خصوصی* modifies information or space after the noun, unlike English adjective order.'
    example_gloss: Private information must remain protected.
  prs.b2.unit06.abstraction.lesson02.respond.teach.card09:
    title: we should not pass over lightly
    gloss: we should not pass over lightly
    note: '*نباید ساده بگذریم* warns against treating an issue lightly; it is stronger than "mention."'
    example_gloss: We should not pass over people’s concern lightly.
  prs.b2.unit06.abstraction.lesson02.respond.teach.grammar:
    title: Abstraction grammar
    gloss: Abstraction grammar
    note: '*حرف شما را می‌فهمم* acknowledges the other view before qualifying it. This prevents a blunt contradiction.'
  prs.b2.unit06.abstraction.lesson03.culture.teach.card01:
    title: for some people
    gloss: for some people
    note: '*برای بعضی مردم* limits the claim to some people, protecting the sentence from overgeneralization.'
    example_gloss: For some people, silence is a sign of respect.
  prs.b2.unit06.abstraction.lesson03.culture.teach.card02:
    title: respect
    gloss: respect
    note: '*احترام* is the value being compared with speed; keep it as the subject of the preference.'
    example_gloss: Respect does not always mean agreement.
  prs.b2.unit06.abstraction.lesson03.culture.teach.card03:
    title: speed
    gloss: speed
    note: '*سرعت* becomes abstract when paired with *پاسخ*, meaning speed of response rather than physical speed.'
    example_gloss: Speed of response is important in an office.
  prs.b2.unit06.abstraction.lesson03.culture.teach.card04:
    title: response
    gloss: response
    note: '*پاسخ* can mean a reply or response; here it completes the phrase about response speed.'
    example_gloss: A short response is sometimes enough.
  prs.b2.unit06.abstraction.lesson03.culture.teach.card05:
    title: difference
    gloss: difference
    note: '*تفاوت* names difference without judging it, which helps keep cultural claims neutral.'
    example_gloss: A difference of opinion is not enmity.
  prs.b2.unit06.abstraction.lesson03.culture.teach.card06:
    title: cultural
    gloss: cultural
    note: '*فرهنگی* follows the noun it modifies, as in *تفاوت فرهنگی*.'
    example_gloss: One cultural behavior has several meanings.
  prs.b2.unit06.abstraction.lesson03.culture.teach.card07:
    title: we should not generalize
    gloss: we should not generalize
    note: '*نباید تعمیم بدهیم* is the anti-overgeneralization frame; it is central to fair cultural comparison.'
    example_gloss: We should not generalize from one experience.
  prs.b2.unit06.abstraction.lesson03.culture.teach.card08:
    title: family
    gloss: family
    note: '*خانواده* narrows the cultural example to family practice, not an entire society.'
    example_gloss: Each family has its own separate customs.
  prs.b2.unit06.abstraction.lesson03.culture.teach.card09:
    title: can be true at the same time
    gloss: can be true at the same time
    note: '*همزمان درست باشد* allows two interpretations to coexist; the verb *باشد* fits the abstract possibility.'
    example_gloss: Two interpretations can be true at the same time.
  prs.b2.unit06.abstraction.lesson03.culture.teach.grammar:
    title: Abstraction grammar
    gloss: Abstraction grammar
    note: '*برای بعضی مردم* and *در برخی خانواده‌ها* avoid overgeneralization. They keep abstract claims fair.'
