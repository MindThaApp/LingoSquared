course:
  title: Dari A1
  description: "Beginner Kabul Dari: handle basic post-office tasks, buy a stamp, send a letter or parcel, and ask when it will arrive."
units:
  prs.a1.unit35.post:
    title: Post office
    description: Buy a stamp, send a letter or parcel, and ask when it will arrive.
lessons:
  prs.a1.unit35.lesson01.post_words:
    title: Post words
  prs.a1.unit35.lesson02.sending_mail:
    title: Sending mail
  prs.a1.unit35.lesson03.arrival_time:
    title: Arrival time
  prs.a1.unit35.lesson04.counter_dialogue:
    title: Post-office dialogue
  prs.a1.unit35.lesson05.mail_notice:
    title: Reading a mail notice
  prs.a1.unit35.lesson06.wrap_up:
    title: Wrap-up
teaching:
  prs.a1.unit35.lesson01.teach.post_office_word:
    title: Post office
    gloss: post office
    note: "پُسته خانه is the Afghan Dari form used for a post office."
    example_gloss: The post office is near.
  prs.a1.unit35.lesson01.teach.stamp_word:
    title: Stamp
    gloss: stamp
    note: "تکت پُستی is a practical beginner phrase for a postage stamp."
    example_gloss: I want a stamp.
  prs.a1.unit35.lesson01.teach.letter_word:
    title: Letter
    gloss: letter
    note: "نامه means a letter or written message."
    example_gloss: The letter is on the table.
  prs.a1.unit35.lesson01.teach.parcel_word:
    title: Parcel
    gloss: parcel
    note: "پارسل is used in current Afghan postal service language for a parcel."
    example_gloss: The parcel is not big.
  prs.a1.unit35.lesson01.teach.review_basics:
    title: "Review: one, near, is, want"
    gloss: one/a / near / is / I want
    note: "یک, نزدیک, است, and می‌خواهم are review forms used in simple counter requests."
  prs.a1.unit35.lesson01.teach.want_stamp_phrase:
    title: I want a stamp
    gloss: I want a stamp.
    note: "Use می‌خواهم for a polite, simple request."
  prs.a1.unit35.lesson01.teach.post_office_near_phrase:
    title: The post office is near
    gloss: The post office is near.
    note: "This reuses نزدیک from the neighborhood unit."
  prs.a1.unit35.lesson02.teach.send_phrase:
    title: I send a letter
    gloss: I send a letter.
    note: "روان می‌کنم literally means I set it going; here it is a natural Dari way to say I send."
  prs.a1.unit35.lesson02.teach.send_parcel_phrase:
    title: I send a parcel
    gloss: I send a parcel.
    note: "Swap نامه for پارسل to name the item being sent."
  prs.a1.unit35.lesson02.teach.review_question_words:
    title: "Review: where and to"
    gloss: where / to / Herat / you (formal)
    note: "کجا, به, هرات, and شما are review words gathered here for destination questions."
  prs.a1.unit35.lesson02.teach.to_where_question:
    title: Where is the letter going?
    gloss: Where is the letter going?
    note: "نامه به کجا می‌رود؟ asks for the destination."
  prs.a1.unit35.lesson02.teach.to_herat_answer:
    title: The letter is going to Herat
    gloss: The letter is going to Herat.
    note: "به هرات gives the destination."
  prs.a1.unit35.lesson02.teach.can_send_question:
    title: Do you send letters?
    gloss: Do you send letters?
    note: "می‌کنین is the formal you form used in public-service questions."
  prs.a1.unit35.lesson03.teach.arrive_word:
    title: It arrives
    gloss: it arrives
    note: "می‌رسد is the third-person form used for a letter or parcel arriving."
  prs.a1.unit35.lesson03.teach.review_days_numbers:
    title: "Review: days and numbers"
    gloss: how many / day / two / three
    note: "چند, روز, دو, and سه are review words used to ask about delivery time."
  prs.a1.unit35.lesson03.teach.how_many_days_question:
    title: How many days will it take?
    gloss: How many days will it take?
    note: "چند روزه می‌رسد؟ is a compact way to ask when the mail will arrive."
  prs.a1.unit35.lesson03.teach.two_days_answer:
    title: It arrives in two days
    gloss: It arrives in two days.
    note: "دو روزه literally means two-day; with می‌رسد it means arrives in two days."
  prs.a1.unit35.lesson03.teach.three_days_answer:
    title: It arrives in three days
    gloss: It arrives in three days.
    note: "سه روزه literally means three-day; with می‌رسد it means arrives in three days."
  prs.a1.unit35.lesson03.teach.review_today_tomorrow:
    title: Today and tomorrow
    gloss: today / tomorrow
    note: "امروز and فردا are review time words."
  prs.a1.unit35.lesson04.teach.review_counter_words:
    title: Hello / for / or / okay
    gloss: hello / for / or / okay
    note: "سلام, برای, یا, and خوب are review words used in the counter dialogue."
  prs.a1.unit35.lesson04.teach.dialogue_line1:
    title: "Nadia: Hello, I want a stamp."
    gloss: Hello, I want a stamp.
  prs.a1.unit35.lesson04.teach.dialogue_line2:
    title: "Rahim: For a letter or a parcel?"
    gloss: For a letter or a parcel?
  prs.a1.unit35.lesson04.teach.dialogue_line3:
    title: "Nadia: For a letter."
    gloss: For a letter.
  prs.a1.unit35.lesson04.teach.dialogue_line4:
    title: "Rahim: Where is the letter going?"
    gloss: Where is the letter going?
  prs.a1.unit35.lesson04.teach.dialogue_line5:
    title: "Nadia: It is going to Herat."
    gloss: It is going to Herat.
  prs.a1.unit35.lesson04.teach.dialogue_line6:
    title: "Rahim: Okay, the letter arrives in three days."
    gloss: Okay, the letter arrives in three days.
  prs.a1.unit35.lesson05.teach.review_u_and_message:
    title: He/she, in, and happy
    gloss: he/she / in or at / very / happy / is
    note: "او is the Dari pronoun for he or she; در, بسیار, and خوشحال are review."
  prs.a1.unit35.lesson05.teach.reading_passage:
    title: Reading about Nadia at the post office
    gloss: "Nadia is at the post office. She sends a letter to Herat. The letter arrives in three days. Nadia is happy."
  prs.a1.unit35.lesson06.teach.review_like_but_time:
    title: I like / but I do not have time
    gloss: I like / object marker / but / I do not have time
    note: "دوست دارم, را, اما, وقت, and ندارم are review forms used for the wrap-up message."
  prs.a1.unit35.lesson06.teach.wrap_summary:
    title: I like the post office, but I do not have time
    gloss: "I like the post office, but I do not have time."
    note: "This continues the recent A1 wrap-up pattern using اما."
  prs.a1.unit35.lesson06.teach.service_request:
    title: Please send the letter
    gloss: Please send the letter.
    note: "لطفاً and کنین make this a polite formal request."
