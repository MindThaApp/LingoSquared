course:
  title: Dari A2
  description: 'Lower-intermediate Afghan Dari: predicting what will happen and making a promise. The plain present with a time word (فردا باران می‌بارد), maybe and probably with the subjunctive, promises with حتماً and قول می‌دهم, and the written future for reading forecasts and notices.'
units:
  prs.a2.unit28.predictions_promises:
    title: Predictions and promises
lessons:
  prs.a2.unit28.lesson01.weather_predictions:
    title: Weather and predictions with the present form
  prs.a2.unit28.lesson02.maybe_and_probably:
    title: Maybe and probably
  prs.a2.unit28.lesson03.promises:
    title: Promises
  prs.a2.unit28.lesson04.sure_or_maybe:
    title: Definitely, probably, maybe
  prs.a2.unit28.lesson05.forecast_and_notice:
    title: Reading and listening about the weather
  prs.a2.unit28.lesson06.meeting_conversation:
    title: A conversation about a meeting
teaching:
  prs.a2.unit28.lesson01.teach.weather:
    title: Weather
    gloss: weather, air
    note: '*هوا* is the weather and also the air. *هوای کابل* is the weather in Kabul: add *-ی* before the place to link the two words.'
    example_gloss: The weather in Kabul is cold today.
  prs.a2.unit28.lesson01.teach.cold:
    title: Cold
    gloss: cold
    note: '*سرد* is cold. The opposite is *گرم* (warm, hot), a word you know. *هوا سرد است* says it is cold now; *هوا سرد می‌شود* says it gets cold.'
    example_gloss: Tomorrow morning the weather gets cold.
  prs.a2.unit28.lesson01.teach.sunny:
    title: Sunny
    gloss: sunny
    note: '*آفتابی* is sunny: *هوا آفتابی است* is it is a sunny day.'
    example_gloss: Today the weather is sunny.
  prs.a2.unit28.lesson01.teach.cloudy:
    title: Cloudy
    gloss: cloudy
    note: '*ابری* is cloudy. Clouds often come before *باران* (rain) and *برف* (snow).'
    example_gloss: Tonight it gets cloudy.
  prs.a2.unit28.lesson01.teach.forecast:
    title: Forecast
    gloss: forecast, prediction
    note: '*پیش‌بینی* is a forecast or a prediction. *پیش‌بینی هوا* is the weather forecast. This is the word on the radio, on TV and on the phone before you plan a trip.'
    example_gloss: I saw the weather forecast.
  prs.a2.unit28.lesson01.teach.tonight:
    title: Tonight
    gloss: tonight, this evening
    note: '*امشب* is tonight. It is a time word, like *فردا* (tomorrow) and *امروز* (today). It is the first of the time words you use to talk about what will happen.'
    example_gloss: Tonight it will rain.
  prs.a2.unit28.lesson01.teach.dayafter:
    title: The day after tomorrow
    gloss: the day after tomorrow
    note: '*پس‌فردا* is the day after tomorrow. It is written with a small gap inside the word (the half space), as in *می‌شود*.'
    example_gloss: The day after tomorrow the weather gets warm.
  prs.a2.unit28.lesson01.teach.predict_form:
    title: 'A prediction: می‌ plus a time word'
    gloss: Tomorrow it will rain. Tonight the weather will get cold. The day after tomorrow it will be sunny.
    note: 'To say what will happen, use the plain present with *می‌* and put a time word in the sentence. The verb does not change: *می‌بارد* (it rains) and *فردا باران می‌بارد* (tomorrow it will rain) are the same verb. The time word *فردا*, *امشب* or *پس‌فردا* is what tells the listener that it is about the future. For weather you often use *می‌شود* (it becomes): *فردا هوا سرد می‌شود* is tomorrow the weather will get cold. This is the normal spoken way to predict something you are fairly sure about.'
  prs.a2.unit28.lesson01.teach.plans_form:
    title: The same form for plans and events
    gloss: Tomorrow I go to the bazaar. Next week we go to Bamyan.
    note: 'The same *می‌* present with a time word works for people too: *فردا به بازار می‌روم* is tomorrow I will go to the bazaar, and *هفتهٔ آینده به بامیان می‌رویم* is next week we will go to Bamyan. Learn the *ما* form here: *می‌رویم* (we go). Other time words: *امسال* (this year), *هفتهٔ آینده* (next week), *بعد* (later).'
  prs.a2.unit28.lesson01.teach.sentence:
    title: Tomorrow the weather will get cold
    gloss: Tomorrow the weather will get cold.
    note: 'This is the pattern of the whole unit: a time word, a subject and a plain *می‌* verb. You do not need any special future ending.'
  prs.a2.unit28.lesson02.teach.maybe:
    title: Maybe
    gloss: maybe, perhaps
    note: '*شاید* means maybe. It goes at the start of the clause and the verb after it is in the subjunctive (the form you use after *باید*), because the speaker is not sure: *شاید برف ببارد* is maybe it will snow. *ممکن است برف ببارد* means the same.'
    example_gloss: Maybe it will rain tomorrow.
  prs.a2.unit28.lesson02.teach.probably:
    title: Probably
    gloss: probably, most likely
    note: '*احتمالاً* is stronger than *شاید*: you think it is more likely than not. It takes the plain present, not the subjunctive: *احتمالاً امشب برف می‌بارد*.'
    example_gloss: Tonight it will probably snow.
  prs.a2.unit28.lesson02.teach.possible:
    title: It may snow
    gloss: It may snow.
    note: '*ممکن است* is it is possible that. Like *شاید*, it is followed by the subjunctive: *ممکن است برف ببارد*.'
  prs.a2.unit28.lesson02.teach.subj_form:
    title: 'The subjunctive: ب plus the present stem'
    gloss: that I go, that you go, that he goes, that we go, that you go (formal or plural), that they go
    note: 'The subjunctive is the present stem with *ب* in front and the same endings as the present: *می‌روم* (I go) becomes *بروم* (that I go). The endings are *-م، -ی، -د، -یم، -ین، -ند*, so you get *بروم، بروی، برود، برویم، بروین، بروند*. You already know the form from *باید*; *شاید* uses the same one. Do not put *می‌* in front of it.'
  prs.a2.unit28.lesson02.teach.subj_more:
    title: The subjunctive of other verbs
    gloss: Maybe he will come. Maybe the bus will arrive. Maybe it will snow. Maybe it will break down.
    note: 'The same rule works for every verb: *آمدن* gives *بیاید* (that he comes), *رسیدن* gives *برسد* (that it arrives), *باریدن* gives *ببارد* (that it snows). *شدن* has the short form *شود*, so you say *شاید خراب شود* (maybe it will break down). With *بودن* the subjunctive is *باشد*: *شاید در خانه باشد* (maybe he is at home).'
  prs.a2.unit28.lesson02.teach.subj_negative:
    title: 'The negative: ن in front of the subjunctive'
    gloss: Maybe he will not come. Maybe we will not go. Maybe it will not snow.
    note: 'For maybe not, put *ن* in front of the subjunctive and drop the *ب*: *بروم* becomes *نروم*, *برویم* becomes *نرویم*, *ببارد* becomes *نبارد*. The verb *آمدن* is the one to remember: its negative is *نیاید* (not *نبیاید*).'
  prs.a2.unit28.lesson02.teach.sentence:
    title: Maybe it will snow tomorrow
    gloss: Maybe it will snow tomorrow.
    note: Compare with *فردا برف می‌بارد*. That sentence says it will snow; this one says it might.
  prs.a2.unit28.lesson02.teach.sure_vs_maybe:
    title: Sure or not sure
    gloss: He is coming tomorrow. Maybe he will come tomorrow.
    note: 'The verb tells the listener how sure you are. With *می‌* you are sure: *فردا می‌آید* is he is coming tomorrow. With *شاید* the verb is the subjunctive and you are not sure: *شاید فردا بیاید* is maybe he will come tomorrow.'
  prs.a2.unit28.lesson03.teach.surely:
    title: Definitely
    gloss: definitely, for sure
    note: '*حتماً* means definitely or for sure. Put it in front of a plain *می‌* verb to make a promise or a firm decision: *حتماً می‌آیم* is I will definitely come.'
    example_gloss: I will definitely come tomorrow.
  prs.a2.unit28.lesson03.teach.promise_word:
    title: Promise
    gloss: promise, word
    note: '*قول* is a promise. *قول می‌دهم* is I promise, literally I give a promise. You can add *که* and a clause: *قول می‌دهم که می‌آیم*.'
    example_gloss: I promise that I will come.
  prs.a2.unit28.lesson03.teach.give_promise:
    title: I promise
    gloss: I promise.
    note: '*می‌دهم* is I give. You already know *می‌دهین* (you give); this is the *من* form. Say *قول می‌دهم* when you want the other person to trust you.'
  prs.a2.unit28.lesson03.teach.forget:
    title: Forget
    gloss: forgotten; to forget
    note: '*فراموش کردن* is to forget. A promise often ends with *فراموش نمی‌کنم* (I will not forget).'
    example_gloss: I will not forget my key.
  prs.a2.unit28.lesson03.teach.later:
    title: Later
    gloss: later, afterwards
    note: '*بعداً* is later. It is a time word for a promise you will keep soon but not now.'
    example_gloss: I will phone later.
  prs.a2.unit28.lesson03.teach.promise_form:
    title: 'A promise: حتماً plus the plain present'
    gloss: I will definitely come. I will definitely phone. I will definitely help. I will definitely send it.
    note: 'A promise has two parts: *حتماً* and a plain *می‌* verb in the *من* form. There is no special form. The time word can be there or not: *حتماً امشب تیلفون می‌کنم* is I will definitely phone tonight. For a promise to someone you can add *قول می‌دهم* first.'
  prs.a2.unit28.lesson03.teach.you_come_q:
    title: Will you come?
    gloss: Are you coming? Will you come?
    note: '*می‌آیی* is you come, to a friend. The present with *می‌* asks about the future in the same way as it states it: *تو می‌آیی؟* is will you come? The answer is often a promise: *حتماً می‌آیم*.'
  prs.a2.unit28.lesson03.teach.negative_promise:
    title: A promise not to do something
    gloss: I will not come late again. I will never forget.
    note: 'To promise that you will not do something, use *نمی‌* in the same pattern: *دیگر دیر نمی‌آیم* is I will not come late any more, and *هرگز فراموش نمی‌کنم* is I will never forget. *دیگر* with a negative verb means not any more.'
  prs.a2.unit28.lesson03.teach.sentence:
    title: I will definitely phone tonight
    gloss: I will definitely phone tonight.
    note: 'A promise with a time word: *حتماً*, *امشب* and *تیلفون می‌کنم*.'
  prs.a2.unit28.lesson04.teach.important:
    title: Important
    gloss: important
    note: '*مهم* is important. A *جلسه مهم* is an important meeting, one you promise to come to.'
    example_gloss: Today there is an important meeting.
  prs.a2.unit28.lesson04.teach.ladder:
    title: From sure to not sure
    gloss: He will definitely come. He will probably come. Maybe he will come. He may not come.
    note: 'Choose the word by how sure you are. *حتماً* and a plain *می‌* verb: sure. *احتمالاً* and a plain present verb: probably. *شاید* and the subjunctive: maybe. *ممکن است* and the subjunctive: possible, and it can also be negative: *ممکن است نیاید* (he may not come).'
  prs.a2.unit28.lesson04.teach.maybe_but:
    title: Maybe late, but a promise
    gloss: Maybe I will arrive late, but I will definitely come.
    note: 'You can join a maybe and a promise with *ولی* (but): *شاید دیر برسم، ولی حتماً می‌آیم*. The first part says what you cannot be sure about, the second part is what you promise. Use *شاید* for the part you cannot control and *حتماً* for the part you can.'
  prs.a2.unit28.lesson04.teach.meeting_tomorrow:
    title: A meeting tomorrow
    gloss: There is a meeting tomorrow. Will you come?
    note: A question about tomorrow uses the present with a time word. The best answer is a promise with *حتماً*.
  prs.a2.unit28.lesson05.teach.future_written:
    title: 'The written future: only to recognize'
    gloss: The weather will be cold. Snow will fall. The bus will depart. The bus will not go.
    note: 'In news, forecasts and notices you will read a written future: *خواهد* plus the short infinitive, as in *سرد خواهد بود* (it will be cold), *خواهد بارید* (it will fall as rain or snow), *حرکت خواهد کرد* (it will depart). The negative is *نخواهد*: *نخواهد رفت* (it will not go). You only need to understand this form when you read it. When you speak or write to a friend, use the form you learned: *فردا برف می‌بارد* and *حتماً می‌روم*.'
  prs.a2.unit28.lesson05.teach.forecast_reading:
    title: A weather forecast
    gloss: 'Weather forecast: On Friday the weather in Bamyan will be cold. Maybe it will snow. Next week the weather gets sunny.'
    note: A short forecast from the radio. The first sentence uses the written future *خواهد بود*. The second uses *شاید* and the subjunctive, because snow is not sure. The third uses the plain *می‌شود* with a time word. Together they show how a forecast says sure, not sure and next week.
  prs.a2.unit28.lesson05.teach.notice_reading:
    title: A notice for passengers
    gloss: 'Notice for Bamyan passengers: Next week, on Friday at eight o''clock, the bus will leave the station. Please be at the station at seven. The bus will not leave late.'
    note: 'A notice at the bus station. It uses the written future *حرکت خواهد کرد* and the negative *حرکت نخواهد کرد* for the plan, and a polite request with *لطفاً* and the subjunctive *باشین* (you be). The time is *ساعت هشت*: the bus leaves at eight and passengers must come an hour earlier.'
  prs.a2.unit28.lesson05.teach.d1_t1:
    title: Basira asks about the forecast
    gloss: Nader, did you see the weather forecast for Friday?
    note: Basira asks about the forecast with the simple past *دیدی*. *هوای جمعه* is the weather of Friday.
  prs.a2.unit28.lesson05.teach.d1_t2:
    title: Nader gives the forecast
    gloss: Yes. On Friday the weather gets cold and maybe it will snow.
    note: 'Nader uses both forms in one sentence: the plain *می‌شود* for cold, which is sure, and *شاید* with *ببارد* for snow, which is not sure.'
  prs.a2.unit28.lesson05.teach.d1_t3:
    title: Basira decides it may be better not to go
    gloss: Then maybe we will not go to Bamyan on Friday.
    note: '*شاید* with the negative subjunctive *نرویم* is maybe we will not go.'
  prs.a2.unit28.lesson05.teach.d1_t4:
    title: Nader suggests next week
    gloss: Yes. We go next week. The weather gets sunny.
    note: Nader moves the trip to *هفتهٔ آینده* with the plain *می‌رویم* and a time word.
  prs.a2.unit28.lesson05.teach.d1_t5:
    title: Basira agrees
    gloss: Good. Next week we will definitely go.
    note: 'Basira answers with *حتماً*: she is sure about next week.'
  prs.a2.unit28.lesson05.teach.d1_t6:
    title: Nader promises
    gloss: I promise.
    note: Nader ends with *قول می‌دهم*, a promise.
  prs.a2.unit28.lesson06.teach.d2_t1:
    title: Basira asks Nader
    gloss: Nader, tomorrow there is an important meeting. Will you come?
    note: Basira uses the present with *فردا* to ask about tomorrow. The meeting is *مهم*, so she wants a firm answer.
  prs.a2.unit28.lesson06.teach.d2_t2:
    title: Nader promises, with a doubt
    gloss: I will definitely come. But maybe I will arrive late, because there is a lot of traffic.
    note: Nader promises with *حتماً می‌آیم* and then says what he cannot be sure of with *شاید دیر برسم*. *چون* gives the reason.
  prs.a2.unit28.lesson06.teach.d2_t3:
    title: Basira asks for a call
    gloss: No problem. Will you phone tonight?
    note: 'Basira accepts the risk of being late with *مشکلی نیست* and asks for one more promise: a phone call tonight.'
  prs.a2.unit28.lesson06.teach.d2_t4:
    title: Nader promises to phone
    gloss: I promise. I will definitely phone tonight. I will not forget.
    note: 'Three promises in a row: *قول می‌دهم*, *حتماً امشب تیلفون می‌کنم* and *فراموش نمی‌کنم*.'
exercises:
  prs.a2.unit28.lesson01.exercise01.recognize_snow_tomorrow:
    instruction: What does this sentence mean?
    correct_option: It will snow tomorrow
    distractors:
    - It snowed yesterday
    - It never snows in Kabul
    - I like the snow
    accepted_answers:
    - value: It will snow tomorrow
      status: correct
    feedback: '*فردا برف می‌بارد* is it will snow tomorrow: the plain present *می‌بارد* plus the time word *فردا*.'
  prs.a2.unit28.lesson01.exercise02.recognize_cold_tonight:
    instruction: What does this sentence mean?
    correct_option: Tonight the weather will get cold
    distractors:
    - Tonight the weather will get warm
    - Last night the weather was cold
    - The weather is sunny now
    accepted_answers:
    - value: Tonight the weather will get cold
      status: correct
    feedback: '*امشب* is tonight and *سرد می‌شود* is it gets cold: *امشب هوا سرد می‌شود*.'
  prs.a2.unit28.lesson01.exercise03.match_weather_words:
    instruction: Match each Dari word with its meaning.
    accepted_answers:
    - value:
        هوا: weather
        سرد: cold
        گرم: warm
        آفتابی: sunny
        ابری: cloudy
        باران: rain
        برف: snow
        باد: wind
        پیش‌بینی: forecast
        امشب: tonight
        پس‌فردا: the day after tomorrow
        فردا: tomorrow
      status: correct
    feedback: These are the weather words and the time words for predictions. *امشب*, *فردا* and *پس‌فردا* are the ones you put in the sentence to talk about the future.
  prs.a2.unit28.lesson01.exercise04.order_cold_tomorrow:
    instruction: 'Arrange the words to say: Tomorrow the weather will get cold.'
    accepted_answers:
    - value:
      - فردا
      - هوا
      - سرد
      - می‌شود
      status: correct
    - value:
      - هوا
      - فردا
      - سرد
      - می‌شود
      status: correct
    feedback: '*فردا هوا سرد می‌شود.* The time word comes first or after *هوا*, and the verb stays at the end.'
  prs.a2.unit28.lesson01.exercise05.complete_rain_tonight:
    instruction: 'Complete the sentence: Tonight it will rain.'
    accepted_answers:
    - value: می‌بارد
      status: correct
    - value: میبارد
      status: correct
    - value: می بارد
      status: correct
    feedback: '*می‌بارد* is the plain present of *باریدن*. *امشب باران می‌بارد.* is tonight it will rain.'
  prs.a2.unit28.lesson01.exercise06.translate_rain_tomorrow:
    instruction: 'Translate into Dari, with a time word and the plain present: Tomorrow it will rain.'
    accepted_answers:
    - value: فردا باران می‌بارد.
      status: correct
    - value: فردا باران می‌بارد
      status: correct
    - value: باران فردا می‌بارد.
      status: correct
    - value: باران فردا می‌بارد
      status: correct
    feedback: '*فردا باران می‌بارد.* is tomorrow it will rain. The time word *فردا* can also come after *باران*.'
  prs.a2.unit28.lesson02.exercise01.recognize_maybe_snow:
    instruction: What does this sentence mean?
    correct_option: Maybe it will snow tomorrow
    distractors:
    - It will definitely snow tomorrow
    - It snowed yesterday
    - It does not snow in winter
    accepted_answers:
    - value: Maybe it will snow tomorrow
      status: correct
    feedback: '*شاید فردا برف ببارد* is maybe it will snow tomorrow: *شاید* plus the subjunctive *ببارد*.'
  prs.a2.unit28.lesson02.exercise02.which_not_sure:
    instruction: Which sentence says the speaker is not sure?
    correct_option: شاید فردا باران ببارد
    distractors:
    - فردا باران می‌بارد
    - امشب هوا سرد می‌شود
    - فردا هوا آفتابی می‌شود
    accepted_answers:
    - value: شاید فردا باران ببارد
      status: correct
    feedback: '*شاید فردا باران ببارد* is the only one with *شاید* and the subjunctive. The other sentences use the plain *می‌* present, so the speaker is sure.'
  prs.a2.unit28.lesson02.exercise03.match_maybe_sentences:
    instruction: Match each Dari sentence with its meaning.
    accepted_answers:
    - value:
        شاید بیایم: Maybe I will come
        شاید او برود: Maybe he will go
        شاید بس برسد: Maybe the bus will arrive
        شاید او نیاید: Maybe he will not come
        شاید برف ببارد: Maybe it will snow
        شاید ما نرویم: Maybe we will not go
        شاید دیر برسم: Maybe I will arrive late
        ممکن است باران ببارد: It may rain
        احتمالاً سرد است: It will probably be cold
      status: correct
    feedback: Each sentence has a word for not sure (*شاید، ممکن است، احتمالاً*) and a verb (subjunctive after *شاید* and *ممکن است*, plain present after *احتمالاً*). A *ن* in front of the verb means maybe not.
  prs.a2.unit28.lesson02.exercise04.order_maybe_rain:
    instruction: 'Arrange the words to say: Maybe it will rain tomorrow.'
    accepted_answers:
    - value:
      - شاید
      - فردا
      - باران
      - ببارد
      status: correct
    - value:
      - فردا
      - شاید
      - باران
      - ببارد
      status: correct
    feedback: '*شاید فردا باران ببارد.* *شاید* can come first or after the time word, and the subjunctive verb stays at the end.'
