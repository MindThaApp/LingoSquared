teaching:
  prs.b1.unit19.lesson01.teach.maqala:
    title: Article
    gloss: article
    note: مقاله means article.
    example_gloss: I read an article.
  prs.b1.unit19.lesson01.teach.grammar:
    title: Giving the main point
    gloss: نکتهٔ اصلی ... این است که ...
    note: 'To give the main point of an article, say نکتهٔ اصلی + the topic + این است که + the point: نکتهٔ اصلی مقاله این است که کتاب خواندن مهم است (the main point of the article is that reading books is important).'
  prs.b1.unit19.lesson01.teach.khandam:
    title: I read
    gloss: I read
    note: خواندم is the 1st person simple past of خواندن (to read).
    example_gloss: Yesterday I read a book.
  prs.b1.unit19.lesson01.teach.nokta:
    title: Main point
    gloss: main point
    note: نکتهٔ اصلی means the main point.
    example_gloss: The main point of the article is important.
  prs.b1.unit19.lesson01.teach.in_ast_ke:
    title: Is that
    gloss: is that
    note: 'این است که introduces the content of the point: "the point is that ...".'
    example_gloss: The main point is that reading is important.
  prs.b1.unit19.lesson01.teach.ketab:
    title: Reading books
    gloss: reading books
    note: کتاب خواندن means reading books.
    example_gloss: Reading books is important.
  prs.b1.unit19.lesson02.teach.nawisanda:
    title: Writer
    gloss: writer
    note: نویسنده means writer or author.
    example_gloss: The writer of this article is kind.
  prs.b1.unit19.lesson02.teach.grammar:
    title: Retelling what a text says
    gloss: نویسنده می‌گوید که ...
    note: 'To retell what a text says, use نویسنده می‌گوید که + the statement (present tense): نویسنده می‌گوید که کتاب خواندن به بچه‌ها کمک می‌کند (the writer says that reading books helps children). Use the past (نویسنده گفت که ...) when you retell what was said at one moment.'
  prs.b1.unit19.lesson02.teach.migoyad:
    title: Says that
    gloss: says that
    note: می‌گوید که introduces what someone says or writes; the present tense is normal when retelling what a text says.
    example_gloss: The writer says that reading books is important.
  prs.b1.unit19.lesson02.teach.komak_mikonad:
    title: Helps
    gloss: helps
    note: 'کمک می‌کند is the 3rd person present: he, she or it helps.'
    example_gloss: Reading books helps children.
  prs.b1.unit19.lesson02.teach.behbacha:
    title: To children
    gloss: to children
    note: به before a noun marks the person who is helped.
    example_gloss: Reading books helps children.
  prs.b1.unit19.lesson03.teach.khulasa:
    title: In short
    gloss: in short
    note: به طور خلاصه starts a one-sentence summary at the end of a retelling.
    example_gloss: In short, the article is important.
  prs.b1.unit19.lesson03.teach.grammar:
    title: Main point and details
    gloss: نکتهٔ اصلی؛ مثلاً؛ به طور خلاصه
    note: 'Separate the main point from the details. Give the main point first, add details with مثلاً (for example), and close with به طور خلاصه + one short sentence: به طور خلاصه، کتاب خواندن مهم است (in short, reading books is important).'
  prs.b1.unit19.lesson03.teach.masalan:
    title: For example
    gloss: for example
    note: مثلاً introduces a detail or an example after the main point.
    example_gloss: For example, children learn new words.
  prs.b1.unit19.lesson03.teach.lughat:
    title: New word
    gloss: new word
    note: لغت جدید means a new word.
    example_gloss: For example, children learn new words.
  prs.b1.unit19.lesson03.teach.yadmigirand:
    title: They learn
    gloss: they learn
    note: یاد می‌گیرند is the 3rd person plural present of یاد گرفتن (to learn).
    example_gloss: Children learn every day.
  prs.b1.unit19.lesson03.teach.jozeyat:
    title: Details
    gloss: details
    note: 'جزئیات means details: the smaller facts, as opposed to نکتهٔ اصلی (the main point).'
    example_gloss: The article has many details.
  prs.b1.unit19.lesson04.teach.bud:
    title: Was
    gloss: was
    note: بود is the 3rd person past of بودن.
    example_gloss: That article was good.
  prs.b1.unit19.lesson04.teach.dashat:
    title: Had
    gloss: had
    note: داشت is the 3rd person simple past of داشتن.
    example_gloss: The article had many details.
  prs.b1.unit19.lesson04.teach.dialogue01:
    title: Zarmina, what was that article about?
    gloss: Zarmina, what was that article about?
    note: Homayoun asks what the article was about.
  prs.b1.unit19.lesson04.teach.dialogue02:
    title: It was about reading books. The main point was that reading books is important.
    gloss: It was about reading books. The main point was that reading books is important.
    note: Zarmina gives the topic and the main point.
  prs.b1.unit19.lesson04.teach.dialogue03:
    title: What did the writer say?
    gloss: What did the writer say?
    note: Homayoun asks what the writer said.
  prs.b1.unit19.lesson04.teach.dialogue04:
    title: The writer said that reading books helps children.
    gloss: The writer said that reading books helps children.
    note: Zarmina retells the writer's claim with گفت که.
  prs.b1.unit19.lesson04.teach.dialogue05:
    title: Did it have details too?
    gloss: Did it have details too?
    note: Homayoun asks about details.
  prs.b1.unit19.lesson04.teach.dialogue06:
    title: Yes, for example children learn new words. In short, reading books is important.
    gloss: Yes, for example children learn new words. In short, reading books is important.
    note: Zarmina gives an example with مثلاً and closes with به طور خلاصه.
  prs.b1.unit19.lesson05.teach.khand:
    title: Read
    gloss: read
    note: خواند is the 3rd person simple past of خواندن (to read).
    example_gloss: Zarmina read an article.
  prs.b1.unit19.lesson05.teach.reading:
    title: A summary of the article
    gloss: Zarmina read an article. The main point of the article was that reading books is important. The writer said that reading books helps children. For example, children learn new words.
    note: 'A short summary told in the third person: the main point first (این بود که), then what the writer said (گفت که), then a detail with مثلاً.'
  prs.b1.unit19.lesson06.teach.grammar:
    title: 'Review: summarizing'
    gloss: نکتهٔ اصلی؛ می‌گوید که؛ مثلاً؛ به طور خلاصه
    note: 'Review: give the main point (نکتهٔ اصلی ... این است که ...), retell what the writer says (نویسنده می‌گوید که ...), add a detail (مثلاً ...) and close with به طور خلاصه.'
  prs.b1.unit19.lesson06.teach.r_modir:
    title: Manager
    gloss: manager
    note: مدیر means manager.
    example_gloss: The manager read the article.
  prs.b1.unit19.lesson06.teach.r_hafta:
    title: Week
    gloss: week
    note: هفته means week.
    example_gloss: This article was last week.
