course:
  title: Dari B1
  description: 'Intermediate Kabul Dari: summarizing an article with نکتهٔ اصلی, retelling with می‌گوید که, and separating the main point from details.'
units:
  prs.b1.unit19.summarize:
    title: Summarizing and retelling
    description: Give the main point of an article or conversation, retell what the writer said, and separate the main point from the detail.
lessons:
  prs.b1.unit19.lesson01.main_point:
    title: The main point
  prs.b1.unit19.lesson02.retell:
    title: The writer says that...
  prs.b1.unit19.lesson03.detail:
    title: In short, and details
  prs.b1.unit19.lesson04.dialogue_article:
    title: That article
