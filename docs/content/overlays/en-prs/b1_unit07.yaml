course:
  title: Dari B1
  description: >-
    Intermediate Kabul Dari: expressing hypothetical/unreal conditions
    ("if I had money, I would buy a car") with the اگر + irrealis-past
    ... + conditional construction, and using the conditional alone to
    soften a request, suggestion, or preference.

units:
  prs.b1.unit07.hypotheticals:
    title: Hypotheticals
    description: Express what you would do in a hypothetical situation, and soften a request or preference using the conditional mood alone.

lessons:
  prs.b1.unit07.lesson01.present_hypothetical_1st2nd:
    title: "If I had..."
  prs.b1.unit07.lesson02.present_hypothetical_all_persons:
    title: "All the persons"
  prs.b1.unit07.lesson03.negative_and_softening:
    title: "I didn't have / soft requests"
  prs.b1.unit07.lesson04.dialogue_wishes:
    title: "Wishes"
  prs.b1.unit07.lesson05.reading_goals:
    title: "Unfinished goals"
  prs.b1.unit07.lesson06.wrapup_production:
    title: "Wrap-up"

teaching:
  prs.b1.unit07.lesson01.teach.agar:
    title: If
    gloss: if
    note: "اگر means if -- it introduces the condition clause."
    example_gloss: "If I had money, I would buy a car."
  prs.b1.unit07.lesson01.teach.dashtam:
    title: I had
    gloss: "I had (irrealis)"
    note: "داشتم is the plain simple-past 1st person form of داشتن (to have), used here as the irrealis condition."
    example_gloss: "If I had money, I would buy a car."
  prs.b1.unit07.lesson01.teach.dashti:
    title: You had
    gloss: "you had (irrealis)"
    note: "داشتی is the 2nd person singular form."
    example_gloss: "If you had time, what would you do?"
  prs.b1.unit07.lesson01.teach.grammar_hypothetical:
    title: "The hypothetical conditional"
    gloss: "اگر پول داشتم، موتر می‌خریدم = if I had money, I would buy a car"
    note: "This is a hypothetical, not currently true -- different from اگر وقت داشته باشم (a REAL/likely condition, which uses the باشم subjunctive). Here the اگر-clause uses the plain simple past (داشتم, no می‌-prefix) and the result clause uses می‌ + past stem (می‌خریدم) -- that combination marks it as a hypothetical 'would'."
  prs.b1.unit07.lesson01.teach.mikharidam:
    title: I would buy
    gloss: "I would buy"
    note: "می‌خریدم is the conditional 'would' form of خریدن (to buy) -- می‌ + the past stem."
    example_gloss: "If I had money, I would buy a car."
  prs.b1.unit07.lesson01.teach.mikardi:
    title: You would do
    gloss: "you would do"
    note: "می‌کردی is the conditional 'would' form of کردن (to do), 2nd person."
    example_gloss: "If you had time, what would you do?"
  prs.b1.unit07.lesson01.teach.review_pool:
    title: Money
    gloss: money
    note: "پول means money."
    example_gloss: "I don't have enough money."
  prs.b1.unit07.lesson01.teach.review_moter:
    title: Car
    gloss: car
    note: "موتر means car -- an established recurring goal in this course (Homayoun's)."
    example_gloss: "Homayoun wants to buy a car."
  prs.b1.unit07.lesson01.teach.review_che:
    title: What
    gloss: what
    note: "چه means what."
    example_gloss: "What would you do?"
  prs.b1.unit07.lesson01.teach.review_yek:
    title: "A / one"
    gloss: "a / one"
    note: "یک means one, used here like the English indefinite article 'a'."
    example_gloss: "I would buy a car."
  prs.b1.unit07.lesson01.teach.review_waqt:
    title: Time
    gloss: time
    note: "وقت means time."
    example_gloss: "If you had time, what would you do?"
  prs.b1.unit07.lesson01.teach.mirftam:
    title: I would go
    gloss: "I would go"
    note: "می‌رفتم is the conditional 'would' form of رفتن (to go)."
    example_gloss: "If I had time, I would go."

  prs.b1.unit07.lesson02.teach.dasht:
    title: He/she had
    gloss: "he/she had (irrealis)"
    note: "داشت is the 3rd person singular form."
    example_gloss: "If Homayoun had money, he would buy a car."
  prs.b1.unit07.lesson02.teach.mikharid:
    title: He/she would buy
    gloss: "he/she would buy"
    note: "می‌خرید is the 3rd person singular conditional form."
    example_gloss: "If Homayoun had money, he would buy a car."
  prs.b1.unit07.lesson02.teach.dashtim:
    title: We had
    gloss: "we had (irrealis)"
    note: "داشتیم is the 1st person plural form."
    example_gloss: "If we had time, we would go to the park."
  prs.b1.unit07.lesson02.teach.dashtin:
    title: "You (pl./polite) had"
    gloss: "you (plural/polite) had (irrealis)"
    note: "داشتین is the 2nd person plural/polite form."
    example_gloss: "If you had money, what would you buy?"
  prs.b1.unit07.lesson02.teach.dashtand:
    title: They had
    gloss: "they had (irrealis)"
    note: "داشتند is the 3rd person plural form."
    example_gloss: "If they had time, they would come earlier."
  prs.b1.unit07.lesson02.teach.grammar_agreement:
    title: "Subject agreement across the whole sentence"
    gloss: "Both clauses agree with the same subject"
    note: "اگر همایون پول داشت، موتر می‌خرید (if Homayoun had money, he would buy a car) -- داشت and می‌خرید both track همایون, each verb agrees with its own subject."
  prs.b1.unit07.lesson02.teach.review_zoodtar:
    title: Earlier / sooner
    gloss: "earlier / sooner"
    note: "زودتر means earlier or sooner."
    example_gloss: "If they had time, they would come earlier."
  prs.b1.unit07.lesson02.teach.review_park:
    title: Park
    gloss: park
    note: "پارک means park."
    example_gloss: "If we had time, we would go to the park."
  prs.b1.unit07.lesson02.teach.review_homayoun:
    title: Homayoun
    gloss: Homayoun
    note: "همایون -- an established recurring character in this course."
    example_gloss: "If Homayoun had money, he would buy a car."
  prs.b1.unit07.lesson02.teach.review_ba2:
    title: To
    gloss: to
    note: "به means to/at."
    example_gloss: "We would go to the park."
  prs.b1.unit07.lesson02.teach.review_ma:
    title: We
    gloss: we
    note: "ما means we."
    example_gloss: "If we had time, we would go to the park."
  prs.b1.unit07.lesson02.teach.miraftim:
    title: We would go
    gloss: "we would go"
    note: "می‌رفتیم is the 1st person plural conditional form of رفتن."
    example_gloss: "If we had time, we would go to the park."
  prs.b1.unit07.lesson02.teach.review_anha:
    title: They
    gloss: they
    note: "آنها means they."
    example_gloss: "If they had time, they would come earlier."
  prs.b1.unit07.lesson02.teach.miamadand:
    title: They would come
    gloss: "they would come"
    note: "می‌آمدند is the 3rd person plural conditional form of آمدن (to come)."
    example_gloss: "If they had time, they would come earlier."

  prs.b1.unit07.lesson03.teach.nadashtam:
    title: I didn't have
    gloss: "I didn't have (irrealis)"
    note: "نداشتم negates داشتم with the regular ن- prefix."
    example_gloss: "If I didn't have money, I wouldn't buy a car."
  prs.b1.unit07.lesson03.teach.namikharidam:
    title: I wouldn't buy
    gloss: "I wouldn't buy"
    note: "نمی‌خریدم negates می‌خریدم -- ن- replaces the می‌ prefix."
    example_gloss: "If I didn't have money, I wouldn't buy a car."
  prs.b1.unit07.lesson03.teach.grammar_negative:
    title: "Negating the hypothetical"
    gloss: "اگر پول نداشتم، موتر نمی‌خریدم = if I didn't have money, I wouldn't buy a car"
    note: "Negate either clause the regular way: نداشتم (didn't have) and نمی‌خریدم (wouldn't buy)."
  prs.b1.unit07.lesson03.teach.mishod:
    title: "Could it be / would it work"
    gloss: "could it be"
    note: "می‌شد is the conditional form of شدن (to become), used impersonally to soften a request."
    example_gloss: "Could you possibly help?"
  prs.b1.unit07.lesson03.teach.doost_dashtam:
    title: I would like
    gloss: "I would like"
    note: "دوست داشتم softens a preference -- more polite than a direct می‌خواهم (I want)."
    example_gloss: "I would like to go with you."
  prs.b1.unit07.lesson03.teach.grammar_soft:
    title: "The conditional alone, as a softener"
    gloss: "Used alone (no اگر), the conditional form softens a request, suggestion, or preference"
    note: "می‌شد که کمک کنین؟ = could you possibly help? (softer than a direct کمک می‌کنین؟). دوست داشتم که با شما بروم = I would like to go with you (softer than می‌خواهم)."
  prs.b1.unit07.lesson03.teach.review_konin:
    title: "(that) you do"
    gloss: "(that) you do"
    note: "کنین is the 2nd person plural/polite subjunctive of کردن (to do)."
    example_gloss: "Could you possibly help?"
  prs.b1.unit07.lesson03.teach.review_ba:
    title: With
    gloss: with
    note: "با means with."
    example_gloss: "I would like to go with you."
  prs.b1.unit07.lesson03.teach.review_beravam:
    title: "(that) I go"
    gloss: "(that) I go"
    note: "بروم is the subjunctive of رفتن (to go)."
    example_gloss: "I would like to go with you."
  prs.b1.unit07.lesson03.teach.review_shoma:
    title: You
    gloss: you
    note: "شما is the polite/plural form of you, used throughout this course."
    example_gloss: "I would like to go with you."

  prs.b1.unit07.lesson04.teach.hamin_hala:
    title: Right now
    gloss: "right now"
    note: "همین حالا means right now / this very moment."
    example_gloss: "I would buy a car right now."
  prs.b1.unit07.lesson04.teach.har_rooz:
    title: Every day
    gloss: "every day"
    note: "هر روز means every day."
    example_gloss: "I would practice English every day."
  prs.b1.unit07.lesson04.teach.tamrin_mikardam:
    title: I would practice
    gloss: "I would practice"
    note: "تمرین می‌کردم means I would practice -- تمرین (practice) + the conditional of کردن."
    example_gloss: "I would practice English every day."
  prs.b1.unit07.lesson04.teach.ba_ham:
    title: Together
    gloss: together
    note: "با هم means together."
    example_gloss: "Could we practice together?"
  prs.b1.unit07.lesson04.teach.khoob_mishod:
    title: "That would be good"
    gloss: "that would be good"
    note: "خوب می‌شد is a common way to agree warmly to a suggestion."
    example_gloss: "Yes, that would be good."
  prs.b1.unit07.lesson04.teach.mikard:
    title: He/she would do
    gloss: "he/she would do"
    note: "می‌کرد is the 3rd person singular conditional form of کردن (to do)."
    example_gloss: "If Homayoun had more money, what would he do?"
  prs.b1.unit07.lesson04.teach.review_konim:
    title: "(that) we do"
    gloss: "(that) we do"
    note: "کنیم is the 1st person plural subjunctive of کردن (to do)."
    example_gloss: "Could we practice together?"
  prs.b1.unit07.lesson04.teach.dialogue_zarmina_ask:
    title: "Homayoun, if you had more money, what would you do?"
    gloss: "Homayoun, if you had more money, what would you do?"
    note: "Zarmina asks a hypothetical question."
  prs.b1.unit07.lesson04.teach.dialogue_homayoun_wish:
    title: "If I had more money, I would buy a car right now. What about you?"
    gloss: "If I had more money, I would buy a car right now. What about you?"
    note: "Homayoun answers with his established car goal, then asks back."
  prs.b1.unit07.lesson04.teach.dialogue_zarmina_wish:
    title: "If I had more time, I would practice English every day."
    gloss: "If I had more time, I would practice English every day."
    note: "Zarmina answers with her established English/job goal."
  prs.b1.unit07.lesson04.teach.dialogue_homayoun_offer:
    title: "I would like to help. Could we practice together?"
    gloss: "I would like to help. Could we practice together?"
    note: "Homayoun offers help using both softening constructions."
  prs.b1.unit07.lesson04.teach.dialogue_zarmina_agree:
    title: "Yes, that would be good."
    gloss: "Yes, that would be good."
    note: "Zarmina agrees."

  prs.b1.unit07.lesson05.teach.hanooz:
    title: Still / yet
    gloss: "still / yet"
    note: "هنوز means still or not yet."
    example_gloss: "Homayoun still doesn't have enough money."
  prs.b1.unit07.lesson05.teach.har_do:
    title: Both
    gloss: both
    note: "هر دو means both."
    example_gloss: "Both of them said they would practice together."
  prs.b1.unit07.lesson05.teach.review_kafi:
    title: Enough
    gloss: enough
    note: "کافی means enough."
    example_gloss: "I don't have enough money."
  prs.b1.unit07.lesson05.teach.review_kar_khoob:
    title: Good job
    gloss: "good job"
    note: "کار خوب means a good job -- an established recurring goal in this course (Zarmina's)."
    example_gloss: "Zarmina wants to find a good job."
  prs.b1.unit07.lesson05.teach.goftand:
    title: They said
    gloss: "they said"
    note: "گفتند is the 3rd person plural simple past of گفتن (to say)."
    example_gloss: "Both of them said they would practice together."
  prs.b1.unit07.lesson05.teach.review_english:
    title: English
    gloss: English
    note: "انگلیسی means English."
    example_gloss: "If his English were better, he would find a good job."
  prs.b1.unit07.lesson05.teach.bood:
    title: Was / were
    gloss: "was / were"
    note: "بود is the simple past 3rd person of بودن (to be), used here as an irrealis condition."
    example_gloss: "If his English were better, he would find a good job."
  prs.b1.unit07.lesson05.teach.review_zarmina:
    title: Zarmina
    gloss: Zarmina
    note: "زرمینه -- an established recurring character in this course."
    example_gloss: "Zarmina also wants to find a good job."
  prs.b1.unit07.lesson05.teach.nadarad:
    title: "He/she doesn't have"
    gloss: "he/she doesn't have"
    note: "ندارد is the 3rd person present negative of داشتن (to have)."
    example_gloss: "He still doesn't have enough money."
  prs.b1.unit07.lesson05.teach.reading_passage:
    title: "Unfinished goals"
    gloss: "Homayoun would like to buy a car, but he still doesn't have enough money. If he had more money, he would buy a car right now. Zarmina also wants to find a good job. If her English were better, she would find a good job. Both said that if they had more time, they would practice together every day."
    note: "A short reading combining hypothetical wishes with this unit's established characters and goals."

  prs.b1.unit07.lesson06.teach.grammar_review:
    title: "Review: hypothetical conditional"
    gloss: "If-clause = simple past, no می‌ (داشتم، بود). Result clause = می‌ + past stem (می‌خریدم، می‌کردم). Alone, the conditional form softens a request or preference."
    note: "This lesson reviews and combines everything from lessons 1-5."
  prs.b1.unit07.lesson06.teach.review_bozorgtar:
    title: Bigger
    gloss: bigger
    note: "بزرگ‌تر means bigger."
    example_gloss: "If I had more money, I would buy a bigger house."
  prs.b1.unit07.lesson06.teach.review_kar:
    title: Work
    gloss: work
    note: "کار means work."
    example_gloss: "If I had work, I wouldn't have time."
  prs.b1.unit07.lesson06.teach.review_beravim:
    title: "(that) we go"
    gloss: "(that) we go"
    note: "برویم is the 1st person plural subjunctive of رفتن (to go)."
    example_gloss: "Could we go tomorrow?"
  prs.b1.unit07.lesson06.teach.review_farda:
    title: Tomorrow
    gloss: tomorrow
    note: "فردا means tomorrow."
    example_gloss: "Could we go tomorrow?"
  prs.b1.unit07.lesson06.teach.review_khana:
    title: House
    gloss: house
    note: "خانه means house."
    example_gloss: "If I had more money, I would buy a bigger house."

exercises:
  prs.b1.unit07.lesson01.exercise01.recognize_agar:
    instruction: "What does this word mean?"
    correct_option: if
    distractors: [because, when, but]
    accepted_answers: [{value: if, status: correct}]
    feedback: "اگر means if."
  prs.b1.unit07.lesson01.exercise02.recognize_dashtam:
    instruction: "What does this word mean?"
    correct_option: "I had"
    distractors: ["I have", "I would buy", "I want"]
    accepted_answers: [{value: "I had", status: correct}]
    feedback: "داشتم means I had (used here as a hypothetical condition)."
  prs.b1.unit07.lesson01.exercise03.order_agar_pool_dashtam:
    instruction: "Put the words in order: If I had money, I would buy a car."
    accepted_answers:
      - {value: "اگر پول داشتم یک موتر می‌خریدم", status: correct}
    feedback: "اگر پول داشتم، یک موتر می‌خریدم means if I had money, I would buy a car."
  prs.b1.unit07.lesson01.exercise04.match_hypothetical_words:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - value: {اگر: if, داشتم: "I had", داشتی: "you had", می‌خریدم: "I would buy", پول: money, موتر: car}
        status: correct
    feedback: "These are this lesson's core hypothetical words."
  prs.b1.unit07.lesson01.exercise05.translate_if_you_had_time:
    instruction: "Translate into Dari: If you had time, what would you do?"
    accepted_answers:
      - {value: "اگر وقت داشتی، چه می‌کردی؟", status: correct}
      - {value: "اگر شما وقت داشتین، چه می‌کردین؟", status: correct}
    feedback: "اگر وقت داشتی، چه می‌کردی؟ means if you had time, what would you do?"
  prs.b1.unit07.lesson01.exercise06.speak_if_i_had_money:
    instruction: "Say aloud in Dari: If I had money, I would buy a car."
    accepted_answers:
      - {value: "اگر پول داشتم، یک موتر می‌خریدم", status: correct}
      - {value: "اگر من پول داشتم، یک موتر می‌خریدم", status: correct}
      - {value: "اگر پول داشتم، موتر می‌خریدم", status: correct}
    feedback: "اگر پول داشتم، یک موتر می‌خریدم means if I had money, I would buy a car."
  prs.b1.unit07.lesson01.exercise07.write_if_i_had_time:
    instruction: "Write in Dari: If I had time, I would go."
    accepted_answers:
      - {value: "اگر وقت داشتم، می‌رفتم", status: correct}
      - {value: "اگر من وقت داشتم، می‌رفتم", status: correct}
      - {value: "اگر وقت داشتم می‌رفتم", status: correct}
    feedback: "اگر وقت داشتم، می‌رفتم means if I had time, I would go."

  prs.b1.unit07.lesson02.exercise01.recognize_dasht:
    instruction: "What does this word mean?"
    correct_option: "he/she had"
    distractors: ["we had", "they had", "I had"]
    accepted_answers: [{value: "he/she had", status: correct}]
    feedback: "داشت means he/she had (hypothetical)."
  prs.b1.unit07.lesson02.exercise02.recognize_dashtin:
    instruction: "What does this word mean?"
    correct_option: "you (pl/polite) had"
    distractors: ["they had", "we had", "he/she had"]
    accepted_answers: [{value: "you (pl/polite) had", status: correct}]
    feedback: "داشتین means you (plural/polite) had."
  prs.b1.unit07.lesson02.exercise03.order_homayoun_dasht_mikharid:
    instruction: "Put the words in order: If Homayoun had money, he would buy a car."
    accepted_answers:
      - {value: "اگر همایون پول داشت موتر می‌خرید", status: correct}
    feedback: "اگر همایون پول داشت، موتر می‌خرید means if Homayoun had money, he would buy a car."
  prs.b1.unit07.lesson02.exercise04.match_person_forms:
    instruction: "Match each form with its meaning."
    accepted_answers:
      - value: {داشتم: "I had", داشتی: "you had", داشت: "he/she had", داشتیم: "we had", داشتین: "you (pl/polite) had", داشتند: "they had"}
        status: correct
    feedback: "These are all six persons of the irrealis 'had' form."
