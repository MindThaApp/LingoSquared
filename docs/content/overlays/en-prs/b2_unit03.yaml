  prs.b2.unit03.nuance.lesson01.hedge.exercise02.recognize_sentence:
    instruction: What is the best English meaning of this Dari sentence?
    correct_option: Perhaps it would be better to write the clinic message a little more cautiously.
    distractors:
    - We must write the clinic message more harshly.
    - Perhaps it would be better to remove the clinic message.
    - The clinic message is already exact and needs no caution.
    accepted_answers:
    - value: Perhaps it would be better to write the clinic message a little more cautiously.
      status: correct
    feedback: 'This sentence means: Perhaps it would be better to write the clinic message a little more cautiously.'
  prs.b2.unit03.nuance.lesson01.hedge.exercise03.match:
    instruction: Match each Dari item with its English meaning.
    accepted_answers:
