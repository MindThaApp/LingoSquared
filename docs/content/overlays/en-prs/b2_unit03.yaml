  notes: "Fresh-context Dari review required before import.

    Review 2026-10-20 (en-prs B2 pass): 13 fixes - learner-facing template wording (recognize_sentence feedback now states the meaning instead of an internal remark; grammar_check feedback now names the specific error in each lesson; speak/write instructions and feedback no longer say 'taught sentence meaning' / 'taught B2 frame'); L2 grammar_check prompt was grammatical (نشر می‌کنم, only a person change) -> now the mood error معلومات دقیق است after به شرطی که; نشر note (not a verb stem); البته glossed 'however' -> 'of course / admittedly' (card, note, matching pair); example gloss 'causes people worry' -> 'worries people'; garbled باید مشخص بگوییم note; دقیقا -> دقیقاً. NATIVE FLAGS: تاکید without hamza; کلینیک vs کلنیک; محتاطانه‌تر naturalness."
course:
  title: Dari B2
  description: Hedge, qualify, and emphasize statements precisely.
units:
  prs.b2.unit03.nuance:
    title: Nuance
    description: Hedge, qualify, and emphasize statements precisely.
lessons:
  prs.b2.unit03.nuance.lesson01.hedge:
    title: Hedging a sentence
  prs.b2.unit03.nuance.lesson02.qualify:
    title: Qualification
  prs.b2.unit03.nuance.lesson03.emphasis:
    title: Precise emphasis
teaching:
  prs.b2.unit03.nuance.lesson01.hedge.teach.card01:
    title: perhaps it would be better
    gloss: perhaps it would be better
    note: '*شاید بهتر باشد* softens advice; keep *شاید* when the English prompt says "perhaps."'
    example_gloss: Perhaps it would be better to consult the doctor first.
  prs.b2.unit03.nuance.lesson01.hedge.teach.card02:
    title: message
    gloss: message
    note: '*پیام* is the thing being revised, so the hedge should affect how it is written, not whether it exists.'
    example_gloss: The message was posted on the door.
  prs.b2.unit03.nuance.lesson01.hedge.teach.card03:
    title: clinic
    gloss: clinic
    note: '*کلینیک* gives the public-health setting; a cautious tone matters because clinic notices can alarm readers.'
    example_gloss: The clinic opens early in the morning.
  prs.b2.unit03.nuance.lesson01.hedge.teach.card04:
    title: a little
    gloss: a little
    note: '*کمی* lowers the intensity of the revision, closer to "a bit" than to a major rewrite.'
    example_gloss: Waiting a little is better.
  prs.b2.unit03.nuance.lesson01.hedge.teach.card05:
    title: more cautiously
    gloss: more cautiously
    note: '*محتاطانه‌تر* is comparative; the message becomes more cautious than before, not simply cautious.'
    example_gloss: The more cautious answer reduced misunderstanding.
  prs.b2.unit03.nuance.lesson01.hedge.teach.card06:
    title: it seems
    gloss: it seems
    note: '*به نظر می‌رسد* hedges by presenting an impression, useful when you do not want to sound absolute.'
    example_gloss: It seems the text is still harsh.
  prs.b2.unit03.nuance.lesson01.hedge.teach.card07:
    title: tone
    gloss: tone
    note: '*لحن* refers to tone; it lets you criticize wording without attacking the message itself.'
    example_gloss: A calm tone builds trust.
  prs.b2.unit03.nuance.lesson01.hedge.teach.card08:
    title: harsh
    gloss: harsh
    note: '*تند* can mean harsh in this context, not only physically fast or spicy.'
    example_gloss: A harsh sentence upsets people.
  prs.b2.unit03.nuance.lesson01.hedge.teach.card09:
    title: needs care
    gloss: needs care
    note: '*جای دقت دارد* flags that something needs care without directly saying it is wrong.'
    example_gloss: This statistic needs care.
  prs.b2.unit03.nuance.lesson01.hedge.teach.grammar:
    title: Nuance grammar
    gloss: Nuance grammar
    note: '*شاید بهتر باشد* softens a proposal. It is useful when certainty or authority is limited.'
  prs.b2.unit03.nuance.lesson02.qualify.teach.card01:
    title: provided that
    gloss: provided that
    note: '*به شرطی که* makes the claim conditional; the following clause needs a subjunctive-style verb like *باشد*.'
    example_gloss: Provided that there is enough time, we continue the meeting.
  prs.b2.unit03.nuance.lesson02.qualify.teach.card02:
    title: information
    gloss: information
    note: '*معلومات* is the information being checked; it stays plural-looking but often takes singular treatment in meaning.'
    example_gloss: New information arrived from the hospital.
  prs.b2.unit03.nuance.lesson02.qualify.teach.card03:
    title: accurate
    gloss: accurate
    note: '*دقیق* follows the noun it describes, so *معلومات دقیق* is the natural order.'
    example_gloss: An accurate number is necessary in the notice.
  prs.b2.unit03.nuance.lesson02.qualify.teach.card04:
    title: notice
    gloss: notice
    note: '*اعلان* is a public notice; in this lesson it is published only if the information is reliable.'
    example_gloss: The notice is on the clinic wall.
  prs.b2.unit03.nuance.lesson02.qualify.teach.card05:
    title: publication
    gloss: publication
    note: '*نشر* is the noun for publishing or broadcasting; with *کردن* it makes the verb *نشر کردن*. It is not limited to printing.'
    example_gloss: Publishing news without a source is not right.
  prs.b2.unit03.nuance.lesson02.qualify.teach.card06:
    title: of course / admittedly
    gloss: of course / admittedly
    note: '*البته* can mean "of course" or concede a point ("admittedly"); read the sentence context to choose.'
    example_gloss: Of course, not all signs are dangerous.
  prs.b2.unit03.nuance.lesson02.qualify.teach.card07:
    title: in most cases
    gloss: in most cases
    note: '*در بیشتر موارد* limits a claim to most cases; it protects you from overgeneralizing.'
    example_gloss: In most cases, enough rest helps.
  prs.b2.unit03.nuance.lesson02.qualify.teach.card08:
    title: limited
    gloss: limited
    note: '*محدود* narrows the recommendation; it does not automatically make the advice useless.'
    example_gloss: This recommendation is limited but useful.
  prs.b2.unit03.nuance.lesson02.qualify.teach.card09:
    title: not always
    gloss: not always
    note: '*نه همیشه* weakens an absolute statement; place it near the claim it limits.'
    example_gloss: Fever is a sign of serious illness, but not always.
  prs.b2.unit03.nuance.lesson02.qualify.teach.grammar:
    title: Nuance grammar
    gloss: Nuance grammar
    note: '*البته*, *اما*, and *به شرطی که* narrow the claim. A qualified sentence is precise, not weak.'
  prs.b2.unit03.nuance.lesson03.emphasis.teach.card01:
    title: exactly
    gloss: exactly
    note: '*دقیقاً* focuses attention on one point; overusing it can make every claim sound equally urgent.'
    example_gloss: Change exactly this word.
  prs.b2.unit03.nuance.lesson03.emphasis.teach.card02:
    title: this very point
    gloss: this very point
    note: '*همین نکته* means this very point; *همین* is the element that creates the narrow focus.'
    example_gloss: This very point was repeated in the report.
  prs.b2.unit03.nuance.lesson03.emphasis.teach.card03:
    title: causes worry
    gloss: causes worry
    note: '*باعث نگرانی* describes the cause of concern; it is stronger than saying people merely noticed something.'
    example_gloss: Vagueness in the notice worries people.
  prs.b2.unit03.nuance.lesson03.emphasis.teach.card04:
    title: doctors
    gloss: doctors
    note: '*داکتران* is Afghan Dari for doctors; it keeps the clinic scenario in the intended dialect.'
    example_gloss: The doctors spoke calmly with the families.
  prs.b2.unit03.nuance.lesson03.emphasis.teach.card05:
    title: emphasis
    gloss: emphasis
    note: '*تاکید* names emphasis as a discourse move, not just loudness.'
    example_gloss: Too much emphasis makes the tone heavy.
  prs.b2.unit03.nuance.lesson03.emphasis.teach.card06:
    title: nothing else
    gloss: nothing else
    note: '*نه چیز دیگر* excludes alternatives; use it only when the contrast is meant to be sharp.'
    example_gloss: The main problem is timing, nothing else.
  prs.b2.unit03.nuance.lesson03.emphasis.teach.card07:
    title: clear
    gloss: clear
    note: '*روشن* means clear in wording or reasoning here, not physically bright.'
    example_gloss: One clear sentence is enough.
  prs.b2.unit03.nuance.lesson03.emphasis.teach.card08:
    title: we must say clearly
    gloss: we must say clearly
    note: '*باید مشخص بگوییم* combines obligation with precision; here it introduces an embedded question with *چه کسی*.'
    example_gloss: We must say clearly who should call.
  prs.b2.unit03.nuance.lesson03.emphasis.teach.card09:
    title: in fact
    gloss: in fact
    note: '*در واقع* reinforces a correction or focus point; it is closer to "in fact" than to a location phrase.'
    example_gloss: In fact, the previous notice was vague.
  prs.b2.unit03.nuance.lesson03.emphasis.teach.grammar:
    title: Nuance grammar
    gloss: Nuance grammar
    note: '*دقیقاً* and *همین* focus one point. Use them to strengthen a specific claim, not every sentence.'
