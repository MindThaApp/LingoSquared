course:
  title: Dari A1
  description: 'Beginner Kabul Dari: education and studies vocabulary (university, school, field of study, student, lesson), naming a field of study (medicine, law, economics, literature), asking and answering where you study, and a Karim/Parwin dialogue about studies and how they feel about them.'
units:
  prs.a1.unit31.education:
    title: Education
    description: Talk about what you study, where you study, and how you feel about it.
lessons:
  prs.a1.unit31.lesson01.study_vocabulary:
    title: Study words
  prs.a1.unit31.lesson02.fields_of_study:
    title: Fields of study
  prs.a1.unit31.lesson03.where_question:
    title: Where do you study?
  prs.a1.unit31.lesson04.education_dialogue:
    title: Education dialogue
  prs.a1.unit31.lesson05.reading_education:
    title: Reading about education
  prs.a1.unit31.lesson06.wrap_up:
    title: Wrap-up
teaching:
  prs.a1.unit31.lesson01.teach.education_word:
    title: Education
    gloss: education / studies
    note: تحصیل means education or studies in general, the topic word for this unit.
    example_gloss: Education is good.
  prs.a1.unit31.lesson01.teach.university_word:
    title: University
    gloss: university
    note: پوهنتون means university -- the standard Afghan word (as in Kabul University's name), different from the Iranian دانشگاه.
    example_gloss: The university is in Kabul.
  prs.a1.unit31.lesson01.teach.school_word:
    title: School
    gloss: school
    note: مکتب (review from unit05) means school.
    example_gloss: This school is good.
  prs.a1.unit31.lesson01.teach.field_word:
    title: Field of study
    gloss: field of study / major
    note: رشته means a field of study or university major, a standard shared Persian/Dari word.
    example_gloss: My field is medicine.
  prs.a1.unit31.lesson01.teach.student_word:
    title: Student
    gloss: student
    note: محصل (review from unit03) means a university student -- the standard Afghan Dari term, different from the Iranian دانشجو.
    example_gloss: He/She is a student.
  prs.a1.unit31.lesson01.teach.lesson_word:
    title: Lesson
    gloss: lesson
    note: درس means lesson, used with خواندن (to read) to make the light-verb phrase for "to study."
    example_gloss: I study every day.
  prs.a1.unit31.lesson01.teach.review_khandan:
    title: To study
    gloss: lesson + to read → I study
    note: درس (lesson) combines with خواندن (to read) to make درس می‌خوانم (I study) -- literally "I read a lesson," a genuinely new light-verb pattern for this course.
  prs.a1.unit31.lesson01.teach.combined_sentence:
    title: I study at university
    gloss: I study at university.
    note: Combines من (I, review), در (at, review), پوهنتون, and درس می‌خوانم.
  prs.a1.unit31.lesson02.teach.medicine_word:
    title: Medicine
    gloss: medicine
    note: طب means medicine as a field of study, a standard shared Persian/Dari word.
    example_gloss: Medicine is difficult.
  prs.a1.unit31.lesson02.teach.law_word:
    title: Law
    gloss: law
    note: حقوق means law as a field of study, a standard shared Persian/Dari word.
    example_gloss: Law is interesting.
  prs.a1.unit31.lesson02.teach.economics_word:
    title: Economics
    gloss: economics
    note: اقتصاد means economics as a field of study, a standard shared Persian/Dari word.
    example_gloss: Economics is also difficult.
  prs.a1.unit31.lesson02.teach.literature_word:
    title: Literature
    gloss: literature
    note: ادبیات means literature as a field of study, a standard shared Persian/Dari word.
    example_gloss: I like literature.
  prs.a1.unit31.lesson02.teach.reshte_ast_phrase:
    title: My field is medicine
    gloss: My field is medicine.
    note: Combines رشته من (my field, review) with است (is), newly introduced here.
  prs.a1.unit31.lesson02.teach.mikhanam_subject_phrase:
    title: I study medicine
    gloss: I study medicine.
    note: Applies من ... می‌خوانم (I study, review) directly to a field name, e.g. طب.
  prs.a1.unit31.lesson03.teach.review_koja:
    title: Where
    gloss: where
    note: کجا (review from unit05) means where.
  prs.a1.unit31.lesson03.teach.review_mikhanin:
    title: You study (formal)
    gloss: you study (formal)
    note: درس می‌خوانین is the formal "you study," matching the established -ین formal verb pattern (e.g. استفاده می‌کنین from unit30).
  prs.a1.unit31.lesson03.teach.question_where:
    title: Where do you study?
    gloss: Where do you study?
    note: Combines شما (you, formal, review), کجا (where), درس, and می‌خوانین.
  prs.a1.unit31.lesson03.teach.answer_kabul_university:
    title: I study at Kabul University
    gloss: I study at Kabul University.
    note: Combines من در ... درس می‌خوانم (I study at ..., review) with پوهنتون کابل (Kabul University).
  prs.a1.unit31.lesson04.teach.review_mikhanad:
    title: He/she studies
    gloss: he/she studies
    note: درس می‌خواند is the 3rd person form, matching the established 3rd-person -د verb pattern (e.g. استفاده می‌کند from unit30).
  prs.a1.unit31.lesson04.teach.review_to_mikhani:
    title: You (informal) / you study (informal)
    gloss: you (informal) / you study (informal)
    note: تو (review from unit01) and می‌خوانی are the informal register used between Karim and Parwin.
  prs.a1.unit31.lesson04.teach.dialogue_line1:
    title: 'Karim: Parwin, where do you study?'
    gloss: 'Parwin, where do you study?'
  prs.a1.unit31.lesson04.teach.dialogue_line2:
    title: 'Parwin: I study at Kabul University. My field is medicine.'
    gloss: I study at Kabul University. My field is medicine.
  prs.a1.unit31.lesson04.teach.dialogue_line3:
    title: 'Karim: Is medicine difficult?'
    gloss: Is medicine difficult?
  prs.a1.unit31.lesson04.teach.dialogue_line4:
    title: 'Parwin: Yes, it''s difficult but interesting. How about you?'
    gloss: "Yes, it's difficult but interesting. How about you?"
  prs.a1.unit31.lesson04.teach.dialogue_line5:
    title: 'Karim: I study at school.'
    gloss: I study at school.
  prs.a1.unit31.lesson04.teach.dialogue_line6:
    title: 'Parwin: Great!'
    gloss: Great!
  prs.a1.unit31.lesson05.teach.reading_passage:
    title: Reading about education
    gloss: 'Parwin studies at Kabul University. Her field is medicine. Medicine is difficult but interesting. Karim studies at school.'
  prs.a1.unit31.lesson06.teach.review_like_have_time:
    title: I like / time / I don't have
    gloss: I like / time / I don't have
    note: دوست دارم (I like), وقت (time), and ندارم (I don't have) are all review from unit11/unit14/unit26/unit29/unit30.
  prs.a1.unit31.lesson06.teach.wrap_summary:
    title: I like education, but I don't have time
    gloss: "I like education, but I don't have time."
    note: Combines تحصیل را دوست دارم (I like education, review construction) with اما وقت ندارم (but I don't have time).
