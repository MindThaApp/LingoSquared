course:
  title: Dari A2
  description: >-
    Lower-intermediate Afghan Dari: handling a formal appointment to
    register a new address at the municipality office -- vocabulary,
    making the appointment, reading an official notice, and the
    appointment itself.

units:
  prs.a2.unit09.bureaucracy:
    title: Administrative errands

lessons:
  prs.a2.unit09.lesson01.bureaucracy_vocabulary: {title: "Words for dealing with an office"}
  prs.a2.unit09.lesson02.making_an_appointment: {title: "Making an appointment"}
  prs.a2.unit09.lesson03.reading_the_notice: {title: "Reading the notice"}
  prs.a2.unit09.lesson04.at_the_municipality_office: {title: "At the municipality office"}

teaching:
  prs.a2.unit09.lesson01.teach.vaght_word:
    title: "Appointment"
    gloss: "appointment / time slot"
    note: "*وقت* literally means 'time'; *وقت گرفتن* (to take an appointment) is the everyday way to say 'make an appointment'."
  prs.a2.unit09.lesson01.teach.sanad_word:
    title: "Document"
    gloss: "document"
    note: "*سند* is the general word for an official document."
  prs.a2.unit09.lesson01.teach.address_word:
    title: "Address"
    gloss: "address"
    note: "*آدرس* is the everyday word for a home address."
  prs.a2.unit09.lesson01.teach.tazkira_word:
    title: "National ID booklet"
    gloss: "national ID booklet (tazkira)"
    note: "*تذکره* is Afghanistan's national identity booklet -- a distinct document from Iran's *کارت ملی*, the document being updated in this unit."
  prs.a2.unit09.lesson01.teach.municipality_word:
    title: "Municipality"
    gloss: "municipality"
    note: "*شاروالی* is the Afghan term for the city municipality office, distinct from Iranian Farsi's *شهرداری*."
  prs.a2.unit09.lesson01.teach.va_word:
    title: "And"
    gloss: "and"
    note: "*و* is the common connecting word used throughout this unit."

  prs.a2.unit09.lesson02.teach.request_appointment:
    title: "Ask to make an appointment"
    gloss: "I'd like to make an appointment to change my address."
    note: "*می‌خواستم* (literally 'I was wanting') softens a request into a polite one."
  prs.a2.unit09.lesson02.teach.because_moved:
    title: "Explain why, with چون (because)"
    gloss: "Because I changed my home, I need to change my address."
    note: "*چون* introduces the reason -- an A2-level subordinate clause, a step up from A1's simple statements."
  prs.a2.unit09.lesson02.teach.what_should_i_bring:
    title: "Ask what to bring, politely"
    gloss: "Could you tell me what I should bring?"
    note: "*می‌شود بگویید...؟* ('would you say / could you tell me...?') is a polite indirect question form."

  prs.a2.unit09.lesson03.teach.rent_receipt_word:
    title: "Rent receipt"
    gloss: "rent receipt"
    note: "*رسید کرایه خانه* is a receipt for house rent, one accepted proof-of-residency document."
  prs.a2.unit09.lesson03.teach.deadline_word:
    title: "Deadline"
    gloss: "deadline"
    note: "*مهلت* is the general word for a deadline or time limit."
  prs.a2.unit09.lesson03.teach.notice_text:
    title: "An office notice about changing your address"
    gloss: "To change your address, please bring your national ID booklet and a rent receipt. The registration deadline is by the end of this month."
    note: "A short official notice, in the reading_writing register this unit is teaching."
  prs.a2.unit09.lesson03.teach.i_will_bring_receipt:
    title: "Say what you'll bring"
    gloss: "I'll bring the rent receipt."
    note: "*می‌آورم* means 'I bring'."

  prs.a2.unit09.lesson04.teach.turn01:
    title: "The clerk greets کریم"
    gloss: "The clerk invites him in and asks what service they can do for him."
    note: "*بفرمایید* invites him forward; *چه خدمتی می‌توانم برایتان انجام بدهم؟* is a polite, formal way a clerk offers help."
  prs.a2.unit09.lesson04.teach.turn02:
    title: "کریم asks for an appointment"
    gloss: "کریم says he'd like to make an appointment to change his address."
    note: "Reuses lesson02's *می‌خواستم* request pattern."
  prs.a2.unit09.lesson04.teach.turn03:
    title: "The clerk asks since when"
    gloss: "The clerk asks since when he's lived at the new house."
    note: "*از کی...؟* asks 'since when'."
  prs.a2.unit09.lesson04.teach.turn04:
    title: "کریم answers and asks what to bring"
    gloss: "He says since last month, and asks what he should bring."
    note: "Combines the *از ماه گذشته* fact with lesson02's *می‌شود بگویید...؟* question."
  prs.a2.unit09.lesson04.teach.turn05:
    title: "The clerk lists the documents"
    gloss: "The clerk says the national ID booklet and a rent receipt are enough."
    note: "*کافی است* means 'is enough'."
  prs.a2.unit09.lesson04.teach.turn06:
    title: "کریم proposes a day"
    gloss: "He asks if he can come on Tuesday."
    note: "*می‌توانم...؟* asks about ability/permission."
  prs.a2.unit09.lesson04.teach.turn07:
    title: "The clerk confirms and gives a tracking code"
    gloss: "The clerk confirms Tuesday at ten o'clock and gives the tracking code three thousand fifty."
    note: "*نمبر پیگیری* is the tracking/reference number for the appointment -- *نمبر* is a common Afghan loanword from English 'number,' combined with *پیگیری* (follow-up); *بلی* is the Dari word for 'yes'."

exercises:
  prs.a2.unit09.lesson01.exercise01.recognize_vaght:
    instruction: "Which word means appointment / time slot?"
    correct_option: "appointment"
    distractors: ["document", "address", "national ID booklet"]
    accepted_answers: [{value: "appointment", status: correct}]
    feedback: "*وقت* means appointment or time slot."
  prs.a2.unit09.lesson01.exercise02.recognize_tazkira:
    instruction: "Which word means the national ID booklet?"
    correct_option: "national ID booklet"
    distractors: ["appointment", "document", "municipality"]
    accepted_answers: [{value: "national ID booklet", status: correct}]
    feedback: "*تذکره* means the national ID booklet."
  prs.a2.unit09.lesson01.exercise03.match_bureaucracy_words:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - {value: {وقت: appointment, سند: document, آدرس: address, تذکره: "national ID booklet", شاروالی: municipality}, status: correct}
    feedback: "These five words cover the basic vocabulary for this unit's office visit."
  prs.a2.unit09.lesson01.exercise04.order_sanad_address:
    instruction: "Arrange the words to say document and address."
    accepted_answers: [{value: [سند, و, آدرس], status: correct}]
    feedback: "*سند و آدرس* joins the two words with *و*."
  prs.a2.unit09.lesson01.exercise05.write_tazkira:
    instruction: "Write the Dari word for the national ID booklet."
    accepted_answers:
      - {value: تذکره, status: correct}
    feedback: "*تذکره* means the national ID booklet."

  prs.a2.unit09.lesson02.exercise01.recognize_request_appointment:
    instruction: "Which phrase politely asks to make an appointment?"
    correct_option: "I'd like to make an appointment to change my address."
    distractors: ["Because I changed my home, I need to change my address.", "Could you tell me what I should bring?", "I'll bring the rent receipt."]
    accepted_answers: [{value: "I'd like to make an appointment to change my address.", status: correct}]
    feedback: "*می‌خواستم برای تغییر آدرس وقت بگیرم.* softly requests the appointment."
  prs.a2.unit09.lesson02.exercise02.recognize_because_clause:
    instruction: "Which sentence gives a reason using because?"
    correct_option: "Because I changed my home, I need to change my address."
    distractors: ["I'd like to make an appointment to change my address.", "Could you tell me what I should bring?", "The registration deadline is by the end of this month."]
    accepted_answers: [{value: "Because I changed my home, I need to change my address.", status: correct}]
    feedback: "*چون* introduces the reason clause."
  prs.a2.unit09.lesson02.exercise03.order_what_should_i_bring:
    instruction: "Arrange the words to politely ask what you should bring."
    accepted_answers: [{value: [می‌شود, بگویید, چه, چیزی, باید, بیاورم], status: correct}]
    feedback: "*می‌شود بگویید چه چیزی باید بیاورم؟* politely asks what to bring."
  prs.a2.unit09.lesson02.exercise04.dialogue_response_why_change:
    instruction: "The clerk asks: 'Why do you need to change your address?' Answer with your reason."
    accepted_answers:
      - {value: "چون خانه‌ام را عوض کردم، باید آدرسم را عوض کنم.", status: correct}
      - {value: "چون خانه‌ام را عوض کردم باید آدرسم را عوض کنم", status: correct}
      - {value: "چون خانه‌ام را عوض کردم و باید آدرسم را عوض کنم", status: correct}
    feedback: "Joining the reason and result with a comma, no punctuation, or *و* are equally natural."
  prs.a2.unit09.lesson02.exercise05.write_appointment_request:
    instruction: "Write that you'd like to make an appointment to change your address."
    accepted_answers:
      - {value: "می‌خواستم برای تغییر آدرس وقت بگیرم.", status: correct}
      - {value: "می‌خواستم برای تغییر آدرس وقت بگیرم", status: correct}
    feedback: "*می‌خواستم برای تغییر آدرس وقت بگیرم.* is the polite request."

  prs.a2.unit09.lesson03.exercise01.read_required_documents:
    instruction: "According to the notice, what documents should you bring to register?"
    correct_option: "national ID booklet and a rent receipt"
    distractors: ["a rent receipt only", "a passport and a photo", "nothing, just your name"]
    accepted_answers: [{value: "national ID booklet and a rent receipt", status: correct}]
    feedback: "The notice asks for your *تذکره* and one *رسید کرایه خانه*."
  prs.a2.unit09.lesson03.exercise02.read_deadline:
    instruction: "According to the notice, when is the registration deadline?"
    correct_option: "by the end of this month"
    distractors: ["by the end of this week", "by the end of next month", "there is no deadline"]
    accepted_answers: [{value: "by the end of this month", status: correct}]
    feedback: "*مهلت ثبت تا آخر همین ماه است* -- the deadline is the end of this month."
  prs.a2.unit09.lesson03.exercise03.recognize_deadline_word:
    instruction: "Which word means deadline?"
    correct_option: "deadline"
    distractors: ["rent receipt", "national ID booklet", "municipality"]
    accepted_answers: [{value: "deadline", status: correct}]
    feedback: "*مهلت* means deadline."
  prs.a2.unit09.lesson03.exercise04.order_bring_documents:
    instruction: "Arrange the words to say bring the national ID booklet and a rent receipt."
    accepted_answers: [{value: [تذکره, و, یک, رسید, کرایه, خانه, بیاورید], status: correct}]
    feedback: "*تذکره و یک رسید کرایه خانه بیاورید* is the required list, matching the notice exactly."
  prs.a2.unit09.lesson03.exercise05.write_will_bring_receipt:
    instruction: "Write that you'll bring the rent receipt."
    accepted_answers:
      - {value: "رسید کرایه خانه را می‌آورم.", status: correct}
      - {value: "رسید کرایه خانه را می‌آورم", status: correct}
    feedback: "*رسید کرایه خانه را می‌آورم.* says you'll bring the rent receipt."

  prs.a2.unit09.lesson04.exercise01.comprehend_since_when:
    instruction: "Since when has کریم lived at the new house?"
    correct_option: "since last month"
    distractors: ["since last week", "since last year", "since yesterday"]
    accepted_answers: [{value: "since last month", status: correct}]
    feedback: "*از ماه گذشته* -- since last month."
  prs.a2.unit09.lesson04.exercise02.comprehend_required_documents:
    instruction: "What does the clerk say کریم needs to bring?"
    correct_option: "his national ID booklet and a rent receipt"
    distractors: ["a passport only", "a lease agreement only", "nothing at all"]
    accepted_answers: [{value: "his national ID booklet and a rent receipt", status: correct}]
    feedback: "*تذکره و یک رسید کرایه خانه کافی است* -- the national ID booklet and one rent receipt are enough."
  prs.a2.unit09.lesson04.exercise03.recognize_appointment_day:
    instruction: "کریم's appointment is for which day and time?"
    correct_option: "Tuesday at ten o'clock"
    distractors: ["Wednesday at ten o'clock", "Tuesday at nine o'clock", "Thursday at eleven o'clock"]
    accepted_answers: [{value: "Tuesday at ten o'clock", status: correct}]
    feedback: "*سه‌شنبه ساعت ده خوب است* -- Tuesday at ten o'clock works."
  prs.a2.unit09.lesson04.exercise04.order_since_when_question:
    instruction: "Arrange the words to ask since when someone has lived at their new house."
    accepted_answers: [{value: [از, کی, در, "خانهٔ", جدید, زندگی, می‌کنید], status: correct}]
    feedback: "*از کی در خانهٔ جدید زندگی می‌کنید؟* asks since when."
  prs.a2.unit09.lesson04.exercise05.dialogue_response_as_karim:
    instruction: "The clerk asks: 'Since when have you lived at the new house?' Answer as کریم, then ask what you should bring."
    accepted_answers:
      - {value: "از ماه گذشته. می‌شود بگویید چه چیزی باید بیاورم؟", status: correct}
      - {value: "از ماه گذشته، می‌شود بگویید چه چیزی باید بیاورم؟", status: correct}
      - {value: "از ماه گذشته و می‌شود بگویید چه چیزی باید بیاورم؟", status: correct}
    feedback: "Joining the answer and the follow-up question with a period, a comma, or *و* are equally natural."
  prs.a2.unit09.lesson04.exercise06.write_registry_summary:
    instruction: "Write, quoting the clerk, what documents are enough to bring."
    accepted_answers:
      - {value: "تذکره و یک رسید کرایه خانه کافی است.", status: correct}
      - {value: "تذکره و یک رسید کرایه خانه کافی است", status: correct}
    feedback: "*تذکره و یک رسید کرایه خانه کافی است.* is the clerk's own answer, quoted directly."
