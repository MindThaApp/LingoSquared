course:
  title: Dari A1
  description: 'Beginner Kabul Dari: sport and exercise vocabulary (football, volleyball, cricket, swimming), asking and answering how many times a week you exercise, saying where you play or exercise, and a Zarmina/Homayoun dialogue combining sport, frequency, and location.'
units:
  prs.a1.unit29.sports:
    title: Sports
    description: Talk about which sports or exercise you do, how often, and where.
lessons:
  prs.a1.unit29.lesson01.sport_vocabulary:
    title: Sport words
  prs.a1.unit29.lesson02.frequency_question:
    title: How many times a week?
  prs.a1.unit29.lesson03.location:
    title: Where you exercise
  prs.a1.unit29.lesson04.sports_dialogue:
    title: Sports dialogue
  prs.a1.unit29.lesson05.reading_sports:
    title: Reading about sports
  prs.a1.unit29.lesson06.wrap_up:
    title: Wrap-up
teaching:
  prs.a1.unit29.lesson01.teach.sport_word:
    title: Sport
    gloss: sport / exercise
    note: ورزش means sport or exercise, the general word covering any physical activity.
    example_gloss: Swimming is a good sport.
  prs.a1.unit29.lesson01.teach.football_word:
    title: Football
    gloss: football
    note: فوتبال means football (soccer).
    example_gloss: Football is a good sport.
  prs.a1.unit29.lesson01.teach.volleyball_word:
    title: Volleyball
    gloss: volleyball
    note: والیبال means volleyball.
    example_gloss: Volleyball is also a sport.
  prs.a1.unit29.lesson01.teach.cricket_word:
    title: Cricket
    gloss: cricket
    note: کرکت means cricket -- a genuinely popular sport specifically in Afghanistan.
    example_gloss: Cricket is a popular sport.
  prs.a1.unit29.lesson01.teach.swimming_word:
    title: Swimming
    gloss: swimming
    note: شنا means swimming.
    example_gloss: Swimming is a good sport.
  prs.a1.unit29.lesson01.teach.review_bazi_kardan:
    title: Game / to do → to play
    gloss: game / to do → I play
    note: بازی (game/play) combines with کردن (to do, review) to make بازی می‌کنم (I play) -- the same light-verb pattern already used for پیاده‌روی می‌کنم and آشپزی می‌کنم.
  prs.a1.unit29.lesson01.teach.combined_sentence:
    title: Football is a sport
    gloss: Football is a sport.
    note: Combines فوتبال، یک (a, review), ورزش, and است (is, review).
  prs.a1.unit29.lesson02.teach.review_chand:
    title: How many
    gloss: how many
    note: چند (review from unit03/unit04) is used here to ask about frequency.
  prs.a1.unit29.lesson02.teach.bar_word:
    title: Time (occurrence)
    gloss: time (as in "one time", an occurrence)
    note: بار means "time" in the sense of counting occurrences, not clock time.
    example_gloss: I swim once a week.
  prs.a1.unit29.lesson02.teach.review_dar_hafta:
    title: In / week
    gloss: in / week
    note: در (in, review) and هفته (week, review from unit04/unit09) combine to mean "per week."
  prs.a1.unit29.lesson02.teach.varzesh_mikonin:
    title: You exercise (formal)
    gloss: you exercise (formal)
    note: ورزش می‌کنین is the polite, formal form of "you exercise."
  prs.a1.unit29.lesson02.teach.question_frequency:
    title: How many times a week do you exercise?
    gloss: How many times a week do you exercise?
    note: Combines چند بار (how many times) + در هفته (per week) + ورزش می‌کنین (you exercise, formal).
  prs.a1.unit29.lesson02.teach.do_bar_answer:
    title: I play football twice a week
    gloss: I play football twice a week.
    note: دو (two, review from unit04) بار در هفته states the frequency before naming the sport and the بازی می‌کنم construction.
  prs.a1.unit29.lesson03.teach.bashgah_word:
    title: Gym
    gloss: gym
    note: باشگاه means gym or sports club.
    example_gloss: The gym is big.
  prs.a1.unit29.lesson03.teach.review_park:
    title: Park
    gloss: park
    note: پارک is review from unit13's plans lesson.
  prs.a1.unit29.lesson03.teach.dar_bashgah:
    title: At the gym
    gloss: at the gym
    note: در (in/at, review) + باشگاه.
  prs.a1.unit29.lesson03.teach.dar_park:
    title: In the park
    gloss: in the park
    note: در (in, review) + پارک (review).
  prs.a1.unit29.lesson03.teach.shena_mikonam:
    title: I swim at the gym
    gloss: I swim at the gym.
    note: Combines در باشگاه with شنا می‌کنم (I swim), the same light-verb pattern as بازی می‌کنم.
  prs.a1.unit29.lesson03.teach.futbol_park:
    title: I play football in the park
    gloss: I play football in the park.
    note: Combines در پارک with فوتبال بازی می‌کنم.
  prs.a1.unit29.lesson04.teach.review_to_miokni:
    title: You (informal) / you do (informal)
    gloss: you (informal) / you do/exercise (informal)
    note: تو (you, informal) and می‌کنی (you do, informal) are both review, used in this lesson's informal dialogue between close friends.
  prs.a1.unit29.lesson04.teach.koja_word:
    title: Where
    gloss: where
    note: کجا means "where" -- related to کجاست (review from unit05/unit06, literally "where is"), but used here on its own before a verb.
  prs.a1.unit29.lesson04.teach.review_mikonad:
    title: He/she does/plays
    gloss: he/she does/plays
    note: می‌کند is the 3rd-person form (review) of می‌کنم and می‌کنی. It is not spoken in this dialogue; it is practiced in the reading passage in the next lesson.
  prs.a1.unit29.lesson04.teach.dialogue_line1:
    title: 'Homayoun: Zarmina, how many times a week do you exercise?'
    gloss: 'Homayoun: Zarmina, how many times a week do you exercise?'
    note: An informal question between friends, using the informal می‌کنی form.
  prs.a1.unit29.lesson04.teach.dialogue_line2:
    title: 'Zarmina: I play volleyball twice a week'
    gloss: 'Zarmina: I play volleyball twice a week.'
    note: Answers with دو بار در هفته and والیبال بازی می‌کنم.
  prs.a1.unit29.lesson04.teach.dialogue_line3:
    title: 'Homayoun: Where do you play?'
    gloss: 'Homayoun: Where do you play?'
    note: Uses کجا (where), just introduced in this lesson.
  prs.a1.unit29.lesson04.teach.dialogue_line4:
    title: 'Zarmina: I play at the gym'
    gloss: 'Zarmina: I play at the gym.'
    note: A short answer using در باشگاه.
  prs.a1.unit29.lesson04.teach.dialogue_line5:
    title: 'Homayoun: I play football at the park every week'
    gloss: 'Homayoun: I play football at the park every week.'
    note: Introduces هر (every, review from unit24) combined with هفته to make هر هفته.
  prs.a1.unit29.lesson04.teach.dialogue_line6:
    title: 'Zarmina: Great!'
    gloss: 'Zarmina: Great!'
    note: عالی است (review from unit13/unit14) closes the exchange positively.
  prs.a1.unit29.lesson05.teach.reading_passage:
    title: Reading about sports
    gloss: Zarmina plays volleyball twice a week. She plays at the gym. Homayoun plays football at the park every week.
    note: A short reading passage recapping the unit's sports vocabulary, introducing می‌کند (does, 3rd person, review) and او (he/she, review) applied to the two established characters.
  prs.a1.unit29.lesson06.teach.review_ama:
    title: But
    gloss: but
    note: اما means but (review from earlier units).
  prs.a1.unit29.lesson06.teach.review_like_have_time:
    title: I like / time / I don't have
    gloss: I like / time / I don't have
    note: دوست دارم (I like, review from unit14/unit26), وقت (time, review from unit11/unit26), and ندارم (I don't have, review from unit03/unit28) combine for the wrap-up sentence.
  prs.a1.unit29.lesson06.teach.wrap_summary:
    title: I like football, but I don't have time
    gloss: "I like football, but I don't have time."
    note: Combines a preference and a constraint using اما, giving وقت ندارم a real payoff.
