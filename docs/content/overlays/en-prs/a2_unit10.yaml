course:
  title: Dari A2
  description: >-
    Lower-intermediate Afghan Dari: giving an opinion with a reason,
    reading a written opinion, and responding to someone else's
    contrasting opinion -- a debate between two students about studying
    abroad.

units:
  prs.a2.unit10.opinions:
    title: Sharing opinions

lessons:
  prs.a2.unit10.lesson01.opinions_vocabulary: {title: "Words for sharing an opinion"}
  prs.a2.unit10.lesson02.giving_an_opinion: {title: "Giving an opinion with a reason"}
  prs.a2.unit10.lesson03.reading_an_opinion_message: {title: "Reading a written opinion"}
  prs.a2.unit10.lesson04.study_debate_dialogue: {title: "Responding to a different opinion"}

teaching:
  prs.a2.unit10.lesson01.teach.nazar_word:
    title: "Opinion"
    gloss: "opinion"
    note: "*نظر* is the general word for an opinion or view."
  prs.a2.unit10.lesson01.teach.dalil_word:
    title: "Reason"
    gloss: "reason"
    note: "*دلیل* is the general word for a reason."
  prs.a2.unit10.lesson01.teach.study_word:
    title: "Study"
    gloss: "study / education"
    note: "*تحصیل* is the general word for study or education."
  prs.a2.unit10.lesson01.teach.abroad_word:
    title: "Abroad"
    gloss: "abroad"
    note: "*خارج* is the everyday word for abroad, a common contemporary topic among young Afghans."
  prs.a2.unit10.lesson01.teach.homeland_word:
    title: "Homeland"
    gloss: "homeland / home country"
    note: "*وطن* is the general word for one's homeland or home country."
  prs.a2.unit10.lesson01.teach.va_word:
    title: "And"
    gloss: "and"
    note: "*و* is the common connecting word used throughout this unit."

  prs.a2.unit10.lesson02.teach.in_my_opinion_better:
    title: "State an opinion"
    gloss: "In my opinion, studying abroad is better."
    note: "*به نظر من ...* (in my opinion...) is the standard way to introduce an opinion."
  prs.a2.unit10.lesson02.teach.because_universities_jobs:
    title: "Give a reason with چون (because)"
    gloss: "Because it has better universities and more job opportunities."
    note: "*چون* ('because') introduces the supporting reason."
  prs.a2.unit10.lesson02.teach.full_opinion_with_reason:
    title: "Combine the opinion and the reason"
    gloss: "In my opinion, studying abroad is better, because it has better universities and more job opportunities."
    note: "This is the full *به نظر من ... چون ...* pattern: an opinion followed by its reason."

  prs.a2.unit10.lesson03.teach.message_word:
    title: "Message"
    gloss: "message"
    note: "*پیام* is the general word for a message, spoken or written."
  prs.a2.unit10.lesson03.teach.family_word:
    title: "Family"
    gloss: "family"
    note: "*فامیل* is the everyday Dari word for family."
  prs.a2.unit10.lesson03.teach.message_text:
    title: "A written message giving an opinion"
    gloss: "In my opinion, studying abroad is much better, because it has better universities and more job opportunities, and I can gain new experience."
    note: "A short written opinion with two reasons joined by *و* (and), the written style this unit is teaching."

  prs.a2.unit10.lesson04.teach.i_dont_think_so:
    title: "Disagree politely"
    gloss: "I don't think so."
    note: "*من فکر نمی‌کنم* is a plain, polite way to disagree -- not rude, just direct."
  prs.a2.unit10.lesson04.teach.turn01:
    title: "پروین states her opinion"
    gloss: "پروین says in her opinion, studying abroad is better."
    note: "The same *به نظر من ... بهتر است* pattern for stating an opinion."
  prs.a2.unit10.lesson04.teach.turn02:
    title: "احمد disagrees"
    gloss: "احمد says he doesn't think so."
    note: "*من فکر نمی‌کنم* from earlier in this lesson."
  prs.a2.unit10.lesson04.teach.turn03:
    title: "پروین asks why"
    gloss: "پروین asks why."
    note: "*چرا؟* is the everyday word for 'why?'."
  prs.a2.unit10.lesson04.teach.turn04:
    title: "احمد gives his reasons"
    gloss: "احمد says he wants to stay near his family, and he thinks he can help his homeland more by staying."
    note: "Two reasons joined with *و* (and)."
  prs.a2.unit10.lesson04.teach.turn05:
    title: "پروین concedes but restates her reason"
    gloss: "پروین says that's true, but in her opinion there are more job opportunities abroad."
    note: "*درست است، ولی...* (that's true, but...) politely concedes a point before restating your own."
  prs.a2.unit10.lesson04.teach.turn06:
    title: "احمد acknowledges but holds his position"
    gloss: "احمد says maybe, but he'll stay right here."
    note: "*شاید، ولی...* (maybe, but...) softly acknowledges the other person's point without changing his mind."

exercises:
  prs.a2.unit10.lesson01.exercise01.recognize_nazar:
    instruction: "What does this word mean?"
    correct_option: "opinion"
    distractors: ["reason", "study", "abroad"]
    accepted_answers: [{value: "opinion", status: correct}]
    feedback: "*نظر* means opinion."
  prs.a2.unit10.lesson01.exercise02.recognize_abroad:
    instruction: "What does this word mean?"
    correct_option: "abroad"
    distractors: ["opinion", "homeland", "reason"]
    accepted_answers: [{value: "abroad", status: correct}]
    feedback: "*خارج* means abroad."
  prs.a2.unit10.lesson01.exercise03.match_opinions_words:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - {value: {نظر: opinion, دلیل: reason, تحصیل: study, خارج: abroad, وطن: homeland}, status: correct}
    feedback: "These five words cover this unit's basic opinions vocabulary."
  prs.a2.unit10.lesson01.exercise04.order_nazar_dalil:
    instruction: "Arrange the words to say opinion and reason."
    accepted_answers: [{value: [نظر, و, دلیل], status: correct}]
    feedback: "*نظر و دلیل* joins the two words with *و*."
  prs.a2.unit10.lesson01.exercise05.write_abroad:
    instruction: "Write the Dari word for abroad."
    accepted_answers:
      - {value: خارج, status: correct}
    feedback: "*خارج* means abroad."

  prs.a2.unit10.lesson02.exercise01.recognize_opinion_phrase:
    instruction: "Which phrase states an opinion?"
    correct_option: "In my opinion, studying abroad is better."
    distractors: ["Because it has better universities and more job opportunities.", "I don't think so.", "I can gain new experience."]
    accepted_answers: [{value: "In my opinion, studying abroad is better.", status: correct}]
    feedback: "*به نظر من تحصیل در خارج بهتر است.* states the opinion."
  prs.a2.unit10.lesson02.exercise02.order_because_universities:
    instruction: "Arrange the words to give the reason: because it has better universities and more job opportunities."
    accepted_answers: [{value: [چون, "پوهنتون‌های", بهتر, و, فرصت, کار, بیشتر, دارد], status: correct}]
    feedback: "*چون پوهنتون‌های بهتر و فرصت کار بیشتر دارد.* gives the reason."
  prs.a2.unit10.lesson02.exercise03.dialogue_response_which_better:
    instruction: "Someone asks: 'In your opinion, is studying abroad better, or in the homeland?' Answer that studying abroad is better, and give the reason: better universities and more job opportunities."
    accepted_answers:
      - {value: "به نظر من تحصیل در خارج بهتر است، چون پوهنتون‌های بهتر و فرصت کار بیشتر دارد.", status: correct}
      - {value: "به نظر من تحصیل در خارج بهتر است چون پوهنتون‌های بهتر و فرصت کار بیشتر دارد", status: correct}
      - {value: "به نظر من تحصیل در خارج بهتر است. چون پوهنتون‌های بهتر و فرصت کار بیشتر دارد.", status: correct}
    feedback: "Joining the opinion and the reason with a period, a comma, or with no punctuation at all, are all equally natural -- *چون* already does the joining work, so it never takes an *و* in front of it."
  prs.a2.unit10.lesson02.exercise04.translate_opinion_with_reason:
    instruction: "Translate into Dari: In my opinion, studying abroad is better, because it has better universities and more job opportunities."
    accepted_answers:
      - {value: "به نظر من تحصیل در خارج بهتر است، چون پوهنتون‌های بهتر و فرصت کار بیشتر دارد.", status: correct}
      - {value: "به نظر من تحصیل در خارج بهتر است چون پوهنتون‌های بهتر و فرصت کار بیشتر دارد", status: correct}
      - {value: "به نظر من تحصیل در خارج بهتر است. چون پوهنتون‌های بهتر و فرصت کار بیشتر دارد.", status: correct}
    feedback: "*به نظر من تحصیل در خارج بهتر است، چون پوهنتون‌های بهتر و فرصت کار بیشتر دارد.* is the full opinion-plus-reason sentence (a period instead of a comma before *چون* is equally natural)."
  prs.a2.unit10.lesson02.exercise05.write_opinion_with_reason:
    instruction: "Write that in your opinion studying abroad is better, because it has better universities and more job opportunities."
    accepted_answers:
      - {value: "به نظر من تحصیل در خارج بهتر است، چون پوهنتون‌های بهتر و فرصت کار بیشتر دارد.", status: correct}
      - {value: "به نظر من تحصیل در خارج بهتر است چون پوهنتون‌های بهتر و فرصت کار بیشتر دارد", status: correct}
      - {value: "به نظر من تحصیل در خارج بهتر است. چون پوهنتون‌های بهتر و فرصت کار بیشتر دارد.", status: correct}
    feedback: "*به نظر من تحصیل در خارج بهتر است، چون پوهنتون‌های بهتر و فرصت کار بیشتر دارد.* is the accepted opinion-plus-reason sentence (a period instead of a comma before *چون* is equally natural)."

  prs.a2.unit10.lesson03.exercise01.read_her_opinion:
    instruction: "What is the message writer's opinion about studying abroad?"
    correct_option: "Studying abroad is much better."
    distractors: ["Studying abroad is a little worse.", "The writer has no opinion.", "Studying in the homeland is much better."]
    accepted_answers: [{value: "Studying abroad is much better.", status: correct}]
    feedback: "*به نظر من تحصیل در خارج خیلی بهتر است* -- in the writer's opinion, studying abroad is much better."
  prs.a2.unit10.lesson03.exercise02.read_her_second_reason:
    instruction: "Besides universities and job opportunities, what other reason does the writer give?"
    correct_option: "The writer can gain new experience."
    distractors: ["The writer dislikes the homeland.", "The writer wants to learn a new language.", "The writer already has family abroad."]
    accepted_answers: [{value: "The writer can gain new experience.", status: correct}]
    feedback: "*می‌توانم تجربهٔ نو کسب کنم* -- the writer can gain new experience."
  prs.a2.unit10.lesson03.exercise03.recognize_message_word:
    instruction: "What does this word mean?"
    correct_option: "message"
    distractors: ["family", "homeland", "opinion"]
    accepted_answers: [{value: "message", status: correct}]
    feedback: "*پیام* means message."
  prs.a2.unit10.lesson03.exercise04.order_gain_new_experience:
    instruction: "Arrange the words to say I can gain new experience."
    accepted_answers: [{value: [می‌توانم, "تجربهٔ", نو, کسب, کنم], status: correct}]
    feedback: "*می‌توانم تجربهٔ نو کسب کنم* says you can gain new experience."
  prs.a2.unit10.lesson03.exercise05.write_own_reply:
    instruction: "Write your own opinion: in your opinion, studying abroad is better."
    accepted_answers:
      - {value: "به نظر من تحصیل در خارج بهتر است.", status: correct}
      - {value: "به نظر من تحصیل در خارج بهتر است", status: correct}
    feedback: "*به نظر من تحصیل در خارج بهتر است.* states this opinion."

  prs.a2.unit10.lesson04.exercise01.comprehend_ahmad_opinion:
    instruction: "Does احمد agree with پروین's opinion about studying abroad?"
    correct_option: "No, he disagrees."
    distractors: ["Yes, he agrees completely.", "He has no opinion.", "He agrees, but only about universities."]
    accepted_answers: [{value: "No, he disagrees.", status: correct}]
    feedback: "*من فکر نمی‌کنم.* -- احمد says he doesn't think so."
  prs.a2.unit10.lesson04.exercise02.comprehend_ahmad_reason:
    instruction: "What reasons does احمد give for wanting to stay?"
    correct_option: "He wants to stay near family, and he thinks he can help his homeland more by staying."
    distractors: ["He dislikes traveling.", "He wants better universities.", "He has no money to travel."]
    accepted_answers: [{value: "He wants to stay near family, and he thinks he can help his homeland more by staying.", status: correct}]
    feedback: "*چون می‌خواهم نزدیک فامیلم بمانم و فکر می‌کنم می‌توانم به وطنم بیشتر کمک کنم* -- stay near family, and help his homeland more."
  prs.a2.unit10.lesson04.exercise03.recognize_who_prefers_what:
    instruction: "Who prefers studying abroad, and who prefers staying in the homeland?"
    correct_option: "پروین prefers studying abroad; احمد prefers staying in the homeland."
    distractors: ["احمد prefers studying abroad; پروین prefers staying in the homeland.", "Both prefer studying abroad.", "Both prefer staying in the homeland."]
    accepted_answers: [{value: "پروین prefers studying abroad; احمد prefers staying in the homeland.", status: correct}]
    feedback: "پروین opens with *به نظر من تحصیل در خارج بهتر است*; احمد disagrees and explains why he prefers to stay."
  prs.a2.unit10.lesson04.exercise04.order_i_dont_think_so:
    instruction: "Arrange the words to say I don't think so."
    accepted_answers: [{value: [من, فکر, نمی‌کنم], status: correct}]
    feedback: "*من فکر نمی‌کنم.* says you don't think so."
  prs.a2.unit10.lesson04.exercise05.dialogue_response_as_parwin:
    instruction: "احمد just explained his reasons: 'Because I want to stay near my family, and I think I can help my homeland more by staying.' Respond as پروین: concede the point, but restate that in your opinion there are more job opportunities abroad."
    accepted_answers:
      - {value: "درست است، ولی به نظر من فرصت کار در خارج بیشتر است.", status: correct}
      - {value: "درست است ولی به نظر من فرصت کار در خارج بیشتر است", status: correct}
      - {value: "درست است. ولی به نظر من فرصت کار در خارج بیشتر است.", status: correct}
    feedback: "*درست است، ولی...* politely concedes before restating your own point -- a period, a comma, or no punctuation at all before *ولی* are all equally natural pauses, not a hard requirement."
  prs.a2.unit10.lesson04.exercise06.write_debate_summary:
    instruction: "Write پروین's opinion that studying abroad is better, then احمد's reply \"I don't think so.\""
    accepted_answers:
      - {value: "به نظر من تحصیل در خارج بهتر است. من فکر نمی‌کنم.", status: correct}
      - {value: "به نظر من تحصیل در خارج بهتر است، من فکر نمی‌کنم", status: correct}
      - {value: "به نظر من تحصیل در خارج بهتر است و من فکر نمی‌کنم", status: correct}
    feedback: "پروین's own opinion (*به نظر من تحصیل در خارج بهتر است.*) followed by احمد's own disagreement (*من فکر نمی‌کنم.*), quoted directly -- joining them with a period, a comma, or *و* are equally natural."
