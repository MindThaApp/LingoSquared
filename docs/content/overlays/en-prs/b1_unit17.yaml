teaching:
  prs.b1.unit17.lesson01.teach.dars:
    title: Lesson / study
    gloss: lesson / study
    note: درس means lesson; درس خواندن means to study.
    example_gloss: I study every day.
  prs.b1.unit17.lesson01.teach.grammar:
    title: Should have
    gloss: باید + می‌خواندم
    note: 'To say what you should have done, use باید + the imperfect past: باید بیشتر درس می‌خواندم (I should have studied more). Compare the present باید بیشتر درس بخوانم (I must study more).'
  prs.b1.unit17.lesson01.teach.imtihan:
    title: Exam
    gloss: exam
    note: امتحان means exam.
    example_gloss: The exam is tomorrow.
  prs.b1.unit17.lesson01.teach.mikhandam:
    title: I used to study
    gloss: I used to study
    note: 'می‌خواندم is the imperfect past of خواندن: I studied or I was studying.'
    example_gloss: I used to study every day.
  prs.b1.unit17.lesson01.teach.mikhand:
    title: He/she used to study
    gloss: he/she used to study
    note: می‌خواند is the 3rd person imperfect past of خواندن.
    example_gloss: Zarmina used to study every day.
  prs.b1.unit17.lesson01.teach.bishtar:
    title: More
    gloss: more
    note: بیشتر means more.
    example_gloss: I must work more.
  prs.b1.unit17.lesson01.teach.bayad‌mikhandam:
    title: I should have studied
    gloss: I should have studied
    note: باید + the imperfect past (می‌خواندم) says what you should have done in the past.
    example_gloss: I should have studied more.
  prs.b1.unit17.lesson02.teach.kash:
    title: I wish / if only
    gloss: I wish / if only
    note: کاش expresses a wish.
    example_gloss: I wish I had time today.
  prs.b1.unit17.lesson02.teach.grammar:
    title: Past wishes
    gloss: کاش + خوانده بودم
    note: 'To express a wish about the past, use کاش + the past perfect: کاش بیشتر درس خوانده بودم (I wish I had studied more). The past perfect is the past participle (خوانده) + بودم.'
  prs.b1.unit17.lesson02.teach.khanda‌budam:
    title: I had studied
    gloss: I had studied
    note: 'خوانده بودم is the past perfect: I had studied.'
    example_gloss: I wish I had studied.
  prs.b1.unit17.lesson02.teach.amada‌budam:
    title: I had come
    gloss: I had come
    note: 'آمده بودم is the past perfect of آمدن: I had come.'
    example_gloss: I wish I had come earlier.
  prs.b1.unit17.lesson02.teach.zood:
    title: Earlier
    gloss: earlier
    note: زودتر means earlier or sooner.
    example_gloss: I wish I had come earlier.
  prs.b1.unit17.lesson03.teach.agar‌budam:
    title: If I had studied
    gloss: if I had studied
    note: اگر + the past perfect gives the unreal past condition.
    example_gloss: If I had studied, I would have passed the exam.
  prs.b1.unit17.lesson03.teach.grammar:
    title: What would have been different
    gloss: اگر ... خوانده بودم، ... می‌گذراندم
    note: 'To say what would have been different, put اگر + the past perfect in the condition and the imperfect past in the result: اگر بیشتر درس خوانده بودم، امتحان را می‌گذراندم (if I had studied more, I would have passed the exam). The real past is: امتحان را نگذراندم (I did not pass the exam).'
  prs.b1.unit17.lesson03.teach.migozarandam:
    title: I would have passed
    gloss: I would have passed
    note: 'می‌گذراندم is the imperfect past of گذراندن (to pass): the result clause says "I would have passed".'
    example_gloss: If I had studied, I would have passed the exam.
  prs.b1.unit17.lesson03.teach.nagozarandam:
    title: I did not pass
    gloss: I did not pass
    note: 'نگذراندم is the negative simple past: I did not pass.'
    example_gloss: Unfortunately I did not pass the exam.
  prs.b1.unit17.lesson03.teach.nagozarand:
    title: Did not pass
    gloss: did not pass
    note: نگذراند is the 3rd person negative simple past of گذراندن.
    example_gloss: He or she did not pass the exam.
  prs.b1.unit17.lesson03.teach.motasefana:
    title: Unfortunately
    gloss: unfortunately
    note: متأسفانه means unfortunately.
    example_gloss: Unfortunately I did not pass the exam.
  prs.b1.unit17.lesson04.teach.dafa:
    title: Next time
    gloss: next time
    note: دفعه‌ی بعد means next time.
    example_gloss: Next time I will come earlier.
  prs.b1.unit17.lesson04.teach.hatman:
    title: Certainly
    gloss: certainly
    note: حتماً means certainly.
    example_gloss: I will certainly come.
  prs.b1.unit17.lesson04.teach.dialogue01:
    title: Zarmina, how did the exam go?
    gloss: Zarmina, how did the exam go?
    note: Homayoun asks about the exam.
  prs.b1.unit17.lesson04.teach.dialogue02:
    title: It did not go well. Unfortunately I did not pass.
    gloss: It did not go well. Unfortunately I did not pass.
    note: Zarmina says she did not pass.
  prs.b1.unit17.lesson04.teach.dialogue03:
    title: Why?
    gloss: Why?
    note: Homayoun asks why.
  prs.b1.unit17.lesson04.teach.dialogue04:
    title: I should have studied more. I wish I had studied more.
    gloss: I should have studied more. I wish I had studied more.
    note: 'Zarmina gives two regrets: باید می‌خواندم and کاش ... خوانده بودم.'
  prs.b1.unit17.lesson04.teach.dialogue05:
    title: If you had studied more, you would certainly have passed.
    gloss: If you had studied more, you would certainly have passed.
    note: Homayoun says what would have been different.
  prs.b1.unit17.lesson04.teach.dialogue06:
    title: Yes. Next time I will study more.
    gloss: Yes. Next time I will study more.
    note: Zarmina decides what to do next time.
  prs.b1.unit17.lesson05.teach.afsos:
    title: Regrets
    gloss: regrets
    note: افسوس خوردن means to regret; افسوس می‌خورد is the 3rd person present.
    example_gloss: Zarmina regrets it.
  prs.b1.unit17.lesson05.teach.migozarand:
    title: Would pass
    gloss: would pass
    note: 'می‌گذراند is the 3rd person imperfect past: he or she would pass.'
    example_gloss: He or she would certainly pass the exam.
  prs.b1.unit17.lesson05.teach.khanda‌bood:
    title: Had studied
    gloss: had studied
    note: 'خوانده بود is the 3rd person past perfect: he or she had studied.'
    example_gloss: If Zarmina had studied more, she would have passed the exam.
  prs.b1.unit17.lesson05.teach.reading:
    title: Zarmina's regret
    gloss: Zarmina did not pass the exam. She regrets it, because she did not study more. She thinks that if she had studied more, she would have passed the exam. Next time she will study more.
    note: 'A regret told in the third person: the past perfect (خوانده بود) in the condition and the imperfect past (می‌گذراند) in the result, plus a resolution for next time.'
  prs.b1.unit17.lesson06.teach.grammar:
    title: 'Review: regrets'
    gloss: باید می‌خواندم؛ کاش ...؛ اگر ... بودم
    note: 'Review: should have = باید + می‌خواندم; wish = کاش + خوانده بودم; what would have been different = اگر + خوانده بودم، ... می‌گذراندم.'
  prs.b1.unit17.lesson06.teach.r‌kar:
    title: Work
    gloss: work
    note: کار means work.
    example_gloss: I have a lot of work today.
  prs.b1.unit17.lesson06.teach.r‌waqt:
    title: Time
    gloss: time
    note: وقت means time.
    example_gloss: I have no time today.
