course:
  title: Dari B1
  description: 'Intermediate Kabul Dari: expressing regret and past wishes with باید ... می‌خواندم, کاش ... بودم, and the past conditional.'
units:
  prs.b1.unit17.regrets:
    title: Regrets and past wishes
    description: Say what you should have done, what you wish had happened, and what would have been different.
lessons:
  prs.b1.unit17.lesson01.should‌have:
    title: I should have...
  prs.b1.unit17.lesson02.i‌wish:
    title: I wish...
  prs.b1.unit17.lesson03.would‌have‌been:
    title: If I had..., I would have...
