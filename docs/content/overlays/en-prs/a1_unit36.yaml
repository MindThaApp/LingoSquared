teaching:
  prs.a1.unit36.lesson01.teach.kitchen_word:
    title: Kitchen
    gloss: kitchen
    note: "آشپزخانه is the standard Dari word for a kitchen."
    example_gloss: Today I am in the kitchen.
  prs.a1.unit36.lesson01.teach.food_word:
    title: Food
    gloss: food / a meal
    note: "غذا means food or a meal in general, distinct from a specific dish like پلو."
    example_gloss: The food is delicious.
  prs.a1.unit36.lesson01.teach.onion_word:
    title: Onion
    gloss: onion
    note: "پیاز is the common Dari word for onion, used constantly in Afghan cooking."
    example_gloss: The onion is fresh.
  prs.a1.unit36.lesson01.teach.meat_word:
    title: Meat
    gloss: meat
    note: "گوشت means meat."
    example_gloss: The meat is fresh.
  prs.a1.unit36.lesson01.teach.review_basics:
    title: "Review: one, want, in, am"
    gloss: one/a / I want / in or at / I am
    note: "یک, می‌خواهم, در, and هستم are review forms used in this unit's cooking sentences."
  prs.a1.unit36.lesson01.teach.cook_food_phrase:
    title: I cook food
    gloss: I cook food.
    note: "می‌پزم is the first-person present form of پختن, to cook."
  prs.a1.unit36.lesson01.teach.in_kitchen_phrase:
    title: I am in the kitchen
    gloss: I am in the kitchen.
    note: "هستم is the first-person form of the copula, used here with در for location."
  prs.a1.unit36.lesson02.teach.salt_word:
    title: Salt
    gloss: salt
    note: "نمک means salt."
    example_gloss: I want salt.
  prs.a1.unit36.lesson02.teach.rice_grain_word:
    title: Rice
    gloss: rice
    note: "برنج is uncooked rice (the grain), distinct from پلو, the cooked rice dish taught in the food unit."
    example_gloss: I cook rice.
  prs.a1.unit36.lesson02.teach.review_do_cut:
    title: "Review: I do, cut"
    gloss: I do / cut, chopped
    note: "می‌کنم is review; خرد is new and combines with کردن-forms to mean chop or cut."
  prs.a1.unit36.lesson02.teach.chop_onion_phrase:
    title: I chop the onion
    gloss: I chop the onion.
    note: "خرد می‌کنم literally means I make it cut/chopped — a standard compound verb pattern."
  prs.a1.unit36.lesson02.teach.add_salt_phrase:
    title: I add salt
    gloss: I add salt.
    note: "می‌اندازم (from انداختن, to throw/put in) is the natural Dari verb for adding an ingredient."
  prs.a1.unit36.lesson02.teach.cook_meat_phrase:
    title: I cook meat
    gloss: I cook meat.
    note: "Swap گوشت for برنج to name a different food being cooked."
  prs.a1.unit36.lesson03.teach.review_first_then:
    title: "Review: first, then"
    gloss: first / then
    note: "اول and بعد are review words used to sequence cooking steps."
  prs.a1.unit36.lesson03.teach.review_water_hot:
    title: "Review: water, hot"
    gloss: water / hot
    note: "آب and گرم are review words from earlier units."
  prs.a1.unit36.lesson03.teach.pour_word:
    title: I pour
    gloss: I pour
    note: "می‌ریزم (from ریختن, to pour) is the natural verb for adding a liquid, distinct from می‌اندازم used for solid ingredients."
    example_gloss: I pour water.
  prs.a1.unit36.lesson03.teach.first_chop_phrase:
    title: First I chop the onion
    gloss: First I chop the onion.
    note: "اول marks the first step in a sequence."
  prs.a1.unit36.lesson03.teach.then_cook_meat_phrase:
    title: Then I cook the meat
    gloss: Then I cook the meat.
    note: "بعد marks the next step in a sequence."
  prs.a1.unit36.lesson03.teach.pour_hot_water_phrase:
    title: I pour hot water
    gloss: I pour hot water.
    note: "Combines گرم (hot) with می‌ریزم (I pour)."
  prs.a1.unit36.lesson04.teach.review_dialogue_words:
    title: Hello / yes / please / okay / thanks / stew / delicious / is
    gloss: hello / yes / please / okay, sure / thanks / stew / delicious / is
    note: "سلام, بلی, لطفاً, چشم, تشکر, قورمه, خوش‌مزه, and است are review words used in the kitchen dialogue."
  prs.a1.unit36.lesson04.teach.dialogue_line1:
    title: "Nadia: Hello, what are you cooking?"
    gloss: Hello, what are you cooking?
    note: "چی می‌پزین؟ uses the formal you-form می‌پزین."
  prs.a1.unit36.lesson04.teach.dialogue_line2:
    title: "Farid: I'm cooking qorma."
    gloss: I'm cooking qorma.
  prs.a1.unit36.lesson04.teach.dialogue_line3:
    title: "Nadia: Shall I help?"
    gloss: Shall I help?
    note: "کمک می‌کنم؟ literally asks Do I help?, a natural way to offer help."
  prs.a1.unit36.lesson04.teach.dialogue_line4:
    title: "Farid: Yes, please chop the onion."
    gloss: Yes, please chop the onion.
    note: "کنین is the formal imperative form, chop!"
  prs.a1.unit36.lesson04.teach.dialogue_line5:
    title: "Nadia: Sure."
    gloss: Sure.
  prs.a1.unit36.lesson04.teach.dialogue_line6:
    title: "Farid: Thanks, the food will be delicious."
    gloss: Thanks, the food is delicious.
  prs.a1.unit36.lesson05.teach.review_he_she_words:
    title: He/she, in, does, cooks, very, happy, is
    gloss: he/she / in or at / he/she does / he/she cooks / very / happy / is
    note: "او is the Dari pronoun for he or she; می‌کند and می‌پزد are the third-person forms of the verbs used earlier in this unit."
  prs.a1.unit36.lesson05.teach.reading_passage:
    title: Reading about Nadia cooking
    gloss: "Nadia is in the kitchen. She chops the onion. Then she cooks the meat. The food is very delicious. Nadia is happy."
