course:
  title: Dari A1
  description: "Beginner Kabul Dari: name kitchen items and ingredients, describe cooking actions, follow simple cooking steps, and talk about preparing a meal."
units:
  prs.a1.unit36.cooking:
    title: Cooking
    description: Name basic kitchen actions, describe preparing food, and follow or give simple cooking instructions.
lessons:
  prs.a1.unit36.lesson01.cooking_words:
    title: Cooking words
  prs.a1.unit36.lesson02.cooking_actions:
    title: Cooking actions
