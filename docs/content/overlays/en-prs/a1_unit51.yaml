  notes: "Authored with prs a1_unit51_restaurant.yaml for en-prs only. A fresh keyword search (Unicode-normalized, since raw pdftotext output uses Arabic presentation-form glyphs) was run this task against the locally cached DLI Dari corpus (Semester 1 student books) for restaurant/waiter/menu/kabob terms. This found a genuine, dedicated hit: DLI Dari Semester 1's own Lesson 13, 'In a Restaurant,' with a real lesson-vocabulary list confirming کباب ('kabob'), رستوران ('restaurant'), مینو ('menu', glossed لست غذا), and پیشخدمت ('waiter') as authentic Dari vocabulary for this scenario, plus فرمایش ('order') attested via the vocabulary entry 'فرمایش دادن' (to order) and two model exchanges. Per AUTHORING_GUIDE.md #10, used as a vocabulary scaffold only, not imported verbatim -- the source's own grammar targets (reflexive pronouns, the Let's-construction) are past A1 and unused, and its two model dialogues use contracted colloquial forms (فرمایش بتین) inconsistent with this course's established uncontracted register, so this unit builds a clean 'فرمایش شما چیست؟' by extending this course's own already-established چیست question pattern instead of copying the source's contracted phrasing. Deliberately differentiated from unit08's existing food.order_simple_meal outcome: this is a sit-down رستوران scenario with its own waiter role (پیشخدمت, distinct from unit08's چایخانه دکاندار/مشتری roles), a genuine two-dish menu with per-item prices (unit08 only ever had one bundled meal total), and a bill REQUEST as an imperative action (بل را بیارین) rather than unit08's bill-amount QUESTION (بل چند می‌شه؟). Three new words beyond the four DLI-attested nouns: بیارین (bring, the same already-established polite -ین imperative family this course already uses, applied to a new verb stem) and فرمایش (order, DLI-attested as described above). Deliberately kept the kabob price (150 afghanis) and the tea price (20 afghanis) as two independent facts, and the dialogue's single-item order means its stated bill exactly equals the kabob's own already-stated menu price rather than requiring any arithmetic sum. No bare Yes/No/True/False/On/Off gloss values exist anywhere in this unit. Dialogue content uses structured speakers in the realization, not embedded speaker labels. This task did not open any fa/a1_unit* file at any point -- fa and prs are separate realizations per universal_spine.yaml's own explicit invariant, and every vocabulary/register choice here was made independently."
