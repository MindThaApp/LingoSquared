course:
  title: Dari A2
  description: >-
    Lower-intermediate Afghan Dari: describing a weekly schedule —
    sequencing connectors, contrasting weekdays with the weekend, reading
    a weekly comparison, and a real conversation between two friends
    about their own weeks.

units:
  prs.a2.unit17.weekly_schedule:
    title: Weekly schedule

lessons:
  prs.a2.unit17.lesson01.weekly_schedule_vocabulary: {title: "Words for a weekly schedule"}
  prs.a2.unit17.lesson02.describing_a_weekday: {title: "Describing a weekday"}
  prs.a2.unit17.lesson03.reading_a_weekly_comparison: {title: "Reading a weekly comparison"}
  prs.a2.unit17.lesson04.friends_dialogue: {title: "A conversation between friends"}

teaching:
  prs.a2.unit17.lesson01.teach.week_word:
    title: "Week"
    gloss: "week"
    note: "*هفته* means week."
    example_gloss: "I'm very busy this week."
  prs.a2.unit17.lesson01.teach.weekend_word:
    title: "Weekend"
    gloss: "weekend"
    note: "*آخر هفته* literally means 'end of the week'."
    example_gloss: "I rest on the weekend."
  prs.a2.unit17.lesson01.teach.schedule_word:
    title: "Schedule"
    gloss: "schedule"
    note: "*برنامه* is used for a schedule, plan, or program."
    example_gloss: "My weekly schedule is busy."
  prs.a2.unit17.lesson01.teach.first_word:
    title: "First"
    gloss: "first"
    note: "*اول* opens a sequence of steps."
    example_gloss: "First I have breakfast."
  prs.a2.unit17.lesson01.teach.then_word:
    title: "Then"
    gloss: "then"
    note: "*بعد* continues a sequence after *اول*."
    example_gloss: "Then I go to the office."
  prs.a2.unit17.lesson01.teach.finally_word:
    title: "Finally"
    gloss: "finally"
    note: "*در آخر* closes a sequence -- *آخر ... اول ... بعد ... در آخر* is this unit's A2-level sequencing pattern."
    example_gloss: "Finally I study a little."
  prs.a2.unit17.lesson01.teach.sequence_grammar:
    title: "A full sequenced sentence"
    gloss: "On weekdays, first I go to the office, then I exercise, and finally I study a little."
    note: "*اول ... بعد ... و در آخر* sequences three activities in one sentence -- this unit's core A2-level grammar step."
  prs.a2.unit17.lesson01.teach.days_word:
    title: "Weekdays"
    gloss: "weekdays"
    note: "*روزهای هفته* -- literally 'the days of the week' -- means weekdays, contrasted with *آخر هفته*."
    example_gloss: "On weekdays I'm busy with work."

  prs.a2.unit17.lesson02.teach.ask_weekly_schedule:
    title: "Ask about someone's weekly schedule"
    gloss: "What's your weekly schedule like?"
    note: "*تو* is the informal 'you' used between friends."
  prs.a2.unit17.lesson02.teach.weekday_full_sentence:
    title: "Describe a weekday sequence"
    gloss: "On weekdays first I go to the office, then I exercise."
    note: "Reuses lesson01's sequencing pattern with *اول* and *بعد*."
  prs.a2.unit17.lesson02.teach.weekend_activity:
    title: "Describe a weekend activity"
    gloss: "On the weekend I sleep in and spend time with my family."
    note: "*دیر بیدار می‌شوم* -- 'I wake up late' -- contrasts directly with the early weekday wake-up in lesson03's reading."

  prs.a2.unit17.lesson03.teach.difference_word:
    title: "Difference"
    gloss: "difference"
    note: "*تفاوت* means difference."
    example_gloss: "There's a big difference between weekdays and the weekend."
  prs.a2.unit17.lesson03.teach.rest_word:
    title: "To rest"
    gloss: "to rest"
    note: "*استراحت کردن* means to rest or relax."
    example_gloss: "I rest on the weekend."
  prs.a2.unit17.lesson03.teach.comparison_text:
    title: "A short comparison of همایون's week"
    gloss: "On weekdays, همایون wakes up early and goes to the office. But on the weekend, he wakes up late and rests."
    note: "A short descriptive text contrasting weekday and weekend routines, in the reading register this unit is teaching."

  prs.a2.unit17.lesson04.teach.turn01:
    title: "زرمینه asks about همایون's week"
    gloss: "زرمینه asks what his weekly schedule is like."
    note: "Reuses lesson02's exact question, and the informal *تو*-register already established for this friend pair."
  prs.a2.unit17.lesson04.teach.turn02:
    title: "همایون describes his weekdays"
    gloss: "On weekdays first he goes to the office, then he exercises."
    note: "Reuses lesson02's exact sentence."
  prs.a2.unit17.lesson04.teach.turn03:
    title: "زرمینه asks about his weekend"
    gloss: "زرمینه asks what he does on the weekend."
    note: "*چه کار می‌کنی؟* means 'what do you do?'"
  prs.a2.unit17.lesson04.teach.turn04:
    title: "همایون describes his weekend and asks back"
    gloss: "On the weekend he sleeps in and spends time with his family. He asks her the same."
    note: "Reuses lesson02's exact weekend sentence."
  prs.a2.unit17.lesson04.teach.turn05:
    title: "زرمینه describes her weekdays"
    gloss: "On weekdays first she works, then she comes home and cooks."
    note: "*آشپزی* means cooking."
  prs.a2.unit17.lesson04.teach.turn06:
    title: "زرمینه describes her weekend"
    gloss: "On the weekend she goes to the market with her friends."
    note: "*دوستانم* -- 'my friends' -- attaches the possessive suffix *-َم* to *دوستان* (friends)."
  prs.a2.unit17.lesson04.teach.turn07:
    title: "همایون approves"
    gloss: "همایون says she has a good schedule."
    note: "*برنامهٔ خوبی داری!* means 'you have a good schedule!'"

exercises:
  prs.a2.unit17.lesson01.exercise01.recognize_week:
    instruction: "What does this word mean?"
    correct_option: "week"
    distractors: ["weekend", "schedule", "finally"]
    accepted_answers: [{value: "week", status: correct}]
    feedback: "*هفته* means week."
  prs.a2.unit17.lesson01.exercise02.recognize_weekend:
    instruction: "What does this phrase mean?"
    correct_option: "weekend"
    distractors: ["first", "then", "schedule"]
    accepted_answers: [{value: "weekend", status: correct}]
    feedback: "*آخر هفته* means weekend."
  prs.a2.unit17.lesson01.exercise03.match_schedule_words:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - {value: {هفته: week, "آخر هفته": weekend, برنامه: schedule, اول: first, بعد: then, "در آخر": finally}, status: correct}
    feedback: "These six words cover the basic vocabulary for this unit's weekly schedule."
  prs.a2.unit17.lesson01.exercise04.order_sequence_sentence:
    instruction: "Arrange the words to say first I go to the office, then I exercise."
    accepted_answers: [{value: [اول, به, دفتر, "می‌روم", بعد, ورزش, "می‌کنم"], status: correct}]
    feedback: "*اول به دفتر می‌روم، بعد ورزش می‌کنم.* sequences the two activities."
  prs.a2.unit17.lesson01.exercise05.write_finally:
    instruction: "Write the Dari phrase for finally."
    accepted_answers:
      - {value: "در آخر", status: correct}
    feedback: "*در آخر* means finally."

  prs.a2.unit17.lesson02.exercise01.recognize_ask_weekly_schedule:
    instruction: "Which question asks what your weekly schedule is like?"
    correct_option: "What's your weekly schedule like?"
    distractors: ["On weekdays first I go to the office, then I exercise.", "On the weekend I sleep in and spend time with my family.", "What do you do on the weekend?"]
    accepted_answers: [{value: "What's your weekly schedule like?", status: correct}]
    feedback: "*برنامهٔ هفتهٔ تو چطور است؟* asks what your weekly schedule is like."
  prs.a2.unit17.lesson02.exercise02.order_weekend_activity:
    instruction: "Arrange the words to say on the weekend I sleep in."
    accepted_answers: [{value: [در, آخر, هفته, دیر, بیدار, "می‌شوم"], status: correct}]
    feedback: "*در آخر هفته دیر بیدار می‌شوم.* says you sleep in on the weekend."
  prs.a2.unit17.lesson02.exercise03.dialogue_response_weekend_plan:
    instruction: "A friend asks: 'What do you do on the weekend?' Answer that you sleep in and spend time with your family."
    accepted_answers:
      - {value: "در آخر هفته دیر بیدار می‌شوم و با فامیلم وقت می‌گذرانم.", status: correct}
      - {value: "در آخر هفته دیر بیدار می‌شوم. با فامیلم وقت می‌گذرانم.", status: correct}
      - {value: "در آخر هفته دیر بیدار می‌شوم، با فامیلم وقت می‌گذرانم.", status: correct}
    feedback: "Joining the two activities with *و*, a period, or a comma are equally natural."
  prs.a2.unit17.lesson02.exercise04.translate_weekday_sentence:
    instruction: "Translate: On weekdays first I go to the office, then I exercise."
    accepted_answers:
      - {value: "در روزهای هفته اول به دفتر می‌روم، بعد ورزش می‌کنم.", status: correct}
      - {value: "در روزهای هفته اول به دفتر می‌روم. بعد ورزش می‌کنم.", status: correct}
      - {value: "در روزهای هفته اول به دفتر می‌روم و بعد ورزش می‌کنم.", status: correct}
    feedback: "Joining the two activities with a comma, a period, or *و* are equally natural."
  prs.a2.unit17.lesson02.exercise05.write_weekend_activity:
    instruction: "Write that on the weekend you sleep in and spend time with your family."
    accepted_answers:
      - {value: "در آخر هفته دیر بیدار می‌شوم و با فامیلم وقت می‌گذرانم.", status: correct}
      - {value: "در آخر هفته دیر بیدار می‌شوم. با فامیلم وقت می‌گذرانم.", status: correct}
      - {value: "در آخر هفته دیر بیدار می‌شوم، با فامیلم وقت می‌گذرانم.", status: correct}
    feedback: "Joining the two activities with *و*, a period, or a comma are equally natural."

  prs.a2.unit17.lesson03.exercise01.read_weekday_wakeup:
    instruction: "According to the text, when does همایون wake up on weekdays?"
    correct_option: "early"
    distractors: ["late", "at noon", "the text doesn't say"]
    accepted_answers: [{value: "early", status: correct}]
    feedback: "*صبح زود بیدار می‌شود* -- he wakes up early."
  prs.a2.unit17.lesson03.exercise02.read_weekend_activity_from_text:
    instruction: "According to the text, what does همایون do on the weekend?"
    correct_option: "he sleeps in and rests"
    distractors: ["he goes to the office", "he exercises", "he goes to the market"]
    accepted_answers: [{value: "he sleeps in and rests", status: correct}]
    feedback: "*دیر بیدار می‌شود و استراحت می‌کند* -- he sleeps in and rests."
  prs.a2.unit17.lesson03.exercise03.recognize_difference_word:
    instruction: "What does this word mean?"
    correct_option: "difference"
    distractors: ["to rest", "schedule", "weekend"]
    accepted_answers: [{value: "difference", status: correct}]
    feedback: "*تفاوت* means difference."
  prs.a2.unit17.lesson03.exercise04.order_weekday_wakeup:
    instruction: "Arrange the words to say همایون wakes up early in the morning."
    accepted_answers: [{value: [همایون, صبح, زود, بیدار, "می‌شود"], status: correct}]
    feedback: "*همایون صبح زود بیدار می‌شود* matches the text exactly."
  prs.a2.unit17.lesson03.exercise05.write_weekend_rest:
    instruction: "Write that on the weekend he sleeps in and rests."
    accepted_answers:
      - {value: "در آخر هفته او دیر بیدار می‌شود و استراحت می‌کند.", status: correct}
      - {value: "در آخر هفته او دیر بیدار می‌شود و استراحت می‌کند", status: correct}
    feedback: "*در آخر هفته او دیر بیدار می‌شود و استراحت می‌کند* matches the text."

  prs.a2.unit17.lesson04.exercise01.comprehend_homayoun_weekday:
    instruction: "What does همایون do first on weekdays, and what does he do next?"
    correct_option: "goes to the office, then exercises"
    distractors: ["exercises, then goes to the office", "cooks, then goes to the market", "sleeps in, then rests"]
    accepted_answers: [{value: "goes to the office, then exercises", status: correct}]
    feedback: "*اول به دفتر می‌روم، بعد ورزش می‌کنم* -- office first, then exercise."
  prs.a2.unit17.lesson04.exercise02.comprehend_zarmina_weekend:
    instruction: "What does زرمینه do on the weekend?"
    correct_option: "goes to the market with her friends"
    distractors: ["sleeps in", "goes to the office", "exercises"]
    accepted_answers: [{value: "goes to the market with her friends", status: correct}]
    feedback: "*در آخر هفته با دوستانم به بازار می‌روم* -- she goes to the market with her friends."
  prs.a2.unit17.lesson04.exercise03.recognize_zarmina_weekday:
    instruction: "What does زرمینه say about her weekdays?"
    correct_option: "first she works, then she comes home and cooks"
    distractors: ["first she exercises, then she works", "first she cooks, then she works", "she doesn't work on weekdays"]
    accepted_answers: [{value: "first she works, then she comes home and cooks", status: correct}]
    feedback: "*اول کار می‌کنم، بعد به خانه می‌آیم و آشپزی می‌کنم* -- work first, then home and cooking."
  prs.a2.unit17.lesson04.exercise04.order_ask_weekly_schedule:
    instruction: "Arrange the words to ask همایون what his weekly schedule is like."
    accepted_answers: [{value: [همایون, "برنامهٔ", "هفتهٔ", تو, چطور, است], status: correct}]
    feedback: "*همایون، برنامهٔ هفتهٔ تو چطور است؟* asks about his weekly schedule."
  prs.a2.unit17.lesson04.exercise05.dialogue_response_as_zarmina:
    instruction: "A friend asks what your weekdays look like. Answer as زرمینه."
    accepted_answers:
      - {value: "من در روزهای هفته اول کار می‌کنم، بعد به خانه می‌آیم و آشپزی می‌کنم.", status: correct}
      - {value: "من در روزهای هفته اول کار می‌کنم. بعد به خانه می‌آیم و آشپزی می‌کنم.", status: correct}
      - {value: "من در روزهای هفته اول کار می‌کنم و بعد به خانه می‌آیم و آشپزی می‌کنم.", status: correct}
    feedback: "Joining زرمینه's activities with a comma, a period, or *و* are equally natural."
  prs.a2.unit17.lesson04.exercise06.write_zarmina_weekend:
    instruction: "Write, as زرمینه, that on the weekend you go to the market with your friends."
    accepted_answers:
      - {value: "در آخر هفته با دوستانم به بازار می‌روم.", status: correct}
      - {value: "در آخر هفته با دوستانم به بازار می‌روم", status: correct}
    feedback: "*در آخر هفته با دوستانم به بازار می‌روم.* is زرمینه's own weekend plan."
