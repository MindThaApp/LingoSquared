course:
  title: Dari A1
  description: Beginner Kabul Dari for respectful everyday communication.

units:
  prs.a1.unit13.plans:
    title: Making Plans

lessons:
  prs.a1.unit13.lesson01.plan_vocabulary: {title: "Plan vocabulary"}
  prs.a1.unit13.lesson02.proposing_a_plan: {title: "Proposing a plan"}
  prs.a1.unit13.lesson03.accepting_a_plan: {title: "Accepting a plan"}
  prs.a1.unit13.lesson04.declining_a_plan: {title: "Declining a plan"}
  prs.a1.unit13.lesson05.reading_an_invitation: {title: "Reading an invitation"}
  prs.a1.unit13.lesson06.making_a_plan_dialogue: {title: "Making a plan (dialogue)"}

teaching:
  prs.a1.unit13.lesson01.teach.plan_word:
    title: Plan
    gloss: plan
    note: "پلان means plan."
  prs.a1.unit13.lesson01.teach.park_word:
    title: Park
    gloss: park
    note: "پارک means park."
  prs.a1.unit13.lesson01.teach.berawim_word:
    title: "Let's go"
    gloss: "let's go"
    note: "برویم (let's go) is the subjunctive 'we go' form used for suggestions."
  prs.a1.unit13.lesson01.teach.chetor_ast_word:
    title: "How about it?"
    gloss: "How about it?"
    note: "چطور است؟ uses the full uncontracted است, consistent with this course's register."
  prs.a1.unit13.lesson02.teach.mikhahid_word:
    title: "Do you want (polite)"
    gloss: "do you want (polite)"
    note: "می‌خواهید (do you want, polite) starts a proposal question."
  prs.a1.unit13.lesson02.teach.jomeh_review:
    title: "Friday (review)"
    gloss: Friday
    note: "جمعه reviews the day name from unit09."
  prs.a1.unit13.lesson02.teach.propose_phrase:
    title: "Do you want to go to the park on Friday?"
    gloss: "Do you want to go to the park on Friday?"
    note: "می‌خواهید جمعه برویم پارک؟ combines this lesson's words into a full proposal."
  prs.a1.unit13.lesson03.teach.khoob_ast_word:
    title: Okay
    gloss: okay
    note: "خوب است means okay/good."
  prs.a1.unit13.lesson03.teach.aali_ast_word:
    title: Great
    gloss: great
    note: "عالی است means great/excellent."
  prs.a1.unit13.lesson03.teach.qabool_ast_word:
    title: "It's a deal"
    gloss: "it's a deal / agreed"
    note: "قبول است means it's accepted/agreed."
  prs.a1.unit13.lesson03.teach.aali_o_qabool:
    title: "Great and it's a deal"
    gloss: "Great and it's a deal!"
    note: "*و* (and) joins two short clauses together, e.g. *عالی است و قبول است*."
  prs.a1.unit13.lesson04.teach.motasef_astam_word:
    title: "I'm sorry"
    gloss: "I'm sorry"
    note: "متأسف استم means I'm sorry, using the established استم copula."
  prs.a1.unit13.lesson04.teach.nemitawanam_word:
    title: "I can't"
    gloss: "I can't"
    note: "نمی‌توانم means I can't (full uncontracted form)."
  prs.a1.unit13.lesson04.teach.kar_daram_word:
    title: "I have things to do"
    gloss: "I have things to do"
    note: "کار دارم literally means 'I have work/things,' a common polite excuse."
  prs.a1.unit13.lesson05.teach.dawat_word:
    title: Invitation
    gloss: invitation
    note: "دعوت means invitation."
  prs.a1.unit13.lesson05.teach.saat_panj_review:
    title: "Five o'clock in the afternoon"
    gloss: "five o'clock in the afternoon"
    note: "ساعت پنج بعد از ظهر combines unit11's time pattern with بعد از ظهر (afternoon)."
  prs.a1.unit13.lesson05.teach.montazer_astam_word:
    title: "I'm waiting"
    gloss: "I'm waiting"
    note: "منتظر استم means I'm waiting, using the established استم copula."
  prs.a1.unit13.lesson05.teach.invitation_message:
    title: "Sample invitation message"
    gloss: "Hi! Do you want to go to the park Friday at five in the afternoon? I'm waiting to hear from you."
    note: "A short written invitation message, the kind you might get by text."
  prs.a1.unit13.lesson05.teach.shoma_ra_mibinam_word:
    title: "I'll see you"
    gloss: "I'll see you"
    note: "شما را می‌بینم (I'll see you, polite) is a common way to close off confirming a plan."
  prs.a1.unit13.lesson06.teach.names:
    title: "Farid and Negar"
    gloss: "Farid, Negar"
    note: "فرید and نگار are the two speakers in this lesson's dialogue."
  prs.a1.unit13.lesson06.teach.che_saat_word:
    title: "What time?"
    gloss: "What time?"
    note: "چه ساعت؟ is a natural way to ask for a specific time."
  prs.a1.unit13.lesson06.teach.dialogue_line1:
    title: "Negar, do you want to go to the park on Friday?"
    gloss: "Negar, do you want to go to the park on Friday?"
    note: "Farid opens by proposing the plan."
  prs.a1.unit13.lesson06.teach.dialogue_line2:
    title: "What time?"
    gloss: "What time?"
    note: "Negar asks for the specific time before deciding."
  prs.a1.unit13.lesson06.teach.dialogue_line3:
    title: "Five o'clock in the afternoon."
    gloss: "Five o'clock in the afternoon."
    note: "Farid states the time."
  prs.a1.unit13.lesson06.teach.dialogue_line4:
    title: "Okay, great! It's a deal."
    gloss: "Okay, great! It's a deal."
    note: "Negar accepts enthusiastically."
  prs.a1.unit13.lesson06.teach.dialogue_line5:
    title: "Good, I'll see you Friday."
    gloss: "Good, I'll see you Friday."
    note: "Farid confirms and closes the exchange, using the polite شما را می‌بینم."

exercises:
  prs.a1.unit13.lesson01.exercise01.recognize_plan_reading:
    instruction: "What does this word mean?"
    correct_option: plan
    distractors: [park, "let's go", "How about it?"]
    accepted_answers: [{value: plan, status: correct}]
    feedback: "پلان means plan."
  prs.a1.unit13.lesson01.exercise02.recognize_park_reading:
    instruction: "What does this word mean?"
    correct_option: park
    distractors: [plan, "let's go", "How about it?"]
    accepted_answers: [{value: park, status: correct}]
    feedback: "پارک means park."
  prs.a1.unit13.lesson01.exercise03.match_plan_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {پلان: plan, پارک: park, برویم: "let's go", "چطور است؟": "How about it?"}
        status: correct
    feedback: "These four words/phrases cover this lesson's plan vocabulary."
  prs.a1.unit13.lesson01.exercise04.translate_plan:
    instruction: "Translate into Dari: plan."
    accepted_answers:
      - {value: پلان, status: correct}
    feedback: "پلان means plan."
  prs.a1.unit13.lesson01.exercise05.translate_lets_go:
    instruction: "Translate into Dari: let's go."
    accepted_answers:
      - {value: برویم, status: correct}
    feedback: "برویم means let's go."
  prs.a1.unit13.lesson02.exercise01.recognize_propose_reading:
    instruction: "What does this question ask?"
    correct_option: "Do you want to go to the park on Friday?"
    distractors: ["What time is it?", "Where is the park?", "I'm sorry, I can't."]
    accepted_answers: [{value: "Do you want to go to the park on Friday?", status: correct}]
    feedback: "می‌خواهید جمعه برویم پارک؟ proposes going to the park on Friday."
  prs.a1.unit13.lesson02.exercise02.match_propose_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {"می‌خواهید جمعه برویم پارک؟": "Do you want to go to the park on Friday?", می‌خواهید: "do you want (polite)", جمعه: Friday, برویم: "let's go", پارک: park, "چطور است؟": "How about it?"}
        status: correct
    feedback: "می‌خواهید جمعه برویم پارک؟ combines this lesson's own new word with review vocabulary."
  prs.a1.unit13.lesson02.exercise03.order_propose_plan:
    instruction: "Arrange the words to ask Do you want to go to the park on Friday?"
    accepted_answers:
      - {value: [می‌خواهید, جمعه, برویم, پارک], status: correct}
    feedback: "می‌خواهید جمعه برویم پارک؟ means do you want to go to the park on Friday?"
  prs.a1.unit13.lesson02.exercise04.translate_propose_plan:
    instruction: "Translate into Dari: Do you want to go to the park on Friday?"
    accepted_answers:
      - {value: "می‌خواهید جمعه برویم پارک", status: correct}
      - {value: "می‌خواهید جمعه برویم پارک؟", status: correct}
    feedback: "می‌خواهید جمعه برویم پارک؟ means do you want to go to the park on Friday?"
  prs.a1.unit13.lesson02.exercise05.dialogue_response_propose:
    instruction: "Propose to a friend that you go to the park on Friday."
    accepted_answers:
      - {value: "می‌خواهید جمعه برویم پارک؟", status: correct}
      - {value: "می‌خواهید جمعه برویم پارک", status: correct}
    feedback: "می‌خواهید جمعه برویم پارک؟ proposes going to the park on Friday."
  prs.a1.unit13.lesson03.exercise01.recognize_khoob_reading:
    instruction: "What does this phrase mean?"
    correct_option: okay
    distractors: [great, "it's a deal / agreed", plan]
    accepted_answers: [{value: okay, status: correct}]
    feedback: "خوب است means okay."
  prs.a1.unit13.lesson03.exercise02.recognize_qabool_reading:
    instruction: "What does this phrase mean?"
    correct_option: "it's a deal / agreed"
    distractors: [okay, great, park]
    accepted_answers: [{value: "it's a deal / agreed", status: correct}]
    feedback: "قبول است means it's a deal / agreed."
  prs.a1.unit13.lesson03.exercise03.match_accepting_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {"خوب است": okay, "عالی است": great, "قبول است": "it's a deal / agreed", پلان: plan, پارک: park, برویم: "let's go"}
        status: correct
    feedback: "The first three are this lesson's own accepting words; the rest review lesson01."
  prs.a1.unit13.lesson03.exercise04.translate_okay_great:
    instruction: "Translate into Dari: Okay, great!"
    accepted_answers:
      - {value: "خوب است، عالی است", status: correct}
      - {value: "خوب است عالی است", status: correct}
      - {value: "خوب است. عالی است", status: correct}
      - {value: "خوب است و عالی است", status: correct}
    feedback: "خوب است، عالی است means okay, great! -- a period, comma, or *و* (and) are all natural here."
  prs.a1.unit13.lesson03.exercise05.dialogue_response_accept:
    instruction: "A friend proposed going to the park on Friday. Accept enthusiastically."
    accepted_answers:
      - {value: "خوب است، عالی است! قبول است", status: correct}
      - {value: "خوب است عالی است قبول است", status: correct}
      - {value: "خوب است. عالی است. قبول است", status: correct}
      - {value: "خوب است، عالی است و قبول است", status: correct}
    feedback: "خوب است، عالی است! قبول است enthusiastically accepts and confirms -- a period, comma, or *و* (and) are all natural here."
  prs.a1.unit13.lesson04.exercise01.recognize_motasef_reading:
    instruction: "What does this phrase mean?"
    correct_option: "I'm sorry"
    distractors: ["I can't", "I have things to do", okay]
    accepted_answers: [{value: "I'm sorry", status: correct}]
    feedback: "متأسف استم means I'm sorry."
  prs.a1.unit13.lesson04.exercise02.recognize_nemitawanam_reading:
    instruction: "What does this word mean?"
    correct_option: "I can't"
    distractors: ["I'm sorry", "I have things to do", great]
    accepted_answers: [{value: "I can't", status: correct}]
    feedback: "نمی‌توانم means I can't."
  prs.a1.unit13.lesson04.exercise03.match_declining_phrases:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {"متأسف استم": "I'm sorry", نمی‌توانم: "I can't", "کار دارم": "I have things to do", کار: work, دارم: "I have", پلان: plan}
        status: correct
    feedback: "These cover the key phrases for politely declining a plan."
  prs.a1.unit13.lesson04.exercise04.order_decline_plan:
    instruction: "Arrange the words to say I'm sorry, I can't, I have things to do."
    accepted_answers:
      - {value: [متأسف, استم, نمی‌توانم, کار, دارم], status: correct}
    feedback: "متأسف استم، نمی‌توانم، کار دارم declines politely with a reason."
  prs.a1.unit13.lesson04.exercise05.translate_decline:
    instruction: "Translate into Dari: I'm sorry, I can't."
    accepted_answers:
      - {value: "متأسف استم، نمی‌توانم", status: correct}
      - {value: "متأسف استم نمی‌توانم", status: correct}
      - {value: "متأسف استم. نمی‌توانم", status: correct}
      - {value: "متأسف استم و نمی‌توانم", status: correct}
    feedback: "متأسف استم، نمی‌توانم means I'm sorry, I can't -- a period, comma, or *و* (and) are all natural here."
  prs.a1.unit13.lesson04.exercise06.dialogue_response_decline:
    instruction: "A friend proposed going to the park on Friday, but you're busy. Decline politely."
    accepted_answers:
      - {value: "متأسف استم، نمی‌توانم. کار دارم", status: correct}
      - {value: "متأسف استم، نمی‌توانم، کار دارم", status: correct}
      - {value: "متأسف استم نمی‌توانم کار دارم", status: correct}
      - {value: "متأسف استم. نمی‌توانم. کار دارم", status: correct}
      - {value: "متأسف استم، نمی‌توانم و کار دارم", status: correct}
    feedback: "متأسف استم، نمی‌توانم. کار دارم politely declines and gives a reason -- a period, comma, no punctuation, or *و* (and) joining the last two clauses are all natural here."
  prs.a1.unit13.lesson05.exercise01.recognize_dawat_reading:
    instruction: "What does this word mean?"
    correct_option: invitation
    distractors: [plan, park, okay]
    accepted_answers: [{value: invitation, status: correct}]
    feedback: "دعوت means invitation."
  prs.a1.unit13.lesson05.exercise02.reading_comprehension_invitation:
    instruction: "Read the invitation message. When and where is the plan for?"
    correct_option: "Friday at five in the afternoon, at the park"
    distractors: ["Friday at nine in the morning, at the park", "Saturday at five in the afternoon, at home", "Friday at five in the afternoon, at a restaurant"]
    accepted_answers: [{value: "Friday at five in the afternoon, at the park", status: correct}]
    feedback: "جمعه ساعت پنج بعد از ظهر... برویم پارک؟ proposes Friday at five in the afternoon, at the park."
  prs.a1.unit13.lesson05.exercise03.match_invitation_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {دعوت: invitation, "ساعت پنج بعد از ظهر": "five o'clock in the afternoon", سلام: hello, "منتظر استم": "I'm waiting", جمعه: Friday, پارک: park}
        status: correct
    feedback: "These cover the invitation message's key vocabulary."
  prs.a1.unit13.lesson05.exercise04.translate_waiting:
    instruction: "Translate into Dari: I'm waiting."
    accepted_answers:
      - {value: "منتظر استم", status: correct}
    feedback: "منتظر استم means I'm waiting."
  prs.a1.unit13.lesson05.exercise05.write_invitation_reply:
    instruction: "Write a short reply accepting the invitation for Friday at five in the afternoon."
    accepted_answers:
      - {value: "خوب است، عالی است! جمعه شما را می‌بینم", status: correct}
      - {value: "خوب است عالی است جمعه شما را می‌بینم", status: correct}
      - {value: "خوب است. عالی است. جمعه شما را می‌بینم", status: correct}
      - {value: "خوب است، عالی است و جمعه شما را می‌بینم", status: correct}
    feedback: "خوب است، عالی است! جمعه شما را می‌بینم accepts and confirms when you'll see them -- a period, comma, or *و* (and) are all natural here."
  prs.a1.unit13.lesson06.exercise01.dialogue_comprehension_context:
    instruction: "Read the conversation. What time is the park visit?"
    correct_option: "Five in the afternoon"
    distractors: ["Nine in the morning", "Five in the morning", "It isn't stated"]
    accepted_answers: [{value: "Five in the afternoon", status: correct}]
    feedback: "فرید says ساعت پنج بعد از ظهر -- five in the afternoon."
  prs.a1.unit13.lesson06.exercise02.match_dialogue_facts:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {"چه ساعت؟": "What time?", جمعه: Friday, "ساعت پنج بعد از ظهر": "five o'clock in the afternoon", پارک: park, "شما را می‌بینم": "I'll see you", خوب: good}
        status: correct
    feedback: "The plan is the park, Friday at five in the afternoon."
  prs.a1.unit13.lesson06.exercise03.order_what_time:
    instruction: "Arrange the words to ask What time?"
    accepted_answers:
      - {value: ["چه", "ساعت؟"], status: correct}
    feedback: "چه ساعت؟ means what time?"
  prs.a1.unit13.lesson06.exercise04.translate_see_you_friday:
    instruction: "Translate into Dari: I'll see you Friday."
    accepted_answers:
      - {value: "جمعه شما را می‌بینم", status: correct}
    feedback: "جمعه شما را می‌بینم means I'll see you Friday."
  prs.a1.unit13.lesson06.exercise05.dialogue_response_confirm_plan:
    instruction: "Farid just said the park visit is at five in the afternoon. Accept the plan enthusiastically."
    accepted_answers:
      - {value: "خوب است، عالی است! قبول است", status: correct}
      - {value: "خوب است عالی است قبول است", status: correct}
      - {value: "خوب است. عالی است. قبول است", status: correct}
      - {value: "خوب است، عالی است و قبول است", status: correct}
    feedback: "خوب است، عالی است! قبول است enthusiastically accepts and confirms -- a period, comma, or *و* (and) are all natural here."
  prs.a1.unit13.lesson06.exercise06.write_plan_summary:
    instruction: "Write one or two sentences in Dari summarizing the plan: going to the park Friday at five in the afternoon."
    accepted_answers:
      - {value: "جمعه ساعت پنج بعد از ظهر برویم پارک", status: correct}
      - {value: "جمعه، ساعت پنج بعد از ظهر، برویم پارک", status: correct}
      - {value: "پلان جمعه ساعت پنج بعد از ظهر است. برویم پارک", status: correct}
      - {value: "پلان جمعه ساعت پنج بعد از ظهر است، برویم پارک", status: correct}
      - {value: "پلان جمعه ساعت پنج بعد از ظهر است و برویم پارک", status: correct}
    feedback: "جمعه ساعت پنج بعد از ظهر برویم پارک summarizes the plan: Friday, five in the afternoon, let's go to the park -- a period, comma, or *و* (and) joining the two clauses are all natural here."
