course:
  title: Dari A1
  description: "Beginner Kabul Dari: report that a personal item is lost, ask whether it has been found, describe the item by color and size, and read a short passage about a lost-and-found item."
units:
  prs.a1.unit41.lost_items:
    title: Lost items
    description: Report that a personal item is lost, ask whether it has been found, describe it, and identify it when recovered.
lessons:
  prs.a1.unit41.lesson01.lost_item_vocabulary:
    title: Lost item vocabulary
  prs.a1.unit41.lesson02.asking_if_found:
    title: Asking if it's been found
  prs.a1.unit41.lesson03.describing_the_item:
    title: Describing the item
  prs.a1.unit41.lesson04.lost_bag_dialogue:
    title: Lost bag dialogue
  prs.a1.unit41.lesson05.reading:
    title: Reading about a lost bag
  prs.a1.unit41.lesson06.wrap_up:
    title: Wrap-up
teaching:
  prs.a1.unit41.lesson01.teach.review_this_is:
    title: "Review: this, is"
    gloss: this / is
    note: "این and است are early review words used to say what something is."
  prs.a1.unit41.lesson01.teach.review_have:
    title: "Review: I have"
    gloss: I have
    note: "دارم (from unit17) is a review word used to say what item you own or are carrying."
  prs.a1.unit41.lesson01.teach.bag_word:
    title: Bag
    gloss: bag
    note: "خریطه is the standard Dari word for a bag."
    example_gloss: I have a bag.
  prs.a1.unit41.lesson01.teach.wallet_word:
    title: Wallet
    gloss: wallet
    note: "کیف پول means wallet, literally combining کیف (case/bag) and پول (money)."
    example_gloss: I have a wallet.
  prs.a1.unit41.lesson01.teach.key_word:
    title: Key
    gloss: key
    note: "کلید means key."
    example_gloss: I have a key.
  prs.a1.unit41.lesson01.teach.glasses_word:
    title: Glasses
    gloss: glasses
    note: "عینک (from unit27) means eyeglasses/glasses."
    example_gloss: I have glasses.
  prs.a1.unit41.lesson01.teach.lost_word:
    title: Is lost
    gloss: is lost
    note: "گم شده combines گم (lost) with شده (has become) -- the standard way to say something is lost, the same pattern as زخمی است (is injured) from unit40."
    example_gloss: My bag is lost.
  prs.a1.unit41.lesson01.teach.wallet_lost_phrase:
    title: My wallet is lost!
    gloss: My wallet is lost!
    note: "کیف پولم combines کیف پول with the -م possessive suffix (my), the same pattern as خانه‌ام (my home) from earlier units."
  prs.a1.unit41.lesson02.teach.review_can_help:
    title: "Review: can you, me, help, do (polite imperative)"
    gloss: can you / me / help / do
    note: "می‌تانین, مه ره, کمک, and کنین (from unit07/unit17/unit21/unit40) combine to ask for help."
  prs.a1.unit41.lesson02.teach.review_ra:
    title: "Review: (object marker)"
    gloss: "(object marker)"
    note: "را marks the thing an action is being done to -- here, the thing that was seen."
  prs.a1.unit41.lesson02.teach.did_you_see_word:
    title: Did you see?
    gloss: did you see
    note: "دیدین is the polite 2nd-person-plural past form of دیدن (to see, already touched in unit02's از دیدن شما خوشحال شدم)."
    example_gloss: Did you see my bag?
  prs.a1.unit41.lesson02.teach.did_you_see_my_bag_phrase:
    title: Did you see my bag?
    gloss: Did you see my bag?
    note: "Combines خریطه‌ام (my bag) with را and دیدین to ask if someone noticed it."
  prs.a1.unit41.lesson02.teach.is_found_word:
    title: Is found / has been found
    gloss: "is found / has been found"
    note: "پیدا شده combines پیدا (found/available) with شده (has become) -- the standard way to ask whether something has turned up."
    example_gloss: My key has been found.
  prs.a1.unit41.lesson02.teach.has_key_been_found_phrase:
    title: Has my key been found?
    gloss: Has my key been found?
    note: "کلیدم combines کلید with the -م possessive suffix (my key)."
  prs.a1.unit41.lesson03.teach.review_color_black_white:
    title: "Review: color, black, white, and"
    gloss: color / black / white / and
    note: "رنگ, سیاه, سفید, and و (from unit38) describe an item's color."
  prs.a1.unit41.lesson03.teach.review_size:
    title: "Review: big, small"
    gloss: big / small
    note: "بزرگ and کوچک (from unit15) describe an item's size."
  prs.a1.unit41.lesson03.teach.here_word:
    title: Here
    gloss: here
    note: "اینجا means here."
    example_gloss: The key is here.
  prs.a1.unit41.lesson03.teach.bag_black_phrase:
    title: My bag is black
    gloss: My bag is black.
    note: "خریطه‌ام (my bag) plus سیاه (black) describes the item to help identify it."
  prs.a1.unit41.lesson03.teach.wallet_small_black_phrase:
    title: My wallet is small and black
    gloss: My wallet is small and black.
    note: "و (and) joins two descriptive words: کوچک (small) and سیاه (black)."
  prs.a1.unit41.lesson04.teach.review_what_thanks:
    title: "Review: what, thanks a lot"
    gloss: what / thanks a lot
    note: "چه and تشکر زیاد (from unit40) are review words used in the dialogue."
  prs.a1.unit41.lesson04.teach.review_yes_welcome:
    title: "Review: yes, you're welcome"
    gloss: yes / you're welcome
    note: "بلی (from unit03) and خواهش می‌کنم (from unit01) are review words used in the dialogue."
  prs.a1.unit41.lesson04.teach.dialogue_line1:
    title: "Homayoun: Zarmina, my bag is lost!"
    gloss: Zarmina, my bag is lost!
  prs.a1.unit41.lesson04.teach.dialogue_line2:
    title: "Zarmina: What color is it?"
    gloss: What color is it?
  prs.a1.unit41.lesson04.teach.dialogue_line3:
    title: "Homayoun: It's black."
    gloss: It's black.
  prs.a1.unit41.lesson04.teach.dialogue_line4:
    title: "Zarmina: Yes, I saw it! It's here."
    gloss: Yes, I saw it! It's here.
  prs.a1.unit41.lesson04.teach.dialogue_line5:
    title: "Homayoun: Thanks a lot!"
    gloss: Thanks a lot!
  prs.a1.unit41.lesson04.teach.dialogue_line6:
    title: "Zarmina: You're welcome."
    gloss: You're welcome.
  prs.a1.unit41.lesson05.teach.review_one_have:
    title: "Review: one, he/she has"
    gloss: one / he/she has
    note: "یک (from unit04) and دارد (from unit40) are review words used in the reading passage."
  prs.a1.unit41.lesson05.teach.reading_passage:
    title: Reading about a lost bag
    gloss: "Homayoun has a bag. His bag is black. His bag is lost. Zarmina sees the bag. The bag is here!"
  prs.a1.unit41.lesson06.teach.review_wrap_up_words:
    title: "Review: I don't have, but, you (formal)"
    gloss: "I don't have / but / you (formal)"
    note: "ندارم, اما, and شما (from unit03/unit14/unit28/unit32/unit39/unit40) are review words used to contrast a possession and ask a formal question."
  prs.a1.unit41.lesson06.teach.contrast_phrase:
    title: I have the key, but I don't have the bag
    gloss: I have the key, but I don't have the bag.
    note: "اما contrasts having the key with not having the bag."
  prs.a1.unit41.lesson06.teach.formal_question_phrase:
    title: Did you see my bag?
    gloss: Did you see my bag?
    note: "The formal شما-prefixed version of asking whether someone saw the item, for a polite direct ask."
