course:
  title: Dari A1
  description: >-
    Beginner Afghan Dari: exchanging names, saying where you're from and what
    you do, introducing a third person, and using polite titles and register
    correctly in a first-meeting context.

units:
  prs.a1.unit02.introductions:
    title: Introductions and getting acquainted

lessons:
  prs.a1.unit02.lesson01.name_exchange: {title: "Ask and give your name"}
  prs.a1.unit02.lesson02.origin_and_hometown: {title: "Ask about hometown and country"}
  prs.a1.unit02.lesson03.occupation: {title: "Ask about someone's job"}
  prs.a1.unit02.lesson04.introducing_others: {title: "Introduce a third person"}
  prs.a1.unit02.lesson05.polite_titles_and_register: {title: "Use polite titles and the right register"}
  prs.a1.unit02.lesson06.gathering_dialogue: {title: "Meet people at a gathering"}

teaching:
  prs.a1.unit02.lesson01.teach.name_question_polite:
    title: "Ask someone's name politely"
    gloss: "What is your name?"
    note: "نام‌تان چیست؟ is the respectful form for a new adult acquaintance, continuing unit01's شما/استین register."
  prs.a1.unit02.lesson01.teach.name_answer:
    title: "Give your name with است"
    gloss: "My name is Faridun."
    note: "نام من ... است is a neutral, slightly formal way to state a name."
  prs.a1.unit02.lesson01.teach.i_am_name:
    title: "Give your name with استم"
    gloss: "I'm Faridun."
    note: "استم directly follows the name, the same first-person Dari copula from unit01."
  prs.a1.unit02.lesson01.teach.name_question_informal:
    title: "Ask a close friend's name"
    gloss: "What's your name?"
    note: "نامت چیست؟ uses the informal possessive -ت. Reserve it for a peer or close friend, exactly like تو/استی in unit01."
  prs.a1.unit02.lesson01.teach.what_is_your_name_word:
    title: "The word for name"
    gloss: "name"
    note: "نام is the standalone noun used in both the polite and informal questions above."
    example_gloss: "What is your name?"
  prs.a1.unit02.lesson01.teach.register_note:
    title: "Polite vs. close-friend possessive"
    gloss: "-تان for someone you address respectfully; -ت for a close friend."
    note: "The same register split from unit01 (شما/تو) carries over to possessive endings on نام."

  prs.a1.unit02.lesson02.teach.where_from_polite:
    title: "Ask where someone is from"
    gloss: "Where are you from?"
    note: "شما از کجا استین؟ keeps the respectful شما/استین pairing."
  prs.a1.unit02.lesson02.teach.from_kabul:
    title: "Say you're from Kabul"
    gloss: "I'm from Kabul."
    note: "من از کابل استم follows the من از [place] استم pattern used for any city."
  prs.a1.unit02.lesson02.teach.from_herat:
    title: "Say you're from Herat"
    gloss: "I'm from Herat."
    note: "هرات is a major city in western Afghanistan."
  prs.a1.unit02.lesson02.teach.from_mazar:
    title: "Say you're from Mazar-i-Sharif"
    gloss: "I'm from Mazar-i-Sharif."
    note: "مزار شریف is written as two words and is a major city in northern Afghanistan."
  prs.a1.unit02.lesson02.teach.country:
    title: "Afghanistan"
    gloss: "Afghanistan"
    note: "افغانستان is used the same way a city name is, after از."
    example_gloss: "I am from Afghanistan."
  prs.a1.unit02.lesson02.teach.city_word:
    title: "The word for city"
    gloss: "city"
    note: "شهر names a city generally, distinct from a specific city name."
    example_gloss: "Kabul is a big city."

  prs.a1.unit02.lesson03.teach.occupation_question:
    title: "Ask what someone does"
    gloss: "What is your job?"
    note: "کار شما چیست؟ literally asks 'what is your work,' the ordinary way to ask about occupation."
  prs.a1.unit02.lesson03.teach.doctor:
    title: "Doctor"
    gloss: "doctor"
    note: "داکتر is the common Dari occupation term, used for both physicians and, informally, people with a doctoral degree."
    example_gloss: "He/she is a doctor."
  prs.a1.unit02.lesson03.teach.teacher:
    title: "Teacher"
    gloss: "teacher"
    note: "معلم is a general term for teacher at any school level."
    example_gloss: "He/she is a teacher."
  prs.a1.unit02.lesson03.teach.engineer:
    title: "Engineer"
    gloss: "engineer"
    note: "مهندس covers engineers broadly, not one specific engineering discipline."
    example_gloss: "He/she is an engineer."
  prs.a1.unit02.lesson03.teach.shopkeeper:
    title: "Shopkeeper"
    gloss: "shopkeeper"
    note: "دوکاندار (from دوکان, shop) is the everyday Kabul term; this course uses the Dari spelling دوکان rather than the Iranian Farsi مغازه."
    example_gloss: "He/she is a shopkeeper."
  prs.a1.unit02.lesson03.teach.i_am_teacher:
    title: "State an occupation"
    gloss: "I'm a teacher."
    note: "من [occupation] استم is the pattern for any occupation taught in this lesson."

  prs.a1.unit02.lesson04.teach.introduce_formal:
    title: "Introduce someone formally"
    gloss: "Allow me to introduce my colleague."
    note: "اجازه بدهین همکارم را معرفی کنم is a respectful way to bring a third person into the conversation."
  prs.a1.unit02.lesson04.teach.this_is:
    title: "Name the person you're introducing"
    gloss: "This is my colleague Arezoo."
    note: "این [person] است directly names who is being introduced."
  prs.a1.unit02.lesson04.teach.pleased_after_intro:
    title: "Say you're pleased to meet someone"
    gloss: "Pleased to meet you."
    note: "از آشنایی با شما خوش شدم is the same first-meeting phrase from unit01, reused here after a third-person introduction."
  prs.a1.unit02.lesson04.teach.pleased_reply:
    title: "Reply that you're pleased too"
    gloss: "I'm pleased too."
    note: "من هم خوش شدم is the natural short reply."
  prs.a1.unit02.lesson04.teach.friend_word:
    title: "Friend"
    gloss: "friend"
    note: "دوست is a general word for friend, without specifying closeness."
    example_gloss: "He/she is my friend."
  prs.a1.unit02.lesson04.teach.colleague_word:
    title: "Colleague"
    gloss: "colleague"
    note: "همکار names a co-worker, already seen in unit01's workplace dialogue."
    example_gloss: "He/she is my colleague."

  prs.a1.unit02.lesson05.teach.title_jenab:
    title: "Mr. / Sir"
    gloss: "Mr. / sir"
    note: "جناب precedes a man's name or title as a respectful form of address, common in everyday urban Afghan usage."
    example_gloss: "Sir, please go ahead."
  prs.a1.unit02.lesson05.teach.title_khanom:
    title: "Ms. / Mrs."
    gloss: "Ms. / Mrs."
    note: "خانم precedes a woman's name and is used regardless of marital status."
    example_gloss: "Madam, please go ahead."
  prs.a1.unit02.lesson05.teach.title_with_name:
    title: "Address a man politely"
    gloss: "Mr. Faridun"
    note: "جناب plus a first name is a common polite address, not necessarily requiring a surname."
  prs.a1.unit02.lesson05.teach.title_with_name_female:
    title: "Address a woman politely"
    gloss: "Ms. Arezoo"
    note: "خانم plus a first name works the same way as جناب for a man."
  prs.a1.unit02.lesson05.teach.register_reminder:
    title: "When to use each register"
    gloss: "Use شما and استین with someone you've just met; use تو and استی only with a close friend."
    note: "This restates unit01's register rule directly for the introduction context."
  prs.a1.unit02.lesson05.teach.polite_could_you:
    title: "Politely ask someone to repeat their name"
    gloss: "Could you say your name again?"
    note: "می‌توانین نام‌تان را دوباره بگویین؟ is a natural, polite way to ask for repetition without causing awkwardness."

  prs.a1.unit02.lesson06.teach.gathering_word:
    title: "Gathering / party"
    gloss: "gathering"
    note: "مهمانی names an informal social gathering, the setting for this lesson's dialogue."
    example_gloss: "The gathering is good."
  prs.a1.unit02.lesson06.teach.turn01:
    title: "Leila opens the introduction"
    gloss: "Leila greets Faridun and asks his name, addressing him respectfully as جناب."
    note: "Leila and Faridun have not met before, so she uses the respectful register from the start."
  prs.a1.unit02.lesson06.teach.turn02:
    title: "Faridun gives his name"
    gloss: "Faridun returns the greeting and gives his name."
    note: "سلام علیکم is the fuller greeting from unit01, appropriate for a first meeting."
  prs.a1.unit02.lesson06.teach.turn03:
    title: "Leila asks where he's from"
    gloss: "Leila says she's pleased to meet him and asks where he's from."
    note: "The same از آشنایی با شما خوش شدم phrase carries over from unit01's workplace dialogue."
  prs.a1.unit02.lesson06.teach.turn04:
    title: "Faridun answers and returns the question"
    gloss: "Faridun says he's from Herat and asks Leila the same question."
    note: "و شما؟ economically returns a question, as seen in unit01."
  prs.a1.unit02.lesson06.teach.turn05:
    title: "Leila answers and asks about work"
    gloss: "Leila says she's from Kabul and asks Faridun's occupation."
    note: "The conversation naturally moves from origin to occupation."
  prs.a1.unit02.lesson06.teach.turn06:
    title: "Faridun answers and returns the question"
    gloss: "Faridun says he's an engineer and asks Leila the same question."
    note: "شما چطور؟ is a short way to return a question already understood from context."
  prs.a1.unit02.lesson06.teach.turn07:
    title: "Leila states her occupation"
    gloss: "Leila says she's a teacher."
    note: "Completes the occupation exchange with the pattern taught earlier in the unit."
  prs.a1.unit02.lesson06.teach.turn08:
    title: "Faridun introduces a third person"
    gloss: "Faridun introduces his colleague Arezoo."
    note: "This brings a third participant into the conversation using the formal introduction phrase from lesson04."
  prs.a1.unit02.lesson06.teach.turn09:
    title: "Leila welcomes Arezoo"
    gloss: "Leila welcomes Arezoo, addressing her respectfully as خانم."
    note: "خوش آمدین is the welcome phrase from unit01, here directed at a newly introduced person."
  prs.a1.unit02.lesson06.teach.turn10:
    title: "Arezoo responds"
    gloss: "Arezoo thanks Leila and says she's happy to meet her."
    note: "از دیدن شما خوشحال شدم is a natural variant of the pleased-to-meet-you phrase, using دیدن (seeing) instead of آشنایی."

exercises:
  prs.a1.unit02.lesson01.exercise01.recognize_name_question:
    instruction: "Which phrase politely asks someone's name?"
    correct_option: "What is your name? (polite)"
    distractors: ["What's your name? (informal)", "What is your job?", "Where are you from?"]
    accepted_answers: [{value: "What is your name? (polite)", status: correct}]
    feedback: "نام‌تان چیست؟ is the respectful form for a new acquaintance."
  prs.a1.unit02.lesson01.exercise02.recognize_polite_vs_informal:
    instruction: "نامت چیست؟ is appropriate to ask..."
    correct_option: "a close friend"
    distractors: ["a stranger you just met", "an elder at a formal event", "a customer at your shop"]
    accepted_answers: [{value: "a close friend", status: correct}]
    feedback: "The informal -ت possessive on نامت only fits a close friend or peer, the same rule as تو/استی in unit01."
  prs.a1.unit02.lesson01.exercise03.recognize_name_question_reading:
    instruction: "What does this question ask?"
    correct_option: "What is your name?"
    distractors: ["What is your job?", "Where are you from?", "And you?"]
    accepted_answers: [{value: "What is your name?", status: correct}]
    feedback: "نام‌تان چیست؟ asks for your name."
  prs.a1.unit02.lesson01.exercise04.match_name_forms:
    instruction: "Match each phrase with its meaning."
    accepted_answers:
      - {value: {"نام‌تان چیست؟": "What is your name? (polite)", "نامت چیست؟": "What's your name? (informal)", نام: name}, status: correct}
    feedback: "نام‌تان and نامت differ only in register, not in meaning."
  prs.a1.unit02.lesson01.exercise05.order_name_answer:
    instruction: "Arrange the words to say My name is Faridun."
    accepted_answers: [{value: [نام, من, فریدون, است], status: correct}]
    feedback: "نام من فریدون است follows the noun-then-است pattern."
  prs.a1.unit02.lesson01.exercise06.translate_name_answer:
    instruction: "Translate into Dari: My name is Faridun."
    accepted_answers:
      - {value: "نام من فریدون است", status: correct}
      - {value: "فریدون استم", status: correct}
      - {value: "من فریدون استم", status: correct}
    feedback: "نام من فریدون است means my name is Faridun."
  prs.a1.unit02.lesson01.exercise07.translate_own_name:
    instruction: "Translate into Dari: My name is Faridun."
    accepted_answers:
      - {value: "نام من فریدون است", status: correct}
      - {value: "فریدون استم", status: correct}
      - {value: "من فریدون استم", status: correct}
    feedback: "Either نام من فریدون است or فریدون استم correctly states the name; the same pattern works for any name."
  prs.a1.unit02.lesson01.exercise08.speak_name_exchange:
    instruction: "Answer نام‌تان چیست؟ aloud, saying your name is Faridun."
    accepted_answers:
      - {value: "نام من فریدون است", status: correct}
      - {value: "فریدون استم", status: correct}
      - {value: "من فریدون استم", status: correct}
    feedback: "Either pattern correctly answers the question; the same pattern works for any name."

  prs.a1.unit02.lesson02.exercise01.recognize_origin_question:
    instruction: "Which phrase asks where someone is from?"
    correct_option: "Where are you from?"
    distractors: ["What is your job?", "What is your name?", "How are you? (polite)"]
    accepted_answers: [{value: "Where are you from?", status: correct}]
    feedback: "شما از کجا استین؟ asks about origin, using از (from) and کجا (where)."
  prs.a1.unit02.lesson02.exercise02.recognize_city_names:
    instruction: "Which of these is a city in Afghanistan?"
    correct_option: هرات
    distractors: [افغانستان, شهر, کار]
    accepted_answers: [{value: هرات, status: correct}]
    feedback: "هرات is a city; افغانستان is the country and شهر is the general word for city."
  prs.a1.unit02.lesson02.exercise03.recognize_origin_question_reading:
    instruction: "What does this question ask?"
    correct_option: "Where are you from?"
    distractors: ["What is your job?", "What is your name?", "And you?"]
    accepted_answers: [{value: "Where are you from?", status: correct}]
    feedback: "شما از کجا استین؟ asks where you're from."
  prs.a1.unit02.lesson02.exercise04.match_cities:
    instruction: "Match each place with its English name."
    accepted_answers:
      - {value: {کابل: Kabul, هرات: Herat, "مزار شریف": "Mazar-i-Sharif", افغانستان: Afghanistan}, status: correct}
    feedback: "کابل، هرات and مزار شریف are cities; افغانستان is the country."
  prs.a1.unit02.lesson02.exercise05.order_origin_answer:
    instruction: "Arrange the words to say I'm from Kabul."
    accepted_answers: [{value: [من, از, کابل, استم], status: correct}]
    feedback: "من از کابل استم follows من از [place] استم."
  prs.a1.unit02.lesson02.exercise06.translate_origin_answer:
    instruction: "Translate into Dari: I'm from Kabul."
    accepted_answers:
      - {value: "من از کابل استم", status: correct}
      - {value: "از کابل استم", status: correct}
    feedback: "من از کابل استم means I'm from Kabul."
  prs.a1.unit02.lesson02.exercise07.write_own_city:
    instruction: "Write a sentence saying you are from Herat."
    accepted_answers:
      - {value: "من از هرات استم", status: correct}
      - {value: "از هرات استم", status: correct}
    feedback: "من از [place] استم correctly states where you're from; the same pattern works for any place."
  prs.a1.unit02.lesson02.exercise08.speak_origin_exchange:
    instruction: "Answer شما از کجا استین؟ aloud, saying you are from Mazar-i-Sharif."
    accepted_answers:
      - {value: "من از مزار شریف استم", status: correct}
      - {value: "از مزار شریف استم", status: correct}
    feedback: "من از [place] استم correctly answers the question; the same pattern works for any place."

  prs.a1.unit02.lesson03.exercise01.recognize_occupation_question:
    instruction: "Which phrase asks what someone's job is?"
    correct_option: "What is your job?"
    distractors: ["Where are you from?", "What is your name?", "And you?"]
    accepted_answers: [{value: "What is your job?", status: correct}]
    feedback: "کار شما چیست؟ literally asks what your work is."
  prs.a1.unit02.lesson03.exercise02.recognize_doctor:
    instruction: "What does this word mean?"
    correct_option: doctor
    distractors: [teacher, engineer, shopkeeper]
    accepted_answers: [{value: doctor, status: correct}]
    feedback: "داکتر means doctor."
  prs.a1.unit02.lesson03.exercise03.recognize_occupation_question_reading:
    instruction: "What does this question ask?"
    correct_option: "What is your job?"
    distractors: ["Where are you from?", "What is your name?", "How are you?"]
    accepted_answers: [{value: "What is your job?", status: correct}]
    feedback: "کار شما چیست؟ asks what your job is."
  prs.a1.unit02.lesson03.exercise04.match_occupations:
    instruction: "Match each occupation with its English meaning."
    accepted_answers:
      - {value: {داکتر: doctor, معلم: teacher, مهندس: engineer, دوکاندار: shopkeeper}, status: correct}
    feedback: "These four occupation words recur throughout the unit."
  prs.a1.unit02.lesson03.exercise05.order_occupation_answer:
    instruction: "Arrange the words to say I'm a teacher."
    accepted_answers: [{value: [من, معلم, استم], status: correct}]
    feedback: "من معلم استم follows من [occupation] استم."
  prs.a1.unit02.lesson03.exercise06.translate_occupation_answer:
    instruction: "Translate into Dari: I'm a teacher."
    accepted_answers:
      - {value: "من معلم استم", status: correct}
      - {value: "معلم استم", status: correct}
    feedback: "من معلم استم means I'm a teacher."
  prs.a1.unit02.lesson03.exercise07.translate_engineer:
    instruction: "Translate into Dari: I'm an engineer."
    accepted_answers:
      - {value: "من مهندس استم", status: correct}
      - {value: "مهندس استم", status: correct}
    feedback: "من مهندس استم states the occupation using the same pattern."
  prs.a1.unit02.lesson03.exercise08.speak_occupation_exchange:
    instruction: "Answer کار شما چیست؟ aloud with your own occupation (use one of the four occupations from this lesson)."
    accepted_answers:
      - {value: "من داکتر استم", status: correct}
      - {value: "من معلم استم", status: correct}
      - {value: "من مهندس استم", status: correct}
      - {value: "من دوکاندار استم", status: correct}
      - {value: "من دکاندار استم", status: acceptable_with_note, note: "Also spelled دکاندار/دکان; this course uses the Afghan spelling دوکاندار/دوکان."}
      - {value: "داکتر استم", status: correct}
      - {value: "معلم استم", status: correct}
      - {value: "مهندس استم", status: correct}
      - {value: "دوکاندار استم", status: correct}
      - {value: "دکاندار استم", status: acceptable_with_note, note: "Also spelled دکاندار/دکان; this course uses the Afghan spelling دوکاندار/دوکان."}
    feedback: "من [occupation] استم correctly answers the question with any of the four occupations taught in this lesson."

  prs.a1.unit02.lesson04.exercise01.recognize_introduce_formal:
    instruction: "Which phrase formally introduces a third person?"
    correct_option: "Allow me to introduce my colleague."
    distractors: ["Pleased to meet you.", "I'm pleased too.", "What is your job?"]
    accepted_answers: [{value: "Allow me to introduce my colleague.", status: correct}]
    feedback: "اجازه بدهین همکارم را معرفی کنم literally asks permission to introduce a colleague."
  prs.a1.unit02.lesson04.exercise02.recognize_friend_vs_colleague:
    instruction: "Which word specifically means colleague, not friend in general?"
    correct_option: همکار
    distractors: [دوست, کار, داکتر]
    accepted_answers: [{value: همکار, status: correct}]
    feedback: "همکار means colleague or co-worker; دوست is a general word for friend."
  prs.a1.unit02.lesson04.exercise03.recognize_introduce_reading:
    instruction: "What does this phrase mean?"
    correct_option: "Allow me to introduce my colleague."
    distractors: ["Pleased to meet you.", "Welcome.", "I'm pleased too."]
    accepted_answers: [{value: "Allow me to introduce my colleague.", status: correct}]
    feedback: "اجازه بدهین همکارم را معرفی کنم means allow me to introduce my colleague."
  prs.a1.unit02.lesson04.exercise04.match_intro_phrases:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - {value: {"این همکارم آرزو است": "This is my colleague Arezoo.", "از آشنایی با شما خوش شدم": "Pleased to meet you.", "من هم خوش شدم": "I'm pleased too.", دوست: friend, همکار: colleague, "اجازه بدهین همکارم را معرفی کنم": "Allow me to introduce my colleague."}, status: correct}
    feedback: "The four phrases carry a third-person introduction from opening line to reply; دوست and همکار are the two relationship words used in this lesson."
  prs.a1.unit02.lesson04.exercise05.order_this_is:
    instruction: "Arrange the words to say This is my colleague Arezoo."
    accepted_answers: [{value: [این, همکارم, آرزو, است], status: correct}]
    feedback: "این همکارم آرزو است names the person being introduced."
  prs.a1.unit02.lesson04.exercise06.translate_pleased:
    instruction: "Translate into Dari: Pleased to meet you."
    accepted_answers:
      - {value: "از آشنایی با شما خوش شدم", status: correct}
    feedback: "از آشنایی با شما خوش شدم means pleased to meet you."
  prs.a1.unit02.lesson04.exercise07.translate_pleased_reply:
    instruction: "Translate into Dari: I'm pleased too."
    accepted_answers:
      - {value: "من هم خوش شدم", status: correct}
    feedback: "من هم خوش شدم is the natural short reply."
  prs.a1.unit02.lesson04.exercise08.dialogue_response_introduce:
    instruction: "Someone says این همکارم آرزو است. Respond appropriately."
    accepted_answers:
      - {value: "از آشنایی با شما خوش شدم", status: correct}
      - {value: "خوش آمدین", status: correct}
    feedback: "Either phrase appropriately welcomes someone who has just been introduced to you; من هم خوش شدم only fits as a reply to someone who has already said از آشنایی با شما خوش شدم."

  prs.a1.unit02.lesson05.exercise01.recognize_titles:
    instruction: "Which title is used to address a woman?"
    correct_option: خانم
    distractors: [جناب, همکار, دوست]
    accepted_answers: [{value: خانم, status: correct}]
    feedback: "خانم precedes a woman's name; جناب precedes a man's."
  prs.a1.unit02.lesson05.exercise02.recognize_repeat_request:
    instruction: "What does می‌توانین نام‌تان را دوباره بگویین؟ ask?"
    correct_option: "Could you say your name again?"
    distractors: ["What is your job?", "Where are you from?", "May I introduce a colleague?"]
    accepted_answers: [{value: "Could you say your name again?", status: correct}]
    feedback: "دوباره means again, and بگویین is the polite imperative for say."
  prs.a1.unit02.lesson05.exercise03.choose_appropriate_register:
    instruction: "You just met someone at a work event for the first time. Which question is appropriate?"
    correct_option: "نام‌تان چیست؟"
    distractors: ["نامت چیست؟", "کار شما چیست؟ (asked before any greeting)", "شما چطور؟ (with no prior context)"]
    accepted_answers: [{value: "نام‌تان چیست؟", status: correct}]
    feedback: "A first work-event meeting calls for the respectful نام‌تان form, not the close-friend نامت."
  prs.a1.unit02.lesson05.exercise04.match_titles_to_gender:
    instruction: "Match each title-plus-name to its meaning."
    accepted_answers:
      - {value: {"جناب فریدون": "Mr. Faridun", "خانم آرزو": "Ms./Mrs. Arezoo"}, status: correct}
    feedback: "جناب precedes a man's name, خانم a woman's."
  prs.a1.unit02.lesson05.exercise05.order_title_with_name:
    instruction: "Arrange the words for Mr. Faridun."
    accepted_answers: [{value: [جناب, فریدون], status: correct}]
    feedback: "جناب comes before the name."
  prs.a1.unit02.lesson05.exercise06.fill_title_blank:
    instruction: "Complete the greeting to a man named Faridun."
    accepted_answers:
      - {value: جناب, status: correct}
    feedback: "جناب فریدون، از آشنایی با شما خوش شدم addresses a man respectfully by title and name."
  prs.a1.unit02.lesson05.exercise07.translate_repeat_request:
    instruction: "Translate into Dari: Could you say your name again?"
    accepted_answers:
      - {value: "می‌توانین نام‌تان را دوباره بگویین؟", status: correct}
      - {value: "می‌تانین نام‌تان را دوباره بگویین؟", status: correct}
      - {value: "می‌توانین نام‌تان را دوباره بگویین", status: correct}
      - {value: "می‌تانین نام‌تان را دوباره بگویین", status: correct}
    feedback: "می‌توانین نام‌تان را دوباره بگویین؟ politely asks for repetition."
  prs.a1.unit02.lesson05.exercise08.speak_polite_address:
    instruction: "You want to politely address a man you just met named Faridun. What do you call him?"
    accepted_answers:
      - {value: "جناب فریدون", status: correct}
    feedback: "جناب فریدون is the respectful form of address."

  prs.a1.unit02.lesson06.exercise01.listen_context:
    instruction: "Read the conversation. Where does this conversation take place?"
    correct_option: "at a social gathering"
    distractors: ["at a hospital", "at a train station", "at a grocery shop"]
    accepted_answers: [{value: "at a social gathering", status: correct}]
    feedback: "Leila, Faridun, and Arezoo meet and introduce themselves at a gathering."
  prs.a1.unit02.lesson06.exercise02.dialogue_comprehension_next:
    instruction: "What does Faridun do after stating his occupation?"
    correct_option: "He introduces his colleague Arezoo."
    distractors: ["He says goodbye.", "He asks Leila's age.", "He asks for Leila's phone number."]
    accepted_answers: [{value: "He introduces his colleague Arezoo.", status: correct}]
    feedback: "Faridun says اجازه بدهین همکارم آرزو را معرفی کنم."
  prs.a1.unit02.lesson06.exercise03.match_dialogue_facts:
    instruction: "Match each person with their facts from the dialogue."
    accepted_answers:
      - {value: {لیلا: "از کابل، معلم", فریدون: "از هرات، مهندس"}, status: correct}
    feedback: "Leila is from Kabul and is a teacher; Faridun is from Herat and is an engineer."
  prs.a1.unit02.lesson06.exercise04.order_reply_occupation:
    instruction: "Arrange the words for Leila's answer about her job."
    accepted_answers: [{value: [من, معلم, استم], status: correct}]
    feedback: "من معلم استم is Leila's answer."
  prs.a1.unit02.lesson06.exercise05.speak_own_name:
    instruction: "جناب، نام شما چیست؟ Answer using the name Faridun."
    accepted_answers:
      - {value: "نام من فریدون است", status: correct}
      - {value: "فریدون استم", status: correct}
      - {value: "من فریدون استم", status: correct}
    feedback: "نام من فریدون است correctly answers the question; the same pattern works for any name."
  prs.a1.unit02.lesson06.exercise06.translate_origin_line:
    instruction: "Translate into Dari: I'm from Herat."
    accepted_answers:
      - {value: "من از هرات استم", status: correct}
      - {value: "من از هرات استم، و شما؟", status: correct}
      - {value: "از هرات استم", status: correct}
    feedback: "Faridun says من از هرات استم، و شما؟"
  prs.a1.unit02.lesson06.exercise07.write_profile:
    instruction: "Write a short profile for Leila using facts from the dialogue: her name, city, and job."
    accepted_answers:
      - {value: "این لیلا است. لیلا از کابل است. لیلا معلم است.", status: correct}
      - {value: "این لیلا است، از کابل است و معلم است.", status: correct}
      - {value: "این لیلا است، لیلا از کابل است و لیلا معلم است.", status: correct}
    feedback: "A complete profile names Leila, states she's from Kabul, and that she's a teacher -- all in the third person, since the profile is about Leila, not the writer. Joining the three facts with periods or with a comma and و are equally natural."
  prs.a1.unit02.lesson06.exercise08.speak_full_introduction:
    instruction: "Introduce yourself to a new acquaintance: give your name, where you're from, and your occupation. (Example: use the name Faridun, the city Herat, and the job engineer.)"
    accepted_answers:
      - {value: "نام من فریدون است. من از هرات استم. من مهندس استم.", status: correct}
      - {value: "نام من فریدون است، از هرات استم و مهندس استم.", status: correct}
      - {value: "نام من لیلا است. من از کابل استم. من معلم استم.", status: correct}
      - {value: "نام من لیلا است، از کابل استم و معلم استم.", status: correct}
    feedback: "A full introduction combines the name, origin, and occupation patterns taught in this unit, e.g. using Faridun's or Leila's own facts from the dialogue. Joining the three facts with periods or with a comma and و are equally natural."
