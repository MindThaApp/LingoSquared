teaching:
  fr.a1.unit08.lesson01.teach.lundi:
    title: 星期一
    gloss: 星期一
    note: 法语中星期的名称是阳性词，首字母不大写；汉语的“星期一”等本来就没有大小写之分，学习法语时要记住这里全部用小写。
    example_gloss: 工作坊从不在星期一聚会。
  fr.a1.unit08.lesson01.teach.samedi:
    title: 星期六
    gloss: 星期六
    note: 带冠词的 *le samedi* 表示“每个星期六”，指习惯性的情况；单独的 *samedi* 则指某一个具体的星期六，根据动词时态，指最近将到来的或刚过去的那个星期六。
    example_gloss: 工作坊每周六举行。
  fr.a1.unit08.lesson01.teach.dimanche:
    title: 星期日
    gloss: 星期日
    note: 与其他星期名称一样：阳性，首字母不大写。
    example_gloss: 面包店星期天不营业。
  fr.a1.unit08.lesson01.teach.aujourdhui:
    title: 今天
    gloss: 今天
    note: '*Aujourd''hui* 是一个固定的单词，尽管它在历史上由好几个部分组合而成。'
    example_gloss: 今天是星期六。
  fr.a1.unit08.lesson01.teach.demain:
    title: 明天
    gloss: 明天
    note: '*Demain* 是不变词，无论什么语境用法都一样。'
    example_gloss: 药店明天开门。
  fr.a1.unit08.lesson01.teach.hier:
    title: 昨天
    gloss: 昨天
    note: '*Hier* 与 *demain* 意思正好相反。'
    example_gloss: 我昨天吃了鱼。
  fr.a1.unit08.lesson01.teach.quel_jour_sommes_nous:
    title: 询问星期几
    gloss: 今天星期几？
    note: '*Quel jour sommes-nous ?*（字面意思是“我们是哪一天”）是询问星期几的标准说法。'
  fr.a1.unit08.lesson02.teach.mars:
    title: 三月
    gloss: 三月
    note: 法语中的月份和星期一样是阳性词，首字母不大写；汉语的“三月”本来就没有大小写之分，学法语时要注意用小写。
    example_gloss: 工作坊在三月结束。
  fr.a1.unit08.lesson02.teach.quelle_est_la_date:
    title: 询问日期
    gloss: 今天几号？
    note: '*Quelle est la date... ?* 是询问完整日期的标准说法；而 *Quel jour sommes-nous ?* 只询问星期几。'
  fr.a1.unit08.lesson02.teach.cest_le_quinze_mars:
    title: 表达日期
    gloss: 今天是三月十五日。
    note: '*Le* + 基数词 + 月份是法语表达日期的标准结构，用的是 *quinze*（十五）这样的基数词，而不是序数词。'
  fr.a1.unit08.lesson02.teach.nous_sommes_le:
    title: 说出今天的日期
    gloss: 今天是三月十五日。
    note: 说今天的日期时，*Nous sommes le...* 与 *C'est le...* 同样常用。
  fr.a1.unit08.lesson02.teach.le_premier:
    title: 一号（每月第一天）
    gloss: 一号
    note: '*Le premier* 是“日期用基数词”这条规则唯一的例外：每月其他日子都用普通基数词（*le deux*、*le trois*……），只有一号用序数词 *premier*。'
  fr.a1.unit08.lesson02.teach.le_vingt_deux:
    title: 说出结束日期
    gloss: 工作坊在三月二十二日结束。
    note: '*Se termine*（结束）是代词式动词；*vingt-deux* 是普通基数词，规则与 *le quinze mars* 相同。'
  fr.a1.unit08.lesson03.teach.line01:
    title: 询问最后一次活动的时间
    gloss: Inès 问工作坊的最后一次活动是什么时候。
    note: '*C''est quand... ?*（什么时候）是询问时间的一种自然又简单的说法。'
  fr.a1.unit08.lesson03.teach.line02:
    title: 说出日期和星期
    gloss: Mathieu 说他记得是三月二十二日，星期六。
    note: '*Un samedi*（不带 *le*）只是说明这个日期是星期几。'
  fr.a1.unit08.lesson03.teach.line03:
    title: 询问今天的日期
    gloss: Inès 问今天是几号。
    note: 和你学过的询问日期的 *Quelle est la date aujourd'hui ?* 是同一句。
  fr.a1.unit08.lesson03.teach.line04:
    title: 说出今天的日期和相隔时间
    gloss: Mathieu 说今天是三月十五日，所以还有一周。
    note: '*Dans une semaine*（一周后）表示从今天算起的时间距离。'
  fr.a1.unit08.lesson03.teach.line05:
    title: 回应并说出计划
    gloss: Inès 说太好了，她有时间为这个场合准备一道甜点。
    note: '*J''ai le temps de* + 动词原形（我有时间做……）是表示时间足够做某事的常见说法。'
  fr.a1.unit08.lesson03.teach.line06:
    title: 确认计划
    gloss: Mathieu 说好主意，那就下周六，二十二号见。
    note: '*Samedi prochain*（下周六）同时确认了星期几和日期，为这段对话收尾。'
