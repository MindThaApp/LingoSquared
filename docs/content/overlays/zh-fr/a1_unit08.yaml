course:
  title: 法语 A1
  description: 星期几以及日期的表达（le + 基数词 + 月份，只有 le premier 一号是序数词的例外），并接续 Inès 和 Mathieu 的烹饪工作坊故事，开始筹划最后一次活动。特别提示：法语表达日期时全程使用基数词（如 le quinze mars，字面是“十五 三月”），而汉语说“三月十五日”的“日”前面也是普通数字；只有每月一号例外，要用序数词。
