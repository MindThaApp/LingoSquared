teaching:
  fr.a1.unit47.lesson01.teach.le_temps:
    title: 天气
    gloss: 天气
    note: '*Le temps* 既表示“天气”，也表示“时间”；它是阳性名词。'
    example_gloss: 天气怎么样？
  fr.a1.unit47.lesson01.teach.quel_temps_fait:
    title: 询问天气
    gloss: 天气怎么样？
    note: '*Quel temps fait-il ?* 是询问天气的标准问句；*quel* 与阳性名词 *temps* 保持一致。'
  fr.a1.unit47.lesson01.teach.le_temps_est:
    title: 晴天
    gloss: 天气晴朗。
    note: '*Le temps est* + 形容词是一种常用句型；形容词与阳性名词 *temps* 保持一致。'
  fr.a1.unit47.lesson01.teach.il_pleut:
    title: 下雨
    gloss: 正在下雨。
    note: '*Pleuvoir*（下雨）用作无人称动词：*il pleut*，不需要另加形容词。'
  fr.a1.unit47.lesson01.teach.le_temps_est_2:
    title: 多云
    gloss: 天气多云。
    note: 句型与 *ensoleillé* 相同：*le temps est* + 形容词。
  fr.a1.unit47.lesson02.teach.il_fait_froid:
    title: 寒冷
    gloss: 今天很冷。
    note: '*Aujourd''hui*（今天）表示天气所处的时间；*il fait froid* 用的是 *faire*，而不是 *être*。'
  fr.a1.unit47.lesson02.teach.il_fait_chaud:
    title: 温暖
    gloss: 今天很暖和。
    note: 在日常谈论天气时，*il fait chaud* 既可表示“暖和”，也可表示“热”。
  fr.a1.unit47.lesson02.teach.il_ne_fait:
    title: 对比气温
    gloss: 不冷，很暖和。
    note: '*Ne ... pas* 包在动词两侧：*il ne fait pas froid*。'
  fr.a1.unit47.lesson03.teach.la_meteo:
    title: 天气预报
    gloss: 天气预报
    note: '*La météo* 是阴性名词，是 *la météorologie* 的简称。'
    example_gloss: 天气预报怎么说？
  fr.a1.unit47.lesson03.teach.demain_le_temps:
    title: 明天的天气
    gloss: 明天天气晴朗。
    note: '*Demain* 放在句首，后面加逗号；句子其余部分保持正常语序。'
  fr.a1.unit47.lesson03.teach.samedi_le_temps:
    title: 两天的天气预报
    gloss: 周六晴朗温暖，但周日下一整天的雨。
    note: '*Toute la journée*（一整天）强调雨下的时间之长。'
  fr.a1.unit47.lesson04.teach.la_promenade:
    title: 散步
    gloss: 这次散步
    note: '*Promenade* 是阴性名词：*la promenade*。'
    example_gloss: 我们去散步好吗？
  fr.a1.unit47.lesson04.teach.on_fait_une:
    title: 提议散步
    gloss: 我们去散步好吗？
    note: '*On fait une promenade ?* 是提出计划的友好说法；*faire une promenade* 是表示“去散步”的固定搭配。'
  fr.a1.unit47.lesson04.teach.s_il_pleut:
    title: 有条件的计划
    gloss: 如果下雨，我们就待在室内。
    note: '*S''il pleut*（如果下雨）：*si* + *il* 变成 *s''il*；然后用 *on reste à l''intérieur* 说明要做什么。'
  fr.a1.unit47.lesson04.teach.bonne_idee_faisons:
    title: 同意并提议
    gloss: 好主意！我们去散步吧。
    note: '*Faisons ...*（我们……吧）是提议活动的另一种常见说法，和 *On ... ?* 并用。'
  fr.a1.unit47.lesson05.teach.meteo_samedi_le:
    title: 阅读两天的天气预报
    gloss: 天气预报：周六晴朗温暖。周日下一整天的雨。
    note: 注意看每一天对应的天气。
    glosses:
      Météo: 天气预报
      samedi: 星期六
      ensoleillé: 晴朗的
      chaud: 温暖的
      Dimanche: 星期日
      pleut: 下雨
      toute: 整个的
      journée: 天
  fr.a1.unit47.lesson06.teach.camille_quel_temps:
    title: Camille 询问周末的天气
    gloss: Camille：这个周末天气怎么样？
    note: '*Ce week-end*（这个周末）使问题指向不久的将来。'
  fr.a1.unit47.lesson06.teach.mathieu_samedi_le:
    title: Mathieu 说出天气预报
    gloss: Mathieu：周六晴朗温暖，但周日下一整天的雨。
    note: 与前面阅读的天气预报完全一致。
  fr.a1.unit47.lesson06.teach.camille_alors_on:
    title: Camille 提出计划
    gloss: Camille：那我们周六去散步好吗？
    note: '*Alors*（那么）把提议与 Mathieu 刚说的好天气直接联系起来。'
  fr.a1.unit47.lesson06.teach.mathieu_bonne_idee:
    title: Mathieu 同意并安排周日
    gloss: Mathieu：好主意。周日我们就安安静静地待在室内。
    note: 这里的 *Tranquillement* 意为“悠闲地、不着急地”，让待在室内听起来很惬意。
  fr.a1.unit47.lesson06.teach.camille_parfait_alors:
