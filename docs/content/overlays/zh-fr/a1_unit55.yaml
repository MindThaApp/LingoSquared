  fr.a1.unit55.lesson04.teach.courir_est_un:
    title: Courir 是不规则动词
    gloss: '*Courir*（跑步）是不规则动词：*je cours, tu cours, il court*。词尾的 *s* 和 *t* 不发音。'
    note: '*Courir* 不遵循规则的 *-er* 动词变位，所以这些形式值得背下来：*je cours*、*tu cours*、*il court*。'
