    title: 我踢足球
    gloss: 我踢足球。
    note: '*Jouer au* + 球类运动是表达踢足球的常用方式。其他运动用 *faire du* 或 *faire de la*，见语法说明。'
  fr.a1.unit55.lesson01.teach.faire_du_de:
    title: Faire du / de la + sport
    gloss: '*Faire du*、*de la* 或 *de l''* + 运动，说明你做的是哪项运动：*faire du yoga*、*faire de la natation*、*faire de la course à pied*。说足球时要用 *jouer au football*。'
    note: 一种结构适用于所有运动——现阶段不需要为每项运动单独学一个动词。
  fr.a1.unit55.lesson02.teach.fois_par_semaine:
    title: 每周……次
    gloss: 每周……次
    example_gloss: 我每周做两次瑜伽。
  fr.a1.unit55.lesson02.teach.tu_connais_deja:
    title: Fois par semaine 与 tous les jours/souvent 的对比
    gloss: 你已经学过 *tous les jours*（每天）和 *souvent*（经常）。*Deux fois par semaine*（每周两次）是更具体地表达频率的新说法。
    note: 这是在爱好单元已学频率词汇的基础上进行扩展。
  fr.a1.unit55.lesson02.teach.je_fais_du:
    title: 我每周做两次瑜伽
    gloss: 我每周做两次瑜伽。
  fr.a1.unit55.lesson02.teach.mathieu_joue_souvent:
    title: Mathieu经常踢足球
    gloss: Mathieu经常踢足球。
    note: 沿用了之前单元讲日常生活时已出现的 *souvent*（经常）。
  fr.a1.unit55.lesson03.teach.tu_connais_deja:
    title: Faire du sport 与 faire de la + 运动
    gloss: 你在爱好一课中已经学过 *faire du sport*（*Je fais du sport le samedi*）。*Faire de la* + 运动名称指明具体的运动：*Je fais de la natation*。两种说法在法语中都正确。
    note: '*Faire du sport* 沿用自爱好单元，并非新内容。这里把它与说出具体运动的说法作对照：一种是泛指，一种是具体所指。'
