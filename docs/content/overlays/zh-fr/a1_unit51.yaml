teaching:
  fr.a1.unit51.lesson01.teach.combien_ca_coute:
    title: 询问总价
    gloss: 总共多少钱?
    note: '*En tout*（一共）表明你想问的是合计的总价，而不是单件商品的价格。'
  fr.a1.unit51.lesson01.teach.ca_coute_vingt:
    title: 说出总价
    gloss: 一共二十五欧元。
    note: '*Ça coûte* 中，*ça*（它）搭配 *coûte*，即 *coûter*（价格为）用于单个事物时的形式。'
  fr.a1.unit51.lesson02.teach.payer_par_carte:
    title: 刷卡或用现金付款
    gloss: 刷卡支付,用现金支付
    note: '*Payer par carte* 是“刷卡付款”的常用说法，*payer en espèces* 表示付现金。*carte* 前用 *par*，*espèces* 前用 *en*。'
    example_gloss:
    - 我可以在这里刷卡支付吗?
    - 我付现金。
  fr.a1.unit51.lesson02.teach.je_peux_payer:
    title: 询问是否可以刷卡
    gloss: 我可以在这里刷卡支付吗?
    note: '*Ici*（这里）表明你是在你所站的柜台前提出这个问题。'
  fr.a1.unit51.lesson02.teach.vous_voulez_payer:
    title: 询问付款偏好
    gloss: 您想用现金还是刷卡?
    note: '*Vous voulez ... ?* 是正式的问法，收银员对不认识的顾客会这样问；朋友之间则说 *tu veux ... ?*。'
  fr.a1.unit51.lesson03.teach.l_addition:
    title: 账单
    gloss: 这份账单
    note: '*Addition* 是阴性名词：*l''addition*。*La* 在元音前缩写为 *l''*。'
    example_gloss: 我们分摊账单好吗?
  fr.a1.unit51.lesson03.teach.on_partage_l:
    title: 提议分摊账单
    gloss: 我们分摊账单好吗?
    note: '*On ... ?* 用来提议一起做某事，如 *On partage ?*。*Partager*（分摊）可以与 *l''addition* 搭配。'
  fr.a1.unit51.lesson03.teach.je_peux_payer:
    title: 请求分开付款
    gloss: 我可以分开付款吗?
    note: '*Séparément*（分开地）紧跟在 *payer* 之后；这是礼貌地请求各付各的账的说法。'
  fr.a1.unit51.lesson04.teach.la_monnaie:
    title: 找零
    gloss: 找零
    note: '*Monnaie* 是阴性名词：*la monnaie*。它指找回的硬币和零钱。'
    example_gloss: 这是您的找零。
  fr.a1.unit51.lesson04.teach.voici_votre_monnaie:
    title: 递上找零
    gloss: 这是您的找零。
    note: '*Votre* 是正式的“您的”，与柜台前使用的 *vous* 的语体一致。'
  fr.a1.unit51.lesson04.teach.je_n_ai:
    title: 谢绝找零
    gloss: 我不需要找零。
    note: '*Avoir besoin de*（需要）后面接名词：*Je n''ai pas besoin de monnaie.* 在 *ne ... pas* 之后，*de* 取代 *de la*。'
  fr.a1.unit51.lesson05.teach.trente_cinq:
    title: 三十五
    gloss: 三十五
    note: '*Trente-cinq* 中间要写连字符，并且先说十位：三十 + 五。'
    example_gloss: 三十五欧元。
  fr.a1.unit51.lesson05.teach.addition_deux_plats:
    title: 阅读餐厅账单
    gloss: 账单:两份主菜和两杯咖啡。总计:三十五欧元。已刷卡支付。
    note: 注意点了什么、总额是多少以及付款方式。
    glosses:
      Addition: 账单
      deux: 二
      plats: 主菜
      cafés: 咖啡
      Total: 总额
      trente-cinq: 三十五
      euros: 欧元
      Payé: 已支付
      carte: 银行卡
  fr.a1.unit51.lesson06.teach.camille_on_demande:
    title: Camille 要求结账
    gloss: Camille：我们要结账吗？
    note: '*Demander*（要求）直接带宾语 *l''addition*，中间不需要其他词。'
  fr.a1.unit51.lesson06.teach.mathieu_oui_bonne:
    title: Mathieu 询问总价
    gloss: Mathieu：好，好主意。一共多少钱？
    note: 重复使用第 1 课中的问句 *Combien ça coûte en tout ?*。
  fr.a1.unit51.lesson06.teach.camille_ca_fait:
    title: Camille 说出总价
    gloss: Camille：一共三十五欧元。我们平摊吗？
    note: '*Ça fait* + 金额用来说出总价，而 *partager* 指的就是分摊这张账单。'
  fr.a1.unit51.lesson06.teach.mathieu_non_laisse:
    title: Mathieu 坚持要付钱
    gloss: Mathieu：不，今天让我来付。你帮了我这么多。
    note: '*Laisse-moi* + 动词原形表示提出由自己来做某事；*aidé* 是 *aider*（帮助）的过去分词。'
  fr.a1.unit51.lesson06.teach.camille_c_est:
    title: Camille 很感动
    gloss: Camille：你真好！谢谢。
    note: '*C''est gentil de ta part*（你真好）是对慷慨举动表示感谢的常用暖心说法。'
  fr.a1.unit51.lesson06.teach.mathieu_je_peux:
    title: Mathieu 询问能否刷卡
    gloss: Mathieu：我可以在这里刷卡吗？
    note: 重复使用第 2 课中的 *Je peux payer par carte ici ?*，这次是在真正的餐厅里。
  fr.a1.unit51.lesson06.teach.mathieu_paie_l:
    title: Paie：il/elle 的变位形式
    gloss: 马蒂厄付账。
    note: '*Paie* 是 *payer*（付款）的 *il/elle* 形式：*je paie, tu paies, il paie*。'
