course:
  title: 法语 A1
  description: 表达并询问基本的喜好、厌恶和偏好，延续 Inès 和 Mathieu 的烹饪工作坊故事：他们要为周六在两种食谱中做选择。重点提示：*préférer X à Y*（比起 Y 更喜欢 X）用 *à*，而不是 *que*。
units:
  fr.a1.unit13.preferences:
    title: 你更喜欢什么？
lessons:
  fr.a1.unit13.lesson01.vocabulaire_preferences:
    title: 喜欢、偏爱、讨厌
  fr.a1.unit13.lesson02.demander_les_preferences:
    title: 询问偏好
  fr.a1.unit13.lesson03.dialogue_choisir_la_recette:
    title: 选择周六的食谱
teaching:
  fr.a1.unit13.lesson01.teach.preferer:
    title: 更喜欢
    gloss: 更喜欢
    note: '*Préférer* 是词干变音的 -ER 动词：*je préfère*，但 *nous préférons*（*nous/vous* 形式不变音）。'
    example_gloss: 我更喜欢巧克力派。
  fr.a1.unit13.lesson01.teach.aimer_mieux:
    title: 更喜欢
    gloss: 更爱
    note: '*Aimer mieux* 是 *préférer* 的常见替代说法，但比较时用 *que*（*aimer mieux X que Y*），而 *préférer* 用 *à*（*préférer X à Y*）。'
    example_gloss: 比起甜的菜，我更喜欢咸的菜。
  fr.a1.unit13.lesson01.teach.detester:
    title: 讨厌
    gloss: 讨厌
    note: '*Détester* 表示强烈的厌恶，比 *ne pas aimer*（不喜欢）更强。'
    example_gloss: Mathieu 讨厌太辣的香料，他更喜欢口味清淡的菜。
  fr.a1.unit13.lesson01.teach.plutot:
    title: 倾向于
    gloss: 倾向于
    note: '*Plutôt* 使偏好的语气变得委婉：表示“比较想要”这一个，但并不完全排除另一个。'
    example_gloss: 我还是吃奶酪吧。
  fr.a1.unit13.lesson01.teach.sucre:
    title: 甜的
    gloss: 甜的
    note: '*Sucré* 形容食物的甜味，不同于 *doux*（柔和、温和），这两个词容易混淆。'
    example_gloss: 这道甜点很甜。
  fr.a1.unit13.lesson01.teach.sale:
    title: 咸的
    gloss: 咸的
    note: 在法语美食词汇中，*salé* 是 *sucré* 的标准反义词，既可指“咸味的”，也可指与甜点相对的“咸口的”。
    example_gloss: 这种奶酪很咸。
  fr.a1.unit13.lesson01.teach.la_recette:
    title: 食谱
    gloss: 食谱
    note: '*La recette* 永远是阴性。'
    example_gloss: 这个食谱很简单。
  fr.a1.unit13.lesson02.teach.quest_ce_que_tu_preferes:
    title: 询问偏好
    gloss: 你更喜欢什么？
    note: '*Qu''est-ce que...* 是法语口语中构成“什么”类开放式问句的标准方式。'
  fr.a1.unit13.lesson02.teach.je_prefere_x_a_y:
    title: 在两者之间表达偏好
    gloss: 比起咸派，我更喜欢水果派。
    note: '*Préférer X à Y* 用 *à* 引出不太喜欢的那个选项，而不用 *que*。'
  fr.a1.unit13.lesson02.teach.tu_aimes_plutot:
    title: 询问一般倾向
    gloss: 你更喜欢甜的还是咸的？
    note: 把 *plutôt*（第1课）与带 *ou*（或者）的选择疑问句结合起来。
  fr.a1.unit13.lesson02.teach.moi_aussi_moi_non:
    title: 表示同意或不同意
    gloss: 我也是。／我不。
    note: '*Moi aussi* 表示同意肯定的说法；*moi non* 表示不同意，或说出相反的偏好。'
  fr.a1.unit13.lesson02.teach.ca_ne_me_derange_pas:
    title: 表示自己无所谓
    gloss: 我无所谓。
    note: 被要求做选择时，*Ça ne me dérange pas* 是一种实用、中性的说法，表示两个选项都可以接受。
  fr.a1.unit13.lesson02.teach.on_pourrait_faire:
    title: 提出一个选择
    gloss: 我们可以做一个咸派，对吧？
    note: '*On pourrait*（我们可以）加动词原形，委婉地提出建议，并用句末的 *non ?* 征求对方同意。'
  fr.a1.unit13.lesson03.teach.line01:
    title: 询问要做什么
    gloss: Mathieu 问周六做什么——水果派还是咸派？
    note: '*Qu''est-ce qu''on prépare... ?*（我们做什么）用 *on* 表示“我们”，这在日常口语中很常见。'
  fr.a1.unit13.lesson03.teach.line02:
    title: 表达偏好并反问对方
    gloss: Inès 说她更喜欢水果派，偏甜一点的，然后问 Mathieu。
    note: '*Et toi ?*（那你呢？）是把陈述变成对对方提问的最简单方式。'
  fr.a1.unit13.lesson03.teach.line03:
    title: 表达相反的偏好
    gloss: Mathieu 说他更爱咸口的，比起水果派更喜欢咸派。
    note: 直接再次使用第2课的 *préférer X à Y* 句型。
  fr.a1.unit13.lesson03.teach.line04:
    title: 提出折中办法
    gloss: Inès 提议两个都可以做，不是吗？
    note: '*Les deux*（两个都）通过提议两种食谱都做，化解了分歧。'
  fr.a1.unit13.lesson03.teach.line05:
    title: 接受折中办法
    gloss: Mathieu 说好主意，他完全不介意。
    note: '*Ça ne me dérange pas du tout* 用 *du tout*（完全）加强了第2课的说法。'
  fr.a1.unit13.lesson03.teach.line06:
    title: 确认决定
    gloss: Inès 说太好了，周六做一个甜的水果派和一个咸的咸派。
    note: 清楚地重述最终决定，为这段对话收尾。
