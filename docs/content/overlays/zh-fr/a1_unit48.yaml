teaching:
  fr.a1.unit48.lesson01.teach.le_manteau_le:
    title: 大衣、毛衣
    gloss: 大衣、毛衣
    note: '*Le manteau* 和 *le pull* 都是阳性名词。'
    example_gloss:
    - 我在找一件大衣。
    - 我有一件毛衣。
  fr.a1.unit48.lesson01.teach.le_pantalon_les:
    title: 裤子、鞋子
    gloss: 裤子、鞋子
    note: 汉语说“一条裤子”,法语的 *pantalon* 也是单数:一条裤子用 *un pantalon*。*Chaussures* 是 *chaussure* 的复数;鞋子通常用复数来说,因为一般都是成双的。
    example_gloss:
    - 我在找一条裤子。
    - 我在找鞋子。
  fr.a1.unit48.lesson01.teach.je_cherche_un:
    title: 说出你在找什么
    gloss: 我在找一件大衣。
    note: '*Chercher*(寻找)后面直接接宾语,不需要介词,和汉语“找”一样:*je cherche un manteau*。'
  fr.a1.unit48.lesson02.teach.la_taille:
    title: 尺码
    gloss: 尺码
    note: '*Taille* 是阴性名词：*la taille*。'
    example_gloss: 你穿什么尺码？
  fr.a1.unit48.lesson02.teach.quelle_taille_faites:
    title: 询问尺码
    gloss: 你穿什么尺码？
    note: '*Quelle taille ?* 用 *quelle*（哪一个），因为 *taille* 是阴性名词，而且可能的答案范围很小（S、M、L 或一个数字）。'
  fr.a1.unit48.lesson02.teach.je_fais_du:
    title: 说出自己的尺码
    gloss: 我穿M码。
    note: '*Faire du M* 表示穿M码：法语用 *faire*（做）来表达尺码，而汉语说“穿”或“是”。'
  fr.a1.unit48.lesson03.teach.noir_bleu:
    title: 黑色，蓝色
    gloss: 黑色，蓝色
    note: 本课的两个基本颜色形容词。
    example_gloss:
    - 我想要黑色的大衣。
    - 这件你们还有蓝色的吗？
  fr.a1.unit48.lesson03.teach.je_veux_le:
    title: 指定颜色
    gloss: 我想要黑色的大衣。
    note: '*En* + 颜色是点衣服或提出要求时指明颜色的标准说法。'
  fr.a1.unit48.lesson03.teach.avez_vous_aussi:
    title: 询问其他颜色
    gloss: 这件你们还有蓝色的吗？
    note: '*Aussi*（也）用来询问是否还有别的颜色，这里使用的是敬称 *vous* 的正式说法。'
  fr.a1.unit48.lesson04.teach.est_ce_que:
    title: 询问是否合身
    gloss: 这件大衣合身吗?
    note: '*Aller*（去）是表达衣服合不合身的自然动词：*il me va bien*，字面意思是“它在我身上很合适”。'
  fr.a1.unit48.lesson04.teach.il_me_va:
    title: 表示很合身
    gloss: 很合身。
    note: '*Bien*（好）说明衣服合身的程度。'
  fr.a1.unit48.lesson04.teach.c_est_trop:
    title: 太小
    gloss: 太小了。
    note: '*Trop*（太）放在形容词之前，表示过度。'
  fr.a1.unit48.lesson04.teach.c_est_trop_2:
    title: 太大
    gloss: 太大了。
    note: 与上一张卡片 *trop petit* 相同，都是 *trop* + 形容词的结构。
  fr.a1.unit48.lesson05.teach.quatre_vingt_dix:
    title: 九十
    gloss: 九十
    note: '*Quatre-vingt-dix* 是数字90（字面意思是“四个二十加十”），这里用于大衣的价格。'
    example_gloss: 这件大衣九十欧元。
  fr.a1.unit48.lesson05.teach.le_manteau_coute:
    title: 说出价格
    gloss: 这件大衣九十欧元。
    note: '*Coûte* 是 *coûter*（价格为）的 *il* 变位形式。'
  fr.a1.unit48.lesson05.teach.parka_taille_m:
    title: 阅读商店小票
    gloss: 冬季大衣：M码，黑色。价格：九十欧元。这件大衣很合身，而且很暖和。
    note: 注意找出尺码、颜色、价格，以及大衣的两个优点。
    glosses:
      Parka: 冬季大衣
      taille: 尺码
      couleur: 颜色
      noire: 黑色的
      Prix: 票价
      quatre-vingt-dix: 九十
      euros: 欧元
      manteau: 大衣
      va: 合身
      chaud: 暖和
  fr.a1.unit48.lesson06.teach.camille_ce_manteau:
    title: Camille 注意到这件大衣
    gloss: Camille：这件大衣真好看！你穿多大尺码？
    note: '*Joli*（好看）是一种通用的称赞；这里用阳性形式，是为了和 *manteau* 一致。'
  fr.a1.unit48.lesson06.teach.mathieu_je_fais:
    title: Mathieu 请求试穿
    gloss: Mathieu：我穿M码。我可以试穿一下吗？
    note: '*Je peux ... ?* 是请求许可的标准说法；*l''essayer* 意思是“试穿它”，*l''* 指代这件大衣。'
  fr.a1.unit48.lesson06.teach.camille_bien_sur:
    title: Camille 询问是否合身
    gloss: Camille：当然可以。穿着合身吗？
    note: '*Il*（他，它）指代前面的 *le manteau*，这是一个阳性名词。'
  fr.a1.unit48.lesson06.teach.mathieu_oui_il:
    title: Mathieu 给出肯定回答
    gloss: Mathieu：嗯，很合身，而且很暖和。
    note: 与前面阅读的小票完全一致——这是同一件大衣。
  fr.a1.unit48.lesson06.teach.camille_super_tu:
    title: Camille 询问颜色
    gloss: Camille：太好了！你要黑色的还是蓝色的？
    note: '*Tu le veux en ... ou en ... ?* 用来提供选择；*le* 指代这件大衣。'
  fr.a1.unit48.lesson06.teach.mathieu_je_le:
    title: Mathieu 做出决定
    gloss: Mathieu：我买黑色的。
    note: '*Prendre*（拿，买下）是敲定购买选择时的自然动词，所选颜色与小票上的一致。'
  fr.a1.unit48.lesson06.teach.on_ecrit_prends:
    title: Prends 还是 prend
    gloss: '*Prends* 是 *prendre*（拿，买）的“我”和“你”的形式；*prend* 是“他/她”的形式。'
    note: '*prendre* 的变位规律：*je prends, tu prends, il/elle prend*。'
