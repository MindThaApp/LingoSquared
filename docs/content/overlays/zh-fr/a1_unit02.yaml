teaching:
  fr.a1.unit02.lesson01.teach.zero:
    title: 零
    gloss: 零
    note: '*Zéro* 既可以表示数字本身，也可在逐位读数字串时用作一个数位。'
  fr.a1.unit02.lesson01.teach.un:
    title: 一
    gloss: 一
    note: '*Un* 是阳性；阴性形式 *une* 出现在阴性名词前（*une tasse*，一个杯子）。单独数数时仍说 *un*。'
  fr.a1.unit02.lesson01.teach.deux:
    title: 二
    gloss: 二
    note: '*Deux* 不论名词的性别，形式都不变。'
  fr.a1.unit02.lesson01.teach.trois:
    title: 三
    gloss: 三
    note: '*Trois* 形式不变。'
  fr.a1.unit02.lesson01.teach.quatre:
    title: 四
    gloss: 四
    note: '*Quatre* 形式不变。'
  fr.a1.unit02.lesson01.teach.cinq:
    title: 五
    gloss: 五
    note: '*Cinq* 形式不变。词尾的 q 通常要发音，这与其他几个词尾辅音不发音的法语数字不同。'
  fr.a1.unit02.lesson01.teach.six:
    title: Six
    gloss: 六
    note: '*Six* 单独说时词尾发 /s/，但在以辅音开头的名词前，词尾辅音不发音（*six livres* 听起来像“si livres”）。'
  fr.a1.unit02.lesson01.teach.sept:
    title: 七
    gloss: 七
    note: '*Sept* 形式不变；p 不发音，只发词尾的 t。'
  fr.a1.unit02.lesson01.teach.huit:
    title: 八
    gloss: 八
    note: '*Huit* 形式不变。h 不发音，几乎所有法语单词里的 h 都是如此。'
  fr.a1.unit02.lesson01.teach.neuf:
    title: 九
    gloss: 九
    note: '*Neuf* 形式不变。'
  fr.a1.unit02.lesson01.teach.dix:
    title: 十
    gloss: 十
    note: '*Dix* 单独说时词尾发 /s/，与 *six* 一样，在辅音前词尾辅音不发音。'
  fr.a1.unit02.lesson02.teach.onze:
    title: 十一
    gloss: 十一
    note: '*Onze* 到 *seize*（11–16）各自是独立的词，不像二十一以后那样重复使用 *vingt*，它们不是由 *dix* 构成的。'
  fr.a1.unit02.lesson02.teach.douze:
    title: 十二
    gloss: 十二
    note: '*Douze* 是一个单独的词。它开头与 *deux* 相近，但其中看不到 *dix*。'
  fr.a1.unit02.lesson02.teach.treize:
    title: 十三
    gloss: 十三
    note: '*Treize* 是一个单独的词。它开头与 *trois* 相近，但其中看不到 *dix*。'
  fr.a1.unit02.lesson02.teach.quatorze:
    title: 十四
    gloss: 十四
    note: '*Quatorze* 是一个单独的词。它开头与 *quatre* 相近，但其中看不到 *dix*。'
  fr.a1.unit02.lesson02.teach.quinze:
    title: 十五
    gloss: 十五
    note: '*Quinze* 是一个单词，与 *cinq* 有一点远亲关系，但从中看不出 *dix*。'
  fr.a1.unit02.lesson02.teach.seize:
    title: 十六
    gloss: 十六
    note: '*Seize* 是最后一个连写成一体的“十几”形式；从 *dix-sept*（17）起，*dix* 又会与个位数明显地组合在一起。'
  fr.a1.unit02.lesson02.teach.vingt:
    title: 二十
    gloss: 二十
    note: '*Vingt* 是一个独立的单词。从二十一起，十位数和个位数组合在一起（*vingt et un*、*vingt-deux*），这一规律下文还会再讲。'
  fr.a1.unit02.lesson02.teach.trente:
    title: 三十
    gloss: 三十
    note: '*Trente* 与后面的个位数用连字符连接（*trente-quatre*），只有“一”例外，要用 *et*（*trente et un*）。'
  fr.a1.unit02.lesson02.teach.trente_quatre:
    title: 三十四
    gloss: 三十四
    note: '*Trente-quatre* 中间要写连字符；中文写“三十四”时则没有这样的符号。'
  fr.a1.unit02.lesson02.teach.soixante:
    title: 六十
    gloss: 六十
    note: 直到六十九，*Soixante* 的用法都和普通的整十数一样（*soixante-quatre*，64）；不规则的部分从七十开始，下一课会讲。
  fr.a1.unit02.lesson02.teach.soixante_dix:
    title: 七十
    gloss: 七十
    note: 这是法语数字中最大的“意外”：法语没有表示七十的专门单词，不像中文有“七十”。*Soixante-dix* 字面意思是“六十十”（60 + 10）。数字一直这样数到 *soixante-dix-neuf*（79，字面是“六十十九”），然后 *quatre-vingts* 才以八十为新的起点。
  fr.a1.unit02.lesson02.teach.quatre_vingts:
    title: 八十
    gloss: 八十
    note: '*Quatre-vingts* 字面意思是“四个二十”（4 x 20），是古代二十进制计数法的遗留。只有单独出现或位于数字末尾时，它才带最后的 s（*quatre-vingts*，80）；后面接个位数时 s 会去掉（*quatre-vingt-un*，81）。'
  fr.a1.unit02.lesson02.teach.quatre_vingt_dix:
    title: 九十
    gloss: 九十
    note: '*Quatre-vingt-dix* 字面意思是“四个二十加十”（4x20 + 10），与七十一样沿用二十进制的规律，一直到 *quatre-vingt-dix-neuf*（99）。'
  fr.a1.unit02.lesson02.teach.cent:
    title: 一百
    gloss: 一百
    note: 表示恰好 100 时，单独使用 *Cent*，前面不加冠词（不说“*un cent*”）。
  fr.a1.unit02.lesson03.teach.quel_age_as_tu:
    title: 非正式地询问年龄
    gloss: 你多大了？
    note: 法语字面上是问“你有多大的年龄”，用的是 *avoir*（有），而不是 *être*（是）。
  fr.a1.unit02.lesson03.teach.jai_vingt_huit_ans:
    title: 说出自己的年龄
    gloss: 我二十八岁。
    note: '*Ai* 是 *avoir* 的 je 形式。中文口语里可以省略“岁”（如“我二十八了”），但法语里 *ans*（年）不能省。'
  fr.a1.unit02.lesson03.teach.quel_age_avez_vous:
    title: 正式地询问年龄
    gloss: 你多大了？
    note: '*Avez-vous* 用的是 *avoir* 的 *vous* 形式，与第 1 单元确立的正式语体一致。'
  fr.a1.unit02.lesson03.teach.jai_trente_et_un_ans:
    title: 说出带个位的年龄
    gloss: 我三十一岁。
    note: '*Trente et un* 用 *et*（和）而不用连字符，这只适用于三十、四十、五十、六十的“一”结尾形式（*trente et un*、*quarante et un*、*cinquante et un*、*soixante et un*）。七十一打破了这一规律：它是 *soixante et onze*（六十加十一），而不是 *soixante et un*，因为七十几要借助 *dix* 的形式一直数到 *soixante-dix-neuf*（79）。'
  fr.a1.unit02.lesson03.teach.et_toi_quel_age:
    title: 反问对方的年龄
    gloss: 那你呢，你多大了？
    note: '*Et toi* 用来引出反问；*et* 后面为了强调要用重读人称代词 *toi*，而不是 *tu*。'
  fr.a1.unit02.lesson04.teach.quel_est_ton_numero:
    title: 询问电话号码
    gloss: 你的电话号码是多少？
    note: '*Quel* 与阳性名词 *numéro* 保持一致；如果是阴性名词，就要用 *quelle*。'
  fr.a1.unit02.lesson04.teach.numero_ines:
    title: 逐位读出的数字
    gloss: 零，六，一，五，零，二，九，七，四，三
    note: 法国的真实电话号码有十位数字，通常两位两位地读（*zéro six*、*quinze*、*zéro deux*……）。本单元的号码采用真实的十位格式（06 15 02 97 43），但逐个数字地读，方便你先练习单个数字。
  fr.a1.unit02.lesson04.teach.cest_le:
    title: 引出号码
    gloss: 是……
    note: 这里用 *Le*（阳性的“这个”），因为 *numéro* 是阳性名词。
  fr.a1.unit02.lesson04.teach.tu_peux_repeter:
    title: 请求重复
    gloss: 你能重复一遍吗？
    note: '*Peux* 是 *pouvoir*（能、可以）的 *tu* 形式；当别人报号码太快没听清时，这句话很有用。'
  fr.a1.unit02.lesson04.teach.bien_sur:
    title: 爽快答应
    gloss: 当然；好的
    note: '*Bien sûr* 是同意别人请求时常用的友好说法。'
  fr.a1.unit02.lesson05.teach.jai_besoin_trois_oeufs:
    title: 说明需要的数量
    gloss: 我需要三个鸡蛋。
    note: '*J''ai besoin de*（字面意思是“我有……的需要”）是法语表达“需要某物”的方式，用的是 *avoir*，而不是一个专门的动词。'
  fr.a1.unit02.lesson05.teach.combien_oeufs:
    title: 询问需要多少
    gloss: 你需要几个鸡蛋？
    note: '*De combien d''œufs* 以 *de combien*（多少的）开头，后面再接名词，整个结构放在句首；这与中文“需要多少个鸡蛋”的语序不同。'
  fr.a1.unit02.lesson05.teach.deux_tasses_farine:
    title: 说明计量的数量
    gloss: 两杯面粉
    note: '*De* 连接计量单位（*tasses*，杯）和被计量的东西（*farine*，面粉）。中文直接说“两杯面粉”，法语则必须加 de。'
  fr.a1.unit02.lesson05.teach.demi_tasse:
    title: 说明半份的数量
    gloss: 半杯糖
    note: '*Demi-* 作为前缀放在名词前时形式不变（*une demi-tasse*），而放在名词后的形容词 *demi* 则要变化（*une heure et demie*）。'
  fr.a1.unit02.lesson05.teach.jai_quatre_oeufs:
    title: 说明手头有什么
    gloss: 我桌上有四个鸡蛋。
    note: '*J''ai*（我有）说明已经有的东西，与 *j''ai besoin de*（我需要）不同，后者说明还缺少的东西。'
  fr.a1.unit02.lesson06.teach.line01:
    title: 询问要几个鸡蛋
    gloss: Inès 问 Mathieu 做这道食谱需要多少个鸡蛋。
    note: Inès 和 Mathieu 现在用 *tu*，而不是第 1 单元的 *vous*：作为工作坊的同伴，他们很快就改用了非正式的说法。
  fr.a1.unit02.lesson06.teach.line02:
    title: 说出所需食材
    gloss: Mathieu 说他需要三个鸡蛋和两杯面粉。
    note: '*J''ai besoin de* 说明做这道食谱还需要什么。'
  fr.a1.unit02.lesson06.teach.line03:
    title: 说出手头现有的东西
    gloss: Inès 说她桌上有四个鸡蛋，并问他是否还需要糖。
    note: '*J''ai* 说明 Inès 已经有的东西，与 Mathieu 说的需要的东西不同。'
  fr.a1.unit02.lesson06.teach.line04:
    title: 确认需要少量
    gloss: Mathieu 说需要，要一点，大约半杯。
    note: 这里的 *Environ* 表示“大约”，让数量显得不那么精确。
  fr.a1.unit02.lesson06.teach.line05:
    title: 询问电话号码
    gloss: Inès 说太好了，然后问 Mathieu 的电话号码，以便给他发信息通知下一节课。
    note: '*Comme ça je t''écris*（“这样我就可以给你发信息”）说明她为什么要问，在索要联系方式之前这样解释是很自然的交谈习惯。'
  fr.a1.unit02.lesson06.teach.line06:
    title: 报出电话号码
    gloss: Mathieu 逐个数字地读出他的号码。
    note: '*C''est le* 用来引出号码，与阳性名词 *numéro* 相配。'
  fr.a1.unit02.lesson06.teach.line07:
    title: 道谢并询问年龄
    gloss: Inès 向他道谢，然后再问最后一个问题：他多大了。
    note: '*Une dernière question*（“最后一个问题”）表示在同一次交谈中自然地转换话题。'
  fr.a1.unit02.lesson06.teach.line08:
    title: 说出他的年龄
    gloss: Mathieu 说他二十八岁，并向 Inès 问同样的问题。
    note: '*J''ai vingt-huit ans* 使用带连字符的合成形式。'
  fr.a1.unit02.lesson06.teach.line09:
    title: 说出她的年龄
    gloss: Inès 说她三十一岁。
    note: '*J''ai trente et un ans* 用 *et*（和）而不用连字符，因为三十一属于前面学过的“一”结尾的特殊形式。'
