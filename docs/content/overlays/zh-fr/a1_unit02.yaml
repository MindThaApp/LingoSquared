course:
  title: 法语 A1
  description: 数字 0–100（包括 soixante-dix、quatre-vingts、quatre-vingt-dix 的特殊形式）、年龄、电话号码和食谱用量，延续第一单元中 Inès 和 Mathieu 在烹饪工作坊的情境。针对中文学习者的提示着重讲解用 avoir 表达年龄、法语数字中的二十进制残留，以及数量短语中的性别配合。
