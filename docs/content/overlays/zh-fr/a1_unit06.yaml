course:
  title: 法语 A1
  description: 一天中的时段与钟点表达（heure(s)、et quart、et demie、moins le quart），延续伊内斯和马蒂厄的烹饪工作坊故事，安排他们的下一次活动。法语在正式或日程场合使用24小时制（dix-huit heures trente），与本单元前面学过的非正式12小时制说法并用。
units:
  fr.a1.unit06.time:
    title: 现在几点？
lessons:
  fr.a1.unit06.lesson01.moments_de_la_journee:
    title: 一天中的时段
  fr.a1.unit06.lesson02.dire_lheure:
    title: 表达时间
  fr.a1.unit06.lesson03.dialogue_prochain_atelier:
    title: 下一次工作坊
teaching:
  fr.a1.unit06.lesson01.teach.heure:
    title: 小时；时间；钟点
    gloss: 小时；时间；钟点
    note: '*Heure* 是阴性名词；也用来表示钟点（*dix heures* = 十点）。'
    example_gloss: 现在几点？
  fr.a1.unit06.lesson01.teach.matin:
    title: 早上
    gloss: 早上
    note: '*Matin* 是阳性名词。'
    example_gloss: 市场早上营业。
  fr.a1.unit06.lesson01.teach.apres_midi:
    title: 下午
    gloss: 下午
    note: '*Après-midi* 可以是阳性或阴性（阳性更常见）；*l''* 在元音前省音。'
    example_gloss: 我下午工作。
  fr.a1.unit06.lesson01.teach.soir:
    title: 晚上
    gloss: 晚上
    note: '*Soir* 是阳性名词。'
    example_gloss: 烹饪工作坊在晚上。
  fr.a1.unit06.lesson01.teach.midi:
    title: 中午
    gloss: 中午
    note: '*Midi* 表示时间点时不带冠词（说 *à midi*，不说 *au midi*）。'
    example_gloss: 我们中午吃饭。
  fr.a1.unit06.lesson01.teach.minuit:
    title: 午夜
    gloss: 午夜
    note: '*Minuit* 和 *midi* 一样，不带冠词。'
    example_gloss: 工作坊从不会持续到午夜以后。
  fr.a1.unit06.lesson01.teach.latelier_commence_le_soir:
    title: 说明工作坊的时间
    gloss: 工作坊在晚上开始，不是早上。
    note: 直接对比 *le soir* 和 *le matin*，用到了本课词汇中的这两个名词。
  fr.a1.unit06.lesson02.teach.quelle_heure_est_il:
    title: 询问时间
    gloss: 几点了？
    note: '*Quelle heure est-il ?* 是询问时间的标准通用说法；*-il* 与动词倒装，表示疑问。'
  fr.a1.unit06.lesson02.teach.il_est_dix_heures:
    title: 说出整点
    gloss: 现在十点。
    note: '*Il est* + 数字 + *heures* 是表示任何整点的基本句型；除了 *une heure*（一点），*heures* 都用复数。'
  fr.a1.unit06.lesson02.teach.et_quart:
    title: 说出几点一刻
    gloss: 现在十点一刻。
    note: '*Et quart*（加一刻钟）表示在整点上加十五分钟。'
  fr.a1.unit06.lesson02.teach.et_demie:
    title: 说出几点半
    gloss: 现在十点半。
    note: '*Et demie*（加半小时）表示加三十分钟；*demie* 带阴性词尾 -e，与 *heure* 一致。'
  fr.a1.unit06.lesson02.teach.moins_le_quart:
    title: 说出差一刻几点
    gloss: 现在差一刻十一点。
    note: '*Moins le quart*（减去一刻）是从下一个整点往回数，而不是从当前整点往后数。这一点和汉语“差一刻十一点”的思路相同，注意别搞混。'
  fr.a1.unit06.lesson02.teach.a_quelle_heure:
    title: 询问某事几点开始
    gloss: 工作坊几点开始？
    note: 询问已安排好的活动时间用 *À quelle heure ?*（在几点），它不同于一般的 *Quelle heure est-il ?*。
  fr.a1.unit06.lesson03.teach.line01:
    title: 询问下周的开始时间
    gloss: 伊内斯问下周的工作坊几点开始。
    note: '*La semaine prochaine*（下周）与本课的 *à quelle heure* 问句搭配使用。'
  fr.a1.unit06.lesson03.teach.line02:
    title: 说明开始时间
    gloss: 马蒂厄说他记得是十八点三十分（晚上6:30）开始。
    note: '*Dix-huit heures trente* 采用24小时制，在法语日程场合很常见，不同于非正式的 *et demie* 说法。'
  fr.a1.unit06.lesson03.teach.line03:
    title: 确认是晚上
    gloss: 伊内斯确认：是晚上，不是早上？
    note: 一个简短的确认问句，对比 *le soir* 和 *le matin*。
  fr.a1.unit06.lesson03.teach.line04:
    title: 确认并解释原因
    gloss: 马蒂厄确认是晚上，下班后更方便。
    note: '*Après le travail*（下班后）给出了一个简单实际的理由。'
  fr.a1.unit06.lesson03.teach.line05:
    title: 询问结束时间
    gloss: 伊内斯问几点结束。
    note: '*Finit*（结束）与第二句中的 *commence*（开始）形成对比。'
  fr.a1.unit06.lesson03.teach.line06:
    title: 说明结束时间
    gloss: 马蒂厄说大约二十点十五分（晚上8:15）结束，和平时一样。
    note: '*Vers*（大约）表示大概的时间，比表示精确时间的 *à* 更随意。'
  fr.a1.unit06.lesson03.teach.line07:
    title: 确认计划
    gloss: 伊内斯确认：下周十八点三十分见！
    note: 重复已确认的时间来结束对话，这是法语中确认计划的自然方式。
