teaching:
  fr.a1.unit46.lesson01.teach.l_appartement_le:
    title: 公寓、客厅、卧室
    gloss: 公寓、客厅、卧室
    note: '*L''appartement* 是阳性，前面的冠词 *le* 省去 *e* 变成 l''；*le salon* 是阳性，*la chambre* 是阴性。'
    example_gloss:
    - 我有一套公寓。
    - 我有一间客厅。
    - 我有一间卧室。
  fr.a1.unit46.lesson01.teach.la_cuisine_la:
    title: 厨房、浴室
    gloss: 厨房、浴室
    note: '*La cuisine* 和 *la salle de bains* 都是阴性。'
    example_gloss:
    - 我有一间厨房。
    - 我有一间浴室。
  fr.a1.unit46.lesson01.teach.j_ai_un:
    title: 说明你有一套公寓
    gloss: 我有一套公寓。
    note: 说自己拥有什么样的住所，法语自然用 *Avoir*（有），和汉语的“有”很相似。这只是一个一般的例子；Mathieu 自己在里昂的公寓会在本单元稍后出现。
  fr.a1.unit46.lesson01.teach.j_ai_un_2:
    title: 列出所有房间
    gloss: 我有客厅、卧室、厨房和浴室。
    note: 用一句话列出本课词汇中的全部四个房间，之间用逗号隔开，最后一项前加 *et*。
  fr.a1.unit46.lesson02.teach.tu_as_combien:
    title: 询问有几个房间
    gloss: 你有几个房间？
    note: '*Combien de*（多少）后面接复数名词：*combien de pièces*。'
  fr.a1.unit46.lesson02.teach.j_ai_deux:
    title: 说明房间数量
    gloss: 我有两间卧室。
    note: '*Chambres* 是 *chambre* 的复数形式，按规则加不发音的 *-s* 构成。'
  fr.a1.unit46.lesson02.teach.l_appartement_a:
    title: 说明房间总数
    gloss: 这套公寓有三个房间。
    note: '*Pièces* 是“房间”的统称，不只指卧室。'
  fr.a1.unit46.lesson03.teach.le_balcon_le:
    title: 阳台、花园
    gloss: 阳台，花园
    note: '*Le balcon* 和 *le jardin* 都是阳性名词。'
    example_gloss:
    - 有一个阳台。
    - 没有花园。
  fr.a1.unit46.lesson03.teach.il_y_a:
    title: 表示某物存在
    gloss: 有一个阳台。
    note: '*Il y a* 是法语表示“存在”的标准句式，相当于汉语的“有”。'
  fr.a1.unit46.lesson03.teach.il_n_y:
    title: 表示某物不存在
    gloss: 没有花园。
    note: '*Pas de* 用来否定不定名词：说 *pas de jardin*，不说 *pas un jardin*。'
  fr.a1.unit46.lesson04.teach.cosy:
    title: 温馨舒适
    gloss: 温馨的
    note: 这是法语里很常用、很有特色的形容词，形容温暖惬意的氛围，很难用汉语中的某一个词精确对应。
    example_gloss: 这套公寓小，但很温馨。
  fr.a1.unit46.lesson04.teach.l_appartement_est:
    title: 常见的描述句式
    gloss: 这套公寓小，但很温馨。
    note: '*Petit mais cosy* 是法国人积极评价小户型住所时非常自然的说法。'
  fr.a1.unit46.lesson04.teach.le_salon_est:
    title: 描述房间的大小
    gloss: 客厅很大。
    note: '*Grand* 描述的是某一个具体的房间，而不是整个住所；它与阳性的 *le salon* 保持一致。'
  fr.a1.unit46.lesson04.teach.la_cuisine_est:
    title: 描述另一个房间的大小
    gloss: 厨房很小。
    note: 句式与上一张卡片中的 *grand* 相同，只是换了房间：*la cuisine* 是阴性，所以用 *petite*。
  fr.a1.unit46.lesson05.teach.appartement_a_lyon:
    title: 阅读租房广告
    gloss: 里昂的公寓：一间卧室、一个客厅、一个厨房和一间浴室。有阳台，但没有花园。公寓小，但很温馨。
    note: 留意房间数量、有哪些设施、没有哪些设施，以及整体给人的印象。
    glosses:
      Appartement: 公寓
      chambre: 卧室
      salon: 客厅
      cuisine: 厨房
      bains: 卫生间
      balcon: 阳台
      jardin: 花园
      petit: 小的
      cosy: 温馨的
  fr.a1.unit46.lesson06.teach.camille_salut_mathieu:
    title: Camille 询问公寓的情况
    gloss: Camille：嗨，Mathieu，你在里昂的新公寓怎么样？
    note: '*Nouvel* 是 *nouveau*（新的）用在以元音开头的阳性名词前的形式：*un nouvel appartement*。'
  fr.a1.unit46.lesson06.teach.mathieu_il_est:
    title: Mathieu 介绍公寓
    gloss: Mathieu：不大，但很温馨。我有一间卧室、一个客厅、一个厨房和一间浴室。
    note: 与前面阅读的租房广告完全一致——这就是 Mathieu 的公寓。
  fr.a1.unit46.lesson06.teach.camille_tu_as:
    title: Camille 询问阳台
    gloss: Camille：你有阳台吗？
    note: 用 *Tu as ... ?* 直接提出是非问句。
  fr.a1.unit46.lesson06.teach.mathieu_oui_j:
    title: Mathieu 回答
    gloss: Mathieu：有，我有阳台，但没有花园。
    note: 与前面广告中“有阳台、没有花园”的信息一致。
  fr.a1.unit46.lesson06.teach.balcon_est_masculin:
    title: balcon 的词性
    gloss: '*Balcon* 是阳性名词：un balcon，它很小。'
    note: '*Il*（他；它）代替 *balcon* 这样的阳性名词，所以形容词也用阳性：*il est petit*。'
  fr.a1.unit46.lesson06.teach.camille_ca_a:
    title: Camille 热情地回应
    gloss: Camille：听起来不错！我很快就去看你。
    note: '*Je passerai te voir*（我会去看你）由将来时 *passerai* 加 *te voir*（看你）构成。'
  fr.a1.unit46.lesson06.teach.mathieu_super_tu:
    title: Mathieu 欢迎她
    gloss: Mathieu：太好了，随时欢迎你。
    note: '*Toujours la bienvenue*（随时受欢迎）是热情邀请对方再来的说法；这里 *bienvenue* 是阴性，因为它指的是 Camille。'
