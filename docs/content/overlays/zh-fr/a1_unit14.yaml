course:
  title: 法语 A1
  description: 学习基本的比较句（plus/moins/aussi... que）和最高级（le/la plus...），延续伊内斯和马蒂厄的烹饪工作坊故事：两人购物时比较两种奶酪。特别提示：*meilleur*（更好）和 *le meilleur*（最好）是不规则形式，不同于大多数其他形容词使用的规则结构 *plus... que*。
units:
  fr.a1.unit14.comparisons:
    title: 更多还是更少？
lessons:
  fr.a1.unit14.lesson01.vocabulaire_comparaisons:
    title: 更多、更少、一样
  fr.a1.unit14.lesson02.superlatifs:
    title: 最多、最少
  fr.a1.unit14.lesson03.dialogue_comparer_fromages:
    title: 在市场比较两种奶酪
teaching:
  fr.a1.unit14.lesson01.teach.plus_que:
    title: 比……更……
    gloss: 比……更……
    note: '*Plus + 形容词 + que* 是法语标准的比较级结构，形容词本身不变形，和中文的“比……更……”类似。'
    example_gloss: 这块奶酪比另一块贵。
  fr.a1.unit14.lesson01.teach.moins_que:
    title: 不如……那么……
    gloss: 不如……那么……
    note: 在同一个比较结构中，*moins* 与 *plus* 正好相反。
    example_gloss: 这个食谱没有另一个那么难。
  fr.a1.unit14.lesson01.teach.aussi_que:
    title: 和……一样……
    gloss: 和……一样……
    note: '*Aussi + adjective + que* 表示两个事物相等。'
    example_gloss: 这个塔和乳蛋派一样好吃。
  fr.a1.unit14.lesson01.teach.meilleur_que:
    title: 比……更好
    gloss: 比……更好
    note: '*Meilleur* 是 *bon*（好）的不规则比较级，法语不说 *plus bon*。'
    example_gloss: 这个蛋糕比第一个更好。
  fr.a1.unit14.lesson01.teach.cher_bon_marche:
    title: 贵、便宜
    gloss: 贵、便宜／划算
    note: '*Bon marché* 是不变形的，虽然看起来应该像其他形容词一样做性数配合。'
    example_gloss:
    - 这块奶酪很贵。
    - 这些蔬菜很便宜。
  fr.a1.unit14.lesson01.teach.facile_difficile:
    title: 容易、困难
    gloss: 容易、困难
    note: 描述食谱时常用的一对形容词；阳性和阴性形式相同，复数加 -s（*faciles*、*difficiles*）。
    example_gloss:
    - 这个食谱很简单。
    - 这个乳蛋派有点难。
  fr.a1.unit14.lesson02.teach.le_plus_cher:
    title: 最贵的
    gloss: 最贵的
    note: '*Le/la plus + 形容词* 构成最高级，必须带定冠词，这一点与比较级不同。'
    example_gloss: 这是市场上最贵的奶酪。
  fr.a1.unit14.lesson02.teach.la_moins_chere:
    title: 最便宜的
    gloss: 最便宜的
    note: '*La moins chère* 与阴性名词 *recette* 保持一致；阳性形式是 *le moins cher*。'
    example_gloss: 这是最便宜的食谱。
  fr.a1.unit14.lesson02.teach.le_meilleur:
    title: 最好的
    gloss: 最好的
    note: '*Le meilleur* 是 *bon* 的不规则最高级，与前面学过的不规则比较级 *meilleur* 相对应。'
    example_gloss: 这是工作坊里最好吃的蛋糕！
  fr.a1.unit14.lesson02.teach.la_plus_facile:
    title: 最容易的
    gloss: 最容易的
    note: 这是规则的最高级，直接遵循 *le/la plus + 形容词* 的结构。
    example_gloss: 这是最容易做的食谱。
  fr.a1.unit14.lesson02.teach.grammar_superlative_note:
    title: 最高级结构
    gloss: le/la plus + 形容词；meilleur 是不规则形式
    note: 大多数法语最高级是规则的（*le/la plus + 形容词*），但 *bon* → *meilleur* → *le meilleur* 是需要记住的例外。
  fr.a1.unit14.lesson02.teach.comparer_les_prix:
    title: 建议比较价格
    gloss: 买之前我们先比较一下价格吧。
    note: '*Comparons* 是 *comparer* 的 *nous* 形式祈使句，意思是“我们来比较一下”，是购物时很自然的说法。'
  fr.a1.unit14.lesson03.teach.line01:
    title: 发现有两个选择
    gloss: 伊内斯说：看，有两种奶酪，我们买哪一种？
    note: '*Lequel*（哪一个）用来请对方在已经提到的两个选项中做选择。'
  fr.a1.unit14.lesson03.teach.line02:
    title: 比较并评价品质
    gloss: 马蒂厄说这一块比另一块贵，但看起来更好。
    note: '*Avoir l''air* + 形容词（看起来）可以让还没尝过的品质评价显得委婉。'
  fr.a1.unit14.lesson03.teach.line03:
    title: 不同意这个比较
    gloss: 伊内斯问他是不是这样想，并说她觉得另一块一样好，而且更便宜。
    note: 在一句回答中用了前面学过的 *aussi* 和 *moins*，礼貌地表示不同意；这里省略了 *que*，因为被比较的奶酪（马蒂厄选的那块）从上下文中就很清楚。
  fr.a1.unit14.lesson03.teach.line04:
    title: 承认价格更低
    gloss: 马蒂厄同意：没错，这是两块里最便宜的。
    note: '*Des deux*（两者之中）把最高级的范围限定在这两块之间，而不是整个市场。'
  fr.a1.unit14.lesson03.teach.line05:
    title: 做出最后决定
    gloss: 伊内斯说：那我们就买那一块吧，它是工作坊最好的选择。
    note: '*Celui-là*（那一个）指回刚刚讨论过的更便宜的那块奶酪。'
  fr.a1.unit14.lesson03.teach.line06:
    title: 说出好处
    gloss: 马蒂厄表示同意，并说他们还能剩下更多钱买甜点！
    note: '*Il nous reste*（字面意思是“剩给我们”）是表达“我们还剩下……”的常用说法。'
