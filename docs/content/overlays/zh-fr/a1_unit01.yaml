answer_policy:
  diacritics: 'Teach and display standard French accents and the cedilla. For free-typed A1 answers, accept otherwise-correct forms without diacritics, including ca for ça, tres for très, and enchante for enchanté. This leniency does not erase meaningful letters: masculine enchanté and feminine enchantée remain distinct through the final e even when accents are omitted.'
  apostrophes: Accept straight and typographic apostrophes interchangeably. Require the apostrophe when an exercise specifically tests elision, such as j’habite; do not accept jhabite in that exercise.
  hyphens: Teach the standard hyphens in inverted questions such as allez-vous and vas-tu. In free transcription exercises, accept an otherwise-correct spaced version at A1, but retain the hyphenated form as the model answer.
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of French spacing before question or exclamation marks. Spoken answers are assessed for intelligibility and appropriate register, not written punctuation.
course:
  title: 法语 A1
  description: 学习标准法国本土法语的问候、自我介绍、朗读规则和初次见面的闲聊。课程重点讲解中文使用者最需要注意的差异：tu 与 vous 的区别、语法上的性、一致变化、动词变位、省音和连读。
units:
  fr.a1.unit01.greetings:
    title: 问候与初次见面
lessons:
  fr.a1.unit01.lesson01.tu_vous_greetings:
    title: 用 tu 或 vous 问候他人
  fr.a1.unit01.lesson02.names_introductions:
    title: 说出和询问姓名
  fr.a1.unit01.lesson03.reading_aloud:
    title: 朗读初次见面的对话
  fr.a1.unit01.lesson04.wellbeing:
    title: 简短的寒暄问候
  fr.a1.unit01.lesson05.first_meeting_small_talk:
    title: 在街区里互相认识
  fr.a1.unit01.lesson06.workshop_dialogue:
    title: 在工作坊初次见面
teaching:
  fr.a1.unit01.lesson01.teach.bonjour:
    title: 通用问候语
    gloss: 你好；早上好
    note: 白天对陌生人、同事和朋友说 Bonjour 都很稳妥。它除了“你好”，还带有“祝你有愉快的一天”的意思。
  fr.a1.unit01.lesson01.teach.salut:
    title: 非正式问候语
    gloss: 嗨；再见
    note: Salut 用于关系随意的人之间。它可以用来开场，也可以用来道别，但对不熟悉的成年人，它并不是最稳妥的选择。
  fr.a1.unit01.lesson01.teach.au_revoir:
    title: 通用告别语
    gloss: 再见
    note: Au revoir 在礼貌和随意的场合都可以使用。
  fr.a1.unit01.lesson01.teach.tu:
    title: 非正式的单数“你”
    gloss: 你(非正式单数)
    note: 中文的“你”不区分亲疏，而法语的 tu 只用于称呼一位朋友、孩子或明确关系亲近的人，并且动词要使用相应的变位形式。
  fr.a1.unit01.lesson01.teach.vous:
    title: 礼貌的“您”或复数的“你们”
    gloss: 您；你们
    note: 称呼一位不熟悉的成年人时，用 Vous 最稳妥；称呼多人时也用这个形式。它兼有“您”和“你们”的作用，需要根据对象的人数和关系来判断。
  fr.a1.unit01.lesson01.teach.comment_allez_vous:
    title: 正式的问候语:近况
    gloss: 您好吗?
    note: Allez 是 aller 的 vous 变位形式。动词和代词倒装，并用连字符连接。这是一句约定俗成的礼貌问候，并不是真的在询问对方要去哪里。
  fr.a1.unit01.lesson01.teach.comment_vas_tu:
    title: 非正式的问候语:近况
    gloss: 您好吗?
    note: Vas 是 aller 的 tu 变位形式。关系变得随意时，法语会把 allez-vous 换成 vas-tu。
  fr.a1.unit01.lesson01.teach.register_choice:
    title: 让问候语与关系相匹配
    gloss: Bonjour 搭配 vous；salut 搭配 tu
    note: 这些搭配是实用的默认规则，并非绝对。Bonjour 也可以对朋友说，但 salut 加 vous 通常会传达出互相矛盾的社交信号。
  fr.a1.unit01.lesson02.teach.je_mappelle:
    title: 说出你的名字
    gloss: 我叫卡米耶。
    note: Je m’appelle 字面意思是“我称呼自己”。法语通常必须说出主语 je，不能像中文那样经常省略主语。me 的元音在 appelle 前消失，变成 m’appelle。
  fr.a1.unit01.lesson02.teach.comment_appelez_vous:
    title: 礼貌地询问姓名
    gloss: 您叫什么名字?
    note: Appelez 是 appeler 的 vous 变位形式。因为这个问句使用倒装，所以第二个 vous 放在动词后面：vous appelez-vous。
  fr.a1.unit01.lesson02.teach.tu_tappelles:
    title: 非正式地询问姓名
    gloss: 您叫什么名字?
    note: T’appelles 是 tu 的变位形式，反身代词 te 在元音前省音。这个日常问句把 tu 放在动词前，comment 放在句末。
  fr.a1.unit01.lesson02.teach.moi_cest:
    title: 口语式的自我介绍
    gloss: 我是诺埃。
    note: Moi, c’est 是地道的口语式自我介绍，比逐字翻译“我是”更有会话感。
  fr.a1.unit01.lesson02.teach.enchante:
    title: 阳性一致
    gloss: 很高兴认识你。
    note: 男性说话者通常写作 enchanté。中文的形容词不会随说话者的性别变化，而这个法语形容词会。
  fr.a1.unit01.lesson02.teach.enchantee:
    title: 阴性一致
    gloss: 很高兴认识你。
    note: 女性说话者通常写作 enchantée，在末尾加 e。Enchanté 和 enchantée 的发音通常相同，所以这种区别在书写中比在口语中更明显。
  fr.a1.unit01.lesson02.teach.et_vous:
    title: 礼貌地反问
    gloss: 您呢?
    note: 要保持礼貌的语气，或是询问多人时，使用 vous。
  fr.a1.unit01.lesson02.teach.et_toi:
    title: 随意地反问
    gloss: 您呢?
    note: Toi 是与 tu 对应的重读形式。et 之后要用 toi，而不是 tu。
  fr.a1.unit01.lesson03.teach.elision_jhabite:
    title: 元音前的省音
    gloss: 我住
    note: Je 在 habite 前失去元音，撇号表示这一省音：j’habite。habiter 中的 h 不会阻止省音。
  fr.a1.unit01.lesson03.teach.liaison_vous_etes:
    title: vous 之后的连读
    gloss: 您是；你们是
    note: vous 末尾的 s 平时不发音，但在 êtes 的元音前会连读成 z 的音：vous êtes 大致读作“乌-则特”。连读属于口语中的短语，与拼写无关。
  fr.a1.unit01.lesson03.teach.liaison_un_atelier:
    title: un 之后的连读
    gloss: 一个工作坊
    note: un 末尾的 n 要与 atelier 连读。注意不要在两个词之间生硬地停顿。
  fr.a1.unit01.lesson03.teach.final_e_enchante:
    title: 阳性拼写
    gloss: 很高兴认识你（男性说）
    note: 男性说话者的 enchanté 以 é 结尾。其中的 -an- 是鼻元音，不要单独再发出一个 n 的音。
  fr.a1.unit01.lesson03.teach.final_e_enchantee:
    title: 阴性拼写
    gloss: 很高兴认识你（女性说）
    note: Enchantée 为了阴性一致而加了 e，但这个多出来的 e 通常不会增加音节。
  fr.a1.unit01.lesson03.teach.question_liaison:
    title: 朗读倒装问句
    gloss: 您好吗?
    note: 要把 allez-vous 作为一个整体连起来读。allez 中的 z 在这里不发成额外的 z 音，标准读音大致是“阿-累 乌”。
  fr.a1.unit01.lesson04.teach.ca_va:
    title: 日常的问候问句
    gloss: 还好吗？；怎么样？
    note: Ça 中带有软音符，使 c 在 a 前读作 s 的音。同一个表达可以是问句也可以是回答，取决于语调。
  fr.a1.unit01.lesson04.teach.tres_bien:
    title: 非常积极的回答
    gloss: 非常好,谢谢。
    note: Très 用来加强 bien，它末尾的 s 不发音。
  fr.a1.unit01.lesson04.teach.ca_va_bien:
    title: 积极的回答
    gloss: 我很好。
    note: 这个固定的回答中，法语不需要直接对应“我”的词，这一点与中文相似。
  fr.a1.unit01.lesson04.teach.pas_mal:
    title: 比较积极的回答
    gloss: 不错。
    note: Pas mal 通常带有略为正面的意思，和中文的“不错”相似。
  fr.a1.unit01.lesson04.teach.fatigue:
    title: 阳性形容词一致
    gloss: 我有点累。
    note: Suis 是 être 的 je 变位形式。男性说话者写作 fatigué。中文的“累”不会随说话者的性别变化。
  fr.a1.unit01.lesson04.teach.fatiguee:
    title: 阴性形容词一致
    gloss: 我有点累。
    note: 女性说话者写作 fatiguée，末尾加 e。阳性和阴性形式的发音通常相同。
  fr.a1.unit01.lesson04.teach.et_vous:
    title: 礼貌地反问
    gloss: 您呢?
    note: Vous 保持了对不熟悉的成年人的尊重语气。
  fr.a1.unit01.lesson04.teach.et_toi:
    title: 随意地反问
    gloss: 您呢?
    note: 随意地对一位朋友或同辈说话时，在 et 之后用 toi。
  fr.a1.unit01.lesson05.teach.here_for_workshop:
    title: 确认对方的来意
    gloss: 您是来参加工作坊的吗？
    note: Êtes 是 être 的 vous 变位形式。法语不需要额外加助动词，用上升的语调就构成了问句。
  fr.a1.unit01.lesson05.teach.yes_thats_it:
    title: 确认对方的猜测
    gloss: 对，就是这样。
    note: C’est ça 是自然的确认说法，而不是字面上的“它是那个”。
  fr.a1.unit01.lesson05.teach.live_neighborhood:
    title: 询问对方住在哪里
    gloss: 您住在这个街区吗？
    note: Habitez 是 habiter 的 vous 变位形式。这个问句可以保持陈述句的语序，只用疑问的语调。
  fr.a1.unit01.lesson05.teach.i_live:
    title: 说明你住在哪里
    gloss: 我住在蒙特勒伊。
    note: J’habite 是 habiter 的 je 变位形式，并且有省音。À 用于城市地点，不要与动词形式 a（“有”）混淆。
  fr.a1.unit01.lesson05.teach.from_here:
    title: 询问是否是本地人
    gloss: 您是本地人吗？
    note: D’ici 由 de 和 ici 省音组合而成。Êtes 仍然是 être 的 vous 变位形式。
  fr.a1.unit01.lesson05.teach.from_lille:
    title: 说明你来自哪里
    gloss: 我来自里尔。
    note: Suis 是 être 的 je 变位形式。说明来自哪里时，城市名前用 de。
  fr.a1.unit01.lesson05.teach.workshop_starts:
    title: 活动开始
    gloss: 工作坊开始了。
    note: Atelier 是阳性名词，所以它的单数冠词是 le。在元音前，le 变成 l’。Commence 是第三人称单数形式。
  fr.a1.unit01.lesson05.teach.see_you_shortly:
    title: 短时间后再见的告别语
    gloss: 一会儿见；今天晚些时候见
    note: À tout à l’heure 表示当天稍后还会再见面，不同于没有预期时间的一般告别语。
  fr.a1.unit01.lesson06.teach.line01:
    title: 开始见面的对话
    gloss: 伊内斯向马蒂厄问好，并确认他是不是来参加烹饪工作坊的。
    note: 两人一开始就用 vous，因为他们是互不熟悉的成年人。
  fr.a1.unit01.lesson06.teach.line02:
    title: 开始见面的对话：回答
    gloss: 马蒂厄表示确认并说出自己的名字，然后问对方的名字。
    note: Je m’appelle 是介绍自己姓名的标准说法。
  fr.a1.unit01.lesson06.teach.line03:
    title: 互相介绍姓名
    gloss: 伊内斯说出自己的名字，并说很高兴认识他。
    note: Enchantée 与伊内斯（女性）一致；词尾的 -e 要写出来，但通常听不出来。
  fr.a1.unit01.lesson06.teach.line04:
    title: 互相介绍姓名，回答
    gloss: 马蒂厄也表示很高兴认识她，并问她是否住在附近。
    note: Enchanté 与马蒂厄（男性）一致，和伊内斯刚才说的是同一个词，只是少了不发音的 -e。
  fr.a1.unit01.lesson06.teach.line05:
    title: 交流街区的信息
    gloss: 伊内斯表示确认并说出自己住的街道，然后向马蒂厄问同样的问题。
    note: J’habite 后面接街道名称时，rue 前不用介词。
  fr.a1.unit01.lesson06.teach.line06:
    title: 交流街区的信息：回答
    gloss: 马蒂厄说自己住在圣旺，并问她是不是本地人。
    note: J’habite 后面接地名时用 à，这与伊内斯刚才用的街道表达不同。
  fr.a1.unit01.lesson06.teach.line07:
    title: 交流各自的来历
    gloss: 伊内斯说她不是本地人，她来自里尔，然后反问马蒂厄。
    note: Je suis de + 城市名，用来说明自己来自哪里。
  fr.a1.unit01.lesson06.teach.line08:
    title: 交流来自哪里，回应
    gloss: Mathieu说他来自里昂。
    note: 与 Inès 刚才用的 je suis de 句型相同。
  fr.a1.unit01.lesson06.teach.line09:
    title: 中断对话
    gloss: Inès发现工作坊要开始了，说一会儿见。
    note: 用 À tout à l’heure 很合适，因为两人都会留在同一个活动中。
  fr.a1.unit01.lesson06.teach.line10:
    title: 中断对话，回应
    gloss: Mathieu也用同样的话道别。
    note: 把 à tout à l’heure 重复一遍，是表示确认的自然说法。
exercises:
  fr.a1.unit01.lesson01.exercise01.listen_bonjour:
    instruction: 听音频,选择你听到的短语。
    correct_option: Bonjour.
    distractors:
    - Salut !
    - Au revoir.
    accepted_answers:
    - Bonjour.
    - Bonjour
  fr.a1.unit01.lesson01.exercise02.choose_informal:
    instruction: 哪个人称代词与这句非正式问候语搭配？
    correct_option: tu
    distractors:
    - vous
    accepted_answers:
    - tu
    feedback: Salut 和 tu 搭配起来，语体一致，都是非正式的。
  fr.a1.unit01.lesson01.exercise03.choose_polite_pronoun:
    instruction: 为一位不熟悉的成年人补全问候语。
    accepted_answers:
    - vous
    feedback: 对不熟悉的成年人，用 Vous 是稳妥又有礼貌的选择。
  fr.a1.unit01.lesson01.exercise04.order_polite_question:
    instruction: 把这句礼貌地询问近况的话排成正确顺序。
    correct_response:
    - Comment
    - allez-vous
  fr.a1.unit01.lesson01.exercise05.listen_informal_question:
    instruction: 输入你听到的非正式问句。
    accepted_answers:
    - Comment vas-tu ?
    - Comment vas-tu?
    - Comment vas tu ?
    - Comment vas tu?
  fr.a1.unit01.lesson01.exercise06.match_register:
    instruction: 把每个问候语与初学者常用的语体配对。
    correct_response:
      Bonjour: vous
      Salut: 你（非正式）
    pairs:
    - left: Bonjour
      right: vous
    - left: Salut
      right: 你（非正式）
  fr.a1.unit01.lesson01.exercise07.complete_farewell:
    instruction: 补全中性的告别语。
    accepted_answers:
    - revoir
  fr.a1.unit01.lesson01.exercise08.speak_greeting:
    instruction: 用礼貌的问候语，询问对方近况，并结束对话。
    accepted_answers:
    - Bonjour. Comment allez-vous ? Au revoir.
    - Bonjour, comment allez-vous ? Au revoir.
  fr.a1.unit01.lesson02.exercise01.order_self_intro:
    instruction: 组成 Camille 的自我介绍。
    correct_response:
    - Je
    - m’appelle
    - Camille
  fr.a1.unit01.lesson02.exercise02.listen_name_question:
    instruction: 听音频，选出礼貌的询问姓名的问句。
    correct_option: Comment vous appelez-vous ?
    distractors:
    - Tu t’appelles comment ?
    - Comment allez-vous ?
    accepted_answers:
    - Comment vous appelez-vous ?
    - Comment vous appelez vous ?
  fr.a1.unit01.lesson02.exercise03.informal_name_question:
    instruction: 在非正式的问候之后，询问对方的名字。
    accepted_answers:
    - Tu t’appelles comment ?
    - Tu t'appelles comment ?
    - Tu t’appelles comment?
    - Tu t'appelles comment?
  fr.a1.unit01.lesson02.exercise04.complete_moi_cest:
    instruction: 补全 Noé 的口语式自我介绍。
    accepted_answers:
    - c’est
    - c'est
  fr.a1.unit01.lesson02.exercise05_choose_enchantee:
    instruction: Camille 说的这个词，书写形式是否正确地标示了阴性？
    correct_option: 是的——enchantée 末尾有阴性的 e。
    distractors:
    - 不——enchanté 才是阴性形式。
    - 不——两种书写形式完全相同。
    accepted_answers:
    - 是的——enchantée 末尾有阴性的 e。
    feedback: Enchantée 末尾的 e 用于女性说话人。
  fr.a1.unit01.lesson02.exercise06_return_polite_question:
    instruction: 保持礼貌的语体，把问题回问对方。
    accepted_answers:
    - Et vous ?
    - Et vous?
  fr.a1.unit01.lesson02.exercise07.match_introductions:
    instruction: 把相互补充的介绍用语和阴阳性形式配对。
    correct_response:
      Je m’appelle Camille.: Moi, c’est Noé.
      Enchanté.: Enchantée.
    pairs:
    - left: Je m’appelle Camille.
      right: Moi, c’est Noé.
    - left: Enchanté.
      right: Enchantée.
  fr.a1.unit01.lesson02.exercise08.write_introduction:
    instruction: 写出 Camille 的自我介绍：用 Bonjour 问候，用 Je m’appelle 说出名字，再加上一句初次见面的用语。
    accepted_answers:
    - Bonjour. Je m’appelle Camille. Enchanté.
    - Bonjour. Je m'appelle Camille. Enchanté.
    - Bonjour. Je m’appelle Camille. Enchantée.
    - Bonjour. Je m'appelle Camille. Enchantee.
    - Bonjour. Je m'appelle Camille. Enchantée.
    - Bonjour, je m’appelle Camille. Enchanté.
    - Bonjour, je m’appelle Camille. Enchantée.
    - Bonjour, je m'appelle Camille. Enchanté.
    - Bonjour, je m'appelle Camille. Enchantée.
  fr.a1.unit01.lesson03.exercise01_recognize_elision:
    instruction: j’habite 由哪两个词合成？
    correct_option: je + habite
    distractors:
    - tu + habite
    - je + être
    accepted_answers:
    - je + habite
  fr.a1.unit01.lesson03.exercise02_complete_elision:
    instruction: 补全省音形式。保留提示中显示的撇号。
    accepted_answers:
    - habite
  fr.a1.unit01.lesson03.exercise03.listen_liaison:
    instruction: 听音频,选择你听到的短语。
    correct_option: vous êtes
    distractors:
    - tu t’appelles
    - vas-tu
    accepted_answers:
    - vous êtes
