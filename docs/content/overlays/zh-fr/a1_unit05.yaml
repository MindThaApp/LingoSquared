course:
  title: 法语 A1
  description: 常见的食物和饮品词汇，以及咖啡馆点餐的对话；故事接着伊内斯和马蒂厄的烹饪工作坊，讲述他们课后一起用餐。本课重点讲解 du/de la/de l' 这类部分冠词，它们用在不可数的食物名词前。
units:
  fr.a1.unit05.food:
    title: 工作坊之后的一餐
