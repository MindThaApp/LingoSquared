  fr.a1.unit05.lesson01.a_table:
    title: 在餐桌旁
  fr.a1.unit05.lesson02.au_cafe:
    title: 在咖啡馆
  fr.a1.unit05.lesson03.dialogue_cafe:
    title: 工作坊结束后在咖啡馆
teaching:
  fr.a1.unit05.lesson01.teach.poulet:
    title: 鸡肉
    gloss: 鸡肉
    note: '*Poulet* 是阳性名词。'
    example_gloss: 我想要一些鸡肉。
  fr.a1.unit05.lesson01.teach.poisson:
    title: 鱼
    gloss: 鱼
    note: '*Poisson* 是阳性名词。'
    example_gloss: 今天的鱼很新鲜。
  fr.a1.unit05.lesson01.teach.salade:
    title: 沙拉
    gloss: 沙拉
    note: '*Salade* 是阴性名词。'
    example_gloss: 她在吃沙拉。
  fr.a1.unit05.lesson01.teach.riz:
    title: 米饭
    gloss: 米饭
    note: '*Riz* 是阳性名词，单复数拼写相同，和 *prix* 一样。'
    example_gloss: 米饭很配鸡肉。
  fr.a1.unit05.lesson01.teach.eau:
    title: 水
    gloss: 水
    note: '*Eau* 是阴性名词；因为它以元音开头，*l''* 要省音，和本单元后面的 *l''addition* 一样。'
    example_gloss: 我想要一些水，谢谢。
  fr.a1.unit05.lesson01.teach.vin:
    title: 葡萄酒
    gloss: 葡萄酒
    note: '*Vin* 是阳性名词。'
    example_gloss: 这款红酒很好喝。
  fr.a1.unit05.lesson01.teach.je_voudrais_poulet_salade:
    title: 点鸡肉和沙拉
    gloss: 我想要鸡肉和沙拉。
    note: '*Du poulet*（阳性）和 *de la salade*（阴性）是部分冠词，表示“一些”，要和名词的性一致；而在表示数量的短语之后（*un kilo de*），只用单纯的 *de*。'
  fr.a1.unit05.lesson02.teach.dessert:
    title: Dessert
    gloss: 甜点
    note: '*Dessert* 是阳性名词。'
    example_gloss: 今天甜点免费。
  fr.a1.unit05.lesson02.teach.addition:
    title: 账单
    gloss: 账单；买单
    note: '*Addition* 是阴性名词；因为它以元音开头，*l''* 要省音。这是法国餐厅里的标准说法，不是 *facture*（正式的发票）。'
    example_gloss: 请买单。
  fr.a1.unit05.lesson02.teach.vous_avez_choisi:
    title: 询问是否已经决定点什么
    gloss: 您决定好了吗？
    note: 服务员走到餐桌前点餐时的标准问句，用的是 *choisir*（选择）的复合过去时。
  fr.a1.unit05.lesson02.teach.je_voudrais_un_cafe:
    title: 点一杯咖啡
    gloss: 我想要一杯咖啡，谢谢。
    note: '*Je voudrais* + 所点的东西，和购物时用的句型相同，现在用来点餐和点饮品。'
  fr.a1.unit05.lesson02.teach.qcq_comme_dessert:
    title: 询问有什么可选
    gloss: 你们有什么甜点？
    note: '*Qu''est-ce que vous avez comme...?* 是询问某一类别里有哪些选择的自然常用说法。'
  fr.a1.unit05.lesson02.teach.cest_delicieux:
    title: 说某样东西很好吃
    gloss: 太好吃了！
    note: 对食物的常见热情反应；这里 *délicieux* 形式不变，因为 *c'est* 后面没有带性别的名词。
  fr.a1.unit05.lesson03.teach.line01:
    title: 问候并询问是否决定好了
    gloss: 服务员打招呼，并问他们是否决定好了点什么。
    note: 以 *Bonjour* 开头，这是服务场合的礼貌用语。
  fr.a1.unit05.lesson03.teach.line02:
    title: 点沙拉和水
    gloss: 伊内斯点了一份沙拉和一些水。
    note: 把 *je voudrais* 和 *et* 结合起来，在一句话里连接两样所点的东西。
  fr.a1.unit05.lesson03.teach.line03:
    title: 点鸡肉配米饭
    gloss: 马蒂厄点了鸡肉配米饭。
    note: '*Avec*（和、配）把主菜和配菜连在一起，是简单常用的点餐结构。'
  fr.a1.unit05.lesson03.teach.line04:
    title: 确认并询问饮品
    gloss: 服务员确认点单，并询问要喝什么。
    note: '*Et comme boisson pour vous ?* 沿用了 *Qu''est-ce que vous avez comme dessert ?* 中的 *comme* 句型，这次用来问饮品。'
  fr.a1.unit05.lesson03.teach.line05:
    title: 点一杯葡萄酒
    gloss: 马蒂厄点了一杯红酒。
    note: '*Un verre de*（一杯）是按杯点葡萄酒的标准说法。'
  fr.a1.unit05.lesson03.teach.line06:
    title: 对食物作出反应
    gloss: 伊内斯说这份沙拉很好吃。
    note: 再次用到 *C'est délicieux !*，这次指一道具体的菜（*cette salade*）。虽然 *salade* 是阴性，*c'est* 后面的 *délicieux* 仍用阳性；*Elle est délicieuse, cette salade !* 则是做一致变化的另一种说法。
  fr.a1.unit05.lesson03.teach.line07:
    title: 解释饿的原因并要求买单
    gloss: 马蒂厄说工作坊让他们饿了，并请服务员买单。
    note: '*Nous a donné faim*（字面意思是“给了我们饥饿”）是法语中表示某事让你饿了的自然说法。'
  fr.a1.unit05.lesson03.teach.line08:
    title: 确认马上送来账单
    gloss: 服务员表示马上就送来。
    note: '*Tout de suite*（马上）是服务场合中常用、让人安心的说法。'
