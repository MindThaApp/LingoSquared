  fr.a1.unit52.lesson03.qu_est_ce_que:
    title: 你空闲时做什么？
  fr.a1.unit52.lesson04.camille_et_mathieu_parlent:
    title: 卡米尔和马蒂厄聊爱好
  fr.a1.unit52.lesson05.mathieu_et_camille_comparent:
    title: 马蒂厄和卡米尔比较他们的爱好
  fr.a1.unit52.lesson06.planifier_un_week_end:
    title: 一起规划周末
teaching:
  fr.a1.unit52.lesson01.teach.lire_faire_du:
    title: 阅读、锻炼、做饭
    gloss: 阅读、锻炼／做运动、做饭
    note: 三个常见的爱好动词：*lire*（阅读）、*faire du sport*（运动）和 *cuisiner*（做饭）。
    example_gloss:
    - 我喜欢读书。
    - 我每逢星期六都锻炼。
    - 我喜欢为朋友们做饭。
  fr.a1.unit52.lesson01.teach.le_temps_libre:
    title: 空闲时间
    gloss: 空闲时间
    note: '*Temps libre* 是阳性：*le temps libre*。这是谈论爱好的关键短语。'
    example_gloss: 我空闲时喜欢阅读。
  fr.a1.unit52.lesson01.teach.pendant_mon_temps:
    title: 表达你空闲时做什么
    gloss: 我空闲时喜欢阅读。
    note: '*Lis* 是 *lire*（阅读）的 *je* 形式；末尾的 *s* 不发音。'
  fr.a1.unit52.lesson02.teach.ecouter_de_la:
    title: 音乐、画画、电子游戏
    gloss: 听音乐、画画、玩电子游戏
    note: 另外三个爱好：*écouter de la musique*、*dessiner* 和 *jouer aux jeux vidéo*。说到游戏时，*jouer à* + *les* 变成 *jouer aux*。
    example_gloss:
    - 我喜欢听音乐。
    - 我经常画画。
    - 我喜欢和朋友们一起玩电子游戏。
  fr.a1.unit52.lesson02.teach.j_aime_ecouter:
    title: 表达你喜欢听音乐
    gloss: 我喜欢听音乐。
    note: '*Écouter* 直接接宾语，中间不加其他词：*écouter de la musique*。'
  fr.a1.unit52.lesson02.teach.j_aime_jouer:
    title: 表达喜欢和朋友一起玩电子游戏
    gloss: 我喜欢和朋友们一起玩电子游戏。
    note: '*Avec des amis*（和朋友们）里的 *amis* 在第1课出现过；*des* 是复数的“一些”。'
  fr.a1.unit52.lesson03.teach.toujours_souvent_parfois:
    title: 总是、经常、有时、从不
    gloss: 总是、经常、有时、从不
    note: 四个最基本的频率副词。*Souvent* 你可能已经见过；*toujours*、*parfois* 和 *jamais* 是新词。*Jamais* 需要在动词前加 *ne*。
    example_gloss:
    - 我每周六都锻炼。
    - 我经常读书。
    - 我有时画画。
    - 我从不玩电子游戏。
  fr.a1.unit52.lesson03.teach.chaque_semaine_chaque:
    title: 每周、每个周末
    gloss: 每周、每个周末
    note: '*Chaque semaine* 和 *chaque week-end* 都表示“每”。无论名词是阴性还是阳性，*chaque* 都不变。'
    example_gloss:
    - 我每周都为朋友做饭。
    - 我每个周末都锻炼。
  fr.a1.unit52.lesson03.teach.chaque_ne_change:
    title: Chaque 永远不变
    gloss: '*Chaque* 用在阳性和阴性名词前形式相同：*chaque semaine*，*chaque week-end*。'
    note: '*Semaine* 是阴性，*week-end* 是阳性，但 *chaque* 对两者完全相同。对比 *tous les* / *toutes les*，后者是会变化的。'
  fr.a1.unit52.lesson03.teach.qu_est_ce:
    title: 询问空闲时间
    gloss: 你空闲时做什么？
    note: 这是本单元的核心问题，可以用它询问任何人的爱好。
  fr.a1.unit52.lesson04.teach.camille_on_se:
    title: 卡米尔提起爱好
    gloss: 卡米尔：我们常常一起散步。不过马蒂厄，你空闲时间还做些什么呢？
    note: '*On se promène souvent* 用 *on* 表示“我们”，*souvent* 紧跟在动词后面。'
  fr.a1.unit52.lesson04.teach.mathieu_j_aime:
    title: 马蒂厄的爱好
    gloss: 马蒂厄：我喜欢做饭，在家也是。而且我经常运动。
    note: '*Même à la maison*（连在家也）表明马蒂厄做饭是出于兴趣，而不只是工作。'
  fr.a1.unit52.lesson04.teach.camille_tu_cuisines:
    title: 卡米尔很惊讶
    gloss: 卡米尔：你在家也做饭？你上班已经做了一整天饭了！
    note: '*Toute la journée*（一整天）强调马蒂厄在工作中已经做了很多饭。'
  fr.a1.unit52.lesson04.teach.mathieu_oui_mais:
    title: 马蒂厄解释
    gloss: 马蒂厄：是啊，不过我觉得做饭很放松。那你呢，你喜欢做什么？
    note: '*Cuisiner, je trouve ça relaxant* 把 *cuisiner* 放在句首以示强调：字面意思是“做饭，我觉得这很放松”。'
  fr.a1.unit52.lesson04.teach.camille_j_aime:
    title: 卡米尔的爱好
    gloss: 卡米尔：我喜欢看书，也经常听音乐。
    note: 用 *et*（和）把第1课和第2课的两个爱好合在一个句子里。
  fr.a1.unit52.lesson04.teach.mathieu_tu_joues:
    title: 马蒂厄问起打游戏
    gloss: 马蒂厄：你也玩电子游戏吗？
    note: 一个简短的是非问句：*Tu joues aussi aux jeux vidéo ?* 用升调表示疑问。
  fr.a1.unit52.lesson04.teach.camille_non_je:
    title: 卡米尔的回答
    gloss: 卡米尔：不，我从来不玩电子游戏。不过我有时会画画！
    note: 第3课的 *jamais*（从不）和 *parfois*（有时）在同一个回答里形成对比。
  fr.a1.unit52.lesson05.teach.mathieu_et_moi:
    title: 比较爱好
    gloss: 马蒂厄和我常常一起散步。不过我们还有其他爱好。马蒂厄喜欢做饭，在家也是，而且他经常运动。我喜欢看书，也经常听音乐。我有时画画，但从不玩电子游戏。你空闲时间喜欢做什么？
    note: 卡米尔的信息回顾了第4课的内容，并以本单元的核心问题向读者发问作结。
    glosses:
      promène: 散步
      souvent: 经常
      ensemble: 一起
      d'autres: 其他的
      cuisiner: 做饭
      aime: 喜欢
      maison: 在家
      sport: 锻炼
      lire: 阅读
      j'écoute: 听
      musique: 音乐
      dessine: 画画
      parfois: 有时
      jeux: 玩电子游戏
      jamais: 从不
      libre: 空闲的
      temps: 时间
  fr.a1.unit52.lesson06.teach.mathieu_qu_est:
    title: 马蒂厄问周末的安排
    gloss: 马蒂厄：这个周末你做什么？
    note: '*Ce week-end*（这个周末）用 *ce*，因为 *week-end* 是阳性。'
  fr.a1.unit52.lesson06.teach.camille_je_ne:
    title: 卡米尔还没决定
    gloss: 卡米尔：我还不知道。我喜欢看书，不过我也想出去玩。
    note: '*Sortir*（出去）是表达想出门的常用说法。'
  fr.a1.unit52.lesson06.teach.mathieu_on_se:
    title: Mathieu提出一个计划
    gloss: Mathieu：我们一起散步好吗？之后我给我们做饭。
    note: '*Après*（之后）用来依次安排两件事，和 *d''abord*、*ensuite* 一样。'
  fr.a1.unit52.lesson06.teach.camille_bonne_idee:
    title: Camille表示同意
    gloss: Camille：好主意！散步和做饭我都一样喜欢。
    note: '*Autant ... que*（和……一样多）表示Camille对两件事同样喜欢，没有偏爱哪一个。'
  fr.a1.unit52.lesson06.teach.mathieu_parfait_alors:
    title: Mathieu确认安排
    gloss: Mathieu：太好了。那星期六见！
    note: 一句友好的结束语，确认 *samedi*（星期六）的安排。
