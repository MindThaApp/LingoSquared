course:
  title: 法语 A1
  description: 用代动词（se réveiller、se lever、se coucher）和顺序词（d'abord、ensuite）描述简单的日常作息，延续伊内斯和马修烹饪工作坊的故事，这次伊内斯询问马修周六的安排。汉语的“起床”“醒来”不需要反身代词，而法语代动词必须加反身代词，例如 je me réveille 中的 me。
units:
  fr.a1.unit10.routines:
    title: 周六的作息
lessons:
  fr.a1.unit10.lesson01.vocabulaire_routine:
    title: 早晨的活动
  fr.a1.unit10.lesson02.la_journee_complete:
    title: 完整的一天
  fr.a1.unit10.lesson03.dialogue_routine_samedi:
    title: 马修周六的作息
teaching:
  fr.a1.unit10.lesson01.teach.se_reveiller:
    title: 醒来
    gloss: 醒来
    note: 代动词：*je me réveille*、*tu te réveilles*。代词 *me/te/se* 总是与主语一致。
    example_gloss: 我七点醒来。
  fr.a1.unit10.lesson01.teach.se_lever:
    title: 起床
    gloss: 起床
    note: 与 *se réveiller*（睡醒、意识清醒）不同，*se lever* 指身体上离开床起身。
    example_gloss: 我之后马上起床。
  fr.a1.unit10.lesson01.teach.prendre_une_douche:
    title: 洗澡（淋浴）
    gloss: 洗澡
    note: '*Prendre une douche*（字面意思是“拿一个淋浴”）使用动词 *prendre*，和用餐、乘坐交通工具时用的动词相同。'
    example_gloss: 我早上洗澡。
  fr.a1.unit10.lesson01.teach.shabiller:
    title: 穿衣服
    gloss: 穿衣服
    note: 又一个代动词：*je m'habille*，me 在元音前省音为 *m'*。
    example_gloss: 我在早餐前穿衣服。
  fr.a1.unit10.lesson01.teach.le_petit_dejeuner:
    title: 早餐
    gloss: 早餐
    note: '*Prendre le petit-déjeuner*（吃早餐）和 *prendre une douche* 一样使用 *prendre* 的搭配。'
    example_gloss: 我八点吃早餐。
  fr.a1.unit10.lesson01.teach.quitter_la_maison:
    title: 出门
    gloss: 出门
    note: 这里的 *quitter* 表示“离开（某地）”，后面直接跟宾语；不要和 *partir* 混淆，partir 不直接带宾语。
    example_gloss: 我九点出门。
  fr.a1.unit10.lesson01.teach.dabord_ensuite:
    title: 首先……然后……
    gloss: 首先我起床，然后我穿衣服。
    note: '*D''abord*（首先）和 *ensuite*（然后）是一步一步描述日常作息的基本顺序词。'
  fr.a1.unit10.lesson02.teach.rentrer:
    title: 回家
    gloss: 回家
    note: '*Rentrer* 表示回到自己的家，不同于更泛指的 *retourner*（回到某个地方）。'
    example_gloss: 我下班后回家。
  fr.a1.unit10.lesson02.teach.diner:
    title: 吃晚饭
    gloss: 吃晚饭
    note: '*Dîner* 可以是动词（吃晚饭），也可以是名词（*le dîner*，晚饭），要根据上下文区分。'
    example_gloss: 我们周六晚上一起吃晚饭。
  fr.a1.unit10.lesson02.teach.se_coucher:
    title: 睡觉
    gloss: 睡觉
    note: 这是日常作息顺序的自然结尾，与开头的 *se lever* 相呼应。
    example_gloss: 我晚上十一点左右睡觉。
  fr.a1.unit10.lesson02.teach.le_weekend:
    title: 周末
    gloss: 周末
    note: '*Le week-end* 是法语中常用的外来词，拼写时带连字符。'
    example_gloss: 工作坊在周末举行。
  fr.a1.unit10.lesson02.teach.dhabitude:
    title: 通常
    gloss: 通常
    note: '*D''habitude* 引出一贯的习惯作息，不同于表示一次性事件的 *aujourd''hui*（今天）。'
    example_gloss: 我通常七点起床。
  fr.a1.unit10.lesson02.teach.ma_routine_du_samedi:
    title: 描述一个周六
    gloss: 周六我起得晚，然后在工作坊之前去市场。
    note: 结合了类似 *d'abord/ensuite* 的顺序表达（这里用 *puis*，“然后”）来描述一个周六。
  fr.a1.unit10.lesson02.teach.quest_ce_que_tu_fais:
    title: 你做什么？
    gloss: 你周六做什么？
    note: '*Qu''est-ce que tu fais... ?* 是询问别人做什么的标准非正式说法。'
  fr.a1.unit10.lesson03.teach.line01:
    title: 询问周六的安排
    gloss: 伊内斯问马修周六工作坊之前做什么。
    note: '*Tu fais quoi... ?* 是询问“你做什么……？”的自然非正式说法，比 *Qu''est-ce que tu fais ?* 更随意。'
  fr.a1.unit10.lesson03.teach.line02:
    title: 描述醒来
    gloss: 马修说他首先睡到很晚才醒，大约九点。
    note: '*Vers neuf heures*（大约九点）再次用到 *vers* + 时间的结构来表示大概的时间。'
  fr.a1.unit10.lesson03.teach.line03:
    title: 问接下来做什么
    gloss: 伊内斯问接下来做什么。
    note: 这是一个简短自然的追问，让对作息的描述继续下去。
  fr.a1.unit10.lesson03.teach.line04:
    title: 描述早餐和去市场
    gloss: 马修说接下来他吃早餐，然后去市场。
    note: 用 *et* 连接两个相继的动作，延续以 *d'abord* 开头的顺序。
  fr.a1.unit10.lesson03.teach.line05:
    title: 询问回家的时间
    gloss: 伊内斯问马修几点回家。
    note: '*Tu rentres à quelle heure ?* 在直接提问中再次用到本单元的 *rentrer*。'
  fr.a1.unit10.lesson03.teach.line06:
    title: 描述下午
    gloss: 马修说他大约中午回家，下午在晚上的工作坊之前休息。
    note: '*Se reposer*（休息）是另一个代动词：*je me repose*。'
