course:
  title: 法语 A1
  description: 提出、接受、拒绝并安排一个简单的计划，延续伊内斯和马蒂厄的烹饪工作坊故事：两人约好在星期六的课程前一起去买食材。重点提示：*se retrouver*（碰头见面，代词式／相互动词）在汉语中没有完全对应的单个动词，需要用“碰头、见面”来表达；*vers* + 时间表示大约的时间，而不是准确的时间。
units:
  fr.a1.unit11.plans:
    title: 我们什么时候见面？
lessons:
  fr.a1.unit11.lesson01.vocabulaire_projets:
    title: 提议时间
  fr.a1.unit11.lesson02.accepter_refuser:
    title: 接受或拒绝
  fr.a1.unit11.lesson03.dialogue_projet_courses:
    title: 计划一起去买东西
teaching:
  fr.a1.unit11.lesson01.teach.libre:
    title: 有空／空闲的
    gloss: 有空／空闲的
    note: 这里的 *libre* 指人有空；表示不要钱的东西，法语用 *gratuit*。
    example_gloss: 你星期六有空吗？
  fr.a1.unit11.lesson01.teach.occupe:
    title: 忙的
    gloss: 忙的
    note: 与 *libre* 正好相反。阴阳性要变化：*occupé*（阳性）／*occupée*（阴性）。
    example_gloss: 我星期五晚上很忙。
  fr.a1.unit11.lesson01.teach.se_retrouver:
    title: 见面／碰头
    gloss: 见面／碰头
    note: 这个意思下的 *se retrouver* 是相互动作，指两个或多个人彼此见面，与 *trouver*（找到）不同。
    example_gloss: 我们今晚在哪里碰头？
  fr.a1.unit11.lesson01.teach.vers:
    title: 大约（某个时间）
    gloss: 大约／将近（某个时间）
    note: '*Vers* + 时间表示大概的时间，比说出准确钟点更委婉。'
    example_gloss: 我七点左右过来。
  fr.a1.unit11.lesson01.teach.ca_te_dit_de:
    title: ……怎么样？
    gloss: 一起去买东西怎么样？
    note: '*Ça te dit de... ?* + 动词原形是提议活动时常用的随意说法，比 *Voulez-vous... ?* 更轻松。'
  fr.a1.unit11.lesson01.teach.venir_chercher:
    title: 来接（某人）
    gloss: 你六点左右来接我好吗？
    note: '*Venir chercher quelqu''un* 的意思是来接某人，而不只是“寻找”。'
  fr.a1.unit11.lesson01.teach.daccord_a_tout_a_lheure:
    title: 好，回头见
    gloss: 好，一会儿见！
    note: '*D''accord*（好／同意）用来确认计划；*à tout à l''heure* 用于当天晚些时候还会再见面的时候。'
  fr.a1.unit11.lesson02.teach.je_ne_peux_pas:
    title: 拒绝邀约
    gloss: 我不行，我很忙。
    note: '*Je ne peux pas*（我不行）加上理由，是简单又礼貌的拒绝方式。'
  fr.a1.unit11.lesson02.teach.avec_plaisir:
    title: 高兴地接受
    gloss: 很乐意！
    note: '*Avec plaisir*（字面意思是“带着愉快”）是热情接受邀请的说法。'
  fr.a1.unit11.lesson02.teach.a_quelle_heure_on_se_voit:
    title: 询问时间
    gloss: 我们几点见面？
    note: '*On se voit*（口语，“我们见面”）是约见面时代替 *se retrouver* 的常用随意说法。'
  fr.a1.unit11.lesson02.teach.devant_le_marche:
    title: 提议地点
    gloss: 在市场前面，你觉得可以吗？
    note: '*Ça te va ?*（你觉得可以吗？）用来确认对方是否接受所提议的细节。'
  fr.a1.unit11.lesson02.teach.parfait_alors:
    title: 确认计划
    gloss: 太好了，那星期五见！
    note: 这里的 *alors* 表示“那么”，用来确认结果，结束计划的商量。
  fr.a1.unit11.lesson03.teach.line01:
    title: 提议一起买东西
    gloss: 伊内斯问马蒂厄，工作坊之前想不想一起去买东西。
    note: '*Ça te dit de... ?* 以随意的建议开启对话。'
  fr.a1.unit11.lesson03.teach.line02:
    title: 接受并问地点
    gloss: 马蒂厄说很乐意，并问在哪里碰头。
    note: 把 *Avec plaisir*（很乐意）和 *se retrouver*（碰头）结合在一起。
  fr.a1.unit11.lesson03.teach.line03:
    title: 提议地点和日期
    gloss: 伊内斯提议星期五晚上在市场前面见。
    note: 一个简短的提议，包含地点（*devant le marché*）和日期（*vendredi soir*）。
  fr.a1.unit11.lesson03.teach.line04:
    title: 接受并问时间
    gloss: 马蒂厄同意了，并问几点。
    note: '*D''accord* 确认了地点和日期；接着的问题用来确定具体时间。'
  fr.a1.unit11.lesson03.teach.line05:
    title: 提议具体时间
    gloss: 伊内斯问马蒂厄六点左右能不能来接她。
    note: 把 *venir chercher* 和 *vers* 加具体钟点一起使用。
  fr.a1.unit11.lesson03.teach.line06:
    title: 确认所有细节
    gloss: 马蒂厄说太好了，那星期五见，六点在市场前面。
    note: 把计划的三个细节（日期、时间、地点）一并重述，清楚地结束这次商量。
