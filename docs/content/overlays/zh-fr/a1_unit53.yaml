  fr.a1.unit53.lesson01.grand_petit_vieux_et:
    title: 高、矮、年老和年轻
  fr.a1.unit53.lesson02.decrire_les_cheveux:
    title: 描述头发
  fr.a1.unit53.lesson03.les_yeux_et_comment:
    title: 眼睛和询问某人的外貌
  fr.a1.unit53.lesson04.camille_decrit_nina:
    title: Camille描述Nina
  fr.a1.unit53.lesson05.comparer_thomas_et_lea:
    title: 比较Thomas和Léa
  fr.a1.unit53.lesson06.mathieu_reconnait_nina:
    title: Mathieu认出Nina
teaching:
  fr.a1.unit53.lesson01.teach.grand_petit:
    title: 高和矮
    gloss: 高的／矮的
    note: '*Grand* 形容个子高，*petit* 形容个子矮。它们要与所描述的人保持一致：*grand/grande*，*petit/petite*。'
    example_gloss:
    - Léa个子高。
    - Thomas个子矮。
  fr.a1.unit53.lesson01.teach.vieux_jeune:
    title: 年老和年轻
    gloss: 年老的／年轻的
    note: '*Vieux* 和 *jeune* 在这里表示对年龄的大致印象，而不是确切的岁数。'
    example_gloss:
    - 爷爷年纪大了。
    - Mathieu很年轻。
  fr.a1.unit53.lesson01.teach.pour_un_age:
    title: 年龄：数字还是印象
    gloss: 表示确切的年龄，法语用 *avoir*（*Il a vingt ans*），而 *être vieux* 表示大致的印象（*Mon grand-père est vieux*）。
    note: 你已经学过用 *Quel âge as-tu ?* 问确切的年龄。这里的 *vieux* 描述的是一个人看起来有多老，不带具体数字。
  fr.a1.unit53.lesson01.teach.lea_est_grande:
    title: Léa个子高，Thomas个子矮
    gloss: Léa个子高，Thomas个子矮。
    note: 一个用 *et*（和）连接的简单复合句，为第5课的直接比较做铺垫。
  fr.a1.unit53.lesson02.teach.les_cheveux:
    title: 头发
    gloss: 头发
    note: '*Les cheveux* 在法语中总是阳性复数，指整头头发。'
    example_gloss: Mathieu有一头黑色短发。
  fr.a1.unit53.lesson02.teach.blonds_bruns_gris:
    title: 金色、棕色和灰白色
    gloss: 金色的／棕色的／灰白的
    note: 三种发色。与 *cheveux* 搭配时，表示颜色的形容词要加复数 *s*：*blonds*、*bruns*。*Gris* 本身就以 *s* 结尾，而 *noirs*（黑色的）在服装单元中已经学过。
    example_gloss:
    - 卡米耶是金发。
    - 托马是棕色头发。
    - 爷爷头发灰白。
  fr.a1.unit53.lesson02.teach.longs_courts:
    title: 长和短（头发）
    gloss: 长的／短的（头发）
    note: '*Longs*（长的）沿用了第1课中表示身高的词义，现在用来描述头发的长度。*Courts*（短的）是本课的新词，和 *cheveux* 搭配时两者都要加复数 *s*。'
    example_gloss:
    - 莱娅留着长发。
    - 托马留着短发。
  fr.a1.unit53.lesson02.teach.cheveux_est_toujours:
    title: Cheveux 搭配复数形容词
    gloss: '*Cheveux* 总是复数，所以形容词要加 *s*：*longs*、*courts*、*blonds*、*bruns*、*noirs*。*Gris* 本身已经以 *s* 结尾。'
    note: 颜色和长度的形容词要与 *cheveux* 一起用复数：*les cheveux longs*。对比第3课的 *yeux*，其中 *marron* 不变。
  fr.a1.unit53.lesson02.teach.ses_est_le:
    title: Ses：他的或她的
    gloss: '*Ses* 用在复数名词前，意思是“他的”或“她的”：*ses cheveux*、*ses yeux*。它与所属的事物一致，而不是与所有者一致。'
    note: 法语在这里不区分“她的”和“他的”：*ses yeux* 可以指“她的眼睛”，也可以指“他的眼睛”，要根据上下文判断。汉语的“他的”“她的”读音相同，但书写上有区别，这一点与法语不同。
  fr.a1.unit53.lesson02.teach.mathieu_a_les:
    title: 马蒂厄留着黑色短发
    gloss: Mathieu有一头黑色短发。
    note: 沿用了服装单元中的 *noirs*（黑色的）。
  fr.a1.unit53.lesson02.teach.camille_a_les:
    title: 卡米耶留着金色长发
    gloss: Camille有一头金色长发。
    note: 这个自然的句子结合了本课表示头发长度和颜色的词汇。
  fr.a1.unit53.lesson03.teach.les_yeux:
    title: 眼睛
    gloss: 眼睛
    note: '*Les yeux* 是 *l''œil*（眼睛）的复数；*yeux* 以 *x* 结尾，而不是 *s*。'
    example_gloss: 马蒂厄有一双棕色的眼睛。
  fr.a1.unit53.lesson03.teach.bleus_marron_verts:
    title: 蓝色、棕色和绿色
    gloss: 蓝色的／棕色的／绿色的
    note: '*Bleus*（蓝色的）之前在服装单元中学过；*marron*（棕色的）永远不变；*verts*（绿色的）是新词。'
    example_gloss:
    - Camille有蓝色的眼睛。
    - Thomas有棕色的眼睛。
    - Léa有绿色的眼睛。
  fr.a1.unit53.lesson03.teach.avec_yeux_pluriel:
    title: Yeux 加 -s，marron 不变
    gloss: 与 *yeux*（复数）搭配时，形容词要加 *s*：*yeux bleus*、*yeux verts*。*Marron* 永远不变：*yeux marron*。
    note: 对比第2课的 *cheveux*：复数名词搭配复数形容词，但像 *marron* 这类由名词转来的颜色词除外。
  fr.a1.unit53.lesson03.teach.comment_est_camille:
    title: Camille长什么样？
    gloss: Camille长什么样？
    note: '*Comment est ... ?* 是本单元的核心问句；可以用它来询问任何人的外貌。'
  fr.a1.unit53.lesson03.teach.camille_a_les:
    title: 卡米耶留着金色长发，有一双蓝眼睛
    gloss: 卡米耶留着金色长发，有一双蓝眼睛。
    note: 这是一个示范回答，用 *et* 把头发和眼睛合在一句话里。
  fr.a1.unit53.lesson04.teach.camille_une_nouvelle:
    title: 卡米耶介绍妮娜
    gloss: 卡米耶：有一个新来的女孩要来语言咖啡馆。她叫妮娜。
    note: '*Une nouvelle fille vient* 用来介绍场景中出现的新人；*vient* 来自 *venir*（来）。'
  fr.a1.unit53.lesson04.teach.mathieu_d_accord:
    title: 马蒂厄问她长什么样
    gloss: 马蒂厄：好的！她长什么样？
    note: 沿用核心问句，用 *elle*（她）代替人名：*Comment est-elle ?* 连字符把动词和代词连在一起。
  fr.a1.unit53.lesson04.teach.camille_elle_est:
    title: 卡米耶描述妮娜的身高和头发
    gloss: 卡米耶：她个子小，留着金色短发。
    note: 结合了第1课的 *petite* 和第2课的头发词汇；用于女孩时，*petite* 要加 *e*。
  fr.a1.unit53.lesson04.teach.mathieu_et_ses:
    title: 马蒂厄问她的眼睛
    gloss: 马蒂厄：那她的眼睛呢？
    note: 这里的 *Ses yeux* 指“她的眼睛”：*ses* 与 *yeux* 一致，而不是与这个女孩一致。
  fr.a1.unit53.lesson04.teach.camille_elle_a:
    title: 卡米耶描述妮娜的眼睛
    gloss: 卡米耶：她有一双绿眼睛。
    note: 沿用第3课的 *yeux verts*。
  fr.a1.unit53.lesson04.teach.mathieu_merci_alors:
    title: 马蒂厄会认出她
    gloss: 马蒂厄：谢谢！那我就能认出她了。
    note: '*Je vais la reconnaître* 用 *aller* 加动词原形表示近将来，*la* 的意思是“她”。'
  fr.a1.unit53.lesson05.teach.thomas_et_lea:
    title: 比较Thomas和Léa
    gloss: 托马和莱娅是兄妹，但他们长得不像，差别很大。托马个子小，留着棕色短发，有一双棕色的眼睛。莱娅比托马高，留着棕色长发，有一双绿眼睛。那你呢，你长什么样？
    note: 这段简短的比较复习了目前学过的所有颜色和长度词，最后用本单元的核心问题询问你的外貌。
    glosses:
      frère: 兄弟
      sœur: 姐妹
      ressemblent: 看起来
      différents: 不同的
      petit: 矮的
      courts: 矮的
      bruns: 棕色的
      cheveux: 头发
      marron: 棕色的
      yeux: 眼睛
      grande: 更高的
      longs: 长的
      verts: 绿色的
      se: （“se ressemblent”的一部分，意思是“长得像”）
  fr.a1.unit53.lesson05.teach.tu_connais_deja:
    title: 用 plus ... que 比较人
    gloss: 你已经学过 *plus* + 形容词 + *que* 这个结构。这里用它来比较人：莱娅比托马高。
    note: 这与购物单元中的 *plus ... que* 结构相同，只是现在用于比较人而不是物品。*Grande* 与 *Léa* 一致，因为她是女性。
  fr.a1.unit53.lesson05.teach.lea_a_les:
    title: 莱娅的头发比托马的长
    gloss: 莱娅的头发比托马的长。
    note: '*Plus longs que* 与 *cheveux*（复数）一致：*les cheveux plus longs que Thomas*。'
  fr.a1.unit53.lesson05.teach.j_ai_les:
    title: 我留着棕色短发
    gloss: 我留着棕色短发。
    note: 这是一个用 *J'ai ...* 的第一人称示范句，描述自己的外貌时可以直接套用。
  fr.a1.unit53.lesson06.teach.mathieu_regarde_c:
    title: 马蒂厄发现了妮娜
    gloss: 马蒂厄：看，那是妮娜吗？她留着金色短发，有一双绿眼睛。
    note: '*Regarde*（看）是 *regarder* 的 *tu* 命令式，之前的对话中已经用过同样的形式。'
  fr.a1.unit53.lesson06.teach.camille_oui_c:
    title: 卡米耶确认
    gloss: 卡米耶：对，是妮娜！
    note: 这是一个简短自然的肯定回答。
  fr.a1.unit53.lesson06.teach.nina_salut_tu:
    title: 妮娜向马蒂厄问好
    gloss: 妮娜：你好，你是马蒂厄吗？
    note: 一个简单的非正式问候句：*Tu es ... ?*
  fr.a1.unit53.lesson06.teach.mathieu_oui_ravi:
    title: 马蒂厄回应妮娜的问候
    gloss: 马蒂厄：是的！很高兴认识你，妮娜。
    note: '*Ravi de te rencontrer* 是初次见面时的标准用语（男性用 *ravi*，女性用 *ravie*），而 *content de te revoir* 用于已经认识的人。'
  fr.a1.unit53.lesson06.teach.nina_ravie_de:
    title: Nina 回应问候
    gloss: Nina：我也很高兴认识你！
    note: 对话到此结束——马蒂厄根据卡米耶之前的描述成功认出了妮娜。
