course:
  title: 法语 A1
  description: 市场词汇，用 combien/kilo/litre 询问价格和数量，以及数量表达后 du/de la 与单独的 de 的对比，把伊内斯和马蒂厄的烹饪工坊故事延续到市场购物的场景中。法语中，明确说出数量之后完全不用部分冠词（un kilo de tomates，而不是 un kilo des tomates）。
units:
  fr.a1.unit04.shopping:
    title: 和伊内斯一起买菜
lessons:
  fr.a1.unit04.lesson01.au_marche:
    title: 在市场
  fr.a1.unit04.lesson02.combien_ca_coute:
    title: 多少钱？
  fr.a1.unit04.lesson03.dialogue_marche:
    title: 和伊内斯、马蒂厄一起逛市场
teaching:
  fr.a1.unit04.lesson01.teach.marche:
    title: 市场
    gloss: 市场
    note: '*Marché* 是阳性名词。'
    example_gloss: 市场星期六开放。
  fr.a1.unit04.lesson01.teach.boulangerie:
    title: 面包店
    gloss: 面包店
    note: '*Boulangerie* 是阴性名词，指专门卖面包的店，不同于 *pâtisserie*（糕点店）。'
    example_gloss: 这附近有一家不错的面包店。
  fr.a1.unit04.lesson01.teach.legumes:
    title: 蔬菜
    gloss: 蔬菜
    note: '*Légumes* 是阳性复数名词。'
    example_gloss: 我为工作坊买新鲜蔬菜。
  fr.a1.unit04.lesson01.teach.fruits:
    title: 水果
    gloss: 水果
    note: '*Fruits* 是阳性复数名词。汉语说“水果”时不分单复数，而法语常用复数形式 *les fruits* 来表示。'
    example_gloss: 这个月水果很贵。
  fr.a1.unit04.lesson01.teach.prix:
    title: 价格
    gloss: 价格
    note: '*Prix* 是阳性名词，单复数拼写相同。'
    example_gloss: 面包多少钱？
  fr.a1.unit04.lesson01.teach.cher:
    title: 贵
    gloss: 贵
    note: '*Cher* 是阳性形式；*chère* 是阴性，*chers*/*chères* 是复数，要与所修饰的名词一致。'
    example_gloss: 这块奶酪太贵了。
  fr.a1.unit04.lesson01.teach.pas_cher:
    title: 今天不贵
    gloss: 今天的蔬菜不贵。
    note: '*Pas cher(s)*（省略 *ne*）是口语中表示东西便宜的常见说法；完整的书面形式是 *ne sont pas chers*。'
  fr.a1.unit04.lesson02.teach.un_kilo_de:
    title: 一公斤……
    gloss: 一公斤……
    note: '*De* 直接跟在数量后面，中间不加冠词，见下面的“数量后的 *de*”语法说明。'
    example_gloss: 我想要一公斤西红柿。
  fr.a1.unit04.lesson02.teach.un_litre_de:
    title: 一升……
    gloss: 一升……
    note: '*Litre* 是阳性名词，用于液体，就像 *kilo* 用于固体一样。'
    example_gloss: 请给我一升牛奶。
  fr.a1.unit04.lesson02.teach.euro:
    title: 一欧元
    gloss: 一欧元
    note: '*Euro* 的复数规则变化：*deux euros*、*cinq euros*。'
    example_gloss: 这个五欧元。
  fr.a1.unit04.lesson02.teach.de_after_quantity:
    title: 数量后的 de
    gloss: ……的
    note: 在表示明确数量的词（*un kilo*、*un litre*、*beaucoup*，如 *beaucoup de cousins*）之后，法语只用单纯的 *de*，完全不用 *du*/*de la*/*des*：说 *un kilo de tomates*，绝不说 *un kilo des tomates*。
  fr.a1.unit04.lesson02.teach.combien_ca_coute:
    title: 询问价格
    gloss: 多少钱？
    note: '*Combien*（多少）加上 *ça coûte*（它值多少钱）是询问价格最通用的说法。'
  fr.a1.unit04.lesson02.teach.cest_combien_pain:
    title: 询问某件商品的价格
    gloss: 面包多少钱？
    note: '*C''est combien, [item] ?* 会点明所问价格的具体商品，是 *Combien ça coûte ?* 的常用替代说法。'
  fr.a1.unit04.lesson02.teach.ca_fait_combien:
    title: 询问总价
    gloss: 一共多少钱？
    note: '*Ça fait combien ?* 用来询问累计的总价，通常在买完东西结账时说，而不是问单件商品的价格。'
  fr.a1.unit04.lesson03.teach.line01:
    title: 买西红柿
    gloss: 伊内斯向摊贩问好，并要一公斤西红柿。
    note: 把 *Bonjour* 与 *je voudrais* + 数量的句型结合在一起。
  fr.a1.unit04.lesson03.teach.line02:
    title: 询问是否还需要别的
    gloss: 摊贩答应后，问她还需要什么。
    note: '*Autre chose ?*（还要别的吗？）是店主常用的追问。'
  fr.a1.unit04.lesson03.teach.line03:
    title: 再加奶酪并问价格
    gloss: 伊内斯再要一点奶酪，并问价格。
    note: '*Un peu de fromage*（一点奶酪）和 *un kilo de* 一样，都是 *de* 后面不加冠词的句型。'
  fr.a1.unit04.lesson03.teach.line04:
    title: 说出每公斤的价格
    gloss: 摊贩说每公斤八欧元。
    note: '*X euros le kilo* 是法语中表示单位价格的自然说法，这里的 *le* 表示“每”，而不是“那个”。'
  fr.a1.unit04.lesson03.teach.line05:
    title: 说明他为什么要在这里买面包
    gloss: 马蒂厄说他也想要面包，但面包店今天关门了。
    note: '*Fermée*（关闭的）是阴性形式，与 *la boulangerie* 保持一致。'
  fr.a1.unit04.lesson03.teach.line06:
    title: 提出另一个办法
    gloss: 伊内斯安慰他说，这里也可以买到面包。
    note: '*On peut*（可以）加动词原形，是表达可能性的常见非正式说法。'
  fr.a1.unit04.lesson03.teach.line07:
    title: 确认并报出总价
    gloss: 摊贩确认有新鲜面包，自问总共多少钱，然后报出十三欧元五十。
    note: 这里的 *Ça fait combien en tout ?* 是摊贩报总价前的自言自语，并不是在问伊内斯。
  fr.a1.unit04.lesson03.teach.line08:
    title: 向小贩道谢
    gloss: 伊内斯付钱时热情地向他道谢。
    note: 这里的 *Voilà* 伴随着递钱的动作，是常见的配合手势的用语。
