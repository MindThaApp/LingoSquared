course:
  title: 法语 A1
  description: 常见的街区场所，以及如何问路和简单指路（en face de、à côté de、près de、loin de），继续讲述马蒂厄在工作室附近寻找药店的故事。这些表示位置的短语都以 de 结尾，而 de 在阳性名词或复数名词前要缩合为 du／des（du café、des arbres），不能直接接名词。
