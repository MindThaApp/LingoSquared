teaching:
  fr.a1.unit07.lesson01.teach.gare:
    title: 火车站
    gloss: 火车站
    note: '*Gare* 是阴性名词。'
    example_gloss: 火车站很大。
  fr.a1.unit07.lesson01.teach.pharmacie:
    title: 药店
    gloss: 药店
    note: '*Pharmacie* 是阴性名词。'
    example_gloss: 药店九点开门。
  fr.a1.unit07.lesson01.teach.banque:
    title: 银行
    gloss: 银行
    note: '*Banque* 是阴性名词。'
    example_gloss: 银行星期天不营业。
  fr.a1.unit07.lesson01.teach.ecole:
    title: 学校
    gloss: 学校
    note: '*École* 是阴性名词；因为它以元音发音开头，所以 *l''* 要省音。'
    example_gloss: 学校在公园旁边。
  fr.a1.unit07.lesson01.teach.cafe:
    title: 咖啡馆
    gloss: 咖啡馆
    note: '*Café* 是阳性名词；在其他语境中它也可以指“咖啡”。'
    example_gloss: 咖啡馆整天营业。
  fr.a1.unit07.lesson01.teach.poste:
    title: 邮局
    gloss: 邮局
    note: 这里的 *poste*（阴性）表示“邮局”；而 *le poste*（阳性，意思不同）可以指“职位／岗位”——词性不同，意思也不同。
    example_gloss: 邮局六点关门。
  fr.a1.unit07.lesson01.teach.la_gare_est_grande:
    title: 比较两个地方
    gloss: 火车站很大，药店很小。
    note: 这里 *grande*／*petite* 都与阴性名词（*la gare*、*la pharmacie*）保持一致。
  fr.a1.unit07.lesson02.teach.ou_est_la_gare:
    title: 询问某个地方在哪里
    gloss: 请问，火车站在哪里？
    note: '*Où est... ?* 是询问地点位置的标准通用说法。'
  fr.a1.unit07.lesson02.teach.en_face_de:
    title: 说某处在……对面
    gloss: 银行在火车站对面。
    note: '*En face de*（在……对面）以 *de* 结尾，后面接作参照的地点：*en face de la banque*。在阳性名词前要缩合：*en face du café*。'
  fr.a1.unit07.lesson02.teach.a_cote_de:
    title: 说某处在……旁边
    gloss: 药店在银行旁边。
    note: '*À côté de*（在……旁边）与 *en face de* 一样，都靠 *de* 连接后面的名词。'
  fr.a1.unit07.lesson02.teach.pres_de:
    title: 说某处很近
    gloss: 学校离这里很近。
    note: '*Près de*（靠近）在元音发音前变为 *près d''*，例如 *près d''ici*（离这里近）。'
  fr.a1.unit07.lesson02.teach.loin_de:
    title: 说某处很远
    gloss: 邮局离这里很远。
    note: '*Loin de*（离……远）正好与 *près de* 相反。'
  fr.a1.unit07.lesson02.teach.cest_loin:
    title: 询问是否很远
    gloss: 离这里远吗？——不，不远。
    note: 听完方向后，*C'est loin d'ici ?* 是很自然的追问。要表示否定，把 *ne... pas* 放在动词两侧：*ce n'est pas loin*（不远）。
  fr.a1.unit07.lesson03.teach.line01:
    title: 向陌生人问路
    gloss: 马蒂厄礼貌地问路人药店在哪里。
    note: 接近陌生人时，标准的礼貌开场是 *Excusez-moi*（打扰一下），并搭配 *vous* 使用。
  fr.a1.unit07.lesson03.teach.line02:
    title: 说明位置
    gloss: 她说药店在银行对面、咖啡馆旁边。
    note: 一句话里同时用了 *en face de* 和 *à côté de*，把位置说得很准确。*De* + *le café* 缩合为 *du café*。
  fr.a1.unit07.lesson03.teach.line03:
    title: 询问是否很远
    gloss: 马蒂厄问离这里远不远。
    note: 就是你学过的询问距离的 *C'est loin d'ici ?*。
  fr.a1.unit07.lesson03.teach.line04:
    title: 告诉对方很近
    gloss: 她说不，很近——走路五分钟。
    note: '*À pied*（步行）是说明以走路作为出行方式的标准说法。'
  fr.a1.unit07.lesson03.teach.line05:
    title: 向她道谢
    gloss: 马蒂厄热情地向她道谢。
    note: '*Merci beaucoup* 是在前面单元学过的 *merci* 的加强说法。'
  fr.a1.unit07.lesson03.teach.line06:
    title: 回应感谢
    gloss: 她回答：不客气。
    note: '*Je vous en prie* 是较正式的“不客气”，与对陌生人使用的 *vous* 语体相符；*De rien* 则较随意，是日常的另一种说法。'
