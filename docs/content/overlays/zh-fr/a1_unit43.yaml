teaching:
  fr.a1.unit43.lesson01.teach.le_billet:
    title: 门票
    gloss: 这张门票
    note: '*Billet* 是阳性：*le billet*，*un billet*。'
    example_gloss: 我想要一张去里昂的票。
  fr.a1.unit43.lesson01.teach.je_voudrais_un:
    title: 请求买票
    gloss: 我想要一张去里昂的票。
    note: '*Je voudrais* 使请求更委婉，比 *je veux* 更有礼貌。'
  fr.a1.unit43.lesson01.teach.voulez_vous_un:
    title: 售票员询问票种
    gloss: 您要单程票还是往返票?
    note: '*Voulez-vous* 是 *vouloir* 的敬称 *vous* 形式，这里用于不熟悉的车站工作人员。'
  fr.a1.unit43.lesson01.teach.un_aller_retour:
    title: 礼貌地回答
    gloss: 请给我往返票。
    note: '*S''il vous plaît* 是敬称的“请”，与这段对话的 *vous* 语体一致。'
  fr.a1.unit43.lesson01.teach.au_guichet_on:
    title: 售票窗口的称呼方式
    gloss: 在售票窗口，通常使用敬称 *vous*。
    note: 对服务行业中的陌生人用 *vous*；对朋友和家人用 *tu*。
  fr.a1.unit43.lesson02.teach.le_quai:
    title: 站台
    gloss: 站台
    note: '*Quai* 是阳性：*le quai*。'
    example_gloss: 去里昂的火车从哪个站台出发？
  fr.a1.unit43.lesson02.teach.de_quel_quai:
    title: 询问站台
    gloss: 去里昂的火车从哪个站台出发？
    note: '*De quel quai* 专门询问站台；*quel* 与阳性名词 *quai* 保持一致。'
  fr.a1.unit43.lesson02.teach.le_train_part:
    title: 说明发车信息
    gloss: 火车九点三刻从五号站台发车。
    note: '*Dix heures moins le quart* 是“差一刻十点”：表示整点之前的时间，法语用 *moins*（减），这与中文的“差”说法相近。'
  fr.a1.unit43.lesson02.teach.a_quelle_heure:
    title: 询问到达时间
    gloss: 火车几点到?
    note: '*À quelle heure arrive ... ?* 用来询问时间；*arriver* 是规则的 *-er* 动词：*le train arrive*。'
  fr.a1.unit43.lesson02.teach.le_train_arrive:
    title: 说明到达时间
    gloss: 火车十一点到。
    note: '*Arrive* 是 *arriver* 的 *il/elle* 形式；*-er* 动词搭配 *il* 和 *elle* 时以 *-e* 结尾。'
  fr.a1.unit43.lesson03.teach.a_l_heure:
    title: 准时/延误
    gloss: 准时;延误
    note: '*À l''heure* 是固定表达，表示按时发生。*Le retard*（晚点）是阳性。'
    example_gloss:
    - 火车没有准时发车。
    - 注意：去里昂的火车晚点了。
  fr.a1.unit43.lesson03.teach.attention_le_train:
    title: 一则广播
    gloss: 注意：去里昂的火车晚点了。
    note: '*Attention* 用于车站广播的开头，类似中文的“各位旅客请注意”。'
  fr.a1.unit43.lesson03.teach.le_train_ne:
    title: 否定“准时”
    gloss: 火车没有准时发车。
    note: '*Ne ... pas* 包在动词两边：*ne part pas à l''heure*。'
  fr.a1.unit43.lesson03.teach.le_train_part:
    title: 站台变更
    gloss: 火车改从三号站台发车,而不是五号站台。
    note: '*Au lieu du* 的意思是“而不是……”；*de* + *le* 合并为 *du*。'
  fr.a1.unit43.lesson03.teach.le_train_a:
    title: 说明晚点时长
    gloss: 火车晚点十分钟。
    note: '*A ... de retard*（字面意思是“有……的延误”）是表示晚点的自然说法；这里用 *avoir*。'
  fr.a1.unit43.lesson04.teach.l_entree_la:
    title: 入口、出口、候车室
    gloss: 入口;出口;候车室
    note: '*L''entrée* 的 *e* 在元音前省略为 *l''*；*la sortie* 和 *la salle d''attente* 是阴性。'
    example_gloss:
    - 入口在哪里?
    - 出口在哪里?
    - 候车室在哪里?
  fr.a1.unit43.lesson04.teach.ou_est_le:
    title: 询问站台在哪里
    gloss: 七号站台在哪里？
    note: '*Où est ... ?* 用来询问某物在哪里；*le quai sept* 是阳性。'
  fr.a1.unit43.lesson04.teach.tout_droit_puis:
    title: 指路
    gloss: 一直往前走,然后向右转。
    note: '*Tout droit* 和 *à droite* 是表示方向的词；*à* 放在 *droite* 前面。'
  fr.a1.unit43.lesson04.teach.ou_est_la:
    title: 询问候车室
    gloss: 候车室在哪里?
    note: 同一个问句句型,用在新的地点上。
  fr.a1.unit43.lesson05.teach.billet_paris_gare:
    title: 读一张车票
    gloss: 车票：从巴黎里昂火车站到里昂帕尔迪厄站。出发：十点十分，七号站台。到达：差十分十一点。往返。价格：十二欧元四十分。
    note: 请找出发车时间和站台、到达时间、票种以及票价。
    glosses:
      Billet: 门票
      Départ: 发船
      dix: 十
      quai: 站台
      sept: 七
      Arrivée: 到达
      onze: 十一
      Aller-retour: 往返票
      Prix: 票价
      douze: 十二
      euros: 欧元
      quarante: 四十
  fr.a1.unit43.lesson06.teach.mathieu_on_doit:
    title: 马蒂厄说明计划
    gloss: 马蒂厄：我们得去七号站台。火车十点十分发车。
    note: '*On doit*（来自 *devoir*）这里表示实际需要，而不是严格的义务。'
  fr.a1.unit43.lesson06.teach.camille_regarde_voila:
    title: 卡米耶看指示牌
    gloss: 卡米耶：看，指示牌在那儿：晚点，十分钟。
    note: '*Voilà* 用来指出所在之处：*voilà le panneau*。'
  fr.a1.unit43.lesson06.teach.mathieu_pas_de:
    title: 马蒂厄很镇定
    gloss: 马蒂厄：没问题，我们还有时间喝杯咖啡。
    note: '*Pas de problème* 是常见的口语安慰说法。'
  fr.a1.unit43.lesson06.teach.camille_bonne_idee:
    title: 火车到了
    gloss: 卡米耶：好主意。哦，火车已经来了。七号站台，正好！
    note: '*Déjà*（已经）表示考虑到刚刚通知的晚点，火车比预期来得早。'
  fr.a1.unit43.lesson06.teach.mathieu_allez_on:
    title: 他们上了火车
    gloss: 马蒂厄：走吧，上车。里昂，我们到啦！
    note: '*On* 在日常口语中相当于 *我们*，动词用 *il* 对应的变位形式：*on monte*。*On arrive !* 是表达“我们这就到啦”的自然说法，逐字翻译会显得很奇怪。'
