course:
  title: 法语 A1
  description: 使用复合过去时简短讲述最近发生的一件已完成的事，同时用到助动词 avoir 和 être，并延续 Inès 和 Mathieu 的烹饪工坊故事，由 Mathieu 讲述上周六活动中的一次小意外。法语有两个不同的助动词（大多数动词用 avoir，少数动词如 aller、arriver、rester 用 être），而且用 être 的动词，其过去分词要和主语的性别一致（arrivé／arrivée）。
units:
  fr.a1.unit12.past_events:
    title: 发生了什么？
lessons:
  fr.a1.unit12.lesson01.passe_compose_avoir:
    title: 用 avoir 的复合过去时
  fr.a1.unit12.lesson02.passe_compose_etre:
    title: 用 être 的复合过去时
  fr.a1.unit12.lesson03.dialogue_atelier_dernier:
    title: 上周六的工坊
teaching:
  fr.a1.unit12.lesson01.teach.jai_prepare:
    title: 我准备了
    gloss: 我准备了／我做了
    note: 规则的 -ER 动词，复合过去时的过去分词以 *-é* 结尾：*préparer* → *préparé*，助动词用 *avoir*。
    example_gloss: 我为工坊做了一个蛋糕。
  fr.a1.unit12.lesson01.teach.jai_achete:
    title: 我买了
    gloss: 我买了
    note: '*Acheter* 和 *préparer* 一样，用 *avoir* + *-é* 的结构。'
    example_gloss: 我在市场买了蔬菜。
  fr.a1.unit12.lesson01.teach.jai_oublie:
    title: 我忘了
    gloss: 我忘了
    note: '*Oublier* → *oublié*，同样是规则变化。'
    example_gloss: 我把黄油忘在家里了！
  fr.a1.unit12.lesson01.teach.tu_as_aime:
    title: 你喜欢过
    gloss: 你喜欢过
    note: '*Tu as* + 过去分词，是同一个 *avoir* 结构的 *tu* 形式。'
    example_gloss: 你喜欢这个蛋糕吗？
  fr.a1.unit12.lesson01.teach.il_a_goute:
    title: 他尝了
    gloss: 他尝了
    note: '*Il a* + 过去分词是 *il* 的形式：助动词 *avoir* 随主语变化，过去分词不变。'
    example_gloss: Mathieu 尝了尝酱汁。
  fr.a1.unit12.lesson01.teach.grammar_avoir_participe:
    title: Avoir + 过去分词
    gloss: avoir + 过去分词（-é）
    note: 大多数法语动词的复合过去时用 *avoir* 作助动词，再加过去分词；规则的 -ER 动词，过去分词以 *-é* 结尾。
  fr.a1.unit12.lesson01.teach.la_semaine_derniere:
    title: 上周
    gloss: 上周
    note: '*Dernière*（上一个的）与阴性的 *semaine* 一致；阳性形式是 *dernier*，如 *samedi dernier*（上周六）。'
    example_gloss: 上周，我做了一个蛋糕。
  fr.a1.unit12.lesson02.teach.je_suis_arrive:
    title: 我到了
    gloss: 我到了
    note: '*Arriver* 属于少数用 *être* 而不用 *avoir* 作助动词的动词（多为表示移动的动词）。'
    example_gloss: 我到工坊时迟到了。
  fr.a1.unit12.lesson02.teach.je_suis_alle:
    title: 我去了
    gloss: 我去了
    note: '*Aller* 也用 *être*。过去分词要和主语一致：*allé*（阳性）或 *allée*（阴性，如 Inès 会说的）。'
    example_gloss: 工坊开始前，我去了市场。
  fr.a1.unit12.lesson02.teach.il_est_reste:
    title: 他留下了
    gloss: 他留下了
    note: '*Rester*（留下）也是用 *être* 作助动词的动词，一致规则相同。'
    example_gloss: Mathieu 留下来打扫厨房。
  fr.a1.unit12.lesson02.teach.grammar_etre_accord:
    title: Être + 过去分词的一致
    gloss: être + 过去分词（与主语一致）
    note: 助动词是 *être* 的动词，过去分词要在性和数上与主语一致；助动词是 *avoir* 的动词则不这样。
  fr.a1.unit12.lesson02.teach.en_retard:
    title: 迟到；晚点
    gloss: 迟到的；晚了
    note: '*En retard* 表示比预定时间晚到，常与 *arriver* 搭配。'
    example_gloss: 公交车晚点了。
  fr.a1.unit12.lesson02.teach.finalement:
    title: 最后／终于
    gloss: 最后／终于
    note: '*Finalement* 用来收束一个小故事，表示经过前面的波折后的最终结果。'
    example_gloss: 最后，蛋糕很好吃。
  fr.a1.unit12.lesson02.teach.quest_ce_qui_sest_passe:
    title: 发生了什么？
    gloss: 发生了什么？
    note: '*Qu''est-ce qui s''est passé ?* 是询问发生了什么事的标准说法。'
    example_gloss: 工坊上发生了什么？
  fr.a1.unit12.lesson03.teach.line01:
    title: 询问发生了什么
    gloss: Inès 问上周六的工坊发生了什么——她没能来。
    note: '*Qu''est-ce qui s''est passé ?*（发生了什么？）是询问过去事件的标准说法。'
  fr.a1.unit12.lesson03.teach.line02:
    title: 讲述小意外
    gloss: Mathieu 说哎呀，他迟到了，还把黄油忘在家里了！
    note: 一句话里有两种复合过去时：*être*（*je suis arrivé*）和 *avoir*（*j'ai oublié*）。
  fr.a1.unit12.lesson03.teach.line03:
    title: 问他做了什么
    gloss: Inès 问他接着做了什么。
    note: '*Qu''est-ce que tu as fait ?*（你做了什么？）用的是 *faire* 不规则的过去分词。'
  fr.a1.unit12.lesson03.teach.line04:
    title: 说明补救办法
    gloss: Mathieu 说他很快去了街角的杂货店。
    note: '*L''épicerie du coin*（街角的杂货店）中的 *coin* 和 *au coin de la rue*（在街角）里的用法相同。'
  fr.a1.unit12.lesson03.teach.line05:
    title: 问有没有成功
    gloss: Inès 问他在那里有没有找到黄油。
    note: '*Tu as trouvé... ?*（你找到……了吗？）是另一个规则的 *avoir* 助动词疑问句。'
  fr.a1.unit12.lesson03.teach.line06:
    title: 圆满的结局
    gloss: Mathieu 说是的，最后蛋糕很好吃！
    note: 用 *finalement* 为故事画上圆满的句号，化解了前面的小意外。
