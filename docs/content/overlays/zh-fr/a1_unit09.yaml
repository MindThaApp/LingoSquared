course:
  title: 法语 A1
  description: 学习问路和指路的基本表达（à gauche/à droite、tout droit、au coin de la rue、traverser），并延续伊内斯和马修的烹饪工坊故事：伊内斯在寻找一家厨具店。法语指路既可以用 vous 的命令式（"Tournez à gauche"），也可以用现在时（"Tu tournes à gauche"）；汉语多用“向左转”“你往左拐”这类说法，而法语会随对象和语气改变动词形式。
units:
  fr.a1.unit09.directions:
    title: 怎么去那里？
lessons:
  fr.a1.unit09.lesson01.vocabulaire_directions:
    title: 问路常用词
  fr.a1.unit09.lesson02.donner_des_indications:
