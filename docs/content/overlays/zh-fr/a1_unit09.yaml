teaching:
  fr.a1.unit09.lesson01.teach.a_gauche:
    title: 左边
    gloss: 在左边／向左
    note: '*À gauche* 既可以表示位置（“在左边”），也可以表示方向（“向左转”）。'
    example_gloss: 过了面包店向左转。
  fr.a1.unit09.lesson01.teach.a_droite:
    title: 右边
    gloss: 在右边／向右
    note: 与 *à gauche* 正好相反，用法相同。
    example_gloss: 药店在咖啡馆的右边。
  fr.a1.unit09.lesson01.teach.tout_droit:
    title: 一直往前
    gloss: 一直往前
    note: '*Tout droit* 的意思是“一直往前”，不要和看起来相似的 *à droite*（“向右”）混淆，两者意思不同。'
    example_gloss: 一直往前走到市场。
  fr.a1.unit09.lesson01.teach.au_coin_de_la_rue:
    title: 在街角
    gloss: 在街角
    note: '*Au coin de* 的意思是“在……的拐角”；*au coin de la rue*（在街角）是非常常见的地标说法。'
    example_gloss: 那家店就在街角。
  fr.a1.unit09.lesson01.teach.traverser:
    title: 穿过
    gloss: 穿过
    note: '*Traverser* 是规则的 -ER 动词：*je traverse*、*tu traverses*，依此类推。'
    example_gloss: 要穿过马路才能到那家店。
  fr.a1.unit09.lesson01.teach.la_boutique:
    title: 小店
    gloss: 商店
    note: '*La boutique* 通常指小型的专卖店，与大型商场不同。'
    example_gloss: 那家店在街角，右手边。
  fr.a1.unit09.lesson01.teach.le_carrefour:
    title: 十字路口
    gloss: 十字路口
    note: '*Le carrefour* 是两条街交叉的地方，是口头指路时常用的地标。'
    example_gloss: 在十字路口向左转。
  fr.a1.unit09.lesson02.teach.pour_aller_a:
    title: 问怎么去某个地方
    gloss: 请问，去商店怎么走？
    note: '*Pour aller à... ?*（字面意思是“为了去……”）是礼貌地询问去某地怎么走的标准说法。'
  fr.a1.unit09.lesson02.teach.tournez_a_gauche:
    title: 向左拐
    gloss: 过了药店向左转。
    note: '*Tournez* 是 *tourner*（转弯）的 *vous* 命令式，是给不太熟的人指路时的常规说法。'
  fr.a1.unit09.lesson02.teach.continuez_tout_droit:
    title: 一直往前走
    gloss: 一直走到十字路口。
    note: '*Continuez*（继续走）+ *tout droit*（一直往前）是让人不拐弯继续走的标准说法。'
  fr.a1.unit09.lesson02.teach.cest_au_coin:
    title: 说明位置
    gloss: 就在街角，右手边。
    note: 把 *au coin de la rue* 和 *à droite* 结合起来，说明准确的位置。
  fr.a1.unit09.lesson02.teach.cest_loin:
    title: 说不远
    gloss: 不远，步行五分钟。
    note: '*À cinq minutes à pied*（步行五分钟）和马修询问药店时用到的步行时间句型相同。'
  fr.a1.unit09.lesson03.teach.line01:
    title: 询问商店
    gloss: 伊内斯问马修是否知道哪里有店可以买厨具。
    note: '*Tu connais... ?*（你知道……吗）是询问对方是否熟悉某个地方的标准非正式说法。'
  fr.a1.unit09.lesson03.teach.line02:
    title: 说出第一步
    gloss: 马修说有，离这儿不远：在十字路口向左转。
    note: '*Il y en a une*（有一家）用 *en* 来避免重复 *boutique*，这是口语中常见的省略方式。'
  fr.a1.unit09.lesson03.teach.line03:
    title: 确认并继续问
    gloss: 伊内斯确认在十字路口向左转，并问接下来怎么走。
    note: '*Et ensuite ?*（然后呢？）是询问下一步怎么走的简单自然的说法。'
  fr.a1.unit09.lesson03.teach.line04:
    title: 说出第二步
    gloss: 马修说接下来一直往前走，然后穿过马路。
    note: 用 *et* 连接两个表示方向的动词，是说明简短路线的自然方式。
  fr.a1.unit09.lesson03.teach.line05:
    title: 问具体位置
    gloss: 伊内斯问那家店具体在哪里。
    note: '*Exactement*（究竟、确切地）表示想要比大致方向更精确的回答。'
  fr.a1.unit09.lesson03.teach.line06:
    title: 说明确切位置
    gloss: 马修说它在街角，就在面包店正对面。
    note: '*En face de*（在……对面）用地标来说明位置，是结束指路时很自然的说法。'
