teaching:
  fr.a1.unit44.lesson01.teach.je_ne_me:
    title: 觉得不舒服
    gloss: 我感觉不舒服。
    note: '*Se sentir* 是代词式动词（*je me sens*）；*ne ... pas bien* 是表示感觉有点不对劲的一般、委婉说法。'
  fr.a1.unit44.lesson01.teach.malade:
    title: 生病
    gloss: 生病的
    note: 基本形容词，与 *être* 连用：*je suis malade*。
    example_gloss: 我生病了。
  fr.a1.unit44.lesson01.teach.je_suis_malade:
    title: 生病了
    gloss: 我生病了。
    note: '*Malade* 表示比 *pas bien* 更笼统、更严重的状态。'
  fr.a1.unit44.lesson01.teach.mal_a_la:
    title: 头疼
    gloss: 头疼
    note: '*Mal à la tête* 与 *avoir* 连用：*j''ai mal à la tête*；因为 *tête* 是阴性，所以用 *à la*。'
    example_gloss: 我头痛。
  fr.a1.unit44.lesson01.teach.j_ai_mal:
    title: 头疼
    gloss: 我头痛。
    note: 症状与 *avoir*（有）搭配：*j'ai mal*。
  fr.a1.unit44.lesson01.teach.mal_au_ventre:
    title: 胃痛
    gloss: 胃痛
    note: '*Mal au ventre*：*au* 是 *à* + *le* 的合并形式，因为 *ventre* 是阳性。'
    example_gloss: 我胃痛。
  fr.a1.unit44.lesson01.teach.j_ai_mal_2:
    title: 胃痛
    gloss: 我胃痛。
    note: 与 *mal à la tête* 的 *avoir* 句型相同，只是用 *au* 代替 *à la*。
  fr.a1.unit44.lesson02.teach.qu_est_ce:
    title: 一般性的询问
    gloss: 你怎么了？
    note: 这是询问是否出了什么问题的通用说法。
  fr.a1.unit44.lesson02.teach.qu_est_ce_2:
    title: 常用习惯说法
    gloss: 你怎么了？
    note: '*Qu''est-ce qui ne va pas ?* 是固定问句，字面意思是“什么不顺利”；不要逐字翻译。'
  fr.a1.unit44.lesson02.teach.mal_a_la:
    title: 喉咙痛
    gloss: 喉咙痛
    note: '*Mal à la gorge* 与 *mal à la tête* 同类：*gorge* 是阴性，所以用 *à la*。'
    example_gloss: 我喉咙痛。
  fr.a1.unit44.lesson02.teach.j_ai_mal:
    title: 喉咙痛
    gloss: 我喉咙痛。
    note: 与其他症状一样，使用 *avoir* 句型。
  fr.a1.unit44.lesson02.teach.ca_va_non:
    title: 关心某人
    gloss: 你还好吗？不，我觉得不舒服。
    note: '*Ça va ?* 是朋友之间非常常见、随意的问候语。'
  fr.a1.unit44.lesson03.teach.la_fievre:
    title: 发烧
    gloss: 发烧
    note: '*La fièvre* 是阴性；跟在 *avoir* 后面时用 *de la*：*j''ai de la fièvre*。'
    example_gloss: 我发烧了。
  fr.a1.unit44.lesson03.teach.j_ai_de:
    title: 发烧
    gloss: 我发烧了。
    note: 采用 *avoir* 句型，并带有部分冠词 *de la*。
  fr.a1.unit44.lesson03.teach.le_rhume:
    title: 感冒
    gloss: 感冒了
    note: '*Le rhume* 是阳性名词，与 *avoir* 连用，不是与 *être* 连用的形容词。'
    example_gloss: 请翻译成中文：Estoy resfriado
  fr.a1.unit44.lesson03.teach.j_ai_un:
    title: 说自己感冒了
    gloss: 请翻译成中文：Estoy resfriado
    note: 法语说 *j'ai un rhume*（“我有感冒”）；不能说 *je suis rhume*。
  fr.a1.unit44.lesson03.teach.malade_se_dit:
    title: 用 être 还是 avoir？
    gloss: '*Malade* 是形容词，与 *être* 连用：我生病了。*Mal*、*fièvre* 和 *rhume* 是名词，与 *avoir* 连用：我感冒了。'
    note: 选用 *être* 还是 *avoir* 取决于词类：*malade* 这样的形容词用 *être*，*fièvre* 这样的名词用 *avoir*，不管病多轻。
  fr.a1.unit44.lesson04.teach.la_pharmacie:
    title: 药店
    gloss: 药店
    note: '*Pharmacie* 是阴性：*la pharmacie*。'
    example_gloss: 我去药店。
  fr.a1.unit44.lesson04.teach.je_peux_vous:
    title: 药剂师的问候
    gloss: 您需要什么？
    note: '*Je peux vous aider ?* 是标准的正式服务用语；*vous* 是敬称形式。'
  fr.a1.unit44.lesson04.teach.avez_vous_quelque:
    title: 为某种症状求药
    gloss: 您有治头痛的药吗？
    note: '*Quelque chose contre* + 症状 是询问药物的自然说法。'
  fr.a1.unit44.lesson04.teach.un_comprime:
    title: 一片药
    gloss: 药片
    note: '*Comprimé* 是阳性：*un comprimé*。'
    example_gloss: 我吃一片药。
  fr.a1.unit44.lesson04.teach.prenez_un_comprime:
    title: 用药说明
    gloss: 一天吃两次，每次一片。
    note: '*Prenez* 是 *prendre*（服用、拿）的 *vous* 命令式，用于给出指示。'
  fr.a1.unit44.lesson04.teach.a_la_pharmacie:
    title: 在药店使用的称呼
    gloss: 在药店要用敬称 *vous*。
    note: 药剂师是不熟悉的服务人员，所以要说 *vous*，和在售票窗口一样。
  fr.a1.unit44.lesson05.teach.conseil_prends_un:
    title: 阅读药店的建议
    gloss: 建议：一天吃两次药片，每次一片，用水送服。好好休息，多喝水。三天后还是觉得不舒服吗？那就去看医生。
    note: 请留意用药剂量、两条药物之外的建议，以及什么时候该去看医生。
    glosses:
      Conseil: 建议
      prends: 服用
      fois: 次
      jour: 天
      comprimé: 药片
      Repose-toi: 休息
      bois: 喝
      sens: 感觉
      toujours: 仍然
      bien: 好地
      médecin: 医生
  fr.a1.unit44.lesson06.teach.camille_salut_mathieu:
    title: Camille 来问候
    gloss: Camille：嗨，Mathieu，还好吗？你感觉好些了吗？
    note: '*Déjà*（已经）表明 Camille 在问 Mathieu 自上次聊过之后有没有好转。'
  fr.a1.unit44.lesson06.teach.mathieu_pas_encore:
    title: Mathieu 仍然不舒服
    gloss: Mathieu：还不太好。我还是头疼，而且很累。
    note: '*Toujours*（仍然）表示头疼还没有好；*fatigué*（累）是一个新的实用形容词。'
  fr.a1.unit44.lesson06.teach.camille_tu_as:
    title: Camille 问起药的事
    gloss: Camille：你吃药片了吗？
    note: '*Pris* 是 *prendre* 的过去分词，与 *avoir* 的 *as* 连用：*tu as pris*。'
  fr.a1.unit44.lesson06.teach.mathieu_oui_j:
    title: Mathieu 作出确认
    gloss: Mathieu：是的，我吃了一片药。我现在要去休息了。
    note: '*Je vais me reposer*（要去休息）用 *aller* + 动词原形表示近将来。'
  fr.a1.unit44.lesson06.teach.camille_bonne_idee:
    title: Camille 祝他早日康复
    gloss: Camille：好主意。好好休息。早日康复！
    note: '*Bon rétablissement !* 是祝人早日康复的标准固定表达。'
  fr.a1.unit44.lesson06.teach.mathieu_merci_a:
    title: Mathieu 道别
    gloss: Mathieu：谢谢，明天见！
    note: '*À demain !* 用 *à* + 时间来道别：*à demain*、*à bientôt*。'
