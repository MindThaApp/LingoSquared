teaching:
  fr.a1.unit54.lesson01.teach.l_animal_un:
    title: 动物与宠物
    gloss: 动物／宠物
    note: '*Un animal* 是通用词；*un animal de compagnie*（字面意思是“陪伴的动物”）专指宠物。'
    example_gloss:
    - 狗是一种动物。
    - 狗也是一种宠物。
  fr.a1.unit54.lesson01.teach.le_chien_le:
    title: 狗和猫
    gloss: 狗／猫
    example_gloss:
    - 卡米耶有一只狗。
    - 托马有一只猫。
  fr.a1.unit54.lesson01.teach.le_poisson_l:
    title: 鱼和鸟
    gloss: 鱼／鸟
    example_gloss:
    - 爷爷养了一条鱼。
    - Nina 养了一只鸟。
  fr.a1.unit54.lesson01.teach.tu_as_un:
    title: 你养宠物吗？
    gloss: 你养宠物吗？
    note: 这个 *Tu as ... ?* 的问句结构你在前面的单元已经学过。
  fr.a1.unit54.lesson01.teach.oui_j_ai:
    title: 是的，我有一只狗
    gloss: 是的，我有一只狗。
    note: 使用本单元的新词汇作简单的肯定回答。
  fr.a1.unit54.lesson01.teach.non_je_n:
    title: 不，我没有宠物
    gloss: 不，我没有宠物。
    note: 否定句中 *pas d'* 代替 *un*：*Je n'ai pas d'animal de compagnie.* 见语法说明。
  fr.a1.unit54.lesson01.teach.apres_ne_pas:
    title: Pas de：否定 un/une/des
    gloss: 在 *ne ... pas* 之后，*un*、*une* 和 *des* 变成 *de* 或 *d'*，例如你已经学过的 *Je n'ai pas de temps*，以及这里的 *Je n'ai pas d'animal de compagnie*。
    note: 这里沿用了 *Je n'ai pas de temps* 中已学过的规则：不是新语法，只是换了一个新名词来应用。
  fr.a1.unit54.lesson02.teach.promener:
    title: 遛（动物）
    gloss: 遛（动物）
    note: '*Promener*（遛、带去散步）是规则的 *-er* 动词，见语法说明。'
    example_gloss: 我每天遛狗。
  fr.a1.unit54.lesson02.teach.promener_est_un:
    title: Promener 是规则的 -er 动词
    gloss: '*Promener* 是规则的 *-er* 动词，和 *cuisiner* 一样：*je promène, tu promènes, il promène le chien*。*e* 上的重音符号表示这个音要发出来。'
    note: 和你已经学过的其他 *-er* 动词一样，动词始终保持为一个整体。
  fr.a1.unit54.lesson02.teach.donner_a_manger:
    title: 喂食
    gloss: 喂食
    example_gloss: 我每天给猫喂食。
  fr.a1.unit54.lesson02.teach.jouer_avec:
    title: 和……玩
    gloss: 和……玩
    example_gloss: 托马和他的猫玩。
  fr.a1.unit54.lesson02.teach.je_promene_le:
    title: 我每天遛狗
    gloss: 我每天遛狗。
    note: 把 *promener* 和前面单元学过的 *tous les jours*（每天）结合在一起。
  fr.a1.unit54.lesson02.teach.je_donne_a:
    title: 我每天喂猫
    gloss: 我每天给猫喂食。
    note: 把 *donner à manger*（字面意思是“给吃的”）和 *tous les jours* 结合在一起。
  fr.a1.unit54.lesson03.teach.au_pluriel_on:
    title: 复数：chien -> chiens
    gloss: 复数通常加一个听不到的 *s*：*chien -> chiens*，*chat -> chats*。以 *-al* 结尾的名词变为 *-aux*：*animal -> animaux*。
    note: 法语规则复数的构成方式，在这里首次以动物名词为例介绍。
  fr.a1.unit54.lesson03.teach.chiens_chats:
    title: 狗和猫
    gloss: 狗／猫
    example_gloss:
    - 马蒂厄喜爱狗。
    - 蕾雅喜爱猫。
  fr.a1.unit54.lesson03.teach.poissons_oiseaux:
    title: 鱼和鸟（复数）
    gloss: 鱼（复数）／鸟
    example_gloss:
    - 我喜欢鱼。
    - 爷爷喜欢鸟。
  fr.a1.unit54.lesson03.teach.j_adore_les:
    title: 我喜欢动物
    gloss: 我喜欢动物。
    note: '*Adorer*（非常喜爱）后面直接接名词，表示泛指的喜好时用 *les*：*J''adore les animaux.*'
  fr.a1.unit54.lesson03.teach.lea_adore_les:
    title: 蕾雅喜爱猫，但没有宠物
    gloss: 蕾雅喜爱猫，但她没有宠物。
    note: 这里引出了第 05 课阅读部分所围绕的对比。
  fr.a1.unit54.lesson04.teach.mathieu_tu_as:
    title: 马蒂厄问起宠物
    gloss: 马蒂厄：你有宠物吗，卡米耶？
  fr.a1.unit54.lesson04.teach.camille_oui_j:
    title: 卡米耶有一只狗
    gloss: 卡米耶：有，我有一只狗。
  fr.a1.unit54.lesson04.teach.mathieu_comment_est:
    title: 马蒂厄问它长什么样
    gloss: 马蒂厄：它长什么样？
    note: 沿用外貌单元中的 *Comment est-il ?*，这次用来问动物。
  fr.a1.unit54.lesson04.teach.camille_il_a:
    title: 卡米耶描述她的狗
    gloss: 卡米耶：它的毛是棕色的，个子很小。
    note: 这里再次使用外貌单元学过的毛发颜色和体型词汇，不过描述的是动物的皮毛，而不是人的头发。
  fr.a1.unit54.lesson04.teach.il_et_le:
    title: 动物用 Il/le
    gloss: '*Il*（他）和 *le*（他，作宾语）也可以用于雄性动物，不只用于人。'
    note: 本课程之前出现的 *il* 和 *le* 都指人；这里特别说明它们也可以指动物。
  fr.a1.unit54.lesson04.teach.mathieu_tu_le:
    title: 马蒂厄问遛狗的事
    gloss: 马蒂厄：你每天都遛它吗？
  fr.a1.unit54.lesson04.teach.camille_oui_je:
    title: 卡米耶讲述她的日常
    gloss: 卡米耶：是的，我每天都遛它，也喂它。
  fr.a1.unit54.lesson05.teach.mathieu_et_lea:
    title: 马蒂厄、蕾雅和托马谈动物
    gloss: 马蒂厄和蕾雅都喜爱动物，但两人都没有宠物。马蒂厄喜爱狗，蕾雅喜爱猫。托马则有一只宠物：一只猫。他经常和猫玩，每天喂它。你有宠物吗？
    note: 这里对比了喜欢动物与真正饲养宠物，是本部分要表达的重点。
    glosses:
      adorent: 喜爱
      tous: 两者都
      animaux: 动物
      deux: 两者都
      compagnie: 宠物
      chiens: 狗
      chats: 猫
      chat: 猫
      joue: 玩
      donne: 给
      chaque: 每一
      manger: 食物
  fr.a1.unit54.lesson05.teach.thomas_joue_souvent:
    title: 托马经常和他的猫玩
    gloss: 托马经常和他的猫玩。
    note: '*Souvent*（经常）紧跟在动词后面，和前面学过的日常表达一样。'
  fr.a1.unit54.lesson05.teach.j_adore_les:
    title: 我喜欢狗。我没有宠物。
    gloss: 我喜欢狗。我没有宠物。
    note: 这是一个由两句话组成的示范答案，可以直接套用在本单元的写作题中。
  fr.a1.unit54.lesson06.teach.camille_nina_tu:
    title: 卡米耶问尼娜
    gloss: 卡米耶：尼娜，你也有宠物吗？
  fr.a1.unit54.lesson06.teach.nina_oui_j:
    title: Nina 有一只名叫 Pico 的鸟
    gloss: Nina：是的，我有一只鸟。它叫 Pico。
    note: '*Il s''appelle*（它叫……）用的是第一单元里就学过的介绍名字的动词。'
  fr.a1.unit54.lesson06.teach.mathieu_comme_c:
    title: 马蒂厄的反应
    gloss: 马蒂厄：真好！你每天和它一起做什么？
  fr.a1.unit54.lesson06.teach.nina_je_lui:
    title: Nina 每天给它喂食
    gloss: Nina：我每天都给它喂食。
  fr.a1.unit54.lesson06.teach.mathieu_j_adore:
    title: 马蒂厄也喜欢鸟
    gloss: 马蒂厄：我也很喜欢鸟。
  fr.a1.unit54.lesson06.teach.camille_c_est:
    title: 卡米耶结束对话
    gloss: 卡米耶：太好了，我们三个人都喜欢动物！
    note: 这句话将本单元三个人物与动物有关的信息串联起来，为对话收尾。
