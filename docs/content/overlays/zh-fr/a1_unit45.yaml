teaching:
  fr.a1.unit45.lesson01.teach.tu_fais_quoi:
    title: 询问别人的工作
    gloss: 你是做什么工作的？
    note: 询问别人职业的标准随意说法。
  fr.a1.unit45.lesson01.teach.le_metier_cuisinier:
    title: 职业／厨师
    gloss: 职业；厨师
    note: '*Métier*（职业）是阳性：*le métier*。*Cuisinier* 指女性时要变化：*un cuisinier*，*une cuisinière*。'
    example_gloss:
    - 你的职业是什么？
    - 我是厨师。
  fr.a1.unit45.lesson01.teach.je_travaille_comme:
    title: 说你是厨师
    gloss: 我是厨师。
    note: '*Travailler comme* + 职业是表达工作的标准句型，职业名词前不加冠词。'
  fr.a1.unit45.lesson01.teach.infirmiere:
    title: 护士
    gloss: 护士
    note: '*Infirmière* 是阴性形式（*une infirmière*）；阳性形式是 *infirmier*（*un infirmier*）。这张卡片教的是阴性形式，例句用的是阳性形式。'
    example_gloss: 我是护士。
  fr.a1.unit45.lesson01.teach.je_travaille_comme_2:
    title: 说你是护士
    gloss: 我是护士。
    note: 句型与 *cuisinier* 的 *travailler comme* 相同；阴性形式是 *infirmière*。
  fr.a1.unit45.lesson02.teach.ou_travailles_tu:
    title: 询问工作地点
    gloss: 你在哪里工作？
    note: 紧接着 *Tu fais quoi dans la vie ?* 的直接追问。
  fr.a1.unit45.lesson02.teach.je_travaille_dans:
    title: 在餐厅工作
    gloss: 我在一家餐厅工作。
    note: 这里 *un restaurant* 用不定冠词，因为它是众多餐厅中的一家。
  fr.a1.unit45.lesson02.teach.l_hopital:
    title: 医院
    gloss: 医院
    note: '*Hôpital* 是阳性，并以元音音开头：*l''hôpital*。'
    example_gloss: 我在医院工作。
  fr.a1.unit45.lesson02.teach.je_travaille_a:
    title: 在医院工作
    gloss: 我在医院工作。
    note: '*À l''hôpital* 用定冠词，因为这是特定的、已知的地点；*le* 在元音音前变成 *l''*。'
  fr.a1.unit45.lesson02.teach.certaines_personnes_travaillent:
    title: 在办公室工作
    gloss: 有些人在办公室工作。
    note: '*Dans un bureau*（在办公室里）带冠词，和 *dans un restaurant* 一样。'
  fr.a1.unit45.lesson03.teach.je_commence_a:
    title: 开始时间
    gloss: 我九点开始。
    note: '*Commence* 是 *commencer*（开始）的 *je* 变位形式；*à neuf heures* 表示时间。'
  fr.a1.unit45.lesson03.teach.je_travaille_du:
    title: 工作日
    gloss: 我星期一到星期五工作。
    note: '*Du lundi au vendredi* 表示从星期一到星期五；*du* 是 *de* + *le*，*au* 是 *à* + *le*。'
  fr.a1.unit45.lesson03.teach.la_pause:
    title: 休息
    gloss: 休息
    note: '*Pause* 是阴性：*la pause*。'
    example_gloss: 我十二点休息。
  fr.a1.unit45.lesson03.teach.j_ai_une:
    title: 休息
    gloss: 我十二点休息。
    note: '*Avoir une pause*（休息）是自然的固定搭配。'
  fr.a1.unit45.lesson03.teach.je_finis_a:
    title: 结束时间
    gloss: 我五点下班。
    note: '*Finis* 是 *finir*（结束，完成）搭配 *je* 时的变位形式。'
  fr.a1.unit45.lesson03.teach.je_commence_a_2:
    title: 完整的一个工作日
    gloss: 我九点开始，五点结束。
    note: 用 *et* 把 *je commence* 和 *je finis* 连成一句，描述完整的一个工作日。
  fr.a1.unit45.lesson04.teach.avec_il_ou:
    title: il 和 elle 的动词词尾
    gloss: 主语是“他”或“她”时，规则的 -er 动词和“我”用同一个形式：我工作，他工作，她工作。
    note: '*Travaille* 用于 *je*、*il* 和 *elle* 时形式相同：规则的 *-er* 动词在第三人称单数不加任何词尾。'
  fr.a1.unit45.lesson04.teach.camille_travaille_comme:
    title: 卡米耶的工作
    gloss: 卡米耶是护士。
    note: '*Travaille* 可以搭配 *je*、*il* 和 *elle*：词尾不发音，所以这三个形式读音相同。'
  fr.a1.unit45.lesson04.teach.mathieu_travaille_comme:
    title: 马蒂厄的工作
    gloss: 马蒂厄是厨师。
    note: 词尾与 *Camille travaille comme infirmière* 中的相同。
  fr.a1.unit45.lesson04.teach.elle_travaille_a:
    title: 使用代词
    gloss: 她在医院工作。他在一家餐厅工作。
    note: '*Elle* 和 *il* 代替 Camille 和 Mathieu 这两个名字，但动词形式不变。'
  fr.a1.unit45.lesson05.teach.camille_travaille_comme:
    title: 阅读两份工作简介
    gloss: 卡米耶在医院当护士。她七点开始上班，周一到周五工作。马蒂厄在一家餐厅当厨师。他十一点开始上班，四点休息。
    note: 分别留意每个人的职业、工作地点和时间安排。
    glosses:
      travaille: 工作
      infirmière: 护士
      l'hôpital: 医院
      commence: 开始
      sept: 七
      lundi: 星期一
      vendredi: 星期五
      cuisinier: 厨师
      restaurant: 餐厅
      onze: 十一
      pause: 休息
  fr.a1.unit45.lesson06.teach.camille_salut_mathieu:
    title: 卡米耶问起工作
    gloss: 卡米耶：嗨，马蒂厄！我有点好奇，你到底是做什么工作的？
    note: '*Au fait*（顺便问一下）让这个问题听起来像出于友好的好奇，而不像盘问。'
  fr.a1.unit45.lesson06.teach.mathieu_je_travaille:
    title: 马蒂厄回答
    gloss: 马蒂厄：我在一家餐厅当厨师。你呢？
    note: '*Et toi ?* 是把问题抛回给对方的常用说法。'
  fr.a1.unit45.lesson06.teach.camille_je_travaille:
    title: 卡米耶回答
    gloss: 卡米耶：我在医院当护士。
    note: 与前面课程中已经出现的职业和工作地点一致。
  fr.a1.unit45.lesson06.teach.mathieu_tu_fais:
    title: 马蒂厄问工作时间
    gloss: 马蒂厄：你的工作时间是怎样的？
    note: '*Tu fais quels horaires ?* 是询问别人工作时间的自然说法；*quels* 与复数的 *horaires* 保持一致。'
  fr.a1.unit45.lesson06.teach.camille_je_commence:
    title: 卡米耶说她的工作时间
    gloss: 卡米耶：我七点开始，周一到周五上班。
    note: 与前面阅读材料中已经出现的时间安排一致。
  fr.a1.unit45.lesson06.teach.mathieu_c_est:
    title: 马蒂厄的反应
    gloss: 马蒂厄：真早！我开始得晚一些，十一点。
    note: 与前面已经出现的马蒂厄的上班时间一致。
  fr.a1.unit45.lesson06.teach.camille_chaque_metier:
    title: 卡米耶结束话题
    gloss: 卡米耶：我觉得每份工作都有自己的节奏。
    note: 这是一句自然、带点感慨的结束语——理解意思即可，不必原样复述。
