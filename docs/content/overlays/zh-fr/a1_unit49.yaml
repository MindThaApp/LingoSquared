teaching:
  fr.a1.unit49.lesson01.teach.content_triste_en:
    title: 开心、伤心和生气
    gloss: 开心，伤心，生气
    note: 三个与 *être*（是）搭配使用的基本情绪词；*content* 的阴性形式是 *contente*，而 *triste* 和 *en colère* 不变。
    example_gloss:
    - 我很开心。
    - 我很伤心。
    - 我很生气。
  fr.a1.unit49.lesson01.teach.je_suis_content:
    title: 表达你很开心
    gloss: 我很开心。
    note: '*Être*（是）+ 表示感受的形容词是最基本的句型，和汉语的“我很……”相似，但法语必须用动词 être，汉语的形容词则可以直接作谓语。'
  fr.a1.unit49.lesson01.teach.je_ne_suis:
    title: 对比不同的感受
    gloss: 我没有生气，我很难过。
    note: '*Ne ... pas* 把动词夹在中间；第二个分句再说出真正的感受。'
  fr.a1.unit49.lesson02.teach.pourquoi_es_tu:
    title: 询问原因
    gloss: 你为什么开心？
    note: '*Pourquoi*（为什么）是询问原因的标准疑问词。'
  fr.a1.unit49.lesson02.teach.je_suis_content:
    title: 说明原因
    gloss: 我很开心，因为我有了新公寓。
    note: '*Parce que*（因为）引出原因分句；在 *il* 前面缩写为 *parce qu''*。'
  fr.a1.unit49.lesson02.teach.je_suis_triste:
    title: 消极的原因
    gloss: 我很难过，因为在下雨。
    note: 沿用天气单元中的 *il pleut*（下雨）作为原因分句。
  fr.a1.unit49.lesson03.teach.nerveux:
    title: 紧张
    gloss: 紧张
    note: 表示紧张的标准词。
    example_gloss: 我对第一次上班感到紧张。
  fr.a1.unit49.lesson03.teach.je_suis_nerveux:
    title: 说明你为什么紧张
    gloss: 我对第一次上班感到紧张。
    note: '*Avant*（字面意思是“在……之前”）引出让人紧张的事情；汉语常说“对……紧张”，法语则用 avant。'
  fr.a1.unit49.lesson03.teach.ne_t_inquiete:
    title: 安慰别人
    gloss: 别担心。
    note: '*Ne t''inquiète pas*（字面意思是“不要让自己担心”）是固定的安慰用语；*s''inquiéter* 是代词式动词。'
  fr.a1.unit49.lesson04.teach.comment_se_sent:
    title: 询问别人的感受
    gloss: 马蒂厄感觉怎么样？
    note: '*Se sentir*（感觉，代词式动词）是询问或描述情绪状态的标准说法，在健康单元中也会出现。'
  fr.a1.unit49.lesson04.teach.il_se_sent:
    title: 描述别人的感受
    gloss: 他感到紧张。
    note: '*Se* 是第三人称的自反代词，与 *sent* 搭配使用。'
  fr.a1.unit49.lesson04.teach.pourquoi_se_sent:
    title: 询问别人为什么有某种感受
    gloss: 他为什么感到紧张？
    note: 把 *pourquoi* 与 *Il se sent nerveux* 中的 *se sentir* 结合起来；*sent-il* 中间要写连字符。
  fr.a1.unit49.lesson05.teach.salut_camille_je:
    title: 阅读一条关于感受的消息
    gloss: 你好，卡米耶，我对第一次独自上班有点紧张。但我也很高兴，因为我有了新工作和新公寓。我想一切都会顺利的。
    note: 注意写信的人对什么感到紧张、什么让他高兴，以及他总体的看法。
    glosses:
      peu: 有点
      nerveux: 紧张
      premier: 第一个
      service: 班次
      seul: 独自
      content: 高兴的
      car: 因为
      nouveau: 新的
      travail: 工作
      nouvel: 新的
      appartement: 公寓
      pense: 认为
      aller: 去（这里：ça va aller = 会没事的）
  fr.a1.unit49.lesson06.teach.camille_salut_mathieu:
    title: 卡米耶问马蒂厄感觉如何
    gloss: 卡米耶：你好，马蒂厄，第一次上班前你感觉怎么样？
    note: '*Avant ton premier service*（在你第一次上班之前）沿用了第3课的 *avant* + 名词结构。'
  fr.a1.unit49.lesson06.teach.mathieu_je_suis:
    title: 马蒂厄承认自己紧张
    gloss: 马蒂厄：说实话，我有点紧张。
    note: '*Honnêtement*（说实话）让承认的语气更委婉。'
  fr.a1.unit49.lesson06.teach.camille_ne_t:
    title: 卡米耶安慰他
    gloss: 卡米耶：别担心，你能做好的！
    note: '*Tu vas y arriver*（字面意思是“你会到达那里”）是鼓励人的固定表达；*aller* + 动词原形构成近将来时。'
  fr.a1.unit49.lesson06.teach.mathieu_merci_ca:
    title: 马蒂厄向她道谢
    gloss: 马蒂厄：谢谢，这真的帮了我。
    note: '*Aide* 是动词 *aider*（帮助）的 *il/elle* 变位形式；*m''* 代表 *me*。'
  fr.a1.unit49.lesson06.teach.camille_et_apres:
    title: 卡米耶预言结果
    gloss: 卡米耶：之后你肯定会非常高兴，也很自豪。
    note: '*Sûrement*（肯定）表示有把握的预测；*fier*（自豪的）是一个有用的新形容词。'
  fr.a1.unit49.lesson06.teach.mathieu_oui_je:
    title: 马蒂厄表示同意
    gloss: 马蒂厄：是的，我也这么想。
    note: '*Je pense aussi* 是赞同别人观点的自然说法。'
  fr.a1.unit49.lesson06.teach.il_remplace_mathieu:
    title: 用 il、elle 和 l' 做总结
    gloss: Mathieu 很紧张。Camille 在帮他。
    note: '*Il* 代替男性的名字（*il est nerveux*），*elle* 代替女性的名字，*l''*（*elle l''aide*）表示“他”：这三个小词在谈论别人时必不可少。'
