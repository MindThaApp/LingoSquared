teaching:
  fr.a1.unit50.lesson01.teach.appeler:
    title: 打电话
    gloss: 打电话
    note: 表示打电话的动词的不定式。
    example_gloss: 我得给你打电话。
  fr.a1.unit50.lesson01.teach.je_t_appelle:
    title: 说你会打电话
    gloss: 我给你打电话。
    note: '*Appelle* 是 *appeler* 的 *je* 变位形式；法语在这里用现在时表示将要做的事，中文则常用“会”或“给你打电话”这样的说法。'
  fr.a1.unit50.lesson01.teach.allo_c_est:
    title: 接电话
    gloss: 你好，我是 Camille。
    note: '*C''est* + 名字是法语中在电话里自报姓名的标准说法，相当于中文的“我是……”。'
  fr.a1.unit50.lesson01.teach.allo_c_est_2:
    title: Mathieu 也这样接电话
    gloss: 你好，我是 Mathieu。
    note: 与 *Allô, c'est Camille* 的 *c'est* + 名字结构相同。
  fr.a1.unit50.lesson02.teach.qui_est_a:
    title: 询问对方是谁
    gloss: 请问您是哪位？
    note: '*Qui est à l''appareil ?* 是询问陌生来电者是谁的标准说法。'
  fr.a1.unit50.lesson02.teach.vous_parlez_avec:
    title: 礼貌地表明身份
    gloss: 您正在和 Camille 通话。
    note: '*Vous parlez avec* + 名字 是与 *c''est* + 名字 相对应的正式说法。'
  fr.a1.unit50.lesson03.teach.tu_peux_repeter:
    title: 请对方重复
    gloss: 你能重复一遍吗？
    note: '*Tu peux ...*（你能……吗？）加上动词原形 *répéter*（重复）。'
  fr.a1.unit50.lesson03.teach.ne_parle_pas:
    title: 请对方说慢一点
    gloss: 请别说得这么快。
    note: '*Ne parle pas si vite* 是否定句：*ne ... pas* 包住 *parle*，*si* 的意思是“这么”。'
  fr.a1.unit50.lesson03.teach.je_ne_t:
    title: 说你听不清
    gloss: 我听不清你说话。
    note: '*Entendre*（听见）加 *ne ... pas bien* 表示听不清楚，与 *comprendre*（理解）不同。'
  fr.a1.unit50.lesson04.teach.le_sms:
    title: 短信
    gloss: 短信
    note: '*SMS* 是阳性名词：*un SMS*，直接借自国际通用的缩写。'
    example_gloss: 这条短信是 Camille 发的。
  fr.a1.unit50.lesson04.teach.je_t_envoie:
    title: 说你会发短信
    gloss: 我给你发条短信。
    note: '*Envoyer*（发送）要在动词前加代词 *te*（这里是 *t''*），然后是 *un SMS*。'
  fr.a1.unit50.lesson04.teach.je_te_rappelle:
    title: 说你会回电话
    gloss: 我稍后给你回电话。
    note: '*Rappeler*（回电话）中的 *re-* 已经带有“回”的意思；*plus tard* 的意思是“稍后”。'
  fr.a1.unit50.lesson05.teach.mathieu_salut_camille:
    title: 阅读短信对话
    gloss: Mathieu：嗨 Camille，你能给我打个电话吗？我有件事要告诉你。Camille：好啊，当然，我五分钟后给你回电话。
    note: 注意 Mathieu 提出了什么请求、原因是什么，以及 Camille 说什么时候回电话。
    glosses:
      Salut: 你好
      peux: 能够;可以
      m'appeler: 打电话;称呼
      dois: 必须;得
      truc: 某事物
      dire: 讲述;告诉
      évidemment: 当然
      rappelle: 回;返回
      cinq: 五
      minutes: 分钟
  fr.a1.unit50.lesson06.teach.mathieu_allo_c:
    title: Mathieu 接电话
    gloss: Mathieu：你好，我是 Mathieu。
    note: 第1课学过的 *c'est* + 名字 结构，现在用在真正的通话中：接电话的人先开口并报上自己的名字。
  fr.a1.unit50.lesson06.teach.camille_salut_mathieu:
    title: Camille 自报姓名
    gloss: Camille：嗨 Mathieu，我是 Camille。Mathieu：你打来电话真好！
    note: '*C''est sympa que* ...（……真好）表示对某件事的积极反应；*appelles* 是一个特殊形式，这里直接记住即可。'
  fr.a1.unit50.lesson06.teach.camille_comment_s:
    title: Camille 问起上班的情况
    gloss: Camille：你的第一次上班怎么样？
    note: '*Comment s''est passé ... ?* 用的是 *se passer*（发生）的复合过去时，用 *être* 构成，用来询问事情进行得如何。'
  fr.a1.unit50.lesson06.teach.mathieu_ca_s:
    title: Mathieu 说起好消息
    gloss: Mathieu：非常顺利，比我想的还要好。
    note: '*Ça s''est très bien passé* 和 *je pensais* 在这里都是固定说法；*je pensais* 是 *penser*（想）的未完成过去时。'
  fr.a1.unit50.lesson06.teach.au_passe_compose:
    title: 用 avoir 和 être 构成的复合过去时
    gloss: s'est passé → 发生、进行；j'ai pensé → 想、认为；je suis allé → 去
    note: 复合过去时由 *avoir* 或 *être* + 过去分词构成：*j'ai pensé*、*je suis allé*。*Ça s'est passé* 是表示“进展得……”的固定说法；目前只需在本课出现的语境中记住它。
  fr.a1.unit50.lesson06.teach.camille_ca_fait:
    title: Camille 很骄傲
    gloss: Camille：听到这个真高兴！我为你感到骄傲。
    note: '*Fière de*（为……骄傲）是固定搭配，必须用 *de*，不能用 *pour*；这里 *fière* 是阴性形式。'
  fr.a1.unit50.lesson06.teach.mathieu_merci_beaucoup:
    title: Mathieu 很感动
    gloss: Mathieu：非常谢谢你，这对我来说很重要。
    note: 这里 *compter* 的意思是“重要、有分量”：*ça compte pour moi*（这对我很重要）；*pour moi* 表示对谁来说重要。
  fr.a1.unit50.lesson06.teach.son_premier_service:
    title: 他的
    gloss: 他的第一个班进行得非常顺利。
    note: 这里的 *son* 是表示“他的”的物主形容词，不是动词：*son premier service*（他的第一次上班）；*son* 与阳性名词 *service* 保持一致。
