answer_policy:
  accent_marks: Display and teach all French accents and the cedilla. In typed A1 answers, accept a variant without accents when every other letter and word is correct.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation or liaison marks.
course:
  title: 法语 A1
  description: 直系亲属和旁系亲属的词汇、mon/ma/mes 所有格形容词体系，以及如何描述一个家庭，并延续第 01–02 单元中 Inès 和 Mathieu 的烹饪工作坊故事。中文的“我的”不随所属名词变化，而法语的所有格要与名词的性别保持一致，而不是与所有者的性别一致。
units:
  fr.a1.unit03.family:
    title: Inès 和 Mathieu 的家人
lessons:
  fr.a1.unit03.lesson01.immediate_family:
    title: 近亲
  fr.a1.unit03.lesson02.possessives_mon_ma_mes:
    title: 所有格：mon, ma, mes
  fr.a1.unit03.lesson03.extended_family:
    title: 其他亲戚
  fr.a1.unit03.lesson04.describing_family_size:
    title: 家里有几口人
  fr.a1.unit03.lesson05.reading_a_family_profile:
    title: 阅读家庭简介
  fr.a1.unit03.lesson06.family_photos_dialogue:
    title: 和 Inès、Mathieu 一起看家庭照片
teaching:
  fr.a1.unit03.lesson01.teach.mere:
    title: 母亲
    gloss: 母亲
    note: '*Mère* 是阴性词。家人之间日常更常用 *maman*，而 *mère* 是中性的说法，本课程的词汇表中使用的是它。'
  fr.a1.unit03.lesson01.teach.pere:
    title: 父亲
    gloss: 父亲
    note: '*Père* 是阳性词。*Papa* 是日常的说法，与 *mère*/*maman* 的关系相同。'
  fr.a1.unit03.lesson01.teach.frere:
    title: 哥哥／弟弟
    gloss: 兄弟
    note: '*Frère* 是阳性单数。'
  fr.a1.unit03.lesson01.teach.soeur:
    title: 姐姐／妹妹
    gloss: 姐妹
    note: '*Sœur* 是阴性单数。其中的连字 œ 在法语拼写中是一个单独的字母，而不是两个分开的字母。'
  fr.a1.unit03.lesson01.teach.fils:
    title: 儿子
    gloss: 儿子
    note: '*Fils* 是阳性词；注意它末尾的 s 要发音（这是个例外），而 l 不发音。'
  fr.a1.unit03.lesson01.teach.fille:
    title: 女儿
    gloss: 女儿
    note: '*Fille* 是阴性单数；在其他语境中，这个词也表示“女孩”。'
  fr.a1.unit03.lesson01.teach.parents:
    title: Parents
    gloss: 父母
    note: '*Parents* 是阳性复数，把母亲和父亲两人合在一起指称。'
  fr.a1.unit03.lesson01.teach.freres_et_soeurs:
    title: 兄弟姐妹
    gloss: 兄弟姐妹
    note: 法语没有一个单独的中性词来表示“兄弟姐妹”，不像中文有“兄弟姐妹”这样的合称；*frères et sœurs* 把两者都明确地说出来。
  fr.a1.unit03.lesson02.teach.ma_mere:
    title: 我的母亲
    gloss: 我的母亲
    note: '*Ma* 是阴性单数的所有格“我的”，因为 *mère* 是阴性词。'
  fr.a1.unit03.lesson02.teach.mon_pere:
    title: 我的父亲
    gloss: 我的父亲
    note: '*Mon* 是阳性单数的物主形容词“我的”，因为 *père* 是阳性名词。'
  fr.a1.unit03.lesson02.teach.mes_freres_et_soeurs:
    title: 我的兄弟姐妹
    gloss: 我的兄弟姐妹
    note: '*Mes* 是复数的物主形容词“我的”，任何复数名词都用它，不分阴阳性；它和 *ma*/*mon* 的区别在于看数，而不是看性。'
  fr.a1.unit03.lesson02.teach.as_tu_des_freres_et_soeurs:
    title: 询问有没有兄弟姐妹
    gloss: 你有兄弟姐妹吗？
    note: '*As-tu* 是 *tu as*（你有）的倒装疑问形式，是 A1 阶段常见的问句结构。'
  fr.a1.unit03.lesson02.teach.jai_deux_soeurs:
    title: 说明兄弟姐妹的数量
    gloss: 我有两个姐妹。
    note: '*J''ai*（我有）加上数字和家庭成员名词，是描述兄弟姐妹的标准说法。'
  fr.a1.unit03.lesson02.teach.ta_famille_est_grande:
    title: 询问家庭是否很大
    gloss: 你的家庭很大吗？
    note: '*Ta* 是阴性单数的非正式物主形容词“你的”，与阴性名词 *famille* 保持一致。'
  fr.a1.unit03.lesson02.teach.ma_famille_est_petite:
    title: 描述一个小家庭
    gloss: 我的家庭很小。
    note: '*Petite* 与阴性名词 *famille* 一致；如果是阳性名词，就要用阳性形式 *petit*。注意，这和 *mon*/*ma*/*mes* 的一致是不同的：后者表示所属关系，而 petite 描述的是性质。'
  fr.a1.unit03.lesson03.teach.grand_pere:
    title: 祖父
    gloss: 祖父
    note: '*Grand-père* 是带连字符的复合词，阳性。'
  fr.a1.unit03.lesson03.teach.grand_mere:
    title: 祖母
    gloss: 祖母
    note: '*Grand-mère* 是带连字符的复合词，阴性。注意这里的 *grand-* 保持不变，不写成 *grande-mère*。'
  fr.a1.unit03.lesson03.teach.grands_parents:
    title: 祖父母
    gloss: 祖父母
    note: '*Grands-parents* 的复数形式中复合词的两部分都变复数（是 *grands*，而不是 *grand-*）；而单数的 *grand-mère*/*grand-père* 中，*grand-* 不变。'
  fr.a1.unit03.lesson03.teach.oncle:
    title: 叔叔／舅舅
    gloss: 叔叔／舅舅
    note: '*Oncle* 是阳性名词。'
  fr.a1.unit03.lesson03.teach.tante:
    title: 阿姨／姑姑
    gloss: 阿姨／姑姑
    note: '*Tante* 是阴性名词。'
  fr.a1.unit03.lesson03.teach.cousin:
    title: 堂兄弟／表兄弟
    gloss: 堂兄弟／表兄弟
    note: '*Cousin* 是阳性单数；法语会用词形标出堂/表兄弟姐妹的性别，cousin 指男性，女性用 cousine。'
  fr.a1.unit03.lesson03.teach.cousine:
    title: 堂姐妹／表姐妹
    gloss: 堂姐妹／表姐妹
    note: '*Cousine* 是阴性单数，由 *cousin* 加 -e 构成。'
  fr.a1.unit03.lesson03.teach.mes_grands_parents:
    title: 我的祖父母
    gloss: 我的祖父母
    note: 这里用 *Mes*，是因为 *grands-parents* 是复数，与其中包含男性还是女性无关。
  fr.a1.unit03.lesson04.teach.combien_de_freres_et_soeurs:
    title: 询问有几个兄弟姐妹
    gloss: 你有几个兄弟姐妹？
    note: '*Combien de*（多少）后面直接接名词，疑问句中不需要再加其他助动词。'
  fr.a1.unit03.lesson04.teach.on_est_cinq:
    title: 说明家里的人数
    gloss: 我们家有六口人。
    note: '*On est*（字面意思是“人们是”，实际相当于口语里的“我们是”）是法语口语中说明家里总人数的自然、非常常见的说法；*nous sommes* 则更正式，多用于书面。'
  fr.a1.unit03.lesson04.teach.ma_famille_est_grande:
    title: 描述大家庭
    gloss: 我的家庭很大。
    note: '*Grande* 与阴性名词 *famille* 一致；如果是阳性名词，就要用阳性形式 *grand*。'
  fr.a1.unit03.lesson04.teach.jai_beaucoup_de_cousins:
    title: 说明你有很多堂表兄弟姐妹
    gloss: 我有很多堂表兄弟姐妹。
    note: '*Beaucoup de*（很多）放在名词前；这里 *de* 不会变成 *du*/*des*，因为 *beaucoup* 已经表示了数量。'
  fr.a1.unit03.lesson04.teach.tu_habites_pres_de_tes_parents:
    title: 询问是否住在父母附近
    gloss: 你住在父母附近吗？
    note: '*Tes* 是复数的非正式物主形容词“你的”，因为 *parents* 是复数，所以必须用它。'
  fr.a1.unit03.lesson04.teach.jhabite_avec_mes_grands_parents:
    title: 说明你和谁住在一起
    gloss: 我和祖父母住在一起。
    note: '*Avec*（和……一起）用来引出同住的人；*j''habite* 是 *habiter* 的 *je* 形式，第1单元的 *j''habite à Montreuil* 中已经出现过。'
  fr.a1.unit03.lesson05.teach.profile_reading:
    title: 伊内斯的家庭介绍
    gloss: 我叫伊内斯。我三十一岁，和祖父母住在巴黎。我的父母住在里尔。我有两个姐妹和一个兄弟：我们家有六口人。我的妹妹叫卡米耶，她二十岁。
    note: 这篇介绍把第1–4课的词汇和结构放进一篇连贯的短文里，而不是孤立的句子，训练的正是本单元阅读测验所考查的“谁是谁”的阅读能力。
    glosses:
      trente: 三十
      ans: 岁
      grands-parents: 祖父母
      mère: 母亲
      père: 父亲
      habitent: 住（来自 habiter）
      deux: 二
      sœurs: 姐妹
      frère: 兄弟
      six: 六
      maison: 家
      petite: 年幼的／小的
      sœur: 姐妹
      vingt: 二十
  fr.a1.unit03.lesson05.teach.petite_soeur:
    title: 妹妹／小妹
    gloss: 妹妹；小妹
    note: '*Petite*（*petit* 的阴性形式）在这里放在名词前面，因为 petit 这类短而常用的形容词通常放在名词前；而大多数形容词放在名词后面。'
  fr.a1.unit03.lesson05.teach.habite_third_person:
    title: 住（第三人称）
    gloss: 住
    note: '*Habite* 是 *habiter* 的第三人称单数形式，用来谈论别人（*Inès habite...*），而不是说自己（*j''habite*，见第1单元和本单元第4课）。'
  fr.a1.unit03.lesson05.teach.ses_third_person_plural:
    title: 她的／他的／他们的（修饰复数名词）
    gloss: 她的／他的／他们的
    note: '*Ses* 是 *sa*/*son* 的复数形式；*sa*/*son* 用于单数名词，表示“她的／他的”，而 *ses grands-parents* 在第三人称谈论伊内斯时，意思是“她的祖父母”。'
  fr.a1.unit03.lesson05.teach.a_third_person_avoir:
    title: 有（第三人称）
    gloss: 有
    note: '*A* 是 *avoir* 的第三人称单数形式，用来谈论别人（*elle a vingt ans*），而不是说自己（*j''ai* / *as-tu*，在本单元第2–4课中反复出现）。'
  fr.a1.unit03.lesson06.teach.line01:
    title: 展示家人照片
    gloss: 伊内斯给马蒂厄看一张照片，介绍她的父母和妹妹。
    note: '*Voici*（这是／这些是）用来介绍所指的人或物，是给人看照片时很自然的说法。'
  fr.a1.unit03.lesson06.teach.line02:
    title: 作出回应并询问兄弟姐妹
    gloss: 马蒂厄热情地回应，并问她是否还有其他兄弟姐妹。
    note: '*C''est adorable* 是看到年幼兄弟姐妹的照片时，一种自然而热情的反应。'
  fr.a1.unit03.lesson06.teach.line03:
    title: 说明家里的人数并反问对方
    gloss: 伊内斯说她有两个姐妹和一个兄弟，家里一共六个人，然后问起马蒂厄的家庭。
    note: '*On est six à la maison* 说明家里的总人数，延续了第4课的句型。'
  fr.a1.unit03.lesson06.teach.line04:
    title: 描述较小的家庭
    gloss: 马蒂厄说他的家庭比较小，只有三个人：他的父母和他自己，但他有很多堂表亲。
    note: '*Mais*（但是）表示核心家庭很小与大家族亲戚很多之间的对比。'
  fr.a1.unit03.lesson06.teach.line05:
    title: 询问是否住得离父母近
    gloss: 伊内斯问马蒂厄是否住在父母附近。
    note: '*Près de*（在……附近）是描述距离很近的常用说法。'
  fr.a1.unit03.lesson06.teach.line06:
    title: 说明距离并保持联系
    gloss: 马蒂厄说不，他们住在里昂，他们每周通一次电话。
    note: 这延续了第1单元已经确定的事实：马蒂厄来自里昂，他的父母仍住在那里，而他住在圣旺。
  fr.a1.unit03.lesson06.teach.line07:
    title: 表示理解并分享自己的情况
    gloss: 伊内斯说她明白了，并说自己和祖父母一起住在巴黎。
    note: '*Je comprends*（我明白）是对别人刚分享的内容表示理解的自然简短说法，之后再补充自己的相关情况。'
  fr.a1.unit03.lesson06.teach.line08:
    title: 以温暖的话作结
    gloss: 马蒂厄说，家人在身边真好。
    note: '*C''est bien d''avoir sa famille près de soi* 以温暖、带有感触的语气结束了这段对话，呼应了第4课的 *près de* 句型。'
