answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit's own new vocabulary (casă, apartament, cameră, dormitor, bucătărie, baie, fereastră) is used only in person-invariant third-person statements ("Ana are...", "Mihai are...", "Unde este baia?", "Casa mea este mare"). No new tu/dumneavoastră form is introduced this unit; Ana and Mihai keep their existing formal register with each other in the dialogue's greeting lines.
course:
  title: 罗马尼亚语入门 A1
  description: 用罗马尼亚语描述一个基本的家：Casă（房子）、Apartament（公寓）、Cameră（房间）、Dormitor（卧室）、Bucătărie（厨房）、Baie（浴室）和 Fereastră（窗户）。Mihai 去 Ana 家做客，他们聊起各自住在哪里。
units:
  ro.a1.unit18.housing:
    title: 住房
lessons:
  ro.a1.unit18.lesson01.casa_anei:
    title: Ana 的房子
  ro.a1.unit18.lesson02.apartamentul_lui_mihai:
    title: Mihai 的公寓
  ro.a1.unit18.lesson03.vizita_la_ana:
    title: 去 Ana 家做客
teaching:
  ro.a1.unit18.lesson01.teach.reminder_ana_mare:
    title: 复习：Ana, mare
    gloss: Ana（名字）· mare（大）
    note: Ana 是角色的名字，从第 1 单元起就出现了；*mare* 来自第 5／第 14 单元——本单元再次用这两个词来描述她的房子。
  ro.a1.unit18.lesson01.teach.reminder_articole_trei:
    title: 复习：un, o, și, trei
    gloss: un/o（一个）· și（和）· trei（三）
    note: '*Un*／*o*／*și* 来自第 5 单元；*trei* 来自第 2 单元的数数——本单元再次用这四个词来数房间、描述房间。'
  ro.a1.unit18.lesson01.teach.are_vocab:
    title: 有
    gloss: Are（他／她／它有）
    note: '*a avea*（有）的一个新形式——你已经学过 *am*（我有，第 2／第 5 单元）和 *aveți*（您有，正式）；*are* 是同一个动词的第三人称形式，用来说某人或某物有什么。'
  ro.a1.unit18.lesson01.teach.casa_vocab:
    title: 房子
    gloss: Casă（房子）
    note: 人居住的地方。
    example_gloss:
    - Ana 有一座大房子。
  ro.a1.unit18.lesson01.teach.camera_vocab:
    title: 房间
    gloss: Cameră（房间）
    note: 指家中房间的通用词。
    example_gloss:
    - Ana 有一个大房间。
  ro.a1.unit18.lesson01.teach.camere_plural:
    title: Cameră → camere
    gloss: cameră（房间）· camere（多个房间）
    note: '*cameră* 的复数是 *camere*——数一个以上的房间时使用。'
  ro.a1.unit18.lesson01.teach.dormitor_vocab:
    title: 卧室
    gloss: Dormitor（卧室）
    note: 人睡觉的房间。
    example_gloss:
    - Ana 有一间卧室。
  ro.a1.unit18.lesson01.teach.bucatarie_vocab:
    title: 厨房
    gloss: Bucătărie（厨房）
    note: 做饭的房间。
    example_gloss:
    - Ana 有一间厨房。
  ro.a1.unit18.lesson01.teach.baie_vocab:
    title: 浴室
    gloss: Baie（浴室）
    note: 有浴缸／淋浴和马桶的房间。
    example_gloss:
    - Ana 有一间浴室。
  ro.a1.unit18.lesson01.teach.casa_mare_phrase:
    title: Ana 有一座大房子。房子有三个房间：一间卧室、一间厨房和一间浴室。
    gloss: 'Ana are o casă mare. Casa are trei camere: un dormitor, o bucătărie și o baie.'
    note: 这里的每个词都已学过或刚刚学到，组合成两个关于 Ana 房子的新句子。*Casa* 是 *casă* 的定指形式，意思是“这座房子”：以 -ă 结尾的阴性名词把 -ă 换成 -a，就像第 8 单元的 *banca*（银行）。
  ro.a1.unit18.lesson02.teach.reminder_mihai_mic:
    title: 复习：Mihai, mic
    gloss: Mihai（名字）· mic（小）
    note: Mihai 是角色的名字，从第 1 单元起就出现了；*mic* 来自第 14 单元——本单元再次用这两个词来描述他的公寓。
  ro.a1.unit18.lesson02.teach.reminder_unde_este_doua:
    title: 复习：unde, este, două
    gloss: unde（哪里）· este（是；在）· două（二，阴性）
    note: '*Unde*／*este* 来自第 8／第 9 单元；*două* 是第 2 单元学过的“二”的阴性形式——本单元再次用这三个词来询问和数房间。'
  ro.a1.unit18.lesson02.teach.apartament_vocab:
    title: 公寓
    gloss: Apartament（公寓）
    note: Mihai 的家——比 Ana 的房子小一些。
    example_gloss:
    - Mihai 有一套小公寓。
  ro.a1.unit18.lesson02.teach.fereastra_vocab:
    title: 窗户
    gloss: Fereastră（窗户）
    note: '*Apartamentul* 是 *apartament* 的定指形式，意思是“这套公寓”：以辅音结尾的中性名词加 -ul，就像第 8 单元的 *magazinul*（商店）；阴性的 *casă* 则变成 *casa*。'
    example_gloss:
    - 这套公寓有一扇大窗户。
  ro.a1.unit18.lesson02.teach.apartament_mic_phrase:
    title: Mihai 有一套小公寓。公寓有两个房间：一间卧室和一间厨房。
    gloss: 'Mihai are un apartament mic. Apartamentul are două camere: un dormitor și o bucătărie.'
    note: 这里的每个词都已学过或刚刚学到，组合成两个关于 Mihai 公寓的新句子。
  ro.a1.unit18.lesson02.teach.unde_este_baia_phrase:
    title: 浴室在哪里？
    gloss: Unde este baia?（浴室在哪里？）
    note: '*Baia* 是 *baie* 的定指形式，意思是“这间浴室”。去别人家做客时，这是很实用的问句。'
  ro.a1.unit18.lesson03.teach.reminder_buna_ce_mai_faceti_bine_multumesc:
    title: 复习：Bună, Ce mai faceți?, Bine, mulțumesc
    gloss: Bună（你好）· Ce mai faceți?（您好吗？正式）· Bine, mulțumesc（很好，谢谢）
    note: 都来自第 1 单元开头的问候语，在这里再次用来开始本单元的对话。
  ro.a1.unit18.lesson03.teach.reminder_la_revedere_mea_aproape_am:
    title: 复习：La revedere, Mea, Aproape, Am
    gloss: La revedere（再见）· Mea（我的，阴性）· Aproape（附近／很近）· Am（我有）
    note: '*La revedere* 来自第 1 单元；*mea* 来自第 5 单元的 *Mama mea*；*aproape* 来自第 8／第 9 单元 *Unde este...?* 的回答；*am* 来自第 2／第 5 单元——都在这里用于做客的对话。'
  ro.a1.unit18.lesson03.teach.line01:
    title: 向 Ana 问好并问她好吗
    gloss: Mihai 向 Ana 问好，并问她过得怎么样。
    note: 再次使用第 1 单元的问候语 *Ce mai faceți?*。
  ro.a1.unit18.lesson03.teach.line02:
    title: 回答并描述你的房子
    gloss: Ana 先回答，然后告诉 Mihai 她的房子很大，有三个房间。
    note: 把第 1 单元的 *Bine, mulțumesc* 与本单元第一课的短语结合起来。
  ro.a1.unit18.lesson03.teach.line03:
    title: 询问浴室在哪里
    gloss: Mihai 问 Ana 浴室在哪里。
    note: 几乎原样使用本单元第二课的短语。
  ro.a1.unit18.lesson03.teach.line04:
    title: 回答浴室在哪里
    gloss: Ana 告诉他浴室就在附近。
    note: 把 *baia* 和 *aproape* 结合起来，正是第 8／第 9 单元已建立的“……在哪里？”的回答方式。
  ro.a1.unit18.lesson03.teach.line05:
    title: 描述你自己的公寓并道别
    gloss: Mihai 说他有一套小公寓，有两个房间，然后道别。
    note: 把本单元第二课的短语与第 1 单元的结束语结合起来。
  ro.a1.unit18.lesson03.teach.line06:
    title: 道别
    gloss: Ana 道别。
    note: 与之前每个单元的对话结尾相同的道别方式。
