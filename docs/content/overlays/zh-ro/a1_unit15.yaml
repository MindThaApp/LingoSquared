course:
  title: 罗马尼亚语入门 A1
  description: 学习用罗马尼亚语应对基本的火车出行——Tren（火车）、Bilet（票）、Peron（站台）和 Pleacă（出发）——Mihai 乘火车去 București，Ana 在 gară 为他送行。
units:
  ro.a1.unit15.travel:
    title: 旅行
lessons:
  ro.a1.unit15.lesson01.trenul_pleaca:
    title: 火车出发
  ro.a1.unit15.lesson02.un_bilet_va_rog:
    title: 买一张票
  ro.a1.unit15.lesson03.la_gara:
    title: 在火车站
teaching:
  ro.a1.unit15.lesson01.teach.reminder_gara_ora:
    title: 复习：gară, este, la, ce, oră, ora, nouă
    gloss: gară（火车站）· este（是）· la（在／到）· ce（什么）· oră（小时）· ora（……点钟）· nouă（九）
    note: Gară 来自第8／9单元；este、la、ce、oră、ora、nouă 来自第4单元（时间）——本单元把第4单元的“la ce oră”和“la ora nouă”用在新的场合，询问的是火车，而不是课程。
  ro.a1.unit15.lesson01.teach.tren_vocab:
    title: 火车
    gloss: Tren（火车）
    note: 中性名词，以辅音结尾（单数时中性名词的变化与阳性名词相同：*un tren*）——加 *-ul* 表示“那列火车”，与 *magazin*->*magazinul* 的词尾相同；而像 *gară* 这样以 *-ă* 结尾的名词则加 *-a*（*gara*）。
    example_gloss:
    - 火车在车站。
  ro.a1.unit15.lesson01.teach.pleaca_vocab:
    title: 出发
    gloss: Pleacă（出发，他／她／它）
    note: 表示火车、公共汽车或飞机出发的动词。*Trenul pleacă*——不需要 *este*，因为 *pleacă* 本身就是完整的动词。
    example_gloss:
    - 火车出发了。
  ro.a1.unit15.lesson01.teach.trenul_pleaca_ora_noua_phrase:
    title: 火车九点开
    gloss: Trenul pleacă la ora nouă.（火车九点开。）
    note: 把 *trenul* 和 *pleacă* 与第4单元的 *la ora nouă* 结合起来——不需要新的时间词汇。
  ro.a1.unit15.lesson01.teach.la_ce_ora_pleaca_trenul_phrase:
    title: 火车几点开？
    gloss: La ce oră pleacă trenul?（火车几点开？）
    note: 第4单元的 *La ce oră...?* 问句框架，现在用来询问 *trenul*，而不是课程。
  ro.a1.unit15.lesson01.teach.peron_vocab:
    title: 站台
    gloss: Peron（站台）
    note: 火车站台。中性名词，以辅音结尾，所以“那个站台”是 *peronul*——词尾 *-ul* 和 *tren*->*trenul* 一样。
    example_gloss:
    - 火车在三号站台。
  ro.a1.unit15.lesson01.teach.de_la_ce_peron_phrase:
    title: 火车从哪个站台出发？
    gloss: De la ce peron pleacă trenul?（火车从哪个站台出发？）
    note: '*De la*（从）+ *ce peron*（哪个站台）——这里的每个词都学过，只是组合成了新的问句。'
  ro.a1.unit15.lesson02.teach.reminder_as_dori_va_rog_cat_costa:
    title: 复习：aș dori, vă rog, cât costă, costă, lei
    gloss: aș dori（我想要）· vă rog（请，敬称）· cât costă（多少钱）· costă（价钱是）· lei（列伊，货币）
    note: 全部来自第6单元（食物）和第7单元（购物）——本单元把同样的礼貌请求和价格用语用在购买火车票上，而不是食物。
  ro.a1.unit15.lesson02.teach.bilet_vocab:
    title: 票
    gloss: 票；车票
    note: 一张火车票。bilet 是中性名词：单数时和阳性名词一样用 *un*，所以“一张票”是 *un bilet*。
    example_gloss:
    - 我有一张票。
  ro.a1.unit15.lesson02.teach.bucuresti_vocab:
    title: 布加勒斯特
    gloss: 布加勒斯特
    note: 罗马尼亚的首都——本课程中最常用的目的地示例。
    example_gloss:
    - 火车开往布加勒斯特。
  ro.a1.unit15.lesson02.teach.as_dori_bilet_bucuresti_phrase:
    title: 请给我一张去布加勒斯特的票
    gloss: 我想要一张去布加勒斯特的票，麻烦您。
    note: 这是第6课和第7课学过的 *Aș dori... vă rog* 礼貌句式，这次用来买票，而不是点餐。
  ro.a1.unit15.lesson02.teach.cat_costa_bilet_bucuresti_phrase:
    title: 去布加勒斯特的票多少钱？
    gloss: 去布加勒斯特的票多少钱？
    note: 这是第7课学过的 *Cât costă...?* 问价句式，这次问的是车票，而不是一公斤土豆。
  ro.a1.unit15.lesson02.teach.costa_zece_lei_phrase:
    title: 四十列伊
    gloss: 四十列伊。
    note: 数字 2 到 19 后面的 *lei* 前不需要加 *de*，这条规则第7课已经讲过。
  ro.a1.unit15.lesson03.teach.reminder_travel_words:
    title: 复习：tren, pleacă, peron, bilet, București, trei, am
    gloss: 火车 · 出发、开 · 站台 · 票 · 布加勒斯特 · 三（第2课） · 我有（第2课）
    note: tren、pleacă、peron、bilet、București 是本单元前两课的新词；trei 和 am 是第2课（数字）学过的，这里再次出现，因为安娜和米哈伊在车站会一起用到“三号站台”和“我有一张票”。
  ro.a1.unit15.lesson03.teach.reminder_buna_multumesc_la_revedere_ana_mihai:
    title: 复习：bună, mulțumesc, la revedere, Ana, Mihai
    gloss: 你好 · 谢谢 · 再见 · 安娜、米哈伊（人名）
    note: 这些在前面的单元都学过了——本课程每段对话都用这种友好的开头和结尾。
  ro.a1.unit15.lesson03.teach.drum_bun_vocab:
    title: 一路平安
    gloss: 一路平安；旅途愉快
    note: 对即将出行的人说的固定告别语，字面意思是“好路”，用法和汉语的“一路平安”“一路顺风”相同。
    example_gloss:
    - 米哈伊，一路平安！
  ro.a1.unit15.lesson03.teach.line01:
    title: 打招呼并询问火车
    gloss: 安娜向米哈伊问好，并问火车几点开。
    note: 重复使用本单元第一课的问句，这次直接对米哈伊说。
  ro.a1.unit15.lesson03.teach.line02:
    title: 说出发车时间
    gloss: 米哈伊说火车九点开。
    note: 原样重复本单元第一课的句子。
  ro.a1.unit15.lesson03.teach.line03:
    title: 询问站台
    gloss: 安娜问是哪个站台。
    note: 这是一个简短的追问——*de la ce peron* 在第一课已经完整问过；这里安娜简短地问，等米哈伊补充其余信息。
  ro.a1.unit15.lesson03.teach.line04:
    title: 说出站台和车票
    gloss: 米哈伊说是三号站台，并说他有一张去布加勒斯特的票。
    note: 把本单元的 peron 以及 bilet、București 等词合在一个回答里。
  ro.a1.unit15.lesson03.teach.line05:
    title: 祝一路平安并道别
    gloss: 安娜祝米哈伊一路平安，并向他道别。
    note: 用到本课的 *Drum bun*——这是出行时专用的告别语，而不是本课程一贯单用的 *la revedere*。
  ro.a1.unit15.lesson03.teach.line06:
    title: 道谢并道别
    gloss: 米哈伊感谢安娜并道别。
    note: 和前面各单元的对话一样，以同样的方式结束。
