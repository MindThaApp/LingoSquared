answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț, with comma-below ș/ț). Typed answers are checked with their diacritics: a spelling without them, or with the older cedilla letters ş/ţ, is accepted only where an exercise lists it explicitly, matching unit01''s policy.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the question mark/exclamation mark. Spoken answers are assessed for intelligibility, not written punctuation.
  register: tu and dumneavoastră (and their matching verb forms, ai/aveți) are never interchangeable answers for each other's exercises, the same discipline unit01 established.
course:
  title: 罗马尼亚语入门 A1
  description: 学习零到一百的数字，包括十几（-sprezece）和几十（-zeci）的构成规律、doi/două 的性的区别，并用数字询问和回答年龄与电话号码，延续第一单元中 Ana 和 Mihai 的故事。
units:
  ro.a1.unit02.numbers:
    title: 数字
lessons:
  ro.a1.unit02.lesson01.zero_to_ten:
    title: 数字零到十
  ro.a1.unit02.lesson02.eleven_to_hundred:
    title: 十一到一百的数字
  ro.a1.unit02.lesson03.age_and_phone:
    title: 年龄和电话号码
teaching:
  ro.a1.unit02.lesson01.teach.zero:
    title: Zero
    gloss: 零
    note: '*Zero* 形式不变，在读较长的数字或电话号码时，也用它来读出其中的数字 0。'
    example_gloss: 零，一，二。
  ro.a1.unit02.lesson01.teach.unu:
    title: 一
    gloss: 一
    note: '*Unu* 是单独数数时用的形式。在阳性或中性名词前缩短为 *un*（*un câine*，一只狗）；在阴性名词前变为 *o*（*o sută*，一百）。'
    example_gloss: 一，二，三。
  ro.a1.unit02.lesson01.teach.doi:
    title: 二（阳性）
    gloss: 二
    note: '*Doi* 与阳性名词连用（*doi bărbați*，两个男人）。阴性名词以及复数时与阴性相同的中性名词要用另一种形式，见下一张卡片。'
    example_gloss: 二，三，四。
  ro.a1.unit02.lesson01.teach.doi_doua_gender:
    title: “二”随性而变
    gloss: doi（阳性）/ două（阴性和中性）
    note: 罗马尼亚语的 *doi* 有单独的阴性形式 *două*，阴性名词（*două femei*，两个女人）必须用它；中性名词的复数与阴性相同，所以也用它（*două numere*，两个数字）。除了一（*un*/*o*）和二，*trei* 到 *zece* 对所有的性都保持不变。
  ro.a1.unit02.lesson01.teach.trei:
    title: 三
    gloss: 三
    note: '*Trei* 对所有的性都不变。'
    example_gloss: 三，四，五。
  ro.a1.unit02.lesson01.teach.patru:
    title: 四
    gloss: 四
    note: '*Patru* 形式不变。注意它在十几中不规则的缩略形式：14 是 *paisprezece*，而不是 *patrusprezece*。'
    example_gloss: 四，五，六。
  ro.a1.unit02.lesson01.teach.cinci:
    title: 五
    gloss: 五
    note: '*Cinci* 形式不变。'
    example_gloss: 五，六，七。
  ro.a1.unit02.lesson01.teach.sase:
    title: 六
    gloss: 六
    note: '*Șase* 形式不变。'
    example_gloss: 六，七，八。
  ro.a1.unit02.lesson01.teach.sapte:
    title: 七
    gloss: 七
    note: '*Șapte* 形式不变。'
    example_gloss: 七，八，九。
  ro.a1.unit02.lesson01.teach.opt:
    title: 八
    gloss: 八
    note: '*Opt*没有词形变化。'
    example_gloss: 八，九，十。
  ro.a1.unit02.lesson01.teach.noua:
    title: 九
    gloss: 九
    note: '*Nouă* 没有词形变化。如果不写变音符号，它会与 *noua*（“那个新的”，阴性）写成一样，所以要输入 *ă*：键入的答案会检查变音符号。'
    example_gloss: 九，十……好了！
  ro.a1.unit02.lesson01.teach.zece:
    title: 十
    gloss: 十
    note: '*Zece* 没有词形变化，也是从十一起所有“十几”的基础（*zece* + *-sprezece*）。'
    example_gloss: 十！太棒了！
  ro.a1.unit02.lesson02.teach.unsprezece:
    title: 十一
    gloss: 十一
    note: '*Unsprezece* 字面上由 *unu* + *spre* + *zece* 构成（“十之上加一”），后面所有“十几”都按这个规律构成。'
    example_gloss: 十，十一，十二。
  ro.a1.unit02.lesson02.teach.teens_pattern:
    title: 十二到十九
    gloss: doisprezece（12）、treisprezece（13）、paisprezece（14）、cincisprezece（15）、șaisprezece（16）、șaptesprezece（17）、optsprezece（18）、nouăsprezece（19）
    note: 每个“十几”都是在个位数的常规形式后加 *-sprezece*：*doi* → *doisprezece*，*trei* → *treisprezece*，一直到 *nouă* → *nouăsprezece*。有两个不规则的：十四，*patru* 缩短为 *pai-*（是 *paisprezece*，不是 *patrusprezece*）；还有十六，*șase* 变成 *șai-*（是 *șaisprezece*，不是 *șasesprezece*）。
  ro.a1.unit02.lesson02.teach.douazeci:
    title: 二十
    gloss: 二十
    note: '*Douăzeci*（“两个十”）是一个独立的词，也是 21 到 29 所有数字的基础。'
    example_gloss: 十九，二十……
  ro.a1.unit02.lesson02.teach.douazeci_si_unu:
    title: 二十一
    gloss: 二十一
    note: 从二十一起，罗马尼亚语用 *și*（“和”）把十位数和个位数连起来：*douăzeci și unu*、*douăzeci și doi*，依此类推。这与“十几”不同，“十几”是合成一个词的。
    example_gloss: 二十，二十一，二十二。
  ro.a1.unit02.lesson02.teach.tens_pattern:
    title: 三十到九十
    gloss: treizeci（30）、patruzeci（40）、cincizeci（50）、șaizeci（60）、șaptezeci（70）、optzeci（80）、nouăzeci（90）
    note: 从三十起，每个整十数都是个位数加 *-zeci*（“十”的复数）：*trei* → *treizeci*，*patru* → *patruzeci*，依此类推。唯一的拼写变化是六十：*șase* 变成 *șai-*，得到 *șaizeci*（与 *șaisprezece* 里的 *șai-* 相同）。70、80、90 也同样按这个规律构成，没有特殊的数法。
  ro.a1.unit02.lesson02.teach.o_suta:
    title: 一百
    gloss: 一百
    note: '*O sută* 用的是 *o*（“一”的阴性形式），而不是 *un*，因为 *sută* 是阴性名词。'
    example_gloss: 九十，一百！
  ro.a1.unit02.lesson03.teach.cati_ani_ai:
    title: 非正式地询问年龄
    gloss: 你多大了？
    note: 字面意思是“你有多少年”，用 *avea*（有）来表示年龄，和法语 *avoir* 的用法一样，而汉语表示年龄通常不用“有”。*Câți*（多少，阳性）要与 *ani*（年，阳性）保持一致。
  ro.a1.unit02.lesson03.teach.am_nouasprezece_ani:
    title: 说出年龄（二十岁以下）
    gloss: 我十九岁。
    note: '*Am* 是 *avea* 的 *eu* 形式。二十以下的数字，*ani* 前面不需要 *de*。'
  ro.a1.unit02.lesson03.teach.cati_ani_aveti:
    title: 正式地询问年龄
    gloss: 你多大了？
    note: '*Aveți* 是 *avea* 的 *dumneavoastră* 形式，与第 1 单元学过的礼貌语体一致。'
  ro.a1.unit02.lesson03.teach.am_treizeci_de_ani:
    title: 说出年龄（二十岁及以上）
    gloss: 我三十岁。
    note: 这里出现 *De*，是因为 *treizeci* 在二十以上。完整规则见下一张卡片。
  ro.a1.unit02.lesson03.teach.de_insertion_rule:
    title: 名词前何时加 de
    gloss: 2–19：不加 de（doi ani）／20 以上：加 de（treizeci de ani）
    note: 这是罗马尼亚语特有的规则：2 到 19 的数字直接放在名词前（*doi ani*，两年；*nouăsprezece ani*，十九年），而 20 及以上的数字与名词之间必须加 *de*（*treizeci de ani*，三十年；*o sută de ani*，一百年）。“一”是特例（*un an*，一年，单数，两种情况都不加 *de*）。
  ro.a1.unit02.lesson03.teach.care_e_numarul_tau:
    title: 非正式地询问电话号码
    gloss: 你的电话号码是多少？
    note: 询问具体存在的号码时，自然的说法是用 *Care*（哪个／什么），而不是 *ce*。*Număr* 是中性名词，单数时的一致规则与阳性名词相同，所以与 *numărul* 搭配的“你的”是 *tău*，而不是 *ta*。
  ro.a1.unit02.lesson03.teach.care_este_numarul_dvs:
    title: 正式地询问电话号码
    gloss: 你的电话号码是多少？
    note: '*Este* 是 *e* 的完整形式，在谨慎或正式的场合更常用。*Dumneavoastră* 使对话保持礼貌，这个词在第 1 单元学过。'
  ro.a1.unit02.lesson03.teach.raspuns_telefon:
    title: 逐位说出电话号码
    gloss: 号码是：零、七、二、一、四、五、六、七、八、九。
    note: 本单元只练习逐位读数字，这与第 1 单元对语体选择所做的简化一样。实际打电话时也可能两位两位地读，但逐位读出的数字总是能听懂。
