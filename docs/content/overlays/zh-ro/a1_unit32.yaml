teaching:
  ro.a1.unit32.lesson01.teach.animalul_un_animal:
    title: 动物与宠物
    gloss: 动物／宠物
    note: '*Animal* 是泛称；*animal de companie*（“伴侣动物”）专指宠物。复数是 *animale*（*un animal*、*două animale*）。'
    example_gloss:
    - 狗是一种动物。
    - 狗也是一种宠物。
  ro.a1.unit32.lesson01.teach.cainele_pisica:
    title: 狗和猫
    gloss: 狗／猫
    example_gloss:
    - Ana 有一只狗。
    - Andrei 有一只猫。
  ro.a1.unit32.lesson01.teach.pestele_pasarea:
    title: 鱼和鸟
    gloss: 鱼／鸟
    example_gloss:
    - 爷爷养了一条鱼。
    - Nina 养了一只鸟。
  ro.a1.unit32.lesson01.teach.ai_un_animal:
    title: 你养宠物吗？
    gloss: 你养宠物吗？
    note: 和你已经学过的 *Ai ...?* 问句一样：*a avea*（有）+ 名词。
  ro.a1.unit32.lesson01.teach.da_am_un:
    title: 是的，我有一只狗
    gloss: 是的，我有一只狗。
    note: 使用本单元的新词汇作简单的肯定回答。
  ro.a1.unit32.lesson01.teach.nu_nu_am:
    title: 不，我没有宠物
    gloss: 不，我没有宠物。
    note: 在 *nu am* 之后，*niciun*（“一个也没有”）用来否定名词；见语法说明。
  ro.a1.unit32.lesson01.teach.la_negatie_nu:
    title: Nu am：不用冠词
    gloss: 在 nu am 之后不用 un 或 o：Nu am timp, nu am niciun animal de companie.
    note: 沿用已学过的 *Nu am timp* 句型：不是新语法，只是换了一个新名词来套用。
  ro.a1.unit32.lesson02.teach.a_scoate_la:
    title: 遛（动物）
    gloss: 遛（动物）
    note: '*A scoate la plimbare* 是固定短语；见语法说明。'
    example_gloss: 我每天遛狗。
  ro.a1.unit32.lesson02.teach.verbul_se_schimba:
    title: 动词随人称变化
    gloss: 动词随人称变化：eu scot, tu scoți, el scoate（我、你、他带）狗去散步。
    note: 罗马尼亚语动词的词尾随人称变化，所以 *a scoate la plimbare* 作为一个动词来变位：*scot*、*scoți*、*scoate*。
  ro.a1.unit32.lesson02.teach.a_da_de:
    title: 喂食
    gloss: 喂食
    example_gloss: 我每天给猫喂食。
  ro.a1.unit32.lesson02.teach.a_se_juca:
    title: 和……玩
    gloss: 和……玩
    example_gloss: Andrei 和他的猫玩耍。
  ro.a1.unit32.lesson02.teach.scot_cainele_la:
    title: 我每天遛狗
    gloss: 我每天遛狗。
    note: 把 *a scoate la plimbare* 与 *în fiecare zi*（每天）结合起来，后者在之前的单元中已经学过。
  ro.a1.unit32.lesson02.teach.dau_de_mancare:
    title: 我每天喂猫
    gloss: 我每天给猫喂食。
    note: 把 *a da de mâncare* 与 *în fiecare zi* 结合起来；动物用与格：*pisicii*。
  ro.a1.unit32.lesson03.teach.plural_caine_caini:
    title: 'Plural: câine → câini'
    gloss: 复数：câine → câini, animal → animale, pisică → pisici.
    note: 罗马尼亚语规则复数的构成方式，这里首次以动物名词为例进行介绍。
  ro.a1.unit32.lesson03.teach.caini_pisici:
    title: 狗和猫
    gloss: 狗／猫
    example_gloss:
    - Mihai 喜爱狗。
    - Elena 喜爱猫。
  ro.a1.unit32.lesson03.teach.pesti_pasari:
    title: 鱼和鸟（复数）
    gloss: 鱼（复数）／鸟
    example_gloss:
    - 我喜欢鱼。
    - 爷爷喜欢鸟。
  ro.a1.unit32.lesson03.teach.iubesc_animalele:
    title: 我喜欢动物
    gloss: 我喜欢动物。
    note: '*A iubi*（“爱”）的宾语前不加介词：*Iubesc animalele*；冠词 *-le* 表示泛指动物。'
  ro.a1.unit32.lesson03.teach.elena_iubeste_pisicile:
    title: Elena 喜爱猫，但没有宠物
    gloss: Elena 喜爱猫，但她没有宠物。
    note: 这里引出了第 05 课阅读部分所围绕的对比。
  ro.a1.unit32.lesson04.teach.mihai_ai_un:
    title: Mihai 问起宠物
    gloss: Mihai：你有宠物吗，Ana？
  ro.a1.unit32.lesson04.teach.ana_da_am:
    title: Ana 有一只狗
    gloss: Ana:是的,我有一只狗。
  ro.a1.unit32.lesson04.teach.mihai_cum_arata:
    title: Mihai 问它长什么样
    gloss: Mihai:它长什么样?
    note: 沿用外貌单元中的 *Cum arată ...?* 句型,这里用来询问动物的样子。
  ro.a1.unit32.lesson04.teach.ana_are_blana:
    title: Ana 描述她的狗
    gloss: Ana:它有棕色的毛,个子很小。
    note: 这里再次使用外貌单元学过的毛发颜色和体型词汇，不过描述的是动物的皮毛，而不是人的头发。
  ro.a1.unit32.lesson04.teach.pentru_un_animal:
    title: 动物用 el 和 ea
    gloss: 指动物时,根据性别用 el 或 ea:câinele 用 el,pisica 用 ea。
    note: 本课程之前出现的 *el* 和 *ea* 都指人;这里把它们扩展到动物,并根据名词的性别来选用。
  ro.a1.unit32.lesson04.teach.mihai_il_scoti:
    title: Mihai 问遛狗的事
    gloss: Mihai:你每天都带它出去散步吗?
  ro.a1.unit32.lesson04.teach.ana_da_il:
    title: Ana 描述她的日常
    gloss: Ana:是的,我每天都带它出去散步,还给它喂食。
  ro.a1.unit32.lesson05.teach.mihai_si_elena:
    title: Mihai、Elena 和 Andrei 谈动物
    gloss: Mihai 和 Elena 都爱动物,但他们两人都没有宠物。Mihai 爱狗,Elena 爱猫。而 Andrei 有一只宠物:一只猫。他经常和他的猫玩,每天还给它喂食。你有宠物吗?
    note: 这里对比了喜欢动物与真正饲养宠物，是本部分要表达的重点。
    glosses:
      iubesc: 喜爱
      amândoi: 两者都
      animalele: 动物
      doi: 两者都
      companie: 宠物
      câinii: 狗
      pisicile: 猫
      pisică: 猫
      joacă: 玩
      dă: 给
      fiecare: 每一
      mâncare: 食物
  ro.a1.unit32.lesson05.teach.andrei_se_joaca:
    title: Andrei 经常和他的猫玩
    gloss: Andrei 经常和他的猫玩。
    note: '*Des*(经常)沿用了爱好单元中的频率词;*a se juca cu*(“和……玩”)是自反动词。'
  ro.a1.unit32.lesson05.teach.iubesc_cainii_nu:
    title: 我喜欢狗。我没有宠物。
    gloss: 我喜欢狗。我没有宠物。
    note: 这是一个由两句话组成的示范答案，可以直接套用在本单元的写作题中。
  ro.a1.unit32.lesson06.teach.ana_nina_ai:
    title: Ana 问 Nina
    gloss: Ana:Nina,你也有宠物吗?
  ro.a1.unit32.lesson06.teach.nina_da_am:
    title: Nina 有一只名叫 Pico 的鸟
    gloss: 尼娜：是的，我有一只鸟。它叫皮科。
    note: '*O cheamă*(“名叫”)沿用了表示命名的动词 *a chema*;鸟是阴性,所以代词是 *o*。'
  ro.a1.unit32.lesson06.teach.mihai_ce_frumos:
    title: Mihai 的反应
    gloss: 米哈伊：真好！你每天和它做什么？
  ro.a1.unit32.lesson06.teach.nina_ii_dau:
    title: 尼娜每天喂她的鸟
    gloss: 尼娜：我每天喂它。
  ro.a1.unit32.lesson06.teach.mihai_iubesc_si:
    title: Mihai 也爱鸟
    gloss: Mihai:我也爱鸟。
  ro.a1.unit32.lesson06.teach.ana_ce_frumos:
    title: Ana 结束对话
    gloss: Ana:我们三个人都爱动物,真好!
    note: 这句话将本单元三个人物与动物有关的信息串联起来，为对话收尾。
