course:
  title: 罗马尼亚语入门 A1
  description: 面向初学者的罗马尼亚语：谈论宠物和常见动物——说出动物的名称、基本照料（遛、喂、玩耍）、表达自己喜爱的动物（即使没有养），以及罗马尼亚语的规则复数。
