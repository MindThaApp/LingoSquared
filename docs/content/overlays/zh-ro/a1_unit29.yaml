teaching:
  ro.a1.unit29.lesson01.teach.cat_costa_in:
    title: 询问总价
    gloss: 总共多少钱？
    note: '*În total*（总共）说明你想问的是合计的总价，而不是单件商品的价格；*Cât costă?* 问的是“多少钱？”。'
  ro.a1.unit29.lesson01.teach.costa_douazeci_si:
    title: 说出总价
    gloss: 总共一百列伊。
    note: '*Costă* 是 *a costa*（花费、值）的第三人称单数形式。数字超过 19 时，罗马尼亚语在名词前加 *de*：*o sută de lei*。'
  ro.a1.unit29.lesson02.teach.a_plati_cu:
    title: 刷卡或用现金付款
    gloss: 刷卡支付，用现金支付
    note: '*A plăti cu cardul* 意思是刷卡付款，*a plăti în numerar* 意思是付现金；*cu* 意思是“用”，*în* 意思是“以、在……中”。'
    example_gloss:
    - 我可以在这里刷卡支付吗？
    - 我付现金。
  ro.a1.unit29.lesson02.teach.pot_plati_cu:
    title: 询问是否可以刷卡
    gloss: 我可以在这里刷卡支付吗？
    note: '*Pot plăti*（我可以付款）是 *a putea* + 动词；*aici*（这里）表明问的是当前所在的地方。'
  ro.a1.unit29.lesson02.teach.doriti_sa_platiti:
    title: 询问付款偏好
    gloss: 您想用现金还是刷卡？
    note: '*Doriți să plătiți ...?* 是正式的 *dumneavoastră*（您）形式，陌生的收银员会这样说；对朋友则说 *Vrei să plătești ...?*'
  ro.a1.unit29.lesson03.teach.nota:
    title: 账单
    gloss: 这份账单
    note: 阴性名词：*o notă*，*nota*（冠词接在词尾）。
    example_gloss: 我们分摊账单好吗？
  ro.a1.unit29.lesson03.teach.hai_sa_impartim:
    title: 提议分摊账单
    gloss: 我们分摊账单好吗？
    note: '*Hai să* + 动词表示提议一起做某事。'
  ro.a1.unit29.lesson03.teach.pot_plati_separat:
    title: 请求分开付款
    gloss: 我可以分开付款吗？
    note: '*Separat*（分开地）放在 *a plăti* 之后；每个人各付各的那一份时，通常这样问 *Pot plăti separat?*'
  ro.a1.unit29.lesson04.teach.restul:
    title: 找零
    gloss: 找零
    note: '*Restul* 字面意思是“剩下的部分”，罗马尼亚语用它来指找回的零钱；冠词接在词尾。'
    example_gloss: 这是您的找零。
  ro.a1.unit29.lesson04.teach.poftiti_restul:
    title: 递上找零
    gloss: 这是您的找零。
    note: '*Poftiți* 是正式的 *dumneavoastră*（您）形式，意思是“给您”，符合柜台前的正式场合。'
  ro.a1.unit29.lesson04.teach.nu_am_nevoie:
    title: 谢绝找零
    gloss: 我不需要找零。
    note: '*A avea nevoie de*（需要）后面要接 *de*：*Nu am nevoie de rest*。'
  ro.a1.unit29.lesson05.teach.treizeci_si_cinci:
    title: 三十五
    gloss: 三十五
    note: 罗马尼亚语用 *și* 构成 21 到 99 的数字：*treizeci și cinci*（字面意思是“三十和五”），并在名词前加 *de*：*o sută treizeci și cinci de lei*。
    example_gloss: 一共是一百三十五列伊。
  ro.a1.unit29.lesson05.teach.nota_doua_feluri:
    title: 阅读餐厅账单
    gloss: 账单：两份主菜和两杯咖啡。总计：一百三十五列伊。已刷卡支付。
    note: 注意点了什么、总额是多少以及付款方式。
    glosses:
      Nota: 账单
      două: 二
      feluri: 主菜
      cafele: 咖啡
      Total: 总额
      '135': 一百三十五
      lei: 列伊
      Plătit: 已支付
      cardul: 银行卡
  ro.a1.unit29.lesson06.teach.ana_hai_sa:
    title: 安娜要结账
    gloss: 安娜：我们结账吧？
    note: '*A cere*（要求、索要）以 *nota* 作直接宾语；*Hai să cerem nota?* 是提议一起要账单。'
  ro.a1.unit29.lesson06.teach.mihai_da_buna:
    title: 米哈伊询问总价
    gloss: 米哈伊：好，好主意。总共多少钱？
    note: 重复使用第 1 课的问句 *Cât costă în total?*。
  ro.a1.unit29.lesson06.teach.ana_sunt_treizeci:
    title: 安娜说出总价
    gloss: 安娜：一共是一百三十五列伊。我们分摊吧？
    note: '*Împărțim* 是 *a împărți*（分摊）的 *noi*（我们）形式；*nota* 根据上下文可以省略。'
  ro.a1.unit29.lesson06.teach.mihai_nu_lasa:
    title: 米哈伊坚持要付钱
    gloss: Mihai：不，今天让我来付。你帮了我这么多。
    note: '*Lasă-mă să* ...（让我……）是主动提出做某事的标准说法；*m-ai ajutat*（“你帮了我”）是过去时形式。'
  ro.a1.unit29.lesson06.teach.ana_ce_dragut:
    title: Ana 很感动
    gloss: Ana：你真贴心！谢谢你。
    note: '*Ce drăguț din partea ta!*（你真贴心）是对慷慨举动的一句亲切、常用的称赞。'
  ro.a1.unit29.lesson06.teach.mihai_pot_plati:
    title: Mihai 询问能否刷卡
    gloss: Mihai：我可以在这里刷卡吗？
    note: 重复使用第 2 课的问句 *Pot plăti cu cardul aici?*，这次是在真正的餐厅里。
  ro.a1.unit29.lesson06.teach.mihai_plateste_nota:
    title: Plătește：他/她的形式
    gloss: Mihai 付账。
    note: '*Plătește* 是 *a plăti*（付款）的他/她形式。'
