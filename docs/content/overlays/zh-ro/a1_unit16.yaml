answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit's own new vocabulary (doare, cap, stomac, simt, bolnav, nevoie, doctor, odihnă, multă) is used only in fixed first-person (Mihai's own "Nu mă simt bine"/"Sunt bolnav") or already-established formal ("Aveți nevoie de...?") forms. No informal-tu form is introduced this unit; Ana and Mihai keep their existing formal register with each other.
course:
  title: 罗马尼亚语入门 A1
  description: 用罗马尼亚语表达基本的健康问题——Doare（疼）、Bolnav（生病的）和 Doctor（医生）——米哈伊觉得不舒服，安娜关心他并给他建议。
units:
  ro.a1.unit16.health:
    title: 健康
lessons:
  ro.a1.unit16.lesson01.ma_doare_capul:
    title: 我头疼
  ro.a1.unit16.lesson02.nu_ma_simt_bine:
    title: 我觉得不舒服
  ro.a1.unit16.lesson03.mihai_este_bolnav:
    title: 米哈伊病了
teaching:
  ro.a1.unit16.lesson01.teach.reminder_ma_va_ce_sau:
    title: 复习：mă, vă, ce, sau
    gloss: 我（宾语） · 您（正式，宾语） · 什么 · 或者
    note: Mă 出自第1课和第10课（mă numesc、mă trezesc）；vă 出自第1、6、7、13课（vă rog）；ce 出自第1、3、4、15课；sau 出自第13课——本单元把这四个词用于新的目的：说明哪里疼。
  ro.a1.unit16.lesson01.teach.doare_vocab:
    title: 疼
    gloss: 疼；会疼
    note: 这是无人称动词——罗马尼亚语说“它让我疼”（*mă doare*），而不是“我疼”。单说 *Mă doare* 意思是“（我）疼”；加上身体部位就能说明哪里疼：*Mă doare capul*。
    example_gloss:
    - 疼。
  ro.a1.unit16.lesson01.teach.cap_vocab:
    title: 头
    gloss: 头
    note: 中性名词，以辅音结尾，表示“这个头”时加 *-ul*，和 *tren*→*trenul*、*peron*→*peronul* 的词尾相同。
    example_gloss:
    - 我头疼。
  ro.a1.unit16.lesson01.teach.ce_va_doare_phrase:
    title: 您哪里疼？
    gloss: 您哪里疼？
    note: '*Ce*（什么）+ *vă*（您，敬称宾语）+ *doare*（疼）——这里每个词都学过或刚刚出现，组合成一个新的问句。'
  ro.a1.unit16.lesson01.teach.stomac_vocab:
    title: 胃
    gloss: 胃
    note: 中性名词，以辅音结尾，所以“这个胃”是 *stomacul*，和 *cap*→*capul* 的词尾 *-ul* 相同。
    example_gloss:
    - 我肚子痛。
  ro.a1.unit16.lesson01.teach.ma_doare_capul_sau_stomacul_phrase:
    title: 您是头疼还是胃疼？
    gloss: 您是头疼还是胃疼？
    note: 用 *vă*（您，敬称）代替 *mă*，陈述句就变成了询问对方的问句；*sau*（或者，第13单元学过）连接刚学的两个身体部位。
  ro.a1.unit16.lesson02.teach.reminder_nu_bine_am_un_de:
    title: 复习：nu, bine, am, un, de
    gloss: 不／没 · 好 · 我有 · 一个（阳性／中性） · 的／来自
    note: Nu 和 bine 出自第1、6、11单元；am 出自第2、5、15单元；un 和 de 出自第6、7、15单元——本单元把这五个词都重新用上，来谈身体不舒服和需要医生。
  ro.a1.unit16.lesson02.teach.ma_simt_vocab:
    title: 我感觉
    gloss: 我感觉
    note: 这是一个反身动词，字面意思是“我感觉自己”——和第10单元的 *mă trezesc*／*mă culc* 一样，都是 *mă* + 动词的结构。
    example_gloss:
    - 我感觉很好。
  ro.a1.unit16.lesson02.teach.nu_ma_simt_bine_phrase:
    title: 我觉得不舒服
    gloss: 我觉得不舒服。
    note: '*Nu* 否定 *mă simt bine*——在还没说出具体症状时，这是表达身体不适的自然说法。'
  ro.a1.unit16.lesson02.teach.bolnav_vocab:
    title: 生病
    gloss: 生病的（男）
    note: 这是形容词的阳性形式，就像米哈伊说的 *Sunt bolnav*。女性要说 *Sunt bolnavă*（阴性形式）。
    example_gloss:
    - 我生病了。
  ro.a1.unit16.lesson02.teach.am_nevoie_de_un_doctor_phrase:
    title: 我需要医生
    gloss: 我需要医生。
    note: '*Am nevoie de*（我需要，字面意思是“我有……的需要”）+ *un doctor*——这是固定表达，求助时什么都能用，不只限于医生。'
  ro.a1.unit16.lesson02.teach.doctor_vocab:
    title: Doctor
    gloss: 医生
    note: 阳性名词，所以“一位医生”是 *un doctor*。
    example_gloss:
    - 我需要医生。
  ro.a1.unit16.lesson03.teach.reminder_ce_mai_faceti_aveti_da:
    title: 复习：Ce mai faceți?, Aveți, Da
    gloss: 您好吗？（敬称） · 您有（敬称） · 是的
    note: Ce mai faceți 出自第1单元；Aveți 出自第5单元；Da 出自第6、11单元——都在本单元的问候对话中重新使用。
  ro.a1.unit16.lesson03.teach.reminder_buna_multumesc_la_revedere_ana_mihai:
    title: 复习：bună, mulțumesc, la revedere, Ana, Mihai
    gloss: 你好 · 谢谢 · 再见 · 安娜、米哈伊（人名）
    note: 这些在前面的单元都已出现——本课程每段对话都用这种友好的开头和结尾。
  ro.a1.unit16.lesson03.teach.reminder_spitalul_vizavi_magazin:
    title: 复习：Spitalul este vizavi de magazin
    gloss: 医院在商店对面。
    note: 直接沿用第8单元的句子——医院的位置没有变，本单元的阅读短文也回指了这句话。
  ro.a1.unit16.lesson03.teach.odihna_vocab:
    title: 休息
    gloss: 休息
    note: 阴性名词——身体不舒服时，医生（或朋友）会建议你做的事。
    example_gloss:
    - 你需要休息。
  ro.a1.unit16.lesson03.teach.multa_apa_vocab:
    title: 多喝水
    gloss: 很多水
    note: '*Multă*（很多，阴性）与阴性名词 *apă*（水，第6单元）一致——这是固定搭配，医生可能会这样建议。'
    example_gloss:
    - 休息，多喝水。
  ro.a1.unit16.lesson03.teach.line01:
    title: 问候并询问近况
    gloss: 安娜向米哈伊问好，并问他怎么样。
    note: 沿用第1单元的问候语 *Ce mai faceți?*。
  ro.a1.unit16.lesson03.teach.line02:
    title: 说自己不舒服
    gloss: 米哈伊说他觉得不舒服，头疼。
    note: 结合了本单元第二课和第一课的短语。
  ro.a1.unit16.lesson03.teach.line03:
    title: 问他是否需要医生
    gloss: 安娜问他是否需要医生。
    note: 把本单元第二课的短语变成问句，并用上第5单元的 *aveți*。
  ro.a1.unit16.lesson03.teach.line04:
    title: 确认自己生病并需要医生
    gloss: 米哈伊说是的，他生病了，需要医生。
    note: 结合了本单元的 *sunt bolnav* 和 *am nevoie de un doctor*。
  ro.a1.unit16.lesson03.teach.line05:
    title: 给出建议并道别
    gloss: 安娜叮嘱他多休息、多喝水，然后道别。
    note: 用上本课的 *Odihnă și multă apă*——与课程中一般只说再见的结尾不同，这里加了健康方面的建议。
  ro.a1.unit16.lesson03.teach.line06:
    title: 向她道谢并道别
    gloss: 米哈伊向安娜道谢并道别。
    note: 和前面每个单元的对话一样的结束方式。
