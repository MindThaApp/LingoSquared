answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the question mark/exclamation mark.
  register: This unit's new "Ai frați?"/"Aveți frați?" and "Câți copii ai?"/"Câți copii aveți?" pairs are register-sensitive (tu vs. dumneavoastră, parallel to unit02's ai/aveți age questions) -- accept either register unless an exercise explicitly names one. Ana and Mihai's closing dialogue keeps the dumneavoastră register unit01 already established between them.
course:
  title: 罗马尼亚语入门 A1
  description: 用罗马尼亚语谈论家庭——父母、兄弟姐妹、孩子和婚姻状况，使用 meu/mea 这一对物主词，并沿用第2单元询问年龄时 tu/dumneavoastră 的称呼对比——继续跟随 Ana 和 Mihai，看他们如何了解彼此的家人。
units:
  ro.a1.unit05.family:
    title: 家庭
lessons:
  ro.a1.unit05.lesson01.familia_mea:
    title: 我的家庭
  ro.a1.unit05.lesson02.frati_si_copii:
    title: 兄弟姐妹和孩子
  ro.a1.unit05.lesson03.o_discutie_despre_familie:
    title: 一段关于家庭的对话
teaching:
  ro.a1.unit05.lesson01.teach.reminder_am_un_o_si_mare:
    title: 复习：am, un, o, și, mare
    gloss: 我有 · 一个 · 和 · 大
    note: 这五个词在前面的单元都出现过（*și* 在第1单元，*am* 和 *o* 在第2单元，*mare* 在第3单元的“大写字母”注释里，*un* 在第4单元）——这里它们再次出现，用来谈论家庭。
  ro.a1.unit05.lesson01.teach.familie:
    title: 家庭
    gloss: 家庭
    note: 阴性名词——可与 *o* 和 *mare* 这样的形容词搭配，表示“一个大家庭”。
    example_gloss: 我有一个大家庭。
  ro.a1.unit05.lesson01.teach.mama:
    title: 母亲
    gloss: 母亲
    note: “母亲”的词典原形——后面几张卡片会讲怎么说“我的母亲”。
    example_gloss: Mihai 有妈妈和爸爸。
  ro.a1.unit05.lesson01.teach.tata:
    title: 父亲
    gloss: 父亲
    note: “父亲”的词典原形。
    example_gloss: 我的父亲是老师。
  ro.a1.unit05.lesson01.teach.parintii:
    title: 父母
    gloss: 父母
    note: 指父母双方，相当于汉语的“父母”。
    example_gloss: 我的父母住在罗马尼亚。
  ro.a1.unit05.lesson01.teach.meu_mea:
    title: 我的：meu 与 mea
    gloss: 我的（阳性）/ 我的（阴性）
    note: 罗马尼亚语中表示“我的”的词要与所属事物的性一致，而不是与拥有者一致——阳性名词如 *tată* 用 *meu*，阴性名词如 *mamă* 用 *mea*。
  ro.a1.unit05.lesson01.teach.mama_mea:
    title: 我的妈妈
    gloss: 我的母亲
    note: Mamă 在接 mea 之前要变成 mama（加上定冠词）——“我的妈妈”实际上就是这样说的，不是逐字对译。
  ro.a1.unit05.lesson01.teach.tatal_meu:
    title: 我的爸爸
    gloss: 我的父亲
    note: Tată 在接 meu 之前要变成 tatăl（加上定冠词，因为 tată 已经以 -ă 结尾，所以不规则地加 -l）。
  ro.a1.unit05.lesson01.teach.mama_si_tatal:
    title: 我的妈妈和我的爸爸
    gloss: 我的妈妈和我的爸爸。
    note: 把两个物主形式放在一个句子里，各自按性正确搭配。
  ro.a1.unit05.lesson02.teach.reminder_cati_ai_aveti_doi_nu:
    title: 复习：câți, ai, aveți, doi, nu
    gloss: 多少 · 你有/您有（非正式/正式）· 二 · 不/没有
    note: '*Câți*、*ai* 和 *aveți* 最早出现在第2单元询问年龄时（"Câți ani ai?"）；这里用来询问兄弟姐妹和孩子。*Doi* 来自第2单元的数字，*nu* 来自第3单元。'
  ro.a1.unit05.lesson02.teach.da:
    title: 是
    gloss: 是
    note: 表示“是”的日常用词，与第3单元的 *nu*（“不”）相对。
    example_gloss: 是的，我有一个哥哥（或弟弟）。
  ro.a1.unit05.lesson02.teach.frate_sora:
    title: 兄弟，姐妹
    gloss: 兄弟 / 姐妹
    note: 阳性和阴性的兄弟姐妹名词——和其他名词一样，与 un/o 搭配。
    example_gloss:
    - 我有一个兄弟。
    - 我有一个姐妹。
  ro.a1.unit05.lesson02.teach.frati_surori:
    title: 兄弟们，姐妹们
    gloss: 兄弟们 / 姐妹们
    note: 复数形式，用来泛泛地询问兄弟姐妹——罗马尼亚人常问 "Ai frați?"（“你有兄弟吗？”），意思是“你有兄弟姐妹吗”，之后常会再单独问一句 "Surori?" 确认有没有姐妹。
    example_gloss: 你有兄弟或姐妹吗？
  ro.a1.unit05.lesson02.teach.ai_frati:
    title: 你有兄弟姐妹吗？（非正式）
    gloss: 你有兄弟吗？
    note: 日常的非正式问法——与第1单元的 *tu* 称呼相配。
  ro.a1.unit05.lesson02.teach.aveti_frati:
    title: 您有兄弟姐妹吗？（正式）
    gloss: 你有兄弟吗？
    note: 礼貌的问法，用的是第2单元询问年龄时同样的 *aveți*。
  ro.a1.unit05.lesson02.teach.copil_copii:
    title: 孩子，孩子们
    gloss: 孩子 / 孩子们
    note: Copil 是罗马尼亚语中较难的复数之一——复数是 copii，不是常规的 -i 或 -e 结尾——最好把它当作单独的形式来记。
    example_gloss: 我有两个孩子。
  ro.a1.unit05.lesson02.teach.fiu_fiica:
    title: 儿子，女儿
    gloss: 儿子 / 女儿
    note: 专指儿子和女儿的词，不同于泛指的 copil/copii。
    example_gloss:
    - 我有一个儿子。
    - 我有一个女儿。
  ro.a1.unit05.lesson02.teach.cati_copii_ai:
    title: 你有几个孩子？
    gloss: 你有几个孩子？
    note: Câți（多少）+ copii（孩子们）+ ai（你有）——三个词都已学过。
  ro.a1.unit05.lesson02.teach.casatorit:
    title: 已婚
    gloss: 已婚
    note: 日常交谈中常见的个人信息问题，和问年龄一样。
    example_gloss: 你结婚了吗？
  ro.a1.unit05.lesson03.teach.reminder_bine_la_revedere:
    title: 复习：bine, la revedere, Ana, Mihai
    gloss: 好/不错 · 再见 · Ana、Mihai（人名）
    note: 回顾前面单元学过的词汇，在本课对话中再次使用。
  ro.a1.unit05.lesson03.teach.line01:
    title: 询问有没有兄弟姐妹
    gloss: Ana 问 Mihai 有没有兄弟姐妹。
    note: 使用礼貌形式 *aveți*，与两人一贯的称呼方式一致。
  ro.a1.unit05.lesson03.teach.line02:
    title: 回答并反问
    gloss: Mihai 说他有一个哥哥（或弟弟）和一个姐姐（或妹妹），并问 Ana 有没有孩子。
    note: 在一次对话中用到本单元的 frate/soră 和 copii。
  ro.a1.unit05.lesson03.teach.line03:
    title: 回答并把问题抛回去
    gloss: Ana 说她有一个女儿，并把同样的问题问回 Mihai。
    note: '*Și dumneavoastră?*（“那您呢？”）正是第1单元自我介绍时出现过的同一种反问句式。'
  ro.a1.unit05.lesson03.teach.line04:
    title: 回答
    gloss: Mihai 说他有一个儿子。
    note: 简短直接的回答，用到了本单元的 fiu。
  ro.a1.unit05.lesson03.teach.line05:
    title: 回应并结束
    gloss: Ana 积极地回应，并道别。
    note: 这里的 *Bine!* 是一个简短的肯定回应，与第1单元 *Bine, mulțumesc.* 中的词相同。
  ro.a1.unit05.lesson03.teach.line06:
    title: 结束这次交谈
    gloss: Mihai 也道别，并称呼了 Ana 的名字。
    note: 与第1单元和第4单元的对话结尾一样的友好告别方式。
