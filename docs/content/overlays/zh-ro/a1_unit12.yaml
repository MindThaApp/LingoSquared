  notes: 'Derived from en-ro by scripts/derive_cross.py: structure, exercise keys and English answer sets are shared with the sibling; every Chinese (Mandarin, Simplified) string was translated and adapted. Needs native Chinese (Mandarin, Simplified) review (contrastive notes, register, distractor plausibility). NATIVE FLAGS: pending.'
answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit's new grammar is entirely 1st-person (am fost/am mâncat/ am băut, invariant for singular and plural) plus one fixed 3rd- person formulaic pair (Cum a fost...?/A fost bine!) taught only as an unanalyzed set phrase. No new second-person forms are introduced. Ana and Mihai's dialogue keeps their existing polite register with each other, matching unit06/unit07/unit08/unit09/ unit10/unit11.
course:
  title: 罗马尼亚语入门 A1
  description: 用罗马尼亚语描述最近刚完成的事情——am fost（我去了／我在）、am mâncat（我吃了）、am băut（我喝了），以及 Cum a fost...?／A fost bine! 这组“……怎么样？”的问答——继续跟随 Ana 和 Mihai 回顾他们周日在公园的时光。
units:
  ro.a1.unit12.past_events:
    title: 昨天
lessons:
  ro.a1.unit12.lesson01.am_fost_la_parc:
    title: 我去了公园
  ro.a1.unit12.lesson02.am_mancat_am_baut:
    title: 我吃了也喝了
  ro.a1.unit12.lesson03.cum_a_fost_duminica:
    title: 周日过得怎么样？
teaching:
  ro.a1.unit12.lesson01.teach.reminder_parc_cinema:
    title: 回顾：parc、cinema
    gloss: parc（公园）· cinema（电影院）
    note: 这两个词在第11单元已经学过，这里将与本单元新的过去时语法结合使用。
  ro.a1.unit12.lesson01.teach.reminder_astazi_maine_duminica_sambata:
    title: 回顾：astăzi、mâine、duminică、sâmbătă
    gloss: astăzi（今天）· mâine（明天）· duminică（星期日）· sâmbătă（星期六）
    note: 这些词在第3单元和第11单元都已学过，这里用来与本课新学的 *ieri*（昨天）形成对照。
  ro.a1.unit12.lesson01.teach.am_fost_vocab:
    title: 我去过 / 我曾在
    gloss: Am fost（我去过／我曾在）
    note: 这是 *a fi*（是、在）的复合过去时。*am* 是表示“我”和“我们”都通用的固定助动词，*fost* 是固定的过去分词形式。后面接地点时，*am fost la...* 是表达“我去了……”最日常、最自然的说法，口语中比表示“走去／前往”的动词更常用。
    example_gloss:
    - 我去了公园。
  ro.a1.unit12.lesson01.teach.am_fost_parc_phrase:
    title: 我去了公园
    gloss: Am fost la parc.（我去了公园。）
    note: 完整结构：am fost + la + 地点。
  ro.a1.unit12.lesson01.teach.am_fost_cinema_phrase:
    title: 我去了电影院
    gloss: Am fost la cinema.（我去了电影院。）
    note: 结构与 *Am fost la parc* 相同，只是换了一个地点。
  ro.a1.unit12.lesson01.teach.ieri_vocab:
    title: 昨天
    gloss: Ieri（昨天）
    note: 第3单元已经和 *astăzi*（今天）、*mâine*（明天）一起学过，现在用在过去时中，放在句首说明事情发生的时间。
    example_gloss:
    - 昨天我去了公园。
  ro.a1.unit12.lesson01.teach.ieri_am_fost_parc_phrase:
    title: 昨天我去了公园
    gloss: Ieri am fost la parc.（昨天我去了公园。）
    note: 在 *Am fost la parc* 前面加上 *ieri*，就明确了事情发生的时间。
  ro.a1.unit12.lesson02.teach.reminder_mananc_beau:
    title: 回顾：mănânc、beau
    gloss: mănânc（我吃）· beau（我喝）
    note: 这两个词在第10单元的日常作息中已经学过，本课将学习它们的过去时形式。
  ro.a1.unit12.lesson02.teach.reminder_paine_cafea_ceai_si:
    title: 回顾：pâine、cafea、ceai、și
    gloss: pâine（面包）· cafea（咖啡）· ceai（茶）· și（和）
    note: 这些词在第6单元和第10单元都已学过，本课在过去时的句子中再次使用。
  ro.a1.unit12.lesson02.teach.am_mancat_vocab:
    title: 我吃了
    gloss: Am mâncat（我吃了）
    note: 这是 *a mânca*（吃）的复合过去时，现在时形式 *mănânc*（我吃）已在第10单元学过，是同一个动词的过去时。结构为 am + mâncat，与 *am fost* 相同。
    example_gloss:
    - 我吃了面包。
  ro.a1.unit12.lesson02.teach.am_mancat_paine_phrase:
    title: 我吃了面包
    gloss: Am mâncat pâine.（我吃了面包。）
    note: 完整结构：am mâncat + 食物。
  ro.a1.unit12.lesson02.teach.am_baut_vocab:
    title: 我喝了
    gloss: Am băut（我喝了）
    note: 这是 *a bea*（喝）的复合过去时，现在时形式 *beau*（我喝）已在第10单元学过，是同一个动词的过去时。
    example_gloss:
    - 我喝了茶。
  ro.a1.unit12.lesson02.teach.am_baut_ceai_phrase:
    title: 我喝了茶
    gloss: Am băut ceai.（我喝了茶。）
    note: 完整结构：am băut + 饮品。
  ro.a1.unit12.lesson02.teach.am_mancat_am_baut_phrase:
    title: 我吃了面包，喝了茶
    gloss: Am mâncat pâine și am băut ceai.（我吃了面包，喝了茶。）
    note: 用 *și* 连接两个过去的动作，第10单元在连接现在时的日常活动时已经用过这个连词。
  ro.a1.unit12.lesson03.teach.reminder_am_fost_ieri_parc_cinema:
    title: 回顾：am fost、ieri、parc、cinema
    gloss: am fost（我去过／我曾在）· ieri（昨天）· parc（公园）· cinema（电影院）
    note: 这些都来自本单元的第一课，在这里为回顾周日的对话做铺垫。
  ro.a1.unit12.lesson03.teach.reminder_am_mancat_am_baut:
    title: 回顾：am mâncat、am băut、pâine、cafea、ceai
    gloss: am mâncat（我吃了）· am băut（我喝了）· pâine（面包）· cafea（咖啡）· ceai（茶）
    note: 这些都来自本单元的第二课，在这里 Ana 和 Mihai 各自说自己吃喝了什么。
  ro.a1.unit12.lesson03.teach.reminder_cum_duminica_bine:
    title: 回顾：cum、duminică、bine、mulțumesc、la revedere、Ana、Mihai
    gloss: cum（怎么，第1单元／第9单元）· duminică（星期日，第3单元）· bine（好，第1单元）· mulțumesc（谢谢）· la revedere（再见）· Ana、Mihai（人名）
    note: 这些都在前面的单元学过。*cum* 最初用于询问名字（第1单元）和问路（第9单元），这里则用在另一种问句中：询问事情进行得如何。
  ro.a1.unit12.lesson03.teach.a_fost_vocab:
    title: 它是／过得
    gloss: A fost（它曾是／过得）
    note: 这是与 *am fost* 同一个动词的另一个人称形式：*a* 是用于“他／她／它”的助动词，而不是用于“我／我们”的。目前请把 *Cum a fost...?* 和 *A fost bine!* 当作固定短语来记，不要自行随意套用。
    example_gloss:
    - 过得很好！
  ro.a1.unit12.lesson03.teach.a_fost_bine_phrase:
    title: 过得很好！
    gloss: A fost bine!（过得很好！）
    note: 表示事情进行得顺利的简短自然说法，用来回答 *Cum a fost...?*
  ro.a1.unit12.lesson03.teach.cum_a_fost_duminica_phrase:
    title: 周日过得怎么样？
    gloss: Cum a fost duminică?（周日过得怎么样？）
    note: 这是和别人聊起最近某一天时的自然开场，即使对方当时和你在一起，也可以这样问，请对方谈谈感受或印象最深的事。
  ro.a1.unit12.lesson03.teach.line01:
    title: 打招呼并询问周日过得如何
    gloss: Mihai 向 Ana 问好，并问她周日过得怎么样。
    note: 把本单元的 *Cum a fost duminică?* 与已学过的 *Bună* 结合起来。
  ro.a1.unit12.lesson03.teach.line02:
    title: 回答并说去了哪里
    gloss: Ana 说过得很好，她去了公园。
    note: 把 *A fost bine!* 与第一课的 *Am fost la parc* 结合起来。
  ro.a1.unit12.lesson03.teach.line03:
    title: 说说他吃了什么、喝了什么
    gloss: Mihai 说他吃了面包，喝了茶。
    note: 再次使用第二课的 *Am mâncat pâine și am băut ceai*，与第6单元中 Mihai 一贯的搭配（pâine 和 ceai）一致。
  ro.a1.unit12.lesson03.teach.line04:
    title: 说说她喝了什么
    gloss: Ana 说她喝了咖啡。
    note: 与第6单元中 Ana 一贯的选择（cafea）一致。
  ro.a1.unit12.lesson03.teach.line05:
    title: 道谢并告别
    gloss: Mihai 向 Ana 道谢并说再见。
    note: 与前面每个单元的对话结尾方式相同。
  ro.a1.unit12.lesson03.teach.line06:
    title: 结束对话
    gloss: Ana 也向 Mihai 道别，并称呼他的名字。
    note: 与前面每个单元的对话一样，以友好的方式结束。
