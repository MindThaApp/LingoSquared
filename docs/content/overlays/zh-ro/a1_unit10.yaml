answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit's new verbs are all first-person singular (mă trezesc, mănânc, beau, lucrez, merg, mă culc) and are register-neutral -- Romanian's first-person verb form is the same regardless of tu/dumneavoastră, and this unit introduces no second-person forms. Ana and Mihai's closing dialogue keeps their existing polite register with each other, matching unit06/unit07/unit08/unit09.
course:
  title: 罗马尼亚语入门 A1
  description: 用罗马尼亚语描述简单的日常作息——mă trezesc（我起床）、mănânc / beau（我吃／我喝）、lucrez（我工作）、merg acasă（我回家）和 mă culc（我去睡觉）——继续 Ana 和 Mihai 的故事，这次是 Ana 问 Mihai 一天是怎么过的。
units:
  ro.a1.unit10.routines:
    title: 日常作息
lessons:
  ro.a1.unit10.lesson01.dimineata:
    title: 早上
  ro.a1.unit10.lesson02.lucrez_merg_acasa:
    title: 我工作，我回家
  ro.a1.unit10.lesson03.rutina_mihai:
    title: Mihai 的日常作息
teaching:
  ro.a1.unit10.lesson01.teach.reminder_dimineata_seara_noaptea_cafea_paine:
    title: 复习：dimineața, seara, noaptea, cafea, pâine
    gloss: dimineața（早上）· seara（晚上）· noaptea（夜里）· cafea（咖啡）· pâine（面包）
    note: 这些都已学过——dimineața/seara/noaptea 自第4单元起，cafea/pâine 自第6单元起——在这里它们组合成本单元的日常作息句子。
  ro.a1.unit10.lesson01.teach.ma_trezesc_vocab:
    title: 我起床
    gloss: Mă trezesc（我起床）
    note: '*Mă* 是反身代词，在 *mă numesc*/*mă cheamă* 中已经见过——罗马尼亚语用反身动词表示“起床”，字面意思是“我唤醒自己”。'
    example_gloss:
    - 我早上起床。
  ro.a1.unit10.lesson01.teach.ma_trezesc_phrase:
    title: 我早上起床
    gloss: Mă trezesc dimineața.（我早上起床。）
    note: 一个简短完整的陈述——最简单的日常作息句子。
  ro.a1.unit10.lesson01.teach.mananc_vocab:
    title: 我吃
    gloss: 我吃
    note: 不需要说“我”这个代词——罗马尼亚语的动词词尾已经表明了说话人是谁，和之前学过的 *vreau*、*cumpăr*、*aș dori* 是同样的规律。
    example_gloss:
    - 我早上吃面包。
  ro.a1.unit10.lesson01.teach.beau_vocab:
    title: 我喝
    gloss: 我喝
    note: 很自然地可以和已经学过的饮品搭配，例如 *cafea* 和 *ceai*。
    example_gloss:
    - 我早上喝咖啡。
  ro.a1.unit10.lesson01.teach.mananc_beau_phrase:
    title: 我早上吃面包、喝咖啡
    gloss: 我早上吃面包、喝咖啡。
    note: 用 *și*（和）连接两个动作，这个词在第4单元的 *ora unu și jumătate* 中已经学过。
  ro.a1.unit10.lesson02.teach.lucrez_vocab:
    title: 我工作
    gloss: 我工作
    note: 这是 *lucrează* 的第一人称形式，第4单元中描述米哈伊自己晚上工作时已经出现过。
    example_gloss:
    - 我晚上工作。
  ro.a1.unit10.lesson02.teach.lucrez_phrase:
    title: 我晚上工作
    gloss: 我晚上工作。
    note: 一个简短而完整的句子，说明你什么时候工作。
  ro.a1.unit10.lesson02.teach.merg_vocab:
    title: 我去
    gloss: 我去
    note: 这是前面学过的命令式 *mergeți* 的第一人称形式——同一个动词，人称不同。
    example_gloss:
    - 我回家。
  ro.a1.unit10.lesson02.teach.acasa_vocab:
    title: 家
    gloss: 家；在家；回家
    note: 前面不用介词——说 *merg acasă*，不说 *merg la acasă*。和汉语“回家”不需要介词的说法类似。
    example_gloss:
    - 我夜里回家。
  ro.a1.unit10.lesson02.teach.merg_acasa_phrase:
    title: 我夜里回家
    gloss: 我夜里回家。
    note: 一个简短而完整的句子——一天工作的自然结束。
  ro.a1.unit10.lesson02.teach.lucrez_merg_phrase:
    title: 我晚上工作，夜里回家
    gloss: 我晚上工作，夜里回家。
    note: 用 *și* 把本课的两个句子合成一句。
  ro.a1.unit10.lesson03.teach.reminder_cursul_incepe_ora_apoi:
    title: 复习：cursul、începe、la ora nouă、apoi
    gloss: 课程 · 开始 · 九点 · 然后
    note: Cursul、începe、la ora nouă 在第4单元已经学过（米哈伊的课在早上九点开始）；apoi 在第9单元已学过——这里它们组合成米哈伊自己的日常叙述。
  ro.a1.unit10.lesson03.teach.reminder_buna_multumesc_la_revedere_da:
    title: 复习：bună、mulțumesc、la revedere、da、Ana、Mihai
    gloss: 你好 · 谢谢 · 再见 · 是 · 人名：Ana、Mihai
    note: 这些都在前面的单元学过——这里安娜问米哈伊一天的安排。
  ro.a1.unit10.lesson03.teach.ma_culc_vocab:
    title: 我去睡觉
    gloss: 我睡觉
    note: 又一个反身动词，和 *mă trezesc* 的规律相同——字面意思是“我把自己放下”。
    example_gloss:
    - 我夜里睡觉。
  ro.a1.unit10.lesson03.teach.ma_culc_phrase:
    title: 我夜里睡觉
    gloss: 我夜里睡觉。
    note: 一天的自然结束，与以 *mă trezesc dimineața* 开始的日常相呼应。
  ro.a1.unit10.lesson03.teach.line01:
    title: 打招呼并询问课几点开始
    gloss: 安娜向米哈伊问好，并问他的课什么时候开始。
    note: 重复第4单元中关于米哈伊课程的问题。
  ro.a1.unit10.lesson03.teach.line02:
    title: 回答上课时间
    gloss: 米哈伊说他的课在早上九点开始。
    note: 和米哈伊在第4单元给出的回答完全一样，这里作为他更完整的日常安排的一部分再次出现。
  ro.a1.unit10.lesson03.teach.line03:
    title: 询问晚上的安排
    gloss: 安娜简短地追问：“那晚上呢？”
    note: 不用新的疑问词，就能自然地简短追问更多日常安排。
  ro.a1.unit10.lesson03.teach.line04:
    title: 描述一天的其余时间
    gloss: 米哈伊说他晚上工作，然后夜里睡觉。
    note: 把本单元的 *lucrez* 和 *mă culc* 用 *apoi* 连接起来——也与第4单元已确定的米哈伊晚上工作这一事实一致。
  ro.a1.unit10.lesson03.teach.line05:
    title: 道谢并结束
    gloss: 安娜说“好！”，感谢米哈伊，并道别。
    note: 和第1、第8、第9单元对话中用的结束语谢意相同。
  ro.a1.unit10.lesson03.teach.line06:
    title: 结束交谈
    gloss: 米哈伊也道别，并称呼安娜的名字。
    note: 和之前每个单元对话结尾一样的友好告别方式。
