course:
  title: 罗马尼亚语入门 A1
  description: 学会用罗马尼亚语问时间、说时间:整点、半点、一刻、差一刻,以及一天中的各个时段,还有如何询问某事几点开始。Ana 和 Mihai 将继续商量他们的罗马尼亚语课几点开始。
units:
  ro.a1.unit04.time:
    title: 表达时间
lessons:
  ro.a1.unit04.lesson01.ora_fixa_si_jumatate:
    title: 整点与半点
  ro.a1.unit04.lesson02.sferturi_si_intrebari:
    title: 一刻,以及怎样问时间
  ro.a1.unit04.lesson03.cand_incepe_cursul:
    title: 课几点开始?
teaching:
  ro.a1.unit04.lesson01.teach.este:
    title: 回顾:este
    gloss: 是
    note: '*Este* 在第2单元和第3单元里已经出现过。无论是说数字、星期、日期,还是现在说时间,它都是同一个词,形式不变。'
  ro.a1.unit04.lesson01.teach.ora:
    title: 钟点
    gloss: 钟点;小时
    note: 阴性名词。说钟点时,把 *ora* 直接放在数字前面,例如 *ora unu*(一点钟)。
    example_gloss: 现在是1点。
  ro.a1.unit04.lesson01.teach.ora_unu:
    title: 一点钟
    gloss: 一点钟
    note: 字面意思是“钟点一”——先说 ora,再说数字。
  ro.a1.unit04.lesson01.teach.ora_doua:
    title: 两点整
    gloss: 两点钟
    note: 这里数字要用阴性形式 *două*,与阴性名词 *ora* 保持一致——完整规律见下一张卡片。
  ro.a1.unit04.lesson01.teach.ora_gender_note:
    title: 真正的不规则:unu 保持 unu
    gloss: ora unu(不说 "ora una")/ ora două(不说 "ora doi")
    note: 有阴性形式的数字,和阴性名词连用时通常要用阴性形式(*doi* → *două*,如 *ora*),但说时间时 *unu* 是唯一的例外——尽管 *ora* 是阴性,也始终说 *ora unu*,绝不说 *ora una*。
  ro.a1.unit04.lesson01.teach.ora_trei:
    title: 三点整
    gloss: 三点钟
    note: Trei 完全没有阴阳性的形式变化,不像 unu/una 或 doi/două——又少了一件要记的事。
  ro.a1.unit04.lesson01.teach.jumatate:
    title: 一半
    gloss: 一半
    note: 与 și(和)连用,表示“……点半”:X și jumătate。
    example_gloss: 一点半。
  ro.a1.unit04.lesson01.teach.ora_unu_jumatate:
    title: 一点半
    gloss: 现在一点半。
    note: 字面意思是“一点加半”,很直接,不像有些语言用“离下一个整点还差半小时”的说法。
  ro.a1.unit04.lesson01.teach.cat_e_ora:
    title: 询问时间
    gloss: 现在几点？
    note: 日常询问时间的说法——cât(多少,和第2单元的 câți 是同类词)+ este + ora(钟点)。
  ro.a1.unit04.lesson02.teach.sfert:
    title: 一刻钟
    gloss: 一刻钟
    note: 一小时的四分之一——15分钟。与 și(和)或 fără(没有)连用,表示“过一刻”或“差一刻”。
    example_gloss: 现在一点一刻。
  ro.a1.unit04.lesson02.teach.sfert_rule:
    title: 带“一刻”或“半”时的 și 与 fără
    gloss: și un sfert = 加15分钟 · fără un sfert = 减15分钟
    note: '*Și*(和)是在刚过去的整点上加分钟;*fără*(没有)是从即将到来的整点往回数分钟——就像汉语里“一点一刻”与“差一刻三点”的区别。'
  ro.a1.unit04.lesson02.teach.ora_doua_sfert:
    title: 两点一刻
    gloss: 现在两点一刻。
    note: Ora două(2:00)加上 și un sfert(+15分钟)就是 2:15。
  ro.a1.unit04.lesson02.teach.fara:
    title: 没有 / 差
    gloss: 没有;差
    note: 从下一个整点往回数分钟,作用类似汉语“差一刻三点”里的“差”。
    example_gloss: 现在差一刻三点。
  ro.a1.unit04.lesson02.teach.ora_trei_fara_sfert:
    title: 差一刻三点
    gloss: 现在差一刻三点。
    note: Ora trei(3:00)减去 fără un sfert(−15分钟)就是 2:45——罗马尼亚语以即将到来的整点来表达,而不是以刚过去的整点。
  ro.a1.unit04.lesson02.teach.la_ce_ora:
    title: 询问几点
    gloss: 几点?
    note: La(在)+ ce(什么)+ oră(钟点,这里用不定形式,而不是 ora)——询问某事何时发生的日常说法。
  ro.a1.unit04.lesson02.teach.la_ora_noua:
    title: 说明某事何时发生
    gloss: 在九点。
    note: La(在)+ ora(钟点,这里用定形式)+ 数字——回答 “La ce oră?” 的句式。
  ro.a1.unit04.lesson02.teach.tarziu:
    title: 迟到；晚点
    gloss: 晚;迟
    note: 看时间时常用、很实用的感叹词。
    example_gloss: 太晚了!
  ro.a1.unit04.lesson03.teach.cand:
    title: 回顾:când
    gloss: 什么时候?
    note: Când 在第3单元里已经出现过,用来询问活动的时间——这里再次出现,用来询问某事何时开始。
  ro.a1.unit04.lesson03.teach.zi_parts:
    title: 一天中的时段
    gloss: 早上 / 下午 / 晚上 / 夜里
    note: 这些词都是名词的定形式,直接作状语用——汉语说“早上”“晚上”不需要介词,罗马尼亚语也一样,不必另加介词。
    example_gloss:
    - 课在早上。
    - 课在下午。
    - Mihai 晚上工作。
    - Ana 夜里睡觉。
  ro.a1.unit04.lesson03.teach.cursul:
    title: 课程
    gloss: 这门课;课程
    note: curs(课,课程)的定形式——这里指 Ana 和 Mihai 的罗马尼亚语课。
    example_gloss: 课程九点开始。
  ro.a1.unit04.lesson03.teach.incepe:
    title: 开始
    gloss: 开始
    note: 现在时的第三人称单数形式——主语是单数且不是“我”或“你”时都用它,例如 cursul(这门课)。
    example_gloss: 课在早上开始。
  ro.a1.unit04.lesson03.teach.cand_incepe_cursul:
    title: 询问课几点开始
    gloss: 课几点开始?
    note: 把 când 与本课新学的 începe 和 cursul 组合在一起。
  ro.a1.unit04.lesson03.teach.raspuns_curs:
    title: 说明课几点开始
    gloss: 课在早上九点开始。
    note: 在句末用逗号隔开,加上表示时段的状语(dimineața),就像第3单元在星期后面加日期一样。
  ro.a1.unit04.lesson03.teach.line01:
    title: 询问课几点开始
    gloss: Ana 问 Mihai 课什么时候开始。
    note: 这是一个平实、不带语体色彩的问句——este 和 începe 不会因 tu 或 dumneavoastră 而变化。
  ro.a1.unit04.lesson03.teach.line02:
    title: 说明时间
    gloss: Mihai 说课在早上九点开始。
    note: Mihai 用的正是本课所学的“钟点加时段”句式。
  ro.a1.unit04.lesson03.teach.line03:
    title: 表示回应并结束对话
    gloss: Ana 向他道谢并道别。
    note: 第1单元学过的 La revedere,依旧用来结束这段对话。
  ro.a1.unit04.lesson03.teach.line04:
    title: 结束这次交谈
    gloss: Mihai 也向 Ana 道别,并叫了她的名字。
    note: 回应 la revedere 时加上对方的名字,是一种自然又友好的收尾方式。
