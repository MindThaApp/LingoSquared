course:
  title: 罗马尼亚语入门 A1
  description: 罗马尼亚语入门：描述一个人的基本外貌，包括身高和年龄印象、头发和眼睛的颜色、核心问句 Cum arată ...?，以及比较两个人的外貌。
units:
  ro.a1.unit31.aspect:
    title: 描述外貌
lessons:
  ro.a1.unit31.lesson01.inalt_scund_batran_si:
    title: 高、矮、年老和年轻
  ro.a1.unit31.lesson02.descrierea_parului:
    title: 描述头发
  ro.a1.unit31.lesson03.ochii_si_cum_arata:
    title: 眼睛和询问某人的外貌
  ro.a1.unit31.lesson04.ana_o_descrie_pe:
    title: 安娜描述尼娜
  ro.a1.unit31.lesson05.ii_comparam_pe_andrei:
    title: 比较安德烈和埃莱娜
  ro.a1.unit31.lesson06.mihai_o_recunoaste_pe:
    title: 米哈伊认出尼娜
teaching:
  ro.a1.unit31.lesson01.teach.inalt_scund:
    title: 高和矮
    gloss: 高的／矮的
    note: '*Înalt* 形容个子高的人，*scund* 形容个子矮的人。两者都有阴性形式：*înaltă*、*scundă*。'
    example_gloss:
    - 埃莱娜个子高。
    - 安德烈个子矮。
  ro.a1.unit31.lesson01.teach.batran_tanar:
    title: 年老和年轻
    gloss: 年老的／年轻的
    note: '*Bătrân* 和 *tânăr* 在这里表示对年龄的大致印象，而不是确切的岁数。阴性形式：*bătrână*、*tânără*。'
    example_gloss:
    - 爷爷年纪大了。
    - 米哈伊很年轻。
  ro.a1.unit31.lesson01.teach.pentru_varsta_exacta:
    title: Bătrân：印象还是数字
    gloss: 想问确切的年龄，要说 Câți ani ai?；而 bătrân 表示大致的印象，如 Bunicul este bătrân。
    note: 问确切的年龄可以说 *Câți ani ai?*。这里的 *bătrân* 描述的是一个人看起来有多老，不涉及具体数字。
  ro.a1.unit31.lesson01.teach.elena_este_inalta:
    title: 埃莱娜个子高，安德烈个子矮
    gloss: 埃莱娜个子高，安德烈个子矮。
    note: 用 *și*（和）连接的简单复合句，为第5课的直接比较做铺垫；形容词要与主语一致：埃莱娜用 *înaltă*，安德烈用 *scund*。
  ro.a1.unit31.lesson02.teach.parul:
    title: 头发
    gloss: 头发
    note: '*Păr* 是阳性名词，冠词加在词尾：*părul*（那头发）。'
    example_gloss: 米哈伊有一头黑色的短发。
  ro.a1.unit31.lesson02.teach.blond_maro_carunt:
    title: 金色、棕色和灰白色
    gloss: 金色的／棕色的／灰白的
    note: 三种发色。它们放在名词 *păr*（阳性）之后，所以说 *părul blond*、*păr maro*、*păr cărunt*。
    example_gloss:
    - 安娜有一头金发。
    - 安德烈有一头棕色的头发。
    - 爷爷头发灰白。
  ro.a1.unit31.lesson02.teach.lung_scurt:
    title: 长和短（头发）
    gloss: 长的／短的（头发）
    note: '*Lung*（长）和 *scurt*（短）描述头发的长度；和颜色一样，它们放在名词之后。'
    example_gloss:
    - 埃莱娜有一头长发。
    - 安德烈留着短发。
  ro.a1.unit31.lesson02.teach.adjectivul_vine_dupa:
    title: 形容词放在名词后面
    gloss: 形容词放在名词之后：păr scurt、păr lung、păr blond、păr maro、păr cărunt、păr negru。
    note: 在罗马尼亚语中，形容词放在名词之后（*păr scurt*），而汉语的形容词通常放在名词之前（“短发”）。
  ro.a1.unit31.lesson02.teach.posesivul_vine_dupa:
    title: “他的”和“她的”放在名词之后
    gloss: 物主词放在名词之后：părul ei（她的头发）、ochii lui（他的眼睛）。
    note: '*Ei* 表示“她的”，*lui* 表示“他的”；两者都放在名词之后：*părul ei*。指的是谁，要看上下文。'
  ro.a1.unit31.lesson02.teach.mihai_are_parul:
    title: 米哈伊有一头黑色的短发
    gloss: 米哈伊有一头黑色的短发。
    note: '*Negru*（黑色）是颜色形容词，放在名词之后：*păr negru*。'
  ro.a1.unit31.lesson02.teach.ana_are_parul:
    title: 安娜有一头金色的长发
    gloss: 安娜有一头金色的长发。
    note: 这个自然的句子结合了本课表示头发长度和颜色的词汇。
  ro.a1.unit31.lesson03.teach.ochii:
    title: 眼睛
    gloss: 眼睛
    note: '*Ochi*（眼睛）的单数和复数形式相同，靠冠词区分数：*ochiul*（那只眼睛）、*ochii*（那些眼睛）。'
    example_gloss: 米哈伊有棕色的眼睛。
  ro.a1.unit31.lesson03.teach.albastru_maro_verde:
    title: 蓝色、棕色和绿色
    gloss: 蓝色的／棕色的／绿色的
    note: '*Albastru*（蓝色）、*maro*（棕色）和 *verde*（绿色）是颜色形容词。*Maro* 永远不变；复数时 *albastru* 变成 *albaștri*，*verde* 变成 *verzi*。'
    example_gloss:
    - 安娜有蓝色的眼睛。
    - 安德烈有棕色的眼睛。
    - 埃莱娜有绿色的眼睛。
  ro.a1.unit31.lesson03.teach.la_plural_adjectivul:
    title: 形容词的复数
    gloss: 复数时形容词要变形：ochi albaștri、ochi maro、ochi verzi。
    note: 与复数的 *ochi* 搭配时，形容词用复数形式（*albaștri*、*verzi*）；*maro* 不变。对比单数的 *păr albastru*。
  ro.a1.unit31.lesson03.teach.cum_arata_ana:
    title: 安娜长什么样？
    gloss: 安娜长什么样？
    note: '*Cum arată ...?* 是本单元的核心问句；可以用它来询问任何人的外貌。'
  ro.a1.unit31.lesson03.teach.ana_are_parul:
    title: 安娜有一头金色的长发和蓝色的眼睛
    gloss: 安娜有一头金色的长发和蓝色的眼睛。
    note: 用 *și* 把头发和眼睛合在一句话里的示范回答。
  ro.a1.unit31.lesson04.teach.ana_vine_o:
    title: 安娜介绍尼娜
    gloss: 安娜：语言咖啡馆要来一个新女孩，她叫尼娜。
    note: '*Vine o fată nouă*（“来了一个新女孩”）用来引入一个新人；*O cheamă Nina* 说出她的名字。'
  ro.a1.unit31.lesson04.teach.mihai_bine_cum:
    title: 米哈伊问她长什么样
    gloss: 米哈伊：好！她长什么样？
    note: 不带名字，再次使用本单元的核心问句：*Cum arată?*（根据上下文就知道指的是谁）。
  ro.a1.unit31.lesson04.teach.ana_este_scunda:
    title: 安娜描述尼娜的身高和头发
    gloss: 安娜：她个子矮，留着金色的短发。
    note: 把第1课的 *scundă* 和第2课的头发词汇结合在一起。
  ro.a1.unit31.lesson04.teach.mihai_si_ochii:
    title: 米哈伊问她的眼睛
    gloss: 米哈伊：那眼睛呢？
    note: '*Și ochii?*（“那眼睛呢？”）是一个简短的追问；指的是谁，根据上下文就能明白。'
  ro.a1.unit31.lesson04.teach.ana_are_ochi:
    title: 安娜描述尼娜的眼睛
    gloss: 安娜：她有绿色的眼睛。
    note: 再次使用第3课的 *ochi verzi*。
  ro.a1.unit31.lesson04.teach.mihai_multumesc_atunci:
    title: 米哈伊会认出她
    gloss: 米哈伊：谢谢！那我一定能认出她。
    note: '*O recunosc* 的意思是“我会认出她”：*o* 是宾语代词“她”，放在动词之前。'
  ro.a1.unit31.lesson05.teach.andrei_si_elena:
    title: 比较安德烈和埃莱娜
    gloss: 安德烈和埃莱娜是兄妹，但他们长得不一样。安德烈个子矮，留着棕色的短发，眼睛是棕色的。埃莱娜比安德烈高，留着棕色的长发，眼睛是绿色的。你长什么样？
    note: 这段简短的比较复习了目前学过的所有颜色和长度词，最后用本单元的核心问题询问你的外貌。
    glosses:
      frate: 兄弟
      soră: 姐妹
      arată: 看起来
      diferit: 不同的
      scund: 矮的
      scurt: 矮的
      maro: 棕色的
      părul: 头发
      ochi: 眼睛
      înaltă: 更高的
      lung: 长的
      verzi: 绿色的
      arăți: 看起来（如“长什么样”）
  ro.a1.unit31.lesson05.teach.comparativul_se_formeaza:
    title: 用 mai ... decât 做比较
    gloss: 比较级由 mai + 形容词 + decât 构成：Elena este mai înaltă decât Andrei。
    note: 罗马尼亚语把 *mai*（“更”）放在形容词之前，把 *decât*（“比”）放在第二个人之前：*mai înaltă decât Andrei*。
  ro.a1.unit31.lesson05.teach.elena_are_parul:
    title: 埃莱娜的头发比安德烈的长
    gloss: 埃莱娜的头发比安德烈的长。
    note: '*Mai lung* 在 *decât* 之前用法相同：*părul mai lung decât Andrei*；形容词仍然跟在 *părul* 之后。'
  ro.a1.unit31.lesson05.teach.am_parul_scurt:
    title: 我留着棕色短发
    gloss: 我留着棕色短发。
    note: 一个以 *Am ...* 开头的第一人称示范句，描述自己的外貌时可以直接套用。
  ro.a1.unit31.lesson06.teach.mihai_uite_ea:
    title: 米哈伊发现了尼娜
    gloss: 米哈伊：看，那是尼娜吗？她留着金色的短发，眼睛是绿色的。
    note: '*Uite*（看）用来引起别人注意；*ea e Nina?* 问的是“那是尼娜吗？”。'
  ro.a1.unit31.lesson06.teach.ana_da_ea:
    title: 安娜确认
    gloss: 安娜：是的，那就是尼娜！
    note: 这是一个简短自然的肯定回答。
  ro.a1.unit31.lesson06.teach.nina_salut_tu:
    title: 尼娜向米哈伊问好
    gloss: 尼娜：嗨，你是米哈伊吗？
    note: 一个简单的非正式问候问句：*tu ești ...?*
  ro.a1.unit31.lesson06.teach.mihai_da_ma:
    title: 米哈伊回应尼娜的问候
    gloss: 米哈伊：是的！很高兴认识你，尼娜。
    note: '*Mă bucur să te cunosc*（“我很高兴认识你”）是初次见面时的标准说法。'
  ro.a1.unit31.lesson06.teach.nina_si_eu:
    title: Nina 回应问候
    gloss: Nina：我也很高兴认识你！
    note: 对话到此结束——米哈伊根据安娜之前的描述成功认出了尼娜。
