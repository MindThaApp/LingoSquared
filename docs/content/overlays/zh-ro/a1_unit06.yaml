answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit's "Vă rog" (formal, sourced) and "Te rog" (informal, freshly authored) are register-sensitive parallels, matching 第2单元's ai/aveți and 第5单元's ai frați/aveți frați pattern -- accept either register for a general "please" unless an exercise explicitly names one. Ana and Mihai's closing café dialogue keeps their existing polite register with each other (both use "vă rog," not "te rog").
course:
  title: 罗马尼亚语入门 A1
  description: 学习用罗马尼亚语点餐和点饮料——咖啡、茶、面包等等，掌握核心点餐句型 “Aș dori ...”（我想要……）以及 vă rog/te rog 这一组礼貌用语——继续跟随 Ana 和 Mihai 在咖啡馆见面。
units:
  ro.a1.unit06.food:
    title: 食物和饮料
lessons:
  ro.a1.unit06.lesson01.bauturi:
    title: 饮料
  ro.a1.unit06.lesson02.va_rog_si_mancare:
    title: 请，以及食物
  ro.a1.unit06.lesson03.la_cafenea:
    title: 在咖啡馆
teaching:
  ro.a1.unit06.lesson01.teach.reminder_un_o_si:
    title: 复习：un, o, și
    gloss: 一个 · 和
    note: 这三个词前面的单元都出现过（*și* 在第1单元，*o* 在第2单元，*un* 在第4单元）——这里它们再次出现，用来谈论食物和饮料。
  ro.a1.unit06.lesson01.teach.as_dori:
    title: 我想要……
    gloss: 我想要……
    note: 罗马尼亚语中点东西时最常用的礼貌说法——是固定的条件式，不随后面的词而变化。
  ro.a1.unit06.lesson01.teach.apa:
    title: 水
    gloss: 水
    note: 阴性名词——不specify数量时不加冠词，和汉语说“水”一样。
    example_gloss: 我想要水。
  ro.a1.unit06.lesson01.teach.cafea:
    title: 咖啡
    gloss: 咖啡
    note: 阴性名词——和其他阴性名词一样，与 *o*（“一个”）搭配。
    example_gloss: 我想要一杯咖啡。
  ro.a1.unit06.lesson01.teach.ceai:
    title: 茶
    gloss: 茶
    note: 与 *un*（“一个”）搭配，而不是 *o*——ceai 是阳性或中性名词。
    example_gloss: 我想要一杯茶。
  ro.a1.unit06.lesson01.teach.suc:
    title: 果汁
    gloss: 果汁
    note: 同样搭配 *un*，规律和 ceai 一样。
    example_gloss: 我想要一杯果汁。
  ro.a1.unit06.lesson01.teach.lapte:
    title: 牛奶
    gloss: 牛奶
    note: 和 apă 一样，数量不明确时通常不加冠词。
    example_gloss: 我想要牛奶。
  ro.a1.unit06.lesson01.teach.mi_e_sete:
    title: 我口渴
    gloss: 我口渴
    note: 固定习语——字面意思更接近“对我来说是渴”，而不是逐字的“我渴”。
  ro.a1.unit06.lesson01.teach.as_dori_o_cafea:
    title: 我想要一杯咖啡
    gloss: 我想要一杯咖啡。
    note: 把点餐句型和一个阴性饮料名词合成一个完整的句子。
  ro.a1.unit06.lesson02.teach.reminder_multumesc_bine_da_nu:
    title: 复习：mulțumesc, bine, da, nu
    gloss: 谢谢 · 好 · 是 · 不
    note: '*Mulțumesc* 和 *bine* 最早出现在第1单元的问候语中，*da* 和 *nu* 出现在第3、第5单元——这里它们再次出现，围绕食物和礼貌用语。'
  ro.a1.unit06.lesson02.teach.mi_e_foame:
    title: 我饿了
    gloss: 我饿了
    note: 与 *Mi-e sete* 是同一种固定习语结构，只是把 sete（口渴）换成 foame（饥饿）。
  ro.a1.unit06.lesson02.teach.paine:
    title: 面包
    gloss: 面包
    note: 通常不加冠词，和汉语说“面包”一样。
    example_gloss: 我饿了。我想要面包。
  ro.a1.unit06.lesson02.teach.mancare:
    title: 食物
    gloss: 食物
    note: 表示“食物”的通用词，不是指某一道具体的菜。
    example_gloss: 我想要食物。
  ro.a1.unit06.lesson02.teach.carne:
    title: 肉
    gloss: 肉
    note: 表示“肉”的通用词——具体种类（carne de vită、carne de porc）在它后面加上类别。
    example_gloss: 我想要肉。
  ro.a1.unit06.lesson02.teach.pui:
    title: 鸡肉
    gloss: 鸡肉
    note: 专指（作为食物的）鸡肉，区别于通用的 carne。
    example_gloss: 我想要鸡肉。
  ro.a1.unit06.lesson02.teach.fructe:
    title: 水果
    gloss: 水果
    note: 日常使用的复数形式，用来泛指“水果”这一类。
    example_gloss: 我想要水果。
  ro.a1.unit06.lesson02.teach.va_rog:
    title: 请（敬称）
    gloss: 请（敬称）
    note: 礼貌的“请”——与第1、第2单元已学的 dumneavoastră 敬称相配。
    example_gloss: 请来一杯咖啡。
  ro.a1.unit06.lesson02.teach.te_rog:
    title: 请（非正式）
    gloss: 请（非正式）
    note: 日常用语，用于朋友以及你用 *tu* 称呼的人——与第1单元的 tu 用法相配。
    example_gloss: 请给我一杯茶。
  ro.a1.unit06.lesson03.teach.reminder_buna_ziua_bine_la_revedere:
    title: 复习：bună, ziua, bine, la revedere, Ana, Mihai
    gloss: 你好 · 好 · 再见 · 两个人名
    note: 这些都已在第1单元和第5单元的对话中出现过——这里 Ana 和 Mihai 再次见面，这次是在咖啡馆。
  ro.a1.unit06.lesson03.teach.line01:
    title: 打招呼并说自己饿了
    gloss: Ana 向 Mihai 问好，并说她饿了。
    note: 在问候中直接用到本单元的 *Mi-e foame*。
  ro.a1.unit06.lesson03.teach.line02:
    title: 点餐
    gloss: Mihai 说他想要面包和鸡肉。
    note: 把本单元的 pâine/pui 与 Aș dori 句型结合起来。
  ro.a1.unit06.lesson03.teach.line03:
    title: 礼貌地点饮料
    gloss: Ana 说她想要一杯咖啡，麻烦了。
    note: 把 Aș dori、cafea 和 vă rog 结合在一起——这是本单元分别学过的三个内容。
  ro.a1.unit06.lesson03.teach.line04:
    title: 也点一杯饮料
    gloss: Mihai 说他想要一杯茶，麻烦了。
    note: 句型与 Ana 的那句相同，只是把 cafea 换成 ceai。
  ro.a1.unit06.lesson03.teach.line05:
    title: 道谢并结束
    gloss: Ana 感谢 Mihai 并道别。
    note: 这里的 *Mulțumesc* 只是结束时简单的道谢，与第1单元 *Bine, mulțumesc.* 中的是同一个词。
  ro.a1.unit06.lesson03.teach.line06:
    title: 结束这次见面
    gloss: Mihai 也道别，并叫了 Ana 的名字。
    note: 与第1单元和第5单元对话的结尾一样，是同样友好的告别方式。
