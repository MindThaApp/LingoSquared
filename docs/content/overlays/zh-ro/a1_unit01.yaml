answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț, with comma-below ș/ț). Typed answers are checked with their diacritics: a spelling without them, or with the older cedilla letters ş/ţ, is accepted only where an exercise lists it explicitly.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the exclamation mark on greetings/farewells. Spoken answers are assessed for intelligibility and appropriate register, not written punctuation.
  register: tu and dumneavoastră are never interchangeable answers for each other's exercises -- a dumneavoastră-register prompt must not accept a tu-conjugated reply and vice versa, the same discipline applied to French tu/vous and Spanish tú/usted elsewhere in this app.
course:
  title: 罗马尼亚语入门 A1
  description: 学习标准的罗马尼亚语问候和初次见面的自我介绍。重点讲解现阶段最需要掌握的对比：非正式的 tu 与礼貌的 dumneavoastră，以及罗马尼亚语中两种常用的报名字说法（mă numesc.../mă cheamă...）。
units:
  ro.a1.unit01.greetings:
    title: 问候与初次见面
lessons:
  ro.a1.unit01.lesson01.tu_dumneavoastra_greetings:
    title: 问候：tu 与 dumneavoastră
  ro.a1.unit01.lesson02.names_introductions:
    title: 你叫什么名字？
  ro.a1.unit01.lesson03.street_meeting:
    title: 街上的相遇
teaching:
  ro.a1.unit01.lesson01.teach.buna:
    title: 日常问候
    gloss: 你好；嗨
    note: Bună 是日常、稍随意的问候语，对朋友、同龄人和大多数白天的随意场合都很稳妥。
    example_gloss: 嗨，Mihai！
  ro.a1.unit01.lesson01.teach.salut:
    title: 非正式问候语
    gloss: 嗨；再见
    note: Salut 比较随意，用于朋友和同龄人之间，见面和道别时都可以说，但对不熟悉的成年人来说不是最稳妥的首选。
    example_gloss: 嗨，Ana！
  ro.a1.unit01.lesson01.teach.buna_ziua:
    title: 正式问候
    gloss: 您好（正式）
    note: Bună ziua 是对不熟悉的成年人、店员或任何你用 dumneavoastră 称呼的人使用的稳妥、礼貌的问候语。字面意思是“美好的一天”，但它是通用的礼貌问好，并不只限于中午。
    example_gloss: 您好，Ana！
  ro.a1.unit01.lesson01.teach.la_revedere:
    title: 通用告别语
    gloss: 再见
    note: La revedere 在礼貌和随意的场合都可以使用。
    example_gloss: 您好！再见！
  ro.a1.unit01.lesson01.teach.tu:
    title: 非正式的单数“你”
    gloss: 你(非正式单数)
    note: 汉语有“你”和“您”之分，罗马尼亚语的 tu 相当于“你”：用于称呼一位朋友、孩子或明确关系随意的人，并且有自己的动词形式（faci，而不是 faceți）。
  ro.a1.unit01.lesson01.teach.dumneavoastra:
    title: 礼貌的“您”或复数的“你们”
    gloss: 您；你们
    note: 对一位不熟悉的成年人，dumneavoastră 是稳妥的选择，也可用于礼貌地称呼一群人，作用有点像“您”。它来自 domnia voastră（阁下），动词要用复数形式（faceți、numiți），即使只指一个人也一样。
  ro.a1.unit01.lesson01.teach.ce_mai_faceti:
    title: 正式的问候语:近况
    gloss: 您好吗?
    note: Faceți 是 a face（做）对应 dumneavoastră 的形式。这是一句约定俗成的礼貌问候，并不是真的在询问对方正在做什么。
  ro.a1.unit01.lesson01.teach.ce_mai_faci:
    title: 非正式的问候语:近况
    gloss: 您好吗?
    note: Faci 是 a face 对应 tu 的形式。这个问句的礼貌和随意两种说法只有动词词尾不同，ce mai 始终不变。
  ro.a1.unit01.lesson01.teach.bine_multumesc:
    title: 标准的肯定回答
    gloss: 很好,谢谢。
    note: 无论使用哪种语体，都可以用 Bine, mulțumesc 回答 ce mai faci/faceți，回答本身不变。
    example_gloss: 你好吗？很好，谢谢。
  ro.a1.unit01.lesson01.teach.register_choice:
    title: 让问候语与关系相匹配
    gloss: Bună ziua 配 dumneavoastră；Salut 配 tu
    note: 这是实用的默认搭配，并非绝对规则。Bună ziua 也可以开启一段之后继续用 dumneavoastră 的正式对话；而把 Salut 与 dumneavoastră 搭配，通常会传递出相互矛盾的社交信号。
  ro.a1.unit01.lesson02.teach.ma_numesc:
    title: 说出你的名字（标准说法）
    gloss: 我叫 Ana。
    note: Mă numesc 字面意思是“我称自己为”，是中性的、任何场合都适用的报名字方式，语体相当于“我的名字是……”。
    example_gloss: 你好！我叫 Ana。
  ro.a1.unit01.lesson02.teach.cum_va_numiti:
    title: 礼貌地询问姓名
    gloss: 您叫什么名字?
    note: Numiți 是 a se numi（名叫）对应 dumneavoastră 的形式。Vă 是与 dumneavoastră 相配的反身代词，在这里必须使用。
  ro.a1.unit01.lesson02.teach.ma_cheama:
    title: 说出你的名字（口语说法）
    gloss: 我叫 Mihai。
    note: Mă cheamă 是更口语化的报名字方式，字面意思是“叫我”。Mă numesc 和 mă cheamă 都正确也都常用，mă cheamă 稍微随意一些。
    example_gloss: 你好！我叫 Mihai。
  ro.a1.unit01.lesson02.teach.cum_te_cheama:
    title: 非正式地询问姓名
    gloss: 你叫什么名字？
    note: Te 是与 tu 相配的反身代词。这是朋友和同辈之间询问对方姓名的日常说法。
  ro.a1.unit01.lesson02.teach.imi_pare_bine:
    title: 认识某人
    gloss: 很高兴认识你！
    note: Îmi pare bine 字面意思是“对我来说似乎很好”，是一个固定的习惯表达，不能逐字对应。它不会因说话人的性别而改变形式。
    example_gloss: 我叫 Mihai。很高兴认识你！
  ro.a1.unit01.lesson02.teach.si_mie_imi_pare_bine:
    title: 回应同样的心情
    gloss: 我也很高兴认识你！
    note: Și mie 加在开场时用过的同一个固定表达前面，表示“也”“同样”。
  ro.a1.unit01.lesson02.teach.si_dumneavoastra:
    title: 礼貌地反问
    gloss: 您呢?
    note: 用 dumneavoastră 来保持礼貌语体，或称呼多人。
  ro.a1.unit01.lesson02.teach.si_tu:
    title: 随意地反问
    gloss: 您呢?
    note: 随意地对一位朋友或同龄人说话时，在 și 后面用 tu。
  ro.a1.unit01.lesson03.teach.line01:
    title: 开始见面的对话
    gloss: Ana 正式地向 Mihai 问好并说出自己的名字。
    note: Ana 以礼貌的 bună ziua 开场，适合与不认识的人初次见面。
  ro.a1.unit01.lesson03.teach.line02:
    title: 开始见面的对话：回答
    gloss: Mihai 表示同样高兴，说出自己的名字，并问她好不好。
    note: Mihai 保持了 Ana 开头时的礼貌语体：他问的是 ce mai faceți，而不是 ce mai faci。
  ro.a1.unit01.lesson03.teach.line03:
    title: 回答并反问
    gloss: Ana 说她很好，并礼貌地用同样的问题反问 Mihai。
    note: Și dumneavoastră 让对话保持正式，与开头的语体一致。
  ro.a1.unit01.lesson03.teach.line04:
    title: 回答并告别
    gloss: Mihai 说他也很好，然后道别。
    note: La revedere 是中性的告别语，无论对话正式与否都适用。
  ro.a1.unit01.lesson03.teach.line05:
    title: 结束这次相遇
    gloss: Ana 以同样的话回应道别。
    note: 把 la revedere 回说给对方，是友好地结束对话的自然方式。
exercises:
  ro.a1.unit01.lesson01.exercise01.listen_buna:
    instruction: 听音频,选择你听到的短语。
    correct_option: Bună!
    distractors:
    - Salut!
    - La revedere!
    accepted_answers:
    - Bună!
    - Bună
  ro.a1.unit01.lesson01.exercise02.choose_informal_pronoun:
    instruction: 哪个人称代词与这句非正式问候语搭配？
    correct_option: tu
    distractors:
    - dumneavoastră
    accepted_answers:
    - tu
    feedback: Salut 和 tu 搭配起来，语体一致，都是非正式的。
  ro.a1.unit01.lesson01.exercise04.order_polite_question:
    instruction: 把这句礼貌地询问近况的话排成正确顺序。
    correct_response:
    - Ce
    - mai
    - faceți
  ro.a1.unit01.lesson01.exercise06.match_register:
    instruction: 把每个问候语与初学者常用的语体配对。
    correct_response:
      Bună ziua: dumneavoastră
      Salut: 你（非正式）
    pairs:
    - left: Bună ziua
      right: dumneavoastră
    - left: Salut
      right: 你（非正式）
  ro.a1.unit01.lesson01.exercise03.choose_polite_pronoun:
    instruction: 为一位不熟悉的成年人补全问候语。
    accepted_answers:
    - dumneavoastră
    feedback: 对不熟悉的成年人，dumneavoastră 是稳妥而恭敬的选择。
  ro.a1.unit01.lesson01.exercise05.listen_informal_question:
    instruction: 输入你听到的非正式问句。
    accepted_answers:
    - Ce mai faci?
    - Ce mai faci
  ro.a1.unit01.lesson01.exercise07.complete_farewell:
    instruction: 补全中性的告别语。
    accepted_answers:
    - revedere
  ro.a1.unit01.lesson01.exercise08.speak_greeting:
    instruction: 用礼貌的问候语，询问对方近况，并结束对话。
    accepted_answers:
    - Bună ziua. Ce mai faceți? La revedere.
    - Bună ziua, ce mai faceți? La revedere.
  ro.a1.unit01.lesson02.exercise02.listen_name_question:
    instruction: 听音频，选出礼貌的询问姓名的问句。
    correct_option: Cum vă numiți?
    distractors:
    - Cum te cheamă?
    - Ce mai faceți?
    accepted_answers:
    - Cum vă numiți?
    - Cum va numiti?
  ro.a1.unit01.lesson02.exercise05.choose_reply_meaning:
    instruction: Mihai 的回应是什么意思？
    correct_option: 很高兴认识你！
    distractors:
    - 再见！
    - 您好吗?
    accepted_answers:
    - 很高兴认识你！
  ro.a1.unit01.lesson02.exercise01.order_self_intro:
    instruction: 组成 Ana 的自我介绍。
    correct_response:
    - Mă
    - numesc
    - Ana
  ro.a1.unit01.lesson02.exercise07.match_introductions:
    instruction: 把每个询问名字的问句与相应的回答配对。
    correct_response:
      Cum vă numiți?: Mă numesc Ana.
      Cum te cheamă?: Mă cheamă Mihai.
    pairs:
    - left: Cum vă numiți?
      right: Mă numesc Ana.
    - left: Cum te cheamă?
      right: Mă cheamă Mihai.
  ro.a1.unit01.lesson02.exercise03.informal_name_question:
    instruction: 在非正式的问候之后，询问对方的名字。
    accepted_answers:
    - Cum te cheamă?
    - Cum te cheama?
  ro.a1.unit01.lesson02.exercise04.complete_ma_cheama:
    instruction: 补全说出 Mihai 名字的短语。
    accepted_answers:
    - Mă
  ro.a1.unit01.lesson02.exercise06.return_polite_question:
    instruction: 保持礼貌的语体，把问题回问对方。
    accepted_answers:
    - Și dumneavoastră?
    - Si dumneavoastra?
  ro.a1.unit01.lesson02.exercise08.write_introduction:
    instruction: 你是 Ana。请写：用 Bună 问好，用 mă numesc 说出名字，再说“很高兴认识你”。
    accepted_answers:
    - Bună. Mă numesc Ana. Îmi pare bine.
    - Buna. Ma numesc Ana. Imi pare bine.
  ro.a1.unit01.lesson03.exercise01.role_selection:
    instruction: 在对话中，哪位说话者用这个短语说出了自己的名字？
    correct_option: Ana
    distractors:
    - Mihai
    - 两位说话者都没有
    accepted_answers:
    - Ana
  ro.a1.unit01.lesson03.exercise02.comprehend_register:
    instruction: Ana 和 Mihai 彼此使用哪个代词？
    correct_option: dumneavoastră
    distractors:
    - 你（非正式）
    - te
    accepted_answers:
    - dumneavoastră
  ro.a1.unit01.lesson03.exercise03.comprehend_names:
    instruction: 哪位说话者用 mă numesc，哪位用 mă cheamă？
    correct_option: Ana uses mă numesc; Mihai uses mă cheamă.
    distractors:
    - Mihai uses mă numesc; Ana uses mă cheamă.
    - 两位说话者都用 mă numesc。
    accepted_answers:
    - Ana uses mă numesc; Mihai uses mă cheamă.
    - Ana; Mihai
  ro.a1.unit01.lesson03.exercise05.order_closing:
    instruction: 组成结束时的回答和告别语。
    correct_response:
    - Bine,
    - mulțumesc.
    - La
    - revedere!
  ro.a1.unit01.lesson03.exercise04.role_response:
    instruction: 扮演 Ana。礼貌地回答，并把问题反问回去。
    accepted_answers:
    - Bine, mulțumesc. Și dumneavoastră?
    - Bine, multumesc. Si dumneavoastra?
  ro.a1.unit01.lesson03.exercise06.speak_role:
    instruction: 扮演 Ana。正式地向 Mihai 问好，说出你的名字，回应他的问候，然后结束这次见面。
    accepted_answers:
    - Bună ziua. Mă numesc Ana. Îmi pare bine! La revedere!
    - Buna ziua. Ma numesc Ana. Imi pare bine! La revedere!
    - Bună ziua. Mă numesc Ana. Și mie îmi pare bine! La revedere!
  ro.a1.unit01.lesson01.exercise09.dictation_buna:
    instruction: 输入你听到的内容。
    correct_option: Bună
    accepted_answers:
    - value: Bună
      status: correct
    orthography_strict: true
