answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit's own new vocabulary (inginer, birou, profesoară, școală) is used only in fixed first-person forms (Mihai's own "Sunt inginer", Ana's own "Sunt profesoară"). The one new conjugated verb form, "lucrați," reuses the already-established formal -ați/-eți ending. No informal-tu form is introduced this unit; Ana and Mihai keep their existing formal register with each other.
course:
  title: 罗马尼亚语入门 A1
  description: 用罗马尼亚语说明基本的职业和工作地点——Inginer(工程师)、Profesoară(女教师)、Birou(办公室)和Școală(学校)——米哈伊和安娜正在聊各自在哪里工作。
units:
  ro.a1.unit17.work:
    title: 工作
lessons:
  ro.a1.unit17.lesson01.mihai_este_inginer:
    title: 米哈伊是工程师
  ro.a1.unit17.lesson02.ana_este_profesoara:
    title: 安娜是老师
  ro.a1.unit17.lesson03.unde_lucrati_dialog:
    title: 您在哪里工作?
teaching:
  ro.a1.unit17.lesson01.teach.reminder_este_la_mihai:
    title: 复习:este、la、Mihai
    gloss: este(是)· la(在)· Mihai(人名)
    note: Este 出自第3、4、8单元;la 出自第4单元的 *la ora nouă*(在九点钟);Mihai 是从第1单元起就出现的人物名字。本单元把这三个词再次用来谈他的工作。
  ro.a1.unit17.lesson01.teach.reminder_lucrez_lucreaza:
    title: 复习:lucrez、lucrează
    gloss: lucrez(我工作)· lucrează(他/她工作)
    note: 两个词都出自第10单元的日常安排(*Lucrez seara.*)。本单元用它们来谈职业,而不是一天中的时间。
  ro.a1.unit17.lesson01.teach.inginer_vocab:
    title: 工程师
    gloss: 工程师
    note: 阳性形式。本单元只有米哈伊用到它(*Sunt inginer*),所以暂时不需要阴性形式。
    example_gloss:
    - 米哈伊是工程师。
  ro.a1.unit17.lesson01.teach.birou_vocab:
    title: 办公室
    gloss: 办公室
    note: 米哈伊工作的地方,与第4单元已学的介词 *la*(在)搭配使用。
    example_gloss:
    - 他在办公室工作。
  ro.a1.unit17.lesson01.teach.mihai_este_inginer_lucreaza_la_birou_phrase:
    title: 米哈伊是工程师。他在办公室工作。
    gloss: 工程师
    note: 这里的每个词都已学过或刚刚学到,组合成两个关于米哈伊工作的新句子。
  ro.a1.unit17.lesson02.teach.reminder_sunt_unde_ana:
    title: 复习:sunt、unde、Ana
    gloss: sunt(我是)· unde(哪里)· Ana(人名)
    note: Sunt 出自第16单元(*Sunt bolnav*);unde 出自第7、8单元(*Unde pot să cumpăr...?*、*Unde este...?*);Ana 是从第1单元起就出现的人物名字。本单元把这三个词再次用来谈安娜的工作。
  ro.a1.unit17.lesson02.teach.profesoara_vocab:
    title: 女教师
    gloss: 女教师
    note: 阴性形式。本单元只有安娜用到它(*Sunt profesoară*),所以暂时不需要阳性形式。
    example_gloss:
    - 我是老师。
  ro.a1.unit17.lesson02.teach.scoala_vocab:
    title: 学校
    gloss: 学校
    note: 安娜工作的地方,*la* 的用法与 *la birou* 相同。
    example_gloss:
    - 我在学校工作。
  ro.a1.unit17.lesson02.teach.sunt_profesoara_lucrez_la_scoala_phrase:
    title: 我是老师。我在学校工作。
    gloss: 我是老师。我在学校工作。
    note: 安娜介绍自己的工作,把本课两个新词与第16单元已学的 *sunt* 结合起来。
  ro.a1.unit17.lesson02.teach.unde_lucrati_phrase:
    title: 您在哪里工作?
    gloss: 您在哪里工作?(敬称)
    note: '*Lucrați* 是敬称的“您工作”,词尾 -ați/-eți 与已学的 *aveți*、*faceți* 相同,可以用来向任何人询问职业。'
  ro.a1.unit17.lesson03.teach.reminder_buna_ce_mai_faceti_bine_multumesc:
    title: 复习:Bună、Ce mai faceți?、Bine, mulțumesc
    gloss: Bună(你好)· Ce mai faceți?(您好吗?敬称)· Bine, mulțumesc(很好,谢谢)
    note: 都出自第1单元开头的问候语,在这里用来开始本单元的对话。
  ro.a1.unit17.lesson03.teach.reminder_si_dumneavoastra_la_revedere:
    title: 复习:Și dumneavoastră?、La revedere
    gloss: Și dumneavoastră?(您呢?敬称)· La revedere(再见)
    note: 两者都出自第1单元,在这里作为自然的反问和结束语。
  ro.a1.unit17.lesson03.teach.line01:
    title: 问候并询问近况
    gloss: 安娜向米哈伊问好,并问他过得怎么样。
    note: 再次用到第1单元的问候语 *Ce mai faceți?*。
  ro.a1.unit17.lesson03.teach.line02:
    title: 回答并询问她在哪里工作
    gloss: 米哈伊作答,然后问安娜在哪里工作。
    note: 把第1单元的 *Bine, mulțumesc* 与本单元的 *Unde lucrați?* 结合起来。
  ro.a1.unit17.lesson03.teach.line03:
    title: 说出职业和工作地点,然后反问
    gloss: 安娜说她在学校当老师,然后向米哈伊问同样的问题。
    note: 把本单元第二课的句子与第1单元的 *Și dumneavoastră?* 结合起来。
  ro.a1.unit17.lesson03.teach.line04:
    title: 说出职业和工作地点
    gloss: 米哈伊说他在办公室工作,是工程师。
    note: 几乎原样用到本单元第一课的句子。
  ro.a1.unit17.lesson03.teach.line05:
    title: 结束对话
    gloss: 安娜道别。
    note: 此前每个单元的对话都是以这种方式结束的。
  ro.a1.unit17.lesson03.teach.line06:
    title: 道别
    gloss: 米哈伊道别。
    note: 此前每个单元的对话都是以这种方式结束的。
