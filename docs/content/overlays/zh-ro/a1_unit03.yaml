answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț, with comma-below ș/ț). Typed answers are checked with their diacritics: a spelling without them, or with the older cedilla letters ş/ţ, is accepted only where an exercise lists it explicitly, matching units 01/02''s policy.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the question mark/exclamation mark. Day and month names are correctly lowercase in standard Romanian writing (except sentence-initially); accept a learner's answer regardless of the case they happen to type it in -- this unit teaches the lowercase convention as a fact to recognize, not a hard-graded spelling rule.
  register: No new register-sensitive forms in this unit -- este (is) is invariant regardless of tu/dumneavoastră, and Ana and Mihai's closing dialogue keeps the dumneavoastră register 第1单元 already established between them.
course:
  title: 罗马尼亚语入门 A1
  description: 一周的星期、一年的月份，以及罗马尼亚语如何表达日历上的日期（普通基数词加月份，只有 1 号例外，要用特殊的词 întâi）——继续跟随 Ana 和 Mihai 安排下一次见面。
units:
  ro.a1.unit03.dates:
    title: 星期与日期
lessons:
  ro.a1.unit03.lesson01.zilele_saptamanii:
    title: 星期
  ro.a1.unit03.lesson02.lunile_si_datele:
    title: 一年的月份与日期的说法
  ro.a1.unit03.lesson03.cand_ne_intalnim:
    title: 我们什么时候再见面？
teaching:
  ro.a1.unit03.lesson01.teach.este:
    title: 回顾：este
    gloss: 是
    note: '*Este* 已在第 2 单元出现过（*Care este numărul...?*）。它没有变化——无论主语是星期、日期还是别的东西，都是同一个词，tu 和 dumneavoastră 之间也不变。'
  ro.a1.unit03.lesson01.teach.astazi_maine:
    title: 今天、明天
    gloss: astăzi（今天）／mâine（明天）
    note: 这两个都是没有变化的时间词，放在句首，用来说明是星期几或几号。
    example_gloss:
    - 今天是星期一。
    - 明天是星期二。
  ro.a1.unit03.lesson01.teach.luni_marti:
    title: 星期一、星期二
    gloss: luni（星期一）／marți（星期二）
    note: 说出星期几（Astăzi este luni）时，用这里的无冠词形式。星期名称也有带冠词的形式——lunea、marțea——意思是“每周一”“每周二”；以后会学到。
    example_gloss:
    - 今天是星期一。
    - 明天是星期二。
  ro.a1.unit03.lesson01.teach.miercuri_joi:
    title: 星期三、星期四
    gloss: miercuri（星期三）／joi（星期四）
    note: 和 luni、marți 一样，miercuri 和 joi 的单数和复数形式相同。
    example_gloss:
    - 今天是星期三。
    - 明天是星期四。
  ro.a1.unit03.lesson01.teach.vineri_sambata:
    title: 星期五、星期六
    gloss: vineri（星期五）／sâmbătă（星期六）
    note: 按现代拼写，Sâmbătă 词中保留 â，不同于旧教材里较早的写法 sîmbătă。
    example_gloss:
    - 今天是星期五。
    - 明天是星期六。
  ro.a1.unit03.lesson01.teach.duminica:
    title: 星期日
    gloss: 星期日
    note: Duminică 补全了一周。说今天是星期几时，用这个无冠词形式；带冠词的形式 duminica 表示“每周日”。
    example_gloss: 今天是星期日。
  ro.a1.unit03.lesson01.teach.ce_zi_e_azi:
    title: 询问今天星期几
    gloss: 今天星期几？
    note: 这是询问星期几的日常说法——zi（天）是这里的新词，其余的 ce、este 和 astăzi 都是已经熟悉的词。
  ro.a1.unit03.lesson01.teach.saptamana_ieri:
    title: 周、昨天、上周、下周
    gloss: săptămână（周）／ieri（昨天）／săptămâna trecută（上周）／săptămâna viitoare（下周）
    note: 这是与星期名称出自同一教材的补充词汇，可用来以相对的方式谈论日期；本单元的练习不会像星期名称那样反复操练它们。
  ro.a1.unit03.lesson01.teach.lowercase_zile:
    title: 星期名称用小写
    gloss: 星期名称不用大写字母：luni、vineri。
    note: 罗马尼亚语的星期名称在句子中间不大写——是 *luni*，不是 *Luni*；只有该词位于句首时才大写。
  ro.a1.unit03.lesson02.teach.ian_feb_mar:
    title: 一月、二月、三月
    gloss: 一月 / 二月 / 三月
    note: 与星期名称不同,罗马尼亚语里有不少月份名称源自拉丁语,与许多欧洲语言中的对应词相近,很容易辨认。
    example_gloss:
    - 现在是一月。
    - 现在是二月。
    - 现在是三月。
  ro.a1.unit03.lesson02.teach.apr_mai_iun:
    title: 四月、五月、六月
    gloss: 四月 / 五月 / 六月
    note: Mai(五月)很短,但它不同于本课程其他地方用作副词的 mai(更,如 ce mai faci)——上下文总能把两者区分开。
    example_gloss:
    - 现在是四月。
    - 现在是五月。
    - 现在是六月。
  ro.a1.unit03.lesson02.teach.iul_aug_sep:
    title: 七月、八月、九月
    gloss: 七月 / 八月 / 九月
    note: August 的写法与国际上常见的写法一致,是这组词中最容易辨认的一个。
    example_gloss:
    - 现在是七月。
    - 现在是八月。
    - 现在是九月。
  ro.a1.unit03.lesson02.teach.oct_noi_dec:
    title: 十月、十一月、十二月
    gloss: 十月 / 十一月 / 十二月
    note: 最后三个月凑齐了十二个月,它们都是词形固定的名词。
    example_gloss:
    - 现在是十月。
    - 现在是十一月。
    - 现在是十二月。
  ro.a1.unit03.lesson02.teach.intai:
    title: 一号（每月第一天）
    gloss: 一号
    note: 这是罗马尼亚语特有的规则:在标准用法中,每月一日不说 *unu*(普通的“一”),而是用专门的词 *întâi*。(口语中有时能听到 *unu*,但应当学 *întâi* 这种说法。)从二日起,其余日期都用普通基数词。
    example_gloss: 今天是八月一日。
  ro.a1.unit03.lesson02.teach.date_rule:
    title: 罗马尼亚语如何表达日期
    gloss: 一日:întâi · 二日及以后:普通数词(doi, trei, patru...)
    note: 过了一日之后,罗马尼亚语的日期就是普通基数词(前面已学过)加上月份——不用序数形式,也不需要额外的词,例如 *trei aprilie*(四月三日,字面意思是“三 四月”)。
  ro.a1.unit03.lesson02.teach.ce_data:
    title: 询问日期
    gloss: 今天几月几号？
    note: Dată(日期)是这里的新词;问句的其余部分 ce、este 和 astăzi 与第一课中询问星期几时完全相同。
  ro.a1.unit03.lesson02.teach.raspuns_data:
    title: 表达日期
    gloss: 今天是四月三日。
    note: Trei(三)是第2单元学过的基数词;在 aprilie 前面不加序数词尾,也不加任何其他词。
  ro.a1.unit03.lesson02.teach.la_multi_ani:
    title: 在特殊的日子送上祝福
    gloss: 生日快乐!/新年快乐!
    note: 字面意思是“(祝)多年”——这是生日、命名日或新年时最常用的罗马尼亚语祝福语,其中的 *ani*(年)在第2单元的年龄内容中学过。
  ro.a1.unit03.lesson02.teach.lowercase_luni:
    title: 月份名称也用小写
    gloss: 月份名称不用大写字母书写:ianuarie、mai。
    note: 规则与第一课的星期名称相同——罗马尼亚语的月份名称在句中保持小写。
  ro.a1.unit03.lesson03.teach.cand:
    title: 什么时候?
    gloss: 什么时候?
    note: Când 用来引出询问时间的问句,作用相当于汉语的“什么时候”。
    example_gloss: 会议是什么时候?
  ro.a1.unit03.lesson03.teach.intalnirea:
    title: 这次会议
    gloss: 会面
    note: Întâlnirea 是带定冠词的形式(指特定的那次会议)——不带冠词的名词形式是 întâlnire。
    example_gloss: 会议在星期一。
  ro.a1.unit03.lesson03.teach.cand_e_intalnirea:
    title: 询问某件事在什么时候
    gloss: 会议是什么时候?
    note: 把 când 与已经熟悉的 este 以及本课新词 întâlnirea 组合在一起。
  ro.a1.unit03.lesson03.teach.raspuns_intalnire:
    title: 说明活动的日期
    gloss: 会议在八月一日,星期五。
    note: 星期和日期可以连在一起说,中间用逗号隔开,先说星期,再说日期。
  ro.a1.unit03.lesson03.teach.fara_de:
    title: 星期和日期前不需要 de
    gloss: 星期和日期不需要“de”:星期五,八月一日。
    note: 这与第2单元的规则形成有用的对比:20及以上的数字后面,普通名词前需要 *de*(*treizeci de ani*),而星期或日期直接连接,完全不用 *de*。
  ro.a1.unit03.lesson03.teach.line01:
    title: 询问会议的时间
    gloss: Ana 问 Mihai 他们的会议是什么时候。
    note: 这是一个平实、不分语体的问句——este 不会因 tu 或 dumneavoastră 而改变。
  ro.a1.unit03.lesson03.teach.line02:
    title: 说出日期
    gloss: Mihai 说会议在八月一日,星期五。
    note: Mihai 沿用了第二课的日期格式:先说星期,再说 întâi + 月份,不加 de。
  ro.a1.unit03.lesson03.teach.line03:
    title: 表示收到并道别
    gloss: Ana 向他道谢并说再见。
    note: La revedere 在第1单元学过,仍像以前一样用来结束对话。
  ro.a1.unit03.lesson03.teach.line04:
    title: 结束这次见面
    gloss: Mihai 也回应说再见,并叫了 Ana 的名字。
    note: 在 la revedere 后面加上对方的名字来回应,是自然又友好的道别方式。
