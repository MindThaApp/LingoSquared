answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit's own new vocabulary (vreme, soare, cald, plouă, vânt, frig) is used only in person-invariant impersonal constructions ("Este soare," "Plouă," "Este vânt," "Este frig," "Cum este vremea?") with no register distinction of any kind. No new tu/ dumneavoastră form is introduced this unit; Ana and Mihai keep their existing formal register with each other in the dialogue's greeting/closing lines.
course:
  title: 罗马尼亚语入门 A1
  description: 用罗马尼亚语描述基本天气——Vreme(天气)、Soare(太阳/晴朗)、Cald(暖和)、Plouă(下雨)、Vânt(风)和 Frig(冷)——安娜和米哈伊查看明天的天气预报,并决定什么时候去公园。
units:
  ro.a1.unit19.weather:
    title: 天气
lessons:
  ro.a1.unit19.lesson01.vremea_de_azi:
    title: 今天的天气
  ro.a1.unit19.lesson02.vremea_de_maine:
    title: 明天的天气
  ro.a1.unit19.lesson03.planul_de_sambata:
    title: 星期六的计划
teaching:
  ro.a1.unit19.lesson01.teach.reminder_ana_este:
    title: 复习:Ana、Este、Și
    gloss: Ana(人名)· Este(是)· Și(和)
    note: Ana 是从第1单元起就出现的角色名;*este* 来自第8单元的地点内容;*și* 来自第5单元——本单元重复使用这三个词来描述今天的天气。
  ro.a1.unit19.lesson01.teach.reminder_astazi:
    title: 复习:Astăzi
    gloss: Astăzi(今天)
    note: 来自第3单元的日期词汇——这里用来谈论今天的天气。
  ro.a1.unit19.lesson01.teach.vreme_vocab:
    title: 天气
    gloss: Vreme(天气)
    note: '*Vremea* 是 *vreme* 的定冠词形式,意思是“这/那天气”:以 -e 结尾的阴性名词加 -a,就像第18单元的 *baie* → *baia*(浴室)。'
    example_gloss:
    - 天气怎么样?
  ro.a1.unit19.lesson01.teach.cum_este_vremea_phrase:
    title: 天气怎么样?
    gloss: Cum este vremea?(天气怎么样?)
    note: 询问天气的日常说法——*cum* 来自第1、9、12单元。
  ro.a1.unit19.lesson01.teach.soare_vocab:
    title: 太阳/晴朗
    gloss: Soare(太阳/晴朗)
    note: 与 *este* 连用来描述晴天:*Este soare* 字面意思是“是太阳”,意为“天气晴朗”。
    example_gloss:
    - 今天天气晴朗。
  ro.a1.unit19.lesson01.teach.cald_vocab:
    title: 暖和/热
    gloss: Cald(暖和/热)
    note: 这是一个形式不变的天气词——*Este cald* 总是用这个形式,没有性数变化。
    example_gloss:
    - 今天很暖和。
  ro.a1.unit19.lesson01.teach.astazi_soare_cald_phrase:
    title: 今天天气晴朗,很暖和。
    gloss: Astăzi este soare. Este cald.
    note: 这里的每个词都已学过或刚刚学到,组合成两个描述今天天气的新句子。
  ro.a1.unit19.lesson02.teach.reminder_mihai_maine:
    title: 复习:Mihai、Mâine
    gloss: Mihai(人名)· Mâine(明天)
    note: Mihai 是从第1单元起就出现的角色名;*mâine* 来自第3、12单元——本单元重复使用这两个词来描述明天的天气预报。
  ro.a1.unit19.lesson02.teach.reminder_nu_mergem_la_parc:
    title: 复习:Nu、Mergem、La parc
    gloss: Nu(不)· Mergem(我们去)· La parc(去公园)
    note: 都来自第11单元商量计划的词汇——这里用来决定天气是否适合去公园。
  ro.a1.unit19.lesson02.teach.ploua_vocab:
    title: 下雨
    gloss: Plouă(下雨)
    note: 这是一个无人称动词形式——不需要主语,就像 *Este cald* 也不需要主语一样。
    example_gloss:
    - 明天下雨。
  ro.a1.unit19.lesson02.teach.vant_vocab:
    title: 风
    gloss: Vânt(风)
    note: 与 *este* 的用法和 *soare* 一样:*Este vânt*,意思是“有风”。
    example_gloss:
    - 明天有风。
  ro.a1.unit19.lesson02.teach.frig_vocab:
    title: 寒冷
    gloss: Frig(冷)
    note: 与 *este* 连用:*Este frig*,意思是“很冷”。
    example_gloss:
    - 明天很冷。
  ro.a1.unit19.lesson02.teach.maine_ploua_phrase:
    title: 明天下雨。有风,而且很冷。
    gloss: Mâine plouă. Este vânt și este frig.
    note: 这里的每个词都已学过或刚刚学到,组合成一份完整的明天天气预报。
  ro.a1.unit19.lesson02.teach.nu_mergem_phrase:
    title: 我们明天不去公园。
    gloss: Nu mergem la parc mâine.(我们明天不去公园。)
    note: 本课最终要说的、根据天气做出的计划——沿用第11单元的 *mergem*/*la parc*,并在前面加上 *nu*。
  ro.a1.unit19.lesson03.teach.reminder_buna_ce_mai_faceti_bine_multumesc:
    title: 复习:Bună、Ce mai faceți?、Bine, mulțumesc
    gloss: Bună(你好)· Ce mai faceți?(您好吗?,敬称)· Bine, mulțumesc(很好,谢谢)
    note: 都来自第1单元开头的问候语,这里用来开始本单元的对话。
  ro.a1.unit19.lesson03.teach.reminder_sambata_la_revedere:
    title: 复习:Sâmbătă、La revedere
    gloss: Sâmbătă(星期六)· La revedere(再见)
    note: '*Sâmbătă* 来自第3、11、12单元;*la revedere* 来自第1单元——都用在周末计划的对话中。'
  ro.a1.unit19.lesson03.teach.line01:
    title: 向米哈伊问好并问他过得怎么样
    gloss: 安娜向米哈伊问好,并问他过得怎么样。
    note: 沿用第1单元的问候语 *Ce mai faceți?*。
  ro.a1.unit19.lesson03.teach.line02:
    title: 回答并询问明天的天气
    gloss: 米哈伊先作答,然后问安娜明天天气怎么样。
    note: 把第1单元的 *Bine, mulțumesc* 与本单元第一课的短语 *Cum este vremea?* 结合起来,再加上 *mâine*。
  ro.a1.unit19.lesson03.teach.line03:
    title: 描述明天的天气预报
    gloss: 安娜告诉他明天会下雨,而且有风,很冷。
    note: 完全沿用本单元第二课的短语。
  ro.a1.unit19.lesson03.teach.line04:
    title: 建议不去公园,改到星期六
    gloss: Mihai 说明天不去公园,并问星期六去行不行。
    note: 结合了本单元第二课的短语、第11单元的 *mergem* 和本单元的 *sâmbătă*。
  ro.a1.unit19.lesson03.teach.line05:
    title: 同意,并提到星期六是晴天
    gloss: Ana 说星期六是晴天,并同意这个计划。
    note: 结合了 *soare* 和第11单元自己的同意用语 *Da, bine!*。
  ro.a1.unit19.lesson03.teach.line06:
    title: 道别
    gloss: Mihai 道别。
    note: 和之前每个单元的对话一样的结束句式。
  ro.a1.unit19.lesson03.teach.line07:
    title: 道别
    gloss: Ana 道别。
    note: 和之前每个单元的对话一样的结束句式。
