answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: No new register-sensitive forms in this unit -- este (is), the core verb every sentence here uses, does not change with tu or dumneavoastră (same standing note as unit03/unit04). Ana and Mihai's neighborhood dialogue keeps their existing polite register with each other, matching unit06/unit07.
course:
  title: 罗马尼亚语入门 A1
  description: 用罗马尼亚语辨认和说明常见地点——询问 Unde este...?（……在哪里？），说明某地 aproape（近）还是 departe（远），并用 lângă（旁边）、vizavi de（对面）和 între（之间）描述一个简单的街区，继续跟随 Ana 和 Mihai 谈论在城里怎么走。
units:
  ro.a1.unit08.places:
    title: 地点
lessons:
  ro.a1.unit08.lesson01.unde_este:
    title: ……在哪里？
  ro.a1.unit08.lesson02.langa_vizavi_intre:
    title: 旁边、对面、之间
  ro.a1.unit08.lesson03.in_cartier:
    title: 在街区里
teaching:
  ro.a1.unit08.lesson01.teach.reminder_unde_este:
    title: 复习：unde、este
    gloss: unde（哪里）· este（是）
    note: 这两个词之前都出现过——*unde* 在第7单元的 *Unde pot să cumpăr ...?* 中，*este* 从第3、4单元起就有——在这里合成本单元的核心位置问句。
  ro.a1.unit08.lesson01.teach.unde_este_phrase:
    title: ……在哪里？
    gloss: Unde este...?（……在哪里？）
    note: 询问某物在哪里的日常说法——在 *este* 后面加上地点名称；如果语境已经清楚是哪个地方，也可以像这样单独使用。
  ro.a1.unit08.lesson01.teach.gara_magazin_banca:
    title: 火车站、商店、银行
    gloss: gară（火车站）· magazin（商店）· bancă（银行）
    note: 三个常见地点——说到具体、已知的某个地方时，都要用定冠词：*gara*、*magazinul*、*banca*。
    example_gloss:
    - 火车站在哪里？
    - 商店很近。
    - 银行很远。
  ro.a1.unit08.lesson01.teach.aproape_departe:
    title: 近、远
    gloss: aproape（近）· departe（远）
    note: 不用给出具体路线，就能简单说明一个地方是近还是远。
    example_gloss:
    - 商店很近。
    - 银行很远。
  ro.a1.unit08.lesson01.teach.magazinul_aproape:
    title: 商店很近
    gloss: Magazinul este aproape.（商店很近。）
    note: 一个简短完整的陈述句——如果已经清楚指的是哪个地方，*aproape* 后面就不需要再加地点名称。
  ro.a1.unit08.lesson01.teach.banca_departe:
    title: 银行很远
    gloss: Banca este departe.（银行很远。）
    note: 与 *aproape* 相反——句型同样简单。
  ro.a1.unit08.lesson01.teach.unde_este_gara:
    title: 火车站在哪里？
    gloss: Unde este gara?（火车站在哪里？）
    note: 把 *Unde este...?* 和 *gara* 合成一个完整的问句。
  ro.a1.unit08.lesson02.teach.spital_posta_biblioteca_statie:
    title: 医院、邮局、图书馆、公交车站
    gloss: spital（医院）· poștă（邮局）· bibliotecă（图书馆）· stație de autobuz（公交车站）
    note: 另外四个常见地点——和 gară/magazin/bancă 一样，指具体某个地方时要用定冠词：*spitalul*、*poșta*、*biblioteca*、*stația de autobuz*。
    example_gloss:
    - 医院在商店对面。
    - 邮局在商店和医院之间。
    - 图书馆离火车站很近。
    - 公交车站在图书馆旁边。
  ro.a1.unit08.lesson02.teach.langa_vizavi_intre:
    title: 旁边、对面、之间
    gloss: lângă（旁边）· vizavi de（对面）· între（之间）
    note: 三种相对于另一个地方来说明位置的方式。*Vizavi de* 和 *între* 需要借助 *de*/*și* 与第二个地点相连；*lângă* 则直接相连。
    example_gloss:
    - 商店在火车站旁边。
    - 医院在商店对面。
    - 邮局在商店和医院之间。
  ro.a1.unit08.lesson02.teach.magazinul_langa_gara:
    title: 商店在火车站旁边
    gloss: Magazinul este lângă gară.（商店在火车站旁边。）
    note: '*Lângă* 直接连接地点名称，不需要额外的词。'
  ro.a1.unit08.lesson02.teach.spitalul_vizavi_magazin:
    title: 医院在商店对面
    gloss: Spitalul este vizavi de magazin.（医院在商店对面。）
    note: '*Vizavi de* 在第二个地点之前需要 *de*。'
  ro.a1.unit08.lesson02.teach.posta_intre:
    title: 邮局在商店和医院之间
    gloss: Poșta este între magazin și spital.（邮局在商店和医院之间。）
    note: '*Între* 后面是用 *și*（和）连接的两个地点。'
  ro.a1.unit08.lesson02.teach.statia_langa_biblioteca:
    title: 公交车站在图书馆旁边
    gloss: Stația de autobuz este lângă bibliotecă.（公交车站在图书馆旁边。）
    note: 与商店、火车站同样的 *lângă* 结构，这次用在公交站和图书馆上。
  ro.a1.unit08.lesson03.teach.reminder_buna_multumesc_la_revedere_da:
    title: 复习：bună, mulțumesc, la revedere, da, Ana, Mihai
    gloss: 你好 · 谢谢 · 再见 · 是的 · Ana、Mihai（人名）
    note: 这些都已在前面的单元学过——这次 Ana 和 Mihai 在街区里再次见面。
  ro.a1.unit08.lesson03.teach.line01:
    title: 打招呼并询问邮局在哪里
    gloss: Ana 向 Mihai 问好，并问邮局在哪里。
    note: 把本单元的 *Unde este* 与第1单元的问候结合在一起。
  ro.a1.unit08.lesson03.teach.line02:
    title: 说明位置
    gloss: Mihai 说邮局在商店和医院之间。
    note: 再次使用本单元的 *poșta* 和 *între ... și* 结构。
  ro.a1.unit08.lesson03.teach.line03:
    title: 询问图书馆
    gloss: Ana 问图书馆是否很近。
    note: 一个简短的追问，再次用到 *este* 和 *aproape*。
  ro.a1.unit08.lesson03.teach.line04:
    title: 确认并补充信息
    gloss: Mihai 确认图书馆离火车站很近，并补充说公交站在图书馆旁边。
    note: 一句话里结合了 *aproape de* 和 *lângă*——都是本单元的介词。
  ro.a1.unit08.lesson03.teach.line05:
    title: 道谢并结束
    gloss: Ana 向 Mihai 道谢并告别。
    note: 这里的 *Mulțumesc* 只是结束时简单的道谢，与第1单元 *Bine, mulțumesc.* 中的是同一个词。
  ro.a1.unit08.lesson03.teach.line06:
    title: 结束对话
    gloss: Mihai 也道别，并叫了 Ana 的名字。
    note: 第1、5、6、7单元的对话也都是以同样友好的告别方式结束的。
