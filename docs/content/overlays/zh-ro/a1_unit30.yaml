  ro.a1.unit30.lesson04.ana_si_mihai_vorbesc:
    title: Ana 和 Mihai 谈爱好
  ro.a1.unit30.lesson05.mihai_si_ana_isi:
    title: Mihai 和 Ana 比较各自的爱好
  ro.a1.unit30.lesson06.planuim_impreuna_un_weekend:
    title: 一起规划周末
teaching:
  ro.a1.unit30.lesson01.teach.a_citi_a:
    title: 阅读、锻炼、做饭
    gloss: 阅读、锻炼／做运动、做饭
    note: 三个常见的爱好动词：*a citi*（阅读）、*a face sport*（运动）和 *a găti*（做饭）。罗马尼亚语动词的词典形式以 *a* 开头。
    example_gloss:
    - 我喜欢读书。
    - 我每逢星期六都锻炼。
    - 我喜欢为朋友们做饭。
  ro.a1.unit30.lesson01.teach.timpul_liber:
    title: 空闲时间
    gloss: 空闲时间
    note: '*Timpul liber*（空闲时间）由阳性名词 *timp* 加上后置冠词构成，是谈论爱好时的关键短语。'
    example_gloss: 我空闲时喜欢阅读。
  ro.a1.unit30.lesson01.teach.in_timpul_liber:
    title: 表达你空闲时做什么
    gloss: 我空闲时喜欢阅读。
    note: '*Citesc* 是 *a citi*（阅读）的 *eu* 形式；在 *îmi place să* 之后，动词保持同样的形式。'
  ro.a1.unit30.lesson02.teach.a_asculta_muzica:
    title: 音乐、画画、电子游戏
    gloss: 听音乐、画画、玩电子游戏
    note: 另外三个爱好短语：*a asculta muzică*（听音乐）、*a desena*（画画）和 *a juca jocuri video*（玩电子游戏）。
    example_gloss:
    - 我喜欢听音乐。
    - 我经常画画。
    - 我喜欢和朋友们一起玩电子游戏。
  ro.a1.unit30.lesson02.teach.imi_place_sa:
    title: 表达你喜欢听音乐
    gloss: 我喜欢听音乐。
    note: '*Îmi place să ascult muzică*：*îmi place*（字面是“它让我喜欢”）+ *să* + 动词，是表达喜欢做某事的常用方式。'
  ro.a1.unit30.lesson02.teach.imi_place_sa_2:
    title: 表达喜欢和朋友一起玩电子游戏
    gloss: 我喜欢和朋友们一起玩电子游戏。
    note: '*Cu prietenii* 的意思是“和朋友们”：*cu*（“和”）是介词，*prietenii* 是带冠词的复数形式。'
  ro.a1.unit30.lesson03.teach.mereu_des_uneori:
    title: 总是、经常、有时、从不
    gloss: 总是、经常、有时、从不
    note: 四个最基本的频率副词：*mereu*、*des*、*uneori* 和 *niciodată*。它们通常放在动词之后：*Citesc des*。
    example_gloss:
    - 我每周六都锻炼。
    - 我经常读书。
    - 我有时画画。
    - 我从不玩电子游戏。
  ro.a1.unit30.lesson03.teach.in_fiecare_saptamana:
    title: 每周、每个周末
    gloss: 每周、每个周末
    note: '*În fiecare săptămână* 和 *în fiecare weekend* 都表示“每……”；*fiecare* 从不变化，见下一张卡片。'
    example_gloss:
    - 我每周都为朋友做饭。
    - 我每个周末都锻炼。
  ro.a1.unit30.lesson03.teach.cuvantul_fiecare_nu:
    title: Fiecare 从不变化
    gloss: fiecare 这个词不变化：în fiecare săptămână（每周），în fiecare weekend（每个周末）。
    note: 无论后面是什么名词，*fiecare* 放在 *săptămână* 和 *weekend* 前都保持不变，所以不需要选择。
  ro.a1.unit30.lesson03.teach.ce_faci_in:
    title: 询问空闲时间
    gloss: 你空闲时做什么？
    note: 这是本单元的核心问题，可以用它询问任何人的爱好。
  ro.a1.unit30.lesson04.teach.ana_ne_plimbam:
    title: Ana 聊起爱好
    gloss: Ana：我们经常一起散步。不过 Mihai，你空闲时间还做些什么？
    note: '*Ne plimbăm*（“我们散步”）是反身动词 *a se plimba* 的 *noi* 形式；指的是两位朋友都喜欢的散步。'
  ro.a1.unit30.lesson04.teach.mihai_imi_place:
    title: Mihai 的爱好
    gloss: Mihai：我喜欢做饭，在家也做。而且我经常运动。
    note: '*Și acasă*（在家也……）说明 Mihai 做饭是出于兴趣，而不只是他在餐厅的工作。'
  ro.a1.unit30.lesson04.teach.ana_gatesti_si:
    title: Ana 很惊讶
    gloss: Ana：你在家也做饭？你上班不是已经做了一整天饭吗！
    note: '*Toată ziua*（一整天）强调 Mihai 在工作中已经做了很多饭；*deja* 的意思是“已经”。'
  ro.a1.unit30.lesson04.teach.mihai_da_dar:
    title: Mihai 解释原因
    gloss: Mihai：是啊，但我觉得做饭很放松。你呢，你喜欢做什么？
    note: '*Gătitul mi se pare relaxant* 字面意思是“做饭对我来说显得很放松”：*mi se pare* 是表达看法的常用说法。'
  ro.a1.unit30.lesson04.teach.ana_imi_place:
    title: Ana 的爱好
    gloss: Ana：我喜欢看书，也经常听音乐。
    note: 用 *și*（和）把第1课和第2课的两个爱好动词连在一个句子里。
  ro.a1.unit30.lesson04.teach.mihai_joci_si:
    title: Mihai 问起玩游戏
    gloss: Mihai：你也玩电子游戏吗？
    note: 这是一个简短的是非问句，用到第2课的 *jocuri video*；*joci* 是 *a juca* 的 *tu* 形式。
  ro.a1.unit30.lesson04.teach.ana_nu_nu:
    title: Ana 的回答
    gloss: Ana：不，我从来不玩电子游戏。但我有时会画画！
    note: 第3课的 *niciodată*（从不）和 *uneori*（有时）在同一个回答中形成对比；*nu ... niciodată* 是双重否定。
  ro.a1.unit30.lesson05.teach.mihai_si_cu:
    title: 比较爱好
    gloss: Mihai 和我经常一起散步。但我们还有其他爱好。Mihai 喜欢做饭，在家也做，而且经常做运动。我喜欢看书，也经常听音乐。我有时画画，但从来不玩电子游戏。你空闲时间喜欢做什么？
    note: Ana 的留言回顾了第4课的内容，并以本单元的核心问题向读者发问。
    glosses:
      plimbăm: 散步
      des: 经常
      împreună: 一起
      alte: 其他的
      gătească: 做饭
      place: 喜欢
      acasă: 在家
      sport: 锻炼
      citesc: 阅读
      ascult: 听
      muzică: 音乐
      desenez: 画画
      uneori: 有时
      joc: 玩电子游戏
      niciodată: 从不
      liber: 空闲的
      timpul: 时间
  ro.a1.unit30.lesson06.teach.mihai_ce_faci:
    title: Mihai 问周末的安排
    gloss: Mihai：这个周末你做什么？
    note: '*În acest weekend*（这个周末）用 *acest* 表示“这个”。'
  ro.a1.unit30.lesson06.teach.ana_inca_nu:
    title: Ana 还没拿定主意
    gloss: Ana：我还不知道。我喜欢看书，但也想出去走走。
    note: '*Să ies afară*（出去）是表示想出门的常用说法；*vreau să* + 动词表示“我想……”。'
  ro.a1.unit30.lesson06.teach.mihai_hai_sa:
    title: Mihai 提出一个计划
    gloss: Mihai：我们一起去散步吧！之后我给我们做饭。
    note: '*După aceea*（之后）表示先后顺序；*Hai să* + 动词用来提议一起做某事。'
  ro.a1.unit30.lesson06.teach.ana_buna_idee:
    title: Ana 同意
    gloss: Ana：好主意！我既喜欢散步，也喜欢做饭。
    note: '*Și ..., și ...*（“既……又……”）表示 Ana 对两件事同样喜欢，不分高低。'
  ro.a1.unit30.lesson06.teach.mihai_perfect_atunci:
    title: Mihai 确认
    gloss: Mihai：太好了。那我们周六见！
    note: 这是确认 *sâmbătă*（星期六）计划的友好结束语；*ne vedem* 意为“我们见面”。
