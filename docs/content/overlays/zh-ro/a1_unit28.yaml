teaching:
  ro.a1.unit28.lesson01.teach.a_suna:
    title: 打电话
    gloss: 打电话
    note: 表示打电话的动词的不定式。
    example_gloss: 我得给你打电话。
  ro.a1.unit28.lesson01.teach.te_sun:
    title: 说你会打电话
    gloss: 我给你打电话。
    note: '*Sun* 是 *a suna*（打电话）的 *eu* 形式；*te*（“你”）放在动词前。罗马尼亚语用现在时表示马上要做的事，相当于汉语的“我（会）给你打电话”。'
  ro.a1.unit28.lesson01.teach.alo_sunt_ana:
    title: 接电话
    gloss: 你好，我是安娜。
    note: '*Alo* 是接电话时的用语；*sunt* + 名字用来自报身份，类似汉语的“我是……”。'
  ro.a1.unit28.lesson01.teach.alo_sunt_mihai:
    title: 米哈伊也这样接电话
    gloss: 你好，我是米哈伊。
    note: 句型和 *Alo, sunt Ana* 相同，都是 *Alo, sunt* + 名字。
  ro.a1.unit28.lesson02.teach.cu_cine_vorbesc:
    title: 询问对方是谁
    gloss: 请问您是哪位？
    note: '*Cu cine vorbesc?*（字面意思是“我在和谁说话？”）是询问陌生来电者是谁的标准说法。'
  ro.a1.unit28.lesson02.teach.vorbiti_cu_ana:
    title: 礼貌地表明身份
    gloss: 您正在和安娜通话。
    note: '*Vorbiți cu* + 名字是正式的回答：*vorbiți* 是 *a vorbi*（说话）的 *dumneavoastră* 形式。'
  ro.a1.unit28.lesson03.teach.poti_sa_repeti:
    title: 请对方重复
    gloss: 你能重复一遍吗？
    note: '*Poți să* ...（你能……吗？）加上 *repeți*（你重复）再加 *asta*（这个）。'
  ro.a1.unit28.lesson03.teach.nu_vorbi_atat:
    title: 请对方说慢一点
    gloss: 请别说得这么快。
    note: '*Nu vorbi*（“别说”）是 *nu* + *tu* 形式；*atât de repede* 表示“这么快”。'
  ro.a1.unit28.lesson03.teach.nu_te_aud:
    title: 说你听不清
    gloss: 我听不清你说话。
    note: '*Nu te aud bine*：*aud* 是“我听见”，*te*（“你”）放在动词前，*bine* 表示“清楚”。'
  ro.a1.unit28.lesson04.teach.mesajul:
    title: 短信
    gloss: 短信
    note: '*Mesaj* 单数是阳性，复数是阴性（*un mesaj*，*două mesaje*）；定冠词加在词尾：*mesajul*。'
    example_gloss: 这条短信是安娜发来的。
  ro.a1.unit28.lesson04.teach.iti_trimit_un:
    title: 说你会发短信
    gloss: 我给你发条短信。
    note: '*Îți*（“给你”）是与格代词，放在动词前：*Îți trimit un mesaj*。'
  ro.a1.unit28.lesson04.teach.te_sun_inapoi:
    title: 说你会回电话
    gloss: 我稍后给你回电话。
    note: '*Înapoi*（“回”）放在动词后：*te sun înapoi* 是“我回电话给你”，*mai târziu* 表示“稍后”。'
  ro.a1.unit28.lesson05.teach.mihai_salut_ana:
    title: 阅读短信对话
    gloss: 米哈伊：嗨，安娜，你能给我打电话吗？我有事要告诉你。安娜：好的，当然，五分钟后我给你回电话。
    note: 留意米哈伊请求什么、为什么请求，以及安娜说什么时候回电话。
    glosses:
      Salut: 你好
      poți: 能够;可以
      suna: 打电话;称呼
      Trebuie: 必须;得
      ceva: 某事物
      spun: 讲述;告诉
      sigur: 当然
      sun: 打电话;称呼
      cinci: 五
      minute: 分钟
      înapoi: 回;返回
  ro.a1.unit28.lesson06.teach.mihai_alo_sunt:
    title: 米哈伊接电话
    gloss: 米哈伊：喂，我是米哈伊。
    note: 这就是第一课学过的 *Alo, sunt* + 名字句型，现在用在真正的通话里：接电话的人先开口并报上名字。
  ro.a1.unit28.lesson06.teach.ana_salut_mihai:
    title: 安娜自报姓名
    gloss: 安娜：嗨，米哈伊，我是安娜。米哈伊：你打来电话真好！
    note: '*Ce bine că* ...（“……真好”）表示对某件事的积极反应；*suni* 是 *a suna* 的 *tu* 形式。'
  ro.a1.unit28.lesson06.teach.ana_cum_a:
    title: 安娜询问班次的情况
    gloss: 安娜：你的第一个班次怎么样？
    note: '*A fost* 表示“是过”（*a fi* 的过去时）。它是复合过去时，构成方式与 *am mâncat* 相同；请看下一句之后的说明。'
  ro.a1.unit28.lesson06.teach.mihai_a_mers:
    title: 米哈伊报告好消息
    gloss: 米哈伊：非常顺利，比我想的还要好。
    note: '*A mers* 是 *a merge*（去，这里指“进展”）的过去时；*credeam* 表示“我原来以为”（*a crede* 的一个过去形式）。'
  ro.a1.unit28.lesson06.teach.a_fost_a:
    title: 过去时形式：a fost、a mers、credeam
    gloss: 曾是 → 是；去了 → 去；以为 → 认为
    note: '*A fost* 和 *a mers* 是复合过去时形式（*a* + 过去分词），*credeam* 是未完成过去时。目前只需把它们当作本课所出现语境中的固定说法来记；完整的过去时规则会在之后的级别学习。'
  ro.a1.unit28.lesson06.teach.ana_ma_bucur:
    title: 安娜很自豪
    gloss: 安娜：真高兴听到这个！我为你骄傲。
    note: '*Mândră de*（“为……感到自豪”）是固定搭配，必须用 *de*。男性说 *mândru*。'
  ro.a1.unit28.lesson06.teach.mihai_iti_multumesc:
    title: 米哈伊很感动
    gloss: 米哈伊：谢谢你，这对我意义重大。
    note: '*Înseamnă* 是 *a însemna*（意味着）的第三人称单数形式；*pentru mine*（“对我来说”）表示对谁而言重要。'
  ro.a1.unit28.lesson06.teach.prima_lui_tura:
    title: 他的
    gloss: 他的第一个班进行得非常顺利。
    note: '*Lui* 表示“他的”：*prima lui tură*（它位于 *prima* 和 *tură* 之间）。（表示“她的”用 *ei*。）'
