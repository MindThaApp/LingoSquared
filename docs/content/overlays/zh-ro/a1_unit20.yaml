teaching:
  ro.a1.unit20.lesson01.teach.reminder_vreau_un_ce:
    title: 复习:Vreau、Un、Ce
    gloss: Vreau(我想要)· Un(一个,阳性/中性)· Ce(什么)
    note: '*Vreau*(我想要)、*un*(一个)和 *ce*(什么,如 *Ce mai faceți?* 中)都是你已经学过的词——这里再次用来索要衣物。'
  ro.a1.unit20.lesson01.teach.tricou_vocab:
    title: T恤
    gloss: Tricou(T恤)
    note: 中性名词——和之前见过的其他中性/阳性名词一样用 *un*(不用 *o*),如 *un leu*。
    example_gloss:
    - 我想要一件T恤。
  ro.a1.unit20.lesson01.teach.culoare_vocab:
    title: 颜色
    gloss: Culoare(颜色)
    note: 阴性名词,用来询问某物有什么颜色。
    example_gloss:
    - 什么颜色?
  ro.a1.unit20.lesson01.teach.rosu_vocab:
    title: 红色
    gloss: Roșu(红色)
    note: 放在所修饰的名词之后,这是罗马尼亚语形容词的常规语序:*tricou roșu*,字面意思是“T恤 红色”。
    example_gloss:
    - 我想要一件红色T恤。
  ro.a1.unit20.lesson01.teach.albastru_vocab:
    title: 蓝色
    gloss: Albastru(蓝色)
    note: 和 *roșu* 的规律相同——放在名词之后:*tricou albastru*。
    example_gloss:
    - 我想要一件蓝色T恤。
  ro.a1.unit20.lesson01.teach.vreau_tricou_rosu_phrase:
    title: 我想要一件红色T恤。
    gloss: 我想要一件红色T恤。
    note: 核心的购物句式:*vreau*(我想要)+ *un tricou*(一件T恤)+ *roșu*(红色),颜色放在名词之后。
  ro.a1.unit20.lesson02.teach.reminder_cat_costa_va_rog:
    title: 复习:Cât、Costă、Vă、Rog
    gloss: Cât costă?(多少钱?)· Vă rog(请,敬称)
    note: '*Cât costă?* 出自市场那一课;*vă rog* 是敬称的“请”——这里再次用来询问衣物的价格,并使请求更客气。'
  ro.a1.unit20.lesson02.teach.reminder_mic_mica_mare:
    title: 复习:Mic、Mică、Mare
    gloss: Mic/Mică(小,阳性或中性/阴性)· Mare(大,阳性和阴性单数形式相同)
    note: 你在比较食物和饮料时已经学过的表示大小的词——这里再次用来表示衣服的尺码。
  ro.a1.unit20.lesson02.teach.pantaloni_vocab:
    title: 裤子
    gloss: Pantaloni(裤子)
    note: 罗马尼亚语中通常使用复数形式——*pantaloni* 指的是一条裤子。
    example_gloss:
    - 我想要裤子。
  ro.a1.unit20.lesson02.teach.marime_vocab:
    title: 尺码
    gloss: Mărime(尺码)
    note: 阴性名词——与前面复习过的阴性形式 *mică*(小)搭配,也可与不变的 *mare*(大)搭配。
    example_gloss:
    - 什么尺码?
  ro.a1.unit20.lesson02.teach.ce_marime_phrase:
    title: 什么尺码?
    gloss: Ce mărime?(什么尺码?)
    note: 商店柜台前的日常提问——简短、没有动词,与 *Ce culoare?*(什么颜色?)的省略结构相同。
  ro.a1.unit20.lesson02.teach.marime_mica_va_rog_phrase:
    title: 请给我小号。
    gloss: 请给我小号。
    note: '*Mică* 是 *mic* 的阴性形式，与阴性名词 *mărime* 保持一致；再配合已学过的 *vă rog*，就能礼貌地说出自己的尺码。'
  ro.a1.unit20.lesson02.teach.cat_costa_pantalonii_phrase:
    title: 这条裤子多少钱?
    gloss: 这条裤子多少钱？
    note: '*Pantalonii* 是 *pantaloni*（裤子）的定指形式：阳性复数名词加 *-i* 表示特指（*pantaloni* → *pantalonii*）。这里与已学过的 *cât costă* 搭配使用。'
  ro.a1.unit20.lesson03.teach.reminder_buna_multumesc_bine_la_revedere_si:
    title: 复习：Bună、Mulțumesc、Bine、La revedere、Și
    gloss: 你好 · 谢谢 · 好／很好 · 再见 · 和
    note: 日常问候语加上 *și*（和），在这里用于商店对话的开头和结尾。
  ro.a1.unit20.lesson03.teach.reminder_zece_douazeci_de_lei:
    title: 复习：Zece、Douăzeci、De、Lei
    gloss: 十 · 二十 · 的（20 以上的数字后、lei 前要加） · 列伊（货币，leu 的复数）
    note: 这是你已经学过的数字和货币 *leu/lei*，这里用来说T恤和裤子的价格。
  ro.a1.unit20.lesson03.teach.line01:
    title: 向米哈伊问好，并要一件红色T恤
    gloss: 安娜向米哈伊问好，说她想要一件红色T恤。
    note: 第一课学过的表达需求的句子：*Vreau un tricou roșu.*
  ro.a1.unit20.lesson03.teach.line02:
    title: 询问尺码
    gloss: 米哈伊问她要什么尺码。
    note: 商店里常用的问句 *Ce mărime?*（什么尺码？）。
  ro.a1.unit20.lesson03.teach.line03:
    title: 礼貌地说出尺码并询问价格
    gloss: 安娜要小号，然后问多少钱。
    note: '*Mărime mică, vă rog*（请给我小号），然后问 *Cât costă?*（多少钱？）。'
  ro.a1.unit20.lesson03.teach.line04:
    title: 说出价格
    gloss: 米哈伊说要五十列伊。
    note: 用到了复习过的 *cincizeci de lei*。
  ro.a1.unit20.lesson03.teach.line05:
    title: 表示同意，并问裤子的价格
    gloss: 安娜表示同意，然后说她还想要裤子，并问价格。
    note: 这里的 *Și* 表示“也、还”：*Vreau și pantaloni*——“我还想要裤子。”
  ro.a1.unit20.lesson03.teach.line06:
    title: 说出裤子的价格
    gloss: 米哈伊说裤子一百二十列伊。
    note: 从二十起，罗马尼亚语要在数字和名词之间加 *de*：*o sută douăzeci de lei*。
  ro.a1.unit20.lesson03.teach.line07:
    title: 向米哈伊道谢并道别
    gloss: 安娜向他道谢并说再见。
    note: 礼貌的道谢和道别。
  ro.a1.unit20.lesson03.teach.line08:
    title: 道别
    gloss: 米哈伊说再见。
    note: 简单的道别语，后面加上安娜的名字。
