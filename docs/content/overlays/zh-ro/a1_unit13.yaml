course:
  title: 罗马尼亚语入门 A1
  description: 用罗马尼亚语表达喜欢、不喜欢和偏好——Îmi place（我喜欢）、Nu-mi place（我不喜欢）、Vă place...?（您喜欢……吗？）、Prefer（我更喜欢）和 Sau（或者）——跟随安娜和米哈伊决定喝咖啡还是喝茶。
units:
  ro.a1.unit13.preferences:
    title: 偏好
lessons:
  ro.a1.unit13.lesson01.imi_place:
    title: 我喜欢
  ro.a1.unit13.lesson02.va_place_prefer:
    title: 您喜欢吗？我更喜欢……
  ro.a1.unit13.lesson03.cafea_sau_ceaiul:
    title: 咖啡还是茶？
teaching:
  ro.a1.unit13.lesson01.teach.reminder_cafea_ceai_paine:
    title: 复习：cafea、ceai、pâine
    gloss: cafea（咖啡）· ceai（茶）· pâine（面包）
    note: 这些词都已在第6单元学过——这里与本单元新学的表达喜欢和不喜欢的语法结合使用。
  ro.a1.unit13.lesson01.teach.imi_place_vocab:
    title: 我喜欢
    gloss: Îmi place（我喜欢）
    note: 字面意思是“对我来说它令人愉快”——*îmi*（对我）加上形式不变的 *place*（令人愉快）。表示一般地喜欢某物时，罗马尼亚语要用名词的定指形式（*cafeaua*，而不是第6单元学过的 *cafea*），而汉语说“我喜欢咖啡”时没有这种形式变化。
    example_gloss:
    - 我喜欢咖啡。
  ro.a1.unit13.lesson01.teach.imi_place_cafeaua_phrase:
    title: 我喜欢咖啡
    gloss: Îmi place cafeaua.（我喜欢咖啡。）
    note: 完整句式：Îmi place + 定指名词。
  ro.a1.unit13.lesson01.teach.imi_place_ceaiul_phrase:
    title: 我喜欢茶
    gloss: Îmi place ceaiul.（我喜欢茶。）
    note: 句式与 *Îmi place cafeaua* 相同，只是换了一种饮品——*ceaiul* 是第6单元学过的 *ceai* 的定指形式。
  ro.a1.unit13.lesson01.teach.numi_place_vocab:
    title: 我不喜欢
    gloss: Nu-mi place（我不喜欢）
    note: 这是 *Îmi place* 的否定形式——日常口语中，罗马尼亚语把 *nu îmi* 缩合为 *nu-mi*，所以这个带连字符的短形式就是自然的说法，而不只是省略写法。
    example_gloss:
    - 我不喜欢面包。
  ro.a1.unit13.lesson01.teach.numi_place_painea_phrase:
    title: 我不喜欢面包
    gloss: Nu-mi place pâinea.（我不喜欢面包。）
    note: '*Pâinea* 是第6单元学过的 *pâine* 的定指形式，模式与 *cafeaua*／*ceaiul* 相同。'
  ro.a1.unit13.lesson02.teach.reminder_imi_place_numi_place:
    title: 复习：Îmi place、Nu-mi place
    gloss: Îmi place（我喜欢）· Nu-mi place（我不喜欢）
    note: 两者都来自本单元的第一课——这里再学与它们搭配的疑问形式。
  ro.a1.unit13.lesson02.teach.reminder_cafeaua_ceaiul_painea:
    title: 复习：cafeaua、ceaiul、pâinea
    gloss: cafeaua（咖啡）· ceaiul（茶）· pâinea（面包）
    note: 这些词都来自本单元的第一课——这里用在疑问句和表示偏好的句子中。
  ro.a1.unit13.lesson02.teach.va_place_vocab:
    title: 您喜欢……吗？
    gloss: Vă place...?（您喜欢……吗？）
    note: 这是 *Îmi place* 的正式疑问形式——用 *vă*（对您，敬称）代替 *îmi*（对我），与已学过的 *aveți*／*faceți* 一样使用 *dumneavoastră* 的敬称语体。后面加定指名词；如果话题已经明确，也可以单独使用。
    example_gloss:
    - 您喜欢咖啡吗？
  ro.a1.unit13.lesson02.teach.va_place_cafeaua_phrase:
    title: 您喜欢咖啡吗？
    gloss: Vă place cafeaua?（您喜欢咖啡吗？）
    note: 完整句式：Vă place + 定指名词，句末用升调表示疑问。
  ro.a1.unit13.lesson02.teach.prefer_vocab:
    title: 我更喜欢
    gloss: Prefer（我更喜欢）
    note: '*prefer* 是一个一目了然的同源词，不需要“对我来说”的结构，它就像普通动词一样使用：*Prefer* + 所偏好的事物，和 *Îmi place* 一样用定指形式。'
    example_gloss:
    - 我更喜欢咖啡。
  ro.a1.unit13.lesson02.teach.prefer_cafeaua_phrase:
    title: 我更喜欢咖啡
    gloss: Prefer cafeaua.（我更喜欢咖啡。）
    note: 语气比 *Îmi place cafeaua* 更强——在两者之间做选择时很有用。
  ro.a1.unit13.lesson02.teach.sau_vocab:
    title: 或者
    gloss: Sau（或者）
    note: 在提供选择或询问选择时连接两个选项——不同于第10、12单元的 *și*（和），și 连接的是同时成立的两件事。
    example_gloss:
    - 咖啡还是茶？
  ro.a1.unit13.lesson02.teach.cafea_sau_ceai_phrase:
    title: 咖啡还是茶？
    gloss: Cafea sau ceai?（咖啡还是茶？）
    note: 这是提供选择的简短自然说法——这里用不带定冠的形式（*cafea*、*ceai*），而不是定指的 *cafeaua*／*ceaiul*，因为这是开放式的提议，而不是对咖啡或茶的一般性陈述。
  ro.a1.unit13.lesson03.teach.reminder_va_place_prefer_sau:
    title: 复习：Vă place、Prefer、Sau
    gloss: Vă place?（您喜欢吗？）· Prefer（我更喜欢）· Sau（或者）
    note: 这些都来自本单元的第二课——这里安娜和米哈伊把它们一起使用。
  ro.a1.unit13.lesson03.teach.reminder_imi_place_numi_place_cafeaua_ceaiul_painea:
    title: 复习：Îmi place、Nu-mi place、cafeaua、ceaiul、pâinea
    gloss: Îmi place（我喜欢）· Nu-mi place（我不喜欢）· cafeaua（咖啡）· ceaiul（茶）· pâinea（面包）
    note: 这些都来自本单元的第一课——这里安娜和米哈伊各自说出自己喜欢和不喜欢什么。
  ro.a1.unit13.lesson03.teach.reminder_buna_multumesc_la_revedere_ana_mihai:
    title: 复习：bună、mulțumesc、la revedere、Ana、Mihai
    gloss: bună（你好）· mulțumesc（谢谢）· la revedere（再见）· Ana、Mihai（人名）
    note: 这些都已在之前的单元学过——本课程每段对话都采用同样友好的开场和结束方式。
  ro.a1.unit13.lesson03.teach.line01:
    title: 打招呼并询问喝咖啡还是茶
    gloss: 米哈伊向安娜问好，并问她喜欢咖啡还是茶。
    note: 把本单元的 *Vă place...?* 与 *sau* 结合，在一个问句里给出两个选项。
  ro.a1.unit13.lesson03.teach.line02:
    title: 表达偏好和不喜欢
    gloss: 安娜说她更喜欢咖啡，不喜欢茶。
    note: 把 *Prefer* 与 *Nu-mi place* 结合——她偏爱咖啡，与第6、12单元中她一贯的选择一致。
  ro.a1.unit13.lesson03.teach.line03:
    title: 表达相反的偏好
    gloss: 米哈伊说他喜欢茶，不喜欢咖啡。
    note: 与第6、12单元中米哈伊一贯的选择一致（总是茶 ceai，从不喝咖啡 cafea）。
  ro.a1.unit13.lesson03.teach.line04:
    title: 也问问面包
    gloss: 安娜问米哈伊是否也喜欢面包。
    note: 先用简短的追问 *Și pâinea?*（那面包呢？）开头，再用完整的 *Vă place...?* 就新话题 *pâinea* 提问。
  ro.a1.unit13.lesson03.teach.line05:
    title: 确认、道谢并道别
    gloss: 米哈伊说是的，他喜欢面包，并向安娜道谢和道别。
    note: 与第6单元中米哈伊一贯的选择（面包 pâine）一致——结尾方式也与之前每个单元的对话相同。
  ro.a1.unit13.lesson03.teach.line06:
    title: 结束对话
    gloss: Ana 也道别，并叫了 Mihai 的名字。
    note: 和前面各单元对话一样的友好结束方式。
