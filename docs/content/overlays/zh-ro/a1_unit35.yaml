    title: Andrei 看到消息
    gloss: Andrei：我看到消息了。星期六见！
  ro.a1.unit35.lesson04.teach.stii_deja_la:
    title: 再见＋某一天
    gloss: 你已经会说 *La revedere!* 了。你也可以加上具体的日子：*Ne vedem sâmbătă!*、*Ne vedem mâine!*
    note: 把问候单元中的告别用语扩展到具体的某一天。
  ro.a1.unit35.lesson05.teach.ana_il_suna:
    title: 谁用什么？
    gloss: Ana 每天给 Mihai 打电话。她用手机，不用应用程序。Mihai 家里没有电脑，但他在手机上上网。Andrei 每天早上查天气预报。然后他去跑步。Elena 经常给 Ana 发消息。你也每天使用手机吗？
    note: 对比四个人物使用设备的习惯，与运动单元的对比阅读形式相呼应。
