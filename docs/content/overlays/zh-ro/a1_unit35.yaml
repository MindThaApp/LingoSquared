    title: 动词词尾随人称变化
    gloss: '*A căuta*（查找）的词形随人称变化：*eu caut*，*tu cauți*。*A folosi* 也一样：*eu folosesc*，*tu folosești*。'
    note: 词尾表明动作的执行者，所以罗马尼亚语常常省略 *eu* 和 *tu*。
