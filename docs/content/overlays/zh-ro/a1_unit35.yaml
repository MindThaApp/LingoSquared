    title: Mihai 确认天气
    gloss: Mihai：好啊，而且星期六是晴天！
  ro.a1.unit35.lesson06.teach.andrei_atunci_alerg:
    title: Andrei 的计划
    gloss: Andrei：那我就跑步。之后我还要踢足球。
