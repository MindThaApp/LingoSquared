teaching:
  ro.a1.unit27.lesson01.teach.fericit_trist_suparat:
    title: 开心、伤心和生气
    gloss: 开心，伤心，生气
    note: 三个与 *a fi*（是）连用的基本情绪词。每个都有以 *-ă* 结尾的阴性形式：*fericită*、*tristă*、*supărată*。
    example_gloss:
    - 我很开心。
    - 我很伤心。
    - 我很生气。
  ro.a1.unit27.lesson01.teach.sunt_fericit:
    title: 表达你很开心
    gloss: 我很高兴。
    note: '*Sunt*（来自 *a fi*，是）+ 情绪形容词是基本句型，与汉语“我很……”相似。女性说 *Sunt fericită*。'
  ro.a1.unit27.lesson01.teach.nu_sunt_suparat:
    title: 对比不同的感受
    gloss: 我没有生气，我很难过。
    note: 动词前加 *Nu* 表示否定：*Nu sunt supărat*。第二个分句再说出真正的感受。
  ro.a1.unit27.lesson02.teach.de_ce_esti:
    title: 询问原因
    gloss: 你为什么高兴？
    note: '*De ce*（为什么）是询问原因的标准问法。'
  ro.a1.unit27.lesson02.teach.sunt_fericit_pentru:
    title: 说明原因
    gloss: 我很高兴，因为我有了一套新公寓。
    note: '*Pentru că*（因为）引出原因从句；语序保持正常：*am un apartament nou*。'
  ro.a1.unit27.lesson02.teach.sunt_trist_pentru:
    title: 消极的原因
    gloss: 我很难过，因为在下雨。
    note: '*Plouă*（下雨）在罗马尼亚语中没有主语，所以可以单独作为原因从句。'
  ro.a1.unit27.lesson03.teach.emotionat:
    title: 紧张
    gloss: 紧张
    note: 表示紧张的标准词。
    example_gloss: 我对第一次上班很紧张。
  ro.a1.unit27.lesson03.teach.sunt_emotionat_pentru:
    title: 说明你为什么紧张
    gloss: 我对第一次上班很紧张。
    note: '*Pentru*（字面意思是“为了”）用来引出紧张的对象或原因，相当于汉语的“对……（感到紧张）”。'
  ro.a1.unit27.lesson03.teach.nu_ti_face:
    title: 安慰别人
    gloss: 别担心。
    note: '*Nu-ți face griji*（字面意思是“别为你自己制造担忧”）是表示安慰的标准固定说法。对不熟的人说：*Nu vă faceți griji*。'
  ro.a1.unit27.lesson04.teach.cum_se_simte:
    title: 询问别人的感受
    gloss: 米哈伊感觉如何？
    note: '*A se simți*（感觉）是自反动词：*mă simt*（我）、*te simți*（你）、*se simte*（他／她）。这是询问或描述感受的标准方式。'
  ro.a1.unit27.lesson04.teach.el_se_simte:
    title: 描述别人的感受
    gloss: 他觉得很紧张。
    note: '*Se* 是他／她的自反代词，放在动词前：*se simte*。'
  ro.a1.unit27.lesson04.teach.de_ce_se:
    title: 询问别人为什么有某种感受
    gloss: 他为什么觉得紧张？
    note: 把 *de ce* 与 *El se simte emoționat* 中的 *se simte* 句型结合起来。
  ro.a1.unit27.lesson05.teach.salut_ana_sunt:
    title: 阅读一条关于感受的消息
    gloss: 嗨，安娜，我对自己第一次单独值班有点紧张。但我也很开心，因为我有了新工作和新公寓。我想会顺利的。
    note: 注意写信的人对什么感到紧张、什么让他高兴，以及他总体的看法。
    glosses:
      puțin: 有点
      emoționat: 紧张的
      prima: 第一个
      tură: 班次
      singur: 独自
      fericit: 高兴
      fiindcă: 因为
      nou: 新的
      serviciu: 工作
      apartament: 公寓
      cred: 认为
      rezolvă: 会顺利
  ro.a1.unit27.lesson06.teach.ana_salut_mihai:
    title: 安娜问米哈伊感觉如何
    gloss: 安娜：嗨，米哈伊，第一次值班前你感觉怎么样？
    note: '*Cum te simți* 中用了自反代词 *te*（“你自己”）；在 *prima ta tură* 中，物主词 *ta* 与阴性名词 *tură* 保持一致。'
  ro.a1.unit27.lesson06.teach.mihai_sunt_putin:
    title: 米哈伊承认自己很紧张
    gloss: 米哈伊：说实话，我有点紧张。
    note: '*Sincer să fiu*（说实话）让承认的语气更委婉。'
  ro.a1.unit27.lesson06.teach.ana_nu_ti:
    title: 安娜安慰他
    gloss: 安娜：别担心，你一定能做好的！
    note: '*O să te descurci bine*（字面意思是“你会应付得很好”）是表示鼓励的固定说法；*o să* + 动词构成将来时。'
  ro.a1.unit27.lesson06.teach.mihai_multumesc_chiar:
    title: 米哈伊向她道谢
    gloss: 米哈伊：谢谢，这真的有帮助。
    note: '*Ajută* 是 *a ajuta*（帮助）的他／她／它形式；这里的意思是“有帮助”。'
  ro.a1.unit27.lesson06.teach.ana_si_dupa:
    title: 安娜预言结果
    gloss: 安娜：之后你一定会非常开心，也会很自豪。
    note: '*Sigur*（一定）表示有把握的预测；*mândru*（自豪的）是一个新的实用形容词（女性用 *mândră*）。'
  ro.a1.unit27.lesson06.teach.mihai_da_si:
    title: 米哈伊表示同意
    gloss: 米哈伊：是的，我也这么认为。
    note: '*Și eu cred asta*（字面意思是“我也相信这个”）是表示赞同别人看法的自然说法。'
  ro.a1.unit27.lesson06.teach.mihai_este_emotionat:
    title: 用 este、lui 和 îl 做个小结
    gloss: 米哈伊为他的第一个班次感到紧张。安娜帮助他。
    note: '*Este* 是 *a fi*（是）的第三人称单数形式；名词后的 *lui* 表示“他的”；*îl* 表示“他”（作宾语），放在动词前：*îl ajută*。这三个小词虽小，却是谈论别人时必不可少的。'
