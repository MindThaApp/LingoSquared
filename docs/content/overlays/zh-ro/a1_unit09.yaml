answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit introduces the course's first imperative form, "Mergeți" (go) -- the dumneavoastră/formal-plural imperative, matching the course's established dumneavoastră-as-safe-default policy. No tu-register imperative is taught or accepted here. Ana and Mihai's direction-giving dialogue keeps their existing polite register with each other, matching unit06/unit07/unit08.
course:
  title: 罗马尼亚语入门 A1
  description: 学习用罗马尼亚语问路和听懂简短的指路——Cum pot să ajung...?（怎么去……？）、Mergeți înainte（一直往前走）、la dreapta / la stânga（向右／向左）以及 aici / acolo（这里／那里）——继续 Ana 和 Mihai 的故事：Ana 向 Mihai询问怎么去火车站。
units:
  ro.a1.unit09.directions:
    title: 问路
lessons:
  ro.a1.unit09.lesson01.cum_ajung:
    title: 怎么去……？
  ro.a1.unit09.lesson02.dreapta_stanga:
    title: 向右，向左
  ro.a1.unit09.lesson03.pe_strada:
    title: 在街上
teaching:
  ro.a1.unit09.lesson01.teach.reminder_unde_este_locuri:
    title: 复习：unde, este, gară, magazin, bancă, aproape
    gloss: 哪里 · 是，在 · 火车站 · 商店 · 银行 · 近
    note: 这些都已学过——unde 从第7单元起，este 从第3、4单元起，gară/magazin/bancă/aproape 从第8单元起——现在它们结合在一起，构成本单元的问路句子和例句。
  ro.a1.unit09.lesson01.teach.cum_pot_sa_ajung:
    title: 怎么去……？
    gloss: 怎么去……？
    note: 询问如何到达某地的日常说法——*pot*（我能）已在第7单元的 *Unde pot să cumpăr...?* 中出现过；*ajung*（我到达）是新词。
  ro.a1.unit09.lesson01.teach.mergeti_vocab:
    title: 走，去
    gloss: 走，去（敬称命令式）
    note: '*Mergeți* 是用于 dumneavoastră 敬称的命令式，是礼貌地请人走的说法，与 Ana 和 Mihai 彼此交谈的方式一致。'
    example_gloss:
    - 请一直往前走。
  ro.a1.unit09.lesson01.teach.inainte_vocab:
    title: 一直往前
    gloss: 一直往前
    note: 与 *Mergeți* 搭配，构成最简单的指路。
    example_gloss:
    - 请一直往前走。
  ro.a1.unit09.lesson01.teach.mergeti_inainte_phrase:
    title: 一直往前走
    gloss: 请一直往前走。
    note: 一句简短而完整的指路——是回答 *Cum pot să ajung...?* 最简单的方式。
  ro.a1.unit09.lesson01.teach.cum_ajung_gara:
    title: 怎么去火车站？
    gloss: 怎么去火车站？
    note: 把 *Cum pot să ajung...?* 和 *gară* 放在一个完整的问句里——*la*（到）把问句与目的地连接起来。*la* 之后，地点名词保持不带冠词的形式：*la gară*，而不是 *la gara*。
  ro.a1.unit09.lesson01.teach.cum_ajung_banca:
    title: 怎么去银行？
    gloss: 怎么去银行？
    note: 同样的结构，这次用银行——这是很自然的问题，因为第8单元已经说过银行很远。
  ro.a1.unit09.lesson02.teach.dreapta_stanga_vocab:
    title: 向右，向左
    gloss: 向右 · 向左
    note: 两个最基本的转向说法——把它们和 *la*（到）一起当作固定搭配来记：*la dreapta*，*la stânga*。
    example_gloss:
    - 请向右走。
    - 请向左走。
  ro.a1.unit09.lesson02.teach.mergeti_dreapta_phrase:
    title: 向右走
    gloss: Mergeți la dreapta.（向右走。）
    note: 和 *Mergeți înainte.* 是同一个 *Mergeți* 命令，只是把直走换成了转弯。
  ro.a1.unit09.lesson02.teach.mergeti_stanga_phrase:
    title: 向左走
    gloss: Mergeți la stânga.（向左走。）
    note: 相反方向的转弯——句型同样简单。
  ro.a1.unit09.lesson02.teach.aici_acolo_vocab:
    title: 这里，那里
    gloss: aici（这里）· acolo（那里）
    note: 到了某地或看得见目标时，用来指明位置的简单说法，与第8单元的 aproape/departe（表示距离，而不是位置）不同。
    example_gloss:
    - 商店在这里。
    - 火车站在那边。
  ro.a1.unit09.lesson02.teach.magazinul_aici_phrase:
    title: 商店在这里
    gloss: Magazinul este aici.（商店在这里。）
    note: 一个简短完整的陈述——*aici* 指的是就在你所在之处的地方。
  ro.a1.unit09.lesson02.teach.gara_acolo_phrase:
    title: 火车站在那边
    gloss: Gara este acolo.（火车站在那边。）
    note: '*Acolo* 指的是看得见、但不在你所处之处的地方——是结束一段指路时很自然的说法。'
  ro.a1.unit09.lesson03.teach.reminder_buna_multumesc_la_revedere_da:
    title: 复习：bună, mulțumesc, la revedere, da, Ana, Mihai
    gloss: bună（你好）· mulțumesc（谢谢）· la revedere（再见）· da（是）· Ana, Mihai（人名）
    note: 这些在前面的单元都已学过——这里是 Ana 向 Mihai 问路。
  ro.a1.unit09.lesson03.teach.apoi:
    title: 然后
    gloss: apoi（然后／接着）
    note: 把两个指路步骤连成一句话——一次说出多个步骤的自然方式。
    example_gloss:
    - 直走，然后向右。
  ro.a1.unit09.lesson03.teach.line01:
    title: 打招呼并问怎么去火车站
    gloss: Ana 向 Mihai 打招呼，并问怎么去火车站。
    note: 把本单元的 *Cum pot să ajung* 与第1单元的问候语结合起来。
  ro.a1.unit09.lesson03.teach.line02:
    title: 说出两个指路步骤
    gloss: Mihai 说先直走，然后向右。
    note: 重复使用本单元的 *Mergeți înainte* 和 *la dreapta*，并用 *apoi* 连接。
  ro.a1.unit09.lesson03.teach.line03:
    title: 问是否很近
    gloss: Ana 问火车站是否很近。
    note: 一个简短的追问，用到第8单元的 *este* 和 *aproape*。
  ro.a1.unit09.lesson03.teach.line04:
    title: 确认并指出位置
    gloss: Mihai 确认很近，并指出火车站就在那边。
    note: 在一句话里结合了 *aproape* 和 *acolo*——距离和位置。
  ro.a1.unit09.lesson03.teach.line05:
    title: 道谢并结束
    gloss: Ana 向 Mihai 道谢并道别。
    note: 与第1单元、第8单元对话中用过的道谢结尾相同。
  ro.a1.unit09.lesson03.teach.line06:
    title: 结束交谈
    gloss: Mihai 也回道再见，并称呼了 Ana 的名字。
    note: 与第1、5、6、7、8单元对话结尾一样的友好收尾方式。
