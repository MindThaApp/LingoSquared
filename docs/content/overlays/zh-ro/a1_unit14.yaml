answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit's own new vocabulary (mic/mică, mai, decât) is entirely person-invariant and carries no register distinction of its own. Ana and Mihai's dialogue keeps their existing polite register with each other, matching every earlier unit; no new second-person form is introduced here (unlike unit13's Vă place...?).
course:
  title: 罗马尼亚语入门 A1
  description: 用罗马尼亚语比较熟悉的事物——Mare（大）、Mic/Mică（小），以及 Mai ... decât（更……比……）比较句式——Ana 和 Mihai 比较他们的咖啡、茶和面包的大小。
units:
  ro.a1.unit14.comparisons:
    title: 比较
lessons:
  ro.a1.unit14.lesson01.mare_mic:
    title: 大，小
  ro.a1.unit14.lesson02.mai_mare_mai_mica:
    title: 更大，更小
  ro.a1.unit14.lesson03.cafeaua_mai_mare:
    title: 哪个更大？
teaching:
  ro.a1.unit14.lesson01.teach.reminder_mare:
    title: 复习：mare
    gloss: 大
    note: 已在第3单元（"literă mare"，大写字母）和第5单元（"o familie mare"，大家庭）中学过——这里它有了真正的比较对象 *mic/mică*。
  ro.a1.unit14.lesson01.teach.reminder_cafeaua_ceaiul_painea:
    title: 复习：cafeaua, ceaiul, pâinea, cafea, ceai
    gloss: 那杯咖啡 · 那杯茶 · 那个面包 · 咖啡 · 茶
    note: 都来自第6／13单元——本单元把这些定指形式当作比较大小的对象，并在本课的配对练习中再次用到不定形式。
  ro.a1.unit14.lesson01.teach.mic_mica_vocab:
    title: 小
    gloss: 小（阳性／中性）· 小（阴性）
    note: 罗马尼亚语的形容词要和所修饰的名词保持一致——*ceai*（茶）用阳性／中性形式 *mic*，而 *cafea*（咖啡）和 *pâine*（面包）是阴性，用 *mică*。*Mare*（大）在单数时阳性和阴性形式相同，所以不需要这种区分。
    example_gloss:
    - 茶很小。
    - 咖啡很小。
  ro.a1.unit14.lesson01.teach.ceaiul_e_mic_phrase:
    title: 茶很小
    gloss: Ceaiul e mic.（茶很小。）
    note: '*Ceaiul* 是中性名词，所以用阳性／中性形式 *mic*。'
  ro.a1.unit14.lesson01.teach.cafeaua_e_mica_phrase:
    title: 咖啡很小
    gloss: Cafeaua e mică.（咖啡很小。）
    note: '*Cafeaua* 是阴性名词，所以用阴性形式 *mică*。'
  ro.a1.unit14.lesson01.teach.painea_e_mica_phrase:
    title: 面包很小
    gloss: Pâinea e mică.（面包很小。）
    note: '*Pâinea* 也是阴性名词，所以和 *cafeaua* 一样用 *mică*。'
  ro.a1.unit14.lesson02.teach.reminder_mare_mic_mica:
    title: 复习：Mare, Mic, Mică
    gloss: 大 · 小（阳性／中性）· 小（阴性）
    note: 都来自本单元第1课——这里学习它们的比较级用法。
  ro.a1.unit14.lesson02.teach.reminder_cafeaua_ceaiul_painea:
    title: 复习：cafeaua, ceaiul, pâinea
    gloss: 那杯咖啡 · 那杯茶 · 那个面包
    note: 都来自第13单元，这里再次用作被比较的事物。
  ro.a1.unit14.lesson02.teach.mai_vocab:
    title: 更
    gloss: 更（比较级）
    note: 不是表示月份的 *mai*（五月，第3单元）。它和你在“Ce mai faceți?”（第1单元）中见过的是同一个小词，但在这里起的是比较级助词的作用：把 *mai* 放在形容词前，表示“更……”，这是罗马尼亚语构成比较级的标准方式。
    example_gloss:
    - 咖啡更大。
  ro.a1.unit14.lesson02.teach.mai_mare_phrase:
    title: 咖啡更大
    gloss: Cafeaua e mai mare.（咖啡更大。）
    note: '*Mai* + 形容词——不需要其他变化。'
  ro.a1.unit14.lesson02.teach.decat_vocab:
    title: 比
    gloss: 比
    note: 使比较完整——*mai* + 形容词 + *decât* + 被比较的第二样事物。
    example_gloss:
    - 咖啡比茶大。
  ro.a1.unit14.lesson02.teach.mai_mare_decat_phrase:
    title: 咖啡比茶大
    gloss: Cafeaua e mai mare decât ceaiul.（咖啡比茶大。）
    note: 完整的比较句式：[事物] + e + mai + [形容词] + decât + [第二样事物]。
  ro.a1.unit14.lesson02.teach.mai_mica_decat_phrase:
    title: 面包比咖啡小
    gloss: Pâinea e mai mică decât cafeaua.（面包比咖啡小。）
    note: 同样的句式，用的是本单元第1课中学过的阴性形式 *mică*。
  ro.a1.unit14.lesson03.teach.reminder_mai_decat_mare_mic_mica:
    title: 复习：Mai, Decât, Mare, Mic, Mică
    gloss: Mai（更）· Decât（比）· Mare（大）· Mic（小，阳性/中性）· Mică（小，阴性）
    note: 全部来自本单元前两课——这里 Ana 和 Mihai 把它们放在一起使用。
  ro.a1.unit14.lesson03.teach.reminder_cafeaua_ceaiul_painea:
    title: 复习：cafeaua, ceaiul, pâinea
    gloss: cafeaua（咖啡）· ceaiul（茶）· pâinea（面包）
    note: 全部来自第13单元——Ana 和 Mihai 比较的三样东西。
  ro.a1.unit14.lesson03.teach.reminder_buna_multumesc_la_revedere_ana_mihai:
    title: 复习：bună, mulțumesc, la revedere, Ana, Mihai
    gloss: bună（你好）· mulțumesc（谢谢）· la revedere（再见）· Ana, Mihai（人名）
    note: 全部在前面的单元里学过——本课程每段对话都采用同样友好的开场和结束方式。
  ro.a1.unit14.lesson03.teach.line01:
    title: 问候并询问大小
    gloss: Mihai 向 Ana 问好，并问咖啡是大的还是小的。
    note: 用本单元的 *mare sau mică*（大还是小）来提出关于大小的问题，和第13单元的 *cafea sau ceai?* 一样，都是“X sau Y?”这种给出选择的句式。
  ro.a1.unit14.lesson03.teach.line02:
    title: 描述两种饮料的大小
    gloss: Ana 说咖啡大，茶小。
    note: 这里只是陈述大小这一事实，而不是喜好——这段对话没有说谁喜欢或点哪种饮料，只说了各自有多大。
  ro.a1.unit14.lesson03.teach.line03:
    title: 提问确认比较
    gloss: Mihai 问咖啡是不是比茶大。
    note: 把 Ana 说的两个独立事实（第二句）变成直接的比较，用的是本单元的核心结构 *mai mare decât*。
  ro.a1.unit14.lesson03.teach.line04:
    title: 确认并加上面包
    gloss: Ana 表示确认，然后说面包比咖啡小。
    note: 第三样东西 *pâinea* 再次使用 *mai ... decât*，这次用的是表示“更小”的 *mai mică*。
  ro.a1.unit14.lesson03.teach.line05:
    title: 确认、道谢并道别
    gloss: Mihai 确认面包很小，感谢 Ana，并向她道别。
    note: 和前面每个单元的对话一样的结束方式。
  ro.a1.unit14.lesson03.teach.line06:
    title: 结束对话
    gloss: Ana 也向 Mihai 道别，并叫了他的名字。
    note: 和前面每个单元的对话一样友好的结束方式。
