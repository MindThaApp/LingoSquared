answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: '"Vreau" (I want, plain) and "Aș dori" (I would like, polite, established in unit06) are a genuine directness contrast, not interchangeable synonyms -- accept either for a general "I want/I would like" unless an exercise explicitly names one. "Vă rog" (formal) and "te rog" (informal, both established in unit06) remain a register-sensitive pair here too. Ana and Mihai''s market dialogue keeps their existing polite register with each other (vă rog, not te rog).'
course:
  title: 罗马尼亚语入门 A1
  description: 用罗马尼亚语询问价格和数量——货币 leu/lei、scump/ieftin，以及按公斤购买 roșii（西红柿）和 cartofi（土豆）等市场商品——Ana 和 Mihai 继续他们的市场购物之旅。
units:
  ro.a1.unit07.shopping:
    title: 购物
lessons:
  ro.a1.unit07.lesson01.cat_costa:
    title: 多少钱?
  ro.a1.unit07.lesson02.rosii_si_cartofi:
    title: 西红柿和土豆
  ro.a1.unit07.lesson03.la_piata:
    title: 在市场
teaching:
  ro.a1.unit07.lesson01.teach.reminder_un_numere:
    title: 复习：un、doi、cinci、zece、douăzeci
    gloss: un（一）· doi（二）· cinci（五）· zece（十）· douăzeci（二十）
    note: 这些词都在前面的单元出现过（*un* 在第4单元，数字在第2单元）——这里用它们来谈价格。
  ro.a1.unit07.lesson01.teach.cat_costa:
    title: 多少钱?
    gloss: Cât costă?（多少钱？）
    note: 罗马尼亚语中询问价格的日常说法——后面加上物品的名称；如果从语境中已经知道指的是什么，也可以像这样单独使用。
  ro.a1.unit07.lesson01.teach.leu:
    title: Leu（货币）
    gloss: 列伊（罗马尼亚的货币单位，复数形式为 lei）
    note: 罗马尼亚的货币。Leu 是单数（一列伊）；复数 lei 是不规则的，不是 leu 加普通词尾。
    example_gloss: 一列伊。
  ro.a1.unit07.lesson01.teach.costa_cinci_lei:
    title: 八列伊
    gloss: Costă opt lei.（八列伊。）
    note: 数字2–19后，lei 保持原样——前面不需要多加任何词。
  ro.a1.unit07.lesson01.teach.costa_douazeci_de_lei:
    title: 三十列伊
    gloss: Costă treizeci de lei.（三十列伊。）
    note: 从20起，罗马尼亚语要在被计数的名词前加 *de*——第2单元讲 *ani*（岁）时学过同样的规则，现在用在 *lei* 上。
  ro.a1.unit07.lesson01.teach.leu_lei_de_rule:
    title: 规则：leu → lei，以及何时加 de
    gloss: leu → lei · 数字2–19：不加 *de* · 数字20以上：加 *de*
    note: 与第2单元 *ani* 的规则完全一样（câți ani ai / am treizeci de ani）——学会了一个名词的用法，lei 也是同样的用法。
  ro.a1.unit07.lesson01.teach.scump:
    title: 贵
    gloss: 贵
    note: 觉得价格太高时的常见反应。
    example_gloss: 八列伊？太贵了！
  ro.a1.unit07.lesson01.teach.ieftin:
    title: 便宜
    gloss: 便宜
    note: 与 scump 相反——价格划算。
    example_gloss: 一列伊？便宜！
  ro.a1.unit07.lesson02.teach.reminder_un_o_si_as_dori_rog:
    title: 复习：un、o、și、aș dori、vă rog、te rog
    gloss: un/o（一）· și（和）· aș dori（我想要）· vă rog（请，正式）· te rog（请，非正式）
    note: '*Aș dori*、*vă rog* 和 *te rog* 最早出现在第6单元的咖啡馆场景中——这里它们回到了市场。'
  ro.a1.unit07.lesson02.teach.piata:
    title: 市场
    gloss: 市场
    note: 阴性名词——买新鲜食品的露天市场或室内市场。
    example_gloss: 在市场里多少钱？
  ro.a1.unit07.lesson02.teach.rosii:
    title: 西红柿
    gloss: 西红柿
    note: roșie（一个西红柿）的复数——泛指购买西红柿时用复数。
    example_gloss: 我想要番茄。
  ro.a1.unit07.lesson02.teach.cartofi:
    title: 土豆
    gloss: 土豆
    note: cartof（一个土豆）的复数，变化规律与 roșii 相同。
    example_gloss: 我想要土豆。
  ro.a1.unit07.lesson02.teach.kilogram:
    title: Kilogram
    gloss: 公斤
    note: 按重量购买农产品的标准单位。*De* 把它与所买的东西连接起来：kilogram *de* roșii，意思是“一公斤西红柿”。
    example_gloss: 一公斤西红柿。
  ro.a1.unit07.lesson02.teach.vreau:
    title: 我要
    gloss: 我要
    note: 比 *aș dori*（“我想要”）更简单直接——在市场上两种说法都可以，只是 vreau 不那么客气。
    example_gloss: 我要土豆。
  ro.a1.unit07.lesson02.teach.unde_pot_sa_cumpar:
    title: 我在哪里可以买到……？
    gloss: Unde pot să cumpăr roșii?（我在哪里可以买到西红柿？）
    note: 不知道该去哪里买东西时很有用的问句——把 roșii 换成你要找的其他东西即可。
  ro.a1.unit07.lesson02.teach.cat_costa_kilogram_rosii:
    title: 一公斤西红柿多少钱？
    gloss: Cât costă un kilogram de roșii?（一公斤西红柿多少钱？）
    note: 把 Cât costă 和 kilogram de ... 的结构合成一个完整的问句。
  ro.a1.unit07.lesson02.teach.vreau_kilogram_cartofi:
    title: 我要一公斤土豆
    gloss: Vreau un kilogram de cartofi.（我要一公斤土豆。）
    note: 同样的 kilogram de ... 结构，这次用 vreau 构成陈述句，而不是问句。
  ro.a1.unit07.lesson03.teach.reminder_buna_multumesc_la_revedere:
    title: 复习：bună、ziua、mulțumesc、bine、la revedere、Ana、Mihai
    gloss: bună ziua（你好）· mulțumesc（谢谢）· bine（好）· la revedere（再见）· Ana、Mihai（人名）
    note: 这些都已在第1单元和第6单元的对话中出现过——这里 Ana 和 Mihai 再次见面，这次是在市场。
  ro.a1.unit07.lesson03.teach.line01:
    title: 问候并询问价格
    gloss: Ana 向 Mihai 问好，并询问一公斤西红柿多少钱。
    note: 把本单元的 Cât costă 与第1单元的问候语结合起来。
  ro.a1.unit07.lesson03.teach.line02:
    title: 说出价格
    gloss: Mihai 说要八列伊，并感叹很便宜。
    note: 重复使用本单元的 costă、opt lei 和 ieftin。
  ro.a1.unit07.lesson03.teach.line03:
    title: 礼貌地点单并再加一样东西
    gloss: Ana 表示同意，礼貌地要了一公斤西红柿，并补充说她还想要土豆。
    note: 把 aș dori、vă rog 和 vreau 合在一句话里——本单元词汇中的两种语气。
  ro.a1.unit07.lesson03.teach.line04:
    title: 说出第二个价格
    gloss: Mihai 说一公斤土豆五列伊。
    note: 重复使用第2单元的 zece（十），本单元第一课已经复习过。
  ro.a1.unit07.lesson03.teach.line05:
    title: 道谢并结束
    gloss: Ana 向 Mihai 道谢并告别。
    note: '*Mulțumesc* 在这里是简单的结束感谢语，和第1单元 *Bine, mulțumesc.* 中的是同一个词。'
  ro.a1.unit07.lesson03.teach.line06:
    title: 结束对话
    gloss: Mihai 也向 Ana 道别，并叫出她的名字。
    note: 与第1、5、6单元对话结尾相同的友好告别方式。
