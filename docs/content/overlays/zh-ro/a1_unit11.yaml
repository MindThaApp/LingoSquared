answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit's new words are all register-neutral -- mergem (first-person plural) and nu pot (first-person singular) don't change with tu/dumneavoastră, and atunci/sigur are invariant connective/response words with no person marking. No new second-person forms are introduced. Ana and Mihai's closing dialogue keeps their existing polite register with each other, matching unit06/unit07/unit08/unit09/unit10.
course:
  title: 罗马尼亚语入门 A1
  description: 用罗马尼亚语提议、接受、拒绝并安排一个简单的计划——mergem（我们走 / 我们去）、nu pot（我不能）、atunci（那么 / 这样的话）、sigur（当然）——继续跟随 Ana 和 Mihai，看他们如何约好在公园见面。
units:
  ro.a1.unit11.plans:
    title: 计划
lessons:
  ro.a1.unit11.lesson01.mergem_la_cinema:
    title: 我们去看电影好吗？
  ro.a1.unit11.lesson02.nu_pot_atunci:
    title: 我不行。那么呢？
  ro.a1.unit11.lesson03.planul_de_duminica:
    title: 周日的计划
teaching:
  ro.a1.unit11.lesson01.teach.reminder_da_bine:
    title: 复习：da, bine, nu, mulțumesc
    gloss: da（是 / 好）· bine（好 / 行）· nu（不 / 否）· mulțumesc（谢谢）
    note: 这些词从第6单元起都已学过——在这里它们组合成本单元接受计划的说法，也用于本课的词汇复习配对练习。
  ro.a1.unit11.lesson01.teach.mergem_vocab:
    title: 我们走 / 我们去
    gloss: Mergem（我们走 / 我们去）
    note: '*a merge* 的第一人称复数形式，之前已学过 *merg*（我去，第10单元）和 *mergeți*（正式的命令式，第9单元）——同一个动词，换了人称和数。单独使用并配上升调，就是邀请对方一起做某事的自然说法。'
    example_gloss:
    - 我们去看电影好吗？
  ro.a1.unit11.lesson01.teach.cinema_vocab:
    title: 电影院
    gloss: Cinema（电影院）
    note: 这是个国际通用的词，读音与汉语“电影院”不同，但在多种语言中都很相近，容易辨认。
    example_gloss:
    - 我们去看电影好吗？
  ro.a1.unit11.lesson01.teach.mergem_cinema_phrase:
    title: 我们去看电影好吗？
    gloss: Mergem la cinema?（我们去看电影好吗？）
    note: 一个完整的邀请——不需要再加“你想……吗”，只要用问号语调，“我们去”就变成了提议。
  ro.a1.unit11.lesson01.teach.parc_vocab:
    title: 公园
    gloss: Parc（公园）
    note: 又一个国际通用词，和 *cinema* 一样。
    example_gloss:
    - 我们去公园好吗？
  ro.a1.unit11.lesson01.teach.mergem_parc_phrase:
    title: 我们去公园好吗？
    gloss: Mergem la parc?（我们去公园好吗？）
    note: 与 *Mergem la cinema?* 相同的邀请句型，只是换了地点。
  ro.a1.unit11.lesson01.teach.da_bine_phrase:
    title: 好的！
    gloss: Da, bine!（好，行！）
    note: 接受计划的简短自然说法——用已学过的词组成新的搭配。
  ro.a1.unit11.lesson02.teach.reminder_nu_pot:
    title: 复习：nu, pot
    gloss: nu（不）· pot（我能）
    note: '*Nu* 从第6单元起已学过；pot 在第9单元的 *cum pot să ajung*（我怎么才能到）中学过。nu 放在动词前表示“不”：*nu pot* 就是“我不能”——本单元拒绝计划的说法。'
  ro.a1.unit11.lesson02.teach.reminder_sambata_duminica:
    title: 复习：sâmbătă, duminică
    gloss: sâmbătă（星期六）· duminică（星期日）
    note: 两个词都已在第3单元的星期名称中学过。
  ro.a1.unit11.lesson02.teach.mergem_parc_sambata_phrase:
    title: 我们周六去公园好吗？
    gloss: Mergem la parc sâmbătă?（我们周六去公园好吗？）
    note: 第一课的邀请句，现在加上了日期——把 *Mergem la parc?* 和星期名称结合起来。
  ro.a1.unit11.lesson02.teach.nu_pot_sambata_phrase:
    title: 周六我不行
    gloss: Nu pot sâmbătă.（周六我不行。）
    note: 直接的拒绝——*nu pot* 加上被拒绝的日子。
  ro.a1.unit11.lesson02.teach.atunci_vocab:
    title: 那么 / 这样的话
    gloss: Atunci（那么 / 这样的话）
    note: 不同于 *apoi*（第9单元的“然后”，用来按顺序连接两个动作）——*atunci* 用来提出替代方案或引出结果，改期时说“那样的话，……怎么样？”就用它。
    example_gloss:
    - 那么，周日呢？
  ro.a1.unit11.lesson02.teach.atunci_duminica_phrase:
    title: 那么，周日呢？
    gloss: Atunci, duminică?（那么，周日呢？）
    note: 被拒绝后的简短反提议——说出新的日子就够了，不必重复整个邀请。
  ro.a1.unit11.lesson02.teach.da_bine_duminica_phrase:
    title: 好的！周日。
    gloss: Da, bine! Duminică.（好的！周日。）
    note: 接受改期后的日子，和第一课的 *Da, bine!* 一样的简短句型。
  ro.a1.unit11.lesson03.teach.reminder_la_ce_ora_la_ora_patru:
    title: 复习：la ce oră, la ora, patru
    gloss: la ce oră（几点）· la ora（在……点）· patru（四）
    note: La ce oră／la ora 已在第4单元（问时间和说时间）中学过；patru 已在第2单元的数字中学过——在这里它们组合起来，用于确定本单元的见面时间。
  ro.a1.unit11.lesson03.teach.reminder_buna_multumesc_la_revedere_da_ana_mihai:
    title: 复习：bună, mulțumesc, la revedere, da, Ana, Mihai
    gloss: bună（你好）· mulțumesc（谢谢）· la revedere（再见）· da（是）· Ana, Mihai（人名）
    note: 这些都已在之前的单元中学过——在这里 Ana 和 Mihai 商定了计划的时间。
  ro.a1.unit11.lesson03.teach.sigur_vocab:
    title: 当然
    gloss: Sigur（当然）
    note: 确认计划时常用的独立应答，类似汉语的“当然！”或“没问题！”。
    example_gloss:
    - 当然！四点。
  ro.a1.unit11.lesson03.teach.sigur_phrase:
    title: 当然！四点。
    gloss: Sigur! La ora patru.（当然！四点。）
    note: 一句简短的回答，同时确认了计划和具体时间。
  ro.a1.unit11.lesson03.teach.line01:
    title: 问候并提议去公园
    gloss: Ana 向 Mihai 问好，并问是否周日去公园。
    note: 把本单元的 *Mergem la parc?* 邀请句和 *duminică* 结合起来。
  ro.a1.unit11.lesson03.teach.line02:
    title: 接受并问时间
    gloss: Mihai 同意了，并问几点。
    note: 重用第4单元的 *La ce oră?* 问句。
  ro.a1.unit11.lesson03.teach.line03:
    title: 提出时间
    gloss: Ana 提议四点。
    note: 一个简短的问句，用第4单元的 *la ora* 句型加上本单元的 *patru*。
  ro.a1.unit11.lesson03.teach.line04:
    title: 确认并道谢
    gloss: Mihai 回答“当然！”，并感谢 Ana。
    note: 把本单元的 *sigur* 和已学过的 *mulțumesc* 结合起来。
  ro.a1.unit11.lesson03.teach.line05:
    title: 说再见
    gloss: Ana 说再见。
    note: 之前每个单元的对话都以同样的方式结束。
  ro.a1.unit11.lesson03.teach.line06:
    title: 结束见面
    gloss: Mihai 也道别，并叫了 Ana 的名字。
    note: 之前每个单元的对话都以同样友好的方式结束。
