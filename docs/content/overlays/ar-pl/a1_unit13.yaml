teaching:
  pl.a1.unit13.lesson01.teach.muzyka:
    title: الموسيقى
    gloss: موسيقى
    note: موضوع شائع للحديث عمّا نحب وما لا نحب - وهي كلمة سهلة التعرّف لأنها قريبة من «موسيقى» في العربية.
    example_gloss: أحب الموسيقى.
  pl.a1.unit13.lesson01.teach.muzyke_accusative_note:
    title: Muzyka -> muzykę
    gloss: مع الفعل lubić (يحب) + المفعول به، تتحول muzyka إلى muzykę، كما تتحول kawa إلى kawę. Lubię muzykę، وليس Lubię muzyka.
    note: 'النمط نفسه الذي تعرفه: تصبح *muzyka* *muzykę* حين تكون مفعولًا به للفعل *lubię*، تمامًا مثل *kawa* التي تصبح *kawę*.'
  pl.a1.unit13.lesson01.teach.lubisz:
    title: تحب
    gloss: تحب (للمخاطب المفرد)
    note: صيغة ty من الفعل lubić - ما تحتاجه لتسأل صديقًا مباشرة إن كان يحب شيئًا.
    example_gloss: هل تحب الموسيقى؟
  pl.a1.unit13.lesson01.teach.lubic_paradigm_note:
    title: 'Lubić: lubię, lubisz, lubi'
    gloss: 'Lubić (يحب): lubię (أنا)، lubisz (أنت)، lubi (هو/هي). تعرف lubię وlubi من قبل - أما lubisz فهي الصيغة الجديدة، للشخص الذي تتحدث إليه.'
    note: صارت *Lubię* و*lubi* مألوفتين الآن - وتأتي *lubisz* لتسدّ صيغة «أنت» الناقصة من الفعل نفسه.
  pl.a1.unit13.lesson01.teach.czy_lubisz_muzyke:
    title: هل تحب الموسيقى؟
    gloss: هل تحب الموسيقى؟
    note: Czy تفتتح سؤالًا جوابه نعم أو لا - وهي الطريقة الطبيعية لسؤال صديق عن تفضيله.
  pl.a1.unit13.lesson01.teach.tak_lubie:
    title: نعم، أحبها.
    gloss: نعم، أحبها.
    note: جواب قصير وطبيعي - لا حاجة إلى تكرار كلمة muzykę.
  pl.a1.unit13.lesson01.teach.nie_nie_lubie:
    title: لا، لا أحبها.
    gloss: لا، لا أحبها.
    note: Nie nie lubię تبدو مكررة لكنها ليست خطأ - فـ nie الأولى جواب عن السؤال، وnie الثانية تنفي lubię.
  pl.a1.unit13.lesson01.teach.ellipsis_note:
    title: الإجابات القصيرة
    gloss: 'جواب قصير: Tak, lubię. / Nie, nie lubię. - لا حاجة إلى تكرار كلمة muzykę، لأن السؤال يوضح المقصود.'
    note: كما يمكن أن تقف *Pyszny?* وحدها، لا تحتاج *Tak, lubię.* إلى إعادة ذكر موضوع الحديث - فالسياق يحمله.
  pl.a1.unit13.lesson01.teach.bardzo_lubie_muzyke:
    title: أحب الموسيقى كثيرًا
    gloss: أحب الموسيقى كثيرًا.
    note: Bardzo (جدًا / كثيرًا) تقوّي التفضيل العادي - وقد رأيت bardzo منذ الوحدة الأولى.
  pl.a1.unit13.lesson02.teach.wole:
    title: أفضّل
    gloss: أفضّل
    note: فعل جديد تمامًا في هذه الوحدة، woleć (يفضّل) - تُدرَّس هنا صيغة «أنا» فقط، مثل lubię.
    example_gloss: أفضّل الشاي.
  pl.a1.unit13.lesson02.teach.wolec_scope_note:
    title: 'Woleć: صيغة wolę فقط في هذه الوحدة'
    gloss: 'Woleć (يفضّل): wolę (أنا) - يدرّس هذا الدرس صيغة «أنا» فقط، مثل lubię. Wolę kawę. = أفضّل القهوة.'
    note: صيغة *ja* (أنا) فقط من *woleć* حاليًا، بالنطاق نفسه الذي كان لـ *lubię* عند تقديمها.
  pl.a1.unit13.lesson02.teach.kawa_herbata_recap:
    title: القهوة والشاي مرة أخرى
    gloss: 'Wolę + المفعول به: تصبح kawa إلى kawę، وherbata إلى herbatę - النمط نفسه الذي تعرفه.'
    note: 'نمط المفعول به نفسه كما سبق، لكن مع فعل جديد: *wolę kawę*، *wolę herbatę*.'
  pl.a1.unit13.lesson02.teach.wole_kawe:
    title: أفضّل القهوة
    gloss: أفضّل القهوة.
    note: عبارة بسيطة عن التفضيل باستخدام wolę.
  pl.a1.unit13.lesson02.teach.wole_herbate:
    title: أفضّل الشاي
    gloss: أفضّل الشاي.
    note: النمط نفسه مع herbatę بدل kawę.
  pl.a1.unit13.lesson02.teach.czy_or_note:
    title: Czy بمعنى «أم»
    gloss: كلمة czy في Kawa czy herbata? ليست czy نفسها التي تفتتح سؤالًا جوابه نعم أو لا - فهي هنا تربط بين خيارين، مثل «أم» في العربية. Kawa czy herbata? = القهوة أم الشاي؟
    note: 'انتبه: *czy* تفتتح عادةً سؤالًا جوابه نعم أو لا، لكنها بين اسمين هكذا تعني «أم» فقط.'
  pl.a1.unit13.lesson02.teach.kawa_czy_herbata:
    title: قهوة أم شاي؟
    gloss: قهوة أم شاي؟
    note: طريقة قصيرة وطبيعية لتعرض على أحدهم الاختيار بين أمرين.
  pl.a1.unit13.lesson03.teach.ja_tez:
    title: وأنا أيضًا
    gloss: وأنا أيضًا
    note: طريقة قصيرة للموافقة على ما قاله الشخص للتو.
  pl.a1.unit13.lesson03.teach.ja_tez_note:
    title: Ja też مرة أخرى
    gloss: تعني Ja też «وأنا أيضًا»، وقد تعرّفت عليها في درس الروتين اليومي (Ja też wstaję o siódmej، أي «أنا أيضًا أستيقظ في السابعة»).
    note: تذكير سريع بأن هذه العبارة مرّت عليك من قبل.
  pl.a1.unit13.lesson03.teach.elliptical_reminder_note:
    title: Kawa czy herbata? لا تحتاج إلى فعل
    gloss: مثل Pyszny? في الوحدة السابقة، لا يحتاج السؤال القصير Kawa czy herbata? إلى فعل، فالسياق يكفي.
    note: 'النمط نفسه كما في *Pyszny?*: سؤال قصير بلا فعل، يوضّحه السياق تمامًا.'
  pl.a1.unit13.lesson03.teach.dialogue.line01:
    title: ماريك يسأل إيفا هل تحب الموسيقى
    gloss: هل تحب الموسيقى؟
    note: يبدأ ماريك الحديث بالسؤال الذي تعلّمته في هذه الوحدة.
  pl.a1.unit13.lesson03.teach.dialogue.line02:
    title: إيفا تحب الموسيقى وتسأله بدورها
    gloss: نعم، أحبها كثيرًا! وأنت؟
    note: A ty? (وأنت؟) تعيد السؤال إلى ماريك، وهو النمط نفسه الذي مرّ في الوحدات السابقة.
  pl.a1.unit13.lesson03.teach.dialogue.line03:
    title: ماريك يوافقها ويسأل عن المشروبات
    gloss: وأنا أيضًا. قهوة أم شاي؟
    note: تؤكد Ja też lubię كلام إيفا، ثم يغيّر ماريك الموضوع بسؤال جديد فيه خياران.
  pl.a1.unit13.lesson03.teach.dialogue.line04:
    title: إيفا تفضّل القهوة
    gloss: أفضّل القهوة.
    note: تعبّر إيفا عن تفضيلها باستخدام wolę، وهي نفسها شاربة القهوة التي عرفناها في وحدة الروتين.
  pl.a1.unit13.lesson03.teach.dialogue.line05:
    title: ماريك يفضّل الشاي
    gloss: أفضّل الشاي.
    note: يعبّر ماريك عن تفضيله، وهو عكس اختيار إيفا.
