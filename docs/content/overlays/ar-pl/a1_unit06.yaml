teaching:
  pl.a1.unit06.lesson01.teach.chleb:
    title: خبز
    gloss: خبز
    note: كلمة أساسية للطعام، تتكرر باستمرار في أي وجبة.
    example_gloss: هذا خبز.
  pl.a1.unit06.lesson01.teach.maslo_ser:
    title: زبدة، جبن
    gloss: زبدة؛ جبن
    note: الأولى اسم محايد والثانية اسم مذكر غير حي، ولا تتغير نهاية أي منهما بعد proszę o، كما توضح ملاحظة القواعد في هذا الدرس.
    example_gloss:
    - هذه زبدة.
    - هذا جبن.
  pl.a1.unit06.lesson01.teach.woda_mleko:
    title: ماء، حليب
    gloss: ماء؛ حليب
    note: Woda اسم مؤنث (وتظهر صيغة المفعول به wodę في ملاحظة القواعد لهذا الدرس)، أما mleko فاسم محايد ولا يتغير.
    example_gloss:
    - هذا ماء.
    - هذا حليب.
  pl.a1.unit06.lesson01.teach.kawa_herbata:
    title: قهوة، شاي
    gloss: قهوة؛ شاي
    note: كلاهما مؤنث، وصيغتا المفعول به kawę وherbatę هما ما تقوله فعلًا عند الطلب، كما في ملاحظة القواعد لهذا الدرس.
    example_gloss:
    - هذه قهوة.
    - هذا شاي.
  pl.a1.unit06.lesson01.teach.prosze_o_note:
    title: 'الطلب: proszę o + المفعول به'
    gloss: 'من فضلك أعطني + المفعول به: kawa ← kawę، herbata ← herbatę، woda ← wodę. أما chleb وser وmleko فلا تتغير.'
    note: يأتي بعد *Proszę o* («من فضلك أعطني»، وحرفيًا «أطلب») اسم في حالة المفعول به. الأسماء المؤنثة مثل *kawa* و*herbata* و*woda* تستبدل نهايتها *-a* بـ *-ę*. أما الأسماء المذكرة غير الحية مثل *chleb* و*ser*، والأسماء المحايدة مثل *mleko*، فتبقى بالصيغة نفسها الواردة في القاموس.
  pl.a1.unit06.lesson01.teach.prosze_o_kawe:
    title: قهوة، من فضلك
    gloss: قهوة، من فضلك.
    note: الطريقة المهذبة اليومية لطلب شيء واحد، وفيها يُطبَّق نمط ملاحظة القواعد في طلب كامل.
  pl.a1.unit06.lesson02.teach.zupa:
    title: حساء
    gloss: حساء
    note: طبق شائع في الغداء أو العشاء، وكثيرًا ما يكون طبق اليوم، كما في مشهد المطعم في هذه الوحدة.
    example_gloss: هذه شوربة.
  pl.a1.unit06.lesson02.teach.sok:
    title: عصير
    gloss: عصير
    note: اسم مذكر غير حي مثل chleb وser، فلا تتغير نهايته عند طلبه.
    example_gloss: هذا عصير.
  pl.a1.unit06.lesson02.teach.cukier:
    title: سكر
    gloss: سكر
    note: مفيد للقهوة أو الشاي، وهو أيضًا مذكر غير حي، ولا تتغير نهايته.
    example_gloss: هذا سكر.
  pl.a1.unit06.lesson02.teach.rachunek:
    title: الفاتورة
    gloss: الحساب / الفاتورة
    note: ما تطلبه في نهاية الوجبة، وproszę o rachunek هي الطريقة المهذبة المعتادة لطلبه.
    example_gloss: الحساب من فضلك.
  pl.a1.unit06.lesson02.teach.lubic_note:
    title: 'الإعجاب: lubię، lubi'
    gloss: 'يحب / يعجبه: أنا أحب، هو/هي يحب — أحب القهوة. هو يحب الشوربة.'
    note: 'الفعل *Lubić* يعني «يحب» أو «يستلطف». نتعلم هنا صيغتين فقط: صيغة المتكلم (*lubię*) وصيغة الغائب (*lubi*). ويأتي بعد *Lubić* المفعول به في حالة خاصة، وهي النمط نفسه الذي يأتي بعد *proszę o*، فنقول *lubię kawę* وليس *lubię kawa*.'
  pl.a1.unit06.lesson02.teach.lubie_zupe:
    title: أحب الشوربة
    gloss: أحب الشوربة.
    note: تصبح zupa في حالة المفعول به zupę، وهو التحول نفسه للمؤنث من -a إلى -ę الذي ورد في ملاحظة القواعد في الدرس الأول.
  pl.a1.unit06.lesson03.teach.danie_dnia:
    title: طبق اليوم
    gloss: طبق اليوم هو الشوربة.
    note: '*Dnia* هي صيغة المضاف إليه من *dzień* (يوم)، و*danie dnia* حرفيًا «طبق اليوم»، وهي العبارة الثابتة نفسها التي تستعملها قوائم الطعام.'
  pl.a1.unit06.lesson03.teach.polecac_note:
    title: 'النصح: polecam، poleca'
    gloss: 'ينصح بـ: أنا أنصح، هو/هي ينصح — أنصح بالقهوة. هو ينصح بالشوربة.'
    note: '*Polecać* فعل بمعنى «ينصح بـ»؛ يستعمله النادل لاقتراح طبق، ويستعمله الزبون نفسه لطلب اقتراح. ويأتي بعده أيضًا المفعول به، بالنمط نفسه مع *proszę o* و*lubić*.'
  pl.a1.unit06.lesson03.teach.co_pan_poleca:
    title: بماذا تنصح؟
    gloss: بماذا تنصح؟
    note: '*Co* (ماذا) مع *pan* الرسمية — السؤال الطبيعي للنادل، بصيغة المخاطبة الرسمية نفسها من الوحدة الأولى.'
  pl.a1.unit06.lesson03.teach.prosze_bardzo:
    title: تفضل / عفوًا
    gloss: تفضل.
    note: عبارة مرنة ويومية، تُقال عند تقديم شيء، وهي طبيعية أيضًا للرد على dziękuję (شكرًا).
  pl.a1.unit06.lesson03.teach.juz_podaje:
    title: حالًا
    gloss: حالًا.
    note: حرفيًا «أقدّمه الآن»؛ وهو رد النادل المعتاد لتأكيد أنه سمع الطلب.
  pl.a1.unit06.lesson03.teach.dialogue.line01:
    title: النادل يعلن طبق اليوم
    gloss: النادل يلقي التحية ويعلن أن طبق اليوم هو الشوربة.
    note: Dzień dobry سبق أن وردت في تحيات الوحدة الأولى.
  pl.a1.unit06.lesson03.teach.dialogue.line02:
    title: إيفا تطلب اقتراحًا
    gloss: إيفا تسأل النادل بماذا ينصح.
    note: سؤال مهذب ورسمي، وpan تخاطب النادل باحترام.
  pl.a1.unit06.lesson03.teach.dialogue.line03:
    title: النادل ينصح بالقهوة
    gloss: النادل ينصح بالقهوة.
    note: Polecam — صيغة المتكلم من ملاحظة القواعد في هذا الدرس.
  pl.a1.unit06.lesson03.teach.dialogue.line04:
    title: إيفا تقدّم طلبها
    gloss: إيفا تقول حسنًا، وتطلب قهوة وشوربة.
    note: تجمع بين proszę o وأداة العطف i (و) من وحدة العائلة، وتعيد استعمال نمط الطلب من الدرس الأول ومفردات الشوربة من الدرس الثاني.
  pl.a1.unit06.lesson03.teach.dialogue.line05:
    title: النادل يؤكد الطلب
    gloss: النادل يقول إن الطلب سيصل حالًا.
    note: تأكيد قصير وطبيعي قبل وصول الطعام.
  pl.a1.unit06.lesson03.teach.dialogue.line06:
    title: إيفا تطلب الحساب
    gloss: إيفا تشكر النادل وتطلب الحساب.
    note: تعيد استعمال dziękuję من الوحدة الأولى وproszę o + rachunek من الدرس الثاني.
  pl.a1.unit06.lesson03.teach.dialogue.line07:
    title: النادل يناول الحساب
    gloss: 'النادل يقول: تفضلي.'
    note: عبارة proszę bardzo نفسها التي سبقت في هذا الدرس، وتؤدي هنا وظيفة أخرى هي تسليم الحساب.
