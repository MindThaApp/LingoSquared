  description: 'بولندية للمبتدئين لوصف المظهر الخارجي الأساسي للشخص: الانطباع عن الطول والعمر، ولون الشعر والعينين، والسؤال الأساسي Jak wygląda ...؟، ومقارنة مظهر شخصين.'
