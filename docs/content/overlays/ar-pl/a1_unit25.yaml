teaching:
  pl.a1.unit25.lesson01.teach.wysoki_niski:
    title: طويل وقصير
    gloss: طويل / قصير
    note: تصف *Wysoki* شخصًا طويل القامة، وتصف *niski* شخصًا قصير القامة. وللمرأة نقول *wysoka* أو *niska*.
    example_gloss:
    - كاشا طويلة القامة.
    - توميك قصير القامة.
  pl.a1.unit25.lesson01.teach.stary_mlody:
    title: كبير في السن وشاب
    gloss: كبير في السن / شاب
    note: تصف *Stary* و*młody* هنا انطباعًا عامًا، لا عددًا محددًا من السنوات.
    example_gloss:
    - الجد كبير في السن.
    - ماريك شاب.
  pl.a1.unit25.lesson01.teach.dziadek_jest_stary:
    title: 'Stary: انطباع أم عمر'
    gloss: 'تدل *Stary* على انطباع عام، كما في *Dziadek jest stary*. أما للتعبير عن العمر بدقة فتستخدم البولندية تركيبًا آخر: *Ile masz lat?*'
    note: تصف مظهر الشخص من حيث السن بـ*stary* أو *młody*؛ أما العمر بالتحديد فتسأل عنه بـ*Ile masz lat?* وتجيب بـ*mam ... lat* (عمري ... سنة).
  pl.a1.unit25.lesson01.teach.kasia_jest_wysoka:
    title: كاشا طويلة وتوميك قصير
    gloss: كاشا طويلة القامة وتوميك قصير القامة.
    note: جملة مركبة بسيطة تستخدم *a* (و، للتقابل). تتوافق *Wysoka* و*niski* مع مبتدأ مؤنث ومبتدأ مذكر، تمهيدًا للمقارنة في الدرس 5.
  pl.a1.unit25.lesson02.teach.wlosy:
    title: الشعر
    gloss: الشعر
    note: 'كلمة *Włosy* تأتي دائمًا في صيغة الجمع في البولندية: *długie włosy* (شعر طويل).'
    example_gloss: شعر ماريك أسود قصير.
  pl.a1.unit25.lesson02.teach.blond_brazowe_siwe:
    title: أشقر وبني ورمادي
    gloss: أشقر / بني / رمادي
    note: ثلاثة ألوان للشعر. لا تتغير *Blond* أبدًا؛ أما *brązowe* و*siwe* فهما صيغتا جمع لتتوافقا مع *włosy*.
    example_gloss:
    - شعر إيفا أشقر.
    - شعر توميك بني.
    - شعر الجد رمادي.
  pl.a1.unit25.lesson02.teach.dlugie_krotkie:
    title: طويل وقصير (للشعر)
    gloss: طويل / قصير (للشعر)
    note: '*Długie* (طويل) و*krótkie* (قصير) صيغتا جمع لتتوافقا مع *włosy*.'
    example_gloss:
    - شعر كاشا طويل.
    - شعر توميك قصير.
  pl.a1.unit25.lesson02.teach.wlosy_sa_w:
    title: Włosy تأخذ صفة بصيغة الجمع
    gloss: '*Włosy* جمع، لذا تأتي الصفة جمعًا أيضًا: شعر طويل، شعر قصير، شعر بني، شعر أسود.'
    note: 'الأسماء الجمع التي لا تدل على رجال تأخذ صفات تنتهي بـ*-e*: *długie włosy*. أما *Blond* فهي الاستثناء: لا تتغير أبدًا (*blond włosy*).'
  pl.a1.unit25.lesson02.teach.wlosy_maja_tylko:
    title: 'Włosy: دائمًا جمع'
    gloss: '*Włosy* (الشعر) تأتي دائمًا بصيغة الجمع: *jej włosy są długie* (شعرها طويل؛ وحرفيًا بصيغة الجمع: «شعراتها طويلة»). ومعنى *Jej* «لها» أو «ـها».'
    note: الشعر اسم جمع في البولندية، لذا يتوافق معه الفعل والصفة في الجمع. أما *Jej* («ـها») فلا تتغير مهما كان عدد ما تملكه.
  pl.a1.unit25.lesson02.teach.marek_ma_krotkie:
    title: ماريك شعره أسود قصير
    gloss: شعر ماريك أسود قصير.
    note: '*Czarne* (أسود) صيغة الجمع لتتوافق مع *włosy*.'
  pl.a1.unit25.lesson02.teach.ewa_ma_dlugie:
    title: إيفا شعرها أشقر طويل
    gloss: شعر إيفا أشقر طويل.
    note: تجمع في جملة طبيعية واحدة مفردات الطول والألوان من هذا الدرس.
  pl.a1.unit25.lesson03.teach.oczy:
    title: العيون
    gloss: العيون
    note: '*Oczy* جمع *oko*؛ وعادةً تتحدث البولندية عن العينين بصيغة الجمع.'
    example_gloss: عينا ماريك بنيتان.
  pl.a1.unit25.lesson03.teach.niebieski_brazowy_zielony:
    title: أزرق وبني وأخضر
    gloss: أزرق / بني / أخضر
    note: 'ثلاثة ألوان للعينين، بصيغة الجمع لتتوافق مع *oczy*: *niebieskie* و*brązowe* و*zielone*.'
    example_gloss:
    - عينا إيفا زرقاوان.
    - عينا توميك بنيتان.
    - عينا كاشا خضراوان.
  pl.a1.unit25.lesson03.teach.oczy_sa_w:
    title: Oczy تأخذ النهاية -e
    gloss: '*Oczy* جمع، لذا تنتهي الصفة بـ*-e*: عينان زرقاوان، عينان بنيتان، عينان خضراوان.'
    note: 'هي نهاية الجمع نفسها كما مع *włosy* في الدرس 2: *niebieskie oczy* و*brązowe oczy* و*zielone oczy*.'
  pl.a1.unit25.lesson03.teach.jak_wyglada_ewa:
    title: كيف تبدو إيفا؟
    gloss: كيف تبدو إيفا؟
    note: '*Jak wygląda ...?* هو السؤال الأساسي في هذه الوحدة؛ استخدمه للسؤال عن مظهر أي شخص.'
  pl.a1.unit25.lesson03.teach.ewa_ma_dlugie:
    title: إيفا شعرها أشقر طويل وعيناها زرقاوان
    gloss: إيفا شعرها أشقر طويل وعيناها زرقاوان.
    note: إجابة نموذجية تجمع الشعر والعينين في جملة واحدة بواسطة *i* (و).
  pl.a1.unit25.lesson04.teach.ewa_do_kawiarni:
    title: إيفا تقدّم نينا
    gloss: 'إيفا: ستأتي فتاة جديدة إلى مقهى اللغات. اسمها نينا.'
    note: '*Przychodzi* (تأتي) تقدّم شخصًا جديدًا في المشهد؛ و*do kawiarni językowej* تستخدم *do* مع حالة المضاف إليه (الجر).'
  pl.a1.unit25.lesson04.teach.marek_okej_jak:
    title: ماريك يسأل كيف تبدو
    gloss: 'ماريك: حسنًا! كيف تبدو؟'
    note: يعيد السؤال الأساسي في هذه الوحدة، لكن مع *ona* (هي) بدل الاسم.
  pl.a1.unit25.lesson04.teach.ewa_jest_niska:
    title: إيفا تصف طول نينا وشعرها
    gloss: 'إيفا: هي قصيرة القامة وشعرها أشقر قصير.'
    note: تجمع بين *niska* (مؤنث *niski*) من الدرس 1 ومفردات الشعر من الدرس 2.
  pl.a1.unit25.lesson04.teach.marek_a_jej:
    title: ماريك يسأل عن عينيها
    gloss: 'ماريك: وعيناها؟'
    note: '*Jej* هنا ضمير الملكية «ـها»، لذا *jej oczy* تعني «عيناها»؛ و*jej* لا تتغير.'
  pl.a1.unit25.lesson04.teach.ewa_ma_zielone:
    title: إيفا تصف عيني نينا
    gloss: 'إيفا: عيناها خضراوان.'
    note: تعيد *zielone oczy* من الدرس 3.
  pl.a1.unit25.lesson04.teach.marek_dzieki_wtedy:
    title: ماريك سيتعرف عليها
    gloss: 'ماريك: شكرًا! عندها سأتعرف عليها.'
    note: '*Rozpoznam* مستقبل من الصيغة التامة («سأتعرف»)؛ و*ją* هي حالة المفعول به لـ*ona* (هي).'
  pl.a1.unit25.lesson05.teach.tomek_i_kasia:
    title: مقارنة بين توميك وكاشا
    gloss: توميك وكاشا أخ وأخت، لكنهما يختلفان في المظهر. توميك قصير القامة، وشعره بني قصير، وعيناه بنيتان. كاشا أطول من توميك، وشعرها بني طويل، وعيناها خضراوان. كيف تبدو أنت؟
    note: مقارنة قصيرة تعيد استعمال كل كلمات الألوان والطول التي تعلمناها، وتنتهي بسؤال الوحدة الأساسي موجهًا إلى القارئ.
    glosses:
      brat: الأخ
      siostra: الأخت
      wyglądają: مظهر
      inaczej: مختلف
      niski: قصير القامة
      krótkie: قصير القامة
      brązowe: بني
      włosy: الشعر
      oczy: العيون
      wyższa: أطول
      długie: طويل
      zielone: أخضر
      wyglądasz: تبدو (للمخاطب)، كما في وصف مظهر شخص ما
  pl.a1.unit25.lesson05.teach.stopien_wyzszy_wysoki:
    title: إعادة استخدام صيغة التفضيل
    gloss: 'صيغة التفضيل: تصبح *wysoki* (طويل) *wyższy* (أطول)، ويأتي الشخص الآخر بعد *niż* (من): كاشا أطول من توميك.'
    note: 'تكوّن البولندية صيغة التفضيل بتغيير نهاية الصفة، وتبقى متوافقة مع الجنس: *wyższa* لكاشا (مؤنث).'
  pl.a1.unit25.lesson05.teach.kasia_ma_dluzsze:
    title: شعر كاشا أطول من شعر توميك
    gloss: شعر كاشا أطول من شعر توميك.
    note: '*Dłuższe* (أطول) بصيغة الجمع لتتوافق مع *włosy*، و*niż* (من) تقدّم المقارنة.'
  pl.a1.unit25.lesson05.teach.mam_krotkie_brazowe:
    title: لدي شعر قصير بني
    gloss: لدي شعر قصير بني.
    note: جملة نموذجية بضمير المتكلم تستخدم *Mam ...*، جاهزة لإعادة استخدامها عند وصف مظهرك.
  pl.a1.unit25.lesson06.teach.marek_patrz_czy:
    title: Marek يلمح Nina
    gloss: 'Marek: انظري، هل هذه Nina؟ شعرها أشقر قصير وعيناها خضراوان.'
    note: '*Patrz* (انظر) فعل أمر من *patrzeć*. السؤال *Czy to Nina?* يعني «هل هذه Nina؟»'
  pl.a1.unit25.lesson06.teach.ewa_tak_to:
    title: Ewa تؤكد
    gloss: 'Ewa: نعم، هذه Nina!'
    note: تأكيد قصير وطبيعي.
  pl.a1.unit25.lesson06.teach.nina_czesc_jestes:
    title: Nina تحيّي Marek
    gloss: 'Nina: مرحبًا، هل أنت Marek؟'
    note: 'سؤال تحية بسيط وغير رسمي. بعد الفعل *być* يأتي الاسم في حالة الأداة: *jesteś Markiem?*'
  pl.a1.unit25.lesson06.teach.marek_tak_milo:
    title: Marek يردّ التحية على Nina
    gloss: 'Marek: نعم! تشرّفت بمعرفتك يا Nina.'
    note: '*Miło cię poznać* هي العبارة المعتادة عند اللقاء الأول («تشرفت بمعرفتك»؛ ومعنى *poznać* «تعرّف على»). تُنادى Nina بصيغة النداء: *Nino*.'
  pl.a1.unit25.lesson06.teach.nina_ciebie_tez:
    title: Nina تردّ التحية
    gloss: 'Nina: تشرفت بمعرفتك أنا أيضًا!'
    note: تُختتم المحادثة؛ فقد تعرّف Marek على Nina من وصف Ewa السابق.
