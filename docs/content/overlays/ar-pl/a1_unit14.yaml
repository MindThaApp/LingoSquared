teaching:
  pl.a1.unit14.lesson01.teach.mlody:
    title: شاب
    gloss: شاب
    note: صفة وصفية أساسية، وهي نقطة البداية لصيغ المقارنة في هذه الوحدة.
    example_gloss: ماريك شاب.
  pl.a1.unit14.lesson01.teach.stary:
    title: كبير في السن
    gloss: كبير في السن
    note: عكس młody، وهي صفة أخرى ستحوّلها هذه الوحدة إلى صيغة مقارنة.
    example_gloss: الجد كبير في السن.
  pl.a1.unit14.lesson01.teach.comparative_formation_note:
    title: 'صنع المقارنة: أضف -szy'
    gloss: 'في الصفات القصيرة مثل stary وmłody تغيّر النهاية -y إلى -szy: تصبح stary إلى starszy، وmłody إلى młodszy. ليست كل الصفات تعمل بهذه الطريقة.'
    note: 'نمط بسيط لهاتين الكلمتين: احذف *-y* الأخيرة وأضف *-szy* لتحصل على صيغة المقارنة. كثير من الصفات الأخرى تستعمل نهاية مختلفة، فلا تطبّق هذه القاعدة على كل شيء.'
  pl.a1.unit14.lesson01.teach.starszy_starsza:
    title: أكبر سنًا
    gloss: أكبر سنًا
    note: تُستعمل Starszy للمذكر (أو on)، وstarsza للمؤنث (أو ona)، وهي صيغة المقارنة من stary.
    example_gloss:
    - الجد أكبر سنًا من الأب.
    - الجدة أكبر سنًا من الأم.
  pl.a1.unit14.lesson01.teach.mlodszy_mlodsza:
    title: أصغر سنًا
    gloss: أصغر سنًا
    note: Młodszy للمذكر وmłodsza للمؤنث، وهي صيغة المقارنة من młody.
    example_gloss:
    - الأب أصغر سنًا من الجد.
    - الأم أصغر سنًا من الجدة.
  pl.a1.unit14.lesson01.teach.niz:
    title: من
    gloss: من (في المقارنة)
    note: تربط Niż بين الشيئين المقارَنين، وتبقى الكلمة التي بعد niż في صيغتها الأساسية العادية.
    example_gloss: الابن أصغر سنًا من الأب.
  pl.a1.unit14.lesson01.teach.gender_agreement_note:
    title: صيغ التفضيل تتفق مع الجنس
    gloss: تتغير Starszy/starsza وmłodszy/młodsza بحسب الجنس، تمامًا مثل byłem/byłam. يُستعمل starszy وmłodszy للرجل (on)، وstarsza وmłodsza للمرأة (ona).
    note: 'النمط نفسه في *byłem*/*byłam*: تتغير النهاية بحسب ما إذا كنت تتحدث عن رجل أو عن امرأة.'
  pl.a1.unit14.lesson01.teach.ewa_starsza:
    title: Ewa أكبر سنًا من Marek
    gloss: Ewa أكبر سنًا من Marek.
    note: 'معلومة حقيقية عن شخصيتينا: عمر Ewa اثنان وثلاثون عامًا، وعمر Marek ثمانية وعشرون.'
  pl.a1.unit14.lesson01.teach.marek_mlodszy:
    title: Marek أصغر سنًا من Ewa
    gloss: Marek أصغر سنًا من Ewa.
    note: المعلومة نفسها، لكن بصياغة معاكسة.
  pl.a1.unit14.lesson02.teach.dobry_recap:
    title: 'Good مرة أخرى: dobry'
    gloss: 'Dobry (جيد): عرفتَ هذه الكلمة من قبل في Dzień dobry.'
    note: هو الصفة نفسها التي رأيتها منذ الوحدة الأولى، وتُستعمل الآن لتكوين صيغة التفضيل.
  pl.a1.unit14.lesson02.teach.zly:
    title: سيئ
    gloss: سيئ
    note: عكس dobry، وهي كلمة جديدة تمامًا في هذه الوحدة.
    example_gloss: هذا يوم سيئ.
  pl.a1.unit14.lesson02.teach.irregular_comparative_note:
    title: Dobry وzły صفتان شاذتان
    gloss: 'Dobry وzły صفتان شاذتان: تصبح dobry على صيغة lepszy، وتصبح zły على صيغة gorszy، ولا تُضاف -szy.'
    note: بخلاف *stary*/*młody*، لا تتبع هاتان الصفتان نمط *-szy* المنتظم، بل يجب حفظ صيغتَي التفضيل لهما.
  pl.a1.unit14.lesson02.teach.lepszy_lepsza:
    title: أفضل
    gloss: أفضل
    note: تُستعمل Lepszy للمذكر، وlepsza للمؤنث (أو لكلمة مؤنثة مثل kawa)، وهي صيغة التفضيل الشاذة من dobry.
    example_gloss:
    - هو أفضل مني.
    - القهوة أفضل من الشاي.
  pl.a1.unit14.lesson02.teach.gorszy_gorsza:
    title: أسوأ
    gloss: أسوأ
    note: Gorszy/gorsza هي صيغة التفضيل الشاذة من zły.
    example_gloss:
    - هو أسوأ مني.
    - الشاي أسوأ من القهوة.
  pl.a1.unit14.lesson02.teach.kawa_herbata_recap:
    title: القهوة والشاي مرة أخرى
    gloss: 'Kawa وherbata: عرفتَ هاتين الكلمتين من الدرس السابق عن المشروبات.'
    note: تذكير سريع قبل أن يضعهما هذا الدرس في مقارنة.
  pl.a1.unit14.lesson02.teach.gender_note_recap:
    title: النمط نفسه كما سبق
    gloss: تتغير Lepszy/lepsza وgorszy/gorsza بحسب الجنس بالطريقة نفسها التي تغيرت بها starszy/starsza في الدرس السابق.
    note: التفريق نفسه بين المذكر والمؤنث الذي تعلمته للتو، مطبقًا على زوج جديد من الكلمات.
  pl.a1.unit14.lesson03.teach.pronouns_recap:
    title: أنا، أنا (فعل الكينونة)، أنتَ
    gloss: 'Ja وjestem وty: عرفتَ هذه الكلمات من الدروس السابقة.'
    note: تذكير سريع قبل حوار هذا الدرس.
  pl.a1.unit14.lesson03.teach.tak_nie_dobrze_recap:
    title: نعم، لا، حسنًا
    gloss: 'Tak وnie وdobrze: كلمات مألوفة لديك أيضًا.'
    note: تذكير سريع آخر قبل الحوار.
  pl.a1.unit14.lesson03.teach.ale_recap:
    title: لكن، مرة أخرى
    gloss: 'Ale (لكن): عرفتَ هذه الكلمة من الدروس السابقة. وهي تربط بين جملتين متعارضتين.'
    note: أداة ربط قصيرة تُبرز التعارض، مثل «لكن» في العربية.
  pl.a1.unit14.lesson03.teach.dialogue.line01:
    title: Marek يقول إن الشاي أفضل
    gloss: الشاي أفضل من القهوة!
    note: يبدأ Marek برأيه الخاص، وهو يوافق ما قاله لنا في درس التفضيلات.
  pl.a1.unit14.lesson03.teach.dialogue.line02:
    title: Ewa تعترض
    gloss: لا، لا! القهوة أفضل من الشاي!
    note: تردّ Ewa برأيها الخاص، وهو أيضًا يوافق ما قالته سابقًا.
  pl.a1.unit14.lesson03.teach.dialogue.line03:
    title: Marek يغيّر الموضوع إلى العمر
    gloss: حسنًا، حسنًا. لكنني أصغر منك سنًا!
    note: يتخلى Marek عن الجدال حول المشروبات، ويطرح أمرًا هو واثق منه.
  pl.a1.unit14.lesson03.teach.dialogue.line04:
    title: Ewa توافق، وتعيد رأيها
    gloss: نعم، أنا أكبر سنًا. لكن القهوة أفضل!
    note: تؤكد Ewa معلومة العمر، ثم تعود إلى رأيها الخاص في القهوة.
