teaching:
  pl.a1.unit09.lesson01.teach.isc_dojsc:
    title: يذهب، يصل إلى
    gloss: يذهب؛ يصل إلى
    note: 'فعلا حركة متقاربان: iść هو «ذهب/مشى» عمومًا، أما dojść فيعني تحديدًا «بلغ/وصل إلى» وجهة، ويُستعمل في نمط السؤال الذي يعلّمه هذا الدرس.'
    example_gloss:
    - تفضّل بالسير إلى الأمام مباشرة.
    - كيف أصل إلى المصرف؟
  pl.a1.unit09.lesson01.teach.prosto:
    title: إلى الأمام مباشرة
    gloss: إلى الأمام مباشرة
    note: أبسط كلمة للاتجاه، وتُستعمل بعد iść مباشرة لتعني «سر مباشرة».
    example_gloss: تفضّل بالسير مباشرة إلى المتنزه.
  pl.a1.unit09.lesson01.teach.tam_potem:
    title: هناك، ثم
    gloss: هناك؛ ثم
    note: تشير Tam إلى مكان؛ وتُرتّب potem الخطوات («أولًا هذا ثم ذاك»)، وكلتاهما أساسية لربط الإرشادات.
    example_gloss:
    - المصرف هناك.
    - ثم تفضّل بالسير مباشرة.
  pl.a1.unit09.lesson01.teach.prosze_bezokolicznik:
    title: Please + infinitive
    gloss: 'من فضلك + المصدر — Proszę (من فضلك) مع فعل في صيغة المصدر (صيغة المعجم) هي الطريقة المهذبة اليومية لإعطاء اتجاه دون صيغة أمر مستقلة: تفضّل بالسير إلى الأمام مباشرة.'
    note: '*Proszę* مع فعل في صيغة المصدر هي الطريقة المهذبة في البولندية لطلب أمر ما من شخص — *Proszę iść prosto* («تفضّل بالسير مباشرة»). وهي الخيار الآمن المهذب مع الغريب، فلا تحتاج إلى صيغة الأمر لإعطاء الاتجاهات أو فهمها. (بين الأصدقاء يستعمل المتحدثون بالبولندية عادةً صيغة الأمر تلك، وستتعرف عليها لاحقًا.)'
  pl.a1.unit09.lesson01.teach.jak_dojsc_note:
    title: كيف أصل إلى + [مكان]؟
    gloss: 'كيف أصل إلى + [مكان]؟ — Jak (كيف) مع dojść (يصل إلى) تسأل عن الطريق إلى مكان: كيف أصل إلى المصرف؟ كيف أصل إلى الفندق؟ كيف أصل إلى المتنزه؟ يأخذ الاسم بعد do نهاية المضاف إليه -u نفسها كما بعد «بجانب»/«مقابل» في الوحدة السابقة: bank ← banku، hotel ← hotelu، park ← parku.'
    note: '*Jak dojść do...?* هو السؤال اليومي عن كيفية الوصول إلى مكان. يأخذ اسم المكان بعد *do* نهاية المضاف إليه *-u* نفسها التي تعلمتها بعد *obok*/*naprzeciwko* — تصبح *bank* هي *banku*، و*hotel* هي *hotelu*، و*park* هي *parku*، النمط نفسه تمامًا بعد حرف جر جديد.'
  pl.a1.unit09.lesson01.teach.jak_dojsc_do_banku:
    title: كيف أصل إلى المصرف؟
    gloss: كيف أصل إلى المصرف؟
    note: تطبيق نمط ملاحظة القواعد على أول وجهة في هذا الدرس.
  pl.a1.unit09.lesson02.teach.prawo_lewo:
    title: يمين، يسار
    gloss: يمين؛ يسار
    note: تُستعمل بعد na لبيان مكان شيء ما أو جهة الانعطاف — na prawo (إلى اليمين)، na lewo (إلى اليسار).
    example_gloss:
    - المصرف على اليمين.
    - المتنزه على اليسار.
  pl.a1.unit09.lesson02.teach.skrecic:
    title: ينعطف
    gloss: يتجه (ينعطف)
    note: الفعل الدال على تغيير الاتجاه، ويقترن بـ na prawo/na lewo ليعني «انعطف يمينًا»/«انعطف يسارًا».
    example_gloss: تفضّل بالانعطاف يمينًا.
  pl.a1.unit09.lesson02.teach.skrecic_na_lewo:
    title: من فضلك، انعطف يسارًا
    gloss: من فضلك، انعطف يسارًا.
    note: النمط نفسه Proszę + المصدر، وهذه المرة مع skręcić وna lewo.
  pl.a1.unit09.lesson02.teach.ulica:
    title: شارع
    gloss: الشارع
    note: كلمة عادية لأي شارع، وهي مفيدة كلما ذُكر شارع باسمه في الإرشادات.
    example_gloss: الشارع هناك.
  pl.a1.unit09.lesson02.teach.multi_step_note:
    title: ربط الإرشادات بكلمة potem
    gloss: 'Proszę iść prosto, potem skręcić na prawo. -- يمكن ربط عدة إرشادات بفاصلة وبكلمة potem (ثم): أولًا خطوة واحدة، ثم الخطوة التالية.'
    note: 'لإعطاء أكثر من إرشاد متتابع، اربطها بفاصلة وكلمة *potem*: *Proszę iść prosto, potem skręcić na prawo* («من فضلك، اذهب مباشرةً ثم انعطف يمينًا»). ستسمع الإرشادات الحقيقية المكوّنة من عدة خطوات مبنية بهذه الطريقة تمامًا.'
  pl.a1.unit09.lesson03.teach.rozumiem:
    title: أفهم
    gloss: أفهم
    note: طريقة مفيدة لتأكيد أنك فهمت الإرشادات قبل أن تطرح سؤالًا آخر.
    example_gloss: أفهم، شكرًا.
  pl.a1.unit09.lesson03.teach.dialogue.line01:
    title: تسأل إيفا كيف تصل إلى الحديقة
    gloss: تقول إيفا «عفوًا» وتسأل كيف تصل إلى الحديقة.
    note: تفتتح Przepraszam السؤال، وهي عادة المجاملة نفسها في حوار الأماكن في الوحدة السابقة.
  pl.a1.unit09.lesson03.teach.dialogue.line02:
    title: أحد المارّة يشرح الطريق إلى الحديقة
    gloss: 'يقول المارّ: اذهب مباشرةً ثم انعطف يسارًا. الحديقة هناك.'
    note: إرشادان متتابعان باستخدام potem، تمامًا كما تصف ملاحظة القواعد في هذا الدرس.
  pl.a1.unit09.lesson03.teach.dialogue.line03:
    title: تؤكد إيفا فهمها وتسأل عن المصرف
    gloss: تقول إيفا إنها فهمت، وتسأل كيف تصل إلى المصرف.
    note: تؤكد Rozumiem أنها تابعت المجموعة الأولى من الإرشادات قبل أن تطرح سؤالًا جديدًا.
  pl.a1.unit09.lesson03.teach.dialogue.line04:
    title: المارّ يشرح الطريق إلى المصرف
    gloss: 'يقول المارّ: انعطف يمينًا ثم اذهب مباشرةً. المصرف على اليمين.'
    note: طريق مختلف من خطوتين عن طريق الحديقة، مع إعادة استخدام النمط نفسه Proszę + المصدر.
  pl.a1.unit09.lesson03.teach.dialogue.line05:
    title: تشكر إيفا
    gloss: تقول إيفا شكرًا جزيلًا.
    note: Dziękuję bardzo، عبارة سبق أن مرّت في وحدتي التسوّق والأماكن.
  pl.a1.unit09.lesson03.teach.dialogue.line06:
    title: المارّ يردّ
    gloss: 'يقول المارّ: عفوًا، لا شكر على واجب.'
    note: Proszę bardzo، الرد المعتاد على الشكر، وقد مرّت في وحدات سابقة.
