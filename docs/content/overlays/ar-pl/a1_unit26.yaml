    gloss: '*Wyprowadzać* (الصيغة غير التامة) تصف عادة: *Codziennie wyprowadzam psa.* أما الصيغة التامة *wyprowadzić* فتُستخدم لنزهة واحدة منتهية.'
    note: 'أزواج الصيغ: الصيغة غير التامة (*wyprowadzać*) للأمر المتكرر، والصيغة التامة (*wyprowadzić*) لفعل واحد مكتمل.'
