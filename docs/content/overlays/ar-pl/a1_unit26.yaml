    note: يقابل بين حب الحيوان وامتلاكه فعلًا، وهذا هو الهدف التواصلي للوحدة.
    glosses:
      kochają: يحب
      oboje: كلاهما
      zwierzęta: حيوانات
      zwierzaka: حيوان أليف
      psy: كلاب
      koty: قطط
