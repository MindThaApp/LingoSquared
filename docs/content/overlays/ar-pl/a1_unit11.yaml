teaching:
  pl.a1.unit11.lesson01.teach.chciec_chce:
    title: أن تريد، أريد
    gloss: يريد؛ أريد
    note: Chcieć هي صيغة المصدر، أما chcę فهي صيغة المتكلم اليومية التي تستخدمها لتقول ما تريده.
    example_gloss: أريد الذهاب إلى السينما.
  pl.a1.unit11.lesson01.teach.chcesz:
    title: أنت تريد
    gloss: أنت تريد (بصيغة غير رسمية)
    note: Chcesz هي صيغة المخاطب غير الرسمية، وتُستخدم مثل masz وjesteś، وهي ما ستستخدمه لتسأل صديقًا عمّا يريده.
    example_gloss: هل تريد قهوة؟
  pl.a1.unit11.lesson01.teach.chciec_osoba_note:
    title: أريد، تريد
    gloss: 'Chcę وchcesz: النمط نفسه مثل masz (يملك) وjesteś (يكون). chcesz هي صيغة المخاطب (الشخص الثاني)، وتُستخدم عندما تسأل شخصًا آخر عمّا يريده.'
    note: 'تحتاج هذه الوحدة إلى أكثر من ضمير المتكلم: فـ *chcę* (أريد) و*chcesz* (تريد) تتبعان نمط الشخص نفسه الذي تعرفه من *masz* و*jesteś*، لكن مع فعل جديد.'
  pl.a1.unit11.lesson01.teach.kino:
    title: السينما
    gloss: سينما
    note: الكلمة اليومية للسينما، وتتكرر كثيرًا عند وضع الخطط.
    example_gloss: هذه سينما.
  pl.a1.unit11.lesson01.teach.razem:
    title: معًا
    gloss: معًا
    note: 'تعني razem أيضًا «المجموع» في سياق التسوّق (ربما تتذكرها من وحدة التسوّق)، لكنها هنا بمعناها اليومي الآخر: «معًا».'
    example_gloss: هل تريد أن نذهب معًا؟
  pl.a1.unit11.lesson01.teach.czy_chcesz_isc_do_kina:
    title: هل تريد الذهاب إلى السينما؟
    gloss: هل تريد الذهاب إلى السينما؟
    note: تفتتح Czy سؤالًا جوابه نعم أو لا، وتسأل chcesz iść do kina عمّا يريد الشخص الآخر أن يفعله، وهي الطريقة الأساسية لاقتراح خطة.
  pl.a1.unit11.lesson01.teach.czy_chcesz_isc_razem_do_kina_w_piatek:
    title: هل تريد أن نذهب معًا إلى السينما يوم الجمعة؟
    gloss: هل تريد أن نذهب معًا إلى السينما يوم الجمعة؟
    note: 'الاقتراح الكامل: أُضيفت razem (معًا) وw piątek (يوم الجمعة) إلى السؤال الذي تعلمته للتو.'
  pl.a1.unit11.lesson02.teach.moc_moge:
    title: أن تستطيع، أستطيع
    gloss: يستطيع / يمكنه؛ أستطيع
    note: Móc هي صيغة المصدر، وmogę هي صيغة المتكلم. ربما تتذكر możemy («نستطيع») من وحدتي التاريخ والوقت السابقتين، وهو الفعل نفسه لكن بصيغة المفرد.
    example_gloss: أستطيع المجيء يوم الجمعة.
  pl.a1.unit11.lesson02.teach.mozesz:
    title: أنت تستطيع
    gloss: أنت تستطيع (بصيغة غير رسمية)
    note: Możesz هي صيغة المخاطب غير الرسمية، وهي نمط الشخص الثاني نفسه في chcesz، وتُستخدم لتسأل هل يستطيع شخص آخر فعل شيء ما.
    example_gloss: هل يناسبك يوم السبت؟
  pl.a1.unit11.lesson02.teach.przyjsc:
    title: المجيء
    gloss: المجيء
    note: هذا هو الفعل المستخدم للمجيء للقاء أحد، ويأتي طبيعيًا مع mogę/możesz لتقول من يستطيع الحضور ومن لا يستطيع.
    example_gloss: أريد المجيء يوم الجمعة.
  pl.a1.unit11.lesson02.teach.moc_note:
    title: أستطيع، تستطيع
    gloss: 'Móc: mogę وmożesz، وهو الشخص الثاني (أنت) نفسه كما في chcesz. تدل mogę مع فعل بصيغة المصدر على ما تستطيع فعله: mogę przyjść (أستطيع المجيء)، mogę iść (أستطيع الذهاب).'
    note: 'تدل *mogę* مع فعل بصيغة المصدر على ما تستطيع فعله: *mogę przyjść* («أستطيع المجيء») و*mogę iść* («أستطيع الذهاب») يتبعان النمط البسيط نفسه.'
  pl.a1.unit11.lesson02.teach.chetnie:
    title: بكل سرور
    gloss: بكل سرور
    note: طريقة دافئة ومتحمسة لقبول خطة، وكثيرًا ما تأتي مع tak (نعم) أو bardzo (جدًا) لمزيد من الحرارة.
    example_gloss: نعم، بكل سرور!
  pl.a1.unit11.lesson02.teach.niestety:
    title: للأسف
    gloss: للأسف
    note: هي عبارة التلطيف الطبيعية لرفض خطة بأدب، ويليها في الغالب nie mogę (لا أستطيع).
    example_gloss: للأسف، لا أستطيع.
  pl.a1.unit11.lesson02.teach.w_sobote_note:
    title: يوم السبت
    gloss: 'W + اليوم من أيام الأسبوع: الأيام المذكّرة (piątek وponiedziałek وczwartek) لا تتغير نهايتها: w piątek. أما الأيام المؤنثة (sobota وśroda وniedziela) فتأخذ نهاية المفعول به -ę، مثل kawa ← kawę: w sobotę.'
    note: لا تسير كل الأيام على النمط نفسه بعد *w*؛ فأسماء الأيام المؤنثة مثل *sobota* تصبح *sobotę*، وهي النهاية نفسها التي تعلمتها من قبل، أي تحويل *-a* إلى *-ę*، كما في *kawa* و*kawę* وفي *herbata* و*herbatę*. أما الأيام المذكرة مثل *piątek* فتبقى كما هي تمامًا.
  pl.a1.unit11.lesson02.teach.czy_mozesz_przyjsc_w_sobote:
    title: هل تستطيع المجيء يوم السبت؟
    gloss: هل تستطيع المجيء يوم السبت؟
    note: تجمع هذه الجملة بين możesz وprzyjść وصيغة w sobotę الجديدة، وهي طريقة كاملة للسؤال عن يوم بديل.
  pl.a1.unit11.lesson03.teach.moze:
    title: ربما، ما رأيك في
    gloss: ربما / ما رأيك في
    note: هذه هي الكلمة المستخدمة لاقتراح بديل، وتظهر كلما لم تنجح الخطة الأولى وأردت اقتراح شيء آخر.
    example_gloss: ما رأيك في يوم السبت؟
  pl.a1.unit11.lesson03.teach.moze_vs_moge_note:
    title: Może مقابل mogę
    gloss: 'تبدو może وmogę متشابهتين لكنهما تعنيان شيئين مختلفين: تقترح może («ربما») شيئًا جديدًا، أما mogę (صيغة المتكلم من الفعل، «أستطيع») فتدل على ما تستطيع فعله.'
    note: 'من السهل الخلط بينهما كتابةً: *może* («ربما»، وتُستخدم هنا لاقتراح شيء) و*mogę* («أستطيع»، فعل بصيغة المتكلم) تؤديان وظيفتين مختلفتين في الجملة رغم أنهما من الجذر نفسه، فانتبه إلى الحرف الأخير.'
  pl.a1.unit11.lesson03.teach.o_ktorej_godzinie:
    title: في أي ساعة؟
    gloss: في أي ساعة؟
    note: هي الطريقة المعتادة للسؤال عن وقت محدد بعد الاتفاق على اليوم. ربما تتذكر o której من وحدة الوقت السابقة.
  pl.a1.unit11.lesson03.teach.dialogue.line01:
    title: إيفا تقترح الذهاب إلى السينما
    gloss: تسأل إيفا ماريك هل يريد الذهاب إلى السينما يوم الجمعة.
    note: تعيد هذه الجملة أول سؤال تعلمته في هذه الوحدة، لكن داخل محادثة حقيقية.
  pl.a1.unit11.lesson03.teach.dialogue.line02:
    title: ماريك لا يستطيع يوم الجمعة
    gloss: يقول ماريك إنه للأسف لا يستطيع يوم الجمعة.
    note: تخفف niestety من وقع الرفض قبل أن تعبّر nie mogę عنه بوضوح.
  pl.a1.unit11.lesson03.teach.dialogue.line03:
    title: ماريك يقترح يوم السبت
    gloss: 'يسأل ماريك: ما رأيك في يوم السبت؟'
    note: تقدّم może بديلًا بدل إنهاء المحادثة بالرفض فقط.
  pl.a1.unit11.lesson03.teach.dialogue.line04:
    title: إيفا توافق بسرور
    gloss: 'تقول إيفا: يوم السبت؟ بكل سرور!'
    note: تردد اليوم المقترح (مع الإبقاء على صيغة w sobotę) قبل القبول بـ chętnie.
  pl.a1.unit11.lesson03.teach.dialogue.line05:
    title: إيفا تسأل عن الساعة
    gloss: 'تسأل إيفا: في أي ساعة؟'
    note: بعد تحديد اليوم، يبقى آخر تفصيل وهو الوقت.
  pl.a1.unit11.lesson03.teach.dialogue.line06:
    title: ماريك يؤكد الوقت
    gloss: 'يقول ماريك: في الرابعة بعد الظهر.'
    note: تُختتم المحادثة بوقت محدد متفق عليه، مع إعادة استخدام نمط الساعة من وحدتي الوقت والروتين السابقتين.
