teaching:
  pl.a1.unit24.lesson01.teach.czytac_uprawiac_sport:
    title: القراءة، ممارسة الرياضة، الطبخ
    gloss: يقرأ، يمارس الرياضة، يطبخ
    note: 'ثلاثة أفعال شائعة للهوايات: *czytać* (يقرأ)، و*uprawiać sport* (يمارس الرياضة)، و*gotować* (يطبخ).'
    example_gloss:
    - أحب قراءة كتاب.
    - أمارس الرياضة أيام السبت.
    - أحب الطبخ للأصدقاء.
  pl.a1.unit24.lesson01.teach.wolny_czas:
    title: وقت الفراغ
    gloss: وقت الفراغ
    note: '*Wolny czas* عبارة أساسية للحديث عن الهوايات. الصفة *wolny* (فارغ، حر) تتفق مع الاسم المذكر *czas*؛ وفي *w wolnym czasie* كلتاهما في حالة المكان.'
    example_gloss: في وقت فراغي، أحب القراءة.
  pl.a1.unit24.lesson01.teach.w_wolnym_czasie:
    title: قول ما تفعله في وقت فراغك
    gloss: في وقت فراغي، أحب القراءة.
    note: 'بعد *Lubię* (أحب) يأتي الفعل في صيغة المصدر: *lubię czytać*. وتتكوّن *W wolnym czasie* من *w* + حالة المكان.'
  pl.a1.unit24.lesson02.teach.sluchac_muzyki_rysowac:
    title: الموسيقى، الرسم، ألعاب الفيديو
    gloss: يستمع إلى الموسيقى، يرسم، يلعب ألعاب الفيديو
    note: 'ثلاث هوايات أخرى: *słuchać muzyki* (يستمع إلى الموسيقى)، و*rysować* (يرسم)، و*grać w gry* (يلعب الألعاب).'
    example_gloss:
    - أحب الاستماع إلى الموسيقى.
    - أرسم في كثير من الأحيان.
    - أحب لعب ألعاب الفيديو مع الأصدقاء.
  pl.a1.unit24.lesson02.teach.lubie_sluchac_muzyki:
    title: قول إنك تحب الاستماع إلى الموسيقى
    gloss: أحب الاستماع إلى الموسيقى.
    note: 'الفعل *Słuchać* يأتي دائمًا مع حالة الإضافة: *słucham muzyki* وليس *muzyka*.'
  pl.a1.unit24.lesson02.teach.lubie_grac_w:
    title: قول إنك تحب لعب ألعاب الفيديو مع الأصدقاء
    gloss: أحب لعب ألعاب الفيديو مع الأصدقاء.
    note: تتكوّن *Z przyjaciółmi* (مع الأصدقاء) من *z* + جمع في حالة الأداة.
  pl.a1.unit24.lesson03.teach.zawsze_czesto_czasami:
    title: دائمًا، غالبًا، أحيانًا، أبدًا
    gloss: دائمًا، غالبًا، أحيانًا، أبدًا
    note: 'ظروف التكرار الأربعة الأساسية: *zawsze* و*często* و*czasami* و*nigdy*. لا تتغير صيغتها أبدًا، وتتطلب *nigdy* وجود *nie* قبل الفعل: *Nigdy nie gram.*'
    example_gloss:
    - أمارس الرياضة دائمًا أيام السبت.
    - غالبًا ما أقرأ كتابًا.
    - أرسم أحيانًا.
    - لا ألعب ألعاب الفيديو أبدًا.
  pl.a1.unit24.lesson03.teach.co_tydzien_co:
    title: كل أسبوع، كل عطلة أسبوع
    gloss: كل أسبوع، كل عطلة أسبوع
    note: '*Co tydzień* و*co weekend* تعنيان «كل ...»؛ بعد *co* يأتي المفعول به في حالة النصب، وco لا تتغير أبدًا - انظر البطاقة التالية.'
    example_gloss:
    - أطبخ للأصدقاء كل أسبوع.
    - أمارس الرياضة كل نهاية أسبوع.
  pl.a1.unit24.lesson03.teach.co_biernik_co:
    title: Co + حالة النصب
    gloss: '*Co* + حالة النصب تعني «كل»: كل أسبوع، كل عطلة أسبوع، كل شهر.'
    note: '*Co* كلمة ثابتة تعني «كل» مهما كان الاسم. والأسماء المذكرة غير الحية مثل *tydzień* و*weekend* و*miesiąc* تبقى بالصورة نفسها في حالة الفاعل وحالة النصب.'
  pl.a1.unit24.lesson03.teach.co_robisz_w:
    title: السؤال عن وقت الفراغ
    gloss: ماذا تفعل في وقت فراغك؟
    note: هذا هو السؤال الأساسي في هذه الوحدة، استخدمه لتسأل أي شخص عن هواياته.
  pl.a1.unit24.lesson04.teach.ewa_czesto_razem:
    title: Ewa تفتح موضوع الهوايات
    gloss: 'Ewa: نتمشى معًا كثيرًا. لكن ماذا تفعل أيضًا في وقت فراغك يا Marek؟'
    note: '*Spacerujemy* هي صيغة *my* (نحن) من *spacerować*؛ و*Marku* هي صيغة النداء، وتُستعمل عند مخاطبة شخص مباشرة.'
  pl.a1.unit24.lesson04.teach.marek_lubie_gotowac:
    title: هوايات Marek
    gloss: 'Marek: أحب الطبخ، حتى في البيت. وأمارس الرياضة كثيرًا.'
    note: '*Także w domu* (في البيت أيضًا) تدل على أن Marek يطبخ للمتعة، وليس فقط في عمله في المطعم؛ و*w domu* في حالة المكان.'
  pl.a1.unit24.lesson04.teach.ewa_gotujesz_tez:
    title: Ewa تتفاجأ
    gloss: 'Ewa: تطبخ في البيت أيضًا؟ أنت تطبخ اليوم كله في العمل أصلًا!'
    note: '*Cały dzień* (اليوم كله) تؤكد كم يطبخ Marek في العمل أصلًا؛ و*przecież* تضيف معنى «أصلًا» أو «ألست كذلك؟».'
  pl.a1.unit24.lesson04.teach.marek_tak_ale:
    title: Marek يشرح
    gloss: 'Marek: نعم، لكن الطبخ يريحني. وأنتِ، ماذا تحبين أن تفعلي؟'
    note: '*Gotowanie mnie odpręża* تعني حرفيًا «الطبخ يريحني»: كثيرًا ما تجعل البولندية النشاط هو الفاعل، وتضع *mnie* (ي) في حالة النصب.'
  pl.a1.unit24.lesson04.teach.ewa_lubie_czytac:
    title: هوايات Ewa
    gloss: 'Ewa: أحب القراءة وكثيرًا ما أستمع إلى الموسيقى.'
    note: تجمع هذه الجملة فعلين للهوايات من الدرسين الأول والثاني باستخدام *i* (و).
  pl.a1.unit24.lesson04.teach.marek_grasz_tez:
    title: Marek يسأل عن الألعاب
    gloss: 'Marek: هل تلعبين الألعاب أيضًا؟'
    note: سؤال قصير جوابه نعم أو لا يستعمل *grać w gry* من الدرس الثاني؛ و*też* تعني «أيضًا».
  pl.a1.unit24.lesson04.teach.ewa_nie_nigdy:
    title: Ewa تجيب
    gloss: 'Ewa: لا، لا ألعب الألعاب أبدًا. لكنني أرسم أحيانًا!'
    note: '*Nigdy* (أبدًا) و*czasami* (أحيانًا) من الدرس الثالث، في إجابة واحدة تُظهر التقابل بينهما. لاحظ النفي المزدوج: *nigdy nie gram*.'
  pl.a1.unit24.lesson05.teach.marek_i_ja:
    title: مقارنة الهوايات
    gloss: أنا وMarek نتمشى معًا كثيرًا. لكن لدينا هوايات أخرى أيضًا. Marek يحب الطبخ، حتى في البيت، ويمارس الرياضة كثيرًا. أما أنا فأحب القراءة وكثيرًا ما أستمع إلى الموسيقى. أرسم أحيانًا، لكنني لا ألعب الألعاب أبدًا. ماذا تحب أن تفعل في وقت فراغك؟
    note: رسالة Ewa تلخّص ما ورد في الدروس السابقة، وتنتهي بسؤال القارئ السؤال الأساسي في هذه الوحدة.
    glosses:
      spacerujemy: يتنزه
      często: في كثير من الأحيان
      razem: معًا
      inne: أخرى
      gotować: يطبخ
      lubi: يحب
      domu: في البيت
      uprawia: يمارس الرياضة
      czytać: القراءة
      słucham: أستمع
      muzyki: موسيقى
      rysuję: أرسم
      czasami: أحيانًا
      gram: ألعب ألعاب الفيديو
      nigdy: أبدًا
      wolnym: فراغ
      czasie: وقت
  pl.a1.unit24.lesson06.teach.marek_co_robisz:
    title: Marek يسأل عن عطلة نهاية الأسبوع
    gloss: 'Marek: ماذا ستفعلين في عطلة نهاية الأسبوع هذه؟'
    note: تتكوّن *W ten weekend* (في عطلة نهاية الأسبوع هذه) من *w* + حالة النصب للتعبير عن الزمن.
  pl.a1.unit24.lesson06.teach.ewa_jeszcze_nie:
    title: Ewa لم تقرر بعد
    gloss: 'Ewa: لا أعرف بعد. أحب القراءة، لكنني أريد أيضًا أن أخرج إلى الخارج.'
    note: '*Wyjść na dwór* (يخرج إلى الخارج) طريقة شائعة للتعبير عن الرغبة في مغادرة البيت؛ و*chcę* + المصدر تعني «أريد أن».'
  pl.a1.unit24.lesson06.teach.marek_pojdziemy_razem:
    title: Marek يقترح خطة
    gloss: 'Marek: هل نذهب معًا في نزهة؟ وبعدها أطبخ لنا شيئًا.'
    note: '*Potem* (بعد ذلك) كلمة لترتيب الأحداث؛ و*ugotuję* بصيغة الفعل التام لأن الطبخ هنا نتيجة منتهية.'
  pl.a1.unit24.lesson06.teach.ewa_dobry_pomysl:
    title: Ewa توافق
    gloss: 'Ewa: فكرة جيدة! أحب المشي كما أحب الطبخ.'
    note: '*Lubię i ..., i ...* («أحب هذا وذاك») تدل على أن Ewa تحب الأمرين بالقدر نفسه، دون تفضيل أحدهما.'
  pl.a1.unit24.lesson06.teach.marek_swietnie_to:
    title: Marek يؤكد الموعد
    gloss: 'Marek: رائع. إذن نلتقي يوم السبت!'
    note: جملة ختام ودّية تؤكد الخطة ليوم السبت؛ و*w sobotę* هي *w* + حالة النصب مع أيام الأسبوع.
