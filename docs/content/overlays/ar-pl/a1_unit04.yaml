teaching:
  pl.a1.unit04.lesson01.teach.pierwsza_druga_trzecia:
    title: الساعة الواحدة والثانية والثالثة
    gloss: الساعة الواحدة؛ الساعة الثانية؛ الساعة الثالثة
    note: تُقال الساعة في البولندية بالأعداد الترتيبية المؤنثة، لأنها تتبع اسمًا مؤنثًا محذوفًا هو *godzina* («ساعة»)؛ فـ *pierwsza* تعني حرفيًا «الأولى (من الساعات)».
    example_gloss:
    - الساعة الواحدة.
    - الساعة الثانية.
    - الساعة الثالثة.
  pl.a1.unit04.lesson01.teach.czwarta_piata_szosta:
    title: الساعة الرابعة والخامسة والسادسة
    gloss: الساعة الرابعة؛ الساعة الخامسة؛ الساعة السادسة
    note: النمط نفسه للأعداد الترتيبية المؤنثة كما في *pierwsza* و*druga* و*trzecia*.
    example_gloss:
    - الساعة الرابعة.
    - الساعة الخامسة.
    - الساعة السادسة.
  pl.a1.unit04.lesson01.teach.siodma_osma_dziewiata:
    title: الساعة السابعة والثامنة والتاسعة
    gloss: الساعة السابعة؛ الساعة الثامنة؛ الساعة التاسعة
    note: الساعات الثلاث الوسطى من الاثنتي عشرة ساعة، على النمط نفسه.
    example_gloss:
    - الساعة السابعة.
    - الساعة الثامنة.
    - الساعة التاسعة.
  pl.a1.unit04.lesson01.teach.dziesiata_jedenasta_dwunasta:
    title: الساعة العاشرة والحادية عشرة والثانية عشرة
    gloss: الساعة العاشرة؛ الساعة الحادية عشرة؛ الساعة الثانية عشرة
    note: الساعات الثلاث الأخيرة، وبها تكتمل المجموعة من 1 إلى 12.
    example_gloss:
    - الساعة العاشرة.
    - الساعة الحادية عشرة.
    - الساعة الثانية عشرة.
  pl.a1.unit04.lesson01.teach.ktora_jest_godzina:
    title: السؤال عن الوقت
    gloss: كم الساعة؟
    note: 'حرفيًا: «أيّة هي الساعة؟». تتطابق *która* مع المؤنث *godzina*، وهو نمط التطابق نفسه الذي ستراه في هذه الوحدة كلها.'
  pl.a1.unit04.lesson01.teach.godzina_note:
    title: كلمة godzina مؤنثة
    gloss: نقول pierwsza وdruga وtrzecia، ولا نقول pierwszy وdrugi وtrzeci.
    note: '*Pierwszy* و*drugi* و*trzeci* هي صيغ المذكر لهذه الأعداد الترتيبية نفسها، وتُستعمل مع الأسماء المذكرة في مواضع أخرى من البولندية، لكنها لا تُستعمل أبدًا في قول الوقت، لأن *godzina* مؤنثة.'
  pl.a1.unit04.lesson02.teach.rano_poludnie_popoludniu:
    title: الصباح والظهر وبعد الظهر
    gloss: في الصباح؛ عند الظهر؛ بعد الظهر
    note: تأتي *Rano* وحدها دون حرف جر، أما *w południe* و*po południu* فلكل منهما حرف جر ثابت خاص به. من الأفضل حفظ هذه الثلاث كعبارات جاهزة بدل محاولة استنتاجها من قاعدة عامة.
    example_gloss:
    - في الصباح أشرب القهوة.
    - أتناول الغداء عند الظهر.
    - أعمل بعد الظهر.
  pl.a1.unit04.lesson02.teach.wieczorem_w_nocy:
    title: المساء والليل
    gloss: في المساء؛ في الليل
    note: '*Wieczorem* صيغة ظرفية ثابتة (دون حاجة إلى حرف جر)، أما *w nocy* فتجمع *w* مع حالة المكان (locative) من *noc* (الليل).'
    example_gloss:
    - في المساء أشاهد التلفاز.
    - في الليل أنام.
  pl.a1.unit04.lesson02.teach.o_ktorej_godzinie:
    title: السؤال عن الموعد
    gloss: في أي ساعة؟
    note: استعمل هذه العبارة بدل *Która jest godzina?* حين تسأل عن موعد حدوث شيء ما، لا عن الوقت الحالي.
  pl.a1.unit04.lesson02.teach.locative_hour_note:
    title: قول «في» ساعة معينة
    gloss: 'الساعة الرابعة، السابعة، العاشرة -- لكن: في الرابعة، في السابعة، في العاشرة.'
    note: 'بعد *o* («في» الزمنية)، تتحول نهاية كلمة الساعة *-a* إلى *-ej*: *czwarta* ← *o czwartej*، *siódma* ← *o siódmej*، *dziesiąta* ← *o dziesiątej*. تتبع كل الساعات النمط نفسه؛ والاستثناء الإملائي الوحيد هو *druga* ← *o drugiej*، إذ يُضاف حرف *i* بعد *g*.'
  pl.a1.unit04.lesson02.teach.ewa_wstaje:
    title: إيفا تستيقظ باكرًا
    gloss: تستيقظ إيفا في السابعة صباحًا.
    note: '*Wstaje* هي صيغة الغائب المفرد من الفعل *wstawać* (يستيقظ / ينهض).'
  pl.a1.unit04.lesson02.teach.pociag_odjezdza:
    title: موعد انطلاق القطار
    gloss: ينطلق القطار في الرابعة بعد الظهر.
    note: '*Odjeżdża* هي صيغة الغائب المفرد من الفعل *odjeżdżać* (يغادر / ينطلق).'
  pl.a1.unit04.lesson03.teach.spotkanie:
    title: اجتماع / لقاء
    gloss: اجتماع
    note: هي الكلمة نفسها التي مرت بك في الوحدة 3 (*Kiedy jest spotkanie?*)، حين اتفقت إيفا ومارك على يوم وتاريخ للقائهما مجددًا.
    example_gloss: الاجتماع يوم الجمعة.
  pl.a1.unit04.lesson03.teach.o_ktorej_mozemy_sie_spotkac:
    title: السؤال عن موعد اللقاء
    gloss: في أي ساعة يمكننا أن نلتقي يوم الجمعة، الخامس عشر من مايو؟
    note: تجمع هذه الجملة بين *o której godzinie* من هذه الوحدة واليوم والتاريخ من الوحدة 3؛ فقد اتفق إيفا ومارك على يوم الجمعة، الخامس عشر من مايو، ويحتاجان الآن إلى تحديد الساعة بدقة.
  pl.a1.unit04.lesson03.teach.moze_o_czwartej:
    title: اقتراح موعد
    gloss: ربما في الرابعة بعد الظهر؟
    note: تعني *Może* وحدها «ربما»، وهي طريقة لطيفة وطبيعية لاقتراح موعد.
  pl.a1.unit04.lesson03.teach.czwarta_mi_odpowiada:
    title: تأكيد أن الموعد مناسب
    gloss: الرابعة بعد الظهر مناسبة لي.
    note: 'هو النمط نفسه *[time] + mi + odpowiada* الذي ورد في *Piątek mi odpowiada* في الوحدة 3: الوقت نفسه هو المبتدأ في الجملة، والفعل *odpowiadać* يأتي دائمًا مع الشخص في حالة الجر بالمفعول غير المباشر (*mi*، أي «يناسبني»).'
  pl.a1.unit04.lesson03.teach.do_zobaczenia_o_czwartej:
    title: تأكيد الخطة كاملة
    gloss: أراك في الخامس عشر من مايو في الرابعة!
    note: تعيد استعمال عبارة الوداع *Do zobaczenia* من الوحدة 1، وقد جُمعت هنا مع تاريخ وساعة.
  pl.a1.unit04.lesson03.teach.dialogue.line01:
    title: إيفا تسأل عن الساعة
    gloss: تسأل إيفا مارك في أي ساعة يمكنهما اللقاء يوم الجمعة، الخامس عشر من مايو.
    note: هذا هو سؤال بداية الدرس نفسه تمامًا.
  pl.a1.unit04.lesson03.teach.dialogue.line02:
    title: مارك يقترح الرابعة عصرًا
    gloss: يقترح مارك الرابعة بعد الظهر.
    note: إنه اقتراح لطيف لا تأكيد قاطع، وهذا ما تدل عليه *może*.
  pl.a1.unit04.lesson03.teach.dialogue.line03:
    title: إيفا توافق
    gloss: تقول إيفا إن الرابعة بعد الظهر مناسبة لها.
    note: التركيب النحوي نفسه (حالة المفعول غير المباشر) الذي ورد في حوار «الجمعة مناسبة لي» في الوحدة 3.
  pl.a1.unit04.lesson03.teach.dialogue.line04:
    title: مارك يختم الاتفاق
    gloss: 'يقول مارك إن هذا رائع، ويودّعها: أراك في الخامس عشر من مايو في الرابعة!'
    note: تعيد *Świetnie* استعمال تعبير الحماس الذي ورد في الوحدة 3.
  pl.a1.unit04.lesson03.teach.dialogue.line05:
    title: إيفا تودّع
    gloss: تردّ إيفا بالوداع.
    note: 'أقصر خاتمة ممكنة: عبارة الوداع وحدها.'
