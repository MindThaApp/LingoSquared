teaching:
  pl.a1.unit17.lesson01.teach.jestem_zawod_note:
    title: أنا مهندس / معلّمة
    gloss: أنا مهندس. أنا معلّمة. — تتغير نهاية كلمتي inżynier وnauczycielka بعد Jestem.
    note: هذه أول مرة في هذه الدورة تتغير فيها نهاية الكلمة للدلالة على المهنة، وهي تنطبق حاليًا على كلمتي المهنة هاتين فقط.
  pl.a1.unit17.lesson01.teach.inzynier:
    title: مهندس
    gloss: مهندس
    note: في البولندية اليومية تبقى هذه الكلمة عادةً *inżynier* للمرأة أيضًا.
    example_gloss: ماريك مهندس.
  pl.a1.unit17.lesson01.teach.nauczyciel_nauczycielka:
    title: معلّم
    gloss: معلّم / معلّمة
    note: 'على خلاف *inżynier*، تتغير هذه الكلمة بحسب الجنس: *nauczyciel* للرجل و*nauczycielka* للمرأة.'
    example_gloss:
    - هو معلّم.
    - إيفا معلّمة.
  pl.a1.unit17.lesson01.teach.marek_ewa_recap:
    title: ماريك وإيفا مجددًا
    gloss: ماريك، إيفا — تعرف هذين الاسمين من الدروس السابقة.
    note: تذكير سريع قبل أن يستخدم هذا الدرس الاسمين معًا.
  pl.a1.unit17.lesson01.teach.jest_recap:
    title: يكون / هو — مجددًا
    gloss: Jest — تعرف هذه الكلمة من الدروس السابقة، مثل «Dom jest tam» (البيت هناك).
    note: تذكير سريع قبل أن يستخدمها هذا الدرس للحديث عن مهنة شخص ما.
  pl.a1.unit17.lesson01.teach.marek_jest_inzynierem:
    title: مهنة ماريك
    gloss: ماريك مهندس.
    note: المعلومة التي تُبنى عليها هذه الوحدة كلها بخصوص ماريك.
  pl.a1.unit17.lesson01.teach.ewa_jest_nauczycielka:
    title: مهنة إيفا
    gloss: إيفا معلّمة.
    note: المعلومة التي تُبنى عليها هذه الوحدة كلها بخصوص إيفا.
  pl.a1.unit17.lesson02.teach.pracowac_recap_pracujesz:
    title: يعمل — أنت تعمل
    gloss: 'Pracować (تعرف pracuję من الدروس السابقة): pracuję (أنا)، pracujesz (أنت). أين تعمل؟'
    note: صيغتان فقط حاليًا — *pracuję* للحديث عن نفسك، و*pracujesz* لسؤال شخص آخر، على النمط نفسه الذي في *czuć się* في الوحدة السابقة.
  pl.a1.unit17.lesson02.teach.szkola:
    title: مدرسة
    gloss: مدرسة
    note: المكان الذي تعمل فيه معلّمة مثل إيفا.
    example_gloss: أعمل في مدرسة.
  pl.a1.unit17.lesson02.teach.biuro:
    title: مكتب
    gloss: مكتب
    note: المكان الذي يعمل فيه مهندس مثل ماريك.
    example_gloss: أعمل في مكتب.
  pl.a1.unit17.lesson02.teach.w_miejsce_pracy_note:
    title: في المدرسة، في المكتب
    gloss: 'W + مكان العمل: w szkole، w biurze — على النمط نفسه في w Warszawie أو w Krakowie.'
    note: الفكرة نفسها كما في أسماء المدن التي تعلّمتها (*w Warszawie*، *w Krakowie*)؛ تتغيّر النهاية قليلًا للتعبير عن *في* ذلك المكان.
  pl.a1.unit17.lesson02.teach.gdzie_pracujesz_phrase:
    title: أين تعمل؟
    gloss: أين تعمل؟
    note: السؤال الطبيعي للاستفسار عن عمل شخص ما.
  pl.a1.unit17.lesson03.teach.a_ty_recap:
    title: وأنت — مجددًا
    gloss: A ty — تعرف هذا التعبير من الدروس السابقة.
    note: تذكير سريع قبل حوار هذا الدرس.
  pl.a1.unit17.lesson03.teach.dialogue.line01:
    title: ماريك يسأل إيفا عن عملها
    gloss: أين تعملين يا إيفا؟
    note: يبدأ ماريك المحادثة بسؤال مباشر.
  pl.a1.unit17.lesson03.teach.dialogue.line02:
    title: إيفا تجيب
    gloss: أعمل في مدرسة. أنا معلّمة.
    note: تذكر إيفا مكان عملها ومهنتها — وهما المعلومتان نفسهما اللتان وردتا في هذه الوحدة.
  pl.a1.unit17.lesson03.teach.dialogue.line03:
    title: إيفا تسأل ماريك بدورها
    gloss: وأنت يا ماريك؟ أين تعمل؟
    note: تعيد إيفا السؤال إلى ماريك.
  pl.a1.unit17.lesson03.teach.dialogue.line04:
    title: Marek يجيب
    gloss: أعمل في مكتب. أنا مهندس.
    note: يذكر Marek مكان عمله ومهنته معًا، وهما المعلومتان نفسهما اللتان وردتا سابقًا في هذه الوحدة.
