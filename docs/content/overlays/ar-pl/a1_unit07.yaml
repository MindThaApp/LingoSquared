teaching:
  pl.a1.unit07.lesson01.teach.banan:
    title: موزة
    gloss: موزة
    note: فاكهة شائعة تُباع بالحبّة أو بالوزن في أي سوق أو متجر.
    example_gloss: هذه موزة.
  pl.a1.unit07.lesson01.teach.pomidor_ogorek:
    title: طماطم، خيار
    gloss: طماطم؛ خيار
    note: كلاهما مذكر غير عاقل — وسيكون جمعاهما في حالة الإضافة (pomidorów وogórków) مهمَّين عندما تشتريهما بالكيلو لاحقًا في هذه الوحدة.
    example_gloss:
    - هذه طماطم.
    - هذا خيار.
  pl.a1.unit07.lesson01.teach.ziemniak_cebula:
    title: بطاطا، بصل
    gloss: بطاطا؛ بصل
    note: Ziemniak مذكر غير عاقل (ويأخذ في جمع الإضافة النهاية -ów نفسها مثل banan وpomidor)؛ أما cebula فمؤنث.
    example_gloss:
    - هذه بطاطا.
    - هذه بصلة.
  pl.a1.unit07.lesson01.teach.tanio_drogo:
    title: رخيص، غالٍ
    gloss: بسعر رخيص؛ بسعر غالٍ
    note: '*Tanio* و*drogo* ظرفان، وتستعملهما البولندية مباشرة مع الفعل *kosztować* («يكلّف»)، فتقول *To kosztuje drogo* أي «هذا غالٍ»، وحرفيًا «هذا يكلّف غاليًا». أما في العربية فنستعمل عادةً الصفة: «هذا غالٍ».'
    example_gloss:
    - رخيص جدًا!
    - غالٍ جدًا!
  pl.a1.unit07.lesson01.teach.kosztuje_kosztuja_note:
    title: 'يكلّف: kosztuje، kosztują'
    gloss: 'يكلّف: سعره كذا (للمفرد)، سعرها كذا (للجمع) — الموزة رخيصة. الموز رخيص.'
    note: '*Kosztować* فعل بمعنى «يكلّف». استعمل *kosztuje* لشيء واحد و*kosztują* لأكثر من شيء، تمامًا مثل *jest* و*są* («هو» و«هم/هي»)، لكن في الأسعار. هذا التوافق مهم: سيفهمك بائع السوق في الحالتين، لكن *banany kosztują* هو ما يقوله المتحدث الأصلي فعلًا.'
  pl.a1.unit07.lesson01.teach.ile_kosztuje_banan:
    title: كم سعر الموزة؟
    gloss: كم سعر الموزة؟
    note: السؤال اليومي لبدء المساومة على السعر — *Ile* (كم) مع *kosztuje* بصيغة المفرد، لأن السؤال عن موزة واحدة.
  pl.a1.unit07.lesson02.teach.grejpfrut:
    title: غريب فروت
    gloss: غريب فروت
    note: مذكر غير عاقل، مثل pomidor وziemniak — فلا تتغير نهايته بعد proszę o.
    example_gloss: هذه ثمرة غريب فروت.
  pl.a1.unit07.lesson02.teach.mandarynka_pomarancza:
    title: يوسفي، برتقال
    gloss: يوسفي؛ برتقال
    note: كلاهما مؤنث، مثل kawa وherbata في وحدة الطعام — وتتحول -a في صيغة المفعول به إلى -ę، لكن هذا الدرس يحتاج فقط إلى صيغتهما الأصلية.
    example_gloss:
    - هذه يوسفية.
    - هذه برتقالة.
  pl.a1.unit07.lesson02.teach.kilo_pol_kilo:
    title: كيلو، نصف كيلو
    gloss: كيلو؛ نصف كيلو
    note: لا تتغير نهاية *Kilo* أبدًا، مهما كان الشيء الذي تزنه أو الكمية التي تطلبها — فالاسم الذي يأتي بعد *kilo* هو الذي يتغير، كما توضح ملاحظة القواعد في هذا الدرس.
    example_gloss:
    - كيلو من الطماطم من فضلك.
    - نصف كيلو من الموز من فضلك.
  pl.a1.unit07.lesson02.teach.poprosze:
    title: أريد (من فضلك)
    gloss: أريد / أعطني من فضلك
    note: '*Poproszę* بديل أكثر أناقة قليلًا ومستعمل يوميًا بدل *proszę o* من وحدة الطعام — فكلاهما يعني تقريبًا «أريد»، ويتنقل المتحدثون بالبولندية بينهما بحرية. ويأتي بعد *Poproszę* الشيء المطلوب مباشرة، دون الحاجة إلى *o*.'
    example_gloss: أريد غريب فروت من فضلك.
  pl.a1.unit07.lesson02.teach.genitive_ow_note:
    title: 'بعد ''kilo'': النهاية -ów'
    gloss: 'جمع الإضافة بعد «كيلو»: موز ← من الموز، طماطم ← من الطماطم، بطاطا ← من البطاطا.'
    note: 'عندما تحدد كمية بالوزن — *kilo* أو *pół kilo* — يتحول الاسم الذي يليها إلى صيغة أخرى هي جمع الإضافة. وفي هذه الأسماء المذكرة المنتظمة الثلاثة يكفي إضافة *-ów*: يصبح *banan* هكذا *bananów*، ويصبح *pomidor* هكذا *pomidorów*، ويصبح *ziemniak* هكذا *ziemniaków*.'
  pl.a1.unit07.lesson02.teach.poprosze_kilo_pomidorow:
    title: كيلو من الطماطم من فضلك
    gloss: كيلو من الطماطم من فضلك.
    note: تطبّق نمط -ów من ملاحظة القواعد في طلب حقيقي — يصبح pomidor هكذا pomidorów بعد kilo.
  pl.a1.unit07.lesson03.teach.dla:
    title: لـ
    gloss: لـ
    note: حرف جر بسيط بمعنى «لـ» — يستعمله البائع في *Co dla pani?* (حرفيًا «ماذا لكِ؟») ليسأل الزبونة بأسلوب رسمي عمّا تريده.
    example_gloss: هذا لك.
  pl.a1.unit07.lesson03.teach.swieze_bardzo:
    title: طازج، جدًا
    gloss: طازج؛ جدًا
    note: كلمتان يومیتان يستعملهما بائع السوق باستمرار — لمدح طزاجة البضاعة، أو لوصفها بأنها رخيصة أو غالية.
    example_gloss:
    - الطماطم طازجة.
    - رخيص جدًا!
  pl.a1.unit07.lesson03.teach.trochę:
    title: قليلًا
    gloss: قليلًا
    note: تخفف الشكوى بلطف — فقول trochę drogo («غالٍ قليلًا») أكثر طبيعية في المساومة الودية من drogo وحدها.
    example_gloss: غالٍ قليلًا.
  pl.a1.unit07.lesson03.teach.razem:
    title: المجموع / معًا
    gloss: المجموع / معًا
    note: ما يقوله البائع قبل ذكر المبلغ النهائي المطلوب منك.
    example_gloss: المجموع عشرة زلوتي.
  pl.a1.unit07.lesson03.teach.co_dla_pani:
    title: ماذا تريد؟
    gloss: ماذا تريد؟
    note: حرفيًا «ماذا لكِ (بأسلوب رسمي)؟» — وهو سؤال الافتتاح الطبيعي من البائع للزبونة.
  pl.a1.unit07.lesson03.teach.dialogue.line01:
    title: البائع يرحب بإيفا
    gloss: يلقي البائع التحية ويسأل إيفا عمّا تريده.
    note: Dzień dobry، وقد وردت في تحيات الوحدة الأولى.
  pl.a1.unit07.lesson03.teach.dialogue.line02:
    title: إيفا تسأل عن الموز
    gloss: تسأل إيفا عن سعر الموز.
    note: Kosztują -- صيغة الجمع من ملاحظة القواعد في هذه الوحدة، لأن السؤال عن الموز كمجموعة.
  pl.a1.unit07.lesson03.teach.dialogue.line03:
    title: البائع يذكر السعر
    gloss: يقول البائع إن الكيلو بخمسة زلوتي، وإن الموز طازج جدًا.
    note: عبارة سعر مختصرة طبيعية -- يذكر البائع البولندي سعر الكيلو بقوله «السعر + kilo» دون كلمة تعني «لكل».
  pl.a1.unit07.lesson03.teach.dialogue.line04:
    title: إيفا تطلب الموز
    gloss: تقول إيفا إن الأمر مناسب، وتطلب كيلو من الموز.
    note: يجمع بين poproszę وkilo + bananów، وهو النمط نفسه في ملاحظة القواعد من الدرس الثاني.
  pl.a1.unit07.lesson03.teach.dialogue.line05:
    title: البائع يذكر الطماطم
    gloss: يسأل البائع عن الطماطم أيضًا، ويقول إن الكيلو بثمانية زلوتي.
    note: نمط السعر المختصر نفسه الوارد في السطر الثالث، لكن مع صنف آخر.
  pl.a1.unit07.lesson03.teach.dialogue.line06:
    title: إيفا تساوم بلطف وتطلب
    gloss: تقول إيفا إن السعر مرتفع قليلًا، لكنها ستأخذ نصف كيلو.
    note: Trochę drogo تخفف من حدة الشكوى -- ما زالت إيفا تشتري، لكن بكمية أقل.
  pl.a1.unit07.lesson03.teach.dialogue.line07:
    title: البائع يذكر المجموع
    gloss: يقول البائع تفضلي، ثم يذكر أن المجموع تسعة زلوتي.
    note: 5 złotych ثمن الموز زائد 4 złotych ثمن نصف كيلو الطماطم، فالمجموع تسعة złotych، وهذا يطابق كل الأسعار المذكورة سابقًا في المشهد.
