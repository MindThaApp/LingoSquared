teaching:
  pl.a1.unit20.lesson01.teach.recap_jest_sa_to_poprosze:
    title: يوجد، هذا، أودّ — مرة أخرى
    gloss: Jest, są, To, Poproszę, Ile, kosztuje, złotych, chcę, do -- تعرف هذه الكلمات من الدروس السابقة.
    note: تذكير سريع قبل أن يستخدمها هذا الدرس في الحديث عن شراء الملابس.
  pl.a1.unit20.lesson01.teach.sklep:
    title: متجر
    gloss: متجر / محل
    note: الكلمة العامة للدلالة على المحل التجاري.
    example_gloss: أنا ذاهب إلى المتجر.
  pl.a1.unit20.lesson01.teach.koszula:
    title: قميص
    gloss: قميص
    note: اسم مؤنث، لذلك يأخذ صفات بصيغة المؤنث.
    example_gloss: هذا قميص.
  pl.a1.unit20.lesson01.teach.spodnie:
    title: بنطال
    gloss: بنطال
    note: يأتي دائمًا بصيغة الجمع في البولندية، حتى للدلالة على قطعة واحدة، فلا توجد له صيغة مفرد.
    example_gloss: هذه سراويل.
  pl.a1.unit20.lesson01.teach.kupic:
    title: يشتري
    gloss: يشتري
    note: 'يُستخدم بعد ''*chcę*'' (أريد) تمامًا مثل ''*iść*'' (يذهب) في درس سابق: ''*chcę kupić*'' -- أريد أن أشتري.'
    example_gloss: أريد شراء قميص.
  pl.a1.unit20.lesson01.teach.chce_kupic_spodnie_phrase:
    title: أريد شراء بنطال
    gloss: أريد شراء بنطال.
    note: النمط نفسه chcę + المصدر، مطبّقًا على البنطال.
  pl.a1.unit20.lesson01.teach.ile_kosztuje_koszula_phrase:
    title: كم سعر القميص؟
    gloss: كم سعر القميص؟
    note: طريقة طبيعية للسؤال عن سعر قطعة محددة، وفيها تعود '*Ile kosztuje*' من درس التسوق.
  pl.a1.unit20.lesson02.teach.jaki_note:
    title: أيّ نوع من -- صيغة المذكر
    gloss: Jaki, Jaka -- '*Jaki*' للسؤال عن الأسماء المذكرة، و'*Jaka*' عن الأسماء المؤنثة (تعرف '*Jaka*' من درس الطقس).
    note: كلمة '*Kolor*' (لون) مذكرة، لذلك تُستخدم مع '*Jaki*' لا '*Jaka*'.
  pl.a1.unit20.lesson02.teach.kolor:
    title: لون
    gloss: لون
    note: اسم مذكر.
    example_gloss: أي لون؟
  pl.a1.unit20.lesson02.teach.sukienka:
    title: فستان
    gloss: فستان
    note: اسم مؤنث آخر، مثل '*koszula*'.
    example_gloss: هذا فستان.
  pl.a1.unit20.lesson02.teach.niebieska_note:
    title: أزرق
    gloss: Koszula jest niebieska. -- '*niebieska*' تتوافق مع الأسماء المؤنثة مثل '*koszula*'.
    note: هذه الصيغة وحدها فقط، وهي مرتبطة بـ '*koszula*' في هذه الدورة حتى الآن.
  pl.a1.unit20.lesson02.teach.czerwona_note:
    title: أحمر
    gloss: Sukienka jest czerwona. -- '*czerwona*' تتوافق أيضًا مع الأسماء المؤنثة، تمامًا مثل '*niebieska*'.
    note: هذه الصيغة مرتبطة هنا بـ '*sukienka*'، كما ارتبطت '*niebieska*' بـ '*koszula*'.
  pl.a1.unit20.lesson02.teach.koszula_niebieska_phrase:
    title: القميص أزرق
    gloss: القميص أزرق.
    note: معلومة ستعود في هذه الوحدة لاحقًا عندما يتسوق ماريك لشراء قميص.
  pl.a1.unit20.lesson02.teach.sukienka_czerwona_phrase:
    title: الفستان أحمر
    gloss: الفستان أحمر.
    note: نمط jest + اللون نفسه يُستخدم مع قطعة أخرى.
  pl.a1.unit20.lesson03.teach.recap_words:
    title: يوم طيب، من فضلك، جدًا — مرة أخرى
    gloss: Dzień, dobry, Proszę, bardzo, i, Dobrze, Co -- تعرف هذه الكلمات من الدروس السابقة.
    note: تذكير سريع قبل حوار المتجر في هذا الدرس.
  pl.a1.unit20.lesson03.teach.rozmiar:
    title: المقاس
    gloss: مقاس
    note: تُستخدم في بولندا عادةً الحروف S وM وL فقط للدلالة على مقاسات الملابس.
    example_gloss: ما المقاس؟
  pl.a1.unit20.lesson03.teach.pan_chce_note:
    title: سيدي، يريد
    gloss: Co pan chce kupić? -- '*pan*' هي الصيغة المهذبة لمخاطبة الرجل، تمامًا مثل '*pani*' للمرأة (تعرف '*pani*' من درس التسوق).
    note: '''*chce*'' هي صيغة الغائب (هو/هي) من ''*chcieć*'' -- وتعرف ''*chcę*'' (أريد) و''*chcesz*'' (تريد).'
  pl.a1.unit20.lesson03.teach.co_pan_chce_kupic_phrase:
    title: ماذا تريد أن تشتري يا سيدي؟
    gloss: ماذا تريد أن تشتري يا سيدي؟
    note: الطريقة التي يبدأ بها البائع حديثه المهذب مع زبون رجل.
  pl.a1.unit20.lesson03.teach.dialogue.line01:
    title: البائع يحيّي ماريك
    gloss: يوم طيب! ماذا تريد أن تشتري يا سيدي؟
    note: يبدأ Sprzedawca (البائع) بالأسلوب المهذب نفسه الذي استخدمه صاحب السوق في وحدة التسوق السابقة.
  pl.a1.unit20.lesson03.teach.dialogue.line02:
    title: ماريك يقول ما يريده
    gloss: أريد شراء قميص وبنطال.
    note: يذكر ماريك القطعتين اللتين يتسوق لأجلهما.
  pl.a1.unit20.lesson03.teach.dialogue.line03:
    title: البائع يسأل عن المقاس
    gloss: ما المقاس؟
    note: سؤال متابعة قصير وطبيعي.
  pl.a1.unit20.lesson03.teach.dialogue.line04:
    title: ماريك يذكر مقاسه
    gloss: المقاس M.
    note: يجيب ماريك بحرف المقاس فقط، وهذه هي الطريقة الطبيعية.
  pl.a1.unit20.lesson03.teach.dialogue.line05:
    title: البائع يؤكد توفر القطع والسعر
    gloss: لدينا قميص أزرق وبنطال. المجموع مئة زلوتي.
    note: '''*Mamy*'' تعني «لدينا» (مثل ''*mam*''/''*masz*''). بعدها تصبح ''*koszula*'' ''*koszulę*'' وتصبح ''*niebieska*'' ''*niebieską*'' -- وهو التغيير نفسه الذي رأيته في ''*Chcę kupić koszulę*''. واللون يطابق القميص الأزرق من الدرس الثاني.'
  pl.a1.unit20.lesson03.teach.dialogue.line06:
    title: ماريك يوافق
    gloss: حسنًا، سآخذه.
    note: يؤكد ماريك الشراء وبذلك ينتهي الحوار.
