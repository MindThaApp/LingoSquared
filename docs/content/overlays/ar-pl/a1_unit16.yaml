teaching:
  pl.a1.unit16.lesson01.teach.boli_note:
    title: إنه يؤلم
    gloss: 'Boleć (يؤلم)، في المضارع: boli (هو/هي) وbolą (هم/هنّ). تعني Głowa mnie boli «رأسي يؤلمني» -- وحرفيًا «الرأس يؤلمني».'
    note: للتعبير عن الآلام يُستعمل مضارع *boleć* بصيغتين فقط -- فعضو الجسم هو الفاعل، وتبيّن *mnie* لمن هو، فلا توجد هنا صيغة «أنا أتألم» لتتعلّمها.
  pl.a1.unit16.lesson01.teach.glowa:
    title: الرأس
    gloss: رأس
    note: أكثر شيء شائع نقول إنه يؤلمنا.
    example_gloss: رأسي يؤلمني.
  pl.a1.unit16.lesson01.teach.gardlo:
    title: الحلق
    gloss: حلق
    note: مفيدة لوصف الزكام أو التهاب الحلق.
    example_gloss: حلقي يؤلمني.
  pl.a1.unit16.lesson01.teach.brzuch:
    title: البطن
    gloss: معدة
    note: مفيدة بعد وجبة دسمة، أو حين لا يناسبك شيء أكلته.
    example_gloss: معدتي تؤلمني.
  pl.a1.unit16.lesson01.teach.zeby:
    title: الأسنان
    gloss: أسنان
    note: تُستعمل هنا دائمًا بصيغة الجمع، كما يقولها المتحدث البولندي فعلًا -- ولهذا تُستعمل *bolą* (وليس *boli*) معها.
    example_gloss: أسناني تؤلمني.
  pl.a1.unit16.lesson01.teach.co_cie_boli:
    title: ما الذي يؤلمك؟
    gloss: ما الذي يؤلمك؟
    note: السؤال الطبيعي لمن لا يشعر بأنه بخير.
  pl.a1.unit16.lesson02.teach.czuc_sie_note:
    title: كيف تشعر؟
    gloss: 'Czuć się (يشعر): czuję się (أنا)، czujesz się (أنت). كيف تشعر؟'
    note: صيغتان فقط في الوقت الحالي -- *czuję* للحديث عن نفسك، و*czujesz* لسؤال شخص آخر.
  pl.a1.unit16.lesson02.teach.dobrze_zle_contrast:
    title: بخير وبشكل سيئ
    gloss: أشعر أنني بخير. أشعر بتوعّك. -- تعرف dobrze من قبل، وźle هي عكسها.
    note: هي كلمة *dobrze* نفسها التي تستعملها منذ درسك الأول، وقد اقترنت الآن بعكسها.
  pl.a1.unit16.lesson02.teach.zle:
    title: بشكل سيئ
    gloss: بشكل سيئ
    note: الكلمة التي تحتاجها لتقول إنك لا تشعر أنك بخير.
    example_gloss: أشعر بتوعّك.
  pl.a1.unit16.lesson02.teach.goraczka:
    title: الحمّى
    gloss: حمّى
    note: عَرَض شائع وأساسي يجدر تسميته.
    example_gloss: عندي حمّى.
  pl.a1.unit16.lesson02.teach.ewa_ma_recap:
    title: Ewa, ma -- من جديد
    gloss: Ewa, ma -- تعرف هذا الاسم وهذه الصيغة من الفعل mieć (يملك) من الدروس السابقة (Mam, masz, ma).
    note: تذكير سريع قبل أن يستعملهما هذا الدرس معًا.
  pl.a1.unit16.lesson02.teach.chory_chora:
    title: مريض
    gloss: مريض / مريضة
    note: هو النمط -y/-a نفسه الذي تعلّمته مع *młodszy/starsza* -- *chory* للرجل، و*chora* للمرأة.
    example_gloss:
    - هو مريض.
    - هي مريضة.
  pl.a1.unit16.lesson02.teach.ewa_line_preview:
    title: إيفا لا تشعر أنها بخير
    gloss: أشعر بتوعّك. عندي حمّى.
    note: إيفا تصف أعراضها بنفسها -- وهو ما تقوله مرة أخرى في حوار هذه الوحدة.
  pl.a1.unit16.lesson03.teach.marek_recap:
    title: Marek، من جديد
    gloss: Marek -- تعرف هذا الاسم من الدروس السابقة.
    note: تذكير سريع قبل حوار هذا الدرس.
  pl.a1.unit16.lesson03.teach.i_recap:
    title: I، من جديد
    gloss: I -- تعرف هذه الكلمة من الدروس السابقة.
    note: تذكير سريع قبل حوار هذا الدرس.
  pl.a1.unit16.lesson03.teach.prosze_wode_recap:
    title: من فضلك والماء، من جديد
    gloss: Proszę وwodę -- تعرف الكلمتين من الدروس السابقة.
    note: تذكير سريع قبل حوار هذا الدرس.
  pl.a1.unit16.lesson03.teach.dziekuje_recap:
    title: شكرًا، من جديد
    gloss: Dziękuję -- تعرف هذه الكلمة من الدروس السابقة.
    note: تذكير سريع قبل حوار هذا الدرس.
  pl.a1.unit16.lesson03.teach.odpoczac:
    title: الاستراحة
    gloss: يرتاح
    note: تُستعمل مع *Proszę* بالطريقة نفسها التي تطلب بها من أحد أن يسير مباشرة أو ينعطف في اتجاه ما -- *Proszę* + صيغة المصدر، دون حاجة إلى صيغة الأمر.
    example_gloss: من فضلك استرح.
  pl.a1.unit16.lesson03.teach.pic:
    title: يشرب
    gloss: يشرب
    note: صيغة مصدر أخرى تأتي بعد *Proszę* بالطريقة نفسها.
    example_gloss: من فضلك اشرب الماء.
  pl.a1.unit16.lesson03.teach.dialogue.line01:
    title: ماريك يسأل إيفا عن حالها
    gloss: إيفا، كيف تشعرين؟
    note: يلاحظ ماريك أن شيئًا ما ليس على ما يرام فيسأل مباشرة.
  pl.a1.unit16.lesson03.teach.dialogue.line02:
    title: إيفا تصف أعراضها
    gloss: أشعر بتوعّك. حلقي يؤلمني وعندي حمّى.
    note: تذكر إيفا عرضين بوضوح -- وهما الحقيقتان نفسهما اللتان عرفناهما سابقًا في هذه الوحدة.
  pl.a1.unit16.lesson03.teach.dialogue.line03:
    title: ماريك يقدّم نصيحة بسيطة
    gloss: من فضلك استريحي واشربي الماء.
    note: نصيحة بسيطة وليست تشخيصًا -- ليست تعليمات طبية، بل مجرد حسّ سليم.
  pl.a1.unit16.lesson03.teach.dialogue.line04:
    title: إيفا تشكر ماريك
    gloss: حسنًا، شكرًا يا ماريك.
    note: ختام بسيط ومألوف للحوار.
