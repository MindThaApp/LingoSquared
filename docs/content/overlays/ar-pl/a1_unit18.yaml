    example_gloss: لدى Ewa شقة.
  pl.a1.unit18.lesson01.teach.duzy_note:
    title: كبير
    gloss: البيت كبير. -- «*duży*» يناسب الأسماء المذكّرة، مثل «*dom*».
    note: هذه أول مرة في الدورة تصف فيها كلمة الحجم -- وهي الآن تنطبق على «*dom*» فقط.
  pl.a1.unit18.lesson01.teach.marek_ma_dom_duzy:
    title: بيت Marek
    gloss: لدى Marek بيت. البيت كبير.
    note: المعلومة التي تبني عليها هذه الوحدة كلها بخصوص Marek.
  pl.a1.unit18.lesson01.teach.ewa_ma_mieszkanie:
