    gloss: الحمّام
    note: الغرفة التي فيها الدُّش والمرحاض.
    example_gloss: أين الحمّام؟
  pl.a1.unit18.lesson02.teach.gdzie_tam_recap:
    title: أين، هناك -- مرة أخرى
    gloss: Gdzie, tam -- تعرف هاتين الكلمتين من الدروس السابقة، مثل «Bank jest tam» (البنك هناك).
    note: تذكير سريع قبل أن يستعملهما هذا الدرس في الحديث عن الغرف.
  pl.a1.unit18.lesson02.teach.w_pokoje_locative_note:
    title: في الغرفة، في المطبخ...
    gloss: 'W + غرفة، مطبخ، غرفة نوم، حمّام: w pokoju, w kuchni, w sypialni, w łazience -- النمط نفسه في w szkole (في المدرسة) أو w biurze (في المكتب).'
    note: الفكرة نفسها كما في كلمات أماكن العمل التي تعلّمتها -- تتغيّر النهاية قليلًا للتعبير عن «في» تلك الغرفة.
  pl.a1.unit18.lesson02.teach.gdzie_jest_lazienka_phrase:
    title: أين الحمّام؟
    gloss: أين الحمّام؟ الحمّام هناك.
    note: حوار طبيعي للسؤال عن غرفة في بيت أحدهم.
