    note: جهاز شائع آخر في المطبخ.
    example_gloss: يوجد فرن في المطبخ.
  pl.a1.unit18.lesson03.teach.dialogue.line01:
    title: ماريك يصف بيته
    gloss: عندي بيت. البيت كبير.
    note: يبدأ ماريك الحديث بوصف بيته.
  pl.a1.unit18.lesson03.teach.dialogue.line02:
    title: إيفا تسأل عن الغرف
    gloss: كم غرفة لديك؟
    note: تطرح إيفا سؤالًا تاليًا طبيعيًا.
  pl.a1.unit18.lesson03.teach.dialogue.line03:
    title: ماريك يجيب
    gloss: عندي غرفتان. في البيت مطبخ وغرفة نوم وحمّام.
    note: يذكر ماريك عدد غرفه ويعدّد الغرف في بيته.
  pl.a1.unit18.lesson03.teach.dialogue.line04:
    title: إيفا تصف بيتها
    gloss: أما أنا فعندي شقة. عندي غرفة واحدة.
    note: تنتقل إيفا إلى وصف بيتها الأصغر.
  pl.a1.unit18.lesson03.teach.dialogue.line05:
    title: إيفا تسأل عن المطبخ
    gloss: هل المطبخ صغير؟
    note: تسأل إيفا ماريك سؤالًا تاليًا عن مطبخه.
  pl.a1.unit18.lesson03.teach.dialogue.line06:
    title: ماريك يجيب
    gloss: نعم، المطبخ صغير. توجد ثلاجة وفرن في المطبخ.
    note: يؤكد ماريك صغر المطبخ ويذكر شيئين فيه.
