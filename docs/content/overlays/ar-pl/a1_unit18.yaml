    gloss: لدى Ewa شقة.
    note: المعلومة التي تبني عليها هذه الوحدة كلها بخصوص Ewa.
  pl.a1.unit18.lesson01.teach.pokoj:
    title: غرفة
    gloss: غرفة
    note: كلمة عامة لأي غرفة في البيت.
    example_gloss: أين الغرفة؟
  pl.a1.unit18.lesson01.teach.ile_pokoi_note:
    title: كم غرفة؟
    gloss: كم غرفة لديك؟ لديّ غرفتان. -- تعرف «Ile» والأعداد و«mam»/«masz» من الدروس السابقة؛ و«*pokoi*» و«*pokoje*» صيغتان من الكلمة «*pokój*».
    note: تُستعمل «*Pokoi*» مباشرة بعد «*Ile*»، وتُستعمل «*pokoje*» مباشرة بعد «*dwa*» أو «*trzy*» أو «*cztery*» (اثنان، ثلاثة، أربعة).
  pl.a1.unit18.lesson01.teach.ile_pokoi_masz_phrase:
    title: كم غرفة لديك؟
    gloss: كم غرفة لديك؟
    note: سؤال طبيعي عن بيت شخص ما.
  pl.a1.unit18.lesson01.teach.mam_dwa_pokoje_phrase:
    title: لديّ غرفتان
    gloss: لديّ غرفتان.
    note: جواب طبيعي عن السؤال السابق.
  pl.a1.unit18.lesson02.teach.kuchnia:
    title: مطبخ
    gloss: المطبخ
    note: من أكثر الغرف شيوعًا في البيت.
    example_gloss: المطبخ صغير.
  pl.a1.unit18.lesson02.teach.mala_note:
    title: صغير
    gloss: المطبخ صغير. -- «*mała*» يناسب الأسماء المؤنثة، مثل «*kuchnia*».
    note: هذه كلمة مختلفة عن «*duży*» (كبير) -- وهي الآن تنطبق على «*kuchnia*» فقط.
  pl.a1.unit18.lesson02.teach.sypialnia:
    title: غرفة النوم
    gloss: غرفة النوم
    note: الغرفة التي تنام فيها.
    example_gloss: أين غرفة النوم؟
  pl.a1.unit18.lesson02.teach.lazienka:
