    gloss: المطبخ صغير.
    note: إعادة استخدام كلمة الحجم التي مرّت في هذا الدرس.
  pl.a1.unit18.lesson03.teach.recap_words:
    title: نعم، و، هم/هنّ (جمع)... مراجعة
    gloss: Tak, i, są, A, ja, jeden -- تعرف هذه الكلمات من الدروس السابقة.
    note: تذكير سريع قبل حوار هذا الدرس.
  pl.a1.unit18.lesson03.teach.lodowka:
