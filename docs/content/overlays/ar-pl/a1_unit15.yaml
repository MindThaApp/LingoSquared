teaching:
  pl.a1.unit15.lesson01.teach.dworzec:
    title: المحطة
    gloss: المحطة
    note: المكان الذي تصل إليه القطارات والحافلات وتغادره، وهو نقطة الانطلاق لهذه الوحدة كلها.
    example_gloss: المحطة قريبة من الفندق.
  pl.a1.unit15.lesson01.teach.bilet:
    title: التذكرة
    gloss: التذكرة
    note: ستحتاج إليها قبل أن تركب القطار أو الحافلة.
    example_gloss: سعر التذكرة عشرون زلوتي.
  pl.a1.unit15.lesson01.teach.peron:
    title: الرصيف
    gloss: رصيف
    note: المكان الذي تقف فيه فعلًا وتنتظر قطارك.
    example_gloss: الرصيف رقم واحد هناك.
  pl.a1.unit15.lesson01.teach.peron_numer_note:
    title: الرصيف رقم واحد، اثنان...
    gloss: 'لقول رقم الرصيف يمكنك أن تقول Peron numer + العدد: Peron numer jeden, Peron numer dwa.'
    note: 'الأمر أسهل مما يبدو: *peron* + *numer* + عدد عادي تعرفه بالفعل. (تستخدم إعلانات المحطات غالبًا الأعداد الترتيبية بدلًا من ذلك، مثل *peron pierwszy* أي «الرصيف الأول»، لكن *peron numer jeden* مفهومة دائمًا.)'
  pl.a1.unit15.lesson01.teach.pociag_recap:
    title: القطار مرة أخرى
    gloss: Pociąg odjeżdża o czwartej po południu -- تعرف هذه الجملة بالفعل من درس الوقت.
    note: المعلومة نفسها من وحدة الوقت، لكنها تُستخدم الآن في مشهد سفر.
  pl.a1.unit15.lesson01.teach.krakow:
    title: كراكوف
    gloss: كراكوف
    note: مدينة بولندية حقيقية، وهي أول وجهة في هذه الوحدة.
    example_gloss: كراكوف بعيدة.
  pl.a1.unit15.lesson01.teach.do_krakowa_note:
    title: إلى كراكوف
    gloss: 'عندما نذهب إلى مكان ما نقول do + صيغة أخرى لاسم المدينة: do Krakowa (وليس do Kraków). احفظ هذه الصيغة كاملة.'
    note: لا تحاول استنتاج *Krakowa* من قاعدة، بل احفظ *do Krakowa* الآن كعبارة ثابتة واحدة.
  pl.a1.unit15.lesson01.teach.bilet_do_krakowa:
    title: تذكرة إلى كراكوف، من فضلك
    gloss: تذكرة إلى كراكوف، من فضلك.
    note: العبارة التي تقولها تمامًا عند شباك التذاكر.
  pl.a1.unit15.lesson01.teach.jechac_note:
    title: To go (by vehicle)
    gloss: 'Jechać (الذهاب بوسيلة نقل): jadę (أنا أذهب)، jedzie (هو/هي يذهب/تذهب). غدًا أذهب إلى كراكوف. ماريك ذاهب إلى كراكوف.'
    note: 'صيغتان فقط في الوقت الحالي: *jadę* للحديث عن نفسك، و*jedzie* للحديث عن شخص آخر.'
  pl.a1.unit15.lesson01.teach.marek_jedzie:
    title: ماريك ذاهب إلى كراكوف
    gloss: ماريك ذاهب إلى كراكوف غدًا.
    note: رحلة ماريك نفسه، وتستمر قصته في حوار هذه الوحدة.
  pl.a1.unit15.lesson02.teach.autobus:
    title: الحافلة
    gloss: حافلة
    note: الوسيلة الشائعة الأخرى للسفر بين المدن.
    example_gloss: الحافلة في المحطة.
  pl.a1.unit15.lesson02.teach.warszawa:
    title: وارسو
    gloss: وارسو
    note: عاصمة بولندا، وهي ثاني وجهة في هذه الوحدة.
    example_gloss: وارسو بعيدة.
  pl.a1.unit15.lesson02.teach.do_warszawy_note:
    title: إلى وارسو
    gloss: 'اسم Warszawa يتغير بطريقة مختلفة عن Kraków: do Warszawy (وليس do Warszawa). لكل مدينة صيغتها الخاصة، فاحفظ كلتا الصيغتين على حدة.'
    note: لا تتبع *Krakowa* و*Warszawy* النمط نفسه، ولهذا السبب بالذات تُحفظ كل واحدة منهما على حدة، لا بقاعدة مشتركة.
  pl.a1.unit15.lesson02.teach.dokad:
    title: إلى أين
    gloss: إلى أين
    note: يُسأل بها عن الوجهة لا عن الموقع، وهي تختلف عن السؤال «أين» عن شيء موجود في مكانه.
    example_gloss: إلى أين تذهب الحافلة؟
  pl.a1.unit15.lesson02.teach.godzina_recap:
    title: في الساعة السابعة مرة أخرى
    gloss: Siódmej -- تعرف صيغة الساعة هذه بالفعل من درس الوقت (o siódmej = في الساعة السابعة).
    note: نمط صيغة الساعة نفسه، يُعاد استخدامه هنا لموعد المغادرة.
  pl.a1.unit15.lesson02.teach.autobus_odjezdza:
    title: الحافلة إلى وارسو تغادر في السابعة
    gloss: الحافلة إلى وارسو تغادر في السابعة.
    note: تجمع هذه الجملة الحقيقية بين نمطي الوجهة والوقت في هذا الدرس.
  pl.a1.unit15.lesson02.teach.kiedy_recap:
    title: متى، مرة أخرى
    gloss: Kiedy -- تعرف هذه الكلمة بالفعل من درس التواريخ. متى تغادر الحافلة؟
    note: السؤال الطبيعي الذي يُطرح قبل السفر.
  pl.a1.unit15.lesson02.teach.ewa_jedzie:
    title: إيفا ذاهبة إلى وارسو
    gloss: إيفا ذاهبة إلى وارسو غدًا.
    note: رحلة إيفا نفسها، وتستمر قصتها في حوار هذه الوحدة إلى جانب قصة ماريك.
  pl.a1.unit15.lesson03.teach.ja_recap:
    title: أنا، مرة أخرى
    gloss: Ja -- تعرف هذه الكلمة بالفعل من الدروس السابقة.
    note: تذكير سريع قبل حوار هذا الدرس.
  pl.a1.unit15.lesson03.teach.moj_recap:
    title: ملكي، مرة أخرى
    gloss: Mój -- تعرف هذه الكلمة بالفعل من درس العائلة.
    note: تذكير سريع قبل حوار هذا الدرس.
  pl.a1.unit15.lesson03.teach.dziesiatej_rano_note:
    title: في العاشرة صباحًا، مرة أخرى
    gloss: Dziesiątej و rano -- تعرف الصيغتين بالفعل من درس الوقت (o dziesiątej rano = في العاشرة صباحًا).
    note: تذكير سريع قبل حوار هذا الدرس.
  pl.a1.unit15.lesson03.teach.dziekuje_recap:
    title: شكرًا، وإلى اللقاء
    gloss: Dziękuję و Do zobaczenia -- تعرفهما بالفعل من الدروس السابقة.
    note: تذكير سريع قبل حوار هذا الدرس.
  pl.a1.unit15.lesson03.teach.mila_podrozy_note:
    title: رحلة سعيدة!
    gloss: Miłej podróży! عبارة نتمنى بها لشخص ما رحلة موفقة، ونستخدمها كعبارة كاملة ولا نترجمها كلمة بكلمة.
    note: عبارة وداع ثابتة واصطلاحية، تعلّمها كوحدة واحدة كما تعلّمت من قبل *Dzień dobry*.
  pl.a1.unit15.lesson03.teach.dialogue.line01:
    title: ماريك ذاهب إلى كراكوف غدًا
    gloss: غدًا أذهب إلى كراكوف. قطاري يغادر في الرابعة بعد الظهر.
    note: يبدأ ماريك بخطة سفره، وهي المعلومة نفسها التي عرفناها عنه في الدرس الأول.
  pl.a1.unit15.lesson03.teach.dialogue.line02:
    title: إيفا ذاهبة إلى وارسو غدًا
    gloss: أنا ذاهبة إلى وارسو. حافلتي تغادر في العاشرة صباحًا.
    note: تحكي إيفا عن خطتها، وهي المعلومة نفسها التي عرفناها عنها في الدرس الثاني.
  pl.a1.unit15.lesson03.teach.dialogue.line03:
    title: ماريك يتمنى لإيفا رحلة سعيدة
    gloss: رحلة سعيدة!
    note: يستخدم ماريك عبارة هذا الدرس الجديدة ليتمنى الخير لإيفا.
  pl.a1.unit15.lesson03.teach.dialogue.line04:
    title: إيفا تشكر ماريك وتودّعه
    gloss: شكرًا! إلى اللقاء!
    note: ختام بسيط ومألوف للحوار.
