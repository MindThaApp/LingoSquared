teaching:
  pl.a1.unit05.lesson01.teach.rodzina:
    title: العائلة
    gloss: عائلة
    note: الكلمة العامة للعائلة، وتُستعمل للأسرة كلها لا لعلاقة واحدة فقط.
    example_gloss: هذه عائلتي.
  pl.a1.unit05.lesson01.teach.matka_ojciec:
    title: الأم، الأب
    gloss: أم؛ أب
    note: هاتان هما الكلمتان الأساسيتان للوالدين. قد تسمع أيضًا mama وtata للتحبب في الكلام اليومي، لكن matka وojciec هما الصيغتان المحايدتان المعتمدتان هنا.
    example_gloss:
    - هذه أمي.
    - هذا أبي.
  pl.a1.unit05.lesson01.teach.brat_siostra:
    title: الأخ، الأخت
    gloss: أخ؛ أخت
    note: 'كلاهما اسم عادي: brat مذكر وsiostra مؤنث، وهذا مهم لمطابقة mój/moja في ملاحظة القواعد لهذا الدرس.'
    example_gloss:
    - هذا أخي.
    - هذه أختي.
  pl.a1.unit05.lesson01.teach.rodzice:
    title: الوالدان
    gloss: الوالدان
    note: Rodzice اسم جمع للمذكر العاقل، ولذلك تكون صيغة الملكية معه moi (لا mój ولا moja)، كما سترى في مثال هذا الدرس وملاحظة القواعد.
    example_gloss: يسكن والداي في وارسو.
  pl.a1.unit05.lesson01.teach.moj_moja_note:
    title: 'ياء المتكلم: mój وmoja وmoi'
    gloss: أبي، أخي -- أمي، أختي -- والداي.
    note: 'تتطابق صيغ الملكية في البولندية مع جنس الاسم الذي تصفه: *mój* قبل الاسم المذكر (*mój ojciec*، *mój brat*)، و*moja* قبل الاسم المؤنث (*moja matka*، *moja siostra*)، وتوجد صيغة شاذة مستقلة هي *moi* تُستعمل مع جمع المذكر العاقل *rodzice* تحديدًا.'
  pl.a1.unit05.lesson01.teach.to_jest_moj_ojciec:
    title: هذا أبي
    gloss: هذا أبي.
    note: تعمل *To jest* (هذا هو / هذه هي) بالطريقة نفسها مهما كان جنس الاسم، والذي يتغير فقط هو mój/moja.
  pl.a1.unit05.lesson02.teach.dziadek_babcia:
    title: الجد، الجدة
    gloss: جد؛ جدة
    note: الكلمتان اليوميتان المعتادتان للجد والجدة، ويستعملهما الأطفال والكبار على حد سواء.
    example_gloss:
    - هذا جدّي.
    - هذه جدّتي.
  pl.a1.unit05.lesson02.teach.wujek_ciotka:
    title: العم أو الخال، العمة أو الخالة
    gloss: عم أو خال؛ عمة أو خالة
    note: تفرّق العربية بين العم والخال وبين العمة والخالة، أما البولندية فتستعمل كلمة واحدة للأخ أو الأخت من جهة الأب أو الأم، وكذلك لزوج أو زوجة أحدهما.
    example_gloss:
    - هذا عمّي.
    - هذه عمّتي.
  pl.a1.unit05.lesson02.teach.syn_corka:
    title: الابن، الابنة
    gloss: ابن؛ ابنة
    note: 'تُظهر الأمثلة صيغة المفعول به التي تلزم بعد *mieć* (يملك / لدى): يصبح *syn* هو *syna*، ويصبح *córka* هو *córkę*. وتشرح ملاحظات القواعد التالية سبب تغيّر النهاية.'
    example_gloss:
    - لدي ابن.
    - لدي ابنة.
  pl.a1.unit05.lesson02.teach.miec_note:
    title: 'الفعل «لدى»: mam وmasz وma'
    gloss: 'لدى: لدي، لديك، لديه / لديها -- لدي أخ، لديك أخت، لديه / لديها ابن.'
    note: '*Mieć* فعل بمعنى «يملك / لدى». *Mam* (لدي) و*ma* (لديه / لديها) هما الصيغتان الجديدتان الرئيسيتان في هذا الدرس، أما *masz* (لديك) فقد مرت بك من قبل عند السؤال عن العمر في الوحدة 2.'
  pl.a1.unit05.lesson02.teach.accusative_note:
    title: قول ما لديك
    gloss: 'بعد الفعل «لدى» تتغير نهاية الاسم: brat -> brata، siostra -> siostrę، syn -> syna، córka -> córkę.'
    note: هذه هي حالة المفعول به، وهي الصيغة التي يتخذها الاسم عندما يكون مفعولًا به مباشرًا لفعل مثل *mieć*. تضيف الأسماء المذكرة الدالة على الأشخاص (والحيوانات) مثل *brat* و*syn* النهاية *-a*، أما الأسماء المؤنثة مثل *siostra* و*córka* فتستبدل بالنهاية *-a* النهاية *-ę*.
  pl.a1.unit05.lesson02.teach.mam_brata_siostre:
    title: لدي أخ وأخت
    gloss: لدي أخ وأخت.
    note: تطبّق هذه الجملة نهايات المفعول به من ملاحظة القواعد في جملة كاملة، مع أداة الربط الجديدة *i* (و).
  pl.a1.unit05.lesson03.teach.lub:
    title: أو
    gloss: أو
    note: تُستعمل لعرض خيارين في سؤال إجابته بنعم أو لا. وفي العربية تقابلها «أم» في مثل هذا السؤال.
    example_gloss: هل لديك أخ أم أخت؟
  pl.a1.unit05.lesson03.teach.tylko:
    title: فقط
    gloss: فقط
    note: تأتي مباشرة قبل الكلمة التي تحصرها، بينما تأتي «فقط» في العربية عادةً بعد الكلمة.
    example_gloss: ليس لدي سوى أخت.
  pl.a1.unit05.lesson03.teach.gdzie:
    title: أين
    gloss: أين
    note: كلمة سؤال أساسية، وتأتي طبيعيًا مع mieszkać (يسكن)، كما في حوار هذا الدرس.
    example_gloss: أين يسكن أخوك؟
  pl.a1.unit05.lesson03.teach.on_ona_mieszka_note:
    title: هو، هي، وفعل «يسكن»
    gloss: 'هو، هي -- يسكن: أسكن، يسكن / تسكن. هو يسكن في غدانسك. هي تسكن في كراكوف.'
    note: '*On* (هو) و*ona* (هي) ضميرا الغائب. ويتبع الفعل *Mieszkać* (يسكن) نمط المتكلم والغائب نفسه الذي في *mieć*: *mieszkam* (أسكن، من *Mieszkam w Warszawie* في الوحدة 1) و*mieszka* (يسكن / تسكن). وتأتي أسماء الأماكن بعد *w* بصيغة المكان: يصبح *Gdańsk* هو *w Gdańsku*، ويصبح *Kraków* هو *w Krakowie*، وهو النمط نفسه في *Mieszkam w Warszawie* من الوحدة 1.'
  pl.a1.unit05.lesson03.teach.dialogue.line01:
    title: ماريك يسأل عن الإخوة
    gloss: ماريك يسأل إيفا إن كان لديها أخ أم أخت.
    note: سؤال إجابته بنعم أو لا يبدأ بـ *Czy*، وهي أداة السؤال نفسها من الوحدة 1. صار إيفا وماريك يعرفان بعضهما جيدًا، فانتقلا من صيغة الاحترام *pan*/*pani* إلى صيغة المخاطبة غير الرسمية *ty* (*masz*، *A ty?*، *twój*).
  pl.a1.unit05.lesson03.teach.dialogue.line02:
    title: إيفا تجيب وتسأل بدورها
    gloss: تقول إيفا إن لديها أخًا وأختًا، ثم تسأل ماريك السؤال نفسه.
    note: '*A ty?* («وأنت؟») طريقة موجزة وطبيعية لتوجيه السؤال إلى من سأل.'
  pl.a1.unit05.lesson03.teach.dialogue.line03:
    title: ماريك يجيب
    gloss: يقول ماريك إنه ليس لديه سوى أخت، وإنها تسكن في كراكوف، ثم يسأل إيفا عن أخيها.
    note: ليس لدى ماريك أخ، بل لديه *tylko siostrę* (أختًا فقط). وسؤاله عن أخي إيفا في محله لأن إيفا قالت من قبل إن لديها أخًا.
  pl.a1.unit05.lesson03.teach.dialogue.line04:
    title: إيفا تجيب
    gloss: تقول إيفا إن أخاها يسكن في غدانسك وإن لديه ابنًا وابنة.
    note: يعيد استعمال نمط المفعول به لكلمتي syn/córka من الدرس الثاني في هذه الوحدة.
  pl.a1.unit05.lesson03.teach.dialogue.line05:
    title: ماريك يعلّق
    gloss: 'يقول ماريك: عائلة رائعة!'
    note: '*Fajna* كلمة يومية غير رسمية بمعنى «لطيفة» أو «رائعة»، وهي تعليق ختامي طبيعي، وفي المستوى اللغوي نفسه لكلمة *Świetnie!* من الوحدة 4.'
