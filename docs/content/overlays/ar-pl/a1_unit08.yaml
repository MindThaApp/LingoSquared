teaching:
  pl.a1.unit08.lesson01.teach.bank_poczta:
    title: البنك، مكتب البريد
    gloss: بنك؛ مكتب بريد
    note: مهمتان يوميتان عاديتان -- كلمة bank قريبة جدًا من الكلمة العربية «بنك»، وpoczta هي المكان الذي تذهب إليه لإرسال رسالة أو طرد.
    example_gloss:
    - هذا بنك.
    - هذا مكتب بريد.
  pl.a1.unit08.lesson01.teach.apteka_restauracja:
    title: الصيدلية، المطعم
    gloss: صيدلية؛ مطعم
    note: Apteka هي المكان الذي تشتري منه الدواء (وليست متجرًا عامًا)؛ وrestauracja قريبة من الكلمة العربية «ريستوران» في اللفظ.
    example_gloss:
    - هذه صيدلية.
    - هذا مطعم.
  pl.a1.unit08.lesson01.teach.hotel_park:
    title: Hotel, park
    gloss: فندق؛ حديقة
    note: كلمتان قريبتان جدًا من نظيرتيهما العربيتين «فندق» وهو «هوتيل» في الاستعمال الدولي، ومن السهل التعرف عليهما كتابةً ونطقًا.
    example_gloss:
    - هذا فندق.
    - هذه حديقة.
  pl.a1.unit08.lesson01.teach.gdzie_jest_note:
    title: أين + [مكان]؟
    gloss: 'أين + [مكان]؟ -- تسأل Gdzie (أين) مع jest (يوجد) عن الموقع: أين البنك؟ أين الصيدلية؟'
    note: '*Gdzie* تعني «أين»، و*jest* تعني «يوجد/هو». وعند جمعهما يصبح *Gdzie jest...?* نمط السؤال اليومي للسؤال عن مكان أي مكان. استعمله كما هو عند السؤال عن مكان واحد؛ أما للسؤال عن أكثر من مكان فتستعمل البولندية *są* («يوجدون/هم») بدلًا منها.'
  pl.a1.unit08.lesson01.teach.gdzie_jest_bank:
    title: أين البنك؟
    gloss: أين البنك؟
    note: تطبيق نمط ملاحظة القواعد على أول كلمة مكان في هذا الدرس.
  pl.a1.unit08.lesson02.teach.blisko_daleko:
    title: قريب، بعيد
    gloss: قريب؛ بعيد
    note: زوج بسيط من الأضداد، يُستعمل مباشرة بعد jest لوصف قرب المكان أو بعده.
    example_gloss:
    - الحديقة قريبة.
    - الفندق بعيد.
  pl.a1.unit08.lesson02.teach.niedaleko:
    title: ليس بعيدًا
    gloss: ليس بعيدًا
    note: هي في الأصل *nie* («لا/ليس») مع *daleko* («بعيد») مدمجتين في كلمة واحدة -- طريقة ألطف وشائعة جدًا لطمأنة أحدهم بأن المكان في المتناول.
    example_gloss: الصيدلية ليست بعيدة.
  pl.a1.unit08.lesson02.teach.obok_naprzeciwko:
    title: بجانب، مقابل
    gloss: بجانب؛ مقابل
    note: تصفان كلتاهما موقع مكان بالنسبة إلى معلم ما، لا مجرد درجة قربه. وتتطلب كلتاهما أن ينتقل الاسم التالي إلى حالة المضاف إليه -- انظر ملاحظة القواعد في هذا الدرس.
    example_gloss:
    - الصيدلية بجانب البنك.
    - المطعم مقابل الفندق.
  pl.a1.unit08.lesson02.teach.genitive_note:
    title: 'بعد ''obok''/''naprzeciwko''/''blisko + اسم'': حالة المضاف إليه'
    gloss: 'بعد «بجانب»/«مقابل»/«قرب + مكان»: يأتي الاسم في حالة المضاف إليه -- البنك ← «بنك» في صيغة المضاف إليه، الفندق ← صيغة المضاف إليه، الحديقة ← صيغة المضاف إليه. الصيدلية بجانب البنك. المطعم مقابل الفندق. المطعم قريب من الحديقة.'
    note: 'تحكم *Obok* و*naprzeciwko* و*blisko* (حين يتبعها مكان، لا حين تأتي وحدها) حالة المضاف إليه، فتتغير نهاية الاسم الذي بعدها. وفي هذه الأسماء المذكرة المنتظمة الثلاثة تُضاف النهاية *-u*: تصبح *bank* هي *banku*، و*hotel* هي *hotelu*، و*park* هي *parku*. وعند استعمال *blisko* وحدها لا حاجة إلى المضاف إليه إطلاقًا -- فـ *To jest blisko* («هذا قريب») صحيحة تمامًا مثل *blisko parku* («قرب الحديقة»).'
  pl.a1.unit08.lesson02.teach.apteka_obok_banku:
    title: الصيدلية بجانب البنك
    gloss: الصيدلية بجانب البنك.
    note: 'تطبيق عملي لقاعدة النهاية -u في جملة حقيقية: تصبح bank هي banku بعد obok.'
  pl.a1.unit08.lesson03.teach.przepraszam:
    title: عفوًا
    gloss: عذرًا / آسف
    note: الطريقة اليومية للفت انتباه شخص غريب قبل طرح سؤال، وتُقال قبل السؤال لا بعده.
    example_gloss: عفوًا، أين المصرف؟
  pl.a1.unit08.lesson03.teach.dialogue.line01:
    title: إيفا تسأل عن الصيدلية
    gloss: تقول إيفا «عفوًا» وتسأل أين الصيدلية.
    note: تفتتح Przepraszam السؤال كما تصف ملاحظة مفردات هذا الدرس؛ حتى مع شخص تعرفه مثل ماريك، هي الطريقة المهذبة لمقاطعته قبل أن تسأله.
  pl.a1.unit08.lesson03.teach.dialogue.line02:
    title: ماريك يحدد مكان الصيدلية
    gloss: يقول ماريك إن الصيدلية ليست بعيدة، بجانب المصرف.
    note: تجمع بين niedaleko وobok + banku، وكلتاهما من ملاحظة القواعد في الدرس الثاني.
  pl.a1.unit08.lesson03.teach.dialogue.line03:
    title: إيفا تشكر ماريك وتسأل عن المطعم
    gloss: تقول إيفا شكرًا، وتسأل أين المطعم.
    note: Dziękuję مستخدمة من وحدات سابقة؛ وA (و) تربط السؤال الجديد بالسابق.
  pl.a1.unit08.lesson03.teach.dialogue.line04:
    title: ماريك يحدد مكان المطعم
    gloss: يقول ماريك إن المطعم مقابل الفندق، قرب المتنزه.
    note: Naprzeciwko + hotelu (حالة المضاف إليه، النمط نفسه في banku) مع blisko لمَعلم ثانٍ.
  pl.a1.unit08.lesson03.teach.dialogue.line05:
    title: إيفا تشكر ماريك مرة أخرى
    gloss: تقول إيفا شكرًا جزيلًا.
    note: Bardzo (جدًا) تقوّي dziękuję، كما تفعل في proszę bardzo.
  pl.a1.unit08.lesson03.teach.dialogue.line06:
    title: ماريك يرد
    gloss: 'يقول ماريك: لا شكر على واجب.'
    note: 'Proszę bardzo: الرد المعتاد على الشكر، وقد وردت في وحدة التسوق.'
