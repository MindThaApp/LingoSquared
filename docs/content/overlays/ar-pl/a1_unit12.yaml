teaching:
  pl.a1.unit12.lesson01.teach.wczoraj:
    title: أمس
    gloss: أمس
    note: الكلمة الأساسية للحديث عن يوم قريب انقضى، وتأتي بشكل طبيعي مع صيغ الماضي التي تتعلمها في هذه الوحدة.
    example_gloss: كنتُ في السينما أمس.
  pl.a1.unit12.lesson01.teach.co_bylo_wczoraj:
    title: ماذا حدث أمس؟
    gloss: ماذا حدث أمس؟
    note: الطريقة الطبيعية لطلب سرد حدث قريب -- لا تتغير كلمة było بحسب من يجيب، لذا يصلح هذا السؤال مع أي شخص تسأله.
  pl.a1.unit12.lesson01.teach.bylo_note:
    title: Było
    gloss: 'Było هي صيغة الماضي للمفرد المحايد (ono) من الفعل być (يكون) -- وتتفق مع co (ماذا)، لذلك تُستخدم عند السؤال عمّا حدث بشكل عام: Co było wczoraj؟ الكلمة نفسها مهما كان المجيب.'
    note: '*Było* هي صيغة المحايد التي تعني «كان» -- وهي تتفق مع *co* (ماذا) لا مع الشخص الذي تسأله، فتُفهم على أنها «كان» أو «ماذا حدث» في سؤال مفتوح مثل *Co było wczoraj?*'
  pl.a1.unit12.lesson01.teach.bylem_bylam:
    title: كنتُ (رجل / امرأة)
    gloss: كنتُ (يقولها رجل) / كنتُ (تقولها امرأة)
    note: 'يدل الفعل الماضي في البولندية على جنس المتكلم: byłem إذا كان المتكلم رجلًا، وbyłam إذا كانت المتكلمة امرأة. وكلاهما يعني «كنتُ» تمامًا.'
    example_gloss:
    - كنتُ في السينما أمس.
    - كنتُ في السينما أمس.
  pl.a1.unit12.lesson01.teach.gender_past_note:
    title: 'الماضي: -em مقابل -am'
    gloss: 'تختلف نهاية الفعل الماضي بحسب جنس المتكلم: -em عندما يتكلم رجل (byłem)، و-am عندما تتكلم امرأة (byłam). وينطبق هذا على كل فعل في الماضي، لا على być وحده.'
    note: 'انتبه إلى الحروف الأخيرة: *-em* تدل على أن المتكلم رجل، و*-am* تدل على أن المتكلمة امرأة. وستجد هذا النمط نفسه في كل فعل ماضٍ في هذه الوحدة.'
  pl.a1.unit12.lesson01.teach.w_kinie_locative_note:
    title: في السينما
    gloss: 'تغيّر kino نهايتها بعد w: تستخدم idę do kina (إلى أين؟) صيغة مختلفة عن jestem w kinie (أين؟). W kinie هي حالة الجر المكانية -- تبيّن أين يحدث الشيء، لا إلى أين يتجه الشخص.'
    note: 'نهايتان مختلفتان وسؤالان مختلفان: *do kina* تجيب عن «إلى أين؟» (وقد تعلمتها في وحدة الخطط)، أما *w kinie* فتجيب عن «أين؟» -- فلا تخلط بينهما.'
  pl.a1.unit12.lesson01.teach.bylem_w_kinie:
    title: كنتُ في السينما أمس (رجل)
    gloss: كنتُ في السينما أمس.
    note: تجمع byłem وwczoraj وw kinie -- بالطريقة التي يخبر بها رجل أين كان.
  pl.a1.unit12.lesson01.teach.bylam_w_kinie:
    title: كنتُ في السينما أمس (امرأة)
    gloss: كنتُ في السينما أمس.
    note: الجملة نفسها مع byłam -- بالطريقة التي تخبر بها امرأة أين كانت.
  pl.a1.unit12.lesson02.teach.film:
    title: فيلم
    gloss: فيلم
    note: كلمة يومية للحديث عمّا شاهدتَه، وتتكرر كثيرًا عند الحديث عن زيارة السينما.
    example_gloss: شاهدتُ فيلمًا جيدًا.
  pl.a1.unit12.lesson02.teach.dobry:
    title: جيد
    gloss: جيد
    note: سبق أن رأيت dobry في عبارة dzień dobry (يوم سعيد) -- وهنا تُستخدم وحدها كصفة عادية بمعنى «جيد».
    example_gloss: فيلم جيد جدًا!
  pl.a1.unit12.lesson02.teach.zobaczylem_zobaczylam:
    title: رأيتُ (رجل / امرأة)
    gloss: رأيتُ (يقولها رجل) / رأيتُ (تقولها امرأة)
    note: يدل Zobaczyć على فعل رؤية واحد منتهٍ (بخلاف widzieć الذي يدل على رؤية مستمرة) -- zobaczyłem إذا كان المتكلم رجلًا، وzobaczyłam إذا كانت المتكلمة امرأة، بنمط -em/-am نفسه في byłem/byłam.
    example_gloss:
    - شاهدتُ فيلمًا جيدًا.
    - شاهدتُ فيلمًا جيدًا.
  pl.a1.unit12.lesson02.teach.zobaczyc_pattern_note:
    title: النمط نفسه في byłem/byłam
    gloss: 'النمط نفسه في byłem/byłam: zobaczyłem يقولها رجل، وzobaczyłam تقولها امرأة. Zobaczyć فعل تام -- يدل على حدث واحد منتهٍ.'
    note: 'النهاية نفسها مع فعل جديد: يتبع *zobaczyłem/zobaczyłam* النمط نفسه الذي تعلمته للتو مع *byłem/byłam*.'
  pl.a1.unit12.lesson02.teach.zrobilem_zrobilam:
    title: صنعتُ / فعلتُ (رجل / امرأة)
    gloss: صنعتُ / فعلتُ (يقولها رجل) / صنعتُ / فعلتُ (تقولها امرأة)
    note: يشمل Zrobić معنيي «يصنع» و«يفعل» لعمل واحد منتهٍ -- zrobiłem للرجل وzrobiłam للمرأة، بالنمط نفسه مرة أخرى.
    example_gloss:
    - أعددتُ الغداء.
    - أعددتُ الغداء.
  pl.a1.unit12.lesson02.teach.obiad:
    title: الغداء
    gloss: الغداء / وجبة منتصف النهار
    note: ربما تتذكر obiad من وحدة الروتين اليومي -- وهنا هو ما يعدّه ماريك لوجبة اليوم الرئيسية.
    example_gloss: هذا غداء لذيذ.
  pl.a1.unit12.lesson02.teach.pyszny:
    title: لذيذ
    gloss: لذيذ
    note: طريقة ودودة ويومية لمدح الطعام -- تأتي بشكل طبيعي بعد obiad.
    example_gloss: هذا غداء لذيذ.
  pl.a1.unit12.lesson03.teach.jaki:
    title: أيّ / ما نوع
    gloss: أيّ / ما نوع
    note: 'سبق أن رأيت jaki في السؤال عن أرقام الهاتف وأيام الأسبوع -- وهنا تُستخدم بالطريقة نفسها لطلب تفصيل محدد: أيّ فيلم؟'
    example_gloss: أيّ فيلم هذا؟
  pl.a1.unit12.lesson03.teach.elliptical_note:
    title: أسئلة قصيرة من كلمة واحدة
    gloss: في المحادثة يمكنك طرح سؤال قصير بكلمة واحدة، مثل Pyszny؟ بدل السؤال الكامل Czy obiad był pyszny؟ -- يبدو ذلك طبيعيًا وسريعًا كما في المحادثة اليومية.
    note: في المحادثة الحقيقية نتخطى الجملة الكاملة حين يكون السياق واضحًا -- فكلمة *Pyszny?* وحدها تعني «هل كان لذيذًا؟»
  pl.a1.unit12.lesson03.teach.dialogue.line01:
    title: ماريك يسأل ماذا حدث
    gloss: مرحبًا يا إيفا! ماذا حدث أمس؟
    note: يعيد استخدام أول سؤال تعلمته في هذه الوحدة، وقد صار الآن بداية محادثة حقيقية.
  pl.a1.unit12.lesson03.teach.dialogue.line02:
    title: إيفا كانت في السينما
    gloss: كنتُ في السينما! شاهدتُ فيلمًا جيدًا.
    note: كلمتا Byłam وzobaczyłam بصيغة المؤنث، وكلتاهما تدل على أن المتكلمة هي إيفا.
  pl.a1.unit12.lesson03.teach.dialogue.line03:
    title: ماريك يسأل عن الفيلم
    gloss: أيّ فيلم؟
    note: سؤال متابعة قصير وطبيعي باستخدام jaki.
  pl.a1.unit12.lesson03.teach.dialogue.line04:
    title: إيفا تجيب وتسأل بدورها
    gloss: جيد جدًا! وأنت؟
    note: A ty? (وأنت؟) تعيد الكلام إلى ماريك دون الحاجة إلى أي قاعدة جديدة.
  pl.a1.unit12.lesson03.teach.dialogue.line05:
    title: ماريك أعدّ الغداء
    gloss: أعددتُ الغداء!
    note: تدل Zrobiłem (بصيغة المذكر) على أن المتكلم هو ماريك -- وهذا حدثه المنتهي في ذلك اليوم.
  pl.a1.unit12.lesson03.teach.dialogue.line06:
    title: إيفا تسأل إن كان لذيذًا
    gloss: لذيذ؟
    note: سؤال من كلمة واحدة، على النمط نفسه الوارد في ملاحظة القواعد في هذا الدرس.
