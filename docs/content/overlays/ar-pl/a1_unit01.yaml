teaching:
  pl.a1.unit01.lesson01.teach.pan:
    title: المخاطبة الرسمية لرجل
    gloss: السيد؛ سيدي (مخاطبة رسمية لرجل)
    note: 'في العربية الفصحى يكفي عادةً الضمير «أنتَ» أو «أنتِ» في المخاطبة، أما البولندية فتفرض اختيارًا اجتماعيًا: تُستعمل *pan* لمخاطبة رجل لا تعرفه أو رجل تحترمه بحكم عمله. نحويًا تعمل *pan* عمل فاعل في صيغة الغائب، فعبارة "pan jest" تعني حرفيًا «السيّد موجود»، وليست صيغة مخاطب حقيقية، مع أنها تُستعمل بمعنى «أنتَ».'
  pl.a1.unit01.lesson01.teach.pani:
    title: المخاطبة الرسمية لامرأة
    gloss: السيدة؛ سيدتي (مخاطبة رسمية لامرأة)
    note: هي المقابل المؤنث لـ *pan*. تُستعمل *pani* مع امرأة لا تعرفها أو امرأة تحترمها بحكم عملها. وتُخاطَب كل امرأة بالغة بـ *pani* بغضّ النظر عن حالتها الاجتماعية، فلا تفرّق البولندية في المخاطبة اليومية بين المتزوجة وغير المتزوجة.
  pl.a1.unit01.lesson01.teach.ty:
    title: ضمير المخاطب غير الرسمي
    gloss: أنتَ/أنتِ (غير رسمي، للمفرد)
    note: تُستعمل *Ty* مع صديق أو زميل أو فرد من العائلة أو طفل، أو مع أي شخص تربطك به علاقة غير رسمية. وعلى خلاف *pan* و*pani*، تأخذ *ty* نهايات فعل حقيقية للمخاطب، مثل *masz* («لديك/أنت»)، لا نهايات الغائب.
  pl.a1.unit01.lesson01.teach.jak_sie_pan_ma:
    title: سؤال رسمي عن الحال، لرجل
    gloss: كيف حالك؟ (لرجل، بصيغة رسمية)
    note: حرفيًا «كيف يكون حال السيّد». *Ma* هي صيغة الغائب للفعل (تتوافق مع *pan* بوصفها فاعلًا نحويًا)، وهي النهاية نفسها المستعملة مع *on* («هو»).
  pl.a1.unit01.lesson01.teach.jak_sie_pani_ma:
    title: كيف حالك؟ (لامرأة، بصيغة رسمية)
    gloss: كيف حالك؟ (لامرأة، بصيغة رسمية)
    note: النمط نفسه في *Jak się pan ma?* مع وضع *pani* مكان *pan*. وصيغة الفعل *ma* لا تتغير، فهي نهاية الغائب نفسها مهما كان جنس المخاطَب.
  pl.a1.unit01.lesson01.teach.jak_sie_masz:
    title: سؤال غير رسمي عن الحال
    gloss: كيف حالك؟ (غير رسمي)
    note: مع *ty* يأخذ الفعل نهاية المخاطب الحقيقية *masz* لا *ma*. قارن بين الصيغة الرسمية *Jak się pan/pani ma?* وغير الرسمية *Jak się masz?*؛ فهذا أفضل زوج للتمييز بين pan/pani وty في الفعل نفسه.
  pl.a1.unit01.lesson01.teach.dobrze_dziekuje:
    title: ردّ معتاد
    gloss: بخير، شكرًا.
    note: لا تتغير *Dziękuję* («شكرًا») بتغيّر المستوى اللغوي؛ فهي الكلمة نفسها سواء كنت تردّ على *pan* أو *pani* أو *ty*. السؤال وحده هو ما يحدد درجة الرسمية.
  pl.a1.unit01.lesson01.teach.a_pan:
    title: إعادة السؤال بصيغة رسمية
    gloss: وأنت؟ (لرجل، بصيغة رسمية)
    note: طريقة مختصرة لإعادة السؤال إلى رجل تخاطبه بصيغة رسمية. استبدل *pani* بـ *pan* («A pani?») عند إعادة السؤال إلى امرأة.
  pl.a1.unit01.lesson01.teach.a_ty:
    title: إعادة السؤال بصيغة غير رسمية
    gloss: وأنت؟ (غير رسمي)
    note: استعمل *ty* لإعادة السؤال إلى صديق أو زميل.
  pl.a1.unit01.lesson02.teach.czesc:
    title: تحية وداع غير رسمية
    gloss: مرحبًا؛ إلى اللقاء (غير رسمي، للتحية والوداع)
    note: '*Cześć* غير معتادة بين التحيات البولندية: فهي تُستعمل للتحية وللوداع معًا في المقام غير الرسمي نفسه. ولا تُستعمل إلا في العلاقات التي تُخاطَب فيها بـ *ty*، ولا تُقال أبدًا مع *pan* أو *pani*.'
    example_gloss: مرحبًا، كيف حالك؟
  pl.a1.unit01.lesson02.teach.dzien_dobry:
    title: تحية طوال النهار
    gloss: صباح الخير؛ طاب يومك
    note: تصلح *Dzień dobry* في أي وقت قبل المساء، وعلى خلاف *cześć* هي محايدة من حيث الرسمية، فتُقال مع *pan* و*pani* و*ty* على حد سواء. وهي أسلم تحية لمن لا تعرفه جيدًا.
  pl.a1.unit01.lesson02.teach.dobry_wieczor:
    title: تحية المساء
    gloss: مساء الخير
    note: تحلّ محلّ *dzień dobry* عند حلول المساء. واستعمالها محايد من حيث الرسمية أيضًا.
  pl.a1.unit01.lesson02.teach.dobranoc:
    title: وداع الليل
    gloss: تصبح على خير
    note: على خلاف *dzień dobry* و*dobry wieczór*، تُعدّ *dobranoc* وداعًا لا تحية؛ تُقال عندما يغادر أحدهم لقضاء الليل أو يذهب إلى النوم، ولا تُقال لبدء حديث.
    example_gloss: ليلة سعيدة يا بيوتر!
  pl.a1.unit01.lesson02.teach.do_widzenia:
    title: الوداع المعتاد
    gloss: مع السلامة
    note: الطريقة المحايدة والآمنة لقول وداعًا، وتصلح مع *pan* و*pani* و*ty*. وتبدو أكثر نهائية من *do zobaczenia*.
  pl.a1.unit01.lesson02.teach.do_zobaczenia:
    title: وداع «إلى اللقاء»
    gloss: إلى اللقاء
    note: حرفيًا «إلى أن [نرى بعضنا]». توحي بأنك تتوقع اللقاء مرة أخرى، بخلاف *do widzenia* الأكثر حيادًا.
  pl.a1.unit01.lesson02.teach.milego_dnia:
    title: أمنية ختامية مهذبة
    gloss: أتمنى لك يومًا سعيدًا!
    note: تستعمل *Miłego dnia* حالة المضاف إليه (الجر) في التمنّي، وهو النمط نفسه في *smacznego* («بالهناء والعافية»). هذه تركيبة ثابتة يحسن تعلّمها عبارةً كاملة بدل تحليلها حالةً حالةً في هذه المرحلة.
  pl.a1.unit01.lesson03.teach.jak_sie_pan_nazywa:
    title: السؤال عن الاسم بصيغة رسمية
    gloss: ما اسمك؟ (لرجل، بصيغة رسمية)
    note: حرفيًا «كيف يسمّي السيّد نفسه». الفعل *nazywać się* فعل انعكاسي معناه «يُسمّى». استبدل *pan* بـ *pani* عند مخاطبة امرأة بصيغة رسمية.
  pl.a1.unit01.lesson03.teach.jak_masz_na_imie:
    title: السؤال عن الاسم الأول بصيغة غير رسمية
    gloss: ما اسمك (الأول)؟
    note: تستعمل تعبيرًا مختلفًا هو *mieć na imię* («أن يكون اسمك الأول كذا»)، وتسأل تحديدًا عن الاسم الأول لا عن الاسم الكامل أو اللقب. وهي الطريقة غير الرسمية الطبيعية لسؤال زميل عن اسمه.
  pl.a1.unit01.lesson03.teach.nazywam_sie:
    title: قل اسمك الكامل
    gloss: اسمي آنا كوفالسكا.
    note: صيغة المتكلم من *nazywać się*، ويتبعها عادةً الاسم الأول واللقب معًا، وهي الطريقة الأكثر رسمية واكتمالًا للتعريف بنفسك.
  pl.a1.unit01.lesson03.teach.mam_na_imie:
    title: قل اسمك الأول
    gloss: اسمي آنا.
    note: صيغة المتكلم من *mieć na imię*، ويتبعها عادةً الاسم الأول وحده، وهي المقابل غير الرسمي لـ *Nazywam się...*.
  pl.a1.unit01.lesson03.teach.bardzo_mi_milo:
    title: التعبير عن السرور بلقاء شخص
    gloss: تشرفنا، سعدت جدًا بلقائك.
    note: عبارة ثابتة شائعة الاستعمال عند لقاء شخص للمرة الأولى، وتناسب المقامين الرسمي وغير الرسمي.
  pl.a1.unit01.lesson03.teach.skad_jestes:
    title: السؤال عن الأصل بصيغة غير رسمية
    gloss: من أين أنت؟
    note: تعني *Skąd* «من أين». الصيغة غير الرسمية (مع *ty*) معروضة هنا، أما الصيغة الرسمية المقابلة *Skąd pan/pani jest?* فتظهر في حوار ختام هذا الدرس.
  pl.a1.unit01.lesson03.teach.jestem_z:
    title: قل من أين أنت
    gloss: أنا من كندا.
    note: تأخذ *Z* («من») حالة المضاف إليه (الجر)، فتصبح *Kanada* هي *Kanady*. وتتبع معظم أسماء الدول هذا النمط بعد *z*.
  pl.a1.unit01.lesson03.teach.mieszkam_w:
    title: قل أين تسكن
    gloss: أسكن في وارسو.
    note: تأخذ *W* («في») هنا حالة الظرف المكاني، فتصبح *Warszawa* هي *Warszawie*. فالأصل (مع *z*) والإقامة الحالية (مع *w*) يستعملان حالتين مختلفتين لاسم المكان؛ لاحظ هذا النمط ولا تحفظه كاستثناء.
  pl.a1.unit01.lesson03.teach.dialogue.line01:
    title: بداية اللقاء
    gloss: تُحيّي أيفا ماريك وتسأله عن اسمه بصيغة رسمية.
    note: تستعمل أيفا صيغة *pan* الرسمية مع شخص تلتقيه للتو، وهو الخيار الآمن عند أول لقاء مهني أو مع شخص غريب.
  pl.a1.unit01.lesson03.teach.dialogue.line02:
    title: بداية اللقاء، الردّ
    gloss: يذكر ماريك اسمه الكامل ويقول إنه سعيد بلقائها.
    note: '*Nazywam się* مع الاسم الكامل هي الجواب الطبيعي والتام عن سؤال رسمي عن الاسم.'
  pl.a1.unit01.lesson03.teach.dialogue.line03:
    title: السؤال عن الأصل
    gloss: تبادله أيفا الشعور نفسه وتسأل ماريك من أين هو، بصيغة رسمية.
    note: '*Skąd pan jest?*، وهي المقابل الرسمي لـ *Skąd jesteś?* في هذا الدرس، تستعمل *jest*، وهي صيغة الغائب نفسها التي رأيناها في *pan jest* و*pan ma*.'
  pl.a1.unit01.lesson03.teach.dialogue.line04:
    title: السؤال عن الأصل، الردّ
    gloss: يقول ماريك إنه من كندا لكنه يسكن في وارسو.
    note: تربط *Ale* («لكن») بين أصل ماريك ومكان إقامته الحالي، وهو التمييز نفسه الذي تعبّر عنه *jestem z* و*mieszkam w*.
  pl.a1.unit01.lesson03.teach.dialogue.line05:
    title: السؤال عن إتقان اللغة
    gloss: تسأل أيفا ماريك إن كان يتكلم البولندية، بصيغة رسمية.
    note: تبدأ الجملة الاستفهامية التي جوابها «نعم» أو «لا» بالكلمة *czy*. وهي في البولندية أداة استفهام مثل «هل» في العربية، ولا يلزم فعل مساعد؛ فـ *czy* وحدها تدل على أن السؤال قادم.
  pl.a1.unit01.lesson03.teach.dialogue.line06:
    title: السؤال عن إتقان اللغة، والجواب، والختام
    gloss: يقول ماريك إنه يتكلم قليلًا وما زال يتعلم، ثم يودّعها.
    note: '*Jeszcze się uczę* («ما زلت أتعلم») طريقة طبيعية ومتواضعة لوصف جهد متواصل، ومفيدة لمتعلم حقيقي أن يقولها عن نفسه أيضًا.'
exercises:
  pl.a1.unit01.lesson01.exercise01.select_formal_man:
    instruction: أي كلمة تُستعمل لمخاطبة رجل بصيغة رسمية محترمة؟
    correct_option: pan
    distractors:
    - pani
    - ty
    accepted_answers:
    - pan
    feedback: تُستعمل pan لمخاطبة رجل بصيغة رسمية، وتأخذ أفعالًا بصيغة الغائب.
  pl.a1.unit01.lesson01.exercise02.select_formal_woman:
    instruction: أي كلمة تُستعمل لمخاطبة امرأة بصيغة رسمية محترمة؟
    correct_option: pani
    distractors:
    - pan
    - ty
    accepted_answers:
    - pani
    feedback: تُستعمل pani لمخاطبة امرأة بصيغة رسمية، وتأخذ صيغ الفعل الغائبة نفسها التي تأخذها pan.
  pl.a1.unit01.lesson01.exercise03.select_informal:
    instruction: أي كلمة تُستعمل لمخاطبة صديق واحد أو زميل بصيغة غير رسمية؟
    correct_option: ty
    distractors:
    - pan
    - pani
    accepted_answers:
    - ty
    feedback: تُستعمل ty مع الأصدقاء والزملاء وفي العلاقات غير الرسمية، وتأخذ نهايات فعل حقيقية للمخاطب.
  pl.a1.unit01.lesson01.exercise04.order_formal_wellbeing:
    instruction: رتّب السؤال الرسمي عن الحال (لرجل).
    accepted_answers:
    - - Jak
      - się
      - pan
      - ma
    - - Jak
      - pan
      - się
      - ma
  pl.a1.unit01.lesson01.exercise05.order_informal_wellbeing:
    instruction: رتّب السؤال غير الرسمي عن الحال.
    correct_response:
    - Jak
    - się
    - masz
  pl.a1.unit01.lesson01.exercise06.return_formal:
    instruction: أعد السؤال مع المحافظة على الصيغة المحترمة.
    correct_option: A pan?
    distractors:
    - A ty?
    - Jak się masz?
    accepted_answers:
    - A pan?
    - A pan
    - A pani?
    - A pani
    feedback: A pan?/A pani? تحافظ على الصيغة الرسمية عند إعادة السؤال.
  pl.a1.unit01.lesson01.exercise07.return_informal:
    instruction: أعد السؤال إلى صديق أو زميل.
    correct_option: A ty?
    distractors:
    - A pan?
    - A pani?
    accepted_answers:
    - A ty?
    - A ty
    feedback: A ty? هي الطريقة غير الرسمية لإعادة السؤال.
  pl.a1.unit01.lesson01.exercise08.correct_informal_agreement:
    instruction: صحّح السؤال غير الرسمي؛ فهو يجمع ty مع نهاية فعل غير صحيحة.
    accepted_answers:
    - Jak się masz?
    - Jak się masz
    - Jak ty się masz?
    - Jak się ty masz?
    feedback: تأخذ ty النهاية masz لا ma؛ فـ ma لا تُستعمل إلا مع pan/pani (أو on/ona).
  pl.a1.unit01.lesson01.exercise09.reply_formally:
    instruction: أجب عن السؤال بأدب.
    accepted_answers:
    - Dobrze, dziękuję.
    - Dobrze, dziękuję
    - Dziękuję, dobrze.
    - Dobrze, dziękuję. A pan?
    - Dziękuję, dobrze. A pan?
    - Dobrze, dziękuję. A pani?
    - Dziękuję, dobrze. A pani?
  pl.a1.unit01.lesson01.exercise10.speak_informally:
    instruction: أجب بأسلوب غير رسمي، واشكر المتحدث، ثم أعد عليه السؤال.
    accepted_answers:
    - Dobrze, dziękuję. A ty?
    - Dobrze, dziękuję, a ty?
    - Dobrze, dziękuję. A ty
    - Dziękuję, dobrze. A ty?
  pl.a1.unit01.lesson02.exercise01.select_hi:
    instruction: أي كلمة يمكن أن تعني التحية والوداع معًا في المقام غير الرسمي؟
    correct_option: Cześć
    distractors:
    - Dzień dobry
    - Do widzenia
    accepted_answers:
    - Cześć
  pl.a1.unit01.lesson02.exercise02.select_evening:
    instruction: أيّ تحية تُستخدم في المساء؟
    correct_option: Dobry wieczór
    distractors:
    - Dzień dobry
    - Dobranoc
    accepted_answers:
    - Dobry wieczór
  pl.a1.unit01.lesson02.exercise03.select_night_meaning:
    instruction: ماذا تعني هذه الكلمة؟
    correct_option: تصبح على خير.
    distractors:
    - مساء الخير.
    - إلى اللقاء.
    accepted_answers:
    - تصبح على خير.
    feedback: Dobranoc وداع يُقال عندما يغادر أحدهم لقضاء الليل، وليست تحية.
  pl.a1.unit01.lesson02.exercise04.order_morning:
    instruction: رتّب التحية المستعملة طوال النهار.
    correct_response:
    - Dzień
    - dobry
  pl.a1.unit01.lesson02.exercise05.order_goodbye:
    instruction: رتّب عبارة الوداع المعتادة.
    correct_response:
