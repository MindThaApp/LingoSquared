  pl.a1.unit19.lesson01.teach.recap_jaka_jest_dzis_nie:
    title: ما، يكون، اليوم، لا -- مراجعة
    gloss: Jaka, jest, Dziś, nie -- تعرف هذه الكلمات من الدروس السابقة.
    note: تذكير سريع قبل أن يستخدمها هذا الدرس للحديث عن الطقس.
  pl.a1.unit19.lesson01.teach.pogoda:
    title: الطقس
    gloss: الطقس
    note: الكلمة العامة للطقس أو لأحوال الجوّ.
    example_gloss: كيف حال الطقس؟
  pl.a1.unit19.lesson01.teach.zimno:
    title: بارد
    gloss: بارد
    note: تصف درجة الحرارة -- ولا تتغيّر صيغتها بحسب الجنس.
    example_gloss: الجوّ بارد.
  pl.a1.unit19.lesson01.teach.goraco:
    title: الحرّ
    gloss: حارّ
    note: عكس «*zimno*» -- ولا تتغيّر صيغتها بحسب الجنس أيضًا.
    example_gloss: الجوّ حارّ.
  pl.a1.unit19.lesson01.teach.jest_pogoda_note:
    title: الجوّ بارد، الجوّ حارّ
    gloss: 'Jest zimno. Jest gorąco. -- هكذا نصف الطقس بالبولندية: «*jest*» مع كلمة عن الطقس، دون أي مطابقة في الجنس.'
    note: يصلح النمط البسيط نفسه لكل كلمات الطقس في هذه الوحدة.
  pl.a1.unit19.lesson01.teach.jaka_jest_pogoda_phrase:
    title: كيف حال الطقس؟
    gloss: كيف حال الطقس؟
    note: طريقة طبيعية للسؤال عن الطقس الحالي.
  pl.a1.unit19.lesson01.teach.dzis_jest_zimno_phrase:
    title: الجوّ بارد اليوم
    gloss: الجو بارد اليوم.
    note: المعلومة التي تقوم عليها هذه الوحدة كلها في وصف طقس اليوم.
  pl.a1.unit19.lesson02.teach.pada:
    title: المطر يهطل
    gloss: تمطر
    note: تُستعمل وحدها دون فاعل، وهذه هي الطريقة العادية لقول «تمطر» في البولندية.
    example_gloss: تمطر اليوم.
  pl.a1.unit19.lesson02.teach.snieg:
    title: الثلج
    gloss: ثلج
    note: كلمة الثلج. مع '*pada*' تعني «تثلج».
    example_gloss: تثلج.
  pl.a1.unit19.lesson02.teach.mgla:
    title: الضباب
    gloss: ضباب
    note: حالة جوية شائعة أخرى.
    example_gloss: الجو ضبابي.
  pl.a1.unit19.lesson02.teach.dobra_note:
