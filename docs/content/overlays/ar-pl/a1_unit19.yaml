    gloss: Pogoda jest dobra. -- '*dobra*' تناسب الأسماء المؤنثة مثل '*pogoda*'.
    note: صيغة المؤنث من '*dobry*' (كما في '*Dzień dobry*')، وهي النمط نفسه -y/-a كما في *chory/chora*.
  pl.a1.unit19.lesson02.teach.straszna_note:
    title: فظيع
    gloss: Jaka straszna pogoda! -- '*straszna*' تناسب '*pogoda*' أيضًا، تمامًا مثل '*dobra*'.
    note: كلمة قوية، تُستعمل للطقس السيئ فعلًا.
  pl.a1.unit19.lesson02.teach.jaka_straszna_pogoda_phrase:
    title: يا له من طقس فظيع!
    gloss: يا له من طقس فظيع!
    note: عبارة تعجب طبيعية عن الطقس السيئ.
  pl.a1.unit19.lesson02.teach.pogoda_dobra_phrase:
    title: الطقس جيد
    gloss: الطقس جيد.
    note: إعادة استعمال كلمة الطقس من بداية هذا الدرس.
  pl.a1.unit19.lesson03.teach.recap_words:
    title: نعم، و، أنا، أيضًا — مرة أخرى
    gloss: Tak, A, ja, też, chcę, iść, idę, do, parku, tam, bardzo -- تعرف هذه الكلمات من الدروس السابقة.
    note: تذكير سريع قبل حوار هذا الدرس.
  pl.a1.unit19.lesson03.teach.bo:
    title: لأنّ
    gloss: لأنّ
    note: تربط الخطة بسبب الطقس الذي وراءها.
    example_gloss: لن أذهب إلى الحديقة لأنها تمطر.
  pl.a1.unit19.lesson03.teach.nie_chce_isc_bo_pada_phrase:
    title: لا أريد الذهاب لأنها تمطر
    gloss: لا أريد الذهاب إلى الحديقة لأنها تمطر.
    note: وصف للطقس مع خطة حقيقية، وهذا ما تهدف إليه هذه الوحدة.
  pl.a1.unit19.lesson03.teach.w_krakowie_recap:
    title: في كراكوف — مرة أخرى
    gloss: W Krakowie -- تعرف هذا من الدروس السابقة، مثل 'Ona mieszka w Krakowie' (هي تسكن في كراكوف).
    note: تذكير سريع قبل أن يقارن حوار هذا الدرس الطقس في مكانين.
  pl.a1.unit19.lesson03.teach.dialogue.line01:
    title: ماريك يسأل عن الطقس
    gloss: كيف الطقس اليوم؟
    note: يبدأ ماريك الحوار بالسؤال عن طقس اليوم.
  pl.a1.unit19.lesson03.teach.dialogue.line02:
    title: إيفا تجيب
    gloss: تمطر. الجو بارد.
    note: تصف إيفا طقس اليوم الفعلي.
  pl.a1.unit19.lesson03.teach.dialogue.line03:
    title: ماريك يعلّق ويضع خطة
    gloss: يا له من طقس فظيع! لا أريد الذهاب إلى الحديقة لأنها تمطر.
    note: يعلّق ماريك على الطقس ويذكر خطته بسببه.
  pl.a1.unit19.lesson03.teach.dialogue.line04:
    title: إيفا توافق
    gloss: أنا أيضًا لن أذهب إلى الحديقة.
    note: تضع إيفا الخطة نفسها التي وضعها ماريك.
  pl.a1.unit19.lesson03.teach.dialogue.line05:
    title: ماريك يسأل عن كراكوف
    gloss: وفي كراكوف؟ كيف الطقس هناك؟
    note: ينقل ماريك الحديث إلى طقس مدينة أخرى.
  pl.a1.unit19.lesson03.teach.dialogue.line06:
    title: إيفا تجيب
    gloss: في كراكوف تثلج. الجو بارد جدًا هناك.
    note: تصف إيفا حالة جوية مختلفة وأشد برودة في كراكوف.
