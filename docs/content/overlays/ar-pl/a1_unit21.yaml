teaching:
  pl.a1.unit21.lesson01.teach.szczesliwy_smutny_zly:
    title: سعيد وحزين وغاضب
    gloss: سعيد، حزين، غاضب
    note: ثلاث كلمات أساسية للمشاعر تُستعمل مع *jestem* (أنا). وهي بصيغة المذكر؛ وتقول المرأة *szczęśliwa, smutna, zła*.
    example_gloss:
    - أنا سعيد.
    - أنا حزين.
    - أنا غاضب.
  pl.a1.unit21.lesson01.teach.jestem_szczesliwy:
    title: قول إنك سعيد
    gloss: أنا سعيد.
    note: 'النمط الأساسي هو *jestem* (أنا، من *być*) + صفة. وعلى خلاف الجملة الاسمية في العربية التي لا تحتاج إلى فعل في الحاضر، يلزم في البولندية وجود الفعل. وتتوافق الصفة مع المتكلم: *szczęśliwy* (رجل)، *szczęśliwa* (امرأة).'
  pl.a1.unit21.lesson01.teach.nie_jestem_zly:
    title: المقارنة بين مشاعر
    gloss: لست غاضبًا، أنا حزين.
    note: 'تأتي *Nie* مباشرة قبل الفعل: *Nie jestem zły*. ثم تذكر الجملة الثانية الشعور الفعلي.'
  pl.a1.unit21.lesson02.teach.dlaczego_jestes_szczesliwy:
    title: السؤال عن السبب
    gloss: لماذا أنت سعيد؟
    note: '*Dlaczego* (لماذا) هي أداة الاستفهام المعتادة عن السبب.'
  pl.a1.unit21.lesson02.teach.jestem_szczesliwy_bo:
    title: ذكر السبب
    gloss: أنا سعيد لأن لدي شقة جديدة.
    note: '*Bo* (لأن) تُدخل السبب؛ وبعد *mam* (عندي) يأتي الاسم في حالة المفعول به: *nowe mieszkanie*.'
  pl.a1.unit21.lesson02.teach.jestem_smutny_bo:
    title: سبب سلبي
    gloss: أنا حزين لأن المطر يهطل.
    note: '*Pada deszcz* (تمطر، وحرفيًا «المطر يسقط») هي العبارة المعتادة للحديث عن الطقس، وتُستعمل هنا سببًا.'
  pl.a1.unit21.lesson03.teach.zdenerwowany:
    title: متوتر
    gloss: متوتر
    note: الكلمة المعتادة للتعبير عن التوتر.
    example_gloss: أنا متوتر قبل أول مناوبة لي.
  pl.a1.unit21.lesson03.teach.jestem_zdenerwowany_przed:
    title: ذكر سبب توترك
    gloss: أنا متوتر قبل أول مناوبة لي.
    note: '*Przed* (وحرفيًا «قبل/أمام») + الحالة الأداتية تبيّن سبب التوتر، بمعنى «من/بسبب»: *przed pierwszą zmianą*.'
  pl.a1.unit21.lesson03.teach.nie_martw_sie:
    title: طمأنة شخص ما
    gloss: لا تقلق.
    note: '*Nie martw się* (وحرفيًا «لا تُقلق نفسك») هي عبارة الطمأنة المعتادة؛ و*się* ضمير انعكاسي.'
  pl.a1.unit21.lesson04.teach.jak_czuje_sie:
    title: السؤال عن شعور شخص ما
    gloss: كيف يشعر Marek؟
    note: '*Czuć się* (يشعر، فعل انعكاسي) هو الطريقة المعتادة للسؤال عن الحالة الشعورية أو وصفها: *Jak czuje się Marek?*'
  pl.a1.unit21.lesson04.teach.on_czuje_sie:
    title: وصف شعور شخص ما
    gloss: هو يشعر بالتوتر.
    note: 'يبقى *się* مع الفعل: *on czuje się*. والصفة مذكرة لتتوافق مع *on*: *zdenerwowany*.'
  pl.a1.unit21.lesson04.teach.dlaczego_on_czuje:
    title: السؤال عن سبب شعور شخص ما
    gloss: لماذا يشعر بالتوتر؟
    note: تجمع بين *dlaczego* (لماذا) ونمط *czuje się* من جملة *On czuje się zdenerwowany*.
  pl.a1.unit21.lesson05.teach.czesc_ewo_jestem:
    title: اقرأ رسالة عن المشاعر
    gloss: مرحبًا Ewa، أنا متوتر قليلًا قبل ورديتي الأولى بمفردي. لكنني سعيد أيضًا، لأن لدي عملًا جديدًا وشقة جديدة. أظن أن كل شيء سيكون بخير.
    note: تتبّع سبب توتر الكاتب، وما يسعده، ونظرته العامة.
    glosses:
      trochę: قليلًا
      zdenerwowany: متوتر
      pierwszą: أول
      zmianą: مناوبة
      samodzielną: وحده
      szczęśliwy: سعيد
      bo: لأن
      nową: جديد
      pracę: عمل
      nowe: جديد
      mieszkanie: شقة
      myślę: يظن
      będzie: سيكون على ما يرام
  pl.a1.unit21.lesson06.teach.ewa_czesc_marku:
    title: Ewa تسأل Marek عن شعوره
    gloss: 'Ewa: مرحبًا Marek، كيف تشعر قبل ورديتك الأولى؟'
    note: '*Przed pierwszą zmianą* (قبل ورديتك الأولى) تعيد نمط *przed* + الحالة الأداتية من الدرس 3. و*Czujesz się* هي صيغة المخاطب *ty*.'
  pl.a1.unit21.lesson06.teach.marek_szczerze_mowiac:
    title: Marek يعترف بتوتره
    gloss: 'Marek: بصراحة، أنا متوتر قليلًا.'
    note: '*Szczerze mówiąc* (بصراحة، وحرفيًا «أقول بصدق») تخفف وقع الاعتراف.'
  pl.a1.unit21.lesson06.teach.ewa_nie_martw:
    title: Ewa تطمئنه
    gloss: 'Ewa: لا تقلق، ستتدبر أمرك جيدًا!'
    note: '*Dobrze sobie poradzisz* (وحرفيًا «ستتدبر أمرك جيدًا») عبارة تشجيع ثابتة؛ و*poradzisz* هي صيغة المستقبل للمخاطب *ty* من *poradzić sobie*.'
  pl.a1.unit21.lesson06.teach.marek_dzieki_to:
    title: Marek يشكرها
    gloss: 'Marek: شكرًا، هذا يساعدني فعلًا.'
    note: '*Pomaga* هي صيغة *on/ona/ono* من *pomagać* (يساعد)؛ و*dzięki* تعني «شكرًا» بأسلوب غير رسمي.'
  pl.a1.unit21.lesson06.teach.ewa_a_potem:
    title: Ewa تتوقع النتيجة
    gloss: 'Ewa: وبعد ذلك ستكون بالتأكيد سعيدًا جدًا وفخورًا.'
    note: '*Na pewno* (بالتأكيد) تعبّر عن توقع واثق؛ و*dumny* (فخور) صفة جديدة ومفيدة. و*Będziesz* هي صيغة المستقبل من *być*.'
  pl.a1.unit21.lesson06.teach.marek_tak_ja:
    title: Marek يوافق
    gloss: 'Marek: نعم، أنا أظن ذلك أيضًا.'
    note: '*Ja też tak myślę* (وحرفيًا «أنا أيضًا أفكر هكذا») هي الطريقة الطبيعية للموافقة؛ وأُضيف *ja* هنا للتوكيد.'
  pl.a1.unit21.lesson06.teach.marek_jest_zdenerwowany:
    title: التلخيص باستعمال jest وmu
    gloss: Marek متوتر قبل ورديته الأولى. Ewa تساعده.
    note: '*Jest* هي صيغة *on/ona* من *być* (يكون)؛ و*mu* تعني «له» (حالة المفعول غير المباشر، لأن *pomagać* يتطلب هذه الحالة). كلمات صغيرة لكنها ضرورية للحديث عن شخص آخر.'
