teaching:
  pl.a1.unit02.lesson01.teach.zero:
    title: Zero
    gloss: صفر
    note: نقطة البداية لكل عدد يأتي بعده في هذه الوحدة.
    example_gloss: درجة الحرارة اليوم صفر.
  pl.a1.unit02.lesson01.teach.jeden:
    title: واحد
    gloss: واحد
    note: بعد *jeden* يأتي اسم عادي بصيغة المفرد، على خلاف كل الأعداد الأخرى في هذا الدرس.
    example_gloss: عندي هاتف واحد.
  pl.a1.unit02.lesson01.teach.dwa:
    title: اثنان
    gloss: اثنان
    note: بعد *dwa* و*trzy* و*cztery* يأتي الاسم بصيغة جمع خاصة (مثل *psy* أي «كلاب»)، تختلف عن صيغة الجمع بعد *pięć* وما فوقها.
    example_gloss: عندي كلبان.
  pl.a1.unit02.lesson01.teach.trzy:
    title: ثلاثة
    gloss: ثلاثة
    note: 'نمط الجمع نفسه كما في *dwa*: *trzy złote* (ثلاثة złoty) وليس *trzy złotych*.'
    example_gloss: القهوة تكلف ثلاثة złoty.
  pl.a1.unit02.lesson01.teach.cztery:
    title: أربعة
    gloss: أربعة
    note: آخر الأعداد الثلاثة (*dwa* و*trzy* و*cztery*) التي تشترك في نمط الجمع هذا.
    example_gloss: عندي أربعة كتب.
  pl.a1.unit02.lesson01.teach.piec:
    title: خمسة
    gloss: خمسة
    note: ابتداءً من *pięć* تأخذ الأعداد صيغة جمع مختلفة للاسم (جمع حالة الإضافة، مثل *minut* بدل *minuty*)، وسيستمر هذا النمط في بقية الوحدة.
    example_gloss: لدي خمس دقائق.
  pl.a1.unit02.lesson01.teach.szesc:
    title: ستة
    gloss: ستة
    note: 'نمط جمع حالة الإضافة نفسه كما في *pięć*: *sześć jabłek* (ست تفاحات).'
    example_gloss: عندي ست تفاحات.
  pl.a1.unit02.lesson01.teach.siedem:
    title: سبعة
    gloss: سبعة
    note: عدد مفيد للحديث عن أيام الأسبوع.
    example_gloss: في الأسبوع سبعة أيام.
  pl.a1.unit02.lesson01.teach.osiem:
    title: ثمانية
    gloss: ثمانية
    note: '*Mam osiem lat* تعني حرفيًا «أملك ثماني سنوات»: فالبولندية تعبّر عن العمر بالفعل *mieć* («يملك»)، بينما نقول في العربية «عمري ثماني سنوات». ستتدرب على هذا النمط كاملًا في الدرس 3.'
    example_gloss: عمري ثماني سنوات.
  pl.a1.unit02.lesson01.teach.dziewiec:
    title: تسعة
    gloss: تسعة
    note: 'جمع حالة الإضافة مرة أخرى: *dziewięć osób* (تسعة أشخاص).'
    example_gloss: تسعة أشخاص ينتظرون في الصف.
  pl.a1.unit02.lesson01.teach.dziesiec:
    title: عشرة
    gloss: عشرة
    note: آخر الأعداد المكونة من رقم واحد؛ ويتابع الدرس 2 مع الأعداد من أحد عشر فما فوق ومع العشرات.
    example_gloss: لدي عشرة أصابع.
  pl.a1.unit02.lesson02.teach.jedenascie:
    title: أحد عشر
    gloss: أحد عشر
    note: 'الأعداد من 11 إلى 19 تنتهي بـ *-naście*، وهي مثل *pięć* وما بعدها تأخذ جمع حالة الإضافة: *jedenaście osób*.'
    example_gloss: في الصف أحد عشر شخصًا.
  pl.a1.unit02.lesson02.teach.dwanascie:
    title: اثنا عشر
    gloss: اثنا عشر
    note: نمط *-naście* نفسه كما في *jedenaście*.
    example_gloss: في السنة اثنا عشر شهرًا.
  pl.a1.unit02.lesson02.teach.pietnascie:
    title: خمسة عشر
    gloss: خمسة عشر
    note: 'ما زلنا مع نمط *-naście*: *piętnaście minut* (خمس عشرة دقيقة).'
    example_gloss: لدي استراحة مدتها خمس عشرة دقيقة.
  pl.a1.unit02.lesson02.teach.dwadziescia:
    title: عشرون
    gloss: عشرون
    note: الأعداد من 20 إلى 40 تنتهي بـ *-dzieści*، وهو نمط يختلف عن نمط *-naście*. وما زال *dwadzieścia* نفسه يأخذ جمع حالة الإضافة (*dwadzieścia lat*)، لكن انتبه في الدرس 3 لما يحدث عند إضافة رقم آحاد إليه.
    example_gloss: عمري عشرون عامًا.
  pl.a1.unit02.lesson02.teach.dwadziescia_jeden:
    title: واحد وعشرون
    gloss: واحد وعشرون
    note: تُبنى الأعداد المركبة في البولندية بذكر العشرات أولًا ثم الآحاد دون حرف عطف، بينما نقول في العربية «واحد وعشرون» بتقديم الآحاد واستخدام الواو.
  pl.a1.unit02.lesson02.teach.trzydziesci:
    title: ثلاثون
    gloss: ثلاثون
    note: ما زلنا مع نمط *-dzieści* الذي رأيناه في *dwadzieścia*.
    example_gloss: التذكرة تكلف ثلاثين złotych.
  pl.a1.unit02.lesson02.teach.piecdziesiat:
    title: خمسون
    gloss: خمسون
    note: الأعداد من 50 إلى 90 تتبع نمطًا ثالثًا هو *-dziesiąt* بدل *-dzieści*.
    example_gloss: لدي خمسون złoty.
  pl.a1.unit02.lesson02.teach.sto:
    title: مئة
    gloss: مئة
    note: عدد مستدير واضح لا يحتاج إلى نهاية مركبة.
    example_gloss: هذا يكلف مئة złotych.
  pl.a1.unit02.lesson02.teach.ile:
    title: كم
    gloss: كم
    note: أداة الاستفهام للسؤال عن أي كمية أو سعر.
    example_gloss: كم يكلف هذا؟
  pl.a1.unit02.lesson02.teach.ile_to_kosztuje:
    title: السؤال عن السعر
    gloss: كم يكلف هذا؟
    note: '*Kosztować* («يكلّف») هو الفعل، و*to* («هذا») هو الفاعل. والسؤال كله نمط ثابت وشائع جدًا.'
  pl.a1.unit02.lesson02.teach.to_kosztuje_dwadziescia:
    title: ذكر السعر
    gloss: هذا يكلف عشرين złoty.
    note: '*Złotych* هي جمع حالة الإضافة من *złoty* (عملة بولندا)، وهو نمط الجمع نفسه الذي يأخذه *dwadzieścia* أصلًا.'
  pl.a1.unit02.lesson03.teach.jaki_jest_pana_numer:
    title: السؤال عن رقم الهاتف، لرجل
    gloss: ما رقم هاتفك؟ (لرجل، بصيغة رسمية)
    note: حرفيًا «ما هو رقم هاتف السيد». و*Pana* هي صيغة الملكية (حالة الإضافة) من *pan*، أي «للسيد»، وتعني هنا «لك».
  pl.a1.unit02.lesson03.teach.jaki_jest_pani_numer:
    title: السؤال عن رقم الهاتف، لامرأة
    gloss: ما رقم هاتفك؟ (لامرأة، بصيغة رسمية)
    note: استبدل *pana* بـ *pani* لمخاطبة امرأة بصيغة رسمية، على نمط الوحدة 1.
  pl.a1.unit02.lesson03.teach.jaki_jest_twoj_numer:
    title: السؤال عن رقم الهاتف، بصيغة غير رسمية
    gloss: ما رقم هاتفك؟ (بصيغة غير رسمية)
    note: تحل *Twój* (لك، غير رسمي) محل *pana*/*pani* عند الحديث مع صديق أو زميل.
  pl.a1.unit02.lesson03.teach.numer_to:
    title: 'إعطاء رقم: جملة تمهيدية'
    gloss: الرقم هو...
    note: جملة تمهيدية قصيرة وطبيعية قبل قراءة الأرقام واحدًا واحدًا، وهي الطريقة المعتادة التي ينطق بها البولنديون رقم الهاتف.
  pl.a1.unit02.lesson03.teach.przykladowy_numer:
    title: رقم هاتف نموذجي
    gloss: ستة، واحد، خمسة، صفر، اثنان.
    note: تُقرأ أرقام الهاتف في البولندية رقمًا رقمًا، كما يحدث غالبًا في العربية؛ وكل رقم هنا سبق تعلمه في هذه الوحدة.
  pl.a1.unit02.lesson03.teach.ile_masz_lat:
    title: السؤال عن عمر شخص، بصيغة غير رسمية
    gloss: كم عمرك؟ (غير رسمي)
    note: 'حرفيًا «كم سنة لديك»: فالبولندية تعبّر عن العمر بالفعل *mieć* («يملك»)، وهو النمط نفسه الذي رأيناه في بطاقة *osiem* في الدرس 1.'
  pl.a1.unit02.lesson03.teach.ile_pan_ma_lat:
    title: السؤال عن عمر شخص، بصيغة رسمية
    gloss: كم عمرك؟ (لرجل، بصيغة رسمية)
    note: '*Ma* هي صيغة الغائب نفسها التي رأيناها مع *pan jest*/*pan ma* في الوحدة 1؛ فـ *pan* تتصرف نحويًا بمعنى «السيد»، أي فاعل غائب.'
  pl.a1.unit02.lesson03.teach.mam_dwadziescia_osiem_lat:
    title: قل عمرك
    gloss: عمري ثمانية وعشرون عامًا.
    note: '*Mam* هي صيغة المتكلم من الفعل *mieć* («يملك»). و*Dwadzieścia osiem* تنتهي بـ *osiem* (ثمانية)، ولذلك تأخذ *lat* مثل كل عدد ينتهي بـ 5 إلى 9؛ وانتبه في حوار الدرس 3 إلى عدد ينتهي بشكل مختلف.'
  pl.a1.unit02.lesson03.teach.dialogue.line01:
    title: إيفا تسأل عن رقم ماريك
    gloss: تسأل إيفا ماريك عن رقم هاتفه بصيغة رسمية.
    note: هو سؤال رقم الهاتف الرسمي نفسه في هذا الدرس.
  pl.a1.unit02.lesson03.teach.dialogue.line02:
    title: ماريك يعطي رقمه
    gloss: يقرأ ماريك رقم هاتفه رقمًا رقمًا.
    note: كل رقم هنا سبق تعلمه في الدرسين 1 و2 من هذه الوحدة.
  pl.a1.unit02.lesson03.teach.dialogue.line03:
    title: إيفا تسأل عن عمر ماريك
    gloss: تشكره إيفا وتسأله عن عمره بصيغة رسمية.
    note: '*Dziękuję* («شكرًا») و*A* («و») لا تتغيران بتغير مستوى الرسمية، مثل بطاقة *dziękuję* في الوحدة 1.'
  pl.a1.unit02.lesson03.teach.dialogue.line04:
    title: ماريك يذكر عمره ويعيد السؤال
    gloss: يقول ماريك إن عمره ثمانية وعشرون عامًا ويسأل إيفا عن عمرها بصيغة رسمية.
    note: '*A pani?* تعيد السؤال بصيغة رسمية إلى امرأة، وهو النمط القصير نفسه الذي تعلمناه في الوحدة 1 مع *A pan?*.'
  pl.a1.unit02.lesson03.teach.dialogue.line05:
    title: إيفا تذكر عمرها
    gloss: تقول إيفا إن عمرها اثنان وثلاثون عامًا.
    note: '*Trzydzieści dwa* ينتهي بـ *dwa* (اثنان)، ولذلك يأخذ *lata* بخلاف *dwadzieścia osiem* (الذي ينتهي بثمانية ويأخذ *lat*)؛ فالأعداد التي تنتهي بـ 2 أو 3 أو 4 (باستثناء 12 و13 و14) تستعمل صيغة الجمع المختلفة هذه. وهذه نقطة نحوية حقيقية: لا يمكن تبديل *lat* و*lata*، والصيغة الصحيحة تتوقف على الرقم الأخير من العدد.'
  pl.a1.unit02.lesson03.teach.dialogue.line06:
    title: ماريك ينهي المحادثة
    gloss: يقول ماريك إنه سعد بالحديث معها، ثم يودعها.
    note: تعيد *Do zobaczenia* عبارة الوداع «أراك قريبًا» من الوحدة 1.
