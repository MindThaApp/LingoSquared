teaching:
  pl.a1.unit03.lesson01.teach.poniedzialek:
    title: الاثنين
    gloss: الاثنين
    note: أول أيام الأسبوع في البولندية، بينما يُعدّ الأحد أول أيام الأسبوع في العربية.
    example_gloss: اليوم هو الاثنين.
  pl.a1.unit03.lesson01.teach.wtorek:
    title: الثلاثاء
    gloss: الثلاثاء
    note: انتبه لهذه الكلمة -- يأخذ *wtorek* حرف الجر *we* لا *w* عند قول «يوم الثلاثاء». المزيد عن ذلك لاحقًا في هذا الدرس.
    example_gloss: اليوم هو الثلاثاء.
  pl.a1.unit03.lesson01.teach.sroda:
    title: الأربعاء
    gloss: الأربعاء
    note: اسم مؤنث، بخلاف معظم أيام الأسبوع الأخرى.
    example_gloss: اليوم هو الأربعاء.
  pl.a1.unit03.lesson01.teach.czwartek:
    title: الخميس
    gloss: الخميس
    note: على نمط المذكر نفسه كما في *poniedziałek* و*wtorek* و*piątek*.
    example_gloss: اليوم هو الخميس.
  pl.a1.unit03.lesson01.teach.piatek:
    title: الجمعة
    gloss: الجمعة
    note: سترى هذا اليوم مرة أخرى لاحقًا في الوحدة -- إنه اليوم الذي تخطط فيه إيفا وماريك للقاء من جديد.
    example_gloss: اليوم الجمعة.
  pl.a1.unit03.lesson01.teach.sobota:
    title: السبت
    gloss: السبت
    note: من يومَي عطلة نهاية الأسبوع، ويستخدم كثير من البولنديين أيضًا الكلمة المستعارة *weekend*.
    example_gloss: اليوم هو السبت.
  pl.a1.unit03.lesson01.teach.niedziela:
    title: الأحد
    gloss: الأحد
    note: آخر أيام الأسبوع السبعة التي يتناولها هذا الدرس.
    example_gloss: اليوم هو الأحد.
  pl.a1.unit03.lesson01.teach.jaki_dzien:
    title: السؤال عن اليوم
    gloss: أي يوم من أيام الأسبوع اليوم؟
    note: صيغة سؤال مباشرة -- تعني *dzień tygodnia* حرفيًا «يوم الأسبوع».
  pl.a1.unit03.lesson01.teach.we_wtorek_note:
    title: الاستثناء بين w وwe
    gloss: يوم الاثنين، ويوم الخميس، ويوم الجمعة -- لكن يوم الثلاثاء (لتسهيل النطق).
    note: 'تأتي معظم أيام الأسبوع بصيغة «*w* + اليوم» بمعنى «يوم ...». أما *wtorek* فهو الاستثناء الحقيقي الوحيد: يقول البولنديون *we wtorek* لا *w wtorek*، لمجرد أن ذلك أسهل في النطق -- فهو شذوذ حقيقي وليس خطأً مطبعيًا.'
  pl.a1.unit03.lesson01.teach.w_piatek_kino:
    title: يوم الجمعة أذهب إلى السينما
    gloss: يوم الجمعة أذهب إلى السينما.
    note: لا تتغير *Piątek* بعد *w* -- أما *środa* و*sobota* و*niedziela* فتتغير (ولا يتناول هذا الدرس ذلك تبسيطًا في المستوى A1).
  pl.a1.unit03.lesson02.teach.styczen_luty_marzec:
    title: يناير، فبراير، مارس
    gloss: يناير؛ فبراير؛ مارس
    note: تُعدّ *Luty* الشاذة نحويًا بين الأشهر -- فهي تتصرف كالصفة لا كالاسم العادي (سترى ذلك مجددًا في صيغة «في فبراير» لاحقًا في الوحدة).
    example_gloss:
    - عيد ميلادي في يناير.
    - سأذهب إلى وارسو في فبراير.
    - عيد ميلادي في مارس.
  pl.a1.unit03.lesson02.teach.kwiecien_maj_czerwiec:
    title: أبريل، مايو، يونيو
    gloss: أبريل؛ مايو؛ يونيو
    note: '*Maj* هو الشهر الذي سترى استخدامه في التاريخين الواردين في قصة هذه الوحدة.'
    example_gloss:
    - سأذهب إلى وارسو في أبريل.
    - عيد ميلادي في مايو.
    - سأذهب إلى وارسو في يونيو.
  pl.a1.unit03.lesson02.teach.lipiec_sierpien_wrzesien:
    title: يوليو، أغسطس، سبتمبر
    gloss: يوليو؛ أغسطس؛ سبتمبر
    note: 'شذوذ حقيقي آخر هنا: «في سبتمبر» هي *we wrześniu* لا *w wrześniu* -- وهو التبديل نفسه إلى *we* لتسهيل النطق الذي رأيته مع *wtorek*.'
    example_gloss:
    - أنا في إجازة في يوليو.
    - سأذهب إلى وارسو في أغسطس.
    - عيد ميلادي في سبتمبر.
  pl.a1.unit03.lesson02.teach.pazdziernik_listopad_grudzien:
    title: أكتوبر، نوفمبر، ديسمبر
    gloss: أكتوبر؛ نوفمبر؛ ديسمبر
    note: الأشهر الثلاثة الأخيرة من السنة، وبها تكتمل الأشهر الاثنا عشر.
    example_gloss:
    - سأذهب إلى وارسو في أكتوبر.
    - عيد ميلادي في نوفمبر.
    - أنا في إجازة في ديسمبر.
  pl.a1.unit03.lesson02.teach.urodziny:
    title: عيد الميلاد
    gloss: عيد ميلاد
    note: تُعدّ *Urodziny* دائمًا جمعًا نحويًا في البولندية، حتى لو كانت عيد ميلاد شخص واحد -- فهي تقترن بصيغة الجمع *są* لا بصيغة المفرد *jest*. ستتدرب على هذه النقطة بعينها في تمرين لاحق ضمن هذا الدرس.
    example_gloss: عيد ميلادي في مايو.
  pl.a1.unit03.lesson02.teach.kiedy:
    title: متى
    gloss: متى
    note: كلمة الاستفهام للسؤال عن أي نقطة في الزمن.
    example_gloss: متى الاجتماع؟
  pl.a1.unit03.lesson02.teach.kiedy_sa_twoje_urodziny:
    title: السؤال عن عيد ميلاد شخص ما
    gloss: متى عيد ميلادك؟
    note: تأتي *Są* لا *jest* لتتفق مع *urodziny* الجمع -- وهو النمط الذي أُشير إليه في بطاقة *urodziny*.
  pl.a1.unit03.lesson02.teach.moje_urodziny_sa_dziesiatego_maja:
    title: ذكر تاريخ عيد الميلاد
    gloss: عيد ميلادي في العاشر من مايو.
    note: '*Dziesiątego maja* -- ينتهي اليوم بـ *-ego* وينتهي الشهر بـ *-a*، دون أي حرف جر. هذه هي الطريقة المعتادة في البولندية لذكر تاريخ محدد؛ انظر ملاحظة القواعد لاحقًا في هذا الدرس للاطلاع على النمط كاملًا.'
  pl.a1.unit03.lesson02.teach.kiedy_jest_spotkanie:
    title: السؤال عن موعد الاجتماع
    gloss: متى الاجتماع؟
    note: '*Spotkanie* (اجتماع، لقاء) -- كلمة سترى مجددًا في حوار الدرس 3.'
  pl.a1.unit03.lesson02.teach.spotkanie_jest_pietnastego_maja:
    title: ذكر تاريخ الاجتماع
    gloss: الاجتماع في الخامس عشر من مايو.
    note: نمط التاريخ نفسه *-ego* + *-a* كما في *dziesiątego maja*، مع رقم يوم مختلف.
  pl.a1.unit03.lesson02.teach.date_pattern_note:
    title: كيف تُذكر التواريخ في البولندية
    gloss: 'التاريخ: ينتهي اليوم بـ -ego وينتهي الشهر بـ -a (لكن فبراير هو lutego)، دون حرف جر -- العاشر من مايو، الخامس عشر من مايو.'
    note: قارن هذا بعبارة «يوم الجمعة» (*w piątek*، التي تحتاج إلى حرف الجر *w*) -- فذكر تاريخ محدد في التقويم يختلف، ولا يأخذ أي حرف جر إطلاقًا.
  pl.a1.unit03.lesson03.teach.kiedy_mozemy_sie_spotkac:
    title: اقتراح اللقاء مرة أخرى
    gloss: متى يمكننا أن نلتقي مرة أخرى؟
    note: تعني *Znowu* «مرة أخرى» -- وهي طريقة طبيعية لبدء حديث عن تحديد لقاء آخر.
  pl.a1.unit03.lesson03.teach.czy_piatek_panu:
    title: سؤال رجل رسميًا إن كان يوم الجمعة يناسبه
    gloss: هل يناسبك يوم الجمعة؟ (لرجل، بصيغة رسمية)
    note: '*Panu* هي صيغة الحالة الثالثة (حالة المُتلقّي) من *pan*. والفعل *odpowiadać* (بمعنى «يناسب») يأتي مفعوله دائمًا في هذه الحالة، ولذلك نقول *Czy piątek panu odpowiada?* أي «هل يناسبك يوم الجمعة؟».'
  pl.a1.unit03.lesson03.teach.czy_piatek_pani:
    title: سؤال امرأة رسميًا إن كان يوم الجمعة يناسبها
    gloss: هل يناسبك يوم الجمعة؟ (لامرأة، بصيغة رسمية)
    note: استبدل *pani* بـ *panu* لمخاطبة امرأة رسميًا -- وتبقى *pani* كما هي في حالتي الفاعل والمتلقي هنا، بخلاف *pan*/*panu*.
  pl.a1.unit03.lesson03.teach.czy_piatek_ci:
    title: سؤال صديق إن كان يوم الجمعة مناسبًا (بصيغة غير رسمية)
    gloss: هل يناسبك يوم الجمعة؟ (بصيغة غير رسمية)
    note: تحلّ *ci* محلّ *panu*/*pani* عند الحديث مع صديق أو زميل من العمر نفسه، وهي صيغة المخاطَب غير الرسمية في حالة الجرّ بحرف «لـ» (حالة المفعول غير المباشر).
  pl.a1.unit03.lesson03.teach.piatek_mi_odpowiada:
    title: قول إن يوم الجمعة مناسب لك
    gloss: يوم الجمعة يناسبني.
    note: '*Mi* هي صيغة المتكلّم في حالة المفعول غير المباشر نفسها التي في *panu*/*pani*/*ci*، لكن بمعنى «لي» بدل «لك».'
  pl.a1.unit03.lesson03.teach.data:
    title: التاريخ
    gloss: التاريخ (يوم في التقويم)
    note: تدلّ كلمة data على تاريخ يوم محدد في التقويم، أي اليوم والشهر والسنة.
    example_gloss: ما هو التاريخ في ذلك اليوم؟
  pl.a1.unit03.lesson03.teach.jaka_to_bedzie_data:
    title: السؤال عن التاريخ
    gloss: ما هو التاريخ في ذلك اليوم؟
    note: سؤال طبيعي بعد أن يتفق شخصان على يوم من أيام الأسبوع دون تحديد التاريخ بدقة.
  pl.a1.unit03.lesson03.teach.dialogue.line01:
    title: إيفا تقترح أن يلتقيا مجددًا
    gloss: تسأل إيفا ماركو متى يمكنهما أن يلتقيا مجددًا.
    note: هذا هو سؤال افتتاح الدرس نفسه تمامًا.
  pl.a1.unit03.lesson03.teach.dialogue.line02:
    title: ماركو يقترح يوم الجمعة بصيغة رسمية
    gloss: يسأل ماركو إيفا بصيغة رسمية إن كان يوم الجمعة مناسبًا لها.
    note: يخاطب ماركو إيفا بـ *pani* مواصلةً للأسلوب الرسمي المستخدم منذ الوحدة الأولى.
  pl.a1.unit03.lesson03.teach.dialogue.line03:
    title: إيفا توافق وتسأل عن التاريخ
    gloss: تقول إيفا إن يوم الجمعة يناسبها، ثم تسأل عن التاريخ الدقيق.
    note: تبدأ إيفا موافقتها بـ *Tak* («نعم») التي مرّت في الوحدة الأولى، ثم تسأل عن التاريخ الدقيق.
  pl.a1.unit03.lesson03.teach.dialogue.line04:
    title: ماركو يذكر التاريخ
    gloss: يقول ماركو إنه 15 مايو.
    note: سبق أن تعلّمت الكلمتين كلتيهما في الدرس الثاني من هذه الوحدة.
  pl.a1.unit03.lesson03.teach.dialogue.line05:
    title: إيفا تؤكد وتودّع
    gloss: تقول إيفا إن ذلك رائع، وتقول إلى اللقاء في 15 مايو.
    note: تعيد *Do zobaczenia* عبارة الوداع من الوحدة الأولى، لكنها هنا مقترنة بتاريخ محدد.
  pl.a1.unit03.lesson03.teach.dialogue.line06:
    title: ماركو ينهي المحادثة
    gloss: يردّ ماركو بالوداع.
    note: أقصر خاتمة ممكنة، وهي عبارة الوداع وحدها.
