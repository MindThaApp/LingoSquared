teaching:
  pl.a1.unit22.lesson01.teach.dzwonic:
    title: الاتصال
    gloss: يتصل
    note: صيغة المصدر للفعل الذي يُستخدم لإجراء مكالمة هاتفية.
    example_gloss: عليّ أن أتصل بك.
  pl.a1.unit22.lesson01.teach.zadzwonie_do_ciebie:
    title: قول إنك ستتصل
    gloss: سأتصل بك.
    note: '*Zadzwonię* هو المستقبل التام للفعل *zadzwonić* (يتصل مرة واحدة). تستخدمه البولندية للوعد، كما تقول بالعربية «سأتصل بك».'
  pl.a1.unit22.lesson01.teach.halo_tu_ewa:
    title: الرد على الهاتف
    gloss: مرحبًا، أنا إيفا.
    note: '*Tu* + الاسم (حرفيًا «هنا ...») هي الطريقة المعتادة للتعريف بنفسك في الهاتف، وهي قريبة من قولنا «معك فلان».'
  pl.a1.unit22.lesson01.teach.halo_tu_marek:
    title: يرد ماريك بالطريقة نفسها
    gloss: مرحبًا، أنا ماريك.
    note: 'النمط نفسه: *tu* + الاسم، كما في *Halo, tu Ewa*.'
  pl.a1.unit22.lesson02.teach.z_kim_rozmawiam:
    title: السؤال عن هوية المتصل
    gloss: مع من أتحدث؟
    note: '*Z kim rozmawiam?* (حرفيًا «مع من أتحدث؟») هي العبارة المعتادة عند الاتصال بشخص غير معروف؛ و*kim* حالة الأداة بعد *z*.'
  pl.a1.unit22.lesson02.teach.rozmawia_pan_z:
    title: التعريف بنفسك بصيغة رسمية
    gloss: أنت تتحدث مع إيفا.
    note: '*Rozmawia pan z Ewą* هي الصيغة الرسمية: *pan* (لرجل) أو *pani* (لامرأة) مع الفعل في صيغة الغائب، ثم *z* + حالة الأداة.'
  pl.a1.unit22.lesson03.teach.mozesz_to_powtorzyc:
    title: طلب الإعادة
    gloss: هل يمكنك إعادة ذلك؟
    note: '*Możesz* (هل تستطيع، من *móc*) + المصدر *powtórzyć* (يكرر) + *to* (ذلك).'
  pl.a1.unit22.lesson03.teach.nie_mow_tak:
    title: طلب التحدث ببطء
    gloss: لا تتكلم بهذه السرعة، من فضلك.
    note: '*Nie mów* هو أمر منفي (لا تتكلم)؛ و*tak szybko* تعني «بهذه السرعة».'
  pl.a1.unit22.lesson03.teach.nie_slysze_cie:
    title: قول إنك لا تسمع جيداً
    gloss: لا أسمعك جيداً.
    note: '*Nie słyszę cię dobrze* تعبّر عن مشكلة في السمع؛ و*cię* هو المفعول به للضمير *ty*، و*dobrze* تعني «جيدًا».'
  pl.a1.unit22.lesson04.teach.sms:
    title: رسالة نصية
    gloss: الرسالة النصية
    note: '*SMS* اسم مذكر مستعار من لغة أجنبية: *ten SMS*.'
    example_gloss: الرسالة النصية من إيفا.
  pl.a1.unit22.lesson04.teach.wysle_ci_sms:
    title: قول إنك سترسل رسالة
    gloss: سأرسل لك رسالة نصية.
    note: 'الفعل *wysłać* (يرسل) يأخذ الدايتف *ci* (لك) للشخص، والمفعول به للشيء المرسَل: *Wyślę ci SMS*.'
  pl.a1.unit22.lesson04.teach.oddzwonie_pozniej:
    title: قول إنك ستعاود الاتصال
    gloss: سأتصل بك لاحقاً.
    note: '*Oddzwonić* (يعاود الاتصال) فعل واحد في البولندية: *oddzwonię później*.'
  pl.a1.unit22.lesson05.teach.marek_czesc_ewo:
    title: قراءة محادثة نصية
    gloss: 'ماريك: مرحبًا يا إيفا، هل يمكنك الاتصال بي؟ يجب أن أقول لك شيئًا. إيفا: نعم بالطبع، سأعاود الاتصال بعد خمس دقائق.'
    note: تتبّع ما يطلبه ماريك، ولماذا، ومتى تقول إيفا إنها ستعاود الاتصال.
    glosses:
      Cześć: مرحباً
      możesz: تستطيع
      zadzwonić: الاتصال
      Muszę: يجب أن / عليّ
      coś: شيء ما
      powiedzieć: أخبر
      oczywiście: بالطبع
      oddzwonię: الاتصال
      pięć: خمسة
      minut: دقائق
      za: أعيد
  pl.a1.unit22.lesson06.teach.marek_halo_tu:
    title: ماريك يرد على المكالمة
    gloss: 'ماريك: مرحبًا، أنا ماريك.'
    note: 'النمط نفسه *tu* + الاسم من الدرس الأول، يُستخدم الآن في مكالمة فعلية: من يرد على الهاتف يتكلم أولًا ويذكر اسمه.'
  pl.a1.unit22.lesson06.teach.ewa_czesc_marku:
    title: إيفا تعرّف بنفسها
    gloss: 'إيفا: مرحبًا يا ماريك، أنا إيفا. ماريك: جميل أنك تتصلين!'
    note: '*Fajnie, że* ... (جميل أن ...) تعبّر عن ردة فعل إيجابية تجاه حدث ما؛ و*że* تُدخل الجملة التابعة.'
  pl.a1.unit22.lesson06.teach.ewa_jak_ci:
    title: إيفا تسأل عن المناوبة
    gloss: 'إيفا: كيف كانت أول مناوبة لك؟'
    note: '*Jak ci poszła ...?* (حرفيًا «كيف مضت ... معك؟») سؤال عن شيء حدث بالفعل. *Ci* هو الدايتف من *ty*، و*poszła* تتفق مع الاسم المؤنث *zmiana*.'
  pl.a1.unit22.lesson06.teach.marek_poszlo_bardzo:
    title: ماريك يخبر بخبر سار
    gloss: 'ماريك: سارت على ما يرام، أفضل مما ظننت.'
    note: '*Poszło* هو الماضي من *iść* بالنهاية *-o* (للمحايد «هو»؛ وهنا بمعنى «سارت الأمور»)؛ و*myślałem* هو الماضي من *myśleć* (يظن/يفكر)، بنهاية المتكلم الذكر.'
  pl.a1.unit22.lesson06.teach.czas_przeszly_bylo:
    title: 'الزمن الماضي: było, poszło, myślałem'
    gloss: 'الزمن الماضي: *było* (كان) من *być* (يكون)، و*poszło* (ذهب/سار) من *iść* (يذهب)، و*myślałem* (ظننتُ) من *myśleć* (يظن/يفكر).'
    note: 'يُبنى الماضي في البولندية بالإضافة *-ł-* ثم نهاية تدل على الجنس: *myślał* (هو)، *myślała* (هي)، *było* (محايد). الآن احفظ *było* و*poszło* و*myślałem* كصيغ ثابتة في السياقات الواردة في هذا الدرس.'
  pl.a1.unit22.lesson06.teach.ewa_jak_milo:
    title: إيفا فخورة
    gloss: 'إيفا: كم يسعدني سماع ذلك! أنا فخورة بك.'
    note: '*Dumny z* (فخور بـ) تركيب ثابت: *z* + المضاف إليه (الجنيتيف)، لذا *z ciebie*. إيفا امرأة، لذلك تقول *dumna*.'
  pl.a1.unit22.lesson06.teach.marek_dziekuje_ci:
    title: ماريك متأثر
    gloss: 'ماريك: شكرًا جزيلًا، هذا يعني لي الكثير.'
    note: '*Znaczy* هي صيغة المفرد الغائب (*on/ona/ono*) من *znaczyć* (يعني)؛ و*dla mnie* (بالنسبة لي) تحدد لمن هذا مهم.'
  pl.a1.unit22.lesson06.teach.jego_pierwsza_zmiana:
    title: 'الملكية: su'
    gloss: سارت مناوبته الأولى بشكل جيد جداً.
    note: '*Jego* (له/ـه) لا تتغير وتأتي قبل الاسم: *jego pierwsza zmiana*؛ والاسم المؤنث لا يؤثر فيها.'
