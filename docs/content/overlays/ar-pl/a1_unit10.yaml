teaching:
  pl.a1.unit10.lesson01.teach.wstawac_wstaje:
    title: يستيقظ، أستيقظ
    gloss: يستيقظ؛ أستيقظ
    note: Wstawać هو المصدر؛ أما wstaję فهي صيغة المتكلم اليومية التي ستستخدمها للحديث عن روتينك.
    example_gloss: أستيقظ في السابعة صباحًا.
  pl.a1.unit10.lesson01.teach.jesc_jem:
    title: يأكل، آكل
    gloss: يأكل؛ آكل
    note: فعل Jeść غير منتظم قليلًا، لكن jem («آكل») هي الصيغة الأكثر استخدامًا -- فهكذا يقول البولندي «آكل» عن أي وجبة.
    example_gloss: آكل الفطور في الصباح.
  pl.a1.unit10.lesson01.teach.sniadanie:
    title: الإفطار
    gloss: إفطار
    note: لا يتغير شكل Śniadanie بعد jem -- فعبارة «آكل الفطور» هي ببساطة jem śniadanie، دون نهاية إضافية تحتاج إلى تعلّمها.
    example_gloss: في الصباح آكل الفطور.
  pl.a1.unit10.lesson01.teach.pic_pije:
    title: يشرب، أشرب
    gloss: يشرب؛ أشرب
    note: Pić هو المصدر؛ وpiję صيغة المتكلم، وتُستخدم بالطريقة نفسها مثل jem وwstaję.
    example_gloss: أشرب القهوة في الصباح.
  pl.a1.unit10.lesson01.teach.pierwsza_osoba_note:
    title: الحديث عن نفسك
    gloss: Wstaję, jem, piję -- في هذه الوحدة نتحدث عن أنفسنا فقط، بصيغة المتكلم (أنا)، كما تصف يومك الخاص.
    note: تلتزم هذه الوحدة كلها عمدًا بصيغة «أنا» لكل فعل -- *wstaję* (أستيقظ)، *jem* (آكل)، *piję* (أشرب) -- لكي تركّز على وصف روتينك الخاص دون أن تتعلم في الوقت نفسه كيف يتغير كل فعل مع «أنت» أو «هو» أو «هي».
  pl.a1.unit10.lesson01.teach.o_siodmej_rano:
    title: أستيقظ في السابعة صباحًا
    gloss: أستيقظ في السابعة صباحًا.
    note: 'تطبيق عملي لنمط القاعدة: o + صيغة المكان (الحالة المكانية) للساعة (siódmej) تعني «في» تلك الساعة، تمامًا كما في وحدة الوقت السابقة.'
  pl.a1.unit10.lesson01.teach.sniadanie_kawa:
    title: أتناول الفطور وأشرب القهوة
    gloss: أتناول الفطور وأشرب القهوة.
    note: فعلان بصيغة المتكلم يربط بينهما الحرف i (و) — طريقة طبيعية لسرد أنشطتك الصباحية.
  pl.a1.unit10.lesson02.teach.obiad:
    title: الغداء
    gloss: الغداء / وجبة منتصف النهار
    note: مثل śniadanie، لا تتغير صيغة obiad بعد jem — فعبارة jem obiad تعني ببساطة «أتناول الغداء».
    example_gloss: أتناول الغداء عند الظهر.
  pl.a1.unit10.lesson02.teach.pracowac_pracuje:
    title: يعمل، أعمل
    gloss: يعمل؛ أعمل
    note: يتبع الفعل pracować النمط نفسه -ować ← -uję الذي رأيته في kosztować ← kosztuje في وحدة التسوق، لكن هنا بصيغة المتكلم.
    example_gloss: أعمل بعد الظهر.
  pl.a1.unit10.lesson02.teach.dom:
    title: المنزل
    gloss: البيت / المنزل
    note: الكلمة اليومية للبيت — تتكرر كثيرًا في عبارة «الذهاب إلى البيت / العودة إلى البيت».
    example_gloss: البيت هناك.
  pl.a1.unit10.lesson02.teach.do_domu_note:
    title: إلى البيت
    gloss: 'إلى البيت — بعد do تأتي حالة الإضافة (المضاف إليه)، وتنتهي هذه الحالة في dom بـ -u: domu، وهو النمط نفسه في bank ← banku وpark ← parku وhotel ← hotelu.'
    note: تستعمل عبارة *Do domu* («إلى البيت»، كما في «أنا ذاهب إلى البيت») النهاية *-u* نفسها في حالة الإضافة التي تعلمتها بعد *do* مع bank وhotel وpark — اسم آخر يتبع النمط ذاته.
  pl.a1.unit10.lesson02.teach.wracac_wracam:
    title: يعود، أعود
    gloss: يعود / يرجع؛ أعود / أرجع
    note: يُستعمل مع do domu للقول «أذهب إلى البيت» أو «أعود إلى البيت» — من أكثر العبارات اليومية شيوعًا في البولندية.
    example_gloss: أعود إلى البيت مساءً.
  pl.a1.unit10.lesson02.teach.pory_dnia:
    title: عند الظهر، بعد الظهر، مساءً
    gloss: عند الظهر؛ بعد الظهر؛ مساءً
    note: 'مراجعة من وحدة الوقت السابقة: مع rano وw nocy، تغطي عبارات أوقات اليوم هذه اليوم كله.'
    example_gloss:
    - أتناول الغداء عند الظهر.
    - أعمل بعد الظهر.
    - أعود إلى البيت مساءً.
  pl.a1.unit10.lesson02.teach.praca_dom_phrase:
    title: أعمل بعد الظهر ثم أعود إلى البيت
    gloss: أعمل بعد الظهر، ثم أعود إلى البيت.
    note: نمط الفاصلة + potem نفسه من وحدة الاتجاهات، يُستعمل الآن للربط بين جزأين من الروتين اليومي.
  pl.a1.unit10.lesson03.teach.spac_spie:
    title: ينام، أنام
    gloss: ينام؛ أنام
    note: يتغير حرف العلة في śpię عن المصدر spać بشكل يبدو غير منتظم، لكنه فعل شائع جدًا يستحق أن تحفظه كما هو.
    example_gloss: أنام في الليل.
  pl.a1.unit10.lesson03.teach.a_ty_ja_tez:
    title: وأنت؟ وأنا أيضًا.
    gloss: وأنت؟ / وأنا أيضًا.
    note: A ty? طريقة بسيطة لإعادة الحديث إلى الطرف الآخر؛ وja też تعني «وأنا أيضًا» — وكلتاهما تتكرران كثيرًا في الأحاديث اليومية.
    example_gloss: وأنا أيضًا أتناول الفطور في الصباح.
  pl.a1.unit10.lesson03.teach.ale_nie_herbata:
    title: لكن، شاي، لا
    gloss: لكن؛ شاي (مفعول به)؛ لا
    note: تُدخل ale تقابلًا؛ وعندما تأتي nie قبل كلمة (لا قبل فعل) فهي تعني «ليس [ذلك الشيء]» — فعبارة piję herbatę, nie kawę تعني «أشرب الشاي لا القهوة».
    example_gloss: أشرب الشاي لكن ليس القهوة.
  pl.a1.unit10.lesson03.teach.dziesiatej_wczesnie_note:
    title: مبكرًا، في العاشرة
    gloss: مبكرًا؛ في العاشرة — النهاية -ej نفسها في الساعات بعد 'o' كما في czwartej وsiódmej من الدرس السابق.
    note: تعيد عبارة *O dziesiątej* («في العاشرة») نمط الساعات نفسه الذي تعلمته — تصبح *dziesiąta* بعد *o* هي *dziesiątej*، تمامًا مثل *czwarta* ← *czwartej* و*siódma* ← *siódmej*.
  pl.a1.unit10.lesson03.teach.dialogue.line01:
    title: إيفا تصف صباحها
    gloss: تقول إيفا إنها تستيقظ في السابعة صباحًا وتشرب القهوة.
    note: يعيد استعمال أول نمط جملة في هذه الوحدة، لكن هذه المرة داخل محادثة حقيقية.
  pl.a1.unit10.lesson03.teach.dialogue.line02:
    title: إيفا تتابع يومها
    gloss: تقول إيفا إنها تتناول الفطور ثم تعمل بعد الظهر.
    note: تربط بين نشاطين بصيغة المتكلم بواسطة potem، وهو النمط نفسه من الدرس 2.
  pl.a1.unit10.lesson03.teach.dialogue.line03:
    title: إيفا تنهي كلامها وتسأل ماريك
    gloss: تقول إيفا إنها تعود إلى البيت مساءً. وأنت؟
    note: A ty? تمرّر الحديث إلى ماريك دون الحاجة إلى قواعد سؤال جديدة.
  pl.a1.unit10.lesson03.teach.dialogue.line04:
    title: ماريك يحكي عن صباحه
    gloss: يقول ماريك إنه هو أيضًا يستيقظ في السابعة! لكنه يشرب الشاي لا القهوة.
    note: تؤكد ja też تفصيلًا مشتركًا (وقت الاستيقاظ) قبل أن يأتي التقابل بـ ale...nie في المشروب.
  pl.a1.unit10.lesson03.teach.dialogue.line05:
    title: ماريك يصف يومه
    gloss: يقول ماريك إنه يعمل في الصباح ثم يتناول الغداء عند الظهر.
    note: ترتيب يومي مختلف عن ترتيب إيفا — العمل أولًا ثم وجبة منتصف النهار.
  pl.a1.unit10.lesson03.teach.dialogue.line06:
    title: ماريك يتحدث عن النوم
    gloss: يقول ماريك إنه ينام مبكرًا، في العاشرة مساءً.
    note: تختتم المحادثة بالفعل الجديد spać/śpię وبنمط الساعات الذي أُعيد استعماله في هذا الدرس.
