    title: من يستخدم ماذا؟
    gloss: تتصل إيفا بماريك كل يوم. تستخدم هاتفها لا تطبيقًا. ليس لدى ماريك حاسوب في المنزل، لكنه يستخدم الإنترنت على هاتفه. يطّلع تومك على توقعات الطقس كل صباح. ثم يذهب للجري. كثيرًا ما ترسل كاسيا رسالة إلى إيفا. وأنت، هل تستخدم هاتفك كل يوم أيضًا؟
