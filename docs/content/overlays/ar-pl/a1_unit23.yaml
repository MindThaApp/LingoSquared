teaching:
  pl.a1.unit23.lesson01.teach.ile_to_kosztuje:
    title: السؤال عن السعر الإجمالي
    gloss: كم التكلفة الإجمالية؟
    note: تبيّن *W sumie* (في المجموع) أنك تريد السعر الإجمالي الكامل، لا سعر قطعة واحدة.
  pl.a1.unit23.lesson01.teach.w_sumie_to:
    title: ذكر السعر الإجمالي
    gloss: تكلّف مئة زلوتي في المجموع.
    note: '*Kosztuje* هي صيغة الغائب (*on/ona/ono*) من *kosztować* (يكلّف). الأعداد من 5 فصاعدًا يأتي بعدها الجمع في حالة الإضافة (المضاف إليه): *sto złotych*.'
  pl.a1.unit23.lesson02.teach.placic_karta_placic:
    title: الدفع بالبطاقة أو نقدًا
    gloss: يدفع بالبطاقة، يدفع نقدًا
    note: 'تستخدم *Płacić kartą* (الدفع بالبطاقة) و*płacić gotówką* (الدفع نقدًا) حالة الأداة بعد *płacić*: *kartą*، *gotówką*.'
    example_gloss:
    - هل يمكنني الدفع بالبطاقة هنا؟
    - أنا أدفع نقدًا.
  pl.a1.unit23.lesson02.teach.czy_moge_tu:
    title: السؤال عن إمكانية الدفع بالبطاقة
    gloss: هل يمكنني الدفع بالبطاقة هنا؟
    note: تحدد *Tu* (هنا) أن السؤال عن المكان الحالي؛ وتفتتح *czy* سؤالًا جوابه نعم أو لا، و*mogę* تعني «أستطيع».
  pl.a1.unit23.lesson02.teach.czy_chce_pan:
    title: السؤال عن طريقة الدفع المفضّلة
    gloss: هل تريد الدفع نقدًا أم بالبطاقة؟
    note: '*Czy chce pan ...?* هي الصيغة الرسمية من *Czy chcesz ...?*، يستخدمها هنا أمين صندوق لا يعرفك (*pan* للرجل، و*pani* للمرأة).'
  pl.a1.unit23.lesson03.teach.rachunek:
    title: الفاتورة
    gloss: الفاتورة
    note: 'اسم مذكر: *rachunek* (حالة الإضافة *rachunku*).'
    example_gloss: هل نقسّم الفاتورة؟
  pl.a1.unit23.lesson03.teach.moze_podzielimy_rachunek:
    title: اقتراح تقسيم الفاتورة
    gloss: هل نقسّم الفاتورة؟
    note: '*Może podzielimy ...?* طريقة مهذبة لاقتراح أمر نفعله معًا؛ و*podzielimy* هي صيغة المتكلمين (*my*) من *podzielić*.'
  pl.a1.unit23.lesson03.teach.czy_moge_zaplacic:
    title: طلب الدفع على حدة
    gloss: هل يمكنني الدفع على حدة؟
    note: 'تأتي *Osobno* (بشكل منفصل) مع *zapłacić* (يدفع، بصيغة تامة: دفعة واحدة منتهية).'
  pl.a1.unit23.lesson04.teach.reszta:
    title: الباقي
    gloss: الباقي
    note: 'اسم مؤنث: *reszta* (حالة الإضافة *reszty*، كما في *nie potrzebuję reszty*).'
    example_gloss: تفضّل الباقي.
  pl.a1.unit23.lesson04.teach.oto_pana_reszta:
    title: تسليم الباقي
    gloss: تفضّل الباقي.
    note: '*Pana* هي «الخاص بك» الرسمية (للرجل؛ و*pani* للمرأة)، وتناسب الأسلوب الرسمي عند الصندوق.'
  pl.a1.unit23.lesson04.teach.nie_potrzebuje_reszty:
    title: رفض أخذ الباقي
    gloss: لا أحتاج إلى الباقي.
    note: '*Nie potrzebuję* + حالة الإضافة: النفي يجعل المفعول به في حالة الإضافة، ولذلك *reszty*.'
  pl.a1.unit23.lesson05.teach.trzydziesci_piec:
    title: خمسة وثلاثون
    gloss: خمسة وثلاثون
    note: 'تُكتب *Trzydzieści pięć* في كلمتين: العشرات أولًا ثم الآحاد (30 + 5).'
    example_gloss: يكلّف مئة وأربعين زلوتي.
  pl.a1.unit23.lesson05.teach.rachunek_dwa_dania:
    title: اقرأ فاتورة مطعم
    gloss: 'الفاتورة: طبقان رئيسيان وقهوتان. المجموع: مئة وأربعون زلوتي. الدفع بالبطاقة.'
    note: تتبّع ما طُلب، والمجموع، وطريقة الدفع.
    glosses:
      Rachunek: فاتورة
      dwa: اثنان
      dania: أطباق رئيسية (dania główne)
      kawy: قهوتان
      Razem: المجموع
      złotych: زلوتي
      Zapłacono: مدفوعة
      kartą: بطاقة
      sto: مئة
      czterdzieści: أربعون
  pl.a1.unit23.lesson06.teach.ewa_moze_poprosimy:
    title: إيفا تطلب الفاتورة
    gloss: 'إيفا: هل نطلب الفاتورة؟'
    note: 'بعد *Poprosić o* (يطلب) تأتي حالة النصب: *o rachunek*. و*Poprosimy* مستقبل بصيغة تامة.'
  pl.a1.unit23.lesson06.teach.marek_tak_dobry:
    title: ماريك يسأل عن المجموع
    gloss: 'ماريك: نعم، فكرة جيدة. كم يكلّف في المجموع؟'
    note: يعيد استخدام سؤال *Ile to kosztuje w sumie?* من الدرس الأول.
  pl.a1.unit23.lesson06.teach.ewa_to_trzydziesci:
    title: إيفا تذكر المجموع
    gloss: 'إيفا: إنها مئة وأربعون زلوتي. هل نتقاسمها؟'
    note: 'تستخدم *Podzielimy się?* (حرفيًا: «هل نقسّم أنفسنا؟») الضمير الانعكاسي *się* بمعنى تقاسم الفاتورة.'
  pl.a1.unit23.lesson06.teach.marek_nie_dzisiaj:
    title: ماريك يصرّ على الدفع
    gloss: 'ماريك: لا، دعيني أدفع اليوم. لقد ساعدتِني كثيرًا.'
    note: '*Dzisiaj ja płacę* (حرفيًا: «اليوم أنا أدفع») طريقة معتادة لعرض الدفع؛ و*pomogłaś* ماضي المؤنث من *pomóc* (يساعد)، لأن ماريك يخاطب إيفا.'
  pl.a1.unit23.lesson06.teach.ewa_jak_milo:
    title: إيفا متأثرة
    gloss: 'إيفا: ما ألطفك! شكرًا.'
    note: '*Miło z twojej strony* (من لطفك) مجاملة دافئة شائعة لموقف كريم؛ و*z* + حالة الإضافة: *z twojej strony*.'
  pl.a1.unit23.lesson06.teach.marek_czy_moge:
    title: ماريك يسأل عن الدفع بالبطاقة
    gloss: 'ماريك: هل يمكنني الدفع بالبطاقة هنا؟'
    note: يعيد استخدام سؤال *Czy mogę tu zapłacić kartą?* من الدرس الثاني، وهنا في المطعم نفسه.
  pl.a1.unit23.lesson06.teach.marek_placi_rachunek:
    title: 'Płaci: صيغة الغائب'
    gloss: ماريك يدفع الفاتورة.
    note: '*Płaci* هي صيغة الغائب (*on/ona/ono*) من *płacić* (يدفع).'
