  title: Rosyjski A1
  description: 'Rosyjski dla początkujących o zwierzętach domowych i popularnych zwierzętach: jak je nazywać, podstawowa opieka (spacery, karmienie, zabawa), jak powiedzieć, jakie zwierzęta kochasz, nawet jeśli żadnego nie masz, oraz regularna liczba mnoga w rosyjskim.'
