teaching:
  ru.a1.unit27.lesson01.teach.zhivotnoe_domashnee_zhivotnoe:
    title: Zwierzę, zwierzę domowe
    gloss: zwierzę / zwierzę domowe
    note: '*Животное* to ogólne słowo oznaczające zwierzę. *Домашнее животное* (dosłownie „zwierzę domowe”) oznacza konkretnie zwierzę domowe, czyli pupila.'
    example_gloss:
    - Pies to zwierzę.
    - Pies to też zwierzę domowe.
  ru.a1.unit27.lesson01.teach.sobaka_koshka:
    title: Pies i kot
    gloss: pies / kot
    example_gloss:
    - Nastia ma psa.
    - Igor ma kota.
  ru.a1.unit27.lesson01.teach.ryba_ptitsa:
    title: Ryba i ptak
    gloss: ryba / ptak
    example_gloss:
    - Dziadek ma rybę.
    - Nina ma ptaka.
  ru.a1.unit27.lesson01.teach.u_tebya_est:
    title: Masz zwierzę domowe?
    gloss: Masz zwierzę domowe?
    note: '*У тебя есть ...?* to pytanie „czy masz”: *у тебя* (dosłownie „u ciebie”) + *есть* + rzecz, o którą pytasz.'
  ru.a1.unit27.lesson01.teach.da_u_menya:
    title: Tak, mam psa
    gloss: Tak, mam psa.
    note: Prosta odpowiedź twierdząca z nowym słownictwem z tej lekcji.
  ru.a1.unit27.lesson01.teach.net_u_menya:
    title: Nie, nie mam zwierzęcia domowego
    gloss: Nie, nie mam zwierzęcia domowego.
    note: '*Нет* + dopełniacz oznacza, że czegoś nie masz: *у меня нет домашнего животного*. Zobacz notatkę gramatyczną.'
  ru.a1.unit27.lesson01.teach.posle_net_slovo:
    title: Нет plus dopełniacz
    gloss: 'Po *нет* to, czego brakuje, stoi w dopełniaczu: *у меня нет времени*, *у меня нет домашнего животного*.'
    note: 'Porównaj zdanie twierdzące: *у меня есть собака* (mianownik), ale *у меня нет собаки* (dopełniacz).'
  ru.a1.unit27.lesson02.teach.gulyat_s_sobakoy:
    title: Wyprowadzać na spacer (zwierzę)
    gloss: wyprowadzać na spacer (zwierzę)
    note: '*Гулять с собакой* łączy *с* z narzędnikiem, *собакой*. Zobacz notatkę gramatyczną.'
    example_gloss: Codziennie wyprowadzam psa na spacer.
  ru.a1.unit27.lesson02.teach.posle_s_slovo:
    title: С plus narzędnik
    gloss: 'Po *с* (z) rzeczownik stoi w narzędniku: *гулять с собакой*, *играть с кошкой*.'
    note: 'Narzędnik rzeczowników rodzaju żeńskiego kończy się na *-ой* lub *-ей*: *собакой*, *кошкой*.'
  ru.a1.unit27.lesson02.teach.kormit:
    title: Karmić
    gloss: karmić
    example_gloss: Codziennie karmię kota.
  ru.a1.unit27.lesson02.teach.igrat_s:
    title: Bawić się z
    gloss: bawić się z
    example_gloss: Igor bawi się ze swoim kotem.
  ru.a1.unit27.lesson02.teach.ya_kazhdyy_den:
    title: Codziennie wyprowadzam psa
    gloss: Codziennie wyprowadzam psa na spacer.
    note: '*Каждый день* (codziennie) to określenie czasu bez przyimka: *Я каждый день гуляю с собакой*.'
  ru.a1.unit27.lesson02.teach.ya_kazhdyy_den_2:
    title: Codziennie karmię kota
    gloss: Codziennie karmię kota.
    note: '*Кормить* łączy się ze zwierzęciem jako dopełnieniem w bierniku: *кошка* zmienia się w *кошку*.'
  ru.a1.unit27.lesson03.teach.posle_lyubit_zhivotnoe:
    title: Zwierzęta po любить
    gloss: 'Po *любить* nazwa zwierzęcia stoi w bierniku, który przy rzeczownikach ożywionych w liczbie mnogiej jest taki sam jak dopełniacz: *собак*, *кошек*, *птиц*, *рыб*.'
    note: Regularny wzorzec formy liczby mnogiej w rosyjskim, wprowadzony tu po raz pierwszy na przykładzie nazw zwierząt.
  ru.a1.unit27.lesson03.teach.sobak_koshek:
    title: Psy i koty
    gloss: psy / koty
    example_gloss:
    - Dima kocha psy.
    - Lena uwielbia koty.
  ru.a1.unit27.lesson03.teach.ryb_ptits:
    title: Ryby i ptaki (liczba mnoga)
    gloss: ryby / ptaki
    example_gloss:
    - Uwielbiam ryby.
    - Dziadek uwielbia ptaki.
  ru.a1.unit27.lesson03.teach.ya_lyublyu_zhivotnykh:
    title: Kocham zwierzęta
    gloss: Kocham zwierzęta.
    note: '*Люблю* + biernik: *Я люблю животных*. Przy rzeczownikach ożywionych w liczbie mnogiej biernik wygląda jak dopełniacz.'
  ru.a1.unit27.lesson03.teach.lena_lyubit_koshek:
    title: Lena kocha koty, ale nie ma zwierzęcia
    gloss: Lena kocha koty, ale nie ma zwierzęcia domowego.
    note: 'Przeciwstawienie: kochać zwierzęta, a mimo to żadnego nie mieć.'
  ru.a1.unit27.lesson04.teach.dima_u_tebya:
    title: Dima pyta o zwierzę domowe
    gloss: 'Dima: Masz zwierzę domowe, Nastya?'
  ru.a1.unit27.lesson04.teach.nastya_da_u:
    title: Nastya ma psa
    gloss: 'Nastya: Tak, mam psa.'
  ru.a1.unit27.lesson04.teach.dima_kak_on:
    title: Dima pyta, jak wygląda zwierzę
    gloss: 'Dima: Jak on wygląda?'
    note: Pytanie *Как он выглядит?* pasuje też do zwierząt. *Он* (on) mówimy o samcu.
  ru.a1.unit27.lesson04.teach.nastya_u_nego:
    title: Nastya opisuje swojego psa
    gloss: 'Nastya: Ma brązową sierść i jest mały.'
    note: Słownictwo o kolorze włosów i wielkości z lekcji o wyglądzie, tym razem do opisu sierści zwierzęcia, a nie włosów człowieka.
  ru.a1.unit27.lesson04.teach.o_zhivotnom_mozhno:
    title: Он i она o zwierzętach
    gloss: 'O zwierzęciu domowym można powiedzieć *он* lub *она*, tak jak o człowieku: *У меня собака, он маленький*.'
    note: Gramatycznie *собака* jest rodzaju żeńskiego, ale Rosjanie często mówią *он*, gdy wiedzą, że zwierzę jest samcem.
  ru.a1.unit27.lesson04.teach.dima_ty_gulyaesh:
    title: Dima pyta o spacery
    gloss: 'Dima: Wychodzisz z nim codziennie na spacer?'
  ru.a1.unit27.lesson04.teach.nastya_da_ya:
    title: Nastya opowiada o swojej rutynie
    gloss: 'Nastya: Tak, codziennie wychodzę z nim na spacer i karmię go.'
  ru.a1.unit27.lesson05.teach.dima_i_lena:
    title: Dima, Lena i Igor o zwierzętach
    gloss: 'Dima i Lena oboje kochają zwierzęta, ale żadne z nich nie ma zwierzęcia domowego. Dima kocha psy, a Lena kocha koty. Za to Igor ma zwierzę domowe: kota. Często bawi się ze swoim kotem i codziennie daje mu jedzenie. A ty masz zwierzę domowe?'
    note: 'Przeciwstawienie: kochać zwierzę a rzeczywiście je mieć.'
    glosses:
      любят: kochać
      оба: oboje
      животных: zwierzęta
      обоих: oboje
      домашнего: zwierzę domowe
      собак: psy
      кошек: koty
      кошка: kot
      играет: bawi się
      даёт: daje
      каждый: każdy
      корм: karma
  ru.a1.unit27.lesson05.teach.igor_chasto_igraet:
    title: Igor często bawi się ze swoim kotem
    gloss: Igor często bawi się ze swoim kotem.
    note: '*Со своей кошкой*: *со* to *с* przed grupą spółgłosek, a *своей* znaczy „własnej” i odnosi się do podmiotu.'
  ru.a1.unit27.lesson05.teach.ya_lyublyu_sobak:
    title: Kocham psy. Nie mam zwierzęcia domowego.
    gloss: Kocham psy. Nie mam zwierzęcia domowego.
    note: Wzorcowa odpowiedź z dwóch zdań, którą możesz wykorzystać w zadaniu pisemnym z tej lekcji.
  ru.a1.unit27.lesson06.teach.nastya_nina_u:
    title: Nastya pyta Ninę
    gloss: 'Nastya: Nina, ty też masz zwierzę domowe?'
  ru.a1.unit27.lesson06.teach.nina_da_u:
    title: Nina ma ptaka o imieniu Pico
    gloss: 'Nina: Tak, mam ptaka. Nazywa się Pico.'
    note: '*Его зовут Пико* dosłownie znaczy „nazywają go Pico”. Tak po rosyjsku podaje się imię.'
  ru.a1.unit27.lesson06.teach.dima_kak_zdorovo:
    title: Reakcja Dimy
    gloss: 'Dima: Super! Co z nim robisz codziennie?'
  ru.a1.unit27.lesson06.teach.nina_ya_kazhdyy:
    title: Nina codziennie karmi ptaka
    gloss: 'Nina: Codziennie daję mu jeść.'
  ru.a1.unit27.lesson06.teach.dima_ya_tozhe:
    title: Dima też kocha ptaki
    gloss: 'Dima: Ja też kocham ptaki.'
  ru.a1.unit27.lesson06.teach.nastya_kak_khorosho:
    title: Nastya kończy rozmowę
    gloss: 'Nastya: Jak dobrze, że wszyscy troje kochamy zwierzęta!'
    note: Zakończenie rozmowy, które łączy to, co w tej lekcji wiemy o zwierzętach wszystkich trojga bohaterów.
