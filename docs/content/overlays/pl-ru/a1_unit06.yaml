teaching:
  ru.a1.unit06.lesson01.teach.u_menya_est:
    title: У меня есть ...
    gloss: Mam ...
    note: Dosłownie „u mnie (jest) ...” – standardowy rosyjski sposób na powiedzenie „mam”. W lekcji 3 zdanie У меня два брата miało ten sam schemat У меня; есть zwykle się pomija, gdy mowa o liczbie.
  ru.a1.unit06.lesson01.teach.eto:
    title: Это ...
    gloss: To jest ...
    note: Это służy do przedstawiania lub wskazywania osoby albo rzeczy, niezależnie od jej rodzaju gramatycznego.
  ru.a1.unit06.lesson01.teach.mat_otets:
    title: мать, отец
    gloss: matka, ojciec
    note: мать należy do niewielkiej grupy rosyjskich rzeczowników rodzaju żeńskiego zakończonych na miękki znak (-ь).
    example_gloss:
    - To jest moja matka.
    - To jest mój ojciec.
  ru.a1.unit06.lesson01.teach.brat_sestra:
    title: брат, сестра
    gloss: brat, siostra
    note: брат to słowo, którego użyłeś(-aś) przy liczeniu w lekcji 3 („У меня два брата”); сестра to jego odpowiednik rodzaju żeńskiego.
    example_gloss:
    - To jest mój brat.
    - Mam siostrę.
  ru.a1.unit06.lesson01.teach.moy_moya:
    title: мой, моя
    gloss: mój (rodzaj męski), moja (rodzaj żeński)
    note: мой używa się z rzeczownikami rodzaju męskiego, takimi jak отец i брат; моя z rzeczownikami rodzaju żeńskiego, takimi jak мать i сестра.
  ru.a1.unit06.lesson02.teach.babushka_dedushka:
    title: бабушка, дедушка
    gloss: babcia, dziadek
    note: 'Oba słowa kończą się na -а, ale дедушка oznacza mężczyznę i w związku z tym jest rodzaju męskiego: мой дедушка, ale моя бабушка.'
    example_gloss:
    - To jest moja babcia.
    - To jest mój dziadek.
  ru.a1.unit06.lesson02.teach.muzh_zhena:
    title: муж, жена
    gloss: mąż, żona
    note: муж jest rodzaju męskiego, а жена żeńskiego, zgodnie z regularnym wzorcem końcówek.
    example_gloss:
    - To jest mój mąż.
    - To jest moja żona.
  ru.a1.unit06.lesson02.teach.syn_doch:
    title: сын, дочь
    gloss: syn, córka
    note: дочь, podobnie jak мать, jest rzeczownikiem rodzaju żeńskiego zakończonym na miękki znak (-ь).
    example_gloss: Mam syna i córkę.
  ru.a1.unit06.lesson02.teach.deti:
    title: дети
    gloss: dzieci
    note: дети to nieregularna liczba mnoga od ребёнок („dziecko”) – liczba pojedyncza i mnoga to zupełnie różne słowa.
    example_gloss: Czy ma Pan/Pani dzieci?
  ru.a1.unit06.lesson02.teach.u_vas_est:
    title: У вас есть ...?
    gloss: Czy ma Pan/Pani ...? (formalnie)
    note: Używa formy grzecznościowej вас, zgodnie z rejestrem вы z lekcji 2.
  ru.a1.unit06.lesson03.teach.kto_eto:
    title: Кто это?
    gloss: Kto to jest?
    note: Standardowy sposób zapytania, kim ktoś jest, na przykład gdy patrzysz na zdjęcie.
  ru.a1.unit06.lesson03.teach.eyo_zovut:
    title: Её зовут Анна.
    gloss: Ma na imię Anna.
    note: Dosłownie „nazywają ją Anna” – Её („ją”) jest dopełnieniem czasownika зовут, a nie podmiotem.
  ru.a1.unit06.lesson03.teach.maksim_kto_eto:
    title: Maksim pyta o zdjęcie
    gloss: 'Maksim: Kto to jest na zdjęciu?'
    note: Maksim zaczyna od wskazania zdjęcia i pytania Кто это на фото?
  ru.a1.unit06.lesson03.teach.olga_moya_semya:
    title: Olga przedstawia swoją rodzinę
    gloss: 'Olga: To jest moja rodzina.'
    note: W zdaniu Это моя семья występuje семья („rodzina”), rzeczownik rodzaju żeńskiego, więc моя się z nim zgadza.
  ru.a1.unit06.lesson03.teach.olga_vot_otets:
    title: Olga wymienia trzy osoby z rodziny
    gloss: 'Olga: Oto mój ojciec, moja matka i mój brat.'
    note: Вот („oto”) wprowadza wyliczenie; każdy zaimek dzierżawczy (мой/моя) zgadza się z rzeczownikiem, który po nim następuje.
  ru.a1.unit06.lesson03.teach.maksim_a_kto_devochka:
    title: Maksim pyta o dziewczynkę
    gloss: 'Maksim: A kim jest ta dziewczynka?'
    note: А płynnie wprowadza kolejne pytanie Maksima o czwartą osobę na zdjęciu.
  ru.a1.unit06.lesson03.teach.olga_eto_moya_doch:
    title: Olga mówi, jak ma na imię jej córka
    gloss: 'Olga: To jest moja córka. Ma na imię Anna.'
    note: Olga odpowiada моя дочь, а potem podaje imię w zdaniu Её зовут Анна.
