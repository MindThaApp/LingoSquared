  ru.a1.unit10.lesson01.teach.kak_doyti:
    title: Как дойти до...?
    gloss: Jak dojść do...?
    note: Как дойти до...? to standardowy, grzeczny sposób pytania nieznajomego o drogę do jakiegoś miejsca; cel podróży stoi po tym w dopełniaczu.
  ru.a1.unit10.lesson01.teach.muzeya:
    title: музей
    gloss: muzeum
    note: музей jest rodzaju męskiego; музея to jego dopełniacz, używany po до („do”).
    example_gloss: Jak dojść do muzeum?
  ru.a1.unit10.lesson01.teach.pryamo:
    title: прямо
    gloss: prosto
    note: прямо oznacza „prosto”; Идите to grzecznościowa forma rozkazująca czasownika „iść”.
    example_gloss: Proszę iść prosto.
  ru.a1.unit10.lesson01.teach.napravo:
    title: направо
    gloss: w prawo
    note: направо wskazuje kierunek ruchu (skręt w prawo); потом znaczy „potem”.
    example_gloss: Proszę iść prosto, a potem w prawo.
  ru.a1.unit10.lesson02.teach.nalevo:
    title: налево
    gloss: w lewo
    note: налево wskazuje kierunek ruchu i jest odpowiednikiem przeciwnym do направо.
    example_gloss: Proszę skręcić w lewo.
  ru.a1.unit10.lesson02.teach.povernite:
    title: поверните
    gloss: skręćcie / proszę skręcić (forma grzecznościowa)
    note: поверните to grzecznościowy tryb rozkazujący czasownika повернуть („skręcić”); за углом znaczy „za rogiem”.
    example_gloss: Za rogiem proszę skręcić w lewo.
  ru.a1.unit10.lesson02.teach.kvartal_daleko:
    title: квартал, далеко
    gloss: przecznica, daleko
    note: квартал to kwartał miejski, czyli odcinek między ulicami (квартала po два); далеко znaczy „daleko”, a отсюда „stąd”.
    example_gloss:
    - Proszę iść dwie przecznice.
    - Czy to daleko stąd?
  ru.a1.unit10.lesson03.teach.tourist_prostite:
    title: Turysta pyta o drogę
    gloss: 'Turysta: Przepraszam, jak dojść do muzeum?'
    note: Турист zaczyna od Простите („przepraszam”), a potem pyta Как дойти до музея?
  ru.a1.unit10.lesson03.teach.prokhozhiy_eto_prosto:
    title: Przechodzień wskazuje drogę
    gloss: 'Przechodzień: To bardzo proste. Proszę iść prosto dwie przecznice, a potem skręcić w prawo.'
    note: Прохожий odpowiada Это очень просто, a potem podaje dwa kroki z użyciem Идите i поверните.
  ru.a1.unit10.lesson03.teach.tourist_daleko:
    title: Turysta pyta, czy to daleko
    gloss: 'Turysta: Czy to daleko stąd?'
    note: Это далеко отсюда? to dopytanie o odległość do przejścia.
  ru.a1.unit10.lesson03.teach.prokhozhiy_pyat_minut:
    title: Przechodzień podaje czas
    gloss: 'Przechodzień: Nie, pięć minut pieszo.'
    note: Прохожий odpowiada Нет, пять минут пешком („pieszo”).
  ru.a1.unit10.lesson03.teach.tourist_spasibo:
    title: Turysta dziękuje przechodniowi
    gloss: 'Turysta: Bardzo dziękuję.'
    note: Спасибо большое grzecznie kończy rozmowę.
  ru.a1.unit10.lesson03.teach.prokhozhiy_pozhaluysta:
    title: Przechodzień odpowiada
    gloss: 'Przechodzień: Proszę bardzo.'
    note: Пожалуйста jest odpowiedzią na спасибо i znaczy „proszę bardzo”.
