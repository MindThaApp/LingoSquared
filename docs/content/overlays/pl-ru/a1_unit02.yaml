teaching:
  ru.a1.unit02.lesson01.teach.kak_vas_zovut:
    title: Как вас зовут?, Как тебя зовут?
    gloss: Jak Pan/Pani ma na imię? (oficjalnie); Jak masz na imię? (nieformalnie)
    note: Как вас зовут? zawiera oficjalne вас i używa się go wobec nieznajomych lub w uprzejmych sytuacjach. Как тебя зовут? zawiera nieformalne тебя, używane wobec przyjaciół, dzieci i rówieśników.
    example_gloss:
    - Dzień dobry! Jak Pan/Pani ma na imię?
    - Cześć! Jak masz na imię?
  ru.a1.unit02.lesson01.teach.menya_zovut:
    title: Меня зовут Виктор.
    gloss: Mam na imię Viktor.
    note: Меня зовут (dosłownie „nazywają mnie”) to standardowy sposób podania imienia po rosyjsku, w każdym stylu.
  ru.a1.unit02.lesson01.teach.menya_zovut_anna:
    title: Меня зовут Анна.
    gloss: Mam na imię Anna.
    note: Ten sam wzór, Меня зовут ..., z innym imieniem; zwrot nie zmienia się w zależności od płci mówiącego.
  ru.a1.unit02.lesson01.teach.register_note:
    title: Wybór właściwego pytania
    gloss: Как вас зовут? jest grzeczne lub do nieznajomych. Как тебя зовут? jest do przyjaciół, dzieci i rówieśników.
    note: Podział na formalne i nieformalne odpowiada różnicy вы/ты, omówionej dokładnie w lekcji 2 — вас i тебя to formy biernika (i dopełniacza) zaimków вы i ты.
  ru.a1.unit02.lesson02.teach.vy_ty:
    title: вы, ты
    gloss: Pan/Pani/wy (oficjalnie); ty (nieformalnie)
    note: 'Podobnie jak w polszczyźnie (ty — Pan/Pani), rosyjski rozróżnia dwie formy: вы używa się wobec nieznajomych, osób starszych i w sytuacjach zawodowych, a ты wobec przyjaciół, rodziny i dzieci.'
    example_gloss:
    - Skąd Pan/Pani jest? (oficjalnie)
    - Skąd jesteś? (nieformalnie)
  ru.a1.unit02.lesson02.teach.vy_ty_rule:
    title: Kiedy której formy używać
    gloss: 'Вы jest oficjalne: wobec nieznajomych, w pracy, wobec osób starszych. Ты jest nieformalne: wobec przyjaciół, rodziny, dzieci.'
    note: Zwrócenie się per ты do kogoś, kto oczekuje вы, może zabrzmieć zbyt poufale, a nawet niegrzecznie — w razie wątpliwości zacznij od вы.
  ru.a1.unit02.lesson02.teach.mozhno_na_ty:
    title: Можно на ты?
    gloss: Możemy przejść na ты?
    note: Grzeczny sposób zaproponowania przejścia z oficjalnego вы na nieformalne ты, gdy relacja jest już dość przyjazna.
  ru.a1.unit02.lesson02.teach.davayte_pereydyom:
    title: Давайте перейдём на ты.
    gloss: Przejdźmy na ты.
    note: Nieco bardziej bezpośredni, zapraszający sposób zaproponowania tej samej zmiany formy co w Можно на ты?
  ru.a1.unit02.lesson02.teach.otkuda_vy:
    title: Откуда вы?
    gloss: Skąd Pan/Pani pochodzi? (oficjalnie)
    note: Używa oficjalnego вы, co pasuje do pierwszego spotkania lub sytuacji zawodowej.
  ru.a1.unit02.lesson02.teach.otkuda_ty:
    title: Откуда ты?
    gloss: Skąd jesteś? (nieformalnie)
    note: Nieformalny odpowiednik, używany wobec kogoś, kogo już dobrze znasz.
  ru.a1.unit02.lesson02.teach.ya_iz_kanady:
    title: Я из Канады.
    gloss: Jestem z Kanady.
    note: Из („z”) łączy się z dopełniaczem, więc Канада zmienia się tu w Канады — warto zauważyć ten wzór dopełniacza przy podawaniu pochodzenia, choć pełna gramatyka przypadków pojawi się później.
  ru.a1.unit02.lesson02.teach.ya_iz_moskvy:
    title: Я из Москвы.
    gloss: Jestem z Moskwy.
    note: 'Ten sam wzór dopełniacza co w Я из Канады: Москва zmienia się w Москвы po из.'
  ru.a1.unit02.lesson03.teach.davayte_poznakomimsya:
    title: Давайте познакомимся.
    gloss: Poznajmy się.
    note: Grzeczny, powszechny sposób rozpoczęcia przedstawiania się osób, które spotykają się po raz pierwszy.
  ru.a1.unit02.lesson03.teach.ochen_priyatno:
    title: Очень приятно
    gloss: miło mi
    note: Standardowa, grzeczna odpowiedź, gdy ktoś właśnie podał swoje imię.
    example_gloss: Mam na imię John. -- Miło mi.
  ru.a1.unit02.lesson03.teach.irina_greeting:
    title: Irina Pietrowna zaczyna przedstawianie się
    gloss: 'Irina Pietrowna mówi: Dzień dobry! Poznajmy się. Mam na imię Irina Pietrowna.'
    note: Irina Pietrowna spotyka Johna po raz pierwszy w oficjalnym biurze, więc używa grzecznego Здравствуйте i przez cały czas formy вы.
  ru.a1.unit02.lesson03.teach.john_reply:
    title: John odpowiada, podając swoje imię
    gloss: 'John mówi: Miło mi. Mam na imię John.'
    note: John dopasowuje się do oficjalnego, grzecznego stylu Iriny Pietrowny, mówiąc Очень приятно.
  ru.a1.unit02.lesson03.teach.irina_question:
    title: Irina Pietrowna pyta, skąd jest John
    gloss: 'Irina Pietrowna pyta: Skąd Pan jest, John?'
    note: Używa oficjalnego Откуда вы, co pasuje do biurowej sytuacji.
  ru.a1.unit02.lesson03.teach.john_answer:
    title: John odpowiada i zadaje pytanie zwrotne
    gloss: 'John mówi: Jestem z Kanady. A Pani skąd jest?'
    note: John podaje swoje pochodzenie i grzecznie zwraca pytanie, mówiąc А вы откуда?
  ru.a1.unit02.lesson03.teach.irina_answer:
    title: Irina Pietrowna odpowiada
    gloss: 'Irina Pietrowna mówi: Jestem z Moskwy.'
    note: Kończy wymianę zdań, używając wzoru dopełniacza pochodzenia z lekcji 2.
