  ru.a1.unit08.lesson01.teach.rubl:
    title: рубль
    gloss: rubel
    note: рубль to rosyjska waluta; сто („sto”) wymaga dopełniacza liczby mnogiej рублей.
    example_gloss: Chleb kosztuje sto rubli.
  ru.a1.unit08.lesson01.teach.khleb_moloko:
    title: хлеб, молоко
    gloss: chleb, mleko
    note: хлеб jest rodzaju męskiego, a молоко nijakiego – oba to popularne produkty codziennego użytku.
    example_gloss:
    - Ile kosztuje chleb?
    - Ile kosztuje mleko?
  ru.a1.unit08.lesson02.teach.dayte_pozhaluysta:
    title: Дайте, пожалуйста, ...
    gloss: Proszę dać ...
    note: Дайте to grzecznościowa forma rozkazująca (lub liczby mnogiej) czasownika дать („dać”), używana z вы.
  ru.a1.unit08.lesson02.teach.kilogramm:
    title: килограмм
    gloss: kilogram
    note: килограмм to standardowa jednostka przy kupowaniu warzyw, owoców lub chleba na wagę.
    example_gloss: Proszę dać kilogram.
  ru.a1.unit08.lesson02.teach.polkilo:
    title: полкило
    gloss: pół kilo
    note: полкило składa się z пол- („pół”) i кило (potoczny skrót od килограмм).
    example_gloss: Proszę dać pół kilo.
  ru.a1.unit08.lesson02.teach.shtuka:
    title: штука
    gloss: sztuka
    note: штука oznacza pojedyncze sztuki; пять штук to dopełniacz liczby mnogiej po liczebniku пять.
    example_gloss:
    - Poproszę jedną sztukę.
    - Poproszę pięć sztuk.
  ru.a1.unit08.lesson03.teach.pomidory_ogurtsy:
    title: помидоры, огурцы
    gloss: pomidory, ogórki
    note: Oba słowa to rzeczowniki w liczbie mnogiej oznaczające warzywa; помидоры i огурцы pochodzą od rzeczowników rodzaju męskiego.
    example_gloss:
    - Czy są pomidory?
    - Czy są ogórki?
  ru.a1.unit08.lesson03.teach.kartofel_kapusta:
    title: картофель, капуста
    gloss: ziemniaki, kapusta
    note: картофель to rzeczownik zbiorowy rodzaju męskiego (używany jak rzeczownik niepoliczalny), a капуста jest rodzaju żeńskiego.
    example_gloss:
    - Czy są ziemniaki?
    - Czy jest kapusta?
  ru.a1.unit08.lesson03.teach.yabloki_apelsiny:
    title: яблоки, апельсины
    gloss: jabłka, pomarańcze
    note: W кило яблок po słowie кило stoi dopełniacz liczby mnogiej яблок („kilo jabłek”), tak samo jak w кило апельсинов.
    example_gloss:
    - Ile kosztuje kilo jabłek?
    - Ile kosztuje kilo pomarańczy?
  ru.a1.unit08.lesson03.teach.u_vas_est:
    title: У вас есть ...?
    gloss: Czy ma Pan/Pani ...? (formalnie)
    note: Forma вас jest grzecznościowa – to standardowy sposób, by zapytać sprzedawcę, czy ma dany towar.
  ru.a1.unit08.lesson03.teach.da_u_menya_est:
    title: Да, у меня есть ...
    gloss: Tak, mam ...
    note: У меня есть (dosłownie „u mnie jest”) to zwykły sposób powiedzenia „mam”; tak odpowiada sprzedawca.
  ru.a1.unit08.lesson03.teach.pokupatel_pomidory:
    title: Kupujący pyta o pomidory
    gloss: 'Kupujący: Czy są pomidory?'
    note: Kupujący zaczyna od grzecznego pytania У вас есть ...?
  ru.a1.unit08.lesson03.teach.prodavets_da_est:
    title: Sprzedawca odpowiada twierdząco
    gloss: 'Sprzedawca: Tak, są.'
    note: Да, есть to krótka, codzienna odpowiedź – dosłownie „tak, jest/są” – bez powtarzania nazwy towaru.
  ru.a1.unit08.lesson03.teach.pokupatel_kilo_yablok:
    title: Kupujący pyta o cenę
    gloss: 'Kupujący: Ile kosztuje kilo jabłek?'
    note: W кило яблок po słowie кило stoi dopełniacz liczby mnogiej яблок.
  ru.a1.unit08.lesson03.teach.prodavets_dvesti:
    title: Sprzedawca podaje cenę
    gloss: 'Sprzedawca: Dwieście rubli.'
    note: Двести znaczy „dwieście”; tak jak po сто, po nim stoi dopełniacz liczby mnogiej рублей.
  ru.a1.unit08.lesson03.teach.pokupatel_dayte_kilogramm:
    title: Kupujący kupuje kilogram
    gloss: 'Kupujący: Poproszę kilogram jabłek.'
    note: Дайте ..., пожалуйста z lekcji 2, tym razem z килограмм яблок („kilogram jabłek”).
  ru.a1.unit08.lesson03.teach.prodavets_khorosho:
    title: Sprzedawca podaje zakupy
    gloss: 'Sprzedawca: Dobrze, proszę bardzo.'
    note: Пожалуйста oznacza tu „proszę bardzo”, gdy sprzedawca podaje towar, a nie „proszę” w znaczeniu prośby.
