    note: магазин to rzeczownik rodzaju męskiego oznaczający sklep.
    example_gloss: Idziemy do sklepu.
  ru.a1.unit08.lesson01.teach.skolko:
    title: сколько
    gloss: ile
    note: сколько pyta o ilość lub cenę i często występuje ze словом стоит.
    example_gloss: Ile kosztuje chleb?
  ru.a1.unit08.lesson01.teach.stoit:
    title: стоит
    gloss: kosztuje
    note: стоит to 3. osoba liczby pojedynczej czasownika стоить („kosztować”), używana z podmiotem w liczbie pojedynczej, np. хлеб.
