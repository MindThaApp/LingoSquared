    gloss: Nastia codziennie jeździ do pracy pociągiem. Dima zwykle jeździ rowerem, ale gdy pada deszcz, też jedzie pociągiem. Igor woli jeździć samochodem. Lena mieszka blisko i chodzi do pracy pieszo. A jak ty dojeżdżasz do pracy?
    note: 'Tekst zestawia cztery sposoby dojazdu do pracy i jeden warunek (deszcz): *обычно ... но когда идёт дождь ...*.'
    glosses:
      едет: dojeżdża
      каждый: każdy
      день: dzień
      поезде: pociąg
      работу: praca
      велосипеде: jeździ rowerem
      обычно: zwykle
      дождь: pada deszcz
