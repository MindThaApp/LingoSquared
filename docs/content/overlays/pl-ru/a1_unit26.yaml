course:
  title: Rosyjski A1
  description: 'Rosyjski dla początkujących: opisywanie podstawowego wyglądu osoby — wrażenie dotyczące wzrostu i wieku, kolor włosów i oczu, podstawowe pytanie Как ты выглядишь? oraz porównywanie wyglądu dwóch osób.'
units:
  ru.a1.unit26.appearance:
    title: Opisywanie wyglądu
lessons:
  ru.a1.unit26.lesson01.vysokiy_nevysokiy_staryy_i:
    title: Wysoki, niski, stary i młody
  ru.a1.unit26.lesson02.opisyvaem_volosy:
    title: Opisywanie włosów
  ru.a1.unit26.lesson03.glaza_i_kak_vyglyadit:
    title: Oczy i jak ktoś wygląda?
  ru.a1.unit26.lesson04.nastya_opisyvaet_ninu:
    title: Nastia opisuje Ninę
  ru.a1.unit26.lesson05.sravnivaem_igorya_i_lenu:
    title: Porównanie Igora i Leny
  ru.a1.unit26.lesson06.dima_uznayot_ninu:
    title: Dima rozpoznaje Ninę
teaching:
  ru.a1.unit26.lesson01.teach.vysokiy_nevysokiy:
    title: Wysoki i niski
    gloss: wysoki / niski
    note: '*Высокий* opisuje osobę wysoką, a *невысокий* niską (dosłownie „niewysoki”). Końcówka zmienia się zależnie od rodzaju: *высокая*, *невысокая*.'
    example_gloss:
    - Lena jest wysoka.
    - Igor jest niski.
  ru.a1.unit26.lesson01.teach.staryy_molodoy:
    title: Stary i młody
    gloss: stary / młody
    note: '*Старый* i *молодой* opisują tu ogólne wrażenie dotyczące wieku, a nie dokładną liczbę lat.'
    example_gloss:
    - Dziadek jest stary.
    - Dima jest młody.
  ru.a1.unit26.lesson01.teach.prilagatelnoe_menyaetsya_po:
    title: Przymiotniki zmieniają się według rodzaju
    gloss: 'Przymiotnik zgadza się z osobą: *он высокий, она высокая*; *он старый, она старая*.'
    note: Przymiotniki rodzaju męskiego kończą się na *-ый*, *-ий* lub *-ой* (*высокий*, *молодой*), a rodzaju żeńskiego na *-ая* (*высокая*, *молодая*).
  ru.a1.unit26.lesson01.teach.lena_vysokaya_a:
    title: Lena jest wysoka, a Igor niski
    gloss: Lena jest wysoka, a Igor niski.
    note: 'Dwa stwierdzenia zestawiamy spójnikiem *а* (a): *Лена высокая, а Игорь невысокий*.'
  ru.a1.unit26.lesson02.teach.volosy:
    title: Włosy
    gloss: włosy
    note: '*Волосы* (włosy) w rosyjskim występuje w liczbie mnogiej: *У Насти светлые волосы*; nie używa się tego słowa w liczbie pojedynczej.'
    example_gloss: Dima ma krótkie czarne włosy.
  ru.a1.unit26.lesson02.teach.svetlye_kashtanovye_sedye:
    title: Blond, brązowy i szary
    gloss: blond / brązowy / szary
    note: 'Trzy kolory włosów w liczbie mnogiej, zgodne z *волосы*: *светлые*, *каштановые*, *седые*.'
    example_gloss:
    - Nastia ma jasne włosy.
    - Igor ma brązowe włosy.
    - Dziadek ma siwe włosy.
  ru.a1.unit26.lesson02.teach.dlinnye_korotkie:
    title: Długie i krótkie (włosy)
    gloss: długi / krótki (o włosach)
    note: '*Длинные* (długie) i *короткие* (krótkie) też zgadzają się z *волосы* w liczbie mnogiej.'
    example_gloss:
    - Lena ma długie włosy.
    - Igor ma krótkie włosy.
  ru.a1.unit26.lesson02.teach.volosy_stoyat_vo:
    title: Przymiotniki zgadzają się z волосы
    gloss: '*Волосы* to liczba mnoga, więc przymiotnik też jest w liczbie mnogiej: *длинные волосы*, *короткие волосы*, *светлые волосы*, *чёрные волосы*.'
    note: Przymiotniki w liczbie mnogiej mają końcówkę *-ые* lub *-ие*. Taką samą końcówkę zobaczysz przy *глаза* w następnej lekcji.
  ru.a1.unit26.lesson02.teach.posle_u_imya:
    title: У + dopełniacz
    gloss: 'Po *у* właściciel stoi w dopełniaczu: *у Насти* (Nastia ma), *у Димы* (Dima ma), *у неё* (ona ma).'
    note: 'Tak po rosyjsku mówi się „ma”: *у* + dopełniacz + rzecz posiadana. Nie używa się czasownika „mieć”.'
  ru.a1.unit26.lesson02.teach.u_dimy_korotkie:
    title: Dima ma krótkie czarne włosy
    gloss: Dima ma krótkie czarne włosy.
    note: '*Чёрные* (czarne) zgadza się z *волосы* w liczbie mnogiej. W tym kursie zawsze piszemy literę *ё*.'
  ru.a1.unit26.lesson02.teach.u_nasti_dlinnye:
    title: Nastia ma długie jasne włosy
    gloss: Nastia ma długie jasne włosy.
    note: Łączy słownictwo tej lekcji o długości i kolorze w jednym naturalnym zdaniu.
  ru.a1.unit26.lesson03.teach.glaza:
    title: Oczy
    gloss: oczy
    note: '*Глаза* (oczy) to liczba mnoga od *глаз*; końcówka liczby mnogiej to *-а*.'
    example_gloss: Dima ma brązowe oczy.
  ru.a1.unit26.lesson03.teach.golubye_karie_zelyonye:
    title: Niebieski, brązowy i zielony
    gloss: niebieski / brązowy / zielony
    note: '*Голубые* to jasnoniebieskie, *карие* to brązowe, tylko o oczach, a *зелёные* to zielone. Wszystkie trzy są w liczbie mnogiej.'
    example_gloss:
    - Nastia ma niebieskie oczy.
    - Igor ma brązowe oczy.
    - Lena ma zielone oczy.
  ru.a1.unit26.lesson03.teach.glaza_stoyat_vo:
    title: Przymiotniki zgadzają się z глаза
    gloss: '*Глаза* to liczba mnoga, więc przymiotnik też jest w liczbie mnogiej: *голубые глаза*, *карие глаза*, *зелёные глаза*.'
    note: 'Brązowe oczy to *карие*, a nie *коричневые*, a brązowe włosy to *каштановые*: rosyjski używa innych słów dla oczu i dla włosów.'
  ru.a1.unit26.lesson03.teach.kak_vyglyadit_nastya:
    title: Jak wygląda Nastia?
    gloss: Jak wygląda Nastia?
    note: '*Как выглядит ...?* to główne pytanie tej jednostki. Czasownik *выглядит* zgadza się z podmiotem w liczbie pojedynczej.'
  ru.a1.unit26.lesson03.teach.u_nasti_dlinnye:
    title: Nastia ma długie jasne włosy i niebieskie oczy
    gloss: Nastia ma długie jasne włosy i niebieskie oczy.
    note: 'Wzorcowa odpowiedź łączy włosy i oczy spójnikiem *и*: *У Насти длинные светлые волосы и голубые глаза*.'
  ru.a1.unit26.lesson04.teach.nastya_v_yazykovoe:
    title: Nastia przedstawia Ninę
    gloss: 'Nastia: Do kawiarni językowej przyjdzie nowa dziewczyna. Ma na imię Nina.'
    note: '*Придёт* (przyjdzie) to czas przyszły dokonany. *Её зовут Нина* dosłownie znaczy „nazywają ją Nina”.'
  ru.a1.unit26.lesson04.teach.dima_khorosho_kak:
    title: Dima pyta, jak ona wygląda
    gloss: 'Dima: Dobrze! Jak ona wygląda?'
    note: Znowu to samo podstawowe pytanie, tym razem z *она* (ona) zamiast imienia.
  ru.a1.unit26.lesson04.teach.nastya_ona_nevysokaya:
    title: Nastia opisuje wzrost i włosy Niny
    gloss: 'Nastia: Jest niska i ma krótkie jasne włosy.'
    note: Łączy *невысокая* z lekcji 1 ze słowami o włosach z lekcji 2. *И у неё* dodaje drugi fakt.
  ru.a1.unit26.lesson04.teach.dima_a_kakie:
    title: Dima pyta o jej oczy
    gloss: 'Dima: A jakie ma oczy?'
    note: W *Какие у неё глаза?* użyto *у неё* („ona ma”). *Неё* to forma *она* po przyimku *у*.
  ru.a1.unit26.lesson04.teach.nastya_u_neyo:
    title: Nastia opisuje oczy Niny
    gloss: 'Nastia: Ma zielone oczy.'
    note: Znów *зелёные глаза* z lekcji 3, z *у неё* w znaczeniu „ona ma”.
  ru.a1.unit26.lesson04.teach.dima_spasibo_togda:
    title: Dima ją rozpozna
    gloss: 'Dima: Dzięki! W takim razie ją rozpoznam.'
    note: '*Я её узнаю* (rozpoznam ją): *её* to biernik od *она*, bo Nina jest dopełnieniem.'
  ru.a1.unit26.lesson05.teach.igor_i_lena:
    title: Porównanie Igora i Leny
    gloss: Igor i Lena są rodzeństwem, ale wyglądają zupełnie inaczej. Igor jest niski, ma krótkie brązowe włosy i brązowe oczy. Lena jest wyższa od Igora, ma długie brązowe włosy i zielone oczy. A jak wyglądasz ty?
    note: Krótkie porównanie, w którym wracają wszystkie poznane dotąd słowa określające kolor i długość. Tekst kończy się pytaniem kluczowym dla tej lekcji, skierowanym do czytelnika.
    glosses:
      брат: brat
      сестра: siostra
      выглядят: wyglądać
      по-разному: różnie
      невысокий: niski
      короткие: niski
      каштановые: brązowy
      волосы: włosy
      карие: brązowy
      глаза: oczy
      выше: wyższy
      длинные: długi
      зелёные: zielony
      выглядишь: wyglądasz (jak w pytaniu как ты выглядишь?)
  ru.a1.unit26.lesson05.teach.posle_vyshe_stoit:
    title: Porównanie z выше
    gloss: 'Po *выше* (wyższy) osoba, z którą porównujemy, stoi w dopełniaczu: *Лена выше Игоря*.'
    note: Stopień wyższy *выше* nie zmienia się według rodzaju. Osoba, z którą porównujemy, stoi w dopełniaczu albo występuje po *чем*.
  ru.a1.unit26.lesson05.teach.u_leny_volosy:
    title: Lena ma dłuższe włosy niż Igor
    gloss: Lena ma dłuższe włosy niż Igor.
    note: '*У Лены волосы длиннее, чем у Игоря*: *длиннее* się nie zmienia, a *чем* („niż”) otwiera drugą część.'
  ru.a1.unit26.lesson05.teach.u_menya_korotkie:
    title: Mam krótkie brązowe włosy
    gloss: Mam krótkie brązowe włosy.
    note: 'Wzorcowe zdanie o własnym wyglądzie: *У меня* („ja mam”) + przymiotnik + rzeczownik.'
  ru.a1.unit26.lesson06.teach.dima_smotri_eto:
    title: Dima zauważa Ninę
    gloss: 'Dima: Patrz, czy to Nina? Ma krótkie jasne włosy i zielone oczy.'
    note: '*Смотри* (patrz) to tryb rozkazujący w formie nieformalnej, używany tak samo we wcześniejszych dialogach.'
  ru.a1.unit26.lesson06.teach.nastya_da_eto:
    title: Nastia potwierdza
    gloss: 'Nastia: Tak, to Nina!'
    note: Krótkie, naturalne potwierdzenie.
  ru.a1.unit26.lesson06.teach.nina_privet_ty:
    title: Nina wita Dimę
    gloss: 'Nina: Cześć, ty jesteś Dima?'
    note: 'Proste nieformalne pytanie: po rosyjsku nie potrzeba czasownika „być”, wystarczy *Ты Дима?*'
  ru.a1.unit26.lesson06.teach.dima_da_priyatno:
    title: Dima też wita Ninę
    gloss: 'Dima: Tak! Miło cię poznać, Nina.'
    note: '*Приятно познакомиться* to standardowe wyrażenie przy pierwszym spotkaniu. *Познакомиться* znaczy poznać nową osobę.'
  ru.a1.unit26.lesson06.teach.nina_mne_tozhe:
    title: Nina odpowiada na powitanie
    gloss: 'Nina: Mnie również miło!'
    note: Kończy dialog — Dima rozpoznał Ninę dzięki wcześniejszemu opisowi Nasti.
