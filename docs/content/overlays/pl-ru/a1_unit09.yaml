    title: банк, аптека
    gloss: bank, apteka
    note: банк jest rodzaju męskiego, a аптека żeńskiego – oba to popularne miejsca w mieście.
    example_gloss:
    - Gdzie znajduje się bank?
    - Gdzie znajduje się apteka?
  ru.a1.unit09.lesson02.teach.vokzal_gostinitsa:
    title: вокзал, гостиница
    gloss: dworzec, hotel
    note: вокзал jest rodzaju męskiego, a гостиница żeńskiego.
    example_gloss:
    - Gdzie znajduje się dworzec?
    - Gdzie znajduje się hotel?
  ru.a1.unit09.lesson02.teach.restoran_biblioteka:
    title: ресторан, библиотека
    gloss: restauracja, biblioteka
    note: ресторан jest rodzaju męskiego, a библиотека żeńskiego; nazwy ulic, takie jak Чайковского i Пушкина, stoją po улица w dopełniaczu.
    example_gloss:
    - Gdzie znajduje się restauracja?
    - Gdzie znajduje się biblioteka?
  ru.a1.unit09.lesson03.teach.chto_est_na_vashey_ulitse:
    title: Что есть на вашей улице?
    gloss: Co jest na twojej ulicy?
    note: вашей to forma grzecznościowa „wasz/pana/pani”, uzgodniona z rzeczownikiem żeńskim улице w miejscowniku.
  ru.a1.unit09.lesson03.teach.anna_chto_est:
    title: Anna pyta o ulicę
    gloss: 'Anna: Co jest na Pana/Pani ulicy?'
    note: Anna zaczyna dialog pytaniem Что есть на вашей улице?
  ru.a1.unit09.lesson03.teach.viktor_na_moey_ulitse:
    title: Wiktor wymienia trzy miejsca
    gloss: 'Wiktor: Na mojej ulicy jest sklep, biblioteka i bank.'
    note: На моей улице есть wprowadza wyliczenie z użyciem есть („jest/są”), a elementy łączy и.
  ru.a1.unit09.lesson03.teach.anna_a_gde_bank:
    title: Anna pyta, gdzie jest bank
    gloss: 'Anna: A gdzie znajduje się bank?'
    note: А płynnie wprowadza dodatkowe pytanie Anny o jedno z miejsc wymienionych przez Wiktora.
  ru.a1.unit09.lesson03.teach.viktor_bank_na_pushkina:
    title: Wiktor podaje ulicę, przy której jest bank
    gloss: 'Wiktor: Bank jest na ulicy Puszkina.'
    note: Wiktor odpowiada Банк на улице Пушкина, używając dopełniacza Пушкина po улице.
  ru.a1.unit09.lesson03.teach.anna_spasibo_bolshoe:
    title: Anna dziękuje Wiktorowi
    gloss: 'Anna: Bardzo dziękuję.'
    note: Спасибо большое wzmacnia спасибо słowem большое („duże”) – to częsty sposób, by powiedzieć „bardzo dziękuję”.
  ru.a1.unit09.lesson03.teach.viktor_pozhaluysta:
    title: Wiktor odpowiada
    gloss: 'Wiktor: Proszę bardzo.'
    note: Пожалуйста to odpowiedź na спасибо, odpowiednik „proszę bardzo”.
