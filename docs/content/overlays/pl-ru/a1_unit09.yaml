    example_gloss: Gdzie jest sklep?
  ru.a1.unit09.lesson01.teach.nakhoditsya:
    title: находится
    gloss: znajduje się
    note: находится to 3. osoba liczby pojedynczej od находиться („znajdować się”); używamy jej z podmiotem w liczbie pojedynczej, np. магазин.
    example_gloss: Gdzie znajduje się sklep?
  ru.a1.unit09.lesson01.teach.ulitsa:
    title: улица
    gloss: ulica
    note: улица jest rodzaju żeńskiego; на Тверской улице („na ulicy Twerskiej”) – po на stoi miejscownik.
    example_gloss: Sklep jest na ulicy Twerskiej.
  ru.a1.unit09.lesson01.teach.gde_nakhoditsya_magazin:
    title: Где находится магазин?
