  ru.a1.unit16.lesson01.teach.u_menya_bolit_golova:
    title: У меня болит голова.
    gloss: Boli mnie głowa.
    note: у меня znaczy dosłownie „u mnie” i odpowiada polskiemu „mam”; болит znaczy „boli” i pasuje do podmiotu w liczbie pojedynczej, takiego jak голова (głowa).
  ru.a1.unit16.lesson01.teach.zhivot:
    title: живот
    gloss: brzuch
    note: живот znaczy „brzuch”. Ze wzorem у меня болит... możesz użyć dowolnej części ciała.
    example_gloss: Boli mnie brzuch.
  ru.a1.unit16.lesson01.teach.gorlo:
    title: горло
    gloss: gardło
    note: горло znaczy „gardło”.
    example_gloss: Boli mnie gardło.
  ru.a1.unit16.lesson02.teach.u_menya_temperatura:
    title: У меня температура.
    gloss: Mam gorączkę.
    note: температура dosłownie znaczy „temperatura”, ale po rosyjsku to standardowy sposób, by powiedzieć „gorączka”.
  ru.a1.unit16.lesson02.teach.prostuda:
    title: простуда
    gloss: przeziębienie
    note: простуда znaczy „przeziębienie” (choroba). Powiedz у меня простуда, aby wyrazić „Jestem przeziębiony/przeziębiona”.
    example_gloss: Jestem przeziębiony.
  ru.a1.unit16.lesson02.teach.mne_ploho:
    title: Мне плохо.
    gloss: Źle się czuję.
    note: Мне плохо to ogólny sposób na powiedzenie, że źle się czujesz, bez wskazywania konkretnego objawu.
  ru.a1.unit16.lesson03.teach.dima_zdravstvuyte_bolit:
    title: Dima wita się z lekarzem
    gloss: 'Dima: Dzień dobry! Boli mnie głowa i gardło.'
    note: Дима zaczyna formalnym Здравствуйте!, bo lekarz jest dla niego obcą osobą.
  ru.a1.unit16.lesson03.teach.doktor_chto_u_vas_bolit:
    title: Lekarz pyta, co boli
    gloss: 'Lekarz: Co Pana boli? Głowa i gardło?'
    note: Lekarz używa formalnego вас („Pan/Pani”, też liczba mnoga) zamiast nieformalnego тебя („ciebie”).
  ru.a1.unit16.lesson03.teach.dima_da_i_eshchyo_temperatura:
    title: Dima dodaje jeszcze jeden objaw
    gloss: 'Dima: Tak, i jeszcze gorączka.'
    note: ещё znaczy „jeszcze / dodatkowo” — и ещё... dodaje kolejną rzecz do tego, co właśnie powiedziałeś/powiedziałaś.
  ru.a1.unit16.lesson03.teach.doktor_vam_nuzhno_otdyhat:
    title: Lekarz udziela rady
    gloss: 'Lekarz: Musi Pan odpoczywać i pić dużo wody.'
    note: Вам нужно + bezokolicznik znaczy „musi Pan/Pani...” lub „trzeba...”; вам to formalny celownik „Panu/Pani”.
