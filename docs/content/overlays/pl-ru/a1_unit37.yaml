  ru.a1.unit37.lesson05.teach.nina_novenkaya_v:
    title: Nina słucha o wszystkich
    gloss: Nina jest nowa w kawiarni językowej. Pyta Dimę, jacy są pozostali. Dima opowiada. Nastia jest dobra i cierpliwa, pracuje jako pielęgniarka. Igor jest zabawny i chodzi na kurs hiszpańskiego. Lena jest ciekawska, lubi poznawać nowe rzeczy. Sam Dima jest spokojny.
    note: Podsumowuje cechy charakteru osób z grupy, podobnie jak czytanki porównawcze w jednostkach o domu, okolicy, poczcie i gotowaniu.
    glosses:
      новенькая: nowy
      кафе: kawiarnia językowa
      спрашивает: pyta
      остальные: pozostali
      рассказывает: opowiada
      добрая: miły
      терпеливая: cierpliwy
      работает: pracuje
      медсестрой: pielęgniarka
      смешной: zabawny
      ходит: chodzi na / uczęszcza
      курсы: kurs
      испанского: hiszpański
      любопытная: ciekawski
      узнавать: uczy się
      любит: chętnie
      новые: nowy
      вещи: rzeczy
      Сам: sam
      спокойный: spokojny
