  ru.a1.unit30.lesson06.teach.nastya_ya_vizhu:
    title: Nastia potwierdza plan
    gloss: 'Nastia: Widzę wiadomość. Może w sobotę o dziesiątej poćwiczymy w parku?'
  ru.a1.unit30.lesson06.teach.dima_da_i:
    title: Dima potwierdza pogodę
    gloss: 'Dima: Tak, i w sobotę będzie słonecznie!'
  ru.a1.unit30.lesson06.teach.igor_ya_togda:
    title: Plan Igora
    gloss: 'Igor: Ja wtedy pobiegam. Potem jeszcze pogram w piłkę.'
    note: '*Потом* („potem”) umieszcza drugi plan po pierwszym, a *побегаю* jest dokonane: „pobiegam przez jakiś czas”.'
  ru.a1.unit30.lesson06.teach.lena_ya_luchshe:
    title: Plan Leny
    gloss: 'Lena: Wolę pływać, ale też przyjdę do parku.'
    note: '*Я лучше поплаваю* znaczy „wolę popływać”. *Лучше* przed czasownikiem wyraża preferencję.'
  ru.a1.unit30.lesson06.teach.nastya_zdorovo_do:
    title: Nastia kończy rozmowę
    gloss: 'Nastia: Super! Do soboty w parku!'
    note: W jednym zdaniu zamyka wątek wiadomości z tej lekcji i plan z tematu o sporcie.
