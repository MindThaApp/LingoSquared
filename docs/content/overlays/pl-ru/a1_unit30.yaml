    gloss: sprawdzać, zajrzeć
    example_gloss: Sprawdzam prognozę pogody.
  ru.a1.unit30.lesson03.teach.posle_polzovatsya_slovo:
    title: Пользоваться i искать
    gloss: '*Пользоваться* łączy się z narzędnikiem (*пользоваться телефоном*), a *искать* z biernikiem (*искать прогноз*).'
    note: 'Oba czasowniki odmieniają się regularnie: *я пользуюсь, ты пользуешься*; *я ищу, ты ищешь*.'
  ru.a1.unit30.lesson03.teach.igor_ishchet_prognoz:
    title: Igor szuka prognozy pogody
    gloss: Igor szuka prognozy pogody.
  ru.a1.unit30.lesson03.teach.potom_on_idyot:
    title: Potem idzie pobiegać
    gloss: Potem idzie pobiegać.
    note: '*Идёт бегать* znaczy „idzie biegać”: *идёт* to czasownik ruchu, po którym następuje bezokolicznik tego, co ktoś idzie robić.'
  ru.a1.unit30.lesson04.teach.nastya_davay_v:
    title: Nastia składa propozycję
    gloss: 'Nastia: Może w sobotę o dziesiątej poćwiczymy?'
  ru.a1.unit30.lesson04.teach.dima_khoroshaya_ideya:
    title: Dima się zgadza
    gloss: 'Dima: Dobry pomysł! Poszukam prognozy pogody.'
    note: '*Хорошая идея* to przymiotnik rodzaju żeńskiego z rzeczownikiem rodzaju żeńskiego. *Поищу* to czas przyszły dokonany: „poszukam”.'
  ru.a1.unit30.lesson04.teach.dima_v_subbotu:
    title: Dima sprawdza pogodę
    gloss: 'Dima: W sobotę będzie słonecznie!'
    note: '*Солнечно* to słowo opisujące pogodę. Czasownik „być” nie jest potrzebny: *В субботу солнечно*.'
  ru.a1.unit30.lesson04.teach.igor_ya_vizhu:
    title: Igor widzi wiadomość
    gloss: 'Igor: Widzę wiadomość. Do soboty!'
  ru.a1.unit30.lesson04.teach.ty_uzhe_znaesh:
    title: До z dopełniaczem
    gloss: 'Znasz już *До свидания!* Można też wymienić dzień: *До субботы!*, *До завтра!* Po *до* rzeczownik stoi w dopełniaczu.'
    note: Rozszerza wzór pożegnania z tematu o powitaniach na konkretny dzień.
  ru.a1.unit30.lesson05.teach.nastya_kazhdyy_den:
    title: Kto czego używa?
    gloss: Nastia codziennie dzwoni do Dimy. Korzysta z telefonu, a nie z aplikacji. Dima nie ma w domu komputera, ale korzysta z internetu w telefonie. Igor każdego ranka szuka prognozy pogody. Potem idzie biegać. Lena często wysyła Nasti wiadomość. Ty też codziennie korzystasz z telefonu?
    note: Porównanie tego, jak wszystkie cztery postacie korzystają z urządzeń, na wzór tekstu porównawczego z tematu o sporcie.
