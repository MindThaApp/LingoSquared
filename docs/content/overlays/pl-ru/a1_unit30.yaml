  ru.a1.unit30.lesson02.teach.prognoz_pogody_slovo:
    title: Прогноз погоды i сообщение
    gloss: '*Прогноз погоды* to dwa słowa, a drugie, *погоды*, stoi w dopełniaczu. *Сообщение* to wiadomość, którą można wysłać lub przeczytać.'
    note: Nowe słowo łączy się ze znanym już rzeczownikiem złożonym z tematu o pogodzie.
  ru.a1.unit30.lesson02.teach.nastya_otpravlyaet_soobshchenie:
    title: Nastia wysyła wiadomość przez aplikację
    gloss: Nastia wysyła wiadomość przez aplikację.
    note: '*Отправляет* („wysyła”) to czasownik regularny. Wiadomość jest dopełnieniem w bierniku, a *через приложение* znaczy „przez aplikację”.'
  ru.a1.unit30.lesson02.teach.dima_chitaet_soobshchenie:
    title: Dima czyta wiadomość
    gloss: Dima czyta wiadomość.
  ru.a1.unit30.lesson03.teach.iskat:
