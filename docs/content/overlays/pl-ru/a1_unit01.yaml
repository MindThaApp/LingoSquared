course:
  title: Rosyjski A1
  description: 'Naucz się rosyjskiego na poziomie A1: codziennych powitań i krótkich rozmów towarzyskich. Znajdziesz tu szczegółowe wyjaśnienia alfabetu cyrylicy oraz różnicy między formalnym вы a nieformalnym ты.'
units:
  ru.a1.unit01.greetings:
    title: Powitania i pożegnania
lessons:
  ru.a1.unit01.lesson01.script_ramp:
    title: Poznaj cyrylicę
  ru.a1.unit01.lesson02.vremya_dnya:
    title: Powitania na różne pory dnia
  ru.a1.unit01.lesson03.kak_dela_i_proshchanie:
    title: Jak się masz? i pożegnania
teaching:
  ru.a1.unit01.lesson01.teach.direction:
    title: Kierunek czytania
    gloss: Alfabet rosyjski czyta się od lewej do prawej, tak jak polski.
    note: Rosyjski (cyrylica) czyta się w tym samym kierunku co polski, więc nie musisz zmieniać żadnych nawyków – uczysz się tylko nowych kształtów liter i dźwięków.
  ru.a1.unit01.lesson01.teach.letter_z:
    title: З з
    gloss: litera Z
    note: Wymawiana jak polskie „z” w słowie „zebra”. Mała litera з przypomina cyfrę 3.
  ru.a1.unit01.lesson01.teach.letter_d:
    title: Д д
    gloss: litera D
    note: Wymawiana jak polskie „d” w słowie „dom”. Litera д ma krótkie „nóżki” pod linią i wcale nie przypomina łacińskiego „d”, więc naucz się jej kształtu od nowa.
  ru.a1.unit01.lesson01.teach.letter_r:
    title: Р р
    gloss: litera R
    note: Wymawiana jako przetaczane „r”, podobnie jak polskie r. Wygląda jak łacińskie „P” – to klasyczna pułapka, więc nie czytaj jej jako „p”.
  ru.a1.unit01.lesson01.teach.letter_a:
    title: А а
    gloss: litera A
    note: Wymawiana jak polskie „a” w słowie „mama”. Wygląda tak samo jak łacińskie A/a i brzmi podobnie.
  ru.a1.unit01.lesson01.teach.letter_v:
    title: В в
    gloss: litera W
    note: Wymawiana jak polskie „w” w słowie „woda”. Wygląda jak łacińskie „B” – kolejna pułapka, na którą trzeba uważać.
  ru.a1.unit01.lesson01.teach.letter_s:
    title: С с
    gloss: litera S
    note: Wymawiana jak polskie „s” w słowie „sam”. Wygląda jak łacińskie C/c, ale w rosyjskim nigdy nie czyta się jej jak „k” ani „c”.
  ru.a1.unit01.lesson01.teach.letter_t:
    title: Т т
    gloss: litera T
    note: Wymawiana jak polskie „t” w słowie „tak”. Odręcznie małe т bywa pisane jak małe „m” – na początku naucz się kształtu drukowanego.
  ru.a1.unit01.lesson01.teach.letter_u:
    title: У у
    gloss: litera U
    note: Wymawiana jak polskie „u” w słowie „kula”. Wygląda jak łacińskie „y” – kolejny kształt, który nie odpowiada dźwiękowi podobnie wyglądającej łacińskiej litery.
  ru.a1.unit01.lesson01.teach.letter_ye:
    title: Е е
    gloss: litera Je
    note: Na początku wyrazu lub sylaby wymawiana jak „je” w słowie „jeść”. Wygląda tak samo jak łacińskie E/e, ale brzmi zupełnie inaczej.
  ru.a1.unit01.lesson01.teach.hard_sign_note:
    title: 'ъ i ь: twardy znak i miękki znak'
    gloss: 'Twardy znak ъ i miękki znak ь nie mają własnego dźwięku: zmieniają wymowę sąsiedniej litery.'
    note: Te dwa znaki same nie oznaczają żadnego dźwięku – ь zmiękcza poprzedzającą spółgłoskę, a ъ wyznacza twardy rozdział między dźwiękami. Wrócimy do nich, gdy pojawią się prawdziwe słowa z tymi znakami.
  ru.a1.unit01.lesson01.teach.letter_short_i:
    title: Й й
    gloss: litera I krótkie
    note: Wymawiana jak polskie „j” w słowie „daj” – to krótki półsamogłoskowy dźwięk, a nie pełna samogłoska. Występuje w słowie Здравствуйте, do którego zmierza ta lekcja.
  ru.a1.unit01.lesson01.teach.zdravstvuyte_shape:
    title: Здравствуйте
    gloss: dzień dobry (formalnie)
    note: Pełne formalne powitanie, zbudowane z liter, które właśnie poznałeś. Wygląda na długie i pełne spółgłosek, ale każda jego litera była już omówiona w tej lekcji.
    example_gloss: Dzień dobry! Nazywam się Wiktor.
  ru.a1.unit01.lesson02.teach.zdravstvuyte_privet:
    title: Здравствуйте, Привет
    gloss: dzień dobry (formalnie); cześć (nieformalnie)
    note: Здравствуйте to bezpieczne, uniwersalne powitanie formalne – o każdej porze dnia i wobec nieznajomych. Привет jest swobodne, używa się go wobec przyjaciół i rówieśników.
    example_gloss:
    - Dzień dobry! Jak się Pan/Pani miewa? (formalnie)
    - Cześć! Co słychać? (nieformalnie)
  ru.a1.unit01.lesson02.teach.dobroe_utro:
    title: Доброе утро!
    gloss: dzień dobry (rano)
    note: Używane rano, mniej więcej do późnego przedpołudnia.
  ru.a1.unit01.lesson02.teach.dobryy_den:
    title: Добрый день!
    gloss: dzień dobry
    note: Standardowe powitanie w ciągu dnia, od późnego przedpołudnia przez całe popołudnie.
  ru.a1.unit01.lesson02.teach.dobryy_vecher:
    title: Добрый вечер!
    gloss: dobry wieczór
    note: Używane przy spotkaniu wieczorem – to powitanie, a nie pożegnanie.
  ru.a1.unit01.lesson02.teach.register_note:
    title: Wybór powitania
    gloss: Здравствуйте pasuje o każdej porze dnia i w uprzejmej rozmowie. Привет jest nieformalne, używane wśród przyjaciół.
    note: Gdy nie jesteś pewien pory dnia albo tego, z kim rozmawiasz, Здравствуйте zawsze jest bezpieczne; Привет zostaw dla osób, które już dobrze znasz.
  ru.a1.unit01.lesson03.teach.kak_dela:
    title: Как дела?
    gloss: Jak się masz? (nieformalnie)
    note: Codzienny, nieformalny sposób zapytania, jak się ktoś ma, używany wobec przyjaciół i rówieśników.
  ru.a1.unit01.lesson03.teach.kak_pozhivaete:
    title: Как поживаете?
    gloss: Jak się Pan/Pani miewa?
    note: Formalny sposób zapytania, jak się ktoś ma, odpowiadający formie вы.
  ru.a1.unit01.lesson03.teach.horosho_spasibo:
    title: Хорошо, спасибо
    gloss: dobrze, dziękuję
    note: Prosta, pozytywna odpowiedź, której możesz użyć w obu rejestrach.
    example_gloss: Jak się masz? – Dobrze, dziękuję.
  ru.a1.unit01.lesson03.teach.tak_sebe:
    title: Так себе
    gloss: tak sobie
    note: Odpowiedź neutralna lub lekko negatywna, gdy sprawy nie idą ani świetnie, ani źle.
    example_gloss: Jak się masz? – Tak sobie.
  ru.a1.unit01.lesson03.teach.a_u_tebya:
    title: А у тебя?
    gloss: A tobie?
    note: Nieformalny sposób, by zwrócić pytanie rozmówcy, odpowiadający formie ты.
  ru.a1.unit01.lesson03.teach.do_svidaniya:
    title: До свидания!
    gloss: do widzenia (neutralnie/formalnie)
    note: Standardowe, uniwersalne pożegnanie – dosłownie mniej więcej „do zobaczenia”.
  ru.a1.unit01.lesson03.teach.poka:
    title: Пока!
    gloss: pa (nieformalnie)
    note: Swobodny, bardzo częsty sposób pożegnania wśród przyjaciół i znajomych.
  ru.a1.unit01.lesson03.teach.do_zavtra:
    title: До завтра!
    gloss: do zobaczenia jutro
    note: Przyjazne pożegnanie, gdy spodziewasz się zobaczyć daną osobę następnego dnia.
  ru.a1.unit01.lesson03.teach.anna:
    title: Anna wita się z Maksymem
    gloss: 'Anna mówi: Dzień dobry! Jak się masz?'
    note: Anna i Maksim to koledzy z pracy, którzy witają się w ciągu dnia. Słowo дела wskazuje na zażyłość (rejestr nieformalny).
  ru.a1.unit01.lesson03.teach.maksim_reply:
    title: Maksim odpowiada i zadaje pytanie
    gloss: 'Maksim mówi: Dobrze, dziękuję. A ty?'
    note: Maksim odpowiada i nieformalnie zwraca pytanie, zgodnie z rejestrem Anny.
  ru.a1.unit01.lesson03.teach.anna_close:
    title: Anna kończy rozmowę
    gloss: 'Anna mówi: Ja też dobrze. No to do jutra!'
    note: Anna kończy small talk i przechodzi do przyjaznego pożegnania.
  ru.a1.unit01.lesson03.teach.maksim_close:
    title: Maksim się żegna
    gloss: 'Maksim mówi: Do jutra!'
    note: Maksim powtarza pożegnanie Anny i kończy rozmowę.
