teaching:
  ru.a1.unit25.lesson01.teach.chitat_zanimatsya_sportom:
    title: Czytanie, sport, gotowanie
    gloss: czytać, uprawiać sport, gotować
    note: 'Trzy popularne czasowniki związane z hobby: *читать* (czytać), *заниматься спортом* (uprawiać sport) i *готовить* (gotować).'
    example_gloss:
    - Lubię czytać książkę.
    - W soboty uprawiam sport.
    - Lubię gotować dla przyjaciół.
  ru.a1.unit25.lesson01.teach.svobodnoe_vremya:
    title: Czas wolny
    gloss: czas wolny
    note: '*Свободное время* to kluczowe wyrażenie w rozmowie o hobby. Przymiotnik *свободное* ma końcówkę *-ое*, bo zgadza się z rzeczownikiem *время* (rodzaj nijaki).'
    example_gloss: W wolnym czasie lubię czytać.
  ru.a1.unit25.lesson01.teach.v_svobodnoe_vremya:
    title: Mówimy, co robisz w wolnym czasie
    gloss: W wolnym czasie lubię czytać.
    note: '*Люблю* to forma *я* czasownika *любить* (lubić, kochać). Po nim drugi czasownik stoi w bezokoliczniku: *люблю читать*.'
  ru.a1.unit25.lesson02.teach.slushat_muzyku_risovat:
    title: Muzyka, rysowanie, gry wideo
    gloss: słuchać muzyki, rysować, grać w gry wideo
    note: 'Jeszcze trzy zajęcia: *слушать музыку* (słuchać muzyki), *рисовать* (rysować) i *играть в игры* (grać w gry).'
    example_gloss:
    - Lubię słuchać muzyki.
    - Często rysuję.
    - Lubię grać w gry wideo z przyjaciółmi.
  ru.a1.unit25.lesson02.teach.ya_lyublyu_slushat:
    title: Mówimy, że lubisz słuchać muzyki
    gloss: Lubię słuchać muzyki.
    note: 'Po *слушать* dopełnienie stoi w bierniku, bez przyimka: *музыку* to biernik od *музыка*, z końcówką *-у*. Uwaga: po polsku mówimy „słuchać muzyki” (dopełniacz), a po rosyjsku biernik.'
  ru.a1.unit25.lesson02.teach.ya_lyublyu_igrat:
    title: Mówimy, że lubisz grać z przyjaciółmi
    gloss: Lubię grać w gry wideo z przyjaciółmi.
    note: '*С друзьями* (z przyjaciółmi): po przyimku *с* w tym znaczeniu stoi narzędnik, stąd *друзьями*.'
  ru.a1.unit25.lesson03.teach.vsegda_chasto_inogda:
    title: Zawsze, często, czasami, nigdy
    gloss: zawsze, często, czasami, nigdy
    note: 'Cztery podstawowe przysłówki częstotliwości: *всегда*, *часто*, *иногда*, *никогда*. Nigdy nie zmieniają formy.'
    example_gloss:
    - W soboty zawsze ćwiczę.
    - Często czytam książkę.
    - Czasami rysuję.
    - Nigdy nie gram w gry.
  ru.a1.unit25.lesson03.teach.kazhduyu_nedelyu_kazhdye:
    title: Co tydzień, w każdy weekend
    gloss: co tydzień, w każdy weekend
    note: '*Каждую неделю* i *каждые выходные* znaczą „co tydzień” i „w każdy weekend”, ale końcówka zależy od rzeczownika – zobacz następną kartę.'
    example_gloss:
    - Co tydzień gotuję dla przyjaciół.
    - Co weekend ćwiczę.
  ru.a1.unit25.lesson03.teach.nedelya_zhenskogo_roda:
    title: 'Каждый: rodzaj żeński i liczba mnoga'
    gloss: '*Неделя* jest rodzaju żeńskiego, dlatego mówimy *каждую неделю*. *Выходные* występuje w liczbie mnogiej, dlatego mówimy *каждые выходные*.'
    note: '*Каждый* zgadza się z rzeczownikiem jak każdy przymiotnik: *каждый день* (rodzaj męski), *каждую неделю* (rodzaj żeński, biernik), *каждые выходные* (liczba mnoga).'
  ru.a1.unit25.lesson03.teach.chto_ty_delaesh:
    title: Pytamy o czas wolny
    gloss: Co robisz w wolnym czasie?
    note: To główne pytanie tej lekcji — użyj go, by zapytać kogokolwiek o hobby.
  ru.a1.unit25.lesson04.teach.nastya_my_chasto:
    title: Nastia zaczyna rozmowę o hobby
    gloss: 'Nastia: Często razem spacerujemy. A co jeszcze robisz w wolnym czasie, Dima?'
    note: '*Мы часто гуляем вместе*: przy *мы* (my) czasownik ma końcówkę *-ем*, a *гулять* znaczy „spacerować, chodzić na spacer”.'
  ru.a1.unit25.lesson04.teach.dima_ya_lyublyu:
    title: Hobby Dimy
    gloss: 'Dima: Lubię gotować, także w domu. A poza tym często uprawiam sport.'
    note: '*И дома тоже* (także w domu): *и ... тоже* pokazuje, że Dima gotuje dla przyjemności, a nie tylko w pracy.'
  ru.a1.unit25.lesson04.teach.nastya_ty_i:
    title: Nastia jest zdziwiona
    gloss: 'Nastia: Gotujesz też w domu? Przecież cały dzień gotujesz w pracy!'
    note: '*Весь день* (cały dzień) podkreśla, ile Dima już gotuje w pracy. *Весь* zgadza się z rzeczownikiem *день* rodzaju męskiego.'
  ru.a1.unit25.lesson04.teach.dima_da_no:
    title: Dima wyjaśnia
    gloss: 'Dima: Tak, ale gotowanie mnie relaksuje. A ty, co lubisz robić?'
    note: '*Готовить меня расслабляет* stawia czynność na początku: dosłownie „gotowanie mnie relaksuje”, a *меня* jest w bierniku.'
  ru.a1.unit25.lesson04.teach.nastya_ya_lyublyu:
    title: Hobby Nasti
    gloss: 'Nastia: Lubię czytać i często słucham muzyki.'
    note: 'Dwa czasowniki związane z hobby, znane z wcześniejszych lekcji, są połączone spójnikiem *и* (i): *люблю читать и часто слушаю музыку*.'
  ru.a1.unit25.lesson04.teach.dima_ty_tozhe:
    title: Dima pyta o gry
    gloss: 'Dima: Ty też grasz w gry?'
    note: 'Krótkie pytanie rozstrzygnięcia: po rosyjsku szyk zdania się nie zmienia, rośnie tylko intonacja: *Ты тоже играешь в игры?*'
  ru.a1.unit25.lesson04.teach.nastya_net_ya:
    title: Odpowiedź Nasti
    gloss: 'Nastia: Nie, nigdy nie gram w gry. Za to czasem rysuję!'
    note: '*Никогда не* (nigdy) wymaga dodatkowego *не* przed czasownikiem – tak jak w polskim „nigdy nie”. *Иногда* (czasami) jest przeciwieństwem.'
  ru.a1.unit25.lesson05.teach.my_s_dimoy:
    title: Porównujemy hobby
    gloss: Dima i ja często spacerujemy razem. Ale mamy też inne hobby. Dima lubi gotować, także w domu, i często uprawia sport. Ja lubię czytać i często słucham muzyki. Czasem rysuję, ale nigdy nie gram w gry. A co ty lubisz robić w wolnym czasie?
    note: Wiadomość Nasti podsumowuje fakty z wcześniejszej lekcji i kończy się pytaniem do czytelnika – to główne pytanie tej jednostki.
    glosses:
      гуляем: spacerować
      часто: często
      вместе: razem
      другие: inne
      готовить: gotuje
      любит: chętnie
      дома: w domu
      занимается: uprawia (sport)
      читать: czytam
      слушаю: słucham
      музыку: muzyka
      рисую: rysuję
      иногда: czasami
      играю: gram w gry wideo
      никогда: nigdy
      свободное: wolny
      время: czas
  ru.a1.unit25.lesson06.teach.dima_chto_ty:
    title: Dima pyta o weekend
    gloss: 'Dima: Co robisz w ten weekend?'
    note: '*В эти выходные* (w ten weekend): *выходные* jest w liczbie mnogiej, więc *эти* też, a *в* przy określeniu czasu wymaga biernika.'
  ru.a1.unit25.lesson06.teach.nastya_poka_ne:
    title: Nastia jeszcze się nie zdecydowała
    gloss: 'Nastia: Jeszcze nie wiem. Lubię czytać, ale chcę też wyjść na dwór.'
    note: '*Хочу ещё выйти на улицу* znaczy „chcę też wyjść na dwór”. *Хочу* to forma *я* czasownika *хотеть*.'
  ru.a1.unit25.lesson06.teach.dima_davay_pogulyaem:
    title: Dima proponuje plan
    gloss: 'Dima: Pójdziemy razem na spacer? Potem ugotuję nam coś do jedzenia.'
    note: '*Давай погуляем* to typowy sposób proponowania wspólnego działania, a *потом* (potem) porządkuje kolejne kroki.'
  ru.a1.unit25.lesson06.teach.nastya_khoroshaya_ideya:
    title: Nastia się zgadza
    gloss: 'Nastia: Dobry pomysł! Lubię i spacerować, i gotować.'
    note: '*Мне нравится* dosłownie znaczy „mnie się podoba”: osoba stoi w celowniku (*мне*), a po nim następuje to, co się podoba.'
  ru.a1.unit25.lesson06.teach.dima_otlichno_togda:
    title: Dima potwierdza
    gloss: 'Dima: Świetnie. To do zobaczenia w sobotę!'
    note: '*Увидимся в субботу* (do zobaczenia w sobotę): *в* przy dniu tygodnia wymaga biernika, więc *суббота* zmienia się w *субботу*.'
