teaching:
  ru.a1.unit03.lesson01.teach.u_menya:
    title: У меня ...
    gloss: mam ...
    note: Dosłownie „u mnie (jest) ...” — standardowy rosyjski sposób wyrażania posiadania; czasownika „mieć” używa się tu zwykle inaczej niż w polskim.
  ru.a1.unit03.lesson01.teach.odin_dva:
    title: один, два
    gloss: jeden, dwa
    note: 'Po два („dwa”) rzeczownik przyjmuje szczególną formę dopełniacza liczby pojedynczej: брат („brat”) zmienia się w брата, a nie w liczbę mnogą, jak w polskim („dwóch braci”).'
    example_gloss:
    - Mam jednego brata.
    - Mam dwóch braci.
  ru.a1.unit03.lesson01.teach.tri_chetyre:
    title: три, четыре
    gloss: trzy, cztery
    note: Три i четыре wymagają tej samej formy dopełniacza liczby pojedynczej co два — книга („książka”) zmienia się w книги po każdym z liczebników два/три/четыре.
    example_gloss:
    - Mam trzy książki.
    - Mam cztery książki.
  ru.a1.unit03.lesson01.teach.pyat:
    title: пять
    gloss: pięć
    note: Od пять („pięć”) wzwyż rzeczownik przyjmuje formę dopełniacza liczby mnogiej — рубль („rubel”) zmienia się w рублей, a nie w рубли.
    example_gloss: Mam pięć rubli.
  ru.a1.unit03.lesson01.teach.brat_bratya:
    title: брат, брата
    gloss: brat; bracia (po 2–4)
    note: брата to forma dopełniacza liczby pojedynczej używana właśnie po два, три i четыре — nie zwykła liczba mnoga.
    example_gloss: Mam dwóch braci.
  ru.a1.unit03.lesson01.teach.kniga_knigi:
    title: книга, книги
    gloss: książka; książki (po 2–4)
    note: книги to ten sam wzorzec dopełniacza liczby pojedynczej co брата, używany po два, три i четыре.
    example_gloss: Mam trzy książki.
  ru.a1.unit03.lesson01.teach.rubl_rubley:
    title: рубль, рублей
    gloss: rubel; ruble (od 5)
    note: рублей to forma dopełniacza liczby mnogiej używana od пять („pięć”) wzwyż.
    example_gloss: Mam pięć rubli.
  ru.a1.unit03.lesson02.teach.shest_sem:
    title: шесть, семь
    gloss: sześć, siedem
    note: Podobnie jak пять, zarówno шесть, jak i семь wymagają rzeczownika w dopełniaczu liczby mnogiej.
    example_gloss:
    - Jest szósta.
    - Mam siedem rubli.
  ru.a1.unit03.lesson02.teach.vosem_devyat:
    title: восемь, девять
    gloss: osiem, dziewięć
    note: 'Oba kontynuują wzorzec dopełniacza liczby mnogiej: книга zmienia się w книг, a рубль w рублей.'
    example_gloss:
    - Mam osiem książek.
    - Mam dziewięć rubli.
  ru.a1.unit03.lesson02.teach.desyat:
    title: десять
    gloss: dziesięć
    note: Używane także przy podawaniu wieku, jak w Мне десять лет („Mam dziesięć lat”).
    example_gloss: Mam dziesięć lat.
  ru.a1.unit03.lesson02.teach.kniga_genitive_plural:
    title: книг
    gloss: książek (dopełniacz liczby mnogiej, od 5)
    note: Forma dopełniacza liczby mnogiej od книга, używana od пять wzwyż — zwróć uwagę, że traci końcową samogłoskę, inaczej niż книги po два/три/четыре.
    example_gloss: Mam dziewięć książek.
  ru.a1.unit03.lesson02.teach.mne_let:
    title: Мне десять лет.
    gloss: Mam dziesięć lat.
    note: Wiek wyraża się po rosyjsku celownikiem мне („mnie”) plus liczebnik i лет (dopełniacz liczby mnogiej od „lata”); inaczej niż w polskim „mam dziesięć lat” nie ma tu czasownika „mieć”.
  ru.a1.unit03.lesson02.teach.skolko_vam_let:
    title: Сколько вам лет?
    gloss: Ile Pan/Pani ma lat?
    note: Używa formalnego celownika вам, zgodnie z rejestrem вы z Lekcji 2.
  ru.a1.unit03.lesson03.teach.skolko_stoit:
    title: Сколько это стоит?
    gloss: Ile to kosztuje?
    note: Standardowy sposób zapytania o cenę jednego przedmiotu; używa стоит („kosztuje”, liczba pojedyncza).
  ru.a1.unit03.lesson03.teach.skolko_stoyat:
    title: Сколько стоят яблоки?
    gloss: Ile kosztują jabłka?
    note: Używa стоят (liczba mnoga od „kosztować”), bo яблоки („jabłka”) są w liczbie mnogiej — inaczej niż стоит w Сколько это стоит?
  ru.a1.unit03.lesson03.teach.rubley:
    title: рубль, рубля, рублей
    gloss: rubel (1); ruble (2–4); rubli (od 5)
    note: 'Słowo „rubel” zmienia formę zależnie od liczebnika: рубль po jeden, рубля po два/три/четыре i рублей od пять wzwyż.'
    example_gloss:
    - To kosztuje jeden rubel.
    - To kosztuje dwa ruble.
    - To kosztuje pięć rubli.
  ru.a1.unit03.lesson03.teach.pokupatel_greeting:
    title: Klient wita się ze sprzedawcą
    gloss: 'Klient: Dzień dobry! Ile kosztują jabłka?'
    note: Klient przy straganie na targu grzecznie zaczyna od Здравствуйте, zanim zapyta o cenę.
  ru.a1.unit03.lesson03.teach.prodavets_apples:
    title: Sprzedawca odpowiada
    gloss: 'Sprzedawca: Trzy ruble.'
    note: Три рубля to forma dopełniacza liczby pojedynczej słowa „rubel” używana po liczebnikach 2–4, pasująca do три.
  ru.a1.unit03.lesson03.teach.pokupatel_bread:
    title: Klient pyta o chleb
    gloss: 'Klient: A ile kosztuje chleb?'
    note: Klient używa А („a”), by płynnie zadać kolejne pytanie o drugi towar.
  ru.a1.unit03.lesson03.teach.prodavets_bread:
    title: Sprzedawca znowu odpowiada
    gloss: 'Sprzedawca: Sześć rubli.'
    note: Шесть рублей to forma dopełniacza liczby mnogiej używana po liczebnikach od 5 wzwyż, pasująca do шесть.
  ru.a1.unit03.lesson03.teach.pokupatel_close:
    title: Klient uprzejmie kończy rozmowę
    gloss: 'Klient: Dobrze, dziękuję!'
    note: Хорошо, спасибо! kończy rozmowę na targu w miłym tonie, używając słownictwa z lekcji o powitaniach.
