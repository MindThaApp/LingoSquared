teaching:
  ru.a1.unit05.lesson01.teach.kotoryy_chas:
    title: Который час?
    gloss: Która jest godzina?
    note: Standardowy sposób zapytania o godzinę; dosłownie „która godzina”.
  ru.a1.unit05.lesson01.teach.seychas_chas:
    title: Сейчас час.
    gloss: Teraz jest pierwsza.
    note: Samo „час” oznacza „godzina pierwsza”. Po rosyjsku nie mówi się tu „один час”, inaczej niż we wzorze z liczebnikami od 2 wzwyż.
    example_gloss: Która jest godzina? — Pierwsza.
  ru.a1.unit05.lesson01.teach.dva_tri_chasa:
    title: два часа, три часа
    gloss: godzina druga, godzina trzecia
    note: Po два i три słowo час przyjmuje formę dopełniacza liczby pojedynczej часа, tak jak we wzorze liczebnik + rzeczownik z lekcji 3.
    example_gloss:
    - Teraz jest druga.
    - Teraz jest trzecia.
  ru.a1.unit05.lesson01.teach.pyat_desyat_chasov:
    title: пять часов, десять часов
    gloss: godzina piąta, godzina dziesiąta
    note: Od пять wzwyż słowo час przyjmuje formę dopełniacza liczby mnogiej часов, znów jak we wzorze od 5 wzwyż z lekcji 3.
    example_gloss:
    - Teraz jest piąta.
    - Teraz jest dziesiąta.
  ru.a1.unit05.lesson02.teach.v_kotorom_chasu:
    title: В котором часу?
    gloss: O której godzinie?
    note: Używane, gdy pytasz, kiedy coś się dzieje; Который час? pyta tylko o aktualną godzinę.
  ru.a1.unit05.lesson02.teach.utrom_dnem:
    title: утром, днём
    gloss: rano, w ciągu dnia
    note: To przysłówki utworzone od utро i день w narzędniku; używa się ich bez przyimka.
    example_gloss:
    - Rano piję kawę.
    - W ciągu dnia pracuję.
  ru.a1.unit05.lesson02.teach.vecherom_nochyu:
    title: вечером, ночью
    gloss: wieczorem, w nocy
    note: Ten sam wzorzec przysłówków w narzędniku co w утром/днём.
    example_gloss:
    - Wieczorem jestem w domu.
    - W nocy śpię.
  ru.a1.unit05.lesson02.teach.v_dva_chasa_dnya:
    title: В два часа дня.
    gloss: O drugiej po południu.
    note: Słowo дня (dopełniacz od день) po godzinie wyjaśnia, że chodzi o drugą po południu, a nie w nocy.
    example_gloss: O której jest spotkanie? — O drugiej po południu.
  ru.a1.unit05.lesson02.teach.v_sem_chasov_vechera:
    title: В семь часов вечера.
    gloss: O siódmej wieczorem.
    note: Słowo вечера (dopełniacz od вечер) wyjaśnia, że chodzi o siódmą wieczorem.
    example_gloss: Sklep zamykają o siódmej wieczorem.
  ru.a1.unit05.lesson03.teach.skazhite_pozhaluysta:
    title: Скажите, пожалуйста, который час?
    gloss: Przepraszam, czy może Pan/Pani powiedzieć, która jest godzina?
    note: Скажите, пожалуйста łagodzi pytanie; pasuje, gdy pytasz nieznajomą osobę.
  ru.a1.unit05.lesson03.teach.kogda_otkhodit:
    title: Когда отходит поезд?
    gloss: Kiedy odjeżdża pociąg?
    note: Отходит („odjeżdża”) to standardowy czasownik używany, gdy pociąg lub autobus rusza ze stacji.
  ru.a1.unit05.lesson03.teach.passazhir_vopros:
    title: Pasażer pyta o godzinę
    gloss: 'Pasażer: Przepraszam, czy może Pan powiedzieć, która jest godzina?'
    note: Pasażer zaczyna grzecznie od Скажите, пожалуйста, co pasuje przy zwracaniu się do pracownika dworca.
  ru.a1.unit05.lesson03.teach.kassir_sem:
    title: Kasjer odpowiada
    gloss: 'Kasjer: Jest siódma rano.'
    note: Сейчас семь часов утра podaje aktualną godzinę, a утра („rano”) ją doprecyzowuje.
  ru.a1.unit05.lesson03.teach.passazhir_kogda:
    title: Pasażer pyta o pociąg
    gloss: 'Pasażer: A kiedy odjeżdża pociąg?'
    note: А płynnie wprowadza kolejne pytanie pasażera.
  ru.a1.unit05.lesson03.teach.kassir_vosem:
    title: Kasjer podaje godzinę odjazdu
    gloss: 'Kasjer: O ósmej rano.'
    note: В восемь часов утра to odpowiedź z przyimkiem в, godziną i określeniem pory dnia.
