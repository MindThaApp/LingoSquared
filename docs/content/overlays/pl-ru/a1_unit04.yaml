teaching:
  ru.a1.unit04.lesson01.teach.kakoy_den:
    title: Какой сегодня день?
    gloss: Jaki dziś dzień?
    note: Какой zgadza się z rzeczownikiem rodzaju męskiego день („dzień”).
  ru.a1.unit04.lesson01.teach.ponedelnik_vtornik:
    title: понедельник, вторник
    gloss: poniedziałek, wtorek
    note: Dni tygodnia pisze się po rosyjsku małą literą – tak samo jak w polskim.
    example_gloss:
    - Dziś jest poniedziałek.
    - Dziś jest wtorek.
  ru.a1.unit04.lesson01.teach.sreda_chetverg:
    title: среда, четверг
    gloss: środa, czwartek
    note: Jak wszystkie rosyjskie nazwy dni tygodnia, среда i четверг piszemy małą literą – wielką tylko na początku zdania.
    example_gloss:
    - Dziś jest środa.
    - Dziś jest czwartek.
  ru.a1.unit04.lesson01.teach.pyatnitsa_subbota:
    title: пятница, суббота
    gloss: piątek, sobota
    note: W słowie суббота jest podwójne б – częsta pułapka ortograficzna.
    example_gloss:
    - Dziś jest piątek.
    - Dzisiaj jest sobota.
  ru.a1.unit04.lesson01.teach.voskresenye:
    title: воскресенье
    gloss: niedziela
    note: Ostatni dzień na rosyjskiej liście dni tygodnia.
    example_gloss: Dziś jest niedziela.
  ru.a1.unit04.lesson01.teach.segodnya:
    title: Сегодня ...
    gloss: Dziś jest ...
    note: Po Сегодня i nazwie dnia nie ma czasownika łączącego – po rosyjsku w czasie teraźniejszym nie mówi się „jest”, choć po polsku zwykle go używamy.
  ru.a1.unit04.lesson02.teach.kakoe_chislo:
    title: Какое сегодня число?
    gloss: Jaka jest dzisiaj data?
    note: Какое zgadza się z rzeczownikiem rodzaju nijakiego число („data/liczba”), inaczej niż какой w pytaniu o dzień.
  ru.a1.unit04.lesson02.teach.pervoe_tretye:
    title: первое, третье
    gloss: pierwszy, trzeci (data)
    note: Daty w liczebnikach porządkowych mają końcówkę rodzaju nijakiego (-ое/-ье), bo zgadzają się z domyślnym rzeczownikiem число.
    example_gloss:
    - Dziś jest pierwszy stycznia.
    - Dziś jest trzeci stycznia.
  ru.a1.unit04.lesson02.teach.pyatoe_desyatoe:
    title: пятое, десятое
    gloss: piąty, dziesiąty (data)
    note: Ten sam wzorzec rodzaju nijakiego co w przypadku первое/третье.
    example_gloss:
    - Dziś jest piąty października.
    - Dziś jest dziesiąty kwietnia.
  ru.a1.unit04.lesson02.teach.yanvar_aprel:
    title: января, апреля
    gloss: stycznia, kwietnia
    note: 'Po dacie nazwa miesiąca przyjmuje formę dopełniacza: январь zmienia się w января, a апрель w апреля.'
    example_gloss:
    - Dziś jest trzeci stycznia.
    - Dziś jest dziesiąty kwietnia.
  ru.a1.unit04.lesson02.teach.oktyabrya:
    title: октября
    gloss: października
    note: Dopełniacz od октябрь – ten sam wzorzec po dacie co w przypadku января/апреля.
    example_gloss: Dziś jest piąty października.
  ru.a1.unit04.lesson03.teach.kakoe_segodnya_chislo:
    title: Какое сегодня число?
    gloss: Jaka jest dzisiaj data?
    note: Standardowy sposób zapytania o datę.
  ru.a1.unit04.lesson03.teach.vo_vtornik:
    title: во вторник
    gloss: we wtorek
    note: 'Przyimek в przed вторник przyjmuje formę во dla łatwiejszej wymowy; samo вторник się nie zmienia (nazwy dni rodzaju żeńskiego tak: в среду, в пятницу, в субботу).'
  ru.a1.unit04.lesson03.teach.vstrecha:
    title: встреча
    gloss: spotkanie
    note: Zwykły rzeczownik oznaczający zaplanowane spotkanie.
    example_gloss: Spotkanie jest we wtorek.
  ru.a1.unit04.lesson03.teach.anna_kakoy_den:
    title: Anna pyta o dzień
    gloss: 'Anna: Jaki dziś jest dzień?'
    note: Anna zaczyna rozmowę pytaniem o день z lekcji 1.
  ru.a1.unit04.lesson03.teach.viktor_sreda:
    title: Wiktor odpowiada, podając dzień i datę
    gloss: 'Wiktor: Dziś jest środa, trzeci stycznia.'
    note: 'Wiktor podaje razem dzień tygodnia i datę w liczebniku porządkowym, z miesiącem w dopełniaczu: января.'
  ru.a1.unit04.lesson03.teach.anna_khorosho:
    title: Anna proponuje wtorek
    gloss: 'Anna: Dobrze. Spotkanie jest we wtorek?'
    note: Хорошо potwierdza odpowiedź Wiktora, zanim Anna zada kolejne pytanie.
  ru.a1.unit04.lesson03.teach.viktor_da:
    title: Wiktor potwierdza datę
    gloss: 'Wiktor: Tak, we wtorek, dziewiątego stycznia.'
    note: 'Да potwierdza, a potem Wiktor powtarza dzień i datę. Aby powiedzieć, KTÓREGO dnia coś się dzieje, sam liczebnik porządkowy przyjmuje dopełniacz: девятого января („dziewiątego stycznia”); porównaj Сегодня девятое января („Dziś jest dziewiąty stycznia”).'
