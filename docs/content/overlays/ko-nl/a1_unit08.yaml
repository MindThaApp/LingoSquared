    note: '*station*에는 *het*를 써요: *het station*. *supermarkt*는 한 단어로 쓰고 *de supermarkt*라고 해요. *bibliotheek*에는 *de*를 써요: *de bibliotheek*. *ziekenhuis*도 한 단어로 쓰고 *het ziekenhuis*라고 해요.'
