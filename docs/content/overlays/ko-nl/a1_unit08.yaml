    note: '*Naast*는 어떤 것이 다른 것 바로 옆에 있다는 뜻이에요. *Tegenover*는 두 장소가 서로 마주 보고 있다는 뜻이며, 흔히 길이나 탁 트인 공간을 사이에 두고 쓰여요.'
    example_gloss:
    - 은행은 슈퍼마켓 옆에 있어요.
