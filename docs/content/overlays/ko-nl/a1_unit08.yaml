    example_gloss:
    - 은행은 슈퍼마켓 옆에 있어요.
    - 우체국은 도서관과 병원 사이에 있어요.
    - 버스 정류장은 역 앞에 있어요.
  nl.a1.unit08.lesson02.teach.naast_tegenover:
    title: 옆에, 맞은편에
