    gloss: 그의 / 그녀의
    note: '*Zijn*은 *mijn*, *je*, *jouw*처럼 늘 같은 형태예요. *Haar*도 늘 같은 형태예요.'
    example_gloss:
    - 이분은 그의 아버지예요.
    - 저분은 그녀의 어머니예요.
  nl.a1.unit05.lesson04.teach.zijn_haar_note:
    title: Zijn과 haar의 차이
    gloss: zijn = 그의, haar = 그녀의
    note: '이 예문들에서는 소유하는 사람이 남자이면 *zijn*, 여자이면 *haar*를 골라요. 뒤에 오는 가족 단어는 선택에 영향을 주지 않아요: *zijn vader*와 *zijn moeder*, *haar vader*와 *haar moeder*.'
    target_text: zijn = 그의, haar = 그녀의. 뒤에 오는 명사와 상관없이 형태가 변하지 않아요.
  nl.a1.unit05.lesson04.teach.dit_is_zijn_vader:
