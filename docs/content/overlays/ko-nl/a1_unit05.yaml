    example_gloss:
    - 저희 부모님은 위트레흐트에 사세요.
    - 저는 남자 형제가 한 명 있어요.
    - 저는 여자 형제가 한 명 있어요.
  nl.a1.unit05.lesson01.teach.kind_kinderen:
    title: 아이와 아이들
    gloss: 아이 / 아이들
    note: '*Kind*는 het 명사예요: *het kind*. 복수형 *kinderen*은 단수 *kind*가 *het*를 쓰는데도 *de*를 써요.'
    example_gloss:
