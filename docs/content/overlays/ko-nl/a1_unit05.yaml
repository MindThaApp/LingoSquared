    title: 형제자매가 있어요?
    gloss: '로테: 오마르, 형제나 자매가 있어요? 오마르: 네, 여동생이 두 명 있어요. 남자 형제는 없어요. 로테는요? 로테: 저는 남자 형제 한 명과 여자 형제 한 명이 있어요.'
    note: '*Broers of zussen* — 복수형을 써서 ''형제나 자매''라는 뜻이에요.'
  nl.a1.unit05.lesson06.teach.lines05_08:
    title: 당신의 부모님도 네덜란드에 사세요?
    gloss: '오마르: 부모님도 네덜란드에 사세요? 로테: 네, 저희 부모님은 위트레흐트에 사세요. 오마르의 가족은요? 오마르: 부모님은 이집트에 사시는데, 삼촌은 여기 암스테르담에 사세요.'
    note: '*Wonen ook in* — ''~에도 살다''라는 뜻으로, 다른 사람도 같은지 물을 때 써요.'
  nl.a1.unit05.lesson06.teach.lines09_10:
    title: 그분을 자주 만나요?
    gloss: '로테: 좋네요! 그분을 자주 만나요? 오마르: 네, 매달 만나요.'
    note: '*Zie je hem vaak?* — 얼마나 자주 만나는지 물을 때 쓰는 자연스럽고 흔한 표현이에요.'
