  nl.a1.unit05.lesson05.teach.sander_fenna_jan_marieke:
    title: '가족 이름: Sander, Fenna, Jan, Marieke'
    gloss: 산더(네덜란드 남자 이름) / 페나(네덜란드 여자 이름) / 얀(네덜란드 남자 이름) / 마리케(네덜란드 여자 이름)
    note: 네 개 모두 흔한 네덜란드 이름이에요. Sander와 Jan은 남자 이름이고, Fenna와 Marieke는 여자 이름이에요.
    example_gloss:
    - 제 남자 형제는 이름이 산더예요.
    - 제 여자 형제는 이름이 페나예요.
