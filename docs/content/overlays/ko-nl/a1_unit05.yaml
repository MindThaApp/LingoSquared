    gloss: 제 이름은 로테예요. 저는 남자 형제 한 명과 여자 형제 한 명이 있어요. 제 남자 형제는 이름이 산더이고 여자 형제는 이름이 페나예요. 제 아버지는 이름이 얀이시고 어머니는 이름이 마리케세요. 제 할아버지와 할머니는 로테르담에 사세요.
    note: 로테가 자기 가족을 짧게 소개하는 말이에요. 이 단원의 앞 수업에서 나온 어휘를 다시 사용해요.
