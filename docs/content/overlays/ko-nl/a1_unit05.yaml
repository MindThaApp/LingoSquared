  nl.a1.unit05.lesson02.teach.oom_tante_sentence:
    title: 제 삼촌과 숙모에게는 아이가 두 명 있어요
    gloss: 제 삼촌과 숙모에게는 아이가 두 명 있어요.
    note: '*oom en tante*는 두 사람이므로 *hebben*을 써요.'
  nl.a1.unit05.lesson03.teach.mijn_je_jouw:
    title: 나의, 너의 (강조하지 않을 때와 강조할 때)
    gloss: 나의 / 너의(강조하지 않을 때) / 너의(강조할 때)
    note: '*Mijn*은 de 명사 앞이든 het 명사 앞이든, 단수든 복수든 늘 같은 형태예요. *Je*는 누구의 것인지 강조하지 않을 때 쓰는 일반적인 친근한 표현이고, 모든 명사 앞에서 형태가 같아요. *Jouw*는 *je*보다 강한 표현이라서, 한 사람의 가족과 다른 사람의 가족을 대조할 때 꼭 필요해요. 이것도 모든 명사 앞에서 형태가 같아요.'
    example_gloss:
    - 이 사람은 제 남자 형제예요.
    - 이 사람은 당신의 여동생이에요?
    - 저 사람은 당신의 여동생이에요?
  nl.a1.unit05.lesson03.teach.je_jouw_note:
    title: Je와 jouw의 차이
    gloss: je와 jouw는 둘 다 친근한 '너의'를 뜻해요
    note: 특별히 강조하지 않을 때는 *je*를 써요. 누구의 것인지 강조할 때, 특히 대조할 때는 *jouw*를 써요. 대조하지 않을 때도 *jouw*를 쓸 수 있지만, 그럴 때는 *je*가 더 일반적이에요.
    target_text: je와 jouw는 둘 다 친근한 사이에서 쓰는 '너의'를 뜻해요. 강조하지 않을 때는 보통 je를 쓰고, jouw는 더 강하게 말하거나 대조할 때 써요. 둘 다 어떤 명사 앞에서도 형태가 같아요.
  nl.a1.unit05.lesson03.teach.dit_is_mijn_broer:
    title: 이쪽은 제 남자 형제예요
    gloss: 이 사람은 제 남자 형제예요.
    note: '*Dit is ...*는 가까이 있는 사람을 소개할 때 써요.'
  nl.a1.unit05.lesson03.teach.is_dat_jouw_zus:
    title: 저 사람은 네 여자 형제야?
    gloss: 저 사람은 네 여자 형제야?
    note: '*Dat is ...*는 멀리 있거나 이미 이야기에 나온 사람을 가리킬 때 써요.'
  nl.a1.unit05.lesson04.teach.zijn_haar:
