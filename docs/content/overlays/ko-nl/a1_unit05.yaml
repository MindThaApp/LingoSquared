  nl.a1.unit05.lesson01.teach.have_sentence:
    title: 저는 남자 형제 한 명과 여자 형제 한 명이 있어요
    gloss: 저는 남자 형제 한 명과 여자 형제 한 명이 있어요.
    note: '*Ik heb ...*는 어떤 가족이 있는지 말할 때 쓰는 기본 표현이에요.'
  nl.a1.unit05.lesson02.teach.opa_oma_oom_tante:
    title: 할아버지, 할머니, 삼촌, 이모·고모·숙모
    gloss: 할아버지 / 할머니 / 삼촌 / 이모·고모·숙모
    note: '*Opa*는 할아버지를 부르는 일상적인 말이고, *grootvader*는 더 격식 있는 문어체예요. *Oma*는 할머니를 부르는 일상적인 말이고, *grootmoeder*는 더 격식 있는 문어체예요. *De oom*. *De tante*.'
    example_gloss:
    - 제 할아버지와 할머니는 로테르담에 사세요.
    - 제 할머니는 아흔아홉 살이세요.
    - 제 삼촌은 암스테르담에 사세요.
    - 제 삼촌과 숙모에게는 아이가 두 명 있어요.
  nl.a1.unit05.lesson02.teach.neef_nicht_note:
    title: 사촌과 조카를 부르는 말은 뜻이 두 가지예요
    gloss: neef = 사촌(남) 또는 조카(남), nicht = 사촌(여) 또는 조카(여)
    note: 네덜란드어는 사촌과 조카를 서로 다른 단어로 나누지 않아요. 어느 쪽인지는 문맥으로 알 수 있어요. 이번 단원의 문제에는 나오지 않지만, 나중에 알아볼 수 있도록 여기에 적어 두었어요.
    target_text: neef = 남자 사촌 또는 남자 조카; nicht = 여자 사촌 또는 여자 조카
  nl.a1.unit05.lesson02.teach.gezin:
    title: 가족(함께 사는 식구)
    gloss: 가족(함께 사는 식구)
    note: '*Gezin*은 함께 사는 가족(보통 부모와 자녀)을 가리키고, *familie*는 친척을 포함한 더 넓은 의미의 가족을 가리켜요.'
    example_gloss: 우리 가족은 위트레흐트에 살아요.
  nl.a1.unit05.lesson02.teach.opa_oma_sentence:
    title: 제 조부모님은 로테르담에 사세요
    gloss: 제 할아버지와 할머니는 로테르담에 사세요.
