teaching:
  nl.a1.unit18.lesson01.teach.appartement_woonkamer_slaapkamer:
    title: 아파트, 거실, 침실
    gloss: 아파트, 거실, 침실
    note: '*Het appartement*은 중성 명사이고, *de woonkamer*와 *de slaapkamer*는 통성 명사예요.'
    example_gloss:
    - 저는 아파트가 있어요.
    - 저는 거실이 있어요.
    - 저는 침실이 있어요.
  nl.a1.unit18.lesson01.teach.keuken_badkamer:
    title: 부엌, 욕실
    gloss: 부엌, 욕실
    note: '*De keuken*과 *de badkamer*는 둘 다 통성 명사예요.'
    example_gloss:
    - 저는 부엌이 있어요.
    - 저는 욕실이 있어요.
  nl.a1.unit18.lesson01.teach.appartement_utrecht:
    title: 아파트가 있다고 말하기
    gloss: 저는 아파트가 있어요.
    note: '*Hebben*(가지다)은 어떤 집에 사는지 말할 때 쓰는 자연스러운 동사예요. 이것은 일반적인 예문이고, 오마르의 구체적인 아파트(위트레흐트)는 이 단원 뒤에서 나와요.'
  nl.a1.unit18.lesson01.teach.rooms_list:
    title: 모든 방 말하기
    gloss: 저는 거실, 침실, 부엌, 욕실이 있어요.
    note: 이 수업의 방 어휘 네 개를 한 문장에 모두 넣고, 쉼표로 이은 뒤 마지막에 *en*을 붙인 문장이에요.
  nl.a1.unit18.lesson02.teach.hoeveel_kamers:
    title: 방이 몇 개인지 묻기
    gloss: 방이 몇 개예요?
    note: '*Hoeveel*(몇 개/얼마나)은 앞선 숫자 수업에서 배운 수량 질문 형태를 다시 써요.'
  nl.a1.unit18.lesson02.teach.twee_slaapkamers:
    title: 방 개수 말하기
    gloss: 저는 침실이 두 개 있어요.
    note: '*Slaapkamers*는 *slaapkamer*의 복수형이고, 규칙적으로 -s를 붙여 만들어요.'
  nl.a1.unit18.lesson02.teach.drie_kamers:
    title: 전체 방 개수 말하기
    gloss: 이 아파트는 방이 세 개예요.
    note: '*Kamers*는 침실에 한정되지 않고 방 전반을 가리키는 말이에요.'
  nl.a1.unit18.lesson03.teach.balkon_tuin:
    title: 발코니, 정원
    gloss: 발코니, 정원
    note: '*Het balkon*은 중성 명사이고, *de tuin*은 통성 명사예요.'
    example_gloss:
    - 발코니가 있어요.
    - 정원이 없어요.
  nl.a1.unit18.lesson03.teach.er_is_balkon:
    title: 무언가 있다고 말하기
    gloss: 발코니가 있어요.
    note: '*Er is*는 무언가가 있다고 말할 때 쓰는 네덜란드어의 기본 존재 표현이에요.'
  nl.a1.unit18.lesson03.teach.geen_tuin:
    title: 무언가 없다고 말하기
    gloss: 정원이 없어요.
    note: '*Geen*은 부정관사가 붙는 명사를 부정해요. *niet een tuin*이 아니라 *geen tuin*이라고 해요.'
  nl.a1.unit18.lesson04.teach.gezellig:
    title: 아늑한
    gloss: 아늑한
    note: 따뜻하고 아늑한 분위기를 나타내는, 네덜란드어다운 아주 흔한 형용사예요. 한 단어로 딱 맞게 옮길 수 있는 말은 없어요.
    example_gloss: 아파트는 작지만 아늑해요.
  nl.a1.unit18.lesson04.teach.klein_maar_gezellig:
    title: 자주 쓰는 묘사 패턴
    gloss: 아파트는 작지만 아늑해요.
    note: '*Klein maar gezellig*는 네덜란드 사람들이 작은 집을 긍정적으로 표현할 때 아주 흔히 쓰는 자연스러운 말이에요.'
  nl.a1.unit18.lesson04.teach.woonkamer_groot:
    title: 방 크기 묘사하기
    gloss: 거실이 커요.
    note: '*Groot*는 집 전체가 아니라 특정한 방을 설명하고 있어요.'
  nl.a1.unit18.lesson04.teach.keuken_klein:
    title: 다른 방의 크기 묘사하기
    gloss: 부엌이 작아요.
    note: 앞 카드의 *groot*와 같은 형태인데, 다른 방에 *klein*을 쓴 거예요.
  nl.a1.unit18.lesson05.teach.advertentie:
    title: 주택 광고 읽기
    gloss: '위트레흐트의 아파트: 침실 한 개, 거실, 부엌, 욕실. 발코니는 있지만 정원은 없어요. 아파트는 작지만 아늑해요.'
    note: 방 개수, 있는 시설과 없는 시설, 전체적인 인상을 따라가며 읽어 보세요.
    glosses:
      Appartement: 아파트
      slaapkamer: 침실
      woonkamer: 거실
      keuken: 부엌
      badkamer: 욕실
      balkon: 발코니
      tuin: 정원
      klein: 작은
      gezellig: 아늑한
  nl.a1.unit18.lesson06.teach.lotte_ask:
    title: 로터가 아파트에 대해 물어봐요
    gloss: '로터: 안녕 오마르, 위트레흐트의 새 아파트는 어때?'
    note: '*Nieuwe*는 *nieuw*(새)의 어미 변화형으로, 명사 앞에 쓰여요.'
  nl.a1.unit18.lesson06.teach.omar_describe:
    title: 오마르가 설명해요
    gloss: '오마르: 작지만 아늑해. 침실 한 개, 거실, 부엌, 욕실이 있어.'
    note: 앞서 읽기에서 본 주택 광고와 똑같아요. 이것이 오마르의 실제 아파트예요.
  nl.a1.unit18.lesson06.teach.lotte_ask_balcony:
    title: 로터가 발코니에 대해 물어봐요
    gloss: '로터: 발코니 있어?'
    note: 앞선 단원에서 배운 *heb je ...?*를 다시 쓴 직접적인 예/아니요 질문이에요.
  nl.a1.unit18.lesson06.teach.omar_balcony_answer:
    title: 오마르가 대답해요
    gloss: '오마르: 응, 발코니는 있는데 정원은 없어.'
    note: 앞의 광고에 나온 발코니는 있고 정원은 없다는 내용과 같아요.
  nl.a1.unit18.lesson06.teach.hij_pronoun_note:
    title: 오마르 대신 hij 쓰기
    gloss: 'Omar 대신 hij라고 말할 수도 있어요: 그는 발코니가 있어요.'
    note: 대화에서 이미 오마르가 소개되었다면, *hij*(그)가 오마르의 이름을 대신할 수 있어요.
  nl.a1.unit18.lesson06.teach.lotte_reaction:
    title: 로터가 반갑게 반응해요
    gloss: '로터: 좋겠다! 조만간 한번 놀러 갈게.'
    note: '*Komen langs*(들르다/방문하다)는 분리동사예요. *langs*는 절의 맨 끝으로 가요.'
  nl.a1.unit18.lesson06.teach.omar_welcome:
    title: 오마르가 환영해요
    gloss: '오마르: 좋아, 언제든 환영이야.'
    note: '*Altijd welkom*은 상대를 다시 초대할 때 쓰는 따뜻하고 자연스러운 표현이에요.'
