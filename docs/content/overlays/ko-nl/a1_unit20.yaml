teaching:
  nl.a1.unit20.lesson01.teach.jas_trui:
    title: 코트, 스웨터
    gloss: 코트, 스웨터
    note: '*De jas*와 *de trui*는 둘 다 통성 명사예요.'
    example_gloss:
    - 저는 코트를 찾고 있어요.
    - 저는 스웨터가 있어요.
  nl.a1.unit20.lesson01.teach.broek_schoenen:
    title: 바지, 신발
    gloss: 바지, 신발
    note: '*Broek*은 네덜란드어에서 단수로 써요. 바지 한 벌은 *een broek*이고 *broeken*이 아니에요. *Schoenen*은 *schoen*의 복수형이며, 신발은 거의 항상 복수형으로 말해요.'
    example_gloss:
    - 저는 바지를 찾고 있어요.
    - 저는 신발을 찾고 있어요.
  nl.a1.unit20.lesson01.teach.zoek_jas:
    title: 찾는 물건 말하기
    gloss: 저는 코트를 찾고 있어요.
    note: '*Zoeken*(찾다)은 여기서 전치사 없이 목적어를 바로 써요. (*zoeken naar*도 있지만, 목적어를 바로 쓰는 형태가 가장 간단해요.)'
  nl.a1.unit20.lesson02.teach.maat:
    title: 사이즈
    gloss: 사이즈
    note: '통성 명사예요: *de maat*.'
    example_gloss: 사이즈가 어떻게 되세요?
  nl.a1.unit20.lesson02.teach.welke_maat:
    title: 사이즈 묻기
    gloss: 사이즈가 어떻게 되세요?
    note: '*Welke*(어느)를 쓰는 이유는 *maat*에 대한 예상 답이 S, M, L이나 숫자처럼 몇 가지로 정해져 있기 때문이에요.'
  nl.a1.unit20.lesson02.teach.heb_maat_m:
    title: 내 사이즈 말하기
    gloss: 저는 M 사이즈예요.
    note: 사이즈를 말할 때 네덜란드어는 *hebben*(가지다)을 써요. 한국어에서는 'M 사이즈예요'처럼 '이다'를 쓰지만, 네덜란드어는 Ik heb maat M처럼 hebben을 써요.
  nl.a1.unit20.lesson03.teach.zwart_blauw:
    title: 검은색, 파란색
    gloss: 검은색, 파란색
    note: 이번 수업에 나오는 기본 색깔 형용사 두 개예요.
    example_gloss:
    - 검은색 코트로 할게요.
    - 이것도 파란색이 있나요?
  nl.a1.unit20.lesson03.teach.wil_in_zwart:
    title: 색상 요청하기
    gloss: 검은색 코트로 할게요.
    note: '*In het* + 색은 옷을 주문하거나 요청할 때 색을 말하는 기본 방식이에요.'
  nl.a1.unit20.lesson03.teach.ook_in_blauw:
    title: 다른 색상 묻기
    gloss: 이것도 파란색이 있나요?
    note: '*Ook*(도)은 다른 색이 있는지 묻는 말이고, 여기서는 공손한 *u*를 쓰고 있어요.'
  nl.a1.unit20.lesson04.teach.past_deze_jas:
    title: 잘 맞는지 묻기
    gloss: 이 코트 잘 맞아?
    note: '*Passen*(맞다)은 옷이 몸에 맞는지 말할 때 쓰는 자연스러운 동사예요. ''입어 보다''를 뜻하는 *passen*과는 의미가 달라요.'
  nl.a1.unit20.lesson04.teach.past_goed:
    title: 잘 맞는다고 확인하기
    gloss: 잘 맞아요.
    note: '*Goed*(잘)는 옷이 어떻게 맞는지를 나타내요.'
  nl.a1.unit20.lesson04.teach.te_klein:
    title: 너무 작아요
    gloss: 너무 작아요.
    note: '*Te*(너무)는 형용사 앞에 와서 정도가 지나침을 나타내요.'
  nl.a1.unit20.lesson04.teach.te_groot:
    title: 너무 커요
    gloss: 너무 커요.
    note: 앞 카드의 *te klein*과 같은 *te* + 형용사 패턴이에요.
  nl.a1.unit20.lesson05.teach.negentig:
    title: 구십, 아흔
    gloss: 구십
    note: '*Negentig*는 숫자 90이고, 여기서는 코트의 가격에 쓰였어요.'
    example_gloss: 코트는 90유로예요.
  nl.a1.unit20.lesson05.teach.kost_negentig:
    title: 가격 말하기
    gloss: 코트는 90유로예요.
    note: '*Kost*는 *kosten*(값이 ~이다)의 3인칭 단수형이에요.'
  nl.a1.unit20.lesson05.teach.bonnetje:
    title: 매장 영수증 읽기
    gloss: '겨울 코트: 사이즈 M, 색상 검은색. 가격: 90유로. 이 코트는 잘 맞고 따뜻해요.'
    note: 사이즈, 색상, 가격, 그리고 코트에 대해 언급된 두 가지 장점을 찾아보세요.
    glosses:
      Winterjas: 겨울 코트
      maat: 사이즈
      kleur: 색
      zwart: 검은색
      Prijs: 가격
      negentig: '90'
      euro: 유로
      jas: 코트
      past: 맞아요
      warm: 따뜻한
  nl.a1.unit20.lesson06.teach.lotte_notice:
    title: Lotte가 코트를 보고 말해요
    gloss: 'Lotte: 이 코트 예쁘네요! 사이즈가 어떻게 돼요?'
    note: '*Mooi*(예쁘다, 좋다)는 이전 단원에서도 썼던 일반적인 긍정 반응이에요.'
  nl.a1.unit20.lesson06.teach.omar_ask_try:
    title: Omar가 입어 봐도 되는지 물어요
    gloss: 'Omar: 저는 M 사이즈예요. 입어 봐도 될까요?'
    note: '*Mag ik ...?*(~해도 될까요?)는 허락을 구할 때 쓰는 기본적인 공손한 표현이에요. 여기서 *passen*은 ''맞다''가 아니라 ''입어 보다''라는 뜻이에요.'
  nl.a1.unit20.lesson06.teach.lotte_ask_fit:
    title: Lotte가 잘 맞는지 물어요
    gloss: 'Lotte: 물론이죠. 잘 맞아요?'
    note: '*Hij*(그, 그것)는 통성 명사인 *de jas*를 가리켜요.'
  nl.a1.unit20.lesson06.teach.omar_confirm_fit:
    title: Omar가 확인해 줘요
    gloss: 'Omar: 네, 잘 맞고 따뜻해요.'
    note: 앞서 읽은 영수증의 내용과 똑같아요. 같은 코트예요.
  nl.a1.unit20.lesson06.teach.lotte_ask_color:
    title: Lotte가 색을 물어요
    gloss: 'Lotte: 잘됐네요! 검은색으로 할래요, 파란색으로 할래요?'
    note: '*Wil je... of...?*는 13단원 선호 표현 수업에서 나온 선택을 묻는 패턴을 다시 쓴 거예요.'
  nl.a1.unit20.lesson06.teach.omar_choose_black:
    title: Omar가 결정해요
    gloss: 'Omar: 검은색으로 할게요.'
    note: '*Nemen*(가지다)은 구매를 확정할 때 쓰는 자연스러운 동사이고, 영수증에 적힌 색과도 맞아요.'
  nl.a1.unit20.lesson06.teach.neemt_form:
    title: Neem과 neemt의 차이
    gloss: Neem은 nemen(가지다, 사다)의 ik 형태이고, neemt는 hij 또는 zij 형태예요.
    note: '규칙적인 현재형 패턴이에요: *ik neem, jij/hij/zij neemt*.'
