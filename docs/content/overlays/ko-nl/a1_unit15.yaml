teaching:
  nl.a1.unit15.lesson01.teach.kaartje:
    title: 입장권
    gloss: 그 입장권
    note: '*Het kaartje*는 중성 명사라서 *de*가 아니라 *het*를 써요.'
    example_gloss: 우트레흐트행 표를 한 장 주세요.
  nl.a1.unit15.lesson01.teach.wil_graag:
    title: 표 요청하기
    gloss: 우트레흐트행 표를 한 장 주세요.
    note: '*Wil graag*는 요청을 부드럽게 해 주는 표현으로, 6단원에서 음식을 주문할 때 쓴 것과 같은 패턴이에요.'
  nl.a1.unit15.lesson01.teach.enkele_of_retour:
    title: 직원이 표 종류를 물어봐요
    gloss: 편도로 드릴까요, 왕복으로 드릴까요?
    note: '*Wilt u*는 *willen*의 격식체 2인칭 형태로, 모르는 역 직원에게 말할 때 써요.'
  nl.a1.unit15.lesson01.teach.retour_alstublieft:
    title: 공손하게 대답하기
    gloss: 왕복으로 주세요.
    note: '*Alstublieft*는 격식을 갖춘 부탁 표현으로, 대화의 *u* 격식에 맞아요.'
  nl.a1.unit15.lesson01.teach.register_note:
    title: 창구에서 쓰는 말투
    gloss: 매표소에서는 보통 정중한 형태인 u를 써요.
    note: 1단원에서 배운 *jij*/*je*와 *u*의 구분이 이어져요. 서비스 업무를 하는 낯선 사람에게는 기본적으로 *u*를 써요.
  nl.a1.unit15.lesson02.teach.perron:
    title: 승강장
    gloss: 승강장
    note: '*Het perron*은 중성이라서 *de*가 아니라 *het*를 써요.'
    example_gloss: 우트레흐트행 기차는 어느 승강장에서 출발해요?
  nl.a1.unit15.lesson02.teach.welk_perron:
    title: 승강장 묻기
    gloss: 우트레흐트행 기차는 어느 승강장에서 출발해요?
    note: '*Van welk perron*은 일반적인 장소가 아니라 승강장을 콕 집어 물을 때 써요.'
  nl.a1.unit15.lesson02.teach.vertrektijd:
    title: 출발 정보 말하기
    gloss: 기차는 10시 15분 전에 5번 승강장에서 출발해요.
    note: '*Kwart voor tien*은 4단원에서 배운 시각 표현 패턴을 다시 쓴 거예요.'
  nl.a1.unit15.lesson02.teach.hoe_laat_aan:
    title: 도착 시각 묻기
    gloss: 기차는 몇 시에 도착해요?
    note: '*Komt ... aan*은 분리동사(*aankomen*)예요. *aan*이 질문 맨 끝으로 가요.'
  nl.a1.unit15.lesson02.teach.aankomsttijd:
    title: 도착 시각 말하기
    gloss: 기차는 11시에 도착해요.
    note: '*Komt aan*에서도 분리동사의 두 부분이 문장 안에서 떨어져 있는 것을 볼 수 있어요.'
  nl.a1.unit15.lesson03.teach.op_tijd_de_vertraging:
    title: 제시간에 / 연착
    gloss: 제시간에; 연착
    note: '*Op tijd*는 예정대로 일어나는 일을 나타내는 고정 표현이에요. *De vertraging*(지연)은 de를 쓰는 명사예요.'
    example_gloss:
    - 기차가 제시간에 출발하지 않아요.
    - 안내 말씀드립니다. 우트레흐트행 기차가 지연되고 있어요.
  nl.a1.unit15.lesson03.teach.let_op:
    title: 안내 방송
    gloss: 안내 말씀드립니다. 우트레흐트행 기차가 지연되고 있어요.
    note: '*Let op*(직역하면 ''주의하세요'')은 역 안내 방송을 시작할 때 쓰는 말로, 한국어의 ''안내 말씀드립니다''와 비슷해요.'
  nl.a1.unit15.lesson03.teach.niet_op_tijd:
    title: '"제시간에" 부정하기'
    gloss: 기차가 제시간에 출발하지 않아요.
    note: '*Niet*은 *op tijd* 바로 앞에 와서 표현 전체를 부정해요.'
  nl.a1.unit15.lesson03.teach.ander_perron:
    title: 승강장 변경
    gloss: 기차는 5번 승강장이 아니라 3번 승강장에서 출발해요.
    note: '*In plaats van*은 ''~ 대신에''라는 뜻이에요.'
  nl.a1.unit15.lesson03.teach.tien_minuten_vertraging:
    title: 연착 시간 말하기
    gloss: 기차가 10분 연착되고 있어요.
    note: '*Heeft vertraging*(직역하면 ''지연을 가지고 있다'')은 지연되었다고 말하는 자연스러운 방식이고, 형용사 *vertraagd*도 쓸 수 있어요.'
  nl.a1.unit15.lesson04.teach.ingang_uitgang_wachtruimte:
    title: 입구, 출구, 대합실
    gloss: 입구; 출구; 대합실
    note: '*De ingang*, *de uitgang*, *de wachtruimte*는 모두 de를 쓰는 명사예요.'
    example_gloss:
    - 입구가 어디예요?
    - 출구가 어디예요?
    - 대합실이 어디예요?
  nl.a1.unit15.lesson04.teach.waar_perron_zeven:
    title: 승강장 위치 묻기
    gloss: 7번 승강장은 어디예요?
    note: 9단원 길 안내 수업에서 배운 *Waar is...?* 패턴을 다시 쓴 거예요.
  nl.a1.unit15.lesson04.teach.rechtdoor_rechts:
    title: 길 알려 주기
    gloss: 쭉 직진하신 다음 오른쪽으로 가세요.
    note: '*Rechtdoor*와 *rechts*는 9단원에서 배운 방향 단어와 같고, 여기서는 역 상황에서 다시 쓰였어요.'
  nl.a1.unit15.lesson04.teach.waar_wachtruimte:
    title: 대합실 묻기
    gloss: 대합실이 어디예요?
    note: 같은 질문 표현을 새로운 장소에 적용한 거예요.
  nl.a1.unit15.lesson05.teach.kaartje_tekst:
    title: 인쇄된 표 읽기
    gloss: '표: 암스테르담 중앙역 → 우트레흐트 중앙역. 출발: 10시 10분, 7번 승강장. 도착: 10시 50분. 왕복. 가격: 12유로 40센트.'
    note: 출발 시각과 승강장, 도착 시각, 표의 종류, 가격을 확인해 보세요.
    glosses:
      Kaartje: 입장권
      Vertrek: 출발
      tien: 열
      perron: 승강장
      zeven: 일곱, 7
      Aankomst: 도착
      elf: '11'
      Retour: 왕복 표
      Prijs: 가격
      twaalf: '12'
      euro: 유로
      veertig: 마흔
  nl.a1.unit15.lesson06.teach.omar_open:
    title: 오마르가 계획을 말해요
    gloss: '오마르: 우리 7번 승강장으로 가야 해요. 기차는 10시 10분에 출발해요.'
    note: '*Moeten*(~해야 하다)은 여기서 엄격한 의무가 아니라 현실적으로 필요하다는 뜻이에요.'
  nl.a1.unit15.lesson06.teach.lotte_sign:
    title: 로테가 안내판을 읽어요
    gloss: '로테: 봐요, 저기 안내판이 있어요. 지연, 10분.'
    note: '*Daar staat*(직역하면 ''저기 서 있다'')은 안내판에 무언가 표시되어 있다고 말할 때 쓰는 자연스러운 표현이에요.'
  nl.a1.unit15.lesson06.teach.omar_coffee:
    title: 오마르는 침착해요
    gloss: '오마르: 문제없어요, 커피 마실 시간은 아직 있어요.'
    note: '*Geen probleem*은 흔히 쓰는 편한 안심 표현이에요.'
  nl.a1.unit15.lesson06.teach.lotte_train_arrives:
    title: 기차가 도착해요
    gloss: '로테: 좋은 생각이에요. 어, 벌써 기차가 저기 왔네요. 7번 승강장, 딱 맞아요!'
    note: '*Al*(벌써)은 방금 지연 안내가 나왔는데도 기차가 예상보다 일찍 왔다는 느낌을 줘요.'
  nl.a1.unit15.lesson06.teach.omar_board:
    title: 기차에 올라타요
    gloss: '오마르: 자, 타요. 우트레흐트, 우리가 간다!'
    note: '*Stappen in*(탑승하다)은 분리동사로, *in*이 절 끝으로 가요. *We komen eraan*(직역하면 ''우리는 거기에 오고 있다'')은 ''우리가 간다''에 해당하는 자연스러운 네덜란드어 표현이라, 한 단어씩 옮기면 어색해요.'
