      - left: 할아버지는 나이가 많으세요.
        right: 할아버지는 나이가 많으세요.
      status: correct
    feedback: Lang/klein/oud/jong은 키와 나이에 대한 일반적인 인상을 나타내는 말이에요.
    pairs:
    - left: lang
      right: 키가 큰
    - left: klein
      right: 키가 작은
    - left: oud
      right: 나이가 많은
    - left: jong
      right: 젊은
    - left: 페나는 키가 커요.
      right: Fenna는 키가 커요.
    - left: 산더는 키가 작아요.
      right: Sander는 키가 작아요.
    - left: 할아버지는 나이가 많으세요.
      right: 할아버지는 나이가 많으세요.
    localize_pair_lefts: 'yes'
  nl.a1.unit30.lesson01.exercise04.order_fenna_sander:
    instruction: 단어를 알맞은 순서로 놓아 'Fenna는 키가 크고 Sander는 키가 작아요.'라고 말해 보세요.
    correct_option: Fenna is lang en Sander is klein
    accepted_answers:
    - value: Fenna is lang en Sander is klein
      status: correct
    feedback: 맞아요! Fenna is lang en Sander is klein.은 "페나는 키가 크고 산더르는 키가 작아요."라는 뜻이에요.
  nl.a1.unit30.lesson01.exercise05.listen_order_opa_oud:
    instruction: 들리는 순서대로 단어를 배열하세요.
    correct_option: Opa is oud
    accepted_answers:
    - value: Opa is oud
      status: correct
    feedback: 완성된 문장은 Opa is oud예요.
  nl.a1.unit30.lesson01.exercise06.translate_young:
    instruction: '네덜란드어로 번역하세요: 젊은.'
    accepted_answers:
    - value: jong
      status: correct
    feedback: Jong은 '젊은, 어린'이라는 뜻이에요.
    prompt_blocks:
    - 젊은
  nl.a1.unit30.lesson02.exercise01.choose_lotte_haar:
    instruction: '''Lotte heeft lang blond haar.''의 뜻을 고르세요.'
    correct_option: Lotte는 긴 금발이에요.
    distractors:
    - Lotte는 짧은 검은 머리예요.
    - Lotte는 긴 갈색 머리예요.
    - Lotte는 회색 머리예요.
    accepted_answers:
    - value: Lotte는 긴 금발이에요.
