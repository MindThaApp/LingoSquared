course:
  title: 네덜란드어 A1
  description: '사람의 기본적인 외모를 묘사하는 초급 네덜란드어: 키와 나이 인상, 머리카락과 눈 색깔, 핵심 질문 Hoe ziet ... eruit?, 두 사람의 외모 비교를 배워요.'
