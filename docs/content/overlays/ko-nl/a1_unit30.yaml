teaching:
  nl.a1.unit30.lesson01.teach.lang_klein:
    title: 키가 큰, 키가 작은
    gloss: 키가 큰 / 키가 작은
    note: '*Lang*은 키가 큰 사람을, *klein*은 키가 작은 사람을 묘사해요(이 코스의 다른 곳에서는 작은 물건에도 같은 단어를 써요).'
    example_gloss:
    - Fenna는 키가 커요.
    - Sander는 키가 작아요.
  nl.a1.unit30.lesson01.teach.oud_jong:
    title: 나이 든, 젊은
    gloss: 나이 든 / 젊은
    note: 여기서 *oud*와 *jong*은 정확한 나이가 아니라 전반적인 겉모습의 인상을 나타내요.
    example_gloss:
    - 할아버지는 연세가 많으세요.
    - Omar는 젊어요.
  nl.a1.unit30.lesson01.teach.oud_note:
    title: 'Oud: 숫자일 때와 인상일 때'
    gloss: Oud는 Hoe oud ben je?에서처럼 정확한 나이를 뜻할 수도 있고, Opa is oud에서처럼 숫자 없이 전반적인 인상을 뜻할 수도 있어요.
    note: '*oud*는 상대의 정확한 나이를 물을 때(*Hoe oud ben je?*) 이미 배웠어요. 여기서는 숫자 없이 나이가 어떻게 ''보이는지''를 나타내요.'
  nl.a1.unit30.lesson01.teach.fenna_sander_phrase:
    title: Fenna는 키가 크고 Sander는 키가 작아요
    gloss: Fenna는 키가 크고 Sander는 키가 작아요.
    note: '*en*(그리고)을 사용한 간단한 연결 문장으로, 5과의 직접 비교를 준비해요.'
  nl.a1.unit30.lesson02.teach.haar_noun:
    title: 머리카락
    gloss: 머리카락
    note: '*Haar*는 het 단어예요: *het haar*.'
    example_gloss: Omar는 짧은 검은 머리예요.
  nl.a1.unit30.lesson02.teach.haar_kleuren:
    title: 금발, 갈색, 회색
    gloss: 금발 / 갈색 / 회색
    note: 머리카락 색 세 가지예요. *Zwart*(검은색)는 앞에서 옷을 배울 때 나왔는데, 여기서 머리카락에 다시 쓰여요.
    example_gloss:
    - Lotte는 금발이에요.
    - Sander는 갈색 머리예요.
    - 할아버지는 백발이에요.
  nl.a1.unit30.lesson02.teach.haar_lengte:
    title: 긴 머리, 짧은 머리
    gloss: 긴 / 짧은 (머리)
    note: '*Lang*(긴)은 레슨 1에서 키를 말할 때 나온 단어인데, 여기서는 머리카락 길이를 나타내요. *Kort*(짧은)는 여기서 처음 나와요.'
    example_gloss:
    - Fenna는 머리가 길어요.
    - Sander는 머리가 짧아요.
  nl.a1.unit30.lesson02.teach.haar_agreement_note:
    title: Haar 앞에는 형용사가 기본형으로 와요
    gloss: 'Haar는 관사가 없는 het-woord라서 형용사가 기본형 그대로 와요: kort haar, lang haar, blond haar, bruin haar, grijs haar, zwart haar.'
    note: 관사 없이 쓰는 이런 부정(不定) 형태에서는 *haar* 앞에 -e를 붙이지 않아요. 레슨 3의 *ogen*은 -e를 붙이니 비교해 보세요.
  nl.a1.unit30.lesson02.teach.haar_homoniem_note:
    title: 'Haar: 두 가지 뜻'
    gloss: 'Haar에는 두 가지 뜻이 있어요: ''머리카락''(이번 레슨의 새 명사)과 ''그녀의''(유닛 5에서 배운 소유 표현, 예: haar moeder). 어느 뜻인지는 문맥으로 알 수 있어요.'
    note: 네덜란드어에는 철자와 발음이 같은 단어가 있어요. 명사 *haar*(머리카락)와 소유를 나타내는 *haar*(그녀의)가 그 예예요. 문장의 나머지 부분을 보면 어느 뜻인지 항상 알 수 있어요.
    target_text: 'Haar에는 두 가지 뜻이 있어요. ''머리카락''(이 과의 새 명사)과 ''그녀의''(소유를 나타내는 말, 예: haar moeder)예요. 어느 뜻인지는 문맥으로 알 수 있어요.'
  nl.a1.unit30.lesson02.teach.omar_kort_zwart:
    title: Omar는 짧은 검은 머리예요
    gloss: Omar는 짧은 검은 머리예요.
    note: 유닛 20의 옷 단원에서 나온 *zwart*(검은색)를 다시 써요.
  nl.a1.unit30.lesson02.teach.lotte_lang_blond:
    title: Lotte는 긴 금발이에요
    gloss: Lotte는 긴 금발 머리예요.
    note: 이번 과의 길이와 색 어휘를 자연스러운 한 문장에 모았어요.
  nl.a1.unit30.lesson03.teach.ogen_noun:
    title: 눈
    gloss: 눈
    note: '*Ogen*은 *het oog*의 복수형이에요. 복수형에는 항상 *de*를 써요.'
    example_gloss: Omar는 갈색 눈이에요.
  nl.a1.unit30.lesson03.teach.oog_kleuren:
    title: 파란색, 갈색, 초록색
    gloss: 파란색 / 갈색 / 초록색
    note: '*Blauw*(파란색)는 앞에서 옷을 배울 때 나왔고, *bruin*(갈색)은 레슨 2에서 머리카락과 함께 배웠어요. *Groen*(초록색)은 여기서 처음 나와요.'
    example_gloss:
    - Lotte는 파란 눈이에요.
    - Sander는 갈색 눈이에요.
    - Fenna는 초록색 눈이에요.
  nl.a1.unit30.lesson03.teach.ogen_agreement_note:
    title: Ogen 앞에는 -e가 붙어요
    gloss: '복수형 ogen 앞에서는 형용사에 -e가 하나 더 붙어요: blauwe ogen, bruine ogen, groene ogen.'
    note: 형용사가 기본형으로 오는 레슨 2의 *haar*와 비교해 보세요. 복수형 앞에서는 de-woord인지 het-woord인지와 상관없이 항상 -e가 붙어요.
  nl.a1.unit30.lesson03.teach.hoe_ziet_eruit:
    title: Lotte는 어떻게 생겼어요?
    gloss: Lotte는 어떻게 생겼어요?
    note: '*Hoe ziet ... eruit?*는 이번 유닛의 핵심 질문이에요. 누구의 외모든 물어볼 때 쓸 수 있어요.'
  nl.a1.unit30.lesson03.teach.antwoord_patroon:
    title: Lotte는 긴 금발에 파란 눈이에요
    gloss: Lotte는 긴 금발 머리에 파란 눈이에요.
    note: '*en*으로 머리카락과 눈을 한 문장에 묶은 모범 답이에요.'
  nl.a1.unit30.lesson04.teach.lotte_intro_nina:
    title: Lotte가 Nina를 소개해요
    gloss: 'Lotte: 새로운 여자아이가 taalcafé에 올 거예요. 이름은 Nina예요.'
    note: '*Er komt*(올 거예요 / 오고 있어요)는 새로운 사람이 등장함을 알릴 때 써요.'
  nl.a1.unit30.lesson04.teach.omar_ask_eruit:
    title: Omar가 어떻게 생겼는지 물어봐요
    gloss: 'Omar: 좋아요! 어떻게 생겼어요?'
    note: 이번 유닛의 핵심 질문을 이번에는 이름 대신 *ze*(그녀)로 물어봐요.
  nl.a1.unit30.lesson04.teach.lotte_klein_kort_blond:
    title: Lotte가 Nina의 키와 머리카락을 설명해요
    gloss: 'Lotte: 키가 작고 짧은 금발이에요.'
    note: 레슨 1의 *klein*과 레슨 2의 머리카락 어휘를 함께 썼어요.
  nl.a1.unit30.lesson04.teach.omar_ask_ogen:
    title: Omar가 눈에 대해 물어봐요
    gloss: 'Omar: 그리고 눈은요?'
    note: 여기서 *haar*는 '머리카락'이 아니라 '그녀의'(유닛 5에서 배운 소유 표현)라는 뜻이에요. 레슨 2의 동음이의어 설명을 참고하세요.
  nl.a1.unit30.lesson04.teach.lotte_groene_ogen:
    title: Lotte가 Nina의 눈을 설명해요
    gloss: 'Lotte: 초록색 눈이에요.'
    note: 레슨 3의 *groene ogen*을 다시 썼어요.
  nl.a1.unit30.lesson04.teach.omar_bedankt_herken:
    title: Omar는 그녀를 알아볼 수 있어요
    gloss: 'Omar: 고마워요! 그럼 알아볼 수 있겠어요.'
    note: '*Herken ik haar wel*은 ''(그녀를) 틀림없이 알아볼 수 있어요''라는 뜻이에요. 여기서 *haar*는 ''머리카락''이 아니라 ''그녀를''이라는 대명사예요.'
  nl.a1.unit30.lesson05.teach.vergelijking:
    title: Sander와 Fenna 비교하기
    gloss: Sander와 Fenna는 남매지만 서로 다르게 생겼어요. Sander는 키가 작고 짧은 갈색 머리에 갈색 눈이에요. Fenna는 Sander보다 키가 크고 긴 갈색 머리에 초록색 눈이에요. 당신은 어떻게 생겼어요?
    note: 지금까지 배운 색과 길이 어휘를 모두 다시 쓴 짧은 비교 글이에요. 마지막에는 이번 단원의 핵심 질문을 읽는 사람에게 던져요.
    glosses:
      broer: 남자 형제
      zus: 여자 형제
      zien: ~해 보이다
      anders: 다른
      klein: 짧은
      kort: 짧은
      bruin: 갈색
      haar: 머리카락
      bruine: 갈색
      ogen: 눈
      langer: 키가 더 큰
      lang: 긴
      groene: 초록색
      eruit: ('eruit zien'의 일부 = ~처럼 보이다)
  nl.a1.unit30.lesson05.teach.comparatief_note:
    title: 비교 패턴 다시 쓰기
    gloss: '이 패턴은 비교 표현에서 이미 배웠어요: 형용사 + er + dan. 여기서는 사람에게 써요: Fenna is langer dan Sander.'
    note: 유닛 14의 배낭 쇼핑 단원에서 배운 *형용사 + -er + dan* 패턴 그대로이고, 여기서는 물건 대신 사람을 설명하는 데 써요.
  nl.a1.unit30.lesson05.teach.langer_haar:
    title: Fenna는 Sander보다 머리가 길어요
    gloss: Fenna는 Sander보다 머리가 길어요.
    note: 비교급인 *langer*도 het-woord인 *haar* 앞에서는 기본형 그대로 써요. 레슨 2의 어미 설명과 같은 규칙이에요.
  nl.a1.unit30.lesson05.teach.ik_heb_haar:
    title: 저는 짧은 갈색 머리예요
    gloss: 저는 짧은 갈색 머리예요.
    note: '*Ik heb ...*를 쓴 1인칭 모범 문장이에요. 내 외모를 설명할 때 그대로 쓸 수 있어요.'
  nl.a1.unit30.lesson06.teach.omar_kijk_is_dat_nina:
    title: Omar가 Nina를 발견해요
    gloss: 'Omar: 저기 봐요, 저 사람이 Nina예요? 짧은 금발에 초록색 눈이에요.'
    note: '*Kijk*(보세요)는 유닛 14의 대화에서도 같은 방식으로 쓰였어요.'
  nl.a1.unit30.lesson06.teach.lotte_ja_dat_is_nina:
    title: Lotte가 확인해 줘요
    gloss: 'Lotte: 네, Nina예요!'
    note: 짧고 자연스러운 확인 표현이에요.
  nl.a1.unit30.lesson06.teach.nina_ben_jij_omar:
    title: Nina가 Omar에게 인사해요
    gloss: 'Nina: 안녕하세요, Omar예요?'
    note: '*ben jij ...?*는 간단하고 친근한 인사 질문이에요.'
  nl.a1.unit30.lesson06.teach.omar_leuk_je_te_zien:
    title: Omar도 Nina에게 인사해요
    gloss: 'Omar: 네! 만나서 반가워요, Nina.'
    note: '*Leuk je te ontmoeten*은 처음 만났을 때 쓰는 표준 표현이에요(유닛 1 참고). 이미 아는 사람에게 쓰는 *leuk je te zien*과는 달라요.'
  nl.a1.unit30.lesson06.teach.nina_leuk_je_ook:
    title: Nina도 인사를 받아 줘요
    gloss: 'Nina: 나도 만나서 반가워!'
    note: 대화가 마무리돼요. Omar는 Lotte의 설명 덕분에 Nina를 잘 알아봤어요.
exercises:
  nl.a1.unit30.lesson01.exercise01.choose_fenna_lang:
    instruction: '''Fenna is lang.''의 뜻을 고르세요.'
    correct_option: Fenna는 키가 커요.
    distractors:
    - Fenna는 키가 작아요.
    - Fenna는 나이가 많아요.
    - Fenna는 어려요.
    accepted_answers:
    - value: Fenna는 키가 커요.
      status: correct
    feedback: 맞아요! Fenna is lang.은 "페나는 키가 커요."라는 뜻이에요.
  nl.a1.unit30.lesson01.exercise02.listen_sander_klein:
    instruction: 듣고 화자가 말하는 내용을 고르세요.
    correct_option: Sander는 키가 작아요.
    distractors:
    - Sander는 키가 커요.
    - Sander는 나이가 많아요.
    - Sander는 어려요.
    accepted_answers:
    - value: Sander는 키가 작아요.
      status: correct
    feedback: 맞아요! Sander is klein.은 "산더르는 키가 작아요."라는 뜻이에요.
  nl.a1.unit30.lesson01.exercise03.match_lang_klein_oud_jong:
