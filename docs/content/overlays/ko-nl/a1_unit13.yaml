teaching:
  nl.a1.unit13.lesson01.teach.lekker_vinden:
    title: 음식과 음료에 쓰는 lekker vinden
    gloss: 음식과 음료에는 네덜란드어에서 흔히 lekker vinden을 써요.
    note: 한국어의 '좋아하다'에 딱 맞는 네덜란드어 표현은 하나가 아니에요. 맛에 대해서는 *Ik vind ... lekker*라고 하며, 직역하면 '맛있다고 여긴다'예요.
  nl.a1.unit13.lesson01.teach.koffie:
    title: 커피를 좋아해요
    gloss: 저는 커피를 좋아해요.
    note: 음식이나 음료는 *vind*와 *lekker* 사이에 와요.
  nl.a1.unit13.lesson01.teach.thee:
    title: 차를 좋아하지 않아요
    gloss: 저는 차를 좋아하지 않아요.
    note: 맛이 마음에 들지 않을 때는 *lekker* 앞에 *niet*를 넣어요.
  nl.a1.unit13.lesson01.teach.question:
    title: 맛에 대해 묻기
    gloss: 토마토 수프를 좋아해요?
    note: 친근한 말투의 질문에서는 *vind*가 *je* 앞에 와요. 이 코스에서 계속 쓰는 *jij/je* 형태예요.
  nl.a1.unit13.lesson02.teach.leuk_vinden:
    title: 활동에 쓰는 leuk vinden
    gloss: 활동에는 네덜란드어에서 흔히 leuk vinden을 써요. 자전거 타는 것을 좋아해요.
    note: 자전거 타기 같은 활동에는 *lekker*가 아니라 *leuk*를 써요.
  nl.a1.unit13.lesson02.teach.walking:
    title: 걷기를 좋아해요
    gloss: 저는 걷는 것을 좋아해요.
    note: 활동인 *wandelen*은 *vind*와 *leuk* 사이에 와요.
  nl.a1.unit13.lesson02.teach.dislike:
    title: 쇼핑을 좋아하지 않아요
    gloss: 저는 쇼핑을 좋아하지 않아요.
    note: '*Niet*는 *leuk* 앞에 와요.'
  nl.a1.unit13.lesson02.teach.activity_question:
    title: 활동에 대해 묻기
    gloss: 무엇을 하는 것을 좋아해요?
    note: '*Wat vind je leuk om te doen?*는 상대가 좋아하는 활동을 묻는 자연스러운 일반 질문이에요.'
  nl.a1.unit13.lesson03.teach.strong_like:
    title: 더 강하거나 일반적인 좋아함
    gloss: Houden van은 강하거나 일반적인 좋아함을 나타내요.
    note: 가려서 쓰세요. 특정한 음식이나 활동에 대한 평범한 반응은 *lekker vinden*이나 *leuk vinden*으로 말하는 것이 더 자연스러워요.
  nl.a1.unit13.lesson03.teach.music:
    title: 음악을 아주 좋아해요
    gloss: 저는 음악을 정말 좋아해요.
    note: '*Houd*는 *houden*의 *ik* 형태이고, 그 뒤에 *van*이 와요.'
  nl.a1.unit13.lesson03.teach.films:
    title: 영화를 좋아하지 않아요
    gloss: 저는 영화를 좋아하지 않아요.
    note: 부정문에서는 *niet*가 *houd*와 *van* 사이에 와요.
  nl.a1.unit13.lesson03.teach.contrast:
    title: 자연스러운 표현 고르기
    gloss: '평범한 맛에는 이렇게 말해요: 커피를 좋아해요. 활동에는 이렇게 말해요: 걷는 것을 좋아해요.'
    note: 한국어의 '좋아하다'를 모두 기계적으로 *houden van*으로 옮기지 마세요.
  nl.a1.unit13.lesson04.teach.choice_question:
    title: 두 가지 선택지 권하기
    gloss: 커피 드릴까요, 차 드릴까요?
    note: '*Wil je ... of ...?*는 상대에게 둘 중 하나를 고르라고 묻는 표현이에요.'
  nl.a1.unit13.lesson04.teach.want_prefer:
    title: 더 원하는 것을 말하기
    gloss: 저는 차를 마시는 편이 더 좋아요.
    note: 이런 일반적인 선택 문형에서는 *liever*가 *wil* 뒤에 와요.
  nl.a1.unit13.lesson04.teach.have_prefer:
    title: 하나를 더 좋아하기
    gloss: 저는 파란 스웨터가 더 좋아요.
    note: 한 물건을 다른 것보다 고를 때는 *Ik heb liever ...*도 자연스러워요.
  nl.a1.unit13.lesson04.teach.liever_note:
    title: Liever는 더 좋아하는 선택지를 나타내요
    gloss: Liever는 한 선택지를 다른 것보다 고른다는 것을 나타내요.
    note: 대화에서 두 선택지가 분명하면 비교 대상을 말하지 않아도 돼요.
  nl.a1.unit13.lesson05.teach.message:
    title: 여러 취향 읽기
    gloss: 안녕 Lotte, 나는 그 영화가 좋아. 그런데 Omar는 영화를 좋아하지 않아. Omar는 공원에 가고 싶어 해. 나도 걷는 것을 좋아해.
    note: 누가 영화를 좋아하는지, 누가 영화를 싫어하는지, Omar가 어떤 다른 선택을 하는지 따라가 보세요.
    glosses:
      Hoi: 안녕
      vind: 좋아하다 / 여기다
      film: 영화
      leuk: 좋은 / 재미있는
      maar: 하지만
      houdt: 좋아하다
      films: 영화들
      wil: 원해요
      liever: 차라리 / 더 좋아하다
      park: 공원
      wandelen: 걷기
  nl.a1.unit13.lesson06.teach.food_question:
    title: Lotte가 두 가지 음식을 권해요
    gloss: 'Lotte: 뭐 먹고 싶어요, Omar? 빵 먹을래요, 아니면 토마토 수프 먹을래요?'
    note: 두 번째 질문에서 두 가지 선택지를 제시해요.
  nl.a1.unit13.lesson06.teach.omar_choice:
    title: Omar가 수프를 골라요
    gloss: 'Omar: 저는 토마토 수프가 더 좋아요. 토마토 수프가 맛있거든요. 당신은요?'
    note: Omar는 먼저 *liever*로 선택을 말하고, 그다음 *lekker*로 맛을 들어 이유를 설명해요.
  nl.a1.unit13.lesson06.teach.lotte_choice:
    title: Lotte가 빵을 골라요
    gloss: 'Lotte: 저는 빵이 더 좋아요. 토마토 수프는 별로 맛있지 않아요.'
    note: '*Niet zo lekker*는 부정의 느낌을 부드럽게 해 주어서 친근한 대화에서 자연스러워요.'
  nl.a1.unit13.lesson06.teach.activity:
    title: 다음에 할 일을 고르기
    gloss: 'Omar: 식사 후에 뭐 하고 싶어요? Lotte: 저는 산책하는 게 좋아요.'
    note: '*Leuk*는 활동인 *wandelen*을 묘사해요.'
  nl.a1.unit13.lesson06.teach.plan:
    title: 둘이 취향이 같아요
    gloss: 'Omar: 저도요. 저는 산책을 아주 좋아해요. 공원에 갈까요? Lotte: 좋은 생각이에요.'
    note: 11단원에서 배운, 격식 없이 계획을 세우는 표현과 이어져요.
