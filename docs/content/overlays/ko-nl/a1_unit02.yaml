course:
  title: 네덜란드어 A1
  description: 네덜란드의 일상 상황에서 숫자를 쓰는 초급 네덜란드어예요.
units:
  nl.a1.unit02.basic_numbers:
    title: 일상 속 숫자
lessons:
  nl.a1.unit02.lesson01.nul_tot_twaalf:
    title: 0부터 12까지
  nl.a1.unit02.lesson02.vanaf_dertien:
    title: 13부터 99까지
  nl.a1.unit02.lesson03.telefoon_en_huisnummer:
    title: 전화번호와 집 번호
  nl.a1.unit02.lesson04.leeftijd_en_aantallen:
    title: 나이와 수량
  nl.a1.unit02.lesson05.prijzen:
    title: 유로 가격
  nl.a1.unit02.lesson06.inschrijven_bij_de_bibliotheek:
    title: 언어 카페 등록하기
teaching:
  nl.a1.unit02.lesson01.teach.zero_to_four:
    title: 0부터 4까지
    gloss: 0 — 영, 1 — 하나, 2 — 둘, 3 — 셋, 4 — 넷
    note: nul은 0이에요. 전화번호의 첫 숫자로도 똑같이 써요. één의 악센트 부호는 글에서 숫자 één과 관사 een을 구별해 줘요. 일반 글에서는 뜻이 분명하면 생략하기도 해요.
    example_gloss:
    - 저는 0유로가 있어요.
    - 저는 책이 한 권 있어요.
    - 저는 의자가 두 개 있어요.
    - 저는 책이 세 권 있어요.
    - 네 명이 있어요.
  nl.a1.unit02.lesson01.teach.five_to_eight:
    title: 5부터 8까지
    gloss: 5 — 다섯, 6 — 여섯, 7 — 일곱, 8 — 여덟
    note: vijf, zes, zeven, acht도 0부터 4까지와 같은 단순한 방식으로 쓰여요.
    example_gloss:
    - 저는 5유로가 있어요.
    - 저는 책이 여섯 권 있어요.
    - 저는 의자가 일곱 개 있어요.
    - 여덟 명이 있어요.
  nl.a1.unit02.lesson01.teach.nine_to_twelve:
    title: 9부터 12까지
    gloss: 9 — 아홉, 10 — 열, 11 — 열하나, 12 — 열둘
    note: negen, tien, elf, twaalf로 12까지의 숫자가 모두 나왔어요.
    example_gloss:
    - 저는 9유로가 있어요.
    - 저는 의자가 열 개 있어요.
    - 저는 책이 열한 권 있어요.
    - 열두 명이 있어요.
  nl.a1.unit02.lesson01.teach.how_many:
    title: 몇 개인지 묻기
    gloss: 몇 개예요?
    note: Hoeveel은 수나 양을 물을 때 써요.
  nl.a1.unit02.lesson02.teach.teens:
    title: 10대 숫자
    gloss: '13–19: 열셋, 열넷, 열다섯, 열여섯, 열일곱, 열여덟, 열아홉'
    note: 13부터 19까지의 네덜란드어 숫자는 모두 -tien으로 끝나요.
    example_gloss:
    - 저는 열세 살이에요.
    - 저는 14유로가 있어요.
    - 저는 열다섯 살이에요.
    - 저는 책이 열여섯 권 있어요.
    - 열일곱 명이 있어요.
    - 저는 열여덟 살이에요.
    - 저는 의자가 열아홉 개 있어요.
  nl.a1.unit02.lesson02.teach.tens:
    title: 십 단위 수
    gloss: '20–90: 스물, 서른, 마흔, 쉰, 예순, 일흔, 여든, 아흔'
    note: 이 십 단위 숫자를 더 큰 두 자리 수를 만드는 기본 단위로 익히세요.
    example_gloss:
    - 저는 스무 살이에요.
    - 그건 30유로예요.
    - 저는 40유로가 있어요.
    - 쉰 명이 있어요.
    - 저는 예순 살이에요.
    - 그건 70유로예요.
    - 여든 명이 있어요.
    - 저는 90유로가 있어요.
  nl.a1.unit02.lesson02.teach.inversion_rule:
    title: 일의 자리가 먼저 와요
    gloss: '21–99 (30, 40처럼 딱 떨어지는 십 단위 제외): 일의 자리 + en + 십의 자리'
    note: 한국어는 십의 자리를 먼저 말하지만(사십이), 네덜란드어는 보통 일의 자리를 먼저 말해요. 42는 말 그대로 '둘-과-마흔'이에요. 딱 떨어지는 십 단위는 십의 자리 단어만 써요.
  nl.a1.unit02.lesson02.teach.twenty_one:
    title: 스물하나
    gloss: 21 — 스물하나
    note: eenentwintig는 een + en + twintig를 한 단어로 붙여 쓴 거예요.
    example_gloss: 언어 카페는 21호실에 있어요.
  nl.a1.unit02.lesson02.teach.twenty_two:
    title: 스물둘
    gloss: 22 — 스물둘
    note: tweeëntwintig의 ë 위 두 점은 나란히 놓인 모음이 서로 다른 음절을 시작한다는 표시예요.
    example_gloss: 저는 스물두 살이에요.
  nl.a1.unit02.lesson02.teach.thirty_two:
    title: 서른둘
    gloss: 32 — 서른둘
    note: tweeëndertig는 한 단어로 붙여 쓰고, 이어지는 부분의 ë에 두 점을 찍어요.
    example_gloss: Omar는 서른두 살이에요.
  nl.a1.unit02.lesson02.teach.forty_two:
    title: 마흔둘
    gloss: 42는 마흔둘이에요.
    note: '일의 자리를 십의 자리보다 먼저 말해요: twee-en-veertig, 붙여서 tweeënveertig로 써요.'
  nl.a1.unit02.lesson02.teach.forty_eight:
    title: 마흔여덟
    gloss: 48 — 마흔여덟
    note: Achtenveertig는 acht + en + veertig를 한 단어로 붙여 써요.
    example_gloss: 저는 48번지에 살아요.
  nl.a1.unit02.lesson02.teach.seventy_five:
    title: 칠십오
    gloss: 75 — 칠십오
    note: Vijfenzeventig에서는 vijf가 zeventig 앞에 와요.
    example_gloss: 그건 75센트예요.
  nl.a1.unit02.lesson02.teach.ninety_nine:
    title: 구십구
    gloss: 99 — 구십구
    note: Negenennegentig는 한 단어로 이루어진 합성어예요.
    example_gloss: 저는 아흔아홉 살이에요.
  nl.a1.unit02.lesson03.teach.ask_phone:
    title: 전화번호 묻기
    gloss: 전화번호가 어떻게 되세요?
    note: Je를 쓰면 편한 말투의 질문이 돼요. Lotte와 Omar가 있는 언어 카페 분위기에 어울려요.
  nl.a1.unit02.lesson03.teach.phone_number:
    title: 네덜란드 휴대전화 번호 말하기
    gloss: 제 전화번호는 06 21 43 65 87이에요.
    note: 네덜란드 휴대전화 번호는 06으로 시작하며, 보통 06 뒤에 숫자 여덟 자리를 붙여 적어요.
  nl.a1.unit02.lesson03.teach.phone_spoken:
    title: 전화번호를 묶어서 말하기
    gloss: 공 육, 이십일, 사십삼, 육십오, 팔십칠
    note: 전화번호를 끊어 읽는 방식은 사람마다 달라요. 이 과정에서는 06 뒤에 두 자리씩 묶어 읽는 방식을 쓰지만, 정확히 전달해야 할 때는 숫자를 하나씩 읽는 것도 자연스러워요.
  nl.a1.unit02.lesson03.teach.ask_house_number:
    title: 집 번지수 묻기
    gloss: 집 번지수가 어떻게 되세요?
    note: Huisnummer는 주소에 붙는 번지수예요.
  nl.a1.unit02.lesson03.teach.house_number:
    title: 집 번지수 말하기
    gloss: 제 집 번지수는 48이에요.
    note: 주소를 적거나 양식을 쓸 때는 숫자로 쓰는 것이 자연스러워요.
  nl.a1.unit02.lesson03.teach.live_number:
    title: 번지수로 사는 곳 말하기
    gloss: 저는 48번지에 살아요.
    note: Op nummer ...는 거리 이름을 이미 알고 있을 때 번지수를 말하는 자연스러운 표현이에요.
  nl.a1.unit02.lesson03.teach.repeat:
    title: 다시 말해 달라고 부탁할 때
    gloss: 다시 말해 줄 수 있어요?
    note: 전화번호를 너무 빨리 말해서 알아듣지 못했을 때 유용해요.
  nl.a1.unit02.lesson04.teach.ask_age:
    title: 편하게 나이 묻기
    gloss: 몇 살이에요?
    note: 편한 말투인 je를 쓴 표현이에요. 나이를 묻는 것은 상황상 필요할 때만 적절해요.
  nl.a1.unit02.lesson04.teach.age_twenty_eight:
    title: 나이 말하기
    gloss: 저는 스물여덟 살이에요.
    note: 네덜란드어는 나이를 Ik ben ... jaar라고 말해요. 직역하면 '나는 ... 해이다'예요.
  nl.a1.unit02.lesson04.teach.age_thirty_two:
    title: Omar의 나이 말하기
    gloss: Omar는 서른두 살이에요.
    note: 나이를 말할 때는 숫자 뒤의 jaar에 복수형 어미가 붙지 않아요.
  nl.a1.unit02.lesson04.teach.how_many_people:
    title: 사람 수 묻기
    gloss: 몇 명이에요?
    note: Hoeveel은 명사 mensen 바로 앞에 와요.
  nl.a1.unit02.lesson04.teach.twelve_people:
    title: 사람 수 말하기
    gloss: 열두 명이 있어요.
    note: Er zijn은 복수일 때 '~이/가 있다'를 나타내는 일반적인 구문이에요.
  nl.a1.unit02.lesson04.teach.three_books:
    title: 책 세기
    gloss: 저는 책이 세 권 있어요.
    note: 1보다 큰 수 뒤에서는 boek가 복수형 boeken이 돼요.
  nl.a1.unit02.lesson04.teach.seven_chairs:
    title: 의자 세기
    gloss: 의자 일곱 개
    note: Stoelen은 stoel의 복수형이에요.
  nl.a1.unit02.lesson05.teach.euro:
    title: Euro
    gloss: 유로
    note: Euro는 금액 뒤에서 보통 단수 그대로 써요. twee euro라고 하고 twee euro's라고 하지 않아요.
    example_gloss: 그건 2유로예요.
  nl.a1.unit02.lesson05.teach.cent:
    title: Cent
    gloss: 센트
    note: Cent도 가격을 말할 때 숫자 뒤에서 보통 단수 그대로 써요.
    example_gloss: 그건 50센트예요.
  nl.a1.unit02.lesson05.teach.ask_price:
    title: 가격 묻기
    gloss: 이건 얼마예요?
    note: Hoeveel은 양이나 액수를 묻고, kost는 '(값이) 나가다'라는 뜻이에요.
  nl.a1.unit02.lesson05.teach.two_fifty:
    title: 2유로 50센트
    gloss: €2,50 — 2유로 50센트
    note: 네덜란드어는 소수점 자리에 쉼표를 써요. 일상 대화에서 €2,50은 보통 twee euro vijftig이라고 읽고, 그 사이에 en을 넣지 않아요.
  nl.a1.unit02.lesson05.teach.seventy_five_cents:
    title: 75센트
    gloss: €0,75 — 75센트
    note: 금액이 1유로 미만일 때는 센트만 말하는 것이 자연스러워요.
  nl.a1.unit02.lesson05.teach.twelve_euros:
    title: 12유로
    gloss: €12 — 12유로
    note: 딱 떨어지는 유로 가격에는 센트 표현이 필요 없어요.
  nl.a1.unit02.lesson05.teach.four_fifty:
    title: 4유로 50센트
    gloss: €4,50 — 4유로 50센트
    note: 다른 유로와 센트 가격에도 같은 말하기 방식을 쓸 수 있어요.
  nl.a1.unit02.lesson05.teach.costs:
    title: 가격 말하기
    gloss: 그건 2유로 50센트예요.
    note: Dat kost ...는 Hoeveel kost dit?에 바로 답하는 표현이에요.
  nl.a1.unit02.lesson06.teach.opening:
    title: Omar가 등록하기
    gloss: '직원: 안녕하세요. 언어 카페 때문에 오셨어요? Omar: 네, 등록하고 싶어요.'
    note: 1과에 나온 Omar의 도서관 언어 카페 방문이 이어지는 장면이에요.
  nl.a1.unit02.lesson06.teach.phone_turn:
    title: 전화번호 말해 주기
    gloss: '직원: 좋아요. 전화번호가 어떻게 되세요? Omar: 06 21 43 65 87이에요.'
    note: Omar는 앞에서 연습한 대로 두 자리씩 묶어서 번호를 말해요.
  nl.a1.unit02.lesson06.teach.house_turn:
    title: 집 번지수 말하기
    gloss: '직원: 그럼 집 번지수는 어떻게 되세요? Omar: 48이에요.'
    note: 질문에서 상황이 드러나면 숫자만 짧게 답하는 것이 자연스러워요.
  nl.a1.unit02.lesson06.teach.fee_turn:
    title: 참가비 이해하기
    gloss: '직원: 참가비는 2유로 50센트예요. Omar: 좋아요.'
    note: 가격은 일상에서 쓰는 '유로 + 센트' 방식으로 말해요.
  nl.a1.unit02.lesson06.teach.group_turn:
    title: 모임 인원 묻기
    gloss: 'Omar: 모임에 몇 명이 있어요? 직원: 열두 명이에요.'
    note: 이 장면은 이번 과에서 배운 Hoeveel mensen ... 질문 형태를 다시 써요.
  nl.a1.unit02.lesson06.teach.room_turn:
    title: 방 번호 찾기
    gloss: '직원: 언어 카페는 21호실에서 열려요.'
    note: Zaal은 활동에 쓰는 방이나 홀이에요.
  nl.a1.unit02.lesson06.teach.lotte_turn:
    title: Lotte의 테이블 찾기
    gloss: 'Lotte: 안녕, Omar! 우리는 7번 테이블에 앉아 있어.'
    note: 대화는 같은 편안한 분위기에서 Omar가 Lotte와 다시 만나며 끝나요.
