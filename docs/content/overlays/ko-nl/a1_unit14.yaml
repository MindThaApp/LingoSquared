teaching:
  nl.a1.unit14.lesson01.teach.comparative_rule:
    title: 비교급 만들기
    gloss: 비교할 때는 보통 형용사에 -er를 붙이고 dan을 써요.
    note: '*Dan*은 ''~보다''에 해당하는 네덜란드어예요. 항상 비교급 형용사 뒤에 와요.'
  nl.a1.unit14.lesson01.teach.groot_klein:
    title: 큰, 작은
    gloss: 큰, 작은
    note: '*Groot*와 *klein*은 -er를 붙이기 전의 기본 형용사예요.'
    example_gloss:
    - 배낭이 커요.
    - 가방이 작아요.
  nl.a1.unit14.lesson01.teach.rugzak_groter:
    title: 배낭이 더 커요
    gloss: 배낭이 가방보다 더 커요.
    note: '*Groter*는 *groot* + *er*이고, *dan*은 비교하는 두 번째 대상을 이끌어요.'
  nl.a1.unit14.lesson01.teach.tas_kleiner:
    title: 가방이 더 작아요
    gloss: 가방이 배낭보다 더 작아요.
    note: '*Kleiner*는 *klein* + *er*이며 같은 방식이에요.'
  nl.a1.unit14.lesson02.teach.rugzak_price:
    title: 배낭의 가격
    gloss: 배낭은 45유로예요.
    note: '*Kost*는 *kosten*(값이 나가다)의 3인칭 단수형이에요.'
  nl.a1.unit14.lesson02.teach.tas_price:
    title: 가방의 가격
    gloss: 가방은 20유로예요.
    note: 배낭보다 낮은 가격으로, 이어지는 비교를 위한 준비예요.
  nl.a1.unit14.lesson02.teach.duur_goedkoop:
    title: 비싼, 저렴한
    gloss: 비싼, 싼
    note: '*Duur*와 *goedkoop*은 *-der*/*-er*를 붙이기 전의 기본 형용사예요.'
    example_gloss:
    - 배낭이 비싸요.
    - 가방이 싸요.
  nl.a1.unit14.lesson02.teach.rugzak_duurder:
    title: 배낭이 더 비싸요
    gloss: 배낭이 가방보다 더 비싸요.
    note: '*Duurder*는 *duur* + *der*예요. 네덜란드어에서는 r로 끝나는 형용사 뒤에 *-er*를 겹쳐 쓰지 않고 *-der*를 붙여요.'
  nl.a1.unit14.lesson02.teach.tas_goedkoper:
    title: 가방이 더 싸요
    gloss: 가방이 배낭보다 더 싸요.
    note: '*Goedkoper*는 *goedkoop* + *er*이고, 앞 문장과 반대되는 내용이에요.'
  nl.a1.unit14.lesson03.teach.equality_rule:
    title: 같은 정도로 비교하기
    gloss: 두 대상이 같다고 비교할 때는 net zo + 형용사 + als를 써요.
    note: 이것은 한국어의 '~만큼 …하다'에 해당하는 네덜란드어 표현이에요.
  nl.a1.unit14.lesson03.teach.mooi:
    title: 똑같이 예쁜
    gloss: 이 배낭은 저 가방만큼 예뻐요.
    note: '*Mooi*(예쁜)는 *net zo*와 *als* 사이에 형태 변화 없이 그대로 들어가요. 이 구문에서는 -er를 붙이지 않아요.'
  nl.a1.unit14.lesson03.teach.praktisch:
    title: 똑같이 실용적인
    gloss: 배낭은 가방만큼 실용적이에요.
    note: 어떤 기본 형용사든 이 *net zo ... als* 자리에 넣을 수 있어요.
  nl.a1.unit14.lesson04.teach.superlative_rule:
    title: 최상급 만들기
    gloss: 최상급은 보통 het + 형용사 + st로 만들어요.
    note: '*is* 뒤에 오는 이 서술적 형태는 명사의 성과 상관없이 *het*를 써요.'
  nl.a1.unit14.lesson04.teach.duurst:
    title: 둘 중에서 가장 비싼 것
    gloss: 이 둘 중에서 배낭이 가장 비싸요.
    note: '*Duurst*는 *duur* + *st*예요. 네덜란드어에서는 선택지가 둘뿐일 때도 최상급을 쓸 수 있어요.'
  nl.a1.unit14.lesson04.teach.irregular_rule:
    title: '불규칙형: goed, beter, best'
    gloss: Goed, beter, best는 불규칙이에요. 이것이 가장 좋은 선택이에요. Veel, meer, meest도 마찬가지예요.
    note: '*goed/beter/best*와 *veel/meer/meest*는 둘 다 규칙적인 -er/-st 형태를 따르지 않아요.'
  nl.a1.unit14.lesson04.teach.beste_keuze:
    title: 여행에 가장 좋은 선택
    gloss: 이 배낭은 긴 기차 여행에 가장 좋은 선택이에요.
    note: '*Beste*는 명사 앞에 쓰이는 형태로, 네덜란드어 형용사가 명사 앞에서 보통 취하는 -e 어미가 붙어요.'
  nl.a1.unit14.lesson04.teach.meer_ruimte:
    title: 더 많은 공간
    gloss: 배낭은 가방보다 공간이 더 많아요.
    note: '*Meer*는 *veel*(많은)의 불규칙 비교급이에요.'
  nl.a1.unit14.lesson05.teach.advertentie:
    title: 가게 광고 읽기
    gloss: '배낭 Bergsport: 45유로. 이 배낭은 크고 튼튼해요. 숄더백 Stad: 20유로. 이 가방은 배낭보다 더 작고 가볍지만 덜 튼튼해요. 긴 여행에는 배낭이 가장 좋은 선택이에요. 더 튼튼하고 공간도 더 많기 때문이에요.'
    note: 두 제품의 가격과 크기, 그리고 광고가 어느 쪽을 왜 추천하는지 확인하세요.
    glosses:
      Rugzak: 배낭
      vijfenveertig: 마흔다섯
      euro: 유로
      groot: 큰
      sterk: 튼튼한
      Schoudertas: 숄더백
      twintig: 20, 스물
      tas: 가방
      kleiner: 더 작은
      lichter: 더 가벼운
      minder: 더 적은
      lange: 긴
      reis: 여행
      beste: 가장 좋은
      keuze: 선택
      sterker: 더 튼튼한
      ruimte: 공간
  nl.a1.unit14.lesson06.teach.lotte_open:
    title: Lotte가 크기를 짚어 줘요
    gloss: 'Lotte: 봐, 이 배낭이 저 가방보다 더 커.'
    note: '*Kijk*(봐요)는 어떤 것에 상대의 주의를 끌 때 흔히 쓰는 표현이에요.'
  nl.a1.unit14.lesson06.teach.omar_room:
    title: Omar가 왜 필요한지 설명해요
    gloss: 'Omar: 응, 그리고 공간도 더 많아. 기차 여행에 쓸 큰 가방이 필요하거든.'
    note: '*Nodig hebben*(필요하다)은 고정된 표현이에요. 필요한 것은 *hebben*과 *nodig* 사이에 와요.'
  nl.a1.unit14.lesson06.teach.lotte_best_choice:
    title: Lotte가 선택을 확인해요
    gloss: 'Lotte: 그럼 너한테는 배낭이 가장 좋은 선택이야.'
    note: 여기서 *Dan*은 '그렇다면'이라는 뜻이에요. 앞서 배운 비교급의 *dan*(~보다)과는 다른 말인데, 철자가 같아요.
  nl.a1.unit14.lesson06.teach.omar_question:
    title: Omar가 Lotte의 의견을 물어요
    gloss: 'Omar: 맞아. 너는 어떤 가방이 제일 예쁜 것 같아?'
    note: '*Vind jij het mooist*는 13단원의 *vinden* 수업에서 배운 의견 표현 패턴을 다시 쓴 거예요.'
  nl.a1.unit14.lesson06.teach.lotte_choice:
    title: Lotte가 숄더백을 골라요
    gloss: 'Lotte: 나는 이 숄더백이 제일 예쁜 것 같아. 게다가 가볍기도 해.'
    note: '*Licht*(무게가 가벼운)는 가방이나 짐을 묘사할 때 유용한 새 형용사예요.'
  nl.a1.unit14.lesson06.teach.omar_close:
    title: 두 사람이 결정을 내려요
    gloss: 'Omar: 좋아, 그럼 나는 배낭을 사고 너는 숄더백을 사.'
    note: 두 번째 절에서는 반복되는 동사 *koop*을 생략했어요. 문맥상 분명할 때 네덜란드어 구어에서는 이렇게 자연스럽게 생략해요.
  nl.a1.unit14.lesson06.teach.koopt_form:
    title: Koop / koopt
    gloss: kopen(사다)의 1인칭 단수형은 koop, 3인칭 단수형은 koopt예요.
    note: '규칙적인 현재형 패턴: *ik koop*, *jij/hij/zij koopt*.'
