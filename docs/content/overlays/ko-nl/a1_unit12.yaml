teaching:
  nl.a1.unit12.lesson01.teach.completed_event:
    title: 일상 네덜란드어의 과거 표현
    gloss: 대화에서 완료된 일을 말할 때는 보통 hebben 또는 zijn에 과거분사를 함께 써요.
    note: 네덜란드어는 일상에서 이 완료형을 한국어의 '-았/었어요' 같은 과거 표현처럼 널리 써요. *Ik heb koffie gedronken*은 '커피를 마셨어요'라는 뜻이에요.
  nl.a1.unit12.lesson01.teach.drinken_model:
    title: 저는 커피를 마셨어요
    gloss: 마시다 → 저는 커피를 마셨어요.
    note: '*Heb*는 조동사이고 *gedronken*은 *drinken*의 과거분사예요.'
  nl.a1.unit12.lesson01.teach.gaan_model:
    title: 저는 슈퍼마켓에 갔어요
    gloss: 가다 → 저는 슈퍼마켓에 갔어요.
    note: '*Gaan*은 *zijn*과 함께 써요: *ik ben gegaan*.'
  nl.a1.unit12.lesson01.teach.word_order:
    title: 과거분사는 맨 끝에 와요
    gloss: '과거분사는 문장 끝에 와요: Ik heb koffie gedronken. Ik sta op에서 op가 끝에 오는 것을 떠올려 보세요.'
    note: 10과에서 이미 절 끝에 오는 중요한 요소에 귀 기울이는 연습을 했어요. 여기서는 맨 끝 요소가 과거분사예요.
  nl.a1.unit12.lesson02.teach.hebben_rule:
    title: 대부분의 동사는 hebben을 써요
    gloss: 대부분의 동사는 hebben을 써요.
    note: 이번 단원에서는 *drinken*, *eten*, *werken*, *kopen*에 *hebben*을 쓰세요.
  nl.a1.unit12.lesson02.teach.drinken:
    title: hebben을 쓰는 drinken
    gloss: 마시다 → 저는 커피를 마셨어요.
    note: 전체 형태는 *ik + heb + 목적어 + gedronken*이에요.
  nl.a1.unit12.lesson02.teach.eten:
    title: hebben을 쓰는 eten
    gloss: 먹다 → 저는 빵을 먹었어요.
    note: '*eten*의 과거분사는 *gegeten*이에요.'
  nl.a1.unit12.lesson02.teach.werken:
    title: hebben을 쓰는 werken
    gloss: 일하다 → 저는 일했어요.
    note: '*werken*의 과거분사는 *gewerkt*예요.'
  nl.a1.unit12.lesson02.teach.kopen:
    title: hebben을 쓰는 kopen
    gloss: 사다 → 저는 사과를 샀어요.
    note: '*kopen*의 과거분사는 *gekocht*예요.'
  nl.a1.unit12.lesson03.teach.zijn_rule:
    title: gaan과 komen은 zijn을 써요
    gloss: gaan과 komen에는 zijn을 써요.
    note: 자주 쓰는 이 두 이동 동사는 여기서 배우는 완료 표현에서 *hebben*이 아니라 *zijn*을 써요.
  nl.a1.unit12.lesson03.teach.gaan:
    title: zijn을 쓰는 gaan
    gloss: 가다 → 저는 슈퍼마켓에 갔어요.
    note: '*ik*에는 *ben*을 쓰고 *gegaan*을 맨 끝에 두세요.'
  nl.a1.unit12.lesson03.teach.komen:
    title: zijn을 쓰는 komen
    gloss: 오다 → 저는 언어 카페에 왔어요.
    note: '*ik*에는 *ben*을 쓰고 *gekomen*을 맨 끝에 두세요.'
