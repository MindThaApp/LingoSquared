      supermarkt: 슈퍼마켓
      gegaan: 갔다
      appels: 사과
      gekocht: 샀다
      Daarna: 그다음에
      taalcafé: 언어 카페
      Daar: 거기에서
      koffie: 커피
      gedronken: 마셨다 / 마신
