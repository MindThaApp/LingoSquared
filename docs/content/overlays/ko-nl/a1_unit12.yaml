    gloss: 'Gisteren이나 Vanmorgen 뒤에서는 동사가 ik 앞에 와요: Gisteren heb ik ...'
    note: 10과에서 *daarna* 뒤에 본 것과 같이 동사가 *ik* 앞에 오는 어순이에요.
  nl.a1.unit12.lesson05.teach.recent_text:
    title: 최근 일에 대한 글
    gloss: 오늘 아침에 저는 슈퍼마켓에 갔어요. 사과를 샀어요. 그다음에 언어 카페에 갔어요. 거기서 커피를 마셨어요.
    note: 시간 표현 하나, 장소들, 그리고 각각 완료된 행동에 주목하며 읽어 보세요.
    glosses:
