teaching:
  nl.a1.unit29.lesson01.teach.hobbies_set1:
    title: 독서, 운동, 요리
    gloss: 읽다, 운동하다, 요리하다
    note: '자주 쓰는 취미 동사 세 가지: *lezen*(읽다), *sporten*(운동하다), *koken*(요리하다).'
    example_gloss:
    - 저는 책 읽는 것을 좋아해요.
    - 저는 토요일마다 운동해요.
    - 저는 친구들을 위해 요리하는 것을 좋아해요.
  nl.a1.unit29.lesson01.teach.vrije_tijd:
    title: 여가 시간
    gloss: 시간
    note: '*De vrije tijd*는 *de*와 함께 쓰는 명사예요. 취미를 이야기할 때 꼭 필요한 표현이에요.'
    example_gloss: 저는 여가 시간에 독서하는 것을 좋아해요.
  nl.a1.unit29.lesson01.teach.in_vrije_tijd:
    title: 여가 시간에 하는 일 말하기
    gloss: 저는 여가 시간에 독서하는 것을 좋아해요.
    note: '*Lees*는 *lezen*(읽다)의 1인칭 단수형이에요.'
  nl.a1.unit29.lesson02.teach.hobbies_set2:
    title: 음악, 그림 그리기, 비디오 게임
    gloss: 음악을 듣다, 그림을 그리다, 비디오 게임을 하다
    note: '취미 동사 세 가지 더: *muziek luisteren*(음악을 듣다), *tekenen*(그림을 그리다), *gamen*(게임하다). gamen은 영어에서 들어온 외래어예요.'
    example_gloss:
    - 저는 음악 듣는 것을 좋아해요.
    - 저는 그림을 자주 그려요.
    - 저는 친구들과 비디오 게임 하는 것을 좋아해요.
  nl.a1.unit29.lesson02.teach.luister_muziek:
    title: 음악 듣기를 좋아한다고 말하기
    gloss: 저는 음악 듣는 것을 좋아해요.
    note: '*Luisteren naar*(~을 듣다)는 목적어 앞에 항상 *naar*가 와요.'
  nl.a1.unit29.lesson02.teach.game_vrienden:
    title: 친구들과 게임하는 것을 좋아한다고 말하기
    gloss: 저는 친구들과 비디오 게임 하는 것을 좋아해요.
    note: '*Met vrienden*(친구들과)에는 앞에서 배운 *vrienden*이 다시 나와요.'
  nl.a1.unit29.lesson03.teach.frequency_set1:
    title: 항상, 자주, 가끔, 전혀 ~않다
    gloss: 항상, 자주, 가끔, 절대 ~않다
    note: 핵심 빈도 부사 네 가지예요. *Vaak*은 5단원의 *Zie je hem vaak?*에서 이미 나왔고, 나머지 셋은 새로운 단어예요.
    example_gloss:
    - 저는 토요일마다 항상 운동해요.
    - 저는 책을 자주 읽어요.
    - 저는 가끔 그림을 그려요.
    - 저는 게임을 전혀 안 해요.
  nl.a1.unit29.lesson03.teach.frequency_set2:
    title: 매주, 주말마다
    gloss: 매주, 주말마다
    note: '*Elke week*와 *elk weekend*는 둘 다 ''매~''라는 뜻이지만, 명사의 성에 따라 형태가 달라져요. 다음 카드를 보세요.'
    example_gloss:
    - 저는 매주 친구들을 위해 요리해요.
    - 저는 주말마다 운동해요.
  nl.a1.unit29.lesson03.teach.elke_elk_grammar:
    title: Elke와 elk
    gloss: week처럼 de-woorden에는 elke를 쓰고, weekend처럼 het-woorden에는 elk를 써요.
    note: '*Week*는 de-woord(*de week*)라서 *elke*를 쓰고, *weekend*는 het-woord(*het weekend*)라서 *elk*를 써요. 23단원의 *de rekening*과 *het wisselgeld*에서 본 de/het 구분과 같은 원리예요.'
  nl.a1.unit29.lesson03.teach.vrije_tijd_vraag:
    title: 여가 시간에 대해 묻기
    gloss: 여가 시간에 무엇을 하나요?
    note: 이 단원의 핵심 질문이에요. 누구에게든 취미를 물을 때 이 문장을 쓰세요.
  nl.a1.unit29.lesson04.teach.lotte_callback:
    title: Lotte가 취미 이야기를 꺼내요
    gloss: 'Lotte: 우리는 자주 같이 걸어요. 그런데 Omar, 자유 시간에 또 뭘 해요?'
    note: '*We wandelen vaak samen*은 13단원에서 Lotte와 Omar가 둘 다 *wandelen*을 좋아한다고 말한 내용과 이어져요.'
  nl.a1.unit29.lesson04.teach.omar_cook_sport:
    title: Omar의 취미
    gloss: 'Omar: 저는 요리를 좋아해요, 집에서도요. 그리고 운동도 자주 해요.'
    note: '*Ook thuis*(집에서도)는 Omar가 식당 일뿐 아니라 즐거움으로도 요리한다는 것을 분명히 해 줘요.'
  nl.a1.unit29.lesson04.teach.lotte_surprised:
    title: Lotte가 놀라요
    gloss: 'Lotte: 집에서도 요리해요? 직장에서 이미 하루 종일 요리하잖아요!'
    note: '*Al de hele dag*(이미 하루 종일)는 Omar가 직장에서 이미 요리를 아주 많이 한다는 점을 강조해요.'
  nl.a1.unit29.lesson04.teach.omar_relaxing:
    title: Omar가 설명해요
    gloss: 'Omar: 네, 하지만 저는 요리하는 게 편안해요. 그런데 당신은요, 뭘 하는 걸 좋아해요?'
    note: '*Koken vind ik ontspannend*는 강조하려고 목적어 *koken*을 문장 앞에 두었어요. 직역하면 ''요리, 그건 편안하다고 생각해요''예요.'
  nl.a1.unit29.lesson04.teach.lotte_reads_music:
    title: Lotte의 취미
    gloss: 'Lotte: 저는 독서를 좋아하고 음악도 자주 들어요.'
    note: 앞에서 배운 취미 동사 두 개를 *en*(그리고)으로 한 문장에 이었어요.
  nl.a1.unit29.lesson04.teach.omar_ask_game:
    title: Omar가 게임에 대해 물어요
    gloss: 'Omar: 당신도 게임해요?'
    note: 앞에서 배운 *gamen*을 쓴 짧은 예/아니요 질문이에요.
  nl.a1.unit29.lesson04.teach.lotte_no_game_draw:
    title: Lotte가 대답해요
    gloss: 'Lotte: 아니요, 저는 게임을 전혀 안 해요. 하지만 가끔 그림은 그려요!'
    note: 앞에서 배운 *nooit*(절대 ~않다)와 *soms*(가끔)가 한 대답 안에서 대조를 이뤄요.
  nl.a1.unit29.lesson05.teach.vergelijking:
    title: 취미 비교하기
    gloss: Omar와 저는 자주 같이 걸어요. 하지만 다른 취미도 있어요. Omar는 요리를 좋아해서 집에서도 하고, 운동도 자주 해요. 저는 독서를 좋아하고 음악도 자주 들어요. 가끔 그림을 그리지만 게임은 전혀 안 해요. 당신은 자유 시간에 뭘 하는 걸 좋아해요?
    note: Lotte의 메시지는 앞서 나온 내용을 정리하고, 이 단원의 핵심 질문을 읽는 사람에게 던지며 끝나요.
    glosses:
      wandelen: 산책하다
      vaak: 자주
      samen: 함께
      andere: 다른
      kookt: 요리하다
      graag: 즐겨
      thuis: 집에서
      sport: 운동하다
      lees: 읽다
      luister: 듣다
      muziek: 음악
      teken: 그리다
      soms: 가끔
      game: 게임하다
      nooit: 전혀 하지 않다
      vrije: 자유로운
      tijd: 시간
  nl.a1.unit29.lesson06.teach.omar_ask_weekend:
    title: Omar가 주말에 대해 물어요
    gloss: 'Omar: 이번 주말에 뭐 해요?'
    note: '*Dit weekend*(이번 주말)는 19단원에서 나온 시간 표현이에요.'
  nl.a1.unit29.lesson06.teach.lotte_unsure:
    title: Lotte는 아직 정하지 못했어요
    gloss: 'Lotte: 아직 모르겠어요. 독서를 좋아하지만, 밖에도 나가고 싶어요.'
    note: '*Naar buiten*은 ''밖으로''라는 뜻으로, 집을 나서고 싶다고 말할 때 흔히 쓰는 표현이에요.'
  nl.a1.unit29.lesson06.teach.omar_suggest_walk_cook:
    title: Omar의 제안
    gloss: 'Omar: 우리 같이 산책할까요? 그다음에 제가 우리를 위해 요리할게요.'
    note: '*Daarna*(그다음에)는 10단원의 *eerst, dan, daarna*에서 배운 순서를 나타내는 말이에요.'
  nl.a1.unit29.lesson06.teach.lotte_agree_both:
    title: Lotte가 동의해요
    gloss: 'Lotte: 좋은 생각이에요! 저는 산책도 요리도 둘 다 좋아해요.'
    note: '*Allebei*(둘 다)는 Lotte가 두 가지를 똑같이 좋아한다는 뜻이에요. 한쪽을 더 좋아하는 게 아니에요.'
  nl.a1.unit29.lesson06.teach.omar_confirm_saturday:
    title: Omar가 약속을 확정해요
    gloss: 'Omar: 좋아요. 그럼 토요일에 봐요!'
    note: '*zaterdag*(토요일) 약속을 확인하는 다정한 마무리 말이에요.'
