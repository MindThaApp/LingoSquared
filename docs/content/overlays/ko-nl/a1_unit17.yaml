teaching:
  nl.a1.unit17.lesson01.teach.wat_doe_je:
    title: 직업 물어보기
    gloss: 직업이 뭐예요?
    note: 상대의 직업을 물을 때 쓰는 일반적이고 편한 표현이에요.
  nl.a1.unit17.lesson01.teach.beroep_kok:
    title: 직업 / 요리사
    gloss: 직업; 요리사
    note: '*Het beroep*(직업)는 중성 명사예요. *Kok*(요리사)는 성별과 관계없이 쓰는 직업 명사로, *een kok*, *de kok*처럼 써요.'
    example_gloss:
    - 직업이 뭐예요?
    - 저는 요리사로 일해요.
  nl.a1.unit17.lesson01.teach.werk_als_kok:
    title: 요리사라고 말하기
    gloss: 저는 요리사로 일해요.
    note: '*Werken als* + 직업이 직업을 말하는 기본 패턴이에요. 직업 명사 앞에는 관사를 쓰지 않아요.'
  nl.a1.unit17.lesson01.teach.verpleegkundige:
    title: 간호사
    gloss: 간호사
    note: 이 직업을 가리키는 현대적이고 성 중립적인 말로, 성별에 관계없이 쓸 수 있어요.
    example_gloss: 저는 간호사로 일해요.
  nl.a1.unit17.lesson01.teach.werk_als_verpleegkundige:
    title: 간호사라고 말하기
    gloss: 저는 간호사로 일해요.
    note: '*kok*과 같은 *werken als* 패턴이에요.'
  nl.a1.unit17.lesson02.teach.waar_werk_je:
    title: 일하는 곳 물어보기
    gloss: 어디에서 일하세요?
    note: '*Wat doe je voor werk?*에 이어서 바로 할 수 있는 질문이에요.'
  nl.a1.unit17.lesson02.teach.werk_restaurant:
    title: 식당에서 일하기
    gloss: 저는 식당에서 일해요.
    note: 여러 식당 중 하나를 말하므로 *een restaurant*처럼 부정관사를 써요.
  nl.a1.unit17.lesson02.teach.ziekenhuis:
    title: 병원
    gloss: 병원
    note: '중성 명사예요: *het ziekenhuis*.'
    example_gloss: 저는 병원에서 일해요.
  nl.a1.unit17.lesson02.teach.werk_ziekenhuis:
    title: 병원에서 일하기
    gloss: 저는 병원에서 일해요.
    note: '*Het ziekenhuis*에는 정관사를 써요. 네덜란드어에서는 병원을 특정하고 이미 알려진 기관으로 보기 때문이에요.'
  nl.a1.unit17.lesson02.teach.kantoor:
    title: 사무실에서 일하기
    gloss: 어떤 사람들은 사무실에서 일해요.
    note: '*Op kantoor*(사무실에서)는 *in een restaurant*, *in het ziekenhuis*와 달리 관사 없이 쓰는 고정 표현이에요.'
  nl.a1.unit17.lesson03.teach.begin_negen:
    title: 시작 시간
    gloss: 저는 9시에 시작해요.
    note: '*Begin*은 *beginnen*(시작하다)의 ik에 쓰는 형태예요. 4단원에서 배운 시각 표현을 다시 써요.'
  nl.a1.unit17.lesson03.teach.maandag_vrijdag:
    title: 근무 요일
    gloss: 저는 월요일부터 금요일까지 일해요.
    note: '*Van... tot...*는 3단원에서 배운 요일 범위 표현을 다시 쓴 거예요.'
  nl.a1.unit17.lesson03.teach.pauze:
    title: 휴식 시간
    gloss: 쉬는 시간
    note: 'de를 쓰는 명사예요: *de pauze*.'
    example_gloss: 저는 열두 시에 쉬는 시간이 있어요.
  nl.a1.unit17.lesson03.teach.heb_pauze:
    title: 휴식 시간이 있다
    gloss: 저는 열두 시에 쉬는 시간이 있어요.
    note: '*Pauze hebben*(쉬는 시간을 갖다)이 자연스러운 고정 표현이에요.'
  nl.a1.unit17.lesson03.teach.stop_vijf:
    title: 끝나는 시간
    gloss: 저는 5시에 끝나요.
    note: '*Stop*은 *stoppen*(멈추다, 끝내다)의 ik에 쓰는 형태예요.'
  nl.a1.unit17.lesson03.teach.begin_en_stop:
    title: 하루 근무
    gloss: 저는 9시에 시작해서 5시에 끝나요.
    note: '*begin*과 *stop*을 *en*으로 이어 하루 근무를 한 문장으로 말해요.'
  nl.a1.unit17.lesson04.teach.third_person_rule:
    title: 3인칭 동사 어미
    gloss: '그나 그녀가 주어일 때는 동사에 보통 -t가 붙어요: 그는 일해요, 그녀는 일해요.'
    note: '*Werk*는 *hij*/*zij*와 함께 쓰면 *werkt*가 돼요. 규칙적인 네덜란드어 현재형 3인칭 패턴이에요.'
  nl.a1.unit17.lesson04.teach.lotte_werkt:
    title: Lotte의 직업
    gloss: Lotte는 간호사로 일해요.
    note: 주어가 *ik*가 아니라 3인칭인 이름이므로 *werk*가 아니라 *werkt*를 써요.
  nl.a1.unit17.lesson04.teach.omar_werkt:
    title: Omar의 직업
    gloss: Omar는 요리사로 일해요.
    note: '*Lotte werkt als verpleegkundige*와 같은 3인칭 -t 어미예요.'
  nl.a1.unit17.lesson04.teach.pronouns_workplaces:
    title: 대명사 사용하기
    gloss: 그녀는 병원에서 일해요. 그는 식당에서 일해요.
    note: '*Zij*/*hij*는 Lotte/Omar라는 이름을 대신하지만, 동사는 같은 3인칭 -t 형태를 써요.'
  nl.a1.unit17.lesson05.teach.profiel:
    title: 두 사람의 직업 소개 읽기
    gloss: Lotte는 병원에서 간호사로 일해요. 7시에 시작해서 월요일부터 금요일까지 일해요. Omar는 식당에서 요리사로 일해요. 11시에 시작하고 4시에 쉬는 시간이 있어요.
    note: 각 사람의 직업, 일하는 곳, 근무 시간을 따로 구분해서 읽어 보세요.
    glosses:
      werkt: 일해요
      verpleegkundige: 간호사
      ziekenhuis: 병원
      begint: 시작
      zeven: 일곱, 7
      maandag: 월요일
      vrijdag: 금요일
      kok: 요리사
      restaurant: 식당
      elf: '11'
      pauze: 휴식 시간
  nl.a1.unit17.lesson06.teach.lotte_curious:
    title: Lotte가 일에 대해 물어요
    gloss: 'Lotte: 안녕하세요, Omar! 궁금한 게 있는데, 실제로 무슨 일을 하세요?'
    note: '*Eigenlijk*(사실, 실은)는 질문을 추궁처럼 들리지 않게 하고 친근한 호기심을 담아 부드럽게 만들어 줘요.'
  nl.a1.unit17.lesson06.teach.omar_answer:
    title: Omar가 대답해요
    gloss: 'Omar: 저는 식당에서 요리사로 일해요. 당신은요?'
    note: '*En jij?*는 같은 질문을 상대에게 되돌릴 때 쓰는 표준적인 표현이에요.'
  nl.a1.unit17.lesson06.teach.lotte_answer:
    title: Lotte가 대답해요
    gloss: 'Lotte: 저는 병원에서 간호사로 일해요.'
    note: 앞선 수업에서 나온 직업과 일하는 곳과 같아요.
  nl.a1.unit17.lesson06.teach.omar_ask_hours:
    title: Omar가 근무 시간을 물어요
    gloss: 'Omar: 근무 시간이 어떻게 돼요?'
    note: '*Uren maken*(직역하면 ''시간을 만들다'')은 근무 일정을 말할 때 쓰는 고정 관용 표현이에요.'
  nl.a1.unit17.lesson06.teach.lotte_hours:
    title: Lotte가 근무 시간을 말해요
    gloss: 'Lotte: 저는 7시에 시작해서 월요일부터 금요일까지 일해요.'
    note: 앞선 수업의 읽기 소개글에 나온 근무 시간과 같아요.
  nl.a1.unit17.lesson06.teach.omar_reaction:
    title: Omar가 반응해요
    gloss: 'Omar: 일찍이네요! 저는 더 늦게, 11시에 시작해요.'
    note: 앞에서 이미 나온 Omar의 시작 시간과 같아요.
  nl.a1.unit17.lesson06.teach.lotte_closing:
    title: Lotte가 이야기를 마무리해요
    gloss: 'Lotte: 직업마다 나름의 리듬이 있는 것 같아요.'
    note: 생각을 담아 자연스럽게 마무리하는 말이에요. 뜻만 알아들으면 되고, 그대로 외울 필요는 없어요.
