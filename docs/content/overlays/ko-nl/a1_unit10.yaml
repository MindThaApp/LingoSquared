teaching:
  nl.a1.unit10.lesson01.teach.opstaan:
    title: 일어나기
    gloss: 일어나다 → 저는 일어나요
    note: '*Opstaan*은 주절에서 분리돼요: *Ik sta op*. 접두사 *op*는 문장 끝으로 가요.'
  nl.a1.unit10.lesson01.teach.aankleden:
    title: 옷 입기
    gloss: 옷을 입다 → 저는 옷을 입어요
    note: '*Zich aankleden*은 재귀동사이면서 분리동사예요. *ik*와 함께 쓰면 *me*를 쓰고 *aan*을 끝으로 보내요: *Ik kleed me aan*.'
  nl.a1.unit10.lesson01.teach.ontbijten:
    title: 아침 먹기
    gloss: 아침을 먹다 → 저는 아침을 먹어요
    note: '*Ontbijten*은 분리되지 않아요: *Ik ontbijt*.'
  nl.a1.unit10.lesson01.teach.werken:
    title: 직업
    gloss: 일하다 → 저는 일해요
    note: '*Werken*은 분리되지 않아요: *Ik werk*.'
  nl.a1.unit10.lesson01.teach.eten:
    title: 먹다
    gloss: 먹다 → 저는 먹어요
    note: '*eten*의 *ik* 형태는 *eet*예요: *Ik eet*.'
  nl.a1.unit10.lesson01.teach.afwassen:
    title: 설거지하다
    gloss: 설거지하다 → 저는 설거지를 해요
    note: '*Afwassen*은 분리돼요: *Ik was af*. 접두사 *af*는 문장 끝으로 가요.'
  nl.a1.unit10.lesson01.teach.slapen:
    title: 자다
    gloss: 자다 → 저는 자요
    note: '*Slapen*은 분리되지 않아요. *ik* 형태는 장모음을 써요: *Ik slaap*.'
  nl.a1.unit10.lesson02.teach.split_rule:
    title: 분리 규칙
    gloss: '일반적인 주절에서는 동사의 앞부분이 문장 끝으로 가요: opstaan → Ik sta op.'
    note: '*Ik opsta*라고 하지 마세요. 본동사를 활용하고, 짧은 접두사는 주절 끝에 두세요.'
  nl.a1.unit10.lesson02.teach.opstaan_split:
    title: 문장 속의 Opstaan
    gloss: '일어나다: 저는 7시에 일어나요.'
    note: 시간 표현은 *sta*와 끝에 오는 접두사 *op* 사이에 들어가요.
  nl.a1.unit10.lesson02.teach.aankleden_split:
    title: 문장 속의 Aankleden
    gloss: '옷을 입다: 저는 옷을 입어요.'
    note: 규칙은 *Ik* + *kleed* + *me* + *aan*이에요. *Aan*은 끝에 남아요.
  nl.a1.unit10.lesson02.teach.afwassen_split:
    title: 문장 속의 Afwassen
    gloss: '설거지하다: 저는 식사 후에 설거지를 해요.'
    note: '*Na het eten*은 *was*와 끝에 오는 접두사 *af* 사이에 들어가요.'
  nl.a1.unit10.lesson02.teach.contrast:
    title: 분리되지 않는 동사
    gloss: '분리되지 않아요: 저는 아침을 먹어요. 저는 일해요. 저는 자요. 문장 끝에 오는 부분이 없어요.'
    note: '*Ontbijten*, *werken*, *slapen*은 이런 주절에서 하나의 동사 형태로 그대로 있어요.'
  nl.a1.unit10.lesson03.teach.get_up_time:
    title: 7시 반에 일어나요
    gloss: 저는 7시 30분에 일어나요.
    note: 네덜란드어의 시각 표현을 떠올려 보세요. *half acht*는 7시에서 8시로 가는 중간, 즉 7시 30분이에요. *Op*는 끝에 그대로 있어요.
  nl.a1.unit10.lesson03.teach.dress_time:
    title: 8시 15분 전에 옷을 입어요
    gloss: 저는 7시 45분에 옷을 입어요.
    note: 시간 표현은 끝에 오는 분리 접두사 *aan* 앞에 와요.
  nl.a1.unit10.lesson03.teach.breakfast_time:
    title: 8시에 아침을 먹어요
    gloss: 저는 8시에 아침을 먹어요.
    note: 시각 앞에는 *om*을 써요. *Ontbijt*는 분리되지 않아요.
  nl.a1.unit10.lesson03.teach.work_time:
    title: 9시부터 5시까지 일해요
    gloss: 저는 9시부터 5시까지 일해요.
    note: '*Van ... tot ...*는 시작 시각과 끝나는 시각을 나타내요.'
  nl.a1.unit10.lesson03.teach.eat_time:
    title: 6시 반에 먹어요
    gloss: 저는 오후 6시 30분에 먹어요.
    note: '*''s Avonds*는 저녁임을 분명히 해 주므로, 여기서 *half zeven*은 18:30이에요.'
  nl.a1.unit10.lesson03.teach.sleep_time:
    title: 11시에 자요
    gloss: 저는 11시에 자요.
    note: '시각 앞에는 *om*을 써요: *om elf uur*.'
  nl.a1.unit10.lesson04.teach.eerst_dan_daarna:
    title: 먼저, 그다음, 그 후에
    gloss: 먼저, 그다음, 그 후에
    note: '*Eerst*는 첫 번째 활동, *dan*은 그다음 활동, *daarna*는 앞선 일과 이어지는 활동을 나타내요.'
    example_gloss:
    - 먼저 저는 일어나요.
    - 그다음에 저는 옷을 입어요.
    - 그 후에 저는 아침을 먹어요.
  nl.a1.unit10.lesson04.teach.sequence:
    title: 세 단계로 된 아침
    gloss: 먼저 저는 일어나요. 그다음에 옷을 입어요. 그 후에 아침을 먹어요.
    note: '분리 접두사는 여전히 절의 끝에 와요: *sta ik op*, *kleed ik me aan*.'
  nl.a1.unit10.lesson04.teach.sequence_order_note:
    title: ik 앞의 동사
    gloss: 'eerst, dan, daarna 뒤에서는 동사가 ik 앞에 와요: Daarna ontbijt ik.'
    note: 순서를 나타내는 말로 시작하면 *Ik ontbijt*가 *Daarna ontbijt ik*로 바뀌어요.
  nl.a1.unit10.lesson05.teach.routine_text:
    title: 나의 하루
    gloss: 나의 하루 — 저는 7시 30분에 일어나요. 그 후에 옷을 입고, 8시에 아침을 먹어요. 9시부터 5시까지 일해요. 오후 6시 30분에 밥을 먹어요. 그 후에 설거지를 해요. 11시에 자요.
    note: 활동의 순서와 시각을 모두 살피며 읽으세요. 분리동사가 쓰인 절 끝에 *op*, *aan*, *af*가 오는 것을 눈여겨보세요.
    glosses:
      Mijn: 나의
      dag: 날
      sta: 일어나다 (op와 함께)
      half: 다음 정각으로 가는 중간 (half acht = 7:30)
      acht: 여덟
      Daarna: 그 후에
      kleed: 옷을 입다 (me ... aan과 함께)
      uur: 시 / 시간
      ontbijt: 아침을 먹다
      werk: 일하다
      negen: 아홉
      vijf: 다섯
      zeven: 일곱, 7
      avonds: 저녁에, 오후에
      eet: 먹다
      was: 설거지하다 (af와 함께)
      elf: '11'
      slaap: 자다
  nl.a1.unit10.lesson06.teach.question:
    title: 하루에 대해 묻기
    gloss: 'Lotte: Omar, 하루가 어떻게 되나요?'
    note: '*Hoe ziet jouw dag eruit?*는 상대에게 하루를 이야기해 달라고 할 때 쓰는 편한 표현이에요. *Eruitzien*은 분리동사예요: *ziet ... eruit*.'
  nl.a1.unit10.lesson06.teach.morning:
    title: Omar의 아침
    gloss: 'Omar: 저는 7시 30분에 일어나요. 그다음에 옷을 입고, 8시에 아침을 먹어요.'
    note: Omar는 아침 활동 세 가지를 이어서 말하고, *op*와 *aan*을 각 절의 끝에 둬요.
  nl.a1.unit10.lesson06.teach.work:
    title: Omar의 근무 시간
    gloss: 'Lotte: 언제 일해요? Omar: 9시부터 5시까지 일해요.'
    note: Lotte와 Omar는 서로 편한 사이에 쓰는 *je*를 써요.
  nl.a1.unit10.lesson06.teach.evening:
    title: Omar의 저녁
    gloss: 'Omar: 저녁 6시 30분에 밥을 먹어요. 그다음에 설거지를 해요. 11시에 자요.'
    note: '시각이나 *daarna*로 문장을 시작하면 동사가 *ik* 앞에 와요: *eet ik*, *was ik*, *slaap ik*. *Af*는 끝에 남아요.'
  nl.a1.unit10.lesson06.teach.lotte:
    title: Lotte의 아침
    gloss: 'Lotte: 저는 6시에 일어나지만, 6시 30분이 되어서야 아침을 먹어요.'
    note: 여기서 *Pas*는 '~에야 비로소'라는 뜻이에요. Lotte는 일어나는 시각과 아침을 먹는 시각을 대비해서 말해요.
