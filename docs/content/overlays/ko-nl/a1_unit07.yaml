  nl.a1.unit07.lesson04.teach.market_labels:
    title: 시장 가격표
    gloss: '사과: 1킬로그램당 €2,50. 배: 1킬로그램당 €3,00. 토마토: 1킬로그램당 €2,00. 파프리카: 개당 €1,00.'
    note: '*per kilo*는 ''킬로당'', *per stuk*는 ''개당''이라고 읽어요. 네덜란드어 가격표에서는 소수점 자리에 쉼표를 써요.'
    glosses:
      Appels: 사과
      kilo: 킬로그램
