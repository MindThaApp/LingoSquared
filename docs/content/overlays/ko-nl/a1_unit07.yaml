    gloss: 토마토 한 파운드(500g) 주세요.
    note: 상인이 *Hoeveel wilt u?*라고 물을 때 할 수 있는 자연스럽고 완전한 짧은 대답이에요.
  nl.a1.unit07.lesson04.teach.prijskaartje:
    title: 가격표
