    gloss: 카드로 결제할 수 있나요?
    note: '*Pinnen*은 단말기에 체크카드나 신용카드로 결제할 때 일상에서 쓰는 네덜란드어 동사예요.'
  nl.a1.unit07.lesson06.teach.opening:
    title: 인사하고 가격 묻기
    gloss: '상인: 안녕하세요. 무엇을 드릴까요? 로테: 안녕하세요. 사과 1킬로에 얼마예요?'
    note: 손님과 상인이 나누는 친근하고 공손한 대화예요.
  nl.a1.unit07.lesson06.teach.purchase:
    title: 수량 정하기
    gloss: '상인: 1킬로에 2유로 50센트예요. 로테: 그럼 1킬로 주세요.'
    note: 앞 대화에서 사과 이야기가 나왔으니, 로테는 자연스럽게 *een kilo*라고만 말할 수 있어요.
  nl.a1.unit07.lesson06.teach.payment:
    title: 카드로 결제하기
    gloss: '상인: 합해서 2유로 50센트예요. 로테: 카드로 결제할 수 있나요? 상인: 네, 물론이죠.'
    note: '*Kan ik pinnen?*은 결제할 때 쓰는 평범하고 실용적인 질문이에요.'
  nl.a1.unit07.lesson06.teach.closing:
    title: 대화 마무리하기
