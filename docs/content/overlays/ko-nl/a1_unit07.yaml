    gloss: 시장, 가게, 가판대
    note: '*De markt*는 일반적인 시장이나 정기적으로 열리는 야외 시장을 뜻해요. *De winkel*은 가게예요. *Kraam*은 야외 시장의 가판대예요.'
    example_gloss:
    - 저는 시장에 가요.
    - 저는 가게에 가요.
    - 그 가판대에서는 사과를 팔아요.
  nl.a1.unit07.lesson01.teach.appels_peren_tomaten_paprikas:
    title: 사과, 배, 토마토, 파프리카
    gloss: 사과, 배, 토마토, 파프리카
    note: 단수는 *appel*, 복수는 *appels*예요. 단수는 *peer*, 복수는 *peren*이에요. 단수는 *tomaat*, 복수는 *tomaten*이에요. 네덜란드어에서 *paprika*는 파프리카(피망의 한 종류)를 뜻하고, 복수는 *paprika's*로 써요.
    example_gloss:
    - 사과를 사고 싶어요.
    - 배를 사고 싶어요.
    - 토마토를 사고 싶어요.
    - 파프리카를 사고 싶어요.
  nl.a1.unit07.lesson02.teach.kilo:
    title: 1킬로그램
    gloss: 1킬로그램
    note: '*Een kilo*는 1킬로그램이에요.'
    example_gloss: 사과 1킬로그램 주세요.
  nl.a1.unit07.lesson02.teach.per_kilo:
    title: Per kilo
    gloss: 킬로그램당
    note: 시장의 가격표에는 흔히 킬로그램당 가격이 적혀 있어요.
  nl.a1.unit07.lesson02.teach.ask_apples:
    title: 사과 1킬로그램은 얼마예요?
    gloss: 사과 1킬로그램은 얼마예요?
    note: '*Hoeveel kost ...?*는 가격을 물을 때 써요. 여기서 값이 나가는 대상은 *een kilo*이므로 단수형 *kost*를 써요.'
  nl.a1.unit07.lesson02.teach.answer_apples:
    title: 사과 1킬로그램은 €2,50예요
    gloss: 사과 1킬로그램은 €2,50예요.
    note: '네덜란드어에서는 가격의 소수점을 쉼표로 써요: €2,50.'
  nl.a1.unit07.lesson02.teach.spoken_price:
    title: 2유로 50센트
    gloss: €2,50 — 2유로 50센트
    note: €2,50은 보통 *en*이나 *cent* 없이 *twee euro vijftig*라고 말해요.
  nl.a1.unit07.lesson03.teach.gram_pond_stuk_stuks:
    title: 그램, 파운드, 한 개, 두 개
    gloss: 100그램, 한 파운드(500그램), 한 개, 두 개
    note: 네덜란드어에서는 숫자 뒤에 *grammen*이 아니라 *gram*을 써요. 일상 네덜란드어에서 *een pond*는 500그램을 뜻해요. 오래된 비공식 표현이고 공식 미터법 단위는 아니에요. *Per stuk*는 한 개마다 가격이 따로 있다는 뜻이에요. 개수만 따로 말할 때 1보다 큰 수에는 *twee stuks*처럼 *stuks*를 써요.
    example_gloss:
    - 치즈 100그램 주세요.
    - 사과 한 파운드 주세요.
    - 하나 주실 수 있나요?
    - 두 개 주세요.
