      Tomaten: 토마토
      stuk: 개
  nl.a1.unit07.lesson05.teach.what_would_you_like:
    title: 무엇을 드릴까요?
    gloss: 무엇을 드릴까요?
    note: '*Wat mag het zijn?*은 시장 상인이나 가게 직원이 건네는 흔하고 친근한 질문이에요.'
  nl.a1.unit07.lesson05.teach.take_pears:
    title: 그럼 배 1킬로 주세요
    gloss: 그럼 배 1킬로 주세요.
    note: '*Dan neem ik ...*는 가격을 듣고 나서 살 것을 정할 때 쓰는 자연스러운 표현이에요.'
  nl.a1.unit07.lesson05.teach.anything_else:
    title: 더 필요하신 건 없으세요?
    gloss: 더 필요하신 건 없으세요?
    note: 상인이 자주 덧붙이는 짧은 질문이에요.
  nl.a1.unit07.lesson05.teach.no_thanks:
    title: 아니요, 괜찮습니다
    gloss: 아니요, 괜찮습니다.
    note: '*Dank u*는 상인에게 쓰는 높임말 *u*와 어울리는 표현이에요.'
  nl.a1.unit07.lesson05.teach.total:
    title: 합해서 3.00유로예요
    gloss: 합해서 3.00유로예요. 3유로요.
    note: '*Dat is dan ...*은 상인이 총액을 말할 때 흔히 쓰는 표현이에요. 글로 쓴 가격 €3,00은 *drie euro*라고 읽어요.'
  nl.a1.unit07.lesson05.teach.pin:
