    title: 인사와 첫 만남
lessons:
  nl.a1.unit01.lesson01.jij_je_en_u:
    title: 친근한 jij/je와 격식 있는 u
  nl.a1.unit01.lesson02.groeten_en_welzijn:
    title: 인사하기와 안부 묻기
  nl.a1.unit01.lesson03.namen:
    title: 이름 주고받기
  nl.a1.unit01.lesson04.herkomst_en_taal:
    title: 출신과 언어
  nl.a1.unit01.lesson05.taalcafe:
    title: 언어 카페에서 사람 만나기
  nl.a1.unit01.lesson06.eerste_ontmoeting:
    title: 첫 만남 마무리하기
teaching:
  nl.a1.unit01.lesson01.teach.hallo_hoi:
    title: 안녕하세요와 안녕
    gloss: 안녕하세요 / 안녕
    note: '*Hallo*는 중립적이어서 친근한 자리에서도 격식 있는 자리에서도 쓸 수 있어요. *Hoi*는 흔히 쓰는 친근한 인사예요.'
    example_gloss:
    - 안녕하세요, 여기 처음 오셨어요?
    - 안녕, 나는 Noor야.
  nl.a1.unit01.lesson01.teach.jij_je_u:
    title: '너/당신: 친근한 형태와 격식 있는 형태'
    gloss: 너(강조, 친근) / 너(강조 없음, 친근) / 당신(격식)
    note: '*Jij*는 친근한 단수형으로, 강조하거나 대조할 때 써요. *Je*는 일상 대화에서 강세 없이 쓰는 일반적인 친근한 단수형이에요. *U*는 존중의 거리를 나타내요. 네덜란드에서는 낯선 연장자나 공식적인 관계에서 자연스럽게 쓰지만, 많은 가게나 직장에서는 성인끼리도 jij/je를 흔히 써요.'
    example_gloss:
    - 너 여기 처음이야? (친근, 강조)
    - 너 여기 처음이구나. (친근, 강조 없음)
    - 여기 처음 오셨어요? (격식)
  nl.a1.unit01.lesson01.teach.informal_new:
    title: 또래에게 처음 왔는지 묻기
    gloss: 여기 처음이에요?
    note: 의문문에서는 *jij bent*가 *ben jij*가 돼요. *jij*가 동사 뒤에 오면 -t가 빠져요.
  nl.a1.unit01.lesson01.teach.formal_new:
    title: 격식 있게 처음 왔는지 묻기
    gloss: 여기 처음 오셨어요?
    note: '*u*와 함께 쓸 때는 *bent u*라고 해요. -t가 그대로 남아요.'
  nl.a1.unit01.lesson01.teach.register_rule:
    title: '''당신''의 형태 고르기'
    gloss: 'jij/je: 친근한 표현 · u: 격식 있거나 공손한 표현'
    note: 친구, 또래, 아이들에게, 그리고 현대의 편한 자리에서는 *jij/je*를 써요. 관계상 존중이나 거리가 필요할 때는 *u*를 써요. 선호는 사람마다 다르니 상대방을 따라 하세요.
  nl.a1.unit01.lesson02.teach.goedemorgen_tot_goedenavond:
    title: 아침, 오후, 저녁 인사
    gloss: 좋은 아침이에요 / 좋은 오후예요 / 좋은 저녁이에요
    note: '*Goedemorgen*은 아침에, 보통 정오쯤까지 써요. *Goedemiddag*은 정오쯤부터 오후 동안 써요. *Goedenavond*는 저녁 인사예요.'
    example_gloss:
    - 좋은 아침이에요! 잘 지내세요?
    - 안녕하세요, 어떻게 지내세요? (격식)
    - 안녕하세요! 여기 처음 오셨어요?
  nl.a1.unit01.lesson02.teach.hoe_gaat_het:
    title: 어떻게 지내요?
    gloss: 안녕하세요?
    note: '*Hoe gaat het?*는 안부를 물을 때 흔히 쓰는 중립적인 표현이에요.'
  nl.a1.unit01.lesson02.teach.hoe_gaat_met_je:
    title: 잘 지내? 친근한 표현
    gloss: 안녕하세요?
    note: '*Met je*는 말을 거는 상대를 분명하게 가리키며 친근한 표현이에요.'
  nl.a1.unit01.lesson02.teach.hoe_gaat_met_u:
    title: 안녕하세요, 잘 지내세요? 격식 있는 표현
    gloss: 안녕하세요?
    note: 격식 있게 말해야 하는 자리에서는 *met u*를 써요.
  nl.a1.unit01.lesson02.teach.goed_dank_je:
    title: '잘 지내, 고마워: 친근한 표현'
    gloss: 잘 지내요, 고마워요.
    note: '*Dank je*는 친근한 말투와 어울려요.'
  nl.a1.unit01.lesson02.teach.goed_dank_u:
    title: '잘 지내요, 감사합니다: 격식 있는 표현'
    gloss: 잘 지내요, 고마워요.
    note: '*Dank u*는 격식 있는 말투와 어울려요.'
  nl.a1.unit01.lesson02.teach.prima:
    title: 아주 좋아요
    gloss: 아주 좋아요 / 괜찮아요
    note: '*Prima*는 짧고 긍정적인 대답이에요.'
    example_gloss: 아주 좋아요, 고마워요.
  nl.a1.unit01.lesson02.teach.niet_slecht:
    title: 나쁘지 않아요
    gloss: 나쁘지 않아요
    note: '*Niet slecht*는 보통 약간 긍정적인 대답이에요.'
  nl.a1.unit01.lesson02.teach.en_met_jou:
    title: 너는 어때? 친근한 표현
    gloss: 당신은요?
    note: '*Jou*는 *met* 뒤에서 쓰는, 강세가 있는 친근한 형태예요.'
  nl.a1.unit01.lesson02.teach.en_met_u:
    title: 당신은 어때요? 격식 있는 표현
    gloss: 당신은요?
    note: '*U*를 쓰면 되묻는 질문도 격식을 유지해요.'
  nl.a1.unit01.lesson03.teach.hoe_heet_je:
    title: 격식 없이 이름 묻기
    gloss: 성함이 어떻게 되세요?
    note: '*Hoe heet je?*는 이름을 묻는 일반적인 친근한 표현이에요.'
  nl.a1.unit01.lesson03.teach.hoe_heet_u:
    title: 격식 있게 이름 묻기
    gloss: 성함이 어떻게 되세요?
    note: '*Hoe heet u?*는 공손한 표현이에요. *Wat is uw naam?*은 행정적인 느낌이 나는 또 다른 격식 표현인데, 여기서는 다루지 않아요.'
  nl.a1.unit01.lesson03.teach.ik_heet_noor:
    title: 이름 말하기
    gloss: 제 이름은 Noor예요.
    note: '*Ik heet ...*는 이름을 말하는 직접적이고 표준적인 방법이에요.'
  nl.a1.unit01.lesson03.teach.ik_ben_noor:
    title: 자연스럽게 자기소개하기
    gloss: 저는 Noor예요.
    note: '*Ik ben ...*은 말로 하는 자기소개에서 특히 흔해요.'
  nl.a1.unit01.lesson03.teach.mijn_naam:
    title: 제 이름은 ~예요
    gloss: 제 이름은 Noor예요.
    note: '*Mijn naam is ...*는 맞는 표현이지만 *Ik ben ...*이나 *Ik heet ...*보다 조금 더 또렷하게 말하는 느낌이에요.'
  nl.a1.unit01.lesson03.teach.leuk_ontmoeten:
    title: 만나서 반가워요
    gloss: 만나서 반갑습니다.
    note: 첫 만남에서 친근하고 자연스럽게 쓰는 표현이에요.
  nl.a1.unit01.lesson03.teach.aangenaam:
    title: 처음 뵙겠습니다
    gloss: 처음 뵙겠습니다
    note: '*Aangenaam*은 관례적인 표현으로, *Leuk je te ontmoeten*보다 더 격식 있어요.'
    example_gloss: 처음 뵙겠습니다! 저는 Noor예요.
  nl.a1.unit01.lesson04.teach.where_from_informal:
    title: 어디 출신인지 묻기
    gloss: 어디에서 오셨어요?
    note: '*Kom je*는 친근한 의문문 형태예요.'
  nl.a1.unit01.lesson04.teach.where_from_formal:
    title: 격식 있게 어디 출신인지 묻기
    gloss: 어디에서 오셨어요?
    note: '*u*와 함께 쓰면 동사는 *komt*가 돼요: *Waar komt u vandaan?*'
  nl.a1.unit01.lesson04.teach.from_netherlands:
    title: 네덜란드 출신
    gloss: 저는 네덜란드에서 왔어요.
    note: 출신 국가 앞에는 *uit*를 써요.
  nl.a1.unit01.lesson04.teach.from_belgium:
    title: 벨기에 출신
    gloss: 저는 벨기에에서 왔어요.
    note: '*België*는 두 번째 e 위에 분음 부호가 있어요.'
  nl.a1.unit01.lesson04.teach.from_germany:
    title: 독일 출신
    gloss: 저는 독일에서 왔어요.
    note: '*Duitsland*는 나라 이름이고 *Duits*는 언어 이름이에요.'
  nl.a1.unit01.lesson04.teach.dutch_nationality:
    title: 네덜란드 국적
    gloss: 저는 네덜란드 사람이에요.
    note: '*Nederlands*는 네덜란드어를 뜻할 뿐 아니라 네덜란드 국적을 나타낼 수도 있어요.'
  nl.a1.unit01.lesson04.teach.belgian_nationality:
    title: 벨기에 국적
    gloss: 저는 벨기에 사람이에요.
    note: 여기서 *Belgisch*는 벨기에 국적을 나타내요.
  nl.a1.unit01.lesson04.teach.speak_dutch:
    title: 네덜란드어를 하다
    gloss: 저는 네덜란드어를 해요.
    note: 네덜란드어에서는 언어 이름을 대문자로 시작해요.
  nl.a1.unit01.lesson04.teach.speak_english:
    title: 영어를 하다
    gloss: 저는 영어를 해요.
    note: '*Engels*는 영어를 뜻하는 네덜란드어 단어예요.'
  nl.a1.unit01.lesson04.teach.speak_german:
    title: 독일어를 하다
    gloss: 저는 독일어를 해요.
    note: '*Duits*는 독일어를 뜻하는 네덜란드어 단어예요.'
  nl.a1.unit01.lesson05.teach.taalcafe_bibliotheek:
    title: 언어 카페와 도서관
    gloss: 언어 카페 / 도서관
    note: '*taalcafé*는 다른 사람들과 부담 없이 네덜란드어를 연습하는 모임이에요. 네덜란드의 공공 도서관에서는 언어 카페를 비롯한 지역 행사를 자주 열어요.'
    example_gloss:
    - 저는 언어 카페 때문에 여기 왔어요.
    - 저는 도서관에서 네덜란드어를 배우고 있어요.
  nl.a1.unit01.lesson05.teach.location:
    title: 만나는 장소
    gloss: 언어 카페는 도서관에서 열려요.
    note: 이 문장은 장면의 배경을 설정해 줘요.
  nl.a1.unit01.lesson05.teach.here_for:
    title: 같은 활동에 왔는지 확인하기
    gloss: 언어 카페 때문에 여기 왔어요?
    note: 두 사람이 같은 활동에 왔을 때 친근하게 말을 거는 자연스러운 표현이에요.
  nl.a1.unit01.lesson05.teach.yes_here_for:
    title: 활동 확인해 주기
    gloss: 네, 저는 언어 카페 때문에 여기 왔어요.
    note: 대답에서 활동을 분명하게 다시 말해요.
  nl.a1.unit01.lesson05.teach.learning:
    title: 무엇을 배우는지 말하기
    gloss: 저는 네덜란드어를 배우고 있어요.
    note: '*Leer*는 *leren*(배우다)의 1인칭 형태예요.'
  nl.a1.unit01.lesson05.teach.me_too:
    title: 저도요
    gloss: 저도요.
    note: '*Ik ook*는 공통점을 말하는 짧고 자연스러운 표현이에요.'
  nl.a1.unit01.lesson05.teach.first_time:
    title: 처음인지 묻기
    gloss: 이번이 처음이에요?
    note: 정기적으로 열리는 활동에서 나누는 친근한 대화예요.
  nl.a1.unit01.lesson05.teach.first_time_answer:
    title: 처음이라고 말하기
    gloss: 네, 이번이 처음이에요.
    note: '*Mijn*은 ''나의''라는 뜻이에요.'
  nl.a1.unit01.lesson06.teach.lotte_opening:
    title: Lotte가 대화를 시작해요
    gloss: 'Lotte: 안녕하세요, 저는 Lotte예요. 이름이 뭐예요?'
    note: Lotte는 편안한 모임이라서 반말 투의 *je*를 써요.
  nl.a1.unit01.lesson06.teach.omar_name:
    title: Omar가 이름을 말해요
    gloss: 'Omar: 저는 Omar예요. 만나서 반가워요.'
    note: 이름을 묻는 질문에 답하고, 만난 것을 반가워하는 인사도 해요.
  nl.a1.unit01.lesson06.teach.lotte_origin_question:
    title: Lotte가 출신을 물어요
    gloss: 'Lotte: 저도요! 어디에서 오셨어요?'
    note: '*Jou ook!*은 *Leuk je te ontmoeten*에 대한 자연스럽고 짧은 대답이에요.'
  nl.a1.unit01.lesson06.teach.omar_origin:
    title: Omar가 출신을 말해요
    gloss: 'Omar: 저는 이집트에서 왔어요. 당신은요?'
    note: '*En jij?*는 같은 질문을 편한 말투로 되묻는 표현이에요.'
  nl.a1.unit01.lesson06.teach.lotte_context:
    title: Lotte가 이야기를 이어 가요
    gloss: 'Lotte: 저는 네덜란드에서 왔어요. 언어 카페는 이번이 처음이세요?'
    note: '*Bij het taalcafé*는 활동으로서의 언어 카페에 ''참여한다''는 뜻이에요.'
  nl.a1.unit01.lesson06.teach.omar_language:
    title: Omar가 대답하고 자신이 배우는 것을 말해요
    gloss: 'Omar: 네, 이번이 처음이에요. 저는 네덜란드어를 배우고 있어요.'
    note: Lotte의 질문에 먼저 답한 뒤, 자신에 대한 기본 정보를 하나 덧붙여요.
  nl.a1.unit01.lesson06.teach.tot_ziens:
    title: 작별 인사
    gloss: 안녕히 가세요!
    note: '*Tot ziens*는 격식과 상관없이 두루 쓰는 작별 인사예요.'
  nl.a1.unit01.lesson06.teach.closing:
    title: 자연스러운 마무리
    gloss: 'Lotte: 좋아요! 다음 주에 봐요. Omar: 다음 주에 봐요!'
    note: 두 사람 모두 다시 올 것을 알고 있을 때는 *Tot volgende week*를 서로 되풀이해서 말하는 것이 자연스러워요.
exercises:
  nl.a1.unit01.lesson01.exercise01.choose_informal:
    instruction: '''너''를 뜻하는 친근한 단수형 두 개가 들어 있는 선택지는 무엇일까요?'
    correct_option: jij / je
    distractors:
    - u
    - jij / u
    - je / u
    accepted_answers:
    - value: jij / je
      status: correct
    feedback: Jij와 je는 친근한 단수형이고, u는 격식을 차린 형태예요.
  nl.a1.unit01.lesson01.exercise02.choose_formal:
    instruction: 질문을 완성할 격식 있는 대명사를 고르세요.
    correct_option: u
    distractors:
    - jij
    - je
    - ik
    accepted_answers:
    - value: u
      status: correct
    feedback: Bent u nieuw hier?는 격식을 차린 말투예요.
  nl.a1.unit01.lesson01.exercise03.listen_formal:
    instruction: 듣고 질문에 어울리는 상황을 고르세요.
    correct_option: 격식을 차려 대하는 사람에게 여기가 처음인지 묻고 있어요.
    distractors:
    - 또래에게 여기가 처음인지 묻고 있어요.
    - 격식을 차려 대하는 사람에게 여기에 사는지 묻고 있어요.
    - 격식을 차려 대하는 사람에게 여기 출신인지 묻고 있어요.
    accepted_answers:
    - value: 격식을 차려 대하는 사람에게 여기가 처음인지 묻고 있어요.
      status: correct
    feedback: Bent u nieuw hier?는 격식을 차릴 때 쓰는 u와 bent를 사용해요.
  nl.a1.unit01.lesson01.exercise04.match_register:
    instruction: 각 네덜란드어 표현을 알맞은 말투와 짝지으세요.
    accepted_answers:
    - value:
      - left: jij / je
        right: informeel
      - left: u
        right: formeel of beleefd
      status: correct
