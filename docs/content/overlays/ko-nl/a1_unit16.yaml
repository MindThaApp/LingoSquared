teaching:
  nl.a1.unit16.lesson01.teach.niet_lekker:
    title: 몸이 안 좋을 때
    gloss: 몸이 안 좋아요.
    note: '*Voelen*은 여기서 재귀 동사로 쓰여요(*je*/*me voelen*). *niet lekker*는 어딘가 안 좋다고 말하는 일반적이고 가벼운 표현이에요.'
  nl.a1.unit16.lesson01.teach.ziek:
    title: 아픈
    gloss: 아픈
    note: '*zijn*(~이다)과 함께 쓰는 기본 형용사예요.'
    example_gloss: 저는 아파요.
  nl.a1.unit16.lesson01.teach.ben_ziek:
    title: 아플 때
    gloss: 저는 아파요.
    note: '*Ziek*은 *niet lekker*보다 더 일반적이고 강한 상태를 나타내요.'
  nl.a1.unit16.lesson01.teach.hoofdpijn:
    title: 두통
    gloss: 두통, 머리 아픔
    note: '*hebben* 뒤에는 관사 없이 써요: *Ik heb hoofdpijn*이라고 하고, *Ik heb een hoofdpijn*이라고는 하지 않아요.'
    example_gloss: 머리가 아파요.
  nl.a1.unit16.lesson01.teach.heb_hoofdpijn:
    title: 머리가 아플 때
    gloss: 머리가 아파요.
    note: 네덜란드어에서는 증상을 보통 *hebben*(가지다)과 함께 말해요.
  nl.a1.unit16.lesson01.teach.buikpijn:
    title: 복통
    gloss: 복통, 배 아픔
    note: '*hoofdpijn*과 같이 관사 없이 쓰는 패턴이에요.'
    example_gloss: 배가 아파요.
  nl.a1.unit16.lesson01.teach.heb_buikpijn:
    title: 배가 아플 때
    gloss: 배가 아파요.
    note: '*hoofdpijn*과 같은 *hebben* 패턴이에요.'
  nl.a1.unit16.lesson02.teach.wat_is_er:
    title: 일반적으로 묻기
    gloss: 무슨 일이에요?
    note: 무슨 문제가 있는지 두루 물어볼 때 쓰는 일반적인 표현이에요.
  nl.a1.unit16.lesson02.teach.wat_scheelt:
    title: 자주 쓰는 관용 표현
    gloss: 무슨 일이야?
    note: '*Scheelt eraan*은 고정된 관용 표현이에요(문자 그대로는 ''그것에 무엇이 부족한가''에 가까워요). 단어 그대로 옮기지 마세요.'
  nl.a1.unit16.lesson02.teach.keelpijn:
    title: 인후통
    gloss: 인후통, 목 아픔
    note: '*hoofdpijn*/*buikpijn*과 같이 관사 없이 쓰는 패턴이에요.'
    example_gloss: 목이 아파요.
  nl.a1.unit16.lesson02.teach.heb_keelpijn:
    title: 목이 아플 때
    gloss: 목이 아파요.
    note: 다른 증상들과 같은 *hebben* 패턴이에요.
  nl.a1.unit16.lesson02.teach.gaat_het:
    title: 상대의 상태 살피기
    gloss: 괜찮아요? 아니요, 몸이 안 좋아요.
    note: '*Gaat het?*는 친구 사이에 안부를 확인할 때 아주 흔히 쓰는 가벼운 질문이에요.'
  nl.a1.unit16.lesson03.teach.koorts:
    title: 열
    gloss: 열
    note: 다른 증상처럼 *hebben* 뒤에 관사 없이 써요.
    example_gloss: 열이 나요.
  nl.a1.unit16.lesson03.teach.heb_koorts:
    title: 열이 날 때
    gloss: 열이 나요.
    note: '*hebben* 패턴을 따라요.'
  nl.a1.unit16.lesson03.teach.verkouden:
    title: 감기에 걸렸을 때
    gloss: 감기에 걸린 / 감기에 걸리다
    note: '*hebben*과 쓰는 명사가 아니라 *zijn*과 쓰는 형용사예요. 헷갈리기 쉬운 점이에요.'
    example_gloss: 감기에 걸렸어요.
  nl.a1.unit16.lesson03.teach.ben_verkouden:
    title: 감기에 걸렸다고 말하기
    gloss: 감기에 걸렸어요.
    note: 네덜란드어는 *zijn* + *verkouden*으로 말해요. *Ik heb een verkouden*이라고 하지 마세요.
  nl.a1.unit16.lesson03.teach.zijn_note:
    title: Zijn과 hebben은 기간이 아니라 품사에 따라 정해져요
    gloss: 'Ziek과 verkouden은 형용사라서 zijn을 써요: 저는 아파요, 감기에 걸렸어요. Koorts와 hoofdpijn은 명사라서 hebben을 써요.'
    note: '*zijn*과 *hebben* 중 무엇을 쓸지는 상태가 얼마나 일시적인지가 아니라 문법적 품사(형용사인지, 증상 명사인지)에 따라 정해져요. *koorts*(명사)도 *verkouden*(형용사)만큼 일시적이지만 *zijn*이 아니라 *hebben*과 함께 써요.'
  nl.a1.unit16.lesson04.teach.apotheek:
    title: 약국
    gloss: 약국
    note: 'de 명사예요: *de apotheek*.'
    example_gloss: 약국에 가요.
  nl.a1.unit16.lesson04.teach.waarmee_helpen:
    title: 약사의 인사
    gloss: 무엇을 도와드릴까요?
    note: '*Waarmee kan ik u helpen?*는 표준적인 격식 있는 서비스 인사예요. 1단원과 15단원의 말투 레슨에서 배운 *u* 격식체가 이어져요.'
  nl.a1.unit16.lesson04.teach.iets_tegen:
    title: 증상에 맞는 약 요청하기
    gloss: 두통에 듣는 약 있어요?
    note: '*Iets tegen* + 증상은 약을 부탁할 때 쓰는 자연스러운 표현이에요.'
  nl.a1.unit16.lesson04.teach.tablet:
    title: 알약 한 알
    gloss: 알약
    note: 원래는 het 명사(*het tablet*)이지만, 여기서는 *een tablet*으로 쓰였어요.
    example_gloss: 저는 알약 한 알을 먹어요.
  nl.a1.unit16.lesson04.teach.neem_tablet:
    title: 복용 방법 안내
    gloss: 알약 한 알을 하루에 두 번 드세요.
    note: '*Neem*은 *nemen*(먹다, 가져가다)의 명령형으로, 지시할 때 써요.'
  nl.a1.unit16.lesson04.teach.register_note:
    title: 약국에서 쓰는 말투
    gloss: 약국에서는 공손한 형태 u를 써요.
    note: 약사는 잘 모르는 서비스 직군의 성인이라서, 15단원의 매표소와 같은 말투 규칙이 적용돼요.
  nl.a1.unit16.lesson05.teach.advies:
    title: 약국 조언 메모 읽기
    gloss: '조언: 알약 한 알을 물과 함께 하루에 두 번 드세요. 푹 쉬고 물을 많이 마시세요. 3일이 지나도 여전히 몸이 안 좋나요? 그러면 병원에 가세요.'
    note: 복용량, 약 외의 두 가지 권고, 그리고 언제 의사를 만나야 하는지에 주목하세요.
    glosses:
      Advies: 조언
      neem: 먹다, 복용하다
      keer: 번
      dag: 날
      tablet: 알약
      Rust: 휴식하다
      drink: 마시다
      Voel: 느끼다
      steeds: 아직
      lekker: 잘
      huisarts: 의사 / 주치의
  nl.a1.unit16.lesson06.teach.lotte_ask:
    title: Lotte가 안부를 물어요
    gloss: 'Lotte: 안녕 Omar, 잘 지내? 좀 나아졌어?'
    note: '*Al*(벌써, 이미)은 지난번 이야기한 뒤로 Omar가 좀 나아졌는지 Lotte가 확인하고 있음을 나타내요.'
  nl.a1.unit16.lesson06.teach.omar_still_bad:
    title: Omar는 아직 몸이 안 좋아요
    gloss: 'Omar: 아직 별로야. 아직도 머리가 아프고 피곤해.'
    note: '*Nog steeds*(아직도)는 앞서 말한 두통이 낫지 않았음을 나타내요. *moe*(피곤한)는 새로 배우는 유용한 형용사예요.'
  nl.a1.unit16.lesson06.teach.lotte_ask_tablet:
    title: Lotte가 약에 대해 물어요
    gloss: 'Lotte: 알약 먹었어?'
    note: '*Genomen*은 *nemen*의 과거분사예요. 12단원에서 배운 *heb* + 과거분사 패턴과 같아요.'
  nl.a1.unit16.lesson06.teach.omar_took_tablet:
    title: Omar가 대답해요
    gloss: 'Omar: 응, 알약 먹었어. 이제 쉬려고.'
    note: '*Ga nu rusten*(이제 쉬러 간다)은 가까운 미래를 나타내는 *gaan* + 부정사 패턴이에요.'
  nl.a1.unit16.lesson06.teach.lotte_wish:
    title: Lotte가 쾌유를 빌어요
    gloss: 'Lotte: 좋은 생각이야. 푹 쉬어. 얼른 나아!'
    note: '*Beterschap!*은 빨리 낫기를 바랄 때 쓰는 표준적인 고정 표현이에요.'
  nl.a1.unit16.lesson06.teach.omar_thanks:
    title: Omar가 인사하며 마무리해요
    gloss: 'Omar: 고마워, 내일 봐!'
    note: '*Tot morgen!*은 앞 단원의 작별 인사에 나온 *tot* + 시간 패턴을 다시 써요.'
