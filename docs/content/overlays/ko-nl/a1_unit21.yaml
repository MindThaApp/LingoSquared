teaching:
  nl.a1.unit21.lesson01.teach.blij_verdrietig_boos:
    title: 기쁜, 슬픈, 화난
    gloss: 기쁜, 슬픈, 화난
    note: 기본적이고 흔한 세 가지 감정 단어로, zijn(이다)과 함께 기분을 말할 때 써요.
    example_gloss:
    - 저는 기뻐요.
    - 저는 슬퍼요.
    - 저는 화가 나요.
  nl.a1.unit21.lesson01.teach.ben_blij:
    title: 기쁘다고 말하기
    gloss: 저는 기뻐요.
    note: '*Zijn*(이다) + 감정 형용사가 기본 틀이에요. 한국어는 ''기뻐요''처럼 형용사만 쓰지만, 네덜란드어는 Ik ben blij처럼 zijn이 꼭 필요해요.'
  nl.a1.unit21.lesson01.teach.niet_boos:
    title: 대조되는 감정 말하기
    gloss: 저는 화난 게 아니라 슬퍼요.
    note: '*Niet*은 *boos*를 직접 부정하고, 두 번째 절에서 실제 감정을 말해요.'
  nl.a1.unit21.lesson02.teach.waarom_blij:
    title: 이유 묻기
    gloss: 왜 기뻐요?
    note: '*Waarom*(왜)은 이유를 묻는 기본 의문사예요.'
  nl.a1.unit21.lesson02.teach.blij_omdat_appartement:
    title: 이유 말하기
    gloss: 새 아파트가 생겨서 기뻐요.
    note: '*Omdat*(~때문에)가 이유절을 이끌고, 그 절에서는 동사가 맨 끝으로 가요(*heb*가 *appartement* 뒤로 가요).'
  nl.a1.unit21.lesson02.teach.verdrietig_omdat_regent:
    title: 부정적인 이유
    gloss: 저는 비가 와서 슬퍼요.
    note: 날씨 단원에서 배운 *regent*(비가 오다)를 이유절에 다시 썼어요.
  nl.a1.unit21.lesson03.teach.zenuwachtig:
    title: 긴장한
    gloss: 긴장한
    note: 긴장한 상태를 나타내는 기본 단어예요.
    example_gloss: 첫 근무를 앞두고 긴장돼요.
  nl.a1.unit21.lesson03.teach.eerste_dienst:
    title: 무엇 때문에 긴장하는지 말하기
    gloss: 첫 근무를 앞두고 긴장돼요.
    note: '*Voor*(직역하면 ''~를 위해'')가 긴장하는 대상을 나타내요. 한국어의 ''~이/가 긴장돼요''나 ''~에 대해'' 같은 자리에 네덜란드어는 voor를 써요.'
  nl.a1.unit21.lesson03.teach.geen_zorgen:
    title: 안심시키기
    gloss: 걱정하지 마세요.
    note: '*Maak je geen zorgen*(직역하면 ''스스로 걱정을 만들지 마'')은 안심시킬 때 쓰는 대표적인 고정 표현이에요.'
  nl.a1.unit21.lesson04.teach.hoe_voelt_omar:
    title: 다른 사람의 기분 묻기
    gloss: Omar는 기분이 어때요?
    note: '*Voelen zich*(느끼다, 재귀 표현)는 감정 상태를 묻거나 말할 때 쓰는 기본 표현이고, 16단원 건강 수업의 신체 감각을 말하는 *voelen*과는 달라요.'
  nl.a1.unit21.lesson04.teach.hij_voelt_zich:
    title: 다른 사람의 기분 설명하기
    gloss: 그는 긴장하고 있어요.
    note: '*Zich*(자신)는 3인칭 재귀대명사로, *voelt*와 함께 써요.'
  nl.a1.unit21.lesson04.teach.waarom_voelt_hij:
    title: 왜 그런 기분인지 묻기
    gloss: 그는 왜 긴장해요?
    note: '*waarom*과 *Hij voelt zich zenuwachtig*의 *voelt zich* 패턴을 합친 문장이에요.'
  nl.a1.unit21.lesson05.teach.bericht:
    title: 감정에 관한 메시지 읽기
    gloss: 안녕 Lotte, 혼자 하는 첫 근무가 조금 긴장돼요. 하지만 새 직장과 새 아파트가 생겨서 기쁘기도 해요. 잘될 것 같아요.
    note: 글쓴이가 무엇 때문에 긴장하는지, 무엇 때문에 기쁜지, 전반적으로 어떻게 전망하는지 살펴보세요.
    glosses:
      beetje: 조금
      zenuwachtig: 긴장한
      eerste: 첫 번째의
      dienst: 근무
      alleen: 혼자
      blij: 기쁜
      want: 왜냐하면
      nieuwe: 새로운
      baan: 일
      nieuw: 새로운
      appartement: 아파트
      denk: 생각하다
      komt: 잘 되다 (여기서는 괜찮을 것이다)
  nl.a1.unit21.lesson06.teach.lotte_ask_feeling:
    title: Lotte가 Omar의 기분을 물어요
    gloss: 'Lotte: 안녕, Omar, 첫 근무를 앞두고 기분이 어때요?'
    note: '*Voor je eerste dienst*(첫 근무를 앞두고)는 3과에서 나온 *voor* + 명사 패턴을 다시 쓴 거예요.'
  nl.a1.unit21.lesson06.teach.omar_admit_nervous:
    title: Omar가 긴장된다고 털어놓아요
    gloss: 'Omar: 솔직히 좀 긴장돼요.'
    note: '*Eerlijk gezegd*(솔직히)는 고백하는 느낌을 부드럽게 해 줘요.'
  nl.a1.unit21.lesson06.teach.lotte_reassure:
    title: 로테가 안심시켜 줘요
    gloss: '로테: 걱정하지 마요, 잘할 수 있어요!'
    note: '*Je kunt het goed*(직역하면 ''너는 그것을 잘할 수 있어'')는 격려할 때 쓰는 고정 표현이에요.'
  nl.a1.unit21.lesson06.teach.omar_thanks_helps:
    title: 오마르가 고마워해요
    gloss: '오마르: 고마워요, 정말 도움이 돼요.'
    note: '*Helpt*는 *helpen*(돕다)의 3인칭 형태예요.'
  nl.a1.unit21.lesson06.teach.lotte_predict:
    title: 로테가 결과를 예상해요
    gloss: '로테: 그리고 그다음에는 분명 아주 기쁘고 자랑스러울 거예요.'
    note: '*Vast*(분명히)는 확신에 찬 예측을 나타내요. *trots*(자랑스러운)는 새로 배우는 유용한 형용사예요.'
  nl.a1.unit21.lesson06.teach.omar_agree:
    title: 오마르가 동의해요
    gloss: '오마르: 네, 저도 그렇게 생각해요.'
    note: '*Dat denk ik ook*(직역하면 ''그것을 나도 생각해'')는 상대의 의견에 동의할 때 쓰는 자연스러운 표현이에요.'
  nl.a1.unit21.lesson06.teach.summary_pronouns:
    title: is, zijn, hem으로 요약하기
    gloss: 오마르는 첫 근무 때문에 긴장돼요. 로테가 그를 도와줘요.
    note: '*Is*는 *zijn*(~이다)의 3인칭 형태이고, 여기서 *zijn*은 ''그의''(소유)라는 뜻이에요. *hem*은 ''그를''(목적격 대명사)이라는 뜻이에요. 다른 사람에 대해 말할 때 꼭 필요한 작은 단어 세 개예요.'
