  nl.a1.unit11.lesson03.dag_en_tijd_afspreken:
    title: 날짜와 시간 정하기
  nl.a1.unit11.lesson04.een_bericht_lezen:
    title: 초대 메시지 읽기
  nl.a1.unit11.lesson05.een_plan_schrijven:
    title: 약속 쓰고 확인하기
  nl.a1.unit11.lesson06.lotte_en_omar_maken_een_plan:
    title: Lotte와 Omar가 약속을 잡아요
teaching:
  nl.a1.unit11.lesson01.teach.samen:
    title: 함께
    gloss: 함께
    note: '*Samen*은 그 활동을 사람들이 함께 한다는 것을 분명하게 해 줘요.'
    example_gloss: 우리 같이 커피 마실까요?
  nl.a1.unit11.lesson01.teach.koffie_drinken:
    title: 커피 마시기
    gloss: 커피를 마시다
    note: 네덜란드어는 글자 그대로 *koffie drinken*, 즉 '커피를 마시다'라고 말해요.
  nl.a1.unit11.lesson01.teach.naar_de_film:
    title: 영화 보러 가기
    gloss: 영화 보러 가다
    note: '*Naar de film gaan*은 따로 장소를 나타내는 말을 쓰지 않고 영화관에 간다고 말하는 흔한 표현이에요.'
  nl.a1.unit11.lesson01.teach.zullen_we:
    title: 커피 마실까요?
    gloss: 커피 마실까요?
    note: '*Zullen we ...?*는 함께 할 활동을 제안할 때 쓰는 표준적인 네덜란드어 표현이에요.'
  nl.a1.unit11.lesson01.teach.zullen_note:
    title: Zullen we 사용하기
    gloss: Zullen we + 활동?은 무언가를 함께 하자고 제안하는 일반적인 방법이에요.
    note: '*we* 뒤에 활동을 두고, 동작을 나타내는 동사는 맨 끝에 두세요: *Zullen we koffie drinken?*'
  nl.a1.unit11.lesson01.teach.zin_om:
    title: 영화 보러 가고 싶어요?
    gloss: 영화 보러 가고 싶어요?
    note: '*Heb je zin om ...?*는 상대가 그 활동을 하고 싶은지 편하게 묻는 표현이에요. 여기서는 *gaan* 앞에 *te*를 써요.'
  nl.a1.unit11.lesson02.teach.ja_leuk:
    title: 네, 좋아요!
    gloss: 네, 좋아요!
    note: '*Ja, leuk!*은 짧고 반갑게 수락하는 표현이에요.'
  nl.a1.unit11.lesson02.teach.goed_idee:
    title: 좋은 생각이에요
    gloss: 좋은 생각이에요!
    note: '*Goed idee!*는 제안을 긍정적으로 평가하면서 수락하는 표현이에요.'
  nl.a1.unit11.lesson02.teach.goed_plan:
    title: 좋은 계획이에요
    gloss: 좋은 계획이네요.
    note: 조금 더 완전한 문장으로 긍정적으로 답하는 표현이에요.
  nl.a1.unit11.lesson02.teach.sorry_reason:
    title: 이유를 들어 거절하기
    gloss: 미안해요, 일해야 해서 못 가요.
    note: '*Sorry*는 거절을 부드럽게 해 주고, *want*은 짧은 이유를 이끌어요.'
  nl.a1.unit11.lesson02.teach.no_time:
    title: 시간이 없어요
    gloss: 시간이 없어요.
    note: '*Ik heb geen tijd*는 직접적이지만 평범한 거절 이유예요.'
  nl.a1.unit11.lesson02.teach.polite_decline:
    title: 친절한 거절
    gloss: 미안하다는 말 + 안 된다는 말 + 짧은 이유를 덧붙이면 거절이 부드러워져요.
    note: 대화에서 이유는 꼭 필요하지는 않지만, 말하면 더 공손하고 자연스러워요.
  nl.a1.unit11.lesson03.teach.afspreken:
    title: 만나기로 약속하다
    gloss: 만나기로 약속하다
    note: '*Afspreken*은 *Zullen we* 뒤에서 한 단어로 써요. *We spreken vrijdag af*에서는 *spreken*과 *af*로 나뉘어요.'
    example_gloss: 금요일 2시 반에 만날까요?
  nl.a1.unit11.lesson03.teach.friday_half_three:
    title: 금요일 2시 반에 만나요
    gloss: 금요일 2시 반에 만날까요?
    note: 3단원의 요일과 4단원의 *om* + 시각을 합친 문장이에요.
  nl.a1.unit11.lesson03.teach.half_three_review:
    title: Half drie는 2시 30분이에요
    gloss: half drie = 2:30; om half drie는 약속 시간을 나타내요.
    note: 네덜란드어는 다음 시각을 기준으로 세요. *half drie*는 3시로 가는 중간이라서 2시 30분을 뜻해요.
  nl.a1.unit11.lesson03.teach.date_time:
    title: 날짜와 시간
    gloss: 4월 17일 금요일 3시 15분에
    note: 요일과 월 이름은 소문자로 써요. 날짜에는 *op*를, 시각에는 *om*을 쓰세요.
  nl.a1.unit11.lesson03.teach.confirm_time:
    title: 시간 확인하기
    gloss: 네, 금요일 2시 반 좋아요.
    note: '*Is goed*는 제안한 일정이 괜찮다는 것을 확인해 줘요.'
  nl.a1.unit11.lesson04.teach.bericht_uitnodiging_taalcafe:
    title: 메시지, 초대, 언어 카페
    gloss: 메시지, 초대, 언어 카페
    note: '*Bericht*는 짧은 글이나 디지털 메시지이고, *uitnodiging*은 활동이나 행사에 함께하자고 청하는 초대이며, *taalcafé*(악센트를 그대로 쓰는 한 단어의 복합어)는 모임 장소예요.'
    example_gloss:
    - Lotte에게서 메시지가 왔어요.
    - 언어 카페 초대장이에요.
    - 우리는 언어 카페에서 커피를 마셔요.
  nl.a1.unit11.lesson04.teach.invitation:
    title: Lotte의 초대
    gloss: 안녕 Omar, 4월 18일 토요일 2:30에 언어 카페에서 커피 마실래? Lotte가.
    note: 활동, 날짜, 시간, 장소의 네 가지 정보를 찾으며 읽어 보세요.
    glosses:
      Hoi: 안녕
      zin: 의향 (heb je zin = ~하고 싶어요?)
      zaterdag: 토요일
      april: 4월
      half: 다음 시각으로 가는 중간 (half acht = 7:30)
      drie: 셋
      koffie: 커피
      drinken: 마시다 / 먹다
      taalcafé: 언어 카페
      Groet: 안부 인사
  nl.a1.unit11.lesson05.teach.proposal_message:
    title: 제안 메시지
    gloss: 안녕 Omar, 금요일 2:30에 커피 마실까? Lotte가.
    note: 이 메시지에는 인사, 활동, 요일, 시간, 맺음말이 들어 있어요.
    glosses:
      Hoi: 안녕
      zullen: ~할까요
      vrijdag: 금요일
      half: 다음 시각으로 가는 중간 (half acht = 7:30)
      drie: 셋
      koffie: 커피
      drinken: 마시다 / 먹다
      Groet: 안부 인사
  nl.a1.unit11.lesson05.teach.confirm_message:
    title: 확인 메시지
    gloss: 안녕 Lotte, 응, 좋아! 금요일 2:30 좋아. 금요일에 보자! Omar.
    note: 답장에서는 활동을 받아들이고, 일정을 다시 말해 확인해요.
    glosses:
      Hoi: 안녕
      leuk: 좋다 / 좋아요
      Vrijdag: 금요일
      half: 다음 시각으로 가는 중간 (half acht = 7:30)
      drie: 셋
      goed: 좋게 / 잘 맞다
      Tot: ~까지 / 또 만나요
      vrijdag: 금요일
  nl.a1.unit11.lesson05.teach.message_shape:
    title: 메시지에 들어가는 내용
    gloss: 짧은 메시지에는 활동, 요일이나 날짜, 시간을 써요.
    note: 인사와 맺음말도 쓸모 있지만, 가장 중요한 정보는 활동과 그것이 열리는 때예요.
  nl.a1.unit11.lesson06.teach.proposal:
    title: Lotte가 커피를 제안해요
    gloss: 'Lotte: 금요일에 커피 마실까요? Omar: 네, 좋아요! 몇 시에요?'
    note: Omar는 시간을 묻기 전에 활동을 먼저 수락해요.
  nl.a1.unit11.lesson06.teach.first_time:
    title: Lotte가 처음 제안한 시간
    gloss: 'Lotte: 2:30에요.'
    note: '*Half drie*는 4단원의 규칙대로 2:30을 뜻해요.'
  nl.a1.unit11.lesson06.teach.negotiate:
    title: Omar가 다른 시간을 제안해요
    gloss: 'Omar: 미안해요, 2:30에는 안 돼요. 3:15는 어때요?'
    note: '*Kan het om ...?*는 다른 시간도 괜찮은지 간단히 묻는 표현이에요.'
  nl.a1.unit11.lesson06.teach.confirm:
    title: 최종 계획을 확인해요
    gloss: 'Lotte: 네, 3:15 좋아요. Omar: 좋은 계획이에요. 그럼 금요일 3:15에 만나요.'
    note: 여기서 *afspreken*은 앞쪽의 *spreken*과 끝의 *af*로 나뉘어요.
