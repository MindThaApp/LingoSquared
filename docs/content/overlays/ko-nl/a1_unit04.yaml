    gloss: 14:15 환영
    note: 14.15는 일상적인 12시간제 표현으로 *kwart over twee*라고 말할 수 있어요.
  nl.a1.unit04.lesson05.teach.workshop:
    title: 워크숍 시간
    gloss: 14:45 워크숍
    note: 14.45는 *kwart voor drie*예요. 3시 15분 전이라는 뜻이에요.
  nl.a1.unit04.lesson05.teach.break:
    title: 휴식 시간
    gloss: 15:30 휴식
    note: 15.30은 *half vier*예요. 4시를 향해 가는 중간, 즉 3시 30분이지 4시 30분이 아니에요.
  nl.a1.unit04.lesson05.teach.ask_schedule:
    title: 일정 시각 묻기
    gloss: 워크숍은 몇 시에 시작해요?
    note: '*Begint*로 활동이 언제 시작하는지 물어요.'
  nl.a1.unit04.lesson05.teach.workshop_answer:
    title: 워크숍 시각 말하기
    gloss: 3시 15분 전에요.
    note: 일정표의 14.45는 *kwart voor drie*에 해당해요.
  nl.a1.unit04.lesson06.teach.start_turn:
    title: 언어 카페 시각 확인하기
    gloss: '로테: 금요일에 언어 카페는 몇 시에 시작해요? 오마르: 2시 15분에요, 그러니까 14시 15분이에요.'
    note: 오마르는 두 가지 형태를 모두 말해요. *kwart over twee*와 14.15는 같은 시각이고, 일정표의 환영 시간과도 같아요.
  nl.a1.unit04.lesson06.teach.workshop_turn:
    title: 워크숍에 대해 묻기
    gloss: '로테: 그럼 워크숍은 몇 시에 시작해요? 오마르: 3시 15분 전에요.'
    note: '*Kwart voor drie*는 14:45로, 일정표와 같아요.'
  nl.a1.unit04.lesson06.teach.arrival_turn:
    title: 도착 시각 말하기
    gloss: '로테: 좋아요. 그럼 저는 2시에 거기 갈게요.'
    note: 로테는 14:15 시작보다 15분 일찍인 14:00에 도착할 계획이에요.
  nl.a1.unit04.lesson06.teach.close_turn:
    title: 약속 마무리하기
    gloss: '오마르: 좋아요, 금요일 오후에 봐요!'
    note: '*Vrijdagmiddag*는 ''금요일 오후''를 뜻하는 자연스러운 합성어예요.'
