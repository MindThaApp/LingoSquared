teaching:
  nl.a1.unit04.lesson01.teach.hour:
    title: 시
    gloss: 시
    note: '*Uur*는 정각을 말할 때 숫자 뒤에 와요. *twee uur*는 2시 정각이에요.'
    example_gloss: 2시예요.
  nl.a1.unit04.lesson01.teach.two_oclock:
    title: 2시 정각
    gloss: 2:00 — 2시 정각
    note: 정각은 숫자 뒤에 *uur*를 붙여 말해요.
  nl.a1.unit04.lesson01.teach.three_oclock:
    title: 3시 정각
    gloss: 3:00 — 3시 정각
    note: '*Drie uur*는 정확히 3시예요.'
  nl.a1.unit04.lesson01.teach.half_three:
    title: 3시를 향해 반쯤
    gloss: 2:30 — 2시 30분
    note: 한국어와 달리 네덜란드어 *half drie*는 다가오는 시각을 기준으로 말해요. 3시 30분이 아니라 2시 30분이에요.
  nl.a1.unit04.lesson01.teach.half_rule:
    title: half는 다음 시각을 가리켜요
    gloss: half drie = 3시를 향해 반쯤 = 2:30
    note: '*half* + 시각은 그 시각을 향해 반쯤 왔다는 뜻으로 읽어요. 그래서 *half vier*는 3:30이에요.'
  nl.a1.unit04.lesson01.teach.half_four:
    title: 4시를 향해 반쯤
    gloss: 3:30 — 3시 30분
    note: '*Half vier*는 4시를 향해 반쯤 왔다는 뜻이라서 3:30이에요.'
  nl.a1.unit04.lesson01.teach.time_answer:
    title: 30분 말하기
    gloss: 2시 30분이에요.
    note: '*Het is ...*는 현재 시각을 말할 때 쓰는 기본 틀이에요.'
  nl.a1.unit04.lesson02.teach.quarter:
    title: 15분
    gloss: 15분
    note: '*Kwart*는 *kwart over*, *kwart voor*처럼 정해진 시각 표현에 쓰여요.'
    example_gloss: 15분이에요.
  nl.a1.unit04.lesson02.teach.quarter_past_two:
    title: 2시 15분
    gloss: 2:15 — 2시 15분
    note: '*Kwart over twee*는 2시에서 15분 지난 시각이에요.'
  nl.a1.unit04.lesson02.teach.past_rule:
    title: Over는 '지난'이라는 뜻이에요
    gloss: over = 정각이 지난 뒤
    note: 시각 표현에서 *over*는 방금 지난 시각부터 앞으로 세요.
  nl.a1.unit04.lesson02.teach.quarter_to_three:
    title: 2시 45분
    gloss: 2:45 — 3시 15분 전
    note: '*Kwart voor drie*는 3시가 되기 15분 전이라서 2:45예요.'
  nl.a1.unit04.lesson02.teach.to_rule:
    title: Voor는 '전'이라는 뜻이에요
    gloss: voor = 다음 정각 전
    note: 시각 표현에서 *voor*는 다가오는 다음 시각을 향해요.
  nl.a1.unit04.lesson02.teach.quarter_past_three:
    title: 3시 15분
    gloss: 3:15 — 3시 15분
    note: '*Over*는 방금 지난 시각을 그대로 써요: *kwart over drie*.'
  nl.a1.unit04.lesson02.teach.quarter_to_four:
    title: 3시 45분
    gloss: 3:45 — 3시 45분
    note: '*Voor*는 다가오는 시각을 말해요. *kwart voor vier*는 3:45예요.'
  nl.a1.unit04.lesson03.teach.ask_time:
    title: 시간 묻기
    gloss: 몇 시예요?
    note: '*Hoe laat is het?*는 지금 몇 시인지 묻는 일상적인 표준 질문이에요.'
  nl.a1.unit04.lesson03.teach.tell_time:
    title: 시각 말하기
    gloss: 2시 30분이에요.
    note: 네덜란드어에서는 시각 단어로 *drie*를 쓰기 때문에 이것이 2시 30분이 된다는 점을 기억하세요.
  nl.a1.unit04.lesson03.teach.ask_start:
    title: 활동이 언제 시작하는지 묻기
    gloss: 언어 카페는 몇 시에 시작해요?
    note: '*Hoe laat*는 시각을 묻는 질문을 시작할 때 써요.'
  nl.a1.unit04.lesson03.teach.at_quarter:
    title: 2시 15분에
    gloss: 2시 15분에요.
    note: 행사가 언제 일어나는지 말할 때는 시각 앞에 *om*을 써요.
  nl.a1.unit04.lesson03.teach.at_rule:
    title: 행사 시각에 om 쓰기
    gloss: '~시에: 2시에, 2시 30분에'
    note: '*Het is*로 현재 시각만 말할 때는 *om*을 쓰지 않아요.'
  nl.a1.unit04.lesson03.teach.late:
    title: 늦었는지 묻기
    gloss: 제가 늦었어요?
    note: 여기서 *laat*는 '늦은'이라는 뜻이에요. 시간에 관한 대화에서 자연스럽게 쓰이는 표현이에요.
  nl.a1.unit04.lesson03.teach.on_time:
    title: 제시간에 왔다고 말하기
    gloss: 아니요, 제시간에 왔어요.
    note: '*Op tijd*는 ''제시간에''라는 뜻이에요. *Je*를 쓰면 편한 말투가 돼요.'
  nl.a1.unit04.lesson04.teach.twenty_four_hour:
    title: 14시
    gloss: 14:00 — 14시
    note: 일정표나 안내 방송에서는 24시간제를 자주 써요. *Veertien uur*는 14:00을 헷갈리지 않게 읽는 말이에요.
  nl.a1.unit04.lesson04.teach.eighteen_hour:
    title: 18시
    gloss: 18:00 — 18시
    note: '*Achttien uur*는 오후 6시를 24시간제로 말하는 형태예요.'
  nl.a1.unit04.lesson04.teach.morning:
    title: 아침 7시
    gloss: 7:00 — 아침 7시
    note: '*''s Ochtends*는 ''아침에''라는 뜻이에요. 앞의 *''s*는 고정된 표현의 일부예요.'
  nl.a1.unit04.lesson04.teach.afternoon:
    title: 오후 2시
    gloss: 14:00 — 오후 2시
    note: '*''s Middags*는 정오 무렵부터 시작하는 오후를 가리켜요. 12시간제로 말할 때 14:00과 02:00을 구별해 줘요.'
  nl.a1.unit04.lesson04.teach.evening:
    title: 저녁 8시
    gloss: 20:00 — 저녁 8시
    note: '*''s Avonds*는 늦은 오후 이후부터 자정 무렵까지의 저녁 시간에 써요.'
  nl.a1.unit04.lesson04.teach.night:
    title: 밤 2시
    gloss: 2:00 — 밤 2시
    note: '*''s Nachts*는 밤사이의 시간에 써요. 02:00은 자연스럽게 *twee uur ''s nachts*라고 해요.'
  nl.a1.unit04.lesson04.teach.day_parts:
    title: 하루의 시간대
    gloss: 아침 · 오후 · 저녁 · 밤
    note: 네덜란드어의 시간대 구분은 대략적이에요. *ochtend*는 정오 무렵까지, *middag*는 정오부터 오후 내내, *avond*는 저녁 동안, *nacht*는 밤사이를 가리켜요.
    example_gloss:
    - 저는 아침에 커피를 마셔요.
    - 언어 카페는 오후에 열려요.
    - 저는 저녁에 책을 읽어요.
    - 저는 밤에 자요.
  nl.a1.unit04.lesson05.teach.schedule:
    title: 일정표
    gloss: 시간표
    note: '*Rooster*에는 활동과 그 시각이 적혀 있어요.'
    example_gloss: 저는 시간표를 읽어요.
  nl.a1.unit04.lesson05.teach.opening_hours:
    title: 언어 카페 운영 시간
    gloss: '언어 카페 운영: 14:00–16:00'
    note: 네덜란드 시간표에서는 시와 분 사이에 점을 자주 써요. 14.00은 14:00과 같은 시각이에요.
  nl.a1.unit04.lesson05.teach.welcome:
