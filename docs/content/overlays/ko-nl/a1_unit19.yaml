  nl.a1.unit19.lesson01.teach.wat_voor_weer:
    title: 날씨 묻기
    gloss: 날씨가 어때요?
    note: '*Wat voor* + 명사는 ''어떤 종류의''를 묻는 표현으로, 아주 흔히 쓰는 일반적인 질문이에요.'
  nl.a1.unit19.lesson01.teach.zonnig:
    title: 맑음
    gloss: 날씨가 맑아요.
    note: '*Het is* + 날씨 형용사는 기본 문형이며, 특정한 대상을 가리키지 않는 *het*를 써요.'
  nl.a1.unit19.lesson01.teach.regent:
    title: 비
    gloss: 비가 와요.
    note: '*Regenen*(비가 오다)은 주어를 특정하지 않고 *het regent*처럼 쓰며, 형용사가 따로 필요 없어요.'
  nl.a1.unit19.lesson01.teach.bewolkt:
    title: 흐림
    gloss: 날씨가 흐려요.
    note: '*zonnig*와 같은 *het is* + 형용사 문형이에요.'
  nl.a1.unit19.lesson02.teach.koud:
    title: 추위
    gloss: 오늘은 추워요.
    note: '*Vandaag*(오늘)는 날씨 설명이 언제의 이야기인지 나타내요.'
  nl.a1.unit19.lesson02.teach.warm:
    title: Warm
    gloss: 오늘은 따뜻해요.
    note: 일상적인 날씨 이야기에서 *Warm*은 '따뜻하다'와 '덥다'를 모두 나타내요.
  nl.a1.unit19.lesson02.teach.niet_koud:
    title: 기온 대조하기
    gloss: 춥지 않고 따뜻해요.
    note: '*Niet*은 형용사 *koud* 바로 앞에 와서 그 말을 부정해요.'
  nl.a1.unit19.lesson03.teach.weerbericht:
    title: 일기예보
    gloss: 일기예보
    note: '중성 명사예요: *het weerbericht*는 *weer*(날씨)와 *bericht*(보도)가 합쳐진 복합어예요.'
    example_gloss: 일기예보가 어때요?
