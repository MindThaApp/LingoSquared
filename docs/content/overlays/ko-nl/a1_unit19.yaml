  nl.a1.unit19.lesson04.teach.goed_idee_laten:
    title: 동의하고 제안하기
    gloss: 좋은 생각이에요! 산책해요.
    note: '*Laten we...*(~하자)는 11단원의 *Zullen we...?*와 함께 활동을 제안할 때 흔히 쓰는 또 다른 표현이에요.'
