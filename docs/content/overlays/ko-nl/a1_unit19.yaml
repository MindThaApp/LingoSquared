    note: 앞에서 읽은 일기예보와 똑같아요.
  nl.a1.unit19.lesson06.teach.lotte_suggest_walk:
    title: Lotte가 계획을 제안해요
    gloss: 'Lotte: 그럼 토요일에 산책할까요?'
    note: '*Dan*(그럼)은 Omar가 방금 말한 좋은 날씨와 제안을 바로 연결해요.'
  nl.a1.unit19.lesson06.teach.omar_agree:
    title: Omar가 동의하고 일요일 계획을 말해요
    gloss: 'Omar: 좋은 생각이에요. 그리고 일요일에는 편하게 집에 있어요.'
    note: 여기서 *Lekker*는 '기분 좋게, 편안하게' 같은 뜻의 말로, 형용사나 동사 앞에 붙여 더 매력적으로 들리게 하는 데 흔히 써요.
  nl.a1.unit19.lesson06.teach.lotte_closing:
    title: Lotte가 계획을 확정해요
    gloss: 'Lotte: 좋아요, 그럼 영화를 봐요.'
    note: '*Kijken*(보다)은 *een film*(영화)과 자연스럽게 어울려요.'
