    title: 내일의 날씨
    gloss: 내일은 날씨가 맑아요.
    note: '*Morgen*(내일)이 문장 맨 앞에 오면 그 뒤에서 *is het*의 순서가 바뀌어요.'
  nl.a1.unit19.lesson03.teach.zaterdag_zondag:
    title: 이틀간의 일기예보
    gloss: 토요일은 맑고 따뜻하지만, 일요일은 하루 종일 비가 와요.
    note: '*De hele dag*(하루 종일)는 비가 오는 시간이 길다는 것을 강조해요.'
  nl.a1.unit19.lesson04.teach.wandeling:
