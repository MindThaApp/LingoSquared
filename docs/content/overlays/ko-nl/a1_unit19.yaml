  nl.a1.unit19.lesson06.teach.lotte_ask_weather:
    title: Lotte가 주말 날씨를 물어요
    gloss: 'Lotte: 이번 주말 날씨는 어때요?'
    note: '*Dit weekend*(이번 주말)는 질문이 가까운 미래에 관한 것임을 나타내요.'
