teaching:
  nl.a1.unit22.lesson01.teach.bellen:
    title: 전화하다
    gloss: 전화하다
    note: 전화를 거는 동사의 원형이에요.
    example_gloss: 너에게 전화해야 해요.
  nl.a1.unit22.lesson01.teach.ik_bel_je:
    title: 전화하겠다고 말하기
    gloss: 제가 전화할게요.
    note: '*Bel*은 *bellen*의 ik 형태예요. 네덜란드어는 곧 할 일도 이렇게 현재 시제로 말해요.'
  nl.a1.unit22.lesson01.teach.met_lotte:
    title: 전화 받기
    gloss: 안녕하세요, 로테예요.
    note: '*Met* + 이름(직역하면 ''이름과 함께'')은 전화에서 자신을 밝히는 표준적인 네덜란드어 표현이에요.'
  nl.a1.unit22.lesson01.teach.met_omar:
    title: 오마르도 똑같이 받아요
    gloss: 안녕하세요, 오마르예요.
    note: '*Hallo, met Lotte*와 같은 *met* + 이름 문형이에요.'
  nl.a1.unit22.lesson02.teach.met_wie:
    title: 누가 전화했는지 묻기
    gloss: 누구세요?
    note: '*Met wie spreek ik?*는 모르는 사람이 전화했을 때 쓰는 표준적인 격식 표현이에요.'
  nl.a1.unit22.lesson02.teach.u_spreekt_met:
    title: 격식 있게 자신을 밝히기
    gloss: 로테와 통화하고 계세요.
    note: '*U spreekt met* + 이름은 친근한 *met* + 이름에 대응하는 격식 표현이에요.'
  nl.a1.unit22.lesson03.teach.kun_je_herhalen:
    title: 다시 말해 달라고 부탁하기
    gloss: 다시 말해 줄 수 있어요?
    note: '*Kun je* ...?(~해 줄 수 있어요?)에 *herhalen*(반복하다)과 *dat*(그것)이 이어진 문장이에요.'
  nl.a1.unit22.lesson03.teach.spreek_niet_snel:
    title: 천천히 말해 달라고 부탁하기
    gloss: 너무 빨리 말하지 말아 주세요.
    note: '*Niet zo* + 형용사는 동사가 아니라 정도를 부정해요. ''말하지 마세요''가 아니라 ''그렇게 빠르지 않게''라는 뜻이에요.'
  nl.a1.unit22.lesson03.teach.hoor_niet_goed:
    title: 잘 안 들린다고 말하기
    gloss: 잘 안 들려요.
    note: '*Horen*(듣다)과 *niet goed*(잘 ~않다)는 소리가 잘 들리지 않는다는 뜻이에요. *verstaan*(알아듣다)과는 달라요.'
  nl.a1.unit22.lesson04.teach.sms:
    title: 문자 메시지
    gloss: 문자 메시지
    note: 'de 명사예요: *de sms*. 국제적으로 쓰는 약어를 그대로 가져온 말이에요.'
    example_gloss: 문자 메시지는 로테가 보낸 거예요.
  nl.a1.unit22.lesson04.teach.stuur_sms:
    title: 문자 보내겠다고 말하기
    gloss: 문자 보낼게요.
    note: '*Sturen*(보내다)은 직접 목적어(*een sms*) 앞에 간접 목적어(*je*)가 와요.'
  nl.a1.unit22.lesson04.teach.bel_later_terug:
    title: 다시 전화하겠다고 말하기
    gloss: 나중에 다시 전화할게요.
    note: '*Terug*(다시, 되돌려)는 분리동사에서 끝에 오는 불변화사 문형이에요. *bellen* + *terug*는 ''다시 전화하다''라는 뜻이에요.'
  nl.a1.unit22.lesson05.teach.sms_gesprek:
    title: 문자 대화 읽기
    gloss: '오마르: 안녕 로테, 나한테 전화해 줄 수 있어요? 할 말이 있어요. 로테: 네, 물론이죠. 5분 뒤에 다시 전화할게요.'
    note: 오마르가 무엇을, 왜 부탁하는지, 그리고 로테가 언제 다시 전화한다고 하는지 살펴보세요.
    glosses:
      Hoi: 안녕
      kun: ~할 수 있다
      bellen: 전화하다
      moet: ~해야 하다
      iets: 무언가
      vertellen: 말해 주다
      natuurlijk: 물론
      bel: 전화하다
      vijf: 다섯
      minuten: 분
      terug: 다시 (전화) 걸다
  nl.a1.unit22.lesson06.teach.lotte_open_call:
    title: 오마르가 전화를 받아요
    gloss: '오마르: 여보세요, 오마르예요.'
    note: 앞에서 배운 *met* + 이름 문형을 실제 통화에서 써요. 전화를 받은 사람이 먼저 말하고 이름을 밝혀요.
  nl.a1.unit22.lesson06.teach.omar_answer_glad:
    title: 로테가 자신을 밝혀요
    gloss: '로테: 안녕 오마르, 로테예요. 오마르: 전화해 줘서 반가워요!'
    note: '*Fijn dat* ...(~해서 좋다)는 어떤 일에 대한 긍정적인 반응을 나타내요.'
  nl.a1.unit22.lesson06.teach.lotte_ask_shift:
    title: 로테가 근무에 대해 물어요
    gloss: '로테: 첫 근무는 어땠어요?'
    note: '*Was*는 *zijn*의 단순 과거형이에요. 12과에서 배운 현재완료(hebben/zijn + 과거분사, 예: *Ik heb gewerkt*)와는 다른 구조예요. 다음 줄 바로 뒤의 설명을 참고하세요.'
  nl.a1.unit22.lesson06.teach.omar_report_good:
    title: 오마르가 좋은 소식을 전해요
    gloss: '오마르: 아주 잘 됐어요, 생각보다 더 잘요.'
    note: '*Ging*은 *gaan*(가다)의 단순 과거형으로, 여기서는 ''(일이) 되어 가다''라는 뜻이에요. *dacht*는 *denken*(생각하다)의 단순 과거형이에요.'
  nl.a1.unit22.lesson06.teach.simple_past_note:
    title: Was, ging, dacht는 단순 과거형이에요
    gloss: was → 이다/있다, ging → 가다, dacht → 생각하다
    note: '*Was*, *ging*, *dacht*는 불규칙 단순 과거(verleden tijd) 형태예요. 12과의 현재완료(hebben/zijn + 과거분사)와는 다른 형태이고, 아직 정식으로 배우지는 않아요. 지금은 이 과에 나온 상황에서 was/ging/dacht를 정해진 표현으로 외워 두세요. 단순 과거의 전체 활용 규칙은 이후 단계에서 배워요.'
  nl.a1.unit22.lesson06.teach.lotte_proud:
    title: 로테가 자랑스러워해요
    gloss: '로테: 정말 기쁜 소식이네요! 당신이 자랑스러워요.'
    note: '*Trots op*(~이 자랑스럽다)은 굳어진 표현이에요. *van*이 아니라 반드시 *op*를 써요.'
  nl.a1.unit22.lesson06.teach.omar_thanks_means:
    title: 오마르가 감동해요
    gloss: '오마르: 고마워요, 저한테 큰 의미가 있어요.'
    note: '*Betekent*는 *betekenen*(의미하다)의 3인칭 형태예요. *voor me*(나에게)는 누구에게 중요한지를 나타내요.'
  nl.a1.unit22.lesson06.teach.zijn_possessive:
    title: 그의
    gloss: 그의 첫 근무는 아주 잘 됐어요.
    note: 여기서 *Zijn*은 '이다/있다'라는 동사가 아니라 '그의'라는 소유 표현이에요. 모양이 같은 두 단어는 문맥으로 구별해요.
