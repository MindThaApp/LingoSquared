    title: Scusi, come arrivo al museo?
    gloss: المعذرة، كيف أصل إلى المتحف؟
    note: تفتتح *Scusi* (المعذرة، بصيغة المجاملة) السؤال قبل *come arrivo* (كيف أصل) ويليها المكان المقصود.
