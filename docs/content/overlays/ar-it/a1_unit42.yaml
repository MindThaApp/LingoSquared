  description: 'إيطالية للمبتدئين لوصف المظهر الجسدي الأساسي للشخص: الانطباع عن الطول والعمر، ولون الشعر والعينين، والسؤال الأساسي Com''è؟، ومقارنة مظهر شخصين.'
