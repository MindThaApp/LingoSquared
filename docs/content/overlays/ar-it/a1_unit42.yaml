teaching:
  it.a1.unit42.lesson01.teach.alto_basso:
    title: طويل وقصير
    gloss: طويل / قصير
    note: 'تصف *alto* الشخص الطويل وتصف *basso* الشخص القصير. الصفات الإيطالية تتفق مع الشخص: *alto/alta*، *basso/bassa*.'
    example_gloss:
    - كيارا طويلة.
    - لوكا قصير.
  it.a1.unit42.lesson01.teach.anziano_giovane:
    title: كبير في السن وشاب
    gloss: كبير في السن / شاب
    note: تعطي *anziano* (مسنّ) و*giovane* (شاب) انطباعًا عامًا لا عددًا دقيقًا من السنين. تنتهي *giovane* بـ -e، فهي واحدة للمذكر والمؤنث.
    example_gloss:
    - الجد كبير في السن.
    - ماركو شاب.
  it.a1.unit42.lesson01.teach.per_l_eta:
    title: 'العمر: avere anni أو anziano'
    gloss: 'للتعبير عن العمر الدقيق تستعمل الإيطالية avere + anni: Quanti anni hai? وللانطباع العام تستعمل صفة: Il nonno è anziano.'
    note: تقول الإيطالية حرفيًا «عندي ثلاثون سنة» (*ho trent'anni*). أما الصفة *anziano* فتُستعمل للانطباع عن كِبَر سن الشخص.
  it.a1.unit42.lesson01.teach.chiara_e_alta:
    title: كيارا طويلة ولوكا قصير
    gloss: كيارا طويلة ولوكا قصير.
    note: 'صفتان مرتبطتان بـ *e* (و). كل صفة تتفق مع صاحبها: *alta* (مؤنث) و*basso* (مذكر).'
  it.a1.unit42.lesson02.teach.i_capelli:
    title: الشعر
    gloss: الشعر
    note: '*I capelli* جمع في الإيطالية: فالإيطاليون يتحدثون عن الشعر بصيغة الجمع. أما المفرد *il capello* فيعني شعرة واحدة.'
    example_gloss: شعر ماركو قصير وأسود.
  it.a1.unit42.lesson02.teach.biondi_castani_grigi:
    title: أشقر وبني ورمادي
    gloss: أشقر / بني / رمادي
    note: 'ثلاثة ألوان للشعر بصيغة جمع المذكر لتتفق مع *capelli*: *biondi* و*castani* و*grigi*. وتُستعمل *Neri* (أسود) للشعر أيضًا.'
    example_gloss:
    - شعر جوليا أشقر.
    - شعر لوكا بني.
    - شعر الجد رمادي.
  it.a1.unit42.lesson02.teach.lunghi_corti:
    title: طويل وقصير (للشعر)
    gloss: طويل / قصير (للشعر)
    note: '*Lunghi* (طويل) و*corti* (قصير) بصيغة الجمع مثل *capelli*. أما الكلمة *alto* (طويل القامة) فتُستعمل للأشخاص فقط لا للشعر.'
    example_gloss:
    - شعر كيارا طويل.
    - شعر لوكا قصير.
  it.a1.unit42.lesson02.teach.i_capelli_sono:
    title: Capelli جمع
    gloss: 'Capelli جمع، لذلك تكون الصفة جمعًا أيضًا: i capelli biondi, castani, grigi, neri, lunghi, corti.'
    note: 'تأتي الصفة بعد الاسم وتتفق معه في الجنس والعدد: *capelli lunghi* (جمع مذكر)، *occhi azzurri*.'
  it.a1.unit42.lesson02.teach.per_descrivere_una:
    title: الشعر والعينان مع avere
    gloss: 'لوصف شخص تستعمل الإيطالية الفعل avere مع الشعر والعينين: Giulia ha i capelli biondi e gli occhi azzurri.'
    note: 'تُستعمل أداة التعريف هنا مع الاسم: *i capelli*، *gli occhi*. ويمكنك قول *è bionda* أيضًا، لكن *avere* هو النمط الذي نتعلمه هنا.'
  it.a1.unit42.lesson02.teach.marco_ha_i:
    title: شعر ماركو قصير وأسود
    gloss: شعر ماركو قصير وأسود.
    note: '*Neri* (أسود) جمع مذكر ليتفق مع *capelli*.'
  it.a1.unit42.lesson02.teach.giulia_ha_i:
    title: شعر جوليا طويل وأشقر
    gloss: شعر جوليا طويل وأشقر.
    note: تجمع في جملة طبيعية واحدة مفردات الطول والألوان من هذا الدرس.
  it.a1.unit42.lesson03.teach.gli_occhi:
    title: العيون
    gloss: العيون
    note: '*Occhio* (عين) مذكر؛ وجمعه *occhi* ويأخذ *gli* لأنه يبدأ بحرف علة.'
    example_gloss: عينا ماركو بنيتان.
  it.a1.unit42.lesson03.teach.azzurri_marroni_verdi:
    title: أزرق وبني وأخضر
    gloss: أزرق / بني / أخضر
    note: 'ألوان العيون: *azzurri* (أزرق)، *marroni* (بني)، *verdi* (أخضر). تصلح صيغ الجمع هذه للمذكر والمؤنث.'
    example_gloss:
    - عينا جوليا زرقاوان.
    - عينا لوكا بنيتان.
    - عينا كيارا خضراوان.
  it.a1.unit42.lesson03.teach.anche_gli_occhi:
    title: الألوان تتفق في الجمع
    gloss: 'تأخذ ألوان العيون صيغة الجمع لتتفق مع occhi: occhi azzurri, marroni, verdi.'
    note: 'الصفات التي تنتهي بـ -e في المفرد (*verde*، *marrone*) تنتهي بـ -i في الجمع: *verdi*، *marroni*.'
  it.a1.unit42.lesson03.teach.com_e_giulia:
    title: كيف تبدو جوليا؟
    gloss: كيف تبدو جوليا؟
    note: '*Com''è?* هو السؤال الأساسي عن المظهر. و*Com''è* هي *come è* مع فاصلة عليا بعد حذف حرف e.'
  it.a1.unit42.lesson03.teach.giulia_ha_i:
    title: جوليا شعرها طويل وأشقر وعيناها زرقاوان
    gloss: جوليا شعرها طويل وأشقر وعيناها زرقاوان.
    note: 'جواب نموذجي: *avere* + الشعر + *e* + العينان في جملة واحدة.'
  it.a1.unit42.lesson04.teach.giulia_al_caffe:
    title: جوليا تقدّم نينا
    gloss: 'جوليا: ستأتي فتاة جديدة إلى مقهى اللغات. اسمها نينا.'
    note: تُستعمل *Viene* (تأتي) لتقديم شخص جديد. أما *Si chiama* فتعني «اسمها»، وحرفيًا «تسمّي نفسها».
  it.a1.unit42.lesson04.teach.marco_va_bene:
    title: ماركو يسأل عن مظهرها
    gloss: 'ماركو: حسنًا! كيف تبدو؟'
    note: 'السؤال نفسه مرة أخرى بلا اسم: فالفاعل واضح من السياق.'
  it.a1.unit42.lesson04.teach.giulia_e_bassa:
    title: جوليا تصف طول نينا وشعرها
    gloss: 'جوليا: هي قصيرة وشعرها قصير وأشقر.'
    note: '*È bassa* (هي قصيرة) بصيغة المؤنث *bassa*؛ ثم يأتي وصف الشعر مع *ha*.'
  it.a1.unit42.lesson04.teach.marco_e_gli:
    title: ماركو يسأل عن عينيها
    gloss: 'ماركو: وعيناها؟'
    note: '*E gli occhi?* جملة بلا فعل. تحذف الإيطالية كثيرًا الكلمات التي يوضحها السياق.'
  it.a1.unit42.lesson04.teach.giulia_ha_gli:
    title: جوليا تصف عيني نينا
    gloss: 'جوليا: عيناها خضراوان.'
    note: '*Ha gli occhi verdi*: لا حاجة إلى ضمير فاعل لأن نهاية الفعل تدل على أنها «هي».'
  it.a1.unit42.lesson04.teach.marco_grazie_allora:
    title: ماركو سيتعرّف عليها
    gloss: 'ماركو: شكرًا! إذن سأتعرّف عليها.'
    note: '*La riconosco* (أتعرّف عليها): ضمير المفعول *la* يأتي قبل الفعل.'
  it.a1.unit42.lesson05.teach.luca_e_chiara:
    title: مقارنة بين لوكا وكيارا
    gloss: لوكا وكيارا أخ وأخت، لكنهما يبدوان مختلفين تمامًا. لوكا قصير وشعره قصير بني وعيناه بنيتان. كيارا أطول من لوكا وشعرها طويل بني وعيناها خضراوان. كيف تبدو أنت؟
    note: مقارنة قصيرة تعيد استعمال كل كلمات الألوان والطول التي تعلمناها، وتنتهي بسؤال الوحدة الأساسي موجهًا إلى القارئ.
    glosses:
      fratello: أخ
      sorella: أخت
      sembrano: يبدوان / يظهران
      diversi: مختلف
      basso: قصير
      corti: قصير
      castani: بني
      capelli: الشعر
      marroni: بني
      occhi: العيون
      alta: طويلة (più alta = أطول)
      lunghi: طويل
      verdi: أخضر
      come: كيف (Tu come sei? = كيف تبدو أنت؟)
  it.a1.unit42.lesson05.teach.il_comparativo_si:
    title: 'المقارنة: più ... di'
    gloss: 'تقارن الإيطالية بـ più + صفة + di: Chiara è più alta di Luca.'
    note: 'ضع *più* قبل الصفة و*di* قبل الشخص الذي تقارن به. وتحتفظ الصفة بجنسها: *più alta*، *più alto*.'
  it.a1.unit42.lesson05.teach.chiara_ha_i:
    title: شعر كيارا أطول من شعر لوكا
    gloss: شعر كيارا أطول من شعر لوكا.
    note: '*I capelli più lunghi di Luca*: تبقى الصفة في صيغة الجمع لتتفق مع *capelli*.'
  it.a1.unit42.lesson05.teach.ho_i_capelli:
    title: لدي شعر قصير بني
    gloss: لدي شعر قصير بني.
    note: '*Ho i capelli corti e castani*: نستعمل *avere* لوصف مظهرنا.'
  it.a1.unit42.lesson06.teach.marco_guarda_e:
    title: Marco يلمح Nina
    gloss: 'Marco: انظري، هل تلك Nina؟ شعرها قصير أشقر وعيناها خضراوان.'
    note: '*Guarda* (انظر) هي صيغة الأمر للمخاطب *tu*. وتعني *quella* «تلك» للمرأة أو الفتاة.'
  it.a1.unit42.lesson06.teach.giulia_si_e:
    title: Giulia تؤكد
    gloss: 'Giulia: نعم، إنها Nina!'
    note: تأكيد قصير وطبيعي.
  it.a1.unit42.lesson06.teach.nina_ciao_sei:
    title: Nina تحيّي Marco
    gloss: 'Nina: مرحبًا، هل أنت Marco؟'
    note: '*Sei Marco?* سؤال غير رسمي: *sei* هي صيغة *tu* من الفعل *essere*، لذا لا حاجة إلى ذكر *tu*.'
  it.a1.unit42.lesson06.teach.marco_si_piacere:
    title: Marco يردّ التحية على Nina
    gloss: 'Marco: نعم! سررت بلقائك يا Nina.'
    note: '*Piacere di conoscerti* عبارة تُقال عند لقاء شخص للمرة الأولى؛ و*-ti* تعني «ك» أي المخاطَب.'
  it.a1.unit42.lesson06.teach.nina_piacere_mio:
    title: Nina تردّ التحية
    gloss: 'Nina: تشرفت بمعرفتك أنا أيضًا!'
    note: 'تُنهي الحوار: فقد تعرّف Marco على Nina بنجاح بفضل وصف Giulia السابق.'
