  it.a1.unit17.lesson01.teach.insegnante_commesso:
    title: insegnante, commesso
    gloss: مدرّس، بائع
    note: '*insegnante* (مدرّس) له الصيغة نفسها للمذكر والمؤنث؛ أما *commesso* (بائع) فهو مذكر، ومؤنثه *commessa*.'
    example_gloss:
