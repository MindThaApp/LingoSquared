  it.a1.unit17.lesson01.teach.che_lavoro_fai:
    title: Che lavoro fai?
    gloss: ماذا تعمل؟
    note: '*Che lavoro fai?* (حرفيًا: «أي عمل تعمل؟») هي الطريقة المعتادة للسؤال عن مهنة شخص ما.'
  it.a1.unit17.lesson01.teach.sono_insegnante:
    title: Sono insegnante.
    gloss: أنا معلمة.
    note: 'تُحذف الأداة في الإيطالية قبل المهنة إذا لم يرافقها وصف: *Sono insegnante* وليس *Sono un insegnante*. وهذا قريب من العربية التي نقول فيها «أنا مدرّس» دون أداة.'
  it.a1.unit17.lesson01.teach.sono_commesso:
    title: Sono commesso.
    gloss: أنا بائع.
    note: النمط نفسه دون أداة، كما في *Sono insegnante*.
  it.a1.unit17.lesson02.teach.ufficio_scuola:
    title: l'ufficio, la scuola
    gloss: مكتب، مدرسة
    note: في *l'ufficio* (المكتب) تُختصر الأداة قبل الحرف المتحرك؛ و*la scuola* (المدرسة) مؤنث.
    example_gloss:
