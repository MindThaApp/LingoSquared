teaching:
  it.a1.unit41.lesson01.teach.leggere_fare_sport:
    title: القراءة، ممارسة الرياضة، الطبخ
    gloss: يقرأ، يمارس الرياضة، يطبخ
    note: 'ثلاثة أفعال شائعة للهوايات في صيغة المصدر: *leggere* (يقرأ)، و*fare sport* (يمارس الرياضة)، و*cucinare* (يطبخ). تنتهي المصادر الإيطالية بـ -are أو -ere أو -ire.'
    example_gloss:
    - أحب قراءة كتاب.
    - أمارس الرياضة أيام السبت.
    - أحب الطبخ للأصدقاء.
  it.a1.unit41.lesson01.teach.il_tempo_libero:
    title: وقت الفراغ
    gloss: وقت الفراغ
    note: '*Il tempo libero* اسم مذكر، لذلك يأتي معه *il*. وهو عبارة أساسية للحديث عن الهوايات.'
    example_gloss: في وقت فراغي، أحب القراءة.
  it.a1.unit41.lesson01.teach.nel_mio_tempo:
    title: قول ما تفعله في وقت فراغك
    gloss: في وقت فراغي، أحب القراءة.
    note: '*Leggo* هي صيغة *io* من الفعل *leggere* (يقرأ). تحذف الإيطالية ضمير الفاعل غالبًا، كما تفعل العربية: نقول *Leggo* لا *Io leggo*.'
  it.a1.unit41.lesson02.teach.ascoltare_musica_disegnare:
    title: الموسيقى، الرسم، ألعاب الفيديو
    gloss: يستمع إلى الموسيقى، يرسم، يلعب ألعاب الفيديو
    note: 'ثلاث هوايات أخرى: *ascoltare musica* (الاستماع إلى الموسيقى)، و*disegnare* (الرسم)، و*giocare ai videogiochi* (لعب ألعاب الفيديو).'
    example_gloss:
    - أحب الاستماع إلى الموسيقى.
    - أرسم كثيرًا.
    - أحب لعب ألعاب الفيديو مع الأصدقاء.
  it.a1.unit41.lesson02.teach.ascolto_volentieri_musica:
    title: قول إنك تحب الاستماع إلى الموسيقى
    gloss: أحب الاستماع إلى الموسيقى.
    note: 'يتعدى *Ascoltare* إلى مفعوله مباشرة: *ascolto musica*، دون حرف جر بينهما.'
  it.a1.unit41.lesson02.teach.gioco_volentieri_ai:
    title: قول إنك تحب لعب ألعاب الفيديو مع الأصدقاء
    gloss: أحب لعب ألعاب الفيديو مع الأصدقاء.
    note: '*Con gli amici* تعني مع الأصدقاء. و*Gli* أداة التعريف للجمع قبل اسم مذكر يبدأ بحرف علة.'
  it.a1.unit41.lesson03.teach.sempre_spesso_a:
    title: دائمًا، غالبًا، أحيانًا، أبدًا
    gloss: دائمًا، غالبًا، أحيانًا، أبدًا
    note: 'أربع كلمات للتكرار. تحتاج *Mai* (أبدًا) إلى *non* قبل الفعل: *non gioco mai*.'
    example_gloss:
    - أمارس الرياضة دائمًا أيام السبت.
    - غالبًا ما أقرأ كتابًا.
    - أرسم أحيانًا.
    - لا ألعب ألعاب الفيديو أبدًا.
  it.a1.unit41.lesson03.teach.ogni_settimana_ogni:
    title: كل أسبوع، كل عطلة أسبوع
    gloss: كل أسبوع، كل عطلة أسبوع
    note: 'لا تتغير *Ogni* (كل): *ogni settimana*، *ogni fine settimana*. انظر البطاقة التالية.'
    example_gloss:
    - أطبخ للأصدقاء كل أسبوع.
    - أمارس الرياضة كل عطلة أسبوع.
  it.a1.unit41.lesson03.teach.con_mai_il:
    title: تحتاج mai إلى non؛ ولا تتغير ogni
    gloss: 'مع mai يأخذ الفعل non أيضًا: Non gioco mai. وتبقى ogni كما هي مع كل اسم: ogni settimana، ogni fine settimana.'
    note: 'في العربية نقول «لا ألعب أبدًا»، والإيطالية تقول *non gioco mai* (حرفيًا «لا ألعب أبدًا» بنفي مزدوج: non + mai). وتأتي *ogni* دائمًا قبل اسم مفرد.'
  it.a1.unit41.lesson03.teach.cosa_fai_nel:
    title: السؤال عن وقت الفراغ
    gloss: ماذا تفعل في وقت فراغك؟
    note: هذا هو السؤال الأساسي في هذه الوحدة، استخدمه لتسأل أي شخص عن هواياته.
  it.a1.unit41.lesson04.teach.giulia_passeggiamo_spesso:
    title: جوليا تفتح موضوع الهوايات
    gloss: 'جوليا: كثيرًا ما نتمشى معًا. لكن ماذا تفعل أيضًا في وقت فراغك يا ماركو؟'
    note: '*Passeggiamo* هي صيغة *noi* (نحن) من *passeggiare*. وتأتي *Spesso* بعد الفعل.'
  it.a1.unit41.lesson04.teach.marco_cucino_volentieri:
    title: هوايات ماركو
    gloss: 'ماركو: أحب الطبخ، حتى في البيت. وأمارس الرياضة كثيرًا.'
    note: تدل *Anche a casa* (حتى في البيت) على أن ماركو يطبخ للمتعة، لا في العمل فقط. و*A casa* تعني في البيت، دون أداة تعريف.
  it.a1.unit41.lesson04.teach.giulia_cucini_anche:
    title: جوليا مندهشة
    gloss: 'جوليا: تطبخ في البيت أيضًا؟ أنت تطبخ أصلًا طوال اليوم في العمل!'
    note: تدل *Già* (أصلًا، بالفعل) و*tutto il giorno* (طوال اليوم) على مقدار ما يطبخه ماركو في العمل.
  it.a1.unit41.lesson04.teach.marco_si_ma:
    title: ماركو يشرح
    gloss: 'ماركو: نعم، لكن الطبخ يريحني. وأنت، ماذا تحبين أن تفعلي؟'
    note: 'معنى *Cucinare mi rilassa* حرفيًا «الطبخ يريحني»: النشاط هو الفاعل، و*mi* (ني) هو المفعول به.'
  it.a1.unit41.lesson04.teach.giulia_leggo_volentieri:
    title: هوايات جوليا
    gloss: 'جوليا: أحب القراءة وكثيرًا ما أستمع إلى الموسيقى.'
    note: 'هوايتان مربوطتان بـ *e* (و). يبقى الفعلان بصيغة *io*: *leggo* و*ascolto*.'
  it.a1.unit41.lesson04.teach.marco_giochi_anche:
    title: ماركو يسأل عن ألعاب الفيديو
    gloss: 'ماركو: هل تلعبين ألعاب الفيديو أيضًا؟'
    note: 'يحتفظ سؤال نعم/لا بترتيب الجملة الخبرية ولا تتغير إلا نبرة الصوت: *Giochi anche ai videogiochi?* وتعني *Anche* أيضًا.'
  it.a1.unit41.lesson04.teach.giulia_no_non:
    title: جوليا تجيب
    gloss: 'جوليا: لا، لا ألعب ألعاب الفيديو أبدًا. لكنني أرسم أحيانًا!'
    note: تقابل هذه الإجابة بين *Non ... mai* (أبدًا) و*a volte* (أحيانًا). وتعني *Ma* لكن.
  it.a1.unit41.lesson05.teach.marco_e_io:
    title: مقارنة الهوايات
    gloss: ماركو وأنا كثيرًا ما نتمشى معًا. لكن لدينا هوايات أخرى أيضًا. ماركو يحب الطبخ، حتى في البيت، ويمارس الرياضة كثيرًا. أنا أحب القراءة وكثيرًا ما أستمع إلى الموسيقى. أرسم أحيانًا، لكنني لا ألعب ألعاب الفيديو أبدًا. ماذا تحب أن تفعل في وقت فراغك؟
    note: تلخص رسالة جوليا ما سبق، وتنتهي بسؤال القارئ السؤال الأساسي في هذه الوحدة.
    glosses:
      passeggiamo: نتمشى
      spesso: غالبًا
      insieme: معًا
      altri: أخرى
      cucina: يطبخ
      volentieri: بكل سرور
      casa: البيت (a casa = في البيت)
      sport: الرياضة (fa sport = يمارس الرياضة)
      leggo: القراءة
      ascolto: أستمع
      musica: موسيقى
      disegno: أرسم
      volte: مرات (a volte = أحيانًا)
      videogiochi: ألعاب الفيديو
      mai: أبدًا
      libero: فراغ
      tempo: وقت
  it.a1.unit41.lesson06.teach.marco_cosa_fai:
    title: ماركو يسأل عن عطلة نهاية الأسبوع
    gloss: 'ماركو: ماذا ستفعلين في عطلة نهاية الأسبوع هذه؟'
    note: '*Questo fine settimana* (عطلة نهاية الأسبوع هذه) مذكر، لذلك نقول *questo*. و*Fai* هي صيغة *tu* (أنتَ/أنتِ) من *fare* (يفعل).'
  it.a1.unit41.lesson06.teach.giulia_non_lo:
    title: جوليا لم تقرر بعد
    gloss: 'جوليا: لا أعرف بعد. أحب القراءة، لكنني أريد أيضًا أن أخرج.'
    note: '*Non lo so ancora* (لا أعرف بعد): تدل *lo* على الشيء الذي لا تعرفه وتأتي قبل الفعل. و*Uscire* تعني يخرج.'
  it.a1.unit41.lesson06.teach.marco_facciamo_una:
    title: ماركو يقترح خطة
    gloss: 'ماركو: هل نتمشى معًا؟ ثم أطبخ لنا.'
    note: تُرتّب *Poi* (ثم، بعد ذلك) الخطط بالتسلسل. وتؤكد *Cucino io* (مع *io* بعد الفعل) معنى «أنا من سيطبخ».
  it.a1.unit41.lesson06.teach.giulia_buona_idea:
    title: جوليا توافق
    gloss: 'جوليا: فكرة جيدة! أحب المشي والطبخ كليهما.'
    note: 'تعني *Sia ... sia ...* كلا ... و...: *mi piace sia passeggiare sia cucinare*.'
  it.a1.unit41.lesson06.teach.marco_perfetto_allora:
    title: ماركو يؤكد
    gloss: 'ماركو: ممتاز. إذن نلتقي يوم السبت!'
    note: '*Ci vediamo sabato* (نلتقي يوم السبت): لا أداة تعريف قبل اليوم حين يُقصد اليوم القادم.'
