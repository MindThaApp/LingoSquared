teaching:
  it.a1.unit06.lesson01.teach.madre_padre:
    title: la madre, il padre
    gloss: الأم، الأب
    note: 'في الإيطالية يحمل الاسم أداة تعريف بحسب الجنس: *la* للمؤنث و*il* للمذكر، بينما تكون «ال» في العربية واحدة للمذكر والمؤنث.'
    example_gloss:
    - هذا أبي.
    - هذه أمي.
  it.a1.unit06.lesson01.teach.fratello_sorella:
    title: il fratello, la sorella
    gloss: الأخ، الأخت
    note: '*fratello* مذكر (*il*) و*sorella* مؤنث (*la*).'
    example_gloss:
    - لدي أخ واحد وأخت واحدة.
  it.a1.unit06.lesson01.teach.questo_e_mio_padre:
    title: Questo è mio padre. Questa è mia madre.
    gloss: هذا أبي. هذه أمي.
    note: 'تتطابق *Questo/Questa* (هذا/هذه) في الجنس مع الشخص المشار إليه: *questo* للرجل و*questa* للمرأة.'
  it.a1.unit06.lesson01.teach.nonno_nonna:
    title: il nonno, la nonna
    gloss: الجد، الجدة
    note: النمط نفسه في أداة التعريف للمذكر والمؤنث كما في *padre/madre*.
    example_gloss:
    - جدي يعيش في روما.
    - جدتي تطبخ بشكل ممتاز.
  it.a1.unit06.lesson02.teach.hai_fratelli_o_sorelle:
    title: Hai fratelli o sorelle?
    gloss: هل لديك إخوة أو أخوات؟
    note: '*Hai* (لديك) + كلمة العائلة + *o* (أو) هي الطريقة المعتادة للسؤال عن الإخوة والأخوات.'
  it.a1.unit06.lesson02.teach.ho_un_fratello_e_una_sorella:
    title: Ho un fratello e una sorella.
    gloss: لدي أخ واحد وأخت واحدة.
    note: '*Ho* (لدي) تُستخدم في الجواب مع *un* (واحد، للمذكر) و*una* (واحدة، للمؤنث).'
  it.a1.unit06.lesson02.teach.moglie_marito:
    title: il marito, la moglie
    gloss: الزوج، الزوجة
    note: زوج آخر من المذكر والمؤنث، بنمط أداة التعريف نفسه.
    example_gloss:
    - لدى سام زوجة.
  it.a1.unit06.lesson03.teach.hai_figli:
    title: Hai figli?
    gloss: هل لديك أولاد؟
    note: '*figli* (الأولاد) هو الجمع المستخدم عند السؤال بشكل عام، مهما كان عددهم أو جنسهم.'
  it.a1.unit06.lesson03.teach.ho_due_figli:
    title: Sì, ho due figli. Un maschio e una femmina.
    gloss: 'نعم، لدي ولدان: ولد وبنت.'
    note: '*maschio* (ذكر/ولد) و*femmina* (أنثى/بنت) تحددان جنس الأولاد بعد ذكر العدد الإجمالي.'
  it.a1.unit06.lesson03.teach.figlio_figlia:
    title: il figlio, la figlia
    gloss: الابن، الابنة
    note: هما صيغتا المفرد من *figli*، مع نمط أداة التعريف المعتاد للمذكر والمؤنث.
    example_gloss:
    - لدى إيلينا ابن واحد وابنة واحدة.
