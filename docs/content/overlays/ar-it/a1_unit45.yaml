  it.a1.unit45.lesson04.teach.con_i_mezzi:
    title: in + وسيلة النقل، و a piedi للسير على الأقدام
    gloss: 'مع وسائل النقل تستخدم الإيطالية in: in treno, in bicicletta, in macchina. أما السير على الأقدام فيُقال له a piedi: vado a piedi.'
    note: 'في العربية نقول «بالقطار» مع أداة التعريف، أما في الإيطالية فنقول *in treno* دون أداة تعريف: *in treno* وليس *nel treno*.'
  it.a1.unit45.lesson04.teach.marco_allora_prendo:
    title: Marco يجيب
    gloss: 'Marco: إذن آخذ القطار مع Giulia.'
  it.a1.unit45.lesson05.teach.giulia_viaggia_ogni:
    title: من يتنقل بأي وسيلة؟
    gloss: تسافر Giulia بالقطار كل يوم إلى العمل. يذهب Marco عادةً بالدراجة، لكنه يأخذ القطار أيضًا عندما تمطر. يفضّل Luca الذهاب بالسيارة. تسكن Chiara قريبًا وتذهب إلى العمل سيرًا على الأقدام. وأنت، كيف تذهب إلى العمل؟
    note: 'يقارن النص بين أربع طرق للتنقل وشرط واحد (*quando piove*، أي عندما تمطر). الفعل *andare* (يذهب) شاذ: *vado*، *va*.'
    glosses:
      viaggia: يسافر
      ogni: كل
      giorno: يوم
      treno: قطار
      lavoro: يعمل
      bicicletta: دراجة (in bicicletta = بالدراجة)
      solito: معتاد (di solito = عادةً)
      piove: تمطر
      prende: يستقل
      andare: يذهب (andare in macchina = الذهاب بالسيارة)
      preferisce: يفضّل
      macchina: سيارة
      abita: تسكن
      vicino: قريبًا
      piedi: أقدام (a piedi = سيرًا على الأقدام)
      vai: تذهب
  it.a1.unit45.lesson05.teach.chiara_abita_vicino:
    title: Chiara تسكن قريبًا وتذهب إلى العمل سيرًا
    gloss: تسكن Chiara قريبًا وتذهب إلى العمل سيرًا على الأقدام.
  it.a1.unit45.lesson06.teach.giulia_andiamo_insieme:
