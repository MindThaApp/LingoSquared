  it.a1.unit45.lesson06.teach.luca_preferisco_andare:
    title: Luca يفضّل السيارة
    gloss: 'Luca: أفضّل الذهاب بالسيارة.'
  it.a1.unit45.lesson06.teach.chiara_io_vado:
    title: Chiara ستذهب سيرًا
    gloss: 'Chiara: أنا أذهب سيرًا على الأقدام، فالمكان قريب.'
