    gloss: 'Giulia: أرى الرسالة. هل نمارس الرياضة يوم السبت في العاشرة في الحديقة؟'
  it.a1.unit46.lesson06.teach.marco_si_e:
    title: Marco يؤكد حالة الطقس
    gloss: 'Marco: نعم، والجو مشمس يوم السبت!'
  it.a1.unit46.lesson06.teach.luca_io_corro:
    title: خطة Luca
    gloss: 'Luca: سأركض أنا. وبعد ذلك سألعب كرة القدم أيضًا.'
    note: '*Poi* (بعد ذلك) ترتّب الأفعال بالتسلسل. *Gioco a calcio*: *giocare a* + اسم رياضة.'
  it.a1.unit46.lesson06.teach.chiara_io_preferisco:
    title: خطة Chiara
    gloss: 'Chiara: أفضّل أنا السباحة، لكنني سآتي إلى الحديقة أيضًا.'
    note: '*Preferisco nuotare* (أفضّل السباحة) هي الطريقة المباشرة للتعبير عن تفضيل. و*Anch''io* (أنا أيضًا) كلمة واحدة فيها فاصلة عليا.'
  it.a1.unit46.lesson06.teach.giulia_bello_a:
    title: Giulia تختم المحادثة
    gloss: 'Giulia: رائع! إلى اللقاء يوم السبت في الحديقة!'
    note: تُنهي في سطر واحد سلسلة الرسائل في هذه الوحدة وخطة وحدة الرياضة.
