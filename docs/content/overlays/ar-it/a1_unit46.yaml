  it.a1.unit46.lesson05.teach.giulia_chiama_marco:
    title: من يستخدم ماذا؟
    gloss: تتصل Giulia بـ Marco كل يوم. تستخدم الهاتف ولا تستخدم أي تطبيق. ليس لدى Marco حاسوب في المنزل، لكنه يستخدم الإنترنت على هاتفه. يبحث Luca عن توقعات الطقس كل صباح. ثم يذهب للركض. غالبًا ما ترسل Chiara رسالة إلى Giulia. وأنت، هل تستخدم هاتفك كل يوم؟
    note: تقارن عادات الشخصيات الأربع في استخدام الأجهزة، على غرار قراءة المقارنة في وحدة الرياضة.
