teaching:
  it.a1.unit03.lesson01.teach.numeri_zero_cinque:
    title: zero, uno, due, tre, quattro, cinque
    gloss: صفر، واحد، اثنان، ثلاثة، أربعة، خمسة
    note: أول ستة أرقام، وهي اللبنات الأساسية للأسعار والأعمار وأرقام الهاتف في هذه الوحدة.
    example_gloss:
    - لدي أخوان.
    - الساعة الخامسة.
  it.a1.unit03.lesson01.teach.numeri_sei_dieci:
    title: sei, sette, otto, nove, dieci
    gloss: ستة، سبعة، ثمانية، تسعة، عشرة
    note: الأرقام من ستة إلى عشرة، لتكتمل الأرقام من 0 إلى 10.
    example_gloss:
    - أعمل ثماني ساعات في اليوم.
    - يفتح المتجر في الساعة العاشرة.
  it.a1.unit03.lesson01.teach.quanti_anni:
    title: Quanti anni hai?
    gloss: كم عمرك؟
    note: حرفيًا «كم سنةً لديك؟»؛ تسأل الإيطالية عن العمر بالفعل *avere* (يملك)، بينما نقول في العربية «كم عمرك؟».
  it.a1.unit03.lesson01.teach.ho_trent_anni:
    title: Ho trent'anni.
    gloss: عمري ثلاثون عامًا.
    note: 'عبارة ثابتة للتعبير عن العمر بالفعل *avere* (حرفيًا: عندي ثلاثون سنة)؛ العدد «ثلاثون» لا يُدرَّس هنا كعدد للعدّ، فنطاق هذه الوحدة هو الأعداد من 0 إلى 10، مع 30 و50 اللذين يظهران فقط في هذه العبارة الثابتة وفي الأسعار.'
  it.a1.unit03.lesson02.teach.quanto_costa:
    title: Quanto costa un caffè?
    gloss: كم سعر القهوة؟
    note: '*Quanto costa* هي الطريقة المعتادة للسؤال عن سعر غرض واحد.'
  it.a1.unit03.lesson02.teach.costa_un_euro:
    title: un euro, due euro
    gloss: يورو واحد، يوروان
    note: لا يتغيّر شكل *euro* في الجمع في الإيطالية، ولا توجد صيغة مثنى؛ فكلٌّ من *un euro* و*due euro* يستعمل *euro* نفسها.
    example_gloss:
    - ثمنه يورو واحد.
    - الحساب يوروان وخمسون سنتًا.
  it.a1.unit03.lesson02.teach.un_cornetto:
    title: E un cornetto?
    gloss: وماذا عن الكرواسون؟
    note: سؤال قصير للاستفسار عن سعر غرض ثانٍ، هو *cornetto* (الكرواسون الإيطالي الذي يُؤكل في الفطور).
  it.a1.unit03.lesson02.teach.due_euro_cinquanta:
    title: Sono due euro e cinquanta.
    gloss: الحساب يوروان وخمسون سنتًا.
    note: تضيف *e cinquanta* السنتات، وحرفيًا تعني «وخمسين»، وتُستعمل بالطريقة نفسها مع أي سعر فيه خمسون سنتًا.
  it.a1.unit03.lesson02.teach.quanti_ne_vuole:
    title: Quanti ne vuole?
    gloss: كم تريد منها؟
    note: الطريقة الرسمية التي يسأل بها النادل أو البائع عن العدد الذي تريده؛ وتحلّ *ne* محل الشيء المذكور سابقًا.
  it.a1.unit03.lesson02.teach.ne_vorrei_tre:
    title: Ne vorrei tre, grazie.
    gloss: أودّ ثلاثة منها، شكرًا.
    note: '*Ne vorrei* + عدد هي الطريقة المهذبة لطلب كمية، وتُستعمل *ne* هنا أيضًا للإشارة إلى الشيء المذكور.'
  it.a1.unit03.lesson03.teach.qual_e_il_tuo_numero:
    title: Qual è il tuo numero di telefono?
    gloss: ما رقم هاتفك؟
    note: الطريقة غير الرسمية للسؤال عن رقم هاتف شخص ما، باستعمال *tuo* (الخاص بك، للمخاطَب المألوف).
  it.a1.unit03.lesson03.teach.ti_chiamo_domani:
    title: Ti chiamo domani!
    gloss: سأتصل بك غدًا!
    note: طريقة ودّية لإنهاء الحديث بعد الحصول على رقم الشخص.
  it.a1.unit03.lesson03.teach.il_mio_numero:
    title: il mio numero
    gloss: رقمي
    note: تُقرأ أرقام الهاتف في الإيطالية عادةً رقمًا رقمًا، باستعمال الأعداد من الدرس الأول.
    example_gloss: رقمي صفر، ثلاثة، أربعة، اثنان، واحد.
  it.a1.unit03.lesson03.teach.numero_sam:
    title: Il mio numero è zero, tre, quattro, due, uno.
    gloss: رقمي صفر، ثلاثة، أربعة، اثنان، واحد.
    note: يذكر سام رقم هاتفه رقمًا رقمًا، وهي الطريقة المعتادة لقراءة رقم الهاتف بالإيطالية.
  it.a1.unit03.lesson03.teach.perfetto_grazie:
    title: Perfetto, grazie!
    gloss: ممتاز، شكرًا!
    note: طريقة قصيرة ومبهجة لإنهاء الحديث بعد الحصول على المعلومة المطلوبة.
