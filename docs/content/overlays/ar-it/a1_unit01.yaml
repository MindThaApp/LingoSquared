teaching:
  it.a1.unit01.lesson01.teach.ciao_buongiorno:
    title: Ciao, Buongiorno
    gloss: مرحبًا، صباح الخير
    note: '*Ciao* تحية عفوية تصلح لكل الأوقات، وتُقال بين الأصدقاء والأقران في أي ساعة من اليوم. أما *Buongiorno* فهي تحية النهار المعتادة والأكثر رسمية، وتُستخدم من الصباح حتى ما بعد الظهر.'
    example_gloss:
    - مرحبًا، كيف حالك؟
    - صباح الخير، كيف حالك؟
  it.a1.unit01.lesson01.teach.come_stai_sta:
    title: come stai, come sta
    gloss: كيف حالك (غير رسمي)، كيف حالكم (رسمي)
    note: تُستخدم *come stai* مع *tu* (صديق أو زميل من الأقران)، وتُستخدم *come sta* مع *Lei* (شخص غريب أو مدير أو من تُظهر له الاحترام). السؤال نفسه، لكن بمستوى مختلف من الرسمية.
    example_gloss:
    - مرحبًا، كيف حالك اليوم؟
    - صباح الخير، كيف حالكم اليوم؟
  it.a1.unit01.lesson01.teach.ciao_come_stai:
    title: Ciao, come stai?
    gloss: مرحبًا، كيف حالك؟
    note: تحية عفوية غير رسمية مع سؤال عن الحال، تُستخدم مع الأصدقاء وزملاء الدراسة والأقران.
  it.a1.unit01.lesson01.teach.buongiorno_come_sta:
    title: Buongiorno, come sta?
    gloss: صباح الخير، كيف حالكم؟
    note: الصيغة الرسمية المقابلة، وتُستخدم مع من تخاطبه باحترام، مثل مدير زميل جديد.
  it.a1.unit01.lesson01.teach.register_rule:
    title: 'tu: informale · Lei: formale o rispettoso'
    gloss: غير رسمي · رسمي أو يدل على الاحترام
    note: '*tu* هو ضمير المخاطب اليومي بين الأصدقاء وزملاء الدراسة والأقران. أما *Lei* فهو ضمير المخاطب المهذب للغرباء، وفي التسلسل الوظيفي في العمل، ومع من تلتقي به لأول مرة، وله صيغ فعلية خاصة به (قارن بين *tu stai* و*Lei sta*).'
  it.a1.unit01.lesson02.teach.bene_grazie:
    title: Bene, grazie
    gloss: بخير، شكرًا
    note: ردّ بسيط ومحايد على سؤال «كيف حالك؟»، ويصلح مع المستويين بإضافة *e tu?* أو *e Lei?*
    example_gloss:
    - بخير، شكرًا، وأنت؟
    - بخير، شكرًا، وأنتم؟ (رسمي)
  it.a1.unit01.lesson02.teach.e_tu:
    title: E tu?
    gloss: وأنت؟ (غير رسمي)
    note: الطريقة غير الرسمية لإعادة السؤال إلى صديق أو زميل من الأقران.
  it.a1.unit01.lesson02.teach.e_lei:
    title: E Lei?
    gloss: وأنت؟ (رسمي)
    note: الطريقة الرسمية لإعادة السؤال، وهي توافق مستوى *Lei*.
  it.a1.unit01.lesson02.teach.bene_grazie_e_tu:
    title: Bene, grazie, e tu?
    gloss: بخير، شكرًا، وأنت؟
    note: الرد الكامل غير الرسمي مع إعادة السؤال، يُقال لصديق أو زميل من الأقران.
  it.a1.unit01.lesson02.teach.bene_grazie_e_lei:
    title: Bene, grazie, e Lei?
    gloss: بخير، شكرًا، وأنتم؟ (رسمي)
    note: الرد الكامل الرسمي مع إعادة السؤال، يُقال لمن تخاطبه باحترام.
  it.a1.unit01.lesson02.teach.buonasera_buonanotte:
    title: Buonasera, Buonanotte
    gloss: مساء الخير، تصبح على خير
    note: '*Buonasera* تحية تُقال عند الوصول إلى مكان ما في المساء. أما *Buonanotte* فهي عبارة وداع تُقال عندما يذهب أحدهم إلى النوم أو ينهي يومه، ولا تُستخدم أبدًا كتحية.'
    example_gloss:
    - مساء الخير، كيف حالك؟
    - تصبح على خير، أراك غدًا.
  it.a1.unit01.lesson02.teach.arrivederla:
    title: Arrivederla, a domani.
    gloss: مع السلامة، أراكم غدًا.
    note: '*Arrivederla* هي عبارة الوداع الرسمية، وتُستخدم مع *Lei*، وتناسب مكان العمل أو التحدث مع شخص غريب.'
  it.a1.unit01.lesson02.teach.ci_vediamo:
    title: Ciao, ci vediamo domani!
    gloss: إلى اللقاء، أراك غدًا!
    note: عبارة وداع عفوية، تُقال للأصدقاء والأقران الذين ستراهم في اليوم التالي.
  it.a1.unit01.lesson03.teach.come_si_chiama:
    title: Come si chiama, scusi?
    gloss: عفوًا، ما اسمكم؟ (رسمي)
    note: '*Come si chiama?* تعني حرفيًا «ماذا يُسمّى حضرتكم؟» بصيغة *Lei* الرسمية، وإضافة *scusi* («عفوًا») لمسة مهذبة طبيعية عند سؤال شخص غريب.'
  it.a1.unit01.lesson03.teach.come_ti_chiami:
    title: Come ti chiami?
    gloss: ما اسمك؟ (غير رسمي)
    note: الصيغة غير الرسمية، وتُستخدم مع صديق أو زميل أو شخص في مثل عمرك.
  it.a1.unit01.lesson03.teach.mi_chiamo_elena:
    title: Mi chiamo Elena.
    gloss: اسمي Elena.
    note: '*chiamarsi* تعني «يُسمّى»، وهي الطريقة المعتادة لذكر اسمك، وتصلح في المستويين.'
  it.a1.unit01.lesson03.teach.io_sono_sam:
    title: Io sono Sam.
    gloss: أنا Sam.
    note: بديل بسيط عن *mi chiamo*، باستخدام الفعل *essere* (يكون) متبوعًا بالاسم مباشرة.
  it.a1.unit01.lesson03.teach.piacere:
    title: Piacere, Piacere di conoscerla
    gloss: سررت بلقائك، تشرفت بمعرفتكم (رسمي)
    note: '*Piacere* وحدها عبارة قصيرة شائعة لقول «سررت بلقائك» في المستويين. أما *Piacere di conoscerla* فهي الصيغة الأكمل والرسمية، وتُستخدم مع *Lei*.'
    example_gloss:
    - سررت بلقائك يا Sam!
    - تشرفت بمعرفتك يا سيدة Elena.
  it.a1.unit01.lesson03.teach.benvenuto:
    title: Benvenuto in ufficio!
    gloss: أهلًا بك في المكتب!
    note: '*Benvenuto* هي صيغة المذكر لكلمة الترحيب (تُقال لرجل؛ أما المرأة فيُرحَّب بها بـ *Benvenuta*).'
  it.a1.unit01.lesson03.teach.grazie_mille:
    title: Grazie mille.
    gloss: شكرًا جزيلًا.
    note: طريقة أقوى وأكثر تأكيدًا للشكر من *Grazie* وحدها.
