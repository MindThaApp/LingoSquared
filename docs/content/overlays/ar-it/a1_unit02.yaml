    note: طريقة متواضعة وشائعة لوصف مستواك، و*un po'* تعني «قليلًا».
    example_gloss: أتحدث الإيطالية قليلًا، أدرسها منذ سنة.
  it.a1.unit02.lesson02.teach.parlo_inglese:
