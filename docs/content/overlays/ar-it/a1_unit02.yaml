    title: Di dove sei?
    gloss: من أين أنت؟
    note: السؤال غير الرسمي، يُستخدم مع زميل أو صديق، ويقابل *tu* من الوحدة 1.
  it.a1.unit02.lesson01.teach.di_dov_e_lei:
    title: Di dov'è, Lei?
    gloss: من أين أنت؟ (رسمي)
    note: السؤال الرسمي، ويقابل *Lei* من الوحدة 1.
  it.a1.unit02.lesson01.teach.sono_americano_chicago:
    title: Sono americano, di Chicago.
    gloss: أنا أمريكي، من شيكاغو.
    note: يذكر الجنسية ومدينة الأصل معًا.
  it.a1.unit02.lesson01.teach.sono_italiana_milano:
    title: Sono italiana, di Milano.
    gloss: أنا إيطالية، من ميلانو.
    note: '*italiana* هي صيغة المؤنث للجنسية، وتُستخدم لأن إيلينا امرأة.'
  it.a1.unit02.lesson01.teach.nationalities:
    title: americano/americana, italiano/italiana
    gloss: أمريكي/أمريكية، إيطالي/إيطالية
    note: 'تتغير نهاية كلمات الجنسية في الإيطالية بحسب جنس الشخص: *-o* للرجل و*-a* للمرأة (*Sam è americano*، *Elena è italiana*).'
    example_gloss:
    - سام أمريكي.
    - إيلينا إيطالية.
  it.a1.unit02.lesson02.teach.parli_italiano:
