teaching:
  it.a1.unit02.lesson01.teach.di_dove:
    title: di dove
    gloss: من أين
    note: '*di dove* هي اللبنة الأساسية للسؤال عن الأصل أو للتعبير عنه، وتأتي مع *sei* (غير رسمي) أو *è* (رسمي).'
