    gloss: أدرس الإيطالية منذ سنة.
    note: '*da un anno* تعني «منذ سنة»، وتصف عملًا بدأ في الماضي ويستمر حتى الآن.'
  it.a1.unit02.lesson02.teach.da_quanto_studi:
    title: Da quanto studi?
    gloss: منذ متى تدرس؟
    note: '*Da quanto* (منذ كم) + المضارع *studi* (تدرس، غير رسمي) تسأل منذ متى يستمر نشاط ما. أجب بالتركيب نفسه: *Studio da un anno.*'
