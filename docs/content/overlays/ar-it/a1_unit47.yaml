  it.a1.unit47.lesson05.teach.luca_non_lavora:
    title: من يدرس ماذا؟
    gloss: لوكا لا يعمل فقط، بل يدرس أيضًا. يتابع دورة في اللغة الإسبانية في مركز تعليم الكبار. وفي كل أسبوع يتعلّم كلمات جديدة. أما كيارا فتدرس برنامجًا دراسيًا في المعهد الجامعي. وهي تدرس هناك الرعاية الصحية. كلاهما يحب الدراسة. وأنت، ماذا تدرس، أو ماذا تودّ أن تتعلّم؟
    note: مقارنة بين دراسة لوكا ودراسة كيارا، على غرار نص المقارنة في وحدة التكنولوجيا.
    glosses:
      lavora: يعمل
      soltanto: فقط
      studia: يدرس
      segue: يستقل
      corso: دورة
      spagnolo: الإسبانية
      adulti: البالغون (scuola per adulti = مركز تعليم الكبار)
      impara: يتعلّم
      ogni: كل
      settimana: أسبوع
      nuove: جديد
      parole: كلمات
      fa: تمارس
      studi: الدراسة (corso di studi = برنامج دراسي)
      universitario: جامعي (istituto universitario = معهد جامعي)
      sanitaria: الرعاية الصحية (assistenza sanitaria)
      entrambi: كلاهما
      piace: يُعجب (a entrambi piace = يحب كلاهما)
      studiare: يدرس
      imparare: يتعلّم
