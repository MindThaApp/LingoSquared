teaching:
  it.a1.unit13.lesson01.teach.ieri_stamattina:
    title: ieri, stamattina
    gloss: أمس، هذا الصباح
    note: '*ieri* (أمس) و*stamattina* (هذا الصباح) هما الإطاران الزمنيان المستخدمان للحديث عن الأحداث القريبة.'
    example_gloss:
    - كنتُ في البيت أمس.
  it.a1.unit13.lesson01.teach.sono_andato:
    title: sono andato, sono andata
    gloss: ذهبتُ (مذكر)، ذهبتُ (مؤنث)
    note: '*sono andato/andata* هو passato prossimo للفعل *andare* مع الفعل المساعد *essere*؛ ويتفق اسم المفعول مع جنس الفاعل.'
    example_gloss:
    - ذهبتُ إلى العمل هذا الصباح.
  it.a1.unit13.lesson01.teach.sono_andato_al_cinema_ieri:
    title: Sono andato al cinema ieri.
    gloss: ذهبتُ إلى السينما أمس.
    note: '*Sono andato* (على لسان رجل) مع *al cinema* (إلى السينما) و*ieri* (أمس) تصف حدثًا ماضيًا انتهى.'
  it.a1.unit13.lesson01.teach.ho_visto_un_bel_film:
    title: Ho visto un bel film!
    gloss: شاهدتُ فيلمًا جميلًا!
    note: '*Ho visto* تستخدم الفعل المساعد *avere* مع اسم المفعول الشاذ *visto* (من *vedere*، أي «رأى»).'
  it.a1.unit13.lesson02.teach.ho_mangiato_un_panino:
    title: Ho mangiato un panino a pranzo.
    gloss: أكلتُ شطيرة على الغداء.
    note: '*Ho mangiato* تستخدم *avere* مع اسم المفعول المنتظم *mangiato* (من *mangiare*، أي «أكل»)؛ و*a pranzo* تعني «على الغداء».'
  it.a1.unit13.lesson02.teach.cosa_hai_fatto_ieri:
    title: Cosa hai fatto ieri?
    gloss: ماذا فعلتَ أمس؟
    note: '*hai fatto* هو passato prossimo للفعل *fare* (فعل)، ويُستخدم هنا للسؤال عن حدث ماضٍ قريب.'
    example_gloss:
    - ماذا فعلتَ هذا الصباح؟
  it.a1.unit13.lesson02.teach.ieri_sera:
    title: ieri sera
    gloss: مساء أمس
    note: '*ieri sera* تجمع *ieri* (أمس) و*sera* (مساء) لتسمّي وقتًا ماضيًا محددًا.'
    example_gloss:
    - ذهبتُ إلى السينما مساء أمس.
  it.a1.unit13.lesson03.teach.sono_andata_al_lavoro:
    title: Stamattina sono andata al lavoro, come sempre.
    gloss: هذا الصباح ذهبتُ إلى العمل كالعادة.
    note: '*sono andata* (على لسان امرأة) مع *come sempre* (كالعادة) تصف فعلًا ماضيًا روتينيًا.'
  it.a1.unit13.lesson03.teach.e_tu_cosa_hai_fatto:
    title: E tu, cosa hai fatto stamattina?
    gloss: وأنت، ماذا فعلتَ هذا الصباح؟
    note: '*E tu* (وأنت) تعيد السؤال إلى المتحدث الآخر.'
    example_gloss:
    - وأنت، ماذا فعلتَ مساء أمس؟
