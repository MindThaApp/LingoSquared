course:
  title: الإيطالية A1
  description: 'إيطالية للمبتدئين للحديث عن الحيوانات الأليفة والحيوانات الشائعة: تسميتها، والعناية الأساسية بها (النزهة والإطعام واللعب)، والتعبير عن حبّ الحيوانات حتى دون امتلاك أي منها، وجمع الأسماء في الإيطالية.'
