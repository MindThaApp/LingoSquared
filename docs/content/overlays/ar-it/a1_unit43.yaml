teaching:
  it.a1.unit43.lesson01.teach.l_animale_un:
    title: حيوان، حيوان أليف
    gloss: الحيوان / الحيوان الأليف
    note: '*Animale* هي الكلمة العامة؛ و*animale domestico* تعني حيوانًا أليفًا (حرفيًا: حيوان منزلي).'
    example_gloss:
    - الكلب حيوان.
    - الكلب أيضًا حيوان أليف.
  it.a1.unit43.lesson01.teach.il_cane_il:
    title: الكلب والقطة
    gloss: الكلب / القطة
    example_gloss:
    - لدى Giulia كلب.
    - لدى Luca قط.
  it.a1.unit43.lesson01.teach.il_pesce_l:
    title: السمكة والطائر
    gloss: السمكة / الطائر
    example_gloss:
    - لدى الجد سمكة.
    - لدى Nina طائر.
  it.a1.unit43.lesson01.teach.hai_un_animale:
    title: هل لديك حيوان أليف؟
    gloss: هل لديك حيوان أليف؟
    note: '*Hai ...?* هي صيغة المخاطب *tu* من الفعل *avere*. نبرة الصوت وحدها تحوّل الجملة الخبرية إلى سؤال.'
  it.a1.unit43.lesson01.teach.si_ho_un:
    title: نعم، لدي كلب
    gloss: نعم، لدي كلب.
    note: إجابة بسيطة بالإيجاب باستخدام مفردات هذه الوحدة الجديدة.
  it.a1.unit43.lesson01.teach.no_non_ho:
    title: لا، ليس لدي حيوان أليف
    gloss: لا، ليس لدي حيوان أليف.
    note: 'للتعبير عن عدم امتلاك شيء، ضع *non* قبل الفعل: *non ho*. انظر ملاحظة القواعد.'
  it.a1.unit43.lesson01.teach.per_dire_che:
    title: Non قبل الفعل
    gloss: 'لقول إنك لا تملك شيئًا، ضع non قبل الفعل: Non ho tempo, Non ho animali domestici.'
    note: 'بعد *non ho* يأتي الاسم عادةً دون أداة تعريف: *non ho tempo*, *non ho animali*.'
  it.a1.unit43.lesson02.teach.portare_a_spasso:
    title: يُخرج حيوانًا للتنزه
    gloss: يُخرج (حيوانًا) للتنزه
    note: '*Portare a spasso* عبارة ثابتة تعني اصطحاب الحيوان في نزهة. يأتي الضمير قبل الفعل: *lo porto a spasso*.'
    example_gloss: أُخرج الكلب للتنزه كل يوم.
  it.a1.unit43.lesson02.teach.il_pronome_lo:
    title: الضمائر تأتي قبل الفعل
    gloss: 'الضمير lo يحلّ محل الكلب ويأتي قبل الفعل: lo porto a spasso, gli do da mangiare.'
    note: 'في العربية يلتصق الضمير بآخر الفعل (أصطحبه)، أما في الإيطالية فيأتي *lo* و*gli* قبل الفعل: *lo porto*, *gli do*.'
  it.a1.unit43.lesson02.teach.dare_da_mangiare:
    title: يُطعم
    gloss: يُطعم
    example_gloss: أُطعم القط كل يوم.
  it.a1.unit43.lesson02.teach.giocare_con:
    title: يلعب مع
    gloss: يلعب مع
    example_gloss: يلعب Luca مع قطه.
  it.a1.unit43.lesson02.teach.porto_a_spasso:
    title: أُخرج الكلب للتنزه كل يوم
    gloss: أُخرج الكلب للتنزه كل يوم.
    note: تأتي *Ogni giorno* (كل يوم) في آخر الجملة، كما في *porto a spasso il cane ogni giorno*.
  it.a1.unit43.lesson02.teach.do_da_mangiare:
    title: أُطعم القط كل يوم
    gloss: أُطعم القط كل يوم.
    note: '*Dare da mangiare* (يُطعم) تعني حرفيًا «يعطي ليأكل». و*Do* هي صيغة المتكلم *io* من الفعل *dare*.'
  it.a1.unit43.lesson03.teach.il_plurale_cambia:
    title: 'الجمع: il cane -> i cani'
    gloss: 'يتغير في الجمع حرف العلة الأخير وأداة التعريف: il cane -> i cani, il gatto -> i gatti, l''uccello -> gli uccelli, il pesce -> i pesci.'
    note: هذا هو النمط المنتظم للجمع في الإيطالية، يُعرض هنا لأول مرة بأسماء الحيوانات أمثلةً.
  it.a1.unit43.lesson03.teach.i_cani_i:
    title: الكلاب والقطط
    gloss: كلاب / قطط
    example_gloss:
    - يحب Marco الكلاب.
    - تحب Chiara القطط.
  it.a1.unit43.lesson03.teach.i_pesci_gli:
    title: الأسماك والطيور (جمع)
    gloss: أسماك / طيور
    example_gloss:
    - أحب الأسماك.
    - يحب الجد الطيور.
  it.a1.unit43.lesson03.teach.amo_gli_animali:
    title: أحب الحيوانات
    gloss: أحب الحيوانات.
    note: '*Amare* (يحب) يأخذ مفعوله مباشرة: *amo gli animali*. ويحتاج الاسم الجمع إلى أداة التعريف الجمع *gli*.'
  it.a1.unit43.lesson03.teach.chiara_ama_i:
    title: تحب Chiara القطط، لكن ليس لديها حيوان أليف
    gloss: تحب Chiara القطط، لكن ليس لديها حيوان أليف.
    note: يمهّد للتناقض الذي تقوم عليه قراءة الدرس الخامس.
  it.a1.unit43.lesson04.teach.marco_hai_un:
    title: Marco يسأل عن حيوان أليف
    gloss: 'Marco: هل لديكِ حيوان أليف يا Giulia؟'
  it.a1.unit43.lesson04.teach.giulia_si_ho:
    title: لدى Giulia كلب
    gloss: 'Giulia: نعم، لدي كلب.'
  it.a1.unit43.lesson04.teach.marco_com_e:
    title: Marco يسأل عن شكله
    gloss: 'Marco: كيف هو؟'
    note: 'يصلح *Com''è?* للحيوانات أيضًا. ويأتي الجواب بـ *è* أو *ha*: *è piccolo*, *ha il pelo castano*.'
  it.a1.unit43.lesson04.teach.giulia_ha_il:
    title: Giulia تصف كلبها
    gloss: 'Giulia: له فرو بنّي وهو صغير.'
    note: يعيد مفردات لون الشعر والحجم من وحدة المظهر، وهنا لوصف فرو حيوان بدل شعر شخص.
  it.a1.unit43.lesson04.teach.un_animale_e:
    title: الحيوانات مذكرة أو مؤنثة
    gloss: 'الحيوان مذكر أو مؤنث مثل الإنسان: il cane هو lui، وla gatta هي lei.'
    note: في الإيطالية كل اسم إما مذكر وإما مؤنث، فالكلب *lui* والقطة *lei*، وتتبعهما الضمائر (*lo*, *la*). وهذا قريب من العربية التي تعامل الحيوان بالمذكر أو المؤنث أيضًا.
  it.a1.unit43.lesson04.teach.marco_lo_porti:
    title: Marco يسأل عن النزهات
    gloss: 'Marco: هل تأخذه في نزهة كل يوم؟'
  it.a1.unit43.lesson04.teach.giulia_si_lo:
    title: Giulia تصف روتينها
    gloss: 'Giulia: نعم، آخذه في نزهة كل يوم وأُطعمه.'
  it.a1.unit43.lesson05.teach.marco_e_chiara:
    title: Marco وChiara وLuca يتحدثون عن الحيوانات
    gloss: 'Marco وChiara كلاهما يحب الحيوانات، لكن لا أحد منهما لديه حيوان أليف. يحب Marco الكلاب وتحب Chiara القطط. أما Luca فلديه حيوان أليف: قط. يلعب كثيرًا مع قطه ويُطعمه كل يوم. هل لديك حيوان أليف؟'
    note: يقابل بين حب الحيوان وامتلاكه فعلًا، وهذا هو الهدف التواصلي للوحدة.
    glosses:
      amano: يحب
      entrambi: كلاهما
      animali: حيوانات
      due: اثنان (nessuno dei due = لا أحد منهما)
      domestico: أليف (animale domestico = حيوان أليف)
      cani: كلاب
      gatti: قطط
      gatto: قط
      gioca: يلعب
      dà: يعطي
      ogni: كل
      mangiare: يأكل (dare da mangiare = يُطعم)
  it.a1.unit43.lesson05.teach.luca_gioca_spesso:
    title: Luca يلعب كثيرًا مع قطه
    gloss: يلعب Luca كثيرًا مع قطه.
    note: 'تأتي *Spesso* (غالبًا) بعد الفعل: *gioca spesso*. و*Giocare con* تعني اللعب مع.'
  it.a1.unit43.lesson05.teach.amo_i_cani:
    title: أحب الكلاب. ليس لدي حيوان أليف.
    gloss: أحب الكلاب. ليس لدي حيوان أليف.
    note: إجابة نموذجية من جملتين، جاهزة لإعادة استعمالها في مهمة الكتابة في الوحدة.
  it.a1.unit43.lesson06.teach.giulia_nina_hai:
    title: Giulia تسأل Nina
    gloss: 'Giulia: Nina، هل لديكِ أنتِ أيضًا حيوان أليف؟'
  it.a1.unit43.lesson06.teach.nina_si_ho:
    title: نينا لديها طائر اسمه بيكو
    gloss: 'نينا: نعم، لدي طائر. اسمه بيكو.'
    note: '*Si chiama Pico* تعني أن اسمه Pico، وحرفيًا «يسمّي نفسه Pico».'
  it.a1.unit43.lesson06.teach.marco_che_bello:
    title: Marco يعلّق
    gloss: 'Marco: ما أجمل هذا! ماذا تفعلين معه كل يوم؟'
  it.a1.unit43.lesson06.teach.nina_gli_do:
    title: نينا تُطعمه كل يوم
    gloss: 'نينا: أُطعمه كل يوم.'
  it.a1.unit43.lesson06.teach.marco_anch_io:
    title: Marco يحب الطيور أيضًا
    gloss: 'Marco: وأنا أيضًا أحب الطيور.'
  it.a1.unit43.lesson06.teach.giulia_che_bello:
    title: Giulia تختم الحديث
    gloss: 'Giulia: ما أجمل أننا نحن الثلاثة نحب الحيوانات!'
    note: جملة ختامية تجمع المعلومات عن حيوانات الشخصيات الثلاث.
