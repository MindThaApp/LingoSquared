    glosses:
      caffè: مقهى (caffè linguistico = مقهى لغوي)
      biblioteca: مكتبة
      incendio: حريق
      dipendente: موظف
      dice: يقول
      Andate: اذهبوا (andate = اذهبوا، أمر للجمع)
      emergenza: طوارئ (uscita di emergenza = مخرج الطوارئ)
      aiuto: مساعدة
      bisogno: يحتاج (ho bisogno di = أحتاج إلى)
      chiama: يتصل (هاتفيًا)
      vigili: رجال الإطفاء (vigili del fuoco = الإطفاء)
      tutti: الجميع
      fuori: في الخارج
      bene: حسنًا، جيد (va bene = هذا جيد)
