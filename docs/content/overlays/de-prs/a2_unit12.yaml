course:
  title: Dari A2
  description: 'Dari (Afghanistan), unteres Mittelstufenniveau: ein Arztbesuch – Wortschatz, ein Symptom genau beschreiben, eine Terminbestätigung lesen und der Besuch selbst.'
units:
  prs.a2.unit12.doctor:
    title: Beim Arzt
lessons:
  prs.a2.unit12.lesson01.doctor_vocabulary:
    title: Wörter für den Arztbesuch
  prs.a2.unit12.lesson02.describing_a_symptom:
    title: Ein Symptom beschreiben
  prs.a2.unit12.lesson03.reading_an_appointment_confirmation:
