teaching:
  prs.a2.unit12.lesson01.teach.symptom_word:
    title: Symptom
    gloss: Symptom
    note: '*علامت* ist das allgemeine Wort für ein Symptom oder Anzeichen einer Krankheit.'
    example_gloss: Baschirs Symptom sind Kopfschmerzen.
  prs.a2.unit12.lesson01.teach.duration_word:
    title: Dauer
    gloss: Dauer, Zeitraum
    note: '*مدت* fragt danach oder nennt, wie lange etwas gedauert hat.'
    example_gloss: Meine Krankheit dauert zwei Tage.
  prs.a2.unit12.lesson01.teach.severe_word:
    title: Stark
    gloss: stark, heftig
    note: '*شدید* beschreibt ein starkes oder heftiges Symptom.'
    example_gloss: Meine Kopfschmerzen sind sehr stark.
  prs.a2.unit12.lesson01.teach.exam_word:
    title: Medizinische Untersuchung
    gloss: medizinische Untersuchung, Test
    note: '*آزمایش* ist eine medizinische Untersuchung, zum Beispiel ein Bluttest.'
    example_gloss: Der Arzt möchte einen Bluttest.
  prs.a2.unit12.lesson01.teach.prescription_slip_word:
    title: Rezept
    gloss: Rezept (der Zettel)
    note: '*نسخه* ist der schriftliche Rezeptzettel selbst.'
    example_gloss: Der Arzt hat mir ein Rezept ausgestellt.
  prs.a2.unit12.lesson01.teach.prescribe_word:
    title: Verschreiben
    gloss: verschreiben
    note: '*تجویز* bezeichnet das Verschreiben eines Medikaments oder einer Behandlung.'
    example_gloss: Der Arzt hat ein neues Medikament verschrieben.
  prs.a2.unit12.lesson01.teach.since_ago_grammar:
    title: „Seit … “ mit از ... پیش
    gloss: seit zwei Tagen
    note: '*از ... پیش* – „seit …“ – drückt aus, wie lange ein Symptom schon besteht.'
    target_text: از دو روز پیش (seit zwei Tagen)
  prs.a2.unit12.lesson02.teach.headache_severe_since:
    title: Ein starkes, anhaltendes Symptom beschreiben
    gloss: Meine Kopfschmerzen sind sehr stark und haben vor zwei Tagen begonnen.
    note: Verbindet *شدید* (stark) mit dem Muster *از ... پیش* für die Dauer.
  prs.a2.unit12.lesson02.teach.need_test_question:
    title: Fragen, ob eine Untersuchung nötig ist
    gloss: Muss ich für dieses Problem einen Test machen?
    note: '*آیا* leitet eine Ja-Nein-Frage ein; *باید* bedeutet „müssen“.'
  prs.a2.unit12.lesson02.teach.take_medicine_twice:
    title: Sagen, wie man das Medikament einnimmt
    gloss: Ich muss dieses Medikament zweimal täglich einnehmen.
    note: '*روزی دو بار* bedeutet „zweimal täglich“ – wörtlich „zwei Mal pro Tag“.'
  prs.a2.unit12.lesson03.teach.confirmation_word:
    title: Bestätigung
    gloss: Bestätigung
    note: '*تاییدی* ist eine schriftliche Bestätigung, zum Beispiel für einen Termin.'
    example_gloss: Meine Terminbestätigung ist angekommen.
  prs.a2.unit12.lesson03.teach.checkup_word:
    title: Untersuchung / Check-up
    gloss: Untersuchung / Check-up
    note: '*معاینه* ist die körperliche Untersuchung durch den Arzt selbst.'
    example_gloss: Der Arzt hat eine kurze Untersuchung durchgeführt.
  prs.a2.unit12.lesson03.teach.notice_text:
    title: Eine Terminbestätigung
    gloss: Ihr Arzttermin ist am Mittwoch um neun Uhr morgens. Bitte bringen Sie Ihre Tazkira (Personalausweis) mit. Wenn Sie nicht kommen können, rufen Sie einen Tag vorher an.
    note: Eine kurze offizielle Terminmitteilung in der förmlichen Schriftsprache, die in dieser Lektion behandelt wird.
  prs.a2.unit12.lesson04.teach.turn01:
    title: Der Arzt begrüßt بشیر
    gloss: Der Arzt begrüßt ihn und fragt, welches Problem er hat.
    note: '*چطور استین؟* ist die höfliche Begrüßungsfrage „Wie geht es Ihnen?“.'
  prs.a2.unit12.lesson04.teach.turn02:
    title: بشیر grüßt zurück und nennt sein Symptom
    gloss: Er grüßt den Arzt respektvoll und sagt, dass seine Kopfschmerzen sehr stark sind.
    note: '*داکتر صاحب* ist die respektvolle afghanische Anredeform für einen Arzt.'
  prs.a2.unit12.lesson04.teach.turn03:
    title: Der Arzt fragt, seit wann
    gloss: Der Arzt fragt, seit wann es begonnen hat.
    note: '*از کی...؟* fragt „seit wann“.'
  prs.a2.unit12.lesson04.teach.turn04:
    title: بشیر antwortet
    gloss: Seit zwei Tagen.
    note: Verwendet das Muster *از ... پیش* („seit …“) für die Dauer.
  prs.a2.unit12.lesson04.teach.turn05:
    title: Der Arzt fragt nach Fieber
    gloss: Der Arzt fragt, ob er auch Fieber hat.
    note: '*آیا ... هم ...؟* fragt „Gibt es auch …?“.'
  prs.a2.unit12.lesson04.teach.turn06:
    title: بشیر bestätigt leichtes Fieber
    gloss: Ja, er hat leichtes Fieber.
    note: '*یک‌کمی* bedeutet „ein bisschen“.'
  prs.a2.unit12.lesson04.teach.turn07:
    title: Der Arzt gibt Anweisungen
    gloss: Er muss dieses Medikament zweimal täglich einnehmen. Wenn es ihm nicht besser geht, soll er wiederkommen.
    note: '*اگر بهتر نشدین، دوباره بیایین* – „Wenn es Ihnen nicht besser geht, kommen Sie wieder“ – verwendet das Konditionalmuster mit *اگر* („wenn“).'
  prs.a2.unit12.lesson04.teach.turn08:
    title: بشیر bedankt sich beim Arzt
    gloss: بشیر bedankt sich respektvoll beim Arzt.
    note: '*داکتر صاحب* spricht den Arzt auch hier respektvoll an.'
