course:
  title: Dari in Deutsch A1
  description: 'Kabuler Dari für Anfänger: Wortschatz zu Technik und Geräten (Handy, Computer, Internet, App, Foto), Wendungen rund ums Handy (eine Nachricht schicken, anrufen, ein Foto machen, eine App herunterladen), Fragen und Antworten dazu, wie oft am Tag man das Handy benutzt, sowie ein Dialog zwischen Zarmina und Homayoun über die Nutzung von Handy, Computer und Internet.'
units:
  prs.a1.unit30.technology:
    title: Technologie
    description: Sprechen Sie über Handys, Computer, das Internet und Apps – und darüber, wie oft Sie sie benutzen.
lessons:
  prs.a1.unit30.lesson01.device_vocabulary:
    title: Wörter zur Technik
  prs.a1.unit30.lesson02.phone_actions:
    title: Handlungen mit dem Handy
  prs.a1.unit30.lesson03.frequency_question:
    title: Wie oft am Tag?
  prs.a1.unit30.lesson04.tech_dialogue:
    title: Dialog über Technologie
  prs.a1.unit30.lesson05.reading_technology:
    title: Lesetext über Technologie
  prs.a1.unit30.lesson06.wrap_up:
    title: Zusammenfassung
teaching:
  prs.a1.unit30.lesson01.teach.tech_word:
    title: Technologie
    gloss: Technologie
    note: تکنالوژی bedeutet „Technologie“ – das ist die in Afghanistan übliche Schreibweise, die sich von der iranischen Schreibweise تکنولوژی unterscheidet.
    example_gloss: Technologie ist gut.
  prs.a1.unit30.lesson01.teach.mobile_word:
    title: Handy
    gloss: Handy
    note: موبایل bedeutet „Handy“ und ist vom allgemeineren تلفن („Telefon“, Wiederholung aus Lektion 7) zu unterscheiden.
    example_gloss: Ich habe ein Handy.
  prs.a1.unit30.lesson01.teach.computer_word:
    title: Computer
    gloss: Computer
    note: کمپیوتر bedeutet „Computer“ und ist ein gängiges Lehnwort, das im Persischen und im Dari gleichermaßen verwendet wird.
    example_gloss: Der Computer steht im Büro.
  prs.a1.unit30.lesson01.teach.internet_word:
    title: Internet
    gloss: Internet
    note: انترنت bedeutet „Internet“ und ist ein gängiges Lehnwort, das im Persischen und im Dari gleichermaßen verwendet wird.
    example_gloss: Das Internet ist langsam.
  prs.a1.unit30.lesson01.teach.app_word:
    title: App
    gloss: App
    note: اپلیکیشن bedeutet „App“ (Anwendung) und ist ein gängiges Lehnwort, das im Persischen und im Dari gleichermaßen verwendet wird.
    example_gloss: Diese App ist gut.
  prs.a1.unit30.lesson01.teach.photo_word:
    title: Foto
    gloss: Foto
    note: عکس bedeutet „Foto“ oder „Bild“.
    example_gloss: Dieses Foto ist gut.
  prs.a1.unit30.lesson01.teach.review_estefade_kardan:
    title: Benutzen
    gloss: Gebrauch + machen → ich benutze
    note: استفاده („Gebrauch“) verbindet sich mit کردن („machen, tun“; Wiederholung) zu استفاده می‌کنم („ich benutze“). Es ist dasselbe Muster aus Nomen und Hilfsverb, das in diesem Kurs schon häufig vorkam, z. B. بازی می‌کنم (Lektion 29) und ورزش می‌کنم (Lektion 29).
    target_text: استفاده (Benutzung/Gebrauch) + کردن (machen) = استفاده می‌کنم (ich benutze)
  prs.a1.unit30.lesson01.teach.combined_sentence:
    title: Ich benutze das Internet
    gloss: Ich benutze das Internet.
    note: Der Satz setzt sich zusammen aus من („ich“, Wiederholung), از („von/mit“, Wiederholung), انترنت und استفاده می‌کنم.
  prs.a1.unit30.lesson02.teach.review_peyam:
    title: Nachricht
    gloss: Nachricht
    note: پیام bedeutet „Nachricht“.
    target_text: پیام (Nachricht)
  prs.a1.unit30.lesson02.teach.mifrestam_phrase:
    title: Ich schicke eine Nachricht
    gloss: Ich schicke eine Nachricht
    note: می‌فرستم bedeutet „ich schicke“ – ein neues Verb, das nicht mit dem Verb بگذارم („hinterlassen“, eine Nachricht hinterlassen) aus Lektion 7 zu verwechseln ist.
  prs.a1.unit30.lesson02.teach.review_zang_mizanam:
    title: Ich rufe an
    gloss: ich rufe an
    note: زنگ می‌زنم bedeutet „ich rufe an“.
    target_text: زنگ می‌زنم (ich rufe an)
  prs.a1.unit30.lesson02.teach.akas_migiram_phrase:
    title: Ich mache ein Foto
    gloss: Ich mache ein Foto
    note: عکس می‌گیرم verwendet می‌گیرم („ich nehme/bekomme“, Wiederholung aus Lektion 23) zusammen mit عکس.
  prs.a1.unit30.lesson02.teach.download_word:
    title: Herunterladen
    gloss: herunterladen
    note: دانلود ist das übliche Lehnwort für „Download“. Es wird mit کردن („machen, tun“; Wiederholung) verbunden, z. B. دانلود می‌کنم („ich lade herunter“).
    example_gloss: Ich lade eine App herunter.
  prs.a1.unit30.lesson02.teach.want_download_app_phrase:
    title: Ich möchte eine App herunterladen
    gloss: Ich möchte eine App herunterladen
    note: 'Hier gilt dasselbe Muster wie in Lektion 7 bei می‌خواهم یک پیام بگذارم („Ich möchte eine Nachricht hinterlassen“): می‌خواهم + Konjunktiv.'
  prs.a1.unit30.lesson03.teach.review_chand_bar:
    title: Wie viele / Mal
    gloss: wie viele / Mal
    note: چند بار wird hier verwendet, um nach der Häufigkeit zu fragen.
    target_text: چند (wie viele) / بار (Mal)
  prs.a1.unit30.lesson03.teach.review_ruz:
    title: Tag
    gloss: Tag
    note: روز bedeutet „Tag“.
    target_text: روز (Tag)
  prs.a1.unit30.lesson03.teach.review_mikonin:
    title: Sie benutzen (formell)
    gloss: Sie benutzen (höflich)
    note: استفاده می‌کنین ist die höfliche Form „Sie benutzen“, entsprechend dem Muster ورزش می‌کنین aus Lektion 29.
    target_text: استفاده می‌کنین (Sie benutzen, höflich)
  prs.a1.unit30.lesson03.teach.question_frequency:
    title: Wie oft am Tag benutzen Sie Ihr Handy?
    gloss: Wie oft am Tag benutzen Sie Ihr Handy?
    note: Der Satz setzt sich zusammen aus چند بار („wie oft“), در روز („am Tag“), از موبایل („das Handy“) und استفاده می‌کنین.
  prs.a1.unit30.lesson03.teach.answer_har_ruz:
    title: Ich benutze jeden Tag das Internet
    gloss: Ich benutze jeden Tag das Internet.
    note: هر روز („jeden Tag“) wird mit از انترنت استفاده می‌کنم verbunden.
  prs.a1.unit30.lesson04.teach.review_mikonad:
    title: Er/sie benutzt
    gloss: er/sie benutzt
    note: استفاده می‌کند ist die Form der 3. Person und folgt dem Muster می‌کند, das in Lektion 29 wiederholt wurde.
    target_text: استفاده می‌کند (er/sie benutzt, 3. Person)
  prs.a1.unit30.lesson04.teach.review_to_miokni:
    title: du / du benutzt
    gloss: du / du benutzt
    note: تو und می‌کنی sind die vertrauliche Anredeform, die Homayoun und Zarmina untereinander verwenden.
    target_text: تو (du, informell) / می‌کنی (du benutzt, informell)
  prs.a1.unit30.lesson04.teach.review_koja:
    title: Wo
    gloss: wo
    note: کجا bedeutet „wo“.
    target_text: کجا (wo)
  prs.a1.unit30.lesson04.teach.dialogue_line1:
    title: 'Homayoun: Zarmina, wie oft am Tag benutzt du dein Handy?'
    gloss: Zarmina, wie oft am Tag benutzt du dein Handy?
  prs.a1.unit30.lesson04.teach.dialogue_line2:
    title: 'Zarmina: Ich benutze mein Handy oft. Ich mache Fotos und schicke Nachrichten.'
    gloss: Ich benutze mein Handy oft. Ich mache Fotos und schicke Nachrichten.
  prs.a1.unit30.lesson04.teach.dialogue_line3:
    title: 'Homayoun: Benutzt du einen Computer?'
    gloss: Benutzt du einen Computer?
  prs.a1.unit30.lesson04.teach.dialogue_line4:
    title: 'Zarmina: Ja, im Büro benutze ich einen Computer.'
    gloss: Ja, im Büro benutze ich einen Computer.
  prs.a1.unit30.lesson04.teach.dialogue_line5:
    title: 'Homayoun: Ich benutze jeden Tag das Internet.'
    gloss: Ich benutze jeden Tag das Internet.
  prs.a1.unit30.lesson04.teach.dialogue_line6:
    title: 'Zarmina: Großartig!'
    gloss: Großartig!
  prs.a1.unit30.lesson05.teach.reading_passage:
    title: Lesetext über Technologie
    gloss: Zarmina benutzt jeden Tag ihr Handy. Sie macht Fotos und schickt Nachrichten. Im Büro benutzt sie einen Computer. Homayoun benutzt jeden Tag das Internet.
  prs.a1.unit30.lesson06.teach.review_ama:
    title: Aber
    gloss: aber
    note: اما bedeutet „aber“.
    target_text: اما (aber)
  prs.a1.unit30.lesson06.teach.review_like_have_time:
    title: Ich mag / Zeit / ich habe nicht
    gloss: ich mag / Zeit / ich habe nicht
    note: دوست دارم („ich mag“), وقت („Zeit“) und ندارم („ich habe nicht“) sind Wiederholungen aus den Lektionen 11, 14, 26 und 29.
    target_text: دوست دارم (ich mag) / وقت (Zeit) / ندارم (ich habe nicht)
  prs.a1.unit30.lesson06.teach.wrap_summary:
    title: Ich mag Technologie, aber ich habe keine Zeit
    gloss: Ich mag Technologie, aber ich habe keine Zeit.
    note: Der Satz verbindet تکنالوژی را دوست دارم („Ich mag Technologie“, wiederholte Konstruktion) mit اما وقت ندارم („aber ich habe keine Zeit“).
