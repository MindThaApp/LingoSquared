course:
  title: Dari in Deutsch A1
  description: 'Dari (Kabul) für Anfänger: Wortschatz zum Aussehen (groß, klein, Haare, Augen, Bart, Brille), die Frage nach dem Aussehen einer Person mit قیافه‌اش چطور است؟, Haar- und Augenfarbe (رنگ مو/رنگ چشم) und ein Dialog zwischen Zarmina und Homayoun darüber, wie man jemanden an seinem Aussehen erkennt.'
units:
  prs.a1.unit27.appearance:
    title: Aussehen
    description: Beschreiben Sie das grundlegende Aussehen einer Person und fragen Sie, wie jemand aussieht.
lessons:
  prs.a1.unit27.lesson01.appearance_vocabulary:
    title: Wörter zum Aussehen
  prs.a1.unit27.lesson02.appearance_question:
