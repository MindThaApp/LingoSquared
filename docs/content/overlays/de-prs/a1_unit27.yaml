  prs.a1.unit27.lesson03.hair_eye_color:
    title: Haar- und Augenfarbe
  prs.a1.unit27.lesson04.appearance_dialogue:
    title: Dialog über das Aussehen
  prs.a1.unit27.lesson05.reading_appearance:
    title: Lesetext über das Aussehen
  prs.a1.unit27.lesson06.wrap_up:
    title: Zusammenfassung
teaching:
  prs.a1.unit27.lesson01.teach.tall_phrase:
    title: Groß
    gloss: groß
    note: قد بلند bedeutet wörtlich „lange Größe“ – قد (Körpergröße) + بلند (lang/hoch).
    example_gloss: Er/Sie ist groß.
  prs.a1.unit27.lesson01.teach.short_phrase:
    title: Klein
    gloss: klein
    note: قد کوتاه bedeutet wörtlich „kurze Größe“ – قد (Körpergröße, Wiederholung) + کوتاه (kurz).
    example_gloss: Er/Sie ist klein.
  prs.a1.unit27.lesson01.teach.hair_word:
    title: Haare
    gloss: Haar / Haare
    note: مو bedeutet Haar; موی ist dasselbe Wort in der Anschlussform (Ezafe) vor einem weiteren Wort (z. B. موی سیاه, „schwarze Haare“).
    example_gloss: Seine/Ihre Haare sind schwarz.
  prs.a1.unit27.lesson01.teach.eye_word:
    title: Auge
    gloss: Auge
    note: چشم bedeutet Auge (zur Beschreibung der Augenfarbe steht es im Singular, das ist der übliche Alltagsgebrauch).
    example_gloss: Seine/Ihre Augen sind schwarz.
  prs.a1.unit27.lesson01.teach.beard_word:
    title: Bart
    gloss: Bart
    note: ریش bedeutet Bart.
    example_gloss: Er/Sie hat einen Bart.
  prs.a1.unit27.lesson01.teach.glasses_word:
    title: Brille
    gloss: Brille
    note: عینک bedeutet Brille.
    example_gloss: Er/Sie hat eine Brille.
  prs.a1.unit27.lesson01.teach.review_ast_dast:
    title: Ist / hat (3. Person)
    gloss: ist / hat (3. Person)
    note: است (ist) und دارد (hat, 3. Person) kennen Sie schon aus früheren Lektionen; in dieser Einheit dienen beide dazu, das Aussehen einer Person zu beschreiben.
    target_text: است (ist) / دارد (hat, 3. Person)
  prs.a1.unit27.lesson02.teach.qiyafa_word:
    title: Aussehen
    gloss: Aussehen
    note: قیافه bedeutet das Aussehen einer Person (z. B. خوش قیافه, „gut aussehend“).
    example_gloss: Sein/Ihr Aussehen ist gut.
  prs.a1.unit27.lesson02.teach.review_chetor:
    title: Wie
    gloss: wie
    note: چطور bedeutet „wie“ (schon früher im Kurs eingeführt, z. B. in der Begrüßung چطور استین؟).
    target_text: چطور (wie)
  prs.a1.unit27.lesson02.teach.qiyafash_word:
    title: Sein/Ihr Aussehen
    gloss: sein/ihr Aussehen
    note: قیافه‌اش verbindet قیافه (Aussehen) mit dem Possessivsuffix ‌اش („sein/ihr“).
  prs.a1.unit27.lesson02.teach.question_appearance:
    title: Wie sieht er/sie aus?
    gloss: Wie sieht er/sie aus?
    note: قیافه‌اش چطور است؟ ist die natürliche Art zu fragen, wie jemand aussieht. Das bloße چطور است؟ allein würde dagegen als „Wie geht es ihm/ihr?“ (Frage nach dem Befinden) verstanden.
  prs.a1.unit27.lesson02.teach.answer_tall:
    title: Er/Sie ist groß
    gloss: Er/Sie ist groß.
    note: Verbindet او (er/sie, Wiederholung) mit قد بلند است aus dieser Einheit.
  prs.a1.unit27.lesson02.teach.answer_black_hair:
    title: Er/Sie hat schwarze Haare
    gloss: Er/Sie hat schwarze Haare.
    note: Verbindet موی (Haar) mit سیاه (schwarz) und دارد (hat).
  prs.a1.unit27.lesson02.teach.answer_beard:
    title: Er/Sie hat einen Bart
    gloss: Er/Sie hat einen Bart.
    note: Verwendet ریش دارد, dasselbe „haben“-Muster wie bei den schwarzen Haaren oben.
  prs.a1.unit27.lesson03.teach.review_rang:
    title: Farbe
    gloss: Farbe
    note: رنگ bedeutet Farbe (schon früher im Kurs eingeführt, in Einheit 21 zur Kleidung).
    target_text: رنگ (Farbe)
  prs.a1.unit27.lesson03.teach.blue_word:
    title: Blau
    gloss: blau
    note: آبی bedeutet blau.
    example_gloss: Seine/Ihre Augen sind blau.
  prs.a1.unit27.lesson03.teach.brown_word:
    title: Braun
    gloss: braun
    note: قهوه‌ای bedeutet braun (für Haar- oder Augenfarbe).
    example_gloss: Seine/Ihre Haare sind braun.
  prs.a1.unit27.lesson03.teach.eye_color_phrase:
    title: Augenfarbe
    gloss: Augenfarbe
    note: رنگ چشم bedeutet wörtlich „Farbe des Auges“ – رنگ (Farbe) + چشم (Auge).
  prs.a1.unit27.lesson03.teach.hair_color_phrase:
    title: Haarfarbe
    gloss: Haarfarbe
    note: رنگ مو bedeutet wörtlich „Farbe des Haares“ – رنگ (Farbe) + مو (Haar).
  prs.a1.unit27.lesson03.teach.eye_blue_sentence:
    title: Seine/Ihre Augen sind blau
    gloss: Seine/Ihre Augen sind blau.
    note: Wendet آبی aus dieser Lektion auf چشم an.
  prs.a1.unit27.lesson03.teach.hair_brown_sentence:
    title: Seine/Ihre Haare sind braun
    gloss: Seine/Ihre Haare sind braun.
    note: Wendet قهوه‌ای aus dieser Lektion auf موی an.
  prs.a1.unit27.lesson04.teach.review_baradar:
    title: Bruder / dein Bruder
    gloss: Bruder / dein Bruder (informell)
    note: برادر (Bruder) kennen Sie aus Einheit 3; برادرت fügt das informelle Possessivsuffix ‌ت („dein“) hinzu, passend zur bisher verwendeten informellen Anrede mit تو.
    target_text: برادر (Bruder) / برادرت (dein Bruder, informell)
  prs.a1.unit27.lesson04.teach.review_bali_tashakor:
    title: Ja / danke / auch
    gloss: ja / danke / auch
    note: بلی (ja), تشکر (danke) und هم (auch) kennen Sie bereits aus früheren Lektionen.
    target_text: بلی (ja) / تشکر (danke) / هم (auch)
  prs.a1.unit27.lesson04.teach.dialogue_line1:
    title: 'Homayoun: Zarmina, wie sieht dein Bruder aus?'
    gloss: 'Homayoun: Zarmina, wie sieht dein Bruder aus?'
    note: Eine informelle Frage unter Freunden mit dem Possessivsuffix -ت bei برادر.
  prs.a1.unit27.lesson04.teach.dialogue_line2:
    title: 'Zarmina: Er ist groß und hat schwarze Haare'
    gloss: 'Zarmina: Er ist groß und hat schwarze Haare.'
    note: Verbindet zwei Merkmale mit و („und“).
  prs.a1.unit27.lesson04.teach.dialogue_line3:
    title: 'Homayoun: Hat er einen Bart?'
    gloss: 'Homayoun: Hat er einen Bart?'
    note: Eine Ja-/Nein-Frage, die allein durch steigende Intonation bei ریش دارد entsteht.
  prs.a1.unit27.lesson04.teach.dialogue_line4:
    title: 'Zarmina: Ja, er hat einen Bart und auch eine Brille'
    gloss: 'Zarmina: Ja, er hat einen Bart und auch eine Brille.'
    note: Wendet هم („auch“) auf ein zweites Merkmal an.
  prs.a1.unit27.lesson04.teach.dialogue_line5:
    title: 'Homayoun: Gut, danke'
    gloss: 'Homayoun: Gut, danke.'
    note: خوب (gut) ist ein neues, einfaches Abschlusswort; تشکر (danke) ist Wiederholung.
  prs.a1.unit27.lesson05.teach.reading_passage:
    title: Lesetext über das Aussehen
    gloss: Karim ist groß. Er hat schwarze Haare und braune Augen. Er hat keinen Bart, aber eine Brille.
    note: Ein kurzer Lesetext, der die Wörter der Einheit zum Aussehen wiederholt. Er führt den Namen کریم (Karim, bekannt aus der Einheit zu den Vergleichen) und ندارد („hat nicht“, die verneinte 3. Person von دارد) ein.
  prs.a1.unit27.lesson06.teach.review_ama:
    title: Aber
    gloss: aber
    note: اما bedeutet „aber“ (in dieser Einheit schon im Lesetext der fünften Lektion vorgekommen und auch aus früheren Einheiten bekannt).
    target_text: اما (aber)
  prs.a1.unit27.lesson06.teach.review_astam:
    title: Ich bin / ich habe
    gloss: ich bin / ich habe
    note: استم (ich bin) und دارم (ich habe) kennen Sie bereits aus früheren Lektionen; hier dienen sie der Beschreibung des eigenen Aussehens.
    target_text: استم (ich bin) / دارم (ich habe)
  prs.a1.unit27.lesson06.teach.wrap_summary:
    title: Ich bin klein, aber ich habe schwarze Haare
    gloss: Ich bin klein, aber ich habe schwarzes Haar.
    note: Verbindet zwei Aussagen zum Aussehen mit اما („aber“).
