    gloss: Am Wochenende schläft er lange und verbringt Zeit mit seiner Familie. Er fragt sie dasselbe.
    note: Greift genau den Wochenendsatz aus der zweiten Lektion wieder auf.
  prs.a2.unit17.lesson04.teach.turn05:
    title: زرمینه beschreibt ihre Wochentage
    gloss: An Wochentagen arbeitet sie zuerst, dann kommt sie nach Hause und kocht.
    note: '*آشپزی* bedeutet „Kochen“.'
  prs.a2.unit17.lesson04.teach.turn06:
    title: زرمینه beschreibt ihr Wochenende
    gloss: Am Wochenende geht sie mit ihren Freundinnen und Freunden auf den Basar.
