    gloss: An Wochentagen gehe ich zuerst ins Büro, dann treibe ich Sport und schließlich lerne ich ein wenig.
    note: '*اول ... بعد ... و در آخر* verbindet drei Tätigkeiten in einem Satz – der zentrale Grammatikschritt dieser Lektion auf A2-Niveau.'
