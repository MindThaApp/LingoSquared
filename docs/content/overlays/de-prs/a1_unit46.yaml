course:
  title: Dari in Deutsch A1
  description: 'Kabuler Dari für Anfänger: Bitten Sie in der Apotheke um ein einfaches Medikament, beschreiben Sie ein einfaches Symptom (Kopfschmerzen, Bauchschmerzen oder Zahnschmerzen), fragen Sie nach einer Tablette oder Sirup und verstehen Sie eine einfache Dosierungsanweisung.'
units:
  prs.a1.unit46.pharmacy:
    title: Apotheke und Medikamente
    description: Bitten Sie in der Apotheke um ein einfaches Medikament, beschreiben Sie ein einfaches Symptom, fragen Sie nach einer Tablette oder Sirup und verstehen Sie eine einfache Dosierungsanweisung.
