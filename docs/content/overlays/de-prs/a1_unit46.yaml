  prs.a1.unit46.lesson03.medicine_forms:
    title: Tablette und Sirup
  prs.a1.unit46.lesson04.pharmacy_dialogue:
    title: Dialog in der Apotheke
  prs.a1.unit46.lesson05.reading:
    title: Ein Rezept lesen
  prs.a1.unit46.lesson06.wrap_up:
    title: Zusammenfassung
teaching:
  prs.a1.unit46.lesson01.teach.review_this_is_in:
    title: 'Wiederholung: dies, ist, in'
    gloss: dies / ist / in
    note: این, است und در (in diesem Kurs durchgehend verwendet) sind Wiederholungswörter, mit denen man über die Apotheke spricht.
    target_text: این (dies) / است (ist) / در (in)
  prs.a1.unit46.lesson01.teach.pharmacy_word:
    title: Apotheke
    gloss: Apotheke
    note: دواخانه bedeutet wörtlich „Medizinhaus“ – gebildet wie کتابخانه („Bücherhaus“, Bibliothek, Lektion 43).
    example_gloss: Das ist eine Apotheke.
  prs.a1.unit46.lesson01.teach.this_is_pharmacy_phrase:
    title: Das ist eine Apotheke
    gloss: Das ist eine Apotheke.
    note: این دواخانه است setzt sich aus Wörtern zusammen, die Sie früher in dieser Lektion gelernt haben.
  prs.a1.unit46.lesson01.teach.pharmacist_word:
    title: Apotheker
    gloss: Apotheker
    note: دواساز bedeutet wörtlich „Medizinhersteller“.
    example_gloss: Der Apotheker ist in der Apotheke.
  prs.a1.unit46.lesson01.teach.pharmacist_in_pharmacy_phrase:
    title: Der Apotheker ist in der Apotheke
    gloss: Der Apotheker ist in der Apotheke.
    note: دواساز در دواخانه است verbindet دواساز (Apotheker) und دواخانه (Apotheke).
  prs.a1.unit46.lesson01.teach.review_medicine_want:
    title: 'Wiederholung: Medikament, ich möchte'
    gloss: Medikament / ich möchte
    note: دوا und می‌خواهم sind Wiederholungswörter, mit denen man um ein Medikament bittet.
    target_text: دوا (Medikament) / می‌خواهم (ich möchte)
  prs.a1.unit46.lesson01.teach.want_medicine_phrase:
    title: Ich möchte ein Medikament
    gloss: Ich möchte ein Medikament.
    note: دوا می‌خواهم verbindet دوا (Medikament) und می‌خواهم (ich möchte).
  prs.a1.unit46.lesson02.teach.review_headache_stomachache_have:
    title: 'Wiederholung: Kopfschmerzen, Bauchschmerzen, ich habe, Sie haben'
    gloss: Kopfschmerzen / Bauchschmerzen / ich habe / Sie haben (höflich)
    note: سردرد, دل‌درد, دارم und دارین sind Wiederholungswörter, mit denen man ein Symptom beschreibt.
    target_text: سردرد (Kopfschmerzen) / دل‌درد (Bauchschmerzen) / دارم (ich habe) / دارین (Sie haben, höflich)
  prs.a1.unit46.lesson02.teach.review_very_yes_no:
    title: 'Wiederholung: sehr, ja, nein'
    gloss: sehr / ja / nein
    note: بسیار, بلی und نخیر (aus früheren Lektionen) sind Wiederholungswörter, mit denen man auf eine Frage nach Symptomen antwortet.
    target_text: بسیار (sehr) / بلی (ja) / نخیر (nein)
  prs.a1.unit46.lesson02.teach.toothache_word:
    title: Zahnschmerzen
    gloss: Zahnschmerzen
    note: دندان‌درد verbindet دندان (Zahn, Lektion 42) mit dem Bestandteil -درد („Schmerz“), den Sie schon aus سردرد und دل‌درد kennen.
    example_gloss: Ich habe Zahnschmerzen.
  prs.a1.unit46.lesson02.teach.severe_toothache_phrase:
    title: Ich habe starke Zahnschmerzen
    gloss: Ich habe starke Zahnschmerzen.
    note: بسیار دندان‌درد دارم verstärkt das Symptom mit بسیار (sehr).
  prs.a1.unit46.lesson02.teach.do_you_have_headache_phrase:
    title: Haben Sie Kopfschmerzen?
    gloss: Haben Sie Kopfschmerzen?
    note: سردرد دارین؟ ist eine Ja-/Nein-Frage, die ohne eigenes Fragewort allein durch steigende Intonation gebildet wird.
  prs.a1.unit46.lesson02.teach.no_toothache_phrase:
    title: Nein, ich habe Zahnschmerzen
    gloss: Nein, ich habe Zahnschmerzen.
    note: نخیر beantwortet die vorherige Frage, und danach wird das tatsächliche Symptom genannt.
  prs.a1.unit46.lesson03.teach.review_want_one:
    title: 'Wiederholung: ich möchte, ein/eins'
    gloss: ich möchte / ein / eins
    note: می‌خواهم und یک (aus früheren Lektionen) sind Wiederholungswörter, mit denen man um eine bestimmte Darreichungsform eines Medikaments bittet.
    target_text: می‌خواهم (ich möchte) / یک (ein/eine/eins)
  prs.a1.unit46.lesson03.teach.tablet_word:
    title: Tablette
    gloss: Tablette
    note: قرص ist das gebräuchliche Dari-Wort für eine Tablette.
    example_gloss: Ich möchte eine Tablette.
  prs.a1.unit46.lesson03.teach.want_tablet_phrase:
    title: Ich möchte eine Tablette
    gloss: Ich möchte eine Tablette.
    note: یک قرص می‌خواهم verbindet یک (ein) und قرص (Tablette).
  prs.a1.unit46.lesson03.teach.syrup_word:
    title: Sirup
    gloss: Sirup
    note: شربت ist das gebräuchliche Dari-Wort für ein flüssiges Medikament bzw. einen Sirup.
    example_gloss: Ich möchte Sirup.
  prs.a1.unit46.lesson03.teach.want_syrup_phrase:
    title: Ich möchte Sirup
    gloss: Ich möchte Sirup.
    note: شربت می‌خواهم verbindet شربت (Sirup) und می‌خواهم (ich möchte).
  prs.a1.unit46.lesson03.teach.review_which_medicine_want_polite:
    title: 'Wiederholung: welche(s), Medikament, Sie möchten (höflich)'
    gloss: welche(s) / Medikament / Sie möchten (höflich)
    note: کدام, دوا und می‌خواهین sind Wiederholungswörter, mit denen man fragt, was ein Kunde möchte.
    target_text: کدام (welche/r/s) / دوا (Medikament) / می‌خواهین (Sie möchten, höflich)
  prs.a1.unit46.lesson03.teach.which_medicine_phrase:
    title: Welches Medikament möchten Sie?
    gloss: Welches Medikament möchten Sie?
    note: کدام دوا می‌خواهین؟ ist die höfliche Frage, die ein Apotheker stellen würde.
  prs.a1.unit46.lesson04.teach.review_hello_stomachache_have:
    title: 'Wiederholung: Hallo, Bauchschmerzen, ich habe'
    gloss: Hallo / Bauchschmerzen / ich habe
    note: سلام, دل‌درد und دارم (aus früheren Lektionen) sind Wiederholungswörter, mit denen der Dialog beginnt.
    target_text: سلام (Hallo) / دل‌درد (Bauchschmerzen) / دارم (ich habe)
  prs.a1.unit46.lesson04.teach.review_medicine_want_polite_yes:
    title: 'Wiederholung: Medikament, Sie möchten (höflich), ja'
    gloss: Medikament / Sie möchten (höflich) / ja
    note: دوا, می‌خواهین und بلی (aus früheren Lektionen) sind Wiederholungswörter, die in den Fragen des Apothekers vorkommen.
    target_text: دوا (Medikament) / می‌خواهین (Sie möchten, höflich) / بلی (ja)
  prs.a1.unit46.lesson04.teach.review_this_tablet_good_is:
    title: 'Wiederholung: dies, Tablette, gut, ist'
    gloss: dies / Tablette / gut / ist
    note: این, قرص, خوب und است (aus früheren Lektionen und dieser Lektion) sind Wiederholungswörter, mit denen man das Medikament beschreibt.
    target_text: این (dies) / قرص (Tablette) / خوب (gut) / است (ist)
  prs.a1.unit46.lesson04.teach.piece_word:
    title: Stück
    gloss: Stück / Dosis
    note: دانه ist ein Zählwort für ein Stück oder eine Dosis und wird bei Tabletten verwendet.
    example_gloss: Drei Stück.
  prs.a1.unit46.lesson04.teach.take_word:
    title: Nehmen
    gloss: nehmen Sie (höflich)
    note: بگیرین ist der höfliche Imperativ „nehmen Sie“ und gehört zur selben ین-Familie wie کنین/بنوشین an anderer Stelle in diesem Kurs.
    example_gloss: Nehmen Sie täglich drei Stück.
  prs.a1.unit46.lesson04.teach.review_day_three_thanks_welcome:
    title: 'Wiederholung: Tag, drei, vielen Dank, gern geschehen'
    gloss: Tag / drei / vielen Dank / gern geschehen
    note: روز, سه, تشکر زیاد und خواهش می‌کنم (aus früheren Lektionen) sind Wiederholungswörter, mit denen der Dialog endet.
    target_text: روز (Tag) / سه (drei) / تشکر زیاد (vielen Dank) / خواهش می‌کنم (bitte, gern geschehen)
  prs.a1.unit46.lesson04.teach.dialogue_line1:
    title: 'Homayoun: Hallo. Ich habe Bauchschmerzen.'
    gloss: Hallo. Ich habe Bauchschmerzen.
  prs.a1.unit46.lesson04.teach.dialogue_line2:
    title: 'Apotheker: Guten Tag. Möchten Sie ein Medikament?'
    gloss: Guten Tag. Möchten Sie ein Medikament?
  prs.a1.unit46.lesson04.teach.dialogue_line3:
    title: 'Homayoun: Ja, ich möchte eine Tablette.'
    gloss: Ja, ich möchte eine Tablette.
  prs.a1.unit46.lesson04.teach.dialogue_line4:
    title: 'Apotheker: Diese Tablette ist gut. Nehmen Sie täglich drei Stück.'
    gloss: Diese Tablette ist gut. Nehmen Sie täglich drei Stück.
  prs.a1.unit46.lesson04.teach.dialogue_line5:
    title: 'Homayoun: Vielen Dank.'
    gloss: Vielen Dank.
  prs.a1.unit46.lesson04.teach.dialogue_line6:
    title: 'Apotheker: Gern geschehen.'
    gloss: Gern geschehen.
  prs.a1.unit46.lesson05.teach.review_this_is_from:
    title: 'Wiederholung: dies, ist, Homayoun, von'
    gloss: dies / ist / Homayoun / von
    note: 'این, است und همایون sind Wiederholungswörter, die im Lesetext vorkommen. از (aus früheren Lektionen, meist „von“ oder „aus“) wird hier zusammen mit است verwendet, um Besitz auszudrücken: این نسخه از همایون است heißt wörtlich „Dieses Rezept ist von Homayoun“, bedeutet aber „Das ist Homayouns Rezept“. Dasselbe Muster zeigt این کتاب از من است, „Dieses Buch gehört mir“.'
    target_text: این (dies) / است (ist) / همایون / از (von/aus)
  prs.a1.unit46.lesson05.teach.review_one_tablet_day_three_piece_take:
    title: 'Wiederholung: eins, Tablette, Tag, drei, Stück, nehmen'
    gloss: eins / Tablette / Tag / drei / Stück / nehmen
    note: یک, قرص, روز, سه, دانه und بگیرین (aus dieser Lektion) sind Wiederholungswörter, die im Lesetext vorkommen.
    target_text: یک (eins) / قرص (Tablette) / روز (Tag) / سه (drei) / دانه (Stück) / بگیرین (nehmen Sie)
  prs.a1.unit46.lesson05.teach.prescription_word:
    title: Rezept
    gloss: Rezept
    note: نسخه ist das alltägliche dari Wort für ein Rezept oder eine Einnahmeanweisung auf einem Medikament.
    example_gloss: Das ist ein Rezept.
  prs.a1.unit46.lesson05.teach.reading_passage:
    title: Ein Rezept lesen
    gloss: Das ist Homayouns Rezept. Es ist eine Tablette. Nehmen Sie täglich drei Stück.
  prs.a1.unit46.lesson06.teach.review_but_formal_you_how_many:
    title: 'Wiederholung: aber, Sie (formell), wie viele'
    gloss: aber / Sie (formell) / wie viele
    note: اما, شما und چند (aus früheren Lektionen) sind Wiederholungswörter, mit denen man einen Einnahmeplan angibt.
    target_text: اما (aber) / شما (Sie, höflich) / چند (wie viele)
  prs.a1.unit46.lesson06.teach.review_morning_night_two_three_piece_is_prescription:
    title: 'Wiederholung: Morgen, Nacht, zwei, drei, Stück, ist, Ihr Rezept'
    gloss: Morgen / Nacht / zwei / drei / Stück / ist / Ihr Rezept
    note: صبح, شب, دو, سه, دانه, است (aus früheren Lektionen und dieser Lektion) und نسخه‌تان (Ihr Rezept, mit demselben Suffix -تان wie in نام‌تان/تلفن‌تان an anderer Stelle in diesem Kurs) sind Wiederholungswörter, mit denen die Lektion abschließt.
    target_text: صبح (Morgen) / شب (Nacht) / دو (zwei) / سه (drei) / دانه (Stück) / است (ist) / نسخه‌تان (Ihr Rezept)
  prs.a1.unit46.lesson06.teach.morning_night_contrast_phrase:
    title: Morgens zwei Stück, aber abends drei Stück
    gloss: Morgens sind es zwei Stück, aber abends drei Stück.
    note: اما stellt die Morgendosis der Abenddosis gegenüber.
  prs.a1.unit46.lesson06.teach.your_prescription_question_phrase:
    title: Wie viele Stück sind auf Ihrem Rezept?
    gloss: Wie viele Stück sind auf Ihrem Rezept?
    note: Die formelle Variante mit dem Suffix -تان, um nach der Dosierung auf einem Rezept zu fragen.
