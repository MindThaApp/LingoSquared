course:
  title: Dari in Deutsch A1
  description: 'Dari (Kabul) für Anfänger: Wortschatz zu Bildung und Studium (Universität, Schule, Studienfach, Student, Lektion), ein Studienfach nennen (Medizin, Rechtswissenschaft, Wirtschaft, Literatur), fragen und antworten, wo man studiert, sowie ein Dialog zwischen Karim und Parwin über das Studium und darüber, wie sie es empfinden.'
units:
  prs.a1.unit31.education:
    title: Bildung
    description: Sprechen Sie darüber, was und wo Sie studieren und wie Sie es empfinden.
