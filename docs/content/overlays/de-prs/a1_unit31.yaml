teaching:
  prs.a1.unit31.lesson01.teach.education_word:
    title: Bildung
    gloss: Bildung / Studium
    note: تحصیل bedeutet Bildung oder Studium im Allgemeinen und ist das Themenwort dieser Lektion.
    example_gloss: Bildung ist gut.
  prs.a1.unit31.lesson01.teach.university_word:
    title: Universität
    gloss: Universität
    note: پوهنتون bedeutet Universität. Es ist das in Afghanistan übliche Wort (wie im Namen der Universität Kabul) und unterscheidet sich vom iranischen دانشگاه.
    example_gloss: Die Universität ist in Kabul.
  prs.a1.unit31.lesson01.teach.school_word:
    title: Schule
    gloss: Schule
    note: مکتب bedeutet Schule.
    example_gloss: Diese Schule ist gut.
  prs.a1.unit31.lesson01.teach.field_word:
    title: Studienfach
    gloss: Studienfach / Hauptfach
    note: رشته bedeutet Studienfach oder Hauptfach an der Universität. Es ist ein gängiges Wort im Persischen und im Dari.
    example_gloss: Mein Fach ist Medizin.
  prs.a1.unit31.lesson01.teach.student_word:
    title: Student
    gloss: Student/Studentin
    note: محصل bedeutet Universitätsstudent. Es ist der in Afghanistan übliche Begriff im Dari und unterscheidet sich vom iranischen دانشجو.
    example_gloss: Er/Sie ist Student/Studentin.
  prs.a1.unit31.lesson01.teach.lesson_word:
    title: Lektion
    gloss: Lektion
    note: درس bedeutet Lektion. Zusammen mit خواندن (lesen) bildet es die Verbindung für „lernen/studieren“.
    example_gloss: Ich lerne jeden Tag.
  prs.a1.unit31.lesson01.teach.review_khandan:
    title: Lernen
    gloss: Lektion + lesen → ich lerne/studiere
    note: درس (Lektion) verbindet sich mit خواندن (lesen) zu درس می‌خوانم (ich lerne/studiere) – wörtlich „ich lese eine Lektion“. Das ist ein neues Muster aus Nomen und Verb in diesem Kurs.
    target_text: درس (Lektion) + خواندن (lesen) = درس می‌خوانم (ich lerne)
  prs.a1.unit31.lesson01.teach.combined_sentence:
    title: Ich studiere an der Universität
    gloss: Ich studiere an der Universität.
    note: Verbindet من (ich, Wiederholung), در (an/in, Wiederholung), پوهنتون und درس می‌خوانم.
  prs.a1.unit31.lesson02.teach.medicine_word:
    title: Medizin
    gloss: Medizin
    note: طب bedeutet Medizin als Studienfach und ist ein gängiges Wort im Persischen und im Dari.
    example_gloss: Medizin ist schwer.
  prs.a1.unit31.lesson02.teach.law_word:
    title: Rechtswissenschaft
    gloss: Rechtswissenschaft
    note: حقوق bedeutet Rechtswissenschaft (Jura) als Studienfach und ist ein gängiges Wort im Persischen und im Dari.
    example_gloss: Jura ist interessant.
  prs.a1.unit31.lesson02.teach.economics_word:
    title: Wirtschaft
    gloss: Wirtschaftswissenschaft
    note: اقتصاد bedeutet Wirtschaftswissenschaft als Studienfach und ist ein gängiges Wort im Persischen und im Dari.
    example_gloss: Wirtschaft ist auch schwer.
  prs.a1.unit31.lesson02.teach.literature_word:
    title: Literatur
    gloss: Literatur
    note: ادبیات bedeutet Literatur als Studienfach und ist ein gängiges Wort im Persischen und im Dari.
    example_gloss: Ich mag Literatur.
  prs.a1.unit31.lesson02.teach.reshte_ast_phrase:
    title: Mein Fach ist Medizin
    gloss: Mein Fach ist Medizin.
    note: Verbindet رشته من (mein Fach, Wiederholung) mit است (ist), das hier neu eingeführt wird.
  prs.a1.unit31.lesson02.teach.mikhanam_subject_phrase:
    title: Ich studiere Medizin
    gloss: Ich studiere Medizin.
    note: Verwendet من ... می‌خوانم (ich lerne/studiere, Wiederholung) direkt mit dem Namen eines Fachs, z. B. طب.
  prs.a1.unit31.lesson03.teach.review_koja:
    title: Wo
    gloss: wo
    note: کجا bedeutet wo.
    target_text: کجا (wo)
  prs.a1.unit31.lesson03.teach.review_mikhanin:
    title: Sie lernen (formell)
    gloss: Sie studieren (formell)
    note: درس می‌خوانین ist die formelle Form „Sie studieren“ und folgt dem bekannten formellen Verbmuster auf -ین (z. B. استفاده می‌کنین aus Lektion 30).
    target_text: درس می‌خوانین (Sie lernen, formell)
  prs.a1.unit31.lesson03.teach.question_where:
    title: Wo studieren Sie?
    gloss: Wo studieren Sie?
    note: Verbindet شما (Sie, formell, Wiederholung), کجا (wo), درس und می‌خوانین.
  prs.a1.unit31.lesson03.teach.answer_kabul_university:
    title: Ich studiere an der Universität Kabul
    gloss: Ich studiere an der Universität Kabul.
    note: Verbindet من در ... درس می‌خوانم (ich studiere an ..., Wiederholung) mit پوهنتون کابل (Universität Kabul).
  prs.a1.unit31.lesson04.teach.review_mikhanad:
    title: Er/sie lernt
    gloss: er/sie lernt
    note: درس می‌خواند ist die Form der 3. Person und folgt dem bekannten Verbmuster der 3. Person auf -د (z. B. استفاده می‌کند aus Lektion 30).
    target_text: درس می‌خواند (er/sie lernt, 3. Person)
  prs.a1.unit31.lesson04.teach.review_to_mikhani:
    title: du / du lernst
    gloss: du (informell) / du lernst (informell)
    note: تو und می‌خوانی gehören zur informellen Sprechweise, die Karim und Parwin miteinander benutzen.
    target_text: تو (du) / می‌خوانی (du lernst)
  prs.a1.unit31.lesson04.teach.dialogue_line1:
    title: 'Karim: Parwin, wo studierst du?'
    gloss: Parwin, wo studierst du?
  prs.a1.unit31.lesson04.teach.dialogue_line2:
    title: 'Parwin: Ich studiere an der Universität Kabul. Mein Fach ist Medizin.'
    gloss: Ich studiere an der Universität Kabul. Mein Fach ist Medizin.
  prs.a1.unit31.lesson04.teach.dialogue_line3:
    title: 'Karim: Ist Medizin schwer?'
    gloss: Ist Medizin schwer?
  prs.a1.unit31.lesson04.teach.dialogue_line4:
    title: 'Parwin: Ja, es ist schwer, aber interessant. Und du?'
    gloss: Ja, es ist schwer, aber interessant. Und du?
  prs.a1.unit31.lesson04.teach.dialogue_line5:
    title: 'Karim: Ich lerne in der Schule.'
    gloss: Ich lerne in der Schule.
  prs.a1.unit31.lesson04.teach.dialogue_line6:
    title: 'Parwin: Super!'
    gloss: Super!
  prs.a1.unit31.lesson05.teach.reading_passage:
    title: Lesetext über Bildung
    gloss: Parwin studiert an der Universität Kabul. Ihr Fach ist Medizin. Medizin ist schwer, aber interessant. Karim lernt in der Schule.
  prs.a1.unit31.lesson06.teach.review_like_have_time:
    title: Ich mag / Zeit / ich habe nicht
    gloss: ich mag / Zeit / ich habe nicht
    note: دوست دارم (ich mag), وقت (Zeit) und ندارم (ich habe nicht) sind alle Wiederholung aus den Lektionen 11, 14, 26, 29 und 30.
    target_text: دوست دارم (ich mag) / وقت (Zeit) / ندارم (ich habe nicht)
  prs.a1.unit31.lesson06.teach.wrap_summary:
    title: Ich mag Bildung, aber ich habe keine Zeit
    gloss: Ich mag Bildung, aber ich habe keine Zeit.
    note: Verbindet تحصیل را دوست دارم (ich mag Bildung, bekannte Konstruktion) mit اما وقت ندارم (aber ich habe keine Zeit).
