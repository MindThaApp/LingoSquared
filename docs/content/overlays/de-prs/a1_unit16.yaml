course:
  title: Dari in Deutsch A1
  description: 'Kabuler Dari für Anfänger: grundlegender Reisewortschatz, eine Fahrkarte kaufen, nach Abfahrtszeit und Bahnsteig fragen, einen kurzen Fahrplan lesen und ein Dialog am Fahrkartenschalter.'
units:
  prs.a1.unit16.travel:
    title: Reisen
    description: Grundlegende Informationen zu Verkehrsmitteln, Fahrkarten, Reisezielen und Abfahrt verstehen und geben.
