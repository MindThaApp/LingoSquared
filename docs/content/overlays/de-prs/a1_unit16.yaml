teaching:
  prs.a1.unit16.lesson01.teach.belit_word:
    title: Fahrkarte
    gloss: Fahrkarte
    note: تکت bedeutet „Fahrkarte“. Das ist das alltägliche afghanische Dari-Wort; بلیط (auch بلیت geschrieben, das im Iran gebräuchliche Wort) wird verstanden und akzeptiert, aber تکت hören Sie meistens.
    example_gloss: Ich habe eine Fahrkarte.
  prs.a1.unit16.lesson01.teach.qatar_word:
    title: Zug
    gloss: der Zug
    note: قطار bedeutet „Zug“.
    example_gloss: Der Zug ist gut.
  prs.a1.unit16.lesson01.teach.bas_word:
    title: Bus
    gloss: Bus
    note: بس bedeutet „Bus“ und ist im afghanischen Dari gebräuchlich.
    example_gloss: Der Bus ist gut.
  prs.a1.unit16.lesson01.teach.maidan_hawayi_word:
    title: Flughafen
    gloss: Flughafen
    note: میدان هوایی bedeutet „Flughafen“ – der in diesem Kurs übliche afghanische Dari-Begriff (nicht das iranische فرودگاه), wie in Lektion 5.
    example_gloss: Der Flughafen ist gut.
  prs.a1.unit16.lesson01.teach.yak_word:
    title: Ein/Eine/Eins
    gloss: ein / eine / eins
    note: یک bedeutet „eins“ und wird hier als unbestimmter Artikel verwendet (eine Fahrkarte).
    target_text: یک (ein/eine/eins)
  prs.a1.unit16.lesson01.teach.az_word:
    title: Von / aus
    gloss: von / aus
    note: از bedeutet „von“ oder „aus“ und bezeichnet den Ursprung (zu unterscheiden von der Verwendung im Sinne von „als“ bei Vergleichen).
    target_text: از (von / aus)
  prs.a1.unit16.lesson01.teach.doo_word:
    title: Zwei
    gloss: zwei
    note: دو bedeutet „zwei“.
    example_gloss: Ich habe zwei Fahrkarten.
  prs.a1.unit16.lesson01.teach.sekooye_word:
    title: Bahnsteig zwei
    gloss: Bahnsteig zwei
    note: سکوی دو setzt sich zusammen aus سکو (Bahnsteig), der Ezafe-Verbindung -ی und دو (zwei).
    target_text: سکوی دو (Bahnsteig zwei)
  prs.a1.unit16.lesson02.teach.herat_word:
    title: Herat
    gloss: Herat
    note: Eine große Stadt im Westen Afghanistans.
    example_gloss: Ich fahre nach Herat.
  prs.a1.unit16.lesson02.teach.mikhaham_word:
    title: Ich möchte
    gloss: ich möchte
    note: می‌خواهم ist die volle, nicht verkürzte Form von „ich möchte“ und passt damit zum Sprachniveau dieses Kurses.
    target_text: می‌خواهم (ich möchte)
  prs.a1.unit16.lesson02.teach.be_word:
    title: Nach / zu
    gloss: nach / zu
    note: 'به kennzeichnet das Ziel: به هرات bedeutet „nach Herat“.'
    target_text: به (nach / zu)
  prs.a1.unit16.lesson02.teach.belit_be_herat_phrase:
    title: Ich möchte eine Fahrkarte nach Herat
    gloss: Ich möchte eine Fahrkarte nach Herat
    note: یک تکت به هرات می‌خواهم verbindet den Wortschatz dieser Lektion zur üblichen Wendung, mit der man eine Fahrkarte verlangt.
  prs.a1.unit16.lesson03.teach.sekoo_word:
    title: Bahnsteig
    gloss: Bahnsteig
    note: سکو bedeutet „Bahnsteig“ (im Bahnhof).
    example_gloss: Der Zug fährt von Bahnsteig zwei ab.
  prs.a1.unit16.lesson03.teach.harekat_mikonad_phrase:
    title: Er/Sie/Es fährt ab
    gloss: er/sie/es fährt ab
    note: حرکت می‌کند ist die volle, nicht verkürzte Form von „er/sie/es fährt ab“ bzw. „setzt sich in Bewegung“.
    target_text: حرکت می‌کند (er/sie/es fährt ab)
  prs.a1.unit16.lesson03.teach.kay_word:
    title: Wann
    gloss: wann
    note: کی bedeutet „wann“ und wird verwendet, um nach der Zeit zu fragen.
    target_text: کی (wann)
  prs.a1.unit16.lesson04.teach.sobh_word:
    title: Morgen (Tageszeit)
    gloss: Morgen, Vormittag
    note: صبح bedeutet „Morgen“ (Tageszeit).
    example_gloss: Der Zug fährt um acht Uhr morgens ab.
  prs.a1.unit16.lesson04.teach.schedule_text:
    title: Beispiel eines Fahrplantextes
    gloss: Der Zug nach Herat fährt um acht Uhr morgens von Bahnsteig zwei ab.
    note: Eine kurze, sachliche Durchsage mit dem Reisewortschatz dieser Lektion. Da für Dari keine Audioaufnahmen vorliegen, ersetzt dieser Text eine gesprochene Bahnhofsdurchsage.
  prs.a1.unit16.lesson05.teach.farda_word:
    title: Morgen
    gloss: morgen
    note: فردا bedeutet „morgen“.
    example_gloss: Ich fahre morgen früh.
  prs.a1.unit16.lesson05.teach.besyar_khoob_word:
    title: Sehr gut / in Ordnung
    gloss: sehr gut / in Ordnung
    note: بسیار خوب ist die volle, förmliche Art, „in Ordnung“ bzw. „sehr gut“ zu sagen, passend zum Sprachniveau dieses Kurses (nicht das umgangssprachliche باشه).
    example_gloss: Der Zug ist sehr gut.
  prs.a1.unit16.lesson05.teach.dialogue_line1:
    title: Der Reisende sagt
    gloss: Ich möchte eine Fahrkarte nach Herat.
  prs.a1.unit16.lesson05.teach.dialogue_line2:
    title: Der Verkäufer fragt
    gloss: Wann möchten Sie fahren?
  prs.a1.unit16.lesson05.teach.dialogue_line3:
    title: Der Reisende antwortet
    gloss: Morgen früh.
  prs.a1.unit16.lesson05.teach.dialogue_line4:
    title: Der Verkäufer bestätigt
    gloss: Sehr gut, der Zug fährt um acht Uhr morgens von Bahnsteig zwei ab.
  prs.a1.unit16.lesson06.teach.tashakor_ziyad_word:
    title: Vielen Dank
    gloss: vielen Dank
    note: تشکر زیاد ist eine gebräuchliche, höfliche Art, sich herzlich zu bedanken; sie wurde bereits in Lektion 5 und 6 eingeführt.
  prs.a1.unit16.lesson06.teach.qabeli_nadara_phrase:
    title: Bitte / Gern geschehen
    gloss: bitte / gern geschehen
    note: قابلی نداره ist die übliche höfliche Antwort auf einen Dank („Gern geschehen“); sie wurde bereits in Lektion 5 und 6 eingeführt.
  prs.a1.unit16.lesson06.teach.safar_khosh_phrase:
    title: Gute Reise
    gloss: gute Reise
    note: سفر خوش ist ein gebräuchlicher Abschiedswunsch für jemanden, der verreist; er wurde bereits in Lektion 6 eingeführt.
  prs.a1.unit16.lesson06.teach.va_word:
    title: Und
    gloss: und
    note: و bedeutet „und“ und verbindet zwei Sätze oder Satzteile.
    target_text: و (und)
