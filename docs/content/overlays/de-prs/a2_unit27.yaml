course:
  title: Dari A2
  description: 'Afghanisches Dari für Fortgeschrittene (untere Mittelstufe): Sie sagen, was Sie bald vorhaben und was Sie später planen. Das Präsens mit einer Zeitangabe für Pläne (morgen, nächste Woche, im Sommer), می‌خواهم mit dem Konjunktiv und تصمیم دارم für Absichten, rund um Urlaub, Kurse und Umzug.'
units:
  prs.a2.unit27.my_plans:
    title: Meine Pläne
lessons:
  prs.a2.unit27.lesson01.tomorrow_and_next_week:
    title: 'Morgen und nächste Woche: das Präsens für Pläne'
  prs.a2.unit27.lesson02.everyone_and_holiday:
    title: 'Die Pläne aller: Personen, Fragen, Urlaub'
  prs.a2.unit27.lesson03.i_want_to:
    title: 'Ich möchte: Absichten mit می‌خواهم'
  prs.a2.unit27.lesson04.decisions_and_moving:
    title: Entscheidungen, Kurse und Umzug
  prs.a2.unit27.lesson05.reading_and_listening:
    title: 'Lesen und Hören: Pläne'
  prs.a2.unit27.lesson06.conversation_and_writing:
    title: Ein Gespräch über ein neues Haus, und Schreiben
teaching:
  prs.a2.unit27.lesson01.teach.names:
    title: Mahtab und Latif
    gloss: Mahtab und Latif sind Freunde.
    note: Zwei Freunde, *مهتاب* (eine Frau) und *لطیف* (ein Mann), erzählen in dieser Lektion von ihren Plänen. Sie sprechen als Freunde miteinander und sagen deshalb *تو* (du).
  prs.a2.unit27.lesson01.teach.tomorrow:
    title: Morgen
    gloss: morgen
    note: '*فردا* heißt „morgen“. Es ist die Zeitangabe, die Sie für einen Plan am häufigsten brauchen.'
    example_gloss: Morgen fahre ich nach Kabul.
  prs.a2.unit27.lesson01.teach.next_week:
    title: Nächste Woche
    gloss: nächste Woche
    note: '*هفتهٔ آینده* heißt „nächste Woche“. *آینده* bedeutet „kommend“ oder „nächste“ und passt auch zu anderen Zeitwörtern: *ماه آینده* (nächsten Monat), *سال آینده* (nächstes Jahr).'
    example_gloss: Nächste Woche fahre ich nach Herat.
  prs.a2.unit27.lesson01.teach.next_month:
    title: Nächster Monat
    gloss: nächsten Monat
    note: '*ماه آینده* heißt „nächsten Monat“. Es folgt demselben Muster wie *هفتهٔ آینده*.'
    example_gloss: Nächsten Monat fahre ich nach Masar.
  prs.a2.unit27.lesson01.teach.next_year:
    title: Nächstes Jahr
    gloss: nächstes Jahr
    note: '*سال آینده* heißt „nächstes Jahr“.'
    example_gloss: Nächstes Jahr komme ich nach Kabul.
  prs.a2.unit27.lesson01.teach.summer:
    title: Der Sommer
    gloss: Sommer, im Sommer
    note: '*تابستان* heißt „Sommer“ und auch „im Sommer“: Ein eigenes Wort für „in“ brauchen Sie nicht.'
    example_gloss: Im Sommer fahre ich nach Bamiyan.
  prs.a2.unit27.lesson01.teach.plan:
    title: Plan
    gloss: Plan, Programm
    note: '*برنامه* heißt „Plan“. *برنامه دارم* heißt „Ich habe einen Plan“ und ist die übliche Art zu sagen, dass man etwas vorhat.'
    example_gloss: Ich habe einen Plan für den Sommer.
  prs.a2.unit27.lesson01.teach.rule:
    title: Das Präsens mit einer Zeitangabe drückt aus, was Sie vorhaben
    gloss: Morgen gehe ich. Nächste Woche gehe ich. Im Sommer gehe ich.
    note: 'Dari hat kein eigenes alltägliches Futur mit „werden“. Für einen Plan verwenden Sie das gewöhnliche Präsens, *می‌* plus Präsensstamm, und fügen eine Zeitangabe hinzu, die auf die Zukunft verweist: *فردا می‌روم* heißt „Morgen gehe ich“, *هفتهٔ آینده می‌روم* heißt „Nächste Woche gehe ich“. Die Zeitangabe zeigt dem Zuhörer, dass der Plan in der Zukunft liegt. Ohne Zeitangabe bedeutet *می‌روم* einfach „ich gehe“ (jetzt oder gewohnheitsmäßig). Das ist im Deutschen ganz ähnlich: Auch dort sagt man oft „Morgen gehe ich“ statt „Ich werde gehen“. Die Wortstellung ist frei: Die Zeitangabe steht meist vorn, aber auch *به هرات فردا می‌روم* ist richtig.'
  prs.a2.unit27.lesson01.teach.paradigm:
    title: Das Präsens von رفتن für alle Personen
    gloss: ich gehe, du gehst, er/sie geht, wir gehen, Sie gehen (formell) / ihr geht, sie gehen
    note: 'Das Präsens besteht aus dem Präfix *می‌* (mit Halbleerraum geschrieben), dem Präsensstamm *رو* und einer Personenendung: *می‌روم* (ich), *می‌روی* (du, zu einem Freund), *می‌رود* (er oder sie), *می‌رویم* (wir), *می‌روین* (Sie, formell, oder ihr), *می‌روند* (sie). Das Pronomen ist optional, weil die Endung schon zeigt, wer gemeint ist. Die Endung der 2. Person Plural ist in diesem Kurs *-ین*.'
  prs.a2.unit27.lesson01.teach.sentence:
    title: Morgen fahre ich nach Herat
    gloss: Morgen fahre ich nach Herat.
    note: 'Das ist das Muster dieser Lektion: erst die Zeitangabe, dann der Ort mit *به*, am Ende das Verb im Präsens.'
  prs.a2.unit27.lesson02.teach.holiday:
    title: Urlaub
    gloss: Urlaub, freie Zeit
    note: '*رخصتی* bedeutet Urlaub oder freie Zeit von Arbeit oder Schule. Es ist das afghanische Wort, das Sie am häufigsten hören werden.'
    example_gloss: Im Urlaub fahre ich nach Herat.
  prs.a2.unit27.lesson02.teach.travel:
    title: Reisen
    gloss: reisen, verreisen
    note: '*سفر کردن* heißt „reisen“. Das Ziel geben Sie mit *به* an: *به بامیان سفر می‌کنم* heißt „Ich reise nach Bamiyan“. Die Endung steht an *کردن*, das Verb verändert sich also wie jedes Präsensverb: *سفر می‌کنم، سفر می‌کنی، سفر می‌کند*.'
    example_gloss: Im Urlaub reist er oder sie nach Bamiyan.
  prs.a2.unit27.lesson02.teach.hotel:
    title: Ein Hotel buchen
    gloss: ein Hotel buchen
    note: '*رزرو کردن* heißt „buchen“ oder „reservieren“, *هوتل* heißt „Hotel“. Eine Buchung ist ein typischer Plan, daher passt das Präsens mit Zeitangabe: *فردا هوتل رزرو می‌کنم*.'
    example_gloss: Morgen buche ich ein Hotel.
  prs.a2.unit27.lesson02.teach.buy:
    title: Kaufen
    gloss: kaufen
    note: '*خریدن* heißt „kaufen“. Der Präsensstamm ist *خر*: *می‌خرم، می‌خری، می‌خرد*.'
    example_gloss: Morgen kaufe ich Obst.
  prs.a2.unit27.lesson02.teach.more_verbs:
    title: Das Präsens von آمدن
    gloss: ich komme, du kommst, er/sie kommt, wir kommen, Sie kommen (formell) / ihr kommt, sie kommen
    note: 'Der Präsensstamm von *آمدن* ist *آی*, das Verb lautet also *می‌آیم، می‌آیی، می‌آید، می‌آییم، می‌آیین، می‌آیند*. Dieselben Endungen gelten für jedes Verb: *می‌مانم* (ich bleibe), *می‌گیرم* (ich nehme), *می‌خرم* (ich kaufe), *می‌کنم* (ich mache). Mit einer Zeitangabe kann jedes davon ein Plan sein: *هفتهٔ آینده می‌آیم* heißt „Nächste Woche komme ich“.'
  prs.a2.unit27.lesson02.teach.negative:
    title: 'Die Verneinung: نمی‌ für alle Personen'
    gloss: ich gehe nicht, du gehst nicht, er/sie geht nicht, wir gehen nicht, Sie gehen nicht (formell) / ihr geht nicht, sie gehen nicht
    note: 'Um zu sagen, dass Sie etwas nicht tun werden, setzen Sie *ن* vor *می‌*: Aus *می‌روم* wird *نمی‌روم*. Die Endungen bleiben gleich. *جمعه به مکتب نمی‌روم* heißt „Am Freitag gehe ich nicht zur Schule“. Denken Sie an den Halbleerraum zwischen *نمی‌* und dem Stamm.'
  prs.a2.unit27.lesson02.teach.questions:
    title: Nach den Plänen anderer fragen
    gloss: Was machst du morgen? Wohin gehst du nächste Woche? Mit wem gehst du?
    note: 'Nach einem Plan fragen Sie mit demselben Präsens: *فردا چه می‌کنی؟* heißt „Was machst du morgen?“, *کجا می‌روی؟* heißt „Wohin gehst du?“, *با کی می‌روی؟* heißt „Mit wem gehst du?“. Auch die Antwort steht im Präsens, für ein Gespräch über Pläne brauchen Sie also keine neue Verbform.'
  prs.a2.unit27.lesson02.teach.stay:
    title: Ich bleibe eine Woche dort
    gloss: Ich bleibe eine Woche dort.
    note: '*می‌مانم* heißt „ich bleibe“. Eine Zeitdauer wie *یک هفته* steht vor dem Verb und braucht kein zusätzliches Wort für „für“.'
  prs.a2.unit27.lesson03.teach.pattern:
    title: 'Absicht: می‌خواهم plus Konjunktiv'
    gloss: Ich möchte nach Herat fahren. Ich möchte kommen. Ich möchte ein Buch kaufen.
    note: 'Um zu sagen, was Sie vorhaben oder möchten, verwenden Sie *می‌خواهم* (ich möchte) und danach ein zweites Verb im Konjunktiv: *می‌خواهم بروم* heißt „Ich möchte gehen“. Im Deutschen steht dafür „zu“ plus Infinitiv, im Dari dagegen ein zweites Verb mit Personenendung und ohne Wort für „zu“. Beide Verben stehen in derselben Person: *می‌خواهم بروم* (ich möchte gehen), *می‌خواهیم برویم* (wir möchten gehen). Setzen Sie nach *می‌خواهم* nicht den Infinitiv. Das Wort *که* ist hier nicht nötig.'
  prs.a2.unit27.lesson03.teach.subjunctive:
    title: 'Der Konjunktiv: بـ plus Präsensstamm'
    gloss: dass ich gehe, dass du gehst, dass er/sie geht, dass wir gehen, dass Sie/ihr geht, dass sie gehen
    note: 'Der Konjunktiv besteht aus *بـ* plus Präsensstamm und denselben Endungen wie das Präsens: *رو* ergibt *بروم، بروی، برود، برویم، بروین، بروند*. Andere Verben: *بخرم* (dass ich kaufe), *بگیرم* (dass ich nehme), *بمانم* (dass ich bleibe), *بخورم* (dass ich esse). *آمدن* ist die Ausnahme: *بیایم* (dass ich komme). Sie begegnen ihm nach *می‌خواهم* und auch nach *باید*.'
  prs.a2.unit27.lesson03.teach.want_paradigm:
    title: Das Präsens von خواستن
    gloss: ich will, du willst, er/sie will, wir wollen, Sie wollen (formell) / ihr wollt, sie wollen
    note: '*خواستن* hat den Präsensstamm *خواه*: *می‌خواهم، می‌خواهی، می‌خواهد، می‌خواهیم، می‌خواهین، می‌خواهند*. Das zweite Verb steht in derselben Person: *او می‌خواهد برود* (er oder sie möchte gehen), *ما می‌خواهیم برویم* (wir möchten gehen).'
  prs.a2.unit27.lesson03.teach.want_negative:
    title: Ich will nicht
    gloss: Ich will nicht gehen. Wir wollen nicht kommen.
    note: 'Setzen Sie *ن* vor *می‌خواهم*, um zu sagen, dass Sie etwas nicht wollen: *نمی‌خواهم بروم* heißt „Ich will nicht gehen“. Das zweite Verb bleibt im Konjunktiv und wird nicht zusätzlich verneint.'
  prs.a2.unit27.lesson03.teach.plan_vs_intention:
    title: Ein Plan und eine Absicht
    gloss: Morgen fahre ich nach Herat. Ich möchte nach Herat fahren.
    note: 'Vergleichen Sie beide. *فردا به هرات می‌روم* ist ein Plan: Er steht fest, Sie nennen eine Zeit und verwenden das Präsens. *می‌خواهم به هرات بروم* ist eine Absicht oder ein Wunsch: Sie möchten es, aber es steht noch nicht fest und hat oft keine genaue Zeit. Wenn Zeit und Ablauf geklärt sind, sagen Sie den Plan. Wenn Sie es nur möchten, sagen Sie *می‌خواهم*.'
  prs.a2.unit27.lesson03.teach.course:
    title: Kurs
    gloss: Kurs
    note: '*کورس* ist ein Kurs, zum Beispiel ein Sprach- oder Computerkurs. Man belegt ihn mit *گرفتن*: *کورس گرفتن* heißt „einen Kurs belegen“.'
    example_gloss: Ich möchte einen Englischkurs belegen.
  prs.a2.unit27.lesson03.teach.start:
    title: Beginnen
    gloss: anfangen, beginnen
    note: '*شروع شدن* heißt „beginnen“. Es wird für etwas gesagt, das anfängt: ein Kurs, eine Sitzung oder eine Unterrichtsstunde. *شروع می‌شود* heißt „es beginnt“. Mit einer Zeitangabe ist das ebenfalls ein Plan.'
    example_gloss: Der Kurs beginnt nächste Woche.
  prs.a2.unit27.lesson03.teach.university:
    title: Universität
    gloss: Universität
    note: '*پوهنتون* heißt „Universität“. Es ist das afghanische Wort; man geht mit *به* dorthin.'
    example_gloss: Ich möchte an die Universität gehen.
  prs.a2.unit27.lesson04.teach.move:
    title: Umziehen
    gloss: umziehen, die Wohnung wechseln
    note: '*عوض کردن* bedeutet „wechseln“, also heißt *خانه عوض کردن* „umziehen“. Auch *خانه را عوض می‌کنم* ist richtig. Die Personenendung steht an *کردن*: *خانه عوض می‌کنم، خانه عوض می‌کنی*.'
    example_gloss: Nächsten Monat ziehe ich um.
  prs.a2.unit27.lesson04.teach.rent:
    title: Mieten
    gloss: mieten (ein Haus)
    note: '*کرایه* ist die Miete. *کرایه گرفتن* heißt, ein Haus für sich zu mieten, zum Beispiel *یک خانه کرایه می‌گیرم*. Nach *می‌خواهم* lautet das zweite Verb *بگیرم*.'
    example_gloss: Ich möchte ein neues Haus mieten.
  prs.a2.unit27.lesson04.teach.near:
    title: In der Nähe
    gloss: nah, in der Nähe
    note: '*نزدیک* bedeutet „nah“. Wovon etwas nah ist, nennen Sie direkt danach: *نزدیک مکتب* heißt „in der Nähe der Schule“.'
    example_gloss: Das neue Haus ist in der Nähe der Schule.
  prs.a2.unit27.lesson04.teach.decide:
    title: 'تصمیم دارم: Ich habe beschlossen zu'
    gloss: Ich habe vor, nächstes Jahr an die Universität zu gehen.
    note: '*تصمیم دارم* bedeutet „ich habe beschlossen“, „ich habe vor“. Es ist etwas stärker als *می‌خواهم*: Man hat darüber nachgedacht. Wie *می‌خواهم* wird es vom Konjunktiv gefolgt: *تصمیم دارم بروم* heißt „ich habe vor zu gehen“. *قصد دارم* kennen Sie schon aus der Urlaubslektion; es bedeutet dasselbe und ist ebenfalls richtig. Der Konjunktiv steht am Ende des Satzes, nach Zeitangabe und Ort.'
  prs.a2.unit27.lesson04.teach.written_future:
    title: 'Das geschriebene Futur: خواهم رفت'
    gloss: Morgen werde ich nach Herat fahren. (schriftlich)
    note: 'In Aushängen, in den Nachrichten und in formellen Texten begegnen Ihnen *خواهم رفت*, *خواهد رفت*, *خواهیم رفت*: *خواه-* plus Endung und dann der Vergangenheitsstamm *رفت*. Es bedeutet „werde gehen“. Sie müssen es nur erkennen. Beim Sprechen verwenden Sie das Präsens mit einer Zeitangabe: *فردا به هرات می‌روم*.'
  prs.a2.unit27.lesson04.teach.because:
    title: Weil mein Haus klein ist
    gloss: Weil mein Haus klein ist.
    note: '*چون* bedeutet „weil“. Danach folgt ein kurzer Grund, hier mit der Kopula *است*.'
  prs.a2.unit27.lesson05.teach.morning:
    title: Morgen
    gloss: Morgen, am Morgen
    note: '*صبح* ist der Morgen. *فردا صبح* heißt „morgen früh“.'
    example_gloss: Morgen früh fahre ich nach Bamyan.
  prs.a2.unit27.lesson05.teach.holiday_turn01:
    title: Mahtab fragt nach den Ferien
    gloss: Latif, hast du einen Plan für die Ferien?
    note: Mahtab fragt Latif nach seinen Ferienplänen. *برنامه داری؟* heißt „hast du einen Plan?“, und sie sagt *تو*, weil er ein Freund ist.
  prs.a2.unit27.lesson05.teach.holiday_turn02:
    title: Latif nennt seinen Plan
    gloss: Ja. Nächste Woche fahre ich nach Herat. Ich bleibe dort eine Woche.
    note: 'Latif antwortet *بلی* („ja“). Sein Plan hat eine Zeitangabe, *هفتهٔ آینده*, und steht im Präsens: *می‌روم*. *یک هفته آنجا می‌مانم* ist ein zweiter Plan im Präsens.'
  prs.a2.unit27.lesson05.teach.holiday_turn03:
    title: Mahtab fragt nach der Zeit danach
    gloss: Das ist gut! Was machst du danach?
    note: '*بعد از آن* heißt „danach“. Die Frage steht im Präsens, wie immer bei einem Plan.'
  prs.a2.unit27.lesson05.teach.holiday_turn04:
    title: Latif sagt, was er möchte
    gloss: Ich möchte einen Englischkurs belegen.
    note: 'Latif hat kein genaues Datum, deshalb nennt er eine Absicht: *می‌خواهم* plus Konjunktiv *بگیرم*.'
  prs.a2.unit27.lesson05.teach.holiday_turn05:
    title: Mahtab fragt, wann der Kurs beginnt
    gloss: Toll! Wann beginnt der Kurs?
    note: '*کورس کی شروع می‌شود؟* fragt, wann ein Kurs anfängt. Das Präsens *شروع می‌شود* spricht von einem zukünftigen Termin.'
  prs.a2.unit27.lesson05.teach.holiday_turn06:
    title: Latif nennt den Monat
    gloss: Ab nächstem Monat.
    note: '*از ماه آینده* heißt „ab nächstem Monat“. Eine kurze Antwort genügt.'
  prs.a2.unit27.lesson05.teach.message:
    title: Eine Nachricht über Pläne
    gloss: Hallo Mahtab. Morgen früh fahre ich nach Bamyan und bleibe dort zwei Tage. Nächste Woche arbeite ich im Büro. Nächstes Jahr habe ich vor, an die Universität zu gehen.
    note: Eine kurze schriftliche Nachricht. Sie enthält einen Plan für morgen, einen Plan für nächste Woche und eine Absicht für nächstes Jahr. Alle Pläne stehen im Präsens mit einer Zeitangabe, und die Absicht wird mit *تصمیم دارم* plus Konjunktiv ausgedrückt.
  prs.a2.unit27.lesson06.teach.help:
    title: Helfen
    gloss: helfen
    note: '*کمک* ist die Hilfe. *کمک کردن* heißt „helfen“: *فردا کمک می‌کنم* heißt „morgen helfe ich“. Die Personenendung steht an *کردن*.'
    example_gloss: Morgen helfe ich meinem Freund.
  prs.a2.unit27.lesson06.teach.house_turn01:
    title: Latif fragt nach nächstem Monat
    gloss: Mahtab, was machst du nächsten Monat?
    note: Latif fragt nach einem Plan, mit Zeitangabe, *ماه آینده*, und im Präsens.
  prs.a2.unit27.lesson06.teach.house_turn02:
    title: Mahtab nennt ihren Plan
    gloss: Nächsten Monat ziehe ich um.
    note: '*خانه عوض می‌کنم* heißt „ich ziehe um“. Es ist ein Plan, deshalb steht das Präsens mit der Zeitangabe.'
  prs.a2.unit27.lesson06.teach.house_turn03:
    title: Latif fragt nach dem Grund
    gloss: Warum?
    note: '*چرا؟* heißt „warum?“. Eine Ein-Wort-Frage ist unter Freunden ganz natürlich.'
  prs.a2.unit27.lesson06.teach.house_turn04:
    title: Mahtab erklärt
    gloss: Weil mein Haus klein ist. Ich möchte ein neues Haus mieten, in der Nähe der Schule.
    note: '*چون* nennt den Grund mit *است*. Dann folgt eine Absicht, *می‌خواهم* plus Konjunktiv *بگیرم*, weil sie das Haus noch nicht gefunden hat.'
  prs.a2.unit27.lesson06.teach.house_turn05:
    title: Latif bietet seine Hilfe an
    gloss: Gut! Morgen komme ich und helfe dir.
    note: 'Latif macht spontan einen Plan mit *فردا* und dem Präsens: *می‌آیم* und *کمک می‌کنم*. *کمک کردن* heißt „helfen“.'
  prs.a2.unit27.lesson06.teach.house_turn06:
    title: Mahtab bedankt sich
    gloss: Danke!
    note: '*تشکر!* ist eine kurze Art, sich bei einem Freund zu bedanken.'
exercises:
  prs.a2.unit27.lesson01.exercise01.recognize_tomorrow:
    instruction: Was bedeutet dieser Satz?
    correct_option: Morgen fahre ich nach Kabul
    distractors:
    - Gestern bin ich nach Kabul gefahren
    - Ich fahre immer nach Kabul
    - Ich möchte nach Kabul fahren
    accepted_answers:
    - value: Morgen fahre ich nach Kabul
      status: correct
    feedback: '*فردا* verweist auf die Zukunft und *می‌روم* ist das Präsens, also ist es ein Plan: Morgen fahre ich nach Kabul.'
  prs.a2.unit27.lesson01.exercise02.recognize_we_next_week:
    instruction: Was bedeutet dieser Satz?
    correct_option: Nächste Woche fahren wir nach Herat
    distractors:
    - Letzte Woche sind wir nach Herat gefahren
    - Wir fahren jede Woche nach Herat
    - Wir sind jetzt in Herat
    accepted_answers:
    - value: Nächste Woche fahren wir nach Herat
