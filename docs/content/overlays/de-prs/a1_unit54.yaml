teaching:
  prs.a1.unit54.lesson01.teach.review_this_is_in_good:
    title: 'Wiederholung: dies, ist, in, gut'
    gloss: dies / ist / in / gut
    note: Diese Wörter kennen Sie bereits aus dem Kurs. Sie helfen Ihnen, über das Konzert zu sprechen.
    target_text: این (dieser/diese/dieses) / است (ist) / در (in) / خوب (gut)
  prs.a1.unit54.lesson01.teach.concert_word:
    title: Konzert
    gloss: Konzert
    note: Das ist das übliche moderne Wort für „Konzert“ im Dari. Es ist ein Lehnwort, ebenso wie *موزیم* (Museum).
    example_gloss: Dieses Konzert ist gut.
  prs.a1.unit54.lesson01.teach.singer_word:
    title: Sänger/Sängerin
    gloss: Sänger/Sängerin
    note: Das ist das einfache, gebräuchliche moderne Wort für „Sänger/Sängerin“. Es gibt auch das klassischere *آوازخوان*, das im Alltag aber seltener ist.
    example_gloss: Die Sängerin ist beim Konzert.
  prs.a1.unit54.lesson01.teach.this_is_concert_phrase:
    title: Das ist ein Konzert
    gloss: Das ist ein Konzert.
    note: Der Satz verbindet „dies“, „ist“ und „Konzert“ so, wie es im Kurs schon bei anderen Wörtern geübt wurde.
  prs.a1.unit54.lesson01.teach.singer_at_concert_phrase:
    title: Die Sängerin ist beim Konzert
    gloss: Die Sängerin ist beim Konzert.
    note: Der Satz verbindet „Sänger/Sängerin“, „in“ und „Konzert“.
  prs.a1.unit54.lesson02.teach.review_price_and_time_words:
    title: 'Wiederholung: wie viel, Afghani, ist, dreißig, Uhr, acht, abends, geschieht, in, Karte'
    gloss: wie viel / Afghani / ist / dreißig / Uhr / acht / abends / geschieht / in / Karte
    note: Diese Wörter kennen Sie aus früheren Lektionen. Sie helfen Ihnen, über Beginn und Preis des Konzerts zu sprechen.
    target_text: چند (wie viel) / افغانی (Afghani) / است (ist) / سی (dreißig) / ساعت (Uhr) / هشت (acht) / شب (Abend) / می‌شود (wird) / در (in) / تکت (Eintrittskarte)
  prs.a1.unit54.lesson02.teach.start_word:
    title: Beginn
    gloss: Beginn
    note: Zusammen mit *می‌شود* (geschieht) bedeutet es „es beginnt“. Dieses Muster mit einem Hilfsverb kennen Sie schon aus dem Kurs.
    example_gloss: Das Konzert beginnt um acht Uhr abends.
  prs.a1.unit54.lesson02.teach.singer_name_word:
    title: Sima
    gloss: Sima
    note: Sima ist ein häufiger afghanischer Vorname. Hier ist sie die Sängerin des Konzerts.
    example_gloss: Sima ist Sängerin.
  prs.a1.unit54.lesson02.teach.concert_poster_reading:
    title: Das Konzertplakat lesen
    gloss: Sima ist Sängerin. Das Konzert beginnt um acht Uhr abends. Die Karte kostet 30 Afghani.
  prs.a1.unit54.lesson02.teach.review_when_word:
    title: 'Wiederholung: wann'
    gloss: wann
    note: Dieses Wort kennen Sie schon. Damit fragen Sie, wann das Konzert beginnt.
    target_text: کی (wann)
  prs.a1.unit54.lesson02.teach.ask_start_time_phrase:
    title: Wann beginnt das Konzert?
    gloss: Wann beginnt das Konzert?
    note: Der Satz verbindet die Wörter, die Sie früher in dieser Lektion gelernt haben.
  prs.a1.unit54.lesson02.teach.answer_start_time_phrase:
    title: Das Konzert beginnt um acht Uhr abends
    gloss: Das Konzert beginnt um acht Uhr abends.
    note: Der Satz nennt die Anfangszeit des Konzerts laut Plakat.
  prs.a1.unit54.lesson03.teach.review_propose_words:
    title: 'Wiederholung: möchten Sie (höflich), Freitag, lassen Sie uns gehen'
    gloss: möchten Sie (höflich) / Freitag / lassen Sie uns gehen
    note: Diese Wörter kennen Sie schon. Damit machen Sie einen Vorschlag, und zwar im selben Muster wie beim Vorschlag für einen Parkausflug.
    target_text: می‌خواهین (möchten Sie, höflich) / جمعه (Freitag) / برویم (lass uns gehen)
  prs.a1.unit54.lesson03.teach.review_concert_word:
    title: 'Wiederholung: Konzert'
    gloss: Konzert
    note: Dieses Wort kennen Sie schon. Damit schlagen Sie vor, ins Konzert zu gehen.
    target_text: کنسرت (Konzert)
  prs.a1.unit54.lesson03.teach.propose_concert_phrase:
    title: Möchten Sie am Freitag ins Konzert gehen?
    gloss: Möchten Sie am Freitag ins Konzert gehen?
    note: Der Satz verwendet das Muster für Vorschläge, das Sie in diesem Kurs schon kennen, hier für das Konzert.
  prs.a1.unit54.lesson03.teach.review_accept_words:
    title: 'Wiederholung: ja, großartig, einverstanden'
    gloss: ja / großartig / einverstanden
    note: Diese Wörter kennen Sie schon. Damit nehmen Sie einen Vorschlag an.
    target_text: بلی (ja) / عالی (super) / قبول (einverstanden)
  prs.a1.unit54.lesson03.teach.accept_plan_phrase:
    title: Ja, großartig! Einverstanden.
    gloss: Ja, großartig! Einverstanden.
    note: Damit nehmen Sie den Vorschlag für das Konzert an.
  prs.a1.unit54.lesson04.teach.review_hello_want_ticket:
    title: 'Wiederholung: Hallo, ein/eine, Karte, ich möchte'
    gloss: Hallo / ein/eine / Karte / ich möchte
    note: Diese Wörter kennen Sie schon. Damit beginnt der Dialog.
    target_text: سلام (Hallo) / یک (ein/eine) / تکت (Eintrittskarte) / می‌خواهم (ich möchte)
  prs.a1.unit54.lesson04.teach.review_welcome_concert_start:
