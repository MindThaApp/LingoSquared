teaching:
  prs.a1.unit20.lesson01.teach.yesterday_word:
    title: Gestern
    gloss: gestern
    note: دیروز bedeutet „gestern“.
    example_gloss: Gestern bin ich gegangen.
  prs.a1.unit20.lesson01.teach.office_word:
    title: Ins Büro
    gloss: ins Büro
    note: به دفتر bedeutet „ins Büro“ – bereits aus der Einheit zum Tagesablauf bekannt.
    example_gloss: Ich bin ins Büro gegangen.
  prs.a1.unit20.lesson01.teach.went_word:
    title: Ich ging
    gloss: ich bin gegangen
    note: رفتم ist die einfache Vergangenheit der 1. Person Singular von رفتن (gehen).
    target_text: رفتم (ich bin gegangen – Vergangenheit von رفتن)
  prs.a1.unit20.lesson02.teach.breakfast_word:
    title: Das Frühstück
    gloss: Frühstück
    note: صبحانه bedeutet Frühstück – das Wort kennen Sie bereits aus der Lektion zum Tagesablauf.
    example_gloss: Ich habe gefrühstückt.
  prs.a1.unit20.lesson02.teach.ate_word:
    title: Ich aß
    gloss: ich aß / ich habe gegessen
    note: خوردم ist die einfache Vergangenheit der 1. Person Singular von خوردن (essen).
    target_text: خوردم (ich aß/habe gegessen – Vergangenheit von خوردن)
  prs.a1.unit20.lesson03.teach.work_word:
    title: Arbeit
    gloss: die Arbeit
    note: کار bedeutet Arbeit (als Substantiv).
    example_gloss: Ich habe gearbeitet.
  prs.a1.unit20.lesson03.teach.did_word:
    title: Ich tat
    gloss: ich tat / ich machte
    note: 'کردم ist die einfache Vergangenheit der 1. Person Singular von کردن (tun, machen). کار کردم heißt wörtlich „Ich habe Arbeit gemacht“, also: Ich habe gearbeitet.'
    target_text: کردم (ich tat/habe gemacht – Vergangenheit von کردن)
  prs.a1.unit20.lesson04.teach.yesterday_text:
    title: Ein kurzer Bericht über gestern
    gloss: Gestern bin ich ins Büro gegangen. Ich habe gefrühstückt. Ich habe gearbeitet.
    note: Ein kurzer Bericht in der 1. Person darüber, was der Schreibende gestern getan hat. Er verbindet die neuen Verben der Vergangenheit aus dieser Lektion.
  prs.a1.unit20.lesson05.teach.seven_oclock:
    title: Sieben Uhr
    gloss: sieben Uhr
    note: ساعت هفت bedeutet sieben Uhr – das kennen Sie bereits aus den Lektionen zu Uhrzeit und Tagesablauf.
    example_gloss: Ich bin um sieben Uhr gegangen.
  prs.a1.unit20.lesson05.teach.tired_word:
    title: Müde
    gloss: müde
    note: خسته bedeutet müde.
    example_gloss: Ich wurde müde.
  prs.a1.unit20.lesson05.teach.became_word:
    title: Ich wurde
    gloss: ich wurde / ich bin geworden
    note: شدم ist die einfache Vergangenheit der 1. Person Singular von شدن (werden) – dasselbe Verb wie in بیدار می‌شوم (ich wache auf) aus der Lektion zum Tagesablauf. خسته شدم heißt wörtlich „Ich wurde müde“.
    target_text: شدم (ich wurde – Vergangenheit von شدن)
  prs.a1.unit20.lesson05.teach.longer_yesterday_text:
    title: Ein längerer Bericht über gestern
    gloss: Gestern um sieben Uhr bin ich ins Büro gegangen. Ich habe gefrühstückt. Ich habe gearbeitet. Ich wurde müde.
    note: Derselbe Bericht wie zuvor, erweitert um eine genaue Uhrzeit und darum, wie sich der Schreibende danach gefühlt hat.
  prs.a1.unit20.lesson06.teach.names:
    title: Zarmina und Homayoun
    gloss: Zarmina, Homayoun
    note: Wiederkehrende Figuren in diesem Kurs, die in den Lektionen zu Uhrzeit und Tagesablauf zum ersten Mal vorkamen.
    example_gloss:
    - Ich bin Zarmina.
    - Ich bin Homayoun.
  prs.a1.unit20.lesson06.teach.where_word:
    title: Wo
    gloss: wo
    note: کجا bedeutet wo.
    target_text: کجا (wo)
  prs.a1.unit20.lesson06.teach.you_went_word:
    title: Du gingst
    gloss: du bist gegangen
    note: رفتی ist die einfache Vergangenheit der 2. Person Singular von رفتن (gehen).
    target_text: رفتی (du gingst/bist gegangen – 2. Person von رفتن)
  prs.a1.unit20.lesson06.teach.you_worked_word:
    title: Du arbeitetest
    gloss: du hast gemacht / du hast gearbeitet
    note: کردی ist die einfache Vergangenheit der 2. Person Singular von کردن (tun, machen).
    target_text: کردی (du tatest/hast gemacht/gearbeitet – 2. Person von کردن)
  prs.a1.unit20.lesson06.teach.she_went_word:
    title: Sie/Er ging
    gloss: sie ging / er ging
    note: رفت ist die einfache Vergangenheit der 3. Person Singular von رفتن – der bloße Vergangenheitsstamm ohne Endung.
    target_text: رفت (sie/er ging/ist gegangen – 3. Person von رفتن, nötig, um den Dialog über Zarmina zusammenzufassen)
  prs.a1.unit20.lesson06.teach.she_worked_word:
    title: Sie/Er arbeitete
    gloss: sie machte / arbeitete / er machte / arbeitete
    note: کرد ist die einfache Vergangenheit der 3. Person Singular von کردن – der bloße Vergangenheitsstamm.
    target_text: کرد (sie/er tat/hat gemacht/gearbeitet – 3. Person von کردن)
  prs.a1.unit20.lesson06.teach.she_became_word:
    title: Sie/Er wurde
    gloss: sie wurde / er wurde
    note: شد ist die einfache Vergangenheit der 3. Person Singular von شدن – der bloße Vergangenheitsstamm.
    target_text: شد (sie/er wurde – 3. Person von شدن)
  prs.a1.unit20.lesson06.teach.yes_word:
    title: Ja
    gloss: ja
    note: بلی ist das höfliche, formelle Wort für „ja“ und passt zum Register dieses Kurses.
    example_gloss: Ja, ich habe gearbeitet.
  prs.a1.unit20.lesson06.teach.dialogue_line1:
    title: Homayoun fragt
    gloss: Zarmina, wo bist du gestern hingegangen?
  prs.a1.unit20.lesson06.teach.dialogue_line2:
    title: Zarmina antwortet
    gloss: Ich bin ins Büro gegangen.
  prs.a1.unit20.lesson06.teach.dialogue_line3:
    title: Homayoun fragt
    gloss: Hast du gearbeitet?
  prs.a1.unit20.lesson06.teach.dialogue_line4:
    title: Zarmina antwortet
    gloss: Ja, ich habe gearbeitet. Ich wurde müde.
