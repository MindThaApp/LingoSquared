course:
  title: Dari in Deutsch A1
  description: 'Dari (Kabul) für Anfänger: einfache Vergangenheit mit drei häufigen Verben (gehen, essen, machen/arbeiten), kurze und längere Texte über den gestrigen Tag lesen und ein Dialog darüber, was jemand gestern gemacht hat.'
units:
  prs.a1.unit20.past_events:
    title: Gestrige Aktivitäten
    description: Beschreiben Sie in der einfachen Vergangenheit, was Sie gestern gemacht haben.
