course:
  title: Dari A2
  description: 'Dari (Afghanistan) für Fortgeschrittene auf A2-Niveau: eine Reisestörung bewältigen – ein ausgefallener Fernbus, nach Alternativen fragen, eine Mitteilung am Busbahnhof lesen und das Gespräch mit dem Personal selbst.'
units:
  prs.a2.unit15.travel_disruption:
    title: Reisestörung
lessons:
  prs.a2.unit15.lesson01.disruption_vocabulary:
    title: Wörter für Reisestörungen
  prs.a2.unit15.lesson02.asking_about_alternatives:
    title: Nach Alternativen fragen
  prs.a2.unit15.lesson03.reading_a_station_notice:
    title: Eine Mitteilung am Busbahnhof lesen
  prs.a2.unit15.lesson04.station_dialogue:
    title: Am Busbahnhof
teaching:
  prs.a2.unit15.lesson01.teach.delay_word:
    title: Verspätung
    gloss: Verspätung
    note: '*تأخیر* ist eine allgemeine Verspätung – bei einem Bus, einem Treffen oder allem, was später kommt.'
    example_gloss: Der Bus hat heute eine Stunde Verspätung.
  prs.a2.unit15.lesson01.teach.cancellation_word:
    title: Annullierung
    gloss: Ausfall
    note: '*لغو* wird mit *شدن* verwendet (*لغو شده*, „wurde annulliert“).'
    example_gloss: Der Bus um 9 Uhr wurde annulliert.
  prs.a2.unit15.lesson01.teach.closed_word:
    title: Geschlossen
    gloss: geschlossen
    note: '*بسته* beschreibt eine Straße, ein Geschäft oder ein Büro, das nicht geöffnet ist.'
    example_gloss: Die Straße Kabul–Masar-e Scharif ist gesperrt.
  prs.a2.unit15.lesson01.teach.alternative_route_word:
    title: Alternative Route
    gloss: alternative Route
    note: '*مسیر بدیل* -- *مسیر* bedeutet „Route“ und *بدیل* bedeutet „Alternative“.'
    example_gloss: Es gibt keine alternative Route.
  prs.a2.unit15.lesson01.teach.snowfall_word:
    title: Schneefall
    gloss: Schneefall
    note: '*برفباری* -- *برف* (Schnee) plus die Endung, die daraus „Schneefall“ macht.'
    example_gloss: Wegen Schneefalls ist die Straße gesperrt.
  prs.a2.unit15.lesson01.teach.notice_word:
    title: Bekanntmachung / Aushang
    gloss: Bekanntmachung
    note: '*اطلاعیه* ist ein ausgehängtes Schreiben, wie man es an der Wand eines Busbahnhofs findet.'
    example_gloss: Ich habe die Bekanntmachung des Busbahnhofs gelesen.
  prs.a2.unit15.lesson01.teach.due_to_grammar:
    title: „Wegen“ mit به دلیل
    gloss: Wegen Schneefalls wurde der Bus annulliert.
    note: '*به دلیل* + Nomen nennt eine Ursache – der neue Grammatikschritt dieser Lektion auf A2-Niveau, ein weiterer kausaler Anschluss neben *چون* („weil“) aus Lektion 10, das dagegen einen ganzen Satz nach sich hat.'
  prs.a2.unit15.lesson01.teach.wait_phrase:
    title: Sagen, dass man warten muss
    gloss: Sie müssen bis morgen früh warten.
    note: '*باید ... صبر کنین* -- „Sie müssen warten“ -- die höfliche Pluralendung des Verbs, die man gegenüber Fremden verwendet.'
  prs.a2.unit15.lesson01.teach.va_word:
    title: Und
    gloss: und
    note: '*و* ist das gebräuchliche Bindewort, mit dem in dieser Lektion Teilsätze verbunden werden.'
    target_text: و (und)
  prs.a2.unit15.lesson01.teach.first_person_wait:
    title: Ich muss auch warten
    gloss: Ich muss auch warten.
    note: '*من هم باید صبر کنم* zeigt den Konjunktiv der 1. Person Singular *کنم* („ich tue“). Er steht nach *باید* („müssen“) ohne *می‌*.'
  prs.a2.unit15.lesson02.teach.ask_next_bus:
    title: Fragen, wann der nächste Bus abfährt
    gloss: Wann fährt der nächste Bus ab?
    note: '*بعدی* bedeutet „nächster“.'
  prs.a2.unit15.lesson02.teach.ask_alternative_route:
    title: Nach einer alternativen Strecke fragen
    gloss: Gibt es eine alternative Strecke?
    note: '*وجود دارد؟* („gibt es das?“) ist eine gebräuchliche Art zu fragen, ob etwas verfügbar ist.'
  prs.a2.unit15.lesson02.teach.tomorrow_departure:
    title: Die Abfahrtszeit für morgen nennen
    gloss: Der Bus fährt morgen um 8 Uhr morgens ab.
    note: Hier wird das bereits bekannte Muster mit *ساعت* („Uhr“) wiederverwendet.
  prs.a2.unit15.lesson03.teach.station_word:
    title: Bahnhof
    gloss: der Bahnhof
    note: '*ایستگاه* wird für einen Busbahnhof ebenso verwendet wie für einen Bahnhof.'
    example_gloss: Homayoun ging zum Busbahnhof.
  prs.a2.unit15.lesson03.teach.passengers_word:
    title: Passagiere
    gloss: Passagiere
    note: '*مسافران* ist der Plural von *مسافر* (Passagier/Reisender).'
    example_gloss: Die Passagiere müssen warten.
  prs.a2.unit15.lesson03.teach.notice_text:
    title: Eine Durchsage am Busbahnhof über den ausgefallenen Bus
    gloss: Der Bus um 9 Uhr nach Masar-e Scharif ist heute wegen Schneefalls ausgefallen. Die Straße Kabul–Masar-e Scharif ist gesperrt. Die Passagiere müssen bis morgen früh warten. Der nächste Bus fährt morgen um 8 Uhr morgens ab.
    note: Eine kurze offizielle Bekanntmachung am Busbahnhof in der formellen Schriftsprache, die in dieser Lektion behandelt wird.
  prs.a2.unit15.lesson04.teach.turn01:
    title: Das Personal am Busbahnhof begrüßt Homayoun
    gloss: Der Mitarbeiter am Busbahnhof fragt, wie er ihm helfen kann.
    note: Eine formelle Begrüßung wie die des Büroangestellten in Lektion 9 (*بفرمایین، چه خدمتی...*), hier mit *کمکی* („Hilfe“) statt *خدمتی* („Dienst“).
  prs.a2.unit15.lesson04.teach.turn02:
    title: Homayoun fragt nach dem 9-Uhr-Bus
    gloss: Homayoun fragt, wann der 9-Uhr-Bus nach Masar-e Scharif abfährt.
    note: Hier wird das Fragemuster *کی ... می‌کند؟* aus lesson02 wiederverwendet.
  prs.a2.unit15.lesson04.teach.turn03:
    title: Der Mitarbeiter erklärt den Ausfall
    gloss: Der Mitarbeiter entschuldigt sich und sagt, dass der Bus wegen Schneefalls ausgefallen ist.
    note: '*متأسفم* bedeutet „Es tut mir leid“.'
  prs.a2.unit15.lesson04.teach.turn04:
    title: Homayoun fragt nach einer Alternative
    gloss: Homayoun fragt, ob es eine alternative Strecke gibt.
    note: Es ist genau dieselbe Frage wie in lesson02.
  prs.a2.unit15.lesson04.teach.turn05:
    title: Der Mitarbeiter antwortet und nennt die Wartezeit
    gloss: Nein, die Straße ist gesperrt. Sie müssen bis morgen früh warten.
    note: '*نخیر* ist ein formelleres „Nein“ und steht hier im Gegensatz zu *بلی*, so wie es in diesem Kurs bereits verwendet wird.'
  prs.a2.unit15.lesson04.teach.turn06:
    title: Homayoun fragt nach dem Bus von morgen
    gloss: Homayoun fragt, um wie viel Uhr der Bus morgen abfährt.
    note: '*چند* bedeutet hier „wie viel (Uhr)“.'
  prs.a2.unit15.lesson04.teach.turn07:
    title: Der Mitarbeiter nennt die Uhrzeit
    gloss: Der Bus morgen fährt um 8 Uhr morgens ab.
    note: Es ist genau dieselbe Auskunft wie in lesson02, da es sich um dasselbe Detail handelt.
  prs.a2.unit15.lesson04.teach.turn08:
    title: Homayoun bedankt sich beim Personal
    gloss: Homayoun bedankt sich für die Auskunft.
    note: '*معلومات‌تان* („Ihre Auskunft“) trägt das formelle Possessivsuffix *-تان*.'
