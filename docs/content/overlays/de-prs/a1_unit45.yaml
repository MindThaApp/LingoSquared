teaching:
  prs.a1.unit45.lesson01.teach.review_this_is_in:
    title: 'Wiederholung: dies, ist, in'
    gloss: dies / ist / in
    note: این, است und در (in diesem Kurs durchgehend verwendet) sind bekannte Wörter, die Sie hier zum Sprechen über Hotels und Zimmer brauchen.
    target_text: این (dies) / است (ist) / در (in)
  prs.a1.unit45.lesson01.teach.hotel_word:
    title: Hotel
    gloss: Hotel
    note: هوتل ist das afghanische Dari-Wort für „Hotel“ und wird mit waw geschrieben – anders als هتل im iranischen Persisch.
    example_gloss: Das ist ein Hotel.
  prs.a1.unit45.lesson01.teach.room_word:
    title: Zimmer
    gloss: Zimmer
    note: اتاق ist das alltägliche Dari-Wort für „Zimmer“.
    example_gloss: Das Zimmer ist im Hotel.
  prs.a1.unit45.lesson01.teach.room_in_hotel_phrase:
    title: Das Zimmer ist im Hotel
    gloss: Das Zimmer ist im Hotel.
    note: اتاق در هوتل است setzt Wörter zusammen, die Sie früher in dieser Lektion gelernt haben.
  prs.a1.unit45.lesson01.teach.key_word:
    title: Schlüssel
    gloss: Schlüssel
    note: کلید ist das übliche Dari-Wort für „Schlüssel“.
    example_gloss: Das ist ein Schlüssel.
  prs.a1.unit45.lesson01.teach.room_key_phrase:
    title: Zimmerschlüssel
    gloss: Zimmerschlüssel
    note: کلید اتاق verbindet کلید (Schlüssel) und اتاق (Zimmer).
  prs.a1.unit45.lesson01.teach.this_is_room_key_phrase:
    title: Das ist der Zimmerschlüssel
    gloss: Das ist der Zimmerschlüssel.
    note: این کلید اتاق است setzt Wörter zusammen, die Sie früher in dieser Lektion gelernt haben.
  prs.a1.unit45.lesson02.teach.review_have:
    title: 'Wiederholung: ich habe, es hat'
    gloss: ich habe / es hat
    note: دارم und دارد sind bekannte Wörter, mit denen Sie nach der Zimmerausstattung fragen.
    target_text: دارم (ich habe) / دارد (es hat)
  prs.a1.unit45.lesson02.teach.bathroom_word:
    title: Badezimmer
    gloss: Badezimmer
    note: تشناب ist das alltägliche Dari-Wort für „Bad“ oder „Toilette“.
    example_gloss: Das Zimmer hat ein Bad.
  prs.a1.unit45.lesson02.teach.room_has_bathroom_question_phrase:
    title: Hat das Zimmer ein Bad?
    gloss: Hat das Zimmer ein Bad?
    note: اتاق تشناب دارد؟ ist eine Ja/Nein-Frage, die allein durch die steigende Intonation entsteht, ohne eigenes Fragewort.
  prs.a1.unit45.lesson02.teach.yes_has_bathroom_phrase:
    title: Ja, es hat ein Bad
    gloss: Ja, es hat ein Bad.
    note: بلی ist das bekannte Wort für „ja“.
  prs.a1.unit45.lesson02.teach.reservation_word:
    title: Reservierung
    gloss: Reservierung
    note: رزرو ist ein weit verbreitetes Lehnwort für „Reservierung“ oder „Buchung“.
    example_gloss: Ich habe eine Reservierung.
  prs.a1.unit45.lesson02.teach.have_reservation_phrase:
    title: Ich habe eine Reservierung
    gloss: Ich habe eine Reservierung.
    note: رزرو دارم verbindet رزرو (Reservierung) und دارم (ich habe).
  prs.a1.unit45.lesson03.teach.review_which_number_for:
    title: 'Wiederholung: wie viele/welche Nummer, für, ich möchte'
    gloss: wie viele / welche Nummer / für / ich möchte
    note: چند, برای und می‌خواهم sind bekannte Wörter, mit denen Sie Fragen zum Zimmer stellen.
    target_text: چند (wie viele/welche Nummer) / برای (für) / می‌خواهم (ich möchte)
  prs.a1.unit45.lesson03.teach.number_word:
    title: Zahl
    gloss: Nummer
    note: نمبر ist das alltägliche afghanische Dari-Lehnwort für „Nummer“, z. B. bei Zimmer- oder Telefonnummern.
    example_gloss: Zimmernummer
  prs.a1.unit45.lesson03.teach.what_is_room_number_phrase:
    title: Welche Nummer hat das Zimmer?
    gloss: Welche Nummer hat das Zimmer?
    note: نمبر اتاق چند است؟ fragt mit چند nach der Zimmernummer.
  prs.a1.unit45.lesson03.teach.review_night_numbers:
    title: 'Wiederholung: Nacht, zwei, drei'
    gloss: Nacht / zwei / drei
    note: شب, دو und سه sind bekannte Wörter, mit denen Sie die Aufenthaltsdauer nennen.
    target_text: شب (Nacht) / دو (zwei) / سه (drei)
  prs.a1.unit45.lesson03.teach.stay_word:
    title: Ich bleibe
    gloss: ich bleibe
    note: می‌مانم kommt von ماندن, „bleiben“.
    example_gloss: Ich bleibe zwei Nächte.
  prs.a1.unit45.lesson03.teach.stay_two_nights_phrase:
    title: Ich bleibe zwei Nächte
    gloss: Ich bleibe zwei Nächte.
    note: دو شب می‌مانم verbindet دو شب (zwei Nächte) und می‌مانم (ich bleibe).
  prs.a1.unit45.lesson03.teach.for_two_nights_phrase:
    title: Ich möchte es für zwei Nächte
    gloss: Ich möchte es für zwei Nächte.
    note: برای دو شب می‌خواهم verwendet برای (für) zusammen mit dem bekannten Wort می‌خواهم.
  prs.a1.unit45.lesson03.teach.review_stay_formal:
    title: 'Wiederholung: Sie bleiben (höflich)'
    gloss: Sie bleiben (höflich)
    note: می‌مانین ist die höfliche Form (Plural) zu می‌مانم und gehört zur selben Endung -ین wie می‌خواهین/کنین an anderer Stelle in diesem Kurs.
    target_text: می‌مانین (Sie bleiben, höflich)
  prs.a1.unit45.lesson03.teach.how_many_nights_formal_phrase:
    title: Wie viele Nächte bleiben Sie?
    gloss: Wie viele Nächte bleiben Sie?
    note: چند شب می‌مانین؟ ist die höfliche Frage, die ein Hotelangestellter stellen würde.
  prs.a1.unit45.lesson04.teach.review_welcome_name_am:
    title: 'Wiederholung: willkommen, Wie heißen Sie?, ich bin'
    gloss: willkommen / Wie heißen Sie? / ich bin
    note: خوش آمدین, نام‌تان چیست؟ und استم sind bekannte Wörter und Wendungen für das Einchecken.
    target_text: خوش آمدین (willkommen) / نام‌تان چیست؟ (Wie heißen Sie?) / استم (ich bin)
  prs.a1.unit45.lesson04.teach.review_also_how_about_please_thanks:
    title: 'Wiederholung: auch, und ...?, bitte (beim Reichen), vielen Dank'
    gloss: auch / und ...? / bitte (beim Reichen) / vielen Dank
    note: هم, چطور, بفرمایین und تشکر زیاد (aus früheren Lektionen) sind bekannte Wörter und Wendungen, mit denen Sie den Dialog abschließen.
    target_text: هم (auch) / چطور (wie wäre es mit) / بفرمایین (bitte sehr) / تشکر زیاد (vielen Dank)
  prs.a1.unit45.lesson04.teach.breakfast_phrase:
    title: Das Frühstück
    gloss: Frühstück
    note: چای صبح bedeutet wörtlich „Morgentee“ – so sagt man im afghanischen Dari alltäglich „Frühstück“. Es besteht aus چای (Tee, Lektion 8) und صبح (Morgen, Lektion 16).
  prs.a1.unit45.lesson04.teach.included_word:
    title: Inklusive
    gloss: inklusive
    note: شامل bedeutet „inklusive“ und zeigt an, dass eine Leistung im Zimmerpreis enthalten ist.
    example_gloss: Das Frühstück ist inklusive.
  prs.a1.unit45.lesson04.teach.wifi_word:
    title: WLAN
    gloss: WLAN
    note: وای‌فای ist das übliche Lehnwort für „WLAN“.
    example_gloss: Es gibt auch WLAN.
  prs.a1.unit45.lesson04.teach.dialogue_line1:
    title: 'Homayoun: Hallo. Ich habe eine Reservierung. Ich bleibe zwei Nächte.'
    gloss: Hallo. Ich habe eine Reservierung. Ich bleibe zwei Nächte.
  prs.a1.unit45.lesson04.teach.dialogue_line2:
    title: 'Hotelangestellter: Willkommen. Wie heißen Sie?'
    gloss: Willkommen. Wie heißen Sie?
  prs.a1.unit45.lesson04.teach.dialogue_line3:
    title: 'Homayoun: Ich bin Homayoun.'
    gloss: Ich bin Homayoun.
  prs.a1.unit45.lesson04.teach.dialogue_line4:
    title: 'Hotelangestellter: Sehr gut. Das Zimmer hat ein Bad, und das Frühstück ist inklusive.'
    gloss: Sehr gut. Das Zimmer hat ein Bad, und das Frühstück ist inklusive.
  prs.a1.unit45.lesson04.teach.dialogue_line5:
    title: 'Homayoun: Und WLAN?'
    gloss: Und WLAN?
  prs.a1.unit45.lesson04.teach.dialogue_line6:
    title: 'Hotelangestellter: Ja, es gibt auch WLAN. Hier ist der Schlüssel.'
    gloss: Ja, es gibt auch WLAN. Hier ist der Schlüssel.
  prs.a1.unit45.lesson05.teach.review_reading_words:
    title: 'Wiederholung: Reservierung, Nummer, fünf, Montag, Dienstag, und'
    gloss: Reservierung / Nummer / fünf / Montag / Dienstag / und
    note: رزرو, نمبر (aus dieser Lektion), پنج, دوشنبه, سه‌شنبه und و sind bekannte Wörter, die im Lesetext vorkommen.
    target_text: رزرو (Reservierung) / نمبر (Nummer) / پنج (fünf) / دوشنبه (Montag) / سه‌شنبه (Dienstag) / و (und)
  prs.a1.unit45.lesson05.teach.review_stays_third_person:
    title: 'Wiederholung: er/sie bleibt'
    gloss: er/sie bleibt
    note: می‌ماند ist die Form der 3. Person zur Familie می‌مانم/می‌مانین, die Sie weiter oben in dieser Lektion gelernt haben.
    target_text: می‌ماند (er/sie bleibt)
  prs.a1.unit45.lesson05.teach.reading_passage:
    title: 'Lesetext: Homayouns Reservierung'
    gloss: 'Das ist Homayouns Reservierung. Das Zimmer hat die Nummer fünf. Homayoun bleibt zwei Nächte: Montag und Dienstag. Das Zimmer hat ein Bad, und das Frühstück ist inklusive.'
  prs.a1.unit45.lesson06.teach.review_but_formal_you_hour_time_numbers:
    title: 'Wiederholung: aber, Sie (formell), Stunde, Zeit, sieben, zwölf'
    gloss: aber / Sie (formell) / Stunde / Zeit / sieben / zwölf
    note: اما, شما, ساعت, وقت (aus früheren Lektionen) sowie هفت und دوازده sind Wiederholungswörter, mit denen man einen Zeitplan angibt.
    target_text: اما (aber) / شما (Sie, höflich) / ساعت (Stunde/Uhr) / وقت (Zeit) / هفت (sieben) / دوازده (zwölf)
  prs.a1.unit45.lesson06.teach.checkout_word:
    title: Check-out / Abreise
    gloss: Check-out / Abreise
    note: خروج bezeichnet den Check-out, zum Beispiel in وقت خروج.
    example_gloss: Check-out-Zeit
  prs.a1.unit45.lesson06.teach.checkout_time_phrase:
    title: Check-out ist um zwölf Uhr
    gloss: Check-out ist um zwölf Uhr.
    note: وقت خروج ساعت دوازده است nennt die Check-out-Zeit.
  prs.a1.unit45.lesson06.teach.contrast_breakfast_checkout_phrase:
    title: Frühstück ist um sieben, aber Check-out ist um zwölf
    gloss: Das Frühstück ist um sieben Uhr, aber der Check-out ist um zwölf Uhr.
    note: اما stellt die Frühstückszeit und die Check-out-Zeit einander gegenüber.
  prs.a1.unit45.lesson06.teach.checkout_time_question_phrase:
    title: Wann ist Ihr Check-out?
    gloss: Wann ist Ihr Check-out?
    note: Die höfliche Form mit شما, um nach der Check-out-Zeit zu fragen.
  prs.a1.unit45.lesson04.teach.review_very_good_tea_morning_and:
    target_text: بسیار خوب (sehr gut) / چای (Tee) / صبح (Morgen) / و (und)
