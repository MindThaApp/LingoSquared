  prs.a1.unit56.lesson01.teach.review_this_is_in_good:
    title: 'Wiederholung: dieser/diese/dieses, ist, in, gut'
    gloss: dieser/diese/dieses / ist / in / gut
    note: Dies sind Wiederholungswörter, um über das Fitnessstudio zu sprechen.
    target_text: این (dieser/diese/dieses) / است (ist) / در (in) / خوب (gut)
  prs.a1.unit56.lesson01.teach.review_gym:
    title: 'Wiederholung: Fitnessstudio'
    gloss: Fitnessstudio
    note: '*باشگاه* kam schon früher vor (Sport) und wurde dort mit „Fitnessstudio“ bzw. „Sportverein“ wiedergegeben.'
    target_text: باشگاه (Fitnessstudio)
  prs.a1.unit56.lesson01.teach.membership_word:
    title: Mitgliedschaft
    gloss: Mitgliedschaft
    note: Das ist das übliche Dari-Wort für Mitgliedschaft, etwa bei einer Mitgliedskarte für einen Verein oder ein Zentrum.
    example_gloss: Die Mitgliedschaft in diesem Fitnessstudio ist gut.
  prs.a1.unit56.lesson01.teach.equipment_word:
    title: Geräte
    gloss: Ausrüstung / Sachen
    note: Das ist das gängige Dari-Wort für Ausrüstung, Geräte oder persönliche Sachen.
    example_gloss: Dieses Fitnessstudio hat gute Geräte.
  prs.a1.unit56.lesson01.teach.membership_good_phrase:
    title: Die Mitgliedschaft in diesem Fitnessstudio ist gut
    gloss: Die Mitgliedschaft in diesem Fitnessstudio ist gut.
    note: Hier werden „Mitgliedschaft“ und „gut“ kombiniert.
  prs.a1.unit56.lesson01.teach.equipment_phrase:
    title: Dieses Fitnessstudio hat gute Geräte
    gloss: Dieses Fitnessstudio hat gute Geräte.
    note: '*دارد* ist die Form der 3. Person von „haben“ und aus früheren Lektionen bereits bekannt.'
  prs.a1.unit56.lesson02.teach.review_want_get_membership_card:
    title: 'Wiederholung: ich möchte, bekommen/nehmen, Karte, Mitgliedschaft, ein/eine'
    gloss: ich möchte / bekommen (nehmen) / Karte / Mitgliedschaft / ein/eine
    note: Dies sind Wiederholungswörter, um nach einer Mitgliedskarte zu fragen – mit demselben Muster „X می‌خواهم Y بگیرم“, das dieser Kurs schon beim Fahrradverleih und beim Arzttermin eingeführt hat.
    target_text: می‌خواهم (ich möchte) / بگیرم (damit ich nehme) / کارت (Karte) / عضویت (Mitgliedschaft) / یک (ein/eine)
  prs.a1.unit56.lesson02.teach.review_day_pass_words:
    title: 'Wiederholung: täglich, wie viel, Afghani, 100'
    gloss: täglich / wie viel / Afghani / 100
    note: Dies sind Wiederholungswörter, um nach dem Preis einer Tageskarte zu fragen.
    target_text: روزانه (täglich) / چند (wie viel) / افغانی (Afghani) / صد (100)
  prs.a1.unit56.lesson02.teach.want_membership_card_phrase:
    title: Ich möchte eine Mitgliedskarte holen
    gloss: Ich möchte eine Mitgliedskarte holen.
    note: Hier kommt das bereits bekannte Muster „Ich möchte X holen“ dieses Kurses wieder vor.
