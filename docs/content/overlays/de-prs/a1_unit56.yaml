    title: Wie viel kostet die Tageskarte?
    gloss: Wie viel kostet die Tageskarte?
    note: Eine Tageskarte heißt *کارت روزانه* – wörtlich „tägliche Karte“, aus zwei bereits bekannten Wörtern.
  prs.a1.unit56.lesson02.teach.day_pass_price_answer_phrase:
    title: Die Tageskarte kostet 100 Afghani
    gloss: Die Tageskarte kostet 100 Afghani.
