    target_text: باشگاه (Fitnessstudio) / ساعت (Uhr) / چند (wie viel)
  prs.a1.unit56.lesson03.teach.class_word:
    title: Kurs
    gloss: Kurs
    note: Das ist das Dari-Wort für einen Kurs. Hier bezeichnet es einen Sportkurs im Fitnessstudio, nicht nur einen Lehrgang.
    example_gloss: Der Kurs ist um fünf Uhr.
  prs.a1.unit56.lesson03.teach.review_five:
    title: 'Wiederholung: fünf'
    gloss: fünf
    note: Dies ist eine Wiederholungszahl aus Lektion 4.
    target_text: پنج (fünf)
  prs.a1.unit56.lesson03.teach.class_time_phrase:
    title: Der Kurs ist um fünf Uhr
    gloss: Der Kurs ist um fünf Uhr.
