    gloss: Kuchen
    note: کیک bedeutet „Kuchen“ und ist ein gemeinsames persisch-dari Lehnwort.
    example_gloss: Der Kuchen ist lecker.
  prs.a1.unit32.lesson01.teach.gift_word:
    title: Geschenk
    gloss: Geschenk
    note: هدیه bedeutet „Geschenk“ und ist ein gebräuchliches Alltagswort im Dari und Persischen (auch تحفه wird verwendet).
    example_gloss: Dieses Geschenk ist für Sie.
  prs.a1.unit32.lesson01.teach.congratulations_word:
    title: Glückwunsch
    gloss: Glückwunsch
    note: تبریک bedeutet „Glückwunsch“ und wird mit می‌گویم („ich sage“) in der Alltagsformel تبریک می‌گویم („ich gratuliere“) verwendet.
    example_gloss: Herzlichen Glückwunsch!
  prs.a1.unit32.lesson01.teach.review_mubarak:
    title: Alles Gute zum Geburtstag (Bildung)
    gloss: dein Geburtstag (informell) + gesegnet → Alles Gute zum Geburtstag
    note: تولدت verbindet تولد („Geburtstag“) mit der informellen Endung -ت („dein“); مبارک bedeutet „gesegnet“ bzw. „glücklich“. Zusammen ergibt تولدت مبارک den üblichen Geburtstagsglückwunsch im Dari und Persischen.
    target_text: تولدت (dein Geburtstag, informell) + مبارک (gesegnet) = تولدت مبارک (Alles Gute zum Geburtstag)
  prs.a1.unit32.lesson01.teach.happy_birthday_phrase:
    title: Alles Gute zum Geburtstag!
    gloss: Alles Gute zum Geburtstag!
    note: Der echte, weit verbreitete Geburtstagsglückwunsch im Dari und Persischen (تولدتان مبارک ist die formelle Variante und wird in den Übungen dieser Lektion nicht abgefragt).
