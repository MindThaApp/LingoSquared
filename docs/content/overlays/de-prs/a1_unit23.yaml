  description: 'Kabuler Dari für Anfänger: Wortschatz zu Geld und Bezahlung, Fragen nach der Zahlungsart, Geldwechsel in einer صرافی (Wechselstube) und ein Dialog zwischen Zarmina und Homayoun beim Tausch von Dollar in Afghani.'
