teaching:
  prs.a1.unit23.lesson01.teach.pul:
    title: Geld
    gloss: Geld
    note: پول bedeutet Geld.
    example_gloss: Ich habe Geld.
  prs.a1.unit23.lesson01.teach.naqd:
    title: Bargeld
    gloss: bar
    note: نقد bedeutet bar / Bargeld.
    example_gloss: Ich zahle bar.
  prs.a1.unit23.lesson01.teach.kart:
    title: Karte
    gloss: Karte
    note: کارت bedeutet Karte (Zahlungskarte).
    example_gloss: Ich habe eine Karte.
  prs.a1.unit23.lesson01.teach.dollar:
    title: Dollar
    gloss: Dollar
    note: دالر bedeutet Dollar (USD) – im afghanischen Alltag beim Geldwechsel weit verbreitet und neben dem Afghani üblich.
    example_gloss: Ich habe hundert Dollar.
  prs.a1.unit23.lesson01.teach.review_dorom:
    title: Ich habe
    gloss: ich habe
    note: دارم bedeutet „ich habe“ (bereits in Einheit 10, Einkaufen, eingeführt).
    example_gloss: Ich habe Geld.
  prs.a1.unit23.lesson01.teach.review_sad:
    title: Hundert
    gloss: hundert
    note: صد bedeutet hundert – bereits in Einheit 4 (Zahlen) eingeführt und in Einheit 10 (Einkaufen) wieder verwendet.
    example_gloss: Ich habe hundert Dollar.
  prs.a1.unit23.lesson02.teach.mipardazam:
    title: Ich zahle
    gloss: ich zahle
    note: می‌پردازم bedeutet „ich bezahle“.
    example_gloss: Ich zahle bar.
  prs.a1.unit23.lesson02.teach.ya:
    title: Oder
    gloss: oder
    note: یا bedeutet oder.
    example_gloss: Ich zahle bar oder mit Karte.
  prs.a1.unit23.lesson02.teach.naqdi_ya_karti:
    title: Bar oder Karte?
    gloss: Zahlen Sie bar oder mit Karte?
    note: Eine häufige Frage im Geschäft oder am Wechselschalter.
  prs.a1.unit23.lesson02.teach.review_mitanom:
    title: Ich kann
    gloss: ich kann
    note: می‌توانم bedeutet „ich kann“ (bereits früher im Kurs eingeführt).
    example_gloss: Ich kann bar bezahlen.
  prs.a1.unit23.lesson02.teach.bepardazam:
    title: Bezahlen
    gloss: bezahlen
    note: بپردازم ist die Konjunktivform von „bezahlen“ und steht nach می‌توانم (ich kann) – می‌توانم نقد بپردازم heißt wörtlich „Ich kann bar bezahlen“.
    example_gloss: Ich kann bar bezahlen.
  prs.a1.unit23.lesson03.teach.sarafi:
    title: Wechselstube
    gloss: Wechselstube
    note: صرافی ist die echte, in Afghanistan übliche Einrichtung zum Geldwechsel – nicht zu verwechseln mit einer förmlichen بانک (Bank).
    example_gloss: Ich gehe zur Wechselstube.
  prs.a1.unit23.lesson03.teach.tabdil_kardan:
    title: Wechseln
    gloss: wechseln
    note: تبدیل کردن bedeutet „wechseln“ (Geld).
    example_gloss: Ich wechsle Dollar in Afghani.
  prs.a1.unit23.lesson03.teach.narkh:
    title: Wechselkurs
    gloss: Wechselkurs
    note: نرخ bedeutet Kurs / Wechselkurs.
    example_gloss: Wie hoch ist der Dollarkurs heute?
  prs.a1.unit23.lesson03.teach.narkh_chand_ast:
    title: Wie ist der Kurs heute?
    gloss: Wie hoch ist der Dollarkurs heute?
    note: So fragt man üblicherweise nach dem Wechselkurs.
  prs.a1.unit23.lesson03.teach.review_afghani:
    title: Afghani
    gloss: Afghani
    note: افغانی ist die Währung Afghanistans (bereits in Einheit 10, Einkaufen, eingeführt, z. B. „صد افغانی“).
    example_gloss: Ich habe hundert Afghani.
  prs.a1.unit23.lesson03.teach.review_ast_emroz_chand:
    title: 'Wiederholung: ist, heute, wie viel'
    gloss: ist / heute / wie viel
    note: است, امروز und چند sind Wiederholungswörter (bereits früher im Kurs eingeführt), die in der Kursfrage dieser Lektion zusammenkommen.
    example_gloss: Wie hoch ist der Dollarkurs heute?
  prs.a1.unit23.lesson03.teach.review_ba_ra_mikonam:
    title: 'Wiederholung: zu/nach, Objektmarker, ich mache, machen, ich möchte'
    gloss: zu/nach / Objektmarker / ich mache / machen / ich möchte
    note: به, را, می‌کنم, کنم und می‌خواهم sind Wiederholungswörter (bereits früher im Kurs eingeführt), die in den Wechselsätzen dieser Lektion zusammenkommen.
    example_gloss: Ich möchte Dollar in Afghani wechseln.
  prs.a1.unit23.lesson04.teach.review_mikhaham:
    title: ich möchte
    gloss: ich möchte
    note: می‌خواهم bedeutet „ich möchte“ (aus früheren Einheiten bekannt).
    example_gloss: Ich möchte Dollar wechseln.
  prs.a1.unit23.lesson04.teach.chand_darin:
    title: Wie viele haben Sie?
    gloss: Wie viele Dollar haben Sie?
    note: دارین ist die höfliche Form bzw. Pluralform von „haben“, mit der man den Kunden anspricht.
  prs.a1.unit23.lesson04.teach.bufarmayin:
    title: Bitte schön
    gloss: bitte schön
    note: بفرمایین ist eine höfliche Wendung, wenn man jemandem etwas überreicht.
    example_gloss: Bitte sehr, siebentausend Afghani.
  prs.a1.unit23.lesson04.teach.hazar:
    title: Tausend
    gloss: tausend
    note: هزار bedeutet „tausend“.
    example_gloss: Siebentausend Afghani.
  prs.a1.unit23.lesson04.teach.review_zarmina:
    title: Zarmina
    gloss: Zarmina
    note: زرمینه ist eine feste, immer wiederkehrende Figur.
    example_gloss: Zarmina geht zur Wechselstube.
  prs.a1.unit23.lesson04.teach.review_besyar_khub:
    title: Sehr gut
    gloss: sehr gut
    note: بسیار خوب ist bereits bekannt und wird hier verwendet, um ein Angebot anzunehmen.
    example_gloss: Sehr gut, danke.
  prs.a1.unit23.lesson04.teach.review_haftad_tashakor_kard:
    title: 'Wiederholung: siebzig, danke, tat/machte'
    gloss: siebzig / danke / tat, machte (er/sie)
    note: هفتاد und تشکر sind Wiederholungswörter. کرد ist die Vergangenheit der 3. Person von کردن („tun, machen“) und kam schon in der Lektion zur Vergangenheit in Einheit 20 vor. Hier fasst es den Ablauf zusammen.
    example_gloss: Zarmina wechselte hundert Dollar in Afghani.
  prs.a1.unit23.lesson04.teach.turn01:
    title: 'Zarmina: Hallo, ich möchte Dollar in Afghani wechseln.'
    gloss: Hallo, ich möchte Dollar in Afghani wechseln.
  prs.a1.unit23.lesson04.teach.turn02:
    title: 'Geldwechsler: Wie viele Dollar haben Sie?'
    gloss: Wie viele Dollar haben Sie?
  prs.a1.unit23.lesson04.teach.turn03:
    title: 'Zarmina: Ich habe hundert Dollar. Wie ist der Kurs heute?'
    gloss: Ich habe hundert Dollar. Wie ist der Kurs heute?
  prs.a1.unit23.lesson04.teach.turn04:
    title: 'Geldwechsler: Heute ist ein Dollar siebzig Afghani wert.'
    gloss: Heute ist ein Dollar siebzig Afghani wert.
  prs.a1.unit23.lesson04.teach.turn05:
    title: 'Zarmina: Sehr gut, wechseln Sie bitte.'
    gloss: Sehr gut, wechseln Sie bitte.
    note: تبدیل کنین ist der höfliche Imperativ „wechseln Sie (bitte)“.
  prs.a1.unit23.lesson04.teach.turn06:
    title: 'Geldwechsler: Bitte sehr, siebentausend Afghani.'
    gloss: Bitte sehr, siebentausend Afghani.
  prs.a1.unit23.lesson04.teach.turn07:
    title: 'Zarmina: Danke.'
    gloss: Danke.
  prs.a1.unit23.lesson05.teach.rasid:
    title: Quittung
    gloss: Kassenbon
    note: رسید bedeutet „Quittung“.
    example_gloss: Ich nehme eine Quittung.
  prs.a1.unit23.lesson05.teach.migiram:
    title: Ich nehme / bekomme
    gloss: ich nehme / ich bekomme
    note: می‌گیرم bedeutet „ich nehme / ich bekomme“.
    example_gloss: Ich nehme das Geld.
  prs.a1.unit23.lesson05.teach.reading_text:
    title: Lesetext
    gloss: Zarmina ging zur Wechselstube. Sie hatte hundert Dollar und wollte Dollar in Afghani wechseln. Der Kurs war heute siebzig Afghani. Zarmina bekam siebentausend Afghani und nahm eine Quittung.
  prs.a1.unit23.lesson05.teach.review_raft:
    title: Ging
    gloss: ging
    note: رفت ist die Vergangenheit „ging“ (er/sie).
    example_gloss: Zarmina ging zur Wechselstube.
  prs.a1.unit23.lesson05.teach.review_haft_gereft:
    title: 'Wiederholung: sieben, nahm/bekam (er/sie), ich nahm/bekam'
    gloss: sieben / nahm, bekam (er/sie) / ich nahm, bekam
    note: هفت ist eine Zahl zur Wiederholung. گرفت und گرفتم sind die Vergangenheitsformen der 3. und 1. Person von گرفتن („nehmen, bekommen“); hier beziehen sie sich auf den Betrag, den Zarmina bekam.
    example_gloss: Zarmina bekam siebentausend Afghani.
  prs.a1.unit23.lesson06.teach.review_summary:
    title: Zusammenfassung
    gloss: 'Ich habe Geld: Bargeld und eine Karte. Ich kann in der Wechselstube Dollar in Afghani wechseln. Der Kurs heute ist siebzig Afghani für einen Dollar.'
  prs.a1.unit23.lesson06.teach.review_bara:
    title: Für
    gloss: für
    note: برای bedeutet „für“.
    example_gloss: Siebzig Afghani für einen Dollar.
  prs.a1.unit23.lesson06.teach.review_va:
    title: Und
    gloss: und
    note: و bedeutet „und“ und ist aus früheren Einheiten bereits bekannt.
    example_gloss: 'Ich habe Geld: Bargeld und eine Karte.'
