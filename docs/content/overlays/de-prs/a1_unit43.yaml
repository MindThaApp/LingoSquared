  prs.a1.unit43.lesson03.borrowing_and_returning:
    title: Das Buch ausleihen und zurückgeben
  prs.a1.unit43.lesson04.library_dialogue:
    title: Dialog in der Bibliothek
  prs.a1.unit43.lesson05.reading:
    title: Lesetext über das ausgeliehene Buch
  prs.a1.unit43.lesson06.wrap_up:
    title: Zusammenfassung
teaching:
  prs.a1.unit43.lesson01.teach.review_book_have_is_in:
    title: 'Wiederholung: Buch, ich habe, ist, in'
    gloss: Buch / ich habe / ist / in
    note: کتاب, دارم, است und در sind Wörter zur Wiederholung, mit denen man über ein Buch spricht.
    target_text: کتاب (Buch) / دارم (ich habe) / است (ist) / در (in)
  prs.a1.unit43.lesson01.teach.review_want_one:
    title: 'Wiederholung: ich möchte, ein/eins'
    gloss: ich möchte / ein / eins
    note: می‌خواهم und یک verbindet man, um zu sagen, was man möchte.
    target_text: می‌خواهم (ich möchte) / یک (ein/eine/eins)
  prs.a1.unit43.lesson01.teach.library_word:
    title: Bibliothek
    gloss: Bibliothek
    note: کتابخانه ist das gebräuchliche Dari-Wort für Bibliothek und setzt sich aus کتاب (Buch) und خانه (Haus) zusammen.
    example_gloss: Das Buch ist in der Bibliothek.
  prs.a1.unit43.lesson01.teach.librarian_word:
    title: Bibliothekar/in
    gloss: Bibliothekar/in
    note: کتابدار bedeutet wörtlich „Buchhalter“ (jemand, der sich um die Bücher kümmert) und ist genauso gebildet wie دوکاندار („Ladenbesitzer“, Lektion 8).
    example_gloss: Der Bibliothekar ist in der Bibliothek.
  prs.a1.unit43.lesson01.teach.want_book_phrase:
    title: Ich möchte ein Buch
    gloss: Ich möchte ein Buch.
    note: یک کتاب می‌خواهم verbindet یک (ein/eins), کتاب (Buch) und می‌خواهم (ich möchte).
  prs.a1.unit43.lesson01.teach.review_from_object_marker:
    title: 'Wiederholung: von, Objektmarker'
    gloss: von / (Objektmarker)
    note: از (von) und را (kennzeichnet das Objekt eines Satzes, aus Lektion 14/Lektion 26) sind Wörter zur Wiederholung.
    target_text: از (von/aus) / را (Objektmarker)
  prs.a1.unit43.lesson01.teach.want_book_from_librarian_phrase:
    title: Ich möchte das Buch vom Bibliothekar
    gloss: Ich möchte das Buch vom Bibliothekar.
    note: از کتابدار (vom Bibliothekar) wird zu کتاب را می‌خواهم hinzugefügt.
  prs.a1.unit43.lesson01.teach.want_one_book_from_librarian_phrase:
    title: Ich möchte ein Buch vom Bibliothekar
    gloss: Ich möchte ein Buch vom Bibliothekar.
    note: Verbindet یک (ein/eins) mit کتاب را از کتابدار می‌خواهم.
  prs.a1.unit43.lesson02.teach.review_date_day_monday:
    title: 'Wiederholung: Datum, Tag, Montag'
    gloss: Datum / Tag / Montag
    note: تاریخ, روز und دوشنبه (alle aus Lektion 9) sind Wiederholungswörter, mit denen man nach einem Rückgabedatum fragt.
    target_text: تاریخ (Datum) / روز (Tag) / دوشنبه (Montag)
  prs.a1.unit43.lesson02.teach.review_which_is:
    title: 'Wiederholung: welche/r/s, ist'
    gloss: welche/r/s / ist
    note: کدام und است sind Wiederholungswörter, mit denen man eine Frage stellt.
    target_text: کدام (welche/r/s) / است (ist)
  prs.a1.unit43.lesson02.teach.return_giving_back_word:
    title: Zurückgeben
    gloss: zurückgeben
    note: پس دادن bedeutet wörtlich „zurückgeben“; پس (zurück) wird mit دادن (geben) verbunden.
    example_gloss: Das Rückgabedatum ist Montag.
  prs.a1.unit43.lesson02.teach.ask_return_date_phrase:
    title: Welcher Tag ist der Rückgabetermin?
    gloss: An welchem Tag muss das Buch zurückgegeben werden?
    note: تاریخ پس دادن کتاب کدام روز است؟ fragt, wann ein geliehenes Buch zurückgegeben werden muss.
  prs.a1.unit43.lesson02.teach.return_date_answer_phrase:
    title: Das Rückgabedatum ist Montag
    gloss: Das Rückgabedatum ist Montag.
    note: تاریخ پس دادن دوشنبه است beantwortet die Frage mit einem bestimmten Tag.
  prs.a1.unit43.lesson03.teach.review_want_book_one_this:
    title: 'Wiederholung: ich möchte, Buch, ein/eine, dieses'
    gloss: ich möchte / Buch / ein/eine / dieses
    note: می‌خواهم، کتاب، یک und این sind Wiederholungswörter, mit denen man um ein bestimmtes Buch bittet.
    target_text: می‌خواهم (ich möchte) / کتاب (Buch) / یک (ein/eine/eins) / این (dies)
  prs.a1.unit43.lesson03.teach.get_word:
    title: Nehmen / bekommen
    gloss: nehmen / bekommen
    note: بگیرم ist die Konjunktivform („dass ich nehme/bekomme“), dieselbe Form, die in Lektion 42 mit می‌خواهم verwendet wurde, um „ich möchte bekommen“ zu sagen.
    example_gloss: Ich möchte ein Buch bekommen.
  prs.a1.unit43.lesson03.teach.loan_word:
    title: Leihe
    gloss: Leihe
    note: قرض bedeutet Darlehen oder Leihe; قرض گرفتن („als Leihgabe nehmen“) ist die alltägliche Art, im Dari „ausleihen“ zu sagen.
    example_gloss: Dieses Buch ist geliehen.
  prs.a1.unit43.lesson03.teach.want_borrow_book_phrase:
    title: Ich möchte das Buch ausleihen
    gloss: Ich möchte das Buch ausleihen.
    note: می‌خواهم کتاب را قرض بگیرم verbindet می‌خواهم, کتاب را, قرض und den Konjunktiv بگیرم.
  prs.a1.unit43.lesson03.teach.give_back_word:
    title: (Zurück)geben
    gloss: (zurück)geben
    note: بدهم ist die Konjunktivform von دادن (geben); mit پس (zurück) bedeutet es „zurückgeben“.
    example_gloss: Ich möchte es zurückgeben.
  prs.a1.unit43.lesson03.teach.want_return_book_phrase:
    title: Ich möchte das Buch zurückgeben
    gloss: Ich möchte das Buch zurückgeben.
    note: می‌خواهم کتاب را پس بدهم verbindet می‌خواهم, کتاب را, پس und den Konjunktiv بدهم.
  prs.a1.unit43.lesson03.teach.review_very_good:
    title: 'Wiederholung: sehr, gut'
    gloss: sehr / gut
    note: بسیار und خوب sind Wiederholungswörter, mit denen man etwas bestätigt.
    target_text: بسیار (sehr) / خوب (gut)
  prs.a1.unit43.lesson03.teach.good_answer_phrase:
    title: Das ist gut
    gloss: Das ist gut.
    note: خوب است bestätigt, dass etwas passt.
  prs.a1.unit43.lesson04.teach.review_hello_want:
    title: 'Wiederholung: Hallo, ich möchte'
    gloss: Hallo / ich möchte
    note: سلام und می‌خواهم sind Wiederholungswörter, die im Dialog vorkommen.
    target_text: سلام (Hallo) / می‌خواهم (ich möchte)
  prs.a1.unit43.lesson04.teach.review_very_thanks_welcome:
    title: 'Wiederholung: sehr, vielen Dank, gern geschehen'
    gloss: sehr / vielen Dank / gern geschehen
    note: بسیار, تشکر زیاد und خواهش می‌کنم sind Wiederholungswörter, die im Dialog vorkommen.
    target_text: بسیار (sehr) / تشکر زیاد (vielen Dank) / خواهش می‌کنم (bitte, gern geschehen)
  prs.a1.unit43.lesson04.teach.dialogue_line1:
    title: 'Homayoun: Hallo. Ich möchte ein Buch ausleihen.'
    gloss: Hallo. Ich möchte ein Buch ausleihen.
  prs.a1.unit43.lesson04.teach.dialogue_line2:
    title: 'Bibliothekar: Hallo. Welches Buch möchten Sie?'
    gloss: Hallo. Welches Buch möchten Sie?
    note: می‌خواهین ist die höfliche Pluralform von „Sie möchten“.
  prs.a1.unit43.lesson04.teach.dialogue_line3:
    title: 'Homayoun: Ich möchte dieses Buch.'
    gloss: Ich möchte dieses Buch.
  prs.a1.unit43.lesson04.teach.dialogue_line4:
    title: 'Bibliothekar: Gut. Das Rückgabedatum ist Montag.'
    gloss: Gut. Das Rückgabedatum ist Montag.
  prs.a1.unit43.lesson04.teach.dialogue_line5:
    title: 'Homayoun: Sehr gut. Vielen Dank.'
    gloss: Sehr gut. Vielen Dank.
  prs.a1.unit43.lesson04.teach.dialogue_line6:
    title: 'Bibliothekar: Gern geschehen.'
    gloss: Gern geschehen.
  prs.a1.unit43.lesson05.teach.review_he_she_has:
    title: 'Wiederholung: Homayoun, er/sie, er/sie hat'
    gloss: Homayoun / er/sie / er/sie hat
    note: همایون, او und دارد sind Wiederholungswörter, die im Lesetext vorkommen.
    target_text: همایون (Homayoun) / او (er/sie) / دارد (er/sie hat)
  prs.a1.unit43.lesson05.teach.reading_passage:
    title: Lesetext über das geliehene Buch
    gloss: Homayoun hat ein Buch. Sein Buch ist aus der Bibliothek. Das Rückgabedatum seines Buches ist Montag. Homayoun ist glücklich.
  prs.a1.unit43.lesson06.teach.review_wrap_up_words:
    title: 'Wiederholung: ich habe nicht, aber, Sie (formell)'
    gloss: ich habe nicht / aber / Sie (formell)
    note: ندارم, اما und شما sind Wiederholungswörter, mit denen man zwei Tage gegenüberstellt.
    target_text: ندارم (ich habe nicht) / اما (aber) / شما (Sie, höflich)
  prs.a1.unit43.lesson06.teach.review_tuesday:
    title: 'Wiederholung: Dienstag'
    gloss: Dienstag
    note: سه‌شنبه ist ein Wiederholungswort.
    target_text: سه‌شنبه (Dienstag)
  prs.a1.unit43.lesson06.teach.contrast_phrase:
    title: Montag habe ich ein Buch, aber Dienstag nicht
    gloss: Montag habe ich ein Buch, aber Dienstag habe ich keins.
    note: اما stellt gegenüber, dass man am Montag ein Buch hat, am Dienstag aber nicht.
  prs.a1.unit43.lesson06.teach.formal_question_phrase:
    title: Welches Buch möchten Sie?
    gloss: Welches Buch möchten Sie?
    note: Die formelle Variante mit شما, um zu fragen, welches Buch jemand möchte.
