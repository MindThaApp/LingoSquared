course:
  title: Dari in Deutsch A1
  description: 'Dari für Anfänger (Kabul): ein einfaches Bibliotheksmedium ausleihen und zurückgeben, nach dem Rückgabetermin fragen und einen kurzen Text über ein ausgeliehenes Buch lesen – fragen, welches Buch jemand möchte, einen Rückgabetermin nennen und bestätigen und einen einfachen Austausch in der Bibliothek verstehen.'
units:
  prs.a1.unit43.library:
    title: Die Bibliothek
    description: Um ein Buch bitten, es ausleihen und zurückgeben, nach dem Rückgabetermin fragen und ihn bestätigen und einen kurzen Text über ein ausgeliehenes Buch lesen.
lessons:
  prs.a1.unit43.lesson01.library_vocabulary:
