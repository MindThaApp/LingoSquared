  prs.a1.unit17.lesson03.asking_for_help:
    title: Nach einem Arzt oder Medizin fragen
  prs.a1.unit17.lesson04.reading_health_advice:
    title: Einen Gesundheitshinweis lesen
  prs.a1.unit17.lesson05.reading_a_health_message:
    title: Eine Nachricht zur Gesundheit lesen
  prs.a1.unit17.lesson06.doctor_dialogue:
    title: Ein Dialog mit dem Arzt
teaching:
  prs.a1.unit17.lesson01.teach.headache_word:
    title: Kopfschmerzen
    gloss: Kopfschmerzen
    note: سردرد ist eine Zusammensetzung aus سر (Kopf) und درد (Schmerz).
    example_gloss: Ich habe Kopfschmerzen.
  prs.a1.unit17.lesson01.teach.fever_word:
    title: Fieber
    gloss: Fieber
    note: تب bedeutet Fieber.
    example_gloss: Ich habe Fieber.
  prs.a1.unit17.lesson01.teach.stomachache_word:
    title: Bauchschmerzen
    gloss: Bauchschmerzen
    note: 'دل‌درد ist eine Zusammensetzung aus دل (umgangssprachlich: Bauch, Magen) und درد (Schmerz).'
    example_gloss: Ich habe Bauchschmerzen.
  prs.a1.unit17.lesson01.teach.have_word:
    title: Ich habe
    gloss: ich habe
    note: دارم ist die Form der 1. Person Singular im Präsens von داشتن (haben).
    target_text: دارم (ich habe)
  prs.a1.unit17.lesson02.teach.sick_word:
    title: Krank
    gloss: krank
    note: مریض bedeutet krank.
    example_gloss: Ich bin krank.
  prs.a1.unit17.lesson02.teach.am_word:
    title: Ich bin
    gloss: ich bin
    note: استم ist die höfliche Form der Kopula in der 1. Person, passend zum Register استم/استین in diesem Kurs.
    target_text: استم (ich bin)
  prs.a1.unit17.lesson02.teach.my_condition_word:
    title: Wie es mir geht
    gloss: wie es mir geht / mein Befinden
    note: حالم (حال + م) heißt wörtlich „mein Befinden“ – حالم خوب نیست bedeutet „Mir geht es nicht gut“.
    target_text: حالم (wie es mir geht / mein Befinden)
  prs.a1.unit17.lesson02.teach.good_word:
    title: Gut
    gloss: gut
    note: خوب bedeutet gut.
    example_gloss: Mir geht es nicht gut.
  prs.a1.unit17.lesson02.teach.not_word:
    title: Ist nicht
    gloss: ist nicht
    note: نیست ist die verneinte Kopula – خوب نیست bedeutet „ist nicht gut“.
    target_text: نیست (ist nicht)
  prs.a1.unit17.lesson03.teach.doctor_word:
    title: Arzt
    gloss: Arzt
    note: داکتر ist die in Afghanistan übliche Schreibung und Aussprache für „Arzt“ (anders als دکتر im iranischen Persisch).
    example_gloss: Ich möchte einen Arzt.
  prs.a1.unit17.lesson03.teach.medicine_word:
    title: Medizin
    gloss: Medizin
    note: دوا bedeutet Medizin.
    example_gloss: Ich möchte Medizin.
  prs.a1.unit17.lesson03.teach.want_word:
    title: Ich möchte
    gloss: ich möchte
    note: می‌خواهم bedeutet „ich möchte“.
    target_text: می‌خواهم (ich möchte)
  prs.a1.unit17.lesson04.teach.rest_word:
    title: Ruhe
    gloss: ruhen Sie sich aus
    note: استراحت ist das Nomen „Ruhe, Erholung“ – zusammen mit کنین bildet es den Imperativ „Ruhen Sie sich aus!“
    example_gloss: Ruhen Sie sich aus.
  prs.a1.unit17.lesson04.teach.do_word:
    title: Machen Sie (höflich)
    gloss: machen (höflicher Imperativ)
    note: کنین ist der höfliche Imperativ von کردن (machen) – استراحت کنین heißt wörtlich „Machen Sie Ruhe“, also „Ruhen Sie sich aus“.
    target_text: کنین (machen Sie – höflicher Imperativ)
  prs.a1.unit17.lesson04.teach.water_word:
    title: Wasser
    gloss: das Wasser
    note: آب bedeutet Wasser.
    example_gloss: Trinken Sie viel Wasser.
  prs.a1.unit17.lesson04.teach.a_lot_word:
    title: Viel
    gloss: viel
    note: زیاد bedeutet viel.
    example_gloss: Trinken Sie viel Wasser.
  prs.a1.unit17.lesson04.teach.drink_word:
    title: Trinken Sie (höflich)
    gloss: trinken (höflicher Imperativ)
    note: بنوشین ist der höfliche Imperativ von نوشیدن (trinken).
    target_text: بنوشین (trinken Sie – höflicher Imperativ)
  prs.a1.unit17.lesson04.teach.advice_text:
    title: Ein Gesundheitshinweis
    gloss: Ruhen Sie sich aus. Trinken Sie viel Wasser.
    note: Ein kurzer Hinweis mit zwei einfachen Gesundheitsratschlägen.
  prs.a1.unit17.lesson05.teach.hello_word:
    title: Hallo
    gloss: hallo
    note: سلام bedeutet „Hallo“.
    example_gloss: Hallo. Ich bin krank.
  prs.a1.unit17.lesson05.teach.and_word:
    title: Und
    gloss: und
    note: و bedeutet „und“ und verbindet zwei Wörter oder Satzteile.
    target_text: و (und)
  prs.a1.unit17.lesson05.teach.message_text:
    title: Eine kurze Nachricht zur Gesundheit
    gloss: Hallo. Ich bin krank. Ich habe Kopfschmerzen und Fieber.
    note: Eine kurze Nachricht in der ersten Person, die zwei Beschwerden beschreibt.
  prs.a1.unit17.lesson06.teach.names:
    title: Baschir und der Arzt
    gloss: Baschir, der Arzt
    note: Baschir ist eine wiederkehrende Figur in diesem Kurs; der Arzt wird mit der Höflichkeitsanrede صاحب angesprochen.
    example_gloss:
    - Ich bin Baschir.
    - Ich bin der Arzt.
  prs.a1.unit17.lesson06.teach.how_word:
    title: Wie
    gloss: wie
    note: چطور bedeutet „wie“.
    target_text: چطور (wie)
  prs.a1.unit17.lesson06.teach.are_you_word:
    title: Sie sind (höflich)
    gloss: Sie sind; ihr seid
    note: استین ist die höfliche Form der Kopula in der 2. Person, passend zum Register استم/استین in diesem Kurs.
    target_text: استین (Sie sind – höflich)
  prs.a1.unit17.lesson06.teach.thanks_word:
    title: Danke
    gloss: danke
    note: تشکر bedeutet „danke“.
    example_gloss: Danke, Herr Doktor.
  prs.a1.unit17.lesson06.teach.sir_word:
    title: Herr
    gloss: Herr
    note: صاحب ist eine respektvolle Anrede, die einem Namen oder Titel nachgestellt wird – داکتر صاحب bedeutet „Herr Doktor“ und ist typisch afghanischer Sprachgebrauch.
    example_gloss: Danke, Herr Doktor.
  prs.a1.unit17.lesson06.teach.dialogue_line1:
    title: Der Arzt begrüßt Baschir
    gloss: Hallo. Wie geht es Ihnen?
  prs.a1.unit17.lesson06.teach.dialogue_line2:
    title: Baschir antwortet
    gloss: Hallo. Ich bin krank. Ich habe Kopfschmerzen und Fieber.
  prs.a1.unit17.lesson06.teach.dialogue_line3:
    title: Der Arzt gibt Ratschläge
    gloss: Ruhen Sie sich aus. Trinken Sie viel Wasser.
  prs.a1.unit17.lesson06.teach.dialogue_line4:
    title: Baschir dankt dem Arzt
    gloss: Danke, Herr Doktor.
