course:
  title: Dari in Deutsch A1
  description: 'Dari (Kabul) für Anfänger: grundlegende Beschwerden (Kopfschmerzen, Fieber, Bauchschmerzen), sagen, dass man sich unwohl fühlt, nach einem Arzt oder Medizin fragen, einen kurzen Gesundheitshinweis und eine kurze Nachricht mit Beschwerden lesen und ein Dialog mit einem Arzt.'
units:
  prs.a1.unit17.health:
    title: Gesundheit
    description: Ein einfaches gesundheitliches Problem nennen und einfache Ratschläge zum sofortigen Handeln verstehen.
lessons:
  prs.a1.unit17.lesson01.symptom_words:
    title: Wörter für Beschwerden
  prs.a1.unit17.lesson02.feeling_unwell:
