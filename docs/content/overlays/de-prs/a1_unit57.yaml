teaching:
  prs.a1.unit57.lesson01.teach.review_this_is_in_good:
    title: 'Wiederholung: dieser, ist, in, gut'
    gloss: dieser / ist / in / gut
    note: Das sind Wiederholungswörter, um über den Strand zu sprechen.
    target_text: این (dies) / است (ist) / در (in) / خوب (gut)
  prs.a1.unit57.lesson01.teach.beach_word:
    title: Strand
    gloss: Strand / Ufer
    note: '*ساحل* ist im Standard-Dari und im Persischen das Wort für Strand, Ufer oder Küste. Da Afghanistan keinen Meerzugang hat, steht es in diesem Kurs für das sandige Ufer eines Sees oder Flusses – ein echtes, beliebtes Ausflugsziel.'
    example_gloss: Dieser Strand ist schön.
  prs.a1.unit57.lesson01.teach.sand_word:
    title: Sand
    gloss: Sand
    note: Das ist das übliche Dari-Wort für Sand.
    example_gloss: Am Strand ist Sand.
  prs.a1.unit57.lesson01.teach.beach_is_nice_phrase:
    title: Dieser Strand ist schön
    gloss: Dieser Strand ist schön.
    note: Der Satz verbindet „Strand“ und „gut“.
  prs.a1.unit57.lesson01.teach.sand_on_beach_phrase:
    title: Am Strand ist Sand
    gloss: Am Strand ist Sand.
  prs.a1.unit57.lesson02.teach.review_beach_open_closed_is:
    title: 'Wiederholung: Strand, geöffnet, geschlossen, ist'
    gloss: Strand / geöffnet / geschlossen / ist
    note: Das sind Wiederholungswörter, um die Öffnungszeiten des Strands zu lesen.
    target_text: ساحل (Strand) / باز (geöffnet) / بسته (geschlossen) / است (ist)
  prs.a1.unit57.lesson02.teach.review_hours_words:
    title: 'Wiederholung: von, bis, sieben, Morgen, fünf, Nachmittag, Uhr'
    gloss: von / bis / sieben / Morgen / fünf / Nachmittag / Uhr
    note: Das sind Wiederholungswörter, um die Öffnungszeiten des Strands anzugeben.
    target_text: از (von) / تا (bis) / هفت (sieben) / صبح (Morgen) / پنج (fünf) / عصر (Nachmittag) / ساعت (Uhr)
  prs.a1.unit57.lesson02.teach.beach_sign_reading:
    title: Das Strandschild lesen
    gloss: Der Strand ist von sieben Uhr morgens bis fünf Uhr nachmittags geöffnet.
  prs.a1.unit57.lesson03.teach.review_swim_want_do:
    title: 'Wiederholung: Schwimmen, ich möchte, dass ich tue'
    gloss: Schwimmen / ich möchte / dass ich tue (Subjunktiv)
    note: '*شنا* kam schon früher vor (Sport). *کنم* ist die Subjunktivform von „tun/machen“, bereits bekannt aus dem Muster „Ich möchte wechseln“ in Lektion 23.'
    target_text: شنا (Schwimmen) / می‌خواهم (ich möchte) / کنم (dass ich tue – Konjunktiv)
  prs.a1.unit57.lesson03.teach.want_to_swim_phrase:
    title: Ich möchte schwimmen
    gloss: Ich möchte schwimmen.
    note: Hier wird das bereits bekannte Muster „Ich möchte …“ mit dem Subjunktiv wiederverwendet.
  prs.a1.unit57.lesson03.teach.review_water_today_has:
    title: 'Wiederholung: Wasser, heute, hat'
    gloss: Wasser / heute / hat
    note: Das sind Wiederholungswörter, um das Wasser heute zu beschreiben.
    target_text: آب (Wasser) / امروز (heute) / دارد (hat)
  prs.a1.unit57.lesson03.teach.wave_word:
    title: Welle
    gloss: Welle
    note: Das ist das Standardwort für „Welle“ in Dari und im Persischen.
    example_gloss: Heute hat das Wasser Wellen.
  prs.a1.unit57.lesson03.teach.water_has_waves_phrase:
    title: Heute hat das Wasser Wellen
    gloss: Heute hat das Wasser Wellen.
  prs.a1.unit57.lesson04.teach.review_weather_sunny_today:
    title: 'Wiederholung: Zarmina, heute, Wetter, sonnig, ist'
    gloss: Zarmina / heute / Wetter / sonnig / ist
    note: Das sind Wiederholungswörter, um den Strand-Dialog zu eröffnen.
    target_text: زرمینه (Zarmina) / امروز (heute) / هوا (Wetter) / آفتابی (sonnig) / است (ist)
  prs.a1.unit57.lesson04.teach.review_want_go_beach:
    title: 'Wiederholung: ja, möchtest du, lass uns gehen, Strand'
    gloss: ja / möchtest du (informell) / lass uns gehen / Strand
    note: Das sind Wiederholungswörter, um vorzuschlagen, an den Strand zu gehen.
    target_text: بلی (ja) / می‌خواهی (willst du, informell) / برویم (lass uns gehen) / ساحل (Strand)
  prs.a1.unit57.lesson04.teach.review_great_want_swim:
    title: 'Wiederholung: großartig, ich möchte, Schwimmen, dass ich tue'
    gloss: großartig / ich möchte / Schwimmen / dass ich tue
    note: Das sind Wiederholungswörter, um zuzustimmen und zu sagen, dass man schwimmen möchte.
    target_text: عالی (super) / می‌خواهم (ich möchte) / شنا (Schwimmen) / کنم (dass ich tue)
  prs.a1.unit57.lesson04.teach.review_swim_or_picnic:
    title: 'Wiederholung: oder, Picknick'
    gloss: oder / Picknick
    note: Das sind Wiederholungswörter, um eine Auswahl an Aktivitäten anzubieten.
    target_text: یا (oder) / میله (Picknick)
  prs.a1.unit57.lesson04.teach.review_good_very_good:
    title: 'Wiederholung: gut, sehr gut'
    gloss: gut / sehr gut
    note: Das sind Wiederholungswörter, um den Dialog abzuschließen.
    target_text: خوب (gut) / بسیار خوب (sehr gut)
  prs.a1.unit57.lesson04.teach.dialogue_line1:
    title: 'Homayoun: Zarmina, heute ist das Wetter sonnig.'
    gloss: Zarmina, heute ist das Wetter sonnig.
  prs.a1.unit57.lesson04.teach.dialogue_line2:
    title: 'Zarmina: Ja, möchtest du zum Strand gehen?'
    gloss: Ja, möchtest du zum Strand gehen?
  prs.a1.unit57.lesson04.teach.dialogue_line3:
    title: 'Homayoun: Ja, super! Ich möchte schwimmen.'
    gloss: Ja, super! Ich möchte schwimmen.
  prs.a1.unit57.lesson04.teach.dialogue_line4:
    title: 'Zarmina: Möchtest du schwimmen oder ein Picknick machen?'
    gloss: Möchtest du schwimmen oder ein Picknick machen?
  prs.a1.unit57.lesson04.teach.dialogue_line5:
    title: 'Homayoun: Schwimmen klingt gut!'
    gloss: Schwimmen klingt gut!
  prs.a1.unit57.lesson04.teach.dialogue_line6:
    title: 'Zarmina: Sehr gut, lass uns gehen!'
    gloss: Sehr gut, lass uns gehen!
  prs.a1.unit57.lesson05.teach.review_this_is_in_to:
    title: 'Wiederholung: dieser, ist, in, zu'
    gloss: dieser / ist / in / zu
    note: Das sind Wiederholungswörter aus dem Lesetext.
    target_text: این (dies) / است (ist) / در (in) / به (nach, zu)
  prs.a1.unit57.lesson05.teach.review_he_went_did_was:
    title: 'Wiederholung: er/sie, ging, machte, war'
    gloss: er/sie / ging / machte / war
    note: Das sind Wiederholungswörter aus dem Lesetext.
    target_text: او (er/sie) / رفت (ging) / کرد (tat) / بود (war)
  prs.a1.unit57.lesson05.teach.review_beach_swim_homayoun:
    title: 'Wiederholung: Strand, Schwimmen, Homayoun'
    gloss: Strand / Schwimmen / Homayoun
    note: Das sind Wiederholungswörter aus dem Lesetext.
    target_text: ساحل (Strand) / شنا (Schwimmen) / همایون (Homayoun)
  prs.a1.unit57.lesson05.teach.reading_passage:
    title: Lesen über den Strand
    gloss: Homayoun ging zum Strand. Er ist geschwommen. Der Strand war schön.
  prs.a1.unit57.lesson06.teach.review_like_but_wave:
    title: 'Wiederholung: Schwimmen, mögen, ich habe, aber, Welle, viel'
    gloss: Schwimmen / mögen / ich habe / aber / Welle / viel
    note: Das sind Wiederholungswörter, um eine Vorliebe und eine Beobachtung über die Wellen auszudrücken.
    target_text: شنا (Schwimmen) / دوست (lieb, gern) / دارم (ich habe) / را (Objektmarker) / اما (aber) / موج (Welle) / زیاد (viel, sehr)
  prs.a1.unit57.lesson06.teach.like_swim_but_waves_phrase:
    title: Ich schwimme gern, aber es gibt viele Wellen
    gloss: Ich schwimme gern, aber es gibt viele Wellen.
  prs.a1.unit57.lesson06.teach.umbrella_word:
    title: Schirm
    gloss: Schirm
    note: Das ist das Standardwort für „Schirm“ in Dari und im Persischen. In Verbindung mit *آفتابی* (sonnig, Lektion 22) bedeutet *چتر آفتابی* „Sonnenschirm“ bzw. „Strandschirm“.
    example_gloss: Der Sonnenschirm ist schön.
  prs.a1.unit57.lesson06.teach.review_sunny_where_is:
    title: 'Wiederholung: sonnig, wo ist'
    gloss: sonnig / wo ist
    note: Das sind Wiederholungswörter, um zu fragen, wo der Sonnenschirm ist.
    target_text: آفتابی (sonnig) / کجاست (wo ist)
  prs.a1.unit57.lesson06.teach.your_umbrella_question_phrase:
    title: Wo ist Ihr Sonnenschirm?
    gloss: Wo ist Ihr Sonnenschirm?
    note: Ihr Sonnenschirm verwendet dasselbe höfliche Suffix *-تان* wie „Ihre Lieferung“ in Lektion 48, „Ihre Kinokarte“ in Lektion 52 und „Ihre Mitgliedschaft“ in Lektion 56, hier an ein neues Nomen angehängt.
