    note: کدام, را und من („ich“) sind Wiederholungsformen, mit denen man nach der Lieblingsjahreszeit fragt und sie nennt.
    target_text: کدام (welche/r/s) / را (Objektmarker) / من (ich)
  prs.a1.unit39.lesson03.teach.review_like_forms:
