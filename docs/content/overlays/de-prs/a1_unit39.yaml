course:
  title: Dari in Deutsch A1
  description: 'Dari (Kabul) für Anfänger: Sprechen Sie über die vier Jahreszeiten, beschreiben Sie das typische Wetter jeder Jahreszeit, fragen Sie nach der Lieblingsjahreszeit und sagen Sie, welche Sie mögen, und lesen Sie einen kurzen Text über die Lieblingsjahreszeiten zweier Personen.'
units:
