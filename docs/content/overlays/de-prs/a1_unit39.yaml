    gloss: Sie (formell) / ja
    note: شما und بلی sind Wiederholungswörter, die im Dialog über die Jahreszeiten vorkommen.
    target_text: شما (Sie, höflich) / بلی (ja)
  prs.a1.unit39.lesson04.teach.dialogue_line1:
    title: 'Homayoun: Zarmina, welche Jahreszeit magst du?'
    gloss: Zarmina, welche Jahreszeit mögen Sie?
  prs.a1.unit39.lesson04.teach.dialogue_line2:
    title: 'Zarmina: Ich mag den Frühling. Der Frühling ist warm und sonnig.'
    gloss: Ich mag den Frühling. Der Frühling ist warm und sonnig.
  prs.a1.unit39.lesson04.teach.dialogue_line3:
    title: 'Homayoun: Meine Lieblingsjahreszeit ist der Winter.'
    gloss: Meine Lieblingsjahreszeit ist der Winter.
  prs.a1.unit39.lesson04.teach.dialogue_line4:
    title: 'Zarmina: Der Winter? Der Winter ist sehr kalt!'
    gloss: Der Winter? Der Winter ist sehr kalt!
  prs.a1.unit39.lesson04.teach.dialogue_line5:
    title: 'Homayoun: Ja, aber ich mag Schnee.'
    gloss: Ja, aber ich mag Schnee.
  prs.a1.unit39.lesson04.teach.dialogue_line6:
    title: 'Zarmina: Ich mag keinen Schnee.'
    gloss: Ich mag keinen Schnee.
  prs.a1.unit39.lesson05.teach.review_reading_words:
    title: 'Wiederholung: er/sie, er/sie mag'
    gloss: er/sie / er/sie mag
    note: او und دوست دارد sind Wiederholungsformen, die in diesem Lesetext vorkommen.
    target_text: او (er/sie) / دوست دارد (er/sie mag)
  prs.a1.unit39.lesson05.teach.reading_passage:
    title: Lesetext über Lieblingsjahreszeiten
    gloss: Homayouns Lieblingsjahreszeit ist der Winter. Der Winter ist kalt und es schneit. Er mag Schnee. Zarminas Lieblingsjahreszeit ist der Frühling. Der Frühling ist warm und sonnig. Sie mag den Frühling.
