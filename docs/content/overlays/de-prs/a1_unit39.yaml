teaching:
  prs.a1.unit39.lesson01.teach.review_basics:
    title: 'Wiederholung: vier, ist, Jahr'
    gloss: vier / ist / Jahr
    note: چهار, است und سال sind Wiederholungswörter, die in den Wortschatz der Jahreszeiten dieser Lektion einführen.
    target_text: چهار (vier) / است (ist) / سال (Jahr)
  prs.a1.unit39.lesson01.teach.review_weather_connectors:
    title: 'Wiederholung: Wetter, heiß, kalt, sehr, heute, und, aber'
    gloss: Wetter / heiß / kalt / sehr / heute / und / aber
    note: هوا, گرم, سرد, خیلی, امروز, و und اما sind Wiederholungswörter, die in den Sätzen über die Jahreszeiten dieser Lektion immer wieder vorkommen.
    target_text: هوا (Wetter) / گرم (heiß) / سرد (kalt) / خیلی (sehr) / امروز (heute) / و (und) / اما (aber)
  prs.a1.unit39.lesson01.teach.fasl_word:
    title: Jahreszeit
    gloss: Jahreszeit
    note: فصل bedeutet „Jahreszeit“.
    example_gloss: Ein Jahr hat vier Jahreszeiten.
  prs.a1.unit39.lesson01.teach.bahar_word:
    title: Der Frühling
    gloss: der Frühling
    note: بهار ist das übliche dariische Wort für „Frühling“.
    example_gloss: Der Frühling ist warm.
  prs.a1.unit39.lesson01.teach.tabestan_word:
    title: Der Sommer
    gloss: der Sommer
    note: تابستان bedeutet „Sommer“.
    example_gloss: Der Sommer ist sehr heiß.
  prs.a1.unit39.lesson01.teach.khonak_word:
    title: Kühl
    gloss: kühl
    note: خنک bedeutet „kühl“ (Temperatur).
    example_gloss: Heute ist das Wetter kühl.
  prs.a1.unit39.lesson01.teach.khazan_word:
    title: Herbst
    gloss: Herbst
    note: خزان ist das übliche Wort für „Herbst“ im afghanischen Dari; im iranischen Persisch sagt man meist پاییز.
    example_gloss: Der Herbst ist kühl.
  prs.a1.unit39.lesson01.teach.zemestan_word:
    title: Der Winter
    gloss: der Winter
    note: زمستان bedeutet „Winter“.
    example_gloss: Der Winter ist kalt.
  prs.a1.unit39.lesson01.teach.warm_seasons_phrase:
    title: Der Frühling ist warm und der Sommer ist sehr heiß
    gloss: Der Frühling ist warm und der Sommer ist sehr heiß.
    note: و verbindet die beiden Teilsätze über das Wetter der Jahreszeiten zu einem Satz.
  prs.a1.unit39.lesson01.teach.cool_cold_contrast_phrase:
    title: Der Herbst ist kühl, aber der Winter ist kalt
    gloss: Der Herbst ist kühl, aber der Winter ist kalt.
    note: اما stellt das Wetter zweier Jahreszeiten in einem Satz gegenüber.
  prs.a1.unit39.lesson02.teach.review_in_becomes:
    title: 'Wiederholung: in, wird'
    gloss: in / wird
    note: در und می‌شود sind Wiederholungswörter, mit denen man beschreibt, wie sich das Wetter in jeder Jahreszeit verändert.
    target_text: در (in) / می‌شود (wird)
  prs.a1.unit39.lesson02.teach.review_rain_snow_sunny:
    title: 'Wiederholung: fällt/regnet, Regen, Schnee, sonnig'
    gloss: fällt/regnet / Regen / Schnee / sonnig
    note: می‌بارد, باران, برف und آفتابی sind Wiederholungswörter, mit denen man das typische Wetter jeder Jahreszeit beschreibt.
    target_text: می‌بارد (fällt/regnet) / باران (Regen) / برف (Schnee) / آفتابی (sonnig)
  prs.a1.unit39.lesson02.teach.rain_in_spring_phrase:
    title: Im Frühling regnet es
    gloss: Im Frühling regnet es.
    note: در بهار باران می‌بارد heißt wörtlich „Im Frühling fällt Regen“.
  prs.a1.unit39.lesson02.teach.hot_in_summer_phrase:
    title: Im Sommer wird es sehr heiß
    gloss: Im Sommer wird es sehr heiß.
    note: می‌شود („wird“) beschreibt eine Wetteränderung im Lauf einer Jahreszeit.
  prs.a1.unit39.lesson02.teach.cool_in_autumn_phrase:
    title: Im Herbst wird es kühl
    gloss: Im Herbst wird es kühl.
    note: Dieselbe Konstruktion mit می‌شود, hier für das kühlere Wetter im Herbst.
  prs.a1.unit39.lesson02.teach.snow_in_winter_phrase:
    title: Im Winter schneit es
    gloss: Im Winter schneit es.
    note: در زمستان برف می‌بارد heißt wörtlich „Im Winter fällt Schnee“.
  prs.a1.unit39.lesson02.teach.sunny_summer_phrase:
    title: Der Sommer ist sonnig
    gloss: Der Sommer ist sonnig.
    note: Ein einfacher Satz mit است, der das typische Wetter im Sommer beschreibt.
