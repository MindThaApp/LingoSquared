    title: 'Wiederholung: ich mag, ich mag nicht'
    gloss: ich mag / ich mag nicht
    note: دوست دارم und دوست ندارم sind Wiederholungsformen, mit denen man eine gemochte und eine nicht gemochte Jahreszeit einander gegenüberstellt.
    target_text: دوست دارم (ich mag) / دوست ندارم (ich mag nicht)
  prs.a1.unit39.lesson06.teach.contrast_phrase:
    title: Ich mag den Winter, aber den Sommer mag ich nicht
    gloss: Ich mag den Winter, aber den Sommer mag ich nicht.
    note: اما stellt in einem einzigen Satz eine gemochte und eine nicht gemochte Jahreszeit einander gegenüber.
