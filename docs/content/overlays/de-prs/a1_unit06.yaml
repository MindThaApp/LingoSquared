course:
  title: Dari in Deutsch A1
  description: 'Dari (Afghanistan) für Anfänger: grundlegende Richtungswörter, Abbiegehinweise geben, mehrstufige Wegbeschreibungen ordnen, höflich nach dem Weg fragen und Wegbeschreibungen mit Orientierungspunkten.'
units:
  prs.a1.unit06.directions:
    title: Wegbeschreibungen geben und den Weg finden
lessons:
  prs.a1.unit06.lesson01.direction_words:
    title: Grundlegende Richtungswörter
  prs.a1.unit06.lesson02.giving_turn_instructions:
    title: Abbiegehinweise geben
  prs.a1.unit06.lesson03.sequencing_directions:
    title: Mehrstufige Wegbeschreibungen ordnen
  prs.a1.unit06.lesson04.politely_asking_directions:
    title: Höflich nach dem Weg fragen
  prs.a1.unit06.lesson05.landmark_directions:
    title: Wegbeschreibungen mit Orientierungspunkten geben
  prs.a1.unit06.lesson06.giving_directions_dialogue:
    title: Den Weg zur Apotheke finden
teaching:
  prs.a1.unit06.lesson01.teach.straight:
    title: Geradeaus
    gloss: geradeaus
    note: مستقیم beschreibt die Bewegung geradeaus.
    example_gloss: Gehen Sie geradeaus.
  prs.a1.unit06.lesson01.teach.left:
    title: Links
    gloss: links
    note: چپ ist die Richtung „links“.
    example_gloss: Biegen Sie links ab.
  prs.a1.unit06.lesson01.teach.right:
    title: Rechts
    gloss: rechts
    note: راست ist die Richtung „rechts“.
    example_gloss: Biegen Sie rechts ab.
  prs.a1.unit06.lesson01.teach.turn_verb:
    title: Abbiegen (höfliche Aufforderung)
    gloss: abbiegen
    note: بپیچین ist die höfliche Befehlsform des Verbs „abbiegen“, wenn man jemandem den Weg beschreibt.
    example_gloss: Biegen Sie rechts ab.
  prs.a1.unit06.lesson01.teach.to_word:
    title: Zu / nach
    gloss: zu / nach
    note: به steht zusammen mit einem Richtungswort, z. B. به چپ (nach links).
    target_text: به (zu / nach)
  prs.a1.unit06.lesson02.teach.go_straight:
    title: Jemandem sagen, dass er geradeaus gehen soll
    gloss: Gehen Sie geradeaus.
    note: مستقیم بروین ist die grundlegende Wegweisung in der höflichen Befehlsform.
  prs.a1.unit06.lesson02.teach.turn_left:
    title: Jemandem sagen, dass er links abbiegen soll
    gloss: Biegen Sie links ab.
    note: به چپ بپیچین bedeutet wörtlich „biegen Sie nach links ab“.
  prs.a1.unit06.lesson02.teach.turn_right:
    title: Jemandem sagen, dass er rechts abbiegen soll
    gloss: Biegen Sie rechts ab.
    note: به راست بپیچین folgt demselben Muster, nur mit راست statt چپ.
  prs.a1.unit06.lesson03.teach.first_word:
    title: Zuerst
    gloss: zuerst
    note: اول kennzeichnet den ersten Schritt einer Wegbeschreibung.
    example_gloss: Gehen Sie zuerst geradeaus.
  prs.a1.unit06.lesson03.teach.then_word:
    title: Dann
    gloss: dann
    note: بعد kennzeichnet den nächsten Schritt nach dem ersten.
    example_gloss: Biegen Sie dann links ab.
  prs.a1.unit06.lesson03.teach.sequenced_example:
    title: Zwei Wegschritte verbinden
    gloss: Gehen Sie zuerst geradeaus, biegen Sie dann rechts ab.
    note: Mit اول und بعد können Sie mehrere Wegschritte in einer Anweisung ordnen.
  prs.a1.unit06.lesson04.teach.polite_ask:
    title: Höflich fragen, wie man irgendwohin kommt
    gloss: Könnten Sie mir sagen, wie ich zum Markt komme?
    note: می‌توانین بگویین...؟ ist eine höfliche Art zu fragen „Könnten Sie mir sagen ...?“ und passt, wenn man einen Fremden nach dem Weg fragt. بروم bedeutet „ich gehe“; die ganze Frage lautet also, wie ich dorthin gelangen kann.
  prs.a1.unit06.lesson04.teach.bebakhshid_review:
    title: Fragen, wo ein Ort ist (Wiederholung)
    gloss: Entschuldigung, wo ist die Apotheke?
    note: ببخشین، [Ort] کجاست؟ wurde in der Einheit über Orte eingeführt; es ist ein natürlicher Einstieg, bevor man nach dem Weg fragt.
  prs.a1.unit06.lesson04.teach.fahmidam:
    title: Bestätigen, dass Sie verstanden haben
    gloss: Vielen Dank, ich habe verstanden.
    note: تشکر زیاد، فهمیدم beendet das Gespräch höflich und bestätigt, dass die Wegbeschreibung klar war.
  prs.a1.unit06.lesson04.teach.daftar_review:
    title: Büro (Wiederholung)
    gloss: Büro
    note: دفتر wurde schon in einer früheren Einheit eingeführt; hier dient es als Ziel, um die höfliche Frage nach dem Weg zu üben.
    example_gloss: Das Büro ist nah.
  prs.a1.unit06.lesson05.teach.after_word:
    title: Nach
    gloss: nach
    note: بعد از kennzeichnet einen Orientierungspunkt, der vor dem Ziel kommt.
    example_gloss: Nach der Moschee kommt die Bank.
  prs.a1.unit06.lesson05.teach.opposite_review:
    title: Gegenüber
    gloss: gegenüber
    note: روبه‌رو ist ein weiteres Wort für مقابل (gegenüber), das in der Einheit über Orte eingeführt wurde; beide sind im Alltags-Dari für „gegenüber“ gebräuchlich.
    example_gloss: Die Bank ist gegenüber der Moschee.
  prs.a1.unit06.lesson05.teach.landmark_example:
    title: Eine Wegbeschreibung mit Orientierungspunkt geben
    gloss: Nach der Moschee ist die Bank direkt gegenüber von Ihnen.
    note: بعد از مسجد، بانک روبه‌روی شماست verbindet einen Orientierungspunkt (بعد از مسجد) mit einer relativen Lage (روبه‌روی شماست).
  prs.a1.unit06.lesson05.teach.maktab_review:
    title: Schule (Wiederholung)
    gloss: Schule
    note: مکتب wurde in der Einheit über Orte eingeführt; hier dient es als Orientierungspunkt im Übungssatz.
    example_gloss: Die Schule ist nah.
  prs.a1.unit06.lesson06.teach.turn01:
    title: Sohaila fragt nach dem Weg
    gloss: Sohaila fragt einen Ladenbesitzer höflich, wie sie zur Apotheke kommt.
    note: ببخشین eröffnet die Frage respektvoll, und می‌توانین بگویین؟ ist die höfliche Frage nach dem Weg aus Lektion 04.
  prs.a1.unit06.lesson06.teach.turn02:
    title: Der Ladenbesitzer nennt den ersten Schritt
    gloss: Der Ladenbesitzer bestätigt und sagt, dass man zuerst geradeaus gehen soll.
    note: اول مستقیم بروین eröffnet die Abfolge der Wegbeschreibung.
  prs.a1.unit06.lesson06.teach.turn03:
    title: Sohaila bestätigt und fragt, wie es weitergeht
    gloss: Sohaila wiederholt „geradeaus“ zur Bestätigung und fragt, was danach kommt.
    note: بعد چطور؟ ist eine natürliche, knappe Art, nach dem nächsten Schritt zu fragen.
  prs.a1.unit06.lesson06.teach.turn04:
    title: Der Ladenbesitzer nennt den zweiten Schritt und den Orientierungspunkt
    gloss: Der Ladenbesitzer sagt, dass man links abbiegen soll, und beschreibt dann die Lage der Apotheke anhand von Moschee und Bank.
    note: Hier verbinden sich die Abbiege-Anweisung aus Lektion 2 und das Muster mit Orientierungspunkten aus Lektion 5.
  prs.a1.unit06.lesson06.teach.turn05:
    title: Sohaila bedankt sich und bestätigt, dass sie verstanden hat
    gloss: Sohaila bedankt sich herzlich und sagt, dass sie verstanden hat.
    note: تشکر زیاد، فهمیدم beschließt das Gespräch, wie in Lektion 4 gelernt.
  prs.a1.unit06.lesson06.teach.turn06:
    title: Die bescheidene Antwort und der Abschied des Ladenbesitzers
    gloss: Der Ladenbesitzer wehrt den Dank ab und wünscht ihr eine gute Reise.
    note: قابلی نداره wurde in der Einheit über Orte eingeführt; سفر خوش („gute Reise“) ist ein natürlicher Abschiedsgruß für jemanden, der sich zu Fuß auf den Weg macht.
