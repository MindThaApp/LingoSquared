  prs.a1.unit03.lesson01.teach.father:
    title: Vater
    gloss: Vater
    note: پدر ist das neutrale Dari-Wort für Vater.
    example_gloss: Mein Vater ist Arzt.
  prs.a1.unit03.lesson01.teach.brother:
    title: Bruder
    gloss: Bruder
    note: برادر bedeutet Bruder.
    example_gloss: Ich habe einen Bruder.
  prs.a1.unit03.lesson01.teach.sister:
    title: Schwester
    gloss: Schwester
    note: خواهر bedeutet Schwester.
    example_gloss: Meine Schwester ist Lehrerin.
  prs.a1.unit03.lesson01.teach.parents:
    title: Eltern
    gloss: Vater und Mutter; Eltern
    note: Im Dari sagt man für die Eltern üblicherweise پدر و مادر.
    example_gloss: Meine Eltern leben in Kabul.
  prs.a1.unit03.lesson01.teach.my_mother:
    title: Die eigene Mutter vorstellen
    gloss: Das ist meine Mutter.
    note: Die Endung ـم bei مادرم bedeutet „mein“.
  prs.a1.unit03.lesson02.teach.grandfather:
    title: Großvater
    gloss: Großvater
    note: پدرکلان ist der übliche afghanische Dari-Ausdruck; wörtlich „großer“ bzw. „älterer Vater“.
    example_gloss: Mein Großvater ist alt.
  prs.a1.unit03.lesson02.teach.grandmother:
    title: Großmutter
    gloss: Großmutter
    note: مادرکلان ist der übliche afghanische Dari-Ausdruck; wörtlich „große“ bzw. „ältere Mutter“.
    example_gloss: Meine Großmutter ist freundlich.
  prs.a1.unit03.lesson02.teach.paternal_uncle:
    title: Bruder des Vaters
    gloss: Onkel väterlicherseits
    note: کاکا bezeichnet speziell den Bruder Ihres Vaters.
    example_gloss: Mein Onkel lebt in Herat.
  prs.a1.unit03.lesson02.teach.paternal_aunt:
    title: Schwester des Vaters
    gloss: Tante väterlicherseits
    note: عمه bezeichnet speziell die Schwester Ihres Vaters.
    example_gloss: Meine Tante ist Lehrerin.
  prs.a1.unit03.lesson02.teach.maternal_uncle:
    title: Bruder der Mutter
    gloss: Onkel mütterlicherseits
    note: ماما bezeichnet im Dari speziell den Bruder Ihrer Mutter.
    example_gloss: Mein Onkel (mütterlicherseits) ist Ingenieur.
  prs.a1.unit03.lesson02.teach.maternal_aunt:
    title: Schwester der Mutter
    gloss: Tante mütterlicherseits
    note: خاله bezeichnet speziell die Schwester Ihrer Mutter.
    example_gloss: Meine Tante (mütterlicherseits) lebt in Kabul.
  prs.a1.unit03.lesson02.teach.side_distinction:
    title: Die beiden Seiten auseinanderhalten
    gloss: Kaka und Amma gehören zur Seite des Vaters; Mama und Khala zur Seite der Mutter.
    note: Anders als das deutsche „Onkel“ und „Tante“ unterscheiden diese vier Dari-Wörter, ob die Verwandten von der Vater- oder der Mutterseite stammen.
  prs.a1.unit03.lesson03.teach.family:
    title: Familie
    gloss: Familie
    note: فامیل ist das übliche afghanische Dari-Wort für „Familie“.
    example_gloss: Meine Familie ist groß.
  prs.a1.unit03.lesson03.teach.how_many_people:
    title: Höflich nach der Familiengröße fragen
    gloss: Wie viele Personen hat Ihre Familie?
    note: ـتان kennzeichnet das höfliche „Ihr/Ihre“; نفر ist das Zählwort für Personen.
  prs.a1.unit03.lesson03.teach.five_people:
    title: Die Familiengröße angeben
    gloss: Unsere Familie hat fünf Personen.
    note: Im Dari gibt man die Familiengröße als Anzahl von Personen mit نفر است an.
  prs.a1.unit03.lesson03.teach.have_siblings:
    title: Geschwister zählen
    gloss: Ich habe einen Bruder und zwei Schwestern.
    note: دارم bedeutet „ich habe“. Nach einer Zahl bleibt das Nomen im Singular.
  prs.a1.unit03.lesson03.teach.only_child:
    title: Einzelkind
    gloss: Ich bin ein Einzelkind.
    note: استم ist die in diesem Kurs gelehrte Form der ersten Person im Kabuler Dari.
  prs.a1.unit03.lesson03.teach.possession:
    title: Formen von „haben“
    gloss: ich habe; wir haben; Sie haben
    note: دارین ist im gebildeten, umgangssprachlichen Kabuler Dari die respektvolle Form oder die Pluralform („Sie haben“/„ihr habt“).
  prs.a1.unit03.lesson04.teach.have_siblings_question:
    title: Nach Geschwistern fragen
    gloss: Haben Sie Geschwister?
    note: دارین macht die Frage respektvoll oder zur Pluralform.
  prs.a1.unit03.lesson04.teach.how_many_siblings:
    title: Nach der Anzahl der Geschwister fragen
    gloss: Wie viele Geschwister haben Sie?
    note: چند fragt nach der Anzahl („wie viele“).
  prs.a1.unit03.lesson04.teach.parents_well:
    title: Nach den Eltern eines anderen fragen
    gloss: Geht es Ihren Eltern gut?
    note: جور استند ist eine gängige afghanische Art zu sagen, dass es ihnen gut geht.
  prs.a1.unit03.lesson04.teach.yes_answer:
    title: Bejahende Antwort
    gloss: Ja, ich habe einen Bruder.
    note: بلی ist das höfliche Standard-Ja in Afghanistan.
  prs.a1.unit03.lesson04.teach.no_answer:
    title: Verneinende Antwort
    gloss: Nein, ich habe keine Schwester.
    note: نخیر ist das höfliche Nein; ندارم bedeutet „ich habe nicht“.
  prs.a1.unit03.lesson04.teach.polite_your:
    title: Höfliches „Ihr/Ihre“
    gloss: Ihre Familie; Ihre Mutter; Ihr Vater
    note: Die Possessivendung ـتان drückt Respekt oder den Plural aus. In diesem Kurs wird sie mit einem Zero-Width-Non-Joiner (ZWNJ) angefügt.
  prs.a1.unit03.lesson05.teach.married:
    title: Verheiratet
    gloss: verheiratet
    note: متأهل ist ein neutraler Begriff für den Familienstand.
    example_gloss: Er/Sie ist verheiratet.
  prs.a1.unit03.lesson05.teach.single:
    title: Ledig
    gloss: ledig; unverheiratet
    note: مجرد bedeutet in diesem Zusammenhang „unverheiratet“.
    example_gloss: Ich bin ledig.
  prs.a1.unit03.lesson05.teach.husband:
    title: Ehemann
    gloss: Ehemann
    note: شوهر ist das gewöhnliche Wort für „Ehemann“.
    example_gloss: Mein Mann ist Ingenieur.
  prs.a1.unit03.lesson05.teach.wife:
    title: Ehefrau
    gloss: Ehefrau
    note: خانم kann „Ehefrau“ oder eine höflich angesprochene Frau („Frau …“) bedeuten; der Zusammenhang zeigt, was gemeint ist.
    example_gloss: Meine Frau ist Lehrerin.
  prs.a1.unit03.lesson05.teach.marriage_question:
    title: Höflich nach der Ehe fragen
    gloss: Sind Sie verheiratet?
    note: 'Wörtlich fragt dies: „Haben Sie geheiratet?“ Die Endung ـین ist die höfliche Form in Kabul.'
  prs.a1.unit03.lesson05.teach.married_answer:
    title: Sagen, dass man verheiratet ist
    gloss: Ja, ich bin verheiratet.
    note: استم ist die im afghanischen Dari gebräuchliche Form von „sein“ in der 1. Person Singular.
  prs.a1.unit03.lesson05.teach.children:
    title: Nach Kindern fragen
    gloss: Haben Sie Kinder?
    note: اولاد ist ein gebräuchliches Sammelwort für das Kind oder die Kinder.
  prs.a1.unit03.lesson06.teach.turn01:
    title: Maryam fragt nach der Größe der Familie
    gloss: Wie viele Personen hat Ihre Familie?
    note: Maryam verwendet das respektvolle ـتان.
  prs.a1.unit03.lesson06.teach.turn02:
    title: Fereshteh beschreibt ihre Geschwister
    gloss: Wir sind fünf Personen. Ich habe einen Bruder und eine Schwester.
    note: Familienmitglieder werden mit نفر gezählt.
  prs.a1.unit03.lesson06.teach.turn03:
    title: Maryam fragt nach der Ehe
    gloss: Sind Sie verheiratet?
    note: Die Frage ist in ihrer Form höflich und neutral.
  prs.a1.unit03.lesson06.teach.turn04:
    title: Fereshteh beschreibt ihren Mann
    gloss: Ja, ich bin verheiratet. Mein Mann ist Student.
    note: محصل, nicht das iranische دانشجو, ist das im Afghanischen etablierte Wort für „Student“.
  prs.a1.unit03.lesson06.teach.turn05:
    title: Maryam fragt nach Kindern
    gloss: Haben Sie Kinder?
    note: دارین behält die respektvolle Anrede bei.
  prs.a1.unit03.lesson06.teach.turn06:
    title: Fereshteh antwortet
    gloss: Nein, wir haben noch keine Kinder.
    note: نخیر ist das respektvolle Nein; نداریم bedeutet „wir haben nicht“.
