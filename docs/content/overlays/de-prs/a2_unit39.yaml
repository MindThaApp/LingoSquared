  prs.a2.unit39.lesson01.exercise05.order_manager_says:
    instruction: 'Bringen Sie die Wörter in die richtige Reihenfolge: Der Chef sagt, dass die Besprechung um neun Uhr ist.'
    accepted_answers:
    - value:
      - مدیر
      - می‌گوید
      - که
      - جلسه
      - ساعت
      - نه
      - است
      status: correct
    feedback: '*مدیر می‌گوید که جلسه ساعت نه است.* Zuerst kommen die sprechende Person und das Verb, dann *که*, dann die Aussage.'
  prs.a2.unit39.lesson01.exercise06.translate_manager_says:
    instruction: 'Übersetzen Sie ins Dari und verwenden Sie می‌گوید که: Der Chef sagt, dass die Besprechung um neun Uhr ist.'
    accepted_answers:
    - value: مدیر می‌گوید که جلسه ساعت نه است.
      status: correct
