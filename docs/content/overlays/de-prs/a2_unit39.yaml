course:
  title: Dari A2
  description: 'Dari (Afghanistan) für Fortgeschrittene (A2): eine einfache Nachricht im Präsens weitergeben mit می‌گوید که, می‌پرسد که und می‌خواهد که + Subjunktiv, mit Telefonnachrichten und Notizen.'
units:
  prs.a2.unit39.passing_message:
    title: Eine Nachricht weitergeben
lessons:
  prs.a2.unit39.lesson01.he_says_that:
    title: Er sagt, dass ...
  prs.a2.unit39.lesson02.he_asks_that:
    title: Er fragt, ob ...
  prs.a2.unit39.lesson03.he_wants_that:
    title: Er möchte, dass ...
  prs.a2.unit39.lesson04.messages_and_notes:
    title: Nachrichten und Notizen
  prs.a2.unit39.lesson05.reading_and_listening:
    title: 'Lesen und Hören: Nachrichten'
  prs.a2.unit39.lesson06.office_conversation:
    title: Ein Gespräch im Büro
teaching:
  prs.a2.unit39.lesson01.teach.message:
    title: Nachricht
    gloss: Nachricht
    note: '*پیام* ist eine Nachricht, zum Beispiel eine Telefonnachricht oder eine SMS. In dieser Lektion geben Sie eine Nachricht weiter: Sie sagen einer zweiten Person, was eine erste gesagt, gefragt oder gewollt hat.'
    example_gloss: Ich habe eine Nachricht für Sie.
  prs.a2.unit39.lesson01.teach.says:
    title: Er/Sie sagt
    gloss: er sagt, sie sagt
    note: '*می‌گوید* bedeutet „er/sie sagt“ und ist das Präsens von *گفتن*. *می‌گویم* („ich sage“) kennen Sie schon. Die Endung *-د* ist die Endung für er, sie, es, wie in *می‌آید*.'
    example_gloss: Er/Sie sagt, dass er/sie morgen kommt.
  prs.a2.unit39.lesson01.teach.pattern:
    title: 'Wiedergeben, was jemand sagt: می‌گوید که + Aussage'
    gloss: Der Direktor sagt, dass die Besprechung um zehn Uhr ist. Er sagt, dass er morgen kommt.
    note: 'Um wiederzugeben, was jemand gerade sagt, verwenden Sie *می‌گوید که* und danach die Aussage. *که* bedeutet „dass“. Die Aussage bleibt im Präsens: *جلسه ساعت ده است*. In dieser Lektion geben Sie Nachrichten nur im Präsens weiter. Nachrichten in der Vergangenheit folgen später im Kurs.'
  prs.a2.unit39.lesson01.teach.person:
    title: Aus „ich“ wird beim Weitergeben „er/sie“
    gloss: 'Mina: Ich komme morgen. Mina sagt, dass sie morgen kommt.'
    note: 'Sagt Mina *من فردا می‌آیم* („Ich komme morgen“) und Sie geben das weiter, ändert sich die Person: Mina ist für Sie jetzt *او* („sie“), deshalb wechselt die Verbendung von *-م* zu *-د*: *مینا می‌گوید که فردا می‌آید*. Das Wort *او* ist optional, weil die Endung schon zeigt, wer gemeint ist.'
  prs.a2.unit39.lesson01.teach.they_say:
    title: Sie sagen
    gloss: sie sagen
    note: '*می‌گویند* bedeutet „sie sagen“. Hängen Sie *-ند* an den Stamm an: *می‌گویند* ist die *آن‌ها*-Form von *می‌گوید*.'
    example_gloss: Sie sagen, dass die Besprechung um zehn Uhr ist.
  prs.a2.unit39.lesson01.teach.hashmat:
    title: Haschmat sagt, dass Mina morgen kommt
    gloss: Haschmat sagt, dass Mina morgen kommt.
    note: Hier sind die Person, die etwas sagt (*حشمت*), und die Person, die kommt (*مینا*), verschieden, und der Satz nennt beide. Prüfen Sie beim Lesen einer Nachricht immer, wer spricht und wer kommt.
  prs.a2.unit39.lesson02.teach.asks:
    title: Er/Sie fragt
    gloss: er fragt, sie fragt
    note: '*می‌پرسد* bedeutet „er/sie fragt“ und ist das Präsens von *پرسیدن*. Es hat dieselbe Endung *-د* wie *می‌گوید*.'
    example_gloss: Er/Sie fragt, wo der Direktor ist.
  prs.a2.unit39.lesson02.teach.wh:
    title: 'Eine Frage weitergeben: می‌پرسد که + Frage'
    gloss: Haschmat fragt, wo du bist. Mina fragt, wie spät es ist.
    note: Um eine Frage weiterzugeben, verwenden Sie *می‌پرسد که* und danach die Frage mit ihrem Fragewort (*کجا*, *ساعت چند*, *چه*, *کی*, *چرا*). Die Wortstellung der Frage ändert sich nicht. *استی* bedeutet „du bist“ (zu einem Freund), die *تو*-Form von *است*. Wenn Sie es der gefragten Person selbst sagen, bleibt *تو* eben *تو*.
  prs.a2.unit39.lesson02.teach.yesno:
    title: Eine Ja-Nein-Frage weitergeben
    gloss: Er/Sie fragt, ob du morgen kommst.
    note: 'In dieser Lektion bleibt die Frage so, wie sie gesprochen wurde, ohne zusätzliches Signalwort (Sie können auch *آیا* oder *یا نه* ergänzen, wie in Lektion 38). Eine Ja-Nein-Frage wird mit *می‌پرسد که* weitergegeben: *او می‌پرسد که تو فردا می‌آیی*. Die Antwort ist *بلی* oder *نخیر*. *می‌آیی* bedeutet „du kommst“ (zu einem Freund), die *تو*-Form von *می‌آید*.'
  prs.a2.unit39.lesson02.teach.id:
    title: Der Direktor fragt, ob du einen Ausweis hast
    gloss: Der Direktor fragt, ob du einen Ausweis hast.
    note: Noch eine Ja-Nein-Frage. *تذکره* ist der afghanische Personalausweis, und *داری* bedeutet „du hast“.
  prs.a2.unit39.lesson02.teach.person:
    title: Wer gefragt wird, bestimmt das Pronomen
    gloss: Mina fragt, wo du bist. Mina fragt, wo Haschmat ist.
    note: 'Mina fragt Haschmat: *تو کجا استی؟* („Wo bist du?“). Wenn Sie es Haschmat sagen, sagen Sie *مینا می‌پرسد که تو کجا استی*, und *تو* bleibt. Sagen Sie es jemand anderem, wird Haschmat zur dritten Person: *مینا می‌پرسد که حشمت کجا است*.'
  prs.a2.unit39.lesson03.teach.pattern:
    title: 'Einen Wunsch weitergeben: می‌خواهد که + Subjunktiv'
    gloss: Er/Sie möchte, dass du kommst. Er/Sie möchte, dass ich gehe.
    note: 'Um weiterzugeben, was jemand von einer anderen Person möchte, verwenden Sie *می‌خواهد که* und danach den Subjunktiv: *او می‌خواهد که تو بیایی* („er/sie möchte, dass du kommst“). Der Subjunktiv ist dieselbe Form wie nach *باید* und in *بروم* („dass ich gehe“). Es ist nicht das Präsens mit *می‌*: In *بیایی* steht kein *می‌*.'
  prs.a2.unit39.lesson03.teach.go:
    title: Der Subjunktiv von رفتن
    gloss: dass ich gehe, dass du gehst, dass er/sie geht, dass wir gehen, dass ihr geht bzw. Sie gehen (förmlich oder Plural), dass sie gehen
    note: 'Der Subjunktiv besteht aus *ب* plus Präsensstamm plus Endung: *ب + رو + م* ergibt *بروم*. Die Endungen sind *-م، -ی، -د، -یم، -ین، -ند*. Also: *بروم، بروی، برود، برویم، بروین، بروند*. *بروم* kennen Sie schon; diese Karte ergänzt die übrigen Formen.'
  prs.a2.unit39.lesson03.teach.come:
    title: Der Subjunktiv von آمدن
    gloss: dass ich komme, dass du kommst, dass er/sie kommt, dass wir kommen, dass ihr kommt bzw. Sie kommen (förmlich oder Plural), dass sie kommen
    note: '*آمدن* ist unregelmäßig: Der Subjunktivstamm lautet *بیای-*. Die Endungen sind dieselben: *بیایم، بیایی، بیاید، بیاییم، بیایین، بیایند*. *بیایم* und *بیایین* kennen Sie schon.'
  prs.a2.unit39.lesson03.teach.do:
    title: Der Subjunktiv von کردن und آوردن
    gloss: dass ich mache, dass du machst, dass er/sie macht, dass wir machen, dass ihr macht, dass sie machen. dass ich mitbringe, dass du mitbringst, dass er/sie mitbringt.
    note: '*کردن* hat kein *ب*: *کنم، کنی، کند، کنیم، کنین، کنند*. So wird aus *تیلفون کردن* die Form *تیلفون کنی* („dass du anrufst“). *آوردن* funktioniert wie *آمدن* mit *بیاور-*: *بیاورم، بیاوری، بیاورد*.'
  prs.a2.unit39.lesson03.teach.tell:
    title: Der Subjunktiv von گفتن
    gloss: dass ich sage, dass du sagst, dass er/sie sagt
    note: '*گفتن* hat im Subjunktiv den Stamm *گوی-*: *بگویم، بگویی، بگوید*. Das Muster ist *ب* plus Stamm plus Endung, wie bei *بروم*.'
  prs.a2.unit39.lesson03.teach.phone:
    title: Der Direktor möchte, dass du anrufst
    gloss: Der Direktor möchte, dass du anrufst.
    note: Die Person, die etwas möchte, ist *مدیر*, die Person, die handeln soll, ist *تو*, und das Verb nach *که* ist *کنی*.
  prs.a2.unit39.lesson03.teach.computer:
    title: Er/Sie möchte, dass du den Computer mitbringst
    gloss: Er/Sie möchte, dass du den Computer mitbringst.
    note: '*را* steht nach dem Ding, das mitgebracht wird, wie in jedem Satz mit einem Objekt.'
  prs.a2.unit39.lesson03.teach.same:
    title: Derselbe Subjunktiv, wenn die Person selbst geht
    gloss: Ich möchte gehen. Er/Sie möchte gehen.
    note: 'Sind die Person, die etwas möchte, und die Person, die handelt, dieselbe, steht ebenfalls der Subjunktiv: *من می‌خواهم که بروم*. Verwenden Sie die passende Endung: *-م* für „ich“, *-د* für „er/sie“. In dieser Lektion geben Sie meist einen Wunsch an eine andere Person weiter, wie in *او می‌خواهد که تو بیایی*.'
  prs.a2.unit39.lesson04.teach.note:
    title: Notiz
    gloss: Notiz, Memo
    note: '*یادداشت* ist eine kurze schriftliche Notiz, zum Beispiel ein Zettel auf einem Tisch oder an einer Tür. Sie ist auch eine Möglichkeit, eine Nachricht weiterzugeben, wenn die Person nicht da ist.'
    example_gloss: Die Notiz liegt im Büro.
  prs.a2.unit39.lesson04.teach.writes:
    title: Er/Sie schreibt
    gloss: er schreibt, sie schreibt
    note: '*می‌نویسد* bedeutet „er/sie schreibt“ und ist das Präsens von *نوشتن*. *می‌نویسم* bedeutet „ich schreibe“.'
    example_gloss: Haschmat schreibt eine Notiz.
  prs.a2.unit39.lesson04.teach.sends:
    title: Er/Sie schickt
    gloss: er schickt, sie schickt
    note: '*می‌فرستد* bedeutet „er/sie schickt“. *می‌فرستم* („ich schicke“) kennen Sie schon.'
    example_gloss: Der Direktor schickt eine Nachricht.
  prs.a2.unit39.lesson04.teach.written:
    title: 'Eine schriftliche Nachricht: می‌نویسد که'
    gloss: In der Notiz schreibt er/sie, dass die Besprechung um neun Uhr ist.
    note: 'Eine schriftliche Nachricht wird genauso weitergegeben wie eine mündliche: *می‌نویسد که* und danach die Aussage. *در یادداشت* bedeutet „in der Notiz“. Die Reihenfolge ist dieselbe wie bei *می‌گوید که*.'
  prs.a2.unit39.lesson04.teach.tell_him:
    title: 'Sagen, wem man etwas mitteilt: به'
    gloss: Ich sage ihm/ihr, dass die Besprechung um neun Uhr ist. Der Chef sagt Mina, dass die Besprechung morgen ist.
    note: 'Um zu sagen, wem etwas mitgeteilt wird, stellen Sie *به* und die Person, die es hört, vor das Verb: *به او می‌گویم* (ich sage ihm/ihr), *به مینا می‌گوید* (er sagt Mina). Der Rest des Musters bleibt: *که* und danach die Nachricht.'
  prs.a2.unit39.lesson04.teach.phone_says:
    title: Er/Sie ruft an und sagt, dass er/sie morgen kommt
    gloss: Er/Sie ruft an und sagt, dass er/sie morgen kommt.
    note: 'Eine Telefonnachricht enthält oft zwei Verben hintereinander: *تیلفون می‌کند* (ruft an) und *می‌گوید که ...* (sagt, dass ...), verbunden durch *و*.'
  prs.a2.unit39.lesson04.teach.i_write:
    title: Ich schreibe eine Notiz
    gloss: Ich schreibe eine Notiz.
    note: Man schreibt eine Notiz, wenn man die Nachricht nicht persönlich weitergeben kann.
  prs.a2.unit39.lesson05.teach.not_come:
    title: Er/Sie kommt nicht
    gloss: er kommt nicht, sie kommt nicht
    note: '*نمی‌آید* bedeutet „er/sie kommt nicht“: *ن* steht vor *می‌آید*. Sie kennen schon *نمی‌روم* (ich gehe nicht).'
    example_gloss: Er/Sie kommt morgen nicht.
  prs.a2.unit39.lesson05.teach.call_turn01:
    title: Zug 1
    gloss: Haschmat, wer hat angerufen?
    note: Mina kommt nach Hause und fragt, wer angerufen hat.
  prs.a2.unit39.lesson05.teach.call_turn02:
    title: Zug 2
    gloss: Der Chef hat angerufen. Er sagt, dass die Besprechung morgen um neun Uhr ist.
    note: Haschmat antwortet und gibt den ersten Teil der Nachricht mit *می‌گوید که* weiter.
  prs.a2.unit39.lesson05.teach.call_turn03:
    title: Zug 3
    gloss: Um neun? Was sagt er sonst noch?
    note: Mina fragt nach mehr. *چه می‌گوید* bedeutet „was sagt er?“.
  prs.a2.unit39.lesson05.teach.call_turn04:
    title: Zug 4
    gloss: Er fragt, ob du morgen kommst. Und er möchte, dass du den Computer mitbringst.
    note: 'Zwei weitere Teile der Nachricht: eine Frage mit *می‌پرسد که* und ein Wunsch mit *می‌خواهد که* und dem Konjunktiv *بیاوری*.'
  prs.a2.unit39.lesson05.teach.call_turn05:
    title: Zug 5
    gloss: Ja, ich komme morgen und bringe den Computer mit.
    note: Mina beantwortet die Frage und den Wunsch in der ersten Person.
  prs.a2.unit39.lesson05.teach.call_turn06:
    title: Zug 6
    gloss: Gut. Dann rufe ich ihn an.
    note: Haschmat wird Minas Antwort telefonisch weitergeben. *به او تیلفون می‌کنم* bedeutet „ich rufe ihn an“.
  prs.a2.unit39.lesson05.teach.note_read:
    title: Eine Notiz von Haschmat
    gloss: Hallo Mina. Heute um vier Uhr hat dein Freund/deine Freundin angerufen. Er/Sie sagt, dass er/sie morgen nicht kommt, weil er/sie Arbeit hat. Er/Sie fragt, ob du am Freitag Zeit hast. Er/Sie möchte, dass du ihn/sie anrufst. Seine/Ihre Nummer steht in dieser Notiz. Haschmat
    note: 'Eine schriftliche Nachricht, die einen Anruf weitergibt, mit den drei Verben dieser Lektion: *می‌گوید که*, *می‌پرسد که* und *می‌خواهد که*. Der Anruf des Freundes/der Freundin ist ein anderer als der Anruf des Chefs im Gespräch.'
  prs.a2.unit39.lesson06.teach.office_turn01:
    title: Zug 1
    gloss: Rahila, ich habe eine Nachricht für dich.
    note: 'Behzad beginnt: Er hat eine Nachricht weiterzugeben.'
  prs.a2.unit39.lesson06.teach.office_turn02:
    title: Zug 2
    gloss: Von wem ist sie?
    note: Rahila fragt, von wem die Nachricht ist.
  prs.a2.unit39.lesson06.teach.office_turn03:
    title: Zug 3
    gloss: Aus der Praxis des Arztes. Ein Mitarbeiter/Eine Mitarbeiterin hat angerufen. Er/Sie sagt, dass dein Termin am Donnerstag um zwei Uhr ist.
    note: Behzad gibt den ersten Teil mit *می‌گوید که* weiter.
  prs.a2.unit39.lesson06.teach.office_turn04:
    title: Zug 4
    gloss: Donnerstag um zwei? Was sagt er/sie sonst noch?
    note: Rahila fragt nach dem Rest.
  prs.a2.unit39.lesson06.teach.office_turn05:
    title: Zug 5
    gloss: Er/Sie fragt, ob du einen Ausweis hast. Und er/sie möchte, dass du um eins kommst.
    note: Eine Frage mit *می‌پرسد که* und ein Wunsch mit *می‌خواهد که* und dem Konjunktiv *بیایی*.
  prs.a2.unit39.lesson06.teach.office_turn06:
    title: Zug 6
    gloss: Ja, habe ich. Ich schreibe mir eine Notiz. Vielen Dank.
    note: Rahila beantwortet die Frage, sagt, dass sie eine Notiz schreibt, damit sie es nicht vergisst, und bedankt sich bei Behzad.
  prs.a2.unit39.lesson06.teach.summary:
    title: Drei Verben, drei Arten von Nachrichten
    gloss: Er/Sie sagt, dass der Termin am Donnerstag ist. Er/Sie fragt, ob du einen Ausweis hast. Er/Sie möchte, dass du um eins kommst.
    note: Eine Nachricht enthält meist eine Aussage, eine Frage oder einen Wunsch. Auf *می‌گوید که* folgt eine Aussage, auf *می‌پرسد که* eine Frage und auf *می‌خواهد که* der Konjunktiv. Die Verbendung zeigt, wer spricht, und die Nachricht bleibt im Präsens.
exercises:
  prs.a2.unit39.lesson01.exercise01.recognize_manager_says:
    instruction: Was bedeutet dieser Satz?
    correct_option: Der Direktor sagt, dass die Besprechung um neun Uhr ist
    distractors:
    - Der Chef fragt, ob die Besprechung um neun Uhr ist
    - Der Chef hat gesagt, dass die Besprechung um neun Uhr war
    - Die Besprechung ist im Büro des Chefs
    accepted_answers:
    - value: Der Direktor sagt, dass die Besprechung um neun Uhr ist
      status: correct
    feedback: '*مدیر می‌گوید که جلسه ساعت نه است* bedeutet „Der Chef sagt, dass die Besprechung um neun Uhr ist“.'
  prs.a2.unit39.lesson01.exercise02.recognize_they_say:
    instruction: Was bedeutet dieser Satz?
    correct_option: Sie sagen, dass die Besprechung um zehn Uhr ist
    distractors:
    - Sie fragen, wann die Besprechung ist
    - Sie sagen, dass die Besprechung um neun Uhr ist
    - Sie sagen, dass die Besprechung um zehn Uhr war
    accepted_answers:
    - value: Sie sagen, dass die Besprechung um zehn Uhr ist
      status: correct
    feedback: '*می‌گویند* bedeutet „sie sagen“, und *ساعت ده* heißt „zehn Uhr“.'
  prs.a2.unit39.lesson01.exercise03.recognize_who_says:
    instruction: Was bedeutet dieser Satz?
    correct_option: Haschmat sagt, dass Mina morgen kommt
    distractors:
    - Mina sagt, dass Haschmat morgen kommt
    - Haschmat fragt, ob Mina morgen kommt
    - Haschmat sagt, dass Mina gestern gekommen ist
    accepted_answers:
    - value: Haschmat sagt, dass Mina morgen kommt
      status: correct
    feedback: 'Zuerst kommt, wer spricht: *حشمت می‌گوید*. Was er sagt, ist *مینا فردا می‌آید*.'
  prs.a2.unit39.lesson01.exercise04.match_says:
