teaching:
  prs.a1.unit14.lesson01.teach.doost_daram_phrase:
    title: ich mag
    gloss: ich mag
    note: دوست دارم bedeutet wörtlich „Ich habe Freundschaft (mit ihm/ihr/es)“ – die übliche Art, „Ich mag …“ zu sagen.
  prs.a1.unit14.lesson01.teach.qahwa_word:
    title: Kaffee
    gloss: Kaffee
    note: قهوه bedeutet „Kaffee“.
    example_gloss: Ich mag Kaffee.
  prs.a1.unit14.lesson01.teach.chai_word:
    title: Tee
    gloss: Tee
    note: چای bedeutet „Tee“.
    example_gloss: Tee gefällt mir nicht.
  prs.a1.unit14.lesson01.teach.doost_nadaram_phrase:
    title: ich mag nicht
    gloss: Ich mag nicht
    note: دوست ندارم ist die Verneinung von دوست دارم.
  prs.a1.unit14.lesson01.teach.man_word:
    title: ich
    gloss: ich
    note: من ist das alleinstehende Personalpronomen der 1. Person („ich“).
    example_gloss: Ich mag Kaffee.
  prs.a1.unit14.lesson01.teach.ra_word:
    title: (Objektmarker)
    gloss: (kennzeichnet das Objekt des Verbs)
    note: را kennzeichnet ein bestimmtes direktes Objekt. Im Dari wird es sowohl in der Alltagssprache als auch in der Schrift verwendet; das iranische رو ist nicht gebräuchlich.
    target_text: را (Objektmarker)
  prs.a1.unit14.lesson02.teach.kodam_word:
    title: Welche/r/s
    gloss: welche/r/s
    note: کدام bedeutet „welche/r/s“.
    example_gloss: Welches mögen Sie?
  prs.a1.unit14.lesson02.teach.moosiqi_word:
    title: Musik
    gloss: Musik
    note: موسیقی bedeutet „Musik“.
    example_gloss: Ich mag Musik.
  prs.a1.unit14.lesson02.teach.darid_grammar:
    title: Sie haben / mögen (höflich)
    gloss: Sie haben / Sie mögen
    note: دارین ist die höfliche Form bzw. die Pluralform der 2. Person von داشتن („haben“), passend zum Schwerpunkt dieses Kurses auf den höflichen Formen استم/استین.
    target_text: دارین (Sie haben / mögen, höflich)
  prs.a1.unit14.lesson02.teach.kodam_ra_question:
    title: Welches mögen Sie?
    gloss: Welches mögen Sie?
    note: کدام را دوست دارین؟ – را kennzeichnet das Objekt, hier das, was Sie auswählen.
  prs.a1.unit14.lesson03.teach.bishtar_word:
    title: Mehr
    gloss: mehr
    note: بیشتر bedeutet „mehr“.
    example_gloss: Ich mag Kaffee lieber.
  prs.a1.unit14.lesson03.teach.ya_word:
    title: Oder
    gloss: oder
    note: یا bedeutet „oder“ und bietet die Wahl zwischen zwei Dingen an.
    target_text: یا (oder)
  prs.a1.unit14.lesson03.teach.qahwa_ya_chai_question:
    title: Kaffee oder Tee?
    gloss: Kaffee oder Tee?
    note: قهوه یا چای؟ bietet die Wahl zwischen den beiden Getränken aus Lektion 1 an.
  prs.a1.unit14.lesson04.teach.choon_word:
    title: Weil
    gloss: weil
    note: چون leitet eine Begründung ein.
    target_text: چون (weil)
  prs.a1.unit14.lesson04.teach.khoshmaza_ast_word:
    title: Es schmeckt gut
    gloss: es ist lecker
    note: خوش‌مزه است ist die volle, nicht zusammengezogene Form (es ist lecker) – in diesem Kurs wird است als eigenes Wort geschrieben und nicht verkürzt.
    example_gloss: Ich mag Kaffee, weil er lecker ist.
  prs.a1.unit14.lesson04.teach.jaleb_ast_word:
    title: Es ist interessant
    gloss: es ist interessant
    note: جالب است ist die volle, nicht zusammengezogene Form (es ist interessant).
    example_gloss: Ich mag Musik, weil sie interessant ist.
  prs.a1.unit14.lesson04.teach.va_word:
    title: Und
    gloss: und
    note: و bedeutet „und“ und verbindet zwei Sätze oder Satzteile.
    target_text: و (und)
  prs.a1.unit14.lesson05.teach.negar_name:
    title: Negar
    gloss: Negar
    note: Ein in Afghanistan verbreiteter Frauenname.
    example_gloss: Negar mag Tee.
  prs.a1.unit14.lesson05.teach.darad_grammar:
    title: Er/Sie mag
    gloss: er/sie mag
    note: دارد ist die volle Form der 3. Person von داشتن (haben) – دوست دارد bedeutet „er/sie mag“ und entspricht dem Muster von دوست دارم in der 1. Person.
    target_text: دوست دارد (er/sie mag, vollständige Form der 3. Person)
  prs.a1.unit14.lesson05.teach.nadarad_grammar:
    title: Er/Sie mag nicht
    gloss: er/sie mag nicht
    note: ندارد ist die volle verneinte Form der 3. Person – دوست ندارد bedeutet „er/sie mag nicht“.
    target_text: دوست ندارد (er/sie mag nicht, vollständige Form der 3. Person)
  prs.a1.unit14.lesson05.teach.garm_ast_word:
    title: Es ist warm
    gloss: es ist warm
    note: گرم است ist die volle, nicht zusammengezogene Form (es ist warm).
    example_gloss: Negar mag Tee, weil er warm ist.
  prs.a1.unit14.lesson05.teach.reading_text:
    title: Beispieltext über Vorlieben
    gloss: Negar mag Tee, weil er warm ist. Negar mag keine Musik.
    note: Ein kurzer Bericht in der 3. Person, der den Wortschatz dieser Lektion zu Vorlieben verbindet.
  prs.a1.unit14.lesson06.teach.names:
    title: Karim und Negar
    gloss: Karim, Negar
    note: Häufige afghanische Namen, die in diesem Kurs immer wieder vorkommen.
    example_gloss:
    - Ich bin Karim.
    - Ich bin Negar.
  prs.a1.unit14.lesson06.teach.shoma_chetor_phrase:
    title: Und Sie?
    gloss: Und Sie?
    note: شما چطور؟ ist die höfliche Art, die Frage an das Gegenüber zurückzugeben; es passt zur höflichen Anredeform mit دارین.
  prs.a1.unit14.lesson06.teach.aali_ast_word:
    title: Das ist großartig
    gloss: das ist großartig
    note: عالی است ist die volle, nicht zusammengezogene Form (es ist großartig).
    example_gloss: Der Kaffee ist großartig.
  prs.a1.unit14.lesson06.teach.dialogue_line1:
    title: Karim fragt
    gloss: Tee oder Kaffee – was mögen Sie lieber?
  prs.a1.unit14.lesson06.teach.dialogue_line2:
    title: Negar antwortet
    gloss: Ich mag Kaffee lieber, weil er lecker ist. Und Sie?
  prs.a1.unit14.lesson06.teach.dialogue_line3:
    title: Karim antwortet
    gloss: Ich mag Tee, weil er warm ist.
  prs.a1.unit14.lesson06.teach.dialogue_line4:
    title: Negar reagiert
    gloss: Das ist großartig!
