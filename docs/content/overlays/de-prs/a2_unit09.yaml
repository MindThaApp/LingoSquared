course:
  title: Dari A2
  description: 'Dari (Afghanistan) für Fortgeschrittene auf unterem Niveau: einen formellen Termin zur Registrierung einer neuen Adresse bei der Stadtverwaltung bewältigen – Wortschatz, Terminvereinbarung, eine amtliche Mitteilung lesen und der Termin selbst.'
units:
  prs.a2.unit09.bureaucracy:
    title: Behördengänge
lessons:
  prs.a2.unit09.lesson01.bureaucracy_vocabulary:
    title: Wörter für den Behördenbesuch
  prs.a2.unit09.lesson02.making_an_appointment:
    title: Einen Termin vereinbaren
  prs.a2.unit09.lesson03.reading_the_notice:
    title: Die Mitteilung lesen
  prs.a2.unit09.lesson04.at_the_municipality_office:
    title: In der Stadtverwaltung
teaching:
  prs.a2.unit09.lesson01.teach.vaght_word:
    title: Termin
    gloss: Termin / Zeitfenster
    note: '*وقت* bedeutet wörtlich „Zeit“; *وقت گرفتن* (einen Termin nehmen) ist die alltägliche Wendung für „einen Termin vereinbaren“.'
  prs.a2.unit09.lesson01.teach.sanad_word:
    title: Dokument
    gloss: Dokument
    note: '*سند* ist das allgemeine Wort für ein amtliches Dokument.'
  prs.a2.unit09.lesson01.teach.address_word:
    title: Adresse
    gloss: Adresse
    note: '*آدرس* ist das alltägliche Wort für die Wohnadresse.'
  prs.a2.unit09.lesson01.teach.tazkira_word:
    title: Nationalausweis
    gloss: Nationalausweis (Tazkira)
    note: '*تذکره* – das Dokument, das in dieser Lektion aktualisiert wird – ist das afghanische Nationalausweisheft und ein anderes Dokument als die iranische *کارت ملی*.'
  prs.a2.unit09.lesson01.teach.municipality_word:
    title: Stadtverwaltung
    gloss: Stadtverwaltung
    note: '*شاروالی* ist der afghanische Begriff für das städtische Verwaltungsamt und unterscheidet sich vom iranisch-persischen *شهرداری*.'
  prs.a2.unit09.lesson01.teach.va_word:
    title: Und
    gloss: und
    note: '*و* ist das gängige Bindewort, das in dieser Lektion durchgehend verwendet wird.'
    target_text: و (und)
  prs.a2.unit09.lesson02.teach.request_appointment:
    title: Um einen Termin bitten
    gloss: Ich möchte einen Termin für eine Adressänderung vereinbaren.
    note: '*می‌خواستم* (wörtlich „ich wollte“) macht eine Bitte höflicher, ähnlich wie das deutsche „Ich wollte fragen …“.'
  prs.a2.unit09.lesson02.teach.because_moved:
    title: Einen Grund nennen, mit چون (weil)
    gloss: Weil ich umgezogen bin, muss ich meine Adresse ändern.
    note: '*چون* („weil“) leitet den Begründungssatz ein; danach folgt die Folge.'
  prs.a2.unit09.lesson02.teach.what_should_i_bring:
    title: Höflich fragen, was man mitbringen soll
    gloss: Könnten Sie mir sagen, was ich mitbringen muss?
    note: '*می‌شود بگویین...؟* („könnten Sie mir sagen …?“) ist eine höfliche indirekte Frageform.'
  prs.a2.unit09.lesson03.teach.rent_receipt_word:
    title: Mietquittung
    gloss: Mietquittung
    note: '*رسید کرایه خانه* ist eine Quittung über die Wohnungsmiete und gilt als ein Wohnsitznachweis.'
  prs.a2.unit09.lesson03.teach.deadline_word:
    title: Frist
    gloss: Frist
    note: '*مهلت* ist das allgemeine Wort für eine Frist.'
  prs.a2.unit09.lesson03.teach.notice_text:
    title: Ein Aushang im Amt zur Adressänderung
    gloss: Bringen Sie zur Adressänderung bitte Ihren Nationalausweis und eine Mietquittung mit. Die Anmeldefrist läuft bis Ende dieses Monats.
    note: Eine kurze amtliche Mitteilung in der formellen Schriftsprache, die in dieser Lektion behandelt wird.
  prs.a2.unit09.lesson03.teach.i_will_bring_receipt:
    title: Sagen, was man mitbringt
    gloss: Ich bringe die Mietquittung mit.
    note: '*می‌آورم* bedeutet „ich bringe“.'
  prs.a2.unit09.lesson04.teach.turn01:
    title: Der Beamte begrüßt کریم
    gloss: Der Beamte bittet ihn herein und fragt, wie er ihm helfen kann.
    note: '*بفرمایین* bittet ihn näherzutreten; *چه خدمتی می‌توانم برایتان انجام بدهم؟* ist eine höfliche, formelle Art, wie ein Beamter Hilfe anbietet.'
  prs.a2.unit09.lesson04.teach.turn02:
    title: کریم bittet um einen Termin
    gloss: کریم sagt, dass er einen Termin für die Änderung seiner Adresse vereinbaren möchte.
    note: Dasselbe höfliche Bittmuster mit *می‌خواستم* wie zuvor.
  prs.a2.unit09.lesson04.teach.turn03:
    title: Der Beamte fragt, seit wann
    gloss: Der Beamte fragt, seit wann er im neuen Haus wohnt.
    note: '*از کی...؟* fragt „seit wann“.'
  prs.a2.unit09.lesson04.teach.turn04:
    title: کریم antwortet und fragt, was er mitbringen soll
    gloss: Er sagt, seit letztem Monat, und fragt, was er mitbringen muss.
    note: Verbindet *از ماه گذشته* („seit letztem Monat“) mit der höflichen Frage *می‌شود بگویین...؟*.
  prs.a2.unit09.lesson04.teach.turn05:
    title: Der Beamte nennt die Dokumente
    gloss: Der Beamte sagt, der Nationalausweis und eine Mietquittung genügen.
    note: '*کافی است* bedeutet „genügt“.'
  prs.a2.unit09.lesson04.teach.turn06:
    title: کریم schlägt einen Tag vor
    gloss: Er fragt, ob er am Dienstag kommen kann.
    note: '*می‌توانم...؟* fragt nach Möglichkeit bzw. Erlaubnis.'
  prs.a2.unit09.lesson04.teach.turn07:
    title: Der Beamte bestätigt und nennt eine Vorgangsnummer
    gloss: Der Beamte bestätigt Dienstag um zehn Uhr und nennt die Vorgangsnummer dreitausendfünfzig.
    note: '*نمبر پیگیری* ist die Vorgangs- bzw. Referenznummer für den Termin – *نمبر* ist ein in Afghanistan gebräuchliches Lehnwort (von „Nummer“), verbunden mit *پیگیری* (Nachverfolgung); *بلی* ist das Dari-Wort für „ja“.'
