        موجودی: Kontostand
        امضا: Unterschrift
      status: correct
    feedback: Diese sechs Wörter bilden den Grundwortschatz für den Bankbesuch in dieser Lektion.
    pairs:
    - left: بانک
      right: Bank
    - left: حساب بانکی
      right: Bankkonto
    - left: کارت بانکی
      right: Bankkarte
    - left: رمز
      right: PIN
    - left: موجودی
      right: Kontostand
    - left: امضا
      right: Unterschrift
  prs.a2.unit11.lesson01.exercise04.order_card_and_pin:
    instruction: Ordnen Sie die Wörter so, dass sie „Bankkarte und PIN“ ergeben.
    accepted_answers:
    - value:
      - کارت
      - بانکی
      - و
      - رمز
      status: correct
    feedback: '*کارت بانکی و رمز* verbindet die beiden Wörter mit *و*.'
  prs.a2.unit11.lesson01.exercise05.write_signature:
    instruction: Schreiben Sie das dari Wort für „Unterschrift“.
    accepted_answers:
    - value: امضا
      status: correct
    feedback: '*امضا* bedeutet Unterschrift.'
  prs.a2.unit11.lesson02.exercise01.recognize_request_account:
    instruction: Mit welchem Satz bittet man höflich darum, ein Bankkonto zu eröffnen?
    correct_option: Ich möchte gern ein Bankkonto eröffnen.
    distractors:
    - Wenn Sie Ihre Tazkira (Personalausweis) und einen Mietbeleg haben, können Sie ein Konto eröffnen.
    - Ihre Bankkarte ist in drei Tagen fertig.
    - Der Mindestkontostand beträgt 500 Afghani.
    accepted_answers:
    - value: Ich möchte gern ein Bankkonto eröffnen.
      status: correct
    feedback: '*می‌خواستم یک حساب بانکی باز کنم.* bittet höflich um die Kontoeröffnung.'
  prs.a2.unit11.lesson02.exercise02.order_card_ready_timeline:
    instruction: Ordnen Sie die Wörter so, dass sie „Die Karte ist in drei Tagen fertig“ ergeben.
    accepted_answers:
    - value:
      - کارت
      - بانکی‌تان
      - تا
      - سه
      - روز
      - دیگر
      - آماده
      - می‌شود
      status: correct
    feedback: '*کارت بانکی‌تان تا سه روز دیگر آماده می‌شود.* nennt die Frist.'
  prs.a2.unit11.lesson02.exercise03.dialogue_response_why_here:
    instruction: 'Der Bankangestellte fragt: „Was kann ich für Sie tun?“ Antworten Sie, dass Sie gern ein Bankkonto eröffnen möchten.'
    accepted_answers:
    - value: می‌خواستم یک حساب بانکی باز کنم.
      status: correct
    - value: می‌خواستم یک حساب بانکی باز کنم
      status: correct
    feedback: '*می‌خواستم یک حساب بانکی باز کنم.* ist die höfliche Bitte.'
  prs.a2.unit11.lesson02.exercise04.translate_open_account:
    instruction: 'Übersetzen Sie ins Dari: Ich möchte gern ein Bankkonto eröffnen.'
    accepted_answers:
    - value: می‌خواستم یک حساب بانکی باز کنم.
      status: correct
    - value: می‌خواستم یک حساب بانکی باز کنم
      status: correct
    feedback: '*می‌خواستم یک حساب بانکی باز کنم.* ist die höfliche Bitte.'
  prs.a2.unit11.lesson02.exercise05.write_if_documents:
    instruction: Schreiben Sie, dass Sie ein Konto eröffnen können, wenn Sie Ihr Ausweisheft und eine Mietquittung haben.
    accepted_answers:
    - value: اگر تذکره و رسید کرایه خانه داشته باشین، می‌توانین حساب باز کنین.
      status: correct
    - value: اگر تذکره و رسید کرایه خانه داشته باشین. می‌توانین حساب باز کنین.
      status: correct
    - value: اگر تذکره و رسید کرایه خانه داشته باشین و می‌توانین حساب باز کنین
      status: correct
    feedback: Bedingung und Folge können mit Komma, Punkt oder *و* verbunden werden – alles ist gleich natürlich.
  prs.a2.unit11.lesson03.exercise01.read_required_documents:
    instruction: Welche Dokumente braucht man laut Aushang, um ein Konto zu eröffnen?
    correct_option: Ausweisheft und eine Mietquittung
    distractors:
    - nur eine Mietquittung
    - ein Reisepass und ein Foto
    - nichts, nur Ihren Namen
    accepted_answers:
    - value: Ausweisheft und eine Mietquittung
      status: correct
    feedback: Der Aushang verlangt Ihre *تذکره* und eine *رسید کرایه خانه*.
  prs.a2.unit11.lesson03.exercise02.read_minimum_balance:
    instruction: Wie hoch ist laut Aushang das Mindestguthaben auf dem Konto?
    correct_option: 500 Afghani
    distractors:
    - 1000 Afghani
    - 50 Afghani
    - Es gibt kein Mindestguthaben
    accepted_answers:
    - value: 500 Afghani
      status: correct
    feedback: '*حداقل موجودی حساب پنجصد افغانی است* – das Mindestguthaben beträgt 500 Afghani.'
  prs.a2.unit11.lesson03.exercise03.recognize_fee_word:
    instruction: Was bedeutet dieses Wort?
    correct_option: Gebühr
    distractors:
    - Minimum
    - Kontostand
    - Unterschrift
    accepted_answers:
    - value: Gebühr
      status: correct
    feedback: '*کارمزد* bedeutet Gebühr.'
  prs.a2.unit11.lesson03.exercise04.order_minimum_balance:
    instruction: Ordnen Sie die Wörter so, dass sie „Das Mindestguthaben auf dem Konto beträgt 500 Afghani“ ergeben.
    accepted_answers:
    - value:
      - حداقل
      - موجودی
      - حساب
      - پنجصد
      - افغانی
      - است
      status: correct
    feedback: '*حداقل موجودی حساب پنجصد افغانی است* nennt das Mindestguthaben, genau wie im Aushang.'
  prs.a2.unit11.lesson03.exercise05.write_no_fee:
    instruction: Schreiben Sie, dass es keine monatliche Gebühr gibt.
    accepted_answers:
    - value: کارمزد ماهانه نیست.
      status: correct
    - value: کارمزد ماهانه نیست
      status: correct
    feedback: '*کارمزد ماهانه نیست.* sagt, dass es keine monatliche Gebühr gibt.'
  prs.a2.unit11.lesson04.exercise01.comprehend_required_documents:
    instruction: Was verlangt der Bankangestellte von همایون?
    correct_option: sein Ausweisheft und eine Mietquittung
    distractors:
    - nur einen Reisepass
    - nur einen Mietvertrag
    - gar nichts
    accepted_answers:
    - value: sein Ausweisheft und eine Mietquittung
      status: correct
    feedback: '*تذکره و یک رسید کرایه خانه دارین؟* – der Bankangestellte fragt nach beiden Dokumenten.'
  prs.a2.unit11.lesson04.exercise02.comprehend_card_ready:
    instruction: Wann ist همایون s Bankkarte fertig?
    correct_option: in drei Tagen
    distractors:
    - in einem Tag
    - in einer Woche
    - in einem Monat
    accepted_answers:
    - value: in drei Tagen
      status: correct
    feedback: '*کارت بانکی‌تان تا سه روز دیگر آماده می‌شود* – in drei Tagen.'
  prs.a2.unit11.lesson04.exercise03.recognize_pin_timing:
    instruction: Wann bekommt همایون seine PIN?
    correct_option: am selben Tag, an dem er die Karte abholt
    distractors:
    - an dem Tag, an dem er das Konto eröffnet
    - eine Woche nach Fertigstellung der Karte
    - er muss anrufen und nachfragen
    accepted_answers:
    - value: am selben Tag, an dem er die Karte abholt
      status: correct
    feedback: '*همان روزی که کارت را تحویل می‌گیرین* – am selben Tag, an dem Sie die Karte abholen.'
  prs.a2.unit11.lesson04.exercise04.order_documents_question:
    instruction: Ordnen Sie die Wörter so, dass sie die Frage ergeben, ob jemand sein Ausweisheft und eine Mietquittung hat.
    accepted_answers:
    - value:
      - تذکره
      - و
      - یک
      - رسید
      - کرایه
      - خانه
      - دارین
      status: correct
    feedback: '*تذکره و یک رسید کرایه خانه دارین؟* fragt nach beiden Dokumenten.'
  prs.a2.unit11.lesson04.exercise05.dialogue_response_as_homayoun:
    instruction: 'Der Bankangestellte fragt: „Was kann ich für Sie tun?“ Antworten Sie als همایون.'
    accepted_answers:
    - value: می‌خواستم یک حساب بانکی باز کنم.
      status: correct
    - value: می‌خواستم یک حساب بانکی باز کنم
      status: correct
    feedback: '*می‌خواستم یک حساب بانکی باز کنم.* ist همایون s Anliegen.'
  prs.a2.unit11.lesson04.exercise06.write_pin_summary:
    instruction: 'Sagen Sie in einem ganzen Satz in der ersten Person, wann Sie die PIN bekommen: am selben Tag, an dem Sie die Karte abholen.'
    accepted_answers:
    - value: رمزش را همان روزی می‌گیرم که کارت را تحویل می‌گیرم.
      status: correct
    - value: رمزش را همان روزی می‌گیرم که کارت را تحویل می‌گیرم
      status: correct
    - value: رمزش را همان روزی که کارت را تحویل می‌گیرم می‌گیرم.
      status: correct
    - value: همان روزی که کارت را تحویل می‌گیرم، رمزش را می‌گیرم.
      status: correct
    - value: همان روزی که کارت را تحویل می‌گیرم رمزش را می‌گیرم
      status: correct
    feedback: '*رمزش را همان روزی می‌گیرم که کارت را تحویل می‌گیرم.* macht aus der Antwort des Bankangestellten (*تحویل می‌گیرین*, „Sie holen ab“) einen Satz in der ersten Person („Ich bekomme sie an dem Tag, an dem ich die Karte abhole“).'
