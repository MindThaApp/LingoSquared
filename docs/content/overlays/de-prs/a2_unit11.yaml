course:
  title: Dari A2
  description: 'Dari (Afghanistan) für Fortgeschrittene auf unterem Niveau: ein einfaches Bankkonto eröffnen – Wortschatz, das Konto beantragen, eine Bankmitteilung lesen und das Gespräch am Bankschalter.'
units:
  prs.a2.unit11.banking:
    title: Ein Bankkonto eröffnen
lessons:
  prs.a2.unit11.lesson01.banking_vocabulary:
    title: Wörter rund um die Bank
  prs.a2.unit11.lesson02.requesting_an_account:
    title: Ein Konto beantragen
  prs.a2.unit11.lesson03.reading_a_bank_notice:
    title: Eine Bankmitteilung lesen
  prs.a2.unit11.lesson04.bank_counter_dialogue:
    title: Am Bankschalter
teaching:
  prs.a2.unit11.lesson01.teach.bank_word:
    title: Bank
    gloss: Bank
    note: '*بانک* ist das alltägliche Wort für Bank.'
    example_gloss: Die Bank ist nahe bei Homayouns Haus.
  prs.a2.unit11.lesson01.teach.account_word:
    title: Bankkonto
    gloss: Bankkonto
    note: '*حساب بانکی* -- *حساب* allein bedeutet auch in allgemeinen Zusammenhängen „Konto“.'
    example_gloss: Homayoun möchte ein Bankkonto.
  prs.a2.unit11.lesson01.teach.card_word:
    title: Bankkarte
    gloss: Bankkarte
    note: '*کارت بانکی* -- *کارت* allein ist das allgemeine Wort für „Karte“.'
    example_gloss: Ich habe meine Bankkarte verloren.
  prs.a2.unit11.lesson01.teach.pin_word:
    title: PIN
    gloss: PIN / Passwort
    note: '*رمز* steht sowohl für eine Bank-PIN als auch für ein allgemeines Passwort.'
    example_gloss: Ich habe die PIN meiner Bankkarte vergessen.
  prs.a2.unit11.lesson01.teach.balance_word:
    title: Kontostand
    gloss: Kontostand
    note: '*موجودی* ist der Geldbetrag, der sich aktuell auf einem Konto befindet.'
    example_gloss: Mein Kontostand ist niedrig.
  prs.a2.unit11.lesson01.teach.signature_word:
    title: Unterschrift
    gloss: Unterschrift
    note: '*امضا* bedeutet sowohl das Unterschreiben als auch die Unterschrift selbst.'
    example_gloss: Bitte unterschreiben Sie hier.
  prs.a2.unit11.lesson01.teach.if_grammar:
    title: „Wenn“ mit اگر
    gloss: Wenn Sie Ihre Tazkira (Personalausweis) haben, können Sie ein Konto eröffnen.
    note: '*اگر* leitet einen Bedingungssatz ein – eine neue Art von Nebensatz neben *چون* (weil).'
  prs.a2.unit11.lesson01.teach.open_account_word:
    title: Ein Konto eröffnen
    gloss: die Kontoeröffnung
    note: '*باز کردن حساب* -- *باز کردن* bedeutet „öffnen“.'
  prs.a2.unit11.lesson01.teach.va_word:
    title: Und
    gloss: und
    note: '*و* ist das gebräuchliche Bindewort, das in dieser Einheit durchgehend verwendet wird.'
    target_text: و (und)
  prs.a2.unit11.lesson02.teach.request_account:
    title: Um die Eröffnung eines Kontos bitten
    gloss: Ich möchte gern ein Bankkonto eröffnen.
    note: Greift das bereits bekannte Muster *می‌خواستم* für höfliche Bitten wieder auf.
  prs.a2.unit11.lesson02.teach.if_documents:
    title: Die Voraussetzung nennen, mit اگر
    gloss: Wenn Sie Ihre Tazkira (Personalausweis) und einen Mietbeleg haben, können Sie ein Konto eröffnen.
    note: '*اگر... داشته باشین* -- „wenn Sie ... haben“ -- verbindet den neuen Bedingungssatz mit *رسید کرایه خانه* (Mietbeleg).'
  prs.a2.unit11.lesson02.teach.card_ready_timeline:
    title: Sagen, wann die Karte fertig ist
    gloss: Ihre Bankkarte ist in drei Tagen fertig.
    note: '*تا سه روز دیگر* bedeutet „innerhalb von drei weiteren Tagen“.'
  prs.a2.unit11.lesson03.teach.fee_word:
    title: Gebühr
    gloss: Gebühr
    note: '*کارمزد* ist eine Service- oder Transaktionsgebühr.'
    example_gloss: Dieses Konto hat keine Gebühr.
  prs.a2.unit11.lesson03.teach.minimum_word:
    title: Mindestens
    gloss: Minimum
    note: '*حداقل* bedeutet „Minimum“ oder „mindestens“.'
    example_gloss: Der Mindestkontostand beträgt 500 Afghani.
  prs.a2.unit11.lesson03.teach.notice_text:
    title: Eine Bankmitteilung zur Kontoeröffnung
    gloss: Bitte bringen Sie zur Kontoeröffnung Ihre Tazkira (Personalausweis) und einen Mietbeleg mit. Der Mindestkontostand beträgt 500 Afghani. Es gibt keine monatliche Gebühr.
    note: Eine kurze offizielle Bankmitteilung in der formellen Schriftsprache, die diese Einheit vermittelt.
  prs.a2.unit11.lesson04.teach.turn01:
    title: Der Bankangestellte begrüßt همایون
    gloss: Der Angestellte bittet ihn herein und fragt, wie er ihm behilflich sein kann.
    note: Dieselbe formelle Begrüßung, mit der ein Büroangestellter seine Hilfe anbietet.
  prs.a2.unit11.lesson04.teach.turn02:
    title: همایون bittet darum, ein Konto zu eröffnen
    gloss: همایون sagt, dass er gern ein Bankkonto eröffnen möchte.
    note: Dasselbe höfliche Bittmuster mit *می‌خواستم* wie zuvor.
  prs.a2.unit11.lesson04.teach.turn03:
    title: Der Angestellte fragt nach Dokumenten
    gloss: Der Angestellte fragt, ob er seine Tazkira (Personalausweis) und einen Mietbeleg hat.
    note: '*دارین؟* -- „haben Sie?“ -- die höfliche Frageform.'
  prs.a2.unit11.lesson04.teach.turn04:
    title: همایون bestätigt, dass er sie dabeihat
    gloss: Ja, hier sind sein Ausweisheft (Tazkira) und seine Mietquittung.
    note: '*این هم ...* („hier ist ...“) sagt man, wenn man jemandem etwas überreicht.'
  prs.a2.unit11.lesson04.teach.turn05:
    title: Der Bankangestellte bestätigt und nennt die Frist
    gloss: Gut. Seine Bankkarte ist in drei Tagen fertig.
    note: Wiederholt die Zeitangabe *تا سه روز دیگر آماده می‌شود* („ist innerhalb von drei weiteren Tagen fertig“).
  prs.a2.unit11.lesson04.teach.turn06:
    title: همایون fragt nach der PIN
    gloss: Er fragt, wann er die PIN bekommt.
    note: '*رمزش* – „seine PIN“ – hängt das Possessivsuffix *-ش* an *رمز*.'
  prs.a2.unit11.lesson04.teach.turn07:
    title: Der Kassierer antwortet
    gloss: 'Der Bankangestellte sagt: am selben Tag, an dem er die Karte abholt.'
    note: '*همان روزی که ...* bedeutet „an demselben Tag, an dem ...“.'
  prs.a2.unit11.lesson04.teach.turn08:
    title: همایون bedankt sich beim Bankangestellten
    gloss: همایون bedankt sich beim Bankangestellten für die Zeit.
    note: '*تشکر از وقت‌تان* („Danke für Ihre Zeit“) ist eine höfliche Abschiedsformel.'
exercises:
