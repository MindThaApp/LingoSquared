    - seit heute Morgen
    - seit gestern Morgen
    accepted_answers:
    - value: seit gestern Abend
      status: correct
    feedback: '*از دیشب* -- seit gestern Abend.'
  prs.a2.unit13.lesson04.exercise02.comprehend_worker_when:
    instruction: Wann schickt der Vermieter einen Handwerker?
    correct_option: morgen um neun
    distractors:
