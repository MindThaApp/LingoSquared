course:
  title: Dari A2
  description: 'Dari (Afghanistan) für leicht Fortgeschrittene: ein Problem im Haushalt beim Vermieter melden – Wortschatz, das Problem beschreiben, eine Mitteilung zur Instandhaltung lesen und das Telefonat selbst.'
units:
  prs.a2.unit13.maintenance:
    title: Ein Problem im Haushalt melden
lessons:
  prs.a2.unit13.lesson01.maintenance_vocabulary:
    title: Wörter für Probleme im Haushalt
  prs.a2.unit13.lesson02.reporting_the_problem:
    title: Das Problem melden
  prs.a2.unit13.lesson03.reading_a_maintenance_notice:
    title: Eine Mitteilung zur Instandhaltung lesen
  prs.a2.unit13.lesson04.maintenance_call_dialogue:
    title: Den Vermieter anrufen
teaching:
  prs.a2.unit13.lesson01.teach.malfunction_word:
    title: Defekt / Störung
    gloss: Defekt / Schaden
    note: '*خرابی* ist das allgemeine Wort dafür, dass etwas kaputt ist oder nicht funktioniert.'
    example_gloss: Ich habe den Defekt am Rohr gemeldet.
  prs.a2.unit13.lesson01.teach.pipe_word:
    title: Rohr
    gloss: Rohr
    note: '*لوله* ist das alltägliche Wort für ein Rohr.'
    example_gloss: Das Rohr in der Küche tropft.
  prs.a2.unit13.lesson01.teach.electricity_word:
    title: Strom
    gloss: Strom / Stromversorgung
    note: '*برق* bedeutet Strom oder Stromversorgung.'
    example_gloss: In meinem Schlafzimmer funktioniert der Strom nicht.
  prs.a2.unit13.lesson01.teach.leak_word:
    title: Leck
    gloss: Leck / Tropfen
    note: '*چکه* beschreibt Wasser, das tropft oder austritt.'
    example_gloss: Das Tropfen des Rohrs wird jede Nacht schlimmer.
  prs.a2.unit13.lesson01.teach.repair_word:
    title: Reparatur
    gloss: Reparatur
    note: '*تعمیر* ist das allgemeine Wort für eine Reparatur.'
    example_gloss: Die Reparatur des Rohrs ist morgen.
  prs.a2.unit13.lesson01.teach.worker_word:
    title: Handwerker
    gloss: Handwerker / Arbeiter
    note: '*کارگر* ist allgemein ein Arbeiter, hier speziell ein Handwerker für Reparaturen.'
    example_gloss: Der Vermieter schickt einen Handwerker.
  prs.a2.unit13.lesson01.teach.asap_grammar:
    title: 'So bald wie möglich: هر چه زودتر'
    gloss: so bald wie möglich
    note: '*هر چه زودتر* – eine Wendung für Dringlichkeit, wörtlich „was auch immer früher“.'
    target_text: هر چه زودتر (so bald wie möglich)
  prs.a2.unit13.lesson02.teach.pipe_leaking_asap:
    title: Das tropfende Rohr dringend melden
    gloss: Das Rohr in meiner Küche tropft und muss so bald wie möglich repariert werden.
    note: Verbindet *چکه می‌کند* (tropft) mit *هر چه زودتر* und *باید* (müssen).
  prs.a2.unit13.lesson02.teach.when_send_worker:
    title: Fragen, wann ein Handwerker kommen kann
    gloss: Wann können Sie einen Handwerker schicken?
    note: '*کی می‌توانین...؟* fragt „Wann können Sie ...?“.'
  prs.a2.unit13.lesson02.teach.bedroom_electricity_not_working:
    title: Ein zweites Problem melden
    gloss: In meinem Schlafzimmer funktioniert der Strom nicht.
    note: '*کار نمی‌کند* bedeutet „funktioniert nicht“ und wird für ein Gerät oder eine Versorgung wie Strom verwendet.'
  prs.a2.unit13.lesson03.teach.cost_word:
    title: Kosten / Gebühr
    gloss: Kosten / Gebühr
    note: '*هزینه* ist das allgemeine Wort für Kosten oder Ausgaben.'
    example_gloss: Die Elektroreparatur kostet etwas.
  prs.a2.unit13.lesson03.teach.free_word:
    title: Kostenlos
    gloss: kostenlos
    note: '*رایگان* bedeutet „kostenlos“, ohne Kosten.'
    example_gloss: Die Reparatur des Rohrs ist kostenlos.
  prs.a2.unit13.lesson03.teach.notice_text:
    title: Eine Mitteilung zur Instandhaltung im Haus
    gloss: Der Handwerker kommt am Donnerstag um zehn Uhr. Rohrreparaturen sind kostenlos, Elektroreparaturen kosten etwas.
    note: Ein kurzer allgemeiner Aushang im Haus in formeller Schriftsprache – ein eigener aushang, nicht derselbe Besuch wie bei کریمs Telefonat später in der Lektion.
  prs.a2.unit13.lesson04.teach.turn01:
    title: Der Vermieter nimmt das Telefon ab
    gloss: 'Der Vermieter meldet sich: „Hallo, bitte sehr.“'
    note: '*الو* sagt man, wenn man einen Anruf annimmt; *بفرمایین* bedeutet hier „schießen Sie los“ und nicht wie sonst „bitte, treten Sie ein“.'
  prs.a2.unit13.lesson04.teach.turn02:
    title: کریم stellt sich vor und meldet das Leck
    gloss: Er grüßt, sagt, dass er کریم ist, und dass das Rohr in seiner Küche tropft.
    note: '*استم* ist die Form von „sein“ für „ich bin“: *من کریم استم* heißt „Ich bin کریم“.'
  prs.a2.unit13.lesson04.teach.turn03:
    title: Der Vermieter fragt, seit wann es so ist
    gloss: Der Vermieter fragt, seit wann es angefangen hat.
    note: '*از کی شروع شده؟* fragt „Seit wann hat es angefangen?“.'
  prs.a2.unit13.lesson04.teach.turn04:
    title: کریم antwortet und betont die Dringlichkeit
    gloss: Seit gestern Abend. Es muss so bald wie möglich repariert werden.
    note: '*دیشب* bedeutet „gestern Abend“ oder „letzte Nacht“.'
  prs.a2.unit13.lesson04.teach.turn05:
    title: Der Vermieter vereinbart eine Uhrzeit
    gloss: In Ordnung, ich schicke morgen um neun Uhr einen Handwerker.
    note: '*باشد* bedeutet „in Ordnung“ oder „gut“.'
  prs.a2.unit13.lesson04.teach.turn06:
    title: کریم bedankt sich und meldet ein zweites Problem
    gloss: Er bedankt sich beim Vermieter und sagt, dass auch der Strom in seinem Schlafzimmer nicht funktioniert.
    note: '*هم* bedeutet hier „auch“ und fügt das zweite Problem hinzu.'
  prs.a2.unit13.lesson04.teach.turn07:
    title: Der Vermieter sagt zu, es weiterzugeben
    gloss: Der Vermieter sagt, dass er dem Handwerker auch das mitteilen wird.
    note: '*آن را هم به کارگر می‌گویم* – „Das sage ich dem Handwerker auch“ – bezieht sich auf das Stromproblem.'
exercises:
  prs.a2.unit13.lesson01.exercise01.recognize_malfunction:
    instruction: Was bedeutet dieses Wort?
    correct_option: Defekt / Schaden
    distractors:
    - Rohr
    - Strom
    - Reparatur
    accepted_answers:
    - value: Defekt / Schaden
      status: correct
    feedback: '*خرابی* bedeutet Defekt oder Schaden.'
  prs.a2.unit13.lesson01.exercise02.recognize_pipe:
    instruction: Was bedeutet dieses Wort?
    correct_option: Rohr
    distractors:
    - Strom
    - Leck
    - Handwerker
    accepted_answers:
    - value: Rohr
      status: correct
    feedback: '*لوله* bedeutet Rohr.'
  prs.a2.unit13.lesson01.exercise03.match_maintenance_words:
    instruction: Ordnen Sie jedem Wort seine Bedeutung zu.
    accepted_answers:
    - value:
        خرابی: Defekt
        لوله: Rohr
        برق: Strom
        چکه: Leck
        تعمیر: Reparatur
        کارگر: Handwerker
      status: correct
    feedback: Diese sechs Wörter bilden den Grundwortschatz für das Haushaltsproblem dieser Lektion.
    pairs:
    - left: خرابی
      right: Defekt
    - left: لوله
      right: Rohr
    - left: برق
      right: Strom
    - left: چکه
      right: Leck
    - left: تعمیر
      right: Reparatur
    - left: کارگر
      right: Handwerker
  prs.a2.unit13.lesson01.exercise04.order_asap:
    instruction: Ordnen Sie die Wörter so, dass sie „so bald wie möglich“ ergeben.
    accepted_answers:
    - value:
      - هر
      - چه
      - زودتر
      status: correct
    feedback: '*هر چه زودتر* bedeutet „so bald wie möglich“.'
  prs.a2.unit13.lesson01.exercise05.write_repairman:
    instruction: Schreiben Sie das Dari-Wort für „Handwerker“.
    accepted_answers:
    - value: کارگر
      status: correct
    feedback: '*کارگر* bedeutet Handwerker.'
  prs.a2.unit13.lesson02.exercise01.recognize_pipe_leaking_asap:
    instruction: Welcher Satz meldet ein tropfendes Küchenrohr, das dringend repariert werden muss?
    correct_option: Das Rohr in meiner Küche tropft und muss so bald wie möglich repariert werden.
    distractors:
    - Wann können Sie einen Handwerker schicken?
    - In meinem Schlafzimmer funktioniert der Strom nicht.
    - Rohrreparaturen sind kostenlos.
    accepted_answers:
    - value: Das Rohr in meiner Küche tropft und muss so bald wie möglich repariert werden.
      status: correct
    feedback: '*لولهٔ آشپزخانه‌ام چکه می‌کند و باید هر چه زودتر تعمیر شود.* meldet sowohl das Problem als auch die Dringlichkeit.'
  prs.a2.unit13.lesson02.exercise02.order_bedroom_electricity:
    instruction: Ordnen Sie die Wörter so, dass sie sagen, dass der Strom in Ihrem Schlafzimmer nicht funktioniert.
    accepted_answers:
    - value:
      - برق
      - اتاق
      - خوابم
      - کار
      - نمی‌کند
      status: correct
    feedback: '*برق اتاق خوابم کار نمی‌کند.* meldet das zweite Problem.'
  prs.a2.unit13.lesson02.exercise03.dialogue_response_what_problem:
    instruction: 'Der Vermieter fragt: „Welches Problem haben Sie?“ Melden Sie Ihr tropfendes Küchenrohr und die Dringlichkeit.'
    accepted_answers:
    - value: لولهٔ آشپزخانه‌ام چکه می‌کند و باید هر چه زودتر تعمیر شود.
      status: correct
    - value: لولهٔ آشپزخانه‌ام چکه می‌کند. باید هر چه زودتر تعمیر شود.
      status: correct
    - value: لولهٔ آشپزخانه‌ام چکه می‌کند، باید هر چه زودتر تعمیر شود.
      status: correct
    feedback: Ob Sie Meldung und Dringlichkeit mit *و*, mit einem Punkt oder mit einem Komma verbinden, ist gleichermaßen natürlich.
  prs.a2.unit13.lesson02.exercise04.translate_when_send_worker:
