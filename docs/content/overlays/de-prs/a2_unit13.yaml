    - nächste Woche
    - morgen um zehn
    accepted_answers:
    - value: morgen um neun
      status: correct
    feedback: '*فردا ساعت نه کارگر را می‌فرستم* -- morgen um neun.'
  prs.a2.unit13.lesson04.exercise03.recognize_second_problem:
    instruction: Welches zweite Problem meldet کریم?
    correct_option: Der Strom in seinem Schlafzimmer funktioniert nicht.
    distractors:
    - Die Küchenspüle ist kaputt.
    - Die Tür lässt sich nicht abschließen.
    - Die Heizung funktioniert nicht.
    accepted_answers:
    - value: Der Strom in seinem Schlafzimmer funktioniert nicht.
      status: correct
    feedback: '*برق اتاق خوابم هم کار نمی‌کند* -- Der Strom in seinem Schlafzimmer funktioniert auch nicht.'
  prs.a2.unit13.lesson04.exercise04.order_pipe_leaking:
    instruction: Ordnen Sie die Wörter so, dass Ihr Küchenrohr tropft.
    accepted_answers:
    - value:
