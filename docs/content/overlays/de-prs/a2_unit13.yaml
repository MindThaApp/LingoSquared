    - value: کی می‌توانین کارگر بفرستین
      status: correct
    feedback: '*کی می‌توانین کارگر بفرستین؟* fragt, wann ein Handwerker kommen kann.'
  prs.a2.unit13.lesson02.exercise05.write_bedroom_electricity:
    instruction: Schreiben Sie, dass der Strom in Ihrem Schlafzimmer nicht funktioniert.
    accepted_answers:
    - value: برق اتاق خوابم کار نمی‌کند.
      status: correct
    - value: برق اتاق خوابم کار نمی‌کند
      status: correct
    feedback: '*برق اتاق خوابم کار نمی‌کند.* meldet das zweite Problem.'
  prs.a2.unit13.lesson03.exercise01.read_worker_day:
    instruction: An welchem Tag und um welche Uhrzeit kommt laut der Mitteilung der Handwerker?
    correct_option: Donnerstag um zehn Uhr
    distractors:
    - Mittwoch um zehn Uhr
    - Donnerstag um neun Uhr
    - Freitag um zehn Uhr
    accepted_answers:
    - value: Donnerstag um zehn Uhr
      status: correct
    feedback: '*کارگر تعمیرات روز پنج‌شنبه ساعت ده می‌آید* -- Donnerstag um zehn Uhr.'
  prs.a2.unit13.lesson03.exercise02.read_which_repair_free:
    instruction: Welche Reparatur ist laut Aushang kostenlos?
    correct_option: die Rohrreparatur
    distractors:
    - die Elektroreparatur
    - beide Reparaturen
    - keine der beiden Reparaturen
    accepted_answers:
    - value: die Rohrreparatur
      status: correct
    feedback: '*تعمیر لوله رایگان است* -- die Rohrreparatur ist kostenlos.'
  prs.a2.unit13.lesson03.exercise03.recognize_cost_word:
    instruction: Was bedeutet dieses Wort?
    correct_option: Kosten / Gebühr
    distractors:
    - kostenlos
    - Defekt
    - Leck
    accepted_answers:
    - value: Kosten / Gebühr
      status: correct
    feedback: '*هزینه* bedeutet Kosten oder Gebühr.'
  prs.a2.unit13.lesson03.exercise04.order_worker_day:
    instruction: Ordnen Sie die Wörter so, dass der Wartungsarbeiter am Donnerstag um zehn Uhr kommt.
    accepted_answers:
    - value:
      - کارگر
      - تعمیرات
      - روز
      - پنج‌شنبه
      - ساعت
      - ده
      - می‌آید
      status: correct
    feedback: '*کارگر تعمیرات روز پنج‌شنبه ساعت ده می‌آید* entspricht genau dem Aushang.'
  prs.a2.unit13.lesson03.exercise05.write_electricity_has_cost:
    instruction: Schreiben Sie, dass die Elektroreparatur Kosten verursacht.
    accepted_answers:
    - value: تعمیر برق هزینه دارد.
      status: correct
    - value: تعمیر برق هزینه دارد
      status: correct
    feedback: '*تعمیر برق هزینه دارد.* sagt, dass die Elektroreparatur Geld kostet.'
  prs.a2.unit13.lesson04.exercise01.comprehend_leak_since:
    instruction: Seit wann tropft das Rohr?
    correct_option: seit gestern Abend
    distractors:
