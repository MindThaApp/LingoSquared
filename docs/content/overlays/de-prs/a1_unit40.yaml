    title: Blutung
    gloss: Blutung
    note: خون‌ریزی bedeutet Blutung.
    example_gloss: Er/Sie blutet.
  prs.a1.unit40.lesson03.teach.injured_ambulance_phrase:
    title: Er/Sie ist verletzt! Ich brauche einen Krankenwagen!
    gloss: Er/Sie ist verletzt! Ich brauche einen Krankenwagen!
    note: Verbindet زخمی mit dem bereits gelernten امبولانس می‌خواهم.
  prs.a1.unit40.lesson03.teach.bleeding_come_quickly_phrase:
    title: Er/Sie blutet! Kommen Sie schnell!
    gloss: Er/Sie blutet! Kommen Sie schnell!
    note: Verbindet خون‌ریزی mit dem bereits gelernten زود بیایین.
  prs.a1.unit40.lesson04.teach.review_dialogue_words:
    title: 'Wiederholung: was, er/sie kommt, ich rufe an, vielen Dank'
    gloss: was / er/sie kommt / ich rufe an / vielen Dank
    note: چه, می‌آید, زنگ می‌زنم und تشکر زیاد sind Wiederholungswörter aus dem Notfalldialog.
    target_text: چه (was) / می‌آید (er/sie kommt) / زنگ می‌زنم (ich rufe an) / تشکر زیاد (vielen Dank)
  prs.a1.unit40.lesson04.teach.dialogue_line1:
    title: 'Homayoun: Zarmina, Hilfe! Hilfe!'
    gloss: Zarmina, Hilfe! Hilfe!
  prs.a1.unit40.lesson04.teach.dialogue_line2:
    title: 'Zarmina: Was?'
    gloss: Was?
  prs.a1.unit40.lesson04.teach.dialogue_line3:
    title: 'Homayoun: Er/Sie ist verletzt! Er/Sie blutet!'
    gloss: Er/Sie ist verletzt! Er/Sie blutet!
  prs.a1.unit40.lesson04.teach.dialogue_line4:
    title: 'Zarmina: Ich brauche einen Krankenwagen. Ich rufe an!'
    gloss: Ich brauche einen Krankenwagen. Ich rufe an!
  prs.a1.unit40.lesson04.teach.dialogue_line5:
    title: 'Homayoun: Vielen Dank!'
    gloss: Vielen Dank!
  prs.a1.unit40.lesson04.teach.dialogue_line6:
    title: 'Zarmina: Der Krankenwagen kommt schnell.'
    gloss: Der Krankenwagen kommt schnell.
  prs.a1.unit40.lesson05.teach.review_reading_words:
    title: 'Wiederholung: ein, Person, Stadt, er/sie macht, in'
    gloss: ein / Person / Stadt / er/sie macht / in
    note: یک, نفر, شهر, می‌کند und در sind Wiederholungswörter aus diesem Lesetext.
    target_text: یک (eins) / نفر (Person) / شهر (Stadt) / می‌کند (er/sie macht) / در (in/an)
  prs.a1.unit40.lesson05.teach.reading_passage:
    title: Lesetext über einen Notfall
    gloss: In der Stadt ist eine Person verletzt. Er/Sie blutet. Homayoun hilft. Ein Krankenwagen kommt.
  prs.a1.unit40.lesson06.teach.review_wrap_up_words:
    title: 'Wiederholung: Telefon, ich habe nicht, aber, Sie (formell)'
    gloss: Telefon / ich habe nicht / aber / Sie (formell)
    note: تلفن, ندارم, اما und شما sind Wiederholungswörter, mit denen man ein Bedürfnis einer Einschränkung gegenüberstellt und höflich eine Frage stellt.
    target_text: تلفن (Telefon) / ندارم (ich habe nicht) / اما (aber) / شما (Sie, höflich)
  prs.a1.unit40.lesson06.teach.contrast_phrase:
    title: Ich brauche Hilfe, aber ich habe kein Telefon
    gloss: Ich brauche Hilfe, aber ich habe kein Telefon.
    note: اما stellt das Bedürfnis nach Hilfe dem fehlenden Telefon gegenüber, mit dem man Hilfe rufen könnte.
  prs.a1.unit40.lesson06.teach.formal_question_phrase:
    title: Kannst du helfen?
    gloss: Können Sie helfen?
    note: Die höfliche Form mit شما, um direkt und respektvoll um Hilfe zu bitten.
