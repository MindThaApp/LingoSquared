course:
  title: Dari in Deutsch A1
  description: 'Dari für Anfänger (Kabul): Einen einfachen Notfall erkennen, um Hilfe bitten, angeben, ob Sie die Polizei, einen Krankenwagen oder die Feuerwehr brauchen, eine Verletzung beschreiben und einen kurzen Text zum Thema Notfall lesen.'
units:
  prs.a1.unit40.emergencies:
    title: Notfälle
    description: Einen einfachen Notfall erkennen, um Hilfe bitten und sagen, welche Hilfe nötig ist (Polizei, Krankenwagen oder Feuerwehr).
lessons:
  prs.a1.unit40.lesson01.emergency_types:
    title: Hilfe im Notfall
  prs.a1.unit40.lesson02.asking_for_help:
    title: Um Hilfe bitten
  prs.a1.unit40.lesson03.describing_the_emergency:
    title: Verletzt und blutend
  prs.a1.unit40.lesson04.emergency_dialogue:
    title: Notfalldialog
  prs.a1.unit40.lesson05.emergency_reading:
    title: 'Lesetext: Hilfe im Notfall'
  prs.a1.unit40.lesson06.wrap_up:
    title: Abschluss
teaching:
  prs.a1.unit40.lesson01.teach.review_help_want:
    title: 'Wiederholung: Hilfe, ich möchte'
    gloss: Hilfe / ich möchte
    note: کمک und می‌خواهم sind Wiederholungswörter, die in dieser Lektion immer wieder vorkommen, um zu sagen, welche Hilfe man braucht.
    target_text: کمک (Hilfe) / می‌خواهم (ich möchte)
  prs.a1.unit40.lesson01.teach.review_this_is:
    title: 'Wiederholung: dies, ist'
    gloss: dies / ist
    note: این und است sind frühe Wiederholungswörter, mit denen man sagt, um was für eine Situation es sich handelt.
    target_text: این (dies) / است (ist)
  prs.a1.unit40.lesson01.teach.emergency_word:
    title: Notfall
    gloss: Notfall
    note: اضطراری bedeutet Notfall bzw. dringend.
    example_gloss: Das ist ein Notfall.
  prs.a1.unit40.lesson01.teach.police_word:
    title: Polizei
    gloss: Polizei
    note: پولیس ist das übliche afghanische Dari-Wort für Polizei (aus dem Englischen „police“ entlehnt).
    example_gloss: Ich brauche die Polizei.
  prs.a1.unit40.lesson01.teach.ambulance_word:
    title: Krankenwagen
    gloss: der Krankenwagen
    note: امبولانس bedeutet Krankenwagen.
    example_gloss: Ich brauche einen Krankenwagen.
  prs.a1.unit40.lesson01.teach.fire_word:
    title: Feuer
    gloss: Brand
    note: آتش bedeutet Feuer.
    example_gloss: Es brennt.
  prs.a1.unit40.lesson01.teach.fire_brigade_word:
    title: Feuerwehr
    gloss: Feuerwehr
    note: اطفائیه ist das in Kabul übliche Alltagswort für die Feuerwehr.
    example_gloss: Ich brauche die Feuerwehr.
  prs.a1.unit40.lesson01.teach.emergency_help_phrase:
    title: Das ist ein Notfall! Ich brauche die Polizei!
    gloss: Das ist ein Notfall! Ich brauche die Polizei!
    note: این اضطراری است verbindet این (dies) mit اضطراری (Notfall) und است (ist).
  prs.a1.unit40.lesson02.teach.review_can_you_do:
    title: 'Wiederholung: können Sie, tun Sie (höflicher Imperativ), zu/für, schnell'
    gloss: können Sie / tun Sie / zu/für / schnell
    note: می‌توانین, کنین, به und زود (aus früheren Lektionen) werden mit anderen Wörtern zu höflichen Bitten und Aufforderungen kombiniert.
    target_text: می‌توانین (können Sie) / کنین (machen Sie – höfliche Aufforderung) / به (zu/für) / زود (schnell)
  prs.a1.unit40.lesson02.teach.mera_word:
    title: Mich
    gloss: mich
    note: 'مه ره ist gesprochenes Kabuli-Dari für مرا („mich“ als Objekt): مه ist die gesprochene Form von من, und ره ist die gesprochene Form der Objektmarkierung را. Geschrieben sehen Sie meist مرا; das wird ebenfalls akzeptiert.'
    example_gloss: Kannst du mir helfen?
  prs.a1.unit40.lesson02.teach.can_you_help_me_phrase:
    title: Können Sie mir helfen?
    gloss: Können Sie mir helfen?
    note: Eine echte, häufig gebrauchte Dari-Wendung, um direkt um Hilfe zu bitten.
  prs.a1.unit40.lesson02.teach.call_word:
    title: Rufen Sie an! (Imperativ)
    gloss: rufen Sie an
    note: زنگ بزنین ist die höfliche Imperativform von زنگ زدن (anrufen) und baut auf dem bereits gelernten زنگ می‌زنم (ich rufe an) auf.
    example_gloss: Rufen Sie die Polizei!
  prs.a1.unit40.lesson02.teach.come_word:
    title: Kommen Sie! (Imperativ)
    gloss: kommen Sie
    note: بیایین ist die höfliche Imperativform von آمدن (kommen).
    example_gloss: Kommen Sie schnell!
  prs.a1.unit40.lesson02.teach.call_ambulance_phrase:
    title: Rufen Sie den Krankenwagen!
    gloss: Rufen Sie den Krankenwagen!
    note: به (zu/für) plus امبولانس (Krankenwagen) plus der Imperativ زنگ بزنین.
  prs.a1.unit40.lesson03.teach.review_he_she_has:
    title: 'Wiederholung: er/sie, er/sie hat'
    gloss: er/sie / er/sie hat
    note: او und دارد sind Wiederholungsformen, mit denen man in einem Notfall den Zustand einer anderen Person beschreibt.
    target_text: او (er/sie) / دارد (er/sie hat)
  prs.a1.unit40.lesson03.teach.injured_word:
    title: Verletzt
    gloss: verletzt
    note: زخمی bedeutet verletzt.
    example_gloss: Er/Sie ist verletzt.
