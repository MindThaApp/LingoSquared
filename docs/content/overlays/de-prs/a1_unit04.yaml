  prs.a1.unit04.lesson06.numbers_exchange_dialogue:
    title: Zwei Freunde vergleichen Alter und Telefonnummern
teaching:
  prs.a1.unit04.lesson01.teach.one_to_three:
    title: Eins, zwei, drei
    gloss: 1, 2, 3
    note: یک، دو، سه sind die grundlegenden persischen Zahlwörter, die im Dari und im Farsi gleich sind.
    example_gloss:
    - Ich habe einen Bruder.
    - Ich habe zwei Bücher.
    - Ich habe drei Schwestern.
  prs.a1.unit04.lesson01.teach.four_to_six:
    title: Vier, fünf, sechs
    gloss: 4, 5, 6
    note: چهار ist die schriftsprachliche Standardform; manche Sprecher kürzen sie in der Umgangssprache zu چار, aber dieser Kurs verwendet die Standardschreibweise.
    example_gloss:
    - Ich habe vier Bücher.
    - Warten Sie fünf Minuten.
    - Er/Sie hat sechs Bücher.
  prs.a1.unit04.lesson01.teach.seven_eight:
    title: Sieben, acht
    gloss: 7, 8
    note: هفت، هشت setzen die Zahlenreihe fort.
    example_gloss:
    - Eine Woche hat sieben Tage.
    - Ich komme um acht Uhr.
  prs.a1.unit04.lesson01.teach.nine_ten:
    title: Neun, zehn
    gloss: 9, 10
    note: نه، ده vervollständigen die Zahlen von eins bis zehn.
    example_gloss:
    - Es sind neun Personen im Kurs.
    - Ich habe zehn Finger.
  prs.a1.unit04.lesson02.teach.eleven_thirteen:
    title: Elf, zwölf, dreizehn
    gloss: 11, 12, 13
    note: یازده، دوازده، سیزده sind eigene Wörter und keine einfachen Zusammensetzungen aus den Einern.
    example_gloss:
    - Ich habe um elf Uhr Unterricht.
    - Ein Jahr hat zwölf Monate.
    - Er/Sie ist dreizehn Jahre alt.
  prs.a1.unit04.lesson02.teach.fourteen_sixteen:
    title: Vierzehn, fünfzehn, sechzehn
    gloss: 14, 15, 16
    note: چهارده، پانزده، شانزده setzen die Zahlen von dreizehn bis neunzehn fort.
    example_gloss:
    - Ich komme in vierzehn Tagen.
    - Er/Sie hat fünfzehn Bücher.
    - Er/Sie ist sechzehn Jahre alt.
  prs.a1.unit04.lesson02.teach.seventeen_nineteen:
    title: Siebzehn, achtzehn, neunzehn
    gloss: 17, 18, 19
    note: هفده، هجده، نوزده vervollständigen die Zahlen von dreizehn bis neunzehn.
    example_gloss:
    - Er/Sie hat siebzehn Bücher.
    - Er/Sie ist achtzehn Jahre alt.
    - Es bleiben neunzehn Tage.
  prs.a1.unit04.lesson02.teach.twenty:
    title: Zwanzig
    gloss: '20'
    note: بیست eröffnet die Zehner, die in der nächsten Lektion ausführlich behandelt werden.
    example_gloss: Ich habe zwanzig Bücher.
  prs.a1.unit04.lesson03.teach.twenty_thirty_forty:
    title: Zwanzig, dreißig, vierzig
    gloss: 20, 30, 40
    note: بیست، سی، چهل sind die Zehnerwörter; jedes ist eine eigene Form und folgt keinem vorhersagbaren Muster.
    example_gloss:
    - Ich bin zwanzig Jahre alt.
    - Dieser Monat hat dreißig Tage.
    - Er/Sie ist vierzig Jahre alt.
  prs.a1.unit04.lesson03.teach.fifty_sixty:
    title: Fünfzig, sechzig
    gloss: 50, 60
    note: پنجاه، شصت setzen die Zehner fort.
    example_gloss:
    - Er/Sie hat fünfzig Bücher.
    - Sechzig Minuten sind eine Stunde.
  prs.a1.unit04.lesson03.teach.seventy_eighty:
    title: Siebzig, achtzig
    gloss: 70, 80
    note: هفتاد، هشتاد setzen die Zehner fort.
    example_gloss:
    - Dieses Buch hat siebzig Seiten.
    - Er/Sie hat achtzig Bücher.
  prs.a1.unit04.lesson03.teach.ninety_hundred:
    title: Neunzig, hundert
    gloss: 90, 100
    note: نود und صد vervollständigen die Zahlenreihe bis hundert.
    example_gloss:
    - Er/Sie ist neunzig Jahre alt.
    - Er/Sie hat hundert Bücher.
  prs.a1.unit04.lesson03.teach.combining_tens:
    title: Zehner und Einer verbinden
    gloss: 25 heißt wörtlich „zwanzig und fünf“.
    note: Ein Zehnerwort und ein Einerwort werden mit و (und) verbunden, demselben Bindewort, das auch sonst in diesem Kurs vorkommt, z. B. in بیست و پنج (25). Im Deutschen kennen Sie das von „fünfundzwanzig“, nur steht dort die Einerzahl vorn.
  prs.a1.unit04.lesson04.teach.chand:
    title: Wie viele / wie viel
    gloss: wie viele / wie viel
    note: چند leitet eine Frage nach einer Menge ein, auch nach dem Alter.
    example_gloss: Wie alt sind Sie?
  prs.a1.unit04.lesson04.teach.sal_word:
    title: Jahr
    gloss: Jahr
    note: سال wird bei der Altersangabe verwendet, wörtlich „Jahre“.
    example_gloss: Ich bin zwanzig Jahre alt.
  prs.a1.unit04.lesson04.teach.age_question_polite:
    title: Höflich nach dem Alter fragen
    gloss: Wie alt bist du?
    note: چند ساله استین؟ fragt wörtlich „Wie viele Jahre alt sind Sie?“ und verwendet die respektvolle Form استین für jemanden, den man nicht gut kennt.
  prs.a1.unit04.lesson04.teach.age_question_informal:
    title: Nach dem Alter eines engen Freundes fragen
    gloss: Wie alt bist du?
    note: چند ساله استی؟ verwendet die informelle Form استی; sie ist engen Freunden oder Gleichaltrigen vorbehalten, nach derselben Regel für das Sprachniveau wie sonst in diesem Kurs.
  prs.a1.unit04.lesson04.teach.age_answer:
    title: Das eigene Alter nennen
    gloss: Ich bin 25 Jahre alt.
    note: بیست و پنج ساله استم setzt sich aus der Zahl, ساله („Jahre alt“) und استم zusammen.
  prs.a1.unit04.lesson05.teach.number_word:
    title: Zahl
    gloss: Nummer
    note: نمبر ist ein weit verbreitetes Alltagswort in Afghanistan (aus dem Persischen/Englischen) für „Nummer“, besonders für die Telefonnummer.
    example_gloss: Das ist meine Telefonnummer.
  prs.a1.unit04.lesson05.teach.telephone_word:
    title: Telefon
    gloss: Telefon
    note: تلفن ist das übliche Wort für „Telefon“.
    example_gloss: Mein Telefon ist kaputt.
  prs.a1.unit04.lesson05.teach.phone_question:
    title: Nach einer Telefonnummer fragen
    gloss: Wie ist deine Telefonnummer?
    note: نمبر تلفن‌تان چند است؟ verwendet dasselbe چند-Muster wie die Frage nach dem Alter, hier für eine Telefonnummer.
  prs.a1.unit04.lesson05.teach.zero_word:
    title: 'Null'
    gloss: 'null'
    note: صفر braucht man, um die meisten afghanischen Telefonnummern vorzulesen.
    example_gloss: Null ist eine Zahl.
  prs.a1.unit04.lesson05.teach.phone_answer:
    title: Die eigene Telefonnummer nennen
    gloss: Meine Telefonnummer ist 079-345-678.
    note: Afghanische Telefonnummern werden meist in kurzen Gruppen vorgelesen und nicht Ziffer für Ziffer, wie hier gezeigt.
  prs.a1.unit04.lesson06.teach.turn01:
    title: Homayoun begrüßt Bashir
    gloss: Homayoun fragt Bashir, wie es ihm geht, in der informellen Anrede, die unter engen Freunden passt.
    note: جور استی؟ zeigt, dass die beiden schon enge Freunde sind; deshalb passt im ganzen Dialog die informelle Anrede.
  prs.a1.unit04.lesson06.teach.turn02:
    title: Bashir antwortet und fragt Homayoun nach dem Alter
    gloss: Bashir sagt, dass es ihm gut geht, und fragt, wie alt Homayoun ist.
    note: چند ساله استی؟ verwendet die informelle Anrede, passend zu ihrer Freundschaft.
  prs.a1.unit04.lesson06.teach.turn03:
    title: Homayoun antwortet und stellt die Frage zurück
    gloss: Homayoun sagt, dass er 28 ist, und stellt Bashir dieselbe Frage.
    note: Das Muster für die Altersangabe aus Lektion 4 wird direkt wiederverwendet.
  prs.a1.unit04.lesson06.teach.turn04:
    title: Bashir antwortet
    gloss: Bashir sagt, dass er 26 ist.
    note: Damit ist der Austausch über das Alter abgeschlossen.
  prs.a1.unit04.lesson06.teach.turn05:
    title: Homayoun fragt nach Bashirs Telefonnummer
    gloss: Homayoun fragt nach Bashirs Telefonnummer.
    note: تلفنت verwendet die informelle Possessivendung, passend zum Sprachniveau des restlichen Dialogs.
  prs.a1.unit04.lesson06.teach.turn06:
    title: Bashir nennt seine Telefonnummer
    gloss: Bashir liest seine Telefonnummer in Gruppen vor.
    note: Die Nummer wird auf dieselbe natürliche, gruppierte Weise vorgelesen wie im Beispiel in Lektion 5.
  prs.a1.unit04.lesson06.teach.turn07:
    title: Homayoun bestätigt, dass er die Nummer speichert
    gloss: Homayoun bedankt sich und sagt, dass er sie gleich speichert.
    note: سیف می‌کنم (vom englischen „save“) ist ein gängiges, umgangssprachliches Lehnwort aus der Technik in Afghanistan und passt zu diesem lockeren Gespräch unter Freunden. Im Deutschen sagt man ähnlich umgangssprachlich „abspeichern“ oder „seiven“.
