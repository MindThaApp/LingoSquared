course:
  title: Dari in Deutsch A1
  description: 'Dari (Afghanistan) für Anfänger: von eins bis hundert zählen, nach dem Alter fragen und es nennen sowie Telefonnummern austauschen.'
units:
  prs.a1.unit04.numbers:
    title: Zählen und Zahlen
lessons:
  prs.a1.unit04.lesson01.numbers_one_to_ten:
    title: Von eins bis zehn zählen
  prs.a1.unit04.lesson02.numbers_eleven_to_twenty:
    title: Von elf bis zwanzig zählen
  prs.a1.unit04.lesson03.tens:
    title: Die Zehner bis hundert
  prs.a1.unit04.lesson04.asking_age:
    title: Nach dem Alter fragen und es nennen
  prs.a1.unit04.lesson05.phone_numbers:
