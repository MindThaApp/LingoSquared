  prs.a1.unit44.lesson06.teach.waste_collection_day_phrase:
    title: Der Abholtag für Müll ist Dienstag
    gloss: Der Abholtag für Müll ist Dienstag.
    note: روز جمع‌آوری زباله سه‌شنبه است folgt demselben Muster für den Müll.
  prs.a1.unit44.lesson06.teach.contrast_schedule_phrase:
    title: Papier montags, aber Müll dienstags
    gloss: Der Abholtag für Papier ist Montag, aber der Abholtag für Müll ist Dienstag.
    note: اما stellt die beiden Abholtage einander gegenüber.
