course:
  title: Dari in Deutsch A1
  description: 'Dari für Anfänger (Kabul): Sortieren Sie Haushaltsmüll in die richtige Tonne, fragen Sie, in welche Tonne etwas gehört, und lesen Sie einen kurzen Abholplan mit zwei Einträgen. Sie sprechen über Müll, Papier, Plastik und Glas und besprechen mit einem Freund die Trennung in grüne und blaue Tonne.'
units:
  prs.a1.unit44.waste_disposal:
    title: Müll trennen
    description: Sortieren Sie Haushaltsmüll in die richtige Tonne, fragen Sie, in welche Tonne etwas gehört, und verstehen Sie einen einfachen Müllabholplan.
