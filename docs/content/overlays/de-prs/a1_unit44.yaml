    gloss: Ich werfe Glas nicht in die grüne Tonne.
    note: شیشه را در سطل سبز نمی‌اندازم nennt mit der Verneinung eine Trennregel.
  prs.a1.unit44.lesson03.teach.glass_blue_bin_action_phrase:
    title: Ich werfe Glas in die blaue Tonne
    gloss: Ich werfe Glas in die blaue Tonne.
    note: شیشه را در سطل آبی می‌اندازم nennt die richtige Handlung für Glas.
