    gloss: Montag / Dienstag / aber / Sie (formell)
    note: دوشنبه, سه‌شنبه, اما und شما sind Wiederholungswörter, mit denen ein Plan mit zwei Terminen formuliert wird.
    target_text: دوشنبه (Montag) / سه‌شنبه (Dienstag) / اما (aber) / شما (Sie, höflich)
