    title: 'Wiederholung: Sie werfen (formell)'
    gloss: Sie werfen / Sie tun hinein (formell)
    note: می‌اندازین ist die formelle Pluralform und erweitert die gleiche Endung -ین wie bei می‌خواهین/کنین.
    target_text: می‌اندازین (Sie werfen/legen, höflich)
