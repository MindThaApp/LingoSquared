    title: Abholung
    gloss: die Abholung / das Einsammeln
    note: جمع‌آوری bedeutet „Einsammeln“ oder „Abholung“ und wird für den Tag der Müllabfuhr verwendet, ähnlich wie im Deutschen „Müllabfuhr“ oder „Abholtag“.
    example_gloss: Der Abholtag ist Montag.
  prs.a1.unit44.lesson06.teach.paper_collection_day_phrase:
