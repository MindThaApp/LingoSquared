    target_text: می‌اندازد (er/sie wirft/legt)
  prs.a1.unit44.lesson05.teach.reading_passage:
    title: Lesetext über Wahid und den Müll
    gloss: Wahid wirft jeden Tag den Müll weg. Das Papier ist in der blauen Tonne. Das Plastik ist auch in der blauen Tonne. Der Müll ist in der grünen Tonne. Wahid ist glücklich.
