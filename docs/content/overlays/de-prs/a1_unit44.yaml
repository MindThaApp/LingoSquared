teaching:
  prs.a1.unit44.lesson01.teach.review_is_in:
    title: 'Wiederholung: sein, in'
    gloss: ist / in
    note: است und در (in diesem Kurs durchgehend verwendet) sind Wiederholungswörter, mit denen man sagt, wo etwas ist.
    target_text: است (ist) / در (in)
  prs.a1.unit44.lesson01.teach.review_colors:
    title: 'Wiederholung: Farbe, grün, blau'
    gloss: Farbe / grün / blau
    note: رنگ, سبز und آبی sind Wiederholungswörter, mit denen die beiden Mülltonnen benannt werden.
    target_text: رنگ (Farbe) / سبز (grün) / آبی (blau)
  prs.a1.unit44.lesson01.teach.bin_word:
    title: Mülleimer
    gloss: Eimer / Tonne
    note: سطل ist das alltägliche Dari-Wort für Mülleimer, Tonne oder Eimer.
    example_gloss: Der Eimer ist grün.
  prs.a1.unit44.lesson01.teach.waste_word:
    title: Müll / Abfall
    gloss: der Müll / der Abfall
    note: زباله bedeutet Haushaltsmüll oder Abfall.
    example_gloss: Der Müll ist in der Tonne.
  prs.a1.unit44.lesson01.teach.green_bin_phrase:
    title: Grüne Tonne
    gloss: die grüne Tonne
    note: سطل سبز setzt sich aus سطل (Tonne) und سبز (grün) zusammen.
  prs.a1.unit44.lesson01.teach.plastic_word:
    title: Plastik
    gloss: das Plastik
    note: پلاستیک ist ein gängiges Lehnwort, das in allen persischen Varietäten, auch im Dari, verwendet wird.
    example_gloss: Das Plastik ist in der blauen Tonne.
  prs.a1.unit44.lesson01.teach.waste_in_green_bin_phrase:
    title: Der Müll ist in der grünen Tonne
    gloss: Der Müll ist in der grünen Tonne.
    note: زباله در سطل سبز است setzt sich aus den Wörtern zusammen, die Sie früher in dieser Lektion gelernt haben.
  prs.a1.unit44.lesson02.teach.review_which_in_is:
    title: 'Wiederholung: welche/welcher, in, ist'
    gloss: welche(r) / in / ist
    note: کدام, در und است sind Wiederholungswörter, mit denen man fragt, in welche Tonne etwas gehört.
    target_text: کدام (welche/r/s) / در (in) / است (ist)
  prs.a1.unit44.lesson02.teach.paper_word:
    title: Papier
    gloss: Papier
    note: کاغذ ist das alltägliche dari Wort für Papier.
    example_gloss: Das Papier ist in der Tonne.
  prs.a1.unit44.lesson02.teach.glass_word:
    title: Glas
    gloss: das Glas
    note: شیشه ist das alltägliche dari Wort für Glas.
    example_gloss: Das Glas ist in der Tonne.
  prs.a1.unit44.lesson02.teach.blue_bin_phrase:
    title: Blaue Tonne
    gloss: die blaue Tonne
    note: سطل آبی setzt sich aus سطل (Tonne) und آبی (blau) zusammen und wird für Wertstoffe wie Papier, Plastik und Glas verwendet.
  prs.a1.unit44.lesson02.teach.ask_which_bin_paper_phrase:
    title: In welcher Tonne ist das Papier?
    gloss: In welcher Tonne ist das Papier?
    note: کاغذ در کدام سطل است؟ fragt, in welche Tonne etwas gehört.
  prs.a1.unit44.lesson02.teach.paper_blue_bin_phrase:
    title: Das Papier ist in der blauen Tonne
    gloss: Das Papier ist in der blauen Tonne.
    note: کاغذ در سطل آبی است beantwortet die Frage mit der richtigen Tonne.
  prs.a1.unit44.lesson02.teach.glass_blue_bin_phrase:
    title: Das Glas ist in der blauen Tonne
    gloss: Das Glas ist in der blauen Tonne.
    note: شیشه در سطل آبی است folgt demselben Muster wie der Satz mit Papier.
  prs.a1.unit44.lesson03.teach.review_object_marker_put:
    title: 'Wiederholung: Objektmarker, ich werfe'
    gloss: (Objektmarker) / ich werfe / ich tue
    note: 'را und می‌اندازم (aus Lektion 36, dort im Sinn von „ich gebe Salz hinzu“) sind Wiederholungswörter. انداختن deckt tatsächlich beides ab: „hinzufügen/hineintun“ und „werfen/wegwerfen“.'
    target_text: را (Objektmarker) / می‌اندازم (ich werfe/lege)
  prs.a1.unit44.lesson03.teach.away_word:
    title: Weg
    gloss: weg
    note: دور (weg) bildet zusammen mit می‌اندازم die übliche Konstruktion دور انداختن („wegwerfen“).
    example_gloss: Ich werfe es weg.
  prs.a1.unit44.lesson03.teach.throw_away_waste_phrase:
    title: Ich werfe den Müll weg
    gloss: Ich werfe den Müll weg.
    note: زباله را دور می‌اندازم setzt sich aus زباله را, دور und می‌اندازم zusammen.
  prs.a1.unit44.lesson03.teach.put_plastic_green_bin_phrase:
    title: Ich werfe das Plastik in die blaue Tonne
    gloss: Ich werfe das Plastik in die blaue Tonne.
    note: پلاستیک را در سطل آبی می‌اندازم verwendet می‌اندازم in der Bedeutung „hineinwerfen/hineintun“.
  prs.a1.unit44.lesson03.teach.put_paper_blue_bin_phrase:
    title: Ich werfe das Papier in die blaue Tonne
    gloss: Ich werfe das Papier in die blaue Tonne.
    note: کاغذ را در سطل آبی می‌اندازم folgt demselben Muster mit der blauen Tonne.
  prs.a1.unit44.lesson03.teach.review_negative_put:
    title: 'Wiederholung: ich werfe nicht'
    gloss: ich werfe nicht / ich tue nicht hinein
    note: نمی‌اندازم ist die regelmäßige Verneinung von می‌اندازم mit نمی-.
    target_text: نمی‌اندازم (ich werfe/lege nicht)
  prs.a1.unit44.lesson03.teach.not_glass_green_bin_phrase:
