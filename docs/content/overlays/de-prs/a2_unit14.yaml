course:
  title: Dari A2
  description: 'Afghanisches Dari für Fortgeschrittene auf unterem Niveau: ein einfaches Vorstellungsgespräch – Wortschatz, Erfahrung und Verfügbarkeit beschreiben, eine Stellenanzeige lesen und das Gespräch selbst.'
units:
  prs.a2.unit14.job_interview:
    title: Vorstellungsgespräch
lessons:
  prs.a2.unit14.lesson01.interview_vocabulary:
    title: Wörter für das Vorstellungsgespräch
  prs.a2.unit14.lesson02.describing_experience_and_availability:
    title: Erfahrung und Verfügbarkeit beschreiben
  prs.a2.unit14.lesson03.reading_a_job_posting:
