teaching:
  prs.a2.unit14.lesson01.teach.experience_word:
    title: Erfahrung
    gloss: Erfahrung
    note: '*تجربه* ist das allgemeine Wort für Berufserfahrung.'
    example_gloss: لیمه hat drei Jahre Erfahrung.
  prs.a2.unit14.lesson01.teach.skill_word:
    title: Fähigkeit
    gloss: Fähigkeit
    note: '*مهارت* ist eine Fähigkeit oder Fertigkeit.'
    example_gloss: Computerkenntnisse sind wichtig.
  prs.a2.unit14.lesson01.teach.salary_word:
    title: Gehalt
    gloss: Gehalt
    note: '*حقوق* bedeutet Gehalt oder Lohn.'
    example_gloss: Das Gehalt für diese Stelle beträgt 30.000 Afghani.
  prs.a2.unit14.lesson01.teach.position_word:
    title: Stelle / Aufgabe
    gloss: Stelle / Aufgabe
    note: '*وظیفه* ist ein allgemeines Wort für eine Arbeit oder Stelle, im Unterschied zum förmlicheren *بست* (eine offizielle freie Stelle).'
    example_gloss: Diese Stelle ist in einem Büro.
  prs.a2.unit14.lesson01.teach.resume_word:
    title: Lebenslauf
    gloss: Lebenslauf
    note: '*رزومه* ist ein Lehnwort (von „Résumé“) für den Lebenslauf.'
    example_gloss: Ich habe dem Interviewer meinen Lebenslauf geschickt.
  prs.a2.unit14.lesson01.teach.interview_word:
    title: Vorstellungsgespräch
    gloss: Vorstellungsgespräch
    note: '*مصاحبه* ist ein Vorstellungsgespräch.'
    example_gloss: لیمهs Vorstellungsgespräch ist morgen.
  prs.a2.unit14.lesson01.teach.how_many_years_grammar:
    title: Wie viele Jahre, mit چند سال
    gloss: Wie viele Jahre Erfahrung haben Sie?
    note: '*چند سال...؟* – ein Muster für Mengenfragen, um nach Jahren der Erfahrung zu fragen.'
    target_text: چند سال تجربه دارین؟ (Wie viele Jahre Erfahrung haben Sie?)
  prs.a2.unit14.lesson02.teach.three_years_experience:
    title: Die Jahre Ihrer Erfahrung nennen
    gloss: Ich habe drei Jahre Erfahrung in dieser Position.
    note: '*در این وظیفه* bedeutet „in dieser Position“.'
  prs.a2.unit14.lesson02.teach.can_start_next_week:
    title: Sagen, wann Sie anfangen können
    gloss: Ich kann ab nächster Woche anfangen.
    note: '*از هفتهٔ آینده* bedeutet „ab nächster Woche“; *می‌توانم* bedeutet „ich kann“.'
  prs.a2.unit14.lesson02.teach.ask_salary:
    title: Nach dem Gehalt fragen
    gloss: Wie hoch ist das Gehalt für diese Stelle?
    note: '*چقدر؟* fragt „wie viel?“.'
  prs.a2.unit14.lesson03.teach.vacancy_word:
    title: Freie Stelle / offizielle Position
    gloss: freie Stelle / offizielle Position
    note: '*بست* ist der afghanische Begriff in Stellenanzeigen für eine offizielle freie Stelle und förmlicher als *وظیفه*.'
    example_gloss: Diese freie Stelle ist in einem Büro.
  prs.a2.unit14.lesson03.teach.requirements_word:
    title: Anforderungen
    gloss: Anforderungen
    note: '*شرایط* nennt die Anforderungen oder Bedingungen für eine Stelle.'
    example_gloss: Die Anforderung für diese freie Stelle sind Computerkenntnisse.
  prs.a2.unit14.lesson03.teach.notice_text:
    title: Eine Stellenanzeige
    gloss: 'Für diese Stelle sind mindestens zwei Jahre Erfahrung erforderlich. Anforderungen: Computerkenntnisse und Englisch. Gehalt: 30.000 Afghani pro Monat.'
    note: Eine kurze, förmliche Stellenanzeige in dem Register, das diese Lektion vermittelt.
  prs.a2.unit14.lesson04.teach.turn01:
    title: Der Interviewer begrüßt لیمه
    gloss: Der Interviewer begrüßt sie und bittet sie, von ihrer Erfahrung zu erzählen.
    note: '*خوش آمدین* ist ein förmliches „Willkommen“.'
  prs.a2.unit14.lesson04.teach.turn02:
    title: لیمه nennt ihre Erfahrung
    gloss: Sie sagt, dass sie drei Jahre Erfahrung in dieser Position hat.
    note: Dieselbe Wendung wie zuvor, um die Jahre der Erfahrung zu nennen.
  prs.a2.unit14.lesson04.teach.turn03:
    title: Der Interviewer fragt nach den Fähigkeiten
    gloss: Der Interviewer fragt, welche Fähigkeiten sie hat.
    note: '*مهارت‌های شما چیست؟* – „Welche Fähigkeiten haben Sie?“'
  prs.a2.unit14.lesson04.teach.turn04:
    title: لیمه zählt ihre Fähigkeiten auf
    gloss: Sie hat Computerkenntnisse und Englischkenntnisse.
    note: Zwei Fähigkeiten werden mit *و* verbunden aufgezählt.
  prs.a2.unit14.lesson04.teach.turn05:
    title: Der Interviewer fragt nach dem Starttermin
    gloss: Der Interviewer fragt, ab wann sie anfangen kann.
    note: '*از کی می‌توانین شروع کنین؟* -- „Ab wann können Sie anfangen?“'
  prs.a2.unit14.lesson04.teach.turn06:
    title: لیمه antwortet und fragt nach dem Gehalt
    gloss: Sie kann ab nächster Woche anfangen und fragt, wie hoch das Gehalt für diese Stelle ist.
    note: Verbindet die Wendung für den Starttermin *از هفتهٔ آینده می‌توانم شروع کنم* mit der Frage nach dem Gehalt.
  prs.a2.unit14.lesson04.teach.turn07:
    title: Der Interviewer nennt das Gehalt
    gloss: 'Der Interviewer sagt: 30.000 Afghani pro Monat.'
    note: Das gilt auch für die Stellenanzeige, die Sie zuvor gelesen haben.
