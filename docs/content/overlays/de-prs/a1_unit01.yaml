course:
  title: Dari in Deutsch A1
  description: 'Dari (Afghanistan) für Anfänger: Sie lernen, die persisch-arabische Schrift zu lesen, die Alltagssprache der Afghanen zu verstehen, ausführliche Begrüßungen auszutauschen und ein respektvolles erstes Treffen an einem Arbeitsplatz in Kabul zu meistern.'
units:
  prs.a1.unit01.greetings:
    title: Begrüßungen und erste Begegnungen
lessons:
  prs.a1.unit01.lesson01.script_ramp:
    title: Die Buchstaben dieser Einheit lesen
  prs.a1.unit01.lesson02.everyday_greetings:
    title: Alltägliche Begrüßungen austauschen
  prs.a1.unit01.lesson03.time_and_farewells:
    title: Zu verschiedenen Tageszeiten grüßen und sich verabschieden
  prs.a1.unit01.lesson04.formal_informal_small_talk:
    title: Höflichen und lockeren Smalltalk führen
  prs.a1.unit01.lesson05.afghan_hospitality:
    title: Sich nach der Familie erkundigen und Gästen Respekt erweisen
  prs.a1.unit01.lesson06.first_meeting_dialogue:
    title: Den ersten Tag an einem Arbeitsplatz in Kabul beginnen
teaching:
  prs.a1.unit01.lesson01.teach.alef_be_te_dal:
    title: Die Buchstaben ا، ب، ت und د
    gloss: a/ā, b, t und d
    note: Dari wird von rechts nach links geschrieben. د verbindet sich nicht mit dem folgenden Buchstaben links.
  prs.a1.unit01.lesson01.teach.re_ze:
    title: Die Buchstaben ر und ز
    gloss: r und s (stimmhaft, wie in „Sonne“)
    note: Keiner der beiden Buchstaben verbindet sich mit dem folgenden Buchstaben.
  prs.a1.unit01.lesson01.teach.sin_shin_sad:
    title: Die Buchstaben س، ش und ص
    gloss: s, sch und s
    note: س und ص stehen im gewöhnlichen Dari beide für einen s-Laut; ش steht für sch.
  prs.a1.unit01.lesson01.teach.jim_che_he_khe:
    title: Die Buchstaben ج، چ، ح und خ
    gloss: dsch, tsch, h und ch
    note: چ ist tsch. خ ist der Laut, der meist als „kh“ umschrieben wird (wie das ch in „Bach“).
  prs.a1.unit01.lesson01.teach.ayn_ghayn_fe_qaf:
    title: Die Buchstaben ع، غ، ف und ق
    gloss: ʿ, gh, f und q
    note: Die genaue Aussprache von غ und ق ist unter Dari-Sprechern unterschiedlich; unterscheiden Sie beide in der Schreibweise sorgfältig.
  prs.a1.unit01.lesson01.teach.ke_gaf_lam_mim:
    title: Die Buchstaben ک، گ، ل und م
    gloss: k, g, l und m
    note: ک ist das persische Kaf; es ist die Form, die im Dari für k verwendet wird. ل und م verbinden sich mit den Buchstaben auf beiden Seiten.
  prs.a1.unit01.lesson01.teach.nun_vav_he_ye:
    title: Die Buchstaben ن، و، ه und ی
    gloss: n, w/v/o/u, h und j/langes i
    note: ی ist das persische Ye; es steht für j und für den langen Vokal ī. و kann ein Konsonant (w/v) oder ein langer Vokal (o/ū) sein.
  prs.a1.unit01.lesson01.teach.connected_salam:
    title: Ein zusammenhängendes Wort lesen
    gloss: hallo
    note: Die Buchstaben verbinden sich zu سلام. Kurze Vokale werden normalerweise nicht geschrieben.
    example_gloss: Hallo! Ich bin Karim.
  prs.a1.unit01.lesson02.teach.salam_alaikum:
    title: Ein respektvoller Alltagsgruß
    gloss: Friede sei mit Ihnen / Hallo
    note: سلام علیکم ist in Afghanistan weit verbreitet und passt sowohl für vertraute als auch für respektvolle Begegnungen.
  prs.a1.unit01.lesson02.teach.wa_alaikum_salam:
    title: Den Gruß erwidern
    gloss: Und Friede sei mit Ihnen
    note: وعلیکم سلام ist die übliche Antwort auf سلام علیکم. Formen mit السلام werden ebenfalls akzeptiert.
  prs.a1.unit01.lesson02.teach.salam:
    title: Ein kurzer Gruß
    gloss: hallo
    note: سلام ist ein vielseitig verwendbarer, kürzerer Gruß.
    example_gloss: Hallo, wie geht es Ihnen?
  prs.a1.unit01.lesson02.teach.khosh_amadeed:
    title: Willkommen
    gloss: willkommen
    note: خوش آمدین ist der respektvolle gesprochene Willkommensgruß, für eine einzelne Person oder für mehrere.
  prs.a1.unit01.lesson02.teach.tashakor:
    title: Danke
    gloss: danke
    note: تشکر ist in diesem Kurs die bevorzugte afghanische Dari-Form. ممنون und ممنونم werden ebenfalls verstanden, sind aber nachrangige Varianten.
    example_gloss: Vielen Dank.
  prs.a1.unit01.lesson02.teach.khahesh:
    title: Eine förmliche Antwort auf Dank
    gloss: bitte / gern geschehen
    note: خواهش می‌کنم ist eine höfliche Antwort, die im gesamten persischen Sprachraum üblich ist. Sie wird nicht als typisch afghanische Umgangssprache dargestellt.
  prs.a1.unit01.lesson02.teach.khoda_hafez:
    title: Verabschiedung
    gloss: auf Wiedersehen
    note: خدا حافظ ist ein gebräuchlicher Abschiedsgruß im afghanischen Dari und wird oft in zwei Wörtern geschrieben.
  prs.a1.unit01.lesson03.teach.sobh_bekheyr:
    title: Begrüßung am Morgen
    gloss: guten Morgen
    note: صبح بخیر wird am Morgen verwendet.
  prs.a1.unit01.lesson03.teach.rooz_bekheyr:
    title: Gruß für den Tag
    gloss: guten Tag
    note: روز بخیر ist ein höflicher Gruß für den Tag.
  prs.a1.unit01.lesson03.teach.asr_bekheyr:
    title: Gruß für den späteren Tag
    gloss: guten Nachmittag / guten Abend
    note: عصر بخیر passt zum späteren Teil des Tages.
  prs.a1.unit01.lesson03.teach.shab_bekheyr:
    title: Ausdruck für die Nacht
    gloss: gute Nacht
    note: شب بخیر beschließt üblicherweise einen Abend, statt eine gewöhnliche Begegnung am Tag zu eröffnen.
  prs.a1.unit01.lesson03.teach.rooz_khosh:
    title: Ein höflicher Abschied am Tag
    gloss: einen schönen Tag noch
    note: روز خوش ist ein höflicher, eher förmlicher Abschiedsgruß, der im gesamten persischen Sprachraum üblich ist, und keine ausgesprochen afghanische Alltagsformel.
  prs.a1.unit01.lesson03.teach.be_omide_didar:
    title: Bis zum nächsten Treffen
    gloss: auf ein baldiges Wiedersehen
    note: به امید دیدار ist ein herzlicher, aber respektvoller Abschiedsgruß.
  prs.a1.unit01.lesson04.teach.polite_question:
    title: Höflich fragen, wie es jemandem geht
    gloss: Wie geht es Ihnen?
    note: استین ist eine gebräuchliche höfliche gesprochene Form im afghanischen Dari und wird mit شما verwendet.
  prs.a1.unit01.lesson04.teach.informal_question:
    title: Einen Gleichaltrigen oder engen Freund fragen
    gloss: Wie geht es Ihnen?
    note: تو und استی sind informelle Singularformen; verwenden Sie diese Kombination nicht automatisch gegenüber Älteren oder neuen Bekanntschaften.
  prs.a1.unit01.lesson04.teach.good_answer:
    title: Sagen, dass es Ihnen gut geht
    gloss: Mir geht es gut, danke.
    note: استم bedeutet „ich bin“. Das ist die gesprochene afghanische Dari-Form, die in diesem Kurs durchgehend verwendet wird.
  prs.a1.unit01.lesson04.teach.jor_answer:
    title: Sagen, dass Sie gesund sind oder dass es Ihnen gut geht
    gloss: Mir geht es gut.
    note: جور bedeutet so viel wie wohlauf oder gesund sein und kommt in afghanischen Begrüßungen häufig vor.
  prs.a1.unit01.lesson04.teach.not_bad:
    title: Eine zurückhaltende Antwort
    gloss: Nicht schlecht.
    note: بد نیستم ist eine neutrale Antwort.
  prs.a1.unit01.lesson04.teach.and_you:
    title: Die Frage zurückgeben
    gloss: Und Sie?
    note: و شما؟ hält das Gespräch respektvoll und knapp.
  prs.a1.unit01.lesson04.teach.everyone_well:
    title: Die Begrüßung erweitern
    gloss: Geht es allen gut?
    note: Afghanische Begrüßungen können sich mit Fragen nach dem Haushalt fortsetzen, bevor das eigentliche Anliegen besprochen wird.
  prs.a1.unit01.lesson05.teach.family_well:
    title: Sich nach der Familie erkundigen
    gloss: Geht es Ihrer Familie gut?
    note: Die Frage nach der Familie gehört häufig zu einer ausführlichen afghanischen Begrüßung. Der Kurs schreibt die Possessivform als فامیل‌تان.
  prs.a1.unit01.lesson05.teach.household_well:
    title: Sich nach dem Haushalt erkundigen
    gloss: Geht es allen zu Hause gut?
    note: اهل خانه bezeichnet gemeinsam die Mitglieder des Haushalts.
  prs.a1.unit01.lesson05.teach.everyone_well:
    title: Auf die Frage nach der Familie antworten
    gloss: Gott sei Dank, allen geht es gut.
    note: شکر ist hier ein verkürzter Ausdruck des Dankes und nicht das Wort für „Zucker“ im Sinne des Lebensmittels.
  prs.a1.unit01.lesson05.teach.zenda_bashin:
    title: Eine herzliche, höfliche Antwort geben
    gloss: Mögen Sie lange leben / danke.
    note: زنده باشین ist eine gebräuchliche afghanische Höflichkeitsformel, die oft als Antwort auf Dank oder freundliche Worte gesagt wird. باشین ist die respektvolle gesprochene Form für „Sie“.
  prs.a1.unit01.lesson05.teach.own_home:
    title: Einen Gast herzlich willkommen heißen
    gloss: Fühlen Sie sich wie zu Hause.
    note: خانهٔ خودتان است versichert einem Gast, dass er willkommen ist.
  prs.a1.unit01.lesson05.teach.seat_of_honor:
    title: Den Ehrenplatz anbieten
    gloss: Bitte nehmen Sie auf dem Ehrenplatz Platz.
    note: In einem Gästezimmer lädt بالا بفرمایین den Gast zum ehrenvolleren Platz fern vom Eingang ein. Es bedeutet nicht unbedingt „nach oben“ im Sinne eines Stockwerks.
  prs.a1.unit01.lesson05.teach.elders_first:
    title: Zuerst die Älteren grüßen
    gloss: Wir grüßen zuerst die Älteren.
    note: Die Älteren zuerst zu grüßen drückt Respekt aus. Körperliche Begrüßungen hängen von Beziehung, Geschlecht und individuellen Signalen ab; Lernende sollten nicht davon ausgehen, dass ein Händedruck angemessen ist.
  prs.a1.unit01.lesson06.teach.daftar:
    title: Büro
    gloss: Büro
    note: دفتر bezeichnet ein Büro oder einen Arbeitsplatz.
    example_gloss: Mein Büro ist in Kabul.
  prs.a1.unit01.lesson06.teach.kabul:
    title: Kabul
    gloss: Kabul
    note: کابل ist die Hauptstadt Afghanistans und der Schauplatz dieses Dialogs.
    example_gloss: Ich wohne in Kabul.
  prs.a1.unit01.lesson06.teach.line01:
    title: Hamed stellt sich als neuer Kollege vor
    gloss: Hamed sagt, dass er der neue Kollege ist.
    note: Beide Sprecher sind erwachsene männliche Kollegen, die sich in einem Büro in Kabul treffen.
  prs.a1.unit01.lesson06.teach.line02:
    title: Najib heißt ihn willkommen und fragt nach seinem Namen
    gloss: Najib heißt ihn willkommen und fragt nach seinem Namen.
    note: خوش آمدین ist der höfliche gesprochene Willkommensgruß im Dari, geeignet für eine einzelne Person oder für mehrere.
  prs.a1.unit01.lesson06.teach.line03:
    title: Hamed nennt seinen Namen
    gloss: Hamed nennt seinen Namen.
    note: نامم حامد است (Mein Name ist Hamed) ist die alltägliche gesprochene Form; نامم besteht aus نام + -م (mein). In der Schrift begegnet Ihnen auch نام من حامد است. Beides ist korrekt.
  prs.a1.unit01.lesson06.teach.line04:
    title: Najib stellt sich vor und sagt, dass er sich freut, ihn kennenzulernen
    gloss: Najib stellt sich vor und sagt, dass er sich freut, ihn kennenzulernen.
    note: از آشنایی با شما خوش شدم bezieht sich ausdrücklich auf das Kennenlernen und passt deshalb zu einer ersten Begegnung.
  prs.a1.unit01.lesson06.teach.line05:
    title: Hamed erwidert die Freude und fragt, wie es Najib geht
    gloss: Hamed erwidert die Freude und fragt, wie es Najib geht.
    note: Der Austausch bleibt zwischen den neuen Kollegen beim respektvollen شما und استین.
  prs.a1.unit01.lesson06.teach.line06:
    title: Najib antwortet
    gloss: Najib sagt, dass es ihm gut geht, danke.
    note: جور استم، تشکر beantwortet die Frage nach dem Befinden, wie weiter vorn in dieser Lektion gelernt.
  prs.a1.unit01.lesson06.teach.line07:
    title: Najib fragt nach Hameds Familie
    gloss: Najib fragt nach Hameds Familie.
    note: Die Frage nach dem Haushalt erweitert die Begrüßung, bevor die beiden zur Arbeit übergehen.
  prs.a1.unit01.lesson06.teach.line08:
    title: Hamed sagt, dass es allen gut geht
    gloss: Hamed sagt, dass es allen gut geht.
    note: شکر، همه جور استند beantwortet die Frage nach der Familie, wie weiter vorn in dieser Lektion gelernt.
  prs.a1.unit01.lesson06.teach.line09:
    title: Najib bietet an, die anderen Kollegen vorzustellen
    gloss: Najib bietet an, die anderen Kollegen vorzustellen.
    note: بفرمایین lädt Hamed hier ein mitzukommen, nicht Platz zu nehmen oder sich etwas zu nehmen.
  prs.a1.unit01.lesson06.teach.line10:
    title: Hamed stimmt dankend zu
    gloss: Hamed stimmt dankend zu.
    note: بسیار خوب wird hier als klare zustimmende Antwort eingeführt.
  prs.a1.unit01.lesson06.teach.line11:
    title: Najib antwortet herzlich und zeigt Hamed seinen Schreibtisch
    gloss: Najib antwortet herzlich und zeigt Hamed seinen Schreibtisch.
    note: Der Dialog endet mit dem Beginn des Arbeitstages, nicht mit einer Verabschiedung wie bei einem Hausbesuch.
  prs.a1.unit01.lesson06.teach.line12:
    title: Hamed bedankt sich
    gloss: Hamed bedankt sich.
    note: تشکر beschließt das Gespräch auf einfache Weise.
