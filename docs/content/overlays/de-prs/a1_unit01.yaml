      - س
      - ل
      - ا
      - م
      status: correct
    feedback: س ل ا م ergibt سلام.
  prs.a1.unit01.lesson01.exercise06.recognize_salam:
    instruction: Wählen Sie das verbundene Wort, das „hallo“ bedeutet.
    correct_option: سلام
    distractors:
    - شلام
    - سلیم
    - سال
    accepted_answers:
    - value: سلام
      status: correct
    feedback: سلام bedeutet „hallo“.
    prompt_blocks:
    - Hallo
  prs.a1.unit01.lesson01.exercise07.rtl_direction:
    instruction: Wird Dari von rechts nach links geschrieben?
    options:
    - ja
    - nein
    accepted_answers:
    - value: ja
      status: correct
    feedback: Die Dari-Schrift verläuft von rechts nach links.
  prs.a1.unit01.lesson01.exercise08.copy_salam:
    instruction: Schreiben Sie سلام genau ab.
    accepted_answers:
    - value: سلام
      status: correct
    feedback: Die richtige Schreibweise ist سلام.
  prs.a1.unit01.lesson02.exercise01.recognize_greeting_reading:
    instruction: Was bedeutet dieser Ausdruck?
    correct_option: Hallo (Friede sei mit euch)
    distractors:
    - auf Wiedersehen
    - willkommen
    - danke
    accepted_answers:
    - value: Hallo (Friede sei mit euch)
      status: correct
    feedback: سلام علیکم bedeutet „hallo“ (wörtlich „Friede sei mit euch“).
  prs.a1.unit01.lesson02.exercise02.translate_response:
    instruction: 'Übersetzen Sie ins Dari: „Und Friede sei auch mit Ihnen“ (die übliche Antwort auf سلام علیکم).'
    accepted_answers:
    - value: وعلیکم سلام
      status: correct
    - value: و علیکم سلام
      status: acceptable_with_note
      note: Akzeptierte Variante mit anderer Schreibung der Abstände.
    - value: وعلیکم السلام
      status: acceptable_with_note
      note: Übliche ausführliche Antwortvariante.
    - value: و علیکم السلام
      status: acceptable_with_note
      note: Übliche ausführliche Antwort mit getrennt geschriebener Konjunktion.
    feedback: وعلیکم سلام ist die übliche Antwort; auch gebräuchliche ausführliche Formen mit السلام sind richtig.
  prs.a1.unit01.lesson02.exercise03.reply_greeting:
    instruction: Antworten Sie auf سلام علیکم.
    accepted_answers:
    - value: وعلیکم سلام
      status: correct
    - value: و علیکم سلام
      status: correct
    - value: وعلیکم السلام
      status: correct
    - value: و علیکم السلام
      status: correct
    - value: سلام
      status: acceptable_with_note
      note: Verständlich, aber weniger erwidernd als die vollständige Antwort.
    feedback: وعلیکم سلام und وعلیکم السلام sind übliche vollständige Antworten.
  prs.a1.unit01.lesson02.exercise04.welcome_meaning:
    instruction: Wählen Sie die Bedeutung von خوش آمدین.
    correct_option: willkommen
    distractors:
    - auf Wiedersehen
    - danke
    - gute Nacht
    accepted_answers:
    - value: willkommen
      status: correct
    feedback: خوش آمدین bedeutet „willkommen“.
  prs.a1.unit01.lesson02.exercise05.produce_thanks:
    instruction: 'Übersetzen Sie ins Dari: Danke.'
    accepted_answers:
    - value: تشکر
      status: correct
    - value: ممنون
      status: acceptable_with_note
      note: Wird im Dari verstanden; تشکر ist die bevorzugte Form in diesem Kurs.
    - value: ممنونم
      status: acceptable_with_note
      note: Wird im Dari verstanden; تشکر ist die bevorzugte Form in diesem Kurs.
    feedback: تشکر ist in diesem Kurs die bevorzugte afghanische Dari-Antwort.
  prs.a1.unit01.lesson02.exercise06.order_youre_welcome:
    instruction: Bilden Sie die förmliche, überregional gebräuchliche Wendung für „Bitte“ (als Antwort auf einen Dank).
    accepted_answers:
    - value:
      - خواهش
      - می‌کنم
      status: correct
    feedback: خواهش می‌کنم ist eine höfliche, überregional gebräuchliche Antwort auf einen Dank.
  prs.a1.unit01.lesson02.exercise07.goodbye_meaning:
    instruction: Wählen Sie die Bedeutung von خدا حافظ.
    correct_option: auf Wiedersehen
    distractors:
    - willkommen
    - hallo
    - danke
    accepted_answers:
    - value: auf Wiedersehen
      status: correct
