  prs.a1.unit37.lesson06.wrap_up:
    title: Zusammenfassung
teaching:
  prs.a1.unit37.lesson01.teach.mehraban_word:
    title: Nett
    gloss: nett
    note: مهربان ist das gebräuchliche Dari-Wort für einen freundlichen, warmherzigen Menschen.
    example_gloss: Er/Sie ist freundlich.
  prs.a1.unit37.lesson01.teach.zahmatkash_word:
    title: Fleißig
    gloss: fleißig
    note: زحمتکش bedeutet wörtlich „jemand, der Mühe auf sich nimmt“ – ein fleißiger Mensch.
    example_gloss: Er/Sie ist fleißig.
  prs.a1.unit37.lesson01.teach.bahosh_word:
    title: Klug
    gloss: klug / intelligent
    note: باهوش setzt sich aus با („mit“) und هوش („Intelligenz“) zusammen – ein kluger Mensch.
    example_gloss: Er/Sie ist klug.
  prs.a1.unit37.lesson01.teach.tambal_word:
    title: Faul
    gloss: faul
    note: تنبل bedeutet „faul“.
    example_gloss: Er/Sie ist faul.
  prs.a1.unit37.lesson01.teach.review_basics:
    title: 'Wiederholung: er/sie, ist, und, aber'
    gloss: er/sie / ist / und / aber
    note: او, است, و und اما werden in den Sätzen über Charaktereigenschaften dieser Lektion wiederholt verwendet.
    target_text: او (er/sie) / است (ist) / و (und) / اما (aber)
  prs.a1.unit37.lesson01.teach.kind_and_hardworking_phrase:
    title: Er/Sie ist freundlich und fleißig
    gloss: Er/Sie ist freundlich und fleißig.
    note: و verbindet die beiden Eigenschaften zu einem Satz.
  prs.a1.unit37.lesson01.teach.smart_but_lazy_phrase:
    title: Er/Sie ist klug, aber faul
    gloss: Er/Sie ist klug, aber faul.
    note: اما stellt zwei Eigenschaften in einem Satz einander gegenüber.
  prs.a1.unit37.lesson02.teach.shokh_word:
    title: Lustig
    gloss: lustig / verspielt
    note: شوخ beschreibt jemanden, der gern scherzt oder verspielt ist.
    example_gloss: Er/Sie ist lustig.
  prs.a1.unit37.lesson02.teach.kamharf_word:
    title: Wortkarg
    gloss: wortkarg / zurückhaltend
    note: کم‌حرف bedeutet wörtlich „wenig Worte“ – ein ruhiger, zurückhaltender Mensch.
    example_gloss: Er/Sie ist wortkarg.
  prs.a1.unit37.lesson02.teach.rastgoo_word:
    title: Ehrlich
    gloss: ehrlich
    note: راستگو setzt sich aus راست („wahr, gerade“) und گو („Sprecher“) zusammen – ein wahrhaftiger, ehrlicher Mensch.
    example_gloss: Er/Sie ist ehrlich.
  prs.a1.unit37.lesson02.teach.review_and_but:
    title: 'Wiederholung: und, aber'
    gloss: und / aber
    note: و und اما sind Wiederholungswörter, mit denen man Eigenschaften verbindet oder gegenüberstellt.
    target_text: و (und) / اما (aber)
  prs.a1.unit37.lesson02.teach.funny_and_honest_phrase:
    title: Er/Sie ist lustig und ehrlich
    gloss: Er/Sie ist lustig und ehrlich.
    note: Verbindet zwei positive Eigenschaften mit و.
  prs.a1.unit37.lesson02.teach.quiet_but_kind_phrase:
    title: Er/Sie ist wortkarg, aber freundlich
    gloss: Er/Sie ist wortkarg, aber freundlich.
    note: اما stellt eine zurückhaltende Eigenschaft einer herzlichen gegenüber.
  prs.a1.unit37.lesson03.teach.person_word:
    title: Mensch
    gloss: Mensch
    note: آدم ist ein gebräuchliches, geschlechtsneutrales Wort für einen Menschen.
    example_gloss: Er/Sie ist ein guter Mensch.
  prs.a1.unit37.lesson03.teach.review_how_because:
    title: 'Wiederholung: wie/was für ein, weil, Hilfe'
    gloss: wie, was für ein / weil / Hilfe
    note: چطور, چون und کمک sind Wiederholungswörter, mit denen man nach dem Charakter fragt und Gründe nennt.
    target_text: چطور (wie, was für) / چون (weil) / کمک (Hilfe)
  prs.a1.unit37.lesson03.teach.what_kind_person_question:
    title: Was für ein Mensch ist er/sie?
    gloss: Was für ein Mensch ist er/sie?
    note: او چطور آدم است؟ fragt wörtlich „Er/Sie ist wie (was für) Mensch?“ – so fragt man ganz natürlich, wie jemand ist.
  prs.a1.unit37.lesson03.teach.kind_because_helps_phrase:
    title: Er/Sie ist freundlich, weil er/sie hilft
    gloss: Er/Sie ist freundlich, weil er/sie hilft.
    note: چون leitet den Grund ein; کمک می‌کند bedeutet wörtlich „leistet Hilfe“.
  prs.a1.unit37.lesson03.teach.hardworking_because_works_phrase:
    title: Er/Sie ist fleißig, weil er/sie viel arbeitet
    gloss: Er/Sie ist fleißig, weil er/sie viel arbeitet.
    note: زیاد کار می‌کند bedeutet wörtlich „viel Arbeit macht“.
  prs.a1.unit37.lesson04.teach.review_dialogue_words:
    title: Ja / ein bisschen / immer
    gloss: ja / ein bisschen, etwas / immer
    note: بلی, کمی und همیشه sind Wiederholungswörter, die im Dialog über Persönlichkeit vorkommen.
    target_text: بلی (ja) / کمی (ein bisschen) / همیشه (immer)
  prs.a1.unit37.lesson04.teach.dialogue_line1:
    title: 'Homayoun: Zarmina, was für ein Mensch ist Karim?'
    gloss: Zarmina, was für ein Mensch ist Karim?
  prs.a1.unit37.lesson04.teach.dialogue_line2:
    title: 'Zarmina: Karim ist freundlich und fleißig.'
    gloss: Karim ist freundlich und fleißig.
  prs.a1.unit37.lesson04.teach.dialogue_line3:
    title: 'Homayoun: Ist er klug?'
    gloss: Ist er klug?
  prs.a1.unit37.lesson04.teach.dialogue_line4:
    title: 'Zarmina: Ja, er ist klug, aber ein bisschen wortkarg.'
    gloss: Ja, er ist klug, aber ein bisschen wortkarg.
  prs.a1.unit37.lesson04.teach.dialogue_line5:
    title: 'Homayoun: Ist er ehrlich?'
    gloss: Ist er ehrlich?
  prs.a1.unit37.lesson04.teach.dialogue_line6:
    title: 'Zarmina: Ja, er ist immer ehrlich.'
    gloss: Ja, er ist immer ehrlich.
  prs.a1.unit37.lesson05.teach.review_reading_words:
    title: Manchmal, alle, Objektmarker, sie mögen
    gloss: manchmal / alle / Objektmarker / sie mögen
    note: گاهی („manchmal“) und همه („alle“) kommen im Lesetext vor; را markiert ein bestimmtes direktes Objekt; دوست دارند ist die dritte Person Plural von دوست دارم („ich mag“).
    target_text: گاهی (manchmal) / همه (alle) / را (Objektmarker) / دوست دارند (sie mögen)
  prs.a1.unit37.lesson05.teach.reading_passage:
    title: Lesetext über Homayouns Persönlichkeit
    gloss: Homayoun ist freundlich und fleißig. Er ist klug, aber manchmal wortkarg. Er ist immer ehrlich. Alle mögen ihn.
  prs.a1.unit37.lesson06.teach.review_i_am_you_are:
    title: 'Wiederholung: ich bin, Sie sind (formell)'
    gloss: ich bin / Sie sind (formell)
    note: استم und استین sind die wiederholten Formen von „sein“ für „ich bin“ und „Sie sind“ (formell); sie kommen in den Sätzen dieser Abschlusslektion vor.
    target_text: استم (ich bin) / استین (Sie sind, formell)
  prs.a1.unit37.lesson06.teach.self_description_phrase:
    title: Ich bin freundlich, aber manchmal faul
    gloss: Ich bin freundlich, aber manchmal faul.
    note: من (ich) und استم (ich bin) ermöglichen es Ihnen, die eigene Persönlichkeit direkt zu beschreiben – nach demselben Muster mit او/است wie in der gesamten Lektion.
  prs.a1.unit37.lesson06.teach.formal_question_phrase:
    title: Was für ein Mensch sind Sie?
    gloss: Was für ein Mensch sind Sie?
    note: Ergänzt شما (Sie, höflich) und استین (Sie sind, höflich) in der bekannten Fragestruktur aus lesson03, jetzt direkt an die lernende Person gerichtet.
