course:
  title: Dari in Deutsch A1
  description: 'Dari für Anfänger (Kabul): Grundlegende Charaktereigenschaften benennen, fragen, wie jemand ist, einfache Gründe mit „weil“ angeben und den Charakter eines Menschen in einem kurzen Text beschreiben.'
units:
  prs.a1.unit37.personality:
    title: Persönlichkeit
    description: Beschreiben Sie grundlegende Charaktereigenschaften eines Menschen und fragen Sie, wie jemand ist.
