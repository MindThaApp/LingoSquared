course:
  title: Dari A2
  description: 'Dari (Afghanistan) für Fortgeschrittene auf dem Niveau A2: sagen, was man tun muss, nicht tun darf oder nicht tun muss, und fragen, ob etwas erlaubt ist. Regeln in einer Bibliothek, einem Schwimmbad und einem Fitnessstudio mit باید, نباید, لازم نیست, اجازه دارم und می‌توانم.'
units:
  prs.a2.unit29.rules_permission:
    title: Regeln und Erlaubnis
lessons:
  prs.a2.unit29.lesson01.must_and_places:
    title: Müssen und die Orte im Zentrum
  prs.a2.unit29.lesson02.must_not:
    title: 'Nicht dürfen: Regeln in der Bibliothek'
  prs.a2.unit29.lesson03.ask_permission:
    title: 'Fragen: Darf ich? Kann ich?'
  prs.a2.unit29.lesson04.no_need:
    title: 'Nicht nötig: Sie müssen nicht'
  prs.a2.unit29.lesson05.reading_and_listening:
    title: 'Lesen und Hören: Regeln'
  prs.a2.unit29.lesson06.gym_conversation:
    title: Ein Gespräch im Fitnessstudio und im Schwimmbad
teaching:
  prs.a2.unit29.lesson01.teach.library:
    title: Bibliothek
    gloss: Bibliothek
    note: '*کتابخانه* heißt Bibliothek. Wohin Sie gehen, drücken Sie mit *به* aus: *به کتابخانه می‌روم* heißt „Ich gehe in die Bibliothek“. In dieser Einheit geht es um die Regeln eines Gemeindezentrums mit Bibliothek, Schwimmbad und Fitnessstudio.'
    example_gloss: Die Bibliothek ist in der Nähe meines Hauses.
  prs.a2.unit29.lesson01.teach.pool:
    title: Schwimmbad
    gloss: Schwimmbad
    note: '*حوض آب‌بازی* heißt Schwimmbad. Es ist das Wort aus der Einheit zum Schwimmbad.'
    example_gloss: Ich gehe jede Woche ins Schwimmbad.
  prs.a2.unit29.lesson01.teach.gym:
    title: Fitnessstudio
    gloss: Fitnessstudio, Sportverein
    note: '*باشگاه* heißt Fitnessstudio oder Sportverein. Es ist das Wort aus der Einheit zum Fitnessstudio.'
    example_gloss: Das Fitnessstudio ist um sechs Uhr geöffnet.
  prs.a2.unit29.lesson01.teach.rules:
    title: Regeln
    gloss: 'Regeln (Singular: Regel, Gesetz)'
    note: '*قانون* heißt Regel, und *قانون‌ها* heißt Regeln. Der Ort folgt danach mit der Ezafe *-ی*: *قانون‌های کتابخانه* sind die Regeln der Bibliothek. Die Pluralendung wird mit einem Halbleerzeichen als eigener kleiner Teil hinter das Nomen geschrieben.'
    example_gloss: Die Regeln des Fitnessstudios hängen im Büro.
  prs.a2.unit29.lesson01.teach.membership:
    title: Mitgliedskarte
    gloss: Mitgliedskarte
    note: '*کارت عضویت* heißt Mitgliedskarte, die Karte, mit der Sie Bücher ausleihen oder ein Fitnessstudio nutzen können. *کارت* kennen Sie schon.'
    example_gloss: Meine Mitgliedskarte ist zu Hause.
  prs.a2.unit29.lesson01.teach.sports_shoes:
    title: Sportschuhe
    gloss: Sportschuhe, Turnschuhe
    note: '*کفش* ist der Schuh, und *ورزشی* bedeutet „für den Sport“ und kommt von *ورزش*. *کفش ورزشی* sind also Sportschuhe.'
    example_gloss: Meine Sportschuhe sind neu.
  prs.a2.unit29.lesson01.teach.must:
    title: 'Müssen: باید plus Konjunktiv'
    gloss: Ich muss gehen, du musst gehen (zu einem Freund), er/sie muss gehen, wir müssen gehen, ihr müsst / Sie müssen gehen (Plural oder förmlich), sie müssen gehen
    note: '*باید* bedeutet „müssen“ oder „sollen“. Es verändert sich nie. Die Person zeigt sich am folgenden Verb, das im Konjunktiv steht: *بروم، بروی، برود، برویم، بروین، بروند*. Die Endungen sind dieselben wie im Präsens, *-م، -ی، -د، -یم، -ین، -ند*, aber das Verb beginnt mit *ب-* statt mit *می‌*. Diese Form kennen Sie schon von *می‌خواهم* (*می‌خواهم یک تکت بگیرم*). Die Wortstellung: zuerst *باید*, das Verb am Ende: *من باید به کتابخانه بروم*. Das Pronomen *من* ist optional, weil die Endung bereits zeigt, wer gemeint ist.'
  prs.a2.unit29.lesson01.teach.formation:
    title: So bildet man den Konjunktiv
    gloss: 'Ich gehe: dass ich gehe. Ich komme: dass ich komme. Ich mache: dass ich mache. Ich nehme (bekomme): dass ich nehme. Ich gebe: dass ich gebe. Ich bringe (trage): dass ich bringe.'
    note: 'Nehmen Sie das Präsens, streichen Sie *می‌* und setzen Sie *ب-* davor: *می‌روم* wird zu *بروم*, *می‌گیرم* wird zu *بگیرم*, *می‌دهم* wird zu *بدهم*, *می‌برم* wird zu *ببرم*. Zwei Verben sind anders. *آمدن* ergibt *بیایم* (nicht *بآیم*), und *کردن* ergibt *کنم* ohne *ب-* (man hört auch *بکنم*, das ist in Ordnung). Bei zweiteiligen Verben ändert sich nur der Verbteil: *پس بدهم*, *کار کنم*, *دوش بگیرم*. Die anderen Personen haben dieselben Endungen: *بگیری، بگیرد، بگیریم، بگیرین، بگیرند*.'
  prs.a2.unit29.lesson01.teach.wear:
    title: Tragen (Kleidung)
    gloss: anziehen, tragen
    note: '*پوشیدن* bedeutet Kleidung und Schuhe anziehen oder tragen. Der Konjunktiv lautet *بپوشم، بپوشی، بپوشد، بپوشیم، بپوشین، بپوشند*; *باید کفش بپوشم* heißt also „Ich muss Schuhe anziehen“.'
    example_gloss: Im Fitnessstudio muss ich neue Schuhe anziehen.
  prs.a2.unit29.lesson01.teach.more_verbs:
    title: Müssen mit weiteren Verben
    gloss: Ich muss eine Karte bekommen. Du musst duschen. Wir müssen das Buch zurückgeben. Ihr müsst / Sie müssen Sportschuhe tragen. Sie müssen ins Fitnessstudio kommen.
    note: 'Dasselbe Muster gilt für jedes Verb: *باید* und dann der Konjunktiv mit der passenden Endung. *دوش گرفتن* heißt „duschen“ und *پس دادن* „zurückgeben“; *باید کتاب را پس بدهیم* heißt also „Wir müssen das Buch zurückgeben“. Das, was man gibt oder nimmt, steht vor dem Verb, bei bestimmten Dingen mit *را*: *کتاب را*.'
  prs.a2.unit29.lesson01.teach.sentence:
    title: Ich muss in die Bibliothek gehen
    gloss: Ich muss in die Bibliothek gehen.
    note: Das ist das Muster der ganzen Lektion. *باید* zeigt eine Regel oder Pflicht an, und *بروم* zeigt die Person. Alle im Zentrum halten dieselben Regeln ein.
  prs.a2.unit29.lesson02.teach.quiet:
    title: Wortkarg
    gloss: ruhig, still
    note: '*ساکت* bedeutet „ruhig“ oder „still“. *ساکت باشین* heißt „Seien Sie bitte ruhig“ (zu mehreren Personen oder zu jemandem, den man respektiert).'
    example_gloss: Die Bibliothek ist ruhig.
  prs.a2.unit29.lesson02.teach.be_paradigm:
    title: 'Sein müssen: باشم'
    gloss: Ich muss ruhig sein, du musst ruhig sein, er/sie muss ruhig sein, wir müssen ruhig sein, ihr müsst / Sie müssen ruhig sein (Plural oder förmlich), sie müssen ruhig sein
    note: 'Der Konjunktiv von *بودن* („sein“) lautet *باشم، باشی، باشد، باشیم، باشین، باشند*. Nach *باید* drückt er aus, dass jemand in einem bestimmten Zustand sein muss: *باید ساکت باشین* heißt „Sie müssen ruhig sein“. *باشد* und *باشین* kennen Sie schon; *باشم، باشی، باشیم* vervollständigen die Reihe.'
  prs.a2.unit29.lesson02.teach.food:
    title: Essen
    gloss: Essen, Mahlzeit
    note: '*غذا* bedeutet „Essen“ oder „Mahlzeit“. *غذا خوردن* heißt „essen“, und *غذا بخورم* ist der Konjunktiv davon.'
    example_gloss: Wir essen zu Hause.
  prs.a2.unit29.lesson02.teach.cigarette:
    title: Zigarette
    gloss: Zigarette
    note: '*سگرت* ist die Zigarette. *سگرت کشیدن* heißt „rauchen“ und wird mit dem Verb *کشیدن* gebildet.'
    example_gloss: Er raucht jeden Tag Zigaretten.
  prs.a2.unit29.lesson02.teach.forbidden:
    title: Verboten
    gloss: verboten, nicht erlaubt
    note: '*ممنوع* bedeutet „verboten“ und steht auf Schildern: *غذا خوردن ممنوع است* heißt „Essen ist nicht erlaubt“. Zuerst steht die Tätigkeit im Infinitiv (*کشیدن، خوردن، گرفتن*), dann *ممنوع است*.'
    example_gloss: Rauchen ist im Fitnessstudio verboten.
  prs.a2.unit29.lesson02.teach.loud:
    title: Laut
    gloss: 'laut (auch: groß, hoch)'
    note: '*بلند* bedeutet „laut“, wenn man sagt, wie jemand spricht: *بلند صحبت کردن* heißt „laut sprechen“. *صحبت کردن* ist ein Verb, das Sie schon kennen.'
    example_gloss: Er spricht laut.
  prs.a2.unit29.lesson02.teach.must_not:
    title: 'Nicht dürfen: نباید plus Konjunktiv'
    gloss: Ich darf nicht essen, du darfst nicht essen, er/sie darf nicht essen, wir dürfen nicht essen, ihr dürft / Sie dürfen nicht essen (Plural oder förmlich), sie dürfen nicht essen
    note: '*نباید* ist die Verneinung von *باید* und bedeutet „nicht dürfen“ bzw. „nicht sollen“. Das *ن* steht an *باید*, und das folgende Verb bleibt positiv: *نباید غذا بخورین* heißt „Sie dürfen nicht essen“. Das Verb hat dieselben Konjunktivendungen wie nach *باید*. *نباید* steht für eine Regel oder einen dringenden Rat; so sprechen das Personal einer Bibliothek oder eines Schwimmbads.'
  prs.a2.unit29.lesson02.teach.forbidden_same:
    title: Zwei Arten zu sagen, dass etwas nicht erlaubt ist
    gloss: Essen ist verboten. Sie dürfen nicht essen.
    note: '*ممنوع است* und *نباید* sagen dasselbe. Das Schild verwendet den Infinitiv: *غذا خوردن ممنوع است*. Eine Person, die mit Ihnen spricht, verwendet *نباید* mit dem Konjunktiv: *نباید غذا بخورین*.'
  prs.a2.unit29.lesson02.teach.no_eat_library:
    title: In der Bibliothek dürfen Sie nicht essen
    gloss: In der Bibliothek dürfen Sie nicht essen.
    note: Zuerst steht der Ort, dann *نباید*, dann die Sache, und am Ende das Verb.
  prs.a2.unit29.lesson02.teach.quiet_library:
    title: In der Bibliothek müssen Sie ruhig sein
    gloss: In der Bibliothek müssen Sie ruhig sein.
    note: '*باید ساکت باشین* ist eine Regel, die sagt, was man tun soll, während *نباید* sagt, was man nicht tun soll.'
  prs.a2.unit29.lesson02.teach.phone_forms:
    title: Nicht dürfen mit weiteren Personen
    gloss: Ich darf nicht telefonieren. Du darfst nicht telefonieren (zu einem Freund). Ihr dürft / Sie dürfen nicht telefonieren (Plural oder förmlich).
    note: 'Bei einem zweiteiligen Verb wie *صحبت کردن* ändert sich nur der Verbteil: *صحبت کنم، صحبت کنی، صحبت کنین*. Zu einem Freund sagt man *نباید ... کنی*, zu mehreren Personen oder jemandem, den man respektiert, *نباید ... کنین*.'
  prs.a2.unit29.lesson02.teach.no_phone_gym:
    title: Im Fitnessstudio dürfen Sie nicht telefonieren
    gloss: Im Fitnessstudio dürfen Sie nicht telefonieren.
    note: '*با تیلفون صحبت کردن* heißt „telefonieren“. *صحبت کنین* ist der Konjunktiv von *صحبت کردن* für *شما*.'
  prs.a2.unit29.lesson03.teach.here:
    title: Hier
    gloss: hier
    note: '*اینجا* bedeutet „hier“. *آنجا* („dort“) kennen Sie schon: *اینجا* ist das Nahe.'
    example_gloss: Die Bibliothek ist hier.
  prs.a2.unit29.lesson03.teach.permission:
    title: Erlaubnis
    gloss: Erlaubnis
    note: '*اجازه* ist die Erlaubnis. *اجازه دارم* heißt „Ich darf“ (ich habe die Erlaubnis) und *اجازه ندارم* „Ich darf nicht“. Für andere sagt man *اجازه دارین* („Sie dürfen“) oder *اجازه ندارین* („Sie dürfen nicht“).'
    example_gloss: Sie dürfen hier sein.
  prs.a2.unit29.lesson03.teach.photo:
    title: Foto
    gloss: Foto, Bild
    note: '*عکس* ist das Foto. *عکس گرفتن* heißt „fotografieren“ und wird mit dem Verb *گرفتن* gebildet.'
    example_gloss: Meine Fotos sind auf meinem Handy.
  prs.a2.unit29.lesson03.teach.ask_allowed:
    title: Darf ich? اجازه دارم plus Konjunktiv
    gloss: Darf ich hier fotografieren? Darf ich das Buch mit nach Hause nehmen? Darf ich das Telefon benutzen?
    note: 'Wenn Sie fragen möchten, ob Sie etwas tun dürfen, sagen Sie *اجازه دارم* und dann den Konjunktiv des Verbs: *اجازه دارم اینجا عکس بگیرم؟* heißt „Darf ich hier fotografieren?“ Beginnen Sie höflich mit *ببخشین* („Entschuldigung“). Die Person zeigt sich am Verb nach *اجازه دارم*; für eine andere Person ändern Sie also beides: *اجازه دارین عکس بگیرین* heißt „Sie dürfen fotografieren“.'
  prs.a2.unit29.lesson03.teach.can_paradigm:
    title: 'Können: می‌توانم'
    gloss: Ich kann, du kannst (zu einem Freund), er/sie kann, wir können, ihr könnt / Sie können (Plural oder förmlich), sie können
    note: '*می‌توانم* heißt „Ich kann“. Es wird mit einem kleinen Abstand zwischen *می* und *توانم* geschrieben. Die Formen sind *می‌توانم، می‌توانی، می‌تواند، می‌توانیم، می‌توانین، می‌توانند*. Danach folgt der Konjunktiv: *می‌توانم اینجا عکس بگیرم؟* heißt „Kann ich hier fotografieren?“ Die Frage *می‌توانم ...؟* ist eine weitere Möglichkeit, um Erlaubnis zu bitten, und ebenso gebräuchlich wie *اجازه دارم ...؟*.'
  prs.a2.unit29.lesson03.teach.answers:
    title: Ja oder Nein sagen
    gloss: Ja, Sie dürfen. Ja, Sie können. Nein, Sie dürfen nicht. Nein, Sie können nicht. Nein, es ist verboten.
    note: 'Antworten Sie mit demselben Verb, mit dem gefragt wurde: Auf *اجازه دارم؟* folgt *اجازه دارین / اجازه ندارین*, auf *می‌توانم؟* folgt *می‌توانین / نمی‌توانین*. Wenn eine Regel es verbietet, können Sie auch *ممنوع است* sagen. Sie können *بلی، البته* („Ja, natürlich“) hinzufügen.'
  prs.a2.unit29.lesson03.teach.polite_ask:
    title: Entschuldigung, darf ich dieses Buch mit nach Hause nehmen?
    gloss: Entschuldigung, darf ich dieses Buch mit nach Hause nehmen?
    note: '*ببخشین* leitet die Frage höflich ein. *به خانه ببرم* heißt „mit nach Hause nehmen“.'
  prs.a2.unit29.lesson03.teach.answer_yes:
    title: Ja, Sie dürfen
    gloss: Ja, Sie dürfen.
    note: Ein kurzes, höfliches Ja auf eine Frage mit *اجازه دارم*.
  prs.a2.unit29.lesson03.teach.answer_no_photo:
    title: Nein, Fotografieren ist hier verboten
    gloss: Nein, Fotografieren ist hier nicht erlaubt.
    note: 'Ein Nein, das mit *ممنوع* den Grund nennt: *عکس گرفتن ممنوع است*.'
  prs.a2.unit29.lesson04.teach.no_need:
    title: 'Nicht nötig: لازم نیست plus Konjunktiv'
    gloss: Wir müssen nicht kommen. Sie müssen nicht bezahlen.
    note: '*لازم نیست* bedeutet „es ist nicht nötig“, also „man muss nicht“. Danach folgt der Konjunktiv, genau wie bei *باید*: *لازم نیست پول بدهین* heißt „Sie müssen nicht bezahlen“. *لازم نیست* verbietet nichts. Es sagt nur, dass es Ihnen freisteht.'
  prs.a2.unit29.lesson04.teach.no_need_formal:
    title: 'Förmlicher: ضرورت ندارد'
    gloss: Es ist nicht nötig, eine Karte mitzubringen.
    note: '*ضرورت ندارد* bedeutet dasselbe wie *لازم نیست*, ist aber etwas förmlicher und steht oft auf Aushängen: *ضرورت ندارد کارت بیاورین* heißt „Es ist nicht nötig, eine Karte mitzubringen“. Danach steht wieder der Konjunktiv. In der Alltagssprache ist *لازم نیست* die übliche Wahl.'
  prs.a2.unit29.lesson04.teach.three_meanings:
    title: Drei verschiedene Bedeutungen
    gloss: Ich muss kommen. Ich darf nicht kommen. Ich muss nicht kommen.
    note: '*باید بیایم* ist eine Pflicht, *نباید بیایم* ein Verbot, und *لازم نیست بیایم* bedeutet Freiheit: Ich darf kommen, muss aber nicht. Verwechseln Sie *نباید* und *لازم نیست* nicht: *نباید* verbietet, *لازم نیست* nicht.'
  prs.a2.unit29.lesson04.teach.towel:
    title: Handtuch
    gloss: Handtuch
    note: '*حوله* ist das Handtuch. *حوله‌ام* heißt „mein Handtuch“.'
    example_gloss: Mein Handtuch ist im Fitnessstudio.
  prs.a2.unit29.lesson04.teach.everyone:
    title: Alle, jeder
    gloss: alle, jeder
    note: '*همه* bedeutet „alle“ oder „jeder“. Es ist nützlich für Regeln, die für alle gelten: *همه باید ساکت باشند* heißt „Alle müssen ruhig sein“.'
    example_gloss: Alle in der Bibliothek sind ruhig.
  prs.a2.unit29.lesson04.teach.bring:
    title: Mitbringen, bringen
    gloss: bringen, mitbringen
    note: '*آوردن* heißt „bringen“. Der Konjunktiv lautet *بیاورم، بیاوری، بیاورد، بیاوریم، بیاورین، بیاورند*. *بیاورم* kennen Sie schon: *لازم نیست حوله بیاوری* heißt „Du musst kein Handtuch mitbringen“.'
    example_gloss: Morgen musst du meine Bücher mitbringen.
  prs.a2.unit29.lesson04.teach.towel_phrase:
    title: Im Fitnessstudio müssen Sie kein Handtuch mitbringen
    gloss: Im Fitnessstudio müssen Sie kein Handtuch mitbringen.
    note: 'Das Fitnessstudio hat eigene Handtücher, daher ist es nicht nötig, eines mitzubringen. Das ist ein gutes Beispiel für *لازم نیست*: Es ist nicht verboten, nur nicht nötig.'
  prs.a2.unit29.lesson04.teach.pay_phrase:
    title: Sie müssen nicht bezahlen
    gloss: Sie müssen nicht bezahlen.
    note: Die Mitgliedschaft in der Bibliothek ist kostenlos, also müssen Sie nichts dafür bezahlen. *پول بدهین* ist der Konjunktiv von *پول دادن*.
  prs.a2.unit29.lesson05.teach.centre:
    title: Zentrum
    gloss: Zentrum
    note: '*مرکز اجتماعی* ist ein Gemeindezentrum, ein Gebäude mit Bibliothek, Schwimmbad und Fitnessstudio. *اجتماعی* kennen Sie aus früheren Lektionen.'
    example_gloss: Das Gemeindezentrum ist in der Nähe meines Hauses.
  prs.a2.unit29.lesson05.teach.rubbish:
    title: Müll, Mülleimer
    gloss: 'Müll, Abfall (und: Mülleimer)'
    note: '*زباله* ist der Müll und *سطل* der Eimer bzw. Mülleimer. Beide Wörter stammen aus der Lektion über Abfall. Das Verb ist *انداختن*, „werfen“: *زباله را در سطل بیندازین* heißt „Werfen Sie den Müll in den Mülleimer“.'
    example_gloss: Der Müll ist im Mülleimer.
  prs.a2.unit29.lesson05.teach.run:
    title: Rennen
    gloss: rennen, laufen
    note: '*دویدن* heißt „rennen“. Der Subjunktiv lautet *بدوم، بدوی، بدود، بدویم، بدوین، بدوند*, also bedeutet *نباید بدوین*: Sie dürfen nicht rennen.'
    example_gloss: Im Schwimmbecken darf man nicht rennen.
  prs.a2.unit29.lesson05.teach.throw:
    title: Werfen, hineintun
    gloss: werfen, hineinwerfen
    note: '*انداختن* heißt „werfen“. Der Subjunktiv lautet *بیندازم، بیندازی، بیندازد، بیندازیم، بیندازین، بیندازند*, also bedeutet *باید زباله را در سطل بیندازین*: Sie müssen den Müll in den Mülleimer werfen.'
    example_gloss: Werfen Sie den Müll in den Mülleimer.
  prs.a2.unit29.lesson05.teach.library_turn01:
    title: Shakila fragt, ob sie ein Buch mit nach Hause nehmen darf
    gloss: Entschuldigung, darf ich dieses Buch mit nach Hause nehmen?
    note: Shakila ist neu in der Bibliothek und fragt mit *اجازه دارم* und dem Subjunktiv *ببرم*. Sie sagt *ببخشین*, um höflich zu sein.
  prs.a2.unit29.lesson05.teach.library_turn02:
    title: Nasir sagt, dass sie zuerst einen Ausweis braucht
    gloss: Ja, aber zuerst müssen Sie einen Mitgliedsausweis holen.
    note: 'Nasir ist der Bibliothekar, deshalb sagt er *شما* und verwendet die Form auf *-ین*: *بگیرین*. *اول باید* heißt „zuerst müssen Sie“.'
  prs.a2.unit29.lesson05.teach.library_turn03:
    title: Shakila fragt nach der Bezahlung
    gloss: Muss ich bezahlen?
    note: '*باید پول بدهم؟* ist eine Frage mit *باید*: Muss ich bezahlen?'
  prs.a2.unit29.lesson05.teach.library_turn04:
    title: 'Nasir sagt: nichts bezahlen, aber das Buch zurückgeben'
    gloss: Nein, Sie müssen nicht bezahlen. Sie müssen das Buch innerhalb von zwei Wochen zurückgeben.
    note: '*لازم نیست* sagt, dass man nicht bezahlen muss. *باید کتاب را تا دو هفته پس بدهین* ist eine Pflicht: Das Buch muss innerhalb von zwei Wochen zurückgegeben werden.'
  prs.a2.unit29.lesson05.teach.library_turn05:
    title: Shakila fragt nach dem Essen
    gloss: Kann ich hier essen?
    note: '*می‌توانم ...؟* fragt, ob man etwas darf. Der Subjunktiv lautet *بخورم*.'
  prs.a2.unit29.lesson05.teach.library_turn06:
    title: 'Nasir sagt: nicht essen und leise sein'
    gloss: Nein, Sie dürfen nicht essen. Sie müssen auch leise sein.
    note: '*نباید غذا بخورین* ist ein Verbot, *باید ساکت هم باشین* eine Pflicht. *هم* bedeutet „auch“.'
  prs.a2.unit29.lesson05.teach.notice:
    title: Ein Aushang mit den Regeln des Zentrums
    gloss: 'Aushang. Die Regeln des Gemeindezentrums. Bibliothek: In der Bibliothek dürfen Sie nicht essen und müssen leise sein. Schwimmbecken: Bevor Sie ins Schwimmbecken gehen, müssen Sie duschen. Im Becken dürfen Sie nicht rennen. Fitnessstudio: Im Fitnessstudio müssen Sie Sportschuhe tragen. Sie müssen kein Handtuch mitbringen. Müll müssen Sie in den Mülleimer werfen.'
    note: 'Ein echter Aushang enthält alle drei Arten von Regeln: *باید* für das, was man tun muss, *نباید* für das, was man nicht tun darf, und *لازم نیست* für das, was nicht nötig ist. Der Aushang richtet sich an alle, deshalb steht die Form auf *-ین*.'
  prs.a2.unit29.lesson06.teach.first_time:
    title: Das erste Mal
    gloss: das erste Mal
    note: '*اولین بار* heißt „das erste Mal“. *اولین* bedeutet „erste“ und *بار* „Mal“, wie in *هر بار* („jedes Mal“).'
    example_gloss: Ich gehe zum ersten Mal in diese Bibliothek.
  prs.a2.unit29.lesson06.teach.what_must_i:
    title: Was muss ich tun?
    gloss: Was muss ich tun?
    note: 'Eine nützliche Frage: *چه* („was“), *باید* und der Subjunktiv *بکنم*. *بکنم* und *کنم* sind hier beide richtig.'
  prs.a2.unit29.lesson06.teach.gym_turn01:
    title: Nazila fragt, was sie tun muss
    gloss: Fahim, morgen gehe ich zum ersten Mal ins Fitnessstudio. Was muss ich tun?
    note: Nazila sagt zu ihrem Freund *تو*. *فردا ... می‌روم* ist das einfache Präsens für „morgen“.
  prs.a2.unit29.lesson06.teach.gym_turn02:
    title: Fahim nennt eine Pflicht und etwas, das nicht nötig ist
    gloss: Du musst Sportschuhe anziehen. Du musst kein Handtuch mitbringen, im Fitnessstudio gibt es Handtücher.
    note: 'Fahim spricht mit einer Freundin, deshalb enden die Verben auf *-ی*: *بپوشی، بیاوری*. *باید* ist eine Pflicht, *لازم نیست* bedeutet „nicht nötig“.'
  prs.a2.unit29.lesson06.teach.gym_turn03:
    title: Nazila fragt nach dem Schwimmbecken
    gloss: Kann ich nach dem Fitnessstudio ins Schwimmbad gehen?
    note: '*می‌توانم ... بروم؟* fragt, ob sie gehen darf.'
  prs.a2.unit29.lesson06.teach.gym_turn04:
    title: Fahim sagt Ja und nennt zwei Regeln
    gloss: Ja, aber zuerst musst du duschen. Im Becken darfst du auch nicht rennen.
    note: '*اول باید دوش بگیری* ist eine Pflicht und *نباید بدوی* ist ein Verbot. Beide haben die Endung *-ی* für eine Freundin.'
  prs.a2.unit29.lesson06.teach.gym_turn05:
    title: Nazila bedankt sich
    gloss: Gut! Danke.
    note: Ein kurzer, freundlicher Abschluss. *تشکر* bedeutet „Danke“.
