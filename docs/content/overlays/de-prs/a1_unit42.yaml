course:
  title: Dari in Deutsch A1
  description: 'Dari für Anfänger (Kabul): Vereinbaren und bestätigen Sie einen einfachen Termin, indem Sie Leistung, Tag und Uhrzeit nennen. Fragen Sie, wer an welchem Tag frei ist, schlagen Sie Tag und Uhrzeit vor, bestätigen Sie sie und lesen Sie einen kurzen Text über einen vereinbarten Termin.'
units:
