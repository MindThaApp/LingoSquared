    title: 'Wiederholung: ich möchte, ein/eine'
    gloss: ich möchte / ein / eine / eins
    note: می‌خواهم und یک werden kombiniert, um zu sagen, was man möchte.
    target_text: می‌خواهم (ich möchte) / یک (ein/eine/eins)
  prs.a1.unit42.lesson01.teach.tooth_word:
    title: Zahn
    gloss: Zahn
    note: دندان ist das gebräuchliche Dari-Wort für „Zahn“.
