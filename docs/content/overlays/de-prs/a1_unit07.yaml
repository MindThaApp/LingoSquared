course:
  title: Dari in Deutsch A1
  description: 'Dari (Afghanistan) für Anfänger: Telefonate annehmen, sich am Telefon vorstellen, um Wiederholung oder langsameres Sprechen bitten, eine Nachricht hinterlassen und einfache Kurznachrichten.'
units:
  prs.a1.unit07.communication:
    title: Telefonieren
lessons:
  prs.a1.unit07.lesson01.answering_the_phone:
    title: Das Telefon abnehmen
  prs.a1.unit07.lesson02.identifying_yourself:
    title: Sich am Telefon vorstellen
  prs.a1.unit07.lesson03.asking_to_repeat_or_slow_down:
    title: Bitten, zu wiederholen oder langsamer zu sprechen
  prs.a1.unit07.lesson04.leaving_a_message:
    title: Eine Nachricht hinterlassen
  prs.a1.unit07.lesson05.text_messages:
    title: Eine kurze SMS lesen und schreiben
  prs.a1.unit07.lesson06.phone_call_dialogue:
    title: Ein ganzes Telefongespräch
teaching:
  prs.a1.unit07.lesson01.teach.alo:
    title: Hallo (am Telefon)
    gloss: Hallo (am Telefon)
    note: الو verwendet man speziell, um einen Anruf anzunehmen oder zu beginnen; im persönlichen Gespräch sagt man dagegen سلام.
    example_gloss: Hallo, hier spricht Karim.
  prs.a1.unit07.lesson01.teach.goosh_astam:
    title: Den Anrufer zum Weitersprechen auffordern
    gloss: Ja, bitte sehr.
    note: بلی، بفرمایین ist die natürliche Antwort nach dem Abnehmen. Dabei steht das höfliche بفرمایین („bitte“/„sprechen Sie“), das in diesem Kurs schon vorkam – keine wörtliche Übersetzung von „Ich höre.“
  prs.a1.unit07.lesson01.teach.telephone_review:
    title: Telefon (Wiederholung)
    gloss: das Telefon
    note: تلفن wurde in der Zahlen-Lektion eingeführt; hier bildet es den Rahmen für die ganze Lektion.
    example_gloss: Mein Telefon ist kaputt.
  prs.a1.unit07.lesson02.teach.who_speaking:
    title: Fragen, wer anruft
    gloss: Entschuldigung, wer spricht dort?
    note: ببخشین، کی صحبت می‌کند؟ fragt höflich nach der Identität des Anrufers.
  prs.a1.unit07.lesson02.teach.this_is_speaking:
    title: Sich vorstellen
    gloss: Hier ist Farid.
    note: من فرید استم nennt direkt, wer anruft, und verwendet dasselbe استم-Muster wie in früheren Lektionen.
  prs.a1.unit07.lesson02.teach.colleague_context:
    title: Die Verbindung zur angerufenen Person erklären
    gloss: Ich bin ein Kollege von Homayoun.
    note: همکار همایون استم erklärt, warum Sie anrufen. Das ist nützlich, wenn die Person am Telefon Sie nicht kennt.
  prs.a1.unit07.lesson03.teach.speak_slowly:
    title: Bitten, langsam zu sprechen
    gloss: Bitte sprechen Sie langsam.
    note: لطفاً آهسته صحبت کنین ist eine natürliche, höfliche Bitte bei schlechter Verbindung oder wenn man die Sprache erst lernt.
  prs.a1.unit07.lesson03.teach.repeat_review:
    title: Um Wiederholung bitten (Wiederholung)
    gloss: Können Sie das noch einmal sagen?
    note: می‌توانین دوباره بگویین؟ wurde in der Lektion über das Vorstellen eingeführt und passt genauso natürlich in ein Telefongespräch.
  prs.a1.unit07.lesson03.teach.combined_request:
    title: Beide Bitten verbinden
    gloss: Bitte sprechen Sie langsam und sagen Sie es noch einmal.
    note: و verbindet die beiden Bitten zu einer natürlichen Wendung.
  prs.a1.unit07.lesson04.teach.payam_word:
    title: Nachricht
    gloss: Nachricht
    note: پیام ist das allgemeine Wort für eine Nachricht, ob gesprochen oder geschrieben.
    example_gloss: Ich habe eine Nachricht für Sie.
  prs.a1.unit07.lesson04.teach.want_to_leave_message:
    title: Sagen, dass man eine Nachricht hinterlassen möchte
    gloss: Ich möchte eine Nachricht hinterlassen.
    note: می‌خواهم یک پیام بگذارم sagt man, wenn die angerufene Person nicht erreichbar ist.
  prs.a1.unit07.lesson04.teach.will_call_later:
    title: Sagen, dass man später zurückruft
    gloss: Ich rufe später an.
    note: بعد زنگ می‌زنم ist eine einfache Alternative dazu, eine Nachricht zu hinterlassen.
  prs.a1.unit07.lesson05.teach.short_message:
    title: Textnachricht
    gloss: SMS (Kurznachricht)
    note: پیام کوتاه bedeutet wörtlich „kurze Nachricht“ und ist die alltägliche Bezeichnung für eine SMS.
  prs.a1.unit07.lesson05.teach.meeting_tomorrow:
    title: Eine Beispielnachricht
    gloss: Morgen ist die Besprechung um neun Uhr.
    note: فردا جلسه ساعت نه است ist eine natürliche, vollständige Information, die man in einer Nachricht weitergeben kann.
  prs.a1.unit07.lesson05.teach.will_deliver:
    title: Bestätigen, dass Sie die Nachricht weitergeben
    gloss: Ich richte es aus.
    note: می‌رسانم bestätigt, dass die Nachricht die gemeinte Person erreicht.
  prs.a1.unit07.lesson06.teach.turn01:
    title: Lima nimmt den Anruf an
    gloss: Lima meldet sich mit der Begrüßung am Telefon.
    note: الو؟ ist die übliche Art, einen eingehenden Anruf anzunehmen.
  prs.a1.unit07.lesson06.teach.turn02:
    title: Farid begrüßt sie und fragt, ob sie es ist
    gloss: Farid begrüßt sie und fragt, ob sie Lima ist.
    note: الو، سلام verbindet die Begrüßung am Telefon mit der alltäglichen Begrüßung.
  prs.a1.unit07.lesson06.teach.turn03:
    title: Lima fordert ihn zum Sprechen auf und fragt, wer anruft
    gloss: Lima fordert ihn zum Weitersprechen auf und fragt, wer anruft.
    note: بلی، بفرمایین und کی صحبت می‌کند؟ kennen Sie bereits aus den früheren Lektionen.
  prs.a1.unit07.lesson06.teach.turn04:
    title: Farid stellt sich vor
    gloss: Farid sagt, dass er ein Kollege von Homayoun ist.
    note: Hier kehrt das Muster mit dem Kollegen aus einer früheren Lektion wieder; so hat Lima einen Grund, dem Anruf zu vertrauen.
  prs.a1.unit07.lesson06.teach.turn05:
    title: Lima bittet ihn, langsam zu sprechen
    gloss: Lima begrüßt ihn und bittet ihn, langsam zu sprechen.
    note: آهسته صحبت کنین، لطفاً greift die Bitte aus Lektion 3 wieder auf.
  prs.a1.unit07.lesson06.teach.turn06:
    title: Farid ist einverstanden und möchte eine Nachricht hinterlassen
    gloss: Farid stimmt zu und sagt, er möchte eine Nachricht für Homayoun hinterlassen.
    note: Das erweitert das Muster mit پیام aus Lektion 4 um einen bestimmten Empfänger (برای همایون, „für Homayoun“).
  prs.a1.unit07.lesson06.teach.turn07:
    title: Lima ist einverstanden, es aufzuschreiben
    gloss: Lima fordert ihn auf, fortzufahren, und sagt, dass sie mitschreibt.
    note: بفرمایین fordert Farid hier auf, weiterzusprechen.
  prs.a1.unit07.lesson06.teach.turn08:
    title: Farid nennt den Inhalt der Nachricht
    gloss: Farid bittet sie auszurichten, dass die Besprechung morgen um neun Uhr ist.
    note: Hier wird der Beispielinhalt der Nachricht aus Lektion 5 direkt wiederverwendet.
  prs.a1.unit07.lesson06.teach.turn09:
    title: Lima bestätigt und verspricht, es auszurichten
    gloss: Lima bestätigt die Angaben und sagt, dass sie es weitergibt.
    note: می‌رسانم schließt den Teil des Gesprächs ab, in dem die Nachricht aufgenommen wird, wie in Lektion 5 gelernt.
  prs.a1.unit07.lesson06.teach.turn10:
    title: Farid bedankt sich und verabschiedet sich
    gloss: Farid bedankt sich herzlich und verabschiedet sich.
    note: تشکر زیاد und خدا حافظ verwenden beide Wortschatz aus früheren Lektionen.
  prs.a1.unit07.lesson06.teach.turn11:
    title: Lima verabschiedet sich
    gloss: Lima verabschiedet sich.
    note: خدا حافظ beendet das Gespräch.
  prs.a1.unit07.lesson06.teach.past_tense_left:
    title: Sagen, dass jemand eine Nachricht hinterlassen hat (Vergangenheit)
    gloss: Farid hat eine Nachricht hinterlassen.
    note: گذاشت ist das einfache Präteritum (hinterließ) des Verbs aus می‌خواهم یک پیام بگذارم in Lektion 4, wo بگذارم „ich hinterlasse“ bedeutet. Damit fassen Sie zusammen, was nach einem Anruf geschehen ist.
    target_text: فرید پیام گذاشت (Farid hat eine Nachricht hinterlassen)
