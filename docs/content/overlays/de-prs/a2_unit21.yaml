teaching:
  prs.a2.unit21.lesson01.teach.tghr_dadn_lghw:
    title: Einen Termin ändern
    gloss: (einen Termin) verschieben / absagen
    note: '*قرار را تغییر دادن* bedeutet, den Termin auf eine andere Zeit zu verschieben. *لغو کردن* bedeutet, ihn ganz abzusagen.'
    example_gloss:
    - Ich möchte meinen Termin verschieben.
    - Ich muss meinen Termin absagen.
  prs.a2.unit21.lesson01.teach.mtasfanh_bbkhshn:
    title: Sich entschuldigen
    gloss: leider / Entschuldigung
    note: '*متأسفانه* ist eine höfliche Art, schlechte Nachrichten zu überbringen. *ببخشین* ist die alltägliche Entschuldigung.'
    example_gloss:
    - Leider kann ich nicht kommen.
    - Entschuldigung, ich bin zu spät.
  prs.a2.unit21.lesson01.teach.slman:
    title: Beim Friseur
    gloss: der Friseursalon
    note: '*سلمانی* ist der Friseurladen, also der Ort. *دلاک* ist das traditionelle Wort für den Friseur selbst.'
    example_gloss: Der Friseursalon ist von neun bis sechs Uhr geöffnet.
  prs.a2.unit21.lesson01.teach.mtwanm_qrarm_ra:
    title: Um Terminverschiebung bitten
    gloss: Kann ich meinen Termin verschieben?
    note: 'Eine Ja-Nein-Frage behält die Wortstellung des Aussagesatzes, nur die Stimme geht nach oben: *می‌توانم قرارم را تغییر بدهم؟* Das zweite Verb, *تغییر بدهم*, steht am Ende.'
  prs.a2.unit21.lesson01.teach.mn_mtasfanh_nmtwanm:
    title: Sagen, dass man nicht kommen kann
    gloss: Leider kann ich nicht kommen.
  prs.a2.unit21.lesson01.teach.njshnbh_nmtwanm_bam:
    title: می‌توانم + Subjunktiv
    gloss: Am Donnerstag kann ich nicht kommen. Kann ich den Termin verschieben?
    note: 'Nach *می‌توانم* (ich kann) steht das zweite Verb im Subjunktiv und am Satzende: *می‌توانم بیایم*. Für *nicht* kommt das *ن* an das Hilfsverb: *نمی‌توانم بیایم*. Ein Tagesname steht am Anfang: *پنجشنبه نمی‌توانم بیایم*. Eine Frage hat dieselbe Wortstellung, nur die Stimme steigt: *می‌توانم قرار را تغییر بدهم؟*'
  prs.a2.unit21.lesson02.teach.rwz_dr:
    title: Ein anderer Tag
    gloss: ein anderer Tag
    note: '*دیگر* bedeutet „andere(r)“ und steht nach dem Nomen: *یک روز دیگر* ist ein anderer Tag.'
    example_gloss: Geht es auch an einem anderen Tag?
  prs.a2.unit21.lesson02.teach.dwshnbh_hm_mmn:
    title: Einen Tag vorschlagen
    gloss: Geht es auch am Montag?
    note: 'Vor einem Wochentag braucht man keine Präposition: *دوشنبه هم ممکن است؟* *هم* bedeutet „auch“ und steht nach dem Tag.'
  prs.a2.unit21.lesson02.teach.jmah_bra_shma:
    title: Passt es Ihnen?
    gloss: Passt Ihnen der Freitag? (formell)
    note: '*مناسب* bedeutet „passend“. *برای شما مناسب است* ist die höfliche Art zu fragen, ob ein Termin jemandem passt, den man nicht gut kennt. *برایم* ist die Kurzform von *برای من* (für mich).'
  prs.a2.unit21.lesson02.teach.bl_bram_mnasb:
    title: Zusagen
    gloss: Ja, das passt mir sehr gut.
  prs.a2.unit21.lesson02.teach.mtasfanh_nh:
    title: Höflich absagen
    gloss: Leider nicht.
  prs.a2.unit21.lesson02.teach.jmah_bra_shma_2:
    title: Passt es Ihnen?
    gloss: Passt Ihnen der Freitag? Ja, das passt mir sehr gut. Nein, leider nicht.
    note: Um zu fragen, ob ein Termin jemandem passt, verwendet man *برای شما مناسب است؟* mit dem höflichen *شما*. Antworten Sie *بلی، برایم مناسب است*, um zuzustimmen, oder *متأسفانه نه*, um höflich abzulehnen. *برای* plus Pronomenendung (*برایم*, *برایتان*) bedeutet „für mich“, „für Sie“.
  prs.a2.unit21.lesson03.teach.wn_mtasfm:
    title: Weil und es tut mir leid
    gloss: weil / es tut mir leid
    note: '*چون* verbindet zwei vollständige Sätze und gibt den Grund an. *متأسفم* ist eine förmlichere Entschuldigung als *ببخشین*.'
    example_gloss:
    - Ich kann nicht kommen, weil ich krank bin.
    - Es tut mir leid.
  prs.a2.unit21.lesson03.teach.zhmt:
    title: Unannehmlichkeit
    gloss: die Unannehmlichkeit
    note: '*بابت زحمت ببخشین* ist eine höfliche Wendung, wenn man jemandem zusätzliche Mühe gemacht hat. *زحمت* bedeutet Mühe oder Umstände.'
    example_gloss: Entschuldigen Sie die Unannehmlichkeiten.
  prs.a2.unit21.lesson03.teach.nmtwanm_bam_wn:
    title: 'Grund: Arbeit'
    gloss: Ich kann nicht kommen, weil ich arbeiten muss.
  prs.a2.unit21.lesson03.teach.nmtwanm_bam_wn_2:
    title: 'Grund: ein anderer Termin'
    gloss: Ich kann nicht kommen, weil ich einen anderen Termin habe.
  prs.a2.unit21.lesson03.teach.nmtwanm_bam_wn_3:
    title: 'Weil: einen Grund angeben'
    gloss: Ich kann nicht kommen, weil ich krank bin.
    note: 'Nach *چون* folgt ein gewöhnlicher Satz mit dem Verb am Ende. Davor steht ein Komma: *نمی‌توانم بیایم، چون مریض استم.* Die Form *استم* ist die Form für *ich* von *است*.'
  prs.a2.unit21.lesson04.teach.qrar_dhashtn_az:
    title: Vereinbaren und im Voraus
    gloss: etwas vereinbaren / im Voraus
    note: '*قرار گذاشتن* bedeutet, gemeinsam eine Zeit oder einen Ort zu vereinbaren. *از قبل* bedeutet „vorher“, „im Voraus“.'
    example_gloss:
    - Sollen wir etwas vereinbaren?
    - Rufen Sie einen Tag vorher an.
  prs.a2.unit21.lesson04.teach.dwshnbh_saat_dh:
    title: Eine Zeit annehmen
    gloss: Montag um zehn Uhr passt.
  prs.a2.unit21.lesson04.teach.dwshnbh_saat_dh_2:
    title: Fragen, ob eine Zeit passt
    gloss: Können Sie am Montag um zehn Uhr kommen? (formell)
    note: '*می‌توانین* ist die höfliche *Sie*-Form von *می‌توانی*; die Pluralendung *-ین* gehört zu *شما*. Das zweite Verb, *بیایین*, steht am Ende.'
  prs.a2.unit21.lesson04.teach.s_shma_ra:
    title: Die Vereinbarung abschließen
    gloss: Dann erwarten wir Sie am Montag.
  prs.a2.unit21.lesson04.teach.s_qrar_jdd:
    title: Einen neuen Termin machen
    gloss: Dann mache ich einen neuen Termin.
  prs.a2.unit21.lesson04.teach.dwshnbh_saat_dh_3:
    title: Erst der Tag, dann die Uhrzeit
    gloss: Montag um zehn Uhr passt. Können Sie am Montag um zehn Uhr kommen?
    note: 'Wenn Sie Tag und Uhrzeit nennen, steht zuerst der Tag, dann *ساعت* + die Zahl: *دوشنبه ساعت ده*. In einer höflichen Frage verwendet man *می‌توانین ...؟* und setzt das Verb ans Ende.'
  prs.a2.unit21.lesson05.teach.hmawn_azz_qrartan:
    title: Eine Nachricht vom Friseursalon
    gloss: Lieber Homayoun, Ihr Termin wurde verschoben. Ihr neuer Termin ist Montag um zehn Uhr. Passt Ihnen das nicht? Dann rufen Sie uns einen Tag vorher an. Dann vereinbaren wir einen neuen Termin. Bis Montag! Friseursalon Ariana
    note: Das ist eine typische kurze Nachricht eines Unternehmens, daher steht die höfliche Endung *-تان* (*قرارتان*, *برایتان*). *تغییر داده شد* bedeutet „wurde verschoben“.
    glosses:
      عزیز: sehr geehrter
      همایون: Homayoun
      قرارتان: Ihr (formell)
      قرار: Termin
      تغییر: verschoben
      جدیدتان: neu
      دوشنبه: Montag
      ده: zehn
      ساعت: Uhr
      مناسب: passend
      این: das
      نیست: nicht
      برایتان: für Sie (höflich)
      تماس: anrufen
      با: mit uns (با ما)
      پس: dann
      قبل: im Voraus
      می‌گذاریم: machen
      ما: wir
      تا: bis
      سلمانی: Friseursalon
      آریانا: Ariana
  prs.a2.unit21.lesson06.teach.slman_arana_rwz:
    title: Der Salon meldet sich
    gloss: 'Friseur: Friseursalon Ariana, guten Tag.'
  prs.a2.unit21.lesson06.teach.rwz_bkhr_hmawn:
    title: Homayoun erklärt und fragt
    gloss: 'Homayoun: Guten Tag, hier spricht Homayoun. Ich habe am Donnerstag einen Termin, kann aber leider nicht kommen. Kann ich den Termin verschieben?'
  prs.a2.unit21.lesson06.teach.albth_jmah_bra:
    title: Die Friseurin schlägt Freitag vor
    gloss: 'Friseurin: Natürlich. Passt Ihnen Freitag?'
  prs.a2.unit21.lesson06.teach.mtasfanh_nh_wn:
    title: Homayoun schlägt Montag vor
    gloss: 'Homayoun: Leider nicht, weil ich arbeiten muss. Geht es auch am Montag?'
  prs.a2.unit21.lesson06.teach.dwshnbh_saat_dh:
    title: Die Friseurin sagt zu
    gloss: 'Friseurin: Montag um zehn Uhr passt.'
  prs.a2.unit21.lesson06.teach.bram_mnasb_ast:
    title: Homayoun sagt zu und entschuldigt sich
    gloss: 'Homayoun: Das passt mir gut. Vielen Dank und Entschuldigung für die Umstände.'
  prs.a2.unit21.lesson06.teach.mshl_nst_ta:
    title: Die Friseurin verabschiedet sich
    gloss: 'Friseurin: Kein Problem. Bis Montag!'
