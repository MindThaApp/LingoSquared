course:
  title: Dari A2
  description: 'Dari (Afghanistan) für Fortgeschrittene auf A2-Niveau: eine Reklamation im Geschäft – ein defektes Elektroheizgerät, das Problem erklären, die Rückgaberegelung eines Ladens lesen und das Gespräch am Rückgabeschalter.'
units:
  prs.a2.unit18.shopping_complaint:
    title: Reklamation im Geschäft
lessons:
  prs.a2.unit18.lesson01.complaint_vocabulary:
    title: Wörter für eine Reklamation
  prs.a2.unit18.lesson02.explaining_the_problem:
    title: Das Problem erklären
  prs.a2.unit18.lesson03.reading_a_return_policy:
    title: Eine Rückgaberegelung lesen
  prs.a2.unit18.lesson04.return_counter_dialogue:
