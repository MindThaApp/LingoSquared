teaching:
  prs.a2.unit18.lesson01.teach.broken_word:
    title: Kaputt
    gloss: kaputt
    note: '*خراب* beschreibt jeden defekten oder nicht funktionierenden Gegenstand.'
    example_gloss: Diese Heizung ist kaputt.
  prs.a2.unit18.lesson01.teach.exchange_word:
    title: Umtausch
    gloss: wechseln
    note: '*تعویض کردن* – *تعویض* bedeutet „Umtausch“ und wird mit *کردن* („tun, machen“) verbunden.'
    example_gloss: Ich möchte die Heizung umtauschen.
  prs.a2.unit18.lesson01.teach.refund_word:
    title: Rückerstattung
    gloss: Rückerstattung
    note: '*بازپرداخت* ist das formelle Wort für eine Rückerstattung.'
    example_gloss: Ich möchte eine Rückerstattung.
  prs.a2.unit18.lesson01.teach.receipt_word:
    title: Quittung
    gloss: Kassenbon
    note: '*رسید* ist dasselbe Wort, das schon in früheren Lektionen für die Mietquittung vorkam; hier bedeutet es den Kaufbeleg.'
    example_gloss: Ich habe den Kaufbeleg dabei.
  prs.a2.unit18.lesson01.teach.warranty_word:
    title: Garantie
    gloss: Garantie
    note: '*گارانتی* ist ein direktes Lehnwort und wird ähnlich wie im Deutschen verwendet.'
    example_gloss: Diese Heizung hat ein Jahr Garantie.
  prs.a2.unit18.lesson01.teach.defect_word:
    title: Defekt
    gloss: Defekt
    note: '*عیب* bedeutet einen Fehler oder Defekt an einem Gegenstand.'
    example_gloss: Diese Heizung hat einen Defekt.
  prs.a2.unit18.lesson01.teach.when_grammar:
    title: Wenn, mit وقتی
    gloss: Wenn ich sie einschalte, wird sie nicht warm.
    note: '*وقتی* leitet einen Temporalsatz ein – ein natürliches Gegenstück zum Bedingungssatz mit *اگر* („falls“) aus Lektion 11, nennt aber eine Tatsache statt einer Möglichkeit.'
  prs.a2.unit18.lesson01.teach.heater_word:
    title: Elektroheizgerät
    gloss: Elektroheizgerät
    note: '*بخاری برقی* – *بخاری* bedeutet „Heizgerät“ und *برقی* „elektrisch“.'
    example_gloss: Ich habe ein Elektroheizgerät für mein neues Zuhause gekauft.
  prs.a2.unit18.lesson01.teach.va_word:
    title: Und
    gloss: und
    note: '*و* ist das übliche Bindewort, mit dem in dieser Lektion Sätze verbunden werden.'
    target_text: و (und)
  prs.a2.unit18.lesson02.teach.state_item_broken:
    title: Sagen, dass ein gekaufter Gegenstand kaputt ist
    gloss: Diese Heizung, die ich gestern gekauft habe, ist kaputt.
    note: '*که دیروز خریدم* – „die ich gestern gekauft habe“ – ein Relativsatz, der angibt, um welchen Gegenstand es geht.'
  prs.a2.unit18.lesson02.teach.request_exchange_or_refund:
    title: Um Umtausch oder Rückerstattung bitten
    gloss: Ich möchte sie umtauschen oder mein Geld zurückbekommen.
    note: '*یا* bedeutet „oder“ und lässt dem Verkäufer die Wahl.'
  prs.a2.unit18.lesson02.teach.prefer_question:
    title: Fragen, was der Kunde bevorzugt
    gloss: Was ziehen Sie vor?
    note: '*ترجیح دادن* bedeutet „bevorzugen“ – der grammatische Schritt auf A2-Niveau in dieser Lektion, um zwischen zwei angebotenen Möglichkeiten zu wählen.'
  prs.a2.unit18.lesson03.teach.deadline_word:
    title: Frist
    gloss: Frist
    note: '*مهلت* ist eine Frist, innerhalb der etwas erledigt werden muss.'
    example_gloss: Die Umtauschfrist beträgt sieben Tage.
  prs.a2.unit18.lesson03.teach.original_word:
    title: Original
    gloss: Original
    note: '*اصلی* bedeutet „original“, etwa beim Originalbeleg im Gegensatz zu einer Kopie.'
    example_gloss: Bitte bringen Sie den Originalbeleg mit.
  prs.a2.unit18.lesson03.teach.policy_text:
    title: Ein Aushang im Geschäft zu Rückgaben
    gloss: Wenn ein gekaufter Artikel defekt ist, können Sie ihn innerhalb von sieben Tagen mit dem Originalbeleg umtauschen oder sich den Kaufpreis erstatten lassen.
    note: Ein kurzer offizieller Aushang im formellen Schriftstil, den diese Lektion vermittelt.
  prs.a2.unit18.lesson04.teach.turn01:
    title: Der Verkäufer begrüßt کریم
    gloss: Der Verkäufer fragt, wie er ihm helfen kann.
    note: Eine formelle Begrüßung wie die des Büroangestellten in Lektion 9 (*بفرمایین، چه خدمتی...*), hier mit *کمکی* („Hilfe“) statt *خدمتی* („Dienst“).
  prs.a2.unit18.lesson04.teach.turn02:
    title: کریم schildert das Problem
    gloss: کریم sagt, dass die Heizung, die er gestern gekauft hat, kaputt ist.
    note: Übernimmt exakt den Satz aus Lektion 2.
  prs.a2.unit18.lesson04.teach.turn03:
    title: Der Verkäufer fragt, was das Problem ist
    gloss: Der Verkäufer fragt, was das Problem ist.
    note: '*چه مشکلی دارد؟* bedeutet wörtlich „Welches Problem hat es?“.'
  prs.a2.unit18.lesson04.teach.turn04:
    title: کریم beschreibt den Defekt
    gloss: Wenn er sie einschaltet, wird sie nicht warm.
    note: '*روشنش می‌کنم* – „ich schalte sie ein“ – hängt das Objektsuffix *-ش* an *روشن* an.'
  prs.a2.unit18.lesson04.teach.turn05:
    title: Der Verkäufer fragt nach dem Kassenbon
    gloss: Der Verkäufer fragt, ob er den Kassenbon dabeihat.
    note: '*همراه‌تان* – „bei Ihnen“ – mit dem höflichen Possessivsuffix *-تان*.'
  prs.a2.unit18.lesson04.teach.turn06:
    title: کریم bestätigt, dass er ihn hat
    gloss: Ja, hier ist sein Kassenbon.
    note: '*اینه* ist die umgangssprachliche Form von „Hier ist es“, wenn man etwas überreicht; sie wurde bereits in Einheit 11 eingeführt.'
  prs.a2.unit18.lesson04.teach.turn07:
    title: Der Verkäufer bietet eine Wahl an
    gloss: Der Verkäufer kann sie umtauschen oder ihm das Geld erstatten. Was zieht er vor?
    note: Übernimmt die Frage *ترجیح می‌دهین؟* aus Lektion 2.
  prs.a2.unit18.lesson04.teach.turn08:
    title: کریم wählt den Umtausch
    gloss: کریم sagt, der Umtausch sei besser, danke.
    note: '*بهتر است* bedeutet „ist besser“.'
