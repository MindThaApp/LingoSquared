course:
  title: Dari A2
  description: 'Afghanisches Dari für Fortgeschrittene (untere Mittelstufe): Sagen, was Sie angefangen, aufgehört, versucht oder vergessen haben. Anfangen mit der Sache und را, mit به und dem Infinitiv oder mit که und dem Konjunktiv; eine Gewohnheit aufgeben mit ترک کردن und دیگر; versuchen und vergessen mit که und dem Konjunktiv.'
units:
  prs.a2.unit33.starting_stopping_trying:
    title: Anfangen, aufhören, versuchen
lessons:
  prs.a2.unit33.lesson01.starting:
    title: 'Etwas anfangen: „Ich habe angefangen zu laufen“'
  prs.a2.unit33.lesson02.that_i_run:
    title: '„Dass ich laufe“: anfangen und versuchen mit که'
  prs.a2.unit33.lesson03.stopping:
    title: 'Aufhören: ترک کردن und „nicht mehr“'
  prs.a2.unit33.lesson04.forgetting:
    title: Vergessen, etwas zu tun
  prs.a2.unit33.lesson05.reading_and_listening:
    title: Über Gewohnheiten lesen und hören
  prs.a2.unit33.lesson06.gym_conversation:
    title: Ein Gespräch im Fitnessstudio
teaching:
  prs.a2.unit33.lesson01.teach.gym:
    title: Fitnessstudio
    gloss: Fitnessstudio, Sportverein
    note: '*باشگاه* ist ein Fitnessstudio oder Sportverein. Man geht dorthin mit *به*: *به باشگاه می‌روم* heißt „Ich gehe ins Fitnessstudio“.'
    example_gloss: Das Fitnessstudio ist in der Nähe des Hauses.
  prs.a2.unit33.lesson01.teach.run:
    title: Laufen, rennen
    gloss: laufen, rennen
    note: '*دویدن* heißt „laufen, rennen“. Der Präsensstamm ist *دو*, also heißt *می‌دوم* „ich laufe“. Wie jeder Infinitiv endet *دویدن* auf *-ن*; diese Form mit *-ن* verwenden Sie in dieser Lektion nach *به*.'
    example_gloss: Ich laufe jeden Morgen.
  prs.a2.unit33.lesson01.teach.exercise:
    title: Sport treiben
    gloss: Sport treiben
    note: '*ورزش کردن* heißt „Sport treiben“. Es ist ein zweiteiliges Verb: *ورزش* bleibt vorn und nur *کردن* verändert sich, etwa in *ورزش می‌کنم* (ich treibe Sport) und *ورزش کردم* (ich habe Sport getrieben).'
    example_gloss: Ich treibe jeden Tag Sport.
  prs.a2.unit33.lesson01.teach.half_hour:
    title: Eine halbe Stunde
    gloss: eine halbe Stunde
    note: '*نیم ساعت* heißt „eine halbe Stunde“. *نیم* bedeutet „halb“ und steht vor dem Nomen, wie in *نیم ساعت* und *نیم ساعت ورزش*.'
    example_gloss: Jeden Morgen treibe ich eine halbe Stunde Sport.
  prs.a2.unit33.lesson01.teach.habit:
    title: Gewohnheit
    gloss: Gewohnheit
    note: '*عادت* heißt „Gewohnheit“. In dieser ganzen Lektion geht es um Gewohnheiten: eine gute anfangen, eine schlechte aufgeben, versuchen, eine beizubehalten, und eine vergessen.'
    example_gloss: Sport ist eine gute Gewohnheit.
  prs.a2.unit33.lesson01.teach.start_noun:
    title: 'Etwas anfangen: die Sache + را + شروع کردن'
    gloss: Ich habe mit dem Sport angefangen. Du hast mit dem Laufen angefangen. Er/Sie hat die Arbeit begonnen.
    note: 'Um zu sagen, dass Sie etwas angefangen haben, setzen Sie die Sache vor *را* und verwenden dann *شروع کردن* (anfangen): *ورزش را شروع کردم* heißt „Ich habe mit dem Sport angefangen“. Es ist wie *ورزش کردن* ein zweiteiliges Verb, daher verändert sich nur *کردن*: *شروع کردم، شروع کردی، شروع کرد، شروع کردیم، شروع کردین، شروع کردند*. Was Sie anfangen, kann ein Nomen sein (*کار*, Arbeit) oder ein Infinitiv (*دویدن*, Laufen). Das Pronomen ist optional, weil die Endung schon die Person zeigt.'
  prs.a2.unit33.lesson01.teach.month_ago:
    title: Ich habe vor einem Monat mit dem Sport angefangen
    gloss: Ich habe vor einem Monat mit dem Sport angefangen.
    note: '*پیش* nach einer Zeitangabe bedeutet „vor“: *یک ماه پیش* heißt „vor einem Monat“ und *دو هفته پیش* „vor zwei Wochen“. Die Zeitangabe steht meist am Satzanfang.'
  prs.a2.unit33.lesson01.teach.start_to:
    title: 'Anfangen, etwas zu tun: به + Infinitiv + شروع کردن'
    gloss: Ich habe angefangen zu laufen. Du hast angefangen, Sport zu treiben. Er/Sie hat angefangen zu lesen.
    note: 'Um zu sagen, dass Sie angefangen haben, etwas zu tun, setzen Sie *به* und den Infinitiv (das Verb auf *-ن*) vor *شروع کردن*: *به دویدن شروع کردم* heißt „Ich habe angefangen zu laufen“. Ein zweiteiliges Verb behält beide Teile im Infinitiv: *به ورزش کردن شروع کردم* heißt „Ich habe angefangen, Sport zu treiben“. Sie hören auch die Reihenfolge *شروع کردم به دویدن* mit derselben Bedeutung. Vergleichen Sie die beiden Muster: *ورزش را شروع کردم* nennt eine Sache, mit der Sie angefangen haben, und *به ورزش کردن شروع کردم* nennt die Tätigkeit.'
  prs.a2.unit33.lesson01.teach.read_start:
    title: Er/Sie hat vor zwei Wochen angefangen, Bücher zu lesen
    gloss: Er/Sie hat vor zwei Wochen angefangen, Bücher zu lesen.
    note: '*خواندن* heißt „lesen“ (und „lernen, studieren“). Der Infinitiv *خواندن* steht nach *به*, und sein Objekt *کتاب* kann folgen: *به خواندن کتاب شروع کرد*.'
  prs.a2.unit33.lesson02.teach.sleep:
    title: Schlafen, ins Bett gehen
    gloss: schlafen, ins Bett gehen
    note: '*خوابیدن* heißt „schlafen“ oder „ins Bett gehen“. Der Präsensstamm ist *خواب*: *می‌خوابم* heißt „ich schlafe“. *شب‌ها* bedeutet „abends, nachts“ als Zeitangabe.'
    example_gloss: Abends gehe ich früh ins Bett.
  prs.a2.unit33.lesson02.teach.try:
    title: Versuchen
    gloss: versuchen, sich bemühen
    note: '*کوشش* heißt „Bemühung“, und *کوشش کردن* heißt „versuchen“. Es ist ein zweiteiliges Verb: *کوشش می‌کنم* heißt „ich versuche“ und *کوشش کردم* „ich habe versucht“. Das, was Sie versuchen, steht nach *که* im Konjunktiv.'
    example_gloss: Ich versuche, früh aufzuwachen.
  prs.a2.unit33.lesson02.teach.subjunctive:
    title: 'Der Konjunktiv: ب + Präsensstamm + Endung'
    gloss: dass ich laufe, dass ich schlafe, dass ich lese, dass ich esse, dass ich gehe, dass ich sehe; dass ich Sport treibe, dass ich aufwache
    note: 'Den Konjunktiv verwendet man für etwas, das man anfängt, versucht oder zu tun vergisst. Sie kennen ihn schon von *باید*, etwa in *باید بروم*. So bilden Sie ihn: Nehmen Sie den Präsensstamm, setzen Sie *ب-* davor und fügen Sie die Endungen *-م، -ی، -د، -یم، -ین، -ند* an. Für *دویدن* (Stamm *دو*): *بدوم، بدوی، بدود، بدویم، بدوین، بدوند*. Andere Verben: *خوابیدن* ergibt *بخوابم*, *خواندن* ergibt *بخوانم*, *خوردن* ergibt *بخورم*, *رفتن* ergibt *بروم*, *دیدن* ergibt *ببینم*. Ein zweiteiliges Verb hat kein *ب-*: Der erste Teil bleibt und nur *کردن* oder *شدن* verändert sich, also *ورزش کنم* (dass ich Sport treibe) und *بیدار شوم* (dass ich aufwache).'
  prs.a2.unit33.lesson02.teach.che_pattern:
    title: شروع کردن und کوشش کردن mit که
    gloss: Ich habe angefangen zu laufen. Ich versuche, früh ins Bett zu gehen. Ich habe versucht, Sport zu treiben.
    note: 'Nach *شروع کردن* und *کوشش کردن* folgen *که* und ein Verb im Konjunktiv. *شروع کردم که بدوم* bedeutet dasselbe wie *به دویدن شروع کردم*: „Ich habe angefangen zu laufen.“ *کوشش می‌کنم که زود بخوابم* heißt „Ich versuche, früh ins Bett zu gehen“. Das Subjekt bleibt normalerweise gleich, die Endung des Konjunktivs zeigt also dieselbe Person wie das Hauptverb: *کوشش کردم که بروم*, *کوشش کردی که بروی*, *کوشش کرد که برود*. Die Zeitform des ersten Verbs gibt die Zeit an (ich habe versucht, ich versuche); der Konjunktiv selbst hat keine eigene Zeit.'
  prs.a2.unit33.lesson02.teach.negative_subj:
    title: 'Der verneinte Konjunktiv: ن statt ب'
    gloss: Ich versuche, keine Süßigkeiten zu essen. Ich versuche, nicht spät ins Bett zu gehen.
    note: 'Um „versuchen, nicht zu …“ zu sagen, setzen Sie *ن-* an die Stelle von *ب-*: Aus *بخورم* wird *نخورم* (dass ich nicht esse), aus *بخوابم* wird *نخوابم*, aus *بروم* wird *نروم*. Schreiben Sie nicht *نبخورم*. Ein zweiteiliges Verb setzt das *ن-* an seinen Verbteil: *ورزش نکنم* (dass ich keinen Sport treibe).'
  prs.a2.unit33.lesson02.teach.he_tried:
    title: Er/Sie hat versucht, früh aufzuwachen
    gloss: Er/Sie hat versucht, früh aufzuwachen.
    note: 'Die Endung des Konjunktivs zeigt das Subjekt: *شود* steht für „er/sie“, also heißt *او کوشش کرد که زود بیدار شود* „Er/Sie hat versucht, früh aufzuwachen.“'
  prs.a2.unit33.lesson02.teach.we_started:
    title: Wir haben angefangen, jeden Tag Sport zu treiben
    gloss: Wir haben angefangen, jeden Tag Sport zu treiben.
    note: 'Die Endung *-یم* bedeutet in beiden Verben „wir“: *شروع کردیم* und *ورزش کنیم*.'
  prs.a2.unit33.lesson03.teach.quit:
    title: Aufgeben, aufhören mit
    gloss: aufgeben, aufhören mit
    note: '*ترک کردن* heißt, eine Gewohnheit aufzugeben oder damit aufzuhören. Es ist ein zweiteiliges Verb: *ترک کردم* heißt „ich habe aufgehört“ und *ترک می‌کنم* „ich gebe auf“.'
    example_gloss: Er/Sie hat aufgehört, Süßigkeiten zu essen.
  prs.a2.unit33.lesson03.teach.sweets:
    title: Süßigkeiten
    gloss: Süßigkeiten, Gebäck, Süßes
    note: '*شیرینی* sind Süßigkeiten und Gebäck. Es ist ein gutes Beispiel für eine Gewohnheit, die man gern aufgeben möchte.'
    example_gloss: Ich mag Süßigkeiten.
  prs.a2.unit33.lesson03.teach.for_hours:
    title: Stundenlang
    gloss: stundenlang
    note: '*ساعت‌ها* ist der Plural von *ساعت* und bedeutet „stundenlang, sehr lange“. So spricht man über die Bildschirmzeit: *ساعت‌ها ویدیو دیدم* heißt „Ich habe stundenlang Videos geschaut“.'
    example_gloss: Er/Sie schaut stundenlang Videos.
  prs.a2.unit33.lesson03.teach.sometimes:
    title: Manchmal
    gloss: manchmal
    note: '*گاهی* heißt „manchmal“. Es steht am Satzanfang oder vor dem Verb und ist das Gegenteil von *همیشه* (immer) und *هرگز* (nie).'
    example_gloss: Manchmal schaue ich Videos.
  prs.a2.unit33.lesson03.teach.quit_pattern:
    title: 'Eine Gewohnheit aufgeben: die Gewohnheit + را + ترک کردن'
    gloss: Ich habe aufgehört, Süßigkeiten zu essen. Du hast aufgehört, spät ins Bett zu gehen. Er/Sie hat aufgehört, Videos zu schauen.
    note: 'Um zu sagen, dass Sie eine Gewohnheit aufgegeben haben, setzen Sie die Gewohnheit vor *را* und verwenden dann *ترک کردن*. Die Gewohnheit ist eine Infinitivgruppe: *شیرینی خوردن* (Süßigkeiten essen), *دیر خوابیدن* (spät schlafen gehen), *ویدیو دیدن* (Videos schauen). Es ist dasselbe Muster wie bei *ورزش را شروع کردم*: die Sache, *را*, dann das Verb. Sie können auch sagen: *عادت بد را ترک کردم* (Ich habe mir eine schlechte Gewohnheit abgewöhnt).'
  prs.a2.unit33.lesson03.teach.no_longer:
    title: 'Nicht mehr: دیگر + verneintes Verb'
    gloss: Ich esse keine Süßigkeiten mehr. Ich schaue keine Videos mehr. Ich gehe nicht mehr spät ins Bett.
    note: '*دیگر* mit einem verneinten Verb bedeutet „nicht mehr“: *دیگر شیرینی نمی‌خورم* heißt „Ich esse keine Süßigkeiten mehr“. Es beschreibt den jetzigen Zustand, nachdem Sie etwas aufgegeben haben. In einer Vergangenheitsgeschichte können Sie *دیگر* mit dem verneinten einfachen Präteritum verwenden: *از آن روز دیگر شیرینی نخوردم* heißt „Von diesem Tag an habe ich nie wieder Süßigkeiten gegessen“. Im Präsens sagt *ترک کردم*, dass Sie die Entscheidung getroffen haben, und *دیگر نمی‌خورم* nennt das Ergebnis.'
  prs.a2.unit33.lesson03.teach.from_today:
    title: Von heute an gehe ich nicht mehr spät ins Bett
    gloss: Von heute an gehe ich nicht mehr spät ins Bett.
    note: '*از امروز* heißt „von heute an“. Mit *دیگر* und einem verneinten Verb kündigt es eine neue Gewohnheit an.'
  prs.a2.unit33.lesson03.teach.bad_habit:
    title: Ich habe mir eine schlechte Gewohnheit abgewöhnt
    gloss: Ich habe mir eine schlechte Gewohnheit abgewöhnt.
    note: '*عادت بد* heißt „schlechte Gewohnheit“. Das Adjektiv *بد* steht nach dem Nomen.'
  prs.a2.unit33.lesson03.teach.less_phone:
    title: Abends benutze ich das Telefon weniger
    gloss: Abends benutze ich das Telefon weniger.
    note: '*کمتر* heißt „weniger“. Die Bildschirmzeit zu reduzieren ist eine andere Art, eine Gewohnheit zu beenden: Sie hören nicht ganz auf, sondern tun es nur seltener.'
  prs.a2.unit33.lesson04.teach.forget:
    title: Vergessen
    gloss: vergessen
    note: '*فراموش کردن* heißt „vergessen“. Es ist ein zweiteiliges Verb: *فراموش کردم* heißt „ich habe vergessen“ und *فراموش نکردم* „ich habe nicht vergessen“.'
    example_gloss: Entschuldigung, ich habe es vergessen.
  prs.a2.unit33.lesson04.teach.why_not_come:
    title: Warum bist du gestern nicht gekommen?
    gloss: Warum bist du gestern nicht gekommen?
    note: '*نیامدی* ist das verneinte einfache Präteritum von *آمدن* für einen Freund bzw. eine Freundin: „du bist nicht gekommen“. Die Frage *چرا* bedeutet „warum“.'
  prs.a2.unit33.lesson04.teach.forget_pattern:
    title: 'Vergessen, etwas zu tun: فراموش کردن که + Konjunktiv'
    gloss: Ich habe vergessen anzurufen. Ich habe vergessen, mein Buch mitzubringen. Ich habe vergessen, früh ins Bett zu gehen.
    note: 'Um zu sagen, dass Sie vergessen haben, etwas zu tun, verwenden Sie *فراموش کردن* mit *که* und einem Verb im Konjunktiv: *فراموش کردم که تیلفون کنم* heißt „Ich habe vergessen anzurufen“, der Anruf hat also nicht stattgefunden. Es ist derselbe Konjunktiv wie in den letzten Lektionen, und das Subjekt bleibt normalerweise gleich. *فراموش کردم* steht in der Vergangenheit, Sie sprechen also über einen Moment, der schon vorbei ist; der Konjunktiv nach *که* hat keine eigene Zeit.'
  prs.a2.unit33.lesson04.teach.not_forget:
    title: 'Ich habe nicht vergessen zu: فراموش نکردم که'
    gloss: Ich habe nicht vergessen anzurufen. Ich habe nicht vergessen, mein Buch mitzubringen.
    note: 'Bei *فراموش نکردم* steht die Verneinung bei *کردم*: „ich habe nicht vergessen“. Danach wurde die Sache getan: *فراموش نکردم که کتابم را بیاورم* heißt „Ich habe nicht vergessen, mein Buch mitzubringen“, ich habe es also mitgebracht. Vergleichen Sie *فراموش کردم که کتابم را بیاورم* („Ich habe vergessen, mein Buch mitzubringen“, ich habe es also nicht mitgebracht).'
  prs.a2.unit33.lesson04.teach.four_verbs:
    title: Vier Verben, vier Muster
    gloss: Ich habe angefangen. Ich habe aufgehört. Ich habe versucht. Ich habe vergessen.
    note: 'Alle vier Verben enden auf *کردن*, daher sind die Personenendungen immer gleich (*کردم، کردی، کرد، کردیم، کردین، کردند*). Was folgt, ist verschieden. *شروع کردن*: die Sache und *را*, oder *به* plus Infinitiv, oder *که* plus Konjunktiv. *ترک کردن*: die Gewohnheit und *را*. *کوشش کردن*: *که* plus Konjunktiv. *فراموش کردن*: *که* plus Konjunktiv. Um zu sagen, dass Sie etwas nicht mehr tun, verwenden Sie *دیگر* und ein verneintes Präsensverb.'
  prs.a2.unit33.lesson04.teach.sorry_forgot_sleep:
    title: Ich habe vergessen, früh ins Bett zu gehen
    gloss: Ich habe vergessen, früh ins Bett zu gehen.
    note: Diesen Satz sagt man, wenn etwas schiefgegangen ist, weil man eine Gewohnheit nicht eingehalten hat.
  prs.a2.unit33.lesson05.teach.read_book:
    title: Ein Buch lesen
    gloss: ein Buch lesen
    note: '*کتاب خواندن* heißt „ein Buch lesen“. Das Präsens ist *کتاب می‌خوانم* (ich lese ein Buch); *خواندن* heißt auch „lernen, studieren“.'
    example_gloss: Jeden Abend lese ich eine halbe Stunde lang ein Buch.
  prs.a2.unit33.lesson05.teach.two_weeks:
    title: Ich habe vor zwei Wochen angefangen, Bücher zu lesen
    gloss: Ich habe vor zwei Wochen angefangen, Bücher zu lesen.
    note: 'Das Muster ist das aus der ersten Lektion: eine Zeitangabe mit *پیش*, dann *به* plus Infinitiv, dann *شروع کردم*.'
  prs.a2.unit33.lesson05.teach.dlg_turn01:
    title: Najiba fragt Yasin, wann er angefangen hat
    gloss: Yasin, wann hast du angefangen, Sport zu machen?
    note: '*ورزش را کی شروع کردی؟* besteht aus dem Muster Sache plus *را* plus *شروع کردی*. *کی* fragt nach dem Zeitpunkt („wann“). Die Sprecher sind befreundet, deshalb sagen sie *تو*.'
  prs.a2.unit33.lesson05.teach.dlg_turn02:
    title: Yasin sagt, wann und wie viel
    gloss: Vor einem Monat. Jetzt laufe ich jeden Morgen eine halbe Stunde im Fitnessstudio.
    note: '*یک ماه پیش* ist der Anfangszeitpunkt. *حالا هر صبح نیم ساعت در باشگاه می‌دوم* ist die Gewohnheit, die er jetzt hat.'
  prs.a2.unit33.lesson05.teach.dlg_turn03:
    title: Najiba fragt nach Süßigkeiten
    gloss: Sehr gut! Isst du auch Süßigkeiten?
    note: '*خیلی خوب* ist eine freundliche Reaktion. *شیرینی هم می‌خوری؟* fragt, ob er auch Süßigkeiten isst.'
  prs.a2.unit33.lesson05.teach.dlg_turn04:
    title: Yasin sagt, dass er auf Süßigkeiten verzichtet
    gloss: Nein, ich habe aufgehört, Süßigkeiten zu essen. Ich esse keine Süßigkeiten mehr.
    note: '*شیرینی خوردن را ترک کردم* nennt die Entscheidung, *دیگر شیرینی نمی‌خورم* nennt das Ergebnis.'
  prs.a2.unit33.lesson05.teach.dlg_turn05:
    title: Najiba fragt nach Videos
    gloss: Schaust du abends Videos?
    note: '*شب‌ها* ist eine Zeitangabe für „abends/nachts“, und *می‌بینی* bedeutet „du siehst“ oder „du schaust“.'
  prs.a2.unit33.lesson05.teach.dlg_turn06:
    title: Yasin sagt, dass er versucht, weniger zu schauen
    gloss: Ja, aber ich versuche, weniger zu schauen.
    note: '*کوشش می‌کنم که کمتر ببینم* verwendet *کوشش کردن* mit dem Subjunktiv *ببینم*. Er hat Videos nicht aufgegeben: Er versucht es nur.'
  prs.a2.unit33.lesson05.teach.khalida_message:
    title: Eine Nachricht über neue Gewohnheiten
    gloss: Hallo Najiba. Vor zwei Wochen habe ich angefangen, Bücher zu lesen. Jeden Abend lese ich eine halbe Stunde. Ich habe aufgehört, Videos zu schauen, also schaue ich abends keine Videos mehr. Ich versuche, früh schlafen zu gehen. Gestern habe ich vergessen, dich anzurufen. Khalida
    note: 'Eine kurze schriftliche Nachricht mit allen vier Mustern: anfangen (*به خواندن کتاب شروع کردم*), aufhören (*ویدیو دیدن را ترک کردم*), versuchen (*کوشش می‌کنم که زود بخوابم*) und vergessen (*فراموش کردم که تیلفون کنم*). Die Schreiberin ist eine andere Person als Yasin.'
  prs.a2.unit33.lesson06.teach.late_wake:
    title: Ich bin morgens spät aufgewacht
    gloss: Ich bin morgens spät aufgewacht.
    note: '*بیدار شدن* bedeutet „aufwachen“. *دیر* heißt „spät“, *زود* heißt „früh“: *صبح زود بیدار شدم* bedeutet „Ich bin morgens früh aufgewacht“.'
  prs.a2.unit33.lesson06.teach.every_night:
    title: Ich versuche, jeden Abend früh schlafen zu gehen
    gloss: Ich versuche, jeden Abend früh schlafen zu gehen.
    note: '*هر شب* heißt „jeden Abend/jede Nacht“. Eine Zeitangabe wie *هر شب* kann vor oder nach *زود* stehen; hier steht sie nach *که*.'
  prs.a2.unit33.lesson06.teach.dlg_turn01:
    title: Yasin fragt, warum Najiba nicht gekommen ist
    gloss: Najiba, warum bist du gestern nicht ins Fitnessstudio gekommen?
    note: '*چرا* fragt nach dem Grund („warum“), und *نیامدی* heißt „du bist nicht gekommen“. *به باشگاه* heißt „ins Fitnessstudio“.'
  prs.a2.unit33.lesson06.teach.dlg_turn02:
    title: Najiba sagt, was sie vergessen hat
    gloss: Ich habe vergessen, früh schlafen zu gehen, deshalb bin ich morgens spät aufgewacht.
    note: '*فراموش کردم که زود بخوابم* ist der Grund, mit dem Subjunktiv *بخوابم*. *پس* („deshalb“) leitet die Folge ein: *صبح دیر بیدار شدم*.'
  prs.a2.unit33.lesson06.teach.dlg_turn03:
    title: Yasin fragt nach heute
    gloss: Kommst du heute?
    note: '*می‌آیی* heißt „du kommst“, an eine Freundin oder einen Freund gerichtet. Wie im Deutschen kann das einfache Präsens mit einer Zeitangabe auch auf die nahe Zukunft verweisen.'
  prs.a2.unit33.lesson06.teach.dlg_turn04:
    title: Najiba sagt, dass sie kommt und was sie versucht
    gloss: Ja, ich komme heute um sechs Uhr. Ich versuche, jeden Abend früh schlafen zu gehen.
    note: '*امروز ساعت شش می‌آیم* ist das einfache Präsens mit einer Zeitangabe. *کوشش می‌کنم که هر شب زود بخوابم* ist die neue Gewohnheit, die sie beibehalten möchte.'
  prs.a2.unit33.lesson06.teach.dlg_turn05:
    title: Yasin reagiert
    gloss: Sehr gut!
    note: '*خیلی خوب* ist eine kurze, freundliche Reaktion.'
