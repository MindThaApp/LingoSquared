      - و
      - پیاده
      - رفتم
      status: correct
    feedback: '*بعد از آن دروازه را باز کردم و پیاده رفتم.* Zwei abgeschlossene Schritte nach *بعد از آن*, jeder mit einem eigenen Verb.'
  prs.a2.unit22.lesson04.exercise04.complete_connector:
    instruction: 'Ergänzen Sie ein Verbindungswort: Zuerst habe ich geduscht, dann habe ich mich angezogen.'
    accepted_answers:
    - value: بعد
      status: correct
    - value: بعد از آن
      status: correct
    feedback: '*بعد* (dann) oder *بعد از آن* (danach) verbinden beide den zweiten Schritt mit dem ersten.'
  prs.a2.unit22.lesson04.exercise05.translate_first_then:
    instruction: 'Übersetzen Sie ins Dari und verwenden Sie اول und بعد: Zuerst bin ich spät aufgewacht, dann habe ich geduscht.'
    accepted_answers:
    - value: اول دیر بیدار شدم، بعد دوش گرفتم.
      status: correct
    - value: اول دیر بیدار شدم. بعد دوش گرفتم.
      status: correct
    - value: اول دیر بیدار شدم و بعد دوش گرفتم.
      status: correct
    - value: من اول دیر بیدار شدم، بعد دوش گرفتم.
      status: correct
    - value: من اول دیر بیدار شدم. بعد دوش گرفتم.
      status: correct
    - value: من اول دیر بیدار شدم و بعد دوش گرفتم.
      status: correct
    feedback: '*اول دیر بیدار شدم، بعد دوش گرفتم.* Ein Komma, ein Punkt oder *و* zwischen den beiden Schritten sind alle natürlich.'
  prs.a2.unit22.lesson04.exercise06.answer_no_breakfast:
    instruction: 'Ein Freund fragt: صبحانه خوردی؟ (Hast du gefrühstückt?) Antworten Sie auf Dari: Nein, ich habe nicht gefrühstückt.'
    accepted_answers:
    - value: نخیر، صبحانه نخوردم.
      status: correct
    - value: نخیر صبحانه نخوردم.
      status: correct
    - value: صبحانه نخوردم.
      status: correct
    - value: نخیر، من صبحانه نخوردم.
      status: correct
    - value: من صبحانه نخوردم.
      status: correct
    - value: نی، صبحانه نخوردم.
      status: correct
    - value: نی، من صبحانه نخوردم.
      status: correct
