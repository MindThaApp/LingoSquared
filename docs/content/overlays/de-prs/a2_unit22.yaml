course:
  title: Dari A2
  description: 'Dari (Afghanistan) für Fortgeschrittene auf niedrigem Niveau: Schritt für Schritt beschreiben, wie ein Morgen oder eine Reise verlaufen ist, auch einen ausgelassenen Schritt. Zusammengesetzte Verben im einfachen Präteritum, ihre Verneinung am Funktionsverb, die Stellung von را und die Konnektoren اول، بعد، بعد از آن، در آخر.'
units:
  prs.a2.unit22.busy_morning:
    title: Ein viel beschäftigter Morgen
lessons:
  prs.a2.unit22.lesson01.morning_words_and_compound_verbs:
    title: Wörter für den Morgen und zusammengesetzte Verben
  prs.a2.unit22.lesson02.more_compound_verbs:
    title: Weitere zusammengesetzte Verben
  prs.a2.unit22.lesson03.negative_compound_verbs:
    title: Zusammengesetzte Verben verneinen und die Stellung von را
  prs.a2.unit22.lesson04.telling_in_order:
    title: In der richtigen Reihenfolge erzählen
  prs.a2.unit22.lesson05.reading_and_listening:
    title: 'Lesen und Hören: ein viel beschäftigter Morgen'
  prs.a2.unit22.lesson06.morning_conversation:
    title: Ein Gespräch über den Morgen
teaching:
  prs.a2.unit22.lesson01.teach.this_morning:
    title: Heute Morgen
    gloss: heute Morgen
    note: '*امروز* heißt „heute“ und *صبح* „Morgen“. Zusammen bedeutet *امروز صبح* „heute Morgen“, der Zeitrahmen dieser Lektion. In einem Dari-Satz steht die Zeitangabe am Anfang und das Verb am Ende.'
    example_gloss: Heute Morgen bin ich ins Büro gegangen.
  prs.a2.unit22.lesson01.teach.late_early:
    title: Spät, früh
    gloss: spät, früh
    note: '*دیر* heißt „spät“ und *زود* „früh“. Beide stehen im Satz vor dem Verb, direkt vor dem Verbteil.'
    example_gloss:
    - Heute Morgen bin ich spät aufgewacht.
    - Heute ist er früh aufgewacht.
  prs.a2.unit22.lesson01.teach.office:
    title: Büro
    gloss: Büro
    note: '*دفتر* ist das Büro, der Ort, an dem in Kabul an Wochentagen morgens viele Menschen arbeiten.'
    example_gloss: Am Morgen bin ich ins Büro gegangen.
  prs.a2.unit22.lesson01.teach.school:
    title: Schule
    gloss: Schule
    note: '*مکتب* ist das alltägliche afghanische Wort für „Schule“. Man geht dorthin mit *به*, wie in *به مکتب رفتم*.'
    example_gloss: Er ist am Morgen zur Schule gegangen.
  prs.a2.unit22.lesson01.teach.by_bus_car:
    title: Mit dem Bus, mit dem Auto
    gloss: mit dem Bus, mit dem Auto
    note: '*با* bedeutet „mit“. *با بس* heißt „mit dem Bus“ und *با موتر* „mit dem Auto“. *بس* ist der Bus und *موتر* das afghanische Wort für „Auto“.'
    example_gloss:
    - Ich bin mit dem Bus ins Büro gefahren.
    - Wir sind mit dem Auto zur Schule gefahren.
  prs.a2.unit22.lesson01.teach.on_foot:
    title: Zu Fuß
    gloss: zu Fuß
    note: '*پیاده* bedeutet „zu Fuß“. *پیاده رفتن* heißt „zu Fuß gehen“, und *پیاده* steht direkt vor dem Verb.'
    example_gloss: Ich bin zu Fuß zur Schule gegangen.
  prs.a2.unit22.lesson01.teach.bus_stop:
    title: Bushaltestelle, Station
    gloss: Bushaltestelle, Haltestelle
    note: '*ایستگاه* ist eine Haltestelle oder Station. *ایستگاه بس* ist eine Bushaltestelle.'
    example_gloss: Ich bin zur Bushaltestelle gegangen.
  prs.a2.unit22.lesson01.teach.gate:
    title: Tor, Tür
    gloss: Tor, äußere Tür eines Hauses
    note: '*دروازه* ist das Tor oder die äußere Tür eines Hauses. Man öffnet es jeden Morgen; deshalb begegnet es Ihnen in den nächsten Lektionen wieder, zusammen mit dem kleinen Wort *را*.'
    example_gloss: Ich habe das Tor geöffnet.
  prs.a2.unit22.lesson01.teach.clothes:
    title: Meine Kleider
    gloss: meine Kleider
    note: '*لباس* ist Kleidung, *لباس‌ها* sind Kleider (die Pluralendung *-ها* wird mit einem kleinen Abstand angefügt), und *-م* fügt „mein“ hinzu: *لباس‌هایم* heißt „meine Kleider“.'
    example_gloss: Ich habe meine Kleider angezogen.
  prs.a2.unit22.lesson01.teach.shower:
    title: Dusche
    gloss: Dusche
    note: '*دوش* ist eine Dusche. Man „wäscht“ sie nicht, sondern „nimmt“ sie, mit dem Verb *گرفتن*, das Ihnen in der nächsten Lektion begegnet.'
    example_gloss: Am Morgen habe ich geduscht.
  prs.a2.unit22.lesson01.teach.tea:
    title: Tee
    gloss: Tee
    note: '*چای* ist Tee, das übliche Getränk am Morgen. Im Dari „isst“ man Tee, daher lautet das Verb *خوردن*.'
    example_gloss: Am Morgen habe ich Tee getrunken.
  prs.a2.unit22.lesson01.teach.breakfast:
    title: Das Frühstück
    gloss: Frühstück
    note: '*صبحانه* ist das Frühstück. In Kabul hören Sie für dieselbe Mahlzeit auch *ناشتا*; in diesem Kurs verwenden wir *صبحانه*.'
    example_gloss: Zum Frühstück habe ich Brot gegessen und Tee getrunken.
  prs.a2.unit22.lesson01.teach.wake_up:
    title: Aufwachen
    gloss: 'aufwachen (wörtlich: wach werden)'
    note: '*بیدار* bedeutet „wach“ und *شدن* bedeutet „werden“. Zusammen heißt *بیدار شدن* „aufwachen“. Das ist ein zusammengesetztes Verb: ein Wort, das kein Verb ist (hier ein Adjektiv), plus ein Leichtverb.'
    example_gloss: Heute Morgen bin ich aufgewacht.
  prs.a2.unit22.lesson01.teach.get_ready:
    title: Sich fertig machen
    gloss: 'sich fertig machen (wörtlich: bereit werden)'
    note: '*آماده* bedeutet „bereit“ und *شدن* bedeutet „werden“. *آماده شدن* heißt „sich fertig machen“, ein zweites zusammengesetztes Verb mit *شدن*.'
    example_gloss: Heute Morgen habe ich mich fertig gemacht.
  prs.a2.unit22.lesson01.teach.open:
    title: Öffnen
    gloss: 'öffnen (wörtlich: offen machen)'
    note: '*باز* bedeutet „offen“ und *کردن* bedeutet „tun“ oder „machen“. *باز کردن* heißt „öffnen“. Es ist ein zusammengesetztes Verb mit *کردن*: Man macht etwas offen.'
    example_gloss: Ich habe das Tor geöffnet.
  prs.a2.unit22.lesson01.teach.went_office:
    title: Ich bin ins Büro gegangen.
    gloss: Ich bin ins Büro gegangen.
    note: '*رفتم* ist das einfache Präteritum von *رفتن* aus Lektion 19: Vergangenheitsstamm *رفت* plus *-م*. *به* bedeutet „zu“ oder „in“, also heißt *به دفتر رفتم* „Ich bin ins Büro gegangen“.'
  prs.a2.unit22.lesson01.teach.opened_gate:
    title: ich habe das Tor geöffnet
    gloss: Ich habe das Tor geöffnet.
    note: '*را* ist ein kleines Wort, das ein bestimmtes Objekt markiert, hier das Tor. Lernen Sie vorerst den ganzen Satz. Lektion 3 erklärt genau, wo *را* steht.'
  prs.a2.unit22.lesson01.teach.compound_rule:
    title: 'Zusammengesetzte Verben in der Vergangenheit: Die Endung steht am Leichtverb'
    gloss: ich bin aufgewacht, du bist aufgewacht, er/sie ist aufgewacht, wir sind aufgewacht, ihr/Sie seid/sind aufgewacht (Plural oder höflich), sie sind aufgewacht
    note: 'Viele alltägliche Verben im Dari sind zusammengesetzte Verben: ein Nomen oder Adjektiv plus ein Hilfsverb wie *شدن* oder *کردن*. *بیدار شدن* (aufwachen), *آماده شدن* (sich fertig machen) und *باز کردن* (öffnen) sind alle zusammengesetzte Verben. Im einfachen Präteritum bleibt der erste Teil immer unverändert. Nur das Hilfsverb erhält die Vergangenheitsendung, die Sie schon von *رفتم* kennen: Nehmen Sie den Infinitiv, streichen Sie *ن* (*شدن* ergibt *شد*) und fügen Sie dann *-م، -ی، nothing، -یم، -ین، -ند* an. So heißt *بیدار شدم* „ich bin aufgewacht“, *بیدار شدی* „du bist aufgewacht“ (zu einem Freund), *بیدار شد* „er/sie ist aufgewacht“, *بیدار شدیم* „wir sind aufgewacht“, *بیدار شدین* „ihr seid aufgewacht“ bzw. „Sie sind aufgewacht“ (formell oder Plural) und *بیدار شدند* „sie sind aufgewacht“. Das Pronomen ist optional, weil die Endung schon zeigt, wer gehandelt hat.'
  prs.a2.unit22.lesson02.teach.take_shower:
    title: Duschen
    gloss: duschen
    note: '*دوش گرفتن* heißt „duschen“. Das Leichtverb ist hier *گرفتن*, „nehmen“. Sein Vergangenheitsstamm ist *گرفت*, also heißt „Ich habe geduscht“ *دوش گرفتم*.'
    example_gloss: Heute Morgen habe ich geduscht.
  prs.a2.unit22.lesson02.teach.take_walk:
    title: Spazieren gehen
    gloss: spazieren gehen, bummeln
    note: '*قدم* ist ein Schritt. *قدم زدن* heißt „spazieren gehen“, zum Vergnügen und ohne Ziel. Das Leichtverb ist *زدن* mit dem Vergangenheitsstamm *زد*: *قدم زدم* heißt „Ich bin spazieren gegangen“. Vergleichen Sie *پیاده رفتن*, „zu Fuß irgendwohin gehen“.'
    example_gloss: Ich bin im Park spazieren gegangen.
  prs.a2.unit22.lesson02.teach.talk:
    title: Reden, sprechen
    gloss: reden, sprechen
    note: '*حرف* ist ein Wort oder eine Rede. *حرف زدن* heißt „reden“, wieder mit *زدن*: *حرف زدم* heißt „Ich habe geredet“.'
    example_gloss: Ich habe mit meinem Freund gesprochen.
  prs.a2.unit22.lesson02.teach.my_friend:
    title: Mein Freund
    gloss: mein Freund
    note: '*دوست* ist ein Freund und *-م* fügt „mein“ hinzu: *دوستم* heißt „mein Freund“. Beim Anrufen setzt man *به* davor: *به دوستم*.'
    example_gloss: Heute Morgen habe ich mit meinem Freund gesprochen.
  prs.a2.unit22.lesson02.teach.phone:
    title: Anrufen
    gloss: anrufen, telefonieren
    note: '*تیلفون* ist das Telefon. *تیلفون کردن* heißt „anrufen“, ein weiteres zusammengesetztes Verb mit *کردن*. Die angerufene Person steht mit *به*: *به دوستم تیلفون کردم*.'
    example_gloss: Ich habe meinen Freund angerufen.
  prs.a2.unit22.lesson02.teach.wait:
    title: Warten
    gloss: 'warten (wörtlich: ein Warten ziehen)'
    note: '*انتظار* ist das Warten. *انتظار کشیدن* heißt „warten“. Das Leichtverb ist *کشیدن*, „ziehen“, mit dem Vergangenheitsstamm *کشید*: *انتظار کشیدم* heißt „Ich habe gewartet“.'
    example_gloss: Ich habe an der Haltestelle gewartet.
  prs.a2.unit22.lesson02.teach.get_on:
    title: Einsteigen
    gloss: einsteigen (in einen Bus, ein Auto)
    note: '*سوار* bedeutet „aufgestiegen“ oder „an Bord“ und *شدن* bedeutet „werden“. *سوار شدن* heißt „in einen Bus oder ein Auto einsteigen“. Das, worin man einsteigt, steht mit *به*: *به بس سوار شدم*.'
    example_gloss: Ich bin in den Bus eingestiegen.
  prs.a2.unit22.lesson02.teach.get_off:
    title: Aussteigen
    gloss: aussteigen
    note: '*پیاده شدن* heißt „aus einem Bus oder Auto aussteigen“. Vorsicht: *پیاده رفتم* heißt „Ich bin zu Fuß gegangen“ und *پیاده شدم* „Ich bin ausgestiegen“. Das Fahrzeug, das man verlässt, steht mit *از*: *از بس پیاده شدم*.'
    example_gloss: Ich bin aus dem Bus ausgestiegen.
  prs.a2.unit22.lesson02.teach.put_on:
    title: Anziehen, tragen
    gloss: anziehen (Kleidung), tragen
    note: '*پوشیدن* heißt „Kleidung anziehen“. Es ist ein einfaches, kein zusammengesetztes Verb: Sein Vergangenheitsstamm ist *پوشید*, also heißt *پوشیدم* „Ich habe angezogen“.'
    example_gloss: Ich habe meine Kleider angezogen.
  prs.a2.unit22.lesson02.teach.close:
    title: Schließen
    gloss: schließen, zumachen
    note: '*بستن* heißt „schließen“ oder „zumachen“. Es ist ein einfaches Verb mit dem Vergangenheitsstamm *بست*, also heißt *بستم* „Ich habe geschlossen“. Es ist das Gegenteil von *باز کردن*.'
    example_gloss: Ich habe das Tor geschlossen.
  prs.a2.unit22.lesson02.teach.arrive:
    title: Ankommen
    gloss: ankommen, erreichen
    note: '*رسیدن* heißt „ankommen“. Der Ort, den man erreicht, steht mit *به*, und der Vergangenheitsstamm ist *رسید*: *به دفتر رسیدم* heißt „Ich bin im Büro angekommen“.'
    example_gloss: Ich bin im Büro angekommen.
  prs.a2.unit22.lesson02.teach.light_verbs:
    title: Fünf Leichtverben und ihre Vergangenheitsstämme
    gloss: ich bin aufgewacht, ich habe geöffnet, ich habe geduscht, ich bin spazieren gegangen, ich habe gewartet
    note: 'Ein zusammengesetztes Verb erhält seine Bedeutung aus beiden Teilen; lernen Sie deshalb das Leichtverb und den ersten Teil zusammen. Diese fünf Leichtverben bilden die meisten zusammengesetzten Verben eines Morgens. *شدن* (Vergangenheitsstamm *شد*) bedeutet „werden“: *بیدار شدم*, *سوار شدم*. *کردن* (*کرد*) bedeutet „tun“ oder „machen“: *باز کردم*, *تیلفون کردم*. *گرفتن* (*گرفت*) bedeutet „nehmen“: *دوش گرفتم*. *زدن* (*زد*) bedeutet „schlagen“, trägt in zusammengesetzten Verben aber nur die Handlung: *قدم زدم*, *حرف زدم*. *کشیدن* (*کشید*) bedeutet „ziehen“: *انتظار کشیدم*. Die Endung wird an den Stamm des Leichtverbs angefügt, genau wie bei *رفتم*. Einfache Verben wie *پوشیدن* (*پوشیدم*), *بستن* (*بستم*) und *رسیدن* (*رسیدم*) haben dieselben Endungen.'
  prs.a2.unit22.lesson03.teach.neg_rule:
    title: 'Verneinung eines zusammengesetzten Verbs: Das ن steht am Leichtverb'
    gloss: ich bin nicht aufgewacht, du bist nicht aufgewacht, er/sie ist nicht aufgewacht, wir sind nicht aufgewacht, ihr/Sie seid/sind nicht aufgewacht (Plural oder höflich), sie sind nicht aufgewacht
    note: 'In Lektion 19 haben Sie *ن* vor ein einfaches Verb im Präteritum gesetzt: *رفتم* wurde zu *نرفتم*. Ein zusammengesetztes Verb besteht aus zwei Teilen, und das *ن* steht am Leichtverb, niemals am ersten Teil. *بیدار شدم* („ich bin aufgewacht“) wird zu *بیدار نشدم* („ich bin nicht aufgewacht“), und die sechs Formen lauten *بیدار نشدم، بیدار نشدی، بیدار نشد، بیدار نشدیم، بیدار نشدین، بیدار نشدند*. Dieselbe Regel gilt für jedes Leichtverb: *نکردم، نگرفتم، نزدم، نکشیدم*. *نبیدار شدم* ist falsch. Einfache Verben verhalten sich wie zuvor: *نپوشیدم، نبستم، نرسیدم*. Im verneinten einfachen Präteritum gibt es weiterhin kein *نمی*.'
  prs.a2.unit22.lesson03.teach.neg_phone_walk:
    title: Dasselbe ن mit fünf Leichtverben
    gloss: ich habe nicht angerufen, ich bin nicht spazieren gegangen, ich habe nicht gewartet, ich habe nicht geduscht, ich habe nicht geöffnet
    note: 'Sehen Sie sich die fünf Leichtverben der letzten Lektion an und setzen Sie *ن* davor: *کردم* ergibt *نکردم* (*تیلفون نکردم*, *باز نکردم*), *زدم* ergibt *نزدم* (*قدم نزدم*), *کشیدم* ergibt *نکشیدم* (*انتظار نکشیدم*), *گرفتم* ergibt *نگرفتم* (*دوش نگرفتم*). Der erste Teil bleibt, wo er war, und das darauffolgende Verb ist verneint.'
  prs.a2.unit22.lesson03.teach.no_breakfast:
    title: Ich habe nicht gefrühstückt
    gloss: Ich habe nicht gefrühstückt.
    note: '*نخوردم* ist *ن* plus *خوردم*. *خوردن* ist ein einfaches Verb, also steht das *ن* vor dem ganzen Verb. In Lektion 19 haben Sie *خوردی* kennengelernt, „du hast gegessen“, zu einem Freund: *صبحانه خوردی؟* heißt „Hast du gefrühstückt?“'
  prs.a2.unit22.lesson03.teach.on_time:
    title: Pünktlich
    gloss: pünktlich
    note: '*وقت* ist die Zeit. *به وقت* heißt „pünktlich“. Es steht vor dem Verb, also heißt *به وقت بیدار نشدم* „Ich bin nicht pünktlich aufgewacht“.'
    example_gloss: Heute Morgen bin ich nicht pünktlich aufgewacht.
  prs.a2.unit22.lesson03.teach.make_tea:
    title: Zubereiten, machen
    gloss: 'zubereiten, machen (wörtlich: richtig machen)'
    note: '*درست* bedeutet „richtig“, und *درست کردن* heißt „etwas zubereiten“, zum Beispiel Tee oder Essen. Es ist ein zusammengesetztes Verb mit *کردن*. Das Objekt steht davor: *چای درست کردم*.'
    example_gloss: Ich habe Tee gemacht.
  prs.a2.unit22.lesson03.teach.ra_rule:
    title: Wo را vor einem zusammengesetzten Verb steht
    gloss: Ich habe das Tor geöffnet. Ich habe das Tor nicht geöffnet. Ich habe meine Kleider nicht angezogen. Ich habe Tee gemacht.
    note: 'Ist das Objekt des Verbs etwas Bestimmtes, also etwas Bekanntes (*دروازه*, das Tor, das Sie jeden Morgen öffnen, oder *لباس‌هایم*, Ihre eigenen Kleider), markiert Dari es mit *را*. Bei einem zusammengesetzten Verb steht *را* direkt nach dem Objekt und vor dem ersten Teil des Verbs: *دروازه را باز کردم*, niemals mitten in *باز کردم*. Das zusammengesetzte Verb bleibt zusammen, und die Verneinung folgt derselben Regel wie bisher: *دروازه را باز نکردم*. Ist das Objekt nicht bestimmt, wie in *چای درست کردم* („Ich habe Tee gemacht“, irgendeinen Tee), steht kein *را*.'
  prs.a2.unit22.lesson04.teach.first:
    title: Zuerst
    gloss: zuerst
    note: '*اول* eröffnet eine Abfolge. Es steht am Anfang des ersten Teilsatzes.'
    example_gloss: Zuerst habe ich geduscht.
  prs.a2.unit22.lesson04.teach.then:
    title: Dann
    gloss: dann, danach
    note: '*بعد* setzt die Abfolge nach *اول* fort. Es steht am Anfang des Teilsatzes, den es einleitet.'
    example_gloss: Dann habe ich meine Kleider angezogen.
  prs.a2.unit22.lesson04.teach.after_that:
    title: Danach
    gloss: danach
    note: '*بعد از آن* bedeutet „danach“. Es ist ein etwas ausführlicheres *بعد* und nützlich, wenn Sie *بعد* schon einmal verwendet haben und einen dritten Schritt haben.'
    example_gloss: Danach habe ich das Tor geschlossen.
  prs.a2.unit22.lesson04.teach.finally:
    title: Schließlich
    gloss: schließlich, am Ende
    note: '*در آخر* beschließt eine Abfolge, nach *اول*، *بعد* und *بعد از آن*. *آخر* bedeutet „das Ende“.'
    example_gloss: Schließlich bin ich im Büro angekommen.
  prs.a2.unit22.lesson04.teach.but:
    title: Aber
    gloss: aber
    note: '*ولی* stellt einen Schritt, den Sie getan haben, einem gegenüber, den Sie nicht getan haben, oder umgekehrt.'
    example_gloss: Ich habe nicht gefrühstückt, aber ich habe Tee getrunken.
  prs.a2.unit22.lesson04.teach.no:
    title: Nein
    gloss: nein
    note: '*نخیر* ist das höfliche, alltägliche „Nein“, mit dem man eine Ja-Nein-Frage beantwortet. Unter Freunden hören Sie auch das kürzere *نی*.'
    example_gloss: Nein, ich habe nicht angerufen.
  prs.a2.unit22.lesson04.teach.start_work:
    title: Anfangen, beginnen
    gloss: anfangen, beginnen
    note: '*شروع* ist ein Beginn und *شروع کردن* heißt „anfangen“. Es ist ein zusammengesetztes Verb mit *کردن*, und *کار* ist die Arbeit: *کار را شروع کردم* heißt „Ich habe die Arbeit begonnen“.'
    example_gloss: Ich habe die Arbeit begonnen.
  prs.a2.unit22.lesson04.teach.order_rule:
    title: Einen Morgen der Reihe nach erzählen
    gloss: Zuerst habe ich geduscht, dann habe ich mich angezogen, danach habe ich das Tor geöffnet und schließlich bin ich zu Fuß ins Büro gegangen.
    note: 'Wenn Sie erzählen, wie ein Morgen verlaufen ist, geben Sie jedem abgeschlossenen Schritt ein eigenes Verb in der Vergangenheit und kennzeichnen die Reihenfolge mit *اول* (zuerst), *بعد* (dann), *بعد از آن* (danach) und *در آخر* (schließlich). Die Schritte stehen in der Reihenfolge, in der sie geschehen sind. Sie werden mit Komma, Punkt oder *و* verbunden: *اول دوش گرفتم، بعد لباس‌هایم را پوشیدم.* Für einen Schritt, der nicht stattgefunden hat, verwenden Sie ein verneintes zusammengesetztes Verb: *بعد از آن تیلفون نکردم.* Das Verbindungswort steht am Anfang seines Satzteils, und das Verb steht am Ende.'
  prs.a2.unit22.lesson05.teach.way:
    title: Weg, Straße
    gloss: Weg, Straße; unterwegs (mit در)
    note: '*راه* ist der Weg oder die Straße. *در راه* heißt unterwegs. Es gibt an, an welcher Stelle der Reise etwas geschah.'
    example_gloss: Unterwegs haben wir uns unterhalten.
  prs.a2.unit22.lesson05.teach.we_form:
    title: 'Gemeinsam handeln: die Endung -یم für „wir“'
    gloss: Mit meiner Freundin bzw. meinem Freund sind wir zu Fuß zur Schule gegangen. Unterwegs haben wir uns unterhalten. Schließlich sind wir in der Schule angekommen.
    note: 'Wenn ein Freund oder eine Freundin die Schritte mit Ihnen gemeinsam macht, wird die Endung *-م* zu *-یم*: *رفتیم* (wir gingen), *حرف زدیم* (wir sprachen), *رسیدیم* (wir kamen an). Bei einem zusammengesetzten Verb steht die Endung weiterhin nur am Verbteil, der das Verb trägt: *حرف زدیم*, nicht *حرف‌یم زد*. Die Verneinung funktioniert genauso: *حرف نزدیم* heißt „wir haben nicht gesprochen“.'
  prs.a2.unit22.lesson05.teach.message:
    title: Soraya schreibt über ihren Morgen
    gloss: Heute Morgen bin ich früh aufgewacht. Zuerst habe ich geduscht und mich angezogen. Dann habe ich gefrühstückt, aber keinen Tee gekocht. Danach habe ich das Tor geöffnet. Mit meiner Freundin bzw. meinem Freund bin ich zu Fuß zur Schule gegangen. Unterwegs haben wir uns unterhalten. Schließlich sind wir in der Schule angekommen.
    note: 'Ein kurzer schriftlicher Bericht in zeitlicher Reihenfolge. Jeder Schritt ist eine abgeschlossene Handlung mit einem Verb in der Vergangenheit; die zusammengesetzten Verben *بیدار شدم*, *دوش گرفتم*, *حرف زدیم* und das verneinte *درست نکردم* behalten alle den Verbteil am Ende. Ein Schritt hat nicht stattgefunden: *چای درست نکردم*.'
  prs.a2.unit22.lesson05.teach.exchange_q:
    title: Naveed fragt Soraya nach dem Tee
    gloss: Soraya, hast du heute Morgen Tee gekocht?
    note: 'Naveed fragt mit der Vergangenheit eines zusammengesetzten Verbs, *درست کردی*, in der du-Form (unter Freunden): Die Endung *-ی* steht am Verbteil.'
  prs.a2.unit22.lesson05.teach.exchange_a:
    title: Soraya antwortet
    gloss: Nein, ich habe keinen Tee gekocht. Ich habe gefrühstückt.
    note: Soraya sagt zuerst, was nicht geschehen ist, *چای درست نکردم*, und dann, was geschehen ist, *صبحانه خوردم*.
  prs.a2.unit22.lesson06.teach.turn01:
    title: Soraya fragt Naveed nach seinem Morgen
    gloss: Naveed, was hast du heute Morgen gemacht?
    note: '*چه کار کردی؟* heißt „Was hast du gemacht?“. Die Frage zielt auf eine abgeschlossene Handlung, deshalb steht die Vergangenheit *کردی*.'
  prs.a2.unit22.lesson06.teach.turn02:
    title: Naveed nennt die ersten Schritte und einen ausgelassenen Schritt
    gloss: Zuerst bin ich spät aufgewacht, dann habe ich geduscht und mich angezogen. Ich habe nicht gefrühstückt.
    note: Naveed verwendet *اول* und *بعد* für die Reihenfolge und endet mit einem verneinten Schritt, *صبحانه نخوردم*.
  prs.a2.unit22.lesson06.teach.turn03:
    title: Soraya fragt, was als Nächstes kam
    gloss: Was hast du danach gemacht?
    note: '*بعد از آن* heißt „danach“, sie fragt also nach dem nächsten Schritt.'
  prs.a2.unit22.lesson06.teach.turn04:
    title: Naveed erzählt, wie er zur Arbeit kam
    gloss: Ich habe das Tor geöffnet und bin zu Fuß zur Haltestelle gegangen. An der Haltestelle habe ich gewartet und bin in den Bus gestiegen.
    note: 'Vier abgeschlossene Schritte mit vier Verben in der Vergangenheit: *باز کردم، رفتم، انتظار کشیدم، سوار شدم*. Beachten Sie *دروازه را باز کردم*: *را* steht direkt nach dem Objekt.'
  prs.a2.unit22.lesson06.teach.turn05:
    title: Soraya fragt nach dem Anruf
    gloss: Hast du mich angerufen?
    note: Eine Ja-Nein-Frage zu einer abgeschlossenen Handlung. *به من* heißt „mir / mich“.
  prs.a2.unit22.lesson06.teach.turn06:
    title: Naveed verneint und beendet seinen Bericht
    gloss: Nein, ich habe nicht angerufen. Aber schließlich bin ich im Büro angekommen.
    note: '*نخیر، تیلفون نکردم* antwortet mit dem verneinten zusammengesetzten Verb. *ولی در آخر* schließt dann den Bericht ab.'
