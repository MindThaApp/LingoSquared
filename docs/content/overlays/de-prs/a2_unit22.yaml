    feedback: '*اول* kennzeichnet den ersten Schritt: *اول دوش گرفتم* heißt „Zuerst habe ich geduscht“. *بعد* leitet den zweiten Schritt ein.'
  prs.a2.unit22.lesson04.exercise02.order_shower_then_clothes:
    instruction: 'Ordnen Sie die Wörter so an, dass sie bedeuten: Zuerst habe ich geduscht, dann habe ich mich angezogen.'
