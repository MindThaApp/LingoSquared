      - را
      - پوشیدم
      status: correct
    feedback: '*اول دوش گرفتم بعد لباس‌هایم را پوشیدم* enthält zwei Schritte, und jeder Schritt hat sein eigenes Verb in der Vergangenheit.'
  prs.a2.unit22.lesson04.exercise03.order_after_that_gate:
    instruction: 'Ordnen Sie die Wörter so an, dass sie bedeuten: Danach habe ich das Tor geöffnet und bin zu Fuß gegangen.'
    accepted_answers:
    - value:
      - بعد
