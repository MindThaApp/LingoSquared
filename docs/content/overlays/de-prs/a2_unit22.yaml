    accepted_answers:
    - value: نگرفتم
      status: correct
    feedback: '*نگرفتم* ist *ن* plus *گرفتم*. Bei *دوش گرفتن* steht das *ن* am Verbteil *گرفتن*.'
  prs.a2.unit22.lesson03.exercise07.translate_not_phoned:
