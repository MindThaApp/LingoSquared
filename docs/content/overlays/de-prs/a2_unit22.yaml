    feedback: '*به دوستم تیلفون نکردم* heißt „Ich habe meinen Freund nicht angerufen“: Das *ن* steht an *کردم*, nicht an *تیلفون*.'
  prs.a2.unit22.lesson04.exercise01.recognize_first_step:
    instruction: Was hat die sprechende Person zuerst gemacht?
