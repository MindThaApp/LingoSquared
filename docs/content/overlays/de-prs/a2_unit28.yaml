    title: Ein Gespräch über eine Besprechung
teaching:
  prs.a2.unit28.lesson01.teach.weather:
    title: Wetter
    gloss: Wetter, Luft
    note: '*هوا* bedeutet „Wetter“ und auch „Luft“. *هوای کابل* ist das Wetter in Kabul: Man hängt *-ی* an das erste Wort, um die beiden Wörter zu verbinden.'
    example_gloss: Das Wetter in Kabul ist heute kalt.
  prs.a2.unit28.lesson01.teach.cold:
    title: Kalt
    gloss: kalt
    note: '*سرد* bedeutet „kalt“. Das Gegenteil ist *گرم* („warm, heiß“), ein Wort, das Sie schon kennen. *هوا سرد است* sagt, dass es jetzt kalt ist; *هوا سرد می‌شود* sagt, dass es kalt wird.'
    example_gloss: Morgen früh wird es kalt.
  prs.a2.unit28.lesson01.teach.sunny:
    title: Sonnig
    gloss: sonnig
    note: '*آفتابی* bedeutet „sonnig“: *هوا آفتابی است* heißt „Es ist ein sonniger Tag“.'
    example_gloss: Heute ist das Wetter sonnig.
  prs.a2.unit28.lesson01.teach.cloudy:
    title: Bewölkt
    gloss: bewölkt
    note: '*ابری* bedeutet „bewölkt“. Wolken kommen oft vor *باران* („Regen“) und *برف* („Schnee“).'
    example_gloss: Heute Abend wird es bewölkt.
  prs.a2.unit28.lesson01.teach.forecast:
    title: Vorhersage
    gloss: Vorhersage, Prognose
    note: '*پیش‌بینی* bedeutet „Vorhersage“ oder „Prognose“. *پیش‌بینی هوا* ist die Wettervorhersage. Dieses Wort hören Sie im Radio, im Fernsehen und am Telefon, bevor Sie eine Reise planen.'
    example_gloss: Ich habe die Wettervorhersage gesehen.
  prs.a2.unit28.lesson01.teach.tonight:
    title: Heute Nacht
    gloss: heute Abend, heute Nacht
    note: '*امشب* bedeutet „heute Abend/heute Nacht“. Es ist ein Zeitwort wie *فردا* („morgen“) und *امروز* („heute“). Es ist das erste der Zeitwörter, mit denen Sie darüber sprechen, was geschehen wird.'
    example_gloss: Heute Nacht regnet es.
  prs.a2.unit28.lesson01.teach.dayafter:
    title: Übermorgen
    gloss: übermorgen
    note: '*پس‌فردا* bedeutet „übermorgen“. Es wird mit einem kleinen Abstand im Wort geschrieben (dem Halbleerraum), wie in *می‌شود*.'
    example_gloss: Übermorgen wird es warm.
  prs.a2.unit28.lesson01.teach.predict_form:
    title: 'Eine Vorhersage: می‌ plus Zeitwort'
    gloss: Morgen regnet es. Heute Abend wird es kalt. Übermorgen ist es sonnig.
    note: 'Um zu sagen, was geschehen wird, verwenden Sie das einfache Präsens mit *می‌* und setzen ein Zeitwort in den Satz. Das Verb ändert sich nicht: *می‌بارد* („es regnet“) und *فردا باران می‌بارد* („morgen regnet es“) enthalten dasselbe Verb. Das Zeitwort *فردا*, *امشب* oder *پس‌فردا* zeigt dem Hörer, dass es um die Zukunft geht. Beim Wetter verwendet man oft *می‌شود* („es wird“): *فردا هوا سرد می‌شود* heißt „Morgen wird es kalt“. Das ist die normale gesprochene Art, etwas vorherzusagen, dessen man sich ziemlich sicher ist.'
  prs.a2.unit28.lesson01.teach.plans_form:
    title: Dieselbe Form für Pläne und Ereignisse
    gloss: Morgen gehe ich zum Basar. Nächste Woche fahren wir nach Bamiyan.
    note: 'Dasselbe Präsens mit *می‌* und einem Zeitwort funktioniert auch bei Personen: *فردا به بازار می‌روم* heißt „Morgen gehe ich zum Basar“, und *هفتهٔ آینده به بامیان می‌رویم* heißt „Nächste Woche fahren wir nach Bamiyan“. Lernen Sie hier die *ما*-Form: *می‌رویم* („wir gehen“). Weitere Zeitwörter: *امسال* („dieses Jahr“), *هفتهٔ آینده* („nächste Woche“), *بعد* („später“).'
  prs.a2.unit28.lesson01.teach.sentence:
    title: Morgen wird es kalt
    gloss: Morgen wird es kalt.
    note: 'Das ist das Muster der ganzen Lektion: ein Zeitwort, ein Subjekt und ein einfaches Verb mit *می‌*. Sie brauchen keine besondere Zukunftsendung.'
  prs.a2.unit28.lesson02.teach.maybe:
    title: Vielleicht
    gloss: vielleicht
    note: '*شاید* bedeutet „vielleicht“. Es steht am Anfang des Satzteils, und das Verb danach steht im Konjunktiv (der Form, die Sie nach *باید* verwenden), weil der Sprecher nicht sicher ist: *شاید برف ببارد* heißt „Vielleicht schneit es“. *ممکن است برف ببارد* bedeutet dasselbe.'
    example_gloss: Vielleicht regnet es morgen.
  prs.a2.unit28.lesson02.teach.probably:
    title: Wahrscheinlich
    gloss: wahrscheinlich
    note: '*احتمالاً* ist stärker als *شاید*: Sie halten es für eher wahrscheinlich als unwahrscheinlich. Es steht mit dem einfachen Präsens, nicht mit dem Konjunktiv: *احتمالاً امشب برف می‌بارد*.'
    example_gloss: Heute Nacht schneit es wahrscheinlich.
  prs.a2.unit28.lesson02.teach.possible:
    title: Es könnte schneien
    gloss: Es könnte schneien.
    note: '*ممکن است* bedeutet „es ist möglich, dass“. Wie *شاید* wird es vom Konjunktiv gefolgt: *ممکن است برف ببارد*.'
  prs.a2.unit28.lesson02.teach.subj_form:
    title: 'Der Konjunktiv: ب plus Präsensstamm'
    gloss: dass ich gehe, dass du gehst, dass er geht, dass wir gehen, dass ihr/Sie gehen (höflich oder Plural), dass sie gehen
    note: 'Der Konjunktiv besteht aus dem Präsensstamm mit *ب* davor und denselben Endungen wie im Präsens: *می‌روم* („ich gehe“) wird zu *بروم* („dass ich gehe“). Die Endungen sind *-م، -ی، -د، -یم، -ین، -ند*, also *بروم، بروی، برود، برویم، بروین، بروند*. Die Form kennen Sie schon von *باید*; *شاید* verwendet dieselbe. Setzen Sie kein *می‌* davor.'
  prs.a2.unit28.lesson02.teach.subj_more:
    title: Der Konjunktiv anderer Verben
    gloss: Vielleicht kommt er. Vielleicht kommt der Bus an. Vielleicht schneit es. Vielleicht geht es kaputt.
    note: 'Dieselbe Regel gilt für jedes Verb: *آمدن* ergibt *بیاید* („dass er kommt“), *رسیدن* ergibt *برسد* („dass er ankommt“), *باریدن* ergibt *ببارد* („dass es schneit/regnet“). *شدن* hat die kurze Form *شود*, deshalb sagt man *شاید خراب شود* („vielleicht geht es kaputt“). Bei *بودن* lautet der Konjunktiv *باشد*: *شاید در خانه باشد* („vielleicht ist er zu Hause“).'
  prs.a2.unit28.lesson02.teach.subj_negative:
    title: 'Die Verneinung: ن vor dem Konjunktiv'
    gloss: Vielleicht kommt er nicht. Vielleicht gehen wir nicht. Vielleicht schneit es nicht.
    note: 'Für „vielleicht nicht“ setzen Sie *ن* vor den Konjunktiv und lassen das *ب* weg: *بروم* wird zu *نروم*, *برویم* wird zu *نرویم*, *ببارد* wird zu *نبارد*. Merken Sie sich vor allem das Verb *آمدن*: Die Verneinung ist *نیاید* (nicht *نبیاید*).'
  prs.a2.unit28.lesson02.teach.sentence:
    title: Vielleicht schneit es morgen
    gloss: Vielleicht schneit es morgen.
    note: Vergleichen Sie mit *فردا برف می‌بارد*. Dieser Satz sagt, dass es schneien wird; der andere sagt, dass es schneien könnte.
  prs.a2.unit28.lesson02.teach.sure_vs_maybe:
    title: Sicher oder nicht sicher
    gloss: Er kommt morgen. Vielleicht kommt er morgen.
    note: 'Das Verb zeigt dem Hörer, wie sicher Sie sind. Mit *می‌* sind Sie sicher: *فردا می‌آید* heißt „Er kommt morgen“. Mit *شاید* steht das Verb im Konjunktiv, und Sie sind nicht sicher: *شاید فردا بیاید* heißt „Vielleicht kommt er morgen“.'
  prs.a2.unit28.lesson03.teach.surely:
    title: Bestimmt
    gloss: bestimmt, auf jeden Fall
    note: '*حتماً* bedeutet „bestimmt“ oder „auf jeden Fall“. Setzen Sie es vor ein einfaches Verb mit *می‌*, um ein Versprechen oder einen festen Entschluss auszudrücken: *حتماً می‌آیم* heißt „Ich komme bestimmt“.'
    example_gloss: Ich komme morgen bestimmt.
  prs.a2.unit28.lesson03.teach.promise_word:
    title: Versprechen
    gloss: Versprechen, Wort
    note: '*قول* bedeutet „Versprechen“. *قول می‌دهم* heißt „Ich verspreche es“, wörtlich „ich gebe ein Versprechen“. Sie können *که* und einen Nebensatz anfügen: *قول می‌دهم که می‌آیم*.'
    example_gloss: Ich verspreche, dass ich komme.
  prs.a2.unit28.lesson03.teach.give_promise:
    title: Ich verspreche es
    gloss: Ich verspreche es.
    note: '*می‌دهم* heißt „ich gebe“. Sie kennen schon *می‌دهین* („Sie geben/ihr gebt“); das hier ist die *من*-Form. Sagen Sie *قول می‌دهم*, wenn die andere Person Ihnen vertrauen soll.'
  prs.a2.unit28.lesson03.teach.forget:
    title: Vergessen
    gloss: vergessen
    note: '*فراموش کردن* bedeutet „vergessen“. Ein Versprechen endet oft mit *فراموش نمی‌کنم* („ich vergesse es nicht“).'
    example_gloss: Ich vergesse meinen Schlüssel nicht.
  prs.a2.unit28.lesson03.teach.later:
    title: Später
    gloss: später, danach
    note: '*بعداً* bedeutet „später“. Es ist ein Zeitwort für ein Versprechen, das Sie bald, aber nicht jetzt halten.'
    example_gloss: Ich rufe später an.
  prs.a2.unit28.lesson03.teach.promise_form:
    title: 'Ein Versprechen: حتماً plus einfaches Präsens'
    gloss: Ich komme bestimmt. Ich rufe bestimmt an. Ich helfe bestimmt. Ich schicke es bestimmt.
    note: 'Ein Versprechen besteht aus zwei Teilen: *حتماً* und einem einfachen Verb mit *می‌* in der *من*-Form. Es gibt keine besondere Form. Das Zeitwort kann stehen oder fehlen: *حتماً امشب تیلفون می‌کنم* heißt „Ich rufe heute Abend bestimmt an“. Bei einem Versprechen an jemanden können Sie *قول می‌دهم* voranstellen.'
  prs.a2.unit28.lesson03.teach.you_come_q:
    title: Kommen Sie?
    gloss: Kommst du? Wirst du kommen?
    note: '*می‌آیی* heißt „du kommst“, zu einem Freund gesagt. Das Präsens mit *می‌* fragt nach der Zukunft ebenso, wie es sie ausdrückt: *تو می‌آیی؟* heißt „Kommst du?“. Die Antwort ist oft ein Versprechen: *حتماً می‌آیم*.'
  prs.a2.unit28.lesson03.teach.negative_promise:
    title: Ein Versprechen, etwas nicht zu tun
    gloss: Ich komme nicht mehr zu spät. Ich vergesse es nie.
    note: 'Um zu versprechen, dass Sie etwas nicht tun, verwenden Sie *نمی‌* im selben Muster: *دیگر دیر نمی‌آیم* heißt „Ich komme nicht mehr zu spät“, und *هرگز فراموش نمی‌کنم* heißt „Ich vergesse es nie“. *دیگر* mit einem verneinten Verb bedeutet „nicht mehr“.'
  prs.a2.unit28.lesson03.teach.sentence:
    title: Ich rufe heute Abend bestimmt an
    gloss: Ich rufe heute Abend bestimmt an.
    note: 'Ein Versprechen mit Zeitwort: *حتماً*, *امشب* und *تیلفون می‌کنم*.'
  prs.a2.unit28.lesson04.teach.important:
    title: Wichtig
    gloss: wichtig
    note: '*مهم* bedeutet „wichtig“. Eine *جلسه مهم* ist eine wichtige Besprechung, zu der man ein Kommen verspricht.'
    example_gloss: Heute gibt es eine wichtige Besprechung.
  prs.a2.unit28.lesson04.teach.ladder:
    title: Von sicher bis nicht sicher
    gloss: Er kommt bestimmt. Er kommt wahrscheinlich. Vielleicht kommt er. Er kommt möglicherweise nicht.
    note: 'Wählen Sie das Wort danach, wie sicher Sie sind. *حتماً* und ein einfaches Verb mit *می‌*: sicher. *احتمالاً* und ein einfaches Präsensverb: wahrscheinlich. *شاید* und der Konjunktiv: vielleicht. *ممکن است* und der Konjunktiv: möglich, auch verneint: *ممکن است نیاید* („er kommt möglicherweise nicht“).'
  prs.a2.unit28.lesson04.teach.maybe_but:
    title: Vielleicht spät, aber ein Versprechen
    gloss: Vielleicht komme ich spät, aber ich komme bestimmt.
    note: 'Sie können „vielleicht“ und ein Versprechen mit *ولی* („aber“) verbinden: *شاید دیر برسم، ولی حتماً می‌آیم*. Der erste Teil sagt, wessen Sie sich nicht sicher sein können, der zweite Teil ist Ihr Versprechen. Verwenden Sie *شاید* für das, was Sie nicht beeinflussen können, und *حتماً* für das, was Sie beeinflussen können.'
  prs.a2.unit28.lesson04.teach.meeting_tomorrow:
    title: Morgen ist Besprechung
    gloss: Morgen ist eine Besprechung. Kommst du?
    note: Eine Frage zu morgen steht im Präsens mit einem Zeitwort. Die beste Antwort ist ein Versprechen mit *حتماً*.
  prs.a2.unit28.lesson05.teach.future_written:
    title: 'Das geschriebene Futur: nur zum Erkennen'
    gloss: Das Wetter wird kalt sein. Es wird schneien. Der Bus wird abfahren. Der Bus wird nicht fahren.
    note: 'In Nachrichten, Vorhersagen und Bekanntmachungen lesen Sie ein geschriebenes Futur: *خواهد* plus den kurzen Infinitiv, wie in *سرد خواهد بود* („es wird kalt sein“), *خواهد بارید* („es wird regnen/schneien“), *حرکت خواهد کرد* („er wird abfahren“). Die Verneinung ist *نخواهد*: *نخواهد رفت* („er wird nicht fahren“). Diese Form müssen Sie nur beim Lesen verstehen. Wenn Sie sprechen oder einem Freund schreiben, verwenden Sie die Form, die Sie gelernt haben: *فردا برف می‌بارد* und *حتماً می‌روم*.'
  prs.a2.unit28.lesson05.teach.forecast_reading:
    title: Eine Wettervorhersage
    gloss: 'Wettervorhersage: Am Freitag wird das Wetter in Bamiyan kalt sein. Vielleicht schneit es. Nächste Woche wird es sonnig.'
    note: Eine kurze Vorhersage aus dem Radio. Der erste Satz verwendet das geschriebene Futur *خواهد بود*. Der zweite verwendet *شاید* und den Konjunktiv, weil der Schnee nicht sicher ist. Der dritte verwendet das einfache *می‌شود* mit einem Zeitwort. Zusammen zeigen sie, wie eine Vorhersage „sicher“, „nicht sicher“ und „nächste Woche“ ausdrückt.
  prs.a2.unit28.lesson05.teach.notice_reading:
    title: Eine Bekanntmachung für Fahrgäste
    gloss: 'Bekanntmachung für die Fahrgäste nach Bamiyan: Nächste Woche, am Freitag um acht Uhr, fährt der Bus vom Busbahnhof ab. Bitte seien Sie um sieben Uhr am Busbahnhof. Der Bus fährt nicht verspätet ab.'
    note: 'Eine Bekanntmachung am Busbahnhof. Sie verwendet das geschriebene Futur *حرکت خواهد کرد* und die Verneinung *حرکت نخواهد کرد* für den Plan sowie eine höfliche Bitte mit *لطفاً* und dem Konjunktiv *باشین* („Sie seien“). Die Zeit ist *ساعت هشت*: Der Bus fährt um acht Uhr ab, und die Fahrgäste müssen eine Stunde früher kommen.'
  prs.a2.unit28.lesson05.teach.d1_t1:
    title: Basira fragt nach der Vorhersage
    gloss: Nader, hast du die Wettervorhersage für Freitag gesehen?
    note: Basira fragt mit dem einfachen Präteritum *دیدی* nach der Vorhersage. *هوای جمعه* ist das Wetter am Freitag.
  prs.a2.unit28.lesson05.teach.d1_t2:
    title: Nader gibt die Vorhersage wieder
    gloss: Ja. Am Freitag wird es kalt, und vielleicht schneit es.
    note: 'Nader verwendet beide Formen in einem Satz: das einfache *می‌شود* für die Kälte, die sicher ist, und *شاید* mit *ببارد* für den Schnee, der nicht sicher ist.'
  prs.a2.unit28.lesson05.teach.d1_t3:
    title: Basira überlegt, dass es besser sein könnte, nicht zu fahren
    gloss: Dann fahren wir am Freitag vielleicht nicht nach Bamiyan.
    note: '*شاید* mit dem verneinten Konjunktiv *نرویم* heißt „vielleicht gehen/fahren wir nicht“.'
  prs.a2.unit28.lesson05.teach.d1_t4:
    title: Nader schlägt nächste Woche vor
    gloss: Ja. Wir fahren nächste Woche. Das Wetter wird sonnig.
    note: Nader verschiebt den Ausflug mit dem einfachen *می‌رویم* und einer Zeitangabe auf *هفتهٔ آینده*.
  prs.a2.unit28.lesson05.teach.d1_t5:
    title: Basira stimmt zu
    gloss: Gut. Nächste Woche fahren wir ganz bestimmt.
    note: 'Basira antwortet mit *حتماً*: Sie ist sich für nächste Woche sicher.'
  prs.a2.unit28.lesson05.teach.d1_t6:
    title: Nader gibt ein Versprechen
    gloss: Ich verspreche es.
    note: Nader schließt mit *قول می‌دهم*, einem Versprechen.
  prs.a2.unit28.lesson06.teach.d2_t1:
    title: Basira fragt Nader
    gloss: Nader, morgen ist eine wichtige Besprechung. Kommst du?
    note: Basira verwendet das Präsens mit *فردا*, um nach morgen zu fragen. Die Besprechung ist *مهم*, deshalb möchte sie eine verbindliche Antwort.
  prs.a2.unit28.lesson06.teach.d2_t2:
    title: Nader verspricht es, mit einem Zweifel
    gloss: Ich komme ganz bestimmt. Aber vielleicht komme ich zu spät, weil viel Verkehr ist.
    note: Nader verspricht mit *حتماً می‌آیم* sein Kommen und sagt dann mit *شاید دیر برسم*, was er nicht sicher weiß. *چون* nennt den Grund.
  prs.a2.unit28.lesson06.teach.d2_t3:
    title: Basira bittet um einen Anruf
    gloss: Kein Problem. Rufst du heute Abend an?
    note: 'Basira nimmt das Risiko der Verspätung mit *مشکلی نیست* hin und bittet um ein weiteres Versprechen: einen Anruf heute Abend.'
  prs.a2.unit28.lesson06.teach.d2_t4:
    title: Nader verspricht anzurufen
    gloss: Ich verspreche es. Ich rufe heute Abend ganz bestimmt an. Ich vergesse es nicht.
    note: 'Drei Versprechen hintereinander: *قول می‌دهم*, *حتماً امشب تیلفون می‌کنم* und *فراموش نمی‌کنم*.'
exercises:
  prs.a2.unit28.lesson01.exercise01.recognize_snow_tomorrow:
    instruction: Was bedeutet dieser Satz?
    correct_option: Morgen schneit es
    distractors:
    - Gestern hat es geschneit
    - In Kabul schneit es nie
    - Ich mag Schnee
    accepted_answers:
    - value: Morgen schneit es
      status: correct
    feedback: '*فردا برف می‌بارد* heißt „Morgen schneit es“: das einfache Präsens *می‌بارد* plus die Zeitangabe *فردا*.'
  prs.a2.unit28.lesson01.exercise02.recognize_cold_tonight:
    instruction: Was bedeutet dieser Satz?
    correct_option: Heute Abend wird es kalt
    distractors:
    - Heute Abend wird es warm
    - Gestern Abend war es kalt
    - Das Wetter ist jetzt sonnig
    accepted_answers:
    - value: Heute Abend wird es kalt
      status: correct
    feedback: '*امشب* heißt „heute Abend“ und *سرد می‌شود* heißt „es wird kalt“: *امشب هوا سرد می‌شود*.'
  prs.a2.unit28.lesson01.exercise03.match_weather_words:
    instruction: Ordnen Sie jedem Dari-Wort seine Bedeutung zu.
    accepted_answers:
    - value:
        هوا: Wetter
        سرد: kalt
        گرم: warm
        آفتابی: sonnig
        ابری: bewölkt
        باران: Regen
        برف: Schnee
        باد: Wind
        پیش‌بینی: Vorhersage
        امشب: heute Abend
        پس‌فردا: übermorgen
        فردا: morgen
      status: correct
    feedback: Das sind die Wetterwörter und die Zeitangaben für Vorhersagen. Mit *امشب*, *فردا* und *پس‌فردا* sprechen Sie im Satz über die Zukunft.
    pairs:
    - left: هوا
      right: Wetter
    - left: سرد
