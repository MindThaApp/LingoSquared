course:
  title: Dari A2
  description: 'Dari (Afghanistan) für Fortgeschrittene auf unterem Niveau: Vorhersagen treffen und Versprechen machen. Das einfache Präsens mit Zeitangabe (فردا باران می‌بارد), „vielleicht“ und „wahrscheinlich“ mit dem Konjunktiv, Versprechen mit حتماً und قول می‌دهم sowie das schriftsprachliche Futur zum Lesen von Vorhersagen und Bekanntmachungen.'
units:
  prs.a2.unit28.predictions_promises:
    title: Vorhersagen und Versprechen
