course:
  title: Dari A2
  description: 'Afghanisches Dari für die untere Mittelstufe: einfache Ratschläge zu Gesundheit, Lernen und Geld mit dem Subjunktiv geben und darauf antworten. Sanfte Ratschläge mit بهتر است که, bestimmte Ratschläge mit باید und نباید, höfliche Vorschläge mit پیشنهاد می‌کنم که, Fragen danach, was zu tun ist, sowie Ratschläge annehmen, bezweifeln oder ablehnen.'
units:
  prs.a2.unit32.giving_advice:
    title: Ratschläge geben
lessons:
  prs.a2.unit32.lesson01.better_to_go:
    title: Es ist besser, wenn du zum Arzt gehst
  prs.a2.unit32.lesson02.must_and_must_not:
    title: Müssen und nicht dürfen
  prs.a2.unit32.lesson03.i_suggest:
    title: Ich schlage vor, dass
  prs.a2.unit32.lesson04.ask_and_answer:
    title: Um Rat bitten und Rat geben
  prs.a2.unit32.lesson05.reading_and_listening:
    title: Lesen und Hören zum Thema Gesundheit
  prs.a2.unit32.lesson06.money_conversation:
    title: Ein Gespräch über Geld
teaching:
  prs.a2.unit32.lesson01.teach.doctor:
    title: Arzt / Ärztin
    gloss: Arzt/Ärztin
    note: '*داکتر* ist das afghanische Wort für „Arzt“. Um zum Arzt zu gehen, sagt man *به داکتر رفتن*: *به داکتر می‌روم* bedeutet „Ich gehe zum Arzt“.'
    example_gloss: Der Arzt ist heute in der Praxis.
  prs.a2.unit32.lesson01.teach.medicine:
    title: Medikament
    gloss: Medikament
    note: '*دوا* bedeutet „Medizin, Medikament“. Man trinkt oder nimmt es nicht: Im Dari „isst“ man es, *دوا خوردن*. *دوا را می‌خورم* bedeutet „Ich nehme das Medikament ein“.'
    example_gloss: Ich nehme das Medikament nach dem Essen ein.
  prs.a2.unit32.lesson01.teach.sick:
    title: Krank
    gloss: krank
    note: '*مریض* bedeutet „krank“. *مریض استم* heißt „Ich bin krank“ und *او مریض است* heißt „Er/Sie ist krank“.'
    example_gloss: Mein Bruder ist krank.
  prs.a2.unit32.lesson01.teach.rest:
    title: Sich ausruhen
    gloss: sich ausruhen
    note: '*استراحت کردن* bedeutet „sich ausruhen“. Es ist ein zweiteiliges Verb: *استراحت* bleibt vorn, nur *کردن* verändert sich, wie in *استراحت می‌کنم* („Ich ruhe mich aus“).'
    example_gloss: Nach der Arbeit ruhe ich mich aus.
  prs.a2.unit32.lesson01.teach.sleep:
    title: Schlafen
    gloss: schlafen, ins Bett gehen
    note: '*خوابیدن* bedeutet „schlafen“ oder „ins Bett gehen“. *شب‌ها* heißt „nachts, abends“: *شب‌ها زود می‌خوابم* bedeutet „Abends gehe ich früh ins Bett“. *دیر خوابیدن* heißt „spät ins Bett gehen“.'
    example_gloss: Früh ins Bett zu gehen ist wichtig.
  prs.a2.unit32.lesson01.teach.head:
    title: Mir tut der Kopf weh
    gloss: Mir tut der Kopf weh.
    note: 'Wenn ein Körperteil wehtut, hängen Sie *-م* an den Körperteil und fügen *درد می‌کند* hinzu: *سرم درد می‌کند* („Mein Kopf tut weh“). Das ist das übliche Problem, bei dem Ihnen ein Freund einen Rat gibt.'
  prs.a2.unit32.lesson01.teach.stem:
    title: 'Ratschläge stehen im Subjunktiv: Imperativ plus ی'
    gloss: 'geh: dass du gehst; iss: dass du isst; schlaf: dass du schläfst; ruh dich aus: dass du dich ausruhst'
    note: 'Für Ratschläge verwendet man eine Verbform, die Subjunktiv heißt. Für einen Freund (*تو*) ist sie einfach: Nehmen Sie den Imperativ, den Sie einem Freund gegenüber verwenden, und hängen Sie *ی* an. *برو* („geh“) ergibt *بروی*, *بخور* („iss“) ergibt *بخوری*, *بخواب* („schlaf“) ergibt *بخوابی*, *استراحت کن* („ruh dich aus“) ergibt *استراحت کنی*. Bei den meisten Verben beginnt der Imperativ mit *ب-*; Verben mit *کردن* haben in dieser Lektion kein *ب-* (*کن*, nicht *بکن*).'
  prs.a2.unit32.lesson01.teach.paradigm:
    title: 'Der Subjunktiv von رفتن: alle sechs Personen'
    gloss: dass ich gehe, dass du gehst (Freund), dass er/sie geht, dass wir gehen, dass Sie/ihr geht (formell oder Plural), dass sie gehen
    note: 'Der Imperativstamm *برو* erhält diese Endungen: *بروم* (ich), *بروی* (du, zu einem Freund), *برود* (er/sie), *برویم* (wir), *بروین* (Sie/ihr, formell oder Plural), *بروند* (sie). Die Endungen lauten *-م، -ی، -د، -یم، -ین، -ند*. In dieser Lektion wird die Endung der 2. Person Plural wie im restlichen Kurs als *-ین* geschrieben. Der Subjunktiv sagt nichts über die Zeit: Den Sinn ergibt der Ratschlag oder das Hauptverb im Satz.'
  prs.a2.unit32.lesson01.teach.better:
    title: Ratschläge geben mit بهتر است که
    gloss: Es ist besser, wenn du zum Arzt gehst.
    note: '*بهتر است* („es ist besser“) plus *که* plus Subjunktiv ist die sanfte, freundliche Art, einen Rat zu geben: *بهتر است که به داکتر بروی* bedeutet „Es ist besser, wenn du zum Arzt gehst“. Das Wort *که* kann entfallen: *بهتر است به داکتر بروی* bedeutet dasselbe. In dieser Lektion steht immer das volle *است*; eine kürzere Form gibt es im geschriebenen Dari des Kurses nicht. Wer handeln soll, zeigt nur die Endung des Subjunktivs: *بروی* heißt „du“.'
  prs.a2.unit32.lesson01.teach.better_more:
    title: Weitere Ratschläge für einen kranken Freund
    gloss: Es ist besser, wenn du das Medikament einnimmst. Es ist besser, wenn du ins Bett gehst. Es ist besser, wenn du dich ausruhst.
    note: 'Dasselbe Muster mit anderen Verben: *دوا بخوری* („dass du das Medikament einnimmst“), *بخوابی* („dass du ins Bett gehst“), *استراحت کنی* („dass du dich ausruhst“). Nur das Verb am Ende ändert sich; *بهتر است که* bleibt gleich.'
  prs.a2.unit32.lesson01.teach.neg:
    title: 'Die Verneinung: ن statt ب'
    gloss: Es ist besser, wenn du nicht gehst. Es ist besser, wenn du nicht spät ins Bett gehst.
    note: 'Um zu sagen, was ein Freund nicht tun soll, setzen Sie *ن-* anstelle von *ب-*: Aus *بروی* wird *نروی*, aus *بخوری* wird *نخوری*, aus *بخوابی* wird *نخوابی*. Bei Verben mit *کردن* lautet die Verneinung *نکنی*. Also bedeutet *بهتر است که دیر نخوابی* „Es ist besser, wenn du nicht spät ins Bett gehst“.'
  prs.a2.unit32.lesson01.teach.formal:
    title: 'Rat an eine Person, die man respektiert: ین'
    gloss: Es ist besser, wenn Sie zum Arzt gehen. (formell oder Plural)
    note: 'Bei jemandem, den Sie respektieren – einer älteren Person, einem Fremden – oder bei mehreren Personen verwenden Sie *شما* und die Endung *-ین*: *بروین، بخورین، بخوابین، کنین*. *بهتر است که شما به داکتر بروین* bedeutet „Es ist besser, wenn Sie zum Arzt gehen“. Bei einem Freund verwenden Sie *بروی*.'
  prs.a2.unit32.lesson01.teach.water:
    title: Trink viel Wasser
    gloss: Es ist besser, wenn du viel Wasser trinkst.
    note: 'Im Dari „isst“ man Wasser genauso wie Medizin: *آب خوردن* heißt „Wasser trinken“. *آب زیاد* bedeutet „viel Wasser“. Ein sehr häufiger Rat für einen kranken Freund.'
  prs.a2.unit32.lesson02.teach.lesson:
    title: Lektion, lernen
    gloss: Lektion, Schularbeit
    note: '*درس* bedeutet „Lektion“ oder „Schularbeit“. *درس خواندن* heißt „lernen“ (wörtlich „eine Lektion lesen“): *درس می‌خوانم* bedeutet „Ich lerne“.'
    example_gloss: Ich lerne jeden Tag.
  prs.a2.unit32.lesson02.teach.exam:
    title: Prüfung
    gloss: Prüfung, Test
    note: '*امتحان* bedeutet „Prüfung“ oder „Test“. Ratschläge zum Lernen beziehen sich sehr oft auf einen bevorstehenden *امتحان*.'
    example_gloss: Meine Prüfung ist morgen.
  prs.a2.unit32.lesson02.teach.book:
    title: Buch
    gloss: Buch
    note: '*کتاب* bedeutet „Buch“. Mit *-م* heißt es „mein“: *کتابم*. Der Plural wird *کتاب‌ها* geschrieben.'
    example_gloss: Mein Buch ist in der Schule.
  prs.a2.unit32.lesson02.teach.review:
    title: Wiederholen, durchgehen
    gloss: wiederholen, noch einmal durchgehen
    note: '*تکرار کردن* bedeutet „wiederholen“ oder „etwas noch einmal durchgehen“. Es ist der übliche Rat vor einer Prüfung: *درس را تکرار کن*.'
    example_gloss: Jeden Abend gehe ich die Lektion noch einmal durch.
  prs.a2.unit32.lesson02.teach.early:
    title: Früh, bald
    gloss: früh, bald
    note: '*زود* bedeutet „früh“ oder „bald“. *زود خوابیدن* heißt „früh ins Bett gehen“, und *صبح زود* heißt „früh am Morgen“.'
    example_gloss: Früh am Morgen gehe ich in die Schule.
  prs.a2.unit32.lesson02.teach.late:
    title: Zu spät
    gloss: zu spät
    note: '*دیر* bedeutet „spät“; es ist das Gegenteil von *زود*. *دیر خوابیدن* heißt „spät ins Bett gehen“.'
    example_gloss: Heute ist er/sie zu spät gekommen.
  prs.a2.unit32.lesson02.teach.must:
    title: 'باید plus Subjunktiv: müssen'
    gloss: Du musst jeden Tag lernen.
    note: 'Auch auf *باید* („müssen“) folgt der Subjunktiv: *باید هر روز درس بخوانی* bedeutet „Du musst jeden Tag lernen“. *باید* verändert sich nie; die Endung des Subjunktivs zeigt, wer gemeint ist. *باید* ist stärker als *بهتر است که*: Es drückt eine Pflicht oder eine klare Notwendigkeit aus. Die Wortstellung ist frei: *هر روز باید درس بخوانی* ist ebenfalls richtig.'
  prs.a2.unit32.lesson02.teach.must_paradigm:
    title: باید mit allen sechs Personen
    gloss: ich muss gehen, du musst gehen, er/sie muss gehen, wir müssen gehen, Sie/ihr müssen/müsst gehen (formell oder Plural), sie müssen gehen
    note: 'Nur die Endung des Subjunktivs ändert sich: *باید بروم* („ich muss gehen“), *باید بروی* („du musst gehen“), *باید برود* („er/sie muss gehen“), *باید برویم* („wir müssen gehen“), *باید بروین* („Sie müssen / ihr müsst gehen“, formell oder Plural), *باید بروند* („sie müssen gehen“).'
  prs.a2.unit32.lesson02.teach.must_not:
    title: 'نباید: nicht dürfen'
    gloss: Du darfst nicht spät ins Bett gehen.
    note: '*نباید* („nicht dürfen“) ist *باید* mit vorangestelltem *ن-*. Das folgende Verb bleibt bejaht: *نباید دیر بخوابی* bedeutet „Du darfst nicht spät ins Bett gehen“. Fügen Sie kein zweites *ن-* hinzu: Es heißt *نباید بخوابی*, nicht *نباید نخوابی*.'
  prs.a2.unit32.lesson02.teach.soft_strong:
    title: Sanfter und starker Rat
    gloss: Es ist besser, wenn du früh ins Bett gehst. Du musst früh ins Bett gehen.
    note: Beide Sätze geben denselben Rat, aber unterschiedlich stark. *بهتر است که زود بخوابی* ist freundlich und weich, etwa „Es wäre besser, wenn …“. *باید زود بخوابی* ist bestimmt, etwa „Du musst wirklich …“. Verwenden Sie *بهتر است که* bei einem Freund, wenn Sie nur etwas raten, und *باید*, wenn es wichtig ist, zum Beispiel vor einer Prüfung.
  prs.a2.unit32.lesson02.teach.review_adv:
    title: Rat vor einer Prüfung
    gloss: Es ist besser, wenn du die Lektion wiederholst.
    note: 'Das, woran man arbeitet, steht mit *را* vor dem Verb: *درس را تکرار کنی* („dass du die Lektion wiederholst“). Es ist ein guter Lernrat.'
  prs.a2.unit32.lesson03.teach.money:
    title: Geld
    gloss: Geld
    note: '*پول* bedeutet „Geld“. *پولم* heißt „mein Geld“. *پولم کم است* bedeutet „Ich habe nicht viel Geld“.'
    example_gloss: Ich habe nicht viel Geld.
  prs.a2.unit32.lesson03.teach.spend:
    title: Ausgeben
    gloss: ausgeben
    note: '*خرج کردن* bedeutet „Geld ausgeben“. Das Geld steht vor dem Verb: *پول خرج کردن*. *زیاد خرج کردن* heißt „viel ausgeben“.'
    example_gloss: Jeden Monat gibt er/sie viel Geld aus.
  prs.a2.unit32.lesson03.teach.save:
    title: Sparen
    gloss: sparen (Geld)
    note: '*پس‌انداز کردن* bedeutet „Geld sparen“. Wie *خرج کردن* ist es ein zweiteiliges Verb. *پس‌انداز* wird mit dem kleinen Zwischenraum zwischen *پس* und *انداز* geschrieben.'
    example_gloss: Jeden Monat spare ich ein wenig Geld.
  prs.a2.unit32.lesson03.teach.expensive:
    title: Teuer
    gloss: teuer
    note: '*گران* bedeutet „teuer“. Das Gegenteil ist *ارزان* („billig“).'
    example_gloss: Dieses Auto ist teuer.
  prs.a2.unit32.lesson03.teach.cheap:
    title: Billig
    gloss: billig
    note: '*ارزان* bedeutet „billig“. Das Gegenteil ist *گران*.'
    example_gloss: Dieses Buch ist billig.
  prs.a2.unit32.lesson03.teach.month:
    title: Monat
    gloss: Monat
    note: '*ماه* bedeutet „Monat“. *هر ماه* heißt „jeden Monat“. Es ist ein nützliches Wort, wenn man über Geld spricht, denn viele Menschen bekommen und geben Geld jeden Monat aus.'
    example_gloss: Jeden Monat gehe ich zur Bank.
  prs.a2.unit32.lesson03.teach.suggest:
    title: پیشنهاد می‌کنم که plus Subjunktiv
    gloss: Ich schlage vor, dass du jeden Monat Geld sparst.
    note: '*پیشنهاد می‌کنم* bedeutet „ich schlage vor“, und *که* plus Subjunktiv sagt, was Sie vorschlagen: *پیشنهاد می‌کنم که هر ماه پول پس‌انداز کنی* bedeutet „Ich schlage vor, dass du jeden Monat Geld sparst“. Das Verb *می‌کنم* hat das *می‌* und die Endung *-م* (ich). Das Verb nach *که* steht wieder im Subjunktiv: *پس‌انداز کنی*. Um gemeinsam etwas vorzuschlagen, sagen Sie *پیشنهاد می‌کنیم که* („wir schlagen vor, dass“).'
  prs.a2.unit32.lesson03.teach.three:
    title: Drei Möglichkeiten, denselben Rat zu geben
    gloss: Es ist besser, wenn du Geld sparst. Du musst Geld sparen. Ich schlage vor, dass du Geld sparst.
    note: Sie kennen jetzt drei Muster, die alle den Subjunktiv verlangen. *بهتر است که* ist sanft und freundschaftlich. *باید* ist bestimmt. *پیشنهاد می‌کنم که* ist höflich und klar; es klingt wie ein Vorschlag von jemandem, der Sie respektiert, und man verwendet es, wenn man der Person nicht nahesteht.
  prs.a2.unit32.lesson03.teach.we_suggest:
    title: Wir schlagen vor
    gloss: Wir schlagen vor, dass du früh ins Bett gehst.
    note: 'Für „wir“ wird die Endung von *می‌کنم* zu *-یم*: *پیشنهاد می‌کنیم* bedeutet „wir schlagen vor“. Verwenden Sie es, wenn Sie für eine Gruppe sprechen, zum Beispiel für eine Familie oder ein Team.'
  prs.a2.unit32.lesson03.teach.suggest_neg:
    title: Vorschlagen, was man nicht tun soll
    gloss: Ich schlage vor, dass du nicht viel Geld ausgibst.
    note: 'Nach *پیشنهاد می‌کنم که* verwenden Sie den verneinten Subjunktiv für das, was man nicht tun soll: *نکنی* von *کردن*, *نخری* von *خریدن*. Der Teil *می‌کنم* bleibt bejaht: Sie schlagen etwas vor, und das Vorgeschlagene ist verneint.'
  prs.a2.unit32.lesson03.teach.expensive_things:
    title: Kauf keine teuren Sachen
    gloss: Ich schlage vor, dass du keine teuren Sachen kaufst.
    note: '*چیزهای گران* bedeutet „teure Sachen“: Der Plural von *چیز* ist *چیزها*, und ein verbindendes *-ی* knüpft das nachfolgende Adjektiv an. *نخری* ist die Verneinung von *بخری* („dass du kaufst“), von *خریدن*.'
  prs.a2.unit32.lesson04.teach.what_do:
    title: Was soll ich tun?
    gloss: Was soll ich tun?
    note: 'Auch um Rat zu bitten, verwendet man den Subjunktiv: *چه کار کنم؟* bedeutet „Was soll ich tun?“ (nicht „Was tue ich?“). Der Plural ist *چه کار کنیم؟* („Was sollen wir tun?“). Nennen Sie zuerst das Problem, dann fragen Sie: *سرم درد می‌کند. چه کار کنم؟*'
  prs.a2.unit32.lesson04.teach.your_view:
    title: An eine Person, die man respektiert
    gloss: Was soll ich Ihrer Meinung nach tun?
    note: '*به نظر شما* bedeutet „Ihrer Meinung nach“. Bei einer älteren Person oder einem Fremden ist es die höfliche Art, um Rat zu bitten: *به نظر شما چه کار کنم؟*. Dann kann die andere Person mit *بهتر است که* oder *پیشنهاد می‌کنم که* antworten.'
  prs.a2.unit32.lesson04.teach.what_suggest:
    title: Was schlagen Sie vor?
    gloss: Was schlagen Sie vor?
    note: '*شما چه پیشنهاد می‌کنین؟* fragt jemanden, den Sie respektieren, was er vorschlägt. Es verwendet die Endung *-ین* von *شما*. Bei einem Freund sagen Sie *تو چه پیشنهاد می‌کنی؟*.'
  prs.a2.unit32.lesson04.teach.accept:
    title: Den Rat annehmen
    gloss: Das ist eine gute Idee. Genau das werde ich tun.
    note: '*فکر خوبی است* bedeutet „Das ist eine gute Idee“. *همین کار را می‌کنم* bedeutet „Genau das werde ich tun“. Das Präsens *می‌کنم* drückt auch aus, was Sie vorhaben. Verwenden Sie diese beiden Sätze, wenn Sie dem Rat folgen möchten.'
  prs.a2.unit32.lesson04.teach.thanks:
    title: Sich für einen Rat bedanken
    gloss: Danke für deinen Vorschlag.
    note: '*از پیشنهادت ممنون* heißt „Danke für deinen Vorschlag“. *پیشنهادت* ist *پیشنهاد* mit der Endung *-ت*, „dein“. So beenden Sie das Gespräch nach einem Rat freundlich.'
  prs.a2.unit32.lesson04.teach.decline:
    title: Sagen, dass man etwas nicht kann
    gloss: Ich kann nicht, weil ich keine Zeit habe.
    note: 'Wenn Sie einen Rat nicht befolgen können, sagen Sie das und nennen Sie den Grund: *نمی‌توانم، چون وقت ندارم* heißt „Ich kann nicht, weil ich keine Zeit habe“. *می‌توانم* heißt „ich kann“, *نمی‌توانم* „ich kann nicht“. Der Grund steht nach *چون*.'
  prs.a2.unit32.lesson04.teach.maybe:
    title: Sanfterer Rat mit شاید und dem Konjunktiv von بودن
    gloss: Vielleicht wäre es besser, wenn du dich ausruhst. Vielleicht stimmt das.
    note: Nach *شاید* („vielleicht“) steht der Konjunktiv. Der Konjunktiv von *بودن* lautet *باشم، باشی، باشد، باشیم، باشین، باشند*. *شاید بهتر باشد که استراحت کنی* heißt also „Vielleicht wäre es besser, wenn du dich ausruhst“ – ein sehr sanfter Rat. Auf einen Rat können Sie auch mit *شاید درست باشد* („vielleicht stimmt das“) reagieren, wenn Sie noch nicht sicher sind. *ممکن است درست باشد* („es kann sein, dass das stimmt“) bedeutet fast dasselbe.
  prs.a2.unit32.lesson04.teach.agree:
    title: Zustimmen
    gloss: Das stimmt. Genau das mache ich.
    note: '*درست است* heißt „Das stimmt“. Nach einem Rat bedeutet es, dass Sie zustimmen. Zusammen mit *همین کار را می‌کنم* ist es ein klares Ja.'
  prs.a2.unit32.lesson05.teach.three:
    title: Drei
    gloss: drei
    note: '*سه* heißt „drei“. *سه روز* sind „drei Tage“. Ein Arzt sagt oft, wie viele Tage Sie sich ausruhen müssen.'
    example_gloss: Ich war drei Tage in Kabul.
  prs.a2.unit32.lesson05.teach.said:
    title: Er/Sie sagte
    gloss: er/sie sagte
    note: '*گفت* ist die Vergangenheitsform von *گفتن* („sagen“) für er/sie. Nach *گفت* folgt ein kurzer Satz, etwa in *داکتر گفت: ...* („Der Arzt sagte: ...“).'
    example_gloss: 'Er sagte: Ich komme morgen.'
  prs.a2.unit32.lesson05.teach.please_wait:
    title: Warten, geduldig sein
    gloss: warten, geduldig sein
    note: '*صبر کردن* heißt „warten“ oder „geduldig sein“. *نباید صبر کنی* heißt „Du sollst nicht warten“, also: Tu es sofort.'
    example_gloss: Warte ein wenig.
  prs.a2.unit32.lesson05.teach.dlg1_turn01:
    title: Jamila sagt, was los ist
    gloss: Zakaria, mein Kopf tut weh und ich schlafe nachts schlecht. Was soll ich tun?
    note: Jamila beschreibt das Problem mit *سرم درد می‌کند* und *خوب نمی‌خوابم* („ich schlafe nicht gut“) und bittet dann mit *چه کار کنم؟* um Rat.
  prs.a2.unit32.lesson05.teach.dlg1_turn02:
    title: Zakaria gibt zwei Ratschläge
    gloss: Es ist besser, wenn du zum Arzt gehst. Du musst viel Wasser trinken.
    note: Zakaria verwendet zuerst das sanfte *بهتر است که به داکتر بروی*, dann das festere *باید آب زیاد بخوری*. Er spricht mit einer Freundin, deshalb steht die Endung *-ی*.
  prs.a2.unit32.lesson05.teach.dlg1_turn03:
    title: Jamila stimmt zu und plant für morgen
    gloss: Das ist eine gute Idee. Morgen gehe ich zum Arzt.
    note: 'Jamila stimmt mit *فکر خوبی است* zu. Sie plant, morgen zu gehen: *فردا به داکتر می‌روم* – das Präsens mit einer Zeitangabe.'
  prs.a2.unit32.lesson05.teach.dlg1_turn04:
    title: 'Zakaria sagt: Geh heute'
    gloss: Ich schlage vor, dass du heute gehst. Du darfst nicht warten.
    note: 'Zakaria sagt, dass es dringend ist: *پیشنهاد می‌کنم که امروز بروی*, und mit *نباید صبر کنی* fügt er hinzu: Warte nicht. Beachten Sie, dass er *به داکتر* nicht wiederholt, weil es klar ist.'
  prs.a2.unit32.lesson05.teach.dlg1_turn05:
    title: Jamila stimmt zu
    gloss: Na gut, ich gehe heute. Danke.
    note: 'Jamila ändert ihren Plan auf heute: *امروز می‌روم*. Sie schließt höflich mit *ممنون*.'
  prs.a2.unit32.lesson05.teach.message:
    title: Eine Nachricht nach dem Arztbesuch
    gloss: 'Hallo Zakaria. Danke für deinen Vorschlag. Heute war ich beim Arzt. Der Arzt sagte: Es ist besser, wenn du dich drei Tage ausruhst, und du musst Medizin nehmen. Du darfst abends nicht spät schlafen gehen. Morgen gehe ich nicht zur Schule.'
    note: 'Jamila schreibt die nächste Nachricht. Der Arzt hat mit denselben drei Mustern Rat gegeben: *بهتر است که* (drei Tage ausruhen), *باید* (Medizin nehmen) und *نباید* (nicht spät schlafen gehen). Der Rat wird nach *گفت:* in derselben Form wiedergegeben.'
  prs.a2.unit32.lesson06.teach.start:
    title: Anfangen
    gloss: anfangen, beginnen
    note: '*شروع کردن* heißt „anfangen“. *از امروز شروع می‌کنم* heißt „Ich fange heute an“ – ein Versprechen, nachdem man einen Rat angenommen hat.'
    example_gloss: Ich fange morgen an.
  prs.a2.unit32.lesson06.teach.only:
    title: Nur, bloß
    gloss: nur
    note: '*فقط* heißt „nur“ oder „bloß“. *فقط چیزهای مهم* sind „nur die wichtigen Dinge“.'
    example_gloss: Ich habe nur ein Buch.
  prs.a2.unit32.lesson06.teach.dlg2_turn01:
    title: Zakaria sagt, was los ist
    gloss: Jamila, ich habe wenig Geld und gebe jeden Monat viel aus. Was soll ich tun?
    note: 'Zakaria nennt das Problem in zwei Teilen: *پولم کم است* und *هر ماه زیاد خرج می‌کنم*. Dann bittet er um Rat: *چه کار کنم؟*.'
  prs.a2.unit32.lesson06.teach.dlg2_turn02:
    title: Jamila schlägt vor zu sparen
    gloss: Ich schlage vor, dass du jeden Monat ein wenig Geld sparst.
    note: Jamila verwendet das höfliche Muster *پیشنهاد می‌کنم که* mit dem Konjunktiv *پس‌انداز کنی*. *کمی* heißt „ein wenig“.
  prs.a2.unit32.lesson06.teach.dlg2_turn03:
    title: Zakaria sagt, dass er es nicht kann
    gloss: Das ist eine gute Idee, aber ich kann nicht. Alles ist teuer.
    note: 'Zakaria sagt, die Idee sei gut, nennt aber einen Grund, warum er sie nicht umsetzen kann: *همه چیز گران است* („alles ist teuer“).'
  prs.a2.unit32.lesson06.teach.dlg2_turn04:
    title: Jamila rät, was man nicht kaufen soll
    gloss: Dann darfst du keine teuren Dinge kaufen. Es ist besser, wenn du nur wichtige Dinge kaufst.
    note: 'Jamila ändert den Rat: *نباید چیزهای گران بخری* (eine feste Regel) und *بهتر است که فقط چیزهای مهم بخری* (ein sanfter Vorschlag).'
  prs.a2.unit32.lesson06.teach.dlg2_turn05:
    title: Zakaria stimmt zu und fängt an
    gloss: Das stimmt. Ich fange heute an. Danke.
    note: 'Zakaria stimmt mit *درست است* zu und verspricht: *از امروز شروع می‌کنم*.'
