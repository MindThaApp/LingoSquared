    target_text: شما (Sie, formell)
  prs.a1.unit38.lesson04.teach.dialogue_line1:
    title: 'Homayoun: Zarmina, welche Farbe hat dein Auto?'
    gloss: Zarmina, welche Farbe hat dein Auto?
  prs.a1.unit38.lesson04.teach.dialogue_line2:
    title: 'Zarmina: Mein Auto ist blau.'
    gloss: Mein Auto ist blau.
  prs.a1.unit38.lesson04.teach.dialogue_line3:
    title: 'Homayoun: Welche Farbe hat dein Hemd?'
    gloss: Welche Farbe hat dein Hemd?
  prs.a1.unit38.lesson04.teach.dialogue_line4:
    title: 'Zarmina: Mein Hemd ist grün und weiß.'
    gloss: Mein Hemd ist grün und weiß.
  prs.a1.unit38.lesson04.teach.dialogue_line5:
    title: 'Homayoun: Welche Farbe magst du?'
    gloss: Welche Farbe magst du?
  prs.a1.unit38.lesson04.teach.dialogue_line6:
    title: 'Zarmina: Ich mag die Farbe Blau.'
    gloss: Ich mag die Farbe Blau.
  prs.a1.unit38.lesson05.teach.review_reading_words:
    title: 'Wiederholung: er/sie, Zimmer, Tisch, er/sie mag'
    gloss: er/sie / Zimmer / Tisch / er/sie mag
    note: او, اتاق und میز sind Wiederholungswörter; دوست دارد ist die Form der dritten Person von دوست داشتن (mögen), die in diesem Kurs bereits für andere Personen vorkam.
    target_text: او (er/sie) / اتاق (Zimmer) / میز (Tisch) / دوست دارد (er/sie mag)
  prs.a1.unit38.lesson05.teach.reading_passage:
    title: Lesetext über Zarminas Haus
    gloss: Das ist Zarminas Haus. Ihr Haus ist weiß und blau. Ihr Zimmer ist grün. Ihr Tisch ist braun. Sie mag die Farbe Grün.
  prs.a1.unit38.lesson06.teach.review_like_dislike:
    title: 'Wiederholung: ich mag, ich mag nicht'
    gloss: ich mag / ich mag nicht
    note: دوست دارم und دوست ندارم sind die bejahte und die verneinte Form von دوست داشتن (mögen), die in lesson03 eingeführt wurden und in dieser Abschlusslektion mit اما einander gegenübergestellt werden.
    target_text: دوست دارم (ich mag) / دوست ندارم (ich mag nicht)
  prs.a1.unit38.lesson06.teach.contrast_phrase:
    title: Ich mag Rot, aber ich mag kein Schwarz
    gloss: Ich mag Rot, aber ich mag Schwarz nicht.
    note: 'اما drückt einen Gegensatz aus: Man mag eine Farbe, eine andere dagegen nicht. Dafür stehen دوست دارم und دوست ندارم zusammen im Satz.'
  prs.a1.unit38.lesson06.teach.formal_question_phrase:
    title: Welche Farbe mögen Sie?
    gloss: Welche Farbe mögen Sie?
    note: Hier kommt شما (Sie, höflich) zur bekannten Frage aus Lektion 03/04 hinzu. Nun wird die Frage direkt an Sie gerichtet.
