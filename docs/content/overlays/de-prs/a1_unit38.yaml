teaching:
  prs.a1.unit38.lesson01.teach.review_basics:
    title: 'Wiederholung: Farbe, ist, schwarz, weiß, rot'
    gloss: Farbe / ist / schwarz / weiß / rot
    note: رنگ, است, سیاه, سفید und سرخ sind Wörter zur Wiederholung, die in dieser Einheit immer wieder vorkommen.
    target_text: رنگ (Farbe) / است (ist) / سیاه (schwarz) / سفید (weiß) / سرخ (rot)
  prs.a1.unit38.lesson01.teach.review_objects:
    title: 'Wiederholung: dieser, Hemd, Auto, Buch, ich, und, aber'
    gloss: dieser / Hemd / Auto / Buch / ich / und / aber
    note: این, پیراهن, موتر, کتاب, من, و und اما sind Wörter zur Wiederholung, mit denen die Farbsätze dieser Einheit gebildet werden.
    target_text: این (dies/dieser) / پیراهن (Hemd) / موتر (Auto) / کتاب (Buch) / من (ich) / و (und) / اما (aber)
  prs.a1.unit38.lesson01.teach.abi_word:
    title: Blau
    gloss: blau
    note: آبی ist das übliche dari Wort für Blau.
    example_gloss: Das Auto ist blau.
  prs.a1.unit38.lesson01.teach.zard_word:
    title: Gelb
    gloss: gelb
    note: زرد bedeutet gelb.
    example_gloss: Dieses Hemd ist gelb.
  prs.a1.unit38.lesson01.teach.sabz_word:
    title: Grün
    gloss: grün
    note: سبز bedeutet grün.
    example_gloss: Das Buch ist grün.
  prs.a1.unit38.lesson01.teach.narenji_word:
