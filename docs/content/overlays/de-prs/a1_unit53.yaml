    title: 'Wiederholung: Ihre Eintrittskarte, wie viel'
    gloss: Ihre Eintrittskarte / wie viel
    note: „Ihre Eintrittskarte“ verwendet dasselbe höfliche Suffix wie „Ihre Schwimmbadkarte“ in Lektion 50 und „Ihre Kinokarte“ in Lektion 52.
    target_text: تکت‌تان (Ihre Eintrittskarte) / چند (wie viel)
  prs.a1.unit53.lesson06.teach.your_ticket_question_phrase:
    title: Wie viel kostet Ihre Eintrittskarte?
    gloss: Wie viel kostet Ihre Eintrittskarte?
    note: Das ist die höfliche Form mit Suffix, um nach dem Preis einer Museumskarte zu fragen.
