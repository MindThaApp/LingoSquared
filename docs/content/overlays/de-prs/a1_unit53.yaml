  prs.a1.unit53.lesson06.wrap_up:
    title: Zusammenfassung
teaching:
  prs.a1.unit53.lesson01.teach.review_this_is_in_good:
    title: 'Wiederholung: dies, ist, in, gut'
    gloss: dies / ist / in / gut
    note: Das sind Wörter zur Wiederholung (in diesem Kurs durchgehend verwendet), um über das Museum zu sprechen.
    target_text: این (dieser/diese/dieses) / است (ist) / در (in) / خوب (gut)
  prs.a1.unit53.lesson01.teach.museum_word:
    title: Museum
    gloss: Museum
    note: Das ist das übliche afghanische Dari-Wort für „Museum“; es unterscheidet sich vom iranisch-persischen موزه.
    example_gloss: Das Museum ist gut.
  prs.a1.unit53.lesson01.teach.review_staff_word:
    title: 'Wiederholung: Mitarbeiter'
    gloss: Mitarbeiter
    note: Das ist dasselbe allgemeine Wort für Angestellte, das schon im Kino und im Schwimmbad vorkam; hier wird es für den Kartenschalter im Museum wiederverwendet.
    target_text: کارمند (Mitarbeiter)
  prs.a1.unit53.lesson01.teach.this_is_museum_phrase:
    title: Das ist ein Museum
    gloss: Das ist ein Museum.
    note: Hier werden „dies“, „ist“ und „Museum“ so verbunden, wie es in diesem Kurs schon an anderer Stelle geschehen ist.
  prs.a1.unit53.lesson01.teach.staff_at_museum_phrase:
    title: Der Mitarbeiter ist im Museum
    gloss: Der Mitarbeiter ist im Museum.
    note: Hier werden „Mitarbeiter“, „in“ und „Museum“ verbunden.
  prs.a1.unit53.lesson02.teach.review_price_and_exhibit_words:
    title: 'Wiederholung: wie viel, Afghani, ist, vierzig, in, Foto, interessant, Eintrittskarte'
    gloss: wie viel / Afghani / ist / vierzig / in / Foto / interessant / Eintrittskarte
    note: Das sind Wörter zur Wiederholung (aus früheren Lektionen), um über Preis und Ausstellung des Museums zu sprechen.
    target_text: چند (wie viel) / افغانی (Afghani) / است (ist) / چهل (vierzig) / در (in) / عکس (Foto) / جالب (interessant) / تکت (Eintrittskarte)
  prs.a1.unit53.lesson02.teach.exhibition_word:
    title: Ausstellung
    gloss: Ausstellung
    note: Das ist ein gängiges Dari-/persisches Wort für „Ausstellung“ – نمایش („Vorführung“) plus گاه („Ort“).
    example_gloss: Die Fotoausstellung ist interessant.
  prs.a1.unit53.lesson02.teach.museum_notice_reading:
    title: Den Museumsaushang lesen
    gloss: Im Museum gibt es eine Fotoausstellung. Die Eintrittskarte kostet 40 Afghani.
  prs.a1.unit53.lesson02.teach.ask_museum_ticket_price_phrase:
    title: Wie viel kostet die Eintrittskarte für das Museum?
    gloss: Wie viel kostet die Eintrittskarte für das Museum?
    note: Hier werden die Wörter aus dieser Lektion verbunden.
  prs.a1.unit53.lesson02.teach.museum_ticket_price_answer_phrase:
    title: Die Eintrittskarte kostet 40 Afghani
    gloss: Die Eintrittskarte kostet 40 Afghani.
    note: Das nennt den Eintrittspreis des Museums aus dem Aushang.
  prs.a1.unit53.lesson03.teach.review_ask_want_setup:
    title: 'Wiederholung: Sie (formell), was ist, ich, ich möchte, ein/eine'
    gloss: Sie (formell) / was ist / ich / ich möchte / ein/eine
    note: Das sind Wörter zur Wiederholung, um zu fragen und zu sagen, was man möchte.
    target_text: شما (Sie, höflich) / چیست (was ist) / من (ich) / می‌خواهم (ich möchte) / یک (ein/eine)
  prs.a1.unit53.lesson03.teach.review_exhibition_word:
    title: 'Wiederholung: Ausstellung'
    gloss: Ausstellung
    note: Das ist ein Wiederholungswort, um zu fragen, was die Ausstellung ist.
    target_text: نمایشگاه (Ausstellung)
  prs.a1.unit53.lesson03.teach.ask_exhibition_phrase:
    title: Was ist die Ausstellung?
    gloss: Was ist die Ausstellung?
    note: Hier wird das in diesem Kurs bereits bekannte Fragemuster „Was ist …?“ auf die Ausstellung angewendet.
  prs.a1.unit53.lesson03.teach.exhibition_is_photos_phrase:
    title: Die Ausstellung zeigt Fotos
    gloss: Die Ausstellung zeigt Fotos.
    note: Das nennt das Thema der Ausstellung.
  prs.a1.unit53.lesson03.teach.review_ticket_please:
    title: 'Wiederholung: Eintrittskarte, bitte'
    gloss: Eintrittskarte / bitte
    note: Das sind Wörter zur Wiederholung, um nach einer Eintrittskarte zu fragen.
    target_text: تکت (Eintrittskarte) / لطفاً (bitte)
  prs.a1.unit53.lesson03.teach.want_ticket_please_phrase:
    title: Ich möchte eine Eintrittskarte, bitte
    gloss: Ich möchte eine Eintrittskarte, bitte.
    note: Hier werden „Eintrittskarte“, „möchten“ und „bitte“ verbunden.
  prs.a1.unit53.lesson04.teach.review_hello_want_ticket:
    title: 'Wiederholung: hallo, ein/eine, Eintrittskarte, ich möchte'
    gloss: hallo / ein/eine / Eintrittskarte / ich möchte
    note: Das sind Wörter zur Wiederholung, um den Dialog zu eröffnen.
    target_text: سلام (Hallo) / یک (ein/eine) / تکت (Eintrittskarte) / می‌خواهم (ich möchte)
  prs.a1.unit53.lesson04.teach.review_welcome_open_hours:
    title: 'Wiederholung: bitte sehr, Museum, ab, Uhr, neun, geöffnet'
    gloss: bitte sehr / Museum / ab / Uhr / neun / geöffnet
    note: Das sind Wörter zur Wiederholung, um die Öffnungszeit des Museums zu nennen.
    target_text: بفرمایین (bitte sehr) / موزیم (Museum) / از (von) / ساعت (Uhr) / نه (neun) / باز (offen)
  prs.a1.unit53.lesson04.teach.review_ask_exhibition:
    title: 'Wiederholung: Ausstellung, was ist'
    gloss: Ausstellung / was ist
    note: Das sind Wörter zur Wiederholung, um nach der Ausstellung zu fragen.
    target_text: نمایشگاه (Ausstellung) / چیست (was ist)
  prs.a1.unit53.lesson04.teach.review_photos_and_price:
    title: 'Wiederholung: Foto, vierzig, Afghani, ist'
    gloss: Foto / vierzig / Afghani / ist
    note: Das sind Wörter zur Wiederholung, um das Thema der Ausstellung und den Eintrittspreis zu nennen.
    target_text: عکس (Foto) / چهل (vierzig) / افغانی (Afghani) / است (ist)
  prs.a1.unit53.lesson04.teach.review_thanks_welcome:
    title: 'Wiederholung: vielen Dank, gern geschehen'
    gloss: vielen Dank / gern geschehen
    note: Das sind Wörter zur Wiederholung, um den Dialog zu beenden.
    target_text: تشکر زیاد (vielen Dank) / خواهش می‌کنم (bitte, gern geschehen)
  prs.a1.unit53.lesson04.teach.dialogue_line1:
    title: 'Homayoun: Hallo. Ich möchte eine Eintrittskarte.'
    gloss: Hallo. Ich möchte eine Eintrittskarte.
  prs.a1.unit53.lesson04.teach.dialogue_line2:
    title: 'Mitarbeiter: Hallo, bitte sehr. Das Museum ist ab neun Uhr geöffnet.'
    gloss: Hallo, bitte sehr. Das Museum ist ab neun Uhr geöffnet.
  prs.a1.unit53.lesson04.teach.dialogue_line3:
    title: 'Homayoun: Was ist die Ausstellung?'
    gloss: Was ist die Ausstellung?
  prs.a1.unit53.lesson04.teach.dialogue_line4:
    title: 'Mitarbeiter: Die Ausstellung zeigt Fotos. Die Eintrittskarte kostet 40 Afghani.'
    gloss: Die Ausstellung zeigt Fotos. Die Eintrittskarte kostet 40 Afghani.
  prs.a1.unit53.lesson04.teach.dialogue_line5:
    title: 'Homayoun: Vielen Dank.'
    gloss: Vielen Dank.
  prs.a1.unit53.lesson04.teach.dialogue_line6:
    title: 'Mitarbeiter: Gern geschehen.'
    gloss: Gern geschehen.
  prs.a1.unit53.lesson05.teach.review_this_is_in_museum:
    title: 'Wiederholung: dies, ist, in, Museum'
    gloss: dies / ist / in / Museum
    note: Das sind Wörter zur Wiederholung, die im Lesetext vorkommen.
    target_text: این (dieser/diese/dieses) / است (ist) / در (in) / موزیم (Museum)
  prs.a1.unit53.lesson05.teach.review_he_exhibition_photo_object_interesting:
    title: 'Wiederholung: er/sie, Ausstellung, Foto, Objektmarker, interessant'
    gloss: er/sie / Ausstellung / Foto / (Objektmarker) / interessant
    note: Das sind Wörter zur Wiederholung, die im Lesetext vorkommen.
    target_text: او (er/sie) / نمایشگاه (Ausstellung) / عکس (Foto) / را (Objektmarker) / جالب (interessant)
