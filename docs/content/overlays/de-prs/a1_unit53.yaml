    title: Das Museum ist um 9 geöffnet, aber um 5 geschlossen
    gloss: Das Museum ist um neun Uhr geöffnet, aber um fünf Uhr geschlossen.
    note: „Aber“ stellt die Öffnungs- und die Schließzeit des Museums einander gegenüber.
