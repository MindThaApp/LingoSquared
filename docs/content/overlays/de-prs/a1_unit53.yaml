    title: Sah
    gloss: sah
    note: Das ist die Form der dritten Person Vergangenheit desselben Verbs, das schon als „ich sah“ vorkam.
    example_gloss: Er/Sie sah die Ausstellung.
  prs.a1.unit53.lesson05.teach.reading_passage:
    title: Über das Museum lesen
    gloss: Homayoun ist im Museum. Er sah die Fotoausstellung. Die Ausstellung ist interessant.
