course:
  title: Dari in Deutsch A1
  description: 'Kabuler Dari für Anfänger: ein Museum besuchen, über eine Ausstellung und den Eintrittspreis lesen, eine Eintrittskarte kaufen, nach den Öffnungszeiten fragen und einfach über das Gesehene sprechen.'
units:
  prs.a1.unit53.museum:
    title: Museum
    description: Ein Museum besuchen, eine Eintrittskarte kaufen, nach einer Ausstellung oder den Öffnungszeiten fragen und einfach über das Gesehene sprechen.
lessons:
  prs.a1.unit53.lesson01.museum_and_staff_vocabulary:
