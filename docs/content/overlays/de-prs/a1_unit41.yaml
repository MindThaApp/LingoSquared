course:
  title: Dari in Deutsch A1
  description: 'Dari für Anfänger (Kabul): Sie melden einen verlorenen Gegenstand, fragen, ob er gefunden wurde, beschreiben ihn nach Farbe und Größe und lesen einen kurzen Text über einen Fundgegenstand.'
units:
  prs.a1.unit41.lost_items:
    title: Verlorene Gegenstände
    description: Einen verlorenen Gegenstand melden, fragen, ob er gefunden wurde, ihn beschreiben und ihn erkennen, wenn er wieder da ist.
