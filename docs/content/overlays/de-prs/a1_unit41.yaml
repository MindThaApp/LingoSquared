teaching:
  prs.a1.unit41.lesson01.teach.review_this_is:
    title: 'Wiederholung: dies, ist'
    gloss: dies / ist
    note: این und است sind frühe Wiederholungswörter, mit denen man sagt, was etwas ist.
    target_text: این (dies) / است (ist)
  prs.a1.unit41.lesson01.teach.review_have:
    title: 'Wiederholung: ich habe'
    gloss: ich habe
    note: دارم ist ein Wiederholungswort, mit dem man sagt, welchen Gegenstand man besitzt oder bei sich hat.
    target_text: دارم (ich habe)
  prs.a1.unit41.lesson01.teach.bag_word:
    title: Tasche
    gloss: Tasche
    note: خریطه ist das gebräuchliche Dari-Wort für eine Tasche.
    example_gloss: Ich habe eine Tasche.
  prs.a1.unit41.lesson01.teach.wallet_word:
    title: Portemonnaie
    gloss: Portemonnaie
    note: کیف پول bedeutet Portemonnaie und setzt sich wörtlich aus کیف (Tasche/Etui) und پول (Geld) zusammen.
    example_gloss: Ich habe ein Portemonnaie.
  prs.a1.unit41.lesson01.teach.key_word:
    title: Schlüssel
    gloss: Schlüssel
    note: کلید bedeutet Schlüssel.
    example_gloss: Ich habe einen Schlüssel.
  prs.a1.unit41.lesson01.teach.glasses_word:
    title: Brille
    gloss: Brille
    note: عینک bedeutet Brille.
    example_gloss: Ich habe eine Brille.
  prs.a1.unit41.lesson01.teach.lost_word:
    title: Ist verloren
    gloss: ist verloren
    note: گم شده verbindet گم (verloren) mit شده (geworden) – die übliche Art zu sagen, dass etwas verloren ist, nach demselben Muster wie زخمی است (ist verletzt) aus Lektion 40.
    example_gloss: Meine Tasche ist weg.
  prs.a1.unit41.lesson01.teach.wallet_lost_phrase:
    title: Mein Portemonnaie ist weg!
    gloss: Mein Portemonnaie ist weg!
    note: کیف پولم verbindet کیف پول mit der Possessivendung -م (mein), nach demselben Muster wie خانه‌ام (mein Zuhause) aus früheren Lektionen.
  prs.a1.unit41.lesson02.teach.review_can_help:
    title: 'Wiederholung: können Sie, mich, Hilfe, tun (höflicher Imperativ)'
    gloss: können Sie / mich / Hilfe / tun
    note: می‌توانین, مه ره, کمک und کنین ergeben zusammen eine Bitte um Hilfe.
    target_text: می‌توانین (können Sie) / مه ره (mich) / کمک (Hilfe) / کنین (machen Sie – höfliche Aufforderung)
  prs.a1.unit41.lesson02.teach.review_ra:
    title: 'Wiederholung: (Objektmarker)'
    gloss: (Objektmarker)
    note: را markiert das, worauf sich die Handlung richtet – hier das, was gesehen wurde.
    target_text: را (Objektmarker)
  prs.a1.unit41.lesson02.teach.did_you_see_word:
    title: Haben Sie gesehen?
    gloss: haben Sie gesehen
    note: دیدین ist die höfliche Vergangenheitsform der 2. Person Plural von دیدن (sehen), das schon in Lektion 2 in از دیدن شما خوشحال شدم vorkam.
    example_gloss: Haben Sie meine Tasche gesehen?
  prs.a1.unit41.lesson02.teach.did_you_see_my_bag_phrase:
    title: Haben Sie meine Tasche gesehen?
    gloss: Haben Sie meine Tasche gesehen?
    note: Verbindet خریطه‌ام (meine Tasche) mit را und دیدین, um zu fragen, ob jemand sie bemerkt hat.
