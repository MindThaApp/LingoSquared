  prs.a1.unit41.lesson04.teach.dialogue_line1:
    title: 'Homayoun: Zarmina, meine Tasche ist weg!'
    gloss: Zarmina, meine Tasche ist weg!
  prs.a1.unit41.lesson04.teach.dialogue_line2:
    title: 'Zarmina: Welche Farbe hat sie?'
    gloss: Welche Farbe hat sie?
  prs.a1.unit41.lesson04.teach.dialogue_line3:
    title: 'Homayoun: Sie ist schwarz.'
    gloss: Sie ist schwarz.
