course:
  title: Dari in Deutsch A1
  description: 'Dari für Anfänger (Kabul): Vokabeln zu Hobbys und Freizeit (lesen, Musik hören, Filme schauen, spazieren gehen, kochen), die Frage nach den Freizeitvorlieben mit دوست دارین, Häufigkeitsangaben mit هر هفته/آخر هفته und ein Dialog zwischen Zarmina und Homayoun, in dem beide vergleichen, wie sie ihre Freizeit verbringen.'
