course:
  title: Dari A2
  description: 'Afghanisches Dari, untere Mittelstufe: In einer Nachricht einen Grund und eine Folge nennen. Gründe mit چون (und زیرا zum Lesen), Folgen mit به همین دلیل / برای همین und بنابراین sowie به دلیل plus Nomen, dazu Wortschatz für Ausreden und Planänderungen.'
units:
  prs.a2.unit34.because_so:
    title: Weil und deshalb
lessons:
  prs.a2.unit34.lesson01.ask_and_give_reasons:
    title: Warum? Weil …
  prs.a2.unit34.lesson02.order_and_not_coming:
    title: Reihenfolge der Teilsätze und „Ich bin nicht gekommen“
  prs.a2.unit34.lesson03.because_of_this:
    title: 'Deshalb: به همین دلیل und برای همین'
  prs.a2.unit34.lesson04.because_of_and_therefore:
    title: به دلیل, بنابراین und زیرا
  prs.a2.unit34.lesson05.reading_and_listening:
    title: 'Lesen und Hören: Gründe'
  prs.a2.unit34.lesson06.change_of_plan:
    title: Ein Gespräch über die Planänderung
teaching:
  prs.a2.unit34.lesson01.teach.headache:
    title: Kopfschmerzen
    gloss: Kopfschmerzen
    note: '*سردرد* bedeutet „Kopfschmerzen“. Man sagt *سردرد دارم* (ich habe Kopfschmerzen) und *سردرد داشتم* (ich hatte Kopfschmerzen). Das ist ein sehr häufiger Grund, wenn man etwas nicht tun kann.'
    example_gloss: Gestern hatte ich Kopfschmerzen.
  prs.a2.unit34.lesson01.teach.tired:
    title: Müde
    gloss: müde
    note: '*خسته* bedeutet „müde“. Es ist ein Adjektiv und steht deshalb mit *استم* (ich bin) und *بودم* (ich war): *خسته بودم* heißt „ich war müde“.'
    example_gloss: Heute bin ich sehr müde.
  prs.a2.unit34.lesson01.teach.busy:
    title: Beschäftigt
    gloss: beschäftigt, ausgelastet
    note: '*مصروف* bedeutet „beschäftigt“. *مصروف بودم* heißt „ich war beschäftigt“. Das ist die übliche kurze Begründung, wenn man ein Treffen oder einen Besuch verpasst.'
    example_gloss: Diese Woche bin ich beschäftigt.
  prs.a2.unit34.lesson01.teach.weather:
    title: Wetter
    gloss: Wetter, Luft
    note: '*هوا* bedeutet „Wetter“ und auch „Luft“. *هوا خوب است* heißt „Das Wetter ist gut“.'
    example_gloss: Heute ist das Wetter gut.
  prs.a2.unit34.lesson01.teach.cold:
    title: Kalt
    gloss: kalt
    note: '*سرد* bedeutet „kalt“. *هوا سرد است* heißt „Es ist kalt“ und bezieht sich auf das Wetter.'
    example_gloss: Nachts ist es kalt.
  prs.a2.unit34.lesson01.teach.excuse:
    title: Ausrede
    gloss: Ausrede, Entschuldigungsgrund
    note: '*عذر* ist der Grund, den man dafür nennt, dass man etwas nicht getan hat: eine Ausrede oder Entschuldigung. Ein guter *عذر* beantwortet die Frage *چرا؟*.'
    example_gloss: Seine Ausrede war Kopfschmerzen.
  prs.a2.unit34.lesson01.teach.why_because:
    title: Nach dem Grund fragen und mit „weil“ antworten
    gloss: Warum bist du nicht ins Büro gegangen? Weil ich müde war.
    note: '*چرا* fragt nach einem Grund, *چون* leitet ihn ein. Die Antwort kann ein ganzer Satz sein: *چون خسته بودم* (weil ich müde war). In einer kurzen Antwort wiederholt man den Rest der Frage nicht. Im Satz nach *چون* ändert sich nichts: Das Verb steht am Ende, wie in jedem Dari-Satz.'
  prs.a2.unit34.lesson01.teach.reason_sentence:
    title: Ich bin nicht ins Büro gegangen, weil ich krank war
    gloss: Ich bin nicht ins Büro gegangen, weil ich krank war.
    note: 'Das ist das Muster dieser Lektion: zuerst, was geschehen ist, dann ein Komma, dann *چون* und der Grund. Die beiden Teile können auch die Plätze tauschen: *چون مریض بودم، به دفتر نرفتم*.'
  prs.a2.unit34.lesson02.teach.friends:
    title: Marjan und Haroon
    gloss: Marjan und Haroon sind Freunde.
    note: 'Marjan und Haroon sind die beiden Freunde in dieser Lektion. Sie sprechen einander mit *تو* an. Die Endung *-ند* in *استند* ist der Plural von *است*: sie sind.'
  prs.a2.unit34.lesson02.teach.came:
    title: 'Kommen: das einfache Präteritum'
    gloss: ich kam, du kamst, er/sie kam, wir kamen, ihr kamt (Höflichkeitsform oder Plural), sie kamen
    note: 'Die Vergangenheit von *آمدن* lautet *آمدم، آمدی، آمد، آمدیم، آمدین، آمدند*. Das Ziel, zu dem man kommt, wird mit *به* angegeben: *به جلسه آمدم* heißt „Ich bin zur Besprechung gekommen“. Die Endungen sind dieselben wie bei allen Verben in der Vergangenheit, die Sie schon kennen.'
  prs.a2.unit34.lesson02.teach.did_not_come:
    title: 'Ich bin nicht gekommen: ن + یامد'
    gloss: ich kam nicht, du kamst nicht, er/sie kam nicht, wir kamen nicht, ihr kamt nicht, sie kamen nicht
    note: 'Die Verneinung von *آمدن* in der Vergangenheit ist *نیامدم* (ich bin nicht gekommen). Man setzt *ن* vor das Verb: *نـ + آمدم* wird zu *نیامدم*, mit einem *ی* zwischen den beiden *ا*-Lauten. Die weiteren Formen sind *نیامدی، نیامد، نیامدیم، نیامدین، نیامدند*. Bei *رفتن* ist es einfach: *نرفتم، نرفتی، نرفت*.'
  prs.a2.unit34.lesson02.teach.stay:
    title: Bleiben
    gloss: bleiben
    note: '*ماندن* heißt „bleiben“. Die Vergangenheit ist *ماندم، ماندی، ماندیم*, die Gegenwart *می‌مانم، می‌مانی، می‌مانیم*. *در خانه ماندم* heißt „Ich bin zu Hause geblieben“ – bei schlechtem Wetter oder Krankheit ein sehr häufiges Ergebnis.'
    example_gloss: Heute bleibe ich zu Hause.
  prs.a2.unit34.lesson02.teach.either_order:
    title: Der Grund kann vorn oder hinten stehen
    gloss: Weil es kalt ist, bleibe ich zu Hause. / Ich bleibe zu Hause, weil es kalt ist.
    note: 'Der Satz mit *چون* kann vor oder nach dem Hauptsatz stehen; die Bedeutung bleibt gleich. Steht er vorn, folgt ein Komma: *چون هوا سرد است، در خانه می‌مانم*. Das Verb steht in Dari in jedem Teilsatz am Ende, die Wortstellung innerhalb der Teilsätze ändert sich also nie.'
  prs.a2.unit34.lesson02.teach.sorry:
    title: Es tut mir leid, ich bin nicht zur Besprechung gekommen
    gloss: Es tut mir leid, ich bin nicht zur Besprechung gekommen.
    note: '*متأسفم* heißt „Es tut mir leid“. Man sagt es oft zuerst und nennt dann den Grund mit *چون*.'
  prs.a2.unit34.lesson02.teach.stayed_home:
    title: Weil ich müde war, bin ich zu Hause geblieben
    gloss: Weil ich müde war, bin ich zu Hause geblieben.
    note: Der Grund (*خسته بودم*) steht in der Vergangenheit, und das Ergebnis (*در خانه ماندم*) ebenfalls.
  prs.a2.unit34.lesson03.teach.so_dalil:
    title: 'به همین دلیل: aus diesem Grund, deshalb'
    gloss: Ich war beschäftigt. Deshalb bin ich nicht gekommen.
    note: '*به همین دلیل* nennt die Folge dessen, was Sie gerade gesagt haben. Es bedeutet „aus demselben Grund“, „deshalb“. Es eröffnet den zweiten Satz: zuerst der Grund (*مصروف بودم*), dann die Folge (*به همین دلیل نیامدم*). Es ist das Spiegelbild von *چون*: *چون* leitet den Grund ein, *به همین دلیل* die Folge.'
  prs.a2.unit34.lesson03.teach.so_hamin:
    title: 'برای همین: deshalb'
    gloss: Es war kalt. Deshalb sind wir zu Hause geblieben.
    note: '*برای همین* bedeutet dasselbe wie *به همین دلیل* und ist kürzer. Es ist in der Unterhaltung üblich, *به همین دلیل* klingt etwas sorgfältiger. Vor beide kann *و* treten: *هوا سرد بود و برای همین در خانه ماندیم*.'
  prs.a2.unit34.lesson03.teach.because_vs_so:
    title: Zwei Arten, dasselbe zu sagen
    gloss: Weil ich krank war, bin ich nicht gekommen. / Ich war krank. Deshalb bin ich nicht gekommen.
    note: 'Diese beiden Sätze sagen dasselbe. Mit *چون* steht der Grund innerhalb eines Satzes vorn oder hinten. Mit *به همین دلیل* hat man zwei Sätze: zuerst den Grund, dann die Folge. Der Grund hat immer dieselbe Bedeutung. Verwenden Sie pro Verbindung nur ein Bindewort: *چون* und *به همین دلیل* stehen nicht im selben Satz.'
  prs.a2.unit34.lesson03.teach.busy_not_come:
    title: Ich war beschäftigt. Deshalb bin ich nicht gekommen
    gloss: Ich war beschäftigt. Deshalb bin ich nicht gekommen.
    note: 'Eine kurze Nachricht, um ein Fehlen zu erklären: zuerst der Grund, dann die Folge.'
  prs.a2.unit34.lesson03.teach.cold_stayed:
    title: Es war kalt. Deshalb sind wir zu Hause geblieben
    gloss: Es war kalt. Deshalb sind wir zu Hause geblieben.
    note: Dasselbe Muster mit *برای همین*. *ماندیم* heißt „wir sind geblieben“.
  prs.a2.unit34.lesson03.teach.car_broken:
    title: Mein Auto war kaputt. Deshalb bin ich zu spät gekommen
    gloss: Mein Auto war kaputt. Deshalb bin ich zu spät gekommen.
    note: 'Die Folge kann auch eine andere Handlung sein: nicht nur zu Hause bleiben, sondern auch zu spät kommen.'
  prs.a2.unit34.lesson04.teach.be_dalil:
    title: 'به دلیل + Nomen: wegen'
    gloss: wegen des Schnees, wegen Kopfschmerzen, wegen der Arbeit
    note: '*به دلیل* bedeutet „wegen“ und wird von einem Nomen gefolgt, nicht von einem ganzen Satz: *به دلیل برف* (wegen des Schnees), *به دلیل سردرد* (wegen Kopfschmerzen). Der folgende Satz nennt die Folge. *به دلیل برف* erfüllt dieselbe Aufgabe wie *چون برف می‌بارید*, nur mit weniger Wörtern. Verwenden Sie *چون*, wenn Sie ein Verb haben, und *به دلیل*, wenn Sie nur ein Nomen haben.'
  prs.a2.unit34.lesson04.teach.snow_cancel:
    title: Wegen des Schnees wurde die Besprechung abgesagt
    gloss: Wegen des Schnees wurde die Besprechung abgesagt.
    note: '*لغو شد* heißt „wurde abgesagt“. Die Wendung mit *به دلیل* steht oft vorn und wird von einem Komma gefolgt.'
  prs.a2.unit34.lesson04.teach.headache_office:
    title: Wegen Kopfschmerzen bin ich nicht ins Büro gegangen
    gloss: Wegen Kopfschmerzen bin ich nicht ins Büro gegangen.
    note: 'Dasselbe Muster mit einem anderen Nomen. Man kann sie auch ans Ende stellen: *به دفتر نرفتم، به دلیل سردرد*.'
  prs.a2.unit34.lesson04.teach.change_plan:
    title: Ändern
    gloss: ändern, verändern
    note: '*تغییر دادن* heißt „etwas ändern“. Das, was man ändert, steht mit *را* vor dem Verb: *برنامه را تغییر دادیم* heißt „Wir haben den Plan geändert“. Die Vergangenheit ist *دادم، دادی، دادیم*, die Gegenwart *می‌دهیم*: *برنامه را تغییر می‌دهیم* heißt „Wir ändern den Plan“.'
    example_gloss: Wir haben den Plan geändert.
  prs.a2.unit34.lesson04.teach.banabarin:
    title: 'بنابراین: daher'
    gloss: Die Straße war gesperrt. Daher ist der Bus nicht gefahren.
    note: '*بنابراین* bedeutet „daher“ und eröffnet einen Satz, der die Folge nennt: zuerst der Grund, dann *بنابراین* und die Folge. Es hat dieselbe Aufgabe wie *به همین دلیل*, ist aber förmlicher. Sie finden es vor allem in schriftlichen Mitteilungen, Aushängen und Berichten. Gesprochen bevorzugt man *برای همین* oder *به همین دلیل*.'
  prs.a2.unit34.lesson04.teach.zira:
    title: 'زیرا: denn (schriftlich)'
    gloss: Die Besprechung wurde abgesagt, denn der Direktor ist nicht gekommen.
    note: '*زیرا* bedeutet ebenfalls „weil“ bzw. „denn“, kommt aber in der Schrift vor, nicht in der gesprochenen Sprache. Es steht meist nach dem Ergebnis und einem Komma: zuerst das Ergebnis, dann *زیرا* und der Grund. Wenn Sie sprechen oder einem Freund schreiben, verwenden Sie *چون*. *زیرا* müssen Sie nur erkennen können.'
  prs.a2.unit34.lesson04.teach.connectors:
    title: Wörter für den Grund und Wörter für die Folge
    gloss: 'weil, denn (schriftlich), wegen: der Grund. deshalb, aus diesem Grund, daher: die Folge.'
    note: Ordnen Sie die Wörter nach ihrer Aufgabe. *چون*, *زیرا* und *به دلیل* gehören zum Grund. *به همین دلیل*, *برای همین* und *بنابراین* gehören zur Folge. In der Unterhaltung verwenden Sie *چون* und *برای همین*. In einer formellen Nachricht verwenden Sie *زیرا*, *به دلیل* und *بنابراین*.
  prs.a2.unit34.lesson05.teach.meeting_today:
    title: Besprechung (Verbindungsform)
    gloss: Besprechung von … (Verbindungsform)
    note: 'Wenn auf *جلسه* ein weiteres Wort folgt, das es näher beschreibt, verbindet ein kleines Zeichen (das Hamza auf dem letzten *ه*) die beiden: *جلسهٔ امروز* heißt „die heutige Besprechung“. In der alltäglichen Schrift wird dieses Zeichen oft weggelassen.'
    example_gloss: Die heutige Besprechung ist um zehn Uhr.
  prs.a2.unit34.lesson05.teach.niloufar:
    title: Nilufar (Name)
    gloss: Nilufar (ein Frauenname)
    note: '*نیلوفر* ist ein Frauenname. Sie schreibt die Nachricht, die Sie lesen werden.'
    example_gloss: Nilufar arbeitet in einem Büro.
  prs.a2.unit34.lesson05.teach.d1_t1:
    title: Marjan fragt Haroon, warum er nicht gekommen ist
    gloss: Haroon, warum bist du gestern nicht zur Besprechung gekommen?
    note: Marjan fragt mit *چرا* und der verneinten einfachen Vergangenheit *نیامدی*. Sie spricht mit einem Freund und verwendet deshalb *تو*.
  prs.a2.unit34.lesson05.teach.d1_t2:
    title: Haroon erklärt es
    gloss: Es tut mir leid. Ich hatte Kopfschmerzen, deshalb bin ich zu Hause geblieben.
    note: Haroon entschuldigt sich und nennt in zwei kurzen Sätzen den Grund (*سردرد داشتم*) und die Folge (*به همین دلیل در خانه ماندم*).
  prs.a2.unit34.lesson05.teach.d1_t3:
    title: Marjan fragt nach dem Anruf
    gloss: Warum hast du nicht angerufen?
    note: '*تیلفون نکردی* heißt „du hast nicht angerufen“. Mit *چرا* fragt sie nach einem weiteren Grund.'
  prs.a2.unit34.lesson05.teach.d1_t4:
    title: Haroon nennt einen zweiten Grund
    gloss: Weil mein Telefon kaputt war.
    note: 'Eine kurze Antwort: *چون* und der Grund, sonst nichts.'
  prs.a2.unit34.lesson05.teach.d1_t5:
    title: Marjan reagiert
    gloss: Wie schlimm! Geht es dir jetzt gut?
    note: '*چه بد!* ist eine freundschaftliche Reaktion auf schlechte Nachrichten. *استی* ist die vertraute Form von „du bist“.'
  prs.a2.unit34.lesson05.teach.d1_t6:
    title: Haroon antwortet
    gloss: Ja, jetzt geht es mir gut.
    note: '*استم* heißt „ich bin“.'
  prs.a2.unit34.lesson05.teach.message:
    title: Eine Nachricht von Nilufar
    gloss: Hallo Marjan. Es tut mir leid, die heutige Besprechung wurde abgesagt, denn der Direktor ist nicht ins Büro gekommen. Wegen des Schnees war die Straße gesperrt. Daher findet die Besprechung am Donnerstag statt. Nilufar
    note: 'Eine kurze schriftliche Nachricht. Sie verwendet die schriftlichen Wörter für Grund und Folge: *زیرا* für den Grund, *به دلیل برف* für eine Ursache, die ein Nomen ist, und *بنابراین* für die Folge.'
  prs.a2.unit34.lesson06.teach.d2_t1:
    title: Haroon schlägt einen Tag vor
    gloss: Marjan, gehen wir am Mittwoch in den Park?
    note: 'Das einfache Präsens *می‌رویم* mit einem Wochentag drückt einen Plan aus: Wir gehen am Mittwoch. Die Frage endet mit steigender Stimme.'
  prs.a2.unit34.lesson06.teach.d2_t2:
    title: Marjan nennt einen Grund
    gloss: Mittwoch nicht, denn es wird schneien.
    note: Marjan lehnt mit *نه* ab und nennt den Grund mit *چون*. Das Präsens *برف می‌بارد* verwendet man auch, wenn man über das Wetter von morgen spricht.
  prs.a2.unit34.lesson06.teach.d2_t3:
    title: Haroon ändert den Plan
    gloss: Dann ändern wir den Plan. Gehen wir am Donnerstag?
    note: '*پس* heißt „dann“, „also“. *برنامه را تغییر می‌دهیم* heißt „Wir ändern den Plan“.'
  prs.a2.unit34.lesson06.teach.d2_t4:
    title: Marjan kann am Donnerstag nicht
    gloss: Am Donnerstag habe ich eine Besprechung, deshalb kann ich nicht.
    note: Grund (*جلسه دارم*) und Folge (*به همین دلیل نمی‌توانم*) in einem Satz, durch ein Komma verbunden. *نمی‌توانم* heißt „ich kann nicht“.
  prs.a2.unit34.lesson06.teach.d2_t5:
    title: Haroon wählt einen anderen Tag
    gloss: Gut, dann gehen wir am Freitag.
    note: '*پس* bedeutet hier „dann“: Damit ist es abgemacht.'
  prs.a2.unit34.lesson06.teach.d2_t6:
    title: Marjan stimmt zu
    gloss: Ja, Freitag passt gut.
    note: '*جمعه خوب است* heißt „Freitag passt gut“ und wird gesagt, um einem Plan zuzustimmen.'
