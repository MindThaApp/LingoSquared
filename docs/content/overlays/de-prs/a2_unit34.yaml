    correct_option: Weil ich Kopfschmerzen habe
    distractors:
    - Weil ich Kopfschmerzen hatte
    - Warum habe ich Kopfschmerzen?
    - Weil ich müde bin
    accepted_answers:
    - value: Weil ich Kopfschmerzen habe
      status: correct
    feedback: '*چون* heißt „weil“ und *سردرد دارم* heißt „ich habe Kopfschmerzen“.'
  prs.a2.unit34.lesson01.exercise02.recognize_not_go:
    instruction: Was bedeutet dieser Satz?
    correct_option: Ich bin nicht ins Büro gegangen, weil ich müde war
    distractors:
    - Ich bin ins Büro gegangen, weil ich müde war
    - Ich werde nicht ins Büro gehen, weil ich müde bin
    - Ich war müde, weil ich nicht ins Büro gegangen bin
    accepted_answers:
    - value: Ich bin nicht ins Büro gegangen, weil ich müde war
      status: correct
    feedback: '*چون خسته بودم* ist der Grund (weil ich müde war) und *به دفتر نرفتم* ist das, was geschehen ist (ich bin nicht ins Büro gegangen).'
  prs.a2.unit34.lesson01.exercise03.recognize_cold:
