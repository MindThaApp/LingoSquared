course:
  title: Dari A2
  description: 'Dari (Afghanistan) für leicht Fortgeschrittene: Sie sagen, was Sie können und was Sie nicht können, wann Sie Zeit haben oder beschäftigt sind und was passieren könnte. Das Modalverb می‌توانم mit dem Konjunktiv, ممکن است und شاید mit dem Konjunktiv sowie eine Uhrzeit, zu der Sie kommen können.'
units:
  prs.a2.unit30.can_and_might:
    title: Was ich kann und was vielleicht geschieht
lessons:
  prs.a2.unit30.lesson01.what_i_can_do:
    title: Was ich kann
  prs.a2.unit30.lesson02.all_persons_and_no:
    title: Alle Personen und die Verneinung
  prs.a2.unit30.lesson03.free_or_busy:
    title: Frei oder beschäftigt
  prs.a2.unit30.lesson04.might_and_maybe:
    title: Es könnte sein, vielleicht
  prs.a2.unit30.lesson05.reading_and_listening:
    title: 'Lesen und Hören: Freizeit'
  prs.a2.unit30.lesson06.plans_conversation:
    title: Ein Gespräch über Freitag
teaching:
  prs.a2.unit30.lesson01.teach.swim:
    title: Schwimmen
    gloss: schwimmen
    note: '*شنا کردن* heißt „schwimmen“. Es ist ein zweiteiliges Verb: das Nomen *شنا* plus *کردن*. Viele Fähigkeiten werden so benannt: *آشپزی کردن* (kochen), *رانندگی کردن* (Auto fahren), *صحبت کردن* (sprechen).'
    example_gloss: Ich schwimme gut.
  prs.a2.unit30.lesson01.teach.paint:
    title: Malen, zeichnen
    gloss: malen, zeichnen
    note: '*نقاشی کردن* heißt „ein Bild malen“ oder „zeichnen“. Wie *شنا کردن* besteht es aus einem Nomen plus *کردن*.'
    example_gloss: Mein Freund malt.
  prs.a2.unit30.lesson01.teach.letter:
    title: Der Brief
    gloss: der Brief
    note: '*نامه* ist ein Brief. Das Verb „schreiben“ heißt *نوشتن*, und der Brief ist das, was man schreibt: *نامه نوشتن* heißt „einen Brief schreiben“.'
    example_gloss: Der Brief ist zu Hause.
  prs.a2.unit30.lesson01.teach.dari:
    title: Dari
    gloss: Dari (die Sprache)
    note: '*دری* ist der Name der Sprache, die Sie lernen. Man spricht sie mit *صحبت کردن*: *دری صحبت کردن*; und *انگلیسی صحبت کردن* heißt „Englisch sprechen“.'
    example_gloss: Ich spreche ein bisschen Dari.
  prs.a2.unit30.lesson01.teach.can:
    title: 'می‌توانم: ich kann'
    gloss: Ich kann gehen. Ich kann kommen. Ich kann kochen.
    note: '*می‌توانم* bedeutet „ich kann, ich bin in der Lage“. Darauf folgt immer ein zweites Verb im Subjunktiv: *می‌توانم بروم* (ich kann gehen), *می‌توانم بیایم* (ich kann kommen), *می‌توانم آشپزی کنم* (ich kann kochen). Beide Verben stehen zusammen und beide in der ersten Person. Schreiben Sie *می‌توانم* mit einem halben Leerzeichen (ZWNJ) zwischen *می* und *توانم*, nicht mit einem normalen Leerzeichen.'
  prs.a2.unit30.lesson01.teach.subjunctive:
    title: 'Der Subjunktiv: ب plus Präsensstamm plus م'
    gloss: ich gehe, esse, lese, schreibe, koche, kaufe, sehe, sage (Subjunktiv)
    note: 'Der Subjunktiv besteht aus drei Teilen: *ب* + Präsensstamm + Personalendung. Für „ich“ lautet die Endung *-م*. Der Präsensstamm von *رفتن* ist *رو*, also *بروم*. Nach derselben Regel wird aus *خوردن* *بخورم*, aus *خواندن* *بخوانم*, aus *نوشتن* *بنویسم*, aus *پختن* *بپزم*, aus *خریدن* *بخرم*, aus *دیدن* *ببینم*, aus *گفتن* *بگویم*. Diese Form kennen Sie schon nach *باید*. Nach *می‌توانم* ist sie das zweite Verb. *آمدن* ist unregelmäßig: *بیایم*.'
  prs.a2.unit30.lesson01.teach.compound:
    title: Zweiteilige Verben haben kein ب
    gloss: Ich kann kochen, fahren, schwimmen, sprechen, malen
    note: 'Ein Verb aus einem Nomen und *کردن* bekommt kein *ب*. Nur das Funktionsverb verändert sich: *کنم*. Die geschriebene Standardform ist *آشپزی کنم*; *آشپزی بکنم* hört man auch in der gesprochenen Sprache. Vergleichen Sie *می‌توانم آشپزی کنم* (ich kann kochen) mit *می‌توانم بروم* (ich kann gehen). Dasselbe Muster gilt für *رانندگی کنم*, *شنا کنم*, *صحبت کنم*, *نقاشی کنم*. Das einfache Verb *کردن* allein heißt *بکنم*.'
  prs.a2.unit30.lesson01.teach.cook:
    title: Ich kann kochen
    gloss: Ich kann kochen.
    note: 'Das ist das Grundmuster: Subjekt (optional), *می‌توانم*, die Fähigkeit und der Subjunktiv von *کردن*.'
  prs.a2.unit30.lesson01.teach.speak_dari:
    title: Ich kann Dari sprechen
    gloss: Ich kann Dari sprechen.
    note: Das Subjekt *من* kann weggelassen werden, weil *می‌توانم* schon zeigt, wer spricht. Das Verb *صحبت کنم* schließt den Satz ab.
  prs.a2.unit30.lesson02.teach.paradigm:
    title: Das ganze Paradigma
    gloss: ich kann gehen, du kannst gehen, er/sie kann gehen, wir können gehen, ihr/Sie könnt/können gehen, sie können gehen
    note: 'Beide Verben verändern sich mit der Person. Das Modalverb: *می‌توانم، می‌توانی، می‌تواند، می‌توانیم، می‌توانین، می‌توانند*. Der Subjunktiv: *بروم، بروی، برود، برویم، بروین، بروند*. So heißt *می‌توانی بروی* „du kannst gehen“ (zu einem Freund), *می‌تواند برود* „er/sie kann gehen“, *می‌توانیم برویم* „wir können gehen“, *می‌توانین بروین* „ihr könnt / Sie können gehen“ (höflich zu einer Person, der man Respekt zollt, oder zu mehreren Personen), *می‌توانند بروند* „sie können gehen“. Die Endung der zweiten Person Plural ist in beiden Verben *-ین*.'
  prs.a2.unit30.lesson02.teach.agreement:
    title: 'Zweiteilige Verben: Nur کنم verändert sich'
    gloss: Er kann Auto fahren. Sie können Auto fahren. Wir können kochen.
    note: 'Bei zweiteiligen Verben bleibt das Nomen gleich, und nur *کنم* verändert sich: *کنم، کنی، کند، کنیم، کنین، کنند*. Also: *می‌توانم رانندگی کنم*, *می‌توانی رانندگی کنی*, *می‌تواند رانندگی کند*, *می‌توانیم رانندگی کنیم*, *می‌توانین رانندگی کنین*, *می‌توانند رانندگی کنند*. Die Person muss in beiden Verben dieselbe sein.'
  prs.a2.unit30.lesson02.teach.negative:
    title: 'Die Verneinung: نمی‌توانم'
    gloss: ich kann nicht gehen, du kannst nicht gehen, er/sie kann nicht gehen, wir können nicht gehen, ihr/Sie könnt/können nicht gehen, sie können nicht gehen
    note: 'Um zu sagen, dass Sie etwas nicht können, setzen Sie *ن* vor das Modalverb: aus *می‌توانم* wird *نمی‌توانم*. Das zweite Verb bleibt bejaht: *نمی‌توانم بروم* (ich kann nicht gehen), nicht *نمی‌توانم نروم*. Alle Endungen sind dieselben wie im bejahten Paradigma.'
  prs.a2.unit30.lesson02.teach.help_q:
    title: Können Sie mir helfen?
    gloss: Können Sie mir helfen?
    note: 'So fragen Sie einen Freund, ob er etwas tun kann: *می‌توانی* plus Subjunktiv. Zu einer Person, der man Respekt zollt, oder zu mehreren Personen sagt man *می‌توانین به من کمک کنین؟*.'
  prs.a2.unit30.lesson02.teach.no_drive:
    title: Er kann nicht Auto fahren
    gloss: Er kann nicht Auto fahren. / Sie kann nicht Auto fahren.
    note: '*او* bedeutet „er“ oder „sie“; dieser Satz handelt also von einer Person, die nicht Auto fahren kann. *نمی‌تواند* ist die verneinte Form; *کند* ist der Subjunktiv von *کردن* für „er/sie“.'
  prs.a2.unit30.lesson03.teach.busy:
    title: Beschäftigt
    gloss: beschäftigt
    note: '*مشغول* bedeutet „beschäftigt“. Man sagt *مشغول استم* (ich bin beschäftigt), das Gegenteil von *آزاد استم* (ich bin frei).'
    example_gloss: Heute bin ich beschäftigt.
  prs.a2.unit30.lesson03.teach.tonight:
    title: Heute Abend
    gloss: heute Abend
    note: '*امشب* heißt „heute Abend“. Wie *فردا* (morgen) und *امروز* (heute) ist es ein Zeitwort, das vor dem Verb steht.'
    example_gloss: Heute Abend bin ich zu Hause.
  prs.a2.unit30.lesson03.teach.five:
    title: Fünf
    gloss: fünf
    note: '*پنج* ist fünf. *ساعت پنج* heißt „fünf Uhr“ und *بعد از ساعت پنج* „nach fünf Uhr“.'
    example_gloss: Um fünf Uhr gehe ich nach Hause.
  prs.a2.unit30.lesson03.teach.time_word:
    title: Zeitwort plus می‌توانم
    gloss: Morgen kann ich kommen. Heute Abend kann ich nicht kommen. Am Freitag kann ich kommen.
    note: 'Um zu sagen, wann Sie etwas können, setzen Sie ein Zeitwort in den Satz: *فردا*, *امشب*, *روز جمعه*. Die Verben bleiben gleich, *می‌توانم بیایم*; das Zeitwort zeigt, dass es um die Zukunft geht, Sie brauchen also keine eigene Zukunftsform. Das Zeitwort kann am Anfang stehen (*فردا می‌توانم بیایم*) oder nach dem Modalverb (*می‌توانم فردا بیایم*). Die Frage lautet *فردا می‌توانی بیایی؟* (Kannst du morgen kommen?).'
  prs.a2.unit30.lesson03.teach.reply:
    title: Ja, nein, weil, aber
    gloss: Ja, ich kann kommen. Nein, ich kann nicht kommen, weil ich beschäftigt bin. Aber am Freitag bin ich frei.
    note: 'Zum Zusagen antworten Sie mit *بلی* und wiederholen das Modalverb: *بلی، می‌توانم بیایم*. Zum Absagen antworten Sie mit *نخیر* und nennen den Grund mit *چون*: *نخیر، نمی‌توانم بیایم، چون مشغول استم*. *ولی* (aber) schlägt dann eine andere Zeit vor: *ولی روز جمعه آزاد استم*. *آزاد استم* heißt „ich bin frei“ und *مشغول استم* „ich bin beschäftigt“. Sie können auch *کار دارم* (ich habe zu tun) sagen.'
  prs.a2.unit30.lesson03.teach.after_five:
    title: Frei nach fünf
    gloss: Nach fünf Uhr bin ich frei.
    note: Damit sagen Sie dem anderen, wann Sie frei sind. *بعد از ساعت پنج* heißt „nach fünf Uhr“.
  prs.a2.unit30.lesson03.teach.when_q:
    title: Wann kannst du kommen?
    gloss: Wann kannst du kommen?
    note: '*کی* fragt nach der Zeit. Die Antwort ist ein Zeitwort im selben Muster: *فردا می‌توانم بیایم* oder *بعد از ساعت پنج می‌توانم بیایم*.'
  prs.a2.unit30.lesson04.teach.possible:
    title: Es ist möglich, es könnte sein
    gloss: es ist möglich, dass; es könnte sein
    note: '*ممکن است* bedeutet „es ist möglich, es könnte sein“. Darauf folgt ein Satz, dessen Verb im Subjunktiv steht: *ممکن است باران ببارد* (es könnte regnen). *ممکن* verändert sich nie; das Verb danach trägt die Person.'
    example_gloss: Morgen könnte es regnen.
  prs.a2.unit30.lesson04.teach.maybe:
    title: Vielleicht
    gloss: vielleicht
    note: '*شاید* bedeutet „vielleicht“. Wie *ممکن است* wird es vom Subjunktiv gefolgt: *شاید بیایم* (vielleicht komme ich), *شاید او بیاید* (vielleicht kommt er). *شاید* ist kürzer und wird in der gesprochenen Sprache häufiger verwendet.'
    example_gloss: Vielleicht kommt er.
  prs.a2.unit30.lesson04.teach.rain:
    title: Regen
    gloss: Regen
    note: '*باران* ist der Regen. Das Verb ist *باریدن*: *باران ببارد* (es möge regnen / es könnte regnen), *باران نبارد* (es könnte nicht regnen). Der Subjunktiv von *باریدن* ist *ببارد*.'
    example_gloss: Heute regnet es.
  prs.a2.unit30.lesson04.teach.sure:
    title: Klar
    gloss: sicher
    note: '*مطمئن* bedeutet „sicher“. *مطمئن نیستم* heißt „ich bin nicht sicher“. Das sagt man natürlicherweise, bevor man *شاید* oder *ممکن است* hinzufügt.'
    example_gloss: Ich bin nicht sicher.
  prs.a2.unit30.lesson04.teach.possible_subj:
    title: ممکن است plus Subjunktiv
    gloss: Ich komme vielleicht zu spät. Er könnte kommen. Es könnte regnen.
    note: 'Nach *ممکن است* steht das Verb im Subjunktiv, in der Person, die Sie meinen: *بیایم* (ich komme), *بیایی* (du kommst), *بیاید* (er kommt), *بیاییم* (wir kommen), *بیایین* (ihr kommt / Sie kommen), *بیایند* (sie kommen). Die Verneinung setzt *ن* vor den Subjunktiv: *ممکن است نیاید* (er kommt vielleicht nicht). Vergleichen Sie mit *می‌توانم*: Das sagt „ich bin in der Lage“; *ممکن است* sagt „es ist möglich, dass es geschieht“.'
  prs.a2.unit30.lesson04.teach.maybe_subj:
    title: شاید plus Subjunktiv
    gloss: Vielleicht komme ich. Vielleicht kommst du. Vielleicht kommt er. Vielleicht kommen sie nicht.
    note: '*شاید* funktioniert genau wie *ممکن است*: Es wird vom Subjunktiv gefolgt, und die Person zeigt sich an der Verbendung: *شاید بیایم، شاید بیایی، شاید بیاید، شاید بیاییم، شاید بیایین، شاید بیایند*. Die Verneinung hat *ن* am Verb: *شاید نیایند* (vielleicht kommen sie nicht). Ein Zeitwort kann davorstehen: *شاید فردا بیایم*.'
  prs.a2.unit30.lesson04.teach.can_maybe:
    title: 'شاید بتوانم: vielleicht kann ich'
    gloss: Vielleicht kann ich kommen. Vielleicht kann ich nicht kommen. Er kann vielleicht kommen.
    note: 'Sie können die beiden Ideen verbinden: *شاید* oder *ممکن است* plus der Subjunktiv von *توانستن*, nämlich *بتوانم، بتوانی، بتواند، بتوانیم، بتوانین، بتوانند*, plus das zweite Verb. So heißt *شاید بتوانم بیایم* „vielleicht kann ich kommen“. Die Verneinung ist *نتوانم*: *شاید نتوانم بیایم* heißt „vielleicht kann ich nicht kommen“. Das ist nützlich, wenn Sie noch nicht wissen, ob Sie frei sind.'
  prs.a2.unit30.lesson04.teach.maybe_tomorrow:
    title: Vielleicht kann ich morgen kommen
    gloss: Vielleicht kann ich morgen kommen.
    note: Sie sind nicht sicher, aber es besteht eine Chance. Das Zeitwort *فردا* steht nach *شاید*.
  prs.a2.unit30.lesson04.teach.rain_phrase:
    title: Es könnte regnen
    gloss: Es könnte regnen.
    note: '*ممکن است* plus *ببارد*: eine Möglichkeit, kein Versprechen.'
  prs.a2.unit30.lesson05.teach.fix:
    title: Reparieren
    gloss: reparieren, in Ordnung bringen, machen
    note: '*درست کردن* heißt „etwas reparieren“ und auch „machen, zubereiten“, wie in *چای درست کردن* (Tee machen). Die Sache steht zuerst mit *را*: *کمپیوترم را درست می‌کنم*.'
    example_gloss: Mein Freund repariert mein Auto.
  prs.a2.unit30.lesson05.teach.problem:
    title: Problem
    gloss: Problem, Schwierigkeit
    note: '*مشکل* ist ein Problem. *مشکل کوچک* ist ein kleines Problem.'
    example_gloss: Das Problem ist klein.
  prs.a2.unit30.lesson05.teach.turn01:
    title: Wahida fragt, ob Sakhi kommen kann
    gloss: Sakhi, kannst du morgen zu uns nach Hause kommen?
    note: 'Wahida fragt einen Freund, ob er morgen frei ist: *فردا می‌توانی ... بیایی؟*. Sie verwendet *تو*, weil Sakhi ein Freund ist.'
  prs.a2.unit30.lesson05.teach.turn02:
    title: Sakhi nennt seine Zeit
    gloss: Am Vormittag kann ich nicht, weil ich im Büro arbeiten muss. Aber nach fünf Uhr bin ich frei.
    note: Sakhi lehnt den Vormittag mit *نمی‌توانم* ab und nennt den Grund mit *چون*. Bei *نمی‌توانم* fehlt das zweite Verb, weil *بیایم* aus der Frage klar ist. Dann schlägt er mit *ولی* eine andere Zeit vor.
  prs.a2.unit30.lesson05.teach.turn03:
    title: Wahida bittet um Hilfe
    gloss: Gut. Mein Computer ist kaputt. Kannst du ihn reparieren?
    note: '*می‌توانی ... درست کنی؟* fragt, ob er in der Lage ist, es zu reparieren. *آن را* (es) verweist auf den Computer.'
  prs.a2.unit30.lesson05.teach.turn04:
    title: Sakhi ist nicht sicher
    gloss: Vielleicht kann ich es. Das Problem ist vielleicht klein.
    note: Sakhi ist nicht sicher, deshalb sagt er *شاید بتوانم* (vielleicht kann ich) und *ممکن است ... باشد* (es könnte sein). Beide werden vom Subjunktiv gefolgt.
  prs.a2.unit30.lesson05.teach.message:
    title: Eine Nachricht von einem Freund
    gloss: Hallo, mein Freund. Morgen kann ich nicht kommen, weil ich am Vormittag im Büro arbeiten muss. Nach fünf Uhr bin ich frei, aber ich komme vielleicht spät. Vielleicht kann ich am Donnerstag kommen. Bist du am Donnerstag frei?
    note: 'Eine kurze Nachricht, die alle drei Ideen der Lektion verwendet: was der Schreiber nicht kann (*نمی‌توانم بیایم*), wann er frei ist (*بعد از ساعت پنج آزاد استم*) und was passieren könnte (*ممکن است دیر برسم، شاید ... بتوانم*).'
  prs.a2.unit30.lesson06.teach.park:
    title: Park
    gloss: Park
    note: '*پارک* ist ein Park. Man geht *به پارک* (in den Park) und ist *در پارک* (im Park).'
    example_gloss: Der Park ist in Kabul.
  prs.a2.unit30.lesson06.teach.tea:
    title: Tee
    gloss: Tee
    note: '*چای* ist der Tee. *چای درست کردن* heißt „Tee machen“, mit dem Verb aus der letzten Lektion.'
    example_gloss: Der Tee ist heiß.
  prs.a2.unit30.lesson06.teach.turn01:
    title: Hamid fragt nach Freitag
    gloss: Palwascha, gehst du am Freitag in den Park?
    note: '*جمعه به پارک می‌روی؟* fragt mit dem einfachen Präsens *می‌روی* und einer Zeitangabe nach einem Plan. Palwascha ist eine Freundin, deshalb sagt er *تو*.'
  prs.a2.unit30.lesson06.teach.turn02:
    title: Palwascha ist nicht sicher
    gloss: Vielleicht gehe ich. Es könnte regnen.
    note: Palwascha ist nicht sicher. *شاید بروم* heißt „vielleicht gehe ich“, und *ممکن است باران ببارد* heißt „es könnte regnen“. Beide Verben stehen im Subjunktiv.
  prs.a2.unit30.lesson06.teach.turn03:
    title: Hamid bietet etwas an und fragt
    gloss: Ich kann Essen kochen. Kannst du Tee machen?
    note: Hamid sagt, was er kann (*می‌توانم غذا بپزم*), und fragt, was Palwascha kann (*می‌توانی چای درست کنی؟*).
  prs.a2.unit30.lesson06.teach.turn04:
    title: Palwascha sagt zu, mit einer Bedingung
    gloss: Ja, ich kann. Aber wenn es regnet, können wir nicht im Park bleiben.
    note: '*بلی، می‌توانم* ist eine Zusage. Dann nennt *اگر باران ببارد* („wenn es regnet“) eine Bedingung, und *نمی‌توانیم ... بمانیم* sagt, was die beiden nicht tun können. Auch *اگر* steht mit dem Subjunktiv.'
  prs.a2.unit30.lesson06.teach.turn05:
    title: Hamid hat eine andere Idee
    gloss: Dann essen wir vielleicht bei mir zu Hause.
    note: '*شاید ... بخوریم* ist ein Vorschlag, der klappen könnte: Vielleicht essen wir bei mir zu Hause. *پس* („dann“) ergibt sich aus dem Problem mit dem Regen.'
exercises:
  prs.a2.unit30.lesson01.exercise01.recognize_swim:
    instruction: Was bedeutet dieser Satz?
    correct_option: Ich kann schwimmen
    distractors:
    - Ich bin gestern geschwommen
    - Ich mag das Wasser
    - Ich möchte schwimmen lernen
    accepted_answers:
    - value: Ich kann schwimmen
      status: correct
    feedback: '*می‌توانم شنا کنم* heißt „Ich kann schwimmen“: *می‌توانم* plus der Subjunktiv *کنم*.'
  prs.a2.unit30.lesson01.exercise02.recognize_letter:
    instruction: Was bedeutet dieser Satz?
    correct_option: Ich kann einen Brief schreiben
    distractors:
    - Ich habe einen Brief geschrieben
    - Ich habe einen Brief
    - Ich muss einen Brief schreiben
    accepted_answers:
    - value: Ich kann einen Brief schreiben
      status: correct
    feedback: '*می‌توانم نامه بنویسم* heißt „Ich kann einen Brief schreiben“: *نامه* ist der Brief und *بنویسم* ist der Subjunktiv von *نوشتن*.'
  prs.a2.unit30.lesson01.exercise03.match_skills:
