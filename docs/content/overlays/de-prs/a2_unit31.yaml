    title: Ein Anruf im Laden
teaching:
  prs.a2.unit31.lesson01.teach.neighbour:
    title: Nachbar
    gloss: Nachbar, Nachbarin
    note: '*همسایه* ist der Nachbar bzw. die Nachbarin. Nachbarn bitten einander oft um kleine Gefallen, deshalb ist das die erste Person, an die Sie höfliche Bitten richten werden.'
    example_gloss: Unser Nachbar ist sehr nett.
  prs.a2.unit31.lesson01.teach.shopkeeper:
    title: Ladenbesitzer
    gloss: Ladenbesitzer
    note: '*دوکاندار* ist die Person, die in einem *دوکان* (Laden) arbeitet. Sie bitten den *دوکاندار* um das, was Sie brauchen, und er oder sie bietet Ihnen vielleicht noch mehr an.'
    example_gloss: Der Ladenbesitzer ist im Laden.
  prs.a2.unit31.lesson01.teach.milk:
    title: Milch
    gloss: Milch
    note: '*شیر* ist die Milch. Man bittet im Laden häufig darum, ebenso wie um *نان* (Brot).'
    example_gloss: Ich trinke jeden Tag Milch.
  prs.a2.unit31.lesson01.teach.bag:
    title: Tasche
    gloss: Tüte, Tragetasche
    note: '*کیسه* ist eine Tüte, zum Beispiel die Tüte, in die der Ladenbesitzer Ihre Einkäufe packt.'
    example_gloss: Ich habe eine Tüte Brot gekauft.
  prs.a2.unit31.lesson01.teach.frame:
    title: 'Die höfliche Bitte: می‌شود که ...؟'
    gloss: 'Könnten Sie mir ein wenig Brot geben? (wörtlich: Ist es möglich, dass Sie ein wenig Brot geben?)'
    note: 'Um jemanden höflich um etwas zu bitten, beginnen Sie mit *می‌شود که* (ist es möglich, dass) und setzen das Verb in den Subjunktiv: *می‌شود که کمی نان بدهین؟* Das Verb nach *که* hat dieselbe Form wie nach *باید* und endet auf *-ین*, wenn Sie eine Person höflich ansprechen oder mehrere Personen (*شما*). Eine Bitte ist eine Frage, deshalb endet der Satz mit *؟*. In der gesprochenen Sprache lässt man *که* oft weg: *می‌شود کمی نان بدهین؟*. Sie können auch mit *می‌توانین* fragen: *می‌توانین کمی نان بدهین؟*'
  prs.a2.unit31.lesson01.teach.subj:
    title: Der Subjunktiv von دادن
    gloss: dass ich gebe, dass du gibst, dass er/sie gibt, dass wir geben, dass Sie geben (höflich) bzw. dass ihr gebt, dass sie geben
    note: Der Subjunktiv besteht aus *ب*, dem Präsensstamm und den Endungen *-م، -ی، -د، -یم، -ین، -ند*. Bei *دادن* ist der Stamm *ده*, daraus ergibt sich *بدهم، بدهی، بدهد، بدهیم، بدهین، بدهند*. Für eine Bitte an einen Nachbarn oder einen Ladenbesitzer brauchen Sie die Form auf *-ین*, also *بدهین*.
  prs.a2.unit31.lesson01.teach.subj_more:
    title: Bitten mit anderen Verben
    gloss: geben, bringen, schicken, nehmen/bekommen, wegbringen, sagen, tun
    note: 'Setzen Sie denselben Subjunktiv auf *-ین* mit jedem Verb nach *می‌شود که*: *بیاورین* (bringen), *بفرستین* (schicken), *بگیرین* (bekommen), *ببرین* (etwas an einen Ort bringen), *بگویین* (sagen) und *کنین* (tun). Verben mit *کردن* verwenden nach dem ersten Wort *کنین*: *کمک کنین* (helfen), *صبر کنین* (warten), *تیلفون کنین* (anrufen), *باز کنین* (öffnen).'
  prs.a2.unit31.lesson01.teach.help_req:
    title: Könnten Sie helfen?
    gloss: Könnten Sie helfen?
    note: '*می‌شود که کمک کنین؟* ist die alltägliche Art, einen Nachbarn um Hilfe zu bitten. Beginnen Sie mit *ببخشین* (Entschuldigung), wenn Sie die Person nicht gut kennen.'
  prs.a2.unit31.lesson01.teach.bag_req:
    title: Entschuldigung, könnten Sie mir eine Tüte geben?
    gloss: Entschuldigung, könnten Sie mir eine Tüte geben?
    note: '*ببخشین* ist eine höfliche Einleitung und keine echte Entschuldigung. Danach folgt die Bitte: *می‌شود که یک کیسه بدهین؟*'
  prs.a2.unit31.lesson01.teach.yes_sure:
    title: Ja, selbstverständlich
    gloss: Ja, selbstverständlich.
    note: '*بلی، حتماً.* ist ein höfliches Ja auf eine Bitte. *البته.* (natürlich) bedeutet dasselbe.'
  prs.a2.unit31.lesson02.teach.table:
    title: Tisch
    gloss: Tisch
    note: '*میز* bedeutet Tisch. Vielleicht brauchen Sie Hilfe, ihn zu tragen oder zu verschieben.'
    example_gloss: Der Tisch ist im Zimmer.
  prs.a2.unit31.lesson02.teach.here:
    title: Hier
    gloss: hier
    note: '*اینجا* bedeutet hier, an diesem Ort. Das Gegenteil ist *آنجا* (dort).'
    example_gloss: Der Schlüssel ist hier.
  prs.a2.unit31.lesson02.teach.imp_pl:
    title: Der höfliche Imperativ (Befehlsform) auf -ین
    gloss: kommen, gehen, geben, sagen, nehmen, bringen, tun/machen (zu einem Nachbarn oder zu mehreren Personen)
    note: 'Eine Aufforderung an *شما* (einen Nachbarn, eine ältere Person oder mehrere Personen) endet auf *-ین*: *بیایین* (kommen Sie), *بروین* (gehen Sie), *بدهین* (geben Sie), *بگویین* (sagen Sie), *بگیرین* (nehmen Sie), *بیاورین* (bringen Sie), *کنین* (tun Sie/machen Sie). Es ist dieselbe Form wie der Subjunktiv, den Sie nach *می‌شود که* verwendet haben.'
  prs.a2.unit31.lesson02.teach.imp_sg:
    title: Die Aufforderung an einen Freund (ohne Endung)
    gloss: komm, geh, gib, sag, nimm, bring, mach (zu einem Freund oder einem Kind)
    note: 'Zu einem einzelnen Freund oder einem Kind lassen Sie das *-ین* weg: *بیا، برو، بده، بگو، بگیر، بیاور، کن*. Das ist die bloße Form und sie wirkt für sich allein schroff. Verwenden Sie sie daher nur bei Personen, die Sie mit *تو* anreden. Zu einem Nachbarn oder einem Ladenbesitzer verwenden Sie immer die Form auf *-ین*.'
  prs.a2.unit31.lesson02.teach.imp_rule:
    title: Wie der Imperativ gebildet wird
    gloss: 'Das Muster: b + Präsensstamm'
    note: Der Imperativ besteht aus *ب* plus Präsensstamm (*رو، ده، گو، گیر*); für *شما* kommt *-ین* hinzu. Das Verb *کردن* hat kein *ب* (*کن، کنین*), und *آمدن* hat *بیا، بیایین*. *آوردن* heißt *بیاور* zu einem Freund und *بیاورین* in der höflichen Form.
  prs.a2.unit31.lesson02.teach.please_wait:
    title: Bitte warten Sie einen Moment
    gloss: Bitte warten Sie einen Moment.
    note: '*لطفاً* (bitte) steht am Anfang einer Aufforderung und macht sie höflich: *لطفاً کمی صبر کنین.*'
  prs.a2.unit31.lesson02.teach.please_bring:
    title: Bitte bringen Sie die Tüte
    gloss: Bitte bringen Sie die Tüte.
    note: 'Das Objekt steht vor dem Verb und erhält *را*, wenn es etwas Bestimmtes ist: *کیسه را بیاورین*.'
  prs.a2.unit31.lesson02.teach.please_table:
    title: Bitte bringen Sie diesen Tisch ins Zimmer
    gloss: Bitte bringen Sie diesen Tisch ins Zimmer.
    note: '*ببرین* bedeutet, etwas irgendwohin zu bringen oder zu tragen. *به اتاق* sagt, wohin.'
  prs.a2.unit31.lesson02.teach.two_ways:
    title: Zwei Arten zu bitten
    gloss: Bitte öffnen Sie das Tor. / Entschuldigung, könnten Sie das Tor öffnen?
    note: '*لطفاً* plus Imperativ ist kurz und direkt und passt, wenn die andere Person es ohnehin tun soll, zum Beispiel ein Ladenbesitzer. *می‌شود که ...؟* ist weicher und besser für einen Gefallen unter Nachbarn. Beide Formen sind höflich.'
  prs.a2.unit31.lesson03.teach.offer_forms:
    title: 'Hilfe anbieten: das Verb mit -م'
    gloss: Soll ich helfen? Soll ich Tee bringen? Soll ich auch eine Tüte geben? Soll ich auch Tee schicken?
    note: 'Um etwas anzubieten, stellen Sie eine Frage mit der *من*-Form des Subjunktivs: *کنم* (dass ich tue), *بیاورم* (dass ich bringe), *بدهم* (dass ich gebe), *بفرستم* (dass ich schicke). *کمک کنم؟* heißt „Soll ich helfen?“. Sie können *هم* (auch) hinzufügen: *کیسه هم بدهم؟*'
  prs.a2.unit31.lesson03.teach.want_that:
    title: Möchten Sie, dass ich helfe?
    gloss: Möchten Sie, dass ich helfe?
    note: '*می‌خواهین که ...؟* ist eine weitere Möglichkeit, etwas anzubieten. Man fragt, ob die andere Person es möchte, und das Verb nach *که* steht wieder in der *-م*-Form.'
  prs.a2.unit31.lesson03.teach.offer_vs_request:
    title: Angebot oder Bitte?
    gloss: Soll ich Tee bringen? / Bitte bringen Sie Tee.
    note: 'Die Endung zeigt, wer die Handlung ausführt. *بیاورم* (ich bringe) ist ein Angebot: Ich tue es für Sie. *بیاورین* (Sie bringen) ist eine Bitte: Sie tun es für mich. So ist *کیسه هم بدهم؟* das Angebot des Ladenbesitzers und *کیسه بدهین* die Bitte des Kunden.'
  prs.a2.unit31.lesson03.teach.sugar:
    title: Zucker
    gloss: Zucker
    note: '*قند* bedeutet Zucker. In Afghanistan trinkt man Tee mit oder ohne *قند*.'
    example_gloss: Tee mit Zucker ist gut.
  prs.a2.unit31.lesson03.teach.kindness:
    title: Freundlichkeit
    gloss: Freundlichkeit, Gefallen
    note: '*لطف* bedeutet Freundlichkeit. *لطف می‌کنین* ist ein höfliches Dankeschön: Sie sind sehr freundlich.'
    example_gloss: Vielen Dank für Ihre Freundlichkeit.
  prs.a2.unit31.lesson03.teach.self:
    title: Selbst
    gloss: selbst, allein
    note: '*خودم* bedeutet ich selbst. *خودم می‌کنم* heißt: Ich mache es selbst.'
    example_gloss: Ich mache die Arbeit selbst.
  prs.a2.unit31.lesson03.teach.yes_please:
    title: Ja, bitte
    gloss: Ja, bitte.
    note: Damit nehmen Sie ein Angebot an. Nach *بلی* können Sie *تشکر* hinzufügen.
  prs.a2.unit31.lesson03.teach.yes_kind:
    title: Ja, danke, das ist nett
    gloss: Ja, danke. Das ist nett von Ihnen.
    note: Eine herzlichere Art, anzunehmen. *لطف می‌کنین* sagt, dass die andere Person freundlich ist.
  prs.a2.unit31.lesson03.teach.no_thanks:
    title: Nein, danke
    gloss: Nein, danke.
    note: Die einfachste höfliche Ablehnung. Fügen Sie immer *تشکر* hinzu; ein bloßes *نه* wirkt schroff.
  prs.a2.unit31.lesson03.teach.no_need:
    title: Das ist nicht nötig
    gloss: Das ist nicht nötig.
    note: '*لازم نیست* bedeutet „nicht nötig“. Damit lehnen Sie ein Angebot freundlich ab. Sie können *نه، تشکر. لازم نیست.* oder *خودم می‌کنم.* sagen.'
  prs.a2.unit31.lesson04.teach.neg_pl:
    title: 'Nicht ...: der verneinte Imperativ mit نـ'
    gloss: tun Sie nicht, gehen Sie nicht, sagen Sie nicht, geben Sie nicht, nehmen Sie nicht, kommen Sie nicht
    note: 'Für das Verbot setzen Sie *نـ* statt *بـ* vor den Imperativ: Aus *بروین* wird *نروین*, aus *بگویین* wird *نگویین*, aus *بدهین* wird *ندهین*, aus *بگیرین* wird *نگیرین*. *کنین* hat kein *بـ*, deshalb kommt einfach *نـ* davor: *نکنین*. Merken Sie sich *بیایین* besonders: Daraus wird *نیایین*.'
  prs.a2.unit31.lesson04.teach.neg_sg:
    title: Der verneinte Imperativ zu einem Freund
    gloss: tu nicht, geh nicht, sag nicht, gib nicht, komm nicht, nimm nicht
    note: 'Zu einem Freund gilt dieselbe Regel ohne Endung: *نکن، نرو، نگو، نده، نیا، نگیر*. Ein bloßes *نکن* wirkt schroff, verwenden Sie es daher nur bei Freunden und Kindern. Zu einem Nachbarn sagen Sie immer *نکنین* und fügen *لطفاً* hinzu.'
  prs.a2.unit31.lesson04.teach.leave:
    title: 'Legen, lassen: بگذارین und نگذارین'
    gloss: leg/lass, legen/lassen Sie; leg/lass nicht, legen/lassen Sie nicht
    note: '*گذاشتن* bedeutet, etwas irgendwohin zu legen oder zu lassen. *دروازه را باز بگذارین* heißt „Lassen Sie das Tor offen“; *دروازه را باز نگذارین* heißt „Lassen Sie das Tor nicht offen“.'
  prs.a2.unit31.lesson04.teach.dont_late:
    title: Bitte kommen Sie nicht zu spät
    gloss: Bitte lassen Sie sich nicht zu viel Zeit.
    note: '*دیر کردن* bedeutet, sich zu verspäten oder zu lange zu brauchen. *لطفاً دیر نکنین* ist eine höfliche Erinnerung, bevor jemand etwas bringt oder schickt.'
  prs.a2.unit31.lesson04.teach.dont_go:
    title: Bitte gehen Sie morgen nicht
    gloss: Bitte gehen Sie morgen nicht.
    note: '*لطفاً* plus ein verneinter Imperativ bittet jemanden höflich, etwas nicht zu tun.'
  prs.a2.unit31.lesson04.teach.dont_come_late:
    title: Bitte kommen Sie nicht spät
    gloss: Bitte kommen Sie nicht zu spät.
    note: '*نیایین* ist die Verneinung von *بیایین* (kommen Sie).'
  prs.a2.unit31.lesson04.teach.gate_open:
    title: Bitte lassen Sie das Tor nicht offen
    gloss: Bitte lassen Sie das Tor nicht offen.
    note: Eine typische Bitte an einen Nachbarn oder einen Besucher im Laden.
  prs.a2.unit31.lesson04.teach.park:
    title: Bitte stellen Sie hier kein Auto ab
    gloss: Bitte stellen Sie hier kein Auto ab.
    note: 'Eine weitere alltägliche Verwendung von *نگذارین*: Bitte parken Sie hier nicht.'
  prs.a2.unit31.lesson04.teach.no_trouble:
    title: Bitte machen Sie sich keine Umstände
    gloss: Bitte machen Sie sich keine Umstände.
    note: '*زحمت کشیدن* bedeutet, sich Mühe zu machen. Man sagt *لطفاً زحمت نکشین*, wenn einem jemand Tee oder Hilfe anbietet, um höflich und dankend abzulehnen.'
  prs.a2.unit31.lesson04.teach.better_not:
    title: Es ist besser, morgen nicht zu gehen
    gloss: Es ist besser, wenn Sie morgen nicht gehen.
    note: '*بهتر است* (es ist besser) ist eine mildere Art, „nicht“ zu sagen. Es ist ein Rat und kein Befehl.'
  prs.a2.unit31.lesson05.teach.mrs:
    title: Frau
    gloss: Frau
    note: '*خانم* steht als höfliche Anrede vor dem Namen einer Frau: *خانم رحیمه*.'
    example_gloss: Frau Rahima ist unsere Nachbarin.
  prs.a2.unit31.lesson05.teach.mr:
    title: Herr
    gloss: Herr
    note: '*آقای* steht vor dem Namen eines Mannes: *آقای مسعود*.'
    example_gloss: Herr Masood ist im Laden.
  prs.a2.unit31.lesson05.teach.flower:
    title: Blume
    gloss: Blume
    note: '*گل* bedeutet Blume. Mit *‌ها* bilden Sie den Plural, mit *-م* das Possessiv „mein“: *گل‌هایم* (meine Blumen).'
    example_gloss: Meine Blumen sind im Haus.
  prs.a2.unit31.lesson05.teach.water:
    title: Wasser
    gloss: das Wasser
    note: '*آب* bedeutet Wasser. *آب دادن* heißt, eine Pflanze zu gießen: *به گل‌ها آب بدهین*.'
    example_gloss: Ich trinke Wasser.
  prs.a2.unit31.lesson05.teach.not_home:
    title: Ich bin bis Freitag nicht zu Hause
    gloss: Ich bin bis Freitag nicht zu Hause.
    note: '*نیستم* bedeutet „ich bin nicht“. *تا جمعه* heißt „bis Freitag“.'
  prs.a2.unit31.lesson05.teach.may_i:
    title: Darf ich ...?
    gloss: Darf ich den Schlüssel bei Ihnen lassen?
    note: 'Mit der *-م*-Form fragt *می‌شود که ...؟* um Erlaubnis: *می‌شود که کلید را پیش شما بگذارم؟* heißt „Darf ich den Schlüssel bei Ihnen lassen?“. Mit der *-ین*-Form ist es eine Bitte an die andere Person. Vergleichen Sie *می‌شود که کمک کنم؟* (Darf ich helfen?) mit *می‌شود که کمک کنین؟* (Könnten Sie helfen?).'
  prs.a2.unit31.lesson05.teach.people:
    title: Majida und Shafiq sind Nachbarn
    gloss: Majida und Shafiq sind Nachbarn.
    note: In dem folgenden Text hinterlässt Majida ihrem Nachbarn Shafiq eine Nachricht.
  prs.a2.unit31.lesson05.teach.d1_t1:
    title: Masood bittet um Hilfe
    gloss: Guten Tag, Frau Rahima. Entschuldigung, könnten Sie mir heute ein wenig helfen?
    note: Masood beginnt mit einem Gruß und *ببخشین*, dann fragt er mit *می‌شود که* und der *-ین*-Form *کنین*.
  prs.a2.unit31.lesson05.teach.d1_t2:
    title: Rahima sagt zu
    gloss: Guten Tag, Herr Masood. Natürlich. Was soll ich tun?
    note: '*البته* ist ein höfliches Ja. *چه کار کنم؟* verwendet die *-م*-Form, um zu fragen, was sie tun soll.'
  prs.a2.unit31.lesson05.teach.d1_t3:
    title: Masood sagt, was er braucht
    gloss: Könnten Sie diesen Tisch mit mir ins Zimmer tragen?
    note: Eine zweite Bitte, diesmal um etwas Bestimmtes. *با من* heißt „mit mir“.
  prs.a2.unit31.lesson05.teach.d1_t4:
    title: Rahima sagt zu
    gloss: Ja, sicher.
    note: Eine kurze, herzliche Zusage.
  prs.a2.unit31.lesson05.teach.d1_t5:
    title: Masood bietet Tee an
    gloss: Vielen Dank. Soll ich Tee bringen?
    note: '*خیلی تشکر* heißt „vielen Dank“. *چای بیاورم؟* ist ein Angebot mit der Endung *-م*.'
  prs.a2.unit31.lesson05.teach.d1_t6:
    title: Rahima lehnt ab
    gloss: Nein, danke. Bitte machen Sie sich keine Umstände.
    note: 'Rahima lehnt mit *نه، تشکر* ab und verwendet dann den verneinten Imperativ *نکشین*, um zu sagen: „Machen Sie sich keine Mühe.“'
  prs.a2.unit31.lesson05.teach.message:
    title: Ein Zettel für den Nachbarn
    gloss: Guten Tag, Herr Shafiq. Morgen fahre ich nach Masar und bin bis Freitag nicht zu Hause. Darf ich meinen Haustürschlüssel bei Ihnen lassen? Bitte gießen Sie jeden Tag meine Blumen. Bitte lassen Sie das Tor nicht offen. Vielen Dank für Ihre Freundlichkeit. Majida
    note: Ein kurzer schriftlicher Zettel mit einer Bitte um Erlaubnis, einer Bitte und einer verneinten Bitte. Beachten Sie, dass er dieselben Muster wie das Gespräch verwendet.
  prs.a2.unit31.lesson06.teach.d2_t1:
    title: Farzana ruft im Laden an
    gloss: Hallo. Könnten Sie uns zwei Brote und eine Packung Milch nach Hause schicken?
    note: Farzana ruft im Laden an. *الو* heißt am Telefon „Hallo“. *بفرستین* ist die höfliche Bittform von *فرستادن* („schicken“).
  prs.a2.unit31.lesson06.teach.d2_t2:
    title: Der Ladenbesitzer sagt zu und fragt nach der Uhrzeit
    gloss: Ja, gern. Um wie viel Uhr soll ich es schicken?
    note: Der Ladenbesitzer sagt zu und fragt mit der Form auf *-م*, *بفرستم*, nach der Zeit.
  prs.a2.unit31.lesson06.teach.d2_t3:
    title: Farzana nennt die Uhrzeit
    gloss: Um fünf Uhr. Bitte kommen Sie nicht zu spät.
    note: Farzana antwortet mit der Uhrzeit und fügt einen verneinten Imperativ hinzu.
  prs.a2.unit31.lesson06.teach.d2_t4:
    title: Der Ladenbesitzer verspricht es und bietet Tee an
    gloss: Nein, ich komme nicht zu spät. Soll ich auch Tee schicken?
    note: '*نه* bestätigt hier die verneinte Bitte: „Nein, ich werde nicht zu spät kommen.“ Dann bietet er Tee an.'
  prs.a2.unit31.lesson06.teach.d2_t5:
    title: Farzana lehnt ab
    gloss: Nein, danke. Ich habe Tee.
    note: 'Sie lehnt ab und nennt einen Grund: Sie hat schon Tee.'
  prs.a2.unit31.lesson06.teach.d2_t6:
    title: Der Ladenbesitzer beendet das Gespräch
    gloss: Sehr gut.
    note: Tut mir leid, ich kann jetzt nicht
