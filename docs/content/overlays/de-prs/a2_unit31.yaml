course:
  title: Dari A2
  description: 'Afghanisches Dari auf dem Niveau A2: höfliche Bitten mit می‌شود که und لطفاً, Hilfe anbieten, höflich annehmen oder ablehnen und mit dem verneinten Imperativ (نکنین) darum bitten, etwas nicht zu tun.'
units:
  prs.a2.unit31.polite_requests:
    title: Könnten Sie ...? Höfliche Bitten und Angebote
lessons:
  prs.a2.unit31.lesson01.polite_request:
    title: Könnten Sie ...? Höfliche Bitten
  prs.a2.unit31.lesson02.please_and_commands:
    title: Bitte und die Befehlsform
  prs.a2.unit31.lesson03.offers_and_replies:
