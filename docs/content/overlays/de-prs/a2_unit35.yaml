course:
  title: Dari A2
  description: 'Afghanisches Dari für Fortgeschrittene auf unterem Niveau: Ereignisse mit Zeitsätzen in eine Reihenfolge bringen, zum Beispiel bevor ich ging, nachdem ich angekommen war und als das Wasser kochte. „Vor“ und „nach“ mit einem Nomen, بعد از اینکه mit der Vergangenheit, قبل از اینکه mit dem Konjunktiv und وقتی که.'
units:
  prs.a2.unit35.before_after_when:
    title: Vor, nach, als
lessons:
  prs.a2.unit35.lesson01.before_after_nouns:
    title: „Vor“ und „nach“ mit einem Nomen
  prs.a2.unit35.lesson02.after_clause_travel:
    title: Nach einem Nebensatz und Reiseaufgaben
  prs.a2.unit35.lesson03.before_clause_cooking:
    title: Vor einem Nebensatz und Kochen
  prs.a2.unit35.lesson04.when_clause:
    title: Wann
  prs.a2.unit35.lesson05.reading_and_listening:
    title: 'Lesen und Hören: Reis und eine Reise'
  prs.a2.unit35.lesson06.morning_conversation:
    title: Ein Gespräch über den Morgen
teaching:
  prs.a2.unit35.lesson01.teach.before:
    title: Vor
    gloss: vor (mit Nomen)
    note: '*قبل از* bedeutet „vor“. Danach folgt ein Nomen, aber kein eigenes Verb: *قبل از صبحانه* heißt „vor dem Frühstück“.'
    example_gloss: Vor dem Frühstück dusche ich.
  prs.a2.unit35.lesson01.teach.after:
    title: Nach
    gloss: nach (mit Nomen)
    note: '*بعد از* bedeutet „nach“ und steht ebenfalls mit einem Nomen: *بعد از مکتب* heißt „nach der Schule“.'
    example_gloss: Nach der Schule gehe ich nach Hause.
  prs.a2.unit35.lesson01.teach.dinner:
    title: Abendessen
    gloss: Abendessen
    note: '*شام* ist das Abendessen. *می‌خورم* bedeutet „ich esse“ oder „ich trinke“: *شام می‌خورم* heißt „ich esse zu Abend“ und *چای می‌خورم* „ich trinke Tee“. Dari verwendet für beides dasselbe Verb.'
    example_gloss: Nach dem Abendessen trinke ich Tee.
  prs.a2.unit35.lesson01.teach.get_dressed:
    title: Sich anziehen
    gloss: sich anziehen
    note: '*لباس* bedeutet „Kleidung“ und *پوشیدن* „anziehen“. *لباس می‌پوشم* heißt „ich ziehe mich an“; *می‌پوشم* ist die Präsensform für „ich“.'
    example_gloss: Jeden Morgen ziehe ich mich an.
  prs.a2.unit35.lesson01.teach.wake_up:
    title: Aufwachen
    gloss: aufwachen
    note: '*بیدار شدن* bedeutet „aufwachen“. *شدن* heißt „werden“, also bedeutet *بیدار می‌شوم* „ich wache auf“, wörtlich „ich werde wach“.'
    example_gloss: Ich wache um sechs Uhr auf.
  prs.a2.unit35.lesson01.teach.noun_pattern:
    title: „Vor“ und „nach“ mit einem Nomen
    gloss: vor dem Frühstück, nach dem Frühstück, vor der Schule, nach der Schule, vor dem Abendessen, nach dem Abendessen
    note: 'Setzen Sie ein Nomen direkt nach *قبل از* oder *بعد از*, um zu sagen, wann etwas geschieht: *قبل از صبحانه* (vor dem Frühstück), *بعد از مکتب* (nach der Schule). Die Wendung hat kein eigenes Verb; das Verb steht im Hauptteil des Satzes. Die Wendung kann am Satzanfang stehen (*بعد از شام چای می‌خورم*) oder am Ende (*چای می‌خورم بعد از شام*).'
  prs.a2.unit35.lesson01.teach.sequence_words:
    title: Zuerst, dann, danach, schließlich
    gloss: Zuerst wache ich auf. Dann dusche ich. Danach frühstücke ich. Am Ende gehe ich zur Schule.
    note: 'Um einen Tag der Reihe nach zu erzählen, verwenden Sie kurze Verbindungswörter: *اول* (zuerst), *بعد* (dann), *بعد از آن* (danach) und *در آخر* (schließlich, am Ende). *بعد از آن* ist *بعد از* mit *آن* („das“) als Nomen und verweist so auf den eben genannten Schritt zurück.'
  prs.a2.unit35.lesson01.teach.phrase_school:
    title: Nach dem Frühstück gehe ich zur Schule
    gloss: Nach dem Frühstück gehe ich zur Schule.
    note: Das Nomen *صبحانه* steht nach *بعد از*, und das Verb *می‌روم* steht am Ende. So drücken Sie am einfachsten aus, was worauf folgt.
  prs.a2.unit35.lesson02.teach.ticket:
    title: Fahrkarte
    gloss: Ticket (für Flugzeug oder Bus)
    note: '*تکت* ist ein Ticket für ein Flugzeug oder einen Bus. *تکت گرفتن* heißt „ein Ticket holen“ oder „kaufen“.'
    example_gloss: Ich habe das Flugticket geholt.
  prs.a2.unit35.lesson02.teach.suitcase:
    title: Koffer
    gloss: Koffer
    note: '*چمدان* ist ein Koffer. Mit der Endung *-م* heißt es „mein“: *چمدانم* ist „mein Koffer“.'
    example_gloss: Mein Koffer ist zu Hause.
  prs.a2.unit35.lesson02.teach.pack:
    title: ich habe meinen Koffer gepackt
    gloss: Ich habe meinen Koffer gepackt.
    note: '*چمدان را بستن* heißt „einen Koffer packen“ (das Verb *بستن* ist dasselbe wie in *دروازه بسته است*). Zuerst steht der Koffer, dann *را*, dann das Verb: *بستم* ist das einfache Präteritum für „ich“.'
  prs.a2.unit35.lesson02.teach.after_past:
    title: بعد از اینکه + Vergangenheit
    gloss: Nachdem ich das Ticket geholt hatte, packte ich meinen Koffer.
    note: '*بعد از اینکه* bedeutet „nachdem“ und leitet einen Nebensatz mit eigenem Verb ein. Wenn Sie eine Geschichte in der Vergangenheit erzählen, steht dieses Verb im einfachen Präteritum: *بعد از اینکه تکت را گرفتم* heißt „nachdem ich das Ticket geholt hatte“. Der Hauptsatz sagt dann, was als Nächstes kam: *چمدانم را بستم*. Das Ereignis im *بعد از اینکه*-Satz geschah zuerst.'
  prs.a2.unit35.lesson02.teach.after_habit:
    title: بعد از اینکه für Gewohnheiten
    gloss: Nachdem ich am Bahnhof angekommen bin, hole ich ein Ticket.
    note: 'Für etwas, das Sie immer wieder tun, steht das Verb im Präsens mit *می‌*: *بعد از اینکه به ایستگاه می‌رسم* heißt „nachdem ich am Bahnhof ankomme“, und *تکت می‌گیرم* heißt „ich hole ein Ticket“. *می‌رسم* ist das Präsens von *رسیدن* für „ich“.'
  prs.a2.unit35.lesson02.teach.swap:
    title: Die Teilsätze können die Plätze tauschen
    gloss: Ich habe meinen Koffer gepackt, nachdem ich das Ticket bekommen hatte.
    note: 'Den Satz mit *بعد از اینکه* können Sie auch an zweiter Stelle nennen. Die Bedeutung ändert sich nicht: Das Ereignis im *بعد از اینکه*-Satz ist trotzdem zuerst geschehen. Es ändert sich nur die Reihenfolge der Wörter, nicht die Reihenfolge der Ereignisse.'
  prs.a2.unit35.lesson02.teach.noun_or_clause:
    title: Nomen oder Nebensatz
    gloss: nach dem Abendessen / nachdem ich zu Abend gegessen habe
    note: Verwenden Sie *بعد از* mit einem Nomen und *بعد از اینکه* mit einem ganzen Satz. *بعد از شام* heißt „nach dem Abendessen“. *بعد از اینکه شام خوردم* heißt „nachdem ich zu Abend gegessen habe“. Der zweite Ausdruck enthält ein Verb, deshalb kann er auch sagen, wer etwas getan hat.
  prs.a2.unit35.lesson02.teach.phrase_station:
    title: Nachdem ich am Bahnhof angekommen war, habe ich angerufen
    gloss: Nachdem ich am Bahnhof angekommen war, habe ich telefoniert.
    note: 'Eine typische Abfolge auf Reisen: zuerst *رسیدم* (das Ankommen), dann *تیلفون کردم* (der Anruf). *تیلفون کردن* ist die übliche Art, „anrufen“ oder „telefonieren“ zu sagen.'
  prs.a2.unit35.lesson03.teach.subjunctive_forms:
    title: قبل از اینکه + Konjunktiv
    gloss: bevor ich ankomme, bevor ich gehe, bevor ich esse, bevor ich komme, bevor ich kaufe
    note: '*قبل از اینکه* bedeutet „bevor“ und leitet einen Satz mit eigenem Verb ein. Dieses Verb steht nicht in der Vergangenheit, sondern im Konjunktiv, derselben Form wie nach *باید*: *ب-* plus Präsensstamm plus Endung. *رسیدن* ergibt *برسم*, *رفتن* ergibt *بروم*, *خوردن* ergibt *بخورم*, *آمدن* ergibt *بیایم*, *خریدن* ergibt *بخرم*.'
  prs.a2.unit35.lesson03.teach.subjunctive_paradigm:
    title: Die Endungen des Konjunktivs
    gloss: dass ich ankomme, dass du ankommst, dass er/sie ankommt, dass wir ankommen, dass ihr/Sie ankommt (höflich oder Plural), dass sie ankommen
    note: Die Endungen lauten *-م، -ی، -د، -یم، -ین، -ند*. So heißt *قبل از اینکه من برسم* „bevor ich ankomme“, *قبل از اینکه تو برسی* „bevor du ankommst“ (zu einem Freund), *قبل از اینکه او برسد* „bevor er oder sie ankommt“, *قبل از اینکه ما برسیم* „bevor wir ankommen“, *قبل از اینکه شما برسین* „bevor ihr/Sie ankommt“ (höflich oder Plural), *قبل از اینکه آن‌ها برسند* „bevor sie ankommen“. Die zweite Person Plural endet im Dari auf *-ین*; die geschriebene Form auf *-ید* wird ebenfalls verstanden.
  prs.a2.unit35.lesson03.teach.past_story:
    title: Auch in einer Geschichte in der Vergangenheit
    gloss: Bevor ich von zu Hause losging, habe ich meinen Koffer gepackt.
    note: 'Die Geschichte spielt in der Vergangenheit, deshalb erwartet man nach *قبل از اینکه* ein Verb in der Vergangenheit. Es steht aber der Konjunktiv: *بروم*, nicht *رفتم*. Der Grund: Als der Koffer gepackt wurde, hatte das Weggehen noch nicht stattgefunden. Sagen Sie hier nicht *قبل از اینکه رفتم* oder *قبل از اینکه می‌روم*. Der Hauptsatz steht im einfachen Präteritum: *چمدانم را بستم*.'
  prs.a2.unit35.lesson03.teach.noun_or_clause:
    title: Nomen oder Nebensatz
    gloss: vor dem Abendessen / bevor ich zu Abend esse
    note: 'Mit einem Nomen verwenden Sie *قبل از*: *قبل از شام*. Mit einem Satz fügen Sie *اینکه* hinzu und setzen das Verb in den Konjunktiv: *قبل از اینکه شام بخورم*. Das entspricht *بعد از شام* und *بعد از اینکه شام خوردم*, nur steht das Verb nach *بعد از اینکه* in der Vergangenheit und nach *قبل از اینکه* im Konjunktiv.'
  prs.a2.unit35.lesson03.teach.rice:
    title: Reis
    gloss: der Reis
    note: '*برنج* heißt „Reis“. Er ist eines der wichtigsten Lebensmittel der afghanischen Küche.'
    example_gloss: Ich esse Reis.
  prs.a2.unit35.lesson03.teach.onion:
    title: Zwiebel
    gloss: Zwiebel
    note: '*پیاز* heißt „Zwiebel“. Viele Gerichte beginnen mit Zwiebeln.'
    example_gloss: Es gibt Zwiebeln zu Hause.
  prs.a2.unit35.lesson03.teach.chop:
    title: Hacken
    gloss: hacken, in kleine Stücke schneiden
    note: '*خرد کردن* heißt, etwas in kleine Stücke zu hacken. Das Objekt steht zuerst, mit *را*: *پیاز را خرد می‌کنم* heißt „Ich hacke die Zwiebel“.'
    example_gloss: Ich hacke die Zwiebel.
  prs.a2.unit35.lesson03.teach.cook:
    title: Kochen
    gloss: kochen, garen
    note: '*پختن* heißt, Essen zuzubereiten. Der Präsensstamm ist *پز*: *می‌پزم* heißt „ich koche“, *بپزم* „dass ich koche“ (der Konjunktiv, der nach *قبل از اینکه* steht) und *پختم* „ich habe gekocht“.'
    example_gloss: Ich koche Reis.
  prs.a2.unit35.lesson03.teach.sleep:
    title: Schlafen
    gloss: schlafen, ins Bett gehen
    note: '*خوابیدن* heißt „schlafen“ oder „schlafen gehen“. *می‌خوابم* heißt „ich schlafe“ und *بخوابم* „dass ich schlafe“ (der Konjunktiv).'
    example_gloss: Ich gehe um zehn Uhr schlafen.
  prs.a2.unit35.lesson03.teach.phrase_cook:
    title: Bevor ich den Reis koche, hacke ich die Zwiebel
    gloss: Bevor ich den Reis koche, hacke ich die Zwiebel.
    note: 'Ein Kochvorgang in der richtigen Reihenfolge. *بپزم* ist der Konjunktiv nach *قبل از اینکه*; *خرد می‌کنم* ist das Präsens für eine Gewohnheit oder ein Rezept: erst die Zwiebel, dann der Reis.'
  prs.a2.unit35.lesson04.teach.when_past:
    title: وقتی که für ein einzelnes Ereignis in der Vergangenheit
    gloss: Als ich nach Hause kam, habe ich zu Abend gegessen.
    note: '*وقتی که* bedeutet „als“ oder „wenn“ und leitet einen Satz mit eigenem Verb ein. Für ein einzelnes Ereignis in der Vergangenheit steht in beiden Teilen das einfache Präteritum: *وقتی که به خانه رسیدم* (als ich nach Hause kam), *شام خوردم* (ich habe zu Abend gegessen). Die beiden Ereignisse geschehen ungefähr gleichzeitig oder kurz nacheinander.'
  prs.a2.unit35.lesson04.teach.when_habit:
    title: وقتی که für eine Gewohnheit
    gloss: Wenn ich nach Hause komme, trinke ich Tee.
    note: 'Für etwas, das jedes Mal geschieht, steht in beiden Teilen das Präsens mit *می‌*: *وقتی که به خانه می‌رسم، چای می‌خورم* heißt „Wenn ich nach Hause komme, trinke ich Tee“.'
  prs.a2.unit35.lesson04.teach.when_future:
    title: وقتی که für etwas, das noch bevorsteht
    gloss: Wenn ich morgen in Herat ankomme, rufe ich an.
    note: 'Liegt der Zeitpunkt noch in der Zukunft, steht nach *وقتی که* der Konjunktiv (*برسم*), und das Hauptverb steht im Präsens mit *می‌* plus Zeitangabe: *فردا ... تیلفون می‌کنم* (wörtlich „morgen rufe ich an“, also „ich werde anrufen“). Eine eigene Futurform brauchen Sie nicht.'
  prs.a2.unit35.lesson04.teach.water:
    title: Wasser
    gloss: das Wasser
    note: '*آب* heißt „Wasser“. Kaltes Wasser heißt *آب سرد*; für heißes Wasser sagt man *آب گرم*.'
    example_gloss: Das Wasser ist heiß.
  prs.a2.unit35.lesson04.teach.boil:
    title: Kochen (Wasser)
    gloss: kochen (vom Wasser)
    note: '*جوش شدن* heißt „kochen“ (vom Wasser). Das einfache Präteritum ist *جوش شد*, das Präsens *جوش می‌شود*: *آب جوش می‌شود* heißt „Das Wasser kocht“.'
    example_gloss: Das Wasser hat gekocht.
  prs.a2.unit35.lesson04.teach.salt:
    title: Salz
    gloss: Salz
    note: '*نمک* heißt „Salz“. Es gehört in einem einfachen Rezept zusammen mit *برنج* und *آب*.'
    example_gloss: Es gibt Salz und Reis zu Hause.
  prs.a2.unit35.lesson04.teach.throw_in:
    title: Hineingeben
    gloss: hineinwerfen, hineingeben
    note: '*انداختن* heißt „werfen“ oder „etwas hineingeben“. Beim Kochen ist es das übliche Verb für das Hinzufügen: *نمک را می‌اندازم* heißt „Ich gebe das Salz hinein“. Das einfache Präteritum ist *انداختم*.'
    example_gloss: Ich gebe das Salz ins Wasser.
  prs.a2.unit35.lesson04.teach.phrase_boil:
    title: Wenn das Wasser kocht, gebe ich den Reis hinein
    gloss: Wenn das Wasser kocht, gebe ich den Reis hinein.
    note: 'Eine Gewohnheit in einem Rezept: Beide Verben stehen im Präsens mit *می‌*.'
  prs.a2.unit35.lesson04.teach.when_short:
    title: وقتی که oder nur وقتی
    gloss: als ich ankam / als ich ankam
    note: Beide Formen sind richtig. *وقتی که* ist etwas ausführlicher, *وقتی* allein ist kürzer, die Bedeutung ist dieselbe. Der Kurs verwendet zuerst *وقتی که*; Sie können beide eingeben.
  prs.a2.unit35.lesson04.teach.phrase_ready:
    title: Als der Reis fertig war, habe ich ihn gegessen
    gloss: Als der Reis fertig war, habe ich ihn gegessen.
    note: '*آماده شد* heißt „er wurde fertig“. *آن را* („ihn/es“, mit *را*) verweist auf den Reis zurück.'
  prs.a2.unit35.lesson05.teach.pack_present:
    title: Einen Koffer packen
    gloss: einen Koffer packen
    note: '*چمدان بستن* heißt „einen Koffer packen“. Die Form für „ich“ im Präsens ist *می‌بندم*: *چمدانم را می‌بندم* heißt „Ich packe meinen Koffer“. Das einfache Präteritum ist *بستم*.'
    example_gloss: Vor einer Reise packe ich meinen Koffer.
  prs.a2.unit35.lesson05.teach.travel_turn01:
    title: Narges fragt nach der Abflugzeit
    gloss: Akbar, um wie viel Uhr fliegt das Flugzeug morgen ab?
    note: Narges fragt mit *ساعت چند* nach der Uhrzeit. *حرکت می‌کند* ist das Präsens von *حرکت کردن* („abfahren, abfliegen“); mit *فردا* sagt es, was morgen geschehen wird.
  prs.a2.unit35.lesson05.teach.travel_turn02:
    title: Akbar nennt die Uhrzeit und einen ersten Schritt
    gloss: Um zehn. Bevor ich zum Flughafen gehe, packe ich meinen Koffer.
    note: Akbar nennt die Uhrzeit und sagt dann mit einem *قبل از اینکه*-Satz, was er zuerst tut. *بروم* ist der Konjunktiv, und *می‌بندم* ist das Präsens mit Zukunftsbedeutung.
  prs.a2.unit35.lesson05.teach.travel_turn03:
    title: Narges fragt nach dem Ticket
    gloss: Hast du ein Ticket?
    note: '*تکت داری؟* ist eine freundliche Frage an einen Freund: *داری* heißt „du hast“, in der vertrauten Singularform.'
  prs.a2.unit35.lesson05.teach.travel_turn04:
    title: Akbar sagt, dass er das Ticket hat
    gloss: Ja, ich habe das Ticket gestern geholt.
    note: '*گرفتم* ist das einfache Präteritum: Er hat das Ticket gestern geholt. *بلی* heißt „ja“.'
  prs.a2.unit35.lesson05.teach.travel_turn05:
    title: Narges bittet ihn, bei der Ankunft anzurufen
    gloss: Rufst du mich an, wenn du in Herat ankommst?
    note: Der Satz *وقتی که به هرات برسی* liegt noch in der Zukunft, deshalb steht das Verb im Konjunktiv *برسی* („du ankommst“). *به من تیلفون می‌کنی؟* heißt „Rufst du mich an?“.
  prs.a2.unit35.lesson05.teach.travel_turn06:
    title: Akbar verspricht es
    gloss: Ja. Wenn ich ankomme, rufe ich an.
    note: 'Akbar verwendet dasselbe Muster: *وقتی که برسم*, Konjunktiv für „ich“, dann *تیلفون می‌کنم*.'
  prs.a2.unit35.lesson05.teach.message:
    title: Eine Nachricht über das Reiskochen
    gloss: Hallo Akbar. Gestern habe ich zu Hause Reis gekocht. Zuerst habe ich die Zwiebel gehackt. Nachdem das Wasser gekocht hatte, habe ich das Salz und den Reis hineingegeben. Als der Reis fertig war, habe ich ihn gegessen. Bevor ich schlafen ging, habe ich Tee getrunken.
    note: 'Eine kurze schriftliche Nachricht, die alle drei Konnektoren verwendet, um die Schritte der Reihe nach zu erzählen: *اول*, *بعد از اینکه*, *وقتی که* und *قبل از اینکه*.'
  prs.a2.unit35.lesson06.teach.work_my:
    title: Meine Arbeit
    gloss: meine Arbeit, mein Job
    note: '*کار* heißt „Arbeit“ und *کارم* „meine Arbeit“. *کارم را شروع می‌کنم* heißt „Ich beginne meine Arbeit“.'
    example_gloss: Meine Arbeit ist im Büro.
  prs.a2.unit35.lesson06.teach.morning_turn01:
    title: Nasrin fragt, wann Yusuf aufsteht
    gloss: Yusuf, um wie viel Uhr stehst du jeden Morgen auf?
    note: '*هر صبح* heißt „jeden Morgen“. *چه وقت* fragt „wann“, und *بیدار می‌شوی* heißt „du wachst auf“ bzw. „du stehst auf“ (zu einem Freund).'
  prs.a2.unit35.lesson06.teach.morning_turn02:
    title: Yusuf nennt die Uhrzeit und einen ersten Schritt
    gloss: Um sechs. Nachdem ich aufgewacht bin, dusche ich.
    note: 'Eine Gewohnheit, deshalb stehen die Verben nach *بعد از اینکه* im Präsens mit *می‌*: *بیدار می‌شوم*, dann *دوش می‌گیرم*.'
  prs.a2.unit35.lesson06.teach.morning_turn03:
    title: Nasrin fragt, was danach kommt
    gloss: Was machst du danach?
    note: '*بعد از آن* heißt „danach“. Es verweist auf den eben genannten Schritt zurück.'
  prs.a2.unit35.lesson06.teach.morning_turn04:
    title: Yusuf nennt die nächsten Schritte
    gloss: Ich ziehe mich an. Bevor ich ins Büro gehe, frühstücke ich.
    note: '*لباس می‌پوشم* ist der nächste Schritt. Dann folgt ein *قبل از اینکه*-Satz: *بروم* ist der Konjunktiv und *صبحانه می‌خورم* das Hauptverb.'
  prs.a2.unit35.lesson06.teach.morning_turn05:
    title: Nasrin fragt nach der Uhrzeit im Büro
    gloss: Um wie viel Uhr gehst du ins Büro?
    note: '*ساعت چند* fragt nach der Uhrzeit, und *می‌روی* heißt „du gehst“.'
  prs.a2.unit35.lesson06.teach.morning_turn06:
    title: Yusuf sagt, was er im Büro tut
    gloss: Um acht. Wenn ich ankomme, beginne ich zuerst meine Arbeit.
    note: '*وقتی که می‌رسم* heißt „wenn ich ankomme“ (eine Gewohnheit: jeden Tag), und *اول کارم را شروع می‌کنم* heißt „zuerst beginne ich meine Arbeit“.'
  prs.a2.unit35.lesson06.teach.summary:
    title: Die drei Konnektoren zusammen
    gloss: bevor ich gehe; nachdem ich angekommen war; als ich ankam
    note: 'Drei Konnektoren, drei Muster. *قبل از اینکه* + Konjunktiv (*بروم*): Das Verb hat die Form mit *ب-*. *بعد از اینکه* + einfaches Präteritum (*رسیدم*) in einer Geschichte oder Präsens bei einer Gewohnheit (*بیدار می‌شوم*): Das erste Ereignis ist abgeschlossen. *وقتی که* + einfaches Präteritum, Präsens oder Konjunktiv: Das Tempus zeigt, ob es einmalig war, eine Gewohnheit ist oder noch bevorsteht. Mit einem Nomen verwenden Sie *قبل از* oder *بعد از* allein.'
