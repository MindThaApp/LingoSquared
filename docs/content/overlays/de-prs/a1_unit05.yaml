course:
  title: Dari in Deutsch A1
  description: 'Dari (Afghanistan) für Anfänger: Orte in der Stadt benennen, fragen, wo etwas ist, einfache Ortsangaben machen und einfachen Wegbeschreibungen zu einem Ort folgen.'
units:
