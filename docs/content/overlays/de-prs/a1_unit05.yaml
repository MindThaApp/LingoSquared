teaching:
  prs.a1.unit05.lesson01.teach.bazaar:
    title: Markt
    gloss: Markt / Basar
    note: بازار ist das alltägliche Wort für ein Marktviertel, oft eine ganze Straße oder ein ganzes Viertel voller Geschäfte.
    example_gloss: Der Basar ist in der Nähe.
  prs.a1.unit05.lesson01.teach.bank:
    title: Bank
    gloss: Bank
    note: بانک ist ein direktes Lehnwort und wird ähnlich verwendet wie das deutsche Wort „Bank“ im Sinne des Geldinstituts.
    example_gloss: Wo ist die Bank?
  prs.a1.unit05.lesson01.teach.mosque:
    title: Moschee
    gloss: Moschee
    note: مسجد ist das Standardwort für eine Moschee.
    example_gloss: Die Moschee ist groß.
  prs.a1.unit05.lesson01.teach.hospital:
    title: Krankenhaus
    gloss: Krankenhaus
    note: شفاخانه ist das alltägliche afghanische Dari-Wort für „Krankenhaus“ – anders als das iranische Persisch بیمارستان, das Dari-Sprecher zwar verstehen können, selbst aber normalerweise nicht verwenden.
    example_gloss: Das Krankenhaus ist weit entfernt.
  prs.a1.unit05.lesson01.teach.school:
    title: Schule
    gloss: Schule
    note: مکتب ist das alltägliche afghanische Dari-Wort für „Schule“ – anders als das iranische Persisch مدرسه, das im Dari meist speziell eine religiöse Schule bezeichnet.
    example_gloss: Die Schule ist in der Nähe des Hauses.
  prs.a1.unit05.lesson01.teach.pharmacy:
    title: Apotheke
    gloss: Apotheke
    note: دواخانه ist das alltägliche afghanische Dari-Wort für „Apotheke“ (von دوا, Medizin) – anders als das iranische Persisch داروخانه.
    example_gloss: Wo ist die Apotheke?
  prs.a1.unit05.lesson01.teach.va_word:
    title: Und
    gloss: und
    note: و ist das gängige Bindewort, mit dem man mehrere Orte aneinanderreiht.
    target_text: و (und)
  prs.a1.unit05.lesson02.teach.post_office:
    title: Postamt
    gloss: Postamt
    note: پوسته خانه setzt sich aus پوسته (Post) und خانه (Haus/Gebäude) zusammen.
    example_gloss: Das Postamt ist geschlossen.
  prs.a1.unit05.lesson02.teach.embassy:
    title: Botschaft
    gloss: Botschaft
    note: سفارت ist das Standardwort für eine Botschaft.
    example_gloss: Die Botschaft ist in Kabul.
  prs.a1.unit05.lesson02.teach.airport:
    title: Flughafen
    gloss: Flughafen
    note: میدان هوایی ist der alltägliche afghanische Dari-Ausdruck für „Flughafen“ (wörtlich „Luftfeld“) – anders als das iranische Persisch فرودگاه.
    example_gloss: Der Flughafen ist weit entfernt.
  prs.a1.unit05.lesson02.teach.office_review:
    title: Büro (Wiederholung)
    gloss: Büro
    note: دفتر wurde schon in einer früheren Lektion eingeführt; es steht hier zusammen mit den anderen öffentlichen Orten.
    example_gloss: Mein Büro ist in der Nähe.
  prs.a1.unit05.lesson03.teach.kojast_bazaar:
    title: Fragen, wo der Markt ist
    gloss: Wo ist der Markt?
    note: بازار کجاست؟ ist das Grundmuster, um nach dem Ort von irgendetwas zu fragen.
  prs.a1.unit05.lesson03.teach.kojast_hospital:
    title: Fragen, wo das Krankenhaus ist
    gloss: Wo ist das Krankenhaus?
    note: Dasselbe Muster mit کجاست funktioniert mit jedem Substantiv für einen Ort.
  prs.a1.unit05.lesson03.teach.bebakhshid:
    title: Jemanden höflich ansprechen
    gloss: Entschuldigung, wo ist die Apotheke?
    note: ببخشین eröffnet höflich eine Frage an eine fremde Person, ähnlich wie „Entschuldigung“ im Deutschen.
  prs.a1.unit05.lesson03.teach.kojast_grammar:
    title: Wie کجاست gebildet wird
    gloss: کجاست ist کجا („wo“) plus است („ist“), zusammengezogen.
    note: Wenn Sie diese Zusammensetzung erkennen, sehen Sie das Muster, statt کجاست als einen einzigen, unanalysierten Block auswendig zu lernen.
  prs.a1.unit05.lesson04.teach.near:
    title: In der Nähe
    gloss: in der Nähe von
    note: نزدیک beschreibt etwas, das in der Nähe ist.
    example_gloss: Die Bank ist in der Nähe.
  prs.a1.unit05.lesson04.teach.far:
    title: Weit
    gloss: weit
    note: دور beschreibt etwas, das in der Ferne liegt.
    example_gloss: Das Krankenhaus ist weit entfernt.
  prs.a1.unit05.lesson04.teach.here:
    title: Hier
    gloss: hier
    note: این‌جا verweist auf den Ort, an dem sich die sprechende Person gerade befindet.
    example_gloss: Die Bank ist hier.
  prs.a1.unit05.lesson04.teach.there:
    title: Dort
    gloss: dort
    note: آن‌جا verweist auf einen Ort, der von der sprechenden Person entfernt ist.
    example_gloss: Die Apotheke ist dort.
  prs.a1.unit05.lesson04.teach.bazaar_near:
    title: Sagen, dass der Markt nah ist
    gloss: Der Markt ist nah.
    note: بازار نزدیک است verwendet dieselbe Kopula است wie im ganzen Kurs.
  prs.a1.unit05.lesson04.teach.airport_far:
    title: Sagen, dass der Flughafen weit ist
    gloss: Der Flughafen ist weit entfernt.
    note: میدان هوایی دور است folgt demselben Muster, nur mit دور statt نزدیک.
  prs.a1.unit05.lesson05.teach.next_to:
    title: Neben
    gloss: neben
    note: در کنار bedeutet wörtlich „an der Seite von“.
  prs.a1.unit05.lesson05.teach.behind:
    title: Hinter
    gloss: hinter
    note: پشت zeigt an, dass sich etwas hinter einem anderen Ort befindet.
    example_gloss: Die Apotheke ist hinter der Schule.
  prs.a1.unit05.lesson05.teach.opposite:
    title: Gegenüber
    gloss: gegenüber
    note: مقابل zeigt an, dass sich etwas direkt gegenüber von einem anderen Ort befindet.
    example_gloss: Die Bank ist gegenüber der Moschee.
  prs.a1.unit05.lesson05.teach.hospital_next_to_mosque:
    title: Das Krankenhaus in Bezug auf die Moschee verorten
    gloss: Das Krankenhaus ist neben der Moschee.
    note: شفاخانه در کنار مسجد است verbindet einen Ort, die Präposition در کنار und die Kopula است.
  prs.a1.unit05.lesson06.teach.tashakor_ziad:
    title: Vielen Dank
    gloss: Vielen Dank.
    note: تشکر زیاد verstärkt das bereits gelernte alltägliche تشکر.
  prs.a1.unit05.lesson06.teach.turn01:
    title: Zarmina fragt nach der Apotheke
    gloss: Zarmina fragt einen Passanten höflich, wo die Apotheke ist.
    note: ببخشین leitet die Frage respektvoll ein und passt zu einer fremden Person.
  prs.a1.unit05.lesson06.teach.turn02:
    title: Der Passant erklärt den Weg
    gloss: Der Passant sagt, die Apotheke sei nicht weit, man solle geradeaus gehen, und sie liege neben der Schule.
    note: 'Hier kommen mehrere Muster dieser Lektion zusammen: دور نیست (verneinte Form von دور), مستقیم بروین und در کنار.'
  prs.a1.unit05.lesson06.teach.turn03:
    title: Zarmina bedankt sich beim Passanten
    gloss: Zarmina bedankt sich herzlich bei ihm.
    note: تشکر زیاد beschließt das Gespräch höflich.
  prs.a1.unit05.lesson06.teach.turn04:
    title: Die bescheidene Antwort des Passanten
    gloss: Keine Ursache / Nicht der Rede wert.
    note: 'قابلی نداره ist im Alltag des afghanischen Dari eine gängige, bescheidene Antwort auf einen Dank. Es entspricht in der Funktion خواهش می‌کنم, ist aber lockerer. نداره ist die gesprochene Form von ندارد: Gehört wird نداره, in sorgfältiger Schriftsprache steht ندارد.'
