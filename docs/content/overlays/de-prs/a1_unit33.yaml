teaching:
  prs.a1.unit33.lesson01.teach.housework_word:
    title: Hausarbeit
    gloss: Hausarbeit
    note: کار خانه bedeutet Hausarbeit und ist der Themenausdruck dieser Lektion.
    example_gloss: Es gibt viel Hausarbeit.
  prs.a1.unit33.lesson01.teach.broom_word:
    title: Besen
    gloss: Besen
    note: جاروب bedeutet Besen und ist das in Afghanistan gebräuchliche Dari-Wort.
    example_gloss: Wo ist der Besen?
  prs.a1.unit33.lesson01.teach.dishes_word:
    title: Geschirr
    gloss: Geschirr
    note: ظرف bedeutet Geschirr und ist ein gängiges Wort, das Persisch und Dari gemeinsam haben.
    example_gloss: Das Geschirr ist in der Küche.
  prs.a1.unit33.lesson01.teach.clean_word:
    title: Sauber
    gloss: sauber
    note: پاک bedeutet sauber und beschreibt zum Beispiel ein Zimmer oder einen Gegenstand.
    example_gloss: Das Zimmer ist sauber.
  prs.a1.unit33.lesson01.teach.review_wash_do:
    title: Waschen / tun
    gloss: waschen / machen – ich wasche / ich mache
    note: شستن (waschen) ist ein ganz neues Verb; کردن (machen, tun) und می‌کنم (ich mache) kennen Sie bereits aus früheren Lektionen.
    target_text: شستن (waschen) / کردن (tun) — می‌شویم (ich wasche) / می‌کنم (ich tue)
  prs.a1.unit33.lesson01.teach.sweep_phrase:
    title: Ich kehre
    gloss: Ich kehre.
    note: 'Verbindet جاروب (Besen) mit می‌کنم (ich mache, bereits bekannt) – wörtlich: „Ich mache Besen“.'
  prs.a1.unit33.lesson01.teach.wash_dishes_phrase:
    title: Ich spüle das Geschirr
    gloss: Ich spüle das Geschirr.
    note: Verbindet ظرف (Geschirr) mit می‌شویم (ich wasche), der Form der 1. Person von شستن.
  prs.a1.unit33.lesson02.teach.review_emrouz_che_bali:
    title: Heute / was / ja
    gloss: heute / was / ja
    note: امروز, چه und بلی kennen Sie bereits aus früheren Lektionen.
    target_text: امروز (heute) / چه (was) / بلی (ja)
  prs.a1.unit33.lesson02.teach.must_word:
    title: Müssen / sollen
    gloss: müssen / sollen
    note: باید ist ein ganz neues Modalwort. Hier drückt es aus, dass eine Arbeit erledigt werden muss.
    target_text: باید (muss / soll)
  prs.a1.unit33.lesson02.teach.subjunctive_konam:
    title: Dass ich tue
    gloss: dass ich mache
    note: کنم ist die einfache Konjunktivform, die nach باید bei Verben mit کردن ohne das Präfix می‌ steht.
    target_text: کنم (dass ich tue — nach باید bei Verben mit کردن, ohne می‌)
  prs.a1.unit33.lesson02.teach.must_sweep_phrase:
    title: Heute muss ich kehren
    gloss: Heute muss ich kehren.
    note: Verbindet امروز (heute, bereits bekannt) mit باید جاروب کنم (ich muss kehren).
  prs.a1.unit33.lesson02.teach.must_clean_phrase:
    title: Ich muss putzen
    gloss: Ich muss putzen.
    note: Verbindet باید (müssen, bereits bekannt) mit پاک کنم (dass ich putze).
  prs.a1.unit33.lesson02.teach.what_must_question:
    title: Was muss ich tun?
    gloss: Was muss ich tun?
    note: Verbindet چه کار (was für eine Arbeit) mit باید کنم (ich muss tun).
  prs.a1.unit33.lesson02.teach.answer_must_sweep:
    title: Ja, ich muss kehren
