course:
  title: Dari in Deutsch A1
  description: 'Kabuler Dari für Anfänger: Wortschatz rund um die Hausarbeit (Hausarbeit, Besen, Geschirr, sauber, Hilfe), mit باید sagen, welche Arbeit heute erledigt werden muss, jemanden um Hilfe bei einer Arbeit bitten und ein Dialog zwischen Wahid und Shukria über die Aufteilung der Hausarbeit.'
