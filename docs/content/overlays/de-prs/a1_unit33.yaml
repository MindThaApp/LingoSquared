    title: Ich mag / Zeit / ich habe nicht / aber
    gloss: ich mag / Zeit / ich habe nicht / aber
    note: دوست دارم (ich mag), وقت (Zeit), ندارم (ich habe nicht) und اما (aber) kennen Sie bereits aus früheren Lektionen; sie setzen das Muster der Zusammenfassung fort.
