teaching:
  prs.a2.unit37.lesson01.teach.weather:
    title: Wetter
    gloss: Wetter, Luft
    note: '*هوا* ist das Wetter und auch die Luft. *هوا خوب است* heißt „Das Wetter ist gut“, und *هوا بد است* heißt „Das Wetter ist schlecht“.'
    example_gloss: Heute ist das Wetter gut.
  prs.a2.unit37.lesson01.teach.cold:
    title: Kalt
    gloss: kalt
    note: '*سرد* bedeutet „kalt“. Das Gegenteil ist *گرم* (warm, heiß), das Sie schon kennen.'
    example_gloss: Das Wetter ist heute kalt.
  prs.a2.unit37.lesson01.teach.outside:
    title: Draußen
    gloss: draußen
    note: '*بیرون* bedeutet „draußen“ oder „nach draußen“. *بیرون می‌روم* heißt „Ich gehe nach draußen“, und *بیرون از خانه* heißt „außerhalb des Hauses“.'
    example_gloss: Ich bin draußen vor dem Haus.
  prs.a2.unit37.lesson01.teach.if_pattern:
    title: 'اگر: eine reale Bedingung'
    gloss: Wenn das Wetter gut ist, gehe ich in den Park. Wenn es regnet, bleibe ich zu Hause.
    note: '*اگر* bedeutet „wenn, falls“. Es leitet eine Bedingung ein, die wirklich eintreten kann, und das Verb der Bedingung steht im Konjunktiv: *باشد*, *ببارد*. Das ist dieselbe Form wie nach *باید*: ein *ب-* vor dem Präsensstamm (*ببارد*), und bei *بودن* *باشد* ohne *ب-*. Der Hauptsatz sagt dann, was geschieht, und steht im einfachen Präsens mit *می‌*: *به پارک می‌روم*. Das Präsens mit *می‌* deckt auch die Zukunft ab, sodass Sie keine eigene Zukunftsform brauchen. Nach der Bedingung steht ein Komma.'
  prs.a2.unit37.lesson01.teach.paradigm_ro:
    title: Der Konjunktiv von رفتن nach اگر
    gloss: wenn ich gehe, wenn du gehst, wenn er/sie geht, wenn wir gehen, wenn Sie gehen (formell) bzw. ihr geht, wenn sie gehen
    note: 'Der Präsensstamm von *رفتن* ist *رو*. Setzen Sie *ب-* davor und hängen Sie die Endungen an: *بروم* (ich), *بروی* (du, zu einem Freund), *برود* (er, sie, es), *برویم* (wir), *بروین* (Sie, formell, oder ihr), *بروند* (sie). Jedes Verb hat dieselben sechs Endungen: *-م، -ی، -د، -یم، -ین، -ند*. Die Endung *-ین* gilt für „Sie“ (formell) und „ihr“. Die Formen mit *-ید* werden auch verstanden, aber dieser Kurs schreibt *-ین*.'
  prs.a2.unit37.lesson01.teach.snow_phrase:
    title: Wenn es schneit, gehe ich nicht nach draußen
    gloss: Wenn es schneit, gehe ich nicht nach draußen.
    note: 'Der Hauptsatz kann verneint sein. Setzen Sie *نمی‌* vor den Präsensstamm: *نمی‌روم* heißt „Ich gehe nicht“. Die Bedingung bleibt gleich: *اگر برف ببارد* heißt „wenn es schneit“.'
  prs.a2.unit37.lesson01.teach.cold_phrase:
    title: Wenn das Wetter kalt ist, bleibe ich zu Hause
    gloss: Wenn das Wetter kalt ist, bleibe ich zu Hause.
    note: '*اگر هوا سرد باشد* heißt „wenn das Wetter kalt ist“. Bei *هوا* mit einem Adjektiv endet die Bedingung immer auf *باشد*.'
  prs.a2.unit37.lesson02.teach.weekend:
    title: Wochenende
    gloss: Wochenende
    note: '*آخر هفته* ist das Wochenende. *آخر* bedeutet „Ende“, und *هفته* ist die Woche.'
    example_gloss: Am Wochenende gehen wir in den Park.
  prs.a2.unit37.lesson02.teach.tonight:
    title: Heute Abend
    gloss: heute Abend
    note: '*امشب* bedeutet „heute Abend“. Es ist eine Zeitangabe, die im Hauptsatz mit *می‌* stehen kann: *امشب می‌روم* heißt „Ich gehe heute Abend“.'
    example_gloss: Heute Abend gehe ich ins Kino.
  prs.a2.unit37.lesson02.teach.formation:
    title: Der Konjunktiv anderer Verben
    gloss: dass ich kaufe, dass ich nehme, dass ich gebe, dass ich komme, dass ich bleibe, dass ich esse
    note: 'Die Regel von *رفتن* gilt für jedes Verb: Präsensstamm mit *ب-* davor, dann die Endungen. *خر* ergibt *بخرم* (ich kaufe), *گیر* ergibt *بگیرم* (ich nehme), *ده* ergibt *بدهم* (ich gebe), *مان* ergibt *بمانم* (ich bleibe), *خور* ergibt *بخورم* (ich esse). Merken Sie sich *آمدن*: Sein Konjunktiv lautet *بیایم، بیایی، بیاید، بیاییم، بیایین، بیایند*, mit einem zusätzlichen *ی*. Nach *اگر* bedeuten diese Formen „wenn ich kaufe“, „wenn ich nehme“ usw.'
  prs.a2.unit37.lesson02.teach.be_have:
    title: Der Konjunktiv von بودن und داشتن
    gloss: dass ich sei, dass du seist, dass er/sie sei, dass wir seien, dass Sie (formell) bzw. ihr seid, dass sie seien
    note: '*باشم، باشی، باشد، باشیم، باشین، باشند* sind die sechs Konjunktivformen von *بودن*; sie haben kein *ب-*. Für „wenn ich habe“ verwendet Dari *داشته باشم*: das Partizip *داشته* plus *باشم*. So heißt *اگر وقت داشته باشم* „wenn ich Zeit habe“ und *اگر پول داشته باشی* „wenn du Geld hast“. Für eine mögliche zukünftige Situation ist das die übliche Form.'
  prs.a2.unit37.lesson02.teach.money_phrase:
    title: Wenn ich Geld habe, kaufe ich ein Buch
    gloss: Wenn ich Geld habe, kaufe ich ein Buch.
    note: '*اگر پول داشته باشم* heißt „wenn ich Geld habe“. Der Hauptsatz steht im einfachen Präsens: *کتاب می‌خرم* heißt „Ich kaufe ein Buch“ oder „Ich werde ein Buch kaufen“.'
  prs.a2.unit37.lesson02.teach.negative:
    title: 'Die Verneinung: ن statt ب'
    gloss: wenn ich nicht gehe, wenn ich nicht komme, wenn ich nicht kaufe, wenn es nicht ist, wenn es nicht regnet
    note: 'Um die Bedingung zu verneinen, ersetzen Sie *ب-* durch *ن-*: Aus *بروم* wird *نروم*, aus *بخرم* wird *نخرم* und aus *بیایم* wird *نیایم*. Aus *باشد* und *ببارد* werden *نباشد* und *نبارد*. So heißt *اگر باران نبارد* „wenn es nicht regnet“.'
  prs.a2.unit37.lesson02.teach.friend_phrase:
    title: Wenn mein Freund kommt, spielen wir zusammen Fußball
    gloss: Wenn mein Freund kommt, spielen wir zusammen Fußball.
    note: 'Die Bedingung enthält *بیاید* (der Konjunktiv von *آمدن* für er oder sie). Der Hauptsatz sagt jetzt „wir“: *می‌کنیم* heißt „wir tun“ bzw. „wir machen“, und *می‌رویم* heißt „wir gehen“. *با هم* bedeutet „zusammen“.'
  prs.a2.unit37.lesson02.teach.norain_phrase:
    title: Wenn es nicht regnet, gehen wir in den Park
    gloss: Wenn es nicht regnet, gehen wir in den Park.
    note: '*اگر باران نبارد* heißt „wenn es nicht regnet“. Der Hauptsatz ist bejaht, und *می‌رویم* heißt „wir gehen“.'
  prs.a2.unit37.lesson02.teach.time_phrase:
    title: Wenn ich Zeit habe, gehe ich heute Abend ins Kino
    gloss: Wenn ich Zeit habe, gehe ich heute Abend ins Kino.
    note: Eine Bedingung über Zeit haben verwendet *داشته باشم*. Das Zeitwort *امشب* im Hauptsatz zeigt, dass der Plan für heute Abend gilt.
  prs.a2.unit37.lesson03.teach.clothes:
    title: Kleidung
    gloss: Kleidung
    note: '*لباس* bedeutet „Kleidung“ oder „Kleidungsstück“. *لباس گرم* ist warme Kleidung für kaltes Wetter.'
    example_gloss: Ich habe warme Kleidung.
  prs.a2.unit37.lesson03.teach.imperative:
    title: 'Der Befehl: Nach اگر kann der Hauptsatz eine Aufforderung sein'
    gloss: 'nimm (zu einem Freund), zieh an, komm, ruf an (ebenso formell bzw. im Plural: nehmen Sie / nehmt usw.)'
    note: 'Der Hauptsatz kann auch ein Befehl sein. An einen Freund gerichtet besteht der Befehl aus *ب-* plus Präsensstamm ohne Endung: *بگیر* (nimm), *بپوش* (zieh an), *بیا* (komm). An eine formell angesprochene Person oder an mehrere Personen wird *-ین* angehängt: *بگیرین، بپوشین، بیایین*. Zweiteilige Verben haben kein *ب-*: *تیلفون کن* (zu einem Freund), *تیلفون کنین* (formell oder Plural). So heißt *اگر باران ببارد، چتر بگیر* „Wenn es regnet, nimm einen Regenschirm“.'
  prs.a2.unit37.lesson03.teach.neg_imperative:
    title: Der verneinte Befehl
    gloss: 'geh nicht, komm nicht, tu nicht (zu einem Freund; formell bzw. im Plural: gehen Sie nicht / geht nicht usw.)'
    note: 'Ein verneinter Befehl verwendet *ن-* anstelle von *ب-*: *نرو* (geh nicht), *نیا* (komm nicht), *نکن* (tu nicht). Die formellen bzw. Pluralformen hängen *-ین* an: *نروین، نیایین، نکنین*. Zum Beispiel heißt *اگر باران ببارد، بیرون نرو* „Wenn es regnet, geh nicht nach draußen“.'
  prs.a2.unit37.lesson03.teach.present_state:
    title: 'Das Präsens in der Bedingung: was jetzt zutrifft'
    gloss: Wenn du Zeit hast, komm. Wenn dir kalt ist, zieh warme Kleidung an.
    note: 'Wenn die Bedingung etwas ist, das gerade jetzt zutrifft, kann sie statt des Konjunktivs das gewöhnliche Präsens verwenden: *اگر وقت داری* (wenn du jetzt Zeit hast) und *اگر سردت است* (wenn dir kalt ist). *اگر وقت داشته باشی* ist ebenfalls richtig und klingt eher nach einer möglichen zukünftigen Situation. Wer friert, sagt *سردم است*; *سردت است* heißt „dir ist kalt“.'
  prs.a2.unit37.lesson03.teach.rain_umbrella:
    title: Wenn es regnet, nimm einen Regenschirm
    gloss: Wenn es regnet, nimm einen Regenschirm.
    note: 'Die Bedingung steht im Konjunktiv *ببارد*, und der Hauptsatz ist ein Befehl an einen Freund: *بگیر*.'
  prs.a2.unit37.lesson03.teach.late_phone:
    title: Wenn du dich verspätest, ruf an
    gloss: Wenn du dich verspätest, ruf an.
    note: '*دیر شوی* ist der Konjunktiv von *دیر شدن* für „du“ (Freund): wenn du spät wirst. *تیلفون کن* ist der Befehl an einen Freund.'
  prs.a2.unit37.lesson03.teach.problem_phone:
    title: Wenn Sie ein Problem haben, rufen Sie an
    gloss: Wenn Sie ein Problem haben, rufen Sie an.
    note: 'Wer einen Kunden oder mehrere Personen anspricht, verwendet in beiden Teilsätzen *-ین*: *دارین* (Sie haben) und *کنین* (Sie machen einen Anruf). Ein Geschäft würde das auf einem Aushang so schreiben.'
  prs.a2.unit37.lesson04.teach.item:
    title: Ware, Artikel
    gloss: Ware, Artikel, Produkt
    note: '*کالا* ist Ware oder ein Artikel, den man in einem Geschäft kauft.'
    example_gloss: Dieser Artikel ist kaputt.
  prs.a2.unit37.lesson04.teach.customer:
    title: Kunde
    gloss: Kunde
    note: '*مشتری* ist ein Kunde oder eine Kundin. Der Plural ist *مشتریان*, mit der Endung *-ان* für Personen.'
    example_gloss: Der Kunde ist im Geschäft.
  prs.a2.unit37.lesson04.teach.receipt:
    title: Quittung
    gloss: Kassenbon
    note: '*رسید* ist ein Beleg, das Papier, das zeigt, was Sie bezahlt haben. Es sieht aus wie die Vergangenheit von *رسیدن* („er ist angekommen“), bedeutet im Geschäft aber „Beleg“.'
    example_gloss: Haben Sie den Beleg dabei?
  prs.a2.unit37.lesson04.teach.exchange:
    title: Wechseln
    gloss: umtauschen, wechseln
    note: '*عوض کردن* bedeutet „etwas umtauschen“ oder „wechseln“. Die Sache steht davor, mit *را*: *کالا را عوض می‌کنم* heißt „Ich tausche den Artikel um“.'
    example_gloss: Ich möchte das Buch umtauschen.
  prs.a2.unit37.lesson04.teach.give_back:
    title: Zurückgeben
    gloss: zurückgeben, erstatten
    note: '*پس دادن* bedeutet „zurückgeben“. Ein Geschäft, das Geld zurückgibt, sagt *پول را پس می‌دهیم* („wir geben das Geld zurück“).'
    example_gloss: Wir geben das Geld zurück.
  prs.a2.unit37.lesson04.teach.modal:
    title: 'Können: می‌توانم'
    gloss: ich kann, du kannst, er/sie kann, wir können, Sie können (formell) bzw. ihr könnt, sie können
    note: '*می‌توانم* heißt „ich kann“ und wird immer mit *می‌* und einem kleinen Abstand geschrieben. Die sechs Formen sind *می‌توانم، می‌توانی، می‌تواند، می‌توانیم، می‌توانین، می‌توانند*. Das nächste Verb steht im Konjunktiv und in derselben Person: *می‌توانیم عوض کنیم* heißt „wir können umtauschen“. Für die Verneinung setzen Sie *ن* davor: *نمی‌توانیم* heißt „wir können nicht“.'
  prs.a2.unit37.lesson04.teach.shop_if:
    title: Regeln im Geschäft mit اگر
    gloss: Wenn der Artikel kaputt ist, tauschen wir ihn um. Wenn Sie den Beleg dabeihaben, können wir den Artikel umtauschen.
    note: 'Geschäfte verwenden *اگر*, um zu sagen, was sie in welchem Fall tun. Die Bedingung hat *باشد* (*خراب باشد*, *همراه‌تان باشد*), und der Hauptsatz steht im einfachen Präsens (*عوض می‌کنیم*) oder mit *می‌توانیم* und dem Konjunktiv. *همراه‌تان باشد* heißt „Sie haben es dabei“ (wörtlich: „es ist bei Ihnen“).'
  prs.a2.unit37.lesson04.teach.no_receipt:
    title: 'Eine Regel mit Verneinung: kein Beleg'
    gloss: Wenn Sie keinen Beleg haben, können wir das Geld nicht zurückgeben.
    note: '*نداشته باشین* ist die Verneinung von *داشته باشین* („wenn Sie haben“). Der Hauptsatz ist ebenfalls verneint: *نمی‌توانیم پول را پس بدهیم* heißt „wir können das Geld nicht zurückgeben“. Gegenüber einem Kunden verwendet das Geschäft *-ین*.'
  prs.a2.unit37.lesson04.teach.seven_days:
    title: Wenn Sie ihn innerhalb von sieben Tagen bringen, tauschen wir den Artikel um
    gloss: Wenn Sie ihn innerhalb von sieben Tagen bringen, tauschen wir den Artikel um.
    note: '*تا هفت روز* heißt „bis zu sieben Tage“. *بیاورین* ist der Konjunktiv von *آوردن* für „Sie“ (formell) bzw. „ihr“: wenn Sie bringen.'
  prs.a2.unit37.lesson05.teach.notice:
    title: Ein Aushang im Geschäft
    gloss: Ein Aushang im Geschäft für Kunden über Umtausch und Geld-zurück.
    note: 'Das ist die Art Aushang, die man in einem Geschäft sieht. Lesen Sie auf die Bedingungen: Was tut das Geschäft, wenn man einen Beleg hat, wenn die Ware kaputt ist, wenn man keinen Beleg hat und wenn man ein Problem hat? Jede Regel besteht aus einem *اگر*-Satz und einem Hauptsatz.'
  prs.a2.unit37.lesson05.teach.weather_turn01:
    title: Zeynab fragt nach morgen
    gloss: Shahin, was machst du morgen?
    note: Zeynab fragt ihren Freund mit der Frage *فردا چه می‌کنی؟* (Was machst du morgen?) nach seinen Plänen. Sie benutzt dabei das Präsens für die Zukunft.
  prs.a2.unit37.lesson05.teach.weather_turn02:
    title: Shahin nennt zwei Pläne
    gloss: Wenn das Wetter gut ist, gehe ich mit meinen Freunden in den Park. Wenn es regnet, bleibe ich zu Hause.
    note: Shahin nennt zwei Bedingungen mit zwei Plänen. Beide Bedingungen stehen im Konjunktiv (*باشد، ببارد*), und beide Hauptsätze stehen im Präsens (*می‌روم، می‌مانم*).
  prs.a2.unit37.lesson05.teach.weather_turn03:
    title: Zeynab kommt vielleicht mit
    gloss: Wenn ich Zeit habe, komme ich auch.
    note: '*داشته باشم* ist der Konjunktiv für „wenn ich habe“. *من هم* bedeutet „ich auch“.'
  prs.a2.unit37.lesson05.teach.weather_turn04:
    title: Shahin lädt sie ein
    gloss: Super! Wenn du kommst, spielen wir auch Fußball.
    note: '*بیایی* ist der Konjunktiv von *آمدن* für „du“ (Freund/Freundin). Der Hauptsatz steht in der „wir“-Form: *می‌کنیم*.'
  prs.a2.unit37.lesson05.teach.weather_turn05:
    title: Zeynab fragt nach der Uhrzeit
    gloss: Um wie viel Uhr geht ihr?
    note: '*می‌روین* bedeutet „Sie gehen“ (höflich) oder „ihr geht“ (Plural): Zeynab fragt nach der ganzen Gruppe.'
  prs.a2.unit37.lesson05.teach.weather_turn06:
    title: Shahin bittet sie anzurufen
    gloss: Um zehn. Wenn du dich verspätest, ruf an.
    note: Die Bedingung ist *دیر شوی*, und der Hauptsatz ist der Befehl *تیلفون کن*.
  prs.a2.unit37.lesson05.teach.weather_turn07:
    title: Zeynab macht selbst ein Angebot
    gloss: Gut. Wenn es regnet, rufe ich an.
    note: 'Auch Zeynab benutzt *اگر* mit *ببارد* und einen Hauptsatz im Präsens: *تیلفون می‌کنم*.'
  prs.a2.unit37.lesson06.teach.shop_turn01:
    title: Fariba schildert ihr Problem
    gloss: Entschuldigen Sie, ich habe gestern in diesem Geschäft einen Regenschirm gekauft. Der Regenschirm ist kaputt.
    note: Fariba beginnt höflich mit *ببخشین*. Sie sagt, der Regenschirm sei *خراب* (kaputt) und sie habe ihn *دیروز* (gestern) gekauft.
  prs.a2.unit37.lesson06.teach.shop_turn02:
    title: Die Verkäuferin nennt eine Bedingung
    gloss: Wenn Sie den Beleg dabeihaben, können wir ihn umtauschen.
    note: 'Das Geschäft benutzt das Muster vom Aushang: eine Bedingung mit *باشد* und *می‌توانیم* plus Konjunktiv. *آن را* bedeutet „ihn/es“.'
  prs.a2.unit37.lesson06.teach.shop_turn03:
    title: Fariba hat den Beleg
    gloss: Ja, hier ist der Beleg.
    note: '*رسید این است* bedeutet „Hier ist der Beleg“. *بلی* bedeutet „ja“.'
  prs.a2.unit37.lesson06.teach.shop_turn04:
    title: Die Verkäuferin bietet zwei Möglichkeiten an
    gloss: Sehr gut. Wenn Sie einen anderen Regenschirm möchten, nehmen Sie einen. Wenn Sie keinen möchten, erstatten wir Ihnen das Geld.
    note: 'Zwei Bedingungen, beide im Präsens: *اگر ... می‌خواهین* (wenn Sie möchten) mit dem Befehl *بگیرین* und *اگر نمی‌خواهین* (wenn Sie nicht möchten) mit *پس می‌دهیم*.'
  prs.a2.unit37.lesson06.teach.shop_turn05:
    title: Fariba entscheidet sich
    gloss: Ich nehme einen anderen Regenschirm. Danke.
    note: 'Fariba antwortet im Präsens: *می‌گیرم* bedeutet „ich nehme“, und es zeigt, dass sie sich entschieden hat.'
  prs.a2.unit37.lesson06.teach.want:
    title: Wenn Sie keinen anderen Regenschirm möchten, erstatten wir Ihnen das Geld
    gloss: Wenn Sie keinen anderen Regenschirm möchten, erstatten wir Ihnen das Geld.
    note: 'Für einen gegenwärtigen Wunsch kann die Bedingung das normale Präsens benutzen: *می‌خواهین* bedeutet „Sie möchten“, *نمی‌خواهین* „Sie möchten nicht“. Der Hauptsatz sagt, was das Geschäft tut.'
exercises:
  prs.a2.unit37.lesson01.exercise01.recognize_good_weather:
    instruction: Was bedeutet dieser Satz?
    correct_option: Wenn das Wetter gut ist, gehe ich in den Park
    distractors:
    - Wenn es regnet, gehe ich in den Park
    - Das Wetter war gut, also bin ich in den Park gegangen
    - Ich gehe nicht in den Park
    accepted_answers:
    - value: Wenn das Wetter gut ist, gehe ich in den Park
      status: correct
    feedback: '*اگر هوا خوب باشد* bedeutet „wenn das Wetter gut ist“, und *به پارک می‌روم* sagt, was dann geschieht.'
  prs.a2.unit37.lesson01.exercise02.recognize_rain_home:
    instruction: Was bedeutet dieser Satz?
    correct_option: Wenn es regnet, bleibe ich zu Hause
