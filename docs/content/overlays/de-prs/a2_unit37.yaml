course:
  title: Dari A2
  description: 'Dari (Afghanistan) für Fortgeschrittene auf Niveau A2: darüber sprechen, was geschieht oder geschehen wird, wenn eine Bedingung erfüllt ist, zum Beispiel wenn es morgen regnet oder wenn Sie den Beleg haben. اگر plus Konjunktiv, mit einem Hauptsatz im Präsens oder einem Befehl; Wetterpläne und Regeln im Geschäft.'
