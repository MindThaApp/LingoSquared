teaching:
  prs.a1.unit36.lesson01.teach.kitchen_word:
    title: Küche
    gloss: Küche
    note: آشپزخانه ist das übliche Dari-Wort für „Küche“.
    example_gloss: Heute bin ich in der Küche.
  prs.a1.unit36.lesson01.teach.food_word:
    title: Essen
    gloss: Essen / eine Mahlzeit
    note: غذا bedeutet Essen oder Mahlzeit ganz allgemein und unterscheidet sich von einem bestimmten Gericht wie پلو.
    example_gloss: Das Essen ist lecker.
  prs.a1.unit36.lesson01.teach.onion_word:
    title: Zwiebel
    gloss: Zwiebel
    note: پیاز ist das gängige Dari-Wort für „Zwiebel“ und wird in der afghanischen Küche ständig verwendet.
    example_gloss: Die Zwiebel ist frisch.
  prs.a1.unit36.lesson01.teach.meat_word:
    title: Fleisch
    gloss: Fleisch
    note: گوشت bedeutet „Fleisch“.
    example_gloss: Das Fleisch ist frisch.
  prs.a1.unit36.lesson01.teach.review_basics:
    title: 'Wiederholung: ein, wollen, in, sein'
    gloss: ein/eine / ich möchte / in oder an / ich bin
    note: یک, می‌خواهم, در und استم sind bereits bekannte Formen, die in den Kochsätzen dieser Lektion vorkommen.
    target_text: یک (ein/eine / eins) / می‌خواهم (ich möchte) / در (in/an) / استم (ich bin)
  prs.a1.unit36.lesson01.teach.cook_food_phrase:
    title: Ich koche Essen
    gloss: Ich koche Essen.
    note: می‌پزم ist die Präsensform der 1. Person Singular von پختن, „kochen“.
  prs.a1.unit36.lesson01.teach.in_kitchen_phrase:
    title: Ich bin in der Küche
    gloss: Ich bin in der Küche.
    note: استم ist die Form der Kopula für die 1. Person Singular und wird hier mit در für den Ort verwendet.
  prs.a1.unit36.lesson02.teach.salt_word:
    title: Salz
    gloss: Salz
    note: نمک bedeutet „Salz“.
    example_gloss: Ich möchte Salz.
  prs.a1.unit36.lesson02.teach.rice_grain_word:
    title: Reis
    gloss: der Reis
    note: برنج ist ungekochter Reis (das Korn) und unterscheidet sich von پلو, dem gekochten Reisgericht aus der Lektion zum Essen.
    example_gloss: Ich koche Reis.
  prs.a1.unit36.lesson02.teach.review_do_cut:
    title: 'Wiederholung: ich mache, klein geschnitten'
    gloss: ich mache / klein geschnitten, gehackt
    note: می‌کنم ist Wiederholung; خرد ist neu und bedeutet in Verbindung mit Formen von کردن „klein schneiden“ oder „hacken“.
    target_text: می‌کنم (ich tue) / خرد (klein geschnitten)
  prs.a1.unit36.lesson02.teach.chop_onion_phrase:
    title: Ich schneide die Zwiebel klein
    gloss: Ich schneide die Zwiebel klein.
    note: خرد می‌کنم bedeutet wörtlich „ich mache es klein“ – ein typisches Muster für zusammengesetzte Verben.
  prs.a1.unit36.lesson02.teach.add_salt_phrase:
    title: Ich gebe Salz hinzu
    gloss: Ich gebe Salz hinzu.
    note: می‌اندازم (von انداختن, „werfen“ / „hineingeben“) ist das übliche Dari-Verb, um eine Zutat hinzuzufügen.
  prs.a1.unit36.lesson02.teach.cook_meat_phrase:
    title: Ich koche Fleisch
    gloss: Ich koche Fleisch.
    note: Ersetzen Sie گوشت durch برنج, um ein anderes Gericht zu nennen, das gekocht wird.
  prs.a1.unit36.lesson03.teach.review_first_then:
    title: 'Wiederholung: zuerst, dann'
    gloss: zuerst / dann
    note: اول und بعد sind bekannte Wörter, mit denen man Kochschritte der Reihe nach ordnet.
    target_text: اول (zuerst) / بعد (dann)
  prs.a1.unit36.lesson03.teach.review_water_hot:
    title: 'Wiederholung: Wasser, heiß'
    gloss: Wasser / heiß
    note: آب und گرم sind bekannte Wörter aus früheren Lektionen.
    target_text: آب (Wasser) / گرم (heiß)
  prs.a1.unit36.lesson03.teach.pour_word:
    title: Ich gieße
    gloss: ich gieße
    note: می‌ریزم (von ریختن, „gießen“) ist das passende Verb, um Flüssigkeit hinzuzufügen; für feste Zutaten verwendet man dagegen می‌اندازم.
    example_gloss: Ich gieße Wasser hinein.
  prs.a1.unit36.lesson03.teach.first_chop_phrase:
    title: Zuerst schneide ich die Zwiebel klein
    gloss: Zuerst schneide ich die Zwiebel klein.
    note: اول kennzeichnet den ersten Schritt einer Abfolge.
  prs.a1.unit36.lesson03.teach.then_cook_meat_phrase:
    title: Dann koche ich das Fleisch
    gloss: Dann koche ich das Fleisch.
    note: بعد kennzeichnet den nächsten Schritt einer Abfolge.
  prs.a1.unit36.lesson03.teach.pour_hot_water_phrase:
    title: Ich gieße heißes Wasser hinein
    gloss: Ich gieße heißes Wasser hinein.
    note: Verbindet گرم („heiß“) mit می‌ریزم („ich gieße“).
  prs.a1.unit36.lesson04.teach.review_dialogue_words:
    title: Hallo / ja / bitte / okay / Danke / Eintopf / lecker / ist
    gloss: hallo / ja / bitte / in Ordnung, gern / danke / Eintopf / lecker / ist
    note: سلام, بلی, لطفاً, چشم, تشکر, قورمه, خوش‌مزه und است sind bekannte Wörter, die im Küchendialog vorkommen.
    target_text: سلام (hallo) / بلی (ja) / لطفاً (bitte) / چشم (gern / okay) / تشکر (Danke) / قورمه (Eintopf) / خوش‌مزه (lecker) / است (ist)
  prs.a1.unit36.lesson04.teach.dialogue_line1:
    title: 'Nadia: Hallo, was kochen Sie?'
    gloss: Hallo, was kochen Sie?
    note: چی می‌پزین؟ verwendet die höfliche Anredeform می‌پزین.
  prs.a1.unit36.lesson04.teach.dialogue_line2:
    title: 'Farid: Ich koche Qorma.'
    gloss: Ich koche Qorma.
  prs.a1.unit36.lesson04.teach.dialogue_line3:
    title: 'Nadia: Soll ich helfen?'
    gloss: Soll ich helfen?
    note: کمک می‌کنم؟ heißt wörtlich „Helfe ich?“ – eine natürliche Art, Hilfe anzubieten.
  prs.a1.unit36.lesson04.teach.dialogue_line4:
    title: 'Farid: Ja, bitte schneiden Sie die Zwiebel klein.'
    gloss: Ja, bitte schneiden Sie die Zwiebel klein.
    note: 'کنین ist die höfliche Imperativform: „machen Sie!“'
  prs.a1.unit36.lesson04.teach.dialogue_line5:
    title: 'Nadia: Gern.'
    gloss: Gern.
  prs.a1.unit36.lesson04.teach.dialogue_line6:
    title: 'Farid: Danke, das Essen ist lecker.'
    gloss: Danke, das Essen ist lecker.
  prs.a1.unit36.lesson05.teach.review_he_she_words:
    title: Er/sie, in, tut, kocht, sehr, glücklich, ist
    gloss: er/sie / in oder an / er/sie macht / er/sie kocht / sehr / glücklich / ist
    note: او ist das Dari-Pronomen für „er“ und „sie“; می‌کند und می‌پزد sind die Formen der 3. Person Singular der Verben, die zuvor in dieser Lektion vorkamen.
    target_text: او (er/sie) / در (in/an) / می‌کند (er/sie tut) / می‌پزد (er/sie kocht) / بسیار (sehr) / خوشحال (glücklich) / است (ist)
  prs.a1.unit36.lesson05.teach.reading_passage:
    title: 'Lesetext: Nadia kocht'
    gloss: Nadia ist in der Küche. Sie schneidet die Zwiebel klein. Dann kocht sie das Fleisch. Das Essen ist sehr lecker. Nadia ist glücklich.
  prs.a1.unit36.lesson06.teach.review_like_but_time:
    target_text: دوست دارم (ich mag) / را (Objektmarker) / اما (aber) / وقت ندارم (ich habe keine Zeit)
