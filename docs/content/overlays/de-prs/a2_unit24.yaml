course:
  title: Dari A2
  description: 'Dari (Afghanistan), unteres Mittelstufenniveau: sagen, was gerade geschah, als etwas anderes passierte. Die andauernde Vergangenheit mit می‌ und dem Vergangenheitsstamm, das optionale در حال ... بودم, die einfache Vergangenheit für das unterbrechende Ereignis, verbunden mit وقتی که, ناگهان und همان وقت.'
units:
  prs.a2.unit24.what_was_happening:
    title: Was geschah gerade, als …
lessons:
  prs.a2.unit24.lesson01.words_and_continuing_past:
    title: Wetter- und Straßenwörter und die Form می‌رفتم
  prs.a2.unit24.lesson02.more_verbs_and_things:
    title: Weitere Verben und Wörter aus der Geschichte
  prs.a2.unit24.lesson03.contrast_finished_or_ongoing:
    title: Abgeschlossene oder andauernde Handlung
  prs.a2.unit24.lesson04.telling_what_was_happening:
    title: 'Erzählen, was gerade geschah: وقتی که …'
  prs.a2.unit24.lesson05.reading_and_listening:
    title: 'Lesen und Hören: ein Zwischenfall'
  prs.a2.unit24.lesson06.conversation_and_mixed:
    title: Ein Gespräch über gestern Abend
teaching:
  prs.a2.unit24.lesson01.teach.sarak:
    title: Straße
    gloss: Straße, Weg
    note: '*سرک* ist eine Straße oder ein Weg. Mit *در* bedeutet es „auf der Straße“: *در سرک*. Die Lektion beginnt auf der Straße, weil sich dort die meisten unserer kleinen Zwischenfälle ereignen.'
    example_gloss: Unser Büro ist in der Nähe der Straße.
  prs.a2.unit24.lesson01.teach.piyada:
    title: Zu Fuß
    gloss: zu Fuß
    note: '*پیاده* bedeutet „zu Fuß“. *پیاده می‌روم* heißt „ich gehe zu Fuß“. Hier steht das Verb im Präsens *می‌روم*; in dieser Lektion lernen Sie die Vergangenheit desselben Musters kennen.'
    example_gloss: Jeden Tag gehe ich zu Fuß ins Büro.
  prs.a2.unit24.lesson01.teach.rain:
    title: Regen
    gloss: Regen
    note: '*باران* ist der Regen. *شروع شد* bedeutet „begann“: *باران شروع شد* heißt „Der Regen begann“. Dieses Paar verwenden Sie in der ganzen Lektion für das unterbrechende Ereignis.'
    example_gloss: Der Regen begann.
  prs.a2.unit24.lesson01.teach.snow:
    title: Es regnet, es schneit
    gloss: es regnet, es schneit
    note: '*برف* ist der Schnee. Das Verb *باریدن* (als Regen oder Schnee fallen) wird für beides verwendet: *باران می‌بارد* heißt „es regnet“ und *برف می‌بارد* heißt „es schneit“. Beides sind Präsensformen mit *می*.'
    example_gloss:
    - Heute regnet es.
    - In Kabul schneit es.
  prs.a2.unit24.lesson01.teach.wind:
    title: Wind
    gloss: Wind
    note: '*باد* ist der Wind. Um zu sagen, dass es windig ist, sagt man, dass viel Wind da ist: *باد زیاد است*.'
    example_gloss: Heute ist es sehr windig.
  prs.a2.unit24.lesson01.teach.traffic:
    title: Verkehr
    gloss: Verkehr
    note: '*ترافیک* ist der Verkehr. *ترافیک زیاد* ist starker Verkehr, ein sehr häufiger Grund für eine Verspätung.'
    example_gloss: Auf der Straße ist viel Verkehr.
  prs.a2.unit24.lesson01.teach.imperfect_paradigm:
    title: 'Ging gerade: می + Vergangenheitsstamm + Endungen'
    gloss: ich ging gerade, du gingst gerade, er/sie ging gerade, wir gingen gerade, Sie gingen / ihr gingt gerade (formell oder Plural), sie gingen gerade
    note: 'Sie kennen schon die einfache Vergangenheit für eine abgeschlossene Handlung: *رفتم* heißt „ich ging“. Um zu sagen, was in der Vergangenheit gerade im Gange war, setzt man *می‌* vor das Vergangenheitsverb: *می‌رفتم* heißt „ich ging gerade“. Das Muster ist *می‌* + Vergangenheitsstamm (*رفت*) + dieselben Endungen: *می‌رفتم، می‌رفتی، می‌رفت، می‌رفتیم، می‌رفتین، می‌رفتند*. Die Pronomen *من، تو، او، ما، شما، آن‌ها* sind optional. Beim Wetter funktioniert es genauso: *باران می‌بارید* heißt „es regnete“ und *برف می‌بارید* heißt „es schneite“. Vergleichen Sie das Präsens *می‌روم* („ich gehe“): Nur Stamm und Endung ändern sich. Dieselbe Form *می‌رفتم* kann auch „ich ging immer“ bedeuten (eine Gewohnheit), wie in *هر روز پیاده می‌رفتم*; der Satz drumherum zeigt, welche Bedeutung gemeint ist. In dieser Lektion bedeutet sie meistens „ich ging gerade“.'
  prs.a2.unit24.lesson02.teach.car:
    title: Auto
    gloss: das Auto
    note: '*موتر* ist das alltägliche afghanische Wort für „Auto“. *در موتر* heißt „im Auto“.'
    example_gloss: Unser Auto ist neu.
  prs.a2.unit24.lesson02.teach.phone:
    title: Telefon
    gloss: Telefon
    note: '*تیلفون* ist ein Telefon. Mit der Endung *-م* sagt man „mein“: *تیلفونم* heißt „mein Telefon“.'
    example_gloss: Mein Telefon ist eingeschaltet.
  prs.a2.unit24.lesson02.teach.umbrella:
    title: Schirm
    gloss: Schirm
    note: '*چتر* ist ein Regenschirm. Regen und Regenschirm gehören zusammen: *چتر دارم* heißt „ich habe einen Regenschirm“ und *چتر ندارم* heißt „ich habe keinen“.'
    example_gloss: Heute regnet es, ich habe einen Regenschirm.
  prs.a2.unit24.lesson02.teach.wet:
    title: Nass werden
    gloss: nass werden
    note: '*خیس* heißt „nass“ und *خیس شدن* heißt „nass werden“. *خیس شدم* heißt „ich wurde nass“, eine häufige Folge von Regen.'
    example_gloss: Wenn es regnet, werde ich nass.
  prs.a2.unit24.lesson02.teach.ring:
    title: Klingeln, anrufen
    gloss: klingeln, jemanden anrufen
    note: '*زنگ زدن* hat zwei Verwendungen. Ein Telefon kann klingeln: *تیلفونم زنگ زد* (mein Telefon klingelte). Eine Person kann jemanden anrufen: *دوستم به من زنگ زد* (mein Freund rief mich an). Der Vergangenheitsstamm ist *زد*, von *زدن*.'
    example_gloss: Mein Freund rief mich an.
  prs.a2.unit24.lesson02.teach.driving:
    title: Auto fahren
    gloss: Auto fahren
    note: '*رانندگی کردن* heißt „Auto fahren“. *رانندگی* ist das Fahren und *کردن* ist das Verb „machen“, wie in *خرید کردن*. Es besteht aus einem Nomen plus *کردن*, deshalb ändert sich nur der Verbteil: *رانندگی کردم*.'
    example_gloss: Ich fahre jeden Tag Auto.
  prs.a2.unit24.lesson02.teach.more_verbs:
    title: Dasselbe Muster mit anderen Verben
    gloss: ich tat gerade, du tatest gerade, ich aß gerade, ich sah gerade (zu), ich kam gerade
    note: 'Jedes Verb folgt derselben Regel: *می‌* + Vergangenheitsstamm + Endung. *کردن* ergibt *می‌کردم* („ich machte gerade“) und *می‌کردی* („du machtest gerade“). *خوردن* ergibt *می‌خوردم* („ich aß gerade“). *دیدن* ergibt *می‌دیدم* („ich sah gerade“; bei einem Film: „ich schaute gerade“). *آمدن* ergibt *می‌آمدم* („ich kam gerade“). Bei einem Verb wie *آشپزی کردن* ändert sich nur der Verbteil: *آشپزی می‌کردم* heißt „ich kochte gerade“, nicht *می‌آشپزی*. Der Stamm ändert sich nie, nur die Endungen.'
  prs.a2.unit24.lesson02.teach.cooking:
    title: ich kochte gerade
    gloss: Ich kochte gerade.
    note: '*آشپزی* ist das Kochen, ein Wiederholungswort aus den Lektionen zum Alltag. *آشپزی می‌کردم* sagt, dass Sie mitten im Kochen waren.'
  prs.a2.unit24.lesson02.teach.watching:
    title: Ich schaute zu Hause einen Film
    gloss: Ich schaute zu Hause gerade einen Film.
    note: '*فلم دیدن* heißt „einen Film schauen“, also ist die andauernde Vergangenheit *فلم می‌دیدم*. *در خانه* heißt „zu Hause“.'
  prs.a2.unit24.lesson02.teach.driving_car:
    title: Ich fuhr im Auto
    gloss: Ich fuhr gerade im Auto.
    note: '*در موتر* heißt „im Auto“ und *رانندگی می‌کردم* heißt „ich fuhr gerade“.'
  prs.a2.unit24.lesson03.teach.was_paradigm:
    title: 'War, waren: بودن in der Vergangenheit'
    gloss: ich war, du warst, er/sie/es war, wir waren, Sie waren / ihr wart (formell oder Plural), sie waren
    note: '*بودن* heißt „sein“. Seine Vergangenheit wird wie jede andere gebildet: Stamm *بود* plus die Endungen *بودم، بودی، بود، بودیم، بودین، بودند*. So sagt man „war“ oder „waren“: *در موتر بودم* (ich war im Auto), *ترافیک زیاد بود* (der Verkehr war stark). Verwechseln Sie es nicht mit dem Präsens *استم، استی، است*. Ein Zustand wie „irgendwo sein“ oder „warten“ braucht kein *می‌*, weil *بودم* schon eine Situation zu jenem Zeitpunkt in der Vergangenheit beschreibt.'
  prs.a2.unit24.lesson03.teach.waiting:
    title: Warten
    gloss: warten
    note: '*منتظر بودن* heißt „warten“. Warten ist ein Zustand, daher heißt die Vergangenheit einfach *منتظر بودم* („ich wartete“), ohne *می‌*. Worauf man wartet, steht vor *منتظر*: *منتظر بس بودم*.'
    example_gloss: An der Haltestelle wartete ich auf den Bus.
  prs.a2.unit24.lesson03.teach.negative_continuing:
    title: 'Ging gerade nicht: نمی + Vergangenheitsstamm'
    gloss: ich ging gerade nicht, ich aß gerade nicht, ich sah gerade nicht, ich tat gerade nicht
    note: 'Um zu sagen, dass Sie in jenem Moment etwas nicht taten, setzen Sie *نمی‌* statt *می‌* vor den Vergangenheitsstamm: *نمی‌رفتم* (ich ging gerade nicht), *نمی‌خوردم* (ich aß gerade nicht), *نمی‌دیدم* (ich sah gerade nicht), *نمی‌کردم* (ich tat gerade nicht). Vergleichen Sie die einfache verneinte Vergangenheit aus der Wochenend-Lektion: *نرفتم* heißt „ich ging nicht“ (eine abgeschlossene Tatsache: es geschah nicht), während *نمی‌رفتم* heißt „ich ging gerade nicht“ (zu jener Zeit nicht im Gange, oder ich ging sonst nie).'
  prs.a2.unit24.lesson03.teach.finished_vs_ongoing:
    title: Ging versus ging gerade
    gloss: Ich ging nach Hause. / Ich war gerade auf dem Heimweg.
    note: 'Die beiden Formen sehen fast gleich aus, erzählen aber Verschiedenes. *به خانه رفتم* heißt „ich ging nach Hause“: Der Weg ist abgeschlossen. *به خانه می‌رفتم* heißt „ich war auf dem Heimweg“: Ich war unterwegs, noch nicht da, und unterwegs kann etwas passieren. Wenn man erzählt, was geschah, steht die längere Hintergrundhandlung mit *می‌* und das plötzliche Ereignis in der einfachen Vergangenheit ohne *می‌*.'
  prs.a2.unit24.lesson03.teach.when_two_pasts:
    title: Als + einfache Vergangenheit oder als + می
    gloss: Als ich nach Hause kam, begann der Regen. / Als ich die Straße entlangging, begann der Regen.
    note: 'Beide Sätze verwenden *وقتی که* („als“), aber das Verb danach bestimmt die Bedeutung. Bei der einfachen Vergangenheit, *وقتی که به خانه رسیدم، باران شروع شد*, ist das erste Ereignis abgeschlossen und das zweite folgt darauf: Nachdem ich nach Hause gekommen war, begann der Regen. Mit *می‌*, *وقتی که در سرک می‌رفتم، باران شروع شد*, war die erste Handlung noch im Gange, und der Regen begann mittendrin. Um zu erzählen, was gerade geschah, braucht man das zweite Muster.'
  prs.a2.unit24.lesson03.teach.in_progress_emphasis:
    title: 'Optional: در حال … بودم'
    gloss: Ich war gerade dabei zu gehen. / Ich war gerade beim Kochen. / Ich bin gerade dabei zu gehen.
    note: 'Im Dari gibt es eine zweite, etwas stärkere Möglichkeit, auszudrücken, dass etwas im Gange war: *در حال* + Infinitiv + *بودم*. *در حال رفتن بودم* heißt „ich war gerade dabei zu gehen“, und bei einem Nomen plus *کردن* folgt der ganze Infinitiv: *در حال آشپزی کردن بودم*. Es bedeutet dasselbe wie das einfache *می‌رفتم* und *آشپزی می‌کردم*; es betont nur stärker, dass es im Gange war. Sie müssen es nie verwenden, und beide Formen sind in dieser Lektion überall richtig. Das Präsens hat dieselbe Betonungsform: *در حال رفتن استم* heißt „ich bin gerade dabei zu gehen“, aber meistens sagt man das einfache *می‌روم*.'
  prs.a2.unit24.lesson04.teach.when_pattern:
    title: 'Das Muster: وقتی که + می, dann das Ereignis'
    gloss: Als ich die Straße entlangging, begann der Regen.
    note: 'Um zu sagen, was gerade im Gange war, als etwas geschah, bauen Sie den Satz aus zwei Teilen auf. Zuerst der Hintergrund: *وقتی که* + die laufende Handlung mit *می‌*: *وقتی که در سرک می‌رفتم*. Dann ein Komma und das Ereignis, das dazwischenkam, im einfachen Präteritum ohne *می‌*: *باران شروع شد*. Das Ergebnis ist *وقتی که در سرک می‌رفتم، باران شروع شد.* Die längere Handlung (*می‌رفتم*) war schon im Gange, und das kurze Ereignis (*شروع شد*) unterbrach sie. Genauso funktioniert die optionale Betonungsform: *وقتی که در حال رفتن بودم، باران شروع شد*. Sie können *که* weglassen und nur *وقتی* sagen.'
  prs.a2.unit24.lesson04.teach.suddenly:
    title: Plötzlich
    gloss: plötzlich
    note: '*ناگهان* bedeutet „plötzlich“. Es steht direkt vor dem Verb des plötzlichen Ereignisses, wie in *ناگهان باران شروع شد*. Es passt gut zum unterbrechenden Verb, das im einfachen Präteritum steht.'
    example_gloss: Plötzlich begann es zu regnen.
  prs.a2.unit24.lesson04.teach.same_time:
    title: In diesem Moment
    gloss: im selben Moment
    note: '*همان وقت* bedeutet „im selben Moment“. Verwenden Sie es am Anfang eines neuen Satzes, um ein zweites Ereignis anzufügen, das zur selben Zeit geschah: *همان وقت تیلفونم زنگ زد*.'
    example_gloss: Im selben Moment klingelte mein Telefon.
  prs.a2.unit24.lesson04.teach.power_cut:
    title: Der Strom fiel aus
    gloss: der Strom fiel aus
    note: '*برق* bedeutet „Elektrizität“. *برق رفت* heißt „der Strom fiel aus“ (wörtlich: der Strom ging weg) – ein kleiner Zwischenfall, der unterbricht, was man gerade tat.'
    example_gloss: Plötzlich fiel der Strom aus.
  prs.a2.unit24.lesson04.teach.event_vs_background:
    title: Welches Verb hat می und welches nicht
    gloss: Als ich einen Film sah, fiel plötzlich der Strom aus. Im selben Moment klingelte mein Telefon.
    note: 'Achten Sie in jedem Satz auf zwei Arten von Verben. Die Hintergrundhandlung hat *می‌*: *فلم می‌دیدم* (ich sah einen Film), weil sie eine Weile dauert. Das unterbrechende Ereignis hat kein *می‌*: *برق رفت* (der Strom fiel aus), weil es einmal geschieht und vorbei ist. *ناگهان* oder *همان وقت* gehören zum Ereignis, nicht zum Hintergrund. Hätten beide Verben *می‌* oder keines von beiden, würde der Satz nicht mehr zeigen, welche Handlung die andere unterbrochen hat.'
  prs.a2.unit24.lesson05.teach.got_wet_we:
    title: Wir wurden nass
    gloss: wir wurden nass
    note: '*شدیم* bedeutet „wir wurden“, das einfache Präteritum von *شدن* mit der Endung *-یم*. *خیس شدیم* heißt „wir wurden nass“.'
    example_gloss: Auf der Straße begann es zu regnen, und wir wurden nass.
  prs.a2.unit24.lesson05.teach.friend_pl:
    title: Mit meinen Freunden
    gloss: mit meinen Freunden
    note: '*دوستانم* bedeutet „meine Freunde“ und *با* „mit“: *با دوستانم* heißt „mit meinen Freunden“. Sie hören es im nächsten Gespräch.'
    example_gloss: Am Freitag war ich mit meinen Freunden auf dem Basar.
  prs.a2.unit24.lesson05.teach.message:
    title: Eine Nachricht über gestern Morgen
    gloss: Gestern Morgen ging ich ins Büro. Auf der Straße war viel Verkehr. Während ich im Bus wartete, begann es zu regnen. Im selben Moment klingelte mein Telefon. Es war mein Freund. Ich kam zu spät ins Büro.
    note: 'Ein kurzer schriftlicher Bericht über einen kleinen Zwischenfall. Der Hintergrund hat *می‌*: *به دفتر می‌رفتم*. Das Warten ist ein Zustand: *منتظر بودم*. Die beiden Ereignisse stehen im einfachen Präteritum: *باران شروع شد* und *تیلفونم زنگ زد*.'
  prs.a2.unit24.lesson05.teach.exchange_q:
    title: Homayoun fragt Zarmina nach Freitag
    gloss: Zarmina, was ist am Freitag auf dem Basar passiert?
    note: Homayoun fragt mit *چه شد؟*, „was ist passiert?“. So fragt man üblicherweise nach der Geschichte eines kleinen Vorfalls.
  prs.a2.unit24.lesson05.teach.exchange_a:
    title: Zarmina erzählt, was passiert ist
    gloss: Als ich mit meinen Freunden über den Basar ging, begann es zu regnen. Ich hatte keinen Regenschirm, und wir wurden nass.
    note: Zarmina nennt den Hintergrund mit *می‌* (*می‌رفتم*) und dann das Ereignis (*باران شروع شد*). Ihr Ergebnis, *خیس شدیم*, steht ebenfalls im einfachen Präteritum.
  prs.a2.unit24.lesson06.teach.turn01:
    title: Homayoun fragt, was Zarmina gerade tat
    gloss: Zarmina, was hast du gestern Abend gemacht?
    note: '*چه کار می‌کردی؟* bedeutet „was hast du gerade gemacht?“. Es fragt nach einer laufenden Handlung und verwendet deshalb *می‌کردی*, nicht das abgeschlossene *کردی*.'
  prs.a2.unit24.lesson06.teach.turn02:
    title: Zarmina sagt, was sie tat und was geschah
    gloss: Als ich einen Film sah, fiel plötzlich der Strom aus.
    note: Hintergrund *فلم می‌دیدم*, dann das Ereignis *برق رفت* mit *ناگهان*.
  prs.a2.unit24.lesson06.teach.turn03:
    title: Homayoun fragt, was sie danach tat
    gloss: Was hast du danach gemacht?
    note: '*چه کار کردی؟* im einfachen Präteritum fragt nach einer abgeschlossenen Handlung: „Was hast du gemacht?“'
  prs.a2.unit24.lesson06.teach.turn04:
    title: Zarmina erzählt vom Anruf und fragt zurück
    gloss: Im selben Moment klingelte mein Telefon. Es war meine Freundin. Ich habe mit ihr gesprochen. Und du?
    note: '*همان وقت* fügt ein zweites Ereignis an. *با او صحبت کردم* heißt „ich habe mit ihr gesprochen“, und *تو چطور؟* fragt „und du?“.'
  prs.a2.unit24.lesson06.teach.turn05:
    title: Homayoun erzählt vom Bus und vom Wetter
    gloss: Ich kam vom Büro nach Hause. Ich war im Bus. Es war viel Verkehr, und es regnete auch noch.
    note: Er verwendet *می‌آمدم* für die Fahrt, *بودم* und *زیاد بود* für die Lage und *می‌بارید* für den andauernden Regen.
  prs.a2.unit24.lesson06.teach.bad:
    title: Wie schade!
    gloss: schlecht; wie schade!
    note: '*بد* bedeutet „schlecht“. *چه بد!* heißt „wie schade!“ oder „so ein Pech!“ – eine freundliche Reaktion auf ein kleines Missgeschick.'
    example_gloss: Heute regnet es, und der Verkehr ist schlecht.
  prs.a2.unit24.lesson06.teach.turn06:
    title: Zarmina reagiert
    gloss: Wie schade!
    note: '*چه بد!* ist eine freundliche Reaktion auf schlechte Nachrichten, das Gegenteil von *چه خوب!*.'
exercises:
  prs.a2.unit24.lesson01.exercise01.recognize_it_was_raining:
    instruction: Was bedeutet dieser Satz?
    correct_option: Es regnete
    distractors:
    - Es regnet gerade
    - Morgen wird es regnen
    - Es schneite
    accepted_answers:
    - value: Es regnete
      status: correct
    feedback: '*باران می‌بارید* heißt „es regnete“: *می‌* plus der Präteritalstamm *بارید*.'
  prs.a2.unit24.lesson01.exercise02.recognize_we_were_walking:
    instruction: Was bedeutet dieser Satz?
    correct_option: Wir gingen zu Fuß auf der Straße
    distractors:
    - Ich ging zu Fuß auf der Straße
    - Sie gingen zu Fuß auf der Straße
    - Wir gehen zu Fuß auf der Straße
    accepted_answers:
    - value: Wir gingen zu Fuß auf der Straße
      status: correct
    feedback: 'Die Endung *-یم* in *می‌رفتیم* bedeutet „wir“, und *می‌* zeigt, dass es im Gange war: *ما در سرک پیاده می‌رفتیم*.'
  prs.a2.unit24.lesson01.exercise03.recognize_it_was_snowing:
    instruction: Was bedeutet dieser Satz?
    correct_option: Es schneite
    distractors:
    - Es regnete
