course:
  title: Dari A2
  description: 'Dari (Afghanistan) für Fortgeschrittene (untere Mittelstufe): Auskünfte indirekt und höflich erfragen, zum Beispiel „Wissen Sie, wo der Bahnhof ist?“ Der Rahmen می‌دانین که ... mit unverändert eingebetteter Frage (wo, wann, warum, welcher, wie viel), „Ich weiß nicht, dass ...“, „ja oder nein“ mit یا نه und die höfliche Bitte می‌توانین بگویین که ... .'
units:
  prs.a2.unit38.asking_indirectly:
    title: Indirekt fragen
lessons:
  prs.a2.unit38.lesson01.do_you_know_where:
    title: Wissen Sie, wo die Haltestelle ist?
  prs.a2.unit38.lesson02.i_dont_know:
    title: Ich weiß nicht, wann der Bus abfährt
  prs.a2.unit38.lesson03.yes_or_no:
    title: Geöffnet oder nicht?
  prs.a2.unit38.lesson04.polite_requests:
    title: Entschuldigung, können Sie mir sagen ...
  prs.a2.unit38.lesson05.reading_and_listening:
    title: 'Lesen und Hören: ein Museum und eine Bank'
  prs.a2.unit38.lesson06.station_conversation:
    title: Ein Gespräch am Bahnhof
teaching:
  prs.a2.unit38.lesson01.teach.station:
    title: Bahnhof
    gloss: Haltestelle, Bahnhof
    note: '*ایستگاه* ist eine Haltestelle oder ein Bahnhof. In dieser Einheit fragen Sie, wo Orte sind, und die Haltestelle ist der erste: *ایستگاه بس* ist die Bushaltestelle.'
    example_gloss: Die Haltestelle ist in Kabul.
  prs.a2.unit38.lesson01.teach.museum:
    title: Museum
    gloss: Museum
    note: '*موزیم* ist ein Museum. Das Nationalmuseum von Afghanistan befindet sich in Kabul.'
    example_gloss: Das Museum ist in Kabul.
  prs.a2.unit38.lesson01.teach.office:
    title: Büro
    gloss: Büro
    note: '*دفتر* ist ein Büro, zum Beispiel das Passamt oder das Büro einer Busgesellschaft.'
    example_gloss: Das Büro ist in der Nähe.
  prs.a2.unit38.lesson01.teach.library:
    title: Bibliothek
    gloss: Bibliothek
    note: '*کتابخانه* ist eine Bibliothek. *نزدیک* bedeutet „nah“.'
    example_gloss: Die Bibliothek ist in der Nähe.
  prs.a2.unit38.lesson01.teach.where:
    title: Wo ist das?
    gloss: wo ist es?
    note: '*کجا* bedeutet „wo“, und *کجاست* bedeutet „wo ist es“: *کجا* plus die Kurzform von *است*. Der Ort steht zuerst: *ایستگاه کجاست؟* heißt „Wo ist die Haltestelle?“'
    example_gloss: Wo ist das Museum?
  prs.a2.unit38.lesson01.teach.know:
    title: Wissen
    gloss: ich weiß
    note: '*دانستن* bedeutet, eine Tatsache zu wissen: *می‌دانم* heißt „ich weiß“. Verwenden Sie es für Tatsachen (wo ein Ort ist, wann ein Bus abfährt), nicht dafür, eine Person zu kennen.'
    example_gloss: Ich weiß.
  prs.a2.unit38.lesson01.teach.know_paradigm:
    title: 'Wissen: می‌دانم'
    gloss: ich weiß, du weißt, er/sie weiß, wir wissen, Sie wissen / ihr wisst (höflich oder Plural), sie wissen
    note: 'Das Präsens von *دانستن* besteht aus *می‌* plus Endung: *می‌دانم، می‌دانی، می‌داند، می‌دانیم، می‌دانین، می‌دانند*. Die Endung der 2. Person Plural ist *-ین*. Zu einer fremden oder älteren Person oder zu einer Gruppe sagen Sie *می‌دانین*; zu einem engen Freund sagen Sie *می‌دانی*. Das Pronomen ist optional.'
  prs.a2.unit38.lesson01.teach.direct_to_indirect:
    title: Von der direkten zur indirekten Frage
    gloss: Wo ist die Haltestelle? Wissen Sie, wo die Haltestelle ist?
    note: 'Eine indirekte Frage ist weicher und höflicher als eine direkte. Beginnen Sie mit *می‌دانین که* („wissen Sie, dass“) und setzen Sie danach die direkte Frage unverändert: Aus *ایستگاه کجاست؟* wird *می‌دانین که ایستگاه کجاست؟*. Das Fragewort *کجا* bleibt an seiner Stelle, und die Wortstellung bleibt die eines Aussagesatzes.'
  prs.a2.unit38.lesson01.teach.do_you_know_museum:
    title: Wissen Sie, wo das Museum ist?
    gloss: Wissen Sie, wo das Museum ist?
    note: 'Das ist der Mustersatz dieser Einheit. *که* („dass“) ist optional: *می‌دانین موزیم کجاست؟* ist ebenfalls richtig. Das Fragezeichen steht nur einmal am Ende, weil der ganze Satz eine einzige Frage ist.'
  prs.a2.unit38.lesson01.teach.friend_or_polite:
    title: Freund oder höflich
    gloss: 'Freund: Weißt du, wo die Bibliothek ist? Höflich: Wissen Sie, wo die Bibliothek ist?'
    note: 'Nur die Endung von *دانستن* ändert sich je nach Gesprächspartner: *می‌دانی* für einen Freund, *می‌دانین* für jemanden, den Sie höflich ansprechen. Alles nach *که* bleibt gleich.'
  prs.a2.unit38.lesson02.teach.know_not_know:
    title: Ich weiß / ich weiß nicht
    gloss: Ich weiß, wo das Museum ist. Ich weiß nicht, wo das Museum ist.
    note: 'Derselbe Rahmen funktioniert auch für eine Aussage. *می‌دانم که* heißt „ich weiß, dass“ und *نمی‌دانم که* „ich weiß nicht, dass“, mit *ن* vor dem Verb. Die eingebettete Frage folgt unverändert: *نمی‌دانم که موزیم کجاست.* Diesmal endet der Satz mit einem Punkt, weil er eine Aussage ist.'
  prs.a2.unit38.lesson02.teach.order_unchanged:
    title: Das Verb bleibt wie in der direkten Frage
    gloss: Wann öffnet das Museum? Ich weiß nicht, wann das Museum öffnet.
    note: 'Im eingebetteten Fragesatz ändert sich nichts. Das Fragewort bleibt an seiner Stelle, das Verb behält seine Zeit, und ein Konjunktiv ist nicht nötig. Im Dari wird die Wortstellung nicht verändert: Die direkte Frage und die eingebettete Frage werden gleich geschrieben. (Im Deutschen rückt das Verb im Nebensatz dagegen ans Ende.)'
  prs.a2.unit38.lesson02.teach.when:
    title: Wann
    gloss: wann, um wie viel Uhr
    note: '*کی* bedeutet „wann“. Nach der Uhrzeit können Sie auch mit *ساعت چند* fragen: *بس ساعت چند حرکت می‌کند؟*'
    example_gloss: Wann fährt der Bus ab?
  prs.a2.unit38.lesson02.teach.opens:
    title: Öffnen
    gloss: öffnet (wird geöffnet)
    note: '*باز* bedeutet „offen“ und *شدن* „werden“, also heißt *باز می‌شود* „es öffnet“. Man sagt es von Büros, Museen, Banken und Geschäften.'
    example_gloss: Das Büro öffnet um neun Uhr.
  prs.a2.unit38.lesson02.teach.closes:
    title: Schließen
    gloss: schließt (wird geschlossen)
    note: '*بسته* bedeutet „geschlossen“. *بسته می‌شود* heißt „es schließt“. Es ist das Gegenteil von *باز می‌شود*.'
    example_gloss: Das Büro schließt um vier Uhr.
  prs.a2.unit38.lesson02.teach.leaves:
    title: Abfahren
    gloss: fährt ab, fährt los
    note: '*حرکت کردن* bedeutet „abfahren“. Es wird für Busse, Züge und Flugzeuge verwendet: *بس حرکت می‌کند* heißt „der Bus fährt ab“.'
    example_gloss: Der Bus fährt um acht Uhr ab.
  prs.a2.unit38.lesson02.teach.ticket:
    title: Fahrkarte
    gloss: Fahrkarte
    note: '*بلیت* ist eine Fahrkarte, ein Flugticket oder eine Eintrittskarte für ein Museum.'
    example_gloss: Die Fahrkarte ist im Büro.
  prs.a2.unit38.lesson02.teach.why:
    title: Warum
    gloss: warum
    note: '*چرا* bedeutet „warum“. In einer eingebetteten Frage bleibt es an seiner Stelle: *نمی‌دانم که چرا دفتر بسته است.*'
    example_gloss: Warum ist das Büro geschlossen?
  prs.a2.unit38.lesson02.teach.which:
    title: Welche/r/s
    gloss: welche/r/s
    note: '*کدام* bedeutet „welcher/welche/welches“ und steht vor dem Nomen: *کدام بس* heißt „welcher Bus“.'
    example_gloss: Welcher Bus fährt nach Masar?
  prs.a2.unit38.lesson02.teach.question_words:
    title: Fragewörter nach که
    gloss: Ich weiß nicht, wie viel die Fahrkarte kostet. Ich weiß nicht, warum das Büro geschlossen ist. Ich weiß nicht, welcher Bus nach Masar fährt.
    note: 'Jedes Fragewort der direkten Frage kann auf *که* folgen: *کجا* (wo), *کی* (wann), *ساعت چند* (um wie viel Uhr), *چند* (wie viel), *چرا* (warum), *کدام* (welcher). Jedes bleibt an seiner Stelle, und der Rest des Satzes ist ein normaler Aussagesatz.'
  prs.a2.unit38.lesson03.teach.open:
    title: Geöffnet
    gloss: geöffnet
    note: '*باز* bedeutet „offen“. *باز است* heißt „es ist offen“.'
    example_gloss: Das Museum ist heute geöffnet.
  prs.a2.unit38.lesson03.teach.closed:
    title: Geschlossen
    gloss: geschlossen
    note: '*بسته* bedeutet „geschlossen“. *بانک* ist die Bank.'
    example_gloss: Die Bank ist heute geschlossen.
  prs.a2.unit38.lesson03.teach.market:
    title: Markt
    gloss: Markt, Basar
    note: '*بازار* ist der Markt oder der Basar.'
    example_gloss: Der Markt ist in der Nähe.
  prs.a2.unit38.lesson03.teach.yes_no:
    title: 'Ja-Nein-Fragen: یا نه'
    gloss: Ist das Büro geöffnet? Wissen Sie, ob das Büro geöffnet ist oder nicht?
    note: 'Eine Ja-Nein-Frage hat kein Fragewort. Deshalb steht in der eingebetteten Form am Ende *یا نه* („oder nicht“): *می‌دانین که دفتر باز است یا نه؟* heißt „Wissen Sie, ob das Büro geöffnet ist oder nicht?“ Hier rahmen *که* und *یا نه* den Satz ein. *یا نه* ist im Dari die übliche Art, „ob“ auszudrücken.'
  prs.a2.unit38.lesson03.teach.yes_no_negative:
    title: Ich weiß nicht, ob
    gloss: Ich weiß nicht, ob das Büro geöffnet ist oder nicht.
    note: 'Der Aussagesatz hat dieselbe Form: *نمی‌دانم که دفتر باز است یا نه.* Alles zwischen *که* und *یا نه* ist der gewöhnliche Satz *دفتر باز است*.'
  prs.a2.unit38.lesson03.teach.aya:
    title: 'آیا: ob'
    gloss: Ist das Museum geöffnet? Ich weiß nicht, ob das Museum geöffnet ist oder nicht.
    note: '*آیا* ist ein formelles Wort, das eine Ja-Nein-Frage kennzeichnet: *آیا موزیم باز است؟* In einer eingebetteten Frage können Sie es nach *که* ergänzen, etwa in *که آیا موزیم باز است یا نه*, müssen es aber nicht: *یا نه* genügt.'
  prs.a2.unit38.lesson03.teach.answer_yes_no:
    title: Ja, es ist geöffnet. Nein, es ist geschlossen.
    gloss: Ja, es ist geöffnet. Nein, es ist geschlossen.
    note: '*بلی* heißt „ja“ und *نخیر* „nein“. Eine kurze Antwort wiederholt das Adjektiv: *باز است* (es ist geöffnet) oder *بسته است* (es ist geschlossen).'
  prs.a2.unit38.lesson03.teach.know_open_today:
    title: Wissen Sie, ob heute geöffnet ist?
    gloss: Wissen Sie, ob heute geöffnet ist?
    note: 'Wenn der Ort schon erwähnt wurde, können Sie ihn weglassen: *امروز باز است* bedeutet „heute ist geöffnet“.'
  prs.a2.unit38.lesson04.teach.excuse:
    title: Entschuldigung
    gloss: Entschuldigung, Verzeihung
    note: '*ببخشین* heißt „Entschuldigung“. Man sagt es zu einer fremden Person, bevor man etwas fragt.'
    example_gloss: Entschuldigung, wo ist das Büro?
  prs.a2.unit38.lesson04.teach.staff:
    title: Angestellter
    gloss: Angestellter, Sachbearbeiter
    note: '*کارمند* ist ein Angestellter. Am Schalter oder Fahrkartenschalter fragen Sie oft einen *کارمند*.'
    example_gloss: Der Angestellte ist im Büro.
  prs.a2.unit38.lesson04.teach.polite_request:
    title: Können Sie mir sagen ...?
    gloss: Entschuldigung, können Sie mir sagen, wo der Bahnhof ist?
    note: Um eine fremde Person höflich zu fragen, verwenden Sie *می‌توانین بگویین که* („können Sie mir sagen“) und lassen die direkte Frage folgen. Das ist eine Bitte und klingt weicher als *می‌دانین که*. *بگویین* ist die höfliche Befehlsform von *گفتن*.
  prs.a2.unit38.lesson04.teach.polite_more:
    title: Bitte mit anderen Fragen
    gloss: Können Sie mir sagen, wie viel die Fahrkarte kostet? Können Sie mir sagen, ob das Büro geöffnet ist oder nicht?
    note: 'Dieselbe Bitte funktioniert mit allen eingebetteten Fragen dieser Lektion: *چند* (wie viel), *کی*, *کجا*, *چرا* und der Ja-Nein-Form mit *یا نه*.'
  prs.a2.unit38.lesson04.teach.answer_politely:
    title: Höflich antworten
    gloss: Ja, ich weiß es. Der Bahnhof ist in der Nähe. Tut mir leid, ich weiß es nicht.
    note: Um auf *می‌دانین که ...؟* zu antworten, sagen Sie *بلی، می‌دانم* und geben die Auskunft, oder *ببخشین، نمی‌دانم*, wenn Sie es nicht wissen. Sie können auch *من هم نمی‌دانم* („ich weiß es auch nicht“) sagen.
  prs.a2.unit38.lesson04.teach.me_neither:
    title: Ich weiß es auch nicht
    gloss: Ich weiß es auch nicht.
    note: '*هم* bedeutet „auch“. Mit einem verneinten Verb heißt es „auch nicht“: *من هم نمی‌دانم* bedeutet „ich weiß es auch nicht“.'
  prs.a2.unit38.lesson05.teach.first:
    title: Zuerst
    gloss: zuerst, als Erstes
    note: '*اول* bedeutet „zuerst“. *اول ... بعد ...* heißt „zuerst ... dann ...“.'
    example_gloss: Zuerst gehe ich zur Bank.
  prs.a2.unit38.lesson05.teach.then:
    title: Dann, danach
    gloss: dann, danach
    note: '*بعد* bedeutet „dann“ oder „danach“.'
    example_gloss: Dann gehe ich in die Bibliothek.
  prs.a2.unit38.lesson05.teach.museum_turn01:
    title: Samir fragt Samina, wo das Museum ist
    gloss: Samina, weißt du, wo das Museum ist?
    note: Samir fragt eine Freundin, deshalb sagt er *می‌دانی*. Die eingebettete Frage ist *موزیم کجاست؟*.
  prs.a2.unit38.lesson05.teach.museum_turn02:
    title: Samina antwortet
    gloss: Ja, das Museum ist in der Nähe des Bahnhofs.
    note: 'Samina sagt *بلی* und gibt die Auskunft: *نزدیک ایستگاه است* („es ist in der Nähe des Bahnhofs“).'
  prs.a2.unit38.lesson05.teach.museum_turn03:
    title: Samir fragt nach der Öffnungszeit
    gloss: Weißt du, um wie viel Uhr es öffnet?
    note: Das Museum wurde schon erwähnt, deshalb lässt Samir es weg. *ساعت چند باز می‌شود* ist die eingebettete Frage.
  prs.a2.unit38.lesson05.teach.museum_turn04:
    title: Samina weiß es nicht
    gloss: Nein, ich weiß nicht, um wie viel Uhr es öffnet.
    note: Samina wiederholt die eingebettete Frage nach *نمی‌دانم که*. *نه* ist ein freundliches „Nein“.
  prs.a2.unit38.lesson05.teach.museum_turn05:
    title: Samir fragt, ob morgen geöffnet ist
    gloss: Weißt du, ob morgen geöffnet ist oder nicht?
    note: Eine Ja-Nein-Frage mit *یا نه*. *فردا* heißt „morgen“.
  prs.a2.unit38.lesson05.teach.museum_turn06:
    title: Samina ruft zuerst an
    gloss: Ich weiß es nicht. Zuerst rufe ich an.
    note: '*تیلفون می‌کنم* heißt „ich rufe an“. *اول* heißt „zuerst“. Sie ruft an, bevor sie antwortet.'
  prs.a2.unit38.lesson05.teach.message:
    title: Eine Nachricht vom Markt
    gloss: Hallo Samina. Heute bin ich auf dem Markt. Weißt du, wo die Bank ist? Ich weiß nicht, ob die Bank in der Nähe des Marktes ist oder nicht. Weißt du, ob die Bank heute geöffnet ist oder nicht? Danach gehe ich in die Bibliothek.
    note: 'Eine kurze Nachricht mit drei indirekten Fragen: wo die Bank ist, ob sie in der Nähe ist und ob sie geöffnet ist. Beachten Sie: Die erste Frage richtet sich an eine Freundin (*می‌دانی*), die zweite ist eine Aussage (*نمی‌دانم که ... یا نه*).'
  prs.a2.unit38.lesson06.teach.gate:
    title: Tor, Tür
    gloss: Tor, Tür
    note: '*دروازه* ist ein Tor oder eine große Tür, zum Beispiel das Tor eines Bahnhofs oder eines Büros.'
    example_gloss: Das Tor ist offen.
  prs.a2.unit38.lesson06.teach.thousand:
    title: Tausend
    gloss: tausend
    note: '*هزار* heißt „tausend“. *افغانی* ist die afghanische Währung: *هزار افغانی* sind tausend Afghani.'
    example_gloss: Die Fahrkarte kostet tausend Afghani.
  prs.a2.unit38.lesson06.teach.station_turn01:
    title: Samir fragt den Angestellten
    gloss: Entschuldigung, wissen Sie, wann der Bus nach Masar abfährt?
    note: Samir spricht mit einer fremden Person, deshalb verwendet er *ببخشین* und *می‌دانین*. *بس به مزار* heißt „der Bus nach Masar“.
  prs.a2.unit38.lesson06.teach.station_turn02:
    title: Der Kassierer antwortet
    gloss: Ja, das weiß ich. Der Bus fährt um acht Uhr ab.
    note: Der Angestellte sagt *بلی، می‌دانم* und nennt die Uhrzeit.
  prs.a2.unit38.lesson06.teach.station_turn03:
    title: Samir fragt nach dem Preis
    gloss: Können Sie mir sagen, wie viel die Fahrkarte kostet?
    note: 'Eine höfliche Bitte: *می‌توانین بگویین که* plus *بلیت چند است؟*.'
  prs.a2.unit38.lesson06.teach.station_turn04:
    title: Der Angestellte nennt den Preis
    gloss: Die Fahrkarte kostet tausend Afghani.
    note: Eine direkte Antwort ohne eingebettete Frage.
  prs.a2.unit38.lesson06.teach.station_turn05:
    title: Samir fragt nach dem Büro
    gloss: Danke. Wissen Sie, wo das Büro ist?
    note: '*تشکر* heißt „danke“.'
  prs.a2.unit38.lesson06.teach.station_turn06:
    title: Der Angestellte sagt, wo das Büro ist
    gloss: Das Büro ist in der Nähe des Tors.
    note: '*نزدیک دروازه است* heißt „es ist in der Nähe des Tors“.'
exercises:
  prs.a2.unit38.lesson01.exercise01.recognize_station:
    instruction: Was bedeutet dieser Satz?
    correct_option: Wissen Sie, wo die Haltestelle ist?
    distractors:
    - Wo ist die Haltestelle?
    - Ich weiß, wo der Bahnhof ist
    - Der Bahnhof ist in der Nähe
    accepted_answers:
    - value: Wissen Sie, wo die Haltestelle ist?
      status: correct
    feedback: '*می‌دانین که ایستگاه کجاست؟* heißt: Wissen Sie, wo der Bahnhof ist? Die Frage lautet, ob die andere Person es weiß.'
  prs.a2.unit38.lesson01.exercise02.recognize_library_friend:
    instruction: Was bedeutet dieser Satz?
    correct_option: Weißt du, wo die Bibliothek ist? (zu einem Freund)
    distractors:
    - Wissen Sie, wo die Bibliothek ist? (höflich)
    - Ich weiß nicht, wo die Bibliothek ist
    - Ist die Bibliothek in der Nähe?
    accepted_answers:
    - value: Weißt du, wo die Bibliothek ist? (zu einem Freund)
      status: correct
    feedback: '*می‌دانی* hat die Endung *-ی* für den Freund: Es ist dieselbe Frage an einen Freund.'
  prs.a2.unit38.lesson01.exercise03.match_forms:
    instruction: Ordnen Sie jedem Dari-Wort seine Bedeutung zu.
    accepted_answers:
    - value:
        می‌دانم: ich weiß
        می‌دانی: du weißt (zu einem Freund)
        می‌داند: er/sie weiß
        می‌دانیم: wir wissen
        می‌دانین: Sie wissen / ihr wisst (höflich oder Plural)
        می‌دانند: sie wissen
        ایستگاه: der Bahnhof
        موزیم: Museum
        کتابخانه: Bibliothek
        دفتر: Büro
      status: correct
    feedback: 'Nur die Endung von *می‌دان-* ändert sich: *-م* ich, *-ی* du (Freund), -د er/sie, *-یم* wir, *-ین* ihr/Sie (höflich oder Plural), *-ند* sie (Plural).'
    pairs:
    - left: می‌دانم
      right: ich weiß
    - left: می‌دانی
      right: du weißt (zu einem Freund)
    - left: می‌داند
      right: er/sie weiß
    - left: می‌دانیم
      right: wir wissen
    - left: می‌دانین
      right: Sie wissen / ihr wisst (höflich oder Plural)
    - left: می‌دانند
      right: sie wissen
    - left: ایستگاه
      right: der Bahnhof
    - left: موزیم
      right: Museum
