course:
  title: Dari in Deutsch A1
  description: 'Dari (Afghanistan) für Anfänger: Wortschatz zu Essen und Trinken, höflich bestellen, nach dem Angebot fragen, Mengenangaben und Restaurantetikette einschließlich der Bitte um die Rechnung.'
