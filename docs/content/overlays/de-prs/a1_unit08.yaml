teaching:
  prs.a1.unit08.lesson01.teach.naan:
    title: Brot
    gloss: Brot
    note: نان gehört in Afghanistan zu jeder Mahlzeit.
    example_gloss: Das Brot ist frisch.
  prs.a1.unit08.lesson01.teach.palaw:
    title: Reis-Pilaw
    gloss: Reis-Pilaw
    note: پلو ist das afghanische Reisgericht, besonders gewürzt und oft mit Fleisch, Karotten oder Rosinen gekocht – nicht einfach nur Reis.
    example_gloss: Der Reis-Pilaw ist lecker.
  prs.a1.unit08.lesson01.teach.qorma:
    title: Eintopf mit Fleisch und Gemüse
    gloss: Eintopf mit Fleisch und Gemüse
    note: قورمه ist die allgemeine Bezeichnung für einen gekochten Eintopf mit Fleisch und Gemüse, der meist zu پلو gereicht wird.
    example_gloss: Ich esse den Eintopf mit Reis-Pilaw.
  prs.a1.unit08.lesson01.teach.chai_review:
    title: Tee (Wiederholung)
    gloss: Tee
    note: چای ist das Getränk, das in Afghanistan fast überall angeboten wird.
    example_gloss: Einen Tee, bitte.
  prs.a1.unit08.lesson01.teach.ab_water:
    title: Wasser
    gloss: das Wasser
    note: آب ist das gewöhnliche Wort für Wasser.
    example_gloss: Ein Wasser, bitte.
  prs.a1.unit08.lesson01.teach.va_word:
    title: Und
    gloss: und
    note: و ist das gebräuchliche Bindewort, um mehrere Speisen aufzuzählen.
    target_text: و (und)
  prs.a1.unit08.lesson02.teach.mikham_chai:
    title: Höflich Tee bestellen
    gloss: Ich hätte gern einen Tee.
    note: یک چای می‌خواهم ist eine neutrale, höfliche Art zu bestellen; sie verwendet direkt می‌خواهم (ich möchte) statt einer indirekteren Formulierung.
  prs.a1.unit08.lesson02.teach.lotfan:
    title: Bitte
    gloss: bitte
    note: لطفاً kann man fast jeder Bitte hinzufügen, um sie freundlicher zu machen.
    example_gloss: Bitte helfen Sie.
  prs.a1.unit08.lesson02.teach.mikham_naan:
    title: Höflich Brot bestellen
    gloss: Ich hätte gern ein Fladenbrot.
    note: Dasselbe Muster یک [Ware] می‌خواهم gilt für jedes Wort für Speisen und Getränke.
  prs.a1.unit08.lesson03.teach.what_do_you_have:
    title: Fragen, was es gibt
    gloss: Was haben Sie?
    note: چی دارین؟ ist die natürliche Art, einen Ladenbesitzer oder Kellner zu fragen, welche Speisen es gibt.
  prs.a1.unit08.lesson03.teach.we_have_both:
    title: Mit dem Angebot antworten
    gloss: Wir haben Reis-Pilaw und Eintopf.
    note: پلو و قورمه داریم verwendet داریم (wir haben), die Wir-Form von دارم. Ein Ladenbesitzer spricht im Namen des ganzen Ladens und sagt deshalb „wir“.
  prs.a1.unit08.lesson03.teach.fresh_word:
    title: Frisch
    gloss: frisch
    note: تازه beschreibt frisch zubereitetes Essen.
    example_gloss: Dieses Brot ist frisch.
  prs.a1.unit08.lesson04.teach.yek_boshghab:
    title: Ein Teller Reis-Pilaw
    gloss: ein Teller Reis-Pilaw
    note: بشقاب (Teller) ist das Zählwort für Essen, das auf einem Teller serviert wird.
  prs.a1.unit08.lesson04.teach.do_ta_naan:
    title: Zwei Fladenbrote
    gloss: zwei Fladenbrote
    note: تا ist das allgemeine Zählwort, das bei den meisten zählbaren Dingen nach der Zahl steht, hier für zwei Stück Brot.
  prs.a1.unit08.lesson04.teach.combined_order:
    title: Eine ganze Bestellung zusammenstellen
    gloss: Einen Teller Reis-Pilaw und zwei Fladenbrote, bitte.
    note: Mehrere Mengenangaben können in einer Bestellung mit و (und) verbunden werden.
  prs.a1.unit08.lesson05.teach.bill_word:
    title: Die Rechnung
    gloss: die Rechnung
    note: بل (aus dem Englischen „bill“) ist das alltägliche afghanische Wort für die Restaurantrechnung.
    example_gloss: Die Rechnung, bitte.
  prs.a1.unit08.lesson05.teach.bill_request:
    title: Nach dem Rechnungsbetrag fragen
    gloss: Wie viel macht die Rechnung?
    note: بل چند می‌شه؟ fragt wörtlich „die Rechnung wird wie viel?“ und ist die natürliche Alltagsfrage nach dem Gesamtbetrag. می‌شه ist die gesprochene Form von می‌شود; sie hören sie im Geschäft, geschrieben wird می‌شود.
  prs.a1.unit08.lesson05.teach.khoshmaze:
    title: Sagen, dass das Essen lecker war
    gloss: Es war sehr lecker.
    note: خیلی خوش‌مزه بود ist ein natürliches Kompliment nach dem Essen.
  prs.a1.unit08.lesson05.teach.chaikhana:
    title: Teehaus
    gloss: Teehaus / einfaches Lokal
    note: چایخانه ist in Afghanistan, besonders in Kabul, ein gewöhnliches, einfaches Lokal, in dem es Tee und schlichte Mahlzeiten gibt.
  prs.a1.unit08.lesson06.teach.welcome_review:
    title: Willkommen (Wiederholung)
    gloss: willkommen
    note: خوش آمدین wurde in der Einheit über Begrüßungen eingeführt; hier ist es die Begrüßung eines Ladenbesitzers.
  prs.a1.unit08.lesson06.teach.turn01:
    title: Der Ladenbesitzer begrüßt den Kunden
    gloss: Der Ladenbesitzer heißt den Kunden willkommen und fragt, was er möchte.
    note: چی میل دارین؟ ist eine höfliche Eröffnungsfrage, ähnlich wie چی دارین؟, aber vom Wunsch des Kunden aus formuliert.
  prs.a1.unit08.lesson06.teach.turn02:
    title: Der Kunde fragt nach dem Angebot
    gloss: Der Kunde grüßt den Ladenbesitzer und fragt, was es gibt.
    note: چی دارین؟ eröffnet das Bestellgespräch, aus Lektion 3.
  prs.a1.unit08.lesson06.teach.turn03:
    title: Der Ladenbesitzer nennt das Angebot
    gloss: Der Ladenbesitzer sagt, dass sie Reis-Pilaw und Eintopf haben, beides frisch.
    note: هردو (beide) bestätigt, dass beide genannten Gerichte frisch sind.
  prs.a1.unit08.lesson06.teach.turn04:
    title: Der Kunde gibt eine ganze Bestellung auf
    gloss: Der Kunde ist einverstanden und bestellt einen Teller Reis-Pilaw mit Eintopf und dazu einen Tee.
    note: Hier verbinden sich das Mengenmuster aus Lektion 4 und der Speisenwortschatz aus Lektion 1.
  prs.a1.unit08.lesson06.teach.turn05:
    title: Der Ladenbesitzer bestätigt die Bestellung
    gloss: Der Ladenbesitzer sagt, dass er es sofort bringt.
    note: چشم, wörtlich „auf mein Auge“, ist eine respektvolle Art, „sehr gern“ zu sagen. می‌آرم ist die gesprochene Form von می‌آورم (ich bringe), und همین حالا bedeutet „gleich jetzt“.
  prs.a1.unit08.lesson06.teach.turn06:
    title: Der Kunde lobt das Essen und fragt nach der Rechnung
    gloss: Der Kunde sagt, dass es lecker war, und fragt nach der Rechnung.
    note: Beide Wendungen greifen direkt den Wortschatz aus Lektion 5 auf.
  prs.a1.unit08.lesson06.teach.turn07:
    title: Der Ladenbesitzer nennt den Gesamtbetrag
    gloss: Der Ladenbesitzer bedankt sich und sagt, dass es zweihundert Afghani macht.
    note: افغانی ist die Währung Afghanistans; دوصد (zweihundert) wird mit dem Währungsnamen verbunden, um einen Preis zu nennen.
