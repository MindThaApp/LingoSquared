teaching:
  prs.a1.unit09.lesson01.teach.shanbe_yakshanbe:
    title: Samstag und Sonntag
    gloss: Samstag, Sonntag
    note: شنبه (Samstag) ist in Afghanistan der erste Tag der Woche; danach folgt یکشنبه (Sonntag).
    example_gloss:
    - Heute ist Samstag.
    - Morgen ist Sonntag.
  prs.a1.unit09.lesson01.teach.doshanbe_seshanbe:
    title: Montag und Dienstag
    gloss: Montag, Dienstag
    note: دوشنبه und سه‌شنبه bedeuten wörtlich „zweiter Tag“ und „dritter Tag“ nach شنبه.
    example_gloss:
    - Am Montag habe ich Unterricht.
    - Am Dienstag habe ich einen Termin.
  prs.a1.unit09.lesson01.teach.chaharshanbe_panjshanbe:
    title: Mittwoch und Donnerstag
    gloss: Mittwoch, Donnerstag
    note: 'چهارشنبه und پنجشنبه setzen dasselbe Muster fort: „vierter Tag“ und „fünfter Tag“.'
    example_gloss:
    - Am Mittwoch arbeite ich.
    - Wir sehen uns am Donnerstag.
  prs.a1.unit09.lesson01.teach.jomeh:
    title: Freitag
    gloss: Freitag
    note: جمعه ist in Afghanistan der wöchentliche Feiertag, vergleichbar mit dem freien Wochenendtag in Deutschland.
    example_gloss: Freitag ist ein freier Tag.
  prs.a1.unit09.lesson01.teach.tarikh_word:
    title: Datum
    gloss: Datum
    note: تاریخ ist das allgemeine Wort für ein Kalenderdatum.
    example_gloss: Welches Datum ist heute?
  prs.a1.unit09.lesson01.teach.va_word:
    title: Und
    gloss: und
    note: و ist das gebräuchliche Bindewort, das in dieser Lektion immer wieder vorkommt.
    target_text: و (und)
  prs.a1.unit09.lesson01.teach.weekend_note:
    title: Der wöchentliche Feiertag
    gloss: Freitag ist der wöchentliche freie Tag.
    note: Anders als beim Wochenende von Samstag und Sonntag ist der wichtigste wöchentliche Feiertag in Afghanistan *جمعه* (Freitag); der Donnerstag ist oft ein halber Arbeitstag.
  prs.a1.unit09.lesson02.teach.hamal:
    title: Hamal (1. Monat)
    gloss: Hamal, der erste Monat des Hidschri-Schamsi-Kalenders (ca. Ende März–April)
    note: حمل eröffnet das afghanische Sonnenjahr und fällt mit dem Neujahrsfest Nowruz zusammen.
    example_gloss: Hamal ist der erste Monat des Jahres.
  prs.a1.unit09.lesson02.teach.sawr:
    title: Sawr (2. Monat)
    gloss: Sawr, der zweite Monat (ca. April–Mai)
    note: ثور folgt auf حمل.
    example_gloss: Im Sawr ist das Wetter schön.
  prs.a1.unit09.lesson02.teach.jawza:
    title: Dschauza (3. Monat)
    gloss: Dschauza, der dritte Monat (ca. Mai–Juni)
    note: جوزا folgt auf ثور.
    example_gloss: Ich bin im Dschauza geboren.
  prs.a1.unit09.lesson02.teach.calendar_note:
    title: Der Kalender Afghanistans
    gloss: Afghanistan verwendet den Hidschri-Schamsi-Kalender (Sonnenhidschra).
    note: Es ist dasselbe Sonnenkalendersystem wie im Iran; es unterscheidet sich sowohl vom gregorianischen Kalender als auch vom islamischen Mondkalender.
  prs.a1.unit09.lesson03.teach.what_day_today:
    title: Fragen, welcher Wochentag heute ist
    gloss: Welcher Wochentag ist heute?
    note: امروز چند شنبه است؟ fragt wörtlich „Heute ist der Wievielte -shanbe?“ – die natürliche Art, nach dem Wochentag zu fragen.
  prs.a1.unit09.lesson03.teach.today_word:
    title: Heute
    gloss: heute
    note: امروز bezeichnet den aktuellen Tag.
    example_gloss: Der Wievielte ist heute?
  prs.a1.unit09.lesson04.teach.give_full_date:
    title: Ein vollständiges Datum nennen
    gloss: Heute ist Donnerstag, der 15. Hamal.
    note: امروز پنجشنبه، پانزدهم حمل است verbindet den Wochentag, ein Ordnungszahl-Datum und den Monatsnamen.
  prs.a1.unit09.lesson05.teach.which_day_meeting:
    title: Fragen, an welchem Tag etwas stattfindet
    gloss: An welchem Tag ist die Besprechung?
    note: جلسه کدام روز است؟ verwendet کدام (welcher), um nach dem Tag einer Veranstaltung zu fragen.
  prs.a1.unit09.lesson05.teach.which_date:
    title: Nach einem bestimmten Datum fragen
    gloss: Der wievielte Hamal ist der Montag?
    note: دوشنبه چندم حمل است؟ fragt, auf welchen Tag des Monats der Montag fällt.
  prs.a1.unit09.lesson06.teach.nozdahom:
    title: '19.'
    gloss: '19.'
    note: '*نوزدهم* ist die Ordnungszahl zu neunzehn und folgt demselben Muster wie *پانزدهم* (15.).'
    example_gloss: Heute ist der 19.
  prs.a1.unit09.lesson06.teach.turn01:
    title: Homayoun fragt nach dem Tag der Besprechung
    gloss: Homayoun fragt Baschir, an welchem Tag die Besprechung ist.
    note: جلسه کدام روز است؟ aus Lektion 5.
  prs.a1.unit09.lesson06.teach.turn02:
    title: Baschir antwortet
    gloss: Baschir sagt, er glaube, es sei Montag.
    note: فکر می‌کنم („ich glaube“) schwächt die Antwort ab, da er nicht ganz sicher ist.
  prs.a1.unit09.lesson06.teach.turn03:
    title: Homayoun fragt nach dem genauen Datum
    gloss: Homayoun fragt, der wievielte Hamal der Montag ist.
    note: دوشنبه چندم حمل است؟ aus Lektion 5.
  prs.a1.unit09.lesson06.teach.turn04:
    title: Baschir nennt das genaue Datum
    gloss: Baschir sagt, Montag sei der 19. Hamal.
    note: '*دوشنبه نوزدهم حمل است* verbindet Wochentag, Ordnungszahl und Monat, wie im Muster aus Lektion 4 gelernt.'
  prs.a1.unit09.lesson06.teach.turn05:
    title: Homayoun fragt nach Freitag
    gloss: Homayoun ist einverstanden und fragt, ob Baschir am Freitag Zeit hat.
    note: وقت داری؟ („Hast du Zeit?“) ist eine natürliche Art, nach der Verfügbarkeit zu fragen.
  prs.a1.unit09.lesson06.teach.turn06:
    title: Baschir sagt, dass er beschäftigt ist
    gloss: Baschir sagt Nein, am Freitag ist er beschäftigt.
    note: مصروف استم („Ich bin beschäftigt“) erklärt, warum der Freitag nicht geht.
  prs.a1.unit09.lesson06.teach.turn07:
    title: Homayoun bestätigt den Montag
    gloss: Homayoun sagt, das sei kein Problem, er sehe Baschir am Montag.
    note: مشکل نیست („kein Problem“) entschärft den Terminkonflikt, bevor der ursprüngliche Montagstermin bestätigt wird.
