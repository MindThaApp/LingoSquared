    gloss: Zarmina hat eine Katze. Ihre Katze ist weiß und klein. Zarmina füttert die Katze jeden Tag.
    note: Ein kurzer Lesetext, der den Wortschatz zu Haustieren wiederholt und دارد (er/sie hat, 3. Person, Wiederholung aus Einheit 26/27) sowie می‌دهد (er/sie gibt/füttert, 3. Person, Wiederholung aus Einheit 18) enthält.
