  prs.a1.unit28.lesson04.teach.dialogue_line2:
    title: 'Zarmina: Ja, ich habe eine Katze'
    gloss: 'Zarmina: Ja, ich habe eine Katze.'
    note: Die Antwort besteht aus بلی und یک پشک دارم.
  prs.a1.unit28.lesson04.teach.dialogue_line3:
    title: 'Homayoun: Welche Farbe hat deine Katze?'
    gloss: 'Homayoun: Welche Farbe hat deine Katze?'
    note: Verwendet چه رنگ („welche Farbe“), dasselbe Muster wie die Einkaufsfrage in Einheit 21.
  prs.a1.unit28.lesson04.teach.dialogue_line4:
    title: 'Zarmina: Sie ist weiß'
    gloss: 'Zarmina: Sie ist weiß.'
    note: Eine kurze Antwort – nur die Farbe plus است. Die Katze ergibt sich bereits aus der Frage, deshalb wird پشک nicht wiederholt.
  prs.a1.unit28.lesson04.teach.dialogue_line5:
    title: 'Homayoun: Fütterst du sie jeden Tag?'
    gloss: 'Homayoun: Fütterst du sie jeden Tag?'
    note: Hier begegnet Ihnen غذا می‌دهی (du fütterst, wörtlich „du gibst Futter“, informell), gebildet aus غذا (Essen, Futter) + می‌دهی, dem informellen Gegenstück zu می‌دهد aus Einheit 18.
