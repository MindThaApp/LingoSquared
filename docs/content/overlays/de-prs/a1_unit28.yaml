course:
  title: Dari in Deutsch A1
  description: 'Dari für Anfänger (Kabul): Wortschatz zu Tieren und Haustieren (Hund, Katze, Vogel, Fisch), nach einem Haustier fragen und antworten mit حیوان خانگی دارین؟, Größe und Farbe eines Haustiers beschreiben sowie ein Dialog zwischen Zarmina und Homayoun darüber, eine Katze zu besitzen und zu füttern.'
