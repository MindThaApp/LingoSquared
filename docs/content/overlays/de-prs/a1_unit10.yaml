teaching:
  prs.a1.unit10.lesson01.teach.dokan:
    title: Laden
    gloss: Geschäft
    note: دوکان ist das echte afghanische Dari-Wort für einen kleinen Laden vor Ort; im iranischen Persisch sagt man dafür مغازه.
    example_gloss: Dieser Laden ist groß.
  prs.a1.unit10.lesson01.teach.qeymat:
    title: Preis
    gloss: Preis
    note: قیمت bedeutet „Preis“.
    example_gloss: Was kostet das?
  prs.a1.unit10.lesson01.teach.arzan:
    title: Billig
    gloss: billig
    note: ارزان bedeutet „billig“ oder „preiswert“.
    example_gloss: Das ist billig.
  prs.a1.unit10.lesson01.teach.gran:
    title: Teuer
    gloss: teuer
    note: گران ist das Gegenteil von ارزان.
    example_gloss: Das ist teuer.
  prs.a1.unit10.lesson01.teach.takhfif:
    title: Rabatt
    gloss: Rabatt
    note: تخفیف bedeutet einen Preisnachlass.
    example_gloss: Haben Sie einen Rabatt?
  prs.a1.unit10.lesson01.teach.va_word:
    title: Und
    gloss: und
    note: و ist das gebräuchliche Bindewort, mit dem man zwei kurze Aussagen oder Bitten verbindet.
    example_gloss: Ich kaufe Äpfel und Brot.
  prs.a1.unit10.lesson02.teach.qeymatesh_chand:
    title: Wie viel kostet das?
    gloss: Wie viel macht das?
    note: 'قیمتش چند است؟ fragt wörtlich: „Sein Preis, wie viel ist er?“'
  prs.a1.unit10.lesson02.teach.sad_afghani:
    title: Es kostet hundert Afghani.
    gloss: Es kostet hundert Afghani.
    note: صد افغانی است nennt einen Preis mit افغانی, der afghanischen Währung.
  prs.a1.unit10.lesson03.teach.sib:
    title: Apfel/Äpfel
    gloss: Apfel/Äpfel
    note: سیب bedeutet Apfel und steht hier allgemein bzw. im Plural für Äpfel, die verkauft werden.
    example_gloss: Ich möchte ein Kilo Äpfel.
  prs.a1.unit10.lesson03.teach.kilo:
    title: Kilo
    gloss: Kilo
    note: کیلو ist die übliche Einheit, um Obst und Gemüse nach Gewicht zu verkaufen.
    example_gloss: Ich möchte ein Kilo Äpfel.
  prs.a1.unit10.lesson03.teach.label_text:
    title: 'Äpfel: ein Kilo, hundert Afghani'
    gloss: 'Äpfel: ein Kilo, hundert Afghani'
    note: 'سیب: یک کیلو صد افغانی ist ein typisches Preisschild auf dem Markt.'
  prs.a1.unit10.lesson04.teach.yak_kilo_sib:
    title: Ich möchte ein Kilo Äpfel.
    gloss: Ich möchte ein Kilo Äpfel.
    note: یک کیلو سیب می‌خواهم folgt demselben Muster یک [Ware] می‌خواهم, das in Lektion 8 für Bestellungen von Essen behandelt wurde.
  prs.a1.unit10.lesson04.teach.do_kilo:
    title: Ich möchte zwei Kilo.
    gloss: Ich möchte zwei Kilo.
    note: دو کیلو می‌خواهم setzt دو (zwei) für eine größere Menge ein.
  prs.a1.unit10.lesson05.teach.takhfif_mitanin:
    title: Können Sie mir einen Rabatt geben?
    gloss: Können Sie mir einen Rabatt geben?
    note: تخفیف می‌توانین بدهین؟ bittet höflich um einen niedrigeren Preis und verwendet می‌توانین (Sie können).
  prs.a1.unit10.lesson05.teach.baraye_shoma:
    title: Für Sie macht es 180 Afghani.
    gloss: Für Sie macht es 180 Afghani.
    note: 'برای شما صد و هشتاد افغانی می‌شه nennt einen ermäßigten Gesamtpreis: 20 Afghani weniger als die vollen 200 für zwei Kilo à 100.'
  prs.a1.unit10.lesson06.teach.befarmayin:
    title: Bitte, treten Sie näher
    gloss: bitte, treten Sie näher
    note: بفرمایین ist eine freundliche, höfliche Begrüßung bzw. Einladung, mit der ein Händler einen Kunden empfängt.
    example_gloss: Bitte sehr, das ist der Preis.
  prs.a1.unit10.lesson06.teach.turn01:
    title: Hallo, bitte kommen Sie herein.
    gloss: Hallo, bitte kommen Sie herein.
    note: Der Händler begrüßt den Kunden freundlich.
  prs.a1.unit10.lesson06.teach.turn02:
    title: Hallo. Wie viel kosten die Äpfel?
    gloss: Hallo. Wie viel kosten die Äpfel?
    note: Der Kunde fragt nach dem Preis der Äpfel.
  prs.a1.unit10.lesson06.teach.turn03:
    title: Ein Kilo kostet hundert Afghani.
    gloss: Ein Kilo kostet hundert Afghani.
    note: Der Händler nennt den Preis pro Kilo.
  prs.a1.unit10.lesson06.teach.turn04:
    title: Ich möchte zwei Kilo. Können Sie mir einen Rabatt geben?
    gloss: Ich möchte zwei Kilo. Können Sie mir einen Rabatt geben?
    note: Der Kunde nennt die Menge und fragt nach einem Rabatt.
  prs.a1.unit10.lesson06.teach.turn05:
    title: Ja, für Sie machen zwei Kilo 180 Afghani.
    gloss: Ja, für Sie machen zwei Kilo 180 Afghani.
    note: Der Händler stimmt zu und nennt den ermäßigten Gesamtpreis – passend zum Preis von 100 Afghani pro Kilo aus der dritten Gesprächsrunde (200 minus 20 Afghani Rabatt).
  prs.a1.unit10.lesson06.teach.turn06:
    title: Sehr gut, danke.
    gloss: Sehr gut, danke.
    note: Der Kunde akzeptiert den Preis und bedankt sich beim Händler.
