    title: Bäume und Blumen sind im Park
    gloss: Bäume und Blumen sind im Park.
    note: Dieser Satz verbindet Baum, Blume, und und Park.
  prs.a1.unit55.lesson01.teach.park_is_nice_phrase:
    title: Der Park ist schön
    gloss: Der Park ist schön.
    note: Dieser Satz verbindet Park, ist und gut/schön.
