    note: Das sind Wörter zur Wiederholung, mit denen Sie die Öffnungszeiten des Parks beschreiben können.
    target_text: پارک (Park) / باز (offen) / بسته (geschlossen) / است (ist)
  prs.a1.unit55.lesson02.teach.review_hours_words:
    title: 'Wiederholung: von, bis, sechs, Morgen, acht, Abend, Uhr'
    gloss: von / bis / sechs / morgens / acht / abends / Uhr
    note: Das sind Wörter zur Wiederholung (aus früheren Lektionen), mit denen Sie die Öffnungszeiten des Parks angeben.
    target_text: از (von) / تا (bis) / شش (sechs) / صبح (Morgen) / هشت (acht) / شب (Abend) / ساعت (Uhr)
  prs.a1.unit55.lesson02.teach.park_sign_reading:
    title: Das Parkschild lesen
    gloss: Der Park ist von sechs Uhr morgens bis acht Uhr abends geöffnet.
  prs.a1.unit55.lesson03.teach.review_propose_words:
    title: 'Wiederholung: Sie möchten (höflich), Samstag, lass uns gehen, Park'
    gloss: Sie möchten (höflich) / Samstag / gehen wir / Park
    note: Das sind Wörter zur Wiederholung, mit denen Sie einen Plan vorschlagen – nach demselben Muster, das in diesem Kurs schon für den Vorschlag eines Konzertbesuchs vorkam.
    target_text: می‌خواهین (möchten Sie, höflich) / شنبه (Samstag) / برویم (lass uns gehen) / پارک (Park)
  prs.a1.unit55.lesson03.teach.propose_park_phrase:
    title: Möchten Sie am Samstag in den Park gehen?
    gloss: Möchten Sie am Samstag in den Park gehen?
