teaching:
  prs.a1.unit55.lesson01.teach.review_this_is_in_good:
    title: 'Wiederholung: dieser, ist, in, gut'
    gloss: dies / ist / in / gut
    note: Das sind Wörter zur Wiederholung (in diesem Kurs durchgehend verwendet), mit denen Sie über den Park sprechen können.
    target_text: این (dieser/diese/dieses) / است (ist) / در (in) / خوب (gut)
  prs.a1.unit55.lesson01.teach.review_park_and:
    title: 'Wiederholung: Park, und'
    gloss: Park / und
    note: Das sind Wörter zur Wiederholung, mit denen Sie den Park beschreiben können.
    target_text: پارک (Park) / و (und)
  prs.a1.unit55.lesson01.teach.tree_word:
    title: Baum
    gloss: Baum
    note: Das ist das übliche Dari-Wort für „Baum“.
    example_gloss: Der Baum ist im Park.
  prs.a1.unit55.lesson01.teach.flower_word:
    title: Blume
    gloss: Blume
    note: Das ist das übliche Dari-Wort für „Blume“.
    example_gloss: Diese Blume ist schön.
