    gloss: du (informell) / du machst/treibst Sport (informell)
    note: تو (du, informell) und می‌کنی (du machst, informell) sind beide Wiederholung und werden im informellen Dialog zwischen engen Freunden in dieser Lektion verwendet.
    target_text: تو (du, informell) / می‌کنی (du machst/treibst Sport, informell)
  prs.a1.unit29.lesson04.teach.koja_word:
