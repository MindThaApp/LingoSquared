    gloss: Fußball
    note: فوتبال bedeutet Fußball.
    example_gloss: Fußball ist ein guter Sport.
  prs.a1.unit29.lesson01.teach.volleyball_word:
    title: Volleyball
    gloss: Volleyball
    note: والیبال bedeutet Volleyball.
    example_gloss: Volleyball ist auch ein Sport.
  prs.a1.unit29.lesson01.teach.cricket_word:
    title: Cricket
    gloss: Cricket
    note: کرکت bedeutet Cricket – eine in Afghanistan besonders beliebte Sportart.
    example_gloss: Cricket ist ein beliebter Sport.
  prs.a1.unit29.lesson01.teach.swimming_word:
    title: Schwimmen
    gloss: Schwimmen
    note: شنا bedeutet Schwimmen.
    example_gloss: Schwimmen ist ein guter Sport.
  prs.a1.unit29.lesson01.teach.review_bazi_kardan:
    title: Spiel / machen → spielen
    gloss: Spiel / machen → ich spiele
    note: بازی (Spiel/spielen) verbindet sich mit کردن (machen, Wiederholung) zu بازی می‌کنم (ich spiele) – dasselbe Muster mit Funktionsverb wie schon bei پیاده‌روی می‌کنم und آشپزی می‌کنم.
    target_text: بازی (Spiel/spielen) + کردن (machen) = بازی می‌کنم (ich spiele)
  prs.a1.unit29.lesson01.teach.combined_sentence:
    title: Fußball ist ein Sport
    gloss: Fußball ist ein Sport.
    note: Verbindet فوتبال، یک (ein, Wiederholung), ورزش und است (ist, Wiederholung).
  prs.a1.unit29.lesson02.teach.review_chand:
    title: Wie viele
    gloss: wie viele
    note: چند wird hier verwendet, um nach der Häufigkeit zu fragen.
    target_text: چند (wie viele)
  prs.a1.unit29.lesson02.teach.bar_word:
    title: Mal (Vorkommen)
    gloss: Mal (z. B. „einmal“)
    note: بار bedeutet „Mal“ im Sinne des Zählens von Vorkommen, nicht Uhrzeit.
    example_gloss: Ich schwimme einmal pro Woche.
  prs.a1.unit29.lesson02.teach.review_dar_hafta:
    title: In / Woche
    gloss: in / Woche
    note: در (in, Wiederholung) und هفته (Woche, Wiederholung aus Lektion 4/Lektion 9) bedeuten zusammen „pro Woche“.
    target_text: در (in) / هفته (Woche)
