    title: Ich mag / Zeit / ich habe nicht
    gloss: ich mag / Zeit / ich habe nicht
    note: دوست دارم (ich mag, Wiederholung aus Lektion 14/Lektion 26), وقت (Zeit, Wiederholung aus Lektion 11/Lektion 26) und ندارم (ich habe nicht, Wiederholung aus Lektion 3/Lektion 28) ergeben zusammen den Abschlusssatz.
    target_text: دوست دارم (ich mag) / وقت (Zeit) / ندارم (ich habe nicht)
  prs.a1.unit29.lesson06.teach.wrap_summary:
    title: Ich mag Fußball, aber ich habe keine Zeit
    gloss: Ich mag Fußball, aber ich habe keine Zeit.
    note: Verbindet eine Vorliebe und eine Einschränkung mit اما, sodass وقت ندارم einen echten Nutzen bekommt.
