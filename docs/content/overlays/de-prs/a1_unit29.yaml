course:
  title: Dari in Deutsch A1
  description: 'Dari (Kabul) für Anfänger: Wortschatz zu Sport und Bewegung (Fußball, Volleyball, Cricket, Schwimmen), fragen und antworten, wie oft pro Woche man Sport treibt, sagen, wo man spielt oder trainiert, und ein Dialog zwischen Zarmina und Homayoun, der Sport, Häufigkeit und Ort verbindet.'
