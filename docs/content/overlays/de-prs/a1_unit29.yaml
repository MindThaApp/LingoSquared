    title: Sie treiben Sport (höflich)
    gloss: Sie treiben Sport (formell)
    note: ورزش می‌کنین ist die höfliche, formelle Form von „Sie treiben Sport“.
    target_text: ورزش می‌کنین (Sie treiben Sport, höflich)
  prs.a1.unit29.lesson02.teach.question_frequency:
    title: Wie oft pro Woche treiben Sie Sport?
    gloss: Wie oft pro Woche treiben Sie Sport?
    note: Verbindet چند بار (wie oft) + در هفته (pro Woche) + ورزش می‌کنین (Sie treiben Sport, formell).
  prs.a1.unit29.lesson02.teach.do_bar_answer:
    title: Ich spiele zweimal pro Woche Fußball
    gloss: Ich spiele zweimal pro Woche Fußball.
    note: دو (zwei, Wiederholung aus Lektion 4) بار در هفته nennt die Häufigkeit, bevor die Sportart und die Konstruktion بازی می‌کنم folgen.
