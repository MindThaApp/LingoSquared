teaching:
  prs.a1.unit29.lesson01.teach.sport_word:
    title: Sport
    gloss: Sport / Training
    note: ورزش bedeutet Sport oder Training und ist der allgemeine Begriff für jede körperliche Betätigung.
    example_gloss: Schwimmen ist ein guter Sport.
  prs.a1.unit29.lesson01.teach.football_word:
