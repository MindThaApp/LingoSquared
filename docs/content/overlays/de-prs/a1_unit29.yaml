    title: Er/Sie macht/spielt
    gloss: er/sie macht/spielt
    note: می‌کند ist die Form der 3. Person (Wiederholung) zu می‌کنم und می‌کنی. Sie kommt in diesem Dialog nicht vor, sondern wird im Lesetext der nächsten Lektion geübt.
    target_text: می‌کند (er/sie macht/spielt, 3. Person)
  prs.a1.unit29.lesson04.teach.dialogue_line1:
    title: 'Homayoun: Zarmina, wie oft pro Woche treibst du Sport?'
    gloss: 'Homayoun: Zarmina, wie oft pro Woche treibst du Sport?'
    note: Eine informelle Frage unter Freunden mit der informellen Form می‌کنی.
  prs.a1.unit29.lesson04.teach.dialogue_line2:
    title: 'Zarmina: Ich spiele zweimal pro Woche Volleyball'
    gloss: 'Zarmina: Ich spiele zweimal pro Woche Volleyball.'
    note: Die Antwort mit دو بار در هفته und والیبال بازی می‌کنم.
  prs.a1.unit29.lesson04.teach.dialogue_line3:
    title: 'Homayoun: Wo spielst du?'
    gloss: 'Homayoun: Wo spielst du?'
    note: Verwendet کجا (wo), das in dieser Lektion neu eingeführt wurde.
  prs.a1.unit29.lesson04.teach.dialogue_line4:
    title: 'Zarmina: Ich spiele im Fitnessstudio'
    gloss: 'Zarmina: Ich spiele im Fitnessstudio.'
    note: Eine kurze Antwort mit در باشگاه.
  prs.a1.unit29.lesson04.teach.dialogue_line5:
    title: 'Homayoun: Ich spiele jede Woche im Park Fußball'
    gloss: 'Homayoun: Ich spiele jede Woche im Park Fußball.'
    note: Führt هر (jede/jeder, Wiederholung aus Lektion 24) in Verbindung mit هفته zu هر هفته ein.
  prs.a1.unit29.lesson04.teach.dialogue_line6:
    title: 'Zarmina: Toll!'
    gloss: 'Zarmina: Toll!'
    note: عالی است beendet den Austausch positiv.
  prs.a1.unit29.lesson05.teach.reading_passage:
    title: Lesetext über Sport
    gloss: Zarmina spielt zweimal pro Woche Volleyball. Sie spielt im Fitnessstudio. Homayoun spielt jede Woche im Park Fußball.
    note: Ein kurzer Lesetext, der den Sportwortschatz der Lektion wiederholt. Er führt می‌کند (macht, 3. Person, Wiederholung) und او (er/sie, Wiederholung) anhand der beiden bekannten Personen ein.
  prs.a1.unit29.lesson06.teach.review_ama:
