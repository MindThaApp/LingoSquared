course:
  title: Dari A2
  description: 'Afghanisches Dari für Fortgeschrittene (unteres Niveau): Erzählen Sie, was Sie letztes Wochenende getan haben, der Reihe nach, auch was Sie nicht getan haben. Das einfache Präteritum als System (Vergangenheitsstamm plus Endungen), die verneinte Vergangenheit und der Gegensatz zur Gegenwart.'
units:
  prs.a2.unit19.last_weekend:
    title: Letztes Wochenende
lessons:
  prs.a2.unit19.lesson01.weekend_words_and_past_form:
    title: Wochenendwörter und die Vergangenheitsform
  prs.a2.unit19.lesson02.building_the_past:
    title: Die Vergangenheit mit weiteren Verben bilden
  prs.a2.unit19.lesson03.negative_past:
    title: Die verneinte Vergangenheit und Vergangenheit im Vergleich zur Gegenwart
  prs.a2.unit19.lesson04.telling_in_order:
    title: In der richtigen Reihenfolge erzählen
  prs.a2.unit19.lesson05.reading_and_listening:
    title: 'Lesen und Hören: ein Wochenende'
  prs.a2.unit19.lesson06.weekend_conversation:
    title: Ein Gespräch über das Wochenende
teaching:
  prs.a2.unit19.lesson01.teach.last_weekend:
    title: Letztes Wochenende
    gloss: letztes Wochenende
    note: '*آخر هفته* ist das Wochenende, und *گذشته* bedeutet vergangen oder letzte(s). Zusammen ergibt *آخر هفتهٔ گذشته* „letztes Wochenende“, den Zeitrahmen für die ganze Lektion.'
    example_gloss: Letztes Wochenende bin ich zum Basar gegangen.
  prs.a2.unit19.lesson01.teach.thursday_friday:
    title: Donnerstag, Freitag
    gloss: Donnerstag, Freitag
    note: In Afghanistan ist der Freitag der wöchentliche Feiertag, und viele Menschen beginnen ihr Wochenende schon am Donnerstagnachmittag. Deshalb sind *پنجشنبه* und *جمعه* die beiden Tage, die Sie für Wochenendgeschichten am häufigsten brauchen.
    example_gloss:
    - Am Donnerstagnachmittag bin ich zur Bank gegangen.
    - Am Freitag bin ich in den Park gegangen.
  prs.a2.unit19.lesson01.teach.afternoon:
    title: Nachmittag
    gloss: Nachmittag, später Nachmittag
    note: '*عصر* ist der späte Nachmittag. Es steht nach dem Tag: *پنجشنبه عصر* heißt „Donnerstagnachmittag“.'
    example_gloss: Am Donnerstagnachmittag bin ich zur Bank gegangen.
  prs.a2.unit19.lesson01.teach.yesterday:
    title: Gestern
    gloss: gestern
    note: '*دیروز* ist ein Wiederholungswort aus der Lektion über vergangene Ereignisse. Es steht mit derselben Vergangenheitsform des Verbs, die Sie in dieser Lektion bilden.'
    example_gloss: Gestern habe ich gefrühstückt.
  prs.a2.unit19.lesson01.teach.in_bazaar:
    title: Auf dem Basar
    gloss: auf dem Basar
    note: '*در* bedeutet „in“ oder „an/auf“, und *بازار* ist der Basar oder Markt, der Ort vieler Wochenenderledigungen.'
    example_gloss: Auf dem Basar habe ich Brot und Obst gekauft.
  prs.a2.unit19.lesson01.teach.bank:
    title: Bank
    gloss: Bank
    note: '*بانک* ist die Bank. Das ist ein weiterer Ort für Erledigungen.'
    example_gloss: Am Nachmittag bin ich zur Bank gegangen.
  prs.a2.unit19.lesson01.teach.park:
    title: Park
    gloss: Park
    note: '*پارک* ist der Park, ein Wiederholungswort aus den Lektionen über Ausflüge.'
    example_gloss: Am Freitag bin ich mit meinen Freunden in den Park gegangen.
  prs.a2.unit19.lesson01.teach.shopping:
    title: Einkaufen
    gloss: einkaufen, Besorgungen machen
    note: '*خرید کردن* ist die alltägliche Art zu sagen, dass man einkaufen war. *خرید* ist der Einkauf und *کردن* das Verb „machen, tun“.'
    example_gloss: Ich habe auf dem Basar eingekauft.
  prs.a2.unit19.lesson01.teach.visiting:
    title: Jemanden besuchen gehen
    gloss: jemanden besuchen gehen
    note: '*به دیدن* plus eine Person plus *رفتن* bedeutet, diese Person besuchen zu gehen: *به دیدن فامیلم رفتم* heißt „Ich habe meine Familie besucht“. Besuche sind das zweite große Thema dieser Lektion.'
    example_gloss: Am Freitag habe ich meine Familie besucht.
  prs.a2.unit19.lesson01.teach.family:
    title: Familie, Verwandte
    gloss: Familie, Verwandte
    note: '*فامیل* sind Ihre Familie und Verwandten. Mit *-م* sagen Sie „mein/meine“: *فامیلم* heißt „meine Familie“.'
    example_gloss: Meine Familie ist in Kabul.
  prs.a2.unit19.lesson01.teach.errands:
    title: Besorgungen haben
    gloss: etwas zu erledigen haben, Besorgungen haben
    note: '*کار* heißt „Arbeit“, aber auch „Aufgabe“ oder „Besorgung“. *کار داشتن* bedeutet, etwas zu erledigen zu haben. *چند* bedeutet „einige“, „ein paar“ oder „wie viele“.'
    example_gloss: Am Donnerstagnachmittag hatte ich ein paar Besorgungen.
  prs.a2.unit19.lesson01.teach.go_paradigm:
    title: 'Das einfache Präteritum: Vergangenheitsstamm plus Endungen'
    gloss: ich ging, du gingst, er/sie ging, wir gingen, Sie/ihr gingen, sie gingen
    note: 'Das einfache Präteritum ist ein System, keine Liste auswendig zu lernender Wörter. Nehmen Sie den Infinitiv *رفتن* („gehen“) und streichen Sie das letzte *ن*: Der Vergangenheitsstamm ist *رفت*. Dann kommt eine Endung dazu: *-م* für „ich“ (*رفتم*), *-ی* für „du“ (*رفتی*), keine Endung für „er/sie“ (*رفت*), *-یم* für „wir“ (*رفتیم*), *-ین* für „Sie“ bzw. „ihr“ (*رفتین*), *-ند* für „sie“ (Plural) (*رفتند*). Das Pronomen (*من، تو، او*) ist freiwillig, weil die Endung schon zeigt, wer handelt. Beachten Sie: Die Vergangenheit hat kein *می* davor, das die Gegenwart hat.'
  prs.a2.unit19.lesson02.teach.eat_paradigm:
    title: 'Gleiche Regel, neues Verb: essen'
    gloss: ich aß, du aßt, er/sie aß, wir aßen, Sie/ihr aßt, sie aßen
    note: 'Die Regel von *رفتن* gilt für fast alle Verben. *خوردن* („essen“) verliert sein *ن* und ergibt den Vergangenheitsstamm *خورد*, danach folgen dieselben sechs Endungen: *خوردم، خوردی، خورد، خوردیم، خوردین، خوردند*. Die Form für „er/sie“ ist einfach der bloße Stamm: *خورد* heißt „er/sie aß“.'
  prs.a2.unit19.lesson02.teach.breakfast:
    title: Ich habe gestern gefrühstückt
    gloss: Gestern habe ich gefrühstückt.
    note: '*صبحانه* ist das Frühstück, ein Wiederholungswort aus den Lektionen zum Tagesablauf. *خوردم* ist die Vergangenheit von *خوردن* mit der Endung *-م*.'
  prs.a2.unit19.lesson02.teach.bread_fruit:
    title: Brot und Obst
    gloss: Brot und Obst
    note: '*نان* ist das Brot und *میوه* das Obst. *و* bedeutet „und“.'
    example_gloss: Auf dem Basar habe ich Brot und Obst gekauft.
  prs.a2.unit19.lesson02.teach.more_verbs:
    title: Fünf weitere Verben, eine Regel
    gloss: sehen, kaufen, tun, werden, haben in der Vergangenheit
    note: 'Alle Verben hier folgen derselben Regel: *ن* streichen, dann die Endung anfügen. *دیدن* („sehen“) ergibt *دیدم* („ich sah“) und *دیدی* („du sahst“). *خریدن* („kaufen“) ergibt *خریدم* („ich kaufte“). *کردن* („tun, machen“) ergibt *کردم* („ich tat“) und *کردی* („du tatest“). *شدن* („werden“) ergibt *شدم* („ich wurde“). *داشتن* („haben“) ergibt *داشتم* („ich hatte“). Nur das Ende des Verbs ändert sich, nie der Stamm. Beachten Sie: *خرید* ist sowohl der Vergangenheitsstamm von *خریدن* („kaufte“) als auch das Nomen „Einkauf“, wie in *خرید کردن*.'
  prs.a2.unit19.lesson02.teach.movie:
    title: Ich habe einen Film gesehen
    gloss: Ich habe einen Film gesehen.
    note: '*فلم* ist ein Film. Im Dari sagt man *فلم دیدن*, wörtlich „einen Film sehen“, also ist *دیدم* das Verb.'
  prs.a2.unit19.lesson02.teach.exercise:
    title: Ich habe Sport gemacht
    gloss: Ich habe Sport gemacht.
    note: '*ورزش* ist Sport. *ورزش کردن* bedeutet „Sport treiben“, und die Endung kommt an *کردن*: *ورزش کردم*.'
  prs.a2.unit19.lesson02.teach.woke_late:
    title: Ich bin spät aufgewacht
    gloss: Ich bin spät aufgewacht.
    note: '*دیر* bedeutet „spät“ und *بیدار شدن* „aufwachen“. *بیدار شدم* heißt „ich bin aufgewacht“, und *دیر* steht davor.'
  prs.a2.unit19.lesson03.teach.neg_paradigm:
    title: 'Die verneinte Vergangenheit: ن plus Vergangenheitsverb'
    gloss: ich ging nicht, du gingst nicht, er/sie ging nicht, wir gingen nicht, Sie/ihr gingt nicht, sie gingen nicht
    note: 'Um zu sagen, dass Sie etwas nicht getan haben, setzen Sie *ن* ganz an den Anfang des Vergangenheitsverbs: *رفتم* („ich ging“) wird zu *نرفتم* („ich ging nicht“). Sonst ändert sich nichts, es folgen dieselben sechs Endungen: *نرفتم، نرفتی، نرفت، نرفتیم، نرفتین، نرفتند*. In der verneinten Vergangenheit gibt es kein *نمی*. Eine abgeschlossene Handlung, die nicht stattfand, ist einfach *ن* plus Vergangenheitsverb.'
  prs.a2.unit19.lesson03.teach.neg_breakfast:
    title: Ich habe nicht gefrühstückt
    gloss: Ich habe nicht gefrühstückt.
    note: '*نخوردم* ist *ن* plus *خوردم*: „ich habe nicht gegessen“.'
  prs.a2.unit19.lesson03.teach.neg_more:
    title: Dasselbe ن mit anderen Verben
    gloss: ich sah nicht, ich kaufte nicht, ich hatte nicht, ich tat nicht
    note: 'Die Regel gilt für jedes Verb, das Sie kennen: *ندیدم* („ich sah nicht“), *نخریدم* („ich kaufte nicht“), *نداشتم* („ich hatte nicht“), *نکردم* („ich tat nicht“). Immer zuerst *ن*, dann das Vergangenheitsverb. Einige Verben, die mit آ beginnen, ändern ihre Schreibung: *آمدم* („ich kam“) wird zu *نیامدم* („ich kam nicht“).'
  prs.a2.unit19.lesson03.teach.neg_compound:
    title: Verben mit کردن verneinen
    gloss: Ich habe auf dem Basar nicht eingekauft. Ich habe keinen Sport gemacht.
    note: 'Manche Verben bestehen aus einem Nomen plus *کردن*, etwa *خرید کردن* („einkaufen“) und *ورزش کردن* („Sport treiben“). Das *ن* kommt an *کردن*, nicht an das Nomen: *خرید نکردم*, *ورزش نکردم*. *نخرید کردم* zu schreiben ist falsch.'
  prs.a2.unit19.lesson03.teach.past_vs_present:
    title: Vergangenheit und Gegenwart im Vergleich
    gloss: Ich gehe zum Basar. / Ich bin zum Basar gegangen. / Ich bin nicht zum Basar gegangen.
    note: 'Die Gegenwart dieses Verbs ist *می‌روم* („ich gehe“): *می* plus Gegenwartsstamm *رو* plus Endung. Die Vergangenheit ist *رفتم*, ohne *می*. Die Gegenwart verneinen Sie mit *نمی‌روم*, die Vergangenheit aber nur mit *ن*: *نرفتم*. Benutzen Sie die Vergangenheit für eine abgeschlossene Handlung, etwa letztes Wochenende, und die Gegenwart für das, was Sie regelmäßig oder gerade tun.'
  prs.a2.unit19.lesson04.teach.first:
    title: Zuerst
    gloss: zuerst
    note: '*اول* eröffnet eine Abfolge. Es ist ein Wiederholungswort aus der Lektion über den Wochenplan.'
    example_gloss: Zuerst habe ich gefrühstückt.
  prs.a2.unit19.lesson04.teach.then:
    title: Dann, danach
    gloss: dann, danach
    note: '*بعد* setzt die Abfolge nach *اول* fort.'
    example_gloss: Dann bin ich zur Bank gegangen.
  prs.a2.unit19.lesson04.teach.but:
    title: Aber
    gloss: aber
    note: '*ولی* verbindet etwas, das Sie getan haben, mit etwas, das Sie nicht getan haben: Es stellt beides einander gegenüber.'
    example_gloss: Ich bin zum Basar gegangen, aber ich habe nicht eingekauft.
  prs.a2.unit19.lesson04.teach.no:
    title: Nein
    gloss: nein
    note: '*نخیر* ist das höfliche, alltägliche „Nein“ im Dari, mit dem man eine Ja-Nein-Frage beantwortet.'
    example_gloss: Nein, ich habe keinen Film gesehen.
  prs.a2.unit19.lesson04.teach.finally:
    title: Schließlich
    gloss: schließlich, zum Schluss
    note: '*در آخر* beschließt eine Abfolge, nach *اول* und *بعد*. Beide Wörter darin kennen Sie bereits.'
    example_gloss: Zum Schluss habe ich meine Familie besucht.
  prs.a2.unit19.lesson04.teach.home:
    title: Zuhause, Haus
    gloss: Haus, Zuhause
    note: '*خانه* ist das Haus oder Zuhause, ein Wiederholungswort aus der Lektion zum Wohnen.'
    example_gloss: Zum Schluss bin ich nach Hause gegangen.
  prs.a2.unit19.lesson04.teach.order_grammar:
    title: Ein Wochenende der Reihe nach erzählen
    gloss: Am Donnerstag bin ich zuerst zur Bank gegangen, dann habe ich auf dem Basar eingekauft, und zum Schluss bin ich nach Hause gegangen.
    note: 'Um der Reihe nach zu erzählen, was Sie getan haben, geben Sie jeder abgeschlossenen Handlung ihr eigenes Vergangenheitsverb und zeigen mit *اول، بعد، در آخر* die Reihenfolge an. Die Handlungen stehen in der Reihenfolge, in der sie geschahen: *اول به بانک رفتم، بعد در بازار خرید کردم و در آخر به خانه رفتم.* Die Teile können Sie mit Komma, Punkt oder *و* verbinden. Um etwas hinzuzufügen, was Sie nicht getan haben, verwenden Sie *ولی* und ein verneintes Vergangenheitsverb: *به بازار رفتم، ولی خرید نکردم.*'
  prs.a2.unit19.lesson05.teach.also:
    title: Auch
    gloss: auch
    note: '*هم* bedeutet „auch“ und steht nach dem Teil, den es ergänzt: *فلم هم ندیدم* heißt „Ich habe auch keinen Film gesehen“.'
    example_gloss: Ich bin auch zum Basar gegangen.
  prs.a2.unit19.lesson05.teach.my_friend:
    title: Mein Freund / meine Freundin
    gloss: mein Freund, meine Freundin
    note: '*دوست* ist ein Freund bzw. eine Freundin, und *-م* fügt „mein/meine“ hinzu: *دوستم* heißt „mein Freund“ oder „meine Freundin“.'
    example_gloss: Am Freitag habe ich meinen Freund besucht.
  prs.a2.unit19.lesson05.teach.my_friends:
    title: Meine Freunde
    gloss: meine Freunde
    note: '*دوستان* sind Freunde (der Plural von *دوست*), und *-م* fügt „mein/meine“ hinzu: *دوستانم* heißt „meine Freunde“.'
    example_gloss: Am Freitag bin ich mit meinen Freunden in den Park gegangen.
  prs.a2.unit19.lesson05.teach.with:
    title: Mit
    gloss: mit
    note: '*با* bedeutet „mit“. Es steht vor der Person: *با دوستانم* heißt „mit meinen Freunden“.'
    example_gloss: Ich bin mit meinen Freunden zum Basar gegangen.
  prs.a2.unit19.lesson05.teach.message:
    title: Eine Nachricht über das letzte Wochenende
    gloss: Am letzten Wochenende hatte ich am Donnerstagnachmittag einige Erledigungen. Zuerst bin ich zur Bank gegangen, dann habe ich auf dem Basar Brot und Obst gekauft. Am Freitag bin ich spät aufgewacht und habe gefrühstückt, dann habe ich meine Verwandten besucht. Ich habe keinen Sport gemacht und auch keinen Film gesehen.
    note: 'Ein kurzer schriftlicher Bericht über ein Wochenende, in der Reihenfolge der Ereignisse. Zwei Dinge sind nicht passiert, und jedes davon steht in einem verneinten Vergangenheitsverb: *ورزش نکردم* und *فلم ندیدم*.'
  prs.a2.unit19.lesson05.teach.exchange_q:
    title: Homayoun fragt Zarmina nach Donnerstag
    gloss: Zarmina, bist du am Donnerstag zur Bank gegangen?
    note: Homayoun fragt mit dem Vergangenheitsverb *رفتی*, der Form für „du“ (unter Freunden). Es ist eine Ja-Nein-Frage zu einer abgeschlossenen Handlung.
  prs.a2.unit19.lesson05.teach.exchange_a:
    title: Zarmina antwortet
    gloss: Nein, ich bin nicht zur Bank gegangen. Ich habe einen Film gesehen.
    note: Zarmina sagt zuerst, was nicht geschehen ist, *به بانک نرفتم*, und dann, was geschehen ist, *فلم دیدم*.
  prs.a2.unit19.lesson06.teach.turn01:
    title: Zarmina fragt nach dem letzten Wochenende
    gloss: Homayoun, was hast du am letzten Wochenende gemacht?
    note: '*چه کار کردی؟* heißt „Was hast du gemacht?“. Die Frage zielt auf eine abgeschlossene Handlung, deshalb steht die Vergangenheitsform *کردی*.'
  prs.a2.unit19.lesson06.teach.turn02:
    title: Homayoun erzählt von seinen Erledigungen und seinem Besuch
    gloss: Am Donnerstagnachmittag hatte ich einige Erledigungen. Zuerst bin ich zur Bank gegangen, dann habe ich auf dem Basar Brot und Obst gekauft. Am Freitag habe ich meine Verwandten besucht.
    note: Homayoun nennt seine Erledigungen mit *اول* und *بعد* der Reihe nach und kommt dann auf Freitag zu sprechen.
  prs.a2.unit19.lesson06.teach.turn03:
    title: Zarmina fragt nach dem Sport
    gloss: Hast du Sport gemacht?
    note: Eine Ja-Nein-Frage zu einer abgeschlossenen Handlung, mit der Vergangenheitsform *کردی*.
  prs.a2.unit19.lesson06.teach.turn04:
    title: Homayoun verneint und fragt zurück
    gloss: Nein, ich habe keinen Sport gemacht. Und du?
    note: '*نخیر، ورزش نکردم* antwortet mit der verneinten Vergangenheit. *تو چطور؟* ist eine kurze Art zu fragen: „Und du?“'
  prs.a2.unit19.lesson06.teach.turn05:
    title: Zarmina erzählt von ihrem Wochenende
    gloss: Am Donnerstag habe ich einen Film gesehen. Am Freitag bin ich mit meinen Freundinnen auf den Basar gegangen, aber ich habe nichts eingekauft.
    note: Zarmina stellt mit *ولی* gegenüber, was sie getan hat, nämlich auf den Basar zu gehen, und was sie nicht getan hat, *خرید نکردم*.
  prs.a2.unit19.lesson06.teach.turn06:
    title: Homayoun reagiert
    gloss: Wie schön!
    note: '*چه خوب!* heißt „Wie schön!“ oder „Wie gut!“, eine freundliche Reaktion auf gute Nachrichten.'
exercises:
  prs.a2.unit19.lesson01.exercise01.recognize_last_weekend:
    instruction: Was bedeutet dieser Ausdruck?
    correct_option: letztes Wochenende
    distractors:
    - dieses Wochenende
    - nächstes Wochenende
    - jedes Wochenende
    accepted_answers:
    - value: letztes Wochenende
      status: correct
    feedback: '*آخر هفتهٔ گذشته* heißt „letztes Wochenende“.'
  prs.a2.unit19.lesson01.exercise02.recognize_went_bazaar:
    instruction: Was bedeutet dieser Satz?
    correct_option: Ich bin auf den Basar gegangen
    distractors:
    - Ich werde auf den Basar gehen
    - Ich bin zur Bank gegangen
    - Ich habe auf dem Basar etwas eingekauft
    accepted_answers:
    - value: Ich bin auf den Basar gegangen
      status: correct
    feedback: '*به بازار رفتم* heißt „Ich bin auf den Basar gegangen“: der Vergangenheitsstamm *رفت* plus die Endung *-م*.'
  prs.a2.unit19.lesson01.exercise03.recognize_we_went_park:
    instruction: Was bedeutet dieser Satz?
    correct_option: Wir sind in den Park gegangen
    distractors:
    - Ich bin in den Park gegangen
    - Sie sind in den Park gegangen
    - Er ist in den Park gegangen
    accepted_answers:
    - value: Wir sind in den Park gegangen
      status: correct
    feedback: 'Die Endung *-یم* in *رفتیم* bedeutet „wir“: *ما به پارک رفتیم* heißt „Wir sind in den Park gegangen“.'
  prs.a2.unit19.lesson01.exercise04.match_go_forms:
    instruction: Ordnen Sie jedem Dari-Wort seine Bedeutung zu.
    accepted_answers:
    - value:
        رفتم: ich bin gegangen
        رفتی: du bist gegangen / du bist gefahren (zu einem Freund)
        رفت: er/sie ist gegangen
        رفتیم: wir sind gegangen
        رفتین: Sie sind gegangen / ihr seid gegangen
        رفتند: sie sind gegangen
        بازار: Basar
        بانک: Bank
        پارک: Park
      status: correct
    feedback: 'Jede Endung zeigt, wer gegangen ist: *-م* ich, *-ی* du (unter Freunden), keine Endung er oder sie, *-یم* wir, *-ین* ihr oder Sie (höflich), *-ند* sie (Plural).'
    pairs:
    - left: رفتم
      right: ich bin gegangen
    - left: رفتی
      right: du bist gegangen / du bist gefahren (zu einem Freund)
    - left: رفت
      right: er/sie ist gegangen
    - left: رفتیم
      right: wir sind gegangen
    - left: رفتین
      right: Sie sind gegangen / ihr seid gegangen
    - left: رفتند
      right: sie sind gegangen
    - left: بازار
      right: Basar
    - left: بانک
