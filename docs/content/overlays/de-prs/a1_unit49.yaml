    title: 'Wiederholung: er/sie, Waschen, Bügeln, pro Kilo, 50 Afghani, morgen, fertig'
    gloss: er/sie / Waschen / Bügeln / pro Kilo / 50 Afghani / morgen / fertig
    note: Dies sind Wiederholungswörter (aus dieser Lektion), die im Lesetext vorkommen.
    target_text: او (er/sie) / شستن (waschen) / اتو (bügeln) / به کیلو (pro Kilo) / پنجاه افغانی (50 Afghani) / فردا (morgen) / تیار (fertig)
