units:
  prs.a1.unit49.laundry:
    title: Wäscherei
    description: Sie nutzen eine Wäscherei, bitten um Waschen oder Waschen und Bügeln, fragen nach dem Preis pro Kilo und verstehen eine Abholzeit.
