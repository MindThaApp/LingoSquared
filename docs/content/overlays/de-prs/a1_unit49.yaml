    note: Das ist die Form der dritten Person im Präsens desselben Verbs, das schon als „ich möchte“ vorkam.
    example_gloss: Er/Sie möchte den Wäschedienst nutzen.
  prs.a1.unit49.lesson05.teach.reading_passage:
    title: Lesetext über die Wäscherei
    gloss: Homayoun ist in der Wäscherei. Er möchte Waschen und Bügeln. Es kostet 50 Afghani pro Kilo. Morgen ist es fertig.
