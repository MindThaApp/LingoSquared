    title: 'Wiederholung: Ihre Wäsche, wie viele, Kilo'
    gloss: Ihre Wäsche / wie viele / Kilo
    note: „Ihre Wäsche“ verwendet dasselbe Suffix wie „Ihre Miete“ in Lektion 48 und „Ihr Termin“ in Lektion 47.
    target_text: لباس شویی‌تان (Ihre Wäsche) / چند (wie viele) / کیلو (Kilo)
  prs.a1.unit49.lesson06.teach.your_laundry_question_phrase:
    title: Wie viele Kilo ist Ihre Wäsche?
    gloss: Wie viele Kilo ist Ihre Wäsche?
    note: Das ist die höfliche Form mit Suffix, um bei der Wäscheannahme nachzufragen.
