teaching:
  prs.a1.unit49.lesson01.teach.review_this_is_in:
    title: 'Wiederholung: dies, ist, in'
    gloss: dies / ist / in
    note: Dies sind Wörter zur Wiederholung (im ganzen Kurs verwendet), mit denen Sie über die Wäscherei sprechen.
    target_text: این (dieser/diese/dieses) / است (ist) / در (in)
  prs.a1.unit49.lesson01.teach.review_clothes_shop_shopkeeper:
    title: 'Wiederholung: Kleidung, Laden, Ladenbesitzer'
    gloss: Kleidung / Laden / Ladenbesitzer
    note: Kleidung ist ein Wiederholungswort aus Lektion 21; Laden und Ladenbesitzer sind Wiederholungswörter aus Lektion 10.
    target_text: لباس (Kleidung) / دوکان (Laden) / دوکاندار (Ladenbesitzer)
  prs.a1.unit49.lesson01.teach.laundry_word:
    title: Wäscherei
    gloss: Wäscherei
    note: Das Wort verbindet das Wort für Kleidung aus diesem Kurs mit dem Verbstamm für „waschen“ und ist das gebräuchliche Dari-Wort für eine Wäscherei oder einen Wäschedienst.
    example_gloss: Das ist eine Wäscherei.
  prs.a1.unit49.lesson01.teach.this_is_laundry_shop_phrase:
    title: Das ist eine Wäscherei
    gloss: Das ist eine Wäscherei.
    note: Der Satz verbindet „dies“, „Laden“ und „Wäscherei“ so, wie dieser Kurs schon zwei Nomen ohne Bindewort aneinanderfügt.
  prs.a1.unit49.lesson01.teach.shopkeeper_at_shop_phrase:
    title: Der Ladenbesitzer ist im Laden
    gloss: Der Ladenbesitzer ist im Laden.
    note: Der Satz verbindet „Ladenbesitzer“ und „Laden“.
  prs.a1.unit49.lesson02.teach.review_want_object_wash:
    title: 'Wiederholung: ich möchte, Objektmarker, damit ich wasche'
    gloss: ich möchte / (Objektmarker) / damit ich wasche
    note: „Damit ich wasche“ ist die erwartete Konjunktivform (Subjunktiv) des bereits bekannten Verbs „waschen“. Sie wird so gebildet wie alle anderen Subjunktivformen in diesem Kurs (damit ich nehme, damit ich bekomme).
    target_text: می‌خواهم (ich möchte) / را (Objektmarker) / بشویم (damit ich wasche – Konjunktiv von شستن)
  prs.a1.unit49.lesson02.teach.review_clothes_plural:
    title: 'Wiederholung: die Kleidung'
    gloss: die Kleidungsstücke
    note: Das ist der Plural von „Kleidung“, gebildet wie der Plural von „Äpfel“ in diesem Kurs.
    target_text: لباس‌ها (die Kleidung – Plural von لباس)
  prs.a1.unit49.lesson02.teach.want_to_wash_phrase:
    title: Ich möchte die Kleidung waschen
    gloss: Ich möchte die Kleidung waschen.
    note: Das ist dasselbe Muster aus „möchten“ plus Subjunktiv, das schon bei der Bibliotheksausleihe, der Terminvereinbarung und der Fahrradmiete vorkam.
  prs.a1.unit49.lesson02.teach.review_price_per_kilo_price:
    title: 'Wiederholung: sein Preis, pro, Kilo, wie viel, Afghani, dreißig'
    gloss: sein Preis / pro / Kilo / wie viel / Afghani / dreißig
    note: Dies sind Wiederholungswörter (aus Lektion 4, Lektion 10 und anderen früheren Lektionen), mit denen Sie nach dem Preis pro Kilo fragen.
    target_text: قیمتش (sein Preis) / به (pro) / کیلو (Kilo) / چند (wie viel) / افغانی (Afghani) / سی (dreißig)
  prs.a1.unit49.lesson02.teach.ask_price_per_kilo_phrase:
    title: Was kostet es pro Kilo?
    gloss: Was kostet es pro Kilo?
    note: Der Satz verbindet die Wörter, die weiter oben in dieser Lektion vorkamen.
  prs.a1.unit49.lesson02.teach.price_per_kilo_answer_phrase:
    title: Es kostet 30 Afghani pro Kilo
    gloss: Es kostet 30 Afghani pro Kilo.
    note: Der Satz nennt den Preis mit bereits bekannten Zahlen und der bekannten Währung.
  prs.a1.unit49.lesson03.teach.iron_word:
    title: Bügeln
    gloss: Bügeln
    note: Das ist das gebräuchliche Dari-Wort für das Bügeln von Kleidung, hier für den Service „Waschen und Bügeln“ einer Wäscherei.
    example_gloss: Ich bügle die Kleidung.
  prs.a1.unit49.lesson03.teach.review_wash_and:
    title: 'Wiederholung: Waschen, und'
    gloss: Waschen / und
    note: Dies sind Wiederholungswörter, mit denen die beiden Serviceoptionen benannt werden.
    target_text: شستن (waschen) / و (und)
  prs.a1.unit49.lesson03.teach.want_wash_and_iron_phrase:
    title: Ich möchte Waschen und Bügeln
    gloss: Ich möchte Waschen und Bügeln.
    note: Der Satz verbindet „Waschen“, „und“ und „Bügeln“.
  prs.a1.unit49.lesson03.teach.ready_word:
    title: Fertig
    gloss: fertig
    note: Das ist das gebräuchliche Dari-Wort für „fertig“, hier verwendet, um nach der Abholzeit zu fragen oder sie zu nennen.
    example_gloss: Es ist morgen fertig.
  prs.a1.unit49.lesson03.teach.review_when_hour_five:
    title: 'Wiederholung: wann, morgen, Uhr, fünf'
    gloss: wann / morgen / Uhr / fünf
    note: Dies sind Wiederholungswörter (aus Lektion 9, Lektion 16, Lektion 48 und früheren Lektionen), mit denen Sie nach der Abholzeit fragen und sie nennen.
    target_text: کی (wann) / فردا (morgen) / ساعت (Uhr) / پنج (fünf)
  prs.a1.unit49.lesson03.teach.ask_when_ready_phrase:
    title: Wann ist es fertig?
    gloss: Wann ist es fertig?
    note: Der Satz verbindet „wann“ und „fertig“.
  prs.a1.unit49.lesson03.teach.ready_tomorrow_five_phrase:
    title: Es ist morgen um 5 Uhr fertig
    gloss: Es ist morgen um 5 Uhr fertig.
    note: Der Satz nennt eine Abholzeit mit den bereits bekannten Wörtern für „morgen“, „Uhr“ und „fünf“.
  prs.a1.unit49.lesson04.teach.review_hello_want_wash:
    title: 'Wiederholung: hallo, ich möchte, damit ich wasche'
    gloss: hallo / ich möchte / damit ich wasche
    note: Dies sind Wiederholungswörter, mit denen der Dialog beginnt.
    target_text: سلام (Hallo) / می‌خواهم (ich möchte) / بشویم (damit ich wasche)
  prs.a1.unit49.lesson04.teach.review_welcome_wash_and_iron:
    title: 'Wiederholung: bitte sehr, Waschen, Bügeln, Sie möchten (höflich)'
    gloss: bitte sehr / Waschen / Bügeln / Sie möchten (höflich)
    note: Dies sind Wiederholungswörter, mit denen nach der Art des Services gefragt wird.
    target_text: بفرمایین (bitte sehr) / شستن (waschen) / اتو (bügeln) / می‌خواهین (Sie möchten, höflich)
  prs.a1.unit49.lesson04.teach.review_yes_price_per_kilo:
    title: 'Wiederholung: ja, pro, Kilo, wie viel, Afghani, ist'
    gloss: ja / pro / Kilo / wie viel / Afghani / ist
    note: Dies sind Wiederholungswörter, mit denen nach dem Preis gefragt wird.
    target_text: بلی (ja) / به (pro) / کیلو (Kilo) / چند (wie viel) / افغانی (Afghani) / است (ist)
  prs.a1.unit49.lesson04.teach.review_fifty_ready_tomorrow_five:
    title: 'Wiederholung: fünfzig, fertig, morgen, Uhr, fünf'
    gloss: fünfzig / fertig / morgen / Uhr / fünf
    note: Dies sind Wiederholungswörter, mit denen Preis und Abholzeit genannt werden.
    target_text: پنجاه (fünfzig) / تیار (fertig) / فردا (morgen) / ساعت (Uhr) / پنج (fünf)
  prs.a1.unit49.lesson04.teach.review_very_good_thanks_welcome:
    title: 'Wiederholung: sehr gut, vielen Dank, gern geschehen'
    gloss: sehr gut / vielen Dank / gern geschehen
    note: Dies sind Wiederholungswörter, mit denen der Dialog abgeschlossen wird.
    target_text: بسیار خوب (sehr gut) / تشکر زیاد (vielen Dank) / خواهش می‌کنم (bitte, gern geschehen)
  prs.a1.unit49.lesson04.teach.dialogue_line1:
    title: 'Homayoun: Hallo. Ich möchte die Wäsche waschen lassen.'
    gloss: Hallo. Ich möchte die Wäsche waschen lassen.
  prs.a1.unit49.lesson04.teach.dialogue_line2:
    title: 'Ladenbesitzer: Hallo, bitte sehr. Möchten Sie Waschen und Bügeln?'
    gloss: Hallo, bitte sehr. Möchten Sie Waschen und Bügeln?
  prs.a1.unit49.lesson04.teach.dialogue_line3:
    title: 'Homayoun: Ja. Was kostet es pro Kilo?'
    gloss: Ja. Was kostet es pro Kilo?
  prs.a1.unit49.lesson04.teach.dialogue_line4:
    title: 'Ladenbesitzer: Es kostet 50 Afghani pro Kilo. Morgen um 5 Uhr ist es fertig.'
    gloss: Es kostet 50 Afghani pro Kilo. Morgen um 5 Uhr ist es fertig.
  prs.a1.unit49.lesson04.teach.dialogue_line5:
    title: 'Homayoun: Sehr gut. Vielen Dank.'
    gloss: Sehr gut. Vielen Dank.
  prs.a1.unit49.lesson04.teach.dialogue_line6:
    title: 'Ladenbesitzer: Gern geschehen.'
    gloss: Gern geschehen.
  prs.a1.unit49.lesson05.teach.review_this_is_shopkeeper_in:
    title: 'Wiederholung: dies, ist, Ladenbesitzer, in'
    gloss: dies / ist / Ladenbesitzer / in
    note: Dies sind Wiederholungswörter, die im Lesetext vorkommen.
    target_text: این (dieser/diese/dieses) / است (ist) / دوکاندار (Ladenbesitzer) / در (in)
