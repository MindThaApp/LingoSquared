course:
  title: Dari A2
  description: 'Afghanisches Dari, untere Mittelstufe: sagen und fragen, was Sie schon getan oder noch nie getan haben. Das Perfekt (Partizip Perfekt plus kurze Kopula) in der Schriftform رفته‌ام und der gesprochenen Kabuler Form رفتیم, die Verneinung und der Gegensatz zum einfachen Präteritum.'
units:
  prs.a2.unit25.have_you_ever:
    title: Haben Sie schon einmal …?
lessons:
  prs.a2.unit25.lesson01.experience_words_and_perfect_forms:
    title: Wörter für Erfahrungen und die Form رفته‌ام
  prs.a2.unit25.lesson02.more_participles_and_spoken_forms:
    title: Weitere Partizipien und die gesprochenen Formen
  prs.a2.unit25.lesson03.negative_and_simple_past_contrast:
    title: Die Verneinung und das Perfekt im Gegensatz zum einfachen Präteritum
  prs.a2.unit25.lesson04.ever_never_already_yet:
    title: Je, nie, schon und noch nicht
  prs.a2.unit25.lesson05.reading_and_listening:
    title: 'Lesen und Hören: Erfahrungen'
  prs.a2.unit25.lesson06.conversation_about_experiences:
    title: Ein Gespräch über Erfahrungen
teaching:
  prs.a2.unit25.lesson01.teach.ever:
    title: Bisher, je
    gloss: bisher, bis jetzt, je
    note: '*تا حال* bedeutet „bis jetzt“. In einer Frage fragt es nach Ihrem bisherigen ganzen Leben: *آیا تا حال به هرات رفته‌ای؟* heißt „Warst du schon einmal in Herat?“ *آیا* leitet eine Ja-Nein-Frage ein.'
    example_gloss: Warst du schon einmal in Herat?
  prs.a2.unit25.lesson01.teach.herat:
    title: Herat
    gloss: Herat
    note: '*هرات* ist eine große Stadt im Westen Afghanistans, bekannt für ihre alte Zitadelle und ihre Basare.'
    example_gloss: Mein Freund kommt aus Herat.
  prs.a2.unit25.lesson01.teach.mazar:
    title: Masar-e Scharif
    gloss: Masar-e Scharif
    note: '*مزار شریف* ist die große Stadt im Norden Afghanistans, bekannt für ihren Schrein mit blauen Kacheln.'
    example_gloss: Mein Freund lebt in Masar-e Scharif.
  prs.a2.unit25.lesson01.teach.bamyan:
    title: Bamiyan
    gloss: Bamiyan
    note: '*بامیان* ist ein Tal im zentralen Hochland Afghanistans, bekannt für seine Berglandschaft.'
    example_gloss: Mein Freund war in Bamiyan.
  prs.a2.unit25.lesson01.teach.qabili:
    title: Qabili Palau
    gloss: Qabili Palau (Reis mit Fleisch, Karotten und Rosinen)
    note: '*قابلی پلو* ist Reis, der mit Fleisch, Karotten und Rosinen gekocht wird, ein beliebtes afghanisches Gericht.'
    example_gloss: Qabili Palau ist sehr gut.
  prs.a2.unit25.lesson01.teach.mantu:
    title: Mantu
    gloss: Mantu (gedämpfte Teigtaschen)
    note: '*منتو* sind gedämpfte Teigtaschen, gefüllt mit Fleisch und Zwiebeln.'
    example_gloss: Ich mag Mantu.
  prs.a2.unit25.lesson01.teach.plane:
    title: Flugzeug
    gloss: Flugzeug
    note: '*طیاره* ist das afghanische Wort für „Flugzeug“.'
    example_gloss: Das Flugzeug ist in Kabul angekommen.
  prs.a2.unit25.lesson01.teach.travel:
    title: Reisen
    gloss: reisen
    note: '*سفر کردن* heißt „reisen“. Mit *با* sagen Sie, womit man reist: *با بس سفر کردن* heißt „mit dem Bus reisen“.'
    example_gloss: Mein Freund ist mit dem Bus gereist.
  prs.a2.unit25.lesson01.teach.been_herat:
    title: Ich war in Herat
    gloss: Ich war in Herat.
    note: '*به* bedeutet „nach, zu“. Das ist der erste Satz im Perfekt in dieser Lektion: *رفته‌ام* sagt, dass Sie irgendwann in Ihrem Leben irgendwo waren, ohne zu sagen, wann.'
  prs.a2.unit25.lesson01.teach.formal_paradigm:
    title: 'Das Perfekt, Schriftform: Partizip plus Endung'
    gloss: ich bin gewesen/gegangen, du bist gewesen/gegangen, er/sie ist gewesen/gegangen, wir sind gewesen/gegangen, ihr/Sie seid/sind gewesen/gegangen, sie sind gewesen/gegangen
    note: 'Das Perfekt sagt, was Sie bis jetzt in Ihrem Leben getan oder nicht getan haben, ohne zu sagen, wann. Es hat zwei Teile. Zuerst das Partizip: Nehmen Sie den Präteritumstamm und fügen Sie *ه* an. Der Präteritumstamm von *رفتن* (gehen) ist *رفت*, das Partizip also *رفته*. Dann folgt eine kurze Endung, die zur Person passt: *رفته‌ام* (ich bin gegangen), *رفته‌ای* (du, zu einem Freund), *رفته است* (er oder sie ist gegangen), *رفته‌ایم* (wir), *رفته‌این* (ihr/Sie, förmlich oder Plural; *رفته‌اید* wird auch akzeptiert), *رفته‌اند* (sie). In der Schrift werden die Endungen mit einem Halbleerraum ans Partizip angeschlossen. Das Pronomen (*من، تو، او*) ist optional, weil die Endung die Person schon zeigt. Das ist die förmliche Schriftform, der Sie in Briefen, Nachrichten und Büchern begegnen.'
  prs.a2.unit25.lesson01.teach.spoken_paradigm:
    title: Das Perfekt, gesprochene Kabuler Form
    gloss: ich bin gewesen/gegangen, du bist gewesen/gegangen, er/sie ist gewesen/gegangen, wir sind gewesen/gegangen, ihr/Sie seid/sind gewesen/gegangen, sie sind gewesen/gegangen
    note: 'In der Alltagssprache von Kabul verschmelzen Partizip und Endung zu einem kurzen Wort, das vom Präteritumstamm gebildet wird: *رفتیم* (ich bin gegangen), *رفتی* (du, zu einem Freund), *رفته* (er oder sie), *رفتیم* (wir), *رفتین* (ihr), *رفتن* (sie). Die 3. Person Singular ist einfach das bloße Partizip *رفته*. Achten Sie auf die 1. Person: Das gesprochene *رفتیم* (ich bin gegangen) ist nicht das einfache Präteritum *رفتم* (ich ging); es endet auf *-یم* und wird genauso geschrieben wie der Plural *رفتیم* (wir sind gegangen). Der Kontext zeigt den Unterschied: *تا حال، هرگز، هنوز، قبلا* und eine Erfahrungsfrage weisen auf das Perfekt hin (*تا حال رفتیم* = ich war bisher dort), eine genannte Zeit wie *پارسال* oder *دیروز* dagegen auf das einfache Präteritum (*پارسال رفتم*). Die förmlichen angehängten Formen (*رفته‌ام*) werden weiterhin gelehrt, und dieser Kurs akzeptiert in jeder Antwort beide: Benutzen Sie die angehängten Formen beim förmlichen Schreiben oder Sprechen und die verkürzten gesprochenen Formen mit Freunden und Familie. Die Endung für „ihr/Sie“ ist in beiden *-ین*: *رفته‌این* und *رفتین*.'
  prs.a2.unit25.lesson02.teach.participle_rule:
    title: 'Das Partizip Perfekt: Präteritumstamm plus ه'
    gloss: gegangen, gegessen, gesehen, gekocht, getan
    note: 'Eine Regel bildet das Partizip fast jedes Verbs: Gehen Sie vom Infinitiv aus, streichen Sie *ن*, um den Präteritumstamm zu erhalten, und fügen Sie *ه* an. *رفتن* ergibt *رفت* und dann *رفته* (gegangen, gewesen). *خوردن* ergibt *خورد* und *خورده* (gegessen). *دیدن* ergibt *دید* und *دیده* (gesehen). *پختن* ergibt *پخت* und *پخته* (gekocht). *کردن* ergibt *کرد* und *کرده* (getan, gemacht). Das Partizip verändert sich nie nach der Person; nur die Endung dahinter ändert sich.'
  prs.a2.unit25.lesson02.teach.eat_paradigm:
    title: 'Gleiche Endungen, neues Verb: essen'
    gloss: ich habe gegessen, du hast gegessen, er/sie hat gegessen, wir haben gegessen, ihr/Sie habt/haben gegessen, sie haben gegessen
    note: 'Die Endungen, die Sie bei *رفته* gelernt haben, passen zu jedem Partizip: *خورده‌ام، خورده‌ای، خورده است، خورده‌ایم، خورده‌این، خورده‌اند*. In der gesprochenen Sprache verschmilzt dasselbe Partizip: *خوردیم، خوردی، خورده، خوردیم، خوردین، خوردن*. Um zu sagen, dass Sie einen Film gesehen haben, können Sie also *فلم دیده‌ام* schreiben oder *فلم دیدیم* sagen.'
  prs.a2.unit25.lesson02.teach.spoken_more:
    title: Gesprochene Formen derselben Verben
    gloss: ich habe gegessen, du hast gegessen, er/sie hat gegessen, ihr habt/Sie haben gegessen, sie haben gegessen; ich habe gesehen, du hast gesehen; ich habe gekocht, du hast gekocht; ich habe getan, du hast getan
    note: 'Die gesprochenen Formen funktionieren bei jedem Verb gleich: Nehmen Sie den Präteritumstamm und fügen Sie die Endung an. *خورد* ergibt *خوردیم، خوردی، خورده، خوردین، خوردن*; *دید* ergibt *دیدیم، دیدی*; *پخت* ergibt *پختیم، پختی*; *کرد* ergibt *کردیم، کردی*. Denken Sie daran: Das gesprochene *خوردیم* (ich habe gegessen) ist nicht das einfache Präteritum *خوردم* (ich aß); ein Wort wie *تا حال* oder *هرگز* oder das Fehlen einer Zeitangabe zeigt das Perfekt.'
  prs.a2.unit25.lesson02.teach.movie:
    title: Film
    gloss: Film
    note: '*فلم* ist das afghanische Wort für „Film“. Einen Film sieht man mit dem Verb *دیدن*: *فلم دیدن* heißt „einen Film ansehen“.'
    example_gloss: Gestern Abend habe ich einen Film gesehen.
  prs.a2.unit25.lesson02.teach.kebab:
    title: Kebab
    gloss: Kebab, gegrilltes Fleisch
    note: '*کباب* ist gegrilltes Fleisch, eines der häufigsten Gerichte, die Sie in Afghanistan probieren können.'
    example_gloss: Gestern habe ich Kebab gegessen.
  prs.a2.unit25.lesson02.teach.mantu_qabili:
    title: Ich habe Mantu und Qabili Palau gegessen
    gloss: Ich habe Mantu und Qabili Palau gegessen.
    note: '*و* bedeutet „und“. Ein einziges Partizip am Ende, *خورده‌ام*, gilt für beide Gerichte.'
  prs.a2.unit25.lesson02.teach.seen_herat:
    title: Ich habe Herat gesehen
    gloss: Ich habe Herat gesehen.
    note: '*را* steht nach einem bestimmten Ding, etwa dem Namen einer Stadt, das die Handlung erfährt: *هرات را* ist die Stadt Herat. *دیده‌ام* ist das Partizip von *دیدن* plus *-ام*.'
  prs.a2.unit25.lesson02.teach.cooked:
    title: Ich habe Qabili Palau gekocht
    gloss: Ich habe Qabili Palau gekocht.
    note: '*پخته‌ام* ist das Partizip von *پختن* (kochen) plus *-ام*. In der gesprochenen Sprache: *قابلی پلو پختیم*.'
  prs.a2.unit25.lesson03.teach.last_year:
    title: Letztes Jahr
    gloss: letztes Jahr
    note: '*پارسال* heißt „letztes Jahr“. Ein solches Wort legt das Ereignis auf einen bestimmten Zeitpunkt fest, deshalb steht danach das einfache Präteritum und nicht das Perfekt.'
    example_gloss: Letztes Jahr bin ich nach Kabul gefahren.
  prs.a2.unit25.lesson03.teach.two_years_ago:
    title: Vor zwei Jahren
    gloss: vor zwei Jahren
    note: '*پیش* nach einer Zeitangabe bedeutet „vor“: *دو سال پیش* heißt „vor zwei Jahren“. Auch dies ist ein Zeitwort, nach dem das einfache Präteritum steht.'
    example_gloss: Vor zwei Jahren bin ich nach Masar-e Scharif gefahren.
  prs.a2.unit25.lesson03.teach.never:
    title: Nie
    gloss: nie, niemals
    note: '*هرگز* bedeutet „nie“. Es steht mit einem verneinten Verb, der Satz verneint also weiterhin mit *ن*: *به بامیان هرگز نرفته‌ام* heißt „Ich war noch nie in Bamiyan“.'
    example_gloss: Ich war noch nie in Bamiyan.
  prs.a2.unit25.lesson03.teach.never_alt:
    title: Nie (ein anderes Wort)
    gloss: nie, zu keiner Zeit
    note: '*هیچ‌وقت* bedeutet hier dasselbe wie *هرگز* und braucht ebenfalls ein verneintes Verb: *هیچ‌وقت فلم ندیده‌ام* heißt „Ich habe noch nie einen Film gesehen“. Es ist etwas alltäglicher als *هرگز*.'
    example_gloss: Ich war noch nie in Bamiyan.
  prs.a2.unit25.lesson03.teach.neg_formal:
    title: 'Die Verneinung: ن am Partizip'
    gloss: ich bin nicht gegangen/gewesen, du bist nicht gegangen/gewesen, er/sie ist nicht gegangen/gewesen, wir sind nicht gegangen/gewesen, ihr/Sie seid/sind nicht gegangen/gewesen, sie sind nicht gegangen/gewesen
    note: 'Um zu sagen, dass Sie etwas nicht getan haben, setzen Sie *ن* vor das Partizip und behalten dieselben Endungen: Aus *رفته‌ام* (ich war) wird *نرفته‌ام* (ich war nicht). Die ganze Reihe lautet *نرفته‌ام، نرفته‌ای، نرفته است، نرفته‌ایم، نرفته‌این، نرفته‌اند*. Das *ن* gehört zum Partizip, nie zur Endung.'
  prs.a2.unit25.lesson03.teach.neg_spoken:
    title: Die Verneinung in der gesprochenen Form
    gloss: ich bin nicht gegangen/gewesen, du bist nicht gegangen/gewesen, er/sie ist nicht gegangen/gewesen, wir sind nicht gegangen/gewesen, ihr/Sie seid/sind nicht gegangen/gewesen, sie sind nicht gegangen/gewesen
    note: 'Die gesprochene Verneinung funktioniert genauso: *ن* steht an der verkürzten Form: *نرفتیم، نرفتی، نرفته، نرفتیم، نرفتین، نرفتن*. Sowohl *نرفته‌ام* als auch *نرفتیم* sind richtig und bedeuten „ich war nicht dort“. Verwechseln Sie das gesprochene *نرفتیم* (ich war noch nicht dort) nicht mit der Verneinung im einfachen Präteritum *نرفتم* (ich ging nicht): Eine genannte Zeit wie *دیروز* steht mit *نرفتم*.'
  prs.a2.unit25.lesson03.teach.neg_more:
    title: Dasselbe ن bei anderen Verben
    gloss: ich habe nicht gegessen, ich habe nicht gesehen, ich habe nicht gekocht, ich habe nicht getan
    note: 'Die Regel gilt für jedes Verb: *نخورده‌ام* (ich habe nicht gegessen), *ندیده‌ام* (ich habe nicht gesehen), *نپخته‌ام* (ich habe nicht gekocht), *نکرده‌ام* (ich habe nicht getan). Bei Verben aus einem Wort plus *کردن* steht das *ن* an *کرده*: *سفر نکرده‌ام* (ich bin nicht gereist), niemals *نسفر کرده‌ام*. Gesprochen: *نخوردیم، ندیدیم، نپختیم، نکردیم*.'
  prs.a2.unit25.lesson03.teach.contrast:
    title: Perfekt oder einfaches Präteritum?
    gloss: Letztes Jahr bin ich nach Herat gefahren. / Ich war schon in Herat. / Ich fahre nach Herat.
    note: 'Verwenden Sie das einfache Präteritum, wenn Sie sagen, wann etwas geschah: *پارسال به هرات رفتم* (letztes Jahr bin ich nach Herat gefahren) oder *دو سال پیش رفتم*. Verwenden Sie das Perfekt, wenn die Zeit nicht genannt wird und Sie nur sagen, dass es zu Ihrer Erfahrung gehört: *به هرات رفته‌ام* (ich war schon in Herat). Das Präsens ist wieder etwas anderes: *به هرات می‌روم* (ich fahre nach Herat). Ein Zeitwort wie *پارسال* oder *دیروز* steht also mit *رفتم*, während *تا حال* und *هرگز* mit *رفته‌ام* und *نرفته‌ام* stehen.'
  prs.a2.unit25.lesson04.teach.already:
    title: Schon, früher
    gloss: schon, bereits, früher
    note: '*قبلا* bedeutet „vorher“ oder „schon“. Es steht mit einem bejahten Perfekt: *قبلا به هرات رفته‌ام* heißt „Ich war schon einmal in Herat“.'
    example_gloss: Ich war schon einmal in Herat.
  prs.a2.unit25.lesson04.teach.not_yet:
    title: Noch nicht, noch
    gloss: noch, noch nicht
    note: '*هنوز* mit einem verneinten Perfekt bedeutet „noch nicht“: *هنوز به هرات نرفته‌ام* heißt „Ich war noch nicht in Herat“.'
    example_gloss: Ich war noch nicht in Herat.
  prs.a2.unit25.lesson04.teach.times:
    title: Einmal, zweimal
    gloss: einmal, zweimal
    note: '*بار* bedeutet „Mal“. *یک بار* heißt „einmal“ und *دو بار* „zweimal“. Die Zahl steht vor *بار*, und der Satz steht weiterhin im Perfekt.'
    example_gloss:
    - Ich war zweimal in Masar-e Scharif.
    - Ich bin einmal mit dem Flugzeug gereist.
  prs.a2.unit25.lesson04.teach.how_many:
    title: Wie oft warst du dort?
    gloss: Wie oft warst du in Masar-e Scharif?
    note: '*چند* bedeutet „wie viele“. *چند بار* fragt „wie oft“, und die Antwort ist eine Zahl plus *بار*: *دو بار*.'
  prs.a2.unit25.lesson04.teach.yes_no:
    title: Ja, nein
    gloss: ja, nein
    note: '*بلی* heißt „ja“, *نخیر* ist das höfliche, alltägliche „nein“. Eine kurze Antwort wiederholt das Partizip: *بلی، رفته‌ام* oder *نخیر، نرفته‌ام*.'
    example_gloss:
    - Ja, ich war in Herat.
    - Nein, ich war noch nicht in Herat.
  prs.a2.unit25.lesson04.teach.but:
    title: Aber
    gloss: aber
    note: '*ولی* verbindet etwas, das man getan hat, mit etwas, das man nicht getan hat: *به مزار شریف رفته‌ام، ولی به هرات نرفته‌ام*.'
    example_gloss: Ich war in Masar-e Scharif, aber ich war noch nicht in Herat.
  prs.a2.unit25.lesson04.teach.qa:
    title: Nach Erfahrungen fragen und antworten
    gloss: Warst du schon einmal in Herat? Ja, war ich. Nein, noch nie.
    note: 'Um zu fragen, ob jemand etwas schon einmal getan hat, verwendet man *آیا* und *تا حال* mit dem Perfekt: *آیا تا حال به هرات رفته‌ای؟* Mit Freunden kann man auch die gesprochene Form benutzen: *آیا تا حال به هرات رفتی؟* Antworten Sie mit *بلی* und dem Partizip (*بلی، رفته‌ام*) oder mit *نخیر* und der Verneinung (*نخیر، تا حال نرفته‌ام*). Sie können auch sagen, wie oft: *بلی، دو بار رفته‌ام*. Das Fragewort *آیا* kann man in der gesprochenen Sprache weglassen, wenn die Frage an der Stimme erkennbar ist.'
  prs.a2.unit25.lesson04.teach.adverbs:
    title: Schon, noch nicht, nie
    gloss: Ich war schon dort. Ich war noch nicht dort. Ich war noch nie dort.
    note: 'Drei kleine Wörter beantworten die Frage, ob man etwas schon getan hat. *قبلا رفته‌ام* heißt „Ich war schon dort“. *هنوز نرفته‌ام* heißt „Ich war noch nicht dort“ und deutet an, dass man vielleicht noch hingeht. *هرگز نرفته‌ام* heißt „Ich war noch nie dort“, ohne diese Andeutung. *قبلا* steht mit einem bejahten Partizip; *هنوز* und *هرگز* stehen mit einem verneinten Partizip. Alle drei stehen vor dem Partizip, meist nach dem Ort: *به هرات هنوز نرفته‌ام*. Die gesprochenen Formen funktionieren genauso: *هنوز نرفتیم*.'
  prs.a2.unit25.lesson05.teach.also:
    title: Auch
    gloss: auch
    note: '*هم* bedeutet „auch“. Es steht direkt hinter dem Wort, das hinzukommt: *قابلی پلو هم پخته‌ام* heißt „Ich habe auch Qabili Palau gekocht“.'
    example_gloss: Ich habe auch Qabili Palau gekocht.
  prs.a2.unit25.lesson05.teach.profile:
    title: Zarmina schreibt über ihre Erfahrungen
    gloss: Ich bin Zarmina. Bisher war ich in Herat und Masar-e Scharif, aber noch nicht in Bamian. Ich habe Mantu und Qabili Palau gegessen. Qabili Palau habe ich auch gekocht. Ich bin noch nicht mit dem Flugzeug gereist.
    note: 'Ein kurzes schriftliches Profil in der förmlichen Schriftsprache. Vier Dinge hat sie getan, zwei nicht: *به بامیان نرفته‌ام* und *با طیاره سفر نکرده‌ام*.'
  prs.a2.unit25.lesson05.teach.ex_q:
    title: Homayoun fragt Zarmina nach dem Fliegen
    gloss: Zarmina, bist du schon einmal mit dem Flugzeug gereist?
    note: Homayoun verwendet mit einer Freundin die gesprochene Form *سفر کردی*. Die Frage beginnt mit *آیا تا حال*.
  prs.a2.unit25.lesson05.teach.ex_a:
    title: Zarmina sagt, dass sie es noch nie getan hat
    gloss: Nein, ich bin noch nie mit dem Flugzeug gereist. Und du?
    note: '*هرگز* steht vor dem verneinten Partizip *نکردیم*. *تو چطور؟* ist eine kurze Art zu fragen: „Und du?“'
  prs.a2.unit25.lesson05.teach.ex_a2:
    title: 'Homayoun antwortet: einmal'
    gloss: Ja, ich bin einmal gereist.
    note: '*بلی* antwortet mit „ja“, und *یک بار* sagt, wie oft. Der Ort wird weggelassen, weil er aus der Frage klar ist.'
  prs.a2.unit25.lesson06.teach.turn01:
    title: Zarmina fragt Homayoun nach Masar-e Scharif
    gloss: Homayoun, warst du schon einmal in Masar-e Scharif?
    note: Zarmina verwendet mit einem Freund die gesprochene Form *رفتی*. Die Frage beginnt mit *آیا تا حال*.
  prs.a2.unit25.lesson06.teach.turn02:
    title: 'Homayoun sagt: zweimal, aber noch nicht in Herat'
    gloss: Ja, ich war zweimal dort. Aber in Herat war ich noch nicht. Und du?
    note: '*دو بار* sagt, wie oft. *ولی هنوز به هرات نرفتیم* stellt einen Ort, an dem er noch nicht war, dem gegenüber, an dem er schon war.'
  prs.a2.unit25.lesson06.teach.turn03:
    title: Zarmina erzählt von Herat und Bamian
    gloss: Ich war einmal in Herat, aber in Bamian war ich noch nie.
    note: '*یک بار* heißt „einmal“, und *به بامیان هرگز نرفتیم* heißt „nie“. *هرگز* steht mit dem verneinten Partizip.'
  prs.a2.unit25.lesson06.teach.turn04:
    title: Homayoun fragt nach dem Kochen
    gloss: Hast du schon einmal Qabili Palau gekocht?
    note: Eine Ja-Nein-Frage nach Erfahrung, mit *تا حال* und dem gesprochenen *پختی*.
  prs.a2.unit25.lesson06.teach.turn05:
    title: Zarmina hat es schon gekocht
    gloss: Ja, das habe ich schon gekocht. Und du?
    note: '*قبلا پختیم* heißt „Ich habe es schon gekocht“. Das Gericht wird weggelassen, weil beide Sprecher es kennen.'
  prs.a2.unit25.lesson06.teach.turn06:
    title: Homayoun hat es noch nicht gekocht
    gloss: Nein, das habe ich noch nicht gekocht. Aber ich habe es gegessen.
    note: '*هنوز نپختیم* heißt „noch nicht“, mit *ن* am Partizip. *ولی خوردیم* ergänzt, was er getan hat.'
  prs.a2.unit25.lesson06.teach.turn07:
    title: Zarmina reagiert
    gloss: Wie schön!
    note: '*چه خوب!* ist eine freundliche Reaktion auf gute Neuigkeiten.'
exercises:
