teaching:
  prs.a1.unit15.lesson01.teach.in_word:
    title: Dies
    gloss: dies
    note: این bedeutet „dies“.
    example_gloss: Dies ist größer.
  prs.a1.unit15.lesson01.teach.aan_word:
    title: Das
    gloss: das
    note: آن bedeutet „das“. In diesem Kurs wird die volle Form آن verwendet, nicht das umgangssprachliche iranische اون.
    example_gloss: Das ist kleiner.
  prs.a1.unit15.lesson01.teach.bozorgtar_ast_word:
    title: Es ist größer
    gloss: es ist größer
    note: 'بزرگ‌تر است ist die volle, nicht zusammengezogene Form (es ist größer): *بزرگ‌تر* ist der Komparativ von *بزرگ* (groß), und *است* bleibt ein eigenes Wort.'
    example_gloss: Dies ist größer als das.
  prs.a1.unit15.lesson01.teach.koochaktar_ast_word:
    title: Es ist kleiner
    gloss: es ist kleiner
    note: کوچک‌تر است ist die volle Form (es ist kleiner). کوچک ist die dari Standardschreibung (nicht das umgangssprachliche iranische کوچیک).
    example_gloss: Das ist kleiner als dies.
  prs.a1.unit15.lesson01.teach.az_word:
    title: Als
    gloss: als
    note: 'از kennzeichnet den Vergleichspunkt: X از Y بزرگ‌تر است bedeutet „X ist größer als Y“.'
    target_text: از (als)
  prs.a1.unit15.lesson02.teach.gerantar_ast_word:
    title: Es ist teurer
    gloss: es ist teurer
    note: گران‌تر است ist die volle Form (es ist teurer). گران ist die dari Standardschreibung (nicht das umgangssprachliche iranische گرون).
    example_gloss: Dies ist teurer als das.
  prs.a1.unit15.lesson02.teach.arzantar_ast_word:
    title: Es ist billiger
    gloss: es ist billiger
    note: ارزان‌تر است ist die volle Form (es ist billiger). ارزان ist die dari Standardschreibung (nicht das umgangssprachliche iranische ارزون).
    example_gloss: Das ist billiger als dies.
  prs.a1.unit15.lesson03.teach.names:
    title: Karim und Negar
    gloss: Karim, Negar
    note: Häufige afghanische Namen, die in diesem Kurs immer wieder vorkommen.
    example_gloss:
    - Ich bin Karim.
    - Ich bin Negar.
  prs.a1.unit15.lesson03.teach.ghad_bolandtar_phrase:
    title: Größer
    gloss: größer / er/sie ist größer
    note: '*قد بلندتر است* bedeutet wörtlich „die Größe ist höher“: *قد* (Körpergröße), *بلندتر* (größer bzw. höher, Komparativ von *بلند*, groß/hoch), *است* (ist).'
  prs.a1.unit15.lesson03.teach.javantar_ast_word:
    title: Jünger
    gloss: jünger / er/sie ist jünger
    note: جوان‌تر است ist die volle Form (er/sie ist jünger). جوان ist die dari Standardschreibung (nicht das umgangssprachliche iranische جوون).
    example_gloss: Negar ist jünger als Karim.
  prs.a1.unit15.lesson04.teach.behtar_ast_word:
    title: Es ist besser
    gloss: es ist besser
    note: بهتر است ist die volle Form. بهتر (besser) ist der unregelmäßige Komparativ von خوب (gut).
    example_gloss: Dies ist besser als das.
  prs.a1.unit15.lesson04.teach.badtar_ast_word:
    title: Es ist schlechter
    gloss: es ist schlechter
    note: بدتر است ist die volle Form. بدتر (schlechter) ist der unregelmäßige Komparativ von بد (schlecht).
    example_gloss: Das ist schlechter als dies.
  prs.a1.unit15.lesson04.teach.choon_word:
    title: Weil
    gloss: weil
    note: چون leitet eine Begründung ein.
    target_text: چون (weil)
  prs.a1.unit15.lesson04.teach.va_word:
    title: Und
    gloss: und
    note: و bedeutet „und“ und verbindet zwei Sätze oder Satzteile.
    target_text: و (und)
  prs.a1.unit15.lesson05.teach.reading_text:
    title: Beispieltext zu einem Vergleich
    gloss: Karim ist größer als Negar. Negar ist jünger als Karim.
    note: Ein kurzer Vergleich in der dritten Person, der den Wortschatz dieser Lektion verbindet.
  prs.a1.unit15.lesson06.teach.names:
    title: Karim und Negar
    gloss: Karim, Negar
    example_gloss:
    - Karim ist größer.
    - Negar ist jünger.
  prs.a1.unit15.lesson06.teach.ama_word:
    title: Aber
    gloss: aber
    note: اما bedeutet „aber“ und leitet einen Gegensatz ein.
    target_text: اما (aber)
  prs.a1.unit15.lesson06.teach.bali_word:
    title: Ja
    gloss: ja
    note: بلی ist das höfliche, förmliche Wort für „ja“ und passt zum Sprachniveau dieses Kurses.
    example_gloss: Ja, dies ist teurer.
  prs.a1.unit15.lesson06.teach.dialogue_line1:
    title: Karim sagt
    gloss: Dies ist teurer als das, aber es ist besser.
  prs.a1.unit15.lesson06.teach.dialogue_line2:
    title: Negar antwortet
    gloss: Ja, aber das ist billiger.
