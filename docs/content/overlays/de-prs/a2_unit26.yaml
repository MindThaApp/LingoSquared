    - value: وقتی به دفتر رسیدم، دفتر بسته شده بود.
      status: correct
    - value: وقتی به دفتر رسیدم دفتر بسته شده بود.
      status: correct
    - value: وقتی به دفتر رسیدم، دفتر از قبل بسته شده بود.
