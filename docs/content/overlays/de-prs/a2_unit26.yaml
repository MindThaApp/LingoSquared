course:
  title: Dari A2
  description: 'Afghanisches Dari für Fortgeschrittene (untere Mittelstufe): Sie sagen, dass etwas vor einem bestimmten Zeitpunkt in der Vergangenheit schon geschehen war, zum Beispiel dass der Bus abgefahren war, bevor Sie ankamen. Das Plusquamperfekt (Partizip plus Vergangenheit von بودن), seine Verneinung und der Unterschied zur einfachen Vergangenheit.'
units:
  prs.a2.unit26.already_happened:
    title: Es war schon geschehen
lessons:
  prs.a2.unit26.lesson01.form_and_travel_words:
    title: Die Form „war gegangen“ und Reisewörter
  prs.a2.unit26.lesson02.more_verbs_with_bud:
    title: Weitere Verben im Plusquamperfekt
  prs.a2.unit26.lesson03.earlier_and_later:
    title: Das frühere und das spätere Ereignis
  prs.a2.unit26.lesson04.time_words:
    title: Schon, vorher, noch nicht
  prs.a2.unit26.lesson05.reading_and_listening:
    title: 'Lesen und Hören: zu spät ankommen'
  prs.a2.unit26.lesson06.airport_conversation:
    title: Ein Gespräch über ein verpasstes Flugzeug
teaching:
  prs.a2.unit26.lesson01.teach.bus:
    title: Bus
    gloss: Bus
    note: '*بس* ist der Bus, das übliche Verkehrsmittel zwischen den Städten in Afghanistan. Das Wort kennen Sie schon aus der Einheit über Verkehrsmittel.'
    example_gloss: Der Bus fährt nach Masar.
  prs.a2.unit26.lesson01.teach.station:
    title: Bahnhof
    gloss: Bahnhof, Haltestelle
    note: '*ایستگاه* ist eine Station oder eine Haltestelle. *ایستگاه بس* ist der Busbahnhof.'
    example_gloss: Der Busbahnhof ist in Kabul.
  prs.a2.unit26.lesson01.teach.plane:
    title: Flugzeug
    gloss: Flugzeug
    note: '*طیاره* ist das afghanische Wort für Flugzeug.'
    example_gloss: Das Flugzeug kommt nach Kabul.
  prs.a2.unit26.lesson01.teach.airport:
    title: Flughafen
    gloss: Flughafen
    note: '*میدان هوایی* ist der Flughafen. Flugzeuge starten vom *میدان هوایی*, und Busse fahren vom *ایستگاه* ab.'
    example_gloss: Der Flughafen ist in Kabul.
  prs.a2.unit26.lesson01.teach.car:
    title: Auto
    gloss: Auto
    note: '*موتر* ist das afghanische Wort für Auto. Mit der Endung *-م* sagen Sie „mein Auto“: *موترم*.'
    example_gloss: Mein Auto ist neu.
  prs.a2.unit26.lesson01.teach.arrive:
    title: Ankommen
    gloss: ankommen, erreichen
    note: '*رسیدن* heißt ankommen. Wo Sie ankommen, sagen Sie mit *به*: *به ایستگاه رسیدم* heißt „Ich kam am Bahnhof an“. Der Vergangenheitsstamm ist *رسید*, daraus ergibt sich *رسیدم، رسیدی، رسید، رسیدیم*.'
    example_gloss: Wir kamen am Bahnhof an.
  prs.a2.unit26.lesson01.teach.return:
    title: Zurückgehen
    gloss: zurückkehren, zurückgehen
    note: '*برگشتن* heißt zurückgehen oder zurückkehren. Der Vergangenheitsstamm ist *برگشت*: *برگشتم* heißt „Ich bin zurückgegangen“.'
    example_gloss: Gestern bin ich nach Hause zurückgekehrt.
  prs.a2.unit26.lesson01.teach.passport:
    title: Reisepass
    gloss: Pass
    note: '*پاسپورت* ist der Pass. Mit *-م* sagen Sie „mein“: *پاسپورتم*.'
    example_gloss: Mein Pass ist zu Hause.
  prs.a2.unit26.lesson01.teach.key:
    title: Schlüssel
    gloss: Schlüssel
    note: '*کلید* ist ein Schlüssel. *کلیدم* ist mein Schlüssel.'
    example_gloss: Mein Schlüssel ist zu Hause.
  prs.a2.unit26.lesson01.teach.phone:
    title: Telefon
    gloss: Telefon, Handy
    note: '*تیلفون* ist das Telefon. *تیلفونم* ist mein Telefon. *تیلفون کردن* heißt telefonieren, anrufen.'
    example_gloss: Mein Telefon ist neu.
  prs.a2.unit26.lesson01.teach.lose:
    title: Verlieren
    gloss: verlieren, verlegen
    note: '*گم کردن* heißt etwas verlieren. *گم* bedeutet verloren, und *کردن* ist das Verb „tun, machen“. Das Verlorene steht mit *را* davor, wie in *کلیدم را گم کردم* (Ich habe meinen Schlüssel verloren).'
    example_gloss: Gestern habe ich meinen Schlüssel verloren.
  prs.a2.unit26.lesson01.teach.when:
    title: Wann
    gloss: als, wenn, zu dem Zeitpunkt, als
    note: '*وقتی* leitet einen Nebensatz ein, der einen Zeitpunkt angibt, hier in der Vergangenheit: *وقتی رسیدم* heißt „als ich ankam“. Dieser Satz ist der Bezugspunkt der ganzen Einheit.'
    example_gloss: Als ich nach Hause kam, habe ich gefrühstückt.
  prs.a2.unit26.lesson01.teach.participle:
    title: 'Das Partizip der Vergangenheit: Vergangenheitsstamm plus ه'
    gloss: gegangen, gegessen, gesehen, angekommen, gekommen, getan, geworden (die Partizipien)
    note: 'Das Plusquamperfekt wird aus einem Partizip der Vergangenheit gebildet, das lernen Sie also zuerst. Streichen Sie vom Infinitiv das letzte *ن*, dann haben Sie den Vergangenheitsstamm, und hängen Sie *ه* an: *رفتن* hat den Stamm *رفت*, das Partizip ist also *رفته*. Dieselbe Regel ergibt *خوردن* zu *خورده*, *دیدن* zu *دیده*, *رسیدن* zu *رسیده*, *آمدن* zu *آمده*, *کردن* zu *کرده*, *شدن* zu *شده*. Das Partizip ändert sich nie nach der Person: Es ist gleich für ich, du, er und sie. Es ist auch der Teil von *رفته‌ام* (ich bin gegangen), den Sie in der Einheit über Lebenserfahrungen kennenlernen; in dieser Einheit steht es nur mit der Vergangenheit von *بودن*.'
  prs.a2.unit26.lesson01.teach.paradigm:
    title: 'Das Plusquamperfekt: Partizip plus Vergangenheit von بودن'
    gloss: ich war gegangen, du warst gegangen, er/sie/es war gegangen, wir waren gegangen, Sie waren gegangen (höflich) / ihr wart gegangen, sie waren gegangen
    note: 'Das Plusquamperfekt sagt, dass etwas vor einem anderen Zeitpunkt in der Vergangenheit schon geschehen war. Es besteht aus dem Partizip plus der Vergangenheit von *بودن* (sein): *بودم، بودی، بود، بودیم، بودین، بودند*. So ist *رفته بودم* „ich war gegangen“, *رفته بودی* „du warst gegangen“ (zu einem Freund), *رفته بود* „er, sie oder es war gegangen“ (das bloße *بود* hat keine Endung), *رفته بودیم* „wir waren gegangen“, *رفته بودین* „Sie waren / ihr wart gegangen“ (höflich oder Plural), *رفته بودند* „sie waren gegangen“. Das Pronomen ist freiwillig, weil die Endung schon zeigt, wer gemeint ist. Das Partizip und *بود-* werden getrennt geschrieben.'
  prs.a2.unit26.lesson01.teach.sentence:
    title: Als ich am Bahnhof ankam, war der Bus abgefahren
    gloss: Als ich am Bahnhof ankam, war der Bus schon abgefahren.
    note: 'Das ist das Muster der ganzen Einheit. *وقتی به ایستگاه رسیدم* ist der Moment Ihrer Ankunft (einfache Vergangenheit). *بس رفته بود* ist das, was davor schon geschehen war (Plusquamperfekt): Zuerst fuhr der Bus ab, danach kamen Sie an.'
  prs.a2.unit26.lesson02.teach.more_participles:
    title: Eine Regel für alle Verben
    gloss: ich hatte gegessen, du hattest gesehen, er/sie war angekommen, wir waren gekommen, Sie hatten / ihr hattet getan, sie waren zurückgekehrt
    note: 'Die Regel von *رفتن* gilt für jedes Verb: Vergangenheitsstamm plus *ه*, dann *بودم، بودی، بود، بودیم، بودین، بودند*. *خورده بودم* heißt „ich hatte gegessen“, *دیده بودی* „du hattest gesehen“, *رسیده بود* „er oder sie war angekommen“, *آمده بودیم* „wir waren gekommen“, *کرده بودین* „Sie hatten / ihr hattet getan“, *برگشته بودند* „sie waren zurückgekehrt“. Nur *بود-* verändert sich, nie das Partizip.'
  prs.a2.unit26.lesson02.teach.compound_verbs:
    title: Verben aus zwei Wörtern
    gloss: ich hatte verloren; es war geschlossen worden; es war kaputtgegangen
    note: 'Viele Verben bestehen aus einem Wort plus *کردن* oder *شدن*. Das Partizip wird aus dem zweiten Teil gebildet, der erste Teil bleibt davor stehen: *گم کردن* ergibt *گم کرده بودم* (ich hatte verloren), *بسته شدن* ergibt *بسته شده بود* (es war geschlossen worden), *خراب شدن* ergibt *خراب شده بود* (es war kaputtgegangen). *شدن* ist nützlich, wenn einer Sache etwas geschehen ist: dem Tor, dem Auto, dem Büro.'
  prs.a2.unit26.lesson02.teach.gate:
    title: Tor, Tür
    gloss: Tor, Tür
    note: '*دروازه* ist ein Tor oder eine große Tür, zum Beispiel das Gate am Flughafen oder die Tür eines Büros.'
    example_gloss: Das Tor ist offen.
  prs.a2.unit26.lesson02.teach.gate_closed:
    title: Das Tor war geschlossen worden
    gloss: Das Tor war geschlossen worden.
    note: '*بسته شده بود* sagt, dass das Tor schon geschlossen war, bevor Sie kamen. Es ist das Plusquamperfekt von *بسته شدن*.'
  prs.a2.unit26.lesson02.teach.break_down:
    title: Kaputtgehen
    gloss: kaputtgehen, eine Panne haben
    note: '*خراب* bedeutet kaputt oder verdorben, und *شدن* bedeutet werden, also ist *خراب شدن* „kaputtgehen“. Die einfache Vergangenheit ist *خراب شد*: *موترم خراب شد* heißt „Mein Auto ist kaputtgegangen“.'
    example_gloss: Mein Auto ist kaputtgegangen.
  prs.a2.unit26.lesson02.teach.ate_breakfast:
    title: Ich hatte gefrühstückt
    gloss: Ich hatte gefrühstückt.
    note: '*صبحانه خورده بودم* sagt, dass das Frühstück schon beendet war, bevor der Moment eintrat, von dem Sie sprechen.'
  prs.a2.unit26.lesson02.teach.meeting:
    title: Treffen
    gloss: Treffen
    note: '*جلسه* ist eine Besprechung oder Sitzung. Es ist ein weiterer Termin, den man verpassen oder zu dem man zu spät kommen kann.'
    example_gloss: Die Besprechung begann um neun Uhr.
  prs.a2.unit26.lesson02.teach.manager:
    title: Leiter
    gloss: Leiter, Direktor
    note: '*مدیر* ist der Leiter oder Direktor eines Büros.'
    example_gloss: Der Direktor ist im Büro.
  prs.a2.unit26.lesson03.teach.contrast:
    title: Plusquamperfekt im Gegensatz zum einfachen Präteritum
    gloss: Als ich ankam, war der Bus schon weggefahren. / Als ich ankam, fuhr der Bus ab.
    note: 'Wenn zwei vergangene Ereignisse zusammen erzählt werden, steht das frühere Ereignis im Plusquamperfekt und das spätere, der Bezugspunkt, im einfachen Präteritum. In *وقتی رسیدم، بس رفته بود* kamen Sie zuerst nicht an, sondern später: Der Bus war zuerst abgefahren, also finden Sie ihn nicht mehr vor. In *وقتی رسیدم، بس رفت* stehen beide Verben im einfachen Präteritum, der Bus fuhr also nach Ihrer Ankunft oder genau bei Ihrer Ankunft ab. Die beiden Teilsätze können auch in umgekehrter Reihenfolge stehen: *بس رفته بود، وقتی رسیدم*.'
  prs.a2.unit26.lesson03.teach.bus_left_simple:
    title: Als ich ankam, fuhr der Bus ab
    gloss: Als ich ankam, fuhr der Bus ab.
    note: Vergleichen Sie dies mit *بس رفته بود*. Hier fuhr der Bus ab, nachdem Sie angekommen waren. Sie hätten noch hinrennen können. Mit *رفته بود* war er schon weg.
  prs.a2.unit26.lesson03.teach.manager_left:
    title: Als ich ankam, war der Direktor schon gegangen
    gloss: Als ich ankam, war der Direktor schon gegangen.
    note: 'Es gilt dasselbe Muster wie beim Bus: *وقتی رسیدم* ist die Ankunft, *مدیر رفته بود* ist das frühere Ereignis. So sagen Sie es, wenn Sie zu einem Termin kommen und die Person schon weg ist.'
  prs.a2.unit26.lesson03.teach.negative:
    title: 'Die Verneinung: ن vor dem Partizip'
    gloss: ich war nicht gegangen, du warst nicht gegangen, er/sie war nicht gegangen, wir waren nicht gegangen, ihr wart/Sie waren nicht gegangen, sie waren nicht gegangen
    note: 'Um zu sagen, dass etwas noch nicht geschehen war, setzen Sie *ن* vor das Partizip, nicht vor *بود*: Aus *رفته بودم* wird *نرفته بودم* (ich war nicht gegangen). *بود-* behält dieselben Endungen: *نرفته بودم، نرفته بودی، نرفته بود، نرفته بودیم، نرفته بودین، نرفته بودند*. Schreiben Sie dafür nicht *رفته نبودم*.'
  prs.a2.unit26.lesson03.teach.negative_more:
    title: Verneinte Partizipien anderer Verben
    gloss: ich hatte nicht gegessen, ich hatte nicht gesehen, ich war nicht angekommen, ich war nicht gekommen
    note: 'Dasselbe *ن* steht vor jedem Partizip: *نخورده* (nicht gegessen), *ندیده* (nicht gesehen), *نرسیده* (nicht angekommen). Die Ausnahme, die Sie sich merken sollten, ist das Verb *آمدن*: Sein Partizip *آمده* nimmt *نیـ*, die Verneinung lautet also *نیامده* (nicht gekommen), wie in *نیامده بودم*. Bei zusammengesetzten Verben steht das *ن* beim zweiten Teil: *گم نکرده بودم* (ich hatte es nicht verloren).'
  prs.a2.unit26.lesson04.teach.already:
    title: Schon, früher
    gloss: schon, vorher, früher
    note: '*قبلاً* bedeutet „vor jetzt“ oder „früher“. Es betont, dass etwas früher getan wurde, und steht vor dem Partizip oder am Satzanfang.'
    example_gloss: Ich hatte schon gefrühstückt.
  prs.a2.unit26.lesson04.teach.from_before:
    title: Schon, von vorher
    gloss: schon, im Voraus
    note: '*از قبل* bedeutet „im Voraus“ oder „schon, seit früherer Zeit“. Es steht vor dem Partizip: *از قبل رفته بود* heißt „er war schon gegangen“. Es kommt im Plusquamperfekt sehr häufig vor.'
    example_gloss: Der Bus war schon abgefahren.
  prs.a2.unit26.lesson04.teach.not_yet:
    title: Noch, noch nicht
    gloss: 'noch; mit Verneinung: noch nicht'
    note: '*هنوز* mit einem verneinten Verb bedeutet „noch nicht“. *هنوز نیامده بود* heißt „er war noch nicht gekommen“. Das verneinte Plusquamperfekt und *هنوز* gehören zusammen: Das Erwartete war bis zu diesem Zeitpunkt nicht geschehen.'
    example_gloss: Er war noch nicht gekommen.
  prs.a2.unit26.lesson04.teach.before_clause:
    title: 'قبل از اینکه: bevor ich ankam'
    gloss: Bevor ich ankam, war das Flugzeug schon abgeflogen. / Bevor wir ankamen, war das Flugzeug schon abgeflogen.
    note: '*قبل از اینکه* bedeutet „bevor“ und leitet einen Nebensatz mit eigenem Verb ein. Das Verb danach steht im Konjunktiv, derselben Form wie nach *باید*: *برسم* (dass ich ankomme), *برسیم* (dass wir ankommen). Es ist keine Vergangenheitsform, obwohl die Geschichte in der Vergangenheit spielt. Der Hauptsatz sagt dann, was schon geschehen war: *طیاره رفته بود*. So bedeutet *قبل از اینکه من برسم، طیاره رفته بود* dasselbe wie *وقتی رسیدم، طیاره رفته بود*: Das Flugzeug war zuerst abgeflogen. Die Teilsätze können die Plätze tauschen.'
  prs.a2.unit26.lesson04.teach.friend_not_yet:
    title: Als ich ankam, war mein Freund noch nicht gekommen
    gloss: Als ich ankam, war mein Freund noch nicht gekommen.
    note: Hier ist das frühere Ereignis etwas, das noch nicht geschehen war. *هنوز نیامده بود* legt das fehlende Ereignis vor den Bezugspunkt *وقتی رسیدم*.
  prs.a2.unit26.lesson04.teach.what_happened:
    title: Was geschah, als du am Bahnhof ankamst?
    gloss: Was geschah, als du am Bahnhof ankamst?
    note: '*چه شد؟* fragt „Was ist passiert?“. Die Antwort steht meist im Plusquamperfekt: *بس از قبل رفته بود* (der Bus war schon abgefahren).'
  prs.a2.unit26.lesson05.teach.four:
    title: Vier
    gloss: vier
    note: '*چهار* ist vier. Sie verwenden es für die Uhrzeit: *ساعت چهار* ist vier Uhr.'
    example_gloss: Ich kam um vier Uhr zu Hause an.
  prs.a2.unit26.lesson05.teach.staff:
    title: Belegschaft, Angestellte
    gloss: Belegschaft, Angestellte
    note: '*کارمندان* ist der Plural von *کارمند* (Angestellter). Die Endung *-ان* bildet den Plural für Personen.'
    example_gloss: Die Angestellten sind im Büro.
  prs.a2.unit26.lesson05.teach.passport_office:
    title: Passamt
    gloss: Passamt
    note: '*دفتر پاسپورت* ist das Büro, in dem man einen Pass bekommt oder erneuern lässt. Beide Wörter kennen Sie schon.'
    example_gloss: Das Passamt ist in Kabul.
  prs.a2.unit26.lesson05.teach.bus_turn01:
    title: Schakiba fragt Naimat nach gestern
    gloss: Naimat, bist du gestern nach Masar gefahren?
    note: Schakiba stellt eine Ja-Nein-Frage zu einer abgeschlossenen Handlung im einfachen Präteritum, *رفتی*. Die Sprecherin ist eine Freundin, deshalb verwendet sie *تو*.
  prs.a2.unit26.lesson05.teach.bus_turn02:
    title: Naimat sagt, was er vorgefunden hat
    gloss: Nein. Als ich am Bahnhof ankam, war der Bus schon abgefahren.
    note: Naimat antwortet *نخیر*, nennt dann den Bezugspunkt im einfachen Präteritum, *وقتی به ایستگاه رسیدم*, und das frühere Ereignis im Plusquamperfekt, *بس رفته بود*.
  prs.a2.unit26.lesson05.teach.bus_turn03:
    title: Schakiba fragt nach der Uhrzeit
    gloss: Um wie viel Uhr ist der Bus abgefahren?
    note: '*ساعت چند* fragt nach der Uhrzeit. *حرکت کرد* ist das einfache Präteritum von *حرکت کردن*, „abfahren“.'
  prs.a2.unit26.lesson05.teach.bus_turn04:
    title: Naimat nennt die beiden Uhrzeiten
    gloss: Um acht. Ich bin um neun angekommen.
    note: 'Zwei Uhrzeiten, zwei Ereignisse: Der Bus fuhr *ساعت هشت* ab, und Naimat kam *ساعت نه* an. Acht ist früher als neun, also fuhr der Bus zuerst ab.'
  prs.a2.unit26.lesson05.teach.bus_turn05:
    title: Schakiba fragt, was danach geschah
    gloss: Was hast du dann gemacht?
    note: '*بعد چه کردی؟* fragt, was du als Nächstes getan hast. Es steht im einfachen Präteritum, weil es ein neues Ereignis nach der Ankunft ist.'
  prs.a2.unit26.lesson05.teach.bus_turn06:
    title: Naimat ging nach Hause
    gloss: Ich bin nach Hause zurückgegangen.
    note: '*برگشتم* ist das einfache Präteritum von *برگشتن*: Er ging nach Hause zurück.'
  prs.a2.unit26.lesson05.teach.message:
    title: Eine Nachricht über eine verspätete Ankunft
    gloss: Hallo Schakiba. Heute um vier Uhr bin ich beim Passamt angekommen, aber das Büro war schon geschlossen. Die Angestellten waren gegangen. Mein Auto war kaputtgegangen, deshalb kam ich zu spät. Morgen früh gehe ich noch einmal hin.
    note: 'Eine kurze schriftliche Nachricht im Plusquamperfekt. Sie erzählt, was der Schreiber bei der Ankunft vorfand: Das Büro war geschlossen und die Angestellten waren gegangen. Sie nennt auch den früheren Grund für die Verspätung: Das Auto war kaputtgegangen.'
  prs.a2.unit26.lesson06.teach.herat:
    title: Herat
    gloss: Herat (eine Stadt im Westen Afghanistans)
    note: '*هرات* ist die Stadt Herat im Westen Afghanistans. Von Kabul aus fliegt man dorthin.'
    example_gloss: Das Flugzeug fliegt nach Herat.
  prs.a2.unit26.lesson06.teach.find:
    title: Finden
    gloss: finden
    note: '*پیدا کردن* heißt, etwas zu finden, wonach man gesucht hat. Das Objekt steht mit *را* vor dem Verb: *کلیدم را پیدا کردم* heißt „Ich habe meinen Schlüssel gefunden“. Die Verneinung ist *پیدا نکردم* (ich habe es nicht gefunden).'
    example_gloss: Ich habe meinen Schlüssel gefunden.
  prs.a2.unit26.lesson06.teach.bad:
    title: Schlecht
    gloss: schlecht
    note: '*بد* bedeutet „schlecht“. *چه بد!* ist eine freundliche Reaktion auf schlechte Nachrichten, das Gegenteil von *چه خوب!*.'
    example_gloss: Wie schlimm! (Wie schade!)
  prs.a2.unit26.lesson06.teach.airport_turn01:
    title: Naimat fragt, warum Schakiba nicht gefahren ist
    gloss: Schakiba, warum bist du letzte Woche nicht nach Herat gefahren?
    note: Naimat fragt mit *چرا* und dem verneinten einfachen Präteritum *نرفتی*. Er ist ein Freund, deshalb verwendet er *تو*.
  prs.a2.unit26.lesson06.teach.airport_turn02:
    title: Schakiba nennt den Grund
    gloss: Weil ich meinen Pass verloren hatte. Bis zehn Uhr habe ich ihn nicht gefunden.
    note: '*چون* (weil) leitet den Grund ein, und der Grund ist das frühere Ereignis, daher steht er im Plusquamperfekt: *گم کرده بودم*. *آن را* (ihn/es) verweist auf den Pass.'
  prs.a2.unit26.lesson06.teach.airport_turn03:
    title: Naimat fragt, was am Flughafen geschah
    gloss: Was war, als du am Flughafen ankamst?
    note: Der Bezugspunkt ist *وقتی به میدان هوایی رسیدی* im einfachen Präteritum. *چه شد؟* fragt danach, was schon der Fall war.
  prs.a2.unit26.lesson06.teach.airport_turn04:
    title: Schakiba erzählt, was sie vorfand und was sie tat
    gloss: Das Flugzeug war schon abgeflogen. Dann bin ich nach Hause zurückgegangen und habe telefoniert.
    note: '*طیاره رفته بود* ist das frühere Ereignis im Plusquamperfekt. Danach folgen zwei neue Ereignisse im einfachen Präteritum: *برگشتم* und *تیلفون کردم*.'
  prs.a2.unit26.lesson06.teach.airport_turn05:
    title: Naimat reagiert
    gloss: Wie schade!
    note: '*چه بد!* ist eine kurze, freundliche Reaktion auf schlechte Nachrichten.'
exercises:
  prs.a2.unit26.lesson01.exercise01.recognize_plane_left:
    instruction: Was bedeutet dieser Satz?
    correct_option: Das Flugzeug war abgeflogen
    distractors:
    - Das Flugzeug fliegt gerade ab
    - Das Flugzeug wird abfliegen
    - Das Flugzeug ist am Flughafen
    accepted_answers:
    - value: Das Flugzeug war abgeflogen
      status: correct
    feedback: '*طیاره رفته بود* heißt „das Flugzeug war abgeflogen“: das Partizip *رفته* plus *بود*.'
  prs.a2.unit26.lesson01.exercise02.recognize_lost_passport:
    instruction: Was bedeutet dieser Satz?
    correct_option: ich hatte meinen Pass verloren
    distractors:
    - Ich habe meinen Pass gefunden
    - Mein Pass ist zu Hause
    - Ich möchte einen Pass
    accepted_answers:
    - value: ich hatte meinen Pass verloren
      status: correct
    feedback: '*گم کرده بودم* heißt „ich hatte verloren“: das Partizip *گم کرده* plus *بودم*.'
  prs.a2.unit26.lesson01.exercise03.recognize_we_arrived:
    instruction: Was bedeutet dieser Satz?
    correct_option: Wir waren angekommen
    distractors:
    - Sie waren angekommen
    - ich war angekommen
    - Wir kommen jeden Tag an
    accepted_answers:
    - value: Wir waren angekommen
      status: correct
    feedback: 'Die Endung von *بودیم* bedeutet „wir“: *ما رسیده بودیم* heißt „wir waren angekommen“.'
  prs.a2.unit26.lesson01.exercise04.match_form_and_words:
    instruction: Ordnen Sie jedem Dari-Wort seine Bedeutung zu.
    accepted_answers:
    - value:
        رفته بودم: ich war gegangen
        رفته بودی: du warst gegangen (zu einem Freund)
        رفته بود: er, sie oder es war gegangen
        رفته بودیم: wir waren gegangen
        رفته بودین: Sie waren gegangen (höflich) / ihr wart gegangen
        رفته بودند: sie waren gegangen
        طیاره: Flugzeug
        میدان هوایی: Flughafen
        ایستگاه: der Bahnhof
      status: correct
    feedback: 'Nur *بود-* verändert sich mit der Person: *بودم* ich, *بودی* du (Freund), *بود* er oder sie, *بودیم* wir, *بودین* ihr/Sie (formell oder Plural), *بودند* sie.'
    pairs:
    - left: رفته بودم
      right: ich war gegangen
    - left: رفته بودی
      right: du warst gegangen (zu einem Freund)
    - left: رفته بود
      right: er, sie oder es war gegangen
    - left: رفته بودیم
      right: wir waren gegangen
    - left: رفته بودین
      right: Sie waren gegangen (höflich) / ihr wart gegangen
    - left: رفته بودند
      right: sie waren gegangen
    - left: طیاره
      right: Flugzeug
    - left: میدان هوایی
      right: Flughafen
    - left: ایستگاه
      right: der Bahnhof
  prs.a2.unit26.lesson01.exercise05.order_we_arrived_station:
    instruction: 'Ordnen Sie die Wörter, um zu sagen: Wir waren am Bahnhof angekommen.'
    accepted_answers:
    - value:
      - ما
      - به
      - ایستگاه
      - رسیده
      - بودیم
      status: correct
    feedback: In *ما به ایستگاه رسیده بودیم* steht das Partizip zuerst und *بودیم* zuletzt.
  prs.a2.unit26.lesson01.exercise06.translate_bus_left:
    instruction: 'Übersetzen Sie ins Dari und verwenden Sie das Plusquamperfekt von رفتن: Der Bus war abgefahren.'
    accepted_answers:
    - value: بس رفته بود.
      status: correct
    - value: آن بس رفته بود.
      status: correct
    feedback: '*بس رفته بود* heißt „der Bus war abgefahren“. *آن* (jener) ist optional.'
  prs.a2.unit26.lesson02.exercise01.recognize_had_eaten:
    instruction: Was bedeutet dieser Satz?
    correct_option: Ich hatte gefrühstückt
    distractors:
    - Ich werde frühstücken
    - Ich frühstücke gerade
    - Ich möchte kein Frühstück
    accepted_answers:
    - value: Ich hatte gefrühstückt
      status: correct
    feedback: '*خورده بودم* heißt „ich hatte gegessen“: das Partizip *خورده* plus *بودم*.'
  prs.a2.unit26.lesson02.exercise02.recognize_gate_closed:
    instruction: Was bedeutet dieser Satz?
    correct_option: Das Tor war geschlossen worden
    distractors:
    - Das Tor ist offen
    - Das Tor wird morgen geschlossen
    - Das Tor ist am Flughafen
    accepted_answers:
    - value: Das Tor war geschlossen worden
      status: correct
    feedback: '*بسته شده بود* ist das Plusquamperfekt von *بسته شدن*: Das Tor war geschlossen worden.'
  prs.a2.unit26.lesson02.exercise03.match_participles:
    instruction: Ordnen Sie jedem Plusquamperfekt-Verb seine Bedeutung zu.
    accepted_answers:
    - value:
        رفته بود: er oder sie war gegangen
        خورده بود: er oder sie hatte gegessen
        دیده بود: er oder sie hatte gesehen
        رسیده بود: er oder sie war angekommen
        آمده بود: er oder sie war gekommen
        کرده بود: er oder sie hatte getan
        برگشته بود: er oder sie war zurückgekehrt
        گم کرده بود: er oder sie hatte verloren
        خراب شده بود: es war kaputtgegangen
      status: correct
    feedback: 'Alle diese Formen bestehen aus einem Partizip auf *ه* plus *بود*. Bei zweiteiligen Verben bleibt das erste Wort vorn: *گم کرده بود*, *خراب شده بود*.'
    pairs:
    - left: رفته بود
      right: er oder sie war gegangen
    - left: خورده بود
      right: er oder sie hatte gegessen
    - left: دیده بود
      right: er oder sie hatte gesehen
    - left: رسیده بود
      right: er oder sie war angekommen
    - left: آمده بود
      right: er oder sie war gekommen
    - left: کرده بود
      right: er oder sie hatte getan
    - left: برگشته بود
      right: er oder sie war zurückgekehrt
    - left: گم کرده بود
      right: er oder sie hatte verloren
    - left: خراب شده بود
      right: es war kaputtgegangen
  prs.a2.unit26.lesson02.exercise04.order_lost_key:
    instruction: 'Ordnen Sie die Wörter so an, dass sie bedeuten: Ich hatte meinen Schlüssel verloren.'
    accepted_answers:
    - value:
      - کلیدم
      - را
      - گم
      - کرده
      - بودم
      status: correct
    feedback: In *کلیدم را گم کرده بودم* steht *را* nach dem verlorenen Gegenstand und das Verb am Satzende.
  prs.a2.unit26.lesson02.exercise05.complete_gate:
    instruction: 'Ergänzen Sie den Satz: Das Tor war geschlossen worden.'
    accepted_answers:
    - value: بود
      status: correct
    feedback: '*بود* ist die Vergangenheit von *بودن*. Mit *بسته شده* bildet es das Plusquamperfekt.'
  prs.a2.unit26.lesson02.exercise06.translate_car_broke_down:
    instruction: 'Übersetzen Sie ins Dari und verwenden Sie das Plusquamperfekt von خراب شدن: Mein Auto war kaputtgegangen.'
    accepted_answers:
    - value: موترم خراب شده بود.
      status: correct
    - value: موتر من خراب شده بود.
      status: correct
    feedback: '*موترم خراب شده بود* heißt „mein Auto war kaputtgegangen“. *موتر من* ist dasselbe mit ausgeschriebenem Pronomen.'
  prs.a2.unit26.lesson03.exercise01.which_first:
    instruction: Lesen Sie den Satz. Was ist zuerst passiert?
    correct_option: Der Bus war abgefahren
    distractors:
    - ich bin angekommen
    - Ich ging nach Hause
    - Ich kaufte eine Fahrkarte
    accepted_answers:
    - value: Der Bus war abgefahren
      status: correct
    feedback: '*بس رفته بود* ist das frühere Ereignis, der Bus fuhr also zuerst ab. *وقتی رسیدم* ist der spätere Bezugspunkt.'
  prs.a2.unit26.lesson03.exercise02.bus_left_after:
    instruction: Lesen Sie den Satz. Welche Aussage stimmt?
    correct_option: Der Bus fuhr ab, nachdem ich angekommen war
    distractors:
    - Der Bus fuhr ab, bevor ich ankam
    - Der Bus fuhr nie ab
    - Ich kam nicht an
    accepted_answers:
    - value: Der Bus fuhr ab, nachdem ich angekommen war
      status: correct
    feedback: 'Beide Verben stehen im einfachen Präteritum, die Reihenfolge entspricht also der Wortfolge: erst *رسیدم*, dann *بس رفت*.'
  prs.a2.unit26.lesson03.exercise03.match_simple_perfect:
    instruction: Ordnen Sie jedem Dari-Verb die passende Bedeutung zu.
    accepted_answers:
    - value:
        رسیدم: ich bin angekommen
        رسیده بودم: ich war angekommen
        رفت: er, sie oder es fuhr ab
        رفته بود: er, sie oder es war abgefahren
        دیدم: ich habe gesehen
        دیده بودم: ich hatte gesehen
        گم کردم: ich verlor
        گم کرده بودم: ich hatte verloren
        نرفته بودم: ich war nicht gegangen
      status: correct
    feedback: Das einfache Präteritum besteht aus dem Vergangenheitsstamm plus Endung. Das Plusquamperfekt fügt ein Partizip und *بود-* hinzu und besteht daher aus zwei Wörtern.
    pairs:
    - left: رسیدم
      right: ich bin angekommen
    - left: رسیده بودم
      right: ich war angekommen
    - left: رفت
      right: er, sie oder es fuhr ab
    - left: رفته بود
      right: er, sie oder es war abgefahren
    - left: دیدم
      right: ich habe gesehen
    - left: دیده بودم
      right: ich hatte gesehen
    - left: گم کردم
      right: ich verlor
    - left: گم کرده بودم
      right: ich hatte verloren
    - left: نرفته بودم
      right: ich war nicht gegangen
  prs.a2.unit26.lesson03.exercise04.order_plane_left:
    instruction: 'Ordnen Sie die Wörter so an, dass sie bedeuten: Als ich ankam, war das Flugzeug schon abgeflogen.'
    accepted_answers:
    - value:
      - وقتی
      - رسیدم
      - طیاره
      - رفته
      - بود
      status: correct
    - value:
      - طیاره
      - رفته
      - بود
      - وقتی
      - رسیدم
      status: correct
    feedback: '*وقتی رسیدم، طیاره رفته بود.* Die Ankunft ist der Bezugspunkt, der Abflug des Flugzeugs das frühere Ereignis. Die beiden Teilsätze können die Plätze tauschen.'
  prs.a2.unit26.lesson03.exercise05.complete_bus_left:
    instruction: 'Ergänzen Sie den Satz: Als ich am Bahnhof ankam, war der Bus abgefahren.'
    accepted_answers:
    - value: رفته
      status: correct
    feedback: '*رفته* ist das Partizip von *رفتن*. Mit *بود* ergibt es *رفته بود*: Der Bus war abgefahren.'
  prs.a2.unit26.lesson03.exercise06.translate_manager_left:
    instruction: 'Übersetzen Sie ins Dari und verwenden Sie das Plusquamperfekt von رفتن: Als ich ankam, war der Direktor gegangen.'
    accepted_answers:
    - value: وقتی رسیدم، مدیر رفته بود.
      status: correct
    - value: وقتی رسیدم مدیر رفته بود.
      status: correct
    - value: مدیر رفته بود، وقتی رسیدم.
      status: correct
    - value: مدیر رفته بود وقتی رسیدم.
      status: correct
    feedback: '*وقتی رسیدم، مدیر رفته بود.* heißt „Als ich ankam, war der Direktor gegangen.“ Mit oder ohne Komma ist beides richtig, und die beiden Teilsätze können die Plätze tauschen.'
  prs.a2.unit26.lesson04.exercise01.recognize_already_left:
    instruction: Was bedeutet dieser Satz?
    correct_option: Der Bus war schon abgefahren
    distractors:
    - Der Bus fährt gerade ab
    - Der Bus ist noch nicht abgefahren
    - Der Bus fährt bald ab
    accepted_answers:
    - value: Der Bus war schon abgefahren
      status: correct
    feedback: '*از قبل* bedeutet „schon“. *بس از قبل رفته بود* heißt „Der Bus war schon abgefahren“.'
  prs.a2.unit26.lesson04.exercise02.recognize_not_yet:
    instruction: Was bedeutet dieser Satz?
    correct_option: Er war noch nicht gekommen
    distractors:
    - Er war schon gekommen
    - Er wollte nicht kommen
    - Er kam gestern
    accepted_answers:
    - value: Er war noch nicht gekommen
      status: correct
    feedback: '*هنوز* mit dem verneinten *نیامده بود* bedeutet „noch nicht“: Er war noch nicht gekommen.'
  prs.a2.unit26.lesson04.exercise03.order_before_arrive:
    instruction: 'Ordnen Sie die Wörter so an, dass sie bedeuten: Bevor ich ankam, war das Flugzeug abgeflogen.'
    accepted_answers:
    - value:
      - قبل
      - از
      - اینکه
      - من
      - برسم
      - طیاره
      - رفته
      - بود
      status: correct
    - value:
      - طیاره
      - رفته
      - بود
      - قبل
      - از
      - اینکه
      - من
      - برسم
      status: correct
    feedback: '*قبل از اینکه من برسم، طیاره رفته بود.* Nach *قبل از اینکه* steht das Verb *برسم*, und der Hauptsatz steht im Plusquamperfekt.'
  prs.a2.unit26.lesson04.exercise04.complete_already:
    instruction: 'Ergänzen Sie den Satz: Ich hatte schon gefrühstückt.'
    accepted_answers:
    - value: خورده
      status: correct
    feedback: '*خورده* ist das Partizip von *خوردن*. *قبلاً صبحانه خورده بودم* heißt „Ich hatte schon gefrühstückt“.'
  prs.a2.unit26.lesson04.exercise05.answer_what_happened:
    instruction: 'Eine Freundin/Ein Freund fragt: وقتی به ایستگاه رسیدی، چه شد؟ (Was war los, als du am Bahnhof ankamst?) Antworten Sie auf Dari im Plusquamperfekt: Der Bus war schon abgefahren.'
    accepted_answers:
    - value: بس از قبل رفته بود.
      status: correct
    - value: بس قبلاً رفته بود.
      status: correct
    - value: بس رفته بود.
      status: correct
    - value: وقتی رسیدم، بس از قبل رفته بود.
      status: correct
    - value: وقتی رسیدم، بس قبلاً رفته بود.
      status: correct
    - value: وقتی رسیدم، بس رفته بود.
      status: correct
    feedback: '*بس از قبل رفته بود.* heißt „Der Bus war schon abgefahren.“ *قبلاً* statt *از قبل* oder gar kein Zeitwort sind ebenfalls richtig.'
  prs.a2.unit26.lesson04.exercise06.write_friend_not_yet:
    instruction: 'Schreiben Sie auf Dari und verwenden Sie هنوز und das verneinte Plusquamperfekt von آمدن: Als ich ankam, war mein Freund noch nicht gekommen.'
    accepted_answers:
    - value: وقتی رسیدم، دوستم هنوز نیامده بود.
      status: correct
    - value: وقتی رسیدم دوستم هنوز نیامده بود.
      status: correct
    - value: دوستم هنوز نیامده بود، وقتی رسیدم.
      status: correct
    - value: دوستم هنوز نیامده بود وقتی رسیدم.
      status: correct
    feedback: '*وقتی رسیدم، دوستم هنوز نیامده بود.* Die Ankunft ist das spätere Ereignis, und *نیامده بود* ist das frühere, das noch nicht eingetreten war.'
  prs.a2.unit26.lesson05.exercise01.read_found_at_office:
    instruction: Lesen Sie die Nachricht. Was hat der Verfasser im Büro vorgefunden?
    correct_option: Das Büro war geschlossen
    distractors:
    - Das Büro war geöffnet
    - Der Direktor hat gewartet
    - Das Büro hatte noch nicht geöffnet
    accepted_answers:
    - value: Das Büro war geschlossen
      status: correct
    feedback: '*دفتر بسته شده بود* heißt „Das Büro war geschlossen worden“.'
  prs.a2.unit26.lesson05.exercise02.read_why_late:
    instruction: Lesen Sie die Nachricht. Warum kam der Verfasser zu spät?
    correct_option: Das Auto des Verfassers war kaputtgegangen
    distractors:
    - Der Verfasser hatte einen Pass verloren
    - Der Bus war abgefahren
    - Der Verfasser war nicht aufgewacht
    accepted_answers:
    - value: Das Auto des Verfassers war kaputtgegangen
      status: correct
    feedback: '*موترم خراب شده بود، پس دیر رسیدم* heißt „Mein Auto war kaputtgegangen, deshalb kam ich zu spät“.'
  prs.a2.unit26.lesson05.exercise03.read_staff:
    instruction: Lesen Sie die Nachricht. Was hatten die Angestellten schon getan?
    correct_option: Sie waren gegangen
    distractors:
    - Sie waren noch nicht angekommen
    - Sie hatten eine Besprechung begonnen
    - Sie hatten den Schlüssel verloren
    accepted_answers:
    - value: Sie waren gegangen
      status: correct
    feedback: '*کارمندان رفته بودند* heißt „Die Angestellten waren gegangen“.'
  prs.a2.unit26.lesson05.exercise04.comprehend_bus_order:
    instruction: Lesen Sie das Gespräch, denn es gibt noch keine Aufnahme. Was geschah zuerst?
    correct_option: Der Bus fuhr ab, dann kam Naimat an
    distractors:
    - Naimat kam an, dann fuhr der Bus ab
    - Beides geschah gleichzeitig
    - Naimat ging nach Hause, dann fuhr der Bus ab
    accepted_answers:
    - value: Der Bus fuhr ab, dann kam Naimat an
      status: correct
    feedback: Der Bus fuhr um acht ab, und Naimat kam um neun an. *بس رفته بود* ist das frühere Ereignis.
  prs.a2.unit26.lesson05.exercise05.match_had_happened:
    instruction: Ordnen Sie jedem Satz seine Bedeutung zu.
    accepted_answers:
    - value:
        دفتر بسته شده بود: das Büro war geschlossen worden
        کارمندان رفته بودند: die Angestellten waren gegangen
        موترم خراب شده بود: mein Auto war kaputtgegangen
        بس رفته بود: der Bus war abgefahren
        پاسپورتم را گم کرده بودم: ich hatte meinen Pass verloren
        طیاره رفته بود: das Flugzeug war abgeflogen
        هنوز نیامده بود: er oder sie war noch nicht gekommen
      status: correct
    feedback: Jeder Satz besteht aus einem Partizip plus *بود-*. Sie nennen sechs Dinge, die schon geschehen waren, und eines, das noch nicht geschehen war.
    pairs:
    - left: دفتر بسته شده بود
      right: das Büro war geschlossen worden
    - left: کارمندان رفته بودند
      right: die Angestellten waren gegangen
    - left: موترم خراب شده بود
      right: mein Auto war kaputtgegangen
    - left: بس رفته بود
      right: der Bus war abgefahren
    - left: پاسپورتم را گم کرده بودم
      right: ich hatte meinen Pass verloren
    - left: طیاره رفته بود
      right: das Flugzeug war abgeflogen
    - left: هنوز نیامده بود
      right: er oder sie war noch nicht gekommen
  prs.a2.unit26.lesson05.exercise06.write_office_closed:
    instruction: 'Schreiben Sie auf Dari und verwenden Sie بسته شده بود: Als ich ankam, war das Büro schon geschlossen.'
    accepted_answers:
