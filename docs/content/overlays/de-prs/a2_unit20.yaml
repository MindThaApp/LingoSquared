course:
  title: Dari A2
  description: 'Dari (Afghanistan) für Fortgeschrittene auf A2-Niveau: über Urlaubspläne sprechen. Das Präsens mit Zeitangabe für nahe Pläne, قصد دارم + Konjunktiv für Absichten, شاید + Konjunktiv für Zweifel, die Verneinung und Fragen zu Plänen.'
