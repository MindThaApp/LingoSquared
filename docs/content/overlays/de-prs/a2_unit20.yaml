teaching:
  prs.a2.unit20.lesson01.teach.rkhst_rkhst_tabstan:
    title: Urlaub
    gloss: der Urlaub / der Sommerurlaub
    note: '*رخصتی* ist das alltägliche Wort für Urlaub oder freie Tage, und *رخصتی تابستان* sind die langen Sommerferien. *تابستان* heißt Sommer.'
    example_gloss:
    - Im August habe ich Urlaub.
    - Der Sommerurlaub beginnt im Juli.
  prs.a2.unit20.lesson01.teach.hfth_andh_sal:
    title: Wann etwas passiert
    gloss: nächste Woche / nächstes Jahr / bald
    note: '*آینده* bedeutet „nächste“ oder „kommende“ und steht nach dem Nomen: *هفته آینده* heißt nächste Woche und *سال آینده* nächstes Jahr. *به‌زودی* bedeutet bald.'
    example_gloss:
    - Nächste Woche habe ich einen Termin.
    - Nächstes Jahr möchte ich nach Belgien fahren.
    - Bald habe ich Urlaub.
  prs.a2.unit20.lesson01.teach.sfr_rdn_rzrw:
    title: Drei Reiseverben
    gloss: reisen / buchen / bleiben
    note: '*سفر کردن* besteht aus „Reise“ plus *کردن*, und *رزرو کردن* aus „Reservierung“ plus *کردن*. Im Satz verändert sich nur *کردن*: *سفر می‌کنم*, *رزرو می‌کنم*. *ماندن* bedeutet bleiben.'
    example_gloss:
    - Ich reise gern mit dem Zug.
    - Ich möchte ein Zimmer buchen.
    - Ich bleibe eine Woche.
  prs.a2.unit20.lesson01.teach.hwtl_m:
    title: Wo man übernachtet
    gloss: das Hotel / der Campingplatz
    note: '*هوتل* ist die in Afghanistan übliche Schreibweise für Hotel. *کمپ* ist ein Campingplatz. Man übernachtet *در هوتل* oder *در کمپ*.'
    example_gloss:
    - Das Hotel ist nah am Strand.
    - Wir schlafen auf dem Campingplatz.
  prs.a2.unit20.lesson01.teach.dr_rkhst_tabstan:
    title: Nach den Urlaubsplänen fragen
    gloss: Was machst du im Sommerurlaub?
    note: 'Dari hat kein eigenes Hilfsverb für nahe Pläne: Es wird das gewöhnliche Präsens *می‌کنی* verwendet, und das Fragewort *چه* steht vor dem Verb am Satzende.'
  prs.a2.unit20.lesson01.teach.dr_mah_ast:
    title: 'Nahe Pläne: das Präsens'
    gloss: Im August reise ich nach Deutschland. Ich buche ein Hotel.
    note: 'Um zu sagen, was Sie bald tun werden, verwendet Dari das Präsens mit einer Zeitangabe: *می‌روم* (ich gehe, ich werde gehen) mit *در ماه اگست* (im August). Fügen Sie das Präsenspräfix *می‌* und die Endung *-م* an den Stamm an: *رزرو می‌کنم*. Das Verb steht ganz am Satzende, und die Zeitangabe kann vorn stehen: *هفته آینده یک هوتل رزرو می‌کنم*. Ohne Zeitangabe kann dieselbe Form auch eine alltägliche Gewohnheit ausdrücken.'
  prs.a2.unit20.lesson01.teach.mn_hwtl_rzrw:
    title: Ein Hotel buchen
    gloss: Ich werde ein Hotel buchen.
  prs.a2.unit20.lesson02.teach.wrs_rftn_w:
    title: Drei Pläne für später
    gloss: einen Kurs machen / umziehen / Geld sparen
    note: '*کورس گرفتن* ist die feste Wendung für „einen Kurs belegen“. *کوچ کردن* bedeutet umziehen, also in ein neues Zuhause ziehen.'
    example_gloss:
    - Ich möchte einen Kurs machen.
    - Mein Onkel möchte umziehen.
    - Ich möchte auf ein neues Fahrrad sparen.
  prs.a2.unit20.lesson02.teach.bad_bad_az:
    title: Weiter in der Zukunft
    gloss: später / in einem Monat
    note: '*بعد از یک ماه* bedeutet „in einem Monat“. Das funktioniert auch mit anderen Zeiträumen: *بعد از یک هفته*.'
    example_gloss:
    - Später möchte ich ein Haus kaufen.
    - In einem Monat beginnt mein Kurs.
  prs.a2.unit20.lesson02.teach.bad_az_mah:
    title: Ein Kurs, der beginnt
    gloss: In einem Monat beginnt mein Kurs.
  prs.a2.unit20.lesson02.teach.mn_qsd_darm:
    title: 'Absichten: قصد دارم + Konjunktiv'
    gloss: Ich plane, einen Kurs zu machen.
    note: 'Um zu sagen, was Sie vorhaben, verwenden Sie *قصد دارم* (ich habe vor) und dann das zweite Verb im Konjunktiv: *قصد دارم یک کورس بگیرم*. Der Konjunktiv besteht aus dem Präfix *بـ* + Stamm + Personalendung: *بـ* + *گیر* + *-م* = *بگیرم*. Zusammengesetzte Verben mit *کردن* erhalten kein *بـ*: *پس‌انداز کنم*. Verwenden Sie das für Dinge, die Sie tun möchten, nicht für feste Vereinbarungen.'
  prs.a2.unit20.lesson02.teach.mn_qsd_darm_2:
    title: Einen Umzug planen
    gloss: Ich plane umzuziehen.
  prs.a2.unit20.lesson02.teach.mn_qsd_darm_3:
    title: Sparen planen
    gloss: Ich plane, Geld zu sparen.
  prs.a2.unit20.lesson02.teach.frda_bh_bazar:
    title: Präsens oder قصد دارم?
    gloss: Morgen gehe ich auf den Markt. Später plane ich umzuziehen.
    note: 'Verwenden Sie das Präsens mit Zeitangabe für die nahe, feststehende Zukunft: *فردا به بازار می‌روم*. Verwenden Sie *قصد دارم* + Konjunktiv für eine Absicht, die weiter entfernt oder unsicherer ist: *بعد قصد دارم کوچ کنم*.'
  prs.a2.unit20.lesson03.teach.shad_htma:
    title: Vielleicht und sicher
    gloss: vielleicht / sicher
    note: '*شاید* drückt Zweifel aus und wird vom Konjunktiv gefolgt. *حتما* bedeutet „bestimmt“ oder „ganz sicher“.'
    example_gloss:
    - Vielleicht regnet es morgen.
    - Das macht sicher Spaß.
  prs.a2.unit20.lesson03.teach.amsal_an_tabstan:
    title: Dieses Jahr, diesen Sommer
    gloss: dieses Jahr / diesen Sommer
    note: '*امسال* ist ein Wort für „dieses Jahr“. *این تابستان* heißt „diesen Sommer“: *این* bedeutet „dieser“ und steht vor dem Nomen.'
    example_gloss:
    - Dieses Jahr mache ich keinen Urlaub.
    - Diesen Sommer bleibe ich zu Hause.
    - Fahren Sie dieses Jahr in den Urlaub?
  prs.a2.unit20.lesson03.teach.an_tabstan_dr:
    title: Zu Hause bleiben
    gloss: Diesen Sommer bleibe ich zu Hause.
  prs.a2.unit20.lesson03.teach.frda_ar_mnm:
    title: شاید und der Konjunktiv
    gloss: Morgen arbeite ich. Vielleicht gehe ich später ins Kino.
    note: 'Nach *شاید* steht das Verb im Konjunktiv: *شاید بعد به سینما بروم* (*بـ* + Stamm *رو* + *-م*), nicht *می‌روم*. Das Verb steht am Satzende. Nach einer einfachen Zeitangabe wird das gewöhnliche Präsens verwendet: *فردا کار می‌کنم*.'
  prs.a2.unit20.lesson03.teach.bh_rkhst_nmrwm:
    title: Sagen, dass man etwas nicht vorhat
    gloss: Ich fahre nicht in den Urlaub. Ich plane nicht umzuziehen.
    note: 'Das Präsens wird verneint, indem *ن* vor das Verbpräfix tritt: *می‌روم* wird zu *نمی‌روم*: *به رخصتی نمی‌روم*. Um eine Absicht zu verneinen, verneint man *دارم*: *قصد ندارم کوچ کنم* (ich habe nicht vor umzuziehen); das zweite Verb bleibt im Konjunktiv.'
  prs.a2.unit20.lesson04.teach.ba_h_mdt:
    title: Zwei Fragewendungen
    gloss: mit wem / wie lange
    note: '*با کی* fragt, mit wem man etwas tut; *با* bedeutet „mit“. *چه مدت* fragt nach einem Zeitraum.'
    example_gloss:
    - Mit wem gehst du an den Strand?
    - Wie lange bleibst du?
  prs.a2.unit20.lesson04.teach.ja_mrw:
    title: Wohin fährst du?
    gloss: Wohin fährst du?
    note: '*کجا* bedeutet „wo“ und bei einem Verb der Bewegung auch „wohin“: *کجا می‌روی؟* Das Fragewort steht mitten im Satz, direkt vor dem Verb.'
  prs.a2.unit20.lesson04.teach.ba_bh_rkhst:
    title: Mit wem?
    gloss: Mit wem fährst du in den Urlaub?
  prs.a2.unit20.lesson04.teach.h_mdt_anja:
    title: Wie lange?
    gloss: Wie lange bleibst du dort?
  prs.a2.unit20.lesson04.teach.ba_khwahrm_mrwm:
    title: Antworten
    gloss: Ich fahre mit meiner Schwester.
  prs.a2.unit20.lesson04.teach.hfth_dw_hfth:
    title: Wochen
    gloss: eine Woche / zwei Wochen
    note: 'Nach einer Zahl bleibt das Nomen im Dari im Singular: *دو هفته*, nicht *دو هفته‌ها*.'
    example_gloss:
    - Ich bleibe eine Woche.
    - Wir bleiben zwei Wochen dort.
  prs.a2.unit20.lesson04.teach.ja_mrw_ba:
    title: Fragen zu Plänen
    gloss: Wohin fährst du? Mit wem fährst du? Wie lange bleibst du dort?
    note: 'Fragen behalten im Dari die normale Wortstellung: Das Fragewort steht dort, wo die Antwort stehen würde, und das Verb bleibt am Ende: *با کی به رخصتی می‌روی؟*, *چه مدت می‌مانی؟*. Gegenüber einem Freund endet das Verb auf *-ی*: *می‌روی*, *می‌مانی*.'
  prs.a2.unit20.lesson05.teach.slam_zrmnh_bhzwd:
    title: Eine Nachricht von Maryam
    gloss: Hallo Zarmina! Bald habe ich Urlaub. Im August fahre ich mit meiner Schwester nach Belgien, und wir bleiben eine Woche in einem Hotel. Danach fahre ich für zwei Tage zu meinen Eltern. Nächstes Jahr habe ich vor, einen Kurs zu belegen, und vielleicht ziehe ich auch um. Und was machst du?
    note: 'Maryam beschreibt nahe Pläne im Präsens und eine längerfristige Absicht mit *قصد دارم*. Beachten Sie, dass jedes Verb am Ende seines Satzes steht: *می‌مانیم*, *بگیرم*, *کنم*.'
    glosses:
      به‌زودی: bald
      رخصتی: Urlaub
      اگست: August
      خواهرم: Schwester
      به: zu
      بلجیم: Belgien
      هوتل: Hotel
      می‌مانیم: bleiben
      بعد: danach
      والدینم: Eltern
      روز: Tage
      آینده: nächste
      سال: Jahr
      قصد: Absicht (قصد دارم = ich habe vor)
      کورس: Kurs
      بگیرم: machen (einen Kurs)
      شاید: vielleicht
      کوچ: umziehen
      آن‌وقت: dann
      هم: auch
  prs.a2.unit20.lesson06.teach.slam_hmawn_bra:
    title: Zarmina fragt Homayoun nach seinen Plänen
    gloss: 'Zarmina: Hallo Homayoun! Hast du schon Pläne für die Sommerferien?'
  prs.a2.unit20.lesson06.teach.bl_dr_mah:
    title: Homayoun antwortet
    gloss: 'Homayoun: Ja! Im August fahre ich nach Deutschland. Ich werde ein Hotel buchen.'
  prs.a2.unit20.lesson06.teach.aal_ba_mrw:
    title: Zarmina fragt, mit wem er fährt
    gloss: 'Zarmina: Toll! Mit wem fährst du?'
  prs.a2.unit20.lesson06.teach.ba_aam_ma:
    title: Homayoun sagt, mit wem und wie lange
    gloss: 'Homayoun: Mit meinem Onkel. Wir bleiben eine Woche.'
  prs.a2.unit20.lesson06.teach.w_bad_h:
    title: Zarmina fragt nach der Zeit danach
    gloss: 'Zarmina: Und danach? Was hast du vor?'
  prs.a2.unit20.lesson06.teach.sal_andh_qsd:
    title: Homayoun nennt eine Absicht und fragt zurück
    gloss: 'Homayoun: Nächstes Jahr habe ich vor, einen Kurs zu belegen. Und du?'
  prs.a2.unit20.lesson06.teach.dr_mah_jwla:
    title: Zarmina antwortet
    gloss: 'Zarmina: Im Juli arbeite ich. Vielleicht gehe ich danach zu meinen Eltern.'
