course:
  title: Dari A2
  description: 'Afghanisches Dari für Fortgeschrittene auf unterem Niveau: Beschreiben Sie, wie das Leben früher war – in der Kindheit, an einem früheren Wohnort oder Arbeitsplatz – und wie es jetzt ist. Die Vergangenheit der Gewohnheit (می‌ plus Vergangenheitsstamm), ihre Verneinung und der Gegensatz zur einfachen Vergangenheit und zur Gegenwart.'
units:
  prs.a2.unit23.how_it_used_to_be:
    title: Wie das Leben früher war
lessons:
  prs.a2.unit23.lesson01.then_and_now_words:
    title: Wörter für „damals und heute“ und die Gewohnheitsform
  prs.a2.unit23.lesson02.more_verbs:
    title: Die Vergangenheit der Gewohnheit mit weiteren Verben
  prs.a2.unit23.lesson03.past_or_habit_or_now:
    title: Einfache Vergangenheit, Gewohnheitsvergangenheit, Gegenwart und Verneinung
  prs.a2.unit23.lesson04.my_old_life:
    title: 'Mein altes Leben: Viertel, Schule und Arbeit'
  prs.a2.unit23.lesson05.reading_and_listening:
    title: 'Lesen und Hören: eine Kindheit'
  prs.a2.unit23.lesson06.conversation_then_and_now:
    title: Ein Gespräch über früher und heute
teaching:
  prs.a2.unit23.lesson01.teach.before:
    title: Früher, in der Vergangenheit
    gloss: früher, ehemals
    note: '*قبلاً* blickt auf eine frühere Zeit Ihres Lebens zurück. Es eröffnet die meisten Sätze darüber, wie es früher war: *قبلاً در هرات زندگی می‌کردم.* Das Wort allein macht das Verb nicht zur Gewohnheitsform; das leistet das Verb selbst, wie Sie unten sehen werden.'
    example_gloss: Früher habe ich in Herat gewohnt.
  prs.a2.unit23.lesson01.teach.now:
    title: Jetzt
    gloss: jetzt, zurzeit
    note: '*حالا* bedeutet „jetzt“ und ist die andere Hälfte jedes Gegensatzes zwischen früher und heute. Nach *حالا* steht das einfache Präsens: *حالا در کابل زندگی می‌کنم.*'
    example_gloss: Jetzt wohne ich in Kabul.
  prs.a2.unit23.lesson01.teach.every_day:
    title: Jeden Tag
    gloss: jeden Tag
    note: '*هر* bedeutet „jeder“ und *روز* „Tag“. *هر روز* ist der eindeutigste Zeitausdruck für eine wiederholte Gewohnheit, in der Vergangenheit wie in der Gegenwart.'
    example_gloss: Jeden Tag ging ich zur Schule.
  prs.a2.unit23.lesson01.teach.always:
    title: Immer
    gloss: immer
    note: '*همیشه* bedeutet „immer“. Wie *هر روز* passt es gut zu einer Gewohnheit und zeigt den Zuhörenden, dass sich etwas immer wieder ereignet hat.'
    example_gloss: Ich habe immer mit meinen Freunden gespielt.
  prs.a2.unit23.lesson01.teach.when_small:
    title: Als ich klein war
    gloss: als ich klein war, als ich ein Kind war
    note: '*وقتی* bedeutet „als“, *کوچک* „klein“ und *بودم* „ich war“. Zusammen ist *وقتی کوچک بودم* die übliche Einleitung für eine Geschichte aus der Kindheit.'
  prs.a2.unit23.lesson01.teach.school:
    title: Schule
    gloss: Schule
    note: '*مکتب* ist das alltägliche afghanische Wort für „Schule“. Ein Schüler heißt *شاگرد*, aber hier brauchen Sie nur *مکتب*.'
    example_gloss: Ich gehe jeden Tag zur Schule.
  prs.a2.unit23.lesson01.teach.on_foot:
    title: Zu Fuß
    gloss: zu Fuß
    note: '*پیاده* bedeutet „zu Fuß“. Es steht vor dem Verb: *پیاده به مکتب می‌رفتم* heißt „Ich ging zu Fuß zur Schule“.'
    example_gloss: Ich gehe zu Fuß zur Schule.
  prs.a2.unit23.lesson01.teach.cities:
    title: Herat, Kabul
    gloss: Herat, Kabul
    note: '*هرات* und *کابل* sind zwei afghanische Städte. Städte stehen mit *در* („in“): *در هرات* heißt „in Herat“, *در کابل* „in Kabul“.'
    example_gloss:
    - Er oder sie ist in Herat.
    - Wir sind in Kabul.
  prs.a2.unit23.lesson01.teach.to_live:
    title: Leben, wohnen
    gloss: leben, wohnen
    note: '*زندگی کردن* bedeutet „leben, wohnen“ im Sinne von „an einem Ort leben“. *زندگی* ist „das Leben“, und *کردن* ist das Verb, das die Endungen trägt: *زندگی می‌کنم* heißt „ich wohne“.'
    example_gloss: Wir wohnen in Kabul.
  prs.a2.unit23.lesson01.teach.go_paradigm:
    title: 'Die Vergangenheit der Gewohnheit: می + Vergangenheitsstamm + Endungen'
    gloss: ich ging (früher), du gingst (früher), er/sie ging (früher), wir gingen (früher), ihr/Sie gingen (früher; formell oder Plural), sie gingen (früher)
    note: 'Um zu sagen, was früher immer wieder geschah, setzen Sie *می‌* vor den Vergangenheitsstamm und fügen dieselben Endungen an, die Sie aus der einfachen Vergangenheit kennen. Der Vergangenheitsstamm von *رفتن* („gehen“) ist *رفت* (das letzte *ن* fällt weg). Also: *می‌رفتم* (ich ging früher), *می‌رفتی* (du, zu einem Freund), *می‌رفت* (er oder sie), *می‌رفتیم* (wir), *می‌رفتین* (Sie, formell, oder ihr) und *می‌رفتند* (sie). Vergleichen Sie die einfache Vergangenheit *رفتم*, ein einmaliges, abgeschlossenes Ereignis, und das Präsens *می‌روم* mit dem Präsensstamm *رو*. Die Gewohnheitsvergangenheit lässt sich im Deutschen auch mit „ich ging immer“, „ich pflegte zu gehen“ oder einfach mit dem Präteritum und einem Zeitwort wiedergeben. Das Pronomen (*من، تو، او*) ist optional, da die Endung schon zeigt, wer gemeint ist. Verwechseln Sie *می‌رفتم* nicht mit *می‌روم*: Vor der Endung ändert sich nur ein Buchstabe, aber das erste ist Vergangenheit und das zweite Gegenwart.'
  prs.a2.unit23.lesson01.teach.do_forms:
    title: 'Gleiche Regel, neues Verb: tun, machen'
    gloss: ich tat (früher), du tatest (früher), er/sie tat (früher), wir taten (früher), ihr/Sie taten (früher; formell oder Plural), sie taten (früher)
    note: '*کردن* („tun, machen“) hat den Vergangenheitsstamm *کرد*. Die Gewohnheitsvergangenheit lautet *می‌کردم، می‌کردی، می‌کرد، می‌کردیم، می‌کردین، می‌کردند*. Dieses Verb ist sehr nützlich, denn viele Dari-Verben bestehen aus einem Nomen plus *کردن*: *زندگی کردن* (leben), *بازی کردن* (spielen), *کار کردن* (arbeiten). *می‌* und die Endung stehen immer bei *کردن*, nie beim Nomen: *زندگی می‌کردم*, „ich wohnte früher“.'
  prs.a2.unit23.lesson01.teach.zwnj:
    title: 'Schreibung: Nach می‌ und نمی‌ steht ein Halbleerzeichen'
    gloss: ich ging (früher) und ich ging (früher) nicht
    note: 'In der Schrift sind *می‌* und *نمی‌* eigene Präfixe, deshalb folgt ihnen ein Zero-Width-Non-Joiner (ZWNJ, das „Halbleerzeichen“): *می‌رفتم*, *نمی‌رفتم*. Sie verbinden sich nicht mit dem Verb und werden auch nicht durch ein volles Leerzeichen getrennt. Wenn Sie auf einer persischen Tastatur schreiben, verwenden Sie nach *می* und *نمی* die Halbleerzeichen-Taste (oft Umschalt plus Leertaste). Dasselbe Halbleerzeichen steht beim Plural *ها* und in *آن‌ها*.'
  prs.a2.unit23.lesson02.teach.eat_paradigm:
    title: 'Gleiche Regel, neues Verb: essen'
    gloss: ich aß (früher), du aßest (früher), er/sie aß (früher), wir aßen (früher), ihr/Sie aßen (früher; formell oder Plural), sie aßen (früher)
    note: 'Die Regel von *رفتن* gilt für regelmäßige Verben. *خوردن* („essen“) verliert sein *ن* und ergibt den Vergangenheitsstamm *خورد*. Setzen Sie *می‌* davor und fügen Sie die Endungen an: *می‌خوردم، می‌خوردی، می‌خورد، می‌خوردیم، می‌خوردین، می‌خوردند*. Die Form für „er/sie“ ist der bloße Stamm mit *می‌*, also bedeutet *می‌خورد* „er oder sie aß früher“.'
  prs.a2.unit23.lesson02.teach.tea:
    title: Tee
    gloss: Tee
    note: '*چای* ist „Tee“, das Getränk, das Afghaninnen und Afghanen zu fast jeder Mahlzeit trinken. *چای می‌خوری* heißt „du trinkst Tee“, mit dem Verb *خوردن*.'
    example_gloss: Jeden Morgen trank ich Tee.
  prs.a2.unit23.lesson02.teach.morning:
    title: Morgen
    gloss: Morgen, morgens
    note: '*صبح* bedeutet „Morgen“. *هر روز صبح* heißt „jeden Morgen“ und *هر شب* „jede Nacht“ bzw. „jeden Abend“.'
    example_gloss: Jeden Morgen ging ich zur Schule.
  prs.a2.unit23.lesson02.teach.night:
    title: Nacht
    gloss: Nacht, Abend
    note: '*شب* bedeutet „Nacht“ oder „Abend“. *هر شب* heißt „jeden Abend“ bzw. „jede Nacht“. Es ist ein Wiederholungswort aus den Einheiten zum Tagesablauf.'
    example_gloss: Jeden Abend las ich ein Buch.
  prs.a2.unit23.lesson02.teach.book:
    title: Buch
    gloss: Buch
    note: '*کتاب* ist „das Buch“. Mit *خواندن* („lesen“) sagen Sie *کتاب خواندن*, „ein Buch lesen“. Mit demselben Verb sagen Sie auch *درس خواندن*, „lernen, studieren“.'
    example_gloss: Ich las ein Buch.
  prs.a2.unit23.lesson02.teach.football:
    title: Fußball spielen
    gloss: Fußball spielen
    note: '*بازی کردن* bedeutet „spielen“, und *فوتبال* ist „Fußball“. Wie bei anderen Verben aus „Nomen plus *کردن*“ stehen *می‌* und die Endung bei *کردن*: *فوتبال بازی می‌کردم*.'
    example_gloss: Ich spielte mit meinen Freunden Fußball.
  prs.a2.unit23.lesson02.teach.after_school:
    title: Nach der Schule
    gloss: nach der Schule
    note: '*بعد از* bedeutet „nach“ und wird von einem Nomen gefolgt: *بعد از مکتب* heißt „nach der Schule“.'
    example_gloss: Nach der Schule kam ich nach Hause.
  prs.a2.unit23.lesson02.teach.friends:
    title: Meine Freunde
    gloss: meine Freunde
    note: '*دوستان* bedeutet „Freunde“, und *-م* fügt „mein“ hinzu: *دوستانم* heißt „meine Freunde“, ein Wiederholungswort. „Mit“ heißt *با*: *با دوستانم*.'
    example_gloss: Meine Freunde kamen zu uns nach Hause.
  prs.a2.unit23.lesson02.teach.more_verbs:
    title: Vier weitere Verben, eine Regel
    gloss: sehen, tun, kommen, lesen in der Vergangenheit der Gewohnheit
    note: 'Jedes regelmäßige Verb bildet dieselbe Form: Streichen Sie das *ن* des Infinitivs und setzen Sie *می‌* vor den Vergangenheitsstamm mit den Endungen. *دیدن* („sehen“) ergibt *می‌دیدم*. *کردن* („tun, machen“) ergibt *می‌کردم*. *آمدن* („kommen“) ergibt *می‌آمدم*; der Vergangenheitsstamm *آمد* behält nach *می‌* sein langes *آ*, Sie schreiben also *می‌آمدم*, nie *می‌امدم*. *خواندن* („lesen, studieren“) ergibt *می‌خواندم*. Gesprochenes und geschriebenes Dari verwenden diese Form.'
  prs.a2.unit23.lesson02.teach.be_have:
    title: Sein und haben in der Vergangenheit
    gloss: ich war, du warst, er/sie war, wir waren, ihr/Sie wart (formell oder Plural), sie waren; ich hatte, du hattest, ...
    note: 'Die Vergangenheit von *بودن* („sein“) lautet *بودم، بودی، بود، بودیم، بودین، بودند*, die von *داشتن* („haben“) *داشتم، داشتی، داشت، داشتیم، داشتین، داشتند*. Diese beiden Verben beschreiben Zustände; sie sind also schon die Formen für „früher war ich“ und „früher hatte ich“, und Sie setzen normalerweise kein *می‌* davor: *وقتی کوچک بودم، یک بایسکل داشتم* heißt „Als ich klein war, hatte ich ein Fahrrad“.'
  prs.a2.unit23.lesson02.teach.bicycle:
    title: Fahrrad
    gloss: Fahrrad
    note: '*بایسکل* ist das afghanische Wort für „Fahrrad“. *یک* bedeutet „ein“ oder „eins“.'
    example_gloss: Als ich klein war, hatte ich ein Fahrrad.
  prs.a2.unit23.lesson03.teach.contrast:
    title: Ein Ereignis, eine Gewohnheit oder jetzt
    gloss: Eines Tages ging ich zum Basar. Jeden Tag ging ich zur Schule. Jetzt gehe ich ins Büro.
    note: 'Drei Verbformen können ähnlich aussehen, fragen Sie sich daher, was der Satz aussagt. Handelt es sich um EIN abgeschlossenes Ereignis, verwenden Sie die einfache Vergangenheit: *یک روز به بازار رفتم* (eines Tages ging ich zum Basar). Handelt es sich um etwas, das in der Vergangenheit immer wieder geschah, verwenden Sie *می‌* plus Vergangenheitsstamm: *هر روز به مکتب می‌رفتم* (jeden Tag ging ich zur Schule). Gilt es jetzt, verwenden Sie *می‌* plus Präsensstamm: *حالا به دفتر می‌روم* (jetzt gehe ich ins Büro). Zeitwörter helfen: *یک روز، دیروز* passen zur einfachen Vergangenheit; *هر روز، همیشه، قبلاً* passen zur Gewohnheitsvergangenheit; *حالا* passt zur Gegenwart.'
  prs.a2.unit23.lesson03.teach.one_day:
    title: Eines Tages
    gloss: eines Tages, einmal
    note: '*یک روز* bedeutet „eines Tages“. Es leitet EIN Ereignis in der Vergangenheit ein, daher steht das Verb in der einfachen Vergangenheit ohne *می‌*.'
    example_gloss: Eines Tages ging ich zum Basar.
  prs.a2.unit23.lesson03.teach.yesterday:
    title: Gestern
    gloss: gestern
    note: '*دیروز* bedeutet „gestern“. Es verweist auf einen einzelnen abgeschlossenen Tag, daher steht das Verb in der einfachen Vergangenheit: *دیروز به دفتر رفتم*.'
    example_gloss: Gestern ging ich ins Büro.
  prs.a2.unit23.lesson03.teach.office:
    title: Büro
    gloss: Büro
    note: '*دفتر* ist „das Büro“, ein Arbeitsplatz. Man geht dorthin mit *به*.'
    example_gloss: Jetzt gehe ich jeden Tag ins Büro.
  prs.a2.unit23.lesson03.teach.bus:
    title: Bus
    gloss: Bus
    note: '*بس* ist das afghanische Wort für „Bus“. „Mit“ heißt *با*: *با بس* bedeutet „mit dem Bus“.'
    example_gloss: Ich fahre mit dem Bus ins Büro.
  prs.a2.unit23.lesson03.teach.neg_paradigm:
    title: 'Die verneinte Vergangenheit der Gewohnheit: نمی + Vergangenheitsstamm'
    gloss: ich ging (früher) nicht, du gingst (früher) nicht, er/sie ging (früher) nicht, wir gingen (früher) nicht, ihr/Sie gingen (früher) nicht (formell oder Plural), sie gingen (früher) nicht
    note: 'Um zu sagen, dass etwas früher NICHT regelmäßig geschah, setzen Sie *نمی‌* statt *می‌*: *نمی‌رفتم* (ich ging früher nicht, ich ging nie), *نمی‌رفتی، نمی‌رفت، نمی‌رفتیم، نمی‌رفتین، نمی‌رفتند*. Verwechseln Sie das nicht mit der einfachen verneinten Vergangenheit *نرفتم*, die besagt, dass ein einzelnes abgeschlossenes Ereignis nicht stattfand. Vergleichen Sie: *دیروز به مکتب نرفتم* (gestern ging ich nicht zur Schule) und *جمعه به مکتب نمی‌رفتم* (freitags ging ich nicht zur Schule, als Gewohnheit). Schreiben Sie es mit dem Halbleerzeichen: *نمی‌*.'
  prs.a2.unit23.lesson03.teach.no_longer:
    title: 'Nicht mehr: دیگر + Verneinung'
    gloss: Ich spiele nicht mehr Fußball.
    note: '*دیگر* mit einem verneinten Verb bedeutet „nicht mehr“: *دیگر فوتبال بازی نمی‌کنم* heißt „Ich spiele nicht mehr Fußball“. Das Verb steht im verneinten Präsens *نمی‌کنم*, weil der Satz von jetzt handelt. Für etwas, das Sie früher taten und aufgegeben haben, verbindet man oft beide Hälften: *قبلاً هر روز فوتبال بازی می‌کردم، ولی دیگر بازی نمی‌کنم* (Früher habe ich jeden Tag Fußball gespielt, aber jetzt spiele ich nicht mehr).'
  prs.a2.unit23.lesson04.teach.neighbourhood:
    title: Viertel
    gloss: Viertel, Stadtteil
    note: '*محله* ist das „Viertel“, der Teil der Stadt, in dem man wohnt. *قدیمی* bedeutet „alt“.'
    example_gloss: Unser Haus stand in einem alten Viertel.
  prs.a2.unit23.lesson04.teach.old:
    title: Alt
    gloss: alt (bei Orten oder Dingen)
    note: '*قدیمی* bedeutet „alt“ und bezieht sich auf Dinge und Orte, die es schon lange gibt. Es steht nach dem Nomen: *محلهٔ قدیمی*.'
    example_gloss: Wir hatten ein altes Haus.
  prs.a2.unit23.lesson04.teach.neighbours:
    title: Nachbarn
    gloss: Nachbarn
    note: '*همسایه* bedeutet „Nachbar“. Der Plural wird mit Halbleerzeichen geschrieben: *همسایه‌ها*. Nachbarn sind ein wichtiger Teil des Lebens in einem afghanischen Viertel.'
    example_gloss: Die Nachbarn kamen immer zu uns nach Hause.
  prs.a2.unit23.lesson04.teach.grandmother:
    title: Großmutter
    gloss: Großmutter
    note: '*مادرکلان* ist „die Großmutter“, das übliche Wort. *-م* fügt „mein“ hinzu: *مادرکلانم* heißt „meine Großmutter“.'
    example_gloss: Freitags besuchten wir immer meine Großmutter.
  prs.a2.unit23.lesson04.teach.fridays:
    title: Freitags
    gloss: freitags, jeden Freitag
    note: '*جمعه‌ها* (Freitage, mit Halbleerzeichen) bedeutet „jeden Freitag“. Es ist eine weitere Möglichkeit auszudrücken, dass etwas immer wieder geschah.'
    example_gloss: Freitags gingen wir immer in den Park.
  prs.a2.unit23.lesson04.teach.shop:
    title: Laden
    gloss: Geschäft
    note: '*دوکان* ist das afghanische Wort für „Laden“. *در دوکان کار کردن* bedeutet „in einem Laden arbeiten“.'
    example_gloss: Früher habe ich in einem Laden gearbeitet.
  prs.a2.unit23.lesson04.teach.where_before:
    title: Wo hast du früher gewohnt?
    gloss: Wo hast du früher gewohnt?
    note: '*کجا* bedeutet „wo“. Ein Freund fragt *قبلاً کجا زندگی می‌کردی؟* mit der Vergangenheitsform für Gewohnheiten in der du-Form. Zu jemandem, den Sie nicht gut kennen, sagen Sie *می‌کردین*.'
  prs.a2.unit23.lesson05.teach.street:
    title: Straße
    gloss: Straße, Weg
    note: '*سرک* ist das afghanische Wort für „Straße“. Man spielt oder geht *در سرک*, also auf der Straße.'
    example_gloss: Wir haben früher auf der Straße gespielt.
  prs.a2.unit23.lesson05.teach.yes:
    title: Ja
    gloss: ja
    note: '*بلی* bedeutet im Dari „ja“, das Gegenteil ist *نخیر* („nein“). Mit *بلی* antworten Sie auf eine Ja-Nein-Frage.'
    example_gloss: Ja, ich bin jeden Tag hingegangen.
  prs.a2.unit23.lesson05.teach.but:
    title: Aber
    gloss: aber
    note: '*ولی* stellt zwei Dinge einander gegenüber. In einer Geschichte über früher und heute verbindet es oft, was früher üblich war, mit dem, was jetzt anders ist.'
    example_gloss: Früher bin ich hingegangen, aber jetzt nicht mehr.
  prs.a2.unit23.lesson05.teach.read_text:
    title: Eine Kindheit in Herat
    gloss: Als ich klein war, lebten wir in Herat. Unser Haus lag in einem alten Viertel. Jeden Morgen ging ich zu Fuß zur Schule. Nach der Schule spielte ich mit meinen Freunden auf der Straße Fußball. Freitags besuchten wir immer meine Großmutter. Jetzt lebe ich in Kabul und fahre mit dem Bus ins Büro. Ich spiele nicht mehr Fußball.
    note: 'Ein kurzer Text über eine Kindheit in Herat. Beachten Sie den Wechsel: Die Vergangenheitsform für Gewohnheiten (*می‌رفتم، بازی می‌کردم، می‌رفتیم*) beschreibt das frühere Leben, die Gegenwart (*زندگی می‌کنم، می‌روم*) das Leben heute. Der letzte Satz, *دیگر فوتبال بازی نمی‌کنم*, sagt, was aufgehört hat.'
  prs.a2.unit23.lesson05.teach.audio_q:
    title: Salima fragt Javid nach der Schule
    gloss: Javid, bist du jeden Tag zur Schule gegangen?
    note: Salima fragt nach einer früheren Gewohnheit, mit der Vergangenheitsform für Gewohnheiten in der du-Form, *می‌رفتی*. Es ist eine Ja-Nein-Frage.
  prs.a2.unit23.lesson05.teach.audio_a:
    title: Javid antwortet
    gloss: Ja, ich bin jeden Tag zu Fuß hingegangen, aber freitags bin ich nicht gegangen.
    note: 'Javid sagt zuerst, was er gewöhnlich tat, dann, was er nicht tat: *جمعه نمی‌رفتم*. Die verneinte Form *نمی‌رفتم* zeigt, dass er freitags nie hinging.'
  prs.a2.unit23.lesson06.teach.turn01:
    title: Salima fragt Javid, wo er früher gewohnt hat
    gloss: Javid, wo hast du früher gewohnt?
    note: Salima fragt mit *می‌کردی* nach der Vergangenheit, der Vergangenheitsform für Gewohnheiten in der du-Form.
  prs.a2.unit23.lesson06.teach.turn02:
    title: Javid beschreibt seine Kindheit
    gloss: Als ich klein war, lebten wir in Herat. Jeden Tag ging ich zu Fuß zur Schule, und nach der Schule spielte ich mit meinen Freunden Fußball.
    note: 'Javid verwendet die Vergangenheitsform für Gewohnheiten für alles, was sich immer wiederholte: *زندگی می‌کردیم، می‌رفتم، بازی می‌کردم*.'
  prs.a2.unit23.lesson06.teach.turn03:
    title: Salima fragt nach der Gegenwart
    gloss: Spielst du jetzt auch Fußball?
    note: '*حالا هم* fragt nach der Gegenwart: „jetzt auch?“ Das Verb wechselt zu *می‌کنی* (Präsens, du).'
  prs.a2.unit23.lesson06.teach.turn04:
    title: Javid sagt, was sich geändert hat
    gloss: Nein, ich spiele nicht mehr Fußball. Jetzt lebe ich in Kabul und fahre mit dem Bus ins Büro. Und du?
    note: '*دیگر ... نمی‌کنم* bedeutet „nicht mehr“. Der Rest seiner Antwort steht im Präsens, denn es geht um das Jetzt. *تو چطور؟* ist eine kurze Art zu fragen: „Und du?“'
  prs.a2.unit23.lesson06.teach.turn05:
    title: Salima erzählt von ihrer früheren Arbeit
    gloss: Früher habe ich in einem Laden gearbeitet, aber jetzt arbeite ich in einem Büro.
    note: Salima stellt die Vergangenheitsform für Gewohnheiten *کار می‌کردم* dem Präsens *کار می‌کنم* gegenüber, verbunden durch *ولی*.
  prs.a2.unit23.lesson06.teach.turn06:
    title: Javid reagiert
    gloss: Wie schön!
    note: '*چه خوب!* ist eine freundliche Reaktion auf gute Neuigkeiten.'
