teaching:
  prs.a2.unit36.lesson01.errands_and_for.teach.friends:
    title: Faroozan und Arif
    gloss: Das ist Faroozan. Das ist Arif. Sie sind Freunde.
    note: '*فروزان* und *عارف* sind zwei Freunde, die in den Gesprächen und Beispielen dieser Einheit vorkommen. Faroozan ist eine Frau und Arif ist ein Mann.'
  prs.a2.unit36.lesson01.errands_and_for.teach.post:
    title: Postamt
    gloss: Post
    note: '*پُسته خانه* ist die Post. Man geht dorthin, um einen Brief oder ein Paket zu schicken.'
    example_gloss: Die Post ist in der Nähe.
  prs.a2.unit36.lesson01.errands_and_for.teach.letter:
    title: Der Brief
    gloss: der Brief
    note: '*نامه* ist ein Brief. Einen Brief schickt man mit *را*: *نامه را می‌فرستم*.'
    example_gloss: Der Brief ist auf der Post.
  prs.a2.unit36.lesson01.errands_and_for.teach.bank:
    title: Bank
    gloss: Bank
    note: '*بانک* ist eine Bank. Man geht dorthin, um Geld (*پول*) abzuheben oder einzuzahlen.'
    example_gloss: Die Bank ist auf dem Markt.
  prs.a2.unit36.lesson01.errands_and_for.teach.send:
    title: Schicken
    gloss: senden; schicken
    note: '*فرستادن* heißt schicken. Es ist auch der Infinitiv, den man nach *برای* verwendet: *برای فرستادن نامه* heißt um einen Brief zu schicken.'
    example_gloss: Einen Brief zu schicken ist einfach.
  prs.a2.unit36.lesson01.errands_and_for.teach.shopping:
    title: Einkaufen
    gloss: Einkauf, Einkäufe
    note: '*خرید* ist der Einkauf, die Dinge, die man kauft. *خرید دارم* heißt ich habe Einkäufe zu erledigen.'
    example_gloss: Heute habe ich viele Einkäufe.
  prs.a2.unit36.lesson01.errands_and_for.teach.for_noun:
    title: 'برای + Nomen: wofür man etwas tut'
    gloss: Ich gehe zum Einkaufen auf den Markt. Ich komme zur Arbeit nach Kabul. Ich gehe zur Erholung nach Hause.
    note: 'Setzen Sie *برای* vor ein Nomen, um zu sagen, wofür man etwas tut: *برای خرید* (zum Einkaufen), *برای کار* (zur Arbeit), *برای استراحت* (zur Erholung). Der Ort bleibt mit *به*: *به بازار می‌روم*. Das Nomen nach *برای* gibt also schon den Zweck an, ähnlich wie im Deutschen „zum Einkaufen“ oder „für die Arbeit“.'
  prs.a2.unit36.lesson01.errands_and_for.teach.for_inf:
    title: 'برای + Infinitiv: um etwas zu tun'
    gloss: Um einen Brief zu schicken, gehe ich zur Post. Um Brot zu kaufen, gehe ich zum Laden. Um Geld zu bekommen, gehe ich zur Bank.
    note: 'Um zu sagen, wozu man etwas tut, setzt man den Infinitiv nach *برای*: *فرستادن* (schicken), *خریدن* (kaufen), *گرفتن* (nehmen, bekommen). Der Infinitiv endet auf *ن*. Was man schickt, kauft oder nimmt, steht nach dem Infinitiv: *فرستادن نامه*, *خریدن نان*, *گرفتن پول*.'
  prs.a2.unit36.lesson01.errands_and_for.teach.order_question:
    title: Der Zweck kann am Ende stehen; Fragen nach dem Wozu
    gloss: Ich gehe zur Bank, um Geld zu bekommen. Wozu gehst du zur Bank?
    note: 'Der Zweck kann auch am Ende stehen: *به بانک می‌روم برای گرفتن پول*. Um nach dem Wozu zu fragen, sagt man *برای چه؟*: *برای چه به بانک می‌روی؟* heißt Wozu gehst du zur Bank? Man antwortet mit *برای* und einem Nomen oder einem Infinitiv.'
  prs.a2.unit36.lesson01.errands_and_for.teach.sentence:
    title: Um einen Brief zu schicken, gehe ich zur Post
    gloss: Um einen Brief zu schicken, gehe ich zur Post.
    note: 'Das ist das Muster der ersten Lektion: zuerst *برای* + Infinitiv, dann der Ort mit *به*, am Ende das Verb.'
  prs.a2.unit36.lesson02.for_that_subjunctive.teach.subj_form:
    title: 'Der Subjunktiv: ب + Präsensstamm + Endung'
    gloss: dass ich kaufe, dass ich gehe, dass ich nehme, dass ich schicke, dass ich lese, dass ich sehe, dass ich komme, dass ich bringe
    note: 'Der Subjunktiv ist die Verbform, die nach *برای اینکه* und *تا* steht. Man bildet sie aus dem Präsensstamm: Man setzt *ب-* davor und fügt die Personalendung an. Für „ich“ lautet die Endung *-م*: *بخرم* (dass ich kaufe), *بروم* (dass ich gehe), *بگیرم* (dass ich nehme). Es ist dieselbe Form, die Sie schon aus *می‌خواهم بروم* und *باید بیایم* kennen. Zwei Formen werden anders geschrieben und lernt man am besten als Ganzes: *بیایم* (von *آمدن*) und *بیاورم* (von *آوردن*).'
  prs.a2.unit36.lesson02.for_that_subjunctive.teach.subj_paradigm:
    title: Die sechs Personen des Subjunktivs
    gloss: dass ich kaufe, dass du kaufst, dass er oder sie kauft, dass wir kaufen, dass ihr/Sie kaufen (förmlich oder Plural), dass sie kaufen
    note: 'Die Endungen sind *-م، -ی، -د، -یم، -ین، -ند*. Die Endung für „ihr/Sie“ (förmlich oder Plural) ist *-ین*, wie überall in diesem Kurs. Der Subjunktiv hat kein *می‌*: Vergleichen Sie *می‌خرم* (ich kaufe) mit *بخرم* (dass ich kaufe).'
  prs.a2.unit36.lesson02.for_that_subjunctive.teach.for_that:
    title: 'برای اینکه + Subjunktiv: damit ich etwas tue'
    gloss: Damit ich Brot kaufe, gehe ich zum Laden. Damit ich Geld bekomme, gehe ich zur Bank.
    note: '*برای اینکه* bedeutet damit. Es leitet einen Nebensatz mit eigenem Subjunktiv-Verb ein, und das Verb zeigt die Person: *برای اینکه نان بخرم* heißt damit ich Brot kaufe. Der Hauptsatz sagt, was man tut. Wo das Deutsche oft „um … zu kaufen“ sagt, kann Dari damit ich kaufe sagen. Die beiden Teilsätze können die Plätze tauschen: *به دوکان می‌روم برای اینکه نان بخرم*.'
  prs.a2.unit36.lesson02.for_that_subjunctive.teach.more_verbs:
    title: Weitere Beispiele und zweiteilige Verben
    gloss: Um einen Brief zu schicken, gehe ich zur Post. Um meinen Freund zu sehen, fahre ich nach Kabul. Um zu sparen, gehe ich zu Fuß.
    note: 'Dieselbe Regel gilt für jedes Verb. Bei einem zweiteiligen Verb wie *پس‌انداز کردن* ändert sich nur der Verbteil, und es gibt kein *ب-*: *پس‌انداز کنم* (dass ich spare), *کار کنم* (dass ich arbeite). Was man sieht oder nimmt, steht mit *را* vor dem Verb: *دوستم را ببینم*.'
  prs.a2.unit36.lesson02.for_that_subjunctive.teach.sentence:
    title: Um Brot zu kaufen, gehe ich zum Laden
    gloss: Um Brot zu kaufen, gehe ich zum Laden.
    note: 'Vergleichen Sie mit Lektion 1: *برای خریدن نان* (Infinitiv) und *برای اینکه نان بخرم* (Nebensatz mit Subjunktiv) sagen dasselbe.'
  prs.a2.unit36.lesson03.ta_and_negative.teach.ta:
    title: 'تا + Subjunktiv: die Kurzform'
    gloss: Ich gehe zum Laden, damit ich Brot kaufe. Ich gehe zur Bank, damit ich Geld bekomme. Ich gehe zur Post, damit ich einen Brief schicke.
    note: '*تا* ist eine Kurzform von *برای اینکه*. Es steht nach dem Hauptsatz und wird von einem Subjunktiv-Verb gefolgt: *به دوکان می‌روم تا نان بخرم*. *تا* hat auch andere Bedeutungen, zum Beispiel bis in *تا ساعت ده*. Wenn ein Subjunktiv-Verb mit *ب-* folgt, bedeutet es damit.'
  prs.a2.unit36.lesson03.ta_and_negative.teach.persons:
    title: 'Andere Personen: wir, er, sie'
    gloss: Wir gehen, damit wir Brot kaufen. Er geht, damit er einen Brief schickt. Sie gehen, damit sie Geld bekommen.
    note: 'Beide Verben stehen in derselben Person, wenn das Subjekt gleich ist: *می‌رویم* und *بخریم* enden beide auf *-یم* (wir). Die Endungen des Subjunktivs sind *-م، -ی، -د، -یم، -ین، -ند*, also ist *بفرستد* dass er oder sie schickt und *بگیرند* dass sie nehmen.'
  prs.a2.unit36.lesson03.ta_and_negative.teach.negative:
    title: 'Die Verneinung: ن + Stamm'
    gloss: Ich gehe früh los, damit ich nicht zu spät komme. Damit ich nicht zu spät komme, gehe ich früh los.
    note: 'Um zu sagen, was man vermeiden will, setzt man *ن-* vor den Stamm und lässt das *ب-* weg: *برسم* (dass ich ankomme) wird zu *نرسم* (dass ich nicht ankomme). Der Hauptsatz sagt, was man dafür tut: *زود می‌روم*.'
  prs.a2.unit36.lesson03.ta_and_negative.teach.negative_two_word:
    title: Die Verneinung zweiteiliger Verben
    gloss: Ich lege mein Geld auf die Bank, damit ich es nicht verliere.
    note: 'Bei einem zweiteiligen Verb steht *ن-* am Verbteil: *گم کنم* (dass ich verliere) wird zu *گم نکنم* (dass ich nicht verliere). *آن را* (es) verweist auf das Geld.'
  prs.a2.unit36.lesson03.ta_and_negative.teach.sentence:
    title: Ich gehe früh los, damit ich nicht zu spät komme
    gloss: Ich gehe früh los, damit ich nicht zu spät komme.
    note: '*تا دیر نرسم* nennt, was man nicht will, und *زود می‌روم* ist das, was man dagegen tut.'
  prs.a2.unit36.lesson04.learning_and_saving.teach.lesson:
    title: Lektion, Lernen
    gloss: Lektion, Unterricht
    note: '*درس* bedeutet Lektion oder Unterrichtsstunde. Mit *خواندن* heißt es lernen bzw. studieren: *درس خواندن*.'
    example_gloss: Der Englischunterricht ist um vier Uhr.
  prs.a2.unit36.lesson04.learning_and_saving.teach.exam:
    title: Prüfung
    gloss: Prüfung, Test
    note: '*امتحان* ist eine Prüfung. Man legt die Prüfung ab und bekommt eine Note (*نمبر*).'
    example_gloss: Die Prüfung ist morgen.
  prs.a2.unit36.lesson04.learning_and_saving.teach.learn:
    title: Lernen
    gloss: lernen
    note: '*یاد گرفتن* bedeutet lernen. *یاد* ist der erste Teil, *گرفتن* ist das Verb. Der Konjunktiv für „ich“ lautet *یاد بگیرم*, mit *ب-* vor *گیر*.'
    example_gloss: Ich lerne Englisch.
  prs.a2.unit36.lesson04.learning_and_saving.teach.study:
    title: Studieren
    gloss: studieren
    note: '*درس خواندن* bedeutet lernen (für die Schule oder Uni). *می‌خوانم* heißt „ich lese“ oder „ich lerne“. درس bleibt davor, wie in *درس می‌خوانم*.'
    example_gloss: Jeden Abend lerne ich.
  prs.a2.unit36.lesson04.learning_and_saving.teach.expensive:
    title: Teuer
    gloss: teuer
    note: '*گران* bedeutet teuer. Das Gegenteil ist *ارزان* (billig).'
    example_gloss: Der Kurs ist teuer.
  prs.a2.unit36.lesson04.learning_and_saving.teach.cheap:
    title: Billig
    gloss: billig
    note: '*ارزان* bedeutet billig. Dinge, die *ارزان* sind, helfen Ihnen beim Geldsparen.'
    example_gloss: Das Fahrrad ist billig.
  prs.a2.unit36.lesson04.learning_and_saving.teach.spend:
    title: Geld ausgeben
    gloss: ausgeben (Geld)
    note: '*خرج کردن* bedeutet Geld ausgeben. Bei dem zweiteiligen Verb steht die Verneinung *ن* vor *کردن*: *خرج نکنم* (dass ich nicht ausgebe).'
    example_gloss: Ich gebe nicht viel Geld aus.
  prs.a2.unit36.lesson04.learning_and_saving.teach.for_noun2:
    title: برای + Nomen bei Wörtern für Lernen und Sparen
    gloss: Ich lerne für die Prüfung. Ich spare Geld für den Kurs.
    note: 'Das Muster aus Lektion 1 funktioniert auch mit diesen Wörtern: *برای امتحان* (für die Prüfung), *برای کورس* (für den Kurs). Ein Nomen nach *برای* ist eine kurze Möglichkeit zu sagen, wofür man sich anstrengt.'
  prs.a2.unit36.lesson04.learning_and_saving.teach.learn_clause:
    title: Finalsätze zum Thema Lernen
    gloss: Um Englisch zu lernen, lese ich jeden Abend ein Buch. Um in der Prüfung eine gute Note zu bekommen, lerne ich viel.
    note: 'Verwenden Sie *برای اینکه* oder *تا* mit einem Konjunktiv-Verb, um zu sagen, wozu Sie lernen: *یاد بگیرم* (dass ich lerne), *نمبر خوب بگیرم* (dass ich eine gute Note bekomme). Beide Teilsätze können in beliebiger Reihenfolge stehen.'
  prs.a2.unit36.lesson04.learning_and_saving.teach.save_clause:
    title: Finalsätze zum Thema Geldsparen
    gloss: Ich spare Geld, um ein Fahrrad zu kaufen. Ich kaufe ein billiges Buch, um nicht viel Geld auszugeben.
    note: Beim Sparen sagt der Hauptsatz, was Sie tun, und der *تا*-Satz, wofür. Die Verneinung *خرج نکنم* drückt aus, was nicht geschehen soll.
  prs.a2.unit36.lesson04.learning_and_saving.teach.sentence:
    title: Ich spare, um ein Fahrrad zu kaufen
    gloss: Ich spare Geld, um ein Fahrrad zu kaufen.
    note: Ein kurzer Satz, der zuerst die Handlung und am Ende den Zweck nennt.
  prs.a2.unit36.lesson05.reading_and_listening.teach.narges:
    title: Fozia
    gloss: Fozia ist Faroozans Freundin.
    note: '*فوزیه* ist eine dritte Freundin. Sie schreibt die Nachricht in dieser Lektion. Sie ist nicht dieselbe Person wie Faroozan.'
  prs.a2.unit36.lesson05.reading_and_listening.teach.fare:
    title: 'Das Fahrgeld bezahlen: کرایه دادن'
    gloss: Ich bezahle das Fahrgeld. Ich bezahle das Fahrgeld nicht. Um das Fahrgeld nicht zu bezahlen, gehe ich zu Fuß.
    note: '*کرایه دادن* bedeutet das Fahrgeld für ein Taxi oder einen Bus bezahlen. Das Präsens ist *می‌دهم*, die Verneinung *نمی‌دهم* und der verneinte Konjunktiv *ندهم* (dass ich nicht gebe). *پیاده می‌روم* heißt „ich gehe zu Fuß“.'
  prs.a2.unit36.lesson05.reading_and_listening.teach.errand_turn01:
    title: Faroozan fragt, wohin Arif geht
    gloss: Arif, wohin gehst du heute?
    note: Faroozan fragt *به کجا می‌روی؟* im Präsens *می‌روی*. Sie ist eine Freundin, deshalb verwendet sie *تو*.
  prs.a2.unit36.lesson05.reading_and_listening.teach.errand_turn02:
    title: Arif nennt zwei Besorgungen
    gloss: Zuerst gehe ich zur Post, um diesen Brief aufzugeben. Dann gehe ich zur Bank.
    note: 'Die erste Besorgung hat einen Zweck: *تا این نامه را بفرستم*. *اول* und *بعد* bringen die beiden Besorgungen in eine Reihenfolge.'
  prs.a2.unit36.lesson05.reading_and_listening.teach.errand_turn03:
    title: Faroozan fragt nach der Bank
    gloss: Was hast du in der Bank zu erledigen?
    note: '*چه کار داری؟* fragt, was man an einem Ort zu erledigen hat.'
  prs.a2.unit36.lesson05.reading_and_listening.teach.errand_turn04:
    title: Arif sagt, wozu
    gloss: Ich gehe hin, um Geld abzuheben.
    note: Die kurze Antwort *می‌روم تا پول بگیرم* nennt den Zweck mit *تا* und dem Konjunktiv *بگیرم*.
  prs.a2.unit36.lesson05.reading_and_listening.teach.errand_turn05:
    title: Faroozan fragt, wie er hingeht
    gloss: Fährst du mit dem Auto?
    note: '*با موتر* heißt „mit dem Auto“.'
  prs.a2.unit36.lesson05.reading_and_listening.teach.errand_turn06:
    title: Arif geht zu Fuß, um das Fahrgeld zu sparen
    gloss: Nein, ich gehe zu Fuß, um kein Fahrgeld zu bezahlen.
    note: '*نخیر* heißt „nein“. *تا کرایه ندهم* ist der verneinte Zweck: Er geht zu Fuß, um Geld zu sparen.'
  prs.a2.unit36.lesson05.reading_and_listening.teach.message:
    title: Eine Nachricht über das Geldsparen
    gloss: Hallo Faroozan. Jeden Monat spare ich zweitausend Afghani, um ein Fahrrad zu kaufen. Um kein Fahrgeld zu bezahlen, möchte ich mit dem Fahrrad zur Schule fahren. Morgen gehe ich zur Bank, um mein Geld abzuheben. Fozia
    note: 'Eine kurze Nachricht mit drei Zwecken: *تا یک بایسکل بخرم* (um ein Fahrrad zu kaufen), *برای اینکه کرایه ندهم* (um kein Fahrgeld zu bezahlen) und *تا پولم را بگیرم* (um ihr Geld abzuheben). Fozia verwendet für den Plan das einfache Präsens *می‌روم* mit *فردا*.'
  prs.a2.unit36.lesson06.english_conversation.teach.give_book:
    title: 'Zwei verschiedene Subjekte: Ich gebe, damit du nicht ausgibst'
    gloss: Ich gebe dir mein Buch. Ich gebe dir mein Buch, damit du kein Geld ausgibst.
    note: 'Die beiden Verben können verschiedene Subjekte haben. In *کتابم را به تو می‌دهم تا پول خرج نکنی* ist der Gebende „ich“ (*می‌دهم*) und der, der nicht ausgibt, „du“ (*نکنی*). Der Konjunktiv richtet sich nach seinem eigenen Subjekt: *-ی* für „du“.'
  prs.a2.unit36.lesson06.english_conversation.teach.english_turn01:
    title: Arif fragt, warum Faroozan jeden Abend liest
    gloss: Faroozan, warum liest du jeden Abend ein Buch?
    note: '*می‌خوانی* heißt „du liest“. *چرا* fragt „warum“ und verlangt einen Grund oder einen Zweck.'
  prs.a2.unit36.lesson06.english_conversation.teach.english_turn02:
    title: Faroozan sagt, wofür sie lernt
    gloss: Um Englisch zu lernen.
    note: 'Eine kurze Antwort, die nur aus einem Finalsatz besteht: *برای اینکه انگلیسی یاد بگیرم*. Der Hauptsatz entfällt, weil die Frage ihn schon enthält.'
  prs.a2.unit36.lesson06.english_conversation.teach.english_turn03:
    title: Arif fragt nach dem tieferen Zweck
    gloss: Wozu?
    note: '*برای چه؟* fragt nach dem nächsten Zweck hinter dem ersten.'
  prs.a2.unit36.lesson06.english_conversation.teach.english_turn04:
    title: Faroozan nennt den nächsten Zweck
    gloss: Damit ich in der Prüfung eine gute Note bekomme.
    note: '*تا در امتحان نمبر خوب بگیرم* ist ein eigenständiger *تا*-Satz. *نمبر* ist die Note.'
  prs.a2.unit36.lesson06.english_conversation.teach.english_turn05:
    title: Arif möchte auch lernen
    gloss: Ich möchte auch Englisch lernen, aber der Kurs ist teuer.
    note: '*می‌خواهم انگلیسی بخوانم* verwendet den Konjunktiv *بخوانم* nach *می‌خواهم*.'
  prs.a2.unit36.lesson06.english_conversation.teach.english_turn06:
    title: Faroozan bietet ihr Buch an
    gloss: Ich gebe dir mein Buch, damit du kein Geld ausgibst.
    note: '*تا پول خرج نکنی* hat ein anderes Subjekt als das Hauptverb: Das Buch gibt „ich“, das Geld gibt „du“ nicht aus.'
exercises:
  prs.a2.unit36.lesson01.errands_and_for.exercise01.recognize_send_letter:
    instruction: Was bedeutet dieser Satz?
    correct_option: Ich gehe zur Post, um einen Brief zu verschicken
    distractors:
    - Ich schicke der Bank einen Brief
    - Die Post ist in der Nähe
    - Ich möchte keinen Brief verschicken
    accepted_answers:
    - value: Ich gehe zur Post, um einen Brief zu verschicken
      status: correct
    feedback: '*برای فرستادن نامه* heißt „um einen Brief zu verschicken“ und *به پُسته خانه می‌روم* heißt „ich gehe zur Post“.'
  prs.a2.unit36.lesson01.errands_and_for.exercise02.recognize_shopping:
    instruction: Was bedeutet dieser Satz?
    correct_option: Ich gehe zum Einkaufen auf den Markt
    distractors:
    - Der Markt ist weit vom Haus entfernt
    - Ich gehe nicht auf den Markt
    - Ich habe gestern auf dem Markt Brot gekauft
    accepted_answers:
    - value: Ich gehe zum Einkaufen auf den Markt
