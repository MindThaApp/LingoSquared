course:
  title: Dari A2
  description: 'Afghanisches Dari für Fortgeschrittene auf unterem Niveau: sagen, wozu man etwas tut. Zweck mit برای plus Nomen oder Infinitiv, برای اینکه und تا mit dem Subjunktiv sowie die Verneinung (damit ich nicht ...), für Besorgungen, Lernen und Sparen.'
units:
