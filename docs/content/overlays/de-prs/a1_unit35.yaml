    note: سلام, برای, یا und خوب sind bekannte Wörter, die im Dialog am Schalter vorkommen.
    target_text: سلام (hallo) / برای (für) / یا (oder) / خوب (gut / okay)
  prs.a1.unit35.lesson04.teach.dialogue_line1:
    title: 'Nadia: Hallo, ich möchte eine Briefmarke.'
    gloss: Hallo, ich möchte eine Briefmarke.
  prs.a1.unit35.lesson04.teach.dialogue_line2:
    title: 'Rahim: Für einen Brief oder ein Paket?'
    gloss: Für einen Brief oder ein Paket?
  prs.a1.unit35.lesson04.teach.dialogue_line3:
    title: 'Nadia: Für einen Brief.'
    gloss: Für einen Brief.
  prs.a1.unit35.lesson04.teach.dialogue_line4:
    title: 'Rahim: Wohin geht der Brief?'
    gloss: Wohin geht der Brief?
  prs.a1.unit35.lesson04.teach.dialogue_line5:
    title: 'Nadia: Er geht nach Herat.'
    gloss: Er geht nach Herat.
