    title: 'Wiederholung: Tage und Zahlen'
    gloss: wie viele / Tag / zwei / drei
    note: چند, روز, دو und سه sind bekannte Wörter, mit denen man nach der Lieferzeit fragt.
    target_text: چند (wie viele) / روز (Tag) / دو (zwei) / سه (drei)
  prs.a1.unit35.lesson03.teach.how_many_days_question:
