    title: Ich mag / aber ich habe keine Zeit
    gloss: ich mag / Objektmarkierung / aber / ich habe keine Zeit
    note: دوست دارم, را, اما, وقت und ندارم sind bekannte Formen, die in der Abschlussnachricht verwendet werden.
    target_text: دوست دارم (ich mag) / را (Objektmarker) / اما (aber) / وقت ندارم (ich habe keine Zeit)
  prs.a1.unit35.lesson06.teach.wrap_summary:
    title: Ich mag die Post, aber ich habe keine Zeit
    gloss: Ich mag die Post, aber ich habe keine Zeit.
    note: Das setzt das Muster der letzten A1-Abschlusslektionen mit اما fort.
