    gloss: er/sie / in, an, bei / sehr / glücklich / ist
    note: او ist das dari Pronomen für „er“ oder „sie“; در, بسیار und خوشحال sind Wiederholung.
    target_text: او (er/sie) / در (in/an) / بسیار (sehr) / خوشحال (glücklich) / است (ist)
