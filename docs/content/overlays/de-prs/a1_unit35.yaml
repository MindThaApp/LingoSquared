teaching:
  prs.a1.unit35.lesson01.teach.post_office_word:
    title: Die Post
    gloss: die Post, das Postamt
    note: پُسته خانه ist die in Afghanistan übliche dari Form für „Postamt“.
    example_gloss: Die Post ist in der Nähe.
  prs.a1.unit35.lesson01.teach.stamp_word:
    title: Die Briefmarke
    gloss: die Briefmarke
    note: تکت پُستی ist ein praktischer Ausdruck für Anfänger und bedeutet „Briefmarke“.
    example_gloss: Ich möchte eine Briefmarke.
  prs.a1.unit35.lesson01.teach.letter_word:
    title: Der Brief
    gloss: der Brief
    note: نامه bedeutet „Brief“ oder „schriftliche Nachricht“.
    example_gloss: Der Brief liegt auf dem Tisch.
  prs.a1.unit35.lesson01.teach.parcel_word:
    title: Das Paket
    gloss: das Paket
    note: پارسل wird in der heutigen afghanischen Postsprache für „Paket“ verwendet.
    example_gloss: Das Paket ist nicht groß.
  prs.a1.unit35.lesson01.teach.review_basics:
    title: 'Wiederholung: ein, nah, ist, ich möchte'
    gloss: ein/eine / nah / ist / ich möchte
    note: یک, نزدیک, است und می‌خواهم sind bereits bekannte Formen, die in einfachen Bitten am Schalter vorkommen.
    target_text: یک (ein/eine / eins) / نزدیک (nah) / است (ist) / می‌خواهم (ich möchte)
  prs.a1.unit35.lesson01.teach.want_stamp_phrase:
    title: Ich möchte eine Briefmarke
    gloss: Ich möchte eine Briefmarke.
    note: Verwenden Sie می‌خواهم für eine höfliche, einfache Bitte.
  prs.a1.unit35.lesson01.teach.post_office_near_phrase:
    title: Die Post ist in der Nähe
    gloss: Die Post ist in der Nähe.
    note: Hier kommt نزدیک aus der Lektion über die Nachbarschaft wieder vor.
  prs.a1.unit35.lesson02.teach.send_phrase:
    title: Ich schicke einen Brief ab
    gloss: Ich schicke einen Brief ab.
    note: روان می‌کنم bedeutet wörtlich „ich setze es in Gang“; im Dari ist das eine natürliche Weise, „ich schicke ab“ zu sagen.
  prs.a1.unit35.lesson02.teach.send_parcel_phrase:
    title: Ich schicke ein Paket ab
    gloss: Ich schicke ein Paket ab.
    note: Ersetzen Sie نامه durch پارسل, um die Sendung zu benennen.
  prs.a1.unit35.lesson02.teach.review_question_words:
    title: 'Wiederholung: wo und wohin'
    gloss: wo / nach, zu / Herat / Sie (förmlich)
    note: کجا, به, هرات und شما sind bekannte Wörter, die hier für Fragen nach dem Ziel zusammengestellt sind.
    target_text: کجا (wo) / به (nach / zu) / هرات (Herat) / شما (Sie, formell)
  prs.a1.unit35.lesson02.teach.to_where_question:
    title: Wohin geht der Brief?
    gloss: Wohin geht der Brief?
    note: نامه به کجا می‌رود؟ fragt nach dem Ziel.
  prs.a1.unit35.lesson02.teach.to_herat_answer:
    title: Der Brief geht nach Herat
    gloss: Der Brief geht nach Herat.
    note: به هرات nennt das Ziel.
  prs.a1.unit35.lesson02.teach.can_send_question:
    title: Verschicken Sie Briefe?
    gloss: Verschicken Sie Briefe?
    note: می‌کنین ist die Höflichkeitsform für „Sie“, die in Fragen im öffentlichen Dienst verwendet wird.
  prs.a1.unit35.lesson03.teach.arrive_word:
    title: Es kommt an
    gloss: er/sie/es kommt an
    note: می‌رسد ist die dritte Person und wird gebraucht, wenn ein Brief oder ein Paket ankommt.
    target_text: می‌رسد (es kommt an)
