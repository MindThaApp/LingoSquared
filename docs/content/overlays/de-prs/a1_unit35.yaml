  prs.a1.unit35.lesson03.teach.two_days_answer:
    title: Es kommt in zwei Tagen an
    gloss: Es kommt in zwei Tagen an.
    note: دو روزه bedeutet wörtlich „zweitägig“; zusammen mit می‌رسد heißt es „kommt in zwei Tagen an“.
  prs.a1.unit35.lesson03.teach.three_days_answer:
