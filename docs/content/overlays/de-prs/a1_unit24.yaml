    title: 'Zarmina: Ich fahre mit dem Taxi, es ist direkt und schnell'
    gloss: 'Zarmina: Ich fahre mit dem Taxi, es ist direkt und schnell.'
    note: تیز bedeutet schnell und ist in dieser Zeile neu.
  prs.a1.unit24.lesson04.teach.dialogue_line4:
    title: 'Homayoun: Der Bus ist auch gut, er ist billig'
    gloss: 'Homayoun: Der Bus ist auch gut, er ist billig.'
    note: ارزان bedeutet billig und ist in dieser Zeile neu.
  prs.a1.unit24.lesson04.teach.dialogue_line5:
    title: 'Zarmina: Ja, aber das Taxi ist schneller'
    gloss: 'Zarmina: Ja, aber das Taxi ist schneller.'
    note: اما bedeutet „aber“; تیزتر ist der Komparativ „schneller“.
  prs.a1.unit24.lesson05.teach.reading_passage:
    title: Lesetext über den Weg in die Stadt
    gloss: Zarmina fährt jeden Tag mit dem Taxi in die Stadt. Das Taxi ist schnell, aber nicht billig. Homayoun geht zu Fuß, weil sein Haus nah ist. Er spart Geld für ein Auto.
    note: Ein kurzer Lesetext, der den Wortschatz der Lektion und das Bindewort „چون“ (weil) wiederholt.
