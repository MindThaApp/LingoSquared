course:
  title: Dari A2
  description: 'Dari (Afghanistan) für Fortgeschrittene auf niedrigem Niveau: Gespräche über Online-Gewohnheiten – Wortschatz zu sozialen Medien und Bildschirmzeit, eine einfache Meinung äußern, einen Text über Bildschirmzeit lesen und ein echtes Gespräch zwischen zwei Freunden über ihre eigenen Gewohnheiten.'
