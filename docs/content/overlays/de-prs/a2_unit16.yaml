teaching:
  prs.a2.unit16.lesson01.teach.social_media_word:
    title: Soziale Medien
    gloss: soziale Medien
    note: '*شبکهٔ اجتماعی* bedeutet wörtlich „soziales Netzwerk“.'
    example_gloss: Zarmina schaut jeden Tag in die sozialen Medien.
  prs.a2.unit16.lesson01.teach.video_word:
    title: Video
    gloss: das Video
    note: '*ویدیو* ist ein direktes Lehnwort und wird genauso verwendet wie im Deutschen.'
    example_gloss: Homayoun schaut gern Videos.
  prs.a2.unit16.lesson01.teach.download_word:
    title: Herunterladen
    gloss: herunterladen
    note: '*دانلود کردن* – *دانلود* ist ein Lehnwort und wird mit *کردن* („machen, tun“) verbunden.'
    example_gloss: Ich lade Musik herunter.
  prs.a2.unit16.lesson01.teach.messaging_app_word:
    title: Messenger-App
    gloss: Messenger-App
    note: '*پیام‌رسان* bedeutet wörtlich „Nachrichtenüberbringer“.'
    example_gloss: Ich schicke meinen Freunden mit einer Messenger-App Nachrichten.
  prs.a2.unit16.lesson01.teach.computer_game_word:
    title: Computerspiel
    gloss: Computerspiel
    note: '*بازی کمپیوتری* – *بازی* bedeutet „Spiel“ und *کمپیوتری* „computerbezogen“.'
    example_gloss: Homayoun spielt Computerspiele.
  prs.a2.unit16.lesson01.teach.free_time_word:
    title: Freizeit
    gloss: Freizeit
    note: '*وقت آزاد* – *وقت* bedeutet „Zeit“ und *آزاد* „frei“.'
    example_gloss: In meiner Freizeit schaue ich in die sozialen Medien.
  prs.a2.unit16.lesson01.teach.usually_grammar:
    title: „Normalerweise“ mit معمولاً
    gloss: Ich schaue in meiner Freizeit normalerweise in die sozialen Medien.
    note: '*معمولاً* („normalerweise“) ist das erste Häufigkeitsadverb dieser Einheit auf A2-Niveau.'
  prs.a2.unit16.lesson01.teach.sometimes_grammar:
    title: „Manchmal“ mit بعضی اوقات
    gloss: Manchmal kostet es zu viel Zeit.
    note: '*بعضی اوقات* („manchmal“) ist das zweite Häufigkeitsadverb dieser Einheit und steht im Gegensatz zu *معمولاً*.'
  prs.a2.unit16.lesson01.teach.va_word:
    title: Und
    gloss: und
    note: '*و* ist das gängige Bindewort, mit dem in dieser Einheit Sätze verbunden werden.'
    target_text: و (und)
  prs.a2.unit16.lesson01.teach.every_day_grammar:
    title: „Jeden Tag“ mit هر روز
    gloss: Ich schaue jeden Tag in die sozialen Medien.
    note: '*هر روز* bedeutet „jeden Tag“ – *روز* allein bedeutet „Tag“.'
  prs.a2.unit16.lesson02.teach.ask_how_much_time:
    title: Fragen, wie viel Zeit jemand verbringt
    gloss: Wie viel Zeit verbringst du in den sozialen Medien?
    note: '*تو* ist das informelle „du“ unter Freunden – anders als *شما* oder die Endungen auf -*ین*, die in diesem Kurs sonst für Fremde verwendet werden.'
  prs.a2.unit16.lesson02.teach.opinion_phrase:
    title: Eine einfache Meinung äußern
    gloss: Meiner Meinung nach ist das Internet nützlich, aber manchmal kostet es zu viel Zeit.
    note: Greift das bereits bekannte Meinungsmuster *به نظر من* („meiner Meinung nach“) aus Einheit 10 wieder auf.
  prs.a2.unit16.lesson02.teach.limit_use_phrase:
    title: Sagen, dass man die Nutzung begrenzen sollte
    gloss: Wir sollten unsere Zeit begrenzen.
    note: '*محدود کردن* bedeutet „begrenzen“.'
  prs.a2.unit16.lesson02.teach.mostly_word:
    title: Mostly
    gloss: meist
    note: '*بیشتر* bedeutet hier „meist“, sonst auch „mehr“.'
    target_text: بیشتر (meist)
  prs.a2.unit16.lesson03.teach.user_word:
    title: Nutzer
    gloss: Nutzer
    note: '*کاربر* ist das allgemeine Wort für den Nutzer einer App, eines Geräts oder eines Dienstes.'
    example_gloss: Viele Nutzer verwenden jeden Tag ihr Handy.
  prs.a2.unit16.lesson03.teach.limit_word:
    title: Begrenzen
    gloss: begrenzen
    note: '*محدود کردن* – dieselbe Wendung wie in Lektion 2, hier in einer allgemeinen Aussage über Menschen statt mit „wir“.'
    example_gloss: Manche Leute begrenzen ihre Zeit.
  prs.a2.unit16.lesson03.teach.article_text:
    title: Ein kurzer Artikel über Bildschirmzeit
    gloss: Viele Menschen nutzen täglich mehrere Stunden lang soziale Medien. Manche Leute begrenzen ihre Zeit, um mehr Zeit für Familie und Freunde zu haben.
    note: Ein kurzer Sachtext im Lesestil, den diese Einheit vermittelt.
  prs.a2.unit16.lesson04.teach.turn01:
    title: همایون fragt زرمینه nach ihrer Zeit im Internet
    gloss: همایون fragt زرمینه, wie viel Zeit sie in den sozialen Medien verbringt.
    note: Greift die Frage aus Lektion 2 und das bereits eingeführte informelle *تو* dieses Freundespaars wieder auf.
  prs.a2.unit16.lesson04.teach.turn02:
    title: زرمینه antwortet und fragt zurück
    gloss: Normalerweise eine Stunde am Tag. Sie fragt ihn dasselbe.
    note: '*چطور* bedeutet hier „und du?“.'
  prs.a2.unit16.lesson04.teach.turn03:
    title: همایون beschreibt seine eigene Gewohnheit
    gloss: Er schaut meistens Videos. Vielleicht zwei Stunden am Tag.
    note: '*بیشتر* bedeutet hier „meistens“.'
  prs.a2.unit16.lesson04.teach.turn04:
    title: زرمینه äußert ihre Meinung
    gloss: Ihrer Meinung nach ist das zu viel.
    note: Greift das Meinungsmuster *به نظر من* aus Lektion 2 wieder auf.
  prs.a2.unit16.lesson04.teach.turn05:
    title: همایون stimmt zu, sagt aber, dass es ihm Spaß macht
    gloss: Vielleicht, aber es macht ihm Spaß.
    note: '*لذت می‌برم* bedeutet „ich genieße es“.'
  prs.a2.unit16.lesson04.teach.turn06:
    title: زرمینه schlägt vor, die Nutzung zu begrenzen
    gloss: Sie sagt, dass wir manchmal unsere Zeit begrenzen sollten.
    note: Greift *محدود کنیم* aus Lektion 2 unverändert wieder auf.
  prs.a2.unit16.lesson04.teach.turn07:
    title: همایون ist einverstanden, weniger zu nutzen
    gloss: Stimmt. Ab morgen nutzt er es weniger.
    note: '*کمتر* bedeutet „weniger“.'
  prs.a2.unit16.lesson04.teach.turn08:
    title: زرمینه zeigt sich erfreut
    gloss: زرمینه sagt, dass das großartig ist.
    note: '*عالی است!* ist eine gängige Art, „Das ist großartig!“ zu sagen.'
