    - value: فریدون هستم
      status: correct
    - value: من فریدون هستم
      status: correct
    feedback: Beide Muster beantworten die Frage richtig; dasselbe Muster funktioniert mit jedem Namen.
  prs.a1.unit02.lesson02.exercise01.recognize_origin_question:
    instruction: Welche Wendung fragt, woher jemand kommt?
    correct_option: Woher kommen Sie?
    distractors:
    - Was sind Sie von Beruf?
    - Wie heißen Sie?
    - Wie geht es Ihnen? (höflich)
    accepted_answers:
    - value: Woher kommen Sie?
      status: correct
    feedback: شما از کجا استین؟ fragt nach der Herkunft, mit از („aus“) und کجا („wo“).
  prs.a1.unit02.lesson02.exercise02.recognize_city_names:
    instruction: Welche dieser Städte liegt in Afghanistan?
    correct_option: هرات
    distractors:
    - افغانستان
    - شهر
    - کار
    accepted_answers:
    - value: هرات
      status: correct
    feedback: هرات ist eine Stadt; افغانستان ist das Land und شهر ist das allgemeine Wort für „Stadt“.
  prs.a1.unit02.lesson02.exercise03.recognize_origin_question_reading:
    instruction: Was wird mit dieser Frage gefragt?
    correct_option: Woher kommen Sie?
    distractors:
    - Was sind Sie von Beruf?
    - Wie heißen Sie?
    - Und Sie?
    accepted_answers:
