course:
  title: Dari in Deutsch A1
  description: 'Dari (Afghanistan) für Anfänger: Namen austauschen, sagen, woher man kommt und was man beruflich macht, eine dritte Person vorstellen sowie Anredetitel und Höflichkeitsregister bei einer ersten Begegnung richtig verwenden.'
units:
  prs.a1.unit02.introductions:
    title: Sich vorstellen und kennenlernen
lessons:
  prs.a1.unit02.lesson01.name_exchange:
    title: Nach dem Namen fragen und den eigenen Namen nennen
  prs.a1.unit02.lesson02.origin_and_hometown:
    title: Nach Heimatstadt und Herkunftsland fragen
  prs.a1.unit02.lesson03.occupation:
    title: Nach dem Beruf fragen
  prs.a1.unit02.lesson04.introducing_others:
    title: Eine dritte Person vorstellen
  prs.a1.unit02.lesson05.polite_titles_and_register:
    title: Höfliche Anreden und das passende Register verwenden
  prs.a1.unit02.lesson06.gathering_dialogue:
    title: Menschen bei einer Zusammenkunft kennenlernen
teaching:
  prs.a1.unit02.lesson01.teach.name_question_polite:
    title: Höflich nach dem Namen fragen
    gloss: Wie heißen Sie?
    note: نام‌تان چیست؟ ist die respektvolle Form für eine neue erwachsene Bekanntschaft und setzt das Register شما/استین aus Lektion 1 fort.
  prs.a1.unit02.lesson01.teach.name_answer:
    title: Den eigenen Namen mit است nennen
    gloss: Mein Name ist Faridun.
    note: نام من ... است ist die geschriebene Art, einen Namen zu nennen. Im Gespräch sagt man meist نامم ... است (نامم = نام + -م, „mein Name“). Beides ist richtig.
  prs.a1.unit02.lesson01.teach.i_am_name:
    title: Den eigenen Namen mit استم nennen
    gloss: Ich bin Faridun.
    note: استم folgt direkt auf den Namen; es ist dieselbe Kopula der 1. Person wie in Lektion 1.
  prs.a1.unit02.lesson01.teach.name_question_informal:
    title: Nach dem Namen eines engen Freundes fragen
    gloss: Wie heißen Sie?
    note: نامت چیست؟ verwendet die informelle Possessivendung -ت. Sie ist Gleichaltrigen und engen Freunden vorbehalten, genau wie تو/استی in Lektion 1.
  prs.a1.unit02.lesson01.teach.what_is_your_name_word:
    title: Das Wort für „Name“
    gloss: Name
    note: نام ist das eigenständige Nomen, das in der höflichen und in der informellen Frage oben vorkommt.
    example_gloss: Wie heißen Sie?
  prs.a1.unit02.lesson01.teach.register_note:
    title: Höfliches Possessiv und Possessiv für enge Freunde
    gloss: -تان für jemanden, den Sie respektvoll ansprechen; -ت für einen engen Freund.
    note: Dieselbe Unterscheidung der Register wie in Lektion 1 (شما/تو) gilt auch für die Possessivendungen an نام.
  prs.a1.unit02.lesson02.teach.where_from_polite:
    title: Fragen, woher jemand kommt
    gloss: Woher kommen Sie?
    note: شما از کجا استین؟ behält die respektvolle Kombination شما/استین bei.
  prs.a1.unit02.lesson02.teach.from_kabul:
    title: Sagen, dass Sie aus Kabul kommen
    gloss: Ich komme aus Kabul.
    note: من از کابل استم folgt dem Muster من از [Ort] استم, das für jede Stadt gilt.
  prs.a1.unit02.lesson02.teach.from_herat:
    title: Sagen, dass Sie aus Herat kommen
    gloss: Ich komme aus Herat.
    note: هرات ist eine große Stadt im Westen Afghanistans.
  prs.a1.unit02.lesson02.teach.from_mazar:
    title: Sagen, dass Sie aus Masar-e Scharif kommen
    gloss: Ich komme aus Masar-e Scharif.
    note: مزار شریف wird in zwei Wörtern geschrieben und ist eine große Stadt im Norden Afghanistans.
  prs.a1.unit02.lesson02.teach.country:
    title: Afghanistan
    gloss: Afghanistan
    note: افغانستان wird nach از genauso verwendet wie ein Stadtname.
    example_gloss: Ich komme aus Afghanistan.
  prs.a1.unit02.lesson02.teach.city_word:
    title: Das Wort für „Stadt“
    gloss: Stadt
    note: شهر bezeichnet allgemein eine Stadt, im Unterschied zum Namen einer bestimmten Stadt.
    example_gloss: Kabul ist eine große Stadt.
  prs.a1.unit02.lesson03.teach.occupation_question:
    title: Nach dem Beruf fragen
    gloss: Was sind Sie von Beruf?
    note: کار شما چیست؟ fragt wörtlich „Was ist Ihre Arbeit?“ und ist die übliche Art, nach dem Beruf zu fragen.
  prs.a1.unit02.lesson03.teach.doctor:
    title: Arzt / Ärztin
    gloss: Arzt / Ärztin
    note: داکتر ist die gebräuchliche dari Berufsbezeichnung; sie gilt für Ärzte und umgangssprachlich auch für Personen mit Doktortitel.
    example_gloss: Er/Sie ist Arzt/Ärztin.
  prs.a1.unit02.lesson03.teach.teacher:
    title: Lehrerin
    gloss: Lehrer/Lehrerin
    note: معلم ist ein allgemeiner Begriff für Lehrer/Lehrerin an Schulen jeder Stufe.
    example_gloss: Er/Sie ist Lehrer/Lehrerin.
  prs.a1.unit02.lesson03.teach.engineer:
    title: Ingenieur
    gloss: Ingenieur/Ingenieurin
    note: مهندس bezeichnet Ingenieure allgemein, nicht eine bestimmte Fachrichtung.
    example_gloss: Er/Sie ist Ingenieur/Ingenieurin.
  prs.a1.unit02.lesson03.teach.shopkeeper:
    title: Ladenbesitzer / Ladenbesitzerin
    gloss: Ladenbesitzer/in
    note: دوکاندار (von دوکان, „Laden“) ist der alltägliche Begriff in Kabul; dieser Kurs verwendet die dari Schreibung دوکان und nicht das iranisch-persische مغازه.
    example_gloss: Er/Sie ist Ladenbesitzer/in.
  prs.a1.unit02.lesson03.teach.i_am_teacher:
    title: Einen Beruf nennen
    gloss: Ich bin Lehrerin.
    note: من [Beruf] استم ist das Muster für jeden Beruf, der in dieser Lektion vorkommt.
  prs.a1.unit02.lesson04.teach.introduce_formal:
    title: Jemanden förmlich vorstellen
    gloss: Gestatten Sie, dass ich meinen Kollegen / meine Kollegin vorstelle.
    note: اجازه بدهین همکارم را معرفی کنم ist eine respektvolle Art, eine dritte Person ins Gespräch einzuführen.
  prs.a1.unit02.lesson04.teach.this_is:
    title: Die vorgestellte Person nennen
    gloss: Das ist meine Kollegin Arezoo.
    note: این [Person] است nennt direkt, wer vorgestellt wird.
  prs.a1.unit02.lesson04.teach.pleased_after_intro:
    title: Sagen, dass Sie sich freuen, jemanden kennenzulernen
    gloss: Freut mich, Sie kennenzulernen.
    note: از آشنایی با شما خوش شدم ist dieselbe Begrüßungsformel für ein erstes Treffen wie in Lektion 1 und wird hier nach der Vorstellung einer dritten Person wiederverwendet.
  prs.a1.unit02.lesson04.teach.pleased_reply:
    title: Antworten, dass Sie sich auch freuen
    gloss: Mich freut es auch.
    note: من هم خوش شدم ist die natürliche, kurze Antwort.
  prs.a1.unit02.lesson04.teach.friend_word:
    title: Freund / Freundin
    gloss: Freund/in
    note: دوست ist ein allgemeines Wort für Freund/in, ohne Aussage über die Nähe.
    example_gloss: Er/Sie ist mein Freund / meine Freundin.
  prs.a1.unit02.lesson04.teach.colleague_word:
    title: Kollege / Kollegin
    gloss: Kollege/Kollegin
    note: همکار bezeichnet jemanden, mit dem man zusammenarbeitet, und kam schon im Arbeitsplatz-Dialog von Lektion 1 vor.
    example_gloss: Er/Sie ist mein Kollege / meine Kollegin.
  prs.a1.unit02.lesson05.teach.title_jenab:
    title: Herr
    gloss: Herr
    note: جناب steht vor dem Namen oder Titel eines Mannes als respektvolle Anrede und ist im städtischen Alltag Afghanistans gebräuchlich.
    example_gloss: Mein Herr, bitte sehr.
  prs.a1.unit02.lesson05.teach.title_khanom:
    title: Frau
    gloss: Frau
    note: خانم steht vor dem Namen einer Frau und wird unabhängig vom Familienstand verwendet.
    example_gloss: Gnädige Frau, bitte sehr.
  prs.a1.unit02.lesson05.teach.title_with_name:
    title: Einen Mann höflich ansprechen
    gloss: Herr Faridun
    note: جناب plus Vorname ist eine gebräuchliche höfliche Anrede; ein Nachname ist nicht unbedingt nötig.
  prs.a1.unit02.lesson05.teach.title_with_name_female:
    title: Eine Frau höflich ansprechen
    gloss: Frau Arezoo
    note: خانم plus Vorname funktioniert genauso wie جناب bei einem Mann.
  prs.a1.unit02.lesson05.teach.register_reminder:
    title: Wann welches Register passt
    gloss: Verwenden Sie شما und استین bei Menschen, die Sie gerade kennengelernt haben; تو und استی nur bei engen Freunden.
    note: Das wiederholt die Registerregel aus Lektion 1 für die Situation des Vorstellens.
  prs.a1.unit02.lesson05.teach.polite_could_you:
    title: Höflich darum bitten, den Namen zu wiederholen
    gloss: Könnten Sie Ihren Namen bitte noch einmal sagen?
    note: می‌توانین نام‌تان را دوباره بگویین؟ ist eine natürliche, höfliche Art, um Wiederholung zu bitten, ohne dass es unangenehm wirkt.
  prs.a1.unit02.lesson06.teach.gathering_word:
    title: Gesellschaft / Party
    gloss: Party
    note: مهمانی bezeichnet eine zwanglose gesellige Zusammenkunft und ist der Schauplatz des Dialogs in dieser Lektion.
    example_gloss: Die Party ist schön.
  prs.a1.unit02.lesson06.teach.turn01:
    title: Leila eröffnet die Vorstellung
    gloss: Leila begrüßt Faridun und fragt ihn nach seinem Namen; sie spricht ihn respektvoll mit جناب an.
    note: Leila und Faridun kennen sich noch nicht, deshalb verwendet sie von Anfang an das respektvolle Register.
  prs.a1.unit02.lesson06.teach.turn02:
    title: Faridun nennt seinen Namen
    gloss: Faridun erwidert den Gruß und nennt seinen Namen.
    note: سلام علیکم ist der ausführlichere Gruß aus Lektion 1 und passt zu einem ersten Treffen. Im Gespräch sagt Faridun نامم فریدون است (نامم = نام من, „mein Name“), die alltägliche gesprochene Form.
  prs.a1.unit02.lesson06.teach.turn03:
    title: Leila fragt, woher er kommt
    gloss: Leila sagt, dass sie sich freut, ihn kennenzulernen, und fragt, woher er kommt.
    note: Dieselbe Formel از آشنایی با شما خوش شدم kennen Sie bereits aus dem Arbeitsplatz-Dialog in Lektion 1.
  prs.a1.unit02.lesson06.teach.turn04:
    title: Faridun antwortet und gibt die Frage zurück
    gloss: Faridun sagt, dass er aus Herat kommt, und stellt Leila dieselbe Frage.
    note: و شما؟ gibt eine Frage knapp zurück, wie schon in Lektion 1.
  prs.a1.unit02.lesson06.teach.turn05:
    title: Leila antwortet und fragt nach dem Beruf
    gloss: Leila sagt, dass sie aus Kabul kommt, und fragt Faridun nach seinem Beruf.
    note: Das Gespräch geht ganz natürlich von der Herkunft zum Beruf über.
  prs.a1.unit02.lesson06.teach.turn06:
    title: Faridun antwortet und gibt die Frage zurück
    gloss: Faridun sagt, dass er Ingenieur ist, und stellt Leila dieselbe Frage.
    note: شما چطور؟ ist eine kurze Art, eine Frage zurückzugeben, die sich aus dem Zusammenhang schon ergibt.
  prs.a1.unit02.lesson06.teach.turn07:
    title: Leila nennt ihren Beruf
    gloss: Leila sagt, dass sie Lehrerin ist.
    note: Schließt den Austausch über Berufe mit dem zuvor in der Lektion gelernten Muster ab.
  prs.a1.unit02.lesson06.teach.turn08:
    title: Faridun stellt eine dritte Person vor
    gloss: Faridun stellt seine Kollegin Arezoo vor.
    note: Damit kommt eine dritte Person ins Gespräch – mit der förmlichen Vorstellungsformel aus Lektion 4.
  prs.a1.unit02.lesson06.teach.turn09:
    title: Leila begrüßt Arezoo
    gloss: Leila heißt Arezoo willkommen und spricht sie respektvoll mit خانم an.
    note: خوش آمدین ist die Willkommensformel aus Lektion 1, hier an eine soeben vorgestellte Person gerichtet.
  prs.a1.unit02.lesson06.teach.turn10:
    title: Arezoo antwortet
    gloss: Arezoo bedankt sich bei Leila und sagt, dass sie sich freut, sie kennenzulernen.
    note: از دیدن شما خوشحال شدم ist eine natürliche Variante der Formel „Freut mich“ und verwendet دیدن („sehen“) statt آشنایی.
exercises:
  prs.a1.unit02.lesson01.exercise01.recognize_name_question:
    instruction: Welche Wendung fragt höflich nach dem Namen?
    correct_option: Wie heißen Sie? (höflich)
    distractors:
    - Wie heißt du? (informell)
    - Was sind Sie von Beruf?
    - Woher kommst du?
    accepted_answers:
    - value: Wie heißen Sie? (höflich)
      status: correct
    feedback: نام‌تان چیست؟ ist die respektvolle Form für eine neue Bekanntschaft.
  prs.a1.unit02.lesson01.exercise02.recognize_polite_vs_informal:
    instruction: نامت چیست؟ passt, wenn man fragt …
    correct_option: einen engen Freund
    distractors:
    - eine Person, die man gerade erst kennengelernt hat
    - eine ältere Person bei einem offiziellen Anlass
    - einen Kunden in Ihrem Laden
    accepted_answers:
    - value: einen engen Freund
      status: correct
    feedback: Das vertraute Possessivsuffix -ت in نامت passt nur zu engen Freunden oder Gleichaltrigen – dieselbe Regel wie bei تو/استی in Lektion 1.
  prs.a1.unit02.lesson01.exercise03.recognize_name_question_reading:
    instruction: Was wird mit dieser Frage gefragt?
    correct_option: Wie heißt du?
    distractors:
    - Was sind Sie von Beruf?
    - Woher kommst du?
    - Und Sie?
    accepted_answers:
    - value: Wie heißt du?
      status: correct
    feedback: نام‌تان چیست؟ fragt nach Ihrem Namen.
  prs.a1.unit02.lesson01.exercise04.match_name_forms:
    instruction: Ordnen Sie jedem Ausdruck seine Bedeutung zu.
    accepted_answers:
    - value:
        نام‌تان چیست؟: Wie heißen Sie? (höflich)
        نامت چیست؟: Wie heißt du? (informell)
        نام: Name
      status: correct
    feedback: نام‌تان und نامت unterscheiden sich nur im Register, nicht in der Bedeutung.
    pairs:
    - left: نام‌تان چیست؟
      right: Wie heißen Sie? (höflich)
    - left: نامت چیست؟
      right: Wie heißt du? (informell)
    - left: نام
      right: Name
  prs.a1.unit02.lesson01.exercise05.order_name_answer:
