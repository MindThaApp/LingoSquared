    - value: از مزار شریف هستم
      status: correct
    feedback: من از [Ort] استم beantwortet die Frage richtig; dasselbe Muster funktioniert mit jedem Ort.
  prs.a1.unit02.lesson03.exercise01.recognize_occupation_question:
