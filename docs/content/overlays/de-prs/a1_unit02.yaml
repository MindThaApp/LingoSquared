      status: correct
    feedback: کار شما چیست؟ fragt wörtlich, was Ihre Arbeit ist.
  prs.a1.unit02.lesson03.exercise02.recognize_doctor:
    instruction: Was bedeutet dieses Wort?
    correct_option: Arzt
    distractors:
    - Lehrer
    - Ingenieurin
    - Ladenbesitzer
    accepted_answers:
