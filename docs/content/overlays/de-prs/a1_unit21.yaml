    note: دوکان (Laden) – schon aus der Einkaufseinheit bekannt.
    example_gloss: Dieser Laden ist groß.
  prs.a1.unit21.lesson06.teach.review_raft:
    title: Ging
    gloss: ging
    note: رفت (ging, 3. Person) – schon aus der Einheit über vergangene Ereignisse bekannt.
    example_gloss: Zarmina ging zum Laden.
  prs.a1.unit21.lesson06.teach.review_qeymatesh:
    title: Sein Preis
