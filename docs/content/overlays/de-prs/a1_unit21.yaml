  prs.a1.unit21.lesson02.teach.safid:
    title: Weiß
    gloss: weiß
    note: سفید bedeutet „weiß“.
    example_gloss: Dieses Hemd ist weiß.
  prs.a1.unit21.lesson02.teach.sorkh:
    title: Rot
    gloss: rot
    note: سرخ bedeutet „rot“ – die dariische bzw. klassisch-persische Form, nicht das iranisch-umgangssprachliche قرمز.
    example_gloss: Diese Schuhe sind rot.
  prs.a1.unit21.lesson03.teach.andaza:
    title: Größe
    gloss: Größe
    note: اندازه bedeutet „Größe“ (das Substantiv).
