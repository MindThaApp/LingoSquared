  prs.a1.unit21.lesson03.teach.in_andaza_shoma:
    title: Ist das Ihre Größe?
    gloss: Ist das Ihre Größe?
    note: این اندازه شما است؟ verwendet این („dieses“), das hier neu eingeführt wird.
  prs.a1.unit21.lesson03.teach.review_bozorg:
