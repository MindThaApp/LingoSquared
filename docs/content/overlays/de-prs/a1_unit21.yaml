    example_gloss: Diese Hose ist teuer.
  prs.a1.unit21.lesson01.teach.kafsh:
    title: Schuhe
    gloss: Schuhe
    note: کفش bedeutet „Schuhe“.
    example_gloss: Diese Schuhe sind billig.
  prs.a1.unit21.lesson01.teach.review_ast:
    title: Ist / sind
    gloss: ist
    note: است (ist) – schon aus der Lektion zu den Begrüßungen bekannt.
    example_gloss: Das ist ein Hemd.
  prs.a1.unit21.lesson01.teach.review_geran:
    title: Teuer
    gloss: teuer
    note: گران (teuer) – schon aus der Einkaufslektion bekannt.
