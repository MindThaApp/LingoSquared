    title: Der Ladenbesitzer begrüßt
    gloss: Guten Tag, bitte sehr.
  prs.a1.unit21.lesson05.teach.turn02:
    title: Zarmina fragt
    gloss: Guten Tag. Welche Farbe hat dieses Hemd?
    note: زرمینه (Zarmina) ist eine wiederkehrende Figur in diesem Kurs und wurde in den Lektionen zu Uhrzeit und Tagesablauf eingeführt.
  prs.a1.unit21.lesson05.teach.turn03:
    title: Der Ladenbesitzer antwortet
    gloss: Ich habe es in Schwarz und Weiß.
  prs.a1.unit21.lesson05.teach.turn04:
    title: Zarmina entscheidet sich
    gloss: Ich möchte das weiße Hemd. Ist die Größe groß?
    note: 'اندازه‌اش (seine Größe): Die Possessivendung wird an اندازه angehängt.'
  prs.a1.unit21.lesson05.teach.turn05:
    title: Der Ladenbesitzer bestätigt
    gloss: Ja, es ist groß. Sie können es anprobieren.
  prs.a1.unit21.lesson05.teach.turn06:
    title: Zarmina probiert es an
    gloss: Danke. Das ist meine Größe. Was kostet es?
  prs.a1.unit21.lesson05.teach.turn07:
    title: Der Ladenbesitzer nennt den Preis
    gloss: Es kostet 500 Afghani.
  prs.a1.unit21.lesson05.teach.turn08:
    title: Zarmina ist einverstanden
    gloss: Sehr gut, ich kaufe es.
    note: می‌خرم ist die 1. Person Singular Präsens von خریدن (kaufen).
