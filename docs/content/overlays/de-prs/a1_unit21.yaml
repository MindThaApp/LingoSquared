    gloss: Zarmina ging zum Laden. Sie kaufte ein weißes, großes Hemd. Es kostete 500 Afghani.
    note: خرید (kaufte) und بود (war) sind beide einfache Vergangenheitsformen, schon aus der Einheit über vergangene Ereignisse bekannt.
