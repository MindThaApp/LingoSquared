review:
  status: unreviewed
  required_next_reviewer: fresh_context_reviewer
  notes: >-
    Overlay for German's fourth C1 unit, authored alongside the realization
    (no adaptable public-domain German C1 argumentation source exists; see the
    realization provenance note). English speakers' real interference risks
    for this outcome: (1) English collapses concession into a single comma
    ("admittedly ... but") where German marks each move with an explicit
    connective or concessive frame (Zugegeben, ich gebe zu, dass, allerdings,
    dennoch); each is glossed with its actual argumentative function. (2) The
    concessive adverbs allerdings and dennoch map to several English words, so
    the glosses pin one interpretation per form. (3) The weighing verbs
    (ueberwiegen 'outweigh', abwaegen 'weigh up') have no direct English verb
    in the same syntactic slot, so the weighing move is glossed as a full
    phrase. (4) The culminating speaking AND writing prompts name the EXACT
    three-move argument to produce (concession, then counter, then weighing)
    so a correct answer is well-determined. No sibling-direction file (de-en)
    was consulted.

course:
  title: German C1
  description: >-
    Advanced German: argue with subtlety -- genuinely concede a valid
    opposing point, then qualify or rebut it, weighing competing
    considerations rather than dismissing them, in formal register.

units:
  de.c1.unit04.zugestehen_und_abwaegen:
    title: "Conceding and weighing"
    description: "Genuinely concede a valid opposing point, qualify or rebut it proportionately, and weigh competing considerations to reach a nuanced judgement in formal German."

lessons:
  de.c1.unit04.lesson01.das_zugestaendnis:
    title: "The concession"
  de.c1.unit04.lesson02.die_einschraenkung:
    title: "The qualification"
  de.c1.unit04.lesson03.das_abwaegen:
    title: "The weighing"
  de.c1.unit04.lesson04.den_argumentationsgang_nachvollziehen:
    title: "Tracing the argument"
  de.c1.unit04.lesson05.zugestaendnis_und_gegeneinwand:
    title: "Concession and counter"
  de.c1.unit04.lesson06.der_vollstaendige_austausch:
    title: "The complete exchange"

teaching:
  de.c1.unit04.lesson01.teach.zugegeben:
    title: "Admittedly ..."
    gloss: "admittedly (conceding a point)"
    note: "*Zugegeben, ...* = 'Admittedly, ...'. It opens a concession -- the speaker grants the other side a point before moving on. It is a past participle used as a sentence opener, so it carries no finite verb and the real clause follows after the comma."
  de.c1.unit04.lesson01.teach.ich_gebe_zu:
    title: "I admit that ..."
    gloss: "I admit that ..."
    note: "*Ich gebe zu, dass ...* = 'I admit that ...'. *Zugeben* (separable: *ich gebe ... zu*) is the explicit performative verb of conceding; the *dass*-clause that follows is verb-final."
  de.c1.unit04.lesson01.teach.es_stimmt_dass:
    title: "It is true that ..."
    gloss: "it is true that ..."
    note: "*Es stimmt, dass ...* = 'It is true that ...'. A neutral concession that confirms the other side's point as fact before the counter arrives."
  de.c1.unit04.lesson01.teach.berechtigter_einwand:
    title: "That is a valid objection."
    gloss: "that is a valid objection"
    note: "*Das ist ein berechtigter Einwand.* = 'That is a valid objection.' The concession is substantive: *berechtigt* (justified) acknowledges the objection really holds, which is what makes the later counter proportionate rather than dismissive."
  de.c1.unit04.lesson01.teach.das_zugestaendnis:
    title: "the concession"
    gloss: "the concession"
    note: "*Das Zugeständnis* = the concession. The noun built from *zugestehen* (to grant). Naming the concession as a move is the first step of the outcome -- recognizing that a point was granted."
    example_gloss: "The concession was honest."
  de.c1.unit04.lesson01.teach.einraeumen:
    title: "to concede (a point)"
    gloss: "to concede (a point)"
    note: "*Einräumen* = to concede (a point). The separable verb *einräumen* (*ich räume ein*) is the formal written-register verb for granting an opponent a point; *zugeben* is the everyday equivalent."
    example_gloss: "I concede that you are right."
  de.c1.unit04.lesson01.teach.zugestaendnis_muster:
    title: "The concession model"
    gloss: "Admittedly, an open-plan office saves costs and fosters exchange."
    note: "The full concession sentence. *Zugegeben* concedes, then the fact follows: the open-plan office *spart Kosten* (saves costs) and *fördert den Austausch* (fosters exchange). Note the frame: *Zugegeben* sits before the comma, and the main clause keeps normal verb-second order."

  de.c1.unit04.lesson02.teach.allerdings:
    title: "however / though"
    gloss: "however / though"
    note: "*Allerdings* = 'however / though'. It marks the counter after a concession, and it usually sits at the start of the main clause."
    example_gloss: "The plan is good, though not ideal."
  de.c1.unit04.lesson02.teach.dennoch:
    title: "nevertheless"
    gloss: "nevertheless"
    note: "*Dennoch* = 'nevertheless'. Stronger than *allerdings*: it re-asserts the speaker's position against the conceded point."
    example_gloss: "The costs are high, nevertheless the change is worthwhile."
  de.c1.unit04.lesson02.teach.trotzdem:
    title: "in spite of that"
    gloss: "in spite of that"
    note: "*Trotzdem* = 'nevertheless / in spite of that'. A standard concessive adverb; interchangeable with *dennoch* in argumentation."
    example_gloss: "It is noisy, nevertheless I like working there."
  de.c1.unit04.lesson02.teach.dagegen_spricht:
    title: "what speaks against it is that ..."
    gloss: "what speaks against it is that ..."
    note: "*Dagegen spricht, dass ...* = 'What speaks against it is that ...'. A frame that names the counter-evidence explicitly: *dagegen* (against it) plus the verb-final *dass*-clause."
  de.c1.unit04.lesson02.teach.die_konzentration:
    title: "the concentration"
    gloss: "the concentration"
    note: "*Die Konzentration* = concentration. In the debate it is the value that open-plan offices threaten: *Im Großraumbüro leidet die Konzentration*."
    example_gloss: "In an open-plan office concentration suffers."
  de.c1.unit04.lesson02.teach.entkraeften:
    title: "to refute / to weaken"
    gloss: "to refute / to weaken"
    note: "*Entkräften* = to refute, to weaken (an argument). Where a concession *grants* a point, a rebuttal *entkräftet* it -- the two opposite moves of the outcome."
    example_gloss: "One can easily refute the objection."
  de.c1.unit04.lesson02.teach.einschraenkung_muster:
    title: "The counter model"
    gloss: "However, concentration suffers because many colleagues need quiet for their work."
    note: "The full counter sentence. *Allerdings leidet darunter die Konzentration, denn viele Kollegen brauchen Ruhe für ihre Arbeit* -- the *denn*-clause supplies the reason that limits the conceded benefit."

  de.c1.unit04.lesson03.teach.einerseits_andererseits:
    title: "on the one hand ... on the other hand"
    gloss: "on the one hand ... on the other hand"
    note: "*Einerseits ... andererseits ...* = 'on the one hand ... on the other hand'. The classic frame for laying out two competing considerations side by side before weighing them."
  de.c1.unit04.lesson03.teach.abwaegen:
    title: "to weigh up"
    gloss: "to weigh up"
    note: "*Abwägen* = to weigh up (two considerations). The separable verb (*Wir wägen ... ab*) names the outcome's core act: weighing rather than dismissing."
    example_gloss: "We have to weigh the costs and the benefits."
  de.c1.unit04.lesson03.teach.die_abwaegung:
    title: "the weighing"
    gloss: "the weighing"
    note: "*Die Abwägung* = the weighing. The noun for the act of balancing competing points before reaching a judgement."
    example_gloss: "The weighing is difficult."
  de.c1.unit04.lesson03.teach.ueberwiegen:
    title: "to outweigh"
    gloss: "to outweigh"
    note: "*Überwiegen* = to outweigh. The verb that delivers the final judgement: one consideration *überwiegt* the other."
    example_gloss: "The disadvantages outweigh."
  de.c1.unit04.lesson03.teach.der_vorteil:
    title: "the advantage"
    gloss: "the advantage"
    note: "*Der Vorteil* = the advantage. One of the two weights on the scale."
    example_gloss: "The advantage is obvious."
  de.c1.unit04.lesson03.teach.der_nachteil:
    title: "the disadvantage"
    gloss: "the disadvantage"
    note: "*Der Nachteil* = the disadvantage. The counterweight to *der Vorteil*; the weighing decides which side *überwiegt*."
    example_gloss: "The disadvantage is the noise."
  de.c1.unit04.lesson03.teach.abwaegung_muster:
    title: "The weighing model"
    gloss: "On balance, the disadvantages outweigh for me."
    note: "*In der Gesamtabwägung überwiegen für mich die Nachteile.* = 'On balance, the disadvantages outweigh for me.' The weighing move in full: *in der Gesamtabwägung* (all things considered) announces the weighing, and *überwiegen* states the result."

  de.c1.unit04.lesson04.teach.das_argument:
    title: "the argument"
    gloss: "the argument"
    note: "*Das Argument* = the argument -- a reason offered in support of a position. Tracing an argument means mapping which move each sentence makes."
    example_gloss: "The argument is convincing."
  de.c1.unit04.lesson04.teach.der_gegeneinwand:
    title: "the counter-objection"
    gloss: "the counter-objection"
    note: "*Der Gegeneinwand* = the counter-objection -- the reason offered against the conceded point."
    example_gloss: "The counter-objection is justified."
  de.c1.unit04.lesson04.teach.die_sichtweise:
    title: "the point of view"
    gloss: "the point of view"
    note: "*Die Sichtweise* = the point of view. A weighed argument treats the other *Sichtweise* fairly rather than dismissing it."
    example_gloss: "Both points of view are understandable."
  de.c1.unit04.lesson04.teach.nachvollziehbar:
    title: "understandable / traceable"
    gloss: "understandable / traceable"
    note: "*Nachvollziehbar* = understandable, traceable. A good counterargument is *nachvollziehbar* -- the reader can follow its reasoning."
    example_gloss: "Your objection is understandable."
  de.c1.unit04.lesson04.teach.leseargument:
    title: "A complete three-move argument"
    gloss: "Admittedly, an open-plan office saves costs and fosters exchange. However, concentration suffers because of it, since many colleagues need quiet for their work. On balance, the disadvantages outweigh for me."
    note: "A complete three-move argument: concession (*Zugegeben, ...*), counter (*Allerdings leidet darunter ...*), and weighing (*In der Gesamtabwägung überwiegen ...*). Map each sentence to its move."
  de.c1.unit04.lesson04.teach.gang_muster:
    title: "The three moves in order"
    gloss: "First the concession, then the counter-objection, at the end the weighing."
    note: "The three moves in order: *Zuerst das Zugeständnis, dann der Gegeneinwand, am Ende die Abwägung* -- concession first, counter second, weighing last."

  de.c1.unit04.lesson05.teach.zugeben:
    title: "to admit"
    gloss: "to admit"
    note: "*Zugeben* = to admit, to concede. The everyday performative verb of the concession move (*Ich gebe zu, dass ...*)."
    example_gloss: "I admit that you are right."
  de.c1.unit04.lesson05.teach.teilweise:
    title: "partly"
    gloss: "partly"
    note: "*Teilweise* = partly. The scope-narrowing word: *Dieser Einwand greift nur teilweise* limits how far the conceded point reaches -- this is the 'qualify its scope' move."
    example_gloss: "That is only partly true."
  de.c1.unit04.lesson05.teach.greift_nur_teilweise:
    title: "This objection only partly holds."
    gloss: "this objection only partly holds"
    note: "*Dieser Einwand greift nur teilweise.* = 'This objection only partly holds.' *Greifen* (to hold, to be valid) plus *nur teilweise* narrows the objection's reach without denying it outright -- a proportionate counter, not a dismissal."
  de.c1.unit04.lesson05.teach.entgegnen:
    title: "to reply / to counter"
    gloss: "to reply / to counter"
    note: "*Entgegnen* = to reply, to counter. The verb for the response move; *Darauf entgegne ich, dass ...* = 'I reply to that by saying ...'."
    example_gloss: "I reply to that by saying the costs are too high."
  de.c1.unit04.lesson05.teach.verhaeltnismaessig:
    title: "proportionate"
    gloss: "proportionate"
    note: "*Verhältnismäßig* = proportionate. The adjective that names the outcome's demand: the counter must be *verhältnismäßig* -- matching the strength of the conceded point, not overreaching."
    example_gloss: "The counter-objection is proportionate."
  de.c1.unit04.lesson05.teach.antwort_muster:
    title: "The response model"
    gloss: "Admittedly, the objection is justified. However, it only partly holds, because the disadvantages outweigh."
    note: "The response model: concede (*Zugegeben, der Einwand ist berechtigt*), then qualify (*Allerdings greift er nur teilweise*), then counter with the weighing (*denn die Nachteile überwiegen*)."

  de.c1.unit04.lesson06.teach.vogel_zugestaendnis:
    title: "Frau Vogel: I admit that an open-plan office is noisier, but it fosters exchange among colleagues."
    gloss: "I admit that an open-plan office is noisier, but it fosters exchange among the colleagues."
    note: "Frau Vogel opens by conceding the other side's point (*ein Großraumbüro ist lauter*) before asserting her own (*aber es fördert den Austausch*)."
  de.c1.unit04.lesson06.teach.felix_gegeneinwand:
    title: "Felix: That is true, the exchange is a real advantage. However, many colleagues need quiet for their work, and that gets lost in an open-plan office."
    gloss: "That is true, the exchange is a real advantage. However, many colleagues need quiet for their work, and that gets lost in an open-plan office."
    note: "Felix concedes (*Das stimmt, der Austausch ist ein echter Vorteil*) then counters (*Allerdings brauchen viele Kollegen Ruhe*)."
  de.c1.unit04.lesson06.teach.vogel_abwaegung:
    title: "Frau Vogel: On the one hand we save costs, on the other hand we lose quiet. On balance the advantages outweigh for me."
    gloss: "On the one hand we save costs, on the other hand we lose quiet. On balance, the advantages outweigh for me nevertheless."
    note: "Frau Vogel weighs both sides explicitly (*Auf der einen Seite ... auf der anderen Seite*) and reaches her judgement (*überwiegen ... die Vorteile*)."
  de.c1.unit04.lesson06.teach.felix_abwaegung:
    title: "Felix: I understand your view, but good work requires concentration. That is why the disadvantages outweigh for me on balance."
    gloss: "I understand your view, but good work requires concentration. That is why on balance the disadvantages outweigh for me."
    note: "Felix concedes (*Ich verstehe Ihre Sicht*), counters (*aber gute Arbeit verlangt Konzentration*), and weighs (*Deshalb überwiegen ... die Nachteile*)."
  de.c1.unit04.lesson06.teach.vogel_sorgfaeltig:
    title: "Frau Vogel: Then we should carefully weigh both sides before we decide."
    gloss: "Then we should carefully weigh both sides before we decide."
    note: "Frau Vogel closes by proposing the weighing continue (*beide Seiten sorgfältig abwägen*) rather than ending the debate."
  de.c1.unit04.lesson06.teach.felix_einverstanden:
    title: "Felix: Agreed. What matters is that we do not brush any objection aside."
    gloss: "Agreed. What matters is that we do not simply brush any objection aside."
    note: "Felix agrees, and the closing line names the outcome's central value: *keinen Einwand einfach beiseitewischen* -- not brushing any objection aside."
  de.c1.unit04.lesson06.teach.austausch_muster:
    title: "The complete exchange"
    gloss: "A complete exchange in which both sides concede and counter, and neither dismisses the other's objection."
    note: "Track the moves across the turns: concession (Frau Vogel) -- counter (Felix) -- weighing (both) -- commitment to keep weighing (both). Every turn concedes or counters; none dismisses."

exercises:
  de.c1.unit04.lesson01.exercise01.recognize_zugegeben:
    instruction: "What does Zugegeben signal at the start of a concession?"
    correct_option: "It concedes a point -- 'admittedly'."
    distractors: ["It introduces a brand-new claim.", "It asks the other side a question.", "It rejects the other side's point outright."]
    accepted_answers: [{value: "It concedes a point -- 'admittedly'.", status: correct}]
    feedback: "*Zugegeben, ...* grants the other side a point before the speaker moves on -- the opening move of a concession."
  de.c1.unit04.lesson01.exercise02.listen_zugestaendnis:
    instruction: "Listen and select the meaning of the sentence."
    correct_option: "Admittedly, an open-plan office saves costs and fosters exchange."
    distractors: ["An open-plan office is too expensive to build.", "The speaker rejects the idea of an open-plan office.", "The office is moving to a smaller building."]
    accepted_answers: [{value: "Admittedly, an open-plan office saves costs and fosters exchange.", status: correct}]
    feedback: "*Zugegeben, ein Großraumbüro spart Kosten und fördert den Austausch* -- the concession move: the speaker grants the benefits before countering."
  de.c1.unit04.lesson01.exercise03.match_zugestaendnis:
    instruction: "Match each German concession phrase to its meaning."
    accepted_answers:
      - value: {"Zugegeben": "admittedly (conceding a point)", "Ich gebe zu, dass": "I admit that", "Es stimmt, dass": "it is true that", "Das ist ein berechtigter Einwand": "that is a valid objection", "das Zugeständnis": "the concession", "einräumen": "to concede (a point)"}
        status: correct
    feedback: "Each form is a way to grant the other side a point -- the concession move the whole argument is built on."
  de.c1.unit04.lesson01.exercise04.order_zugestaendnis:
    instruction: "Put the German words in order to state the concession sentence."
    accepted_answers:
      - {value: "Zugegeben ein Großraumbüro spart Kosten", status: correct}
    feedback: "*Zugegeben, ein Großraumbüro spart Kosten* -- the concession opens with *Zugegeben* and states the benefit."
  de.c1.unit04.lesson01.exercise05.translate_zugestaendnis:
    instruction: "Translate into German, starting with Zugegeben: Admittedly, an open-plan office saves costs and fosters exchange."
    accepted_answers:
      - {value: "Zugegeben, ein Großraumbüro spart Kosten und fördert den Austausch", status: correct}
      - {value: "Zugegeben, ein Großraumbüro spart Kosten und fördert den Austausch.", status: correct}
      - {value: "Zugegeben, ein Grossraumbuero spart Kosten und foerdert den Austausch", status: correct}
      - {value: "Zugegeben, ein Grossraumbuero spart Kosten und foerdert den Austausch.", status: correct}
    feedback: "*Zugegeben, ein Großraumbüro spart Kosten und fördert den Austausch* -- the concession names the benefits of the open-plan office."
  de.c1.unit04.lesson01.exercise06.speak_zugestaendnis:
    instruction: "Say aloud in German, starting with Zugegeben: Admittedly, an open-plan office saves costs and fosters exchange."
    accepted_answers:
      - {value: "Zugegeben, ein Großraumbüro spart Kosten und fördert den Austausch", status: correct}
      - {value: "Zugegeben, ein Großraumbüro spart Kosten und fördert den Austausch.", status: correct}
      - {value: "Zugegeben, ein Grossraumbuero spart Kosten und foerdert den Austausch", status: correct}
      - {value: "Zugegeben, ein Grossraumbuero spart Kosten und foerdert den Austausch.", status: correct}
    feedback: "Spoken, *Zugegeben* still opens the concession -- the tone is matter-of-fact, not defensive."
  de.c1.unit04.lesson01.exercise07.write_zugestaendnis:
    instruction: "Write in German, using Ich gebe zu, dass...: I admit that an open-plan office fosters exchange."
    accepted_answers:
      - {value: "Ich gebe zu, dass ein Großraumbüro den Austausch fördert", status: correct}
      - {value: "Ich gebe zu, dass ein Großraumbüro den Austausch fördert.", status: correct}
      - {value: "Ich gebe zu, dass ein Grossraumbuero den Austausch foerdert", status: correct}
      - {value: "Ich gebe zu, dass ein Grossraumbuero den Austausch foerdert.", status: correct}
    feedback: "*Ich gebe zu, dass ...* performs the concession explicitly with the verb *zugeben*."

  de.c1.unit04.lesson02.exercise01.recognize_allerdings:
    instruction: "What is the function of allerdings in an argument?"
    correct_option: "It introduces the counter after a concession."
    distractors: ["It concedes the other side's point.", "It asks a follow-up question.", "It concludes the argument."]
    accepted_answers: [{value: "It introduces the counter after a concession.", status: correct}]
    feedback: "*Allerdings* marks the counter -- it follows the concession and limits the point just granted."
  de.c1.unit04.lesson02.exercise02.listen_einschraenkung:
    instruction: "Listen and select the meaning of the sentence."
    correct_option: "However, concentration suffers because many colleagues need quiet for their work."
    distractors: ["The open-plan office improves everyone's concentration.", "Concentration is not affected by the office layout.", "Everyone agrees the office is quiet enough."]
    accepted_answers: [{value: "However, concentration suffers because many colleagues need quiet for their work.", status: correct}]
    feedback: "*Allerdings leidet darunter die Konzentration, denn viele Kollegen brauchen Ruhe für ihre Arbeit* -- the counter move, backed by a *denn*-reason."
  de.c1.unit04.lesson02.exercise03.match_einschraenkung:
    instruction: "Match each German counter phrase to its meaning."
    accepted_answers:
      - value: {"allerdings": "however / though", "dennoch": "nevertheless", "trotzdem": "in spite of that", "Dagegen spricht, dass": "what speaks against it is that", "die Konzentration": "the concentration", "entkräften": "to refute / to weaken"}
        status: correct
    feedback: "Each form limits or rebuts the conceded point -- the counter move that keeps the argument honest."
  de.c1.unit04.lesson02.exercise04.order_einschraenkung:
    instruction: "Put the German words in order to form the counter sentence."
    accepted_answers:
      - {value: "Allerdings leidet darunter die Konzentration", status: correct}
    feedback: "*Allerdings leidet darunter die Konzentration* -- the counter states the cost of the open-plan office."
  de.c1.unit04.lesson02.exercise05.translate_einschraenkung:
    instruction: "Translate into German, starting with Allerdings: However, concentration suffers because of it."
    accepted_answers:
      - {value: "Allerdings leidet darunter die Konzentration", status: correct}
      - {value: "Allerdings leidet darunter die Konzentration.", status: correct}
    feedback: "*Allerdings leidet darunter die Konzentration* -- the counter names the cost that limits the benefit."
  de.c1.unit04.lesson02.exercise06.speak_einschraenkung:
    instruction: "Say aloud in German, starting with Allerdings: However, concentration suffers because of it."
    accepted_answers:
      - {value: "Allerdings leidet darunter die Konzentration", status: correct}
      - {value: "Allerdings leidet darunter die Konzentration.", status: correct}
    feedback: "Spoken, *Allerdings* still leads the counter -- a natural, unemphatic qualification."
  de.c1.unit04.lesson02.exercise07.write_einschraenkung:
    instruction: "Write in German, using allerdings: However, many colleagues need quiet."
    accepted_answers:
      - {value: "Allerdings brauchen viele Kollegen Ruhe", status: correct}
      - {value: "Allerdings brauchen viele Kollegen Ruhe.", status: correct}
    feedback: "*Allerdings brauchen viele Kollegen Ruhe* -- the counter names the specific need the office threatens."

  de.c1.unit04.lesson03.exercise01.recognize_abwaegen:
    instruction: "What does abwägen mean?"
    correct_option: "To weigh up (two competing considerations)."
    distractors: ["To dismiss the other side's argument.", "To concede a point.", "To ask for more time."]
    accepted_answers: [{value: "To weigh up (two competing considerations).", status: correct}]
    feedback: "*Abwägen* is the outcome's core act: weighing both sides rather than dismissing either."
  de.c1.unit04.lesson03.exercise02.listen_abwaegung:
    instruction: "Listen and select the meaning of the sentence."
    correct_option: "On balance, the disadvantages outweigh for me."
    distractors: ["On balance, the advantages clearly win.", "The speaker refuses to weigh the two sides.", "The speaker postpones the decision."]
    accepted_answers: [{value: "On balance, the disadvantages outweigh for me.", status: correct}]
    feedback: "*In der Gesamtabwägung überwiegen für mich die Nachteile* -- the weighing move that reaches a judgement."
  de.c1.unit04.lesson03.exercise03.match_abwaegen:
    instruction: "Match each German weighing phrase to its meaning."
    accepted_answers:
      - value: {"einerseits": "on the one hand", "andererseits": "on the other hand", "abwägen": "to weigh up", "die Abwägung": "the weighing", "überwiegen": "to outweigh", "der Vorteil": "the advantage", "der Nachteil": "the disadvantage"}
