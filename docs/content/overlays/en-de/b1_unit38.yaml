  de.b1.unit38.lesson01.exercise02.recognize_weil_zeit_spart: {instruction: "Which German phrase means \"because you save time\"?", correct_option: "weil man Zeit spart", distractors: ["weil man Zeit braucht", "weil man Geld spart", "weil man keine Zeit hat"], accepted_answers: [{value: "weil man Zeit spart", status: "correct"}], feedback: "*weil man Zeit spart* gives a reason with the verb *sparen* (to save) at the end."}
