  notes: "Fourth de B1 unit. Needs fresh-context review.\n\nFresh-context review 2026-10-11 (content-reviewer.md checklist): checked realization + en-de overlay for unit38 (teaching-before-testing, prompt determinacy, accepted-answer completeness, distractors, matching-pair mirrors, register). Fixes: de.b1.unit38.lesson01.exercise06.write_zustimmen and de.b1.unit38.lesson02.exercise06.write_widersprechen -- prompts said 'exactly this sentence' without showing it, so other correct reasons (weil ich Zeit spare, weil die Teamarbeit ...) were graded wrong; both now pin the model sentence (realization target_blocks + overlay instruction). NATIVE FLAG: 'Ich stimme (nicht) zu, dass ...' with no dative object is grammatical but may read as a calque; natives often say 'Ich stimme Ihnen zu, dass ...' or 'Ich bin (nicht) der Meinung, dass ...' -- confirm it is natural enough as the unit's core pattern. DEFERRED: none.\n\nSecond-pass review 2026-10-19: 2 fixes -- lesson01.exercise02.recognize_weil_zeit_spart: distractor 'weil man wenig Zeit hat' (wenig never taught in the course) -> 'weil man keine Zeit hat'; lesson02.exercise03.listen_select_widersprechen: options read as single claims ('Working from home is better, because teamwork is easier in the office.' states the opposite of what the speaker believes, and the 'because you save time' distractor was equally what she disagrees with) -> split into what she disagrees with + her reason ('That working from home is better. Reason: teamwork is easier in the office.'), distractors reshaped to match.\n\nLanguage review 2026-10-24 (session 10): edits for this overlay are listed in the realization note (de.b1.unit38 paired file)."

course:
  title: "German B1"
  description: "Learn B1-level German for stating agreement or disagreement with someone's opinion and supporting your own view with a reason."

units:
  de.b1.unit38.debatte: {title: "Debate"}

lessons:
  de.b1.unit38.lesson01.zustimmen: {title: "I agree that ..."}
  de.b1.unit38.lesson02.widersprechen: {title: "I don't agree that ..."}
  de.b1.unit38.lesson03.homeoffice_dialogue: {title: "Dialogue: working from home or the office?"}

teaching:
  de.b1.unit38.lesson01.teach.stimme_zu: {title: "Ich stimme zu, dass Homeoffice besser ist.", gloss: "I agree that working from home is better.", note: "*stimme zu, dass* states agreement with a stance, using a dass-clause to name what you agree with.", example_gloss: "In the debate: I agree that working from home is better."}
  de.b1.unit38.lesson01.teach.weil_zeit_spart: {title: "..., weil man Zeit spart.", gloss: "..., because you save time.", note: "*weil* introduces the reason supporting your stance; the conjugated verb goes to the end of the clause.", example_gloss: "With a reason given: I agree that working from home is better, because you save time."}
  de.b1.unit38.lesson02.teach.stimme_nicht_zu: {title: "Ich stimme nicht zu, dass Homeoffice besser ist.", gloss: "I don't agree that working from home is better.", note: "Adding *nicht* after *stimme* states disagreement with the same dass-clause structure.", example_gloss: "In the debate: I don't agree that working from home is better."}
  de.b1.unit38.lesson02.teach.weil_teamarbeit: {title: "..., weil Teamarbeit im Büro einfacher ist.", gloss: "..., because teamwork is easier in the office.", note: "A disagreement needs its own supporting reason, introduced the same way with *weil*.", example_gloss: "With a reason given: I don't agree that working from home is better, because teamwork is easier in the office."}
  de.b1.unit38.lesson03.teach.felix_opinion: {title: "Felix states his opinion", gloss: "Felix: I think working from home is better, because you save time.", note: "*Ich finde, dass* (taught earlier) states an opinion the same way *stimme zu/nicht zu, dass* responds to one."}
  de.b1.unit38.lesson03.teach.anna_disagree: {title: "Anna disagrees with a reason", gloss: "Anna: I don't agree that working from home is better, because teamwork is easier in the office.", note: "Anna references Felix's stated view directly with the same dass-clause content and gives her own reason."}
  de.b1.unit38.lesson03.teach.felix_ask_videoanrufe: {title: "Felix asks about video calls", gloss: "Felix: I understand that. And what do you think about video calls?", note: "*was denken Sie über* asks someone's opinion on a new topic."}
  de.b1.unit38.lesson03.teach.anna_agree_videoanrufe: {title: "Anna agrees about video calls", gloss: "Anna: I agree that video calls are practical, because you save time.", note: "Anna can agree on one point (video calls) while having disagreed on another (working from home)."}

exercises:
