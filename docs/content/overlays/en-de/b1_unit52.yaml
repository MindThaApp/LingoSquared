course:
  title: "German B1"
  description: "Learn B1-level German for communicating professionally in meetings -- making a formal-register request with Könnten wir ... verschieben?, participating in a short meeting exchange, and writing a brief professional message."

units:
  de.b1.unit52.besprechungen: {title: "Meetings"}

lessons:
  de.b1.unit52.lesson01.koennten_wir_verschieben: {title: "Could we move ...?"}
  de.b1.unit52.lesson02.besprechungsaustausch: {title: "Meeting exchange"}
  de.b1.unit52.lesson03.professionelle_nachricht: {title: "A professional message"}

teaching:
  de.b1.unit52.lesson01.teach.felix_koennten_wir: {title: "Felix makes a formal request", gloss: "Felix: Could we move the meeting to 2 pm?", note: "*Könnten wir ... verschieben?* is a formal-register softened conditional request (Konjunktiv II of können).", example_gloss: "Request: Could we move the meeting to 2 pm?"}
  de.b1.unit52.lesson01.teach.felix_wuerde_vorschlagen_zeitplan: {title: "Felix softens a suggestion", gloss: "Felix: I would suggest that we discuss the schedule first.", note: "*Ich würde vorschlagen, dass ...* softens a workplace suggestion.", example_gloss: "Suggestion: I would suggest that we discuss the schedule first."}
  de.b1.unit52.lesson02.teach.vogel_passt_gut: {title: "Frau Vogel responds", gloss: "Frau Vogel: That works for me, but maybe 3 pm would be better.", note: "A short meeting-exchange response, accepting with a nuance: *Das passt mir* (from *passen*, to suit) means 'that works for me'.", example_gloss: "Response: That works for me, but maybe 3 pm would be better."}
  de.b1.unit52.lesson02.teach.felix_einverstanden: {title: "Felix agrees and confirms next step", gloss: "Felix: Agreed, I'll send you the new invitation.", note: "Confirms agreement and states the next professional step.", example_gloss: "Agreement: Agreed, I'll send you the new invitation."}
  de.b1.unit52.lesson03.teach.felix_ask_dialogue: {title: "Felix opens the meeting exchange", gloss: "Felix: Could we move the meeting to 2 pm?", note: "*Könnten wir ... verschieben?* -- the polite Konjunktiv II request that opens the exchange."}
  de.b1.unit52.lesson03.teach.vogel_response_dialogue: {title: "Frau Vogel proposes an alternative", gloss: "Frau Vogel: That works for me, but maybe 3 pm would be better.", note: "*Das passt mir gut, aber ...* accepts the request, then *vielleicht wäre ... besser* softly proposes an alternative."}
  de.b1.unit52.lesson03.teach.felix_agree_dialogue: {title: "Felix agrees", gloss: "Felix: Agreed, I'll send you the new invitation.", note: "*Einverstanden* accepts the counter-proposal; *ich schicke Ihnen ...* names the next step, with formal *Ihnen* (dative of *Sie*)."}
  de.b1.unit52.lesson03.teach.felix_email: {title: "Felix writes a professional message", gloss: "Dear Ms. Vogel, I would suggest that we discuss the schedule first. Kind regards, Felix.", note: "*Sehr geehrte ...* / *Mit freundlichen Grüßen* frame a brief professional written message around the softened suggestion. Unlike English *Kind regards,*, no comma follows *Mit freundlichen Grüßen*; in a real letter the name goes on the next line.", example_gloss: "Email: Dear Ms. Vogel, I would suggest that we discuss the schedule first. Kind regards, Felix."}

