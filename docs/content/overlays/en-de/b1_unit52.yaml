  notes: "Fourth unit of the de B1 completion wave (units 49-53). Needs fresh-context review.\n\nFresh-context review 2026-10-11 (content-reviewer.md checklist): checked German accuracy, register (formal Sie), character canon (Felix/Frau Vogel), prompt-to-answer determinacy of every writing prompt, accepted-answer completeness against grading (case/punctuation-insensitive, one-character typo tolerance), matching pairs and distractors, learner-visible notes. Fixes: de.b1.unit52.lesson01.exercise06.write_felix_koennten_wir prompt/instruction 'could you move' -> 'could we move' (matches the required Könnten wir). de.b1.unit52.lesson03.exercise06.write_request_and_message prompt/instruction re-pinned: the request exactly with Könnten wir ... verschieben? ('could we'), the message to Frau Vogel opening with Sehr geehrte Frau Vogel and closing with Mit freundlichen Grüßen (was 'could you', unpinned form, unnamed recipient -- correct answers such as 'Könnten Sie ...' or 'Sehr geehrte Damen und Herren' were graded wrong); overlay accepted answers widened with the Felix-signed closing ('... Mit freundlichen Grüßen, Felix.' + ASCII variant). Overlay notes of lesson03.teach.felix_ask_dialogue / vogel_response_dialogue / felix_agree_dialogue rewritten from lesson-recap text to language-point notes. NATIVE FLAG: lesson01 exercise02 distractor 'Ich schlage vor, dass wir zuerst den Zeitplan besprechen.' differs from the key only in softening (würde) -- defensible since softening is the tested point, but a native should confirm it does not read as an equally valid answer. DEFERRED: none.\n\nSecond-pass review 2026-10-19: 9 fixes — lesson01.exercise01 distractor 'Könnten wir das Meeting absagen?' -> 'Könnten Sie das Meeting auf 14 Uhr verschieben?' and lesson01.exercise02 distractor '... dass wir zuletzt den Zeitplan besprechen.' -> '... dass wir morgen den Zeitplan besprechen.' and lesson02.exercise01 distractor '... und 15 Uhr ist perfekt.' -> '... und 15 Uhr ist auch gut.' (absag