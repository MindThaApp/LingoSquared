course:
  title: "German B1"
  description: "Learn B1-level German for communicating professionally in meetings -- making a formal-register request with Könnten wir ... verschieben?, participating in a short meeting exchange, and writing a brief professional message."

units:
  de.b1.unit52.besprechungen: {title: "Meetings"}

lessons:
  de.b1.unit52.lesson01.koennten_wir_verschieben: {title: "Could we move ...?"}
  de.b1.unit52.lesson02.besprechungsaustausch: {title: "Meeting exchange"}
  de.b1.unit52.lesson03.professionelle_nachricht: {title: "A professional message"}

teaching:
  de.b1.unit52.lesson01.teach.felix_koennten_wir: {title: "Felix makes a formal request", gloss: "Felix: Could we move the meeting to 2 pm?", note: "*Könnten wir ... verschieben?* is a formal-register softened conditional request (Konjunktiv II of können).", example_gloss: "Request: Could we move the meeting to 2 pm?"}
  de.b1.unit52.lesson01.teach.felix_wuerde_vorschlagen_zeitplan: {title: "Felix softens a suggestion", gloss: "Felix: I would suggest that we discuss the schedule first.", note: "*Ich würde vorschlagen, dass ...* softens a workplace suggestion.", example_gloss: "Suggestion: I would suggest that we discuss the schedule first."}
  de.b1.unit52.lesson02.teach.vogel_passt_gut: {title: "Frau Vogel responds", gloss: "Frau Vogel: That works for me, but maybe 3 pm would be better.", note: "A short meeting-exchange response, accepting with a nuance.", example_gloss: "Response: That works for me, but maybe 3 pm would be better."}
  de.b1.unit52.lesson02.teach.felix_einverstanden: {title: "Felix agrees and confirms next step", gloss: "Felix: Agreed, I'll send you the new invitation.", note: "Confirms agreement and states the next professional step.", example_gloss: "Agreement: Agreed, I'll send you the new invitation."}
  de.b1.unit52.lesson03.teach.felix_ask_dialogue: {title: "Felix opens the meeting exchange", gloss: "Felix: Could we move the meeting to 2 pm?", note: "Recaps the formal request from lesson01."}
  de.b1.unit52.lesson03.teach.vogel_response_dialogue: {title: "Frau Vogel proposes an alternative", gloss: "Frau Vogel: That works for me, but maybe 3 pm would be better.", note: "Recaps the meeting-exchange response from lesson02."}
  de.b1.unit52.lesson03.teach.felix_agree_dialogue: {title: "Felix agrees", gloss: "Felix: Agreed, I'll send you the new invitation.", note: "Recaps Felix's agreement from lesson02."}
  de.b1.unit52.lesson03.teach.felix_email: {title: "Felix writes a professional message", gloss: "Dear Ms. Vogel, I would suggest that we discuss the schedule first. Kind regards, Felix.", note: "*Sehr geehrte ...* / *Mit freundlichen Grüßen* frame a brief professional written message around the softened suggestion.", example_gloss: "Email: Dear Ms. Vogel, I would suggest that we discuss the schedule first. Kind regards, Felix."}

exercises:
  de.b1.unit52.lesson01.exercise01.recognize_felix_koennten_wir: {instruction: "Which German sentence means \"Could we move the meeting to 2 pm?\"?", correct_option: "Könnten wir das Meeting auf 14 Uhr verschieben?", distractors: ["Wir müssen das Meeting auf 14 Uhr verschieben.", "Könnten wir das Meeting auf 15 Uhr verschieben?", "Könnten wir das Meeting absagen?"], accepted_answers: [{value: "Könnten wir das Meeting auf 14 Uhr verschieben?", status: "correct"}], feedback: "*Könnten wir ... verschieben?* is a formal, softened conditional request."}
  de.b1.unit52.lesson01.exercise02.recognize_felix_wuerde_vorschlagen_zeitplan: {instruction: "Which German sentence means \"I would suggest that we discuss the schedule first.\"?", correct_option: "Ich würde vorschlagen, dass wir zuerst den Zeitplan besprechen.", distractors: ["Ich schlage vor, dass wir zuerst den Zeitplan besprechen.", "Ich würde vorschlagen, dass wir zuletzt den Zeitplan besprechen.", "Könnten wir zuerst den Zeitplan besprechen?"], accepted_answers: [{value: "Ich würde vorschlagen, dass wir zuerst den Zeitplan besprechen.", status: "correct"}], feedback: "*Ich würde vorschlagen, dass ...* softens the suggestion."}
  de.b1.unit52.lesson01.exercise03.listen_select_koennten_wir: {instruction: "Listen. What formal request does Felix make?", correct_option: "He asks to move the meeting to 2 pm.", distractors: ["He asks to move the meeting to 3 pm.", "He asks to cancel the meeting.", "He asks to add a colleague to the meeting."], accepted_answers: [{value: "He asks to move the meeting to 2 pm.", status: "correct"}], feedback: "The recording says *Könnten wir das Meeting auf 14 Uhr verschieben?*"}
  de.b1.unit52.lesson01.exercise04.match_koennten_wir_verschieben:
    instruction: "Match each German word or phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "Könnten wir das Meeting auf 14 Uhr verschieben?", right: "Could we move the meeting to 2 pm?"}
          - {left: "Ich würde vorschlagen, dass wir zuerst den Zeitplan besprechen.", right: "I would suggest that we discuss the schedule first."}
          - {left: "verschieben", right: "to postpone / move"}
          - {left: "der Zeitplan", right: "the schedule"}
          - {left: "besprechen", right: "to discuss"}
          - {left: "das Meeting", right: "the meeting"}
        status: "correct"
    feedback: "These pieces build a formal request and a softened suggestion."
  de.b1.unit52.lesson01.exercise05.order_felix_koennten_wir: {instruction: "Put the words in order to say \"Could we move the meeting to 2 pm?\"", accepted_answers: [{value: ["Könnten", "wir", "das", "Meeting", "auf", "14", "Uhr", "verschieben?"], status: "correct"}], feedback: "The correct order is *Könnten wir das Meeting auf 14 Uhr verschieben?*"}
  de.b1.unit52.lesson01.exercise06.write_felix_koennten_wir:
    instruction: "As Felix, make this formal-register request exactly with Könnten wir ... verschieben?: could you move the meeting to 2 pm?"
    accepted_answers:
      - {value: "Könnten wir das Meeting auf 14 Uhr verschieben?", status: "correct"}
      - {value: "Könnten wir das Meeting auf 14 Uhr verschieben", status: "correct"}
    feedback: "The model answer is *Könnten wir das Meeting auf 14 Uhr verschieben?*"
  de.b1.unit52.lesson02.exercise01.recognize_vogel_passt_gut: {instruction: "Which German sentence means \"That works for me, but maybe 3 pm would be better.\"?", correct_option: "Das passt mir gut, aber vielleicht wäre 15 Uhr besser.", distractors: ["Das passt mir nicht, vielleicht wäre 15 Uhr besser.", "Das passt mir gut, aber vielleicht wäre 14 Uhr besser.", "Das passt mir gut, und 15 Uhr ist perfekt."], accepted_answers: [{value: "Das passt mir gut, aber vielleicht wäre 15 Uhr besser.", status: "correct"}], feedback: "This accepts the request with a nuanced counter-suggestion."}
  de.b1.unit52.lesson02.exercise02.recognize_felix_einverstanden: {instruction: "Which German sentence means \"Agreed, I'll send you the new invitation.\"?", correct_option: "Einverstanden, ich schicke Ihnen die neue Einladung.", distractors: ["Nicht einverstanden, ich schicke Ihnen keine Einladung.", "Einverstanden, ich schicke Ihnen den Zeitplan.", "Einverstanden, ich schreibe Ihnen später."], accepted_answers: [{value: "Einverstanden, ich schicke Ihnen die neue Einladung.", status: "correct"}], feedback: "Confirms agreement and the concrete next step."}
  de.b1.unit52.lesson02.exercise03.listen_select_passt_gut: {instruction: "Listen. What time does the colleague suggest instead?", correct_option: "3 pm.", distractors: ["2 pm.", "4 pm.", "She doesn't suggest another time."], accepted_answers: [{value: "3 pm.", status: "correct"}], feedback: "The recording says *aber vielleicht wäre 15 Uhr besser*."}
  de.b1.unit52.lesson02.exercise04.match_besprechungsaustausch:
    instruction: "Match each German word or phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "Das passt mir gut, aber vielleicht wäre 15 Uhr besser.", right: "That works for me, but maybe 3 pm would be better."}
          - {left: "Einverstanden, ich schicke Ihnen die neue Einladung.", right: "Agreed, I'll send you the new invitation."}
          - {left: "passen", right: "to suit / work (for someone)"}
          - {left: "einverstanden", right: "agreed"}
          - {left: "die Einladung", right: "the invitation"}
          - {left: "schicken", right: "to send"}
        status: "correct"
    feedback: "These pieces build the meeting exchange and its resolution."
  de.b1.unit52.lesson02.exercise05.order_felix_einverstanden: {instruction: "Put the words in order to say \"Agreed, I'll send you the new invitation.\"", accepted_answers: [{value: ["Einverstanden,", "ich", "schicke", "Ihnen", "die", "neue", "Einladung."], status: "correct"}], feedback: "The correct order is *Einverstanden, ich schicke Ihnen die neue Einladung.*"}
  de.b1.unit52.lesson02.exercise06.write_felix_einverstanden:
    instruction: "As Felix, confirm exactly with Einverstanden, ich schicke Ihnen ...: agreed, you'll send them the new invitation."
    accepted_answers:
      - {value: "Einverstanden, ich schicke Ihnen die neue Einladung.", status: "correct"}
      - {value: "Einverstanden, ich schicke Ihnen die neue Einladung", status: "correct"}
      - {value: "Einverstanden ich schicke Ihnen die neue Einladung.", status: "correct"}
      - {value: "Einverstanden ich schicke Ihnen die neue Einladung", status: "correct"}
    feedback: "The model answer is *Einverstanden, ich schicke Ihnen die neue Einladung.*"
  de.b1.unit52.lesson03.exercise01.choose_meeting_time_agreed: {instruction: "In the meeting exchange, what does the colleague propose instead of Felix's original time?", correct_option: "3 pm instead of 2 pm.", distractors: ["2 pm instead of 3 pm.", "Cancelling the meeting entirely.", "Keeping the original time."], accepted_answers: [{value: "3 pm instead of 2 pm.", status: "correct"}], feedback: "Frau Vogel says *vielleicht wäre 15 Uhr besser*."}
  de.b1.unit52.lesson03.exercise02.choose_email_register: {instruction: "What is the register of Felix's written message?", correct_option: "Formal, using Sehr geehrte and Mit freundlichen Grüßen.", distractors: ["Casual, using du and Tschüss.", "Formal, but using no salutation or closing.", "Casual, using first names only."], accepted_answers: [{value: "Formal, using Sehr geehrte and Mit freundlichen Grüßen.", status: "correct"}], feedback: "The message opens *Sehr geehrte Frau Vogel* and closes *Mit freundlichen Grüßen*."}
  de.b1.unit52.lesson03.exercise03.listen_dialogue_besprechungen: {instruction: "Listen to the meeting exchange. What do Felix and his colleague finally agree on?", correct_option: "They agree on 3 pm, and Felix will send the new invitation.", distractors: ["They agree on 2 pm, and Frau Vogel will send the invitation.", "They cancel the meeting.", "They agree on 3 pm, but no one sends an invitation."], accepted_answers: [{value: "They agree on 3 pm, and Felix will send the new invitation.", status: "correct"}], feedback: "Felix says *Einverstanden, ich schicke Ihnen die neue Einladung*."}
  de.b1.unit52.lesson03.exercise04.match_professionelle_nachricht:
    instruction: "Match each German word or phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "Sehr geehrte Frau Vogel,", right: "Dear Ms. Vogel, (formal salutation)"}
          - {left: "Mit freundlichen Grüßen,", right: "Kind regards, (formal closing)"}
          - {left: "Einverstanden", right: "agreed"}
          - {left: "Das passt mir gut", right: "that works for me"}
          - {left: "geehrte", right: "esteemed / dear (formal)"}
          - {left: "die Einladung", right: "the invitation"}
        status: "correct"
    feedback: "These pieces frame the meeting exchange and the professional message."
  de.b1.unit52.lesson03.exercise05.order_felix_email_opening: {instruction: "Put the words in order to say \"Dear Ms. Vogel, I would suggest that we discuss the schedule first.\"", accepted_answers: [{value: ["Sehr", "geehrte", "Frau", "Vogel,", "ich", "würde", "vorschlagen,", "dass", "wir", "zuerst", "den", "Zeitplan", "besprechen."], status: "correct"}], feedback: "The correct order is *Sehr geehrte Frau Vogel, ich würde vorschlagen, dass wir zuerst den Zeitplan besprechen.*"}
  de.b1.unit52.lesson03.exercise06.write_request_and_message:
    instruction: "Write two things: (1) as Felix, a formal-register request using a softened conditional form: could you move the meeting to 2 pm?; (2) then a brief professional message with a formal salutation and closing, suggesting with Ich würde vorschlagen, dass ...: discuss the schedule first."
    accepted_answers:
      - {value: "Könnten wir das Meeting auf 14 Uhr verschieben? Sehr geehrte Frau Vogel, ich würde vorschlagen, dass wir zuerst den Zeitplan besprechen. Mit freundlichen Grüßen.", status: "correct"}
      - {value: "Könnten wir das Meeting auf 14 Uhr verschieben? Sehr geehrte Frau Vogel, ich würde vorschlagen, dass wir zuerst den Zeitplan besprechen. Mit freundlichen Grüßen", status: "correct"}
      - {value: "Könnten wir das Meeting auf 14 Uhr verschieben? Sehr geehrte Frau Vogel, ich würde vorschlagen dass wir zuerst den Zeitplan besprechen. Mit freundlichen Grüßen.", status: "correct"}
      - {value: "Könnten wir das Meeting auf 14 Uhr verschieben? Sehr geehrte Frau Vogel, ich würde vorschlagen dass wir zuerst den Zeitplan besprechen. Mit freundlichen Grüßen", status: "correct"}
    feedback: "A complete answer makes the formal request, then writes the professional message: *Könnten wir das Meeting auf 14 Uhr verschieben? Sehr geehrte Frau Vogel, ich würde vorschlagen, dass wir zuerst den Zeitplan besprechen. Mit freundlichen Grüßen.*"
