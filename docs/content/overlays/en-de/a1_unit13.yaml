teaching:
  de.a1.unit13.lesson01.teach.gestern: {title: "gestern", gloss: "yesterday", note: "*gestern* anchors the event in the recent past.", example_gloss: "In context: Yesterday I was in the park."}
  de.a1.unit13.lesson01.teach.gemacht: {title: "Was haben Sie gestern gemacht?", gloss: "What did you do yesterday?", note: "German often uses *haben* plus a past participle for recent completed events.", example_gloss: "In context: What did you do yesterday?"}
  de.a1.unit13.lesson01.teach.gekauft: {title: "Ich habe Brot gekauft.", gloss: "I bought bread.", note: "The participle *gekauft* goes at the end.", example_gloss: "In context: I bought bread."}
  de.a1.unit13.lesson01.teach.gegessen: {title: "Ich habe Suppe gegessen.", gloss: "I ate soup.", note: "*gegessen* is the past participle of *essen*.", example_gloss: "In context: I ate soup."}
  de.a1.unit13.lesson01.teach.gegangen: {title: "Ich bin zum Markt gegangen.", gloss: "I went to the market.", note: "Motion to a place uses *bin ... gegangen*, not *habe ... gegangen*.", example_gloss: "In context: I went to the market."}
  de.a1.unit13.lesson02.teach.war: {title: "Es war sehr gut.", gloss: "It was very good.", note: "*war* is the simple past form of *ist*.", example_gloss: "In context: It was very good."}
  de.a1.unit13.lesson02.teach.bericht_text: {title: "Kurzer Bericht", gloss: "short account", note: "The account gives several completed actions in sequence.", example_gloss: "In context: Yesterday I went to the market."}
  de.a1.unit13.lesson02.teach.line01: {title: "Felix fragt nach gestern", gloss: "Felix: Was haben Sie gestern gemacht?", note: "A standard way to ask about yesterday.", example_gloss: "In context: What did you do yesterday?"}
  de.a1.unit13.lesson02.teach.line02: {title: "Anna berichtet", gloss: "Anna: Ich bin zum Markt gegangen. Ich habe Brot gekauft und Suppe gegessen.", note: "Anna uses *bin* for going and *habe* for buying/eating.", example_gloss: "In context: I bought bread."}
  de.a1.unit13.lesson02.teach.line03: {title: "Felix fragt nach Bewertung", gloss: "Felix: War es gut?", note: "*War es gut?* asks how the event was.", example_gloss: "In context: Was it good?"}
  de.a1.unit13.lesson02.teach.line04: {title: "Anna bewertet", gloss: "Anna: Ja, es war sehr gut.", note: "A simple closing evaluation.", example_gloss: "In context: Yes, it was very good."}
exercises:
  de.a1.unit13.lesson01.exercise01.listen_gegessen: {instruction: "Listen and select the phrase meaning 'I ate.'", correct_option: "ich habe gegessen", distractors: ["ich bin gegangen", "ich habe gekauft", "gestern"], accepted_answers: [{value: "ich habe gegessen", status: "correct"}], feedback: "*ich habe gegessen* means I ate."}
  de.a1.unit13.lesson01.exercise02.choose_gestern: {instruction: "Which word means yesterday?", correct_option: "gestern", distractors: ["morgen", "heute", "Abend"], accepted_answers: [{value: "gestern", status: "correct"}], feedback: "*gestern* means yesterday."}
  de.a1.unit13.lesson01.exercise03.match_perfekt:
    instruction: "Match each clue to the recent-past form."
    accepted_answers: [{value: [{left: "der Tag vor heute", right: "gestern"}, {left: "Brot bezahlt und mitgenommen", right: "gekauft"}, {left: "Suppe war das Essen", right: "gegessen"}, {left: "zu einem Ort gelaufen", right: "gegangen"}, {left: "Frage nach einer Aktivität", right: "Was haben Sie gemacht?"}, {left: "Ort für frisches Essen", right: "Markt"}], status: "correct"}]
    feedback: "The forms match completed actions."
  de.a1.unit13.lesson01.exercise04.order_gegessen: {instruction: "Put the words in order: 'I ate soup.'", accepted_answers: [{value: ["Ich", "habe", "Suppe", "gegessen"], status: "correct"}], feedback: "The participle *gegessen* goes at the end."}
  de.a1.unit13.lesson01.exercise05.write_gegangen: {instruction: "Write: I went to the market.", accepted_answers: [{value: "Ich bin zum Markt gegangen", status: "correct"}, {value: "Ich bin zum Markt gegangen.", status: "correct"}], feedback: "Use *bin ... gegangen* for going to a place."}
  de.a1.unit13.lesson02.exercise01.listen_event: {instruction: "Listen to the dialogue. Where did Anna go?", correct_option: "zum Markt", distractors: ["zum Museum", "zur Bank", "in den Park"], accepted_answers: [{value: "zum Markt", status: "correct"}], feedback: "Anna says *Ich bin zum Markt gegangen*."}
  de.a1.unit13.lesson02.exercise02.choose_food: {instruction: "What food does Anna mention?", correct_option: "Brot und Suppe", distractors: ["Kaffee und Tee", "Äpfel und Eier", "Wasser und Brot"], accepted_answers: [{value: "Brot und Suppe", status: "correct"}], feedback: "Anna bought bread and ate soup."}
  de.a1.unit13.lesson02.exercise03.match_sequence:
    instruction: "Match the details from Anna's account."
    accepted_answers: [{value: [{left: "Wohin ist Anna gegangen?", right: "zum Markt"}, {left: "Was hat Anna gekauft?", right: "Brot"}, {left: "Was hat Anna gegessen?", right: "Suppe"}, {left: "Wie war es?", right: "sehr gut"}, {left: "Wann war das?", right: "gestern"}, {left: "Vergangenheitsform von ist", right: "war"}], status: "correct"}]
    feedback: "These details summarize the recent event."
  de.a1.unit13.lesson02.exercise04.order_market: {instruction: "Put the words in order: 'I went to the market.'", accepted_answers: [{value: ["Ich", "bin", "zum", "Markt", "gegangen"], status: "correct"}], feedback: "Use *bin* with *gegangen*."}
  de.a1.unit13.lesson02.exercise05.reply_recent_event: {instruction: "Felix asks what you did yesterday and whether it was good. Reply as Anna with going to the market, buying bread, eating soup, and saying it was very good.", accepted_answers: [{value: "Ich bin zum Markt gegangen. Ich habe Brot gekauft und Suppe gegessen. Es war sehr gut.", status: "correct"}, {value: "Ich bin zum Markt gegangen Ich habe Brot gekauft und Suppe gegessen Es war sehr gut", status: "correct"}], feedback: "The answer gives a short completed-event account."}
  de.a1.unit13.lesson02.exercise06.write_recent_event: {instruction: "Write several simple sentences about yesterday: you went to the market, bought bread, then ate soup.", accepted_answers: [{value: "Gestern bin ich zum Markt gegangen. Ich habe Brot gekauft. Dann habe ich Suppe gegessen.", status: "correct"}, {value: "Gestern bin ich zum Markt gegangen Ich habe Brot gekauft Dann habe ich Suppe gegessen", status: "correct"}, {value: "Ich bin gestern zum Markt gegangen. Ich habe Brot gekauft. Dann habe ich Suppe gegessen.", status: "correct"}, {value: "Ich bin gestern zum Markt gegangen Ich habe Brot gekauft Dann habe ich Suppe gegessen", status: "correct"}], feedback: "This is a connected recent-past account."}
