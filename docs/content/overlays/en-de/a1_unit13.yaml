teaching:
  de.a1.unit13.lesson01.teach.gestern: {title: "gestern", gloss: "yesterday", note: "*gestern* anchors the event in the recent past.", example_gloss: "Yesterday I was in the park."}
  de.a1.unit13.lesson01.teach.gemacht: {title: "Was haben Sie gestern gemacht?", gloss: "What did you do yesterday?", note: "German often uses *haben* plus a past participle for recent completed events."}
  de.a1.unit13.lesson01.teach.gekauft: {title: "Ich habe Brot gekauft.", gloss: "I bought bread.", note: "The participle *gekauft* goes at the end."}
  de.a1.unit13.lesson01.teach.gegessen: {title: "Ich habe Suppe gegessen.", gloss: "I ate soup.", note: "*gegessen* is the past participle of *essen*.", example_gloss: "In context: I bought bread and ate soup."}
  de.a1.unit13.lesson01.teach.gegangen: {title: "Ich bin zum Markt gegangen.", gloss: "I went to the market.", note: "Motion to a place uses *bin ... gegangen*, not *habe ... gegangen*."}
  de.a1.unit13.lesson02.teach.war: {title: "Es war sehr gut.", gloss: "It was very good.", note: "*war* is the simple past of *sein* (to be): *es ist* (it is) becomes *es war* (it was)."}
  de.a1.unit13.lesson02.teach.bericht_text: {title: "Kurzer Bericht", gloss: "short account", note: "The account gives several completed actions in sequence.", example_gloss: "Yesterday I went to the market."}
  de.a1.unit13.lesson02.teach.line01: {title: "Felix asks about yesterday", gloss: "Felix: What did you do yesterday?", note: "A standard way to ask about yesterday."}
  de.a1.unit13.lesson02.teach.line02: {title: "Anna describes her day", gloss: "Anna: I went to the market. I bought bread and ate soup.", note: "Anna uses *bin* for going and *habe* for buying/eating.", example_gloss: "In context: I bought bread."}
  de.a1.unit13.lesson02.teach.line03: {title: "Felix asks how it was", gloss: "Felix: Was it good?", note: "*War es gut?* asks how the event was."}
  de.a1.unit13.lesson02.teach.line04: {title: "Anna says it was good", gloss: "Anna: Yes, it was very good.", note: "A simple closing evaluation."}
