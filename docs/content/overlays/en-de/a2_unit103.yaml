review: {"status": "unreviewed", "required_next_reviewer": "native_speaker_review", "notes": "English overlay for the future unit (werden plus infinitive, vielleicht/wahrscheinlich/bestimmt, promises). OPEN NATIVE QUESTIONS: none beyond the realization notes."}
course:
  title: "German A2"
  description: "Grammar-led A2 German continuing the Anna and Felix storyline."
  learning_goal: "Make predictions, follow rules, state what you can do, ask politely, give advice and talk about habits in German."
units:
  de.a2.unit103.vorhersagen: {"title": "It Will Be Sunny Tomorrow", "description": "Predict what will happen with werden plus infinitive, say what will probably or possibly happen with vielleicht, wahrscheinlich and bestimmt, and make a simple promise."}
lessons:
  de.a2.unit103.lesson01.ich_werde: {"title": "I Will Come"}
  de.a2.unit103.lesson02.vielleicht_bestimmt: {"title": "Maybe and Definitely"}
  de.a2.unit103.lesson03.versprechen: {"title": "I Promise"}
  de.a2.unit103.lesson04.wetterbericht: {"title": "The Weather Report"}
  de.a2.unit103.lesson05.ausflug: {"title": "The Trip"}
  de.a2.unit103.lesson06.am_telefon: {"title": "Anna and Felix Talk on the Phone"}
teaching:
  de.a2.unit103.lesson01.teach.wetter: {"title": "The weather", "gloss": "weather / tomorrow / to rain / to snow / cold / warm", "example_gloss": ["Tomorrow it will rain.", "It will snow tomorrow.", "The weather will be cold.", "It will be warm."], "note": "Words for simple weather predictions. *Regnen* and *schneien* only exist with *es*."}
  de.a2.unit103.lesson01.teach.gn_werden: {"title": "Werden plus infinitive", "gloss": "I will come, you will come, he will come, we will come, you (plural) will come, they will come", "note": "The future is built with *werden* plus the infinitive. Note the irregular *du wirst* and *er wird*."}
  de.a2.unit103.lesson01.teach.gn_klammer: {"title": "Werden is second, the infinitive is last", "gloss": "It will rain tomorrow. Tomorrow it will rain.", "note": "*Werden* stays in second position; the infinitive goes to the very end. If a time word starts the sentence, the subject moves behind *wird*."}
  de.a2.unit103.lesson01.teach.satz_kalt: {"title": "A short forecast", "gloss": "Tomorrow it will be cold. It will rain."}
  de.a2.unit103.lesson02.teach.sicher: {"title": "How sure are you?", "gloss": "maybe / probably / definitely / not / soon", "example_gloss": ["Maybe it will snow.", "Felix will probably come.", "It definitely won't snow.", "Anna will come soon."], "note": "Three levels of certainty: *vielleicht* (maybe), *wahrscheinlich* (probably), *bestimmt* (definitely)."}
  de.a2.unit103.lesson02.teach.gn_vielleicht: {"title": "Vielleicht at the start", "gloss": "Maybe it will rain. It will maybe rain.", "note": "When *vielleicht* starts the sentence, the verb *wird* is still second and the subject follows it."}
  de.a2.unit103.lesson02.teach.gn_grad: {"title": "More and more sure", "gloss": "Felix will maybe come. Felix will probably come. Felix will definitely come.", "note": "These adverbs usually stand between *wird* and the infinitive."}
  de.a2.unit103.lesson02.teach.gn_praesens: {"title": "Present tense with a time word", "gloss": "It will rain tomorrow. Next week we are going to Hamburg.", "note": "For plans, German often uses the present tense with a time word. For a prediction without a time word, use *werden*."}
  de.a2.unit103.lesson02.teach.satz_regnen: {"title": "Rainy day", "gloss": "It will probably rain. I'm staying at home."}
  de.a2.unit103.lesson03.teach.versprechen: {"title": "Making a promise", "gloss": "to promise / on time / to call / to help / to forget / too late", "example_gloss": ["I promise you.", "I will be on time.", "I will call you.", "I will help you."], "note": "*Anrufen* is separable; in the future it stays together as an infinitive at the end. *Helfen* takes *dir*."}
  de.a2.unit103.lesson03.teach.gn_versprechen: {"title": "Promises with werden", "gloss": "I will be on time. I will call you. I will help you.", "note": "*Ich werde ...* is the normal way to promise something. The infinitive goes last."}
  de.a2.unit103.lesson03.teach.gn_das: {"title": "Object first", "gloss": "I won't forget that. I will tell you that.", "note": "If the object *das* starts the sentence, *werde* is still second and *ich* follows."}
  de.a2.unit103.lesson03.teach.gn_nicht: {"title": "Nicht in a promise", "gloss": "I will not come too late. I will not forget it.", "note": "*Nicht* stands before the infinitive, and after *es*."}
  de.a2.unit103.lesson03.teach.satz_sorge: {"title": "Don't worry", "gloss": "Don't worry! I will be on time."}
  de.a2.unit103.lesson04.teach.bericht: {"title": "The forecast", "gloss": "weather report / sunny / windy / on Saturday / on Sunday / at the weekend / next week", "example_gloss": ["The weather report says: It will be sunny.", "On Saturday it will be sunny.", "Next week it will be windy.", "At the weekend I'm staying at home."], "note": "*Am* + weekday says on which day."}
  de.a2.unit103.lesson04.teach.gn_tag: {"title": "A day first", "gloss": "On Saturday it will be sunny. On Sunday it will rain.", "note": "With *am Samstag* in first position, *wird es* follows."}
  de.a2.unit103.lesson04.teach.gn_plan: {"title": "Plan or prediction?", "gloss": "I'm going to Hamburg tomorrow. It will rain there.", "note": "A plan can be in the present tense (*fahre*). A prediction about weather uses *werden*."}
  de.a2.unit103.lesson04.teach.gn_wetterbericht: {"title": "Reporting a forecast", "gloss": "The weather report says: It will be sunny. Next week it will be windy.", "note": "After the colon a new main clause begins with *wird* in second position."}
  de.a2.unit103.lesson04.teach.satz_dort: {"title": "Weather somewhere else", "gloss": "It will be windy there."}
  de.a2.unit103.lesson05.teach.ausflug: {"title": "Words for the story", "gloss": "trip / Baltic Sea / to make / sure / nice / also / but", "example_gloss": ["Felix is going on a trip to the Baltic Sea.", "Jonas is not sure.", "It will certainly be nice.", "It will also be sunny on Sunday."], "note": "*Einen Ausflug machen* = to go on a trip."}
  de.a2.unit103.lesson05.teach.gn_text: {"title": "Who is sure?", "gloss": "Anna says: It will certainly be nice. Jonas is not sure.", "note": "Look for *bestimmt* (sure) against *vielleicht* (not sure) in the text."}
  de.a2.unit103.lesson05.teach.lesen_ostsee: {"title": "The trip to the sea", "gloss": "On Saturday Felix, Anna, Nina and Jonas go on a trip to the Baltic Sea. The weather report says: On Saturday it will be sunny, but on Sunday it will rain. Jonas is not sure. He says: Maybe it will also rain on Saturday. Anna says: Don't worry! It will certainly be nice. Felix promises: I will be on time.", "note": "The text mixes a forecast, a doubt, a reassurance and a promise, all with *werden*."}
  de.a2.unit103.lesson06.teach.felix_frage: {"title": "Felix asks", "gloss": "Felix: Hi Anna! Will it rain tomorrow?"}
  de.a2.unit103.lesson06.teach.anna_sonnig: {"title": "Anna answers", "gloss": "Anna: I don't think so. The weather report says: It will be sunny."}
  de.a2.unit103.lesson06.teach.felix_jonas: {"title": "Felix thinks of Jonas", "gloss": "Felix: Then Jonas will certainly come along too."}
  de.a2.unit103.lesson06.teach.anna_vielleicht: {"title": "Anna is careful", "gloss": "Anna: Maybe. He is not sure yet."}
  de.a2.unit103.lesson06.teach.felix_nina: {"title": "Felix has a plan", "gloss": "Felix: I will call Nina."}
  de.a2.unit103.lesson06.teach.anna_puenktlich: {"title": "Anna asks", "gloss": "Anna: Good! Will you be on time?"}
  de.a2.unit103.lesson06.teach.felix_versprechen: {"title": "Felix promises", "gloss": "Felix: Yes, I promise you."}
exercises:
  de.a2.unit103.lesson01.exercise01.wahl_regnen: {"instruction": "Choose the correct German sentence.", "correct_option": "Morgen wird es regnen.", "distractors": ["Morgen wird es regnet.", "Morgen werden es regnen.", "Morgen es wird regnen."], "accepted_answers": [{"value": "Morgen wird es regnen.", "status": "correct"}], "feedback": "*Wird* is second, the infinitive *regnen* is last."}
  de.a2.unit103.lesson01.exercise02.wahl_wirst: {"instruction": "Choose the correct German sentence.", "correct_option": "Du wirst morgen kommen.", "distractors": ["Du wird morgen kommen.", "Du wirst morgen gekommen.", "Du werde morgen kommen."], "accepted_answers": [{"value": "Du wirst morgen kommen.", "status": "correct"}], "feedback": "With *du* the form is *wirst*."}
  de.a2.unit103.lesson01.exercise03.paare_formen: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "ich werde kommen", "right": "I will come"}, {"left": "du wirst kommen", "right": "you will come"}, {"left": "er wird kommen", "right": "he will come"}, {"left": "wir werden kommen", "right": "we will come"}, {"left": "ihr werdet kommen", "right": "you (plural) will come"}, {"left": "sie werden kommen", "right": "they will come"}], "status": "correct"}], "feedback": "Forms of werden: werde, wirst, wird, werden, werdet, werden."}
  de.a2.unit103.lesson01.exercise04.ordnen_kalt: {"instruction": "Put the words in order to say 'It will be cold tomorrow.'", "correct_option": "Es wird morgen kalt sein", "accepted_answers": [{"value": "Es wird morgen kalt sein", "status": "correct"}, {"value": "Morgen wird es kalt sein", "status": "correct"}], "feedback": "*Wird* second, *sein* last."}
  de.a2.unit103.lesson01.exercise05.luecke_wird: {"instruction": "Complete with the correct form of werden.", "correct_option": "wird", "accepted_answers": [{"value": "wird", "status": "correct"}], "feedback": "*Es wird* - the infinitive *regnen* stays at the end."}
  de.a2.unit103.lesson01.exercise06.uebersetzen_warm: {"instruction": "Translate into German.", "accepted_answers": [{"value": "Morgen wird es warm sein.", "status": "correct"}, {"value": "Es wird morgen warm sein.", "status": "correct"}], "feedback": "*Wird ... sein* - both word orders are correct."}
  de.a2.unit103.lesson01.exercise07.schreiben_wir: {"instruction": "Write the requested German sentence.", "correct_option": "Wir werden morgen kommen.", "accepted_answers": [{"value": "Wir werden morgen kommen.", "status": "correct"}, {"value": "Morgen werden wir kommen.", "status": "correct"}], "feedback": "*Werden* + *kommen* at the end."}
  de.a2.unit103.lesson02.exercise01.wahl_schneien: {"instruction": "Choose the correct German sentence.", "correct_option": "Vielleicht wird es schneien.", "distractors": ["Vielleicht es wird schneien.", "Vielleicht schneien wird es.", "Vielleicht wird es schneit."], "accepted_answers": [{"value": "Vielleicht wird es schneien.", "status": "correct"}], "feedback": "After *vielleicht* the verb *wird* is second."}
  de.a2.unit103.lesson02.exercise02.wahl_felix: {"instruction": "Choose the correct German sentence.", "correct_option": "Felix wird wahrscheinlich kommen.", "distractors": ["Felix wahrscheinlich wird kommen.", "Felix wird wahrscheinlich kommt.", "Felix wird kommen wahrscheinlich."], "accepted_answers": [{"value": "Felix wird wahrscheinlich kommen.", "status": "correct"}], "feedback": "*Wahrscheinlich* stands before the infinitive."}
  de.a2.unit103.lesson02.exercise03.paare_grad: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Felix wird bestimmt kommen.", "right": "Felix will definitely come."}, {"left": "Felix wird vielleicht kommen.", "right": "Felix will maybe come."}, {"left": "Felix wird wahrscheinlich kommen.", "right": "Felix will probably come."}, {"left": "Es wird bestimmt nicht schneien.", "right": "It definitely won't snow."}, {"left": "Morgen regnet es.", "right": "It will rain tomorrow."}, {"left": "Nächste Woche fahren wir nach Hamburg.", "right": "Next week we are going to Hamburg."}], "status": "correct"}], "feedback": "The three adverbs show how sure the speaker is."}
  de.a2.unit103.lesson02.exercise04.ordnen_anna: {"instruction": "Put the words in order to say 'Maybe Anna will come.'", "correct_option": "Vielleicht wird Anna kommen", "accepted_answers": [{"value": "Vielleicht wird Anna kommen", "status": "correct"}, {"value": "Anna wird vielleicht kommen", "status": "correct"}], "feedback": "Verb second after *vielleicht*."}
  de.a2.unit103.lesson02.exercise05.luecke_vielleicht: {"instruction": "Complete with the correct form of werden.", "correct_option": "wird", "accepted_answers": [{"value": "wird", "status": "correct"}], "feedback": "*Wird* is second, *regnen* last."}
  de.a2.unit103.lesson02.exercise06.uebersetzen_nicht: {"instruction": "Translate into German.", "accepted_answers": [{"value": "Es wird bestimmt nicht schneien.", "status": "correct"}, {"value": "Bestimmt wird es nicht schneien.", "status": "correct"}], "feedback": "*Nicht* stands before the infinitive."}
  de.a2.unit103.lesson02.exercise07.schreiben_anna: {"instruction": "Write the requested German sentence.", "correct_option": "Anna wird morgen wahrscheinlich kommen.", "accepted_answers": [{"value": "Anna wird morgen wahrscheinlich kommen.", "status": "correct"}, {"value": "Morgen wird Anna wahrscheinlich kommen.", "status": "correct"}, {"value": "Anna wird wahrscheinlich morgen kommen.", "status": "correct"}, {"value": "Wahrscheinlich wird Anna morgen kommen.", "status": "correct"}, {"value": "Morgen wird wahrscheinlich Anna kommen.", "status": "correct"}], "feedback": "Time and *wahrscheinlich* stand between *wird* and *kommen*."}
  de.a2.unit103.lesson03.exercise01.wahl_anrufen: {"instruction": "Choose the correct German sentence.", "correct_option": "Ich werde dich anrufen.", "distractors": ["Ich werde dich anrufe.", "Ich werde anrufen dich.", "Ich werde dich angerufen."], "accepted_answers": [{"value": "Ich werde dich anrufen.", "status": "correct"}], "feedback": "The infinitive *anrufen* stays together at the end."}
  de.a2.unit103.lesson03.exercise02.wahl_vergessen: {"instruction": "Choose the correct German sentence.", "correct_option": "Ich werde es nicht vergessen.", "distractors": ["Ich werde es vergessen nicht.", "Ich wird es nicht vergessen.", "Ich werde es nicht vergessen werden."], "accepted_answers": [{"value": "Ich werde es nicht vergessen.", "status": "correct"}], "feedback": "*Nicht* comes before the infinitive."}
  de.a2.unit103.lesson03.exercise03.paare_versprechen: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Ich verspreche es dir.", "right": "I promise you."}, {"left": "Ich werde pünktlich sein.", "right": "I will be on time."}, {"left": "Ich werde dich anrufen.", "right": "I will call you."}, {"left": "Ich werde dir helfen.", "right": "I will help you."}, {"left": "Ich werde nicht zu spät kommen.", "right": "I won't come too late."}, {"left": "Keine Sorge!", "right": "Don't worry!"}], "status": "correct"}], "feedback": "Phrases for promises."}
  de.a2.unit103.lesson03.exercise04.ordnen_helfen: {"instruction": "Put the words in order to say 'I will help you.'", "correct_option": "Ich werde dir helfen", "accepted_answers": [{"value": "Ich werde dir helfen", "status": "correct"}], "feedback": "*Helfen* needs *dir*."}
  de.a2.unit103.lesson03.exercise05.luecke_sein: {"instruction": "Complete with the infinitive that ends the sentence.", "correct_option": "sein", "accepted_answers": [{"value": "sein", "status": "correct"}], "feedback": "The infinitive goes at the end."}
  de.a2.unit103.lesson03.exercise06.uebersetzen_vergessen: {"instruction": "Translate into German.", "accepted_answers": [{"value": "Ich werde es nicht vergessen.", "status": "correct"}, {"value": "Ich werde das nicht vergessen.", "status": "correct"}, {"value": "Das werde ich nicht vergessen.", "status": "correct"}, {"value": "Ich vergesse es nicht.", "status": "correct"}], "feedback": "*Es* or *das* both work."}
  de.a2.unit103.lesson03.exercise07.schreiben_versprechen: {"instruction": "Write the requested German sentences.", "correct_option": "Ich werde pünktlich sein. Ich verspreche es.", "accepted_answers": [{"value": "Ich werde pünktlich sein. Ich verspreche es.", "status": "correct"}, {"value": "Ich werde puenktlich sein. Ich verspreche es.", "status": "correct"}, {"value": "Ich werde pünktlich sein. Ich verspreche es dir.", "status": "correct"}, {"value": "Ich werde puenktlich sein. Ich verspreche es dir.", "status": "correct"}], "feedback": "Use *werden* for the promise."}
  de.a2.unit103.lesson04.exercise01.wahl_samstag: {"instruction": "Choose the correct German sentence.", "correct_option": "Am Samstag wird es sonnig sein.", "distractors": ["Am Samstag es wird sonnig sein.", "Am Samstag wird sonnig es sein.", "Am Samstag wird es sonnig sind."], "accepted_answers": [{"value": "Am Samstag wird es sonnig sein.", "status": "correct"}], "feedback": "After *am Samstag* comes *wird es*."}
  de.a2.unit103.lesson04.exercise02.wahl_windig: {"instruction": "Choose the correct German sentence.", "correct_option": "Nächste Woche wird es windig sein.", "distractors": ["Nächste Woche es wird windig sein.", "Nächste Woche wird es windig sind.", "Nächste Woche wird windig es sein."], "accepted_answers": [{"value": "Nächste Woche wird es windig sein.", "status": "correct"}, {"value": "Naechste Woche wird es windig sein.", "status": "correct"}], "feedback": "*Wird es ... sein*."}
  de.a2.unit103.lesson04.exercise03.paare_bericht: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Der Wetterbericht sagt: Es wird sonnig.", "right": "The weather report says: It will be sunny."}, {"left": "Am Sonntag wird es regnen.", "right": "On Sunday it will rain."}, {"left": "Nächste Woche wird es kalt sein.", "right": "Next week it will be cold."}, {"left": "Ich fahre morgen nach Hamburg.", "right": "I'm going to Hamburg tomorrow."}, {"left": "Es wird dort windig sein.", "right": "It will be windy there."}, {"left": "Am Wochenende bleibe ich zu Hause.", "right": "At the weekend I'm staying at home."}], "status": "correct"}], "feedback": "Forecasts use werden, plans can use the present tense."}
  de.a2.unit103.lesson04.exercise04.ordnen_sonntag: {"instruction": "Put the words in order to say 'On Sunday it will rain.'", "correct_option": "Am Sonntag wird es regnen", "accepted_answers": [{"value": "Am Sonntag wird es regnen", "status": "correct"}], "feedback": "*Wird es* after the day."}
  de.a2.unit103.lesson04.exercise05.luecke_sagt: {"instruction": "Complete with the correct verb form.", "correct_option": "sagt", "accepted_answers": [{"value": "sagt", "status": "correct"}], "feedback": "*Der Wetterbericht sagt*."}
  de.a2.unit103.lesson04.exercise06.uebersetzen_dort: {"instruction": "Translate into German.", "accepted_answers": [{"value": "Es wird dort windig sein.", "status": "correct"}, {"value": "Dort wird es windig sein.", "status": "correct"}], "feedback": "Both word orders are correct."}
  de.a2.unit103.lesson04.exercise07.schreiben_sonntag: {"instruction": "Write the requested German sentence.", "correct_option": "Am Sonntag wird es kalt sein.", "accepted_answers": [{"value": "Am Sonntag wird es kalt sein.", "status": "correct"}, {"value": "Es wird am Sonntag kalt sein.", "status": "correct"}], "feedback": "*Am Sonntag wird es ... sein*."}
  de.a2.unit103.lesson05.exercise01.lesen_samstag: {"instruction": "Read the text and choose the answer.", "correct_option": "It will be sunny.", "distractors": ["It will rain.", "It will snow.", "It will be windy."], "accepted_answers": [{"value": "It will be sunny.", "status": "correct"}], "feedback": "*Am Samstag wird es sonnig sein.*"}
  de.a2.unit103.lesson05.exercise02.lesen_jonas: {"instruction": "Read the text and choose the answer.", "correct_option": "Jonas", "distractors": ["Anna", "Felix", "Nina"], "accepted_answers": [{"value": "Jonas", "status": "correct"}], "feedback": "*Jonas ist nicht sicher.*"}
  de.a2.unit103.lesson05.exercise03.paare_geschichte: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Der Wetterbericht sagt: Es wird sonnig.", "right": "The weather report says: It will be sunny."}, {"left": "Am Sonntag wird es regnen.", "right": "On Sunday it will rain."}, {"left": "Jonas ist nicht sicher.", "right": "Jonas is not sure."}, {"left": "Vielleicht wird es auch am Samstag regnen.", "right": "Maybe it will also rain on Saturday."}, {"left": "Es wird bestimmt schön.", "right": "It will certainly be nice."}, {"left": "Felix verspricht: Ich werde pünktlich sein.", "right": "Felix promises: I will be on time."}], "status": "correct"}], "feedback": "Match the lines of the story."}
  de.a2.unit103.lesson05.exercise04.ordnen_schoen: {"instruction": "Put the words in order to say 'It will certainly be nice.'", "correct_option": "Es wird bestimmt schön", "accepted_answers": [{"value": "Es wird bestimmt schön", "status": "correct"}], "feedback": "*Bestimmt* between *wird* and the end."}
  de.a2.unit103.lesson05.exercise05.uebersetzen_verspricht: {"instruction": "Translate into German.", "accepted_answers": [{"value": "Felix verspricht: Ich werde pünktlich sein.", "status": "correct"}, {"value": "Felix verspricht: Ich werde puenktlich sein.", "status": "correct"}], "feedback": "A colon introduces the promise."}
  de.a2.unit103.lesson05.exercise06.diktat_samstag: {"instruction": "Type what you hear.", "correct_response": "Am Samstag wird es sonnig sein.", "orthography_strict": true, "feedback": "You heard *Am Samstag wird es sonnig sein.*"}
  de.a2.unit103.lesson05.exercise07.diktat_puenktlich: {"instruction": "Type what you hear.", "correct_response": "Ich werde pünktlich sein.", "orthography_strict": true, "feedback": "You heard *Ich werde pünktlich sein.*"}
  de.a2.unit103.lesson06.exercise01.hoeren_frage: {"instruction": "Listen and select Felix's opening question.", "correct_option": "Hallo Anna! Wird es morgen regnen?", "distractors": ["Hallo Anna! Wird es morgen schneien?", "Hallo Felix! Wird es morgen regnen?", "Hallo Anna! Wird es morgen kalt sein?"], "accepted_answers": [{"value": "Hallo Anna! Wird es morgen regnen?", "status": "correct"}], "feedback": "Felix opens with *Hallo Anna! Wird es morgen regnen?*"}
  de.a2.unit103.lesson06.exercise02.verstehen_wetter: {"instruction": "Listen to the dialogue and choose the answer.", "correct_option": "It will be sunny.", "distractors": ["It will rain.", "It will be windy.", "It will snow."], "accepted_answers": [{"value": "It will be sunny.", "status": "correct"}], "feedback": "Anna quotes the weather report: sunny."}
  de.a2.unit103.lesson06.exercise03.paare_dialog: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Wird es morgen regnen?", "right": "Will it rain tomorrow?"}, {"left": "Ich glaube nicht.", "right": "I don't think so."}, {"left": "Es wird sonnig sein.", "right": "It will be sunny."}, {"left": "Dann kommt Jonas bestimmt auch mit.", "right": "Then Jonas will certainly come along too."}, {"left": "Ich werde Nina anrufen.", "right": "I will call Nina."}, {"left": "Ja, ich verspreche es dir.", "right": "Yes, I promise you."}], "status": "correct"}], "feedback": "Lines from the phone call."}
  de.a2.unit103.lesson06.exercise04.ordnen_puenktlich: {"instruction": "Put the words in order to say 'Will you be on time?'", "correct_option": "Wirst du pünktlich sein", "accepted_answers": [{"value": "Wirst du pünktlich sein", "status": "correct"}], "feedback": "Question: *wirst* first, *sein* last."}
  de.a2.unit103.lesson06.exercise05.antwort_versprechen: {"instruction": "Answer in German as Felix: say yes and promise it.", "correct_option": "Ja, ich verspreche es dir.", "accepted_answers": [{"value": "Ja, ich verspreche es dir.", "status": "correct"}, {"value": "Ja ich verspreche es dir.", "status": "correct"}, {"value": "Ja, ich verspreche es.", "status": "correct"}, {"value": "Ja ich verspreche es.", "status": "correct"}, {"value": "Ja, ich werde pünktlich sein.", "status": "correct"}, {"value": "Ja, ich werde puenktlich sein.", "status": "correct"}, {"value": "Ja ich werde pünktlich sein.", "status": "correct"}, {"value": "Ja ich werde puenktlich sein.", "status": "correct"}], "feedback": "*Ja, ich verspreche es dir.*"}
  de.a2.unit103.lesson06.exercise06.uebersetzen_bericht: {"instruction": "Translate into German.", "accepted_answers": [{"value": "Der Wetterbericht sagt: Morgen wird es sonnig sein.", "status": "correct"}, {"value": "Der Wetterbericht sagt: Es wird morgen sonnig sein.", "status": "correct"}], "feedback": "Both word orders are correct."}
