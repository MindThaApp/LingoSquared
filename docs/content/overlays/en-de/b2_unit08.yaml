      - {value: "Eine Quelle lobt das Homeoffice, wohingegen die andere es kritisiert", status: correct}
    feedback: "Eine Quelle lobt Homeoffice, wohingegen die andere es kritisiert means one source praises home office, whereas the other criticizes it."
  de.b2.unit08.lesson03.exercise07.speak_widerspricht:
    instruction: "Say aloud in German: This source contradicts the other."
    accepted_answers:
      - {value: "Diese Quelle widerspricht der anderen", status: correct}
    feedback: "Diese Quelle widerspricht der anderen means this source contradicts the other."

  de.b2.unit08.lesson04.exercise01.recognize_glaubwuerdig:
    instruction: "What does this word mean?"
    correct_option: credible
    distractors: [convincing, reliable-sounding but false, unimportant]
    accepted_answers: [{value: credible, status: correct}]
    feedback: "Glaubwürdig means credible."
  de.b2.unit08.lesson04.exercise02.listen_ueberzeugender:
    instruction: "Listen and select what you hear."
    correct_option: "The first source is more convincing, because it is better supported."
