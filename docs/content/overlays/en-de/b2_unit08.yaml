    feedback: "Meiner Meinung nach ist die erste Quelle überzeugender, weil sie besser belegt ist means in my opinion, the first source is more convincing, because it is better supported."
  de.b2.unit08.lesson04.exercise06.translate_glaubwuerdig:
    instruction: "Translate into German: This source is more credible."
    accepted_answers:
