  notes: >-
    Overlay for de's eighth and final B2 unit (first synthesis unit),
    authored alongside the realization (no adaptable upper-intermediate
    public-domain German source exists; see the realization provenance
    note). English speakers' real interference risks for this outcome:
    (1) "im Gegensatz dazu" (in contrast to that) requires the dummy
    pronoun "dazu" that English drops entirely -- flagged in lesson03;
    (2) "wohingegen" (whereas) sends its own clause's verb to the end,
    unlike English "whereas" -- flagged in lesson03's grammar note; (3)
    lowercase "sie" (she/it, referring to die Quelle, feminine) in
    lesson04's claim_model could be misread as capitalized formal "Sie"
    out of context -- flagged in the teaching gloss. No sibling direction
    file (de-en b2) was consulted.

    Fresh-context review 2026-10-11 (content-reviewer.md checklist): fixes
    applied: lesson01.exercise04.order_laut_studie,
    exercise05.translate_laut_studie and exercise07.speak_laut_studie --
    added accepted 'Homeoffice ist laut einer Studie produktiver' (equally
    correct placement of laut; the tiles build it too);
    lesson05.exercise06.translate_weniger_abgelenkt -- added 'Menschen im
    Homeoffice sind weniger abgelenkt' (state passive, the most natural
    rendering of 'are less distracted');
    lesson05.exercise07.write_verschlechtert -- added 'Die Zusammenarbeit
    verschlechtert sich' (prompt does not ask for 'im Team');
    lesson06.exercise05/06 synthesis -- added the variant with 'dass die
    Zusammenarbeit sich verschlechtert'; lesson02.teach.zeitersparnis
    example_gloss 'You save time.' -> 'The time savings are important.' (now
    translates its own example). NATIVE FLAGS: see realization notes
    (lesson06 'Sie befragte' after a colon; lesson05 reading never states
    the agreed point). DEFERRED: none.

    Second-pass review 2026-10-19: 3 fixes -- lesson04.teach.claim_model
    note: 'capitalized Sie (formal you), which never appears mid-clause like
    this' was false (formal Sie appears mid-clause all the time, e.g. weil
    Sie ...) -> now says mid-sentence the formal you is always capitalized
    Sie while lowercase sie is she/it/they;
    lesson03.exercise05.translate_gegensatz: +'... kritisiert die zweite
    Quelle Homeoffice' (no article, as in exercise06);
    lesson03.exercise06.translate_wohingegen: +'Eine Quelle lobt das
    Homeoffice, wohingegen ...'.

course:
  title: German B2
  description: >-
    Upper-intermediate German: synthesize and evaluate multiple sources
    -- combine information from two studies into a coherent summary, note
    where they agree or conflict, and give a reasoned judgement -- closing
    the tier by revisiting the home-office productivity question from
    unit01 at a higher skill level.

units:
  de.b2.unit08.synthese:
    title: "Synthese"
    description: Synthesize and evaluate two sources -- combine them into a coherent summary, note where they agree or conflict, and give a reasoned judgement about which is more convincing.

lessons:
  de.b2.unit08.lesson01.zwei_quellen_vergleichen:
    title: "Comparing two sources"
  de.b2.unit08.lesson02.uebereinstimmung_feststellen:
    title: "Identifying agreement"
  de.b2.unit08.lesson03.widerspruch_feststellen:
    title: "Identifying conflict"
  de.b2.unit08.lesson04.eine_quelle_bewerten:
    title: "Evaluating a source"
  de.b2.unit08.lesson05.zwei_studien_lesen:
    title: "Reading and summarizing two studies"
  de.b2.unit08.lesson06.eine_synthese_vorstellen:
    title: "Presenting a synthesis"

teaching:
  de.b2.unit08.lesson01.teach.quelle:
    title: source
    gloss: source
    example_gloss: "This source is reliable."
  de.b2.unit08.lesson01.teach.laut:
    title: "according to"
    gloss: "according to"
    example_gloss: "According to a study, many people work more productively at home."
  de.b2.unit08.lesson01.teach.eine_studie:
    title: "a study"
    gloss: "a study"
    note: "Singular *eine Studie* -- compare Unit 1's plural *Studien zeigen, dass* (studies show that). *Einer* is the genitive/dative form of *eine*, needed after *laut* and in *die Aussage einer Studie*."
    example_gloss: "That is the statement of a study."
  de.b2.unit08.lesson01.teach.erste_zweite:
    title: "the first / the second / the other"
    gloss: "the first / the second / the other"
    note: "*Erste*, *zweite*, and *andere* let you refer back to sources without repeating *Quelle* every time -- essential vocabulary for comparing two things."
    example_gloss: "The first source is better than the second."
  de.b2.unit08.lesson01.teach.vergleichen:
    title: "to compare"
    gloss: "to compare"
    example_gloss: "I compare two sources."
  de.b2.unit08.lesson01.teach.claim_model:
    title: "According to a study, home office is more productive."
    gloss: "According to a study, home office is more productive."
    note: "The model source-citing sentence for this unit -- *laut* introduces where a claim comes from."
  de.b2.unit08.lesson01.teach.grammar_quelle:
    title: "According to a study, home office is more productive. This source is reliable."
    gloss: "According to a study, home office is more productive. This source is reliable."
    note: "Comparing sources starts with citing them clearly (*laut einer Studie*) and judging their reliability (*zuverlässig*) -- the groundwork for the synthesis this unit builds toward."

  de.b2.unit08.lesson02.teach.uebereinstimmen:
    title: "to agree / coincide"
    gloss: "to agree / to coincide"
    example_gloss: "The sources agree."
  de.b2.unit08.lesson02.teach.beide_quellen:
    title: "Both sources agree that..."
    gloss: "Both sources agree that..."
    note: "*Beide Quellen stimmen überein, dass...* is the standard way to state where two sources agree -- the first move of a synthesis."
  de.b2.unit08.lesson02.teach.genauso_wie:
    title: "just like"
    gloss: "just like"
  de.b2.unit08.lesson02.teach.zeitersparnis:
    title: "the time savings"
    gloss: "the time savings"
    example_gloss: "The time savings are important."
  de.b2.unit08.lesson02.teach.erwaehnen:
    title: "to mention"
    gloss: "to mention"
    example_gloss: "Both sources mention the time savings."
  de.b2.unit08.lesson02.teach.grammar_uebereinstimmung:
    title: "Both sources agree that home office saves time. Both mention the time savings."
    gloss: "Both sources agree that home office saves time. Both mention the time savings."
    note: "Identifying agreement means finding the specific claim both sources make in common -- not just noting they're 'similar' in a vague way."

  de.b2.unit08.lesson03.teach.widersprechen:
    title: "to contradict"
    gloss: "to contradict"
    example_gloss: "This source contradicts the other."
  de.b2.unit08.lesson03.teach.im_gegensatz_dazu:
    title: "In contrast to that..."
    gloss: "In contrast to that... / By contrast..."
    note: "*Im Gegensatz dazu* needs the dummy pronoun *dazu* ('to that'), which English drops -- German cannot say 'im Gegensatz' alone here."
  de.b2.unit08.lesson03.teach.kritisieren:
    title: "to criticize"
    gloss: "to criticize"
    example_gloss: "The second source criticizes home office."
  de.b2.unit08.lesson03.teach.loben:
    title: "to praise"
    gloss: "to praise"
    example_gloss: "The first source praises home office."
  de.b2.unit08.lesson03.teach.wohingegen:
    title: whereas
    gloss: whereas
    note: "*Wohingegen* sends the verb of its own clause to the end (like *weil*, *dass*, *obwohl*) -- unlike English 'whereas', which does not change word order."
    example_gloss: "One source praises home office, whereas the other criticizes it."
  de.b2.unit08.lesson03.teach.grammar_widerspruch:
    title: "In contrast to that, the second source criticizes home office. One source praises it, whereas the other criticizes it."
    gloss: "In contrast to that, the second source criticizes home office. One source praises it, whereas the other criticizes it."
    note: "Identifying conflict means naming the specific point where sources disagree, and which side each source takes on it."

  de.b2.unit08.lesson04.teach.glaubwuerdig:
    title: credible
    gloss: credible
    example_gloss: "This source is more credible."
  de.b2.unit08.lesson04.teach.ueberzeugender:
    title: "more convincing"
    gloss: "more convincing"
    example_gloss: "The first source is more convincing."
  de.b2.unit08.lesson04.teach.besser_belegt:
    title: "better supported / evidenced"
    gloss: "better supported / better evidenced"
  de.b2.unit08.lesson04.teach.beweisen:
    title: "to prove"
    gloss: "to prove"
    example_gloss: "This study proves little."
  de.b2.unit08.lesson04.teach.claim_model:
    title: "In my opinion, the first source is more convincing, because it is better supported."
    gloss: "In my opinion, the first source is more convincing, because it is better supported."
    note: "Here *sie* (lowercase, 'it') refers back to *die Quelle* (a feminine noun) -- not the formal 'you': mid-sentence, the formal 'you' is always written capitalized *Sie*, while lowercase *sie* means she/it/they."
  de.b2.unit08.lesson04.teach.grammar_bewerten:
    title: "This source is more credible and better supported. It proves more."
    gloss: "This source is more credible and better supported. It proves more."
    note: "Evaluating a source means judging its credibility and evidence, not just repeating its claim -- the third move of a synthesis, after identifying agreement and conflict."

  de.b2.unit08.lesson05.teach.quelle_a:
    title: "Reading: Quelle A"
    gloss: "According to a first study, people in home office work more productively, because they are less distracted. This study surveyed a thousand people and is well supported."
    glosses:
      weniger: less
      abgelenkt: distracted
      werden: "become / are (passive auxiliary)"
      befragte: surveyed
      tausend: "one thousand"
      Personen: people
  de.b2.unit08.lesson05.teach.quelle_b:
    title: "Reading: Quelle B"
    gloss: "A second study contradicts that: in contrast, it shows that the teamwork gets worse. This study, however, surveyed only fifty people."
    glosses:
      dem: "that (dative, widerspricht dem = contradicts that)"
      sich: "itself (reflexive, verschlechtert sich = gets worse)"
      Zusammenarbeit: "collaboration / teamwork"
      Team: team
      verschlechtert: "gets worse"
      nur: only
      fünfzig: fifty

  de.b2.unit08.lesson06.teach.worin_unterscheiden:
    title: "In what do they differ?"
    gloss: "In what do they differ? / How do they differ?"
    note: "*Worin unterscheiden sie sich?* asks specifically where two things differ -- the natural follow-up question once agreement has been established."
  de.b2.unit08.lesson06.teach.thema:
    title: topic
    gloss: topic
    example_gloss: "I read a study on the topic of home office."
  de.b2.unit08.lesson06.teach.dialogue_felix_intro:
    title: "Felix: I read two studies on the topic of home office. Both sources agree that you save time."
    gloss: "Felix: I read two studies on the topic of home office. Both sources agree that you save time."
  de.b2.unit08.lesson06.teach.dialogue_vogel_ask:
    title: "Frau Vogel: And in what do they differ?"
    gloss: "Frau Vogel: And in what do they differ?"
  de.b2.unit08.lesson06.teach.dialogue_felix_compare:
    title: "Felix: The first study shows that you are more productive. In contrast, the second shows that the teamwork gets worse."
    gloss: "Felix: The first study shows that you are more productive. In contrast, the second shows that the teamwork gets worse."
  de.b2.unit08.lesson06.teach.dialogue_vogel_which:
    title: "Frau Vogel: Which source is more convincing?"
    gloss: "Frau Vogel: Which source is more convincing?"
  de.b2.unit08.lesson06.teach.dialogue_felix_judge:
    title: "Felix: In my opinion the first, because it is better supported: it surveyed a thousand people, the second only fifty."
    gloss: "Felix: In my opinion the first, because it is better supported: it surveyed a thousand people, the second only fifty."
  de.b2.unit08.lesson06.teach.grammar_synthese:
    title: "Both sources agree that... In contrast to that... In my opinion the first is more convincing, because it is better supported."
    gloss: "Both sources agree that... In contrast to that... In my opinion the first is more convincing, because it is better supported."
    note: "A complete synthesis has three moves, all present in this dialogue: state the agreement, state the conflict, and give a reasoned judgement backed by a reason (here, sample size) -- exactly what this outcome's speaking and writing tasks ask you to produce."

exercises:
  de.b2.unit08.lesson01.exercise01.recognize_quelle:
    instruction: "What does this word mean?"
    correct_option: source
    distractors: [study, opinion, result]
    accepted_answers: [{value: source, status: correct}]
    feedback: "Die Quelle means source."
  de.b2.unit08.lesson01.exercise02.listen_laut_studie:
    instruction: "Listen and select what you hear."
    correct_option: "According to a study, home office is more productive."
    distractors: ["According to a study, home office is less productive.", "According to two studies, home office is more productive.", "According to a study, the office is more productive."]
    accepted_answers: [{value: "According to a study, home office is more productive.", status: correct}]
    feedback: "Laut einer Studie ist Homeoffice produktiver means according to a study, home office is more productive."
  de.b2.unit08.lesson01.exercise03.match_quelle_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {"die Quelle": source, laut: "according to", "eine Studie": "a study", vergleichen: "to compare", zuverlässig: reliable, produktiver: "more productive"}
        status: correct
    feedback: "These are this lesson's source-comparison words."
  de.b2.unit08.lesson01.exercise04.order_laut_studie:
    instruction: "Put the words in order: According to a study, home office is more productive."
    accepted_answers:
      - {value: "Laut einer Studie ist Homeoffice produktiver", status: correct}
      - {value: "Homeoffice ist laut einer Studie produktiver", status: correct}
    feedback: "Laut einer Studie ist Homeoffice produktiver means according to a study, home office is more productive."
  de.b2.unit08.lesson01.exercise05.translate_laut_studie:
    instruction: "Translate into German, using laut: According to a study, home office is more productive."
    accepted_answers:
      - {value: "Laut einer Studie ist Homeoffice produktiver", status: correct}
      - {value: "Homeoffice ist laut einer Studie produktiver", status: correct}
    feedback: "Laut einer Studie ist Homeoffice produktiver means according to a study, home office is more productive."
  de.b2.unit08.lesson01.exercise06.translate_zuverlaessig:
    instruction: "Translate into German: This source is reliable."
    accepted_answers:
      - {value: "Diese Quelle ist zuverlässig", status: correct}
      - {value: "Diese Quelle ist zuverlaessig", status: correct}
    feedback: "Diese Quelle ist zuverlässig means this source is reliable."
  de.b2.unit08.lesson01.exercise07.speak_laut_studie:
    instruction: "Say aloud in German, using laut: According to a study, home office is more productive."
    accepted_answers:
      - {value: "Laut einer Studie ist Homeoffice produktiver", status: correct}
      - {value: "Homeoffice ist laut einer Studie produktiver", status: correct}
    feedback: "Laut einer Studie ist Homeoffice produktiver means according to a study, home office is more productive."
  de.b2.unit08.lesson01.exercise08.dictation_laut_studie:
    instruction: "Type what you hear."
    correct_response: "Laut einer Studie ist Homeoffice produktiver"
    orthography_strict: true
    feedback: "You heard Laut einer Studie ist Homeoffice produktiver — according to a study, home office is more productive."

  de.b2.unit08.lesson02.exercise01.recognize_uebereinstimmen:
    instruction: "What does this word mean?"
    correct_option: "to agree / coincide"
    distractors: [to contradict, to compare, to prove]
    accepted_answers: [{value: "to agree / coincide", status: correct}]
    feedback: "Übereinstimmen means to agree or coincide."
  de.b2.unit08.lesson02.exercise02.listen_uebereinstimmen:
    instruction: "Listen and select what you hear."
    correct_option: "Both sources agree that home office saves time."
    distractors: ["Both sources disagree about home office.", "Both sources agree that home office costs time.", "One source agrees that home office saves time."]
    accepted_answers: [{value: "Both sources agree that home office saves time.", status: correct}]
    feedback: "Beide Quellen stimmen überein, dass Homeoffice Zeit spart means both sources agree that home office saves time."
  de.b2.unit08.lesson02.exercise03.match_uebereinstimmung_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {übereinstimmen: "to agree / coincide", "Beide Quellen stimmen überein, dass...": "Both sources agree that...", "genauso wie": "just like", "die Zeitersparnis": "the time savings", erwähnen: "to mention", "die Quelle": source, vergleichen: "to compare"}
        status: correct
    feedback: "These are this lesson's agreement-identifying words, pooled with Unit 8 lesson01's source vocabulary."
  de.b2.unit08.lesson02.exercise04.order_uebereinstimmen:
    instruction: "Put the words in order: Both sources agree that home office saves time."
    accepted_answers:
      - {value: "Beide Quellen stimmen überein dass Homeoffice Zeit spart", status: correct}
    feedback: "Beide Quellen stimmen überein, dass Homeoffice Zeit spart means both sources agree that home office saves time."
  de.b2.unit08.lesson02.exercise05.translate_uebereinstimmen:
    instruction: "Translate into German: Both sources agree that home office saves time."
    accepted_answers:
      - {value: "Beide Quellen stimmen überein, dass Homeoffice Zeit spart", status: correct}
      - {value: "Beide Quellen stimmen ueberein, dass Homeoffice Zeit spart", status: correct}
    feedback: "Beide Quellen stimmen überein, dass Homeoffice Zeit spart means both sources agree that home office saves time."
  de.b2.unit08.lesson02.exercise06.translate_erwaehnen:
    instruction: "Translate into German: Both sources mention the time savings."
    accepted_answers:
      - {value: "Beide Quellen erwähnen die Zeitersparnis", status: correct}
      - {value: "Beide Quellen erwaehnen die Zeitersparnis", status: correct}
    feedback: "Beide Quellen erwähnen die Zeitersparnis means both sources mention the time savings."
  de.b2.unit08.lesson02.exercise07.write_genauso_wie:
    instruction: "Write in German, using genauso wie: Just like the first source, the second also mentions the time savings."
    accepted_answers:
      - {value: "Genauso wie die erste Quelle erwähnt auch die zweite die Zeitersparnis", status: correct}
      - {value: "Genauso wie die erste Quelle erwaehnt auch die zweite die Zeitersparnis", status: correct}
    feedback: "Genauso wie die erste Quelle erwähnt auch die zweite die Zeitersparnis means just like the first source, the second also mentions the time savings."

  de.b2.unit08.lesson03.exercise01.recognize_widersprechen:
    instruction: "What does this word mean?"
    correct_option: "to contradict"
    distractors: [to agree, to compare, to mention]
    accepted_answers: [{value: "to contradict", status: correct}]
    feedback: "Widersprechen means to contradict."
  de.b2.unit08.lesson03.exercise02.listen_gegensatz:
    instruction: "Listen and select what you hear."
    correct_option: "In contrast to that, the second source criticizes home office."
    distractors: ["In contrast to that, the second source praises home office.", "In agreement with that, the second source criticizes home office.", "In contrast to that, the first source criticizes home office."]
    accepted_answers: [{value: "In contrast to that, the second source criticizes home office.", status: correct}]
    feedback: "Im Gegensatz dazu kritisiert die zweite Quelle das Homeoffice means in contrast to that, the second source criticizes home office."
  de.b2.unit08.lesson03.exercise03.match_widerspruch_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {widersprechen: "to contradict", "Im Gegensatz dazu...": "In contrast to that...", kritisieren: "to criticize", loben: "to praise", wohingegen: whereas, übereinstimmen: "to agree / coincide", "genauso wie": "just like"}
        status: correct
    feedback: "These are this lesson's conflict-identifying words, pooled with Unit 8 lesson02's agreement vocabulary for contrast."
  de.b2.unit08.lesson03.exercise04.order_gegensatz:
    instruction: "Put the words in order: In contrast to that, the second source criticizes home office."
    accepted_answers:
      - {value: "Im Gegensatz dazu kritisiert die zweite Quelle das Homeoffice", status: correct}
    feedback: "Im Gegensatz dazu kritisiert die zweite Quelle das Homeoffice means in contrast to that, the second source criticizes home office."
  de.b2.unit08.lesson03.exercise05.translate_gegensatz:
    instruction: "Translate into German, using Im Gegensatz dazu: In contrast to that, the second source criticizes home office."
    accepted_answers:
      - {value: "Im Gegensatz dazu kritisiert die zweite Quelle das Homeoffice", status: correct}
      - {value: "Im Gegensatz dazu kritisiert die zweite Quelle Homeoffice", status: correct}
    feedback: "Im Gegensatz dazu kritisiert die zweite Quelle das Homeoffice means in contrast to that, the second source criticizes home office."
  de.b2.unit08.lesson03.exercise06.translate_wohingegen:
    instruction: "Translate into German, using wohingegen: One source praises home office, whereas the other criticizes it."
    accepted_answers:
      - {value: "Eine Quelle lobt Homeoffice, wohingegen die andere es kritisiert", status: correct}
