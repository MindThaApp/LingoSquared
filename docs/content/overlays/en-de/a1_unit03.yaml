    accepted_answers: [{value: ["Ich", "bin", "achtundzwanzig", "Jahre", "alt"], status: "correct"}]
    feedback: "Anna says *Ich bin achtundzwanzig Jahre alt.*"
  de.a1.unit03.lesson05.exercise06.reply_as_anna:
    instruction: "Felix asks: How old are you, if I may ask? Reply as Anna: give your age, then ask him back."
    accepted_answers:
