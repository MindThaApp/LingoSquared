    correct_option: "zwanzig"
    distractors: ["zwölf", "dreizehn", "neunzehn"]
    accepted_answers: [{value: "zwanzig", status: "correct"}]
    feedback: "*zwanzig* means 20."
  de.a1.unit03.lesson02.exercise04.match_teens:
    instruction: "Match each German number word to its digit."
    accepted_answers:
      - value:
          - {left: "elf", right: "11"}
