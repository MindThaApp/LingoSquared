course:
  title: "German A1"
  description: "Learn A1-level German for everyday greetings and short social exchanges, with detailed English explanations."

units:
  de.a1.unit03.zahlen: {title: "Numbers"}

lessons:
  de.a1.unit03.lesson01.null_bis_zehn: {title: "Zero to ten"}
  de.a1.unit03.lesson02.elf_bis_zwanzig: {title: "Eleven to twenty"}
  de.a1.unit03.lesson03.die_zehnerzahlen: {title: "The tens"}
  de.a1.unit03.lesson04.wie_alt_sind_sie: {title: "How old are you?"}
  de.a1.unit03.lesson05.im_gespraech_ueber_das_alter: {title: "Talking about age"}

teaching:
  de.a1.unit03.lesson01.teach.null_bis_vier: {title: "null, eins, zwei, drei, vier", gloss: "zero, one, two, three, four", note: "The German digits 0-4.", example_gloss: ["I have zero apples.", "I am number one!", "I have two apples.", "I have three apples.", "I have four apples."]}
  de.a1.unit03.lesson01.teach.fuenf_bis_zehn: {title: "fünf, sechs, sieben, acht, neun, zehn", gloss: "five, six, seven, eight, nine, ten", note: "The German digits 5-10.", example_gloss: ["I have five apples.", "I have six apples.", "I have seven apples.", "I have eight apples.", "I have nine apples.", "I have ten apples."]}

  de.a1.unit03.lesson02.teach.elf_zwoelf: {title: "elf, zwölf", gloss: "eleven, twelve", note: "*elf* and *zwölf* are irregular, like English 'eleven'/'twelve' -- they don't follow the teen pattern used from 13 onward.", example_gloss: ["I live at house number eleven.", "I live at house number twelve."]}
  de.a1.unit03.lesson02.teach.dreizehn_bis_sechzehn: {title: "dreizehn, vierzehn, fünfzehn, sechzehn", gloss: "thirteen, fourteen, fifteen, sixteen", note: "From 13 onward, German numbers are built from the base digit + *-zehn* (like English *-teen*). Note *sechzehn*, not *sechszehn* -- the *s* is dropped.", example_gloss: ["I live at house number thirteen.", "I live at house number fourteen.", "I live at house number fifteen.", "I live at house number sixteen."]}
  de.a1.unit03.lesson02.teach.siebzehn_bis_zwanzig: {title: "siebzehn, achtzehn, neunzehn, zwanzig", gloss: "seventeen, eighteen, nineteen, twenty", note: "Note *siebzehn*, not *siebenzehn* -- the *-en* of *sieben* is dropped before *-zehn*.", example_gloss: ["I live at house number seventeen.", "I live at house number eighteen.", "I live at house number nineteen.", "I live at house number twenty."]}

  de.a1.unit03.lesson03.teach.dreissig_bis_fuenfzig: {title: "dreißig, vierzig, fünfzig", gloss: "thirty, forty, fifty", note: "Note *dreißig*, not *dreizig* -- 30 is the one irregular multiple of ten (built from *drei* + *-ßig*, not *-zig*).", example_gloss: ["That costs thirty euros.", "That costs forty euros.", "That costs fifty euros."]}
  de.a1.unit03.lesson03.teach.sechzig_bis_neunzig: {title: "sechzig, siebzig, achtzig, neunzig", gloss: "sixty, seventy, eighty, ninety", note: "From 40 onward, the pattern is regular: digit + *-zig* (with the same *sech-*/*sieb-* shortenings as the teens).", example_gloss: ["That costs sixty euros.", "That costs seventy euros.", "That costs eighty euros.", "That costs ninety euros."]}
  de.a1.unit03.lesson03.teach.hundert: {title: "hundert", gloss: "one hundred", note: "*hundert* on its own means 'one hundred' -- German doesn't need a word for 'one' before it, unlike English.", example_gloss: "That costs one hundred euros."}
  de.a1.unit03.lesson03.teach.einundzwanzig: {title: "einundzwanzig", gloss: "twenty-one", note: "German compound numbers 21-99 reverse the English order: ones-digit + *und* ('and') + tens-digit, all as ONE word. *einundzwanzig* = *ein* (one) + *und* (and) + *zwanzig* (twenty) = literally 'one-and-twenty.'"}
  de.a1.unit03.lesson03.teach.zweiunddreissig: {title: "zweiunddreißig", gloss: "thirty-two", note: "Same pattern: *zwei* (two) + *und* + *dreißig* (thirty) = 'two-and-thirty' = 32."}

  de.a1.unit03.lesson04.teach.wie_alt_sind_sie: {title: "Wie alt sind Sie?", gloss: "How old are you? (formal)", note: "*alt* means 'old' -- literally 'how old are you.'"}
  de.a1.unit03.lesson04.teach.wie_alt_bist_du: {title: "Wie alt bist du?", gloss: "How old are you? (informal)", note: "The informal version, using *du*."}
  de.a1.unit03.lesson04.teach.ich_bin_jahre_alt: {title: "Ich bin achtundzwanzig Jahre alt.", gloss: "I am twenty-eight years old.", note: "*Jahre alt* (years old) always follows the number -- German states age with 'I am [number] years old,' the same structure as English."}

  de.a1.unit03.lesson05.teach.line01: {title: "Felix asks Anna's age", gloss: "Felix says: How old are you, if I may ask?", note: "*wenn ich fragen darf* ('if I may ask') softens a question that could otherwise feel a bit direct -- a polite touch appropriate for their continued formal *Sie* register."}
  de.a1.unit03.lesson05.teach.line02: {title: "Anna answers and asks back", gloss: "Anna says: I am twenty-eight years old. And you?", note: "Anna gives her age and returns the question, continuing the pattern from unit02."}
  de.a1.unit03.lesson05.teach.line03: {title: "Felix answers", gloss: "Felix says: I am thirty-one years old.", note: "This confirms Felix is three years older than Anna."}

exercises:
  de.a1.unit03.lesson01.exercise01.listen_zwei:
    instruction: "Listen and select the number you hear."
    correct_option: "zwei"
    distractors: ["eins", "drei", "vier"]
    accepted_answers: [{value: "zwei", status: "correct"}]
    feedback: "*zwei* means 2."
  de.a1.unit03.lesson01.exercise02.choose_acht:
    instruction: "Which word means 8?"
    correct_option: "acht"
    distractors: ["sieben", "neun", "sechs"]
    accepted_answers: [{value: "acht", status: "correct"}]
    feedback: "*acht* means 8."
  de.a1.unit03.lesson01.exercise03.listen_sieben:
    instruction: "Listen and select the number you hear."
    correct_option: "sieben"
    distractors: ["sechs", "acht", "neun"]
    accepted_answers: [{value: "sieben", status: "correct"}]
    feedback: "*sieben* means 7."
  de.a1.unit03.lesson01.exercise04.match_digits:
    instruction: "Match each German number word to its digit."
    accepted_answers:
      - value:
          - {left: "null", right: "0"}
          - {left: "eins", right: "1"}
          - {left: "zwei", right: "2"}
          - {left: "drei", right: "3"}
          - {left: "vier", right: "4"}
          - {left: "fünf", right: "5"}
          - {left: "sechs", right: "6"}
          - {left: "acht", right: "8"}
        status: "correct"
    feedback: "null=0, eins=1, zwei=2, drei=3, vier=4, fünf=5, sechs=6, acht=8."
  de.a1.unit03.lesson01.exercise05.write_zehn:
    instruction: "Write the German word for 10."
    accepted_answers:
      - {value: "zehn", status: "correct"}
      - {value: "zehn.", status: "correct"}
    feedback: "*zehn* means 10."
  de.a1.unit03.lesson01.exercise06.speak_neun:
    instruction: "Say the German word for 9 out loud."
    accepted_answers:
      - {value: "neun", status: "correct"}
      - {value: "neun.", status: "correct"}
