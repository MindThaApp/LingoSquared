  de.a1.unit03.lesson04.exercise01.listen_formal_question:
    instruction: "Listen and select the question you hear."
    correct_option: "Wie alt sind Sie"
    distractors: ["Wie alt bist du", "Wie heißen Sie", "Woher kommen Sie"]
    accepted_answers: [{value: "Wie alt sind Sie", status: "correct"}]
    feedback: "*Wie alt sind Sie?* asks someone's age, formally."
  de.a1.unit03.lesson04.exercise02.choose_informal_question:
