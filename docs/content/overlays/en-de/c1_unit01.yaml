review:
  status: reviewed
  required_next_reviewer: native_speaker_pass
  notes: >-
    Overlay for German's first C1 unit, authored alongside the realization
    (no adaptable public-domain German C1 source exists; see the realization
    provenance note). English speakers' real interference risks for this
    outcome: (1) "zum einen ... zum anderen" and "einerseits ...
    andererseits" both render "on the one hand ... on the other hand" but
    differ in register and collocation -- this unit teaches only "zum einen
    ... zum anderen" and keeps the gloss distinct; (2) "das heisst" vs
    "konkret" both gloss toward "that is / specifically" but differ in
    function (restatement vs specification) -- kept distinct in lesson02;
    (3) "entfaellt" (a C1 verb meaning "is omitted / drops away") has no
    one-word English equivalent, so it is glossed by effect rather than a
    single word; (4) English lets a speaker drift without signposting,
    whereas the taught signposts (Lassen Sie mich zunaechst, zum einen ...
    zum anderen, ich mache einen kleinen Exkurs, um auf meine Hauptthese
    zurueckzukommen, alles in allem) must actually appear -- the culminating
    lesson06 prompts name the required moves so a correct answer is
    well-determined. No sibling-direction file (de-en) was consulted.

    Fresh-context review 2026-10-11 (content-reviewer.md checklist): fix
    applied: mirrored the realization's colon capitalization ('machen: Unser
    Büro ...', 'Exkurs: Einige Kollegen ...') in the accepted_answers and
    feedback of lesson01.exercise07, lesson03.exercise02/07 and
    lesson06.exercise05/06 (ASCII-umlaut variants included). Glosses,
    instructions and feedback otherwise verified. NATIVE FLAGS: see
    realization notes (uninverted clause after 'um auf meine Hauptthese
    zurückzukommen'; 'Ich mache einen kleinen Exkurs' idiomaticity).
    DEFERRED: none.

course:
  title: German C1
  description: >-
    Advanced German discourse: structure an extended spoken or written
    contribution -- signpost its direction, develop linked points with a
    controlled digression and explicit return, and sustain cohesion so the
    listener or reader can follow the overall shape.

units:
  de.c1.unit01.strukturierung:
    title: "Structuring an extended contribution"
    description: "Signpost a long contribution, develop linked points, bound a digression, return explicitly, and sustain cohesion through a synthesis."

lessons:
  de.c1.unit01.lesson01.die_richtung_ankuendigen:
    title: "Announce the direction"
  de.c1.unit01.lesson02.die_punkte_entwickeln:
    title: "Develop the points"
  de.c1.unit01.lesson03.einen_exkurs_machen:
    title: "Make a bounded digression"
  de.c1.unit01.lesson04.zurueckkommen:
    title: "Return explicitly to the main line"
  de.c1.unit01.lesson05.die_kohaesion_halten:
    title: "Sustain reference and synthesize"
  de.c1.unit01.lesson06.der_vollstaendige_beitrag:
    title: "The complete contribution"

teaching:
  de.c1.unit01.lesson01.teach.lassen_sie_mich:
    title: "Let me first..."
    gloss: "let me first..."
    note: "*Lassen Sie mich zunächst...* is the formal (Sie) way to open a sustained contribution and promise an organized route rather than merely adding a point. It is the preview move every later stage is tied back to."
  de.c1.unit01.lesson01.teach.einen_vorschlag_machen:
    title: "to make a proposal"
    gloss: "to make a proposal"
    note: "*Einen Vorschlag machen* = to make a proposal. The whole unit is one coherent proposal -- making the office paperless -- so this phrase names the contribution's purpose."
  de.c1.unit01.lesson01.teach.unser_buero:
    title: "our office"
    gloss: "our office"
    note: "*Unser Büro* = our office -- the topic of the proposal, kept consistent throughout the unit."
    example_gloss: "Our office is modern."
  de.c1.unit01.lesson01.teach.soll_papierlos_werden:
    title: "should become paperless"
    gloss: "should become paperless"
    note: "*Soll ... werden* = 'should become'. It announces the goal of the proposal. *Papierlos* = paperless."
  de.c1.unit01.lesson01.teach.zuerst_dann:
    title: "First I present the proposal; then I explain the advantages."
    gloss: "first ... then ..."
    note: "*Zuerst ... dann ...* gives the listener a two-stage roadmap before the detail begins. Note the separable verb *vorstellen* splits into *stelle ... vor*."
  de.c1.unit01.lesson01.teach.im_grossen_und_ganzen:
    title: "in broad terms / on the whole"
    gloss: "in broad terms / on the whole"
    note: "*Im Großen und Ganzen* deliberately limits detail and tells the audience to listen for the overall shape, not the fine print."
  de.c1.unit01.lesson01.teach.richtung:
    title: "A complete roadmap"
    gloss: "Let me first make a proposal: our office should become paperless. First I present the proposal; then I explain the advantages."
    note: "This combines an opening boundary (*Lassen Sie mich zunächst*), the stated goal (*soll papierlos werden*), and a promised second stage (*Zuerst ... dann*)."

  de.c1.unit01.lesson02.teach.zum_einen_zum_anderen:
    title: "on the one hand ... on the other hand"
    gloss: "on the one hand ... on the other hand"
    note: "*Zum einen ... zum anderen ...* numbers the two linked points of the development and keeps each tied to the previewed route. It is the more neutral, discourse-friendly pairing for an argument."
  de.c1.unit01.lesson02.teach.konkret:
    title: "specifically"
    gloss: "specifically"
    note: "*Konkret* specifies the exact content of a general point -- here, what saving time actually consists of."
    example_gloss: "Specifically, the tedious searching drops away."
  de.c1.unit01.lesson02.teach.das_heisst:
    title: "that is to say"
    gloss: "that is to say / in other words"
    note: "*Das heißt* restates a general point more precisely, much like 'that is to say'."
    example_gloss: "That is, we save time."
  de.c1.unit01.lesson02.teach.darueber_hinaus:
    title: "in addition / beyond that"
    gloss: "in addition / beyond that"
    note: "*Darüber hinaus* presents the next point as attached to the preceding one, not a fresh start."
  de.c1.unit01.lesson02.teach.zeit_sparen:
    title: "to save time"
    gloss: "to save time"
    note: "*Zeit sparen* = to save time -- the first benefit of going paperless."
  de.c1.unit01.lesson02.teach.entfaellt:
    title: "drops away / is omitted"
    gloss: "drops away / is omitted"
    note: "*Entfällt* (from *entfallen*) means something is no longer needed -- here, the tedious searching. It has no single-word English equivalent, so read it by its effect: 'the searching disappears'."
    example_gloss: "The tedious searching drops away."
  de.c1.unit01.lesson02.teach.muehsames_suchen:
    title: "the tedious searching in file folders"
    gloss: "the tedious searching in file folders"
    note: "*Das mühsame Suchen in Aktenordnern* names the concrete annoyance a paperless office removes. *Mühsam* = tedious; *der Aktenordner* = file folder."
  de.c1.unit01.lesson02.teach.die_umwelt_schuetzen:
    title: "to protect the environment"
    gloss: "to protect the environment"
    note: "*Die Umwelt schützen* = to protect the environment -- the second, ecological benefit."
  de.c1.unit01.lesson02.teach.weil:
    title: "because"
    gloss: "because"
    note: "*Weil* gives a reason and sends its verb to the end of the clause: *weil wir weniger drucken*."
    example_gloss: "We save paper, because we print less."
  de.c1.unit01.lesson02.teach.weniger_drucken:
    title: "to print less"
    gloss: "to print less"
    note: "*Weniger drucken* = to print less -- the concrete way the office protects the environment."
  de.c1.unit01.lesson02.teach.punkte:
    title: "Developing two linked points"
    gloss: "On the one hand, we save time, specifically the tedious searching in file folders drops away. On the other hand, we protect the environment, because we print less."
    note: "The sequence moves from general claim (*sparen wir Zeit*) to specification (*konkret, entfällt ...*) and then to a second, parallel benefit (*zum anderen, schützen wir ...*)."

  de.c1.unit01.lesson03.teach.kleinen_exkurs:
    title: "I make a small digression."
    gloss: "I make a small digression."
    note: "*Ich mache einen kleinen Exkurs* explicitly marks a temporary, bounded departure from the main line -- the audience is told exactly when the side path begins."
  de.c1.unit01.lesson03.teach.einige_kollegen_fuerchten:
    title: "Some colleagues fear that..."
    gloss: "some colleagues fear that..."
    note: "*Einige Kollegen fürchten, dass...* introduces a common objection without owning it yourself, so you can then answer it. The *dass* sends the following verb to the end."
  de.c1.unit01.lesson03.teach.verstaendliche_sorge:
    title: "an understandable concern"
    gloss: "an understandable concern"
    note: "Calling it *eine verständliche Sorge* gives the digression genuine relevance instead of treating it as random detail -- the objection is fair, not dismissed."
  de.c1.unit01.lesson03.teach.unsicher:
    title: "unsafe / insecure"
    gloss: "unsafe / insecure"
    note: "*Unsicher* = unsafe or insecure -- the worry some colleagues raise about digital documents."
    example_gloss: "Digital documents are unsafe."
  de.c1.unit01.lesson03.teach.exkurs:
    title: "A bounded digression"
    gloss: "I make a small digression: some colleagues fear that digital documents are unsafe, an understandable concern."
    note: "The boundary marker (*ich mache einen kleinen Exkurs*) opens the side path, the objection (*einige Kollegen fürchten, dass*) gives it content, and the apposition (*eine verständliche Sorge*) validates why it matters."

  de.c1.unit01.lesson04.teach.um_auf_zurueckzukommen:
    title: "to return to my main thesis"
    gloss: "to return to my main thesis"
    note: "*Um auf meine Hauptthese zurückzukommen* names both the return and the precise line being resumed -- the explicit signal that the digression is over."
  de.c1.unit01.lesson04.teach.verschluesselte_daten:
    title: "encrypted data"
    gloss: "encrypted data"
    note: "*Verschlüsselte Daten* = encrypted data -- the concrete answer to the digression's security worry."
    example_gloss: "Encrypted data is safe."
  de.c1.unit01.lesson04.teach.nicht_weniger_sicher_als:
    title: "not less safe than paper"
    gloss: "not less safe than paper"
    note: "*Nicht weniger sicher als Papier* = 'not less safe than paper'. The *als* comparison keeps the main idea intact while conceding the concern."
  de.c1.unit01.lesson04.teach.rueckkehr:
    title: "An explicit return"
    gloss: "But to return to my main thesis, well-encrypted data is not less safe than paper."
    note: "*Aber* pivots, the return frame (*um auf meine Hauptthese zurückzukommen*) restores the route, and the encryption point reconnects the main idea to the objection."

  de.c1.unit01.lesson05.teach.dieser_vorschlag:
    title: "This proposal saves time."
    gloss: "this proposal"
    note: "*Dieser Vorschlag* packages the previously described proposal into one reusable reference, creating cohesion without mechanical repetition."
  de.c1.unit01.lesson05.teach.zusammenfassend:
    title: "in summary"
    gloss: "in summary"
    note: "*Zusammenfassend* signals that the contribution is drawing its strands together."
    example_gloss: "In summary, the office saves time."
  de.c1.unit01.lesson05.teach.alles_in_allem:
    title: "all in all"
    gloss: "all in all"
    note: "*Alles in allem* = all in all. It opens the conclusion and draws on all the developed strands, not only the last sentence."
  de.c1.unit01.lesson05.teach.zeitverlust:
    title: "the loss of time"
    gloss: "the loss of time"
    note: "*Der Zeitverlust* = the loss of time -- what a paperless office removes."
    example_gloss: "The loss of time is small."
  de.c1.unit01.lesson05.teach.nachhaltigkeit:
    title: "sustainability"
    gloss: "sustainability"
    note: "*Die Nachhaltigkeit* = sustainability -- the value a paperless office promotes."
    example_gloss: "More sustainability is good."
  de.c1.unit01.lesson05.teach.synthese:
    title: "A cohesive synthesis"
    gloss: "This proposal saves time. All in all, a paperless office means less time lost and more sustainability."
    note: "Repeated concepts are recast as *dieser Vorschlag* and *alles in allem*, and the conclusion (*weniger Zeitverlust und mehr Nachhaltigkeit*) ties the two benefits together."

  de.c1.unit01.lesson06.teach.frau_vogel_frage:
    title: "Frau Vogel: Why do you propose a paperless office?"
    gloss: "Frau Vogel: Why do you propose a paperless office?"
    note: "Frau Vogel uses formal Sie (*schlagen Sie*) to ask Felix to justify his proposal -- the cue that triggers his extended, structured contribution."
  de.c1.unit01.lesson06.teach.beitrag_vollstaendig:
    title: "The complete structured contribution"
    gloss: "A sustained contribution with roadmap, development, digression, explicit return, and synthesis."
    note: "Track the whole route: *Lassen Sie mich zunächst* → *zum einen ... zum anderen* → *ich mache einen kleinen Exkurs* → *um auf meine Hauptthese zurückzukommen* → *alles in allem*."

exercises:
  de.c1.unit01.lesson01.exercise01.recognize_lassen_sie_mich:
    instruction: "What discourse job does Lassen Sie mich zunächst perform?"
    correct_option: "It opens a contribution and previews its direction."
    distractors: ["It closes a contribution.", "It introduces a contradiction.", "It hides the direction."]
    accepted_answers: [{value: "It opens a contribution and previews its direction.", status: correct}]
    feedback: "Lassen Sie mich zunächst explicitly opens the contribution and promises an organized route."
  de.c1.unit01.lesson01.exercise02.listen_preview:
    instruction: "Listen and select what you hear."
    correct_option: "Let me first make a proposal."
    distractors: ["Let me first make a complaint.", "Let me first make a phone call.", "Let me then make a proposal."]
    accepted_answers: [{value: "Let me first make a proposal.", status: correct}]
    feedback: "Lassen Sie mich zunächst einen Vorschlag machen means let me first make a proposal."
  de.c1.unit01.lesson01.exercise03.match_richtung:
    instruction: "Match each German roadmap element to its English meaning."
    accepted_answers:
      - value: {"Lassen Sie mich zunächst": "let me first...", "einen Vorschlag machen": "to make a proposal", "Zuerst": "first", "dann": "then", "die Vorteile": "the advantages", "im Großen und Ganzen": "in broad terms / on the whole", "unser Büro": "our office", "papierlos": "paperless"}
        status: correct
    feedback: "These elements announce scope and direction."
  de.c1.unit01.lesson01.exercise04.order_preview:
    instruction: "Put the German words in order to open the contribution: Let me first make a proposal."
    accepted_answers:
      - {value: "Lassen Sie mich zunächst einen Vorschlag machen", status: correct}
    feedback: "Lassen Sie mich zunächst occupies the opening position and previews the route."
  de.c1.unit01.lesson01.exercise05.translate_zuerst_dann:
    instruction: "Translate into German, using Zuerst ... dann ...: First I present the proposal; then I explain the advantages."
    accepted_answers:
      - {value: "Zuerst stelle ich den Vorschlag vor; dann erkläre ich die Vorteile", status: correct}
      - {value: "Zuerst stelle ich den Vorschlag vor. Dann erkläre ich die Vorteile", status: correct}
      - {value: "Zuerst stelle ich den Vorschlag vor; dann erklaere ich die Vorteile", status: correct}
    feedback: "The roadmap uses Zuerst and dann: Zuerst stelle ich den Vorschlag vor; dann erkläre ich die Vorteile."
  de.c1.unit01.lesson01.exercise06.speak_richtung:
    instruction: "Say aloud in German, using Lassen Sie mich zunächst: Let me first make a proposal."
    accepted_answers:
      - {value: "Lassen Sie mich zunächst einen Vorschlag machen", status: correct}
    feedback: "Lassen Sie mich zunächst einen Vorschlag machen means let me first make a proposal."
  de.c1.unit01.lesson01.exercise07.write_richtung:
    instruction: "Write in German, using Lassen Sie mich zunächst and soll papierlos werden: Let me first make a proposal: our office should become paperless."
    accepted_answers:
      - {value: "Lassen Sie mich zunächst einen Vorschlag machen: Unser Büro soll papierlos werden", status: correct}
      - {value: "Lassen Sie mich zunächst einen Vorschlag machen: Unser Büro soll papierlos werden.", status: correct}
      - {value: "Lassen Sie mich zunaechst einen Vorschlag machen: Unser Buero soll papierlos werden", status: correct}
    feedback: "Both named forms make the opening move explicit: Lassen Sie mich zunächst einen Vorschlag machen: Unser Büro soll papierlos werden."

  de.c1.unit01.lesson02.exercise01.recognize_konkret:
    instruction: "What does konkret do here?"
    correct_option: "It specifies the general point."
    distractors: ["It begins a digression.", "It withdraws the claim.", "It closes the argument."]
    accepted_answers: [{value: "It specifies the general point.", status: correct}]
    feedback: "Konkret introduces the precise content of a general claim."
  de.c1.unit01.lesson02.exercise02.listen_punkt:
    instruction: "Listen and select what you hear."
    correct_option: "On the one hand, we save time, specifically the tedious searching in file folders drops away."
    distractors: ["On the one hand, we save money, specifically the tedious printing drops away.", "On the other hand, we save time, specifically the tedious searching in file folders drops away.", "On the one hand, we waste time, specifically the tedious searching in file folders stays."]
    accepted_answers: [{value: "On the one hand, we save time, specifically the tedious searching in file folders drops away.", status: correct}]
    feedback: "Zum einen sparen wir Zeit, konkret entfällt das mühsame Suchen in Aktenordnern means on the one hand, we save time, specifically the tedious searching in file folders drops away."
  de.c1.unit01.lesson02.exercise03.match_punkte:
    instruction: "Match each German development element to its English meaning."
    accepted_answers:
      - value: {"Zum einen": "on the one hand", "Zum anderen": "on the other hand", "konkret": "specifically", "das heißt": "that is to say", "darüber hinaus": "in addition / beyond that", "Zeit sparen": "to save time", "entfällt": "drops away / is omitted", "die Umwelt schützen": "to protect the environment"}
        status: correct
    feedback: "These forms move, specify, and connect the developed points."
  de.c1.unit01.lesson02.exercise04.order_punkt:
    instruction: "Put the German words in order to state the first developed point."
    accepted_answers:
      - {value: "Zum einen sparen wir Zeit", status: correct}
    feedback: "Zum einen advances the route into the first point."
  de.c1.unit01.lesson02.exercise05.translate_zeit:
    instruction: "Translate into German, using Zum einen: On the one hand, we save time."
    accepted_answers:
      - {value: "Zum einen sparen wir Zeit", status: correct}
    feedback: "Zum einen sparen wir Zeit means on the one hand, we save time."
  de.c1.unit01.lesson02.exercise06.translate_umwelt:
    instruction: "Translate into German, using weil: On the other hand, we protect the environment, because we print less."
    accepted_answers:
      - {value: "Zum anderen schützen wir die Umwelt, weil wir weniger drucken", status: correct}
      - {value: "Zum anderen schützen wir die Umwelt weil wir weniger drucken", status: correct}
      - {value: "Zum anderen schuetzen wir die Umwelt, weil wir weniger drucken", status: correct}
    feedback: "Zum anderen schützen wir die Umwelt, weil wir weniger drucken means on the other hand, we protect the environment, because we print less."
  de.c1.unit01.lesson02.exercise07.write_zwei_punkte:
    instruction: "Write these two sentences in German, using zum einen ... zum anderen, konkret and weil: On the one hand, we save time, specifically the tedious searching in file folders drops away. On the other hand, we protect the environment, because we print less."
    accepted_answers:
      - {value: "Zum einen sparen wir Zeit, konkret entfällt das mühsame Suchen in Aktenordnern. Zum anderen schützen wir die Umwelt, weil wir weniger drucken", status: correct}
      - {value: "Zum einen sparen wir Zeit, konkret entfällt das mühsame Suchen in Aktenordnern. Zum anderen schützen wir die Umwelt, weil wir weniger drucken.", status: correct}
      - {value: "Zum einen sparen wir Zeit, konkret entfaellt das muehsame Suchen in Aktenordnern. Zum anderen schuetzen wir die Umwelt, weil wir weniger drucken", status: correct}
    feedback: "Two signposted points: Zum einen sparen wir Zeit, konkret entfällt das mühsame Suchen in Aktenordnern. Zum anderen schützen wir die Umwelt, weil wir weniger drucken."

  de.c1.unit01.lesson03.exercise01.recognize_exkurs:
    instruction: "What boundary does this sentence mark?"
    correct_option: "The start of a brief, bounded digression"
    distractors: ["The final conclusion", "The return to the main line", "The initial roadmap"]
    accepted_answers: [{value: "The start of a brief, bounded digression", status: correct}]
    feedback: "Ich mache einen kleinen Exkurs marks a temporary, bounded departure from the main line."
  de.c1.unit01.lesson03.exercise02.listen_exkurs:
    instruction: "Listen and select what you hear."
    correct_option: "I make a small digression: some colleagues fear that digital documents are unsafe."
    distractors: ["I make a small digression: some colleagues fear that paper documents are unsafe.", "I make a small conclusion: some colleagues fear that digital documents are unsafe.", "I make a small digression: no colleagues fear that digital documents are unsafe."]
    accepted_answers: [{value: "I make a small digression: some colleagues fear that digital documents are unsafe.", status: correct}]
    feedback: "Ich mache einen kleinen Exkurs: Einige Kollegen fürchten, dass digitale Dokumente unsicher sind means I make a small digression: some colleagues fear that digital documents are unsafe."
  de.c1.unit01.lesson03.exercise03.match_exkurs:
    instruction: "Match each German digression element to its English meaning."
    accepted_answers:
      - value: {"ein kleiner Exkurs": "a brief, bounded digression", "einige Kollegen fürchten": "some colleagues fear", "dass...": "that... (subordinating)", "eine verständliche Sorge": "an understandable concern", "unsicher": "unsafe / insecure", "digitale Dokumente": "digital documents"}
        status: correct
    feedback: "The boundary language and objection vocabulary keep the side path controlled."
  de.c1.unit01.lesson03.exercise04.order_exkurs:
    instruction: "Put the German words in order to mark the start of a digression."
    accepted_answers:
      - {value: "Ich mache einen kleinen Exkurs", status: correct}
    feedback: "Ich mache einen kleinen Exkurs announces the departure."
  de.c1.unit01.lesson03.exercise05.translate_sorge:
    instruction: "Translate into German: Some colleagues fear that digital documents are unsafe."
    accepted_answers:
      - {value: "Einige Kollegen fürchten, dass digitale Dokumente unsicher sind", status: correct}
      - {value: "Einige Kollegen fürchten dass digitale Dokumente unsicher sind", status: correct}
      - {value: "Einige Kollegen fuerchten, dass digitale Dokumente unsicher sind", status: correct}
    feedback: "Einige Kollegen fürchten, dass digitale Dokumente unsicher sind means some colleagues fear that digital documents are unsafe."
  de.c1.unit01.lesson03.exercise06.speak_exkurs:
    instruction: "Say aloud in German, using Ich mache einen kleinen Exkurs: I make a small digression."
    accepted_answers:
      - {value: "Ich mache einen kleinen Exkurs", status: correct}
    feedback: "Ich mache einen kleinen Exkurs explicitly limits the digression."
  de.c1.unit01.lesson03.exercise07.write_exkurs:
    instruction: "Write in German, using Ich mache einen kleinen Exkurs and Einige Kollegen fürchten, dass: I make a small digression: some colleagues fear that digital documents are unsafe."
    accepted_answers:
      - {value: "Ich mache einen kleinen Exkurs: Einige Kollegen fürchten, dass digitale Dokumente unsicher sind", status: correct}
      - {value: "Ich mache einen kleinen Exkurs: Einige Kollegen fürchten, dass digitale Dokumente unsicher sind.", status: correct}
      - {value: "Ich mache einen kleinen Exkurs: Einige Kollegen fuerchten, dass digitale Dokumente unsicher sind", status: correct}
    feedback: "The aside is announced before its specific content: Ich mache einen kleinen Exkurs: Einige Kollegen fürchten, dass digitale Dokumente unsicher sind."

  de.c1.unit01.lesson04.exercise01.recognize_zurueckzukommen:
    instruction: "What does this phrase signal?"
    correct_option: "An explicit return to the central line"
    distractors: ["A new unrelated theme", "A final farewell", "An uncertain inference"]
    accepted_answers: [{value: "An explicit return to the central line", status: correct}]
    feedback: "Um auf meine Hauptthese zurückzukommen names the line being resumed."
  de.c1.unit01.lesson04.exercise02.recognize_verschluesselt:
    instruction: "What is the function of verschlüsselte Daten here?"
    correct_option: "It answers the security worry raised in the digression."
    distractors: ["It opens a new digression.", "It ends the contribution.", "It repeats the roadmap."]
