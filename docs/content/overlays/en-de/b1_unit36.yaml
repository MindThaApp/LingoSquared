teaching:
  de.b1.unit36.lesson01.teach.ich_muss_sagen: {title: "Ich muss sagen, dass das Formular fehlt.", gloss: "I must say that the form is missing.", note: "Use *muss sagen, dass...* for present necessity, then add the embedded dass-clause (verb-final).", example_gloss: "I must say that the form is missing."}
  de.b1.unit36.lesson01.teach.muessen_sie: {title: "Müssen Sie das Formular heute abgeben?", gloss: "Must you submit the form today?", note: "*Müssen Sie* is the formal question form for present necessity.", example_gloss: "Must you submit the form today?"}
  de.b1.unit36.lesson02.teach.duerfen_nicht: {title: "Sie dürfen das Formular nicht ohne Unterschrift abgeben.", gloss: "You must not submit the form without a signature.", note: "Prohibition uses *dürfen* negated with *nicht* -- *nicht müssen* would instead mean \"don't have to\", not \"must not\".", example_gloss: "You must not submit the form without a signature."}
  de.b1.unit36.lesson02.teach.haette_sollen: {title: "Ich hätte das Formular früher abgeben sollen.", gloss: "I should have submitted the form earlier.", note: "*hätte... sollen* (double-infinitive construction) expresses regret about an unfulfilled past obligation.", example_gloss: "I should have submitted the form earlier."}
  de.b1.unit36.lesson03.teach.klein_ask: {title: "Frau Klein asks about the form", gloss: "Frau Klein: Hello, Felix. You must say whether the form is ready.", note: "This models present necessity with an embedded ob-clause."}
  de.b1.unit36.lesson03.teach.felix_answer: {title: "Felix answers and regrets the delay", gloss: "Felix: Yes, it is ready. But I should have submitted it earlier.", note: "This models the hätte... sollen past-regret construction."}
  de.b1.unit36.lesson03.teach.klein_prohibition: {title: "Frau Klein states the prohibition", gloss: "Frau Klein: That's right. But you must not submit the form without a signature.", note: "This models dürfen negated with nicht for prohibition."}
  de.b1.unit36.lesson03.teach.felix_close: {title: "Felix agrees to sign", gloss: "Felix: Good, I'll sign now.", note: "This closes the dialogue and visibly resolves the prohibition."}

