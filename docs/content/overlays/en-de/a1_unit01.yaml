course:
  title: "German A1"
  description: "Learn A1-level German for everyday greetings and short social exchanges, with detailed English explanations."

units:
  de.a1.unit01.greetings: {title: "Greetings and farewells"}

lessons:
  de.a1.unit01.lesson01.hallo_und_tageszeiten: {title: "Hello and time-of-day greetings"}
  de.a1.unit01.lesson02.abschied: {title: "Saying goodbye"}
  de.a1.unit01.lesson03.formell_und_informell: {title: "Formal and informal: Sie and du"}
  de.a1.unit01.lesson04.hoeflichkeit: {title: "Polite expressions"}
  de.a1.unit01.lesson05.im_treppenhaus: {title: "In the stairwell"}

teaching:
  de.a1.unit01.lesson01.teach.hallo: {title: "Hallo", gloss: "hello / hi", note: "*Hallo* is a casual, all-purpose greeting used at any time of day, similar to English 'hi.'", example_gloss: "Hello, Felix!"}
  de.a1.unit01.lesson01.teach.guten_morgen: {title: "Guten Morgen", gloss: "good morning", note: "*Guten Morgen* is used in the morning, roughly until late morning."}
  de.a1.unit01.lesson01.teach.guten_tag: {title: "Guten Tag", gloss: "good day / hello", note: "*Guten Tag* is the standard, slightly more formal daytime greeting, usable any time from late morning through the afternoon."}
  de.a1.unit01.lesson01.teach.guten_abend: {title: "Guten Abend", gloss: "good evening", note: "*Guten Abend* is used when arriving somewhere in the evening -- it's a greeting, not a farewell."}

  de.a1.unit01.lesson02.teach.tschuss: {title: "Tschüss", gloss: "bye", note: "*Tschüss* is a casual, very common way to say goodbye among friends and acquaintances.", example_gloss: "Bye, see you soon!"}
  de.a1.unit01.lesson02.teach.auf_wiedersehen: {title: "Auf Wiedersehen", gloss: "goodbye (formal)", note: "*Auf Wiedersehen* literally means 'until we see each other again' -- the standard, more formal farewell, appropriate with strangers or in professional settings."}
  de.a1.unit01.lesson02.teach.bis_bald: {title: "Bis bald", gloss: "see you soon", note: "*Bis bald* is a friendly way to say goodbye when you expect to see the person again soon."}
  de.a1.unit01.lesson02.teach.bis_spater: {title: "Bis später", gloss: "see you later", note: "*Bis später* is used when you'll see the person again later the same day."}
  de.a1.unit01.lesson02.teach.gute_nacht: {title: "Gute Nacht", gloss: "good night", note: "*Gute Nacht* is said when someone is going to bed or ending the day -- unlike *Guten Abend*, this is a farewell, not a greeting."}

  de.a1.unit01.lesson03.teach.sie: {title: "Sie", gloss: "you (formal)", note: "*Sie* is the formal 'you,' capitalized even mid-sentence, used with strangers, elders, or in formal/professional situations. German has no single-word equivalent distinction in English -- this is a new grammatical concept, not just a new word."}
  de.a1.unit01.lesson03.teach.du: {title: "du", gloss: "you (informal)", note: "*du* is the informal 'you,' used with friends, family, and children. Using *du* with a stranger can sound overly familiar or even rude."}
  de.a1.unit01.lesson03.teach.wie_geht_es_ihnen: {title: "Wie geht es Ihnen?", gloss: "How are you? (formal)", note: "The formal way to ask how someone is doing -- *Ihnen* is the formal dative 'you,' matching the *Sie* register."}
  de.a1.unit01.lesson03.teach.wie_gehts: {title: "Wie geht's?", gloss: "How's it going? (informal)", note: "*Wie geht's* is a contraction of *Wie geht es* -- the everyday informal way to ask how someone is."}
  de.a1.unit01.lesson03.teach.gut_danke: {title: "Gut, danke.", gloss: "Good, thanks.", note: "A simple, neutral reply usable in either register."}
  de.a1.unit01.lesson03.teach.sehr_gut_danke: {title: "Sehr gut, danke.", gloss: "Very good, thanks.", note: "A more enthusiastic reply than *Gut, danke.*"}
  de.a1.unit01.lesson03.teach.und_ihnen: {title: "Und Ihnen?", gloss: "And you? (formal)", note: "The formal way to return the question, matching the *Sie* register."}
  de.a1.unit01.lesson03.teach.und_dir: {title: "Und dir?", gloss: "And you? (informal)", note: "The informal way to return the question -- *dir* is the informal dative 'you,' matching the *du* register."}

  de.a1.unit01.lesson04.teach.danke: {title: "Danke", gloss: "thanks / thank you", note: "*Danke* already appeared in lesson03's replies -- here it's the standalone word on its own.", example_gloss: "Thank you very much!"}
  de.a1.unit01.lesson04.teach.bitte: {title: "Bitte", gloss: "please / you're welcome", note: "*Bitte* genuinely has two common meanings depending on context: 'please' when making a request, or 'you're welcome' when replying to thanks. Context tells you which one is meant -- it isn't a coincidence or an error, both uses are completely standard.", example_gloss: ["A coffee, please.", "You're very welcome!"]}
  de.a1.unit01.lesson04.teach.entschuldigung: {title: "Entschuldigung", gloss: "excuse me / sorry", note: "*Entschuldigung* is used both to politely get someone's attention and to apologize briefly.", example_gloss: "Excuse me, where is the restroom?"}
  de.a1.unit01.lesson04.teach.kein_problem: {title: "Kein Problem", gloss: "no problem", note: "A casual, friendly reply, similar in tone to English 'no problem.'"}
  de.a1.unit01.lesson04.teach.gern_geschehen: {title: "Gern geschehen", gloss: "you're welcome", note: "A fuller, more explicit way to say 'you're welcome' than the shorter *Bitte*."}

  de.a1.unit01.lesson05.teach.line01: {title: "Anna greets Felix", gloss: "Anna says: Good day!", note: "Anna and Felix are meeting for the first time as neighbors in their apartment building."}
  de.a1.unit01.lesson05.teach.line02: {title: "Felix returns the greeting and asks how she is", gloss: "Felix says: Good day! How are you?", note: "Felix uses the formal *Sie* register since they've just met."}
  de.a1.unit01.lesson05.teach.line03: {title: "Anna replies and asks back", gloss: "Anna says: Thanks, good. And you?", note: "Anna replies and returns the question formally, matching Felix's register."}
  de.a1.unit01.lesson05.teach.line04: {title: "Felix replies", gloss: "Felix says: Very good, thanks.", note: "A slightly more enthusiastic reply than a plain *Gut, danke.*"}
  de.a1.unit01.lesson05.teach.line05: {title: "Anna says goodbye", gloss: "Anna says: Goodbye!", note: "Anna uses the more formal farewell, consistent with the *Sie* register they've used throughout."}
  de.a1.unit01.lesson05.teach.line06: {title: "Felix says goodbye and see you soon", gloss: "Felix says: Goodbye, see you soon!", note: "Felix combines the formal farewell with 'see you soon,' staying consistent with the *Sie* register both speakers have used throughout this first meeting."}

exercises:
  de.a1.unit01.lesson01.exercise01.listen_hallo:
    instruction: "Listen and select the word you hear."
    correct_option: "Hallo"
    distractors: ["Guten Morgen", "Guten Abend", "Tschüss"]
    accepted_answers: [{value: "Hallo", status: "correct"}]
    feedback: "*Hallo* means hello."
  de.a1.unit01.lesson01.exercise02.choose_morning:
    instruction: "Which greeting is used in the morning?"
    correct_option: "Guten Morgen"
    distractors: ["Guten Abend", "Gute Nacht", "Tschüss"]
    accepted_answers: [{value: "Guten Morgen", status: "correct"}]
    feedback: "*Guten Morgen* means good morning."
  de.a1.unit01.lesson01.exercise03.choose_evening:
    instruction: "Which greeting is used in the evening?"
    correct_option: "Guten Abend"
    distractors: ["Guten Morgen", "Guten Tag", "Auf Wiedersehen"]
    accepted_answers: [{value: "Guten Abend", status: "correct"}]
    feedback: "*Guten Abend* means good evening."
  de.a1.unit01.lesson01.exercise07.listen_evening:
    instruction: "Listen and select the phrase you hear."
    correct_option: "Guten Abend"
    distractors: ["Guten Morgen", "Guten Tag", "Hallo"]
    accepted_answers: [{value: "Guten Abend", status: "correct"}]
    feedback: "*Guten Abend* means good evening."
  de.a1.unit01.lesson01.exercise04.listen_order_morning:
    instruction: "Listen and put the words in the correct order."
    accepted_answers: [{value: ["Guten", "Morgen"], status: "correct"}]
    feedback: "The correct order is *Guten Morgen*."
  de.a1.unit01.lesson01.exercise05.order_evening:
    instruction: "Put the words in the correct order to say 'good evening.'"
    accepted_answers: [{value: ["Guten", "Abend"], status: "correct"}]
    feedback: "The correct order is *Guten Abend*."
  de.a1.unit01.lesson01.exercise06.write_tag:
    instruction: "Write the daytime greeting used any time during the day."
    accepted_answers:
      - {value: "Guten Tag", status: "correct"}
      - {value: "Guten Tag.", status: "correct"}
    feedback: "*Guten Tag* means good day / hello."

  de.a1.unit01.lesson02.exercise01.listen_wiedersehen:
    instruction: "Listen and select the phrase you hear."
    correct_option: "Auf Wiedersehen"
    distractors: ["Tschüss", "Bis bald", "Gute Nacht"]
    accepted_answers: [{value: "Auf Wiedersehen", status: "correct"}]
    feedback: "*Auf Wiedersehen* is the formal way to say goodbye."
  de.a1.unit01.lesson02.exercise02.choose_bedtime_farewell:
    instruction: "Which farewell is said to someone going to bed, not someone leaving in the evening?"
    correct_option: "Gute Nacht"
    distractors: ["Guten Abend", "Auf Wiedersehen", "Bis später"]
    accepted_answers: [{value: "Gute Nacht", status: "correct"}]
    feedback: "*Gute Nacht* is said at bedtime, unlike *Guten Abend*, which is a greeting."
  de.a1.unit01.lesson02.exercise03.listen_night:
    instruction: "Listen and select the phrase you hear."
    correct_option: "Gute Nacht"
    distractors: ["Guten Abend", "Guten Morgen", "Tschüss"]
    accepted_answers: [{value: "Gute Nacht", status: "correct"}]
    feedback: "*Gute Nacht* means good night."
  de.a1.unit01.lesson02.exercise04.order_wiedersehen:
    instruction: "Put the words in the correct order to say the formal goodbye."
    accepted_answers: [{value: ["Auf", "Wiedersehen"], status: "correct"}]
    feedback: "The correct order is *Auf Wiedersehen*."
  de.a1.unit01.lesson02.exercise05.order_bis_spater:
    instruction: "Put the words in the correct order to say 'see you later.'"
    accepted_answers: [{value: ["Bis", "später"], status: "correct"}]
    feedback: "The correct order is *Bis später*."
  de.a1.unit01.lesson02.exercise06.reply_casual_farewell:
    instruction: "A friend says goodbye casually. Reply with a casual farewell and 'see you soon.'"
    accepted_answers:
      - {value: "Tschüss, bis bald!", status: "correct"}
      - {value: "Tschüss. Bis bald!", status: "correct"}
      - {value: "Tschüss bis bald", status: "correct"}
      - {value: "Tschuess, bis bald!", status: "correct"}
      - {value: "Tschuess. Bis bald!", status: "correct"}
      - {value: "Tschuess bis bald", status: "correct"}
    feedback: "*Tschüss, bis bald!* combines a casual goodbye with 'see you soon.'"

  de.a1.unit01.lesson03.exercise01.choose_formal_pronoun:
    instruction: "Which word is the formal 'you,' used with strangers or in formal situations?"
    correct_option: "Sie"
    distractors: ["du", "Hallo", "Tschüss"]
    accepted_answers: [{value: "Sie", status: "correct"}]
    feedback: "*Sie* is the formal 'you.'"
  de.a1.unit01.lesson03.exercise02.choose_informal_pronoun:
    instruction: "Which word is the informal 'you,' used with friends?"
    correct_option: "du"
    distractors: ["Sie", "Hallo", "Tschüss"]
    accepted_answers: [{value: "du", status: "correct"}]
    feedback: "*du* is the informal 'you.'"
  de.a1.unit01.lesson03.exercise03.listen_formal_question:
    instruction: "Listen and select the question you hear."
    correct_option: "Wie geht es Ihnen"
    distractors: ["Wie geht's", "Und Ihnen", "Guten Tag"]
    accepted_answers: [{value: "Wie geht es Ihnen", status: "correct"}]
    feedback: "*Wie geht es Ihnen?* is the formal way to ask how someone is."
  de.a1.unit01.lesson03.exercise04.listen_informal_question:
    instruction: "Listen and select the question you hear."
    correct_option: "Wie geht's"
    distractors: ["Wie geht es Ihnen", "Und dir", "Tschüss"]
    accepted_answers: [{value: "Wie geht's", status: "correct"}]
    feedback: "*Wie geht's?* is the informal way to ask how someone is."
  de.a1.unit01.lesson03.exercise05.order_formal_question:
    instruction: "Put the words in the correct order to formally ask how someone is."
    accepted_answers: [{value: ["Wie", "geht", "es", "Ihnen"], status: "correct"}]
    feedback: "The correct order is *Wie geht es Ihnen?*"
  de.a1.unit01.lesson03.exercise06.reply_formally:
    instruction: "Someone you don't know asks 'Wie geht es Ihnen?' Reply that you're well, thanks, and ask them back formally."
    accepted_answers:
      - {value: "Gut, danke. Und Ihnen?", status: "correct"}
      - {value: "Gut, danke, und Ihnen?", status: "correct"}
      - {value: "Gut danke Und Ihnen", status: "correct"}
    feedback: "*Gut, danke. Und Ihnen?* replies formally and returns the question in the same register."
  de.a1.unit01.lesson03.exercise07.reply_informally:
    instruction: "A friend asks 'Wie geht's?' Reply that you're very well, thanks, and ask them back informally."
    accepted_answers:
      - {value: "Sehr gut, danke. Und dir?", status: "correct"}
      - {value: "Sehr gut, danke, und dir?", status: "correct"}
      - {value: "Sehr gut danke Und dir", status: "correct"}
    feedback: "*Sehr gut, danke. Und dir?* replies informally and returns the question in the same register."
  de.a1.unit01.lesson03.exercise08.speak_informal_exchange:
    instruction: "A friend asks 'Wie geht's?' Answer out loud that you're very well, thanks, and ask them back informally."
    accepted_answers:
      - {value: "Sehr gut, danke. Und dir?", status: "correct"}
      - {value: "Sehr gut, danke, und dir?", status: "correct"}
      - {value: "Sehr gut danke Und dir", status: "correct"}
    feedback: "*Sehr gut, danke. Und dir?* answers and returns the question informally."

  de.a1.unit01.lesson04.exercise01.listen_entschuldigung:
    instruction: "Listen and select the word you hear."
    correct_option: "Entschuldigung"
    distractors: ["Danke", "Bitte", "Kein Problem"]
    accepted_answers: [{value: "Entschuldigung", status: "correct"}]
    feedback: "*Entschuldigung* means excuse me / sorry."
  de.a1.unit01.lesson04.exercise02.choose_please_or_welcome:
    instruction: "Which single word can mean both 'please' and 'you're welcome,' depending on context?"
    correct_option: "Bitte"
    distractors: ["Danke", "Entschuldigung", "Gern geschehen"]
    accepted_answers: [{value: "Bitte", status: "correct"}]
    feedback: "*Bitte* genuinely has both meanings, depending on context."
  de.a1.unit01.lesson04.exercise03.choose_no_problem:
    instruction: "Which phrase means 'no problem'?"
    correct_option: "Kein Problem"
    distractors: ["Gern geschehen", "Entschuldigung", "Bitte"]
    accepted_answers: [{value: "Kein Problem", status: "correct"}]
    feedback: "*Kein Problem* means no problem."
  de.a1.unit01.lesson04.exercise04.order_gern_geschehen:
    instruction: "Put the words in the correct order to say 'you're welcome' (the fuller way)."
    accepted_answers: [{value: ["Gern", "geschehen"], status: "correct"}]
    feedback: "The correct order is *Gern geschehen*."
  de.a1.unit01.lesson04.exercise05.reply_to_thanks:
    instruction: "Someone says 'Danke!' to you. Reply with the short, common way to say 'you're welcome.'"
    accepted_answers:
      - {value: "Bitte", status: "correct"}
      - {value: "Bitte!", status: "correct"}
    feedback: "*Bitte* here means 'you're welcome.'"
  de.a1.unit01.lesson04.exercise06.write_entschuldigung:
    instruction: "Write the word you say to politely get someone's attention or apologize briefly."
    accepted_answers:
      - {value: "Entschuldigung", status: "correct"}
      - {value: "Entschuldigung.", status: "correct"}
    feedback: "*Entschuldigung* means excuse me / sorry."

  de.a1.unit01.lesson05.exercise01.listen_greeting_used:
    instruction: "Which greeting do Anna and Felix use when they first see each other?"
    correct_option: "Guten Tag"
    distractors: ["Hallo", "Guten Abend", "Tschüss"]
    accepted_answers: [{value: "Guten Tag", status: "correct"}]
    feedback: "They both say *Guten Tag!* at the start of the conversation."
  de.a1.unit01.lesson05.exercise02.listen_wellbeing_reply:
    instruction: "Listen to the dialogue and select how Anna says she's doing."
    correct_option: "Danke, gut"
    distractors: ["Sehr gut, danke", "Nicht so gut", "Kein Problem"]
    accepted_answers: [{value: "Danke, gut", status: "correct"}]
    feedback: "Anna says *Danke, gut.*"
  de.a1.unit01.lesson05.exercise03.choose_register:
    instruction: "Anna and Felix have just met as neighbors. Which form of 'you' do they use with each other?"
    correct_option: "Sie"
    distractors: ["wir", "Hallo", "Danke"]
    accepted_answers: [{value: "Sie", status: "correct"}]
    feedback: "Since they've just met, they use the formal *Sie*, seen in *Wie geht es Ihnen?* and *Und Ihnen?*"
  de.a1.unit01.lesson05.exercise04.match_unit_vocabulary:
    instruction: "Match each German word or phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "Hallo", right: "an informal hello"}
          - {left: "Guten Morgen", right: "good morning"}
          - {left: "Guten Abend", right: "good evening"}
          - {left: "Tschüss", right: "an informal goodbye"}
          - {left: "Auf Wiedersehen", right: "a formal goodbye"}
          - {left: "Bis bald", right: "see you soon"}
          - {left: "Danke", right: "thank you"}
          - {left: "Bitte", right: "please / you're welcome"}
          - {left: "Entschuldigung", right: "excuse me"}
        status: "correct"
    feedback: "Hallo=an informal hello, Guten Morgen=good morning, Guten Abend=good evening, Tschüss=an informal goodbye, Auf Wiedersehen=a formal goodbye, Bis bald=see you soon, Danke=thank you, Bitte=please/you're welcome, Entschuldigung=excuse me."
  de.a1.unit01.lesson05.exercise05.order_felix_reply:
    instruction: "Put the words in the correct order for what Felix asks Anna."
    accepted_answers: [{value: ["Wie", "geht", "es", "Ihnen"], status: "correct"}]
    feedback: "Felix asks *Wie geht es Ihnen?*"
  de.a1.unit01.lesson05.exercise06.reply_as_anna:
    instruction: "Felix says: Good day! How are you? ... Very good, thanks. Reply as Anna: say you're well, thanks, ask him back, then say a formal goodbye."
    accepted_answers:
      - {value: "Danke, gut. Und Ihnen? Auf Wiedersehen!", status: "correct"}
      - {value: "Danke gut Und Ihnen Auf Wiedersehen", status: "correct"}
    feedback: "Anna's full reply covers her own wellbeing, returning the question, and closing formally -- several moments from the dialogue together."
  de.a1.unit01.lesson05.exercise07.speak_neighbor_dialogue:
    instruction: "Answer out loud in Anna's role: say you're well, thanks, ask him back, then say a formal goodbye."
    accepted_answers:
      - {value: "Danke, gut. Und Ihnen? Auf Wiedersehen!", status: "correct"}
      - {value: "Danke gut Und Ihnen Auf Wiedersehen", status: "correct"}
    feedback: "This full answer covers Anna's wellbeing reply, her return question, and her formal goodbye."
  de.a1.unit01.lesson03.exercise09.dictation_wie_geht_s:
    instruction: "Type what you hear."
    accepted_answers: [{value: "Wie geht's", status: correct}]
    orthography_strict: true
