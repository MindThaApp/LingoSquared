review: {"status": "unreviewed", "required_next_reviewer": "native_speaker_review", "notes": "English overlay for the polite requests and offers unit (moechte, haette gern, Koennten Sie, Wuerden Sie, Soll ich, polite answers). The cafe dialogue uses formal Sie on purpose. OPEN NATIVE QUESTIONS: none beyond the realization notes."}
course:
  title: "German A2"
  description: "Grammar-led A2 German continuing the Anna and Felix storyline."
  learning_goal: "Make predictions, follow rules, state what you can do, ask politely, give advice and talk about habits in German."
units:
  de.a2.unit106.hoeflich: {"title": "Could You Help Me?", "description": "Make polite requests with möchte, hätte gern, könnten Sie and würden Sie, offer help with kann ich and soll ich, and accept or decline politely."}
lessons:
  de.a2.unit106.lesson01.ich_moechte: {"title": "I Would Like a Coffee"}
  de.a2.unit106.lesson02.koennten_sie: {"title": "Could You Please Repeat That?"}
  de.a2.unit106.lesson03.angebote: {"title": "Shall I Open the Door?"}
  de.a2.unit106.lesson04.annehmen_ablehnen: {"title": "Yes Please, No Thank You"}
  de.a2.unit106.lesson05.im_cafe: {"title": "In the Cafe"}
  de.a2.unit106.lesson06.am_tisch: {"title": "Anna and Frau Berger"}
teaching:
  de.a2.unit106.lesson01.teach.cafe: {"title": "Ordering politely", "gloss": "coffee / water / table / I would like / I would like (politely) / please", "example_gloss": ["I would like a coffee, please.", "I would like a water.", "We would like a table.", "I would like a table for two."], "note": "*Ich möchte* and *ich hätte gern* are both polite; they sound softer than *ich will*."}
  de.a2.unit106.lesson01.teach.gn_moechten: {"title": "Möchten: would like", "gloss": "I would like, you would like, he would like, we would like, you (plural) would like, they would like", "note": "*Möchten* works like a modal verb. *Ich* and *er* have the same form: *möchte*."}
  de.a2.unit106.lesson01.teach.gn_haette: {"title": "Ich hätte gern", "gloss": "I would like a coffee. I would like a water.", "note": "*Hätte gern* is another polite way to ask for something. The object follows directly."}
  de.a2.unit106.lesson01.teach.gn_artikel: {"title": "Einen or ein?", "gloss": "I would like a coffee. I would like a table. I would like a water.", "note": "Masculine nouns take *einen* after *möchte* (*einen Kaffee, einen Tisch*). Neuter nouns take *ein* (*ein Wasser*)."}
  de.a2.unit106.lesson02.teach.bitten: {"title": "Asking for something", "gloss": "to bring / to show / to repeat / slowly / to speak / bill / way", "example_gloss": ["Could you bring me the bill?", "Could you please repeat that?", "Could you please speak slowly?", "Could you show me the way?"], "note": "Requests to a stranger or a waiter use *Sie*. In this unit the guests say *Sie* to Anna."}
  de.a2.unit106.lesson02.teach.gn_koennten: {"title": "Könnten: the polite form", "gloss": "Could you help me? Could you help me? (informal)", "note": "*Könnten* and *könntest* are more polite than *können* and *kannst*. Use *Sie* with strangers and *du* with friends."}
  de.a2.unit106.lesson02.teach.gn_bitte: {"title": "Bitte and mir", "gloss": "Could you please repeat that? Could you bring me the bill?", "note": "*Bitte* usually stands after the pronoun. *Mir* means 'for me'. The infinitive goes at the end."}
  de.a2.unit106.lesson02.teach.gn_wuerden: {"title": "Würden: another polite form", "gloss": "Would you please speak slowly? Would you show me the way?", "note": "*Würden Sie ... ?* with an infinitive at the end is equally polite. With *du*: *würdest du*."}
  de.a2.unit106.lesson03.teach.anbieten: {"title": "Offering help", "gloss": "to carry / bag / door / to open / another, still / something", "example_gloss": ["Can I help you?", "Shall I carry the bag?", "Shall I open the door?", "Would you like another coffee?"], "note": "*Aufmachen* is separable and stays together after *soll ich*."}
  de.a2.unit106.lesson03.teach.gn_soll: {"title": "Soll ich ...?", "gloss": "Shall I open the door? Shall I carry the bag?", "note": "*Soll ich ... ?* offers to do something for someone. The infinitive goes at the end."}
  de.a2.unit106.lesson03.teach.gn_kann: {"title": "Kann ich ... helfen?", "gloss": "Can I help you? I can help you.", "note": "*Helfen* takes the dative: *Ihnen* (formal), *dir* (informal), *mir* (me)."}
  de.a2.unit106.lesson03.teach.gn_moechten: {"title": "Möchten Sie ...?", "gloss": "Would you like another coffee? Would you like another coffee? (informal)", "note": "*Möchten Sie / möchtest du* is the polite way to offer food or drink."}
  de.a2.unit106.lesson04.teach.antworten: {"title": "Polite answers", "gloss": "thank you / gladly / kind / of course / no problem / unfortunately", "example_gloss": ["Yes, gladly.", "No, thank you.", "That is very kind of you.", "I'm sorry, that's not possible."], "note": "Short answers to requests and offers."}
  de.a2.unit106.lesson04.teach.gn_annehmen: {"title": "Saying yes", "gloss": "Yes, gladly. Yes, please. Of course!", "note": "*Gern* and *bitte* accept an offer. *Natürlich* agrees to a request."}
  de.a2.unit106.lesson04.teach.gn_ablehnen: {"title": "Saying no", "gloss": "No, thank you. I'm sorry, that's not possible. No problem.", "note": "*Nein, danke* turns down an offer. *Das geht leider nicht* turns down a request politely."}
  de.a2.unit106.lesson04.teach.gn_nett: {"title": "Thanking politely", "gloss": "That is very kind of you. That is very kind of you. (informal)", "note": "*Von Ihnen* for strangers, *von dir* for friends."}
  de.a2.unit106.lesson05.teach.cafe_text: {"title": "Words for the story", "gloss": "Mrs Berger / to sit / to work / there / also / newspaper / later", "example_gloss": ["Frau Berger is sitting in the cafe.", "Anna works there.", "Could you also bring me the newspaper?", "Later she says: Thank you."], "note": "Words for the story you will read."}
  de.a2.unit106.lesson05.teach.gn_text: {"title": "Offer, refusal, thanks", "gloss": "Shall I open the door? No, thank you. That is very kind of you.", "note": "Notice how the offer, the refusal and the thanks fit together."}
  de.a2.unit106.lesson05.teach.lesen_cafe: {"title": "Frau Berger in the cafe", "gloss": "Frau Berger is sitting in the cafe. Anna works there. Frau Berger would like a coffee. She asks: Could you also bring me the newspaper, please? Anna says: Of course. Shall I open the door? Frau Berger says: No, thank you. That is very kind of you. Later she asks: Could you bring me the bill, please?", "note": "A request, an offer, a refusal and a second request, all with polite forms."}
  de.a2.unit106.lesson06.teach.anna_helfen: {"title": "Anna greets", "gloss": "Anna: Hello! Can I help you?"}
  de.a2.unit106.lesson06.teach.berger_kaffee: {"title": "Frau Berger orders", "gloss": "Frau Berger: Hello! I would like a coffee, please."}
  de.a2.unit106.lesson06.teach.anna_kuchen: {"title": "Anna offers cake", "gloss": "Anna: Gladly. Would you also like a cake?"}
  de.a2.unit106.lesson06.teach.berger_nein: {"title": "Frau Berger asks", "gloss": "Frau Berger: No, thank you. Could you bring me the newspaper?"}
  de.a2.unit106.lesson06.teach.anna_tuer: {"title": "Anna offers more", "gloss": "Anna: Of course. Shall I open the door?"}
  de.a2.unit106.lesson06.teach.berger_nett: {"title": "Frau Berger refuses kindly", "gloss": "Frau Berger: No, thank you. That is very kind of you."}
exercises:
  de.a2.unit106.lesson01.exercise01.wahl_kaffee: {"instruction": "Choose the correct German sentence.", "correct_option": "Ich möchte einen Kaffee.", "distractors": ["Ich möchte ein Kaffee.", "Ich möchten einen Kaffee.", "Ich möchtest einen Kaffee."], "accepted_answers": [{"value": "Ich möchte einen Kaffee.", "status": "correct"}, {"value": "Ich moechte einen Kaffee.", "status": "correct"}], "feedback": "*Ich möchte einen Kaffee.*"}
  de.a2.unit106.lesson01.exercise02.wahl_wasser: {"instruction": "Choose the correct German sentence.", "correct_option": "Ich hätte gern ein Wasser, bitte.", "distractors": ["Ich hätte gern einen Wasser, bitte.", "Ich hatte gern ein Wasser, bitte.", "Ich hätte gern Wasser ein, bitte."], "accepted_answers": [{"value": "Ich hätte gern ein Wasser, bitte.", "status": "correct"}, {"value": "Ich haette gern ein Wasser, bitte.", "status": "correct"}], "feedback": "*Wasser* is neuter: *ein Wasser*."}
  de.a2.unit106.lesson01.exercise03.paare_formen: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "ich möchte", "right": "I would like"}, {"left": "du möchtest", "right": "you would like"}, {"left": "er möchte", "right": "he would like"}, {"left": "wir möchten", "right": "we would like"}, {"left": "ihr möchtet", "right": "you (plural) would like"}, {"left": "sie möchten", "right": "they would like"}], "status": "correct"}], "feedback": "möchten: möchte, möchtest, möchte, möchten, möchtet, möchten."}
  de.a2.unit106.lesson01.exercise04.ordnen_tisch: {"instruction": "Put the words in order to say 'I would like a table for two.'", "correct_option": "Ich möchte einen Tisch für zwei", "accepted_answers": [{"value": "Ich möchte einen Tisch für zwei", "status": "correct"}], "feedback": "*Möchte* second."}
  de.a2.unit106.lesson01.exercise05.luecke_haette: {"instruction": "Complete with the polite form.", "correct_option": "hätte", "accepted_answers": [{"value": "hätte", "status": "correct"}, {"value": "haette", "status": "correct"}], "feedback": "*Ich hätte gern*."}
  de.a2.unit106.lesson01.exercise06.uebersetzen_tisch: {"instruction": "Translate into German.", "accepted_answers": [{"value": "Wir möchten einen Tisch.", "status": "correct"}, {"value": "Wir moechten einen Tisch.", "status": "correct"}], "feedback": "*Wir möchten*."}
  de.a2.unit106.lesson01.exercise07.schreiben_kaffee: {"instruction": "Write the requested German sentence.", "correct_option": "Ich möchte einen Kaffee, bitte.", "accepted_answers": [{"value": "Ich möchte einen Kaffee, bitte.", "status": "correct"}, {"value": "Ich moechte einen Kaffee, bitte.", "status": "correct"}, {"value": "Ich möchte einen Kaffee bitte.", "status": "correct"}, {"value": "Ich moechte einen Kaffee bitte.", "status": "correct"}, {"value": "Ich hätte gern einen Kaffee, bitte.", "status": "correct"}, {"value": "Ich haette gern einen Kaffee, bitte.", "status": "correct"}, {"value": "Ich hätte gern einen Kaffee bitte.", "status": "correct"}, {"value": "Ich haette gern einen Kaffee bitte.", "status": "correct"}], "feedback": "Polite order."}
  de.a2.unit106.lesson02.exercise01.wahl_wiederholen: {"instruction": "Choose the correct German sentence.", "correct_option": "Könnten Sie das bitte wiederholen?", "distractors": ["Könnten Sie das bitte wiederholt?", "Könnten sie das bitte wiederholen Sie?", "Könnten Sie wiederholen das bitte?"], "accepted_answers": [{"value": "Könnten Sie das bitte wiederholen?", "status": "correct"}, {"value": "Koennten Sie das bitte wiederholen?", "status": "correct"}], "feedback": "*Wiederholen* at the end."}
  de.a2.unit106.lesson02.exercise02.wahl_rechnung: {"instruction": "Choose the correct German sentence.", "correct_option": "Könnten Sie mir die Rechnung bringen?", "distractors": ["Könnten Sie mich die Rechnung bringen?", "Könnten Sie mir die Rechnung gebracht?", "Könnten Sie bringen mir die Rechnung?"], "accepted_answers": [{"value": "Könnten Sie mir die Rechnung bringen?", "status": "correct"}, {"value": "Koennten Sie mir die Rechnung bringen?", "status": "correct"}], "feedback": "*Mir* = for me."}
  de.a2.unit106.lesson02.exercise03.paare_bitten: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Könnten Sie mir helfen?", "right": "Could you help me?"}, {"left": "Könntest du mir helfen?", "right": "Could you help me? (informal)"}, {"left": "Würden Sie bitte langsam sprechen?", "right": "Would you please speak slowly?"}, {"left": "Würdest du mir den Weg zeigen?", "right": "Would you show me the way? (informal)"}, {"left": "Könnten Sie das bitte wiederholen?", "right": "Could you please repeat that?"}, {"left": "Könnten Sie mir die Rechnung bringen?", "right": "Could you bring me the bill?"}], "status": "correct"}], "feedback": "Polite requests with Sie and du."}
  de.a2.unit106.lesson02.exercise04.ordnen_helfen: {"instruction": "Put the words in order to say 'Could you help me?'", "correct_option": "Könnten Sie mir helfen", "accepted_answers": [{"value": "Könnten Sie mir helfen", "status": "correct"}], "feedback": "*Könnten* first, *helfen* last."}
  de.a2.unit106.lesson02.exercise05.luecke_bringen: {"instruction": "Complete with the infinitive.", "correct_option": "bringen", "accepted_answers": [{"value": "bringen", "status": "correct"}], "feedback": "The infinitive goes at the end."}
  de.a2.unit106.lesson02.exercise06.uebersetzen_langsam: {"instruction": "Translate into German.", "accepted_answers": [{"value": "Könnten Sie bitte langsam sprechen?", "status": "correct"}, {"value": "Koennten Sie bitte langsam sprechen?", "status": "correct"}, {"value": "Würden Sie bitte langsam sprechen?", "status": "correct"}, {"value": "Wuerden Sie bitte langsam sprechen?", "status": "correct"}], "feedback": "*Könnten* and *würden* are both polite."}
  de.a2.unit106.lesson02.exercise07.schreiben_weg: {"instruction": "Write the requested German sentence.", "correct_option": "Könnten Sie mir den Weg zeigen?", "accepted_answers": [{"value": "Könnten Sie mir den Weg zeigen?", "status": "correct"}, {"value": "Koennten Sie mir den Weg zeigen?", "status": "correct"}, {"value": "Könntest du mir den Weg zeigen?", "status": "correct"}, {"value": "Koenntest du mir den Weg zeigen?", "status": "correct"}, {"value": "Würden Sie mir den Weg zeigen?", "status": "correct"}, {"value": "Wuerden Sie mir den Weg zeigen?", "status": "correct"}, {"value": "Würdest du mir den Weg zeigen?", "status": "correct"}, {"value": "Wuerdest du mir den Weg zeigen?", "status": "correct"}], "feedback": "*Zeigen* at the end."}
  de.a2.unit106.lesson03.exercise01.wahl_tasche: {"instruction": "Choose the correct German sentence.", "correct_option": "Soll ich die Tasche tragen?", "distractors": ["Soll ich die Tasche trage?", "Soll ich tragen die Tasche?", "Sollen ich die Tasche tragen?"], "accepted_answers": [{"value": "Soll ich die Tasche tragen?", "status": "correct"}], "feedback": "*Soll ich ... tragen?*"}
  de.a2.unit106.lesson03.exercise02.wahl_ihnen: {"instruction": "Choose the correct German sentence.", "correct_option": "Kann ich Ihnen helfen?", "distractors": ["Kann ich Sie helfen?", "Kann ich Ihnen geholfen?", "Kann Ihnen ich helfen?"], "accepted_answers": [{"value": "Kann ich Ihnen helfen?", "status": "correct"}], "feedback": "*Helfen* + dative: *Ihnen*."}
  de.a2.unit106.lesson03.exercise03.paare_angebote: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Kann ich Ihnen helfen?", "right": "Can I help you?"}, {"left": "Ich kann dir helfen.", "right": "I can help you."}, {"left": "Soll ich die Tasche tragen?", "right": "Shall I carry the bag?"}, {"left": "Soll ich die Tür aufmachen?", "right": "Shall I open the door?"}, {"left": "Möchten Sie noch einen Kaffee?", "right": "Would you like another coffee?"}, {"left": "Möchtest du noch etwas?", "right": "Would you like something else?"}], "status": "correct"}], "feedback": "Offers."}
  de.a2.unit106.lesson03.exercise04.ordnen_tuer: {"instruction": "Put the words in order to say 'Shall I open the door?'", "correct_option": "Soll ich die Tür aufmachen", "accepted_answers": [{"value": "Soll ich die Tür aufmachen", "status": "correct"}], "feedback": "*Aufmachen* in one piece."}
  de.a2.unit106.lesson03.exercise05.luecke_einen: {"instruction": "Complete the sentence.", "correct_option": "einen", "accepted_answers": [{"value": "einen", "status": "correct"}], "feedback": "*Kaffee* is masculine: *einen*."}
  de.a2.unit106.lesson03.exercise06.uebersetzen_noch: {"instruction": "Translate into German.", "accepted_answers": [{"value": "Möchten Sie noch einen Kaffee?", "status": "correct"}, {"value": "Moechten Sie noch einen Kaffee?", "status": "correct"}, {"value": "Möchtest du noch einen Kaffee?", "status": "correct"}, {"value": "Moechtest du noch einen Kaffee?", "status": "correct"}], "feedback": "Formal or informal."}
  de.a2.unit106.lesson03.exercise07.schreiben_tuer: {"instruction": "Write the requested German sentence.", "correct_option": "Soll ich die Tür aufmachen?", "accepted_answers": [{"value": "Soll ich die Tür aufmachen?", "status": "correct"}, {"value": "Soll ich die Tuer aufmachen?", "status": "correct"}], "feedback": "*Soll ich ... aufmachen?*"}
  de.a2.unit106.lesson04.exercise01.wahl_nett: {"instruction": "Choose the correct German sentence.", "correct_option": "Das ist sehr nett von Ihnen.", "distractors": ["Das ist sehr nett von Sie.", "Das sehr nett ist von Ihnen.", "Das ist sehr nett von Ihnen ist."], "accepted_answers": [{"value": "Das ist sehr nett von Ihnen.", "status": "correct"}], "feedback": "*Von Ihnen* - dative."}
  de.a2.unit106.lesson04.exercise02.wahl_geht: {"instruction": "Choose the correct German sentence.", "correct_option": "Tut mir leid, das geht leider nicht.", "distractors": ["Tut mir leid, das gehe leider nicht.", "Tut mir leid, geht das leider nicht.", "Tut mir leid, das geht nicht leider ist."], "accepted_answers": [{"value": "Tut mir leid, das geht leider nicht.", "status": "correct"}], "feedback": "*Das geht leider nicht.*"}
  de.a2.unit106.lesson04.exercise03.paare_antworten: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Ja, gern.", "right": "Yes, gladly."}, {"left": "Nein, danke.", "right": "No, thank you."}, {"left": "Das ist sehr nett von Ihnen.", "right": "That is very kind of you."}, {"left": "Tut mir leid, das geht leider nicht.", "right": "I'm sorry, that's not possible."}, {"left": "Kein Problem.", "right": "No problem."}, {"left": "Natürlich!", "right": "Of course!"}], "status": "correct"}], "feedback": "Polite answers."}
  de.a2.unit106.lesson04.exercise04.ordnen_nett: {"instruction": "Put the words in order to say 'No, thank you, that is very kind.'", "correct_option": "Nein danke das ist sehr nett", "accepted_answers": [{"value": "Nein danke das ist sehr nett", "status": "correct"}], "feedback": "Short refusal plus thanks."}
  de.a2.unit106.lesson04.exercise05.luecke_leider: {"instruction": "Complete the sentence.", "correct_option": "leider", "accepted_answers": [{"value": "leider", "status": "correct"}], "feedback": "*Leider* softens the no."}
  de.a2.unit106.lesson04.exercise06.uebersetzen_danke: {"instruction": "Translate into German.", "accepted_answers": [{"value": "Danke, das ist sehr nett.", "status": "correct"}, {"value": "Danke das ist sehr nett.", "status": "correct"}], "feedback": "Short and polite."}
  de.a2.unit106.lesson04.exercise07.schreiben_zwei: {"instruction": "Write the requested German sentences.", "correct_option": "Ja, gern. Nein, danke.", "accepted_answers": [{"value": "Ja, gern. Nein, danke.", "status": "correct"}, {"value": "Ja gern. Nein danke.", "status": "correct"}, {"value": "Ja, bitte. Nein, danke.", "status": "correct"}, {"value": "Ja bitte. Nein danke.", "status": "correct"}], "feedback": "Accept, then decline."}
  de.a2.unit106.lesson05.exercise01.lesen_kaffee: {"instruction": "Read the text and choose the answer.", "correct_option": "Coffee", "distractors": ["Water", "Tea", "Juice"], "accepted_answers": [{"value": "Coffee", "status": "correct"}], "feedback": "*Frau Berger möchte einen Kaffee.*"}
  de.a2.unit106.lesson05.exercise02.lesen_angebot: {"instruction": "Read the text and choose the answer.", "correct_option": "Open the door.", "distractors": ["Carry the bag.", "Bring another coffee.", "Call a taxi."], "accepted_answers": [{"value": "Open the door.", "status": "correct"}], "feedback": "*Soll ich die Tür aufmachen?*"}
  de.a2.unit106.lesson05.exercise03.paare_cafe: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Frau Berger sitzt im Café.", "right": "Frau Berger is sitting in the cafe."}, {"left": "Anna arbeitet dort.", "right": "Anna works there."}, {"left": "Frau Berger möchte einen Kaffee.", "right": "Frau Berger would like a coffee."}, {"left": "Könnten Sie mir bitte auch die Zeitung bringen?", "right": "Could you also bring me the newspaper, please?"}, {"left": "Soll ich die Tür aufmachen?", "right": "Shall I open the door?"}, {"left": "Könnten Sie mir bitte die Rechnung bringen?", "right": "Could you bring me the bill, please?"}], "status": "correct"}], "feedback": "Match the lines of the story."}
  de.a2.unit106.lesson05.exercise04.ordnen_zeitung: {"instruction": "Put the words in order to say 'Could you bring me the newspaper?'", "correct_option": "Könnten Sie mir bitte die Zeitung bringen", "accepted_answers": [{"value": "Könnten Sie mir bitte die Zeitung bringen", "status": "correct"}], "feedback": "*Bitte* after *mir*."}
  de.a2.unit106.lesson05.exercise05.uebersetzen_berger: {"instruction": "Translate into German.", "accepted_answers": [{"value": "Frau Berger möchte einen Kaffee.", "status": "correct"}, {"value": "Frau Berger moechte einen Kaffee.", "status": "correct"}], "feedback": "*Möchte* second."}
  de.a2.unit106.lesson05.exercise06.diktat_rechnung: {"instruction": "Type what you hear.", "correct_response": "Könnten Sie mir bitte die Rechnung bringen?", "orthography_strict": true, "feedback": "You heard *Könnten Sie mir bitte die Rechnung bringen?*"}
  de.a2.unit106.lesson05.exercise07.diktat_tuer: {"instruction": "Type what you hear.", "correct_response": "Soll ich die Tür aufmachen?", "orthography_strict": true, "feedback": "You heard *Soll ich die Tür aufmachen?*"}
  de.a2.unit106.lesson06.exercise01.hoeren_frage: {"instruction": "Listen and select Anna's opening question.", "correct_option": "Guten Tag! Kann ich Ihnen helfen?", "distractors": ["Guten Tag! Kann ich Sie helfen?", "Guten Tag! Können Sie mir helfen?", "Guten Tag! Soll ich Ihnen helfen?"], "accepted_answers": [{"value": "Guten Tag! Kann ich Ihnen helfen?", "status": "correct"}], "feedback": "Anna opens with *Guten Tag! Kann ich Ihnen helfen?*"}
  de.a2.unit106.lesson06.exercise02.verstehen_zeitung: {"instruction": "Listen to the dialogue and choose the answer.", "correct_option": "The newspaper.", "distractors": ["The bill.", "The menu.", "A cake."], "accepted_answers": [{"value": "The newspaper.", "status": "correct"}], "feedback": "Frau Berger asks for the newspaper."}
  de.a2.unit106.lesson06.exercise03.paare_dialog: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Kann ich Ihnen helfen?", "right": "Can I help you?"}, {"left": "Ich hätte gern einen Kaffee, bitte.", "right": "I would like a coffee, please."}, {"left": "Möchten Sie auch einen Kuchen?", "right": "Would you also like a cake?"}, {"left": "Nein, danke.", "right": "No, thank you."}, {"left": "Könnten Sie mir die Zeitung bringen?", "right": "Could you bring me the newspaper?"}, {"left": "Das ist sehr nett von Ihnen.", "right": "That is very kind of you."}], "status": "correct"}], "feedback": "The dialogue in sentences."}
