teaching:
  de.a2.unit95.lesson01.teach.das_wochenende_letztes:
    title: The weekend / last weekend
    gloss: the weekend / last weekend (the one that just ended)
    note: '*Das Wochenende* is neuter. *Letztes Wochenende* means the weekend that has just passed, so it is the natural phrase for ''last weekend'' when you tell a story about it.'
    example_gloss:
    - The weekend starts on Saturday.
    - Last weekend I worked.
  de.a2.unit95.lesson01.teach.samstag_sonntag:
    title: Saturday and Sunday
    gloss: Saturday / Sunday
    note: 'Day names are nouns, so they are capitalised in German: *Samstag*, *Sonntag*. *Am Samstag* means ''on Saturday''. Adverbs such as *sonntags* (''on Sundays'') are written in lower case.'
    example_gloss:
    - On Saturday I'm free.
    - On Sundays I sleep in.
  de.a2.unit95.lesson01.teach.einkaeufe_machen:
    title: Doing errands
    gloss: to do the shopping / run errands
    note: '*Einkäufe machen* is the fixed phrase for doing the shopping and small errands. *Einkäufe* is plural and is used without an article.'
    example_gloss: Every Saturday I do the shopping.
  de.a2.unit95.lesson01.teach.jemanden_besuchen:
    title: Going to visit someone
    gloss: to go and visit (someone)
    note: '*Besuchen* takes a direct object: *Ich besuche meinen Onkel*. The *be-* at the start matters later: this verb forms its Partizip II without *ge-*.'
    example_gloss: I often go and visit my uncle.
  de.a2.unit95.lesson01.teach.der_markt_der:
    title: Places to go at the weekend
    gloss: the market / the park / the cinema
    note: '*Der Markt* and *der Park* are masculine; *das Kino* is neuter. Going to a place of this kind often takes *auf* or *in*: *auf den Markt gehen*, *ins Kino gehen*.'
    example_gloss:
    - I buy vegetables at the market.
    - I like walking in the park.
    - On Saturday I'm going to the cinema.
  de.a2.unit95.lesson01.teach.arbeiten_kochen_essen:
    title: Four everyday verbs
    gloss: to work / to cook / to eat / to drink
    note: These are the infinitives. Later in this unit you will build their past forms.
    example_gloss:
    - I have to work today.
    - I can cook well.
    - I'd like to eat.
    - Would you like to drink coffee?
  de.a2.unit95.lesson01.teach.was_hast_du:
    title: Asking what someone did last weekend
    gloss: What did you do last weekend?
    note: This is the standard question. *Gemacht* is the Partizip II of *machen*, and it sits at the very end of the sentence.
  de.a2.unit95.lesson01.teach.samstag_habe_ich:
    title: 'The Perfekt: haben/sein + Partizip II'
    gloss: On Saturday I did the shopping. On Sunday I went to my uncle's.
    note: 'The *Perfekt* is the everyday way to talk about what you did. It has two parts: a form of *haben* or *sein* in second place, and the *Partizip II* (*gemacht*, *gegangen*) at the very end. Everything else (a day, an object, a place) goes in between, so the two verb parts frame the sentence (the *Satzklammer*): *Samstag habe ich Einkäufe gemacht.* Most verbs use *haben*; *gehen* uses *sein*. Lesson 3 explains when.'
  de.a2.unit95.lesson02.teach.tanzen_spielen_trainieren:
    title: Four weekend activities
    gloss: to dance / to play / to train / to paint
    note: '*Spielen* is used for games, for sports with a ball and for instruments: *Fußball spielen*. *Trainieren* means to train or work out, and *malen* means to paint.'
    example_gloss:
    - Shall we go for a walk?
    - Tomorrow I'm going to cycle.
    - The children want to play outside.
    - I want to exercise more often.
  de.a2.unit95.lesson02.teach.arbeiten_gearbeitet_kochen:
    title: 'Regular participles: ge- + stem + -t'
    gloss: work → worked, cook → cooked, paint → painted, play → played, dance → danced
    note: 'Regular (weak) verbs build the Partizip II as *ge-* + the stem + *-t*: *kochen → gekocht*, *spielen → gespielt*, *tanzen → getanzt*, *malen → gemalt*. If the stem ends in *-t* or *-d*, add *-et* so that the word can still be pronounced: *arbeiten → gearbeitet*. Auxiliary and participle stay apart: *Ich habe gekocht.*'
  de.a2.unit95.lesson02.teach.ich_trainiere_ich:
    title: Verbs ending in -ieren
    gloss: I exercise. I have exercised / I exercised.
    note: 'Verbs ending in *-ieren* get no *ge-*: *trainieren → trainiert*, not *getrainiert*. The same is true for verbs with an unstressed prefix such as *be-*, *ent-* or *er-* (see lesson 3).'
  de.a2.unit95.lesson02.teach.ich_habe_im:
    title: Walking in the park
    gloss: I walked in the park.
    note: '*Einen Spaziergang machen* is the fixed phrase for taking a walk. Like *machen* on its own it uses *haben*: *Ich habe einen Spaziergang gemacht.*'
  de.a2.unit95.lesson02.teach.ich_habe_fussball:
    title: Playing football
    gloss: I played football.
    note: 'Games and sports with a ball take *spielen*: *Fußball spielen → ich habe Fußball gespielt*.'
  de.a2.unit95.lesson03.teach.haben_sein:
    title: The two auxiliaries
    gloss: to have / to be
    note: 'In the Perfekt, *haben* and *sein* are the helper verbs. Their present forms: *ich habe, ich bin*; *er hat, er ist*; *du hast, du bist*.'
    example_gloss:
    - I'd like to have a bike too.
    - It can be fun.
  de.a2.unit95.lesson03.teach.sehen_gesehen_lesen:
    title: 'Irregular participles: learn them as whole words'
    gloss: see → seen, read → read, sleep → slept, eat → eaten, drink → drunk, take → taken, bring → brought
    note: 'Strong and irregular verbs do not follow the *ge-* + stem + *-t* rule. Most keep *ge-* and end in *-en*, often with a changed stem vowel: *gesehen, gelesen, geschlafen, gegessen, getrunken, genommen*. A few, like *bringen → gebracht*, end in *-t* but change inside. If a participle is not simply *ge-* + stem + *-t*, learn it as a whole word.'
  de.a2.unit95.lesson03.teach.ich_habe_einen:
    title: Watching a film
    gloss: I saw a film.
    note: 'German says *einen Film sehen* for going to the cinema or watching at home. *Sehen* uses *haben*: *Ich habe einen Film gesehen.*'
  de.a2.unit95.lesson03.teach.ich_habe_lange:
    title: Two participles in one sentence
    gloss: I slept for a long time and read a book.
    note: 'With two actions and the same *habe*, you can leave the second *habe* out: *Ich habe lange geschlafen und ein Buch gelesen.* *Lange* is the adverb for ''for a long time''.'
  de.a2.unit95.lesson03.teach.ich_habe_meinen:
    title: A participle without ge-
    gloss: I visited my uncle.
    note: 'Verbs with an unstressed prefix such as *be-*, *ent-* or *er-* get no *ge-*: *besuchen → besucht* (to visit). *Ich habe meinen Onkel besucht* and *Ich bin bei meinem Onkel gewesen* mean nearly the same.'
  de.a2.unit95.lesson03.teach.ich_habe_einen_2:
    title: Haben or sein?
    gloss: I saw a film. I went to my uncle's. I stayed at home. I was at my uncle's. It got late.
    note: '*Haben* is the default helper: *Ich habe gearbeitet, ich habe einen Film gesehen*. Use *sein* for two groups: (1) verbs of moving from one place to another, such as *gehen* and *kommen*, and (2) verbs of being or changing, such as *sein, bleiben, werden*. Quick test: does the verb mean going or coming somewhere, staying, being or becoming? Then *sein*. Note that *es* takes *ist*: *Es ist spät geworden* (It got late). Here the helper agrees with the subject: *ich bin, du bist, er ist*.'
  de.a2.unit95.lesson03.teach.gehen_gegangen_kommen:
    title: Verbs of movement and change (with sein)
    gloss: go → gone, come → come, stay → stayed, become → become, be → been
    note: 'These five verbs form their Perfekt with *sein*: *ich bin gegangen, ich bin gekommen, ich bin geblieben, es ist geworden, ich bin gewesen*. All five have irregular participles.'
  de.a2.unit95.lesson04.teach.zuerst_danach:
    title: First and then
    gloss: first / after that
    note: '*Zuerst* and *danach* put actions in order. They are the connectors you need to tell a weekend story in sequence.'
    example_gloss:
    - First I work, then I go and exercise.
    - First I eat, then I drink coffee.
  de.a2.unit95.lesson04.teach.zuerst_bin_ich:
    title: 'Telling it in order: zuerst, danach'
    gloss: First I went to the market, then I cooked.
    note: 'After *zuerst* or *danach* the helper verb stays in second place, so it comes before *ich*: *Danach habe ich gekocht*, not *Danach ich habe gekocht*. The participle stays at the end of each clause.'
  de.a2.unit95.lesson04.teach.ich_habe_nicht:
    title: 'Saying what you did not do: nicht'
    gloss: I didn't work. I didn't read the book. I didn't go to my uncle's.
    note: 'In the Perfekt, *nicht* usually goes in front of the participle: *Ich habe nicht gearbeitet*. If the sentence has a specific object (*das Buch*), the object comes first and *nicht* follows it: *Ich habe das Buch nicht gelesen*. Before a place or direction, *nicht* goes in front of it: *Ich bin nicht zu meinem Onkel gegangen*. The participle stays last.'
  de.a2.unit95.lesson04.teach.ich_habe_keinen:
    title: 'Saying you had none: kein'
    gloss: I didn't drink any coffee. I didn't have time.
    note: 'Use *kein* to negate a noun that has *ein* or no article: *einen Film → keinen Film*, *Kaffee → keinen Kaffee*, *Zeit → keine Zeit*. It takes the endings of *ein*, so it changes with gender and case (*keinen* for masculine objects). Use *nicht* for verbs, specific things (*das Buch*) and places. *Gehabt* is the participle of *haben*.'
  de.a2.unit95.lesson04.teach.hast_du_trainiert:
    title: Anna asks about exercise
    gloss: 'Anna: Did you exercise?'
    note: 'In a yes/no question the helper verb comes first: *Hast du trainiert?*'
  de.a2.unit95.lesson04.teach.nein_ich_habe:
    title: Felix says no
    gloss: 'Felix: No, I didn''t exercise.'
  de.a2.unit95.lesson05.teach.hallo_anna_es:
    title: A message from Nina
    gloss: Hi Anna! It was a quiet weekend. On Saturday morning I went to the market and bought bread. In the afternoon I walked in the park. In the evening I cooked. I didn't exercise and I didn't see a film. On Sunday I stayed at home. I slept for a long time and read a book.
    note: 'Nina is telling Anna about her weekend in order: Saturday morning, afternoon and evening, then Sunday. Notice where the participle goes in every clause: always at the end. *Nachmittags* and *abends* mean ''in the afternoon'' and ''in the evening''. For ''was'' she uses *war*, the simple past of *sein*, which is more usual than the Perfekt in speech.'
    glosses:
      Hallo: hi
      ruhiges: quiet, calm
      Wochenende: weekend
      war: was (simple past of sein)
      Samstagvormittag: Saturday morning
      Markt: market
      Brot: bread
      gekauft: bought (participle of kaufen)
      Nachmittags: in the afternoon
      Park: park
      Spaziergang: walk, stroll (einen Spaziergang machen = to take a walk)
      Abends: in the evening
      gekocht: cooked (participle of kochen)
      nicht: not
      trainiert: trained, exercised (participle of trainieren)
      keinen: no, not any
      Film: film
      gesehen: seen (participle of sehen)
      Sonntag: Sunday
      geblieben: stayed (participle of bleiben)
      lange: long, for a long time
      geschlafen: slept (participle of schlafen)
      Buch: book
      gelesen: read (participle of lesen)
  de.a2.unit95.lesson06.teach.hallo_felix_was:
    title: Anna asks Felix about his weekend
    gloss: 'Anna: Hi Felix! What did you do last weekend?'
  de.a2.unit95.lesson06.teach.samstag_bin_ich:
    title: Felix describes Saturday
    gloss: 'Felix: On Saturday I went to my uncle''s in Hamburg. I ate at my uncle''s.'
    note: '*Bei meinem Onkel* means ''at my uncle''s place'', *zu meinem Onkel* is the direction. Both take the dative. *Gefahren* (from *fahren*) is the participle of travelling by vehicle and also uses *sein*.'
  de.a2.unit95.lesson06.teach.schoen_und_sonntag:
    title: Anna asks about Sunday
    gloss: 'Anna: Nice! And Sunday?'
  de.a2.unit95.lesson06.teach.sonntag_bin_ich:
    title: Felix describes Sunday and asks back
    gloss: 'Felix: On Sunday I stayed at home. I slept for a long time and I didn''t exercise. And you?'
  de.a2.unit95.lesson06.teach.ich_bin_zu:
    title: Anna describes her weekend
    gloss: 'Anna: I went to my parents''. I didn''t do any shopping, but I cooked.'
