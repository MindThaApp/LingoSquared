review: {"status": "unreviewed", "required_next_reviewer": "native_speaker_review", "notes": "English overlay for the advice unit (sollen, sollte, ich wuerde, imperatives, reacting to advice). OPEN NATIVE QUESTIONS: none beyond the realization notes."}
course:
  title: "German A2"
  description: "Grammar-led A2 German continuing the Anna and Felix storyline."
  learning_goal: "Make predictions, follow rules, state what you can do, ask politely, give advice and talk about habits in German."
units:
  de.a2.unit107.ratschlaege: {"title": "What Should I Do?", "description": "Describe a small problem, give simple advice with sollte and ich würde, and respond to advice."}
lessons:
  de.a2.unit107.lesson01.problem: {"title": "I Have a Problem"}
  de.a2.unit107.lesson02.du_solltest: {"title": "You Should Sleep More"}
  de.a2.unit107.lesson03.ich_wuerde: {"title": "I Would Go to the Doctor"}
  de.a2.unit107.lesson04.reagieren: {"title": "Good Idea!"}
  de.a2.unit107.lesson05.jonas_pruefung: {"title": "Jonas Has an Exam"}
  de.a2.unit107.lesson06.nina_rat: {"title": "Nina Gives Advice"}
teaching:
  de.a2.unit107.lesson01.teach.probleme: {"title": "Small problems", "gloss": "problem / headache / tired / little money / exam / to do", "example_gloss": ["I have a headache.", "I am tired.", "I have little money.", "Tomorrow I have an exam."], "note": "Use *haben* for headaches, money and exams; use *sein* for *müde*."}
  de.a2.unit107.lesson01.teach.gn_sollen: {"title": "Sollen: should, be supposed to", "gloss": "I should, you should, he should, we should, you (plural) should, they should", "note": "*Sollen* works like other modal verbs: no ending in *ich* and *er*."}
  de.a2.unit107.lesson01.teach.gn_frage: {"title": "Asking what to do", "gloss": "I have a problem. What should I do?", "note": "*Was soll ich tun?* asks for advice. The infinitive *tun* stands last."}
  de.a2.unit107.lesson01.teach.gn_haben_sein: {"title": "Haben or sein?", "gloss": "I have a headache. I am tired.", "note": "Nouns after *haben* (*Kopfschmerzen*, *Geld*), adjectives after *sein* (*müde*)."}
  de.a2.unit107.lesson02.teach.tipps: {"title": "Advice words", "gloss": "to sleep / to drink / doctor / earlier / to go to bed / more / less / coffee / water / a lot", "example_gloss": ["You should sleep more.", "You should drink a lot of water.", "You should go to the doctor.", "You should go to bed earlier.", "You should drink less coffee."], "note": "Typical tips for health and study."}
  de.a2.unit107.lesson02.teach.gn_sollte: {"title": "Sollte: soft advice", "gloss": "I should, you should, he should, we should, you (plural) should, they should", "note": "*Sollte* is the polite, soft form for advice. It has *-te* endings: *du solltest*, *wir sollten*."}
  de.a2.unit107.lesson02.teach.gn_rat: {"title": "Giving advice", "gloss": "You should sleep more. You shouldn't go to bed so late.", "note": "The verb *solltest* is second; the infinitive is at the end. *Nicht* stands before the last part."}
  de.a2.unit107.lesson02.teach.gn_sie: {"title": "Advice to a stranger", "gloss": "You should go to the doctor.", "note": "With *Sie* the form is *Sie sollten*."}
  de.a2.unit107.lesson03.teach.stelle: {"title": "Other ways to advise", "gloss": "in your place / to ask / best / why / today / to study", "example_gloss": ["In your place I would ask Anna.", "I would not study any more today.", "Why don't you go to the doctor?", "It's best if you go today."], "note": "Friendly alternatives to *du solltest*."}
  de.a2.unit107.lesson03.teach.gn_wuerde: {"title": "Ich würde ...", "gloss": "I would go to the doctor. I would go to sleep earlier.", "note": "*Würde* + infinitive tells what you would do. The infinitive is last."}
  de.a2.unit107.lesson03.teach.gn_stelle: {"title": "In your place", "gloss": "In your place I would ask Anna.", "note": "*An deiner Stelle* starts the sentence, so *würde ich* follows."}
  de.a2.unit107.lesson03.teach.gn_warum: {"title": "Why don't you ...?", "gloss": "Why don't you go to the doctor? It's best if you go today.", "note": "These are two friendly suggestions in the present tense. *Am besten* starts the suggestion; the verb is second."}
  de.a2.unit107.lesson04.teach.reaktion: {"title": "Reacting to advice", "gloss": "idea / tip / thanks / good / early", "example_gloss": ["Good idea!", "Thanks for the tip.", "I'll do that.", "Go to bed early!"], "note": "Short reactions."}
  de.a2.unit107.lesson04.teach.gn_reaktion: {"title": "Saying yes to advice", "gloss": "Good idea! Thanks for the tip. I'll do that.", "note": "*Das mache ich* is a friendly promise to follow the advice."}
  de.a2.unit107.lesson04.teach.gn_imperativ: {"title": "A direct tip: the imperative", "gloss": "Drink more water! Go to bed early!", "note": "Among friends, an advice can be a short command. For *du*, use the verb stem without *du*: *trink*, *geh*."}
  de.a2.unit107.lesson04.teach.gn_nein: {"title": "Saying why not", "gloss": "I'm afraid that's not possible. I have no time.", "note": "If the advice does not work, say so politely."}
  de.a2.unit107.lesson05.teach.pruefung: {"title": "Words for the story", "gloss": "to have / and / to say", "example_gloss": ["Jonas has an exam tomorrow.", "He is tired and has a headache.", "Anna says: You should go to bed earlier."], "note": "Words for the story you will read."}
  de.a2.unit107.lesson05.teach.gn_text: {"title": "Different pieces of advice", "gloss": "Anna says: You should go to bed earlier. Felix says: In your place I would not study any more.", "note": "Find the three pieces of advice in the text."}
  de.a2.unit107.lesson05.teach.lesen_jonas: {"title": "Jonas's problem", "gloss": "Jonas has an exam tomorrow. He is tired and has a headache. He has a problem. Anna says: You should go to bed earlier. Nina says: You should drink a lot of water. Felix says: In your place I would not study any more today. Jonas says: Good idea! Thanks for the tip.", "note": "A problem, three pieces of advice and a reaction."}
  de.a2.unit107.lesson06.teach.nina_wie: {"title": "Nina greets Jonas", "gloss": "Nina: Hi Jonas! How are you?"}
  de.a2.unit107.lesson06.teach.jonas_nicht: {"title": "Jonas explains", "gloss": "Jonas: Not so good. I have a headache and an exam tomorrow."}
  de.a2.unit107.lesson06.teach.nina_wasser: {"title": "Nina gives a tip", "gloss": "Nina: You should drink a lot of water."}
  de.a2.unit107.lesson06.teach.jonas_idee: {"title": "Jonas asks for more", "gloss": "Jonas: Good idea! What else should I do?"}
  de.a2.unit107.lesson06.teach.nina_bett: {"title": "Nina gives another tip", "gloss": "Nina: In your place I would go to bed early."}
  de.a2.unit107.lesson06.teach.jonas_tipp: {"title": "Jonas thanks her", "gloss": "Jonas: Thanks for the tip. I'll do that."}
exercises:
  de.a2.unit107.lesson01.exercise01.wahl_kopf: {"instruction": "Choose the correct German sentence.", "correct_option": "Ich habe Kopfschmerzen.", "distractors": ["Ich bin Kopfschmerzen.", "Ich habe Kopfschmerzen sind.", "Ich habe mich Kopfschmerzen."], "accepted_answers": [{"value": "Ich habe Kopfschmerzen.", "status": "correct"}], "feedback": "*Haben* + *Kopfschmerzen*."}
  de.a2.unit107.lesson01.exercise02.wahl_soll: {"instruction": "Choose the correct German sentence.", "correct_option": "Was soll ich tun?", "distractors": ["Was sollen ich tun?", "Was soll ich tut?", "Was ich soll tun?"], "accepted_answers": [{"value": "Was soll ich tun?", "status": "correct"}], "feedback": "*Was soll ich tun?*"}
  de.a2.unit107.lesson01.exercise03.paare_sollen: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "ich soll", "right": "I should"}, {"left": "du sollst", "right": "you should"}, {"left": "er soll", "right": "he should"}, {"left": "wir sollen", "right": "we should"}, {"left": "ihr sollt", "right": "you (plural) should"}, {"left": "sie sollen", "right": "they should"}], "status": "correct"}], "feedback": "sollen: soll, sollst, soll, sollen, sollt, sollen."}
  de.a2.unit107.lesson01.exercise04.ordnen_wir: {"instruction": "Put the words in order to say 'What should we do?'", "correct_option": "Was sollen wir tun", "accepted_answers": [{"value": "Was sollen wir tun", "status": "correct"}], "feedback": "*Sollen* with *wir*."}
  de.a2.unit107.lesson01.exercise05.luecke_bin: {"instruction": "Complete with haben or sein.", "correct_option": "bin", "accepted_answers": [{"value": "bin", "status": "correct"}], "feedback": "*Müde* is an adjective, so *sein*."}
  de.a2.unit107.lesson01.exercise06.uebersetzen_geld: {"instruction": "Translate into German.", "accepted_answers": [{"value": "Ich habe wenig Geld.", "status": "correct"}], "feedback": "*Wenig Geld*."}
  de.a2.unit107.lesson01.exercise07.schreiben_pruefung: {"instruction": "Write the requested German sentence.", "correct_option": "Morgen habe ich eine Prüfung.", "accepted_answers": [{"value": "Morgen habe ich eine Prüfung.", "status": "correct"}, {"value": "Morgen habe ich eine Pruefung.", "status": "correct"}, {"value": "Ich habe morgen eine Prüfung.", "status": "correct"}, {"value": "Ich habe morgen eine Pruefung.", "status": "correct"}], "feedback": "*Habe ich* after the time word."}
  de.a2.unit107.lesson02.exercise01.wahl_schlafen: {"instruction": "Choose the correct German sentence.", "correct_option": "Du solltest mehr schlafen.", "distractors": ["Du sollte mehr schlafen.", "Du solltest mehr geschlafen.", "Du solltest schlafen mehr."], "accepted_answers": [{"value": "Du solltest mehr schlafen.", "status": "correct"}], "feedback": "*Solltest* + infinitive."}
  de.a2.unit107.lesson02.exercise02.wahl_arzt: {"instruction": "Choose the correct German sentence.", "correct_option": "Du solltest zum Arzt gehen.", "distractors": ["Du solltest zu Arzt gehen.", "Du solltest zum Arzt gegangen.", "Du solltest gehen zum Arzt."], "accepted_answers": [{"value": "Du solltest zum Arzt gehen.", "status": "correct"}], "feedback": "*Zum Arzt* = to the doctor."}
  de.a2.unit107.lesson02.exercise03.paare_sollte: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "ich sollte schlafen", "right": "I should sleep"}, {"left": "du solltest schlafen", "right": "you should sleep"}, {"left": "er sollte schlafen", "right": "he should sleep"}, {"left": "wir sollten schlafen", "right": "we should sleep"}, {"left": "ihr solltet schlafen", "right": "you (plural) should sleep"}, {"left": "Sie sollten zum Arzt gehen.", "right": "You should go to the doctor."}], "status": "correct"}], "feedback": "sollte, solltest, sollte, sollten, solltet, sollten."}
  de.a2.unit107.lesson02.exercise04.ordnen_wasser: {"instruction": "Put the words in order to say 'You should drink a lot of water.'", "correct_option": "Du solltest viel Wasser trinken", "accepted_answers": [{"value": "Du solltest viel Wasser trinken", "status": "correct"}], "feedback": "*Trinken* last."}
  de.a2.unit107.lesson02.exercise05.luecke_solltest: {"instruction": "Complete with the correct form of sollte.", "correct_option": "solltest", "accepted_answers": [{"value": "solltest", "status": "correct"}], "feedback": "*Du solltest*."}
  de.a2.unit107.lesson02.exercise06.uebersetzen_bett: {"instruction": "Translate into German.", "accepted_answers": [{"value": "Du solltest früher ins Bett gehen.", "status": "correct"}, {"value": "Du solltest frueher ins Bett gehen.", "status": "correct"}], "feedback": "*Ins Bett gehen*."}
  de.a2.unit107.lesson02.exercise07.schreiben_kaffee: {"instruction": "Write the requested German sentence.", "correct_option": "Du solltest weniger Kaffee trinken.", "accepted_answers": [{"value": "Du solltest weniger Kaffee trinken.", "status": "correct"}], "feedback": "*Weniger* = less."}
  de.a2.unit107.lesson03.exercise01.wahl_wuerde: {"instruction": "Choose the correct German sentence.", "correct_option": "Ich würde zum Arzt gehen.", "distractors": ["Ich würde zum Arzt gehe.", "Ich würde zum Arzt gegangen.", "Ich würde gehen zum Arzt."], "accepted_answers": [{"value": "Ich würde zum Arzt gehen.", "status": "correct"}, {"value": "Ich wuerde zum Arzt gehen.", "status": "correct"}], "feedback": "*Würde* + infinitive."}
  de.a2.unit107.lesson03.exercise02.wahl_stelle: {"instruction": "Choose the correct German sentence.", "correct_option": "An deiner Stelle würde ich Anna fragen.", "distractors": ["An deiner Stelle ich würde Anna fragen.", "An deiner Stelle würde ich Anna gefragt.", "An deine Stelle würde ich Anna fragen."], "accepted_answers": [{"value": "An deiner Stelle würde ich Anna fragen.", "status": "correct"}, {"value": "An deiner Stelle wuerde ich Anna fragen.", "status": "correct"}], "feedback": "*An deiner Stelle würde ich ...*"}
  de.a2.unit107.lesson03.exercise03.paare_rat: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Ich würde zum Arzt gehen.", "right": "I would go to the doctor."}, {"left": "An deiner Stelle würde ich Anna fragen.", "right": "In your place I would ask Anna."}, {"left": "Warum gehst du nicht zum Arzt?", "right": "Why don't you go to the doctor?"}, {"left": "Am besten gehst du heute.", "right": "It's best if you go today."}, {"left": "Ich würde heute nicht mehr lernen.", "right": "I would not study any more today."}, {"left": "Du solltest mehr schlafen.", "right": "You should sleep more."}], "status": "correct"}], "feedback": "Different ways of advising."}
  de.a2.unit107.lesson03.exercise04.ordnen_warum: {"instruction": "Put the words in order to say 'Why don't you go to the doctor?'", "correct_option": "Warum gehst du nicht zum Arzt", "accepted_answers": [{"value": "Warum gehst du nicht zum Arzt", "status": "correct"}], "feedback": "Question word first, verb second."}
  de.a2.unit107.lesson03.exercise05.luecke_wuerde: {"instruction": "Complete with the correct form.", "correct_option": "würde", "accepted_answers": [{"value": "würde", "status": "correct"}, {"value": "wuerde", "status": "correct"}], "feedback": "*Ich würde*."}
  de.a2.unit107.lesson03.exercise06.uebersetzen_besten: {"instruction": "Translate into German.", "accepted_answers": [{"value": "Am besten gehst du heute.", "status": "correct"}], "feedback": "*Am besten* starts the sentence."}
  de.a2.unit107.lesson03.exercise07.schreiben_lernen: {"instruction": "Write the requested German sentence.", "correct_option": "Ich würde heute nicht mehr lernen.", "accepted_answers": [{"value": "Ich würde heute nicht mehr lernen.", "status": "correct"}, {"value": "Ich wuerde heute nicht mehr lernen.", "status": "correct"}, {"value": "Heute würde ich nicht mehr lernen.", "status": "correct"}, {"value": "Heute wuerde ich nicht mehr lernen.", "status": "correct"}], "feedback": "*Nicht mehr* = no more."}
  de.a2.unit107.lesson04.exercise01.wahl_tipp: {"instruction": "Choose the correct German sentence.", "correct_option": "Danke für den Tipp.", "distractors": ["Danke für der Tipp.", "Danke zu den Tipp.", "Danke für den Tipps."], "accepted_answers": [{"value": "Danke für den Tipp.", "status": "correct"}, {"value": "Danke fuer den Tipp.", "status": "correct"}], "feedback": "*Für* + accusative: *den Tipp*."}
  de.a2.unit107.lesson04.exercise02.wahl_trink: {"instruction": "Choose the correct German sentence.", "correct_option": "Trink mehr Wasser!", "distractors": ["Trinkst mehr Wasser!", "Du trink mehr Wasser!", "Trinken mehr Wasser!"], "accepted_answers": [{"value": "Trink mehr Wasser!", "status": "correct"}], "feedback": "The du-imperative has no ending and no *du*."}
  de.a2.unit107.lesson04.exercise03.paare_reaktion: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Gute Idee!", "right": "Good idea!"}, {"left": "Danke für den Tipp.", "right": "Thanks for the tip."}, {"left": "Das mache ich.", "right": "I'll do that."}, {"left": "Geh früh ins Bett!", "right": "Go to bed early!"}, {"left": "Trink mehr Wasser!", "right": "Drink more water!"}, {"left": "Das geht leider nicht.", "right": "I'm afraid that's not possible."}], "status": "correct"}], "feedback": "Giving and receiving a tip."}
  de.a2.unit107.lesson04.exercise04.ordnen_geh: {"instruction": "Put the words in order to say 'Go to bed early!'", "correct_option": "Geh früh ins Bett", "accepted_answers": [{"value": "Geh früh ins Bett", "status": "correct"}], "feedback": "Imperative first."}
  de.a2.unit107.lesson04.exercise05.luecke_idee: {"instruction": "Complete the reaction.", "correct_option": "Idee", "accepted_answers": [{"value": "Idee", "status": "correct"}], "feedback": "*Idee* is feminine: *gute Idee*."}
  de.a2.unit107.lesson04.exercise06.uebersetzen_mache: {"instruction": "Translate into German.", "accepted_answers": [{"value": "Das mache ich.", "status": "correct"}], "feedback": "*Das* comes first, *mache ich* follows."}
  de.a2.unit107.lesson04.exercise07.schreiben_danke: {"instruction": "Write the requested German sentence.", "correct_option": "Danke für den Tipp. Das mache ich.", "accepted_answers": [{"value": "Danke für den Tipp. Das mache ich.", "status": "correct"}, {"value": "Danke fuer den Tipp. Das mache ich.", "status": "correct"}], "feedback": "Thanks and promise."}
  de.a2.unit107.lesson05.exercise01.lesen_problem: {"instruction": "Read the text and choose the answer.", "correct_option": "He has an exam and a headache.", "distractors": ["He has no money.", "He lost his key.", "He missed the train."], "accepted_answers": [{"value": "He has an exam and a headache.", "status": "correct"}], "feedback": "*Jonas hat morgen eine Prüfung. Er ist müde und hat Kopfschmerzen.*"}
  de.a2.unit107.lesson05.exercise02.lesen_felix: {"instruction": "Read the text and choose the answer.", "correct_option": "Not to study any more today.", "distractors": ["To drink more water.", "To go to bed earlier.", "To go to the doctor."], "accepted_answers": [{"value": "Not to study any more today.", "status": "correct"}], "feedback": "*Felix würde heute nicht mehr lernen.*"}
  de.a2.unit107.lesson05.exercise03.paare_jonas: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Jonas hat morgen eine Prüfung.", "right": "Jonas has an exam tomorrow."}, {"left": "Er ist müde und hat Kopfschmerzen.", "right": "He is tired and has a headache."}, {"left": "Du solltest früher ins Bett gehen.", "right": "You should go to bed earlier."}, {"left": "Du solltest viel Wasser trinken.", "right": "You should drink a lot of water."}, {"left": "Ich würde heute nicht mehr lernen.", "right": "I would not study any more today."}, {"left": "Gute Idee! Danke für den Tipp.", "right": "Good idea! Thanks for the tip."}], "status": "correct"}], "feedback": "Match the lines of the story."}
  de.a2.unit107.lesson05.exercise04.ordnen_bett: {"instruction": "Put the words in order to say 'You should go to bed earlier.'", "correct_option": "Du solltest früher ins Bett gehen", "accepted_answers": [{"value": "Du solltest früher ins Bett gehen", "status": "correct"}], "feedback": "*Gehen* last."}
  de.a2.unit107.lesson05.exercise05.uebersetzen_jonas: {"instruction": "Translate into German.", "accepted_answers": [{"value": "Jonas ist müde und hat Kopfschmerzen.", "status": "correct"}, {"value": "Jonas ist muede und hat Kopfschmerzen.", "status": "correct"}], "feedback": "*Ist* + adjective, *hat* + noun."}
  de.a2.unit107.lesson05.exercise06.diktat_wasser: {"instruction": "Type what you hear.", "correct_response": "Du solltest viel Wasser trinken.", "orthography_strict": true, "feedback": "You heard *Du solltest viel Wasser trinken.*"}
  de.a2.unit107.lesson05.exercise07.diktat_lernen: {"instruction": "Type what you hear.", "correct_response": "Ich würde heute nicht mehr lernen.", "orthography_strict": true, "feedback": "You heard *Ich würde heute nicht mehr lernen.*"}
  de.a2.unit107.lesson06.exercise01.hoeren_frage: {"instruction": "Listen and select Nina's opening question.", "correct_option": "Hallo Jonas! Wie geht es dir?", "distractors": ["Hallo Jonas! Wie geht es Ihnen?", "Hallo Nina! Wie geht es dir?", "Hallo Jonas! Was soll ich tun?"], "accepted_answers": [{"value": "Hallo Jonas! Wie geht es dir?", "status": "correct"}], "feedback": "Nina opens with *Hallo Jonas! Wie geht es dir?*"}
  de.a2.unit107.lesson06.exercise02.verstehen_rat: {"instruction": "Listen to the dialogue and choose the answer.", "correct_option": "To drink a lot of water.", "distractors": ["To go to the doctor.", "To study more.", "To drink less coffee."], "accepted_answers": [{"value": "To drink a lot of water.", "status": "correct"}], "feedback": "Nina says: *Du solltest viel Wasser trinken.*"}
  de.a2.unit107.lesson06.exercise03.paare_dialog: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Wie geht es dir?", "right": "How are you?"}, {"left": "Nicht so gut.", "right": "Not so good."}, {"left": "Ich habe Kopfschmerzen und morgen eine Prüfung.", "right": "I have a headache and an exam tomorrow."}, {"left": "Du solltest viel Wasser trinken.", "right": "You should drink a lot of water."}, {"left": "An deiner Stelle würde ich früh ins Bett gehen.", "right": "In your place I would go to bed early."}, {"left": "Danke für den Tipp.", "right": "Thanks for the tip."}], "status": "correct"}], "feedback": "The dialogue in sentences."}
  de.a2.unit107.lesson06.exercise04.ordnen_noch: {"instruction": "Put the words in order to say 'What else should I do?'", "correct_option": "Was soll ich noch tun", "accepted_answers": [{"value": "Was soll ich noch tun", "status": "correct"}], "feedback": "*Noch* before the infinitive."}
  de.a2.unit107.lesson06.exercise05.antwort_tipp: {"instruction": "Answer in German as Jonas: say it is a good idea and thank her.", "correct_option": "Gute Idee! Danke für den Tipp.", "accepted_answers": [{"value": "Gute Idee! Danke für den Tipp.", "status": "correct"}, {"value": "Gute Idee! Danke fuer den Tipp.", "status": "correct"}, {"value": "Gute Idee!", "status": "correct"}, {"value": "Danke für den Tipp. Das mache ich.", "status": "correct"}, {"value": "Danke fuer den Tipp. Das mache ich.", "status": "correct"}], "feedback": "*Gute Idee! Danke für den Tipp.*"}
  de.a2.unit107.lesson06.exercise06.uebersetzen_stelle: {"instruction": "Translate into German.", "accepted_answers": [{"value": "An deiner Stelle würde ich früh ins Bett gehen.", "status": "correct"}, {"value": "An deiner Stelle wuerde ich frueh ins Bett gehen.", "status": "correct"}], "feedback": "*Würde ich* after the opening phrase."}
  de.a2.unit107.lesson06.exercise07.schreiben_dreisaetze: {"instruction": "Write three German sentences, following the three numbered instructions.", "correct_option": "Ich habe Kopfschmerzen. Du solltest viel Wasser trinken. Danke für den Tipp.", "accepted_answers": [{"value": "Ich habe Kopfschmerzen. Du solltest viel Wasser trinken. Danke für den Tipp.", "status": "correct"}, {"value": "Ich habe Kopfschmerzen. Du solltest viel Wasser trinken. Danke fuer den Tipp.", "status": "correct"}], "feedback": "Problem, advice, thanks."}
