course:
  title: German A1
  description: 'Beginner German for describing a person''s basic physical appearance: height and age impressions, hair and eye colour, the core question Wie sieht ... aus?, and comparing two people''s appearance.'
units:
  de.a1.unit55.aussehen:
    title: Describing appearance
lessons:
  de.a1.unit55.lesson01.gross_klein_alt_und:
    title: Tall, short, old, and young
  de.a1.unit55.lesson02.haare_beschreiben:
    title: Describing hair
  de.a1.unit55.lesson03.augen_und_wie_jemand:
    title: Eyes and what does someone look like?
  de.a1.unit55.lesson04.anna_beschreibt_nina:
    title: Anna describes Nina
  de.a1.unit55.lesson05.jonas_und_lena_im:
    title: Comparing Jonas and Lena
  de.a1.unit55.lesson06.felix_erkennt_nina:
    title: Felix recognizes Nina
teaching:
  de.a1.unit55.lesson01.teach.gross_klein:
    title: Tall and short
    gloss: tall / short
    note: '*Groß* describes a tall person and *klein* a short one. For people German says groß (big), not lang (long).'
    example_gloss:
    - Lena is tall.
    - Jonas is short.
  de.a1.unit55.lesson01.teach.alt_jung:
    title: Old and young
    gloss: old / young
    note: '*Alt* and *jung* here describe a general impression of age, not an exact number of years.'
    example_gloss:
    - Grandpa is old.
    - Felix is young.
  de.a1.unit55.lesson01.teach.alt_kann_eine:
    title: 'Alt: a number or an impression'
    gloss: Alt can go with a number of years, as in Ich bin dreißig Jahre alt, or give a general impression, as in Opa ist alt.
    note: You can ask someone's exact age with *Wie alt bist du?* Here *alt* describes how old someone LOOKS, with no number attached.
  de.a1.unit55.lesson01.teach.lena_ist_gross:
    title: Lena is tall and Jonas is short
    gloss: Lena is tall and Jonas is short.
    note: A simple combined sentence using *und* (and), setting up the direct comparison in lesson 05.
  de.a1.unit55.lesson02.teach.die_haare:
    title: Hair
    gloss: the hair
    note: '*Haare* is a plural noun: *die Haare*. German also has the singular das Haar, but for the hair on your head people usually say Haare.'
    example_gloss: Felix has short black hair.
  de.a1.unit55.lesson02.teach.blond_braun_grau:
    title: Blond, brown, and grey
    gloss: blond / brown / grey
    note: 'Three hair colours: blond, braun, grau. Before a plural noun with no article they take -e: blonde, braune, graue Haare.'
    example_gloss:
    - Anna has blond hair.
    - Jonas has brown hair.
    - Grandpa has grey hair.
  de.a1.unit55.lesson02.teach.lang_kurz:
    title: Long and short (hair)
    gloss: long / short (hair)
    note: '*Kurz* (short) and *lang* (long) describe hair length. The ending -e again: kurze Haare, lange Haare.'
    example_gloss:
    - Lena has long hair.
    - Jonas has short hair.
  de.a1.unit55.lesson02.teach.haare_ist_plural:
    title: Haare takes the ending -e
    gloss: 'Haare is plural and has no article, so the adjective ends in -e: kurze Haare, lange Haare, blonde Haare, braune Haare, graue Haare, schwarze Haare.'
    note: With no article, an adjective before a plural noun takes -e. It is the same pattern as *Augen* in lesson 03.
  de.a1.unit55.lesson02.teach.anna_hat_lange:
    title: 'Ihre: her'
    gloss: 'Ihre means ''her'' here: ihre Haare = her hair. Anna has long hair, and her hair is blond.'
    note: '*Ihre* (small i) is the possessive ''her'' and agrees with the plural noun Haare. With a capital I, *Ihre* means ''your'' (formal).'
  de.a1.unit55.lesson02.teach.felix_hat_kurze:
    title: Felix has short black hair
    gloss: Felix has short black hair.
    note: 'Reuses *schwarz* (black), now for hair: schwarze Haare.'
  de.a1.unit55.lesson02.teach.anna_hat_lange_2:
    title: Anna has long blond hair
    gloss: Anna has long blond hair.
    note: Combines this lesson's length and color vocabulary in one natural sentence.
  de.a1.unit55.lesson03.teach.die_augen:
    title: Eyes
    gloss: the eyes
    note: '*Augen* is the plural of *das Auge*. German usually uses the plural, because we have two eyes.'
    example_gloss: Felix has brown eyes.
  de.a1.unit55.lesson03.teach.blau_braun_gruen:
    title: Blue, brown, and green
    gloss: blue / brown / green
    note: 'Colours: blau (blue), braun (brown) and grün (green).'
    example_gloss:
    - Anna has blue eyes.
    - Jonas has brown eyes.
    - Lena has green eyes.
  de.a1.unit55.lesson03.teach.augen_ist_plural:
    title: Augen takes -e
    gloss: 'Augen is plural, so the adjective ends in -e: blaue Augen, braune Augen, grüne Augen.'
    note: 'Same rule as for Haare: no article plus a plural noun gives the ending -e.'
  de.a1.unit55.lesson03.teach.wie_sieht_anna:
    title: What does Anna look like?
    gloss: What does Anna look like?
    note: '*Wie sieht ... aus?* is this unit''s core question. *Aussehen* is separable: sieht ... aus.'
  de.a1.unit55.lesson03.teach.anna_hat_lange:
    title: Anna has long blond hair and blue eyes
    gloss: Anna has long blond hair and blue eyes.
    note: A model answer combining hair and eyes in one sentence with *und*.
  de.a1.unit55.lesson04.teach.anna_ein_neues:
    title: Anna introduces Nina
    gloss: 'Anna: A new girl is coming to the taalcafé. Her name is Nina.'
    note: '*Ein neues Mädchen kommt* introduces someone new. After *kommt*, the direction *ins* (in das) Sprachcafé takes the accusative.'
  de.a1.unit55.lesson04.teach.felix_okay_wie:
    title: Felix asks what she looks like
    gloss: 'Felix: Okay! What does she look like?'
    note: 'Reuses this unit''s core question, now with *sie* (she) instead of a name: wie sieht sie aus?'
  de.a1.unit55.lesson04.teach.anna_sie_ist:
    title: Anna describes Nina's height and hair
    gloss: 'Anna: She is short and she has short blond hair.'
    note: 'Combines *klein* with the hair vocabulary of lesson 02. The second *sie* is dropped: sie ist klein und hat ...'
  de.a1.unit55.lesson04.teach.felix_und_ihre:
    title: Felix asks about her eyes
    gloss: 'Felix: And her eyes?'
    note: '*Ihre* here means ''her'' (possessive), not a form of ''you''. It agrees with the plural Augen.'
  de.a1.unit55.lesson04.teach.anna_sie_hat:
    title: Anna describes Nina's eyes
    gloss: 'Anna: She has green eyes.'
    note: Reuses *grüne Augen* from lesson 03.
  de.a1.unit55.lesson04.teach.felix_danke_dann:
    title: Felix will recognize her
    gloss: 'Felix: Thanks! Then I''ll recognize her.'
    note: '*Dann erkenne ich sie bestimmt* means ''then I''ll recognise her for sure''. After *dann* the verb comes second: dann erkenne ich sie.'
  de.a1.unit55.lesson05.teach.jonas_und_lena:
    title: Comparing Jonas and Lena
    gloss: Jonas and Lena are brother and sister, but they look different. Jonas is short and has short brown hair and brown eyes. Lena is taller than Jonas and has long brown hair and green eyes. What do you look like?
    note: A short comparison reusing every color/length word taught so far, ending with the unit's core question directed at the reader.
    glosses:
      Bruder: brother
      Schwester: sister
      sehen: look
      unterschiedlich: different
      klein: short
      kurze: short
      braune: brown
      Haare: hair
      Augen: eyes
      größer: taller
      lange: long
      grüne: green
      aus: (part of 'aussehen' = to look/appear)
  de.a1.unit55.lesson05.teach.das_muster_kennst:
    title: The comparative again
    gloss: 'You already know the pattern adjective + -er + als (than). Here you use it for people: Lena is taller than Jonas.'
    note: 'The same *-er + als* pattern as in the comparisons unit. Groß becomes größer: the vowel gets an umlaut.'
  de.a1.unit55.lesson05.teach.lena_hat_laengere:
    title: Lena has longer hair than Jonas
    gloss: Lena has longer hair than Jonas.
    note: '*Längere Haare*: länger takes -e before a plural noun with no article, and lang gets an umlaut in the comparative.'
  de.a1.unit55.lesson05.teach.ich_habe_kurze:
    title: I have short brown hair
    gloss: I have short brown hair.
    note: A model first-person sentence using *Ich habe ...*, ready to reuse when describing your own appearance.
  de.a1.unit55.lesson06.teach.felix_schau_mal:
    title: Felix spots Nina
    gloss: 'Felix: Look, is that Nina? She has short blond hair and green eyes.'
    note: '*Schau mal* (take a look) is a friendly way to point something out. It is the du command form.'
  de.a1.unit55.lesson06.teach.anna_ja_das:
    title: Anna confirms
    gloss: 'Anna: Yes, that''s Nina!'
    note: A short, natural confirmation.
  de.a1.unit55.lesson06.teach.nina_hallo_bist:
    title: Nina greets Felix
    gloss: 'Nina: Hi, are you Felix?'
    note: 'A simple informal question: *bist du ...?* (are you ...?). Bist is the du form of sein.'
  de.a1.unit55.lesson06.teach.felix_ja_freut:
    title: Felix greets Nina back
    gloss: 'Felix: Yes! Nice to meet you, Nina.'
    note: '*Freut mich* is the standard phrase for a first meeting, as in unit 2. For someone you already know you would say *Schön, dich zu sehen*.'
  de.a1.unit55.lesson06.teach.nina_freut_mich:
    title: Nina returns the greeting
    gloss: 'Nina: Nice to meet you too!'
    note: Closes the dialogue -- Felix successfully recognized Nina from Anna's earlier description.
