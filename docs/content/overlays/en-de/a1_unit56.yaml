teaching:
  de.a1.unit56.lesson01.teach.das_tier_das:
    title: Animal, a pet
    gloss: the animal / a pet
    note: '*Tier* is the general word for animal; *Haustier* (literally ''house animal'') means specifically a pet.'
    example_gloss:
    - A dog is an animal.
    - A dog is also a pet.
  de.a1.unit56.lesson01.teach.der_hund_die:
    title: Dog and cat
    gloss: the dog / the cat
    example_gloss:
    - Anna has a dog.
    - Jonas has a cat.
  de.a1.unit56.lesson01.teach.der_fisch_der:
    title: Fish and bird
    gloss: the fish / the bird
    example_gloss:
    - Grandpa has a fish.
    - Nina has a bird.
  de.a1.unit56.lesson01.teach.hast_du_ein:
    title: Do you have a pet?
    gloss: Do you have a pet?
    note: 'The same question pattern *Hast du ...?* you know from earlier units: the verb comes first.'
  de.a1.unit56.lesson01.teach.ja_ich_habe:
    title: Yes, I have a dog
    gloss: Yes, I have a dog.
    note: A simple affirmative answer using this unit's new vocabulary.
  de.a1.unit56.lesson01.teach.nein_ich_habe:
    title: No, I don't have a pet
    gloss: No, I don't have a pet.
    note: '*Kein* negates the noun *ein Haustier*: see the grammar note.'
  de.a1.unit56.lesson01.teach.kein_sagt_nein:
    title: 'Kein: negating a noun'
    gloss: 'Kein says no to a noun that would have ein-: Ich habe einen Hund, but Ich habe kein Haustier.'
    note: '*Kein* replaces *ein* in a negative sentence and takes the same endings: ein Haustier becomes kein Haustier, einen Hund becomes keinen Hund. For verbs and adjectives use *nicht* instead.'
  de.a1.unit56.lesson02.teach.ausfuehren:
    title: To walk (an animal)
    gloss: to walk (an animal)
    note: A separable verb -- see the grammar note.
    example_gloss: I walk the dog every day.
  de.a1.unit56.lesson02.teach.ausfuehren_ist_trennbar:
    title: Ausführen is separable
    gloss: 'Ausführen is separable, just like aufstehen: ich führe den Hund aus.'
    note: Reuses the exact separable-verb pattern (stem +... + prefix at the end) already taught for daily-routine verbs.
  de.a1.unit56.lesson02.teach.futter_geben:
    title: To feed
    gloss: to feed
    example_gloss: I feed the cat every day.
  de.a1.unit56.lesson02.teach.spielen_mit:
    title: To play with
    gloss: to play with
    example_gloss: Jonas plays with his cat.
  de.a1.unit56.lesson02.teach.ich_fuehre_den:
    title: I walk the dog every day
    gloss: I walk the dog every day.
    note: Combines *ausführen* with *jeden Tag* (every day). *Jeden* ends in -en because Tag is masculine and is in the accusative.
  de.a1.unit56.lesson02.teach.ich_gebe_der:
    title: I feed the cat every day
    gloss: I feed the cat every day.
    note: 'Combines *Futter geben* with *jeden Tag*. The animal is in the dative: der Katze (to the cat).'
  de.a1.unit56.lesson03.teach.den_plural_lernst:
    title: 'Plural: Hund -> Hunde'
    gloss: 'German plurals vary: der Hund -> die Hunde, die Katze -> die Katzen, der Vogel -> die Vögel. Learn the plural with each noun.'
    note: The regular German plural pattern, introduced here for the first time with animal nouns as the example set.
  de.a1.unit56.lesson03.teach.hunde_katzen:
    title: Dogs and cats
