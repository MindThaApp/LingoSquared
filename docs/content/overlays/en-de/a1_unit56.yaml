    title: I love dogs. I don't have a pet.
    gloss: I love dogs. I don't have a pet.
    note: A model two-sentence answer, ready to reuse for the unit's writing prompt.
  de.a1.unit56.lesson06.teach.anna_nina_hast:
    title: Anna asks Nina
    gloss: 'Anna: Nina, do you have a pet too?'
  de.a1.unit56.lesson06.teach.nina_ja_ich:
    title: Nina has a bird named Pico
    gloss: 'Nina: Yes, I have a bird. His name is Pico.'
    note: '*Er heißt Pico* reuses the naming verb *heißen* from the very first unit. Er refers to der Vogel.'
  de.a1.unit56.lesson06.teach.felix_wie_schoen:
    title: Felix reacts
    gloss: 'Felix: How nice! What do you do with him every day?'
  de.a1.unit56.lesson06.teach.nina_ich_gebe:
