  de.a1.unit56.lesson04.teach.bei_tieren_zaehlt:
    title: Er/ihn for animals
    gloss: 'For animals the gender of the word decides: der Hund is er (he), die Katze is sie (she).'
    note: 'German pronouns follow the grammatical gender of the noun: der Hund -> er (accusative: ihn), die Katze -> sie, das Tier -> es.'
  de.a1.unit56.lesson04.teach.felix_fuehrst_du:
    title: Felix asks about walks
    gloss: 'Felix: Do you walk him every day?'
  de.a1.unit56.lesson04.teach.anna_ja_ich_2:
    title: Anna describes her routine
    gloss: 'Anna: Yes, I walk him every day and I feed him.'
  de.a1.unit56.lesson05.teach.felix_und_lena:
    title: Felix, Lena, and Jonas on animals
    gloss: 'Felix and Lena both love animals, but neither of them has a pet. Felix loves dogs and Lena loves cats. Jonas does have a pet: a cat. He often plays with his cat and feeds the cat every day. Do you have a pet?'
    note: Contrasts loving an animal with actually owning one -- the outcome's own communicative point.
    glosses:
      lieben: love
      beide: both
      Tiere: animals
      beiden: both
      Haustier: pet
      Hunde: dogs
      Katzen: cats
      Katze: cat
      spielt: plays
      gibt: gives
      jeden: every
      Futter: food
  de.a1.unit56.lesson05.teach.jonas_spielt_oft:
    title: Jonas often plays with his cat
    gloss: Jonas often plays with his cat.
    note: '*Oft* usually stands right after the verb: Jonas spielt oft mit seiner Katze.'
