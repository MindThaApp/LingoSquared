teaching:
  de.a1.unit16.lesson01.teach.bahnhof: {title: "Bahnhof", gloss: "train station", note: "*Bahnhof* is the train station.", example_gloss: "I am at the train station."}
  de.a1.unit16.lesson01.teach.gleis: {title: "Gleis", gloss: "platform / track", note: "German train information uses *Gleis* plus a number.", example_gloss: "In context: Where is platform three?"}
  de.a1.unit16.lesson01.teach.zug: {title: "Zug", gloss: "train", note: "*Zug* is masculine: *der Zug*.", example_gloss: "The train goes to Berlin."}
  de.a1.unit16.lesson01.teach.fahrkarte: {title: "Fahrkarte", gloss: "ticket", note: "*Fahrkarte* is a travel ticket.", example_gloss: "In context: A ticket to Berlin, please."}
  de.a1.unit16.lesson01.teach.abfahrt: {title: "Abfahrt", gloss: "departure", note: "*Abfahrt* names the departure time.", example_gloss: "Departure at nine o'clock."}
  de.a1.unit16.lesson02.teach.einfach: {title: "einfach", gloss: "one-way", note: "At a ticket counter, *einfach* means one-way.", example_gloss: "In context: One-way, please."}
  de.a1.unit16.lesson02.teach.hin_zurueck: {title: "hin und zurück", gloss: "return / round trip", note: "Literally 'there and back.'", example_gloss: "In context: One-way or return?"}
  de.a1.unit16.lesson02.teach.faerht: {title: "Der Zug fährt um neun Uhr von Gleis drei.", gloss: "The train leaves at nine o'clock from platform three.", note: "*fährt* means goes/leaves for transport."}
  de.a1.unit16.lesson02.teach.plan_text: {title: "Fahrkarte", gloss: "ticket", note: "A ticket or schedule shows destination, departure, platform, and type.", example_gloss: "Type: one-way."}
  de.a1.unit16.lesson02.teach.line01: {title: "Felix buys a ticket", gloss: "Felix: Hello, a ticket to Berlin, please.", note: "A polite ticket request names the destination.", example_gloss: "In context: A ticket to Berlin, please."}
  de.a1.unit16.lesson02.teach.line02: {title: "The clerk asks about the ticket type", gloss: "Clerk: One-way or return?", note: "The clerk asks one-way or return."}
  de.a1.unit16.lesson02.teach.line03: {title: "Felix chooses one-way", gloss: "Felix: One-way, please.", note: "A short one-way answer is enough."}
  de.a1.unit16.lesson02.teach.line04: {title: "The clerk gives the time and platform", gloss: "Clerk: The train leaves at nine o'clock from platform three.", note: "The key journey details are time and platform."}
  de.a1.unit16.lesson02.teach.line05: {title: "Felix asks where the platform is", gloss: "Felix: Thank you. Where is platform three?", note: "A practical follow-up at the station.", example_gloss: "In context: Where is platform three?"}
  de.a1.unit16.lesson02.teach.line06: {title: "The clerk gives directions", gloss: "Clerk: Go straight ahead and then right.", note: "Travel can reuse the direction phrases from Unit 10."}
exercises:
  de.a1.unit16.lesson01.exercise01.listen_gleis: {instruction: "Listen and select the platform you hear.", correct_option: "Gleis drei", distractors: ["Bahnhof", "Zug nach Berlin", "Abfahrt um neun Uhr"], accepted_answers: [{value: "Gleis drei", status: "correct"}], feedback: "*Gleis drei* means platform three."}
  de.a1.unit16.lesson01.exercise02.choose_ticket: {instruction: "Which word means a travel ticket?", correct_option: "Fahrkarte", distractors: ["Bahnhof", "Gleis", "Abfahrt"], accepted_answers: [{value: "Fahrkarte", status: "correct"}], feedback: "*Fahrkarte* means ticket."}
  de.a1.unit16.lesson01.exercise03.match_station:
    instruction: "Match each station word to its meaning."
    accepted_answers: [{value: [{left: "train station", right: "Bahnhof"}, {left: "platform", right: "Gleis"}, {left: "train", right: "Zug"}, {left: "ticket", right: "Fahrkarte"}, {left: "departure", right: "Abfahrt"}, {left: "the destination city", right: "Berlin"}], status: "correct"}]
    feedback: "These are basic train-station words."
  de.a1.unit16.lesson01.exercise04.order_ticket: {instruction: "Put the words in order: 'A ticket to Berlin, please.'", accepted_answers: [{value: ["Eine", "Fahrkarte", "nach", "Berlin", "bitte"], status: "correct"}], feedback: "The destination follows *nach*."}
  de.a1.unit16.lesson01.exercise05.write_departure: {instruction: "Write: Departure at nine o'clock.", accepted_answers: [{value: "Abfahrt um neun Uhr", status: "correct"}, {value: "Abfahrt um neun Uhr.", status: "correct"}], feedback: "*Abfahrt um neun Uhr* gives the departure time."}
  de.a1.unit16.lesson02.exercise01.listen_destination: {instruction: "Listen to the dialogue. What destination does Felix request?", correct_option: "Berlin", distractors: ["Museum", "Park", "Cafe"], accepted_answers: [{value: "Berlin", status: "correct"}], feedback: "Felix asks for a ticket to Berlin."}
  de.a1.unit16.lesson02.exercise02.choose_platform: {instruction: "Read the dialogue. Which platform does the train leave from?", correct_option: "Gleis drei", distractors: ["Gleis zwei", "Gleis neun", "der Bahnhof"], accepted_answers: [{value: "Gleis drei", status: "correct"}], feedback: "The train leaves from *Gleis drei*."}
  de.a1.unit16.lesson02.exercise03.match_ticket:
    instruction: "Match each journey detail."
    accepted_answers: [{value: [{left: "destination", right: "Berlin"}, {left: "ticket type", right: "einfach"}, {left: "departure time", right: "neun Uhr"}, {left: "where the train leaves from", right: "Gleis drei"}, {left: "first step of the directions", right: "geradeaus"}, {left: "second step of the directions", right: "rechts"}], status: "correct"}]
    feedback: "The journey request includes destination, ticket type, time, platform, and directions."
  de.a1.unit16.lesson02.exercise04.order_train_info: {instruction: "Put the words in order: 'The train leaves at nine o'clock from platform three.'", accepted_answers: [{value: ["Der", "Zug", "fährt", "um", "neun", "Uhr", "von", "Gleis", "drei"], status: "correct"}], feedback: "The platform comes after *von*."}
  de.a1.unit16.lesson02.exercise05.reply_ticket: {instruction: "Reply as Felix at the ticket counter: ask for a ticket to Berlin, answer 'one-way, please', then ask where platform three is.", accepted_answers: [{value: "Eine Fahrkarte nach Berlin, bitte. Einfach, bitte. Wo ist Gleis drei?", status: "correct"}, {value: "Eine Fahrkarte nach Berlin bitte Einfach bitte Wo ist Gleis drei", status: "correct"}, {value: "Eine Fahrkarte nach Berlin, bitte. Einfach, bitte. Danke. Wo ist Gleis drei?", status: "correct"}, {value: "Guten Tag, eine Fahrkarte nach Berlin, bitte. Einfach, bitte. Wo ist Gleis drei?", status: "correct"}, {value: "Guten Tag, eine Fahrkarte nach Berlin, bitte. Einfach, bitte. Danke. Wo ist Gleis drei?", status: "correct"}], feedback: "The request names the destination, ticket type, and platform question."}
  de.a1.unit16.lesson02.exercise06.write_travel_request: {instruction: "Write: A ticket to Berlin, please. Departure at nine o'clock?", accepted_answers: [{value: "Eine Fahrkarte nach Berlin, bitte. Abfahrt um neun Uhr?", status: "correct"}, {value: "Eine Fahrkarte nach Berlin bitte Abfahrt um neun Uhr", status: "correct"}], feedback: "The message includes destination and departure detail."}
