review: {status: "reviewed", required_next_reviewer: "codex", notes: "English-to-German overlay for basic travel; distractors target literal ticket requests and platform/departure confusion.\n\nSecond-pass review 2026-10-19: 10 fixes -- lesson02.teach.line01-line06: German titles and German-text glosses -> English titles and English translations; lesson01.exercise03.match_station and lesson02.exercise03.match_ticket: accepted_answers mirrored to the realization's new English clues; lesson01.teach.gleis example_gloss -> 'Where is platform three?' (corrected realization example); lesson01.teach.bahnhof/zug/abfahrt example_gloss: dropped 'In context:' (examples are not dialogue lines); lesson02.teach.plan_text example_gloss 'In context: Departure: nine o'clock.' -> 'Type: one-way.' (gloss did not translate the example 'Art: einfach.'); lesson02.exercise02.choose_platform instruction prefixed 'Read the dialogue.' (realization now shows it); lesson02.exercise05.reply_ticket: instruction pinned to the three replies and added variants with Felix's own 'Guten Tag,' and 'Danke.'; lesson02.exercise06.write_travel_request: instruction pinned to the exact two parts ('confirm departure at nine o'clock' was underdetermined)."}
course: {title: "German A1", description: "Learn A1-level German for everyday exchanges, with English explanations."}
