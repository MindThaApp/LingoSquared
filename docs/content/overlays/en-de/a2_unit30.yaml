  de.a2.unit30.lesson02.exercise05.write_availability_note: {instruction: "Write the full formal interview message with greeting, thanks, interview availability, relevant experience, work availability, clarifying role question, and closing exactly as taught.", accepted_answers: [{value: "Guten Tag. Vielen Dank für die Einladung. Ich kann am Dienstag um zehn Uhr kommen. Ich habe Erfahrung im Cafe. Ich bin ab Montag verfügbar. Welche Aufgaben gehören zu der Stelle? Mit freundlichen Grüßen", status: "correct"}, {value: "Guten Tag Vielen Dank für die Einladung Ich kann am Dienstag um zehn Uhr kommen Ich habe Erfahrung im Cafe Ich bin ab Montag verfügbar Welche Aufgaben gehören zu der Stelle Mit freundlichen Grüßen", status: "correct"}, {value: "Guten Tag. Vielen Dank fuer die Einladung. Ich kann am Dienstag um zehn Uhr kommen. Ich habe Erfahrung im Cafe. Ich bin ab Montag verfuegbar. Welche Aufgaben gehoeren zu der Stelle? Mit freundlichen Gruessen", status: "correct"}, {value: "Guten Tag Vielen Dank fuer die Einladung Ich kann am Dienstag um zehn Uhr kommen Ich habe Erfahrung im Cafe Ich bin ab Montag verfuegbar Welche Aufgaben gehoeren zu der Stelle Mit freundlichen Gruessen", status: "correct"}, {value: "Guten Tag. Vielen Dank für die Einladung. Ich kann am Dienstag um zehn Uhr kommen. Ich habe Erfahrung im Cafe. Ich bin ab Montag verfügbar. Welche Aufgaben gehören zur Stelle? Mit freundlichen Grüßen", status: "correct"}, {value: "Guten Tag Vielen Dank für die Einladung Ich kann am Dienstag um zehn Uhr kommen Ich habe Erfahrung im Cafe Ich bin ab Montag verfügbar Welche Aufgaben gehören zur Stelle Mit freundlichen Grüßen", status: "correct"}], feedback: "The message confirms interview availability, states relevant experience and work availability, and asks about the role."}
