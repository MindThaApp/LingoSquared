  de.a2.unit30.lesson01.exercise02.choose_experience: {instruction: "Which sentence describes cafe experience?", correct_option: "Ich habe Erfahrung im Cafe.", distractors: ["Ich bin ab Montag verfügbar.", "Welche Aufgaben hat die Stelle?", "Ich habe ein Vorstellungsgespräch."], accepted_answers: [{value: "Ich habe Erfahrung im Cafe.", status: "correct"}], feedback: "*Erfahrung im Cafe* describes relevant experience."}
