  de.a2.unit30.lesson01.exercise05.write_experience: {instruction: "Write exactly the taught interview answer with experience and teamwork.", accepted_answers: [{value: "Ich habe Erfahrung im Cafe und arbeite gern im Team.", status: "correct"}, {value: "Ich habe Erfahrung im Cafe und arbeite gern im Team", status: "correct"}], feedback: "The answer describes relevant experience and a strength."}
  de.a2.unit30.lesson02.exercise01.choose_available: {instruction: "Which sentence says you are available from Monday?", correct_option: "Ich bin ab Montag verfügbar.", distractors: ["Ich habe Erfahrung im Cafe.", "Ist die Stelle in Teilzeit?", "Vielen Dank für die Einladung."], accepted_answers: [{value: "Ich bin ab Montag verfügbar.", status: "correct"}], feedback: "*verfügbar* states availability."}
  de.a2.unit30.lesson02.exercise02.match_availability:
    instruction: "Match each availability or role word."
    accepted_answers: [{value: [{left: "frei für Arbeit", right: "verfügbar"}, {left: "Starttag", right: "Montag"}, {left: "nicht Vollzeit", right: "Teilzeit"}, {left: "Job oder Position", right: "Stelle"}, {left: "Tätigkeiten im Job", right: "Aufgaben"}, {left: "Nachricht zum Gespräch", right: "Einladung"}], status: "correct"}]
    feedback: "These words cover availability and role details."
  de.a2.unit30.lesson02.exercise03.order_role_question: {instruction: "Put the words in order for the clarifying role question: 'What tasks does the role have?'", accepted_answers: [{value: ["Welche", "Aufgaben", "hat", "die", "Stelle"], status: "correct"}], feedback: "The question asks about the role's tasks."}
  de.a2.unit30.lesson02.exercise04.reply_interview: {instruction: "Reply formally with the exact taught experience sentence, availability sentence, and clarifying question about the role.", accepted_answers: [{value: "Ich habe Erfahrung im Cafe. Ich bin ab Montag verfügbar. Welche Aufgaben hat die Stelle?", status: "correct"}, {value: "Ich habe Erfahrung im Cafe Ich bin ab Montag verfügbar Welche Aufgaben hat die Stelle", status: "correct"}], feedback: "The reply covers experience, availability, and a clarifying role question."}
  de.a2.unit30.lesson02.exercise05.write_availability_note: {instruction: "Write the full formal interview message with greeting, thanks, interview availability, work availability, clarifying role question, and closing exactly as taught.", accepted_answers: [{value: "Guten Tag. Vielen Dank für die Einladung. Ich kann am Dienstag um zehn Uhr kommen. Ich bin ab Montag verfügbar. Welche Aufgaben hat die Stelle? Mit freundlichen Grüßen", status: "correct"}, {value: "Guten Tag Vielen Dank für die Einladung Ich kann am Dienstag um zehn Uhr kommen Ich bin ab Montag verfügbar Welche Aufgaben hat die Stelle Mit freundlichen Grüßen", status: "correct"}], feedback: "The message confirms interview availability, states work availability, and asks about the role."}
