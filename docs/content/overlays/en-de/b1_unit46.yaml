  de.b1.unit46.lesson02.exercise01.recognize_felix_schon_angerufen: {instruction: "Which German sentence means \"I already called last week.\"?", correct_option: "Ich habe letzte Woche schon angerufen.", distractors: ["Ich habe letzten Monat schon angerufen.", "Ich rufe letzte Woche schon an.", "Ich habe letzte Woche noch nicht angerufen."], accepted_answers: [{value: "Ich habe letzte Woche schon angerufen.", status: "correct"}], feedback: "*Ich habe ... angerufen* is the Perfekt of *anrufen* (to call)."}
  de.b1.unit46.lesson02.exercise02.recognize_felix_request_repair: {instruction: "Which German sentence means \"I would like you to repair the heating as soon as possible.\"?", correct_option: "Ich möchte, dass Sie die Heizung so schnell wie möglich reparieren.", distractors: ["Ich möchte, dass Sie die Heizung nächste Woche reparieren.", "Ich möchte, dass Sie die Wohnung so schnell wie möglich reparieren.", "Ich habe die Heizung so schnell wie möglich repariert."], accepted_answers: [{value: "Ich möchte, dass Sie die Heizung so schnell wie möglich reparieren.", status: "correct"}], feedback: "*Ich möchte, dass Sie ...* states the resolution you are requesting."}
