  de.b1.unit46.lesson01.exercise05.order_felix_heizung_kaputt: {instruction: "Put the words in order to say \"The heating in my apartment isn't working.\"", accepted_answers: [{value: ["Die", "Heizung", "in", "meiner", "Wohnung", "funktioniert", "nicht."], status: "correct"}], feedback: "The correct order is *Die Heizung in meiner Wohnung funktioniert nicht.*"}
