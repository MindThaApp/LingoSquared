  de.b1.unit46.lesson03.exercise01.choose_koenig_ask: {instruction: "How does Frau König react to the complaint, and what does she ask?", correct_option: "She apologizes and asks when it happened.", distractors: ["She apologizes and asks how much it will cost.", "She says it's not her problem.", "She asks why he didn't call sooner."], accepted_answers: [{value: "She apologizes and asks when it happened.", status: "correct"}], feedback: "Frau König says *Das tut mir leid. Wann ist das passiert?*"}
