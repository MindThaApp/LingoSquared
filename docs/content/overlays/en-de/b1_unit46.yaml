lessons:
  de.b1.unit46.lesson01.problem_beschreiben: {title: "The heating isn't working"}
  de.b1.unit46.lesson02.schon_passiert_und_loesung: {title: "I already called"}
  de.b1.unit46.lesson03.vermieterin_dialogue: {title: "Dialogue: Frau König, the heating isn't working"}

teaching:
  de.b1.unit46.lesson01.teach.felix_heizung_kaputt: {title: "Felix names the problem", gloss: "Felix: The heating in my apartment isn't working.", note: "Names the problem with a simple present-tense statement, the first part of a formal complaint.", example_gloss: "Problem: The heating in my apartment isn't working."}
  de.b1.unit46.lesson01.teach.felix_seit_drei_tagen: {title: "Felix describes the effect", gloss: "Felix: It's been cold in my apartment for three days.", note: "*seit drei Tagen* (for three days) gives the duration of the problem.", example_gloss: "Problem: It's been cold in my apartment for three days."}
  de.b1.unit46.lesson02.teach.felix_schon_angerufen: {title: "Felix reports what he already did", gloss: "Felix: I already called last week.", note: "The Perfekt (*ich habe schon angerufen*) reports the action already taken, the second part of a formal complaint.", example_gloss: "Already happened: I already called last week."}
  de.b1.unit46.lesson02.teach.felix_request_repair: {title: "Felix requests a resolution", gloss: "Felix: I would like you to repair the heating as soon as possible.", note: "*Ich möchte, dass Sie ...* + dass-clause states the concrete resolution requested, the third part of a formal complaint.", example_gloss: "Resolution requested: I would like you to repair the heating as soon as possible."}
  de.b1.unit46.lesson03.teach.felix_greet_complain: {title: "Felix opens the complaint", gloss: "Felix: Frau König, the heating isn't working.", note: "Addresses the landlord by name and states the problem directly."}
  de.b1.unit46.lesson03.teach.koenig_apologize_ask: {title: "Frau König apologizes and asks", gloss: "Frau König: I'm sorry. When did that happen?", note: "The landlord's reaction and follow-up question."}
  de.b1.unit46.lesson03.teach.felix_explain_already: {title: "Felix gives the duration and what he already did", gloss: "Felix: It's been cold in my apartment for three days. I already called last week.", note: "Combines the duration statement from lesson01 with the already-happened statement from lesson02."}
  de.b1.unit46.lesson03.teach.koenig_resolution: {title: "Frau König offers a resolution", gloss: "Frau König: I'll send a technician tomorrow.", note: "The landlord's concrete resolution."}
  de.b1.unit46.lesson03.teach.felix_thanks: {title: "Felix thanks her", gloss: "Felix: Thank you very much for the quick help.", note: "Closes the exchange politely, accepting the resolution offered."}

exercises:
  de.b1.unit46.lesson01.exercise01.recognize_felix_heizung_kaputt: {instruction: "Which German sentence means \"The heating in my apartment isn't working.\"?", correct_option: "Die Heizung in meiner Wohnung funktioniert nicht.", distractors: ["Die Heizung in meiner Wohnung funktioniert gut.", "Das Licht in meiner Wohnung funktioniert nicht.", "Die Heizung in meinem Büro funktioniert nicht."], accepted_answers: [{value: "Die Heizung in meiner Wohnung funktioniert nicht.", status: "correct"}], feedback: "*funktioniert nicht* means \"isn't working.\""}
  de.b1.unit46.lesson01.exercise02.recognize_felix_seit_drei_tagen: {instruction: "Which German sentence means \"It's been cold in my apartment for three days.\"?", correct_option: "Es ist seit drei Tagen kalt in meiner Wohnung.", distractors: ["Es ist seit drei Wochen kalt in meiner Wohnung.", "Es war seit drei Tagen kalt in meiner Wohnung.", "Es ist seit drei Tagen warm in meiner Wohnung."], accepted_answers: [{value: "Es ist seit drei Tagen kalt in meiner Wohnung.", status: "correct"}], feedback: "*seit drei Tagen* means \"for three days.\""}
  de.b1.unit46.lesson01.exercise03.listen_select_heizung: {instruction: "Listen. What problem is Felix describing?", correct_option: "The heating in his apartment isn't working.", distractors: ["The light in his apartment isn't working.", "The heating in his office isn't working.", "The heating in his apartment is too hot."], accepted_answers: [{value: "The heating in his apartment isn't working.", status: "correct"}], feedback: "The recording says *Die Heizung in meiner Wohnung funktioniert nicht*."}
