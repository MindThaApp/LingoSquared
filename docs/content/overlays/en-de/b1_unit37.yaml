  de.b1.unit37.lesson01.exercise02.recognize_wenn_zeit_haben: {instruction: "Which German phrase means \"if you have time\" (real/possible)?", correct_option: "wenn Sie Zeit haben", distractors: ["wenn Sie Zeit hätten", "wenn Sie keine Zeit haben", "wenn ich Zeit hätte"], accepted_answers: [{value: "wenn Sie Zeit haben", status: "correct"}], feedback: "*wenn Sie Zeit haben* uses present indicative *haben*, marking a real/possible condition."}
