  de.b1.unit37.lesson01.wenn_real: {title: "If it's ready, I'll call."}
  de.b1.unit37.lesson02.wenn_unreal: {title: "If I had time, I would help."}
  de.b1.unit37.lesson03.buergeramt_dialogue: {title: "Dialogue: real and unreal conditions"}

teaching:
  de.b1.unit37.lesson01.teach.wenn_fertig_rufe_an: {title: "Wenn das Formular fertig ist, rufe ich Sie an.", gloss: "If the form is ready, I'll call you.", note: "A real/possible future condition uses *wenn* with present tense in both the condition and the result clause.", example_gloss: "If the form is ready, I'll call you."}
  de.b1.unit37.lesson01.teach.wenn_zeit_kann_helfen: {title: "Wenn Sie Zeit haben, kann ich Ihnen helfen.", gloss: "If you have time, I can help you.", note: "*kann* stays in the present indicative for a real/possible condition.", example_gloss: "If you have time, I can help you."}
  de.b1.unit37.lesson02.teach.wenn_zeit_haette_wuerde: {title: "Wenn ich Zeit hätte, würde ich Ihnen helfen.", gloss: "If I had time, I would help you.", note: "An unreal/counterfactual condition uses Konjunktiv II in both clauses: *hätte* (had) and *würde* (would).", example_gloss: "If I had time, I would help you."}
  de.b1.unit37.lesson02.teach.wenn_dringend_waere: {title: "Wenn es dringend wäre, würde ich sofort helfen.", gloss: "If it were urgent, I would help immediately.", note: "*wäre* is the Konjunktiv II form of *sein* (to be), used the same way as *hätte* and *würde* in unreal conditions.", example_gloss: "If it were urgent, I would help immediately."}
  de.b1.unit37.lesson03.teach.felix_greeting: {title: "Felix greets Frau Klein", gloss: "Felix: Hello, Frau Klein.", note: "This visibly re-opens the Bürgeramt scenario from earlier units."}
  de.b1.unit37.lesson03.teach.klein_real: {title: "Frau Klein states a real condition", gloss: "Frau Klein: Hello, Felix. If the form is ready, I'll call you.", note: "This models a real/possible conditional in present tense."}
  de.b1.unit37.lesson03.teach.felix_ask_real: {title: "Felix asks a real conditional question", gloss: "Felix: Good. And if you have time, can you help me?", note: "This is still present tense -- a real/possible condition, not unreal."}
  de.b1.unit37.lesson03.teach.klein_real_and_unreal: {title: "Frau Klein contrasts real and unreal conditions", gloss: "Frau Klein: Yes, if you have time, I can help you. But if I had no time, I would call you tomorrow.", note: "This single turn contrasts a real/possible condition with an unreal/counterfactual one."}

