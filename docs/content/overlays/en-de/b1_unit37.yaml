  de.b1.unit37.lesson03.exercise01.choose_unreal_conditional: {instruction: "Which answer states an unreal/counterfactual conditional, not a real/possible one?", correct_option: "Wenn ich keine Zeit hätte, würde ich Sie morgen anrufen.", distractors: ["Wenn das Formular fertig ist, rufe ich Sie an.", "Wenn Sie Zeit haben, kann ich Ihnen helfen.", "Ich rufe Sie morgen an, wenn Sie Zeit haben."], accepted_answers: [{value: "Wenn ich keine Zeit hätte, würde ich Sie morgen anrufen.", status: "correct"}], feedback: "*hätte* and *würde* mark this as unreal/counterfactual, unlike the present-tense real conditionals."}
  de.b1.unit37.lesson03.exercise02.dialogue_comprehension_conditionals:
    instruction: "Listen to the dialogue. What is the real condition, and what is the unreal/counterfactual one?"
