  de.b1.unit37.lesson02.exercise01.recognize_wenn_haette_wuerde: {instruction: "Which German sentence is unreal/counterfactual (\"If I had time, I would help you.\")?", correct_option: "Wenn ich Zeit hätte, würde ich Ihnen helfen.", distractors: ["Wenn ich Zeit habe, kann ich Ihnen helfen.", "Ich helfe Ihnen, wenn das Formular fertig ist.", "Wenn Sie Zeit haben, rufe ich Sie an."], accepted_answers: [{value: "Wenn ich Zeit hätte, würde ich Ihnen helfen.", status: "correct"}], feedback: "*hätte* and *würde* are both Konjunktiv II, marking an unreal/counterfactual condition."}
  de.b1.unit37.lesson02.exercise02.recognize_dringend_waere: {instruction: "Which German phrase means \"if it were urgent\" (unreal/counterfactual)?", correct_option: "wenn es dringend wäre", distractors: ["wenn es dringend ist", "wenn ich dringend helfe", "wenn es fertig wäre"], accepted_answers: [{value: "wenn es dringend wäre", status: "correct"}], feedback: "*wäre* is the Konjunktiv II form of *sein*, marking an unreal condition."}
  de.b1.unit37.lesson02.exercise03.listen_select_unreal_conditional: {instruction: "Listen. What would the speaker do if they had time?", correct_option: "Help Felix.", distractors: ["Call the office.", "Sign the form.", "Come tomorrow."], accepted_answers: [{value: "Help Felix.", status: "correct"}], feedback: "The recording says *Wenn ich Zeit hätte, würde ich Ihnen helfen*."}
