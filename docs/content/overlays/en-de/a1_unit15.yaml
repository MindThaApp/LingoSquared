units:
  de.a1.unit15.vergleiche: {title: "Basic comparisons"}
teaching:
  de.a1.unit15.lesson01.teach.billiger: {title: "billiger", gloss: "cheaper", note: "*billig* becomes *billiger* for cheaper.", example_gloss: "In context: Then the tea is cheaper."}
  de.a1.unit15.lesson01.teach.teurer: {title: "teurer", gloss: "more expensive", note: "*teuer* becomes *teurer*; do not add a separate word for 'more.'", example_gloss: "The coffee is more expensive."}
  de.a1.unit15.lesson01.teach.kaelter: {title: "kälter", gloss: "colder", note: "*kalt* changes vowel: *kälter*.", example_gloss: "In context: The water is colder than the tea."}
  de.a1.unit15.lesson01.teach.naeher: {title: "näher", gloss: "nearer / closer", note: "*nah* becomes *näher*.", example_gloss: "In context: The museum is closer."}
  de.a1.unit15.lesson01.teach.als: {title: "näher als der Park", gloss: "closer than the park", note: "In comparisons, 'than' is *als*, not *dann*.", example_gloss: "In context: The museum is closer than the park."}
  de.a1.unit15.lesson02.teach.kostet: {title: "Der Kaffee kostet drei Euro.", gloss: "The coffee costs three euros.", note: "*kostet* states the price."}
  de.a1.unit15.lesson02.teach.compare_text: {title: "Vergleichstext", gloss: "comparison text", note: "The text compares price, temperature, and distance.", example_gloss: "The tea is cheaper."}
  de.a1.unit15.lesson02.teach.line01: {title: "Anna gives the prices", gloss: "Anna: The coffee costs three euros. The tea costs two euros.", note: "Two prices set up a comparison.", example_gloss: "In context: The tea costs two euros."}
  de.a1.unit15.lesson02.teach.line02: {title: "Felix compares the prices", gloss: "Felix: Then the tea is cheaper.", note: "*Dann* here means then/so, not 'than.'"}
  de.a1.unit15.lesson02.teach.line03: {title: "Anna compares the water", gloss: "Anna: Yes, and the water is colder than the tea.", note: "*als* introduces the item being compared against.", example_gloss: "In context: The water is colder than the tea."}
  de.a1.unit15.lesson02.teach.line04: {title: "Felix compares places", gloss: "Felix: The museum is closer than the park.", note: "*als* introduces the item being compared against."}
exercises:
  de.a1.unit15.lesson01.exercise01.listen_billiger: {instruction: "Listen and select the sentence you hear.", correct_option: "Der Tee ist billiger", distractors: ["Der Kaffee ist teurer", "Das Wasser ist kälter", "Das Museum ist näher"], accepted_answers: [{value: "Der Tee ist billiger", status: "correct"}], feedback: "*billiger* means cheaper."}
  de.a1.unit15.lesson01.exercise02_choose_teurer: {instruction: "Which sentence means 'The coffee is more expensive'?", correct_option: "Der Kaffee ist teurer.", distractors: ["Der Kaffee ist mehr teuer.", "Der Kaffee ist teuerer.", "Der Tee ist billiger."], accepted_answers: [{value: "Der Kaffee ist teurer.", status: "correct"}], feedback: "Use *teurer*, not *mehr teuer*."}
  de.a1.unit15.lesson01.exercise03.match_comparatives:
    instruction: "Match each comparison clue."
    accepted_answers: [{value: [{left: "costs less", right: "billiger"}, {left: "costs more", right: "teurer"}, {left: "lower temperature", right: "kälter"}, {left: "shorter distance", right: "näher"}, {left: "comparison word", right: "als"}, {left: "Der Tee ist billiger.", right: "The tea is cheaper."}], status: "correct"}]
    feedback: "Each comparative has a distinct meaning."
  de.a1.unit15.lesson01.exercise04.order_billiger: {instruction: "Put the words in order: 'The tea is cheaper.'", accepted_answers: [{value: ["Der", "Tee", "ist", "billiger"], status: "correct"}], feedback: "The order is *Der Tee ist billiger*."}
  de.a1.unit15.lesson01.exercise05.write_teurer: {instruction: "Write: The coffee is more expensive.", accepted_answers: [{value: "Der Kaffee ist teurer", status: "correct"}, {value: "Der Kaffee ist teurer.", status: "correct"}], feedback: "*teurer* means more expensive."}
  de.a1.unit15.lesson02.exercise01.listen_price_compare: {instruction: "Listen to the dialogue. Which drink is cheaper?", correct_option: "Der Tee ist billiger", distractors: ["Der Kaffee ist billiger", "Der Tee ist teurer", "Der Park ist näher"], accepted_answers: [{value: "Der Tee ist billiger", status: "correct"}], feedback: "Felix says the tea is cheaper."}
  de.a1.unit15.lesson02.exercise02.choose_nearer: {instruction: "Which sentence says the museum is closer than the park?", correct_option: "Das Museum ist näher als der Park.", distractors: ["Das Museum ist näher dann der Park.", "Das Museum ist mehr nah als der Park.", "Der Park ist näher als das Museum."], accepted_answers: [{value: "Das Museum ist näher als der Park.", status: "correct"}], feedback: "Use *näher als* for closer than."}
  de.a1.unit15.lesson02.exercise03.match_dialog:
    instruction: "Match the dialogue details."
    accepted_answers: [{value: [{left: "costs three euros", right: "Kaffee"}, {left: "costs two euros", right: "Tee"}, {left: "is the cheaper drink", right: "Tee"}, {left: "is colder than the tea", right: "Wasser"}, {left: "is closer than the park", right: "Museum"}, {left: "is farther away than the museum", right: "Park"}], status: "correct"}]
    feedback: "The dialogue compares prices, temperature, and distance."
  de.a1.unit15.lesson02.exercise04.order_museum: {instruction: "Put the words in order: 'The museum is closer than the park.'", accepted_answers: [{value: ["Das", "Museum", "ist", "näher", "als", "der", "Park"], status: "correct"}], feedback: "The comparison word is *als*."}
  de.a1.unit15.lesson02.exercise05.reply_compare: {instruction: "Anna gives the prices. Reply with three comparisons: tea is cheaper, water is colder than tea, and the museum is closer than the park.", accepted_answers: [{value: "Der Tee ist billiger. Das Wasser ist kälter als der Tee. Das Museum ist näher als der Park.", status: "correct"}, {value: "Der Tee ist billiger Das Wasser ist kälter als der Tee Das Museum ist näher als der Park", status: "correct"}, {value: "Der Tee ist billiger. Das Wasser ist kaelter als der Tee. Das Museum ist naeher als der Park.", status: "correct"}, {value: "Der Tee ist billiger Das Wasser ist kaelter als der Tee Das Museum ist naeher als der Park", status: "correct"}, {value: "Der Tee ist billiger als der Kaffee. Das Wasser ist kälter als der Tee. Das Museum ist näher als der Park.", status: "correct"}, {value: "Dann ist der Tee billiger. Das Wasser ist kälter als der Tee. Das Museum ist näher als der Park.", status: "correct"}], feedback: "The answer gives three basic comparisons."}
  de.a1.unit15.lesson02.exercise06.write_comparison: {instruction: "Write a basic comparison: The tea is cheaper than the coffee.", accepted_answers: [{value: "Der Tee ist billiger als der Kaffee.", status: "correct"}, {value: "Der Tee ist billiger als der Kaffee", status: "correct"}], feedback: "Use *billiger als* for cheaper than."}
  de.a1.unit15.lesson02.exercise07.dictation_tee_billiger: {correct_response: "Der Tee ist billiger.", orthography_strict: true, feedback: "Type the sentence exactly as you hear it."}
