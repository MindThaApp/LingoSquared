review: {"status": "unreviewed", "required_next_reviewer": "native_speaker_review", "notes": "English overlay for the ability and possibility unit (koennen, availability, possibility, separable verbs after koennen). OPEN NATIVE QUESTIONS: none beyond the realization notes."}
course:
  title: "German A2"
  description: "Grammar-led A2 German continuing the Anna and Felix storyline."
  learning_goal: "Make predictions, follow rules, state what you can do, ask politely, give advice and talk about habits in German."
units:
  de.a2.unit105.koennen: {"title": "This Is What I Can Do", "description": "Say what you can and cannot do with können, describe when you are free, and say what might happen."}
lessons:
  de.a2.unit105.lesson01.ich_kann: {"title": "I Can Swim"}
  de.a2.unit105.lesson02.keine_zeit: {"title": "I Have No Time"}
  de.a2.unit105.lesson03.das_kann_sein: {"title": "That Might Be"}
  de.a2.unit105.lesson04.abholen: {"title": "Can You Pick Me Up?"}
  de.a2.unit105.lesson05.das_fest: {"title": "Anna Needs Help"}
  de.a2.unit105.lesson06.am_telefon: {"title": "Anna Calls Jonas"}
teaching:
  de.a2.unit105.lesson01.teach.faehigkeiten: {"title": "What can you do?", "gloss": "to swim / to cook / to play the piano / to drive a car / to speak English / well / not so well", "example_gloss": ["I can swim well.", "Nina can play the piano.", "Felix can't cook very well.", "Jonas can drive a car."], "note": "Skills. In German you can *Klavier spielen* without an article."}
  de.a2.unit105.lesson01.teach.gn_koennen: {"title": "Können: to be able to", "gloss": "I can, you can, he can, we can, you (plural) can, they can", "note": "Like other modal verbs, *ich* and *er* have no ending: *ich kann*, *er kann*. The plural has an umlaut."}
  de.a2.unit105.lesson01.teach.gn_klammer: {"title": "Modal verb and infinitive", "gloss": "I can cook well. Can you play the piano?", "note": "*Können* is second in a statement and first in a yes/no question. The infinitive stands at the end."}
  de.a2.unit105.lesson01.teach.gn_antwort: {"title": "Short answers", "gloss": "Yes, I can. No, I can't.", "note": "In a short answer you can drop the infinitive. The object *das* may come first."}
  de.a2.unit105.lesson02.teach.zeit: {"title": "Being available", "gloss": "time / on Monday / on Tuesday / in the afternoons / unfortunately / free", "example_gloss": ["I can't come on Monday.", "On Tuesday I have no time.", "In the afternoon I'm free.", "Can you come on Saturday?"], "note": "Words for saying when you are or are not available."}
  de.a2.unit105.lesson02.teach.gn_nicht: {"title": "Nicht with können", "gloss": "I can't on Monday. I can't come.", "note": "*Nicht* stands at the end of the sentence if there is no infinitive, and before the infinitive if there is one."}
  de.a2.unit105.lesson02.teach.gn_keine: {"title": "Keine Zeit", "gloss": "I have no time. On Tuesday I have no time.", "note": "*Keine Zeit haben* uses *kein*, not *nicht*. After a time word at the start, the verb *habe* is second."}
  de.a2.unit105.lesson02.teach.gn_frage: {"title": "Asking about availability", "gloss": "Can you come on Saturday? Yes, on Saturday I can.", "note": "A day can start the answer; the verb *kann* still comes second."}
  de.a2.unit105.lesson03.teach.moeglich: {"title": "Maybe", "gloss": "to happen / to say / to know / not yet / to be / tomorrow", "example_gloss": ["That might be.", "That can happen.", "I don't know yet.", "I can't say yet.", "Tomorrow it might rain."], "note": "*Wissen* is irregular: *ich weiß*."}
  de.a2.unit105.lesson03.teach.gn_moeglich: {"title": "Können for possibility", "gloss": "That might be. It might rain. It might get late.", "note": "*Können* also says that something is possible, not only that someone is able."}
  de.a2.unit105.lesson03.teach.gn_wissen: {"title": "Not yet", "gloss": "I don't know yet. I can't say yet.", "note": "*Noch nicht* = not yet. *Wissen*: *ich weiß, du weißt, er weiß*."}
  de.a2.unit105.lesson03.teach.gn_vielleicht: {"title": "Maybe I can", "gloss": "Maybe I can come. I can maybe come.", "note": "*Vielleicht* can start the sentence; then *kann ich* follows."}
  de.a2.unit105.lesson04.teach.helfen: {"title": "Asking for a favour", "gloss": "to come along / to pick up / to help / tomorrow / me / you", "example_gloss": ["Can you come along tomorrow?", "Can you pick me up?", "I can pick you up.", "We can help tomorrow."], "note": "*Mitkommen* and *abholen* are separable but stay together after *können*."}
  de.a2.unit105.lesson04.teach.gn_trennbar: {"title": "Separable verbs after können", "gloss": "Can you pick me up? I can pick you up.", "note": "After a modal verb the separable verb stays in one piece at the end: *abholen*."}
  de.a2.unit105.lesson04.teach.gn_leider: {"title": "Saying no", "gloss": "Unfortunately I can't come along.", "note": "*Leider* softens the no. *Nicht* stands before the infinitive."}
  de.a2.unit105.lesson04.teach.gn_mehrere: {"title": "Plural subjects", "gloss": "We can help tomorrow. Anna and Nina can cook.", "note": "With *wir* and plural nouns, the form is *können*."}
  de.a2.unit105.lesson05.teach.fest: {"title": "Words for the story", "gloss": "party / to organise / to need / help / only / in the cafe", "example_gloss": ["Anna is organising a party at the cafe.", "She needs help.", "Nina can only come in the afternoons.", "Felix has no time on Saturday."], "note": "Words for the story you will read."}
  de.a2.unit105.lesson05.teach.gn_text: {"title": "Can and can only", "gloss": "Nina can play the piano well, but she can only come in the afternoons.", "note": "*Nur* stands before the time word."}
  de.a2.unit105.lesson05.teach.lesen_fest: {"title": "Help for the party", "gloss": "On Saturday Anna is organising a party at the cafe. She needs help. Nina can play the piano well, but she can only come in the afternoons. Jonas can cook well. Unfortunately Felix can't help. He has no time on Saturday. Maybe he can tidy up on Sunday.", "note": "Skills, availability and a possibility, all with *können*."}
  de.a2.unit105.lesson06.teach.anna_frage: {"title": "Anna asks", "gloss": "Anna: Hi Jonas! Can you help at the cafe on Saturday?"}
  de.a2.unit105.lesson06.teach.jonas_weiss: {"title": "Jonas is unsure", "gloss": "Jonas: On Saturday? I don't know yet. Maybe I can come."}
  de.a2.unit105.lesson06.teach.anna_kochen: {"title": "Anna asks about cooking", "gloss": "Anna: Can you cook?"}
  de.a2.unit105.lesson06.teach.jonas_ja: {"title": "Jonas says yes", "gloss": "Jonas: Yes, I can cook well. But I can only come in the afternoon."}
  de.a2.unit105.lesson06.teach.anna_super: {"title": "Anna suggests a time", "gloss": "Anna: Great! Can you come at three o'clock?"}
  de.a2.unit105.lesson06.teach.jonas_drei: {"title": "Jonas agrees", "gloss": "Jonas: Yes, I can."}
exercises:
  de.a2.unit105.lesson01.exercise01.wahl_schwimmen: {"instruction": "Choose the correct German sentence.", "correct_option": "Ich kann gut schwimmen.", "distractors": ["Ich kann gut schwimme.", "Ich können gut schwimmen.", "Ich kann schwimmen gut."], "accepted_answers": [{"value": "Ich kann gut schwimmen.", "status": "correct"}], "feedback": "*Kann* second, infinitive last."}
  de.a2.unit105.lesson01.exercise02.wahl_klavier: {"instruction": "Choose the correct German sentence.", "correct_option": "Kannst du Klavier spielen?", "distractors": ["Kannst du Klavier gespielt?", "Kann du Klavier spielen?", "Kannst Klavier du spielen?"], "accepted_answers": [{"value": "Kannst du Klavier spielen?", "status": "correct"}], "feedback": "Question: *kannst* first, *spielen* last."}
  de.a2.unit105.lesson01.exercise03.paare_formen: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "ich kann kochen", "right": "I can cook"}, {"left": "du kannst kochen", "right": "you can cook"}, {"left": "er kann kochen", "right": "he can cook"}, {"left": "wir können kochen", "right": "we can cook"}, {"left": "ihr könnt kochen", "right": "you (plural) can cook"}, {"left": "sie können kochen", "right": "they can cook"}], "status": "correct"}], "feedback": "können: kann, kannst, kann, können, könnt, können."}
  de.a2.unit105.lesson01.exercise04.ordnen_nina: {"instruction": "Put the words in order to say 'Nina can play the piano.'", "correct_option": "Nina kann Klavier spielen", "accepted_answers": [{"value": "Nina kann Klavier spielen", "status": "correct"}], "feedback": "*Kann* second."}
  de.a2.unit105.lesson01.exercise05.luecke_koennen: {"instruction": "Complete with the correct modal verb.", "correct_option": "können", "accepted_answers": [{"value": "können", "status": "correct"}, {"value": "koennen", "status": "correct"}], "feedback": "*Wir können*."}
  de.a2.unit105.lesson01.exercise06.uebersetzen_auto: {"instruction": "Translate into German.", "accepted_answers": [{"value": "Jonas kann Auto fahren.", "status": "correct"}], "feedback": "*Auto fahren* has no article."}
  de.a2.unit105.lesson01.exercise07.schreiben_englisch: {"instruction": "Write the requested German sentence.", "correct_option": "Ich kann Englisch sprechen.", "accepted_answers": [{"value": "Ich kann Englisch sprechen.", "status": "correct"}], "feedback": "*Kann* + *sprechen* at the end."}
  de.a2.unit105.lesson02.exercise01.wahl_montag: {"instruction": "Choose the correct German sentence.", "correct_option": "Am Montag kann ich nicht kommen.", "distractors": ["Am Montag ich kann nicht kommen.", "Am Montag kann ich kommen nicht.", "Am Montag kann ich nicht gekommen."], "accepted_answers": [{"value": "Am Montag kann ich nicht kommen.", "status": "correct"}], "feedback": "*Kann* is second, *nicht kommen* at the end."}
  de.a2.unit105.lesson02.exercise02.wahl_dienstag: {"instruction": "Choose the correct German sentence.", "correct_option": "Am Dienstag habe ich keine Zeit.", "distractors": ["Am Dienstag habe ich nicht Zeit.", "Am Dienstag ich habe keine Zeit.", "Am Dienstag habe ich kein Zeit."], "accepted_answers": [{"value": "Am Dienstag habe ich keine Zeit.", "status": "correct"}], "feedback": "*Keine Zeit* - *Zeit* is feminine."}
  de.a2.unit105.lesson02.exercise03.paare_zeit: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Ich kann am Montag nicht kommen.", "right": "I can't come on Monday."}, {"left": "Am Dienstag habe ich keine Zeit.", "right": "On Tuesday I have no time."}, {"left": "Nachmittags bin ich frei.", "right": "In the afternoon I'm free."}, {"left": "Kannst du am Samstag kommen?", "right": "Can you come on Saturday?"}, {"left": "Ja, am Samstag kann ich.", "right": "Yes, on Saturday I can."}, {"left": "Leider habe ich keine Zeit.", "right": "Unfortunately I have no time."}], "status": "correct"}], "feedback": "Saying when you are available."}
  de.a2.unit105.lesson02.exercise04.ordnen_samstag: {"instruction": "Put the words in order to say 'Can you come on Saturday?'", "correct_option": "Kannst du am Samstag kommen", "accepted_answers": [{"value": "Kannst du am Samstag kommen", "status": "correct"}], "feedback": "Question: *kannst* first."}
  de.a2.unit105.lesson02.exercise05.luecke_keine: {"instruction": "Complete the sentence.", "correct_option": "keine", "accepted_answers": [{"value": "keine", "status": "correct"}], "feedback": "*Keine Zeit haben*."}
  de.a2.unit105.lesson02.exercise06.uebersetzen_frei: {"instruction": "Translate into German.", "accepted_answers": [{"value": "Nachmittags bin ich frei.", "status": "correct"}], "feedback": "*Frei* = free."}
  de.a2.unit105.lesson02.exercise07.schreiben_leider: {"instruction": "Write the requested German sentence.", "correct_option": "Leider kann ich am Montag nicht kommen.", "accepted_answers": [{"value": "Leider kann ich am Montag nicht kommen.", "status": "correct"}, {"value": "Ich kann am Montag leider nicht kommen.", "status": "correct"}, {"value": "Am Montag kann ich leider nicht kommen.", "status": "correct"}], "feedback": "*Leider* can stand first or after *kann ich*."}
  de.a2.unit105.lesson03.exercise01.wahl_sein: {"instruction": "Choose the correct German sentence.", "correct_option": "Das kann sein.", "distractors": ["Das kann sind.", "Das können sein.", "Das kann gesein."], "accepted_answers": [{"value": "Das kann sein.", "status": "correct"}], "feedback": "*Das kann sein.*"}
  de.a2.unit105.lesson03.exercise02.wahl_regnen: {"instruction": "Choose the correct German sentence.", "correct_option": "Es kann regnen.", "distractors": ["Es kann regnet.", "Es können regnen.", "Es kann geregnet."], "accepted_answers": [{"value": "Es kann regnen.", "status": "correct"}], "feedback": "*Es kann regnen.*"}
  de.a2.unit105.lesson03.exercise03.paare_moeglich: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Das kann sein.", "right": "That might be."}, {"left": "Es kann regnen.", "right": "It might rain."}, {"left": "Vielleicht kann ich kommen.", "right": "Maybe I can come."}, {"left": "Ich weiß es noch nicht.", "right": "I don't know yet."}, {"left": "Ich kann es noch nicht sagen.", "right": "I can't say yet."}, {"left": "Das kann passieren.", "right": "That can happen."}], "status": "correct"}], "feedback": "Possibility and not knowing."}
  de.a2.unit105.lesson03.exercise04.ordnen_vielleicht: {"instruction": "Put the words in order to say 'Maybe I can come.'", "correct_option": "Vielleicht kann ich kommen", "accepted_answers": [{"value": "Vielleicht kann ich kommen", "status": "correct"}, {"value": "Ich kann vielleicht kommen", "status": "correct"}], "feedback": "Verb second after *vielleicht*."}
  de.a2.unit105.lesson03.exercise05.luecke_kann: {"instruction": "Complete with the correct modal verb.", "correct_option": "kann", "accepted_answers": [{"value": "kann", "status": "correct"}], "feedback": "*Ich kann*."}
  de.a2.unit105.lesson03.exercise06.uebersetzen_wissen: {"instruction": "Translate into German.", "accepted_answers": [{"value": "Ich weiß es noch nicht.", "status": "correct"}, {"value": "Ich weiss es noch nicht.", "status": "correct"}], "feedback": "*Wissen* - *weiß*."}
  de.a2.unit105.lesson03.exercise07.schreiben_regnen: {"instruction": "Write the requested German sentence.", "correct_option": "Morgen kann es regnen.", "accepted_answers": [{"value": "Morgen kann es regnen.", "status": "correct"}, {"value": "Es kann morgen regnen.", "status": "correct"}], "feedback": "*Kann es* after the time word."}
  de.a2.unit105.lesson04.exercise01.wahl_abholen: {"instruction": "Choose the correct German sentence.", "correct_option": "Kannst du mich abholen?", "distractors": ["Kannst du mich abholst?", "Kannst du abholen mich?", "Kannst du mich abgeholt?"], "accepted_answers": [{"value": "Kannst du mich abholen?", "status": "correct"}], "feedback": "*Abholen* at the end, in one piece."}
  de.a2.unit105.lesson04.exercise02.wahl_dich: {"instruction": "Choose the correct German sentence.", "correct_option": "Ich kann dich abholen.", "distractors": ["Ich kann dich abhole.", "Ich kann abholen dich.", "Ich kann dich holen ab."], "accepted_answers": [{"value": "Ich kann dich abholen.", "status": "correct"}], "feedback": "*Dich* is the object."}
  de.a2.unit105.lesson04.exercise03.paare_hilfe: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Kannst du morgen mitkommen?", "right": "Can you come along tomorrow?"}, {"left": "Kannst du mich abholen?", "right": "Can you pick me up?"}, {"left": "Ich kann dich abholen.", "right": "I can pick you up."}, {"left": "Ich kann leider nicht mitkommen.", "right": "Unfortunately I can't come along."}, {"left": "Wir können morgen helfen.", "right": "We can help tomorrow."}, {"left": "Anna und Nina können kochen.", "right": "Anna and Nina can cook."}], "status": "correct"}], "feedback": "Questions and answers about help."}
  de.a2.unit105.lesson04.exercise04.ordnen_mitkommen: {"instruction": "Put the words in order to say 'Can you come along tomorrow?'", "correct_option": "Kannst du morgen mitkommen", "accepted_answers": [{"value": "Kannst du morgen mitkommen", "status": "correct"}], "feedback": "*Mitkommen* in one piece at the end."}
  de.a2.unit105.lesson04.exercise05.luecke_abholen: {"instruction": "Complete with the infinitive.", "correct_option": "abholen", "accepted_answers": [{"value": "abholen", "status": "correct"}], "feedback": "The separable verb stays together."}
  de.a2.unit105.lesson04.exercise06.uebersetzen_leider: {"instruction": "Translate into German.", "accepted_answers": [{"value": "Ich kann leider nicht mitkommen.", "status": "correct"}], "feedback": "*Leider nicht mitkommen*."}
  de.a2.unit105.lesson04.exercise07.schreiben_helfen: {"instruction": "Write the requested German sentence.", "correct_option": "Anna und Nina können helfen.", "accepted_answers": [{"value": "Anna und Nina können helfen.", "status": "correct"}, {"value": "Anna und Nina koennen helfen.", "status": "correct"}], "feedback": "Plural, so *können*."}
  de.a2.unit105.lesson05.exercise01.lesen_klavier: {"instruction": "Read the text and choose the answer.", "correct_option": "Nina", "distractors": ["Anna", "Jonas", "Felix"], "accepted_answers": [{"value": "Nina", "status": "correct"}], "feedback": "*Nina kann gut Klavier spielen.*"}
  de.a2.unit105.lesson05.exercise02.lesen_felix: {"instruction": "Read the text and choose the answer.", "correct_option": "He has no time.", "distractors": ["He cannot cook.", "He is ill.", "He lives too far away."], "accepted_answers": [{"value": "He has no time.", "status": "correct"}], "feedback": "*Er hat am Samstag keine Zeit.*"}
  de.a2.unit105.lesson05.exercise03.paare_fest: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Anna organisiert ein Fest im Café.", "right": "Anna is organising a party at the cafe."}, {"left": "Sie braucht Hilfe.", "right": "She needs help."}, {"left": "Nina kann gut Klavier spielen.", "right": "Nina can play the piano well."}, {"left": "Jonas kann gut kochen.", "right": "Jonas can cook well."}, {"left": "Felix kann leider nicht helfen.", "right": "Unfortunately Felix can't help."}, {"left": "Vielleicht kann er am Sonntag aufräumen.", "right": "Maybe he can tidy up on Sunday."}], "status": "correct"}], "feedback": "Match the lines of the story."}
  de.a2.unit105.lesson05.exercise04.ordnen_felix: {"instruction": "Put the words in order to say 'Felix can't help.'", "correct_option": "Felix kann nicht helfen", "accepted_answers": [{"value": "Felix kann nicht helfen", "status": "correct"}], "feedback": "*Nicht* before the infinitive."}
  de.a2.unit105.lesson05.exercise05.uebersetzen_nur: {"instruction": "Translate into German.", "accepted_answers": [{"value": "Nina kann nur nachmittags kommen.", "status": "correct"}], "feedback": "*Nur nachmittags*."}
  de.a2.unit105.lesson05.exercise06.diktat_nina: {"instruction": "Type what you hear.", "correct_response": "Nina kann gut Klavier spielen.", "orthography_strict": true, "feedback": "You heard *Nina kann gut Klavier spielen.*"}
  de.a2.unit105.lesson05.exercise07.diktat_felix: {"instruction": "Type what you hear.", "correct_response": "Felix hat am Samstag keine Zeit.", "orthography_strict": true, "feedback": "You heard *Felix hat am Samstag keine Zeit.*"}
  de.a2.unit105.lesson06.exercise01.hoeren_frage: {"instruction": "Listen and select Anna's opening question.", "correct_option": "Hallo Jonas! Kannst du am Samstag im Café helfen?", "distractors": ["Hallo Jonas! Kannst du am Sonntag im Café helfen?", "Hallo Anna! Kannst du am Samstag im Café helfen?", "Hallo Jonas! Kannst du am Samstag kochen?"], "accepted_answers": [{"value": "Hallo Jonas! Kannst du am Samstag im Café helfen?", "status": "correct"}], "feedback": "Anna opens with *Hallo Jonas! Kannst du am Samstag im Café helfen?*"}
  de.a2.unit105.lesson06.exercise02.verstehen_zeit: {"instruction": "Listen to the dialogue and choose the answer.", "correct_option": "In the afternoon.", "distractors": ["In the morning.", "In the evening.", "All day."], "accepted_answers": [{"value": "In the afternoon.", "status": "correct"}], "feedback": "Jonas says: *Ich kann nur nachmittags.*"}
  de.a2.unit105.lesson06.exercise03.paare_dialog: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Kannst du am Samstag im Café helfen?", "right": "Can you help at the cafe on Saturday?"}, {"left": "Ich weiß es noch nicht.", "right": "I don't know yet."}, {"left": "Vielleicht kann ich kommen.", "right": "Maybe I can come."}, {"left": "Ich kann gut kochen.", "right": "I can cook well."}, {"left": "Ich kann nur nachmittags.", "right": "I can only come in the afternoon."}, {"left": "Kannst du um drei Uhr kommen?", "right": "Can you come at three o'clock?"}], "status": "correct"}], "feedback": "The dialogue in sentences."}
  de.a2.unit105.lesson06.exercise04.ordnen_kochen: {"instruction": "Put the words in order to say 'Can you cook?'", "correct_option": "Kannst du kochen", "accepted_answers": [{"value": "Kannst du kochen", "status": "correct"}], "feedback": "Question: *kannst* first."}
  de.a2.unit105.lesson06.exercise05.antwort_unsicher: {"instruction": "Answer in German as Jonas: say you don't know yet.", "correct_option": "Ich weiß es noch nicht.", "accepted_answers": [{"value": "Ich weiß es noch nicht.", "status": "correct"}, {"value": "Ich weiss es noch nicht.", "status": "correct"}, {"value": "Vielleicht kann ich kommen.", "status": "correct"}], "feedback": "*Ich weiß es noch nicht.*"}
  de.a2.unit105.lesson06.exercise06.uebersetzen_nur: {"instruction": "Translate into German.", "accepted_answers": [{"value": "Ich kann nur nachmittags kommen.", "status": "correct"}], "feedback": "*Nur nachmittags*."}
  de.a2.unit105.lesson06.exercise07.schreiben_dreisaetze: {"instruction": "Write three German sentences, following the three numbered instructions.", "correct_option": "Ich kann gut kochen. Ich kann nur nachmittags kommen. Am Sonntag habe ich keine Zeit.", "accepted_answers": [{"value": "Ich kann gut kochen. Ich kann nur nachmittags kommen. Am Sonntag habe ich keine Zeit.", "status": "correct"}], "feedback": "Skill, availability and no time."}
