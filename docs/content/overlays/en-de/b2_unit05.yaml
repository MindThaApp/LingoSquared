review:
  status: unreviewed
  required_next_reviewer: fresh_context_reviewer
  notes: >-
    Overlay for de's fifth B2 unit (first register unit), authored
    alongside the realization (no adaptable upper-intermediate
    public-domain German source exists; see the realization provenance
    note). English speakers' real interference risks for this outcome:
    (1) English "you" collapses du/Sie entirely -- every instruction
    explicitly names which register is required so a learner is never
    marked wrong for producing the wrong one; (2) Sie takes a
    plural-like verb form (haben Sie, können Sie, wären Sie) which an
    English speaker has no intuition for -- flagged in lesson01/03
    glosses; (3) the closing ladder (Liebe Grüße < Mit freundlichen
    Grüßen < Hochachtungsvoll) has no single-word English equivalent --
    each is glossed with its relative formality explicitly; (4) capitalized
    "Sie" (formal you) vs lowercase "sie" (she/they) is a real reading
    trap -- lesson01 exercise01 and lesson06 exercise01 note this
    explicitly. No sibling direction file (de-en b2) was consulted.

course:
  title: German B2
  description: >-
    Upper-intermediate German: adapt formality to your audience -- deliver
    the same everyday request appropriately to a close friend (informal
    du) and to an institution (formal Sie), across pronouns, salutations
    and closings, and directness.

units:
  de.b2.unit05.register:
    title: "Register"
    description: Adapt formality to your audience -- deliver the same request appropriately to a close friend versus an institution, and recognize which forms are too casual or too stiff for a given setting.

lessons:
  de.b2.unit05.lesson01.du_oder_sie:
    title: "Du or Sie?"
  de.b2.unit05.lesson02.anrede_und_grussformel:
    title: "Salutation and closing"
  de.b2.unit05.lesson03.direkt_oder_hoeflich:
    title: "Direct or polite?"
  de.b2.unit05.lesson04.den_termin_verschieben:
    title: "Rescheduling the appointment"
  de.b2.unit05.lesson05.zwei_nachrichten:
    title: "Two messages, two readers"
  de.b2.unit05.lesson06.das_richtige_register_waehlen:
    title: "Choosing the right register"

teaching:
  de.b2.unit05.lesson01.teach.nachricht:
    title: "Felix writes a message."
    gloss: "Felix writes a message."
    note: "*Schreiben* = 'to write'. This lesson contrasts the two ways Felix can address the person he's writing to."
  de.b2.unit05.lesson01.teach.du:
    title: "you / to you / your (informal)"
    gloss: "you (subject) / you (dative) / your -- informal"
    note: "*Du*, *dir*, and *dein* are the informal 'you' family, used with close friends and family -- here, with Jonas."
    example_gloss: "I am writing you a message."
  de.b2.unit05.lesson01.teach.sie_formal:
    title: "you / to you / your (formal)"
    gloss: "you (subject) / you (dative) / your -- formal"
    note: "*Sie*, *Ihnen*, and *Ihr* are the formal 'you' family, always capitalized, used with institutions and people you don't know well. Capitalized *Sie* is never confusable with lowercase *sie* (she/they) once you know the convention."
    example_gloss: "I am writing you a message."
  de.b2.unit05.lesson01.teach.hast_du_zeit:
    title: "Do you have time? (informal)"
    gloss: "Do you have time?"
    note: "*Hast du* is the informal 'do you have' -- the everyday form used with someone you address as *du*."
  de.b2.unit05.lesson01.teach.haben_sie_zeit:
    title: "Do you have time? (formal)"
    gloss: "Do you have time?"
    note: "*Haben Sie* is the formal 'do you have' -- notice *Sie* takes the same verb form as *sie* (they): *Sie haben*, not *Sie hast*."
  de.b2.unit05.lesson01.teach.kannst_du:
    title: "Can you help? (informal)"
    gloss: "Can you help?"
    note: "*Kannst du* is the informal 'can you' -- direct and everyday."
  de.b2.unit05.lesson01.teach.koennen_sie:
    title: "Can you help? (formal)"
    gloss: "Can you help?"
    note: "*Können Sie* is the formal 'can you' -- again, *Sie* takes the *können* form that goes with *sie* (they), not with *du*."
  de.b2.unit05.lesson01.teach.grammar_du_sie:
    title: "Do you have time? (informal) Do you have time? (formal) Can you help? (informal) Can you help? (formal)"
    gloss: "Do you have time? (informal) Do you have time? (formal) Can you help? (informal) Can you help? (formal)"
    note: "Every verb changes shape depending on whether you address someone as *du* or *Sie* -- this is the core grammatical fact behind German register, distinct from English, which uses one 'you' for both."

  de.b2.unit05.lesson02.teach.hallo:
    title: "Hi / Hello"
    gloss: "Hi / Hello (informal)"
    note: "*Hallo* is the everyday informal greeting -- fine with a close friend like Jonas, too casual for an institution."
    example_gloss: "Hi Jonas!"
  de.b2.unit05.lesson02.teach.liebe_gruesse:
    title: "Kind regards (casual)"
    gloss: "Kind regards / love (casual sign-off)"
    note: "*Liebe Grüße* is a warm, informal closing between friends -- roughly 'kind regards' but noticeably more casual than the formal *Mit freundlichen Grüßen*."
    example_gloss: "Kind regards, Felix"
  de.b2.unit05.lesson02.teach.sehr_geehrte:
    title: "Dear Sir or Madam"
    gloss: "Dear Sir or Madam"
    note: "*Sehr geehrte Damen und Herren* is the standard formal salutation for a letter or email to someone you don't know, or an institution generally."
  de.b2.unit05.lesson02.teach.mit_freundlichen_gruessen:
    title: "Kind regards (formal)"
    gloss: "Kind regards / Best regards (formal closing)"
    note: "*Mit freundlichen Grüßen* is the standard formal closing for professional and institutional correspondence -- often abbreviated MfG in very informal contexts, but write it in full for a formal letter."
  de.b2.unit05.lesson02.teach.hochachtungsvoll:
    title: "Yours faithfully"
    gloss: "Yours faithfully (most formal closing)"
    note: "*Hochachtungsvoll* is more formal than *Mit freundlichen Grüßen* -- reserved for very formal or legal correspondence; using it in an everyday email can read as stiff or even cold."
    example_gloss: "Yours faithfully, Felix Weber"
  de.b2.unit05.lesson02.teach.lieber:
    title: "Dear (to a man)"
    gloss: "Dear (masculine, neutral-to-warm salutation)"
    note: "*Lieber* + name is a common middle-ground salutation -- warmer than *Sehr geehrte(r)*, more personal than a bare *Hallo*, still perfectly fine in writing."
    example_gloss: "Dear Jonas,"
  de.b2.unit05.lesson02.teach.grammar_anrede:
    title: "Hi Jonas! Kind regards. Dear Sir or Madam, Kind regards."
    gloss: "Hi Jonas! Kind regards. Dear Sir or Madam, Kind regards."
    note: "Salutation and closing must match: an informal *Hallo* pairs with *Liebe Grüße*, a formal *Sehr geehrte Damen und Herren* pairs with *Mit freundlichen Grüßen* (or, rarely, *Hochachtungsvoll*) -- mixing an informal opener with a formal closing (or vice versa) reads as inconsistent."

  de.b2.unit05.lesson03.teach.kannst_du_das:
    title: "Can you do this? (informal)"
    gloss: "Can you do this?"
    note: "The direct, informal way to ask for a favor -- appropriate with Jonas."
  de.b2.unit05.lesson03.teach.bitte:
    title: please
    gloss: please
    note: "*Bitte* softens a request in either register -- always worth adding, informal or formal."
    example_gloss: "Can you do this, please?"
  de.b2.unit05.lesson03.teach.waeren_sie_so_freundlich:
    title: "Would you be so kind as to do this?"
    gloss: "Would you be so kind as to do this? (formal)"
    note: "*Wären Sie so freundlich, ... zu ...?* is a polished, formal way to make a request -- literally 'would you be so kind'. The infinitive (*zu machen*) goes to the end."
  de.b2.unit05.lesson03.teach.moeglich:
    title: possible
    gloss: possible
    example_gloss: "That is quite possible."
  de.b2.unit05.lesson03.teach.waere_es_moeglich:
    title: "Would it be possible to do this?"
    gloss: "Would it be possible to do this? (formal)"
    note: "*Wäre es möglich, ... zu ...?* is another standard formal request frame -- slightly less personal than *Wären Sie so freundlich*, equally polite."
  de.b2.unit05.lesson03.teach.grammar_direktheit:
    title: "Can you do this? Would you be so kind as to do this? Would it be possible to do this?"
    gloss: "Can you do this? Would you be so kind as to do this? Would it be possible to do this?"
    note: "Directness scales with register: a bare *kannst du* is fine informally, but the same bluntness toward an institution reads as rude -- formal requests wrap the same ask in a softened, indirect frame (*wären Sie so freundlich*, *wäre es möglich*)."

  de.b2.unit05.lesson04.teach.termin:
    title: appointment
    gloss: appointment
    example_gloss: "I have an appointment."
  de.b2.unit05.lesson04.teach.verschieben:
    title: "to reschedule / postpone"
    gloss: "to reschedule / to postpone"
    example_gloss: "I would like to reschedule the appointment."
  de.b2.unit05.lesson04.teach.montag:
    title: Monday
    gloss: Monday
    example_gloss: "I can't on Monday."
  de.b2.unit05.lesson04.teach.leider:
    title: unfortunately
    gloss: unfortunately
    example_gloss: "I unfortunately can't on Monday."
  de.b2.unit05.lesson04.teach.naechste_woche:
    title: "next week"
    gloss: "next week"
    example_gloss: "Does next week work?"
  de.b2.unit05.lesson04.teach.informelle_frage:
    title: "Can you reschedule our appointment? (informal)"
    gloss: "Can you reschedule our appointment?"
    note: "The informal version of this unit's request, addressed to Jonas."
  de.b2.unit05.lesson04.teach.formelle_frage:
    title: "Would it be possible to reschedule our appointment? (formal)"
    gloss: "Would it be possible to reschedule our appointment?"
    note: "The SAME request, now formal -- built from *wäre es möglich* (lesson03) plus *unseren Termin verschieben* (this lesson)."
  de.b2.unit05.lesson04.teach.grammar_termin:
    title: "Can you reschedule our appointment? Would it be possible to reschedule our appointment?"
    gloss: "Can you reschedule our appointment? Would it be possible to reschedule our appointment?"
    note: "One request, two registers -- the propositional content (rescheduling the appointment) never changes; only the framing does."

  de.b2.unit05.lesson05.teach.passen:
    title: "to suit / be convenient"
    gloss: "to suit / to be convenient"
    example_gloss: "Does next week suit you?"
  de.b2.unit05.lesson05.teach.text_informell:
    title: "Reading: informal message to Jonas"
    gloss: "Hi Jonas! Can you reschedule our appointment? I unfortunately can't on Monday. Does next week suit you? Kind regards, Felix"
  de.b2.unit05.lesson05.teach.text_formell:
    title: "Reading: formal message to an institution"
    gloss: "Dear Sir or Madam, would it be possible to reschedule our appointment? I unfortunately can't on Monday. Does next week suit you? Kind regards, Felix Weber"
    glosses:
      Ihnen: "you (formal, dative -- the formal counterpart of dir)"
      Weber: "Weber (Felix's surname)"

  de.b2.unit05.lesson06.teach.kein_problem:
    title: "No problem."
    gloss: "No problem."
  de.b2.unit05.lesson06.teach.wann_denn:
    title: "When, then?"
    gloss: "When, then? / When would work?"
    note: "*Denn* here is a colloquial filler that softens a direct question -- common in spoken informal German, not used this way in formal writing."
  de.b2.unit05.lesson06.teach.die_praxis:
    title: "the (doctor's) practice"
    gloss: "the practice / doctor's office"
    note: "*Schreiben* takes a dative recipient with no preposition: *der Praxis schreiben* = 'to write to the practice' (dative *der Praxis*, from *die Praxis*)."
    example_gloss: "I am writing to the practice."
  de.b2.unit05.lesson06.teach.muss_noch:
    title: "I still need to write."
    gloss: "I still need to write."
  de.b2.unit05.lesson06.teach.anders:
    title: differently
    gloss: "differently / another way"
    example_gloss: "That is different."
  de.b2.unit05.lesson06.teach.dialogue_felix_setup:
    title: "Felix: Hi Jonas, can you reschedule our appointment? I can't on Monday."
    gloss: "Felix: Hi Jonas, can you reschedule our appointment? I can't on Monday."
  de.b2.unit05.lesson06.teach.dialogue_jonas_ok:
    title: "Jonas: No problem. When, then?"
    gloss: "Jonas: No problem. When, then?"
  de.b2.unit05.lesson06.teach.dialogue_felix_praxis:
    title: "Felix: Next week? And I still need to write to the practice."
    gloss: "Felix: Next week? And I still need to write to the practice."
  de.b2.unit05.lesson06.teach.dialogue_jonas_anders:
    title: "Jonas: Yeah, you obviously write to the practice differently."
    gloss: "Jonas: Yeah, you obviously write to the practice differently."
  de.b2.unit05.lesson06.teach.grammar_beide_register:
    title: "Can you reschedule our appointment? Would it be possible to reschedule our appointment?"
    gloss: "Can you reschedule our appointment? Would it be possible to reschedule our appointment?"
    note: "Judging register fit means asking: does this level of formality match this audience? Felix and Jonas's informal *du* fits a friendship; the same words toward the Praxis would signal a lack of respect for a professional relationship."

exercises:
  de.b2.unit05.lesson01.exercise01.recognize_sie:
    instruction: "What does this word mean? (Note: capitalized Sie is always the formal 'you', never 'she/they'.)"
    correct_option: "you (formal)"
    distractors: [she, they, it]
    accepted_answers: [{value: "you (formal)", status: correct}]
    feedback: "Capitalized Sie is the formal way to say 'you' -- always capitalized, distinct from lowercase sie (she/they)."
  de.b2.unit05.lesson01.exercise02.listen_haben_sie_zeit:
    instruction: "Listen and select what you hear."
    correct_option: "Do you have time? (formal)"
    distractors: ["Do you have time? (informal)", "Do you have money? (formal)", "Did you have time? (formal)"]
    accepted_answers: [{value: "Do you have time? (formal)", status: correct}]
    feedback: "Haben Sie Zeit? means do you have time?, addressed formally."
  de.b2.unit05.lesson01.exercise03.match_pronouns:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - value: {du: "you (informal, subject)", dir: "you (informal, dative)", dein: "your (informal)", dich: "you (informal, accusative)", Sie: "you (formal)", Ihnen: "you (formal, dative)", Ihr: "your (formal)", Zeit: time}
        status: correct
    feedback: "These are the du-family and Sie-family pronouns."
  de.b2.unit05.lesson01.exercise04.order_hast_du:
    instruction: "Put the words in order: Do you have time? (informal)"
    accepted_answers:
      - {value: "Hast du Zeit", status: correct}
    feedback: "Hast du Zeit? means do you have time?, addressed informally."
  de.b2.unit05.lesson01.exercise05.translate_haben_sie:
    instruction: "Translate into German, formal (addressing the person as Sie): Do you have time?"
    accepted_answers:
      - {value: "Haben Sie Zeit", status: correct}
      - {value: "Haben Sie Zeit?", status: correct}
    feedback: "Haben Sie Zeit? means do you have time?, addressed formally."
  de.b2.unit05.lesson01.exercise06.translate_kannst_du:
    instruction: "Translate into German, informal (addressing the person as du): Can you help?"
    accepted_answers:
      - {value: "Kannst du helfen", status: correct}
      - {value: "Kannst du helfen?", status: correct}
    feedback: "Kannst du helfen? means can you help?, addressed informally."
  de.b2.unit05.lesson01.exercise07.speak_koennen_sie:
    instruction: "Say aloud in German, formal (addressing the person as Sie): Can you help?"
    accepted_answers:
      - {value: "Können Sie helfen", status: correct}
    feedback: "Können Sie helfen? means can you help?, addressed formally."
  de.b2.unit05.lesson01.exercise08.dictation_haben_sie_zeit:
    instruction: "Type what you hear."
    correct_response: "Haben Sie Zeit"
    orthography_strict: true
    feedback: "You heard Haben Sie Zeit? — do you have time?, addressed formally."

  de.b2.unit05.lesson02.exercise01.recognize_sehr_geehrte:
    instruction: "What does this phrase mean?"
    correct_option: "Dear Sir or Madam"
    distractors: ["Kind regards", "Hello there", "Yours faithfully"]
    accepted_answers: [{value: "Dear Sir or Madam", status: correct}]
    feedback: "Sehr geehrte Damen und Herren is the standard formal salutation to an unknown recipient or institution."
  de.b2.unit05.lesson02.exercise02.listen_mfg:
    instruction: "Listen and select what you hear."
    correct_option: "Kind regards (formal)"
    distractors: ["Yours faithfully", "Kind regards (casual)", "Best wishes for the future"]
    accepted_answers: [{value: "Kind regards (formal)", status: correct}]
    feedback: "Mit freundlichen Grüßen is the standard formal closing."
  de.b2.unit05.lesson02.exercise03.match_openers_closers:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {Hallo: "informal 'hi'", "Liebe Grüße": "informal sign-off (kind regards, casual)", "Sehr geehrte Damen und Herren": "formal salutation (Dear Sir or Madam)", "Mit freundlichen Grüßen": "formal closing (kind regards)", Hochachtungsvoll: "most formal closing (yours faithfully)", Lieber: "neutral 'Dear' + name (masculine)"}
        status: correct
    feedback: "These rank the greeting/closing ladder from casual to most formal."
  de.b2.unit05.lesson02.exercise04.order_mfg:
    instruction: "Put the words in order: Kind regards (formal closing)."
    accepted_answers:
      - {value: "Mit freundlichen Grüßen", status: correct}
    feedback: "Mit freundlichen Grüßen means kind regards, the standard formal closing."
  de.b2.unit05.lesson02.exercise05.translate_sehr_geehrte:
    instruction: "Write the formal German salutation for a letter to someone you don't know: Dear Sir or Madam."
    accepted_answers:
      - {value: "Sehr geehrte Damen und Herren", status: correct}
    feedback: "Sehr geehrte Damen und Herren means Dear Sir or Madam."
  de.b2.unit05.lesson02.exercise06.write_liebe_gruesse:
    instruction: "Write an informal German sign-off to a friend, from Felix: Kind regards, Felix."
    accepted_answers:
      - {value: "Liebe Grüße, Felix", status: correct}
      - {value: "Liebe Grüße Felix", status: correct}
      - {value: "Liebe Gruesse, Felix", status: correct}
    feedback: "Liebe Grüße, Felix is the informal way to sign off to a friend."
  de.b2.unit05.lesson02.exercise07.recognize_most_formal:
    instruction: "Which closing is the MOST formal?"
    correct_option: Hochachtungsvoll
    distractors: ["Liebe Grüße", "Mit freundlichen Grüßen", Hallo]
    accepted_answers: [{value: Hochachtungsvoll, status: correct}]
    feedback: "Hochachtungsvoll (yours faithfully) is more formal even than Mit freundlichen Grüßen -- reserved for very formal or legal correspondence."

  de.b2.unit05.lesson03.exercise01.recognize_moeglich:
    instruction: "What does this word mean?"
    correct_option: possible
    distractors: [necessary, important, difficult]
    accepted_answers: [{value: possible, status: correct}]
    feedback: "Möglich means possible -- the core word behind this lesson's formal request frame."
  de.b2.unit05.lesson03.exercise02.listen_waere_es_moeglich:
    instruction: "Listen and select what you hear."
    correct_option: "Would it be possible to do this?"
    distractors: ["Would it be possible to say this?", "Is it possible to do this?", "Would it be necessary to do this?"]
    accepted_answers: [{value: "Would it be possible to do this?", status: correct}]
    feedback: "Wäre es möglich, das zu tun? means would it be possible to do this?"
  de.b2.unit05.lesson03.exercise03.match_directness:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {"kannst du": "can you (informal, direct)", "wären Sie so freundlich": "would you be so kind (formal, polite)", bitte: please, möglich: possible, tun: "to do", machen: "to do / make"}
        status: correct
    feedback: "These are this lesson's directness-scaling words."
  de.b2.unit05.lesson03.exercise04.order_waere_es_moeglich:
    instruction: "Put the words in order: Would it be possible to do this?"
    accepted_answers:
      - {value: "Wäre es möglich das zu tun", status: correct}
    feedback: "Wäre es möglich, das zu tun? means would it be possible to do this?"
  de.b2.unit05.lesson03.exercise05.translate_kannst_du_das:
    instruction: "Translate into German, informal and direct (using kannst du): Can you do this?"
    accepted_answers:
      - {value: "Kannst du das machen", status: correct}
      - {value: "Kannst du das machen?", status: correct}
      - {value: "Kannst du das tun", status: correct}
      - {value: "Kannst du das tun?", status: correct}
    feedback: "Kannst du das machen? means can you do this?, addressed informally."
  de.b2.unit05.lesson03.exercise06.translate_waeren_sie:
    instruction: "Translate into German, formal and polite (using Wären Sie so freundlich): Would you be so kind as to do this?"
    accepted_answers:
      - {value: "Wären Sie so freundlich, das zu machen", status: correct}
      - {value: "Wären Sie so freundlich das zu machen", status: correct}
      - {value: "Waeren Sie so freundlich, das zu machen", status: correct}
    feedback: "Wären Sie so freundlich, das zu machen? means would you be so kind as to do this?"
  de.b2.unit05.lesson03.exercise07.speak_waere_es_moeglich:
    instruction: "Say aloud in German, formal (using Wäre es möglich): Would it be possible?"
    accepted_answers:
      - {value: "Wäre es möglich", status: correct}
    feedback: "Wäre es möglich? means would it be possible?"

  de.b2.unit05.lesson04.exercise01.recognize_verschieben:
    instruction: "What does this word mean?"
    correct_option: "to reschedule / postpone"
    distractors: [to cancel, to confirm, to schedule]
    accepted_answers: [{value: "to reschedule / postpone", status: correct}]
    feedback: "Verschieben means to reschedule or postpone."
  de.b2.unit05.lesson04.exercise02.listen_verschieben_informell:
    instruction: "Listen and select what you hear."
    correct_option: "Can you reschedule our appointment? (informal)"
    distractors: ["Can you cancel our appointment? (informal)", "Can you reschedule our appointment? (formal)", "Can you reschedule my appointment? (informal)"]
    accepted_answers: [{value: "Can you reschedule our appointment? (informal)", status: correct}]
    feedback: "Kannst du unseren Termin verschieben? means can you reschedule our appointment?, addressed informally."
  de.b2.unit05.lesson04.exercise03.match_termin_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {"der Termin": appointment, verschieben: "to reschedule / postpone", Montag: Monday, "nächste Woche": "next week", leider: unfortunately, unseren: "our (accusative)"}
        status: correct
    feedback: "These are this lesson's appointment-rescheduling words."
  de.b2.unit05.lesson04.exercise04.order_formelle_frage:
    instruction: "Put the words in order: Would it be possible to reschedule our appointment?"
    accepted_answers:
      - {value: "Wäre es möglich unseren Termin zu verschieben", status: correct}
    feedback: "Wäre es möglich, unseren Termin zu verschieben? means would it be possible to reschedule our appointment?"
  de.b2.unit05.lesson04.exercise05.translate_informelle_frage:
    instruction: "Translate into German, informal (to your friend Jonas): Can you reschedule our appointment?"
    accepted_answers:
      - {value: "Kannst du unseren Termin verschieben", status: correct}
      - {value: "Kannst du unseren Termin verschieben?", status: correct}
    feedback: "Kannst du unseren Termin verschieben? means can you reschedule our appointment?"
  de.b2.unit05.lesson04.exercise06.translate_formelle_frage:
    instruction: "Translate into German, formal (to an institution, using Wäre es möglich): Would it be possible to reschedule our appointment?"
    accepted_answers:
      - {value: "Wäre es möglich, unseren Termin zu verschieben", status: correct}
      - {value: "Wäre es möglich unseren Termin zu verschieben", status: correct}
      - {value: "Waere es moeglich, unseren Termin zu verschieben", status: correct}
