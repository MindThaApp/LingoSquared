  notes: >-
    Overlay for de's seventh B2 unit (first negotiation unit), authored
    alongside the realization (no adaptable upper-intermediate
    public-domain German source exists; see the realization provenance
    note). English speakers' real interference risks for this outcome:
    (1) "zuzustimmen" (the zu-infinitive of the separable verb
    zustimmen, with zu inserted between the prefix and stem: zu-zu-
    stimmen) has no equivalent English word-formation pattern -- flagged
    explicitly in lesson03; (2) wenn triggers verb-final word order in
    its own clause, unlike English "if" -- flagged in lesson03's grammar
    note; (3) English "agree" covers both "to be in agreement"
    (einverstanden sein) and "to accept a proposal" (akzeptieren) with
    one word -- German keeps these distinct, flagged in lesson04. No
    sibling direction file (de-en b2) was consulted.

    Fresh-context review 2026-10-11 (content-reviewer.md checklist):
    checked grading-fit of every accepted answer against the taught
    forms and word banks, matching_pairs left discrimination, distractor
    ambiguity, prompt/answer agreement, teaching-card coverage of tested
    tokens, character canon (Frau Vogel formal Sie colleague,
    consistent), YAML boolean and jargon sweeps (clean). Fixes:
    lesson06.teach.dialogue_vogel_concede title/gloss,
    lesson06.exercise04 instruction + feedback, lesson06.exercise05/06
    instructions now include 'always' (immer) to match the German;
    lesson06.exercise01.comprehend_proposal instruction -> 'What does
    Felix propose at first?' and distractor 'Two home-office days per
    week.' (Felix does propose two later) -> 'One home-office day per
    week.'. Accepted answers added: lesson02.exercise04/05 + 'Ich kann
    das nicht akzeptieren'; lesson03.exercise04/05 + 'Wenn ich zwei Tage
    pro Woche bekomme bin ich bereit zuzustimmen' (and the comma form on
    exercise07 speak); lesson06.exercise04 + 'Wenn Sie montags immer im
    Büro sind bin ich bereit zuzustimmen', '... wenn Sie immer montags
    im Büro sind' and its wenn-first form; lesson06.exercise05/06 + 'Ich
    kann das nicht akzeptieren. Ich bin bereit zuzustimmen, wenn Sie
    montags immer im Büro sind'; lesson04.exercise07.write_geeinigt +
    'Wir haben eine Einigung gefunden', 'Wir haben eine Einigung
    erzielt'. NATIVE FLAG: see realization note (vorausgesetzt example).
    DEFERRED: none.

    Second-pass review 2026-10-19: 3 fixes -- lesson03.exercise06 and
    lesson04.exercise06 instructions mirror the realization (formal Sie
    named); lesson05.exercise07.write_am_ende: +'Beide haben sich am Ende
    geeinigt'.

course:
  title: German B2
  description: >-
    Upper-intermediate German: negotiate an outcome -- propose terms,
    decline an unacceptable one, offer a conditional concession, and
    reach an agreement while keeping the relationship intact -- around a
    workplace negotiation over home-office days.

units:
  de.b2.unit07.verhandlung:
    title: "Verhandlung"
    description: Negotiate an outcome -- propose terms, push back on an unacceptable one, offer a conditional concession, and reach an agreement while keeping the relationship intact.

lessons:
  de.b2.unit07.lesson01.ein_angebot_machen:
    title: "Making an offer"
  de.b2.unit07.lesson02.ablehnen:
    title: "Declining"
  de.b2.unit07.lesson03.ein_zugestaendnis_mit_bedingung:
    title: "Offering a conditional concession"
  de.b2.unit07.lesson04.eine_einigung_erzielen:
    title: "Reaching an agreement"
  de.b2.unit07.lesson05.eine_schriftliche_verhandlung_lesen:
    title: "Reading a written negotiation"
  de.b2.unit07.lesson06.eine_verhandlung_fuehren:
    title: "Conducting a negotiation"

teaching:
  de.b2.unit07.lesson01.teach.vorschlagen:
    title: "to propose"
    gloss: "to propose"
    example_gloss: "I propose something."
  de.b2.unit07.lesson01.teach.angebot:
    title: offer
    gloss: offer
    example_gloss: "That is my offer."
  de.b2.unit07.lesson01.teach.ich_schlage_vor_dass:
    title: "I propose that..."
    gloss: "I propose that..."
    note: "*Ich schlage vor, dass...* opens a negotiation by putting concrete terms on the table -- the *dass* sends the following verb to the end of its clause."
  de.b2.unit07.lesson01.teach.homeoffice_tage:
    title: "home-office days"
    gloss: "home-office days"
    example_gloss: "I would like more home-office days."
  de.b2.unit07.lesson01.teach.pro_woche:
    title: "three days per week"
    gloss: "three days per week"
  de.b2.unit07.lesson01.teach.moechte:
    title: "I would like"
    gloss: "I would like"
    note: "*Möchte* (would like) is softer than *will* (want) -- the polite way to state a preference when opening a negotiation."
    example_gloss: "I would like three days per week."
  de.b2.unit07.lesson01.teach.claim_model:
    title: "I propose that I get three home-office days per week."
    gloss: "I propose that I get three home-office days per week."
    note: "The model opening proposal for this unit's negotiation."
  de.b2.unit07.lesson01.teach.grammar_angebot:
    title: "I propose that I get three home-office days per week. That is my offer."
    gloss: "I propose that I get three home-office days per week. That is my offer."
    note: "Proposing terms means stating a concrete, specific ask -- a number of days, not a vague preference -- so the other side has something real to respond to."

  de.b2.unit07.lesson02.teach.ablehnen:
    title: "to decline / refuse"
    gloss: "to decline / to refuse"
    example_gloss: "I decline the proposal."
  de.b2.unit07.lesson02.teach.das_geht_nicht:
    title: "That won't work."
    gloss: "That won't work."
  de.b2.unit07.lesson02.teach.das_kann_ich_nicht_akzeptieren:
    title: "I can't accept that."
    gloss: "I can't accept that."
    note: "*Das kann ich nicht akzeptieren* declines a specific term directly but politely -- the standard formal-register refusal."
  de.b2.unit07.lesson02.teach.leider_nicht_moeglich:
    title: "That's unfortunately not possible."
    gloss: "That's unfortunately not possible."
    note: "Built from *leider* and *möglich*, both already taught (Unit 5) -- reused here as a softer refusal than *das kann ich nicht akzeptieren*."
  de.b2.unit07.lesson02.teach.zu_viel:
    title: "too much"
    gloss: "too much"
    example_gloss: "Three days are too much."
  de.b2.unit07.lesson02.teach.grammar_ablehnen:
    title: "I can't accept that. That's unfortunately not possible. Three days are too much."
    gloss: "I can't accept that. That's unfortunately not possible. Three days are too much."
    note: "Declining a term means saying no clearly while staying polite -- pushing back on the specific number, not rejecting the negotiation itself."

  de.b2.unit07.lesson03.teach.bereit:
    title: willing
    gloss: "willing / ready"
    example_gloss: "I am willing to help."
  de.b2.unit07.lesson03.teach.zustimmen_wenn:
    title: "I am willing to agree, if..."
    gloss: "I am willing to agree, if..."
    note: "*Zuzustimmen* is the zu-infinitive of the separable verb *zustimmen* (to agree) -- *zu* is inserted between the prefix and the stem: *zu-zu-stimmen*, with no equivalent pattern in English. *Wenn* (if) sends its own clause's verb to the end."
  de.b2.unit07.lesson03.teach.unter_der_bedingung:
    title: "on the condition that..."
    gloss: "on the condition that..."
  de.b2.unit07.lesson03.teach.vorausgesetzt:
    title: "provided that..."
    gloss: "provided that..."
    note: "*Vorausgesetzt, dass...* is a slightly more formal synonym for *unter der Bedingung, dass...* -- both attach a condition to a concession."
    example_gloss: "Provided that you are willing, that is good."
  de.b2.unit07.lesson03.teach.zwei_tage:
    title: "two days per week"
    gloss: "two days per week"
  de.b2.unit07.lesson03.teach.grammar_bedingung:
    title: "I am willing to agree, if I get two days per week. On the condition that you are at the office on Mondays."
    gloss: "I am willing to agree, if I get two days per week. On the condition that you are at the office on Mondays."
    note: "A conditional concession has two parts: what you're willing to give up (agreeing to fewer days than your original proposal), and what you require in exchange (the condition) -- neither works alone as a real concession."

  de.b2.unit07.lesson04.teach.einigung:
    title: agreement
    gloss: agreement
    example_gloss: "We have found a good agreement."
  de.b2.unit07.lesson04.teach.einverstanden:
    title: "in agreement"
    gloss: "in agreement / agreed"
    note: "*Einverstanden* means you personally agree with something -- distinct from *akzeptieren* (to accept a specific proposal). English 'agree' covers both; German keeps them separate."
    example_gloss: "I am in agreement."
  de.b2.unit07.lesson04.teach.wir_haben_uns_geeinigt:
    title: "We have reached an agreement."
    gloss: "We have reached an agreement."
    note: "*Sich einigen* (reflexive) = for two or more parties to reach an agreement together -- the outcome of a successful negotiation."
  de.b2.unit07.lesson04.teach.akzeptieren_positiv:
    title: "I accept your proposal."
    gloss: "I accept your proposal."
    note: "*Akzeptieren* means accepting a specific term or proposal someone else put forward -- the positive counterpart to lesson02's *das kann ich nicht akzeptieren*."
  de.b2.unit07.lesson04.teach.grammar_einigung:
    title: "We have reached an agreement. I am in agreement. I accept your proposal."
    gloss: "We have reached an agreement. I am in agreement. I accept your proposal."
    note: "Reaching an agreement is the negotiation's resolution -- confirmed from both angles: your own agreement (*einverstanden*) and accepting the other side's specific terms (*akzeptieren*)."

  de.b2.unit07.lesson05.teach.verhandlung_text:
    title: "Reading: the home-office negotiation"
    gloss: "Felix proposes that he gets three home-office days per week. Frau Vogel refuses that: three days are too many for her. Frau Vogel is, however, willing to agree if Felix gets two days per week. Felix accepts the proposal. In the end, both reached an agreement: two home-office days per week, on the condition that Felix is always at the office on Mondays."
    glosses:
      schlägt: "proposes (from vorschlagen)"
      er: he
      ihr: "to her (dative)"
      am: "at the (am Ende = in the end)"
      Ende: end
      beide: both
      montags: "on Mondays"
      immer: always
      im: "in the (im Büro = at the office)"
      den: "the (accusative, den Vorschlag = the proposal)"
      lehnt: "refuses (from ablehnen)"
      akzeptiert: "accepts (from akzeptieren)"
      sich: "each other / themselves (reflexive, sich einigen = to reach an agreement together)"
      Vogel: "Vogel (Frau Vogel's surname)"

  de.b2.unit07.lesson06.teach.waeren_moeglich:
    title: "Would two days be possible?"
    gloss: "Would two days be possible?"
    note: "*Wären* is the plural form of *wäre* (Unit 5) -- agrees with the plural subject *zwei Tage*."
  de.b2.unit07.lesson06.teach.dann:
    title: then
    gloss: then
    example_gloss: "Then I agree."
  de.b2.unit07.lesson06.teach.dialogue_felix_propose:
    title: "Felix: I propose that I get three home-office days per week."
    gloss: "Felix: I propose that I get three home-office days per week."
  de.b2.unit07.lesson06.teach.dialogue_vogel_refuse:
    title: "Frau Vogel: I can't accept that. Three days are too much."
    gloss: "Frau Vogel: I can't accept that. Three days are too much."
  de.b2.unit07.lesson06.teach.dialogue_felix_counter:
    title: "Felix: Would two days be possible?"
    gloss: "Felix: Would two days be possible?"
  de.b2.unit07.lesson06.teach.dialogue_vogel_concede:
    title: "Frau Vogel: I am willing to agree, if you are always at the office on Mondays."
    gloss: "Frau Vogel: I am willing to agree, if you are always at the office on Mondays."
  de.b2.unit07.lesson06.teach.dialogue_felix_agree:
    title: "Felix: Agreed. Then we have reached an agreement."
    gloss: "Felix: Agreed. Then we have reached an agreement."
  de.b2.unit07.lesson06.teach.grammar_verhandlung:
    title: "I propose that... I can't accept that. I am willing to agree, if... We have reached an agreement."
    gloss: "I propose that... I can't accept that. I am willing to agree, if... We have reached an agreement."
    note: "A full negotiation has four moves, all present in this dialogue: propose, decline, offer a conditional concession, and reach an agreement -- exactly what this outcome's speaking and writing tasks ask you to produce."

