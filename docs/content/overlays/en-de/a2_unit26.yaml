review: {status: "reviewed", required_next_reviewer: "codex", notes: "Overlay for opinions with reasons; teaches weil/dass final verb position.\n\nSecond-pass review 2026-10-19: 2 fixes — lesson02.exercise04.reply_contrast: instruction now names the reason (the course is interesting) instead of an open weil-reason graded against one string; added the natural aber-joined variant Ich verstehe Ihre Meinung, aber ich bin anderer Meinung, weil der Kurs interessant ist.; lesson02.exercise05.write_full_opinion: old model answer was circular (opinion, then disagreement, then the same clause as its own reason) -> Ich bin anderer Meinung. Ich denke, dass der Kurs interessant ist.; instruction rewritten to name that content; old accepted answers removed (they no longer match the rewritten instruction/tested_text); feedback updated."}
course: {title: "German A2", description: "Build A2 German for practical public, work, health, and housing situations."}
units:
  de.a2.unit26.meinungen: {title: "Opinions With Reasons"}
teaching:
  de.a2.unit26.lesson01.teach.ich_finde: {title: "Ich finde die Bibliothek gut.", gloss: "I think the library is good.", note: "*Ich finde...* states an opinion.", example_gloss: "I think the library is good."}
  de.a2.unit26.lesson01.teach.meinung: {title: "Meinung", gloss: "opinion", note: "*Meinung* is an opinion.", example_gloss: "That is my opinion."}
  de.a2.unit26.lesson01.teach.weil: {title: "weil sie ruhig ist", gloss: "because it is quiet", note: "After *weil*, the verb usually moves to the end: *weil sie ruhig ist*.", example_gloss: "I think the library is good because it is quiet."}
  de.a2.unit26.lesson01.teach.interessant: {title: "interessant", gloss: "interesting", note: "*interessant* gives a simple positive reason.", example_gloss: "The course is interesting."}
  de.a2.unit26.lesson01.teach.teuer: {title: "teuer", gloss: "expensive", note: "*teuer* gives a simple negative opinion.", example_gloss: "The cafe is expensive."}
  de.a2.unit26.lesson02.teach.ich_denke: {title: "Ich denke, dass der Kurs interessant ist.", gloss: "I think that the course is interesting.", note: "After *dass*, the verb also moves to the end: *dass der Kurs interessant ist*.", example_gloss: "I think that the course is interesting."}
  de.a2.unit26.lesson02.teach.anderer_meinung: {title: "Ich bin anderer Meinung.", gloss: "I have a different opinion.", note: "*Ich bin anderer Meinung* responds to a contrasting opinion.", example_gloss: "I have a different opinion."}
  de.a2.unit26.lesson02.teach.ich_verstehe: {title: "Ich verstehe Ihre Meinung.", gloss: "I understand your opinion.", note: "*Ihre* keeps the response formal.", example_gloss: "I understand your opinion."}
  de.a2.unit26.lesson02.teach.response: {title: "Antwort auf eine Meinung", gloss: "response to an opinion", note: "A complete response can acknowledge the other opinion and give your reason.", example_gloss: "I understand your opinion. I disagree because the course is interesting."}
exercises:
  de.a2.unit26.lesson01.exercise01.listen_opinion: {instruction: "Listen and select the opinion plus reason you hear.", correct_option: "the library is good because it is quiet", distractors: ["the cafe is expensive", "the course is interesting", "the speaker disagrees"], accepted_answers: [{value: "the library is good because it is quiet", status: "correct"}], feedback: "The audio gives an opinion and a reason with *weil*."}
  de.a2.unit26.lesson01.exercise02.choose_reason: {instruction: "Which phrase gives the reason 'because it is quiet' with the verb at the end?", correct_option: "weil sie ruhig ist", distractors: ["weil ist sie ruhig", "dass der Kurs interessant ist", "Ich bin anderer Meinung"], accepted_answers: [{value: "weil sie ruhig ist", status: "correct"}], feedback: "With *weil*, *ist* comes at the end."}
  de.a2.unit26.lesson01.exercise03.match_opinion:
    instruction: "Match each opinion word or phrase."
    accepted_answers: [{value: [{left: "persönliche Ansicht", right: "Meinung"}, {left: "Verb in Ich finde", right: "finde"}, {left: "positives Urteil", right: "gut"}, {left: "Wort für einen Grund", right: "weil"}, {left: "nicht laut", right: "ruhig"}, {left: "kostet viel", right: "teuer"}], status: "correct"}]
    feedback: "These words build opinion-plus-reason statements."
  de.a2.unit26.lesson01.exercise04.order_weil: {instruction: "Put the words in order for the reason clause: 'because it is quiet.'", accepted_answers: [{value: ["weil", "sie", "ruhig", "ist"], status: "correct"}], feedback: "The verb comes last in *weil sie ruhig ist*."}
  de.a2.unit26.lesson01.exercise05.write_opinion_reason: {instruction: "Write exactly the taught opinion plus weil-reason: I think the library is good because it is quiet.", accepted_answers: [{value: "Ich finde die Bibliothek gut, weil sie ruhig ist.", status: "correct"}, {value: "Ich finde die Bibliothek gut weil sie ruhig ist", status: "correct"}], feedback: "The answer states the opinion and supports it with one reason."}
  de.a2.unit26.lesson02.exercise01.choose_dass: {instruction: "Which sentence uses dass with the verb at the end?", correct_option: "Ich denke, dass der Kurs interessant ist.", distractors: ["Ich denke, dass ist der Kurs interessant.", "Ich finde die Bibliothek gut.", "Ich bin anderer Meinung."], accepted_answers: [{value: "Ich denke, dass der Kurs interessant ist.", status: "correct"}], feedback: "After *dass*, *ist* moves to the end."}
  de.a2.unit26.lesson02.exercise02.match_response:
    instruction: "Match each part of the opinion response."
    accepted_answers: [{value: [{left: "Meinung mit Denken einleiten", right: "Ich denke"}, {left: "Wort nach denken", right: "dass"}, {left: "Verb am Ende nach dass", right: "ist"}, {left: "Thema im Beispielsatz", right: "Kurs"}, {left: "höfliche Anerkennung", right: "Ich verstehe Ihre Meinung"}, {left: "Kontrast anzeigen", right: "Ich bin anderer Meinung"}], status: "correct"}]
    feedback: "The response acknowledges and contrasts politely."
  de.a2.unit26.lesson02.exercise03.order_dass: {instruction: "Put the words in order for the dass-clause: 'that the course is interesting.'", accepted_answers: [{value: ["dass", "der", "Kurs", "interessant", "ist"], status: "correct"}], feedback: "The verb comes last in *dass der Kurs interessant ist*."}
  de.a2.unit26.lesson02.exercise04.reply_contrast: {instruction: "Reply formally: acknowledge the other opinion as taught, then say you disagree because the course is interesting (use weil).", accepted_answers: [{value: "Ich verstehe Ihre Meinung. Ich bin anderer Meinung, weil der Kurs interessant ist.", status: "correct"}, {value: "Ich verstehe Ihre Meinung Ich bin anderer Meinung weil der Kurs interessant ist", status: "correct"}, {value: "Ich verstehe Ihre Meinung, aber ich bin anderer Meinung, weil der Kurs interessant ist.", status: "correct"}], feedback: "The reply responds to someone else's opinion and gives a reason."}
  de.a2.unit26.lesson02.exercise05.write_full_opinion: {instruction: "Respond to the displayed opinion: first say that you disagree, as taught, then give your own opinion with dass: you think that the course is interesting.", accepted_answers: [{value: "Ich bin anderer Meinung. Ich denke, dass der Kurs interessant ist.", status: "correct"}, {value: "Ich bin anderer Meinung Ich denke dass der Kurs interessant ist", status: "correct"}], feedback: "*Ich bin anderer Meinung. Ich denke, dass der Kurs interessant ist.* disagrees politely and gives your opinion in a dass-clause."}
