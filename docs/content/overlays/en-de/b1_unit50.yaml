  notes: "Second unit of the de B1 completion wave (units 49-53). Needs fresh-context review. Fresh-context review 2026-10-11 (content-reviewer.md checklist): reviewed together with realizations/de/b1_unit50_einraeumungen.yaml. Fixes: de.b1.unit50.lesson03.exercise06.write_full_debate instruction pins 'bin ich für eine zweite Filiale'; lesson02.exercise04.match_obwohl_trotzdem accepted pair mirrored to 'die Bedenken'/'the concerns / reservations'; lesson02.exercise03.listen_select_trotzdem distractor 'She says they should ask Herr Weber first.' (Herr Weber is Felix, the person Anna is addressing) -> 'She says they should wait another year.'. NATIVE FLAG: 'am Ende' idiomaticity (see realization note). DEFERRED (owner decision): storyline canon spanning units 48-53 -- canon is Anna = Kellnerin, Felix Weber = Ingenieur (a1_unit18), but b1_unit48 has Anna planning her own cafe, unit 50 has Felix leading a second-location decision and unit 51 has Felix proposing 'dass wir früher schließen' (co-operator role), and unit 51's 'Wenn ich reich wäre, würde ich ein zweites Café eröffnen' is an unreal wish right after unit 50 plans a second location as a real project; needs a storyline decision before b1_unit52/53 consistency can be preserved.\n\nSecond-pass review 2026-10-19: 3 fixes -- lesson01.exercise01.recognize_felix_obwohl_filiale distractor 'Zwar ist es riskant, aber ich bin dagegen.' -> '... aber ich bin nicht für eine zweite Filiale.'; lesson01.exercise02.recognize_felix_zwar_aber distractors 'es kostet nichts' / 'Zwar kostet es wenig Geld' -> 'es kostet kein Geld' / 'Zwar kostet es nicht viel Geld'; lesson02.exercise01.recognize_anna_obwohl_bedenken distractor 'Zwar habe ich Bedenken, aber ich bin dagegen.' -> '... aber ich stimme Ihnen nicht zu.' (dagegen, nichts, wenig never taught in the course). NATIVE FLAGS: 'aber die Chance ist groß' reads to natives more as 'the likelihood is high' than 'the opportunity is big'; 'die Chancen sind groß' may be more idiomatic (not changed: ripples through audio, dictation and answers).\n\nLanguage review 2026-10-24 (session 10): edits for this overlay are listed in the realization note (de.b1.unit50 paired file)."

course:
  title: "German B1"
  description: "Learn B1-level German for debating with nuance -- conceding a valid point with obwohl before restating your position, and structuring a multi-point argument with zwar ... aber and trotzdem."

units:
  de.b1.unit50.einraeumungen: {title: "Concessions"}

lessons:
  de.b1.unit50.lesson01.obwohl_zwar_aber: {title: "Even though ... / It's true that ..., but ..."}
  de.b1.unit50.lesson02.obwohl_trotzdem: {title: "Even though ... / Nevertheless ..."}
  de.b1.unit50.lesson03.cafe_dialogue: {title: "Dialogue: The second location"}

teaching:
  de.b1.unit50.lesson01.teach.felix_obwohl_filiale: {title: "Felix concedes, then restates his position", gloss: "Felix: Even though it's risky, I'm in favor of a second location.", note: "*Obwohl* + verb-final clause concedes a valid point before restating your own position. Because the obwohl-clause comes first, the verb of the main clause follows the comma directly: *..., bin ich für ...*.", example_gloss: "Debate: Even though it's risky, I'm in favor of a second location."}
  de.b1.unit50.lesson01.teach.felix_zwar_aber: {title: "Felix structures a multi-point argument", gloss: "Felix: It's true that it costs a lot of money, but the opportunity is big.", note: "*Zwar ..., aber ...* concedes a point ('it's true that ...') and then sets the main point against it after *aber*. Both parts are ordinary main clauses with the verb in second position: *Zwar kostet es viel Geld, aber die Chance ist groß*.", example_gloss: "Debate: It's true that it costs a lot of money, but the opportunity is big."}
  de.b1.unit50.lesson02.teach.anna_obwohl_bedenken: {title: "Anna concedes her own concerns", gloss: "Anna: Even though I have concerns, I agree with you in the end.", note: "Anna uses *obwohl* to concede her own concerns before restating agreement.", example_gloss: "Debate: Even though I have concerns, I agree with you in the end."}
  de.b1.unit50.lesson02.teach.anna_trotzdem_plan: {title: "Anna adds a nevertheless-restatement", gloss: "Anna: Nevertheless, we should first make a precise plan.", note: "*Trotzdem* ('nevertheless') starts a new main clause, so the verb comes right after it: *Trotzdem sollten wir ...*. Unlike *obwohl*, it does not send the verb to the end.", example_gloss: "Debate: Nevertheless, we should first make a precise plan."}
  de.b1.unit50.lesson03.teach.felix_intro: {title: "Felix opens the topic", gloss: "Felix: I'd like to talk about the second location.", note: "Opens the debate."}
  de.b1.unit50.lesson03.teach.felix_full_argument: {title: "Felix's full nuanced argument", gloss: "Felix: Even though it's risky, I'm in favor of a second location. It's true that it costs a lot of money, but the opportunity is big.", note: "Combines the obwohl-concession from lesson01 with the zwar ... aber contrast."}
  de.b1.unit50.lesson03.teach.anna_concede_agree: {title: "Anna concedes and agrees", gloss: "Anna: Even though I have concerns, I agree with you in the end.", note: "Anna's concession and restated agreement from lesson02."}
  de.b1.unit50.lesson03.teach.anna_trotzdem: {title: "Anna adds a condition", gloss: "Anna: Nevertheless, we should first make a precise plan.", note: "Anna's trotzdem-restatement from lesson02, closing the debate with a condition."}

exercises:
  de.b1.unit50.lesson01.exercise01.recognize_felix_obwohl_filiale: {instruction: "Which German sentence means \"Even though it's risky, I'm in favor of a second location.\"?", correct_option: "Obwohl es riskant ist, bin ich für eine zweite Filiale.", distractors: ["Obwohl es riskant ist, bin ich gegen eine zweite Filiale.", "Zwar ist es riskant, aber ich bin nicht für eine zweite Filiale.", "Obwohl es teuer ist, bin ich für eine zweite Filiale."], accepted_answers: [{value: "Obwohl es riskant ist, bin ich für eine zweite Filiale.", status: "correct"}], feedback: "*Obwohl* concedes the risk before restating support for the idea."}
  de.b1.unit50.lesson01.exercise02.recognize_felix_zwar_aber: {instruction: "Which German sentence means \"It's true that it costs a lot of money, but the opportunity is big.\"?", correct_option: "Zwar kostet es viel Geld, aber die Chance ist groß.", distractors: ["Obwohl es viel Geld kostet, ist die Chance klein.", "Zwar ist die Chance groß, aber es kostet kein Geld.", "Zwar kostet es nicht viel Geld, aber die Chance ist groß."], accepted_answers: [{value: "Zwar kostet es viel Geld, aber die Chance ist groß.", status: "correct"}], feedback: "*Zwar ..., aber ...* concedes a point and then contrasts it with the main point."}
  de.b1.unit50.lesson01.exercise03.listen_select_obwohl: {instruction: "Listen. What does Felix concede before stating his position?", correct_option: "He concedes it's risky, but he still supports a second location.", distractors: ["He concedes it's too expensive, so he's against it.", "He concedes nothing and simply agrees.", "He concedes it's risky and changes his mind."], accepted_answers: [{value: "He concedes it's risky, but he still supports a second location.", status: "correct"}], feedback: "The recording says *Obwohl es riskant ist, bin ich für eine zweite Filiale*."}
  de.b1.unit50.lesson01.exercise04.match_obwohl_zwar_aber:
    instruction: "Match each German word or phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "Obwohl es riskant ist, bin ich für eine zweite Filiale.", right: "Even though it's risky, I'm in favor of a second location."}
          - {left: "Zwar kostet es viel Geld, aber die Chance ist groß.", right: "It's true that it costs a lot of money, but the opportunity is big."}
          - {left: "obwohl", right: "even though / although"}
          - {left: "riskant", right: "risky"}
          - {left: "die Filiale", right: "the branch / location"}
          - {left: "die Chance", right: "the opportunity / chance"}
        status: "correct"
    feedback: "These pieces build a nuanced, conceded-but-restated position."
  de.b1.unit50.lesson01.exercise05.order_felix_obwohl_filiale: {instruction: "Put the words in order to say \"Even though it's risky, I'm in favor of a second location.\"", accepted_answers: [{value: ["Obwohl", "es", "riskant", "ist,", "bin", "ich", "für", "eine", "zweite", "Filiale."], status: "correct"}], feedback: "The correct order is *Obwohl es riskant ist, bin ich für eine zweite Filiale.*"}
  de.b1.unit50.lesson01.exercise06.write_felix_obwohl_filiale:
    instruction: "As Felix, state your position exactly with Obwohl ..., bin ich für ...: even though it's risky, you're in favor of a second location."
    accepted_answers:
      - {value: "Obwohl es riskant ist, bin ich für eine zweite Filiale.", status: "correct"}
      - {value: "Obwohl es riskant ist, bin ich fuer eine zweite Filiale.", status: "correct"}
      - {value: "Obwohl es riskant ist, bin ich für eine zweite Filiale", status: "correct"}
      - {value: "Obwohl es riskant ist, bin ich fuer eine zweite Filiale", status: "correct"}
      - {value: "Obwohl es riskant ist bin ich für eine zweite Filiale.", status: "correct"}
      - {value: "Obwohl es riskant ist bin ich fuer eine zweite Filiale.", status: "correct"}
      - {value: "Obwohl es riskant ist bin ich für eine zweite Filiale", status: "correct"}
      - {value: "Obwohl es riskant ist bin ich fuer eine zweite Filiale", status: "correct"}
    feedback: "The model answer is *Obwohl es riskant ist, bin ich für eine zweite Filiale.*"
  de.b1.unit50.lesson02.exercise01.recognize_anna_obwohl_bedenken: {instruction: "Which German sentence means \"Even though I have concerns, I agree with you in the end.\"?", correct_option: "Obwohl ich Bedenken habe, stimme ich Ihnen am Ende zu.", distractors: ["Obwohl ich Bedenken habe, stimme ich Ihnen nicht zu.", "Zwar habe ich Bedenken, aber ich stimme Ihnen nicht zu.", "Obwohl ich keine Bedenken habe, stimme ich Ihnen zu."], accepted_answers: [{value: "Obwohl ich Bedenken habe, stimme ich Ihnen am Ende zu.", status: "correct"}], feedback: "Anna concedes her concerns before restating agreement."}
  de.b1.unit50.lesson02.exercise02.recognize_anna_trotzdem_plan: {instruction: "Which German sentence means \"Nevertheless, we should first make a precise plan.\"?", correct_option: "Trotzdem sollten wir zuerst einen genauen Plan machen.", distractors: ["Trotzdem sollten wir keinen Plan machen.", "Obwohl wir einen Plan machen, ist es riskant.", "Trotzdem sollten wir später einen Plan machen."], accepted_answers: [{value: "Trotzdem sollten wir zuerst einen genauen Plan machen.", status: "correct"}], feedback: "*Trotzdem* restates a condition after the concession."}
  de.b1.unit50.lesson02.exercise03.listen_select_trotzdem: {instruction: "Listen. What does Anna say they should do first, despite her concerns?", correct_option: "She says they should first make a precise plan.", distractors: ["She says they should cancel the idea.", "She says they should open the location immediately.", "She says they should wait another year."], accepted_answers: [{value: "She says they should first make a precise plan.", status: "correct"}], feedback: "The recording says *Trotzdem sollten wir zuerst einen genauen Plan machen*."}
  de.b1.unit50.lesson02.exercise04.match_obwohl_trotzdem:
    instruction: "Match each German word or phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "Obwohl ich Bedenken habe, stimme ich Ihnen am Ende zu.", right: "Even though I have concerns, I agree with you in the end."}
          - {left: "Trotzdem sollten wir zuerst einen genauen Plan machen.", right: "Nevertheless, we should first make a precise plan."}
          - {left: "die Bedenken", right: "the concerns / reservations"}
          - {left: "zustimmen", right: "to agree"}
          - {left: "trotzdem", right: "nevertheless"}
          - {left: "der Plan", right: "the plan"}
        status: "correct"
