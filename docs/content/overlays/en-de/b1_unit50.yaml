      - {value: "Obwohl es riskant ist, bin ich fuer eine zweite Filiale. Zwar kostet es viel Geld, aber die Chance ist gross", status: "correct"}
      - {value: "Obwohl es riskant ist bin ich für eine zweite Filiale. Zwar kostet es viel Geld aber die Chance ist groß.", status: "correct"}
      - {value: "Obwohl es riskant ist bin ich fuer eine zweite Filiale. Zwar kostet es viel Geld aber die Chance ist gross.", status: "correct"}
