review: {status: "unreviewed", required_next_reviewer: "fresh_context_reviewer", notes: "Second unit of the de B1 completion wave (units 49-53). Needs fresh-context review."}

course:
  title: "German B1"
  description: "Learn B1-level German for debating with nuance -- conceding a valid point with obwohl before restating your position, and structuring a multi-point argument with zwar ... aber and trotzdem."

units:
  de.b1.unit50.einraeumungen: {title: "Concessions"}

lessons:
  de.b1.unit50.lesson01.obwohl_zwar_aber: {title: "Even though ... / It's true that ..., but ..."}
  de.b1.unit50.lesson02.obwohl_trotzdem: {title: "Even though ... / Nevertheless ..."}
  de.b1.unit50.lesson03.cafe_dialogue: {title: "Dialogue: The second location"}

teaching:
  de.b1.unit50.lesson01.teach.felix_obwohl_filiale: {title: "Felix concedes, then restates his position", gloss: "Felix: Even though it's risky, I'm in favor of a second location.", note: "*Obwohl* + verb-final clause concedes a valid point before restating your own position.", example_gloss: "Debate: Even though it's risky, I'm in favor of a second location."}
  de.b1.unit50.lesson01.teach.felix_zwar_aber: {title: "Felix structures a multi-point argument", gloss: "Felix: It's true that it costs a lot of money, but the opportunity is big.", note: "*Zwar ..., aber ...* (with inversion after zwar) is a stronger contrastive connector than a simple aber alone, used to structure a multi-point argument.", example_gloss: "Debate: It's true that it costs a lot of money, but the opportunity is big."}
  de.b1.unit50.lesson02.teach.anna_obwohl_bedenken: {title: "Anna concedes her own concerns", gloss: "Anna: Even though I have concerns, I agree with you in the end.", note: "Anna uses *obwohl* to concede her own concerns before restating agreement.", example_gloss: "Debate: Even though I have concerns, I agree with you in the end."}
  de.b1.unit50.lesson02.teach.anna_trotzdem_plan: {title: "Anna adds a nevertheless-restatement", gloss: "Anna: Nevertheless, we should first make a precise plan.", note: "*Trotzdem* (with inversion) restates a position or condition after a concession, similar in force to obwohl's restatement but standing on its own as a connector.", example_gloss: "Debate: Nevertheless, we should first make a precise plan."}
  de.b1.unit50.lesson03.teach.felix_intro: {title: "Felix opens the topic", gloss: "Felix: I'd like to talk about the second location.", note: "Opens the debate."}
  de.b1.unit50.lesson03.teach.felix_full_argument: {title: "Felix's full nuanced argument", gloss: "Felix: Even though it's risky, I'm in favor of a second location. It's true that it costs a lot of money, but the opportunity is big.", note: "Combines the concessive restatement from lesson01 with the zwar ... aber multi-point structure."}
  de.b1.unit50.lesson03.teach.anna_concede_agree: {title: "Anna concedes and agrees", gloss: "Anna: Even though I have concerns, I agree with you in the end.", note: "Anna's concession and restated agreement from lesson02."}
  de.b1.unit50.lesson03.teach.anna_trotzdem: {title: "Anna adds a condition", gloss: "Anna: Nevertheless, we should first make a precise plan.", note: "Anna's trotzdem-restatement from lesson02, closing the debate with a condition."}

exercises:
  de.b1.unit50.lesson01.exercise01.recognize_felix_obwohl_filiale: {instruction: "Which German sentence means \"Even though it's risky, I'm in favor of a second location.\"?", correct_option: "Obwohl es riskant ist, bin ich für eine zweite Filiale.", distractors: ["Obwohl es riskant ist, bin ich gegen eine zweite Filiale.", "Zwar ist es riskant, aber ich bin dagegen.", "Obwohl es teuer ist, bin ich für eine zweite Filiale."], accepted_answers: [{value: "Obwohl es riskant ist, bin ich für eine zweite Filiale.", status: "correct"}], feedback: "*Obwohl* concedes the risk before restating support for the idea."}
  de.b1.unit50.lesson01.exercise02.recognize_felix_zwar_aber: {instruction: "Which German sentence means \"It's true that it costs a lot of money, but the opportunity is big.\"?", correct_option: "Zwar kostet es viel Geld, aber die Chance ist groß.", distractors: ["Obwohl es viel Geld kostet, ist die Chance klein.", "Zwar ist die Chance groß, aber es kostet nichts.", "Zwar kostet es wenig Geld, aber die Chance ist groß."], accepted_answers: [{value: "Zwar kostet es viel Geld, aber die Chance ist groß.", status: "correct"}], feedback: "*Zwar ..., aber ...* structures a stronger multi-point contrast than aber alone."}
  de.b1.unit50.lesson01.exercise03.listen_select_obwohl: {instruction: "Listen. What does Felix concede before stating his position?", correct_option: "He concedes it's risky, but he still supports a second location.", distractors: ["He concedes it's too expensive, so he's against it.", "He concedes nothing and simply agrees.", "He concedes it's risky and changes his mind."], accepted_answers: [{value: "He concedes it's risky, but he still supports a second location.", status: "correct"}], feedback: "The recording says *Obwohl es riskant ist, bin ich für eine zweite Filiale*."}
  de.b1.unit50.lesson01.exercise04.match_obwohl_zwar_aber:
    instruction: "Match each German word or phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "Obwohl es riskant ist, bin ich für eine zweite Filiale.", right: "Even though it's risky, I'm in favor of a second location."}
          - {left: "Zwar kostet es viel Geld, aber die Chance ist groß.", right: "It's true that it costs a lot of money, but the opportunity is big."}
          - {left: "obwohl", right: "even though / although"}
          - {left: "riskant", right: "risky"}
          - {left: "die Filiale", right: "the branch / location"}
          - {left: "die Chance", right: "the opportunity / chance"}
        status: "correct"
    feedback: "These pieces build a nuanced, conceded-but-restated position."
  de.b1.unit50.lesson01.exercise05.order_felix_obwohl_filiale: {instruction: "Put the words in order to say \"Even though it's risky, I'm in favor of a second location.\"", accepted_answers: [{value: ["Obwohl", "es", "riskant", "ist,", "bin", "ich", "für", "eine", "zweite", "Filiale."], status: "correct"}], feedback: "The correct order is *Obwohl es riskant ist, bin ich für eine zweite Filiale.*"}
  de.b1.unit50.lesson01.exercise06.write_felix_obwohl_filiale:
    instruction: "As Felix, state your position exactly with Obwohl ..., bin ich für ...: even though it's risky, you're in favor of a second location."
    accepted_answers:
      - {value: "Obwohl es riskant ist, bin ich für eine zweite Filiale.", status: "correct"}
      - {value: "Obwohl es riskant ist, bin ich für eine zweite Filiale", status: "correct"}
      - {value: "Obwohl es riskant ist bin ich für eine zweite Filiale.", status: "correct"}
      - {value: "Obwohl es riskant ist bin ich für eine zweite Filiale", status: "correct"}
    feedback: "The model answer is *Obwohl es riskant ist, bin ich für eine zweite Filiale.*"
  de.b1.unit50.lesson02.exercise01.recognize_anna_obwohl_bedenken: {instruction: "Which German sentence means \"Even though I have concerns, I agree with you in the end.\"?", correct_option: "Obwohl ich Bedenken habe, stimme ich Ihnen am Ende zu.", distractors: ["Obwohl ich Bedenken habe, stimme ich Ihnen nicht zu.", "Zwar habe ich Bedenken, aber ich bin dagegen.", "Obwohl ich keine Bedenken habe, stimme ich Ihnen zu."], accepted_answers: [{value: "Obwohl ich Bedenken habe, stimme ich Ihnen am Ende zu.", status: "correct"}], feedback: "Anna concedes her concerns before restating agreement."}
  de.b1.unit50.lesson02.exercise02.recognize_anna_trotzdem_plan: {instruction: "Which German sentence means \"Nevertheless, we should first make a precise plan.\"?", correct_option: "Trotzdem sollten wir zuerst einen genauen Plan machen.", distractors: ["Trotzdem sollten wir keinen Plan machen.", "Obwohl wir einen Plan machen, ist es riskant.", "Trotzdem sollten wir später einen Plan machen."], accepted_answers: [{value: "Trotzdem sollten wir zuerst einen genauen Plan machen.", status: "correct"}], feedback: "*Trotzdem* restates a condition after the concession."}
  de.b1.unit50.lesson02.exercise03.listen_select_trotzdem: {instruction: "Listen. What does Anna say they should do first, despite her concerns?", correct_option: "She says they should first make a precise plan.", distractors: ["She says they should cancel the idea.", "She says they should open the location immediately.", "She says they should ask Herr Weber first."], accepted_answers: [{value: "She says they should first make a precise plan.", status: "correct"}], feedback: "The recording says *Trotzdem sollten wir zuerst einen genauen Plan machen*."}
  de.b1.unit50.lesson02.exercise04.match_obwohl_trotzdem:
    instruction: "Match each German word or phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "Obwohl ich Bedenken habe, stimme ich Ihnen am Ende zu.", right: "Even though I have concerns, I agree with you in the end."}
          - {left: "Trotzdem sollten wir zuerst einen genauen Plan machen.", right: "Nevertheless, we should first make a precise plan."}
          - {left: "das Bedenken", right: "the concern"}
          - {left: "zustimmen", right: "to agree"}
          - {left: "trotzdem", right: "nevertheless"}
          - {left: "der Plan", right: "the plan"}
        status: "correct"
    feedback: "These pieces build Anna's concession, agreement, and follow-up condition."
  de.b1.unit50.lesson02.exercise05.order_anna_obwohl_bedenken: {instruction: "Put the words in order to say \"Even though I have concerns, I agree with you in the end.\"", accepted_answers: [{value: ["Obwohl", "ich", "Bedenken", "habe,", "stimme", "ich", "Ihnen", "am", "Ende", "zu."], status: "correct"}], feedback: "The correct order is *Obwohl ich Bedenken habe, stimme ich Ihnen am Ende zu.*"}
  de.b1.unit50.lesson02.exercise06.write_anna_obwohl_bedenken:
    instruction: "As Anna, state your position exactly with Obwohl ich Bedenken habe, stimme ich Ihnen am Ende zu: even though you have concerns, you agree with him in the end."
    accepted_answers:
      - {value: "Obwohl ich Bedenken habe, stimme ich Ihnen am Ende zu.", status: "correct"}
      - {value: "Obwohl ich Bedenken habe, stimme ich Ihnen am Ende zu", status: "correct"}
      - {value: "Obwohl ich Bedenken habe stimme ich Ihnen am Ende zu.", status: "correct"}
      - {value: "Obwohl ich Bedenken habe stimme ich Ihnen am Ende zu", status: "correct"}
    feedback: "The model answer is *Obwohl ich Bedenken habe, stimme ich Ihnen am Ende zu.*"
  de.b1.unit50.lesson03.exercise01.choose_felix_intro: {instruction: "What does Felix want to discuss?", correct_option: "He wants to discuss the second location.", distractors: ["He wants to discuss the menu.", "He wants to discuss Anna's schedule.", "He wants to discuss the article about the cafe."], accepted_answers: [{value: "He wants to discuss the second location.", status: "correct"}], feedback: "Felix says *Ich möchte über die zweite Filiale sprechen*."}
  de.b1.unit50.lesson03.exercise02.choose_felix_full_argument: {instruction: "What is Felix's full argument?", correct_option: "He concedes it's risky, then restates support, adding it costs money but the opportunity is big.", distractors: ["He concedes it costs money and changes his mind against it.", "He states only that the opportunity is big, without any concession.", "He concedes the opportunity is small, then restates support anyway."], accepted_answers: [{value: "He concedes it's risky, then restates support, adding it costs money but the opportunity is big.", status: "correct"}], feedback: "Felix says *Obwohl es riskant ist, bin ich für eine zweite Filiale. Zwar kostet es viel Geld, aber die Chance ist groß*."}
  de.b1.unit50.lesson03.exercise03.listen_dialogue_einraeumungen: {instruction: "Listen to the dialogue. What does Anna concede before stating her own view?", correct_option: "She concedes she has concerns, then agrees in the end.", distractors: ["She concedes the idea is bad, then disagrees.", "She concedes nothing and simply disagrees.", "She concedes it's too expensive, then refuses."], accepted_answers: [{value: "She concedes she has concerns, then agrees in the end.", status: "correct"}], feedback: "Anna says *Obwohl ich Bedenken habe, stimme ich Ihnen am Ende zu*."}
  de.b1.unit50.lesson03.exercise04.match_dialogue_einraeumungen:
    instruction: "Match each German word or phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "Ich möchte über die zweite Filiale sprechen.", right: "I'd like to talk about the second location."}
          - {left: "Obwohl ich Bedenken habe, stimme ich Ihnen am Ende zu.", right: "Even though I have concerns, I agree with you in the end."}
          - {left: "Trotzdem sollten wir zuerst einen genauen Plan machen.", right: "Nevertheless, we should first make a precise plan."}
          - {left: "sprechen über", right: "to talk about"}
          - {left: "am Ende", right: "in the end"}
          - {left: "genau", right: "precise / exact"}
        status: "correct"
    feedback: "These pieces support the debate about the second location."
  de.b1.unit50.lesson03.exercise05.order_felix_intro: {instruction: "Put the words in order to say \"I'd like to talk about the second location.\"", accepted_answers: [{value: ["Ich", "möchte", "über", "die", "zweite", "Filiale", "sprechen."], status: "correct"}], feedback: "The correct order is *Ich möchte über die zweite Filiale sprechen.*"}
  de.b1.unit50.lesson03.exercise06.write_full_debate:
    instruction: "As Felix, debate the second location in exactly two sentences: (1) concede it's risky using Obwohl ..., then restate your support with bin ich für ...; (2) add a second point with Zwar ..., aber ...: it costs a lot of money, but the opportunity is big."
    accepted_answers:
      - {value: "Obwohl es riskant ist, bin ich für eine zweite Filiale. Zwar kostet es viel Geld, aber die Chance ist groß.", status: "correct"}
      - {value: "Obwohl es riskant ist, bin ich für eine zweite Filiale. Zwar kostet es viel Geld, aber die Chance ist groß", status: "correct"}
      - {value: "Obwohl es riskant ist bin ich für eine zweite Filiale. Zwar kostet es viel Geld aber die Chance ist groß.", status: "correct"}
      - {value: "Obwohl es riskant ist bin ich für eine zweite Filiale. Zwar kostet es viel Geld aber die Chance ist groß", status: "correct"}
    feedback: "A complete answer concedes the risk, restates support, then adds the cost/opportunity contrast: *Obwohl es riskant ist, bin ich für eine zweite Filiale. Zwar kostet es viel Geld, aber die Chance ist groß.*"
