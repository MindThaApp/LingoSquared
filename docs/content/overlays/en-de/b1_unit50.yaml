  de.b1.unit50.lesson02.exercise05.order_anna_obwohl_bedenken: {instruction: "Put the words in order to say \"Even though I have concerns, I agree with you in the end.\"", accepted_answers: [{value: ["Obwohl", "ich", "Bedenken", "habe,", "stimme", "ich", "Ihnen", "am", "Ende", "zu."], status: "correct"}], feedback: "The correct order is *Obwohl ich Bedenken habe, stimme ich Ihnen am Ende zu.*"}
  de.b1.unit50.lesson02.exercise06.write_anna_obwohl_bedenken:
    instruction: "As Anna, state your position in German with an obwohl-clause first and formal Sie: Even though I have concerns, I agree with you in the end."
