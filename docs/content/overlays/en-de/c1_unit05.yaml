review:
  status: reviewed
  required_next_reviewer: native_speaker_pass
  notes: >-
    Overlay for German's fifth C1 unit, authored alongside the realization
    (no adaptable public-domain German C1 counterfactual source exists; see the
    realization provenance note). English speakers' real interference risks for
    this outcome: (1) English expresses the past counterfactual with a single
    would-have + past-participle shape, where German uses Konjunktiv II of
    haben/sein (haette/waere) plus the Partizip II in BOTH clauses; each clause
    is glossed separately. (2) The mixed conditional (past unreal condition ->
    present consequence) has no direct English one-word marker, so the glosses
    pin the cross-time reference explicitly (damals in the condition, heute in
    the consequence). (3) Regret has several German verbs (bedauern, bereuen)
    plus the idiomatic es wäre besser gewesen, so each is glossed to one
    English expression. (4) The culminating speaking AND writing prompts name
    the exact analysis to produce (past counterfactual, mixed conditional with a
    present consequence, and a regret) so a correct answer is well-determined.
    No sibling-direction file (de-en) was consulted.

    Fresh-context review 2026-10-11 (content-reviewer.md checklist): see the
    realization review note for the full list. Overlay changes: accepted
    answers widened for lesson04.exercise05, lesson04.exercise07,
    lesson05.exercise05, lesson01.exercise07; lesson04.exercise07 instruction
    re-pinned to sich für ... entscheiden; lesson06.teach.analyse_muster gloss
    now translates its text.

    Second-pass review 2026-10-19: 5 fixes -- lesson05.exercise06/07 and
    lesson06.exercise05/06: instructions pin the required forms (Hätten wir
    ... / Ich bedauere, dass ... gewählt haben; lesson06 also Wenn ...
    entschieden hätten, hätten ...), mirroring the realization prompts, so
    equally correct Wenn-form / bereuen / entschieden-für answers are no
    longer invited and then graded wrong;
    lesson06.exercise01.listen_vogel_vergangenheit: distractor 'They would
    have spent more money.' -> 'They would have moved to a new office.' (the
    old one was a defensible inference from choosing the more expensive
    system).

course:
  title: German C1
  description: >-
    Advanced German: reason about unreal and counterfactual situations --
    mixed conditionals, hypothetical consequences, and regrets -- describing
    how things could or would have been different, in formal register.

units:
  de.c1.unit05.was_waere_gewesen_wenn:
    title: "What would have been, if ..."
    description: "Reason counterfactually about a past decision -- separate what actually happened from what would have been different, and express regret, using past and mixed unreal conditionals in formal German."

lessons:
  de.c1.unit05.lesson01.das_irreale_bedingungsgefuege:
    title: "The unreal past conditional"
  de.c1.unit05.lesson02.das_gemischte_bedingungsgefuege:
    title: "The mixed conditional"
  de.c1.unit05.lesson03.das_bedauern:
    title: "Regret"
  de.c1.unit05.lesson04.die_kontrafaktische_kette:
    title: "Tracing the counterfactual chain"
  de.c1.unit05.lesson05.kontrafaktisch_begruenden:
    title: "Reasoning counterfactually"
  de.c1.unit05.lesson06.die_vollstaendige_analyse:
    title: "The complete analysis"

teaching:
  de.c1.unit05.lesson01.teach.wenn_damals_anders:
    title: "If we had decided differently back then, ..."
    gloss: "if we had decided differently back then, ..."
    note: "*Wenn wir uns damals anders entschieden hätten, ...* = 'If we had decided differently back then, ...'. The past unreal condition: *wenn* + *hätten* + *entschieden* (Partizip II). The verb-final *hätten* carries the Konjunktiv II, marking the whole condition as unreal -- it did not actually happen."
  de.c1.unit05.lesson01.teach.haetten_keine_probleme:
    title: "... we would not have had these problems."
    gloss: "..., we would not have had these problems."
    note: "*..., hätten wir diese Probleme nicht gehabt.* = '..., we would not have had these problems.' The main clause: *hätten* + *gehabt* (Partizip II) -- the past Konjunktiv II result. Both clauses carry *hätten*, one in each half."
  de.c1.unit05.lesson01.teach.wenn_gewusst:
    title: "If I had known that earlier, ..."
    gloss: "if I had known that earlier, ..."
    note: "*Wenn ich das früher gewusst hätte, ...* = 'If I had known that earlier, ...'. The same pattern with a different verb: *gewusst* (Partizip II of *wissen*) + *hätte*."
  de.c1.unit05.lesson01.teach.waere_anders_gekommen:
    title: "It would have turned out differently."
    gloss: "It would have turned out differently."
    note: "*Es wäre anders gekommen.* = 'It would have turned out differently.' For verbs that take *sein* (like *kommen*), the auxiliary is *wäre*, not *hätte*: *wäre* + *gekommen*."
  de.c1.unit05.lesson01.teach.das_teurere_system:
    title: "the more expensive system"
    gloss: "the more expensive system"
    note: "*Das teurere System* = the more expensive system. *Teurer* (comparative of *teuer*) -- the system they did NOT choose."
    example_gloss: "The more expensive system would be better."
  de.c1.unit05.lesson01.teach.die_entscheidung:
    title: "the decision"
    gloss: "the decision"
    note: "*Die Entscheidung* = the decision. The noun from *entscheiden* (to decide); the act whose alternatives the unit reasons about."
    example_gloss: "The decision was wrong."
  de.c1.unit05.lesson01.teach.vergangenheit_muster:
    title: "The past unreal conditional model"
    gloss: "If we had decided on the more expensive system back then, we would not have had these problems."
    note: "The full past counterfactual: *Wenn ... entschieden hätten, hätten ... nicht gehabt*. Both clauses use Konjunktiv II of *haben* (*hätten*) plus a Partizip II; the whole thing is unreal -- it describes a past that did not happen."

  de.c1.unit05.lesson02.teach.haetten_anders:
    title: "Had we decided differently back then, ..."
    gloss: "had we decided differently back then, ..."
    note: "*Hätten wir uns damals anders entschieden, ...* = 'Had we decided differently back then, ...'. The verb-first unreal condition is a formal equivalent of the *wenn*-clause: *Hätten wir ... entschieden* = *Wenn wir ... entschieden hätten*."
  de.c1.unit05.lesson02.teach.waeren_heute_zufriedener:
    title: "... we would be more satisfied today."
    gloss: "..., we would be more satisfied today."
    note: "*..., wären wir heute zufriedener.* = '..., we would be more satisfied today.' The consequence is in the PRESENT (*heute* + *wären*), even though the condition is in the past -- this is the mixed conditional."
  de.c1.unit05.lesson02.teach.wenn_gewaehlt:
    title: "If we had chosen the other system, ..."
    gloss: "if we had chosen the other system, ..."
    note: "*Wenn wir das andere System gewählt hätten, ...* = 'If we had chosen the other system, ...'. *Gewählt* (Partizip II of *wählen*) + *hätten* -- another past unreal condition."
  de.c1.unit05.lesson02.teach.zufrieden:
    title: "satisfied"
    gloss: "satisfied"
    note: "*Zufrieden* = satisfied. The state the mixed conditional predicts: today they would be *zufriedener* (more satisfied)."
    example_gloss: "We are satisfied with the work."
  de.c1.unit05.lesson02.teach.die_ausfaelle:
    title: "the outages"
    gloss: "the outages"
    note: "*Die Ausfälle* = the outages (from *der Ausfall*). The present-day problem caused by the past decision -- the real consequence the counterfactual reverses."
    example_gloss: "The outages cost us time."
  de.c1.unit05.lesson02.teach.das_guenstigere_system:
    title: "the cheaper system"
    gloss: "the cheaper system"
    note: "*Das günstigere System* = the cheaper system. The system they DID choose -- the anchor of the real (non-counterfactual) timeline."
    example_gloss: "The cheaper system was a mistake."
  de.c1.unit05.lesson02.teach.gemischt_muster:
    title: "The mixed conditional model"
    gloss: "Had we decided differently back then, we would be more satisfied today."
    note: "*Hätten wir uns damals anders entschieden, wären wir heute zufriedener.* The past unreal condition (*damals ... entschieden*) links to a present consequence (*heute ... zufriedener*): a past decision changes how things are now."

  de.c1.unit05.lesson03.teach.ich_bedauere:
    title: "I regret that ..."
    gloss: "I regret that ..."
    note: "*Ich bedauere, dass ...* = 'I regret that ...'. The explicit performative verb of regret, followed by a verb-final *dass*-clause in the indicative."
  de.c1.unit05.lesson03.teach.ich_bereue:
    title: "I rue that ..."
    gloss: "I rue that ..."
    note: "*Ich bereue, dass ...* = 'I rue that / I am sorry that ...'. *Bereuen* is the stronger, more personal verb of regret; *bedauern* is the neutral, polite one."
  de.c1.unit05.lesson03.teach.es_waere_besser_gewesen:
    title: "It would have been better if ..."
    gloss: "it would have been better if ..."
    note: "*Es wäre besser gewesen, wenn ...* = 'It would have been better if ...'. A regret phrased as a counterfactual judgement: *wäre ... gewesen* + *wenn* + past subjunctive."
  de.c1.unit05.lesson03.teach.im_nachhinein:
    title: "In hindsight ..."
    gloss: "in hindsight ..."
    note: "*Im Nachhinein ...* = 'in hindsight'. The frame that signals reflection on a past decision; it often introduces a regret."
  de.c1.unit05.lesson03.teach.bedauern:
    title: "to regret"
    gloss: "to regret"
    note: "*Bedauern* = to regret. The infinitive behind *Ich bedauere, dass ...* -- the neutral verb for acknowledging a past mistake."
    example_gloss: "I regret the decision."
  de.c1.unit05.lesson03.teach.investiert:
    title: "to invest"
    gloss: "to invest"
    note: "*Investieren* = to invest. In the counterfactual *hätten ... investiert* it names the money they did not spend."
    example_gloss: "We would have invested more."
  de.c1.unit05.lesson03.teach.bedauern_muster:
    title: "The regret model"
    gloss: "I regret that we decided on the cheaper system back then."
    note: "*Ich bedauere, dass wir uns damals für das günstigere System entschieden haben.* The regret names the actual (real) past decision, then the *dass*-clause states it in the indicative -- regret is about what really happened."

  de.c1.unit05.lesson04.teach.kontrafaktisch:
    title: "counterfactual"
    gloss: "counterfactual"
    note: "*Kontrafaktisch* = counterfactual -- contrary to fact. A *kontrafaktische Aussage* describes what did not happen."
    example_gloss: "That is a counterfactual statement."
  de.c1.unit05.lesson04.teach.die_wirklichkeit:
    title: "reality"
    gloss: "reality"
    note: "*Die Wirklichkeit* = reality -- the actual course of events, kept distinct from every hypothetical alternative."
    example_gloss: "Reality looks different."
  de.c1.unit05.lesson04.teach.tatsaechlich:
    title: "actually"
    gloss: "actually"
    note: "*Tatsächlich* = actually, in fact. The adverb that marks the real (non-counterfactual) claim."
    example_gloss: "That actually happened."
  de.c1.unit05.lesson04.teach.die_konsequenz:
    title: "the consequence"
    gloss: "the consequence"
    note: "*Die Konsequenz* = the consequence. The result that follows from a condition -- in a mixed conditional, a present consequence from a past condition."
    example_gloss: "The consequence was an outage."
  de.c1.unit05.lesson04.teach.lese_kette:
    title: "A counterfactual chain"
    gloss: "We chose the cheaper system last year. Today we have constant outages, and the colleagues are frustrated. If we had decided on the more expensive system back then, we would not have had these problems. Had we decided differently back then, we would be more satisfied today. I regret that we did not invest more."
    note: "A complete counterfactual chain. Separate the real timeline (chose the cheaper system, now outages and frustration) from the unreal alternatives (the past counterfactual and the mixed conditional) and the regret."
  de.c1.unit05.lesson04.teach.kette_muster:
    title: "Keep the three moves separate"
    gloss: "Keep fact, unreal alternative, and regret separate."
    note: "*Tatsache, irreale Alternative und Bedauern getrennt halten.* When you trace a counterfactual passage, name the fact, each hypothetical alternative, and the regret as three distinct things."

  de.c1.unit05.lesson05.teach.wenn_anders_haetten:
    title: "If we had decided differently back then, ..."
    gloss: "if we had decided differently back then, ..."
    note: "*Wenn wir uns damals anders entschieden hätten, ...* -- the past unreal condition that opens the counterfactual account."
  de.c1.unit05.lesson05.teach.waeren_heute:
    title: "... we would be in a better situation today."
    gloss: "..., we would be in a better situation today."
    note: "*..., wären wir heute in einer besseren Lage.* = '..., we would be in a better situation today.' *In einer besseren Lage* = 'in a better situation' -- the present consequence of the past alternative."
  de.c1.unit05.lesson05.teach.die_lage:
    title: "the situation"
    gloss: "the situation"
    note: "*Die Lage* = the situation, the state of affairs. The present situation that the counterfactual claims would be different."
    example_gloss: "The situation was unclear back then."
  de.c1.unit05.lesson05.teach.haette_man:
    title: "Had one known that back then, ..."
    gloss: "had one known that back then, ..."
    note: "*Hätte man das damals gewusst, ...* = 'Had one known that back then, ...'. The impersonal *man* (one) generalizes the counterfactual beyond *wir*."
  de.c1.unit05.lesson05.teach.rueckblickend:
    title: "in retrospect"
    gloss: "in retrospect"
    note: "*Rückblickend* = in retrospect. A near-synonym of *im Nachhinein* -- both frame a regret from a later vantage point."
    example_gloss: "In retrospect the decision was wrong."
  de.c1.unit05.lesson05.teach.begruendung_muster:
    title: "The counterfactual account model"
    gloss: "Had we decided differently back then, we would be more satisfied today. I regret that we chose the cheaper system."
    note: "The two-move account: a mixed conditional (past decision -> present consequence) followed by an explicit regret (*Ich bedauere, dass ...*). This is the speaking requirement of the outcome."

  de.c1.unit05.lesson06.teach.vogel_vergangenheit:
    title: "Frau Vogel: If we had decided on the more expensive system back then, we would have no outages today."
    gloss: "If we had decided on the more expensive system back then, we would have no outages today."
    note: "Frau Vogel opens with a mixed counterfactual: the past unreal condition (*entschieden hätten*) leads to a present consequence (*heute keine Ausfälle*)."
  de.c1.unit05.lesson06.teach.felix_gemischt:
    title: "Felix: That is true. Had we decided differently back then, we would be more satisfied today."
    gloss: "That is true. Had we decided differently back then, we would be more satisfied today."
    note: "Felix agrees, then states the mixed conditional in full: past condition (*damals anders entschieden*) -> present consequence (*heute zufriedener*)."
  de.c1.unit05.lesson06.teach.vogel_bedauern:
    title: "Frau Vogel: I regret that we chose the cheaper system."
    gloss: "I regret that we chose the cheaper system."
    note: "Frau Vogel states the regret explicitly: *Ich bedauere, dass wir das günstigere System gewählt haben* -- a genuine expression of regret about the real decision."
  de.c1.unit05.lesson06.teach.felix_besser_gewesen:
    title: "Felix: It would have been better if we had invested more."
    gloss: "It would have been better if we had invested more."
    note: "Felix agrees with the regret, phrased as a counterfactual judgement: *Es wäre besser gewesen, wenn wir mehr investiert hätten*."
  de.c1.unit05.lesson06.teach.analyse_muster:
    title: "The complete analysis"
    gloss: "If we had decided on the more expensive system back then, we would not have had these problems. Had we decided differently back then, we would be more satisfied today. I regret that we chose the cheaper system."
    note: "The full three-move analysis in order: a past counterfactual (*Wenn ... entschieden hätten, hätten ... nicht gehabt*), a mixed conditional (*Hätten ... entschieden, wären ... zufriedener*), and a regret (*Ich bedauere, dass ...*)."

exercises:
  de.c1.unit05.lesson01.exercise01.recognize_damals:
    instruction: "What does damals refer to?"
    correct_option: "A past point in time -- back then."
    distractors: ["A future point in time.", "The present moment.", "An unspecified place."]
    accepted_answers: [{value: "A past point in time -- back then.", status: correct}]
    feedback: "*Damals* anchors the unreal condition in a specific past time -- the moment the decision was made."
  de.c1.unit05.lesson01.exercise02.listen_vergangenheit:
    instruction: "Listen and select the meaning of the sentence."
    correct_option: "If we had decided on the more expensive system back then, we would not have had these problems."
    distractors: ["We decided on the more expensive system and it solved our problems.", "The cheaper system is working perfectly.", "We will decide on a new system soon."]
    accepted_answers: [{value: "If we had decided on the more expensive system back then, we would not have had these problems.", status: correct}]
    feedback: "*Wenn wir uns damals für das teurere System entschieden hätten, hätten wir diese Probleme nicht gehabt* -- a past unreal conditional: it did not actually happen."
  de.c1.unit05.lesson01.exercise03.match_vergangenheit:
    instruction: "Match each German past-counterfactual element to its meaning."
    accepted_answers:
      - value: {"damals": "back then (at that past time)", "anders": "differently", "entschieden hätten": "would have decided (unreal past)", "gewusst hätte": "would have known (unreal past)", "das teurere System": "the more expensive system", "die Entscheidung": "the decision"}
        status: correct
    feedback: "The building blocks of the past unreal conditional -- time marker, alternative, and the Konjunktiv II + Partizip II verb forms."
  de.c1.unit05.lesson01.exercise04.order_vergangenheit:
    instruction: "Put the German words in order to form the unreal past condition."
    accepted_answers:
      - {value: "Wenn wir uns damals anders entschieden hätten", status: correct}
    feedback: "*Wenn wir uns damals anders entschieden hätten* -- the unreal past condition, with *hätten* last in the clause."
  de.c1.unit05.lesson01.exercise05.translate_vergangenheit:
    instruction: "Translate into German, using Wenn ... entschieden hätten, hätten ...: If we had decided on the more expensive system back then, we would not have had these problems."
    accepted_answers:
      - {value: "Wenn wir uns damals für das teurere System entschieden hätten, hätten wir diese Probleme nicht gehabt", status: correct}
      - {value: "Wenn wir uns damals für das teurere System entschieden hätten, hätten wir diese Probleme nicht gehabt.", status: correct}
      - {value: "Wenn wir uns damals fuer das teurere System entschieden haetten, haetten wir diese Probleme nicht gehabt", status: correct}
      - {value: "Wenn wir uns damals fuer das teurere System entschieden haetten, haetten wir diese Probleme nicht gehabt.", status: correct}
    feedback: "*Wenn wir uns damals für das teurere System entschieden hätten, hätten wir diese Probleme nicht gehabt* -- the full past counterfactual."
  de.c1.unit05.lesson01.exercise06.speak_vergangenheit:
    instruction: "Say aloud in German, using Wenn ... entschieden hätten, hätten ...: If we had decided on the more expensive system back then, we would not have had these problems."
    accepted_answers:
      - {value: "Wenn wir uns damals für das teurere System entschieden hätten, hätten wir diese Probleme nicht gehabt", status: correct}
      - {value: "Wenn wir uns damals für das teurere System entschieden hätten, hätten wir diese Probleme nicht gehabt.", status: correct}
      - {value: "Wenn wir uns damals fuer das teurere System entschieden haetten, haetten wir diese Probleme nicht gehabt", status: correct}
      - {value: "Wenn wir uns damals fuer das teurere System entschieden haetten, haetten wir diese Probleme nicht gehabt.", status: correct}
    feedback: "Spoken, both *hätten* clauses still carry the Konjunktiv II -- the tone is reflective, not defensive."
  de.c1.unit05.lesson01.exercise07.write_vergangenheit:
    instruction: "Write in German, using Wenn ich ... gewusst hätte, hätte ich ...: If I had known that earlier, I would have decided differently."
    accepted_answers:
      - {value: "Wenn ich das früher gewusst hätte, hätte ich anders entschieden", status: correct}
      - {value: "Wenn ich das früher gewusst hätte, hätte ich anders entschieden.", status: correct}
      - {value: "Wenn ich das frueher gewusst haette, haette ich anders entschieden", status: correct}
      - {value: "Wenn ich das frueher gewusst haette, haette ich anders entschieden.", status: correct}
      - {value: "Wenn ich das früher gewusst hätte, hätte ich mich anders entschieden", status: correct}
      - {value: "Wenn ich das früher gewusst hätte, hätte ich mich anders entschieden.", status: correct}
      - {value: "Wenn ich das frueher gewusst haette, haette ich mich anders entschieden", status: correct}
      - {value: "Wenn ich das frueher gewusst haette, haette ich mich anders entschieden.", status: correct}
    feedback: "*Wenn ich das früher gewusst hätte, hätte ich anders entschieden* -- the same pattern applied to a personal regret."

  de.c1.unit05.lesson02.exercise01.recognize_zufriedener:
    instruction: "What does wären wir heute zufriedener mean?"
    correct_option: "We would be more satisfied today (a present consequence of a past alternative)."
    distractors: ["We are satisfied today.", "We were more satisfied in the past.", "We will be more satisfied tomorrow."]
    accepted_answers: [{value: "We would be more satisfied today (a present consequence of a past alternative).", status: correct}]
    feedback: "*Wären wir heute zufriedener* is the PRESENT consequence of the past unreal condition -- the mixed conditional's second half."
  de.c1.unit05.lesson02.exercise02.listen_gemischt:
    instruction: "Listen and select the meaning of the sentence."
    correct_option: "Had we decided differently back then, we would be more satisfied today."
    distractors: ["We decided differently back then and are now unhappy.", "We are satisfied with today's decision.", "We will decide differently tomorrow."]
    accepted_answers: [{value: "Had we decided differently back then, we would be more satisfied today.", status: correct}]
    feedback: "*Hätten wir uns damals anders entschieden, wären wir heute zufriedener* -- a past condition with a present consequence."
  de.c1.unit05.lesson02.exercise03.match_gemischt:
    instruction: "Match each German mixed-conditional element to its meaning."
    accepted_answers:
      - value: {"Hätten ... entschieden, ...": "had (we) decided ... (unreal condition, verb first)", "wären ... zufriedener": "would be ... more satisfied", "gewählt hätte": "would have chosen (unreal past)", "zufrieden": "satisfied", "die Ausfälle": "the outages", "das günstigere System": "the cheaper system"}
        status: correct
    feedback: "The mixed conditional pairs a past condition (*damals entschieden*) with a present consequence (*heute zufriedener*)."
  de.c1.unit05.lesson02.exercise04.order_gemischt:
    instruction: "Put the German words in order to form the mixed conditional."
    accepted_answers:
      - {value: "Hätten wir uns damals anders entschieden wären wir heute zufriedener", status: correct}
    feedback: "*Hätten wir uns damals anders entschieden, wären wir heute zufriedener* -- past condition, present consequence."
  de.c1.unit05.lesson02.exercise05.translate_gemischt:
    instruction: "Translate into German, starting with Hätten wir: Had we decided differently back then, we would be more satisfied today."
    accepted_answers:
      - {value: "Hätten wir uns damals anders entschieden, wären wir heute zufriedener", status: correct}
      - {value: "Hätten wir uns damals anders entschieden, wären wir heute zufriedener.", status: correct}
      - {value: "Haetten wir uns damals anders entschieden, waeren wir heute zufriedener", status: correct}
      - {value: "Haetten wir uns damals anders entschieden, waeren wir heute zufriedener.", status: correct}
    feedback: "*Hätten wir uns damals anders entschieden, wären wir heute zufriedener* -- the verb-first unreal condition and its present consequence."
  de.c1.unit05.lesson02.exercise06.speak_gemischt:
    instruction: "Say aloud in German, starting with Hätten wir: Had we decided differently back then, we would be more satisfied today."
    accepted_answers:
      - {value: "Hätten wir uns damals anders entschieden, wären wir heute zufriedener", status: correct}
      - {value: "Hätten wir uns damals anders entschieden, wären wir heute zufriedener.", status: correct}
