review: {"status": "unreviewed", "required_next_reviewer": "native_speaker_review", "notes": "English overlay for the starting, stopping, trying and forgetting unit (anfangen, aufhoeren, versuchen, vergessen with zu plus infinitive). OPEN NATIVE QUESTIONS: none beyond the realization notes."}
course:
  title: "German A2"
  description: "Grammar-led A2 German continuing the Anna and Felix storyline."
  learning_goal: "Make predictions, follow rules, state what you can do, ask politely, give advice and talk about habits in German."
units:
  de.a2.unit108.anfangen_aufhoeren: {"title": "I Have Started", "description": "Say what you started, stopped, tried or forgot to do, using anfangen, aufhören, versuchen and vergessen with zu plus infinitive."}
lessons:
  de.a2.unit108.lesson01.anfangen: {"title": "I Have Started to Jog"}
  de.a2.unit108.lesson02.aufhoeren: {"title": "I Have Stopped Smoking"}
  de.a2.unit108.lesson03.versuchen_vergessen: {"title": "Tried and Forgotten"}
  de.a2.unit108.lesson04.nicht_mehr_wieder: {"title": "Not Any More and Again"}
  de.a2.unit108.lesson05.gewohnheiten: {"title": "New Habits"}
  de.a2.unit108.lesson06.am_morgen: {"title": "Anna and Felix Talk"}
teaching:
  de.a2.unit108.lesson01.teach.sport: {"title": "Starting something", "gloss": "to start / to jog / yoga / to do sport / every morning", "example_gloss": ["I have started to jog.", "Felix has started to do yoga.", "Nina has started with yoga.", "I'm starting tomorrow."], "note": "*Anfangen* is separable: *ich fange an*, but *ich habe angefangen*."}
  de.a2.unit108.lesson01.teach.gn_anfangen: {"title": "Anfangen in the present", "gloss": "I start, you start, he starts, we start, you (plural) start, they start", "note": "*Anfangen* has a stem change in *du* and *er*: *fängst, fängt*. The prefix *an* goes to the end."}
  de.a2.unit108.lesson01.teach.gn_zu: {"title": "Anfangen plus zu", "gloss": "I have started to jog. Felix has started to do yoga.", "note": "After *anfangen* the second verb is an infinitive with *zu*, placed at the end. Longer infinitive groups are usually set off with a comma."}
  de.a2.unit108.lesson01.teach.gn_mit: {"title": "Anfangen mit", "gloss": "I have started with yoga. Nina has started with sport.", "note": "You can also start *mit* + a noun in the dative."}
  de.a2.unit108.lesson02.teach.aufhoeren: {"title": "Stopping something", "gloss": "to stop / to smoke / to eat chocolate / phone / in the evening / to play", "example_gloss": ["I have stopped smoking.", "Felix has stopped eating chocolate.", "Jonas has stopped playing on his phone in the evening.", "I have stopped smoking."], "note": "*Aufhören* is separable: *ich höre auf*, *ich habe aufgehört*."}
  de.a2.unit108.lesson02.teach.gn_aufhoeren: {"title": "Aufhören in the present", "gloss": "I stop, you stop, he stops, we stop, you (plural) stop, they stop", "note": "The prefix *auf* goes to the end. There is no stem change."}
  de.a2.unit108.lesson02.teach.gn_zu: {"title": "Aufhören plus zu", "gloss": "I have stopped smoking. He has stopped eating chocolate.", "note": "Just like *anfangen*, *aufhören* takes *zu* + infinitive."}
  de.a2.unit108.lesson02.teach.gn_mit: {"title": "Aufhören mit", "gloss": "I have stopped smoking.", "note": "The same idea with a noun: *mit dem Rauchen aufhören*."}
  de.a2.unit108.lesson03.teach.versuchen: {"title": "Trying and forgetting", "gloss": "to try / to forget / to get up early / to buy bread / to call / coffee / less", "example_gloss": ["Nina has tried to get up early.", "I forgot to buy bread.", "Anna forgot to call Felix.", "I'm trying to drink less coffee."], "note": "*Aufstehen*, *einkaufen* and *anrufen* are separable."}
  de.a2.unit108.lesson03.teach.gn_zu: {"title": "Versuchen and vergessen plus zu", "gloss": "I tried to get up early. I forgot to buy bread.", "note": "Both verbs take *zu* + infinitive, with a comma before the infinitive group."}
  de.a2.unit108.lesson03.teach.gn_trennbar: {"title": "Zu inside separable verbs", "gloss": "to get up, to buy, to call", "note": "With a separable verb, *zu* goes between the prefix and the verb and everything is written as one word: *auf-zu-stehen*."}
  de.a2.unit108.lesson03.teach.gn_praesens: {"title": "Present tense", "gloss": "I'm trying to drink less coffee. I often forget to drink water.", "note": "*Vergessen* has a stem change: *ich vergesse, du vergisst, er vergisst*."}
  de.a2.unit108.lesson04.teach.zeit: {"title": "When and how long", "gloss": "not any more / again / last week / for a month / now", "example_gloss": ["I don't smoke any more.", "I have started again.", "Last week I started to jog.", "I have been jogging every morning for a month."], "note": "*Seit* + dative plus the present tense says how long something has been going on."}
  de.a2.unit108.lesson04.teach.gn_nicht_mehr: {"title": "Nicht mehr", "gloss": "I don't smoke any more. I have stopped smoking.", "note": "*Nicht mehr* says the habit has ended."}
  de.a2.unit108.lesson04.teach.gn_seit: {"title": "Seit plus present tense", "gloss": "I have been jogging every morning for a month.", "note": "German uses the present tense with *seit* for something that began in the past and still continues."}
  de.a2.unit108.lesson04.teach.gn_wieder: {"title": "Wieder", "gloss": "I have started to do yoga again.", "note": "*Wieder* stands before the participle."}
  de.a2.unit108.lesson05.teach.januar: {"title": "Words for the story", "gloss": "in January / hard / but / to jog", "example_gloss": ["Felix started to jog in January.", "Getting up early is hard.", "He now jogs every morning."], "note": "Words for the story you will read."}
  de.a2.unit108.lesson05.teach.gn_text: {"title": "Four verbs in one story", "gloss": "Felix has started to jog. Jonas has stopped playing on his phone.", "note": "Read for the four verbs: *anfangen*, *aufhören*, *versuchen*, *vergessen*."}
  de.a2.unit108.lesson05.teach.lesen_gewohnheiten: {"title": "What my friends do now", "gloss": "Felix started to jog in January. He now jogs every morning. Nina has tried to get up early, but that is hard. Jonas has stopped playing on his phone in the evening. Anna forgot to buy bread.", "note": "Four friends, four verbs: started, tried, stopped, forgot."}
  de.a2.unit108.lesson06.teach.anna_frage: {"title": "Anna asks", "gloss": "Anna: Hi Felix! What do you do every morning now?"}
  de.a2.unit108.lesson06.teach.felix_joggen: {"title": "Felix answers", "gloss": "Felix: I started to jog in January."}
  de.a2.unit108.lesson06.teach.anna_schwer: {"title": "Anna tells him", "gloss": "Anna: Great! I have tried to get up early, but that is hard."}
  de.a2.unit108.lesson06.teach.felix_handy: {"title": "Felix tells more", "gloss": "Felix: I have also stopped playing on my phone in the evening. Now I sleep better."}
  de.a2.unit108.lesson06.teach.anna_wirklich: {"title": "Anna is interested", "gloss": "Anna: Really? I would like to try that too."}
  de.a2.unit108.lesson06.teach.felix_helfen: {"title": "Felix offers help", "gloss": "Felix: Good idea! I'll help you."}
exercises:
  de.a2.unit108.lesson01.exercise01.wahl_joggen: {"instruction": "Choose the correct German sentence.", "correct_option": "Ich habe angefangen zu joggen.", "distractors": ["Ich habe angefangen joggen.", "Ich habe anfangen zu joggen.", "Ich habe zu angefangen joggen."], "accepted_answers": [{"value": "Ich habe angefangen zu joggen.", "status": "correct"}], "feedback": "*Angefangen* + *zu joggen*."}
  de.a2.unit108.lesson01.exercise02.wahl_yoga: {"instruction": "Choose the correct German sentence.", "correct_option": "Felix hat angefangen, Yoga zu machen.", "distractors": ["Felix hat angefangen, Yoga machen zu.", "Felix hat angefangen, zu Yoga machen.", "Felix ist angefangen, Yoga zu machen."], "accepted_answers": [{"value": "Felix hat angefangen, Yoga zu machen.", "status": "correct"}], "feedback": "*Zu* stands directly before the infinitive."}
  de.a2.unit108.lesson01.exercise03.paare_formen: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "ich fange an", "right": "I start"}, {"left": "du fängst an", "right": "you start"}, {"left": "er fängt an", "right": "he starts"}, {"left": "wir fangen an", "right": "we start"}, {"left": "ihr fangt an", "right": "you (plural) start"}, {"left": "sie fangen an", "right": "they start"}], "status": "correct"}], "feedback": "fange, fängst, fängt, fangen, fangt, fangen."}
  de.a2.unit108.lesson01.exercise04.ordnen_morgen: {"instruction": "Put the words in order to say 'I'm starting tomorrow.'", "correct_option": "Ich fange morgen an", "accepted_answers": [{"value": "Ich fange morgen an", "status": "correct"}], "feedback": "The prefix *an* goes last."}
  de.a2.unit108.lesson01.exercise05.luecke_angefangen: {"instruction": "Complete with the participle.", "correct_option": "angefangen", "accepted_answers": [{"value": "angefangen", "status": "correct"}], "feedback": "*Haben* + *angefangen*."}
  de.a2.unit108.lesson01.exercise06.uebersetzen_nina: {"instruction": "Translate into German.", "accepted_answers": [{"value": "Nina hat mit Yoga angefangen.", "status": "correct"}], "feedback": "*Mit Yoga*."}
  de.a2.unit108.lesson01.exercise07.schreiben_sport: {"instruction": "Write the requested German sentence.", "correct_option": "Ich habe angefangen, Sport zu machen.", "accepted_answers": [{"value": "Ich habe angefangen, Sport zu machen.", "status": "correct"}, {"value": "Ich habe angefangen Sport zu machen.", "status": "correct"}], "feedback": "*Zu machen* at the end."}
  de.a2.unit108.lesson02.exercise01.wahl_rauchen: {"instruction": "Choose the correct German sentence.", "correct_option": "Ich habe aufgehört zu rauchen.", "distractors": ["Ich habe aufgehört rauchen.", "Ich habe aufhören zu rauchen.", "Ich habe zu aufgehört rauchen."], "accepted_answers": [{"value": "Ich habe aufgehört zu rauchen.", "status": "correct"}, {"value": "Ich habe aufgehoert zu rauchen.", "status": "correct"}], "feedback": "*Aufgehört* + *zu rauchen*."}
  de.a2.unit108.lesson02.exercise02.wahl_handy: {"instruction": "Choose the correct German sentence.", "correct_option": "Jonas hat aufgehört, abends am Handy zu spielen.", "distractors": ["Jonas hat aufgehört, abends am Handy spielen zu.", "Jonas hat aufgehört, abends zu am Handy spielen.", "Jonas ist aufgehört, abends am Handy zu spielen."], "accepted_answers": [{"value": "Jonas hat aufgehört, abends am Handy zu spielen.", "status": "correct"}, {"value": "Jonas hat aufgehoert, abends am Handy zu spielen.", "status": "correct"}], "feedback": "*Zu spielen* at the end."}
  de.a2.unit108.lesson02.exercise03.paare_aufhoeren: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "ich höre auf", "right": "I stop"}, {"left": "du hörst auf", "right": "you stop"}, {"left": "er hört auf", "right": "he stops"}, {"left": "wir hören auf", "right": "we stop"}, {"left": "ihr hört auf", "right": "you (plural) stop"}, {"left": "sie hören auf", "right": "they stop"}], "status": "correct"}], "feedback": "höre, hörst, hört, hören, hört, hören + auf."}
  de.a2.unit108.lesson02.exercise04.ordnen_schokolade: {"instruction": "Put the words in order to say 'She has stopped eating chocolate.'", "correct_option": "Sie hat aufgehört Schokolade zu essen", "accepted_answers": [{"value": "Sie hat aufgehört Schokolade zu essen", "status": "correct"}], "feedback": "*Zu essen* at the end."}
  de.a2.unit108.lesson02.exercise05.luecke_aufgehoert: {"instruction": "Complete with the participle.", "correct_option": "aufgehört", "accepted_answers": [{"value": "aufgehört", "status": "correct"}, {"value": "aufgehoert", "status": "correct"}], "feedback": "*Mit dem Rauchen aufhören*."}
  de.a2.unit108.lesson02.exercise06.uebersetzen_felix: {"instruction": "Translate into German.", "accepted_answers": [{"value": "Felix hat aufgehört, Schokolade zu essen.", "status": "correct"}, {"value": "Felix hat aufgehoert, Schokolade zu essen.", "status": "correct"}, {"value": "Felix hat aufgehört Schokolade zu essen.", "status": "correct"}, {"value": "Felix hat aufgehoert Schokolade zu essen.", "status": "correct"}], "feedback": "*Aufgehört, ... zu essen*."}
  de.a2.unit108.lesson02.exercise07.schreiben_jonas: {"instruction": "Write the requested German sentence.", "correct_option": "Jonas hat aufgehört, am Handy zu spielen.", "accepted_answers": [{"value": "Jonas hat aufgehört, am Handy zu spielen.", "status": "correct"}, {"value": "Jonas hat aufgehoert, am Handy zu spielen.", "status": "correct"}, {"value": "Jonas hat aufgehört am Handy zu spielen.", "status": "correct"}, {"value": "Jonas hat aufgehoert am Handy zu spielen.", "status": "correct"}], "feedback": "*Zu spielen* last."}
  de.a2.unit108.lesson03.exercise01.wahl_aufstehen: {"instruction": "Choose the correct German sentence.", "correct_option": "Nina hat versucht, früh aufzustehen.", "distractors": ["Nina hat versucht, früh zu aufstehen.", "Nina hat versucht, früh aufstehen zu.", "Nina hat versucht, früh aufgestanden zu."], "accepted_answers": [{"value": "Nina hat versucht, früh aufzustehen.", "status": "correct"}, {"value": "Nina hat versucht, frueh aufzustehen.", "status": "correct"}], "feedback": "*Auf-zu-stehen* in one word."}
  de.a2.unit108.lesson03.exercise02.wahl_brot: {"instruction": "Choose the correct German sentence.", "correct_option": "Ich habe vergessen, Brot einzukaufen.", "distractors": ["Ich habe vergessen, Brot zu einkaufen.", "Ich habe vergessen, Brot einkaufen zu.", "Ich habe vergessen, Brot eingekauft zu."], "accepted_answers": [{"value": "Ich habe vergessen, Brot einzukaufen.", "status": "correct"}], "feedback": "*Ein-zu-kaufen*."}
  de.a2.unit108.lesson03.exercise03.paare_versuchen: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Nina hat versucht, früh aufzustehen.", "right": "Nina has tried to get up early."}, {"left": "Ich habe vergessen, Brot einzukaufen.", "right": "I forgot to buy bread."}, {"left": "Anna hat vergessen, Felix anzurufen.", "right": "Anna forgot to call Felix."}, {"left": "Ich versuche, weniger Kaffee zu trinken.", "right": "I'm trying to drink less coffee."}, {"left": "Ich vergesse oft, Wasser zu trinken.", "right": "I often forget to drink water."}, {"left": "Ich habe versucht, früh aufzustehen.", "right": "I tried to get up early."}], "status": "correct"}], "feedback": "Trying and forgetting."}
  de.a2.unit108.lesson03.exercise04.ordnen_anna: {"instruction": "Put the words in order to say 'Anna forgot to call Felix.'", "correct_option": "Anna hat vergessen Felix anzurufen", "accepted_answers": [{"value": "Anna hat vergessen Felix anzurufen", "status": "correct"}], "feedback": "*Anzurufen* last."}
  de.a2.unit108.lesson03.exercise05.luecke_einzukaufen: {"instruction": "Complete with the infinitive with zu.", "correct_option": "einzukaufen", "accepted_answers": [{"value": "einzukaufen", "status": "correct"}], "feedback": "*Zu* goes inside the separable verb."}
  de.a2.unit108.lesson03.exercise06.uebersetzen_versuche: {"instruction": "Translate into German.", "accepted_answers": [{"value": "Ich versuche, weniger Kaffee zu trinken.", "status": "correct"}, {"value": "Ich versuche weniger Kaffee zu trinken.", "status": "correct"}], "feedback": "*Versuchen* + *zu trinken*."}
  de.a2.unit108.lesson03.exercise07.schreiben_frueh: {"instruction": "Write the requested German sentence.", "correct_option": "Ich habe versucht, früh aufzustehen.", "accepted_answers": [{"value": "Ich habe versucht, früh aufzustehen.", "status": "correct"}, {"value": "Ich habe versucht, frueh aufzustehen.", "status": "correct"}, {"value": "Ich habe versucht früh aufzustehen.", "status": "correct"}, {"value": "Ich habe versucht frueh aufzustehen.", "status": "correct"}], "feedback": "*Aufzustehen* in one word."}
  de.a2.unit108.lesson04.exercise01.wahl_nicht_mehr: {"instruction": "Choose the correct German sentence.", "correct_option": "Ich rauche nicht mehr.", "distractors": ["Ich rauche mehr nicht.", "Ich rauche nicht mehr nicht.", "Ich nicht rauche mehr."], "accepted_answers": [{"value": "Ich rauche nicht mehr.", "status": "correct"}], "feedback": "*Nicht mehr* after the verb."}
  de.a2.unit108.lesson04.exercise02.wahl_seit: {"instruction": "Choose the correct German sentence.", "correct_option": "Seit einem Monat jogge ich.", "distractors": ["Seit einem Monat ich jogge.", "Seit einem Monat bin ich jogge.", "Seit ein Monat jogge ich."], "accepted_answers": [{"value": "Seit einem Monat jogge ich.", "status": "correct"}], "feedback": "*Seit einem Monat* + present tense; verb second."}
  de.a2.unit108.lesson04.exercise03.paare_zeit: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Ich rauche nicht mehr.", "right": "I don't smoke any more."}, {"left": "Ich habe wieder angefangen.", "right": "I have started again."}, {"left": "Letzte Woche habe ich angefangen zu joggen.", "right": "Last week I started to jog."}, {"left": "Seit einem Monat jogge ich jeden Morgen.", "right": "I have been jogging every morning for a month."}, {"left": "Ich habe wieder angefangen, Yoga zu machen.", "right": "I have started to do yoga again."}, {"left": "Jetzt jogge ich jeden Morgen.", "right": "Now I jog every morning."}], "status": "correct"}], "feedback": "Time words."}
  de.a2.unit108.lesson04.exercise04.ordnen_wieder: {"instruction": "Put the words in order to say 'I have started again.'", "correct_option": "Ich habe wieder angefangen", "accepted_answers": [{"value": "Ich habe wieder angefangen", "status": "correct"}], "feedback": "*Wieder* before the participle."}
  de.a2.unit108.lesson04.exercise05.luecke_mehr: {"instruction": "Complete the sentence.", "correct_option": "mehr", "accepted_answers": [{"value": "mehr", "status": "correct"}], "feedback": "*Nicht mehr*."}
  de.a2.unit108.lesson04.exercise06.uebersetzen_yoga: {"instruction": "Translate into German.", "accepted_answers": [{"value": "Ich habe wieder angefangen, Yoga zu machen.", "status": "correct"}, {"value": "Ich habe wieder angefangen Yoga zu machen.", "status": "correct"}], "feedback": "*Wieder angefangen*."}
  de.a2.unit108.lesson04.exercise07.schreiben_woche: {"instruction": "Write the requested German sentence.", "correct_option": "Letzte Woche habe ich angefangen zu joggen.", "accepted_answers": [{"value": "Letzte Woche habe ich angefangen zu joggen.", "status": "correct"}, {"value": "Ich habe letzte Woche angefangen zu joggen.", "status": "correct"}, {"value": "Letzte Woche habe ich angefangen, zu joggen.", "status": "correct"}], "feedback": "Verb second after the time phrase."}
  de.a2.unit108.lesson05.exercise01.lesen_felix: {"instruction": "Read the text and choose the answer.", "correct_option": "Jogging", "distractors": ["Yoga", "Smoking", "Baking"], "accepted_answers": [{"value": "Jogging", "status": "correct"}], "feedback": "*Felix hat im Januar angefangen zu joggen.*"}
  de.a2.unit108.lesson05.exercise02.lesen_jonas: {"instruction": "Read the text and choose the answer.", "correct_option": "Playing on his phone in the evening.", "distractors": ["Jogging in the morning.", "Getting up early.", "Buying bread."], "accepted_answers": [{"value": "Playing on his phone in the evening.", "status": "correct"}], "feedback": "*Jonas hat aufgehört, abends am Handy zu spielen.*"}
  de.a2.unit108.lesson05.exercise03.paare_gewohnheiten: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Felix hat im Januar angefangen zu joggen.", "right": "Felix started to jog in January."}, {"left": "Er joggt jetzt jeden Morgen.", "right": "He now jogs every morning."}, {"left": "Nina hat versucht, früh aufzustehen.", "right": "Nina has tried to get up early."}, {"left": "Früh aufstehen ist schwer.", "right": "Getting up early is hard."}, {"left": "Jonas hat aufgehört, am Handy zu spielen.", "right": "Jonas has stopped playing on his phone."}, {"left": "Anna hat vergessen, Brot einzukaufen.", "right": "Anna forgot to buy bread."}], "status": "correct"}], "feedback": "Match the lines of the story."}
  de.a2.unit108.lesson05.exercise04.ordnen_jetzt: {"instruction": "Put the words in order to say 'Felix now jogs every morning.'", "correct_option": "Felix joggt jetzt jeden Morgen", "accepted_answers": [{"value": "Felix joggt jetzt jeden Morgen", "status": "correct"}, {"value": "Jetzt joggt Felix jeden Morgen", "status": "correct"}], "feedback": "Verb second."}
  de.a2.unit108.lesson05.exercise05.uebersetzen_anna: {"instruction": "Translate into German.", "accepted_answers": [{"value": "Anna hat vergessen, Brot einzukaufen.", "status": "correct"}, {"value": "Anna hat vergessen Brot einzukaufen.", "status": "correct"}], "feedback": "*Vergessen* + *einzukaufen*."}
  de.a2.unit108.lesson05.exercise06.diktat_felix: {"instruction": "Type what you hear.", "correct_response": "Felix hat im Januar angefangen zu joggen.", "orthography_strict": true, "feedback": "You heard *Felix hat im Januar angefangen zu joggen.*"}
  de.a2.unit108.lesson05.exercise07.diktat_jonas: {"instruction": "Type what you hear.", "correct_response": "Jonas hat aufgehört, abends am Handy zu spielen.", "orthography_strict": true, "feedback": "You heard *Jonas hat aufgehört, abends am Handy zu spielen.*"}
  de.a2.unit108.lesson06.exercise01.hoeren_frage: {"instruction": "Listen and select Anna's opening question.", "correct_option": "Hallo Felix! Was machst du jetzt jeden Morgen?", "distractors": ["Hallo Felix! Was machst du jetzt jeden Abend?", "Hallo Anna! Was machst du jetzt jeden Morgen?", "Hallo Felix! Was hast du jetzt jeden Morgen gemacht?"], "accepted_answers": [{"value": "Hallo Felix! Was machst du jetzt jeden Morgen?", "status": "correct"}], "feedback": "Anna opens with *Hallo Felix! Was machst du jetzt jeden Morgen?*"}
  de.a2.unit108.lesson06.exercise02.verstehen_handy: {"instruction": "Listen to the dialogue and choose the answer.", "correct_option": "Playing on his phone in the evening.", "distractors": ["Jogging.", "Getting up early.", "Sleeping."], "accepted_answers": [{"value": "Playing on his phone in the evening.", "status": "correct"}], "feedback": "Felix says he has stopped playing on his phone in the evening."}
  de.a2.unit108.lesson06.exercise03.paare_dialog: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Was machst du jetzt jeden Morgen?", "right": "What do you do every morning now?"}, {"left": "Ich habe im Januar angefangen zu joggen.", "right": "I started to jog in January."}, {"left": "Ich habe versucht, früh aufzustehen.", "right": "I have tried to get up early."}, {"left": "Das ist schwer.", "right": "That is hard."}, {"left": "Ich habe auch aufgehört, abends am Handy zu spielen.", "right": "I have also stopped playing on my phone in the evening."}, {"left": "Jetzt schlafe ich besser.", "right": "Now I sleep better."}], "status": "correct"}], "feedback": "The dialogue in sentences."}
