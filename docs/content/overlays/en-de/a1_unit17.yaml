review: {status: "reviewed", required_next_reviewer: "codex", notes: "English-to-German overlay for basic health problems; distractors target English word order, false starts with haben, and Hilfe/brauche confusion.\n\nSecond-pass review 2026-10-19: 8 fixes -- lesson02.teach.line01-line04: German titles and German-text glosses -> English titles and English translations; lesson02.teach.line02/line04 example_gloss: stray quote marks around No/Yes removed; lesson01.teach.weh, lesson01.teach.mir_ist_schlecht, lesson02.teach.ich_brauche: example_gloss updated to the corrected realization example sentences; 'Im Dialog:' examples in lesson02 now glossed 'In context: ...'; lesson02.teach.health_instruction gloss 'Drink water.' -> 'Drink water. Take a break.' (translates the whole text); lesson01.exercise01.listen_kopfschmerzen distractor 'Pause' (not taught until lesson02) -> 'Mir ist schlecht'; lesson01.exercise03.match_symptoms and lesson02.exercise03.match_help accepted_answers mirrored to the realization's new English clues; lesson02.exercise06.write_health_message added 'Ich habe Kopfschmerzen. Ich brauche bitte Hilfe.' (equally correct for 'I need help, please')."}
course: {title: "German A1", description: "Learn A1-level German for everyday exchanges, with English explanations."}
