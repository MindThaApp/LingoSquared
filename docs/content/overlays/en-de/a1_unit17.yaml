teaching:
  de.a1.unit17.lesson01.teach.kopfschmerzen: {title: "Kopfschmerzen", gloss: "headache", note: "*Kopfschmerzen* is plural in form but used for 'a headache.'", example_gloss: "I have a headache."}
  de.a1.unit17.lesson01.teach.bauchschmerzen: {title: "Bauchschmerzen", gloss: "stomachache", note: "*Bauch* is belly/stomach; *Schmerzen* means pains.", example_gloss: "I have a stomachache."}
  de.a1.unit17.lesson01.teach.hals: {title: "Hals", gloss: "throat / neck", note: "*Hals* covers throat/neck depending on context.", example_gloss: "My throat hurts."}
  de.a1.unit17.lesson01.teach.weh: {title: "Mein Kopf tut weh.", gloss: "My head hurts.", note: "German says the body part 'does hurt': *tut weh*.", example_gloss: "My head hurts."}
  de.a1.unit17.lesson01.teach.mir_ist_schlecht: {title: "Mir ist schlecht.", gloss: "I feel sick.", note: "Do not translate word-for-word as 'I am bad'; *Mir ist schlecht* is the natural phrase.", example_gloss: "I feel sick."}
  de.a1.unit17.lesson02.teach.brauchen_sie_hilfe: {title: "Brauchen Sie Hilfe?", gloss: "Do you need help?", note: "Formal *Sie* keeps the question polite.", example_gloss: "Do you need help?"}
  de.a1.unit17.lesson02.teach.ich_brauche: {title: "Ich brauche Wasser.", gloss: "I need water.", note: "*brauche* means need, not use.", example_gloss: "I need water."}
  de.a1.unit17.lesson02.teach.pause: {title: "Pause", gloss: "break / pause", note: "*eine Pause* is a short rest or break.", example_gloss: "I need a break."}
  de.a1.unit17.lesson02.teach.health_instruction: {title: "Trinken Sie Wasser.", gloss: "Drink water.", note: "Formal *Sie* keeps the instruction polite.", example_gloss: "Take a break."}
  de.a1.unit17.lesson02.teach.gesundheit_text: {title: "Annas Problem", gloss: "Anna's problem", note: "The short text states the symptom and immediate need.", example_gloss: "She needs water."}
  de.a1.unit17.lesson02.teach.line01: {title: "Felix fragt nach Anna", gloss: "Felix: Anna, geht es Ihnen gut?", note: "Felix keeps formal *Ihnen* with Anna.", example_gloss: "Anna, are you well?"}
  de.a1.unit17.lesson02.teach.line02: {title: "Anna nennt das Problem", gloss: "Anna: Nein, ich habe Kopfschmerzen.", note: "The answer states the symptom plainly.", example_gloss: "\"No,\" I have a headache."}
  de.a1.unit17.lesson02.teach.line03: {title: "Felix bietet Hilfe an", gloss: "Felix: Brauchen Sie Hilfe?", note: "A simple offer of help.", example_gloss: "Do you need help?"}
  de.a1.unit17.lesson02.teach.line04: {title: "Anna sagt, was sie braucht", gloss: "Anna: Ja, bitte. Ich brauche Wasser und eine Pause.", note: "The reply says \"Yes\" and names the immediate needs.", example_gloss: "\"Yes,\" please. I need water and a break."}
exercises:
  de.a1.unit17.lesson01.exercise01.listen_kopfschmerzen: {instruction: "Listen and select the health problem you hear.", correct_option: "Kopfschmerzen", distractors: ["Bauchschmerzen", "Hals", "Pause"], accepted_answers: [{value: "Kopfschmerzen", status: "correct"}], feedback: "*Kopfschmerzen* means headache."}
  de.a1.unit17.lesson01.exercise02.choose_headache: {instruction: "Which sentence means 'I have a headache'?", correct_option: "Ich habe Kopfschmerzen.", distractors: ["Ich bin Kopfschmerzen.", "Ich habe Kopf.", "Mein Kopfschmerzen ist."], accepted_answers: [{value: "Ich habe Kopfschmerzen.", status: "correct"}], feedback: "Use *Ich habe Kopfschmerzen*."}
  de.a1.unit17.lesson01.exercise03.match_symptoms:
    instruction: "Match each health word to its meaning."
    accepted_answers: [{value: [{left: "Schmerz im Kopf", right: "Kopfschmerzen"}, {left: "Schmerz im Bauch", right: "Bauchschmerzen"}, {left: "Körperteil zwischen Kopf und Körper", right: "Hals"}, {left: "Körperteil mit Augen und Mund", right: "Kopf"}, {left: "Wort in tut weh", right: "weh"}, {left: "Gefühl bei Übelkeit", right: "schlecht"}], status: "correct"}]
    feedback: "These words name basic symptoms and body areas."
  de.a1.unit17.lesson01.exercise04.order_headache: {instruction: "Put the words in order: 'I have a headache.'", accepted_answers: [{value: ["Ich", "habe", "Kopfschmerzen"], status: "correct"}], feedback: "The order is *Ich habe Kopfschmerzen*."}
  de.a1.unit17.lesson01.exercise05.write_problem: {instruction: "Write the taught sentence: I have a headache.", accepted_answers: [{value: "Ich habe Kopfschmerzen.", status: "correct"}, {value: "Ich habe Kopfschmerzen", status: "correct"}], feedback: "*Ich habe Kopfschmerzen* states the problem."}
  de.a1.unit17.lesson02.exercise01.listen_problem: {instruction: "Listen to the dialogue. What problem does Anna state?", correct_option: "Kopfschmerzen", distractors: ["Bauchschmerzen", "Hals tut weh", "Mir ist schlecht"], accepted_answers: [{value: "Kopfschmerzen", status: "correct"}], feedback: "Anna says she has *Kopfschmerzen*."}
  de.a1.unit17.lesson02.exercise02.choose_need: {instruction: "Which instruction means 'Drink water. Take a break.'?", correct_option: "Trinken Sie Wasser. Machen Sie eine Pause.", distractors: ["Ich brauche Wasser und eine Pause.", "Brauchen Sie Hilfe?", "Anna hat Kopfschmerzen."], accepted_answers: [{value: "Trinken Sie Wasser. Machen Sie eine Pause.", status: "correct"}], feedback: "The instruction tells someone to drink water and take a break."}
  de.a1.unit17.lesson02.exercise03.match_help:
    instruction: "Match each dialogue detail."
    accepted_answers: [{value: [{left: "Anna hat dieses Problem", right: "Kopfschmerzen"}, {left: "Felix bietet das an", right: "Hilfe"}, {left: "Anna braucht dieses Getränk", right: "Wasser"}, {left: "Anna braucht diese Ruhezeit", right: "Pause"}, {left: "negative Antwort", right: "Nein"}, {left: "positive Antwort", right: "Ja"}], status: "correct"}]
    feedback: "The dialogue connects a problem with a simple help request."
  de.a1.unit17.lesson02.exercise04.order_help: {instruction: "Put the words in order: 'I need water and a break.'", accepted_answers: [{value: ["Ich", "brauche", "Wasser", "und", "eine", "Pause"], status: "correct"}], feedback: "*Ich brauche* starts the need statement."}
  de.a1.unit17.lesson02.exercise05.reply_health: {instruction: "Reply as Anna. Say \"No,\" state that you have a headache, then say \"Yes,\" please and that you need water and a break.", accepted_answers: [{value: "Nein, ich habe Kopfschmerzen. Ja, bitte. Ich brauche Wasser und eine Pause.", status: "correct"}, {value: "Nein ich habe Kopfschmerzen Ja bitte Ich brauche Wasser und eine Pause", status: "correct"}], feedback: "The full reply states the problem and immediate needs."}
  de.a1.unit17.lesson02.exercise06.write_health_message: {instruction: "Write a short health message using the taught phrase: I have a headache. I need help, please.", accepted_answers: [{value: "Ich habe Kopfschmerzen. Ich brauche Hilfe, bitte.", status: "correct"}, {value: "Ich habe Kopfschmerzen Ich brauche Hilfe bitte", status: "correct"}], feedback: "The message states the symptom and asks for help."}
