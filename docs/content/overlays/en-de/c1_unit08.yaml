review:
  status: unreviewed
  required_next_reviewer: fresh_context_reviewer
  notes: >-
    Overlay for German's eighth and final C1 unit, authored alongside the
    realization (no adaptable public-domain German C1 persuasion source exists;
    see the realization provenance note). English speakers' real interference
    risks for this outcome: (1) the four device nouns (die rhetorische Frage,
    der Parallelismus, die Betonung, der Appell) are glossed so the learner
    stops mapping "emphasis" and "appeal" onto the wrong German noun; (2)
    appellieren an + accusative is contrasted with the false-cognate "appeal"
    (which is NOT *appellieren* used intransitively); (3) the rhetorical
    question form Wollen wir wirklich ... is contrasted with a literal English
    "do we want" so learners register it as a device, not a real question; (4)
    the culminating speaking/writing prompts name the exact four devices the
    answer must deliver so the multi-sentence speech has one well-determined
    answer. No sibling-direction file (de-en) was consulted.

course:
  title: German C1
  description: >-
    Advanced German: persuade an audience using rhetorical devices -- rhetorical
    questions, parallelism, emphasis, and appeals -- modulating stance and
    intensity in formal register.

units:
  de.c1.unit08.mit_rhetorik_ueberzeugen:
    title: "Persuading with rhetoric"
    description: "Persuade an audience with rhetorical questions, parallelism, emphasis, and appeals -- build and deliver a formal persuasive appeal to the management board."

lessons:
  de.c1.unit08.lesson01.vier_mittel:
    title: "The four devices of rhetoric"
  de.c1.unit08.lesson02.rhetorische_fragen:
    title: "Asking rhetorical questions"
  de.c1.unit08.lesson03.parallelismus:
    title: "Persuading with parallelism"
  de.c1.unit08.lesson04.betonung_appell:
    title: "Emphasis and appeal"
  de.c1.unit08.lesson05.rede_lesen:
    title: "Reading a speech"
  de.c1.unit08.lesson06.rede_halten:
    title: "Delivering the speech"

teaching:
  de.c1.unit08.lesson01.teach.ueberzeugen:
    title: "to persuade"
    gloss: "to persuade"
    note: "*Überzeugen* = to persuade, to convince. The goal of every rhetorical device in this unit: *überzeugen* the audience, not just inform it."
    example_gloss: "We persuade the audience."
  de.c1.unit08.lesson01.teach.rhetorische_frage:
    title: "the rhetorical question"
    gloss: "the rhetorical question"
    note: "*Die rhetorische Frage* = a question asked for effect, not for an answer. The speaker already knows the answer and uses the question to push the audience to a conclusion."
    example_gloss: "A rhetorical question needs no answer."
  de.c1.unit08.lesson01.teach.parallelismus:
    title: "parallelism"
    gloss: "parallelism"
    note: "*Der Parallelismus* = repeating the same structure in two or more clauses. It gives the speech rhythm and makes the contrast or the argument memorable."
    example_gloss: "Parallelism repeats the same structure."
  de.c1.unit08.lesson01.teach.betonung:
    title: "emphasis"
    gloss: "emphasis"
    note: "*Die Betonung* = emphasis, stress. Placing stress -- with a word like *gerade* or a cleft structure -- marks the point the audience must not miss."
    example_gloss: "Emphasis makes the sentence stronger."
  de.c1.unit08.lesson01.teach.appell:
    title: "the appeal"
    gloss: "the appeal"
    note: "*Der Appell* = the appeal, the direct call to the audience. A persuasive speech usually ends by *appellieren an* -- appealing to -- the audience's values or responsibility."
    example_gloss: "The appeal is directed at the audience."
  de.c1.unit08.lesson01.teach.publikum:
    title: "the audience"
    gloss: "the audience"
    note: "*Das Publikum* = the audience. Every device is chosen for *das Publikum*: how you persuade depends on who is listening."
    example_gloss: "The audience listens attentively."

  de.c1.unit08.lesson02.teach.wirklich:
    title: "really"
    gloss: "really"
    note: "*Wirklich* = really. Inside a question it is the emphasis particle that turns a real question into a rhetorical one: *Wollen wir wirklich ...?* invites agreement, not an answer."
    example_gloss: "That is really important."
  de.c1.unit08.lesson02.teach.riskieren:
    title: "to risk"
    gloss: "to risk"
    note: "*Riskieren* = to risk. The rhetorical question *Wollen wir wirklich riskieren, dass ...?* frames the alternative as a danger the audience cannot accept."
    example_gloss: "We risk too much."
  de.c1.unit08.lesson02.teach.wollen:
    title: "to want"
    gloss: "to want"
    note: "*Wollen* = to want, to intend. In *Wollen wir wirklich ...?* the plural *wir* includes speaker and audience together, so the question feels shared rather than accusatory."
    example_gloss: "We want to persuade."
  de.c1.unit08.lesson02.teach.ungeschuetzt:
    title: "unsecured"
    gloss: "unsecured"
    note: "*Ungeschützt* = unprotected, unsecured. Built from *schützen* (to protect) + the negating prefix *un-*: the data is exposed, which is exactly the risk the rhetorical question warns against."
    example_gloss: "The data is unsecured."
  de.c1.unit08.lesson02.teach.erhalten:
    title: "to receive"
    gloss: "to receive"
    note: "*Erhalten* = to receive. Here: *die Daten ungeschützt erhalten* -- to receive the data in an unsecured state."
    example_gloss: "The customers receive the data."
  de.c1.unit08.lesson02.teach.wahl:
    title: "the choice"
    gloss: "the choice"
    note: "*Die Wahl* = the choice. A persuasive speech often states the choice plainly (*Wir haben die Wahl*) before laying out the two sides in parallel."
    example_gloss: "We have the choice."
  de.c1.unit08.lesson02.teach.unsere_kunden:
    title: "our customers"
    gloss: "our customers"
    note: "*Unsere Kunden* = our customers. The inclusive *unsere* ties the audience to the customers, so the risk feels like everyone's risk."

  de.c1.unit08.lesson03.teach.koennen:
    title: "to be able to"
    gloss: "to be able to"
    note: "*Können* = can, to be able to. The modal that opens each half of the parallel structure: *Wir können ... Wir können ...*."
    example_gloss: "We can launch."
  de.c1.unit08.lesson03.teach.schnell:
    title: "quickly"
    gloss: "quickly"
    note: "*Schnell* = quickly. In the parallel contrast, *schnell starten* (launch quickly) stands against *gründlich testen* (test thoroughly) -- speed versus care."
    example_gloss: "We launch quickly."
  de.c1.unit08.lesson03.teach.testen:
    title: "to test"
    gloss: "to test"
    note: "*Testen* = to test. The thorough path: *gründlich testen* before launching."
    example_gloss: "We test the system."
  de.c1.unit08.lesson03.teach.gruendlich:
    title: "thoroughly"
    gloss: "thoroughly"
    note: "*Gründlich* = thorough, carefully. The adjective that makes the second, preferred option sound responsible."
    example_gloss: "We test thoroughly."
  de.c1.unit08.lesson03.teach.vertrauen:
    title: "trust"
    gloss: "trust"
    note: "*Das Vertrauen* = trust. The goal of the thorough path: *Vertrauen gewinnen* -- win the customers' trust."
    example_gloss: "Trust is important."
  de.c1.unit08.lesson03.teach.gewinnen:
    title: "to win / to gain"
    gloss: "to win / to gain"
    note: "*Gewinnen* = to win, to gain. *Vertrauen gewinnen* = to win trust, the payoff the parallel structure promises."
    example_gloss: "We win trust."
  de.c1.unit08.lesson03.teach.in_kauf_nehmen:
    title: "to accept / to put up with (errors)"
    gloss: "to put up with, to accept (errors)"
    note: "*Fehler in Kauf nehmen* = to accept errors as the price of something, to put up with them. The phrase paints the fast path as careless: launch quickly and *nehmen Sie Fehler in Kauf*."

  de.c1.unit08.lesson04.teach.gerade_jetzt:
    title: "right now / especially now"
    gloss: "right now / especially now"
    note: "*Gerade jetzt* = right now, especially now. *Gerade* here is an intensifier that singles this moment out -- the emphasis device marking the sentence the audience must weigh most."
  de.c1.unit08.lesson04.teach.qualitaet:
    title: "quality"
    gloss: "quality"
    note: "*Die Qualität* = quality. What the speech says everything *kommt an auf* (depends on) *gerade jetzt*."
    example_gloss: "Quality is important."
  de.c1.unit08.lesson04.teach.kommt_es_an:
    title: "it comes down to"
    gloss: "It comes down to quality."
    note: "*Es kommt auf ... an* = it depends on, it comes down to. A fixed construction: *Es kommt auf die Qualität an* -- quality is what decides."
  de.c1.unit08.lesson04.teach.appellieren:
    title: "to appeal to"
    gloss: "to appeal to"
    note: "*Appellieren an* + accusative = to appeal to. *Ich appelliere an Ihre Verantwortung* -- a direct appeal to the audience's responsibility. Note the English false friend: you do not use *appellieren* intransitively the way English appeal can stand alone."
    example_gloss: "I appeal to your responsibility."
  de.c1.unit08.lesson04.teach.verantwortung:
    title: "responsibility"
    gloss: "responsibility"
    note: "*Die Verantwortung* = responsibility. The value the appeal targets: the management board's responsibility for the customers."
    example_gloss: "The responsibility lies with us."
  de.c1.unit08.lesson04.teach.liefern:
    title: "to deliver"
    gloss: "to deliver"
    note: "*Liefern* = to deliver. The promise at the close: *wir liefern ein Produkt* -- we deliver a product."
    example_gloss: "We deliver a good product."
  de.c1.unit08.lesson04.teach.produkt:
    title: "the product"
    gloss: "the product"
    note: "*Das Produkt* = the product. The concrete outcome the appeal promises the audience."
    example_gloss: "The product is ready."
  de.c1.unit08.lesson04.teach.haelt_verspricht:
    title: "to keep what it promises"
    gloss: "to keep what it promises"
    note: "*Halten, was es verspricht* = to keep what it promises, to deliver on its promise. The idiomatic close of the appeal: a product that *hält, was es verspricht*."

  de.c1.unit08.lesson05.teach.rede:
    title: "The full appeal"
    gloss: "Do we really want to risk our customers receiving the data unsecured? We have the choice. We can launch quickly and put up with errors. We can test thoroughly and win trust. Right now it comes down to quality. So I appeal to your responsibility: give us the six months, and we will deliver a product that keeps what it promises."
    note: "The complete appeal in four moves: a rhetorical question (*Wollen wir wirklich riskieren ...?*), a parallel structure (*Wir können ... Wir können ...*), deliberate emphasis (*Gerade jetzt ... Qualität*), and an appeal with a call to action (*appelliere ich an Ihre Verantwortung ... Geben Sie uns die sechs Monate*). Read it once for the argument, then once for where each device appears."
  de.c1.unit08.lesson05.teach.vier_mittel_muster:
    title: "What a speech combines"
    gloss: "The speech combines the rhetorical question, parallelism, emphasis, and the appeal."
    note: "*Die Rede verbindet die rhetorische Frage, den Parallelismus, die Betonung und den Appell.* All four devices work together: the question opens, the parallel structure frames the choice, the emphasis marks the decisive point, and the appeal closes."

  de.c1.unit08.lesson06.teach.vogel_frage:
    title: "Frau Vogel: Mr Weber, how do you want to persuade the management board?"
    gloss: "Mr Weber, how do you want to persuade the management board?"
    note: "Frau Vogel opens by asking for the strategy. *Überzeugen* -- the goal the whole unit has built toward."
  de.c1.unit08.lesson06.teach.felix_eroeffnung:
    title: "Felix: I pose a rhetorical question."
    gloss: "I pose a rhetorical question. Do we really want to risk our customers receiving the data unsecured?"
    note: "Felix names the device (*eine rhetorische Frage*) and then delivers it: *Wollen wir wirklich riskieren, dass unsere Kunden die Daten ungeschützt erhalten?*"
  de.c1.unit08.lesson06.teach.vogel_schluss:
    title: "Frau Vogel: Good. And at the end you appeal to responsibility?"
    gloss: "Good. And at the end you appeal to responsibility?"
    note: "Frau Vogel asks about the ending. *Zum Schluss* = at the end, at the close of the speech."
  de.c1.unit08.lesson06.teach.felix_ende:
    title: "Felix: Exactly. I appeal to your responsibility."
    gloss: "Exactly. I appeal to your responsibility. Give us the six months."
    note: "Felix confirms (*genau*) and delivers the appeal and the call to action: *Ich appelliere an Ihre Verantwortung. Geben Sie uns die sechs Monate.*"
  de.c1.unit08.lesson06.teach.rede_muster:
    title: "What a speech combines"
    gloss: "In a speech you combine question, parallelism, emphasis, and appeal."
    note: "*In einer Rede verbinden Sie Frage, Parallelismus, Betonung und Appell.* The four devices, delivered as one."

exercises:
  de.c1.unit08.lesson01.exercise01.recognize_ueberzeugen:
    instruction: "What does überzeugen mean?"
    correct_option: "To persuade."
    distractors: ["To summarize.", "To contradict.", "To ignore."]
    accepted_answers: [{value: "To persuade.", status: correct}]
    feedback: "*Überzeugen* = to persuade -- the goal of every rhetorical device in this unit."

  de.c1.unit08.lesson01.exercise02.match_mittel:
    instruction: "Match each German rhetorical term to its meaning."
    accepted_answers:
      - value: {"überzeugen": "to persuade", "die rhetorische Frage": "the rhetorical question", "der Parallelismus": "parallelism", "die Betonung": "emphasis", "der Appell": "the appeal", "das Publikum": "the audience"}
        status: correct
    feedback: "The rhetorical toolkit: *die rhetorische Frage* (question for effect), *der Parallelismus* (repeated structure), *die Betonung* (emphasis), *der Appell* (direct appeal) -- all aimed at *überzeugen* the *Publikum*."

  de.c1.unit08.lesson01.exercise03.order_publikum:
    instruction: "Put the German words in order."
    accepted_answers:
      - {value: "Wir überzeugen das Publikum", status: correct}
    feedback: "*Wir überzeugen das Publikum* -- the sentence that states the goal."

  de.c1.unit08.lesson01.exercise04.translate_ueberzeugen:
    instruction: "Translate into German, using überzeugen: We persuade the audience."
    accepted_answers:
      - {value: "Wir überzeugen das Publikum", status: correct}
      - {value: "Wir überzeugen das Publikum.", status: correct}
      - {value: "Wir ueberzeugen das Publikum", status: correct}
      - {value: "Wir ueberzeugen das Publikum.", status: correct}
    feedback: "*Wir überzeugen das Publikum* -- *überzeugen* takes the audience as its object."

  de.c1.unit08.lesson01.exercise05.speak_ueberzeugen:
    instruction: "Say aloud in German, using überzeugen: We persuade the audience."
    accepted_answers:
      - {value: "Wir überzeugen das Publikum", status: correct}
      - {value: "Wir überzeugen das Publikum.", status: correct}
      - {value: "Wir ueberzeugen das Publikum", status: correct}
      - {value: "Wir ueberzeugen das Publikum.", status: correct}
    feedback: "Spoken, *Wir überzeugen das Publikum*."

  de.c1.unit08.lesson01.exercise06.write_rhetorische_frage:
    instruction: "Write in German, using die rhetorische Frage: A rhetorical question needs no answer."
    accepted_answers:
      - {value: "Eine rhetorische Frage braucht keine Antwort", status: correct}
      - {value: "Eine rhetorische Frage braucht keine Antwort.", status: correct}
    feedback: "*Eine rhetorische Frage braucht keine Antwort* -- the defining trait of the device."

  de.c1.unit08.lesson02.exercise01.recognize_riskieren:
    instruction: "What does riskieren mean?"
    correct_option: "To risk."
    distractors: ["To receive.", "To protect.", "To test."]
    accepted_answers: [{value: "To risk.", status: correct}]
    feedback: "*Riskieren* = to risk -- the danger the rhetorical question warns against."

  de.c1.unit08.lesson02.exercise02.listen_riskieren:
    instruction: "Listen and select the meaning of the sentence."
    correct_option: "Do we really want to risk the customers receiving the data unsecured?"
    distractors: ["The data is already protected.", "The customers reject the data.", "We have already tested the data."]
    accepted_answers: [{value: "Do we really want to risk the customers receiving the data unsecured?", status: correct}]
    feedback: "*Wollen wir wirklich riskieren, dass unsere Kunden die Daten ungeschützt erhalten?* -- a rhetorical question, asked for effect, not for an answer."

  de.c1.unit08.lesson02.exercise03.match_frage:
    instruction: "Match each German word from the rhetorical question to its meaning."
    accepted_answers:
      - value: {"wirklich": "really", "riskieren": "to risk", "wollen": "to want", "ungeschützt": "unsecured", "erhalten": "to receive", "die Wahl": "the choice", "unsere Kunden": "our customers"}
        status: correct
    feedback: "The rhetorical question's vocabulary: *wollen* + *wirklich* + *riskieren* build the question, *ungeschützt erhalten* names the risk, and *die Wahl* sets up the choice that follows."

  de.c1.unit08.lesson02.exercise04.order_wahl:
    instruction: "Put the German words in order."
    accepted_answers:
      - {value: "Wir haben die Wahl", status: correct}
    feedback: "*Wir haben die Wahl* -- the sentence that frames the decision."

  de.c1.unit08.lesson02.exercise05.translate_riskieren:
    instruction: "Translate into German, using riskieren: Do we really want to risk our customers receiving the data unsecured?"
    accepted_answers:
      - {value: "Wollen wir wirklich riskieren, dass unsere Kunden die Daten ungeschützt erhalten", status: correct}
      - {value: "Wollen wir wirklich riskieren, dass unsere Kunden die Daten ungeschützt erhalten.", status: correct}
      - {value: "Wollen wir wirklich riskieren, dass unsere Kunden die Daten ungeschuetzt erhalten", status: correct}
      - {value: "Wollen wir wirklich riskieren, dass unsere Kunden die Daten ungeschuetzt erhalten.", status: correct}
    feedback: "*Wollen wir wirklich riskieren, dass ...?* -- *riskieren* takes a *dass* clause naming the danger."

  de.c1.unit08.lesson02.exercise06.speak_riskieren:
    instruction: "Say aloud in German, using riskieren: Do we really want to risk our customers receiving the data unsecured?"
    accepted_answers:
      - {value: "Wollen wir wirklich riskieren, dass unsere Kunden die Daten ungeschützt erhalten", status: correct}
      - {value: "Wollen wir wirklich riskieren, dass unsere Kunden die Daten ungeschützt erhalten.", status: correct}
      - {value: "Wollen wir wirklich riskieren, dass unsere Kunden die Daten ungeschuetzt erhalten", status: correct}
      - {value: "Wollen wir wirklich riskieren, dass unsere Kunden die Daten ungeschuetzt erhalten.", status: correct}
    feedback: "Spoken, *Wollen wir wirklich riskieren, dass unsere Kunden die Daten ungeschützt erhalten?*"

  de.c1.unit08.lesson02.exercise07.write_wahl:
    instruction: "Write in German, using die Wahl: We have the choice."
    accepted_answers:
      - {value: "Wir haben die Wahl", status: correct}
      - {value: "Wir haben die Wahl.", status: correct}
    feedback: "*Wir haben die Wahl* -- *die Wahl* as the direct object of *haben*."

  de.c1.unit08.lesson03.exercise01.recognize_gruendlich:
    instruction: "What does gründlich mean?"
    correct_option: "Thoroughly / carefully."
    distractors: ["Quickly.", "Carelessly.", "Secretly."]
    accepted_answers: [{value: "Thoroughly / carefully.", status: correct}]
    feedback: "*Gründlich* = thorough, carefully -- the responsible path in the parallel contrast."

  de.c1.unit08.lesson03.exercise02.listen_vertrauen:
    instruction: "Listen and select the meaning of the sentence."
    correct_option: "We can test thoroughly and win trust."
    distractors: ["We can launch quickly and accept errors.", "We can delay the launch.", "We can lose the customers."]
    accepted_answers: [{value: "We can test thoroughly and win trust.", status: correct}]
    feedback: "*Wir können gründlich testen und Vertrauen gewinnen* -- the second, preferred half of the parallel structure."

  de.c1.unit08.lesson03.exercise03.match_parallelismus:
    instruction: "Match each German word from the parallel structure to its meaning."
    accepted_answers:
      - value: {"können": "to be able to", "schnell": "quickly", "testen": "to test", "gründlich": "thoroughly", "das Vertrauen": "trust", "gewinnen": "to win / to gain", "Fehler in Kauf nehmen": "to accept errors / to put up with errors"}
        status: correct
    feedback: "The two parallel paths: *schnell starten* + *Fehler in Kauf nehmen* (fast, careless) versus *gründlich testen* + *Vertrauen gewinnen* (careful, trustworthy)."

  de.c1.unit08.lesson03.exercise04.order_vertrauen:
    instruction: "Put the German words in order."
    accepted_answers:
      - {value: "Wir können gründlich testen und Vertrauen gewinnen", status: correct}
    feedback: "*Wir können gründlich testen und Vertrauen gewinnen* -- the preferred parallel sentence."

  de.c1.unit08.lesson03.exercise05.translate_vertrauen:
    instruction: "Translate into German, using gründlich testen: We can test thoroughly and win trust."
    accepted_answers:
      - {value: "Wir können gründlich testen und Vertrauen gewinnen", status: correct}
      - {value: "Wir können gründlich testen und Vertrauen gewinnen.", status: correct}
      - {value: "Wir koennen gruendlich testen und Vertrauen gewinnen", status: correct}
      - {value: "Wir koennen gruendlich testen und Vertrauen gewinnen.", status: correct}
    feedback: "*Wir können gründlich testen und Vertrauen gewinnen* -- the parallel structure with *gründlich* marking the careful path."

  de.c1.unit08.lesson03.exercise06.speak_parallelismus:
    instruction: "Say aloud in German, using in Kauf nehmen: We can launch quickly and put up with errors."
    accepted_answers:
      - {value: "Wir können schnell starten und Fehler in Kauf nehmen", status: correct}
      - {value: "Wir können schnell starten und Fehler in Kauf nehmen.", status: correct}
      - {value: "Wir koennen schnell starten und Fehler in Kauf nehmen", status: correct}
      - {value: "Wir koennen schnell starten und Fehler in Kauf nehmen.", status: correct}
    feedback: "Spoken, *Wir können schnell starten und Fehler in Kauf nehmen* -- the fast, careless half of the parallel contrast."

  de.c1.unit08.lesson03.exercise07.write_vertrauen:
    instruction: "Write in German, using gründlich and Vertrauen: We can test thoroughly and win trust."
    accepted_answers:
      - {value: "Wir können gründlich testen und Vertrauen gewinnen", status: correct}
      - {value: "Wir können gründlich testen und Vertrauen gewinnen.", status: correct}
      - {value: "Wir koennen gruendlich testen und Vertrauen gewinnen", status: correct}
      - {value: "Wir koennen gruendlich testen und Vertrauen gewinnen.", status: correct}
    feedback: "*Wir können gründlich testen und Vertrauen gewinnen* -- *gründlich* (thoroughly) and *Vertrauen gewinnen* (win trust) together."

  de.c1.unit08.lesson04.exercise01.recognize_gerade_jetzt:
    instruction: "What does Gerade jetzt mean?"
    correct_option: "Right now / especially now."
    distractors: ["Just once.", "Never again.", "Some time ago."]
    accepted_answers: [{value: "Right now / especially now.", status: correct}]
    feedback: "*Gerade jetzt* = right now, especially now -- *gerade* singles this moment out for emphasis."

  de.c1.unit08.lesson04.exercise02.listen_qualitaet:
    instruction: "Listen and select the meaning of the sentence."
    correct_option: "Right now it comes down to quality."
    distractors: ["Quality no longer matters.", "The quality is already excellent.", "The price matters most."]
    accepted_answers: [{value: "Right now it comes down to quality.", status: correct}]
    feedback: "*Gerade jetzt kommt es auf Qualität an* -- the emphasized sentence: *es kommt auf ... an* = it comes down to."

  de.c1.unit08.lesson04.exercise03.match_betonung_appell:
    instruction: "Match each German word from the emphasis and appeal to its meaning."
    accepted_answers:
      - value: {"Gerade jetzt": "right now / especially now", "die Qualität": "quality", "appellieren an": "to appeal to", "die Verantwortung": "responsibility", "liefern": "to deliver", "das Produkt": "the product", "halten, was es verspricht": "to keep what it promises"}
        status: correct
    feedback: "Emphasis (*Gerade jetzt*, *die Qualität*) and appeal (*appellieren an*, *die Verantwortung*) lead to the promise: *liefern*, *das Produkt*, and *halten, was es verspricht*."

  de.c1.unit08.lesson04.exercise04.order_qualitaet:
    instruction: "Put the German words in order."
    accepted_answers:
      - {value: "Gerade jetzt kommt es auf Qualität an", status: correct}
    feedback: "*Gerade jetzt kommt es auf Qualität an* -- the emphasized, decisive sentence."

  de.c1.unit08.lesson04.exercise05.translate_appellieren:
