exercises:
  de.a1.unit22.lesson01.exercise01.listen_froh: {instruction: "Listen and select the feeling sentence you hear.", correct_option: "Ich bin froh.", distractors: ["Ich bin müde.", "Ich bin traurig.", "Wie fühlen Sie sich?"], accepted_answers: [{value: "Ich bin froh.", status: "correct"}], feedback: "*Ich bin froh* means I am glad."}
  de.a1.unit22.lesson01.exercise02.choose_tired: {instruction: "Which sentence means 'I am tired'?", correct_option: "Ich bin müde.", distractors: ["Ich habe müde.", "Ich fühle müde sich.", "Ich bin traurig."], accepted_answers: [{value: "Ich bin müde.", status: "correct"}], feedback: "Use *Ich bin müde* for 'I am tired.'"}
  de.a1.unit22.lesson01.exercise03.match_feelings:
    instruction: "Match each German word to its meaning."
    accepted_answers: [{value: [{left: "feeling / emotion", right: "Gefühl"}, {left: "glad / happy", right: "froh"}, {left: "tired", right: "müde"}, {left: "sad", right: "traurig"}, {left: "to feel", right: "fühlen"}, {left: "yourself (in 'Wie fühlen Sie sich?')", right: "sich"}], status: "correct"}]
    feedback: "These words support asking about and stating feelings."
  de.a1.unit22.lesson01.exercise04.order_happy: {instruction: "Put the words in order: 'I am glad.'", accepted_answers: [{value: ["Ich", "bin", "froh"], status: "correct"}], feedback: "The feeling follows *bin*."}
  de.a1.unit22.lesson01.exercise05.write_feeling: {instruction: "Write the taught feeling sentence: I am glad.", accepted_answers: [{value: "Ich bin froh.", status: "correct"}, {value: "Ich bin froh", status: "correct"}], feedback: "*Ich bin froh* states a basic feeling."}
  de.a1.unit22.lesson02.exercise01.listen_feeling_reason: {instruction: "Listen to the dialogue. What feeling and reason does Anna give?", correct_option: "glad because she has the day off", distractors: ["sad because she is at home", "angry because the shop is closed", "calm because the room is quiet"], accepted_answers: [{value: "glad because she has the day off", status: "correct"}], feedback: "Anna says she is glad because she has the day off."}
  de.a1.unit22.lesson02.exercise02.choose_reason: {instruction: "Which sentence means 'I am tired because I work a lot'?", correct_option: "Ich bin müde, weil ich viel arbeite.", distractors: ["Ich bin müde, weil ich arbeite viel.", "Ich habe müde, weil ich viel arbeite.", "Ich bin viel, weil ich müde arbeite."], accepted_answers: [{value: "Ich bin müde, weil ich viel arbeite.", status: "correct"}], feedback: "Learn this full *weil* reason sentence."}
  de.a1.unit22.lesson02.exercise03.match_reasons:
    instruction: "Match each feeling and reason detail."
    accepted_answers: [{value: [{left: "the person who has the day off", right: "Anna"}, {left: "how Anna feels", right: "froh"}, {left: "free / off (in Anna's reason)", right: "frei"}, {left: "the person who works a lot", right: "Felix"}, {left: "how Felix feels", right: "müde"}, {left: "how much Felix works", right: "viel"}], status: "correct"}]
    feedback: "The dialogue links feelings to simple causes."
  de.a1.unit22.lesson02.exercise04.order_reason: {instruction: "Put the words in order: 'I am glad because I have the day off.'", accepted_answers: [{value: ["Ich", "bin", "froh", "weil", "ich", "frei", "habe"], status: "correct"}], feedback: "The reason follows *weil*."}
  de.a1.unit22.lesson02.exercise05.reply_feelings: {instruction: "Reply as Anna: say you are glad because you have the day off, then ask 'and you?'", accepted_answers: [{value: "Ich bin froh, weil ich frei habe. Und Sie?", status: "correct"}, {value: "Ich bin froh weil ich frei habe Und Sie", status: "correct"}, {value: "Ich bin froh, weil ich heute frei habe. Und Sie?", status: "correct"}, {value: "Ich bin froh weil ich heute frei habe Und Sie", status: "correct"}], feedback: "The reply gives a feeling, a reason, and asks back."}
  de.a1.unit22.lesson02.exercise06.write_feeling_reason: {instruction: "Write a basic feeling with a reason: I am glad because I have the day off.", accepted_answers: [{value: "Ich bin froh, weil ich frei habe.", status: "correct"}, {value: "Ich bin froh weil ich frei habe", status: "correct"}, {value: "Ich bin froh, weil ich heute frei habe.", status: "correct"}, {value: "Ich bin froh weil ich heute frei habe", status: "correct"}], feedback: "The sentence expresses a feeling and its simple cause."}
  de.a1.unit22.lesson02.exercise07.dictation_ich_bin_froh: {correct_response: "Ich bin froh.", orthography_strict: true, feedback: "Type the sentence exactly as you hear it."}
