  de.a1.unit22.lesson02.teach.reason_happy: {title: "Ich bin froh, weil ich frei habe.", gloss: "I am glad because I have the day off.", note: "The sentence gives a feeling and a reason.", example_gloss: "I am glad because I have the day off."}
  de.a1.unit22.lesson02.teach.reason_tired: {title: "Ich bin müde, weil ich viel arbeite.", gloss: "I am tired because I work a lot.", note: "At this level, learn the full phrase as a useful reason sentence.", example_gloss: "I am tired because I work a lot."}
  de.a1.unit22.lesson02.teach.feeling_text: {title: "Gefühle und Gründe", gloss: "feelings and reasons", note: "The short text links each feeling to a simple cause.", example_gloss: "Anna is glad."}
  de.a1.unit22.lesson02.teach.line01: {title: "Felix asks how Anna feels", gloss: "Felix: How do you feel today?", note: "Formal *Sie* keeps the question polite.", example_gloss: "In context: How do you feel today?"}
  de.a1.unit22.lesson02.teach.line02: {title: "Anna gives a feeling and a reason", gloss: "Anna: I am glad because I have the day off. And you?", note: "Anna states a feeling and asks back.", example_gloss: "In context: I am glad because I have the day off."}
  de.a1.unit22.lesson02.teach.line03: {title: "Felix gives his reason", gloss: "Felix: I am tired because I work a lot.", note: "Felix gives tiredness plus the reason.", example_gloss: "I am tired because I work a lot."}
