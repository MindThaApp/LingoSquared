  de.a1.unit22.lesson01.teach.froh: {title: "froh", gloss: "glad / happy", note: "*froh* is a simple A1-friendly feeling word.", example_gloss: "I am glad."}
  de.a1.unit22.lesson01.teach.muede: {title: "müde", gloss: "tired", note: "*müde* means tired.", example_gloss: "I am tired."}
  de.a1.unit22.lesson01.teach.traurig: {title: "traurig", gloss: "sad", note: "*traurig* means sad.", example_gloss: "I am sad."}
  de.a1.unit22.lesson01.teach.wie_fuehlen: {title: "Wie fühlen Sie sich?", gloss: "How do you feel?", note: "German includes *sich* in this question.", example_gloss: "In context: How do you feel today?"}
  de.a1.unit22.lesson02.teach.weil: {title: "weil", gloss: "because", note: "*weil* introduces a reason.", example_gloss: "I am glad because I have the day off."}
  de.a1.unit22.lesson02.teach.frei: {title: "frei", gloss: "free / off", note: "*frei haben* means to have time off.", example_gloss: "I have today off."}
