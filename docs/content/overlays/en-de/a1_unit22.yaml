  de.a1.unit22.lesson01.teach.gefuehl: {title: "Gefühl", gloss: "feeling / emotion", note: "*Gefühl* is the general word for a feeling.", example_gloss: "Glad is a feeling."}
  de.a1.unit22.lesson01.teach.froh: {title: "froh", gloss: "glad / happy", note: "*froh* is a simple A1-friendly feeling word.", example_gloss: "I am glad."}
  de.a1.unit22.lesson01.teach.muede: {title: "müde", gloss: "tired", note: "*müde* means tired.", example_gloss: "I am tired."}
  de.a1.unit22.lesson01.teach.traurig: {title: "traurig", gloss: "sad", note: "*traurig* means sad.", example_gloss: "I am sad."}
  de.a1.unit22.lesson01.teach.wie_fuehlen: {title: "Wie fühlen Sie sich?", gloss: "How do you feel?", note: "German includes *sich* in this question.", example_gloss: "How do you feel?"}
  de.a1.unit22.lesson02.teach.weil: {title: "weil", gloss: "because", note: "*weil* introduces a reason.", example_gloss: "I am glad because I have the day off."}
  de.a1.unit22.lesson02.teach.frei: {title: "frei", gloss: "free / off", note: "*frei haben* means to have time off.", example_gloss: "I have today off."}
  de.a1.unit22.lesson02.teach.viel: {title: "viel", gloss: "a lot / much", note: "*viel* describes a large amount.", example_gloss: "I work a lot."}
  de.a1.unit22.lesson02.teach.reason_happy: {title: "Ich bin froh, weil ich frei habe.", gloss: "I am glad because I have the day off.", note: "The sentence gives a feeling and a reason.", example_gloss: "I am glad because I have the day off."}
  de.a1.unit22.lesson02.teach.reason_tired: {title: "Ich bin müde, weil ich viel arbeite.", gloss: "I am tired because I work a lot.", note: "At this level, learn the full phrase as a useful reason sentence.", example_gloss: "I am tired because I work a lot."}
  de.a1.unit22.lesson02.teach.feeling_text: {title: "Gefühle und Gründe", gloss: "feelings and reasons", note: "The short text links each feeling to a simple cause.", example_gloss: "Anna is glad."}
  de.a1.unit22.lesson02.teach.line01: {title: "Felix fragt nach Annas Gefühl", gloss: "Felix: Wie fühlen Sie sich heute?", note: "Formal *Sie* keeps the question polite.", example_gloss: "How do you feel today?"}
  de.a1.unit22.lesson02.teach.line02: {title: "Anna sagt Gefühl und Grund", gloss: "Anna: Ich bin froh, weil ich frei habe. Und Sie?", note: "Anna states a feeling and asks back.", example_gloss: "I am glad because I have the day off. And you?"}
  de.a1.unit22.lesson02.teach.line03: {title: "Felix sagt seinen Grund", gloss: "Felix: Ich bin müde, weil ich viel arbeite.", note: "Felix gives tiredness plus the reason.", example_gloss: "I am tired because I work a lot."}
  de.a1.unit22.lesson02.teach.line04: {title: "Anna macht einen kleinen Plan", gloss: "Anna: Dann trinken wir Kaffee.", note: "Anna responds with a simple immediate plan.", example_gloss: "Then we drink coffee."}
exercises:
  de.a1.unit22.lesson01.exercise01.listen_froh: {instruction: "Listen and select the feeling sentence you hear.", correct_option: "Ich bin froh.", distractors: ["Ich bin müde.", "Ich bin traurig.", "Wie fühlen Sie sich?"], accepted_answers: [{value: "Ich bin froh.", status: "correct"}], feedback: "*Ich bin froh* means I am glad."}
  de.a1.unit22.lesson01.exercise02.choose_tired: {instruction: "Which sentence means 'I am tired'?", correct_option: "Ich bin müde.", distractors: ["Ich habe müde.", "Ich fühle müde sich.", "Ich bin Müdigkeit."], accepted_answers: [{value: "Ich bin müde.", status: "correct"}], feedback: "Use *Ich bin müde* for 'I am tired.'"}
  de.a1.unit22.lesson01.exercise03.match_feelings:
    instruction: "Match each feeling word to its meaning."
    accepted_answers: [{value: [{left: "allgemeines Wort für Emotion", right: "Gefühl"}, {left: "glücklich oder zufrieden", right: "froh"}, {left: "braucht Schlaf", right: "müde"}, {left: "nicht froh", right: "traurig"}, {left: "Verb in Wie fühlen Sie sich", right: "fühlen"}, {left: "Wort am Ende der Gefühlsfrage", right: "sich"}], status: "correct"}]
    feedback: "These words support asking about and stating feelings."
  de.a1.unit22.lesson01.exercise04.order_happy: {instruction: "Put the words in order: 'I am glad.'", accepted_answers: [{value: ["Ich", "bin", "froh"], status: "correct"}], feedback: "The feeling follows *bin*."}
  de.a1.unit22.lesson01.exercise05.write_feeling: {instruction: "Write the taught feeling sentence: I am glad.", accepted_answers: [{value: "Ich bin froh.", status: "correct"}, {value: "Ich bin froh", status: "correct"}], feedback: "*Ich bin froh* states a basic feeling."}
  de.a1.unit22.lesson02.exercise01.listen_feeling_reason: {instruction: "Listen to the dialogue. What feeling and reason does Anna give?", correct_option: "glad because she has the day off", distractors: ["sad because she is at home", "angry because the shop is closed", "calm because the room is quiet"], accepted_answers: [{value: "glad because she has the day off", status: "correct"}], feedback: "Anna says she is glad because she has the day off."}
  de.a1.unit22.lesson02.exercise02.choose_reason: {instruction: "Which sentence means 'I am tired because I work a lot'?", correct_option: "Ich bin müde, weil ich viel arbeite.", distractors: ["Ich bin müde, weil ich arbeite viel.", "Ich habe müde, weil ich viel arbeite.", "Ich bin viel, weil ich müde arbeite."], accepted_answers: [{value: "Ich bin müde, weil ich viel arbeite.", status: "correct"}], feedback: "Learn this full *weil* reason sentence."}
  de.a1.unit22.lesson02.exercise03.match_reasons:
    instruction: "Match each feeling and reason detail."
    accepted_answers: [{value: [{left: "Person mit freiem Tag", right: "Anna"}, {left: "Annas Gefühl", right: "froh"}, {left: "Annas Grund", right: "frei"}, {left: "Person mit viel Arbeit", right: "Felix"}, {left: "Felix' Gefühl", right: "müde"}, {left: "Wort für große Menge", right: "viel"}], status: "correct"}]
    feedback: "The dialogue links feelings to simple causes."
  de.a1.unit22.lesson02.exercise04.order_reason: {instruction: "Put the words in order: 'I am glad because I have the day off.'", accepted_answers: [{value: ["Ich", "bin", "froh", "weil", "ich", "frei", "habe"], status: "correct"}], feedback: "The reason follows *weil*."}
  de.a1.unit22.lesson02.exercise05.reply_feelings: {instruction: "Reply as Anna: say you are glad because you have the day off, then ask 'and you?'", accepted_answers: [{value: "Ich bin froh, weil ich frei habe. Und Sie?", status: "correct"}, {value: "Ich bin froh weil ich frei habe Und Sie", status: "correct"}], feedback: "The reply gives a feeling, a reason, and asks back."}
  de.a1.unit22.lesson02.exercise06.write_feeling_reason: {instruction: "Write a basic feeling with a reason: I am glad because I have the day off.", accepted_answers: [{value: "Ich bin froh, weil ich frei habe.", status: "correct"}, {value: "Ich bin froh weil ich frei habe", status: "correct"}], feedback: "The sentence expresses a feeling and its simple cause."}
