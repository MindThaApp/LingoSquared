  notes: >-
    Overlay for German's seventh C1 unit, authored alongside the realization
    (no adaptable public-domain German C1 mediation source exists; see the
    realization provenance note). English speakers' real interference risks
    for this outcome: (1) the mediation verbs (vermitteln, zusammenfassen,
    darstellen, wiedergeben) are each glossed against the English reporting
    verb they overlap but do not map one-to-one onto; (2) the two attribution
    markers (laut + genitive vs. dem Bericht zufolge) are contrasted explicitly
    so the learner stops treating "according to" as a single German word; (3)
    the technical term Datenübertragung is resolved into plain words (das
    heißt / zuverlässig übertragen) for the non-specialist audience; (4) the
    culminating writing/speaking prompts name the exact synthesis the answer
    must deliver (condense both sources, explain the term, preserve the
    disagreement) so the multi-sentence briefing has one well-determined
    answer. No sibling-direction file (de-en) was consulted.

    Fresh-context review 2026-10-11 (content-reviewer.md checklist): see the
    realization review note. Overlay changes: briefing/mediation instructions
    give the English model text; speak_kern and the briefing gloss say 'not
    ready yet'; accepted answers widened for lesson01.exercise07,
    lesson02.exercise07, lesson04.exercise05; quelle_markt note fixed;
    listen_technik distractor swapped.

    Language review 2026-10-24 (session 10): 3 fixes -- lesson02.teach.fertig
    note (ausgereift and fertig are not identical; mediator must check nothing
    is lost); lesson03.exercise03 feedback (same claim);
    lesson06.teach.vogel_lage title and gloss 'Mr Weber, how are things?' ->
    'Mr. Weber, what is the situation?'. Native flags: realization (not in
    this batch): 'sicher uebertragen' is ambiguous between securely and
    reliably, and the source talks about errors so 'zuverlaessig' fits better
    than the English gloss 'securely'; 'zwischen den beiden Berichten
    vermitteln' is unidiomatic (zwischen zwei Positionen); 'Die Technik nennt
    offene Fehler' reads better as 'meldet'.

    Owner decisions 2026-10-24 (PR #88 follow-up): paired realization changed (see its note); this
    overlay's glosses, instructions, accepted answers and feedback follow it.

course:
  title: German C1
  description: >-
    Advanced German: mediate between complex or conflicting sources and
    audiences -- distill, explain, and relay material accurately in formal
    register.

units:
  de.c1.unit07.zwischen_quellen_vermitteln:
    title: "Mediating between sources"
    description: "Distill two conflicting reports and relay them accurately to a non-specialist audience -- attribute claims, resolve technical terms, and preserve the disagreement."

lessons:
  de.c1.unit07.lesson01.zwischen_quellen_vermitteln:
    title: "Mediating between sources"
  de.c1.unit07.lesson02.wer_was_behauptet:
    title: "Saying who claims what"
  de.c1.unit07.lesson03.fachbegriffe_erklaeren:
    title: "Explaining technical terms"
  de.c1.unit07.lesson04.zwei_quellen_lesen:
    title: "Reading two sources"
  de.c1.unit07.lesson05.fuer_die_geschaeftsleitung:
    title: "Summarizing for the management board"
  de.c1.unit07.lesson06.die_vollstaendige_vermittlung:
    title: "The complete mediation"

teaching:
  de.c1.unit07.lesson01.teach.vermitteln:
    title: "to mediate / to relay"
    gloss: "to mediate / to relay"
    note: "*Vermitteln* = to mediate, to relay material between two sides. A mediator (*der Vermittler*) stands between sources and the audience and carries information over accurately."
    example_gloss: "We mediate between the two reports."
  de.c1.unit07.lesson01.teach.zusammenfassen:
    title: "to summarize"
    gloss: "to summarize"
    note: "*Zusammenfassen* = to summarize, to condense. A separable verb: *fassen ... zusammen* in the present. This is the core of mediation -- you distill, not copy."
    example_gloss: "You are to summarize the report."
  de.c1.unit07.lesson01.teach.darstellen:
    title: "to present / to portray"
    gloss: "to present / to portray"
    note: "*Darstellen* = to present or portray something, to lay out how a situation stands. Neutral -- it does not judge, it represents."
    example_gloss: "We are to present the situation."
  de.c1.unit07.lesson01.teach.wiedergeben:
    title: "to reproduce / to relay faithfully"
    gloss: "to reproduce / to relay faithfully"
    note: "*Wiedergeben* = to give something back, to reproduce or relay it faithfully. A mediator *gibt* a source's view *wieder* without adding their own opinion."
    example_gloss: "You are to relay the perspective faithfully."
  de.c1.unit07.lesson01.teach.einschaetzung:
    title: "the assessment"
    gloss: "the assessment"
    note: "*Die Einschätzung* = the assessment, the judgment or estimate of a situation. Different sources give different *Einschätzungen*."
    example_gloss: "The assessment is clear."
  de.c1.unit07.lesson01.teach.quelle:
    title: "the source"
    gloss: "the source"
    note: "*Die Quelle* = the source -- the report, document, or person the information comes from. Mediation always works *zwischen* two or more *Quellen*."
    example_gloss: "The source is important."

  de.c1.unit07.lesson02.teach.laut:
    title: "according to (the technical report)"
    gloss: "according to (the technical report)"
    note: "*Laut* + dative = according to, as stated by. *Laut dem technischen Bericht* names the source before the claim. It stays neutral -- you attribute, you do not vouch."
  de.c1.unit07.lesson02.teach.zufolge:
    title: "according to (the report)"
    gloss: "according to (the report)"
    note: "*Dem Bericht zufolge* = according to the report. *Zufolge* follows the dative noun (*dem Bericht zufolge*), unlike *laut* which comes first. Two ways to do the same attribution."
  de.c1.unit07.lesson02.teach.widersprechen:
    title: "to contradict each other"
    gloss: "to contradict each other"
    note: "*Sich widersprechen* = to contradict each other. When two sources say opposite things, *die Berichte widersprechen sich*. A mediator must name this, not hide it."
    example_gloss: "The two reports contradict each other."
  de.c1.unit07.lesson02.teach.widerspruch:
    title: "the contradiction"
    gloss: "the contradiction"
    note: "*Der Widerspruch* = the contradiction, the point where two accounts disagree. A fair mediation *benennt* (names) the *Widerspruch* instead of presenting it as agreement."
    example_gloss: "The contradiction is clear."
  de.c1.unit07.lesson02.teach.einig:
    title: "to be in agreement"
    gloss: "to be in agreement"
    note: "*Sich einig sein* = to be in agreement, of one opinion. The opposite of *sich widersprechen*: *Beide Berichte sind sich nicht einig*."
    example_gloss: "The two reports do not agree."
  de.c1.unit07.lesson02.teach.fertig:
    title: "ready / finished"
    gloss: "ready / finished"
    note: "*Fertig* = ready, finished. The plain-language word a mediator can use for non-specialists where a technical source says *noch nicht ausgereift* ('not yet fully developed'). The two are close in practice but not identical, so check that nothing important is lost."
    example_gloss: "The system is not ready yet."

  de.c1.unit07.lesson03.teach.vereinfachen:
    title: "to simplify"
    gloss: "to simplify"
    note: "*Vereinfachen* = to simplify, to make easier to understand. A mediator *vereinfacht* complex material for a non-specialist audience without falsifying it."
    example_gloss: "We simplify the technical term."
  de.c1.unit07.lesson03.teach.fachbegriff:
    title: "the technical term"
    gloss: "the technical term"
    note: "*Der Fachbegriff* = the technical term, the specialist word. For a non-specialist audience, a mediator *erklärt* (explains) every *Fachbegriff*."
    example_gloss: "The technical term is difficult."
  de.c1.unit07.lesson03.teach.das_heisst:
    title: "that means"
    gloss: "that means"
    note: "*Das heißt* = that means. The mediator's bridge: after a technical term you add *das heißt* and give the plain-language explanation."
  de.c1.unit07.lesson03.teach.mit_anderen_worten:
    title: "in other words"
    gloss: "in other words"
    note: "*Mit anderen Worten* = in other words. A second way to rephrase a complex point more simply for the audience."
  de.c1.unit07.lesson03.teach.datenuebertragung:
    title: "data transfer"
    gloss: "data transfer"
    note: "*Die Datenübertragung* = data transfer, the movement of data between systems. The technical term the briefing resolves into plain words."
    example_gloss: "There are defects in the data transfer."
  de.c1.unit07.lesson03.teach.sicher_uebertragen:
    title: "to transmit reliably"
    gloss: "to transmit reliably"
    note: "*Die Daten zuverlässig übertragen* = to transmit the data reliably. The plain-language version of a working *Datenübertragung* -- the everyday verb *übertragen* plus *zuverlässig* (reliably, i.e. without errors; *sicher* would be ambiguous between safely/securely and reliably)."
  de.c1.unit07.lesson03.teach.funktion:
    title: "the feature"
    gloss: "the feature"
    note: "*Die Funktion* = the feature (or function). Here: the new software feature the market is waiting for."
    example_gloss: "The new feature is important."

  de.c1.unit07.lesson04.teach.quelle_technik:
    title: "The technical source"
    gloss: "The system is technically not yet mature. We need six months for comprehensive tests. There are still defects in the data transfer."
    note: "The technical source makes three claims: the system is not *ausgereift*, it needs *sechs Monate* of testing, and there are *Fehler* in the *Datenübertragung*. For the Geschäftsleitung the essential point is: not ready yet."
  de.c1.unit07.lesson04.teach.quelle_markt:
    title: "The market source"
    gloss: "The market is waiting for the new feature. If we do not launch soon, we lose customers. The costs are manageable."
    note: "The market source makes three claims: the market *wartet* (is waiting), a delayed launch loses *Kunden*, and the *Kosten* are *überschaubar*. Its essential point is: launch soon."
  de.c1.unit07.lesson04.teach.vermittler_muster:
    title: "What a mediator does"
    gloss: "The mediator keeps what matters and explains the technical terms."
    note: "*Der Vermittler behält das Wichtige und erklärt die Fachbegriffe.* When relaying to an audience, keep what the audience needs, explain specialist words, and drop the detail they do not need."

  de.c1.unit07.lesson05.teach.einerseits_andererseits:
    title: "On the one hand ... on the other hand"
    gloss: "On the one hand the system is not ready. On the other hand the market is waiting."
    note: "*Einerseits ... andererseits ...* frames two opposing sides fairly, without taking one. The mediator's core structure for presenting a conflict."
  de.c1.unit07.lesson05.teach.die_technik:
    title: "the technical side"
    gloss: "the technical side"
    note: "*Die Technik* = the technical side (the engineering view). Here it is the source that *nennt offene Fehler* -- it identifies open defects."
    example_gloss: "The technical side identifies open defects."
  de.c1.unit07.lesson05.teach.frage_bleibt_offen:
    title: "The question remains open."
    gloss: "The question remains open."
    note: "*Die Frage bleibt offen* = the question remains open. A mediator preserves uncertainty rather than pretending there is a settled answer."
  de.c1.unit07.lesson05.teach.briefing:
    title: "The full briefing"
    gloss: "On the one hand the system is technically not ready yet. On the other hand the market is waiting for the new feature. The technical side identifies open defects in the data transfer -- that means the data is not yet transmitted reliably. The two reports contradict each other, and the question remains open."
    note: "The complete mediation in four moves: condense the technical source, condense the market source, explain the technical term *Datenübertragung* in plain words (*das heißt ... zuverlässig übertragen*), and preserve the disagreement (*widersprechen sich*) plus the open question (*bleibt offen*)."
  de.c1.unit07.lesson05.teach.kurz_klar:
    title: "Brief and clear"
    gloss: "For the management board, summarize the reports briefly and clearly."
    note: "*Für die Geschäftsleitung fassen Sie die Berichte kurz und klar zusammen.* The audience sets the register: short, clear, and free of specialist jargon."

  de.c1.unit07.lesson06.teach.vogel_lage:
    title: "Frau Vogel: Mr. Weber, what is the situation?"
    gloss: "Mr. Weber, what is the situation?"
    note: "Frau Vogel opens with a status question. *Die Lage* = the situation, the state of affairs."
  de.c1.unit07.lesson06.teach.felix_technik:
    title: "Felix: The technical report says the system is not ready yet."
    gloss: "The technical report says the system is not ready yet."
    note: "Felix reports the technical source first, with attribution: *der technische Bericht sagt*."
  de.c1.unit07.lesson06.teach.vogel_markt:
    title: "Frau Vogel: And what does the market say?"
    gloss: "And what does the market say?"
    note: "Frau Vogel asks for the second, conflicting source."
  de.c1.unit07.lesson06.teach.felix_kunden:
    title: "Felix: The market is waiting for the feature. Otherwise we lose customers."
    gloss: "The market is waiting for the feature. Otherwise we lose customers."
    note: "Felix reports the market source: *wartet auf die Funktion*, and *sonst verlieren wir Kunden* names the consequence of delay."
  de.c1.unit07.lesson06.teach.vogel_widerspruch:
    title: "Frau Vogel: Then the two reports contradict each other. Please summarize this."
    gloss: "Then the two reports contradict each other. Please summarize this."
    note: "Frau Vogel names the disagreement (*widersprechen sich*) and asks Felix for the mediation (*fassen Sie das zusammen*)."
  de.c1.unit07.lesson06.teach.vermittlung_muster:
    title: "What a mediator does"
    gloss: "For the management board, keep what matters and name the contradiction."
    note: "*Für die Geschäftsleitung behalten Sie das Wichtige und benennen den Widerspruch.* A fair mediation keeps what the audience needs and names the conflict openly."

exercises:
  de.c1.unit07.lesson01.exercise01.recognize_vermitteln:
    instruction: "What does vermitteln mean?"
    correct_option: "To mediate / to relay between two sides."
    distractors: ["To invent new information.", "To ignore a source.", "To disagree with a report."]
    accepted_answers: [{value: "To mediate / to relay between two sides.", status: correct}]
    feedback: "*Vermitteln* = to mediate, to carry information accurately between sources and an audience."

  de.c1.unit07.lesson01.exercise02.listen_vermitteln:
    instruction: "Listen and select the meaning of the sentence."
    correct_option: "We mediate between the two reports."
    distractors: ["We write the two reports.", "We disagree with the two reports.", "We ignore the two reports."]
    accepted_answers: [{value: "We mediate between the two reports.", status: correct}]
    feedback: "*Wir vermitteln zwischen den beiden Berichten* -- the mediator stands between two sources."

  de.c1.unit07.lesson01.exercise03.match_vermitteln:
    instruction: "Match each German mediation verb to its meaning."
    accepted_answers:
      - value: {"vermitteln": "to mediate / to relay", "zusammenfassen": "to summarize", "darstellen": "to present / to portray", "wiedergeben": "to reproduce / to relay faithfully", "die Einschätzung": "the assessment", "die Quelle": "the source"}
        status: correct
    feedback: "The mediation toolkit: *vermitteln* (mediate), *zusammenfassen* (condense), *darstellen* (present), *wiedergeben* (relay faithfully), plus *die Einschätzung* and *die Quelle*."

  de.c1.unit07.lesson01.exercise04.order_vermitteln:
    instruction: "Put the German words in order."
    accepted_answers:
      - {value: "Wir vermitteln zwischen den beiden Berichten", status: correct}
    feedback: "*Wir vermitteln zwischen den beiden Berichten* -- the mediator between two sources."

  de.c1.unit07.lesson01.exercise05.translate_vermitteln:
    instruction: "Translate into German, using vermitteln: We mediate between the two reports."
    accepted_answers:
      - {value: "Wir vermitteln zwischen den beiden Berichten", status: correct}
      - {value: "Wir vermitteln zwischen den beiden Berichten.", status: correct}
    feedback: "*Wir vermitteln zwischen den beiden Berichten* -- *vermitteln* takes the mediator (we) and the two sides (*zwischen den beiden Berichten*)."

  de.c1.unit07.lesson01.exercise06.speak_vermitteln:
    instruction: "Say aloud in German, using vermitteln: We mediate between the two reports."
    accepted_answers:
      - {value: "Wir vermitteln zwischen den beiden Berichten", status: correct}
      - {value: "Wir vermitteln zwischen den beiden Berichten.", status: correct}
    feedback: "Spoken, *Wir vermitteln zwischen den beiden Berichten*."

  de.c1.unit07.lesson01.exercise07.write_darstellen:
    instruction: "Write in German, using darstellen: We are to present the situation."
    accepted_answers:
      - {value: "Wir sollen die Lage darstellen", status: correct}
      - {value: "Wir sollen die Lage darstellen.", status: correct}
      - {value: "Wir sollen die Situation darstellen", status: correct}
      - {value: "Wir sollen die Situation darstellen.", status: correct}
    feedback: "*Wir sollen die Lage darstellen* -- *darstellen* with the situation (*die Lage*) as its object."

  de.c1.unit07.lesson02.exercise01.recognize_laut:
    instruction: "What does laut dem technischen Bericht mean?"
    correct_option: "According to the technical report."
    distractors: ["Despite the technical report.", "Against the technical report.", "About writing the technical report."]
    accepted_answers: [{value: "According to the technical report.", status: correct}]
    feedback: "*Laut dem technischen Bericht* = according to the technical report -- neutral attribution, no endorsement."

  de.c1.unit07.lesson02.exercise02.listen_zufolge:
    instruction: "Listen and select the meaning of the sentence."
    correct_option: "According to the report, the system is not ready yet."
    distractors: ["According to the report, the system is finished.", "The report is finished.", "The system is ready for launch."]
    accepted_answers: [{value: "According to the report, the system is not ready yet.", status: correct}]
    feedback: "*Dem Bericht zufolge ist das System noch nicht fertig* -- *dem Bericht zufolge* = according to the report."

  de.c1.unit07.lesson02.exercise03.match_attribution:
    instruction: "Match each German attribution or disagreement phrase to its meaning."
    accepted_answers:
      - value: {"laut dem Bericht": "according to the report", "sich widersprechen": "to contradict each other", "der Widerspruch": "the contradiction", "sich einig sein": "to be in agreement", "fertig": "ready / finished", "der technische Bericht": "the technical report"}
        status: correct
    feedback: "Attribution (*laut dem Bericht*) and disagreement (*sich widersprechen*, *der Widerspruch*) against agreement (*sich einig sein*) -- the mediator's toolkit for preserving who said what."

  de.c1.unit07.lesson02.exercise04.order_zufolge:
    instruction: "Put the German words in order."
    accepted_answers:
      - {value: "Dem Bericht zufolge ist das System noch nicht fertig", status: correct}
    feedback: "*Dem Bericht zufolge ist das System noch nicht fertig* -- *zufolge* follows its dative noun."

  de.c1.unit07.lesson02.exercise05.translate_laut:
    instruction: "Translate into German, using laut dem technischen Bericht: According to the technical report, the system is not ready yet."
    accepted_answers:
      - {value: "Laut dem technischen Bericht ist das System noch nicht fertig", status: correct}
      - {value: "Laut dem technischen Bericht ist das System noch nicht fertig.", status: correct}
    feedback: "*Laut dem technischen Bericht ist das System noch nicht fertig* -- *laut* + dative names the source first."

  de.c1.unit07.lesson02.exercise06.speak_widersprechen:
    instruction: "Say aloud in German, using sich widersprechen: The two reports contradict each other."
    accepted_answers:
      - {value: "Die beiden Berichte widersprechen sich", status: correct}
      - {value: "Die beiden Berichte widersprechen sich.", status: correct}
    feedback: "Spoken, *Die beiden Berichte widersprechen sich*."

  de.c1.unit07.lesson02.exercise07.write_einig:
    instruction: "Write in German, using sich einig sein: The two reports do not agree."
    accepted_answers:
      - {value: "Beide Berichte sind sich nicht einig", status: correct}
      - {value: "Beide Berichte sind sich nicht einig.", status: correct}
      - {value: "Die beiden Berichte sind sich nicht einig", status: correct}
      - {value: "Die beiden Berichte sind sich nicht einig.", status: correct}
    feedback: "*Beide Berichte sind sich nicht einig* -- *sich einig sein* negated."

  de.c1.unit07.lesson03.exercise01.recognize_vereinfachen:
    instruction: "What does vereinfachen mean?"
    correct_option: "To simplify."
    distractors: ["To complicate.", "To translate word for word.", "To omit entirely."]
    accepted_answers: [{value: "To simplify.", status: correct}]
    feedback: "*Vereinfachen* = to simplify -- make complex material understandable for the audience without falsifying it."

  de.c1.unit07.lesson03.exercise02.listen_heisst:
    instruction: "Listen and select the meaning of the sentence."
    correct_option: "That means the data is not yet transmitted reliably."
    distractors: ["That means the data is already secure.", "That means the data is deleted.", "That means the system is finished."]
    accepted_answers: [{value: "That means the data is not yet transmitted reliably.", status: correct}]
    feedback: "*Das heißt, die Daten werden noch nicht zuverlässig übertragen* -- *das heißt* introduces the plain-language explanation of the technical term."

  de.c1.unit07.lesson03.exercise03.match_terminologie:
    instruction: "Match each German term to its meaning."
    accepted_answers:
      - value: {"vereinfachen": "to simplify", "der Fachbegriff": "the technical term", "die Datenübertragung": "data transfer", "die Funktion": "the feature", "zuverlässig übertragen": "to transmit reliably", "fertig": "ready / finished"}
        status: correct
    feedback: "Resolving terminology: *der Fachbegriff* (technical term) is *vereinfacht* (simplified) -- *die Datenübertragung* becomes *zuverlässig übertragen*, *noch nicht ausgereift* can be put plainly as *noch nicht fertig*."

  de.c1.unit07.lesson03.exercise04.order_heisst:
    instruction: "Put the German words in order."
    accepted_answers:
      - {value: "Das heißt die Daten werden noch nicht zuverlässig übertragen", status: correct}
    feedback: "*Das heißt, die Daten werden noch nicht zuverlässig übertragen* -- *das heißt* plus the plain explanation."

  de.c1.unit07.lesson03.exercise05.translate_uebertragen:
    instruction: "Translate into German, using zuverlässig übertragen: The data is transmitted reliably."
    accepted_answers:
      - {value: "Die Daten werden zuverlässig übertragen", status: correct}
      - {value: "Die Daten werden zuverlässig übertragen.", status: correct}
      - {value: "Die Daten werden zuverlaessig uebertragen", status: correct}
      - {value: "Die Daten werden zuverlaessig uebertragen.", status: correct}
    feedback: "*Die Daten werden zuverlässig übertragen* -- the plain-language version of a working *Datenübertragung*."

  de.c1.unit07.lesson03.exercise06.speak_heisst:
    instruction: "Say aloud in German, using das heißt: That means the data is not yet transmitted reliably."
    accepted_answers:
      - {value: "Das heißt, die Daten werden noch nicht zuverlässig übertragen", status: correct}
      - {value: "Das heißt, die Daten werden noch nicht zuverlässig übertragen.", status: correct}
      - {value: "Das heisst, die Daten werden noch nicht zuverlaessig uebertragen", status: correct}
      - {value: "Das heisst, die Daten werden noch nicht zuverlaessig uebertragen.", status: correct}
    feedback: "Spoken, *Das heißt, die Daten werden noch nicht zuverlässig übertragen*."

  de.c1.unit07.lesson03.exercise07.write_vereinfachen:
    instruction: "Write in German, using vereinfachen and der Fachbegriff: We simplify the technical term."
    accepted_answers:
      - {value: "Wir vereinfachen den Fachbegriff", status: correct}
      - {value: "Wir vereinfachen den Fachbegriff.", status: correct}
    feedback: "*Wir vereinfachen den Fachbegriff* -- *vereinfachen* takes the technical term as its object."

  de.c1.unit07.lesson04.exercise01.read_technik:
    instruction: "What is the essential point of the technical source?"
    correct_option: "The system is not yet mature and needs more testing."
    distractors: ["The system is ready to launch now.", "The costs are manageable.", "The market is waiting for the feature."]
    accepted_answers: [{value: "The system is not yet mature and needs more testing.", status: correct}]
    feedback: "*Das System ist technisch noch nicht ausgereift* -- the essential point for the audience: it is not ready yet."

  de.c1.unit07.lesson04.exercise02.read_markt:
    instruction: "What is the essential point of the market source?"
    correct_option: "The market is waiting; a delay loses customers."
    distractors: ["The system is technically mature.", "The costs are too high.", "Testing is complete."]
    accepted_answers: [{value: "The market is waiting; a delay loses customers.", status: correct}]
