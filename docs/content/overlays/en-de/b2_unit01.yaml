course:
  title: German B2
  description: >-
    Upper-intermediate German: defend a position in a discussion -- state
    a claim, support it with reasons and evidence (erstens, zum Beispiel,
    Studien zeigen, dass), acknowledge the strongest opposing point
    (einerseits ... andererseits, obwohl, natürlich), and rebut it without
    conceding (trotzdem, dagegen, jedoch, das ändert nichts daran, dass,
    kurz gesagt), around the everyday workplace debate of working from
    home.

units:
  de.b2.unit01.argumentation:
    title: "Argumentation"
    description: Defend a position on an everyday issue -- state a claim, support it with reasons and evidence, acknowledge the strongest objection, and rebut it without giving up your claim.

lessons:
  de.b2.unit01.lesson01.eine_position_vertreten:
    title: "Taking a position"
  de.b2.unit01.lesson02.gruende_und_belege_nennen:
    title: "Giving reasons and evidence"
  de.b2.unit01.lesson03.die_andere_seite_anerkennen:
    title: "Acknowledging the other side"
  de.b2.unit01.lesson04.widerlegen:
    title: "Rebutting"
  de.b2.unit01.lesson05.einen_kommentar_lesen:
    title: "Reading a comment"
  de.b2.unit01.lesson06.eine_position_verteidigen:
    title: "Defending a position"

teaching:
  de.b2.unit01.lesson01.teach.homeoffice:
    title: "home office / working from home"
    gloss: "home office / working from home"
    note: "*Homeoffice* is the everyday modern word for working from home, used article-less as a general activity, much like an English gerund. It is the topic this whole unit argues about."
    example_gloss: "Home office saves time."
  de.b2.unit01.lesson01.teach.im_buero_arbeiten:
    title: "to work at the office"
    gloss: "to work at the office"
    note: "The opposite pole of the debate. *Im Büro* means 'at the office'; the infinitive *arbeiten* goes to the end when it follows a helper verb."
  de.b2.unit01.lesson01.teach.eine_meinung:
    title: "an opinion"
    gloss: "an opinion"
    note: "*Eine Meinung* is the plain noun for an opinion -- the general idea behind the two fixed phrases on this card (*Ich finde, dass...* and *Meiner Meinung nach...*)."
    example_gloss: "I have a clear opinion."
  de.b2.unit01.lesson01.teach.ich_finde_dass:
    title: "I think that..."
    gloss: "I think that... / I find that..."
    note: "*Ich finde, dass...* introduces your own opinion and sends the finite verb of the following clause to the very end: *ich finde, dass Homeoffice besser ist* (not '...dass ist Homeoffice besser')."
  de.b2.unit01.lesson01.teach.meiner_meinung_nach:
    title: "In my opinion..."
    gloss: "In my opinion..."
    note: "*Meiner Meinung nach* is a common way to open an opinion without a *dass*-clause. Because it opens the sentence, the verb comes right after it: *Meiner Meinung nach ist Homeoffice besser*."
  de.b2.unit01.lesson01.teach.besser:
    title: better
    gloss: better
    example_gloss: "This solution is better."
  de.b2.unit01.lesson01.teach.als:
    title: than
    gloss: than
    note: "*Als* is 'than' in a comparison: *besser als* = 'better than'. It also introduces a comparison to a whole action, as in this lesson's claim (*als im Büro zu arbeiten* = 'than working at the office')."
    example_gloss: "Home office is better than commuting."
  de.b2.unit01.lesson01.teach.claim_model:
    title: "I think that home office is better than working at the office."
    gloss: "I think that home office is better than working at the office."
    note: "The model claim for this unit. German compares to a whole action with *als + zu*-infinitive: *besser ist, als im Büro zu arbeiten* -- literally 'better, than to work at the office'. English has no matching word order here."
  de.b2.unit01.lesson01.teach.ich_stimme_dem_zu:
    title: "I agree with it."
    gloss: "I agree with it."
    note: "*Jemandem/einer Sache zustimmen* = 'to agree with someone/something'; *zu* is the separable verb particle, sent to the end: *Ich stimme dem zu*. *Dem* refers back to the claim just made."
  de.b2.unit01.lesson01.teach.grammar_position:
    title: "I think that home office is better than working at the office. In my opinion, that is better."
    gloss: "I think that home office is better than working at the office. In my opinion, that is better."
    note: "A claim is the position you will defend. Both *ich finde, dass...* and *meiner Meinung nach...* signal that what follows is your opinion, not a stated fact -- the starting point of every argument in this unit."

  de.b2.unit01.lesson02.teach.weil:
    title: because
    gloss: "because (subordinating)"
    note: "*Weil* gives a reason and sends its verb to the end of the clause: *...weil es ruhig ist*. Compare *denn* (next card), which does not change the word order."
    example_gloss: "I work from home, because it is quiet."
  de.b2.unit01.lesson02.teach.denn:
    title: "because / for"
    gloss: "because / for (coordinating)"
    note: "*Denn* also means 'because', but it joins two main clauses and keeps normal word order: *...denn das ist praktisch* (not '...denn das praktisch ist'). English 'because' hides this split that German makes."
    example_gloss: "I stay home, because that is practical."
  de.b2.unit01.lesson02.teach.erstens_zweitens:
    title: "firstly, secondly"
    gloss: "firstly..., secondly..."
    note: "*Erstens... zweitens...* number your reasons so an argument is easy to follow -- the classic way to signpost support."
  de.b2.unit01.lesson02.teach.ausserdem:
    title: "in addition"
    gloss: "in addition / besides"
    note: "*Außerdem* adds a further reason. Because it opens the sentence, the verb follows it: *Außerdem spart man Geld*."
    example_gloss: "In addition, you save money."
  de.b2.unit01.lesson02.teach.zum_beispiel:
    title: "for example"
    gloss: "for example"
    note: "*Zum Beispiel* introduces a concrete example that backs up a reason."
  de.b2.unit01.lesson02.teach.studien_zeigen_dass:
    title: "studies show that..."
    gloss: "studies show that..."
    note: "*Studien zeigen, dass...* is how you cite evidence in an argument. Like *ich finde, dass*, the *dass* sends the following verb to the end."
  de.b2.unit01.lesson02.teach.pendelzeit:
    title: "commute time"
    gloss: "commute / travel time"
    example_gloss: "I save a lot of commute time."
  de.b2.unit01.lesson02.teach.sparen:
    title: "to save"
    gloss: "to save (time, money)"
    note: "*Sparen* = to save. Everyday forms: *man spart* (you/one save(s)), *spart man* in a fronted sentence, *ich spare* (I save)."
    example_gloss: "You can save a lot of time."
  de.b2.unit01.lesson02.teach.man:
    title: "you / one (generic)"
    gloss: "you / one (generic, impersonal)"
    note: "*Man* here is the generic 'you' or 'one' -- 'man spart Zeit' means 'one saves time / you save time'. It is the natural way German states a general point in an argument."
    example_gloss: "One saves a lot of time in home office."
  de.b2.unit01.lesson02.teach.produktiver:
    title: "more productive"
    gloss: "more productive"
    example_gloss: "At home I am more productive."
  de.b2.unit01.lesson02.teach.zu_hause:
    title: "at home"
    gloss: "at home"
    note: "*Zu Hause* = 'at home' (a fixed phrase, distinct from *nach Hause* = 'to home', which this unit does not use)."
    example_gloss: "I like working at home."
  de.b2.unit01.lesson02.teach.grammar_gruende:
    title: "Firstly, you save commute time. In addition, you are more productive, because it is quieter at home."
    gloss: "Firstly, you save commute time. In addition, you are more productive, because it is quieter at home."
    note: "Support = the reasons and evidence behind your claim. Number them (*erstens*, *außerdem*), give examples (*zum Beispiel*), and cite evidence (*Studien zeigen, dass*) so the argument is easy to follow."

  de.b2.unit01.lesson03.teach.einerseits:
    title: "on the one hand"
    gloss: "on the one hand"
    note: "*Einerseits...* opens a balanced view; it is almost always paired with *andererseits...* to introduce the opposing point you are about to acknowledge."
  de.b2.unit01.lesson03.teach.andererseits:
    title: "on the other hand"
    gloss: "on the other hand"
    note: "*Andererseits...* introduces the strongest point against your claim. Acknowledging it (before you rebut it) is what makes a B2 argument convincing rather than one-sided."
  de.b2.unit01.lesson03.teach.obwohl:
    title: although
    gloss: although
    note: "*Obwohl* concedes a point in a subordinate clause (verb-final): *Obwohl es praktisch ist,...*. It sets up a contrast the main clause will answer."
    example_gloss: "Although it is practical, I stay flexible."
  de.b2.unit01.lesson03.teach.natuerlich:
    title: "of course"
    gloss: "of course / naturally"
    note: "*Natürlich* concedes that the opposing point is fair ('of course you miss...') -- a polite way to acknowledge before you push back."
    example_gloss: "Of course you are right."
  de.b2.unit01.lesson03.teach.das_stimmt:
    title: "That's true."
    gloss: "That's true. / That's correct."
    note: "*Das stimmt* grants that the other side has a real point -- you acknowledge it honestly, then rebut it in the next breath."
  de.b2.unit01.lesson03.teach.manche_sagen_dass:
    title: "some people say that..."
    gloss: "some people say that..."
    note: "*Manche sagen, dass...* introduces a common objection without owning it yourself -- 'some people say that...' -- so you can then answer it."
  de.b2.unit01.lesson03.teach.kollegen:
    title: colleagues
    gloss: colleagues
    note: "*Die Kollegen* is the plural of *der Kollege* (colleague); a mixed or all-male group uses this form."
    example_gloss: "I miss my colleagues."
  de.b2.unit01.lesson03.teach.vermissen:
    title: "to miss"
    gloss: "to miss (someone/something)"
    note: "*Vermissen* = to miss. Everyday forms: *ich vermisse*, *man vermisst*, and *vermisst man* in a fronted sentence."
    example_gloss: "I miss the office sometimes."
  de.b2.unit01.lesson03.teach.kontakt_zu:
    title: "the contact with..."
    gloss: "the contact with..."
    note: "*Der Kontakt zu...* = 'the contact with...' -- the social contact with colleagues is the classic point people raise against working from home."
  de.b2.unit01.lesson03.teach.manchmal:
    title: sometimes
    gloss: sometimes
    example_gloss: "Sometimes I work at the office."
  de.b2.unit01.lesson03.teach.angenehm:
    title: "nice / pleasant"
    gloss: "nice / pleasant"
    example_gloss: "Home office is nice."
  de.b2.unit01.lesson03.teach.grammar_konzession:
    title: "On the one hand home office is nice, on the other hand you sometimes miss your colleagues."
    gloss: "On the one hand home office is nice, on the other hand you sometimes miss your colleagues."
    note: "Acknowledging the other side = naming the strongest point against you fairly, before you answer it. *Einerseits... andererseits...*, *obwohl*, *natürlich*, and *das stimmt* all do this without giving up your own position."

  de.b2.unit01.lesson04.teach.trotzdem:
    title: "still / yet"
    gloss: "still / yet / nevertheless"
    note: "*Trotzdem* answers a concession: you grant the objection, then *trotzdem...* ('still, ...') reasserts your claim. It is the core rebuttal word of this unit. As the first element, it triggers verb-second inversion: *trotzdem arbeite ich* (not 'trotzdem ich arbeite')."
    example_gloss: "It is stressful, yet I keep working."
  de.b2.unit01.lesson04.teach.dagegen:
    title: "by contrast"
    gloss: "by contrast / on the other hand"
    note: "*Dagegen* sets one thing directly against another: 'at the office it's loud; at home, by contrast, it's quiet'. It typically comes right after the element it contrasts (here *zu Hause*), as in the example."
    example_gloss: "At the office it is loud; at home, by contrast, it is quiet."
  de.b2.unit01.lesson04.teach.aber:
    title: but
    gloss: but
    note: "*Aber* is the everyday contrast word, joining two main clauses with normal word order. It pivots from the acknowledged point back to your claim."
    example_gloss: "It is practical, but not perfect."
  de.b2.unit01.lesson04.teach.jedoch:
    title: however
    gloss: however
    note: "*Jedoch* is a more formal 'however', usually set off as its own clause or after a period. Same job as *aber*, higher register."
    example_gloss: "Home office is nice. However, it can be lonely."
  de.b2.unit01.lesson04.teach.das_aendert_nichts_daran:
    title: "that does not change the fact that..."
    gloss: "that does not change the fact that..."
    note: "*Das ändert nichts daran, dass...* is a set B2 rebuttal frame: you accept the objection, but say it does not undo your claim. The *dass* sends the following verb to the end."
  de.b2.unit01.lesson04.teach.kurz_gesagt:
    title: "in short"
    gloss: "in short"
    note: "*Kurz gesagt* signposts your conclusion -- it wraps the argument up: 'in short, ...'. Set off by a comma, it can stand outside the sentence (*Kurz gesagt, Homeoffice ist besser*); without the comma it takes the first position and the verb follows (*Kurz gesagt ist Homeoffice besser*). Both are correct."
    example_gloss: "In short, home office is better."
  de.b2.unit01.lesson04.teach.vorteile:
    title: advantages
    gloss: "advantages (plural of der Vorteil)"
    example_gloss: "Home office has many advantages."
  de.b2.unit01.lesson04.teach.nachteile:
    title: disadvantages
    gloss: "disadvantages (plural of der Nachteil)"
    example_gloss: "Home office also has disadvantages."
  de.b2.unit01.lesson04.teach.ueberwiegen:
    title: "to outweigh / prevail"
    gloss: "to outweigh / to prevail"
    note: "*Überwiegen* can take a direct object (*die Vorteile überwiegen die Nachteile* = 'the advantages outweigh the disadvantages') or stand alone (*die Vorteile überwiegen* = 'the advantages prevail'). Singular: *überwiegt*."
    example_gloss: "The advantages prevail."
  de.b2.unit01.lesson04.teach.freiheit:
    title: freedom
    gloss: freedom
    example_gloss: "Home office gives a lot of freedom."
  de.b2.unit01.lesson04.teach.hat_vorteile:
    title: "has advantages"
    gloss: "has advantages"
    note: "*Hat* = 'has' (from *haben*). *Das Büro hat Vorteile* concedes the other side has advantages -- before you rebut."
  de.b2.unit01.lesson04.teach.grammar_widerlegung:
    title: "That's true, but that does not change the fact that the advantages outweigh the disadvantages. In short, home office is better."
    gloss: "That's true, but that does not change the fact that the advantages outweigh the disadvantages. In short, home office is better."
    note: "Rebutting = answering the acknowledged objection without giving up your claim. *Trotzdem*, *aber*, *jedoch*, and *das ändert nichts daran, dass...* all pivot back to your position; *kurz gesagt* signposts the conclusion."

  de.b2.unit01.lesson05.teach.kommentar:
    title: "Reading: home office is a good development"
    gloss: "More and more people work from home. I am convinced that this is a good development. Firstly, you save a lot of commute time, and studies show that people in home office are often more productive. Of course, some say that at home you miss the contact with colleagues. That's true, but that does not change the fact that you can still call and video-call. In short, the advantages outweigh the disadvantages."
    glosses:
      Immer: "always (immer mehr = more and more)"
      mehr: more
      Menschen: people
      von: "from (von zu Hause aus = from home)"
      aus: "out (part of von ... aus = from ... [location])"
      davon: "of it (davon überzeugt = convinced of it)"
      überzeugt: "convinced (past participle of überzeugen)"
      Entwicklung: development
      Studien: studies
      zeigen: "show (Studien zeigen = studies show)"
      oft: often
      sagen: "say (manche sagen = some say)"
      anrufen: "to call (on the phone)"
      Videoanrufe: "video calls"
      machen: "make / do (Videoanrufe machen = to video-call)"
      kann: "can (from können)"

  de.b2.unit01.lesson06.teach.warum_finden_sie_das:
    title: "Why do you think that?"
    gloss: "Why do you think that?"
    note: "*Warum finden Sie das?* asks a debating partner to support their claim -- the cue to give your reasons and evidence. Formal *Sie*, matching Felix and Frau Vogel's established workplace register."
  de.b2.unit01.lesson06.teach.da_ist_etwas_dran:
    title: "There's something to that."
    gloss: "There's something to that. / You have a point."
    note: "*Da ist etwas dran* concedes that the other person's argument is reasonable -- a natural way to acknowledge a good point in discussion."
  de.b2.unit01.lesson06.teach.dialogue_felix_claim:
    title: "Felix: I think that home office is better than working at the office."
    gloss: "Felix: I think that home office is better than working at the office."
  de.b2.unit01.lesson06.teach.dialogue_vogel_why:
    title: "Frau Vogel: Why do you think that?"
    gloss: "Frau Vogel: Why do you think that?"
  de.b2.unit01.lesson06.teach.dialogue_felix_support:
    title: "Felix: Firstly, you save a lot of commute time, and studies show that you are more productive in home office."
    gloss: "Felix: Firstly, you save a lot of commute time, and studies show that you are more productive in home office."
  de.b2.unit01.lesson06.teach.dialogue_vogel_objection:
    title: "Frau Vogel: On the other hand, you miss the contact with the colleagues."
    gloss: "Frau Vogel: On the other hand, you miss the contact with the colleagues."
  de.b2.unit01.lesson06.teach.dialogue_felix_rebuttal:
    title: "Felix: That's true, but that does not change the fact that you can video-call. In short, the advantages prevail."
    gloss: "Felix: That's true, but that does not change the fact that you can video-call. In short, the advantages prevail."
  de.b2.unit01.lesson06.teach.dialogue_vogel_concede:
    title: "Frau Vogel: There's something to that."
    gloss: "Frau Vogel: There's something to that."
  de.b2.unit01.lesson06.teach.grammar_volles_argument:
    title: "I think that home office is better than working at the office. Firstly, you save a lot of commute time. Of course, you sometimes miss your colleagues. Still, the advantages prevail."
    gloss: "I think that home office is better than working at the office. Firstly, you save a lot of commute time. Of course, you sometimes miss your colleagues. Still, the advantages prevail."
    note: "A complete argument has four moves: claim (*ich finde, dass...*), support (*erstens...*), acknowledged objection (*natürlich...*), and rebuttal (*trotzdem...*). This is exactly what you produce in the speaking and writing tasks of this lesson."

exercises:
  de.b2.unit01.lesson01.exercise01.recognize_meinung:
    instruction: "What does this word mean?"
    correct_option: "an opinion"
    distractors: [a question, an answer, an agreement]
    accepted_answers: [{value: "an opinion", status: correct}]
    feedback: "Eine Meinung is an opinion -- the general idea behind a claim."
  de.b2.unit01.lesson01.exercise02.listen_claim:
    instruction: "Listen and select what you hear."
    correct_option: "I think that home office is better than working at the office."
    distractors: ["I think that working at the office is better than home office.", "I think that home office is nicer than travelling.", "I know that home office is better than working at the office."]
    accepted_answers: [{value: "I think that home office is better than working at the office.", status: correct}]
    feedback: "Ich finde, dass Homeoffice besser ist, als im Büro zu arbeiten means I think that home office is better than working at the office."
  de.b2.unit01.lesson01.exercise03.match_claim_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {Homeoffice: "home office / working from home", "im Büro arbeiten": "to work at the office", "eine Meinung": "an opinion", "Ich finde, dass...": "I think that...", "Meiner Meinung nach...": "In my opinion...", besser: better, als: than, "Ich stimme dem zu.": "I agree with it."}
        status: correct
    feedback: "These are this lesson's claim-stating words."
  de.b2.unit01.lesson01.exercise04.order_claim:
    instruction: "Put the words in order: I think that home office is better."
    accepted_answers:
      - {value: "Ich finde dass Homeoffice besser ist", status: correct}
    feedback: "Ich finde, dass Homeoffice besser ist means I think that home office is better."
  de.b2.unit01.lesson01.exercise05.translate_meiner_meinung_nach:
    instruction: "Translate into German: In my opinion, home office is better."
    accepted_answers:
      - {value: "Meiner Meinung nach ist Homeoffice besser", status: correct}
    feedback: "Meiner Meinung nach ist Homeoffice besser means in my opinion, home office is better."
  de.b2.unit01.lesson01.exercise06.speak_stimme_zu:
    instruction: "Say aloud in German: I agree with it."
    accepted_answers:
      - {value: "Ich stimme dem zu", status: correct}
    feedback: "Ich stimme dem zu means I agree with it."
  de.b2.unit01.lesson01.exercise07.write_claim:
    instruction: "Write in German: I think that home office is better than working at the office."
