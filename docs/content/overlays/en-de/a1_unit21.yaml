  de.a1.unit21.lesson02.exercise06.write_clothing_request: {instruction: "Write a short clothing request with item, color, and size: I am looking for a shirt in blue, size M.", accepted_answers: [{value: "Ich suche ein Hemd in Blau, Größe M.", status: "correct"}, {value: "Ich suche ein Hemd in Blau Größe M", status: "correct"}, {value: "Ich suche ein Hemd in Blau, Groesse M.", status: "correct"}, {value: "Ich suche ein Hemd in Blau Groesse M", status: "correct"}], feedback: "The request includes item, color, and size."}
