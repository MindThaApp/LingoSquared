units:
  de.a1.unit14.vorlieben: {title: "Preferences"}
teaching:
  de.a1.unit14.lesson01.teach.moegen_sie: {title: "Mögen Sie Kaffee?", gloss: "Do you like coffee?", note: "Formal question form: *Mögen Sie...?*", example_gloss: "In context: Do you like coffee?"}
  de.a1.unit14.lesson01.teach.ich_mag: {title: "Ich mag Tee.", gloss: "I like tea.", note: "*ich mag* means I like.", example_gloss: "In context: I like tea."}
  de.a1.unit14.lesson01.teach.nicht_moegen: {title: "Ich mag Kaffee nicht.", gloss: "I don't like coffee.", note: "German puts *nicht* after the thing disliked here, not directly after *ich*.", example_gloss: "In context: I don't like coffee."}
  de.a1.unit14.lesson01.teach.lieber: {title: "lieber", gloss: "rather / prefer", note: "*lieber* expresses preference between options.", example_gloss: "In context: I prefer drinking tea."}
  de.a1.unit14.lesson01.teach.nehmen: {title: "Ich nehme Wasser.", gloss: "I'll take water.", note: "*nehmen* is natural when choosing an item.", example_gloss: "In context: I'll take water."}
  de.a1.unit14.lesson02.teach.aber: {title: "aber", gloss: "but", note: "*aber* connects a contrast.", example_gloss: "In context: I like coffee, but I prefer drinking tea."}
  de.a1.unit14.lesson02.teach.preference_text: {title: "Vorlieben im Cafe", gloss: "preferences in the cafe", note: "The short text contrasts Anna's and Felix's choices.", example_gloss: "In context: Felix does not like tea."}
  de.a1.unit14.lesson02.teach.line01: {title: "Felix fragt nach Kaffee", gloss: "Felix: Mögen Sie Kaffee?", note: "A direct preference question.", example_gloss: "In context: Do you like coffee?"}
  de.a1.unit14.lesson02.teach.line02: {title: "Anna nennt ihre Vorliebe", gloss: "Anna: Ja, ich mag Kaffee, aber ich trinke lieber Tee.", note: "Anna likes coffee but prefers tea.", example_gloss: "In context: I prefer drinking tea."}
  de.a1.unit14.lesson02.teach.line03: {title: "Felix wählt Wasser", gloss: "Felix: Ich mag Tee nicht. Ich nehme Wasser.", note: "Felix states a dislike and then a choice.", example_gloss: "In context: I'll take water."}
  de.a1.unit14.lesson02.teach.line04: {title: "Anna wählt Tee", gloss: "Anna: Gut, ich nehme Tee.", note: "Anna confirms her choice.", example_gloss: "In context: I'll take tea."}
exercises:
  de.a1.unit14.lesson01.exercise01.listen_lieber: {instruction: "Listen and select the sentence with a preference.", correct_option: "Ich trinke lieber Wasser", distractors: ["Ich mag Tee", "Ich mag Kaffee nicht", "Was nehmen Sie"], accepted_answers: [{value: "Ich trinke lieber Wasser", status: "correct"}], feedback: "*lieber* marks a preference."}
  de.a1.unit14.lesson01.exercise02.choose_dislike: {instruction: "Which sentence means 'I don't like coffee'?", correct_option: "Ich mag Kaffee nicht.", distractors: ["Ich nicht mag Kaffee.", "Ich mag nicht Kaffee.", "Ich möge Kaffee nicht."], accepted_answers: [{value: "Ich mag Kaffee nicht.", status: "correct"}], feedback: "Use *Ich mag Kaffee nicht*."}
  de.a1.unit14.lesson01.exercise03.match_preferences:
    instruction: "Match each phrase to its preference function."
    accepted_answers: [{value: [{left: "Mögen Sie Kaffee?", right: "asks if someone likes coffee"}, {left: "Ich mag Tee.", right: "states a like"}, {left: "Ich mag Kaffee nicht.", right: "states a dislike"}, {left: "Ich trinke lieber Tee.", right: "states a stronger choice"}, {left: "Ich nehme Wasser.", right: "chooses water"}, {left: "Was nehmen Sie?", right: "asks for a choice"}], status: "correct"}]
    feedback: "Each phrase asks about or states a preference."
  de.a1.unit14.lesson01.exercise04.order_mag_tee: {instruction: "Put the words in order: 'I like tea.'", accepted_answers: [{value: ["Ich", "mag", "Tee"], status: "correct"}], feedback: "The order is *Ich mag Tee*."}
  de.a1.unit14.lesson01.exercise05.write_dislike: {instruction: "Write: I don't like coffee.", accepted_answers: [{value: "Ich mag Kaffee nicht", status: "correct"}, {value: "Ich mag Kaffee nicht.", status: "correct"}], feedback: "*nicht* comes after *Kaffee* here."}
  de.a1.unit14.lesson02.exercise01.listen_anna_pref: {instruction: "Listen to the dialogue. What does Anna prefer?", correct_option: "Tee", distractors: ["Suppe", "Brot", "Milch"], accepted_answers: [{value: "Tee", status: "correct"}], feedback: "Anna says she prefers tea."}
  de.a1.unit14.lesson02.exercise02.choose_felix: {instruction: "What does Felix choose?", correct_option: "Ich nehme Wasser.", distractors: ["Ich nehme Tee.", "Ich mag Kaffee.", "Ich trinke lieber Tee."], accepted_answers: [{value: "Ich nehme Wasser.", status: "correct"}], feedback: "Felix chooses water."}
  de.a1.unit14.lesson02.exercise03.match_dialog:
    instruction: "Match the dialogue details."
    accepted_answers: [{value: [{left: "Anna likes this.", right: "Kaffee"}, {left: "Anna prefers this.", right: "Tee"}, {left: "Felix chooses this.", right: "Wasser"}, {left: "Felix dislikes this.", right: "Tee"}, {left: "stronger preference word", right: "lieber"}, {left: "negation word in a dislike", right: "nicht"}], status: "correct"}]
    feedback: "The dialogue contrasts liking, preferring, disliking, and choosing."
  de.a1.unit14.lesson02.exercise04.order_lieber: {instruction: "Put the words in order: 'I prefer drinking tea.'", accepted_answers: [{value: ["Ich", "trinke", "lieber", "Tee"], status: "correct"}], feedback: "*lieber* follows the verb here."}
  de.a1.unit14.lesson02.exercise05.reply_preference: {instruction: "Felix asks whether you like coffee and what you will take. Reply as Anna: say you like coffee but prefer tea, then choose tea.", accepted_answers: [{value: "Ja, ich mag Kaffee, aber ich trinke lieber Tee. Ich nehme Tee.", status: "correct"}, {value: "Ja ich mag Kaffee aber ich trinke lieber Tee Ich nehme Tee", status: "correct"}], feedback: "The answer states a like, a preference, and a choice."}
  de.a1.unit14.lesson02.exercise06.write_preference: {instruction: "Write a simple preference with a contrast: I like coffee, but I prefer drinking tea.", accepted_answers: [{value: "Ich mag Kaffee, aber ich trinke lieber Tee.", status: "correct"}, {value: "Ich mag Kaffee aber ich trinke lieber Tee", status: "correct"}], feedback: "This is a simple preference with a contrast."}
