exercises:
  de.a1.unit24.lesson01.exercise01.listen_karte: {instruction: "Listen and select the payment method you hear.", correct_option: "Mit Karte, bitte.", distractors: ["Bar, bitte.", "Mit Geld, bitte.", "Die Quittung, bitte."], accepted_answers: [{value: "Mit Karte, bitte.", status: "correct"}], feedback: "*Mit Karte, bitte* chooses card payment."}
  de.a1.unit24.lesson01.exercise02.choose_pay: {instruction: "Which sentence means 'I would like to pay'?", correct_option: "Ich möchte bezahlen.", distractors: ["Ich möchte Geld.", "Ich bin bezahlen.", "Ich möchte Karte."], accepted_answers: [{value: "Ich möchte bezahlen.", status: "correct"}], feedback: "*Ich möchte bezahlen* asks to pay."}
  de.a1.unit24.lesson01.exercise03.match_payment:
    instruction: "Match each payment word or phrase."
    accepted_answers: [{value: [{left: "allgemeines Wort für Euro und Cent", right: "Geld"}, {left: "Verb für Geld geben", right: "bezahlen"}, {left: "Zahlungsart mit Scheinen und Münzen", right: "bar"}, {left: "Zahlungsart mit Bankkarte", right: "Karte"}, {left: "kurze Antwort für Kartenzahlung", right: "Mit Karte, bitte."}, {left: "höfliches Wort bei der Zahlung", right: "bitte"}], status: "correct"}]
    feedback: "These words support a basic payment exchange."
  de.a1.unit24.lesson01.exercise04.order_card: {instruction: "Put the words in order: 'By card, please.'", accepted_answers: [{value: ["Mit", "Karte", "bitte"], status: "correct"}], feedback: "*Mit Karte, bitte* chooses card payment."}
  de.a1.unit24.lesson01.exercise05.write_pay_card: {instruction: "Write the taught payment-method answer: By card, please.", accepted_answers: [{value: "Mit Karte, bitte.", status: "correct"}, {value: "Mit Karte bitte", status: "correct"}], feedback: "*Mit Karte, bitte* is the accepted answer."}
  de.a1.unit24.lesson02.exercise01.listen_payment_method: {instruction: "Listen to the dialogue. How does Felix pay?", correct_option: "card", distractors: ["receipt", "ticket", "phone"], accepted_answers: [{value: "card", status: "correct"}], feedback: "Felix says *Mit Karte, bitte*."}
  de.a1.unit24.lesson02.exercise02.choose_amount: {instruction: "Which sentence states the amount is eight euros?", correct_option: "Der Betrag ist acht Euro.", distractors: ["Die Quittung ist acht Euro.", "Die Karte ist acht Euro.", "Ich zahle bar."], accepted_answers: [{value: "Der Betrag ist acht Euro.", status: "correct"}], feedback: "*Betrag* is the amount."}
  de.a1.unit24.lesson02.exercise03.match_receipt:
    instruction: "Match the receipt details."
    accepted_answers: [{value: [{left: "Dokument nach dem Bezahlen", right: "Quittung"}, {left: "Name auf der Quittung", right: "Cafe Anna"}, {left: "Kategorie für acht Euro", right: "Betrag"}, {left: "genannte Summe", right: "acht Euro"}, {left: "Kategorie für Karte", right: "Zahlung"}, {left: "genannte Zahlungsart", right: "Karte"}], status: "correct"}]
    feedback: "The receipt gives the amount and the payment method."
  de.a1.unit24.lesson02.exercise04.order_payment_question: {instruction: "Put the words in order: 'Are you paying cash or by card?'", accepted_answers: [{value: ["Zahlen", "Sie", "bar", "oder", "mit", "Karte"], status: "correct"}], feedback: "The formal question starts with *Zahlen Sie...*"}
  de.a1.unit24.lesson02.exercise05.reply_payment: {instruction: "Reply as Felix. First use the exact taught request to pay: Ich möchte bezahlen. Then ask the exact taught customer question: Kann ich mit Karte zahlen? Then answer with the exact taught card phrase.", accepted_answers: [{value: "Ich möchte bezahlen. Kann ich mit Karte zahlen? Mit Karte, bitte.", status: "correct"}, {value: "Ich möchte bezahlen Kann ich mit Karte zahlen Mit Karte bitte", status: "correct"}, {value: "Ich moechte bezahlen. Kann ich mit Karte zahlen? Mit Karte, bitte.", status: "correct"}, {value: "Ich moechte bezahlen Kann ich mit Karte zahlen Mit Karte bitte", status: "correct"}], feedback: "The reply asks to pay, asks about card payment, and chooses card."}
  de.a1.unit24.lesson02.exercise06.write_payment_note: {instruction: "Write the taught payment note: Felix pays eight euros by card.", accepted_answers: [{value: "Felix zahlt acht Euro mit Karte.", status: "correct"}, {value: "Felix zahlt acht Euro mit Karte", status: "correct"}], feedback: "The note states who paid, the amount, and the method."}
