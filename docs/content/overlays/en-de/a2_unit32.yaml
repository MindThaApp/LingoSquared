    feedback: "These words describe online habits."
  de.a2.unit32.lesson01.exercise04.order_habit: {instruction: "Put the words in order for the exact taught habit sentence: 'I read news online every morning.'", accepted_answers: [{value: ["Ich", "lese", "jeden", "Morgen", "Nachrichten", "online"], status: "correct"}], feedback: "The sentence gives an activity and frequency."}
  de.a2.unit32.lesson01.exercise05.write_habit: {instruction: "Write exactly the taught habit sentence: I read news online every morning.", accepted_answers: [{value: "Ich lese jeden Morgen Nachrichten online.", status: "correct"}, {value: "Ich lese jeden Morgen Nachrichten online", status: "correct"}], feedback: "The sentence describes a daily online habit."}
  de.a2.unit32.lesson02.exercise01.choose_opinion: {instruction: "Which sentence gives the opinion 'I find that useful'?", correct_option: "Ich finde das nützlich.", distractors: ["Ich lese Nachrichten online.", "Ich benutze mein Smartphone.", "Ich benutze soziale Medien."], accepted_answers: [{value: "Ich finde das nützlich.", status: "correct"}], feedback: "*Ich finde das...* gives an opinion."}
  de.a2.unit32.lesson02.exercise02.match_opinion:
    instruction: "Match each German opinion or frequency word."
    accepted_answers: [{value: [{left: "hilfreich", right: "nützlich"}, {left: "Gegensatz im Satz", right: "aber"}, {left: "nicht immer", right: "manchmal"}, {left: "mehr als angenehm", right: "zu viel"}, {left: "tägliche Häufigkeit", right: "jeden Tag"}, {left: "Verb für Meinung", right: "finde"}], status: "correct"}]
    feedback: "These words link habits to a simple opinion."
  de.a2.unit32.lesson02.exercise03.order_opinion: {instruction: "Put the words in order for the exact taught opinion sentence: 'I find that useful.'", accepted_answers: [{value: ["Ich", "finde", "das", "nützlich"], status: "correct"}], feedback: "The sentence gives a simple opinion."}
