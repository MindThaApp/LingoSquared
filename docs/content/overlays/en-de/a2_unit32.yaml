  de.a2.unit32.lesson02.exercise05.write_online_habit_message: {instruction: "Write the full online-habit message with smartphone use, online news, social media, and one opinion with aber exactly as taught.", accepted_answers: [{value: "Ich benutze mein Smartphone jeden Tag. Ich lese morgens Nachrichten online und benutze manchmal soziale Medien. Ich finde das nützlich, aber manchmal ist es zu viel.", status: "correct"}, {value: "Ich benutze mein Smartphone jeden Tag Ich lese morgens Nachrichten online und benutze manchmal soziale Medien Ich finde das nützlich aber manchmal ist es zu viel", status: "correct"}], feedback: "The message describes daily technology use and gives one opinion about it."}
