course:
  title: "German A1"
  description: "Learn A1-level German for everyday greetings and short social exchanges, with detailed English explanations."

units:
  de.a1.unit05.uhrzeit: {title: "Telling the time"}

teaching:
  de.a1.unit05.lesson03.teach.morgen: {title: "Morgen", gloss: "morning", note: "*Morgen* is the noun for morning, roughly 6 AM-12 PM.", example_gloss: "Good morning, Felix!"}
  de.a1.unit05.lesson03.teach.mittag: {title: "Mittag", gloss: "noon", note: "*Mittag* is noon itself, the midpoint between Morgen and Nachmittag.", example_gloss: "It's noon."}
  de.a1.unit05.lesson03.teach.nachmittag: {title: "Nachmittag", gloss: "afternoon", note: "*Nachmittag* covers roughly 12 PM-6 PM.", example_gloss: "I work in the afternoon."}
  de.a1.unit05.lesson03.teach.abend: {title: "Abend", gloss: "evening", note: "*Abend* covers roughly 6 PM-10 PM.", example_gloss: "Good evening, Anna!"}
  de.a1.unit05.lesson03.teach.nacht: {title: "Nacht", gloss: "night", note: "*Nacht* covers roughly 10 PM-6 AM.", example_gloss: "Good night, Felix!"}
  de.a1.unit05.lesson03.teach.mitternacht: {title: "Mitternacht", gloss: "midnight", note: "*Mitternacht* is exactly 12 AM / 0 Uhr.", example_gloss: "The party ends at midnight."}
  de.a1.unit05.lesson03.teach.achtzehn: {title: "achtzehn", gloss: "eighteen", note: "*achtzehn* = 18, used here on the 24-hour clock for official hours (achtzehn Uhr = 6 PM).", example_gloss: "The store closes at eighteen o'clock (6 PM)."}
  de.a1.unit05.lesson04.teach.wann: {title: "Wann", gloss: "when", note: "*Wann* opens a question about time.", example_gloss: "When are you coming?"}
  de.a1.unit05.lesson04.teach.oeffnet_die: {title: "öffnet die", gloss: "opens the", note: "*öffnet* is the third-person singular of *öffnen* (to open); *die* is the feminine/plural definite article, matching *die Bibliothek*.", example_gloss: "When does the library open?"}
  de.a1.unit05.lesson04.teach.bibliothek: {title: "Bibliothek", gloss: "library", note: "*Bibliothek* is a feminine noun (*die Bibliothek*), the same location established in unit04.", example_gloss: "I'm going to the library."}
  de.a1.unit05.lesson04.teach.sie_pronomen: {title: "sie", gloss: "it / she / they (lowercase)", note: "Here *sie* is the third-person pronoun standing in for the feminine noun *die Bibliothek* -- 'it,' not to be confused with capitalized *Sie* (formal 'you'), which Anna and Felix use with each other.", example_gloss: "I like the library. I visit it often."}
  de.a1.unit05.lesson04.teach.dann: {title: "dann", gloss: "then", note: "*dann* is used here in the closing *Bis dann!* ('see you then!').", example_gloss: "See you then!"}

exercises:
  de.a1.unit05.lesson01.exercise01.listen_wie_spaet:
    instruction: "Listen and select the question you hear."
    correct_option: "Wie spät ist es"
    distractors: ["Es ist drei Uhr", "Es ist halb vier", "Es ist fünf Uhr"]
    accepted_answers: [{value: "Wie spät ist es", status: "correct"}]
    feedback: "*Wie spät ist es?* means 'What time is it?'"
  de.a1.unit05.lesson01.exercise02.choose_drei_uhr:
    instruction: "Which sentence matches 3:00?"
    correct_option: "Es ist drei Uhr."
    distractors: ["Es ist fünf Uhr.", "Es ist halb vier.", "Es ist Viertel nach drei."]
    accepted_answers: [{value: "Es ist drei Uhr.", status: "correct"}]
    feedback: "*Es ist drei Uhr* means 'It's three o'clock.'"
  de.a1.unit05.lesson01.exercise03.choose_halb_vier:
    instruction: "Which sentence matches 3:30? (Careful: German names the half hour by the hour it's counting TOWARD, not the one it just passed.)"
    correct_option: "Es ist halb vier."
    distractors: ["Es ist halb fünf.", "Es ist halb drei.", "Es ist drei Uhr."]
    accepted_answers: [{value: "Es ist halb vier.", status: "correct"}]
    feedback: "*Es ist halb vier* literally means 'it's half four,' but it means 3:30, not 4:30 -- German counts the half hour toward the NEXT hour. *Es ist halb drei* would be the wrong-direction guess (reading it like English 'half three'); *Es ist halb fünf* would be 4:30. Neither is this."
  de.a1.unit05.lesson01.exercise04.order_fuenf_uhr:
    instruction: "Put the words in order to say 'It's five o'clock.'"
    accepted_answers: [{value: ["Es", "ist", "fünf", "Uhr"], status: "correct"}]
    feedback: "The correct order is *Es ist fünf Uhr.*"
  de.a1.unit05.lesson01.exercise05.write_drei_uhr:
    instruction: "Write the time in words: 3:00."
    accepted_answers:
      - {value: "Es ist drei Uhr", status: "correct"}
      - {value: "Es ist drei Uhr.", status: "correct"}
    feedback: "*Es ist drei Uhr* means 'It's three o'clock.'"

  de.a1.unit05.lesson02.exercise01.listen_viertel_vor:
    instruction: "Listen and select the sentence you hear."
    correct_option: "Es ist Viertel vor vier"
    distractors: ["Es ist Viertel nach vier", "Es ist halb vier", "Es ist vier Uhr"]
    accepted_answers: [{value: "Es ist Viertel vor vier", status: "correct"}]
    feedback: "*Es ist Viertel vor vier* means 'It's a quarter to four.'"
  de.a1.unit05.lesson02.exercise02.choose_viertel_nach:
    instruction: "Which sentence matches 3:15?"
    correct_option: "Es ist Viertel nach drei."
    distractors: ["Es ist Viertel vor drei.", "Es ist halb vier.", "Es ist drei Uhr."]
    accepted_answers: [{value: "Es ist Viertel nach drei.", status: "correct"}]
    feedback: "*Es ist Viertel nach drei* means 'It's a quarter past three.'"
  de.a1.unit05.lesson02.exercise03.choose_viertel_vor:
    instruction: "Which sentence matches 3:45?"
    correct_option: "Es ist Viertel vor vier."
    distractors: ["Es ist Viertel nach vier.", "Es ist halb vier.", "Es ist vier Uhr."]
    accepted_answers: [{value: "Es ist Viertel vor vier.", status: "correct"}]
    feedback: "*Es ist Viertel vor vier* means 'It's a quarter to four.'"
  de.a1.unit05.lesson02.exercise04.order_zehn_nach:
    instruction: "Put the words in order to say 'It's ten past four.'"
    accepted_answers: [{value: ["Es", "ist", "zehn", "nach", "vier"], status: "correct"}]
    feedback: "The correct order is *Es ist zehn nach vier.*"
  de.a1.unit05.lesson02.exercise05.write_zehn_vor:
    instruction: "Write the time in words: 4:50."
    accepted_answers:
      - {value: "Es ist zehn vor fünf", status: "correct"}
      - {value: "Es ist zehn vor fünf.", status: "correct"}
    feedback: "*Es ist zehn vor fünf* means 'It's ten to five.'"

  de.a1.unit05.lesson03.exercise01.listen_abend:
    instruction: "Listen and select the time of day you hear."
    correct_option: "Abend"
    distractors: ["Morgen", "Nachmittag", "Nacht"]
    accepted_answers: [{value: "Abend", status: "correct"}]
    feedback: "*Abend* means evening."
  de.a1.unit05.lesson03.exercise02.choose_laden_oeffnet:
    instruction: "When does the store open?"
    correct_option: "Der Laden öffnet um neun Uhr morgens."
    distractors: ["Der Laden öffnet um sechs Uhr abends.", "Der Laden schließt um neun Uhr morgens.", "Der Laden öffnet um achtzehn Uhr."]
    accepted_answers: [{value: "Der Laden öffnet um neun Uhr morgens.", status: "correct"}]
    feedback: "*Der Laden öffnet um neun Uhr morgens* means 'The store opens at nine in the morning.'"
  de.a1.unit05.lesson03.exercise03.choose_laden_schliesst:
    instruction: "When does the store close?"
    correct_option: "Der Laden schließt um achtzehn Uhr."
    distractors: ["Der Laden öffnet um achtzehn Uhr.", "Der Laden schließt um neun Uhr morgens.", "Der Laden schließt um sechs Uhr morgens."]
    accepted_answers: [{value: "Der Laden schließt um achtzehn Uhr.", status: "correct"}]
    feedback: "*Der Laden schließt um achtzehn Uhr* means 'The store closes at 18:00' -- 6 PM. German states official hours on the 24-hour clock."
  de.a1.unit05.lesson03.exercise04.match_tageszeiten:
    instruction: "Match each time of day to its approximate hour range."
    accepted_answers:
      - value:
          - {left: "6-12 Uhr", right: "Morgen"}
          - {left: "12 Uhr", right: "Mittag"}
          - {left: "12-18 Uhr", right: "Nachmittag"}
          - {left: "18-22 Uhr", right: "Abend"}
          - {left: "22-24 Uhr", right: "Nacht"}
          - {left: "0 Uhr", right: "Mitternacht"}
        status: "correct"
    feedback: "*Morgen*=morning, *Mittag*=noon, *Nachmittag*=afternoon, *Abend*=evening, *Nacht*=night, *Mitternacht*=midnight."
  de.a1.unit05.lesson03.exercise05.write_laden_oeffnet:
    instruction: "Write when the store opens (9 AM)."
    accepted_answers:
      - {value: "Der Laden öffnet um neun Uhr morgens", status: "correct"}
      - {value: "Der Laden öffnet um neun Uhr morgens.", status: "correct"}
    feedback: "*Der Laden öffnet um neun Uhr morgens* means 'The store opens at nine in the morning.'"

  de.a1.unit05.lesson04.exercise01.listen_oeffnungszeit:
    instruction: "Listen to the dialogue. What time does Anna say the library opens?"
    correct_option: "Sie öffnet um neun Uhr morgens"
    distractors: ["Sie öffnet um acht Uhr abends", "Wann öffnet die Bibliothek", "Und wann schließt sie"]
    accepted_answers: [{value: "Sie öffnet um neun Uhr morgens", status: "correct"}]
    feedback: "Anna says *Sie öffnet um neun Uhr morgens* -- 'It opens at nine in the morning.'"
  de.a1.unit05.lesson04.exercise02.listen_schliesszeit:
    instruction: "Listen again. What time does the library close?"
    correct_option: "Sie schließt um achtzehn Uhr"
    distractors: ["Sie öffnet um acht Uhr morgens", "Sie schließt um neun Uhr morgens", "Sie öffnet um achtzehn Uhr"]
    accepted_answers: [{value: "Sie schließt um achtzehn Uhr", status: "correct"}]
    feedback: "*Sie schließt um achtzehn Uhr* -- 'It closes at 18:00' (6 PM)."
  de.a1.unit05.lesson04.exercise03.choose_oeffnungsfrage:
    instruction: "Ask what time the library opens."
    correct_option: "Wann öffnet die Bibliothek"
    distractors: ["Wann schließt die Bibliothek", "Wie spät ist es", "Wann öffnet der Laden"]
    accepted_answers: [{value: "Wann öffnet die Bibliothek", status: "correct"}]
    feedback: "*Wann öffnet die Bibliothek?* means 'What time does the library open?'"
  de.a1.unit05.lesson04.exercise04.order_schliessfrage:
    instruction: "Put the words in order to ask 'And what time does it close?'"
    accepted_answers: [{value: ["Und", "wann", "schließt", "sie"], status: "correct"}]
    feedback: "The correct order is *Und wann schließt sie?*"
  de.a1.unit05.lesson04.exercise05.read_schild:
    instruction: "Read the sign posted on the library door. What are the opening hours?"
    correct_option: "neun bis achtzehn Uhr"
    distractors: ["acht bis siebzehn Uhr", "zehn bis neunzehn Uhr", "neun bis siebzehn Uhr"]
    accepted_answers: [{value: "neun bis achtzehn Uhr", status: "correct"}]
    feedback: "The sign reads *Öffnungszeiten: neun bis achtzehn Uhr* -- 'Opening hours: 9 to 18:00.'"
  de.a1.unit05.lesson04.exercise06.reply_als_anna:
    instruction: "Felix asks: Wann öffnet die Bibliothek? Und wann schließt sie? Reply as Anna: give both the opening and the closing time."
    accepted_answers:
      - {value: "Sie öffnet um neun Uhr morgens. Sie schließt um achtzehn Uhr.", status: "correct"}
      - {value: "Sie öffnet um neun Uhr morgens, und sie schließt um achtzehn Uhr.", status: "correct"}
      - {value: "Sie öffnet um neun Uhr morgens Sie schließt um achtzehn Uhr", status: "correct"}
    feedback: "Anna's full reply gives both the opening time and the closing time."
  de.a1.unit05.lesson04.exercise07.speak_oeffnungszeiten:
    instruction: "Answer out loud in Anna's role: give both the opening and the closing time."
    accepted_answers:
      - {value: "Sie öffnet um neun Uhr morgens Sie schließt um achtzehn Uhr", status: "correct"}
      - {value: "Sie öffnet um neun Uhr morgens. Sie schließt um achtzehn Uhr.", status: "correct"}
      - {value: "Sie öffnet um neun Uhr morgens, und sie schließt um achtzehn Uhr.", status: "correct"}
    feedback: "This full answer covers both the opening and the closing time."
