      - {value: "Ich heiße Felix. Freut mich.", status: "correct"}
      - {value: "Ich heiße Felix, freut mich.", status: "correct"}
      - {value: "Ich heiße Felix Freut mich", status: "correct"}
    feedback: "*Ich heiße Felix. Freut mich.* gives your name and adds the pleasantry."
  de.a1.unit02.lesson01.exercise06.write_ganz_meinerseits:
    instruction: "Someone says 'Freut mich.' Write the natural reply."
    accepted_answers:
      - {value: "Ganz meinerseits.", status: "correct"}
