course:
  title: "German A1"
  description: "Learn A1-level German for everyday greetings and short social exchanges, with detailed English explanations."

units:
  de.a1.unit02.introductions: {title: "Introducing yourself"}

lessons:
  de.a1.unit02.lesson01.namen: {title: "Names"}
  de.a1.unit02.lesson02.ich_bin_du_bist: {title: "I am... You are..."}
  de.a1.unit02.lesson03.laender: {title: "Countries"}
  de.a1.unit02.lesson04.woher_kommen_sie: {title: "Where are you from?"}
  de.a1.unit02.lesson05.an_der_bushaltestelle: {title: "At the bus stop"}

teaching:
  de.a1.unit02.lesson01.teach.wie_heissen_sie: {title: "Wie heißen Sie?", gloss: "What is your name? (formal)", note: "*Wie heißen Sie?* literally asks 'how are you called,' using the formal *Sie* from unit01."}
  de.a1.unit02.lesson01.teach.ich_heisse_anna: {title: "Ich heiße Anna.", gloss: "My name is Anna. / I'm called Anna.", note: "*heißen* means 'to be called' -- this is the standard way to state your name."}
  de.a1.unit02.lesson01.teach.wie_heisst_du: {title: "Wie heißt du?", gloss: "What is your name? (informal)", note: "The informal version, using *du* from unit01."}
  de.a1.unit02.lesson01.teach.ich_heisse_felix: {title: "Ich heiße Felix.", gloss: "My name is Felix.", note: "Same construction as *Ich heiße Anna*, just a different name."}
  de.a1.unit02.lesson01.teach.freut_mich: {title: "Freut mich.", gloss: "Pleased to meet you.", note: "A short, common way to say you're pleased to meet someone, usable in either register."}
  de.a1.unit02.lesson01.teach.ganz_meinerseits: {title: "Ganz meinerseits.", gloss: "Likewise. / The pleasure is all mine.", note: "The natural reply to *Freut mich* -- literally 'entirely on my side.'"}

  de.a1.unit02.lesson02.teach.ich: {title: "ich", gloss: "I", note: "*ich* is always lowercase in German, unlike English 'I.'"}
  de.a1.unit02.lesson02.teach.du: {title: "du", gloss: "you (informal)", note: "Already introduced in unit01 -- reviewed here as the subject of a full sentence."}
  de.a1.unit02.lesson02.teach.ich_bin_anna: {title: "Ich bin Anna.", gloss: "I am Anna.", note: "*bin* is the *ich*-form of *sein* (to be)."}
  de.a1.unit02.lesson02.teach.du_bist_felix: {title: "Du bist Felix.", gloss: "You are Felix.", note: "*bist* is the *du*-form of *sein*."}

  de.a1.unit02.lesson03.teach.deutschland: {title: "Deutschland", gloss: "Germany", note: "Country names in German usually need no article -- just *Deutschland*, not *das Deutschland*.", example_gloss: "I come from Germany."}
  de.a1.unit02.lesson03.teach.england: {title: "England", gloss: "England", note: "Identical in spelling to English, but pronounced with German sounds.", example_gloss: "I come from England."}
  de.a1.unit02.lesson03.teach.frankreich: {title: "Frankreich", gloss: "France", note: "Note the German spelling differs from French *France* and English 'France.'", example_gloss: "I come from France."}
  de.a1.unit02.lesson03.teach.italien: {title: "Italien", gloss: "Italy", note: "Pronounced roughly 'ee-TAH-lee-en.'", example_gloss: "I come from Italy."}
  de.a1.unit02.lesson03.teach.spanien: {title: "Spanien", gloss: "Spain", note: "Pronounced roughly 'SHPAH-nee-en.'", example_gloss: "I come from Spain."}
  de.a1.unit02.lesson03.teach.russland: {title: "Russland", gloss: "Russia", note: "Built from *Russ-* + *-land*, like *Deutschland*.", example_gloss: "I come from Russia."}

  de.a1.unit02.lesson04.teach.woher_kommen_sie: {title: "Woher kommen Sie?", gloss: "Where are you from? (formal)", note: "*Woher* means 'from where' -- it already includes the sense of 'from,' unlike English 'where... from?' split across the sentence."}
  de.a1.unit02.lesson04.teach.ich_komme_aus_deutschland: {title: "Ich komme aus Deutschland.", gloss: "I come from Germany.", note: "*aus* + country name states origin -- no gendered nationality word needed at this stage."}
  de.a1.unit02.lesson04.teach.woher_kommst_du: {title: "Woher kommst du?", gloss: "Where are you from? (informal)", note: "The informal version, using *du*."}
  de.a1.unit02.lesson04.teach.ich_komme_aus_england: {title: "Ich komme aus England.", gloss: "I come from England.", note: "Same construction as *Ich komme aus Deutschland*, just a different country."}
  de.a1.unit02.lesson04.teach.und_sie: {title: "Und Sie?", gloss: "And you? (formal)", note: "A short way to return the question, matching the *Sie* register."}

  de.a1.unit02.lesson05.teach.line01: {title: "Felix greets Anna", gloss: "Felix says: Good day!", note: "Felix and Anna are neighbors who met once before (unit01) but never exchanged names -- they've run into each other again, this time at the bus stop."}
  de.a1.unit02.lesson05.teach.line02: {title: "Anna returns the greeting and asks his name", gloss: "Anna says: Good day! What is your name?", note: "Anna uses the formal *Sie*, continuing the register they established as strangers in unit01."}
  de.a1.unit02.lesson05.teach.line03: {title: "Felix gives his name and asks back", gloss: "Felix says: My name is Felix. And you?", note: "Felix answers and returns the question formally."}
  de.a1.unit02.lesson05.teach.line04: {title: "Anna gives her name", gloss: "Anna says: My name is Anna. Pleased to meet you.", note: "Anna replies in kind and adds the pleasantry."}
  de.a1.unit02.lesson05.teach.line05: {title: "Felix replies and asks where she's from", gloss: "Felix says: Likewise. Where are you from?", note: "Felix returns the pleasantry and moves the conversation to origin."}
  de.a1.unit02.lesson05.teach.line06: {title: "Anna answers and asks back", gloss: "Anna says: I come from Germany. And you?", note: "This confirms Anna is German, consistent with the two of them being neighbors in a German-speaking city."}
  de.a1.unit02.lesson05.teach.line07: {title: "Felix answers", gloss: "Felix says: I come from England.", note: "This confirms Felix as the English neighbor living abroad, matching unit01's setup."}
  de.a1.unit02.lesson05.teach.line08: {title: "Anna says goodbye", gloss: "Anna says: Goodbye!", note: "The formal farewell from unit01, consistent with their continued *Sie* register."}
  de.a1.unit02.lesson05.teach.line09: {title: "Felix says goodbye", gloss: "Felix says: Goodbye!", note: "Felix closes the same way, staying consistent with the register throughout this encounter."}
  de.a1.unit02.lesson05.teach.steckbrief: {title: "A short written profile", gloss: "Name: Felix. Country: England.", note: "A simple written profile card, giving a name and one identity fact -- the same information Felix gave out loud earlier in the dialogue."}

exercises:
  de.a1.unit02.lesson01.exercise01.listen_formal_question:
    instruction: "Listen and select the phrase you hear."
    correct_option: "Wie heißen Sie"
    distractors: ["Wie heißt du", "Freut mich", "Auf Wiedersehen"]
    accepted_answers: [{value: "Wie heißen Sie", status: "correct"}]
    feedback: "*Wie heißen Sie?* asks for someone's name formally."
  de.a1.unit02.lesson01.exercise02.choose_informal_question:
    instruction: "Which question asks for someone's name informally?"
    correct_option: "Wie heißt du"
    distractors: ["Wie heißen Sie", "Woher kommen Sie", "Freut mich"]
    accepted_answers: [{value: "Wie heißt du", status: "correct"}]
    feedback: "*Wie heißt du?* is the informal way to ask for a name."
  de.a1.unit02.lesson01.exercise03.order_informal_question:
    instruction: "Put the words in the correct order to informally ask for someone's name."
    accepted_answers: [{value: ["Wie", "heißt", "du"], status: "correct"}]
    feedback: "The correct order is *Wie heißt du?*"
  de.a1.unit02.lesson01.exercise04.reply_formally:
    instruction: "Someone formally asks 'Wie heißen Sie?' Reply that your name is Anna."
    accepted_answers:
      - {value: "Ich heiße Anna.", status: "correct"}
      - {value: "Ich heiße Anna", status: "correct"}
    feedback: "*Ich heiße Anna* states your name."
  de.a1.unit02.lesson01.exercise05.reply_and_pleased:
    instruction: "A friend informally asks 'Wie heißt du?' Reply that your name is Felix, and say you're pleased to meet them."
