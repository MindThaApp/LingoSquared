teaching:
  de.a2.unit97.lesson01.teach.verschieben_absagen:
    title: Changing an appointment
    gloss: to move (an appointment) / to cancel
    note: '*Einen Termin verschieben* means to move it to another time. *Absagen* means to cancel it completely; it is a separable verb (*Ich sage ab*).'
    example_gloss:
    - I want to move my appointment.
    - I have to cancel my appointment.
  de.a2.unit97.lesson01.teach.leider_entschuldigung:
    title: Saying you are sorry
    gloss: unfortunately / sorry
    note: '*Leider* is a polite way to give bad news. *Entschuldigung* is the everyday apology.'
    example_gloss:
    - Unfortunately I cannot come.
    - Sorry, I am too late.
  de.a2.unit97.lesson01.teach.der_friseursalon:
    title: The hairdresser's
    gloss: the hairdresser's (salon)
    note: '*Der Friseursalon* is the place; *der Friseur* (or *die Friseurin*) is the person. People often say *zum Friseur gehen* for both.'
    example_gloss: The salon is open from nine to six.
  de.a2.unit97.lesson01.teach.kann_ich_meinen:
    title: Asking to move an appointment
    gloss: Can I move my appointment?
    note: 'A yes/no question starts with the verb: *Kann ich ...?* The infinitive *verschieben* goes at the end.'
  de.a2.unit97.lesson01.teach.ich_kann_leider:
    title: Saying you cannot come
    gloss: Unfortunately I cannot come.
  de.a2.unit97.lesson01.teach.ich_kann_am:
    title: Kann + infinitive
    gloss: I cannot come on Thursday. Can I move the appointment?
    note: 'After *kann* the second verb is an infinitive at the end of the sentence. In a statement, *nicht* goes before that infinitive: *Ich kann am Donnerstag nicht kommen*. A time phrase like *am Donnerstag* comes before *nicht*. In a question, *kann* comes first: *Kann ich den Termin verschieben?*'
  de.a2.unit97.lesson02.teach.ein_anderer_tag:
    title: Another day
    gloss: another day
    note: '*Ein anderer Tag*: *Tag* is masculine, so the ending is *-er* after *ein*. After *an* it changes to the dative: *an einem anderen Tag*.'
    example_gloss: Can it also be on another day?
  de.a2.unit97.lesson02.teach.geht_es_auch:
    title: Suggesting a day
    gloss: Can it also be Monday?
    note: A weekday after *am* takes the dative contraction (*am Montag*). In casual speech you also hear *Geht es auch Montag?*
  de.a2.unit97.lesson02.teach.passt_ihnen_freitag:
    title: Does it suit you?
    gloss: Does Friday suit you? (formal)
    note: '*Passen* means ''to suit'' and takes the dative: *Passt Ihnen Freitag?* The polite *Ihnen* is used with someone you do not know well.'
  de.a2.unit97.lesson02.teach.ja_das_passt:
    title: Saying yes
    gloss: Yes, that suits me well.
  de.a2.unit97.lesson02.teach.leider_nicht:
    title: Saying no politely
    gloss: Unfortunately not.
  de.a2.unit97.lesson02.teach.passt_ihnen_freitag_2:
    title: Does it suit you?
    gloss: Does Friday suit you? Yes, that suits me well. No, unfortunately not.
    note: '*Passen* takes the dative: *Es passt mir* / *Es passt Ihnen*. The question starts with the verb: *Passt Ihnen Freitag?* The answer *Ja, das passt mir gut* confirms. A polite refusal is *Nein, leider nicht*.'
  de.a2.unit97.lesson03.teach.weil_es_tut:
    title: Because and I am sorry
    gloss: because / I am sorry
    note: '*Weil* gives the reason. *Es tut mir leid* is a more careful apology than *Entschuldigung*.'
    example_gloss:
    - I cannot come, because I am ill.
    - I am sorry.
  de.a2.unit97.lesson03.teach.die_unannehmlichkeiten:
    title: Inconvenience
    gloss: the inconvenience
    note: '*Entschuldigung für die Unannehmlichkeiten* is a polite phrase after you have caused someone extra trouble.'
    example_gloss: Sorry for the inconvenience.
  de.a2.unit97.lesson03.teach.ich_kann_nicht:
    title: 'Reason: work'
    gloss: I cannot come, because I have to work.
  de.a2.unit97.lesson03.teach.ich_kann_nicht_2:
    title: 'Reason: another appointment'
    gloss: I cannot come, because I have another appointment.
  de.a2.unit97.lesson03.teach.ich_kann_nicht_3:
    title: 'Because: want'
    gloss: I cannot come, because I am ill.
    note: 'After *weil* the conjugated verb goes to the end of the clause: *Ich kann nicht kommen, weil ich krank bin.* Put a comma before *weil*. Compare *denn*, which keeps the ordinary word order (*..., denn ich bin krank*); in everyday German *weil* is the one to learn first.'
  de.a2.unit97.lesson04.teach.vereinbaren_vorher:
    title: Agreeing and in advance
    gloss: to arrange / in advance
    note: '*Vereinbaren* is to agree on a time or place together. *Vorher* means ''beforehand'', ''in advance''.'
    example_gloss:
    - Shall we arrange something?
    - Call a day in advance.
  de.a2.unit97.lesson04.teach.montag_um_zehn:
    title: Accepting a time
    gloss: Monday at ten o'clock is fine.
  de.a2.unit97.lesson04.teach.koennen_sie_am:
    title: Asking if a time works
    gloss: Can you come on Monday at ten o'clock? (formal)
    note: '*Können Sie* is the polite form of *kannst du*. The infinitive *kommen* is at the end.'
  de.a2.unit97.lesson04.teach.dann_sehe_ich:
    title: Closing the arrangement
    gloss: Then I will see you on Monday.
  de.a2.unit97.lesson04.teach.dann_mache_ich:
    title: Making a new appointment
    gloss: Then I will make a new appointment.
  de.a2.unit97.lesson04.teach.montag_um_zehn_2:
    title: Day first, then time
    gloss: Monday at ten o'clock is fine. Can you come on Monday at ten o'clock?
    note: 'When you give a day and a time, the day comes first and then *um* + the time: *am Montag um zehn Uhr*. In a polite question use *Können Sie ...?* and put the infinitive at the end.'
  de.a2.unit97.lesson05.teach.lieber_felix_ihr:
    title: A message from the salon
    gloss: Dear Felix, your appointment has been moved. Your new appointment is Monday at ten o'clock. Does this not suit you? Then call us a day in advance. Then we will make a new appointment. See you Monday! Friseursalon Weber
    note: 'This is a typical short message from a business, so it uses the polite *Sie* and *Ihr*. *Wurde verschoben* means ''was moved'' (past passive). *Anrufen* is separable: *Rufen Sie ... an*.'
    glosses:
      lieber: dear
      felix: Felix
      ihr: your (formal)
      termin: appointment
      verschoben: moved
      neuer: new
      montag: Monday
      zehn: ten
      uhr: o'clock
      passt: suits (passen + dative)
      das: this
      nicht: not
      an: (part of anrufen = to call)
      rufen: call
      uns: us
      dann: then
      vorher: in advance
      machen: make
      wir: we
      bis: until, see you
      friseursalon: hairdresser's
      weber: Weber
  de.a2.unit97.lesson06.teach.friseursalon_weber_guten:
    title: The salon answers
    gloss: 'Hairdresser: Friseursalon Weber, good day.'
  de.a2.unit97.lesson06.teach.guten_tag_hier:
    title: Felix explains and asks
    gloss: 'Felix: Good day, this is Felix speaking. I have an appointment on Thursday, but unfortunately I cannot come. Can I move the appointment?'
  de.a2.unit97.lesson06.teach.natuerlich_passt_ihnen:
    title: The hairdresser suggests Friday
    gloss: 'Hairdresser: Of course. Does Friday suit you?'
  de.a2.unit97.lesson06.teach.leider_nicht_weil:
    title: Felix suggests Monday
    gloss: 'Felix: Unfortunately not, because I have to work. Can it also be Monday?'
  de.a2.unit97.lesson06.teach.montag_um_zehn:
    title: The hairdresser agrees
    gloss: 'Hairdresser: Monday at ten o''clock is fine.'
  de.a2.unit97.lesson06.teach.das_passt_mir:
    title: Felix accepts and apologises
    gloss: 'Felix: That suits me well. Thank you very much and sorry for the inconvenience.'
  de.a2.unit97.lesson06.teach.kein_problem_bis:
    title: The hairdresser closes
    gloss: 'Hairdresser: No problem. See you Monday!'
