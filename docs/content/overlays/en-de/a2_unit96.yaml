teaching:
  de.a2.unit96.lesson01.teach.der_urlaub_die:
    title: Holidays
    gloss: the holiday / the summer holiday
    note: '*Der Urlaub* is time off work; *die Sommerferien* is the summer school break and is always plural.'
    example_gloss:
    - In August I have a holiday.
    - The summer holiday starts in July.
  de.a2.unit96.lesson01.teach.naechste_woche_naechstes:
    title: When something happens
    gloss: next week / next year / soon
    note: '*Woche* is feminine, so *nächste Woche*. *Jahr* is neuter, so *nächstes Jahr*. *Bald* has no ending.'
    example_gloss:
    - Next week I have an appointment.
    - Next year I want to go to Austria.
    - Soon I have a holiday.
  de.a2.unit96.lesson01.teach.reisen_buchen_bleiben:
    title: Three travel verbs
    gloss: to travel / to book / to stay
    note: These are the infinitives. *Buchen* means 'to book'; it is not related to the noun *das Buch* (book) in meaning here.
    example_gloss:
    - I like travelling by train.
    - I want to book a room.
    - I'm staying for a week.
  de.a2.unit96.lesson01.teach.das_hotel_der:
    title: Where to stay
    gloss: the hotel / the campsite
    note: '*Das Hotel* is neuter; *der Campingplatz* is masculine. You sleep *in einem Hotel* but *auf dem Campingplatz*.'
    example_gloss:
    - The hotel is close to the beach.
    - We sleep on the campsite.
  de.a2.unit96.lesson01.teach.was_wirst_du:
    title: Asking about holiday plans
    gloss: What are you going to do in the summer holiday?
    note: 'Here *werden* is a helper: *wirst* in second place and the infinitive *machen* at the very end. In everyday speech the present tense also works (*Was machst du in den Sommerferien?*).'
  de.a2.unit96.lesson01.teach.im_august_werde:
    title: 'Near plans: werden + infinitive'
    gloss: In August I am going to travel to Italy. I am going to book a hotel.
    note: 'To say what you are going to do, use a form of *werden* in second place and put the infinitive at the very end of the sentence: *Ich werde ein Hotel buchen*. Anything else (a time, a place, an object) goes in between. If a time word comes first, *werde* still stays in second place: *Nächste Woche werde ich ein Hotel buchen*. In casual speech the present tense with a time word does the same job.'
  de.a2.unit96.lesson01.teach.ich_werde_ein:
    title: Booking a hotel
    gloss: I am going to book a hotel.
  de.a2.unit96.lesson02.teach.einen_kurs_besuchen:
    title: Three plans for later
    gloss: to take a course / to move house / to save money
    note: '*Einen Kurs besuchen* is the usual phrase for taking a course. *Umziehen* is moving to a new home; it is a separable verb.'
    example_gloss:
    - I want to take a course.
    - My uncle wants to move house.
    - I want to save for a new bike.
  de.a2.unit96.lesson02.teach.spaeter_in_einem:
    title: Further ahead
    gloss: later / in a month
    note: '*In einem Monat* means ''a month from now''. It works with other periods too: *in einer Woche*.'
    example_gloss:
    - Later I want to buy a house.
    - In a month my course starts.
  de.a2.unit96.lesson02.teach.in_einem_monat:
    title: A course that starts
    gloss: In a month my course starts.
  de.a2.unit96.lesson02.teach.ich_habe_vor:
    title: 'Intentions: vorhaben + zu'
    gloss: I plan to take a course.
    note: 'To say what you intend to do, use *ich habe vor* and then a second part after a comma: *Ich habe vor, einen Kurs zu besuchen*. The infinitive is at the end, with *zu* right before it. With a separable verb *zu* goes inside the verb: *umzuziehen*. This is for things you want to do, not for fixed arrangements.'
  de.a2.unit96.lesson02.teach.ich_habe_vor_2:
    title: Planning to move house
    gloss: I plan to move house.
  de.a2.unit96.lesson02.teach.ich_habe_vor_3:
    title: Planning to save
    gloss: I plan to save money.
  de.a2.unit96.lesson02.teach.morgen_gehe_ich:
    title: Werden or vorhaben?
    gloss: Tomorrow I am going to the market. Later I plan to move house.
    note: 'Use *werden* or the present tense with a time word for the near, settled future: *Morgen gehe ich auf den Markt*. Use *vorhaben* for an intention that is further away or less certain: *Später habe ich vor, umzuziehen*.'
  de.a2.unit96.lesson03.teach.vielleicht_sicher:
    title: Maybe and certainly
    gloss: maybe / certainly
    note: '*Vielleicht* expresses doubt. *Sicher* means ''certainly'' or ''for sure''.'
    example_gloss:
    - Maybe it will rain tomorrow.
    - That is certainly fun.
  de.a2.unit96.lesson03.teach.dieses_jahr_diesen:
    title: This year, this summer
    gloss: this year / this summer
    note: '*Jahr* is neuter, so *dieses Jahr*. *Sommer* is masculine, so *diesen Sommer* (accusative for a time).'
    example_gloss:
    - This year I am not going on holiday.
    - This summer I am staying at home.
  de.a2.unit96.lesson03.teach.diesen_sommer_bleibe:
    title: Staying at home
    gloss: This summer I am staying at home.
  de.a2.unit96.lesson03.teach.morgen_werde_ich:
    title: Vielleicht and word order
    gloss: Tomorrow I am going to work. Maybe I will go to the cinema later.
    note: '*Vielleicht* at the start of a sentence counts as the first item, so the verb comes right after it: *Vielleicht gehe ich später ins Kino*, not *Vielleicht ich gehe*. The same happens after any time word: *Morgen werde ich arbeiten*.'
  de.a2.unit96.lesson03.teach.ich_fahre_nicht:
    title: Saying you are not going to
    gloss: I am not going on holiday. I do not plan to move house.
    note: 'Put *nicht* after the verb, before the rest of the plan: *Ich fahre nicht in den Urlaub*. With *vorhaben*, *nicht* goes between *habe* and *vor*: *Ich habe nicht vor, umzuziehen*.'
  de.a2.unit96.lesson04.teach.mit_wem_wie:
    title: Two question phrases
    gloss: with whom / how long
    note: '*Mit wem* asks about a person you do something with (*wem* is the dative after *mit*). *Wie lange* asks about a period of time.'
    example_gloss:
    - Who are you going to the beach with?
    - How long are you staying?
  de.a2.unit96.lesson04.teach.wohin_faehrst_du:
    title: Where are you going?
    gloss: Where are you going (to)?
    note: '*Wohin* asks about a direction and stands at the start of the question.'
  de.a2.unit96.lesson04.teach.mit_wem_faehrst:
    title: Who with?
    gloss: Who are you going on holiday with?
  de.a2.unit96.lesson04.teach.wie_lange_bleibst:
    title: How long?
    gloss: How long are you staying there?
  de.a2.unit96.lesson04.teach.ich_fahre_mit:
    title: Answering
    gloss: I am going with my sister.
  de.a2.unit96.lesson04.teach.eine_woche_zwei:
    title: Weeks
    gloss: one week / two weeks
    note: The plural of *Woche* is *Wochen*.
    example_gloss:
    - I am staying for a week.
    - We are staying for two weeks.
  de.a2.unit96.lesson04.teach.wohin_faehrst_du_2:
    title: Questions about plans
    gloss: Where are you going? Who are you going with? How long are you going to stay?
    note: 'Put the question word first, then the verb in second place, then *du*: *Wohin fährst du?* With *werden*, the infinitive goes at the end: *Wie lange wirst du bleiben?*'
  de.a2.unit96.lesson05.teach.hallo_anna_bald:
    title: A message from Nina
    gloss: Hi Anna! Soon I have a holiday. In August I am going to Austria with my sister. We are going to stay in a hotel for a week. After that I am going to my parents' for two days. Next year I plan to take a course. Maybe I will move house then too. What are you going to do?
    note: 'Nina describes near plans with *werden* (or the present) and a longer-term intention with *vorhaben*. Notice that every infinitive sits at the end of its clause: *fahren*, *bleiben*, *zu besuchen*, *umziehen*.'
    glosses:
      bald: soon
      urlaub: holiday
      august: August
      schwester: sister
      nach: to
      österreich: Austria
      hotel: hotel
      bleiben: to stay
      danach: after that
      eltern: parents
      tage: days
      nächstes: next
      jahr: year
      vor: vor (part of vorhaben = to intend)
      kurs: course
      besuchen: to attend
      vielleicht: maybe
      umziehen: to move house
      dann: then
      auch: also
  de.a2.unit96.lesson06.teach.hallo_felix_hast:
    title: Anna asks Felix about his plans
    gloss: 'Anna: Hi Felix! Do you have plans for the summer holiday yet?'
  de.a2.unit96.lesson06.teach.ja_im_august:
    title: Felix answers
    gloss: 'Felix: Yes! In August I am going to Italy. I am going to book a hotel.'
  de.a2.unit96.lesson06.teach.schoen_mit_wem:
    title: Anna asks who he is going with
    gloss: 'Anna: Nice! Who are you going with?'
  de.a2.unit96.lesson06.teach.mit_meinem_onkel:
    title: Felix says who and how long
    gloss: 'Felix: With my uncle. We are going to stay for a week.'
  de.a2.unit96.lesson06.teach.und_spaeter_was:
    title: Anna asks about later
    gloss: 'Anna: And later? What do you plan to do?'
  de.a2.unit96.lesson06.teach.naechstes_jahr_habe:
    title: Felix names an intention and asks back
    gloss: 'Felix: Next year I plan to take a course. And you?'
  de.a2.unit96.lesson06.teach.im_juli_werde:
    title: Anna answers
    gloss: 'Anna: In July I am going to work. Maybe I will go to my parents'' after that.'
