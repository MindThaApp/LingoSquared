course:
  title: "German B1"
  description: "Learn B1-level German for describing future plans, intentions, and predictions with the right degree of certainty, using Ich habe vor, werde wahrscheinlich, and vielleicht."

units:
  de.b1.unit48.zukunftsplaene: {title: "Future Plans"}

lessons:
  de.b1.unit48.lesson01.ich_habe_vor: {title: "I'm planning to ..."}
  de.b1.unit48.lesson02.wahrscheinlich_vielleicht: {title: "Probably or maybe?"}
  de.b1.unit48.lesson03.cafe_dialogue: {title: "Dialogue: Maybe we'll both work in Berlin"}

teaching:
  de.b1.unit48.lesson01.teach.anna_vorhaben_berlin: {title: "Anna states an intention", gloss: "Anna: I'm planning to move to Berlin in the summer.", note: "*Ich habe vor, ... zu ...* + infinitive clause states a firm personal intention.", example_gloss: "Intention: I'm planning to move to Berlin in the summer."}
  de.b1.unit48.lesson01.teach.anna_vorhaben_cafe: {title: "Anna states a fixed plan", gloss: "Anna: I will open my own cafe next year.", note: "*werde* + infinitive states a fixed, firmly decided plan, distinct from the vorhaben construction but expressing similar certainty.", example_gloss: "Fixed plan: I will open my own cafe next year."}
  de.b1.unit48.lesson02.teach.felix_wahrscheinlich_job: {title: "Felix makes a likely prediction", gloss: "Felix: I will probably change jobs.", note: "*werde* + *wahrscheinlich* + infinitive marks a prediction as likely but not certain.", example_gloss: "Likely prediction: I will probably change jobs."}
  de.b1.unit48.lesson02.teach.felix_vielleicht_umziehen: {title: "Felix makes an uncertain prediction", gloss: "Felix: Maybe I'll move too.", note: "*vielleicht* + present tense marks a prediction as uncertain, a weaker degree of certainty than wahrscheinlich.", example_gloss: "Uncertain prediction: Maybe I'll move too."}
  de.b1.unit48.lesson03.teach.anna_plan: {title: "Anna states her plan", gloss: "Anna: I'm planning to move to Berlin in the summer.", note: "Opens the dialogue with the fixed intention from lesson01."}
  de.b1.unit48.lesson03.teach.felix_react_and_predict: {title: "Felix reacts and predicts", gloss: "Felix: That's exciting! I will probably change jobs.", note: "Felix reacts, then adds his own likely prediction from lesson02."}
  de.b1.unit48.lesson03.teach.anna_predict_together: {title: "Anna makes an uncertain joint prediction", gloss: "Anna: Maybe we'll both work in Berlin then.", note: "Anna uses vielleicht to mark this joint outcome as an uncertain prediction, distinct from her own certain plan."}
  de.b1.unit48.lesson03.teach.felix_close: {title: "Felix closes warmly", gloss: "Felix: That would be nice.", note: "A short closing reaction."}

