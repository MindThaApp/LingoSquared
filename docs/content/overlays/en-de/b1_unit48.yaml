  de.b1.unit48.lesson01.exercise05.order_anna_vorhaben_berlin: {instruction: "Put the words in order to say \"I'm planning to move to Berlin in the summer.\"", accepted_answers: [{value: ["Ich", "habe", "vor,", "im", "Sommer", "nach", "Berlin", "zu", "ziehen."], status: "correct"}], feedback: "The correct order is *Ich habe vor, im Sommer nach Berlin zu ziehen.*"}
