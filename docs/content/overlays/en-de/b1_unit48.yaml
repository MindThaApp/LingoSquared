  de.b1.unit48.lesson01.exercise02.recognize_anna_vorhaben_cafe: {instruction: "Which German sentence means \"I will open my own cafe next year.\"?", correct_option: "Ich werde nächstes Jahr ein eigenes Café eröffnen.", distractors: ["Ich werde im Sommer ein eigenes Café eröffnen.", "Ich habe vor, nächstes Jahr nach Berlin zu ziehen.", "Ich werde nächstes Jahr im Café arbeiten."], accepted_answers: [{value: "Ich werde nächstes Jahr ein eigenes Café eröffnen.", status: "correct"}], feedback: "*werde* + infinitive states a fixed, firmly decided plan."}
  de.b1.unit48.lesson01.exercise03.listen_select_vorhaben: {instruction: "Listen. What is Anna's plan?", correct_option: "She's planning to move to Berlin in the summer.", distractors: ["She's planning to move to Berlin in the winter.", "She's planning to open a cafe in Berlin.", "She's maybe moving to Berlin."], accepted_answers: [{value: "She's planning to move to Berlin in the summer.", status: "correct"}], feedback: "The recording says *Ich habe vor, im Sommer nach Berlin zu ziehen*."}
