  status: reviewed
  required_next_reviewer: native_speaker_pass
  notes: >-
    Overlay for German's third C1 unit, authored alongside the realization
    (no adaptable public-domain German C1 register source exists; see the
    realization provenance note). English speakers' real interference risks
    for this outcome: (1) German modal particles (*ja*, *doch*, *schon*,
    *Na*) carry the tone -- irony and exasperation -- where English uses word
    stress and intonation, so English learners read them as redundant or miss
    the reversal; each is glossed with its actual effect. (2) German irony
    wears a positive surface (Na, das hat ja wieder wunderbar geklappt) that
    must not be read literally -- the glosses pin the reversed meaning. (3)
    Konjunktiv II hedges (*wäre*, *würde*, *könnten*) are the STANDARD polite
    forms of German requests, not optional "could/would" extras -- the
    diplomatic register is built from them. (4) The register variation in
    this unit is lexical and prosodic, never a T/V switch: the blunt,
    emphatic, and ironic lines all stay in formal Sie, and learners must not
    conclude that "emphatic" means informal *du*. (5) The culminating
    prompts name the EXACT two sentences to produce (diplomatic then
    emphatic) so a correct answer is well-determined. No sibling-direction
    file (de-en) was consulted.

    Fresh-context review 2026-10-11 (content-reviewer.md checklist): checked
    course-scoped compile, YAML booleans, jargon/AI leaks, character canon,
    note accuracy, matching discriminability, prompt determinacy and accepted-
    answer completeness for unit03 realization + en-de overlay. Fixes:
    de.c1.unit03.lesson05.exercise06 and lesson06.exercise05
    speak_ton_wechseln prompt + instruction were underdetermined -> now name
    the forms (Ich fuerchte ... spaeter als vereinbart / schon wieder zu
