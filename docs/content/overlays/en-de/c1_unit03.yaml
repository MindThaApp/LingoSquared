course:
  title: German C1
  description: >-
    Advanced German: exercise fine-grained control of tone and register,
    shifting between formal, diplomatic, emphatic, and ironic styles to suit
    audience and intent with stylistic appropriacy.

units:
  de.c1.unit03.der_richtige_ton:
    title: "Striking the right tone"
    description: "Master the four registers of a German workplace message -- formal, diplomatic, emphatic, and ironic -- recognize the tone of what you read and hear, and shift the same message between registers for the audience."

lessons:
  de.c1.unit03.lesson01.der_formelle_ton:
    title: "The formal tone"
  de.c1.unit03.lesson02.diplomatisch_formulieren:
    title: "Phrasing diplomatically"
  de.c1.unit03.lesson03.deutlich_und_nachdruecklich:
    title: "Clear and emphatic"
  de.c1.unit03.lesson04.den_ton_erkennen:
    title: "Recognizing the tone"
  de.c1.unit03.lesson05.den_ton_wechseln:
    title: "Shifting the tone"
  de.c1.unit03.lesson06.der_vollstaendige_austausch:
    title: "The complete exchange"

teaching:
  de.c1.unit03.lesson01.teach.sehr_geehrte_damen_und_herren:
    title: "Dear Sir or Madam"
    gloss: "Dear Sir or Madam (formal letter salutation)"
    note: "*Sehr geehrte Damen und Herren* is the standard formal salutation of a German business letter or formal email when the recipient's name is unknown (*geehrte* = 'honoured'). Spoken, it opens formal speeches and announcements, but never an ordinary face-to-face conversation."
  de.c1.unit03.lesson01.teach.bezug_nehmend_auf:
    title: "with reference to"
    gloss: "with reference to (bureaucratic opening)"
    note: "*Bezug nehmend auf* = 'with reference to' -- the classic opening of official German correspondence. It reaches back to an earlier order, letter, or contract and announces that the new message relates to it. The noun *der Bezug* (reference) plus *nehmend* (taking) belongs exclusively to this bureaucratic register."
  de.c1.unit03.lesson01.teach.fristgerecht:
    title: "by the deadline / on time"
    gloss: "by the deadline / on time"
    note: "*Fristgerecht* means 'by the deadline, on time' -- from *die Frist* (deadline). It is a formal, written-register adjective; in speech a German would more likely say *pünktlich* or *rechtzeitig*. *Nicht fristgerecht eingegangen* = 'was not received by the deadline'."
    example_gloss: "The delivery was received by the deadline."
  de.c1.unit03.lesson01.teach.nicht_fristgerecht_eingegangen:
    title: "not received by the deadline"
    gloss: "not received by the deadline"
    note: "*Nicht fristgerecht eingegangen* is the bureaucratic way to say a shipment did not arrive on time. *Eingegangen* (arrived, been received) is the written-register participle of *eingehen*, used for incoming letters, payments, and goods."
  de.c1.unit03.lesson01.teach.wir_bitten_um_verstaendnis:
    title: "We ask for your understanding."
    gloss: "we ask for your understanding"
    note: "*Wir bitten um Verständnis* = 'We ask for your understanding' -- the fixed formula by which an organization softens an apology for a delay or problem. *Bitten um* (to ask for) takes the accusative object *Verständnis*."
  de.c1.unit03.lesson01.teach.die_lieferung:
    title: "the delivery"
    gloss: "the delivery"
    note: "*Die Lieferung* = the delivery -- the shipment of goods from a supplier to a customer. It is the object of this whole unit: the delivery is late, and the unit's different tones are all ways of saying so."
    example_gloss: "The delivery was received by the deadline."
  de.c1.unit03.lesson01.teach.die_bestellung:
    title: "the order"
    gloss: "the order"
    note: "*Die Bestellung* = the order -- what a customer places with a supplier. In the formal letter the delayed delivery is traced back to *die Bestellung* (the order)."
    example_gloss: "The order has been received."
  de.c1.unit03.lesson01.teach.formeller_ton_muster:
    title: "The formal letter"
    gloss: "Dear Sir or Madam, with reference to the order, the delivery was again not received by the deadline. We ask for your understanding."
    note: "A complete formal-register message. Every element is written language: the greeting *Sehr geehrte Damen und Herren*, the bureaucratic opener *Bezug nehmend auf die Bestellung*, the participial verdict *nicht fristgerecht eingegangen*, and the closing formula *Wir bitten um Verständnis*. Note the frame: in *Bezug nehmend auf die Bestellung ist die Lieferung ... eingegangen* the finite verb *ist* comes second after the fronted participial phrase."

  de.c1.unit03.lesson02.teach.ich_fuerchte:
    title: "I am afraid ..."
    gloss: "I am afraid ... (softener before bad news)"
    note: "*Ich fürchte, ...* = 'I am afraid, ...' -- a conversational hedge that softens bad news before it is spoken. What matters is the effect: it signals that the speaker regrets the news they are about to give."
  de.c1.unit03.lesson02.teach.spaeter_als_vereinbart:
    title: "later than agreed"
    gloss: "later than agreed"
    note: "*Später als vereinbart* = 'later than agreed'. *Vereinbart* (agreed, from *vereinbaren*) appears in the fixed comparative phrase *später als vereinbart* -- a diplomatic way to name a delay without calling it a mistake."
  de.c1.unit03.lesson02.teach.ich_wuerde_vorschlagen:
    title: "I would suggest ..."
    gloss: "I would suggest ..."
    note: "*Ich würde vorschlagen, ...* = 'I would suggest, ...' -- the Konjunktiv II of *vorschlagen* (to suggest). The conditional makes the proposal a gentle offer rather than an order -- exactly the diplomatic register this lesson teaches."
  de.c1.unit03.lesson02.teach.es_waere_vielleicht_sinnvoll:
    title: "It might perhaps be sensible ..."
    gloss: "it might perhaps be sensible ..."
    note: "*Es wäre vielleicht sinnvoll, ...* = 'It might perhaps be sensible, ...' -- a triple hedge (*wäre* + *vielleicht* + *sinnvoll*). Each layer softens the suggestion further, which is why the construction is a signature of diplomatic German."
  de.c1.unit03.lesson02.teach.wir_waeren_ihnen_dankbar:
    title: "We would be grateful to you if ..."
    gloss: "we would be grateful to you if ..."
    note: "*Wir wären Ihnen dankbar, wenn ...* = 'We would be grateful to you if ...'. *Wären* is the Konjunktiv II of *sein*; the whole construction turns a request into a statement of thanks in advance, so the request itself never sounds like a demand. The *wenn*-clause is verb-final: *wenn Sie uns mitteilen könnten, wann die Lieferung eintrifft*."
  de.c1.unit03.lesson02.teach.gegebenenfalls:
    title: "if applicable / where necessary"
    gloss: "if applicable / where necessary"
    note: "*Gegebenenfalls* = 'if applicable, where necessary' -- a formal adverb (often abbreviated *ggf.* in German business writing) that states a condition without committing to it: *Gegebenenfalls verschieben wir den Termin*."
    example_gloss: "If necessary, we will postpone the appointment."
  de.c1.unit03.lesson02.teach.die_verzoegerung:
    title: "the delay"
    gloss: "the delay"
    note: "*Die Verzögerung* = the delay -- the noun built from *verzögern* (to delay). In the diplomatic register the delay is named factually (*Die Verzögerung beträgt eine Woche*), never blamed."
    example_gloss: "The delay is one week."
  de.c1.unit03.lesson02.teach.diplomatisch_muster:
    title: "The diplomatic message"
    gloss: "I am afraid the delivery is again coming later than agreed. We would be grateful if you could tell us when the delivery will arrive."
    note: "The same fact as lesson one's formal letter, rephrased for a business partner. Every sentence hedges: *Ich fürchte* softens the news, *später als vereinbart* names the delay without blame, and *Wir wären Ihnen dankbar, wenn Sie uns mitteilen könnten* turns the follow-up question into a grateful request. Note the word order in the *wenn*-clause: *wenn Sie uns mitteilen könnten, wann die Lieferung eintrifft* -- verb-final, with the embedded question at the end."

  de.c1.unit03.lesson03.teach.das_ist_inakzeptabel:
    title: "That is unacceptable."
    gloss: "that is unacceptable"
    note: "*Das ist inakzeptabel* = 'That is unacceptable' -- a direct, emphatic judgement. Where the diplomatic register hedges, this sentence states the verdict flatly."
  de.c1.unit03.lesson03.teach.das_kann_so_nicht_weitergehen:
    title: "This cannot go on like this."
    gloss: "this cannot go on like this"
    note: "*Das kann so nicht weitergehen* = 'This cannot go on like this' -- the emphatic conclusion after naming a repeated problem. *Weitergehen* (to go on) is separable (*Es geht so nicht weiter*), but after the modal *kann* it stays together as an infinitive at the end: *Das kann so nicht weitergehen*."
  de.c1.unit03.lesson03.teach.das_kann_doch_nicht_ihr_ernst_sein:
    title: "You cannot be serious!"
    gloss: "you cannot be serious (emphatic protest)"
    note: "*Das kann doch nicht Ihr Ernst sein!* = 'You cannot be serious!' -- an emphatic protest of disbelief. The modal particle *doch* gives the sentence its protest tone, and *Ihr Ernst* (your seriousness) keeps the address formal Sie: the indignation is emphatic, not rude."
  de.c1.unit03.lesson03.teach.schon_wieder:
    title: "yet again"
    gloss: "yet again"
    note: "*Schon wieder* = 'yet again' -- the fixed collocation that marks exasperation at a repeated event. *Schon* is the intensifying particle: *Die Lieferung ist schon wieder zu spät* = 'The delivery is late yet again'."
  de.c1.unit03.lesson03.teach.zu_spaet:
    title: "too late"
    gloss: "too late"
    note: "*Zu spät* = 'too late'. In *Die Lieferung ist schon wieder zu spät* the *zu* is the intensifier ('too'), not the infinitive marker."
  de.c1.unit03.lesson03.teach.der_lieferant:
    title: "the supplier"
    gloss: "the supplier"
    note: "*Der Lieferant* = the supplier -- the company that sends the delivery and is responsible for the delay. In the exchange the message is addressed to *den Lieferanten* (accusative of *der Lieferant*)."
    example_gloss: "The supplier has not got back to us yet."
  de.c1.unit03.lesson03.teach.deutlich:
    title: "clear / explicit"
    gloss: "clear / explicit"
    note: "*Deutlich* = clear, explicit, unmistakable (not the same as *direkt*, 'direct'). It is the positive way to describe the emphatic register: *Das ist deutlich* ('that is clear') acknowledges that a direct message leaves no room for doubt."
    example_gloss: "The internal note is very clear."
  de.c1.unit03.lesson03.teach.nachdruecklich_muster:
    title: "The emphatic message"
    gloss: "The delivery is late yet again. This is already the third time. This cannot go on like this."
    note: "The emphatic register stacks three short sentences of rising pressure: the fact (*Die Lieferung ist schon wieder zu spät*), the count (*Das ist bereits das dritte Mal*), and the verdict (*Das kann so nicht weitergehen*). No hedges, no subjunctives -- the register variation is purely lexical and structural, still in formal Sie."

  de.c1.unit03.lesson04.teach.diplomatische_nachricht:
    title: "The diplomatic message"
    gloss: "We would be grateful if you could tell us when the delivery will arrive."
    note: "A reading of the diplomatic register in isolation. Every device is present: the Konjunktiv II *wären ... könnten*, the gratitude frame *Wir wären Ihnen dankbar, wenn ...*, and the polite embedded question *wann die Lieferung eintrifft*."
  de.c1.unit03.lesson04.teach.nachdrueckliche_nachricht:
    title: "The emphatic message"
    gloss: "The delivery is late yet again. This cannot go on like this."
    note: "The same situation, the emphatic register. Two short declarative sentences with no subjunctive and no hedge: *Die Lieferung ist schon wieder zu spät* plus the verdict *Das kann so nicht weitergehen*."
  de.c1.unit03.lesson04.teach.na_das_hat_wunderbar_geklappt:
    title: "Oh, that worked wonderfully again."
    gloss: "oh, that worked wonderfully again (ironic)"
    note: "*Na, das hat ja wieder wunderbar geklappt* = 'Oh, that worked wonderfully again' -- pure irony. The praising words *wunderbar geklappt* (worked wonderfully) plus the particles *Na* and *ja* reverse the meaning: the delivery was a disaster again. The positive surface is the signal."
  de.c1.unit03.lesson04.teach.der_empfaenger:
    title: "the recipient"
    gloss: "the recipient"
    note: "*Der Empfänger* = the recipient -- the person or company a message is addressed to. In this unit the recipient of the complaint is *der Lieferant* (the supplier)."
    example_gloss: "The recipient of the message is the supplier."
  de.c1.unit03.lesson04.teach.der_ton:
    title: "the tone"
    gloss: "the tone"
    note: "*Der Ton* = the tone -- how something is said rather than what is said. The unit's theme: the same message can be delivered in different tones -- formal, diplomatic, emphatic, ironic."
    example_gloss: "The tone of the two messages is different."
  de.c1.unit03.lesson04.teach.diplomatisch:
    title: "diplomatic"
    gloss: "diplomatic"
    note: "*Diplomatisch* = diplomatic -- hedged, polite, relationship-preserving. *Eine diplomatische Nachricht klingt höflich* = 'A diplomatic message sounds polite'."
    example_gloss: "A diplomatic message sounds polite."
  de.c1.unit03.lesson04.teach.nachdruecklich:
    title: "emphatic"
    gloss: "emphatic"
    note: "*Nachdrücklich* = emphatic, insistent -- direct, leaving no doubt. *Eine nachdrückliche Nachricht ist direkt* = 'An emphatic message is direct'."
    example_gloss: "An emphatic message is direct."
  de.c1.unit03.lesson04.teach.ton_muster:
    title: "Same content, different tone"
    gloss: "Both messages say the same thing, but the tone is different: the diplomatic one is polite, the emphatic one is direct."
    note: "*Dasselbe* vs *verschieden* is the whole point: *Beide Nachrichten sagen dasselbe* (both messages say the same thing) while *der Ton ist verschieden* (the tone is different). The adjectives *höflich* (polite) and *direkt* (direct) name the two registers. Note *dasselbe* -- the *derselbe/dasselbe/dieselbe* set -- which expresses 'the very same', distinct from *gleich*."

  de.c1.unit03.lesson05.teach.derselbe_inhalt:
    title: "the same content"
    gloss: "the same content"
    note: "*Derselbe Inhalt* = 'the same content' -- *derselbe* (the very same, masculine nominative) stresses identity, not similarity: the two messages carry the very same content, only the tone changes."
  de.c1.unit03.lesson05.teach.anders_klingen:
    title: "to sound different"
    gloss: "to sound different"
    note: "*Anders klingen* = 'to sound different'. *Klingen* (to sound) is the perception verb for tone: *Derselbe Inhalt, zwei Töne -- sie klingen anders*."
  de.c1.unit03.lesson05.teach.diplomatischer_formulieren:
    title: "I would phrase it more diplomatically."
    gloss: "I would phrase it more diplomatically."
    note: "*Ich würde es diplomatischer formulieren* = 'I would phrase it more diplomatically'. *Formulieren* (to phrase, to word) is the unit's production verb, and *diplomatischer* is the comparative of *diplomatisch*: more diplomatic than the current draft."
  de.c1.unit03.lesson05.teach.wechsel_muster:
    title: "Two tones, one message"
    gloss: "Same content, two tones: Diplomatic: I am afraid the delivery is again coming later than agreed. Emphatic: The delivery is late yet again."
    note: "The exact shift the outcome asks for: the same fact expressed once with the diplomatic toolkit (*Ich fürchte, ... wieder später als vereinbart*) and once with the emphatic toolkit (*schon wieder zu spät*). The content words map onto each other: *fürchte* becomes *schon wieder*, *später als vereinbart* becomes *zu spät*."

  de.c1.unit03.lesson06.teach.vogel_frage:
    title: "Frau Vogel: Have you already written the reply to the supplier?"
    gloss: "Have you already written the reply to the supplier?"
    note: "Frau Vogel opens the exchange with formal Sie (*Haben Sie ... geschrieben?*). She assumes the reply exists -- the question is about its wording, which is where the tone choice happens."
  de.c1.unit03.lesson06.teach.felix_entwurf:
    title: "Felix: I have a draft, but it sounds too harsh. The delivery is late yet again. This cannot go on like this."
    gloss: "I have a draft, but it sounds too harsh. The delivery is late yet again. This cannot go on like this."
    note: "Felix's first draft is the emphatic register in full: *klingt zu scharf* (sounds too harsh), *schon wieder zu spät*, *Das kann so nicht weitergehen*. He already senses it is wrong for the recipient."
  de.c1.unit03.lesson06.teach.vogel_direkt:
    title: "Frau Vogel: That is clear, but too direct for a message."
    gloss: "That is clear, but too direct for a message."
    note: "Frau Vogel diagnoses the tone: *deutlich* (clear) but *zu direkt* (too direct). The word *Nachricht* (message) is her term for the communication to the supplier."
  de.c1.unit03.lesson06.teach.felix_vorschlag:
    title: "Felix: I would suggest phrasing it more diplomatically. We would be grateful if you could tell us when the delivery will arrive."
    gloss: "I would suggest phrasing it more diplomatically. We would be grateful if you could tell us when the delivery will arrive."
    note: "Felix switches to the diplomatic register: the Konjunktiv II suggestion *Ich würde vorschlagen, es diplomatischer zu formulieren*, then the gratitude-framed request *Wir wären Ihnen dankbar, wenn Sie uns mitteilen könnten, wann die Lieferung eintrifft*."
  de.c1.unit03.lesson06.teach.vogel_freundlich:
    title: "Frau Vogel: Good, that sounds friendly but says clearly what we need."
    gloss: "Good, that sounds friendly but says clearly what we need."
    note: "Frau Vogel approves: *klingt freundlich* (sounds friendly) while still *sagt deutlich, was wir brauchen* (says clearly what we need). The diplomatic register keeps both the warmth and the message."
  de.c1.unit03.lesson06.teach.felix_ironie:
    title: "Felix: And the delivery? Oh, that worked wonderfully again."
    gloss: "And the delivery? Oh, that worked wonderfully again (ironic)."
    note: "With the reply settled, Felix turns back to the late delivery itself (*Und die Lieferung?*) and closes with the unit's ironic formula *Na, das hat ja wieder wunderbar geklappt* -- meaning, of course, the opposite: nothing about the delivery worked out."
  de.c1.unit03.lesson06.teach.austausch_muster:
    title: "The complete exchange"
    gloss: "A complete exchange in which the same problem is first drafted in the emphatic register, then rephrased diplomatically -- and closed with an ironic remark."
    note: "Track the tone across the turns: blunt emphatic draft (Felix) -- diagnosis (Frau Vogel: *zu direkt*) -- diplomatic rewrite (Felix) -- approval (Frau Vogel) -- ironic coda (Felix). Formal Sie throughout: the register varies lexically and prosodically, never by switching to du."

exercises:
  de.c1.unit03.lesson01.exercise01.recognize_sehr_geehrte:
    instruction: "What does Sehr geehrte Damen und Herren mean?"
    correct_option: "Dear Sir or Madam -- the formal letter salutation."
    distractors: ["A casual greeting to a friend.", "A way to close a letter.", "An informal address to one person."]
    accepted_answers: [{value: "Dear Sir or Madam -- the formal letter salutation.", status: correct}]
    feedback: "*Sehr geehrte Damen und Herren* is the formal salutation of a German business letter when the recipient's name is unknown."
  de.c1.unit03.lesson01.exercise02.listen_formell:
    instruction: "Listen and select the meaning of the sentence."
    correct_option: "With reference to the order, the delivery was again not received by the deadline."
    distractors: ["With reference to the delivery, the order was received early.", "The delivery has been cancelled by the supplier.", "We are ordering the goods again because they are overdue."]
    accepted_answers: [{value: "With reference to the order, the delivery was again not received by the deadline.", status: correct}]
    feedback: "*Bezug nehmend auf die Bestellung ist die Lieferung erneut nicht fristgerecht eingegangen* -- bureaucratic German for 'the delivery missed the deadline again'."
  de.c1.unit03.lesson01.exercise03.match_formell:
    instruction: "Match each formal German phrase to its meaning."
    accepted_answers:
      - value: {"Sehr geehrte Damen und Herren": "formal letter salutation: Dear Sir or Madam", "Bezug nehmend auf": "with reference to (bureaucratic opening)", "fristgerecht": "by the deadline / on time", "nicht fristgerecht eingegangen": "was not received by the deadline", "Wir bitten um Verständnis": "we ask for your understanding", "die Lieferung": "the delivery", "die Bestellung": "the order"}
        status: correct
    feedback: "Each phrase is a fixed formula of the formal written register -- the salutation, the opener, the deadline adverb, and the apology formula."
  de.c1.unit03.lesson01.exercise04.order_formell:
