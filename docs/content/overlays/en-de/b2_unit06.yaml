  de.b2.unit06.lesson04.teach.unterschiedlich:
    title: different
    gloss: "different / varying"
    example_gloss: "Opinions vary."
  de.b2.unit06.lesson04.teach.grammar_werte:
    title: "Values differ from culture to culture. Basically, society shapes our values."
    gloss: "Values differ from culture to culture. Basically, society shapes our values."
    note: "Discussing values and culture is the broadening move of this lesson -- from one person's opinion (Erfolg) to a claim about groups and societies."

  de.b2.unit06.lesson05.teach.meinungstext:
    title: "Reading: what success means"
    gloss: "Many people believe that success above all means money. Generally, I see it differently: for me, success primarily means contentment. Of course money plays a role, but only to a certain degree. Some say that status is more important than contentment. I understand what they mean, but I don't quite agree, because basically contentment is what remains."
    glosses:
      viele: many
      glauben: "to believe"
      vor: "before (vor allem = above all)"
      allem: "(vor allem = above all)"
      in: "in (in erster Linie = primarily)"
      erster: "first (in erster Linie = primarily)"
      Linie: "line (in erster Linie = primarily)"
      spielt: "plays (eine Rolle spielen = to play a role)"
      eine: a
      Rolle: role
      sie: "they (referring back to manche, 'some people' -- lowercase, distinct from capitalized formal Sie)"
      wichtiger: "more important"
      das: that
      was: what
      bleibt: remains

  de.b2.unit06.lesson06.teach.schon:
    title: "indeed / really"
    gloss: "indeed / really (emphasis)"
    example_gloss: "That is indeed important to me."
  de.b2.unit06.lesson06.teach.dialogue_felix_claim:
    title: "Felix: Generally, I believe that success means contentment, not just money."
    gloss: "Felix: Generally, I believe that success means contentment, not just money."
  de.b2.unit06.lesson06.teach.dialogue_vogel_view:
    title: "Frau Vogel: I understand what you mean, but I see it differently: status really is important to me."
    gloss: "Frau Vogel: I understand what you mean, but I see it differently: status really is important to me."
  de.b2.unit06.lesson06.teach.dialogue_felix_disagree:
    title: "Felix: I disagree with that. Status does not necessarily mean contentment."
    gloss: "Felix: I disagree with that. Status does not necessarily mean contentment."
  de.b2.unit06.lesson06.teach.dialogue_vogel_concede:
    title: "Frau Vogel: It depends. To a certain degree, I agree with you."
    gloss: "Frau Vogel: It depends. To a certain degree, I agree with you."
  de.b2.unit06.lesson06.teach.grammar_gespraech:
    title: "I understand what you mean, but I see it differently. I disagree with that. It depends."
    gloss: "I understand what you mean, but I see it differently. I disagree with that. It depends."
    note: "A full abstract discussion has both moves: stating your own qualified opinion, and directly engaging the other person's view rather than just restating your own -- exactly what Felix and Frau Vogel do here."

