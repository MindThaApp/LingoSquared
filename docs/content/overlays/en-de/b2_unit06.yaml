    title: "Qualifying an opinion"
  de.b2.unit06.lesson03.auf_eine_andere_meinung_reagieren:
    title: "Responding to another view"
  de.b2.unit06.lesson04.werte_und_kultur:
    title: "Values and culture"
  de.b2.unit06.lesson05.einen_meinungstext_lesen:
    title: "Reading an opinion text"
  de.b2.unit06.lesson06.ein_gespraech_ueber_erfolg:
    title: "A conversation about success"

teaching:
  de.b2.unit06.lesson01.teach.erfolg:
    title: success
    gloss: success
    example_gloss: "Success means a lot to many people."
  de.b2.unit06.lesson01.teach.bedeuten:
    title: "to mean"
    gloss: "to mean"
    note: "*Bedeuten* = to mean. Used here without a dative object: *Erfolg bedeutet Zufriedenheit* ('success means contentment'), not *Erfolg bedeutet mir Zufriedenheit*."
    example_gloss: "What does success mean to you?"
  de.b2.unit06.lesson01.teach.zufriedenheit:
    title: "contentment / satisfaction"
    gloss: "contentment / satisfaction"
    example_gloss: "Contentment is important to me."
  de.b2.unit06.lesson01.teach.im_allgemeinen:
    title: "Generally, I believe that..."
    gloss: "Generally, I believe that..."
    note: "*Im Allgemeinen glaube ich, dass...* opens a qualified opinion -- 'generally' signals this is your general view, not an absolute claim."
  de.b2.unit06.lesson01.teach.fuer_mich:
    title: "For me..."
    gloss: "For me, success means..."
    note: "*Für mich...* frames what follows as your own personal view, distinct from a universal claim about what success 'really' is."
  de.b2.unit06.lesson01.teach.wichtig:
    title: important
    gloss: important
    example_gloss: "Money is not so important to me."
  de.b2.unit06.lesson01.teach.claim_model:
    title: "Generally, I believe that success means contentment."
    gloss: "Generally, I believe that success means contentment."
    note: "The model qualified opinion for this unit -- a stance stated as a general belief, not an absolute fact."
  de.b2.unit06.lesson01.teach.grammar_erfolg:
    title: "Generally, I believe that success means contentment. That is important to me."
    gloss: "Generally, I believe that success means contentment. That is important to me."
    note: "A qualified opinion states your view while signaling it is a view, not a fact -- *im Allgemeinen* and *für mich* both do this."

  de.b2.unit06.lesson02.teach.bis_zu_einem_gewissen_grad:
    title: "to a certain degree"
    gloss: "to a certain degree"
    note: "*Bis zu einem gewissen Grad* limits how far a claim reaches -- a core way to qualify an opinion instead of stating it absolutely."
  de.b2.unit06.lesson02.teach.es_kommt_darauf_an:
    title: "It depends."
    gloss: "It depends."
    note: "*Es kommt darauf an* signals that the answer isn't fixed -- it depends on circumstances not yet stated."
  de.b2.unit06.lesson02.teach.unter_umstaenden:
    title: "under certain circumstances"
    gloss: "under certain circumstances"
    note: "*Unter Umständen* is close to *bis zu einem gewissen Grad* but frames the qualification as conditional on circumstances rather than degree."
  de.b2.unit06.lesson02.teach.nicht_unbedingt:
    title: "not necessarily"
    gloss: "not necessarily"
    note: "*Nicht unbedingt* softens a denial -- 'not necessarily' rather than a flat 'no'."
  de.b2.unit06.lesson02.teach.status:
    title: status
    gloss: "status (social standing)"
    example_gloss: "Status is important under certain circumstances."
  de.b2.unit06.lesson02.teach.geld:
    title: money
    gloss: money
    example_gloss: "Money does not necessarily mean success."
  de.b2.unit06.lesson02.teach.grammar_einschraenken:
    title: "Status is important to a certain degree. It depends. Money does not necessarily mean success."
    gloss: "Status is important to a certain degree. It depends. Money does not necessarily mean success."
    note: "Qualifying an opinion means limiting how absolutely you state it -- *bis zu einem gewissen Grad*, *es kommt darauf an*, *unter Umständen*, and *nicht unbedingt* are this unit's core hedging tools."

  de.b2.unit06.lesson03.teach.ich_verstehe_was_sie_meinen:
    title: "I understand what you mean, but..."
    gloss: "I understand what you mean, but..."
    note: "*Ich verstehe, was Sie meinen, aber...* acknowledges the other person's view respectfully before disagreeing -- the polite entry point into direct disagreement."
  de.b2.unit06.lesson03.teach.das_sehe_ich_anders:
    title: "I see it differently."
    gloss: "I see it differently."
    note: "*Das sehe ich anders* states disagreement plainly but not aggressively -- 'anders' (differently) was introduced in the register unit; here it marks a difference of opinion rather than of register."
  de.b2.unit06.lesson03.teach.da_bin_ich_anderer_meinung:
    title: "I disagree with that."
    gloss: "I disagree with that. / I have a different opinion on that."
    note: "*Da bin ich anderer Meinung* is a direct but still formal-register way to disagree -- *Meinung* (opinion) was introduced in unit01."
  de.b2.unit06.lesson03.teach.ich_stimme_nicht_ganz_zu:
    title: "I don't quite agree."
    gloss: "I don't quite agree."
    note: "*Ich stimme nicht ganz zu* softens disagreement into partial agreement -- the mildest of this lesson's four responses. Compare unit01's *Ich stimme dem zu* (I agree with it)."
  de.b2.unit06.lesson03.teach.grammar_reagieren:
    title: "I understand what you mean, but I see it differently. I disagree with that."
    gloss: "I understand what you mean, but I see it differently. I disagree with that."
    note: "Responding to another view directly -- rather than simply restating your own -- is the core skill this outcome tests. All four phrases in this lesson do this with varying directness."

  de.b2.unit06.lesson04.teach.werte:
    title: values
    gloss: "values (plural of der Wert)"
