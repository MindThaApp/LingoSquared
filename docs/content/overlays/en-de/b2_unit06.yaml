review:
  status: unreviewed
  required_next_reviewer: fresh_context_reviewer
  notes: >-
    Overlay for de's sixth B2 unit (first abstraction unit), authored
    alongside the realization (no adaptable upper-intermediate
    public-domain German source exists; see the realization provenance
    note). English speakers' real interference risks for this outcome:
    (1) "bedeuten" (to mean) is used without a dative object here
    ("Erfolg bedeutet Zufriedenheit"), distinct from the "bedeutet mir
    viel" dative pattern -- both exist in German but this unit consistently
    uses the dative-free form, flagged in lesson01; (2) the hedging
    phrases (bis zu einem gewissen Grad, unter Umständen, nicht
    unbedingt) have no single-word English equivalents and are gloss-heavy
    by necessity; (3) lowercase "sie" (she/they, introduced lesson05) vs
    capitalized "Sie" (formal you, from unit05) is flagged again in
    lesson05's glosses since this is exactly the kind of text where both
    could appear. No sibling direction file (de-en b2) was consulted.

course:
  title: German B2
  description: >-
    Upper-intermediate German: discuss abstract topics -- ideas and values
    -- expressing a qualified opinion (bis zu einem gewissen Grad, es
    kommt darauf an, nicht unbedingt) and responding directly to another
    person's view (ich verstehe, was Sie meinen, aber; da bin ich
    anderer Meinung), around the question of what success really means.

units:
  de.b2.unit06.abstraktion:
    title: "Abstraktion"
    description: Discuss an abstract topic -- what success means -- expressing a qualified opinion and responding directly to an opposing view rather than only stating your own.

