course:
  title: "German B1"
  description: "Learn B1-level German for combining two facts about a person or thing into one richer sentence using a relative clause, including gender agreement (der Kunde, der ...) and a preposition combined with the dative case (der Tisch, an dem ...)."

units:
  de.b1.unit53.beschreibungen: {title: "Descriptions"}

lessons:
  de.b1.unit53.lesson01.relativsaetze_nominativ: {title: "Relative clauses in the nominative"}
  de.b1.unit53.lesson02.relativsatz_praeposition: {title: "Relative clause with a preposition: at which"}
  de.b1.unit53.lesson03.cafe_dialogue: {title: "Dialogue: The man by the window"}

teaching:
  de.b1.unit53.lesson01.teach.anna_kunde_braun: {title: "Anna describes a customer", gloss: "Anna: The customer who orders coffee every day is called Mr. Braun.", note: "*Der Kunde, der ...* uses the nominative masculine relative pronoun der, agreeing with der Kunde, to combine two facts into one sentence.", example_gloss: "Description: The customer who orders coffee every day is called Mr. Braun."}
  de.b1.unit53.lesson01.teach.felix_kollegin_klein: {title: "Felix describes a colleague", gloss: "Felix: The colleague who works in the office is called Mrs. Klein.", note: "*Die Kollegin, die ...* uses the nominative feminine relative pronoun die, agreeing with die Kollegin.", example_gloss: "Description: The colleague who works in the office is called Mrs. Klein."}
  de.b1.unit53.lesson02.teach.felix_cafe_beliebt: {title: "Felix describes the cafe", gloss: "Felix: The cafe that Anna runs is very popular.", note: "*Das Café, das ...* uses the neuter relative pronoun das, agreeing with das Café, with Anna as the subject of the relative clause.", example_gloss: "Description: The cafe that Anna runs is very popular."}
  de.b1.unit53.lesson02.teach.anna_tisch_reserviert: {title: "Anna describes the table", gloss: "Anna: The table we're sitting at is reserved.", note: "*Der Tisch, an dem ...* combines the preposition an with the dative relative pronoun dem, agreeing with der Tisch.", example_gloss: "Description: The table we're sitting at is reserved."}
  de.b1.unit53.lesson03.teach.felix_wer_ist_der_mann: {title: "Felix asks about a man", gloss: "Felix: Who's the man by the window?", note: "Opens the identifying-description exchange."}
  de.b1.unit53.lesson03.teach.anna_identify_braun: {title: "Anna identifies him with a relative clause", gloss: "Anna: The customer who orders coffee every day is called Mr. Braun.", note: "Recaps the nominative relative clause from lesson01 to answer Felix's question."}
  de.b1.unit53.lesson03.teach.felix_ask_tisch: {title: "Felix asks about the table", gloss: "Felix: And the table he's sitting at?", note: "Sets up the preposition-plus-case relative clause."}
  de.b1.unit53.lesson03.teach.anna_lieblingsplatz: {title: "Anna describes the table", gloss: "Anna: The table he's sitting at is his favorite spot.", note: "*Der Tisch, an dem er sitzt, ...* extends the an dem pattern from lesson02 to a third-person subject."}

exercises:
  de.b1.unit53.lesson01.exercise01.recognize_anna_kunde_braun: {instruction: "Which German sentence means \"The customer who orders coffee every day is called Mr. Braun.\"?", correct_option: "Der Kunde, der jeden Tag Kaffee bestellt, heißt Herr Braun.", distractors: ["Der Kunde, der jeden Tag Tee bestellt, heißt Herr Braun.", "Die Kollegin, die jeden Tag Kaffee bestellt, heißt Herr Braun.", "Der Kunde, der jeden Tag Kaffee bestellt, heißt Frau Klein."], accepted_answers: [{value: "Der Kunde, der jeden Tag Kaffee bestellt, heißt Herr Braun.", status: "correct"}], feedback: "*Der Kunde, der ...* combines two facts about the customer with a nominative relative clause."}
  de.b1.unit53.lesson01.exercise02.recognize_felix_kollegin_klein: {instruction: "Which German sentence means \"The colleague who works in the office is called Mrs. Klein.\"?", correct_option: "Die Kollegin, die im Büro arbeitet, heißt Frau Klein.", distractors: ["Der Kunde, der im Büro arbeitet, heißt Frau Klein.", "Die Kollegin, die im Café arbeitet, heißt Frau Klein.", "Die Kollegin, die im Büro arbeitet, heißt Herr Braun."], accepted_answers: [{value: "Die Kollegin, die im Büro arbeitet, heißt Frau Klein.", status: "correct"}], feedback: "*Die Kollegin, die ...* agrees with the feminine die Kollegin."}
  de.b1.unit53.lesson01.exercise03.listen_select_kunde_braun: {instruction: "Listen. Who is being described?", correct_option: "The customer who orders coffee every day.", distractors: ["The colleague who works in the office.", "A customer who orders tea every day.", "The man who owns the cafe."], accepted_answers: [{value: "The customer who orders coffee every day.", status: "correct"}], feedback: "The recording says *Der Kunde, der jeden Tag Kaffee bestellt, heißt Herr Braun*."}
  de.b1.unit53.lesson01.exercise04.match_relativsaetze_nominativ:
    instruction: "Match each German word or phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "Der Kunde, der jeden Tag Kaffee bestellt, heißt Herr Braun.", right: "The customer who orders coffee every day is called Mr. Braun."}
          - {left: "Die Kollegin, die im Büro arbeitet, heißt Frau Klein.", right: "The colleague who works in the office is called Mrs. Klein."}
          - {left: "der Kunde", right: "the customer"}
          - {left: "bestellen", right: "to order"}
          - {left: "jeden Tag", right: "every day"}
          - {left: "heißen", right: "to be called"}
        status: "correct"
    feedback: "These pieces build two nominative relative-clause descriptions."
  de.b1.unit53.lesson01.exercise05.order_anna_kunde_braun: {instruction: "Put the words in order to say \"The customer who orders coffee every day is called Mr. Braun.\"", accepted_answers: [{value: ["Der", "Kunde,", "der", "jeden", "Tag", "Kaffee", "bestellt,", "heißt", "Herr", "Braun."], status: "correct"}], feedback: "The correct order is *Der Kunde, der jeden Tag Kaffee bestellt, heißt Herr Braun.*"}
  de.b1.unit53.lesson01.exercise06.write_anna_kunde_braun:
    instruction: "As Anna, combine these two facts about Mr. Braun into one sentence with a relative clause, exactly with Der Kunde, der ..., heißt Herr Braun.: he's the customer; he orders coffee every day."
    accepted_answers:
      - {value: "Der Kunde, der jeden Tag Kaffee bestellt, heißt Herr Braun.", status: "correct"}
      - {value: "Der Kunde, der jeden Tag Kaffee bestellt, heißt Herr Braun", status: "correct"}
      - {value: "Der Kunde der jeden Tag Kaffee bestellt heißt Herr Braun.", status: "correct"}
      - {value: "Der Kunde der jeden Tag Kaffee bestellt heißt Herr Braun", status: "correct"}
    feedback: "The model answer is *Der Kunde, der jeden Tag Kaffee bestellt, heißt Herr Braun.*"
  de.b1.unit53.lesson02.exercise01.recognize_felix_cafe_beliebt: {instruction: "Which German sentence means \"The cafe that Anna runs is very popular.\"?", correct_option: "Das Café, das Anna führt, ist sehr beliebt.", distractors: ["Das Café, das Felix führt, ist sehr beliebt.", "Der Kunde, den Anna führt, ist sehr beliebt.", "Das Café, das Anna führt, ist nicht beliebt."], accepted_answers: [{value: "Das Café, das Anna führt, ist sehr beliebt.", status: "correct"}], feedback: "*Das Café, das ...* agrees with the neuter das Café."}
  de.b1.unit53.lesson02.exercise02.recognize_anna_tisch_reserviert: {instruction: "Which German sentence means \"The table we're sitting at is reserved.\"?", correct_option: "Der Tisch, an dem wir sitzen, ist reserviert.", distractors: ["Der Tisch, an dem wir sitzen, ist frei.", "Der Stuhl, an dem wir sitzen, ist reserviert.", "Der Tisch, auf dem wir sitzen, ist reserviert."], accepted_answers: [{value: "Der Tisch, an dem wir sitzen, ist reserviert.", status: "correct"}], feedback: "*an dem* combines the preposition an with the dative relative pronoun dem."}
  de.b1.unit53.lesson02.exercise03.listen_select_tisch_reserviert: {instruction: "Listen. What is true about the table they're sitting at?", correct_option: "It's reserved.", distractors: ["It's free.", "It's very popular.", "It belongs to Mr. Braun."], accepted_answers: [{value: "It's reserved.", status: "correct"}], feedback: "The recording says *Der Tisch, an dem wir sitzen, ist reserviert*."}
  de.b1.unit53.lesson02.exercise04.match_relativsatz_praeposition:
    instruction: "Match each German word or phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "Das Café, das Anna führt, ist sehr beliebt.", right: "The cafe that Anna runs is very popular."}
          - {left: "Der Tisch, an dem wir sitzen, ist reserviert.", right: "The table we're sitting at is reserved."}
          - {left: "führen", right: "to run / manage"}
          - {left: "beliebt", right: "popular"}
          - {left: "reserviert", right: "reserved"}
          - {left: "der Tisch", right: "the table"}
        status: "correct"
    feedback: "These pieces build a neuter relative clause and a preposition-plus-dative relative clause."
  de.b1.unit53.lesson02.exercise05.order_anna_tisch_reserviert: {instruction: "Put the words in order to say \"The table we're sitting at is reserved.\"", accepted_answers: [{value: ["Der", "Tisch,", "an", "dem", "wir", "sitzen,", "ist", "reserviert."], status: "correct"}], feedback: "The correct order is *Der Tisch, an dem wir sitzen, ist reserviert.*"}
  de.b1.unit53.lesson02.exercise06.write_anna_tisch_reserviert:
    instruction: "As Anna, combine these two facts about the table into one sentence with a relative clause using the preposition an + dem, exactly with Der Tisch, an dem ..., ist reserviert.: it's the table; we're sitting at it."
    accepted_answers:
      - {value: "Der Tisch, an dem wir sitzen, ist reserviert.", status: "correct"}
      - {value: "Der Tisch, an dem wir sitzen, ist reserviert", status: "correct"}
      - {value: "Der Tisch an dem wir sitzen ist reserviert.", status: "correct"}
      - {value: "Der Tisch an dem wir sitzen ist reserviert", status: "correct"}
    feedback: "The model answer is *Der Tisch, an dem wir sitzen, ist reserviert.*"
  de.b1.unit53.lesson03.exercise01.choose_felix_wer_ist_der_mann: {instruction: "What does Felix ask about?", correct_option: "Who the man by the window is.", distractors: ["Who owns the cafe.", "What time the cafe closes.", "Who the colleague in the office is."], accepted_answers: [{value: "Who the man by the window is.", status: "correct"}], feedback: "Felix asks *Wer ist der Mann am Fenster?*"}
  de.b1.unit53.lesson03.exercise02.choose_anna_identify_braun: {instruction: "How does Anna identify the man, using a relative clause?", correct_option: "By combining that he's the customer and that he orders coffee every day.", distractors: ["By combining that he's the colleague and that he works in the office.", "By combining that he's the customer and that he never orders anything.", "By saying only his name, without a relative clause."], accepted_answers: [{value: "By combining that he's the customer and that he orders coffee every day.", status: "correct"}], feedback: "Anna says *Der Kunde, der jeden Tag Kaffee bestellt, heißt Herr Braun*."}
  de.b1.unit53.lesson03.exercise03.listen_dialogue_beschreibungen: {instruction: "Listen to the dialogue. What is special about Herr Braun's table?", correct_option: "It's his favorite spot.", distractors: ["It's reserved for someone else.", "It's the table Felix usually sits at.", "It's a new table in the cafe."], accepted_answers: [{value: "It's his favorite spot.", status: "correct"}], feedback: "Anna says *Der Tisch, an dem er sitzt, ist sein Lieblingsplatz*."}
  de.b1.unit53.lesson03.exercise04.match_dialogue_beschreibungen:
    instruction: "Match each German word or phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "Wer ist der Mann am Fenster?", right: "Who's the man by the window?"}
          - {left: "Der Tisch, an dem er sitzt, ist sein Lieblingsplatz.", right: "The table he's sitting at is his favorite spot."}
          - {left: "das Fenster", right: "the window"}
          - {left: "der Lieblingsplatz", right: "the favorite spot"}
          - {left: "sitzen", right: "to sit"}
          - {left: "der Mann", right: "the man"}
        status: "correct"
    feedback: "These pieces support the identifying-description exchange."
  de.b1.unit53.lesson03.exercise05.order_felix_wer_ist_der_mann: {instruction: "Put the words in order to say \"Who's the man by the window?\"", accepted_answers: [{value: ["Wer", "ist", "der", "Mann", "am", "Fenster?"], status: "correct"}], feedback: "The correct order is *Wer ist der Mann am Fenster?*"}
  de.b1.unit53.lesson03.exercise06.write_full_descriptions:
    instruction: "Write two sentences, each combining two facts with a relative clause: (1) about Herr Braun using der ... der ... (nominative, agreeing with der Kunde): he's the customer; he orders coffee every day; (2) about his table using an dem (preposition + dative, agreeing with der Tisch): it's the table; he's sitting at it, and it's his favorite spot."
    accepted_answers:
      - {value: "Der Kunde, der jeden Tag Kaffee bestellt, heißt Herr Braun. Der Tisch, an dem er sitzt, ist sein Lieblingsplatz.", status: "correct"}
      - {value: "Der Kunde, der jeden Tag Kaffee bestellt, heißt Herr Braun. Der Tisch, an dem er sitzt, ist sein Lieblingsplatz", status: "correct"}
      - {value: "Der Kunde der jeden Tag Kaffee bestellt heißt Herr Braun. Der Tisch an dem er sitzt ist sein Lieblingsplatz.", status: "correct"}
      - {value: "Der Kunde der jeden Tag Kaffee bestellt heißt Herr Braun. Der Tisch an dem er sitzt ist sein Lieblingsplatz", status: "correct"}
    feedback: "A complete answer describes Mr. Braun, then his table: *Der Kunde, der jeden Tag Kaffee bestellt, heißt Herr Braun. Der Tisch, an dem er sitzt, ist sein Lieblingsplatz.*"
