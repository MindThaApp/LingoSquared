  de.b1.unit53.lesson02.relativsatz_praeposition: {title: "Relative clause with a preposition: at which"}
  de.b1.unit53.lesson03.cafe_dialogue: {title: "Dialogue: The man by the window"}

teaching:
  de.b1.unit53.lesson01.teach.anna_kunde_braun: {title: "Anna describes a customer", gloss: "Anna: The customer who orders coffee every day is called Mr. Braun.", note: "*Der Kunde, der ...* uses the nominative masculine relative pronoun der, agreeing with der Kunde, to combine two facts into one sentence; *bestellt* is from *bestellen* (to order) and goes to the end of the relative clause.", example_gloss: "Description: The customer who orders coffee every day is called Mr. Braun."}
  de.b1.unit53.lesson01.teach.felix_kollegin_klein: {title: "Felix describes a colleague", gloss: "Felix: The colleague who works in the office is called Ms. Vogel.", note: "*Die Kollegin, die ...* uses the nominative feminine relative pronoun die, agreeing with die Kollegin.", example_gloss: "Description: The colleague who works in the office is called Ms. Vogel."}
  de.b1.unit53.lesson02.teach.felix_cafe_beliebt: {title: "Felix describes the cafe", gloss: "Felix: The cafe where Anna works is very popular.", note: "*Das Café, in dem ...* combines the preposition in with the dative relative pronoun dem, agreeing with the neuter das Café: Anna works *in dem Café*, so the relative clause opens with *in dem*.", example_gloss: "Description: The cafe where Anna works is very popular."}
  de.b1.unit53.lesson02.teach.anna_tisch_reserviert: {title: "Anna describes the table", gloss: "Anna: The table we're sitting at is reserved.", note: "*Der Tisch, an dem ...* combines the preposition an with the dative relative pronoun dem, agreeing with der Tisch.", example_gloss: "Description: The table we're sitting at is reserved."}
  de.b1.unit53.lesson03.teach.felix_wer_ist_der_mann: {title: "Felix asks about a man", gloss: "Felix: Who's the man by the window?", note: "*Wer ist ...?* asks who someone is; *am Fenster* (an + dem) means 'by the window'."}
  de.b1.unit53.lesson03.teach.anna_identify_braun: {title: "Anna identifies him with a relative clause", gloss: "Anna: The customer who orders coffee every day is called Mr. Braun.", note: "Anna answers with a nominative relative clause: *der* agrees with *der Kunde* and is the subject of *bestellt*, which goes to the end of the clause."}
  de.b1.unit53.lesson03.teach.felix_ask_tisch: {title: "Felix asks about the table", gloss: "Felix: And the table he's sitting at?", note: "*Und ...?* is a short follow-up question; *an dem er sitzt* is a relative clause with the preposition an + the dative dem."}
  de.b1.unit53.lesson03.teach.anna_lieblingsplatz: {title: "Anna describes the table", gloss: "Anna: The table he's sitting at is his favorite spot.", note: "*Der Tisch, an dem er sitzt, ...*: an + the dative dem agrees with der Tisch, and the verb *sitzt* goes to the end of the relative clause."}

