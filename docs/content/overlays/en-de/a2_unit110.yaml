review: {"status": "unreviewed", "required_next_reviewer": "native_speaker_review", "notes": "English overlay for the sequencing unit (bevor, nachdem, wenn against als, zuerst / dann / danach). OPEN NATIVE QUESTIONS: none beyond the realization notes."}
course:
  title: "German A2"
  description: "Grammar-led A2 German continuing the Anna and Felix storyline."
  learning_goal: "Give reasons, order events, say what things are for, talk about real conditions, ask indirect questions and pass on messages in German."
units:
  de.a2.unit110.zeitfolge: {"title": "First This, Then That", "description": "Put events in order with bevor, nachdem, wenn, als and words like zuerst, dann and danach."}
lessons:
  de.a2.unit110.lesson01.bevor: {"title": "Before I Have Breakfast"}
  de.a2.unit110.lesson02.nachdem: {"title": "After I Have Had Breakfast"}
  de.a2.unit110.lesson03.wenn_als: {"title": "Wenn or Als"}
  de.a2.unit110.lesson04.zuerst_dann: {"title": "First, Then, Afterwards"}
  de.a2.unit110.lesson05.reisetag: {"title": "Jonas Travels to Hamburg"}
  de.a2.unit110.lesson06.morgenplan: {"title": "Felix Plans the Morning"}
teaching:
  de.a2.unit110.lesson01.teach.bevor: {"title": "Before", "gloss": "before / to shower / to have breakfast / to drink coffee / to go to work", "example_gloss": ["I shower before I have breakfast.", "Felix drinks coffee before he drives to work.", "Before Anna goes to work, she has breakfast.", "Nina calls before she comes."], "note": "*Bevor* introduces the event that happens later."}
  de.a2.unit110.lesson01.teach.gn_bevor: {"title": "Bevor and the later event", "gloss": "I shower before I have breakfast.", "note": "The *bevor* clause names the second event. The verb goes to the end: *bevor ich frühstücke*."}
  de.a2.unit110.lesson01.teach.gn_vorn: {"title": "Bevor clause first", "gloss": "Before Anna goes to work, she has breakfast.", "note": "If the *bevor* clause starts the sentence, the main verb follows right after the comma: *..., frühstückt sie*."}
  de.a2.unit110.lesson01.teach.gn_trennbar: {"title": "Separable verbs", "gloss": "I read before I get up. Nina calls before she comes.", "note": "In a *bevor* clause a separable verb is one word (*aufstehe*). In the main clause it is split (*ruft ... an*)."}
  de.a2.unit110.lesson02.teach.nachdem: {"title": "After", "gloss": "after / had breakfast / eaten / seen / drunk", "example_gloss": ["After I have had breakfast, I go to work.", "Felix goes to bed after he has seen the film.", "After Nina has eaten, she calls Anna.", "Jonas reads the newspaper after he has drunk coffee."], "note": "*Nachdem* introduces the event that happened first."}
  de.a2.unit110.lesson02.teach.gn_nachdem: {"title": "Nachdem and the earlier event", "gloss": "After I have had breakfast, I go to work.", "note": "The *nachdem* clause names the first event and uses the perfect. The main clause can stay in the present."}
  de.a2.unit110.lesson02.teach.gn_hilfsverb: {"title": "Auxiliary last", "gloss": "Felix goes to bed after he has seen the film.", "note": "In the perfect the participle comes first and the auxiliary last: *gesehen hat*."}
  de.a2.unit110.lesson02.teach.gn_vergleich: {"title": "Bevor against nachdem", "gloss": "I shower before I have breakfast. I have breakfast after I have showered.", "note": "Same order of events, two ways to say it. *Bevor* goes with the later event, *nachdem* with the earlier one."}
  de.a2.unit110.lesson03.teach.wenn: {"title": "When", "gloss": "when, if / when (once in the past) / always / to rain / tired / to cook", "example_gloss": ["When it rains, I stay at home.", "Whenever I'm tired, I drink coffee.", "When I came home, Nina was cooking.", "When Felix comes, we cook."], "note": "German has two words for 'when': *wenn* and *als*."}
  de.a2.unit110.lesson03.teach.gn_wenn: {"title": "Wenn: repeated or future", "gloss": "When it rains, I stay at home. Whenever I'm tired, I drink coffee.", "note": "Use *wenn* for something that happens again and again, or that has not happened yet."}
  de.a2.unit110.lesson03.teach.gn_als: {"title": "Als: one time in the past", "gloss": "When I came home, Nina was cooking.", "note": "Use *als* for one event that happened once in the past."}
  de.a2.unit110.lesson03.teach.gn_unterschied: {"title": "The difference", "gloss": "When Felix comes, we cook. When Felix came yesterday, we cooked.", "note": "Same verb, two words: future or habit is *wenn*, a single past event is *als*. Both send the verb to the end."}
  de.a2.unit110.lesson04.teach.folge: {"title": "Order words", "gloss": "first / then / afterwards / at the end / supermarket", "example_gloss": ["First I have breakfast. Then I go to work.", "Afterwards I shop at the supermarket.", "At the end I call Anna.", "First Felix takes the bus, then he walks."], "note": "These words give the steps of a day, a trip or a recipe."}
  de.a2.unit110.lesson04.teach.gn_folge: {"title": "Verb second after the order word", "gloss": "First I have breakfast. Then I go to work. Afterwards I go shopping.", "note": "*Zuerst*, *dann* and *danach* take the first position, so the verb comes second and the subject after it."}
  de.a2.unit110.lesson04.teach.gn_schluss: {"title": "Zum Schluss", "gloss": "At the end I call Anna.", "note": "*Zum Schluss* closes a list of steps. The verb is again in second place; a separable verb is split (*rufe ... an*)."}
  de.a2.unit110.lesson04.teach.gn_mischen: {"title": "Mixing both tools", "gloss": "First I shower. Afterwards I have breakfast before I go to work.", "note": "Use order words for the big steps and *bevor* or *nachdem* inside a step."}
  de.a2.unit110.lesson05.teach.reise: {"title": "Travel words", "gloss": "station / ticket / train / Hamburg / bag", "example_gloss": ["Jonas is travelling to Hamburg.", "He buys a ticket at the station.", "The train is coming.", "He packs his bag."], "note": "Words for the travel story you will read."}
  de.a2.unit110.lesson05.teach.gn_text: {"title": "Bevor and nachdem in a text", "gloss": "Before he leaves the house, he drinks coffee. After he has arrived, he buys a ticket.", "note": "Look for the order of events: *bevor* marks the later step, *nachdem* the earlier one."}
  de.a2.unit110.lesson05.teach.lesen_reise: {"title": "Jonas's travel day", "gloss": "Today Jonas is travelling to Hamburg. First he packs his bag. Before he leaves the house, he drinks coffee. After he has arrived at the station, he buys a ticket. When the train comes, he gets on. Afterwards he reads a book. In Hamburg, Anna is already waiting.", "note": "The steps of the day: first, before, after, when, afterwards."}
  de.a2.unit110.lesson06.teach.anna_frage: {"title": "Anna asks", "gloss": "Anna: What are you doing tomorrow morning?"}
  de.a2.unit110.lesson06.teach.felix_zuerst: {"title": "Felix answers", "gloss": "Felix: First I shower, then I have breakfast."}
  de.a2.unit110.lesson06.teach.anna_bevor: {"title": "Anna asks more", "gloss": "Anna: And before you go to work?"}
  de.a2.unit110.lesson06.teach.felix_anrufen: {"title": "Felix promises", "gloss": "Felix: Before I leave, I'll call you."}
  de.a2.unit110.lesson06.teach.anna_nachdem: {"title": "Anna asks again", "gloss": "Anna: Great! And after you have worked?"}
  de.a2.unit110.lesson06.teach.felix_einkaufen: {"title": "Felix goes on", "gloss": "Felix: After I have worked, I go shopping."}
  de.a2.unit110.lesson06.teach.anna_vorbei: {"title": "Anna decides", "gloss": "Anna: Good. When you are done, I'll come by."}
exercises:
  de.a2.unit110.lesson01.exercise01.wahl_dusche: {"instruction": "Choose the correct German sentence.", "correct_option": "Ich dusche, bevor ich frühstücke.", "distractors": ["Ich frühstücke, bevor ich dusche.", "Ich dusche, bevor frühstücke ich.", "Ich dusche, bevor ich zur Arbeit gehe."], "accepted_answers": [{"value": "Ich dusche, bevor ich frühstücke.", "status": "correct"}], "feedback": "First the shower, then breakfast."}
  de.a2.unit110.lesson01.exercise02.wahl_kaffee: {"instruction": "Choose the correct German sentence.", "correct_option": "Felix trinkt Kaffee, bevor er zur Arbeit fährt.", "distractors": ["Felix trinkt Kaffee, bevor fährt er zur Arbeit.", "Felix fährt zur Arbeit, bevor er Kaffee trinkt.", "Felix trinkt Kaffee, bevor er fährt zur Arbeit."], "accepted_answers": [{"value": "Felix trinkt Kaffee, bevor er zur Arbeit fährt.", "status": "correct"}], "feedback": "The verb *fährt* goes to the end."}
  de.a2.unit110.lesson01.exercise03.paare_bevor: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Ich dusche, bevor ich frühstücke.", "right": "I shower before I have breakfast."}, {"left": "Felix trinkt Kaffee, bevor er zur Arbeit fährt.", "right": "Felix drinks coffee before he drives to work."}, {"left": "Bevor Anna zur Arbeit geht, frühstückt sie.", "right": "Before Anna goes to work, she has breakfast."}, {"left": "Nina ruft an, bevor sie kommt.", "right": "Nina calls before she comes."}, {"left": "Ich lese, bevor ich aufstehe.", "right": "I read before I get up."}, {"left": "bevor ich frühstücke", "right": "before I have breakfast"}], "status": "correct"}], "feedback": "Sentences with bevor."}
  de.a2.unit110.lesson01.exercise04.ordnen_bevor: {"instruction": "Put the words in order to say 'Before Anna goes to work, she has breakfast.'", "correct_option": "Bevor Anna zur Arbeit geht frühstückt sie", "accepted_answers": [{"value": "Bevor Anna zur Arbeit geht frühstückt sie", "status": "correct"}], "feedback": "After the *bevor* clause comes the verb."}
  de.a2.unit110.lesson01.exercise05.luecke_kommt: {"instruction": "Complete with the verb.", "correct_option": "kommt", "accepted_answers": [{"value": "kommt", "status": "correct"}], "feedback": "The verb stands last."}
  de.a2.unit110.lesson01.exercise06.uebersetzen_anna: {"instruction": "Translate into German.", "accepted_answers": [{"value": "Anna frühstückt, bevor sie zur Arbeit geht.", "status": "correct"}, {"value": "Anna fruehstueckt, bevor sie zur Arbeit geht.", "status": "correct"}, {"value": "Anna frühstückt bevor sie zur Arbeit geht.", "status": "correct"}, {"value": "Anna fruehstueckt bevor sie zur Arbeit geht.", "status": "correct"}, {"value": "Bevor Anna zur Arbeit geht, frühstückt sie.", "status": "correct"}, {"value": "Bevor Anna zur Arbeit geht, fruehstueckt sie.", "status": "correct"}, {"value": "Bevor Anna zur Arbeit geht frühstückt sie.", "status": "correct"}, {"value": "Bevor Anna zur Arbeit geht fruehstueckt sie.", "status": "correct"}], "feedback": "*Bevor sie zur Arbeit geht*."}
  de.a2.unit110.lesson01.exercise07.schreiben_lesen: {"instruction": "Write the requested German sentence.", "accepted_answers": [{"value": "Ich lese, bevor ich aufstehe.", "status": "correct"}, {"value": "Ich lese bevor ich aufstehe.", "status": "correct"}, {"value": "Bevor ich aufstehe, lese ich.", "status": "correct"}, {"value": "Bevor ich aufstehe lese ich.", "status": "correct"}], "feedback": "*Aufstehe* is one word here.", "correct_option": "Ich lese, bevor ich aufstehe."}
  de.a2.unit110.lesson02.exercise01.wahl_nachdem: {"instruction": "Choose the correct German sentence.", "correct_option": "Nachdem ich gefrühstückt habe, gehe ich zur Arbeit.", "distractors": ["Nachdem ich gefrühstückt habe, ich gehe zur Arbeit.", "Nachdem ich habe gefrühstückt, gehe ich zur Arbeit.", "Nachdem ich gefrühstückt habe, zur Arbeit gehe ich."], "accepted_answers": [{"value": "Nachdem ich gefrühstückt habe, gehe ich zur Arbeit.", "status": "correct"}], "feedback": "Participle plus *habe* at the end of the clause, then the main verb."}
  de.a2.unit110.lesson02.exercise02.wahl_film: {"instruction": "Choose the correct German sentence.", "correct_option": "Felix geht ins Bett, nachdem er den Film gesehen hat.", "distractors": ["Felix geht ins Bett, nachdem er hat den Film gesehen.", "Felix geht ins Bett, nachdem er den Film hat gesehen.", "Felix geht ins Bett, nachdem er gesehen den Film hat."], "accepted_answers": [{"value": "Felix geht ins Bett, nachdem er den Film gesehen hat.", "status": "correct"}], "feedback": "*Gesehen hat* last."}
  de.a2.unit110.lesson02.exercise03.paare_nachdem: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Nachdem ich gefrühstückt habe, gehe ich zur Arbeit.", "right": "After I have had breakfast, I go to work."}, {"left": "Felix geht ins Bett, nachdem er den Film gesehen hat.", "right": "Felix goes to bed after he has seen the film."}, {"left": "Nachdem Nina gegessen hat, ruft sie Anna an.", "right": "After Nina has eaten, she calls Anna."}, {"left": "Jonas liest die Zeitung, nachdem er Kaffee getrunken hat.", "right": "Jonas reads the newspaper after he has drunk coffee."}, {"left": "Ich frühstücke, nachdem ich geduscht habe.", "right": "I have breakfast after I have showered."}, {"left": "nachdem ich gefrühstückt habe", "right": "after I have had breakfast"}], "status": "correct"}], "feedback": "Sentences with nachdem."}
  de.a2.unit110.lesson02.exercise04.ordnen_zeitung: {"instruction": "Put the words in order to say 'Jonas reads the newspaper after he has drunk coffee.'", "correct_option": "Jonas liest die Zeitung nachdem er Kaffee getrunken hat", "accepted_answers": [{"value": "Jonas liest die Zeitung nachdem er Kaffee getrunken hat", "status": "correct"}], "feedback": "*Getrunken hat* last."}
  de.a2.unit110.lesson02.exercise05.luecke_hat: {"instruction": "Complete with the auxiliary.", "correct_option": "hat", "accepted_answers": [{"value": "hat", "status": "correct"}], "feedback": "The auxiliary stands at the end of the clause."}
  de.a2.unit110.lesson02.exercise06.uebersetzen_arbeit: {"instruction": "Translate into German.", "accepted_answers": [{"value": "Nachdem ich gefrühstückt habe, gehe ich zur Arbeit.", "status": "correct"}, {"value": "Nachdem ich gefruehstueckt habe, gehe ich zur Arbeit.", "status": "correct"}, {"value": "Nachdem ich gefrühstückt habe gehe ich zur Arbeit.", "status": "correct"}, {"value": "Nachdem ich gefruehstueckt habe gehe ich zur Arbeit.", "status": "correct"}, {"value": "Ich gehe zur Arbeit, nachdem ich gefrühstückt habe.", "status": "correct"}, {"value": "Ich gehe zur Arbeit, nachdem ich gefruehstueckt habe.", "status": "correct"}, {"value": "Ich gehe zur Arbeit nachdem ich gefrühstückt habe.", "status": "correct"}, {"value": "Ich gehe zur Arbeit nachdem ich gefruehstueckt habe.", "status": "correct"}], "feedback": "Perfect in the *nachdem* clause."}
  de.a2.unit110.lesson02.exercise07.schreiben_geduscht: {"instruction": "Write the requested German sentence.", "accepted_answers": [{"value": "Ich frühstücke, nachdem ich geduscht habe.", "status": "correct"}, {"value": "Ich fruehstuecke, nachdem ich geduscht habe.", "status": "correct"}, {"value": "Ich frühstücke nachdem ich geduscht habe.", "status": "correct"}, {"value": "Ich fruehstuecke nachdem ich geduscht habe.", "status": "correct"}, {"value": "Nachdem ich geduscht habe, frühstücke ich.", "status": "correct"}, {"value": "Nachdem ich geduscht habe, fruehstuecke ich.", "status": "correct"}, {"value": "Nachdem ich geduscht habe frühstücke ich.", "status": "correct"}, {"value": "Nachdem ich geduscht habe fruehstuecke ich.", "status": "correct"}], "feedback": "*Geduscht habe* last.", "correct_option": "Ich frühstücke, nachdem ich geduscht habe."}
  de.a2.unit110.lesson03.exercise01.wahl_wenn: {"instruction": "Choose the correct German sentence.", "correct_option": "Wenn es regnet, bleibe ich zu Hause.", "distractors": ["Als es regnet, bleibe ich zu Hause.", "Wenn es regnet, ich bleibe zu Hause.", "Wenn es regnet bleibe, ich zu Hause."], "accepted_answers": [{"value": "Wenn es regnet, bleibe ich zu Hause.", "status": "correct"}], "feedback": "Habit: *wenn*, then the verb right after the comma."}
  de.a2.unit110.lesson03.exercise02.wahl_als: {"instruction": "Choose the correct German sentence.", "correct_option": "Als ich nach Hause kam, hat Nina gekocht.", "distractors": ["Wenn ich nach Hause kam, hat Nina gekocht.", "Als ich nach Hause kam, Nina hat gekocht.", "Als ich kam nach Hause, hat Nina gekocht."], "accepted_answers": [{"value": "Als ich nach Hause kam, hat Nina gekocht.", "status": "correct"}], "feedback": "One time in the past: *als*."}
  de.a2.unit110.lesson03.exercise03.paare_wenn: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Wenn es regnet, bleibe ich zu Hause.", "right": "When it rains, I stay at home."}, {"left": "Immer wenn ich müde bin, trinke ich Kaffee.", "right": "Whenever I'm tired, I drink coffee."}, {"left": "Als ich nach Hause kam, hat Nina gekocht.", "right": "When I came home, Nina was cooking."}, {"left": "Wenn Felix kommt, kochen wir.", "right": "When Felix comes, we cook."}, {"left": "Als Felix gestern kam, haben wir gekocht.", "right": "When Felix came yesterday, we cooked."}, {"left": "wenn es regnet", "right": "when it rains"}], "status": "correct"}], "feedback": "Wenn and als."}
  de.a2.unit110.lesson03.exercise04.ordnen_immer: {"instruction": "Put the words in order to say 'Whenever I'm tired, I drink coffee.'", "correct_option": "Immer wenn ich müde bin trinke ich Kaffee", "accepted_answers": [{"value": "Immer wenn ich müde bin trinke ich Kaffee", "status": "correct"}], "feedback": "*Bin* ends the clause, then *trinke ich*."}
  de.a2.unit110.lesson03.exercise05.luecke_wenn: {"instruction": "Complete with the German word for 'when' that fits a situation that repeats.", "correct_option": "Wenn", "accepted_answers": [{"value": "Wenn", "status": "correct"}], "feedback": "Rain is a repeated situation, so *wenn*."}
  de.a2.unit110.lesson03.exercise06.uebersetzen_kochen: {"instruction": "Translate into German.", "accepted_answers": [{"value": "Wenn Felix kommt, kochen wir.", "status": "correct"}, {"value": "Wenn Felix kommt kochen wir.", "status": "correct"}, {"value": "Wir kochen, wenn Felix kommt.", "status": "correct"}, {"value": "Wir kochen wenn Felix kommt.", "status": "correct"}], "feedback": "Future: *wenn*."}
  de.a2.unit110.lesson03.exercise07.schreiben_als: {"instruction": "Write the requested German sentence.", "accepted_answers": [{"value": "Als ich nach Hause kam, hat Nina gekocht.", "status": "correct"}, {"value": "Als ich nach Hause kam hat Nina gekocht.", "status": "correct"}, {"value": "Nina hat gekocht, als ich nach Hause kam.", "status": "correct"}, {"value": "Nina hat gekocht als ich nach Hause kam.", "status": "correct"}], "feedback": "One past event: *als*.", "correct_option": "Als ich nach Hause kam, hat Nina gekocht."}
  de.a2.unit110.lesson04.exercise01.wahl_zuerst: {"instruction": "Choose the correct German sentence.", "correct_option": "Zuerst frühstücke ich. Dann gehe ich zur Arbeit.", "distractors": ["Zuerst ich frühstücke. Dann gehe ich zur Arbeit.", "Zuerst frühstücke ich. Dann ich gehe zur Arbeit.", "Zuerst frühstücke ich. Dann zur Arbeit gehe ich."], "accepted_answers": [{"value": "Zuerst frühstücke ich. Dann gehe ich zur Arbeit.", "status": "correct"}], "feedback": "Verb second: *Dann gehe ich*."}
  de.a2.unit110.lesson04.exercise02.wahl_danach: {"instruction": "Choose the correct German sentence.", "correct_option": "Danach kaufe ich im Supermarkt ein.", "distractors": ["Danach ich kaufe im Supermarkt ein.", "Danach einkaufe ich im Supermarkt.", "Danach kaufe im Supermarkt ich ein."], "accepted_answers": [{"value": "Danach kaufe ich im Supermarkt ein.", "status": "correct"}], "feedback": "*Danach kaufe ich ... ein*."}
  de.a2.unit110.lesson04.exercise03.paare_folge: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Zuerst frühstücke ich.", "right": "First I have breakfast."}, {"left": "Dann gehe ich zur Arbeit.", "right": "Then I go to work."}, {"left": "Danach kaufe ich im Supermarkt ein.", "right": "Afterwards I shop at the supermarket."}, {"left": "Zum Schluss rufe ich Anna an.", "right": "At the end I call Anna."}, {"left": "Zuerst fährt Felix mit dem Bus, dann geht er zu Fuß.", "right": "First Felix takes the bus, then he walks."}, {"left": "Zuerst dusche ich.", "right": "First I shower."}], "status": "correct"}], "feedback": "The steps in order."}
  de.a2.unit110.lesson04.exercise04.ordnen_schluss: {"instruction": "Put the words in order to say 'At the end I call Anna.'", "correct_option": "Zum Schluss rufe ich Anna an", "accepted_answers": [{"value": "Zum Schluss rufe ich Anna an", "status": "correct"}], "feedback": "*Rufe ... an* is split."}
  de.a2.unit110.lesson04.exercise05.luecke_dann: {"instruction": "Complete with the order word.", "correct_option": "Dann", "accepted_answers": [{"value": "Dann", "status": "correct"}, {"value": "Danach", "status": "correct"}], "feedback": "*Dann* or *danach* gives the next step."}
  de.a2.unit110.lesson04.exercise06.uebersetzen_bus: {"instruction": "Translate into German.", "accepted_answers": [{"value": "Zuerst fährt Felix mit dem Bus, dann geht er zu Fuß.", "status": "correct"}, {"value": "Zuerst faehrt Felix mit dem Bus, dann geht er zu Fuss.", "status": "correct"}, {"value": "Zuerst fährt Felix mit dem Bus dann geht er zu Fuß.", "status": "correct"}, {"value": "Zuerst faehrt Felix mit dem Bus dann geht er zu Fuss.", "status": "correct"}, {"value": "Zuerst fährt Felix mit dem Bus, danach geht er zu Fuß.", "status": "correct"}, {"value": "Zuerst faehrt Felix mit dem Bus, danach geht er zu Fuss.", "status": "correct"}, {"value": "Zuerst fährt Felix mit dem Bus danach geht er zu Fuß.", "status": "correct"}, {"value": "Zuerst faehrt Felix mit dem Bus danach geht er zu Fuss.", "status": "correct"}, {"value": "Zuerst fährt Felix mit dem Bus. Dann geht er zu Fuß.", "status": "correct"}, {"value": "Zuerst faehrt Felix mit dem Bus. Dann geht er zu Fuss.", "status": "correct"}, {"value": "Felix fährt zuerst mit dem Bus, dann geht er zu Fuß.", "status": "correct"}, {"value": "Felix faehrt zuerst mit dem Bus, dann geht er zu Fuss.", "status": "correct"}, {"value": "Felix fährt zuerst mit dem Bus dann geht er zu Fuß.", "status": "correct"}, {"value": "Felix faehrt zuerst mit dem Bus dann geht er zu Fuss.", "status": "correct"}, {"value": "Felix fährt zuerst mit dem Bus, danach geht er zu Fuß.", "status": "correct"}, {"value": "Felix faehrt zuerst mit dem Bus, danach geht er zu Fuss.", "status": "correct"}, {"value": "Felix fährt zuerst mit dem Bus danach geht er zu Fuß.", "status": "correct"}, {"value": "Felix faehrt zuerst mit dem Bus danach geht er zu Fuss.", "status": "correct"}], "feedback": "Verb second after *zuerst* and after *dann*."}
  de.a2.unit110.lesson04.exercise07.schreiben_schluss: {"instruction": "Write the requested German sentence.", "accepted_answers": [{"value": "Zum Schluss rufe ich Anna an.", "status": "correct"}, {"value": "Ich rufe Anna zum Schluss an.", "status": "correct"}, {"value": "Ich rufe zum Schluss Anna an.", "status": "correct"}], "feedback": "*Zum Schluss rufe ich Anna an*.", "correct_option": "Zum Schluss rufe ich Anna an."}
  de.a2.unit110.lesson05.exercise01.lesen_kaffee: {"instruction": "Read the text and choose the answer.", "correct_option": "He drinks coffee.", "distractors": ["He buys a ticket.", "He reads a book.", "He calls Anna."], "accepted_answers": [{"value": "He drinks coffee.", "status": "correct"}], "feedback": "*Bevor er aus dem Haus geht, trinkt er Kaffee.*"}
  de.a2.unit110.lesson05.exercise02.lesen_fahrkarte: {"instruction": "Read the text and choose the answer.", "correct_option": "He buys a ticket.", "distractors": ["He packs his bag.", "He drinks coffee.", "He reads a book."], "accepted_answers": [{"value": "He buys a ticket.", "status": "correct"}], "feedback": "*Nachdem er am Bahnhof angekommen ist, kauft er eine Fahrkarte.*"}
