  de.a2.unit29.lesson01.exercise04.write_problem: {instruction: "Write exactly the taught two-sentence problem report with location, problem, item, and start time.", accepted_answers: [{value: "In meiner Wohnung gibt es ein Problem. Die Heizung funktioniert seit gestern nicht.", status: "correct"}, {value: "In meiner Wohnung gibt es ein Problem Die Heizung funktioniert seit gestern nicht", status: "correct"}], feedback: "The report states where the problem is and when it started."}
  de.a2.unit29.lesson02.exercise01.listen_repair: {instruction: "Listen and select the repair timing you hear.", correct_option: "tomorrow at nine", distractors: ["today at eight", "Friday afternoon", "Monday morning"], accepted_answers: [{value: "tomorrow at nine", status: "correct"}], feedback: "The audio says the repair worker comes tomorrow at nine."}
  de.a2.unit29.lesson02.exercise02.choose_timing: {instruction: "Which sentence gives the scheduled repair details?", correct_option: "Der Handwerker kommt morgen um neun Uhr.", distractors: ["Die Heizung funktioniert nicht.", "In meiner Wohnung gibt es ein Problem.", "Guten Tag."], accepted_answers: [{value: "Der Handwerker kommt morgen um neun Uhr.", status: "correct"}], feedback: "This sentence gives who comes and when."}
  de.a2.unit29.lesson02.exercise03.match_repair:
    instruction: "Match each repair word or phrase."
    accepted_answers: [{value: [{left: "Arbeit, die ein Problem behebt", right: "Reparatur"}, {left: "Person für die Reparatur", right: "Handwerker"}, {left: "Tag nach heute", right: "morgen"}, {left: "Zeit in der Meldung", right: "neun Uhr"}, {left: "Fragewort für Zeit", right: "Wann"}, {left: "unbestimmte Person", right: "jemand"}], status: "correct"}]
    feedback: "These words ask about and understand repair timing."
  de.a2.unit29.lesson02.exercise04.order_repair_question: {instruction: "Put the words in order for the repair timing question: 'When can someone come?'", accepted_answers: [{value: ["Wann", "kann", "jemand", "kommen"], status: "correct"}], feedback: "*Wann kann jemand kommen?* asks for timing."}
  de.a2.unit29.lesson02.exercise05.write_problem_report: {instruction: "Write the full formal maintenance message with greeting, apartment problem, heating issue since yesterday, repair timing question, and thanks exactly as taught.", accepted_answers: [{value: "Guten Tag. In meiner Wohnung gibt es ein Problem. Die Heizung funktioniert seit gestern nicht. Wann kann jemand für die Reparatur kommen? Vielen Dank.", status: "correct"}, {value: "Guten Tag In meiner Wohnung gibt es ein Problem Die Heizung funktioniert seit gestern nicht Wann kann jemand für die Reparatur kommen Vielen Dank", status: "correct"}], feedback: "The message reports the problem and asks when repair can happen."}
