review:
  status: unreviewed
  required_next_reviewer: fresh_context_reviewer
  notes: >-
    Overlay for German's sixth C1 unit, authored alongside the realization
    (no adaptable public-domain German C1 idiom source exists; see the
    realization provenance note). English speakers' real interference risks
    for this outcome: (1) the idiom-vs-literal distinction is taught first so
    the learner stops reading idioms word-for-word; (2) the fixed German
    verb-noun collocations (eine Frage stellen, einen Termin vereinbaren,
    einen Vortrag halten, Maßnahmen ergreifen) are each glossed against the
    English calque they replace (make a question / make an appointment / give
    a presentation / take measures); (3) the register contrast (informal Das
    ist nicht mein Bier vs. formal das faellt nicht in meinen
    Zustaendigkeitsbereich) is made explicit for English speakers who would
    not intuit which idioms belong in a Sie meeting; (4) the culminating
    writing prompts name the exact calque and the exact collocation so the
    rewrite has one well-determined answer. No sibling-direction file (de-en)
    was consulted.

course:
  title: German C1
  description: >-
    Advanced German: understand and use idiomatic, collocational, and
    figurative language naturally -- choosing register-appropriate idioms and
    avoiding literal calques, in formal register.

units:
  de.c1.unit06.nicht_woertlich_gemeint:
    title: "Not meant literally"
    description: "Understand and use idiomatic, collocational, and figurative German -- recognize an idiom's non-literal meaning, use fixed collocations instead of English calques, and choose idioms that fit formal Sie register."

lessons:
  de.c1.unit06.lesson01.woertlich_oder_uebertragen:
    title: "Literal or figurative"
  de.c1.unit06.lesson02.feste_wendungen:
    title: "Fixed collocations"
  de.c1.unit06.lesson03.bildhafte_sprache:
    title: "Figurative language"
  de.c1.unit06.lesson04.figurative_sprache_lesen:
    title: "Reading figurative language"
  de.c1.unit06.lesson05.idiomatisch_sprechen:
    title: "Speaking idiomatically"
  de.c1.unit06.lesson06.idiomatisch_schreiben:
    title: "Writing idiomatically"

teaching:
  de.c1.unit06.lesson01.teach.redewendung:
    title: "the idiom / turn of phrase"
    gloss: "the idiom / turn of phrase"
    note: "*Die Redewendung* = the idiom, a fixed expression whose meaning is not the sum of its words. German has many *Redewendungen* for everyday and workplace situations."
    example_gloss: "That is a well-known idiom."
  de.c1.unit06.lesson01.teach.woertlich:
    title: "literal (word for word)"
    gloss: "literal (word for word)"
    note: "*Wörtlich* = literally, word for word. An idiom taken *wörtlich* means something different from what it really says; the real meaning is *im übertragenen Sinne*."
    example_gloss: "Taken literally, the sentence sounds odd."
  de.c1.unit06.lesson01.teach.uebertragenen_sinne:
    title: "in the figurative sense"
    gloss: "in the figurative sense"
    note: "*Im übertragenen Sinne* = in the figurative (transferred) sense. This is the frame that marks a non-literal reading: *wörtlich* vs. *im übertragenen Sinne*."
  de.c1.unit06.lesson01.teach.den_nagel:
    title: "to hit the nail on the head"
    gloss: "to hit the nail on the head"
    note: "*Den Nagel auf den Kopf treffen* = to hit the nail on the head -- to say exactly the right thing. In a meeting it means a remark identified the key point precisely. *Treffen* is the verb; its Partizip II is *getroffen*."
    example_gloss: "You hit the nail on the head."
  de.c1.unit06.lesson01.teach.auf_den_punkt:
    title: "to get to the point / sum up precisely"
    gloss: "to get to the point / sum up precisely"
    note: "*Etwas auf den Punkt bringen* = to bring something to the point, to sum it up precisely. A formal-register way to praise a concise, accurate summary."
    example_gloss: "You summed up the problem precisely."
  de.c1.unit06.lesson01.teach.liegt_auf_der_hand:
    title: "it is obvious"
    gloss: "it is obvious"
    note: "*Etwas liegt auf der Hand* = it is obvious, it is plain to see. *Liegen* (to lie) here is figurative -- nothing actually lies on a hand."
    example_gloss: "The solution is obvious."

  de.c1.unit06.lesson02.teach.frage_stellen:
    title: "to ask a question"
    gloss: "to ask a question"
    note: "*Eine Frage stellen* = to ask a question. German uses *stellen* (to put/place), not *machen* -- *eine Frage machen* is a literal calque from English 'make a question' and is wrong."
    example_gloss: "May I ask you a question?"
  de.c1.unit06.lesson02.teach.termin_vereinbaren:
    title: "to schedule an appointment"
    gloss: "to schedule an appointment"
    note: "*Einen Termin vereinbaren* = to schedule an appointment. The fixed verb is *vereinbaren*, not *machen* -- *einen Termin machen* is a literal calque from English 'make an appointment'."
    example_gloss: "We need to schedule an appointment."
  de.c1.unit06.lesson02.teach.vortrag_halten:
    title: "to give a presentation"
    gloss: "to give a presentation"
    note: "*Einen Vortrag halten* = to give a presentation. German uses *halten* (to hold), not *geben* -- *einen Vortrag geben* is a literal calque from English 'give a presentation'."
    example_gloss: "Mr Weber is giving a presentation."
  de.c1.unit06.lesson02.teach.massnahmen_ergreifen:
    title: "to take measures"
    gloss: "to take measures"
    note: "*Maßnahmen ergreifen* = to take measures (formal). The fixed verb is *ergreifen*, not *nehmen* -- *Maßnahmen nehmen* is a literal calque from English 'take measures'."
    example_gloss: "We need to take appropriate measures."
  de.c1.unit06.lesson02.teach.kollokation_muster:
    title: "Fixed collocations"
    gloss: "One says 'eine Frage stellen', not 'eine Frage machen'."
    note: "German has fixed verb-noun pairings (collocations). English 'make/do/give/take' do not map one-to-one: *eine Frage stellen*, *einen Termin vereinbaren*, *einen Vortrag halten*, *Maßnahmen ergreifen*. Avoid literal calques."

  de.c1.unit06.lesson03.teach.steht_auf_dem_spiel:
    title: "something is at stake"
    gloss: "something is at stake"
    note: "*Etwas steht auf dem Spiel* = something is at stake -- it could be lost. A register-neutral figurative idiom, used in formal meetings too."
    example_gloss: "A lot is at stake in this project."
  de.c1.unit06.lesson03.teach.den_ausschlag:
    title: "to be the decisive factor"
    gloss: "to be the decisive factor"
    note: "*Den Ausschlag geben* = to tip the scales, to be the decisive factor. *Der Ausschlag* is the impulse that decides an outcome."
    example_gloss: "The price will be the decisive factor."
  de.c1.unit06.lesson03.teach.die_weichen:
    title: "to set the course (for the future)"
    gloss: "to set the course (for the future)"
    note: "*Die Weichen stellen* = to set the switches -- figuratively, to set the course for the future. A common business metaphor from the railways."
    example_gloss: "With this decision we are setting the course for the future."
  de.c1.unit06.lesson03.teach.im_auge:
    title: "to keep an eye on something"
    gloss: "to keep an eye on something"
    note: "*Etwas im Auge behalten* = to keep an eye on something, to keep watching it. *Behalten* here means 'keep'; in formal Sie address: *behalten Sie*."
    example_gloss: "Please keep an eye on the costs."
  de.c1.unit06.lesson03.teach.register_umgangssprache:
    title: "Informal idiom (avoid in formal register)"
    gloss: "That's not my problem (informal)."
    note: "*Das ist nicht mein Bier* = 'that's not my problem' -- a very colloquial idiom. It is natural in informal du-speech but too casual for a formal Sie meeting. In formal register, use the equivalent below."
  de.c1.unit06.lesson03.teach.register_formell:
    title: "The formal equivalent"
    gloss: "That does not fall within my area of responsibility."
    note: "*Das fällt nicht in meinen Zuständigkeitsbereich* = 'that does not fall within my area of responsibility'. The formal-Sie equivalent of *Das ist nicht mein Bier* -- appropriate in a business meeting."

  de.c1.unit06.lesson04.teach.lese_idiome:
    title: "A report in figurative language"
    gloss: "We face an important decision. A lot is at stake in the new project. So we must set the course correctly. Mr Weber's report hit the nail on the head. It is obvious that we must take measures. Mr Weber is giving a presentation next week."
    note: "This short report uses several idioms and collocations. Each figurative expression carries meaning and tone: *steht viel auf dem Spiel* signals urgency, *den Nagel auf den Kopf getroffen* praises the report's accuracy, *liegt auf der Hand* marks the conclusion as obvious."
  de.c1.unit06.lesson04.teach.lese_muster:
    title: "How figurative language works"
    gloss: "Figurative expressions carry the meaning and the tone of a text."
    note: "*Bildhafte Ausdrücke tragen die Bedeutung und den Ton eines Textes.* When you read, ask what each idiom adds: urgency, praise, caution, or emphasis."

  de.c1.unit06.lesson05.teach.spiel_weichen:
    title: "Combining two idioms"
    gloss: "A lot is at stake in this project, so we are setting the course for the future."
    note: "Two idioms in one sentence: *etwas steht auf dem Spiel* (urgency) + *die Weichen stellen* (the response). This is the speaking requirement -- describe a situation using two taught idioms."
  de.c1.unit06.lesson05.teach.nagel_massnahmen:
    title: "Another two-idiom combination"
    gloss: "You hit the nail on the head, and we are taking measures."
    note: "Two idioms: *den Nagel auf den Kopf treffen* (praise) + *Maßnahmen ergreifen* (the follow-up). Both work naturally in formal Sie."

  de.c1.unit06.lesson06.teach.vogel_uebersetzt:
    title: "Frau Vogel: Your report is good, but a few passages sound literally translated."
    gloss: "Your report is good, but a few passages sound literally translated."
    note: "Frau Vogel opens with the diagnosis: *ein paar Stellen klingen wörtlich übersetzt* -- some passages read as literal English calques."
  de.c1.unit06.lesson06.teach.felix_recht:
    title: "Felix: You are right. I wanted to phrase it more idiomatically."
    gloss: "You are right. I wanted to phrase it more idiomatically."
    note: "Felix accepts the feedback (*Da haben Sie recht*) and names the goal: *idiomatischer formulieren*."
  de.c1.unit06.lesson06.teach.vogel_nagel:
    title: "Frau Vogel: With this example you hit the nail on the head."
    gloss: "With this example you hit the nail on the head."
    note: "Frau Vogel praises Felix's example with the idiom *den Nagel auf den Kopf getroffen*."
  de.c1.unit06.lesson06.teach.felix_weichen:
    title: "Felix: Thank you. Then we are setting the course for the future."
    gloss: "Thank you. Then we are setting the course for the future."
    note: "Felix thanks her and closes with *die Weichen für die Zukunft stellen*."
  de.c1.unit06.lesson06.teach.kalque_muster:
    title: "Rewrite the calque"
    gloss: "Instead of a literal translation, use the fixed collocation."
    note: "*Statt einer wörtlichen Übersetzung nutzt man die feste Wendung.* When your German sounds like English, replace the literal calque with the fixed collocation you learned."

exercises:
  de.c1.unit06.lesson01.exercise01.recognize_woertlich:
    instruction: "What does wörtlich mean?"
    correct_option: "Literal -- word for word, the surface meaning."
    distractors: ["Figurative -- the transferred meaning.", "Loud and clear.", "Written by hand."]
    accepted_answers: [{value: "Literal -- word for word, the surface meaning.", status: correct}]
    feedback: "*Wörtlich* means the surface, word-for-word reading -- the opposite of *im übertragenen Sinne*."
  de.c1.unit06.lesson01.exercise02.listen_nagel:
    instruction: "Listen and select the meaning of the sentence."
    correct_option: "You hit the nail on the head."
    distractors: ["You missed the point.", "You hit your head.", "You made a literal mistake."]
    accepted_answers: [{value: "You hit the nail on the head.", status: correct}]
    feedback: "*Sie haben den Nagel auf den Kopf getroffen* = you said exactly the right thing -- an idiom, not about an actual nail."
  de.c1.unit06.lesson01.exercise03.match_idiome:
    instruction: "Match each German idiom to its meaning."
    accepted_answers:
      - value: {"die Redewendung": "the idiom / turn of phrase", "wörtlich": "literal (word for word)", "im übertragenen Sinne": "in the figurative sense", "den Nagel auf den Kopf treffen": "to hit the nail on the head", "etwas auf den Punkt bringen": "to get to the point / sum up precisely", "etwas liegt auf der Hand": "it is obvious"}
        status: correct
    feedback: "The idiom toolkit: the label (*die Redewendung*), the literal-vs-figurative contrast (*wörtlich* / *im übertragenen Sinne*), and three common idioms."
  de.c1.unit06.lesson01.exercise04.order_punkt:
    instruction: "Put the German words in order to form the sentence."
    accepted_answers:
      - {value: "Sie haben das Problem auf den Punkt gebracht", status: correct}
    feedback: "*Sie haben das Problem auf den Punkt gebracht* -- the idiom *auf den Punkt bringen* in the past (*gebracht*)."
  de.c1.unit06.lesson01.exercise05.translate_nagel:
    instruction: "Translate into German, using den Nagel auf den Kopf treffen: You hit the nail on the head."
    accepted_answers:
      - {value: "Sie haben den Nagel auf den Kopf getroffen", status: correct}
      - {value: "Sie haben den Nagel auf den Kopf getroffen.", status: correct}
    feedback: "*Sie haben den Nagel auf den Kopf getroffen* -- the idiom in a natural formal-Sie sentence."
  de.c1.unit06.lesson01.exercise06.speak_nagel:
    instruction: "Say aloud in German: You hit the nail on the head."
    accepted_answers:
      - {value: "Sie haben den Nagel auf den Kopf getroffen", status: correct}
      - {value: "Sie haben den Nagel auf den Kopf getroffen.", status: correct}
    feedback: "Spoken, the idiom *den Nagel auf den Kopf treffen* is a natural, warm piece of praise."
  de.c1.unit06.lesson01.exercise07.write_liegt:
    instruction: "Write in German, using etwas liegt auf der Hand: The solution is obvious."
    accepted_answers:
      - {value: "Die Lösung liegt auf der Hand", status: correct}
      - {value: "Die Lösung liegt auf der Hand.", status: correct}
      - {value: "Die Loesung liegt auf der Hand", status: correct}
      - {value: "Die Loesung liegt auf der Hand.", status: correct}
    feedback: "*Die Lösung liegt auf der Hand* -- the idiom *etwas liegt auf der Hand*."

  de.c1.unit06.lesson02.exercise01.recognize_stellen:
    instruction: "What does eine Frage stellen mean?"
    correct_option: "To ask a question."
    distractors: ["To make a question (a literal calque).", "To answer a question.", "To avoid a question."]
    accepted_answers: [{value: "To ask a question.", status: correct}]
    feedback: "*Eine Frage stellen* = to ask a question -- German uses *stellen*, never *eine Frage machen*."
  de.c1.unit06.lesson02.exercise02.listen_termin:
    instruction: "Listen and select the meaning of the sentence."
    correct_option: "We are scheduling an appointment with the management."
    distractors: ["We are cancelling an appointment.", "We are making a phone call.", "We are writing an email."]
    accepted_answers: [{value: "We are scheduling an appointment with the management.", status: correct}]
    feedback: "*Wir vereinbaren einen Termin mit der Geschäftsleitung* -- *einen Termin vereinbaren* is the fixed collocation."
  de.c1.unit06.lesson02.exercise03.match_kollokationen:
    instruction: "Match each German collocation to its meaning."
    accepted_answers:
      - value: {"eine Frage stellen": "to ask a question", "einen Termin vereinbaren": "to schedule an appointment", "einen Vortrag halten": "to give a presentation", "Maßnahmen ergreifen": "to take measures", "wörtlich": "literal (word for word)", "im übertragenen Sinne": "in the figurative sense"}
        status: correct
    feedback: "The fixed verb-noun collocations -- and a reminder of *wörtlich* / *im übertragenen Sinne* from the previous lesson."
  de.c1.unit06.lesson02.exercise04.order_termin:
    instruction: "Put the German words in order."
    accepted_answers:
      - {value: "Wir vereinbaren einen Termin", status: correct}
    feedback: "*Wir vereinbaren einen Termin* -- the collocation *einen Termin vereinbaren*."
  de.c1.unit06.lesson02.exercise05.translate_frage:
    instruction: "Translate into German, using eine Frage stellen: May I ask you a question?"
    accepted_answers:
      - {value: "Darf ich Ihnen eine Frage stellen", status: correct}
      - {value: "Darf ich Ihnen eine Frage stellen.", status: correct}
    feedback: "*Darf ich Ihnen eine Frage stellen?* -- the polite formal-Sie question with *eine Frage stellen*."
  de.c1.unit06.lesson02.exercise06.speak_vortrag:
    instruction: "Say aloud in German, using einen Vortrag halten: You are giving a presentation."
    accepted_answers:
      - {value: "Sie halten einen Vortrag", status: correct}
      - {value: "Sie halten einen Vortrag.", status: correct}
    feedback: "Spoken, *Sie halten einen Vortrag* -- *einen Vortrag halten*, not *geben*."
  de.c1.unit06.lesson02.exercise07.write_massnahmen:
    instruction: "Write in German, using Maßnahmen ergreifen: We are taking measures."
    accepted_answers:
      - {value: "Wir ergreifen Maßnahmen", status: correct}
      - {value: "Wir ergreifen Maßnahmen.", status: correct}
      - {value: "Wir ergreifen Massnahmen", status: correct}
      - {value: "Wir ergreifen Massnahmen.", status: correct}
    feedback: "*Wir ergreifen Maßnahmen* -- *Maßnahmen ergreifen*, not *Maßnahmen nehmen*."

  de.c1.unit06.lesson03.exercise01.recognize_spiel:
    instruction: "What does etwas steht auf dem Spiel mean?"
    correct_option: "Something is at stake -- it could be lost."
    distractors: ["Something is on the table.", "Something is finished.", "Something is guaranteed to succeed."]
    accepted_answers: [{value: "Something is at stake -- it could be lost.", status: correct}]
    feedback: "*Etwas steht auf dem Spiel* = something is at stake -- a figurative warning about what could be lost."
  de.c1.unit06.lesson03.exercise02.listen_weichen:
    instruction: "Listen and select the meaning of the sentence."
    correct_option: "With this decision we are setting the course for the future."
    distractors: ["With this decision we are cancelling the project.", "With this decision we are ending the meeting.", "With this decision we are changing the topic."]
    accepted_answers: [{value: "With this decision we are setting the course for the future.", status: correct}]
    feedback: "*Mit dieser Entscheidung stellen wir die Weichen für die Zukunft* -- *die Weichen stellen* is a railway metaphor for setting a course."
  de.c1.unit06.lesson03.exercise03.match_bildhaft:
    instruction: "Match each German figurative expression to its meaning."
    accepted_answers:
      - value: {"etwas steht auf dem Spiel": "something is at stake", "den Ausschlag geben": "to be the decisive factor", "die Weichen stellen": "to set the course (for the future)", "etwas im Auge behalten": "to keep an eye on something", "den Nagel auf den Kopf treffen": "to hit the nail on the head", "etwas liegt auf der Hand": "it is obvious"}
        status: correct
    feedback: "The figurative toolkit: *etwas steht auf dem Spiel* (at stake), *den Ausschlag geben* (decisive), *die Weichen stellen* (set the course), *im Auge behalten* (keep an eye on)."
  de.c1.unit06.lesson03.exercise04.order_spiel:
    instruction: "Put the German words in order."
    accepted_answers:
      - {value: "Bei diesem Projekt steht viel auf dem Spiel", status: correct}
    feedback: "*Bei diesem Projekt steht viel auf dem Spiel* -- the idiom *etwas steht auf dem Spiel* in a natural sentence."
  de.c1.unit06.lesson03.exercise05.translate_spiel:
    instruction: "Translate into German, using etwas steht auf dem Spiel: A lot is at stake in this project."
    accepted_answers:
      - {value: "Bei diesem Projekt steht viel auf dem Spiel", status: correct}
      - {value: "Bei diesem Projekt steht viel auf dem Spiel.", status: correct}
    feedback: "*Bei diesem Projekt steht viel auf dem Spiel* -- *etwas steht auf dem Spiel* in context."
  de.c1.unit06.lesson03.exercise06.speak_ausschlag:
    instruction: "Say aloud in German, using den Ausschlag geben: The price will be the decisive factor."
    accepted_answers:
      - {value: "Der Preis wird den Ausschlag geben", status: correct}
      - {value: "Der Preis wird den Ausschlag geben.", status: correct}
    feedback: "Spoken, *Der Preis wird den Ausschlag geben* -- *den Ausschlag geben* means the deciding factor."
  de.c1.unit06.lesson03.exercise07.write_register:
    instruction: "Write in formal German. The informal idiom Das ist nicht mein Bier is not appropriate in a formal Sie meeting -- rewrite it using the formal phrase das fällt nicht in meinen Zuständigkeitsbereich: That is not my responsibility."
    accepted_answers:
      - {value: "Das fällt nicht in meinen Zuständigkeitsbereich", status: correct}
      - {value: "Das fällt nicht in meinen Zuständigkeitsbereich.", status: correct}
      - {value: "Das faellt nicht in meinen Zustaendigkeitsbereich", status: correct}
      - {value: "Das faellt nicht in meinen Zustaendigkeitsbereich.", status: correct}
    feedback: "*Das fällt nicht in meinen Zuständigkeitsbereich* -- the formal-Sie equivalent of the informal *Das ist nicht mein Bier*."

  de.c1.unit06.lesson04.exercise01.read_spiel:
    instruction: "In the passage, what does it mean that viel auf dem Spiel steht in the new project?"
    correct_option: "A lot depends on the project -- it could be lost."
    distractors: ["The project has already failed.", "The project is guaranteed to succeed.", "The project is about a game."]
    accepted_answers: [{value: "A lot depends on the project -- it could be lost.", status: correct}]
    feedback: "*Bei dem neuen Projekt steht viel auf dem Spiel* signals urgency: a lot depends on getting this right."
  de.c1.unit06.lesson04.exercise02.read_nagel:
    instruction: "In the passage, what does it mean that the report den Nagel auf den Kopf getroffen hat?"
    correct_option: "The report identified the key point exactly right."
    distractors: ["The report was too literal.", "The report missed the point.", "The report was about construction."]
    accepted_answers: [{value: "The report identified the key point exactly right.", status: correct}]
    feedback: "*Der Bericht hat den Nagel auf den Kopf getroffen* praises the report's accuracy -- it got to the heart of the matter."
  de.c1.unit06.lesson04.exercise03.match_lesen:
    instruction: "Match each figurative expression from the passage to its meaning."
