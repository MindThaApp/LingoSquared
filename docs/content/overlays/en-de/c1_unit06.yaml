  de.c1.unit06.lesson04.exercise06.speak_lesen:
    instruction: "Say aloud in German: You hit the nail on the head."
    accepted_answers:
      - {value: "Sie haben den Nagel auf den Kopf getroffen", status: correct}
      - {value: "Sie haben den Nagel auf den Kopf getroffen.", status: correct}
    feedback: "Spoken, *Sie haben den Nagel auf den Kopf getroffen* -- review of the idiom."
  de.c1.unit06.lesson04.exercise07.write_lesen:
