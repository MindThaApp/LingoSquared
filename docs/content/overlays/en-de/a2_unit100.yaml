course:
  title: "German A2"
  description: "Grammar-led A2 German continuing the Anna and Felix storyline."
  learning_goal: "Talk about the past in German with the perfect, the simple past and the past perfect."
units:
  de.a2.unit100.als_es_passierte: {"title": "When It Happened", "description": "Say what was going on when something else happened, using the simple past with als and während."}
lessons:
  de.a2.unit100.lesson01.kochte_und_kam: {"title": "He Cooked, He Came"}
  de.a2.unit100.lesson02.als_nebensatz: {"title": "When Felix Came Home"}
  de.a2.unit100.lesson03.waehrend: {"title": "While"}
  de.a2.unit100.lesson04.licht_aus: {"title": "The Light Suddenly Went Out"}
  de.a2.unit100.lesson05.ohne_licht: {"title": "An Evening Without Light"}
  de.a2.unit100.lesson06.felix_im_stau: {"title": "Why Didn't You Come?"}
teaching:
  de.a2.unit100.lesson01.teach.regelmaessig: {"title": "Regular verbs", "gloss": "to cook / to rain / to work / to wait / to hear, listen to", "example_gloss": ["Anna cooked soup.", "It was raining.", "Felix was working in the office.", "He waited at the bus stop.", "Nina listened to music."], "note": "These are regular verbs: the simple past is the stem plus *-te*."}
  de.a2.unit100.lesson01.teach.unregelmaessig: {"title": "Verbs that change their vowel", "gloss": "to come / to go / to see / to read / to sleep / to sit", "example_gloss": ["Felix came home.", "Anna went into the kitchen.", "He saw the bus.", "Felix read the newspaper.", "Nina was sleeping.", "We were sitting in the cafe."], "note": "These verbs change the stem vowel in the simple past. You have to learn each one: *kommen, kam*; *gehen, ging*; *sehen, sah*."}
  de.a2.unit100.lesson01.teach.gn_regelmaessig: {"title": "Regular: stem plus -te", "gloss": "I cooked, you cooked, he cooked, we cooked, you (plural) cooked, they cooked", "note": "Add *-te* to the stem and then the personal ending (*-st* for du, *-n* for wir and sie). *Ich* and *er/sie/es* never take an ending. Stems that end in *-t* or *-d* add *-ete*: *arbeitete, wartete*."}
  de.a2.unit100.lesson01.teach.gn_unregelmaessig: {"title": "Strong verbs: new vowel, no -te", "gloss": "come, came. go, went. see, saw. read, read. sleep, slept. sit, sat.", "note": "Strong verbs have no *-te*. *Ich* and *er/sie/es* use the bare past stem (*ich kam, er kam*); *wir* and *sie* add *-en* (*wir kamen*)."}
  de.a2.unit100.lesson01.teach.satz_wetter: {"title": "Weather and background", "gloss": "It was raining. The sun wasn't shining.", "note": "*Scheinen* is a strong verb: *schien*."}
  de.a2.unit100.lesson02.teach.zeitwoerter: {"title": "Time words", "gloss": "yesterday evening / suddenly / at last", "example_gloss": ["Yesterday evening it rained.", "Suddenly Anna called.", "At last the bus came."], "note": "These words move a story forward."}
  de.a2.unit100.lesson02.teach.gn_als: {"title": "Als: one event in the past", "gloss": "When Felix came home, it was raining.", "note": "*Als* introduces a single event or period in the past. Use it only for the past; for repeated events or the present *wenn* is used."}
  de.a2.unit100.lesson02.teach.gn_nebensatz: {"title": "The verb goes to the end", "gloss": "When Felix came home, ... When Anna was cooking, ... When Nina was sleeping, ...", "note": "In a clause with *als* the conjugated verb goes to the end. A comma separates it from the main clause."}
  de.a2.unit100.lesson02.teach.gn_inversion: {"title": "Main clause after the als-clause", "gloss": "When it rained, Felix went home. Felix went home when it rained.", "note": "If the *als* clause comes first, the verb of the main clause follows the comma directly (*ging Felix*). If it comes second, the main clause keeps its normal order."}
  de.a2.unit100.lesson02.teach.satz_als: {"title": "One sentence", "gloss": "When Anna called, Felix was sitting in the cafe."}
  de.a2.unit100.lesson03.teach.gleichzeitig: {"title": "Two things at once", "gloss": "while / at the same time / also", "example_gloss": ["While Anna was cooking, Felix was reading.", "Nina listened to music while Felix waited."], "note": "*Während* links two actions that took place at the same time."}
  de.a2.unit100.lesson03.teach.gn_waehrend: {"title": "Während: two actions at the same time", "gloss": "While Anna was cooking, Felix was reading.", "note": "*Während* works like *als*: the verb goes to the end. Use it when both actions last for some time."}
  de.a2.unit100.lesson03.teach.gn_als_waehrend: {"title": "Als or während?", "gloss": "When Anna called, Felix was cooking. While Anna was cooking, Felix was reading.", "note": "*Als* often links a moment (the call) with something in progress. *Während* links two activities in progress, with no moment in between."}
  de.a2.unit100.lesson03.teach.gn_plotzlich: {"title": "Plötzlich starts a sudden event", "gloss": "Felix was reading. Suddenly Anna called.", "note": "*Plötzlich* announces a sudden event. The verb comes right after it."}
  de.a2.unit100.lesson03.teach.satz_waehrend: {"title": "Two activities", "gloss": "Felix waited while it was raining."}
  de.a2.unit100.lesson04.teach.zwischenfall: {"title": "A small incident", "gloss": "light / traffic jam / to go out / to depart / to arrive", "example_gloss": ["The light went out.", "The bus drove off.", "We were stuck in traffic.", "The train arrived."], "note": "These words describe a small problem on the way. *Ausgehen*, *abfahren* and *ankommen* are separable."}
  de.a2.unit100.lesson04.teach.gn_trennbar_praeteritum: {"title": "Separable verbs in the simple past", "gloss": "The light went out. Anna called Felix. The bus drove off.", "note": "In a main clause the prefix goes to the end: *ging ... aus*, *rief ... an*, *fuhr ... ab*."}
  de.a2.unit100.lesson04.teach.gn_trennbar_nebensatz: {"title": "In an als clause the prefix comes back", "gloss": "When the light went out, we were sitting in the cafe. When Anna called, Felix was waiting. When the train arrived, Felix was standing there.", "note": "In a subordinate clause the verb and its prefix are written together again at the end: *ausging*, *anrief*."}
  de.a2.unit100.lesson04.teach.gn_reihenfolge: {"title": "Background and event", "gloss": "Felix was waiting. Suddenly the bus came. When the bus came, Felix was at the bus stop.", "note": "The simple past tells a story: one sentence gives the background (*wartete*), the next gives the event (*kam*)."}
  de.a2.unit100.lesson04.teach.satz_stau: {"title": "Stuck", "gloss": "When we were stuck in traffic, Anna listened to music."}
  de.a2.unit100.lesson05.teach.lesewoerter: {"title": "Words for the story", "gloss": "yesterday / outside / soup / candle / everybody", "example_gloss": ["Yesterday I was in the cafe.", "Outside it was raining.", "Everybody waited."], "note": "Words that appear in the story."}
  de.a2.unit100.lesson05.teach.gn_hintergrund: {"title": "Background with the simple past", "gloss": "Anna was cooking soup. It was raining. Everybody was waiting.", "note": "The simple past describes the scene before something happens."}
  de.a2.unit100.lesson05.teach.gn_dunkel: {"title": "A sudden change", "gloss": "When it suddenly got dark, ...", "note": "One single moment in the past, even a change such as *wurde* (became), takes *als*."}
  de.a2.unit100.lesson05.teach.lesen_geschichte: {"title": "A story", "gloss": "Yesterday evening Felix was at the cafe. He was reading the newspaper and Anna was cooking soup. Outside it was raining. Suddenly the light went out. Everybody waited. When Anna brought a candle, Felix laughed. The soup was already ready, and they ate in the dark.", "note": "The story uses the simple past throughout: background first, then the sudden event.", "glosses": {"Kerze": "candle", "fertig": "ready", "Dunkeln": "dark", "lachte": "laughed"}}
  de.a2.unit100.lesson06.teach.anna_warum: {"title": "Anna asks why", "gloss": "Anna: Felix, why didn't you come yesterday?"}
  de.a2.unit100.lesson06.teach.felix_bus: {"title": "Felix explains", "gloss": "Felix: I wanted to come, but the bus didn't come. It was raining and I waited at the bus stop."}
  de.a2.unit100.lesson06.teach.anna_dann: {"title": "Anna asks more", "gloss": "Anna: And what did you do then?"}
  de.a2.unit100.lesson06.teach.felix_endlich: {"title": "Felix answers", "gloss": "Felix: When the bus finally came, it was already eight o'clock. Then I went home."}
  de.a2.unit100.lesson06.teach.anna_schade: {"title": "Anna is sorry", "gloss": "Anna: What a shame! I was cooking while I waited for you."}
  de.a2.unit100.lesson06.teach.felix_morgen: {"title": "Felix apologises", "gloss": "Felix: Sorry! Tomorrow I'll come earlier."}
exercises:
  de.a2.unit100.lesson01.exercise01.wahl_kochte: {"instruction": "Choose the correct German sentence.", "correct_option": "Anna kochte Suppe.", "distractors": ["Anna kochtete Suppe.", "Anna gekocht Suppe.", "Anna kochen Suppe."], "accepted_answers": [{"value": "Anna kochte Suppe.", "status": "correct"}], "feedback": "Regular verb: *koch-* + *-te*."}
  de.a2.unit100.lesson01.exercise02.wahl_las: {"instruction": "Choose the correct German sentence.", "correct_option": "Felix las die Zeitung.", "distractors": ["Felix lesete die Zeitung.", "Felix lase die Zeitung.", "Felix liest die Zeitung."], "accepted_answers": [{"value": "Felix las die Zeitung.", "status": "correct"}], "feedback": "*Lesen* is strong: *las*."}
  de.a2.unit100.lesson01.exercise03.paare_formen: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "kam", "right": "came"}, {"left": "ging", "right": "went"}, {"left": "sah", "right": "saw"}, {"left": "las", "right": "read"}, {"left": "schlief", "right": "slept"}, {"left": "saß", "right": "sat"}], "status": "correct"}], "feedback": "These simple-past forms need to be learned one by one."}
  de.a2.unit100.lesson01.exercise04.ordnen_kam: {"instruction": "Put the words in order to say 'Felix came home.'", "correct_option": "Felix kam nach Hause", "accepted_answers": [{"value": "Felix kam nach Hause", "status": "correct"}], "feedback": "*Kam* is the second element of the sentence."}
  de.a2.unit100.lesson01.exercise05.luecke_las: {"instruction": "Complete with the simple past of lesen.", "correct_option": "las", "accepted_answers": [{"value": "las", "status": "correct"}], "feedback": "The strong verb *lesen* becomes *las*."}
  de.a2.unit100.lesson01.exercise06.uebersetzen_kochte: {"instruction": "Translate into German.", "accepted_answers": [{"value": "Anna kochte Suppe.", "status": "correct"}], "feedback": "Regular verb with *-te*."}
  de.a2.unit100.lesson01.exercise07.schreiben_ging: {"instruction": "Write the requested German sentence.", "correct_option": "Anna ging in die Küche.", "accepted_answers": [{"value": "Anna ging in die Küche.", "status": "correct"}, {"value": "Anna ging in die Kueche.", "status": "correct"}], "feedback": "*Gehen, ging*."}
  de.a2.unit100.lesson02.exercise01.wahl_als1: {"instruction": "Choose the correct German sentence.", "correct_option": "Als Felix nach Hause kam, regnete es.", "distractors": ["Als Felix kam nach Hause, regnete es.", "Als Felix nach Hause kam, es regnete.", "Als Felix nach Hause gekommen, regnete es."], "accepted_answers": [{"value": "Als Felix nach Hause kam, regnete es.", "status": "correct"}], "feedback": "In the *als* clause the verb *kam* is last, and after the comma the main clause starts with its verb."}
  de.a2.unit100.lesson02.exercise02.wahl_als2: {"instruction": "Choose the correct German sentence.", "correct_option": "Es regnete, als Felix nach Hause kam.", "distractors": ["Es regnete, als kam Felix nach Hause.", "Es regnete, als Felix kam nach Hause.", "Es regnete, als Felix nach Hause kommen."], "accepted_answers": [{"value": "Es regnete, als Felix nach Hause kam.", "status": "correct"}], "feedback": "The verb of the *als* clause is last: *als Felix nach Hause kam*."}
  de.a2.unit100.lesson02.exercise03.paare_als: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Als Felix nach Hause kam, regnete es.", "right": "When Felix came home, it was raining."}, {"left": "Als Anna anrief, saß Felix im Café.", "right": "When Anna called, Felix was sitting in the cafe."}, {"left": "Als Nina schlief, kochte Anna.", "right": "When Nina was sleeping, Anna was cooking."}, {"left": "Als Felix las, regnete es.", "right": "When Felix was reading, it was raining."}, {"left": "Als der Bus endlich kam, regnete es.", "right": "When the bus finally came, it was raining."}, {"left": "Als Anna in die Küche ging, hörte Nina Musik.", "right": "When Anna went into the kitchen, Nina listened to music."}], "status": "correct"}], "feedback": "Each sentence has a past event after *als*."}
  de.a2.unit100.lesson02.exercise04.ordnen_als: {"instruction": "Put the words in order to say 'When Anna was cooking, Felix was reading.'", "correct_option": "Als Anna kochte las Felix", "accepted_answers": [{"value": "Als Anna kochte las Felix", "status": "correct"}, {"value": "Felix las als Anna kochte", "status": "correct"}], "feedback": "After the *als* clause, the main verb *las* comes first."}
  de.a2.unit100.lesson02.exercise05.luecke_als: {"instruction": "Complete with the word that introduces a single event in the past.", "correct_option": "Als", "accepted_answers": [{"value": "Als", "status": "correct"}], "feedback": "*Als* introduces one past event."}
  de.a2.unit100.lesson02.exercise06.uebersetzen_als: {"instruction": "Translate into German.", "accepted_answers": [{"value": "Als Anna anrief, saß Felix im Café.", "status": "correct"}, {"value": "Felix saß im Café, als Anna anrief.", "status": "correct"}, {"value": "Als Anna anrief, sass Felix im Café.", "status": "correct"}, {"value": "Felix sass im Café, als Anna anrief.", "status": "correct"}], "feedback": "Both clause orders are correct."}
  de.a2.unit100.lesson02.exercise07.schreiben_als: {"instruction": "Write the requested German sentence.", "correct_option": "Als der Bus endlich kam, regnete es.", "accepted_answers": [{"value": "Als der Bus endlich kam, regnete es.", "status": "correct"}], "feedback": "The verb of the *als* clause is last."}
  de.a2.unit100.lesson03.exercise01.wahl_waehrend: {"instruction": "Choose the correct German sentence.", "correct_option": "Während Anna kochte, las Felix.", "distractors": ["Während Anna kochte, Felix las.", "Während kochte Anna, las Felix.", "Während Anna kochte las, Felix."], "accepted_answers": [{"value": "Während Anna kochte, las Felix.", "status": "correct"}], "feedback": "After *während Anna kochte*, the main clause begins with *las*."}
  de.a2.unit100.lesson03.exercise02.wahl_plotzlich: {"instruction": "Choose the correct German sentence.", "correct_option": "Plötzlich rief Anna an.", "distractors": ["Plötzlich Anna rief an.", "Plötzlich rief an Anna.", "Plötzlich anrief Anna."], "accepted_answers": [{"value": "Plötzlich rief Anna an.", "status": "correct"}], "feedback": "The verb is second and the prefix *an* goes to the end."}
  de.a2.unit100.lesson03.exercise03.paare_waehrend: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Während Anna kochte, las Felix.", "right": "While Anna was cooking, Felix was reading."}, {"left": "Nina hörte Musik, während Felix wartete.", "right": "Nina listened to music while Felix waited."}, {"left": "Felix wartete, während es regnete.", "right": "Felix waited while it was raining."}, {"left": "Plötzlich rief Anna an.", "right": "Suddenly Anna called."}, {"left": "Endlich kam der Bus.", "right": "At last the bus came."}, {"left": "Gestern Abend regnete es.", "right": "Yesterday evening it rained."}], "status": "correct"}], "feedback": "Two ongoing actions use *während*; a sudden event uses *plötzlich*."}
  de.a2.unit100.lesson03.exercise04.ordnen_waehrend: {"instruction": "Put the words in order to say 'Nina listened to music while Felix waited.'", "correct_option": "Nina hörte Musik während Felix wartete", "accepted_answers": [{"value": "Nina hörte Musik während Felix wartete", "status": "correct"}, {"value": "Während Felix wartete hörte Nina Musik", "status": "correct"}], "feedback": "The second clause ends with the verb *wartete*."}
  de.a2.unit100.lesson03.exercise05.luecke_waehrend: {"instruction": "Complete with the word for 'while'.", "correct_option": "während", "accepted_answers": [{"value": "während", "status": "correct"}, {"value": "waehrend", "status": "correct"}], "feedback": "*Während* joins two actions at the same time."}
  de.a2.unit100.lesson03.exercise06.uebersetzen_waehrend: {"instruction": "Translate into German.", "accepted_answers": [{"value": "Felix wartete, während es regnete.", "status": "correct"}, {"value": "Während es regnete, wartete Felix.", "status": "correct"}, {"value": "Felix wartete, waehrend es regnete.", "status": "correct"}, {"value": "Waehrend es regnete, wartete Felix.", "status": "correct"}], "feedback": "*Während* sends the verb to the end."}
  de.a2.unit100.lesson03.exercise07.schreiben_waehrend: {"instruction": "Write the requested German sentence.", "correct_option": "Während Anna kochte, las Felix.", "accepted_answers": [{"value": "Während Anna kochte, las Felix.", "status": "correct"}, {"value": "Waehrend Anna kochte, las Felix.", "status": "correct"}], "feedback": "*Während Anna kochte, las Felix.*"}
  de.a2.unit100.lesson04.exercise01.wahl_ausgehen: {"instruction": "Choose the correct German sentence.", "correct_option": "Das Licht ging aus.", "distractors": ["Das Licht ausging.", "Das Licht ging.", "Das Licht aus ging."], "accepted_answers": [{"value": "Das Licht ging aus.", "status": "correct"}], "feedback": "In a main clause the prefix *aus* goes to the end."}
  de.a2.unit100.lesson04.exercise02.wahl_ausging: {"instruction": "Choose the correct German sentence.", "correct_option": "Als das Licht ausging, saßen wir im Café.", "distractors": ["Als das Licht ging aus, saßen wir im Café.", "Als das Licht ausging, wir saßen im Café.", "Als das Licht aus ging, saßen im Café wir."], "accepted_answers": [{"value": "Als das Licht ausging, saßen wir im Café.", "status": "correct"}], "feedback": "In the *als* clause the prefix rejoins the verb: *ausging*."}
  de.a2.unit100.lesson04.exercise03.paare_zwischenfall: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Das Licht ging aus.", "right": "The light went out."}, {"left": "Der Bus fuhr ab.", "right": "The bus drove off."}, {"left": "Wir standen im Stau.", "right": "We were stuck in traffic."}, {"left": "Der Zug kam an.", "right": "The train arrived."}, {"left": "Anna rief Felix an.", "right": "Anna called Felix."}, {"left": "Als Anna anrief, wartete Felix.", "right": "When Anna called, Felix was waiting."}], "status": "correct"}], "feedback": "Separable verbs split in main clauses."}
  de.a2.unit100.lesson04.exercise04.ordnen_stau: {"instruction": "Put the words in order to say 'We were stuck in traffic.'", "correct_option": "Wir standen im Stau", "accepted_answers": [{"value": "Wir standen im Stau", "status": "correct"}], "feedback": "*Standen* is second."}
  de.a2.unit100.lesson04.exercise05.luecke_ab: {"instruction": "Complete with the separated prefix of abfahren.", "correct_option": "ab", "accepted_answers": [{"value": "ab", "status": "correct"}], "feedback": "*Abfahren* splits into *fuhr ... ab*."}
  de.a2.unit100.lesson04.exercise06.uebersetzen_licht: {"instruction": "Translate into German.", "accepted_answers": [{"value": "Als das Licht ausging, saßen wir im Café.", "status": "correct"}, {"value": "Wir saßen im Café, als das Licht ausging.", "status": "correct"}, {"value": "Als das Licht ausging, sassen wir im Café.", "status": "correct"}, {"value": "Wir sassen im Café, als das Licht ausging.", "status": "correct"}], "feedback": "*Ausging* is written together in the *als* clause."}
  de.a2.unit100.lesson04.exercise07.schreiben_zug: {"instruction": "Write the requested German sentence.", "correct_option": "Als der Zug ankam, wartete Felix.", "accepted_answers": [{"value": "Als der Zug ankam, wartete Felix.", "status": "correct"}], "feedback": "*Ankam* is one word in the *als* clause."}
  de.a2.unit100.lesson05.exercise01.lesen_was: {"instruction": "Read the text and choose the answer.", "correct_option": "The light went out.", "distractors": ["The bus left.", "Anna called.", "The rain stopped."], "accepted_answers": [{"value": "The light went out.", "status": "correct"}], "feedback": "*Plötzlich ging das Licht aus.*"}
  de.a2.unit100.lesson05.exercise02.lesen_felix: {"instruction": "Read the text and choose the answer.", "correct_option": "He was reading the newspaper.", "distractors": ["He was sleeping.", "He was listening to music.", "He was waiting for the bus."], "accepted_answers": [{"value": "He was reading the newspaper.", "status": "correct"}], "feedback": "*Er las die Zeitung, und Anna kochte Suppe.*"}
  de.a2.unit100.lesson05.exercise03.paare_geschichte: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Er las die Zeitung.", "right": "He was reading the newspaper."}, {"left": "Anna kochte Suppe.", "right": "Anna was cooking soup."}, {"left": "Draußen regnete es.", "right": "Outside it was raining."}, {"left": "Alle warteten.", "right": "Everybody waited."}, {"left": "Anna brachte eine Kerze.", "right": "Anna brought a candle."}, {"left": "Sie aßen im Dunkeln.", "right": "They ate in the dark."}], "status": "correct"}], "feedback": "These sentences retell the story."}
  de.a2.unit100.lesson05.exercise04.ordnen_kerze: {"instruction": "Put the words in order to say 'When Anna brought a candle, Felix laughed.'", "correct_option": "Als Anna eine Kerze brachte lachte Felix", "accepted_answers": [{"value": "Als Anna eine Kerze brachte lachte Felix", "status": "correct"}, {"value": "Felix lachte als Anna eine Kerze brachte", "status": "correct"}], "feedback": "The verb of the *als* clause, *brachte*, is last in that clause."}
  de.a2.unit100.lesson05.exercise05.uebersetzen_draussen: {"instruction": "Translate into German.", "accepted_answers": [{"value": "Draußen regnete es.", "status": "correct"}, {"value": "Es regnete draußen.", "status": "correct"}, {"value": "Draussen regnete es.", "status": "correct"}, {"value": "Es regnete draussen.", "status": "correct"}], "feedback": "Simple past of *regnen*."}
  de.a2.unit100.lesson05.exercise06.diktat_licht: {"instruction": "Type what you hear.", "correct_response": "Plötzlich ging das Licht aus.", "orthography_strict": true, "feedback": "You heard *Plötzlich ging das Licht aus.*."}
  de.a2.unit100.lesson05.exercise07.diktat_kerze: {"instruction": "Type what you hear.", "correct_response": "Als Anna eine Kerze brachte, lachte Felix.", "orthography_strict": true, "feedback": "You heard *Als Anna eine Kerze brachte, lachte Felix.*."}
  de.a2.unit100.lesson06.exercise01.hoeren_warum: {"instruction": "Listen and select Anna's first question.", "correct_option": "Felix, warum bist du gestern nicht gekommen?", "distractors": ["Felix, warum bist du gestern gekommen?", "Felix, wann kommt der Bus?", "Anna, warum bist du gestern nicht gekommen?"], "accepted_answers": [{"value": "Felix, warum bist du gestern nicht gekommen?", "status": "correct"}], "feedback": "Anna asks *Felix, warum bist du gestern nicht gekommen?*"}
  de.a2.unit100.lesson06.exercise02.verstehen_bus: {"instruction": "Listen to the dialogue and choose the answer.", "correct_option": "The bus did not come, and it was raining.", "distractors": ["He was sleeping.", "He was cooking soup.", "The light went out."], "accepted_answers": [{"value": "The bus did not come, and it was raining.", "status": "correct"}], "feedback": "Felix says the bus did not come while it rained."}
  de.a2.unit100.lesson06.exercise03.paare_dialog: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Der Bus kam nicht.", "right": "The bus didn't come."}, {"left": "Es regnete.", "right": "It was raining."}, {"left": "Ich wartete an der Haltestelle.", "right": "I waited at the bus stop."}, {"left": "Als der Bus endlich kam, war es schon acht Uhr.", "right": "When the bus finally came, it was already eight o'clock."}, {"left": "Ich kochte, während ich auf dich wartete.", "right": "I was cooking while I waited for you."}, {"left": "Morgen komme ich früher.", "right": "Tomorrow I'll come earlier."}], "status": "correct"}], "feedback": "The dialogue uses the simple past for the story of the evening."}
  de.a2.unit100.lesson06.exercise04.ordnen_endlich: {"instruction": "Put the words in order to say 'When the bus finally came, it was already eight o'clock.'", "correct_option": "Als der Bus endlich kam war es schon acht Uhr", "accepted_answers": [{"value": "Als der Bus endlich kam war es schon acht Uhr", "status": "correct"}, {"value": "Es war schon acht Uhr als der Bus endlich kam", "status": "correct"}], "feedback": "The *als* clause ends with *kam*; then the main verb *war* follows."}
  de.a2.unit100.lesson06.exercise05.antwort_warum: {"instruction": "Answer in German as Felix: say that the bus didn't come.", "correct_option": "Der Bus kam nicht.", "accepted_answers": [{"value": "Der Bus kam nicht.", "status": "correct"}, {"value": "Der Bus kam nicht und es regnete.", "status": "correct"}, {"value": "Es regnete und der Bus kam nicht.", "status": "correct"}], "feedback": "*Der Bus kam nicht.*"}
  de.a2.unit100.lesson06.exercise06.uebersetzen_schade: {"instruction": "Translate into German.", "accepted_answers": [{"value": "Ich kochte, während ich auf dich wartete.", "status": "correct"}, {"value": "Ich kochte, waehrend ich auf dich wartete.", "status": "correct"}], "feedback": "*Während* plus the verb at the end."}
  de.a2.unit100.lesson06.exercise07.schreiben_geschichte: {"instruction": "Write three German sentences, following the three numbered instructions.", "correct_option": "Es regnete. Ich wartete an der Haltestelle. Als der Bus endlich kam, ging ich nach Hause.", "accepted_answers": [{"value": "Es regnete. Ich wartete an der Haltestelle. Als der Bus endlich kam, ging ich nach Hause.", "status": "correct"}], "feedback": "Background in the first two sentences, then the event in an *als* clause."}
