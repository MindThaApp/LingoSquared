  de.b1.unit39.lesson02.exercise01.recognize_noch_arbeiten: {instruction: "Which German sentence means \"I'm still working on the report.\"?", correct_option: "Ich arbeite noch am Bericht.", distractors: ["Ich bin mit dem Bericht fertig.", "Ich arbeite noch am Projekt.", "Der Bericht ist für mich zuständig."], accepted_answers: [{value: "Ich arbeite noch am Bericht.", status: "correct"}], feedback: "*noch* marks the report as still in progress, not finished."}
  de.b1.unit39.lesson02.exercise02.recognize_bitte_helfen: {instruction: "Which German question means \"Can you please help me?\"?", correct_option: "Können Sie mir bitte helfen?", distractors: ["Können Sie mir das Projekt geben?", "Kann ich Ihnen bitte helfen?", "Müssen Sie mir helfen?"], accepted_answers: [{value: "Können Sie mir bitte helfen?", status: "correct"}], feedback: "*Können Sie mir bitte helfen?* is the formal, professional request for help."}
  de.b1.unit39.lesson02.exercise03.listen_select_status_update: {instruction: "Listen. What is the status of the report, and what does the speaker ask for?", correct_option: "The report is still in progress, and he asks for help.", distractors: ["The report is finished, and he asks for feedback.", "The report is delayed, and he asks for more time.", "The report is still in progress, and he asks for the deadline."], accepted_answers: [{value: "The report is still in progress, and he asks for help.", status: "correct"}], feedback: "The recording says *Ich arbeite noch am Bericht, aber können Sie mir bitte helfen?*"}
  de.b1.unit39.lesson02.exercise04.match_status_update:
    instruction: "Match each German phrase to its meaning."
