      - {value: "Ich arbeite noch am Bericht, aber können Sie mir bitte helfen", status: "correct"}
      - {value: "Ich arbeite noch am Bericht, aber koennen Sie mir bitte helfen", status: "correct"}
    feedback: "The model answer is *Ich arbeite noch am Bericht, aber können Sie mir bitte helfen?*"
  de.b1.unit39.lesson03.exercise01.choose_bauer_question: {instruction: "What does Frau Bauer ask Felix?", correct_option: "What are you responsible for this week?", distractors: ["What's the status of the project?", "When is the report due?", "Who is responsible for planning?"], accepted_answers: [{value: "What are you responsible for this week?", status: "correct"}], feedback: "Frau Bauer asks *Wofür sind Sie diese Woche zuständig?*"}
  de.b1.unit39.lesson03.exercise02.choose_felix_status: {instruction: "What does Felix say about the report, and what does he ask for?", correct_option: "It's still in progress, and he asks Frau Bauer to help him.", distractors: ["It's finished, and he asks for feedback.", "It's delayed, and he asks for more time.", "It's still in progress, and he asks for a new deadline."], accepted_answers: [{value: "It's still in progress, and he asks Frau Bauer to help him.", status: "correct"}], feedback: "Felix says *Ich arbeite noch am Bericht, aber können Sie mir bitte helfen?*"}
  de.b1.unit39.lesson03.exercise03.listen_dialogue_arbeitsalltag: {instruction: "Listen to the dialogue. What is Felix responsible for this week?", correct_option: "The project.", distractors: ["The planning.", "The report.", "Nothing this week."], accepted_answers: [{value: "The project.", status: "correct"}], feedback: "Felix says *Ich bin für das Projekt zuständig*."}
