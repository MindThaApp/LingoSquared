    feedback: "These pieces build a status update combined with a request for help."
  de.b1.unit39.lesson02.exercise05.order_status_update: {instruction: "Put the words in order to say \"I'm still working on the report, but can you please help me?\"", accepted_answers: [{value: ["Ich", "arbeite", "noch", "am", "Bericht,", "aber", "können", "Sie", "mir", "bitte", "helfen?"], status: "correct"}], feedback: "The correct order is *Ich arbeite noch am Bericht, aber können Sie mir bitte helfen?*"}
