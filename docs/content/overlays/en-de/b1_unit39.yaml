  de.b1.unit39.arbeitsalltag: {title: "Working Life"}

lessons:
  de.b1.unit39.lesson01.zustaendigkeit: {title: "I'm responsible for ..."}
  de.b1.unit39.lesson02.statusupdate: {title: "Status update and asking for help"}
  de.b1.unit39.lesson03.buero_dialogue: {title: "Dialogue: responsibility, status, and help"}

teaching:
  de.b1.unit39.lesson01.teach.zustaendig_projekt: {title: "Ich bin für das Projekt zuständig.", gloss: "I'm responsible for the project.", note: "*zuständig sein für* + accusative names a specific work responsibility.", example_gloss: "At the office: I'm responsible for the project."}
  de.b1.unit39.lesson01.teach.zustaendig_planung: {title: "Ich bin für die Planung zuständig.", gloss: "I'm responsible for the planning.", note: "The same *zuständig sein für* structure works for any responsibility, such as planning.", example_gloss: "At the office: I'm responsible for the planning."}
  de.b1.unit39.lesson02.teach.noch_arbeiten: {title: "Ich arbeite noch am Bericht.", gloss: "I'm still working on the report.", note: "*noch* + present tense reports that a task is in progress, not finished.", example_gloss: "Status report: I'm still working on the report."}
  de.b1.unit39.lesson02.teach.bitte_helfen: {title: "Können Sie mir bitte helfen?", gloss: "Can you please help me?", note: "*Können Sie mir bitte ... ?* is the formal, professional way to ask a colleague for help."}
  de.b1.unit39.lesson03.teach.bauer_greeting_ask: {title: "Frau Bauer asks about responsibility", gloss: "Frau Bauer: Hello, Felix. What are you responsible for this week?", note: "*Wofür sind Sie zuständig?* is how a colleague asks about your responsibility."}
  de.b1.unit39.lesson03.teach.felix_zustaendig: {title: "Felix names his responsibility", gloss: "Felix: Hello, Frau Bauer. I'm responsible for the project.", note: "Felix answers directly with the zuständig sein für structure from lesson01."}
  de.b1.unit39.lesson03.teach.bauer_ask_stand: {title: "Frau Bauer asks for a status update", gloss: "Frau Bauer: And what's the status of the report?", note: "*Wie ist der Stand bei ... ?* asks for a status update on a specific task."}
  de.b1.unit39.lesson03.teach.felix_status_and_ask: {title: "Felix gives a status update and asks for help", gloss: "Felix: I'm still working on the report, but can you please help me?", note: "Felix combines a status update with a professional request for help in one turn."}

exercises:
  de.b1.unit39.lesson01.exercise01.recognize_zustaendig_projekt: {instruction: "Which German sentence means \"I'm responsible for the project.\"?", correct_option: "Ich bin für das Projekt zuständig.", distractors: ["Ich bin für die Planung zuständig.", "Ich arbeite noch am Projekt.", "Das Projekt ist für mich zuständig."], accepted_answers: [{value: "Ich bin für das Projekt zuständig.", status: "correct"}], feedback: "*zuständig sein für* names a specific work responsibility."}
  de.b1.unit39.lesson01.exercise02.recognize_zustaendig_planung: {instruction: "Which German sentence means \"I'm responsible for the planning.\"?", correct_option: "Ich bin für die Planung zuständig.", distractors: ["Ich bin für das Projekt zuständig.", "Die Planung ist noch nicht fertig.", "Ich arbeite an der Planung."], accepted_answers: [{value: "Ich bin für die Planung zuständig.", status: "correct"}], feedback: "*Ich bin für die Planung zuständig* names planning as the responsibility."}
  de.b1.unit39.lesson01.exercise03.listen_select_zustaendig: {instruction: "Listen. What is the speaker responsible for?", correct_option: "The project.", distractors: ["The planning.", "The report.", "The office."], accepted_answers: [{value: "The project.", status: "correct"}], feedback: "The recording says *Ich bin für das Projekt zuständig*."}
  de.b1.unit39.lesson01.exercise04.match_zustaendigkeit:
    instruction: "Match each German word or phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "zuständig sein für", right: "to be responsible for"}
          - {left: "das Projekt", right: "the project"}
          - {left: "die Planung", right: "the planning"}
          - {left: "Wofür sind Sie zuständig?", right: "What are you responsible for?"}
          - {left: "diese Woche", right: "this week"}
          - {left: "der Stand", right: "the status"}
        status: "correct"
    feedback: "These pieces cover naming a responsibility and asking about one."
  de.b1.unit39.lesson01.exercise05.order_zustaendig_projekt: {instruction: "Put the words in order to say \"I'm responsible for the project.\"", accepted_answers: [{value: ["Ich", "bin", "für", "das", "Projekt", "zuständig"], status: "correct"}], feedback: "The correct order is *Ich bin für das Projekt zuständig*."}
  de.b1.unit39.lesson01.exercise06.write_zustaendig_projekt:
    instruction: "Write exactly this sentence naming your work responsibility: I'm responsible for the project."
    accepted_answers:
      - {value: "Ich bin für das Projekt zuständig.", status: "correct"}
      - {value: "Ich bin fuer das Projekt zustaendig.", status: "correct"}
      - {value: "Ich bin für das Projekt zuständig", status: "correct"}
      - {value: "Ich bin fuer das Projekt zustaendig", status: "correct"}
