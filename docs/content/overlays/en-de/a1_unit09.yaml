course:
  title: "German A1"
  description: "Learn A1-level German for everyday greetings and short social exchanges, with detailed English explanations."

units:
  de.a1.unit09.orte: {title: "Common places and locations"}

teaching:
  de.a1.unit09.lesson01.teach.bank: {title: "Bank", gloss: "bank", note: "*Bank* means bank -- feminine noun, *die Bank*.", example_gloss: "I need to go to the bank."}
  de.a1.unit09.lesson01.teach.krankenhaus: {title: "Krankenhaus", gloss: "hospital", note: "*Krankenhaus* literally means 'sick house' -- neuter noun, *das Krankenhaus*.", example_gloss: "My friend is in the hospital."}
  de.a1.unit09.lesson01.teach.apotheke: {title: "Apotheke", gloss: "pharmacy", note: "*Apotheke* means pharmacy -- feminine noun, *die Apotheke*.", example_gloss: "The pharmacy is open today."}
  de.a1.unit09.lesson01.teach.park: {title: "Park", gloss: "park", note: "*Park* means park -- masculine noun, *der Park*.", example_gloss: "We like walking in the park."}
  de.a1.unit09.lesson01.teach.restaurant: {title: "Restaurant", gloss: "restaurant", note: "*Restaurant* means restaurant -- neuter noun, *das Restaurant*.", example_gloss: "This restaurant has good food."}

  de.a1.unit09.lesson02.teach.neben: {title: "Die Apotheke ist neben dem Park.", gloss: "The pharmacy is next to the park.", note: "*neben* means 'next to.' It's a two-way preposition -- for a fixed location (as here) it takes the dative case, so *der Park* (masculine) becomes *dem Park*."}
  de.a1.unit09.lesson02.teach.gegenueber_von: {title: "Die Apotheke ist gegenüber vom Krankenhaus.", gloss: "The pharmacy is across from the hospital.", note: "*gegenüber von* means 'across from.' *vom* is the standard contraction of *von dem* (dative neuter, *das Krankenhaus*), used in both speech and writing."}
  de.a1.unit09.lesson02.teach.zwischen: {title: "Die Apotheke ist zwischen der Bank und dem Park.", gloss: "The pharmacy is between the bank and the park.", note: "*zwischen* means 'between.' Note both dative forms: *der Bank* (feminine) and *dem Park* (masculine)."}
  de.a1.unit09.lesson02.teach.hinter: {title: "Das Restaurant ist hinter der Bank.", gloss: "The restaurant is behind the bank.", note: "*hinter* means 'behind' -- *der Bank* is the feminine dative form."}
  de.a1.unit09.lesson02.teach.vor: {title: "Der Park ist vor dem Krankenhaus.", gloss: "The park is in front of the hospital.", note: "*vor* means 'in front of' -- *dem Krankenhaus* is the neuter dative form."}

  de.a1.unit09.lesson03.teach.wo_ist_die_bank: {title: "Wo ist die Bank?", gloss: "Where is the bank?", note: "*Wo ist...?* is the standard way to ask where something is."}
  de.a1.unit09.lesson03.teach.sie_ist_neben: {title: "Sie ist neben dem Park.", gloss: "It's next to the park.", note: "*Sie* here means 'it' (referring to *die Bank*, feminine). It's capitalized only because it starts the sentence. The verb *ist* shows it isn't the formal 'you', which would be *Sie sind*."}
  de.a1.unit09.lesson03.teach.ist_es_weit: {title: "Ist es weit von hier?", gloss: "Is it far from here?", note: "*weit* means far. *es* here is a generic placeholder for the situation, not agreeing with any specific noun's gender."}
  de.a1.unit09.lesson03.teach.nicht_weit: {title: "Nein, es ist nicht weit.", gloss: "No, it's not far.", note: "*nicht* negates the adjective *weit*."}

  de.a1.unit09.lesson04.teach.entschuldigung_wo: {title: "Entschuldigung, wo ist die Apotheke?", gloss: "Excuse me, where is the pharmacy?", note: "*Entschuldigung* was covered earlier as 'excuse me / sorry' -- here it politely opens a question."}
  de.a1.unit09.lesson04.teach.line01: {title: "Felix asks the way", gloss: "Felix says: Excuse me, where is the pharmacy?", note: "The same polite opener as the standalone phrase above, now in a real conversation."}
  de.a1.unit09.lesson04.teach.line02: {title: "Anna gives the location", gloss: "Anna says: It's across from the hospital.", note: "A complete answer states the pharmacy's location relative to a known landmark."}
  de.a1.unit09.lesson04.teach.line03: {title: "Felix asks how far it is", gloss: "Felix says: Is it far from here?", note: "A natural follow-up question once you know the general direction."}
  de.a1.unit09.lesson04.teach.line04: {title: "Anna answers about the distance", gloss: "Anna says: No, it's not far. It's between the bank and the park.", note: "A complete answer reassures the distance, then gives a second, more precise landmark."}

exercises:
  de.a1.unit09.lesson01.exercise01.listen_ort:
    instruction: "Listen and select the place you hear."
    correct_option: "Apotheke"
    distractors: ["Bank", "Krankenhaus", "Park"]
    accepted_answers: [{value: "Apotheke", status: "correct"}]
    feedback: "*Apotheke* means pharmacy."
  de.a1.unit09.lesson01.exercise02.choose_krankenhaus:
    instruction: "Where do you go if you are very sick?"
    correct_option: "Krankenhaus"
    distractors: ["Bank", "Park", "Restaurant"]
    accepted_answers: [{value: "Krankenhaus", status: "correct"}]
    feedback: "*Krankenhaus* means hospital."
  de.a1.unit09.lesson01.exercise03.choose_bank:
    instruction: "Where do you go to get money?"
    correct_option: "Bank"
    distractors: ["Krankenhaus", "Apotheke", "Park"]
    accepted_answers: [{value: "Bank", status: "correct"}]
    feedback: "*Bank* means bank."
  de.a1.unit09.lesson01.exercise04.match_orte:
    instruction: "Match each description to the correct word."
    accepted_answers:
      - value:
          - {left: "a place where you can get money", right: "Bank"}
          - {left: "a place where you can see a doctor", right: "Krankenhaus"}
          - {left: "a place where you can buy medicine", right: "Apotheke"}
          - {left: "a place where you can walk outdoors", right: "Park"}
          - {left: "a place where someone else cooks your meal", right: "Restaurant"}
        status: "correct"
    feedback: "*Bank*=bank, *Krankenhaus*=hospital, *Apotheke*=pharmacy, *Park*=park, and *Restaurant*=restaurant."
  de.a1.unit09.lesson01.exercise05.write_restaurant:
    instruction: "Write the word for a place where you eat a meal you didn't cook."
    accepted_answers:
      - {value: "Restaurant", status: "correct"}
      - {value: "Restaurant.", status: "correct"}
      - {value: "das Restaurant", status: "correct"}
      - {value: "das Restaurant.", status: "correct"}
    feedback: "*Restaurant* means restaurant."

  de.a1.unit09.lesson02.exercise01.choose_neben:
    instruction: "The pharmacy and the park are right beside each other. Which sentence is correct?"
    correct_option: "Die Apotheke ist neben dem Park."
    distractors: ["Die Apotheke ist hinter dem Park.", "Die Apotheke ist vor dem Park.", "Die Apotheke ist zwischen dem Park."]
    accepted_answers: [{value: "Die Apotheke ist neben dem Park.", status: "correct"}]
    feedback: "*Die Apotheke ist neben dem Park* means 'The pharmacy is next to the park.'"
  de.a1.unit09.lesson02.exercise02.choose_gegenueber:
    instruction: "The pharmacy is on the opposite side of the street from the hospital. Which sentence is correct?"
    correct_option: "Die Apotheke ist gegenüber vom Krankenhaus."
    distractors: ["Die Apotheke ist neben dem Krankenhaus.", "Die Apotheke ist hinter dem Krankenhaus.", "Die Apotheke ist vor dem Krankenhaus."]
    accepted_answers: [{value: "Die Apotheke ist gegenüber vom Krankenhaus.", status: "correct"}]
    feedback: "*Die Apotheke ist gegenüber vom Krankenhaus* means 'The pharmacy is across from the hospital.'"
  de.a1.unit09.lesson02.exercise03.order_zwischen:
    instruction: "Put the words in order to say 'The pharmacy is between the bank and the park.'"
    accepted_answers: [{value: ["Die", "Apotheke", "ist", "zwischen", "der", "Bank", "und", "dem", "Park"], status: "correct"}]
    feedback: "The correct order is *Die Apotheke ist zwischen der Bank und dem Park.*"
  de.a1.unit09.lesson02.exercise04.choose_hinter:
    instruction: "The restaurant is at the back of the bank, on the other side from the street. Which sentence is correct?"
    correct_option: "Das Restaurant ist hinter der Bank."
    distractors: ["Das Restaurant ist vor der Bank.", "Das Restaurant ist neben der Bank.", "Das Restaurant ist gegenüber von der Bank."]
    accepted_answers: [{value: "Das Restaurant ist hinter der Bank.", status: "correct"}]
    feedback: "*Das Restaurant ist hinter der Bank* means 'The restaurant is behind the bank.'"
  de.a1.unit09.lesson02.exercise05.write_vor:
    instruction: "Write that the park is directly in front of the hospital."
    accepted_answers:
      - {value: "Der Park ist vor dem Krankenhaus", status: "correct"}
      - {value: "Der Park ist vor dem Krankenhaus.", status: "correct"}
    feedback: "*Der Park ist vor dem Krankenhaus* means 'The park is in front of the hospital.'"

  de.a1.unit09.lesson03.exercise01.listen_wo_frage:
    instruction: "Listen and select the question you hear."
    correct_option: "Wo ist die Bank"
    distractors: ["Ist es weit von hier", "Nein, es ist nicht weit", "Sie ist neben dem Park"]
    accepted_answers: [{value: "Wo ist die Bank", status: "correct"}]
    feedback: "*Wo ist die Bank?* means 'Where is the bank?'"
  de.a1.unit09.lesson03.exercise02.listen_wo_antwort:
    instruction: "Listen and select the answer you hear."
    correct_option: "Sie ist neben dem Park"
    distractors: ["Wo ist die Bank", "Ist es weit von hier", "Nein, es ist nicht weit"]
    accepted_answers: [{value: "Sie ist neben dem Park", status: "correct"}]
    feedback: "*Sie ist neben dem Park* means 'It's next to the park.'"
  de.a1.unit09.lesson03.exercise03.order_wo_frage:
    instruction: "Put the words in order to ask 'Where is the bank?'"
    accepted_answers: [{value: ["Wo", "ist", "die", "Bank"], status: "correct"}]
    feedback: "The correct order is *Wo ist die Bank?*"
  de.a1.unit09.lesson03.exercise04.reply_lage:
    instruction: "Felix asks: Wo ist die Bank? Reply: it's next to the park."
    accepted_answers:
      - {value: "Sie ist neben dem Park.", status: "correct"}
      - {value: "Sie ist neben dem Park", status: "correct"}
      - {value: "Die Bank ist neben dem Park.", status: "correct"}
      - {value: "Die Bank ist neben dem Park", status: "correct"}
    feedback: "*Sie ist neben dem Park* means 'It's next to the park.'"
  de.a1.unit09.lesson03.exercise05.write_nicht_weit:
    instruction: "Someone asks if it's far. Answer: no, it's not far."
    accepted_answers:
      - {value: "Nein, es ist nicht weit", status: "correct"}
      - {value: "Nein, es ist nicht weit.", status: "correct"}
      - {value: "Es ist nicht weit", status: "correct"}
      - {value: "Es ist nicht weit.", status: "correct"}
    feedback: "*Nein, es ist nicht weit* means 'No, it's not far.'"

  de.a1.unit09.lesson04.exercise01.listen_apotheke_lage:
    instruction: "Listen to the dialogue. Where does Anna say the pharmacy is?"
    correct_option: "Sie ist gegenüber vom Krankenhaus"
    distractors: ["Sie ist neben dem Park", "Ist es weit von hier", "Sie ist hinter der Bank"]
    accepted_answers: [{value: "Sie ist gegenüber vom Krankenhaus", status: "correct"}]
    feedback: "Anna says *Sie ist gegenüber vom Krankenhaus* -- 'It's across from the hospital.'"
  de.a1.unit09.lesson04.exercise02.listen_zwischen:
    instruction: "Listen again. What's the second landmark Anna gives?"
    correct_option: "Sie ist zwischen der Bank und dem Park"
    distractors: ["Sie ist hinter dem Restaurant", "Ist es weit von hier", "Sie ist vor dem Krankenhaus"]
    accepted_answers: [{value: "Sie ist zwischen der Bank und dem Park", status: "correct"}]
    feedback: "*Sie ist zwischen der Bank und dem Park* means 'It's between the bank and the park.'"
  de.a1.unit09.lesson04.exercise03.choose_weit_antwort:
    instruction: "Is the pharmacy far from where Felix is standing?"
    correct_option: "Nein, es ist nicht weit."
    distractors: ["Ja, es ist weit.", "Sie ist neben dem Park.", "Entschuldigung, wo ist die Apotheke?"]
    accepted_answers: [{value: "Nein, es ist nicht weit.", status: "correct"}]
    feedback: "*Nein, es ist nicht weit* means 'No, it's not far.'"
  de.a1.unit09.lesson04.exercise04.order_entschuldigung:
    instruction: "Put the words in order to say 'Excuse me, where is the pharmacy?'"
    accepted_answers: [{value: ["Entschuldigung", "wo", "ist", "die", "Apotheke"], status: "correct"}]
    feedback: "The correct order is *Entschuldigung, wo ist die Apotheke?*"
  de.a1.unit09.lesson04.exercise05.reply_als_anna:
    instruction: "Felix asks: Entschuldigung, wo ist die Apotheke? Ist es weit von hier? Reply as Anna: give the pharmacy's location, reassure it's not far, then give a second landmark."
    accepted_answers:
      - {value: "Sie ist gegenüber vom Krankenhaus. Nein, es ist nicht weit. Sie ist zwischen der Bank und dem Park.", status: "correct"}
      - {value: "Sie ist gegenüber vom Krankenhaus, und sie ist nicht weit -- sie ist zwischen der Bank und dem Park.", status: "correct"}
      - {value: "Sie ist gegenüber vom Krankenhaus Nein es ist nicht weit Sie ist zwischen der Bank und dem Park", status: "correct"}
      - {value: "Sie ist gegenueber vom Krankenhaus. Nein, es ist nicht weit. Sie ist zwischen der Bank und dem Park.", status: "correct"}
      - {value: "Sie ist gegenueber vom Krankenhaus, und sie ist nicht weit -- sie ist zwischen der Bank und dem Park.", status: "correct"}
      - {value: "Sie ist gegenueber vom Krankenhaus Nein es ist nicht weit Sie ist zwischen der Bank und dem Park", status: "correct"}
      - {value: "Sie ist gegenüber vom Krankenhaus. Es ist nicht weit. Sie ist zwischen der Bank und dem Park.", status: "correct"}
      - {value: "Sie ist gegenueber vom Krankenhaus. Es ist nicht weit. Sie ist zwischen der Bank und dem Park.", status: "correct"}
    feedback: "Anna's full reply gives the location, reassures the distance, and gives a second landmark."
  de.a1.unit09.lesson04.exercise06.speak_wegbeschreibung:
    instruction: "Answer out loud in Anna's role: give the pharmacy's location, reassure it's not far, then give a second landmark."
    accepted_answers:
      - {value: "Sie ist gegenüber vom Krankenhaus Nein es ist nicht weit Sie ist zwischen der Bank und dem Park", status: "correct"}
      - {value: "Sie ist gegenüber vom Krankenhaus. Nein, es ist nicht weit. Sie ist zwischen der Bank und dem Park.", status: "correct"}
      - {value: "Sie ist gegenüber vom Krankenhaus, und sie ist nicht weit -- sie ist zwischen der Bank und dem Park.", status: "correct"}
      - {value: "Sie ist gegenüber vom Krankenhaus Es ist nicht weit Sie ist zwischen der Bank und dem Park", status: "correct"}
    feedback: "This full answer covers the location, the distance reassurance, and the second landmark."
  de.a1.unit09.lesson03.exercise06.dictation_wo_ist_die_bank:
    instruction: "Type what you hear."
    accepted_answers: [{value: "Wo ist die Bank", status: correct}]
    orthography_strict: true
