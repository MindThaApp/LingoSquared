  de.a2.unit31.lesson02.exercise01.choose_alternative: {instruction: "Which formal station-staff question asks about an alternative connection?", correct_option: "Gibt es eine alternative Verbindung?", distractors: ["Ich verpasse meinen Anschluss.", "Der Zug hat Verspätung.", "Ich komme später."], accepted_answers: [{value: "Gibt es eine alternative Verbindung?", status: "correct"}], feedback: "*Gibt es eine alternative Verbindung?* asks staff about another connection."}
