  de.a2.unit31.lesson02.exercise04.reply_staff: {instruction: "Reply formally to station staff with exactly this content: apologize, say the train has a twenty-minute delay, say you will miss your connection, and ask whether there is an alternative connection.", accepted_answers: [{value: "Entschuldigung, der Zug hat zwanzig Minuten Verspätung. Ich verpasse meinen Anschluss. Gibt es eine alternative Verbindung?", status: "correct"}, {value: "Entschuldigung der Zug hat zwanzig Minuten Verspätung Ich verpasse meinen Anschluss Gibt es eine alternative Verbindung", status: "correct"}], feedback: "The formal staff reply explains the disruption, states the missed connection, and asks for an alternative connection."}
