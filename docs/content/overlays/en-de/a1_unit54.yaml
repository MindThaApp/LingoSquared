course:
  title: German A1
  description: 'Beginner German for describing free-time activities: hobby vocabulary, frequency expressions, asking and answering what someone does in their free time, and comparing two people''s hobbies.'
units:
  de.a1.unit54.hobbys:
    title: Hobbies and free time
