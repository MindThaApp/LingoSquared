teaching:
  de.a1.unit54.lesson01.teach.lesen_sport_treiben:
    title: Reading, exercising, cooking
    gloss: to read, to exercise / play sports, to cook
    note: 'Three common hobby verbs: *lesen* (to read), *Sport treiben* (to exercise or play sports) and *kochen* (to cook). Sport is a noun, so it is capitalised.'
    example_gloss:
    - I like reading a book.
    - I exercise on Saturdays.
    - I like cooking for friends.
  de.a1.unit54.lesson01.teach.die_freizeit:
    title: Free time
    gloss: free time
    note: '*Die Freizeit* is a feminine noun: always learn it with its article die. It is the key word for talking about hobbies.'
    example_gloss: In my free time, I like to read.
  de.a1.unit54.lesson01.teach.in_meiner_freizeit:
    title: Saying what you do in your free time
    gloss: In my free time, I like to read.
    note: '*Lese* is the ich form of *lesen* (to read). The sentence starts with a time phrase, so the verb is still second: in meiner Freizeit lese ich gern.'
  de.a1.unit54.lesson02.teach.musik_hoeren_zeichnen:
    title: Music, drawing, gaming
    gloss: to listen to music, to draw, to game
    note: 'Three more hobby phrases: *Musik hören* (to listen to music), *zeichnen* (to draw) and *Videospiele spielen* (to play video games). Musik and Videospiele are nouns, so they are capitalised.'
    example_gloss:
    - I like listening to music.
    - I often draw.
    - I like gaming with friends.
  de.a1.unit54.lesson02.teach.ich_hoere_gern:
    title: Saying you like listening to music
    gloss: I like listening to music.
    note: German says *Musik hören* with no preposition, unlike English 'listen to music'.
  de.a1.unit54.lesson02.teach.ich_spiele_gern:
    title: Saying you like gaming with friends
    gloss: I like gaming with friends.
    note: '*Mit Freunden* (with friends): mit is always followed by the dative case, so Freunde becomes Freunden.'
  de.a1.unit54.lesson03.teach.immer_oft_manchmal:
    title: Always, often, sometimes, never
    gloss: always, often, sometimes, never
    note: 'The four core frequency adverbs: immer, oft, manchmal, nie. They usually stand right after the verb: ich spiele nie.'
    example_gloss:
    - I always exercise on Saturdays.
    - I often read a book.
    - I sometimes draw.
    - I never game.
  de.a1.unit54.lesson03.teach.jede_woche_jedes:
    title: Every week, every weekend
    gloss: every week, every weekend
    note: '*Jede Woche* and *jedes Wochenende* both mean ''every'', but the ending changes with the noun''s gender: see the next card.'
    example_gloss:
    - I cook for friends every week.
    - I exercise every weekend.
  de.a1.unit54.lesson03.teach.die_woche_jede:
    title: Jede vs. jedes
    gloss: Die Woche is feminine, so it is jede Woche. Das Wochenende is neuter, so it is jedes Wochenende.
    note: '*Woche* is feminine (*die Woche*), so it takes *jede*; *Wochenende* is neuter (*das Wochenende*), so it takes *jedes*. Learn each noun with its article and you know the ending.'
  de.a1.unit54.lesson03.teach.was_machst_du:
    title: Asking about free time
    gloss: What do you do in your free time?
    note: This is the core question of this unit -- reuse it to ask anyone about their hobbies.
  de.a1.unit54.lesson04.teach.anna_wir_gehen:
    title: Anna brings up hobbies
    gloss: 'Anna: We often walk together. But what else do you do in your free time, Felix?'
    note: '*Wir gehen oft zusammen spazieren* uses gehen plus a second verb: the conjugated verb gehen is second, the infinitive spazieren goes to the end.'
  de.a1.unit54.lesson04.teach.felix_ich_koche:
    title: Felix's hobbies
    gloss: 'Felix: I like cooking, at home too. And I exercise often.'
    note: '*Auch zu Hause* (at home too) clarifies Felix cooks for fun, not just at his restaurant job.'
  de.a1.unit54.lesson04.teach.anna_kochst_du:
    title: Anna is surprised
    gloss: 'Anna: You cook at home too? You already cook all day at your job!'
    note: '*Den ganzen Tag* (the whole day) is in the accusative case, which is why der Tag becomes den Tag. Time spans like this take the accusative.'
  de.a1.unit54.lesson04.teach.felix_ja_aber:
    title: Felix explains
    gloss: 'Felix: Yes, but I find cooking relaxing. And you, what do you like doing?'
    note: '*Kochen finde ich entspannend* puts Kochen first for emphasis. The verb still stays second, so ich moves behind it.'
  de.a1.unit54.lesson04.teach.anna_ich_lese:
    title: Anna's hobbies
    gloss: 'Anna: I like reading and I often listen to music.'
    note: Combines two hobby verbs from lessons 01-02 in one sentence with *und* (and).
  de.a1.unit54.lesson04.teach.felix_spielst_du:
    title: Felix asks about gaming
    gloss: 'Felix: Do you also game?'
    note: 'A short yes/no question: the verb comes first, spielst du ...?'
  de.a1.unit54.lesson04.teach.anna_nein_ich:
    title: Anna answers
    gloss: 'Anna: No, I never game. But I sometimes draw!'
    note: '*Nie* (never) and *manchmal* (sometimes) from lesson 03, contrasted in one answer. Both stand right after the verb.'
  de.a1.unit54.lesson05.teach.felix_und_ich:
    title: Comparing hobbies
    gloss: Felix and I often walk together. But we also have other hobbies. Felix likes cooking, at home too, and he exercises often. I like reading and I often listen to music. I sometimes draw, but I never game. What do you like doing in your free time?
    note: Anna's message recaps facts from lesson04 and ends by asking the reader the unit's core question.
    glosses:
      spazieren: walk
      oft: often
      zusammen: together
      andere: other
      kocht: cooks
      gern: likes to
      Hause: at home
      Sport: exercises
      lese: read
      höre: listen
      Musik: music
      zeichne: draw
      manchmal: sometimes
      spiele: play video games
      nie: never
      freien: free
      Zeit: time
  de.a1.unit54.lesson06.teach.felix_was_machst:
    title: Felix asks about the weekend
    gloss: 'Felix: What are you doing this weekend?'
    note: '*Dieses Wochenende* (this weekend) has the neuter ending -es, because das Wochenende is neuter.'
  de.a1.unit54.lesson06.teach.anna_ich_weiss:
    title: Anna is undecided
    gloss: 'Anna: I don''t know yet. I like reading, but I also want to go outside.'
    note: '*Nach draußen* (outside, literally ''to outside'') is a common way to say you want to leave the house.'
  de.a1.unit54.lesson06.teach.felix_gehen_wir:
    title: Felix suggests a plan
    gloss: 'Felix: Shall we walk together? I''ll cook for us afterward.'
    note: '*Danach* (afterwards) comes first, so the verb comes next and the subject after it: danach koche ich.'
  de.a1.unit54.lesson06.teach.anna_gute_idee:
    title: Anna agrees
    gloss: 'Anna: Good idea! I like both walking and cooking.'
    note: '*Gern* after the verb shows you enjoy something: ich gehe gern spazieren, ich koche gern. It works with almost any verb.'
  de.a1.unit54.lesson06.teach.felix_perfekt_dann:
    title: Felix confirms
    gloss: 'Felix: Perfect. Then I''ll see you Saturday!'
    note: 'A friendly closing line confirming the plan for *Samstag* (Saturday). Days of the week take *am*: am Samstag.'
