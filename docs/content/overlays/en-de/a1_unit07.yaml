course:
  title: "German A1"
  description: "Learn A1-level German for everyday greetings and short social exchanges, with detailed English explanations."

units:
  de.a1.unit07.essen: {title: "Food, drink, and ordering"}

teaching:
  de.a1.unit07.lesson01.teach.kaffee: {title: "Kaffee", gloss: "coffee", note: "*Kaffee* is masculine (der Kaffee).", example_gloss: "I'd like a coffee, please."}
  de.a1.unit07.lesson01.teach.tee: {title: "Tee", gloss: "tea", note: "*Tee* is masculine (der Tee).", example_gloss: "I like drinking tea."}
  de.a1.unit07.lesson01.teach.wasser: {title: "Wasser", gloss: "water", note: "*Wasser* is neuter (das Wasser).", example_gloss: "I'd like a water, please."}
  de.a1.unit07.lesson01.teach.brot: {title: "Brot", gloss: "bread", note: "*Brot* is neuter (das Brot).", example_gloss: "I like eating bread."}
  de.a1.unit07.lesson01.teach.suppe: {title: "Suppe", gloss: "soup", note: "*Suppe* is feminine (die Suppe).", example_gloss: "I'd like a soup, please."}
  de.a1.unit07.lesson01.teach.salat: {title: "Salat", gloss: "salad", note: "*Salat* is masculine (der Salat).", example_gloss: "I'd like a salad, please."}
  de.a1.unit07.lesson01.teach.sandwich: {title: "Sandwich", gloss: "sandwich", note: "*Sandwich* is neuter (das Sandwich).", example_gloss: "I'd like a sandwich, please."}
  de.a1.unit07.lesson03.teach.speisekarte: {title: "Speisekarte", gloss: "menu", note: "*Speisekarte* is feminine (die Speisekarte).", example_gloss: "I'm reading the menu."}
  de.a1.unit07.lesson03.teach.preis: {title: "Preis", gloss: "price", note: "*Preis* is masculine (der Preis).", example_gloss: "The price is good."}
  de.a1.unit07.lesson04.teach.hallo: {title: "Hallo", gloss: "hello / hi", note: "*Hallo* is a casual, all-purpose greeting.", example_gloss: "Hello, Felix!"}
  de.a1.unit07.lesson04.teach.was_moechten_sie: {title: "Was möchten Sie", gloss: "what would you like (formal)", note: "*Was möchten Sie?* is the standard formal way a server asks what you'd like to order.", example_gloss: "Hello Felix! What would you like?"}
  de.a1.unit07.lesson04.teach.macht_euro: {title: "macht neun Euro", gloss: "that's nine euros", note: "*macht* here means 'comes to'/'that's' when stating a total.", example_gloss: "Good, that's nine euros."}

exercises:
  de.a1.unit07.lesson01.exercise01.listen_suppe:
    instruction: "Listen and select the food or drink word you hear."
    correct_option: "Suppe"
    distractors: ["Kaffee", "Brot", "Salat"]
    accepted_answers: [{value: "Suppe", status: "correct"}]
    feedback: "*Suppe* means soup."
  de.a1.unit07.lesson01.exercise02.choose_heissgetraenk:
    instruction: "Which of these is a hot drink?"
    correct_option: "Kaffee"
    distractors: ["Wasser", "Brot", "Salat"]
    accepted_answers: [{value: "Kaffee", status: "correct"}]
    feedback: "*Kaffee* means coffee."
  de.a1.unit07.lesson01.exercise03.choose_brot:
    instruction: "Which word means bread?"
    correct_option: "Brot"
    distractors: ["Suppe", "Salat", "Wasser"]
    accepted_answers: [{value: "Brot", status: "correct"}]
    feedback: "*Brot* means bread."
  de.a1.unit07.lesson01.exercise04.match_essenswoerter:
    instruction: "Match each description to the correct food or drink word."
    accepted_answers:
      - value:
          - {left: "heißes Getränk", right: "Kaffee"}
          - {left: "heißes Getränk mit Blättern", right: "Tee"}
          - {left: "Getränk ohne Geschmack", right: "Wasser"}
          - {left: "gebackenes Essen", right: "Brot"}
          - {left: "warme Flüssigkeit zum Essen", right: "Suppe"}
          - {left: "meist kaltes Gemüsegericht", right: "Salat"}
        status: "correct"
    feedback: "*Kaffee*=coffee, *Tee*=tea, *Wasser*=water, *Brot*=bread, *Suppe*=soup, *Salat*=salad."
  de.a1.unit07.lesson01.exercise05.write_sandwich:
    instruction: "Write the word for bread with something inside it."
    accepted_answers:
      - {value: "Sandwich", status: "correct"}
      - {value: "Sandwich.", status: "correct"}
    feedback: "*Sandwich* means sandwich."

  de.a1.unit07.lesson02.exercise01.listen_bestellsatz:
    instruction: "Listen and select the sentence you hear."
    correct_option: "Ich möchte einen Kaffee, bitte"
    distractors: ["Ich möchte ein Sandwich, bitte", "Sonst noch etwas", "Nein, das ist alles, danke"]
    accepted_answers: [{value: "Ich möchte einen Kaffee, bitte", status: "correct"}]
    feedback: "*Ich möchte einen Kaffee, bitte* means 'I'd like a coffee, please.'"
  de.a1.unit07.lesson02.exercise02.choose_sandwich_bestellung:
    instruction: "Politely order a sandwich."
    correct_option: "Ich möchte ein Sandwich, bitte."
    distractors: ["Ich möchte einen Sandwich, bitte.", "Ich möchte eine Sandwich, bitte.", "Ich möchte einen Kaffee, bitte."]
    accepted_answers: [{value: "Ich möchte ein Sandwich, bitte.", status: "correct"}]
    feedback: "*Ich möchte ein Sandwich, bitte* means 'I'd like a sandwich, please.' *Sandwich* is neuter, so it stays *ein* -- it does NOT change to *einen* the way masculine *Kaffee* does."
  de.a1.unit07.lesson02.exercise03.order_kaffee_bestellung:
    instruction: "Put the words in order to say 'I'd like a coffee, please.'"
    accepted_answers: [{value: ["Ich", "möchte", "einen", "Kaffee", "bitte"], status: "correct"}]
    feedback: "The correct order is *Ich möchte einen Kaffee, bitte.*"
  de.a1.unit07.lesson02.exercise04.reply_sonst_noch_etwas:
    instruction: "Felix asks: Sonst noch etwas? Reply: no, that's all, thanks."
    accepted_answers:
      - {value: "Nein, das ist alles, danke.", status: "correct"}
      - {value: "Nein, das ist alles, danke", status: "correct"}
    feedback: "*Nein, das ist alles, danke* means 'No, that's all, thanks.'"
  de.a1.unit07.lesson02.exercise05.write_bestellung:
    instruction: "Write how you would politely order a coffee."
    accepted_answers:
      - {value: "Ich möchte einen Kaffee, bitte", status: "correct"}
      - {value: "Ich möchte einen Kaffee, bitte.", status: "correct"}
    feedback: "*Ich möchte einen Kaffee, bitte* means 'I'd like a coffee, please.'"

  de.a1.unit07.lesson03.exercise01.read_kaffee_preis:
    instruction: "How much is the coffee?"
    correct_option: "3 €"
    distractors: ["2 €", "1 €", "5 €"]
    accepted_answers: [{value: "3 €", status: "correct"}]
    feedback: "The menu lists *Kaffee - 3 €* -- coffee is 3 euros. Note the euro symbol comes AFTER the number, unlike the dollar sign."
  de.a1.unit07.lesson03.exercise02.read_suppe_preis:
    instruction: "How much is the soup?"
    correct_option: "5 €"
    distractors: ["3 €", "4 €", "6 €"]
    accepted_answers: [{value: "5 €", status: "correct"}]
    feedback: "The menu lists *Suppe - 5 €* -- soup is 5 euros."
  de.a1.unit07.lesson03.exercise03.choose_billigstes:
    instruction: "Which item on the menu is the cheapest?"
    correct_option: "Brot"
    distractors: ["Tee", "Salat", "Kaffee"]
    accepted_answers: [{value: "Brot", status: "correct"}]
    feedback: "*Brot* at 1 € is the cheapest item on the menu."
  de.a1.unit07.lesson03.exercise04.match_speisekarte_preise:
    instruction: "Match each menu item to its price."
    accepted_answers:
      - value:
          - {left: "Kaffee", right: "3 €"}
          - {left: "Tee", right: "2 €"}
          - {left: "Brot", right: "1 €"}
          - {left: "Salat", right: "4 €"}
          - {left: "Suppe", right: "5 €"}
          - {left: "Sandwich", right: "6 €"}
        status: "correct"
    feedback: "Kaffee=3 €, Tee=2 €, Brot=1 €, Salat=4 €, Suppe=5 €, Sandwich=6 €."
  de.a1.unit07.lesson03.exercise05.write_speisekarte_artikel:
    instruction: "Write the most expensive item and its price."
    accepted_answers:
      - {value: "Sandwich 6 €", status: "correct"}
      - {value: "Sandwich - 6 €", status: "correct"}
      - {value: "Sandwich, 6 €", status: "correct"}
    feedback: "*Sandwich* at 6 € is the most expensive item."

  de.a1.unit07.lesson04.exercise01.listen_bestellung:
    instruction: "Listen to the dialogue. What does Felix order?"
    correct_option: "Ich möchte einen Kaffee und ein Sandwich, bitte"
    distractors: ["das macht neun Euro", "Sonst noch etwas", "Ich möchte einen Tee und eine Suppe, bitte"]
    accepted_answers: [{value: "Ich möchte einen Kaffee und ein Sandwich, bitte", status: "correct"}]
    feedback: "Felix says *Ich möchte einen Kaffee und ein Sandwich, bitte* -- 'I'd like a coffee and a sandwich, please.'"
  de.a1.unit07.lesson04.exercise02.listen_preis:
    instruction: "Listen again. How much does Anna say the order costs?"
    correct_option: "das macht neun Euro"
    distractors: ["Ich möchte einen Kaffee und ein Sandwich, bitte", "das macht sechs Euro", "Zum Hier-Essen, bitte"]
    accepted_answers: [{value: "das macht neun Euro", status: "correct"}]
    feedback: "*Das macht neun Euro* means 'That's nine euros' -- *Kaffee* (3 €) plus *Sandwich* (6 €) is 9 €."
  de.a1.unit07.lesson04.exercise03.choose_hier_essen_antwort:
    instruction: "Felix wants to eat in the cafe, not take the food away. What does he say?"
    correct_option: "Zum Hier-Essen, bitte."
    distractors: ["Zum Mitnehmen, bitte.", "Sonst noch etwas?", "Das ist alles, danke."]
    accepted_answers: [{value: "Zum Hier-Essen, bitte.", status: "correct"}]
    feedback: "*Zum Hier-Essen, bitte* means 'For here, please.'"
  de.a1.unit07.lesson04.exercise04.order_hier_oder_mitnehmen_frage:
    instruction: "Put the words in order to ask 'For here or to go?'"
    accepted_answers: [{value: ["Zum", "Hier-Essen", "oder", "zum", "Mitnehmen"], status: "correct"}]
    feedback: "The correct order is *Zum Hier-Essen oder zum Mitnehmen?*"
  de.a1.unit07.lesson04.exercise05.reply_als_felix:
    instruction: "Order a coffee and a sandwich, say that's all, and say you'll eat here."
    accepted_answers:
      - {value: "Ich möchte einen Kaffee und ein Sandwich, bitte. Nein, das ist alles, danke. Zum Hier-Essen, bitte.", status: "correct"}
      - {value: "Ich möchte einen Kaffee und ein Sandwich, bitte, und das ist alles, danke -- zum Hier-Essen, bitte.", status: "correct"}
      - {value: "Ich möchte einen Kaffee und ein Sandwich bitte Nein das ist alles danke Zum Hier-Essen bitte", status: "correct"}
    feedback: "A complete reply orders both items, confirms that's all, then says you'll eat there."
  de.a1.unit07.lesson04.exercise06.speak_bestellung:
    instruction: "Order a coffee and a sandwich, say that's all, and say you'll eat here."
    accepted_answers:
      - {value: "Ich möchte einen Kaffee und ein Sandwich bitte Nein das ist alles danke Zum Hier-Essen bitte", status: "correct"}
      - {value: "Ich möchte einen Kaffee und ein Sandwich, bitte. Nein, das ist alles, danke. Zum Hier-Essen, bitte.", status: "correct"}
    feedback: "This full answer covers the order, the confirmation, and the for-here choice."
  de.a1.unit07.lesson02.exercise06.dictation_ich_moechte_einen_kaffee_bitte:
    instruction: "Type what you hear."
    correct_option: "Ich möchte einen Kaffee, bitte"
    accepted_answers: [{value: "Ich möchte einen Kaffee, bitte", status: correct}]
    orthography_strict: true
