review: {"status": "unreviewed", "required_next_reviewer": "native_speaker_review", "notes": "English overlay for the indirect-questions unit (question word or ob plus verb-final clause, polite frames with wissen and können). OPEN NATIVE QUESTIONS: none beyond the realization notes."}
course:
  title: "German A2"
  description: "Grammar-led A2 German continuing the Anna and Felix storyline."
  learning_goal: "Give reasons, order events, say what things are for, talk about real conditions, ask indirect questions and pass on messages in German."
units:
  de.a2.unit113.indirekte_fragen: {"title": "Do You Know Where ...?", "description": "Ask politely for information with an embedded question: weißt du, wo ...? weißt du, ob ...? können Sie mir sagen, wann ...?"}
lessons:
  de.a2.unit113.lesson01.w_fragen: {"title": "Do You Know Where the Station Is?"}
  de.a2.unit113.lesson02.ob: {"title": "Do You Know Whether ...?"}
  de.a2.unit113.lesson03.hoeflich: {"title": "Excuse Me, Do You Know ...?"}
  de.a2.unit113.lesson04.verb_ende: {"title": "The Verb at the End"}
  de.a2.unit113.lesson05.neu_in_der_stadt: {"title": "Felix Is New Here"}
  de.a2.unit113.lesson06.im_gespraech: {"title": "Felix Asks Anna"}
teaching:
  de.a2.unit113.lesson01.teach.wissen: {"title": "Asking if someone knows", "gloss": "to know / where / when / what time / why", "example_gloss": ["Do you know where the station is?", "Do you know when the train leaves?", "Do you know what time it is?", "Do you know why Nina isn't coming?"], "note": "These questions are more polite than a direct question."}
  de.a2.unit113.lesson01.teach.gn_indirekt: {"title": "Direct and indirect question", "gloss": "Where is the station? Do you know where the station is?", "note": "In the embedded question the verb goes to the end: *wo der Bahnhof ist*, not *wo ist der Bahnhof*."}
  de.a2.unit113.lesson01.teach.gn_komma: {"title": "Comma before the question word", "gloss": "Do you know where the café is? Do you know what time it is?", "note": "A comma separates *Weißt du* from the embedded question. The question mark stands at the end of the whole sentence."}
  de.a2.unit113.lesson01.teach.gn_wissen: {"title": "The verb wissen", "gloss": "I know, you know, he knows, we know, you (plural) know, they know", "note": "*Wissen* is irregular in the singular: *ich weiß, du weißt, er weiß*."}
  de.a2.unit113.lesson02.teach.ob: {"title": "Whether", "gloss": "whether, if / open / on time / to begin / I want to know", "example_gloss": ["Do you know whether Nina is coming today?", "I don't know whether the shop is open.", "Can you tell me whether the train is on time?", "I want to know whether the party starts at eight."], "note": "*Ob* introduces an embedded yes/no question."}
  de.a2.unit113.lesson02.teach.gn_ob: {"title": "Ob for yes or no", "gloss": "Is Nina coming today? Do you know whether Nina is coming today?", "note": "A question that can be answered with yes or no has no question word. In the embedded form, use *ob*."}
  de.a2.unit113.lesson02.teach.gn_wort_ob: {"title": "Question word or ob", "gloss": "Do you know where Nina is? Do you know whether Nina is here?", "note": "With a question word (*wo, wann, warum*) you keep that word. With a yes/no question you add *ob*. The verb is last in both."}
  de.a2.unit113.lesson02.teach.gn_nicht_wissen: {"title": "Saying you don't know", "gloss": "I don't know whether the shop is open.", "note": "The same pattern works after *ich weiß nicht*. Do not use *wenn* here."}
  de.a2.unit113.lesson03.teach.hoeflich: {"title": "Asking strangers", "gloss": "excuse me / post office / how much / to cost / to open", "example_gloss": ["Excuse me, do you know where the post office is?", "Can you tell me how much that costs?", "Do you know when the café opens?", "I want to know how I get to the station."], "note": "To strangers use the formal *Sie*."}
  de.a2.unit113.lesson03.teach.gn_sie: {"title": "Polite frames with Sie", "gloss": "Do you know where the post office is? Can you tell me how much that costs?", "note": "With strangers use *Wissen Sie ...?* or *Können Sie mir sagen ...?*. The embedded part follows after a comma."}
  de.a2.unit113.lesson03.teach.gn_hoeflich: {"title": "Why indirect is polite", "gloss": "Where is the post office? Excuse me, do you know where the post office is?", "note": "The embedded question sounds softer than the direct one, especially with *Entschuldigung*."}
  de.a2.unit113.lesson03.teach.gn_wie: {"title": "Wie and the verb", "gloss": "I want to know how I get to the station.", "note": "*Wie* works like the other question words: subject next, verb last."}
  de.a2.unit113.lesson04.teach.ende: {"title": "Longer verbs", "gloss": "to start / to come along / to buy / who / what", "example_gloss": ["Do you know when the film starts?", "I don't know why Jonas can't come.", "Do you know what Anna bought?", "I want to know who is coming along tomorrow."], "note": "Separable verbs, modal verbs and the perfect all go to the end."}
  de.a2.unit113.lesson04.teach.gn_trennbar: {"title": "Separable verb joined", "gloss": "When does the film start? Do you know when the film starts?", "note": "In the embedded question a separable verb is one word: *anfängt*, *mitkommt*."}
  de.a2.unit113.lesson04.teach.gn_modal: {"title": "Modal verb last", "gloss": "Jonas can't come. I don't know why Jonas can't come.", "note": "With a modal verb, the infinitive comes first and the conjugated modal verb last: *kommen kann*."}
  de.a2.unit113.lesson04.teach.gn_perfekt: {"title": "Perfect: auxiliary last", "gloss": "Anna bought that. Do you know what Anna bought?", "note": "In the perfect, the auxiliary is last: *gekauft hat*."}
  de.a2.unit113.lesson05.teach.neu: {"title": "Words for the story", "gloss": "new / town / question / to help / supermarket / there is", "example_gloss": ["Felix is new in town.", "He has many questions.", "Anna can help him.", "Is there a supermarket here?"], "note": "Words for the story you will read."}
  de.a2.unit113.lesson05.teach.gn_text: {"title": "Two kinds of embedded question", "gloss": "He doesn't know where the post office is. He wants to know whether there is a supermarket here.", "note": "Look for the question word *wo* and for *ob*; the verb is last in both."}
  de.a2.unit113.lesson05.teach.lesen_neu: {"title": "Felix has questions", "gloss": "Felix is new in town and has many questions. He doesn't know where the post office is. He also doesn't know when the café opens. He wants to know whether there is a supermarket here. Anna can help him. She knows where everything is.", "note": "Embedded questions inside a short story."}
  de.a2.unit113.lesson06.teach.felix_post: {"title": "Felix asks", "gloss": "Felix: Hi Anna! Do you know where the post office is?"}
  de.a2.unit113.lesson06.teach.anna_bahnhof: {"title": "Anna answers", "gloss": "Anna: Yes, it is next to the station."}
  de.a2.unit113.lesson06.teach.felix_wann: {"title": "Felix asks again", "gloss": "Felix: And do you know when it opens?"}
  de.a2.unit113.lesson06.teach.anna_acht: {"title": "Anna is unsure", "gloss": "Anna: I don't know whether it already opens at eight."}
  de.a2.unit113.lesson06.teach.felix_super: {"title": "Felix asks about a supermarket", "gloss": "Felix: Okay. Do you also know whether there is a supermarket?"}
  de.a2.unit113.lesson06.teach.anna_zeigen: {"title": "Anna offers", "gloss": "Anna: Yes, I'll show you where it is."}
  de.a2.unit113.lesson06.teach.felix_danke: {"title": "Felix thanks her", "gloss": "Felix: Thanks!"}
exercises:
  de.a2.unit113.lesson01.exercise01.wahl_bahnhof: {"instruction": "Choose the correct German sentence.", "correct_option": "Weißt du, wo der Bahnhof ist?", "distractors": ["Weißt du, wo ist der Bahnhof?", "Weißt du, wo der Bahnhof?", "Weißt du, wo der ist Bahnhof?"], "accepted_answers": [{"value": "Weißt du, wo der Bahnhof ist?", "status": "correct"}], "feedback": "The verb *ist* goes last."}
  de.a2.unit113.lesson01.exercise02.wahl_zug: {"instruction": "Choose the correct German sentence.", "correct_option": "Weißt du, wann der Zug fährt?", "distractors": ["Weißt du, wann fährt der Zug?", "Weißt du, wann der fährt Zug?", "Weißt du, der Zug wann fährt?"], "accepted_answers": [{"value": "Weißt du, wann der Zug fährt?", "status": "correct"}], "feedback": "*Fährt* is last."}
  de.a2.unit113.lesson01.exercise03.paare_wissen: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Weißt du, wo der Bahnhof ist?", "right": "Do you know where the station is?"}, {"left": "Weißt du, wann der Zug fährt?", "right": "Do you know when the train leaves?"}, {"left": "Weißt du, wie spät es ist?", "right": "Do you know what time it is?"}, {"left": "Weißt du, warum Nina nicht kommt?", "right": "Do you know why Nina isn't coming?"}, {"left": "Weißt du, wo das Café ist?", "right": "Do you know where the café is?"}, {"left": "Ich weiß es nicht.", "right": "I don't know."}], "status": "correct"}], "feedback": "Questions with weißt du."}
  de.a2.unit113.lesson01.exercise04.ordnen_spaet: {"instruction": "Put the words in order to say 'Do you know what time it is?'", "correct_option": "Weißt du wie spät es ist", "accepted_answers": [{"value": "Weißt du wie spät es ist", "status": "correct"}], "feedback": "*Ist* is last."}
  de.a2.unit113.lesson01.exercise05.luecke_ist: {"instruction": "Complete with the verb.", "correct_option": "ist", "accepted_answers": [{"value": "ist", "status": "correct"}], "feedback": "The verb stands last."}
  de.a2.unit113.lesson01.exercise06.uebersetzen_nina: {"instruction": "Translate into German.", "accepted_answers": [{"value": "Weißt du, warum Nina nicht kommt?", "status": "correct"}, {"value": "Weißt du warum Nina nicht kommt?", "status": "correct"}, {"value": "Weisst du, warum Nina nicht kommt?", "status": "correct"}, {"value": "Weisst du warum Nina nicht kommt?", "status": "correct"}], "feedback": "*Kommt* last."}
  de.a2.unit113.lesson01.exercise07.schreiben_cafe: {"instruction": "Write the requested German sentence.", "accepted_answers": [{"value": "Weißt du, wo das Café ist?", "status": "correct"}, {"value": "Weißt du wo das Café ist?", "status": "correct"}, {"value": "Weisst du, wo das Café ist?", "status": "correct"}, {"value": "Weisst du wo das Café ist?", "status": "correct"}], "feedback": "*Wo das Café ist*.", "correct_option": "Weißt du, wo das Café ist?"}
  de.a2.unit113.lesson02.exercise01.wahl_nina: {"instruction": "Choose the correct German sentence.", "correct_option": "Weißt du, ob Nina heute kommt?", "distractors": ["Weißt du, ob kommt Nina heute?", "Weißt du, ob Nina kommt heute?", "Weißt du, wenn Nina heute kommt?"], "accepted_answers": [{"value": "Weißt du, ob Nina heute kommt?", "status": "correct"}], "feedback": "*Ob* plus the verb last."}
  de.a2.unit113.lesson02.exercise02.wahl_laden: {"instruction": "Choose the correct German sentence.", "correct_option": "Ich weiß nicht, ob der Laden offen ist.", "distractors": ["Ich weiß nicht, ob ist der Laden offen.", "Ich weiß nicht, ob der Laden ist offen.", "Ich weiß nicht, wenn der Laden offen ist."], "accepted_answers": [{"value": "Ich weiß nicht, ob der Laden offen ist.", "status": "correct"}], "feedback": "*Ob*, then *ist* last."}
  de.a2.unit113.lesson02.exercise03.paare_ob: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Weißt du, ob Nina heute kommt?", "right": "Do you know whether Nina is coming today?"}, {"left": "Ich weiß nicht, ob der Laden offen ist.", "right": "I don't know whether the shop is open."}, {"left": "Können Sie mir sagen, ob der Zug pünktlich ist?", "right": "Can you tell me whether the train is on time?"}, {"left": "Ich möchte wissen, ob die Party um acht beginnt.", "right": "I want to know whether the party starts at eight."}, {"left": "Weißt du, ob Nina da ist?", "right": "Do you know whether Nina is here?"}, {"left": "ob der Laden offen ist", "right": "whether the shop is open"}], "status": "correct"}], "feedback": "Questions with ob."}
  de.a2.unit113.lesson02.exercise04.ordnen_ob: {"instruction": "Put the words in order to say 'Do you know whether Nina is coming today?'", "correct_option": "Weißt du ob Nina heute kommt", "accepted_answers": [{"value": "Weißt du ob Nina heute kommt", "status": "correct"}], "feedback": "*Kommt* is last."}
  de.a2.unit113.lesson02.exercise05.luecke_ob: {"instruction": "Complete with the word.", "correct_option": "ob", "accepted_answers": [{"value": "ob", "status": "correct"}], "feedback": "A yes/no question needs *ob*."}
  de.a2.unit113.lesson02.exercise06.uebersetzen_zug: {"instruction": "Translate into German.", "accepted_answers": [{"value": "Können Sie mir sagen, ob der Zug pünktlich ist?", "status": "correct"}, {"value": "Können Sie mir sagen ob der Zug pünktlich ist?", "status": "correct"}, {"value": "Koennen Sie mir sagen, ob der Zug puenktlich ist?", "status": "correct"}, {"value": "Koennen Sie mir sagen ob der Zug puenktlich ist?", "status": "correct"}], "feedback": "Formal *Sie*; *ist* last."}
  de.a2.unit113.lesson02.exercise07.schreiben_party: {"instruction": "Write the requested German sentence.", "accepted_answers": [{"value": "Ich möchte wissen, ob die Party um acht beginnt.", "status": "correct"}, {"value": "Ich möchte wissen ob die Party um acht beginnt.", "status": "correct"}, {"value": "Ich moechte wissen, ob die Party um acht beginnt.", "status": "correct"}, {"value": "Ich moechte wissen ob die Party um acht beginnt.", "status": "correct"}], "feedback": "*Beginnt* last.", "correct_option": "Ich möchte wissen, ob die Party um acht beginnt."}
  de.a2.unit113.lesson03.exercise01.wahl_post: {"instruction": "Choose the correct German sentence.", "correct_option": "Entschuldigung, wissen Sie, wo die Post ist?", "distractors": ["Entschuldigung, wissen Sie, wo ist die Post?", "Entschuldigung, wissen Sie, wo die Post?", "Entschuldigung, wissen Sie, die Post wo ist?"], "accepted_answers": [{"value": "Entschuldigung, wissen Sie, wo die Post ist?", "status": "correct"}], "feedback": "*Ist* goes last."}
  de.a2.unit113.lesson03.exercise02.wahl_kostet: {"instruction": "Choose the correct German sentence.", "correct_option": "Können Sie mir sagen, wie viel das kostet?", "distractors": ["Können Sie mir sagen, wie viel kostet das?", "Können Sie mir sagen, wie das viel kostet?", "Können Sie mir sagen, wie viel das kosten?"], "accepted_answers": [{"value": "Können Sie mir sagen, wie viel das kostet?", "status": "correct"}], "feedback": "*Kostet* is last."}
  de.a2.unit113.lesson03.exercise03.paare_hoeflich: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Entschuldigung, wissen Sie, wo die Post ist?", "right": "Excuse me, do you know where the post office is?"}, {"left": "Können Sie mir sagen, wie viel das kostet?", "right": "Can you tell me how much that costs?"}, {"left": "Wissen Sie, wann das Café öffnet?", "right": "Do you know when the café opens?"}, {"left": "Ich möchte wissen, wie ich zum Bahnhof komme.", "right": "I want to know how I get to the station."}, {"left": "Wie viel kostet das?", "right": "How much does that cost?"}, {"left": "Wo ist die Post?", "right": "Where is the post office?"}], "status": "correct"}], "feedback": "Polite questions."}
  de.a2.unit113.lesson03.exercise04.ordnen_cafe: {"instruction": "Put the words in order to say 'Do you know when the café opens?'", "correct_option": "Wissen Sie wann das Café öffnet", "accepted_answers": [{"value": "Wissen Sie wann das Café öffnet", "status": "correct"}], "feedback": "*Öffnet* is last."}
  de.a2.unit113.lesson03.exercise05.luecke_komme: {"instruction": "Complete with the verb.", "correct_option": "komme", "accepted_answers": [{"value": "komme", "status": "correct"}], "feedback": "The verb of the embedded question is last."}
  de.a2.unit113.lesson03.exercise06.uebersetzen_kostet: {"instruction": "Translate into German.", "accepted_answers": [{"value": "Können Sie mir sagen, wie viel das kostet?", "status": "correct"}, {"value": "Können Sie mir sagen wie viel das kostet?", "status": "correct"}, {"value": "Koennen Sie mir sagen, wie viel das kostet?", "status": "correct"}, {"value": "Koennen Sie mir sagen wie viel das kostet?", "status": "correct"}], "feedback": "*Kostet* last."}
  de.a2.unit113.lesson03.exercise07.schreiben_oeffnet: {"instruction": "Write the requested German sentence.", "accepted_answers": [{"value": "Wissen Sie, wann das Café öffnet?", "status": "correct"}, {"value": "Wissen Sie wann das Café öffnet?", "status": "correct"}, {"value": "Wissen Sie, wann das Café oeffnet?", "status": "correct"}, {"value": "Wissen Sie wann das Café oeffnet?", "status": "correct"}], "feedback": "*Wann das Café öffnet*.", "correct_option": "Wissen Sie, wann das Café öffnet?"}
  de.a2.unit113.lesson04.exercise01.wahl_film: {"instruction": "Choose the correct German sentence.", "correct_option": "Weißt du, wann der Film anfängt?", "distractors": ["Weißt du, wann der Film fängt an?", "Weißt du, wann fängt der Film an?", "Weißt du, wann der Film an fängt?"], "accepted_answers": [{"value": "Weißt du, wann der Film anfängt?", "status": "correct"}], "feedback": "The separable verb is one word."}
  de.a2.unit113.lesson04.exercise02.wahl_jonas: {"instruction": "Choose the correct German sentence.", "correct_option": "Ich weiß nicht, warum Jonas nicht kommen kann.", "distractors": ["Ich weiß nicht, warum Jonas nicht kann kommen.", "Ich weiß nicht, warum kann Jonas nicht kommen.", "Ich weiß nicht, warum Jonas kann nicht kommen."], "accepted_answers": [{"value": "Ich weiß nicht, warum Jonas nicht kommen kann.", "status": "correct"}], "feedback": "The modal verb *kann* is last."}
  de.a2.unit113.lesson04.exercise03.paare_ende: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Weißt du, wann der Film anfängt?", "right": "Do you know when the film starts?"}, {"left": "Ich weiß nicht, warum Jonas nicht kommen kann.", "right": "I don't know why Jonas can't come."}, {"left": "Weißt du, was Anna gekauft hat?", "right": "Do you know what Anna bought?"}, {"left": "Ich möchte wissen, wer morgen mitkommt.", "right": "I want to know who is coming along tomorrow."}, {"left": "Wann fängt der Film an?", "right": "When does the film start?"}, {"left": "Anna hat das gekauft.", "right": "Anna bought that."}], "status": "correct"}], "feedback": "Verbs at the end."}
  de.a2.unit113.lesson04.exercise04.ordnen_mitkommt: {"instruction": "Put the words in order to say 'I want to know who is coming along tomorrow.'", "correct_option": "Ich möchte wissen wer morgen mitkommt", "accepted_answers": [{"value": "Ich möchte wissen wer morgen mitkommt", "status": "correct"}], "feedback": "*Mitkommt* is one word, last."}
  de.a2.unit113.lesson04.exercise05.luecke_hat: {"instruction": "Complete with the auxiliary.", "correct_option": "hat", "accepted_answers": [{"value": "hat", "status": "correct"}], "feedback": "The auxiliary stands last."}
  de.a2.unit113.lesson04.exercise06.uebersetzen_kann: {"instruction": "Translate into German.", "accepted_answers": [{"value": "Ich weiß nicht, warum Jonas nicht kommen kann.", "status": "correct"}, {"value": "Ich weiß nicht warum Jonas nicht kommen kann.", "status": "correct"}, {"value": "Ich weiss nicht, warum Jonas nicht kommen kann.", "status": "correct"}, {"value": "Ich weiss nicht warum Jonas nicht kommen kann.", "status": "correct"}], "feedback": "*Kommen kann* last."}
  de.a2.unit113.lesson04.exercise07.schreiben_film: {"instruction": "Write the requested German sentence.", "accepted_answers": [{"value": "Weißt du, wann der Film anfängt?", "status": "correct"}, {"value": "Weißt du wann der Film anfängt?", "status": "correct"}, {"value": "Weisst du, wann der Film anfaengt?", "status": "correct"}, {"value": "Weisst du wann der Film anfaengt?", "status": "correct"}], "feedback": "*Anfängt* last.", "correct_option": "Weißt du, wann der Film anfängt?"}
  de.a2.unit113.lesson05.exercise01.lesen_post: {"instruction": "Read the text and choose the answer.", "correct_option": "Where it is.", "distractors": ["When it opens.", "How much a stamp costs.", "Whether it is open today."], "accepted_answers": [{"value": "Where it is.", "status": "correct"}], "feedback": "*Er weiß nicht, wo die Post ist.*"}
  de.a2.unit113.lesson05.exercise02.lesen_supermarkt: {"instruction": "Read the text and choose the answer.", "correct_option": "Whether there is one here.", "distractors": ["Where it is.", "When it opens.", "How much it costs."], "accepted_answers": [{"value": "Whether there is one here.", "status": "correct"}], "feedback": "*Er möchte wissen, ob es hier einen Supermarkt gibt.*"}
  de.a2.unit113.lesson05.exercise03.paare_neu: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Felix ist neu in der Stadt.", "right": "Felix is new in town."}, {"left": "Er weiß nicht, wo die Post ist.", "right": "He doesn't know where the post office is."}, {"left": "Er weiß auch nicht, wann das Café öffnet.", "right": "He also doesn't know when the café opens."}, {"left": "Er möchte wissen, ob es hier einen Supermarkt gibt.", "right": "He wants to know whether there is a supermarket here."}, {"left": "Anna kann ihm helfen.", "right": "Anna can help him."}, {"left": "Sie weiß, wo alles ist.", "right": "She knows where everything is."}], "status": "correct"}], "feedback": "Felix's questions."}
  de.a2.unit113.lesson05.exercise04.ordnen_post: {"instruction": "Put the words in order to say 'He doesn't know where the post office is.'", "correct_option": "Er weiß nicht wo die Post ist", "accepted_answers": [{"value": "Er weiß nicht wo die Post ist", "status": "correct"}], "feedback": "*Ist* is last."}
  de.a2.unit113.lesson05.exercise05.uebersetzen_cafe: {"instruction": "Translate into German.", "accepted_answers": [{"value": "Er weiß nicht, wann das Café öffnet.", "status": "correct"}, {"value": "Er weiß nicht wann das Café öffnet.", "status": "correct"}, {"value": "Er weiss nicht, wann das Café oeffnet.", "status": "correct"}, {"value": "Er weiss nicht wann das Café oeffnet.", "status": "correct"}], "feedback": "*Öffnet* last."}
  de.a2.unit113.lesson05.exercise06.diktat_post: {"instruction": "Type what you hear.", "correct_response": "Er weiß nicht, wo die Post ist.", "orthography_strict": true, "feedback": "You heard *Er weiß nicht, wo die Post ist.*"}
  de.a2.unit113.lesson05.exercise07.diktat_alles: {"instruction": "Type what you hear.", "correct_response": "Anna weiß, wo alles ist.", "orthography_strict": true, "feedback": "You heard *Anna weiß, wo alles ist.*"}
  de.a2.unit113.lesson06.exercise01.hoeren_frage: {"instruction": "Listen and select the line you hear.", "correct_option": "Hallo Anna! Weißt du, wo die Post ist?", "distractors": ["Hallo Anna! Weißt du, wann die Post öffnet?", "Hallo Felix! Weißt du, wo die Post ist?", "Hallo Anna! Weißt du, wo das Café ist?"], "accepted_answers": [{"value": "Hallo Anna! Weißt du, wo die Post ist?", "status": "correct"}], "feedback": "Felix opens with *Hallo Anna! Weißt du, wo die Post ist?*"}
  de.a2.unit113.lesson06.exercise02.verstehen_post: {"instruction": "Listen to the dialogue and choose the answer.", "correct_option": "Next to the station.", "distractors": ["Next to the café.", "In the park.", "At the supermarket."], "accepted_answers": [{"value": "Next to the station.", "status": "correct"}], "feedback": "Anna says it is next to the station."}
