  de.a1.unit19.lesson02.teach.steht: {title: "Der Tisch steht im Wohnzimmer.", gloss: "The table is in the living room.", note: "German often uses *steht* for where furniture stands.", example_gloss: "The table is in the living room."}
  de.a1.unit19.lesson02.teach.home_text: {title: "Wohnung in Berlin", gloss: "apartment in Berlin", note: "The short description gives location, rooms, and furniture.", example_gloss: "There is a table in the living room."}
  de.a1.unit19.lesson02.teach.line01: {title: "Felix fragt nach der Wohnung", gloss: "Felix: Wie ist Ihre Wohnung, Anna?", note: "Formal *Ihre* matches *Sie*.", example_gloss: "What is your apartment like?"}
  de.a1.unit19.lesson02.teach.line02: {title: "Anna beschreibt Räume", gloss: "Anna: Meine Wohnung ist klein, aber hell. Sie hat zwei Zimmer, eine Küche und ein Bad.", note: "Anna gives size, light, and room count.", example_gloss: "It has two rooms."}
  de.a1.unit19.lesson02.teach.line03: {title: "Felix fragt nach Möbeln", gloss: "Felix: Gibt es einen Tisch?", note: "*Gibt es...?* asks whether something exists.", example_gloss: "Is there a table?"}
  de.a1.unit19.lesson02.teach.line04: {title: "Anna nennt den Ort", gloss: "Anna: Ja, der Tisch steht im Wohnzimmer.", note: "The answer gives the furniture location.", example_gloss: "\"Yes,\" the table is in the living room."}
exercises:
  de.a1.unit19.lesson01.exercise01.listen_kueche: {instruction: "Listen and select the room you hear.", correct_option: "Küche", distractors: ["Bad", "Wohnung", "Zimmer"], accepted_answers: [{value: "Küche", status: "correct"}], feedback: "*Küche* means kitchen."}
  de.a1.unit19.lesson01.exercise02.choose_two_rooms: {instruction: "Which sentence means 'The apartment has two rooms'?", correct_option: "Die Wohnung hat zwei Zimmer.", distractors: ["Die Wohnung ist zwei Zimmer.", "Die Wohnung hat zwei Küche.", "Wohnung hat der zwei Zimmer."], accepted_answers: [{value: "Die Wohnung hat zwei Zimmer.", status: "correct"}], feedback: "Use *hat* to say what the apartment has."}
  de.a1.unit19.lesson01.exercise03.match_rooms:
    instruction: "Match each home word to its meaning."
    accepted_answers: [{value: [{left: "Apartment in einem Gebäude", right: "Wohnung"}, {left: "Raum zum Wohnen oder Schlafen", right: "Zimmer"}, {left: "Raum zum Kochen", right: "Küche"}, {left: "Raum zum Duschen", right: "Bad"}, {left: "mit viel Licht", right: "hell"}, {left: "nicht groß", right: "klein"}], status: "correct"}]
    feedback: "These words describe rooms and basic qualities."
  de.a1.unit19.lesson01.exercise04.order_rooms: {instruction: "Put the words in order: 'The apartment has two rooms.'", accepted_answers: [{value: ["Die", "Wohnung", "hat", "zwei", "Zimmer"], status: "correct"}], feedback: "*hat* comes before what the apartment has."}
  de.a1.unit19.lesson01.exercise05.write_home: {instruction: "Write the taught sentence: My apartment is small and bright.", accepted_answers: [{value: "Meine Wohnung ist klein und hell.", status: "correct"}, {value: "Meine Wohnung ist klein und hell", status: "correct"}], feedback: "The sentence gives two basic home qualities."}
  de.a1.unit19.lesson02.exercise01.listen_rooms: {instruction: "Listen to the dialogue. How many rooms does Anna's apartment have?", correct_option: "zwei Zimmer", distractors: ["eine Küche", "ein Bad", "ein Wohnzimmer"], accepted_answers: [{value: "zwei Zimmer", status: "correct"}], feedback: "Anna says the apartment has *zwei Zimmer*."}
  de.a1.unit19.lesson02.exercise02.choose_location: {instruction: "Which sentence says the table is in the living room?", correct_option: "Der Tisch steht im Wohnzimmer.", distractors: ["Der Tisch ist Wohnzimmer.", "Der Tisch steht in Wohnzimmer.", "Es gibt Wohnzimmer Tisch."], accepted_answers: [{value: "Der Tisch steht im Wohnzimmer.", status: "correct"}], feedback: "Use *im Wohnzimmer* for 'in the living room.'"}
  de.a1.unit19.lesson02.exercise03.match_home:
    instruction: "Match each home detail."
    accepted_answers: [{value: [{left: "Annas Zuhause", right: "Wohnung"}, {left: "Anzahl der Zimmer", right: "zwei"}, {left: "Raum zum Kochen", right: "Küche"}, {left: "Raum zum Waschen", right: "Bad"}, {left: "Möbel im Wohnzimmer", right: "Tisch"}, {left: "Ort des Tisches", right: "Wohnzimmer"}], status: "correct"}]
    feedback: "The description covers rooms, furniture, and location."
  de.a1.unit19.lesson02.exercise04.order_table: {instruction: "Put the words in order: 'The table is in the living room.'", accepted_answers: [{value: ["Der", "Tisch", "steht", "im", "Wohnzimmer"], status: "correct"}], feedback: "*steht im Wohnzimmer* gives the furniture location."}
  de.a1.unit19.lesson02.exercise05.reply_home: {instruction: "Reply as Anna: describe the apartment as small but bright, say it has two rooms, a kitchen, and a bathroom, then say the table is in the living room.", accepted_answers: [{value: "Meine Wohnung ist klein, aber hell. Sie hat zwei Zimmer, eine Küche und ein Bad. Der Tisch steht im Wohnzimmer.", status: "correct"}, {value: "Meine Wohnung ist klein aber hell Sie hat zwei Zimmer eine Küche und ein Bad Der Tisch steht im Wohnzimmer", status: "correct"}], feedback: "The reply gives quality, rooms, and the table location."}
  de.a1.unit19.lesson02.exercise06.write_home_description: {instruction: "Write the taught description exactly: My apartment is in Berlin. It has two rooms, a kitchen, and a bathroom. There is a table in the living room.", accepted_answers: [{value: "Meine Wohnung ist in Berlin. Sie hat zwei Zimmer, eine Küche und ein Bad. Im Wohnzimmer gibt es einen Tisch.", status: "correct"}, {value: "Meine Wohnung ist in Berlin Sie hat zwei Zimmer eine Küche und ein Bad Im Wohnzimmer gibt es einen Tisch", status: "correct"}], feedback: "The description includes location, quantity, rooms, and an object."}
