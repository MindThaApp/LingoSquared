review: {status: "reviewed", required_next_reviewer: "codex", notes: "English-to-German overlay for housing; distractors target English there-is word order, omitted articles, and in/im confusion.\n\nSecond-pass review 2026-10-19: 9 fixes -- lesson02.teach.line01-line04: German titles and German-text glosses -> English titles and English translations; line02 note now explains that *Sie hat* here means 'it (the apartment) has'; line04 example_gloss stray quote marks around Yes removed; lesson02.teach.es_gibt example_gloss mirrored to the corrected example 'Im Wohnzimmer gibt es einen Tisch.'; lesson02.teach.home_text example_gloss 'There is a table in the living room.' -> 'My apartment is in Berlin.' (did not translate its example); 'Im Dialog:' examples now glossed 'In context: ...'; lesson02.exercise01.listen_rooms distractors 'eine Küche' / 'ein Bad' / 'ein Wohnzimmer' (all things Anna says in the audio, and not room counts) -> 'ein Zimmer' / 'fünf Zimmer' / 'sechs Zimmer'; lesson01.exercise03.match_rooms and lesson02.exercise03.match_home accepted_answers mirrored to the realization's new English clues; lesson02.exercise05.reply_home added variants starting the table sentence with 'Ja,' (the natural answer to Felix's 'Gibt es einen Tisch?')."}
