  de.a1.unit19.lesson01.teach.wohnung: {title: "Wohnung", gloss: "apartment / flat", note: "*Wohnung* is a common German word for an apartment.", example_gloss: "My apartment is small."}
  de.a1.unit19.lesson01.teach.zimmer: {title: "Zimmer", gloss: "room", note: "*Zimmer* can mean room in a home or hotel room.", example_gloss: "The apartment has two rooms."}
  de.a1.unit19.lesson01.teach.kueche: {title: "Küche", gloss: "kitchen", note: "*Küche* is the room for cooking.", example_gloss: "The kitchen is bright."}
  de.a1.unit19.lesson01.teach.bad: {title: "Bad", gloss: "bathroom", note: "*Bad* is short and common for bathroom.", example_gloss: "The bathroom is small."}
  de.a1.unit19.lesson01.teach.hell: {title: "hell", gloss: "bright", note: "*hell* describes a room with good light.", example_gloss: "My apartment is bright."}
  de.a1.unit19.lesson02.teach.wohnzimmer: {title: "Wohnzimmer", gloss: "living room", note: "*Wohnzimmer* is literally living-room.", example_gloss: "The table is in the living room."}
  de.a1.unit19.lesson02.teach.tisch: {title: "Tisch", gloss: "table", note: "*Tisch* is masculine: *der Tisch*.", example_gloss: "There is a table."}
  de.a1.unit19.lesson02.teach.stuhl: {title: "Stuhl", gloss: "chair", note: "*Stuhl* is a chair.", example_gloss: "There is a chair."}
  de.a1.unit19.lesson02.teach.es_gibt: {title: "Es gibt einen Tisch.", gloss: "There is a table.", note: "*Es gibt* is the basic 'there is/there are' phrase.", example_gloss: "There is a table in the living room."}
  de.a1.unit19.lesson02.teach.steht: {title: "Der Tisch steht im Wohnzimmer.", gloss: "The table is in the living room.", note: "German often uses *steht* for where furniture stands.", example_gloss: "In context: The table is in the living room."}
  de.a1.unit19.lesson02.teach.home_text: {title: "Wohnung in Berlin", gloss: "apartment in Berlin", note: "The short description gives location, rooms, and furniture.", example_gloss: "My apartment is in Berlin."}
  de.a1.unit19.lesson02.teach.line01: {title: "Felix asks about the apartment", gloss: "Felix: What is your apartment like, Anna?", note: "Formal *Ihre* matches *Sie*.", example_gloss: "What is your apartment like?"}
  de.a1.unit19.lesson02.teach.line02: {title: "Anna describes the rooms", gloss: "Anna: My apartment is small but bright. It has two rooms, a kitchen, and a bathroom.", note: "Anna gives size, light, and room count. Here *Sie hat* means 'it has': *Sie* refers back to *die Wohnung*.", example_gloss: "It has two rooms."}
  de.a1.unit19.lesson02.teach.line03: {title: "Felix asks about furniture", gloss: "Felix: Is there a table?", note: "*Gibt es...?* asks whether something exists.", example_gloss: "In context: Is there a table?"}
  de.a1.unit19.lesson02.teach.line04: {title: "Anna says where the table is", gloss: "Anna: Yes, the table is in the living room.", note: "The answer gives the furniture location.", example_gloss: "The table is in the living room."}
exercises:
  de.a1.unit19.lesson01.exercise01.listen_kueche: {instruction: "Listen and select the room you hear.", correct_option: "Küche", distractors: ["Bad", "Wohnung", "Zimmer"], accepted_answers: [{value: "Küche", status: "correct"}], feedback: "*Küche* means kitchen."}
  de.a1.unit19.lesson01.exercise02.choose_two_rooms: {instruction: "Which sentence means 'The apartment has two rooms'?", correct_option: "Die Wohnung hat zwei Zimmer.", distractors: ["Die Wohnung ist zwei Zimmer.", "Die Wohnung hat zwei Küche.", "Wohnung hat der zwei Zimmer."], accepted_answers: [{value: "Die Wohnung hat zwei Zimmer.", status: "correct"}], feedback: "Use *hat* to say what the apartment has."}
  de.a1.unit19.lesson01.exercise03.match_rooms:
    instruction: "Match each home word to its meaning."
    accepted_answers: [{value: [{left: "apartment / flat", right: "Wohnung"}, {left: "room", right: "Zimmer"}, {left: "kitchen", right: "Küche"}, {left: "bathroom", right: "Bad"}, {left: "bright", right: "hell"}, {left: "small", right: "klein"}], status: "correct"}]
    feedback: "These words describe rooms and basic qualities."
  de.a1.unit19.lesson01.exercise04.order_rooms: {instruction: "Put the words in order: 'The apartment has two rooms.'", accepted_answers: [{value: ["Die", "Wohnung", "hat", "zwei", "Zimmer"], status: "correct"}], feedback: "*hat* comes before what the apartment has."}
  de.a1.unit19.lesson01.exercise05.write_home: {instruction: "Write the taught sentence: My apartment is small and bright.", accepted_answers: [{value: "Meine Wohnung ist klein und hell.", status: "correct"}, {value: "Meine Wohnung ist klein und hell", status: "correct"}], feedback: "The sentence gives two basic home qualities."}
  de.a1.unit19.lesson02.exercise01.listen_rooms: {instruction: "Listen to the dialogue. How many rooms does Anna's apartment have?", correct_option: "zwei Zimmer", distractors: ["ein Zimmer", "fünf Zimmer", "sechs Zimmer"], accepted_answers: [{value: "zwei Zimmer", status: "correct"}], feedback: "Anna says the apartment has *zwei Zimmer*."}
  de.a1.unit19.lesson02.exercise02.choose_location: {instruction: "Which sentence says the table is in the living room?", correct_option: "Der Tisch steht im Wohnzimmer.", distractors: ["Der Tisch ist Wohnzimmer.", "Der Tisch steht in Wohnzimmer.", "Es gibt Wohnzimmer Tisch."], accepted_answers: [{value: "Der Tisch steht im Wohnzimmer.", status: "correct"}], feedback: "Use *im Wohnzimmer* for 'in the living room.'"}
  de.a1.unit19.lesson02.exercise03.match_home:
    instruction: "Match each home detail."
    accepted_answers: [{value: [{left: "Anna's home", right: "Wohnung"}, {left: "how many rooms it has", right: "zwei"}, {left: "the room for cooking", right: "Küche"}, {left: "the room for washing", right: "Bad"}, {left: "the furniture Felix asks about", right: "Tisch"}, {left: "the room where the table is", right: "Wohnzimmer"}], status: "correct"}]
    feedback: "The description covers rooms, furniture, and location."
  de.a1.unit19.lesson02.exercise04.order_table: {instruction: "Put the words in order: 'The table is in the living room.'", accepted_answers: [{value: ["Der", "Tisch", "steht", "im", "Wohnzimmer"], status: "correct"}], feedback: "*steht im Wohnzimmer* gives the furniture location."}
  de.a1.unit19.lesson02.exercise05.reply_home: {instruction: "Reply as Anna: describe the apartment as small but bright, say it has two rooms, a kitchen, and a bathroom, then say the table is in the living room.", accepted_answers: [{value: "Meine Wohnung ist klein, aber hell. Sie hat zwei Zimmer, eine Küche und ein Bad. Der Tisch steht im Wohnzimmer.", status: "correct"}, {value: "Meine Wohnung ist klein aber hell Sie hat zwei Zimmer eine Küche und ein Bad Der Tisch steht im Wohnzimmer", status: "correct"}, {value: "Meine Wohnung ist klein, aber hell. Sie hat zwei Zimmer, eine Kueche und ein Bad. Der Tisch steht im Wohnzimmer.", status: "correct"}, {value: "Meine Wohnung ist klein aber hell Sie hat zwei Zimmer eine Kueche und ein Bad Der Tisch steht im Wohnzimmer", status: "correct"}, {value: "Meine Wohnung ist klein, aber hell. Sie hat zwei Zimmer, eine Küche und ein Bad. Ja, der Tisch steht im Wohnzimmer.", status: "correct"}, {value: "Meine Wohnung ist klein, aber hell. Sie hat zwei Zimmer, eine Kueche und ein Bad. Ja, der Tisch steht im Wohnzimmer.", status: "correct"}], feedback: "The reply gives quality, rooms, and the table location."}
  de.a1.unit19.lesson02.exercise06.write_home_description: {instruction: "Write the taught description exactly: My apartment is in Berlin. It has two rooms, a kitchen, and a bathroom. There is a table in the living room.", accepted_answers: [{value: "Meine Wohnung ist in Berlin. Sie hat zwei Zimmer, eine Küche und ein Bad. Im Wohnzimmer gibt es einen Tisch.", status: "correct"}, {value: "Meine Wohnung ist in Berlin Sie hat zwei Zimmer eine Küche und ein Bad Im Wohnzimmer gibt es einen Tisch", status: "correct"}, {value: "Meine Wohnung ist in Berlin. Sie hat zwei Zimmer, eine Kueche und ein Bad. Im Wohnzimmer gibt es einen Tisch.", status: "correct"}, {value: "Meine Wohnung ist in Berlin Sie hat zwei Zimmer eine Kueche und ein Bad Im Wohnzimmer gibt es einen Tisch", status: "correct"}], feedback: "The description includes location, quantity, rooms, and an object."}
