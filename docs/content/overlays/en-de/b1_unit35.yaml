  de.b1.unit35.lesson03.exercise04.order_could_call: {instruction: "Put the words in order to say \"If you give me your number, I could call you tomorrow.\"", accepted_answers: [{value: ["Wenn", "Sie", "mir", "Ihre", "Nummer", "geben", "könnte", "ich", "Sie", "morgen", "anrufen"], status: "correct"}], feedback: "The correct order is *Wenn Sie mir Ihre Nummer geben, könnte ich Sie morgen anrufen*."}
