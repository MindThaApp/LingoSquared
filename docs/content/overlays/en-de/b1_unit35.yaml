course:
  title: "German B1"
  description: "Learn B1-level German for saying what you can or could do using embedded clauses."

units:
  de.b1.unit35.faehigkeiten: {title: "Abilities"}

lessons:
  de.b1.unit35.lesson01.ich_kann_sagen_dass: {title: "I can say that..."}
  de.b1.unit35.lesson02.ich_konnte_sagen: {title: "I could say... / I could say (hypothetical)..."}
  de.b1.unit35.lesson03.buergeramt_dialogue: {title: "Dialogue: What Frau Klein can say"}

teaching:
  de.b1.unit35.lesson01.teach.guten_tag_refresher: {title: "Guten Tag, hier ist Frau Klein vom Bürgeramt.", gloss: "Hello, this is Mrs. Klein from the registration office.", note: "Refresher: *Guten Tag* is the formal greeting; *das Bürgeramt* is the local registration office.", example_gloss: "Hello, this is Mrs. Klein."}
  de.b1.unit35.lesson01.teach.felix_refresher: {title: "Felix", gloss: "Felix", note: "Felix is the recurring engineer in this lane.", example_gloss: "Felix calls the registration office."}
  de.b1.unit35.lesson01.teach.ich_kann_sagen: {title: "Ich kann sagen, dass der Termin frei ist.", gloss: "I can say that the appointment is free.", note: "Use *kann sagen, dass...* to state what you can say, then add the full embedded clause -- the conjugated verb (*ist*) goes to the end of the dass-clause.", example_gloss: "I can say that the appointment is free."}
  de.b1.unit35.lesson01.teach.koennen_sie: {title: "Können Sie sagen, ob der Termin frei ist?", gloss: "Can you say whether the appointment is free?", note: "*Können Sie* is the formal question form; *ob* introduces an indirect yes/no question, also verb-final.", example_gloss: "Can you say whether the appointment is free?"}
  de.b1.unit35.lesson02.teach.letzte_woche: {title: "Letzte Woche konnte ich noch nicht sagen, dass der Termin frei ist.", gloss: "Last week I could not yet say that the appointment is free.", note: "*konnte* is the simple-past ability form; *noch nicht* means \"not yet\".", example_gloss: "Last week I could not yet say that the appointment is free."}
  de.b1.unit35.lesson02.teach.konnten_sie: {title: "Konnten Sie das schon letzte Woche sagen?", gloss: "Could you already say that last week?", note: "*Konnten Sie* is the formal past-ability question form.", example_gloss: "Could you already say that last week?"}
  de.b1.unit35.lesson02.teach.wenn_koennte: {title: "Wenn Sie mir Ihre Nummer geben, könnte ich Sie morgen anrufen.", gloss: "If you give me your number, I could call you tomorrow.", note: "*Wenn... könnte...* marks a hypothetical ability with Konjunktiv II.", example_gloss: "If you give me your number, I could call you tomorrow."}
  de.b1.unit35.lesson03.teach.felix_greeting: {title: "Felix greets Frau Klein", gloss: "Felix: Hello, Mrs. Klein.", note: "This visibly models the greeting required in the final formal message."}
  de.b1.unit35.lesson03.teach.felix_ask_present: {title: "Felix asks about present ability", gloss: "Felix: Can you say whether the appointment on Monday is free?", note: "The question uses formal *Sie* and the ob-clause is verb-final."}
  de.b1.unit35.lesson03.teach.klein_present: {title: "Frau Klein answers about present ability", gloss: "Frau Klein: Yes, I can say that the appointment is free.", note: "This gives present ability plus an embedded dass-clause."}
  de.b1.unit35.lesson03.teach.felix_ask_past: {title: "Felix asks about past ability", gloss: "Felix: And last week, could you already say that?", note: "This asks about a past ability with *konnten*."}
  de.b1.unit35.lesson03.teach.klein_past_hypothetical: {title: "Frau Klein contrasts past and hypothetical ability", gloss: "Frau Klein: No, last week I could not yet say that the appointment is free. But if you give me your number, I could call you tomorrow.", note: "This contrasts past ability and hypothetical ability."}

exercises:
  de.b1.unit35.lesson01.exercise01.recognize_ich_kann_sagen: {instruction: "Which German phrase means \"I can say\"?", correct_option: "ich kann sagen", distractors: ["ich konnte sagen", "ich muss sagen", "ich möchte sagen"], accepted_answers: [{value: "ich kann sagen", status: "correct"}], feedback: "*ich kann sagen* means \"I can say.\""}
  de.b1.unit35.lesson01.exercise02.recognize_dass_termin_frei: {instruction: "Which German clause means \"that the appointment is free\"?", correct_option: "dass der Termin frei ist", distractors: ["ob der Termin frei war", "dass die Nummer richtig ist", "wenn der Termin frei wäre"], accepted_answers: [{value: "dass der Termin frei ist", status: "correct"}], feedback: "*dass der Termin frei ist* means \"that the appointment is free\" -- note the conjugated verb *ist* goes to the end."}
  de.b1.unit35.lesson01.exercise03.listen_select_present_ability: {instruction: "Listen. What can the speaker say right now?", correct_option: "That the appointment is free.", distractors: ["That the office is closed.", "That the number is wrong.", "That there is no time tomorrow."], accepted_answers: [{value: "That the appointment is free.", status: "correct"}], feedback: "The recording says *Ich kann sagen, dass der Termin frei ist*."}
  de.b1.unit35.lesson01.exercise04.match_present_ability:
    instruction: "Match each German word or phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "Guten Tag", right: "Hello / Good day"}
          - {left: "Frau Klein", right: "Mrs. Klein"}
          - {left: "das Bürgeramt", right: "the registration office"}
          - {left: "Ich kann sagen", right: "I can say"}
          - {left: "dass der Termin frei ist", right: "that the appointment is free"}
          - {left: "Können Sie sagen, ob...?", right: "Can you say whether...?"}
        status: "correct"
    feedback: "These pieces build a present-ability sentence with an embedded dass-clause."
  de.b1.unit35.lesson01.exercise05.order_present_ability: {instruction: "Put the words in order to say \"I can say that the appointment is free.\"", accepted_answers: [{value: ["Ich", "kann", "sagen", "dass", "der", "Termin", "frei", "ist"], status: "correct"}], feedback: "The correct order is *Ich kann sagen, dass der Termin frei ist* -- the dass-clause verb *ist* goes last."}
  de.b1.unit35.lesson01.exercise06.write_present_ability:
    instruction: "Write exactly this present-ability sentence with an embedded dass-clause (verb-final): I can say that the appointment is free."
    accepted_answers:
      - {value: "Ich kann sagen, dass der Termin frei ist.", status: "correct"}
      - {value: "Ich kann sagen dass der Termin frei ist.", status: "correct"}
      - {value: "Ich kann sagen, dass der Termin frei ist", status: "correct"}
      - {value: "Ich kann sagen dass der Termin frei ist", status: "correct"}
    feedback: "The model answer is *Ich kann sagen, dass der Termin frei ist*."
  de.b1.unit35.lesson02.exercise01.recognize_ich_konnte: {instruction: "Which German phrase means \"I could say\" (past ability)?", correct_option: "ich konnte sagen", distractors: ["ich kann sagen", "ich könnte sagen", "ich soll sagen"], accepted_answers: [{value: "ich konnte sagen", status: "correct"}], feedback: "*ich konnte sagen* is the simple-past ability form: \"I could say.\""}
  de.b1.unit35.lesson02.exercise02.recognize_ich_koennte: {instruction: "Which German phrase means \"I could call you tomorrow\" (hypothetical ability)?", correct_option: "könnte ich Sie morgen anrufen", distractors: ["konnte ich Sie morgen anrufen", "kann ich Sie morgen anrufen", "muss ich Sie morgen anrufen"], accepted_answers: [{value: "könnte ich Sie morgen anrufen", status: "correct"}], feedback: "*könnte* is the Konjunktiv II hypothetical-ability form."}
  de.b1.unit35.lesson02.exercise03.listen_select_past_ability: {instruction: "Listen. What could the speaker not yet say last week?", correct_option: "That the appointment is free.", distractors: ["That the number is wrong.", "That the office is closed.", "That she must call tomorrow."], accepted_answers: [{value: "That the appointment is free.", status: "correct"}], feedback: "The recording says *Letzte Woche konnte ich noch nicht sagen, dass der Termin frei ist*."}
  de.b1.unit35.lesson02.exercise04.match_past_hypothetical_ability:
    instruction: "Match each German phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "Letzte Woche", right: "Last week"}
          - {left: "konnte ich noch nicht sagen", right: "I could not yet say"}
          - {left: "Konnten Sie das schon sagen?", right: "Could you already say that?"}
          - {left: "Wenn Sie mir Ihre Nummer geben", right: "If you give me your number"}
          - {left: "könnte ich Sie morgen anrufen", right: "I could call you tomorrow"}
          - {left: "die Nummer", right: "the number"}
        status: "correct"
    feedback: "These phrases contrast past and hypothetical ability."
  de.b1.unit35.lesson02.exercise05.order_hypothetical_ability: {instruction: "Put the words in order to say \"I could call you tomorrow.\" Use the Konjunktiv II könnte.", accepted_answers: [{value: ["könnte", "ich", "Sie", "morgen", "anrufen"], status: "correct"}], feedback: "The correct order is *könnte ich Sie morgen anrufen*."}
  de.b1.unit35.lesson02.exercise06.write_hypothetical_ability:
    instruction: "Write exactly this hypothetical-ability sentence with wenn and a Konjunktiv II könnte: If you give me your number, I could call you tomorrow."
    accepted_answers:
      - {value: "Wenn Sie mir Ihre Nummer geben, könnte ich Sie morgen anrufen.", status: "correct"}
      - {value: "Wenn Sie mir Ihre Nummer geben, koennte ich Sie morgen anrufen.", status: "correct"}
      - {value: "Wenn Sie mir Ihre Nummer geben könnte ich Sie morgen anrufen.", status: "correct"}
      - {value: "Wenn Sie mir Ihre Nummer geben koennte ich Sie morgen anrufen.", status: "correct"}
      - {value: "Wenn Sie mir Ihre Nummer geben, könnte ich Sie morgen anrufen", status: "correct"}
      - {value: "Wenn Sie mir Ihre Nummer geben, koennte ich Sie morgen anrufen", status: "correct"}
      - {value: "Wenn Sie mir Ihre Nummer geben könnte ich Sie morgen anrufen", status: "correct"}
      - {value: "Wenn Sie mir Ihre Nummer geben koennte ich Sie morgen anrufen", status: "correct"}
    feedback: "The model answer is *Wenn Sie mir Ihre Nummer geben, könnte ich Sie morgen anrufen*."
  de.b1.unit35.lesson03.exercise01.choose_embedded_ability: {instruction: "Which answer states a present ability with an embedded dass-clause?", correct_option: "Ich kann sagen, dass der Termin frei ist.", distractors: ["Ich kann den Termin.", "Letzte Woche konnte ich noch nicht sagen, dass der Termin frei ist.", "Wenn Sie mir Ihre Nummer geben, könnte ich Sie anrufen."], accepted_answers: [{value: "Ich kann sagen, dass der Termin frei ist.", status: "correct"}], feedback: "This answer uses *kann sagen* plus the embedded clause *dass der Termin frei ist*."}
