review: {"status": "unreviewed", "required_next_reviewer": "native_speaker_review", "notes": "English overlay for the busy-morning unit (perfect tense with separable verbs, sequence words). OPEN NATIVE QUESTIONS: none beyond the realization notes."}
course:
  title: "German A2"
  description: "Grammar-led A2 German continuing the Anna and Felix storyline."
  learning_goal: "Talk about the past in German with the perfect, the simple past and the past perfect."
units:
  de.a2.unit98.hektischer_morgen: {"title": "A Busy Morning", "description": "Describe step by step how a morning went, using the perfect tense with separable verbs and the sequence words zuerst, dann, danach and zuletzt."}
lessons:
  de.a2.unit98.lesson01.was_habe_ich_gemacht: {"title": "What Did I Do?"}
  de.a2.unit98.lesson02.trennbar_untrennbar: {"title": "Separable or Inseparable?"}
  de.a2.unit98.lesson03.haben_oder_sein: {"title": "Haben or Sein?"}
  de.a2.unit98.lesson04.mein_morgen: {"title": "My Morning"}
  de.a2.unit98.lesson05.felix_schreibt: {"title": "Felix Writes to Anna"}
  de.a2.unit98.lesson06.anna_und_felix: {"title": "Anna and Felix Talk"}
teaching:
  de.a2.unit98.lesson01.teach.morgen_verben: {"title": "Morning routine verbs", "gloss": "to get up / to shower / to have breakfast / to put on (clothes)", "example_gloss": ["Felix got up at six o'clock.", "He showered.", "He had breakfast.", "He put on the jacket."], "note": "These infinitives start the story of a morning. *Aufstehen* and *anziehen* are separable: the prefix *auf-* or *an-* can split off."}
  de.a2.unit98.lesson01.teach.reihenfolge: {"title": "Words for the order", "gloss": "first / then / afterwards / finally", "example_gloss": ["First Felix showered.", "Then he had breakfast.", "Afterwards he put on the jacket.", "Finally he went to work."], "note": "These words put the steps of a morning in order. The conjugated verb stays in second position after them."}
  de.a2.unit98.lesson01.teach.gn_perfekt: {"title": "The perfect: haben or sein plus participle", "gloss": "I have showered. I got up. He had breakfast. He went (by vehicle).", "note": "The perfect has two parts: *haben* or *sein* in second position, and the participle at the very end. Verbs of movement and change (*aufstehen*, *fahren*) use *sein*; most others use *haben*."}
  de.a2.unit98.lesson01.teach.gn_trennbar: {"title": "Separable verbs: ge- goes in the middle", "gloss": "get up, got up. put on, put on. shop, shopped. pick up, picked up.", "note": "With a separable verb the participle is built as prefix + ge + stem: *auf-ge-standen*, *an-ge-zogen*, *ein-ge-kauft*, *ab-ge-holt*. The ge- sits between prefix and stem."}
  de.a2.unit98.lesson01.teach.satz_morgen: {"title": "A morning in three steps", "gloss": "Felix got up at six o'clock. He showered and had breakfast."}
  de.a2.unit98.lesson02.teach.trennbare_verben: {"title": "More separable verbs", "gloss": "to shop / to tidy up / to call / to pick up / to take along", "example_gloss": ["Anna bought bread.", "Felix tidied the kitchen.", "He called Anna.", "He took the bag with him.", "He picked Anna up."], "note": "All five verbs are separable: *Ich rufe Anna an* in the present, *Ich habe Anna angerufen* in the perfect."}
  de.a2.unit98.lesson02.teach.untrennbare_verben: {"title": "Verbs that do not separate", "gloss": "to pay for / to visit / to get / to forget", "example_gloss": ["Felix paid for the coffee.", "He visited his uncle.", "He got a message.", "He forgot the key."], "note": "These verbs start with an unstressed prefix (such as *be-*) that never separates. They get no *ge-* in the participle."}
  de.a2.unit98.lesson02.teach.gn_unterschied: {"title": "With and without ge-", "gloss": "called, shopped, taken along. paid, visited, got, forgotten.", "note": "Separable verbs have *ge-* in the middle (*an-ge-rufen*). Verbs with an unstressed prefix such as *be-*, *er-*, *ent-* or *zer-* never add *ge-*: *bezahlt*, *vergessen*."}
  de.a2.unit98.lesson02.teach.gn_stellung: {"title": "Where the participle goes", "gloss": "Felix called Anna. Afterwards he took the bag with him.", "note": "The helper (*hat*) is the second element of the sentence; the participle always comes last. After *danach* the verb stays second: *Danach hat er ...*."}
  de.a2.unit98.lesson02.teach.satz_anruf: {"title": "Calling someone", "gloss": "At seven o'clock Felix called Anna."}
  de.a2.unit98.lesson03.teach.unterwegs: {"title": "On the way to work", "gloss": "to walk to the bus stop / to get on / to get off / to arrive", "example_gloss": ["Felix walked to the bus stop.", "He got on the bus.", "He got off at the station.", "He arrived at the office."], "note": "Verbs of moving from one place to another use *sein* in the perfect."}
  de.a2.unit98.lesson03.teach.nehmen: {"title": "Taking the bus", "gloss": "the bus / to take / work", "example_gloss": ["Felix took the bus.", "He went by bus."], "note": "Compare: *den Bus nehmen* (take it) uses *haben*, but *mit dem Bus fahren* (travel) uses *sein*."}
  de.a2.unit98.lesson03.teach.gn_sein: {"title": "Sein for movement and change", "gloss": "I travelled. I got on. I arrived. I got up.", "note": "Use *sein* when you go somewhere (*fahren*, *gehen*, *ankommen*, *einsteigen*) or when something changes (*aufstehen*). The participle still comes last."}
  de.a2.unit98.lesson03.teach.gn_haben: {"title": "Haben for actions", "gloss": "I worked. I ate. I took the bus.", "note": "Most verbs, including every verb with a direct object (*den Bus nehmen*), use *haben*."}
  de.a2.unit98.lesson03.teach.satz_vergleich: {"title": "Two ways to the office", "gloss": "Felix took the bus. Felix went by bus.", "note": "Both sentences describe the same trip. Only the verb changes, and with it the helper."}
  de.a2.unit98.lesson04.teach.uhrzeiten: {"title": "Times in the morning", "gloss": "at half past six / at a quarter past seven / at eight o'clock", "example_gloss": ["I got up at half past six.", "At a quarter past seven I had breakfast.", "At eight o'clock I arrived."], "note": "*Halb sieben* means half past six (half way to seven)."}
  de.a2.unit98.lesson04.teach.gn_zeit_vorn: {"title": "A time at the start of the sentence", "gloss": "At seven o'clock I had breakfast. First I got up.", "note": "When a time or a sequence word starts the sentence, the helper verb comes next and the subject after it: *Um sieben Uhr habe ich ...*. The verb is always the second element."}
  de.a2.unit98.lesson04.teach.gn_und: {"title": "Two participles, one helper", "gloss": "I showered and had breakfast. I got up and walked to the bus stop.", "note": "When two verbs take the same helper, say it once. If the helpers differ (*bin* and *habe*), you repeat them."}
  de.a2.unit98.lesson04.teach.satz_reihenfolge: {"title": "Three steps", "gloss": "First I got up. Afterwards I showered. Finally I went to work."}
  de.a2.unit98.lesson05.teach.lesewoerter: {"title": "Words for the message", "gloss": "hectic / quickly / not / but / luckily", "example_gloss": ["My morning was hectic.", "I showered quickly.", "I didn't have breakfast, but I drank coffee.", "Luckily I took the bus."], "note": "*War* is the simple past of *sein* (was). You will practise it fully in the next unit; here it appears as a ready-made chunk."}
  de.a2.unit98.lesson05.teach.gn_verneinung: {"title": "Not with the perfect", "gloss": "I didn't have breakfast. I didn't get up.", "note": "*Nicht* comes just before the participle at the end of the sentence."}
  de.a2.unit98.lesson05.teach.gn_aber: {"title": "Aber joins two sentences", "gloss": "I didn't have breakfast, but I drank coffee.", "note": "*Aber* does not change the word order: the second half is a normal sentence with the verb second."}
  de.a2.unit98.lesson05.teach.lesen_nachricht: {"title": "Felix writes to Anna", "gloss": "Hi Anna, my morning was hectic! I got up at half past six. First I showered quickly, but I didn't have breakfast. Then I took my bag, but I forgot the key. I walked to the bus stop and got on the bus. At eight o'clock I arrived at the office. Best wishes, Felix", "note": "Notice the sequence words and the participle at the end of every sentence.", "glosses": {"hektisch": "hectic", "schnell": "quickly", "vergessen": "forgotten", "Haltestelle": "bus stop"}}
  de.a2.unit98.lesson06.teach.anna_frage: {"title": "Anna asks", "gloss": "Anna: Hi Felix! How was your morning?"}
  de.a2.unit98.lesson06.teach.felix_antwort: {"title": "Felix answers", "gloss": "Felix: Hectic! I got up at half past six and showered quickly."}
  de.a2.unit98.lesson06.teach.anna_fruehstueck: {"title": "Anna asks about breakfast", "gloss": "Anna: Did you have breakfast?"}
  de.a2.unit98.lesson06.teach.felix_nein: {"title": "Felix explains", "gloss": "Felix: No. I forgot the key and hurried to the bus stop. At eight o'clock I arrived at the office."}
  de.a2.unit98.lesson06.teach.anna_hunger: {"title": "Anna offers", "gloss": "Anna: Then you must be hungry! I bought fresh bread."}
  de.a2.unit98.lesson06.teach.felix_danke: {"title": "Felix thanks her", "gloss": "Felix: Great, thanks! I'll come after work."}
exercises:
  de.a2.unit98.lesson01.exercise01.wahl_aufgestanden: {"instruction": "Choose the correct German sentence.", "correct_option": "Ich bin um sechs Uhr aufgestanden.", "distractors": ["Ich habe um sechs Uhr aufgestanden.", "Ich bin um sechs Uhr aufgestehen.", "Ich bin um sechs Uhr geaufgestanden."], "accepted_answers": [{"value": "Ich bin um sechs Uhr aufgestanden.", "status": "correct"}], "feedback": "*Aufstehen* uses *sein*, and the participle is *aufgestanden*."}
  de.a2.unit98.lesson01.exercise02.wahl_angezogen: {"instruction": "Choose the correct German sentence.", "correct_option": "Ich habe die Jacke angezogen.", "distractors": ["Ich habe die Jacke geanzogen.", "Ich habe die Jacke gezogen an.", "Ich bin die Jacke angezogen."], "accepted_answers": [{"value": "Ich habe die Jacke angezogen.", "status": "correct"}], "feedback": "The participle of *anziehen* is *angezogen*, and the transitive verb takes *haben*."}
  de.a2.unit98.lesson01.exercise03.paare_partizipien: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "aufgestanden", "right": "got up"}, {"left": "angezogen", "right": "put on (clothes)"}, {"left": "geduscht", "right": "showered"}, {"left": "gefrühstückt", "right": "had breakfast"}, {"left": "eingekauft", "right": "bought (groceries)"}, {"left": "abgeholt", "right": "picked up"}], "status": "correct"}], "feedback": "These participles are the building blocks of the unit."}
  de.a2.unit98.lesson01.exercise04.ordnen_aufgestanden: {"instruction": "Put the words in order to say 'Felix got up at six o'clock.'", "correct_option": "Felix ist um sechs Uhr aufgestanden", "accepted_answers": [{"value": "Felix ist um sechs Uhr aufgestanden", "status": "correct"}, {"value": "Um sechs Uhr ist Felix aufgestanden", "status": "correct"}], "feedback": "*Ist* is in second position and the participle *aufgestanden* is last."}
  de.a2.unit98.lesson01.exercise05.luecke_bin: {"instruction": "Complete with the correct form of haben or sein.", "correct_option": "bin", "accepted_answers": [{"value": "bin", "status": "correct"}], "feedback": "*Aufstehen* is a movement/change verb, so it takes *sein*: *Ich bin aufgestanden.*"}
  de.a2.unit98.lesson01.exercise06.uebersetzen_geduscht: {"instruction": "Translate into German.", "accepted_answers": [{"value": "Ich habe geduscht.", "status": "correct"}], "feedback": "*Ich habe geduscht* = I showered / I have showered."}
  de.a2.unit98.lesson01.exercise07.schreiben_jacke: {"instruction": "Write the requested German sentence.", "correct_option": "Felix hat die Jacke angezogen.", "accepted_answers": [{"value": "Felix hat die Jacke angezogen.", "status": "correct"}], "feedback": "*Felix hat die Jacke angezogen.* *An* + *ge* + *zogen*."}
  de.a2.unit98.lesson02.exercise01.wahl_angerufen: {"instruction": "Choose the correct German sentence.", "correct_option": "Felix hat Anna angerufen.", "distractors": ["Felix hat Anna geanrufen.", "Felix hat Anna gerufen an.", "Felix hat angerufen Anna."], "accepted_answers": [{"value": "Felix hat Anna angerufen.", "status": "correct"}], "feedback": "*Anrufen* is separable: *an-ge-rufen*, and the participle is last."}
  de.a2.unit98.lesson02.exercise02.wahl_bezahlt: {"instruction": "Choose the correct German sentence.", "correct_option": "Er hat den Kaffee bezahlt.", "distractors": ["Er hat den Kaffee gebezahlt.", "Er hat den Kaffee bezahlen.", "Er hat bezahlt den Kaffee."], "accepted_answers": [{"value": "Er hat den Kaffee bezahlt.", "status": "correct"}], "feedback": "*Bezahlen* starts with *be-*, so the participle has no *ge-*: *bezahlt*."}
  de.a2.unit98.lesson02.exercise03.paare_saetze: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Er hat Anna angerufen.", "right": "He called Anna."}, {"left": "Er hat die Tasche mitgenommen.", "right": "He took the bag with him."}, {"left": "Er hat die Küche aufgeräumt.", "right": "He tidied the kitchen."}, {"left": "Er hat den Kaffee bezahlt.", "right": "He paid for the coffee."}, {"left": "Er hat den Schlüssel vergessen.", "right": "He forgot the key."}, {"left": "Er hat eine Nachricht bekommen.", "right": "He got a message."}], "status": "correct"}], "feedback": "Each sentence uses *hat* and a participle at the end."}
  de.a2.unit98.lesson02.exercise04.ordnen_tasche: {"instruction": "Put the words in order to say 'He took the bag with him.'", "correct_option": "Er hat die Tasche mitgenommen", "accepted_answers": [{"value": "Er hat die Tasche mitgenommen", "status": "correct"}], "feedback": "The participle *mitgenommen* stands at the end."}
  de.a2.unit98.lesson02.exercise05.luecke_aufgeraeumt: {"instruction": "Complete with the participle of aufräumen.", "correct_option": "aufgeräumt", "accepted_answers": [{"value": "aufgeräumt", "status": "correct"}, {"value": "aufgeraeumt", "status": "correct"}], "feedback": "*Auf-ge-räumt*: the ge- goes between prefix and stem."}
  de.a2.unit98.lesson02.exercise06.uebersetzen_angerufen: {"instruction": "Translate into German.", "accepted_answers": [{"value": "Er hat Anna angerufen.", "status": "correct"}], "feedback": "*Er hat Anna angerufen* is the perfect, the normal choice when speaking."}
  de.a2.unit98.lesson02.exercise07.schreiben_schluessel: {"instruction": "Write the requested German sentence.", "correct_option": "Felix hat den Schlüssel vergessen.", "accepted_answers": [{"value": "Felix hat den Schlüssel vergessen.", "status": "correct"}, {"value": "Felix hat den Schluessel vergessen.", "status": "correct"}], "feedback": "*Vergessen* has no *ge-*, and its participle looks like the infinitive."}
  de.a2.unit98.lesson03.exercise01.wahl_gegangen: {"instruction": "Choose the correct German sentence.", "correct_option": "Felix ist zur Haltestelle gegangen.", "distractors": ["Felix hat zur Haltestelle gegangen.", "Felix ist zur Haltestelle gegehen.", "Felix ist zur Haltestelle gegangt."], "accepted_answers": [{"value": "Felix ist zur Haltestelle gegangen.", "status": "correct"}], "feedback": "*Gehen* is a movement verb: *ist ... gegangen*."}
  de.a2.unit98.lesson03.exercise02.wahl_genommen: {"instruction": "Choose the correct German sentence.", "correct_option": "Er hat den Bus genommen.", "distractors": ["Er ist den Bus genommen.", "Er hat den Bus genommt.", "Er hat den Bus nehmen."], "accepted_answers": [{"value": "Er hat den Bus genommen.", "status": "correct"}], "feedback": "*Nehmen* has a direct object (*den Bus*) and takes *haben*: *genommen*."}
  de.a2.unit98.lesson03.exercise03.paare_bewegung: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "gegangen", "right": "walked, went"}, {"left": "gefahren", "right": "travelled, drove"}, {"left": "eingestiegen", "right": "got on"}, {"left": "ausgestiegen", "right": "got off"}, {"left": "angekommen", "right": "arrived"}, {"left": "genommen", "right": "taken"}], "status": "correct"}], "feedback": "All of these except *genommen* use *sein*."}
  de.a2.unit98.lesson03.exercise04.ordnen_angekommen: {"instruction": "Put the words in order to say 'He arrived at the office.'", "correct_option": "Er ist im Büro angekommen", "accepted_answers": [{"value": "Er ist im Büro angekommen", "status": "correct"}, {"value": "Im Büro ist er angekommen", "status": "correct"}], "feedback": "*Ist* is second, *angekommen* is last."}
  de.a2.unit98.lesson03.exercise05.luecke_ist: {"instruction": "Complete with the correct form of haben or sein.", "correct_option": "ist", "accepted_answers": [{"value": "ist", "status": "correct"}], "feedback": "*Einsteigen* describes a movement, so it takes *sein*."}
  de.a2.unit98.lesson03.exercise06.uebersetzen_ausgestiegen: {"instruction": "Translate into German.", "accepted_answers": [{"value": "Er ist am Bahnhof ausgestiegen.", "status": "correct"}, {"value": "Am Bahnhof ist er ausgestiegen.", "status": "correct"}], "feedback": "*Aussteigen* is a movement verb and takes *sein*."}
  de.a2.unit98.lesson03.exercise07.schreiben_angekommen: {"instruction": "Write the requested German sentence.", "correct_option": "Er ist im Büro angekommen.", "accepted_answers": [{"value": "Er ist im Büro angekommen.", "status": "correct"}, {"value": "Er ist im Buero angekommen.", "status": "correct"}], "feedback": "*Er ist im Büro angekommen.* *An-ge-kommen* with *sein*."}
  de.a2.unit98.lesson04.exercise01.wahl_uhr: {"instruction": "Choose the correct German sentence.", "correct_option": "Um sieben Uhr habe ich gefrühstückt.", "distractors": ["Um sieben Uhr ich habe gefrühstückt.", "Um sieben Uhr habe gefrühstückt ich.", "Um sieben Uhr bin ich gefrühstückt."], "accepted_answers": [{"value": "Um sieben Uhr habe ich gefrühstückt.", "status": "correct"}], "feedback": "The helper *habe* stays in second position, right after the time phrase."}
  de.a2.unit98.lesson04.exercise02.wahl_und: {"instruction": "Choose the correct German sentence.", "correct_option": "Ich habe geduscht und gefrühstückt.", "distractors": ["Ich bin geduscht und gefrühstückt.", "Ich habe geduscht und frühstücken.", "Ich geduscht habe und gefrühstückt."], "accepted_answers": [{"value": "Ich habe geduscht und gefrühstückt.", "status": "correct"}], "feedback": "One *habe* serves both participles."}
  de.a2.unit98.lesson04.exercise03.paare_zeiten: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Um sechs Uhr bin ich aufgestanden.", "right": "At six o'clock I got up."}, {"left": "Um halb sieben habe ich geduscht.", "right": "At half past six I showered."}, {"left": "Um Viertel nach sieben habe ich gefrühstückt.", "right": "At a quarter past seven I had breakfast."}, {"left": "Zuerst habe ich geduscht.", "right": "First I showered."}, {"left": "Zuletzt bin ich zur Arbeit gefahren.", "right": "Finally I went to work."}, {"left": "Um acht Uhr bin ich angekommen.", "right": "At eight o'clock I arrived."}], "status": "correct"}], "feedback": "Sequence words and times both come before the helper verb."}
  de.a2.unit98.lesson04.exercise04.ordnen_sieben: {"instruction": "Put the words in order to say 'At seven o'clock I had breakfast.'", "correct_option": "Um sieben Uhr habe ich gefrühstückt", "accepted_answers": [{"value": "Um sieben Uhr habe ich gefrühstückt", "status": "correct"}, {"value": "Ich habe um sieben Uhr gefrühstückt", "status": "correct"}], "feedback": "After *um sieben Uhr* the helper comes before the subject."}
  de.a2.unit98.lesson04.exercise05.luecke_hat: {"instruction": "Complete with the correct form of haben.", "correct_option": "hat", "accepted_answers": [{"value": "hat", "status": "correct"}], "feedback": "*Nehmen* takes *haben*, and the helper stays second after *danach*."}
  de.a2.unit98.lesson04.exercise06.uebersetzen_zuerst: {"instruction": "Translate into German.", "accepted_answers": [{"value": "Zuerst habe ich geduscht, dann habe ich gefrühstückt.", "status": "correct"}, {"value": "Zuerst habe ich geduscht, danach habe ich gefrühstückt.", "status": "correct"}, {"value": "Zuerst habe ich geduscht und dann gefrühstückt.", "status": "correct"}, {"value": "Ich habe zuerst geduscht, dann habe ich gefrühstückt.", "status": "correct"}, {"value": "Zuerst habe ich geduscht, dann habe ich gefruehstueckt.", "status": "correct"}, {"value": "Zuerst habe ich geduscht, danach habe ich gefruehstueckt.", "status": "correct"}, {"value": "Zuerst habe ich geduscht und dann gefruehstueckt.", "status": "correct"}, {"value": "Ich habe zuerst geduscht, dann habe ich gefruehstueckt.", "status": "correct"}], "feedback": "Use *zuerst* for the first step and *dann* or *danach* for the next."}
  de.a2.unit98.lesson04.exercise07.schreiben_drei: {"instruction": "Write three German sentences, following the three numbered instructions.", "correct_option": "Um sechs Uhr bin ich aufgestanden. Dann habe ich geduscht. Danach habe ich gefrühstückt.", "accepted_answers": [{"value": "Um sechs Uhr bin ich aufgestanden. Dann habe ich geduscht. Danach habe ich gefrühstückt.", "status": "correct"}, {"value": "Um sechs Uhr bin ich aufgestanden. Dann habe ich geduscht. Danach habe ich gefruehstueckt.", "status": "correct"}], "feedback": "Time or sequence word first, then the helper, then the subject, then the participle."}
  de.a2.unit98.lesson05.exercise01.lesen_vergessen: {"instruction": "Read the text and choose the answer.", "correct_option": "His key.", "distractors": ["His bag.", "His jacket.", "His coffee."], "accepted_answers": [{"value": "His key.", "status": "correct"}], "feedback": "*Ich habe den Schlüssel vergessen.*"}
  de.a2.unit98.lesson05.exercise02.lesen_ankunft: {"instruction": "Read the text and choose the answer.", "correct_option": "At eight o'clock.", "distractors": ["At half past six.", "At seven o'clock.", "At a quarter past seven."], "accepted_answers": [{"value": "At eight o'clock.", "status": "correct"}], "feedback": "*Um acht Uhr bin ich im Büro angekommen.*"}
  de.a2.unit98.lesson05.exercise03.paare_woerter: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "hektisch", "right": "hectic"}, {"left": "schnell", "right": "quickly"}, {"left": "zum Glück", "right": "luckily"}, {"left": "aber", "right": "but"}, {"left": "Haltestelle", "right": "bus stop"}, {"left": "Schlüssel", "right": "key"}], "status": "correct"}], "feedback": "These words appear in Felix's message."}
  de.a2.unit98.lesson05.exercise04.ordnen_nicht: {"instruction": "Put the words in order to say 'I didn't have breakfast.'", "correct_option": "Ich habe nicht gefrühstückt", "accepted_answers": [{"value": "Ich habe nicht gefrühstückt", "status": "correct"}], "feedback": "*Nicht* stands before the participle."}
  de.a2.unit98.lesson05.exercise05.uebersetzen_halbsieben: {"instruction": "Translate into German.", "accepted_answers": [{"value": "Um halb sieben bin ich aufgestanden.", "status": "correct"}, {"value": "Ich bin um halb sieben aufgestanden.", "status": "correct"}], "feedback": "Both orders are correct; the helper stays second."}
  de.a2.unit98.lesson05.exercise06.diktat_schluessel: {"instruction": "Type what you hear.", "correct_response": "Ich habe den Schlüssel vergessen.", "orthography_strict": true, "feedback": "You heard *Ich habe den Schlüssel vergessen.*."}
  de.a2.unit98.lesson05.exercise07.diktat_bus: {"instruction": "Type what you hear.", "correct_response": "Ich bin in den Bus eingestiegen.", "orthography_strict": true, "feedback": "You heard *Ich bin in den Bus eingestiegen.*."}
  de.a2.unit98.lesson06.exercise01.hoeren_frage: {"instruction": "Listen and select Anna's opening question.", "correct_option": "Hallo Felix! Wie war dein Morgen?", "distractors": ["Hallo Felix! Wie ist dein Morgen?", "Hallo Felix! Hast du gefrühstückt?", "Hallo Anna! Wie war dein Morgen?"], "accepted_answers": [{"value": "Hallo Felix! Wie war dein Morgen?", "status": "correct"}], "feedback": "Anna opens with *Hallo Felix! Wie war dein Morgen?*"}
  de.a2.unit98.lesson06.exercise02.verstehen_schluessel: {"instruction": "Listen to the dialogue and choose the answer.", "correct_option": "He had no breakfast because he forgot his key and hurried.", "distractors": ["He had no breakfast because he got up late.", "He had no breakfast because the bus was late.", "He had breakfast at the bus stop."], "accepted_answers": [{"value": "He had no breakfast because he forgot his key and hurried.", "status": "correct"}], "feedback": "Felix says he forgot the key and went quickly to the bus stop."}
  de.a2.unit98.lesson06.exercise03.paare_dialog: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Ich bin um halb sieben aufgestanden.", "right": "I got up at half past six."}, {"left": "Ich habe schnell geduscht.", "right": "I showered quickly."}, {"left": "Ich habe den Schlüssel vergessen.", "right": "I forgot the key."}, {"left": "Ich bin schnell zur Haltestelle gegangen.", "right": "I hurried to the bus stop."}, {"left": "Um acht Uhr bin ich im Büro angekommen.", "right": "At eight o'clock I arrived at the office."}, {"left": "Ich habe frisches Brot eingekauft.", "right": "I bought fresh bread."}], "status": "correct"}], "feedback": "Each line from the dialogue is in the perfect tense."}
  de.a2.unit98.lesson06.exercise04.ordnen_brot: {"instruction": "Put the words in order to say 'I bought fresh bread.'", "correct_option": "Ich habe frisches Brot eingekauft", "accepted_answers": [{"value": "Ich habe frisches Brot eingekauft", "status": "correct"}], "feedback": "*Eingekauft* is the participle at the end."}
  de.a2.unit98.lesson06.exercise05.antwort_morgen: {"instruction": "Answer in German: say that it was hectic and that you got up at half past six.", "correct_option": "Hektisch! Ich bin um halb sieben aufgestanden.", "accepted_answers": [{"value": "Hektisch! Ich bin um halb sieben aufgestanden.", "status": "correct"}, {"value": "Hektisch! Um halb sieben bin ich aufgestanden.", "status": "correct"}], "feedback": "*Hektisch! Ich bin um halb sieben aufgestanden.*"}
  de.a2.unit98.lesson06.exercise06.uebersetzen_hunger: {"instruction": "Translate into German.", "accepted_answers": [{"value": "Dann hast du sicher Hunger.", "status": "correct"}, {"value": "Du hast dann sicher Hunger.", "status": "correct"}], "feedback": "*Sicher* means 'surely' and sits after the verb."}
  de.a2.unit98.lesson06.exercise07.schreiben_nachricht: {"instruction": "Write three German sentences, following the three numbered instructions.", "correct_option": "Ich bin um sieben Uhr aufgestanden. Ich habe geduscht. Ich habe die Tasche mitgenommen.", "accepted_answers": [{"value": "Ich bin um sieben Uhr aufgestanden. Ich habe geduscht. Ich habe die Tasche mitgenommen.", "status": "correct"}], "feedback": "Three perfect sentences: *bin aufgestanden*, *habe geduscht*, *habe mitgenommen*."}
