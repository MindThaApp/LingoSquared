course:
  title: German B2
  description: >-
    Upper-intermediate German: recount a complex sequence of events with
    shifting time reference -- scene-setting and a sequence of events
    (Präteritum and Perfekt), a single past event versus an ongoing one (als vs. während),
    and an event before other past events (Plusquamperfekt) -- through the
    story of a chaotic morning that made a colleague late for work.

units:
  de.b2.unit04.erzaehlung:
    title: "Telling a story"
    description: Recount a complex sequence of events with shifting time reference -- background versus foreground, events before other past events, and interrupted or ongoing actions -- keeping the timeline unambiguous.

lessons:
  de.b2.unit04.lesson01.hintergrund:
    title: "Background"
  de.b2.unit04.lesson02.ereignis:
    title: "Event"
  de.b2.unit04.lesson03.als_und_waehrend:
    title: "Als and während"
  de.b2.unit04.lesson04.plusquamperfekt:
    title: "The past perfect"
  de.b2.unit04.lesson05.eine_geschichte_lesen:
    title: "Reading a story"
  de.b2.unit04.lesson06.eine_geschichte_erzaehlen:
    title: "Telling a story"

teaching:
  de.b2.unit04.lesson01.teach.ich_war_muede:
    title: "I was tired."
    gloss: "I was tired."
    note: "*War* (Präteritum of *sein*) is one of the small set of high-frequency verbs (sein, haben, the modals) that German narrates in Präteritum even in otherwise spoken/Perfekt-based storytelling. This lesson sets the BACKGROUND of Felix's story."
  de.b2.unit04.lesson01.teach.an_diesem_morgen:
    title: "that morning"
    gloss: "that morning"
  de.b2.unit04.lesson01.teach.regnen:
    title: "to rain"
    gloss: "to rain"
    note: "*Regnete* is the Präteritum of *regnen* -- here it describes the weather at the start of the story."
    example_gloss: "It was raining that morning."
  de.b2.unit04.lesson01.teach.draussen_kalt:
    title: "cold outside"
    gloss: "cold outside"
  de.b2.unit04.lesson01.teach.es_eilig_haben:
    title: "to be in a hurry"
    gloss: "to be in a hurry"
    note: "*Hatte* is the Präteritum of *haben* -- like *war*, normally used in Präteritum even in spoken narration."
    example_gloss: "I was in a hurry."
  de.b2.unit04.lesson01.teach.noch_dunkel:
    title: "still dark"
    gloss: "still dark"
  de.b2.unit04.lesson01.teach.grammar_praeteritum:
    title: "I was tired, because it was still dark. It was raining, and it was cold outside. I was in a hurry."
    gloss: "I was tired, because it was still dark. It was raining, and it was cold outside. I was in a hurry."
    note: "In spoken German, a few very common verbs (sein, haben, the modals) are normally used in Präteritum (war, hatte), while most other verbs tell events in Perfekt; in written storytelling, Präteritum is used throughout. German has no separate 'background tense' -- the time relations are signalled by words like zuerst, als, während and by the Plusquamperfekt."

  de.b2.unit04.lesson02.teach.bus_verpassen:
    title: "to miss the bus"
    gloss: "to miss the bus"
  de.b2.unit04.lesson02.teach.habe_verpasst:
    title: "I missed the bus."
    gloss: "I missed the bus."
    note: "*Habe ... verpasst* is PERFEKT -- the usual past tense for most verbs when you tell a story aloud. In written storytelling the same event would normally be in Präteritum (*verpasste*)."
  de.b2.unit04.lesson02.teach.ankommen:
    title: "to arrive"
    gloss: "to arrive"
    note: "*Ankommen* takes *sein* as its auxiliary: *bin angekommen* (I arrived), not *habe angekommen*."
    example_gloss: "I arrived late."
  de.b2.unit04.lesson02.teach.zuerst:
    title: first
    gloss: first
    example_gloss: "First I missed the bus."
  de.b2.unit04.lesson02.teach.dann:
    title: then
    gloss: then
    example_gloss: "Then I walked."
  de.b2.unit04.lesson02.teach.danach:
    title: "after that"
    gloss: "after that"
    example_gloss: "After that I took a taxi."
  de.b2.unit04.lesson02.teach.schliesslich:
    title: finally
    gloss: finally
    example_gloss: "Finally I arrived at the office."
  de.b2.unit04.lesson02.teach.grammar_perfekt:
    title: "First I missed the bus. Then I walked. After that I took a taxi. Finally I arrived."
    gloss: "First I missed the bus. Then I walked. After that I took a taxi. Finally I arrived."
    note: "When you tell a story aloud, most verbs give the sequence of what happened in PERFEKT (habe/bin + past participle) -- in writing they would be Präteritum -- signposted by *zuerst*, *dann*, *danach*, *schließlich* so the order stays unambiguous."

  de.b2.unit04.lesson03.teach.bahnhof:
    title: "the train station"
    gloss: "the train station"
    example_gloss: "I was at the train station."
  de.b2.unit04.lesson03.teach.abfahren:
    title: "to depart"
    gloss: "to depart"
    note: "*Abfahren* is separable: *fährt ab* / Präteritum *fuhr ab*. *Gerade* here means 'just [in the middle of departing]', not 'straight'."
    example_gloss: "The train was just departing."
  de.b2.unit04.lesson03.teach.als:
    title: "when (single past event)"
    gloss: "when (single past event)"
    note: "*Als* introduces ONE specific past event/moment -- 'when I arrived [that one time]'. English 'when' covers this AND habitual 'whenever'; German splits them (compare *wenn*, taught later in this lesson)."
    example_gloss: "When I arrived at the station, the train was just departing."
  de.b2.unit04.lesson03.teach.chef:
    title: "the boss"
    gloss: "the boss"
    example_gloss: "My boss called."
  de.b2.unit04.lesson03.teach.warten:
    title: "to wait"
    gloss: "to wait"
    example_gloss: "I was waiting for the next train."
  de.b2.unit04.lesson03.teach.waehrend:
    title: "while (ongoing, simultaneous)"
    gloss: "while (ongoing, simultaneous)"
    note: "*Während* marks an ONGOING background action interrupted by a foregrounded one: *während ich wartete, rief mein Chef an* -- the waiting was already in progress when the call happened."
    example_gloss: "While I was waiting, my boss called."
  de.b2.unit04.lesson03.teach.grammar_als_waehrend:
    title: "When I arrived, the train was just departing. While I was waiting for the next one, my boss called. Whenever I'm late, I always call."
    gloss: "When I arrived, the train was just departing. While I was waiting for the next one, my boss called. Whenever I'm late, I always call."
    note: "*Als* = one specific past event. *Während* = an ongoing action interrupted by another. *Wenn* = a repeated/habitual pattern (or a non-past condition) -- NOT a single past event. English 'when' blurs all three; German keeps them grammatically distinct."

  de.b2.unit04.lesson04.teach.nicht:
    title: not
    gloss: not
    example_gloss: "I had not heard it."
  de.b2.unit04.lesson04.teach.wecker_stellen:
    title: "to set the alarm"
    gloss: "to set the alarm (clock)"
  de.b2.unit04.lesson04.teach.plusquam_wecker:
    title: "I had not set the alarm."
    gloss: "I had not set the alarm."
    note: "PLUSQUAMPERFEKT: *hatte* + past participle (*gestellt*), sent to the very end. This marks an event that was already true BEFORE the rest of the story's timeline -- English 'had not set' works the same way, but German's word order puts everything after *hatte* at the clause's end."
  de.b2.unit04.lesson04.teach.abend_zuvor:
    title: "the evening before"
    gloss: "the evening before"
  de.b2.unit04.lesson04.teach.schon_abgefahren:
    title: "The train had already departed."
    gloss: "The train had already departed."
    note: "*Abfahren* takes *sein*, so its Plusquamperfekt is *war ... abgefahren*, not *hatte ... abgefahren*."
  de.b2.unit04.lesson04.teach.bevor:
    title: before
    gloss: before
    note: "*Bevor* introduces the LATER event in the sentence, even though it names what comes chronologically after in English word order habits -- read the whole sentence before deciding which event is earlier."
    example_gloss: "The train had already departed before I arrived at the station."
  de.b2.unit04.lesson04.teach.nachdem:
    title: after
    gloss: after
    note: "*Nachdem* introduces the EARLIER event (a Plusquamperfekt clause), with the later event in the main clause."
    example_gloss: "After the train had departed, I waited at the station."
  de.b2.unit04.lesson04.teach.grammar_plusquam:
    title: "I had not set the alarm. The train had already departed, before I arrived at the station."
    gloss: "I had not set the alarm. The train had already departed, before I arrived at the station."
    note: "Plusquamperfekt (hatte/war + past participle) marks an event that had already happened before the main past-tense timeline -- the earliest layer of a complex narrative."

  de.b2.unit04.lesson05.teach.text:
    title: "Reading: a chaotic morning"
    gloss: "It was raining that morning, and I was tired. I had not set the alarm the evening before, so I woke up late. First I missed the bus. Then I walked to the train station. When I arrived, the train was already gone -- it had already departed before I got there. While I was waiting for the next one, my boss called. Finally I arrived at the office two hours late."
    glosses:
      wachte: "woke (wachte auf = woke up)"
      auf: "up (part of aufwachen, to wake up)"
      dort: there
      weg: "gone / away"
      zwei: two
      Stunden: hours
      im: "in the (im Büro = at the office)"
      Büro: office

  de.b2.unit04.lesson06.teach.warum_kamen_sie_an:
    title: "Why did you arrive so late today?"
    gloss: "Why did you arrive so late today?"
  de.b2.unit04.lesson06.teach.und_dann:
    title: "And then?"
    gloss: "And then?"
  de.b2.unit04.lesson06.teach.das_klingt_nach:
    title: "That sounds like a rough morning."
    gloss: "That sounds like a rough morning."
  de.b2.unit04.lesson06.teach.dialogue_vogel_ask:
    title: "Frau Vogel: Why did you arrive so late today?"
    gloss: "Frau Vogel: Why did you arrive so late today?"
  de.b2.unit04.lesson06.teach.dialogue_felix_background:
    title: "Felix: I had not set the alarm the evening before, so I woke up late."
    gloss: "Felix: I had not set the alarm the evening before, so I woke up late."
  de.b2.unit04.lesson06.teach.dialogue_felix_first_event:
    title: "Felix: First I missed the bus."
    gloss: "Felix: First I missed the bus."
  de.b2.unit04.lesson06.teach.dialogue_vogel_prompt:
    title: "Frau Vogel: And then?"
    gloss: "Frau Vogel: And then?"
  de.b2.unit04.lesson06.teach.dialogue_felix_prepast:
    title: "Felix: When I arrived at the station, the train was just departing. While I was waiting for the next one, my boss called."
    gloss: "Felix: When I arrived at the station, the train was just departing. While I was waiting for the next one, my boss called."
  de.b2.unit04.lesson06.teach.dialogue_vogel_confirm:
    title: "Frau Vogel: That sounds like a rough morning."
    gloss: "Frau Vogel: That sounds like a rough morning."
  de.b2.unit04.lesson06.teach.grammar_volle_geschichte:
    title: "I had not set the alarm. First I missed the bus. When I arrived at the station, the train was just departing."
    gloss: "I had not set the alarm. First I missed the bus. When I arrived at the station, the train was just departing."
    note: "A complete complex narrative layers three time relations: prior-past background (Plusquamperfekt), sequenced events (Perfekt with zuerst), and a single-moment simultaneity (als). Each layer has its own marker, so the listener can always reconstruct the order of events."

exercises:
  de.b2.unit04.lesson01.exercise01.recognize_regnete:
    instruction: "What does this word mean?"
    correct_option: "was raining"
    distractors: ["is raining", "will rain", "had rained"]
    accepted_answers: [{value: "was raining", status: correct}]
    feedback: "Regnete is the Präteritum of regnen -- was raining."
  de.b2.unit04.lesson01.exercise02.listen_regnete:
    instruction: "Listen and select what you hear."
    correct_option: "It was raining that morning, and it was cold outside."
    distractors: ["It was sunny that morning, and it was warm outside.", "It rained the night before.", "It was raining, and it was warm outside."]
    accepted_answers: [{value: "It was raining that morning, and it was cold outside.", status: correct}]
    feedback: "Es regnete an diesem Morgen, und draußen war es kalt means it was raining that morning, and it was cold outside."
  de.b2.unit04.lesson01.exercise03.match_background_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {"Ich war müde.": "I was tired.", "an diesem Morgen": "that morning", regnete: "was raining", draußen: outside, kalt: cold, "es eilig haben": "to be in a hurry", noch: still, dunkel: dark}
        status: correct
    feedback: "These are this lesson's background-scene words."
  de.b2.unit04.lesson01.exercise04.order_noch_dunkel:
    instruction: "Put the words in order: It was still dark."
    accepted_answers:
      - {value: "Es war noch dunkel", status: correct}
    feedback: "Es war noch dunkel means it was still dark."
  de.b2.unit04.lesson01.exercise05.translate_regnete:
    instruction: "Translate into German: It was raining that morning."
    accepted_answers:
      - {value: "Es regnete an diesem Morgen", status: correct}
      - {value: "An diesem Morgen regnete es", status: correct}
    feedback: "Es regnete an diesem Morgen means it was raining that morning."
  de.b2.unit04.lesson01.exercise06.write_ich_war_muede:
    instruction: "Write in German, using denn: I was tired, because it was still dark."
    accepted_answers:
      - {value: "Ich war müde, denn es war noch dunkel", status: correct}
      - {value: "Ich war müde denn es war noch dunkel", status: correct}
      - {value: "Ich war muede, denn es war noch dunkel", status: correct}
    feedback: "Ich war müde, denn es war noch dunkel means I was tired, because it was still dark."
  de.b2.unit04.lesson01.exercise07.speak_eilig:
    instruction: "Say aloud in German: I was in a hurry."
    accepted_answers:
      - {value: "Ich hatte es eilig", status: correct}
    feedback: "Ich hatte es eilig means I was in a hurry."
  de.b2.unit04.lesson01.exercise08.dictation_regnete:
    instruction: "Type what you hear."
    correct_response: "Es regnete an diesem Morgen, und draußen war es kalt"
    orthography_strict: true
    feedback: "You heard Es regnete an diesem Morgen, und draußen war es kalt — it was raining that morning, and it was cold outside."

  de.b2.unit04.lesson02.exercise01.recognize_verpasst:
    instruction: "What does this word mean?"
    correct_option: missed
    distractors: [arrived, departed, waited]
    accepted_answers: [{value: missed, status: correct}]
    feedback: "Verpasst means missed, from verpassen."
  de.b2.unit04.lesson02.exercise02.listen_bus_verpasst:
    instruction: "Listen and select what you hear."
    correct_option: "First I missed the bus."
    distractors: ["First I missed the train.", "Then I missed the bus.", "I never missed the bus."]
    accepted_answers: [{value: "First I missed the bus.", status: correct}]
    feedback: "Zuerst habe ich den Bus verpasst means first I missed the bus."
  de.b2.unit04.lesson02.exercise03.match_sequence_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {"den Bus verpassen": "to miss the bus", ankommen: "to arrive", zuerst: first, dann: then, danach: "after that", schließlich: finally}
        status: correct
    feedback: "These are this lesson's sequence-signposting words."
  de.b2.unit04.lesson02.exercise04.order_bus_verpasst:
    instruction: "Put the words in order: First I missed the bus."
    accepted_answers:
      - {value: "Zuerst habe ich den Bus verpasst", status: correct}
      - {value: "Ich habe zuerst den Bus verpasst", status: correct}
    feedback: "Zuerst habe ich den Bus verpasst means first I missed the bus."
  de.b2.unit04.lesson02.exercise05.translate_bin_angekommen:
    instruction: "Translate into German, using bin ... angekommen: I arrived late."
    accepted_answers:
      - {value: "Ich bin spät angekommen", status: correct}
      - {value: "Ich bin spaet angekommen", status: correct}
      - {value: "Ich bin zu spät angekommen", status: correct}
    feedback: "Ich bin spät angekommen means I arrived late."
  de.b2.unit04.lesson02.exercise06.write_schliesslich:
    instruction: "Write in German, using schließlich: Finally, I arrived at the office."
    accepted_answers:
      - {value: "Schließlich bin ich im Büro angekommen", status: correct}
      - {value: "Schliesslich bin ich im Buero angekommen", status: correct}
    feedback: "Schließlich bin ich im Büro angekommen means finally, I arrived at the office."
  de.b2.unit04.lesson02.exercise07.write_danach:
    instruction: "Write in German, using danach: After that, I took a taxi."
    accepted_answers:
      - {value: "Danach habe ich ein Taxi genommen", status: correct}
    feedback: "Danach habe ich ein Taxi genommen means after that, I took a taxi."
  de.b2.unit04.lesson02.exercise08.dictation_bus_verpasst:
    instruction: "Type what you hear."
    correct_response: "Zuerst habe ich den Bus verpasst"
    orthography_strict: true
    feedback: "You heard Zuerst habe ich den Bus verpasst — first I missed the bus."

  de.b2.unit04.lesson03.exercise01.recognize_als:
    instruction: "What does this word mean?"
    correct_option: "when (single past event)"
    distractors: ["whenever (habitual)", "while (ongoing)", "before"]
    accepted_answers: [{value: "when (single past event)", status: correct}]
    feedback: "Als marks ONE specific past event -- not a habitual 'whenever', which is wenn."
  de.b2.unit04.lesson03.exercise02.listen_als_ankam:
    instruction: "Listen and select what you hear."
    correct_option: "When I arrived at the station, the train was just departing."
    distractors: ["When I arrived at the station, the train had already left.", "While I was at the station, the train departed.", "When I arrived at the station, my boss called."]
    accepted_answers: [{value: "When I arrived at the station, the train was just departing.", status: correct}]
    feedback: "Als ich am Bahnhof ankam, fuhr der Zug gerade ab means when I arrived at the station, the train was just departing."
  de.b2.unit04.lesson03.exercise03.match_time_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {"der Bahnhof": "the train station", abfahren: "to depart", als: "when (single past event)", "der Chef": "the boss", warten: "to wait", während: "while (ongoing, simultaneous)"}
        status: correct
    feedback: "These are this lesson's time-relation words."
  de.b2.unit04.lesson03.exercise04.order_als_ankam:
    instruction: "Put the words in order: When I arrived at the station, the train was just departing."
    accepted_answers:
      - {value: "Als ich am Bahnhof ankam fuhr der Zug gerade ab", status: correct}
      - {value: "Der Zug fuhr gerade ab als ich am Bahnhof ankam", status: correct}
