  notes: >-
    Overlay for de's fourth B2 unit, authored alongside the realization.
    English speakers' real interference risks for this outcome: (1)
    English 'when' covers both German 'als' (single past event) and 'wenn'
    (habitual/repeated or non-past) -- flagged explicitly in lesson03,
    with a dedicated habitual-wenn writing exercise so the contrast is
    tested, not just glossed; (2) English 'while' covers both simultaneity
    types German keeps distinct via clause type; 'während' here always
    marks an ongoing background action interrupted by a foregrounded one;
    (3) the Plusquamperfekt's word order (hatte/war ... [participle] at
    the very end) has no direct English mapping -- flagged in lesson04;
    (4) Präteritum vs. Perfekt: English uses one past tense throughout, so
    the register split (Präteritum for background war/hatte/regnete,
    Perfekt for foregrounded sequence events) is flagged as a German-only
    distinction in lesson01/02's notes. No sibling direction file (de-en
    b2) was consulted.

    Fresh-context review 2026-10-11 (content-reviewer.md checklist):
    checked grading shapes, boolean coercion, jargon/AI leaks, character
    canon, als/wenn/während and Plusquamperfekt examples, cumulative token
    coverage and underdetermined production prompts. Fixes: overlay
    lesson01.teach.grammar_praeteritum note rewritten (Präteritum vs
    Perfekt is a spoken/written register split with the sein/haben/modal
