teaching:
  de.a1.unit20.lesson01.teach.wetter: {title: "Wetter", gloss: "weather", note: "*Wetter* is neuter: *das Wetter*.", example_gloss: "How is the weather?"}
  de.a1.unit20.lesson01.teach.sonnig: {title: "sonnig", gloss: "sunny", note: "Use *Es ist sonnig* for 'It is sunny.'", example_gloss: "It is sunny."}
  de.a1.unit20.lesson01.teach.kalt: {title: "kalt", gloss: "cold", note: "*kalt* describes temperature.", example_gloss: "It is cold."}
  de.a1.unit20.lesson01.teach.warm: {title: "warm", gloss: "warm", note: "*warm* is close to English but pronounced in German.", example_gloss: "It is warm."}
  de.a1.unit20.lesson01.teach.regnet: {title: "Es regnet.", gloss: "It is raining.", note: "German keeps *Es* here; do not drop the subject.", example_gloss: "It is raining."}
  de.a1.unit20.lesson02.teach.dann: {title: "dann", gloss: "then", note: "*dann* links the weather to a plan.", example_gloss: "Then we go to the cafe."}
  de.a1.unit20.lesson02.teach.ins_cafe: {title: "Wir gehen ins Cafe.", gloss: "We are going to the cafe.", note: "*ins* means into/to the for neuter places like *das Cafe*.", example_gloss: "We are going to the cafe."}
  de.a1.unit20.lesson02.teach.morgen: {title: "morgen", gloss: "tomorrow", note: "Lowercase *morgen* means tomorrow.", example_gloss: "Tomorrow it is sunny."}
  de.a1.unit20.lesson02.teach.forecast: {title: "Wetterbericht", gloss: "weather report", note: "The forecast contrasts today and tomorrow.", example_gloss: "Tomorrow it is sunny."}
  de.a1.unit20.lesson02.teach.line01: {title: "Anna fragt nach Wetter", gloss: "Anna: Wie ist das Wetter heute?", note: "A direct weather question.", example_gloss: "How is the weather today?"}
  de.a1.unit20.lesson02.teach.line02: {title: "Felix beschreibt heute", gloss: "Felix: Es ist kalt und es regnet.", note: "The answer combines temperature and rain.", example_gloss: "It is cold and raining."}
  de.a1.unit20.lesson02.teach.line03: {title: "Anna macht einen Plan", gloss: "Anna: Dann gehen wir ins Cafe.", note: "The plan follows from the rainy weather.", example_gloss: "Then we go to the cafe."}
  de.a1.unit20.lesson02.teach.line04: {title: "Felix nennt morgen", gloss: "Felix: Gute Idee. Morgen ist es sonnig.", note: "Felix adds tomorrow's weather.", example_gloss: "Tomorrow it is sunny."}
exercises:
  de.a1.unit20.lesson01.exercise01.listen_rain: {instruction: "Listen and select the weather sentence you hear.", correct_option: "Es regnet.", distractors: ["Es ist sonnig.", "Es ist kalt.", "Es ist warm."], accepted_answers: [{value: "Es regnet.", status: "correct"}], feedback: "*Es regnet* means it is raining."}
  de.a1.unit20.lesson01.exercise02.choose_sunny: {instruction: "Which sentence means 'It is sunny'?", correct_option: "Es ist sonnig.", distractors: ["Es sonnig ist.", "Ist sonnig.", "Es regnet sonnig."], accepted_answers: [{value: "Es ist sonnig.", status: "correct"}], feedback: "Use *Es ist* plus the weather adjective."}
  de.a1.unit20.lesson01.exercise03.match_weather:
    instruction: "Match each weather word to its meaning."
    accepted_answers: [{value: [{left: "allgemeines Wort für Sonne und Regen", right: "Wetter"}, {left: "mit Sonne", right: "sonnig"}, {left: "nicht warm", right: "kalt"}, {left: "nicht kalt", right: "warm"}, {left: "Regen fällt", right: "regnet"}, {left: "dieser Tag", right: "heute"}], status: "correct"}]
    feedback: "These words describe basic weather."
  de.a1.unit20.lesson01.exercise04.order_rain: {instruction: "Put the words in order: 'It is raining today.'", accepted_answers: [{value: ["Es", "regnet", "heute"], status: "correct"}], feedback: "*Es* starts the rain sentence."}
  de.a1.unit20.lesson01.exercise05.write_weather: {instruction: "Write the taught sentence: Today it is cold.", accepted_answers: [{value: "Heute ist es kalt.", status: "correct"}, {value: "Heute ist es kalt", status: "correct"}], feedback: "This describes today's weather."}
  de.a1.unit20.lesson02.exercise01.listen_weather: {instruction: "Listen to the dialogue. What is the weather today?", correct_option: "cold and raining", distractors: ["warm and dry", "hot and windy", "cloudy and mild"], accepted_answers: [{value: "cold and raining", status: "correct"}], feedback: "Felix says it is cold and raining."}
  de.a1.unit20.lesson02.exercise02.choose_plan: {instruction: "Which sentence gives the plan because of the rain?", correct_option: "Dann gehen wir ins Cafe.", distractors: ["Morgen ist es sonnig.", "Es ist kalt.", "Wie ist das Wetter?"], accepted_answers: [{value: "Dann gehen wir ins Cafe.", status: "correct"}], feedback: "Anna suggests going to the cafe."}
  de.a1.unit20.lesson02.exercise03.match_forecast:
    instruction: "Match each weather detail."
    accepted_answers: [{value: [{left: "Tag mit Regen", right: "heute"}, {left: "Temperatur heute", right: "kalt"}, {left: "Wetteraktion heute", right: "regnet"}, {left: "Tag mit Sonne", right: "morgen"}, {left: "Wetter morgen", right: "sonnig"}, {left: "Plan bei Regen", right: "Cafe"}], status: "correct"}]
    feedback: "The dialogue connects today's weather with a plan."
  de.a1.unit20.lesson02.exercise04.order_plan: {instruction: "Put the words in order: 'Then we go to the cafe.'", accepted_answers: [{value: ["Dann", "gehen", "wir", "ins", "Cafe"], status: "correct"}], feedback: "*Dann* comes first to link the plan to the weather."}
  de.a1.unit20.lesson02.exercise05.reply_weather_plan: {instruction: "Reply to the weather question: say it is cold and raining, then suggest going to the cafe.", accepted_answers: [{value: "Es ist kalt und es regnet. Dann gehen wir ins Cafe.", status: "correct"}, {value: "Es ist kalt und es regnet Dann gehen wir ins Cafe", status: "correct"}], feedback: "The reply describes weather and gives a simple plan."}
  de.a1.unit20.lesson02.exercise06.write_weather_note: {instruction: "Write a short weather note: today it is cold and raining, so we go to the cafe.", accepted_answers: [{value: "Heute ist es kalt und es regnet. Dann gehen wir ins Cafe.", status: "correct"}, {value: "Heute ist es kalt und es regnet Dann gehen wir ins Cafe", status: "correct"}], feedback: "The note includes today's weather and the resulting plan."}
