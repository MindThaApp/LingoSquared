review: {"status": "unreviewed", "required_next_reviewer": "native_speaker_review", "notes": "English overlay for the reasons unit (weil with verb-final order, denn, deshalb and darum, verb position in weil clauses). OPEN NATIVE QUESTIONS: none beyond the realization notes."}
course:
  title: "German A2"
  description: "Grammar-led A2 German continuing the Anna and Felix storyline."
  learning_goal: "Give reasons, order events, say what things are for, talk about real conditions, ask indirect questions and pass on messages in German."
units:
  de.a2.unit109.weil_deshalb: {"title": "Because and That's Why", "description": "Give a reason and its consequence with weil, denn and deshalb, and keep the verb in the right place."}
lessons:
  de.a2.unit109.lesson01.weil_verb_am_ende: {"title": "Because I Am Ill"}
  de.a2.unit109.lesson02.denn_und_weil: {"title": "Denn or Weil"}
  de.a2.unit109.lesson03.deshalb_darum: {"title": "That's Why I Stay"}
  de.a2.unit109.lesson04.verb_am_ende_mehr: {"title": "The Verb at the Very End"}
  de.a2.unit109.lesson05.absage: {"title": "A Message Cancelling"}
  de.a2.unit109.lesson06.am_telefon: {"title": "Anna and Nina Talk on the Phone"}
teaching:
  de.a2.unit109.lesson01.teach.gruende: {"title": "Giving a reason", "gloss": "ill / tired / to stay at home / because", "example_gloss": ["I'm staying at home because I'm ill.", "Nina isn't coming because she is tired.", "Jonas is late because the bus isn't running.", "Felix is studying because he has an exam tomorrow."], "note": "*Weil* introduces the reason. The sentence in front of it says what happens, the *weil* part says why."}
  de.a2.unit109.lesson01.teach.gn_weil: {"title": "Weil sends the verb to the end", "gloss": "I'm staying at home because I'm ill.", "note": "After *weil* the conjugated verb goes to the very end of the clause: *weil ich krank bin*, not *weil ich bin krank*."}
  de.a2.unit109.lesson01.teach.gn_komma: {"title": "A comma before weil", "gloss": "Nina isn't coming because she is tired. Jonas is studying because he has an exam.", "note": "A *weil* clause is always separated from the main clause by a comma."}
  de.a2.unit109.lesson01.teach.gn_sein: {"title": "Sein at the end", "gloss": "because I am tired, because you are tired, because she is tired, because we are tired", "note": "The verb still changes with the subject: *bin, bist, ist, sind*. Only its place changes."}
  de.a2.unit109.lesson02.teach.denn: {"title": "Two ways to say because", "gloss": "because (main-clause) / hunger / no time / birthday / happy", "example_gloss": ["I'm not coming, because I have no time.", "I'm not coming because I have no time.", "Anna is happy because it is her birthday.", "I'm eating because I'm hungry."], "note": "*Denn* and *weil* both give a reason, but they build the sentence differently."}
  de.a2.unit109.lesson02.teach.gn_denn: {"title": "Denn keeps normal order", "gloss": "I'm not coming, because I have no time.", "note": "After *denn* the word order stays normal: subject, then verb in second place. *Denn* is a link between two full sentences."}
  de.a2.unit109.lesson02.teach.gn_weil2: {"title": "Weil moves the verb", "gloss": "I'm not coming because I have no time.", "note": "After *weil* the verb goes last. Same meaning, different word order."}
  de.a2.unit109.lesson02.teach.gn_vergleich: {"title": "Denn against weil", "gloss": "I'm eating, because I'm hungry. I'm eating because I'm hungry.", "note": "Compare the verb: second after *denn* (*ich habe Hunger*), last after *weil* (*ich Hunger habe*)."}
  de.a2.unit109.lesson02.teach.gn_weil_vorn: {"title": "Weil clause first", "gloss": "Because I have no time, I'm not coming.", "note": "If the *weil* clause comes first, the next verb follows straight after the comma: *..., komme ich nicht*. *Denn* cannot start a sentence this way."}
  de.a2.unit109.lesson03.teach.folge: {"title": "The result", "gloss": "that's why / so / it's raining / no time / bicycle", "example_gloss": ["It's raining. That's why I'm staying at home.", "Jonas is tired. That's why he is sleeping long today.", "The bus isn't coming. So Felix takes the bike.", "Anna has no time. That's why she isn't coming."], "note": "*Deshalb* and *darum* point back to a reason and give the result."}
  de.a2.unit109.lesson03.teach.gn_deshalb: {"title": "Deshalb gives the result", "gloss": "I'm ill. That's why I'm staying at home.", "note": "*Deshalb* starts the second sentence. It says: because of that."}
  de.a2.unit109.lesson03.teach.gn_inversion: {"title": "Verb right after deshalb", "gloss": "That's why I'm staying at home. So Felix takes the bike.", "note": "*Deshalb* and *darum* fill the first position, so the verb comes second and the subject after it: *Deshalb bleibe ich*."}
  de.a2.unit109.lesson03.teach.gn_richtung: {"title": "Cause and result", "gloss": "I'm hungry, that's why I'm eating. I'm eating because I'm hungry.", "note": "*Weil* names the cause. *Deshalb* names the result. The meaning is the same, the direction is turned around."}
  de.a2.unit109.lesson04.teach.hinten: {"title": "More verbs in weil clauses", "gloss": "must / to get up early / to do homework / to miss the bus", "example_gloss": ["I'm tired because I have to get up early.", "Anna is tired because she gets up early.", "Felix is late because he missed the bus.", "Nina isn't coming along because she has to do homework."], "note": "In a *weil* clause the conjugated verb is always last, even with several verbs."}
  de.a2.unit109.lesson04.teach.gn_modal: {"title": "Modal verb last", "gloss": "I'm tired because I have to get up early. Nina isn't coming because she has to do homework.", "note": "With a modal verb, the infinitive comes first and the modal verb stands last: *aufstehen muss*."}
  de.a2.unit109.lesson04.teach.gn_trennbar: {"title": "Separable verb joined", "gloss": "Anna gets up early. Anna is tired because she gets up early.", "note": "A separable verb is split in a main clause (*steht ... auf*) but written as one word at the end of a *weil* clause (*aufsteht*)."}
  de.a2.unit109.lesson04.teach.gn_perfekt: {"title": "Perfect: the auxiliary last", "gloss": "Felix is late because he missed the bus.", "note": "In the perfect, the participle comes before the auxiliary: *verpasst hat*."}
  de.a2.unit109.lesson05.teach.absage: {"title": "Words for the message", "gloss": "message / party / today / later / I'm sorry", "example_gloss": ["Nina writes Anna a message.", "I'm not coming to the party today.", "Felix is coming later.", "I'm sorry!"], "note": "Words for the message you will read."}
  de.a2.unit109.lesson05.teach.gn_text: {"title": "Denn and weil in one text", "gloss": "Jonas isn't coming, because he is ill. Felix is coming later because he missed the bus.", "note": "Read for the reasons: *denn* with normal order, *weil* with the verb last."}
  de.a2.unit109.lesson05.teach.lesen_absage: {"title": "Nina's message", "gloss": "Dear Anna, I'm not coming to the party today. I'm tired because I have to get up early. It is also raining. That's why I'm staying at home. Jonas isn't coming either, because he is ill. Felix is coming later because he missed the bus. I'm sorry! Nina", "note": "Three reasons, three different links: *weil*, *denn* and *deshalb*."}
  de.a2.unit109.lesson06.teach.anna_warum: {"title": "Anna asks", "gloss": "Anna: Hi Nina! Why aren't you coming to the party?"}
  de.a2.unit109.lesson06.teach.nina_muede: {"title": "Nina explains", "gloss": "Nina: I'm tired because I have to get up early."}
  de.a2.unit109.lesson06.teach.anna_jonas: {"title": "Anna asks about Jonas", "gloss": "Anna: What a pity! And Jonas?"}
  de.a2.unit109.lesson06.teach.nina_krank: {"title": "Nina answers", "gloss": "Nina: Jonas is ill. That's why he is staying at home."}
  de.a2.unit109.lesson06.teach.anna_felix: {"title": "Anna asks about Felix", "gloss": "Anna: Oh dear. And Felix?"}
  de.a2.unit109.lesson06.teach.nina_bus: {"title": "Nina answers again", "gloss": "Nina: Felix is coming later, because he missed the bus."}
  de.a2.unit109.lesson06.teach.anna_okay: {"title": "Anna decides", "gloss": "Anna: Okay, then we'll celebrate next week."}
exercises:
  de.a2.unit109.lesson01.exercise01.wahl_krank: {"instruction": "Choose the correct German sentence.", "correct_option": "Ich bleibe zu Hause, weil ich krank bin.", "distractors": ["Ich bleibe zu Hause, weil ich bin krank.", "Ich bleibe zu Hause, weil bin ich krank.", "Ich bleibe zu Hause, weil krank ich bin."], "accepted_answers": [{"value": "Ich bleibe zu Hause, weil ich krank bin.", "status": "correct"}], "feedback": "The verb *bin* goes to the end."}
  de.a2.unit109.lesson01.exercise02.wahl_nina: {"instruction": "Choose the correct German sentence.", "correct_option": "Nina kommt nicht, weil sie müde ist.", "distractors": ["Nina kommt nicht, weil sie ist müde.", "Nina kommt nicht, weil ist sie müde.", "Nina kommt nicht, weil müde sie ist."], "accepted_answers": [{"value": "Nina kommt nicht, weil sie müde ist.", "status": "correct"}], "feedback": "*Ist* stands last."}
  de.a2.unit109.lesson01.exercise03.paare_weil: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Ich bleibe zu Hause, weil ich krank bin.", "right": "I'm staying at home because I'm ill."}, {"left": "Nina kommt nicht, weil sie müde ist.", "right": "Nina isn't coming because she is tired."}, {"left": "Jonas kommt zu spät, weil der Bus nicht fährt.", "right": "Jonas is late because the bus isn't running."}, {"left": "Felix lernt, weil er morgen eine Prüfung hat.", "right": "Felix is studying because he has an exam tomorrow."}, {"left": "weil ich müde bin", "right": "because I am tired"}, {"left": "weil wir müde sind", "right": "because we are tired"}], "status": "correct"}], "feedback": "Reason clauses with the verb last."}
  de.a2.unit109.lesson01.exercise04.ordnen_weil: {"instruction": "Put the words in order to say 'I'm staying at home because I'm ill.'", "correct_option": "Ich bleibe zu Hause weil ich krank bin", "accepted_answers": [{"value": "Ich bleibe zu Hause weil ich krank bin", "status": "correct"}], "feedback": "*Bin* goes last."}
  de.a2.unit109.lesson01.exercise05.luecke_ist: {"instruction": "Complete with the verb.", "correct_option": "ist", "accepted_answers": [{"value": "ist", "status": "correct"}], "feedback": "The verb stands at the end of the *weil* clause."}
  de.a2.unit109.lesson01.exercise06.uebersetzen_felix: {"instruction": "Translate into German.", "accepted_answers": [{"value": "Felix lernt, weil er morgen eine Prüfung hat.", "status": "correct"}, {"value": "Felix lernt, weil er morgen eine Pruefung hat.", "status": "correct"}, {"value": "Felix lernt weil er morgen eine Prüfung hat.", "status": "correct"}, {"value": "Felix lernt weil er morgen eine Pruefung hat.", "status": "correct"}, {"value": "Weil er morgen eine Prüfung hat, lernt Felix.", "status": "correct"}, {"value": "Weil er morgen eine Pruefung hat, lernt Felix.", "status": "correct"}, {"value": "Weil er morgen eine Prüfung hat lernt Felix.", "status": "correct"}, {"value": "Weil er morgen eine Pruefung hat lernt Felix.", "status": "correct"}], "feedback": "*Hat* goes last."}
  de.a2.unit109.lesson01.exercise07.schreiben_muede: {"instruction": "Write the requested German sentence.", "accepted_answers": [{"value": "Ich bleibe zu Hause, weil ich müde bin.", "status": "correct"}, {"value": "Ich bleibe zu Hause, weil ich muede bin.", "status": "correct"}, {"value": "Ich bleibe zu Hause weil ich müde bin.", "status": "correct"}, {"value": "Ich bleibe zu Hause weil ich muede bin.", "status": "correct"}, {"value": "Weil ich müde bin, bleibe ich zu Hause.", "status": "correct"}, {"value": "Weil ich muede bin, bleibe ich zu Hause.", "status": "correct"}, {"value": "Weil ich müde bin bleibe ich zu Hause.", "status": "correct"}, {"value": "Weil ich muede bin bleibe ich zu Hause.", "status": "correct"}], "feedback": "*Weil ich müde bin*.", "correct_option": "Ich bleibe zu Hause, weil ich müde bin."}
  de.a2.unit109.lesson02.exercise01.wahl_denn: {"instruction": "Choose the correct German sentence.", "correct_option": "Anna ist glücklich, denn sie hat Geburtstag.", "distractors": ["Anna ist glücklich, denn sie Geburtstag hat.", "Anna ist glücklich, denn hat sie Geburtstag.", "Anna ist glücklich, denn Geburtstag sie hat."], "accepted_answers": [{"value": "Anna ist glücklich, denn sie hat Geburtstag.", "status": "correct"}], "feedback": "After *denn*: subject, then verb."}
  de.a2.unit109.lesson02.exercise02.wahl_weil: {"instruction": "Choose the correct German sentence.", "correct_option": "Ich esse, weil ich Hunger habe.", "distractors": ["Ich esse, weil ich habe Hunger.", "Ich esse, weil habe ich Hunger.", "Ich esse, weil Hunger ich habe."], "accepted_answers": [{"value": "Ich esse, weil ich Hunger habe.", "status": "correct"}], "feedback": "After *weil* the verb is last."}
  de.a2.unit109.lesson02.exercise03.paare_denn: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Ich komme nicht, denn ich habe keine Zeit.", "right": "I'm not coming, since I have no time."}, {"left": "Ich komme nicht, weil ich keine Zeit habe.", "right": "I'm not coming because I have no time."}, {"left": "Anna ist glücklich, denn sie hat Geburtstag.", "right": "Anna is happy because it is her birthday."}, {"left": "Ich esse, weil ich Hunger habe.", "right": "I'm eating because I'm hungry."}, {"left": "Ich esse, denn ich habe Hunger.", "right": "I'm eating, since I'm hungry."}, {"left": "Weil ich keine Zeit habe, komme ich nicht.", "right": "Because I have no time, I'm not coming."}], "status": "correct"}], "feedback": "Denn and weil sentences."}
  de.a2.unit109.lesson02.exercise04.ordnen_vorn: {"instruction": "Put the words in order to say 'Because I have no time, I'm not coming.'", "correct_option": "Weil ich keine Zeit habe komme ich nicht", "accepted_answers": [{"value": "Weil ich keine Zeit habe komme ich nicht", "status": "correct"}], "feedback": "The verb *komme* follows the *weil* clause."}
  de.a2.unit109.lesson02.exercise05.luecke_habe: {"instruction": "Complete with the verb.", "correct_option": "habe", "accepted_answers": [{"value": "habe", "status": "correct"}], "feedback": "*Habe* goes to the end after *weil*."}
  de.a2.unit109.lesson02.exercise06.uebersetzen_zeit: {"instruction": "Translate into German.", "accepted_answers": [{"value": "Ich komme nicht, weil ich keine Zeit habe.", "status": "correct"}, {"value": "Ich komme nicht weil ich keine Zeit habe.", "status": "correct"}, {"value": "Ich komme nicht, denn ich habe keine Zeit.", "status": "correct"}, {"value": "Ich komme nicht denn ich habe keine Zeit.", "status": "correct"}, {"value": "Weil ich keine Zeit habe, komme ich nicht.", "status": "correct"}, {"value": "Weil ich keine Zeit habe komme ich nicht.", "status": "correct"}], "feedback": "Both *weil* and *denn* work; watch the verb."}
  de.a2.unit109.lesson02.exercise07.schreiben_denn: {"instruction": "Write the requested German sentence.", "accepted_answers": [{"value": "Anna ist glücklich, denn sie hat Geburtstag.", "status": "correct"}, {"value": "Anna ist gluecklich, denn sie hat Geburtstag.", "status": "correct"}, {"value": "Anna ist glücklich denn sie hat Geburtstag.", "status": "correct"}, {"value": "Anna ist gluecklich denn sie hat Geburtstag.", "status": "correct"}], "feedback": "After *denn*: *sie hat*.", "correct_option": "Anna ist glücklich, denn sie hat Geburtstag."}
  de.a2.unit109.lesson03.exercise01.wahl_regnet: {"instruction": "Choose the correct German sentence.", "correct_option": "Es regnet. Deshalb bleibe ich zu Hause.", "distractors": ["Es regnet. Deshalb ich bleibe zu Hause.", "Es regnet. Deshalb ich zu Hause bleibe.", "Es regnet. Deshalb bleibe zu Hause ich."], "accepted_answers": [{"value": "Es regnet. Deshalb bleibe ich zu Hause.", "status": "correct"}], "feedback": "Verb second: *Deshalb bleibe ich*."}
  de.a2.unit109.lesson03.exercise02.wahl_bus: {"instruction": "Choose the correct German sentence.", "correct_option": "Der Bus kommt nicht. Darum nimmt Felix das Fahrrad.", "distractors": ["Der Bus kommt nicht. Darum Felix nimmt das Fahrrad.", "Der Bus kommt nicht. Darum Felix das Fahrrad nimmt.", "Der Bus kommt nicht. Darum das Fahrrad nimmt Felix."], "accepted_answers": [{"value": "Der Bus kommt nicht. Darum nimmt Felix das Fahrrad.", "status": "correct"}], "feedback": "*Darum nimmt Felix*."}
  de.a2.unit109.lesson03.exercise03.paare_deshalb: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Es regnet. Deshalb bleibe ich zu Hause.", "right": "It's raining. That's why I'm staying at home."}, {"left": "Jonas ist müde. Deshalb schläft er heute lange.", "right": "Jonas is tired. That's why he is sleeping long today."}, {"left": "Der Bus kommt nicht. Darum nimmt Felix das Fahrrad.", "right": "The bus isn't coming. So Felix takes the bike."}, {"left": "Anna hat keine Zeit. Deshalb kommt sie nicht.", "right": "Anna has no time. That's why she isn't coming."}, {"left": "Ich habe Hunger, deshalb esse ich.", "right": "I'm hungry, that's why I'm eating."}, {"left": "Ich bin krank. Deshalb bleibe ich zu Hause.", "right": "I'm ill. That's why I'm staying at home."}], "status": "correct"}], "feedback": "Results with deshalb and darum."}
  de.a2.unit109.lesson03.exercise04.ordnen_deshalb: {"instruction": "Put the words in order to say 'That's why I'm staying at home.'", "correct_option": "Deshalb bleibe ich zu Hause", "accepted_answers": [{"value": "Deshalb bleibe ich zu Hause", "status": "correct"}], "feedback": "Verb in second place."}
  de.a2.unit109.lesson03.exercise05.luecke_deshalb: {"instruction": "Complete with the linking word.", "correct_option": "Deshalb", "accepted_answers": [{"value": "Deshalb", "status": "correct"}, {"value": "Darum", "status": "correct"}], "feedback": "*Deshalb* or *darum* gives the result."}
  de.a2.unit109.lesson03.exercise06.uebersetzen_jonas: {"instruction": "Translate into German.", "accepted_answers": [{"value": "Jonas ist müde. Deshalb schläft er heute lange.", "status": "correct"}, {"value": "Jonas ist muede. Deshalb schlaeft er heute lange.", "status": "correct"}, {"value": "Jonas ist müde. Darum schläft er heute lange.", "status": "correct"}, {"value": "Jonas ist muede. Darum schlaeft er heute lange.", "status": "correct"}, {"value": "Jonas ist müde, deshalb schläft er heute lange.", "status": "correct"}, {"value": "Jonas ist muede, deshalb schlaeft er heute lange.", "status": "correct"}, {"value": "Jonas ist müde deshalb schläft er heute lange.", "status": "correct"}, {"value": "Jonas ist muede deshalb schlaeft er heute lange.", "status": "correct"}, {"value": "Jonas ist müde, darum schläft er heute lange.", "status": "correct"}, {"value": "Jonas ist muede, darum schlaeft er heute lange.", "status": "correct"}, {"value": "Jonas ist müde darum schläft er heute lange.", "status": "correct"}, {"value": "Jonas ist muede darum schlaeft er heute lange.", "status": "correct"}, {"value": "Jonas ist müde. Er schläft deshalb heute lange.", "status": "correct"}, {"value": "Jonas ist muede. Er schlaeft deshalb heute lange.", "status": "correct"}, {"value": "Jonas ist müde. Er schläft darum heute lange.", "status": "correct"}, {"value": "Jonas ist muede. Er schlaeft darum heute lange.", "status": "correct"}], "feedback": "*Deshalb schläft er*."}
  de.a2.unit109.lesson03.exercise07.schreiben_regen: {"instruction": "Write the requested German sentence.", "accepted_answers": [{"value": "Es regnet. Deshalb bleibe ich zu Hause.", "status": "correct"}, {"value": "Es regnet. Darum bleibe ich zu Hause.", "status": "correct"}, {"value": "Es regnet, deshalb bleibe ich zu Hause.", "status": "correct"}, {"value": "Es regnet deshalb bleibe ich zu Hause.", "status": "correct"}, {"value": "Es regnet, darum bleibe ich zu Hause.", "status": "correct"}, {"value": "Es regnet darum bleibe ich zu Hause.", "status": "correct"}, {"value": "Es regnet. Ich bleibe deshalb zu Hause.", "status": "correct"}, {"value": "Es regnet. Ich bleibe darum zu Hause.", "status": "correct"}], "feedback": "*Deshalb bleibe ich*.", "correct_option": "Es regnet. Deshalb bleibe ich zu Hause."}
  de.a2.unit109.lesson04.exercise01.wahl_muss: {"instruction": "Choose the correct German sentence.", "correct_option": "Ich bin müde, weil ich früh aufstehen muss.", "distractors": ["Ich bin müde, weil ich muss früh aufstehen.", "Ich bin müde, weil ich früh muss aufstehen.", "Ich bin müde, weil muss ich früh aufstehen."], "accepted_answers": [{"value": "Ich bin müde, weil ich früh aufstehen muss.", "status": "correct"}], "feedback": "The modal verb *muss* is last."}
  de.a2.unit109.lesson04.exercise02.wahl_verpasst: {"instruction": "Choose the correct German sentence.", "correct_option": "Felix kommt zu spät, weil er den Bus verpasst hat.", "distractors": ["Felix kommt zu spät, weil er hat den Bus verpasst.", "Felix kommt zu spät, weil er den Bus hat verpasst.", "Felix kommt zu spät, weil hat er den Bus verpasst."], "accepted_answers": [{"value": "Felix kommt zu spät, weil er den Bus verpasst hat.", "status": "correct"}], "feedback": "*Verpasst hat* at the end."}
  de.a2.unit109.lesson04.exercise03.paare_hinten: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Ich bin müde, weil ich früh aufstehen muss.", "right": "I'm tired because I have to get up early."}, {"left": "Anna ist müde, weil sie früh aufsteht.", "right": "Anna is tired because she gets up early."}, {"left": "Felix kommt zu spät, weil er den Bus verpasst hat.", "right": "Felix is late because he missed the bus."}, {"left": "Nina kommt nicht mit, weil sie Hausaufgaben machen muss.", "right": "Nina isn't coming along because she has to do homework."}, {"left": "Anna steht früh auf.", "right": "Anna gets up early."}, {"left": "weil sie früh aufsteht", "right": "because she gets up early"}], "status": "correct"}], "feedback": "Verbs at the end of weil clauses."}
  de.a2.unit109.lesson04.exercise04.ordnen_aufsteht: {"instruction": "Put the words in order to say 'Anna is tired because she gets up early.'", "correct_option": "Anna ist müde weil sie früh aufsteht", "accepted_answers": [{"value": "Anna ist müde weil sie früh aufsteht", "status": "correct"}], "feedback": "The separable verb is one word at the end."}
  de.a2.unit109.lesson04.exercise05.luecke_muss: {"instruction": "Complete with the modal verb.", "correct_option": "muss", "accepted_answers": [{"value": "muss", "status": "correct"}], "feedback": "The modal verb stands last."}
