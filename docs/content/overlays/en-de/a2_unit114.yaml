review: {"status": "unreviewed", "required_next_reviewer": "native_speaker_review", "notes": "English overlay for the pass-on-a-message unit (sagt, dass / fragt, ob with the verb last, change of person, sollst and möchte, dass). OPEN NATIVE QUESTIONS: none beyond the realization notes."}
course:
  title: "German A2"
  description: "Grammar-led A2 German continuing the Anna and Felix storyline."
  learning_goal: "Give reasons, order events, say what things are for, talk about real conditions, ask indirect questions and pass on messages in German."
units:
  de.a2.unit114.nachricht_weitergeben: {"title": "He Says That ...", "description": "Pass on what someone says or asks, using the present tense only: a phone message or a note."}
lessons:
  de.a2.unit114.lesson01.sagt_dass: {"title": "Anna Says That ..."}
  de.a2.unit114.lesson02.person_wechseln: {"title": "From I to He"}
  de.a2.unit114.lesson03.fragen_weitergeben: {"title": "Felix Asks Whether ..."}
  de.a2.unit114.lesson04.bitten: {"title": "Tell Him That ..."}
  de.a2.unit114.lesson05.telefonnotiz: {"title": "A Note for Nina"}
  de.a2.unit114.lesson06.am_telefon: {"title": "Anna Passes on a Message"}
teaching:
  de.a2.unit114.lesson01.teach.sagen: {"title": "Passing on a message", "gloss": "to say / that / to come later / ill / no time", "example_gloss": ["Anna says that she is coming later.", "Felix says that he is ill.", "Nina says that she has no time.", "Jonas says that the bus isn't coming."], "note": "*Sagt, dass* passes on what someone said."}
  de.a2.unit114.lesson01.teach.gn_dass: {"title": "Dass sends the verb to the end", "gloss": "Anna says that she is coming later.", "note": "After *dass* the conjugated verb goes last: *dass sie später kommt*."}
  de.a2.unit114.lesson01.teach.gn_komma: {"title": "A comma before dass", "gloss": "Felix says that he is ill. Nina says that she has no time.", "note": "Always put a comma before *dass*. Do not confuse it with *das* (the, that): *dass* needs the comma and the verb at the end."}
  de.a2.unit114.lesson01.teach.gn_person: {"title": "The person changes", "gloss": "Anna says: I'm coming later. Anna says that she is coming later.", "note": "When you pass on a message, *ich* becomes *er* or *sie*, as seen from the speaker: Anna says *ich*, you say *sie*."}
  de.a2.unit114.lesson02.teach.notiz: {"title": "Changing person", "gloss": "to call / delay / mother / to start / his / her", "example_gloss": ["Nina says that she will call you tomorrow.", "Jonas says that his train is delayed.", "Anna says that her mother is coming tomorrow.", "Felix says that we start at eight."], "note": "Pronouns and possessives change when you pass a message on."}
  de.a2.unit114.lesson02.teach.gn_person: {"title": "Ich becomes sie or er", "gloss": "Anna says: I'm coming later. Anna says that she is coming later.", "note": "The speaker says *ich*, the reporter uses *er* or *sie*."}
  de.a2.unit114.lesson02.teach.gn_possessiv: {"title": "Mein becomes sein or ihr", "gloss": "Jonas says: My train is delayed. Jonas says that his train is delayed.", "note": "Possessives change too: *mein* becomes *sein* (his) or *ihr* (her)."}
  de.a2.unit114.lesson02.teach.gn_trennbar: {"title": "Separable verbs", "gloss": "Nina says that she will call you tomorrow. Felix says that we start at eight.", "note": "A separable verb is one word at the end of the *dass* clause: *anruft*, *anfangen*."}
  de.a2.unit114.lesson03.teach.fragen: {"title": "Passing on a question", "gloss": "to ask / whether / where / when / to have time", "example_gloss": ["Felix asks whether you have time tomorrow.", "Anna asks where you are.", "Nina asks when the train comes.", "Jonas asks whether we start at eight."], "note": "*Fragt, ob* passes on a yes/no question."}
  de.a2.unit114.lesson03.teach.gn_ob: {"title": "Yes/no questions with ob", "gloss": "Felix asks: Do you have time tomorrow? Felix asks whether you have time tomorrow.", "note": "A yes/no question becomes *ob* plus the verb at the end."}
  de.a2.unit114.lesson03.teach.gn_w: {"title": "Question words stay", "gloss": "Anna asks: Where are you? Anna asks where you are.", "note": "A question word stays and the verb moves to the end."}
  de.a2.unit114.lesson03.teach.gn_du: {"title": "Du stays du", "gloss": "Nina asks when the train comes. Jonas asks whether we start at eight.", "note": "If you are the person being asked, *du* stays *du*. Only the speaker's *ich* changes."}
  de.a2.unit114.lesson04.teach.sollen: {"title": "Passing on a request", "gloss": "should / wants / that / to wait / on time", "example_gloss": ["Anna says that you should call her.", "Felix says that you should come on time.", "Nina wants you to help her.", "Jonas says that you shouldn't wait."], "note": "A request becomes *du sollst* or *möchte, dass*."}
  de.a2.unit114.lesson04.teach.gn_sollst: {"title": "Command becomes sollst", "gloss": "Anna says: Call me! Anna says that you should call her.", "note": "A command is passed on with *du sollst*. The infinitive comes before *sollst* at the end."}
  de.a2.unit114.lesson04.teach.gn_moechte: {"title": "Möchte, dass", "gloss": "Nina wants you to help her.", "note": "*Möchte, dass* also passes on a wish. The verb after *dass* is last."}
  de.a2.unit114.lesson04.teach.gn_pronomen: {"title": "Mich and mir change", "gloss": "Anna says: Call me! Nina says: Help me! Nina wants you to help her.", "note": "The pronouns change with the speaker: *mich* becomes *sie*, *mir* becomes *ihr*."}
  de.a2.unit114.lesson05.teach.notiz: {"title": "Words for the note", "gloss": "note / telephone / to wait / see you later / also", "example_gloss": ["Anna writes a note for Nina.", "The phone rings.", "Nina should not wait.", "See you later!"], "note": "Words for the note you will read."}
  de.a2.unit114.lesson05.teach.gn_text: {"title": "Sagt, dass and fragt, ob", "gloss": "He says that he is coming later today. He also asks whether you have time tomorrow.", "note": "A message note passes on statements with *dass* and questions with *ob*."}
  de.a2.unit114.lesson05.teach.lesen_notiz: {"title": "Anna's note", "gloss": "Hi Nina, Felix is calling. He says that he is coming later today. He also asks whether you have time tomorrow. Jonas says that his train is delayed. He wants you not to wait. See you later! Anna", "note": "Two messages, passed on in the present tense."}
  de.a2.unit114.lesson06.teach.anna_nachricht: {"title": "Anna starts", "gloss": "Anna: Hi Nina! I have a message from Felix."}
  de.a2.unit114.lesson06.teach.nina_was: {"title": "Nina asks", "gloss": "Nina: What does he say?"}
  de.a2.unit114.lesson06.teach.anna_spaeter: {"title": "Anna passes it on", "gloss": "Anna: He says that he is coming later today."}
  de.a2.unit114.lesson06.teach.nina_sonst: {"title": "Nina asks for more", "gloss": "Nina: Okay. Anything else?"}
  de.a2.unit114.lesson06.teach.anna_frage: {"title": "Anna passes on a question", "gloss": "Anna: He asks whether you have time tomorrow."}
  de.a2.unit114.lesson06.teach.nina_acht: {"title": "Nina answers", "gloss": "Nina: Yes, I have time. Tell him that I'm coming at eight."}
  de.a2.unit114.lesson06.teach.anna_gut: {"title": "Anna agrees", "gloss": "Anna: Good, I'll tell him."}
exercises:
  de.a2.unit114.lesson01.exercise01.wahl_anna: {"instruction": "Choose the correct German sentence.", "correct_option": "Anna sagt, dass sie später kommt.", "distractors": ["Anna sagt, dass sie kommt später.", "Anna sagt, dass kommt sie später.", "Anna sagt, das sie später kommt."], "accepted_answers": [{"value": "Anna sagt, dass sie später kommt.", "status": "correct"}], "feedback": "The verb *kommt* is last, and *dass* has two s."}
  de.a2.unit114.lesson01.exercise02.wahl_felix: {"instruction": "Choose the correct German sentence.", "correct_option": "Felix sagt, dass er krank ist.", "distractors": ["Felix sagt, dass er ist krank.", "Felix sagt, dass ich krank bin.", "Felix sagt, dass ist er krank."], "accepted_answers": [{"value": "Felix sagt, dass er krank ist.", "status": "correct"}], "feedback": "*Er*, and *ist* last."}
  de.a2.unit114.lesson01.exercise03.paare_dass: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Anna sagt, dass sie später kommt.", "right": "Anna says that she is coming later."}, {"left": "Felix sagt, dass er krank ist.", "right": "Felix says that he is ill."}, {"left": "Nina sagt, dass sie keine Zeit hat.", "right": "Nina says that she has no time."}, {"left": "Jonas sagt, dass der Bus nicht kommt.", "right": "Jonas says that the bus isn't coming."}, {"left": "Anna sagt: Ich komme später.", "right": "Anna says: I'm coming later."}, {"left": "dass sie später kommt", "right": "that she is coming later"}], "status": "correct"}], "feedback": "Messages with dass."}
  de.a2.unit114.lesson01.exercise04.ordnen_nina: {"instruction": "Put the words in order to say 'Nina says that she has no time.'", "correct_option": "Nina sagt dass sie keine Zeit hat", "accepted_answers": [{"value": "Nina sagt dass sie keine Zeit hat", "status": "correct"}], "feedback": "*Hat* is last."}
  de.a2.unit114.lesson01.exercise05.luecke_dass: {"instruction": "Complete with the word.", "correct_option": "dass", "accepted_answers": [{"value": "dass", "status": "correct"}], "feedback": "*Dass* opens the clause."}
  de.a2.unit114.lesson01.exercise06.uebersetzen_anna: {"instruction": "Translate into German.", "accepted_answers": [{"value": "Anna sagt, dass sie später kommt.", "status": "correct"}, {"value": "Anna sagt dass sie später kommt.", "status": "correct"}, {"value": "Anna sagt, dass sie spaeter kommt.", "status": "correct"}, {"value": "Anna sagt dass sie spaeter kommt.", "status": "correct"}], "feedback": "*Sie* and *kommt* last."}
  de.a2.unit114.lesson01.exercise07.schreiben_bus: {"instruction": "Write the requested German sentence.", "accepted_answers": [{"value": "Jonas sagt, dass der Bus nicht kommt.", "status": "correct"}, {"value": "Jonas sagt dass der Bus nicht kommt.", "status": "correct"}], "feedback": "*Kommt* last.", "correct_option": "Jonas sagt, dass der Bus nicht kommt."}
  de.a2.unit114.lesson02.exercise01.wahl_anruft: {"instruction": "Choose the correct German sentence.", "correct_option": "Nina sagt, dass sie dich morgen anruft.", "distractors": ["Nina sagt, dass sie ruft dich morgen an.", "Nina sagt, dass ich dich morgen anrufe.", "Nina sagt, dass sie dich morgen an ruft."], "accepted_answers": [{"value": "Nina sagt, dass sie dich morgen anruft.", "status": "correct"}], "feedback": "*Anruft* in one word."}
  de.a2.unit114.lesson02.exercise02.wahl_zug: {"instruction": "Choose the correct German sentence.", "correct_option": "Jonas sagt, dass sein Zug Verspätung hat.", "distractors": ["Jonas sagt, dass mein Zug Verspätung hat.", "Jonas sagt, dass sein Zug hat Verspätung.", "Jonas sagt, dass hat sein Zug Verspätung."], "accepted_answers": [{"value": "Jonas sagt, dass sein Zug Verspätung hat.", "status": "correct"}], "feedback": "*Sein Zug*, and *hat* last."}
  de.a2.unit114.lesson02.exercise03.paare_person: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Nina sagt, dass sie dich morgen anruft.", "right": "Nina says that she will call you tomorrow."}, {"left": "Jonas sagt, dass sein Zug Verspätung hat.", "right": "Jonas says that his train is delayed."}, {"left": "Anna sagt, dass ihre Mutter morgen kommt.", "right": "Anna says that her mother is coming tomorrow."}, {"left": "Felix sagt, dass wir um acht anfangen.", "right": "Felix says that we start at eight."}, {"left": "Jonas sagt: Mein Zug hat Verspätung.", "right": "Jonas says: My train is delayed."}, {"left": "Anna sagt: Ich komme später.", "right": "Anna says: I'm coming later."}], "status": "correct"}], "feedback": "From direct to reported."}
  de.a2.unit114.lesson02.exercise04.ordnen_mutter: {"instruction": "Put the words in order to say 'Anna says that her mother is coming tomorrow.'", "correct_option": "Anna sagt dass ihre Mutter morgen kommt", "accepted_answers": [{"value": "Anna sagt dass ihre Mutter morgen kommt", "status": "correct"}], "feedback": "*Kommt* is last."}
  de.a2.unit114.lesson02.exercise05.luecke_sie: {"instruction": "Complete with the pronoun.", "correct_option": "sie", "accepted_answers": [{"value": "sie", "status": "correct"}], "feedback": "*Ich* becomes *sie*."}
  de.a2.unit114.lesson02.exercise06.uebersetzen_mutter: {"instruction": "Translate into German.", "accepted_answers": [{"value": "Anna sagt, dass ihre Mutter morgen kommt.", "status": "correct"}, {"value": "Anna sagt dass ihre Mutter morgen kommt.", "status": "correct"}], "feedback": "*Ihre Mutter*."}
  de.a2.unit114.lesson02.exercise07.schreiben_acht: {"instruction": "Write the requested German sentence.", "accepted_answers": [{"value": "Felix sagt, dass wir um acht anfangen.", "status": "correct"}, {"value": "Felix sagt dass wir um acht anfangen.", "status": "correct"}], "feedback": "*Anfangen* last.", "correct_option": "Felix sagt, dass wir um acht anfangen."}
  de.a2.unit114.lesson03.exercise01.wahl_zeit: {"instruction": "Choose the correct German sentence.", "correct_option": "Felix fragt, ob du morgen Zeit hast.", "distractors": ["Felix fragt, ob hast du morgen Zeit.", "Felix fragt, ob du morgen hast Zeit.", "Felix fragt, wenn du morgen Zeit hast."], "accepted_answers": [{"value": "Felix fragt, ob du morgen Zeit hast.", "status": "correct"}], "feedback": "*Ob*, and *hast* last."}
  de.a2.unit114.lesson03.exercise02.wahl_wo: {"instruction": "Choose the correct German sentence.", "correct_option": "Anna fragt, wo du bist.", "distractors": ["Anna fragt, wo bist du.", "Anna fragt, wo ich bin.", "Anna fragt, ob wo du bist."], "accepted_answers": [{"value": "Anna fragt, wo du bist.", "status": "correct"}], "feedback": "*Wo du bist*."}
  de.a2.unit114.lesson03.exercise03.paare_fragen: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Felix fragt, ob du morgen Zeit hast.", "right": "Felix asks whether you have time tomorrow."}, {"left": "Anna fragt, wo du bist.", "right": "Anna asks where you are."}, {"left": "Nina fragt, wann der Zug kommt.", "right": "Nina asks when the train comes."}, {"left": "Jonas fragt, ob wir um acht anfangen.", "right": "Jonas asks whether we start at eight."}, {"left": "Anna fragt: Wo bist du?", "right": "Anna asks: Where are you?"}, {"left": "Felix fragt: Hast du morgen Zeit?", "right": "Felix asks: Do you have time tomorrow?"}], "status": "correct"}], "feedback": "Passed-on questions."}
  de.a2.unit114.lesson03.exercise04.ordnen_zug: {"instruction": "Put the words in order to say 'Nina asks when the train comes.'", "correct_option": "Nina fragt wann der Zug kommt", "accepted_answers": [{"value": "Nina fragt wann der Zug kommt", "status": "correct"}], "feedback": "*Kommt* is last."}
  de.a2.unit114.lesson03.exercise05.luecke_ob: {"instruction": "Complete with the word.", "correct_option": "ob", "accepted_answers": [{"value": "ob", "status": "correct"}], "feedback": "A yes/no question needs *ob*."}
  de.a2.unit114.lesson03.exercise06.uebersetzen_wo: {"instruction": "Translate into German.", "accepted_answers": [{"value": "Anna fragt, wo du bist.", "status": "correct"}, {"value": "Anna fragt wo du bist.", "status": "correct"}], "feedback": "*Wo du bist*."}
  de.a2.unit114.lesson03.exercise07.schreiben_ob: {"instruction": "Write the requested German sentence.", "accepted_answers": [{"value": "Jonas fragt, ob wir um acht anfangen.", "status": "correct"}, {"value": "Jonas fragt ob wir um acht anfangen.", "status": "correct"}], "feedback": "*Anfangen* last.", "correct_option": "Jonas fragt, ob wir um acht anfangen."}
  de.a2.unit114.lesson04.exercise01.wahl_sollst: {"instruction": "Choose the correct German sentence.", "correct_option": "Anna sagt, dass du sie anrufen sollst.", "distractors": ["Anna sagt, dass du sie sollst anrufen.", "Anna sagt, dass du mich anrufen sollst.", "Anna sagt, dass sollst du sie anrufen."], "accepted_answers": [{"value": "Anna sagt, dass du sie anrufen sollst.", "status": "correct"}], "feedback": "*Anrufen sollst* at the end."}
  de.a2.unit114.lesson04.exercise02.wahl_puenktlich: {"instruction": "Choose the correct German sentence.", "correct_option": "Felix sagt, dass du pünktlich kommen sollst.", "distractors": ["Felix sagt, dass du pünktlich sollst kommen.", "Felix sagt, dass du pünktlich kommst sollst.", "Felix sagt, dass du sollst pünktlich kommen."], "accepted_answers": [{"value": "Felix sagt, dass du pünktlich kommen sollst.", "status": "correct"}], "feedback": "*Kommen sollst* at the end."}
  de.a2.unit114.lesson04.exercise03.paare_bitten: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Anna sagt, dass du sie anrufen sollst.", "right": "Anna says that you should call her."}, {"left": "Felix sagt, dass du pünktlich kommen sollst.", "right": "Felix says that you should come on time."}, {"left": "Nina möchte, dass du ihr hilfst.", "right": "Nina wants you to help her."}, {"left": "Jonas sagt, dass du nicht warten sollst.", "right": "Jonas says that you shouldn't wait."}, {"left": "Anna sagt: Ruf mich an!", "right": "Anna says: Call me!"}, {"left": "Nina sagt: Hilf mir!", "right": "Nina says: Help me!"}], "status": "correct"}], "feedback": "Requests passed on."}
  de.a2.unit114.lesson04.exercise04.ordnen_puenktlich: {"instruction": "Put the words in order to say 'Felix says that you should come on time.'", "correct_option": "Felix sagt dass du pünktlich kommen sollst", "accepted_answers": [{"value": "Felix sagt dass du pünktlich kommen sollst", "status": "correct"}], "feedback": "*Kommen sollst* last."}
  de.a2.unit114.lesson04.exercise05.luecke_sollst: {"instruction": "Complete with the verb.", "correct_option": "sollst", "accepted_answers": [{"value": "sollst", "status": "correct"}], "feedback": "The conjugated verb stands last."}
  de.a2.unit114.lesson04.exercise06.uebersetzen_warten: {"instruction": "Translate into German.", "accepted_answers": [{"value": "Jonas sagt, dass du nicht warten sollst.", "status": "correct"}, {"value": "Jonas sagt dass du nicht warten sollst.", "status": "correct"}], "feedback": "*Nicht warten sollst*."}
  de.a2.unit114.lesson04.exercise07.schreiben_hilfst: {"instruction": "Write the requested German sentence.", "accepted_answers": [{"value": "Nina möchte, dass du ihr hilfst.", "status": "correct"}, {"value": "Nina möchte dass du ihr hilfst.", "status": "correct"}, {"value": "Nina moechte, dass du ihr hilfst.", "status": "correct"}, {"value": "Nina moechte dass du ihr hilfst.", "status": "correct"}], "feedback": "*Dass du ihr hilfst*.", "correct_option": "Nina möchte, dass du ihr hilfst."}
  de.a2.unit114.lesson05.exercise01.lesen_felix: {"instruction": "Read the text and choose the answer.", "correct_option": "That he is coming later today.", "distractors": ["That he is ill.", "That his train is late.", "That he has no time."], "accepted_answers": [{"value": "That he is coming later today.", "status": "correct"}], "feedback": "*Er sagt, dass er heute später kommt.*"}
  de.a2.unit114.lesson05.exercise02.lesen_frage: {"instruction": "Read the text and choose the answer.", "correct_option": "Whether Nina has time tomorrow.", "distractors": ["Where Nina is.", "When the train comes.", "Whether Nina is ill."], "accepted_answers": [{"value": "Whether Nina has time tomorrow.", "status": "correct"}], "feedback": "*Er fragt auch, ob du morgen Zeit hast.*"}
  de.a2.unit114.lesson05.exercise03.paare_notiz: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Hallo Nina, Felix ruft an.", "right": "Hi Nina, Felix is calling."}, {"left": "Er sagt, dass er heute später kommt.", "right": "He says that he is coming later today."}, {"left": "Er fragt auch, ob du morgen Zeit hast.", "right": "He also asks whether you have time tomorrow."}, {"left": "Jonas sagt, dass sein Zug Verspätung hat.", "right": "Jonas says that his train is delayed."}, {"left": "Er möchte, dass du nicht wartest.", "right": "He wants you not to wait."}, {"left": "Bis später!", "right": "See you later!"}], "status": "correct"}], "feedback": "The note in sentences."}
  de.a2.unit114.lesson05.exercise04.ordnen_jonas: {"instruction": "Put the words in order to say 'Jonas says that his train is delayed.'", "correct_option": "Jonas sagt dass sein Zug Verspätung hat", "accepted_answers": [{"value": "Jonas sagt dass sein Zug Verspätung hat", "status": "correct"}], "feedback": "*Hat* last."}
  de.a2.unit114.lesson05.exercise05.uebersetzen_felix: {"instruction": "Translate into German.", "accepted_answers": [{"value": "Felix ruft an und sagt, dass er heute später kommt.", "status": "correct"}, {"value": "Felix ruft an und sagt dass er heute später kommt.", "status": "correct"}, {"value": "Felix ruft an und sagt, dass er heute spaeter kommt.", "status": "correct"}, {"value": "Felix ruft an und sagt dass er heute spaeter kommt.", "status": "correct"}], "feedback": "Split *ruft ... an*; *kommt* last in the *dass* clause."}
  de.a2.unit114.lesson05.exercise06.diktat_warten: {"instruction": "Type what you hear.", "correct_response": "Er möchte, dass du nicht wartest.", "orthography_strict": true, "feedback": "You heard *Er möchte, dass du nicht wartest.*"}
  de.a2.unit114.lesson05.exercise07.diktat_zeit: {"instruction": "Type what you hear.", "correct_response": "Er fragt auch, ob du morgen Zeit hast.", "orthography_strict": true, "feedback": "You heard *Er fragt auch, ob du morgen Zeit hast.*"}
  de.a2.unit114.lesson06.exercise01.hoeren_frage: {"instruction": "Listen and select the line you hear.", "correct_option": "Hallo Nina! Ich habe eine Nachricht von Felix.", "distractors": ["Hallo Felix! Ich habe eine Nachricht von Nina.", "Hallo Nina! Ich habe eine Nachricht von Jonas.", "Hallo Nina! Ich habe keine Nachricht von Felix."], "accepted_answers": [{"value": "Hallo Nina! Ich habe eine Nachricht von Felix.", "status": "correct"}], "feedback": "Anna opens with *Hallo Nina! Ich habe eine Nachricht von Felix.*"}
  de.a2.unit114.lesson06.exercise02.verstehen_frage: {"instruction": "Listen to the dialogue and choose the answer.", "correct_option": "Whether Nina has time tomorrow.", "distractors": ["Where Nina is.", "When the train comes.", "Whether Nina is ill."], "accepted_answers": [{"value": "Whether Nina has time tomorrow.", "status": "correct"}], "feedback": "Anna passes on his question."}
  de.a2.unit114.lesson06.exercise03.paare_dialog: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Ich habe eine Nachricht von Felix.", "right": "I have a message from Felix."}, {"left": "Was sagt er?", "right": "What does he say?"}, {"left": "Er sagt, dass er heute später kommt.", "right": "He says that he is coming later today."}, {"left": "Er fragt, ob du morgen Zeit hast.", "right": "He asks whether you have time tomorrow."}, {"left": "Sag ihm, dass ich um acht komme.", "right": "Tell him that I'm coming at eight."}, {"left": "Gut, ich sage es ihm.", "right": "Good, I'll tell him."}], "status": "correct"}], "feedback": "The call in sentences."}
