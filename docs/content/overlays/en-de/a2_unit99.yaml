review: {"status": "unreviewed", "required_next_reviewer": "native_speaker_review", "notes": "English overlay for the then-and-now unit (simple past of sein, haben and modals; habits in the past). OPEN NATIVE QUESTIONS: none beyond the realization notes."}
course:
  title: "German A2"
  description: "Grammar-led A2 German continuing the Anna and Felix storyline."
  learning_goal: "Talk about the past in German with the perfect, the simple past and the past perfect."
units:
  de.a2.unit99.frueher_und_jetzt: {"title": "Then and Now", "description": "Describe how life used to be and how it differs from now, using the simple past of sein, haben and the modal verbs plus früher, damals and nicht mehr."}
lessons:
  de.a2.unit99.lesson01.war_und_hatte: {"title": "I Was, I Had"}
  de.a2.unit99.lesson02.konnte_musste_wollte: {"title": "Could, Had To, Wanted To"}
  de.a2.unit99.lesson03.gewohnheiten: {"title": "What I Always Did"}
  de.a2.unit99.lesson04.frueher_anders: {"title": "It Was Different Before"}
  de.a2.unit99.lesson05.jonas_schreibt: {"title": "Jonas Writes About the Past"}
  de.a2.unit99.lesson06.felix_und_anna: {"title": "Felix and Anna"}
teaching:
  de.a2.unit99.lesson01.teach.frueher_jetzt: {"title": "Then and now", "gloss": "earlier, in the past / back then / now / as a child", "example_gloss": ["I used to be a school pupil.", "Back then I had a lot of time.", "Now I work in the cafe.", "As a child I was small."], "note": "*Früher* and *damals* look back to a time that is over. *Jetzt* brings you back to the present."}
  de.a2.unit99.lesson01.teach.lebensphasen: {"title": "Stages of life", "gloss": "school / student / child", "example_gloss": ["I was still at school.", "Felix was a student.", "Jonas was a child."], "note": "Nouns for earlier stages of life."}
  de.a2.unit99.lesson01.teach.gn_sein: {"title": "Sein in the simple past", "gloss": "I was, you were, he was, she was, we were, you (plural) were, they were", "note": "*Sein* has its own simple-past forms. Learn them by heart: *war* has no ending for *ich* and *er/sie/es*."}
  de.a2.unit99.lesson01.teach.gn_haben: {"title": "Haben in the simple past", "gloss": "I had, you had, he had, she had, we had, you (plural) had, they had", "note": "*Hatte* is the stem; *du hattest*, *wir hatten*. In spoken German, *war* and *hatte* are normally used instead of the perfect (*ich bin gewesen*, *ich habe gehabt*)."}
  de.a2.unit99.lesson01.teach.satz_jetzt: {"title": "A contrast", "gloss": "I used to have a lot of time. Now I have little time."}
  de.a2.unit99.lesson02.teach.alltag_frueher: {"title": "Everyday life earlier", "gloss": "to sleep late / to get up early / to play football / to do homework", "example_gloss": ["I used to be able to sleep late.", "I had to get up early.", "We wanted to play football.", "I had to do homework."], "note": "These are typical activities in a description of earlier life."}
  de.a2.unit99.lesson02.teach.gn_modal: {"title": "Modal verbs in the simple past", "gloss": "I could, I had to, I wanted to, I was allowed to", "note": "The modal verbs lose their umlaut in the simple past (*können, konnte*; *müssen, musste*; *dürfen, durfte*) and add *-te*. *Ich* and *er/sie* have the same form."}
  de.a2.unit99.lesson02.teach.gn_modal_du: {"title": "All persons", "gloss": "you could, he had to, we could, you (plural) were allowed, they had to", "note": "After the stem come the endings *-st* (du), *-n* (wir, sie) and *-t* (ihr)."}
  de.a2.unit99.lesson02.teach.gn_infinitiv_ende: {"title": "The second verb goes to the end", "gloss": "I used to have to get up early. We weren't allowed to be loud.", "note": "As with modals in the present, the infinitive stands at the end of the sentence. *Nicht* comes before it."}
  de.a2.unit99.lesson02.teach.satz_kind: {"title": "As a child", "gloss": "As a child, Felix wanted to become an engineer."}
  de.a2.unit99.lesson03.teach.haeufigkeit: {"title": "How often", "gloss": "every day / always / often / sometimes / never", "example_gloss": ["I used to play football every day.", "We always walked.", "I often visited friends.", "Sometimes I did homework.", "I never drank coffee."], "note": "These adverbs tell you how regular a past habit was."}
  de.a2.unit99.lesson03.teach.nicht_mehr: {"title": "No longer", "gloss": "no longer / still", "example_gloss": ["Now I don't play football any more.", "I still live here."], "note": "*Nicht mehr* marks the end of a habit. *Immer noch* says a state has not changed."}
  de.a2.unit99.lesson03.teach.gn_perfekt_gewohnheit: {"title": "Habits are often told in the perfect", "gloss": "I used to play football every day. We always walked.", "note": "For ordinary verbs, spoken German usually tells past habits with the perfect, not with the simple past. The adverb (*jeden Tag*, *immer*) shows that it was a habit."}
  de.a2.unit99.lesson03.teach.gn_nicht_mehr: {"title": "Nicht mehr and immer noch", "gloss": "I used to play football, but now I don't play any more. I still live in the city.", "note": "*Nicht mehr* and *immer noch* link the past to the present. Both come after the verb in a main clause."}
  de.a2.unit99.lesson03.teach.satz_kontrast: {"title": "Then and now in one sentence", "gloss": "I used to visit friends often, but now I have little time."}
  de.a2.unit99.lesson04.teach.sprechen_ueber: {"title": "Talking about change", "gloss": "different / happy / little / a lot / more", "example_gloss": ["It used to be different.", "I am happy.", "Now I have more money."], "note": "Words for comparing then and now."}
  de.a2.unit99.lesson04.teach.gn_kontrast: {"title": "Contrasting two times", "gloss": "I used to be a pupil, but now I am a waitress. I used to have to study, now I have to work.", "note": "Put the simple past in the first clause and the present in the second. *Aber jetzt* signals the change."}
  de.a2.unit99.lesson04.teach.gn_wortstellung: {"title": "Word order with früher", "gloss": "Earlier I had a bike. I had a bike earlier.", "note": "You can put *früher* first or after the verb. The verb is always in second position."}
  de.a2.unit99.lesson04.teach.satz_fahrrad: {"title": "One change", "gloss": "I used to have a bike. Now I take the bus."}
  de.a2.unit99.lesson05.teach.dorf_stadt: {"title": "Village and city", "gloss": "village / city / university / to study", "example_gloss": ["I used to live in a village.", "Now I study in the city.", "The university is big."], "note": "Places and a verb for describing a change of life."}
  de.a2.unit99.lesson05.teach.gn_als_kind: {"title": "Als Kind and in der Schule", "gloss": "As a child I lived in the village. At school I had many friends.", "note": "*Als Kind* and *in der Schule* are time phrases. They can start the sentence; then the verb comes second."}
  de.a2.unit99.lesson05.teach.lesen_jonas: {"title": "Jonas writes", "gloss": "I used to live in a village. I had a bike and had to ride to school every day. I couldn't go to the cinema often. Now I study in the city. I have lots of friends and I no longer have to ride a bike. I still visit the village often.", "note": "Jonas uses the simple past of *haben* and the modals for his old life, and the present for his new life.", "glosses": {"Dorf": "village", "Kino": "cinema", "studiere": "study"}}
  de.a2.unit99.lesson06.teach.felix_frage: {"title": "Felix asks", "gloss": "Felix: Anna, what did you do before?"}
  de.a2.unit99.lesson06.teach.anna_schule: {"title": "Anna remembers", "gloss": "Anna: I used to be a pupil. I had a lot of time and could sleep late."}
  de.a2.unit99.lesson06.teach.felix_jetzt: {"title": "Felix asks about now", "gloss": "Felix: And now?"}
  de.a2.unit99.lesson06.teach.anna_jetzt: {"title": "Anna compares", "gloss": "Anna: Now I work in the cafe. I have to get up early, but I'm happy."}
  de.a2.unit99.lesson06.teach.anna_frage: {"title": "Anna asks back", "gloss": "Anna: And you? What did you want to be as a child?"}
  de.a2.unit99.lesson06.teach.felix_traum: {"title": "Felix answers", "gloss": "Felix: As a child I wanted to become an engineer. Now I am an engineer!"}
exercises:
  de.a2.unit99.lesson01.exercise01.wahl_war: {"instruction": "Choose the correct German sentence.", "correct_option": "Früher war ich Schülerin.", "distractors": ["Früher bin ich Schülerin.", "Früher warst ich Schülerin.", "Früher wart ich Schülerin."], "accepted_answers": [{"value": "Früher war ich Schülerin.", "status": "correct"}], "feedback": "*Ich war* is the simple past of *ich bin*."}
  de.a2.unit99.lesson01.exercise02.wahl_hatte: {"instruction": "Choose the correct German sentence.", "correct_option": "Damals hatte ich viel Zeit.", "distractors": ["Damals habte ich viel Zeit.", "Damals hattest ich viel Zeit.", "Damals hatten ich viel Zeit."], "accepted_answers": [{"value": "Damals hatte ich viel Zeit.", "status": "correct"}], "feedback": "*Ich hatte* is the simple past of *ich habe*."}
  de.a2.unit99.lesson01.exercise03.paare_formen: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "ich war", "right": "I was"}, {"left": "du warst", "right": "you were"}, {"left": "wir waren", "right": "we were"}, {"left": "ich hatte", "right": "I had"}, {"left": "du hattest", "right": "you had"}, {"left": "wir hatten", "right": "we had"}], "status": "correct"}], "feedback": "Both verbs add endings to a short stem: *war-*, *hatt-*."}
  de.a2.unit99.lesson01.exercise04.ordnen_student: {"instruction": "Put the words in order to say 'Felix used to be a student.'", "correct_option": "Felix war früher Student", "accepted_answers": [{"value": "Felix war früher Student", "status": "correct"}, {"value": "Früher war Felix Student", "status": "correct"}], "feedback": "*War* is second, then *früher* and the noun."}
  de.a2.unit99.lesson01.exercise05.luecke_warst: {"instruction": "Complete with the simple past of sein for du.", "correct_option": "warst", "accepted_answers": [{"value": "warst", "status": "correct"}], "feedback": "*Du warst* ends in -st."}
  de.a2.unit99.lesson01.exercise06.uebersetzen_zeit: {"instruction": "Translate into German.", "accepted_answers": [{"value": "Damals hatte ich viel Zeit.", "status": "correct"}, {"value": "Ich hatte damals viel Zeit.", "status": "correct"}], "feedback": "Use *hatte* with *damals*."}
  de.a2.unit99.lesson01.exercise07.schreiben_kind: {"instruction": "Write the requested German sentence.", "correct_option": "Als Kind war ich klein.", "accepted_answers": [{"value": "Als Kind war ich klein.", "status": "correct"}, {"value": "Ich war als Kind klein.", "status": "correct"}], "feedback": "*Als Kind war ich klein.* The verb stays second after *als Kind*."}
  de.a2.unit99.lesson02.exercise01.wahl_konnte: {"instruction": "Choose the correct German sentence.", "correct_option": "Früher konnte ich lange schlafen.", "distractors": ["Früher könnte ich lange schlafen.", "Früher kannte ich lange schlafen.", "Früher konnte ich schlafen lange."], "accepted_answers": [{"value": "Früher konnte ich lange schlafen.", "status": "correct"}], "feedback": "The modal is *konnte* (no umlaut), the infinitive *schlafen* is last."}
  de.a2.unit99.lesson02.exercise02.wahl_musste: {"instruction": "Choose the correct German sentence.", "correct_option": "Ich musste früh aufstehen.", "distractors": ["Ich müsste früh aufstehen.", "Ich musste früh aufgestanden.", "Ich musste früh stehen auf."], "accepted_answers": [{"value": "Ich musste früh aufstehen.", "status": "correct"}], "feedback": "*Musste* plus the infinitive *aufstehen* at the end."}
  de.a2.unit99.lesson02.exercise03.paare_modal: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "ich konnte", "right": "I could"}, {"left": "ich musste", "right": "I had to"}, {"left": "ich wollte", "right": "I wanted to"}, {"left": "ich durfte", "right": "I was allowed to"}, {"left": "wir konnten", "right": "we could"}, {"left": "sie mussten", "right": "they had to"}], "status": "correct"}], "feedback": "The modals add *-te* to the stem and drop the umlaut."}
  de.a2.unit99.lesson02.exercise04.ordnen_hausaufgaben: {"instruction": "Put the words in order to say 'I had to do homework.'", "correct_option": "Ich musste Hausaufgaben machen", "accepted_answers": [{"value": "Ich musste Hausaufgaben machen", "status": "correct"}], "feedback": "The infinitive *machen* is last."}
  de.a2.unit99.lesson02.exercise05.luecke_durften: {"instruction": "Complete with the simple past of dürfen for wir.", "correct_option": "durften", "accepted_answers": [{"value": "durften", "status": "correct"}], "feedback": "*Wir durften*: stem *durf-*, then *-ten*."}
  de.a2.unit99.lesson02.exercise06.uebersetzen_wollten: {"instruction": "Translate into German.", "accepted_answers": [{"value": "Wir wollten Fußball spielen.", "status": "correct"}, {"value": "Wir wollten Fussball spielen.", "status": "correct"}], "feedback": "*Wollten* plus the infinitive at the end."}
  de.a2.unit99.lesson02.exercise07.schreiben_ingenieur: {"instruction": "Write the requested German sentence.", "correct_option": "Als Kind wollte Felix Ingenieur werden.", "accepted_answers": [{"value": "Als Kind wollte Felix Ingenieur werden.", "status": "correct"}, {"value": "Felix wollte als Kind Ingenieur werden.", "status": "correct"}], "feedback": "*Wollte* is second, *werden* is last."}
  de.a2.unit99.lesson03.exercise01.wahl_jeden_tag: {"instruction": "Choose the correct German sentence.", "correct_option": "Früher habe ich jeden Tag Fußball gespielt.", "distractors": ["Früher habe ich jeden Tag Fußball spielen.", "Früher bin ich jeden Tag Fußball gespielt.", "Früher habe ich jeder Tag Fußball gespielt."], "accepted_answers": [{"value": "Früher habe ich jeden Tag Fußball gespielt.", "status": "correct"}], "feedback": "A habit in the past: *habe ... gespielt*, with *jeden Tag* in the accusative."}
  de.a2.unit99.lesson03.exercise02.wahl_nicht_mehr: {"instruction": "Choose the correct German sentence.", "correct_option": "Jetzt spiele ich nicht mehr Fußball.", "distractors": ["Jetzt spiele ich nicht noch Fußball.", "Jetzt spiele ich mehr nicht Fußball.", "Jetzt habe ich nicht mehr Fußball gespielt."], "accepted_answers": [{"value": "Jetzt spiele ich nicht mehr Fußball.", "status": "correct"}], "feedback": "*Nicht mehr* means 'no longer'."}
  de.a2.unit99.lesson03.exercise03.paare_adverbien: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "jeden Tag", "right": "every day"}, {"left": "immer", "right": "always"}, {"left": "oft", "right": "often"}, {"left": "manchmal", "right": "sometimes"}, {"left": "nie", "right": "never"}, {"left": "nicht mehr", "right": "no longer"}], "status": "correct"}], "feedback": "These are the words for habits."}
  de.a2.unit99.lesson03.exercise04.ordnen_immer_noch: {"instruction": "Put the words in order to say 'I still live here.'", "correct_option": "Ich wohne immer noch hier", "accepted_answers": [{"value": "Ich wohne immer noch hier", "status": "correct"}], "feedback": "*Immer noch* stands after the verb."}
  de.a2.unit99.lesson03.exercise05.luecke_gespielt: {"instruction": "Complete with the participle of spielen.", "correct_option": "gespielt", "accepted_answers": [{"value": "gespielt", "status": "correct"}], "feedback": "*Spielen* is regular: *gespielt*."}
  de.a2.unit99.lesson03.exercise06.uebersetzen_immer: {"instruction": "Translate into German.", "accepted_answers": [{"value": "Wir sind immer zu Fuß gegangen.", "status": "correct"}, {"value": "Wir sind immer zu Fuss gegangen.", "status": "correct"}], "feedback": "*Gehen* takes *sein* in the perfect."}
  de.a2.unit99.lesson03.exercise07.schreiben_nie: {"instruction": "Write the requested German sentence.", "correct_option": "Ich habe nie Kaffee getrunken.", "accepted_answers": [{"value": "Ich habe nie Kaffee getrunken.", "status": "correct"}], "feedback": "*Nie* stands before the participle."}
  de.a2.unit99.lesson04.exercise01.wahl_anders: {"instruction": "Choose the correct German sentence.", "correct_option": "Früher war es anders.", "distractors": ["Früher ist es anders.", "Früher war es andere.", "Früher es war anders."], "accepted_answers": [{"value": "Früher war es anders.", "status": "correct"}], "feedback": "*War es anders* uses the simple past of *sein*."}
  de.a2.unit99.lesson04.exercise02.wahl_aber_jetzt: {"instruction": "Choose the correct German sentence.", "correct_option": "Früher war ich Schülerin, aber jetzt bin ich Kellnerin.", "distractors": ["Früher war ich Schülerin, aber jetzt war ich Kellnerin.", "Früher bin ich Schülerin, aber jetzt bin ich Kellnerin.", "Früher war ich Schülerin, aber jetzt ich bin Kellnerin."], "accepted_answers": [{"value": "Früher war ich Schülerin, aber jetzt bin ich Kellnerin.", "status": "correct"}], "feedback": "Past in the first part, present in the second."}
  de.a2.unit99.lesson04.exercise03.paare_kontrast: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Früher hatte ich ein Fahrrad.", "right": "I used to have a bike."}, {"left": "Jetzt fahre ich mit dem Bus.", "right": "Now I take the bus."}, {"left": "Früher konnte ich lange schlafen.", "right": "I used to be able to sleep late."}, {"left": "Jetzt muss ich früh aufstehen.", "right": "Now I have to get up early."}, {"left": "Früher war es anders.", "right": "It used to be different."}, {"left": "Ich bin glücklich.", "right": "I am happy."}], "status": "correct"}], "feedback": "Past and present sentences side by side."}
  de.a2.unit99.lesson04.exercise04.ordnen_fahrrad: {"instruction": "Put the words in order to say 'I used to have a bike.'", "correct_option": "Früher hatte ich ein Fahrrad", "accepted_answers": [{"value": "Früher hatte ich ein Fahrrad", "status": "correct"}, {"value": "Ich hatte früher ein Fahrrad", "status": "correct"}], "feedback": "The verb *hatte* is second."}
  de.a2.unit99.lesson04.exercise05.luecke_muss: {"instruction": "Complete with the present tense of müssen.", "correct_option": "muss", "accepted_answers": [{"value": "muss", "status": "correct"}], "feedback": "The present: *ich muss*. The past would be *ich musste*."}
  de.a2.unit99.lesson04.exercise06.uebersetzen_kontrast: {"instruction": "Translate into German.", "accepted_answers": [{"value": "Früher musste ich lernen, jetzt muss ich arbeiten.", "status": "correct"}, {"value": "Früher musste ich lernen, aber jetzt muss ich arbeiten.", "status": "correct"}, {"value": "Frueher musste ich lernen, jetzt muss ich arbeiten.", "status": "correct"}, {"value": "Frueher musste ich lernen, aber jetzt muss ich arbeiten.", "status": "correct"}], "feedback": "Simple past first, present second."}
  de.a2.unit99.lesson04.exercise07.schreiben_zwei: {"instruction": "Write two German sentences, following the two instructions.", "correct_option": "Früher hatte ich ein Fahrrad. Jetzt fahre ich mit dem Bus.", "accepted_answers": [{"value": "Früher hatte ich ein Fahrrad. Jetzt fahre ich mit dem Bus.", "status": "correct"}, {"value": "Frueher hatte ich ein Fahrrad. Jetzt fahre ich mit dem Bus.", "status": "correct"}], "feedback": "*Früher hatte ich ...* / *Jetzt fahre ich ...*"}
  de.a2.unit99.lesson05.exercise01.lesen_wo: {"instruction": "Read the text and choose the answer.", "correct_option": "In a village.", "distractors": ["In the city.", "In a flat near the university.", "At his uncle's house."], "accepted_answers": [{"value": "In a village.", "status": "correct"}], "feedback": "*Früher habe ich in einem Dorf gewohnt.*"}
  de.a2.unit99.lesson05.exercise02.lesen_jetzt: {"instruction": "Read the text and choose the answer.", "correct_option": "He studies in the city.", "distractors": ["He works in a cafe.", "He goes to school in the village.", "He rides his bike to school."], "accepted_answers": [{"value": "He studies in the city.", "status": "correct"}], "feedback": "*Jetzt studiere ich in der Stadt.*"}
  de.a2.unit99.lesson05.exercise03.paare_jonas: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Ich hatte ein Fahrrad.", "right": "I had a bike."}, {"left": "Ich musste jeden Tag zur Schule fahren.", "right": "I had to ride to school every day."}, {"left": "Ich konnte nicht oft ins Kino gehen.", "right": "I couldn't go to the cinema often."}, {"left": "Jetzt studiere ich in der Stadt.", "right": "Now I study in the city."}, {"left": "Ich habe viele Freunde.", "right": "I have lots of friends."}, {"left": "Das Dorf besuche ich immer noch oft.", "right": "I still visit the village often."}], "status": "correct"}], "feedback": "Old life in the simple past, new life in the present."}
  de.a2.unit99.lesson05.exercise04.ordnen_dorf: {"instruction": "Put the words in order to say 'I used to live in a village.'", "correct_option": "Früher habe ich in einem Dorf gewohnt", "accepted_answers": [{"value": "Früher habe ich in einem Dorf gewohnt", "status": "correct"}], "feedback": "The participle *gewohnt* is last."}
  de.a2.unit99.lesson05.exercise05.uebersetzen_kino: {"instruction": "Translate into German.", "accepted_answers": [{"value": "Ich konnte nicht oft ins Kino gehen.", "status": "correct"}], "feedback": "*Konnte* is second and *gehen* is last."}
  de.a2.unit99.lesson05.exercise06.diktat_dorf: {"instruction": "Type what you hear.", "correct_response": "Früher habe ich in einem Dorf gewohnt.", "orthography_strict": true, "feedback": "You heard *Früher habe ich in einem Dorf gewohnt.*."}
  de.a2.unit99.lesson05.exercise07.diktat_fahrrad: {"instruction": "Type what you hear.", "correct_response": "Ich hatte ein Fahrrad und musste zur Schule fahren.", "orthography_strict": true, "feedback": "You heard *Ich hatte ein Fahrrad und musste zur Schule fahren.*."}
  de.a2.unit99.lesson06.exercise01.hoeren_frage: {"instruction": "Listen and select Felix's first question.", "correct_option": "Anna, was hast du früher gemacht?", "distractors": ["Anna, wie war dein Morgen?", "Anna, was wolltest du als Kind werden?", "Felix, was hast du früher gemacht?"], "accepted_answers": [{"value": "Anna, was hast du früher gemacht?", "status": "correct"}], "feedback": "Felix opens with *Anna, was hast du früher gemacht?*"}
  de.a2.unit99.lesson06.exercise02.verstehen_anna: {"instruction": "Listen to the dialogue and choose the answer.", "correct_option": "She was a pupil, had a lot of time and slept late.", "distractors": ["She worked in a cafe and got up early.", "She was a student and lived in a village.", "She was a child and wanted to be an engineer."], "accepted_answers": [{"value": "She was a pupil, had a lot of time and slept late.", "status": "correct"}], "feedback": "Anna describes her earlier life with *war*, *hatte* and *konnte*."}
  de.a2.unit99.lesson06.exercise03.paare_dialog: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Was hast du früher gemacht?", "right": "What did you do before?"}, {"left": "Ich hatte viel Zeit.", "right": "I had a lot of time."}, {"left": "Ich konnte lange schlafen.", "right": "I could sleep late."}, {"left": "Ich muss früh aufstehen.", "right": "I have to get up early."}, {"left": "Was wolltest du als Kind werden?", "right": "What did you want to be as a child?"}, {"left": "Jetzt bin ich Ingenieur.", "right": "Now I am an engineer."}], "status": "correct"}], "feedback": "Each line contrasts then and now or asks about it."}
  de.a2.unit99.lesson06.exercise04.ordnen_wolltest: {"instruction": "Put the words in order to ask 'What did you want to be as a child?'", "correct_option": "Was wolltest du als Kind werden", "accepted_answers": [{"value": "Was wolltest du als Kind werden", "status": "correct"}], "feedback": "*Wolltest* is second, *werden* is last."}
  de.a2.unit99.lesson06.exercise05.antwort_kind: {"instruction": "Answer in German as Felix: say that as a child you wanted to become an engineer.", "correct_option": "Als Kind wollte ich Ingenieur werden.", "accepted_answers": [{"value": "Als Kind wollte ich Ingenieur werden.", "status": "correct"}, {"value": "Ich wollte als Kind Ingenieur werden.", "status": "correct"}], "feedback": "Use *wollte* and put *werden* at the end."}
