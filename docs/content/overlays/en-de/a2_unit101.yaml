status: complete_draft
review: {"status": "unreviewed", "required_next_reviewer": "native_speaker_review", "notes": "English overlay for the 'ever done it' unit (schon mal, noch nie, schon, noch nicht). OPEN NATIVE QUESTIONS: none beyond the realization notes."}
course:
  title: "German A2"
  description: "Grammar-led A2 German continuing the Anna and Felix storyline."
  learning_goal: "Talk about the past in German with the perfect, the simple past and the past perfect."
units:
  de.a2.unit101.schon_mal: {"title": "Ever Done It?", "description": "Ask and say what you have or have never done, and whether you have already done something yet, with schon mal, noch nie, schon and noch nicht."}
lessons:
  de.a2.unit101.lesson01.schon_mal_noch_nie: {"title": "Ever? Never!"}
  de.a2.unit101.lesson02.schon_oder_noch_nicht: {"title": "Already or Not Yet?"}
  de.a2.unit101.lesson03.war_schon_in: {"title": "Where Have You Been?"}
  de.a2.unit101.lesson04.wie_oft: {"title": "How Often So Far?"}
  de.a2.unit101.lesson05.ninas_antworten: {"title": "Nina's Answers"}
  de.a2.unit101.lesson06.anna_und_felix: {"title": "Anna Asks Felix"}
teaching:
  de.a2.unit101.lesson01.teach.erfahrungen: {"title": "Things people try", "gloss": "to eat sushi / to see a film / to read a book / to ride a bike / to swim", "example_gloss": ["I have eaten sushi before.", "Felix has seen a film.", "Anna has read a book.", "Nina has ridden a bike.", "We have swum in the sea."], "note": "Typical things people have or have not done. Notice the participles: *gegessen*, *gesehen*, *gelesen*, *gefahren*, *geschwommen*."}
  de.a2.unit101.lesson01.teach.schon_mal_noch_nie: {"title": "Ever and never", "gloss": "ever, once before / never / never", "example_gloss": ["Have you ever eaten sushi?", "No, I have never eaten sushi.", "Yes, I have eaten sushi before."], "note": "*Schon mal* asks about or confirms an experience at some point in life. *Noch nie* means 'never so far'."}
  de.a2.unit101.lesson01.teach.gn_frage: {"title": "Asking about experiences", "gloss": "Have you ever eaten sushi? Have you ever swum?", "note": "The question uses the perfect: *haben* or *sein* first, then the subject, then *schon mal*, with the participle at the end."}
  de.a2.unit101.lesson01.teach.gn_antwort: {"title": "Answering: ja or noch nie", "gloss": "Yes, I have eaten sushi before. No, I have never eaten sushi.", "note": "German answers 'No' with *noch nie* and keeps the perfect: *noch nie* stands before the participle."}
  de.a2.unit101.lesson01.teach.satz_kurz: {"title": "Short answers", "gloss": "Ever? Yes, once. Never!"}
  de.a2.unit101.lesson02.teach.erledigt: {"title": "Things to do", "gloss": "to do homework / to write a letter / to buy bread / to call Anna", "example_gloss": ["Have you done your homework yet?", "I have already written a letter.", "I haven't bought the bread yet.", "Felix hasn't called Anna yet."], "note": "Everyday tasks that you can have done or not."}
  de.a2.unit101.lesson02.teach.gn_schon: {"title": "Schon means already", "gloss": "Have you eaten yet? Yes, I have already eaten.", "note": "*Schon* in a question means 'yet'; in a statement it means 'already'. It stands before the participle."}
  de.a2.unit101.lesson02.teach.gn_noch_nicht: {"title": "Noch nicht means not yet", "gloss": "No, I haven't eaten yet. I haven't written yet.", "note": "*Noch nicht* means 'not yet': the action is still expected. Compare *noch nie* (never) in the last lesson."}
  de.a2.unit101.lesson02.teach.gn_unterschied: {"title": "Noch nicht or noch nie?", "gloss": "I haven't had breakfast yet. I have never had breakfast.", "note": "*Noch nicht* leaves the future open. *Noch nie* looks back over your whole life."}
  de.a2.unit101.lesson02.teach.satz_status: {"title": "Status", "gloss": "I have already eaten, but I haven't washed up yet."}
  de.a2.unit101.lesson03.teach.orte: {"title": "Places", "gloss": "Italy / Spain / Austria / Berlin / Hamburg", "example_gloss": ["I have been to Italy.", "Anna has been to Spain.", "Felix has never been to Austria.", "Nina has been to Berlin and Hamburg."], "note": "Place names take *in* in this pattern: *in Italien, in Berlin*."}
  de.a2.unit101.lesson03.teach.reise: {"title": "Travelling", "gloss": "to fly / to go by train / the plane", "example_gloss": ["I have never flown.", "We took the train to Berlin.", "The plane is big."], "note": "*Fliegen* and *fahren* both use *sein* in the perfect."}
  de.a2.unit101.lesson03.teach.gn_war: {"title": "Was for places", "gloss": "Have you ever been to Berlin? Yes, I have been to Berlin.", "note": "For where you have been, German usually uses the simple past of *sein*: *ich war*, *du warst*. It is shorter than the perfect and very common."}
  de.a2.unit101.lesson03.teach.gn_sein_perfekt: {"title": "Sein in the perfect for travelling", "gloss": "I have flown before. We went to Berlin.", "note": "Verbs of travel (*fliegen*, *fahren*) form the perfect with *sein*. Compare *war* for a place: *Ich war in Berlin*."}
  de.a2.unit101.lesson03.teach.satz_italien: {"title": "Never been", "gloss": "Felix has never been to Italy."}
  de.a2.unit101.lesson04.teach.haeufigkeit: {"title": "How many times", "gloss": "once / twice / often / many times", "example_gloss": ["I have been to Berlin once.", "Anna has been to Italy twice.", "Felix has often eaten pizza.", "I have been there many times.", "I have never done that."], "note": "Use these words to say how many times you have done something."}
  de.a2.unit101.lesson04.teach.gn_wie_oft: {"title": "Asking how often", "gloss": "How often have you been to Italy? I have been to Italy twice.", "note": "*Wie oft* asks for a number of times. The answer follows with a count (*einmal, zweimal*) or *oft*."}
  de.a2.unit101.lesson04.teach.gn_stellung: {"title": "Position of the time words", "gloss": "I have already been there twice. I have often done that. I have never done that.", "note": "The adverbs stand before the participle or after the verb; the participle stays last in the perfect."}
  de.a2.unit101.lesson04.teach.satz_dort: {"title": "Experience in one line", "gloss": "I have been there twice, but I have never eaten pizza."}
  de.a2.unit101.lesson05.teach.fragebogen: {"title": "A questionnaire", "gloss": "questionnaire / answer / concert", "example_gloss": ["Nina has read a questionnaire.", "Nina has written the answers.", "I have never been to a concert."], "note": "Words for the text you will read."}
  de.a2.unit101.lesson05.teach.gn_zusammen: {"title": "Combining experiences", "gloss": "Nina has been to Berlin, but she has never flown.", "note": "Link two experiences with *aber*. Each half is a full perfect or simple-past sentence."}
  de.a2.unit101.lesson05.teach.gn_text: {"title": "Reading tip", "gloss": "I have often eaten sushi, but I have never flown.", "note": "Look for the small words *schon, noch nie, oft*: they tell you what the writer has done."}
  de.a2.unit101.lesson05.teach.lesen_nina: {"title": "Nina's questionnaire", "gloss": "Hello, I'm Nina. I have been to Berlin and Hamburg. I have often eaten sushi, but I have never flown. I have never been to a concert. I have already written a questionnaire, but I haven't read the answers yet.", "note": "The text mixes four small words: schon, oft, noch nie and noch nicht.", "glosses": {"Fragebogen": "questionnaire", "Antworten": "answers", "Konzert": "concert", "geflogen": "flown"}}
  de.a2.unit101.lesson06.teach.anna_frage: {"title": "Anna asks", "gloss": "Anna: Felix, have you ever been to Italy?"}
  de.a2.unit101.lesson06.teach.felix_nein: {"title": "Felix answers", "gloss": "Felix: No, never. But in August I'm going to Italy."}
  de.a2.unit101.lesson06.teach.anna_super: {"title": "Anna reacts", "gloss": "Anna: Great! I've been there twice. Have you booked a hotel yet?"}
  de.a2.unit101.lesson06.teach.felix_hotel: {"title": "Felix explains", "gloss": "Felix: Yes, I've already booked a hotel. But I haven't packed yet."}
  de.a2.unit101.lesson06.teach.anna_pizza: {"title": "Anna talks about food", "gloss": "Anna: I've eaten a lot of pizza there. The pizza is great!"}
  de.a2.unit101.lesson06.teach.felix_gespannt: {"title": "Felix is excited", "gloss": "Felix: I've never eaten pizza in Italy. I'm excited!"}
exercises:
  de.a2.unit101.lesson01.exercise01.wahl_frage: {"instruction": "Choose the correct German sentence.", "correct_option": "Hast du schon mal Sushi gegessen?", "distractors": ["Hast du schon mal Sushi gegessene?", "Hast du Sushi schon mal essen?", "Bist du schon mal Sushi gegessen?"], "accepted_answers": [{"value": "Hast du schon mal Sushi gegessen?", "status": "correct"}], "feedback": "The question starts with *hast du* and ends with the participle *gegessen*."}
  de.a2.unit101.lesson01.exercise02.wahl_noch_nie: {"instruction": "Choose the correct German sentence.", "correct_option": "Ich habe noch nie Sushi gegessen.", "distractors": ["Ich habe nicht nie Sushi gegessen.", "Ich habe Sushi gegessen noch nie.", "Ich bin noch nie Sushi gegessen."], "accepted_answers": [{"value": "Ich habe noch nie Sushi gegessen.", "status": "correct"}], "feedback": "*Noch nie* stands before the Sushi-participle block, not at the end."}
  de.a2.unit101.lesson01.exercise03.paare_partizipien: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "gegessen", "right": "eaten"}, {"left": "gesehen", "right": "seen"}, {"left": "gelesen", "right": "read"}, {"left": "gefahren", "right": "ridden, driven"}, {"left": "geschwommen", "right": "swum"}, {"left": "gemacht", "right": "done, made"}], "status": "correct"}], "feedback": "The participles of the unit's main verbs."}
  de.a2.unit101.lesson01.exercise04.ordnen_schon_mal: {"instruction": "Put the words in order to ask 'Have you ever read a book?'", "correct_option": "Hast du schon mal ein Buch gelesen", "accepted_answers": [{"value": "Hast du schon mal ein Buch gelesen", "status": "correct"}], "feedback": "The participle is last."}
  de.a2.unit101.lesson01.exercise05.luecke_nie: {"instruction": "Complete with the word that means 'never' after noch.", "correct_option": "nie", "accepted_answers": [{"value": "nie", "status": "correct"}], "feedback": "*Noch nie* = never so far."}
  de.a2.unit101.lesson01.exercise06.uebersetzen_ja: {"instruction": "Translate into German.", "accepted_answers": [{"value": "Ja, ich habe schon mal einen Film gesehen.", "status": "correct"}], "feedback": "*Schon mal* before the participle."}
  de.a2.unit101.lesson01.exercise07.schreiben_noch_nie: {"instruction": "Write the requested German sentence.", "correct_option": "Ich bin noch nie Fahrrad gefahren.", "accepted_answers": [{"value": "Ich bin noch nie Fahrrad gefahren.", "status": "correct"}], "feedback": "*Fahrrad fahren* is a movement verb and takes *sein*: *bin gefahren*."}
  de.a2.unit101.lesson02.exercise01.wahl_schon: {"instruction": "Choose the correct German sentence.", "correct_option": "Hast du schon Hausaufgaben gemacht?", "distractors": ["Hast du schon Hausaufgaben machen?", "Hast du Hausaufgaben gemacht schon?", "Bist du schon Hausaufgaben gemacht?"], "accepted_answers": [{"value": "Hast du schon Hausaufgaben gemacht?", "status": "correct"}], "feedback": "*Schon* comes before the object here, and the participle is last."}
  de.a2.unit101.lesson02.exercise02.wahl_noch_nicht: {"instruction": "Choose the correct German sentence.", "correct_option": "Felix hat Anna noch nicht angerufen.", "distractors": ["Felix hat Anna noch nie angerufen.", "Felix hat Anna nicht noch angerufen.", "Felix hat noch nicht Anna geanrufen."], "accepted_answers": [{"value": "Felix hat Anna noch nicht angerufen.", "status": "correct"}], "feedback": "*Noch nicht* means 'not yet' and stands before the participle."}
  de.a2.unit101.lesson02.exercise03.paare_status: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Ich habe schon gegessen.", "right": "I have already eaten."}, {"left": "Ich habe noch nicht gegessen.", "right": "I haven't eaten yet."}, {"left": "Ich habe noch nie Sushi gegessen.", "right": "I have never eaten sushi."}, {"left": "Ich habe schon mal Sushi gegessen.", "right": "I have eaten sushi before."}, {"left": "Hast du schon Hausaufgaben gemacht?", "right": "Have you done your homework yet?"}, {"left": "Ich habe einen Brief geschrieben.", "right": "I have written a letter."}], "status": "correct"}], "feedback": "Four small words, four different meanings."}
  de.a2.unit101.lesson02.exercise04.ordnen_noch_nicht: {"instruction": "Put the words in order to say 'I haven't had breakfast yet.'", "correct_option": "Ich habe noch nicht gefrühstückt", "accepted_answers": [{"value": "Ich habe noch nicht gefrühstückt", "status": "correct"}], "feedback": "*Noch nicht* stands before the participle."}
  de.a2.unit101.lesson02.exercise05.luecke_schon: {"instruction": "Complete with the word for 'already'.", "correct_option": "schon", "accepted_answers": [{"value": "schon", "status": "correct"}], "feedback": "*Schon* = already."}
  de.a2.unit101.lesson02.exercise06.uebersetzen_noch_nicht: {"instruction": "Translate into German.", "accepted_answers": [{"value": "Ich habe das Brot noch nicht eingekauft.", "status": "correct"}], "feedback": "*Noch nicht* stands before the participle."}
  de.a2.unit101.lesson02.exercise07.schreiben_schon: {"instruction": "Write the requested German sentence.", "correct_option": "Ich habe schon gegessen.", "accepted_answers": [{"value": "Ich habe schon gegessen.", "status": "correct"}], "feedback": "*Ich habe schon gegessen.*"}
  de.a2.unit101.lesson03.exercise01.wahl_warst: {"instruction": "Choose the correct German sentence.", "correct_option": "Warst du schon mal in Berlin?", "distractors": ["Wärst du schon mal in Berlin?", "Bist du schon mal in Berlin war?", "Hast du schon mal in Berlin gewesen?"], "accepted_answers": [{"value": "Warst du schon mal in Berlin?", "status": "correct"}], "feedback": "*Warst du schon mal* is the simple-past question for places."}
  de.a2.unit101.lesson03.exercise02.wahl_geflogen: {"instruction": "Choose the correct German sentence.", "correct_option": "Ich bin noch nie geflogen.", "distractors": ["Ich habe noch nie geflogen.", "Ich bin noch nie fliegen.", "Ich bin noch nie geflogt."], "accepted_answers": [{"value": "Ich bin noch nie geflogen.", "status": "correct"}], "feedback": "*Fliegen* takes *sein*: *bin geflogen*."}
  de.a2.unit101.lesson03.exercise03.paare_orte: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Ich war schon in Italien.", "right": "I have been to Italy."}, {"left": "Anna war in Spanien.", "right": "Anna has been to Spain."}, {"left": "Felix war noch nie in Österreich.", "right": "Felix has never been to Austria."}, {"left": "Nina war schon in Berlin.", "right": "Nina has been to Berlin."}, {"left": "Wir sind nach Berlin gefahren.", "right": "We went to Berlin."}, {"left": "Ich bin noch nie geflogen.", "right": "I have never flown."}], "status": "correct"}], "feedback": "Places and travel experiences."}
  de.a2.unit101.lesson03.exercise04.ordnen_war: {"instruction": "Put the words in order to say 'Felix has never been to Austria.'", "correct_option": "Felix war noch nie in Österreich", "accepted_answers": [{"value": "Felix war noch nie in Österreich", "status": "correct"}], "feedback": "*War* is second; *noch nie* follows the subject."}
  de.a2.unit101.lesson03.exercise05.luecke_war: {"instruction": "Complete with the simple past of sein for ich.", "correct_option": "war", "accepted_answers": [{"value": "war", "status": "correct"}], "feedback": "*Ich war* = I was / I have been."}
  de.a2.unit101.lesson03.exercise06.uebersetzen_warst: {"instruction": "Translate into German.", "accepted_answers": [{"value": "Warst du schon mal in Spanien?", "status": "correct"}], "feedback": "*Warst du* + *schon mal*."}
  de.a2.unit101.lesson03.exercise07.schreiben_nina: {"instruction": "Write the requested German sentence.", "correct_option": "Nina war schon in Berlin.", "accepted_answers": [{"value": "Nina war schon in Berlin.", "status": "correct"}], "feedback": "*Nina war schon in Berlin.*"}
  de.a2.unit101.lesson04.exercise01.wahl_zweimal: {"instruction": "Choose the correct German sentence.", "correct_option": "Anna war zweimal in Italien.", "distractors": ["Anna ist zweimal in Italien.", "Anna war in Italien zweimal gewesen.", "Anna hatte zweimal in Italien."], "accepted_answers": [{"value": "Anna war zweimal in Italien.", "status": "correct"}], "feedback": "*Zweimal* means 'twice'."}
  de.a2.unit101.lesson04.exercise02.wahl_wie_oft: {"instruction": "Choose the correct German sentence.", "correct_option": "Wie oft warst du schon in Italien?", "distractors": ["Wie oft bist du schon in Italien?", "Wie oft warst schon du in Italien?", "Wann oft warst du schon in Italien?"], "accepted_answers": [{"value": "Wie oft warst du schon in Italien?", "status": "correct"}], "feedback": "*Wie oft* + simple past of *sein*."}
  de.a2.unit101.lesson04.exercise03.paare_haeufig: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "einmal", "right": "once"}, {"left": "zweimal", "right": "twice"}, {"left": "oft", "right": "often"}, {"left": "schon viele Male", "right": "many times already"}, {"left": "noch nie", "right": "never so far"}, {"left": "noch nicht", "right": "not yet"}], "status": "correct"}], "feedback": "Counting your experiences."}
  de.a2.unit101.lesson04.exercise04.ordnen_dort: {"instruction": "Put the words in order to say 'I have already been there twice.'", "correct_option": "Ich war schon zweimal dort", "accepted_answers": [{"value": "Ich war schon zweimal dort", "status": "correct"}], "feedback": "The word order is subject, verb, then the time words."}
  de.a2.unit101.lesson04.exercise05.luecke_einmal: {"instruction": "Complete with the word for 'once'.", "correct_option": "einmal", "accepted_answers": [{"value": "einmal", "status": "correct"}], "feedback": "*Einmal* = one time."}
  de.a2.unit101.lesson04.exercise06.uebersetzen_oft: {"instruction": "Translate into German.", "accepted_answers": [{"value": "Felix hat oft Pizza gegessen.", "status": "correct"}], "feedback": "*Oft* stands before the object-participle block."}
  de.a2.unit101.lesson04.exercise07.schreiben_zweimal: {"instruction": "Write the requested German sentence.", "correct_option": "Ich war schon zweimal in Italien.", "accepted_answers": [{"value": "Ich war schon zweimal in Italien.", "status": "correct"}, {"value": "Ich war zweimal in Italien.", "status": "correct"}], "feedback": "*Ich war schon zweimal in Italien.*"}
  de.a2.unit101.lesson05.exercise01.lesen_orte: {"instruction": "Read the text and choose the answer.", "correct_option": "Berlin and Hamburg.", "distractors": ["Berlin and Spain.", "Hamburg and Italy.", "Only Berlin."], "accepted_answers": [{"value": "Berlin and Hamburg.", "status": "correct"}], "feedback": "*Ich war schon in Berlin und in Hamburg.*"}
  de.a2.unit101.lesson05.exercise02.lesen_noch_nie: {"instruction": "Read the text and choose the answer.", "correct_option": "Flown.", "distractors": ["Eaten sushi.", "Been to Berlin.", "Written a questionnaire."], "accepted_answers": [{"value": "Flown.", "status": "correct"}], "feedback": "*Ich bin noch nie geflogen.*"}
  de.a2.unit101.lesson05.exercise03.paare_nina: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Ich war schon in Berlin.", "right": "I have been to Berlin."}, {"left": "Ich habe schon oft Sushi gegessen.", "right": "I have often eaten sushi."}, {"left": "Ich bin noch nie geflogen.", "right": "I have never flown."}, {"left": "Ich habe noch nie ein Konzert besucht.", "right": "I have never been to a concert."}, {"left": "Ich habe einen Fragebogen geschrieben.", "right": "I have written a questionnaire."}, {"left": "Ich habe die Antworten noch nicht gelesen.", "right": "I haven't read the answers yet."}], "status": "correct"}], "feedback": "Nina's sentences."}
  de.a2.unit101.lesson05.exercise04.ordnen_konzert: {"instruction": "Put the words in order to say 'I have never been to a concert.'", "correct_option": "Ich habe noch nie ein Konzert besucht", "accepted_answers": [{"value": "Ich habe noch nie ein Konzert besucht", "status": "correct"}], "feedback": "*Noch nie* comes before the object and participle."}
  de.a2.unit101.lesson05.exercise05.uebersetzen_antworten: {"instruction": "Translate into German.", "accepted_answers": [{"value": "Ich habe die Antworten noch nicht gelesen.", "status": "correct"}], "feedback": "*Noch nicht* + participle."}
  de.a2.unit101.lesson05.exercise06.diktat_nina: {"instruction": "Type what you hear.", "correct_response": "Ich bin noch nie geflogen.", "orthography_strict": true, "feedback": "You heard *Ich bin noch nie geflogen.*."}
  de.a2.unit101.lesson05.exercise07.diktat_berlin: {"instruction": "Type what you hear.", "correct_response": "Ich war schon in Berlin und in Hamburg.", "orthography_strict": true, "feedback": "You heard *Ich war schon in Berlin und in Hamburg.*."}
  de.a2.unit101.lesson06.exercise01.hoeren_frage: {"instruction": "Listen and select Anna's first question.", "correct_option": "Felix, warst du schon mal in Italien?", "distractors": ["Felix, warst du schon mal in Spanien?", "Felix, fährst du im August nach Italien?", "Anna, warst du schon mal in Italien?"], "accepted_answers": [{"value": "Felix, warst du schon mal in Italien?", "status": "correct"}], "feedback": "Anna asks *Felix, warst du schon mal in Italien?*"}
  de.a2.unit101.lesson06.exercise02.verstehen_hotel: {"instruction": "Listen to the dialogue and choose the answer.", "correct_option": "He has booked a hotel but has not packed yet.", "distractors": ["He has packed but has not booked a hotel.", "He has booked a hotel and packed.", "He has done neither."], "accepted_answers": [{"value": "He has booked a hotel but has not packed yet.", "status": "correct"}], "feedback": "Felix says he already booked a hotel, but has not packed yet."}
  de.a2.unit101.lesson06.exercise03.paare_dialog: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Ich war schon zweimal dort.", "right": "I've been there twice."}, {"left": "Hast du schon ein Hotel gebucht?", "right": "Have you booked a hotel yet?"}, {"left": "Ich habe schon ein Hotel gebucht.", "right": "I've already booked a hotel."}, {"left": "Ich habe noch nicht gepackt.", "right": "I haven't packed yet."}, {"left": "Ich habe dort schon viel Pizza gegessen.", "right": "I've eaten a lot of pizza there."}, {"left": "Ich habe noch nie Pizza in Italien gegessen.", "right": "I've never eaten pizza in Italy."}], "status": "correct"}], "feedback": "The dialogue mixes schon, noch nicht and noch nie."}
  de.a2.unit101.lesson06.exercise04.ordnen_gebucht: {"instruction": "Put the words in order to ask 'Have you booked a hotel yet?'", "correct_option": "Hast du schon ein Hotel gebucht", "accepted_answers": [{"value": "Hast du schon ein Hotel gebucht", "status": "correct"}], "feedback": "*Hast du* first, participle last."}
  de.a2.unit101.lesson06.exercise05.antwort_italien: {"instruction": "Answer in German as Felix: say no, never.", "correct_option": "Nein, noch nie.", "accepted_answers": [{"value": "Nein, noch nie.", "status": "correct"}, {"value": "Nein, ich war noch nie in Italien.", "status": "correct"}, {"value": "Nein, noch nie. Aber im August fahre ich nach Italien.", "status": "correct"}], "feedback": "*Nein, noch nie.*"}
  de.a2.unit101.lesson06.exercise06.uebersetzen_gepackt: {"instruction": "Translate into German.", "accepted_answers": [{"value": "Ich habe noch nicht gepackt.", "status": "correct"}], "feedback": "*Noch nicht* + participle."}
  de.a2.unit101.lesson06.exercise07.schreiben_dreisaetze: {"instruction": "Write three German sentences, following the three numbered instructions.", "correct_option": "Ich war schon in Berlin. Ich habe schon Sushi gegessen. Ich bin noch nie geflogen.", "accepted_answers": [{"value": "Ich war schon in Berlin. Ich habe schon Sushi gegessen. Ich bin noch nie geflogen.", "status": "correct"}], "feedback": "Three experiences: *war*, *habe schon ... gegessen*, *bin noch nie geflogen*."}
