teaching:
  de.a1.unit04.lesson01.teach.montag: {title: "Montag", gloss: "Monday", note: "*Montag* is the first day of the week in German-speaking countries, unlike the US convention where the week starts on Sunday.", example_gloss: "I have time on Monday."}
  de.a1.unit04.lesson01.teach.dienstag: {title: "Dienstag", gloss: "Tuesday", note: "*Dienstag* is the second day of the week.", example_gloss: "I have time on Tuesday."}
  de.a1.unit04.lesson01.teach.mittwoch: {title: "Mittwoch", gloss: "Wednesday", note: "*Mittwoch* literally means 'mid-week' -- it really is the middle day of the German work week.", example_gloss: "I have time on Wednesday."}
  de.a1.unit04.lesson01.teach.donnerstag: {title: "Donnerstag", gloss: "Thursday", note: "*Donnerstag* is named after the Germanic god Donar (Thor).", example_gloss: "I have time on Thursday."}
  de.a1.unit04.lesson01.teach.freitag: {title: "Freitag", gloss: "Friday", note: "*Freitag* is named after the Germanic goddess Frigg.", example_gloss: "I have time on Friday."}
  de.a1.unit04.lesson01.teach.samstag: {title: "Samstag", gloss: "Saturday", note: "*Samstag* is the standard word for Saturday in most of Germany; *Sonnabend* is a regional alternative (northern/eastern Germany).", example_gloss: "I have time on Saturday."}
  de.a1.unit04.lesson01.teach.sonntag: {title: "Sonntag", gloss: "Sunday", note: "*Sonntag* literally means 'sun day,' the same root as English 'Sunday.'", example_gloss: "I have time on Sunday."}

  de.a1.unit04.lesson02.teach.januar: {title: "Januar", gloss: "January", note: "*Januar* is the first month of the year.", example_gloss: "My birthday is in January."}
  de.a1.unit04.lesson02.teach.maerz: {title: "März", gloss: "March", note: "*März* is the third month of the year.", example_gloss: "My birthday is in March."}
  de.a1.unit04.lesson02.teach.mai: {title: "Mai", gloss: "May", note: "*Mai* is short and easy to remember -- nearly identical to English 'May.'", example_gloss: "My birthday is in May."}
  de.a1.unit04.lesson02.teach.juli: {title: "Juli", gloss: "July", note: "*Juli* is the seventh month of the year.", example_gloss: "My birthday is in July."}
  de.a1.unit04.lesson02.teach.september: {title: "September", gloss: "September", note: "*September* is spelled identically in English and German.", example_gloss: "My birthday is in September."}
  de.a1.unit04.lesson02.teach.dezember: {title: "Dezember", gloss: "December", note: "*Dezember* is the last month of the year.", example_gloss: "My birthday is in December."}

  de.a1.unit04.lesson04.teach.oeffnet: {title: "öffnet", gloss: "opens", note: "*öffnet* is the third-person singular form of *öffnen* (to open) -- used for 'it opens,' e.g. a store or library.", example_gloss: "The store opens on Monday."}
  de.a1.unit04.lesson04.teach.wieder: {title: "wieder", gloss: "again", note: "*wieder* means 'again' -- used here to ask when something reopens.", example_gloss: "The library opens again on Monday."}
  de.a1.unit04.lesson04.teach.die: {title: "die", gloss: "the (feminine/plural)", note: "*die* is the definite article for feminine singular and all plural nouns -- here it's used with the feminine noun *Bibliothek*.", example_gloss: "The library is big."}
  de.a1.unit04.lesson04.teach.bibliothek: {title: "Bibliothek", gloss: "library", note: "*Bibliothek* is a feminine noun (*die Bibliothek*).", example_gloss: "I'm going to the library."}
  de.a1.unit04.lesson04.teach.am: {title: "am", gloss: "on the / at the", note: "*am* is a contraction of *an dem*, used before days of the week and dates (*am Montag* = 'on Monday').", example_gloss: "On Monday, I work."}
  de.a1.unit04.lesson04.teach.den: {title: "den", gloss: "the (accusative/dative)", note: "*den* appears in full written dates after a weekday, as in *am Donnerstag, den neunten Juli* -- a fixed idiom worth learning as a whole rather than analyzing case-by-case at this level.", example_gloss: "We're meeting on Thursday, the ninth of July."}
  de.a1.unit04.lesson04.teach.neunten: {title: "neunten", gloss: "ninth", note: "*neunten* is the declined ordinal form of *neun* (nine), used in dates: *der neunte Juli* (nominative) becomes *den neunten Juli* in this full-date construction.", example_gloss: "My birthday is on the ninth of July."}

exercises:
  de.a1.unit04.lesson01.exercise01.listen_mittwoch:
    instruction: "Listen and select the day you hear."
    correct_option: "Mittwoch"
    distractors: ["Montag", "Freitag", "Sonntag"]
    accepted_answers: [{value: "Mittwoch", status: "correct"}]
    feedback: "*Mittwoch* means Wednesday."
  de.a1.unit04.lesson01.exercise02.choose_wochenende:
    instruction: "Which day is a weekend day?"
    correct_option: "Samstag"
    distractors: ["Montag", "Mittwoch", "Freitag"]
    accepted_answers: [{value: "Samstag", status: "correct"}]
    feedback: "*Samstag* (Saturday) is a weekend day."
  de.a1.unit04.lesson01.exercise03.match_wochentage:
    instruction: "Match each weekday to its position in the week."
    accepted_answers:
      - value:
          - {left: "1. Wochentag", right: "Montag"}
          - {left: "2. Wochentag", right: "Dienstag"}
          - {left: "3. Wochentag", right: "Mittwoch"}
          - {left: "4. Wochentag", right: "Donnerstag"}
          - {left: "5. Wochentag", right: "Freitag"}
          - {left: "6. Wochentag", right: "Samstag"}
          - {left: "7. Wochentag", right: "Sonntag"}
        status: "correct"
    feedback: "*Montag*=1st, *Dienstag*=2nd, *Mittwoch*=3rd, *Donnerstag*=4th, *Freitag*=5th, *Samstag*=6th, *Sonntag*=7th."
  de.a1.unit04.lesson01.exercise04.order_tag_frage:
    instruction: "Put the words in order to ask 'What day is it today?'"
    accepted_answers: [{value: ["Welcher", "Tag", "ist", "heute"], status: "correct"}]
    feedback: "The correct order is *Welcher Tag ist heute?*"
  de.a1.unit04.lesson01.exercise05.write_freitag:
    instruction: "Write the day that comes after Donnerstag (Thursday)."
    accepted_answers:
      - {value: "Freitag", status: "correct"}
      - {value: "Freitag.", status: "correct"}
    feedback: "*Freitag* (Friday) comes after *Donnerstag*."

  de.a1.unit04.lesson02.exercise01.listen_september:
    instruction: "Listen and select the month you hear."
    correct_option: "September"
    distractors: ["Januar", "Mai", "Dezember"]
    accepted_answers: [{value: "September", status: "correct"}]
    feedback: "*September* is the same word in English and German."
  de.a1.unit04.lesson02.exercise02.choose_sommermonat:
    instruction: "Which month is a summer month?"
    correct_option: "Juli"
    distractors: ["Januar", "März", "Dezember"]
    accepted_answers: [{value: "Juli", status: "correct"}]
    feedback: "*Juli* (July) is a summer month; *Januar* and *Dezember* are winter, *März* is spring."
  de.a1.unit04.lesson02.exercise03.match_monate:
    instruction: "Match each month to its position in the year."
    accepted_answers:
      - value:
          - {left: "1. Monat", right: "Januar"}
          - {left: "3. Monat", right: "März"}
          - {left: "5. Monat", right: "Mai"}
          - {left: "7. Monat", right: "Juli"}
          - {left: "9. Monat", right: "September"}
          - {left: "12. Monat", right: "Dezember"}
        status: "correct"
    feedback: "*Januar*=1st, *März*=3rd, *Mai*=5th, *Juli*=7th, *September*=9th, *Dezember*=12th."
  de.a1.unit04.lesson02.exercise04.order_monat_frage:
    instruction: "Put the words in order to ask 'Which month is it?'"
    accepted_answers: [{value: ["Welcher", "Monat", "ist", "es"], status: "correct"}]
    feedback: "The correct order is *Welcher Monat ist es?*"
  de.a1.unit04.lesson02.exercise05.write_dezember:
    instruction: "Write the last month of the year."
    accepted_answers:
      - {value: "Dezember", status: "correct"}
      - {value: "Dezember.", status: "correct"}
    feedback: "*Dezember* means December."

  de.a1.unit04.lesson03.exercise01.listen_wievielte:
    instruction: "Listen and select the question you hear."
    correct_option: "Der Wievielte ist heute"
    distractors: ["Welcher Tag ist heute", "Welcher Monat ist es", "Wann haben Sie Geburtstag"]
    accepted_answers: [{value: "Der Wievielte ist heute", status: "correct"}]
    feedback: "*Der Wievielte ist heute?* means 'What's today's date?'"
  de.a1.unit04.lesson03.exercise02.choose_heutiges_datum:
    instruction: "Which sentence correctly answers 'Der Wievielte ist heute?' for Tuesday, July 7th?"
    correct_option: "Heute ist Dienstag, der siebte Juli."
    distractors: ["Heute ist Montag, der siebte Juli.", "Heute ist Dienstag, der neunte Juli.", "Heute ist Dienstag, der dritte März."]
    accepted_answers: [{value: "Heute ist Dienstag, der siebte Juli.", status: "correct"}]
    feedback: "*Heute ist Dienstag, der siebte Juli* = 'Today is Tuesday, July 7th.'"
  de.a1.unit04.lesson03.exercise03.order_geburtstag_frage:
    instruction: "Put the words in order to formally ask 'When is your birthday?'"
    accepted_answers: [{value: ["Wann", "haben", "Sie", "Geburtstag"], status: "correct"}]
    feedback: "The correct order is *Wann haben Sie Geburtstag?*"
  de.a1.unit04.lesson03.exercise04.reply_geburtstag:
    instruction: "Felix asks: Wann haben Sie Geburtstag? Reply as Anna: your birthday is March 3rd."
    accepted_answers:
      - {value: "Mein Geburtstag ist der dritte März.", status: "correct"}
      - {value: "Mein Geburtstag ist der dritte März", status: "correct"}
    feedback: "*Mein Geburtstag ist der dritte März* = 'My birthday is March 3rd.'"
  de.a1.unit04.lesson03.exercise05.write_heutiges_datum:
    instruction: "Write today's date in words: July 7th."
    accepted_answers:
      - {value: "der siebte Juli", status: "correct"}
      - {value: "der siebte Juli.", status: "correct"}
    feedback: "*der siebte Juli* means 'July 7th.'"

  de.a1.unit04.lesson04.exercise01.listen_heutiges_datum:
    instruction: "Listen to the dialogue. What date does Anna say it is today?"
    correct_option: "Heute ist Dienstag, der siebte Juli"
    distractors: ["Der Wievielte ist heute", "Wann öffnet die Bibliothek wieder", "Heute ist Mittwoch, der achte Juli"]
    accepted_answers: [{value: "Heute ist Dienstag, der siebte Juli", status: "correct"}]
