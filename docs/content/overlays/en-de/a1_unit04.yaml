  de.a1.unit04.lesson04.exercise02.listen_wiedereroeffnung:
    instruction: "Listen again. When does the library reopen?"
    correct_option: "Sie öffnet wieder am Donnerstag, den neunten Juli"
    distractors: ["Heute ist Montag, der siebte Juli", "Der Wievielte ist heute", "Gut, bis Donnerstag"]
    accepted_answers: [{value: "Sie öffnet wieder am Donnerstag, den neunten Juli", status: "correct"}]
    feedback: "*Sie öffnet wieder am Donnerstag, den neunten Juli* -- 'It opens again on Thursday, July 9th.'"
  de.a1.unit04.lesson04.exercise03.choose_wiedereroeffnung:
    instruction: "When does the library open again?"
    correct_option: "Donnerstag, den neunten Juli"
    distractors: ["Dienstag, der siebte Juli", "Montag, den ersten Juli", "Freitag, den zehnten Juli"]
    accepted_answers: [{value: "Donnerstag, den neunten Juli", status: "correct"}]
    feedback: "The library reopens *Donnerstag, den neunten Juli* -- Thursday, July 9th."
  de.a1.unit04.lesson04.exercise04.order_bibliothek_frage:
    instruction: "Put the words in order to ask 'When does the library open again?'"
    accepted_answers: [{value: ["Wann", "öffnet", "die", "Bibliothek", "wieder"], status: "correct"}]
    feedback: "The correct order is *Wann öffnet die Bibliothek wieder?*"
  de.a1.unit04.lesson04.exercise05.read_notiz:
    instruction: "Read the note posted on the library door. When does it reopen?"
    correct_option: "Donnerstag, den neunten Juli"
    distractors: ["Montag, den ersten Juli", "Dienstag, den siebten Juli", "Freitag, den zehnten Juli"]
    accepted_answers: [{value: "Donnerstag, den neunten Juli", status: "correct"}]
    feedback: "The note reads *Geschlossen bis Donnerstag, den neunten Juli* -- 'Closed until Thursday, July 9th.'"
  de.a1.unit04.lesson04.exercise06.reply_als_anna:
    instruction: "Felix asks: Der Wievielte ist heute? Wann öffnet die Bibliothek wieder? Reply as Anna: give today's date, then say when the library reopens."
    accepted_answers:
      - {value: "Heute ist Dienstag, der siebte Juli. Sie öffnet wieder am Donnerstag, den neunten Juli.", status: "correct"}
      - {value: "Heute ist Dienstag, der siebte Juli, und sie öffnet wieder am Donnerstag, den neunten Juli.", status: "correct"}
      - {value: "Heute ist Dienstag, der siebte Juli Sie öffnet wieder am Donnerstag den neunten Juli", status: "correct"}
