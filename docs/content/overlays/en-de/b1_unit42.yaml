  de.b1.unit42.lesson03.exercise03.listen_dialogue_cafe: {instruction: "Listen to the dialogue. Which sentence describes a habitual routine, and which describes a single past event?", correct_option: "Habitual: Felix always drinks coffee on break; single event: Anna's brother came by yesterday.", distractors: ["Habitual: Anna's brother visits every day; single event: Felix drank coffee once.", "Habitual: Felix's brother visits; single event: Anna drank coffee yesterday.", "Habitual: Anna always drinks coffee; single event: Felix's brother came by."], accepted_answers: [{value: "Habitual: Felix always drinks coffee on break; single event: Anna's brother came by yesterday.", status: "correct"}], feedback: "Felix says *Wenn ich Pause habe, trinke ich immer Kaffee* (habitual); Anna says *Als ich gestern Pause hatte, kam mein Bruder vorbei* (single event)."}
