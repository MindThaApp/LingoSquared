  de.b1.unit42.lesson01.exercise02.recognize_wenn_immer_kaffee: {instruction: "Which German sentence means \"Whenever I have a break, I always drink coffee.\"?", correct_option: "Wenn ich Pause habe, trinke ich immer Kaffee.", distractors: ["Als ich Pause hatte, trank ich immer Kaffee.", "Wenn ich Pause habe, trinke ich manchmal Kaffee.", "Ich trinke immer Kaffee, wenn ich keine Pause habe."], accepted_answers: [{value: "Wenn ich Pause habe, trinke ich immer Kaffee.", status: "correct"}], feedback: "*immer* reinforces that this is a repeated habit, not a one-time event."}
  de.b1.unit42.lesson01.exercise03.listen_select_wenn_habituell: {instruction: "Listen. Is this describing a one-time past event or a habitual/repeated present routine?", correct_option: "A habitual/repeated present routine.", distractors: ["A one-time past event.", "A future plan.", "A request."], accepted_answers: [{value: "A habitual/repeated present routine.", status: "correct"}], feedback: "The recording says *Wenn ich Pause habe, trinke ich Kaffee* — wenn + present tense marks a habit."}
  de.b1.unit42.lesson01.exercise04.match_wenn_habituell:
    instruction: "Match each German word or phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "Wenn ich Pause habe, ...", right: "Whenever I have a break, ..."}
          - {left: "trinke ich Kaffee", right: "I drink coffee"}
          - {left: "immer", right: "always"}
