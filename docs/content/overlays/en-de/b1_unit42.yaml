course:
  title: "German B1"
  description: "Learn B1-level German for describing when one event happens relative to another, distinguishing a habitual/repeated present time clause (wenn) from a single completed past event (als)."

units:
  de.b1.unit42.zeitablauf: {title: "Sequence of events"}

lessons:
  de.b1.unit42.lesson01.wenn_habituell: {title: "Whenever I have a break, ..."}
  de.b1.unit42.lesson02.als_einmalig: {title: "When I had a break (once), ..."}
  de.b1.unit42.lesson03.cafe_dialogue: {title: "Dialogue: a break at the cafe"}

teaching:
  de.b1.unit42.lesson01.teach.wenn_pause_kaffee: {title: "Wenn ich Pause habe, trinke ich Kaffee.", gloss: "Whenever I have a break, I drink coffee.", note: "*wenn* + present tense marks a habitual/repeated time clause — this happens every time the condition holds.", example_gloss: "Habit: Whenever I have a break, I drink coffee."}
  de.b1.unit42.lesson01.teach.wenn_immer_kaffee: {title: "Wenn ich Pause habe, trinke ich immer Kaffee.", gloss: "Whenever I have a break, I always drink coffee.", note: "Adding *immer* (\"always\") reinforces that this is a repeated, not one-time, habit.", example_gloss: "Habit: Whenever I have a break, I always drink coffee."}
  de.b1.unit42.lesson02.teach.als_pause_bruder: {title: "Als ich gestern Pause hatte, kam mein Bruder vorbei.", gloss: "When I had a break yesterday, my brother came by.", note: "*als* + past tense marks a single, one-time completed past event — unlike wenn, it cannot describe a repeated habit.", example_gloss: "Single event: When I had a break yesterday, my brother came by."}
  de.b1.unit42.lesson02.teach.als_felix_vorbei: {title: "Als ich gestern Pause hatte, kam Felix vorbei.", gloss: "When I had a break yesterday, Felix came by.", note: "Another single, one-time past event with als — this happened once, on a specific yesterday.", example_gloss: "Single event: When I had a break yesterday, Felix came by."}
  de.b1.unit42.lesson03.teach.felix_habit: {title: "Felix states his habit", gloss: "Felix: Whenever I have a break, I always drink coffee.", note: "Felix opens with the habitual wenn-clause from lesson01."}
  de.b1.unit42.lesson03.teach.anna_agree: {title: "Anna agrees and adds a past event", gloss: "Anna: Me too! When I had a break yesterday, my brother came by.", note: "Anna agrees, then shifts to a single past event with als, contrasting the two connectors."}
  de.b1.unit42.lesson03.teach.felix_react: {title: "Felix reacts", gloss: "Felix: Really? That's nice.", note: "A short reaction closing the exchange."}

exercises:
