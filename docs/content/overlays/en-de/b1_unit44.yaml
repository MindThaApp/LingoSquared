course:
  title: "German B1"
  description: "Learn B1-level German for explaining the purpose behind an action, contrasting a same-subject purpose clause (um...zu) with a different-subject one (damit)."

units:
  de.b1.unit44.ziele: {title: "Goals"}

lessons:
  de.b1.unit44.lesson01.um_zu: {title: "..., in order to work"}
  de.b1.unit44.lesson02.damit: {title: "..., so that Anna understands"}
  de.b1.unit44.lesson03.cafe_dialogue: {title: "Dialogue: why are you learning German?"}

teaching:
  de.b1.unit44.lesson01.teach.anna_lernt_um_zu: {title: "Anna lernt Deutsch, um im Büro zu arbeiten.", gloss: "Anna is learning German in order to work in an office.", note: "*um...zu* + infinitive states a purpose clause where the subject of the purpose (working) is the SAME as the main clause's subject (Anna).", example_gloss: "Goal: Anna is learning German in order to work in an office."}
  de.b1.unit44.lesson01.teach.anna_spart_um_zu: {title: "Anna spart Geld, um eine Reise zu machen.", gloss: "Anna is saving money in order to take a trip.", note: "Another same-subject purpose clause with um...zu — Anna is both the one saving and the one who will travel.", example_gloss: "Goal: Anna is saving money in order to take a trip."}
  de.b1.unit44.lesson02.teach.felix_spricht_damit: {title: "Felix spricht langsam, damit Anna ihn versteht.", gloss: "Felix speaks slowly so that Anna understands him.", note: "*damit* introduces a purpose clause where the subject of the purpose (Anna understanding) is DIFFERENT from the main clause's subject (Felix speaking) — um...zu cannot be used here.", example_gloss: "Goal: Felix speaks slowly so that Anna understands him."}
  de.b1.unit44.lesson02.teach.felix_schreibt_damit: {title: "Felix schreibt es auf, damit Anna es nicht vergisst.", gloss: "Felix writes it down so that Anna doesn't forget it.", note: "Another different-subject purpose clause with damit — Felix writes, but Anna is the one who benefits by not forgetting.", example_gloss: "Goal: Felix writes it down so that Anna doesn't forget it."}
  de.b1.unit44.lesson03.teach.felix_ask_warum: {title: "Felix asks why", gloss: "Felix: Why are you learning German?", note: "This sets up Anna's two-part purpose answer."}
  de.b1.unit44.lesson03.teach.anna_answer_um_zu: {title: "Anna gives a same-subject purpose", gloss: "Anna: I'm learning German in order to work in an office.", note: "Anna answers with the um...zu purpose clause from lesson01."}
  de.b1.unit44.lesson03.teach.anna_answer_damit: {title: "Anna gives a different-subject purpose", gloss: "Anna: And I speak slowly so that you understand me well.", note: "Anna continues with a damit purpose clause, since the benefit (Felix understanding) applies to a different person than the one speaking (Anna)."}
  de.b1.unit44.lesson03.teach.felix_react: {title: "Felix reacts", gloss: "Felix: I understand that well!", note: "A short reaction closing the exchange."}

exercises:
  de.b1.unit44.lesson01.exercise01.recognize_anna_lernt_um_zu: {instruction: "Which German sentence means \"Anna is learning German in order to work in an office.\"?", correct_option: "Anna lernt Deutsch, um im Büro zu arbeiten.", distractors: ["Anna lernt Deutsch, damit Felix im Büro arbeitet.", "Anna arbeitet im Büro, um Deutsch zu lernen.", "Anna lernt Deutsch, um eine Reise zu machen."], accepted_answers: [{value: "Anna lernt Deutsch, um im Büro zu arbeiten.", status: "correct"}], feedback: "*um...zu* states a purpose clause whose subject (Anna working) is the same as the main clause's subject."}
  de.b1.unit44.lesson01.exercise02.recognize_anna_spart_um_zu: {instruction: "Which German sentence means \"Anna is saving money in order to take a trip.\"?", correct_option: "Anna spart Geld, um eine Reise zu machen.", distractors: ["Anna macht eine Reise, um Geld zu sparen.", "Anna spart Geld, damit Felix eine Reise macht.", "Anna spart Geld, um im Büro zu arbeiten."], accepted_answers: [{value: "Anna spart Geld, um eine Reise zu machen.", status: "correct"}], feedback: "*um eine Reise zu machen* names Anna's own purpose for saving."}
  de.b1.unit44.lesson01.exercise03.listen_select_um_zu: {instruction: "Listen. What is Anna doing, and what is her purpose for doing it?", correct_option: "She is learning German in order to work in an office.", distractors: ["She is working in an office in order to learn German.", "She is learning German in order to travel.", "She is saving money in order to work in an office."], accepted_answers: [{value: "She is learning German in order to work in an office.", status: "correct"}], feedback: "The recording says *Anna lernt Deutsch, um im Büro zu arbeiten*."}
  de.b1.unit44.lesson01.exercise04.match_um_zu:
    instruction: "Match each German word or phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "Anna lernt Deutsch, um ...", right: "Anna is learning German, in order to ..."}
          - {left: "im Büro zu arbeiten", right: "to work in an office"}
          - {left: "Anna spart Geld, um ...", right: "Anna is saving money, in order to ..."}
          - {left: "eine Reise zu machen", right: "to take a trip"}
          - {left: "sparen", right: "to save"}
          - {left: "das Geld", right: "the money"}
        status: "correct"
    feedback: "These pieces build two same-subject purpose-clause sentences with um...zu."
  de.b1.unit44.lesson01.exercise05.order_anna_lernt_um_zu: {instruction: "Put the words in order to say \"Anna is learning German in order to work in an office.\"", accepted_answers: [{value: ["Anna", "lernt", "Deutsch,", "um", "im", "Büro", "zu", "arbeiten"], status: "correct"}], feedback: "The correct order is *Anna lernt Deutsch, um im Büro zu arbeiten*."}
  de.b1.unit44.lesson01.exercise06.write_anna_lernt_um_zu:
    instruction: "Write exactly this purpose-clause sentence with um...zu, where Anna is both the one learning and the one working: Anna is learning German in order to work in an office."
    accepted_answers:
      - {value: "Anna lernt Deutsch, um im Büro zu arbeiten.", status: "correct"}
      - {value: "Anna lernt Deutsch, um im Büro zu arbeiten", status: "correct"}
      - {value: "Anna lernt Deutsch um im Büro zu arbeiten.", status: "correct"}
      - {value: "Anna lernt Deutsch um im Büro zu arbeiten", status: "correct"}
    feedback: "The model answer is *Anna lernt Deutsch, um im Büro zu arbeiten*."
  de.b1.unit44.lesson02.exercise01.recognize_felix_spricht_damit: {instruction: "Which German sentence means \"Felix speaks slowly so that Anna understands him.\"?", correct_option: "Felix spricht langsam, damit Anna ihn versteht.", distractors: ["Felix spricht langsam, um Anna zu verstehen.", "Anna spricht langsam, damit Felix sie versteht.", "Felix spricht langsam, damit er Anna versteht."], accepted_answers: [{value: "Felix spricht langsam, damit Anna ihn versteht.", status: "correct"}], feedback: "*damit* is required because the purpose clause's subject (Anna understanding) differs from the main clause's subject (Felix speaking)."}
  de.b1.unit44.lesson02.exercise02.recognize_felix_schreibt_damit: {instruction: "Which German sentence means \"Felix writes it down so that Anna doesn't forget it.\"?", correct_option: "Felix schreibt es auf, damit Anna es nicht vergisst.", distractors: ["Felix schreibt es auf, um es nicht zu vergessen.", "Anna schreibt es auf, damit Felix es nicht vergisst.", "Felix vergisst es, damit Anna es aufschreibt."], accepted_answers: [{value: "Felix schreibt es auf, damit Anna es nicht vergisst.", status: "correct"}], feedback: "Felix writes it down, but Anna is the one who benefits — a different-subject purpose clause needs damit."}
  de.b1.unit44.lesson02.exercise03.listen_select_damit: {instruction: "Listen. What is Felix doing, and for whose benefit is he doing it?", correct_option: "He is speaking slowly so that Anna understands him.", distractors: ["He is speaking slowly so that he understands Anna.", "He is writing slowly so that Anna understands him.", "He is speaking slowly so that Anna can write it down."], accepted_answers: [{value: "He is speaking slowly so that Anna understands him.", status: "correct"}], feedback: "The recording says *Felix spricht langsam, damit Anna ihn versteht*."}
