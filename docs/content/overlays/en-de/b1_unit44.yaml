    feedback: "The model answer is *Felix spricht langsam, damit Anna ihn versteht*."
  de.b1.unit44.lesson03.exercise01.choose_anna_um_zu: {instruction: "Why does Anna say she is learning German?", correct_option: "In order to work in an office.", distractors: ["In order to take a trip.", "In order to speak with Felix.", "In order to save money."], accepted_answers: [{value: "In order to work in an office.", status: "correct"}], feedback: "Anna says *Ich lerne Deutsch, um im Büro zu arbeiten*."}
  de.b1.unit44.lesson03.exercise02.choose_anna_damit: {instruction: "Why does Anna say she speaks slowly to Felix?", correct_option: "So that he understands her well.", distractors: ["So that she understands him well.", "So that he can write it down.", "So that she can practice German."], accepted_answers: [{value: "So that he understands her well.", status: "correct"}], feedback: "Anna says *Ich spreche langsam, damit Sie mich gut verstehen*."}
  de.b1.unit44.lesson03.exercise03.listen_dialogue_ziele: {instruction: "Listen to the dialogue. What does Anna say her purpose is for learning German?", correct_option: "To work in an office.", distractors: ["To take a trip.", "To talk to Felix.", "To read German books."], accepted_answers: [{value: "To work in an office.", status: "correct"}], feedback: "Anna says *Ich lerne Deutsch, um im Büro zu arbeiten*."}
