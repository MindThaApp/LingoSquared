          - {left: "verstehen", right: "to understand"}
        status: "correct"
    feedback: "These pieces build two different-subject purpose-clause sentences with damit."
  de.b1.unit44.lesson02.exercise05.order_felix_spricht_damit: {instruction: "Put the words in order to say \"Felix speaks slowly so that Anna understands him.\"", accepted_answers: [{value: ["Felix", "spricht", "langsam,", "damit", "Anna", "ihn", "versteht"], status: "correct"}], feedback: "The correct order is *Felix spricht langsam, damit Anna ihn versteht*."}
