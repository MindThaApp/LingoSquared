review: {"status": "unreviewed", "required_next_reviewer": "native_speaker_review", "notes": "English overlay for the permission and rules unit (duerfen, muessen, nicht muessen, nicht brauchen zu). OPEN NATIVE QUESTIONS: none beyond the realization notes."}
course:
  title: "German A2"
  description: "Grammar-led A2 German continuing the Anna and Felix storyline."
  learning_goal: "Make predictions, follow rules, state what you can do, ask politely, give advice and talk about habits in German."
units:
  de.a2.unit104.erlaubnis_regeln: {"title": "May I Do That?", "description": "Ask whether something is allowed and state rules with dürfen, müssen and nicht brauchen zu, and tell apart 'not allowed' from 'not necessary'."}
lessons:
  de.a2.unit104.lesson01.darf_ich: {"title": "May I Sit Here?"}
  de.a2.unit104.lesson02.muessen: {"title": "You Have To"}
  de.a2.unit104.lesson03.nicht_muessen: {"title": "Not Allowed, Not Necessary"}
  de.a2.unit104.lesson04.fragen_antworten: {"title": "Asking and Answering"}
  de.a2.unit104.lesson05.regeln_lesen: {"title": "The Rules in the Flat"}
  de.a2.unit104.lesson06.am_telefon: {"title": "Jonas Asks Felix"}
teaching:
  de.a2.unit104.lesson01.teach.hier: {"title": "Asking and rules", "gloss": "to ask / here / to sit / to park / to smoke / to phone / to take photos / one, you (in general)", "example_gloss": ["May I sit here?", "You may park here.", "You may not smoke here.", "May I make a phone call here?"], "note": "*Man* means people in general: a rule for everybody."}
  de.a2.unit104.lesson01.teach.gn_duerfen: {"title": "Dürfen: to be allowed", "gloss": "I may, you may, he may, we may, you (plural) may, they may", "note": "*Dürfen* is irregular in the singular: *darf*, *darfst*, *darf*. The plural has the umlaut: *dürfen*, *dürft*."}
  de.a2.unit104.lesson01.teach.gn_frage: {"title": "Asking permission", "gloss": "May I sit here? Yes, you may. No, you may not.", "note": "A question starts with the verb *darf*. The infinitive stands at the end."}
  de.a2.unit104.lesson01.teach.gn_man: {"title": "Rules with man", "gloss": "You may park here. You may not smoke here.", "note": "*Man darf* states a general rule. *Nicht* comes before the infinitive."}
  de.a2.unit104.lesson02.teach.regeln: {"title": "House rules", "gloss": "rule / to take off / shoes / quiet / to tidy up / rubbish / in the flat", "example_gloss": ["In the flat you have to take your shoes off.", "We have to be quiet.", "I have to tidy up.", "He has to separate the rubbish.", "Anna and Nina have to tidy up."], "note": "*Ausziehen* and *aufräumen* are separable; after *müssen* they stay together at the end."}
  de.a2.unit104.lesson02.teach.gn_muessen: {"title": "Müssen: to have to", "gloss": "I must, you must, he must, we must, you (plural) must, they must", "note": "Like *dürfen*, *müssen* has no ending in *ich* and *er*: *ich muss*, *er muss*."}
  de.a2.unit104.lesson02.teach.gn_klammer: {"title": "Modal verb second, infinitive last", "gloss": "You have to take your shoes off. We have to be quiet.", "note": "The modal verb is second. Everything else stands between it and the infinitive at the end."}
  de.a2.unit104.lesson02.teach.gn_wohnung: {"title": "A place first", "gloss": "In the flat you have to be quiet.", "note": "If *in der Wohnung* comes first, the verb *muss* is still second and *man* follows."}
  de.a2.unit104.lesson03.teach.verboten: {"title": "Allowed and forbidden", "gloss": "allowed / forbidden / to pay / every day / today", "example_gloss": ["Smoking is forbidden.", "Taking photos is allowed.", "You don't have to pay here.", "You don't have to tidy up every day."], "note": "*Rauchen* and *fotografieren* can be used as nouns: *Rauchen ist verboten*."}
  de.a2.unit104.lesson03.teach.gn_kontrast: {"title": "Not allowed is not the same as not necessary", "gloss": "You may not smoke here. You don't have to pay here.", "note": "*Nicht dürfen* means it is forbidden. *Nicht müssen* means it is not necessary, but you may do it if you like."}
  de.a2.unit104.lesson03.teach.gn_brauchen: {"title": "Nicht brauchen zu", "gloss": "You don't need to come. You don't need to tidy up today.", "note": "*Nicht brauchen zu* + infinitive means the same as *nicht müssen*. With a separable verb, *zu* goes inside: *aufzuräumen*."}
  de.a2.unit104.lesson03.teach.gn_adjektiv: {"title": "Rules as short sentences", "gloss": "Smoking is forbidden. Taking photos is allowed.", "note": "*Verboten* and *erlaubt* tell you the rule without a modal verb."}
  de.a2.unit104.lesson04.teach.fenster: {"title": "Polite answers", "gloss": "window / to open / a friend / to bring along / of course / unfortunately", "example_gloss": ["May I open the window?", "Yes, of course.", "May I bring a friend?", "Unfortunately that is not allowed."], "note": "*Mitbringen* is separable and stays together as an infinitive."}
  de.a2.unit104.lesson04.teach.gn_frage: {"title": "Question and short answer", "gloss": "May I open the window? Yes, of course. No, unfortunately not.", "note": "Answer with *ja, natürlich* or soften a no with *leider*."}
  de.a2.unit104.lesson04.teach.gn_antwort: {"title": "Longer answers", "gloss": "Yes, you may. No, you may not. Unfortunately that is not allowed.", "note": "*Das darfst du* repeats the modal verb from the question. The object *das* comes first."}
  de.a2.unit104.lesson04.teach.gn_regeln: {"title": "Three rules", "gloss": "You have to take your shoes off. You may not smoke. You don't have to be quiet.", "note": "One must, one may not, one need not: three different rules."}
  de.a2.unit104.lesson05.teach.wohnen: {"title": "Words for the story", "gloss": "to live / now / at (someone's place) / to explain / in the evening / friends / on a visit / to come / but", "example_gloss": ["Jonas now lives with Felix.", "Felix explains the rules.", "In the evening you have to be quiet.", "Friends may visit."], "note": "*Zu Besuch kommen* = to come for a visit."}
  de.a2.unit104.lesson05.teach.gn_text: {"title": "Must and must not in one sentence", "gloss": "You don't have to tidy up every day, but you have to separate the rubbish.", "note": "*Aber* joins two rules. Read for *muss*, *muss nicht* and *darf nicht*."}
  de.a2.unit104.lesson05.teach.lesen_regeln: {"title": "The rules", "gloss": "Jonas now lives with Felix. Felix explains the rules. In the flat you have to take off your shoes. You may not smoke. In the evening you have to be quiet. You don't have to tidy up every day, but you have to separate the rubbish. Friends may visit.", "note": "Six rules: two things you must do, one forbidden, one not necessary, one allowed."}
  de.a2.unit104.lesson06.teach.jonas_fenster: {"title": "Jonas asks", "gloss": "Jonas: Hi Felix! May I open the window?"}
  de.a2.unit104.lesson06.teach.felix_ja: {"title": "Felix answers", "gloss": "Felix: Yes, of course. But in the evening you have to be quiet."}
  de.a2.unit104.lesson06.teach.jonas_freund: {"title": "Jonas asks again", "gloss": "Jonas: May I bring a friend?"}
  de.a2.unit104.lesson06.teach.felix_freunde: {"title": "Felix explains", "gloss": "Felix: Yes, friends may visit. But smoking is forbidden."}
  de.a2.unit104.lesson06.teach.jonas_rauche: {"title": "Jonas asks about tidying", "gloss": "Jonas: I don't smoke. Do I have to tidy up?"}
  de.a2.unit104.lesson06.teach.felix_muell: {"title": "Felix reassures him", "gloss": "Felix: You don't have to tidy up every day. You only need to separate the rubbish."}
exercises:
  de.a2.unit104.lesson01.exercise01.wahl_sitzen: {"instruction": "Choose the correct German sentence.", "correct_option": "Darf ich hier sitzen?", "distractors": ["Dürfe ich hier sitzen?", "Darf ich hier gesessen?", "Darf hier ich sitzen?"], "accepted_answers": [{"value": "Darf ich hier sitzen?", "status": "correct"}], "feedback": "*Darf ich ... sitzen?*"}
  de.a2.unit104.lesson01.exercise02.wahl_parken: {"instruction": "Choose the correct German sentence.", "correct_option": "Hier darfst du nicht parken.", "distractors": ["Hier darf du nicht parken.", "Hier du darfst nicht parken.", "Hier darfst du parken nicht."], "accepted_answers": [{"value": "Hier darfst du nicht parken.", "status": "correct"}], "feedback": "With *du* the form is *darfst*."}
  de.a2.unit104.lesson01.exercise03.paare_formen: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "ich darf", "right": "I may"}, {"left": "du darfst", "right": "you may"}, {"left": "er darf", "right": "he may"}, {"left": "wir dürfen", "right": "we may"}, {"left": "ihr dürft", "right": "you (plural) may"}, {"left": "sie dürfen", "right": "they may"}], "status": "correct"}], "feedback": "Singular: darf, darfst, darf. Plural: dürfen, dürft, dürfen."}
  de.a2.unit104.lesson01.exercise04.ordnen_foto: {"instruction": "Put the words in order to say 'May we take photos here?'", "correct_option": "Dürfen wir hier fotografieren", "accepted_answers": [{"value": "Dürfen wir hier fotografieren", "status": "correct"}], "feedback": "With *wir* the form is *dürfen*."}
  de.a2.unit104.lesson01.exercise05.luecke_darf: {"instruction": "Complete with the correct form of dürfen.", "correct_option": "Darf", "accepted_answers": [{"value": "Darf", "status": "correct"}], "feedback": "A question starts with the verb."}
  de.a2.unit104.lesson01.exercise06.uebersetzen_rauchen: {"instruction": "Translate into German.", "accepted_answers": [{"value": "Hier darf man nicht rauchen.", "status": "correct"}, {"value": "Man darf hier nicht rauchen.", "status": "correct"}, {"value": "Du darfst hier nicht rauchen.", "status": "correct"}, {"value": "Hier darfst du nicht rauchen.", "status": "correct"}], "feedback": "*Man darf nicht* states a rule."}
  de.a2.unit104.lesson01.exercise07.schreiben_parken: {"instruction": "Write the requested German sentence.", "correct_option": "Darf ich hier parken?", "accepted_answers": [{"value": "Darf ich hier parken?", "status": "correct"}], "feedback": "*Darf ich hier parken?*"}
  de.a2.unit104.lesson02.exercise01.wahl_schuhe: {"instruction": "Choose the correct German sentence.", "correct_option": "Du musst die Schuhe ausziehen.", "distractors": ["Du muss die Schuhe ausziehen.", "Du musst die Schuhe ausgezogen.", "Du musst ausziehen die Schuhe."], "accepted_answers": [{"value": "Du musst die Schuhe ausziehen.", "status": "correct"}], "feedback": "*Musst* + infinitive at the end."}
  de.a2.unit104.lesson02.exercise02.wahl_leise: {"instruction": "Choose the correct German sentence.", "correct_option": "Wir müssen leise sein.", "distractors": ["Wir müssen leise sind.", "Wir muss leise sein.", "Wir müssen sein leise."], "accepted_answers": [{"value": "Wir müssen leise sein.", "status": "correct"}, {"value": "Wir muessen leise sein.", "status": "correct"}], "feedback": "*Wir müssen ... sein.*"}
  de.a2.unit104.lesson02.exercise03.paare_muessen: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Ich muss aufräumen.", "right": "I have to tidy up."}, {"left": "Du musst leise sein.", "right": "You have to be quiet."}, {"left": "Er muss den Müll trennen.", "right": "He has to separate the rubbish."}, {"left": "Wir müssen die Schuhe ausziehen.", "right": "We have to take our shoes off."}, {"left": "Ihr müsst leise sein.", "right": "You (plural) have to be quiet."}, {"left": "Anna und Nina müssen aufräumen.", "right": "Anna and Nina have to tidy up."}], "status": "correct"}], "feedback": "müssen: muss, musst, muss, müssen, müsst, müssen."}
  de.a2.unit104.lesson02.exercise04.ordnen_wohnung: {"instruction": "Put the words in order to say 'In the flat you have to be quiet.'", "correct_option": "In der Wohnung muss man leise sein", "accepted_answers": [{"value": "In der Wohnung muss man leise sein", "status": "correct"}, {"value": "Man muss in der Wohnung leise sein", "status": "correct"}], "feedback": "*Muss man* after the place."}
  de.a2.unit104.lesson02.exercise05.luecke_muessen: {"instruction": "Complete with the correct modal verb.", "correct_option": "müssen", "accepted_answers": [{"value": "müssen", "status": "correct"}, {"value": "muessen", "status": "correct"}], "feedback": "*Wir müssen*."}
  de.a2.unit104.lesson02.exercise06.uebersetzen_aufraeumen: {"instruction": "Translate into German.", "accepted_answers": [{"value": "Anna und Nina müssen aufräumen.", "status": "correct"}, {"value": "Anna und Nina muessen aufraeumen.", "status": "correct"}], "feedback": "Plural subject, so *müssen*."}
  de.a2.unit104.lesson02.exercise07.schreiben_schuhe: {"instruction": "Write the requested German sentence.", "correct_option": "Du musst die Schuhe ausziehen.", "accepted_answers": [{"value": "Du musst die Schuhe ausziehen.", "status": "correct"}, {"value": "Man muss die Schuhe ausziehen.", "status": "correct"}], "feedback": "*Musst* second, *ausziehen* last."}
  de.a2.unit104.lesson03.exercise01.wahl_nicht_muessen: {"instruction": "Choose the correct German sentence.", "correct_option": "Du musst nicht kommen.", "distractors": ["Du darfst nicht kommen.", "Du musst nicht gekommen.", "Du nicht musst kommen."], "accepted_answers": [{"value": "Du musst nicht kommen.", "status": "correct"}], "feedback": "*Nicht müssen* = not necessary. *Nicht dürfen* would mean forbidden."}
  de.a2.unit104.lesson03.exercise02.wahl_nicht_duerfen: {"instruction": "Choose the correct German sentence.", "correct_option": "Hier darfst du nicht rauchen.", "distractors": ["Hier musst du nicht rauchen.", "Hier brauchst du nicht rauchen zu.", "Hier darfst du nicht zu rauchen."], "accepted_answers": [{"value": "Hier darfst du nicht rauchen.", "status": "correct"}], "feedback": "Forbidden: *darfst nicht*."}
  de.a2.unit104.lesson03.exercise03.paare_kontrast: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Man darf hier nicht rauchen.", "right": "You may not smoke here."}, {"left": "Man muss hier nicht zahlen.", "right": "You don't have to pay here."}, {"left": "Rauchen ist verboten.", "right": "Smoking is forbidden."}, {"left": "Fotografieren ist erlaubt.", "right": "Taking photos is allowed."}, {"left": "Du brauchst nicht aufzuräumen.", "right": "You don't need to tidy up."}, {"left": "Du brauchst nicht zu kommen.", "right": "You don't need to come."}], "status": "correct"}], "feedback": "Forbidden versus not necessary."}
  de.a2.unit104.lesson03.exercise04.ordnen_brauchen: {"instruction": "Put the words in order to say 'You don't need to come.'", "correct_option": "Du brauchst nicht zu kommen", "accepted_answers": [{"value": "Du brauchst nicht zu kommen", "status": "correct"}], "feedback": "*Zu* stands directly before the infinitive."}
  de.a2.unit104.lesson03.exercise05.luecke_zu: {"instruction": "Complete the sentence.", "correct_option": "zu", "accepted_answers": [{"value": "zu", "status": "correct"}], "feedback": "After *brauchen* the infinitive needs *zu*."}
  de.a2.unit104.lesson03.exercise06.uebersetzen_verboten: {"instruction": "Translate into German.", "accepted_answers": [{"value": "Hier ist Rauchen verboten.", "status": "correct"}, {"value": "Rauchen ist hier verboten.", "status": "correct"}], "feedback": "*Verboten* = forbidden."}
  de.a2.unit104.lesson03.exercise07.schreiben_zahlen: {"instruction": "Write the requested German sentence.", "correct_option": "Hier musst du nicht zahlen.", "accepted_answers": [{"value": "Hier musst du nicht zahlen.", "status": "correct"}, {"value": "Du musst hier nicht zahlen.", "status": "correct"}, {"value": "Man muss hier nicht zahlen.", "status": "correct"}, {"value": "Hier brauchst du nicht zu zahlen.", "status": "correct"}, {"value": "Du brauchst hier nicht zu zahlen.", "status": "correct"}], "feedback": "*Nicht müssen* = not necessary."}
  de.a2.unit104.lesson04.exercise01.wahl_fenster: {"instruction": "Choose the correct German sentence.", "correct_option": "Darf ich das Fenster öffnen?", "distractors": ["Darf ich das Fenster öffne?", "Darf ich öffnen das Fenster?", "Darf ich das Fenster geöffnet?"], "accepted_answers": [{"value": "Darf ich das Fenster öffnen?", "status": "correct"}, {"value": "Darf ich das Fenster oeffnen?", "status": "correct"}], "feedback": "*Öffnen* at the end."}
  de.a2.unit104.lesson04.exercise02.wahl_freund: {"instruction": "Choose the correct German sentence.", "correct_option": "Darf ich einen Freund mitbringen?", "distractors": ["Darf ich einen Freund mitzubringen?", "Darf ich mitbringen einen Freund?", "Darf ich einen Freund bringe mit?"], "accepted_answers": [{"value": "Darf ich einen Freund mitbringen?", "status": "correct"}], "feedback": "*Mitbringen* stays together at the end."}
  de.a2.unit104.lesson04.exercise03.paare_antworten: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Darf ich das Fenster öffnen?", "right": "May I open the window?"}, {"left": "Ja, natürlich.", "right": "Yes, of course."}, {"left": "Nein, leider nicht.", "right": "No, unfortunately not."}, {"left": "Das ist leider nicht erlaubt.", "right": "Unfortunately that is not allowed."}, {"left": "Darf ich einen Freund mitbringen?", "right": "May I bring a friend?"}, {"left": "Man muss die Schuhe ausziehen.", "right": "You have to take your shoes off."}], "status": "correct"}], "feedback": "Questions and polite answers."}
  de.a2.unit104.lesson04.exercise04.ordnen_ja: {"instruction": "Put the words in order to say 'Yes, you may.'", "correct_option": "Ja das darfst du", "accepted_answers": [{"value": "Ja das darfst du", "status": "correct"}], "feedback": "The object *das* comes first."}
  de.a2.unit104.lesson04.exercise05.luecke_natuerlich: {"instruction": "Complete the answer.", "correct_option": "natürlich", "accepted_answers": [{"value": "natürlich", "status": "correct"}, {"value": "natuerlich", "status": "correct"}], "feedback": "*Ja, natürlich.*"}
  de.a2.unit104.lesson04.exercise06.uebersetzen_leider: {"instruction": "Translate into German.", "accepted_answers": [{"value": "Das ist leider nicht erlaubt.", "status": "correct"}, {"value": "Leider ist das nicht erlaubt.", "status": "correct"}], "feedback": "*Leider* can stand in two places."}
  de.a2.unit104.lesson04.exercise07.schreiben_zwei: {"instruction": "Write the requested German sentences.", "correct_option": "Darf ich hier parken? Nein, leider nicht.", "accepted_answers": [{"value": "Darf ich hier parken? Nein, leider nicht.", "status": "correct"}, {"value": "Darf ich hier parken? Nein leider nicht.", "status": "correct"}, {"value": "Darf ich hier parken? Nein, das ist leider nicht erlaubt.", "status": "correct"}, {"value": "Darf ich hier parken? Nein das ist leider nicht erlaubt.", "status": "correct"}], "feedback": "A question and a short answer."}
  de.a2.unit104.lesson05.exercise01.lesen_muss: {"instruction": "Read the text and choose the answer.", "correct_option": "Take off your shoes.", "distractors": ["Open the window.", "Pay at the door.", "Cook every day."], "accepted_answers": [{"value": "Take off your shoes.", "status": "correct"}], "feedback": "*Man muss die Schuhe ausziehen.*"}
  de.a2.unit104.lesson05.exercise02.lesen_nicht: {"instruction": "Read the text and choose the answer.", "correct_option": "Tidy up every day.", "distractors": ["Be quiet in the evening.", "Separate the rubbish.", "Take off your shoes."], "accepted_answers": [{"value": "Tidy up every day.", "status": "correct"}], "feedback": "*Man muss nicht jeden Tag aufräumen.*"}
  de.a2.unit104.lesson05.exercise03.paare_regeln: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Jonas wohnt jetzt bei Felix.", "right": "Jonas now lives with Felix."}, {"left": "Felix erklärt die Regeln.", "right": "Felix explains the rules."}, {"left": "Man darf nicht rauchen.", "right": "You may not smoke."}, {"left": "Abends muss man leise sein.", "right": "In the evening you have to be quiet."}, {"left": "Man muss den Müll trennen.", "right": "You have to separate the rubbish."}, {"left": "Freunde dürfen zu Besuch kommen.", "right": "Friends may visit."}], "status": "correct"}], "feedback": "Match the rules of the flat."}
  de.a2.unit104.lesson05.exercise04.ordnen_freunde: {"instruction": "Put the words in order to say 'Friends may visit.'", "correct_option": "Freunde dürfen zu Besuch kommen", "accepted_answers": [{"value": "Freunde dürfen zu Besuch kommen", "status": "correct"}], "feedback": "*Dürfen* second."}
  de.a2.unit104.lesson05.exercise05.uebersetzen_abends: {"instruction": "Translate into German.", "accepted_answers": [{"value": "Abends muss man leise sein.", "status": "correct"}, {"value": "Man muss abends leise sein.", "status": "correct"}, {"value": "Abends musst du leise sein.", "status": "correct"}, {"value": "Du musst abends leise sein.", "status": "correct"}], "feedback": "Both word orders are correct."}
  de.a2.unit104.lesson05.exercise06.diktat_abends: {"instruction": "Type what you hear.", "correct_response": "Abends muss man leise sein.", "orthography_strict": true, "feedback": "You heard *Abends muss man leise sein.*"}
  de.a2.unit104.lesson05.exercise07.diktat_freunde: {"instruction": "Type what you hear.", "correct_response": "Freunde dürfen zu Besuch kommen.", "orthography_strict": true, "feedback": "You heard *Freunde dürfen zu Besuch kommen.*"}
  de.a2.unit104.lesson06.exercise01.hoeren_frage: {"instruction": "Listen and select Jonas's first question.", "correct_option": "Hallo Felix! Darf ich das Fenster öffnen?", "distractors": ["Hallo Felix! Darf ich hier rauchen?", "Hallo Jonas! Darf ich das Fenster öffnen?", "Hallo Felix! Muss ich das Fenster öffnen?"], "accepted_answers": [{"value": "Hallo Felix! Darf ich das Fenster öffnen?", "status": "correct"}, {"value": "Hallo Felix! Darf ich das Fenster oeffnen?", "status": "correct"}], "feedback": "Jonas opens with *Hallo Felix! Darf ich das Fenster öffnen?*"}
  de.a2.unit104.lesson06.exercise02.verstehen_aufraeumen: {"instruction": "Listen to the dialogue and choose the answer.", "correct_option": "Tidy up every day.", "distractors": ["Be quiet in the evening.", "Open the window.", "Bring a friend."], "accepted_answers": [{"value": "Tidy up every day.", "status": "correct"}], "feedback": "Felix says: *Du musst nicht jeden Tag aufräumen.*"}
  de.a2.unit104.lesson06.exercise03.paare_dialog: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Darf ich das Fenster öffnen?", "right": "May I open the window?"}, {"left": "Abends muss man leise sein.", "right": "In the evening you have to be quiet."}, {"left": "Darf ich einen Freund mitbringen?", "right": "May I bring a friend?"}, {"left": "Rauchen ist aber verboten.", "right": "But smoking is forbidden."}, {"left": "Muss ich aufräumen?", "right": "Do I have to tidy up?"}, {"left": "Du brauchst nur den Müll zu trennen.", "right": "You only need to separate the rubbish."}], "status": "correct"}], "feedback": "The dialogue in sentences."}
