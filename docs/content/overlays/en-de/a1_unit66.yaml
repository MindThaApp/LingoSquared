    title: The Ich finde construction
    gloss: '*Ich finde* + person + trait says what you think someone is like: I find Lena curious.'
    note: '*Ich finde* + person + adjective works as in English: the person is the object, so it takes the accusative (Ich finde Lena neugierig). The same pattern gives any opinion: Ich finde den Kaffee gut.'
