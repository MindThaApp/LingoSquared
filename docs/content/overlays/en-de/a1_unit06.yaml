  de.a1.unit06.lesson01.teach.vater: {title: "Vater", gloss: "father", example_gloss: "This is my father."}
  de.a1.unit06.lesson01.teach.mutter: {title: "Mutter", gloss: "mother", example_gloss: "This is my mother."}
  de.a1.unit06.lesson01.teach.bruder: {title: "Bruder", gloss: "brother", example_gloss: "This is my brother."}
  de.a1.unit06.lesson01.teach.schwester: {title: "Schwester", gloss: "sister", example_gloss: "This is my sister."}
  de.a1.unit06.lesson01.teach.eltern: {title: "Eltern", gloss: "parents", example_gloss: "These are my parents."}
  de.a1.unit06.lesson01.teach.geschwister: {title: "Geschwister", gloss: "siblings", example_gloss: "These are my siblings."}
