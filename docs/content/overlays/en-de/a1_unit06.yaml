exercises:
  de.a1.unit06.lesson01.exercise01.listen_mutter:
    instruction: "Listen and select the family word you hear."
    correct_option: "Mutter"
    distractors: ["Vater", "Bruder", "Schwester"]
    accepted_answers: [{value: "Mutter", status: "correct"}]
    feedback: "*Mutter* means mother."
  de.a1.unit06.lesson01.exercise02.choose_bruder:
    instruction: "A male sibling is called a..."
    correct_option: "Bruder"
    distractors: ["Vater", "Schwester", "Onkel"]
    accepted_answers: [{value: "Bruder", status: "correct"}]
    feedback: "*Bruder* means brother."
  de.a1.unit06.lesson01.exercise03.choose_eltern:
    instruction: "Your mother and father together are your..."
    correct_option: "Eltern"
    distractors: ["Geschwister", "Großeltern", "Familie"]
    accepted_answers: [{value: "Eltern", status: "correct"}]
    feedback: "*Eltern* means parents."
  de.a1.unit06.lesson01.exercise04.match_familienwoerter:
    instruction: "Match each description to the correct family word."
    accepted_answers:
      - value:
          - {left: "männlicher Elternteil", right: "Vater"}
          - {left: "weiblicher Elternteil", right: "Mutter"}
          - {left: "männliches Geschwisterteil", right: "Bruder"}
          - {left: "weibliches Geschwisterteil", right: "Schwester"}
          - {left: "Vater und Mutter zusammen", right: "Eltern"}
          - {left: "Brüder und Schwestern zusammen", right: "Geschwister"}
        status: "correct"
    feedback: "*Vater*=father, *Mutter*=mother, *Bruder*=brother, *Schwester*=sister, *Eltern*=parents, *Geschwister*=siblings."
  de.a1.unit06.lesson01.exercise05.write_geschwister:
    instruction: "Write the word for brothers and sisters together."
    accepted_answers:
      - {value: "Geschwister", status: "correct"}
      - {value: "Geschwister.", status: "correct"}
    feedback: "*Geschwister* means siblings."

  de.a1.unit06.lesson02.exercise01.listen_grossmutter:
    instruction: "Listen and select the family word you hear."
    correct_option: "Großmutter"
    distractors: ["Großvater", "Tante", "Onkel"]
    accepted_answers: [{value: "Großmutter", status: "correct"}]
    feedback: "*Großmutter* means grandmother."
  de.a1.unit06.lesson02.exercise02.choose_tante:
    instruction: "Your mother's sister is your..."
    correct_option: "Tante"
    distractors: ["Onkel", "Cousine", "Großmutter"]
    accepted_answers: [{value: "Tante", status: "correct"}]
    feedback: "*Tante* means aunt."
  de.a1.unit06.lesson02.exercise03.choose_sein:
    instruction: "Felix is a man. This is _ brother. (Fill the possessive.)"
    correct_option: "sein Bruder"
    distractors: ["Ihr Bruder", "mein Bruder", "seine Bruder"]
    accepted_answers: [{value: "sein Bruder", status: "correct"}]
    feedback: "*sein Bruder* means 'his brother' -- *Bruder* is masculine, so it takes *sein*, not *seine*."
  de.a1.unit06.lesson02.exercise04.choose_ihr_formal:
    instruction: "Speaking formally to Anna, 'your father' is..."
    correct_option: "Ihr Vater"
    distractors: ["sein Vater", "mein Vater", "Ihre Vater"]
    accepted_answers: [{value: "Ihr Vater", status: "correct"}]
    feedback: "*Ihr Vater* means 'your father' (formal). *Vater* is masculine, so it takes *Ihr*, not *Ihre* -- *Ihre Vater* is ungrammatical."
  de.a1.unit06.lesson02.exercise05.order_wer_ist_ihr_vater:
    instruction: "Put the words in order to formally ask 'Who is your father?'"
    accepted_answers: [{value: ["Wer", "ist", "Ihr", "Vater"], status: "correct"}]
    feedback: "The correct order is *Wer ist Ihr Vater?*"
  de.a1.unit06.lesson02.exercise06.write_cousine:
    instruction: "Write the word for your aunt or uncle's daughter."
    accepted_answers:
      - {value: "Cousine", status: "correct"}
      - {value: "Cousine.", status: "correct"}
    feedback: "*Cousine* means female cousin -- German uses *Cousin* for a male cousin and *Cousine* for a female cousin, unlike English's one word."

  de.a1.unit06.lesson03.exercise01.choose_das_ist_mein_bruder:
    instruction: "Introduce your brother in a photo."
    correct_option: "Das ist mein Bruder."
    distractors: ["Das ist meine Bruder.", "Das ist mein Schwester.", "Das ist sein Bruder."]
    accepted_answers: [{value: "Das ist mein Bruder.", status: "correct"}]
    feedback: "*Das ist mein Bruder* means 'This is my brother' -- *Bruder* is masculine, so *mein*, not *meine*."
  de.a1.unit06.lesson03.exercise02.order_haben_sie_geschwister:
    instruction: "Put the words in order to formally ask 'Do you have siblings?'"
    accepted_answers: [{value: ["Haben", "Sie", "Geschwister"], status: "correct"}]
    feedback: "The correct order is *Haben Sie Geschwister?*"
  de.a1.unit06.lesson03.exercise03.reply_schwestern:
    instruction: "Felix asks: Haben Sie Geschwister? Reply: you have two sisters."
    accepted_answers:
      - {value: "Ich habe zwei Schwestern.", status: "correct"}
      - {value: "Ich habe zwei Schwestern", status: "correct"}
    feedback: "*Ich habe zwei Schwestern* means 'I have two sisters.'"
  de.a1.unit06.lesson03.exercise04.reply_einzelkind:
    instruction: "Felix asks: Haben Sie Geschwister? Reply: no, you're an only child."
    accepted_answers:
      - {value: "Nein, ich habe keine Geschwister. Ich bin Einzelkind.", status: "correct"}
      - {value: "Nein, ich habe keine Geschwister, ich bin Einzelkind.", status: "correct"}
      - {value: "Nein, ich habe keine Geschwister, und ich bin Einzelkind.", status: "correct"}
      - {value: "Nein ich habe keine Geschwister Ich bin Einzelkind", status: "correct"}
    feedback: "*Nein, ich habe keine Geschwister. Ich bin Einzelkind* means 'No, I don't have siblings. I'm an only child.'"
  de.a1.unit06.lesson03.exercise05.write_bruder_alter:
    instruction: "Write your brother's age: he is 20."
    accepted_answers:
      - {value: "Er ist zwanzig Jahre alt", status: "correct"}
      - {value: "Er ist zwanzig Jahre alt.", status: "correct"}
    feedback: "*Er ist zwanzig Jahre alt* means 'He is twenty years old.'"

  de.a1.unit06.lesson04.exercise01.listen_eltern_namen:
    instruction: "Listen to the dialogue. Who does Anna name first?"
    correct_option: "Das ist meine Mutter und das ist mein Vater"
    distractors: ["Meine Schwester ist Lehrerin", "Ja, ich habe zwei Brüder.", "Haben Sie Brüder?"]
    accepted_answers: [{value: "Das ist meine Mutter und das ist mein Vater", status: "correct"}]
    feedback: "Anna says *Das ist meine Mutter und das ist mein Vater* -- 'This is my mother and this is my father.'"
  de.a1.unit06.lesson04.exercise02.listen_schwester_beruf:
    instruction: "Listen again. What is Anna's sister's job?"
    correct_option: "Meine Schwester ist Lehrerin"
    distractors: ["Das ist mein Bruder", "Ja, ich habe zwei Brüder.", "Haben Sie Brüder?"]
    accepted_answers: [{value: "Meine Schwester ist Lehrerin", status: "correct"}]
    feedback: "*Meine Schwester ist Lehrerin* means 'My sister is a teacher.'"
  de.a1.unit06.lesson04.exercise03.choose_brueder_antwort:
    instruction: "Does Anna have any brothers?"
    correct_option: "Nein. Ich habe nur eine Schwester."
    distractors: ["Ja, ich habe einen Bruder.", "Ich habe keine Geschwister.", "Meine Schwester ist Lehrerin."]
    accepted_answers: [{value: "Nein. Ich habe nur eine Schwester.", status: "correct"}]
    feedback: "*Nein. Ich habe nur eine Schwester* means 'No. I only have one sister.'"
  de.a1.unit06.lesson04.exercise04.order_wer_frage:
    instruction: "Put the words in order to ask 'Who is this?'"
    accepted_answers: [{value: ["Wer", "ist", "das"], status: "correct"}]
    feedback: "The correct order is *Wer ist das?*"
  de.a1.unit06.lesson04.exercise05.read_bildunterschrift:
    instruction: "Read the photo caption. Who is named in it, besides Anna's mother and father?"
    correct_option: "meine Schwester"
    distractors: ["mein Bruder", "mein Onkel", "mein Cousin"]
    accepted_answers: [{value: "meine Schwester", status: "correct"}]
    feedback: "The caption reads *Meine Familie: meine Mutter, mein Vater und meine Schwester* -- 'My family: my mother, my father, and my sister.' Besides the parents, the caption also names *meine Schwester* -- my sister."
  de.a1.unit06.lesson04.exercise06.reply_als_anna:
    instruction: "Felix asks: Ist das Ihre Familie? Wer ist das? Reply as Anna: confirm it's your family, name your parents, then name your sister and her job."
    accepted_answers:
      - {value: "Ja. Das ist meine Mutter und das ist mein Vater. Das ist meine Schwester. Meine Schwester ist Lehrerin.", status: "correct"}
      - {value: "Ja, das ist meine Mutter und das ist mein Vater, und das ist meine Schwester, die Lehrerin ist.", status: "correct"}
      - {value: "Ja Das ist meine Mutter und das ist mein Vater Das ist meine Schwester Meine Schwester ist Lehrerin", status: "correct"}
    feedback: "Anna's full reply confirms the photo, names both parents, and names her sister and her job."
  de.a1.unit06.lesson04.exercise07.speak_familie:
    instruction: "Answer out loud in Anna's role: confirm it's your family, name your parents, then name your sister and her job."
    accepted_answers:
      - {value: "Ja Das ist meine Mutter und das ist mein Vater Das ist meine Schwester Meine Schwester ist Lehrerin", status: "correct"}
      - {value: "Ja. Das ist meine Mutter und das ist mein Vater. Das ist meine Schwester. Meine Schwester ist Lehrerin.", status: "correct"}
      - {value: "Ja, das ist meine Mutter und das ist mein Vater, und das ist meine Schwester, die Lehrerin ist.", status: "correct"}
    feedback: "This full answer covers the photo confirmation, both parents, and the sister's job."
