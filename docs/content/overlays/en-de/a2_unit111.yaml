review: {"status": "unreviewed", "required_next_reviewer": "native_speaker_review", "notes": "English overlay for the purpose unit (um ... zu, für plus noun, damit with a new subject, wozu / wofür). OPEN NATIVE QUESTIONS: none beyond the realization notes."}
course:
  title: "German A2"
  description: "Grammar-led A2 German continuing the Anna and Felix storyline."
  learning_goal: "Give reasons, order events, say what things are for, talk about real conditions, ask indirect questions and pass on messages in German."
units:
  de.a2.unit111.zweck: {"title": "What Is It For?", "description": "Say what you do something for, with um ... zu, für plus noun and damit."}
lessons:
  de.a2.unit111.lesson01.um_zu: {"title": "To Buy Bread"}
  de.a2.unit111.lesson02.trennbar: {"title": "To Get Up Early"}
  de.a2.unit111.lesson03.fuer: {"title": "For a Trip"}
  de.a2.unit111.lesson04.damit: {"title": "So That You Are on Time"}
  de.a2.unit111.lesson05.sparplan: {"title": "Felix Saves Money"}
  de.a2.unit111.lesson06.im_gespraech: {"title": "Anna Meets Jonas"}
teaching:
  de.a2.unit111.lesson01.teach.um_zu: {"title": "In order to", "gloss": "in order to / to buy / to save money / to learn / to work", "example_gloss": ["I'm going to the supermarket to buy bread.", "Felix is learning German in order to work in Berlin.", "Anna is saving money to go on a trip.", "Nina goes to the bank to get money."], "note": "*Um ... zu* says what you do something for."}
  de.a2.unit111.lesson01.teach.gn_um_zu: {"title": "Um ... zu plus infinitive", "gloss": "I'm going to the supermarket to buy bread.", "note": "*Um* opens the purpose and *zu* + infinitive closes it: *um Brot zu kaufen*."}
  de.a2.unit111.lesson01.teach.gn_komma: {"title": "Comma and word order", "gloss": "Felix is learning German to work in Berlin. Anna is saving money to go on a trip.", "note": "Put a comma before *um*. Everything else goes between *um* and *zu*, and the infinitive is last. There is no subject in the *um* part."}
  de.a2.unit111.lesson01.teach.gn_wozu: {"title": "Asking for the purpose", "gloss": "What are you going to the supermarket for? To buy bread.", "note": "*Wozu?* asks for the purpose. A short answer can start with *um*."}
  de.a2.unit111.lesson02.teach.trennbar: {"title": "Separable verbs", "gloss": "to get up / to shop / to call / alarm clock", "example_gloss": ["I set the alarm clock to get up early.", "Jonas goes into town to do some shopping.", "Felix drives home to call Anna.", "Nina goes to bed early to be fit."], "note": "*Zu* sits inside separable verbs."}
  de.a2.unit111.lesson02.teach.gn_trennbar: {"title": "Zu inside the verb", "gloss": "to get up, to shop, to call", "note": "With a separable verb, *zu* goes between the prefix and the verb, written as one word: *auf-zu-stehen*."}
  de.a2.unit111.lesson02.teach.gn_selbe: {"title": "Same person acts", "gloss": "Jonas goes into town to do some shopping. Nina goes to bed early to be fit.", "note": "*Um ... zu* is used when the same person does both things: Jonas goes and Jonas shops."}
  de.a2.unit111.lesson02.teach.gn_wecker: {"title": "Asking and answering", "gloss": "I set the alarm clock to get up early. What do you set the alarm clock for?", "note": "Ask with *wozu*, answer with *um ... zu*."}
  de.a2.unit111.lesson03.teach.fuer: {"title": "For", "gloss": "for / trip / present / flowers / to save", "example_gloss": ["I'm saving money for a trip.", "Felix buys flowers for Anna.", "What do you need the money for?", "Nina is saving for a bicycle."], "note": "With a noun, use *für*."}
  de.a2.unit111.lesson03.teach.gn_fuer: {"title": "Für plus noun", "gloss": "The present is for Anna. I'm saving for a trip.", "note": "*Für* is followed by a noun or name, never by a verb."}
  de.a2.unit111.lesson03.teach.gn_wofuer: {"title": "Wofür", "gloss": "What do you need the money for? For a bicycle.", "note": "*Wofür?* asks about a thing. The short answer starts with *für*."}
  de.a2.unit111.lesson03.teach.gn_vergleich: {"title": "Für or um ... zu", "gloss": "I'm saving money for a trip. I'm saving money to go on a trip.", "note": "A noun after the purpose means *für*. A verb means *um ... zu*."}
  de.a2.unit111.lesson04.teach.damit: {"title": "So that", "gloss": "so that / on time / list / slowly / to understand everything", "example_gloss": ["Anna writes a message so that Felix comes on time.", "Jonas speaks slowly so that Nina understands everything.", "I write a list so that I forget nothing.", "Felix helps Anna so that she is finished earlier."], "note": "*Damit* is used when the second part has its own subject."}
  de.a2.unit111.lesson04.teach.gn_damit: {"title": "Damit and a new subject", "gloss": "Anna writes a message so that Felix comes on time.", "note": "After *damit* there is a full clause with its own subject, and the verb goes last: *damit Felix pünktlich kommt*."}
  de.a2.unit111.lesson04.teach.gn_verb_ende: {"title": "Verb at the end", "gloss": "I write a list so that I forget nothing. Jonas speaks slowly so that Nina understands everything.", "note": "Like *weil* and *bevor*, *damit* sends the conjugated verb to the end."}
  de.a2.unit111.lesson04.teach.gn_wahl: {"title": "Um ... zu or damit", "gloss": "Felix learns German to work in Berlin. Anna helps Felix so that he can work in Berlin.", "note": "One person, one action pair: *um ... zu*. Two different people: *damit*."}
  de.a2.unit111.lesson05.teach.sparen: {"title": "Words for the story", "gloss": "Italy / Saturday / to earn / more / to cook at home", "example_gloss": ["Felix is saving money for a trip to Italy.", "He works on Saturday.", "He wants to earn more money.", "He cooks at home."], "note": "Words for the story you will read."}
  de.a2.unit111.lesson05.teach.gn_text: {"title": "Three ways to give a purpose", "gloss": "He works on Saturday to earn more money. Anna helps him so that he can leave earlier.", "note": "Look for *um ... zu*, *damit* and *für* in the text."}
  de.a2.unit111.lesson05.teach.lesen_sparen: {"title": "Felix's plan", "gloss": "Felix is saving money for a trip to Italy. He works on Saturday to earn more money. He cooks at home to save money. Anna helps him so that he can leave earlier.", "note": "One goal, three kinds of purpose."}
  de.a2.unit111.lesson06.teach.anna_wohin: {"title": "Anna asks", "gloss": "Anna: Hi Jonas! Where are you going?"}
  de.a2.unit111.lesson06.teach.jonas_brot: {"title": "Jonas answers", "gloss": "Jonas: I'm going to the supermarket to buy bread."}
  de.a2.unit111.lesson06.teach.anna_bank: {"title": "Anna asks more", "gloss": "Anna: And what are you going to the bank for then?"}
  de.a2.unit111.lesson06.teach.jonas_geld: {"title": "Jonas explains", "gloss": "Jonas: To get money. I'm saving for a trip."}
  de.a2.unit111.lesson06.teach.anna_reise: {"title": "Anna is curious", "gloss": "Anna: A trip? Where to?"}
  de.a2.unit111.lesson06.teach.jonas_italien: {"title": "Jonas tells more", "gloss": "Jonas: To Italy. Felix is helping me so that I can leave earlier."}
  de.a2.unit111.lesson06.teach.anna_super: {"title": "Anna offers help", "gloss": "Anna: Great! I'll help too."}
exercises:
  de.a2.unit111.lesson01.exercise01.wahl_brot: {"instruction": "Choose the correct German sentence.", "correct_option": "Ich gehe zum Supermarkt, um Brot zu kaufen.", "distractors": ["Ich gehe zum Supermarkt, um Brot kaufen zu.", "Ich gehe zum Supermarkt, um zu Brot kaufen.", "Ich gehe zum Supermarkt, zu Brot kaufen um."], "accepted_answers": [{"value": "Ich gehe zum Supermarkt, um Brot zu kaufen.", "status": "correct"}], "feedback": "*Zu* stands before the infinitive."}
  de.a2.unit111.lesson01.exercise02.wahl_berlin: {"instruction": "Choose the correct German sentence.", "correct_option": "Felix lernt Deutsch, um in Berlin zu arbeiten.", "distractors": ["Felix lernt Deutsch, um in Berlin arbeiten zu.", "Felix lernt Deutsch, um zu in Berlin arbeiten.", "Felix lernt Deutsch, in Berlin zu arbeiten um."], "accepted_answers": [{"value": "Felix lernt Deutsch, um in Berlin zu arbeiten.", "status": "correct"}], "feedback": "*Um in Berlin zu arbeiten*."}
  de.a2.unit111.lesson01.exercise03.paare_um_zu: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Ich gehe zum Supermarkt, um Brot zu kaufen.", "right": "I'm going to the supermarket to buy bread."}, {"left": "Felix lernt Deutsch, um in Berlin zu arbeiten.", "right": "Felix is learning German in order to work in Berlin."}, {"left": "Anna spart Geld, um eine Reise zu machen.", "right": "Anna is saving money to go on a trip."}, {"left": "Nina geht zur Bank, um Geld zu holen.", "right": "Nina goes to the bank to get money."}, {"left": "Wozu gehst du zum Supermarkt?", "right": "What are you going to the supermarket for?"}, {"left": "Um Brot zu kaufen.", "right": "To buy bread."}], "status": "correct"}], "feedback": "Sentences with um ... zu."}
  de.a2.unit111.lesson01.exercise04.ordnen_reise: {"instruction": "Put the words in order to say 'Anna is saving money to go on a trip.'", "correct_option": "Anna spart Geld um eine Reise zu machen", "accepted_answers": [{"value": "Anna spart Geld um eine Reise zu machen", "status": "correct"}], "feedback": "*Zu machen* ends the sentence."}
  de.a2.unit111.lesson01.exercise05.luecke_machen: {"instruction": "Complete with the infinitive.", "correct_option": "machen", "accepted_answers": [{"value": "machen", "status": "correct"}], "feedback": "*Zu* + infinitive at the end."}
  de.a2.unit111.lesson01.exercise06.uebersetzen_bank: {"instruction": "Translate into German.", "accepted_answers": [{"value": "Nina geht zur Bank, um Geld zu holen.", "status": "correct"}, {"value": "Nina geht zur Bank um Geld zu holen.", "status": "correct"}], "feedback": "*Um Geld zu holen*."}
  de.a2.unit111.lesson01.exercise07.schreiben_sparen: {"instruction": "Write the requested German sentence.", "accepted_answers": [{"value": "Anna spart Geld, um eine Reise zu machen.", "status": "correct"}, {"value": "Anna spart Geld um eine Reise zu machen.", "status": "correct"}], "feedback": "*Um eine Reise zu machen*.", "correct_option": "Anna spart Geld, um eine Reise zu machen."}
  de.a2.unit111.lesson02.exercise01.wahl_wecker: {"instruction": "Choose the correct German sentence.", "correct_option": "Ich stelle den Wecker, um früh aufzustehen.", "distractors": ["Ich stelle den Wecker, um früh zu aufstehen.", "Ich stelle den Wecker, um früh aufstehen zu.", "Ich stelle den Wecker, um zu früh aufstehen."], "accepted_answers": [{"value": "Ich stelle den Wecker, um früh aufzustehen.", "status": "correct"}], "feedback": "*Auf-zu-stehen* is one word."}
  de.a2.unit111.lesson02.exercise02.wahl_stadt: {"instruction": "Choose the correct German sentence.", "correct_option": "Jonas geht in die Stadt, um einzukaufen.", "distractors": ["Jonas geht in die Stadt, um einkaufen zu.", "Jonas geht in die Stadt, um zu einkaufen.", "Jonas geht in die Stadt, um einzukaufen zu."], "accepted_answers": [{"value": "Jonas geht in die Stadt, um einzukaufen.", "status": "correct"}], "feedback": "*Ein-zu-kaufen*."}
  de.a2.unit111.lesson02.exercise03.paare_trennbar: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Ich stelle den Wecker, um früh aufzustehen.", "right": "I set the alarm clock to get up early."}, {"left": "Jonas geht in die Stadt, um einzukaufen.", "right": "Jonas goes into town to do some shopping."}, {"left": "Felix fährt nach Hause, um Anna anzurufen.", "right": "Felix drives home to call Anna."}, {"left": "Nina geht früh ins Bett, um fit zu sein.", "right": "Nina goes to bed early to be fit."}, {"left": "Wozu stellst du den Wecker?", "right": "What do you set the alarm clock for?"}, {"left": "um früh aufzustehen", "right": "to get up early"}], "status": "correct"}], "feedback": "Purpose with separable verbs."}
  de.a2.unit111.lesson02.exercise04.ordnen_anrufen: {"instruction": "Put the words in order to say 'Felix drives home to call Anna.'", "correct_option": "Felix fährt nach Hause um Anna anzurufen", "accepted_answers": [{"value": "Felix fährt nach Hause um Anna anzurufen", "status": "correct"}], "feedback": "*Anzurufen* last."}
  de.a2.unit111.lesson02.exercise05.luecke_sein: {"instruction": "Complete with the infinitive.", "correct_option": "sein", "accepted_answers": [{"value": "sein", "status": "correct"}], "feedback": "*Fit zu sein*."}
  de.a2.unit111.lesson02.exercise06.uebersetzen_felix: {"instruction": "Translate into German.", "accepted_answers": [{"value": "Felix fährt nach Hause, um Anna anzurufen.", "status": "correct"}, {"value": "Felix fährt nach Hause um Anna anzurufen.", "status": "correct"}, {"value": "Felix faehrt nach Hause, um Anna anzurufen.", "status": "correct"}, {"value": "Felix faehrt nach Hause um Anna anzurufen.", "status": "correct"}], "feedback": "*Anzurufen* in one word."}
  de.a2.unit111.lesson02.exercise07.schreiben_wecker: {"instruction": "Write the requested German sentence.", "accepted_answers": [{"value": "Ich stelle den Wecker, um früh aufzustehen.", "status": "correct"}, {"value": "Ich stelle den Wecker um früh aufzustehen.", "status": "correct"}, {"value": "Ich stelle den Wecker, um frueh aufzustehen.", "status": "correct"}, {"value": "Ich stelle den Wecker um frueh aufzustehen.", "status": "correct"}], "feedback": "*Um früh aufzustehen*.", "correct_option": "Ich stelle den Wecker, um früh aufzustehen."}
  de.a2.unit111.lesson03.exercise01.wahl_reise: {"instruction": "Choose the correct German sentence.", "correct_option": "Ich spare Geld für eine Reise.", "distractors": ["Ich spare Geld um eine Reise.", "Ich spare Geld für eine Reise zu machen.", "Ich spare Geld für zu eine Reise."], "accepted_answers": [{"value": "Ich spare Geld für eine Reise.", "status": "correct"}], "feedback": "A noun follows *für*."}
  de.a2.unit111.lesson03.exercise02.wahl_blumen: {"instruction": "Choose the correct German sentence.", "correct_option": "Felix kauft Blumen für Anna.", "distractors": ["Felix kauft Blumen um Anna.", "Felix kauft Blumen für Anna zu.", "Felix kauft für Blumen Anna."], "accepted_answers": [{"value": "Felix kauft Blumen für Anna.", "status": "correct"}], "feedback": "*Für Anna*."}
  de.a2.unit111.lesson03.exercise03.paare_fuer: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Ich spare Geld für eine Reise.", "right": "I'm saving money for a trip."}, {"left": "Felix kauft Blumen für Anna.", "right": "Felix buys flowers for Anna."}, {"left": "Wofür brauchst du das Geld?", "right": "What do you need the money for?"}, {"left": "Nina spart für ein Fahrrad.", "right": "Nina is saving for a bicycle."}, {"left": "Das Geschenk ist für Anna.", "right": "The present is for Anna."}, {"left": "Für ein Fahrrad.", "right": "For a bicycle."}], "status": "correct"}], "feedback": "Purpose with für."}
  de.a2.unit111.lesson03.exercise04.ordnen_wofuer: {"instruction": "Put the words in order to say 'What do you need the money for?'", "correct_option": "Wofür brauchst du das Geld", "accepted_answers": [{"value": "Wofür brauchst du das Geld", "status": "correct"}], "feedback": "Question word first, verb second."}
  de.a2.unit111.lesson03.exercise05.luecke_fuer: {"instruction": "Complete with the preposition.", "correct_option": "für", "accepted_answers": [{"value": "für", "status": "correct"}, {"value": "fuer", "status": "correct"}], "feedback": "A noun purpose takes *für*."}
  de.a2.unit111.lesson03.exercise06.uebersetzen_wofuer: {"instruction": "Translate into German.", "accepted_answers": [{"value": "Wofür brauchst du das Geld?", "status": "correct"}, {"value": "Wofuer brauchst du das Geld?", "status": "correct"}], "feedback": "*Wofür* plus the verb."}
  de.a2.unit111.lesson03.exercise07.schreiben_fahrrad: {"instruction": "Write the requested German sentence.", "accepted_answers": [{"value": "Nina spart für ein Fahrrad.", "status": "correct"}, {"value": "Nina spart fuer ein Fahrrad.", "status": "correct"}], "feedback": "*Für ein Fahrrad*.", "correct_option": "Nina spart für ein Fahrrad."}
  de.a2.unit111.lesson04.exercise01.wahl_nachricht: {"instruction": "Choose the correct German sentence.", "correct_option": "Anna schreibt eine Nachricht, damit Felix pünktlich kommt.", "distractors": ["Anna schreibt eine Nachricht, damit Felix kommt pünktlich.", "Anna schreibt eine Nachricht, damit kommt Felix pünktlich.", "Anna schreibt eine Nachricht, damit pünktlich Felix kommt."], "accepted_answers": [{"value": "Anna schreibt eine Nachricht, damit Felix pünktlich kommt.", "status": "correct"}], "feedback": "The verb *kommt* goes last."}
  de.a2.unit111.lesson04.exercise02.wahl_langsam: {"instruction": "Choose the correct German sentence.", "correct_option": "Jonas spricht langsam, damit Nina alles versteht.", "distractors": ["Jonas spricht langsam, damit Nina versteht alles.", "Jonas spricht langsam, damit versteht Nina alles.", "Jonas spricht langsam, damit alles versteht Nina."], "accepted_answers": [{"value": "Jonas spricht langsam, damit Nina alles versteht.", "status": "correct"}], "feedback": "*Versteht* is last."}
  de.a2.unit111.lesson04.exercise03.paare_damit: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Anna schreibt eine Nachricht, damit Felix pünktlich kommt.", "right": "Anna writes a message so that Felix comes on time."}, {"left": "Jonas spricht langsam, damit Nina alles versteht.", "right": "Jonas speaks slowly so that Nina understands everything."}, {"left": "Ich schreibe eine Liste, damit ich nichts vergesse.", "right": "I write a list so that I forget nothing."}, {"left": "Felix hilft Anna, damit sie früher fertig ist.", "right": "Felix helps Anna so that she is finished earlier."}, {"left": "Anna hilft Felix, damit er in Berlin arbeiten kann.", "right": "Anna helps Felix so that he can work in Berlin."}, {"left": "damit Felix pünktlich kommt", "right": "so that Felix comes on time"}], "status": "correct"}], "feedback": "Sentences with damit."}
  de.a2.unit111.lesson04.exercise04.ordnen_liste: {"instruction": "Put the words in order to say 'I write a list so that I forget nothing.'", "correct_option": "Ich schreibe eine Liste damit ich nichts vergesse", "accepted_answers": [{"value": "Ich schreibe eine Liste damit ich nichts vergesse", "status": "correct"}], "feedback": "*Vergesse* is last."}
  de.a2.unit111.lesson04.exercise05.luecke_kommt: {"instruction": "Complete with the verb.", "correct_option": "kommt", "accepted_answers": [{"value": "kommt", "status": "correct"}], "feedback": "The verb stands last after *damit*."}
  de.a2.unit111.lesson04.exercise06.uebersetzen_fertig: {"instruction": "Translate into German.", "accepted_answers": [{"value": "Felix hilft Anna, damit sie früher fertig ist.", "status": "correct"}, {"value": "Felix hilft Anna damit sie früher fertig ist.", "status": "correct"}, {"value": "Felix hilft Anna, damit sie frueher fertig ist.", "status": "correct"}, {"value": "Felix hilft Anna damit sie frueher fertig ist.", "status": "correct"}], "feedback": "*Fertig ist* last."}
  de.a2.unit111.lesson04.exercise07.schreiben_liste: {"instruction": "Write the requested German sentence.", "accepted_answers": [{"value": "Ich schreibe eine Liste, damit ich nichts vergesse.", "status": "correct"}, {"value": "Ich schreibe eine Liste damit ich nichts vergesse.", "status": "correct"}], "feedback": "*Damit ich nichts vergesse*.", "correct_option": "Ich schreibe eine Liste, damit ich nichts vergesse."}
  de.a2.unit111.lesson05.exercise01.lesen_samstag: {"instruction": "Read the text and choose the answer.", "correct_option": "To earn more money.", "distractors": ["To buy a car.", "To learn Italian.", "To help Anna."], "accepted_answers": [{"value": "To earn more money.", "status": "correct"}], "feedback": "*Er arbeitet am Samstag, um mehr Geld zu verdienen.*"}
  de.a2.unit111.lesson05.exercise02.lesen_italien: {"instruction": "Read the text and choose the answer.", "correct_option": "A trip to Italy.", "distractors": ["A car.", "A bicycle.", "A party."], "accepted_answers": [{"value": "A trip to Italy.", "status": "correct"}], "feedback": "*Felix spart Geld für eine Reise nach Italien.*"}
  de.a2.unit111.lesson05.exercise03.paare_sparen: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Felix spart Geld für eine Reise nach Italien.", "right": "Felix is saving money for a trip to Italy."}, {"left": "Er arbeitet am Samstag, um mehr Geld zu verdienen.", "right": "He works on Saturday to earn more money."}, {"left": "Er kocht zu Hause, um Geld zu sparen.", "right": "He cooks at home to save money."}, {"left": "Anna hilft ihm, damit er früher fahren kann.", "right": "Anna helps him so that he can leave earlier."}, {"left": "Er will mehr Geld verdienen.", "right": "He wants to earn more money."}, {"left": "Wofür spart Felix?", "right": "What is Felix saving for?"}], "status": "correct"}], "feedback": "Felix's plan in sentences."}
  de.a2.unit111.lesson05.exercise04.ordnen_kocht: {"instruction": "Put the words in order to say 'He cooks at home to save money.'", "correct_option": "Er kocht zu Hause um Geld zu sparen", "accepted_answers": [{"value": "Er kocht zu Hause um Geld zu sparen", "status": "correct"}], "feedback": "*Zu sparen* last."}
  de.a2.unit111.lesson05.exercise05.uebersetzen_kochen: {"instruction": "Translate into German.", "accepted_answers": [{"value": "Felix kocht zu Hause, um Geld zu sparen.", "status": "correct"}, {"value": "Felix kocht zu Hause um Geld zu sparen.", "status": "correct"}], "feedback": "*Um Geld zu sparen*."}
  de.a2.unit111.lesson05.exercise06.diktat_reise: {"instruction": "Type what you hear.", "correct_response": "Felix spart Geld für eine Reise.", "orthography_strict": true, "feedback": "You heard *Felix spart Geld für eine Reise.*"}
  de.a2.unit111.lesson05.exercise07.diktat_anna: {"instruction": "Type what you hear.", "correct_response": "Anna hilft ihm, damit er früher fahren kann.", "orthography_strict": true, "feedback": "You heard *Anna hilft ihm, damit er früher fahren kann.*"}
  de.a2.unit111.lesson06.exercise01.hoeren_frage: {"instruction": "Listen and select the line you hear.", "correct_option": "Hallo Jonas! Wohin gehst du?", "distractors": ["Hallo Felix! Wohin gehst du?", "Hallo Jonas! Wozu gehst du?", "Hallo Jonas! Woher kommst du?"], "accepted_answers": [{"value": "Hallo Jonas! Wohin gehst du?", "status": "correct"}], "feedback": "Anna opens with *Hallo Jonas! Wohin gehst du?*"}
  de.a2.unit111.lesson06.exercise02.verstehen_brot: {"instruction": "Listen to the dialogue and choose the answer.", "correct_option": "Bread.", "distractors": ["Cheese.", "Coffee.", "A ticket."], "accepted_answers": [{"value": "Bread.", "status": "correct"}], "feedback": "Jonas goes to the supermarket to buy bread."}
  de.a2.unit111.lesson06.exercise03.paare_dialog: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Wohin gehst du?", "right": "Where are you going?"}, {"left": "Ich gehe zum Supermarkt, um Brot zu kaufen.", "right": "I'm going to the supermarket to buy bread."}, {"left": "Und wozu gehst du dann zur Bank?", "right": "And what are you going to the bank for then?"}, {"left": "Um Geld zu holen.", "right": "To get money."}, {"left": "Ich spare für eine Reise.", "right": "I'm saving for a trip."}, {"left": "Felix hilft mir, damit ich früher fahren kann.", "right": "Felix is helping me so that I can leave earlier."}], "status": "correct"}], "feedback": "The conversation in sentences."}
  de.a2.unit111.lesson06.exercise04.ordnen_bank: {"instruction": "Put the words in order to say 'And what are you going to the bank for then?'", "correct_option": "Und wozu gehst du dann zur Bank", "accepted_answers": [{"value": "Und wozu gehst du dann zur Bank", "status": "correct"}], "feedback": "Question word, then the verb."}
