review:
  status: reviewed
  required_next_reviewer: native_speaker_pass
  notes: >-
    Overlay for German's second C1 unit, authored alongside the realization
    (no adaptable public-domain German C1 source exists; see the realization
    provenance note). English speakers' real interference risks for this
    outcome: (1) English understatement ("not bad", "a bit much") maps cleanly
    onto German litotes, but the German forms are fixed collocations (nicht
    restlos begeistert, nicht ganz ideal) that must not be paraphrased -- the
    glosses pin them; (2) German irony leans on the modal particle *ja* and on
    frozen positive phrases (Das ist ja ein interessanter Vorschlag, Na,
    großartig) whose positive surface English speakers may read literally, so
    each is glossed with its actual (reversed) meaning; (3) "sicher gut
    beraten" / "sicher gut gemeint" use *sicher* ("surely") to carry the irony,
    which has no one-word English equivalent, so they are glossed by effect;
    (4) English lets a speaker criticize directly, whereas this unit's whole
    point is that the judgement stays unspoken -- the culminating prompts name
    the exact remark AND explanation to produce so a correct answer is
    well-determined. No sibling-direction file (de-en) was consulted.

    Fresh-context review 2026-10-11 (content-reviewer.md checklist): checked
    course-scoped compile, YAML booleans, jargon/AI leaks, character canon
    (Felix Weber, Frau Vogel, formal Sie), note/gloss accuracy, prompt
    determinacy and accepted-answer completeness for unit02 realization + en-
    de overlay. Fixes: de.c1.unit02.lesson01.teach.untertreibung_muster note
    parentheticals said the opposite of the meaning ('not annoyed / not bad /
    not too much') -> 'really: annoyed / bad / far too much';
    de.c1.unit02.lesson04.exercise06.speak_zwischen_zeilen prompt +
    instruction 'keep it in mind' -> 'keep it (the proposal) in mind' (pins
    ihn); de.c1.unit02.lesson04.exercise05.translate_floskel prompt +
    instruction now pin 'using haben ... mit Interesse zur Kenntnis genommen'
    (Praeteritum/fronted variants were graded wrong);
    de.c1.unit02.lesson04.exercise07.write_zwischen_zeilen accepts the future
    'Zu gegebener Zeit werden wir die Umsetzung gerne pruefen' (+period,
    ascii); 'fuer eine Zeitverschwendung halte' variants (+period, ascii)
    added to lesson05.exercise05/06/07 and lesson06.exercise05. NATIVE FLAGS:
    lesson02 exercise05/07 accept only the ja-irony form though the prompt
    does not ask for ja; 'Seine Kritik ist eine Untertreibung' is an odd
    example of the device; 'Die Stunde ist nicht ganz ideal' (Die Uhrzeit more
    idiomatic). DEFERRED: none.

    Second-pass review 2026-10-19: 11 fixes -- lesson06.teach.felix_andeutung
    + lesson06.exercise04 pair mirrored to Felix's new line 'Dazu sage ich
    lieber nichts' (dialogue coherence fix, see realization notes);
    lesson02.exercise01: instruction 'Said about a bad idea' gave away the
    answer 'The proposal is a bad idea' -> context now 'said in a dry tone
    about the new compulsory Friday meeting'; lesson02.exercise02 and
    lesson03.exercise02 (listen_select): context-free 'Das ist ja ein
    interessanter Vorschlag' / 'sicher gut beraten' made the literal-reading
    distractor defensible -> instructions now give the dry-tone context;
    lesson02.exercise05/07 pin the particle ja; answer-leak trims mirrored for
    lesson01.exercise05/06, lesson02.exercise06, lesson03.exercise06,
    lesson04.exercise05, lesson06.exercise06; lesson05.exercise04 accepts 'Ich
    meine damit dass' (valid order, adds one expected compiler warning);
    lesson06.exercise06 accepts '... und wir werden ihn im Hinterkopf
    behalten'; lesson06.exercise03 feedback capitalization.

course:
  title: German C1
  description: >-
    Advanced German: grasp and convey implicit meaning -- inference,
    implication, irony, and understatement -- recognizing what is meant beyond
    what is literally said, and producing it yourself in formal register.

units:
  de.c1.unit02.zwischen_den_zeilen:
    title: "Reading between the lines"
    description: "Recognize understatement, irony, and implication; read a polite-but-dismissive message for its real stance; and produce an ironic or understated remark together with its explanation."

lessons:
  de.c1.unit02.lesson01.die_untertreibung_erkennen:
    title: "Recognize understatement"
  de.c1.unit02.lesson02.die_ironie_erkennen:
    title: "Recognize irony"
  de.c1.unit02.lesson03.die_andeutung_verstehen:
    title: "Understand implication"
  de.c1.unit02.lesson04.zwischen_den_zeilen_lesen:
    title: "Read between the lines"
  de.c1.unit02.lesson05.der_ironische_kommentar:
    title: "The ironic comment"
  de.c1.unit02.lesson06.der_vollstaendige_austausch:
    title: "The complete exchange"

teaching:
  de.c1.unit02.lesson01.teach.nicht_restlos_begeistert:
    title: "not completely thrilled"
    gloss: "not completely thrilled"
    note: "*Nicht restlos begeistert* is a classic German understatement: the speaker says far less than they mean. *Restlos* means 'utterly', so the literal claim is only that enthusiasm is incomplete -- but a native speaker reads it as 'I am actually annoyed'."
  de.c1.unit02.lesson01.teach.nicht_ganz_ideal:
    title: "not entirely ideal"
    gloss: "not entirely ideal"
    note: "*Nicht ganz ideal* deliberately avoids a blunt verdict. Where a direct speaker would say 'that is bad', the understated form leaves the real judgement to the listener."
  de.c1.unit02.lesson01.teach.ein_bisschen_viel:
    title: "a bit much"
    gloss: "a bit much"
    note: "*Ein bisschen viel* = 'a bit much' -- an understatement that actually means 'far too much'. The hedge *ein bisschen* is what makes the criticism polite rather than direct."
  de.c1.unit02.lesson01.teach.etwas_optimistisch:
    title: "somewhat optimistic"
    gloss: "somewhat optimistic"
    note: "*Etwas optimistisch* calls a plan or estimate 'somewhat optimistic' when it is in fact unrealistic. The understatement protects the relationship while the message still lands."
  de.c1.unit02.lesson01.teach.die_besprechung:
    title: "the meeting"
    gloss: "the meeting"
    note: "*Die Besprechung* = the (business) meeting -- the object of everyone's quiet scepticism in this unit."
    example_gloss: "The meeting lasts an hour."
  de.c1.unit02.lesson01.teach.die_untertreibung:
    title: "understatement"
    gloss: "understatement"
    note: "*Die Untertreibung* names the whole device: saying less than you mean so that the real judgement stays implicit."
    example_gloss: "His criticism is an understatement."
  de.c1.unit02.lesson01.teach.die_uebertreibung:
    title: "exaggeration"
    gloss: "exaggeration"
    note: "*Die Übertreibung* is the opposite of understatement -- saying more than you mean. Learning the pair makes the contrast clear."
    example_gloss: "That is a strong exaggeration."
  de.c1.unit02.lesson01.teach.untertreibung_muster:
    title: "Understatement in context"
    gloss: "I am not completely thrilled. The meeting is not entirely ideal. That is a bit much."
    note: "Each line states less than it means. *Nicht restlos begeistert* (really: annoyed), *nicht ganz ideal* (really: bad), and *ein bisschen viel* (really: far too much) all leave the real judgement to the listener."

  de.c1.unit02.lesson02.teach.interessanter_vorschlag:
    title: "Now that is an interesting proposal."
    gloss: "that is an interesting proposal (ironic)"
    note: "*Das ist ja ein interessanter Vorschlag* is irony: the modal particle *ja* plus a praising word (*interessant*) said about something the speaker thinks is bad. The positive surface is exactly what signals the negative judgement."
  de.c1.unit02.lesson02.teach.aufschlussreich:
    title: "enlightening"
    gloss: "enlightening / revealing"
    note: "*Aufschlussreich* = enlightening. Said about something obvious or trivial, it is ironic -- the speaker implies the contribution told them nothing."
    example_gloss: "The presentation was very enlightening."
  de.c1.unit02.lesson02.teach.na_grossartig:
    title: "Oh, great."
    gloss: "oh, great (ironic)"
    note: "*Na, großartig* = 'oh, great' -- said on receiving bad news, it means the opposite. The interjection *Na* and the praising *großartig* together create the ironic twist."
  de.c1.unit02.lesson02.teach.nur_besser_werden:
    title: "It can only get better."
    gloss: "it can only get better (ironic)"
    note: "*Das kann ja nur besser werden* = 'it can only get better' -- said about a situation that is already bad, it implies the opposite: this is as bad as it gets."
  de.c1.unit02.lesson02.teach.die_ironie:
    title: "irony"
    gloss: "irony"
    note: "*Die Ironie* names the device: saying one thing while meaning its opposite, so the reversal has to be recovered from context."
    example_gloss: "Irony is not always immediately recognizable."
  de.c1.unit02.lesson02.teach.woertlich:
    title: "literally"
    gloss: "literally"
    note: "*Wörtlich* marks the surface meaning of an ironic remark, as opposed to what is actually meant. The contrast *wörtlich ... aber eigentlich* is the key to spotting irony."
    example_gloss: "Literally, that sounds positive."
  de.c1.unit02.lesson02.teach.ironie_muster:
    title: "Irony in context"
    gloss: "Now that is an interesting proposal. Oh, great. It can only get better."
    note: "All three lines mean the opposite of what they say. The praise (*interessant*, *großartig*) and the optimistic-sounding *nur besser werden* are all reversed by the context."

  de.c1.unit02.lesson03.teach.wenn_sie_meinen:
    title: "If you say so."
    gloss: "if you say so"
    note: "*Wenn Sie meinen* = 'if you say so'. It concedes the words without conceding the point -- the speaker disagrees but will not argue, leaving the objection implicit."
  de.c1.unit02.lesson03.teach.gut_gemeint:
    title: "That was surely well-intentioned."
    gloss: "that was surely well-intentioned"
    note: "*Das war sicher gut gemeint* = 'that was surely well-intentioned'. *Sicher* carries the irony: praising the intention implies the result is not good."
  de.c1.unit02.lesson03.teach.gut_beraten:
    title: "surely well-advised"
    gloss: "surely well-advised"
    note: "*Sicher gut beraten* = 'surely well-advised' -- said ironically, it implies the opposite: the decision was a mistake."
  de.c1.unit02.lesson03.teach.dazu_nichts_sagen:
    title: "I would rather not comment on that."
    gloss: "I would rather not comment on that"
    note: "*Dazu sage ich lieber nichts* = 'I would rather say nothing about that'. Refusing to comment is itself a strong negative judgement -- the silence is the message."
  de.c1.unit02.lesson03.teach.die_andeutung:
    title: "the implication"
    gloss: "the hint / implication"
    note: "*Die Andeutung* = the hint or implication -- meaning conveyed without being stated directly."
    example_gloss: "His implication was clear enough."
  de.c1.unit02.lesson03.teach.die_geschaeftsleitung:
    title: "management"
    gloss: "management"
    note: "*Die Geschäftsleitung* = management -- the body that announced the new meeting, and the target of Felix's ironic *gut beraten*."
    example_gloss: "Management scheduled the meeting."
  de.c1.unit02.lesson03.teach.andeutung_muster:
    title: "Implication in context"
    gloss: "If you say so. That was surely well-intentioned. Management was surely well-advised."
    note: "Each line leaves the real judgement unstated. *Wenn Sie meinen* (I disagree), *sicher gut gemeint* (but not good), and *sicher gut beraten* (they made a mistake) all mean more than they say."

  de.c1.unit02.lesson04.teach.mit_interesse_kenntnis:
    title: "noted with interest"
    gloss: "noted with interest (actually ignored)"
    note: "*Mit Interesse zur Kenntnis genommen* = 'noted with interest' -- a stock written phrase whose real meaning is 'we have read it and will ignore it'."
  de.c1.unit02.lesson04.teach.im_hinterkopf_behalten:
    title: "to keep in mind"
    gloss: "keep in mind (do nothing about it)"
    note: "*Im Hinterkopf behalten* = 'keep in mind' -- polite written language for 'we will do nothing about it'."
  de.c1.unit02.lesson04.teach.zu_gegebener_zeit:
    title: "in due course"
    gloss: "in due course (probably never)"
    note: "*Zu gegebener Zeit* = 'in due course' -- a deliberately vague time reference that in a dismissal email effectively means 'never'."
  de.c1.unit02.lesson04.teach.wir_pruefen_das:
    title: "We will gladly look into it."
    gloss: "we will gladly look into it (we will not)"
    note: "*Wir prüfen das gerne* = 'we will gladly look into it' -- the polite surface promises action while the unstated meaning is that nothing will happen."
  de.c1.unit02.lesson04.teach.die_floskel:
    title: "stock phrase"
    gloss: "stock phrase"
    note: "*Die Floskel* = the stock phrase -- a fixed formula that sounds polite but has been emptied of real meaning."
    example_gloss: "The stock phrase sounds polite, but says little."
  de.c1.unit02.lesson04.teach.zwischen_den_zeilen:
    title: "between the lines"
    gloss: "between the lines"
    note: "*Zwischen den Zeilen* = between the lines -- where the real meaning of a polite-but-dismissive message lives."
    example_gloss: "One must read between the lines."
  de.c1.unit02.lesson04.teach.email_antwort:
    title: "A polite dismissal"
    gloss: "Thank you for your proposal. We have noted it with interest. We will keep it in mind. In due course we will gladly examine the implementation."
    note: "Every sentence is a *Floskel*: the surface is warm and polite, but together they say 'we will do nothing'. Reading between the lines reveals the actual stance -- the writer is not going to act on the proposal."

  de.c1.unit02.lesson05.teach.damit_meine_ich:
    title: "By that I mean that..."
    gloss: "by that I mean that..."
    note: "*Damit meine ich, dass...* is the explicit bridge from an implicit remark to its real meaning -- the frame that lets you explain the unstated judgement."
  de.c1.unit02.lesson05.teach.eigentlich_sagen:
    title: "Actually I want to say that..."
    gloss: "actually I want to say that..."
    note: "*Eigentlich will ich damit sagen, dass...* is a second, softer way to surface what an ironic or understated remark really means."
  de.c1.unit02.lesson05.teach.ironischer_kommentar:
    title: "the ironic comment"
    gloss: "the ironic comment"
    note: "*Der ironische Kommentar* = the ironic comment -- the production target of this lesson: criticize without criticizing directly."
    example_gloss: "An ironic comment criticizes without criticizing directly."
  de.c1.unit02.lesson05.teach.unausgesprochen:
    title: "unspoken"
    gloss: "unspoken"
    note: "*Unausgesprochen* = unspoken. The whole unit's theme: the judgement stays *unausgesprochen* until you explain it with *damit meine ich*."
    example_gloss: "The judgement remains unspoken."
  de.c1.unit02.lesson05.teach.die_zeitverschwendung:
    title: "the waste of time"
    gloss: "the waste of time"
    note: "*Die Zeitverschwendung* = the waste of time -- the unspoken judgement Felix and Frau Vogel actually hold about the new meeting."
    example_gloss: "The meeting is pure waste of time."
  de.c1.unit02.lesson05.teach.produktion_muster:
    title: "Remark, then explanation"
    gloss: "Oh, great. By that I mean that I consider the meeting a waste of time."
    note: "The full production pattern: first the implicit remark (*Na, großartig*), then the explanation of what it really means (*damit meine ich, dass...*). Both halves together deliver the outcome."

  de.c1.unit02.lesson06.teach.frau_vogel_frage:
    title: "Frau Vogel: Have you seen the invitation to the new meeting?"
    gloss: "Frau Vogel: Have you seen the invitation to the new meeting?"
    note: "Frau Vogel uses formal Sie (*haben Sie ... gesehen?*) to open the exchange -- a neutral question that triggers Felix's ironic reply."
  de.c1.unit02.lesson06.teach.felix_ironie:
    title: "Felix: Yes, on Fridays at four, a whole hour. Now that is an interesting proposal."
    gloss: "Felix: Yes, Fridays at four, a whole hour. That is an interesting proposal."
    note: "Felix states the literal facts, then delivers the irony: *ein interessanter Vorschlag* means the opposite -- the meeting is a bad idea."
  de.c1.unit02.lesson06.teach.vogel_untertreibung:
    title: "Frau Vogel: I am not completely thrilled. The hour is not entirely ideal."
    gloss: "Frau Vogel: I am not completely thrilled. The hour is not entirely ideal."
    note: "Frau Vogel answers with understatement: *nicht restlos begeistert* and *nicht ganz ideal* both mean she is actually annoyed, but she never says so directly."
  de.c1.unit02.lesson06.teach.felix_andeutung:
    title: "Felix: I would rather not comment on that. Management was surely well-advised."
    gloss: "Felix: I would rather not comment on that. Management was surely well-advised."
    note: "Felix agrees with Frau Vogel without saying so: *dazu sage ich lieber nichts* signals a judgement too negative to voice, and *sicher gut beraten* means management made a mistake."
  de.c1.unit02.lesson06.teach.vogel_ironie:
    title: "Frau Vogel: Oh, great. It can only get better."
    gloss: "Frau Vogel: Oh, great. It can only get better."
    note: "Frau Vogel closes with irony: *Na, großartig* and *das kann ja nur besser werden* both mean the opposite of their positive surface."
  de.c1.unit02.lesson06.teach.austausch_muster:
    title: "The complete exchange"
    gloss: "A full exchange in which neither speaker ever states their real opinion directly."
    note: "Track how nothing is said outright: irony (*interessanter Vorschlag*), understatement (*nicht restlos begeistert*), and implication (*sicher gut beraten*) all keep the judgement implicit."

exercises:
  de.c1.unit02.lesson01.exercise01.recognize_begeistert:
    instruction: "What does nicht restlos begeistert actually mean?"
    correct_option: "The speaker is annoyed, not thrilled."
    distractors: ["The speaker is genuinely thrilled.", "The speaker has no opinion.", "The speaker is asking a question."]
    accepted_answers: [{value: "The speaker is annoyed, not thrilled.", status: correct}]
    feedback: "*Nicht restlos begeistert* understates the feeling: the speaker is actually annoyed."
  de.c1.unit02.lesson01.exercise02.listen_untertreibung:
    instruction: "Listen and select the real meaning."
    correct_option: "The speaker is annoyed, not thrilled."
    distractors: ["The speaker is genuinely thrilled.", "The speaker is completely indifferent.", "The speaker is asking for a break."]
    accepted_answers: [{value: "The speaker is annoyed, not thrilled.", status: correct}]
    feedback: "*Ich bin nicht restlos begeistert* is understatement: the speaker is actually annoyed."
  de.c1.unit02.lesson01.exercise03.match_untertreibung:
    instruction: "Match each German understatement to what it actually means."
    accepted_answers:
      - value: {"nicht restlos begeistert": "not completely thrilled (i.e. actually annoyed)", "nicht ganz ideal": "not entirely ideal (i.e. actually bad)", "ein bisschen viel": "a bit much (i.e. far too much)", "etwas optimistisch": "somewhat optimistic (i.e. unrealistic)", "die Besprechung": "the meeting", "die Untertreibung": "understatement", "die Übertreibung": "exaggeration"}
        status: correct
    feedback: "Each German form says less than it means -- the real judgement is left implicit."
  de.c1.unit02.lesson01.exercise04.order_untertreibung:
    instruction: "Put the German words in order to state the understatement."
    accepted_answers:
      - {value: "Ich bin nicht restlos begeistert", status: correct}
    feedback: "*Ich bin nicht restlos begeistert* states less than the speaker means."
  de.c1.unit02.lesson01.exercise05.translate_begeistert:
    instruction: "Translate into German, using restlos: I am not completely thrilled."
    accepted_answers:
      - {value: "Ich bin nicht restlos begeistert", status: correct}
      - {value: "Ich bin nicht restlos begeistert.", status: correct}
    feedback: "*Ich bin nicht restlos begeistert* means I am not completely thrilled -- and actually annoyed."
  de.c1.unit02.lesson01.exercise06.speak_untertreibung:
    instruction: "Say aloud in German, using restlos: I am not completely thrilled."
    accepted_answers:
      - {value: "Ich bin nicht restlos begeistert", status: correct}
    feedback: "*Ich bin nicht restlos begeistert* is the understated way to say you are annoyed."
  de.c1.unit02.lesson01.exercise07.write_untertreibung:
    instruction: "Write in German, using nicht ganz ideal: The hour is not entirely ideal."
    accepted_answers:
      - {value: "Die Stunde ist nicht ganz ideal", status: correct}
      - {value: "Die Stunde ist nicht ganz ideal.", status: correct}
    feedback: "*Die Stunde ist nicht ganz ideal* means the hour is actually bad, stated politely."

  de.c1.unit02.lesson02.exercise01.recognize_interessant:
    instruction: "A colleague says this in a dry tone about the new compulsory Friday meeting. What does the sentence actually mean?"
    correct_option: "The proposal is a bad idea."
    distractors: ["The proposal is genuinely innovative.", "The speaker wants more detail.", "The speaker is asking a question."]
    accepted_answers: [{value: "The proposal is a bad idea.", status: correct}]
    feedback: "*Das ist ja ein interessanter Vorschlag* is ironic: it means the proposal is a bad idea."
  de.c1.unit02.lesson02.exercise02.listen_ironie:
    instruction: "Listen: a colleague reacts in a dry tone to the new compulsory Friday meeting. Select the real meaning."
    correct_option: "The speaker thinks the proposal is a bad idea."
    distractors: ["The speaker genuinely finds it innovative.", "The speaker is asking for more detail.", "The speaker has not read it."]
    accepted_answers: [{value: "The speaker thinks the proposal is a bad idea.", status: correct}]
    feedback: "*Das ist ja ein interessanter Vorschlag* reverses its positive surface: the speaker dislikes the proposal."
  de.c1.unit02.lesson02.exercise03.match_ironie:
    instruction: "Match each ironic German phrase to what it actually means."
    accepted_answers:
      - value: {"Das ist ja ein interessanter Vorschlag": "ironic: this proposal is actually bad", "aufschlussreich": "enlightening (ironically: stating the obvious)", "Na, großartig": "oh, great (ironically: bad news)", "Das kann ja nur besser werden": "it can only get better (ironically: it is terrible)", "die Ironie": "irony", "wörtlich": "literally"}
        status: correct
    feedback: "Each positive surface hides a negative judgement -- the context reverses the literal words."
  de.c1.unit02.lesson02.exercise04.order_ironie:
    instruction: "Put the German words in order to form the ironic remark."
    accepted_answers:
      - {value: "Das ist ja ein interessanter Vorschlag", status: correct}
    feedback: "*Das ist ja ein interessanter Vorschlag* is the ironic way to dismiss a bad idea."
  de.c1.unit02.lesson02.exercise05.translate_ironie:
    instruction: "Translate into German, ironically, using the particle ja: Now that is an interesting proposal."
    accepted_answers:
      - {value: "Das ist ja ein interessanter Vorschlag", status: correct}
      - {value: "Das ist ja ein interessanter Vorschlag.", status: correct}
    feedback: "*Das ist ja ein interessanter Vorschlag* means the opposite of what it says."
  de.c1.unit02.lesson02.exercise06.speak_ironie:
    instruction: "Say aloud in German the two ironic remarks taught in this lesson: Oh, great. It can only get better."
    accepted_answers:
      - {value: "Na, großartig. Das kann ja nur besser werden", status: correct}
      - {value: "Na, großartig. Das kann ja nur besser werden.", status: correct}
      - {value: "Na, grossartig. Das kann ja nur besser werden", status: correct}
    feedback: "Both halves are ironic: *Na, großartig* and *das kann ja nur besser werden* mean the situation is bad."
  de.c1.unit02.lesson02.exercise07.write_ironie:
    instruction: "Write in German, ironically, using the particle ja: Now that is an interesting proposal."
    accepted_answers:
      - {value: "Das ist ja ein interessanter Vorschlag", status: correct}
      - {value: "Das ist ja ein interessanter Vorschlag.", status: correct}
    feedback: "*Das ist ja ein interessanter Vorschlag* is ironic dismissal: the proposal is a bad idea."

  de.c1.unit02.lesson03.exercise01.recognize_wenn_sie_meinen:
    instruction: "What does Wenn Sie meinen actually signal?"
    correct_option: "The speaker disagrees but will not argue."
    distractors: ["The speaker fully agrees.", "The speaker wants more information.", "The speaker is greeting someone."]
    accepted_answers: [{value: "The speaker disagrees but will not argue.", status: correct}]
    feedback: "*Wenn Sie meinen* concedes the words but not the point: the speaker disagrees without arguing."
  de.c1.unit02.lesson03.exercise02.listen_gut_beraten:
    instruction: "Listen: a colleague comments in a dry tone on management's new compulsory Friday meeting. Select the real meaning."
    correct_option: "Management made a mistake."
    distractors: ["Management was wise.", "Management asked for advice.", "Management has not decided yet."]
    accepted_answers: [{value: "Management made a mistake.", status: correct}]
    feedback: "*Sicher gut beraten* is ironic: it means management made a bad decision."
  de.c1.unit02.lesson03.exercise03.match_andeutung:
    instruction: "Match each German implication to what it actually conveys."
    accepted_answers:
