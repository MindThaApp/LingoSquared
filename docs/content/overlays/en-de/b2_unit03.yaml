course:
  title: German B2
  description: >-
    Upper-intermediate German: express nuance -- soften a statement
    (eigentlich, ziemlich, ein bisschen, ich würde sagen), hedge it
    tentatively (einigermaßen, in gewisser Weise, es scheint, dass,
    vermutlich), emphasize it (wirklich, sehr, äußerst, absolut), or focus
    it (es ist ..., der/die ...; was mir daran gefällt, ist ...; durchaus)
    -- around a colleague's opinion of a new work proposal.

units:
  de.b2.unit03.nuance:
    title: "Nuance"
    description: Soften or strengthen a statement -- hedging, qualification, emphasis, and focus constructions -- so the same content can be delivered tentatively, neutrally, or emphatically.

lessons:
  de.b2.unit03.lesson01.abschwaechen:
    title: "Softening"
  de.b2.unit03.lesson02.vorsichtig_sein:
    title: "Being cautious"
  de.b2.unit03.lesson03.betonen:
    title: "Emphasizing"
  de.b2.unit03.lesson04.fokus_setzen:
    title: "Setting focus"
  de.b2.unit03.lesson05.eine_rueckmeldung_lesen:
    title: "Reading feedback"
  de.b2.unit03.lesson06.im_gespraech_nuancieren:
    title: "Nuancing in conversation"

teaching:
  de.b2.unit03.lesson01.teach.base_claim:
    title: "The proposal is good."
    gloss: "The proposal is good."
    note: "The base claim this whole unit will soften, emphasize, and focus in different ways -- about a new work proposal Felix and Frau Vogel are discussing."
  de.b2.unit03.lesson01.teach.eigentlich:
    title: "actually / technically"
    gloss: "actually / technically"
    note: "*Eigentlich* softens a claim toward 'if you look closely' -- a genuine B2 hedge. It is a false friend for English 'eventually', which it never means."
    example_gloss: "The proposal is actually good."
  de.b2.unit03.lesson01.teach.ziemlich:
    title: "fairly / quite"
    gloss: "fairly / quite"
    example_gloss: "The proposal is fairly good."
  de.b2.unit03.lesson01.teach.ein_bisschen:
    title: "a little"
    gloss: "a little"
    example_gloss: "The proposal is a little complicated."
  de.b2.unit03.lesson01.teach.eher:
    title: "rather / more like"
    gloss: "rather / more like"
    note: "*Eher* frames a claim as the more accurate of two options: 'more like average than great'."
    example_gloss: "The proposal is rather average."
  de.b2.unit03.lesson01.teach.ich_wuerde_sagen:
    title: "I would say"
    gloss: "I would say"
    note: "*Ich würde sagen* (subjunctive II) distances you slightly from a blunt claim -- a softer way to state an opinion than a flat *ist*."
    example_gloss: "I would say the proposal is okay."
  de.b2.unit03.lesson01.teach.grammar_abschwaechen:
    title: "The proposal is actually fairly good, but a little complicated. I would say it is rather good."
    gloss: "The proposal is actually fairly good, but a little complicated. I would say it is rather good."
    note: "Softening lowers your commitment to a claim without abandoning it -- *eigentlich*, *ziemlich*, *ein bisschen*, *eher*, and *ich würde sagen* all hedge in slightly different ways."

  de.b2.unit03.lesson02.teach.einigermassen:
    title: "somewhat / to some extent"
    gloss: "somewhat / to some extent"
    example_gloss: "The proposal is somewhat convincing."
  de.b2.unit03.lesson02.teach.in_gewisser_weise:
    title: "in a certain way"
    gloss: "in a certain way"
    note: "*In gewisser Weise* concedes a point is true in some respect, without fully committing to it."
    example_gloss: "In a certain way, he's right."
  de.b2.unit03.lesson02.teach.es_scheint_dass:
    title: "it seems that..."
    gloss: "it seems that..."
    note: "*Es scheint, dass...* reports an impression rather than a stated fact -- the *dass* sends the following verb to the end."
    example_gloss: "It seems that the proposal works."
  de.b2.unit03.lesson02.teach.vermutlich:
    title: presumably
    gloss: presumably
    example_gloss: "The proposal is presumably good."
  de.b2.unit03.lesson02.teach.nuetzlich:
    title: useful
    gloss: useful
    example_gloss: "The proposal is useful for the team."
  de.b2.unit03.lesson02.teach.grammar_vorsichtig:
    title: "It seems that the proposal is somewhat convincing. Presumably it is in a certain way useful."
    gloss: "It seems that the proposal is somewhat convincing. Presumably it is in a certain way useful."
    note: "Being tentative reports an impression rather than a stated fact -- *einigermaßen*, *in gewisser Weise*, *es scheint, dass*, and *vermutlich* all keep your claim provisional."

  de.b2.unit03.lesson03.teach.wirklich:
    title: really
    gloss: really
    example_gloss: "The proposal is really good."
  de.b2.unit03.lesson03.teach.sehr:
    title: very
    gloss: very
    note: "*Wirklich sehr* stacks two intensifiers together -- redundant-looking in English, but natural, idiomatic emphasis in German."
    example_gloss: "The proposal is very good."
  de.b2.unit03.lesson03.teach.aeusserst:
    title: extremely
    gloss: extremely
    example_gloss: "The proposal is extremely convincing."
  de.b2.unit03.lesson03.teach.absolut:
    title: absolutely
    gloss: absolutely
    example_gloss: "I am absolutely sure."
  de.b2.unit03.lesson03.teach.total:
    title: "totally (informal)"
    gloss: "totally (informal)"
    note: "*Total* is a casual, spoken-register intensifier -- appropriate in relaxed conversation, less so in a written report."
    example_gloss: "This is totally right."
  de.b2.unit03.lesson03.teach.grammar_betonen:
    title: "The proposal is really very good. I am absolutely sure this is extremely useful."
    gloss: "The proposal is really very good. I am absolutely sure this is extremely useful."
    note: "Emphasis strengthens a claim -- *wirklich*, *sehr*, *äußerst*, *absolut*, and *total* all intensify, from everyday (*wirklich*, *sehr*) to strong and formal (*äußerst*, *absolut*) to casual (*total*)."

  de.b2.unit03.lesson04.teach.cleft_der_vorschlag:
    title: "It is the proposal that convinces."
    gloss: "It is the proposal that convinces."
    note: "German it-cleft: *Es ist X, der/die/das ...* -- the relative pronoun agrees with X's gender. *Der Vorschlag* is masculine, so: *der überzeugt*."
  de.b2.unit03.lesson04.teach.cleft_die_idee:
    title: "It is the idea that convinces."
    gloss: "It is the idea that convinces."
    note: "Same construction, feminine this time: *die Idee* -> *die überzeugt*. Compare the masculine card above -- the pronoun must match the noun's gender, not just repeat 'die'."
  de.b2.unit03.lesson04.teach.was_mir_daran_gefaellt:
    title: "What I like about it is..."
    gloss: "What I like about it is..."
    note: "A pseudo-cleft: *was mir daran gefällt* ('what pleases me about it') fronts the whole clause, then *ist* introduces what you're singling out."
  de.b2.unit03.lesson04.teach.gerade:
    title: "precisely / just"
    gloss: "precisely / just"
    example_gloss: "That's precisely what I like."
  de.b2.unit03.lesson04.teach.wichtig:
    title: important
    gloss: important
    example_gloss: "That is important for the team."
  de.b2.unit03.lesson04.teach.durchaus:
    title: "indeed / definitely"
    gloss: "indeed / definitely"
    note: "*Durchaus* affirms a claim against an implied doubt -- 'yes, it really is X (whatever you might think)'. Stronger and more pointed than plain *sehr*."
    example_gloss: "That is indeed important."
  de.b2.unit03.lesson04.teach.grammar_fokus:
    title: "It is the idea that convinces. What I like about it is the clarity. That is indeed important."
    gloss: "It is the idea that convinces. What I like about it is the clarity. That is indeed important."
    note: "Focus constructions single out exactly which part of a statement matters most -- the it-cleft (*es ist ..., der/die ...*), the pseudo-cleft (*was ... ist*), and doubt-affirming *durchaus* all draw attention to one element."

  de.b2.unit03.lesson05.teach.text:
    title: "Reading: feedback on the proposal"
    gloss: "The proposal is actually fairly good, but some points are a little complicated. It seems that the team presumably likes it. What I really like is the clarity -- extremely useful for everyone. It is the structure that absolutely convinces."
    glosses:
      einige: some
      Punkte: points
      Team: team
      mag: "likes (from mögen)"
      Struktur: structure
      alle: everyone

  de.b2.unit03.lesson06.teach.was_denken_sie:
    title: "What do you think about the proposal?"
    gloss: "What do you think about the proposal?"
  de.b2.unit03.lesson06.teach.ihn:
    title: "it (masculine object)"
    gloss: "it (masculine accusative object pronoun, referring to der Vorschlag)"
    example_gloss: "I find it really very good."
  de.b2.unit03.lesson06.teach.da_haben_sie_recht:
    title: "You're right about that."
    gloss: "You're right about that."
  de.b2.unit03.lesson06.teach.dialogue_felix_ask:
    title: "Felix: What do you think about the proposal?"
    gloss: "Felix: What do you think about the proposal?"
  de.b2.unit03.lesson06.teach.dialogue_vogel_hedge:
    title: "Frau Vogel: It's actually fairly good, but I would say it's still a little complicated."
    gloss: "Frau Vogel: It's actually fairly good, but I would say it's still a little complicated."
  de.b2.unit03.lesson06.teach.dialogue_felix_emphasis:
    title: "Felix: I find it really very good. What I like about it is the clarity."
    gloss: "Felix: I find it really very good. What I like about it is the clarity."
  de.b2.unit03.lesson06.teach.dialogue_vogel_focus:
    title: "Frau Vogel: You're right about that. It's the idea that really convinces."
    gloss: "Frau Vogel: You're right about that. It's the idea that really convinces."
  de.b2.unit03.lesson06.teach.grammar_nuance:
    title: "The proposal is actually fairly good. The proposal is really very good. It is the idea that convinces."
    gloss: "The proposal is actually fairly good. The proposal is really very good. It is the idea that convinces."
    note: "The same underlying opinion can be delivered hedged, emphasized, or focused -- the propositional content stays constant while the stance shifts."

exercises:
  de.b2.unit03.lesson01.exercise01.recognize_eigentlich:
    instruction: "What does this word mean?"
    correct_option: "actually / technically"
    distractors: [eventually, "never / not at all", certainly]
    accepted_answers: [{value: "actually / technically", status: correct}]
    feedback: "Eigentlich means actually / technically -- a false friend for English 'eventually'."
  de.b2.unit03.lesson01.exercise02.listen_eigentlich_ziemlich:
    instruction: "Listen and select what you hear."
    correct_option: "The proposal is actually fairly good."
    distractors: ["The proposal is really very good.", "The proposal is a little complicated.", "The proposal is rather average."]
    accepted_answers: [{value: "The proposal is actually fairly good.", status: correct}]
    feedback: "Der Vorschlag ist eigentlich ziemlich gut means the proposal is actually fairly good."
  de.b2.unit03.lesson01.exercise03.match_hedges:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {eigentlich: "actually / technically", ziemlich: "fairly / quite", "ein bisschen": "a little", eher: "rather / more like", "ich würde sagen": "I would say", kompliziert: complicated}
        status: correct
    feedback: "These are this lesson's softening words."
  de.b2.unit03.lesson01.exercise04.order_eigentlich_ziemlich:
    instruction: "Put the words in order: The proposal is actually fairly good."
    accepted_answers:
      - {value: "Der Vorschlag ist eigentlich ziemlich gut", status: correct}
      - {value: "Eigentlich ist der Vorschlag ziemlich gut", status: correct}
    feedback: "Der Vorschlag ist eigentlich ziemlich gut means the proposal is actually fairly good."
  de.b2.unit03.lesson01.exercise05.translate_eher:
    instruction: "Translate into German, using eher: The proposal is rather average."
    accepted_answers:
      - {value: "Der Vorschlag ist eher durchschnittlich", status: correct}
    feedback: "Der Vorschlag ist eher durchschnittlich means the proposal is rather average."
  de.b2.unit03.lesson01.exercise06.write_ein_bisschen:
    instruction: "Write in German, softening your opinion: The proposal is a little complicated."
    accepted_answers:
      - {value: "Der Vorschlag ist ein bisschen kompliziert", status: correct}
      - {value: "Der Vorschlag ist etwas kompliziert", status: correct}
    feedback: "Der Vorschlag ist ein bisschen kompliziert means the proposal is a little complicated."
  de.b2.unit03.lesson01.exercise07.speak_ich_wuerde_sagen:
    instruction: "Say aloud in German, using ich würde sagen: I would say the proposal is okay."
    accepted_answers:
      - {value: "Ich würde sagen, der Vorschlag ist okay", status: correct}
      - {value: "Ich würde sagen der Vorschlag ist okay", status: correct}
      - {value: "Ich würde sagen, dass der Vorschlag okay ist", status: correct}
    feedback: "Ich würde sagen, der Vorschlag ist okay means I would say the proposal is okay."
  de.b2.unit03.lesson01.exercise08.dictation_eigentlich_ziemlich:
    instruction: "Type what you hear."
    correct_response: "Der Vorschlag ist eigentlich ziemlich gut"
    orthography_strict: true
    feedback: "You heard Der Vorschlag ist eigentlich ziemlich gut — the proposal is actually fairly good."

  de.b2.unit03.lesson02.exercise01.recognize_einigermassen:
    instruction: "What does this word mean?"
    correct_option: "somewhat / to some extent"
    distractors: [completely, never, certainly]
    accepted_answers: [{value: "somewhat / to some extent", status: correct}]
    feedback: "Einigermaßen means somewhat / to some extent."
  de.b2.unit03.lesson02.exercise02.listen_es_scheint:
    instruction: "Listen and select what you hear."
    correct_option: "It seems that the proposal works."
    distractors: ["It seems that the proposal fails.", "The proposal definitely works.", "It seems that the proposal is complicated."]
    accepted_answers: [{value: "It seems that the proposal works.", status: correct}]
    feedback: "Es scheint, dass der Vorschlag funktioniert means it seems that the proposal works."
  de.b2.unit03.lesson02.exercise03.match_tentative:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {einigermaßen: "somewhat / to some extent", "in gewisser Weise": "in a certain way", "es scheint, dass...": "it seems that...", vermutlich: presumably, überzeugend: convincing, nützlich: useful}
        status: correct
    feedback: "These are this lesson's tentative-hedging words."
  de.b2.unit03.lesson02.exercise04.order_es_scheint:
    instruction: "Put the words in order: It seems that the proposal works."
    accepted_answers:
      - {value: "Es scheint dass der Vorschlag funktioniert", status: correct}
    feedback: "Es scheint, dass der Vorschlag funktioniert means it seems that the proposal works."
  de.b2.unit03.lesson02.exercise05.translate_vermutlich:
    instruction: "Translate into German, using vermutlich: The proposal is presumably useful."
    accepted_answers:
      - {value: "Der Vorschlag ist vermutlich nützlich", status: correct}
      - {value: "Der Vorschlag ist vermutlich nuetzlich", status: correct}
      - {value: "Vermutlich ist der Vorschlag nützlich", status: correct}
      - {value: "Vermutlich ist der Vorschlag nuetzlich", status: correct}
    feedback: "Der Vorschlag ist vermutlich nützlich means the proposal is presumably useful."
  de.b2.unit03.lesson02.exercise06.speak_in_gewisser_weise:
    instruction: "Say aloud in German, using in gewisser Weise: In a certain way, he's right."
    accepted_answers:
      - {value: "In gewisser Weise hat er recht", status: correct}
    feedback: "In gewisser Weise hat er recht means in a certain way, he's right."
  de.b2.unit03.lesson02.exercise07.write_es_scheint_einigermassen:
    instruction: "Write in German, hedging your opinion: It seems that the proposal is somewhat convincing."
    accepted_answers:
      - {value: "Es scheint, dass der Vorschlag einigermaßen überzeugend ist", status: correct}
      - {value: "Es scheint, dass der Vorschlag einigermassen überzeugend ist", status: correct}
      - {value: "Es scheint, dass der Vorschlag einigermassen ueberzeugend ist", status: correct}
    feedback: "Es scheint, dass der Vorschlag einigermaßen überzeugend ist means it seems that the proposal is somewhat convincing."

  de.b2.unit03.lesson03.exercise01.recognize_aeusserst:
    instruction: "What does this word mean?"
    correct_option: extremely
    distractors: [rarely, "a little", presumably]
    accepted_answers: [{value: extremely, status: correct}]
    feedback: "Äußerst means extremely -- a strong, fairly formal intensifier."
  de.b2.unit03.lesson03.exercise02.listen_wirklich_sehr:
    instruction: "Listen and select what you hear."
    correct_option: "The proposal is really very good."
    distractors: ["The proposal is actually fairly good.", "The proposal is somewhat convincing.", "The proposal is a little complicated."]
    accepted_answers: [{value: "The proposal is really very good.", status: correct}]
    feedback: "Der Vorschlag ist wirklich sehr gut means the proposal is really very good."
  de.b2.unit03.lesson03.exercise03.match_emphasis:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {wirklich: really, sehr: very, äußerst: extremely, absolut: absolutely, total: "totally (informal)", richtig: right}
        status: correct
    feedback: "These are this lesson's emphasis words."
  de.b2.unit03.lesson03.exercise04.order_wirklich_sehr:
    instruction: "Put the words in order: The proposal is really very good."
    accepted_answers:
      - {value: "Der Vorschlag ist wirklich sehr gut", status: correct}
    feedback: "Der Vorschlag ist wirklich sehr gut means the proposal is really very good."
  de.b2.unit03.lesson03.exercise05.translate_aeusserst:
    instruction: "Translate into German, using äußerst: The proposal is extremely convincing."
    accepted_answers:
      - {value: "Der Vorschlag ist äußerst überzeugend", status: correct}
      - {value: "Der Vorschlag ist aeusserst ueberzeugend", status: correct}
    feedback: "Der Vorschlag ist äußerst überzeugend means the proposal is extremely convincing."
  de.b2.unit03.lesson03.exercise06.write_total_richtig:
    instruction: "Write in German, emphasizing informally: This is totally right."
    accepted_answers:
      - {value: "Das ist total richtig", status: correct}
    feedback: "Das ist total richtig means this is totally right."
  de.b2.unit03.lesson03.exercise07.speak_absolut_sicher:
    instruction: "Say aloud in German, using absolut: I am absolutely sure."
    accepted_answers:
      - {value: "Ich bin absolut sicher", status: correct}
      - {value: "Ich bin mir absolut sicher", status: correct}
    feedback: "Ich bin absolut sicher means I am absolutely sure."
  de.b2.unit03.lesson03.exercise08.dictation_wirklich_sehr:
    instruction: "Type what you hear."
    correct_response: "Der Vorschlag ist wirklich sehr gut"
    orthography_strict: true
    feedback: "You heard Der Vorschlag ist wirklich sehr gut — the proposal is really very good."

  de.b2.unit03.lesson04.exercise01.recognize_durchaus:
    instruction: "What does this word mean?"
    correct_option: "indeed / definitely"
    distractors: [rarely, never, possibly]
    accepted_answers: [{value: "indeed / definitely", status: correct}]
    feedback: "Durchaus means indeed / definitely -- it affirms a claim against an implied doubt."
  de.b2.unit03.lesson04.exercise02.listen_cleft_idee:
    instruction: "Listen and select what you hear."
    correct_option: "It is the idea that convinces."
    distractors: ["It is the proposal that convinces.", "It is the structure that convinces.", "It is the team that convinces."]
    accepted_answers: [{value: "It is the idea that convinces.", status: correct}]
    feedback: "Es ist die Idee, die überzeugt means it is the idea that convinces."
  de.b2.unit03.lesson04.exercise03.match_focus:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {"Es ist der Vorschlag, der...": "It is the proposal that...", "Es ist die Idee, die...": "It is the idea that...", "Was mir daran gefällt, ist...": "What I like about it is...", gerade: "precisely / just", durchaus: "indeed / definitely", überzeugt: convinces}
        status: correct
    feedback: "These are this lesson's focus words."
  de.b2.unit03.lesson04.exercise04.order_cleft_idee:
    instruction: "Put the words in order: It is the idea that convinces."
    accepted_answers:
      - {value: "Es ist die Idee die überzeugt", status: correct}
      - {value: "Die Idee ist es die überzeugt", status: correct}
    feedback: "Es ist die Idee, die überzeugt means it is the idea that convinces."
  de.b2.unit03.lesson04.exercise05.translate_was_mir_gefaellt:
    instruction: "Translate into German, using was mir daran gefällt, ist: What I like about it is the idea."
    accepted_answers:
      - {value: "Was mir daran gefällt, ist die Idee", status: correct}
      - {value: "Was mir daran gefaellt, ist die Idee", status: correct}
