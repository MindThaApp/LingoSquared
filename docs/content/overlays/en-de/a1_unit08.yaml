      - {value: "Die Äpfel kosten 2€ das Pfund", status: "correct"}
      - {value: "Die Äpfel kosten 2 € pro Pfund", status: "correct"}
      - {value: "Die Äpfel kosten 2 € das Pfund", status: "correct"}
