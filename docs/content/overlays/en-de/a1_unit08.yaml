course:
  title: "German A1"
  description: "Learn A1-level German for everyday greetings and short social exchanges, with detailed English explanations."

units:
  de.a1.unit08.einkaufen: {title: "Shopping: prices and quantities"}

teaching:
  de.a1.unit08.lesson01.teach.ein_pfund: {title: "ein Pfund Äpfel", gloss: "a pound of apples", note: "*Pfund* is still commonly used informally in Germany for a pound (about 500g), even though the country is officially metric."}
  de.a1.unit08.lesson01.teach.ein_dutzend: {title: "ein Dutzend Eier", gloss: "a dozen eggs", note: "*Dutzend* means dozen (twelve)."}
  de.a1.unit08.lesson01.teach.eine_flasche: {title: "eine Flasche Wasser", gloss: "a bottle of water", note: "*Flasche* means bottle."}
  de.a1.unit08.lesson01.teach.eine_tuete: {title: "eine Tüte Reis", gloss: "a bag of rice", note: "*Tüte* means bag."}
  de.a1.unit08.lesson01.teach.ein_kilo: {title: "ein Kilo Tomaten", gloss: "a kilo of tomatoes", note: "*Kilo* is the standard metric weight unit, used far more than *Pfund* for anything beyond casual, everyday quantities."}

  de.a1.unit08.lesson02.teach.was_kosten_die_aepfel: {title: "Was kosten die Äpfel?", gloss: "How much are the apples?", note: "*kosten* means 'to cost' -- literally 'What cost the apples?'"}
  de.a1.unit08.lesson02.teach.sie_kosten_zwei_euro: {title: "Sie kosten zwei Euro das Pfund.", gloss: "They're two euros a pound.", note: "*Sie* here means 'they' (referring to the apples), not the formal 'you' -- German conjugates 'Sie'/'sie' identically in every verb form, so only sentence context resolves this: the apples, not a person, are the subject being discussed here."}
  de.a1.unit08.lesson02.teach.kann_ich_zwei_pfund: {title: "Kann ich zwei Pfund haben, bitte?", gloss: "Can I have two pounds, please?", note: "A polite request pattern, similar to *Ich möchte..., bitte* from unit07."}
  de.a1.unit08.lesson02.teach.ist_es_frisch: {title: "Ist es frisch?", gloss: "Is it fresh?", note: "*frisch* means fresh. *es* here agrees with a neuter noun (like das Brot); asking about a masculine item you'd say *Ist er frisch?* (der Reis) and about a feminine item *Ist sie frisch?* (die Milch) -- the pronoun changes with the noun's gender, not fixed to *es*."}

  de.a1.unit08.lesson03.teach.pro_pfund: {title: "pro Pfund", gloss: "per pound", note: "*pro* means 'per' -- used on price labels and in spoken prices alike.", example_gloss: "Apples cost two euros per pound."}
  de.a1.unit08.lesson03.teach.preisschild_text: {title: "Markt-Preisschild", gloss: "Market price sign", note: "A simple price sign listing three items with their unit prices."}

  de.a1.unit08.lesson04.teach.das_macht_acht_euro: {title: "Das macht acht Euro.", gloss: "That's eight euros.", note: "*Das macht...* is the standard way to state a total price, already seen in unit07."}
  de.a1.unit08.lesson04.teach.line01: {title: "Felix fragt nach dem Preis", gloss: "Felix: Was kosten die Äpfel?", note: "Same question as lesson02, now in a real conversation."}
  de.a1.unit08.lesson04.teach.line02: {title: "Antwort zum Preis", gloss: "Anna: Sie kosten zwei Euro das Pfund.", note: "A complete answer states the price per unit."}
  de.a1.unit08.lesson04.teach.line03: {title: "Felix bestellt", gloss: "Felix: Gut, kann ich zwei Pfund haben, bitte?", note: "*Gut* here means 'okay/good,' accepting the price before ordering."}
  de.a1.unit08.lesson04.teach.line04: {title: "Anna fragt nach mehr", gloss: "Anna: Natürlich. Sonst noch etwas?", note: "*Natürlich* means 'of course/naturally.'"}
  de.a1.unit08.lesson04.teach.line05: {title: "Felix bestellt mehr", gloss: "Felix: Ja, auch ein Dutzend Eier.", note: "*auch* means 'also/too.'"}
  de.a1.unit08.lesson04.teach.line06: {title: "Anna nennt die Gesamtsumme", gloss: "Anna: Das macht acht Euro.", note: "Two pounds of apples (4€) plus a dozen eggs (4€) totals eight euros."}

exercises:
  de.a1.unit08.lesson01.exercise01.listen_menge:
    instruction: "Listen and select the quantity phrase you hear."
    correct_option: "ein Dutzend Eier"
    distractors: ["ein Pfund Äpfel", "eine Flasche Wasser", "ein Kilo Tomaten"]
    accepted_answers: [{value: "ein Dutzend Eier", status: "correct"}]
    feedback: "*ein Dutzend Eier* means 'a dozen eggs.'"
  de.a1.unit08.lesson01.exercise02.choose_dutzend:
    instruction: "Twelve eggs together are called..."
    correct_option: "ein Dutzend"
    distractors: ["ein Pfund", "eine Flasche", "eine Tüte"]
    accepted_answers: [{value: "ein Dutzend", status: "correct"}]
    feedback: "*ein Dutzend* means 'a dozen.'"
  de.a1.unit08.lesson01.exercise03.choose_flasche:
    instruction: "Which phrase means one container of water?"
    correct_option: "eine Flasche Wasser"
    distractors: ["eine Tüte Wasser", "ein Kilo Wasser", "ein Pfund Wasser"]
    accepted_answers: [{value: "eine Flasche Wasser", status: "correct"}]
    feedback: "*eine Flasche Wasser* means 'a bottle of water.'"
  de.a1.unit08.lesson01.exercise04.match_mengen:
    instruction: "Match each description to the correct word."
    accepted_answers:
      - value:
          - {left: "weight unit for apples", right: "Pfund"}
          - {left: "twelve of something", right: "Dutzend"}
          - {left: "container for water", right: "Flasche"}
          - {left: "container for rice", right: "Tüte"}
          - {left: "weight unit for tomatoes", right: "Kilo"}
          - {left: "unit of money used to pay for things", right: "Euro"}
        status: "correct"
    feedback: "*Pfund*=pound, *Dutzend*=dozen, *Flasche*=bottle, *Tüte*=bag, *Kilo*=kilo, *Euro*=euro."
  de.a1.unit08.lesson01.exercise05.write_kilo:
    instruction: "Write how you ask for one kilo of tomatoes."
    accepted_answers:
      - {value: "ein Kilo Tomaten", status: "correct"}
      - {value: "ein Kilo Tomaten.", status: "correct"}
    feedback: "*ein Kilo Tomaten* means 'a kilo of tomatoes.'"

  de.a1.unit08.lesson02.exercise01.listen_preisfrage:
    instruction: "Listen and select the question you hear."
    correct_option: "Was kosten die Äpfel"
    distractors: ["Kann ich zwei Pfund haben, bitte", "Ist es frisch", "Sie kosten zwei Euro das Pfund"]
    accepted_answers: [{value: "Was kosten die Äpfel", status: "correct"}]
    feedback: "*Was kosten die Äpfel?* means 'How much are the apples?'"
  de.a1.unit08.lesson02.exercise02.listen_preisantwort:
    instruction: "Listen and select the answer you hear."
    correct_option: "Sie kosten zwei Euro das Pfund"
    distractors: ["Was kosten die Äpfel", "Kann ich zwei Pfund haben, bitte", "Ist es frisch"]
    accepted_answers: [{value: "Sie kosten zwei Euro das Pfund", status: "correct"}]
    feedback: "*Sie kosten zwei Euro das Pfund* means 'They're two euros a pound.'"
  de.a1.unit08.lesson02.exercise03.order_preisfrage:
    instruction: "Put the words in order to ask 'How much are the apples?'"
    accepted_answers: [{value: ["Was", "kosten", "die", "Äpfel"], status: "correct"}]
    feedback: "The correct order is *Was kosten die Äpfel?*"
  de.a1.unit08.lesson02.exercise04.reply_preis:
    instruction: "Felix asks: Was kosten die Äpfel? Reply: they're two euros a pound."
    accepted_answers:
      - {value: "Sie kosten zwei Euro das Pfund.", status: "correct"}
      - {value: "Sie kosten zwei Euro das Pfund", status: "correct"}
    feedback: "*Sie kosten zwei Euro das Pfund* means 'They're two euros a pound.'"
  de.a1.unit08.lesson02.exercise05.write_anfrage:
    instruction: "Write how you politely ask for two pounds."
    accepted_answers:
      - {value: "Kann ich zwei Pfund haben, bitte?", status: "correct"}
      - {value: "Kann ich zwei Pfund haben, bitte", status: "correct"}
    feedback: "*Kann ich zwei Pfund haben, bitte?* means 'Can I have two pounds, please?'"

  de.a1.unit08.lesson03.exercise01.read_apfel_preis:
    instruction: "How much are apples per pound?"
    correct_option: "2€"
    distractors: ["4€", "3€", "1€"]
    accepted_answers: [{value: "2€", status: "correct"}]
    feedback: "The sign lists *Äpfel - 2€ pro Pfund* -- apples are 2€ per pound."
  de.a1.unit08.lesson03.exercise02.read_eier_preis:
    instruction: "How much is a dozen eggs?"
    correct_option: "4€"
    distractors: ["2€", "3€", "8€"]
    accepted_answers: [{value: "4€", status: "correct"}]
    feedback: "The sign lists *Eier - 4€ das Dutzend* -- a dozen eggs is 4€."
  de.a1.unit08.lesson03.exercise03.choose_billigstes_produkt:
    instruction: "Which item is the cheapest?"
    correct_option: "Äpfel"
    distractors: ["Eier", "Reis", "Tomaten"]
    accepted_answers: [{value: "Äpfel", status: "correct"}]
    feedback: "*Äpfel* at 2€ per pound is the cheapest of the three listed items."
  de.a1.unit08.lesson03.exercise04.match_preisschilder:
    instruction: "Match each item to its price."
    accepted_answers:
      - value:
          - {left: "Äpfel", right: "2€ pro Pfund"}
          - {left: "Eier", right: "4€ das Dutzend"}
          - {left: "Reis", right: "3€ die Tüte"}
          - {left: "Wasser", right: "sold by the bottle"}
          - {left: "Tomaten", right: "sold by the kilo"}
          - {left: "most expensive product on the sign", right: "Eier"}
        status: "correct"
    feedback: "*Äpfel*=2€/*Pfund*, *Eier*=4€/*Dutzend*, *Reis*=3€/*Tüte* -- and *Eier* is the most expensive of the three."
  de.a1.unit08.lesson03.exercise05.write_apfel_gesamt:
    instruction: "Write the price of apples per pound."
    accepted_answers:
      - {value: "Äpfel kosten 2€ pro Pfund", status: "correct"}
      - {value: "Äpfel kosten 2€ pro Pfund.", status: "correct"}
    feedback: "*Äpfel kosten 2€ pro Pfund* means 'Apples cost 2€ per pound.'"

  de.a1.unit08.lesson04.exercise01.listen_apfel_preis:
    instruction: "Listen to the dialogue. How much does Anna say the apples cost?"
    correct_option: "Sie kosten zwei Euro das Pfund"
    distractors: ["Das macht acht Euro", "Was kosten die Äpfel", "Sonst noch etwas"]
    accepted_answers: [{value: "Sie kosten zwei Euro das Pfund", status: "correct"}]
    feedback: "Anna says *Sie kosten zwei Euro das Pfund* -- 'They're two euros a pound.'"
  de.a1.unit08.lesson04.exercise02.listen_gesamtsumme:
    instruction: "Listen again. What's the total price?"
    correct_option: "Das macht acht Euro"
    distractors: ["Was kosten die Äpfel", "Sonst noch etwas", "Ja, auch ein Dutzend Eier"]
    accepted_answers: [{value: "Das macht acht Euro", status: "correct"}]
    feedback: "*Das macht acht Euro* means 'That's eight euros.'"
  de.a1.unit08.lesson04.exercise03.choose_zusatzartikel:
    instruction: "What else does Felix buy besides apples?"
    correct_option: "ein Dutzend Eier"
    distractors: ["eine Flasche Wasser", "eine Tüte Reis", "ein Kilo Tomaten"]
    accepted_answers: [{value: "ein Dutzend Eier", status: "correct"}]
    feedback: "*ein Dutzend Eier* means 'a dozen eggs.'"
  de.a1.unit08.lesson04.exercise04.order_pfund_anfrage:
    instruction: "Put the words in order to say 'Can I have two pounds, please?'"
    accepted_answers: [{value: ["Kann", "ich", "zwei", "Pfund", "haben", "bitte"], status: "correct"}]
    feedback: "The correct order is *Kann ich zwei Pfund haben, bitte?*"
  de.a1.unit08.lesson04.exercise05.reply_als_anna:
    instruction: "Felix asks: Was kosten die Äpfel? Kann ich zwei Pfund haben, bitte? Ja, auch ein Dutzend Eier. Reply as Anna: state the price per pound, agree, ask if that's all, then give the total."
    accepted_answers:
      - {value: "Sie kosten zwei Euro das Pfund. Natürlich. Sonst noch etwas? Das macht acht Euro.", status: "correct"}
      - {value: "Sie kosten zwei Euro das Pfund Natürlich Sonst noch etwas Das macht acht Euro", status: "correct"}
    feedback: "Anna's full reply gives the price, confirms the order, asks if that's all, and states the total."
  de.a1.unit08.lesson04.exercise06.speak_einkauf:
    instruction: "Answer out loud in Anna's role: state the price per pound, agree, ask if that's all, then give the total."
    accepted_answers:
      - {value: "Sie kosten zwei Euro das Pfund Natürlich Sonst noch etwas Das macht acht Euro", status: "correct"}
      - {value: "Sie kosten zwei Euro das Pfund. Natürlich. Sonst noch etwas? Das macht acht Euro.", status: "correct"}
    feedback: "This full answer covers the price, the order confirmation, and the total."
