    title: Sport treiben vs. spielen / machen
    gloss: 'You already know Sport treiben from the hobbies lesson (Ich treibe samstags Sport). With a specific sport you name it with spielen or machen: Ich spiele Fußball. Both are correct German.'
    note: '*Sport treiben* is reused from the hobbies unit, not new. It is the general way to talk about exercise, while spielen, machen and gehen name the specific sport.'
