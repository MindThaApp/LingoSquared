    title: Mal pro Woche vs. jeden Tag / oft
    gloss: You already know jeden Tag (every day) and oft (often). Zwei Mal pro Woche (twice a week) is a new, more specific way to say how often.
    note: Extends the frequency vocabulary already established in the hobbies unit.
