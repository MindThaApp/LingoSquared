status: complete_draft
review: {"status": "unreviewed", "required_next_reviewer": "native_speaker_review", "notes": "English overlay for the past-perfect unit (hatte/war plus participle, schon, nachdem). OPEN NATIVE QUESTIONS: none beyond the realization notes."}
course:
  title: "German A2"
  description: "Grammar-led A2 German continuing the Anna and Felix storyline."
  learning_goal: "Talk about the past in German with the perfect, the simple past and the past perfect."
units:
  de.a2.unit102.nachdem: {"title": "The Train Had Already Gone", "description": "Explain that something had already happened before a certain point, with the past perfect (hatte/war plus participle), schon and nachdem."}
lessons:
  de.a2.unit102.lesson01.hatte_gegessen: {"title": "I Had Eaten"}
  de.a2.unit102.lesson02.als_schon: {"title": "When I Arrived, the Train Had Gone"}
  de.a2.unit102.lesson03.nachdem: {"title": "After"}
  de.a2.unit102.lesson04.vorher_nachher: {"title": "What Had Happened Before?"}
  de.a2.unit102.lesson05.felix_hat_pech: {"title": "Felix Has Bad Luck"}
  de.a2.unit102.lesson06.anna_am_telefon: {"title": "Anna Calls"}
teaching:
  de.a2.unit102.lesson01.teach.bahnhof: {"title": "At the station", "gloss": "station / train / ticket / to depart / to miss", "example_gloss": ["Felix was at the station.", "The train has already left.", "He forgot the ticket.", "Felix missed the train."], "note": "A small travel mishap. *Abfahren* is separable (participle *abgefahren*); *verpassen* is not (*verpasst*)."}
  de.a2.unit102.lesson01.teach.vorher: {"title": "Before and already", "gloss": "before that / already / already / before that", "example_gloss": ["I had eaten before.", "The train was already gone."], "note": "*Vorher* and *schon* show that something happened earlier."}
  de.a2.unit102.lesson01.teach.gn_hatte: {"title": "Hatte plus participle", "gloss": "I had eaten, you had eaten, he had eaten, we had eaten, they had eaten", "note": "The past perfect is built like the perfect, but the helper is in the simple past: *hatte* instead of *habe*. The participle is last."}
  de.a2.unit102.lesson01.teach.gn_war: {"title": "War plus participle", "gloss": "I had arrived, you had arrived, it had departed, we had departed", "note": "Verbs that take *sein* in the perfect take *war* in the past perfect: *Der Zug war abgefahren*."}
  de.a2.unit102.lesson01.teach.satz_kurz: {"title": "Earlier than earlier", "gloss": "The train had already left. Felix had forgotten the ticket."}
  de.a2.unit102.lesson02.teach.ankunft: {"title": "Arriving", "gloss": "to arrive / to wait / back / minute / half an hour", "example_gloss": ["Felix arrived at the station.", "He waited half an hour.", "He went back home.", "The train had left ten minutes before."], "note": "Words for a small delay."}
  de.a2.unit102.lesson02.teach.gn_als_schon: {"title": "Two moments in the past", "gloss": "When Felix arrived, the train had already left.", "note": "The *als* clause gives the later moment in simple past (*ankam*). The main clause with *war ... abgefahren* says what had happened earlier."}
  de.a2.unit102.lesson02.teach.gn_reihenfolge: {"title": "Which happened first?", "gloss": "The train left. Then Felix arrived. The train had already left when Felix arrived.", "note": "The past perfect always points to the earlier of two past events."}
  de.a2.unit102.lesson02.teach.gn_vor: {"title": "Vor plus time", "gloss": "The train had left ten minutes earlier.", "note": "*Vor* + a time expression says how long before. With the past perfect it means 'before that moment'."}
  de.a2.unit102.lesson02.teach.satz_pech: {"title": "Bad luck", "gloss": "Felix had bad luck. The train was already gone."}
  de.a2.unit102.lesson03.teach.reihenfolge: {"title": "Order of events", "gloss": "after (conjunction) / first / afterwards / again", "example_gloss": ["After Felix had had breakfast, he went to the station.", "He went home again."], "note": "*Nachdem* introduces the earlier action."}
  de.a2.unit102.lesson03.teach.gn_nachdem: {"title": "Nachdem plus past perfect", "gloss": "After Felix had had breakfast, he went to the station.", "note": "The *nachdem* clause is the earlier action and takes the past perfect. The helper *hatte* goes to the very end; the participle stands before it."}
  de.a2.unit102.lesson03.teach.gn_hauptsatz: {"title": "The main clause", "gloss": "After I had eaten, I left. I left after I had eaten. After Felix had waited, the train came.", "note": "The main clause uses the simple past (or the perfect). If the *nachdem* clause comes first, the main verb follows the comma directly."}
  de.a2.unit102.lesson03.teach.gn_sein: {"title": "Nachdem with sein verbs", "gloss": "After the train had left, Felix went home.", "note": "With a movement verb the helper at the end is *war*: *abgefahren war*."}
  de.a2.unit102.lesson03.teach.satz_beispiel: {"title": "Both clauses", "gloss": "After Felix had found the ticket, he went to the station again."}
  de.a2.unit102.lesson04.teach.pannen: {"title": "Small mishaps", "gloss": "key / door / to close / to find / cafe", "example_gloss": ["I had found the key.", "The cafe had already closed.", "The door was shut."], "note": "Things that had already happened by the time someone arrived."}
  de.a2.unit102.lesson04.teach.gn_perfekt_oder_plusquam: {"title": "Perfect or past perfect?", "gloss": "I arrived. The train had already left.", "note": "Use the perfect or simple past for the main storyline and the past perfect for what had happened earlier."}
  de.a2.unit102.lesson04.teach.gn_zwei_saetze: {"title": "From two sentences to one", "gloss": "First the train left. Afterwards Felix arrived. After the train had left, Felix arrived.", "note": "*Nachdem* combines the two sentences. The earlier action moves into the *nachdem* clause with the past perfect."}
  de.a2.unit102.lesson04.teach.satz_cafe: {"title": "Too late", "gloss": "When Anna came, the cafe had already closed."}
  de.a2.unit102.lesson05.teach.geschichte: {"title": "Words for the story", "gloss": "yesterday / the next train / later / finally", "example_gloss": ["The next train came later.", "At last Felix was in Hamburg."], "note": "Words for the story you will read."}
  de.a2.unit102.lesson05.teach.gn_text: {"title": "Reading the order of events", "gloss": "Felix had forgotten the ticket. He went back. When he arrived, the train had left.", "note": "Notice how the tenses show the order: the past perfect marks what happened first."}
  de.a2.unit102.lesson05.teach.lesen_pech: {"title": "Felix's journey", "gloss": "Yesterday Felix wanted to visit his uncle in Hamburg. He had forgotten his ticket and went back home. After he had found it, he went to the station again. When he arrived, the train had already left. Felix waited half an hour. Then the next train came. Later he was finally in Hamburg.", "note": "The text shows three layers of the past: the plan (wollte), the order of events (ging, kam) and what had happened earlier (hatte vergessen, war abgefahren).", "glosses": {"Onkel": "uncle", "Fahrkarte": "ticket", "nächste": "next", "später": "later"}}
  de.a2.unit102.lesson06.teach.anna_frage: {"title": "Anna asks", "gloss": "Anna: Hi Felix! Are you at your uncle's yet?"}
  de.a2.unit102.lesson06.teach.felix_noch_nicht: {"title": "Felix explains", "gloss": "Felix: Not yet. When I arrived at the station, the train had already left."}
  de.a2.unit102.lesson06.teach.anna_oh: {"title": "Anna is sorry", "gloss": "Anna: Oh no! Why did you come so late?"}
  de.a2.unit102.lesson06.teach.felix_fahrkarte: {"title": "Felix tells the reason", "gloss": "Felix: I had forgotten my ticket. After I had found it, I went to the station again."}
  de.a2.unit102.lesson06.teach.anna_jetzt: {"title": "Anna asks about now", "gloss": "Anna: And now? When do you arrive?"}
  de.a2.unit102.lesson06.teach.felix_zug: {"title": "Felix answers", "gloss": "Felix: I'm sitting in the next train. It arrives at ten o'clock."}
exercises:
  de.a2.unit102.lesson01.exercise01.wahl_hatte: {"instruction": "Choose the correct German sentence.", "correct_option": "Ich hatte gegessen.", "distractors": ["Ich habte gegessen.", "Ich hatte essen.", "Ich war gegessen."], "accepted_answers": [{"value": "Ich hatte gegessen.", "status": "correct"}], "feedback": "*Hatte* + participle."}
  de.a2.unit102.lesson01.exercise02.wahl_war: {"instruction": "Choose the correct German sentence.", "correct_option": "Der Zug war abgefahren.", "distractors": ["Der Zug hatte abgefahren.", "Der Zug war abgefahrt.", "Der Zug war geabgefahren."], "accepted_answers": [{"value": "Der Zug war abgefahren.", "status": "correct"}], "feedback": "*Abfahren* takes *sein*: *war abgefahren*."}
  de.a2.unit102.lesson01.exercise03.paare_formen: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "ich hatte gegessen", "right": "I had eaten"}, {"left": "du hattest gegessen", "right": "you had eaten"}, {"left": "wir hatten gegessen", "right": "we had eaten"}, {"left": "ich war angekommen", "right": "I had arrived"}, {"left": "er war abgefahren", "right": "he had left"}, {"left": "sie waren abgefahren", "right": "they had left"}], "status": "correct"}], "feedback": "The helper is hatte/hattest/hatten or war/warst/waren."}
  de.a2.unit102.lesson01.exercise04.ordnen_vergessen: {"instruction": "Put the words in order to say 'Felix had forgotten the ticket.'", "correct_option": "Felix hatte die Fahrkarte vergessen", "accepted_answers": [{"value": "Felix hatte die Fahrkarte vergessen", "status": "correct"}], "feedback": "*Hatte* is second, the participle *vergessen* is last."}
  de.a2.unit102.lesson01.exercise05.luecke_war: {"instruction": "Complete with the correct helper verb.", "correct_option": "war", "accepted_answers": [{"value": "war", "status": "correct"}], "feedback": "*Abfahren* takes *sein*, so the past perfect uses *war*."}
  de.a2.unit102.lesson01.exercise06.uebersetzen_verpasst: {"instruction": "Translate into German.", "accepted_answers": [{"value": "Felix hatte den Zug verpasst.", "status": "correct"}], "feedback": "*Verpassen* has no *ge-*: *verpasst*."}
  de.a2.unit102.lesson01.exercise07.schreiben_hatte: {"instruction": "Write the requested German sentence.", "correct_option": "Ich hatte die Fahrkarte vergessen.", "accepted_answers": [{"value": "Ich hatte die Fahrkarte vergessen.", "status": "correct"}], "feedback": "*Hatte* + *vergessen*."}
  de.a2.unit102.lesson02.exercise01.wahl_als: {"instruction": "Choose the correct German sentence.", "correct_option": "Als Felix ankam, war der Zug schon abgefahren.", "distractors": ["Als Felix ankam, ist der Zug schon abgefahren.", "Als Felix ankam, war der Zug schon abfahren.", "Als Felix kam an, war der Zug schon abgefahren."], "accepted_answers": [{"value": "Als Felix ankam, war der Zug schon abgefahren.", "status": "correct"}], "feedback": "The earlier event takes the past perfect (*war ... abgefahren*)."}
  de.a2.unit102.lesson02.exercise02.wahl_vor: {"instruction": "Choose the correct German sentence.", "correct_option": "Der Zug war vor zehn Minuten abgefahren.", "distractors": ["Der Zug war für zehn Minuten abgefahren.", "Der Zug ist vor zehn Minuten abgefahren war.", "Der Zug hatte vor zehn Minuten abgefahren."], "accepted_answers": [{"value": "Der Zug war vor zehn Minuten abgefahren.", "status": "correct"}], "feedback": "*Vor zehn Minuten* = ten minutes ago."}
  de.a2.unit102.lesson02.exercise03.paare_als: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Als Felix ankam, war der Zug schon abgefahren.", "right": "When Felix arrived, the train had already left."}, {"left": "Er wartete eine halbe Stunde.", "right": "He waited half an hour."}, {"left": "Er ging zurück nach Hause.", "right": "He went back home."}, {"left": "Der Zug war schon weg.", "right": "The train was already gone."}, {"left": "Felix hatte Pech.", "right": "Felix had bad luck."}, {"left": "Der Zug war vor zehn Minuten abgefahren.", "right": "The train had left ten minutes before."}], "status": "correct"}], "feedback": "The small story of a missed train."}
  de.a2.unit102.lesson02.exercise04.ordnen_als: {"instruction": "Put the words in order to say 'When Felix arrived, the train had already left.'", "correct_option": "Als Felix ankam war der Zug schon abgefahren", "accepted_answers": [{"value": "Als Felix ankam war der Zug schon abgefahren", "status": "correct"}, {"value": "Der Zug war schon abgefahren als Felix ankam", "status": "correct"}], "feedback": "After the *als* clause, the main verb *war* comes first."}
  de.a2.unit102.lesson02.exercise05.luecke_hatte: {"instruction": "Complete with the simple past of haben.", "correct_option": "hatte", "accepted_answers": [{"value": "hatte", "status": "correct"}], "feedback": "*Verpassen* takes *haben*, so: *hatte verpasst*."}
  de.a2.unit102.lesson02.exercise06.uebersetzen_pech: {"instruction": "Translate into German.", "accepted_answers": [{"value": "Felix hatte Pech.", "status": "correct"}], "feedback": "*Pech haben* = to have bad luck."}
  de.a2.unit102.lesson02.exercise07.schreiben_schon_weg: {"instruction": "Write the requested German sentence.", "correct_option": "Der Zug war schon weg.", "accepted_answers": [{"value": "Der Zug war schon weg.", "status": "correct"}], "feedback": "*Der Zug war schon weg.*"}
  de.a2.unit102.lesson03.exercise01.wahl_nachdem: {"instruction": "Choose the correct German sentence.", "correct_option": "Nachdem Felix gefrühstückt hatte, ging er zum Bahnhof.", "distractors": ["Nachdem Felix hatte gefrühstückt, ging er zum Bahnhof.", "Nachdem Felix gefrühstückt hatte, er ging zum Bahnhof.", "Nachdem Felix gefrühstückt, ging er zum Bahnhof hatte."], "accepted_answers": [{"value": "Nachdem Felix gefrühstückt hatte, ging er zum Bahnhof.", "status": "correct"}], "feedback": "In the *nachdem* clause the helper is last."}
  de.a2.unit102.lesson03.exercise02.wahl_war_ende: {"instruction": "Choose the correct German sentence.", "correct_option": "Nachdem der Zug abgefahren war, ging Felix nach Hause.", "distractors": ["Nachdem der Zug abgefahren hatte, ging Felix nach Hause.", "Nachdem der Zug war abgefahren, ging Felix nach Hause.", "Nachdem der Zug abgefahren war, Felix ging nach Hause."], "accepted_answers": [{"value": "Nachdem der Zug abgefahren war, ging Felix nach Hause.", "status": "correct"}], "feedback": "*Abfahren* takes *sein*: *abgefahren war*."}
  de.a2.unit102.lesson03.exercise03.paare_nachdem: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Nachdem Felix gefrühstückt hatte, ging er zum Bahnhof.", "right": "After Felix had had breakfast, he went to the station."}, {"left": "Nachdem der Zug abgefahren war, ging Felix nach Hause.", "right": "After the train had left, Felix went home."}, {"left": "Nachdem Felix die Fahrkarte gefunden hatte, ging er wieder zum Bahnhof.", "right": "After Felix had found the ticket, he went to the station again."}, {"left": "Er ging, nachdem er gewartet hatte.", "right": "He left after he had waited."}, {"left": "Nachdem ich gegessen hatte, ging ich.", "right": "After I had eaten, I left."}, {"left": "Er wartete eine halbe Stunde.", "right": "He waited half an hour."}], "status": "correct"}], "feedback": "The *nachdem* clause is always the earlier action."}
  de.a2.unit102.lesson03.exercise04.ordnen_gegessen: {"instruction": "Put the words in order to say 'After I had eaten, I left.'", "correct_option": "Nachdem ich gegessen hatte ging ich", "accepted_answers": [{"value": "Nachdem ich gegessen hatte ging ich", "status": "correct"}, {"value": "Ich ging nachdem ich gegessen hatte", "status": "correct"}], "feedback": "The helper *hatte* closes the *nachdem* clause."}
  de.a2.unit102.lesson03.exercise05.luecke_hatte_ende: {"instruction": "Complete with the helper verb that ends the nachdem clause.", "correct_option": "hatte", "accepted_answers": [{"value": "hatte", "status": "correct"}], "feedback": "*Hatte* goes to the end."}
  de.a2.unit102.lesson03.exercise06.uebersetzen_nachdem: {"instruction": "Translate into German.", "accepted_answers": [{"value": "Nachdem ich gegessen hatte, ging ich.", "status": "correct"}, {"value": "Ich ging, nachdem ich gegessen hatte.", "status": "correct"}], "feedback": "Both clause orders are correct."}
  de.a2.unit102.lesson03.exercise07.schreiben_nachdem: {"instruction": "Write the requested German sentence.", "correct_option": "Nachdem Felix gefrühstückt hatte, ging er zum Bahnhof.", "accepted_answers": [{"value": "Nachdem Felix gefrühstückt hatte, ging er zum Bahnhof.", "status": "correct"}, {"value": "Nachdem Felix gefruehstueckt hatte, ging er zum Bahnhof.", "status": "correct"}], "feedback": "*Nachdem Felix gefrühstückt hatte, ging er ...*"}
  de.a2.unit102.lesson04.exercise01.wahl_cafe: {"instruction": "Choose the correct German sentence.", "correct_option": "Als Anna kam, war das Café schon geschlossen.", "distractors": ["Als Anna kam, ist das Café schon geschlossen.", "Als Anna kam, war das Café schon schließen.", "Als Anna kam, das Café war schon geschlossen."], "accepted_answers": [{"value": "Als Anna kam, war das Café schon geschlossen.", "status": "correct"}], "feedback": "*Schließen* has the participle *geschlossen*; the cafe is a state that *war* closed."}
  de.a2.unit102.lesson04.exercise02.wahl_schluessel: {"instruction": "Choose the correct German sentence.", "correct_option": "Ich hatte den Schlüssel gefunden.", "distractors": ["Ich war den Schlüssel gefunden.", "Ich hatte den Schlüssel finden.", "Ich hatte den Schlüssel gefindet."], "accepted_answers": [{"value": "Ich hatte den Schlüssel gefunden.", "status": "correct"}], "feedback": "*Finden* takes *haben*: *hatte gefunden*."}
  de.a2.unit102.lesson04.exercise03.paare_vorher: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Ich hatte den Schlüssel gefunden.", "right": "I had found the key."}, {"left": "Das Café war schon geschlossen.", "right": "The cafe had already closed."}, {"left": "Die Tür war zu.", "right": "The door was shut."}, {"left": "Felix hatte die Fahrkarte vergessen.", "right": "Felix had forgotten the ticket."}, {"left": "Der Zug war schon abgefahren.", "right": "The train had already left."}, {"left": "Nachdem Felix gewartet hatte, kam der Zug.", "right": "After Felix had waited, the train came."}], "status": "correct"}], "feedback": "Earlier events in the past perfect."}
  de.a2.unit102.lesson04.exercise04.ordnen_cafe: {"instruction": "Put the words in order to say 'The cafe had already closed.'", "correct_option": "Das Café war schon geschlossen", "accepted_answers": [{"value": "Das Café war schon geschlossen", "status": "correct"}], "feedback": "*War* is second, the participle is last."}
  de.a2.unit102.lesson04.exercise05.luecke_gefunden: {"instruction": "Complete with the participle of finden.", "correct_option": "gefunden", "accepted_answers": [{"value": "gefunden", "status": "correct"}], "feedback": "*Finden, gefunden*."}
  de.a2.unit102.lesson04.exercise06.uebersetzen_als: {"instruction": "Translate into German.", "accepted_answers": [{"value": "Als Anna kam, war das Café schon geschlossen.", "status": "correct"}, {"value": "Das Café war schon geschlossen, als Anna kam.", "status": "correct"}, {"value": "Als Anna kam, hatte das Café schon geschlossen.", "status": "correct"}], "feedback": "Past perfect for the earlier event."}
  de.a2.unit102.lesson04.exercise07.schreiben_zwei: {"instruction": "Write two German sentences, following the two instructions.", "correct_option": "Nachdem Felix gefrühstückt hatte, ging er zum Bahnhof. Als er ankam, war der Zug schon abgefahren.", "accepted_answers": [{"value": "Nachdem Felix gefrühstückt hatte, ging er zum Bahnhof. Als er ankam, war der Zug schon abgefahren.", "status": "correct"}, {"value": "Nachdem Felix gefruehstueckt hatte, ging er zum Bahnhof. Als er ankam, war der Zug schon abgefahren.", "status": "correct"}], "feedback": "Two sentences, two uses of the past perfect."}
  de.a2.unit102.lesson05.exercise01.lesen_vergessen: {"instruction": "Read the text and choose the answer.", "correct_option": "His ticket.", "distractors": ["His key.", "His bag.", "His uncle's address."], "accepted_answers": [{"value": "His ticket.", "status": "correct"}], "feedback": "*Er hatte die Fahrkarte vergessen.*"}
  de.a2.unit102.lesson05.exercise02.lesen_zug: {"instruction": "Read the text and choose the answer.", "correct_option": "The train had already left.", "distractors": ["The train was just arriving.", "The train was late.", "The station was closed."], "accepted_answers": [{"value": "The train had already left.", "status": "correct"}], "feedback": "*Als er ankam, war der Zug schon abgefahren.*"}
  de.a2.unit102.lesson05.exercise03.paare_geschichte: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Er hatte die Fahrkarte vergessen.", "right": "He had forgotten the ticket."}, {"left": "Er ging zurück nach Hause.", "right": "He went back home."}, {"left": "Nachdem er sie gefunden hatte, ging er wieder zum Bahnhof.", "right": "After he had found it, he went to the station again."}, {"left": "Der Zug war schon abgefahren.", "right": "The train had already left."}, {"left": "Dann kam der nächste Zug.", "right": "Then the next train came."}, {"left": "Später war er endlich in Hamburg.", "right": "Later he was finally in Hamburg."}], "status": "correct"}], "feedback": "The sentences of the story."}
  de.a2.unit102.lesson05.exercise04.ordnen_naechste: {"instruction": "Put the words in order to say 'Then the next train came.'", "correct_option": "Dann kam der nächste Zug", "accepted_answers": [{"value": "Dann kam der nächste Zug", "status": "correct"}], "feedback": "*Kam* is second after *dann*."}
  de.a2.unit102.lesson05.exercise05.uebersetzen_wiedergefunden: {"instruction": "Translate into German.", "accepted_answers": [{"value": "Nachdem er sie gefunden hatte, ging er wieder zum Bahnhof.", "status": "correct"}, {"value": "Er ging wieder zum Bahnhof, nachdem er sie gefunden hatte.", "status": "correct"}], "feedback": "Past perfect in the *nachdem* clause."}
  de.a2.unit102.lesson05.exercise06.diktat_zug: {"instruction": "Type what you hear.", "correct_response": "Als er ankam, war der Zug schon abgefahren.", "orthography_strict": true, "feedback": "You heard *Als er ankam, war der Zug schon abgefahren.*."}
  de.a2.unit102.lesson05.exercise07.diktat_fahrkarte: {"instruction": "Type what you hear.", "correct_response": "Er hatte die Fahrkarte vergessen.", "orthography_strict": true, "feedback": "You heard *Er hatte die Fahrkarte vergessen.*."}
  de.a2.unit102.lesson06.exercise01.hoeren_frage: {"instruction": "Listen and select Anna's opening question.", "correct_option": "Hallo Felix! Bist du schon bei deinem Onkel?", "distractors": ["Hallo Felix! Bist du schon in Hamburg?", "Hallo Anna! Bist du schon bei deinem Onkel?", "Hallo Felix! Hast du deine Fahrkarte vergessen?"], "accepted_answers": [{"value": "Hallo Felix! Bist du schon bei deinem Onkel?", "status": "correct"}], "feedback": "Anna opens with *Hallo Felix! Bist du schon bei deinem Onkel?*"}
  de.a2.unit102.lesson06.exercise02.verstehen_grund: {"instruction": "Listen to the dialogue and choose the answer.", "correct_option": "He had forgotten his ticket and went back for it.", "distractors": ["He got up late.", "The train was cancelled.", "He went to the wrong station."], "accepted_answers": [{"value": "He had forgotten his ticket and went back for it.", "status": "correct"}], "feedback": "Felix says he had forgotten the ticket and had to go back."}
  de.a2.unit102.lesson06.exercise03.paare_dialog: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Als ich ankam, war der Zug schon abgefahren.", "right": "When I arrived, the train had already left."}, {"left": "Ich hatte meine Fahrkarte vergessen.", "right": "I had forgotten my ticket."}, {"left": "Nachdem ich sie gefunden hatte, bin ich wieder zum Bahnhof gegangen.", "right": "After I had found it, I went to the station again."}, {"left": "Wann kommst du an?", "right": "When do you arrive?"}, {"left": "Ich sitze im nächsten Zug.", "right": "I'm sitting in the next train."}, {"left": "Er kommt um zehn Uhr an.", "right": "It arrives at ten o'clock."}], "status": "correct"}], "feedback": "Felix explains his delay."}
  de.a2.unit102.lesson06.exercise04.ordnen_fahrkarte: {"instruction": "Put the words in order to say 'I had forgotten my ticket.'", "correct_option": "Ich hatte meine Fahrkarte vergessen", "accepted_answers": [{"value": "Ich hatte meine Fahrkarte vergessen", "status": "correct"}], "feedback": "*Hatte* is second, the participle is last."}
  de.a2.unit102.lesson06.exercise05.antwort_spaet: {"instruction": "Answer in German as Felix: say that you had forgotten your ticket.", "correct_option": "Ich hatte meine Fahrkarte vergessen.", "accepted_answers": [{"value": "Ich hatte meine Fahrkarte vergessen.", "status": "correct"}, {"value": "Ich hatte die Fahrkarte vergessen.", "status": "correct"}], "feedback": "*Ich hatte meine Fahrkarte vergessen.*"}
  de.a2.unit102.lesson06.exercise06.uebersetzen_ankam: {"instruction": "Translate into German.", "accepted_answers": [{"value": "Als ich am Bahnhof ankam, war der Zug schon abgefahren.", "status": "correct"}, {"value": "Der Zug war schon abgefahren, als ich am Bahnhof ankam.", "status": "correct"}], "feedback": "Simple past in the *als* clause, past perfect in the main clause."}
  de.a2.unit102.lesson06.exercise07.schreiben_dreisaetze: {"instruction": "Write three German sentences, following the three numbered instructions.", "correct_option": "Ich hatte meine Fahrkarte vergessen. Als ich ankam, war der Zug schon abgefahren. Nachdem ich gewartet hatte, kam der nächste Zug.", "accepted_answers": [{"value": "Ich hatte meine Fahrkarte vergessen. Als ich ankam, war der Zug schon abgefahren. Nachdem ich gewartet hatte, kam der nächste Zug.", "status": "correct"}, {"value": "Ich hatte meine Fahrkarte vergessen. Als ich ankam, war der Zug schon abgefahren. Nachdem ich gewartet hatte, kam der naechste Zug.", "status": "correct"}], "feedback": "The story in three steps with the past perfect."}
