course:
  title: "German B1"
  description: "Learn B1-level German for recounting a past experience as a sequence of events with background/main-line contrast, and reporting what someone said."

units:
  de.b1.unit40.erzaehlung: {title: "Narrative"}

lessons:
  de.b1.unit40.lesson01.waehrend_praeteritum: {title: "While I was working, ..."}
  de.b1.unit40.lesson02.reported_speech: {title: "He said that I ..."}
  de.b1.unit40.lesson03.cafe_dialogue: {title: "Dialogue: an experience at the cafe"}

teaching:
  de.b1.unit40.lesson01.teach.waehrend_arbeitete_klingelte: {title: "Während ich im Cafe arbeitete, klingelte das Telefon.", gloss: "While I was working in the cafe, the phone rang.", note: "*während* + Präteritum marks an ongoing background action; the Präteritum main clause names the event that happened during it.", example_gloss: "Narrative: While I was working in the cafe, the phone rang."}
  de.b1.unit40.lesson01.teach.dann_kam: {title: "Dann kam Felix ins Cafe.", gloss: "Then Felix came into the cafe.", note: "*dann* is a sequencing connector that moves the narrative to the next main-line event, in Präteritum (kam).", example_gloss: "Next event: Then Felix came into the cafe."}
  de.b1.unit40.lesson02.teach.original_quote: {title: "Felix (to Anna): Sie sind heute sehr beschäftigt.", gloss: "Felix (to Anna): You are very busy today.", note: "This is the original quote, addressed directly to Anna using formal Sie.", example_gloss: "Original: Felix says to Anna: You are very busy today."}
  de.b1.unit40.lesson02.teach.reported_speech: {title: "Felix sagte, dass ich heute sehr beschäftigt bin.", gloss: "Felix said that I was very busy today.", note: "When Anna reports Felix's quote later, the addressee pronoun shifts: Sie (in the original, addressed to Anna) becomes ich (Anna reporting about herself).", example_gloss: "Recounted: Felix said that I was very busy today."}
  de.b1.unit40.lesson03.teach.anna_narrative: {title: "Anna sets the scene", gloss: "Anna: While I was working in the cafe yesterday, the phone suddenly rang. Then Felix came into the cafe.", note: "This combines the background/main-line während-clause with a dann-sequenced next event."}
  de.b1.unit40.lesson03.teach.friend_ask: {title: "The friend asks what was said", gloss: "Friend: And what did he say?", note: "This sets up the reported-speech turn that follows."}
  de.b1.unit40.lesson03.teach.anna_report: {title: "Anna reports what Felix said", gloss: "Anna: He said that I was very busy today.", note: "Anna reports Felix's original Sie-quote with the pronoun shifted to ich, as taught in lesson02."}
  de.b1.unit40.lesson03.teach.friend_react: {title: "The friend reacts", gloss: "Friend: That's surely true!", note: "A short reaction closing the exchange."}

exercises:
  de.b1.unit40.lesson01.exercise01.recognize_waehrend_klingelte: {instruction: "Which German sentence means \"While I was working in the cafe, the phone rang.\"?", correct_option: "Während ich im Cafe arbeitete, klingelte das Telefon.", distractors: ["Ich arbeitete im Cafe und das Telefon klingelte nicht.", "Während das Telefon klingelte, arbeitete ich im Cafe nicht.", "Ich habe im Cafe gearbeitet, dann kam Felix."], accepted_answers: [{value: "Während ich im Cafe arbeitete, klingelte das Telefon.", status: "correct"}], feedback: "*während* + Präteritum marks the ongoing background action against the main-line event."}
  de.b1.unit40.lesson01.exercise02.recognize_dann_kam: {instruction: "Which German sentence means \"Then Felix came into the cafe.\"?", correct_option: "Dann kam Felix ins Cafe.", distractors: ["Dann klingelte das Telefon.", "Felix arbeitete dann im Cafe.", "Dann kam das Telefon ins Cafe."], accepted_answers: [{value: "Dann kam Felix ins Cafe.", status: "correct"}], feedback: "*Dann kam Felix ins Cafe* uses *dann* to sequence the next main-line event."}
  de.b1.unit40.lesson01.exercise03.listen_select_waehrend: {instruction: "Listen. What was the background action, and what was the main event that interrupted it?", correct_option: "Background: working in the cafe; main event: the phone rang.", distractors: ["Background: the phone ringing; main event: working in the cafe.", "Background: talking to Felix; main event: the phone rang.", "Background: working in the cafe; main event: Felix arrived."], accepted_answers: [{value: "Background: working in the cafe; main event: the phone rang.", status: "correct"}], feedback: "The recording says *Während ich im Cafe arbeitete, klingelte das Telefon*."}
  de.b1.unit40.lesson01.exercise04.match_waehrend:
    instruction: "Match each German word or phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "Während ich im Cafe arbeitete", right: "While I was working in the cafe"}
          - {left: "klingelte das Telefon", right: "the phone rang"}
          - {left: "Dann kam Felix ins Cafe.", right: "Then Felix came into the cafe."}
          - {left: "das Telefon", right: "the phone"}
          - {left: "während", right: "while"}
          - {left: "dann", right: "then"}
        status: "correct"
    feedback: "These pieces build a background clause and a sequenced main-line event."
  de.b1.unit40.lesson01.exercise05.order_waehrend: {instruction: "Put the words in order to say \"While I was working in the cafe, the phone rang.\"", accepted_answers: [{value: ["Während", "ich", "im", "Cafe", "arbeitete,", "klingelte", "das", "Telefon"], status: "correct"}], feedback: "The correct order is *Während ich im Cafe arbeitete, klingelte das Telefon*."}
  de.b1.unit40.lesson01.exercise06.write_waehrend:
    instruction: "Write exactly this narrative sentence, marking a background action against a main-line event with während: While I was working in the cafe, the phone rang."
    accepted_answers:
      - {value: "Während ich im Cafe arbeitete, klingelte das Telefon.", status: "correct"}
      - {value: "Während ich im Cafe arbeitete, klingelte das Telefon", status: "correct"}
      - {value: "Während ich im Cafe arbeitete klingelte das Telefon.", status: "correct"}
      - {value: "Während ich im Cafe arbeitete klingelte das Telefon", status: "correct"}
    feedback: "The model answer is *Während ich im Cafe arbeitete, klingelte das Telefon*."
  de.b1.unit40.lesson02.exercise01.recognize_original_quote: {instruction: "Which German sentence means \"You are very busy today.\" (said directly to Anna)?", correct_option: "Sie sind heute sehr beschäftigt.", distractors: ["Ich bin heute sehr beschäftigt.", "Sie waren gestern sehr beschäftigt.", "Wir sind heute sehr beschäftigt."], accepted_answers: [{value: "Sie sind heute sehr beschäftigt.", status: "correct"}], feedback: "This is the original quote, addressed to Anna with formal Sie."}
  de.b1.unit40.lesson02.exercise02.recognize_reported_speech: {instruction: "Which German sentence means \"Felix said that I was very busy today.\" (Anna reporting Felix's words about her)?", correct_option: "Felix sagte, dass ich heute sehr beschäftigt bin.", distractors: ["Felix sagte, dass Sie heute sehr beschäftigt sind.", "Ich sagte, dass Felix heute sehr beschäftigt ist.", "Felix sagte, dass er heute sehr beschäftigt ist."], accepted_answers: [{value: "Felix sagte, dass ich heute sehr beschäftigt bin.", status: "correct"}], feedback: "Reporting shifts the addressee pronoun from Sie (in the original quote) to ich (Anna speaking about herself)."}
  de.b1.unit40.lesson02.exercise03.listen_select_reported_speech: {instruction: "Listen. According to the speaker, what did Felix say about her?", correct_option: "That she was very busy today.", distractors: ["That he was very busy today.", "That she wasn't busy today.", "That the cafe was busy today."], accepted_answers: [{value: "That she was very busy today.", status: "correct"}], feedback: "The recording says *Felix sagte, dass ich heute sehr beschäftigt bin*."}
  de.b1.unit40.lesson02.exercise04.match_reported_speech:
    instruction: "Match each German word or phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "Sie sind heute sehr beschäftigt.", right: "You are very busy today. (said to Anna)"}
          - {left: "Felix sagte, dass ich ...", right: "Felix said that I ..."}
          - {left: "beschäftigt", right: "busy"}
          - {left: "heute", right: "today"}
          - {left: "sagen", right: "to say"}
          - {left: "sagte", right: "said"}
        status: "correct"
    feedback: "These pieces cover the original quote and its reported-speech form with the pronoun shifted."
  de.b1.unit40.lesson02.exercise05.order_reported_speech: {instruction: "Put the words in order to say \"Felix said that I was very busy today.\"", accepted_answers: [{value: ["Felix", "sagte,", "dass", "ich", "heute", "sehr", "beschäftigt", "bin"], status: "correct"}], feedback: "The correct order is *Felix sagte, dass ich heute sehr beschäftigt bin*."}
  de.b1.unit40.lesson02.exercise06.write_reported_speech:
    instruction: "Felix said to you: \"Sie sind heute sehr beschäftigt.\" Report this as Anna telling a friend what Felix said, shifting Sie to ich: Felix said that I was very busy today."
    accepted_answers:
      - {value: "Felix sagte, dass ich heute sehr beschäftigt bin.", status: "correct"}
      - {value: "Felix sagte, dass ich heute sehr beschäftigt bin", status: "correct"}
    feedback: "The model answer is *Felix sagte, dass ich heute sehr beschäftigt bin*."
  de.b1.unit40.lesson03.exercise01.choose_anna_narrative: {instruction: "What was Anna doing when the phone suddenly rang, and what happened next?", correct_option: "She was working in the cafe; then Felix came in.", distractors: ["She was talking to a friend; then the phone rang.", "She was working in the cafe; then she called Felix.", "She was resting; then the phone suddenly rang."], accepted_answers: [{value: "She was working in the cafe; then Felix came in.", status: "correct"}], feedback: "Anna says *Während ich gestern im Cafe arbeitete, klingelte plötzlich das Telefon. Dann kam Felix ins Cafe*."}
  de.b1.unit40.lesson03.exercise02.choose_anna_report: {instruction: "What does Anna report that Felix said about her?", correct_option: "That she was very busy today.", distractors: ["That he was very busy today.", "That the cafe was closing early.", "That she should call him back."], accepted_answers: [{value: "That she was very busy today.", status: "correct"}], feedback: "Anna says *Er sagte, dass ich heute sehr beschäftigt bin*."}
  de.b1.unit40.lesson03.exercise03.listen_dialogue_cafe: {instruction: "Listen to the dialogue. What was the background action just before the phone rang?", correct_option: "Anna was working in the cafe.", distractors: ["Anna was talking to Felix.", "Anna was calling a friend.", "Anna was closing the cafe."], accepted_answers: [{value: "Anna was working in the cafe.", status: "correct"}], feedback: "Anna says *Während ich gestern im Cafe arbeitete, klingelte plötzlich das Telefon*."}
  de.b1.unit40.lesson03.exercise04.match_dialogue_cafe:
    instruction: "Match each German word or phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "gestern", right: "yesterday"}
          - {left: "plötzlich", right: "suddenly"}
          - {left: "Und was hat er gesagt?", right: "And what did he say?"}
          - {left: "Das stimmt bestimmt!", right: "That's surely true!"}
          - {left: "die Freundin", right: "the (female) friend"}
          - {left: "bestimmt", right: "surely"}
        status: "correct"
    feedback: "These pieces support the surrounding narrative and reported-speech exchange."
  de.b1.unit40.lesson03.exercise05.order_friend_ask: {instruction: "Put the words in order to say \"And what did he say?\"", accepted_answers: [{value: ["Und", "was", "hat", "er", "gesagt?"], status: "correct"}], feedback: "The correct order is *Und was hat er gesagt?*"}
  de.b1.unit40.lesson03.exercise06.write_full_narrative:
    instruction: "As Anna, recount your experience to a friend in three sentences: (1) the background action (you were working in the cafe yesterday) against the main event (the phone suddenly rang), using während; (2) the next event with dann (Felix came into the cafe); (3) report what Felix said to you, shifting Sie to ich (he said that you were very busy today)."
    accepted_answers:
      - {value: "Während ich gestern im Cafe arbeitete, klingelte plötzlich das Telefon. Dann kam Felix ins Cafe. Er sagte, dass ich heute sehr beschäftigt bin.", status: "correct"}
      - {value: "Während ich gestern im Cafe arbeitete, klingelte plötzlich das Telefon. Dann kam Felix ins Cafe. Er sagte, dass ich heute sehr beschäftigt bin", status: "correct"}
    feedback: "A complete answer sequences the background/main-line events with während and dann, then reports Felix's quote with the pronoun shifted: *Während ich gestern im Cafe arbeitete, klingelte plötzlich das Telefon. Dann kam Felix ins Cafe. Er sagte, dass ich heute sehr beschäftigt bin.*"
