  de.b1.unit47.lesson02.exercise05.order_felix_wuenschte_angerufen: {instruction: "Put the words in order to say \"I wish I had called earlier.\"", accepted_answers: [{value: ["Ich", "wünschte,", "ich", "hätte", "früher", "angerufen."], status: "correct"}], feedback: "The correct order is *Ich wünschte, ich hätte früher angerufen.*"}
  de.b1.unit47.lesson02.exercise06.write_felix_wuenschte_angerufen:
    instruction: "As Felix, write exactly this wish with Ich wünschte, ich hätte...: I wish I had called earlier."
    accepted_answers:
      - {value: "Ich wünschte, ich hätte früher angerufen.", status: "correct"}
      - {value: "Ich wünschte, ich hätte früher angerufen", status: "correct"}
      - {value: "Ich wünschte ich hätte früher angerufen.", status: "correct"}
      - {value: "Ich wünschte ich hätte früher angerufen", status: "correct"}
    feedback: "The model answer is *Ich wünschte, ich hätte früher angerufen.*"
  de.b1.unit47.lesson03.exercise01.choose_anna_reassure: {instruction: "How does Anna respond to Felix's regret about not reporting the heating earlier?", correct_option: "She agrees it's true, but says it's repaired now.", distractors: ["She says it doesn't matter at all.", "She disagrees and says he should have called sooner.", "She says he should call the technician himself."], accepted_answers: [{value: "She agrees it's true, but says it's repaired now.", status: "correct"}], feedback: "Anna says *Das stimmt, aber jetzt ist es repariert*."}
  de.b1.unit47.lesson03.exercise02.choose_felix_wish: {instruction: "What does Felix say he wishes had happened?", correct_option: "He wishes he had called earlier.", distractors: ["He wishes he hadn't called at all.", "He wishes the technician had come sooner.", "He wishes Anna had called for him."], accepted_answers: [{value: "He wishes he had called earlier.", status: "correct"}], feedback: "Felix says *Ich wünschte, ich hätte früher angerufen*."}
  de.b1.unit47.lesson03.exercise03.listen_dialogue_bedauern: {instruction: "Listen to the dialogue. What does Felix regret not doing sooner?", correct_option: "Reporting the heating problem.", distractors: ["Calling Anna.", "Buying a new heater.", "Talking to his boss."], accepted_answers: [{value: "Reporting the heating problem.", status: "correct"}], feedback: "Felix says *Ich hätte die Heizung früher melden sollen*."}
  de.b1.unit47.lesson03.exercise04.match_dialogue_bedauern:
