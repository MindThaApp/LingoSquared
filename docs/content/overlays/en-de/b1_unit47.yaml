    accepted_answers:
      - value:
          - {left: "Das stimmt, aber jetzt ist es repariert.", right: "That's true, but now it's repaired."}
          - {left: "An Ihrer Stelle würde ich das nächste Mal sofort anrufen.", right: "If I were you, I would call immediately next time."}
          - {left: "stimmen", right: "to be true/correct"}
          - {left: "reparieren", right: "to repair"}
          - {left: "sofort", right: "immediately"}
          - {left: "das nächste Mal", right: "next time"}
        status: "correct"
    feedback: "These pieces support Anna's reassurance and her forward-looking advice."
  de.b1.unit47.lesson03.exercise05.order_anna_reassure: {instruction: "Put the words in order to say \"That's true, but now it's repaired.\"", accepted_answers: [{value: ["Das", "stimmt,", "aber", "jetzt", "ist", "es", "repariert."], status: "correct"}], feedback: "The correct order is *Das stimmt, aber jetzt ist es repariert.*"}
  de.b1.unit47.lesson03.exercise06.write_full_regret_and_wish:
    instruction: "As Felix, write two sentences about the same event, in this exact order: (1) a regret with hätte...sollen (you should have reported the heating earlier); (2) a wish with Ich wünschte, ich hätte... (you wish you had called earlier)."
    accepted_answers:
      - {value: "Ich hätte die Heizung früher melden sollen. Ich wünschte, ich hätte früher angerufen.", status: "correct"}
      - {value: "Ich hätte die Heizung früher melden sollen. Ich wünschte, ich hätte früher angerufen", status: "correct"}
      - {value: "Ich hätte die Heizung früher melden sollen. Ich wünschte ich hätte früher angerufen.", status: "correct"}
      - {value: "Ich hätte die Heizung früher melden sollen. Ich wünschte ich hätte früher angerufen", status: "correct"}
    feedback: "A complete answer gives the regret, then the wish: *Ich hätte die Heizung früher melden sollen. Ich wünschte, ich hätte früher angerufen.*"
