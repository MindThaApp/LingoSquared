teaching:
  de.b1.unit47.lesson01.teach.felix_melden_sollen: {title: "Felix regrets not reporting it sooner", gloss: "Felix: I should have reported the heating earlier.", note: "*hätte* + infinitive + *sollen* (two infinitives at the end, not a participle) is a past-obligation regret, \"should have done X.\""}
  de.b1.unit47.lesson01.teach.felix_nicht_warten_sollen: {title: "Felix regrets waiting", gloss: "Felix: I shouldn't have waited so long.", note: "Same hätte...sollen construction, negated with nicht."}
  de.b1.unit47.lesson02.teach.felix_wuenschte_angerufen: {title: "Felix wishes he had called sooner", gloss: "Felix: I wish I had called earlier.", note: "*Ich wünschte, ich hätte* + participle expresses a past wish contrary to what actually happened."}
  de.b1.unit47.lesson02.teach.felix_wuenschte_kaputt: {title: "Felix wishes the heating hadn't broken", gloss: "Felix: I wish the heating hadn't broken.", note: "Same wünschte construction with wäre (from sein) instead of hätte, since kaputtgehen takes sein in the Perfekt."}
  de.b1.unit47.lesson03.teach.felix_regret1: {title: "Felix states his regret", gloss: "Felix: I should have reported the heating earlier.", note: "Opens the dialogue with the regret from lesson01."}
