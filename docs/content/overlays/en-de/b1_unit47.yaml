course:
  title: "German B1"
  description: "Learn B1-level German for expressing regret and past wishes with hätte...sollen and Ich wünschte, ich hätte..."

units:
  de.b1.unit47.bedauern: {title: "Regret"}

lessons:
  de.b1.unit47.lesson01.haette_sollen: {title: "I should have ..."}
  de.b1.unit47.lesson02.ich_wuenschte: {title: "I wish I had ..."}
  de.b1.unit47.lesson03.cafe_dialogue: {title: "Dialogue: That's true, but now it's repaired"}

teaching:
  de.b1.unit47.lesson01.teach.felix_melden_sollen: {title: "Felix regrets not reporting it sooner", gloss: "Felix: I should have reported the heating earlier.", note: "*hätte* + participle + *sollen* is a past-obligation regret, \"should have done X.\"", example_gloss: "Regret: I should have reported the heating earlier."}
  de.b1.unit47.lesson01.teach.felix_nicht_warten_sollen: {title: "Felix regrets waiting", gloss: "Felix: I shouldn't have waited so long.", note: "Same hätte...sollen construction, negated with nicht.", example_gloss: "Regret: I shouldn't have waited so long."}
  de.b1.unit47.lesson02.teach.felix_wuenschte_angerufen: {title: "Felix wishes he had called sooner", gloss: "Felix: I wish I had called earlier.", note: "*Ich wünschte, ich hätte* + participle expresses a past wish contrary to what actually happened.", example_gloss: "Wish: I wish I had called earlier."}
  de.b1.unit47.lesson02.teach.felix_wuenschte_kaputt: {title: "Felix wishes the heating hadn't broken", gloss: "Felix: I wish the heating hadn't broken.", note: "Same wünschte construction with wäre (from sein) instead of hätte, since kaputt gehen takes sein in the Perfekt.", example_gloss: "Wish: I wish the heating hadn't broken."}
  de.b1.unit47.lesson03.teach.felix_regret1: {title: "Felix states his regret", gloss: "Felix: I should have reported the heating earlier.", note: "Opens the dialogue with the regret from lesson01."}
  de.b1.unit47.lesson03.teach.anna_reassure: {title: "Anna reassures him", gloss: "Anna: That's true, but now it's repaired.", note: "Anna acknowledges the regret but points out the problem is now solved."}
  de.b1.unit47.lesson03.teach.felix_wish: {title: "Felix states his wish", gloss: "Felix: I wish I had called earlier.", note: "The wish from lesson02."}
  de.b1.unit47.lesson03.teach.anna_advice_next_time: {title: "Anna gives forward-looking advice", gloss: "Anna: If I were you, I would call immediately next time.", note: "Reuses the An Ihrer Stelle würde ich construction from unit45 cumulatively, now applied to a future situation."}
  de.b1.unit47.lesson03.teach.felix_accept: {title: "Felix accepts the advice", gloss: "Felix: That's good advice.", note: "Closes the exchange, echoing unit45's acceptance phrasing."}

exercises:
  de.b1.unit47.lesson01.exercise01.recognize_felix_melden_sollen: {instruction: "Which German sentence means \"I should have reported the heating earlier.\"?", correct_option: "Ich hätte die Heizung früher melden sollen.", distractors: ["Ich habe die Heizung früher gemeldet.", "Ich hätte die Heizung später melden sollen.", "Ich hätte die Wohnung früher melden sollen."], accepted_answers: [{value: "Ich hätte die Heizung früher melden sollen.", status: "correct"}], feedback: "*hätte ... melden sollen* is the past-obligation regret \"should have reported.\""}
  de.b1.unit47.lesson01.exercise02.recognize_felix_nicht_warten_sollen: {instruction: "Which German sentence means \"I shouldn't have waited so long.\"?", correct_option: "Ich hätte nicht so lange warten sollen.", distractors: ["Ich hätte so lange warten sollen.", "Ich habe nicht so lange gewartet.", "Ich hätte nicht so lange arbeiten sollen."], accepted_answers: [{value: "Ich hätte nicht so lange warten sollen.", status: "correct"}], feedback: "*nicht ... warten sollen* negates the obligation."}
  de.b1.unit47.lesson01.exercise03.listen_select_haette_sollen: {instruction: "Listen. What does Felix say he should have done?", correct_option: "He should have reported the heating earlier.", distractors: ["He should have waited longer.", "He should have called Frau König yesterday.", "He should have repaired the heating himself."], accepted_answers: [{value: "He should have reported the heating earlier.", status: "correct"}], feedback: "The recording says *Ich hätte die Heizung früher melden sollen*."}
  de.b1.unit47.lesson01.exercise04.match_haette_sollen:
    instruction: "Match each German word or phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "Ich hätte die Heizung früher melden sollen.", right: "I should have reported the heating earlier."}
          - {left: "Ich hätte nicht so lange warten sollen.", right: "I shouldn't have waited so long."}
          - {left: "melden", right: "to report"}
          - {left: "warten", right: "to wait"}
          - {left: "früher", right: "earlier"}
          - {left: "so lange", right: "so long"}
        status: "correct"
    feedback: "These pieces build two past-obligation regrets with hätte...sollen."
  de.b1.unit47.lesson01.exercise05.order_felix_melden_sollen: {instruction: "Put the words in order to say \"I should have reported the heating earlier.\"", accepted_answers: [{value: ["Ich", "hätte", "die", "Heizung", "früher", "melden", "sollen."], status: "correct"}], feedback: "The correct order is *Ich hätte die Heizung früher melden sollen.*"}
  de.b1.unit47.lesson01.exercise06.write_felix_melden_sollen:
    instruction: "As Felix, write exactly this regret with hätte...sollen: I should have reported the heating earlier."
    accepted_answers:
      - {value: "Ich hätte die Heizung früher melden sollen.", status: "correct"}
      - {value: "Ich hätte die Heizung früher melden sollen", status: "correct"}
    feedback: "The model answer is *Ich hätte die Heizung früher melden sollen.*"
  de.b1.unit47.lesson02.exercise01.recognize_felix_wuenschte_angerufen: {instruction: "Which German sentence means \"I wish I had called earlier.\"?", correct_option: "Ich wünschte, ich hätte früher angerufen.", distractors: ["Ich wünschte, ich hätte später angerufen.", "Ich hätte früher anrufen sollen.", "Ich wünschte, ich hätte früher geschrieben."], accepted_answers: [{value: "Ich wünschte, ich hätte früher angerufen.", status: "correct"}], feedback: "*Ich wünschte, ich hätte* + participle expresses a past wish."}
  de.b1.unit47.lesson02.exercise02.recognize_felix_wuenschte_kaputt: {instruction: "Which German sentence means \"I wish the heating hadn't broken.\"?", correct_option: "Ich wünschte, die Heizung wäre nicht kaputt gegangen.", distractors: ["Ich wünschte, die Heizung wäre kaputt gegangen.", "Die Heizung ist nicht kaputt gegangen.", "Ich wünschte, die Wohnung wäre nicht kaputt gegangen."], accepted_answers: [{value: "Ich wünschte, die Heizung wäre nicht kaputt gegangen.", status: "correct"}], feedback: "*wäre nicht kaputt gegangen* uses wäre since kaputt gehen takes sein."}
  de.b1.unit47.lesson02.exercise03.listen_select_wuenschte: {instruction: "Listen. What does Felix wish had happened?", correct_option: "He wishes he had called earlier.", distractors: ["He wishes he hadn't called at all.", "He wishes Frau König had called him.", "He wishes he had reported it later."], accepted_answers: [{value: "He wishes he had called earlier.", status: "correct"}], feedback: "The recording says *Ich wünschte, ich hätte früher angerufen*."}
  de.b1.unit47.lesson02.exercise04.match_wuenschte:
    instruction: "Match each German word or phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "Ich wünschte, ich hätte früher angerufen.", right: "I wish I had called earlier."}
          - {left: "Ich wünschte, die Heizung wäre nicht kaputt gegangen.", right: "I wish the heating hadn't broken."}
          - {left: "wünschen", right: "to wish"}
