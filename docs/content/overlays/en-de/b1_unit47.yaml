  de.b1.unit47.lesson01.exercise02.recognize_felix_nicht_warten_sollen: {instruction: "Which German sentence means \"I shouldn't have waited so long.\"?", correct_option: "Ich hätte nicht so lange warten sollen.", distractors: ["Ich hätte so lange warten sollen.", "Ich habe nicht so lange gewartet.", "Ich hätte nicht so lange arbeiten sollen."], accepted_answers: [{value: "Ich hätte nicht so lange warten sollen.", status: "correct"}], feedback: "*hätte nicht ... warten sollen* means \"shouldn't have waited\": waiting so long was the mistake."}
