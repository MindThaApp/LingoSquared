course:
  title: "German A1"
  description: "Learn A1-level German for everyday greetings and short social exchanges, with detailed English explanations."

units:
  de.a1.unit10.wegbeschreibungen: {title: "Asking for and following directions"}

teaching:
  de.a1.unit10.lesson01.teach.links_abbiegen: {title: "Biegen Sie links ab.", gloss: "Turn left.", note: "*abbiegen* (to turn) is a separable verb -- the prefix *ab* moves to the very end of the clause: *Biegen Sie... ab*, not *Sie biegen ab* or *Abbiegen Sie*."}
  de.a1.unit10.lesson01.teach.rechts_abbiegen: {title: "Biegen Sie rechts ab.", gloss: "Turn right.", note: "Same separable-verb pattern as *links abbiegen*, just with *rechts* (right)."}
  de.a1.unit10.lesson01.teach.geradeaus_gehen: {title: "Gehen Sie geradeaus.", gloss: "Go straight.", note: "*geradeaus* means 'straight ahead' -- no separable prefix here, a simpler formal imperative."}
  de.a1.unit10.lesson01.teach.hier_anhalten: {title: "Halten Sie hier an.", gloss: "Stop here.", note: "*anhalten* (to stop) is also separable -- *an* moves to the end, same pattern as *abbiegen*."}
  de.a1.unit10.lesson01.teach.ecke: {title: "Ecke", gloss: "corner", note: "*Ecke* means corner -- feminine noun, *die Ecke*.", example_gloss: "Turn left at the corner."}

  de.a1.unit10.lesson02.teach.wie_komme_ich_zur_bank: {title: "Wie komme ich zur Bank?", gloss: "How do I get to the bank?", note: "*zur* is the contraction of *zu der* (dative feminine, die Bank) -- the same contraction pattern as *vom* (von + dem) from Unit 9."}
  de.a1.unit10.lesson02.teach.geradeaus_dann_links: {title: "Gehen Sie geradeaus, dann biegen Sie an der Ecke links ab.", gloss: "Go straight, then turn left at the corner.", note: "*dann* (then) links two direction steps together; *an der Ecke* (at the corner) uses the dative feminine article, matching the location-preposition pattern from Unit 9."}
  de.a1.unit10.lesson02.teach.ist_es_weit: {title: "Ist es weit?", gloss: "Is it far?", note: "*weit* means far."}
  de.a1.unit10.lesson02.teach.zwei_minuten: {title: "Es ist nur zwei Minuten von hier.", gloss: "It's just two minutes from here.", note: "*nur* means 'only/just.'"}
  de.a1.unit10.lesson02.teach.nicht_verfehlen: {title: "Das können Sie nicht verfehlen.", gloss: "You can't miss it.", note: "*verfehlen* means 'to miss' (fail to find) -- literally 'That can you not miss.'"}

  de.a1.unit10.lesson03.teach.erste_strasse: {title: "Nehmen Sie die erste Straße links.", gloss: "Take the first street on the left.", note: "*erste* means 'first' -- an ordinal number, like English."}
  de.a1.unit10.lesson03.teach.zweite_strasse: {title: "Nehmen Sie die zweite Straße rechts.", gloss: "Take the second street on the right.", note: "*zweite* means 'second.'"}
  de.a1.unit10.lesson03.teach.route_text: {title: "Wegbeschreibung zur Apotheke", gloss: "Directions to the pharmacy", note: "A short set of written directions combining several already-taught phrases."}

  de.a1.unit10.lesson04.teach.line01: {title: "Felix asks for directions", gloss: "Felix: Excuse me, how do I get to the bank?", note: "The same polite opener from Unit 9, now asking for a route instead of just a location."}
  de.a1.unit10.lesson04.teach.line02: {title: "Anna gives the route", gloss: "Anna: Go straight ahead, then turn left at the corner.", note: "A complete answer combines two direction steps with *dann*."}
  de.a1.unit10.lesson04.teach.line03: {title: "Felix confirms and asks more", gloss: "Felix: Turn left at the corner, OK. Is it far?", note: "Felix repeats the direction back to confirm he understood, then asks a natural follow-up."}
  de.a1.unit10.lesson04.teach.line04: {title: "Anna answers how far it is", gloss: "Anna: No, it's only two minutes from here. You can't miss it.", note: "A complete, reassuring answer."}

exercises:
  de.a1.unit10.lesson01.exercise01.listen_richtung:
    instruction: "Listen and select the direction you hear."
    correct_option: "Biegen Sie links ab"
    distractors: ["Biegen Sie rechts ab", "Gehen Sie geradeaus", "Halten Sie hier an"]
    accepted_answers: [{value: "Biegen Sie links ab", status: "correct"}]
    feedback: "*Biegen Sie links ab* means 'Turn left.'"
  de.a1.unit10.lesson01.exercise02.choose_rechts:
    instruction: "The opposite direction of left is..."
    correct_option: "Biegen Sie rechts ab."
    distractors: ["Biegen Sie links ab.", "Gehen Sie geradeaus.", "Halten Sie hier an."]
    accepted_answers: [{value: "Biegen Sie rechts ab.", status: "correct"}]
    feedback: "*Biegen Sie rechts ab* means 'Turn right.'"
  de.a1.unit10.lesson01.exercise03.choose_geradeaus:
    instruction: "Which instruction means keep going without turning?"
    correct_option: "Gehen Sie geradeaus."
    distractors: ["Biegen Sie links ab.", "Biegen Sie rechts ab.", "Halten Sie hier an."]
    accepted_answers: [{value: "Gehen Sie geradeaus.", status: "correct"}]
    feedback: "*Gehen Sie geradeaus* means 'Go straight.'"
  de.a1.unit10.lesson01.exercise04.match_richtungen:
    instruction: "Match each phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "Biegen Sie links ab.", right: "turn left"}
          - {left: "Biegen Sie rechts ab.", right: "turn right"}
          - {left: "Gehen Sie geradeaus.", right: "go straight ahead"}
          - {left: "Halten Sie hier an.", right: "stop here"}
          - {left: "Ecke", right: "where two streets meet"}
        status: "correct"
    feedback: "Each German direction phrase matched to its meaning."
  de.a1.unit10.lesson01.exercise05.write_ecke:
    instruction: "Write the word for where two streets meet."
    accepted_answers:
      - {value: "Ecke", status: "correct"}
      - {value: "Ecke.", status: "correct"}
      - {value: "die Ecke", status: "correct"}
      - {value: "die Ecke.", status: "correct"}
    feedback: "*Ecke* means corner."

  de.a1.unit10.lesson02.exercise01.listen_wie_komme_ich:
    instruction: "Listen and select the question you hear."
    correct_option: "Wie komme ich zur Bank"
    distractors: ["Ist es weit", "Das können Sie nicht verfehlen", "Es ist nur zwei Minuten von hier"]
    accepted_answers: [{value: "Wie komme ich zur Bank", status: "correct"}]
    feedback: "*Wie komme ich zur Bank?* means 'How do I get to the bank?'"
  de.a1.unit10.lesson02.exercise02.listen_route_antwort:
    instruction: "Listen and select the answer you hear."
    correct_option: "Gehen Sie geradeaus, dann biegen Sie an der Ecke links ab"
    distractors: ["Wie komme ich zur Bank", "Ist es weit", "Das können Sie nicht verfehlen"]
    accepted_answers: [{value: "Gehen Sie geradeaus, dann biegen Sie an der Ecke links ab", status: "correct"}]
    feedback: "*Gehen Sie geradeaus, dann biegen Sie an der Ecke links ab* means 'Go straight, then turn left at the corner.'"
  de.a1.unit10.lesson02.exercise03.order_wie_komme_ich:
    instruction: "Put the words in order to ask 'How do I get to the bank?'"
    accepted_answers: [{value: ["Wie", "komme", "ich", "zur", "Bank"], status: "correct"}]
    feedback: "The correct order is *Wie komme ich zur Bank?*"
  de.a1.unit10.lesson02.exercise04.choose_nicht_verfehlen:
    instruction: "The place is very easy to find. What might someone say?"
    correct_option: "Das können Sie nicht verfehlen."
    distractors: ["Ist es weit?", "Wie komme ich zur Bank?", "Es ist nur zwei Minuten von hier."]
    accepted_answers: [{value: "Das können Sie nicht verfehlen.", status: "correct"}]
    feedback: "*Das können Sie nicht verfehlen* means 'You can't miss it.'"
  de.a1.unit10.lesson02.exercise05.write_zwei_minuten:
    instruction: "Write that the place is only two minutes away."
    accepted_answers:
      - {value: "Es ist nur zwei Minuten von hier", status: "correct"}
      - {value: "Es ist nur zwei Minuten von hier.", status: "correct"}
    feedback: "*Es ist nur zwei Minuten von hier* means 'It's just two minutes from here.'"

  de.a1.unit10.lesson03.exercise01.read_erster_schritt:
    instruction: "What is the first step in the directions?"
