course:
  title: "German A1"
  description: "Learn A1-level German for everyday greetings and short social exchanges, with detailed English explanations."

units:
  de.a1.unit10.wegbeschreibungen: {title: "Asking for and following directions"}

teaching:
  de.a1.unit10.lesson01.teach.links_abbiegen: {title: "Biegen Sie links ab.", gloss: "Turn left.", note: "*abbiegen* (to turn) is a separable verb -- the prefix *ab* moves to the very end of the clause: *Biegen Sie... ab*, not *Sie biegen ab* or *Abbiegen Sie*."}
  de.a1.unit10.lesson01.teach.rechts_abbiegen: {title: "Biegen Sie rechts ab.", gloss: "Turn right.", note: "Same separable-verb pattern as *links abbiegen*, just with *rechts* (right)."}
  de.a1.unit10.lesson01.teach.geradeaus_gehen: {title: "Gehen Sie geradeaus.", gloss: "Go straight.", note: "*geradeaus* means 'straight ahead' -- no separable prefix here, a simpler formal imperative."}
  de.a1.unit10.lesson01.teach.hier_anhalten: {title: "Halten Sie hier an.", gloss: "Stop here.", note: "*anhalten* (to stop) is also separable -- *an* moves to the end, same pattern as *abbiegen*."}
  de.a1.unit10.lesson01.teach.ecke: {title: "Ecke", gloss: "corner", note: "*Ecke* means corner -- feminine noun, *die Ecke*.", example_gloss: "Turn left at the corner."}

  de.a1.unit10.lesson02.teach.wie_komme_ich_zur_bank: {title: "Wie komme ich zur Bank?", gloss: "How do I get to the bank?", note: "*zur* is the contraction of *zu der* (dative feminine, die Bank) -- same contraction pattern as unit09's *vom* (von + dem)."}
  de.a1.unit10.lesson02.teach.geradeaus_dann_links: {title: "Gehen Sie geradeaus, dann biegen Sie an der Ecke links ab.", gloss: "Go straight, then turn left at the corner.", note: "*dann* (then) links two direction steps together; *an der Ecke* (at the corner) uses the dative feminine article, matching unit09's location-preposition pattern."}
  de.a1.unit10.lesson02.teach.ist_es_weit: {title: "Ist es weit?", gloss: "Is it far?", note: "*weit* means far."}
  de.a1.unit10.lesson02.teach.zwei_minuten: {title: "Es ist nur zwei Minuten von hier.", gloss: "It's just two minutes from here.", note: "*nur* means 'only/just.'"}
  de.a1.unit10.lesson02.teach.nicht_verfehlen: {title: "Das können Sie nicht verfehlen.", gloss: "You can't miss it.", note: "*verfehlen* means 'to miss' (fail to find) -- literally 'That can you not miss.'"}

  de.a1.unit10.lesson03.teach.erste_strasse: {title: "Nehmen Sie die erste Straße links.", gloss: "Take the first street on the left.", note: "*erste* means 'first' -- an ordinal number, like English."}
  de.a1.unit10.lesson03.teach.zweite_strasse: {title: "Nehmen Sie die zweite Straße rechts.", gloss: "Take the second street on the right.", note: "*zweite* means 'second.'"}
  de.a1.unit10.lesson03.teach.route_text: {title: "Wegbeschreibung zur Apotheke", gloss: "Directions to the pharmacy", note: "A short set of written directions combining several already-taught phrases."}

  de.a1.unit10.lesson04.teach.line01: {title: "Felix fragt nach dem Weg", gloss: "Felix: Entschuldigung, wie komme ich zur Bank?", note: "The same polite opener from unit09, now asking for a route instead of just a location."}
  de.a1.unit10.lesson04.teach.line02: {title: "Antwort mit der Route", gloss: "Anna: Gehen Sie geradeaus, dann biegen Sie an der Ecke links ab.", note: "A complete answer combines two direction steps with *dann*."}
  de.a1.unit10.lesson04.teach.line03: {title: "Felix bestätigt und fragt weiter", gloss: "Felix: An der Ecke links abbiegen, gut. Ist es weit?", note: "Felix repeats the direction back to confirm he understood, then asks a natural follow-up."}
  de.a1.unit10.lesson04.teach.line04: {title: "Antwort zur Entfernung", gloss: "Anna: Nein, es ist nur zwei Minuten von hier. Das können Sie nicht verfehlen.", note: "A complete, reassuring answer."}

