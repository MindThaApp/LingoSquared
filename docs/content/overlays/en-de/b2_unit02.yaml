    accepted_answers:
      - {value: "Sie kann nicht im Stau stehen, denn sie fährt nicht mit dem Auto", status: correct}
      - {value: "Sie kann nicht im Stau stehen denn sie fährt nicht mit dem Auto", status: correct}
      - {value: "Sie kann nicht im Stau stehen, denn sie faehrt nicht mit dem Auto", status: correct}
    feedback: "Sie kann nicht im Stau stehen, denn sie fährt nicht mit dem Auto means she cannot be stuck in traffic, because she doesn't drive by car."
  de.b2.unit02.lesson02.exercise08.dictation_muss_stau:
    instruction: "Type what you hear."
    correct_response: "Sie muss im Stau stehen"
    orthography_strict: true
    feedback: "You heard Sie muss im Stau stehen — she must be stuck in traffic."

  de.b2.unit02.lesson03.exercise01.recognize_moeglicherweise:
    instruction: "What does this word mean?"
    correct_option: "possibly / perhaps"
    distractors: [certainly, never, undoubtedly]
    accepted_answers: [{value: "possibly / perhaps", status: correct}]
    feedback: "Möglicherweise means possibly / perhaps."
  de.b2.unit02.lesson03.exercise02.listen_koennte_stau:
    instruction: "Listen and select what you hear."
    correct_option: "She might be stuck in traffic."
    distractors: ["She must be stuck in traffic.", "She was stuck in traffic.", "She can't be stuck in traffic."]
    accepted_answers: [{value: "She might be stuck in traffic.", status: correct}]
    feedback: "Sie könnte im Stau stehen means she might be stuck in traffic."
  de.b2.unit02.lesson03.exercise03.match_possibility_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {könnte: "might / could", möglicherweise: "possibly / perhaps", vielleicht: maybe, "zu Hause": "at home", "ich vermute": "I suppose", "ich weiß es nicht genau": "I'm not sure"}
        status: correct
    feedback: "These are this lesson's possibility words."
  de.b2.unit02.lesson03.exercise04.order_koennte_stau:
    instruction: "Put the words in order: She might be stuck in traffic."
    accepted_answers:
      - {value: "Sie könnte im Stau stehen", status: correct}
    feedback: "Sie könnte im Stau stehen means she might be stuck in traffic."
  de.b2.unit02.lesson03.exercise05.translate_koennte_zu_hause:
    instruction: "Translate into German, using könnte: She might be at home."
    accepted_answers:
      - {value: "Sie könnte zu Hause sein", status: correct}
