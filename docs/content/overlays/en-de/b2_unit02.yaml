    correct_option: missed
    distractors: [forgotten, overslept, happened]
    accepted_answers: [{value: missed, status: correct}]
    feedback: "Verpasst means missed, from verpassen (to miss)."
  de.b2.unit02.lesson04.exercise02.listen_muss_zug_verpasst:
