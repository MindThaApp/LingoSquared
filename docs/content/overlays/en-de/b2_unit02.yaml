  de.b2.unit02.lesson02.exercise03.match_deduction_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {muss: "must (deduction)", "kann nicht": "cannot (be)", denn: because, also: "so / therefore", "im Stau": "stuck in traffic", krank: sick, Auto: car, weg: "gone / away"}
        status: correct
