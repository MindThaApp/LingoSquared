    feedback: "Sie könnte zu Hause sein means she might be at home."
  de.b2.unit02.lesson03.exercise06.speak_vielleicht_zu_hause:
    instruction: "Say aloud in German, guessing: Maybe she is still at home."
    accepted_answers:
      - {value: "Vielleicht ist sie noch zu Hause", status: correct}
    feedback: "Vielleicht ist sie noch zu Hause means maybe she is still at home."
  de.b2.unit02.lesson03.exercise07.write_nicht_genau:
