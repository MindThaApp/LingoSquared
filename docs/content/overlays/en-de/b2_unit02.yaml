review:
  status: unreviewed
  required_next_reviewer: fresh_context_reviewer
  notes: >-
    Overlay for de's second B2 unit, authored alongside the realization.
    English speakers' real interference risks for this outcome: (1)
    epistemic 'muss' (must be, deduction) is easy to confuse with
    obligation 'muss' (must do) -- glosses explicitly mark "(deduction)";
    (2) 'kann nicht' for impossibility looks identical to ordinary negated
    ability -- glossed as "cannot (be)" throughout; (3) the past-speculation
    construction (modal + Partizip II + haben/sein) has no equivalent
    English word order -- flagged in lesson04; (4) 'könnte' (subjunctive II
    of können, epistemic possibility) vs. plain 'kann' (ability/permission)
    is a real confusion risk -- kept to 'könnte' only for speculation in
    this unit. No sibling direction file (de-en b2) was consulted.

course:
  title: German B2
  description: >-
    Upper-intermediate German: speculate about causes and consequences
    with graded certainty -- adverbs of certainty (vielleicht,
    wahrscheinlich, zweifellos), present-tense deduction and impossibility
    (muss, kann nicht), tentative possibility (könnte, möglicherweise), and
    past speculation (muss/könnte + past participle + haben/sein) --
    around a colleague's unexplained late arrival at work.

units:
  de.b2.unit02.spekulation:
    title: "Speculation"
    description: Speculate about causes and consequences with graded certainty -- say what may, might, must, or cannot be the case, in the present and the past, and distinguish deduction from guesswork.

lessons:
  de.b2.unit02.lesson01.wie_sicher_sind_sie:
    title: "How certain are you?"
  de.b2.unit02.lesson02.deduktion:
    title: "Deduction: It must be so"
  de.b2.unit02.lesson03.moeglichkeit:
    title: "Guessing or deducing?"
  de.b2.unit02.lesson04.ueber_die_vergangenheit_spekulieren:
    title: "Speculating about the past"
  de.b2.unit02.lesson05.fakt_oder_spekulation:
    title: "Fact or speculation?"
  de.b2.unit02.lesson06.spekulieren_im_gespraech:
    title: "Speculating in conversation"

teaching:
  de.b2.unit02.lesson01.teach.bauer_noch_nicht_da:
    title: "Mrs. Bauer isn't here yet."
    gloss: "Mrs. Bauer isn't here yet."
    note: "Frau Bauer is Felix's established engineer colleague. She is missing from a meeting -- the scene this whole unit speculates about."
  de.b2.unit02.lesson01.teach.warum_so_spaet:
    title: "Why is she so late?"
    gloss: "Why is she so late?"
  de.b2.unit02.lesson01.teach.unterwegs:
    title: "on the way"
    gloss: "on the way"
    example_gloss: "She is on the way."
  de.b2.unit02.lesson01.teach.vielleicht:
    title: maybe
    gloss: maybe
    note: "*Vielleicht* is the lowest-certainty marker on this lesson's scale -- a pure guess."
    example_gloss: "Maybe she is on the way."
  de.b2.unit02.lesson01.teach.wahrscheinlich:
    title: probably
    gloss: probably
    example_gloss: "She is probably on the way."
  de.b2.unit02.lesson01.teach.bestimmt:
    title: "surely (I bet)"
    gloss: "surely / I bet"
    note: "*Bestimmt* is a confident, informal 'I bet' -- stronger than *wahrscheinlich*, but still a personal conviction rather than a deduction from evidence."
    example_gloss: "She'll surely come."
  de.b2.unit02.lesson01.teach.wird_wohl:
    title: "is bound to be"
    gloss: "is bound to be / probably is"
    note: "*Werden + wohl* uses the future tense to express present probability, not a real future event: *Sie wird wohl unterwegs sein* = 'She's probably on the way [right now]', not 'she will be on the way'."
    example_gloss: "She's bound to be on the way."
  de.b2.unit02.lesson01.teach.zweifellos:
    title: undoubtedly
    gloss: undoubtedly
    example_gloss: "She is undoubtedly busy."
  de.b2.unit02.lesson01.teach.sicher:
    title: "certainly / for sure"
    gloss: "certainly / for sure"
    example_gloss: "She'll certainly come."
  de.b2.unit02.lesson01.teach.grammar_sicherheitsskala:
    title: "Maybe she is on the way. She is probably on the way. She's bound to be on the way. She is undoubtedly on the way."
    gloss: "Maybe she is on the way. She is probably on the way. She's bound to be on the way. She is undoubtedly on the way."
    note: "A certainty scale, low to high: *vielleicht* < *wahrscheinlich* < *wird wohl* / *bestimmt* < *zweifellos* / *sicher*. Choosing the right marker signals exactly how sure you are."

  de.b2.unit02.lesson02.teach.im_stau_stehen:
    title: "to be stuck in traffic"
    gloss: "to be stuck in traffic"
    note: "*Im Stau stehen* -- literally 'to stand in the traffic jam' -- is the fixed German idiom for being stuck in traffic."
  de.b2.unit02.lesson02.teach.muss_stau:
    title: "She must be stuck in traffic."
    gloss: "She must be stuck in traffic."
    note: "*Muss* here is EPISTEMIC -- a deduction from evidence ('the facts force me to conclude this'), not an obligation ('she has to'). English 'must' works the same way, so the logic transfers directly."
  de.b2.unit02.lesson02.teach.krank:
    title: sick
    gloss: sick
    example_gloss: "She isn't sick today."
  de.b2.unit02.lesson02.teach.kann_nicht_sein:
    title: "cannot be"
    gloss: "cannot be (impossibility)"
    note: "*Kann nicht ... sein* rules a possibility out entirely -- the deductive opposite of *muss*. Not to be confused with ordinary 'cannot' for ability."
    example_gloss: "She cannot be sick."
  de.b2.unit02.lesson02.teach.das_kann_nicht_sein:
    title: "That can't be."
    gloss: "That can't be. / That's not possible."
  de.b2.unit02.lesson02.teach.fahren:
    title: "to drive"
    gloss: "to drive"
    note: "*Fahren* = to drive/go (by vehicle). *Mit dem Auto fahren* = 'to go by car'. Present tense: *fährt* (she drives)."
    example_gloss: "She often drives by car."
  de.b2.unit02.lesson02.teach.kann_nicht_denn:
    title: "She can't be stuck in traffic, because she doesn't drive by car."
    gloss: "She can't be stuck in traffic, because she doesn't drive by car."
    note: "*Denn* gives the evidence behind a deduction -- the reason you're ruling a possibility out."
  de.b2.unit02.lesson02.teach.also:
    title: "so / therefore"
    gloss: "so / therefore"
    note: "*Also* draws a conclusion from evidence just stated. As the first element it triggers verb-second inversion: *also muss sie...* (so she must...)."
    example_gloss: "Her car is gone. So she must be on the way."
  de.b2.unit02.lesson02.teach.grammar_deduktion:
    title: "She can't be stuck in traffic, because she doesn't drive by car. Her car is gone, so she must be on the way."
    gloss: "She can't be stuck in traffic, because she doesn't drive by car. Her car is gone, so she must be on the way."
    note: "Deduction reasons from evidence to a near-certain conclusion: *kann nicht* (cannot be true, backed here by *denn* -- she isn't driving, so she can't be in a car traffic jam) and *muss* (must be true, drawn with *also* -- her car being gone means she must be en route some other way)."

  de.b2.unit02.lesson03.teach.koennte:
    title: "might / could"
    gloss: "might / could (possibility)"
    note: "*Könnte* is the subjunctive II of *können*, used here for epistemic possibility -- a softer, less certain claim than *muss*. Don't confuse it with plain *kann* (ability/permission)."
    example_gloss: "She might be stuck in traffic."
  de.b2.unit02.lesson03.teach.moeglicherweise:
    title: "possibly / perhaps"
    gloss: "possibly / perhaps"
    example_gloss: "Possibly she is still at home."
  de.b2.unit02.lesson03.teach.wissen:
    title: "to know"
    gloss: "to know"
    note: "*Wissen* = to know (a fact). *Ich weiß es nicht genau* = 'I don't know for sure' -- the standard hedge for a genuine guess."
    example_gloss: "I don't know for sure."
  de.b2.unit02.lesson03.teach.vermuten:
    title: "to suppose / guess"
    gloss: "to suppose / guess"
    note: "*Ich vermute, dass...* = 'I suppose that...' -- a guess you're willing to state, but own as a guess, unlike *muss* (a confident deduction)."
    example_gloss: "I suppose that she is at home."
  de.b2.unit02.lesson03.teach.grammar_vermutung_vs_deduktion:
    title: "I suppose that she is at home, but I don't know for sure. Her car is gone, so she must be on the way."
    gloss: "I suppose that she is at home, but I don't know for sure. Her car is gone, so she must be on the way."
    note: "A guess (*ich vermute*) and a deduction (*also muss*) are both speculation, but at different certainty levels -- a guess admits it might be wrong; a deduction claims the evidence forces the conclusion."

  de.b2.unit02.lesson04.teach.haben:
    title: "to have"
    gloss: "to have"
    note: "*Haben* is also the auxiliary for past speculation: *muss ... haben* + past participle = 'must have (done)'."
    example_gloss: "She must be in a hurry."
  de.b2.unit02.lesson04.teach.zug_verpassen:
    title: "to miss the train"
    gloss: "to miss the train"
    note: "*Den Zug verpassen* = to miss the train. Past participle: *verpasst*. With the auxiliary *hat*: *Sie hat den Zug verpasst* (she missed the train, stated as fact)."
    example_gloss: "She missed the train."
  de.b2.unit02.lesson04.teach.muss_zug_verpasst_haben:
    title: "She must have missed the train."
    gloss: "She must have missed the train."
    note: "Past speculation: *muss* + past participle + *haben* (sent to the very end). English 'must have missed' puts the auxiliary in the middle; German puts both *verpasst* and *haben* after the object."
  de.b2.unit02.lesson04.teach.passieren:
    title: "to happen"
    gloss: "to happen"
    note: "*Passieren* takes *sein*, not *haben*, as its auxiliary: *etwas muss passiert sein* (something must have happened)."
    example_gloss: "Something must have happened."
  de.b2.unit02.lesson04.teach.verschlafen:
    title: "to oversleep"
    gloss: "to oversleep"
    note: "*Verschlafen* is used WITHOUT a reflexive pronoun in standard German (unlike some related languages) -- just *sie hat verschlafen*, 'she overslept'."
    example_gloss: "She must have overslept."
  de.b2.unit02.lesson04.teach.termin_vergessen:
    title: "the appointment"
    gloss: "the appointment"
    note: "*Der Termin* = appointment/meeting slot. *Einen Termin vergessen* = to forget an appointment; past participle *vergessen* (same form as the infinitive)."
    example_gloss: "She forgot an appointment."
  de.b2.unit02.lesson04.teach.koennte_termin_vergessen_haben:
    title: "She might have forgotten the appointment."
    gloss: "She might have forgotten the appointment."
    note: "*Könnte* + past participle + *haben* = 'might have (done)' -- the tentative-possibility version of the past-speculation pattern."
  de.b2.unit02.lesson04.teach.grammar_vergangenheit:
    title: "She must have missed the train. Something must have happened. She might have overslept."
    gloss: "She must have missed the train. Something must have happened. She might have overslept."
    note: "Past speculation always needs modal + past participle + *haben*/*sein* at the very end -- *muss* for a confident deduction, *könnte* for a tentative guess."

  de.b2.unit02.lesson05.teach.text:
    title: "Reading: why is Frau Bauer late?"
    gloss: "Mrs. Bauer is missing from the meeting today. Her phone is off. She's probably stuck in traffic, because it's rush hour. Maybe she overslept, but I don't know that for sure. One thing is certain: she's not home yet, because her car is gone."
    glosses:
      fehlt: "is missing (from fehlen, to be missing/absent)"
      heute: today
      Meeting: meeting
      Ihr: "her (possessive, capitalized here only by sentence position)"
      Telefon: phone
      aus: "off / out"
      Hauptverkehrszeit: "rush hour"
      Eins: "one (eins ist sicher = one thing is certain)"

  de.b2.unit02.lesson06.teach.heute_morgen_gesprochen:
    title: "I spoke with her this morning."
    gloss: "I spoke with her this morning."
    note: "*Jemanden sprechen* here means 'to see/talk to someone' -- *ich habe sie heute Morgen noch gesprochen* is Frau Vogel's evidence that rules out oversleeping."
  de.b2.unit02.lesson06.teach.dann:
    title: "then / in that case"
    gloss: "then / in that case"
    example_gloss: "Then she must have missed the train."
  de.b2.unit02.lesson06.teach.nein:
    title: "no"
    gloss: "no"
    example_gloss: "No, that can't be."
  de.b2.unit02.lesson06.teach.dialogue_felix_setup:
    title: "Felix: Mrs. Bauer is still missing. Why is she so late?"
    gloss: "Felix: Mrs. Bauer is still missing. Why is she so late?"
  de.b2.unit02.lesson06.teach.dialogue_vogel_deduction:
    title: "Frau Vogel: She's probably stuck in traffic. It's rush hour."
    gloss: "Frau Vogel: She's probably stuck in traffic. It's rush hour."
  de.b2.unit02.lesson06.teach.dialogue_felix_possibility:
    title: "Felix: Could she have overslept?"
    gloss: "Felix: Could she have overslept?"
  de.b2.unit02.lesson06.teach.dialogue_vogel_rule_out:
    title: "Frau Vogel: No, that can't be. I spoke with her this morning."
    gloss: "Frau Vogel: No, that can't be. I spoke with her this morning."
  de.b2.unit02.lesson06.teach.dialogue_felix_past_deduction:
    title: "Felix: Then she must have missed the train."
    gloss: "Felix: Then she must have missed the train."
  de.b2.unit02.lesson06.teach.dialogue_vogel_guess:
    title: "Frau Vogel: Maybe. I don't know for sure."
    gloss: "Frau Vogel: Maybe. I don't know for sure."
  de.b2.unit02.lesson06.teach.grammar_volle_spekulation:
    title: "She must have missed the train. She's probably stuck in traffic. She might have overslept, but I don't know that for sure."
    gloss: "She must have missed the train. She's probably stuck in traffic. She might have overslept, but I don't know that for sure."
    note: "A full speculation mixes certainty levels naturally: a confident past deduction (*muss ... haben*), a probable present cause (*wahrscheinlich*), and an admitted guess (*könnte ... haben*, *ich weiß es nicht genau*)."

