  de.b2.unit02.lesson04.exercise03.match_past_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {"muss ... haben": "must have (done)", "könnte ... haben": "might have (done)", Zug: train, verpasst: missed, vergessen: forgotten, verschlafen: overslept, passiert: happened, Termin: appointment}
        status: correct
    feedback: "These are this lesson's past-speculation words."
  de.b2.unit02.lesson04.exercise04.order_muss_verpasst:
    instruction: "Put the words in order: She must have missed the train."
    accepted_answers:
      - {value: "Sie muss den Zug verpasst haben", status: correct}
    feedback: "Sie muss den Zug verpasst haben means she must have missed the train."
  de.b2.unit02.lesson04.exercise05.translate_muss_verpasst:
    instruction: "Translate into German, using muss ... haben (must have): She must have missed the train."
    accepted_answers:
      - {value: "Sie muss den Zug verpasst haben", status: correct}
    feedback: "Sie muss den Zug verpasst haben means she must have missed the train."
  de.b2.unit02.lesson04.exercise06.write_etwas_passiert:
    instruction: "Write in German, using muss ... sein (must have): Something must have happened."
    accepted_answers:
      - {value: "Etwas muss passiert sein", status: correct}
    feedback: "Etwas muss passiert sein means something must have happened."
  de.b2.unit02.lesson04.exercise07.translate_koennte_verschlafen:
    instruction: "Translate into German, using könnte ... haben (might have): She might have overslept."
    accepted_answers:
      - {value: "Sie könnte verschlafen haben", status: correct}
      - {value: "Sie koennte verschlafen haben", status: correct}
    feedback: "Sie könnte verschlafen haben means she might have overslept."

  de.b2.unit02.lesson05.exercise01.read_fact:
    instruction: "Which of these does the writer state as a FACT, not as speculation?"
    correct_option: "Her car is gone."
    distractors: ["She overslept.", "She is stuck in traffic.", "She is on the way."]
    accepted_answers: [{value: "Her car is gone.", status: correct}]
    feedback: "The writer states as fact: ihr Auto ist weg (her car is gone) -- everything else is hedged with vielleicht/wahrscheinlich."
  de.b2.unit02.lesson05.exercise02.read_guess:
    instruction: "Which cause does the writer only GUESS at, admitting they are not sure?"
    correct_option: "That she overslept."
    distractors: ["That she is stuck in traffic.", "That her phone is off.", "That her car is gone."]
    accepted_answers: [{value: "That she overslept.", status: correct}]
    feedback: "The writer writes: vielleicht hat sie verschlafen, aber das weiß ich nicht genau (maybe she overslept, but I don't know that for sure)."
  de.b2.unit02.lesson05.exercise03.read_deduction:
    instruction: "How certain is the writer that Frau Bauer is stuck in traffic, and on what basis?"
    correct_option: "Fairly certain, based on it being rush hour."
    distractors: ["Completely certain, based on a phone call.", "Not certain at all, a pure guess.", "Certain it is false."]
    accepted_answers: [{value: "Fairly certain, based on it being rush hour.", status: correct}]
    feedback: "The writer uses wird wohl (fairly certain) and gives the reason: denn es ist Hauptverkehrszeit (because it's rush hour)."
  de.b2.unit02.lesson05.exercise04.read_evidence:
    instruction: "What is the writer's evidence that Frau Bauer is not at home?"
    correct_option: "Her car is gone."
    distractors: ["Her phone is off.", "It's rush hour.", "No one has seen her."]
    accepted_answers: [{value: "Her car is gone.", status: correct}]
    feedback: "The writer's evidence: sie ist noch nicht zu Hause, denn ihr Auto ist weg (she's not home yet, because her car is gone)."
  de.b2.unit02.lesson05.exercise05.match_reading_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {heute: today, Meeting: meeting, Telefon: phone, aus: "off / out", Hauptverkehrszeit: "rush hour", Eins: one}
        status: correct
    feedback: "These are the reading's key words."
  de.b2.unit02.lesson05.exercise06.translate_telefon_aus:
    instruction: "Translate into German: Her phone is off."
    accepted_answers:
      - {value: "Ihr Telefon ist aus", status: correct}
    feedback: "Ihr Telefon ist aus means her phone is off."
  de.b2.unit02.lesson05.exercise07.write_hauptverkehrszeit:
    instruction: "Write in German: It is rush hour."
    accepted_answers:
      - {value: "Es ist Hauptverkehrszeit", status: correct}
    feedback: "Es ist Hauptverkehrszeit means it is rush hour."

  de.b2.unit02.lesson06.exercise01.comprehend_first_cause:
    instruction: "What is Frau Vogel's first explanation for why Frau Bauer is late?"
    correct_option: "She is probably stuck in traffic."
    distractors: ["She probably overslept.", "She is probably at home.", "She probably missed the train."]
    accepted_answers: [{value: "She is probably stuck in traffic.", status: correct}]
    feedback: "Frau Vogel's first line: Sie wird wohl im Stau stehen."
  de.b2.unit02.lesson06.exercise02.comprehend_certainty:
    instruction: "When Frau Vogel says 'Nein, das kann nicht sein' about oversleeping, how certain is she, and why?"
    correct_option: "Completely certain -- she has direct evidence Frau Bauer was awake."
    distractors: ["Not certain at all, just a hunch.", "Fairly certain, based on the time of day.", "Uncertain, she is only guessing."]
    accepted_answers: [{value: "Completely certain -- she has direct evidence Frau Bauer was awake.", status: correct}]
    feedback: "Frau Vogel rules oversleeping out completely, giving her evidence: Ich habe sie heute Morgen noch gesprochen (I spoke with her this morning)."
  de.b2.unit02.lesson06.exercise03.comprehend_guess:
    instruction: "Is Frau Vogel's final line ('Vielleicht. Ich weiß es nicht genau.') a deduction or a guess?"
    correct_option: "A guess -- she explicitly admits she isn't sure."
    distractors: ["A deduction from strong evidence.", "A certain fact.", "An impossibility."]
    accepted_answers: [{value: "A guess -- she explicitly admits she isn't sure.", status: correct}]
    feedback: "Ich weiß es nicht genau (I don't know for sure) explicitly marks this as an admitted guess, not a confident deduction."
  de.b2.unit02.lesson06.exercise04.order_dann_verpasst:
    instruction: "Put the words in order: Then she must have missed the train."
    accepted_answers:
      - {value: "Dann muss sie den Zug verpasst haben", status: correct}
    feedback: "Dann muss sie den Zug verpasst haben means then she must have missed the train."
  de.b2.unit02.lesson06.exercise05.speak_muss_stau:
    instruction: "Frau Bauer's car is gone and it is rush hour, but she isn't here. Speculate aloud about the present cause, using muss (deduction): She must be stuck in traffic."
    accepted_answers:
      - {value: "Sie muss im Stau stehen", status: correct}
    feedback: "Sie muss im Stau stehen means she must be stuck in traffic."
  de.b2.unit02.lesson06.exercise06.write_past_and_present:
    instruction: "Write TWO German sentences speculating about why Frau Bauer is late, at DIFFERENT certainty levels. (1) A PAST cause you are sure of (deduction), using muss ... haben: She must have missed the train. (2) A PRESENT cause you are less sure of, using wahrscheinlich: She is probably stuck in traffic."
    accepted_answers:
      - {value: "Sie muss den Zug verpasst haben. Sie steht wahrscheinlich im Stau.", status: correct}
      - {value: "Sie muss den Zug verpasst haben. Sie steht wahrscheinlich im Stau", status: correct}
    feedback: "Two speculations at different certainty levels: Sie muss den Zug verpasst haben. Sie steht wahrscheinlich im Stau."
  de.b2.unit02.lesson06.exercise07.respond_speculate:
    instruction: "Warum ist Frau Bauer so spät?"
    accepted_answers:
      - {value: "Sie wird wohl im Stau stehen", status: correct}
      - {value: "Sie muss im Stau stehen", status: correct}
      - {value: "Sie könnte im Stau stehen", status: correct}
      - {value: "Sie steht wahrscheinlich im Stau", status: correct}
      - {value: "Sie muss den Zug verpasst haben", status: correct}
    feedback: "Sie wird wohl im Stau stehen means she's bound to be stuck in traffic -- a natural reply speculating about the cause. Sie muss/könnte im Stau stehen, Sie steht wahrscheinlich im Stau, and Sie muss den Zug verpasst haben are the same and other taught speculative causes at different certainty levels."
