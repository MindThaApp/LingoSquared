schema_version: "1.1"
overlay_version: "2026.1-draft.1"
overlay_key: "en-de.b1.unit51"
source_language: "en"
target_language: "de"
status: "unreviewed"
generation_provenance: {method: "ai_generated", authoring_system: "claude", human_reviewed: false}
review: {status: "unreviewed", required_next_reviewer: "fresh_context_reviewer", notes: "Third unit of the de B1 completion wave (units 49-53). Needs fresh-context review."}

course:
  title: "German B1"
  description: "Learn B1-level German for expressing hypothetical wishes with wenn ... hätte/wäre, würde ..., and for using würde alone (no if-clause) to soften a suggestion or preference."

units:
  de.b1.unit51.hypothesen_konditional: {title: "Hypotheticals in the Conditional"}

lessons:
  de.b1.unit51.lesson01.wenn_haette_wuerde: {title: "If I had/were ..., I would ..."}
  de.b1.unit51.lesson02.wuerde_alleine: {title: "Would alone: a softened suggestion"}
  de.b1.unit51.lesson03.cafe_dialogue: {title: "Dialogue: If we closed earlier"}

teaching:
  de.b1.unit51.lesson01.teach.anna_zeit_kochen: {title: "Anna states a hypothetical wish", gloss: "Anna: If I had more time, I would cook more often.", note: "*Wenn ich ... hätte, würde ich ...* combines an unreal wenn-clause (Konjunktiv II) with a würde-conditional result.", example_gloss: "Wish: If I had more time, I would cook more often."}
  de.b1.unit51.lesson01.teach.anna_reich_cafe: {title: "Anna states another hypothetical wish", gloss: "Anna: If I were rich, I would open a second cafe.", note: "*Wenn ich ... wäre, würde ich ...* uses wäre (Konjunktiv II of sein) for the unreal condition.", example_gloss: "Wish: If I were rich, I would open a second cafe."}
  de.b1.unit51.lesson02.teach.felix_vorschlagen: {title: "Felix softens a suggestion", gloss: "Felix: I would suggest that we close earlier.", note: "*Ich würde vorschlagen, dass ...* uses würde alone, with no wenn-clause, to soften a suggestion.", example_gloss: "Suggestion: I would suggest that we close earlier."}
  de.b1.unit51.lesson02.teach.felix_lieber_tee: {title: "Felix softens a preference", gloss: "Felix: I would rather drink tea than coffee.", note: "*Ich würde lieber ... als ...* uses würde alone to soften a stated preference.", example_gloss: "Preference: I would rather drink tea than coffee."}
  de.b1.unit51.lesson03.teach.anna_zeit_kochen_dialogue: {title: "Anna repeats her wish", gloss: "Anna: If I had more time, I would cook more often.", note: "Opens the dialogue with the hypothetical wish from lesson01."}
  de.b1.unit51.lesson03.teach.felix_react_and_suggest: {title: "Felix reacts and softens a suggestion", gloss: "Felix: That sounds good. I would suggest that we close earlier.", note: "Felix reacts, then adds his own softened suggestion from lesson02."}
  de.b1.unit51.lesson03.teach.anna_rezept: {title: "Anna adds a further hypothetical", gloss: "Anna: Good idea. And maybe I'd also try a new recipe then.", note: "Anna extends the hypothetical scenario with a further conditional result."}
  de.b1.unit51.lesson03.teach.felix_toll: {title: "Felix closes warmly", gloss: "Felix: That would be great.", note: "A short closing reaction using wäre."}

exercises:
  de.b1.unit51.lesson01.exercise01.recognize_anna_zeit_kochen: {instruction: "Which German sentence means \"If I had more time, I would cook more often.\"?", correct_option: "Wenn ich mehr Zeit hätte, würde ich öfter kochen.", distractors: ["Wenn ich mehr Zeit habe, koche ich öfter.", "Wenn ich mehr Zeit hätte, würde ich seltener kochen.", "Wenn ich reich wäre, würde ich öfter kochen."], accepted_answers: [{value: "Wenn ich mehr Zeit hätte, würde ich öfter kochen.", status: "correct"}], feedback: "*Wenn ich ... hätte, würde ich ...* states an unreal hypothetical and its conditional result."}
  de.b1.unit51.lesson01.exercise02.recognize_anna_reich_cafe: {instruction: "Which German sentence means \"If I were rich, I would open a second cafe.\"?", correct_option: "Wenn ich reich wäre, würde ich ein zweites Café eröffnen.", distractors: ["Wenn ich reich bin, eröffne ich ein zweites Café.", "Wenn ich mehr Zeit hätte, würde ich ein zweites Café eröffnen.", "Wenn ich reich wäre, würde ich öfter kochen."], accepted_answers: [{value: "Wenn ich reich wäre, würde ich ein zweites Café eröffnen.", status: "correct"}], feedback: "*Wenn ich ... wäre, würde ich ...* uses wäre for the unreal condition."}
  de.b1.unit51.lesson01.exercise03.listen_select_zeit_kochen: {instruction: "Listen. What would Anna do if she had more time?", correct_option: "She would cook more often.", distractors: ["She would open a second cafe.", "She would work less often.", "She would travel more often."], accepted_answers: [{value: "She would cook more often.", status: "correct"}], feedback: "The recording says *Wenn ich mehr Zeit hätte, würde ich öfter kochen*."}
  de.b1.unit51.lesson01.exercise04.match_wenn_haette_wuerde:
    instruction: "Match each German word or phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "Wenn ich mehr Zeit hätte, würde ich öfter kochen.", right: "If I had more time, I would cook more often."}
          - {left: "Wenn ich reich wäre, würde ich ein zweites Café eröffnen.", right: "If I were rich, I would open a second cafe."}
          - {left: "öfter", right: "more often"}
          - {left: "kochen", right: "to cook"}
          - {left: "reich", right: "rich"}
          - {left: "eröffnen", right: "to open"}
        status: "correct"
    feedback: "These pieces build two hypothetical wishes with their conditional results."
  de.b1.unit51.lesson01.exercise05.order_anna_zeit_kochen: {instruction: "Put the words in order to say \"If I had more time, I would cook more often.\"", accepted_answers: [{value: ["Wenn", "ich", "mehr", "Zeit", "hätte,", "würde", "ich", "öfter", "kochen."], status: "correct"}], feedback: "The correct order is *Wenn ich mehr Zeit hätte, würde ich öfter kochen.*"}
  de.b1.unit51.lesson01.exercise06.write_anna_zeit_kochen:
    instruction: "As Anna, write exactly this hypothetical wish with wenn ... hätte, würde ich ...: if you had more time, you would cook more often."
    accepted_answers:
      - {value: "Wenn ich mehr Zeit hätte, würde ich öfter kochen.", status: "correct"}
      - {value: "Wenn ich mehr Zeit hätte, würde ich öfter kochen", status: "correct"}
      - {value: "Wenn ich mehr Zeit hätte würde ich öfter kochen.", status: "correct"}
      - {value: "Wenn ich mehr Zeit hätte würde ich öfter kochen", status: "correct"}
    feedback: "The model answer is *Wenn ich mehr Zeit hätte, würde ich öfter kochen.*"
  de.b1.unit51.lesson02.exercise01.recognize_felix_vorschlagen: {instruction: "Which German sentence means \"I would suggest that we close earlier.\"?", correct_option: "Ich würde vorschlagen, dass wir früher schließen.", distractors: ["Ich schlage vor, dass wir früher schließen.", "Ich würde vorschlagen, dass wir später schließen.", "Ich würde vorschlagen, dass wir früher öffnen."], accepted_answers: [{value: "Ich würde vorschlagen, dass wir früher schließen.", status: "correct"}], feedback: "*Ich würde vorschlagen, dass ...* softens the suggestion with würde alone, no if-clause."}
  de.b1.unit51.lesson02.exercise02.recognize_felix_lieber_tee: {instruction: "Which German sentence means \"I would rather drink tea than coffee.\"?", correct_option: "Ich würde lieber Tee als Kaffee trinken.", distractors: ["Ich trinke lieber Tee als Kaffee.", "Ich würde lieber Kaffee als Tee trinken.", "Ich würde vorschlagen, Tee zu trinken."], accepted_answers: [{value: "Ich würde lieber Tee als Kaffee trinken.", status: "correct"}], feedback: "*Ich würde lieber ... als ...* softens the preference with würde alone."}
  de.b1.unit51.lesson02.exercise03.listen_select_vorschlagen: {instruction: "Listen. What softened suggestion does Felix make?", correct_option: "He suggests they close earlier.", distractors: ["He suggests they close later.", "He suggests they hire someone new.", "He suggests they change the menu."], accepted_answers: [{value: "He suggests they close earlier.", status: "correct"}], feedback: "The recording says *Ich würde vorschlagen, dass wir früher schließen*."}
  de.b1.unit51.lesson02.exercise04.match_wuerde_alleine:
    instruction: "Match each German word or phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "Ich würde vorschlagen, dass wir früher schließen.", right: "I would suggest that we close earlier."}
          - {left: "Ich würde lieber Tee als Kaffee trinken.", right: "I would rather drink tea than coffee."}
          - {left: "vorschlagen", right: "to suggest"}
          - {left: "lieber", right: "rather / preferably"}
          - {left: "schließen", right: "to close"}
          - {left: "trinken", right: "to drink"}
        status: "correct"
    feedback: "These pieces build a softened suggestion and a softened preference, both using würde alone."
  de.b1.unit51.lesson02.exercise05.order_felix_vorschlagen: {instruction: "Put the words in order to say \"I would suggest that we close earlier.\"", accepted_answers: [{value: ["Ich", "würde", "vorschlagen,", "dass", "wir", "früher", "schließen."], status: "correct"}], feedback: "The correct order is *Ich würde vorschlagen, dass wir früher schließen.*"}
  de.b1.unit51.lesson02.exercise06.write_felix_vorschlagen:
    instruction: "As Felix, soften this suggestion exactly with Ich würde vorschlagen, dass ... (no if-clause): you would suggest closing earlier."
    accepted_answers:
      - {value: "Ich würde vorschlagen, dass wir früher schließen.", status: "correct"}
      - {value: "Ich würde vorschlagen, dass wir früher schließen", status: "correct"}
      - {value: "Ich würde vorschlagen dass wir früher schließen.", status: "correct"}
      - {value: "Ich würde vorschlagen dass wir früher schließen", status: "correct"}
    feedback: "The model answer is *Ich würde vorschlagen, dass wir früher schließen.*"
  de.b1.unit51.lesson03.exercise01.choose_anna_zeit_kochen: {instruction: "What does Anna say she would do if she had more time?", correct_option: "She would cook more often.", distractors: ["She would open a second cafe.", "She would close the cafe earlier.", "She would try a new recipe."], accepted_answers: [{value: "She would cook more often.", status: "correct"}], feedback: "Anna says *Wenn ich mehr Zeit hätte, würde ich öfter kochen*."}
  de.b1.unit51.lesson03.exercise02.choose_felix_react_and_suggest: {instruction: "What does Felix suggest, and is it phrased as a real plan or a softened suggestion?", correct_option: "A softened suggestion: closing earlier.", distractors: ["A firm plan: closing earlier.", "A softened suggestion: opening later.", "A firm plan: hiring someone new."], accepted_answers: [{value: "A softened suggestion: closing earlier.", status: "correct"}], feedback: "Felix says *Ich würde vorschlagen, dass wir früher schließen*, using würde alone."}
  de.b1.unit51.lesson03.exercise03.listen_dialogue_hypothesen_konditional: {instruction: "Listen to the dialogue. What would Anna try if they closed earlier?", correct_option: "She would try a new recipe.", distractors: ["She would open a second cafe.", "She would hire a new colleague.", "She would take a vacation."], accepted_answers: [{value: "She would try a new recipe.", status: "correct"}], feedback: "Anna says *Und vielleicht würde ich dann auch ein neues Rezept ausprobieren*."}
  de.b1.unit51.lesson03.exercise04.match_dialogue_hypothesen_konditional:
    instruction: "Match each German word or phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "Das klingt gut.", right: "That sounds good."}
          - {left: "Und vielleicht würde ich dann auch ein neues Rezept ausprobieren.", right: "And maybe I'd also try a new recipe then."}
          - {left: "Das wäre toll.", right: "That would be great."}
          - {left: "ausprobieren", right: "to try out"}
          - {left: "das Rezept", right: "the recipe"}
          - {left: "klingen", right: "to sound"}
        status: "correct"
    feedback: "These pieces extend the hypothetical scenario in the dialogue."
  de.b1.unit51.lesson03.exercise05.order_anna_rezept: {instruction: "Put the words in order to say \"And maybe I'd also try a new recipe then.\"", accepted_answers: [{value: ["Und", "vielleicht", "würde", "ich", "dann", "auch", "ein", "neues", "Rezept", "ausprobieren."], status: "correct"}], feedback: "The correct order is *Und vielleicht würde ich dann auch ein neues Rezept ausprobieren.*"}
  de.b1.unit51.lesson03.exercise06.write_full_hypothesis_and_suggestion:
    instruction: "Write exactly two sentences: (1) as Anna, a hypothetical wish with wenn ... hätte, würde ich ...: if you had more time, you would cook more often; (2) as Felix, a softened suggestion using würde alone with no if-clause, with Ich würde vorschlagen, dass ...: you would suggest closing earlier."
    accepted_answers:
      - {value: "Wenn ich mehr Zeit hätte, würde ich öfter kochen. Ich würde vorschlagen, dass wir früher schließen.", status: "correct"}
      - {value: "Wenn ich mehr Zeit hätte, würde ich öfter kochen. Ich würde vorschlagen, dass wir früher schließen", status: "correct"}
      - {value: "Wenn ich mehr Zeit hätte würde ich öfter kochen. Ich würde vorschlagen dass wir früher schließen.", status: "correct"}
      - {value: "Wenn ich mehr Zeit hätte würde ich öfter kochen. Ich würde vorschlagen dass wir früher schließen", status: "correct"}
    feedback: "A complete answer gives the full hypothetical, then the standalone softened suggestion: *Wenn ich mehr Zeit hätte, würde ich öfter kochen. Ich würde vorschlagen, dass wir früher schließen.*"
