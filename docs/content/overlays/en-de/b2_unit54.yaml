course:
  title: "German B2"
  description: "Learn to defend a position in a discussion at B2 level: state a claim, support it with reasons and evidence, acknowledge the strongest opposing point, and rebut it without conceding the claim -- following Anna and Felix's cafe argument about Sunday opening hours."

units:
  de.b2.unit54.argumentation: {title: "The revenue convinces me"}

lessons:
  de.b2.unit54.lesson01.argument_wortschatz: {title: "Vocabulary: arguing a case"}
  de.b2.unit54.lesson02.argument_aufbauen: {title: "Building an argument"}
  de.b2.unit54.lesson03.lesetext_sonntagsoeffnung: {title: "Reading: Sunday opening hours"}
  de.b2.unit54.lesson04.streitgespraech: {title: "The benefits outweigh the risks"}

teaching:
  de.b2.unit54.lesson01.teach.behauptung: {title: "die Behauptung", gloss: "the claim", note: "The position a speaker is defending in a discussion.", example_gloss: "Anna's claim is that the cafe should open on Sundays."}
  de.b2.unit54.lesson01.teach.beleg: {title: "der Beleg", gloss: "the evidence", note: "Facts or data used to support a claim.", example_gloss: "The numbers are good evidence for her claim."}
  de.b2.unit54.lesson01.teach.einwand: {title: "der Einwand", gloss: "the counterargument / objection", note: "An opposing point that challenges the claim.", example_gloss: "Felix has a fair objection."}
  de.b2.unit54.lesson01.teach.widerlegen: {title: "widerlegen", gloss: "to rebut", note: "To answer an opposing point by showing why it doesn't defeat your claim.", example_gloss: "Anna rebuts the objection with numbers."}
  de.b2.unit54.lesson01.teach.einraeumen: {title: "einräumen", gloss: "to concede / acknowledge", note: "To admit that an opposing point is reasonable, without giving up your own claim.", example_gloss: "You can acknowledge an objection without conceding the claim."}
  de.b2.unit54.lesson01.teach.ueberwiegen: {title: "überwiegen", gloss: "to outweigh", note: "To be more important than another factor.", example_gloss: "The benefits outweigh the risks."}
  de.b2.unit54.lesson02.teach.einraeumen_trotzdem: {title: "Conceding a risk, then holding your claim", gloss: "I acknowledge that there's a risk, but the numbers still convince me.", note: "*Ich räume ein, dass ...* concedes a point inside a dass-clause (verb-final: es ein Risiko gibt); *aber ... trotzdem* then reasserts the claim without giving it up."}
  de.b2.unit54.lesson02.teach.staerkstes_argument: {title: "Introducing your strongest evidence", gloss: "The strongest argument is that most customers come on Sundays.", note: "*Das stärkste Argument ist, dass ...* introduces supporting evidence; the dass-clause keeps the conjugated verb (kommen) at the end."}
  de.b2.unit54.lesson02.teach.berechtigter_einwand: {title: "Acknowledging, then rebutting", gloss: "That's a fair objection, but the numbers show something else.", note: "*Das ist ein berechtigter Einwand, aber ...* is the standard acknowledge-then-rebut hinge."}
  de.b2.unit54.lesson02.teach.grammar_argument_shape: {title: "The four-move argument", gloss: "A defended argument usually has four steps: state the claim, give evidence, acknowledge the strongest objection, and rebut it. Words like berechtigter Einwand, obwohl, and trotzdem help you acknowledge the objection without giving up the claim. In an obwohl-clause, the conjugated verb goes to the end of the clause: Obwohl die Kosten steigen, bleibt der Gewinn hoch (Although costs are rising, profit stays high).", note: "Grammar note: obwohl (although) and weil/dass send the conjugated verb to the end of their own clause -- obwohl die Kosten steigen keeps steigen last, not steigen die Kosten."}
  de.b2.unit54.lesson03.teach.umsatz: {title: "der Umsatz", gloss: "the revenue / turnover", note: "Revenue is highest on Sundays.", example_gloss: "Revenue is highest on Sundays."}
  de.b2.unit54.lesson03.teach.ruhetag: {title: "der Ruhetag", gloss: "the day of rest", note: "The staff need a day of rest.", example_gloss: "The staff need a day of rest."}
  de.b2.unit54.lesson03.teach.lesetext: {title: "Reading: Sunday opening hours", gloss: "Anna claims that the cafe should open on Sundays too. Her main claim is that Sunday opening significantly increases revenue. The strongest evidence for this is the sales figures: more customers come on Sundays than on any other day. The strongest objection is that the staff need a day of rest and costs will rise. Anna acknowledges this objection, but she rebuts it with the revenue figures: although costs rise, profit stays significantly higher. For that reason, she concludes that the benefits outweigh the risks.", note: "A short reading passage assembling the whole four-move argument: claim, evidence, acknowledged objection, rebuttal, conclusion."}

