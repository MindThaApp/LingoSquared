review: {"status": "unreviewed", "required_next_reviewer": "native_speaker_review", "notes": "English overlay for the real-conditions unit (wenn clauses, optional dann, present tense for the future, sonst, shop-policy Sie). OPEN NATIVE QUESTIONS: none beyond the realization notes."}
course:
  title: "German A2"
  description: "Grammar-led A2 German continuing the Anna and Felix storyline."
  learning_goal: "Give reasons, order events, say what things are for, talk about real conditions, ask indirect questions and pass on messages in German."
units:
  de.a2.unit112.bedingungen: {"title": "If It Rains", "description": "Say what happens or will happen if a real condition is met: weather plans, shop rules and everyday choices."}
lessons:
  de.a2.unit112.lesson01.wenn_dann: {"title": "If It Rains, Then"}
  de.a2.unit112.lesson02.wetterplaene: {"title": "Weather and Plans"}
  de.a2.unit112.lesson03.im_geschaeft: {"title": "In the Shop"}
  de.a2.unit112.lesson04.nicht_sonst: {"title": "Not, No, Otherwise"}
  de.a2.unit112.lesson05.wochenende: {"title": "Anna's Weekend"}
  de.a2.unit112.lesson06.im_gespraech: {"title": "What Are We Doing on Saturday?"}
teaching:
  de.a2.unit112.lesson01.teach.wenn_dann: {"title": "If ... then", "gloss": "if, when / then / to have time / weather / nice", "example_gloss": ["If it rains, then I stay at home.", "If the weather is nice, we go to the park.", "If I have time, I'll call you.", "If Anna comes, we cook."], "note": "A *wenn* clause names a real possibility; the main clause says what follows."}
  de.a2.unit112.lesson01.teach.gn_wenn_dann: {"title": "Wenn ... dann", "gloss": "If it rains, then I stay at home.", "note": "The verb of the *wenn* clause is last. After the comma comes *dann* and then the main verb in second place: *dann bleibe ich*."}
  de.a2.unit112.lesson01.teach.gn_ohne_dann: {"title": "Dann is optional", "gloss": "If I have time, I'll call you.", "note": "You can leave out *dann*. The main verb then stands directly after the comma: *..., rufe ich*."}
  de.a2.unit112.lesson01.teach.gn_hinten: {"title": "Wenn clause last", "gloss": "I stay at home if it rains.", "note": "The *wenn* clause can also follow the main clause. Then the main clause has normal order."}
  de.a2.unit112.lesson02.teach.wetter: {"title": "Weather words", "gloss": "sun / to shine / to snow / cold / jacket / picnic", "example_gloss": ["If the sun shines, we have a picnic.", "If it is cold, I wear a jacket.", "If it snows, we don't go.", "If the weather is bad, we stay in the café."], "note": "Weather decides many plans."}
  de.a2.unit112.lesson02.teach.gn_wetter: {"title": "Weather conditions", "gloss": "If it snows, we don't go.", "note": "*Es regnet*, *es schneit*, *die Sonne scheint*: the weather verbs fit in a *wenn* clause with the verb last."}
  de.a2.unit112.lesson02.teach.gn_praesens: {"title": "Present tense for the future", "gloss": "If it rains tomorrow, we stay at home.", "note": "German uses the present tense for a plan in the future. *Morgen* shows it is about tomorrow."}
  de.a2.unit112.lesson02.teach.gn_trennbar: {"title": "Separable verb in the wenn clause", "gloss": "If Anna calls tomorrow, we go swimming.", "note": "A separable verb is one word at the end of the *wenn* clause: *anruft*."}
  de.a2.unit112.lesson03.teach.geschaeft: {"title": "Shop rules", "gloss": "to pay cash / discount / receipt / to exchange / money back", "example_gloss": ["If you pay cash, you get a discount.", "If you have the receipt, you get your money back.", "If the trousers are too small, you can exchange them.", "If the pullover is broken, we exchange it."], "note": "Shop signs use the formal *Sie*."}
  de.a2.unit112.lesson03.teach.gn_sie: {"title": "Shop signs use Sie", "gloss": "If you pay cash, you get a discount.", "note": "Shops speak to customers with the formal *Sie*. The verb of the *wenn* clause is last; then comes *bekommen Sie*."}
  de.a2.unit112.lesson03.teach.gn_modal: {"title": "Modal verb in the main clause", "gloss": "If the trousers are too small, you can exchange them.", "note": "After the *wenn* clause, the modal verb comes first and the infinitive goes to the end: *können Sie sie umtauschen*."}
  de.a2.unit112.lesson03.teach.gn_umtauschen: {"title": "Separable verb after the comma", "gloss": "If the pullover is broken, we exchange it.", "note": "In the main clause the separable verb is split: *tauschen wir ihn um*."}
  de.a2.unit112.lesson04.teach.sonst: {"title": "Not, no and otherwise", "gloss": "no, not any / not / otherwise / apple / hunger", "example_gloss": ["If I have no time, I'm not coming.", "If it isn't raining, we go to the park.", "I have to go, otherwise I'll miss the bus.", "If you're hungry, eat an apple!"], "note": "A condition can be negative, and *sonst* names what happens if it isn't met."}
  de.a2.unit112.lesson04.teach.gn_negation: {"title": "Negative conditions", "gloss": "If I have no time, I'm not coming. If it isn't raining, we go to the park.", "note": "Use *kein* before a noun and *nicht* with a verb or adjective, as usual."}
  de.a2.unit112.lesson04.teach.gn_sonst: {"title": "Sonst", "gloss": "I have to go, otherwise I'll miss the bus.", "note": "*Sonst* means: if not. It stands first in its clause, so the verb comes second: *sonst verpasse ich*."}
  de.a2.unit112.lesson04.teach.gn_imperativ: {"title": "A command in the main clause", "gloss": "If you're hungry, eat an apple!", "note": "The main clause can be a command. The verb stands first after the comma: *iss*."}
  de.a2.unit112.lesson05.teach.plan: {"title": "Words for the plan", "gloss": "weekend / park / together / to plan", "example_gloss": ["Anna is planning the weekend.", "They go to the park.", "They cook together.", "Nina comes along."], "note": "Words for the text you will read."}
  de.a2.unit112.lesson05.teach.gn_text: {"title": "Wenn at the end", "gloss": "Nina comes along if she has time. Jonas doesn't come if he has to work.", "note": "In these sentences the *wenn* clause comes second. The first part keeps normal word order."}
  de.a2.unit112.lesson05.teach.lesen_wochenende: {"title": "Anna's plan", "gloss": "Anna is planning the weekend. If the sun shines, Anna and Felix have a picnic in the park. If it rains, they stay at home and cook together. Nina comes along if she has time. Jonas doesn't come if he has to work.", "note": "Four conditions, four plans."}
  de.a2.unit112.lesson06.teach.anna_samstag: {"title": "Anna asks", "gloss": "Anna: What are we doing on Saturday, Felix?"}
  de.a2.unit112.lesson06.teach.felix_park: {"title": "Felix suggests", "gloss": "Felix: If the weather is nice, we go to the park."}
  de.a2.unit112.lesson06.teach.anna_regen: {"title": "Anna asks again", "gloss": "Anna: And if it rains?"}
  de.a2.unit112.lesson06.teach.felix_kochen: {"title": "Felix answers", "gloss": "Felix: Then we stay at home and cook together."}
  de.a2.unit112.lesson06.teach.anna_nina: {"title": "Anna asks about Nina", "gloss": "Anna: Good idea! And if Nina has time?"}
  de.a2.unit112.lesson06.teach.felix_mit: {"title": "Felix plans", "gloss": "Felix: Then she comes along. I'll call her."}
  de.a2.unit112.lesson06.teach.anna_klar: {"title": "Anna agrees", "gloss": "Anna: Great. Then everything is clear!"}
exercises:
  de.a2.unit112.lesson01.exercise01.wahl_regnet: {"instruction": "Choose the correct German sentence.", "correct_option": "Wenn es regnet, dann bleibe ich zu Hause.", "distractors": ["Wenn es regnet, dann ich bleibe zu Hause.", "Wenn es regnet, dann ich zu Hause bleibe.", "Wenn es regnet dann, bleibe ich zu Hause."], "accepted_answers": [{"value": "Wenn es regnet, dann bleibe ich zu Hause.", "status": "correct"}], "feedback": "After *dann* the verb comes second."}
  de.a2.unit112.lesson01.exercise02.wahl_zeit: {"instruction": "Choose the correct German sentence.", "correct_option": "Wenn ich Zeit habe, rufe ich dich an.", "distractors": ["Wenn ich Zeit habe, ich rufe dich an.", "Wenn ich habe Zeit, rufe ich dich an.", "Wenn ich Zeit habe, dich rufe ich an."], "accepted_answers": [{"value": "Wenn ich Zeit habe, rufe ich dich an.", "status": "correct"}], "feedback": "*Habe* last, then *rufe ich*."}
  de.a2.unit112.lesson01.exercise03.paare_wenn: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Wenn es regnet, dann bleibe ich zu Hause.", "right": "If it rains, then I stay at home."}, {"left": "Wenn das Wetter schön ist, gehen wir in den Park.", "right": "If the weather is nice, we go to the park."}, {"left": "Wenn ich Zeit habe, rufe ich dich an.", "right": "If I have time, I'll call you."}, {"left": "Wenn Anna kommt, kochen wir.", "right": "If Anna comes, we cook."}, {"left": "Ich bleibe zu Hause, wenn es regnet.", "right": "I stay at home if it rains."}, {"left": "wenn ich Zeit habe", "right": "if I have time"}], "status": "correct"}], "feedback": "Conditions and results."}
  de.a2.unit112.lesson01.exercise04.ordnen_park: {"instruction": "Put the words in order to say 'If the weather is nice, we go to the park.'", "correct_option": "Wenn das Wetter schön ist gehen wir in den Park", "accepted_answers": [{"value": "Wenn das Wetter schön ist gehen wir in den Park", "status": "correct"}], "feedback": "The verb *gehen* follows the *wenn* clause."}
  de.a2.unit112.lesson01.exercise05.luecke_ist: {"instruction": "Complete with the verb.", "correct_option": "ist", "accepted_answers": [{"value": "ist", "status": "correct"}], "feedback": "The verb stands last in the *wenn* clause."}
  de.a2.unit112.lesson01.exercise06.uebersetzen_zeit: {"instruction": "Translate into German.", "accepted_answers": [{"value": "Wenn ich Zeit habe, rufe ich dich an.", "status": "correct"}, {"value": "Wenn ich Zeit habe rufe ich dich an.", "status": "correct"}, {"value": "Ich rufe dich an, wenn ich Zeit habe.", "status": "correct"}, {"value": "Ich rufe dich an wenn ich Zeit habe.", "status": "correct"}, {"value": "Wenn ich Zeit habe, dann rufe ich dich an.", "status": "correct"}, {"value": "Wenn ich Zeit habe dann rufe ich dich an.", "status": "correct"}], "feedback": "*Rufe ... an* is split in the main clause."}
  de.a2.unit112.lesson01.exercise07.schreiben_regen: {"instruction": "Write the requested German sentence.", "accepted_answers": [{"value": "Wenn es regnet, bleibe ich zu Hause.", "status": "correct"}, {"value": "Wenn es regnet bleibe ich zu Hause.", "status": "correct"}, {"value": "Wenn es regnet, dann bleibe ich zu Hause.", "status": "correct"}, {"value": "Wenn es regnet dann bleibe ich zu Hause.", "status": "correct"}, {"value": "Ich bleibe zu Hause, wenn es regnet.", "status": "correct"}, {"value": "Ich bleibe zu Hause wenn es regnet.", "status": "correct"}], "feedback": "*Wenn es regnet, bleibe ich*.", "correct_option": "Wenn es regnet, bleibe ich zu Hause."}
  de.a2.unit112.lesson02.exercise01.wahl_sonne: {"instruction": "Choose the correct German sentence.", "correct_option": "Wenn die Sonne scheint, machen wir ein Picknick.", "distractors": ["Wenn die Sonne scheint, wir machen ein Picknick.", "Wenn scheint die Sonne, machen wir ein Picknick.", "Wenn die Sonne scheint, machen ein Picknick wir."], "accepted_answers": [{"value": "Wenn die Sonne scheint, machen wir ein Picknick.", "status": "correct"}], "feedback": "*Scheint* last, then *machen wir*."}
  de.a2.unit112.lesson02.exercise02.wahl_kalt: {"instruction": "Choose the correct German sentence.", "correct_option": "Wenn es kalt ist, trage ich eine Jacke.", "distractors": ["Wenn es kalt ist, ich trage eine Jacke.", "Wenn es ist kalt, trage ich eine Jacke.", "Wenn es kalt ist, eine Jacke trage ich."], "accepted_answers": [{"value": "Wenn es kalt ist, trage ich eine Jacke.", "status": "correct"}], "feedback": "*Ist* last, then *trage ich*."}
  de.a2.unit112.lesson02.exercise03.paare_wetter: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Wenn die Sonne scheint, machen wir ein Picknick.", "right": "If the sun shines, we have a picnic."}, {"left": "Wenn es kalt ist, trage ich eine Jacke.", "right": "If it is cold, I wear a jacket."}, {"left": "Wenn es schneit, fahren wir nicht.", "right": "If it snows, we don't go."}, {"left": "Wenn das Wetter schlecht ist, bleiben wir im Café.", "right": "If the weather is bad, we stay in the café."}, {"left": "Wenn es morgen regnet, bleiben wir zu Hause.", "right": "If it rains tomorrow, we stay at home."}, {"left": "Wenn Anna morgen anruft, gehen wir schwimmen.", "right": "If Anna calls tomorrow, we go swimming."}], "status": "correct"}], "feedback": "Weather plans."}
  de.a2.unit112.lesson02.exercise04.ordnen_schnee: {"instruction": "Put the words in order to say 'If it snows, we don't go.'", "correct_option": "Wenn es schneit fahren wir nicht", "accepted_answers": [{"value": "Wenn es schneit fahren wir nicht", "status": "correct"}], "feedback": "*Fahren wir* after the comma."}
  de.a2.unit112.lesson02.exercise05.luecke_scheint: {"instruction": "Complete with the verb.", "correct_option": "scheint", "accepted_answers": [{"value": "scheint", "status": "correct"}], "feedback": "The verb *scheint* is last in the *wenn* clause."}
  de.a2.unit112.lesson02.exercise06.uebersetzen_cafe: {"instruction": "Translate into German.", "accepted_answers": [{"value": "Wenn das Wetter schlecht ist, bleiben wir im Café.", "status": "correct"}, {"value": "Wenn das Wetter schlecht ist bleiben wir im Café.", "status": "correct"}, {"value": "Wir bleiben im Café, wenn das Wetter schlecht ist.", "status": "correct"}, {"value": "Wir bleiben im Café wenn das Wetter schlecht ist.", "status": "correct"}, {"value": "Wenn das Wetter schlecht ist, dann bleiben wir im Café.", "status": "correct"}, {"value": "Wenn das Wetter schlecht ist dann bleiben wir im Café.", "status": "correct"}], "feedback": "*Ist* last."}
  de.a2.unit112.lesson02.exercise07.schreiben_jacke: {"instruction": "Write the requested German sentence.", "accepted_answers": [{"value": "Wenn es kalt ist, trage ich eine Jacke.", "status": "correct"}, {"value": "Wenn es kalt ist trage ich eine Jacke.", "status": "correct"}, {"value": "Ich trage eine Jacke, wenn es kalt ist.", "status": "correct"}, {"value": "Ich trage eine Jacke wenn es kalt ist.", "status": "correct"}, {"value": "Wenn es kalt ist, dann trage ich eine Jacke.", "status": "correct"}, {"value": "Wenn es kalt ist dann trage ich eine Jacke.", "status": "correct"}], "feedback": "*Wenn es kalt ist, trage ich*.", "correct_option": "Wenn es kalt ist, trage ich eine Jacke."}
  de.a2.unit112.lesson03.exercise01.wahl_bar: {"instruction": "Choose the correct German sentence.", "correct_option": "Wenn Sie bar bezahlen, bekommen Sie Rabatt.", "distractors": ["Wenn Sie bar bezahlen, Sie bekommen Rabatt.", "Wenn Sie bezahlen bar, bekommen Sie Rabatt.", "Wenn Sie bar bezahlen, bekommen Rabatt Sie."], "accepted_answers": [{"value": "Wenn Sie bar bezahlen, bekommen Sie Rabatt.", "status": "correct"}], "feedback": "*Bezahlen* last, then *bekommen Sie*."}
  de.a2.unit112.lesson03.exercise02.wahl_kassenbon: {"instruction": "Choose the correct German sentence.", "correct_option": "Wenn Sie den Kassenbon haben, bekommen Sie Ihr Geld zurück.", "distractors": ["Wenn Sie den Kassenbon haben, Sie bekommen Ihr Geld zurück.", "Wenn Sie haben den Kassenbon, bekommen Sie Ihr Geld zurück.", "Wenn Sie den Kassenbon haben, bekommen Sie zurück Ihr Geld."], "accepted_answers": [{"value": "Wenn Sie den Kassenbon haben, bekommen Sie Ihr Geld zurück.", "status": "correct"}], "feedback": "*Zurück* closes the main clause."}
  de.a2.unit112.lesson03.exercise03.paare_geschaeft: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Wenn Sie bar bezahlen, bekommen Sie Rabatt.", "right": "If you pay cash, you get a discount."}, {"left": "Wenn Sie den Kassenbon haben, bekommen Sie Ihr Geld zurück.", "right": "If you have the receipt, you get your money back."}, {"left": "Wenn die Hose zu klein ist, können Sie sie umtauschen.", "right": "If the trousers are too small, you can exchange them."}, {"left": "Wenn der Pullover kaputt ist, tauschen wir ihn um.", "right": "If the pullover is broken, we exchange it."}, {"left": "Sie können bar bezahlen.", "right": "You can pay cash."}, {"left": "Wir tauschen ihn um.", "right": "We exchange it."}], "status": "correct"}], "feedback": "Shop rules."}
  de.a2.unit112.lesson03.exercise04.ordnen_pullover: {"instruction": "Put the words in order to say 'If the pullover is broken, we exchange it.'", "correct_option": "Wenn der Pullover kaputt ist tauschen wir ihn um", "accepted_answers": [{"value": "Wenn der Pullover kaputt ist tauschen wir ihn um", "status": "correct"}], "feedback": "The particle *um* is last."}
  de.a2.unit112.lesson03.exercise05.luecke_umtauschen: {"instruction": "Complete with the infinitive.", "correct_option": "umtauschen", "accepted_answers": [{"value": "umtauschen", "status": "correct"}], "feedback": "Modal verb plus infinitive at the end."}
  de.a2.unit112.lesson03.exercise06.uebersetzen_rabatt: {"instruction": "Translate into German.", "accepted_answers": [{"value": "Wenn Sie bar bezahlen, bekommen Sie Rabatt.", "status": "correct"}, {"value": "Wenn Sie bar bezahlen bekommen Sie Rabatt.", "status": "correct"}, {"value": "Sie bekommen Rabatt, wenn Sie bar bezahlen.", "status": "correct"}, {"value": "Sie bekommen Rabatt wenn Sie bar bezahlen.", "status": "correct"}, {"value": "Wenn Sie bar bezahlen, dann bekommen Sie Rabatt.", "status": "correct"}, {"value": "Wenn Sie bar bezahlen dann bekommen Sie Rabatt.", "status": "correct"}], "feedback": "Formal *Sie*."}
  de.a2.unit112.lesson03.exercise07.schreiben_geld: {"instruction": "Write the requested German sentence.", "accepted_answers": [{"value": "Wenn Sie den Kassenbon haben, bekommen Sie Ihr Geld zurück.", "status": "correct"}, {"value": "Wenn Sie den Kassenbon haben, bekommen Sie Ihr Geld zurueck.", "status": "correct"}, {"value": "Wenn Sie den Kassenbon haben bekommen Sie Ihr Geld zurück.", "status": "correct"}, {"value": "Wenn Sie den Kassenbon haben bekommen Sie Ihr Geld zurueck.", "status": "correct"}, {"value": "Sie bekommen Ihr Geld zurück, wenn Sie den Kassenbon haben.", "status": "correct"}, {"value": "Sie bekommen Ihr Geld zurueck, wenn Sie den Kassenbon haben.", "status": "correct"}, {"value": "Sie bekommen Ihr Geld zurück wenn Sie den Kassenbon haben.", "status": "correct"}, {"value": "Sie bekommen Ihr Geld zurueck wenn Sie den Kassenbon haben.", "status": "correct"}, {"value": "Wenn Sie den Kassenbon haben, dann bekommen Sie Ihr Geld zurück.", "status": "correct"}, {"value": "Wenn Sie den Kassenbon haben, dann bekommen Sie Ihr Geld zurueck.", "status": "correct"}, {"value": "Wenn Sie den Kassenbon haben dann bekommen Sie Ihr Geld zurück.", "status": "correct"}, {"value": "Wenn Sie den Kassenbon haben dann bekommen Sie Ihr Geld zurueck.", "status": "correct"}], "feedback": "*Zurück* last.", "correct_option": "Wenn Sie den Kassenbon haben, bekommen Sie Ihr Geld zurück."}
  de.a2.unit112.lesson04.exercise01.wahl_keine: {"instruction": "Choose the correct German sentence.", "correct_option": "Wenn ich keine Zeit habe, komme ich nicht.", "distractors": ["Wenn ich keine Zeit habe, ich komme nicht.", "Wenn ich habe keine Zeit, komme ich nicht.", "Wenn ich Zeit nicht habe, komme ich nicht."], "accepted_answers": [{"value": "Wenn ich keine Zeit habe, komme ich nicht.", "status": "correct"}], "feedback": "*Keine Zeit* before *habe*."}
  de.a2.unit112.lesson04.exercise02.wahl_sonst: {"instruction": "Choose the correct German sentence.", "correct_option": "Ich muss gehen, sonst verpasse ich den Bus.", "distractors": ["Ich muss gehen, sonst ich verpasse den Bus.", "Ich muss gehen, sonst den Bus verpasse ich.", "Ich muss gehen, sonst ich den Bus verpasse."], "accepted_answers": [{"value": "Ich muss gehen, sonst verpasse ich den Bus.", "status": "correct"}], "feedback": "Verb second after *sonst*."}
  de.a2.unit112.lesson04.exercise03.paare_sonst: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Wenn ich keine Zeit habe, komme ich nicht.", "right": "If I have no time, I'm not coming."}, {"left": "Wenn es nicht regnet, gehen wir in den Park.", "right": "If it isn't raining, we go to the park."}, {"left": "Ich muss gehen, sonst verpasse ich den Bus.", "right": "I have to go, otherwise I'll miss the bus."}, {"left": "Wenn du Hunger hast, iss einen Apfel!", "right": "If you're hungry, eat an apple!"}, {"left": "Ich habe keine Zeit.", "right": "I have no time."}, {"left": "Es regnet nicht.", "right": "It isn't raining."}], "status": "correct"}], "feedback": "Negative conditions and sonst."}
  de.a2.unit112.lesson04.exercise04.ordnen_nicht: {"instruction": "Put the words in order to say 'If it isn't raining, we go to the park.'", "correct_option": "Wenn es nicht regnet gehen wir in den Park", "accepted_answers": [{"value": "Wenn es nicht regnet gehen wir in den Park", "status": "correct"}], "feedback": "*Nicht* before the verb at the end."}
  de.a2.unit112.lesson04.exercise05.luecke_sonst: {"instruction": "Complete with the word.", "correct_option": "sonst", "accepted_answers": [{"value": "sonst", "status": "correct"}], "feedback": "*Sonst* means: if not."}
  de.a2.unit112.lesson04.exercise06.uebersetzen_keine: {"instruction": "Translate into German.", "accepted_answers": [{"value": "Wenn ich keine Zeit habe, komme ich nicht.", "status": "correct"}, {"value": "Wenn ich keine Zeit habe komme ich nicht.", "status": "correct"}, {"value": "Ich komme nicht, wenn ich keine Zeit habe.", "status": "correct"}, {"value": "Ich komme nicht wenn ich keine Zeit habe.", "status": "correct"}, {"value": "Wenn ich keine Zeit habe, dann komme ich nicht.", "status": "correct"}, {"value": "Wenn ich keine Zeit habe dann komme ich nicht.", "status": "correct"}], "feedback": "*Keine Zeit*."}
  de.a2.unit112.lesson04.exercise07.schreiben_hunger: {"instruction": "Write the requested German sentence.", "accepted_answers": [{"value": "Wenn du Hunger hast, iss einen Apfel!", "status": "correct"}, {"value": "Wenn du Hunger hast iss einen Apfel!", "status": "correct"}, {"value": "Iss einen Apfel, wenn du Hunger hast!", "status": "correct"}, {"value": "Iss einen Apfel wenn du Hunger hast!", "status": "correct"}], "feedback": "Command after the comma.", "correct_option": "Wenn du Hunger hast, iss einen Apfel!"}
  de.a2.unit112.lesson05.exercise01.lesen_sonne: {"instruction": "Read the text and choose the answer.", "correct_option": "They have a picnic in the park.", "distractors": ["They cook at home.", "They go swimming.", "They stay in the café."], "accepted_answers": [{"value": "They have a picnic in the park.", "status": "correct"}], "feedback": "*Wenn die Sonne scheint, machen Anna und Felix ein Picknick im Park.*"}
  de.a2.unit112.lesson05.exercise02.lesen_jonas: {"instruction": "Read the text and choose the answer.", "correct_option": "When he has to work.", "distractors": ["When it rains.", "When he is tired.", "When Nina comes."], "accepted_answers": [{"value": "When he has to work.", "status": "correct"}], "feedback": "*Jonas kommt nicht, wenn er arbeiten muss.*"}
  de.a2.unit112.lesson05.exercise03.paare_plan: {"instruction": "Match each German sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Anna plant das Wochenende.", "right": "Anna is planning the weekend."}, {"left": "Wenn die Sonne scheint, machen Anna und Felix ein Picknick im Park.", "right": "If the sun shines, Anna and Felix have a picnic in the park."}, {"left": "Wenn es regnet, bleiben sie zu Hause und kochen zusammen.", "right": "If it rains, they stay at home and cook together."}, {"left": "Nina kommt mit, wenn sie Zeit hat.", "right": "Nina comes along if she has time."}, {"left": "Jonas kommt nicht, wenn er arbeiten muss.", "right": "Jonas doesn't come if he has to work."}, {"left": "Sie kochen zusammen.", "right": "They cook together."}], "status": "correct"}], "feedback": "The plan in sentences."}
