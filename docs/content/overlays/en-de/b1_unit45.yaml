course:
  title: "German B1"
  description: "Learn B1-level German for giving advice and suggestions in response to a problem, with An Ihrer Stelle wuerde ich... and Sie sollten..., and responding to advice by accepting it."

units:
  de.b1.unit45.ratschlaege: {title: "Advice"}

lessons:
  de.b1.unit45.lesson01.an_ihrer_stelle: {title: "If I were you, I would ..."}
  de.b1.unit45.lesson02.sie_sollten: {title: "You should ..."}
  de.b1.unit45.lesson03.cafe_dialogue: {title: "Dialogue: I have a lot of stress"}

teaching:
  de.b1.unit45.lesson01.teach.felix_stress: {title: "Felix names his problem", gloss: "Felix: I have a lot of stress at work.", note: "This sets up Anna's advice for the rest of the unit.", example_gloss: "Problem: I have a lot of stress at work."}
  de.b1.unit45.lesson01.teach.anna_advice_nach_hause: {title: "Anna gives hedged advice", gloss: "Anna: If I were you, I would go home earlier.", note: "*An Ihrer Stelle wuerde ich* + infinitive is a hedged \"if I were you, I would ...\" suggestion using the Konjunktiv II of werden.", example_gloss: "Advice: If I were you, I would go home earlier."}
  de.b1.unit45.lesson01.teach.felix_schlecht_schlafen: {title: "Felix names a second problem", gloss: "Felix: I sleep badly.", note: "A second problem, so the learner sees the advice construction reused.", example_gloss: "Problem: I sleep badly."}
  de.b1.unit45.lesson01.teach.anna_advice_kein_kaffee: {title: "Anna gives a second hedged suggestion", gloss: "Anna: If I were you, I wouldn't drink coffee in the evening.", note: "Same An Ihrer Stelle wuerde ich construction, negated with kein before the noun.", example_gloss: "Advice: If I were you, I wouldn't drink coffee in the evening."}
  de.b1.unit45.lesson02.teach.anna_advice_pause: {title: "Anna gives direct advice", gloss: "Anna: You should take breaks more often.", note: "*Sie sollten* + infinitive is a direct \"you should ...\" advice using the Konjunktiv II of sollen.", example_gloss: "Advice: You should take breaks more often."}
  de.b1.unit45.lesson02.teach.anna_advice_chef: {title: "Anna gives a second direct suggestion", gloss: "Anna: You should talk to your boss.", note: "Same Sie sollten construction with a different infinitive.", example_gloss: "Advice: You should talk to your boss."}
  de.b1.unit45.lesson03.teach.felix_state_problem: {title: "Felix restates his problem", gloss: "Felix: I have a lot of stress at work.", note: "Opens the dialogue."}
  de.b1.unit45.lesson03.teach.anna_advice1: {title: "Anna's first piece of advice", gloss: "Anna: If I were you, I would go home earlier.", note: "The hedged construction from lesson01."}
  de.b1.unit45.lesson03.teach.felix_hedge_accept: {title: "Felix reacts cautiously", gloss: "Felix: That's difficult, but I should try it.", note: "Felix does not fully accept yet -- he hedges before Anna's second piece of advice."}
  de.b1.unit45.lesson03.teach.anna_advice2: {title: "Anna's second piece of advice", gloss: "Anna: You should also take breaks more often.", note: "The direct construction from lesson02."}
  de.b1.unit45.lesson03.teach.felix_accept_final: {title: "Felix accepts the advice", gloss: "Felix: That's good advice. Thank you, Anna.", note: "Felix's final line closes the exchange by accepting the advice, matching the spine outcome's requirement to respond to advice given."}

exercises:
  de.b1.unit45.lesson01.exercise01.recognize_anna_advice_nach_hause: {instruction: "Which German sentence means \"If I were you, I would go home earlier.\"?", correct_option: "An Ihrer Stelle würde ich früher nach Hause gehen.", distractors: ["An Ihrer Stelle würde ich später nach Hause gehen.", "Sie sollten früher nach Hause gehen.", "An Ihrer Stelle würde ich abends keinen Kaffee trinken."], accepted_answers: [{value: "An Ihrer Stelle würde ich früher nach Hause gehen.", status: "correct"}], feedback: "*An Ihrer Stelle würde ich* + infinitive is a hedged \"if I were you\" suggestion."}
  de.b1.unit45.lesson01.exercise02.recognize_anna_advice_kein_kaffee: {instruction: "Which German sentence means \"If I were you, I wouldn't drink coffee in the evening.\"?", correct_option: "An Ihrer Stelle würde ich abends keinen Kaffee trinken.", distractors: ["An Ihrer Stelle würde ich morgens keinen Kaffee trinken.", "Sie sollten abends keinen Kaffee trinken.", "An Ihrer Stelle würde ich früher nach Hause gehen."], accepted_answers: [{value: "An Ihrer Stelle würde ich abends keinen Kaffee trinken.", status: "correct"}], feedback: "*abends* (in the evening) is negated with *keinen Kaffee*."}
  de.b1.unit45.lesson01.exercise03.listen_select_an_ihrer_stelle: {instruction: "Listen. What advice is Anna giving?", correct_option: "If I were you, I would go home earlier.", distractors: ["If I were you, I would go home later.", "You should go home earlier.", "If I were you, I would take more breaks."], accepted_answers: [{value: "If I were you, I would go home earlier.", status: "correct"}], feedback: "The recording says *An Ihrer Stelle würde ich früher nach Hause gehen*."}
  de.b1.unit45.lesson01.exercise04.match_an_ihrer_stelle:
    instruction: "Match each German word or phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "Ich habe viel Stress bei der Arbeit.", right: "I have a lot of stress at work."}
          - {left: "An Ihrer Stelle würde ich früher nach Hause gehen.", right: "If I were you, I would go home earlier."}
          - {left: "Ich schlafe schlecht.", right: "I sleep badly."}
          - {left: "An Ihrer Stelle würde ich abends keinen Kaffee trinken.", right: "If I were you, I wouldn't drink coffee in the evening."}
          - {left: "der Stress", right: "the stress"}
          - {left: "schlafen", right: "to sleep"}
        status: "correct"
    feedback: "These pieces build two problem-and-hedged-advice pairs with An Ihrer Stelle würde ich."
  de.b1.unit45.lesson01.exercise05.order_anna_advice_nach_hause: {instruction: "Put the words in order to say \"If I were you, I would go home earlier.\"", accepted_answers: [{value: ["An", "Ihrer", "Stelle", "würde", "ich", "früher", "nach", "Hause", "gehen."], status: "correct"}], feedback: "The correct order is *An Ihrer Stelle würde ich früher nach Hause gehen.*"}
  de.b1.unit45.lesson01.exercise06.write_anna_advice_nach_hause:
    instruction: "As Anna, write exactly this piece of advice with An Ihrer Stelle würde ich...: If I were you, I would go home earlier."
    accepted_answers:
      - {value: "An Ihrer Stelle würde ich früher nach Hause gehen.", status: "correct"}
      - {value: "An Ihrer Stelle würde ich früher nach Hause gehen", status: "correct"}
    feedback: "The model answer is *An Ihrer Stelle würde ich früher nach Hause gehen.*"
  de.b1.unit45.lesson02.exercise01.recognize_anna_advice_pause: {instruction: "Which German sentence means \"You should take breaks more often.\"?", correct_option: "Sie sollten öfter Pause machen.", distractors: ["Sie sollten seltener Pause machen.", "An Ihrer Stelle würde ich öfter Pause machen.", "Sie sollten mit Ihrem Chef sprechen."], accepted_answers: [{value: "Sie sollten öfter Pause machen.", status: "correct"}], feedback: "*Sie sollten* + infinitive is a direct \"you should\" suggestion."}
  de.b1.unit45.lesson02.exercise02.recognize_anna_advice_chef: {instruction: "Which German sentence means \"You should talk to your boss.\"?", correct_option: "Sie sollten mit Ihrem Chef sprechen.", distractors: ["Sie sollten mit Ihrer Kollegin sprechen.", "Sie sollten öfter Pause machen.", "An Ihrer Stelle würde ich mit Ihrem Chef sprechen."], accepted_answers: [{value: "Sie sollten mit Ihrem Chef sprechen.", status: "correct"}], feedback: "*mit Ihrem Chef* means \"with your boss.\""}
  de.b1.unit45.lesson02.exercise03.listen_select_sollten: {instruction: "Listen. What advice is Anna giving?", correct_option: "You should take breaks more often.", distractors: ["You should take fewer breaks.", "You should go home earlier.", "You should talk to your boss."], accepted_answers: [{value: "You should take breaks more often.", status: "correct"}], feedback: "The recording says *Sie sollten öfter Pause machen*."}
  de.b1.unit45.lesson02.exercise04.match_sollten:
    instruction: "Match each German word or phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "Sie sollten öfter Pause machen.", right: "You should take breaks more often."}
          - {left: "Sie sollten mit Ihrem Chef sprechen.", right: "You should talk to your boss."}
          - {left: "der Chef", right: "the boss"}
          - {left: "die Pause", right: "the break"}
          - {left: "sollen", right: "should"}
          - {left: "sprechen", right: "to speak"}
        status: "correct"
    feedback: "These pieces build two pieces of direct advice with Sie sollten."
  de.b1.unit45.lesson02.exercise05.order_anna_advice_chef: {instruction: "Put the words in order to say \"You should talk to your boss.\"", accepted_answers: [{value: ["Sie", "sollten", "mit", "Ihrem", "Chef", "sprechen."], status: "correct"}], feedback: "The correct order is *Sie sollten mit Ihrem Chef sprechen.*"}
  de.b1.unit45.lesson02.exercise06.write_anna_advice_chef:
    instruction: "As Anna, write exactly this piece of advice with Sie sollten...: You should talk to your boss."
    accepted_answers:
      - {value: "Sie sollten mit Ihrem Chef sprechen.", status: "correct"}
      - {value: "Sie sollten mit Ihrem Chef sprechen", status: "correct"}
    feedback: "The model answer is *Sie sollten mit Ihrem Chef sprechen.*"
  de.b1.unit45.lesson03.exercise01.choose_felix_problem: {instruction: "What problem does Felix say he has?", correct_option: "He has a lot of stress at work.", distractors: ["He sleeps badly.", "He has a problem with his boss.", "He is tired of his apartment."], accepted_answers: [{value: "He has a lot of stress at work.", status: "correct"}], feedback: "Felix says *Ich habe viel Stress bei der Arbeit*."}
  de.b1.unit45.lesson03.exercise02.choose_felix_response: {instruction: "How does Felix respond to Anna's first piece of advice?", correct_option: "It's difficult, but he says he should try it.", distractors: ["He fully agrees right away.", "He says the advice is a good idea and thanks Anna.", "He says he already goes home early."], accepted_answers: [{value: "It's difficult, but he says he should try it.", status: "correct"}], feedback: "Felix says *Das ist schwierig, aber ich sollte es versuchen*."}
  de.b1.unit45.lesson03.exercise03.listen_dialogue_ratschlaege: {instruction: "Listen to the dialogue. What does Felix say his problem is?", correct_option: "He has a lot of stress at work.", distractors: ["He sleeps badly.", "He has too many breaks.", "He doesn't like his boss."], accepted_answers: [{value: "He has a lot of stress at work.", status: "correct"}], feedback: "Felix says *Ich habe viel Stress bei der Arbeit*."}
  de.b1.unit45.lesson03.exercise04.match_dialogue_ratschlaege:
    instruction: "Match each German word or phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "Das ist schwierig, aber ich sollte es versuchen.", right: "That's difficult, but I should try it."}
          - {left: "Das ist ein guter Rat. Danke, Anna.", right: "That's good advice. Thank you, Anna."}
          - {left: "schwierig", right: "difficult"}
          - {left: "der Rat", right: "the advice"}
          - {left: "versuchen", right: "to try"}
          - {left: "danken", right: "to thank"}
        status: "correct"
    feedback: "These pieces support Felix's cautious reaction and his final acceptance."
  de.b1.unit45.lesson03.exercise05.order_felix_state_problem: {instruction: "Put the words in order to say \"I have a lot of stress at work.\"", accepted_answers: [{value: ["Ich", "habe", "viel", "Stress", "bei", "der", "Arbeit."], status: "correct"}], feedback: "The correct order is *Ich habe viel Stress bei der Arbeit.*"}
  de.b1.unit45.lesson03.exercise06.write_full_advice_exchange:
    instruction: "As Anna, respond to Felix's problem \"Ich habe viel Stress bei der Arbeit\" with advice using An Ihrer Stelle würde ich... (if I were you, I would go home earlier). Then, as Felix, accept the advice in exactly the words used in the dialogue (that is good advice), in two sentences."
    accepted_answers:
      - {value: "An Ihrer Stelle würde ich früher nach Hause gehen. Das ist ein guter Rat.", status: "correct"}
      - {value: "An Ihrer Stelle würde ich früher nach Hause gehen. Das ist ein guter Rat", status: "correct"}
      - {value: "An Ihrer Stelle würde ich früher nach Hause gehen. Das ist ein guter Rat, Anna.", status: "correct"}
    feedback: "A complete answer gives the hedged advice, then accepts it: *An Ihrer Stelle würde ich früher nach Hause gehen. Das ist ein guter Rat.*"
  de.b1.unit45.lesson03.exercise07.dictation_an_ihrer_stelle: {correct_response: "An Ihrer Stelle würde ich früher nach Hause gehen.", orthography_strict: true, feedback: "Your response must reproduce the sentence exactly."}
  de.b1.unit45.lesson03.exercise08.dictation_sollten: {correct_response: "Sie sollten öfter Pause machen.", orthography_strict: true, feedback: "Your response must reproduce the sentence exactly."}
