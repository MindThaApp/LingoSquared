teaching:
  de.a1.unit23.lesson01.teach.telefon: {title: "Telefon", gloss: "telephone / phone", note: "*Telefon* is the device or phone context.", example_gloss: "The phone is here."}
  de.a1.unit23.lesson01.teach.hier_ist: {title: "Hier ist Anna.", gloss: "This is Anna.", note: "On the phone, *Hier ist...* identifies the speaker.", example_gloss: "On the phone: this is Anna."}
  de.a1.unit23.lesson01.teach.anrufen: {title: "anrufen", gloss: "to call by phone", note: "*Ich rufe ... an* means I am calling.", example_gloss: "I am calling Felix."}
  de.a1.unit23.lesson01.teach.wiederholen: {title: "Können Sie das bitte wiederholen?", gloss: "Could you repeat that, please?", note: "Use this formal request when you did not catch something.", example_gloss: "Could you repeat that, please?"}
  de.a1.unit23.lesson01.teach.langsam: {title: "Sprechen Sie bitte langsam.", gloss: "Please speak slowly.", note: "Formal *Sie* keeps the request polite.", example_gloss: "Please speak slowly."}
  de.a1.unit23.lesson02.teach.nachricht: {title: "Nachricht", gloss: "message", note: "*Nachricht* can mean a text message or written message.", example_gloss: "I am writing a message."}
  de.a1.unit23.lesson02.teach.wegen: {title: "Ich rufe wegen des Treffens an.", gloss: "I am calling about the meeting.", note: "Learn the whole phrase as a simple reason for a call.", example_gloss: "I am calling about the meeting."}
  de.a1.unit23.lesson02.teach.ihnen: {title: "Ich schreibe Ihnen eine Nachricht.", gloss: "I am writing you a message.", note: "*Ihnen* is the formal 'to you' form.", example_gloss: "I am writing you a message."}
  de.a1.unit23.lesson02.teach.text_message: {title: "Kurze Nachricht", gloss: "short message", note: "The message confirms the time and place.", example_gloss: "We are meeting at nine o'clock."}
  de.a1.unit23.lesson02.teach.line01: {title: "Anna meldet sich", gloss: "Anna: Hallo, hier ist Anna.", note: "Anna answers the call and gives her name.", example_gloss: "Hello, this is Anna."}
  de.a1.unit23.lesson02.teach.line02: {title: "Felix nennt den Grund", gloss: "Felix: Guten Tag, Anna. Ich rufe wegen des Treffens an.", note: "Felix says why he is calling.", example_gloss: "I am calling about the meeting."}
  de.a1.unit23.lesson02.teach.line03: {title: "Anna bittet um Wiederholung", gloss: "Anna: Entschuldigung, können Sie das bitte wiederholen?", note: "Anna asks Felix to repeat the information.", example_gloss: "Excuse me, could you repeat that, please?"}
  de.a1.unit23.lesson02.teach.line04: {title: "Felix wiederholt die Details", gloss: "Felix: Ja. Wir treffen uns um neun Uhr vor dem Cafe.", note: "Felix repeats the time and place.", example_gloss: "\"Yes.\" We are meeting at nine o'clock in front of the cafe."}
  de.a1.unit23.lesson02.teach.line05: {title: "Anna nennt die Nachricht", gloss: "Anna: Danke. Ich schreibe Ihnen eine Nachricht.", note: "Anna says she will write a message.", example_gloss: "I am writing you a message."}
exercises:
  de.a1.unit23.lesson01.exercise01.listen_wiederholen: {instruction: "Listen and select the clarification request you hear.", correct_option: "Können Sie das bitte wiederholen?", distractors: ["Sprechen Sie bitte langsam.", "Ich rufe später an.", "Ich schreibe eine Nachricht."], accepted_answers: [{value: "Können Sie das bitte wiederholen?", status: "correct"}], feedback: "*Können Sie das bitte wiederholen?* asks someone to repeat."}
  de.a1.unit23.lesson01.exercise02.choose_call_intro: {instruction: "Which phone phrase means 'This is Anna'?", correct_option: "Hier ist Anna.", distractors: ["Da ist Anna.", "Ich bin Telefon Anna.", "Anna ruft Felix."], accepted_answers: [{value: "Hier ist Anna.", status: "correct"}], feedback: "On the phone, use *Hier ist...* plus the name."}
  de.a1.unit23.lesson01.exercise03.match_phone:
    instruction: "Match each phone word or phrase."
    accepted_answers: [{value: [{left: "Gerät für einen Anruf", right: "Telefon"}, {left: "Anfang am Telefon mit Namen", right: "Hier ist Anna."}, {left: "Verb für telefonisch sprechen wollen", right: "anrufen"}, {left: "Bitte um dieselben Wörter noch einmal", right: "wiederholen"}, {left: "Bitte um weniger Tempo", right: "langsam"}, {left: "höfliches Wort in beiden Bitten", right: "bitte"}], status: "correct"}]
    feedback: "These phrases help you manage a basic phone call."
  de.a1.unit23.lesson01.exercise04.order_repeat: {instruction: "Put the words in order: 'Could you repeat that, please?'", accepted_answers: [{value: ["Können", "Sie", "das", "bitte", "wiederholen"], status: "correct"}], feedback: "The request starts with *Können Sie...*"}
  de.a1.unit23.lesson01.exercise05.write_repeat: {instruction: "Write the taught formal clarification request: Could you repeat that, please?", accepted_answers: [{value: "Können Sie das bitte wiederholen?", status: "correct"}, {value: "Können Sie das bitte wiederholen", status: "correct"}, {value: "Koennen Sie das bitte wiederholen?", status: "correct"}, {value: "Koennen Sie das bitte wiederholen", status: "correct"}], feedback: "*Können Sie das bitte wiederholen?* is the accepted request."}
  de.a1.unit23.lesson02.exercise01.listen_phone_detail: {instruction: "Listen to the dialogue. What is the call about?", correct_option: "a meeting at nine o'clock", distractors: ["a train ticket tomorrow", "a headache at home", "a clothing size"], accepted_answers: [{value: "a meeting at nine o'clock", status: "correct"}], feedback: "Felix calls about a meeting at nine o'clock."}
  de.a1.unit23.lesson02.exercise02.choose_message_meaning: {instruction: "Which sentence confirms the meeting time and place?", correct_option: "Wir treffen uns um neun Uhr vor dem Cafe.", distractors: ["Ich rufe wegen des Treffens an.", "Können Sie das bitte wiederholen?", "Ich schreibe Ihnen eine Nachricht."], accepted_answers: [{value: "Wir treffen uns um neun Uhr vor dem Cafe.", status: "correct"}], feedback: "The sentence gives both time and place."}
  de.a1.unit23.lesson02.exercise03.match_call_details:
    instruction: "Match the call details."
    accepted_answers: [{value: [{left: "Person, die den Anruf annimmt", right: "Anna"}, {left: "Person, die anruft", right: "Felix"}, {left: "Grund des Anrufs", right: "Treffen"}, {left: "Zeit des Treffens", right: "neun Uhr"}, {left: "Ort des Treffens", right: "vor dem Cafe"}, {left: "Text nach dem Anruf", right: "Nachricht"}], status: "correct"}]
    feedback: "The dialogue gives the caller, reason, time, place, and follow-up message."
  de.a1.unit23.lesson02.exercise04.order_message: {instruction: "Put the words in order: 'I am writing you a message.'", accepted_answers: [{value: ["Ich", "schreibe", "Ihnen", "eine", "Nachricht"], status: "correct"}], feedback: "*Ihnen* marks formal 'to you.'"}
  de.a1.unit23.lesson02.exercise05.reply_phone: {instruction: "Reply as Anna. Thank Felix with Danke. and say the exact taught closing: Ich schreibe Ihnen eine Nachricht.", accepted_answers: [{value: "Danke. Ich schreibe Ihnen eine Nachricht.", status: "correct"}, {value: "Danke Ich schreibe Ihnen eine Nachricht", status: "correct"}], feedback: "The reply thanks Felix and names the message."}
  de.a1.unit23.lesson02.exercise06.write_text_message: {instruction: "Write the taught short text message: Hallo Felix. Confirm the meeting at nine o'clock in front of the cafe and close with Bis später.", accepted_answers: [{value: "Hallo Felix. Wir treffen uns um neun Uhr vor dem Cafe. Bis später.", status: "correct"}, {value: "Hallo Felix Wir treffen uns um neun Uhr vor dem Cafe Bis später", status: "correct"}, {value: "Hallo Felix. Wir treffen uns um neun Uhr vor dem Cafe. Bis spaeter.", status: "correct"}, {value: "Hallo Felix Wir treffen uns um neun Uhr vor dem Cafe Bis spaeter", status: "correct"}], feedback: "The message confirms the time and place clearly."}
  de.a1.unit23.lesson02.exercise07.dictation_bitte_wiederholen: {correct_response: "Können Sie das bitte wiederholen?", orthography_strict: true, feedback: "Type the sentence exactly as you hear it."}
