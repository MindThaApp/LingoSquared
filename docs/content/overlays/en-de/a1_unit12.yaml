review: {status: "reviewed", required_next_reviewer: "codex", notes: "English-to-German overlay for simple plans; distractors target English calques and wrong placement of time expressions.\n\nSecond-pass review 2026-10-19: 9 fixes -- lesson02.teach.line01-line06: German titles and German-text glosses -> English titles and translations; lesson02.teach.einladung_text example_gloss 'In context: Shall we go to the museum?' -> 'The message is from Anna.' (matches the example sentence); lesson02.exercise01.listen_activity distractors 'in den Park' / 'ins Cafe' / 'zur Bank' -> full 'Gehen wir ...' sentences (fragment distractors gave the full-sentence answer away); lesson02.exercise02.choose_time instruction 'What time do they agree on?' -> 'Read the dialogue. At what clock time will they meet?' ('am Abend' was also a defensible answer; realization now shows the dialogue); lesson02.exercise03.match_details accepted_answers mirrored to the realization's English clues; lesson02.exercise05.reply_accept_plan instruction pinned to 'yes, gladly' / time and place / 'good, see you tomorrow' and added gerne, 18 Uhr and place-before-time variants; lesson02.exercise06.write_plan_message instruction pinned to the three parts and added an '18 Uhr' variant; lesson01.exercise05.write_decline added 'Ich kann leider nicht(.)' (equally correct for 'Unfortunately I can't')."}
course: {title: "German A1", description: "Learn A1-level German for everyday exchanges, with English explanations."}
units:
  de.a1.unit12.plaene: {title: "Making simple plans"}
teaching:
  de.a1.unit12.lesson01.teach.zeit_haben: {title: "Haben Sie morgen Zeit?", gloss: "Do you have time tomorrow?", note: "German asks 'have time' with *Zeit haben*."}
  de.a1.unit12.lesson01.teach.gehen_wir: {title: "Gehen wir ins Museum?", gloss: "Shall we go to the museum?", note: "*Gehen wir...?* is a compact way to suggest doing something together."}
  de.a1.unit12.lesson01.teach.ja_gern: {title: "Ja, gern.", gloss: "Yes, gladly.", note: "*gern* makes the acceptance warm and natural."}
  de.a1.unit12.lesson01.teach.leider: {title: "leider", gloss: "unfortunately", note: "*Leider* softens a decline.", example_gloss: "In context: Unfortunately I can't."}
  de.a1.unit12.lesson01.teach.kann_nicht: {title: "Leider kann ich nicht.", gloss: "Unfortunately I can't.", note: "The verb *kann* comes before *ich* after initial *Leider*."}
  de.a1.unit12.lesson02.teach.am_abend: {title: "am Abend", gloss: "in the evening", note: "Use *am* with parts of the day.", example_gloss: "In context: Yes, in the evening."}
  de.a1.unit12.lesson02.teach.um_wie_viel_uhr: {title: "Um wie viel Uhr?", gloss: "At what time?", note: "Use this to ask for the exact clock time."}
  de.a1.unit12.lesson02.teach.vor_dem_museum: {title: "um achtzehn Uhr vor dem Museum", gloss: "at 18:00 in front of the museum", note: "German schedules often use 24-hour time."}
  de.a1.unit12.lesson02.teach.einladung_text: {title: "Nachricht von Anna", gloss: "message from Anna", note: "A short invitation can include activity, day, time, and place.", example_gloss: "The message is from Anna."}
  de.a1.unit12.lesson02.teach.line01: {title: "Anna asks if Felix is free", gloss: "Anna: Do you have time tomorrow?", note: "The plan starts by checking availability."}
  de.a1.unit12.lesson02.teach.line02: {title: "Felix says when he is free", gloss: "Felix: Yes, in the evening.", note: "A short answer can name the available part of the day."}
  de.a1.unit12.lesson02.teach.line03: {title: "Anna suggests the museum", gloss: "Anna: Shall we go to the museum?", note: "This proposes the activity."}
  de.a1.unit12.lesson02.teach.line04: {title: "Felix accepts", gloss: "Felix: Yes, gladly. At what time?", note: "Felix accepts and asks for the time.", example_gloss: "In context: At what time?"}
  de.a1.unit12.lesson02.teach.line05: {title: "Anna gives the time and place", gloss: "Anna: At 18:00 in front of the museum.", note: "The answer gives both schedule and meeting point."}
  de.a1.unit12.lesson02.teach.line06: {title: "Felix confirms", gloss: "Felix: Good, see you tomorrow.", note: "A natural closing once the plan is set."}
exercises:
  de.a1.unit12.lesson01.exercise01.listen_vorschlag: {instruction: "Listen and select the suggestion you hear.", correct_option: "Gehen wir ins Museum", distractors: ["Haben Sie morgen Zeit", "Ja, gern", "Leider kann ich nicht"], accepted_answers: [{value: "Gehen wir ins Museum", status: "correct"}], feedback: "*Gehen wir ins Museum?* suggests going to the museum."}
  de.a1.unit12.lesson01.exercise02.choose_accept: {instruction: "Which phrase accepts a plan?", correct_option: "Ja, gern.", distractors: ["Leider kann ich nicht.", "Haben Sie morgen Zeit?", "Um wie viel Uhr?"], accepted_answers: [{value: "Ja, gern.", status: "correct"}], feedback: "*Ja, gern* accepts gladly."}
  de.a1.unit12.lesson01.exercise03.match_plan:
    instruction: "Match each planning phrase to its function."
    accepted_answers: [{value: [{left: "Haben Sie morgen Zeit?", right: "asks if someone is free tomorrow"}, {left: "Gehen wir ins Museum?", right: "suggests a museum visit"}, {left: "Ja, gern.", right: "accepts happily"}, {left: "Leider kann ich nicht.", right: "declines politely"}, {left: "morgen", right: "tomorrow"}, {left: "Zeit", right: "free time"}], status: "correct"}]
    feedback: "Each phrase plays a clear role in making a plan."
  de.a1.unit12.lesson01.exercise04.order_museum: {instruction: "Put the words in order: 'Shall we go to the museum?'", accepted_answers: [{value: ["Gehen", "wir", "ins", "Museum"], status: "correct"}], feedback: "The suggestion starts with *Gehen wir...*"}
  de.a1.unit12.lesson01.exercise05.write_decline: {instruction: "Write a polite decline: Unfortunately I can't.", accepted_answers: [{value: "Leider kann ich nicht", status: "correct"}, {value: "Leider kann ich nicht.", status: "correct"}, {value: "Ich kann leider nicht", status: "correct"}, {value: "Ich kann leider nicht.", status: "correct"}], feedback: "*Leider kann ich nicht* is a polite decline."}
  de.a1.unit12.lesson02.exercise01.listen_activity: {instruction: "Listen to the dialogue. What activity does Anna suggest?", correct_option: "Gehen wir ins Museum", distractors: ["Gehen wir ins Restaurant", "Gehen wir in den Park", "Gehen wir zur Bank"], accepted_answers: [{value: "Gehen wir ins Museum", status: "correct"}], feedback: "Anna suggests the museum."}
  de.a1.unit12.lesson02.exercise02.choose_time: {instruction: "Read the dialogue. At what clock time will they meet?", correct_option: "um achtzehn Uhr", distractors: ["am Abend", "morgen", "vor dem Museum"], accepted_answers: [{value: "um achtzehn Uhr", status: "correct"}], feedback: "They meet at *achtzehn Uhr*."}
  de.a1.unit12.lesson02.exercise03.match_details:
    instruction: "Match the plan details."
    accepted_answers: [{value: [{left: "the day of the plan", right: "morgen"}, {left: "the part of the day when Felix is free", right: "am Abend"}, {left: "the activity", right: "Museum"}, {left: "the exact clock time", right: "achtzehn Uhr"}, {left: "the meeting place", right: "vor dem Museum"}, {left: "Felix accepts the suggestion", right: "Ja, gern."}], status: "correct"}]
    feedback: "The plan has a day, activity, time, and place."
  de.a1.unit12.lesson02.exercise04.order_time_question: {instruction: "Put the words in order: 'At what time?'", accepted_answers: [{value: ["Um", "wie", "viel", "Uhr"], status: "correct"}], feedback: "The full time question is *Um wie viel Uhr?*"}
  de.a1.unit12.lesson02.exercise05.reply_accept_plan: {instruction: "Anna suggests the museum at 18:00. Reply as Felix: say 'yes, gladly', repeat the time and place, then say 'good, see you tomorrow'.", accepted_answers: [{value: "Ja, gern. Um achtzehn Uhr vor dem Museum. Gut, bis morgen.", status: "correct"}, {value: "Ja, gern Um achtzehn Uhr vor dem Museum Gut bis morgen", status: "correct"}, {value: "Ja, gerne. Um achtzehn Uhr vor dem Museum. Gut, bis morgen.", status: "correct"}, {value: "Ja, gern. Um 18 Uhr vor dem Museum. Gut, bis morgen.", status: "correct"}, {value: "Ja, gerne. Um 18 Uhr vor dem Museum. Gut, bis morgen.", status: "correct"}, {value: "Ja, gern. Vor dem Museum um achtzehn Uhr. Gut, bis morgen.", status: "correct"}, {value: "Ja, gern. Vor dem Museum um 18 Uhr. Gut, bis morgen.", status: "correct"}], feedback: "The answer accepts and confirms the plan."}
  de.a1.unit12.lesson02.exercise06.write_plan_message: {instruction: "Write Anna's message in three short parts: ask if he has time tomorrow, suggest going to the museum, then give the time and place (18:00, in front of the museum).", accepted_answers: [{value: "Haben Sie morgen Zeit? Gehen wir ins Museum? Um achtzehn Uhr vor dem Museum.", status: "correct"}, {value: "Haben Sie morgen Zeit Gehen wir ins Museum Um achtzehn Uhr vor dem Museum", status: "correct"}, {value: "Haben Sie morgen Zeit? Gehen wir ins Museum? Um 18 Uhr vor dem Museum.", status: "correct"}], feedback: "The message proposes, schedules, and locates the plan."}
  de.a1.unit12.lesson02.exercise07.dictation_gehen_wir_ins_museum: {correct_response: "Gehen wir ins Museum?", orthography_strict: true, feedback: "Type the sentence exactly as you hear it."}
