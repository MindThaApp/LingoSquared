  de.a1.unit12.lesson01.teach.gehen_wir: {title: "Gehen wir ins Museum?", gloss: "Shall we go to the museum?", note: "*Gehen wir...?* is a compact way to suggest doing something together.", example_gloss: "In context: Shall we go to the museum?"}
  de.a1.unit12.lesson01.teach.ja_gern: {title: "Ja, gern.", gloss: "Yes, gladly.", note: "*gern* makes the acceptance warm and natural.", example_gloss: "In context: Yes, gladly."}
  de.a1.unit12.lesson01.teach.leider: {title: "leider", gloss: "unfortunately", note: "*Leider* softens a decline.", example_gloss: "In context: Unfortunately I can't."}
  de.a1.unit12.lesson01.teach.kann_nicht: {title: "Leider kann ich nicht.", gloss: "Unfortunately I can't.", note: "The verb *kann* comes before *ich* after initial *Leider*.", example_gloss: "In context: Unfortunately I can't."}
  de.a1.unit12.lesson02.teach.am_abend: {title: "am Abend", gloss: "in the evening", note: "Use *am* with parts of the day.", example_gloss: "In context: Yes, in the evening."}
  de.a1.unit12.lesson02.teach.um_wie_viel_uhr: {title: "Um wie viel Uhr?", gloss: "At what time?", note: "Use this to ask for the exact clock time.", example_gloss: "In context: At what time?"}
  de.a1.unit12.lesson02.teach.vor_dem_museum: {title: "um achtzehn Uhr vor dem Museum", gloss: "at 18:00 in front of the museum", note: "German schedules often use 24-hour time.", example_gloss: "In context: At 18:00 in front of the museum."}
  de.a1.unit12.lesson02.teach.einladung_text: {title: "Nachricht von Anna", gloss: "message from Anna", note: "A short invitation can include activity, day, time, and place.", example_gloss: "In context: Shall we go to the museum?"}
  de.a1.unit12.lesson02.teach.line01: {title: "Anna fragt nach Zeit", gloss: "Anna: Haben Sie morgen Zeit?", note: "The plan starts by checking availability.", example_gloss: "In context: Do you have time tomorrow?"}
  de.a1.unit12.lesson02.teach.line02: {title: "Felix nennt seine Zeit", gloss: "Felix: Ja, am Abend.", note: "A short answer can name the available part of the day.", example_gloss: "In context: Yes, in the evening."}
  de.a1.unit12.lesson02.teach.line03: {title: "Anna schlägt das Museum vor", gloss: "Anna: Gehen wir ins Museum?", note: "This proposes the activity.", example_gloss: "In context: Shall we go to the museum?"}
  de.a1.unit12.lesson02.teach.line04: {title: "Felix nimmt an", gloss: "Felix: Ja, gern. Um wie viel Uhr?", note: "Felix accepts and asks for the time.", example_gloss: "In context: At what time?"}
  de.a1.unit12.lesson02.teach.line05: {title: "Anna nennt Zeit und Ort", gloss: "Anna: Um achtzehn Uhr vor dem Museum.", note: "The answer gives both schedule and meeting point.", example_gloss: "In context: At 18:00 in front of the museum."}
  de.a1.unit12.lesson02.teach.line06: {title: "Felix bestätigt", gloss: "Felix: Gut, bis morgen.", note: "A natural closing once the plan is set.", example_gloss: "In context: Good, see you tomorrow."}
exercises:
  de.a1.unit12.lesson01.exercise01.listen_vorschlag: {instruction: "Listen and select the suggestion you hear.", correct_option: "Gehen wir ins Museum", distractors: ["Haben Sie morgen Zeit", "Ja, gern", "Leider kann ich nicht"], accepted_answers: [{value: "Gehen wir ins Museum", status: "correct"}], feedback: "*Gehen wir ins Museum?* suggests going to the museum."}
  de.a1.unit12.lesson01.exercise02.choose_accept: {instruction: "Which phrase accepts a plan?", correct_option: "Ja, gern.", distractors: ["Leider kann ich nicht.", "Haben Sie morgen Zeit?", "Um wie viel Uhr?"], accepted_answers: [{value: "Ja, gern.", status: "correct"}], feedback: "*Ja, gern* accepts gladly."}
  de.a1.unit12.lesson01.exercise03.match_plan:
    instruction: "Match each planning phrase to its function."
    accepted_answers: [{value: [{left: "Haben Sie morgen Zeit?", right: "asks if someone is free tomorrow"}, {left: "Gehen wir ins Museum?", right: "suggests a museum visit"}, {left: "Ja, gern.", right: "accepts happily"}, {left: "Leider kann ich nicht.", right: "declines politely"}, {left: "morgen", right: "tomorrow"}, {left: "Zeit", right: "free time"}], status: "correct"}]
    feedback: "Each phrase plays a clear role in making a plan."
  de.a1.unit12.lesson01.exercise04.order_museum: {instruction: "Put the words in order: 'Shall we go to the museum?'", accepted_answers: [{value: ["Gehen", "wir", "ins", "Museum"], status: "correct"}], feedback: "The suggestion starts with *Gehen wir...*"}
  de.a1.unit12.lesson01.exercise05.write_decline: {instruction: "Write a polite decline: Unfortunately I can't.", accepted_answers: [{value: "Leider kann ich nicht", status: "correct"}, {value: "Leider kann ich nicht.", status: "correct"}], feedback: "*Leider kann ich nicht* is a polite decline."}
  de.a1.unit12.lesson02.exercise01.listen_activity: {instruction: "Listen to the dialogue. What activity does Anna suggest?", correct_option: "Gehen wir ins Museum", distractors: ["Leider kann ich nicht", "Um achtzehn Uhr", "Gut, bis morgen"], accepted_answers: [{value: "Gehen wir ins Museum", status: "correct"}], feedback: "Anna suggests the museum."}
  de.a1.unit12.lesson02.exercise02.choose_time: {instruction: "What time do they agree on?", correct_option: "um achtzehn Uhr", distractors: ["am Abend", "morgen", "vor dem Museum"], accepted_answers: [{value: "um achtzehn Uhr", status: "correct"}], feedback: "They meet at *achtzehn Uhr*."}
  de.a1.unit12.lesson02.exercise03.match_details:
    instruction: "Match the plan details."
    accepted_answers: [{value: [{left: "Tag des Plans", right: "morgen"}, {left: "Felix hat Zeit", right: "am Abend"}, {left: "Aktivität", right: "Museum"}, {left: "Uhrzeit", right: "achtzehn Uhr"}, {left: "Treffpunkt", right: "vor dem Museum"}, {left: "positive Antwort", right: "Ja, gern."}], status: "correct"}]
    feedback: "The plan has a day, activity, time, and place."
  de.a1.unit12.lesson02.exercise04.order_time_question: {instruction: "Put the words in order: 'At what time?'", accepted_answers: [{value: ["Um", "wie", "viel", "Uhr"], status: "correct"}], feedback: "The full time question is *Um wie viel Uhr?*"}
  de.a1.unit12.lesson02.exercise05.reply_accept_plan: {instruction: "Anna suggests the museum at 18:00. Reply as Felix: accept, confirm the place and time, and close.", accepted_answers: [{value: "Ja, gern. Um achtzehn Uhr vor dem Museum. Gut, bis morgen.", status: "correct"}, {value: "Ja, gern Um achtzehn Uhr vor dem Museum Gut bis morgen", status: "correct"}], feedback: "The answer accepts and confirms the plan."}
  de.a1.unit12.lesson02.exercise06.write_plan_message: {instruction: "Write a short message proposing the museum tomorrow at 18:00 in front of the museum.", accepted_answers: [{value: "Haben Sie morgen Zeit? Gehen wir ins Museum? Um achtzehn Uhr vor dem Museum.", status: "correct"}, {value: "Haben Sie morgen Zeit Gehen wir ins Museum Um achtzehn Uhr vor dem Museum", status: "correct"}], feedback: "The message proposes, schedules, and locates the plan."}
