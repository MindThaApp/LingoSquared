teaching:
  de.a1.unit18.lesson01.teach.beruf: {title: "Beruf", gloss: "job / profession", note: "*Beruf* is the general word for someone's profession.", example_gloss: "I am an engineer."}
  de.a1.unit18.lesson01.teach.ingenieur: {title: "Ingenieur", gloss: "engineer", note: "German normally says *Ich bin Ingenieur*, without an article.", example_gloss: "I am an engineer."}
  de.a1.unit18.lesson01.teach.lehrerin: {title: "Lehrerin", gloss: "female teacher", note: "*Lehrerin* is the feminine job title.", example_gloss: "She is a teacher."}
  de.a1.unit18.lesson01.teach.kellnerin: {title: "Kellnerin", gloss: "waitress / server", note: "This fits Anna's established cafe work.", example_gloss: "Anna is a server in the cafe."}
  de.a1.unit18.lesson01.teach.was_machen_sie: {title: "Was machen Sie beruflich?", gloss: "What do you do for work?", note: "*beruflich* makes the question about work, not general activity.", example_gloss: "What do you do for work?"}
  de.a1.unit18.lesson02.teach.buero: {title: "Büro", gloss: "office", note: "*im Büro* means in the office.", example_gloss: "I work in the office."}
  de.a1.unit18.lesson02.teach.arbeite: {title: "Ich arbeite im Cafe.", gloss: "I work in the cafe.", note: "*arbeite* is the first-person form: I work.", example_gloss: "I work in the cafe."}
  de.a1.unit18.lesson02.teach.bringe: {title: "Ich bringe Kaffee und Tee.", gloss: "I bring coffee and tea.", note: "*bringe* states a simple work activity.", example_gloss: "I bring coffee and tea."}
  de.a1.unit18.lesson02.teach.work_profile: {title: "Arbeitsprofile", gloss: "work profiles", note: "The profile gives job, workplace, and activity.", example_gloss: "He works in the office."}
  de.a1.unit18.lesson02.teach.line01: {title: "Anna fragt nach Arbeit", gloss: "Anna: Was machen Sie beruflich?", note: "A polite work question.", example_gloss: "What do you do for work?"}
  de.a1.unit18.lesson02.teach.line02: {title: "Felix beschreibt seine Arbeit", gloss: "Felix: Ich bin Ingenieur. Ich arbeite im Büro. Und Sie?", note: "Felix gives occupation and workplace.", example_gloss: "I work in the office."}
  de.a1.unit18.lesson02.teach.line03: {title: "Anna beschreibt das Cafe", gloss: "Anna: Ich arbeite im Cafe. Ich bringe Kaffee und Tee.", note: "Anna's cafe work matches earlier units.", example_gloss: "I bring coffee and tea."}
exercises:
  de.a1.unit18.lesson01.exercise01.listen_ingenieur: {instruction: "Listen and select the job you hear.", correct_option: "Ingenieur", distractors: ["Lehrerin", "Kellnerin", "Beruf"], accepted_answers: [{value: "Ingenieur", status: "correct"}], feedback: "*Ingenieur* means engineer."}
  de.a1.unit18.lesson01.exercise02.choose_engineer: {instruction: "Which sentence means 'I am an engineer'?", correct_option: "Ich bin Ingenieur.", distractors: ["Ich bin ein Ingenieur.", "Ich habe Ingenieur.", "Ich arbeite Ingenieur."], accepted_answers: [{value: "Ich bin Ingenieur.", status: "correct"}], feedback: "German job statements usually omit the article: *Ich bin Ingenieur*."}
  de.a1.unit18.lesson01.exercise03.match_jobs:
    instruction: "Match each work word to its meaning."
    accepted_answers: [{value: [{left: "allgemeines Wort für Arbeit", right: "Beruf"}, {left: "technischer Beruf", right: "Ingenieur"}, {left: "Beruf in der Schule", right: "Lehrerin"}, {left: "Beruf im Cafe", right: "Kellnerin"}, {left: "Wort in der Arbeitsfrage", right: "beruflich"}, {left: "Annas Arbeitsplatz", right: "Cafe"}], status: "correct"}]
    feedback: "These words describe jobs and work contexts."
  de.a1.unit18.lesson01.exercise04.order_job: {instruction: "Put the words in order: 'I am an engineer.'", accepted_answers: [{value: ["Ich", "bin", "Ingenieur"], status: "correct"}], feedback: "The job follows *bin*."}
  de.a1.unit18.lesson01.exercise05.write_job: {instruction: "Write the taught job sentence: I am an engineer.", accepted_answers: [{value: "Ich bin Ingenieur.", status: "correct"}, {value: "Ich bin Ingenieur", status: "correct"}], feedback: "*Ich bin Ingenieur* states the occupation."}
  de.a1.unit18.lesson02.exercise01.listen_job: {instruction: "Listen to the dialogue. What is Felix's job?", correct_option: "Ingenieur", distractors: ["Lehrerin", "Kellnerin", "Arzt"], accepted_answers: [{value: "Ingenieur", status: "correct"}], feedback: "Felix says *Ich bin Ingenieur*."}
  de.a1.unit18.lesson02.exercise02.choose_workplace: {instruction: "Which sentence means 'I work in the office'?", correct_option: "Ich arbeite im Büro.", distractors: ["Ich arbeite in Büro.", "Ich bin im Büro arbeite.", "Ich mache Büro."], accepted_answers: [{value: "Ich arbeite im Büro.", status: "correct"}], feedback: "Use *im Büro* for 'in the office.'"}
  de.a1.unit18.lesson02.exercise03.match_work:
    instruction: "Match each work detail from the dialogue."
    accepted_answers: [{value: [{left: "Person mit technischem Beruf", right: "Felix"}, {left: "Felix' Beruf", right: "Ingenieur"}, {left: "Felix' Arbeitsplatz", right: "Büro"}, {left: "Person im Cafe", right: "Anna"}, {left: "Annas Arbeitsplatz", right: "Cafe"}, {left: "Getränk, das Anna bringt", right: "Kaffee"}], status: "correct"}]
    feedback: "The dialogue gives occupation, workplace, and activity."
  de.a1.unit18.lesson02.exercise04.order_workplace: {instruction: "Put the words in order: 'I work in the office.'", accepted_answers: [{value: ["Ich", "arbeite", "im", "Büro"], status: "correct"}], feedback: "*im Büro* follows the verb."}
  de.a1.unit18.lesson02.exercise05.reply_work: {instruction: "Reply as Felix: state that you are an engineer and work in the office.", accepted_answers: [{value: "Ich bin Ingenieur. Ich arbeite im Büro.", status: "correct"}, {value: "Ich bin Ingenieur Ich arbeite im Büro", status: "correct"}], feedback: "The reply gives occupation and workplace."}
  de.a1.unit18.lesson02.exercise06.write_work_profile: {instruction: "Write three taught work facts as Anna: I am a server. I work in the cafe. I bring coffee and tea.", accepted_answers: [{value: "Ich bin Kellnerin. Ich arbeite im Cafe. Ich bringe Kaffee und Tee.", status: "correct"}, {value: "Ich bin Kellnerin Ich arbeite im Cafe Ich bringe Kaffee und Tee", status: "correct"}], feedback: "The profile gives Anna's occupation, workplace, and simple work activity."}
