review: {status: "reviewed", required_next_reviewer: "codex", notes: "English-to-German overlay for work; distractors target English article use with jobs, beruflich wording, and im workplace phrasing.\n\nSecond-pass review 2026-10-19: 9 fixes -- lesson02.teach.line01-line03: German titles and German-text glosses -> English titles and English translations (line03 note 'Anna's cafe work matches earlier units' -> a learner-facing note); lesson01.teach.beruf example_gloss 'I am an engineer.' -> 'I'm an engineer by profession.' (translates the actual example 'Mein Beruf ist Ingenieur.'); 'Im Dialog:' examples now glossed 'In context: ...'; lesson01.exercise02.choose_engineer instruction 'Which sentence means ...' -> 'Which sentence is the usual way to say ...' (the distractor 'Ich bin ein Ingenieur.' is grammatical and means the same, so 'means' made it a second correct answer); lesson02.exercise01.listen_job distractor 'Arzt' (never taught) removed; lesson01.exercise03.match_jobs and lesson02.exercise03.match_work accepted_answers mirrored to the realization's new English clues; lesson02.exercise05.reply_work added 'Ich bin Ingenieur und (ich) arbeite im Büro.' variants; lesson02.exercise06.write_work_profile added 'Café' variants."}
course: {title: "German A1", description: "Learn A1-level German for everyday exchanges, with English explanations."}
units:
  de.a1.unit18.arbeit: {title: "Work"}
teaching:
  de.a1.unit18.lesson01.teach.beruf: {title: "Beruf", gloss: "job / profession", note: "*Beruf* is the general word for someone's profession.", example_gloss: "I'm an engineer by profession."}
  de.a1.unit18.lesson01.teach.ingenieur: {title: "Ingenieur", gloss: "engineer", note: "German normally says *Ich bin Ingenieur*, without an article.", example_gloss: "I am an engineer."}
  de.a1.unit18.lesson01.teach.lehrerin: {title: "Lehrerin", gloss: "female teacher", note: "*Lehrerin* is the feminine job title.", example_gloss: "She is a teacher."}
  de.a1.unit18.lesson01.teach.kellnerin: {title: "Kellnerin", gloss: "waitress / server", note: "This fits Anna's established cafe work.", example_gloss: "Anna is a server in the cafe."}
  de.a1.unit18.lesson01.teach.was_machen_sie: {title: "Was machen Sie beruflich?", gloss: "What do you do for work?", note: "*beruflich* makes the question about work, not general activity."}
  de.a1.unit18.lesson02.teach.buero: {title: "Büro", gloss: "office", note: "*im Büro* means in the office.", example_gloss: "I work in the office."}
  de.a1.unit18.lesson02.teach.arbeite: {title: "Ich arbeite im Cafe.", gloss: "I work in the cafe.", note: "*arbeite* is the first-person form: I work."}
  de.a1.unit18.lesson02.teach.bringe: {title: "Ich bringe Kaffee und Tee.", gloss: "I bring coffee and tea.", note: "*bringe* states a simple work activity."}
  de.a1.unit18.lesson02.teach.work_profile: {title: "Arbeitsprofile", gloss: "work profiles", note: "The profile gives job, workplace, and activity.", example_gloss: "He works in the office."}
  de.a1.unit18.lesson02.teach.line01: {title: "Anna asks about work", gloss: "Anna: What do you do for work?", note: "A polite work question."}
  de.a1.unit18.lesson02.teach.line02: {title: "Felix describes his work", gloss: "Felix: I'm an engineer. I work in the office. And you?", note: "Felix gives occupation and workplace.", example_gloss: "I work in the office."}
  de.a1.unit18.lesson02.teach.line03: {title: "Anna describes her cafe job", gloss: "Anna: I work in the cafe. I bring coffee and tea.", note: "Anna names her workplace and what she does there.", example_gloss: "In context: I bring coffee and tea."}
exercises:
  de.a1.unit18.lesson01.exercise01.listen_ingenieur: {instruction: "Listen and select the job you hear.", correct_option: "Ingenieur", distractors: ["Lehrerin", "Kellnerin", "Beruf"], accepted_answers: [{value: "Ingenieur", status: "correct"}], feedback: "*Ingenieur* means engineer."}
  de.a1.unit18.lesson01.exercise02.choose_engineer: {instruction: "Which sentence is the usual way to say 'I am an engineer'?", correct_option: "Ich bin Ingenieur.", distractors: ["Ich bin ein Ingenieur.", "Ich habe Ingenieur.", "Ich arbeite Ingenieur."], accepted_answers: [{value: "Ich bin Ingenieur.", status: "correct"}], feedback: "German job statements usually omit the article: *Ich bin Ingenieur*."}
  de.a1.unit18.lesson01.exercise03.match_jobs:
    instruction: "Match each work word to its meaning."
    accepted_answers: [{value: [{left: "job / profession", right: "Beruf"}, {left: "engineer", right: "Ingenieur"}, {left: "teacher (woman)", right: "Lehrerin"}, {left: "waitress / server", right: "Kellnerin"}, {left: "for work (as in 'What do you do for work?')", right: "beruflich"}, {left: "the place where Anna works", right: "Cafe"}], status: "correct"}]
    feedback: "These words describe jobs and work contexts."
  de.a1.unit18.lesson01.exercise04.order_job: {instruction: "Put the words in order: 'I am an engineer.'", accepted_answers: [{value: ["Ich", "bin", "Ingenieur"], status: "correct"}], feedback: "The job follows *bin*."}
  de.a1.unit18.lesson01.exercise05.write_job: {instruction: "Write the taught job sentence: I am an engineer.", accepted_answers: [{value: "Ich bin Ingenieur.", status: "correct"}, {value: "Ich bin Ingenieur", status: "correct"}], feedback: "*Ich bin Ingenieur* states the occupation."}
  de.a1.unit18.lesson02.exercise01.listen_job: {instruction: "Listen to the dialogue. What is Felix's job?", correct_option: "Ingenieur", distractors: ["Lehrerin", "Kellnerin"], accepted_answers: [{value: "Ingenieur", status: "correct"}], feedback: "Felix says *Ich bin Ingenieur*."}
  de.a1.unit18.lesson02.exercise02.choose_workplace: {instruction: "Which sentence means 'I work in the office'?", correct_option: "Ich arbeite im Büro.", distractors: ["Ich arbeite in Büro.", "Ich bin im Büro arbeite.", "Ich mache Büro."], accepted_answers: [{value: "Ich arbeite im Büro.", status: "correct"}], feedback: "Use *im Büro* for 'in the office.'"}
  de.a1.unit18.lesson02.exercise03.match_work:
    instruction: "Match each work detail from the dialogue."
    accepted_answers: [{value: [{left: "the person who is an engineer", right: "Felix"}, {left: "Felix's job", right: "Ingenieur"}, {left: "where Felix works", right: "Büro"}, {left: "the person who works in the cafe", right: "Anna"}, {left: "where Anna works", right: "Cafe"}, {left: "a drink Anna brings", right: "Kaffee"}], status: "correct"}]
    feedback: "The dialogue gives occupation, workplace, and activity."
  de.a1.unit18.lesson02.exercise04.order_workplace: {instruction: "Put the words in order: 'I work in the office.'", accepted_answers: [{value: ["Ich", "arbeite", "im", "Büro"], status: "correct"}], feedback: "*im Büro* follows the verb."}
  de.a1.unit18.lesson02.exercise05.reply_work: {instruction: "Reply as Felix: state that you are an engineer and work in the office.", accepted_answers: [{value: "Ich bin Ingenieur. Ich arbeite im Büro.", status: "correct"}, {value: "Ich bin Ingenieur Ich arbeite im Büro", status: "correct"}, {value: "Ich bin Ingenieur. Ich arbeite im Buero.", status: "correct"}, {value: "Ich bin Ingenieur Ich arbeite im Buero", status: "correct"}, {value: "Ich bin Ingenieur und arbeite im Büro.", status: "correct"}, {value: "Ich bin Ingenieur und ich arbeite im Büro.", status: "correct"}], feedback: "The reply gives occupation and workplace."}
  de.a1.unit18.lesson02.exercise06.write_work_profile: {instruction: "Write three taught work facts as Anna: I am a server. I work in the cafe. I bring coffee and tea.", accepted_answers: [{value: "Ich bin Kellnerin. Ich arbeite im Cafe. Ich bringe Kaffee und Tee.", status: "correct"}, {value: "Ich bin Kellnerin Ich arbeite im Cafe Ich bringe Kaffee und Tee", status: "correct"}, {value: "Ich bin Kellnerin. Ich arbeite im Café. Ich bringe Kaffee und Tee.", status: "correct"}], feedback: "The profile gives Anna's occupation, workplace, and simple work activity."}
