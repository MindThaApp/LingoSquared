course:
  title: "German B1"
  description: "Learn B1-level German for reporting what someone said (sagen, dass) and asked (fragen, ob), without repeating their exact words."

units:
  de.b1.unit43.indirekte_rede: {title: "Reported speech"}

lessons:
  de.b1.unit43.lesson01.sagen_dass: {title: "He said that he ..."}
  de.b1.unit43.lesson02.fragen_ob: {title: "He asked whether I ..."}
  de.b1.unit43.lesson03.cafe_dialogue: {title: "Dialogue: what Felix said and asked"}

teaching:
  de.b1.unit43.lesson01.teach.original_frei: {title: "Felix (to Anna): Ich habe heute frei.", gloss: "Felix (to Anna): I have today off.", note: "This is the original quote, in Felix's own first person.", example_gloss: "Original: Felix says to Anna: I have today off."}
  de.b1.unit43.lesson01.teach.reported_frei: {title: "Felix sagte, dass er heute frei hat.", gloss: "Felix said that he has today off.", note: "Reporting Felix's statement about himself uses sagen + dass with a third-person subject (er) — no pronoun shift is needed since Felix spoke about himself.", example_gloss: "Recounted: Felix said that he has today off."}
  de.b1.unit43.lesson02.teach.original_question: {title: "Felix (to Anna): Haben Sie heute Zeit?", gloss: "Felix (to Anna): Do you have time today?", note: "The original question, addressed directly to Anna with formal Sie.", example_gloss: "Original: Felix asks Anna: Do you have time today?"}
  de.b1.unit43.lesson02.teach.reported_question: {title: "Felix fragte mich, ob ich heute Zeit habe.", gloss: "Felix asked me whether I had time today.", note: "Reporting a question uses fragen + ob. Because the original question was addressed to Anna, the pronoun shifts from Sie to ich when she reports it.", example_gloss: "Recounted: Felix asked me whether I had time today."}
  de.b1.unit43.lesson03.teach.anna_report_statement: {title: "Anna reports what Felix said", gloss: "Anna: Felix said that he has today off.", note: "Anna reports Felix's statement about himself, as taught in lesson01."}
  de.b1.unit43.lesson03.teach.kollegin_ask: {title: "The colleague asks what he asked", gloss: "Colleague: And what did he ask?", note: "This sets up the reported-question turn that follows."}
  de.b1.unit43.lesson03.teach.anna_report_question: {title: "Anna reports what Felix asked", gloss: "Anna: He asked me whether I had time today.", note: "Anna reports Felix's original Sie-question with the pronoun shifted to ich, as taught in lesson02."}
  de.b1.unit43.lesson03.teach.kollegin_followup: {title: "The colleague follows up", gloss: "Colleague: And did you answer?", note: "A short follow-up closing the exchange."}

exercises:
  de.b1.unit43.lesson01.exercise01.recognize_original_frei: {instruction: "Which German sentence means \"I have today off.\" (said directly by Felix to Anna)?", correct_option: "Ich habe heute frei.", distractors: ["Er hat heute frei.", "Ich hatte gestern frei.", "Wir haben heute frei."], accepted_answers: [{value: "Ich habe heute frei.", status: "correct"}], feedback: "This is the original quote, in Felix's own first person."}
  de.b1.unit43.lesson01.exercise02.recognize_reported_frei: {instruction: "Which German sentence means \"Felix said that he has today off.\" (Anna reporting Felix's words about himself)?", correct_option: "Felix sagte, dass er heute frei hat.", distractors: ["Felix sagte, dass ich heute frei habe.", "Felix sagt, dass er heute frei hat.", "Felix sagte, dass sie heute frei hat."], accepted_answers: [{value: "Felix sagte, dass er heute frei hat.", status: "correct"}], feedback: "Reporting Felix's own statement about himself uses the third-person er — no pronoun shift is needed."}
  de.b1.unit43.lesson01.exercise03.listen_select_reported_frei: {instruction: "According to the speaker, what did Felix say about himself?", correct_option: "That he has today off.", distractors: ["That she has today off.", "That he had yesterday off.", "That he is busy today."], accepted_answers: [{value: "That he has today off.", status: "correct"}], feedback: "The recording says *Felix sagte, dass er heute frei hat*."}
  de.b1.unit43.lesson01.exercise04.match_sagen_dass:
    instruction: "Match each German word or phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "Ich habe heute frei.", right: "I have today off. (said by Felix)"}
          - {left: "Felix sagte, dass er ...", right: "Felix said that he ..."}
          - {left: "frei", right: "off (free)"}
          - {left: "dass", right: "that"}
          - {left: "sagen", right: "to say"}
          - {left: "sagte", right: "said"}
        status: "correct"
    feedback: "These pieces cover the original quote and its reported-speech form."
  de.b1.unit43.lesson01.exercise05.order_reported_frei: {instruction: "Put the words in order to say \"Felix said that he has today off.\"", accepted_answers: [{value: ["Felix", "sagte,", "dass", "er", "heute", "frei", "hat"], status: "correct"}], feedback: "The correct order is *Felix sagte, dass er heute frei hat*."}
  de.b1.unit43.lesson01.exercise06.write_reported_frei:
    instruction: "Felix said: \"Ich habe heute frei.\" Report this as Anna telling a colleague what Felix said about himself: Felix said that he has today off."
    accepted_answers:
      - {value: "Felix sagte, dass er heute frei hat.", status: "correct"}
      - {value: "Felix sagte, dass er heute frei hat", status: "correct"}
    feedback: "The model answer is *Felix sagte, dass er heute frei hat*."
  de.b1.unit43.lesson02.exercise01.recognize_original_question: {instruction: "Which German sentence means \"Do you have time today?\" (asked directly by Felix to Anna)?", correct_option: "Haben Sie heute Zeit?", distractors: ["Habe ich heute Zeit?", "Hatten Sie gestern Zeit?", "Haben wir heute Zeit?"], accepted_answers: [{value: "Haben Sie heute Zeit?", status: "correct"}], feedback: "This is the original question, addressed directly to Anna with formal Sie."}
  de.b1.unit43.lesson02.exercise02.recognize_reported_question: {instruction: "Which German sentence means \"Felix asked me whether I had time today.\" (Anna reporting Felix's question to her)?", correct_option: "Felix fragte mich, ob ich heute Zeit habe.", distractors: ["Felix fragte mich, ob Sie heute Zeit haben.", "Ich fragte Felix, ob er heute Zeit hat.", "Felix fragte mich, dass ich heute Zeit habe."], accepted_answers: [{value: "Felix fragte mich, ob ich heute Zeit habe.", status: "correct"}], feedback: "Reporting shifts the addressee pronoun from Sie (in the original question) to ich (Anna speaking about herself), and uses ob for a reported question."}
  de.b1.unit43.lesson02.exercise03.listen_select_reported_question: {instruction: "According to the speaker, what did Felix ask her?", correct_option: "Whether she had time today.", distractors: ["Whether he had time today.", "Whether she had today off.", "Whether the cafe was open today."], accepted_answers: [{value: "Whether she had time today.", status: "correct"}], feedback: "The recording says *Felix fragte mich, ob ich heute Zeit habe*."}
  de.b1.unit43.lesson02.exercise04.match_fragen_ob:
    instruction: "Match each German word or phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "Haben Sie heute Zeit?", right: "Do you have time today? (asked to Anna)"}
          - {left: "Felix fragte mich, ob ...", right: "Felix asked me whether ..."}
          - {left: "fragen", right: "to ask"}
          - {left: "ob", right: "whether"}
          - {left: "mich", right: "me"}
          - {left: "fragte", right: "asked"}
        status: "correct"
    feedback: "These pieces cover the original question and its reported-speech form with the pronoun shifted."
  de.b1.unit43.lesson02.exercise05.order_reported_question: {instruction: "Put the words in order to say \"Felix asked me whether I had time today.\"", accepted_answers: [{value: ["Felix", "fragte", "mich,", "ob", "ich", "heute", "Zeit", "habe"], status: "correct"}], feedback: "The correct order is *Felix fragte mich, ob ich heute Zeit habe*."}
  de.b1.unit43.lesson02.exercise06.write_reported_question:
    instruction: "Felix asked you: \"Haben Sie heute Zeit?\" Report this as Anna telling a colleague what Felix asked, shifting Sie to ich: Felix asked me whether I had time today."
    accepted_answers:
      - {value: "Felix fragte mich, ob ich heute Zeit habe.", status: "correct"}
      - {value: "Felix fragte mich, ob ich heute Zeit habe", status: "correct"}
    feedback: "The model answer is *Felix fragte mich, ob ich heute Zeit habe*."
  de.b1.unit43.lesson03.exercise01.choose_anna_report_statement: {instruction: "What does Anna report that Felix said about himself?", correct_option: "That he has today off.", distractors: ["That she has today off.", "That he is busy today.", "That he had time yesterday."], accepted_answers: [{value: "That he has today off.", status: "correct"}], feedback: "Anna says *Felix sagte, dass er heute frei hat*."}
  de.b1.unit43.lesson03.exercise02.choose_anna_report_question: {instruction: "What does Anna report that Felix asked her?", correct_option: "Whether she had time today.", distractors: ["Whether he had time today.", "Whether she had today off.", "Whether she wanted coffee."], accepted_answers: [{value: "Whether she had time today.", status: "correct"}], feedback: "Anna says *Er fragte mich, ob ich heute Zeit habe*."}
  de.b1.unit43.lesson03.exercise03.listen_dialogue_indirekte_rede: {instruction: "Listen to the dialogue. What did Felix say about himself, and what did he ask Anna?", correct_option: "He said he has today off, and asked whether she had time today.", distractors: ["He said he was busy, and asked whether she had today off.", "He said she has today off, and asked whether he had time today.", "He said he has today off, and asked whether she wanted coffee."], accepted_answers: [{value: "He said he has today off, and asked whether she had time today.", status: "correct"}], feedback: "Anna says *Felix sagte, dass er heute frei hat* and *Er fragte mich, ob ich heute Zeit habe*."}
  de.b1.unit43.lesson03.exercise04.match_dialogue_indirekte_rede:
    instruction: "Match each German word or phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "Und was hat er gefragt?", right: "And what did he ask?"}
          - {left: "Und haben Sie geantwortet?", right: "And did you answer?"}
          - {left: "die Kollegin", right: "the (female) colleague"}
          - {left: "gefragt", right: "asked"}
          - {left: "geantwortet", right: "answered"}
          - {left: "antworten", right: "to answer"}
        status: "correct"
    feedback: "These pieces support the surrounding reported-speech exchange."
  de.b1.unit43.lesson03.exercise05.order_kollegin_ask: {instruction: "Put the words in order to say \"And what did he ask?\"", accepted_answers: [{value: ["Und", "was", "hat", "er", "gefragt?"], status: "correct"}], feedback: "The correct order is *Und was hat er gefragt?*"}
  de.b1.unit43.lesson03.exercise06.write_full_indirekte_rede:
    instruction: "As Anna, tell a colleague two things about your conversation with Felix: (1) report what Felix said about himself, using dass (he said that he has today off); (2) report what Felix asked you, using ob and shifting Sie to ich (he asked me whether I had time today)."
    accepted_answers:
      - {value: "Felix sagte, dass er heute frei hat. Er fragte mich, ob ich heute Zeit habe.", status: "correct"}
      - {value: "Felix sagte, dass er heute frei hat. Er fragte mich, ob ich heute Zeit habe", status: "correct"}
      - {value: "Felix sagte dass er heute frei hat. Er fragte mich ob ich heute Zeit habe.", status: "correct"}
      - {value: "Felix sagte dass er heute frei hat. Er fragte mich ob ich heute Zeit habe", status: "correct"}
      - {value: "Felix sagte dass er heute frei hat. Er fragte mich, ob ich heute Zeit habe.", status: "correct"}
      - {value: "Felix sagte dass er heute frei hat. Er fragte mich, ob ich heute Zeit habe", status: "correct"}
      - {value: "Felix sagte, dass er heute frei hat. Er fragte mich ob ich heute Zeit habe.", status: "correct"}
      - {value: "Felix sagte, dass er heute frei hat. Er fragte mich ob ich heute Zeit habe", status: "correct"}
    feedback: "A complete answer reports both the statement with dass and the question with ob: *Felix sagte, dass er heute frei hat. Er fragte mich, ob ich heute Zeit habe.*"
  de.b1.unit43.lesson03.exercise07.dictation_reported_statement: {correct_response: "Felix sagte, dass er heute frei hat.", orthography_strict: true, feedback: "Your response must reproduce the sentence exactly."}
  de.b1.unit43.lesson03.exercise08.dictation_reported_question: {correct_response: "Felix fragte mich, ob ich heute Zeit habe.", orthography_strict: true, feedback: "Your response must reproduce the sentence exactly."}
