  de.b1.unit49.lesson02.teach.felix_ausserdem: {title: "Anna adds a detail", gloss: "Anna: Furthermore, the article mentions that there's now also breakfast.", note: "*Außerdem erwähnt ..., dass ...* marks content as an additional supporting detail, not the main point.", example_gloss: "Detail: Furthermore, the article mentions that there's now also breakfast."}
  de.b1.unit49.lesson02.teach.felix_nur_ein_detail: {title: "Felix labels it a detail", gloss: "Felix: That's only a detail, not the main point.", note: "Explicitly distinguishes a supporting detail from the main point of a summary.", example_gloss: "Detail: That's only a detail, not the main point."}
