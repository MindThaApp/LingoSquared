course:
  title: ダリー語 A1
  description: 初級カブール・ダリー語:外見の語彙(背が高い、背が低い、髪、目、ひげ、メガネ)、قیافه‌اش چطور است؟ を使った外見のたずね方、髪の色・目の色(رنگ مو/رنگ چشم)、そしてザルミナとフマーユーンが外見で人を見分ける会話。
units:
  prs.a1.unit27.appearance:
    title: 外見
    description: 人の基本的な外見を説明し、どんな外見かをたずねる。
lessons:
  prs.a1.unit27.lesson01.appearance_vocabulary:
    title: 外見を表す言葉
  prs.a1.unit27.lesson02.appearance_question:
    title: 外見をたずねる
  prs.a1.unit27.lesson03.hair_eye_color:
    title: 髪の色と目の色
  prs.a1.unit27.lesson04.appearance_dialogue:
    title: 外見についての会話
  prs.a1.unit27.lesson05.reading_appearance:
    title: 外見についての読み物
  prs.a1.unit27.lesson06.wrap_up:
    title: まとめ
teaching:
  prs.a1.unit27.lesson01.teach.tall_phrase:
    title: 背が高い
    gloss: 背が高い
    note: قد بلند は直訳すると「長い背」で、قد(背丈)+ بلند(長い・高い)です。
    example_gloss: 彼/彼女は背が高いです。
  prs.a1.unit27.lesson01.teach.short_phrase:
    title: 背が低い
    gloss: 背が低い
    note: قد کوتاه は直訳すると「短い背」で、قد(背丈・復習)+ کوتاه(短い)です。
    example_gloss: 彼/彼女は背が低いです。
  prs.a1.unit27.lesson01.teach.hair_word:
    title: 髪
    gloss: 髪
    note: مو は「髪」の意味です。موی は同じ語の連結形で、別の語の前に付けて使います(例:موی سیاه「黒い髪」)。
    example_gloss: 彼/彼女の髪は黒いです。
  prs.a1.unit27.lesson01.teach.eye_word:
    title: 目
    gloss: 目
    note: چشم は「目」の意味です(目の色を言うときは単数形を使うのが、日常的で自然な言い方です)。
    example_gloss: 彼/彼女の目は黒いです。
  prs.a1.unit27.lesson01.teach.beard_word:
    title: ひげ
    gloss: ひげ
    note: ریش は「ひげ」の意味です。
    example_gloss: 彼/彼女にはひげがあります。
  prs.a1.unit27.lesson01.teach.glasses_word:
    title: めがね
    gloss: めがね
    note: عینک は「メガネ」の意味です。
    example_gloss: 彼/彼女はメガネをかけています。
  prs.a1.unit27.lesson01.teach.review_ast_dast:
    title: Is / has (3rd person)
    gloss: 〜です / 持っている(3人称)
    note: است(〜です)と دارد(持っている・3人称)はどちらもこれまでに学んだ表現で、この単元では人の外見を説明するのに使います。
    target_text: است(~です)/ دارد(持っている、三人称)
  prs.a1.unit27.lesson02.teach.qiyafa_word:
    title: 外見・見た目
    gloss: 外見・見た目
    note: قیافه は人の見た目や外見を表します(例:خوش قیافه「見た目がよい」)。
    example_gloss: 彼/彼女の見た目はよいです。
  prs.a1.unit27.lesson02.teach.review_chetor:
    title: How
    gloss: どんな
    note: چطور は「どう・どのように」の意味です(چطور استین؟ のようなあいさつで、すでに出てきました)。
    target_text: چطور(どのような、どう)
  prs.a1.unit27.lesson02.teach.qiyafash_word:
    title: 彼/彼女の外見
    gloss: 彼/彼女の外見
    note: قیافه‌اش は、قیافه(外見)に所有を表す接尾辞 ‌اش(「彼/彼女の」)が付いた形です。
  prs.a1.unit27.lesson02.teach.question_appearance:
    title: 彼/彼女はどんな外見ですか?
    gloss: 彼/彼女はどんな外見ですか?
    note: قیافه‌اش چطور است؟ は、人の外見をたずねる自然な言い方です。چطور است؟ だけだと「彼/彼女は元気ですか?」という体調をたずねるあいさつの意味になるので、この形を使います。
  prs.a1.unit27.lesson02.teach.answer_tall:
    title: 彼/彼女は背が高い
    gloss: 彼/彼女は背が高いです。
    note: او(彼/彼女・復習)に、この単元の قد بلند است を組み合わせた文です。
  prs.a1.unit27.lesson02.teach.answer_black_hair:
    title: 彼/彼女は黒い髪をしている
    gloss: 彼/彼女は黒い髪をしています。
    note: موی(髪)、سیاه(黒)、دارد(持っている)を組み合わせた文です。
  prs.a1.unit27.lesson02.teach.answer_beard:
    title: 彼/彼女にはひげがある
    gloss: 彼/彼女にはひげがあります。
    note: 上の黒い髪の文と同じ「持っている」の型で、ریش دارد を使います。
  prs.a1.unit27.lesson03.teach.review_rang:
    title: Color
    gloss: 色
    note: رنگ は「色」の意味です(第21単元の衣類で、すでに出てきました)。
    target_text: رنگ(色)
  prs.a1.unit27.lesson03.teach.blue_word:
    title: 青い
    gloss: 青い
    note: آبی は「青」の意味です。
    example_gloss: 彼/彼女の目は青いです。
  prs.a1.unit27.lesson03.teach.brown_word:
    title: 茶色
    gloss: 茶色の
    note: قهوه‌ای は「茶色」の意味です(髪や目の色に使います)。
    example_gloss: 彼/彼女の髪は茶色です。
  prs.a1.unit27.lesson03.teach.eye_color_phrase:
    title: 目の色
    gloss: 目の色
    note: رنگ چشم は直訳すると「目の色」で、رنگ(色)+ چشم(目)です。
  prs.a1.unit27.lesson03.teach.hair_color_phrase:
    title: 髪の色
    gloss: 髪の色
    note: رنگ مو は直訳すると「髪の色」で、رنگ(色)+ مو(髪)です。
  prs.a1.unit27.lesson03.teach.eye_blue_sentence:
    title: 彼/彼女の目は青い
    gloss: 彼/彼女の目は青いです。
    note: このレッスンの آبی を چشم に使った文です。
  prs.a1.unit27.lesson03.teach.hair_brown_sentence:
    title: 彼/彼女の髪は茶色
    gloss: 彼/彼女の髪は茶色です。
    note: このレッスンの قهوه‌ای を موی に使った文です。
  prs.a1.unit27.lesson04.teach.review_baradar:
    title: Brother / your brother
    gloss: 兄・弟 / あなたの兄・弟(くだけた言い方)
    note: برادر(兄・弟)は第3単元で学んだ語です。برادرت は、くだけた「あなたの」を表す接尾辞 ‌ت が付いた形で、これまでの تو を使うくだけた言い方に合わせています。
    target_text: برادر(兄、弟)/ برادرت(あなたの兄・弟、親しい相手に)
  prs.a1.unit27.lesson04.teach.review_bali_tashakor:
    title: Yes / thanks / also
    gloss: はい / ありがとう / も・〜も
    note: بلی(はい)、تشکر(ありがとう)、هم(〜も)はどれもこれまでに学んだ表現です。
    target_text: بلی(はい)/ تشکر(ありがとう)/ هم(~も)
  prs.a1.unit27.lesson04.teach.dialogue_line1:
    title: フマーユーン:ザルミナ、あなたのお兄さん(弟さん)はどんな外見?
    gloss: フマーユーン:ザルミナ、あなたのお兄さん(弟さん)はどんな外見?
    note: 友達どうしのくだけた質問で、برادر に所有の -ت が付いています。
  prs.a1.unit27.lesson04.teach.dialogue_line2:
    title: ザルミナ:背が高くて、髪は黒いよ
    gloss: ザルミナ:背が高くて、髪は黒いよ。
    note: و(と・そして)で二つの特徴をつないでいます。
  prs.a1.unit27.lesson04.teach.dialogue_line3:
    title: フマーユーン:ひげはある?
    gloss: フマーユーン:ひげはある?
    note: ریش دارد を語尾を上げて言うだけで、はい・いいえで答える疑問文になります。
  prs.a1.unit27.lesson04.teach.dialogue_line4:
    title: ザルミナ:うん、ひげがあって、メガネもかけているよ
    gloss: ザルミナ:うん、ひげがあって、メガネもかけているよ。
    note: 二つ目の特徴に هم(〜も)を使っています。
  prs.a1.unit27.lesson04.teach.dialogue_line5:
    title: フマーユーン:わかった、ありがとう
    gloss: フマーユーン:わかった、ありがとう。
    note: خوب(よい・いいね)は会話を締めくくる新しい簡単な語で、تشکر(ありがとう)は復習です。
  prs.a1.unit27.lesson05.teach.reading_passage:
    title: 外見についての読み物
    gloss: カリームは背が高いです。髪は黒く、目は茶色です。ひげはありませんが、メガネをかけています。
    note: この単元の外見の語を復習する短い読み物です。登場人物の名前 کریم(カリーム。比較の単元に出てきた人物)と、ندارد(持っていない。دارد の3人称の否定形)が出てきます。
  prs.a1.unit27.lesson06.teach.review_ama:
    title: But
    gloss: しかし
    note: اما は「しかし・でも」の意味です(この単元のレッスン5の読み物に出てきました。以前の単元でも学んでいます)。
    target_text: اما(しかし、でも)
  prs.a1.unit27.lesson06.teach.review_astam:
    title: I am / I have
    gloss: 私は〜です / 私は持っている
    note: استم(私は〜です)と دارم(私は持っている)はどちらもこれまでに学んだ表現で、ここでは一人称で自分の外見を説明するのに使います。
    target_text: استم(私は~です)/ دارم(私は持っています)
  prs.a1.unit27.lesson06.teach.wrap_summary:
    title: 私は背が低いですが、髪は黒いです
    gloss: 私は背が低いですが、髪は黒いです。
    note: اما を使って、二つの外見の事実をつなげた文です。
