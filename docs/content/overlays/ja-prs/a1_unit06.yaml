teaching:
  prs.a1.unit06.lesson01.teach.straight:
    title: まっすぐ
    gloss: まっすぐ
    note: مستقیم は、まっすぐ前に進むことを表します。
    example_gloss: まっすぐ行ってください。
  prs.a1.unit06.lesson01.teach.left:
    title: 左
    gloss: 左
    note: چپ は「左」という方向です。
    example_gloss: 左に曲がってください。
  prs.a1.unit06.lesson01.teach.right:
    title: 右
    gloss: 右
    note: راست は「右」という方向です。
    example_gloss: 右に曲がってください。
  prs.a1.unit06.lesson01.teach.turn_verb:
    title: 曲がる(丁寧な命令形)
    gloss: 曲がる
    note: بپیچین は「曲がる」という動詞の丁寧な命令形で、道案内で相手に指示するときに使います。
    example_gloss: 右に曲がってください。
  prs.a1.unit06.lesson01.teach.to_word:
    title: 〜へ、〜に向かって
    gloss: 〜へ/〜の方へ
    note: به は、به چپ(左へ)のように方向を表す言葉と一緒に使います。
    target_text: به(〜へ/〜の方へ)
  prs.a1.unit06.lesson02.teach.go_straight:
    title: まっすぐ行くように伝える
    gloss: まっすぐ行ってください。
    note: مستقیم بروین は、丁寧な命令形を使った基本の道案内の表現です。
  prs.a1.unit06.lesson02.teach.turn_left:
    title: 左に曲がるように伝える
    gloss: 左に曲がってください。
    note: به چپ بپیچین は、直訳すると「左へ曲がってください」です。
  prs.a1.unit06.lesson02.teach.turn_right:
    title: 右に曲がるように伝える
    gloss: 右に曲がってください。
    note: به راست بپیچین は、چپ を راست に替えただけで、同じ型です。
  prs.a1.unit06.lesson03.teach.first_word:
    title: 最初に
    gloss: 最初に
    note: اول は、道案内の最初の手順を表します。
    example_gloss: 最初にまっすぐ行ってください。
  prs.a1.unit06.lesson03.teach.then_word:
    title: それから
    gloss: それから
    note: بعد は、最初の次の手順を表します。
    example_gloss: それから、左に曲がってください。
  prs.a1.unit06.lesson03.teach.sequenced_example:
    title: 2つの手順をつなげる
    gloss: 最初にまっすぐ行って、それから右に曲がってください。
    note: اول と بعد を使うと、複数の手順を1つの案内にまとめられます。
  prs.a1.unit06.lesson04.teach.polite_ask:
    title: 丁寧に行き方を尋ねる
    gloss: 市場への行き方を教えていただけますか？
    note: می‌توانین بگویین...؟ は「…を教えていただけますか？」という丁寧な尋ね方で、知らない人に道を尋ねるときに適しています。بروم は「私が行く」という意味なので、フレーズ全体で「どうやって行けばよいか」を尋ねています。
  prs.a1.unit06.lesson04.teach.bebakhshid_review:
    title: 場所を尋ねる(復習)
    gloss: すみません、薬局はどこですか？
    note: ببخشین، [place] کجاست؟ は場所の単元で学びました。道順を尋ねる前の自然な切り出しです。
  prs.a1.unit06.lesson04.teach.fahmidam:
    title: わかったと伝える
    gloss: どうもありがとうございます、わかりました。
    note: تشکر زیاد، فهمیدم は、やりとりを丁寧に締めくくり、道順が理解できたことを伝える表現です。
  prs.a1.unit06.lesson04.teach.daftar_review:
    title: 事務所(復習)
    gloss: オフィス
    note: دفتر は前の単元で学びました。ここでは、丁寧に道を尋ねる型を練習するための目的地として使います。
    example_gloss: 事務所は近いです。
  prs.a1.unit06.lesson05.teach.after_word:
    title: 〜の後
    gloss: あとで
    note: بعد از は、目的地の手前にある目印を表します。
    example_gloss: モスクを過ぎたところに銀行があります。
  prs.a1.unit06.lesson05.teach.opposite_review:
    title: 向かい/正面
    gloss: 向かい/正面
    note: روبه‌رو は、場所の単元で学んだ مقابل(向かい)の言い換えです。どちらも日常のダリ語で「向かい」の意味で使われます。
    example_gloss: 銀行はモスクの向かいにあります。
  prs.a1.unit06.lesson05.teach.landmark_example:
    title: 目印を使って道案内をする
    gloss: モスクを過ぎると、銀行が目の前にあります。
    note: بعد از مسجد، بانک روبه‌روی شماست は、目印(بعد از مسجد)と相対的な位置(روبه‌روی شماست)を組み合わせた表現です。
  prs.a1.unit06.lesson05.teach.maktab_review:
    title: 学校(復習)
    gloss: 学校
    note: مکتب は場所の単元で学びました。ここでは練習文の目印として使います。
    example_gloss: 学校は近いです。
  prs.a1.unit06.lesson06.teach.turn01:
    title: ソハイラが道を尋ねる
    gloss: ソハイラは店の人に、薬局への行き方を丁寧に尋ねます。
    note: ببخشین は丁寧に質問を切り出す言葉で、می‌توانین بگویین؟ は第4課で学んだ、道を尋ねる丁寧な表現です。
  prs.a1.unit06.lesson06.teach.turn02:
    title: 店の人が最初の手順を伝える
    gloss: 店の人は「はい」と答え、まず、まっすぐ行くように言います。
    note: اول مستقیم بروین は、道順の最初の手順です。
  prs.a1.unit06.lesson06.teach.turn03:
    title: ソハイラが確認して次を尋ねる
    gloss: ソハイラは「まっすぐ」と繰り返して確認し、次の手順を尋ねます。
    note: بعد چطور؟ は、次の手順を簡潔に尋ねる自然な表現です。
  prs.a1.unit06.lesson06.teach.turn04:
    title: 店の人が2番目の手順と目印を伝える
    gloss: 店の人は左に曲がるように言い、モスクと銀行を目印に薬局の場所を説明します。
    note: 第2課で学んだ曲がる指示と、第5課で学んだ目印の型を組み合わせています。
  prs.a1.unit06.lesson06.teach.turn05:
    title: ソハイラがお礼を言い、わかったと伝える
    gloss: ソハイラはお礼を言い、わかったと伝えます。
    note: تشکر زیاد، فهمیدم は、第4課で学んだとおり、やりとりを締めくくる表現です。
  prs.a1.unit06.lesson06.teach.turn06:
    title: 店の人の謙遜した返事とお別れ
    gloss: 店の人はお礼に謙遜して応え、道中の無事を祈ります。
    note: قابلی نداره は場所の単元で学びました。سفر خوش(良い旅を/お気をつけて)は、これから出かける人への自然なお別れの言葉です。
