    note: می‌تراشم は、「剃る」を意味する تراشیدن の一人称現在形です。
    example_gloss: 私はひげを剃ります。
  prs.a1.unit47.lesson03.teach.shave_beard_phrase:
    title: 私はひげを剃ります
    gloss: 私はひげを剃ります。
