  prs.a1.unit47.lesson01.teach.review_appointment_want:
    title: 復習:予約、~がほしい
    gloss: 予約/~がほしい(私)
    note: قرار と می‌خواهم は、予約を頼むときに使う復習の単語です。
    target_text: قرار(予約)/ می‌خواهم(ほしいです)
