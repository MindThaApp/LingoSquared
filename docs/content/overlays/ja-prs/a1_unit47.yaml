    gloss: 整えること/散髪
    note: اصلاح は、髪やひげを整えることを表す日常的なダリー語で、頼む内容として使います。
    example_gloss: 整えてほしいです。
  prs.a1.unit47.lesson02.teach.no_just_trim_phrase:
