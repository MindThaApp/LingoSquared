    title: 髪をもっと短くしますか?
    gloss: 髪をもっと短くしますか?
    note: موی کوتاه‌تر می‌خواهین؟ は、疑問詞を使わず、語尾を上げて発音することで作る「はい・いいえ」の疑問文です。
