    gloss: ~がほしい(私)/~がほしい(あなた・丁寧)
    note: می‌خواهم と می‌خواهین(前のユニットで学習済み)は、スタイルを頼むときに使う復習の単語です。
    target_text: می‌خواهم(ほしいです)/ می‌خواهین(ほしいですか、丁寧)
