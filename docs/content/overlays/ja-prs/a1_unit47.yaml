teaching:
  prs.a1.unit47.lesson01.teach.review_this_is_in:
    title: 復習:これ・です・~に(で)
    gloss: これ/です/~に(で)
    note: این、است、در(このコース全体で使われています)は、理髪店について話すための復習の単語です。
    target_text: این(これ)/ است(です)/ در(〜で、〜に)
  prs.a1.unit47.lesson01.teach.barbershop_word:
    title: 理髪店
    gloss: 理髪店
    note: سلمانی は、カブールなどの都市で使われる、理髪店や美容室を指す日常的な言葉です。
    example_gloss: これは理髪店です。
  prs.a1.unit47.lesson01.teach.this_is_barbershop_phrase:
    title: これは理髪店です
    gloss: これは理髪店です。
    note: این سلمانی است は、このレッスンで先に学んだ単語を組み合わせた文です。
  prs.a1.unit47.lesson01.teach.barber_word:
    title: 理容師
    gloss: 理容師
    note: دلاک は、アフガニスタンのダリー語で昔から使われる「理容師」を表す言葉です。
    example_gloss: 理容師は理髪店にいます。
  prs.a1.unit47.lesson01.teach.barber_in_barbershop_phrase:
    title: 理容師は理髪店にいます
    gloss: 理容師は理髪店にいます。
