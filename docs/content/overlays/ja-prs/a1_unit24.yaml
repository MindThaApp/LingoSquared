course:
  title: ダリー語 A1
  description: カブール方言ダリー語の初級:乗り物の語彙(バス、タクシー、車、自転車、徒歩)、移動手段の言い方、切符の買い方、そしてザルミナとホマユンが通勤手段を比べる会話。
units:
  prs.a1.unit24.transportation:
    title: 交通手段
    description: 街での移動手段を話し、切符を買い、どの乗り物に乗るかたずねられるようになりましょう。
