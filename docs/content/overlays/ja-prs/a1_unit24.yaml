  prs.a1.unit24.lesson03.buying_a_ticket:
    title: 切符を買う
  prs.a1.unit24.lesson04.commute_dialogue:
    title: 通勤の会話
  prs.a1.unit24.lesson05.reading_commute:
    title: 通勤についての読み物
  prs.a1.unit24.lesson06.wrap_up:
    title: まとめ
teaching:
  prs.a1.unit24.lesson01.teach.bus:
    title: バス
    gloss: バス
    note: بس は「バス」という意味です。
    example_gloss: バスが来ます。
  prs.a1.unit24.lesson01.teach.taxi:
    title: タクシー
    gloss: タクシー
    note: تکسی は「タクシー」という意味です。
    example_gloss: 私はタクシーに乗ります。
  prs.a1.unit24.lesson01.teach.car:
    title: 車
    gloss: 車
    note: موتر は「車」という意味で、アフガニスタンのダリー語で日常的に使う一般的な言い方です(イランのペルシア語では ماشین と言います)。
    example_gloss: 私は車を持っています。
  prs.a1.unit24.lesson01.teach.bicycle:
    title: 自転車
    gloss: 自転車
    note: دوچرخه は「自転車」という意味です。
    example_gloss: 私は自転車を持っています。
  prs.a1.unit24.lesson01.teach.on_foot:
    title: 徒歩で
    gloss: 徒歩で/歩いて
    note: پیاده は「徒歩で」「歩いて」という意味です。
    example_gloss: 歩いて行きます。
  prs.a1.unit24.lesson01.teach.review_miravam:
    title: 行きます
    gloss: 私は行きます
    note: می‌روم は「私は行きます」という意味です(コース内で既習)。
    example_gloss: 歩いて行きます。
  prs.a1.unit24.lesson02.teach.ba:
    title: 〜で/〜と一緒に
    gloss: 〜で/〜と一緒に
    note: با は手段を表す前置詞で、「〜で(乗り物)」と言うときに使います。
    example_gloss: バスで行きます。
  prs.a1.unit24.lesson02.teach.ba_bus:
    title: バスで行きます
    gloss: バスで行きます。
    note: با بس می‌روم は「バスで行きます」という意味です。
  prs.a1.unit24.lesson02.teach.ba_taxi:
    title: タクシーで行きます
    gloss: タクシーで行きます。
    note: با تکسی می‌روم は「タクシーで行きます」という意味です。
  prs.a1.unit24.lesson02.teach.chetor:
    title: どのように
    gloss: どんな
    note: چطور は「どのように」という意味です。
    example_gloss: どうやって行きますか。
  prs.a1.unit24.lesson02.teach.chetor_miravi:
    title: どうやって行きますか。
    gloss: どうやって行きますか。
    note: 相手の移動手段をたずねるときによく使う質問です。
  prs.a1.unit24.lesson03.teach.ticket:
    title: 切符
    gloss: 切符
    note: تکت は「切符」という意味で、日常的によく使われる外来語です。
    example_gloss: 私は切符を買います。
  prs.a1.unit24.lesson03.teach.station:
    title: 駅
    gloss: 駅/停留所
    note: ایستگاه は「駅」や「停留所」という意味です。
    example_gloss: バス停はどこですか。
  prs.a1.unit24.lesson03.teach.ticket_price_q:
    title: 切符はいくらですか？
    gloss: 切符はいくらですか？
    note: 切符を買うときによく使う質問です。
  prs.a1.unit24.lesson03.teach.review_khoram:
    title: 私は買います
    gloss: 私は買います
    note: می‌خرم は「私は買います」という意味です(コース内で既習)。
    example_gloss: 私は切符を買います。
  prs.a1.unit24.lesson04.teach.dialogue_line1:
    title: ザルミナ:どうやって街へ行くの?
    gloss: ザルミナ:ホマユン、あなたはどうやって街へ行きますか。
    note: شهر は「市内/町」という意味で、この文で初めて出てきます。
  prs.a1.unit24.lesson04.teach.dialogue_line2:
    title: ホマユン:歩いて行くよ、近いから
    gloss: ホマユン:私は歩いて行きます。近いので。あなたはどうやって行きますか。
    note: نزدیک は「近い」という意味で、この文で初めて出てきます。
  prs.a1.unit24.lesson04.teach.dialogue_line3:
    title: ザルミナ:タクシーで行くわ、直行で速いから
    gloss: ザルミナ:私はタクシーで行きます。直行で速いです。
    note: تیز は「速い」という意味で、この文で初めて出てきます。
  prs.a1.unit24.lesson04.teach.dialogue_line4:
    title: ホマユン:バスもいいよ、安いから
    gloss: ホマユン:バスもいいですよ。安いです。
    note: ارزان は「安い」という意味で、この文で初めて出てきます。
  prs.a1.unit24.lesson04.teach.dialogue_line5:
    title: ザルミナ:ええ、でもタクシーのほうが速いわ
    gloss: ザルミナ:ええ、でもタクシーのほうが速いです。
    note: اما は「でも」という意味です。تیزتر は比較級で「より速い」という意味です。
  prs.a1.unit24.lesson05.teach.reading_passage:
    title: 通勤についての読み物
    gloss: ザルミナは毎日タクシーで街へ行きます。タクシーは速いですが、安くはありません。ホマユンは家が近いので、歩いて行きます。彼は車を買うためにお金を貯めています。
    note: この課の語彙と、理由を表す接続語「چون」(〜なので)をまとめた短い読み物です。
  prs.a1.unit24.lesson06.teach.review_dochakhe:
    title: 自転車(復習)
    gloss: 自転車
    note: دوچرخه は「自転車」という意味です(レッスン1の復習)。
    example_gloss: 自転車で行きます。
  prs.a1.unit24.lesson06.teach.wrap_summary:
    title: 私は毎日、歩くかバスで行きます
    gloss: 私は毎日、歩いてかバスで行きます。
    note: یا は「または」という意味で、このまとめの文で初めて出てきます。
