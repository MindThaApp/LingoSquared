    pairs:
    - left: دارم
      right: 私は持っている
    - left: داریم
      right: 私たちは持っています
    - left: دارین
      right: あなたは持っています(丁寧)
    - left: فامیل
      right: 家族
    - left: تک‌فرزند
      right: 一人っ子
    - left: یک برادر و دو خواهر دارم
      right: 私には兄(弟)が一人と姉(妹)が二人います。
  prs.a1.unit03.lesson03.exercise04.order_size:
    instruction: 並べ替えてください：私たちの家族は6人です。
    accepted_answers:
    - value:
      - فامیل
      - ما
      - شش
      - نفر
      - است
      status: correct
    feedback: فامیل ما شش نفر است は家族の人数が6人であることを表します。
  prs.a1.unit03.lesson03.exercise05.complete_siblings:
    instruction: 完成させてください：私には兄(弟)が一人います。
