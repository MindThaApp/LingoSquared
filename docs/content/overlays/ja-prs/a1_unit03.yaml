course:
  title: ダリー語 A1
  description: カブール方言のダリー語で、敬意をこめた日常のコミュニケーションを学ぶ初級コースです。
units:
  prs.a1.unit03.family:
    title: 家族と親戚
lessons:
  prs.a1.unit03.lesson01.immediate_family:
    title: 身近な家族
  prs.a1.unit03.lesson02.extended_family:
    title: 母方と父方の親戚
  prs.a1.unit03.lesson03.family_size:
    title: ご家族は何人ですか？
  prs.a1.unit03.lesson04.ask_about_family:
    title: 相手の家族について尋ねる
  prs.a1.unit03.lesson05.marital_status:
    title: 結婚と婚姻状況
  prs.a1.unit03.lesson06.family_dialogue:
    title: フェレシュテの家族についての会話
teaching:
  prs.a1.unit03.lesson01.teach.mother:
    title: 母
    gloss: 母
    note: مادر は「母」を表す中立的なダリー語です。
    example_gloss: 私の母は優しいです。
  prs.a1.unit03.lesson01.teach.father:
    title: 父
    gloss: 父
    note: پدر は「父」を表す中立的なダリー語です。
    example_gloss: 私の父は医者です。
  prs.a1.unit03.lesson01.teach.brother:
    title: 兄・弟
    gloss: 兄弟
    note: برادر は「兄・弟」を意味します。
    example_gloss: 私には兄(弟)が一人います。
  prs.a1.unit03.lesson01.teach.sister:
    title: 姉・妹
    gloss: 姉妹
    note: خواهر は「姉・妹」を意味します。
    example_gloss: 私の姉(妹)は先生です。
  prs.a1.unit03.lesson01.teach.parents:
    title: 両親
    gloss: 父と母、両親
    note: ダリー語では、自分の両親を指すとき、普通 پدر و مادر と言います。
    example_gloss: 私の両親はカブールに住んでいます。
  prs.a1.unit03.lesson01.teach.my_mother:
    title: 母を紹介する
    gloss: こちらは私の母です。
    note: مادرم の語尾 ـم は「私の」を意味します。
  prs.a1.unit03.lesson02.teach.grandfather:
    title: 祖父
    gloss: 祖父
    note: پدرکلان はアフガニスタンのダリー語で一般的な言い方で、直訳すると「大きい父」または「年上の父」です。
    example_gloss: 私の祖父は高齢です。
  prs.a1.unit03.lesson02.teach.grandmother:
    title: 祖母
    gloss: 祖母
    note: مادرکلان はアフガニスタンのダリー語で一般的な言い方で、直訳すると「大きい母」または「年上の母」です。
    example_gloss: 私の祖母は優しい人です。
  prs.a1.unit03.lesson02.teach.paternal_uncle:
    title: 父の兄弟
    gloss: 父方のおじ
    note: کاکا は、父の兄弟を specifically 指します。
    example_gloss: 私のおじはヘラートに住んでいます。
  prs.a1.unit03.lesson02.teach.paternal_aunt:
    title: 父の姉妹
    gloss: 父方のおば
    note: عمه は、父の姉妹だけを指します。
    example_gloss: 私のおばは教師です。
  prs.a1.unit03.lesson02.teach.maternal_uncle:
    title: 母の兄弟
    gloss: 母方のおじ
    note: ダリー語の ماما は、母の兄弟だけを指します。
    example_gloss: 私の(母方の)おじはエンジニアです。
  prs.a1.unit03.lesson02.teach.maternal_aunt:
    title: 母の姉妹
    gloss: 母方のおば
    note: خاله は、母の姉妹だけを指します。
    example_gloss: 私の(母方の)おばはカブールに住んでいます。
  prs.a1.unit03.lesson02.teach.side_distinction:
    title: 父方と母方を区別しましょう
    gloss: カカとアンマは父方、ママとハーラは母方です。
    note: 日本語の「おじ・おば」は父方か母方かを区別しませんが、ダリー語ではこの4つの言葉で父方・母方をはっきり区別します。
  prs.a1.unit03.lesson03.teach.family:
    title: 家族
    gloss: 家族
    note: فامیل は「家族」を表すアフガニスタンのダリー語の普通の言葉です。
    example_gloss: 私の家族は大家族です。
  prs.a1.unit03.lesson03.teach.how_many_people:
    title: 家族の人数を丁寧に尋ねる
    gloss: ご家族は何人ですか？
    note: ـتان は丁寧な「あなたの」を表します。نفر は人を数える助数詞です。
  prs.a1.unit03.lesson03.teach.five_people:
    title: 家族の人数を伝える
    gloss: 私たちの家族は5人です。
    note: ダリー語では、家族を نفر است を使って「何人」と表します。
  prs.a1.unit03.lesson03.teach.have_siblings:
    title: きょうだいの数を言う
    gloss: 私には兄(弟)が一人と姉(妹)が二人います。
    note: دارم は「私は持っています」の意味です。数詞の後でも名詞は単数形のままです。
  prs.a1.unit03.lesson03.teach.only_child:
    title: 一人っ子
    gloss: 私は一人っ子です。
    note: استم は、このコースで学ぶカブールのダリー語の一人称の形です。
  prs.a1.unit03.lesson03.teach.possession:
    title: 「持つ」の形
    gloss: 私は持っています、私たちは持っています、あなたは持っています
    note: دارین は、教養あるカブールの口語で、敬意を表す「あなた」または複数の「あなたたち」の「持っています」です。
  prs.a1.unit03.lesson04.teach.have_siblings_question:
    title: きょうだいについて尋ねる
    gloss: きょうだいはいらっしゃいますか？
    note: دارین を使うと、敬意のある言い方、または複数への言い方になります。
  prs.a1.unit03.lesson04.teach.how_many_siblings:
    title: きょうだいの数を尋ねる
    gloss: きょうだいは何人いらっしゃいますか？
    note: چند は「いくつ・何人」と尋ねる言葉です。
  prs.a1.unit03.lesson04.teach.parents_well:
    title: 相手のご両親の様子を尋ねる
    gloss: ご両親はお元気ですか？
    note: جور استند は、「元気です」を表すアフガニスタンでよく使われる言い方です。
  prs.a1.unit03.lesson04.teach.yes_answer:
    title: 肯定の答え
    gloss: はい、兄(弟)が一人います。
    note: بلی は、アフガニスタンで使われる丁寧で標準的な「はい」です。
  prs.a1.unit03.lesson04.teach.no_answer:
    title: 否定の答え
    gloss: いいえ、姉(妹)はいません。
    note: نخیر は丁寧な「いいえ」です。ندارم は「私は持っていません」の意味です。
  prs.a1.unit03.lesson04.teach.polite_your:
    title: 丁寧な「あなたの」
    gloss: あなたのご家族、あなたのお母様、あなたのお父様
    note: 所有を表す語尾 ـتان は、敬意または複数を表します。このコースでは ZWNJ(ゼロ幅非結合子)でつなげて書きます。
  prs.a1.unit03.lesson05.teach.married:
    title: 結婚している
    gloss: 結婚している
    note: متأهل は、婚姻状況を表す中立的な言葉です。
    example_gloss: 彼/彼女は結婚しています。
  prs.a1.unit03.lesson05.teach.single:
    title: 独身
    gloss: 独身、未婚
    note: ここでは、مجرد は「未婚」の意味です。
    example_gloss: 私は独身です。
  prs.a1.unit03.lesson05.teach.husband:
    title: 夫
    gloss: 夫
    note: شوهر は「夫」を表す普通の言葉です。
    example_gloss: 私の夫はエンジニアです。
  prs.a1.unit03.lesson05.teach.wife:
    title: 妻
    gloss: 妻
    note: خانم は「妻」または丁寧に呼びかける「女性」を表します。文脈で区別します。
    example_gloss: 私の妻は教師です。
  prs.a1.unit03.lesson05.teach.marriage_question:
    title: 結婚について丁寧に尋ねる
    gloss: 結婚していらっしゃいますか？
    note: 直訳すると「結婚しましたか？」です。語尾 ـین はカブールの丁寧な形です。
  prs.a1.unit03.lesson05.teach.married_answer:
    title: 結婚していると伝える
    gloss: はい、結婚しています。
    note: استم は、ここで使われるアフガニスタンのダリー語の一人称のコピュラ(「~です」)です。
  prs.a1.unit03.lesson05.teach.children:
    title: 子どもについて尋ねる
    gloss: お子さんはいますか？
    note: اولاد は、自分の子ども(一人でも複数でも)を表す一般的な集合名詞です。
  prs.a1.unit03.lesson06.teach.turn01:
    title: マリヤムが家族の人数を尋ねる
    gloss: ご家族は何人ですか？
    note: マリヤムは敬意を表す ـتان を使っています。
  prs.a1.unit03.lesson06.teach.turn02:
    title: フェレシュテがきょうだいについて話す
    gloss: 5人です。兄(弟)が一人と姉(妹)が一人います。
    note: 家族の人数は نفر で数えます。
  prs.a1.unit03.lesson06.teach.turn03:
    title: マリヤムが結婚について尋ねる
    gloss: 結婚していらっしゃいますか？
    note: この質問は、形の上で丁寧で中立的です。
  prs.a1.unit03.lesson06.teach.turn04:
    title: フェレシュテが夫について話す
    gloss: はい、結婚しています。夫は大学生です。
    note: ここでは、「学生」を表す言葉として、イランの دانشجو ではなく、アフガニスタンのダリー語で定着している محصل が使われています。
  prs.a1.unit03.lesson06.teach.turn05:
    title: マリヤムが子どもについて尋ねる
    gloss: お子さんはいますか？
    note: دارین で、敬意のある話し方を保っています。
  prs.a1.unit03.lesson06.teach.turn06:
    title: フェレシュテが答える
    gloss: いいえ、まだ子どもはいません。
    note: نخیر は丁寧な「いいえ」です。نداریم は「私たちは持っていません」の意味です。
exercises:
  prs.a1.unit03.lesson01.exercise01.recognize_mother:
    instruction: مادر の意味を選んでください。
    correct_option: 母
    distractors:
    - 父
    - 兄弟
    - 姉妹
    accepted_answers:
    - value: 母
      status: correct
    feedback: مادر は「母」という意味です。
  prs.a1.unit03.lesson01.exercise02.recognize_siblings:
    instruction: 「兄・弟」と「姉・妹」を表す組み合わせはどれですか？
    correct_option: برادر و خواهر
    distractors:
    - پدر و مادر
    - کاکا و عمه
    - ماما و خاله
    accepted_answers:
    - value: برادر و خواهر
      status: correct
    feedback: برادر は「兄・弟」、خواهر は「姉・妹」です。
  prs.a1.unit03.lesson01.exercise03.match_immediate:
    instruction: 近い家族を表すことばと、その意味を組み合わせてください。
    accepted_answers:
    - value:
        مادر: 母
        پدر: 父
        برادر: 兄弟
        خواهر: 姉妹
      status: correct
    feedback: ここで学ぶ、近い家族を表す4つのことばです。
    pairs:
    - left: مادر
      right: 母
    - left: پدر
      right: 父
    - left: برادر
      right: 兄弟
    - left: خواهر
      right: 姉妹
  prs.a1.unit03.lesson01.exercise04.order_parents:
    instruction: 「両親」を表すダリー語の表現を並べ替えてください。
    accepted_answers:
    - value:
      - پدر
      - و
      - مادر
      status: correct
    feedback: پدر و مادر は、直訳すると「父と母」です。
  prs.a1.unit03.lesson01.exercise05.translate_this_is_mother:
    instruction: ダリー語に訳してください：こちらは私の母です。
    accepted_answers:
    - value: این مادرم است
      status: correct
    - value: این مادر من است
      status: correct
    feedback: این مادرم است は「こちらは私の母です」という意味です。
    prompt_blocks:
    - こちらは私の母です。
  prs.a1.unit03.lesson01.exercise06.translate_sister:
    instruction: ダリー語に訳してください：こちらは私の姉(妹)です。
    accepted_answers:
    - value: این خواهرم است
      status: correct
    - value: این خواهر من است
      status: correct
    feedback: خواهرم の語尾 م は「私の」を表します。
  prs.a1.unit03.lesson01.exercise07.speak_family_member:
    instruction: 写真の兄弟または姉妹の一人を指して、その人が誰かをダリー語で言ってください。
    accepted_answers:
    - value: این برادرم است
      status: correct
    - value: این خواهرم است
      status: correct
    - value: این برادر من است
      status: correct
    - value: این خواهر من است
      status: correct
    feedback: این、「私の」を付けた続柄のことば、そして است を使います。
  prs.a1.unit03.lesson02.exercise01.recognize_grandparents:
    instruction: پدرکلان の意味を選んでください。
    correct_option: 祖父
    distractors:
    - 祖母
    - 父
    - 父方のおじ
    accepted_answers:
    - value: 祖父
      status: correct
    feedback: アフガニスタンのダリー語では、پدرکلان は「祖父」の意味です。
  prs.a1.unit03.lesson02.exercise02.recognize_maternal_uncle:
    instruction: ماما はどの続柄を表しますか？
    correct_option: 母の兄弟
    distractors:
    - 父の兄弟
    - 母の姉妹
    - 父の姉妹
    accepted_answers:
    - value: 母の兄弟
      status: correct
    feedback: ماما は特に母方のおじを指します。
  prs.a1.unit03.lesson02.exercise03.match_sides:
    instruction: それぞれの単語を意味と組み合わせてください。
    accepted_answers:
    - value:
        کاکا: 父の兄弟
        عمه: 父の姉妹
        ماما: 母の兄弟
        خاله: 母の姉妹
        مادر: 母
        پدر: 父
        برادر: 兄弟
        خواهر: 姉妹
      status: correct
    feedback: ダリー語では、おばやおじが父方か母方かを区別します。最後の4つは、レッスン1の近い家族の復習です。
    pairs:
    - left: کاکا
      right: 父の兄弟
    - left: عمه
      right: 父の姉妹
    - left: ماما
      right: 母の兄弟
    - left: خاله
      right: 母の姉妹
    - left: مادر
      right: 母
    - left: پدر
      right: 父
    - left: برادر
      right: 兄弟
    - left: خواهر
      right: 姉妹
  prs.a1.unit03.lesson02.exercise04.order_grandmother:
    instruction: 並べ替えてください：こちらは私の祖母です。
    accepted_answers:
    - value:
      - این
      - مادرکلان
      - من
      - است
      status: correct
    feedback: مادرکلان من は「私の祖母」という意味です。
  prs.a1.unit03.lesson02.exercise05.complete_uncle:
    instruction: 完成させてください：母の兄弟は私の母方のおじです。
    accepted_answers:
    - value: مامایم
      status: correct
    - value: ماما
      status: correct
    feedback: مامایم は「私の母方のおじ」という意味です。
  prs.a1.unit03.lesson02.exercise06.translate_paternal_aunt:
    instruction: ダリー語に訳してください：彼女は私の父方のおばです。
    accepted_answers:
    - value: او عمه‌ام است
      status: correct
    - value: او عمه ام است
      status: acceptable_with_note
      note: キーボード入力でのスペースも正解になります。標準的な表記ではゼロ幅ノンジョイナー(ZWNJ)を使います。
    - value: او عمهٔ من است
      status: correct
    feedback: عمه は父の姉妹を表します。
  prs.a1.unit03.lesson02.exercise07.speak_distinction:
    instruction: 特定の人ではなく続柄を説明してください：父方のおじ(کاکا)は父の兄弟で、母方のおじ(ماما)は母の兄弟だと言ってください。
    accepted_answers:
    - value: کاکایم برادر پدرم است. مامایم برادر مادرم است.
      status: correct
    - value: کاکایم برادر پدرم است و مامایم برادر مادرم است
      status: correct
    feedback: کاکا は父方、ماما は母方です。
  prs.a1.unit03.lesson03.exercise01.recognize_size:
    instruction: この家族は何人ですか？
    correct_option: '5'
    distractors:
    - 4人
    - 6時
    - 7時
    accepted_answers:
    - value: '5'
      status: correct
    feedback: پنج نفر は「5人」という意味です。
  prs.a1.unit03.lesson03.exercise02.recognize_only_child:
    instruction: من تک‌فرزند استم の意味を選んでください。
    correct_option: 私は一人っ子です。
    distractors:
    - 私には子どもが一人います。
    - 私には兄(弟)が一人います。
    - 私たちは一つの家族です。
    accepted_answers:
    - value: 私は一人っ子です。
      status: correct
    feedback: تک‌فرزند は「一人っ子」という意味です。
  prs.a1.unit03.lesson03.exercise03.match_have_forms:
    instruction: それぞれの単語やフレーズを意味と組み合わせてください。
    accepted_answers:
    - value:
        دارم: 私は持っている
        داریم: 私たちは持っています
        دارین: あなたは持っています(丁寧)
        فامیل: 家族
        تک‌فرزند: 一人っ子
        یک برادر و دو خواهر دارم: 私には兄(弟)が一人と姉(妹)が二人います。
      status: correct
