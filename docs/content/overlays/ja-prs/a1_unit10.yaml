teaching:
  prs.a1.unit10.lesson01.teach.dokan:
    title: お店
    gloss: 店
    note: دوکان はアフガニスタンのダリー語本来の言葉で、小さな地元の店を指します。イランのペルシア語の مغازه に当たります。
    example_gloss: このお店は大きいです。
  prs.a1.unit10.lesson01.teach.qeymat:
    title: 値段
    gloss: 値段
    note: قیمت は「値段」「価格」という意味です。
    example_gloss: これの値段はいくらですか?
  prs.a1.unit10.lesson01.teach.arzan:
    title: 安い
    gloss: 安い
    note: ارزان は「安い」「手頃な」という意味です。
    example_gloss: これは安いです。
  prs.a1.unit10.lesson01.teach.gran:
    title: 高い
    gloss: (値段が)高い
    note: گران は ارزان の反対で、「高い」という意味です。
    example_gloss: これは高いです。
  prs.a1.unit10.lesson01.teach.takhfif:
    title: 割引
    gloss: 割引
    note: تخفیف は「値引き」「割引」という意味です。
    example_gloss: 割引はありますか。
  prs.a1.unit10.lesson01.teach.va_word:
    title: 〜と
    gloss: そして
    note: و は、短い文や依頼を2つつなぐときによく使う「と」「そして」にあたる言葉です。
    example_gloss: りんごとパンを買います。
  prs.a1.unit10.lesson02.teach.qeymatesh_chand:
    title: それはいくらですか?
    gloss: それはいくらですか?
    note: قیمتش چند است؟ は直訳すると「その値段はいくらですか?」という意味です。
  prs.a1.unit10.lesson02.teach.sad_afghani:
    title: 百アフガニです。
    gloss: 百アフガニです。
    note: صد افغانی است は、アフガニスタンの通貨 افغانی(アフガニ)を使って値段を言う表現です。
  prs.a1.unit10.lesson03.teach.sib:
    title: りんご
    gloss: りんご
    note: سیب は「りんご」という意味です。ここでは売り物のりんごをまとめて指す、複数・総称の意味で使われています。
    example_gloss: りんごを1キロください。
  prs.a1.unit10.lesson03.teach.kilo:
    title: キロ
    gloss: キロ
    note: کیلو は、果物や野菜などを量り売りするときの標準的な単位です。
    example_gloss: りんごを1キロください。
  prs.a1.unit10.lesson03.teach.label_text:
    title: りんご:1キロ100アフガニ
    gloss: りんご:1キロ100アフガニ
    note: 'سیب: یک کیلو صد افغانی は、市場でよく見かける値札の書き方です。'
  prs.a1.unit10.lesson04.teach.yak_kilo_sib:
    title: りんごを1キロください。
    gloss: りんごを1キロください。
    note: یک کیلو سیب می‌خواهم は、第8課で学んだ食べ物の注文と同じ「یک [物] می‌خواهم」の型です。
  prs.a1.unit10.lesson04.teach.do_kilo:
    title: 2キロください。
    gloss: 2キロください。
    note: دو کیلو می‌خواهم は、دو(2)に替えて、より多い量を頼む言い方です。
  prs.a1.unit10.lesson05.teach.takhfif_mitanin:
    title: 値引きしていただけますか?
    gloss: 値引きしていただけますか?
    note: تخفیف می‌توانین بدهین؟ は、می‌توانین(できますか)を使って、丁寧に値引きをお願いする表現です。
  prs.a1.unit10.lesson05.teach.baraye_shoma:
    title: あなたには180アフガニになります。
    gloss: あなたには180アフガニになります。
    note: برای شما صد و هشتاد افغانی می‌شه は、値引き後の合計金額を示す表現です。1キロ100アフガニで2キロなら200アフガニのところ、20アフガニ安くなっています。
  prs.a1.unit10.lesson06.teach.befarmayin:
    title: どうぞ
    gloss: どうぞ
    note: بفرمایین は、お客さんが来たときに店の人が使う、温かく丁寧な「いらっしゃいませ」「どうぞ」にあたる言葉です。
    example_gloss: どうぞ、これが値段です。
  prs.a1.unit10.lesson06.teach.turn01:
    title: こんにちは、いらっしゃいませ。
    gloss: こんにちは、いらっしゃいませ。
    note: 店主がお客さんに温かくあいさつします。
  prs.a1.unit10.lesson06.teach.turn02:
    title: こんにちは。りんごはいくらですか?
    gloss: こんにちは。りんごはいくらですか?
    note: お客さんがりんごの値段をたずねます。
  prs.a1.unit10.lesson06.teach.turn03:
    title: 1キロ100アフガニです。
    gloss: 1キロ100アフガニです。
    note: 店主が1キロあたりの値段を伝えます。
  prs.a1.unit10.lesson06.teach.turn04:
    title: 2キロください。まけてもらえますか?
    gloss: 2キロください。まけてもらえますか?
    note: お客さんが量を伝えて、値引きをお願いします。
  prs.a1.unit10.lesson06.teach.turn05:
    title: はい、お客さまには2キロで180アフガニにします。
    gloss: はい、お客さまには2キロで180アフガニにします。
    note: 店主が承知して、値引き後の合計金額を伝えます。1キロ100アフガニなので、200アフガニから20アフガニ引いた金額です。
  prs.a1.unit10.lesson06.teach.turn06:
    title: とてもいいですね、ありがとう。
    gloss: とてもいいですね、ありがとう。
    note: お客さんが値段に納得して、店主にお礼を言います。
