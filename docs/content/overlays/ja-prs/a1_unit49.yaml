    gloss: ホマユーンはクリーニング店にいます。洗濯とアイロンがけをお願いしたいそうです。1キロ50アフガニです。明日できあがります。
  prs.a1.unit49.lesson06.teach.review_but_wash_wash_and_iron:
    title: 復習:でも、洗濯、洗濯とアイロンがけ
    gloss: でも/洗濯/洗濯とアイロンがけ
    note: 「でも」は前のユニットで学んだ復習単語です。
    target_text: اما (しかし) / شستن (洗濯) / شستن و اتو (洗濯とアイロン)
  prs.a1.unit49.lesson06.teach.review_price_thirty_fifty:
    title: 復習:1キロにつき、30、50、アフガニ、です
    gloss: 1キロにつき/30/50/アフガニ/です
