  prs.a1.unit49.lesson05.teach.review_he_wash_iron_price_ready:
    title: 復習:彼/彼女、洗濯、アイロンがけ、1キロにつき、50アフガニ、明日、できあがり
    gloss: 彼/彼女/洗濯/アイロンがけ/1キロにつき/50アフガニ/明日/できあがり
    note: このユニットで学んだ単語のうち、読み物で使う復習単語です。
