teaching:
  prs.a1.unit49.lesson01.teach.review_this_is_in:
    title: '復習: これ、です、〜に・〜で'
    gloss: これ / です / 〜に・〜で
    note: クリーニング店の話をするときに使う復習の単語です（このコースで繰り返し使ってきました）。
    target_text: این (これ) / است (です) / در (〜に・〜で)
  prs.a1.unit49.lesson01.teach.review_clothes_shop_shopkeeper:
    title: '復習: 服、店、店主'
    gloss: 服 / 店 / 店主
    note: 「服」はユニット21、「店」と「店主」はユニット10で習った復習の単語です。
    target_text: لباس (服) / دوکان (店) / دوکاندار (店主)
  prs.a1.unit49.lesson01.teach.laundry_word:
    title: クリーニング
    gloss: クリーニング店・洗濯
    note: このコースで習った「服」を表す語と、「洗う」という動詞の語根を組み合わせた言葉で、クリーニング店や洗濯サービスを指す日常的なダリー語です。
    example_gloss: ここはクリーニング店です。
  prs.a1.unit49.lesson01.teach.this_is_laundry_shop_phrase:
    title: ここはクリーニング店です
    gloss: ここはクリーニング店です。
    note: 「これ」「店」「クリーニング」を、このコースでこれまでも見てきたように、つなぎの語なしで名詞を2つ並べて組み合わせています。
  prs.a1.unit49.lesson01.teach.shopkeeper_at_shop_phrase:
    title: 店主は店にいます
    gloss: 店主は店にいます。
    note: 「店主」と「店」を組み合わせた文です。
  prs.a1.unit49.lesson02.teach.review_want_object_wash:
    title: '復習: 私は〜したい、目的語の印、私が洗うように'
    gloss: 私は〜したい / （目的語の印） / 私が洗うように
    note: 「私が洗うように」は、すでに習った動詞「洗う」の接続法で、このコースのほかの接続法（「私が取るように」「私が手に入れるように」）と同じ作り方です。
    target_text: می‌خواهم (私は〜したい) / را (目的語の印) / بشویم (私が洗うように — شستن の接続法)
  prs.a1.unit49.lesson02.teach.review_clothes_plural:
    title: '復習: 服（複数）'
    gloss: 服（複数）
    note: 「服」の複数形で、このコースで「りんご」を複数形にしたときと同じ作り方です。
    target_text: لباس‌ها (服（複数）— لباس の複数形)
  prs.a1.unit49.lesson02.teach.want_to_wash_phrase:
    title: 服を洗いたいです
    gloss: 服を洗いたいです。
    note: 図書館で本を借りるとき、予約をするとき、自転車を借りるときにすでに使った「〜したい＋接続法」の型を広げています。
  prs.a1.unit49.lesson02.teach.review_price_per_kilo_price:
    title: '復習: その値段、〜あたり、キロ、いくら、アフガニ、30'
    gloss: その値段 / 〜あたり / キロ / いくら / アフガニ / 30
    note: 1キロあたりの値段を尋ねるときに使う復習の単語です（ユニット4、ユニット10、そのほかの前のユニットで習いました）。
    target_text: قیمتش (その値段) / به (〜あたり) / کیلو (キロ) / چند (いくら) / افغانی (アフガニ) / سی (30)
  prs.a1.unit49.lesson02.teach.ask_price_per_kilo_phrase:
    title: 1キロいくらですか?
    gloss: 1キロいくらですか?
    note: このレッスンで先に習った単語を組み合わせた文です。
  prs.a1.unit49.lesson02.teach.price_per_kilo_answer_phrase:
    title: 1キロ30アフガニです
    gloss: 1キロ30アフガニです。
    note: すでに習った数字と通貨を使って値段を言う文です。
  prs.a1.unit49.lesson03.teach.iron_word:
    title: アイロン・アイロンがけ
    gloss: アイロン・アイロンがけ
    note: 服にアイロンをかけることを表す日常的なダリー語で、ここではクリーニング店の「洗濯とアイロン」のサービスで使います。
    example_gloss: 服にアイロンをかけます。
  prs.a1.unit49.lesson03.teach.review_wash_and:
    title: '復習: 洗うこと、と・そして'
    gloss: 洗うこと・洗濯 / と・そして
    note: 2つのサービスの名前を言うときに使う復習の単語です。
    target_text: شستن (洗うこと) / و (と・そして)
  prs.a1.unit49.lesson03.teach.want_wash_and_iron_phrase:
    title: 洗濯とアイロンをお願いしたいです
    gloss: 洗濯とアイロンをお願いしたいです。
    note: 「洗濯」「と」「アイロン」を組み合わせた文です。
  prs.a1.unit49.lesson03.teach.ready_word:
    title: できあがり
    gloss: できあがり、準備ができた
    note: 「できあがり・準備ができた」を表す日常的なダリー語で、ここでは受け取りの時間を尋ねたり伝えたりするときに使います。
    example_gloss: 明日できあがります。
  prs.a1.unit49.lesson03.teach.review_when_hour_five:
    title: '復習: いつ、明日、〜時、5'
    gloss: いつ / 明日 / 〜時 / 5
    note: 受け取りの時間を尋ねたり言ったりするときに使う復習の単語です（ユニット9、ユニット16、ユニット48、そのほかの前のユニットで習いました）。
    target_text: کی (いつ) / فردا (明日) / ساعت (〜時) / پنج (5)
  prs.a1.unit49.lesson03.teach.ask_when_ready_phrase:
    title: いつできあがりますか?
    gloss: いつできあがりますか?
    note: 「いつ」と「できあがり」を組み合わせた文です。
  prs.a1.unit49.lesson03.teach.ready_tomorrow_five_phrase:
    title: 明日の5時にできあがります
    gloss: 明日の5時にできあがります。
    note: すでに習った「明日」「〜時」「5」を使って受け取りの時間を言う文です。
  prs.a1.unit49.lesson04.teach.review_hello_want_wash:
    title: '復習: こんにちは、私は〜したい、私が洗うように'
    gloss: こんにちは / 私は〜したい / 私が洗うように
    note: 会話の始めに使う復習の単語です。
    target_text: سلام (こんにちは) / می‌خواهم (私は〜したい) / بشویم (私が洗うように)
  prs.a1.unit49.lesson04.teach.review_welcome_wash_and_iron:
    title: '復習: どうぞ、洗濯、アイロン、ほしいです（丁寧）'
    gloss: どうぞ / 洗濯 / アイロン / ほしいです（丁寧）
    note: サービスの種類を尋ねるときに使う復習の単語です。
    target_text: بفرمایین (どうぞ) / شستن (洗濯) / اتو (アイロン) / می‌خواهین (ほしいです・〜したいです（丁寧）)
  prs.a1.unit49.lesson04.teach.review_yes_price_per_kilo:
    title: '復習: はい、〜あたり、キロ、いくら、アフガニ、です'
    gloss: はい / 〜あたり / キロ / いくら / アフガニ / です
    note: 値段を尋ねるときに使う復習の単語です。
    target_text: بلی (はい) / به (〜あたり) / کیلو (キロ) / چند (いくら) / افغانی (アフガニ) / است (です)
  prs.a1.unit49.lesson04.teach.review_fifty_ready_tomorrow_five:
    title: '復習: 50、できあがり、明日、〜時、5'
    gloss: 50 / できあがり / 明日 / 〜時 / 5
    note: 値段と受け取りの時間を言うときに使う復習の単語です。
    target_text: پنجاه (50) / تیار (できあがり・準備ができた) / فردا (明日) / ساعت (〜時) / پنج (5)
  prs.a1.unit49.lesson04.teach.review_very_good_thanks_welcome:
    title: '復習: とてもよい、どうもありがとう、どういたしまして'
    gloss: とてもいいです/どうもありがとう/どういたしまして
    note: 対話の締めくくりに使う復習単語です。
    target_text: بسیار خوب (とてもよい) / تشکر زیاد (どうもありがとう) / خواهش می‌کنم (どういたしまして)
  prs.a1.unit49.lesson04.teach.dialogue_line1:
    title: ホマユーン:こんにちは。服を洗いたいです。
    gloss: こんにちは。服を洗いたいです。
  prs.a1.unit49.lesson04.teach.dialogue_line2:
    title: 店主:こんにちは、いらっしゃいませ。洗濯とアイロンがけをご希望ですか?
    gloss: こんにちは、いらっしゃいませ。洗濯とアイロンがけをご希望ですか?
  prs.a1.unit49.lesson04.teach.dialogue_line3:
    title: ホマユーン:はい。1キロいくらですか?
    gloss: はい。1キロいくらですか?
  prs.a1.unit49.lesson04.teach.dialogue_line4:
    title: 店主:1キロ50アフガニです。明日の5時にできあがります。
    gloss: 1キロ50アフガニです。明日の5時にできあがります。
  prs.a1.unit49.lesson04.teach.dialogue_line5:
    title: ホマユーン:とてもいいですね。どうもありがとうございます。
    gloss: とてもいいですね。どうもありがとうございます。
  prs.a1.unit49.lesson04.teach.dialogue_line6:
    title: 店主:どういたしまして。
    gloss: どういたしまして。
  prs.a1.unit49.lesson05.teach.review_this_is_shopkeeper_in:
    title: 復習:これ、です、店主、〜の中に
    gloss: これ/です/店主/〜で・〜の中に
    note: 読み物で使う復習単語です。
