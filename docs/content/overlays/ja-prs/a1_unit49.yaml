  prs.a1.unit49.lesson06.teach.price_contrast_phrase:
    title: 洗濯は1キロ30アフガニ、でも洗濯とアイロンがけは50アフガニ
    gloss: 洗濯は1キロ30アフガニですが、洗濯とアイロンがけは1キロ50アフガニです。
    note: 「でも」は、洗濯だけの料金と洗濯+アイロンがけの料金を対比しています。
  prs.a1.unit49.lesson06.teach.review_your_laundry_how_many_kilos:
    title: 復習:あなたの洗濯物、いくつ、キロ
    gloss: あなたの洗濯物/いくつ・どのくらい/キロ
    note: 「あなたの洗濯物」は、第48課の「あなたのレンタル」や第47課の「あなたの予約」と同じ接尾辞を使います。
    target_text: لباس شویی‌تان (あなたの洗濯物) / چند (いくつ) / کیلو (キロ)
  prs.a1.unit49.lesson06.teach.your_laundry_question_phrase:
