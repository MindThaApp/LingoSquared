course:
  title: ダリー語 A1
  description: アフガニスタンのダリー語の初級コース。名前のやりとり、出身地や仕事の伝え方、第三者の紹介、そして初対面の場面での丁寧な敬称と言葉づかいを学びます。
units:
  prs.a1.unit02.introductions:
    title: 自己紹介と知り合いになる
lessons:
  prs.a1.unit02.lesson01.name_exchange:
    title: 名前をたずねる・名乗る
  prs.a1.unit02.lesson02.origin_and_hometown:
    title: 出身地や国をたずねる
  prs.a1.unit02.lesson03.occupation:
    title: 相手の仕事をたずねる
  prs.a1.unit02.lesson04.introducing_others:
    title: 第三者を紹介する
  prs.a1.unit02.lesson05.polite_titles_and_register:
    title: 丁寧な敬称と適切な言葉づかいを使う
  prs.a1.unit02.lesson06.gathering_dialogue:
    title: 集まりで人と出会う
teaching:
  prs.a1.unit02.lesson01.teach.name_question_polite:
    title: 相手の名前を丁寧にたずねる
    gloss: お名前は何ですか。
    note: نام‌تان چیست؟ は、初対面の大人に使う敬意のある形で、ユニット1の شما/استین の丁寧な言い方に続くものです。
  prs.a1.unit02.lesson01.teach.name_answer:
    title: است を使って名前を言う
    gloss: 私の名前はファリドゥーンです。
    note: نام من ... است は、名前を述べる書き言葉の形です。会話ではふつう نامم ... است と言います(نامم = نام + -م、私の名前)。どちらも正しい表現です。
  prs.a1.unit02.lesson01.teach.i_am_name:
    title: استم を使って名前を言う
    gloss: ファリドゥーンです。
    note: استم は名前のすぐ後ろに付きます。ユニット1で学んだ、一人称のダリー語の「です」にあたる形と同じです。
  prs.a1.unit02.lesson01.teach.name_question_informal:
    title: 親しい友達の名前をたずねる
    gloss: お名前は?
    note: نامت چیست؟ は、くだけた所有を表す -ت を使います。ユニット1の تو/استی と同じように、同年代や親しい友達にだけ使いましょう。
  prs.a1.unit02.lesson01.teach.what_is_your_name_word:
    title: 「名前」を表す言葉
    gloss: 名前
    note: نام は、上の丁寧な質問とくだけた質問の両方で使われる、単独の名詞です。
    example_gloss: お名前は何ですか。
  prs.a1.unit02.lesson01.teach.register_note:
    title: 丁寧な所有形と親しい友人への所有形
    gloss: -تان は敬意を払う相手に、-ت は親しい友人に使います。
    note: 第1課の شما/تو の使い分けは、نام に付く所有の語尾にもそのまま当てはまります。
  prs.a1.unit02.lesson02.teach.where_from_polite:
    title: 出身をたずねる
    gloss: どちらのご出身ですか。
    note: شما از کجا استین؟ は、敬意を表す شما と استین の組み合わせのままです。
  prs.a1.unit02.lesson02.teach.from_kabul:
    title: カブール出身だと言う
    gloss: 私はカブール出身です。
    note: من از کابل استم は、どの都市でも使える「من از [場所] استم」(私は〜出身です)の型です。
  prs.a1.unit02.lesson02.teach.from_herat:
    title: ヘラート出身だと言う
    gloss: 私はヘラート出身です。
    note: هرات はアフガニスタン西部の大きな都市です。
  prs.a1.unit02.lesson02.teach.from_mazar:
    title: マザーリシャリーフ出身だと言う
    gloss: 私はマザーリシャリーフ出身です。
    note: مزار شریف は2語で書き、アフガニスタン北部の大きな都市です。
  prs.a1.unit02.lesson02.teach.country:
    title: アフガニスタン
    gloss: アフガニスタン
    note: افغانستان は、都市名と同じように از の後ろに置いて使います。
    example_gloss: 私はアフガニスタン出身です。
  prs.a1.unit02.lesson02.teach.city_word:
    title: 「都市」という語
    gloss: 都市
    note: شهر は都市一般を指す語で、特定の都市名とは区別されます。
    example_gloss: カブールは大きな都市です。
  prs.a1.unit02.lesson03.teach.occupation_question:
    title: 仕事を尋ねる
    gloss: お仕事は何ですか?
    note: کار شما چیست؟ は直訳すると「あなたの仕事は何ですか」で、職業を尋ねる普通の言い方です。
  prs.a1.unit02.lesson03.teach.doctor:
    title: 医者
    gloss: 医者
    note: داکتر はダリー語で一般的な職業名で、医師のほか、くだけた場面では博士号を持つ人にも使います。
    example_gloss: 彼/彼女は医師です。
  prs.a1.unit02.lesson03.teach.teacher:
    title: 先生
    gloss: 教師
    note: معلم は、学校の段階を問わず使える「教師」を表す一般的な語です。
    example_gloss: 彼/彼女は教師です。
  prs.a1.unit02.lesson03.teach.engineer:
    title: エンジニア
    gloss: エンジニア
    note: مهندس は特定の専門分野に限らず、広くエンジニア全般を指します。
    example_gloss: 彼/彼女はエンジニアです。
  prs.a1.unit02.lesson03.teach.shopkeeper:
    title: 店主
    gloss: 店員
    note: دوکاندار(دوکان=店 から)はカブールで日常的に使う語です。このコースでは、イランのペルシア語の مغازه ではなく、ダリー語の綴り دوکان を使います。
    example_gloss: 彼/彼女は店主です。
  prs.a1.unit02.lesson03.teach.i_am_teacher:
    title: 職業を言う
    gloss: 私は教師です。
    note: من [職業] استم は、この課で学ぶどの職業にも使える型です。
  prs.a1.unit02.lesson04.teach.introduce_formal:
    title: 改まって人を紹介する
    gloss: 同僚を紹介させてください。
    note: اجازه بدهین همکارم را معرفی کنم は、第三者を会話に迎え入れるときの丁寧な言い方です。
  prs.a1.unit02.lesson04.teach.this_is:
    title: 紹介する人の名前を言う
    gloss: こちらは同僚のアレズーです。
    note: این [人] است は、紹介する人をそのまま示す言い方です。
  prs.a1.unit02.lesson04.teach.pleased_after_intro:
    title: お会いできてうれしいと伝える
    gloss: はじめまして。
    note: از آشنایی با شما خوش شدم は第1課と同じ初対面のあいさつで、ここでは第三者の紹介の後にも使っています。
  prs.a1.unit02.lesson04.teach.pleased_reply:
    title: 自分もうれしいと返す
    gloss: こちらこそ、はじめまして。
    note: من هم خوش شدم は、自然な短い返事です。
  prs.a1.unit02.lesson04.teach.friend_word:
    title: 友達
    gloss: 友達
    note: دوست は、親しさの度合いを問わない「友達」を表す一般的な語です。
    example_gloss: 彼/彼女は私の友達です。
  prs.a1.unit02.lesson04.teach.colleague_word:
    title: 同僚
    gloss: 同僚
    note: همکار は仕事仲間を指し、第1課の職場の会話にもすでに出てきました。
    example_gloss: 彼/彼女は私の同僚です。
  prs.a1.unit02.lesson05.teach.title_jenab:
    title: 〜さん(男性)/ 旦那様
    gloss: 〜さん(男性)/ あなた様
    note: جناب は男性の名前や肩書きの前に付ける敬称で、アフガニスタンの都市部の日常会話でよく使われます。
    example_gloss: どうぞ、お先にどうぞ。
  prs.a1.unit02.lesson05.teach.title_khanom:
    title: 〜さん(女性)
    gloss: 〜さん(女性)
    note: خانم は女性の名前の前に付け、結婚しているかどうかに関係なく使います。
    example_gloss: 奥様、どうぞお先にどうぞ。
  prs.a1.unit02.lesson05.teach.title_with_name:
    title: 男性に丁寧に呼びかける
    gloss: ファリドゥーンさん(男性への敬称)
    note: جناب に下の名前を付けた形は一般的な丁寧な呼びかけで、必ずしも姓は必要ありません。
  prs.a1.unit02.lesson05.teach.title_with_name_female:
    title: 女性に丁寧に呼びかける
    gloss: アルズーさん
    note: خانم に下の名前を付ける使い方は、男性の جناب と同じです。
  prs.a1.unit02.lesson05.teach.register_reminder:
    title: それぞれを使う場面
    gloss: 知り合ったばかりの人には شما と استین を、تو と استی は親しい友人にだけ使います。
    note: 第1課の使い分けのルールを、紹介の場面に合わせてもう一度まとめたものです。
  prs.a1.unit02.lesson05.teach.polite_could_you:
    title: 名前をもう一度言ってほしいと丁寧に頼む
    gloss: お名前をもう一度おっしゃっていただけますか?
    note: می‌توانین نام‌تان را دوباره بگویین؟ は、気まずくならずに聞き直せる自然で丁寧な言い方です。
  prs.a1.unit02.lesson06.teach.gathering_word:
    title: 集まり / パーティー
    gloss: 集まり
    note: مهمانی は気軽な社交の集まりを指し、この課の会話の舞台です。
    example_gloss: 集まりは楽しいです。
  prs.a1.unit02.lesson06.teach.turn01:
    title: レイラが自己紹介を始める
    gloss: レイラはファリドゥーンにあいさつし、جناب と敬意を込めて呼びかけながら名前を尋ねます。
    note: レイラとファリドゥーンは初対面なので、最初から丁寧な言い方を使っています。
  prs.a1.unit02.lesson06.teach.turn02:
    title: ファリドゥーンが名前を言う
    gloss: ファリドゥーンはあいさつを返し、自分の名前を言います。
    note: سلام علیکم は第1課で学んだ丁寧なあいさつで、初対面にふさわしい言い方です。会話では、ファリドゥーンは日常の話し言葉の形 نامم فریدون است(نامم = نام من、私の名前)を使っています。
  prs.a1.unit02.lesson06.teach.turn03:
    title: レイラが出身を尋ねる
    gloss: レイラは会えてうれしいと言い、どこの出身かを尋ねます。
    note: از آشنایی با شما خوش شدم は、第1課の職場の会話と同じ表現です。
  prs.a1.unit02.lesson06.teach.turn04:
    title: ファリドゥーンが答えて同じ質問を返す
    gloss: ファリドゥーンはヘラート出身だと答え、レイラにも同じ質問をします。
    note: و شما؟ は、第1課でも見たように、同じ質問を手短に返す言い方です。
  prs.a1.unit02.lesson06.teach.turn05:
    title: レイラが答えて仕事を尋ねる
    gloss: レイラはカブール出身だと答え、ファリドゥーンの職業を尋ねます。
    note: 会話は自然に、出身地から職業の話題へ移ります。
  prs.a1.unit02.lesson06.teach.turn06:
    title: ファリドゥーンが答えて同じ質問を返す
    gloss: ファリドゥーンはエンジニアだと答え、レイラにも同じ質問をします。
    note: شما چطور؟ は、文脈から分かる質問を手短に返す言い方です。
  prs.a1.unit02.lesson06.teach.turn07:
    title: レイラが職業を言う
    gloss: レイラは教師だと言います。
    note: この課で学んだ型を使って、職業のやり取りが完結します。
  prs.a1.unit02.lesson06.teach.turn08:
    title: ファリドゥーンが第三者を紹介する
    gloss: ファリドゥーンは同僚のアルズーを紹介します。
    note: 4つ目のレッスンで学んだ改まった紹介の表現を使い、3人目が会話に加わります。
  prs.a1.unit02.lesson06.teach.turn09:
    title: レイラがアルズーを迎える
    gloss: レイラはアルズーを خانم と敬意を込めて呼び、歓迎します。
    note: خوش آمدین は第1課で学んだ歓迎の表現で、ここでは紹介されたばかりの人に向けて使っています。
  prs.a1.unit02.lesson06.teach.turn10:
    title: アルズーが答える
    gloss: アルズーはレイラにお礼を言い、お会いできてうれしいと伝えます。
    note: از دیدن شما خوشحال شدم は、「お会いできてうれしい」の自然な言い換えで、آشنایی の代わりに دیدن(会うこと、見ること)を使っています。
exercises:
  prs.a1.unit02.lesson01.exercise01.recognize_name_question:
    instruction: 相手の名前を丁寧に尋ねるのはどのフレーズですか?
    correct_option: お名前は何ですか?(丁寧)
    distractors:
    - 名前は何?(くだけた言い方)
    - お仕事は何ですか?
    - どちらのご出身ですか。
    accepted_answers:
    - value: お名前は何ですか?(丁寧)
      status: correct
    feedback: نام‌تان چیست؟ は、知り合ったばかりの人に使う敬意のある形です。
  prs.a1.unit02.lesson01.exercise02.recognize_polite_vs_informal:
    instruction: نامت چیست؟ を使うのが適切なのは…
    correct_option: 親しい友人
    distractors:
    - 知り合ったばかりの人
    - 改まった場にいる年長者
    - お店に来たお客さん
    accepted_answers:
    - value: 親しい友人
      status: correct
    feedback: نامت のくだけた語尾 -ت は、親しい友人や同年代の相手にだけ合います。第1課の تو/استی と同じルールです。
  prs.a1.unit02.lesson01.exercise03.recognize_name_question_reading:
    instruction: この質問は何を尋ねていますか。
    correct_option: お名前は何ですか。
    distractors:
    - お仕事は何ですか?
    - どちらのご出身ですか。
    - あなたは?
    accepted_answers:
    - value: お名前は何ですか。
      status: correct
    feedback: نام‌تان چیست؟ は、相手の名前を尋ねる表現です。
  prs.a1.unit02.lesson01.exercise04.match_name_forms:
    instruction: それぞれのフレーズと意味を組み合わせましょう。
    accepted_answers:
    - value:
        نام‌تان چیست؟: お名前は何ですか?(丁寧)
        نامت چیست؟: 名前は何?(くだけた言い方)
        نام: 名前
      status: correct
    feedback: نام‌تان と نامت は、意味ではなく丁寧さの度合いだけが違います。
    pairs:
    - left: نام‌تان چیست؟
      right: お名前は何ですか?(丁寧)
    - left: نامت چیست؟
      right: 名前は何?(くだけた言い方)
    - left: نام
      right: 名前
  prs.a1.unit02.lesson01.exercise05.order_name_answer:
    instruction: 単語を並べ替えて「私の名前はファリドゥーンです。」と言いましょう。
    accepted_answers:
    - value:
      - نام
      - من
      - فریدون
      - است
      status: correct
    feedback: نام من فریدون است は「名詞 + است」の型に従っています。
  prs.a1.unit02.lesson01.exercise06.translate_name_answer:
    instruction: ダリー語に訳してください:私の名前はファリドゥンです。
    accepted_answers:
    - value: نام من فریدون است
      status: correct
    - value: فریدون استم
      status: correct
    - value: من فریدون استم
      status: correct
    - value: نامم فریدون است
      status: correct
    - value: فریدون هستم
      status: correct
    - value: من فریدون هستم
      status: correct
    feedback: نام من فریدون است は「私の名前はファリドゥンです」という意味です。
  prs.a1.unit02.lesson01.exercise07.translate_own_name:
    instruction: ダリー語に訳してください:私の名前はファリドゥンです。
    accepted_answers:
    - value: نام من فریدون است
      status: correct
    - value: فریدون استم
      status: correct
    - value: من فریدون استم
      status: correct
    - value: نامم فریدون است
      status: correct
    - value: فریدون هستم
      status: correct
    - value: من فریدون هستم
      status: correct
    feedback: نام من فریدون است でも فریدون استم でも、名前を正しく言えます。どんな名前でも同じ型が使えます。
  prs.a1.unit02.lesson01.exercise08.speak_name_exchange:
    instruction: نام‌تان چیست؟ に、名前はファリドゥンだと声に出して答えてください。
    accepted_answers:
    - value: نام من فریدون است
      status: correct
    - value: فریدون استم
      status: correct
    - value: من فریدون استم
      status: correct
    - value: نامم فریدون است
      status: correct
    - value: فریدون هستم
      status: correct
    - value: من فریدون هستم
      status: correct
    feedback: どちらの型でも質問に正しく答えられます。どんな名前でも同じ型が使えます。
  prs.a1.unit02.lesson02.exercise01.recognize_origin_question:
    instruction: 出身地をたずねる表現はどれですか?
    correct_option: どちらのご出身ですか。
    distractors:
    - お仕事は何ですか?
    - お名前は何ですか。
    - お元気ですか?(丁寧)
    accepted_answers:
    - value: どちらのご出身ですか。
      status: correct
    feedback: شما از کجا استین؟ は、از(~から)と کجا(どこ)を使って出身をたずねる表現です。
  prs.a1.unit02.lesson02.exercise02.recognize_city_names:
    instruction: 次のうち、アフガニスタンの都市はどれですか?
    correct_option: هرات
    distractors:
    - افغانستان
    - شهر
    - کار
    accepted_answers:
    - value: هرات
      status: correct
    feedback: هرات は都市の名前です。افغانستان は国名で、شهر は「都市」を表す一般的な語です。
  prs.a1.unit02.lesson02.exercise03.recognize_origin_question_reading:
    instruction: この質問は何を尋ねていますか。
    correct_option: どちらのご出身ですか。
    distractors:
    - お仕事は何ですか?
    - お名前は何ですか。
    - あなたは?
    accepted_answers:
    - value: どちらのご出身ですか。
      status: correct
    feedback: شما از کجا استین؟ は「どちらのご出身ですか?」という意味です。
  prs.a1.unit02.lesson02.exercise04.match_cities:
    instruction: それぞれの場所を日本語の名前と結びつけてください。
    accepted_answers:
    - value:
        کابل: カーブル
        هرات: ヘラート
        مزار شریف: マザーリシャリーフ
        افغانستان: アフガニスタン
      status: correct
    feedback: کابل、هرات、مزار شریف は都市で、افغانستان は国です。
    pairs:
    - left: کابل
      right: カーブル
    - left: هرات
      right: ヘラート
    - left: مزار شریف
      right: マザーリシャリーフ
    - left: افغانستان
      right: アフガニスタン
  prs.a1.unit02.lesson02.exercise05.order_origin_answer:
    instruction: 単語を並べ替えて「私はカブール出身です」と言いましょう。
