course:
  title: ダリー語 A1
  description: 初級アフガン・ダリー語:1から100までの数え方、年齢のたずね方と答え方、電話番号の交換。
units:
  prs.a1.unit04.numbers:
    title: 数の数え方
lessons:
  prs.a1.unit04.lesson01.numbers_one_to_ten:
    title: 1から10まで数える
  prs.a1.unit04.lesson02.numbers_eleven_to_twenty:
    title: 11から20まで数える
  prs.a1.unit04.lesson03.tens:
    title: 100までの十の位
  prs.a1.unit04.lesson04.asking_age:
    title: 年齢をたずねる・答える
  prs.a1.unit04.lesson05.phone_numbers:
    title: 電話番号を交換する
  prs.a1.unit04.lesson06.numbers_exchange_dialogue:
    title: 友だち同士で年齢と電話番号を教え合う
teaching:
  prs.a1.unit04.lesson01.teach.one_to_three:
    title: 1、2、3
    gloss: 1, 2, 3
    note: یک، دو، سه はペルシア語系の基本的な数詞で、ダリー語でもファルシ語(イラン・ペルシア語)でも共通です。
    example_gloss:
    - 私には兄(弟)が一人います。
    - 私は本を2冊持っています。
    - 私には姉妹が3人います。
  prs.a1.unit04.lesson01.teach.four_to_six:
    title: 4、5、6
    gloss: 4, 5, 6
    note: چهار は標準的な書き方です。くだけた会話では چار と短く言う人もいますが、このコースでは標準の綴りを使います。
    example_gloss:
    - 私は本を4冊持っています。
    - 5分待ってください。
    - 彼/彼女は本を6冊持っています。
  prs.a1.unit04.lesson01.teach.seven_eight:
    title: 7、8
    gloss: 7, 8
    note: هفت، هشت は数の続きです。
    example_gloss:
    - 1週間は7日です。
    - 8時に行きます。
  prs.a1.unit04.lesson01.teach.nine_ten:
    title: 9、10
    gloss: 9, 10
    note: نه، ده で1から10までの数がそろいます。
    example_gloss:
    - クラスには9人います。
    - 私の指は10本です。
  prs.a1.unit04.lesson02.teach.eleven_thirteen:
    title: 11、12、13
    gloss: 11, 12, 13
    note: یازده، دوازده، سیزده は、一の位の数を単純に組み合わせた形ではなく、それぞれ独立した単語です。
    example_gloss:
    - 11時に授業があります。
    - 1年は12か月です。
    - 彼(彼女)は13歳です。
  prs.a1.unit04.lesson02.teach.fourteen_sixteen:
    title: 14、15、16
    gloss: 14, 15, 16
    note: چهارده، پانزده، شانزده は十代の数の続きです。
    example_gloss:
    - 14日後に行きます。
    - 彼(彼女)は本を15冊持っています。
    - 彼(彼女)は16歳です。
  prs.a1.unit04.lesson02.teach.seventeen_nineteen:
    title: 17、18、19
    gloss: 17, 18, 19
    note: هفده، هجده، نوزده で十代の数がそろいます。
    example_gloss:
    - 彼/彼女は本を17冊持っています。
    - 彼(彼女)は18歳です。
    - あと19日です。
  prs.a1.unit04.lesson02.teach.twenty:
    title: 二十
    gloss: '20'
    note: بیست は十の位の最初の数です。次のレッスンで詳しく学びます。
    example_gloss: 本を20冊持っています。
  prs.a1.unit04.lesson03.teach.twenty_thirty_forty:
    title: 20、30、40
    gloss: 20, 30, 40
    note: بیست، سی، چهل は十の位を表す単語で、それぞれ独立した形です。規則的なパターンはありません。
    example_gloss:
    - 20歳です。
    - 今月は30日あります。
    - 彼(彼女)は40歳です。
  prs.a1.unit04.lesson03.teach.fifty_sixty:
    title: 50、60
    gloss: 50, 60
    note: پنجاه، شصت は十の位の続きです。
    example_gloss:
    - 彼/彼女は本を50冊持っています。
    - 60分は1時間です。
  prs.a1.unit04.lesson03.teach.seventy_eighty:
    title: 70、80
    gloss: 70, 80
    note: هفتاد، هشتاد は十の位の続きです。
    example_gloss:
    - この本は70ページあります。
    - 彼(彼女)は本を80冊持っています。
  prs.a1.unit04.lesson03.teach.ninety_hundred:
    title: 90、100
    gloss: 90, 100
    note: نود، صد で100までの数がそろいます。
    example_gloss:
    - 彼(彼女)は90歳です。
    - 彼/彼女は本を100冊持っています。
  prs.a1.unit04.lesson03.teach.combining_tens:
    title: 十の位と一の位を組み合わせる
    gloss: 25は直訳すると「20と5」です。
    note: 十の位の語と一の位の語は و(〜と)でつなぎます。このコースの他の場面でも使われているつなぎ言葉です。例:بیست و پنج(25)
  prs.a1.unit04.lesson04.teach.chand:
    title: いくつ/どのくらい
    gloss: いくつ/どのくらい
    note: چند は、年齢を含め、数や量をたずねる疑問文を作ります。
    example_gloss: おいくつですか?
  prs.a1.unit04.lesson04.teach.sal_word:
    title: 年
    gloss: 年
    note: سال は年齢を言うときに使います。直訳は「年」です。
    example_gloss: 20歳です。
  prs.a1.unit04.lesson04.teach.age_question_polite:
    title: 丁寧に年齢をたずねる
    gloss: おいくつですか?
    note: چند ساله استین؟ は直訳すると「何年(何歳)でいらっしゃいますか」です。あまり親しくない相手には、敬意のこもった استین の形を使います。
  prs.a1.unit04.lesson04.teach.age_question_informal:
    title: 親しい友だちに年齢をたずねる
    gloss: おいくつですか?
    note: چند ساله استی؟ はくだけた استی を使った言い方です。親しい友だちや同年代の相手にだけ使いましょう。このコースでこれまで学んだ使い分けと同じです。
  prs.a1.unit04.lesson04.teach.age_answer:
    title: 自分の年齢を言う
    gloss: 25歳です。
    note: بیست و پنج ساله استم は、数、ساله(〜歳)、استم(〜です)を組み合わせた形です。
  prs.a1.unit04.lesson05.teach.number_word:
    title: 番号
    gloss: 番号
    note: نمبر は、アフガニスタンで日常的によく使われる言葉で、「番号」、特に電話番号を指します。
    example_gloss: これは私の電話番号です。
  prs.a1.unit04.lesson05.teach.telephone_word:
    title: 電話
    gloss: 電話
    note: تلفن は「電話」を表す標準的な言葉です。
    example_gloss: 私の電話は壊れています。
  prs.a1.unit04.lesson05.teach.phone_question:
    title: 電話番号をたずねる
    gloss: 電話番号は何番ですか?
    note: نمبر تلفن‌تان چند است؟ は、年齢をたずねるときと同じ چند の形を電話番号に使った文です。
  prs.a1.unit04.lesson05.teach.zero_word:
    title: ゼロ
    gloss: ゼロ
    note: アフガニスタンの電話番号の多くは、読み上げるときに صفر(ゼロ)が必要です。
    example_gloss: ゼロは数です。
  prs.a1.unit04.lesson05.teach.phone_answer:
    title: 自分の電話番号を伝える
    gloss: 私の電話番号は079-345-678です。
    note: アフガニスタンの電話番号は、ここで示したように、1桁ずつではなく短いまとまりに区切って読むのが一般的です。
  prs.a1.unit04.lesson06.teach.turn01:
    title: フマユンがバシールにあいさつする
    gloss: フマユンは、親しい友だちにふさわしいくだけた言い方で、バシールに調子をたずねます。
    note: جور استی؟ から、この2人がすでに親しい友だちだとわかります。そのため、この会話ではずっとくだけた言い方が使われます。
  prs.a1.unit04.lesson06.teach.turn02:
    title: バシールが答え、フマユンの年齢をたずねる
    gloss: バシールは元気だと答え、フマユンの年齢をたずねます。
    note: چند ساله استی؟ は、2人の親しい関係に合わせたくだけた言い方です。
  prs.a1.unit04.lesson06.teach.turn03:
    title: フマユンが答え、同じ質問を返す
    gloss: フマユンは28歳だと答え、バシールにも同じことをたずねます。
    note: 以前のレッスンで学んだ年齢の答え方が、そのまま使われています。
  prs.a1.unit04.lesson06.teach.turn04:
    title: バシールが答える
    gloss: バシールは26歳だと答えます。
    note: これで年齢のやりとりが完成します。
  prs.a1.unit04.lesson06.teach.turn05:
    title: フマユンがバシールに電話番号をたずねる
    gloss: フマユンはバシールの電話番号をたずねます。
    note: تلفنت は、くだけた言い方の「〜の」を表す語尾を使っています。この会話の他の部分と同じ調子です。
  prs.a1.unit04.lesson06.teach.turn06:
    title: バシールが電話番号を伝える
    gloss: バシールは電話番号をまとまりごとに区切って読み上げます。
    note: 番号は、前のレッスンの例と同じように、自然なまとまりに区切って読み上げます。
  prs.a1.unit04.lesson06.teach.turn07:
    title: フマユンが登録したことを伝える
    gloss: フマユンはお礼を言って、今すぐ登録すると言います。
    note: سیف می‌کنم は「保存する」という意味の外来語で、スマートフォンなどの話題でよく使われるくだけた言い方です。友だち同士の気軽なやりとりにふさわしい表現です。
