teaching:
  prs.a1.unit13.lesson01.teach.plan_word:
    title: 予定
    gloss: 予定
    note: پلان は「計画、予定」という意味です。
    example_gloss: 私は予定があります。
  prs.a1.unit13.lesson01.teach.park_word:
    title: 公園
    gloss: 公園
    note: پارک は「公園」という意味です。
    example_gloss: 私は公園へ行きます。
  prs.a1.unit13.lesson01.teach.berawim_word:
    title: 行きましょう
    gloss: 行こう
    note: برویم(行きましょう)は、提案に使う接続法の「私たちが行く」の形です。
    example_gloss: 公園へ行きましょう。
  prs.a1.unit13.lesson01.teach.chetor_ast_word:
    title: どうですか?
    gloss: どうですか?
    note: چطور است؟ では、省略形ではなく完全な形の است を使います。このコースの丁寧な話し方に合わせています。
  prs.a1.unit13.lesson02.teach.mikhahid_word:
    title: 〜したいですか(丁寧)
    gloss: 〜したいですか(丁寧)
    note: می‌خواهین(〜したいですか、丁寧)は、誘いや提案の質問の始まりに使います。
    example_gloss: 公園へ行きたいですか?
  prs.a1.unit13.lesson02.teach.jomeh_review:
    title: 金曜日(復習)
    gloss: 金曜日
    note: جمعه は、ユニット9で学んだ曜日の復習です。
    example_gloss: 金曜日に公園へ行きましょうか?
  prs.a1.unit13.lesson02.teach.propose_phrase:
    title: 金曜日に公園へ行きませんか?
    gloss: 金曜日に公園へ行きませんか?
    note: می‌خواهین جمعه برویم پارک؟ は、このレッスンの言葉を組み合わせた、完全な誘いの文です。
  prs.a1.unit13.lesson03.teach.khoob_ast_word:
    title: 大丈夫
    gloss: 大丈夫
    note: خوب است は「いいですよ、大丈夫です」という意味です。
    example_gloss: 金曜日で大丈夫です。
  prs.a1.unit13.lesson03.teach.aali_ast_word:
    title: いいですね
    gloss: いいですね
    note: عالی است は「すばらしい、最高です」という意味です。
    example_gloss: 公園は最高です。
  prs.a1.unit13.lesson03.teach.qabool_ast_word:
    title: 決まり
    gloss: 決まり/了解
    note: قبول است は「承知しました、決まりです」という意味です。
    example_gloss: 決まりですね。金曜日に公園へ行きましょう。
  prs.a1.unit13.lesson03.teach.aali_o_qabool:
    title: すばらしい、それで決まりです
    gloss: すばらしい、それで決まりです!
    note: '*و*(そして)は、短い2つの文をつなぎます。例:*عالی است و قبول است*。'
  prs.a1.unit13.lesson04.teach.motasef_astam_word:
    title: ごめんなさい
    gloss: ごめんなさい
    note: متأسف استم は「すみません、申し訳ありません」という意味で、これまでに学んだ استم を使います。
    example_gloss: すみません、用事があります。
  prs.a1.unit13.lesson04.teach.nemitawanam_word:
    title: できません
