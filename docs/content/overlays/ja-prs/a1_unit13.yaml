    example_gloss: すみません、できません。
  prs.a1.unit13.lesson04.teach.kar_daram_word:
    title: 用事があります
    gloss: 用事があります
    note: کار دارم は直訳すると「仕事・用事があります」で、丁寧に断るときによく使う口実です。
  prs.a1.unit13.lesson05.teach.dawat_word:
    title: 招き入れる
    gloss: 招待
    note: دعوت は「招待」という意味です。
    example_gloss: お誘いはうれしいです。
  prs.a1.unit13.lesson05.teach.saat_panj_review:
    title: 午後5時
    gloss: 午後5時
    note: ساعت پنج بعد از ظهر は、ユニット11の時刻の言い方に بعد از ظهر(午後)を組み合わせたものです。
  prs.a1.unit13.lesson05.teach.montazer_astam_word:
    title: 待っています
    gloss: 待っています
    note: منتظر استم は「待っています」という意味で、これまでに学んだ استم を使います。
    example_gloss: 金曜日にお待ちしています。
  prs.a1.unit13.lesson05.teach.invitation_message:
    title: 招待メッセージの例
    gloss: こんにちは!金曜日の午後5時に公園へ行きませんか?お待ちしています。
    note: メッセージで届くような、短い招待の文章です。
  prs.a1.unit13.lesson05.teach.shoma_ra_mibinam_word:
    title: 会いましょう
    gloss: 会いましょう
    note: شما را می‌بینم(お会いしましょう、丁寧)は、約束を確認して会話を締めくくるときによく使う言い方です。
    example_gloss: 金曜日にお会いしましょう。
  prs.a1.unit13.lesson06.teach.names:
    title: ファリードとネガール
    gloss: ファリード、ネガール
    note: فرید と نگار は、このレッスンの会話の2人の話し手です。
    example_gloss:
    - 私はファリードです。
    - 私はネガールです。
  prs.a1.unit13.lesson06.teach.che_saat_word:
    title: 何時ですか?
    gloss: 何時ですか?
    note: چه ساعت؟ は、具体的な時間をたずねる自然な言い方です。
  prs.a1.unit13.lesson06.teach.dialogue_line1:
    title: ネガールさん、金曜日に公園へ行きませんか?
    gloss: ネガールさん、金曜日に公園へ行きませんか?
    note: ファリードが計画を提案して話を始めます。
  prs.a1.unit13.lesson06.teach.dialogue_line2:
    title: 何時ですか?
    gloss: 何時ですか?
    note: ネガールは、決める前に具体的な時間をたずねます。
  prs.a1.unit13.lesson06.teach.dialogue_line3:
    title: 午後5時です。
    gloss: 午後5時です。
    note: ファリードが時間を伝えます。
  prs.a1.unit13.lesson06.teach.dialogue_line4:
    title: いいね、すてき!決まりだね。
    gloss: いいね、すてき!決まりだね。
    note: ネガールは喜んで承諾します。
  prs.a1.unit13.lesson06.teach.dialogue_line5:
    title: よかった、金曜日にお会いしましょう。
    gloss: よかった、金曜日にお会いしましょう。
    note: ファリードは確認して会話を締めくくります。丁寧な شما را می‌بینم を使っています。
