course:
  title: ダリー語 A1
  description: カブール方言のダリー語・初級:薬剤師に基本的な薬を頼む、簡単な症状(頭痛、腹痛、歯痛)を伝える、錠剤やシロップを頼む、基本的な服用の指示を理解する。
units:
  prs.a1.unit46.pharmacy:
    title: 薬局と薬
    description: 薬剤師に基本的な薬を頼み、簡単な症状を伝え、錠剤やシロップを頼み、基本的な服用の指示を理解します。
lessons:
  prs.a1.unit46.lesson01.pharmacy_and_pharmacist_vocabulary:
    title: 薬局と薬剤師
  prs.a1.unit46.lesson02.symptom_vocabulary:
    title: 頭痛、腹痛、歯痛
  prs.a1.unit46.lesson03.medicine_forms:
    title: 錠剤とシロップ
  prs.a1.unit46.lesson04.pharmacy_dialogue:
    title: 薬局での会話
  prs.a1.unit46.lesson05.reading:
    title: 処方箋を読む
  prs.a1.unit46.lesson06.wrap_up:
    title: まとめ
teaching:
  prs.a1.unit46.lesson01.teach.review_this_is_in:
    title: 復習:これ、です、〜に
    gloss: これ / です / 〜に
    note: این、است、در(このコース全体で使います)は、薬局について話すための復習の語です。
    target_text: این (これ) / است (です) / در (〜に・〜で)
  prs.a1.unit46.lesson01.teach.pharmacy_word:
    title: 薬局
    gloss: 薬局
    note: دواخانه は直訳すると「薬の家」で、کتابخانه(「本の家」、図書館、ユニット43)と同じ作りです。
    example_gloss: ここは薬局です。
  prs.a1.unit46.lesson01.teach.this_is_pharmacy_phrase:
    title: ここは薬局です
    gloss: ここは薬局です。
    note: این دواخانه است は、このレッスンで学んだ語を組み合わせた文です。
  prs.a1.unit46.lesson01.teach.pharmacist_word:
    title: 薬剤師
    gloss: 薬剤師
    note: دواساز は直訳すると「薬を作る人」です。
    example_gloss: 薬剤師は薬局にいます。
  prs.a1.unit46.lesson01.teach.pharmacist_in_pharmacy_phrase:
    title: 薬剤師は薬局にいます
    gloss: 薬剤師は薬局にいます。
    note: دواساز در دواخانه است は、دواساز(薬剤師)と دواخانه(薬局)を組み合わせた文です。
  prs.a1.unit46.lesson01.teach.review_medicine_want:
    title: 復習:薬、ほしいです
    gloss: 薬/私はほしいです
    note: دوا と می‌خواهم は、薬を頼むための復習の語です。
    target_text: دوا (薬) / می‌خواهم (ほしいです)
  prs.a1.unit46.lesson01.teach.want_medicine_phrase:
    title: 薬がほしいです
    gloss: 薬がほしいです。
    note: دوا می‌خواهم は、دوا(薬)と می‌خواهم(ほしいです)を組み合わせた文です。
  prs.a1.unit46.lesson02.teach.review_headache_stomachache_have:
    title: 復習:頭痛、腹痛、私は持っています、あなたは持っています
    gloss: 頭痛 / 腹痛 / あります(私) / お持ちです(丁寧)
    note: سردرد、دل‌درد、دارم、دارین は、症状を伝えるための復習の語です。
    target_text: سردرد (頭痛) / دل‌درد (腹痛) / دارم (あります・私は持っています) / دارین (お持ちです、丁寧)
  prs.a1.unit46.lesson02.teach.review_very_yes_no:
    title: 復習:とても、はい、いいえ
    gloss: とても / はい / いいえ
    note: بسیار、بلی、نخیر(前のユニットで学習済み)は、症状についての質問に答えるための復習の語です。
    target_text: بسیار (とても) / بلی (はい) / نخیر (いいえ)
  prs.a1.unit46.lesson02.teach.toothache_word:
    title: 歯痛
    gloss: 歯痛
    note: دندان‌درد は、دندان(歯、ユニット42)に、سردرد や دل‌درد と同じ -درد(「痛み」)を付けた形です。
    example_gloss: 歯が痛いです。
  prs.a1.unit46.lesson02.teach.severe_toothache_phrase:
    title: 歯がとても痛いです
    gloss: 歯がとても痛いです。
    note: بسیار دندان‌درد دارم は、بسیار(とても)で症状の強さを表しています。
  prs.a1.unit46.lesson02.teach.do_you_have_headache_phrase:
    title: 頭が痛いですか。
    gloss: 頭が痛いですか。
    note: سردرد دارین؟ は疑問詞を使わず、語尾を上げて言うはい・いいえ疑問文です。
  prs.a1.unit46.lesson02.teach.no_toothache_phrase:
    title: いいえ、歯が痛いです
    gloss: いいえ、歯が痛いです。
    note: نخیر は直前の質問に答える言葉で、そのあとに実際の症状を述べています。
  prs.a1.unit46.lesson03.teach.review_want_one:
    title: 復習:〜がほしい、ひとつの
    gloss: 〜がほしいです/ひとつの/一
    note: می‌خواهم と یک は前の課で学んだ復習の単語で、薬の種類を頼むときに使います。
    target_text: می‌خواهم (ほしいです) / یک (1つの)
  prs.a1.unit46.lesson03.teach.tablet_word:
    title: 錠剤
    gloss: 錠剤
    note: قرص は錠剤を指す、ふだんよく使うダリー語です。
    example_gloss: 錠剤を1錠ほしいです。
  prs.a1.unit46.lesson03.teach.want_tablet_phrase:
    title: 錠剤がほしいです
    gloss: 錠剤を1錠ほしいです。
    note: یک قرص می‌خواهم は یک(ひとつ)と قرص(錠剤)を組み合わせた表現です。
  prs.a1.unit46.lesson03.teach.syrup_word:
    title: シロップ
    gloss: シロップ
    note: شربت は液体の薬やシロップを指す、ふだんよく使うダリー語です。
    example_gloss: シロップがほしいです。
  prs.a1.unit46.lesson03.teach.want_syrup_phrase:
    title: シロップがほしいです
    gloss: シロップがほしいです。
    note: شربت می‌خواهم は شربت(シロップ)と می‌خواهم(ほしいです)を組み合わせた表現です。
  prs.a1.unit46.lesson03.teach.review_which_medicine_want_polite:
    title: 復習:どの、薬、ほしいですか(丁寧)
    gloss: どの/薬/ほしいですか(丁寧)
    note: کدام、دوا、می‌خواهین は復習の単語で、お客さんに何がほしいかをたずねるときに使います。
    target_text: کدام (どの) / دوا (薬) / می‌خواهین (ほしいですか、丁寧)
  prs.a1.unit46.lesson03.teach.which_medicine_phrase:
    title: どの薬がほしいですか。
    gloss: どの薬がほしいですか。
    note: کدام دوا می‌خواهین؟ は薬剤師がたずねる丁寧な質問です。
  prs.a1.unit46.lesson04.teach.review_hello_stomachache_have:
    title: 復習:こんにちは、腹痛、あります
    gloss: こんにちは/腹痛/あります(私は)
    note: سلام、دل‌درد、دارم は前の課で学んだ復習の単語で、会話の最初に使います。
    target_text: سلام (こんにちは) / دل‌درد (腹痛) / دارم (あります・私は持っています)
  prs.a1.unit46.lesson04.teach.review_medicine_want_polite_yes:
    title: 復習:薬、ほしいですか(丁寧)、はい
    gloss: 薬/ほしいですか(丁寧)/はい
    note: دوا、می‌خواهین、بلی は前の課で学んだ復習の単語で、薬剤師の質問の中で使います。
    target_text: دوا (薬) / می‌خواهین (ほしいですか、丁寧) / بلی (はい)
  prs.a1.unit46.lesson04.teach.review_this_tablet_good_is:
    title: 復習:この、錠剤、よい、です
    gloss: この/錠剤/よい/です
    note: این、قرص、خوب、است は前の課とこの課で学んだ復習の単語で、薬を説明するときに使います。
    target_text: این (これ) / قرص (錠剤) / خوب (よい) / است (です)
  prs.a1.unit46.lesson04.teach.piece_word:
    title: 個
    gloss: 個・錠(1回分)
    note: دانه は個数や一回分を数える助数詞で、錠剤を数えるときに使います。
    example_gloss: 三個です。
  prs.a1.unit46.lesson04.teach.take_word:
    title: 飲む・取る
    gloss: 飲んでください(丁寧)
    note: بگیرین は「取る・飲む」という丁寧な命令形で、この教材のほかの課に出てくる کنین/بنوشین と同じ -ین の仲間です。
    example_gloss: 1日3錠飲んでください。
  prs.a1.unit46.lesson04.teach.review_day_three_thanks_welcome:
    title: 復習:日、三、どうもありがとう、どういたしまして
    gloss: 日/三/どうもありがとう/どういたしまして
    note: روز、سه、تشکر زیاد、خواهش می‌کنم は前の課で学んだ復習の単語で、会話の締めくくりに使います。
    target_text: روز (日) / سه (3) / تشکر زیاد (どうもありがとう) / خواهش می‌کنم (どういたしまして)
  prs.a1.unit46.lesson04.teach.dialogue_line1:
    title: ホマユーン:こんにちは。お腹が痛いです。
    gloss: こんにちは。お腹が痛いです。
  prs.a1.unit46.lesson04.teach.dialogue_line2:
    title: 薬剤師:こんにちは。薬がほしいですか?
    gloss: こんにちは。薬がほしいですか。
  prs.a1.unit46.lesson04.teach.dialogue_line3:
    title: ホマユーン:はい、錠剤がほしいです。
    gloss: はい、錠剤を1錠ほしいです。
  prs.a1.unit46.lesson04.teach.dialogue_line4:
    title: 薬剤師:この錠剤はよく効きます。一日三錠飲んでください。
    gloss: この錠剤はよく効きます。1日3錠飲んでください。
  prs.a1.unit46.lesson04.teach.dialogue_line5:
    title: ホマユーン:どうもありがとうございます。
    gloss: どうもありがとうございます。
  prs.a1.unit46.lesson04.teach.dialogue_line6:
    title: 薬剤師:どういたしまして。
    gloss: どういたしまして。
  prs.a1.unit46.lesson05.teach.review_this_is_from:
    title: 復習:この、です、ホマユーン、〜の
    gloss: この/です/ホマユーン/〜の(〜から)
    note: این、است、همایون は読解文で使う復習の単語です。از(前の課では主に「〜から」)は、ここでは است と一緒に使って持ち主を表します。این نسخه از همایون است は直訳すると「この処方箋はホマユーンからです」ですが、実際は「これはホマユーンの処方箋です」という意味で、این کتاب از من است(この本は私のものです)と同じ型です。
    target_text: این (これ) / است (です) / همایون / از (〜の・〜から)
  prs.a1.unit46.lesson05.teach.review_one_tablet_day_three_piece_take:
    title: 復習:ひとつ、錠剤、日、三、個、取る
    gloss: 一/錠剤/日/三/個/取る
    note: یک、قرص、روز、سه、دانه、بگیرین はこの課で学んだ復習の単語で、読解文で使います。
    target_text: یک (1) / قرص (錠剤) / روز (日) / سه (3) / دانه (個・錠) / بگیرین (飲んでください・取ってください)
  prs.a1.unit46.lesson05.teach.prescription_word:
    title: 処方箋
    gloss: 処方箋
    note: نسخه は処方箋や薬のラベルを指す、ふだんよく使うダリー語です。
    example_gloss: これは処方箋です。
  prs.a1.unit46.lesson05.teach.reading_passage:
    title: 処方箋を読む
    gloss: これはホマユーンの処方箋です。錠剤が一種類です。一日三錠飲んでください。
  prs.a1.unit46.lesson06.teach.review_but_formal_you_how_many:
    title: 復習:でも、あなた(敬称)、いくつ
    gloss: でも/あなた(敬称)/いくつ
    note: اما、شما、چند は前の課で学んだ復習の単語で、服用の予定を述べるときに使います。
    target_text: اما (しかし) / شما (あなた、丁寧) / چند (いくつ)
  prs.a1.unit46.lesson06.teach.review_morning_night_two_three_piece_is_prescription:
    title: 復習:朝、夜、二、三、個、です、あなたの処方箋
    gloss: 朝/夜/二/三/個/です/あなたの処方箋
    note: صبح、شب、دو、سه、دانه、است(前の課とこの課で学習)、نسخه‌تان(あなたの処方箋。この教材のほかの課に出てくる نام‌تان/تلفن‌تان と同じ -تان を使います)は、この単元の締めくくりに使う復習の単語です。
    target_text: صبح (朝) / شب (夜) / دو (2) / سه (3) / دانه (個・錠) / است (です) / نسخه‌تان (あなたの処方箋)
  prs.a1.unit46.lesson06.teach.morning_night_contrast_phrase:
    title: 朝は二錠で、夜は三錠です
    gloss: 朝は2錠ですが、夜は3錠です。
    note: اما は朝の量と夜の量を対比させています。
  prs.a1.unit46.lesson06.teach.your_prescription_question_phrase:
    title: 処方箋は何錠ですか。
    gloss: 処方箋は何錠ですか。
    note: شما に合わせて -تان を付けた丁寧な形で、処方箋の服用量をたずねています。
