course:
  title: ダリー語 A1
  description: カーブルのダリー語・初級：天気の語彙、今日の天気の尋ね方と答え方、気温の言葉、明日の予報、そして雨で予定が変わるザルミナとフマユーンの会話。
units:
  prs.a1.unit22.weather:
    title: 天気
    description: 今の天気の状態を述べ、天気に合わせた簡単な予定を立てる。
