    title: ホマユーンが尋ねる
    gloss: ザルミナ、明日の天気はどうなる？
    note: همایون(ホマユーン)と زرمینه(ザルミナ)は、このコースに繰り返し登場する人物です。
  prs.a1.unit22.lesson05.teach.turn02:
    title: ザルミナが答える
    gloss: 明日は雨が降ります。
  prs.a1.unit22.lesson05.teach.turn03:
    title: ホマユーンの反応
    gloss: 雨？それなら公園には行けないね。
    note: نمی‌توانیم(私たちはできない)と برویم(私たちが行く)がここで出てきます。
  prs.a1.unit22.lesson05.teach.turn04:
    title: ザルミナが賛成する
    gloss: うん、家にいたほうがいいね。
  prs.a1.unit22.lesson05.teach.turn05:
    title: ホマユーンが提案する
    gloss: いいね、映画を見よう。
    note: فلم(映画)と می‌بینیم(私たちは見る)がここで出てきます。
