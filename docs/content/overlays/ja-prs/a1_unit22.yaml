    title: 降る/雨が降っている
    gloss: 降る
    note: می‌بارد は雨や雪が「降る」ときに使います。
    example_gloss: 今日は雨が降っています。
  prs.a1.unit22.lesson03.teach.garm:
    title: 暑い
    gloss: 暑い
    note: گرم は「暑い」の意味です。
