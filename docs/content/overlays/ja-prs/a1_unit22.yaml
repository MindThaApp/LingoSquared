    title: 彼らは残る
    gloss: 彼らは残る
    note: می‌مانند は「とどまる」の三人称複数の形です。
    example_gloss: ザルミナとホマユーンは家にいます。
  prs.a1.unit22.lesson06.teach.summary_text:
    title: 天気のまとめ
    gloss: 今日は晴れていて暑いです。でも明日は雨が降って、寒くなります。ザルミナとホマユーンは家にいます。
