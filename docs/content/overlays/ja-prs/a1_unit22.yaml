  prs.a1.unit22.lesson01.teach.baran:
    title: 雨
    gloss: 雨
    note: باران は「雨」の意味です。
    example_gloss: 雨が降っています。
  prs.a1.unit22.lesson01.teach.review_ast:
    title: ~です
    gloss: ~です
    note: است(~です)はすでに学んだ言葉です。
    example_gloss: 天気は晴れです。
  prs.a1.unit22.lesson01.teach.review_emroz:
    title: 今日
    gloss: 今日
    note: امروز(今日)はすでに学んだ言葉です。
    example_gloss: 今日は曇りです。
  prs.a1.unit22.lesson02.teach.barf:
    title: 雪
    gloss: 雪
    note: برف は「雪」の意味です。
    example_gloss: 雪が降っています。
  prs.a1.unit22.lesson02.teach.chetor:
    title: どう
    gloss: どんな
    note: چطور は「どう」の意味です。
    example_gloss: 今日の天気はどうですか？
  prs.a1.unit22.lesson02.teach.hawa_chetor_ast:
    title: 今日の天気はどうですか？
    gloss: 今日の天気はどうですか？
    note: امروز هوا چطور است؟ は、今日の天気を尋ねるときの決まった言い方です。
