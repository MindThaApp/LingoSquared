  prs.a1.unit22.lesson05.teach.review_homayoun:
    title: ホマユーン
    gloss: ホマユーン
    note: همایون(ホマユーン)は、このコースに繰り返し登場する人物です。
    example_gloss: ホマユーンは家にいます。
