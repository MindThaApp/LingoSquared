    title: まとめの読解
teaching:
  prs.a1.unit22.lesson01.teach.hawa:
    title: 天気
    gloss: 天気
    note: هوا は「天気」の意味です(「空気」の意味もあります)。
    example_gloss: 今日は天気がいいです。
  prs.a1.unit22.lesson01.teach.aftabi:
    title: 晴れ
    gloss: 晴れ
    note: آفتابی は「晴れ」の意味です。
