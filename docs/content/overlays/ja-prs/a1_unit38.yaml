course:
  title: ダリー語 A1
  description: カブール・ダリー語の初級:身の回りの物の色を言い表す、物が何色か尋ねる、好きな色を伝えたり尋ねたりする、短い文章で人の家を説明する。
units:
  prs.a1.unit38.colors:
    title: 色
    description: 身の回りの物の色を言い表しましょう。
lessons:
  prs.a1.unit38.lesson01.primary_colors:
    title: 基本の色
  prs.a1.unit38.lesson02.more_colors:
    title: そのほかの色
  prs.a1.unit38.lesson03.asking_about_colors:
    title: 色を尋ねる
  prs.a1.unit38.lesson04.colors_dialogue:
    title: 色の会話
  prs.a1.unit38.lesson05.colors_reading:
    title: 色についての読み物
  prs.a1.unit38.lesson06.wrap_up:
    title: まとめ
teaching:
  prs.a1.unit38.lesson01.teach.review_basics:
    title: 復習:色、です、黒、白、赤
    gloss: 色 / です / 黒 / 白 / 赤
    note: رنگ、است、سیاه、سفید、سرخ は、このユニット全体で使う復習の単語です。
    target_text: رنگ(色)/ است(です)/ سیاه(黒)/ سفید(白)/ سرخ(赤)
  prs.a1.unit38.lesson01.teach.review_objects:
    title: 復習:これ、シャツ、車、本、私、と、でも
    gloss: これ / シャツ / 車 / 本 / 私 / と / でも
    note: این、پیراهن、موتر、کتاب、من、و、اما は、このユニットの色の文を作るための復習の単語です。
    target_text: این(これ・この)/ پیراهن(シャツ)/ موتر(車)/ کتاب(本)/ من(私)/ و(と・そして)/ اما(でも・しかし)
  prs.a1.unit38.lesson01.teach.abi_word:
    title: 青い
    gloss: 青い
    note: آبی は「青」を表す標準的なダリー語です。
    example_gloss: 車は青です。
  prs.a1.unit38.lesson01.teach.zard_word:
    title: 黄色
    gloss: 黄色
    note: زرد は「黄色」という意味です。
    example_gloss: このシャツは黄色です。
  prs.a1.unit38.lesson01.teach.sabz_word:
    title: 緑
    gloss: 緑の
    note: سبز は「緑」という意味です。
    example_gloss: 本は緑色です。
  prs.a1.unit38.lesson01.teach.narenji_word:
    title: オレンジ色
    gloss: オレンジ色
    note: نارنجی は「オレンジ色」という意味です。
    example_gloss: このシャツはオレンジ色です。
  prs.a1.unit38.lesson01.teach.blue_and_white_phrase:
    title: 私のシャツは青と白です
    gloss: 私のシャツは青と白です。
    note: و は二つの色を一つの文につなげます。
  prs.a1.unit38.lesson01.teach.black_but_orange_phrase:
    title: 車は黒ですが、シャツはオレンジ色です
    gloss: 車は黒ですが、シャツはオレンジ色です。
    note: اما は、二つの異なる物の色を一つの文の中で対比させます。
  prs.a1.unit38.lesson02.teach.review_house:
    title: 復習:家
    gloss: 家
    note: خانه は、このレッスンの色の文に使う復習の単語です。
    target_text: خانه(家)
  prs.a1.unit38.lesson02.teach.khakestari_word:
    title: 灰色
    gloss: 灰色
    note: خاکستری は「灰色」という意味です。
    example_gloss: 車は灰色です。
  prs.a1.unit38.lesson02.teach.banafsh_word:
    title: 紫色
    gloss: 紫色
    note: بنفش は「紫」という意味です。
    example_gloss: このシャツは紫です。
  prs.a1.unit38.lesson02.teach.qahwei_word:
    title: 茶色
    gloss: 茶色の
    note: قهوه‌یی は قهوه(コーヒー)に由来し、「コーヒー色」、つまり「茶色」を表す標準的なダリー語です。
    example_gloss: 家は茶色です。
  prs.a1.unit38.lesson02.teach.gray_and_brown_phrase:
    title: 家は灰色と茶色です
    gloss: 家は灰色と茶色です。
    note: و を使って、同じ物の二つの色を並べています。
  prs.a1.unit38.lesson02.teach.purple_but_blue_phrase:
    title: シャツは紫ですが、本は青です
    gloss: シャツは紫ですが、本は青です。
    note: اما は、二つの異なる物の色を対比させます。
  prs.a1.unit38.lesson03.teach.review_what_which:
    title: 復習:何、どの
    gloss: 何 / どの
    note: چه と کدام は、色について尋ねるときに使う復習の語です。
    target_text: چه(何)/ کدام(どの)
  prs.a1.unit38.lesson03.teach.what_color_question_phrase:
    title: この本は何色ですか
    gloss: この本は何色ですか。
    note: این کتاب چه رنگ است؟ は直訳すると「この本は何の色ですか」で、物の色を尋ねる自然な言い方です。
  prs.a1.unit38.lesson03.teach.review_like_formal:
    title: 復習:好きです(丁寧)、目的語を示す語
    gloss: 好きです(丁寧)/ 目的語を示す語
    note: دوست دارین と را は、好きな色を尋ねるときに使う復習の形です。
    target_text: دوست دارین(好きです・丁寧)/ را(目的語を示す語)
  prs.a1.unit38.lesson03.teach.which_color_like_question_phrase:
    title: どの色が好きですか
    gloss: どの色が好きですか。
    note: کدام رنگ را دوست دارین؟ は直訳すると「どの色を[目的語を示す語]好きですか」です。
  prs.a1.unit38.lesson03.teach.i_like_green_phrase:
    title: 私は緑色が好きです
    gloss: 私は緑色が好きです。
    note: دوست دارم は、دوست داشتن(好きである)の一人称(私)の形です。
  prs.a1.unit38.lesson04.teach.review_dialogue_words:
    title: 復習:あなた(丁寧)
    gloss: あなた（丁寧）
    note: شما は、色の会話で使う復習の単語です。
    target_text: شما(あなた・丁寧)
  prs.a1.unit38.lesson04.teach.dialogue_line1:
    title: ホマユン:ザルミナさん、あなたの車は何色ですか。
    gloss: ザルミナさん、あなたの車は何色ですか。
  prs.a1.unit38.lesson04.teach.dialogue_line2:
    title: ザルミナ:私の車は青です。
    gloss: 私の車は青です。
  prs.a1.unit38.lesson04.teach.dialogue_line3:
    title: ホマユン:あなたのシャツは何色ですか。
    gloss: あなたのシャツは何色ですか。
  prs.a1.unit38.lesson04.teach.dialogue_line4:
    title: ザルミナ:私のシャツは緑と白です。
    gloss: 私のシャツは緑と白です。
  prs.a1.unit38.lesson04.teach.dialogue_line5:
    title: ホマユン:どの色が好きですか。
    gloss: どの色が好きですか。
  prs.a1.unit38.lesson04.teach.dialogue_line6:
    title: ザルミナ:私は青色が好きです。
    gloss: 青色が好きです。
  prs.a1.unit38.lesson05.teach.review_reading_words:
    title: 復習:彼・彼女、部屋、テーブル、彼/彼女は好きです
    gloss: 彼・彼女 / 部屋 / テーブル / 彼/彼女は好きです
    note: او、اتاق、میز は復習の単語です。دوست دارد は دوست داشتن(好きである)の三人称の形で、このコースでこれまでにほかの人称でも使いました。
    target_text: او(彼・彼女)/ اتاق(部屋)/ میز(テーブル)/ دوست دارد(彼/彼女は好きです)
  prs.a1.unit38.lesson05.teach.reading_passage:
    title: ザルミナさんの家についての読み物
    gloss: これはザルミナさんの家です。彼女の家は白と青です。彼女の部屋は緑色です。彼女のテーブルは茶色です。彼女は緑色が好きです。
  prs.a1.unit38.lesson06.teach.review_like_dislike:
    title: 復習:好きです、好きではありません
    gloss: 好きです / 好きではありません
    note: دوست دارم と دوست ندارم は、دوست داشتن(好きである)の肯定形と否定形の復習です。lesson03 で初めて学び、このまとめのレッスンでは اما を使って対比させます。
    target_text: دوست دارم(私は好きです)/ دوست ندارم(私は好きではありません)
  prs.a1.unit38.lesson06.teach.contrast_phrase:
    title: 私は赤は好きですが、黒は好きではありません
    gloss: 私は赤は好きですが、黒は好きではありません。
    note: اما で、ある色が好きなことと別の色が好きではないことを対比させ、دوست دارم と دوست ندارم を一緒に使っています。
  prs.a1.unit38.lesson06.teach.formal_question_phrase:
    title: どの色が好きですか
    gloss: どの色が好きですか。
    note: lesson03/04 と同じ質問に شما(あなた・丁寧)を加え、学習者に直接尋ねる形にしています。
