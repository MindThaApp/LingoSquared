course:
  title: ダリー語 A1
  description: カブールのダリー語の入門：テクノロジーと機器の語彙(携帯電話、パソコン、インターネット、アプリ、写真)、スマホ操作の表現(メッセージを送る、電話をかける、写真を撮る、アプリをダウンロードする)、1日に何回携帯電話を使うかの尋ね方と答え方、そして携帯電話・パソコン・インターネットの使い方についてのザルミナとホマユンの会話。
units:
  prs.a1.unit30.technology:
