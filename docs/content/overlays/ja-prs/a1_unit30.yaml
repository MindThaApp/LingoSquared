  prs.a1.unit30.lesson06.wrap_up:
    title: まとめ
teaching:
  prs.a1.unit30.lesson01.teach.tech_word:
    title: テクノロジー
    gloss: テクノロジー
    note: تکنالوژی は「テクノロジー」の意味で、アフガニスタンで標準的な綴りです。イランの綴り تکنولوژی とは異なります。
    example_gloss: テクノロジーはいいです。
  prs.a1.unit30.lesson01.teach.mobile_word:
    title: 携帯電話
    gloss: 携帯電話
    note: موبایل は「携帯電話」の意味で、より一般的な「電話」を表す تلفن(ユニット7で学習)とは区別されます。
    example_gloss: 私は携帯電話を持っています。
  prs.a1.unit30.lesson01.teach.computer_word:
    title: パソコン
    gloss: パソコン
    note: کمپیوتر は「パソコン・コンピューター」の意味で、ペルシア語圏とダリー語に共通する標準的な外来語です。
    example_gloss: パソコンは職場にあります。
  prs.a1.unit30.lesson01.teach.internet_word:
    title: インターネット
    gloss: インターネット
    note: انترنت は「インターネット」の意味で、ペルシア語圏とダリー語に共通する標準的な外来語です。
    example_gloss: インターネットは遅いです。
  prs.a1.unit30.lesson01.teach.app_word:
    title: アプリ
    gloss: アプリ
    note: اپلیکیشن は「アプリ(アプリケーション)」の意味です。ペルシア語とダリー語に共通する、標準的な外来語です。
    example_gloss: このアプリはいいです。
  prs.a1.unit30.lesson01.teach.photo_word:
    title: 写真
    gloss: 写真
    note: عکس は「写真」や「画像」の意味です。
    example_gloss: この写真はいいです。
  prs.a1.unit30.lesson01.teach.review_estefade_kardan:
    title: 使う
    gloss: 使用 + する → 使います
    note: استفاده(使用)は کردن(する、復習)と組み合わせて استفاده می‌کنم(使います)になります。これはこのコースでこれまで何度も出てきた「名詞+する」の形で、たとえば بازی می‌کنم(第29課)や ورزش می‌کنم(第29課)と同じです。
    target_text: استفاده (使用)+ کردن (する)= استفاده می‌کنم (私は使う)
  prs.a1.unit30.lesson01.teach.combined_sentence:
    title: 私はインターネットを使います
    gloss: 私はインターネットを使います。
    note: من(私、復習)、از(〜から/〜を使って、復習)、انترنت、استفاده می‌کنم を組み合わせた文です。
  prs.a1.unit30.lesson02.teach.review_peyam:
    title: メッセージ
    gloss: メッセージ
    note: پیام は「メッセージ」の意味です。
    target_text: پیام (メッセージ)
  prs.a1.unit30.lesson02.teach.mifrestam_phrase:
    title: メッセージを送ります
    gloss: メッセージを送ります
    note: می‌فرستم は「送ります」の意味です。第7課のメッセージを残すという意味の動詞 بگذارم とは別の、新しい動詞です。
  prs.a1.unit30.lesson02.teach.review_zang_mizanam:
    title: 私は電話します
    gloss: 電話をかけます
    note: زنگ می‌زنم は「電話をかけます」の意味です。
    target_text: زنگ می‌زنم (私は電話をかける)
  prs.a1.unit30.lesson02.teach.akas_migiram_phrase:
    title: 写真を撮ります
    gloss: 写真を撮ります
    note: عکس می‌گیرم は、می‌گیرم(取ります/受け取ります、第23課の復習)を عکس と組み合わせた表現で、「写真を撮ります」の意味です。
  prs.a1.unit30.lesson02.teach.download_word:
    title: ダウンロード
    gloss: ダウンロード
    note: دانلود は「ダウンロード」を表すダリー語の標準的な外来語で、کردن(する、復習)と組み合わせて دانلود می‌کنم(ダウンロードします)のように使います。
    example_gloss: アプリをダウンロードします。
