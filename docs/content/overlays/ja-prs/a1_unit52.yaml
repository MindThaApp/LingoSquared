    gloss: あなた(丁寧)/〜は何ですか/私/私は〜がほしいです/ひとつの
    note: どの映画やチケットがほしいかを尋ねたり伝えたりするときに使う復習の単語です。
    target_text: شما (あなた・丁寧) / چیست (何ですか) / من (私) / می‌خواهم (私はほしいです) / یک (一つの)
