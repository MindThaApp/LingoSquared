    title: スタッフは映画館にいます
    gloss: スタッフは映画館にいます。
    note: 「スタッフ」「〜に」「映画館」をつなげた文です。
  prs.a1.unit52.lesson02.teach.review_price_and_schedule_words:
    title: 復習：いくら、アフガニー、です、30、5、〜時、と、〜で・〜に、映画、スケジュール、面白い
    gloss: いくら / アフガニー / です / 30 / 5 / 〜時 / と / 〜で・〜に / 映画 / スケジュール / 面白い
