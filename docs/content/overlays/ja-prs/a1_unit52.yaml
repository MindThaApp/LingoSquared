teaching:
  prs.a1.unit52.lesson01.teach.review_this_is_in_good:
    title: 復習：これ、です、〜で・〜に、良い
    gloss: この / です / 〜で・〜に / 良い
    note: 映画館の話をするための復習単語です(このコースで繰り返し使います)。
    target_text: این (この) / است (です) / در (〜で・〜に) / خوب (良い)
  prs.a1.unit52.lesson01.teach.cinema_word:
    title: 映画館
    gloss: 映画館
    note: 映画を見る場所、映画館を表すダリー語です。
    example_gloss: 映画館は良いです。
  prs.a1.unit52.lesson01.teach.review_staff_word:
    title: 復習：スタッフ
    gloss: スタッフ
    note: プールで学んだ「スタッフ・従業員」と同じ一般的な単語で、ここでは映画館のチケット窓口の係員として使います。
    target_text: کارمند (スタッフ)
