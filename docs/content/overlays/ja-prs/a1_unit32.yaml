  prs.a1.unit32.lesson06.wrap_up:
    title: まとめ
teaching:
  prs.a1.unit32.lesson01.teach.birthday_word:
    title: 誕生日
    gloss: 誕生日
    note: تولد は「誕生日」という意味で、この課のテーマとなる単語です。
    example_gloss: 私の誕生日はハマルです。
  prs.a1.unit32.lesson01.teach.celebration_word:
    title: お祝い
    gloss: お祝い・パーティー
    note: جشن は「お祝い」や「パーティー」を意味します。
    example_gloss: 私たちのパーティーは盛大です。
  prs.a1.unit32.lesson01.teach.cake_word:
    title: ケーキ
    gloss: ケーキ
    note: کیک は「ケーキ」の意味で、ペルシア語とも共通する、よく使われる外来語です。
    example_gloss: ケーキはおいしいです。
  prs.a1.unit32.lesson01.teach.gift_word:
    title: プレゼント
    gloss: プレゼント・贈り物
    note: هدیه は「プレゼント」「贈り物」を意味する、ダリー語・ペルシア語で日常的によく使われる単語です(تحفه も使われます)。
    example_gloss: このプレゼントはあなたへのものです。
  prs.a1.unit32.lesson01.teach.congratulations_word:
    title: おめでとう
    gloss: お祝い・おめでとう
    note: تبریک は「お祝い」の意味で、می‌گویم(言います)と組み合わせて、日常表現の تبریک می‌گویم(お祝いを言います=おめでとうございます)として使います。
    example_gloss: おめでとう!
  prs.a1.unit32.lesson01.teach.review_mubarak:
    title: お誕生日おめでとう(作り方)
    gloss: あなたの誕生日(くだけた言い方)+めでたい → お誕生日おめでとう
    note: تولدت は تولد(誕生日)にくだけた言い方の「あなたの」を表す接尾辞 -ت が付いた形で、مبارک は「めでたい」という意味です。合わせた تولدت مبارک は、ダリー語・ペルシア語で定番の誕生日の挨拶です。
    target_text: تولدت(あなたの誕生日、くだけた言い方)+ مبارک(おめでたい)= تولدت مبارک(お誕生日おめでとう)
  prs.a1.unit32.lesson01.teach.happy_birthday_phrase:
    title: お誕生日おめでとう!
    gloss: お誕生日おめでとう!
    note: ダリー語・ペルシア語で広く使われる、本来の誕生日の挨拶です(تولدتان مبارک は丁寧な言い方で、この課の練習では扱いません)。
  prs.a1.unit32.lesson02.teach.review_shoma_dar_ast:
    title: あなた/〜で・〜に/です
    gloss: あなた(丁寧)/〜で・〜に/です
    note: شما(あなた・丁寧)、در(〜で・〜に)、است(です)は、これまでの課で学んだ単語の復習です。
    target_text: شما (あなた・丁寧) / در (〜で・〜に) / است (です・である)
  prs.a1.unit32.lesson02.teach.review_man_kodam:
    title: 私/どれ
    gloss: 私/どの
    note: من(私)と کدام(どの)は、どちらもこれまでの課の復習です。
    target_text: من (私) / کدام (どの)
  prs.a1.unit32.lesson02.teach.month_word:
    title: 月
    gloss: 月
    note: ماه は「月」(暦の月)を意味する、このコースで初めて出てくる単語です。
    example_gloss: 今月は暖かいです。
  prs.a1.unit32.lesson02.teach.review_hamal:
    title: Hamal
    gloss: ハマル(第1の月)
    note: حمل はアフガニスタンで使われる太陽ヒジュラ暦の第1月です。
    target_text: حمل (ハマル・第1の月)
  prs.a1.unit32.lesson02.teach.question_which_month:
    title: あなたの誕生日は何月ですか?
    gloss: あなたの誕生日は何月ですか?
    note: تولد(誕生日・復習)、شما(あなた・丁寧・復習)、در(〜で・復習)、کدام(どの・復習)に、ماه(月)を組み合わせた文です。
  prs.a1.unit32.lesson02.teach.answer_hamal:
    title: 私の誕生日はハマルです
    gloss: 私の誕生日はハマルです。
    note: تولد من در ... است(私の誕生日は…です・復習の構文)に حمل(ハマル)を入れた文です。
  prs.a1.unit32.lesson03.teach.review_dawat_mehmani:
    title: 招待/パーティー
    gloss: 招待/パーティー
    note: دعوت と مهمانی は、この課でもう一度取り上げる単語です。
    target_text: دعوت (招待) / مهمانی (パーティー)
  prs.a1.unit32.lesson03.teach.review_ra_ba:
    title: 目的語マーカー/〜へ
    gloss: 目的語を示す語/〜へ・〜に
    note: را(目的語を示す語)と به(〜へ・〜に)は、どちらも復習の機能語です。
    target_text: را (目的語を示す語) / به (〜へ・〜に)
  prs.a1.unit32.lesson03.teach.review_mikonam:
    title: 私はします
    gloss: 私はする → 私は招待します
    note: می‌کنم(私はする・復習)は دعوت と組み合わさって、「招待します」という意味の複合動詞表現 دعوت می‌کنم になります。
    target_text: می‌کنم (私はする) — دعوت می‌کنم (私は招待します)
  prs.a1.unit32.lesson03.teach.invite_sentence:
    title: お誕生日会にご招待します
    gloss: お誕生日会にご招待します。
    note: من ... را به ... دعوت می‌کنم(私は…を…に招待します・復習の構文)に جشن تولد(誕生日会)を組み合わせた文です。
  prs.a1.unit32.lesson03.teach.review_miyayin:
    title: いらっしゃいますか?(丁寧)
    gloss: いらっしゃいますか?(丁寧)
    note: می‌آیین は、استین/می‌خوانین/می‌کنین と同じ、丁寧な動詞語尾 -ین のパターンに従っています。
    target_text: می‌آیین؟ (いらっしゃいますか?・丁寧)
  prs.a1.unit32.lesson03.teach.will_you_come_question:
    title: 来ますか?
    gloss: 来ますか?
    note: شما(あなた・丁寧・復習)と می‌آیین を組み合わせた文です。
  prs.a1.unit32.lesson04.teach.review_time_words:
    title: 金曜日/〜時/いくつ/7
    gloss: 金曜日/〜時・時間/いくつ・何/7
    note: جمعه、ساعت、چند、هفت は、いずれも日付と時間の課で学んだ単語の復習です。
    target_text: جمعه (金曜日) / ساعت (〜時・時間) / چند (いくつ・何) / هفت (7)
  prs.a1.unit32.lesson04.teach.review_informal_come:
    title: あなた(くだけた形)/あなたが来る/私が来る/はい/とても良い/どうもありがとう
    gloss: 君(くだけた言い方)/君は来る(くだけた言い方)/私は行く・来る/はい/とてもよい/どうもありがとう
    note: تو、می‌آیی、می‌آیم、بلی、بسیار خوب、تشکر زیاد は、いずれも復習で、くだけた会話の場面に合わせてここにまとめています。
    target_text: تو (君・くだけた言い方) / می‌آیی (君は来る・くだけた言い方) / می‌آیم (私は行く・来る) / بلی (はい) / بسیار خوب (とてもよい) / تشکر زیاد (どうもありがとう)
  prs.a1.unit32.lesson04.teach.dialogue_line1:
    title: バシール:マリアム、金曜日は僕の誕生日会なんだ。来る?
    gloss: マリアム、金曜日は私の誕生日会だよ。来る?
  prs.a1.unit32.lesson04.teach.dialogue_line2:
    title: マリアム:うん、行くよ!金曜日は何時?
    gloss: うん、行くよ!金曜日は何時?
  prs.a1.unit32.lesson04.teach.dialogue_line3:
    title: バシール:7時だよ。
    gloss: 7時です。
  prs.a1.unit32.lesson04.teach.dialogue_line4:
    title: マリアム:わかった。バシール、お誕生日おめでとう!
    gloss: わかった。バシール、お誕生日おめでとう!
  prs.a1.unit32.lesson04.teach.dialogue_line5:
    title: バシール:どうもありがとう!
    gloss: どうもありがとう!
  prs.a1.unit32.lesson05.teach.happy_word:
    title: うれしい
    gloss: うれしい
    note: خوشحال は「うれしい」という意味です。
    example_gloss: 彼・彼女はうれしそうです。
  prs.a1.unit32.lesson05.teach.review_u_yak:
    title: 彼/彼女/ひとつの
    gloss: 彼・彼女/ひとつの
    note: او(彼・彼女、ユニット31で学習)と یک(ひとつの、ユニット4で学習)は、どちらもここでもう一度取り上げます。
    target_text: او (彼・彼女) / یک (ひとつの)
  prs.a1.unit32.lesson05.teach.review_miyayad_miyawarad:
    title: 彼/彼女が来る/彼/彼女が持ってくる
    gloss: 彼・彼女が来る/彼・彼女が持って来る
    note: می‌آید と می‌آورد は三人称の形で、これまでに学んだ三人称の -د の動詞パターン(例:ユニット31の می‌خواند)と同じです。
    target_text: می‌آید (彼・彼女が来る) / می‌آورد (彼・彼女が持って来る)
  prs.a1.unit32.lesson05.teach.reading_passage:
    title: お祝いについての読み物
    gloss: バシールの誕生日会は金曜日です。7時です。マリアムはパーティーに来ます。彼女はプレゼントを持って来ます。バシールはうれしそうです。
  prs.a1.unit32.lesson06.teach.review_like_have_time:
    title: 好きです/時間/ありません/でも
    gloss: 好きです/時間/ありません/でも
    note: دوست دارم(好きです)、وقت(時間)、ندارم(ありません)、اما(でも)は、いずれもこれまでの課の復習で、ユニット31のまとめの構文を引き継いでいます。
    target_text: دوست دارم (好きです) / وقت (時間) / ندارم (ありません) / اما (でも)
  prs.a1.unit32.lesson06.teach.wrap_summary:
    title: お祝いは好きですが、時間がありません
    gloss: お祝いは好きですが、時間がありません。
    note: جشن را دوست دارم(お祝いが好きです。復習した構文)と اما وقت ندارم(でも時間がありません)を組み合わせた文です。
