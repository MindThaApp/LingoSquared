course:
  title: ダリー語 A1
  description: カブールのダリー語・入門:お祝いと誕生日の語彙(誕生日、パーティー、ケーキ、プレゼント、お祝い)、誕生日が何月かをたずねて答える表現、丁寧な招待の言い方、バシールとマリアムの誕生日会の会話を学びます。
units:
  prs.a1.unit32.celebrations:
    title: お祝い
    description: 誕生日やお祝いについて話しましょう。自分の誕生日を伝え、人を招待し、お祝いを言います。
lessons:
  prs.a1.unit32.lesson01.celebration_vocabulary:
    title: お祝いの言葉
  prs.a1.unit32.lesson02.birthday_month:
