course:
  title: ダリー語 A1
  description: 初級カーブルのダリ語:動物とペットの語彙(犬、猫、鳥、魚)、حیوان خانگی دارین؟ でペットを飼っているか尋ねて答える表現、ペットの大きさや色の説明、ザルミナとホマユンの猫を飼ってえさをあげる会話を学びます。
units:
  prs.a1.unit28.animals:
    title: 動物
    description: ペットや身近な動物について、飼っているかどうかや基本的なお世話を話せるようになります。
lessons:
  prs.a1.unit28.lesson01.animal_vocabulary:
    title: 動物の言葉
  prs.a1.unit28.lesson02.have_a_pet:
    title: ペットを飼っていますか？
  prs.a1.unit28.lesson03.describe_pet:
    title: ペットを説明する
  prs.a1.unit28.lesson04.pet_dialogue:
    title: ペットの会話
  prs.a1.unit28.lesson05.reading_animals:
    title: 動物についての読み物
  prs.a1.unit28.lesson06.wrap_up:
    title: まとめ
teaching:
  prs.a1.unit28.lesson01.teach.animal_word:
    title: 動物
    gloss: 動物
    note: حیوان は「動物」の意味で、ペットやその他の生き物を含む一般的な言葉です。
    example_gloss: 犬は動物です。
  prs.a1.unit28.lesson01.teach.dog_word:
    title: 犬
    gloss: 犬
    note: سگ は「犬」の意味です。
    example_gloss: 私は犬を飼っています。
  prs.a1.unit28.lesson01.teach.cat_word:
    title: 猫
    gloss: 猫
    note: پشک は「猫」の意味です。ダリ語(アフガニスタン)で日常的に使われる言葉で、イランのペルシア語の گربه とは異なります。
    example_gloss: 私は猫を飼っています。
  prs.a1.unit28.lesson01.teach.bird_word:
    title: 鳥
    gloss: 鳥
    note: پرنده は「鳥」の意味です。
    example_gloss: 私は鳥を飼っています。
  prs.a1.unit28.lesson01.teach.fish_word:
    title: 魚
    gloss: 魚
    note: ماهی は「魚」の意味です。
    example_gloss: 私は魚を飼っています。
  prs.a1.unit28.lesson01.teach.pet_phrase:
    title: ペット
    gloss: ペット
    note: حیوان خانگی は直訳すると「家の動物」で、حیوان(動物、復習)+ خانگی(家の・家庭の)でできています。
    example_gloss: 犬は私のペットです。
  prs.a1.unit28.lesson01.teach.review_daram_dast:
    title: I have / you have (formal) / is
    gloss: 私は持っています / あなたは持っています(丁寧) / です
    note: دارم(私は持っています)、دارین(あなたは持っています、丁寧)、است(です)はこれまでに学んだ復習で、この単元ではペットの話で繰り返し使います。
    target_text: دارم (私は持っています) / دارین (あなたは持っています、丁寧) / است (です)
  prs.a1.unit28.lesson02.teach.pet_question:
    title: ペットを飼っていますか？
    gloss: ペットを飼っていますか？
    note: حیوان خانگی دارین؟ は、ペットを飼っているかを丁寧に尋ねる言い方です。
  prs.a1.unit28.lesson02.teach.yes_answer:
    title: はい、犬を飼っています
    gloss: はい、犬を飼っています。
    note: بلی(はい、単元3の復習)とこの単元の سگ دارم を組み合わせた表現です。
  prs.a1.unit28.lesson02.teach.no_answer:
    title: いいえ、ペットは飼っていません
    gloss: いいえ、ペットは飼っていません。
    note: نخیر(丁寧な「いいえ」、単元3の復習)と حیوان خانگی ندارم(ペットは飼っていません)を組み合わせた表現です。
  prs.a1.unit28.lesson02.teach.review_bali_nakhair:
    title: Yes / no / I don't have
    gloss: はい / いいえ / 私は持っていません
    note: بلی、نخیر、ندارم は単元3の家族についてのやり取りで学んだ復習で、ここではペットを飼っているかどうかの答えに使います。
    target_text: بلی (はい) / نخیر (いいえ) / ندارم (私は持っていません)
  prs.a1.unit28.lesson03.teach.review_rang:
    title: Color
    gloss: 色
    note: رنگ は「色」の意味です(単元21の服の復習)。
    target_text: رنگ (色)
  prs.a1.unit28.lesson03.teach.black_word:
    title: 黒
    gloss: 黒
    note: سیاه は「黒」という意味です。
    example_gloss: 私の犬は黒いです。
  prs.a1.unit28.lesson03.teach.white_word:
    title: 白
    gloss: 白
    note: سفید は「白」という意味です。
    example_gloss: 私の猫は白いです。
  prs.a1.unit28.lesson03.teach.small_word:
    title: 小さい
    gloss: 小さい
    note: کوچک は「小さい」の意味です(単元15の比較の復習)。
    example_gloss: 私の猫は小さいです。
  prs.a1.unit28.lesson03.teach.big_word:
    title: 大きい
    gloss: 大きい
    note: بزرگ は「大きい」の意味です(単元15の比較の復習)。
    example_gloss: 私の犬は大きいです。
  prs.a1.unit28.lesson03.teach.combined_sentence:
    title: 私の犬は黒くて大きいです
    gloss: 私の犬は黒くて大きいです。
    note: و(〜と、復習)で2つの特徴をつなぎます。
  prs.a1.unit28.lesson04.teach.review_to_dari:
    title: You (informal) / you have (informal)
    gloss: 君(くだけた言い方) / 君は持っている(くだけた言い方)
    note: تو(君、くだけた言い方)と داری(君は持っている、くだけた言い方)は復習で、この課の親しい友人同士の会話で使います。
    target_text: تو (君、くだけた言い方) / داری (君は持っている、くだけた言い方)
  prs.a1.unit28.lesson04.teach.review_che_har_roz:
    title: What / every day
    gloss: 何・どんな / 毎日
    note: چه(何・どんな、単元21の「何色」の復習)と هر روز(毎日、単元24の復習)を一緒に使って、ペットのお世話について尋ねます。
    target_text: چه (何・どんな) / هر روز (毎日)
  prs.a1.unit28.lesson04.teach.dialogue_line1:
    title: ホマユン:ザルミナ、ペットを飼ってる?
    gloss: ホマユン:ザルミナ、ペットを飼ってる?
    note: 友達同士のくだけた質問で、くだけた形の داری を使っています。
  prs.a1.unit28.lesson04.teach.dialogue_line2:
    title: ザルミナ:うん、猫を飼ってるよ
    gloss: ザルミナ:うん、猫を飼ってるよ。
    note: بلی と یک پشک دارم で答えます。
  prs.a1.unit28.lesson04.teach.dialogue_line3:
    title: ホマユーン:あなたの猫は何色ですか?
    gloss: ホマユーン:あなたの猫は何色ですか?
    note: چه رنگ(何色)を使います。第21課の買い物の質問と同じ型です。
  prs.a1.unit28.lesson04.teach.dialogue_line4:
    title: ザルミナ:白いです
    gloss: ザルミナ:白いです。
    note: 短い答え方で、色+است だけで言います。猫のことは質問から分かるので、پشک は繰り返しません。
  prs.a1.unit28.lesson04.teach.dialogue_line5:
    title: ホマユーン:毎日えさをあげていますか?
    gloss: ホマユーン:毎日えさをあげていますか?
    note: غذا می‌دهی(えさをあげる/食事を与える、親しい相手への言い方)が登場します。غذا(食べ物)+می‌دهی でできていて、第18課の می‌دهد に対応する親称の形です。
  prs.a1.unit28.lesson04.teach.dialogue_line6:
    title: ザルミナ:はい、毎日えさをあげています
    gloss: ザルミナ:はい、毎日えさをあげています。
    note: هر روز(毎日)を می‌دهم(私があげる、1人称)と組み合わせています。
  prs.a1.unit28.lesson05.teach.reading_passage:
    title: ペットについての読み物
    gloss: ザルミナは猫を1匹飼っています。彼女の猫は白くて小さいです。ザルミナは毎日猫にえさをあげています。
    note: この課のペットの語彙をまとめた短い読み物です。دارد(持っている、3人称。第26・27課の復習)と می‌دهد(あげる、3人称。第18課の復習)が出てきます。
  prs.a1.unit28.lesson06.teach.review_ama:
    title: But
    gloss: しかし
    note: اما は「でも、しかし」という意味です(以前の課の復習)。
    target_text: اما (しかし)
  prs.a1.unit28.lesson06.teach.review_astam:
    title: I am
    gloss: 私は~です
    note: استم(私は~です)は、これまでの課の復習です。
    target_text: استم (私は…です)
  prs.a1.unit28.lesson06.teach.wrap_summary:
    title: 犬は飼っていますが、猫は飼っていません
    gloss: 犬は飼っていますが、猫は飼っていません。
    note: اما を使って、ペットについての2つの事柄をつなげています。
