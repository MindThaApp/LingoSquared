course:
  title: ダリー語 A1
  description: アフガニスタンのダリー語入門:食べ物と飲み物の語彙、丁寧な注文のしかた、あるものをたずねる表現、数量の言い方、お会計をお願いするなどのレストランでのマナーを学びます。
units:
  prs.a1.unit08.food:
    title: 食べ物と食事の注文
lessons:
  prs.a1.unit08.lesson01.food_and_drink_vocabulary:
    title: 食べ物と飲み物
  prs.a1.unit08.lesson02.polite_ordering:
    title: 丁寧に注文する
  prs.a1.unit08.lesson03.asking_whats_available:
    title: 何があるかたずねる
  prs.a1.unit08.lesson04.quantities:
    title: 数量を指定して注文する
  prs.a1.unit08.lesson05.restaurant_etiquette_and_bill:
    title: レストランのマナーと会計
  prs.a1.unit08.lesson06.restaurant_dialogue:
    title: チャイハネでのひと続きの会話
teaching:
  prs.a1.unit08.lesson01.teach.naan:
    title: パン
    gloss: パン
    note: نان は、アフガニスタンのどの食事にも欠かせない主食です。
    example_gloss: パンは焼きたてです。
  prs.a1.unit08.lesson01.teach.palaw:
    title: ピラフ
    gloss: ピラフ
    note: پلو はアフガニスタンのピラフ料理で、独特の味付けがされ、肉やにんじん、レーズンと一緒に炊くことも多く、ただの白いご飯ではありません。
    example_gloss: ピラフはおいしいです。
  prs.a1.unit08.lesson01.teach.qorma:
    title: 肉と野菜の煮込み
    gloss: 肉と野菜の煮込み
    note: قورمه は、肉と野菜を煮込んだ料理の一般的な呼び名で、よく پلو にかけて出されます。
    example_gloss: 煮込みをピラフと一緒に食べます。
  prs.a1.unit08.lesson01.teach.chai_review:
    title: お茶(復習)
    gloss: お茶
    note: چای は、アフガニスタンのほとんどどこでも最初に出される飲み物です。
    example_gloss: お茶を1つお願いします。
  prs.a1.unit08.lesson01.teach.ab_water:
    title: 水
    gloss: 水
    note: آب は水を表す一般的な単語です。
    example_gloss: お水を一つください。
  prs.a1.unit08.lesson01.teach.va_word:
    title: And
    gloss: と・そして
    note: و は、食べ物を並べてつなぐときに使う一般的な言葉です。
    target_text: و(〜と、そして)
  prs.a1.unit08.lesson02.teach.mikham_chai:
    title: 丁寧にお茶を注文する
    gloss: お茶をお願いしたいのですが。
    note: یک چای می‌خواهم は、遠回しな言い方ではなく می‌خواهم(欲しい)を直接使った、丁寧で標準的な注文のしかたです。
  prs.a1.unit08.lesson02.teach.lotfan:
    title: お願いします
    gloss: お願いします
    note: لطفاً は、ほとんどどんな依頼にも付けてやわらかくできます。
    example_gloss: 手伝ってください。
  prs.a1.unit08.lesson02.teach.mikham_naan:
    title: 丁寧にナンを注文する
    gloss: ナンを一枚ください。
    note: 「یک [item] می‌خواهم」の型は、どんな食べ物・飲み物の名詞にも使えます。
  prs.a1.unit08.lesson03.teach.what_do_you_have:
    title: 何があるかたずねる
    gloss: 何がありますか?
    note: چی دارین؟ は、店の人に食べ物として何があるかを尋ねるときの自然な言い方です。
  prs.a1.unit08.lesson03.teach.we_have_both:
    title: あるものを答える
    gloss: ポロとコルマがあります。
    note: پلو و قورمه داریم では、دارم(私は持っている)の「私たち」の形である داریم を使っています。店の人は店全体を代表して「私たち」と言います。
  prs.a1.unit08.lesson03.teach.fresh_word:
    title: 新鮮な
    gloss: 新鮮な
    note: تازه は、作りたての料理について使います。
    example_gloss: このパンは新鮮です。
  prs.a1.unit08.lesson04.teach.yek_boshghab:
    title: ポロ1皿
    gloss: ポロ1皿
    note: بشقاب(皿)は、皿に盛った料理を数えるときの助数詞です。
  prs.a1.unit08.lesson04.teach.do_ta_naan:
    title: パン2枚
    gloss: パン2枚
    note: تا は、ほとんどの数えられる物に使う一般的な助数詞で、数のあとに置きます。ここではパン2枚という意味です。
  prs.a1.unit08.lesson04.teach.combined_order:
    title: 注文をまとめて言う
    gloss: ポロ1皿とパン2枚をお願いします。
    note: 数量の表現は、و(~と)でつないで1回の注文にまとめられます。
  prs.a1.unit08.lesson05.teach.bill_word:
    title: お会計
    gloss: お会計
    note: بل(英語の bill に由来)は、アフガニスタンでレストランの勘定を指す日常的な言葉です。日本語の「お勘定」にあたります。
    example_gloss: お会計をお願いします。
  prs.a1.unit08.lesson05.teach.bill_request:
    title: お勘定がいくらか尋ねる
    gloss: お勘定はいくらですか?
    note: بل چند می‌شه؟ は直訳すると「お勘定はいくらになりますか」で、合計を尋ねる自然で日常的な言い方です。می‌شه は می‌شود の話し言葉の形で、店ではこちらを耳にします。書くときは می‌شود を使います。
  prs.a1.unit08.lesson05.teach.khoshmaze:
    title: 料理がおいしかったと伝える
    gloss: とてもおいしかったです。
    note: خیلی خوش‌مزه بود は、食事のあとに伝える自然なほめ言葉です。
  prs.a1.unit08.lesson05.teach.chaikhana:
    title: チャイハナ
    gloss: チャイハナ/簡素な食堂
    note: چایخانه は、アフガニスタン、特にカブールでよく見かける日常的な簡素な食堂で、お茶や簡単な食事を出します。
  prs.a1.unit08.lesson06.teach.welcome_review:
    title: ようこそ(復習)
    gloss: ようこそ
    note: خوش آمدین は挨拶の単元で学びました。ここでは店の人の出迎えの言葉として使われています。
  prs.a1.unit08.lesson06.teach.turn01:
    title: 店主がお客さんにあいさつする
    gloss: 店の人がお客さんを迎え、何がよいか尋ねます。
    note: چی میل دارین؟ は丁寧な最初の問いかけで、چی دارین؟ と役割は似ていますが、お客さんの希望を尋ねる言い方です。
  prs.a1.unit08.lesson06.teach.turn02:
    title: お客さんが何があるか尋ねる
    gloss: お客さんが店の人に挨拶し、何があるか尋ねます。
    note: چی دارین؟ は注文のやり取りの始まりです(lesson03で学習)。
  prs.a1.unit08.lesson06.teach.turn03:
    title: 店の人があるものを挙げる
    gloss: 店の人が、ポロとコルマがあり、どちらも新鮮だと言います。
    note: هردو(両方)は、挙げた2つの料理がどちらも新鮮だと伝えています。
  prs.a1.unit08.lesson06.teach.turn04:
    title: 客がひととおり注文する
    gloss: お客さんは了承し、ポロとコルマを1皿、それにお茶も注文します。
    note: lesson04の数量の型と、lesson01の食べ物の語彙を組み合わせています。
  prs.a1.unit08.lesson06.teach.turn05:
    title: 店の人が注文を受ける
    gloss: 店の人がすぐにお持ちしますと言います。
    note: چشم は直訳すると「私の目」で、「かしこまりました」という敬意のある言い方です。می‌آرم は می‌آورم(持ってきます)の話し言葉の形で、همین حالا は「今すぐ」という意味です。
  prs.a1.unit08.lesson06.teach.turn06:
    title: お客さんが料理をほめて、お会計をお願いする
    gloss: お客さんは、とてもおいしかったと言って、お会計をお願いします。
    note: どちらの表現もレッスン5の語彙をそのまま使っています。
  prs.a1.unit08.lesson06.teach.turn07:
    title: 店の人が合計を伝える
    gloss: 店の人がお礼を言い、合計は200アフガニーだと伝えます。
    note: افغانی はアフガニスタンの通貨です。دوصد(200)に通貨名を続けて値段を言います。
