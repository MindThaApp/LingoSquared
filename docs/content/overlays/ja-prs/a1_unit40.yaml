course:
  title: ダリー語 A1
  description: カブール・ダリー語の初級:基本的な緊急事態に気づき、助けを求め、警察・救急車・消防のどれが必要かを伝え、けがの様子を説明し、緊急時に関する短い文章を読みます。
units:
  prs.a1.unit40.emergencies:
    title: 緊急時
    description: 緊急事態に気づき、助けを求め、どんな助けが必要か(警察・救急車・消防)を伝えます。
lessons:
  prs.a1.unit40.lesson01.emergency_types:
    title: 緊急時の助け
  prs.a1.unit40.lesson02.asking_for_help:
    title: 助けを求める
  prs.a1.unit40.lesson03.describing_the_emergency:
    title: けがと出血
  prs.a1.unit40.lesson04.emergency_dialogue:
    title: 緊急時の会話
  prs.a1.unit40.lesson05.emergency_reading:
    title: 緊急時の助けについての読み物
  prs.a1.unit40.lesson06.wrap_up:
    title: まとめ
teaching:
  prs.a1.unit40.lesson01.teach.review_help_want:
    title: 復習:助け、〜が欲しい
    gloss: 助け/私は欲しいです
    note: کمک と می‌خواهم は復習の単語で、このユニットでどんな助けが必要かを伝えるのに何度も使います。
    target_text: کمک(助け)/ می‌خواهم(欲しい)
  prs.a1.unit40.lesson01.teach.review_this_is:
    title: 復習:これ、〜です
    gloss: これ/〜です
    note: این と است は初期に学んだ復習の単語で、どんな状況かを言うときに使います。
    target_text: این(これ)/ است(です)
  prs.a1.unit40.lesson01.teach.emergency_word:
    title: 緊急事態
    gloss: 緊急事態
    note: اضطراری は「緊急の」「緊急事態」という意味です。
    example_gloss: これは緊急事態です。
  prs.a1.unit40.lesson01.teach.police_word:
    title: 警察
    gloss: 警察
    note: پولیس はアフガニスタンのダリー語で「警察」を表す標準的な言葉です(英語の police に由来します)。
    example_gloss: 警察をお願いします。
  prs.a1.unit40.lesson01.teach.ambulance_word:
    title: 救急車
    gloss: 救急車
    note: امبولانس は「救急車」という意味です。
    example_gloss: 救急車をお願いします。
  prs.a1.unit40.lesson01.teach.fire_word:
    title: 火事
    gloss: 火
    note: آتش は「火」という意味です。
    example_gloss: 火事です。
  prs.a1.unit40.lesson01.teach.fire_brigade_word:
    title: 消防
    gloss: 消防
    note: اطفائیه はカブールで日常的に使われる、消防署・消防隊を表す言葉です。
    example_gloss: 消防をお願いします。
  prs.a1.unit40.lesson01.teach.emergency_help_phrase:
    title: 緊急事態です!警察をお願いします!
    gloss: 緊急事態です!警察をお願いします!
    note: این اضطراری است は、این(これ)、اضطراری(緊急事態)、است(です)を組み合わせた文です。
  prs.a1.unit40.lesson02.teach.review_can_you_do:
    title: 復習:〜していただけますか、〜してください(丁寧な命令)、〜に/〜のために、すぐに
    gloss: 〜できますか/〜してください/〜に・〜のために/すぐに
    note: می‌توانین、کنین、به、زود(前のユニットで学習済み)は、他の言葉と組み合わせて丁寧な依頼や指示を作ります。
    target_text: می‌توانین(できますか)/ کنین(してください)/ به(〜に・〜のために)/ زود(早く)
  prs.a1.unit40.lesson02.teach.mera_word:
    title: 私を
    gloss: 私を
    note: مه ره は、目的語の「私を」を表すカブールの話し言葉のダリー語で、مرا にあたります。مه は من の話し言葉の形、ره は目的語を示す را の話し言葉の形です。書くときは مرا が普通で、これも正解として認められます。
    example_gloss: 私を手伝ってくれますか？
  prs.a1.unit40.lesson02.teach.can_you_help_me_phrase:
    title: 手伝ってくれますか?
    gloss: 手伝ってくれますか?
    note: 助けを直接求めるときに実際によく使われるダリー語のフレーズです。
  prs.a1.unit40.lesson02.teach.call_word:
    title: 電話してください!(命令形)
    gloss: 電話してください
    note: زنگ بزنین は زنگ زدن(電話をかける)の丁寧な命令形で、すでに学んだ زنگ می‌زنم(私は電話します)を土台にしています。
    example_gloss: 警察に電話してください!
  prs.a1.unit40.lesson02.teach.come_word:
    title: 来てください!(命令形)
    gloss: 来てください
    note: بیایین は آمدن(来る)の丁寧な命令形です。
    example_gloss: すぐ来てください!
  prs.a1.unit40.lesson02.teach.call_ambulance_phrase:
    title: 救急車を呼んでください!
    gloss: 救急車を呼んでください!
    note: به(〜に)+ امبولانس(救急車)+ 命令形 زنگ بزنین です。
  prs.a1.unit40.lesson03.teach.review_he_she_has:
    title: 復習:その人、その人は持っている
    gloss: その人/その人は持っている
    note: او と دارد は復習の形で、緊急時に他の人の状態を説明するときに使います。
    target_text: او(彼・彼女)/ دارد(持っている)
  prs.a1.unit40.lesson03.teach.injured_word:
    title: けがをしている
    gloss: けがをした
    note: زخمی は「けがをした」「負傷した」という意味です。
    example_gloss: その人はけがをしています。
  prs.a1.unit40.lesson03.teach.bleeding_word:
    title: 出血
    gloss: 出血
    note: خون‌ریزی は「出血」という意味です。
    example_gloss: その人は出血しています。
  prs.a1.unit40.lesson03.teach.injured_ambulance_phrase:
    title: その人はけがをしています!救急車をお願いします!
    gloss: その人はけがをしています!救急車をお願いします!
    note: زخمی と、すでに学んだ امبولانس می‌خواهم を組み合わせた文です。
  prs.a1.unit40.lesson03.teach.bleeding_come_quickly_phrase:
    title: その人は出血しています!すぐ来てください!
    gloss: その人は出血しています!すぐ来てください!
    note: خون‌ریزی と、すでに学んだ زود بیایین を組み合わせた文です。
  prs.a1.unit40.lesson04.teach.review_dialogue_words:
    title: 復習:何、来る、電話します、どうもありがとう
    gloss: 何/その人は来る/私は電話します/どうもありがとう
    note: چه、می‌آید、زنگ می‌زنم、تشکر زیاد は復習の単語で、緊急時の会話で使います。
    target_text: چه(何)/ می‌آید(来る)/ زنگ می‌زنم(電話をかける)/ تشکر زیاد(どうもありがとう)
  prs.a1.unit40.lesson04.teach.dialogue_line1:
    title: ホマユン:ザルミナ、助けて!助けて!
    gloss: ザルミナ、助けて!助けて!
  prs.a1.unit40.lesson04.teach.dialogue_line2:
    title: ザルミナ:何?
    gloss: 何?
  prs.a1.unit40.lesson04.teach.dialogue_line3:
    title: ホマユン:その人はけがをしています!出血しています!
    gloss: その人はけがをしています!出血しています!
  prs.a1.unit40.lesson04.teach.dialogue_line4:
    title: ザルミナ:救急車が必要です。電話します!
    gloss: 救急車が必要です。電話します!
  prs.a1.unit40.lesson04.teach.dialogue_line5:
    title: ホマユン:どうもありがとう!
    gloss: どうもありがとう!
  prs.a1.unit40.lesson04.teach.dialogue_line6:
    title: ザルミナ:救急車がすぐ来ます。
    gloss: 救急車がすぐ来ます。
  prs.a1.unit40.lesson05.teach.review_reading_words:
    title: 復習:一、人、町、その人はする、〜で
    gloss: 一/人/町/その人はする/〜で
    note: یک、نفر、شهر、می‌کند、در は復習の単語で、この読み物で使います。
    target_text: یک(1つの)/ نفر(人)/ شهر(都市)/ می‌کند(する)/ در(〜で・〜に)
  prs.a1.unit40.lesson05.teach.reading_passage:
    title: 緊急事態についての読み物
    gloss: 町で一人がけがをしています。その人は出血しています。ホマユンが助けます。救急車が来ます。
  prs.a1.unit40.lesson06.teach.review_wrap_up_words:
    title: 復習:電話、私は持っていません、でも、あなた(丁寧)
    gloss: 電話/私は持っていません/でも/あなた(丁寧)
    note: تلفن、ندارم、اما、شما は復習の単語で、必要なことと不足していることを対比させたり、丁寧に質問したりするときに使います。
    target_text: تلفن(電話)/ ندارم(持っていません)/ اما(でも)/ شما(あなた・丁寧)
  prs.a1.unit40.lesson06.teach.contrast_phrase:
    title: 助けが必要ですが、電話を持っていません
    gloss: 助けが必要ですが、電話を持っていません。
    note: اما は、助けが必要なことと、助けを呼ぶ電話がないことを対比させています。
  prs.a1.unit40.lesson06.teach.formal_question_phrase:
    title: 手伝ってくれますか？
    gloss: 助けていただけますか?
    note: شما を使った丁寧な言い方で、礼儀正しく直接助けを頼むときに使います。
