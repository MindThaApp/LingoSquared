course:
  title: ダリー語 A1
  description: カブールのダリー語・初級：持ち物をなくしたことを伝える、見つかったかどうかを尋ねる、色や大きさで物を説明する、落とし物についての短い文章を読む。
units:
  prs.a1.unit41.lost_items:
    title: なくし物
    description: 持ち物をなくしたと伝え、見つかったか尋ね、特徴を説明し、見つかったときにそれだと確認します。
lessons:
  prs.a1.unit41.lesson01.lost_item_vocabulary:
    title: なくし物の語彙
  prs.a1.unit41.lesson02.asking_if_found:
    title: 見つかったか尋ねる
  prs.a1.unit41.lesson03.describing_the_item:
    title: 物の特徴を説明する
  prs.a1.unit41.lesson04.lost_bag_dialogue:
    title: かばんをなくした会話
  prs.a1.unit41.lesson05.reading:
    title: なくしたかばんの読み物
  prs.a1.unit41.lesson06.wrap_up:
    title: まとめ
teaching:
  prs.a1.unit41.lesson01.teach.review_this_is:
    title: 復習：これ、~です
    gloss: これ/~です
    note: این と است は、物が何であるかを言うときに使う基本の語です。
    target_text: این(これ)/ است(です)
  prs.a1.unit41.lesson01.teach.review_have:
    title: 復習：私は持っています
    gloss: 私には~がいる・ある
    note: دارم は、自分が持っている物や身に着けている物を言うときに使う復習の語です。
    target_text: دارم(私は持っています)
  prs.a1.unit41.lesson01.teach.bag_word:
    title: かばん
    gloss: バッグ
    note: خریطه は「かばん」を表す標準的なダリー語です。
    example_gloss: かばんを持っています。
  prs.a1.unit41.lesson01.teach.wallet_word:
    title: 財布
    gloss: 財布
    note: کیف پول は「財布」の意味で、کیف(ケース・かばん)と پول(お金)を組み合わせた語です。
    example_gloss: 財布を持っています。
  prs.a1.unit41.lesson01.teach.key_word:
    title: 鍵
    gloss: 鍵
    note: کلید は「鍵」の意味です。
    example_gloss: 鍵を持っています。
  prs.a1.unit41.lesson01.teach.glasses_word:
    title: めがね
    gloss: メガネ
    note: عینک は「眼鏡」の意味です。
    example_gloss: 眼鏡を持っています。
  prs.a1.unit41.lesson01.teach.lost_word:
    title: なくなった
    gloss: なくなった
    note: گم شده は گم(なくした)と شده(なった)を組み合わせた形で、物がなくなったと言う標準的な表現です。第40課の زخمی است(けがをしている)と同じ型です。
    example_gloss: 私のかばんがなくなりました。
  prs.a1.unit41.lesson01.teach.wallet_lost_phrase:
    title: 財布がなくなりました！
    gloss: 財布がなくなりました！
    note: کیف پولم は کیف پول に所有を表す接尾辞 -م(私の)が付いた形で、これまでの課の خانه‌ام(私の家)と同じ型です。
  prs.a1.unit41.lesson02.teach.review_can_help:
    title: 復習：できますか、私を、助け、してください(丁寧な依頼)
    gloss: できますか/私を/助け/してください
    note: می‌توانین、مه ره、کمک、کنین を組み合わせると、助けを求める言い方になります。
    target_text: می‌توانین(~していただけますか)/ مه ره(私を)/ کمک(助け)/ کنین(してください -- 丁寧な命令形)
  prs.a1.unit41.lesson02.teach.review_ra:
    title: 復習：(目的語を示す語)
    gloss: (目的語を示す助詞)
    note: را は動作の対象を示します。ここでは「見た物」を示しています。
    target_text: را(目的語を示す助詞)
  prs.a1.unit41.lesson02.teach.did_you_see_word:
    title: 見ましたか？
    gloss: 見ましたか
    note: دیدین は دیدن(見る)の丁寧な二人称複数の過去形です。第2課の از دیدن شما خوشحال شدم にも出てきました。
    example_gloss: 私のかばんを見ましたか？
  prs.a1.unit41.lesson02.teach.did_you_see_my_bag_phrase:
    title: 私のかばんを見ましたか？
    gloss: 私のかばんを見ましたか？
    note: خریطه‌ام(私のかばん)に را と دیدین を組み合わせて、相手が気づいたかどうかを尋ねます。
  prs.a1.unit41.lesson02.teach.is_found_word:
    title: 見つかった
    gloss: 見つかった
    note: پیدا شده は پیدا(見つかった)と شده(なった)を組み合わせた形で、物が出てきたかどうかを尋ねる標準的な表現です。
    example_gloss: 私の鍵が見つかりました。
  prs.a1.unit41.lesson02.teach.has_key_been_found_phrase:
    title: 私の鍵は見つかりましたか？
    gloss: 私の鍵は見つかりましたか？
    note: کلیدم は کلید に所有を表す接尾辞 -م(私の)が付いた形で、「私の鍵」という意味です。
  prs.a1.unit41.lesson03.teach.review_color_black_white:
    title: 復習：色、黒、白、と
    gloss: 色/黒/白/と
    note: رنگ、سیاه、سفید、و は、物の色を説明するときに使います。
    target_text: رنگ(色)/ سیاه(黒)/ سفید(白)/ و(と、そして)
  prs.a1.unit41.lesson03.teach.review_size:
    title: 復習：大きい、小さい
    gloss: 大きい/小さい
    note: بزرگ と کوچک は、物の大きさを説明するときに使います。
    target_text: بزرگ(大きい)/ کوچک(小さい)
  prs.a1.unit41.lesson03.teach.here_word:
    title: ここ
    gloss: ここ
    note: اینجا は「ここ」の意味です。
    example_gloss: 鍵はここにあります。
  prs.a1.unit41.lesson03.teach.bag_black_phrase:
    title: 私のかばんは黒いです
    gloss: 私のかばんは黒いです。
    note: خریطه‌ام(私のかばん)に سیاه(黒)を加えて、物を特定しやすいように説明します。
  prs.a1.unit41.lesson03.teach.wallet_small_black_phrase:
    title: 私の財布は小さくて黒いです
    gloss: 私の財布は小さくて黒いです。
    note: و(~と/~て)は、کوچک(小さい)と سیاه(黒い)という二つの形容を結びます。
  prs.a1.unit41.lesson04.teach.review_what_thanks:
    title: 復習：何、どうもありがとう
    gloss: 何/どうもありがとう
    note: چه と تشکر زیاد は、会話に出てくる復習の語です。
    target_text: چه(何)/ تشکر زیاد(どうもありがとう)
  prs.a1.unit41.lesson04.teach.review_yes_welcome:
    title: 復習：はい、どういたしまして
    gloss: はい/どういたしまして
    note: بلی と خواهش می‌کنم は、会話に出てくる復習の語です。
    target_text: بلی(はい)/ خواهش می‌کنم(どういたしまして)
  prs.a1.unit41.lesson04.teach.dialogue_line1:
    title: ホマユーン：ザルミナ、私のかばんがなくなりました！
    gloss: ザルミナ、私のかばんがなくなりました！
  prs.a1.unit41.lesson04.teach.dialogue_line2:
    title: ザルミナ：何色ですか？
    gloss: それは何色ですか？
  prs.a1.unit41.lesson04.teach.dialogue_line3:
    title: ホマユーン：黒です。
    gloss: 黒いです。
  prs.a1.unit41.lesson04.teach.dialogue_line4:
    title: ザルミナ：はい、見ました！ここにあります。
    gloss: はい、見ました！ここにあります。
  prs.a1.unit41.lesson04.teach.dialogue_line5:
    title: ホマユーン：どうもありがとう！
    gloss: どうもありがとう！
  prs.a1.unit41.lesson04.teach.dialogue_line6:
    title: ザルミナ：どういたしまして。
    gloss: どういたしまして。
  prs.a1.unit41.lesson05.teach.review_one_have:
    title: 復習：一つ、彼/彼女は持っている
    gloss: 一つ/彼/彼女は持っている
    note: یک と دارد は、読み物に出てくる復習の語です。
    target_text: یک(一つの)/ دارد(彼/彼女は持っています)
  prs.a1.unit41.lesson05.teach.reading_passage:
    title: なくしたかばんの読み物
    gloss: ホマユーンはかばんを持っています。彼のかばんは黒いです。彼のかばんはなくなりました。ザルミナはかばんを見ます。かばんはここにあります！
  prs.a1.unit41.lesson06.teach.review_wrap_up_words:
    title: 復習：持っていません、でも、あなた(丁寧)
    gloss: 持っていません/でも/あなた(丁寧)
    note: ندارم、اما、شما は、持っている物と持っていない物を対比したり、丁寧に質問したりするときの復習の語です。
    target_text: ندارم(私は持っていません)/ اما(しかし)/ شما(あなた、丁寧)
  prs.a1.unit41.lesson06.teach.contrast_phrase:
    title: 鍵は持っていますが、かばんは持っていません
    gloss: 鍵は持っていますが、かばんは持っていません。
    note: اما は、鍵を持っていることと、かばんを持っていないことを対比します。
  prs.a1.unit41.lesson06.teach.formal_question_phrase:
    title: 私のかばんを見ましたか？
    gloss: 私のかばんを見ましたか？
    note: شما を付けた丁寧な言い方で、相手に直接、物を見たかどうかを丁寧に尋ねるときに使います。
