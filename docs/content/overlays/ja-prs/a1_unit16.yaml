course:
  title: ダリー語 A1
  description: 初級カブール・ダリー語:旅行の基本語彙、切符の買い方、出発時刻やホームの尋ね方、短い時刻表の読み方、切符売り場での会話。
units:
  prs.a1.unit16.travel:
    title: 旅行
    description: 交通情報、切符、目的地、出発の詳細についての基本的なやり取りができる。
lessons:
  prs.a1.unit16.lesson01.basic_travel_vocab:
    title: 旅行の基本語彙
  prs.a1.unit16.lesson02.buying_a_ticket:
    title: 切符を買う
  prs.a1.unit16.lesson03.asking_departure_details:
    title: 出発時刻とホームを尋ねる
  prs.a1.unit16.lesson04.reading_a_schedule:
    title: 出発時刻表を読む
  prs.a1.unit16.lesson05.ticket_counter_dialogue:
    title: 切符売り場での会話
  prs.a1.unit16.lesson06.confirming_travel_plans:
    title: 旅行の予定を確認する
teaching:
  prs.a1.unit16.lesson01.teach.belit_word:
    title: 切符
    gloss: 切符
    note: تکت は「切符」という意味です。アフガニスタンのダリー語で日常的に使う語です。بلیط(بلیت とも綴る、イラン式の語)も通じて認められますが、普段よく耳にするのは تکت です。
    example_gloss: 切符を持っています。
  prs.a1.unit16.lesson01.teach.qatar_word:
    title: 列車
    gloss: 列車
    note: قطار は「電車・列車」という意味です。
    example_gloss: 電車は良いです。
  prs.a1.unit16.lesson01.teach.bas_word:
    title: バス
    gloss: バス
    note: بس は「バス」という意味で、アフガニスタンのダリー語でよく使われる語です。
    example_gloss: バスは良いです。
  prs.a1.unit16.lesson01.teach.maidan_hawayi_word:
    title: 空港
    gloss: 空港
    note: میدان هوایی は「空港」という意味です。このコースで一貫して使っているアフガニスタンのダリー語の語で(イランの فرودگاه ではありません)、第5単元と同じです。
    example_gloss: 空港は良いです。
  prs.a1.unit16.lesson01.teach.yak_word:
    title: A/one
    gloss: 1つの/ある
    note: یک は「1」の意味ですが、ここでは不定を表す冠詞のように使われています(切符1枚)。
    target_text: یک(1つの)
  prs.a1.unit16.lesson01.teach.az_word:
    title: From
    gloss: 〜から
    note: از は「〜から」という意味で、起点を表します(比較の「〜より」という別の使い方とは区別されます)。
    target_text: از(〜から)
  prs.a1.unit16.lesson01.teach.doo_word:
    title: 二
    gloss: 二
    note: دو は「2」という意味です。
    example_gloss: 私は切符を2枚持っています。
  prs.a1.unit16.lesson01.teach.sekooye_word:
    title: Platform two
    gloss: 2番ホーム
    note: سکوی دو は سکو(ホーム)に、エザーフェの連結語 -ی と دو(2)がついた形です。
    target_text: سکوی دو(2番ホーム)
  prs.a1.unit16.lesson02.teach.herat_word:
    title: ヘラート
    gloss: ヘラート
    note: アフガニスタン西部の主要都市です。
    example_gloss: 私はヘラートへ行きます。
  prs.a1.unit16.lesson02.teach.mikhaham_word:
    title: I want
    gloss: 〜がほしいです
    note: می‌خواهم は「私は欲しい」の縮約しない完全な形で、このコースの文体に合っています。
    target_text: می‌خواهم(私は欲しい)
  prs.a1.unit16.lesson02.teach.be_word:
    title: To
    gloss: ~へ
    note: به は目的地を表します。به هرات は「ヘラートへ」という意味です。
    target_text: به(〜へ)
  prs.a1.unit16.lesson02.teach.belit_be_herat_phrase:
    title: ヘラート行きの切符をください
    gloss: ヘラート行きの切符をください
    note: یک تکت به هرات می‌خواهم は、このレッスンの語彙を組み合わせた、切符を頼むときの標準的な言い方です。
  prs.a1.unit16.lesson03.teach.sekoo_word:
    title: プラットホーム
    gloss: プラットホーム
    note: سکو は「(駅の)ホーム」という意味です。
    example_gloss: 列車は2番ホームから出発します。
  prs.a1.unit16.lesson03.teach.harekat_mikonad_phrase:
    title: It departs
    gloss: 出発する
    note: حرکت می‌کند は「出発する/動く」の縮約しない完全な形です。
    target_text: حرکت می‌کند(出発する)
  prs.a1.unit16.lesson03.teach.kay_word:
    title: When
    gloss: いつ
    note: کی は「いつ」の意味で、時間をたずねるときに使います。
    target_text: کی(いつ)
  prs.a1.unit16.lesson04.teach.sobh_word:
    title: 朝
    gloss: 朝
    note: صبح は「朝」という意味です。
    example_gloss: 電車は午前8時に出発します。
  prs.a1.unit16.lesson04.teach.schedule_text:
    title: 時刻表の例文
    gloss: ヘラート行きの列車は午前8時に2番ホームから出発します。
    note: このユニットの旅行語彙をまとめた短い事実の案内文です。音声がないため、駅の放送の代わりにこの文章を使います。
  prs.a1.unit16.lesson05.teach.farda_word:
    title: 明日
    gloss: 明日
    note: فردا は「明日」という意味です。
    example_gloss: 明日の朝、行きます。
  prs.a1.unit16.lesson05.teach.besyar_khoob_word:
    title: とても良い/了解
    gloss: とても良い/了解です
    note: بسیار خوب は「了解です」「とてもよろしい」を表す正式で丁寧な言い方で、このコースの丁寧な文体に合っています(くだけた باشه ではありません)。
    example_gloss: 列車はとても良いです。
  prs.a1.unit16.lesson05.teach.dialogue_line1:
    title: 旅行者の発言
    gloss: ヘラートまでの切符をください。
  prs.a1.unit16.lesson05.teach.dialogue_line2:
    title: 販売員の質問
    gloss: いつ行かれますか?
  prs.a1.unit16.lesson05.teach.dialogue_line3:
    title: 旅行者の返事
    gloss: 明日の朝です。
  prs.a1.unit16.lesson05.teach.dialogue_line4:
    title: 販売員の確認
    gloss: 承知しました。列車は午前8時に2番ホームから出発します。
  prs.a1.unit16.lesson06.teach.tashakor_ziyad_word:
    title: どうもありがとう
    gloss: どうもありがとう
    note: تشکر زیاد は「どうもありがとう」を表す一般的な丁寧な言い方で、ユニット5・6で既に学びました。
  prs.a1.unit16.lesson06.teach.qabeli_nadara_phrase:
    title: どういたしまして
    gloss: どういたしまして
    note: قابلی نداره はお礼に対する標準的な丁寧な返事(どういたしまして)で、ユニット5・6で既に学びました。
  prs.a1.unit16.lesson06.teach.safar_khosh_phrase:
    title: 良い旅を
    gloss: 良い旅を
    note: سفر خوش は旅立つ人にかける一般的な別れの言葉で、ユニット6で既に学びました。
  prs.a1.unit16.lesson06.teach.va_word:
    title: And
    gloss: と・そして
    note: و は「と」「そして」という意味で、二つの文や語をつなぎます。
    target_text: و(そして)
