    gloss: 学校
    note: مکتب は「学校」を表すアフガニスタンのダリー語本来の言葉で、このコースの場所のユニットですでに出てきました。
    example_gloss: 私は学校で働いています。
  prs.a1.unit18.lesson02.teach.in_word:
    title: 〜で、〜に
    gloss: ~で、~に
    note: در は何かが行われる場所を示します。در مکتب は「学校で」という意味です。
    target_text: در(〜で/〜に)
  prs.a1.unit18.lesson02.teach.i_work_word:
    title: 私は働いています
    gloss: 私はします/私は働きます
    note: می‌کنم は کردن(する)の一人称・現在形です。کار می‌کنم は直訳すると「仕事をする」、つまり「働いています」という意味です。
    target_text: کار می‌کنم(私は働きます)
  prs.a1.unit18.lesson03.teach.where_word:
