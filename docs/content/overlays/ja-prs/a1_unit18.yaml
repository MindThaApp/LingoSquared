    note: می‌دهد は دادن(与える)の三人称・現在形です。درس می‌دهد は直訳すると「授業をする」、つまり「教えています」という意味です。
    target_text: می‌دهد(彼/彼女は与えます―درس می‌دهد は「教えます」の意味)
