    example_gloss: 私は店主です。
  prs.a1.unit18.lesson01.teach.work_word:
    title: 仕事
    gloss: 仕事
    note: کار は「仕事」という意味です。
    example_gloss: 私は仕事があります。
  prs.a1.unit18.lesson01.teach.am_word:
    title: 私は〜です
    gloss: 私は〜です
    note: استم は一人称の丁寧な「です」(コピュラ)で、このコースで使っている استم/استین の丁寧な言い方に沿っています。
    target_text: استم(私は〜です)
  prs.a1.unit18.lesson02.teach.office_word:
    title: 事務所
    gloss: オフィス
    note: دفتر は「事務所、オフィス」という意味です。
    example_gloss: 私はオフィスで働いています。
  prs.a1.unit18.lesson02.teach.shop_word:
    title: お店
    gloss: 店
    note: دوکان は「店」という意味です。
    example_gloss: 私は店で働いています。
  prs.a1.unit18.lesson02.teach.hospital_word:
