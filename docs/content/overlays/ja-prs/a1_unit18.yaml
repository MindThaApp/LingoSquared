    note: است は三人称の「です」(コピュラ)です。معلم است は「(彼/彼女は)先生です」という意味です。
    target_text: است(〜です―三人称)
  prs.a1.unit18.lesson04.teach.he_she_works_word:
    title: 彼/彼女は働いています
    gloss: 彼/彼女は働きます
    note: می‌کند は کردن(する)の三人称・現在形です。کار می‌کند は「彼/彼女は働いています」という意味です。
    target_text: کار می‌کند(彼/彼女は働きます)
  prs.a1.unit18.lesson04.teach.laila_word:
    title: ライラ
