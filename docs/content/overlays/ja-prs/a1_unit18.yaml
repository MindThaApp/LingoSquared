    target_text: چیست(何ですか)
  prs.a1.unit18.lesson06.teach.yes_word:
    title: はい
    gloss: はい
    note: بلی は「はい」を表す丁寧で改まった言い方で、このコースの丁寧な話し方に沿っています。
    example_gloss: はい、毎日働いています。
  prs.a1.unit18.lesson06.teach.dialogue_line1:
    title: バシールが尋ねる
    gloss: あなたの仕事は何ですか?
  prs.a1.unit18.lesson06.teach.dialogue_line2:
    title: ニガールが答える
    gloss: 私は医者です。病院で働いています。
  prs.a1.unit18.lesson06.teach.dialogue_line3:
    title: バシールが尋ねる
    gloss: 毎日働いていますか。
  prs.a1.unit18.lesson06.teach.dialogue_line4:
    title: ニガールが答える
    gloss: はい、毎日働いています。
