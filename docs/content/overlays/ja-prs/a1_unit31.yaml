course:
  title: ダリー語 A1
  description: カブール方言のダリー語入門:教育・勉強の語彙(大学、学校、専攻、学生、授業)、専攻の言い方(医学、法学、経済学、文学)、どこで勉強しているかの尋ね方と答え方、そして勉強やその感想についてのカリムとパルウィンの会話を学びます。
units:
  prs.a1.unit31.education:
    title: 教育
    description: 何を勉強しているか、どこで勉強しているか、それをどう感じているかを話しましょう。
