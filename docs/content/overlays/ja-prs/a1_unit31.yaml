teaching:
  prs.a1.unit31.lesson01.teach.education_word:
    title: 教育
    gloss: 教育・学業
    note: تحصیل は教育や学業全般を表す語で、このユニットのテーマの単語です。
    example_gloss: 教育は大切です。
  prs.a1.unit31.lesson01.teach.university_word:
    title: 大学
    gloss: 大学
    note: پوهنتون は「大学」の意味で、アフガニスタンで標準的な語です(カブール大学の名称にも使われます)。イランで使われる دانشگاه とは異なります。
    example_gloss: 大学はカブールにあります。
  prs.a1.unit31.lesson01.teach.school_word:
    title: 学校
    gloss: 学校
    note: مکتب は「学校」という意味です。
    example_gloss: この学校は良いです。
  prs.a1.unit31.lesson01.teach.field_word:
    title: 専攻
    gloss: 専攻・専門分野
    note: رشته は専攻や大学での専門分野を表す、ペルシア語・ダリー語に共通の標準的な語です。
    example_gloss: 私の専攻は医学です。
  prs.a1.unit31.lesson01.teach.student_word:
    title: 学生
    gloss: 学生
    note: محصل は「大学生」を表す、アフガニスタンのダリー語で標準的な語です。イランで使われる دانشجو とは異なります。
    example_gloss: 彼/彼女は学生です。
  prs.a1.unit31.lesson01.teach.lesson_word:
    title: 授業
    gloss: 授業・勉強
    note: درس は「授業」の意味で、خواندن(読む)と組み合わせて「勉強する」という複合動詞表現になります。
    example_gloss: 私は毎日勉強します。
  prs.a1.unit31.lesson01.teach.review_khandan:
    title: To study
    gloss: 授業 + 読む → 私は勉強します
    note: درس(授業)と خواندن(読む)が組み合わさって درس می‌خوانم(私は勉強します)になります。直訳は「授業を読む」で、このコースでは新しい複合動詞のパターンです。
    target_text: درس (授業・勉強) + خواندن (読む) = درس می‌خوانم (私は勉強します)
  prs.a1.unit31.lesson01.teach.combined_sentence:
    title: 大学で勉強しています
    gloss: 私は大学で勉強しています。
    note: من(私・復習)、در(〜で・復習)、پوهنتون、درس می‌خوانم を組み合わせた文です。
  prs.a1.unit31.lesson02.teach.medicine_word:
    title: 薬
    gloss: 薬
    note: طب は専攻分野としての「医学」を表す、ペルシア語・ダリー語に共通の標準的な語です。
    example_gloss: 医学は難しいです。
  prs.a1.unit31.lesson02.teach.law_word:
    title: 法学
    gloss: 法学
    note: حقوق は専攻分野としての「法学」を表す、ペルシア語・ダリー語に共通の標準的な語です。
    example_gloss: 法学は面白いです。
  prs.a1.unit31.lesson02.teach.economics_word:
    title: 経済学
    gloss: 経済学
    note: اقتصاد は専攻分野としての「経済学」を表す、ペルシア語・ダリー語に共通の標準的な語です。
    example_gloss: 経済学も難しいです。
  prs.a1.unit31.lesson02.teach.literature_word:
    title: 文学
    gloss: 文学
    note: ادبیات は専攻分野としての「文学」を表す、ペルシア語・ダリー語に共通の標準的な語です。
    example_gloss: 私は文学が好きです。
  prs.a1.unit31.lesson02.teach.reshte_ast_phrase:
    title: 私の専攻は医学です
    gloss: 私の専攻は医学です。
    note: رشته من(私の専攻・復習)に、ここで初めて出てくる است(です)を組み合わせた文です。
  prs.a1.unit31.lesson02.teach.mikhanam_subject_phrase:
    title: 私は医学を勉強しています
    gloss: 私は医学を勉強しています。
    note: من ... می‌خوانم(私は〜を勉強します・復習)を、طب などの専攻名にそのまま当てはめた文です。
  prs.a1.unit31.lesson03.teach.review_koja:
    title: Where
    gloss: どこ
    note: کجا は「どこ」という意味です。
    target_text: کجا (どこ)
  prs.a1.unit31.lesson03.teach.review_mikhanin:
    title: You study (formal)
    gloss: あなたは勉強します(丁寧)
    note: درس می‌خوانین は丁寧な「あなたは勉強します」で、これまでの -ین の丁寧形の動詞パターン(例:ユニット30の استفاده می‌کنین)と同じです。
    target_text: درس می‌خوانین (あなたは勉強します・丁寧)
  prs.a1.unit31.lesson03.teach.question_where:
    title: どこで勉強していますか?
    gloss: どこで勉強していますか?
    note: شما(あなた・丁寧、復習)、کجا(どこ)、درس、می‌خوانین を組み合わせた文です。
  prs.a1.unit31.lesson03.teach.answer_kabul_university:
    title: 私はカブール大学で勉強しています
    gloss: 私はカブール大学で勉強しています。
    note: من در ... درس می‌خوانم(私は〜で勉強します・復習)に、پوهنتون کابل(カブール大学)を組み合わせた文です。
  prs.a1.unit31.lesson04.teach.review_mikhanad:
    title: He/she studies
    gloss: 彼/彼女は勉強します
    note: درس می‌خواند は3人称の形で、これまでの -د の3人称の動詞パターン(例:ユニット30の استفاده می‌کند)と同じです。
    target_text: درس می‌خواند (彼/彼女は勉強します・3人称)
  prs.a1.unit31.lesson04.teach.review_to_mikhani:
    title: You (informal) / you study (informal)
    gloss: あなた(くだけた言い方)/ あなたは勉強します(くだけた言い方)
    note: تو と می‌خوانی は、カリムとパルウィンの間で使われているくだけた言い方です。
    target_text: تو (あなた・くだけた言い方) / می‌خوانی (あなたは勉強します・くだけた言い方)
  prs.a1.unit31.lesson04.teach.dialogue_line1:
    title: カリム:パルウィン、あなたはどこで勉強していますか?
    gloss: パルウィン、あなたはどこで勉強していますか?
  prs.a1.unit31.lesson04.teach.dialogue_line2:
    title: パルウィン:私はカブール大学で勉強しています。専攻は医学です。
    gloss: 私はカブール大学で勉強しています。専攻は医学です。
  prs.a1.unit31.lesson04.teach.dialogue_line3:
    title: カリム:医学は難しいですか?
    gloss: 医学は難しいですか?
  prs.a1.unit31.lesson04.teach.dialogue_line4:
    title: パルウィン:はい、難しいですが面白いです。あなたはどうですか?
    gloss: はい、難しいですが面白いです。あなたはどうですか?
  prs.a1.unit31.lesson04.teach.dialogue_line5:
    title: カリム:私は学校で勉強しています。
    gloss: 私は学校で勉強しています。
  prs.a1.unit31.lesson04.teach.dialogue_line6:
    title: パルウィン:すばらしい!
    gloss: すばらしい!
  prs.a1.unit31.lesson05.teach.reading_passage:
    title: 教育についての読み物
    gloss: パルウィンはカブール大学で勉強しています。専攻は医学です。医学は難しいですが面白いです。カリムは学校で勉強しています。
  prs.a1.unit31.lesson06.teach.review_like_have_time:
    title: I like / time / I don't have
    gloss: 好きです / 時間 / ありません
    note: دوست دارم(好きです)、وقت(時間)、ندارم(ありません)は、第11課・第14課・第26課・第29課・第30課の復習です。
    target_text: دوست دارم (好きです) / وقت (時間) / ندارم (ありません)
  prs.a1.unit31.lesson06.teach.wrap_summary:
    title: 教育は好きですが、時間がありません
    gloss: 教育は好きですが、時間がありません。
    note: تحصیل را دوست دارم(教育が好きです。復習の構文)と اما وقت ندارم(でも時間がありません)を組み合わせた文です。
