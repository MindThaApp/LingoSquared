course:
  title: ダリー語 A1
  description: カーブルのダリー語・初級:よく使う三つの動詞(行く、食べる、する/働く)の単純過去形、昨日のことを書いた短い文章と長めの文章の読解、そして昨日何をしたかを尋ねる会話。
units:
  prs.a1.unit20.past_events:
    title: 昨日の出来事
    description: 単純過去形を使って、昨日したことを話してみましょう。
