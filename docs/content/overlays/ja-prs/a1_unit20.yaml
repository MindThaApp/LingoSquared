  prs.a1.unit20.lesson06.yesterday_dialogue:
    title: 昨日についての会話
teaching:
  prs.a1.unit20.lesson01.teach.yesterday_word:
    title: 昨日
    gloss: 昨日
    note: دیروز は「昨日」という意味です。
    example_gloss: 昨日行きました。
  prs.a1.unit20.lesson01.teach.office_word:
    title: 職場へ
    gloss: 職場へ
    note: به دفتر は「職場へ」という意味です。日課の課で既に出てきました。
    example_gloss: 職場へ行きました。
  prs.a1.unit20.lesson01.teach.went_word:
    title: I went
    gloss: 私は行った
    note: رفتم は رفتن(行く)の一人称単数の単純過去形です。
    target_text: رفتم(行きました -- رفتن の過去形)
  prs.a1.unit20.lesson02.teach.breakfast_word:
    title: 朝食
    gloss: 朝食
    note: صبحانه は「朝食」という意味です。日課の課で既に出てきました。
    example_gloss: 朝食を食べました。
  prs.a1.unit20.lesson02.teach.ate_word:
    title: I ate
    gloss: 食べました
    note: خوردم は خوردن(食べる)の一人称単数の単純過去形です。
    target_text: خوردم(食べました -- خوردن の過去形)
  prs.a1.unit20.lesson03.teach.work_word:
    title: 仕事
    gloss: 仕事
    note: کار は「仕事」(名詞)という意味です。
    example_gloss: 働きました。
  prs.a1.unit20.lesson03.teach.did_word:
    title: I did
    gloss: しました/作りました
    note: کردم は کردن(する・作る)の一人称単数の単純過去形です。کار کردم は直訳すると「仕事をしました」で、「働きました」という意味になります。
    target_text: کردم(しました/作りました -- کردن の過去形)
  prs.a1.unit20.lesson04.teach.yesterday_text:
    title: 昨日の短い記録
    gloss: 昨日、職場へ行きました。朝食を食べました。働きました。
    note: 書き手が昨日したことを一人称で短く書いた文章です。この課で学ぶ新しい過去形の動詞を組み合わせています。
  prs.a1.unit20.lesson05.teach.seven_oclock:
    title: 七時
    gloss: 七時
    note: ساعت هفت は「七時」という意味です。時間や日課の課で既に出てきました。
    example_gloss: 七時に行きました。
  prs.a1.unit20.lesson05.teach.tired_word:
    title: 疲れた
    gloss: 疲れた
    note: خسته は「疲れた」という意味です。
    example_gloss: 疲れました。
  prs.a1.unit20.lesson05.teach.became_word:
    title: I became
    gloss: なりました
    note: شدم は شدن(なる)の一人称単数の単純過去形です。日課の課の بیدار می‌شوم(起きます)と同じ動詞です。خسته شدم は直訳すると「疲れた状態になりました」で、「疲れました」という意味になります。
    target_text: شدم(なりました -- شدن の過去形)
  prs.a1.unit20.lesson05.teach.longer_yesterday_text:
    title: もう少し長い昨日の記録
    gloss: 昨日、七時に職場へ行きました。朝食を食べました。働きました。疲れました。
    note: 先ほどの記録に、具体的な時間と、その後の書き手の気持ちを加えたものです。
  prs.a1.unit20.lesson06.teach.names:
    title: ザルミナとホマユーン
    gloss: ザルミナ、ホマユーン
    note: このコースに繰り返し登場する人物で、時間や日課の課で最初に紹介されました。
    example_gloss:
    - 私はザルミナです。
    - 私はホマユーンです。
  prs.a1.unit20.lesson06.teach.where_word:
    title: Where
    gloss: どこ
    note: کجا は「どこ」という意味です。
    target_text: کجا(どこ)
  prs.a1.unit20.lesson06.teach.you_went_word:
    title: You went
    gloss: あなたは行きました
    note: رفتی は رفتن(行く)の二人称単数の単純過去形です。
    target_text: رفتی(あなたは行きました -- رفتن の二人称)
  prs.a1.unit20.lesson06.teach.you_worked_word:
    title: You worked
    gloss: あなたはしました/働きました
    note: کردی は کردن(する・作る)の二人称単数の単純過去形です。
    target_text: کردی(あなたはしました/働きました -- کردن の二人称)
  prs.a1.unit20.lesson06.teach.she_went_word:
    title: She/he went
    gloss: 彼女は行きました/彼は行きました
    note: رفت は رفتن の三人称単数の単純過去形で、語尾のない過去語幹そのままの形です。
    target_text: رفت(彼・彼女は行きました -- رفتن の三人称。ザルミナについての会話をまとめるために必要)
  prs.a1.unit20.lesson06.teach.she_worked_word:
    title: She/he worked
    gloss: 彼女はしました・働きました/彼はしました・働きました
    note: کرد は کردن の三人称単数の単純過去形で、過去語幹そのままの形です。
    target_text: کرد(彼・彼女はしました/働きました -- کردن の三人称)
  prs.a1.unit20.lesson06.teach.she_became_word:
    title: She/he became
    gloss: 彼は〜になった/彼女は〜になった
    note: شد は شدن の3人称単数の単純過去形で、過去語幹そのままの形です。
    target_text: شد(彼・彼女はなりました -- شدن の三人称)
  prs.a1.unit20.lesson06.teach.yes_word:
    title: はい
    gloss: はい
    note: بلی は「はい」を表す丁寧で改まった言い方で、このコースの文体に合っています。
    example_gloss: はい、働きました。
  prs.a1.unit20.lesson06.teach.dialogue_line1:
    title: ホマユーンの質問
    gloss: ザルミナさん、昨日はどこへ行きましたか?
  prs.a1.unit20.lesson06.teach.dialogue_line2:
    title: ザルミナの答え
    gloss: オフィスへ行きました。
  prs.a1.unit20.lesson06.teach.dialogue_line3:
    title: ホマユーンの質問
    gloss: 仕事をしましたか?
  prs.a1.unit20.lesson06.teach.dialogue_line4:
    title: ザルミナの答え
    gloss: はい、仕事をしました。疲れました。
