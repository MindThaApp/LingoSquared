course:
  title: ダリー語 A1
  description: カブール方言ダリー語の初級:基本の部屋(寝室・台所・トイレ)、家の中の物(テーブル・椅子・ベッド・窓)、数量と場所の組み合わせ、短い家の説明と長めの家の説明の読解、そして誰かの家について尋ねる会話。
units:
  prs.a1.unit19.housing:
    title: 住まい
    description: 基本的な家、部屋、家の中の物、位置を説明する。
lessons:
  prs.a1.unit19.lesson01.room_words:
    title: 部屋の単語
  prs.a1.unit19.lesson02.object_words:
    title: 家の中の物の単語
  prs.a1.unit19.lesson03.quantity_and_location:
    title: 数量と場所
  prs.a1.unit19.lesson04.reading_a_home_description:
    title: 家の説明を読む
  prs.a1.unit19.lesson05.reading_a_longer_description:
    title: 長めの家の説明を読む
  prs.a1.unit19.lesson06.home_dialogue:
    title: 誰かの家についての会話
teaching:
  prs.a1.unit19.lesson01.teach.house_word:
    title: 家・自宅
    gloss: 家
    note: خانه は「家」「自宅」という意味です。
    example_gloss: 私は家を持っています。
  prs.a1.unit19.lesson01.teach.room_word:
    title: 部屋
    gloss: 部屋
    note: اتاق は「部屋」という意味です。
    example_gloss: 私の家には寝室があります。
  prs.a1.unit19.lesson01.teach.sleep_word:
    title: 寝る
    gloss: 睡眠
    note: خواب は「睡眠」という意味です。اتاق خواب は直訳すると「眠る部屋」、つまり寝室です。
    example_gloss: 私の家には寝室があります。
  prs.a1.unit19.lesson01.teach.kitchen_word:
    title: キッチン
    gloss: 台所
    note: آشپزخانه は「キッチン」の意味です。
    example_gloss: 私の家にはキッチンがあります。
  prs.a1.unit19.lesson01.teach.bathroom_word:
    title: バスルーム
    gloss: 浴室
    note: تشناب はアフガニスタンのダリー語で使う標準的な言い方で、トイレ・お手洗いを指します。イランのペルシア語の دستشویی とは異なります。
    example_gloss: 私の家にはバスルームがあります。
  prs.a1.unit19.lesson01.teach.have_word:
    title: I have
    gloss: 私には~がいる・ある
    note: دارم は داشتن(持つ)の一人称・現在形です。
    target_text: دارم(私は持っています)
  prs.a1.unit19.lesson02.teach.table_word:
    title: テーブル
    gloss: テーブル
    note: میز は「テーブル」の意味です。
    example_gloss: 私はテーブルを持っています。
  prs.a1.unit19.lesson02.teach.chair_word:
    title: 椅子
    gloss: 椅子
    note: چوکی はアフガニスタンのダリー語で使う標準的な「椅子」の言い方で、イランのペルシア語の صندلی とは異なります。
    example_gloss: 私は椅子を持っています。
  prs.a1.unit19.lesson02.teach.bed_word:
    title: ベッド
    gloss: ベッド
    note: تخت は「ベッド」の意味です。
    example_gloss: 私はベッドを持っています。
  prs.a1.unit19.lesson02.teach.window_word:
    title: 窓
    gloss: 窓
    note: کلکین はアフガニスタンのダリー語で使う標準的な「窓」の言い方で、イランのペルシア語の پنجره とは異なります。
    example_gloss: 私は窓のある部屋を持っています。
  prs.a1.unit19.lesson03.teach.two_word:
    title: 二
    gloss: 二
    note: دو は「2」という意味です。
    example_gloss: 私は部屋が2つあります。
  prs.a1.unit19.lesson03.teach.three_word:
    title: 三
    gloss: 三
    note: سه は「3」という意味です。
    example_gloss: 私は部屋が3つあります。
  prs.a1.unit19.lesson03.teach.near_word:
    title: 近く
    gloss: ~の近く
    note: نزدیک は「近く」という意味です。
    example_gloss: テーブルは窓の近くにあります。
  prs.a1.unit19.lesson03.teach.is_word:
    title: Is
    gloss: です・ある
    note: است は「です・ある」にあたる語(コピュラ)です。میز نزدیک کلکین است は「テーブルは窓の近くにあります」という意味です。
    target_text: است(です・ある)
  prs.a1.unit19.lesson04.teach.this_word:
    title: This
    gloss: これ
    note: این は「これ」という意味です。
    target_text: این(これ・この)
  prs.a1.unit19.lesson04.teach.has_word:
    title: It has
    gloss: 持っている
    note: دارد は داشتن(持つ)の三人称・現在形です。
    target_text: دارد(それは持っています -- 三人称)
  prs.a1.unit19.lesson04.teach.one_word:
    title: 一
    gloss: 一
    note: یک は「1」という意味です。
    example_gloss: 私は台所が1つあります。
  prs.a1.unit19.lesson04.teach.and_word:
    title: And
    gloss: と・そして
    note: و は「と」「そして」という意味で、二つの文や語をつなぎます。
    target_text: و(と・そして)
  prs.a1.unit19.lesson04.teach.description_text:
    title: 短い家の説明
    gloss: この家には寝室が2つあります。台所とトイレが1つずつあります。
    note: 部屋の数を述べる、三人称の短い説明です。
  prs.a1.unit19.lesson05.teach.big_word:
    title: 大きい
    gloss: 大きい
    note: بزرگ は「大きい」という意味です。比較の単元で、比較級 بزرگ‌تر としてすでに学びました。
    example_gloss: 台所は広いです。
  prs.a1.unit19.lesson05.teach.across_from_word:
    title: Across from
    gloss: 向かい側
    note: مقابل は「向かい側」「反対側」という意味です。
    target_text: مقابل(向かい側)
  prs.a1.unit19.lesson05.teach.longer_description_text:
    title: 長めの家の説明
    gloss: この家には寝室が2つあります。台所とトイレが1つずつあります。台所は広いです。テーブルは窓の向かい側にあります。
    note: 先ほどの短い説明に、広さと位置の情報を加えた文章です。
  prs.a1.unit19.lesson06.teach.names:
    title: ライラとフェリドゥーン
    gloss: ライラ、フェリドゥーン
    note: このコースによく登場する人物です。
    example_gloss:
    - 私はライラです。
    - 私はフェリドゥーンです。
  prs.a1.unit19.lesson06.teach.you_word:
    title: You (polite)
    gloss: あなた
    note: شما は丁寧な二人称の代名詞(あなた)です。
    target_text: شما(あなた -- 丁寧)
  prs.a1.unit19.lesson06.teach.how_many_word:
    title: How many
    gloss: 何人、いくつ
    note: چند は「いくつ」という意味です。
    target_text: چند(いくつ)
  prs.a1.unit19.lesson06.teach.yes_word:
    title: はい
    gloss: はい
    note: بلی は「はい」の丁寧・改まった言い方で、このコースの丁寧な話し方に合っています。
    example_gloss: はい、広いです。
  prs.a1.unit19.lesson06.teach.dialogue_line1:
    title: フェリドゥーンの質問
    gloss: お宅には部屋がいくつありますか。
  prs.a1.unit19.lesson06.teach.dialogue_line2:
    title: ライラの答え
    gloss: 寝室が2つあります。
  prs.a1.unit19.lesson06.teach.dialogue_line3:
    title: フェリドゥーンの質問
    gloss: 台所は広いですか。
  prs.a1.unit19.lesson06.teach.dialogue_line4:
    title: ライラの答え
    gloss: はい、広いです。
