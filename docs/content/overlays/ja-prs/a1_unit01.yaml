      right: y/長いi
  prs.a1.unit01.lesson01.exercise05.build_salam:
    instruction: 文字を並べて سلام を作ってください。
    accepted_answers:
    - value:
      - س
      - ل
      - ا
      - م
      status: correct
    feedback: س ل ا م を並べると سلام になります。
  prs.a1.unit01.lesson01.exercise06.recognize_salam:
    instruction: 「こんにちは」という意味の、つながった形の単語を選んでください。
    correct_option: سلام
    distractors:
    - شلام
    - سلیم
    - سال
    accepted_answers:
    - value: سلام
      status: correct
    feedback: سلام は「こんにちは」という意味です。
    prompt_blocks:
    - こんにちは
  prs.a1.unit01.lesson01.exercise07.rtl_direction:
    instruction: ダリー語は右から左へ書きますか。
    options:
    - はい
    - いいえ
    accepted_answers:
    - value: はい
      status: correct
    feedback: ダリー語の文字は右から左へ書きます。
  prs.a1.unit01.lesson01.exercise08.copy_salam:
    instruction: سلام をそのまま書き写してください。
    accepted_answers:
    - value: سلام
      status: correct
    feedback: 正しい綴りは سلام です。
  prs.a1.unit01.lesson02.exercise01.recognize_greeting_reading:
    instruction: このフレーズはどんな意味ですか？
    correct_option: こんにちは(あなたに平安がありますように)
    distractors:
    - さようなら
    - ようこそ
    - ありがとう
    accepted_answers:
    - value: こんにちは(あなたに平安がありますように)
      status: correct
    feedback: سلام علیکم は「こんにちは」の意味です(直訳は「あなたがたに平安がありますように」)。
  prs.a1.unit01.lesson02.exercise02.translate_response:
    instruction: ダリー語に訳してください：「あなたにも平安がありますように」(سلام علیکم に対する決まった返事)
    accepted_answers:
    - value: وعلیکم سلام
      status: correct
    - value: و علیکم سلام
      status: acceptable_with_note
      note: スペースの違いによる許容形です。
    - value: وعلیکم السلام
      status: acceptable_with_note
      note: よく使われる完全な返事の変形です。
    - value: و علیکم السلام
