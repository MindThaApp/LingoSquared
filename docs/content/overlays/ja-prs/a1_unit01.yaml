        و: w/v
        ه: h
        ی: y/長いi
      status: correct
    feedback: これらの音は、このユニットでこれからも何度も出てきます。
    pairs:
    - left: خ
      right: kh
    - left: ق
      right: gh/q
    - left: ل
      right: l
    - left: م
      right: m
    - left: ن
      right: n
    - left: و
      right: w/v
