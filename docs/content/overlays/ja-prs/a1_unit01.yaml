course:
  title: ダリー語 A1
  description: ペルシア・アラビア文字の読み方、日常のアフガニスタンの話し言葉の理解、丁寧で長めのあいさつ、カブールの職場での礼儀正しい初対面の場面を学ぶ、アフガニスタン・ダリー語の初級コースです。
units:
  prs.a1.unit01.greetings:
    title: あいさつと初対面
lessons:
  prs.a1.unit01.lesson01.script_ramp:
    title: このユニットで使う文字を読む
  prs.a1.unit01.lesson02.everyday_greetings:
    title: 日常のあいさつを交わす
  prs.a1.unit01.lesson03.time_and_farewells:
    title: 時間帯に合わせてあいさつと別れの言葉を言う
  prs.a1.unit01.lesson04.formal_informal_small_talk:
    title: 丁寧な言い方とくだけた言い方で雑談する
  prs.a1.unit01.lesson05.afghan_hospitality:
    title: 家族の様子をたずね、客に敬意を示す
  prs.a1.unit01.lesson06.first_meeting_dialogue:
    title: カブールの職場での初日を迎える
teaching:
  prs.a1.unit01.lesson01.teach.alef_be_te_dal:
    title: 文字 ا、ب、ت、د
    gloss: a/ā、b、t、d
    note: ダリー語は右から左へ書きます。د は左の文字とはつながりません。
  prs.a1.unit01.lesson01.teach.re_ze:
    title: 文字 ر と ز
    gloss: r と z
    note: どちらの文字も、次の文字とはつながりません。
  prs.a1.unit01.lesson01.teach.sin_shin_sad:
    title: 文字 س、ش、ص
    gloss: s、sh、s
    note: س と ص は、普通のダリー語ではどちらも s の音を表します。ش は sh を表します。
  prs.a1.unit01.lesson01.teach.jim_che_he_khe:
    title: 文字 ج、چ、ح、خ
    gloss: j、ch、h、kh
    note: چ は ch です。خ はふつう kh とローマ字で表される音です。
  prs.a1.unit01.lesson01.teach.ayn_ghayn_fe_qaf:
    title: 文字 ع、غ、ف、ق
    gloss: ʿ、gh、f、q
    note: غ と ق の正確な発音は話し手によって異なります。綴りの上では区別して覚えましょう。
  prs.a1.unit01.lesson01.teach.ke_gaf_lam_mim:
    title: 文字 ک、گ、ل、م
    gloss: k、g、l、m
    note: ک はペルシア語の kaf で、ダリー語で k を表すときに使う形です。ل と م は前後の文字の両方につながります。
  prs.a1.unit01.lesson01.teach.nun_vav_he_ye:
    title: 文字 ن、و、ه、ی
    gloss: n、w/v/o/u、h、y/長いi
    note: ی はペルシア語の yeh で、y と長母音の ee を表します。و は子音（w/v）にも長母音（o/oo）にもなります。
  prs.a1.unit01.lesson01.teach.connected_salam:
    title: つながった単語を読む
    gloss: こんにちは
    note: 文字がつながって سلام になります。短母音は通常書きません。
    example_gloss: こんにちは！ 私はカリムです。
  prs.a1.unit01.lesson02.teach.salam_alaikum:
    title: 敬意のこもった日常のあいさつ
    gloss: あなたに平安がありますように／こんにちは
    note: سلام علیکم はアフガニスタンで広く使われ、親しい相手にも敬意を示したい相手にも使えます。
  prs.a1.unit01.lesson02.teach.wa_alaikum_salam:
    title: あいさつを返す
    gloss: あなたにも平安がありますように
    note: وعلیکم سلام は、慣例として سلام علیکم への返事に使います。السلام を含む形も正解として受け付けます。
  prs.a1.unit01.lesson02.teach.salam:
    title: 短いあいさつ
    gloss: こんにちは
    note: سلام は、より短く気軽に使えるあいさつです。
    example_gloss: こんにちは、お元気ですか？
  prs.a1.unit01.lesson02.teach.khosh_amadeed:
    title: ようこそ
    gloss: ようこそ
    note: خوش آمدین は、丁寧な話し言葉の歓迎のあいさつで、一人にも複数の人にも使います。
  prs.a1.unit01.lesson02.teach.tashakor:
    title: ありがとう
    gloss: ありがとう
    note: このコースでは、アフガニスタンのダリー語で好まれる形として تشکر を使います。ممنون と ممنونم は、理解しておくとよい別の言い方です。
    example_gloss: どうもありがとうございます。
  prs.a1.unit01.lesson02.teach.khahesh:
    title: お礼に対する改まった返事
    gloss: どういたしまして
    note: خواهش می‌کنم は、地域を問わずペルシア語圏で使われる丁寧な返事です。アフガニスタン特有の口語表現として紹介しているわけではありません。
  prs.a1.unit01.lesson02.teach.khoda_hafez:
    title: さようなら
    gloss: さようなら
    note: خدا حافظ はアフガニスタンのダリー語で一般的な別れのあいさつで、二語に分けて書かれることも多いです。
  prs.a1.unit01.lesson03.teach.sobh_bekheyr:
    title: 朝のあいさつ
    gloss: おはようございます
    note: صبح بخیر は朝に使います。
  prs.a1.unit01.lesson03.teach.rooz_bekheyr:
    title: 昼間のあいさつ
    gloss: こんにちは(良い一日を)
    note: روز بخیر は、昼間に使う丁寧なあいさつです。
  prs.a1.unit01.lesson03.teach.asr_bekheyr:
    title: 夕方に近い時間のあいさつ
    gloss: こんにちは（午後）／こんばんは
    note: عصر بخیر は、一日の遅い時間帯に合います。
  prs.a1.unit01.lesson03.teach.shab_bekheyr:
    title: 夜の表現
    gloss: おやすみなさい
    note: شب بخیر は、夜を締めくくるときによく使い、昼間の普通の出会いの最初のあいさつには使いません。
  prs.a1.unit01.lesson03.teach.rooz_khosh:
    title: 昼間の丁寧な別れのあいさつ
    gloss: 良い一日をお過ごしください
    note: روز خوش は、地域を問わず使われる、丁寧でやや改まった別れの言葉です。アフガニスタン特有の口語表現ではありません。
  prs.a1.unit01.lesson03.teach.be_omide_didar:
    title: 次に会うときまで
    gloss: また会えるのを楽しみにしています
    note: به امید دیدار は、温かさと敬意のこもった別れの言葉です。
  prs.a1.unit01.lesson04.teach.polite_question:
    title: 丁寧に相手の調子をたずねる
    gloss: お元気ですか。
    note: استین は、شما とともに使う、アフガニスタンのダリー語で一般的な丁寧な話し言葉の形です。
  prs.a1.unit01.lesson04.teach.informal_question:
    title: 同年代や親しい友人にたずねる
    gloss: お元気ですか。
    note: تو と استی はくだけた単数の形です。年上の人や初対面の人に、この組み合わせを無意識に使わないようにしましょう。
  prs.a1.unit01.lesson04.teach.good_answer:
    title: 元気だと伝える
    gloss: 元気です、ありがとう。
    note: استم は「私は〜です」という意味です。このコースでは、アフガニスタンのダリー語の話し言葉の形を一貫して使います。
  prs.a1.unit01.lesson04.teach.jor_answer:
    title: 健康だ、元気だと伝える
    gloss: 元気です。
    note: جور には「調子がよい、健康である」という意味合いがあり、アフガニスタンのあいさつでよく使われます。
  prs.a1.unit01.lesson04.teach.not_bad:
    title: 控えめな答え
    gloss: 悪くないです。
    note: بد نیستم は、中立的な答え方です。
  prs.a1.unit01.lesson04.teach.and_you:
    title: 同じ質問を返す
    gloss: あなたは？
    note: و شما؟ を使うと、礼儀正しく簡潔にやりとりを続けられます。
  prs.a1.unit01.lesson04.teach.everyone_well:
    title: あいさつを広げる
    gloss: 皆さんお元気ですか？
    note: アフガニスタンのあいさつは、用件に入る前に家族の様子をたずねる形で続くことがあります。
  prs.a1.unit01.lesson05.teach.family_well:
    title: 相手の家族の様子をたずねる
    gloss: ご家族はお元気ですか？
    note: 家族の様子をたずねるのは、アフガニスタンの長めのあいさつによくある一部です。このコースでは「あなたの」を表す形を فامیل‌تان と綴ります。
  prs.a1.unit01.lesson05.teach.household_well:
    title: 家族全体の様子をたずねる
    gloss: お宅の皆さんはお元気ですか？
    note: اهل خانه は、家族の一人ひとりをまとめて指します。
  prs.a1.unit01.lesson05.teach.everyone_well:
    title: 家族についての質問に答える
    gloss: おかげさまで、みんな元気です。
    note: ここでの شکر は、感謝を表す短縮表現です。食べ物の「砂糖」という本来の意味ではありません。
  prs.a1.unit01.lesson05.teach.zenda_bashin:
    title: 温かく丁寧な返事をする
    gloss: どうぞ長生きしてください／ありがとうございます。
    note: زنده باشین は、アフガニスタンでよく使われる礼儀正しい決まり文句で、お礼や親切な言葉への返事としてよく言います。باشین は「あなた」に対する丁寧な話し言葉の形です。
  prs.a1.unit01.lesson05.teach.own_home:
    title: 客を温かく迎える
    gloss: ご自宅だと思ってくつろいでください。
    note: خانهٔ خودتان است は、客に歓迎していることを伝えて安心させる言葉です。
  prs.a1.unit01.lesson05.teach.seat_of_honor:
    title: 上座をすすめる
    gloss: どうぞ上座にお座りください。
    note: 客間では、بالا بفرمایین は、入口から遠い、より敬意を表す席へ客を案内する言葉です。必ずしも「上の階」という意味ではありません。
  prs.a1.unit01.lesson05.teach.elders_first:
    title: まず年長者にあいさつする
    gloss: まず年長の方にごあいさつします。
    note: 年長者に先にあいさつすることは、敬意を表します。体を使ったあいさつは、関係や性別、相手の様子によって変わります。握手が適切だと決めつけないようにしましょう。
  prs.a1.unit01.lesson06.teach.daftar:
    title: 事務所
    gloss: オフィス
    note: دفتر は、事務所や職場を指します。
    example_gloss: 私の事務所はカブールにあります。
  prs.a1.unit01.lesson06.teach.kabul:
    title: カブール
    gloss: カブール
    note: کابل はアフガニスタンの首都で、この会話の舞台です。
    example_gloss: 私はカブールに住んでいます。
  prs.a1.unit01.lesson06.teach.line01:
    title: ハーメドが新しい同僚として自己紹介する
    gloss: ハーメドは、自分が新しい同僚だと言います。
    note: 二人とも、カブールの職場で出会った成人男性の同僚です。
  prs.a1.unit01.lesson06.teach.line02:
    title: ナジーブが彼を迎えて名前をたずねる
    gloss: ナジーブは彼を迎えて、名前をたずねます。
    note: خوش آمدین は、丁寧な話し言葉の歓迎のあいさつで、一人にも複数の人にも使えます。
  prs.a1.unit01.lesson06.teach.line03:
    title: ハーメドが名前を言う
    gloss: ハーメドが名前を言います。
    note: نامم حامد است(私の名前はハーメドです)は日常の話し言葉の形です。نامم は نام + -م(私の)でできています。書くときは نام من حامد است も使われます。どちらも正しい表現です。
  prs.a1.unit01.lesson06.teach.line04:
    title: ナジーブが自己紹介をして、会えてうれしいと言う
    gloss: ナジーブが自己紹介をして、会えてうれしいと言います。
    note: از آشنایی با شما خوش شدم は「知り合えたこと」をはっきり表すので、初対面にふさわしい表現です。
  prs.a1.unit01.lesson06.teach.line05:
    title: ハーメドも会えてうれしいと答え、ナジーブの調子をたずねる
    gloss: ハーメドも会えてうれしいと答え、ナジーブの調子をたずねます。
    note: 初めて会う同僚どうしなので、この会話では丁寧な شما と استین を使い続けています。
  prs.a1.unit01.lesson06.teach.line06:
    title: ナジーブが答える
    gloss: ナジーブは元気だと言い、お礼を述べます。
    note: جور استم، تشکر は、このユニットで学んだとおり、調子をたずねられたときの答えです。
  prs.a1.unit01.lesson06.teach.line07:
    title: ナジーブがハーメドの家族の様子をたずねる
    gloss: ナジーブがハーメドの家族の様子をたずねます。
    note: 仕事の話に入る前に、家族の様子をたずねてあいさつを広げています。
  prs.a1.unit01.lesson06.teach.line08:
    title: ハーメドがみんな元気だと言う
    gloss: ハーメドはみんな元気だと言います。
    note: شکر، همه جور استند は、このユニットで学んだとおり、家族の様子をたずねられたときの答えです。
  prs.a1.unit01.lesson06.teach.line09:
    title: ナジーブがほかの同僚を紹介しようと申し出る
    gloss: ナジーブがほかの同僚を紹介しようと申し出ます。
    note: ここでの بفرمایین は、座ることや何かを取ることではなく、ついて来てくださいと促しています。
  prs.a1.unit01.lesson06.teach.line10:
    title: ハーメドがお礼を言って同意する
    gloss: ハーメドはお礼を言って同意します。
    note: بسیار خوب は、はっきりした肯定の返事として、ここで初めて出てきます。
  prs.a1.unit01.lesson06.teach.line11:
    title: ナジーブが温かく応じて、ハーメドの机を教える
    gloss: ナジーブが温かく応じて、ハーメドの机を教えます。
    note: この会話は、家を訪ねたときの別れのあいさつではなく、仕事の始まりで終わります。
  prs.a1.unit01.lesson06.teach.line12:
    title: ハーメドがお礼を言う
    gloss: ハーメドがお礼を言います。
    note: تشکر で、やり取りを簡潔にしめくくります。
exercises:
  prs.a1.unit01.lesson01.exercise01.recognize_sin:
    instruction: سلام はどの文字で始まりますか。
    correct_option: س
    distractors:
    - ش
    - ص
    - چ
    accepted_answers:
    - value: س
      status: correct
    feedback: سلام は س で始まります。この問題は、習った単語の綴りを問うもので、s の音を表せる文字がどれかを問うものではありません。
  prs.a1.unit01.lesson01.exercise02.recognize_che:
    instruction: ch を表す文字はどれですか？
    correct_option: چ
    distractors:
    - ج
    - خ
    - ش
    accepted_answers:
    - value: چ
      status: correct
    feedback: چ は ch を表します。
    prompt_blocks:
    - ch
  prs.a1.unit01.lesson01.exercise03.match_ke_gaf:
