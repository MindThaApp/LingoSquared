    title: ホテル・部屋・鍵
  prs.a1.unit45.lesson02.bathroom_and_reservation:
    title: バスルームと予約
  prs.a1.unit45.lesson03.room_number_and_nights:
    title: 部屋番号と宿泊数
  prs.a1.unit45.lesson04.hotel_checkin_dialogue:
    title: ホテルのチェックイン会話
  prs.a1.unit45.lesson05.reading:
    title: ホマユーンさんの予約を読もう
  prs.a1.unit45.lesson06.wrap_up:
    title: まとめ
teaching:
  prs.a1.unit45.lesson01.teach.review_this_is_in:
    title: 復習:これ、です、〜に
    gloss: これ / です / 〜に
    note: این、است、در はこのコースで繰り返し出てきた復習の語で、ホテルや部屋の話をするときに使います。
    target_text: این(これ)/ است(です)/ در(〜に・〜で)
  prs.a1.unit45.lesson01.teach.hotel_word:
    title: ホテル
    gloss: ホテル
    note: هوتل はアフガニスタンのダリー語でホテルを表す語で、و(ワーウ)を使って綴ります。イランのペルシア語の هتل とは綴りが異なります。
    example_gloss: ここはホテルです。
  prs.a1.unit45.lesson01.teach.room_word:
    title: 部屋
    gloss: 部屋
    note: اتاق は「部屋」を表す日常的なダリー語です。
    example_gloss: 部屋はホテルの中にあります。
  prs.a1.unit45.lesson01.teach.room_in_hotel_phrase:
    title: 部屋はホテルの中にあります
    gloss: 部屋はホテルの中にあります。
    note: اتاق در هوتل است は、このレッスンで学んだ語を組み合わせた文です。
  prs.a1.unit45.lesson01.teach.key_word:
    title: 鍵
    gloss: 鍵
    note: کلید は「鍵」を表す標準的なダリー語です。
    example_gloss: これは鍵です。
  prs.a1.unit45.lesson01.teach.room_key_phrase:
    title: 部屋の鍵
    gloss: 部屋の鍵
    note: کلید اتاق は کلید(鍵)と اتاق(部屋)を組み合わせた表現です。
  prs.a1.unit45.lesson01.teach.this_is_room_key_phrase:
    title: これは部屋の鍵です
    gloss: これは部屋の鍵です。
    note: این کلید اتاق است は、このレッスンで学んだ語を組み合わせた文です。
  prs.a1.unit45.lesson02.teach.review_have:
    title: 復習:持っています、(それは)持っています
    gloss: 私は持っています / それは持っています
    note: دارم と دارد は復習の語で、部屋の設備について尋ねるときに使います。
    target_text: دارم(私は持っています)/ دارد(それは持っています)
  prs.a1.unit45.lesson02.teach.bathroom_word:
    title: バスルーム
    gloss: 浴室
    note: تشناب は「バスルーム・トイレ」を表す日常的なダリー語です。
    example_gloss: 部屋にはバスルームがあります。
  prs.a1.unit45.lesson02.teach.room_has_bathroom_question_phrase:
    title: 部屋にバスルームはありますか?
    gloss: 部屋にバスルームはありますか?
    note: اتاق تشناب دارد؟ は、疑問詞を使わず、語尾を上げて尋ねる「はい・いいえ」の質問です。
  prs.a1.unit45.lesson02.teach.yes_has_bathroom_phrase:
    title: はい、バスルームがあります
    gloss: はい、バスルームがあります。
    note: بلی は「はい」を表す、復習の語です。
  prs.a1.unit45.lesson02.teach.reservation_word:
    title: 予約
    gloss: 予約
    note: رزرو は予約を表す、広く使われる外来語です。
    example_gloss: 予約しています。
  prs.a1.unit45.lesson02.teach.have_reservation_phrase:
    title: 予約があります
    gloss: 予約があります。
    note: رزرو دارم は رزرو(予約)と دارم(私は持っています)を組み合わせた表現です。
  prs.a1.unit45.lesson03.teach.review_which_number_for:
    title: 復習:いくつ・何番、〜のために、欲しいです
    gloss: いくつ・何番 / 〜のために / 私は欲しいです
    note: چند、برای、می‌خواهم は復習の語で、部屋について尋ねるときに使います。
    target_text: چند(いくつ・何番)/ برای(〜のために)/ می‌خواهم(私は欲しいです)
  prs.a1.unit45.lesson03.teach.number_word:
    title: 番号
    gloss: 番号
    note: نمبر は、部屋番号や電話番号などに使われる、アフガニスタンのダリー語の日常的な外来語で「番号」を表します。
    example_gloss: 部屋番号
  prs.a1.unit45.lesson03.teach.what_is_room_number_phrase:
    title: 部屋の番号は何番ですか?
    gloss: 部屋の番号は何番ですか?
    note: نمبر اتاق چند است؟ は چند を使って部屋の番号を尋ねる文です。
  prs.a1.unit45.lesson03.teach.review_night_numbers:
    title: 復習:夜(泊)、2、3
    gloss: 夜(泊) / 2 / 3
    note: شب、دو、سه は復習の語で、宿泊日数を伝えるときに使います。
    target_text: شب(夜・泊)/ دو(2)/ سه(3)
  prs.a1.unit45.lesson03.teach.stay_word:
    title: 私は滞在します
    gloss: 私は滞在します
    note: می‌مانم は「とどまる・滞在する」を表す動詞 ماندن から作られた形です。
    example_gloss: 2泊します。
  prs.a1.unit45.lesson03.teach.stay_two_nights_phrase:
    title: 2泊します
    gloss: 2泊します。
    note: دو شب می‌مانم は دو شب(2泊)と می‌مانم(私は滞在します)を組み合わせた表現です。
  prs.a1.unit45.lesson03.teach.for_two_nights_phrase:
    title: 2泊でお願いします
    gloss: 2泊でお願いします。
    note: برای دو شب می‌خواهم は、برای(〜のために)と復習の語 می‌خواهم を使った表現です。
  prs.a1.unit45.lesson03.teach.review_stay_formal:
    title: 復習:あなたは滞在します(丁寧)
    gloss: あなたは滞在します(丁寧)
    note: می‌مانین は می‌مانم の丁寧(複数)形で、このコースの他の می‌خواهین や کنین と同じ -ین の仲間です。
    target_text: می‌مانین(あなたは滞在します・丁寧)
  prs.a1.unit45.lesson03.teach.how_many_nights_formal_phrase:
    title: 何泊されますか?
    gloss: 何泊されますか?
    note: چند شب می‌مانین؟ は、ホテルのフロント係が尋ねる丁寧な言い方です。
  prs.a1.unit45.lesson04.teach.review_welcome_name_am:
    title: 復習:ようこそ、お名前は?、私は~です
    gloss: ようこそ/お名前は何ですか?/私は~です
    note: خوش آمدین、نام‌تان چیست؟、استم は、チェックインで使う復習の単語です。
    target_text: خوش آمدین(ようこそ)/ نام‌تان چیست؟(お名前は何ですか?)/ استم(私は〜です)
  prs.a1.unit45.lesson04.teach.review_also_how_about_please_thanks:
    title: 復習:~も、~はどうですか、どうぞ、どうもありがとう
    gloss: ~も/~はどうですか/どうぞ/どうもありがとう
    note: هم、چطور、بفرمایین、تشکر زیاد(前の単元で学習)は、会話を締めくくるときに使う復習の単語です。
    target_text: هم(も)/ چطور(いかがですか)/ بفرمایین(どうぞ)/ تشکر زیاد(どうもありがとう)
  prs.a1.unit45.lesson04.teach.breakfast_phrase:
    title: 朝食
    gloss: 朝食
    note: چای صبح は直訳すると「朝のお茶」で、アフガニスタンのダリー語で朝食を指す日常的な言い方です。چای(お茶、第8課)と صبح(朝、第16課)からできています。
  prs.a1.unit45.lesson04.teach.included_word:
    title: 含まれている
    gloss: 含まれている
    note: شامل は「含まれている」という意味で、サービスが部屋に付いていることを言うときに使います。
    example_gloss: 朝食は料金に含まれています。
  prs.a1.unit45.lesson04.teach.wifi_word:
    title: Wi-Fi
    gloss: Wi-Fi
    note: وای‌فای は「Wi-Fi」を表す一般的な外来語です。
    example_gloss: Wi-Fiもあります。
  prs.a1.unit45.lesson04.teach.dialogue_line1:
    title: ホマユーン:こんにちは。予約しています。2泊します。
    gloss: こんにちは。予約しています。2泊します。
  prs.a1.unit45.lesson04.teach.dialogue_line2:
    title: ホテルの係員:いらっしゃいませ。お名前は何ですか?
    gloss: いらっしゃいませ。お名前は何ですか?
  prs.a1.unit45.lesson04.teach.dialogue_line3:
    title: ホマユーン:ホマユーンです。
    gloss: ホマユーンです。
  prs.a1.unit45.lesson04.teach.dialogue_line4:
    title: ホテルの係員:かしこまりました。お部屋にはトイレがあり、朝食が含まれています。
    gloss: かしこまりました。お部屋にはトイレがあり、朝食が含まれています。
  prs.a1.unit45.lesson04.teach.dialogue_line5:
    title: ホマユーン:Wi-Fiはどうですか?
    gloss: Wi-Fiはどうですか?
  prs.a1.unit45.lesson04.teach.dialogue_line6:
    title: ホテルの係員:はい、Wi-Fiもあります。鍵をどうぞ。
    gloss: はい、Wi-Fiもあります。鍵をどうぞ。
  prs.a1.unit45.lesson05.teach.review_reading_words:
    title: 復習:予約、番号、5、月曜日、火曜日、そして
    gloss: 予約/番号/5/月曜日/火曜日/そして
    note: رزرو、نمبر(この単元で学習)、پنج、دوشنبه、سه‌شنبه、و は、読解文で使う復習の単語です。
    target_text: رزرو(予約)/ نمبر(番号)/ پنج(5)/ دوشنبه(月曜日)/ سه‌شنبه(火曜日)/ و(と・そして)
  prs.a1.unit45.lesson05.teach.review_stays_third_person:
    title: 復習:彼/彼女は泊まる
    gloss: 彼/彼女は泊まる
    note: می‌ماند は、この単元の前半で学んだ می‌مانم/می‌مانین の仲間の、3人称の形です。
    target_text: می‌ماند(彼・彼女は滞在します)
  prs.a1.unit45.lesson05.teach.reading_passage:
    title: ホマユーンの予約についての文章
    gloss: これはホマユーンの予約です。部屋は5番です。ホマユーンは月曜日と火曜日の2泊します。部屋にはトイレがあり、朝食が含まれています。
  prs.a1.unit45.lesson06.teach.review_but_formal_you_hour_time_numbers:
    title: 復習:でも、あなた(丁寧)、~時、時間、7、12
    gloss: でも/あなた(丁寧)/~時/時間/7/12
    note: اما、شما、ساعت、وقت(前の単元で学習)と هفت/دوازده は、時間割を述べるときに使う復習の単語です。
    target_text: اما(しかし)/ شما(あなた・丁寧)/ ساعت(〜時・時計)/ وقت(時間)/ هفت(7)/ دوازده(12)
  prs.a1.unit45.lesson06.teach.checkout_word:
    title: チェックアウト/出口
    gloss: チェックアウト/出口
    note: خروج は、وقت خروج のようにチェックアウトの時間を表すときに使います。
    example_gloss: チェックアウトの時間
  prs.a1.unit45.lesson06.teach.checkout_time_phrase:
    title: チェックアウトは12時です
    gloss: チェックアウトは12時です。
    note: وقت خروج ساعت دوازده است は、チェックアウトの時間を伝える文です。
  prs.a1.unit45.lesson06.teach.contrast_breakfast_checkout_phrase:
    title: 朝食は7時ですが、チェックアウトは12時です
    gloss: 朝食は7時ですが、チェックアウトは12時です。
    note: اما は、朝食の時間とチェックアウトの時間を対比させます。
  prs.a1.unit45.lesson06.teach.checkout_time_question_phrase:
    title: チェックアウトは何時ですか?
    gloss: チェックアウトは何時ですか?
    note: شما を使った、チェックアウトの時間を尋ねる丁寧な言い方です。
  prs.a1.unit45.lesson04.teach.review_very_good_tea_morning_and:
    target_text: بسیار خوب(とても良い)/ چای(お茶)/ صبح(朝)/ و(と・そして)
