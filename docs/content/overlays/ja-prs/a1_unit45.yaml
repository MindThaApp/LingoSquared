course:
  title: ダリー語 A1
  description: 初級のカーブル・ダリー語:ホテルでチェックインし、部屋の設備(バスルーム、朝食、Wi-Fi)や鍵について尋ね、宿泊日数を伝え、短い予約確認を読み、チェックアウトの時間を尋ねます。
units:
  prs.a1.unit45.accommodation:
    title: ホテルと部屋
    description: ホテルでチェックインし、部屋の設備や鍵について尋ね、宿泊日数を伝え、予約確認を読み、チェックアウトの時間を尋ねます。
