course:
  title: ダリー語 A1
  description: アフガニスタンのダリー語入門：町の主な場所の名前、場所のたずね方、簡単な場所の答え方、目的地までの基本的な道案内を学びます。
units:
  prs.a1.unit05.places:
    title: 町の大切な場所
lessons:
  prs.a1.unit05.lesson01.everyday_places:
    title: 町の身近な場所
  prs.a1.unit05.lesson02.civic_and_travel_places:
    title: 公共施設と交通の場所
  prs.a1.unit05.lesson03.asking_where:
    title: 場所をたずねる
  prs.a1.unit05.lesson04.simple_location_answers:
    title: 近い・遠い・ここ・あそこ
  prs.a1.unit05.lesson05.prepositions_of_place:
    title: 場所を表す前置詞
  prs.a1.unit05.lesson06.finding_pharmacy_dialogue:
    title: 近所で薬局を探そう
teaching:
  prs.a1.unit05.lesson01.teach.bazaar:
    title: 市場
    gloss: 市場/バザール
    note: بازار は、商店が並ぶ一帯を指す日常的な言葉で、通り全体や地区全体を指すこともよくあります。
    example_gloss: バザールは近いです。
  prs.a1.unit05.lesson01.teach.bank:
    title: 銀行
    gloss: 銀行
    note: بانک は外来語で、日本語の「バンク」と同じように「銀行」の意味で使われます。
    example_gloss: 銀行はどこですか？
  prs.a1.unit05.lesson01.teach.mosque:
    title: モスク
    gloss: モスク
    note: مسجد は「モスク」を表す標準的な言葉です。
    example_gloss: モスクは大きいです。
  prs.a1.unit05.lesson01.teach.hospital:
    title: 病院
    gloss: 病院
    note: شفاخانه は「病院」を表すアフガニスタンのダリー語の日常的な言葉です。イランのペルシア語の بیمارستان とは異なり、ダリー語話者は意味は分かりますが、ふだん自分では使いません。
    example_gloss: 病院は遠いです。
  prs.a1.unit05.lesson01.teach.school:
    title: 学校
    gloss: 学校
    note: مکتب は「学校」を表すアフガニスタンのダリー語の日常的な言葉です。イランのペルシア語の مدرسه とは異なり、ダリー語では مدرسه は主に宗教学校を指します。
    example_gloss: 学校は家の近くです。
  prs.a1.unit05.lesson01.teach.pharmacy:
    title: 薬局
    gloss: 薬局
    note: دواخانه は「薬局」を表すアフガニスタンのダリー語の日常的な言葉です(دوا は「薬」に由来します)。イランのペルシア語の داروخانه とは異なります。
    example_gloss: 薬局はどこですか？
  prs.a1.unit05.lesson01.teach.va_word:
    title: 〜と、そして
    gloss: と・そして
    note: و は、場所をいくつか並べてつなぐときに使う一般的な言葉です。
    target_text: و(〜と、そして)
  prs.a1.unit05.lesson02.teach.post_office:
    title: 郵便局
    gloss: 郵便局
    note: پوسته خانه は、پوسته(郵便)と خانه(家・建物)を組み合わせた言葉です。
    example_gloss: 郵便局は閉まっています。
  prs.a1.unit05.lesson02.teach.embassy:
    title: 大使館
    gloss: 大使館
    note: سفارت は「大使館」を表す標準的な言葉です。
    example_gloss: 大使館はカブールにあります。
  prs.a1.unit05.lesson02.teach.airport:
    title: 空港
    gloss: 空港
    note: میدان هوایی は「空港」を表すアフガニスタンのダリー語の日常的な言い方です(直訳は「空の広場」)。イランのペルシア語の فرودگاه とは異なります。
    example_gloss: 空港は遠いです。
  prs.a1.unit05.lesson02.teach.office_review:
    title: オフィス(復習)
    gloss: オフィス
    note: دفتر は前のユニットですでに出てきました。ここでは、ほかの公共の場所と並べて取り上げています。
    example_gloss: 私のオフィスは近いです。
  prs.a1.unit05.lesson03.teach.kojast_bazaar:
    title: 市場の場所をたずねる
    gloss: 市場はどこですか？
    note: بازار کجاست؟ は、どんな場所でも「どこですか」とたずねるときの基本の型です。
  prs.a1.unit05.lesson03.teach.kojast_hospital:
    title: 病院の場所をたずねる
    gloss: 病院はどこですか？
    note: کجاست の型は、どんな場所を表す名詞にも使えます。
  prs.a1.unit05.lesson03.teach.bebakhshid:
    title: 丁寧に声をかける
    gloss: すみません、薬局はどこですか？
    note: ببخشین は、知らない人に丁寧に質問を切り出すときの表現で、日本語の「すみません」にあたります。
  prs.a1.unit05.lesson03.teach.kojast_grammar:
    title: کجاست のでき方
    gloss: کجاست は、کجا(どこ)と است(〜です)が縮まって一つになった形です。
    note: この成り立ちを知っておくと、کجاست を分解できない一つの塊として丸暗記せずに、パターンとして理解できます。
  prs.a1.unit05.lesson04.teach.near:
    title: 近く
    gloss: 近く
    note: نزدیک は、近くにあるものを表します。
    example_gloss: 銀行は近いです。
  prs.a1.unit05.lesson04.teach.far:
    title: 遠い
    gloss: 遠い
    note: دور は、距離が離れているものを表します。
    example_gloss: 病院は遠いです。
  prs.a1.unit05.lesson04.teach.here:
    title: ここ
    gloss: ここ
    note: این‌جا は、話し手がいる場所を指します。
    example_gloss: 銀行はここにあります。
  prs.a1.unit05.lesson04.teach.there:
    title: あそこ
    gloss: そこに
    note: آن‌جا は、話し手から離れた場所を指します。
    example_gloss: 薬局はあそこです。
  prs.a1.unit05.lesson04.teach.bazaar_near:
    title: 市場が近いと言う
    gloss: 市場は近いです。
    note: بازار نزدیک است には、このコースでここまで出てきた است(〜です)が使われています。
  prs.a1.unit05.lesson04.teach.airport_far:
    title: 空港が遠いと言う
    gloss: 空港は遠いです。
    note: میدان هوایی دور است は、نزدیک の代わりに دور を使った同じ型です。
  prs.a1.unit05.lesson05.teach.next_to:
    title: 〜の隣
    gloss: 〜の隣
    note: در کنار は、文字どおりには「〜のそばに」という意味です。
  prs.a1.unit05.lesson05.teach.behind:
    title: 〜の後ろ
    gloss: 後ろ
    note: پشت は、あるものが別の場所の後ろにあることを表します。
    example_gloss: 薬局は学校の後ろにあります。
  prs.a1.unit05.lesson05.teach.opposite:
    title: 〜の向かい
    gloss: 向かい
    note: مقابل は、あるものが別の場所のちょうど向かい側にあることを表します。
    example_gloss: 銀行はモスクの向かいにあります。
  prs.a1.unit05.lesson05.teach.hospital_next_to_mosque:
    title: モスクを基準に病院の場所を言う
    gloss: 病院はモスクの隣にあります。
    note: شفاخانه در کنار مسجد است は、場所を表す名詞、در کنار、そして است を組み合わせた文です。
  prs.a1.unit05.lesson06.teach.tashakor_ziad:
    title: どうもありがとうございます
    gloss: どうもありがとうございます。
    note: تشکر زیاد は、すでに習った日常のあいさつ تشکر を強めた言い方です。
  prs.a1.unit05.lesson06.teach.turn01:
    title: ザルミナが薬局の場所をたずねる
    gloss: ザルミナが通りがかりの人に、薬局がどこか丁寧にたずねます。
    note: ببخشین は、知らない人にも失礼のないように質問を切り出す言い方です。
  prs.a1.unit05.lesson06.teach.turn02:
    title: 通りがかりの人が道を教える
    gloss: 通りがかりの人は、薬局は遠くないこと、まっすぐ行くこと、そして学校の隣にあることを伝えます。
    note: この文には、この単元のいくつかの型が入っています。دور نیست(دور の否定)、مستقیم بروین、در کنار です。
  prs.a1.unit05.lesson06.teach.turn03:
    title: ザルミナが通りがかりの人にお礼を言う
    gloss: ザルミナは男性に心からお礼を言います。
    note: تشکر زیاد は、やりとりを丁寧にしめくくります。
  prs.a1.unit05.lesson06.teach.turn04:
    title: 通りがかりの人の控えめな返事
    gloss: どういたしまして。たいしたことではありません。
    note: قابلی نداره は、アフガニスタンのダリー語の日常会話で、お礼に対して控えめに応じる一般的な言い方です。働きは خواهش می‌کنم に似ていますが、もっとくだけた表現です。نداره は ندارد の話し言葉の形で、会話では نداره を耳にしますが、丁寧に書くときは ندارد を使います。
