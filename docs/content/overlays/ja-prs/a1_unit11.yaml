    title: 会議は午前9時です。
    gloss: 会議は午前9時です。
    note: ホマユンが会議の時間を伝えています。
  prs.a1.unit11.lesson06.teach.dialogue_line3:
    title: 9時ですか?いいですね。8時半に行きます。
    gloss: 9時ですか?いいですね。8時半に行きます。
    note: ザルミナが了承し、自分が着く時間を伝えています。
  prs.a1.unit11.lesson06.teach.dialogue_line4:
    title: とてもいいですね、お待ちしています。
    gloss: とてもいいですね、お待ちしています。
    note: '*منتظر استم*(待っています)は、これまでに学んだ *استم* の語尾を使っています。'
