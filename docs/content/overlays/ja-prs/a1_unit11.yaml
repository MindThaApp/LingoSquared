    gloss: 1、2、3、4、5
    note: '*یک، دو، سه، چهار، پنج* はユニット4で学んだ数字の復習で、時刻を言うのに必要です。'
    example_gloss:
    - 本を1冊持っています。
    - 兄弟が2人います。
    - 私には姉妹が3人います。
    - あと4日です。
