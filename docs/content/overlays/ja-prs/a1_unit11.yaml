    note: '*قرار* は「約束」という意味です。このユニットで扱う個人的な約束を表す新しい単語で、以前の会議の日程調整の会話に出てきた *جلسه*(会議)とは別の語です。'
    example_gloss: 約束があります。
  prs.a1.unit11.lesson05.teach.qarar_saat_chand:
    title: お約束は何時ですか?
    gloss: お約束は何時ですか?
    note: '*قرار شما ساعت چند است؟* は、相手の約束の時間を丁寧に(*شما*)たずねる表現です。'
  prs.a1.unit11.lesson05.teach.qarar_answer:
    title: 私の約束は8時半です。
    gloss: 私の約束は8時半です。
    note: '*قرار من ساعت هشت و نیم است* は、自分の約束の時間を伝える表現です。'
