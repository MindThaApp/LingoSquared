  prs.a1.unit35.lesson06.wrap_up:
    title: まとめ
teaching:
  prs.a1.unit35.lesson01.teach.post_office_word:
    title: 郵便局
    gloss: 郵便局
    note: پُسته خانه は、アフガニスタンのダリー語で郵便局を表す形です。
    example_gloss: 郵便局は近いです。
  prs.a1.unit35.lesson01.teach.stamp_word:
    title: 切手
    gloss: 切手
    note: تکت پُستی は切手を表す、初心者に実用的なフレーズです。
    example_gloss: 切手を1枚ください。
  prs.a1.unit35.lesson01.teach.letter_word:
    title: 手紙
    gloss: 手紙
    note: نامه は手紙や書かれたメッセージを表します。
    example_gloss: 手紙は机の上にあります。
  prs.a1.unit35.lesson01.teach.parcel_word:
    title: 小包
    gloss: 小包
    note: پارسل は、現在のアフガニスタンの郵便サービスで小包を表す言葉として使われます。
    example_gloss: 小包は大きくありません。
  prs.a1.unit35.lesson01.teach.review_basics:
    title: 復習:1つ、近い、です、ほしい
    gloss: 1つの/近い/です/ほしい
    note: یک、نزدیک、است、می‌خواهم は、窓口での簡単な依頼によく使われる復習用の形です。
    target_text: یک (1つの) / نزدیک (近い) / است (です) / می‌خواهم (ほしい)
  prs.a1.unit35.lesson01.teach.want_stamp_phrase:
    title: 切手をください
    gloss: 切手がほしいです。
    note: 丁寧にシンプルに頼むときは می‌خواهم を使います。
  prs.a1.unit35.lesson01.teach.post_office_near_phrase:
    title: 郵便局は近いです
    gloss: 郵便局は近いです。
    note: 近所の単元で出てきた نزدیک をもう一度使っています。
  prs.a1.unit35.lesson02.teach.send_phrase:
    title: 手紙を送ります
    gloss: 手紙を送ります。
    note: روان می‌کنم は直訳すると「動き出させる」ですが、ここでは「送る」を表すダリー語の自然な言い方です。
  prs.a1.unit35.lesson02.teach.send_parcel_phrase:
    title: 小包を送ります
    gloss: 小包を送ります。
    note: نامه を پارسل に替えると、送る物を言い換えられます。
  prs.a1.unit35.lesson02.teach.review_question_words:
    title: 復習:どこへ・〜へ
    gloss: どこ / 〜へ / ヘラート / あなた(丁寧)
    note: کجا、به、هرات、شما は、行き先をたずねる文のために、ここにまとめた復習の単語です。
    target_text: کجا (どこ) / به (〜へ) / هرات (ヘラート) / شما (あなた・丁寧)
  prs.a1.unit35.lesson02.teach.to_where_question:
    title: 手紙はどこへ行きますか?
    gloss: 手紙はどこへ行きますか?
    note: نامه به کجا می‌رود؟ は行き先をたずねる文です。
  prs.a1.unit35.lesson02.teach.to_herat_answer:
    title: 手紙はヘラートへ行きます
    gloss: 手紙はヘラートへ行きます。
    note: به هرات で行き先を表します。
  prs.a1.unit35.lesson02.teach.can_send_question:
    title: 手紙を送っていますか?
    gloss: 手紙を送っていますか?
    note: می‌کنین は、公共サービスでの質問に使われる丁寧な「あなた」の形です。
  prs.a1.unit35.lesson03.teach.arrive_word:
    title: It arrives
    gloss: 届きます
    note: می‌رسد は、手紙や小包が届くときに使う三人称の形です。
    target_text: می‌رسد (着く)
  prs.a1.unit35.lesson03.teach.review_days_numbers:
    title: 復習:日数と数字
    gloss: いくつ / 日 / 2 / 3
    note: چند、روز、دو、سه は、配達にかかる時間をたずねるときに使う復習の単語です。
    target_text: چند (いくつ・何) / روز (日) / دو (2) / سه (3)
  prs.a1.unit35.lesson03.teach.how_many_days_question:
    title: 何日かかりますか?
    gloss: 何日かかりますか?
    note: چند روزه می‌رسد؟ は、郵便がいつ届くかを簡潔にたずねる言い方です。
  prs.a1.unit35.lesson03.teach.two_days_answer:
    title: 2日で届きます
    gloss: 2日で届きます。
    note: دو روزه は直訳すると「2日の」で、می‌رسد と合わせて「2日で届く」という意味になります。
  prs.a1.unit35.lesson03.teach.three_days_answer:
    title: 3日で届きます
    gloss: 3日で届きます。
    note: سه روزه は直訳すると「3日の」で、می‌رسد と合わせて「3日で届く」という意味になります。
  prs.a1.unit35.lesson03.teach.review_today_tomorrow:
    title: 今日と明日
    gloss: 今日 / 明日
    note: امروز と فردا は復習の時を表す単語です。
    target_text: امروز (今日) / فردا (明日)
  prs.a1.unit35.lesson04.teach.review_counter_words:
    title: Hello / for / or / okay
    gloss: こんにちは / 〜のための / または / いいです
    note: سلام、برای、یا、خوب は、窓口での会話に出てくる復習の単語です。
    target_text: سلام (こんにちは) / برای (〜のために) / یا (または) / خوب (よい・大丈夫)
  prs.a1.unit35.lesson04.teach.dialogue_line1:
    title: ナディア:こんにちは、切手をください。
    gloss: こんにちは、切手をください。
  prs.a1.unit35.lesson04.teach.dialogue_line2:
    title: ラヒム:手紙ですか、小包ですか?
    gloss: 手紙ですか、小包ですか?
  prs.a1.unit35.lesson04.teach.dialogue_line3:
    title: ナディア:手紙です。
    gloss: 手紙です。
  prs.a1.unit35.lesson04.teach.dialogue_line4:
    title: ラヒム:手紙はどこへ行きますか?
    gloss: 手紙はどこへ行きますか?
  prs.a1.unit35.lesson04.teach.dialogue_line5:
    title: ナディア:ヘラートへ行きます。
    gloss: ヘラートへ行きます。
  prs.a1.unit35.lesson04.teach.dialogue_line6:
    title: ラヒム:わかりました。手紙は3日で届きます。
    gloss: わかりました。手紙は3日で届きます。
  prs.a1.unit35.lesson05.teach.review_u_and_message:
    title: 彼/彼女、〜で、うれしい
    gloss: 彼/彼女 / 〜で・〜に / とても / うれしい / 〜です
    note: او は「彼」も「彼女」も表すダリー語の代名詞です。در、بسیار、خوشحال は復習の単語です。
    target_text: او (彼・彼女) / در (〜に・〜で) / بسیار (とても) / خوشحال (うれしい) / است (です)
  prs.a1.unit35.lesson05.teach.reading_passage:
    title: 郵便局にいるナディアについての読み物
    gloss: ナディアは郵便局にいます。彼女はヘラートへ手紙を送ります。手紙は3日で届きます。ナディアはうれしいです。
  prs.a1.unit35.lesson06.teach.review_like_but_time:
    title: I like / but I do not have time
    gloss: 好きです / 目的語を示す語 / でも / 時間がありません
    note: دوست دارم、را、اما、وقت、ندارم は、まとめのメッセージに使う復習の形です。
    target_text: دوست دارم (好きです) / را (目的語の印) / اما (しかし) / وقت ندارم (時間がありません)
  prs.a1.unit35.lesson06.teach.wrap_summary:
    title: 郵便局は好きですが、時間がありません
    gloss: 郵便局は好きですが、時間がありません。
    note: これは、A1の最近のまとめで使った اما の型の続きです。
