  prs.a1.unit36.lesson04.teach.review_dialogue_words:
    title: Hello / yes / please / okay / thanks / stew / delicious / is
    gloss: こんにちは/はい/お願いします/かしこまりました/ありがとう/煮込み料理/おいしい/〜です
    note: سلام、بلی、لطفاً、چشم、تشکر、قورمه、خوش‌مزه、است は、キッチンでの会話に出てくる復習の単語です。
    target_text: سلام(こんにちは)/ بلی(はい)/ لطفاً(お願いします)/ چشم(いいですよ)/ تشکر(ありがとう)/ قورمه(煮込み料理)/ خوش‌مزه(おいしい)/ است(〜です)
  prs.a1.unit36.lesson04.teach.dialogue_line1:
    title: ナディア:こんにちは、何を作っていますか?
    gloss: こんにちは、何を作っているの?
    note: چی می‌پزین؟ では、丁寧な「あなた」の形 می‌پزین を使っています。
  prs.a1.unit36.lesson04.teach.dialogue_line2:
    title: ファリード:コルマを作っています。
    gloss: コルマを作っています。
  prs.a1.unit36.lesson04.teach.dialogue_line3:
    title: ナディア:手伝いましょうか?
    gloss: 手伝いましょうか?
    note: کمک می‌کنم؟ は直訳すると「私は手伝いますか?」で、手助けを申し出る自然な言い方です。
  prs.a1.unit36.lesson04.teach.dialogue_line4:
    title: ファリード:はい、玉ねぎを刻んでください。
    gloss: はい、玉ねぎを刻んでください。
    note: کنین は丁寧な命令形で、「してください」にあたります。
  prs.a1.unit36.lesson04.teach.dialogue_line5:
    title: ナディア:わかりました。
    gloss: わかりました。
  prs.a1.unit36.lesson04.teach.dialogue_line6:
    title: ファリード:ありがとう、料理がおいしいです。
    gloss: ありがとう、料理がおいしいです。
  prs.a1.unit36.lesson05.teach.review_he_she_words:
    title: He/she, in, does, cooks, very, happy, is
    gloss: 彼・彼女/〜で・〜に/する/調理する/とても/うれしい/〜です
    note: او はダリー語で「彼」も「彼女」も表す代名詞です。می‌کند と می‌پزد は、このユニットでこれまで学んだ動詞の三人称の形です。
    target_text: او(彼/彼女)/ در(〜で、〜に)/ می‌کند(彼/彼女はする)/ می‌پزد(彼/彼女は料理する)/ بسیار(とても)/ خوشحال(嬉しい)/ است(〜です)
  prs.a1.unit36.lesson05.teach.reading_passage:
    title: 料理をするナディアの読み物
    gloss: ナディアは台所にいます。彼女は玉ねぎを刻みます。それから肉を調理します。料理はとてもおいしいです。ナディアはうれしいです。
