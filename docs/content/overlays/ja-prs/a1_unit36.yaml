teaching:
  prs.a1.unit36.lesson01.teach.kitchen_word:
    title: キッチン
    gloss: 台所
    note: آشپزخانه は「台所」を表す標準的なダリー語です。
    example_gloss: 今日、私は台所にいます。
  prs.a1.unit36.lesson01.teach.food_word:
    title: 食べ物
    gloss: 食べ物/食事
    note: غذا は食べ物や食事全般を指し、پلو のような特定の料理とは区別されます。
    example_gloss: 食事はおいしいです。
  prs.a1.unit36.lesson01.teach.onion_word:
    title: 玉ねぎ
    gloss: 玉ねぎ
    note: پیاز は「玉ねぎ」を表す一般的なダリー語で、アフガニスタンの料理でよく使われます。
    example_gloss: 玉ねぎは新鮮です。
  prs.a1.unit36.lesson01.teach.meat_word:
    title: 肉
    gloss: 肉
    note: گوشت は「肉」という意味です。
    example_gloss: 肉は新鮮です。
  prs.a1.unit36.lesson01.teach.review_basics:
    title: 復習:1つ、ほしい、〜で、〜です
    gloss: 1つの/私はほしい/〜で、〜に/私は〜です
    note: یک、می‌خواهم、در、استم は、このユニットの料理の文で使う復習の形です。
    target_text: یک(1つの)/ می‌خواهم(私はほしい)/ در(〜で、〜に)/ استم(私は〜です)
  prs.a1.unit36.lesson01.teach.cook_food_phrase:
    title: 私は食事を作ります
    gloss: 私は食事を作ります。
    note: می‌پزم は پختن(料理する)の一人称・現在形です。
  prs.a1.unit36.lesson01.teach.in_kitchen_phrase:
    title: 私は台所にいます
    gloss: 私は台所にいます。
    note: استم は「〜です」にあたる動詞の一人称の形で、ここでは場所を表す در と一緒に使われています。
  prs.a1.unit36.lesson02.teach.salt_word:
    title: 塩
    gloss: 塩
    note: نمک は「塩」という意味です。
    example_gloss: 塩がほしいです。
  prs.a1.unit36.lesson02.teach.rice_grain_word:
    title: 米、ご飯
    gloss: 米、ご飯
    note: برنج は炊く前の米(穀物)のことで、食べ物のユニットで習う炊いたご飯料理の پلو とは区別されます。
    example_gloss: 私は米を炊きます。
  prs.a1.unit36.lesson02.teach.review_do_cut:
    title: 復習:する、切った
    gloss: 私はする/切った、みじん切りの
    note: می‌کنم は復習です。خرد は新しい単語で、کردن の形と組み合わせて「刻む、切る」という意味になります。
    target_text: می‌کنم(私はする)/ خرد(切った、細かい)
  prs.a1.unit36.lesson02.teach.chop_onion_phrase:
    title: 玉ねぎを刻みます
    gloss: 私は玉ねぎを刻みます。
    note: خرد می‌کنم は直訳すると「細かく切った状態にする」という意味で、よくある複合動詞の型です。
  prs.a1.unit36.lesson02.teach.add_salt_phrase:
    title: 塩を加えます
    gloss: 私は塩を入れます。
    note: می‌اندازم(انداختن「投げる、入れる」から)は、材料を加えるときに使う自然なダリー語の動詞です。
  prs.a1.unit36.lesson02.teach.cook_meat_phrase:
    title: 私は肉を煮ます
    gloss: 肉を調理します。
    note: گوشت を برنج に入れ替えると、別の料理を作っていると言えます。
  prs.a1.unit36.lesson03.teach.review_first_then:
    title: 復習:まず、それから
    gloss: 最初に/次に
    note: اول と بعد は、料理の手順を順番に述べるときに使う復習の単語です。
    target_text: اول(最初に)/ بعد(次に)
  prs.a1.unit36.lesson03.teach.review_water_hot:
    title: 復習:水、熱い
    gloss: 水/熱い
    note: آب と گرم は、これまでのユニットで学んだ復習の単語です。
    target_text: آب(水)/ گرم(熱い)
  prs.a1.unit36.lesson03.teach.pour_word:
    title: 注ぎます
    gloss: 注ぎます
    note: می‌ریزم(ریختن「注ぐ」から)は、液体を加えるときに使う自然な動詞です。固形の材料を入れるときに使う می‌اندازم とは区別します。
    example_gloss: 水を注ぎます。
  prs.a1.unit36.lesson03.teach.first_chop_phrase:
    title: まず玉ねぎを刻みます
