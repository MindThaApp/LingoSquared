course:
  title: ダリー語 A1
  description: カブールのダリー語入門:お金と支払いの語彙、支払い方法の尋ね方、صرافی(両替商)での両替、そして زرمینه とホマーユーンがドルをアフガニーに両替する会話。
units:
  prs.a1.unit23.money:
    title: お金
    description: 両替や支払い、支払い方法の質問など、お金に関する基本的なやり取りができるようになります。
lessons:
  prs.a1.unit23.lesson01.money_vocabulary:
    title: お金の単語
  prs.a1.unit23.lesson02.payment_method:
    title: 支払い方法
  prs.a1.unit23.lesson03.currency_exchange:
    title: 両替
  prs.a1.unit23.lesson04.exchange_dialogue:
    title: 両替商で
  prs.a1.unit23.lesson05.reading_receipt:
    title: レシートを読む
  prs.a1.unit23.lesson06.wrap_up:
    title: まとめ
teaching:
  prs.a1.unit23.lesson01.teach.pul:
    title: お金
    gloss: お金
    note: پول は「お金」という意味です。
    example_gloss: 私はお金を持っています。
  prs.a1.unit23.lesson01.teach.naqd:
    title: 現金
    gloss: 現金
    note: نقد は「現金」という意味です。
    example_gloss: 現金で払います。
  prs.a1.unit23.lesson01.teach.kart:
    title: カード
    gloss: カード
    note: کارت は「カード」(支払い用のカード)という意味です。
    example_gloss: カードを持っています。
  prs.a1.unit23.lesson01.teach.dollar:
    title: ドル
    gloss: ドル
    note: دالر は「ドル」(米ドル)という意味です。アフガニスタンの日常の両替では、アフガニーと並んでよく使われ、相場も示されます。
    example_gloss: 100ドル持っています。
  prs.a1.unit23.lesson01.teach.review_dorom:
    title: 私は~を持っています
    gloss: 私には~がいる・ある
    note: دارم は「私は持っています」という意味です(ユニット10の買い物で既習)。
    example_gloss: 私はお金を持っています。
  prs.a1.unit23.lesson01.teach.review_sad:
    title: 百
    gloss: 百
    note: صد は「百」という意味です。ユニット4の数字で既習で、ユニット10の買い物でも使いました。
    example_gloss: 100ドル持っています。
  prs.a1.unit23.lesson02.teach.mipardazam:
    title: 私は払います
    gloss: 私は払います
    note: می‌پردازم は「私は支払います」という意味です。
    example_gloss: 現金で払います。
  prs.a1.unit23.lesson02.teach.ya:
    title: または
    gloss: または
    note: یا は「または」という意味です。
    example_gloss: 現金かカードで払います。
  prs.a1.unit23.lesson02.teach.naqdi_ya_karti:
    title: 現金ですか、カードですか?
    gloss: 現金で払いますか、カードで払いますか?
    note: お店や両替所のカウンターでよく聞かれる質問です。
  prs.a1.unit23.lesson02.teach.review_mitanom:
    title: 私はできる
    gloss: 私はできる
    note: می‌توانم は「私はできます」という意味です(これまでに既習)。
    example_gloss: 現金で払えます。
  prs.a1.unit23.lesson02.teach.bepardazam:
    title: 払う
    gloss: 払う
    note: بپردازم は「支払う」の接続法の形で、می‌توانم(私はできる)の後に使います。می‌توانم نقد بپردازم は直訳すると「現金で払うことができます」です。
    example_gloss: 現金で払えます。
  prs.a1.unit23.lesson03.teach.sarafi:
    title: 両替商
    gloss: 両替商
    note: صرافی は、アフガニスタンで実際によく使われる両替の場所です。正式な بانک(銀行)とは別のものです。
    example_gloss: 両替商に行きます。
  prs.a1.unit23.lesson03.teach.tabdil_kardan:
    title: 両替する
    gloss: 両替する
    note: تبدیل کردن は(お金を)「両替する」という意味です。
    example_gloss: ドルをアフガニーに両替します。
  prs.a1.unit23.lesson03.teach.narkh:
    title: 為替レート
    gloss: 為替レート
    note: نرخ は「レート、為替レート」という意味です。
    example_gloss: 今日のドルのレートはいくらですか?
  prs.a1.unit23.lesson03.teach.narkh_chand_ast:
    title: 今日のレートは?
    gloss: 今日のドルのレートはいくらですか?
    note: 為替レートを尋ねるときの決まった言い方です。
  prs.a1.unit23.lesson03.teach.review_afghani:
    title: アフガニー
    gloss: アフガニー
    note: افغانی はアフガニスタンの通貨です(ユニット10の買い物で「صد افغانی」などとして既習)。
    example_gloss: 100アフガニー持っています。
  prs.a1.unit23.lesson03.teach.review_ast_emroz_chand:
    title: 復習:です、今日、いくら
    gloss: です/今日/いくら
    note: است、امروز、چند は復習の単語(これまでに既習)で、このレッスンのレートの質問の中で組み合わせて使います。
    example_gloss: 今日のドルのレートはいくらですか?
  prs.a1.unit23.lesson03.teach.review_ba_ra_mikonam:
    title: 復習:~へ、目的語の印、私はする、する、私は~したい
    gloss: ~へ/目的語の印/私はする/する/私は~したい
    note: به、را、می‌کنم、کنم、می‌خواهم は復習の単語(これまでに既習)で、このレッスンの両替の文の中で組み合わせて使います。
    example_gloss: ドルをアフガニーに両替したいです。
  prs.a1.unit23.lesson04.teach.review_mikhaham:
    title: 私は〜がほしい
    gloss: 〜がほしいです
    note: می‌خواهم は「私は~したいです」という意味です(これまでのユニットで既習)。
    example_gloss: ドルを両替したいです。
  prs.a1.unit23.lesson04.teach.chand_darin:
    title: いくら持っていますか?
    gloss: ドルをいくらお持ちですか?
    note: دارین は「持っている」の丁寧形・複数形で、お客さんに対して使います。
  prs.a1.unit23.lesson04.teach.bufarmayin:
    title: はい、どうぞ
    gloss: どうぞ
    note: بفرمایین は、何かを手渡すときに使う丁寧な表現です。
    example_gloss: どうぞ、7,000アフガニーです。
  prs.a1.unit23.lesson04.teach.hazar:
    title: 千
    gloss: 千
    note: هزار は「千」という意味です。
    example_gloss: 7,000アフガニーです。
  prs.a1.unit23.lesson04.teach.review_zarmina:
    title: ザルミナ
    gloss: ザルミーナ
    note: زرمینه:これまでの課にも登場している、おなじみの登場人物です。
    example_gloss: ザルミーナは両替商へ行きます。
  prs.a1.unit23.lesson04.teach.review_besyar_khub:
    title: とても良い
    gloss: とても良いです
    note: بسیار خوب はすでに学んだ表現で、ここでは相手の申し出を受け入れるときに使います。
    example_gloss: とても良いです、ありがとう。
  prs.a1.unit23.lesson04.teach.review_haftad_tashakor_kard:
    title: 復習:70・ありがとう・した/作った
    gloss: 70/ありがとう/した、行った(彼・彼女が)
    note: هفتاد と تشکر は復習の単語です。کرد は کردن(する・作る)の三人称過去形で、第20課の過去形のレッスンですでに出てきました。ここでは、やりとり全体のまとめとして使います。
    example_gloss: ザルミーナは100ドルをアフガニに両替しました。
  prs.a1.unit23.lesson04.teach.turn01:
    title: ザルミーナ:こんにちは、ドルをアフガニに両替したいのですが。
    gloss: こんにちは、ドルをアフガニに両替したいのですが。
  prs.a1.unit23.lesson04.teach.turn02:
    title: 両替商:ドルはいくらお持ちですか?
    gloss: ドルをいくらお持ちですか?
  prs.a1.unit23.lesson04.teach.turn03:
    title: ザルミーナ:100ドルあります。今日のレートはいくらですか?
    gloss: 100ドルあります。今日のレートはいくらですか?
  prs.a1.unit23.lesson04.teach.turn04:
    title: 両替商:今日は1ドルが70アフガニです。
    gloss: 今日は1ドルが70アフガニです。
  prs.a1.unit23.lesson04.teach.turn05:
    title: ザルミーナ:けっこうです、両替してください。
    gloss: けっこうです、両替してください。
    note: تبدیل کنین は丁寧な依頼の命令形で、「(どうぞ)両替してください」という意味です。
  prs.a1.unit23.lesson04.teach.turn06:
    title: 両替商:どうぞ、7,000アフガニです。
    gloss: どうぞ、7,000アフガニです。
  prs.a1.unit23.lesson04.teach.turn07:
    title: ザルミーナ:ありがとうございます。
    gloss: ありがとうございます。
  prs.a1.unit23.lesson05.teach.rasid:
    title: レシート
    gloss: 領収書
    note: رسید は「レシート・受領書」という意味です。
    example_gloss: レシートをもらいます。
  prs.a1.unit23.lesson05.teach.migiram:
    title: 受け取ります
    gloss: 受け取ります
    note: می‌گیرم は「(私は)受け取る・もらう」という意味です。
    example_gloss: お金を受け取ります。
  prs.a1.unit23.lesson05.teach.reading_text:
    title: 読み物
    gloss: ザルミーナは両替商へ行きました。彼女は100ドル持っていて、ドルをアフガニに両替したいと思っていました。今日のレートは70アフガニでした。ザルミーナは7,000アフガニを受け取り、レシートももらいました。
  prs.a1.unit23.lesson05.teach.review_raft:
    title: 行った
    gloss: 行った
    note: رفت は過去形で「行った」(彼・彼女が)という意味です。
    example_gloss: ザルミーナは両替商へ行きました。
  prs.a1.unit23.lesson05.teach.review_haft_gereft:
    title: 復習:7・受け取った(彼・彼女が)・受け取った(私が)
    gloss: 7/受け取った(彼・彼女が)/受け取った(私が)
    note: هفت は復習の数字です。گرفت と گرفتم は گرفتن(取る・受け取る)の過去形で、それぞれ三人称と一人称です。ここではザルミーナが受け取った金額を表すのに使います。
    example_gloss: ザルミーナは7,000アフガニを受け取りました。
  prs.a1.unit23.lesson06.teach.review_summary:
    title: まとめ
    gloss: 私はお金を持っています。現金とカードです。両替商でドルをアフガニに両替できます。今日のレートは1ドルが70アフガニです。
  prs.a1.unit23.lesson06.teach.review_bara:
    title: 〜のための
    gloss: 〜のための
    note: برای は「~のための・~に対して」という意味です。
    example_gloss: 1ドルで70アフガニ。
  prs.a1.unit23.lesson06.teach.review_va:
    title: 〜と
    gloss: と・そして
    note: و は「と・そして」という意味で、これまでの課ですでになじみのある語です。
    example_gloss: 私はお金を持っています。現金とカードです。
