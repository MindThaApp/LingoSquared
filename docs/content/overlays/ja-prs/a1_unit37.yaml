course:
  title: ダリー語 A1
  description: カブール方言ダリー語の入門：基本的な性格を表す言葉、相手がどんな人か尋ねる表現、「なぜなら」を使った簡単な理由の言い方、そして短い文章で人の性格を説明する方法を学びます。
units:
  prs.a1.unit37.personality:
    title: 性格
    description: 人の基本的な性格を説明し、相手がどんな人か尋ねましょう。
lessons:
  prs.a1.unit37.lesson01.personality_words:
    title: 性格を表す言葉
  prs.a1.unit37.lesson02.more_traits:
    title: さらに性格の言葉
  prs.a1.unit37.lesson03.asking_about_personality:
    title: 性格をたずねる
  prs.a1.unit37.lesson04.personality_dialogue:
    title: 性格についての会話
  prs.a1.unit37.lesson05.personality_reading:
    title: 性格についての読み物
  prs.a1.unit37.lesson06.wrap_up:
    title: まとめ
teaching:
  prs.a1.unit37.lesson01.teach.mehraban_word:
    title: 親切な
    gloss: 親切な
    note: مهربان は、優しい人や思いやりのある人を表す標準的なダリー語です。
    example_gloss: 彼/彼女は優しいです。
  prs.a1.unit37.lesson01.teach.zahmatkash_word:
    title: 働き者
    gloss: 勤勉な
    note: زحمتکش は直訳すると「苦労や努力を引き受ける人」で、勤勉な人を表します。
    example_gloss: 彼/彼女は勤勉です。
  prs.a1.unit37.lesson01.teach.bahosh_word:
    title: 賢い
    gloss: 頭がいい / 賢い
    note: باهوش は با(~を持つ)と هوش(知性)が合わさった語で、賢い人、頭の回転が速い人を表します。
    example_gloss: 彼/彼女は頭がいいです。
  prs.a1.unit37.lesson01.teach.tambal_word:
    title: 怠け者
    gloss: 怠け者の
    note: تنبل は「怠け者の」という意味です。
    example_gloss: 彼/彼女は怠け者です。
  prs.a1.unit37.lesson01.teach.review_basics:
    title: 復習：彼/彼女、です、と、しかし
    gloss: 彼/彼女 / です / と、そして / しかし
    note: او、است、و、اما は、この単元の性格を表す文の中で繰り返し使われる復習の語です。
    target_text: او (彼/彼女) / است (です) / و (と、そして) / اما (しかし)
  prs.a1.unit37.lesson01.teach.kind_and_hardworking_phrase:
    title: 彼/彼女は優しくて勤勉です
    gloss: 彼/彼女は優しくて勤勉です。
    note: و は二つの性格を一つの文につなぎます。
  prs.a1.unit37.lesson01.teach.smart_but_lazy_phrase:
    title: 彼/彼女は頭がいいですが、怠け者です
    gloss: 彼/彼女は頭がいいですが、怠け者です。
    note: اما は、一つの文の中で二つの性格を対比させます。
  prs.a1.unit37.lesson02.teach.shokh_word:
    title: おもしろい
    gloss: 面白い / おどけた
    note: شوخ は、冗談を言う人やひょうきんな人を表します。
    example_gloss: 彼/彼女は面白いです。
  prs.a1.unit37.lesson02.teach.kamharf_word:
    title: 無口
    gloss: 無口 / 控えめ
    note: کم‌حرف は直訳すると「言葉が少ない」で、無口で控えめな人を表します。
    example_gloss: 彼/彼女は無口です。
  prs.a1.unit37.lesson02.teach.rastgoo_word:
    title: 正直
    gloss: 正直
    note: راستگو は راست(本当、まっすぐ)と گو(話す人)が合わさった語で、誠実で正直な人を表します。
    example_gloss: 彼/彼女は正直です。
  prs.a1.unit37.lesson02.teach.review_and_but:
    title: 復習：と、しかし
    gloss: と、そして / しかし
    note: و と اما は、性格をつないだり対比させたりするときに使う復習の語です。
    target_text: و (と、そして) / اما (しかし)
  prs.a1.unit37.lesson02.teach.funny_and_honest_phrase:
    title: 彼/彼女は面白くて正直です
    gloss: 彼/彼女は面白くて正直です。
    note: و で二つの良い性格をつなぎます。
  prs.a1.unit37.lesson02.teach.quiet_but_kind_phrase:
    title: 彼/彼女は無口ですが、優しいです
    gloss: 彼/彼女は無口ですが、優しいです。
    note: اما は、控えめな性格と温かい性格を対比させます。
  prs.a1.unit37.lesson03.teach.person_word:
    title: 人
    gloss: 人
    note: آدم は、人や人間を表す一般的な言葉で、性別を問わず使えます。
    example_gloss: 彼/彼女はいい人です。
  prs.a1.unit37.lesson03.teach.review_how_because:
    title: 復習：どのような、なぜなら、助け
    gloss: どのような / なぜなら / 助け
    note: چطور、چون、کمک は、性格について尋ねたり説明したりするときに使う復習の語です。
    target_text: چطور (どのような) / چون (なぜなら) / کمک (助け)
  prs.a1.unit37.lesson03.teach.what_kind_person_question:
    title: 彼/彼女はどんな人ですか？
    gloss: 彼/彼女はどんな人ですか？
    note: او چطور آدم است؟ は直訳すると「彼/彼女はどのような人ですか」で、相手がどんな人かを尋ねる自然な言い方です。
  prs.a1.unit37.lesson03.teach.kind_because_helps_phrase:
    title: 彼/彼女は助けてくれるので、優しいです
    gloss: 彼/彼女は助けてくれるので、優しいです。
    note: چون は理由を導きます。کمک می‌کند は直訳すると「助けをする」です。
  prs.a1.unit37.lesson03.teach.hardworking_because_works_phrase:
    title: 彼/彼女はたくさん働くので、勤勉です
    gloss: 彼/彼女はたくさん働くので、勤勉です。
    note: زیاد کار می‌کند は直訳すると「たくさんの仕事をする」です。
  prs.a1.unit37.lesson04.teach.review_dialogue_words:
    title: はい/少し/いつも
    gloss: はい / 少し / いつも
    note: بلی、کمی、همیشه は、性格についての会話で使う復習の語です。
    target_text: بلی (はい) / کمی (少し) / همیشه (いつも)
  prs.a1.unit37.lesson04.teach.dialogue_line1:
    title: ホマユン：ザルミナさん、カリムさんはどんな人ですか？
    gloss: ザルミナさん、カリムさんはどんな人ですか？
  prs.a1.unit37.lesson04.teach.dialogue_line2:
    title: ザルミナ：カリムさんは優しくて勤勉です。
    gloss: カリムは優しくて勤勉です。
  prs.a1.unit37.lesson04.teach.dialogue_line3:
    title: ホマユン：頭はいいですか？
    gloss: 頭はいいですか？
  prs.a1.unit37.lesson04.teach.dialogue_line4:
    title: ザルミナ：ええ、頭はいいですが、少し無口です。
    gloss: ええ、頭はいいですが、少し無口です。
  prs.a1.unit37.lesson04.teach.dialogue_line5:
    title: ホマユーン：正直な人ですか？
    gloss: 正直な人ですか？
  prs.a1.unit37.lesson04.teach.dialogue_line6:
    title: ザルミナ：ええ、いつも正直です。
    gloss: ええ、いつも正直です。
  prs.a1.unit37.lesson05.teach.review_reading_words:
    title: ときどき、みんな、目的語マーカー、彼らは好きです
    gloss: ときどき/みんな/目的語を示す助詞/(彼らは)好きです
    note: گاهی(ときどき)と همه(みんな)は読み物に出てきます。را は特定の直接目的語を示します。دوست دارند は دوست دارم(私は好きです)の third person 複数形、つまり「彼らは好きです」です。
    target_text: گاهی (ときどき) / همه (みんな) / را (目的語の印) / دوست دارند (好きです)
  prs.a1.unit37.lesson05.teach.reading_passage:
    title: ホマユーンの性格についての読み物
    gloss: ホマユーンは親切で勤勉です。頭はいいですが、ときどき無口になります。いつも正直です。みんなが彼を好きです。
  prs.a1.unit37.lesson06.teach.review_i_am_you_are:
    title: 復習：私は~です/あなたは~です(丁寧)
    gloss: 私は~です/あなたは~です(丁寧)
    note: استم と استین は、「私は~です」「あなたは~です(丁寧)」を表す復習用のコピュラ(「~です」にあたる語)の形で、このまとめのレッスンの文全体で使います。
    target_text: استم (私は…です) / استین (あなたは…です・丁寧)
  prs.a1.unit37.lesson06.teach.self_description_phrase:
    title: 私は親切ですが、ときどき怠け者です
    gloss: 私は優しいですが、ときどき怠け者です。
    note: من(私)と استم(私は~です)を使えば、自分の性格をそのまま言えます。このユニットで使ってきた او/است の型と同じ形です。
  prs.a1.unit37.lesson06.teach.formal_question_phrase:
    title: あなたはどんな人ですか？
    gloss: あなたはどんな人ですか？
    note: lesson03 で習った同じ疑問文の形に、شما(あなた、丁寧)と استین(あなたは~です、丁寧)を加え、学習者本人に直接たずねる形にしています。
