  prs.a1.unit29.lesson06.wrap_up:
    title: まとめ
teaching:
  prs.a1.unit29.lesson01.teach.sport_word:
    title: スポーツ
    gloss: スポーツ / 運動
    note: ورزش は「スポーツ」や「運動」の意味で、体を動かす活動全般を表す一般的な語です。
    example_gloss: 水泳は良いスポーツです。
  prs.a1.unit29.lesson01.teach.football_word:
    title: サッカー
    gloss: サッカー
    note: فوتبال は「サッカー」の意味です。
    example_gloss: サッカーは良いスポーツです。
  prs.a1.unit29.lesson01.teach.volleyball_word:
    title: バレーボール
    gloss: バレーボール
    note: والیبال は「バレーボール」の意味です。
    example_gloss: バレーボールもスポーツです。
  prs.a1.unit29.lesson01.teach.cricket_word:
    title: クリケット
    gloss: クリケット
    note: کرکت は「クリケット」の意味で、アフガニスタンでは特に人気のあるスポーツです。
    example_gloss: クリケットは人気のあるスポーツです。
  prs.a1.unit29.lesson01.teach.swimming_word:
    title: 水泳
    gloss: 水泳
    note: شنا は「水泳」の意味です。
    example_gloss: 水泳は良いスポーツです。
  prs.a1.unit29.lesson01.teach.review_bazi_kardan:
    title: Game / to do → to play
    gloss: ゲーム/する → (私は)プレーします
    note: بازی(ゲーム・プレー)は کردن(する、復習)と組み合わさって بازی می‌کنم(私はプレーします)になります。پیاده‌روی می‌کنم や آشپزی می‌کنم で学んだ「名詞+کردن」と同じパターンです。
    target_text: بازی(遊び/ゲーム)+ کردن(する)= بازی می‌کنم(私は遊びます/プレーします)
  prs.a1.unit29.lesson01.teach.combined_sentence:
    title: サッカーはスポーツです
    gloss: サッカーはスポーツです。
    note: فوتبال、یک(一つの、復習)、ورزش、است(~です、復習)を組み合わせた文です。
  prs.a1.unit29.lesson02.teach.review_chand:
    title: How many
    gloss: 何人、いくつ
    note: ここでは چند を使って頻度をたずねます。
    target_text: چند(いくつ)
  prs.a1.unit29.lesson02.teach.bar_word:
    title: 回(回数)
    gloss: 回(「1回」のように出来事の回数を数えるときの語)
    note: بار は出来事の回数を数えるときの「回」で、時計の時刻を表す「時」ではありません。
    example_gloss: 私は週に1回泳ぎます。
  prs.a1.unit29.lesson02.teach.review_dar_hafta:
    title: In / week
    gloss: ~で/週
    note: در(~で、復習)と هفته(週、第4課・第9課で復習)が組み合わさって「週に」の意味になります。
    target_text: در(~に、~で)/ هفته(週)
  prs.a1.unit29.lesson02.teach.varzesh_mikonin:
    title: You exercise (formal)
    gloss: 運動します(丁寧)
    note: ورزش می‌کنین は「運動します」の丁寧な言い方です。
    target_text: ورزش می‌کنین(運動しますか、丁寧な言い方)
  prs.a1.unit29.lesson02.teach.question_frequency:
    title: 週に何回運動しますか。
    gloss: 週に何回運動しますか。
    note: چند بار(何回)+ در هفته(週に)+ ورزش می‌کنین(運動します・丁寧)を組み合わせた文です。
  prs.a1.unit29.lesson02.teach.do_bar_answer:
    title: 私は週に2回サッカーをします
    gloss: 私は週に2回サッカーをします。
    note: دو(2、第4課で復習)بار در هفته で頻度を先に述べ、そのあとにスポーツ名と بازی می‌کنم の形が続きます。
  prs.a1.unit29.lesson03.teach.bashgah_word:
    title: ジム
    gloss: ジム
    note: باشگاه は「ジム」や「スポーツクラブ」の意味です。
    example_gloss: ジムは大きいです。
  prs.a1.unit29.lesson03.teach.review_park:
    title: Park
    gloss: 公園
    note: پارک は第13課の予定のレッスンで学んだ語の復習です。
    target_text: پارک(公園)
  prs.a1.unit29.lesson03.teach.dar_bashgah:
    title: ジムで
    gloss: ジムで
    note: در(~で、復習)+ باشگاه。
  prs.a1.unit29.lesson03.teach.dar_park:
    title: 公園で
    gloss: 公園で
    note: در(~で、復習)+ پارک(復習)。
  prs.a1.unit29.lesson03.teach.shena_mikonam:
    title: 私はジムで泳ぎます
    gloss: 私はジムで泳ぎます。
    note: در باشگاه と شنا می‌کنم(私は泳ぎます)を組み合わせた文で、بازی می‌کنم と同じ「名詞+کردن」のパターンです。
  prs.a1.unit29.lesson03.teach.futbol_park:
    title: 私は公園でサッカーをします
    gloss: 私は公園でサッカーをします。
    note: در پارک と فوتبال بازی می‌کنم を組み合わせた文です。
  prs.a1.unit29.lesson04.teach.review_to_miokni:
    title: You (informal) / you do (informal)
    gloss: あなた(親しい間柄)/ あなたは~をする・運動する(親しい間柄)
    note: تو(あなた、親しい間柄)と می‌کنی(あなたはする、親しい間柄)はどちらも復習で、このレッスンの親しい友達同士の会話で使われます。
    target_text: تو(あなた、親称)/ می‌کنی(あなたはする/運動する、親称)
  prs.a1.unit29.lesson04.teach.koja_word:
    title: Where
    gloss: どこ
    note: کجا は「どこ」の意味です。کجاست(「どこですか」、第5課・第6課で復習)と関連がありますが、ここでは動詞の前で単独で使われます。
    target_text: کجا(どこ)
  prs.a1.unit29.lesson04.teach.review_mikonad:
    title: He/she does/plays
    gloss: 彼/彼女は~をする・プレーする
    note: می‌کند は می‌کنم や می‌کنی の三人称の形(復習)です。この会話では使われず、次のレッスンの読み物で練習します。
    target_text: می‌کند(彼/彼女がする/プレーする、3人称)
  prs.a1.unit29.lesson04.teach.dialogue_line1:
    title: ホマユン:ザルミナ、週に何回運動する?
    gloss: ホマユン:ザルミナ、週に何回運動する?
    note: 友達同士のくだけた質問で、親しい間柄の می‌کنی の形を使っています。
  prs.a1.unit29.lesson04.teach.dialogue_line2:
    title: ザルミナ:私は週に2回バレーボールをします
    gloss: ザルミナ:私は週に2回バレーボールをします。
    note: دو بار در هفته と والیبال بازی می‌کنم で答えています。
  prs.a1.unit29.lesson04.teach.dialogue_line3:
    title: ホマユン:どこでするの?
    gloss: ホマユン:どこでするの?
    note: このレッスンで習ったばかりの کجا(どこ)を使っています。
  prs.a1.unit29.lesson04.teach.dialogue_line4:
    title: ザルミナ:ジムでします
    gloss: ザルミナ:ジムでします。
    note: در باشگاه を使った短い答えです。
  prs.a1.unit29.lesson04.teach.dialogue_line5:
    title: ホマユン:私は毎週公園でサッカーをします
    gloss: ホマユン:私は毎週公園でサッカーをします。
    note: هر(毎~、第24課で復習)と هفته を組み合わせた هر هفته(毎週)が出てきます。
  prs.a1.unit29.lesson04.teach.dialogue_line6:
    title: ザルミナ:すばらしい!
    gloss: ザルミナ:すばらしい!
    note: عالی است でやり取りを前向きに締めくくります。
  prs.a1.unit29.lesson05.teach.reading_passage:
    title: スポーツについての読み物
    gloss: ザルミナは週に2回バレーボールをします。彼女はジムでします。ホマユンは毎週公園でサッカーをします。
    note: この課のスポーツ語彙をまとめた短い読み物です。おなじみの二人の登場人物について、می‌کند(する、三人称、復習)と او(彼・彼女、復習)を使います。
  prs.a1.unit29.lesson06.teach.review_ama:
    title: But
    gloss: しかし
    note: اما は「しかし」「でも」の意味です(以前の課で復習)。
    target_text: اما(でも、しかし)
  prs.a1.unit29.lesson06.teach.review_like_have_time:
    title: I like / time / I don't have
    gloss: 好きです / 時間 / ありません
    note: دوست دارم(好きです、第14課・第26課で復習)、وقت(時間、第11課・第26課で復習)、ندارم(ありません、第3課・第28課で復習)を組み合わせて、まとめの文を作ります。
    target_text: دوست دارم(好きです)/ وقت(時間)/ ندارم(ありません)
  prs.a1.unit29.lesson06.teach.wrap_summary:
    title: サッカーは好きですが、時間がありません
    gloss: サッカーは好きですが、時間がありません。
    note: اما を使って好みと制約を並べた文で、وقت ندارم を実際に使えるようになります。
