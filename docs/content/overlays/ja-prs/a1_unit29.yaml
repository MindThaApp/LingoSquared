course:
  title: ダリー語 A1
  description: カブール方言ダリ語の入門:スポーツや運動の語彙(サッカー、バレーボール、クリケット、水泳)、週に何回運動するかの尋ね方と答え方、どこでプレーや運動をするかの言い方、そしてスポーツ・頻度・場所をまとめたザルミナとホマユンの会話。
units:
  prs.a1.unit29.sports:
    title: スポーツ
    description: どんなスポーツや運動をするか、どのくらいの頻度で、どこでするかを話しましょう。
