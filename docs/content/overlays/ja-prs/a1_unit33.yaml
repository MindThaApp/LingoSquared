course:
  title: ダリー語 A1
  description: カブール・ダリー語の初級：家事の語彙(家事、ほうき、食器、きれい、手伝い)、باید を使って今日やるべき家事を言うこと、家事の手伝いを頼むこと、そして家事の分担について話す Wahid と Shukria の会話。
units:
  prs.a1.unit33.household:
    title: 家事
    description: 家事について話しましょう。やるべき家事や担当を言ったり、家事の手伝いを頼んだりします。
lessons:
  prs.a1.unit33.lesson01.chore_vocabulary:
    title: 家事の言葉
  prs.a1.unit33.lesson02.needing_to_do_chores:
    title: やらなければならない家事
  prs.a1.unit33.lesson03.asking_for_help:
    title: 助けを求める
  prs.a1.unit33.lesson04.chores_dialogue:
    title: 家事の分担
  prs.a1.unit33.lesson05.reading_chores:
    title: 家事についての読み物
  prs.a1.unit33.lesson06.wrap_up:
    title: まとめ
teaching:
  prs.a1.unit33.lesson01.teach.housework_word:
    title: 家事
    gloss: 家事
    note: کار خانه は「家事」という意味で、この単元のテーマになる表現です。
    example_gloss: 家事がたくさんあります。
  prs.a1.unit33.lesson01.teach.broom_word:
    title: ほうき
    gloss: ほうき
    note: جاروب は「ほうき」という意味で、アフガニスタンのダリー語で広く使われる単語です。
    example_gloss: ほうきはどこですか？
  prs.a1.unit33.lesson01.teach.dishes_word:
    title: 食器
    gloss: お皿
    note: ظرف は「食器」という意味で、ペルシア語とダリー語に共通する標準的な単語です。
    example_gloss: 食器は台所にあります。
  prs.a1.unit33.lesson01.teach.clean_word:
    title: きれい
    gloss: きれいな
    note: پاک は「きれい」という意味で、部屋や物の状態を表します。
    example_gloss: 部屋はきれいです。
  prs.a1.unit33.lesson01.teach.review_wash_do:
    title: 洗う/する
    gloss: 洗う / する — 私は洗う / 私はする
    note: شستن(洗う)はここで初めて出る新しい動詞です。کردن(する)と می‌کنم(私はする)は前の単元で学んだ復習です。
    target_text: شستن(洗う)/ کردن(する)— می‌شویم(私たちは洗う)/ می‌کنم(私はする)
  prs.a1.unit33.lesson01.teach.sweep_phrase:
    title: 私は掃きます
    gloss: 私は掃きます。
    note: جاروب(ほうき)と می‌کنم(私はする、復習)を組み合わせた表現で、直訳すると「私はほうきをする」です。
  prs.a1.unit33.lesson01.teach.wash_dishes_phrase:
    title: 私は食器を洗います
    gloss: 私はお皿を洗います。
    note: ظرف(食器)と、شستن の一人称の形 می‌شویم(私は洗う)を組み合わせた表現です。
  prs.a1.unit33.lesson02.teach.review_emrouz_che_bali:
    title: 今日/何/はい
    gloss: 今日 / 何 / はい
    note: امروز、چه、بلی はいずれも前の単元で学んだ復習の語です。
    target_text: امروز(今日)/ چه(何)/ بلی(はい)
  prs.a1.unit33.lesson02.teach.must_word:
    title: 〜しなければならない/必要がある
    gloss: ~しなければならない
    note: باید は新しく学ぶ助動詞的な語で、ここではやるべき家事を言うときに使います。
    target_text: باید(~しなければならない)
  prs.a1.unit33.lesson02.teach.subjunctive_konam:
    title: 私が〜すること
    gloss: 私がする(こと)
    note: کنم は باید のあとに کردن を使った動詞が続くときの形(接続法)で、می‌ はつきません。
    target_text: کنم(私がする — کردن系の動詞で باید の後に使い、می‌ は付けません)
  prs.a1.unit33.lesson02.teach.must_sweep_phrase:
    title: 今日は掃除しなければなりません
    gloss: 今日は掃除しなければなりません。
    note: امروز(今日、復習)と باید جاروب کنم(掃かなければならない)を組み合わせた表現です。
  prs.a1.unit33.lesson02.teach.must_clean_phrase:
    title: 掃除しなければなりません
    gloss: 私は掃除しなければなりません。
    note: باید(〜しなければならない、復習)と پاک کنم(私がきれいにする)を組み合わせた表現です。
  prs.a1.unit33.lesson02.teach.what_must_question:
    title: 私は何をしなければなりませんか？
    gloss: 私は何をしなければなりませんか？
    note: چه کار(何の仕事・家事)と باید کنم(私がしなければならない)を組み合わせた表現です。
  prs.a1.unit33.lesson02.teach.answer_must_sweep:
    title: はい、掃除しなければなりません
    gloss: はい、掃除しなければなりません。
    note: بلی(はい、復習)と باید جاروب کنم(掃かなければならない)を組み合わせた表現です。
  prs.a1.unit33.lesson03.teach.help_word:
    title: 助け
    gloss: 助け
    note: کمک は「手伝い・助け」という意味で、このコースで初めて出る新しい単語です。
    example_gloss: 手伝ってほしいです。
  prs.a1.unit33.lesson03.teach.review_lotfan_kardan_man:
    title: どうぞ/する/私/してください(丁寧)
    gloss: どうぞ / する / 私 / (〜して)ください(丁寧な形)
    note: لطفاً、کردن、من、そして کنین(-ین で終わる丁寧な命令形で、すでに学んだ形と同じ仲間)はいずれも前の単元で学んだ復習です。
    target_text: لطفاً(どうぞ)/ کردن(する)/ من(私)/ کنین(してください・丁寧)
  prs.a1.unit33.lesson03.teach.please_help_phrase:
    title: 手伝ってください
    gloss: 手伝ってください。
    note: لطفاً(どうぞ、復習)と کمک کنین(手伝ってください、丁寧な命令形)を組み合わせた表現です。
  prs.a1.unit33.lesson03.teach.review_ki_mikonad:
    title: 誰 / 彼・彼女はする
    gloss: 誰 / 彼(彼女)はする
    note: کی(誰、復習)と می‌کند(彼・彼女はする、復習)をここでもう一度取り上げます。
    target_text: کی(誰)/ می‌کند(彼/彼女がする)
  prs.a1.unit33.lesson03.teach.who_sweeps_question:
    title: 誰が掃きますか？
    gloss: 誰が掃きますか？
    note: کی(誰、復習)と جاروب می‌کند(掃く、三人称)を組み合わせた表現です。
  prs.a1.unit33.lesson03.teach.wahid_sweeps_answer:
    title: Wahid が掃きます
    gloss: Wahid が掃きます。
    note: 登場人物 Wahid(وحید)が出てきます。「誰が掃きますか？」という質問への答えです。
  prs.a1.unit33.lesson03.teach.i_help_phrase:
    title: 私は手伝います
    gloss: 私は手伝います。
    note: من(私、復習)と کمک می‌کنم(私は手伝う)を組み合わせた表現です。
  prs.a1.unit33.lesson04.teach.review_informal_words:
    title: あなた(くだけた形)/あなたがする/〜も/ありがとう/たくさん
    gloss: あなた(親しい相手) / あなたはする(親しい相手) / も / ありがとう / たくさん
    note: تو、می‌کنی、هم、تشکر、زیاد はいずれも復習の語で、くだけた会話で使うものをここにまとめています。
    target_text: تو(あなた・くだけた形)/ می‌کنی(あなたがする・くだけた形)/ هم(~も)/ تشکر(感謝)/ زیاد(たくさん)
  prs.a1.unit33.lesson04.teach.review_room_object_marker:
    title: 部屋/目的語マーカー
    gloss: 部屋 / 目的語を示す語
    note: اتاق と را(目的語を示す語、復習)をここでもう一度取り上げます。
    target_text: اتاق(部屋)/ را(目的語を示す語)
  prs.a1.unit33.lesson04.teach.dialogue_line1:
    title: 'Wahid: Shukria、今日は掃除しないといけないんだ。手伝ってくれる？'
    gloss: Shukria、今日は掃除しないといけないんだ。手伝ってくれる？
  prs.a1.unit33.lesson04.teach.dialogue_line2:
    title: 'Shukria：うん、手伝うよ。私は食器を洗うね。'
    gloss: うん、手伝うよ。私は食器を洗うね。
  prs.a1.unit33.lesson04.teach.dialogue_line3:
    title: 'Wahid：あなたも掃除する？'
    gloss: あなたも掃除する？
  prs.a1.unit33.lesson04.teach.dialogue_line4:
    title: 'Shukria：うん、部屋を掃除するよ。'
    gloss: うん、部屋を掃除するよ。
  prs.a1.unit33.lesson04.teach.dialogue_line5:
    title: 'Wahid：本当にありがとう！'
    gloss: 本当にありがとう！
  prs.a1.unit33.lesson05.teach.review_u_har_ruz_ast:
    title: 彼/彼女/毎日/です
    gloss: 彼・彼女 / 毎日 / です・である
    note: او(彼・彼女)、هر روز(毎日)、است(です・である)はいずれも復習の語で、ここでもう一度取り上げます。
    target_text: او(彼/彼女)/ هر روز(毎日)/ است(~である)
  prs.a1.unit33.lesson05.teach.review_mishuyad:
    title: 彼/彼女が洗う
    gloss: 彼/彼女は洗う
    note: 'می‌شوید は شستن の三人称の形で、すでに学んだ三人称の -د で終わる動詞の形(例： می‌کند)と同じ型です。'
    target_text: می‌شوید(彼/彼女が洗う)
  prs.a1.unit33.lesson05.teach.review_khoshhal:
    title: うれしい
    gloss: うれしい
    note: خوشحال は「うれしい」という意味です。
    target_text: خوشحال(うれしい)
  prs.a1.unit33.lesson05.teach.reading_passage:
    title: 家事についての読み物
    gloss: Wahid は毎日掃きます。Shukria は食器を洗います。彼(彼女)も手伝います。Wahid はうれしそうです。
  prs.a1.unit33.lesson06.teach.review_like_have_time:
    title: 好きです/時間/ありません/でも
    gloss: 好きです / 時間 / ありません / しかし
    note: دوست دارم(好きです)、وقت(時間)、ندارم(ありません)、اما(しかし)はいずれも前の単元で学んだ復習の語で、同じ総まとめの形を続けています。
    target_text: دوست دارم(好きです)/ وقت(時間)/ ندارم(ありません)/ اما(でも)
  prs.a1.unit33.lesson06.teach.wrap_summary:
    title: 家事は好きですが、時間がありません
    gloss: 家事は好きですが、時間がありません。
    note: کار خانه را دوست دارم(家事が好きです、復習の構文)と اما وقت ندارم(でも時間がありません)を組み合わせた表現です。
