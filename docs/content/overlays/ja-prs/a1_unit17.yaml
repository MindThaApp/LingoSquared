course:
  title: ダリー語 A1
  description: カーブルのダリー語の初級：基本的な症状(頭痛、熱、腹痛)、体調が悪いと伝える、医者や薬を頼む、短い健康アドバイスのメモや症状を伝える短いメッセージを読む、医者との会話。
units:
  prs.a1.unit17.health:
    title: 健康
    description: 基本的な体調不良を伝え、簡単なその場のアドバイスを理解する。
lessons:
  prs.a1.unit17.lesson01.symptom_words:
    title: 症状の言葉
  prs.a1.unit17.lesson02.feeling_unwell:
    title: 体調が悪いと伝える
  prs.a1.unit17.lesson03.asking_for_help:
    title: 医者や薬を頼む
  prs.a1.unit17.lesson04.reading_health_advice:
    title: 健康アドバイスのメモを読む
  prs.a1.unit17.lesson05.reading_a_health_message:
    title: 健康に関するメッセージを読む
  prs.a1.unit17.lesson06.doctor_dialogue:
    title: 医者との会話
teaching:
  prs.a1.unit17.lesson01.teach.headache_word:
    title: 頭痛
    gloss: 頭痛
    note: سردرد は سر(頭)と درد(痛み)を組み合わせた語です。
    example_gloss: 頭が痛いです。
  prs.a1.unit17.lesson01.teach.fever_word:
    title: 熱
    gloss: 熱
    note: تب は「熱」という意味です。
    example_gloss: 熱があります。
  prs.a1.unit17.lesson01.teach.stomachache_word:
    title: 腹痛
    gloss: 腹痛
    note: دل‌درد は دل(口語で「おなか」)と درد(痛み)を組み合わせた語です。
    example_gloss: おなかが痛いです。
  prs.a1.unit17.lesson01.teach.have_word:
    title: 私は持っています
    gloss: 私は持っている
    note: دارم は داشتن(持つ)の一人称・現在形です。
    target_text: دارم(私は持っています)
  prs.a1.unit17.lesson02.teach.sick_word:
    title: 病気の
    gloss: 病気の
    note: مریض は「病気の」「具合が悪い」という意味です。
    example_gloss: 私は病気です。
  prs.a1.unit17.lesson02.teach.am_word:
    title: 私は〜です
    gloss: 私は〜です
    note: استم は一人称の丁寧なコピュラ(〜です)で、このコースの استم/استین の使い方に沿っています。
    target_text: استم(私は〜です)
  prs.a1.unit17.lesson02.teach.my_condition_word:
    title: 私の調子・気分
    gloss: 私の具合・体調
    note: حالم(حال + م)は直訳すると「私の状態」で、حالم خوب نیست は「具合が悪いです」という意味です。
    target_text: حالم(私の具合・体調)
  prs.a1.unit17.lesson02.teach.good_word:
    title: 良い
    gloss: 良い
    note: خوب は「良い」「元気な」という意味です。
    example_gloss: 具合が悪いです。
  prs.a1.unit17.lesson02.teach.not_word:
    title: 〜ではない
    gloss: 〜ではない
    note: نیست は否定のコピュラで、خوب نیست は「良くない」「具合が良くない」という意味です。
    target_text: نیست(〜ではない)
  prs.a1.unit17.lesson03.teach.doctor_word:
    title: 医者
    gloss: 医者
    note: داکتر は「医者」を表すアフガニスタンのダリー語の標準的な綴りと発音です(イランのペルシア語の دکتر とは異なります)。
    example_gloss: 医者を呼んでください。
  prs.a1.unit17.lesson03.teach.medicine_word:
    title: 薬
    gloss: 薬
    note: دوا は「薬」という意味です。
    example_gloss: 薬がほしいです。
  prs.a1.unit17.lesson03.teach.want_word:
    title: 私は〜がほしい
    gloss: 私は〜したい
    note: می‌خواهم は「私は欲しい」という意味です。
    target_text: می‌خواهم(私は欲しい)
  prs.a1.unit17.lesson04.teach.rest_word:
    title: 休息
    gloss: 休息
    note: استراحت は「休息」という名詞で、کنین と組み合わせて「休んでください」という命令の形になります。
    example_gloss: 休んでください。
  prs.a1.unit17.lesson04.teach.do_word:
    title: する(丁寧)
    gloss: してください(丁寧な命令形)
    note: کنین は کردن(する)の丁寧な命令形で、استراحت کنین は直訳すると「休息をしてください」、つまり「休んでください」という意味です。
    target_text: کنین(〜してください・丁寧な命令形)
  prs.a1.unit17.lesson04.teach.water_word:
    title: 水
    gloss: 水
    note: آب は「水」という意味です。
    example_gloss: 水をたくさん飲んでください。
  prs.a1.unit17.lesson04.teach.a_lot_word:
    title: たくさん
    gloss: たくさん／多く
    note: زیاد は「たくさん」「多く」という意味です。
    example_gloss: 水をたくさん飲んでください。
  prs.a1.unit17.lesson04.teach.drink_word:
    title: 飲む(丁寧)
    gloss: 飲んでください(丁寧な命令形)
    note: بنوشین は نوشیدن(飲む)の丁寧な命令形です。
    target_text: بنوشین(飲んでください・丁寧な命令形)
  prs.a1.unit17.lesson04.teach.advice_text:
    title: 健康アドバイスのメモ
    gloss: 休んでください。水をたくさん飲んでください。
    note: 基本的な健康アドバイスを二つ伝える短いメモです。
  prs.a1.unit17.lesson05.teach.hello_word:
    title: こんにちは
    gloss: こんにちは
    note: سلام は「こんにちは」という意味です。
    example_gloss: こんにちは。具合が悪いです。
  prs.a1.unit17.lesson05.teach.and_word:
    title: 〜と、そして
    gloss: そして
    note: و は「と」「そして」という意味で、二つの語や節をつなぎます。
    target_text: و(と・そして)
  prs.a1.unit17.lesson05.teach.message_text:
    title: 健康についての短いメッセージ
    gloss: こんにちは。具合が悪いです。頭痛と熱があります。
    note: 二つの症状を伝える、一人称の短いメッセージです。
  prs.a1.unit17.lesson06.teach.names:
    title: バシールと医者
    gloss: バシール、医者
    note: バシールはこのコースに繰り返し登場する人物です。医者には敬称の صاحب を付けて呼びかけます。
    example_gloss:
    - 私はバシールです。
    - 私は医者です。
  prs.a1.unit17.lesson06.teach.how_word:
    title: どう、どのように
    gloss: どのように
    note: چطور は「どのように」「どう」という意味です。
    target_text: چطور(どのように・いかが)
  prs.a1.unit17.lesson06.teach.are_you_word:
    title: あなたは〜です(丁寧)
    gloss: あなたは〜です
    note: استین は「あなたは〜です」にあたる丁寧な言い方です。このコースで学ぶ استم/استین の使い分けと同じです。
    target_text: استین(あなたは〜です・丁寧)
  prs.a1.unit17.lesson06.teach.thanks_word:
    title: お礼
    gloss: ありがとう
    note: تشکر は「ありがとう」という意味です。
    example_gloss: ありがとうございます、先生。
  prs.a1.unit17.lesson06.teach.sir_word:
    title: 敬称
    gloss: 〜様
    note: صاحب は名前や肩書きの後ろに付ける、敬意を表す敬称です。داکتر صاحب は敬意を込めて「先生」と医者に呼びかける言い方で、アフガニスタンらしい用法です。
    example_gloss: ありがとうございます、先生。
  prs.a1.unit17.lesson06.teach.dialogue_line1:
    title: 医者がバシールにあいさつする
    gloss: こんにちは。お加減はいかがですか？
  prs.a1.unit17.lesson06.teach.dialogue_line2:
    title: バシールが答える
    gloss: こんにちは。具合が悪いです。頭痛と熱があります。
  prs.a1.unit17.lesson06.teach.dialogue_line3:
    title: 医者がアドバイスする
    gloss: 休んでください。水をたくさん飲んでください。
  prs.a1.unit17.lesson06.teach.dialogue_line4:
    title: バシールが医者にお礼を言う
    gloss: ありがとうございます、先生。
