course:
  title: ダリー語 A1
  description: カブール方言ダリー語の初級:衣類の語彙、色、サイズ、試着の仕方、衣料品タグの読み方、そしてシャツを買う店での会話まで学びます。
units:
  prs.a1.unit21.clothing:
    title: 服を買う
    description: よくある衣類を言い表し、簡単な服の買い物ができるようになる。
lessons:
  prs.a1.unit21.lesson01.clothing_vocabulary:
    title: 衣類の単語
  prs.a1.unit21.lesson02.colors:
    title: 色
  prs.a1.unit21.lesson03.sizes:
    title: サイズ
  prs.a1.unit21.lesson04.trying_on_and_reading_a_label:
    title: 試着とラベルの読み方
  prs.a1.unit21.lesson05.clothing_shop_dialogue:
    title: 洋服店での会話
  prs.a1.unit21.lesson06.wrap_up_reading:
    title: まとめの読解
teaching:
  prs.a1.unit21.lesson01.teach.lebas:
    title: 衣類
    gloss: 服
    note: لباس は「服」を意味する一般的な言葉です。
    example_gloss: これらは新しい服です。
  prs.a1.unit21.lesson01.teach.perahan:
    title: シャツ
    gloss: シャツ
    note: پیراهن は「シャツ」という意味です。
    example_gloss: このシャツはすてきです。
  prs.a1.unit21.lesson01.teach.patlun:
    title: ズボン
    gloss: ズボン
    note: پطلون は「ズボン」という意味で、アフガニスタンのダリー語で使われる本来の言葉です(英語系の外来語で、「パンタロン」に由来します)。イランのペルシア語の شلوار とは異なります。
    example_gloss: このズボンは高いです。
  prs.a1.unit21.lesson01.teach.kafsh:
    title: 靴
    gloss: 靴
    note: کفش は「靴」という意味です。
    example_gloss: この靴は安いです。
  prs.a1.unit21.lesson01.teach.review_ast:
    title: 〜です
    gloss: 〜です
    note: است(〜です)は、あいさつの単元でもう学びました。
    example_gloss: これはシャツです。
  prs.a1.unit21.lesson01.teach.review_geran:
    title: 高い
    gloss: 高い
    note: گران(高い)は、買い物の単元でもう学びました。
    example_gloss: このズボンは高いです。
  prs.a1.unit21.lesson02.teach.rang:
    title: 色
    gloss: 色
    note: رنگ は「色」という意味です。
    example_gloss: このシャツは何色ですか。
  prs.a1.unit21.lesson02.teach.siyah:
    title: 黒
    gloss: 黒
    note: سیاه は「黒」という意味です。
    example_gloss: このズボンは黒です。
  prs.a1.unit21.lesson02.teach.safid:
    title: 白
    gloss: 白
    note: سفید は「白」という意味です。
    example_gloss: このシャツは白です。
  prs.a1.unit21.lesson02.teach.sorkh:
    title: 赤
    gloss: 赤い
    note: سرخ は「赤」という意味です。ダリー語や古典ペルシア語の形で、イランの口語の قرمز とは異なります。
    example_gloss: この靴は赤です。
  prs.a1.unit21.lesson03.teach.andaza:
    title: サイズ
    gloss: サイズ
    note: اندازه は「サイズ」という意味の名詞です。
    example_gloss: サイズはおいくつですか。
  prs.a1.unit21.lesson03.teach.andazatan_chand:
    title: サイズはおいくつですか。
    gloss: サイズはおいくつですか。
    note: اندازه شما چند است؟ は直訳すると「あなたのサイズはいくつですか」という意味です。
  prs.a1.unit21.lesson03.teach.in_andaza_shoma:
    title: これはあなたのサイズですか。
    gloss: これはあなたのサイズですか。
    note: این اندازه شما است؟ では、ここで初めて این(これ、この)が出てきます。
  prs.a1.unit21.lesson03.teach.review_bozorg:
    title: 大きい
    gloss: 大きい
    note: بزرگ(大きい)は、比較の単元でもう学びました。
    example_gloss: このシャツは大きいです。
  prs.a1.unit21.lesson03.teach.review_kochak:
    title: 小さい
    gloss: 小さい
    note: کوچک(小さい)は、比較の単元でもう学びました。
    example_gloss: この靴は小さいです。
  prs.a1.unit21.lesson04.teach.pero_kardan:
    title: 試着してもいいですか。
    gloss: 試着してもいいですか。
    note: پرو کردن は「試着する」という意味です(フランス語からの外来語で、ダリー語でもペルシア語でも使われます)。می‌توانم این را پرو کنم؟ は語順どおりに訳すと「私はこれを試着することができますか」となり、日本語とは動詞の位置が違い、動詞が文末に来ます。
  prs.a1.unit21.lesson04.teach.mitanin_pero_konin:
    title: はい、試着できます
    gloss: はい、試着できます。
    note: می‌توانین پرو کنین は、同じ動詞の二人称の丁寧な形です。
  prs.a1.unit21.lesson04.teach.label_text:
    title: 服のラベル
    gloss: シャツ:サイズ大、色は白、500アフガニー
    note: 品名、サイズ、色、値段が書かれたシンプルなラベルです。
  prs.a1.unit21.lesson04.teach.review_ra:
    title: 目的語の印
    gloss: (目的語を示す助詞)
    note: را は直接目的語を示す印で、これまでの単元のフレーズですでに出てきました。
    example_gloss: このシャツがほしいです。
  prs.a1.unit21.lesson04.teach.review_afghani:
    title: アフガニー
    gloss: アフガニー
    note: افغانی(アフガニー)は通貨の単位で、買い物の単元でもう学びました。
    example_gloss: これは500アフガニーです。
  prs.a1.unit21.lesson05.teach.che_rang_darad:
    title: このシャツは何色ですか。
    gloss: このシャツは何色ですか。
    note: این پیراهن چه رنگ دارد؟ では、ここで初めて دارد(持っている)が出てきます。
  prs.a1.unit21.lesson05.teach.turn01:
    title: 店主のあいさつ
    gloss: こんにちは、いらっしゃいませ。
  prs.a1.unit21.lesson05.teach.turn02:
    title: ザルミナの質問
    gloss: こんにちは。このシャツは何色がありますか。
    note: زرمینه(ザルミナ)は、このコースに繰り返し登場する人物で、時間や日課の単元で初めて登場しました。
  prs.a1.unit21.lesson05.teach.turn03:
    title: 店主の答え
    gloss: 黒と白があります。
  prs.a1.unit21.lesson05.teach.turn04:
    title: ザルミナの選択
    gloss: 白いシャツをください。サイズは大きいですか。
    note: اندازه‌اش(そのサイズ)は、اندازه に所有を表す語尾がついた形です。
  prs.a1.unit21.lesson05.teach.turn05:
    title: 店主の返事
    gloss: はい、大きいです。試着できますよ。
  prs.a1.unit21.lesson05.teach.turn06:
    title: ザルミナの試着
    gloss: ありがとうございます。これは私のサイズです。いくらですか。
  prs.a1.unit21.lesson05.teach.turn07:
    title: 店の人が値段を言う
    gloss: 500アフガニーです。
  prs.a1.unit21.lesson05.teach.turn08:
    title: ザルミナの決断
    gloss: いいですね、買います。
    note: می‌خرم は、خریدن(買う)の一人称・現在形です。
  prs.a1.unit21.lesson05.teach.review_dokandar:
    title: 店主
    gloss: 店主
    note: دوکاندار(店主)は、買い物の単元でもう学びました。
    example_gloss: 店主はシャツを売っています。
  prs.a1.unit21.lesson05.teach.review_besyar_khoob:
    title: とてもよい
    gloss: とてもよい
    note: بسیار خوب(とてもよい)は、買い物の単元でもう学びました。
    example_gloss: とてもよいです、ありがとう。
  prs.a1.unit21.lesson05.teach.review_che:
    title: 何
    gloss: 何
    note: چه(何)は、これまでの単元の疑問文ですでに出てきました。
    example_gloss: これは何色ですか。
  prs.a1.unit21.lesson06.teach.review_va:
    title: 〜と
    gloss: と・そして
    note: و(〜と)は、買い物の単元でもう学びました。
    example_gloss: シャツとズボンを買います。
  prs.a1.unit21.lesson06.teach.review_yak:
    title: 一
    gloss: 一
    note: یک(1、一つの)は、数の単元でもう学びました。
    example_gloss: シャツを1枚買います。
  prs.a1.unit21.lesson06.teach.review_ba:
    title: 〜へ
    gloss: ~へ
    note: به(〜へ)は、道案内や日課の単元でもう学びました。
    example_gloss: 店に行きます。
  prs.a1.unit21.lesson06.teach.review_dokan:
    title: お店
    gloss: お店
    note: دوکان(店)は、買い物の単元でもう学びました。
    example_gloss: このお店は大きいです。
  prs.a1.unit21.lesson06.teach.review_raft:
    title: 行った
    gloss: 行った
    note: رفت(行った、三人称)は、過去の出来事の単元でもう学びました。
    example_gloss: ザルミナは店に行きました。
  prs.a1.unit21.lesson06.teach.review_qeymatesh:
    title: その値段
    gloss: その値段
    note: قیمتش(その値段)は、買い物の単元でもう学びました。
    example_gloss: その値段は500アフガニーでした。
  prs.a1.unit21.lesson06.teach.summary_text:
    title: 買い物のまとめ
    gloss: ザルミナは店に行きました。白くて大きいシャツを買いました。値段は500アフガニーでした。
    note: خرید(買った)と بود(だった)は、どちらも単純過去形で、過去の出来事の単元でもう学びました。
