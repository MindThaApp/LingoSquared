  prs.a1.unit42.lesson01.teach.review_want_one:
    title: 復習:私は~したい、一つの
    gloss: 私は~したい/一つの
    note: می‌خواهم と یک を組み合わせると、ほしいものを言えます。
    target_text: می‌خواهم(私は欲しい・したい)/ یک(1つの)
  prs.a1.unit42.lesson01.teach.tooth_word:
    title: 歯
