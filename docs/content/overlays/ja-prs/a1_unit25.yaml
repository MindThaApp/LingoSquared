course:
  title: ダリー語 A1
  description: カブール方言ダリー語の初級：基本の気持ちを表す言葉(うれしい、悲しい、疲れた、怒った、心配)、理由のたずね方と چون を使った答え方、そしてザルミナとホマーユーンがそれぞれの気分を比べる会話。
units:
