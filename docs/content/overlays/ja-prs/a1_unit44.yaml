course:
  title: ダリー語 A1
  description: 初級カブール・ダリー語：家庭のごみを正しいごみ箱に分別する、物がどのごみ箱に入るかをたずねる、2項目の短い回収日スケジュールを読む。ごみ、紙、プラスチック、ガラスについて話し、友達と緑と青のごみ箱の分別を確認します。
units:
  prs.a1.unit44.waste_disposal:
    title: ごみの分別
    description: 家庭のごみを正しいごみ箱に分別し、物がどのごみ箱に入るかをたずね、簡単なごみ回収のスケジュールを理解します。
lessons:
  prs.a1.unit44.lesson01.waste_bin_vocabulary:
    title: ごみ・ごみ箱・プラスチックの語彙
  prs.a1.unit44.lesson02.paper_and_glass:
    title: 紙・ガラス・青いごみ箱
  prs.a1.unit44.lesson03.throwing_away_waste:
    title: ごみを捨てる
  prs.a1.unit44.lesson04.waste_sorting_dialogue:
    title: ごみ分別の会話
  prs.a1.unit44.lesson05.reading:
    title: ワヒドとごみについて読む
  prs.a1.unit44.lesson06.wrap_up:
    title: まとめ
teaching:
  prs.a1.unit44.lesson01.teach.review_is_in:
    title: 復習：〜です、〜の中に
    gloss: 〜です / 〜の中に
    note: است と در(このコースで何度も出てきました)は、物がどこにあるかを言うときに使う復習の単語です。
    target_text: است(です)/ در(〜に、〜で)
  prs.a1.unit44.lesson01.teach.review_colors:
    title: 復習：色、緑、青
    gloss: 色 / 緑 / 青
    note: رنگ、سبز、آبی は、2種類のごみ箱を言い表すときに使う復習の単語です。
    target_text: رنگ(色)/ سبز(緑)/ آبی(青)
  prs.a1.unit44.lesson01.teach.bin_word:
    title: ごみ箱
    gloss: 容器
    note: سطل は、ごみ箱やバケツを指す日常的なダリー語です。
    example_gloss: ごみ箱は緑です。
  prs.a1.unit44.lesson01.teach.waste_word:
    title: ごみ
    gloss: ごみ
    note: زباله は家庭から出るごみを意味します。
    example_gloss: ごみはごみ箱の中にあります。
  prs.a1.unit44.lesson01.teach.green_bin_phrase:
    title: 緑のごみ箱
    gloss: 緑のごみ箱
    note: سطل سبز は سطل(ごみ箱)と سبز(緑)を組み合わせた言い方です。
  prs.a1.unit44.lesson01.teach.plastic_word:
    title: プラスチック
    gloss: プラスチック
    note: پلاستیک は、ダリー語を含むペルシア語の各方言で広く使われる外来語です。
    example_gloss: プラスチックは青いごみ箱の中にあります。
  prs.a1.unit44.lesson01.teach.waste_in_green_bin_phrase:
    title: ごみは緑のごみ箱に入れます
    gloss: ごみは緑のごみ箱に入れます。
    note: زباله در سطل سبز است は、このレッスンで学んだ単語を組み合わせた文です。
  prs.a1.unit44.lesson02.teach.review_which_in_is:
    title: 復習：どの、〜の中に、〜です
    gloss: どの / 〜の中に / 〜です
    note: کدام、در、است は、物がどのごみ箱に入るかをたずねるときに使う復習の単語です。
    target_text: کدام(どの)/ در(〜に、〜で)/ است(です)
  prs.a1.unit44.lesson02.teach.paper_word:
    title: 紙
    gloss: 紙
    note: کاغذ は、紙を指す日常的なダリー語です。
    example_gloss: 紙はごみ箱の中にあります。
  prs.a1.unit44.lesson02.teach.glass_word:
    title: ガラス
    gloss: ガラス
    note: شیشه は、ガラスを指す日常的なダリー語です。
    example_gloss: ガラスはごみ箱の中にあります。
  prs.a1.unit44.lesson02.teach.blue_bin_phrase:
    title: 青いごみ箱
    gloss: 青いごみ箱
    note: سطل آبی は سطل(ごみ箱)と آبی(青)を組み合わせた言い方で、紙・プラスチック・ガラスなどの資源ごみに使います。
  prs.a1.unit44.lesson02.teach.ask_which_bin_paper_phrase:
    title: 紙はどのごみ箱に入れますか。
    gloss: 紙はどのごみ箱に入れますか。
    note: کاغذ در کدام سطل است؟ は、物がどのごみ箱に入るかをたずねる文です。
  prs.a1.unit44.lesson02.teach.paper_blue_bin_phrase:
    title: 紙は青いごみ箱に入れます
    gloss: 紙は青いごみ箱に入れます。
    note: کاغذ در سطل آبی است は、質問に対して正しいごみ箱を答える文です。
  prs.a1.unit44.lesson02.teach.glass_blue_bin_phrase:
    title: ガラスは青いごみ箱に入れます
    gloss: ガラスは青いごみ箱に入れます。
    note: شیشه در سطل آبی است は、紙の文と同じ型の文です。
  prs.a1.unit44.lesson03.teach.review_object_marker_put:
    title: 復習：目的語を示す助詞、入れる・捨てる
    gloss: (目的語を示す助詞) / 私は入れる・捨てる
    note: را と می‌اندازم(ユニット36では「塩を入れる」の意味で登場しました)は復習の単語です。انداختن には「入れる」と「捨てる」の両方の意味があります。
    target_text: را (目的語を示す助詞) / می‌اندازم (私は入れる・捨てる)
  prs.a1.unit44.lesson03.teach.away_word:
    title: 遠くへ・捨てて
    gloss: 遠くへ・捨てて
    note: دور(遠くへ)は می‌اندازم と組み合わさって、「捨てる」を表す標準的な دور انداختن の形になります。
    example_gloss: 私はそれを捨てます。
  prs.a1.unit44.lesson03.teach.throw_away_waste_phrase:
    title: 私はごみを捨てます
    gloss: 私はごみを捨てます。
    note: زباله را دور می‌اندازم は、زباله را、دور、می‌اندازم を組み合わせた文です。
  prs.a1.unit44.lesson03.teach.put_plastic_green_bin_phrase:
    title: 私はプラスチックを青いごみ箱に入れます
    gloss: 私はプラスチックを青いごみ箱に入れます。
    note: پلاستیک را در سطل آبی می‌اندازم では、می‌اندازم を「入れる」の意味で使っています。
  prs.a1.unit44.lesson03.teach.put_paper_blue_bin_phrase:
    title: 私は紙を青いごみ箱に入れます
    gloss: 私は紙を青いごみ箱に入れます。
    note: کاغذ را در سطل آبی می‌اندازم は、青いごみ箱について同じ型を使った文です。
  prs.a1.unit44.lesson03.teach.review_negative_put:
    title: 復習：入れない・捨てない
    gloss: 私は入れない・捨てない
    note: نمی‌اندازم は、می‌اندازم に نمی- を付けた規則的な否定形です。
    target_text: نمی‌اندازم (私は入れない・捨てない)
  prs.a1.unit44.lesson03.teach.not_glass_green_bin_phrase:
    title: 私はガラスを緑のごみ箱には入れません
    gloss: 私はガラスを緑のごみ箱には入れません。
    note: شیشه را در سطل سبز نمی‌اندازم は、否定形を使って分別のルールを述べる文です。
  prs.a1.unit44.lesson03.teach.glass_blue_bin_action_phrase:
    title: 私はガラスを青いごみ箱に入れます
    gloss: 私はガラスを青いごみ箱に入れます。
    note: شیشه را در سطل آبی می‌اندازم は、ガラスの正しい捨て方を表す文です。
  prs.a1.unit44.lesson04.teach.review_this:
    title: 復習：この・これ
    gloss: これ
    note: این は、会話の中で使われる復習の単語です。
    target_text: این (この・これ)
  prs.a1.unit44.lesson04.teach.review_very_good_thanks_welcome:
    title: 復習：とても、良い、どうもありがとう、どういたしまして
    gloss: とても / 良い / どうもありがとう / どういたしまして
    note: بسیار、خوب、تشکر زیاد、خواهش می‌کنم は、会話を締めくくるときに使う復習の単語です。
    target_text: بسیار (とても) / خوب (良い) / تشکر زیاد (どうもありがとう) / خواهش می‌کنم (どういたしまして)
  prs.a1.unit44.lesson04.teach.dialogue_line1:
    title: ワヒド：シュクリア、このガラスはどのごみ箱に入れますか。
    gloss: シュクリア、このガラスはどのごみ箱に入れますか。
  prs.a1.unit44.lesson04.teach.dialogue_line2:
    title: シュクリア：ガラスは青いごみ箱に入れます。
    gloss: ガラスは青いごみ箱に入れます。
  prs.a1.unit44.lesson04.teach.dialogue_line3:
    title: ワヒド：このごみはどのごみ箱に入れますか。
    gloss: このごみはどのごみ箱に入れますか。
  prs.a1.unit44.lesson04.teach.dialogue_line4:
    title: シュクリア：ごみは緑のごみ箱に入れます。
    gloss: ごみは緑のごみ箱に入れます。
  prs.a1.unit44.lesson04.teach.dialogue_line5:
    title: ワヒード：とてもいいですね。どうもありがとう。
    gloss: とても良いです。どうもありがとう。
  prs.a1.unit44.lesson04.teach.dialogue_line6:
    title: シュクリヤ：どういたしまして。
    gloss: どういたしまして。
  prs.a1.unit44.lesson05.teach.review_wahid_he_she_every_day:
    title: 復習：ワヒード、彼/彼女、毎日、〜も、うれしい
    gloss: ワヒード/彼・彼女/毎日/〜も/うれしい
    note: وحید، او، هر روز، هم، خوشحال は、読み物に出てくる復習の単語です。
    target_text: وحید (ワヒド) / او (彼・彼女) / هر روز (毎日) / هم (も) / خوشحال (うれしい)
  prs.a1.unit44.lesson05.teach.review_throws_third_person:
    title: 復習：彼/彼女は捨てる
    gloss: 彼・彼女は入れる・捨てる
    note: می‌اندازد は、この単元で先に学んだ می‌اندازم/نمی‌اندازم の仲間の3人称の形です。
    target_text: می‌اندازد (彼・彼女は入れる・捨てる)
  prs.a1.unit44.lesson05.teach.reading_passage:
    title: ワヒドとごみについて読む
    gloss: ワヒードは毎日ゴミを捨てます。紙は青いゴミ箱に入っています。プラスチックも青いゴミ箱に入っています。ゴミは緑のゴミ箱に入っています。ワヒードはうれしいです。
  prs.a1.unit44.lesson06.teach.review_days_but_formal_you:
    title: 復習：月曜日、火曜日、でも、あなた(丁寧)
    gloss: 月曜日/火曜日/でも/あなた(丁寧)
    note: دوشنبه، سه‌شنبه، اما، شما は、2つの予定を述べるときに使う復習の単語です。
    target_text: دوشنبه (月曜日) / سه‌شنبه (火曜日) / اما (でも・しかし) / شما (あなた、丁寧)
  prs.a1.unit44.lesson06.teach.collection_word:
    title: 収集
    gloss: 収集
    note: جمع‌آوری は「収集」「集めること」という意味で、日本語の「ゴミ収集日」の「収集」のように、ゴミの収集日を言うときに使います。
    example_gloss: 収集日は月曜日です。
  prs.a1.unit44.lesson06.teach.paper_collection_day_phrase:
    title: 紙の収集日は月曜日です
    gloss: 紙の回収日は月曜日です。
    note: روز جمع‌آوری کاغذ دوشنبه است は、品目とその収集日を言う文です。
  prs.a1.unit44.lesson06.teach.waste_collection_day_phrase:
    title: ゴミの収集日は火曜日です
    gloss: ゴミの収集日は火曜日です。
    note: روز جمع‌آوری زباله سه‌شنبه است は、ゴミについて同じ型で言う文です。
  prs.a1.unit44.lesson06.teach.contrast_schedule_phrase:
    title: 紙は月曜日、でもゴミは火曜日
    gloss: 紙の回収日は月曜日ですが、ごみの回収日は火曜日です。
    note: اما は、2つの収集日を対比させる「でも・しかし」です。
  prs.a1.unit44.lesson06.teach.review_throw_formal:
    title: 復習：あなたは捨てる・入れる(丁寧)
    gloss: あなたは入れる・捨てる(丁寧)
    note: می‌اندازین は丁寧な複数の形で、می‌خواهین/کنین と同じ -ین の形の仲間です。
    target_text: می‌اندازین (あなたは入れる・捨てる、丁寧)
  prs.a1.unit44.lesson06.teach.formal_question_phrase:
    title: あなたは何曜日にごみを捨てますか。
    gloss: あなたは何曜日にごみを捨てますか。
    note: شما を使った丁寧な言い方で、相手がどの日にゴミを捨てるかをたずねる文です。
