course:
  title: ダリー語 A1
  description: カーブルのダリー語・初級：基本的な比較（大きい／小さい、高い／安い、背が高い／若い）、比較の理由の述べ方、そして二つのものを比べる短い読み物／会話。
units:
  prs.a1.unit15.comparisons:
    title: 比較
    description: 身近な人・物・選択肢について、基本的な比較を言ったり理解したりできる。
lessons:
  prs.a1.unit15.lesson01.basic_comparative:
    title: 基本の比較表現
  prs.a1.unit15.lesson02.comparing_prices:
    title: 値段を比べる
  prs.a1.unit15.lesson03.comparing_people:
    title: 人を比べる
  prs.a1.unit15.lesson04.giving_reasons:
    title: 比較の理由を言う
  prs.a1.unit15.lesson05.reading_a_comparison:
    title: 比較の文章を読む
  prs.a1.unit15.lesson06.comparisons_dialogue:
    title: 2つのものを比べる会話
teaching:
  prs.a1.unit15.lesson01.teach.in_word:
    title: これ
    gloss: これ
    note: این は「これ」という意味です。
    example_gloss: こちらのほうが大きいです。
  prs.a1.unit15.lesson01.teach.aan_word:
    title: あれ
    gloss: あれ
    note: آن は「あれ」「それ」という意味です。このコースのダリー語では完全な形 آن を使い、口語的なイラン式の اون は使いません。
    example_gloss: あちらのほうが小さいです。
  prs.a1.unit15.lesson01.teach.bozorgtar_ast_word:
    title: より大きい
    gloss: もっと大きいです
    note: بزرگ‌تر است は縮約しない完全な形で、「より大きいです」という意味です。*بزرگ‌تر* は *بزرگ*(大きい)の比較級で、*است* は別の語として残ります。
    example_gloss: これはあれより大きいです。
  prs.a1.unit15.lesson01.teach.koochaktar_ast_word:
    title: より小さい
    gloss: もっと小さいです
    note: کوچک‌تر است は完全な形で、「より小さいです」という意味です。کوچک はダリー語の標準的な綴りで、イランの口語 کوچیک ではありません。
    example_gloss: あれはこれより小さいです。
  prs.a1.unit15.lesson01.teach.az_word:
    title: 〜より
    gloss: 〜より
    note: از は比較の基準を表します。X از Y بزرگ‌تر است は「XはYより大きい」という意味です。
    target_text: از（〜より）
  prs.a1.unit15.lesson02.teach.gerantar_ast_word:
    title: より高い(値段が)
    gloss: もっと高いです
    note: گران‌تر است は完全な形で、「より高いです」(値段が高い)という意味です。گران はダリー語の標準的な綴りで、イランの口語 گرون ではありません。
    example_gloss: これはあれより高いです。
  prs.a1.unit15.lesson02.teach.arzantar_ast_word:
    title: より安い
    gloss: もっと安いです
    note: ارزان‌تر است は完全な形で、「より安いです」という意味です。ارزان はダリー語の標準的な綴りで、イランの口語 ارزون ではありません。
    example_gloss: あれはこれより安いです。
  prs.a1.unit15.lesson03.teach.names:
    title: カリームとネガール
    gloss: カリーム、ネガール
    note: このコースでよく使うアフガニスタンの一般的な名前です。
    example_gloss:
    - 私はカリームです。
    - 私はネガールです。
  prs.a1.unit15.lesson03.teach.ghad_bolandtar_phrase:
    title: より背が高い
    gloss: より背が高い/彼・彼女のほうが背が高い
    note: '*قد بلندتر است* は直訳すると「背丈がより高い」という意味です。*قد*(背丈)、*بلندتر*(より高い。*بلند*(高い)の比較級)、*است*(です)から成ります。'
  prs.a1.unit15.lesson03.teach.javantar_ast_word:
    title: より年下の
    gloss: より若い/彼・彼女のほうが若い
    note: جوان‌تر است は完全な形で、「より若いです」という意味です。جوان はダリー語の標準的な綴りで、イランの口語 جوون ではありません。
    example_gloss: ネガールはカリームより若いです。
  prs.a1.unit15.lesson04.teach.behtar_ast_word:
    title: よりいい
    gloss: こっちのほうがいいです
    note: بهتر است は完全な形です。بهتر(より良い)は خوب(良い)の不規則な比較級です。
    example_gloss: これはあれよりいいです。
  prs.a1.unit15.lesson04.teach.badtar_ast_word:
    title: より悪い
    gloss: こっちのほうが悪いです
    note: بدتر است は完全な形です。بدتر(より悪い)は بد(悪い)の不規則な比較級です。
    example_gloss: あれはこれより悪いです。
  prs.a1.unit15.lesson04.teach.choon_word:
    title: なぜなら
    gloss: なぜなら
    note: چون は理由を導きます。
    target_text: چون（なぜなら）
  prs.a1.unit15.lesson04.teach.va_word:
    title: 〜と、そして
    gloss: と・そして
    note: و は「と」「そして」という意味で、二つの文や語をつなぎます。
    target_text: و（と）
  prs.a1.unit15.lesson05.teach.reading_text:
    title: 比較の文章の例
    gloss: カリームはネガールより背が高いです。ネガールはカリームより若いです。
    note: この課の語彙を組み合わせた、第三者についての短い比較文です。
  prs.a1.unit15.lesson06.teach.names:
    title: カリームとネガール
    gloss: カリーム、ネガール
    example_gloss:
    - カリームのほうが背が高いです。
    - ネガールのほうが若いです。
  prs.a1.unit15.lesson06.teach.ama_word:
    title: でも、しかし
    gloss: でも
    note: اما は「しかし」という意味で、対比を表します。
    target_text: اما（しかし）
  prs.a1.unit15.lesson06.teach.bali_word:
    title: はい
    gloss: はい
    note: بلی は「はい」の丁寧で改まった言い方で、このコースの文体に合っています。
    example_gloss: はい、こちらのほうが高いです。
  prs.a1.unit15.lesson06.teach.dialogue_line1:
    title: カリームの発言
    gloss: これはあれより高いですが、いいです。
  prs.a1.unit15.lesson06.teach.dialogue_line2:
    title: ネガールの返事
    gloss: はい、でもあちらのほうが安いです。
