  prs.a1.unit14.lesson06.preferences_dialogue:
    title: 好みについての会話
teaching:
  prs.a1.unit14.lesson01.teach.doost_daram_phrase:
    title: 私は好き
    gloss: 私は好き
    note: دوست دارم は直訳すると「(それに対する)友情を持っている」で、「好きです」と言うときの標準的な表現です。
  prs.a1.unit14.lesson01.teach.qahwa_word:
    title: コーヒー
    gloss: コーヒー
    note: قهوه は「コーヒー」という意味です。
    example_gloss: コーヒーが好きです。
  prs.a1.unit14.lesson01.teach.chai_word:
    title: 紅茶
    gloss: お茶
    note: چای は「お茶」という意味です。
    example_gloss: 私はお茶が好きではありません。
  prs.a1.unit14.lesson01.teach.doost_nadaram_phrase:
    title: 好きではありません
    gloss: 好きではありません
    note: دوست ندارم は دوست دارم の否定形です。
  prs.a1.unit14.lesson01.teach.man_word:
    title: 私
    gloss: 私
    note: من は、単独で使う1人称の代名詞です。
    example_gloss: コーヒーが好きです。
  prs.a1.unit14.lesson01.teach.ra_word:
    title: (目的語を示す語)
    gloss: （動詞の目的語を示す）
    note: را は特定の直接目的語を示します。ダリー語では話し言葉でも書き言葉でも使い、イラン式の رو は使いません。
    target_text: را（目的語を示す助詞）
  prs.a1.unit14.lesson02.teach.kodam_word:
    title: どれ
    gloss: どれ
    note: کدام は「どれ」「どちら」という意味です。
    example_gloss: どれが好きですか。
  prs.a1.unit14.lesson02.teach.moosiqi_word:
    title: 音楽
    gloss: 音楽
    note: موسیقی は「音楽」という意味です。
    example_gloss: 私は音楽が好きです。
  prs.a1.unit14.lesson02.teach.darid_grammar:
    title: あなたは持っている/好き(丁寧)
    gloss: あなたは持っている／好き
    note: دارین は داشتن（持つ）の丁寧形・複数形の2人称で、このコースの استم/استین のように丁寧な形を先に学ぶ方針に沿っています。
    target_text: دارین（あなたは持っている／好き、丁寧形）
  prs.a1.unit14.lesson02.teach.kodam_ra_question:
    title: どれが好きですか。
    gloss: どれが好きですか。
    note: کدام را دوست دارین؟ では、را が目的語、ここでは選ぶ対象を示します。
  prs.a1.unit14.lesson03.teach.bishtar_word:
    title: もっと
    gloss: もっと
    note: بیشتر は「もっと」という意味です。
    example_gloss: コーヒーのほうが好きです。
  prs.a1.unit14.lesson03.teach.ya_word:
    title: または、それとも
    gloss: または
    note: یا は「または」という意味で、二つのものから選ぶときに使います。
    target_text: یا（または）
  prs.a1.unit14.lesson03.teach.qahwa_ya_chai_question:
    title: コーヒーか紅茶か？
    gloss: コーヒーか紅茶か？
    note: قهوه یا چای؟ は、レッスン1で学んだ二つの飲み物から選ぶ質問です。
  prs.a1.unit14.lesson04.teach.choon_word:
    title: なぜなら
    gloss: なぜなら
    note: چون は理由を導きます。
    target_text: چون（なぜなら）
  prs.a1.unit14.lesson04.teach.khoshmaza_ast_word:
    title: おいしい
    gloss: おいしい
    note: خوش‌مزه است は縮約しない完全な形（おいしいです）です。このコースでは است を縮約せず、独立させて書きます。
    example_gloss: コーヒーはおいしいので好きです。
  prs.a1.unit14.lesson04.teach.jaleb_ast_word:
    title: おもしろい
    gloss: おもしろい
    note: جالب است は縮約しない完全な形（面白いです）です。
    example_gloss: 音楽は面白いので好きです。
  prs.a1.unit14.lesson04.teach.va_word:
    title: 〜と、そして
    gloss: と・そして
    note: و は「と」「そして」という意味で、二つの文や語をつなぎます。
    target_text: و（と）
  prs.a1.unit14.lesson05.teach.negar_name:
    title: ネガル
    gloss: ネガル
    note: アフガニスタンでよく使われる女性の名前です。
    example_gloss: ネガールはお茶が好きです。
  prs.a1.unit14.lesson05.teach.darad_grammar:
    title: 彼/彼女は好き
    gloss: 彼／彼女は好き
    note: دارد は داشتن（持つ）の3人称の完全形です。دوست دارد は「彼／彼女は好きです」という意味で、1人称の دوست دارم と同じ型です。
    target_text: دوست دارد（彼／彼女は好き、3人称の完全形）
  prs.a1.unit14.lesson05.teach.nadarad_grammar:
    title: 彼/彼女は好きではない
    gloss: 彼／彼女は好きではない
    note: ندارد は3人称の完全な否定形です。دوست ندارد は「彼／彼女は好きではありません」という意味です。
    target_text: دوست ندارد（彼／彼女は好きではない、3人称の完全形）
  prs.a1.unit14.lesson05.teach.garm_ast_word:
    title: 温かい
    gloss: 温かい
    note: گرم است は縮約しない完全な形（温かいです）です。
    example_gloss: ネガールは温かいのでお茶が好きです。
  prs.a1.unit14.lesson05.teach.reading_text:
    title: 好みについての例文
    gloss: ネガールは温かいのでお茶が好きです。ネガールは音楽が好きではありません。
    note: この単元で学んだ好みの語彙を使った、三人称の短い説明です。
  prs.a1.unit14.lesson06.teach.names:
    title: カリームとネガール
    gloss: カリーム、ネガール
    note: このコースで繰り返し使う、アフガニスタンでよくある名前です。
    example_gloss:
    - 私はカリームです。
    - 私はネガールです。
  prs.a1.unit14.lesson06.teach.shoma_chetor_phrase:
    title: あなたは？
    gloss: あなたは？
    note: شما چطور؟ は、相手に同じ質問を丁寧に返す言い方で、استین 系の丁寧な言い方に沿っています。
  prs.a1.unit14.lesson06.teach.aali_ast_word:
    title: すばらしい
    gloss: すばらしい
    note: عالی است は縮約しない完全な形（すばらしいです）です。
    example_gloss: コーヒーはすばらしいです。
  prs.a1.unit14.lesson06.teach.dialogue_line1:
    title: カリームがたずねる
    gloss: 紅茶とコーヒー、どちらのほうが好きですか？
  prs.a1.unit14.lesson06.teach.dialogue_line2:
    title: ネガールの答え
    gloss: 私はコーヒーのほうが好きです。おいしいからです。あなたは？
  prs.a1.unit14.lesson06.teach.dialogue_line3:
    title: カリームが答える
    gloss: 私は紅茶が好きです。温かいからです。
  prs.a1.unit14.lesson06.teach.dialogue_line4:
    title: ネガールの反応
    gloss: いいですね！
