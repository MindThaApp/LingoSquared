course:
  title: ダリー語 A1
  description: カーブルのダリー語・初級：好き嫌いを言う、好みをたずねる、選択肢から選ぶ、簡単な理由を述べる、そして二人の好みについての短い読み物／会話。
units:
  prs.a1.unit14.preferences:
    title: 好み
    description: 基本的な好き嫌いと簡単な理由を言ったりたずねたりしましょう。
lessons:
  prs.a1.unit14.lesson01.basic_likes:
    title: 簡単な好き嫌い
  prs.a1.unit14.lesson02.asking_preferences:
