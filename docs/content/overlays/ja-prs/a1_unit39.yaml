  prs.a1.unit39.lesson01.teach.cool_cold_contrast_phrase:
    title: 秋は涼しいですが、冬は寒いです
    gloss: 秋は涼しいですが、冬は寒いです。
    note: اما は、二つの季節の天気を一つの文の中で対比させます。
