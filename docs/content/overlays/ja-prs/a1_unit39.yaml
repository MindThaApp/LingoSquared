    gloss: 降る / 雨 / 雪 / 晴れ
    note: می‌بارد、باران、برف、آفتابی は、それぞれの季節の典型的な天気を説明するための復習の単語です。
    target_text: می‌بارد (降る)/ باران (雨)/ برف (雪)/ آفتابی (晴れ)
  prs.a1.unit39.lesson02.teach.rain_in_spring_phrase:
    title: 春は雨が降ります
    gloss: 春には雨が降ります。
    note: در بهار باران می‌بارد は、直訳すると「春に、雨が降る」です。
  prs.a1.unit39.lesson02.teach.hot_in_summer_phrase:
    title: 夏は天気がとても暑くなります
    gloss: 夏には天気がとても暑くなります。
    note: می‌شود(〜になる)は、季節を通じた天気の変化を表します。
  prs.a1.unit39.lesson02.teach.cool_in_autumn_phrase:
    title: 秋は天気が涼しくなります
    gloss: 秋には天気が涼しくなります。
    note: 秋の涼しい天気にも、同じ می‌شود の構文を使います。
  prs.a1.unit39.lesson02.teach.snow_in_winter_phrase:
