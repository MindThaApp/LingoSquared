    note: کدام、را、من(私)は、季節の好みを尋ねたり答えたりするための復習の形です。
    target_text: کدام (どの)/ را (目的語を示す助詞)/ من (私)
  prs.a1.unit39.lesson03.teach.review_like_forms:
