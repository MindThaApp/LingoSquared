teaching:
  prs.a1.unit39.lesson01.teach.review_basics:
    title: 復習：四つ、〜です、年
    gloss: 四つ / 〜です / 年
    note: چهار、است、سال は、このユニットの季節の語彙を導入するための復習の単語です。
    target_text: چهار (4)/ است (です)/ سال (年)
  prs.a1.unit39.lesson01.teach.review_weather_connectors:
    title: 復習：天気、暑い、寒い、とても、今日、そして、でも
    gloss: 天気 / 暑い / 寒い / とても / 今日 / そして / でも
    note: هوا、گرم、سرد、خیلی、امروز、و、اما は、このユニットの季節の文の中で繰り返し使われる復習の単語です。
    target_text: هوا (天気)/ گرم (暑い)/ سرد (寒い)/ خیلی (とても)/ امروز (今日)/ و (と、そして)/ اما (しかし)
  prs.a1.unit39.lesson01.teach.fasl_word:
    title: 季節
    gloss: 季節
    note: فصل は「季節」という意味です。
    example_gloss: 一年には四つの季節があります。
  prs.a1.unit39.lesson01.teach.bahar_word:
    title: 春
    gloss: 春
    note: بهار は「春」を表す標準的なダリー語です。
    example_gloss: 春は暖かいです。
  prs.a1.unit39.lesson01.teach.tabestan_word:
    title: 夏
    gloss: 夏
    note: تابستان は「夏」という意味です。
    example_gloss: 夏はとても暑いです。
  prs.a1.unit39.lesson01.teach.khonak_word:
    title: 涼しい
    gloss: 涼しい
    note: خنک は(気温が)「涼しい」という意味です。
    example_gloss: 今日は涼しいです。
