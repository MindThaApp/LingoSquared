    title: 秋
    gloss: 秋
    note: خزان はアフガニスタンのダリー語で「秋」を表す標準的な語です。イランのペルシア語では、より一般的に پاییز が使われます。
    example_gloss: 秋は涼しいです。
  prs.a1.unit39.lesson01.teach.zemestan_word:
