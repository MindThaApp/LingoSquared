      right: ゆっくり話してください。
    - left: می‌توانین دوباره بگویین؟
      right: もう一度言っていただけますか。
    - left: ببخشین، کی صحبت می‌کند؟
      right: 失礼ですが、どちら様ですか。
    - left: من فرید استم
      right: ファリードです。
    - left: همکار همایون استم
      right: ホマユーンの同僚です。
