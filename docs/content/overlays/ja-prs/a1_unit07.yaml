    accepted_answers:
    - value:
        ببخشین، کی صحبت می‌کند؟: 失礼ですが、どちら様ですか。
        من فرید استم: ファリードです。
        همکار همایون استم: ホマユーンの同僚です。
        الو: もしもし(電話で)
        بلی، بفرمایین: はい、どうぞ。
        تلفن: 電話
      status: correct
    feedback: これらのフレーズは、電話で名前をたずねたり名乗ったりするときの表現です。レッスン1の電話の出だしの言葉も復習します。
    pairs:
    - left: ببخشین، کی صحبت می‌کند؟
      right: 失礼ですが、どちら様ですか。
    - left: من فرید استم
      right: ファリードです。
    - left: همکار همایون استم
      right: ホマユーンの同僚です。
    - left: الو
      right: もしもし(電話で)
    - left: بلی، بفرمایین
      right: はい、どうぞ。
    - left: تلفن
      right: 電話
  prs.a1.unit07.lesson02.exercise05.order_who_speaking:
    instruction: 単語を並べ替えて、どなたからの電話かを丁寧にたずねる文を作りましょう。
    accepted_answers:
    - value:
      - ببخشین
      - کی
      - صحبت
      - می‌کند
      status: correct
    feedback: ببخشین، کی صحبت می‌کند؟ は、電話の相手が誰かを丁寧に尋ねる表現です。
  prs.a1.unit07.lesson02.exercise06.translate_this_is:
    instruction: ダリー語に訳しましょう：フェリドです。
    accepted_answers:
    - value: من فرید استم
      status: correct
    - value: فرید استم
      status: correct
    - value: من فرید هستم
      status: correct
    - value: فرید هستم
      status: correct
    feedback: من فرید استم は、話し手が自分の名前を伝える表現です。
  prs.a1.unit07.lesson02.exercise07.speak_identify_self:
    instruction: ببخشین، کی صحبت می‌کند؟ あなたの名前がフェリドだと仮定して答えましょう。
    accepted_answers:
    - value: من فرید استم
      status: correct
    - value: فرید استم
      status: correct
    - value: من فرید استم، همکار همایون
      status: correct
    - value: من فرید هستم
      status: correct
    - value: فرید هستم
      status: correct
    - value: من فرید هستم، همکار همایون
      status: correct
    feedback: من [name] استم は、話し手が自分の名前を伝える正しい言い方です。
  prs.a1.unit07.lesson03.exercise01.recognize_speak_slowly:
    instruction: ゆっくり話してほしいときのフレーズはどれですか？
    correct_option: لطفاً آهسته صحبت کنین
    distractors:
    - می‌توانین دوباره بگویین؟
    - بلی، بفرمایین
    - الو؟
    accepted_answers:
    - value: لطفاً آهسته صحبت کنین
      status: correct
    feedback: آهسته صحبت کنین は「ゆっくり話してください」という意味です。
  prs.a1.unit07.lesson03.exercise02.recognize_repeat:
    instruction: もう一度言ってほしいときのフレーズはどれですか？
    correct_option: می‌توانین دوباره بگویین؟
    distractors:
    - لطفاً آهسته صحبت کنین
    - کی صحبت می‌کند؟
    - می‌خواهم یک پیام بگذارم
    accepted_answers:
    - value: می‌توانین دوباره بگویین؟
      status: correct
    - value: می‌توانین دوباره بگویین؟
      status: correct
    feedback: دوباره بگویین؟ は「もう一度言ってください」とお願いする表現です。
  prs.a1.unit07.lesson03.exercise03.recognize_speak_slowly_reading:
    instruction: このフレーズはどんな意味ですか？
    correct_option: ゆっくり話して、もう一度言ってください。
    distractors:
    - はい、どうぞ。
    - 伝言を残したいのですが。
    - あとでかけ直します。
    accepted_answers:
