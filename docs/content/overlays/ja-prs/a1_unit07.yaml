course:
  title: ダリー語 A1
  description: 初級アフガニスタン・ダリー語：電話に出る、通話で名乗る、聞き返す・ゆっくり話してもらう、伝言を残す、基本的なショートメッセージのやり取り。
units:
  prs.a1.unit07.communication:
    title: 電話で話す
lessons:
  prs.a1.unit07.lesson01.answering_the_phone:
    title: 電話に出る
  prs.a1.unit07.lesson02.identifying_yourself:
    title: 電話で名乗る
  prs.a1.unit07.lesson03.asking_to_repeat_or_slow_down:
    title: もう一度言ってもらう・ゆっくり話してもらう
  prs.a1.unit07.lesson04.leaving_a_message:
    title: 伝言を残す
  prs.a1.unit07.lesson05.text_messages:
    title: 短いメッセージを読む・書く
  prs.a1.unit07.lesson06.phone_call_dialogue:
    title: 電話での会話のまとめ
teaching:
  prs.a1.unit07.lesson01.teach.alo:
    title: もしもし(電話で)
    gloss: もしもし(電話で)
    note: الو は電話に出るとき・電話をかけ始めるときに使う言葉で、直接会って言う سلام とは使い分けます。
    example_gloss: もしもし、カリムです。
  prs.a1.unit07.lesson01.teach.goosh_astam:
    title: 相手に話を続けてもらう
    gloss: はい、どうぞ。
    note: بلی، بفرمایین は電話に出たあとの自然な返事です。このコースですでに出てきた丁寧な بفرمایین(「どうぞ」)を使っており、「聞いています」の直訳ではありません。
  prs.a1.unit07.lesson01.teach.telephone_review:
    title: 電話(復習)
    gloss: 電話
    note: تلفن は数字の単元で出てきました。この単元全体の場面として、ここでも使います。
    example_gloss: 私の電話は壊れています。
  prs.a1.unit07.lesson02.teach.who_speaking:
    title: 相手が誰か尋ねる
    gloss: 失礼ですが、どちら様ですか。
    note: ببخشین، کی صحبت می‌کند؟ は、電話の相手が誰かを丁寧に尋ねる表現です。
  prs.a1.unit07.lesson02.teach.this_is_speaking:
    title: 名乗る
    gloss: ファリードです。
    note: من فرید استم は、誰からの電話かをそのまま伝える言い方で、これまでの単元で学んだ استم の形を使っています。
  prs.a1.unit07.lesson02.teach.colleague_context:
    title: 相手との関係を説明する
    gloss: ホマユーンの同僚です。
    note: همکار همایون استم は、電話に出た人があなたを知らないとき、なぜ電話したのかを伝えるのに役立ちます。
  prs.a1.unit07.lesson03.teach.speak_slowly:
    title: ゆっくり話してもらうよう頼む
    gloss: ゆっくり話してください。
    note: لطفاً آهسته صحبت کنین は、電波が悪いときや、まだ言葉に慣れていないときに使える自然で丁寧な頼み方です。
  prs.a1.unit07.lesson03.teach.repeat_review:
    title: もう一度言ってもらう(復習)
    gloss: もう一度言っていただけますか。
    note: می‌توانین دوباره بگویین؟ は自己紹介の単元で出てきました。電話でも同じように自然に使えます。
  prs.a1.unit07.lesson03.teach.combined_request:
    title: 二つの頼みをまとめる
    gloss: ゆっくり話して、もう一度言ってください。
    note: و(「と・て」)で二つの頼みを一つの自然な文にまとめています。
  prs.a1.unit07.lesson04.teach.payam_word:
    title: メッセージ
    gloss: メッセージ
    note: پیام は、話し言葉でも書き言葉でも使える、メッセージを表す一般的な言葉です。
    example_gloss: あなたへのメッセージがあります。
  prs.a1.unit07.lesson04.teach.want_to_leave_message:
    title: 伝言を残したいと伝える
    gloss: 伝言を残したいのですが。
    note: می‌خواهم یک پیام بگذارم は、かけた相手が電話に出られないときに言う表現です。
  prs.a1.unit07.lesson04.teach.will_call_later:
    title: 後でかけ直すと伝える
    gloss: 後でかけ直します。
    note: بعد زنگ می‌زنم は、伝言を残す代わりに使える簡単な言い方です。
  prs.a1.unit07.lesson05.teach.short_message:
    title: メッセージ
    gloss: ショートメッセージ
    note: پیام کوتاه は直訳すると「短いメッセージ」で、ショートメッセージを指す日常的な言い方です。
  prs.a1.unit07.lesson05.teach.meeting_tomorrow:
    title: メッセージの例
    gloss: 明日、会議は9時です。
    note: فردا جلسه ساعت نه است は、伝言として伝えるのにふさわしい、自然で完結した情報です。
  prs.a1.unit07.lesson05.teach.will_deliver:
    title: 伝言を伝えると約束する
    gloss: 伝えます。
    note: می‌رسانم は、伝言が相手にきちんと届くことを約束する言葉です。
  prs.a1.unit07.lesson06.teach.turn01:
    title: リマが電話に出る
    gloss: リマは電話のあいさつで応答します。
    note: الو؟ は、かかってきた電話に出るときの標準的な言い方です。
  prs.a1.unit07.lesson06.teach.turn02:
    title: フェリドがあいさつし、相手を確認する
    gloss: フェリドはあいさつをして、リマかどうか尋ねます。
    note: الو، سلام は、電話のあいさつと日常のあいさつを組み合わせた言い方です。
  prs.a1.unit07.lesson06.teach.turn03:
    title: リマが話を促し、相手が誰か尋ねる
    gloss: リマは話を促し、誰からの電話か尋ねます。
    note: بلی، بفرمایین と کی صحبت می‌کند؟ は、どちらも第1課・第2課で出てきました。
  prs.a1.unit07.lesson06.teach.turn04:
    title: フェリドが名乗る
    gloss: フェリドはホマユンの同僚だと言います。
    note: 第2課の「同僚」という関係を伝える言い方を再び使っており、リマが電話を信用する理由になります。
  prs.a1.unit07.lesson06.teach.turn05:
    title: リマがゆっくり話すよう頼む
    gloss: リマはあいさつを返し、ゆっくり話すよう頼みます。
    note: آهسته صحبت کنین، لطفاً は第3課の頼み方を再び使っています。
  prs.a1.unit07.lesson06.teach.turn06:
    title: フェリドが了承し、伝言を頼む
    gloss: フェリドは了承し、ホマユンへの伝言を残したいと言います。
    note: 第4課の پیام の言い方を広げて、特定の相手(برای همایون「ホマユンに」)を示しています。
  prs.a1.unit07.lesson06.teach.turn07:
    title: リマが書き留めると言う
    gloss: リマはどうぞと促し、書き留めると言います。
    note: ここでの بفرمایین は、フェリドに話を続けるよう促しています。
  prs.a1.unit07.lesson06.teach.turn08:
    title: フェリドが伝言の内容を伝える
    gloss: フェリドは、明日の会議は9時だと伝えてほしいと頼みます。
    note: 第5課のメッセージの例文をそのまま使っています。
  prs.a1.unit07.lesson06.teach.turn09:
    title: リマが確認し、伝えると約束する
    gloss: リマは内容を確認し、伝えると言います。
    note: می‌رسانم は、第5課で学んだとおり、伝言を受ける場面の締めくくりになります。
  prs.a1.unit07.lesson06.teach.turn10:
    title: フェリドがお礼を言い、別れのあいさつをする
    gloss: フェリドは丁寧にお礼を言い、別れのあいさつをします。
    note: تشکر زیاد と خدا حافظ は、どちらも前の単元の語彙を再び使っています。
  prs.a1.unit07.lesson06.teach.turn11:
    title: リマが別れのあいさつをする
    gloss: リマは別れのあいさつをします。
    note: خدا حافظ で通話を終えます。
  prs.a1.unit07.lesson06.teach.past_tense_left:
    title: 誰かが伝言を残したと言う(過去形)
    gloss: フェリドは伝言を残しました。
    note: گذاشت は、第4課の می‌خواهم یک پیام بگذارم(بگذارم は「残す」)で使った動詞の単純過去形(「残した」)です。電話のあとに何があったかを伝えるときに使います。
    target_text: فرید پیام گذاشت (ファリードはメッセージを残しました)
exercises:
  prs.a1.unit07.lesson01.exercise01.recognize_alo:
    instruction: 電話に出るときに使う言葉はどれですか。
    correct_option: الو
    distractors:
    - سلام
    - تشکر
    - خدا حافظ
    accepted_answers:
    - value: الو
      status: correct
    feedback: الو は電話で使う言葉で、سلام とは使い分けます。
  prs.a1.unit07.lesson01.exercise02.recognize_goosh_astam:
    instruction: 電話をかけてきた人に、丁寧に話を続けてもらうのはどの表現ですか？
    correct_option: بلی، بفرمایین
    distractors:
    - الو؟
    - کی صحبت می‌کند؟
    - خدا حافظ
    accepted_answers:
    - value: بلی، بفرمایین
      status: correct
    feedback: بلی، بفرمایین は、かけてきた人に「どうぞ話してください」と丁寧に促す表現です。
  prs.a1.unit07.lesson01.exercise03.recognize_alo_reading:
    instruction: この言葉の意味は何ですか？
    correct_option: もしもし(電話に出るとき)
    distractors:
    - こんにちは(平安がありますように)
    - ありがとう
    - さようなら
    accepted_answers:
    - value: もしもし(電話に出るとき)
      status: correct
    feedback: الو は電話に出るときに言う言葉です。
  prs.a1.unit07.lesson01.exercise04.match_phone_opening:
    instruction: それぞれの単語やフレーズを意味と組み合わせてください。
    accepted_answers:
    - value:
        الو: もしもし(電話で)
        بلی، بفرمایین: はい、どうぞ。
        تلفن: 電話
      status: correct
    feedback: これらは、典型的な電話の始まりの表現です。
    pairs:
    - left: الو
      right: もしもし(電話で)
    - left: بلی، بفرمایین
      right: はい、どうぞ。
    - left: تلفن
      right: 電話
  prs.a1.unit07.lesson01.exercise05.order_goosh_astam:
    instruction: 単語を並べ替えて「はい、どうぞ」と言ってみましょう。
    accepted_answers:
    - value:
      - بلی
      - بفرمایین
      status: correct
    feedback: بلی، بفرمایین は、かけてきた人に「どうぞ」と話を促す表現です。
  prs.a1.unit07.lesson01.exercise06.translate_goosh_astam:
    instruction: ダリー語に訳しましょう：はい、どうぞ。
    accepted_answers:
    - value: بلی، بفرمایین
      status: correct
    - value: بلی بفرمایین
      status: correct
    feedback: بلی، بفرمایین は「はい、どうぞ」という意味です。
  prs.a1.unit07.lesson01.exercise07.speak_answer_phone:
    instruction: 電話が鳴っています。電話に出て、かけてきた人に話を続けてもらいましょう。
    accepted_answers:
    - value: الو؟ بلی، بفرمایین.
      status: correct
    - value: الو، بلی بفرمایین
      status: correct
    feedback: الو で電話に出て、بلی، بفرمایین で相手に話を促します。
  prs.a1.unit07.lesson02.exercise01.recognize_who_speaking:
    instruction: 電話の相手が誰か尋ねるのはどの表現ですか？
    correct_option: ببخشین، کی صحبت می‌کند؟
    distractors:
