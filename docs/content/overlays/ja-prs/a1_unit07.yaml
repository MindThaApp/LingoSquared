    - همکار همایون استم
    - الو؟
    accepted_answers:
    - value: ببخشین، کی صحبت می‌کند؟
      status: correct
    feedback: کی صحبت می‌کند؟ は直訳すると「誰が話していますか」と尋ねる言い方です。
  prs.a1.unit07.lesson02.exercise02.recognize_this_is:
    instruction: 話している人がフェリドだと伝えるのはどの表現ですか？
    correct_option: من فرید استم
    distractors:
    - ببخشین، کی صحبت می‌کند؟
    - همکار همایون استم
    - بلی، بفرمایین
    accepted_answers:
    - value: من فرید استم
      status: correct
    feedback: من فرید استم は、話している人の名前をそのまま伝える言い方です。
  prs.a1.unit07.lesson02.exercise03.recognize_who_speaking_reading:
    instruction: この質問は何を尋ねていますか。
    correct_option: すみません、どちら様ですか？
    distractors:
    - フェリドです。
    - はい、どうぞ。
    - もしもし？(電話に出るとき)
    accepted_answers:
    - value: すみません、どちら様ですか？
      status: correct
    feedback: ببخشین، کی صحبت می‌کند؟ は、電話の相手が誰かを丁寧にたずねる表現です。
  prs.a1.unit07.lesson02.exercise04.match_identity_phrases:
