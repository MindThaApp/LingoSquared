    target_text: می‌خواهم(私は~がほしい)/ کتاب(本)/ یک(ひとつの)/ این(この)
  prs.a1.unit43.lesson03.teach.get_word:
    title: 取る・受け取る
    gloss: 取る・受け取る
    note: بگیرم は接続法の形(「私が受け取る(こと)」)で、ユニット42で می‌خواهم と一緒に使って「受け取りたい」と言った形と同じです。
    example_gloss: 本を受け取りたいです。
  prs.a1.unit43.lesson03.teach.loan_word:
    title: 貸し借り
    gloss: 貸し借り
    note: قرض は貸し借り、借りることを意味します。قرض گرفتن(「借りとして受け取る」)が、「借りる」を表す日常的なダリー語です。
    example_gloss: この本は借りたものです。
  prs.a1.unit43.lesson03.teach.want_borrow_book_phrase:
    title: 本を借りたいです
    gloss: 本を借りたいです。
    note: می‌خواهم کتاب را قرض بگیرم は、می‌خواهم、کتاب را、قرض、そして接続法の بگیرم を組み合わせた文です。
  prs.a1.unit43.lesson03.teach.give_back_word:
    title: (返して)渡す
    gloss: (返して)渡す
    note: بدهم は دادن(与える)の接続法の形で、پس(戻して)と合わせると「返す・返却する」の意味になります。
    example_gloss: それを返したいです。
  prs.a1.unit43.lesson03.teach.want_return_book_phrase:
    title: 本を返したいです
    gloss: 本を返したいです。
    note: می‌خواهم کتاب را پس بدهم は、می‌خواهم、کتاب را、پس、そして接続法の بدهم を組み合わせた文です。
