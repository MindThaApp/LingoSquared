teaching:
  prs.a1.unit43.lesson01.teach.review_book_have_is_in:
    title: 復習:本、持っています、です、〜の中に
    gloss: 本/持っています/です/〜の中に
    note: کتاب、دارم、است、در は、本について話すときに使う復習の単語です。
    target_text: کتاب(本)/ دارم(私は持っている)/ است(~である・ある)/ در(~の中に)
  prs.a1.unit43.lesson01.teach.review_want_one:
    title: 復習:ほしい、一つの
    gloss: ほしいです/一つの
    note: می‌خواهم と یک を組み合わせて、ほしいものを言います。
    target_text: می‌خواهم(私は~がほしい)/ یک(ひとつの)
  prs.a1.unit43.lesson01.teach.library_word:
    title: 図書館
    gloss: 図書館
    note: کتابخانه は図書館を表す標準的なダリー語で、کتاب(本)と خانه(家)からできています。
    example_gloss: 本は図書館にあります。
  prs.a1.unit43.lesson01.teach.librarian_word:
    title: 司書
    gloss: 司書
    note: کتابدار は直訳すると「本を持つ人」(本の管理をする人)で、دوکاندار(「店主」、ユニット8)と同じ作り方です。
    example_gloss: 司書は図書館にいます。
  prs.a1.unit43.lesson01.teach.want_book_phrase:
    title: 本がほしいです
    gloss: 本がほしいです。
    note: یک کتاب می‌خواهم は、یک(一つの)、کتاب(本)、می‌خواهم(ほしいです)を組み合わせた文です。
  prs.a1.unit43.lesson01.teach.review_from_object_marker:
    title: 復習:〜から、目的語の印
    gloss: 〜から/(目的語の印)
    note: از(〜から)と را(文の目的語を示す印、ユニット14・26)は復習の単語です。
    target_text: از(~から)/ را(目的語を示す語)
  prs.a1.unit43.lesson01.teach.want_book_from_librarian_phrase:
    title: 司書にその本を頼みたいです
    gloss: 司書にその本を頼みたいです。
    note: کتاب را می‌خواهم に از کتابدار(司書から)が加わっています。
  prs.a1.unit43.lesson01.teach.want_one_book_from_librarian_phrase:
    title: 司書に本を頼みたいです
    gloss: 司書に本を頼みたいです。
    note: یک(一つの)と کتاب را از کتابدار می‌خواهم を組み合わせた文です。
  prs.a1.unit43.lesson02.teach.review_date_day_monday:
    title: 復習:日付、日、月曜日
    gloss: 日付/日/月曜日
    note: تاریخ、روز、دوشنبه(すべてユニット9)は、返却日をたずねるときに使う復習の単語です。
    target_text: تاریخ(日付)/ روز(日)/ دوشنبه(月曜日)
  prs.a1.unit43.lesson02.teach.review_which_is:
    title: 復習:どの、です
    gloss: どの/です
    note: کدام と است は、質問をするときに使う復習の単語です。
    target_text: کدام(どの)/ است(~である)
  prs.a1.unit43.lesson02.teach.return_giving_back_word:
    title: 返す・返却
    gloss: 返す・返却
    note: پس دادن は直訳すると「返す」で、پس(戻して)と دادن(与える)を組み合わせた言い方です。
    example_gloss: 返却日は月曜日です。
  prs.a1.unit43.lesson02.teach.ask_return_date_phrase:
    title: 返却日は何曜日ですか
    gloss: 本の返却日は何曜日ですか。
    note: تاریخ پس دادن کتاب کدام روز است؟ は、借りた本をいつ返すのかをたずねる文です。
  prs.a1.unit43.lesson02.teach.return_date_answer_phrase:
    title: 返却日は月曜日です
    gloss: 返却日は月曜日です。
    note: تاریخ پس دادن دوشنبه است は、具体的な曜日で質問に答える文です。
  prs.a1.unit43.lesson03.teach.review_want_book_one_this:
