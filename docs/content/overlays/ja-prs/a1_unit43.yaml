course:
  title: ダリー語 A1
  description: カブール方言のダリー語入門:図書館の本を借りて返す、返却日をたずねる、借りた本についての短い文章を読む。どの本がほしいかをたずね、返却日を伝えて確認し、図書館での基本的なやりとりを理解します。
units:
  prs.a1.unit43.library:
