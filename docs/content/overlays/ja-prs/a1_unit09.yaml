teaching:
  prs.a1.unit09.lesson01.teach.shanbe_yakshanbe:
    title: 土曜日と日曜日
    gloss: 土曜日、日曜日
    note: شنبه(土曜日)はアフガニスタンで週の最初の日で、そのあとに یکشنبه(日曜日)が続きます。
    example_gloss:
    - 今日は土曜日です。
    - 明日は日曜日です。
  prs.a1.unit09.lesson01.teach.doshanbe_seshanbe:
    title: 月曜日と火曜日
    gloss: 月曜日、火曜日
    note: دوشنبه と سه‌شنبه は、شنبه から数えて「2日目」「3日目」という意味です。
    example_gloss:
    - 月曜日に授業があります。
    - 火曜日に約束があります。
  prs.a1.unit09.lesson01.teach.chaharshanbe_panjshanbe:
    title: 水曜日と木曜日
    gloss: 水曜日、木曜日
    note: چهارشنبه と پنجشنبه も、同じ「4日目」「5日目」という並びです。
    example_gloss:
    - 水曜日は仕事です。
    - 木曜日に会いましょう。
  prs.a1.unit09.lesson01.teach.jomeh:
    title: 金曜日
    gloss: 金曜日
    note: جمعه はアフガニスタンの毎週の休日で、日本の日曜日のような役割です。
    example_gloss: 金曜日は休みです。
  prs.a1.unit09.lesson01.teach.tarikh_word:
    title: 日付
    gloss: 日付
    note: تاریخ は暦の日付を表す一般的な言葉です。
    example_gloss: 今日は何日ですか。
  prs.a1.unit09.lesson01.teach.va_word:
    title: And
    gloss: と・そして
    note: و は、この単元全体で使われる、言葉や文をつなぐ一般的な言葉です。
    target_text: و(〜と、そして)
  prs.a1.unit09.lesson01.teach.weekend_note:
    title: 毎週の休日
    gloss: 金曜日は毎週の休日です。
    note: 土日が休みの日本とは違い、アフガニスタンの毎週の主な休日は *جمعه*(金曜日)です。木曜日は半日勤務のことが多いです。
  prs.a1.unit09.lesson02.teach.hamal:
    title: ハマル(1番目の月)
    gloss: ハマル:ヒジュラ太陽暦の最初の月(3月下旬〜4月ごろ)
    note: حمل はアフガニスタンの太陽暦の年の始まりで、新年ノウルーズと重なります。
    example_gloss: ハマルは一年の最初の月です。
  prs.a1.unit09.lesson02.teach.sawr:
    title: サウル(2番目の月)
    gloss: サウル:2番目の月(4月〜5月ごろ)
    note: ثور は حمل の次の月です。
    example_gloss: サウルは天気がよいです。
  prs.a1.unit09.lesson02.teach.jawza:
    title: ジャウザー(3番目の月)
    gloss: ジャウザー:3番目の月(5月〜6月ごろ)
    note: جوزا は ثور の次の月です。
    example_gloss: 私はジャウザーに生まれました。
  prs.a1.unit09.lesson02.teach.calendar_note:
    title: アフガニスタンの暦
    gloss: アフガニスタンはヒジュラ太陽暦を使っています。
    note: これはイランで使われているのと同じ太陽暦で、西暦(グレゴリオ暦)とも、太陰暦のヒジュラ暦とも異なります。
  prs.a1.unit09.lesson03.teach.what_day_today:
    title: 今日が何曜日か尋ねる
    gloss: 今日は何曜日ですか?
    note: امروز چند شنبه است؟ は直訳すると「今日は何番目の〜シャンベですか」で、曜日を尋ねる自然な言い方です。
  prs.a1.unit09.lesson03.teach.today_word:
    title: 今日
    gloss: 今日
    note: امروز は、現在の日を表します。
    example_gloss: 今日は何日ですか?
  prs.a1.unit09.lesson04.teach.give_full_date:
    title: 年月日を全部言う
    gloss: 今日は木曜日、ハマルの15日です。
    note: امروز پنجشنبه، پانزدهم حمل است は、曜日、序数の日付、月の名前を組み合わせた文です。
  prs.a1.unit09.lesson05.teach.which_day_meeting:
    title: 行事が何曜日か尋ねる
    gloss: 会議は何曜日ですか?
    note: جلسه کدام روز است؟ は、کدام(どの)を使って行事の曜日を尋ねる文です。
  prs.a1.unit09.lesson05.teach.which_date:
    title: 特定の日付を尋ねる
    gloss: 月曜日はハマルの何日ですか。
    note: دوشنبه چندم حمل است؟ は、月曜日がその月の何日にあたるかを尋ねる文です。
  prs.a1.unit09.lesson06.teach.nozdahom:
    title: 19番目・19日
    gloss: 19番目・19日
    note: '*نوزدهم* は19の序数の形で、*پانزدهم*(15番目)と同じ作り方です。'
    example_gloss: 今日は19日です。
  prs.a1.unit09.lesson06.teach.turn01:
    title: ホマユーンが会議の曜日を尋ねる
    gloss: ホマユーンがバシールに、会議が何曜日か尋ねます。
    note: جلسه کدام روز است؟ は第5課で学びました。
  prs.a1.unit09.lesson06.teach.turn02:
    title: バシールが答える
    gloss: バシールは、月曜日だと思うと言います。
    note: فکر می‌کنم(〜と思います)を使うと、はっきり確信がないときの柔らかい答え方になります。
  prs.a1.unit09.lesson06.teach.turn03:
    title: ホマユーンが正確な日付を尋ねる
    gloss: ホマユーンが、月曜日はハマルの何日か尋ねます。
    note: دوشنبه چندم حمل است؟ は第5課で学びました。
  prs.a1.unit09.lesson06.teach.turn04:
    title: バシールが正確な日付を答える
    gloss: バシールは、月曜日はハマルの19日だと言います。
    note: '*دوشنبه نوزدهم حمل است* は、第4課のパターンのとおり、曜日・序数の日付・月を組み合わせた文です。'
  prs.a1.unit09.lesson06.teach.turn05:
    title: ホマユーンが金曜日について尋ねる
    gloss: ホマユーンは了承し、バシールに金曜日は空いているか尋ねます。
    note: وقت داری؟(時間はある?)は、都合を尋ねる自然な言い方です。
  prs.a1.unit09.lesson06.teach.turn06:
    title: バシールは忙しいと言う
    gloss: バシールは、金曜日は忙しいと断ります。
    note: مصروف استم(忙しいです)が、金曜日は都合が悪い理由を説明しています。
  prs.a1.unit09.lesson06.teach.turn07:
    title: ホマユンが月曜日で確認する
    gloss: ホマユンは、問題ないので月曜日にバシールに会うと言います。
    note: مشکل نیست(問題ありません)は、日程の食い違いを和らげてから、もとの月曜日の予定を確認しています。
