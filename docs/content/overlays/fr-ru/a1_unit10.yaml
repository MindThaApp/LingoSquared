teaching:
  ru.a1.unit10.lesson01.teach.kak_doyti:
    title: Как дойти до...?
    gloss: Comment aller à... ?
    note: Как дойти до...? est la manière polie et courante de demander son chemin à un inconnu ; elle est suivie du lieu de destination au génitif.
  ru.a1.unit10.lesson01.teach.muzeya:
    title: музей
    gloss: musée
    note: музей est masculin ; музея est sa forme du génitif, employée après до (« jusqu’à »).
    example_gloss: Comment aller au musée ?
  ru.a1.unit10.lesson01.teach.pryamo:
    title: прямо
    gloss: tout droit
    note: прямо indique qu’on va tout droit ; Идите est la forme polie de l’impératif de « aller ».
    example_gloss: Va tout droit.
  ru.a1.unit10.lesson01.teach.napravo:
    title: направо
    gloss: à droite
    note: направо indique une direction de déplacement (tourner à droite) ; потом signifie « puis ».
    example_gloss: Allez tout droit, puis à droite.
  ru.a1.unit10.lesson02.teach.nalevo:
    title: налево
    gloss: à gauche
    note: налево indique une direction de déplacement, l’inverse de направо.
    example_gloss: Tourne à gauche.
  ru.a1.unit10.lesson02.teach.povernite:
    title: поверните
    gloss: tournez (ordre poli)
    note: поверните est l’impératif poli de повернуть (« tourner ») ; за углом signifie « au coin de la rue ».
    example_gloss: Tournez à gauche au coin de la rue.
  ru.a1.unit10.lesson02.teach.kvartal_daleko:
    title: квартал, далеко
    gloss: pâté de maisons, loin
    note: квартал désigne un pâté de maisons (квартала après два) ; далеко signifie « loin », et отсюда signifie « d’ici ».
    example_gloss:
    - Faites deux pâtés de maisons.
    - C’est loin d’ici ?
  ru.a1.unit10.lesson03.teach.tourist_prostite:
    title: Le touriste demande son chemin
    gloss: 'Touriste : Excusez-moi, comment aller au musée ?'
    note: Турист commence par Простите (« excusez-moi ») avant de demander Как дойти до музея?
  ru.a1.unit10.lesson03.teach.prokhozhiy_eto_prosto:
    title: Le passant donne l’itinéraire
    gloss: 'Passant : C’est très simple. Allez tout droit sur deux pâtés de maisons, puis tournez à droite.'
    note: Прохожий répond par Это очень просто, puis donne un itinéraire en deux étapes avec Идите et поверните.
  ru.a1.unit10.lesson03.teach.tourist_daleko:
    title: Le touriste demande si c’est loin
    gloss: 'Touriste : C’est loin d’ici ?'
    note: Это далеко отсюда? sert à vérifier la distance à parcourir à pied.
  ru.a1.unit10.lesson03.teach.prokhozhiy_pyat_minut:
    title: Le passant estime la durée
    gloss: 'Passant : Non, cinq minutes à pied.'
    note: Прохожий répond par Нет, пять минут пешком (« à pied »).
  ru.a1.unit10.lesson03.teach.tourist_spasibo:
    title: Le touriste remercie le passant
    gloss: 'Touriste : Merci beaucoup.'
    note: Спасибо большое conclut poliment l’échange.
  ru.a1.unit10.lesson03.teach.prokhozhiy_pozhaluysta:
    title: Le passant répond
    gloss: 'Passant : De rien.'
    note: Пожалуйста répond à спасибо et signifie « de rien ».
