teaching:
  ru.a1.unit14.lesson01.teach.mne_nravitsya_kofe:
    title: Мне нравится кофе.
    gloss: J’aime le café.
    note: мне нравится (littéralement « me plaît ») associe le pronom au datif мне et нравится pour exprimer ce qu’on aime.
  ru.a1.unit14.lesson01.teach.ne_nravitsya:
    title: не нравится
    gloss: ne pas aimer
    note: не (« ne… pas ») placé devant нравится met la construction de l’appréciation à la forme négative.
    example_gloss: Je n’aime pas le thé.
  ru.a1.unit14.lesson01.teach.chay:
    title: чай
    gloss: thé
    note: чай est le mot qui signifie « thé ».
    example_gloss: J’aime le thé.
  ru.a1.unit14.lesson02.teach.ya_hochu_chay:
    title: Я хочу чай.
    gloss: Je veux du thé.
    note: хочу (« je veux ») est la première personne du présent de хотеть ; il se construit avec un complément d’objet direct pour exprimer un souhait.
  ru.a1.unit14.lesson02.teach.ne_hochu:
    title: не хочу
    gloss: ne pas vouloir
    note: не хочу met хочу à la forme négative et signifie « je ne veux pas ».
    example_gloss: Je ne veux pas de café.
  ru.a1.unit14.lesson02.teach.sok:
