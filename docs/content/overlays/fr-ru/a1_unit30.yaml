  ru.a1.unit30.lesson03.teach.posle_polzovatsya_slovo:
    title: Пользоваться et искать
    gloss: '*Пользоваться* se construit avec l’instrumental (*пользоваться телефоном*), alors que *искать* se construit avec l’accusatif (*искать прогноз*).'
    note: 'Les deux verbes sont réguliers : *я пользуюсь, ты пользуешься* ; *я ищу, ты ищешь*.'
  ru.a1.unit30.lesson03.teach.igor_ishchet_prognoz:
    title: Igor cherche les prévisions météo
    gloss: Igor cherche les prévisions météo.
  ru.a1.unit30.lesson03.teach.potom_on_idyot:
    title: Ensuite, il va courir
    gloss: Ensuite, il va courir.
    note: '*Идёт бегать* signifie « va courir » : *идёт* est un verbe de mouvement suivi de l’infinitif de ce qu’il va faire.'
  ru.a1.unit30.lesson04.teach.nastya_davay_v:
    title: Nastya propose
    gloss: 'Nastya : On fait du sport samedi à dix heures ?'
  ru.a1.unit30.lesson04.teach.dima_khoroshaya_ideya:
    title: Dima accepte
    gloss: 'Dima : Bonne idée ! Je vais chercher les prévisions météo.'
    note: '*Хорошая идея* : l’adjectif est au féminin, comme le nom. *Поищу* est le futur perfectif, « je vais chercher ».'
  ru.a1.unit30.lesson04.teach.dima_v_subbotu:
    title: Dima vérifie la météo
    gloss: 'Dima : Samedi, il y a du soleil !'
    note: '*Солнечно* est le mot pour parler de la météo. Pas besoin du verbe « être » : *В субботу солнечно*.'
  ru.a1.unit30.lesson04.teach.igor_ya_vizhu:
    title: Igor voit le message
    gloss: 'Igor : Je vois le message. À samedi !'
  ru.a1.unit30.lesson04.teach.ty_uzhe_znaesh:
    title: До + génitif
    gloss: 'Tu connais *До свидания!* Tu peux aussi nommer un jour : *До субботы!*, *До завтра!* Après *до*, le nom se met au génitif.'
    note: Étend la formule d’au revoir de l’unité sur les salutations à un jour précis.
  ru.a1.unit30.lesson05.teach.nastya_kazhdyy_den:
    title: Qui utilise quoi ?
    gloss: Nastya appelle Dima tous les jours. Elle utilise son téléphone, pas une application. Dima n’a pas d’ordinateur à la maison, mais il utilise internet sur son téléphone. Igor cherche les prévisions météo chaque matin. Ensuite, il va courir. Lena envoie souvent un message à Nastya. Et toi, tu utilises aussi ton téléphone tous les jours ?
    note: Compare les habitudes des quatre personnages en matière d’appareils, sur le modèle du texte comparatif de l’unité sur le sport.
