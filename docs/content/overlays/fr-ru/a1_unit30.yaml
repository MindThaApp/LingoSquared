    title: Nastya confirme le projet
    gloss: 'Nastya : Je vois le message. On fait du sport samedi à dix heures au parc ?'
  ru.a1.unit30.lesson06.teach.dima_da_i:
    title: Dima confirme la météo
    gloss: 'Dima : Oui, et il fait beau samedi !'
  ru.a1.unit30.lesson06.teach.igor_ya_togda:
    title: Le programme d’Igor
    gloss: 'Igor : Alors je vais courir. Ensuite, je jouerai aussi au football.'
    note: '*Потом* (ensuite) place le deuxième projet après le premier, et *побегаю* est perfectif : « je vais courir un moment ».'
  ru.a1.unit30.lesson06.teach.lena_ya_luchshe:
    title: Le projet de Lena
    gloss: 'Lena : Je préfère nager, mais je viens aussi au parc.'
    note: '*Я лучше поплаваю* signifie « je préfère nager ». *Лучше* devant le verbe exprime la préférence.'
  ru.a1.unit30.lesson06.teach.nastya_zdorovo_do:
    title: Nastya conclut la conversation
    gloss: 'Nastya : Super ! À samedi au parc !'
    note: Conclut en une phrase l’échange de messages de cette unité et le programme de l’unité sur le sport.
