  ru.a1.unit30.lesson02.teach.soobshchenie:
    title: Le message
    gloss: le message
    example_gloss: Je vais envoyer un message via l’application.
  ru.a1.unit30.lesson02.teach.prognoz_pogody_slovo:
    title: Прогноз погоды et сообщение
    gloss: '*Прогноз погоды* se compose de deux mots, et le second, *погоды*, est au génitif. *Сообщение* est un message que l’on peut envoyer ou lire.'
    note: Associe le nouveau mot au nom composé déjà appris dans l’unité sur la météo.
  ru.a1.unit30.lesson02.teach.nastya_otpravlyaet_soobshchenie:
    title: Nastya envoie un message par l’appli
    gloss: Nastya envoie un message par l’appli.
    note: '*Отправляет* (envoie) est un verbe régulier. Le message est le complément d’objet à l’accusatif, et *через приложение* signifie « par l’appli ».'
  ru.a1.unit30.lesson02.teach.dima_chitaet_soobshchenie:
    title: Dima lit le message
    gloss: Dima lit le message.
  ru.a1.unit30.lesson03.teach.iskat:
