teaching:
  ru.a1.unit20.lesson01.teach.segodnya_holodno:
    title: Сегодня холодно.
    gloss: Aujourd’hui, il fait froid.
    note: 'Le russe emploie souvent un mot impersonnel pour la météo : холодно, littéralement « froidement ».'
    example_gloss: Aujourd’hui, il fait froid, Dima.
  ru.a1.unit20.lesson01.teach.teplo:
    title: тепло
    gloss: chaud
    note: тепло s’emploie comme холодно pour le temps ou la température.
    example_gloss: Il fait bon à la maison.
  ru.a1.unit20.lesson01.teach.pogoda:
    title: погода
    gloss: le temps (météo)
    note: погода signifie « le temps » (la météo).
    example_gloss: 'La météo : aujourd’hui, il fait froid.'
  ru.a1.unit20.lesson02.teach.idet_dozhd:
    title: Идёт дождь.
    gloss: Il pleut.
    note: 'Le russe dit дождь идёт, littéralement « la pluie va ». Comme en français, on peut aussi avoir un sujet impersonnel (« il pleut »), mais en russe il n’y a pas de « il » : le sujet est дождь.'
    example_gloss: Il pleut aujourd’hui.
  ru.a1.unit20.lesson02.teach.solntse:
    title: солнце
    gloss: soleil
    note: Сегодня солнце est une façon simple de dire qu’il y a du soleil aujourd’hui. Ici, le russe nomme simplement la météo, sans verbe.
    example_gloss: Il y a du soleil aujourd’hui.
  ru.a1.unit20.lesson02.teach.veter:
    title: ветер
    gloss: vent
    note: На улице ветер est une façon naturelle de dire qu’il y a du vent dehors.
    example_gloss: Il y a du vent dehors.
  ru.a1.unit20.lesson03.teach.nastya_kakaya_pogoda:
    title: Nastya demande quel temps il fait
    gloss: 'Nastya : Quel temps fait-il aujourd’hui ?'
    note: Какая сегодня погода? est la question habituelle.
  ru.a1.unit20.lesson03.teach.dima_holodno_dozhd:
    title: Dima décrit le temps
    gloss: 'Dima : Aujourd’hui, il fait froid et il pleut.'
    note: Dima relie deux informations météo avec и.
  ru.a1.unit20.lesson03.teach.nastya_ostanemsya_doma:
    title: Nastya propose un programme
    gloss: 'Nastya : Alors restons à la maison.'
    note: Давай останемся дома est une proposition familière.
  ru.a1.unit20.lesson03.teach.dima_doma_teplo:
    title: Dima est d’accord
    gloss: 'Dima : D’accord, il fait bon à la maison.'
    note: Дома тепло donne la raison du projet.
