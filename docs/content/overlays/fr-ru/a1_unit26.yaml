course:
  title: Russe A1
  description: 'Russe pour débutants : décrire l’apparence physique de base d’une personne (taille et impression d’âge, couleur des cheveux et des yeux), la question clé Как ты выглядишь ? et la comparaison de l’apparence de deux personnes.'
units:
  ru.a1.unit26.appearance:
    title: Décrire l’apparence physique
lessons:
  ru.a1.unit26.lesson01.vysokiy_nevysokiy_staryy_i:
    title: Grand, petit, âgé et jeune
  ru.a1.unit26.lesson02.opisyvaem_volosy:
    title: Décrire les cheveux
  ru.a1.unit26.lesson03.glaza_i_kak_vyglyadit:
    title: Les yeux et demander à quoi ressemble quelqu’un
  ru.a1.unit26.lesson04.nastya_opisyvaet_ninu:
    title: Nastya décrit Nina
  ru.a1.unit26.lesson05.sravnivaem_igorya_i_lenu:
    title: Comparer Igor et Lena
  ru.a1.unit26.lesson06.dima_uznayot_ninu:
    title: Dima reconnaît Nina
teaching:
  ru.a1.unit26.lesson01.teach.vysokiy_nevysokiy:
    title: Grand et petit
    gloss: grand / petit
    note: '*Высокий* décrit une personne grande et *невысокий* une personne petite (littéralement « pas grand »). La terminaison change selon le genre : *высокая*, *невысокая*.'
    example_gloss:
    - Lena est grande.
    - Igor est petit.
  ru.a1.unit26.lesson01.teach.staryy_molodoy:
    title: Âgé et jeune
    gloss: âgé / jeune
    note: '*Старый* et *молодой* expriment ici une impression générale d’âge, pas un nombre d’années précis.'
    example_gloss:
    - Grand-père est âgé.
    - Dima est jeune.
  ru.a1.unit26.lesson01.teach.prilagatelnoe_menyaetsya_po:
    title: L’adjectif change selon le genre
    gloss: 'L’adjectif s’accorde avec la personne : *он высокий, она высокая* ; *он старый, она старая*.'
    note: Les adjectifs masculins se terminent en *-ый*, *-ий* ou *-ой* (*высокий*, *молодой*) ; les féminins en *-ая* (*высокая*, *молодая*).
  ru.a1.unit26.lesson01.teach.lena_vysokaya_a:
    title: Lena est grande et Igor est petit
    gloss: Lena est grande et Igor est petit.
    note: 'Deux constatations sont mises en parallèle avec *а* (alors que, et) : *Лена высокая, а Игорь невысокий*.'
  ru.a1.unit26.lesson02.teach.volosy:
    title: Les cheveux
    gloss: les cheveux
    note: '*Волосы* (les cheveux) est toujours au pluriel en russe : *У Насти светлые волосы* ; on n’emploie pas de singulier.'
    example_gloss: Dima a les cheveux courts et noirs.
  ru.a1.unit26.lesson02.teach.svetlye_kashtanovye_sedye:
    title: Blond, châtain et gris
    gloss: blond / châtain / gris
    note: 'Trois couleurs de cheveux au pluriel, pour s’accorder avec *волосы* : *светлые*, *каштановые*, *седые*.'
    example_gloss:
    - Nastya a les cheveux blonds.
    - Igor a les cheveux châtains.
    - Grand-père a les cheveux gris.
  ru.a1.unit26.lesson02.teach.dlinnye_korotkie:
    title: Cheveux longs et courts
    gloss: long / court (cheveux)
    note: '*Длинные* (longs) et *короткие* (courts) s’accordent aussi avec le pluriel *волосы*.'
    example_gloss:
    - Lena a les cheveux longs.
    - Igor a les cheveux courts.
  ru.a1.unit26.lesson02.teach.volosy_stoyat_vo:
    title: Les adjectifs s’accordent avec волосы
    gloss: '*Волосы* est au pluriel, donc l’adjectif aussi : *длинные волосы*, *короткие волосы*, *светлые волосы*, *чёрные волосы*.'
    note: Les adjectifs au pluriel se terminent en *-ые* ou *-ие*. Tu retrouveras la même terminaison avec *глаза* dans la leçon suivante.
  ru.a1.unit26.lesson02.teach.posle_u_imya:
    title: У + génitif
    gloss: 'Après *у*, le possesseur est au génitif : *у Насти* (Nastya a), *у Димы* (Dima a), *у неё* (elle a).'
    note: 'C’est ainsi que le russe exprime la possession : *у* + génitif + la chose possédée. Il n’y a pas de verbe « avoir ».'
  ru.a1.unit26.lesson02.teach.u_dimy_korotkie:
    title: Dima a les cheveux courts et noirs
    gloss: Dima a les cheveux courts et noirs.
    note: '*Чёрные* (noirs) s’accorde avec le pluriel *волосы*. Dans ce cours, la lettre *ё* est toujours écrite.'
  ru.a1.unit26.lesson02.teach.u_nasti_dlinnye:
    title: Nastya a de longs cheveux blonds
    gloss: Nastya a de longs cheveux blonds.
    note: Combine le vocabulaire de la longueur et de la couleur de cette leçon dans une phrase naturelle.
  ru.a1.unit26.lesson03.teach.glaza:
    title: Les yeux
    gloss: les yeux
    note: '*Глаза* (les yeux) est le pluriel de *глаз* ; la terminaison du pluriel est *-а*.'
    example_gloss: Dima a les yeux marron.
  ru.a1.unit26.lesson03.teach.golubye_karie_zelyonye:
    title: Bleu, marron et vert
    gloss: bleu / marron / vert
    note: '*Голубые* signifie bleu clair, *карие* marron (uniquement pour les yeux) et *зелёные* vert. Les trois sont au pluriel.'
    example_gloss:
    - Nastya a les yeux bleus.
    - Igor a les yeux marron.
    - Lena a les yeux verts.
  ru.a1.unit26.lesson03.teach.glaza_stoyat_vo:
    title: Les adjectifs s’accordent avec глаза
    gloss: '*Глаза* est au pluriel, donc l’adjectif aussi : *голубые глаза*, *карие глаза*, *зелёные глаза*.'
    note: 'Des yeux marron se disent *карие*, pas *коричневые*, et des cheveux châtains *каштановые* : le russe emploie des mots différents pour les yeux et pour les cheveux.'
  ru.a1.unit26.lesson03.teach.kak_vyglyadit_nastya:
    title: À quoi ressemble Nastya ?
    gloss: À quoi ressemble Nastya ?
    note: '*Как выглядит ...?* est la question centrale de cette unité. Le verbe *выглядит* s’accorde avec un sujet au singulier.'
  ru.a1.unit26.lesson03.teach.u_nasti_dlinnye:
    title: Nastya a de longs cheveux blonds et des yeux bleus
    gloss: Nastya a de longs cheveux blonds et des yeux bleus.
    note: 'Une réponse type relie les cheveux et les yeux avec *и* : *У Насти длинные светлые волосы и голубые глаза*.'
  ru.a1.unit26.lesson04.teach.nastya_v_yazykovoe:
    title: Nastya présente Nina
    gloss: 'Nastya : Une nouvelle fille va venir au café des langues. Elle s’appelle Nina.'
    note: '*Придёт* (viendra) est le futur perfectif. *Её зовут Нина* signifie littéralement « on l’appelle Nina ».'
  ru.a1.unit26.lesson04.teach.dima_khorosho_kak:
    title: Dima demande à quoi elle ressemble
    gloss: 'Dima : D’accord ! Elle ressemble à quoi ?'
    note: La question clé revient, maintenant avec *она* (elle) à la place d’un prénom.
  ru.a1.unit26.lesson04.teach.nastya_ona_nevysokaya:
    title: Nastya décrit la taille et les cheveux de Nina
    gloss: 'Nastya : Elle est petite et elle a les cheveux courts et blonds.'
    note: Associe *невысокая* de la leçon 1 aux mots de la leçon 2 sur les cheveux. *И у неё* ajoute une deuxième information.
  ru.a1.unit26.lesson04.teach.dima_a_kakie:
    title: Dima demande comment sont ses yeux
    gloss: 'Dima : Et ses yeux ?'
    note: '*Какие у неё глаза?* utilise *у неё* (« elle a »). *Неё* est la forme de *она* après la préposition *у*.'
  ru.a1.unit26.lesson04.teach.nastya_u_neyo:
    title: Nastya décrit les yeux de Nina
    gloss: 'Nastya : Elle a les yeux verts.'
    note: Reprend *зелёные глаза* de la leçon 3, avec *у неё* pour « elle a ».
  ru.a1.unit26.lesson04.teach.dima_spasibo_togda:
    title: Dima la reconnaîtra
    gloss: 'Dima : Merci ! Alors je la reconnaîtrai.'
    note: '*Я её узнаю* (je la reconnaîtrai) : *её* est l’accusatif de *она*, car Nina est le complément d’objet.'
  ru.a1.unit26.lesson05.teach.igor_i_lena:
    title: Comparer Igor et Lena
    gloss: Igor et Lena sont frère et sœur, mais ils ne se ressemblent pas. Igor est petit et a les cheveux châtains courts et les yeux marron. Lena est plus grande qu’Igor et a de longs cheveux châtains et les yeux verts. Et toi, à quoi ressembles-tu ?
    note: Une courte comparaison qui réutilise tous les mots de couleur et de longueur appris jusqu’ici et se termine par la question essentielle de l’unité, adressée au lecteur.
    glosses:
      брат: frère
      сестра: sœur
      выглядят: apparence
      по-разному: différent
      невысокий: petit
      короткие: petit
      каштановые: châtain
      волосы: cheveux
      карие: châtain
      глаза: yeux
      выше: plus grand
      длинные: long
      зелёные: vert
      выглядишь: tu as l’air / tu ressembles (comme dans как ты выглядишь ?)
  ru.a1.unit26.lesson05.teach.posle_vyshe_stoit:
    title: Comparer avec выше
    gloss: 'Après *выше* (plus grand), la personne à qui on se compare est au génitif : *Лена выше Игоря*.'
    note: Le comparatif *выше* ne change pas selon le genre. La personne comparée est au génitif, ou bien elle vient après *чем*.
  ru.a1.unit26.lesson05.teach.u_leny_volosy:
    title: Lena a les cheveux plus longs qu’Igor
    gloss: Lena a les cheveux plus longs qu’Igor.
    note: '*У Лены волосы длиннее, чем у Игоря* : *длиннее* ne change jamais, et *чем* (que) introduit la seconde partie.'
  ru.a1.unit26.lesson05.teach.u_menya_korotkie:
    title: J’ai les cheveux courts et châtains
    gloss: J’ai les cheveux courts et châtains.
    note: 'Une phrase modèle pour décrire ton apparence : *У меня* (« j’ai ») + adjectif + nom.'
  ru.a1.unit26.lesson06.teach.dima_smotri_eto:
    title: Dima repère Nina
    gloss: 'Dima : Regarde, c’est Nina ? Elle a les cheveux courts et blonds et les yeux verts.'
    note: '*Смотри* (regarde) est l’impératif familier, employé de la même façon dans les dialogues précédents.'
  ru.a1.unit26.lesson06.teach.nastya_da_eto:
    title: Nastya confirme
    gloss: 'Nastya : Oui, c’est Nina !'
    note: Une confirmation courte et naturelle.
  ru.a1.unit26.lesson06.teach.nina_privet_ty:
    title: Nina salue Dima
    gloss: 'Nina : Salut, tu es Dima ?'
    note: 'Une question simple et familière : en russe, pas besoin du verbe « être » : *Ты Дима?*'
  ru.a1.unit26.lesson06.teach.dima_da_priyatno:
    title: Dima salue Nina à son tour
    gloss: 'Dima : Oui ! Enchanté de faire ta connaissance, Nina.'
    note: '*Приятно познакомиться* est la formule habituelle quand on rencontre quelqu’un pour la première fois. *Познакомиться* signifie faire la connaissance d’une nouvelle personne.'
  ru.a1.unit26.lesson06.teach.nina_mne_tozhe:
    title: Nina lui répond
    gloss: 'Nina : Enchantée de faire ta connaissance, moi aussi !'
    note: 'Elle clôt le dialogue : Dima a bien reconnu Nina grâce à la description de Nastya.'
