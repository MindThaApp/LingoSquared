teaching:
  ru.a1.unit07.lesson01.teach.menyu:
    title: меню
    gloss: la carte, le menu
    note: 'меню est un nom neutre indéclinable, emprunté au français : il ne change jamais de forme.'
    example_gloss: Voici le menu.
  ru.a1.unit07.lesson01.teach.ofitsiant:
    title: официант, официантка
    gloss: serveur, serveuse
    note: официант est masculin et официантка est féminin, selon le schéma régulier des terminaisons de genre.
    example_gloss: La serveuse travaille dans un restaurant.
  ru.a1.unit07.lesson01.teach.stol_svoboden:
    title: Этот столик свободен?
    gloss: Cette table est-elle libre ?
    note: столик est un diminutif de стол (« table »), couramment employé pour une table de restaurant ; свободен (« libre ») s’accorde avec le nom masculin.
  ru.a1.unit07.lesson01.teach.da_saditites:
    title: Да, садитесь, пожалуйста.
    gloss: Oui, asseyez-vous, s’il vous plaît.
    note: садитесь est l’impératif de politesse/pluriel de садиться (« s’asseoir »), employé avec вы.
  ru.a1.unit07.lesson01.teach.chto_budete_zakazyvat:
    title: Что будете заказывать?
    gloss: Que désirez-vous commander ?
    note: будете заказывать est une forme du futur (« allez commander ») que le serveur emploie pour demander ce que veut le client.
  ru.a1.unit07.lesson02.teach.ya_khochu:
    title: Я хочу ...
    gloss: Je voudrais ...
    note: хочу est la première personne du singulier de хотеть (« vouloir »), employée pour commander à manger et à boire.
  ru.a1.unit07.lesson02.teach.chay_kofe:
    title: чай, кофе
    gloss: thé, café
    note: чай et кофе sont deux boissons très commandées ; кофе est indéclinable et grammaticalement masculin malgré sa terminaison en -е.
    example_gloss:
    - Je voudrais du thé.
    - Je voudrais du café.
  ru.a1.unit07.lesson02.teach.khleb_borshch:
    title: хлеб, борщ
    gloss: pain, bortsch (soupe de betterave)
    note: борщ est la célèbre soupe russe de betterave ; les deux noms sont masculins.
    example_gloss:
    - Avez-vous du pain ?
    - Je voudrais du bortsch.
  ru.a1.unit07.lesson02.teach.salat:
    title: салат
    gloss: salade
    note: и (« et ») sert ici à relier deux plats commandés, comme dans борщ и салат.
    example_gloss: Je voudrais du bortsch et une salade.
  ru.a1.unit07.lesson03.teach.morozhenoe:
    title: мороженое
    gloss: glace
    note: мороженое est un nom neutre qui ressemble à un adjectif (« [chose] glacée »), un schéma courant pour les noms de plats en russe.
    example_gloss: En dessert, apportez une glace.
  ru.a1.unit07.lesson03.teach.prinesite:
    title: Принесите, пожалуйста, ...
    gloss: Apportez-moi ..., s’il vous plaît.
    note: Принесите est l’impératif de politesse/pluriel de принести (« apporter »), employé avec вы.
  ru.a1.unit07.lesson03.teach.spasibo:
    title: Спасибо.
    gloss: Merci.
    note: Спасибо est la façon standard de dire merci dans tout échange poli.
  ru.a1.unit07.lesson03.teach.ofitsiantka_chto_budete:
    title: La serveuse demande ce que l’on veut commander
    gloss: 'La serveuse : Que désirez-vous commander ?'
    note: La serveuse commence par demander Что будете заказывать?
  ru.a1.unit07.lesson03.teach.turist_ya_khochu_borshch:
    title: Le touriste commande à manger
    gloss: 'Le touriste : Je voudrais du bortsch et une salade.'
    note: Турист (« touriste ») répond par Я хочу борщ и салат.
  ru.a1.unit07.lesson03.teach.ofitsiantka_chto_pit:
    title: La serveuse demande ce que l’on boira
    gloss: 'La serveuse : Que boirez-vous ?'
    note: пить (« boire ») s’emploie avec будете, comme dans la question précédente avec заказывать.
  ru.a1.unit07.lesson03.teach.turist_ya_khochu_chay:
    title: Le touriste commande une boisson
    gloss: 'Le touriste : Je voudrais du thé.'
    note: Le touriste répond simplement Я хочу чай.
  ru.a1.unit07.lesson03.teach.ofitsiantka_a_na_sladkoe:
    title: La serveuse demande pour le dessert
    gloss: 'La serveuse : Et en dessert ?'
    note: 'А на сладкое? est une question de relance abrégée : « et pour le [plat] sucré ? »'
  ru.a1.unit07.lesson03.teach.turist_na_sladkoe:
    title: Le touriste commande le dessert
    gloss: 'Le touriste : En dessert, apportez-moi une glace, s’il vous plaît.'
    note: Le touriste répond par На сладкое принесите мороженое, пожалуйста.
  ru.a1.unit07.lesson03.teach.ofitsiantka_khorosho:
    title: La serveuse confirme la commande
    gloss: 'La serveuse : Très bien. Merci.'
    note: Хорошо (« d’accord, très bien ») confirme la commande, et Спасибо clôt poliment l’échange.
