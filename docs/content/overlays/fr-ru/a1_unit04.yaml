teaching:
  ru.a1.unit04.lesson01.teach.kakoy_den:
    title: Какой сегодня день?
    gloss: Quel jour sommes-nous aujourd’hui ?
    note: Какой s’accorde avec le nom masculin день (« jour »).
  ru.a1.unit04.lesson01.teach.ponedelnik_vtornik:
    title: понедельник, вторник
    gloss: lundi, mardi
    note: Comme en français, les jours de la semaine s’écrivent sans majuscule en russe.
    example_gloss:
    - Aujourd'hui, c'est lundi.
    - Aujourd'hui, c'est mardi.
  ru.a1.unit04.lesson01.teach.sreda_chetverg:
    title: среда, четверг
    gloss: mercredi, jeudi
    note: Comme tous les noms de jours en russe, среда et четверг s’écrivent en minuscules, avec une majuscule seulement en début de phrase.
    example_gloss:
    - Aujourd'hui, c'est mercredi.
    - Aujourd'hui, c'est jeudi.
  ru.a1.unit04.lesson01.teach.pyatnitsa_subbota:
    title: пятница, суббота
    gloss: vendredi, samedi
    note: 'суббота s’écrit avec un double б : un piège d’orthographe courant.'
    example_gloss:
    - Aujourd’hui, c’est vendredi.
    - Aujourd'hui, c'est samedi.
  ru.a1.unit04.lesson01.teach.voskresenye:
    title: воскресенье
    gloss: dimanche
    note: Le dernier jour de la liste des jours de la semaine russe.
    example_gloss: Aujourd'hui, c'est dimanche.
  ru.a1.unit04.lesson01.teach.segodnya:
    title: Сегодня ...
    gloss: Aujourd’hui, c’est ...
    note: Сегодня suivi d’un nom de jour n’a pas besoin de verbe « être », contrairement au français « c’est ».
  ru.a1.unit04.lesson02.teach.kakoe_chislo:
    title: Какое сегодня число?
    gloss: Quelle est la date d’aujourd’hui ?
    note: Какое s’accorde avec le nom neutre число (« date / nombre »), contrairement à какой день ci-dessus.
  ru.a1.unit04.lesson02.teach.pervoe_tretye:
    title: первое, третье
    gloss: le 1er, le 3
    note: Les dates prennent l’ordinal au neutre (-ое/-ье), car il s’accorde avec le mot sous-entendu число (« le nombre, la date »).
    example_gloss:
    - Aujourd’hui, c’est le 1er janvier.
    - Aujourd’hui, c’est le 3 janvier.
  ru.a1.unit04.lesson02.teach.pyatoe_desyatoe:
    title: пятое, десятое
    gloss: le 5, le 10
    note: Même ordinal au neutre que первое/третье.
    example_gloss:
    - Aujourd’hui, c’est le 5 octobre.
    - Aujourd’hui, c’est le 10 avril.
  ru.a1.unit04.lesson02.teach.yanvar_aprel:
    title: января, апреля
    gloss: de janvier, d’avril
    note: 'Après une date, le nom du mois se met au génitif : январь devient января et апрель devient апреля.'
    example_gloss:
    - Aujourd’hui, c’est le 3 janvier.
    - Aujourd’hui, c’est le 10 avril.
  ru.a1.unit04.lesson02.teach.oktyabrya:
    title: октября
    gloss: d’octobre
    note: Génitif de октябрь, formé comme января/апреля après une date.
    example_gloss: Aujourd’hui, c’est le 5 octobre.
  ru.a1.unit04.lesson03.teach.kakoe_segodnya_chislo:
    title: Какое сегодня число?
    gloss: Quelle est la date d’aujourd’hui ?
    note: La façon habituelle de demander la date.
  ru.a1.unit04.lesson03.teach.vo_vtornik:
    title: во вторник
    gloss: le mardi
    note: 'La préposition в devient во devant вторник pour faciliter la prononciation ; вторник lui-même ne change pas ici (les jours féminins, eux, changent : в среду, в пятницу, в субботу).'
  ru.a1.unit04.lesson03.teach.vstrecha:
    title: встреча
    gloss: réunion, rendez-vous
    note: Nom courant pour une réunion ou un rendez-vous prévu.
    example_gloss: La réunion est mardi.
  ru.a1.unit04.lesson03.teach.anna_kakoy_den:
    title: Anna demande le jour
    gloss: 'Anna : Quel jour sommes-nous aujourd’hui ?'
    note: Anna ouvre l’échange avec la question sur le день vue dans la leçon 1.
  ru.a1.unit04.lesson03.teach.viktor_sreda:
    title: Viktor répond avec le jour et la date
    gloss: 'Viktor : Aujourd’hui, c’est mercredi 3 janvier.'
    note: 'Viktor donne ensemble le jour de la semaine et la date en ordinal, avec le mois au génitif : января.'
  ru.a1.unit04.lesson03.teach.anna_khorosho:
    title: Anna propose mardi
    gloss: 'Anna : D’accord. La réunion est mardi ?'
    note: Хорошо accuse réception de la réponse de Viktor avant qu’Anna pose sa question suivante.
  ru.a1.unit04.lesson03.teach.viktor_da:
    title: Viktor confirme la date
    gloss: 'Viktor : Oui, mardi 9 janvier.'
    note: 'Да confirme, puis Viktor répète le jour et la date. Pour dire À QUELLE date quelque chose a lieu, l’ordinal lui-même se met au génitif : девятого января (« le 9 janvier »), à comparer avec Сегодня девятое января (« Aujourd’hui, c’est le 9 janvier »).'
