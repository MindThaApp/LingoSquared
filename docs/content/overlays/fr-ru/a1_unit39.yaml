    title: Une conversation sur les saisons
    gloss: 'C’est maintenant le printemps. Les tulipes sont belles. Nina demande : Quelle saison trouves-tu belle ? Dima dit : J’aime l’été. En été, on nage. Nastya dit : J’aime l’hiver. En hiver, on fait du patin à glace.'
    note: Ce texte reprend la conversation du café des langues et présente directement ce que Nina, Mateo et Elena disent des saisons.
