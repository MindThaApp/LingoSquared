      Тюльпаны: tulipes
      красивые: beau
      спрашивает: demande
      время: saison
      считаешь: penser / trouver
      говорит: dit
      лето: été
      нравится: sympa / amusant
      плаваем: nager
      зима: hiver
      коньках: patiner
