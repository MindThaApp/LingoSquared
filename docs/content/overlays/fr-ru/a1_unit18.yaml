teaching:
  ru.a1.unit18.lesson01.teach.eto_moya_kvartira:
    title: Это моя квартира.
    gloss: Voici mon appartement.
    note: Это signifie « voici » ; моя (« mon/ma », féminin) s’accorde avec le nom féminin квартира (« appartement »).
  ru.a1.unit18.lesson01.teach.kuhnya:
    title: кухня
    gloss: cuisine
    note: кухня signifie « cuisine ». стол signifie « table ».
    example_gloss: Il y a une table dans la cuisine.
  ru.a1.unit18.lesson01.teach.spalnya:
    title: спальня
    gloss: chambre
    note: спальня signifie « chambre ». кровать signifie « lit ».
    example_gloss: Il y a un lit dans la chambre.
  ru.a1.unit18.lesson02.teach.divan_v_gostinoy:
    title: Диван в гостиной.
    gloss: Le canapé est dans le salon.
    note: диван signifie « canapé » ; гостиная signifie « salon » (гостиной est sa forme au prépositif après в, « dans »).
  ru.a1.unit18.lesson02.teach.stol_na_kuhne:
    title: на
    gloss: sur / à
    note: на s’emploie avec кухня (littéralement « sur la cuisine », mais le sens est « dans la cuisine ») au lieu de в, contrairement à la plupart des pièces.
    example_gloss: La table est dans la cuisine.
  ru.a1.unit18.lesson02.teach.vannaya:
    title: ванная
    gloss: salle de bains
    note: ванная signifie « salle de bains ».
    example_gloss: La salle de bains est à côté de la chambre.
  ru.a1.unit18.lesson03.teach.dima_gde_ty_zhivyosh:
    title: Dima demande où habite Nastya
    gloss: 'Dima : Nastya, où habites-tu ?'
    note: Дима commence par Настя, где ты живёшь ?
  ru.a1.unit18.lesson03.teach.nastya_zhivu_v_kvartire:
    title: Nastya dit où elle habite
    gloss: 'Nastya : J’habite dans un appartement.'
    note: Настя répond Я живу в квартире ; живу est la forme « je » de жить (« habiter, vivre »), et в квартире est la forme au prépositif de квартира.
  ru.a1.unit18.lesson03.teach.dima_skolko_komnat:
    title: Dima demande combien il y a de pièces
    gloss: 'Dima : Combien de pièces y a-t-il dans l’appartement ?'
    note: 'Сколько (« combien ») est suivi du génitif pluriel : сколько комнат.'
  ru.a1.unit18.lesson03.teach.nastya_dve_komnaty:
    title: Nastya énumère les pièces
    gloss: 'Nastya : Deux pièces : une chambre et un salon. Il y a aussi une cuisine et une salle de bains.'
    note: 'Настя continue : Две комнаты: спальня и гостиная. Кухня и ванная тоже есть.'
