course:
  title: Russe A1
  description: Apprends le russe de niveau A1 pour les salutations du quotidien et les courts échanges sociaux, avec des explications détaillées sur l’alphabet cyrillique et sur la distinction de politesse вы/ты.
units:
  ru.a1.unit01.greetings:
    title: Salutations et adieux
lessons:
  ru.a1.unit01.lesson01.script_ramp:
    title: Découvrir l’alphabet cyrillique
  ru.a1.unit01.lesson02.vremya_dnya:
    title: Les salutations selon le moment de la journée
  ru.a1.unit01.lesson03.kak_dela_i_proshchanie:
    title: Comment vas-tu ? et dire au revoir
teaching:
  ru.a1.unit01.lesson01.teach.direction:
    title: Sens de lecture
    gloss: L’alphabet russe se lit de gauche à droite, comme l’alphabet français.
    note: 'Le russe (écriture cyrillique) se lit dans le même sens que le français : il n’y a donc pas de nouvelle habitude de lecture à prendre, seulement de nouvelles formes de lettres et de nouveaux sons.'
  ru.a1.unit01.lesson01.teach.letter_z:
    title: З з
    gloss: la lettre Z
    note: Se prononce comme le « z » de « zéro ». La minuscule з ressemble à un chiffre 3.
  ru.a1.unit01.lesson01.teach.letter_d:
    title: Д д
    gloss: la lettre D
    note: 'Se prononce comme le « d » de « dos ». La minuscule д est une version plus petite de la majuscule, avec de petits « pieds » sous la ligne : elle ne ressemble pas du tout au « d » latin, il faut donc apprendre sa forme à neuf.'
  ru.a1.unit01.lesson01.teach.letter_r:
    title: Р р
    gloss: la lettre R
    note: 'Se prononce comme un « r » roulé, différent du « r » français. Elle ressemble à un « P » latin : c’est un faux ami visuel classique, ne la lis donc pas « p ».'
  ru.a1.unit01.lesson01.teach.letter_a:
    title: А а
    gloss: la lettre A
    note: Se prononce comme le « a » de « chat ». Elle est identique au « A/a » latin et se prononce presque pareil.
  ru.a1.unit01.lesson01.teach.letter_v:
    title: В в
    gloss: la lettre V
    note: 'Se prononce comme le « v » de « vélo ». Elle ressemble à un « B » latin : un autre faux ami visuel à surveiller.'
  ru.a1.unit01.lesson01.teach.letter_s:
    title: С с
    gloss: la lettre S
    note: Se prononce comme le « s » de « soleil ». Elle ressemble au « C/c » latin, mais en russe elle ne se prononce jamais « k ».
  ru.a1.unit01.lesson01.teach.letter_t:
    title: Т т
    gloss: la lettre T
    note: 'Se prononce comme le « t » de « table ». La minuscule т est parfois écrite à la main comme un petit « m » : apprends d’abord la forme imprimée présentée ici.'
  ru.a1.unit01.lesson01.teach.letter_u:
    title: У у
    gloss: la lettre U
    note: 'Se prononce comme « ou » dans « loup ». Elle ressemble à un « y » latin : encore une forme dont le son n’a rien à voir avec la lettre latine qui lui ressemble.'
  ru.a1.unit01.lesson01.teach.letter_ye:
    title: Е е
    gloss: la lettre Ye
    note: Se prononce comme « yé » dans « yéti » au début d’un mot ou d’une syllabe. Elle est identique au « E/e » latin, mais elle sonne très différemment.
  ru.a1.unit01.lesson01.teach.hard_sign_note:
    title: 'ъ et ь : le signe dur et le signe mou'
    gloss: 'Le signe dur ъ et le signe mou ь n’ont pas de son propre : ils modifient la prononciation de la lettre voisine.'
    note: 'Ces deux signes ne représentent jamais un son à eux seuls : ь adoucit la consonne qui précède, et ъ marque une séparation nette entre deux sons. Nous y reviendrons quand de vrais mots les utiliseront.'
  ru.a1.unit01.lesson01.teach.letter_short_i:
    title: Й й
    gloss: la lettre I bref
    note: 'Se prononce comme le « y » de « payer » ou le « ill » de « travail » : un glissement rapide, pas une voyelle complète. Elle apparaît dans Здравствуйте, le mot vers lequel mène cette leçon.'
  ru.a1.unit01.lesson01.teach.zdravstvuyte_shape:
    title: Здравствуйте
    gloss: bonjour (formel)
    note: La salutation formelle complète, construite avec les lettres que tu viens de découvrir. Elle paraît longue et pleine de consonnes, mais chacune de ses lettres a déjà été vue dans cette leçon.
    example_gloss: Bonjour ! Je m’appelle Viktor.
  ru.a1.unit01.lesson02.teach.zdravstvuyte_privet:
    title: Здравствуйте, Привет
    gloss: bonjour (formel) ; salut (informel)
    note: Здравствуйте est la salutation formelle sûre, valable à toute heure et avec n’importe quel inconnu. Привет est familier, utilisé avec les amis et les personnes de ton âge.
    example_gloss:
    - Bonjour ! Comment allez-vous ? (formel)
    - Salut ! Comment ça va ? (informel)
  ru.a1.unit01.lesson02.teach.dobroe_utro:
    title: Доброе утро!
    gloss: bonjour
    note: S’emploie le matin, jusqu’à la fin de la matinée environ.
  ru.a1.unit01.lesson02.teach.dobryy_den:
    title: Добрый день!
    gloss: bonjour
    note: La salutation courante de la journée, utilisable de la fin de la matinée jusqu’à l’après-midi.
  ru.a1.unit01.lesson02.teach.dobryy_vecher:
    title: Добрый вечер!
    gloss: bonsoir
    note: 'S’emploie quand on arrive quelque part le soir : c’est une salutation, pas une formule d’adieu.'
  ru.a1.unit01.lesson02.teach.register_note:
    title: Choisir une salutation
    gloss: Здравствуйте convient à toute heure et dans un cadre poli. Привет est informel, utilisé entre amis.
    note: Si tu hésites sur le moment de la journée ou sur la personne à qui tu parles, Здравствуйте est toujours sûr ; Привет est réservé aux personnes que tu connais déjà bien.
  ru.a1.unit01.lesson03.teach.kak_dela:
    title: Как дела?
    gloss: Comment ça va ? (informel)
    note: La façon informelle et courante de demander à quelqu’un comment il va, avec des amis et des personnes de ton âge.
  ru.a1.unit01.lesson03.teach.kak_pozhivaete:
    title: Как поживаете?
    gloss: Comment allez-vous ? (formel)
    note: La façon formelle de demander à quelqu’un comment il va, qui correspond au registre du вы.
  ru.a1.unit01.lesson03.teach.horosho_spasibo:
    title: Хорошо, спасибо
    gloss: bien, merci
    note: Une réponse simple et positive, utilisable dans les deux registres.
    example_gloss: Comment ça va ? — Bien, merci.
  ru.a1.unit01.lesson03.teach.tak_sebe:
    title: Так себе
    gloss: comme ci, comme ça
    note: Une réponse neutre à légèrement négative, quand tout n’est ni très bien ni mauvais.
    example_gloss: Comment ça va ? — Comme ci, comme ça.
  ru.a1.unit01.lesson03.teach.a_u_tebya:
    title: А у тебя?
    gloss: Et toi ? (informel)
    note: La façon informelle de renvoyer la question à l’autre personne, qui correspond au registre du ты.
  ru.a1.unit01.lesson03.teach.do_svidaniya:
    title: До свидания!
    gloss: au revoir (neutre/formel)
    note: L’adieu standard et polyvalent, dont le sens littéral est proche de « jusqu’à ce qu’on se revoie ».
  ru.a1.unit01.lesson03.teach.poka:
    title: Пока!
    gloss: salut (au revoir, informel)
    note: Une façon décontractée et très courante de dire au revoir entre amis et connaissances.
  ru.a1.unit01.lesson03.teach.do_zavtra:
    title: До завтра!
    gloss: à demain
    note: Un au revoir amical, quand on pense revoir la personne le lendemain.
  ru.a1.unit01.lesson03.teach.anna:
    title: Anna salue Maksim
    gloss: 'Anna dit : Bonjour ! Comment ça va ?'
    note: Anna et Maksim sont collègues et se saluent dans la journée, avec le degré de familiarité qu’implique дела (registre informel).
  ru.a1.unit01.lesson03.teach.maksim_reply:
    title: Maksim répond et renvoie la question
    gloss: 'Maksim dit : Bien, merci. Et toi ?'
    note: Maksim répond et renvoie la question de façon informelle, dans le même registre qu’Anna.
  ru.a1.unit01.lesson03.teach.anna_close:
    title: Anna conclut l’échange
    gloss: 'Anna dit : Moi aussi, ça va bien. Bon, à demain !'
    note: Anna termine la conversation et passe à un au revoir amical.
  ru.a1.unit01.lesson03.teach.maksim_close:
    title: Maksim dit au revoir
    gloss: 'Maksim dit : À demain !'
    note: Maksim reprend l’au revoir d’Anna et conclut l’échange.
