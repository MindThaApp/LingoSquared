teaching:
  ru.a1.unit08.lesson01.teach.magazin:
    title: магазин
    gloss: magasin
    note: магазин est un nom masculin qui désigne un magasin.
    example_gloss: Nous allons au magasin.
  ru.a1.unit08.lesson01.teach.skolko:
    title: сколько
    gloss: combien
    note: сколько sert à demander une quantité ou un prix et s’emploie souvent avec стоит.
    example_gloss: Combien coûte le pain ?
  ru.a1.unit08.lesson01.teach.stoit:
    title: стоит
    gloss: coûte
    note: стоит est la troisième personne du singulier de стоить (« coûter »), employée avec un sujet au singulier comme хлеб.
    example_gloss: Le pain coûte cent roubles.
  ru.a1.unit08.lesson01.teach.rubl:
    title: рубль
    gloss: rouble
    note: рубль est la monnaie russe ; сто (« cent ») entraîne le génitif pluriel рублей.
    example_gloss: Le pain coûte cent roubles.
  ru.a1.unit08.lesson01.teach.khleb_moloko:
    title: хлеб, молоко
    gloss: pain, lait
    note: хлеб est masculin et молоко est neutre ; ce sont deux produits courants de l’épicerie.
    example_gloss:
    - Combien coûte le pain ?
    - Combien coûte le lait ?
  ru.a1.unit08.lesson02.teach.dayte_pozhaluysta:
    title: Дайте, пожалуйста, ...
    gloss: Donnez-moi ..., s’il vous plaît
    note: Дайте est l’impératif de politesse ou du pluriel de дать (« donner »), employé avec вы.
  ru.a1.unit08.lesson02.teach.kilogramm:
    title: килограмм
    gloss: kilogramme
    note: килограмм est l’unité habituelle pour acheter des fruits et légumes ou du pain au poids.
    example_gloss: Donnez-moi un kilo, s’il vous plaît.
  ru.a1.unit08.lesson02.teach.polkilo:
    title: полкило
    gloss: un demi-kilo
    note: полкило est formé de пол- (« demi ») et de кило (forme courte familière de килограмм).
    example_gloss: Donnez-moi un demi-kilo, s’il vous plaît.
  ru.a1.unit08.lesson02.teach.shtuka:
    title: штука
    gloss: pièce (unité)
    note: штука sert à compter des objets à l’unité ; пять штук est au génitif pluriel après le nombre пять.
    example_gloss:
    - Donnez-moi une pièce, s’il vous plaît.
    - Donnez-moi cinq pièces, s’il vous plaît.
  ru.a1.unit08.lesson03.teach.pomidory_ogurtsy:
    title: помидоры, огурцы
    gloss: tomates, concombres
    note: Ce sont deux noms de légumes au pluriel ; помидоры et огурцы sont tous deux masculins.
    example_gloss:
    - Vous avez des tomates ?
    - Vous avez des concombres ?
  ru.a1.unit08.lesson03.teach.kartofel_kapusta:
    title: картофель, капуста
    gloss: pommes de terre, chou
    note: картофель est un nom masculin collectif (employé comme un nom non dénombrable) et капуста est féminin.
    example_gloss:
    - Vous avez des pommes de terre ?
    - Vous avez du chou ?
  ru.a1.unit08.lesson03.teach.yabloki_apelsiny:
    title: яблоки, апельсины
    gloss: pommes, oranges
    note: кило яблок met le génitif pluriel яблок après кило (« un kilo de pommes »), comme кило апельсинов.
    example_gloss:
    - Combien coûte un kilo de pommes ?
    - Combien coûte un kilo d’oranges ?
  ru.a1.unit08.lesson03.teach.u_vas_est:
    title: У вас есть ...?
    gloss: Avez-vous… ? (forme de politesse)
    note: Elle emploie la forme de politesse вас, la façon habituelle de demander à un commerçant s’il a tel article.
  ru.a1.unit08.lesson03.teach.da_u_menya_est:
    title: Да, у меня есть ...
    gloss: Oui, j’ai…
    note: У меня есть (littéralement « chez moi il y a ») est la façon normale de dire « j’ai » ; c’est la réponse du commerçant.
  ru.a1.unit08.lesson03.teach.pokupatel_pomidory:
    title: Le client demande s’il y a des tomates
    gloss: 'Client : Avez-vous des tomates ?'
    note: Le client commence par la question polie У вас есть ...?
  ru.a1.unit08.lesson03.teach.prodavets_da_est:
    title: Le vendeur répond oui
    gloss: 'Vendeur : Oui, nous en avons.'
    note: Да, есть est la réponse courte et courante, littéralement « oui, il y a », sans répéter l’article.
  ru.a1.unit08.lesson03.teach.pokupatel_kilo_yablok:
    title: Le client demande un prix
    gloss: 'Client : Combien coûte un kilo de pommes ?'
    note: кило яблок met le génitif pluriel яблок après кило.
  ru.a1.unit08.lesson03.teach.prodavets_dvesti:
    title: Le vendeur donne le prix
    gloss: 'Vendeur : Deux cents roubles.'
    note: Двести signifie « deux cents » ; comme сто, il est suivi du génitif pluriel рублей.
  ru.a1.unit08.lesson03.teach.pokupatel_dayte_kilogramm:
    title: Le client achète un kilo
    gloss: 'Client : Un kilo de pommes, s’il vous plaît.'
    note: Дайте ..., пожалуйста vu à la leçon 2, ici avec килограмм яблок (« un kilo de pommes »).
  ru.a1.unit08.lesson03.teach.prodavets_khorosho:
    title: Le vendeur tend la marchandise
    gloss: 'Vendeur : Très bien, voici.'
    note: Ici, пожалуйста signifie « voici » quand le vendeur remet l’achat, et non « s’il vous plaît ».
