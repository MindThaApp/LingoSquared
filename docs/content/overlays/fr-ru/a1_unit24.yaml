  ru.a1.unit24.lesson01.teach.mozhno_kartoy:
    title: Можно картой?
    gloss: Puis-je payer par carte ?
    note: картой est l’instrumental de карта ; on l’emploie pour payer par carte.
    example_gloss: Je peux payer par carte aujourd’hui ?
  ru.a1.unit24.lesson01.teach.nalichnymi:
    title: наличными
    gloss: en espèces
    note: наличными désigne le paiement en espèces.
    example_gloss: On peut payer en espèces.
  ru.a1.unit24.lesson01.teach.rubli:
    title: рубли
    gloss: roubles
    note: рубли est le nom de la monnaie ; après beaucoup de nombres, on trouve рублей.
    example_gloss: J’ai besoin de roubles.
  ru.a1.unit24.lesson02.teach.chek_nuzhen:
    title: Чек нужен?
    gloss: Vous voulez un ticket ?
    note: нужен s’accorde avec чек, qui est masculin.
    example_gloss: Vous voulez un ticket aujourd’hui ?
  ru.a1.unit24.lesson02.teach.s_vas_trista:
    title: С вас триста рублей.
    gloss: Cela fait trois cents roubles.
    note: С вас... est une expression courante de caissier pour indiquer la somme à payer.
    example_gloss: Aujourd’hui, cela fait trois cents roubles.
  ru.a1.unit24.lesson02.teach_tolko_nalichnymi:
    title: Только наличными.
    gloss: Uniquement en espèces.
    note: Только signifie « seulement ».
    example_gloss: Aujourd’hui, uniquement en espèces.
  ru.a1.unit24.lesson03.teach.dima_mozhno_kartoy:
    title: Dima demande s’il peut payer par carte
    gloss: 'Dima : Je peux payer par carte ?'
    note: Cette question porte sur un moyen de paiement accepté.
  ru.a1.unit24.lesson03.teach.kassir_da_s_vas:
    title: Le caissier indique la somme
    gloss: 'Le caissier : Oui, c’est possible. Cela fait trois cents roubles.'
    note: La caissière confirme le paiement par carte et annonce le montant.
  ru.a1.unit24.lesson03.teach.dima_vot_karta:
    title: Dima donne la carte
    gloss: 'Dima : Voici la carte.'
    note: Вот карта est une formule simple pour tendre quelque chose.
  ru.a1.unit24.lesson03.teach.kassir_chek:
    title: La caissière demande si tu veux un ticket
    gloss: 'La caissière : Merci. Vous voulez un ticket de caisse ?'
    note: Чек нужен? demande si le ticket de caisse est nécessaire.
