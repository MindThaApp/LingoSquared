teaching:
  ru.a1.unit17.lesson01.teach.ya_vrach_rabotayu_v_bolnitse:
    title: Я врач. Я работаю в больнице.
    gloss: Je suis médecin. Je travaille à l’hôpital.
    note: врач signifie « médecin » (la profession) ; работаю в + prépositionnel signifie « je travaille à/dans ».
  ru.a1.unit17.lesson01.teach.uchitel:
    title: учитель
    gloss: professeur
    note: учитель signifie « professeur ». работает est la forme « il/elle travaille » de работать.
    example_gloss: Elle est professeure. Elle travaille dans une école.
  ru.a1.unit17.lesson01.teach.inzhener:
    title: инженер
    gloss: ingénieur
    note: инженер signifie « ingénieur ». офис signifie « bureau » ; в офисе est la forme du prépositionnel, « dans le bureau ».
    example_gloss: Il est ingénieur. Il travaille dans un bureau.
  ru.a1.unit17.lesson02.teach.kem_ty_rabotayesh:
    title: Кем ты работаешь?
    gloss: Quel est ton métier ?
    note: Кем ты работаешь? est la façon habituelle de demander le métier de quelqu’un ; кем est l’instrumental de « qui », employé avec работать.
  ru.a1.unit17.lesson02.teach.prodavets:
    title: продавец
    gloss: vendeur / vendeuse
    note: продавец signifie « vendeur » (qui travaille dans un magasin). магазин signifie « magasin » ; в магазине est la forme du prépositionnel.
    example_gloss: Il est vendeur. Il travaille dans un magasin.
  ru.a1.unit17.lesson02.teach.povar:
    title: повар
    gloss: cuisinier / cuisinière
    note: повар signifie « cuisinier ». ресторан signifie « restaurant » ; в ресторане est la forme du prépositionnel.
    example_gloss: Elle est cuisinière. Elle travaille dans un restaurant.
  ru.a1.unit17.lesson03.teach.nastya_kem_ty_rabotayesh:
    title: Nastya demande à Dima quel est son métier
    gloss: 'Nastya : Quel est ton métier, Dima ?'
    note: Настя commence par Кем ты работаешь, Дима?
  ru.a1.unit17.lesson03.teach.dima_inzhener_ofise:
    title: Dima répond et renvoie la question
    gloss: 'Dima : Je suis ingénieur. Je travaille dans un bureau. Et toi ?'
    note: Дима répond Я инженер. Я работаю в офисе. А ты?
