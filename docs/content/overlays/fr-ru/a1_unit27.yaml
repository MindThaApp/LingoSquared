    title: L’oiseau de Nina
teaching:
  ru.a1.unit27.lesson01.teach.zhivotnoe_domashnee_zhivotnoe:
    title: Un animal, un animal de compagnie
    gloss: l’animal / un animal de compagnie
    note: '*Животное* est le mot général pour « animal ». *Домашнее животное* (littéralement « animal domestique ») désigne spécifiquement un animal de compagnie.'
    example_gloss:
    - Un chien est un animal.
    - Un chien est aussi un animal de compagnie.
  ru.a1.unit27.lesson01.teach.sobaka_koshka:
    title: Le chien et le chat
    gloss: le chien / le chat
    example_gloss:
    - Nastia a un chien.
    - Igor a un chat.
  ru.a1.unit27.lesson01.teach.ryba_ptitsa:
    title: Le poisson et l’oiseau
    gloss: le poisson / l’oiseau
    example_gloss:
    - Grand-père a un poisson.
    - Nina a un oiseau.
  ru.a1.unit27.lesson01.teach.u_tebya_est:
    title: As-tu un animal de compagnie ?
    gloss: As-tu un animal de compagnie ?
    note: '*У тебя есть ...?* est la question pour « as-tu » : *у тебя* (« chez toi ») + *есть* + la chose.'
  ru.a1.unit27.lesson01.teach.da_u_menya:
    title: Oui, j’ai un chien
    gloss: Oui, j’ai un chien.
    note: Une réponse affirmative simple qui utilise le nouveau vocabulaire de cette unité.
  ru.a1.unit27.lesson01.teach.net_u_menya:
    title: Non, je n’ai pas d’animal de compagnie
    gloss: Non, je n’ai pas d’animal de compagnie.
    note: '*Нет* + génitif exprime l’absence : *у меня нет домашнего животного*. Voir la note de grammaire.'
  ru.a1.unit27.lesson01.teach.posle_net_slovo:
    title: Нет + génitif
    gloss: 'Après *нет*, ce qui manque se met au génitif : *у меня нет времени*, *у меня нет домашнего животного*.'
    note: 'Compare avec l’affirmatif : *у меня есть собака* (nominatif) mais *у меня нет собаки* (génitif).'
  ru.a1.unit27.lesson02.teach.gulyat_s_sobakoy:
    title: Promener un animal
    gloss: promener un animal
    note: '*Гулять с собакой* emploie *с* + l’instrumental, *собакой*. Voir la note de grammaire.'
    example_gloss: Je promène le chien tous les jours.
  ru.a1.unit27.lesson02.teach.posle_s_slovo:
    title: С + instrumental
    gloss: 'Après *с* (avec), le nom se met à l’instrumental : *гулять с собакой*, *играть с кошкой*.'
    note: 'L’instrumental des noms féminins se termine en *-ой* ou *-ей* : *собакой*, *кошкой*.'
  ru.a1.unit27.lesson02.teach.kormit:
    title: Donner à manger
    gloss: donner à manger
    example_gloss: Je donne à manger au chat tous les jours.
  ru.a1.unit27.lesson02.teach.igrat_s:
    title: Jouer avec
    gloss: jouer avec
    example_gloss: Igor joue avec son chat.
  ru.a1.unit27.lesson02.teach.ya_kazhdyy_den:
    title: Je promène le chien tous les jours
    gloss: Je promène le chien tous les jours.
    note: '*Каждый день* (tous les jours) est une expression de temps sans préposition : *Я каждый день гуляю с собакой*.'
  ru.a1.unit27.lesson02.teach.ya_kazhdyy_den_2:
    title: Je donne à manger au chat tous les jours
    gloss: Je donne à manger au chat tous les jours.
    note: '*Кормить* prend l’animal comme complément d’objet direct à l’accusatif : *кошка* devient *кошку*.'
  ru.a1.unit27.lesson03.teach.posle_lyubit_zhivotnoe:
    title: Les animaux après любить
    gloss: 'Après *любить*, un nom d’animal est à l’accusatif, qui pour les noms animés est identique au génitif pluriel : *собак*, *кошек*, *птиц*, *рыб*.'
    note: Le modèle du pluriel régulier russe, présenté ici pour la première fois avec des noms d’animaux comme exemples.
  ru.a1.unit27.lesson03.teach.sobak_koshek:
    title: Les chiens et les chats
    gloss: chiens / chats
    example_gloss:
    - Dima adore les chiens.
    - Lena aime les chats.
  ru.a1.unit27.lesson03.teach.ryb_ptits:
    title: Les poissons et les oiseaux
    gloss: poissons / oiseaux
    example_gloss:
    - J’adore les poissons.
    - Grand-père adore les oiseaux.
  ru.a1.unit27.lesson03.teach.ya_lyublyu_zhivotnykh:
    title: J’adore les animaux
    gloss: J’adore les animaux.
    note: '*Люблю* + accusatif : *Я люблю животных*. Pour les noms animés au pluriel, l’accusatif est identique au génitif.'
  ru.a1.unit27.lesson03.teach.lena_lyubit_koshek:
    title: Lena aime les chats, mais n’a pas d’animal
    gloss: Lena aime les chats, mais elle n’a pas d’animal de compagnie.
    note: Cette phrase souligne la différence entre adorer un animal et en avoir un.
  ru.a1.unit27.lesson04.teach.dima_u_tebya:
    title: Dima demande si Nastia a un animal
    gloss: 'Dima : As-tu un animal de compagnie, Nastia ?'
  ru.a1.unit27.lesson04.teach.nastya_da_u:
    title: Nastya a un chien
    gloss: 'Nastya : Oui, j’ai un chien.'
  ru.a1.unit27.lesson04.teach.dima_kak_on:
    title: Dima demande à quoi il ressemble
    gloss: 'Dima : Il est comment ?'
    note: La question *Как он выглядит?* convient aussi pour les animaux. On emploie *Он* (il) pour un animal domestique mâle.
  ru.a1.unit27.lesson04.teach.nastya_u_nego:
    title: Nastya décrit son chien
    gloss: 'Nastya : Il a le poil brun et il est petit.'
    note: On réutilise le vocabulaire de la couleur des cheveux et de la taille, étudié pour décrire l’apparence, mais cette fois pour parler du pelage d’un animal.
  ru.a1.unit27.lesson04.teach.o_zhivotnom_mozhno:
    title: Он et она pour les animaux
    gloss: 'Un animal de compagnie peut être *он* ou *она*, comme une personne : *У меня собака, он маленький*.'
    note: Grammaticalement, *собака* est féminin, mais les Russes disent souvent *он* quand ils savent que l’animal est un mâle.
  ru.a1.unit27.lesson04.teach.dima_ty_gulyaesh:
    title: Dima demande pour les promenades
    gloss: 'Dima : Tu le promènes tous les jours ?'
  ru.a1.unit27.lesson04.teach.nastya_da_ya:
    title: Nastya décrit sa routine
    gloss: 'Nastya : Oui, je me promène avec lui tous les jours et je le nourris.'
  ru.a1.unit27.lesson05.teach.dima_i_lena:
    title: Dima, Lena et Igor parlent des animaux
    gloss: 'Dima et Lena aiment tous les deux les animaux, mais ni l’un ni l’autre n’a d’animal de compagnie. Dima aime les chiens et Lena aime les chats. Igor, lui, a un animal de compagnie : un chat. Il joue souvent avec son chat et lui donne à manger tous les jours. Et toi, as-tu un animal de compagnie ?'
    note: Ce texte met en contraste le fait d’adorer un animal et celui d’en avoir réellement un.
    glosses:
      любят: adorer
      оба: tous les deux
      животных: animaux
      обоих: tous les deux
      домашнего: animal de compagnie
      собак: chiens
      кошек: chats
      кошка: chat
      играет: joue
      даёт: donne
      каждый: tous les
      корм: nourriture
  ru.a1.unit27.lesson05.teach.igor_chasto_igraet:
    title: Igor joue souvent avec son chat
    gloss: Igor joue souvent avec son chat.
    note: '*Со своей кошкой* : *со* est la forme de *с* devant un groupe de consonnes, et *своей* signifie « son propre », en renvoyant au sujet.'
  ru.a1.unit27.lesson05.teach.ya_lyublyu_sobak:
    title: J’adore les chiens. Je n’ai pas d’animal de compagnie.
    gloss: J’adore les chiens. Je n’ai pas d’animal de compagnie.
    note: Un modèle de réponse en deux phrases, prêt à être réutilisé pour l’exercice d’expression écrite de cette unité.
  ru.a1.unit27.lesson06.teach.nastya_nina_u:
    title: Nastya interroge Nina
    gloss: 'Nastya : Nina, toi aussi, tu as un animal de compagnie ?'
  ru.a1.unit27.lesson06.teach.nina_da_u:
    title: Nina a un oiseau qui s’appelle Pico
    gloss: 'Nina : Oui, j’ai un oiseau. Il s’appelle Pico.'
    note: '*Его зовут Пико* signifie littéralement « on l’appelle Pico ». C’est ainsi que le russe donne un nom.'
  ru.a1.unit27.lesson06.teach.dima_kak_zdorovo:
    title: Dima réagit
    gloss: 'Dima : Super ! Qu’est-ce que tu fais avec lui tous les jours ?'
  ru.a1.unit27.lesson06.teach.nina_ya_kazhdyy:
    title: Nina le nourrit tous les jours
    gloss: 'Nina : Je le nourris tous les jours.'
  ru.a1.unit27.lesson06.teach.dima_ya_tozhe:
    title: Dima aime aussi les oiseaux
    gloss: 'Dima : Moi aussi, j’aime les oiseaux.'
  ru.a1.unit27.lesson06.teach.nastya_kak_khorosho:
    title: Nastya conclut la conversation
    gloss: 'Nastya : Quelle chance que nous trois aimions les animaux !'
    note: Cette phrase réunit ce que les trois personnages ont dit sur les animaux dans cette unité.
