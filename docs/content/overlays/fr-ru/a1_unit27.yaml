course:
  title: Russe A1
  description: 'Russe débutant pour parler des animaux de compagnie et des animaux courants : les nommer, les soins de base (promener, nourrir, jouer), dire quels animaux tu aimes même sans en avoir, et le pluriel régulier russe.'
