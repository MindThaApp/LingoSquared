  ru.a1.unit29.lesson05.teach.nastya_kazhdyy_den:
    title: Qui se déplace comment ?
    gloss: Nastya va au travail en train tous les jours. Dima y va d’habitude à vélo, mais quand il pleut, il prend aussi le train. Igor préfère y aller en voiture. Lena habite tout près et va au travail à pied. Et toi, comment vas-tu au travail ?
    note: 'Un texte qui oppose quatre façons d’aller au travail et une condition (la pluie) : *обычно ... но когда идёт дождь ...*.'
