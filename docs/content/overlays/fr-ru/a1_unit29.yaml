      едет: voyage
      каждый: tous les
      день: jour
      поезде: train
      работу: travailler
      велосипеде: fait du vélo
      обычно: habituellement
      дождь: pleut
      идёт: prend
      ездить: conduit
      предпочитает: préfère
      машине: voiture
      живёт: habite
