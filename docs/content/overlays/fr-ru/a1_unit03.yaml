course:
  title: Russe A1
  description: Apprends le russe de niveau A1 pour les salutations du quotidien et les courts échanges sociaux, avec des explications détaillées sur l’alphabet cyrillique et sur la distinction de politesse вы/ты.
units:
  ru.a1.unit03.numbers:
    title: Les nombres
lessons:
  ru.a1.unit03.lesson01.chisla_1_5:
    title: Les nombres de un à cinq
  ru.a1.unit03.lesson02.chisla_6_10:
    title: Les nombres de six à dix
  ru.a1.unit03.lesson03.na_rynke:
    title: 'Au marché : compter l’argent'
teaching:
  ru.a1.unit03.lesson01.teach.u_menya:
    title: У меня ...
    gloss: J’ai ...
    note: 'Littéralement « chez moi (il y a) ... » : c’est la façon russe habituelle de dire « j’ai », sans verbe « avoir ».'
  ru.a1.unit03.lesson01.teach.odin_dva:
    title: один, два
    gloss: un, deux
    note: 'Après два (« deux »), le nom prend une forme particulière du génitif singulier : брат (« frère ») devient брата, et non un pluriel ordinaire.'
    example_gloss:
    - J’ai un frère.
    - J’ai deux frères.
  ru.a1.unit03.lesson01.teach.tri_chetyre:
    title: три, четыре
    gloss: trois, quatre
    note: 'Три et четыре demandent la même forme de génitif singulier que два : книга (« livre ») devient книги après два, три ou четыре.'
    example_gloss:
    - J’ai trois livres.
    - J’ai quatre livres.
  ru.a1.unit03.lesson01.teach.pyat:
    title: пять
    gloss: cinq
    note: 'À partir de пять (« cinq »), le nom passe au génitif pluriel : рубль (« rouble ») devient рублей, et non рубли.'
    example_gloss: J’ai cinq roubles.
  ru.a1.unit03.lesson01.teach.brat_bratya:
    title: брат, брата
    gloss: frère ; frères (après 2 à 4)
    note: брата est la forme du génitif singulier employée précisément après два, три et четыре, et non le pluriel ordinaire.
    example_gloss: J’ai deux frères.
  ru.a1.unit03.lesson01.teach.kniga_knigi:
    title: книга, книги
    gloss: livre ; livres (après 2 à 4)
    note: книги suit le même modèle de génitif singulier que брата, après два, три et четыре.
    example_gloss: J’ai trois livres.
  ru.a1.unit03.lesson01.teach.rubl_rubley:
    title: рубль, рублей
    gloss: rouble ; roubles (à partir de 5)
    note: рублей est la forme du génitif pluriel employée à partir de пять (« cinq »).
    example_gloss: J’ai cinq roubles.
  ru.a1.unit03.lesson02.teach.shest_sem:
    title: шесть, семь
    gloss: six, sept
    note: Comme пять, шесть et семь demandent un nom au génitif pluriel.
    example_gloss:
    - Il est six heures.
    - J’ai sept roubles.
  ru.a1.unit03.lesson02.teach.vosem_devyat:
    title: восемь, девять
    gloss: huit, neuf
    note: 'Tous deux suivent le même modèle du génitif pluriel : книга devient книг, et рубль devient рублей.'
    example_gloss:
    - J’ai huit livres.
    - J’ai neuf roubles.
  ru.a1.unit03.lesson02.teach.desyat:
    title: десять
    gloss: dix
    note: S’emploie aussi pour dire l’âge, comme dans Мне десять лет (« J’ai dix ans »).
    example_gloss: J’ai dix ans.
  ru.a1.unit03.lesson02.teach.kniga_genitive_plural:
    title: книг
    gloss: livres (génitif pluriel, à partir de 5)
    note: 'Le génitif pluriel de книга, employé à partir de пять : remarque qu’il perd complètement la voyelle finale, contrairement à книги employé après два, три et четыре.'
    example_gloss: J’ai neuf livres.
  ru.a1.unit03.lesson02.teach.mne_let:
    title: Мне десять лет.
    gloss: J’ai dix ans.
    note: En russe, l’âge s’exprime avec le datif « à moi » (мне), un nombre et лет (le génitif pluriel de « années »), sans verbe « avoir » comme en français.
  ru.a1.unit03.lesson02.teach.skolko_vam_let:
    title: Сколько вам лет?
    gloss: Quel âge avez-vous ? (forme de politesse)
    note: Emploie le datif de politesse вам, en accord avec le registre вы vu dans l’unité 2.
  ru.a1.unit03.lesson03.teach.skolko_stoit:
    title: Сколько это стоит?
    gloss: Combien ça coûte ?
    note: La façon habituelle de demander le prix d’un seul article, avec стоит (« ça coûte », au singulier).
  ru.a1.unit03.lesson03.teach.skolko_stoyat:
    title: Сколько стоят яблоки?
    gloss: Combien coûtent les pommes ?
    note: Emploie стоят (le pluriel de « coûter ») parce que яблоки (« pommes ») est au pluriel, contrairement au singulier стоит dans Сколько это стоит?
  ru.a1.unit03.lesson03.teach.rubley:
    title: рубль, рубля, рублей
    gloss: rouble (1) ; roubles (2 à 4) ; roubles (5 et plus)
    note: 'Le mot « rouble » change de forme selon le nombre qui précède : рубль après un, рубля après два/три/четыре, et рублей à partir de пять.'
    example_gloss:
    - Ça coûte un rouble.
    - Ça coûte deux roubles.
    - Ça coûte cinq roubles.
  ru.a1.unit03.lesson03.teach.pokupatel_greeting:
    title: Le client salue le vendeur
    gloss: 'Client : Bonjour ! Combien coûtent les pommes ?'
    note: Un client à un étal de marché commence poliment par Здравствуйте avant de demander le prix.
  ru.a1.unit03.lesson03.teach.prodavets_apples:
    title: Le vendeur répond
    gloss: 'Vendeur : Trois roubles.'
    note: Три рубля utilise la forme du génitif singulier (2 à 4) de « рубль », en accord avec три.
  ru.a1.unit03.lesson03.teach.pokupatel_bread:
    title: Le client s’informe sur le prix du pain
    gloss: 'Client : Et combien coûte le pain ?'
    note: Le client emploie А (« et ») pour enchaîner naturellement avec une question sur un deuxième article.
  ru.a1.unit03.lesson03.teach.prodavets_bread:
    title: Le vendeur répond à nouveau
    gloss: 'Vendeur : Six roubles.'
    note: Шесть рублей utilise la forme du génitif pluriel (à partir de 5), en accord avec шесть.
  ru.a1.unit03.lesson03.teach.pokupatel_close:
    title: Le client conclut poliment
    gloss: 'Client : D’accord, merci !'
    note: Хорошо, спасибо ! termine l’échange au marché sur une note aimable, avec le vocabulaire de l’unité sur les salutations.
