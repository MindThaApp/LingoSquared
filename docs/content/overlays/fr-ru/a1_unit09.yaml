teaching:
  ru.a1.unit09.lesson01.teach.gde:
    title: где
    gloss: où
    note: где sert à demander où se trouve quelque chose ; il s’emploie souvent avec находится.
    example_gloss: Où est le magasin ?
  ru.a1.unit09.lesson01.teach.nakhoditsya:
    title: находится
    gloss: se trouve
    note: находится est la 3e personne du singulier de находиться (« se trouver »), employée avec un sujet au singulier comme магазин.
    example_gloss: Où se trouve le magasin ?
  ru.a1.unit09.lesson01.teach.ulitsa:
    title: улица
    gloss: rue
    note: улица est féminin ; dans на Тверской улице (« dans la rue Tverskaïa »), улице est au prépositionnel après на.
    example_gloss: Le magasin est dans la rue Tverskaïa.
  ru.a1.unit09.lesson01.teach.gde_nakhoditsya_magazin:
    title: Где находится магазин?
    gloss: Où se trouve le magasin ?
    note: C’est la structure habituelle pour demander où se trouve un lieu quelconque.
  ru.a1.unit09.lesson02.teach.bank_apteka:
    title: банк, аптека
    gloss: banque, pharmacie
    note: 'банк est masculin et аптека est féminin : ce sont deux lieux courants en ville.'
    example_gloss:
    - Où se trouve la banque ?
    - Où se trouve la pharmacie ?
  ru.a1.unit09.lesson02.teach.vokzal_gostinitsa:
    title: вокзал, гостиница
    gloss: gare, hôtel
    note: вокзал est masculin et гостиница est féminin.
    example_gloss:
    - Où se trouve la gare ?
    - Où se trouve l’hôtel ?
  ru.a1.unit09.lesson02.teach.restoran_biblioteka:
    title: ресторан, библиотека
    gloss: restaurant, bibliothèque
    note: ресторан est masculin et библиотека est féminin ; les noms de rues comme Чайковского et Пушкина sont au génitif après улица.
    example_gloss:
    - Où se trouve le restaurant ?
    - Où se trouve la bibliothèque ?
  ru.a1.unit09.lesson03.teach.chto_est_na_vashey_ulitse:
    title: Что есть на вашей улице?
    gloss: Qu’y a-t-il dans votre rue ?
    note: вашей est le possessif de politesse « votre », qui s’accorde avec le nom féminin улице au prépositionnel.
  ru.a1.unit09.lesson03.teach.anna_chto_est:
    title: Anna pose une question sur la rue
    gloss: 'Anna : Qu’y a-t-il dans votre rue ?'
    note: Anna ouvre le dialogue avec Что есть на вашей улице ?
  ru.a1.unit09.lesson03.teach.viktor_na_moey_ulitse:
    title: Viktor énumère trois lieux
    gloss: 'Viktor : Dans ma rue, il y a un magasin, une bibliothèque et une banque.'
    note: На моей улице есть énumère des lieux avec есть (« il y a »), et les éléments sont reliés par и.
  ru.a1.unit09.lesson03.teach.anna_a_gde_bank:
    title: Anna demande où se trouve la banque
    gloss: 'Anna : Et où se trouve la banque ?'
    note: А introduit naturellement la question d’Anna sur l’un des lieux cités par Viktor.
  ru.a1.unit09.lesson03.teach.viktor_bank_na_pushkina:
    title: Viktor indique la rue de la banque
    gloss: 'Viktor : La banque est dans la rue Pouchkine.'
    note: Viktor répond par Банк на улице Пушкина, avec Пушкина au génitif après улице.
  ru.a1.unit09.lesson03.teach.anna_spasibo_bolshoe:
    title: Anna remercie Viktor
    gloss: 'Anna : Merci beaucoup.'
    note: Спасибо большое renforce спасибо avec большое (« grand »), une manière courante de dire « merci beaucoup ».
  ru.a1.unit09.lesson03.teach.viktor_pozhaluysta:
    title: Viktor répond
    gloss: 'Viktor : Je vous en prie.'
    note: Пожалуйста répond à спасибо, comme « je vous en prie ».
