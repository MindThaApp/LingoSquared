teaching:
  ru.a1.unit25.lesson01.teach.chitat_zanimatsya_sportom:
    title: Lire, faire du sport, cuisiner
    gloss: lire, faire de l’exercice / du sport, cuisiner
    note: 'Trois verbes courants de loisirs : *читать* (lire), *заниматься спортом* (faire du sport) et *готовить* (cuisiner).'
    example_gloss:
    - J’aime lire un livre.
    - Je fais du sport le samedi.
    - J’aime cuisiner pour des amis.
  ru.a1.unit25.lesson01.teach.svobodnoe_vremya:
    title: Le temps libre
    gloss: temps libre
    note: '*Свободное время* est l’expression clé pour parler de ses loisirs. L’adjectif *свободное* se termine en *-ое* pour s’accorder avec *время*.'
    example_gloss: Pendant mon temps libre, j’aime lire.
  ru.a1.unit25.lesson01.teach.v_svobodnoe_vremya:
    title: Dire ce que tu fais pendant ton temps libre
    gloss: Pendant mon temps libre, j’aime lire.
    note: '*Люблю* est la forme de *я* du verbe *любить* (aimer). Ensuite, le second verbe reste à l’infinitif : *люблю читать*.'
  ru.a1.unit25.lesson02.teach.slushat_muzyku_risovat:
    title: Musique, dessin, jeux vidéo
    gloss: écouter de la musique, dessiner, jouer aux jeux vidéo
    note: 'Trois autres loisirs : *слушать музыку* (écouter de la musique), *рисовать* (dessiner) et *играть в игры* (jouer aux jeux vidéo).'
    example_gloss:
    - J’aime écouter de la musique.
    - Je dessine souvent.
    - J’aime jouer aux jeux vidéo avec des amis.
  ru.a1.unit25.lesson02.teach.ya_lyublyu_slushat:
    title: Dire que tu aimes écouter de la musique
    gloss: J’aime écouter de la musique.
    note: '*Слушать* se construit avec un complément direct : *музыку* est l’accusatif de *музыка*, avec la terminaison *-у*.'
  ru.a1.unit25.lesson02.teach.ya_lyublyu_igrat:
    title: Dire que tu aimes jouer aux jeux vidéo avec des amis
    gloss: J’aime jouer aux jeux vidéo avec des amis.
    note: '*С друзьями* (avec des amis) : la préposition *с* est suivie de l’instrumental, d’où *друзьями*.'
  ru.a1.unit25.lesson03.teach.vsegda_chasto_inogda:
    title: Toujours, souvent, parfois, jamais
    gloss: toujours, souvent, parfois, jamais
    note: 'Les quatre adverbes de fréquence essentiels : *всегда*, *часто*, *иногда*, *никогда*. Ils ne changent jamais de forme.'
    example_gloss:
    - Je fais toujours du sport le samedi.
    - Je lis souvent un livre.
    - Je dessine parfois.
    - Je ne joue jamais aux jeux vidéo.
  ru.a1.unit25.lesson03.teach.kazhduyu_nedelyu_kazhdye:
    title: Chaque semaine, chaque week-end
    gloss: chaque semaine, chaque week-end
    note: '*Каждую неделю* et *каждые выходные* signifient tous deux « chaque », mais la terminaison suit le nom : voir la carte suivante.'
    example_gloss:
    - Je cuisine pour des amis chaque semaine.
    - Je fais du sport chaque week-end.
  ru.a1.unit25.lesson03.teach.nedelya_zhenskogo_roda:
    title: 'Chaque : féminin et pluriel'
    gloss: '*Неделя* est féminin, donc on dit *каждую неделю*. *Выходные* est pluriel, donc on dit *каждые выходные*.'
    note: '*Каждый* s’accorde avec son nom comme n’importe quel adjectif : *каждый день* (masculin), *каждую неделю* (féminin, accusatif), *каждые выходные* (pluriel).'
  ru.a1.unit25.lesson03.teach.chto_ty_delaesh:
    title: Poser une question sur le temps libre
    gloss: Que fais-tu pendant ton temps libre ?
    note: 'C’est la question centrale de cette unité : réutilise-la pour interroger quelqu’un sur ses loisirs.'
  ru.a1.unit25.lesson04.teach.nastya_my_chasto:
    title: Nastya parle des loisirs
    gloss: 'Nastya : Nous nous promenons souvent ensemble. Et toi, que fais-tu d’autre pendant ton temps libre, Dima ?'
    note: '*Мы часто гуляем вместе* : *мы* (nous) prend la terminaison verbale *-ем*, et *гулять* signifie se promener pour le plaisir.'
  ru.a1.unit25.lesson04.teach.dima_ya_lyublyu:
    title: Les loisirs de Dima
    gloss: 'Dima : J’aime cuisiner, chez moi aussi. Et je fais souvent du sport.'
    note: '*И дома тоже* (chez moi aussi) : *и ... тоже* montre que Dima cuisine pour le plaisir, pas seulement au travail.'
  ru.a1.unit25.lesson04.teach.nastya_ty_i:
    title: Nastya est surprise
    gloss: 'Nastya : Tu cuisines aussi chez toi ? Tu cuisines déjà toute la journée au travail !'
    note: '*Весь день* (toute la journée) souligne combien Dima cuisine déjà au travail. *Весь* s’accorde avec *день*, qui est masculin.'
  ru.a1.unit25.lesson04.teach.dima_da_no:
    title: Dima explique
    gloss: 'Dima : Oui, mais cuisiner me détend. Et toi, qu’est-ce que tu aimes faire ?'
    note: '*Готовить меня расслабляет* place l’activité en premier : littéralement « cuisiner me détend », avec *меня* à l’accusatif.'
  ru.a1.unit25.lesson04.teach.nastya_ya_lyublyu:
    title: Les loisirs de Nastya
    gloss: 'Nastya : J’aime lire et j’écoute souvent de la musique.'
    note: 'Deux verbes de loisirs vus dans les leçons précédentes sont reliés par *и* (et) : *люблю читать и часто слушаю музыку*.'
  ru.a1.unit25.lesson04.teach.dima_ty_tozhe:
    title: Dima demande si elle joue aux jeux vidéo
    gloss: 'Dima : Tu joues aussi aux jeux vidéo ?'
    note: 'Une courte question fermée : en russe, l’ordre des mots ne change pas, seule l’intonation monte : *Ты тоже играешь в игры?*'
  ru.a1.unit25.lesson04.teach.nastya_net_ya:
    title: Nastya répond
    gloss: 'Nastya : Non, je ne joue jamais aux jeux vidéo. En revanche, je dessine parfois !'
    note: '*Никогда не* (ne ... jamais) demande un *не* devant le verbe. *Иногда* (parfois) crée le contraste.'
  ru.a1.unit25.lesson05.teach.my_s_dimoy:
    title: Comparer des loisirs
    gloss: Dima et moi, nous nous promenons souvent ensemble. Mais nous avons aussi d’autres loisirs. Dima aime cuisiner, chez lui aussi, et il fait souvent du sport. J’aime lire et j’écoute souvent de la musique. Je dessine parfois, mais je ne joue jamais aux jeux vidéo. Qu’est-ce que tu aimes faire pendant ton temps libre ?
    note: Le message de Nastya reprend des éléments de la leçon 4 et se termine par la question centrale de l’unité adressée au lecteur.
    glosses:
      гуляем: se promener
      часто: souvent
      вместе: ensemble
      другие: autre
      готовить: cuisine
      любит: aime
      дома: à la maison
      занимается: fait du sport
      читать: lire
      слушаю: écouter
      музыку: musique
      рисую: dessiner
      иногда: parfois
      играю: jouer aux jeux vidéo
      никогда: jamais
      свободное: libre
      время: temps
  ru.a1.unit25.lesson06.teach.dima_chto_ty:
    title: Dima demande ce qu’elle fait ce week-end
    gloss: 'Dima : Qu’est-ce que tu fais ce week-end ?'
    note: '*В эти выходные* (ce week-end) : *выходные* est au pluriel, donc *эти* aussi, et *в* avec une indication de temps demande l’accusatif.'
  ru.a1.unit25.lesson06.teach.nastya_poka_ne:
    title: Nastya hésite
    gloss: 'Nastya : Je ne sais pas encore. J’aime lire, mais je veux aussi sortir.'
    note: '*Хочу ещё выйти на улицу* signifie « je veux aussi sortir ». *Хочу* est la forme de *я* du verbe *хотеть*.'
  ru.a1.unit25.lesson06.teach.dima_davay_pogulyaem:
    title: Dima propose un programme
    gloss: 'Dima : Et si on se promenait ensemble ? Après, je nous préparerai à manger.'
    note: '*Давай погуляем* est la manière habituelle de proposer de faire quelque chose ensemble, et *потом* (après) place l’étape suivante dans l’ordre.'
  ru.a1.unit25.lesson06.teach.nastya_khoroshaya_ideya:
    title: Nastya accepte
    gloss: 'Nastya : Bonne idée ! J’aime autant me promener que cuisiner.'
    note: '*Мне нравится* signifie littéralement « est agréable à moi » : la personne est au datif (*мне*) et la chose aimée suit.'
  ru.a1.unit25.lesson06.teach.dima_otlichno_togda:
    title: Dima confirme
    gloss: 'Dima : Parfait. Alors à samedi !'
    note: '*Увидимся в субботу* (à samedi) : *в* avec un jour de la semaine demande l’accusatif, donc *суббота* devient *субботу*.'
