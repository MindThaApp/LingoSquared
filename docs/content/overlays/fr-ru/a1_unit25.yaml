course:
  title: Russe A1
  description: 'Russe pour débutants afin de parler de ses loisirs : vocabulaire des passe-temps, expressions de fréquence, demander et dire ce qu’on fait pendant son temps libre, et comparer les loisirs de deux personnes.'
units:
