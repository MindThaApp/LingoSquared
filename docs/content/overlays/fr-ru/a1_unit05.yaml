teaching:
  ru.a1.unit05.lesson01.teach.kotoryy_chas:
    title: Который час?
    gloss: Quelle heure est-il ?
    note: 'La façon standard de demander l’heure, littéralement « quelle heure ». '
  ru.a1.unit05.lesson01.teach.seychas_chas:
    title: Сейчас час.
    gloss: Il est une heure maintenant.
    note: '« Час » seul signifie « une heure » : en russe, on ne dit pas « один час » ici, contrairement au schéma des numéraux à partir de 2.'
    example_gloss: Quelle heure est-il ? — Il est une heure.
  ru.a1.unit05.lesson01.teach.dva_tri_chasa:
    title: два часа, три часа
    gloss: deux heures, trois heures
    note: 'Après два et три, час se met au génitif singulier : часа, comme dans le schéma numéral-nom de l’unité 3.'
    example_gloss:
    - Il est deux heures maintenant.
    - Il est trois heures maintenant.
  ru.a1.unit05.lesson01.teach.pyat_desyat_chasov:
    title: пять часов, десять часов
    gloss: cinq heures, dix heures
    note: À partir de пять, час passe au génitif pluriel часов, là encore comme dans le schéma « 5 et plus » de l’unité 3.
    example_gloss:
    - Il est cinq heures maintenant.
    - Il est dix heures maintenant.
  ru.a1.unit05.lesson02.teach.v_kotorom_chasu:
    title: В котором часу?
    gloss: À quelle heure ?
    note: Sert à demander quand quelque chose a lieu, à la différence de Который час? qui demande seulement l’heure actuelle.
  ru.a1.unit05.lesson02.teach.utrom_dnem:
    title: утром, днём
    gloss: le matin, dans la journée
    note: Ce sont des adverbes (formes d’instrumental) de утро et день, employés sans préposition.
    example_gloss:
    - Le matin, je bois du café.
    - Dans la journée, je travaille.
  ru.a1.unit05.lesson02.teach.vecherom_nochyu:
    title: вечером, ночью
    gloss: le soir, la nuit
    note: Même formation d’adverbe à l’instrumental que утром/днём.
    example_gloss:
    - Le soir, je suis à la maison.
    - La nuit, je dors.
  ru.a1.unit05.lesson02.teach.v_dva_chasa_dnya:
    title: В два часа дня.
    gloss: À deux heures de l’après-midi.
    note: дня (génitif de день), ajouté après l’heure, précise qu’il s’agit de deux heures de l’après-midi et non de deux heures du matin.
    example_gloss: À quelle heure est la réunion ? — À deux heures de l’après-midi.
  ru.a1.unit05.lesson02.teach.v_sem_chasov_vechera:
    title: В семь часов вечера.
    gloss: À sept heures du soir.
    note: вечера (génitif de вечер) précise que ces sept heures sont celles du soir.
    example_gloss: Le magasin ferme à sept heures du soir.
  ru.a1.unit05.lesson03.teach.skazhite_pozhaluysta:
    title: Скажите, пожалуйста, который час?
    gloss: Excusez-moi, pourriez-vous me dire l’heure ?
    note: Скажите, пожалуйста adoucit la question ; c’est approprié pour s’adresser à un inconnu.
  ru.a1.unit05.lesson03.teach.kogda_otkhodit:
    title: Когда отходит поезд?
    gloss: Quand part le train ?
    note: Отходит (« part ») est le verbe habituel pour un train ou un bus qui quitte la gare.
  ru.a1.unit05.lesson03.teach.passazhir_vopros:
    title: Le passager demande l’heure
    gloss: 'Passager : Excusez-moi, pourriez-vous me dire l’heure ?'
    note: Le passager commence poliment par Скажите, пожалуйста, ce qui convient pour s’adresser au personnel de la gare.
  ru.a1.unit05.lesson03.teach.kassir_sem:
    title: L’employé répond
    gloss: 'Employé : Il est sept heures du matin.'
    note: Сейчас семь часов утра indique l’heure actuelle, avec утра (« du matin ») pour plus de clarté.
  ru.a1.unit05.lesson03.teach.passazhir_kogda:
    title: Le passager interroge sur le train
    gloss: 'Passager : Et quand part le train ?'
    note: А introduit en douceur la question suivante du passager.
  ru.a1.unit05.lesson03.teach.kassir_vosem:
    title: L’employé donne l’heure de départ
    gloss: 'Employé : À huit heures du matin.'
    note: В восемь часов утра répond avec la préposition в suivie de l’heure et du moment de la journée.
