course:
  title: Russe A1
  description: Apprends le russe de niveau A1 pour les salutations du quotidien et les courts échanges sociaux, avec des explications détaillées sur l’alphabet cyrillique et sur la distinction de politesse вы/ты.
units:
  ru.a1.unit05.time:
    title: Quelle heure est-il ?
