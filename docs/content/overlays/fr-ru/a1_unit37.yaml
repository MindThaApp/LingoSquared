    title: Nina découvre la personnalité de chacun
    gloss: Nina est nouvelle au café des langues. Elle demande à Dima comment sont les autres. Dima lui raconte. Nastya est gentille et patiente ; elle travaille comme infirmière. Igor est drôle et suit des cours d’espagnol. Lena est curieuse ; elle aime découvrir de nouvelles choses. Dima lui-même est calme.
    note: Ce texte récapitule les traits de caractère des membres du groupe en les comparant.
