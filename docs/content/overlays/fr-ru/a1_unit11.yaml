teaching:
  ru.a1.unit11.lesson01.teach.vstayu:
    title: встаю
    gloss: je me lève
    note: встаю est la première personne du singulier de вставать (« se lever ») ; встаёте est la forme en вы pour poser la question à quelqu’un.
    example_gloss: Je me lève à sept heures.
  ru.a1.unit11.lesson01.teach.zavtrakayu:
    title: завтракаю
    gloss: je prends le petit-déjeuner
    note: завтракаю est la première personne du singulier de завтракать (« prendre le petit-déjeuner »).
    example_gloss: Je prends le petit-déjeuner à huit heures.
  ru.a1.unit11.lesson01.teach.kogda:
    title: Когда вы встаёте?
    gloss: À quelle heure vous levez-vous ?
    note: Когда signifie « quand » ; вы est le « vous » de politesse ou du pluriel.
  ru.a1.unit11.lesson02.teach.rabotayu:
    title: работаю
    gloss: je travaille
    note: работаю est la première personne du singulier de работать (« travailler ») ; с ... до ... signifie « de ... à ... » pour une plage horaire.
    example_gloss: Je travaille de neuf heures à cinq heures.
  ru.a1.unit11.lesson02.teach.uzhinayu:
    title: ужинаю
    gloss: je dîne
    note: ужинаю est la première personne du singulier de ужинать (« dîner ») ; вечером signifie « le soir ».
    example_gloss: Le soir, je dîne.
  ru.a1.unit11.lesson02.teach.lozhus_spat:
    title: ложусь спать
    gloss: je me couche
    note: ложусь спать est une expression pronominale (littéralement « je m’allonge pour dormir ») qui signifie « aller se coucher ».
    example_gloss: Je me couche à onze heures.
  ru.a1.unit11.lesson03.teach.oleg_chto_delayete:
    title: Oleg interroge Maria sur son matin
    gloss: 'Oleg : Que faites-vous le matin ?'
    note: Олег commence par Что вы делаете утром?
  ru.a1.unit11.lesson03.teach.mariya_vstayu_zavtrakayu:
    title: Maria décrit son matin
    gloss: 'Maria : Je me lève à sept heures, puis je prends le petit-déjeuner à huit heures.'
    note: Мария énumère deux actions successives, reliées par потом (« puis »).
  ru.a1.unit11.lesson03.teach.oleg_kogda_rabotayete:
    title: Oleg demande ses horaires de travail
    gloss: 'Oleg : Et quand travaillez-vous ?'
    note: А introduit tout naturellement la question suivante d’Oleg.
  ru.a1.unit11.lesson03.teach.mariya_rabotayu_uzhinayu:
    title: Maria décrit le reste de sa journée
    gloss: 'Maria : Je travaille de neuf heures à cinq heures. Le soir, je dîne et je me couche à onze heures.'
    note: Мария répond d’abord avec ses horaires de travail, puis avec sa routine du soir.
  ru.a1.unit11.lesson03.teach.oleg_ponyatno:
    title: Oleg montre qu’il a compris
    gloss: 'Oleg : Je vois, merci.'
    note: Понятно, спасибо conclut l’échange.
