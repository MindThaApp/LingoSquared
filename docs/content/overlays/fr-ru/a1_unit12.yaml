teaching:
  ru.a1.unit12.lesson01.teach.davay:
    title: Давай пойдём...
    gloss: Allons…
    note: Давай est un marqueur de proposition informel (« allons », « et si on… ») ; пойдём est la forme de « nous » au futur du verbe « aller » ; ensemble, ils servent à proposer une activité.
  ru.a1.unit12.lesson01.teach.kino:
    title: кино
    gloss: le cinéma
    note: кино est un nom neutre indéclinable qui signifie « cinéma ».
    example_gloss: Allons au cinéma.
  ru.a1.unit12.lesson01.teach.zavtra_subbotu:
    title: завтра, в субботу
    gloss: demain, samedi
    note: завтра signifie « demain » ; в субботу emploie в + accusatif pour un jour de la semaine.
    example_gloss: Allons au cinéma demain.
  ru.a1.unit12.lesson02.teach.soglasen:
    title: Хорошо, я согласен.
    gloss: D’accord, je suis d’accord.
    note: согласен (« d’accord ») est employé par un homme ; une femme dirait согласна.
  ru.a1.unit12.lesson02.teach.ne_mogu:
    title: К сожалению, я не могу.
    gloss: Malheureusement, je ne peux pas.
    note: К сожалению (« malheureusement ») adoucit un refus ; не могу signifie « je ne peux pas ».
  ru.a1.unit12.lesson02.teach.vo_skolko:
    title: Во сколько мы встретимся?
    gloss: À quelle heure se retrouve-t-on ?
    note: Во сколько demande l’heure ; встретимся est la forme de « nous » au futur du verbe « se retrouver ».
    example_gloss: Disons sept heures.
  ru.a1.unit12.lesson03.teach.nastya_davay_poydyom:
    title: Nastya propose un projet
    gloss: 'Nastya : Allons au cinéma samedi.'
    note: Настя commence par Давай пойдём в кино в субботу.
  ru.a1.unit12.lesson03.teach.dima_horosho_soglasen:
    title: Dima accepte et demande l’heure
    gloss: 'Dima : D’accord, je suis d’accord. À quelle heure on se retrouve ?'
    note: Дима accepte, puis demande Во сколько мы встретимся?
  ru.a1.unit12.lesson03.teach.nastya_davay_v_sem:
    title: Nastia propose une heure et un lieu
    gloss: 'Nastia : Disons sept heures, devant le cinéma.'
    note: у кинотеатра signifie « près du cinéma / devant le cinéma » ; on emploie у + le génitif.
  ru.a1.unit12.lesson03.teach.dima_otlichno:
    title: Dima confirme
    gloss: 'Dima : Parfait, à samedi.'
    note: Отлично, до субботы conclut l’échange ; до субботы signifie littéralement « jusqu’à samedi ».
