teaching:
  ru.a1.unit13.lesson01.teach.vchera_byl:
    title: Вчера я был дома.
    gloss: Hier, j'étais à la maison.
    note: вчера signifie « hier » ; был est le passé masculin de « être », utilisé par un homme.
  ru.a1.unit13.lesson01.teach.byla:
    title: была
    gloss: était (dit par une femme)
    note: была est le passé féminin de « être » ; le verbe s'accorde avec le genre du sujet.
    example_gloss: Hier, elle était à la maison.
  ru.a1.unit13.lesson01.teach.vecherom:
    title: вечером
    gloss: le soir
    note: вечером signifie « le soir » ; on l'emploie pour préciser quand un événement passé a eu lieu.
    example_gloss: Hier soir, j'étais à la maison.
  ru.a1.unit13.lesson02.teach.hodil_v_kino:
    title: Вчера я ходил в кино.
    gloss: Hier, je suis allé au cinéma.
    note: ходил (masculin) est le passé de « aller (à pied) » ; il s'emploie pour un aller-retour accompli.
  ru.a1.unit13.lesson02.teach.hodila:
    title: ходила
    gloss: est allée (dit par une femme)
    note: ходила est la forme féminine du passé de « aller (à pied) ».
    example_gloss: Hier, elle est allée au cinéma.
  ru.a1.unit13.lesson02.teach.smotrel_film:
    title: смотрел фильм
    gloss: a regardé un film
    note: смотрел (masculin) / смотрела (féminin) est le passé de « regarder » ; фильм signifie « film ».
    example_gloss: J'ai regardé un film.
  ru.a1.unit13.lesson03.teach.nastya_chto_ty_delal:
    title: Nastya demande ce qu'a fait Dima
    gloss: 'Nastya : Qu''est-ce que tu as fait hier ?'
    note: Настя ouvre la conversation avec Что ты делал вчера?
  ru.a1.unit13.lesson03.teach.dima_hodil_smotrel:
    title: Dima répond et renvoie la question
    gloss: 'Dima : Je suis allé au cinéma. J''ai regardé un bon film. Et toi ?'
    note: Дима répond Я ходил в кино. Смотрел хороший фильм. А ты?
  ru.a1.unit13.lesson03.teach.nastya_byla_otdyhala:
    title: Nastya répond
    gloss: 'Nastya : J''étais à la maison. Je me suis reposée.'
    note: Настя conclut avec Я была дома. Отдыхала.
