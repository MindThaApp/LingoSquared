teaching:
  ru.a1.unit06.lesson01.teach.u_menya_est:
    title: У меня есть ...
    gloss: J’ai ...
    note: 'Littéralement « chez moi (il y a)... » : c’est la façon habituelle de dire « j’ai » en russe. À l’unité 3, У меня два брата utilisait déjà la structure У меня ; on omet souvent есть quand on indique combien on en a.'
  ru.a1.unit06.lesson01.teach.eto:
    title: Это ...
    gloss: Voici ... / C’est ...
    note: Это sert à présenter ou à désigner une personne ou une chose, quel que soit son genre grammatical.
  ru.a1.unit06.lesson01.teach.mat_otets:
    title: мать, отец
    gloss: mère, père
    note: мать fait partie du petit groupe de noms féminins russes qui se terminent par un signe mou (-ь).
    example_gloss:
    - C’est ma mère.
    - C’est mon père.
  ru.a1.unit06.lesson01.teach.brat_sestra:
    title: брат, сестра
    gloss: frère, sœur
    note: брат est le mot avec lequel tu as déjà compté à l’unité 3 (« У меня два брата ») ; сестра en est le féminin.
    example_gloss:
    - C’est mon frère.
    - J’ai une sœur.
  ru.a1.unit06.lesson01.teach.moy_moya:
    title: мой, моя
    gloss: mon (masculin), ma (féminin)
    note: мой s’emploie avec les noms masculins comme отец et брат ; моя avec les noms féminins comme мать et сестра.
  ru.a1.unit06.lesson02.teach.babushka_dedushka:
    title: бабушка, дедушка
    gloss: grand-mère, grand-père
    note: 'Les deux se terminent par -а, mais дедушка désigne un homme et s’accorde au masculin : мой дедушка, mais моя бабушка.'
    example_gloss:
    - C’est ma grand-mère.
    - C’est mon grand-père.
  ru.a1.unit06.lesson02.teach.muzh_zhena:
    title: муж, жена
    gloss: mari, femme
    note: муж est masculin et жена est féminin, selon la règle habituelle des terminaisons.
    example_gloss:
    - Voici mon mari.
    - Voici ma femme.
  ru.a1.unit06.lesson02.teach.syn_doch:
    title: сын, дочь
    gloss: fils, fille
    note: дочь, comme мать, est un nom féminin terminé par un signe mou (-ь).
    example_gloss: J’ai un fils et une fille.
  ru.a1.unit06.lesson02.teach.deti:
    title: дети
    gloss: enfants
    note: 'дети est le pluriel irrégulier de ребёнок (« enfant ») : le singulier et le pluriel sont deux mots complètement différents.'
    example_gloss: Avez-vous des enfants ?
  ru.a1.unit06.lesson02.teach.u_vas_est:
    title: У вас есть ...?
    gloss: Avez-vous ... ? (forme de politesse)
    note: Emploie вас, la forme de politesse, comme le registre вы vu à l’unité 2.
  ru.a1.unit06.lesson03.teach.kto_eto:
    title: Кто это?
    gloss: Qui est-ce ?
    note: La façon habituelle de demander qui est quelqu’un, par exemple en regardant une photo.
  ru.a1.unit06.lesson03.teach.eyo_zovut:
    title: Её зовут Анна.
    gloss: Elle s’appelle Anna.
    note: 'Littéralement « on l’appelle Anna » : Её (« la ») est le complément du verbe зовут, pas le sujet.'
  ru.a1.unit06.lesson03.teach.maksim_kto_eto:
    title: Maksim interroge sur la photo
    gloss: 'Maksim : Qui est-ce sur la photo ?'
    note: Maksim commence en montrant la photo et demande Кто это на фото?
  ru.a1.unit06.lesson03.teach.olga_moya_semya:
    title: Olga présente sa famille
    gloss: 'Olga : C’est ma famille.'
    note: Это моя семья contient семья (« famille »), un nom féminin ; моя s’accorde donc avec lui.
  ru.a1.unit06.lesson03.teach.olga_vot_otets:
    title: Olga nomme trois membres de sa famille
    gloss: 'Olga : Voici mon père, ma mère et mon frère.'
    note: Вот (« voici ») introduit l’énumération ; chaque possessif (мой/моя) s’accorde avec le nom qui le suit.
  ru.a1.unit06.lesson03.teach.maksim_a_kto_devochka:
    title: Maksim interroge sur la fillette
    gloss: 'Maksim : Et qui est cette petite fille ?'
    note: А introduit naturellement la nouvelle question de Maksim sur une quatrième personne de la photo.
  ru.a1.unit06.lesson03.teach.olga_eto_moya_doch:
    title: Olga dit le nom de sa fille
    gloss: 'Olga : C’est ma fille. Elle s’appelle Anna.'
    note: Olga répond par моя дочь, puis donne le prénom avec Её зовут Анна.
