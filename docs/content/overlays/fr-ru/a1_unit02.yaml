teaching:
  ru.a1.unit02.lesson01.teach.kak_vas_zovut:
    title: Как вас зовут?, Как тебя зовут?
    gloss: Comment vous appelez-vous ? (formel) ; Comment tu t'appelles ? (informel)
    note: Как вас зовут? emploie le вас formel et s'utilise avec des inconnus ou dans un cadre poli. Как тебя зовут? emploie le тебя informel, utilisé avec des amis, des enfants et des personnes de même âge.
    example_gloss:
    - Bonjour ! Comment vous appelez-vous ?
    - Salut ! Comment tu t'appelles ?
  ru.a1.unit02.lesson01.teach.menya_zovut:
    title: Меня зовут Виктор.
    gloss: Je m'appelle Viktor.
    note: Меня зовут (littéralement « on m'appelle ») est la façon habituelle de donner son nom en russe, quel que soit le registre.
  ru.a1.unit02.lesson01.teach.menya_zovut_anna:
    title: Меня зовут Анна.
    gloss: Je m'appelle Anna.
    note: 'Le même schéma, Меня зовут ..., avec un autre prénom : cette phrase ne change pas selon le genre de la personne qui parle.'
  ru.a1.unit02.lesson01.teach.register_note:
    title: Choisir la bonne question
    gloss: Как вас зовут? est poli ou pour les inconnus. Как тебя зовут? est pour les amis, les enfants et les personnes de même âge.
    note: 'La distinction formel/informel reflète ici l''opposition вы/ты, expliquée en détail dans la leçon 2 : вас et тебя sont les formes de вы et de ты au cas de l''objet.'
  ru.a1.unit02.lesson02.teach.vy_ty:
    title: вы, ты
    gloss: vous (formel) ; tu (informel)
    note: 'Comme en français, le russe distingue vouvoiement et tutoiement : вы s''emploie avec des inconnus, des personnes plus âgées et dans un cadre professionnel ; ты avec des amis, la famille et les enfants.'
    example_gloss:
    - D'où venez-vous ? (formel)
    - D'où viens-tu ? (informel)
  ru.a1.unit02.lesson02.teach.vy_ty_rule:
    title: Quand utiliser chacun
    gloss: 'Вы est formel : avec des inconnus, au travail, avec des personnes plus âgées. Ты est informel : avec des amis, la famille, des enfants.'
    note: 'Employer ты avec quelqu''un qui attend вы peut paraître trop familier, voire impoli : en cas de doute, commence par вы.'
  ru.a1.unit02.lesson02.teach.mozhno_na_ty:
    title: Можно на ты?
    gloss: On peut se tutoyer (passer à ты) ?
    note: Une façon polie de proposer de passer du вы formel au ты informel, quand la relation est devenue assez amicale.
  ru.a1.unit02.lesson02.teach.davayte_pereydyom:
    title: Давайте перейдём на ты.
    gloss: Passons au ty (tutoiement).
    note: Une façon un peu plus directe et engageante de proposer le même changement de registre que Можно на ты ?
  ru.a1.unit02.lesson02.teach.otkuda_vy:
    title: Откуда вы?
    gloss: D’où venez-vous ? (forme de politesse)
    note: Emploie le вы formel, adapté à une première rencontre ou à un contexte professionnel.
  ru.a1.unit02.lesson02.teach.otkuda_ty:
    title: Откуда ты?
    gloss: D’où viens-tu ? (forme familière)
    note: Le pendant informel, utilisé avec quelqu'un que tu connais déjà bien.
  ru.a1.unit02.lesson02.teach.ya_iz_kanady:
    title: Я из Канады.
    gloss: 'Из (« de ») est suivi du génitif, donc Канада devient Канады ici : ce génitif d''origine est à remarquer, même si la grammaire des cas viendra plus tard.'
    note: 'Из (« de », « en provenance de ») se construit avec le génitif : ici, Канада devient Канады. Ce schéma du génitif d’origine mérite d’être remarqué, même si la grammaire complète des cas viendra plus tard.'
  ru.a1.unit02.lesson02.teach.ya_iz_moskvy:
    title: Я из Москвы.
    gloss: Je viens de Moscou.
    note: 'Même génitif d''origine que dans Я из Канады : Москва devient Москвы après из.'
  ru.a1.unit02.lesson03.teach.davayte_poznakomimsya:
    title: Давайте познакомимся.
    gloss: Faisons connaissance.
    note: Une façon polie et courante d'entamer une présentation entre personnes qui se rencontrent pour la première fois.
  ru.a1.unit02.lesson03.teach.ochen_priyatno:
    title: Очень приятно
    gloss: enchanté(e)
    note: Une réponse polie et habituelle juste après que quelqu'un a donné son nom.
    example_gloss: Je m'appelle John. — Enchanté.
  ru.a1.unit02.lesson03.teach.irina_greeting:
    title: Irina Petrovna ouvre la présentation
    gloss: 'Irina Petrovna dit : Bonjour ! Faisons connaissance. Je m''appelle Irina Petrovna.'
    note: 'Irina Petrovna rencontre John pour la première fois dans un bureau, un cadre formel : elle emploie donc le poli Здравствуйте et le registre du вы tout du long.'
  ru.a1.unit02.lesson03.teach.john_reply:
    title: John répond en donnant son nom
    gloss: 'John dit : Enchanté. Je m''appelle John.'
    note: John s'aligne sur le registre formel et poli d'Irina Petrovna avec Очень приятно.
  ru.a1.unit02.lesson03.teach.irina_question:
    title: Irina Petrovna demande d'où vient John
    gloss: 'Irina Petrovna demande : D''où venez-vous, John ?'
    note: Elle emploie le Откуда вы formel, en accord avec le cadre du bureau.
  ru.a1.unit02.lesson03.teach.john_answer:
    title: John répond et pose la question à son tour
    gloss: 'John dit : Je viens du Canada. Et vous, d''où venez-vous ?'
    note: John indique son origine et renvoie poliment la question avec А вы откуда ?
  ru.a1.unit02.lesson03.teach.irina_answer:
    title: Irina Petrovna répond
    gloss: 'Irina Petrovna dit : Je viens de Moscou.'
    note: Elle termine l'échange en reprenant le génitif d'origine vu dans la leçon 2.
