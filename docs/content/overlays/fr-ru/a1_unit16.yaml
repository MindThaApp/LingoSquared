teaching:
  ru.a1.unit16.lesson01.teach.u_menya_bolit_golova:
    title: У меня болит голова.
    gloss: J’ai mal à la tête.
    note: у меня signifie « j’ai » (littéralement « chez moi ») ; болит signifie « fait mal » et s’accorde avec un sujet au singulier comme голова (tête).
  ru.a1.unit16.lesson01.teach.zhivot:
    title: живот
    gloss: ventre
    note: живот signifie « ventre / estomac ». Utilise la même structure у меня болит... avec n’importe quelle partie du corps.
    example_gloss: J’ai mal au ventre.
  ru.a1.unit16.lesson01.teach.gorlo:
    title: горло
    gloss: gorge
    note: горло signifie « gorge ».
    example_gloss: J’ai mal à la gorge.
  ru.a1.unit16.lesson02.teach.u_menya_temperatura:
    title: У меня температура.
    gloss: J’ai de la fièvre.
    note: температура signifie littéralement « température », mais c’est la façon habituelle de dire « de la fièvre » en russe.
  ru.a1.unit16.lesson02.teach.prostuda:
    title: простуда
    gloss: un rhume
    note: простуда signifie « un rhume » (la maladie). Dis у меня простуда pour dire « j’ai un rhume ».
    example_gloss: Je suis enrhumé.
  ru.a1.unit16.lesson02.teach.mne_ploho:
    title: Мне плохо.
    gloss: Je me sens mal.
    note: Мне плохо est une façon générale de dire que tu ne te sens pas bien, sans nommer de symptôme précis.
  ru.a1.unit16.lesson03.teach.dima_zdravstvuyte_bolit:
    title: Dima salue le médecin
    gloss: 'Dima : Bonjour ! J’ai mal à la tête et à la gorge.'
    note: Дима commence par le Здравствуйте! formel, car le médecin est un inconnu.
  ru.a1.unit16.lesson03.teach.doktor_chto_u_vas_bolit:
    title: Le médecin demande ce qui fait mal
    gloss: 'Le médecin : Qu’est-ce qui vous fait mal ? La tête et la gorge ?'
    note: Le médecin utilise вас (« vous », forme de politesse / pluriel) et non тебя, la forme familière.
  ru.a1.unit16.lesson03.teach.dima_da_i_eshchyo_temperatura:
    title: Dima ajoute un autre symptôme
    gloss: 'Dima : Oui, et aussi de la fièvre.'
    note: ещё signifie « aussi / en plus » — и ещё... ajoute un élément à ce que tu viens de dire.
  ru.a1.unit16.lesson03.teach.doktor_vam_nuzhno_otdyhat:
    title: Le médecin donne des conseils
    gloss: 'Le médecin : Vous devez vous reposer et boire beaucoup d’eau.'
    note: Вам нужно + infinitif signifie « vous devez... » ; вам est le datif de politesse « vous ».
