course:
  title: Russe A1
  description: Apprends le russe de niveau A1 pour énoncer un problème de santé simple, comprendre des conseils immédiats simples et tenir un court échange chez le médecin, avec des explications détaillées en français sur le vocabulaire, les expressions et les dialogues.
