    title: 'Dialogue : quel café est le meilleur ?'
teaching:
  ru.a1.unit15.lesson01.teach.kofe_luchshe_chem_chay:
    title: Кофе лучше, чем чай.
    gloss: Le café est meilleur que le thé.
    note: лучше (« meilleur », « mieux ») avec чем (« que ») forme le comparatif de base.
  ru.a1.unit15.lesson01.teach.huzhe:
    title: хуже
    gloss: moins bon / pire
    note: хуже (« pire », « moins bon ») est le comparatif opposé de лучше et s’emploie de la même façon avec чем.
    example_gloss: Le thé est moins bon que le café.
  ru.a1.unit15.lesson01.teach.kakoy:
    title: какой / какое
    gloss: quel / quelle sorte de
    note: какой (masculin) et какое (neutre) servent à demander lequel de deux éléments ; ils s’accordent en genre avec le nom.
    example_gloss: Quel café est meilleur ?
  ru.a1.unit15.lesson02.teach.eto_kafe_bolshe:
    title: Это кафе больше, чем то.
    gloss: Ce café est plus grand que celui-là.
    note: больше (« plus grand », « plus ») avec чем forme un comparatif de taille ; это/то (« ce… -ci / ce… -là ») désignent les deux cafés.
  ru.a1.unit15.lesson02.teach.menshe:
    title: меньше
    gloss: plus petit / moins
    note: меньше (« plus petit », « moins ») est le comparatif opposé de больше.
    example_gloss: Ce café-là est plus petit que celui-ci.
  ru.a1.unit15.lesson02.teach.dom:
    title: дом
    gloss: maison
    note: дом (« maison ») avec этот/тот (« ce… -ci / ce… -là ») permet de comparer la taille de deux maisons.
    example_gloss: Cette maison est plus grande que celle-là.
  ru.a1.unit15.lesson03.teach.nastya_kakoye_kafe_luchshe:
    title: Nastya demande quel café est le meilleur
    gloss: 'Nastya : Quel café est le meilleur ?'
    note: Настя commence par Какое кафе лучше?
  ru.a1.unit15.lesson03.teach.dima_eto_kafe_luchshe:
    title: Dima répond
    gloss: 'Dima : Ce café est meilleur que celui-là.'
    note: Дима répond Это кафе лучше, чем то.
  ru.a1.unit15.lesson03.teach.nastya_a_bolshe:
    title: Nastya pose une question sur la taille, Dima confirme
    gloss: 'Nastya : Et ce café, il est plus grand ? Dima : Oui, ce café est plus grand que celui-là.'
    note: Настя demande А это кафе больше ?, et Дима confirme Да, это кафе больше, чем то.
