course:
  title: Russe A1
  description: Apprends le russe de niveau A1 pour faire des comparaisons simples entre deux choses familières, avec des explications détaillées en français sur le vocabulaire, les expressions et les dialogues.
units:
  ru.a1.unit15.comparisons:
    title: Le café est meilleur que le thé
