teaching:
  de.a1.unit11.lesson01.teach.aufstehen:
    title: aufstehen
    gloss: a se scula
    note: '*aufstehen* este verb separabil: în *Ich stehe ... auf*, *auf* trece la sfârșit.'
    example_gloss: 'În context: Mă scol la ora șapte.'
  de.a1.unit11.lesson01.teach.fruehstuecken:
    title: frühstücken
    gloss: a lua micul dejun
    note: '*frühstücken* este un verb regulat care înseamnă a lua micul dejun.'
    example_gloss: Când luați micul dejun?
  de.a1.unit11.lesson01.teach.arbeiten:
    title: arbeiten
    gloss: a lucra
    note: '*arbeiten* primește terminația obișnuită pentru *ich*: *ich arbeite*.'
    example_gloss: 'În context: Lucrez după-amiaza.'
  de.a1.unit11.lesson01.teach.lernen:
    title: lernen
    gloss: a învăța / a studia
    note: '*lernen* poate însemna și a studia, când complementul este o disciplină, de exemplu germana.'
    example_gloss: 'În context: Seara învăț germana.'
  de.a1.unit11.lesson01.teach.schlafen:
    title: schlafen gehen
    gloss: a merge la culcare
    note: '*schlafen gehen* descrie momentul în care te culci pentru noapte.'
    example_gloss: 'În context: Mă culc la ora zece.'
  de.a1.unit11.lesson01.teach.dann:
    title: Dann frühstücke ich.
    gloss: Apoi iau micul dejun.
    note: 'După *dann*, verbul urmează imediat, pe locul al doilea, înaintea subiectului: *Dann frühstücke ich*, nu *Dann ich frühstücke*.'
  de.a1.unit11.lesson02.teach.wann_stehen_sie_auf:
    title: Wann stehen Sie auf?
    gloss: Când vă sculați?
    note: Întrebare formală cu *Sie*; particula separabilă *auf* rămâne la sfârșit.
  de.a1.unit11.lesson02.teach.ich_stehe_auf:
    title: Ich stehe um sieben Uhr auf.
    gloss: Mă scol la ora șapte.
    note: '*um* indică ora.'
  de.a1.unit11.lesson02.teach.am_nachmittag:
    title: am Nachmittag
    gloss: după-amiaza
    note: '*am* se folosește cu părțile zilei, ca în *am Nachmittag* și *am Abend*.'
    example_gloss: 'În context: Lucrez după-amiaza.'
  de.a1.unit11.lesson02.teach.routine_text:
    title: Annas Tag
    gloss: Ziua Annei
    note: Un text scurt despre rutină leagă activitățile de ore.
    example_gloss: 'În context: Seara ea învață germana.'
  de.a1.unit11.lesson02.teach.line01:
    title: Felix întreabă despre rutină
    gloss: 'Felix: Când vă sculați?'
    note: Felix o întreabă pe Anna despre rutina ei, folosind forma de politețe.
  de.a1.unit11.lesson02.teach.line02:
    title: Anna își descrie dimineața
    gloss: 'Anna: Mă scol la ora șapte. Apoi iau micul dejun.'
    note: Două acțiuni din rutină, în ordine.
    example_gloss: 'În context: Mă scol la ora șapte.'
  de.a1.unit11.lesson02.teach.line03:
    title: Felix întreabă despre muncă
    gloss: 'Felix: Lucrați astăzi?'
    note: '*Sie* de politețe cu forma verbală *arbeiten*.'
  de.a1.unit11.lesson02.teach.line04:
    title: Anna descrie restul zilei
    gloss: 'Anna: Da, după-amiaza lucrez la cafenea. Seara învăț germana, iar la ora zece mă culc.'
    note: O rutină poate fi descrisă prin mai multe propoziții scurte legate între ele.
    example_gloss: 'În context: Da, după-amiaza lucrez la cafenea.'
