  de.a1.unit56.lesson06.teach.anna_schoen_dass:
    title: Anna încheie conversația
    gloss: 'Anna: Ce frumos că toți trei iubim animalele!'
    note: Închide cercul faptelor despre animale ale celor trei personaje din această unitate.
