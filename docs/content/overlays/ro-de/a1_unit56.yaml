    title: Anna o întreabă pe Nina
    gloss: 'Anna: Nina, ai și tu un animal de companie?'
  de.a1.unit56.lesson06.teach.nina_ja_ich:
    title: Nina are o pasăre pe nume Pico
    gloss: 'Nina: Da, am o pasăre. Se numește Pico.'
    note: '*Er heißt Pico* reia verbul *heißen* din prima unitate. Er se referă la der Vogel.'
  de.a1.unit56.lesson06.teach.felix_wie_schoen:
    title: Reacția lui Felix
    gloss: 'Felix: Ce frumos! Ce faci cu ea în fiecare zi?'
  de.a1.unit56.lesson06.teach.nina_ich_gebe:
    title: Nina îi dă de mâncare în fiecare zi
    gloss: 'Nina: Îi dau de mâncare în fiecare zi.'
