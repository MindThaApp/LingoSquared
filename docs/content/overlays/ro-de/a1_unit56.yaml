teaching:
  de.a1.unit56.lesson01.teach.das_tier_das:
    title: Animal, un animal de companie
    gloss: animalul / un animal de companie
    note: '*Tier* este cuvântul general pentru animal; *Haustier* (literal „animal de casă”) înseamnă în mod special animal de companie.'
    example_gloss:
    - Câinele este un animal.
    - Câinele este și un animal de companie.
  de.a1.unit56.lesson01.teach.der_hund_die:
    title: Câinele și pisica
    gloss: câinele / pisica
    example_gloss:
    - Anna are un câine.
    - Jonas are o pisică.
  de.a1.unit56.lesson01.teach.der_fisch_der:
    title: Peștele și pasărea
    gloss: peștele / pasărea
    example_gloss:
    - Bunicul are un pește.
    - Nina are o pasăre.
  de.a1.unit56.lesson01.teach.hast_du_ein:
    title: Ai un animal de companie?
    gloss: Ai un animal de companie?
    note: 'Cunoști deja din lecțiile anterioare același tip de întrebare *Hast du ...?*: verbul stă pe primul loc.'
  de.a1.unit56.lesson01.teach.ja_ich_habe:
    title: Da, am un câine
    gloss: Da, am un câine.
    note: Un răspuns afirmativ simplu, cu vocabularul nou al acestei unități.
  de.a1.unit56.lesson01.teach.nein_ich_habe:
    title: Nu, nu am niciun animal de companie
    gloss: Nu, nu am niciun animal de companie.
    note: '*Kein* neagă substantivul *ein Haustier*: vezi nota de gramatică.'
  de.a1.unit56.lesson01.teach.kein_sagt_nein:
    title: 'Kein: negarea unui substantiv'
    gloss: 'Kein neagă un substantiv care ar avea ein-: Ich habe einen Hund, dar Ich habe kein Haustier.'
    note: '*Kein* înlocuiește *ein* într-o propoziție negativă și primește aceleași terminații: ein Haustier devine kein Haustier, einen Hund devine keinen Hund. Pentru verbe și adjective se folosește *nicht*.'
  de.a1.unit56.lesson02.teach.ausfuehren:
    title: A scoate la plimbare (un animal)
    gloss: a scoate la plimbare (un animal)
    note: Un verb separabil -- vezi nota de gramatică.
    example_gloss: Scot câinele la plimbare în fiecare zi.
  de.a1.unit56.lesson02.teach.ausfuehren_ist_trennbar:
    title: Ausführen este separabil
    gloss: 'Ausführen este separabil, ca și aufstehen: ich führe den Hund aus.'
    note: Același tipar al verbelor separabile (rădăcina + ... + prefixul la sfârșit) pe care l-ai învățat deja la verbele rutinei zilnice.
  de.a1.unit56.lesson02.teach.futter_geben:
    title: A da de mâncare
    gloss: a da de mâncare
    example_gloss: Dau de mâncare pisicii în fiecare zi.
  de.a1.unit56.lesson02.teach.spielen_mit:
    title: A se juca cu
    gloss: a se juca cu
    example_gloss: Jonas se joacă cu pisica lui.
  de.a1.unit56.lesson02.teach.ich_fuehre_den:
    title: Scot câinele la plimbare în fiecare zi
    gloss: Scot câinele la plimbare în fiecare zi.
    note: Combină *ausführen* cu *jeden Tag* (în fiecare zi). *Jeden* are terminația -en pentru că Tag este masculin și se află la acuzativ.
  de.a1.unit56.lesson02.teach.ich_gebe_der:
    title: Dau de mâncare pisicii în fiecare zi
    gloss: Dau de mâncare pisicii în fiecare zi.
    note: 'Combină *Futter geben* cu *jeden Tag*. Animalul este la dativ: der Katze (pisicii).'
  de.a1.unit56.lesson03.teach.den_plural_lernst:
    title: 'Plural: Hund -> Hunde'
    gloss: 'Pluralul german variază: der Hund -> die Hunde, die Katze -> die Katzen, der Vogel -> die Vögel. Învață pluralul odată cu fiecare substantiv.'
    note: Tiparele pluralului german, prezentate aici pentru prima dată, cu substantive despre animale ca exemple.
  de.a1.unit56.lesson03.teach.hunde_katzen:
    title: Câini și pisici
    gloss: câini / pisici
    example_gloss:
    - Felix iubește câinii.
    - Lena iubește pisicile.
  de.a1.unit56.lesson03.teach.fische_voegel:
