    note: '*Lieben* (a iubi) își ia complementul direct, fără prepoziție: ich liebe Tiere.'
  de.a1.unit56.lesson03.teach.lena_liebt_katzen:
    title: Lena iubește pisicile, dar nu are animal de companie
    gloss: Lena iubește pisicile, dar nu are animal de companie.
    note: Pregătește contrastul pe care se construiește textul de citit al lecției.
  de.a1.unit56.lesson04.teach.felix_hast_du:
    title: Felix întreabă despre animalul de companie
    gloss: 'Felix: Ai un animal de companie, Anna?'
  de.a1.unit56.lesson04.teach.anna_ja_ich:
    title: Anna are un câine
    gloss: 'Anna: Da, am un câine.'
  de.a1.unit56.lesson04.teach.felix_wie_sieht:
    title: Felix întreabă cum arată
    gloss: 'Felix: Cum arată?'
    note: 'Reia întrebarea *Wie sieht ... aus?* din unitatea despre aspect, acum pusă despre un animal: wie sieht er aus?'
  de.a1.unit56.lesson04.teach.anna_er_hat:
    title: Anna își descrie câinele
    gloss: 'Anna: Are blană maro și este mic.'
    note: Reia vocabularul culorilor și al mărimii din unitatea despre aspect, acum pentru blana unui animal, nu pentru părul unei persoane.
  de.a1.unit56.lesson04.teach.bei_tieren_zaehlt:
    title: Er/ihn pentru animale
    gloss: 'La animale contează genul gramatical al cuvântului: der Hund este er (el), die Katze este sie (ea).'
    note: 'Pronumele germane urmează genul gramatical al substantivului: der Hund -> er (acuzativ: ihn), die Katze -> sie, das Tier -> es. La fel și în română, pronumele depinde de genul cuvântului.'
  de.a1.unit56.lesson04.teach.felix_fuehrst_du:
    title: Felix întreabă despre plimbări
    gloss: 'Felix: Îl scoți la plimbare în fiecare zi?'
  de.a1.unit56.lesson04.teach.anna_ja_ich_2:
    title: Anna își descrie rutina
    gloss: 'Anna: Da, îl scot la plimbare în fiecare zi și îi dau de mâncare.'
  de.a1.unit56.lesson05.teach.felix_und_lena:
    title: Felix, Lena și Jonas despre animale
    gloss: 'Felix și Lena iubesc amândoi animalele, dar niciunul dintre ei nu are animal de companie. Felix iubește câinii, iar Lena iubește pisicile. Jonas are un animal de companie: o pisică. Se joacă des cu pisica lui și îi dă de mâncare în fiecare zi. Tu ai un animal de companie?'
    note: Contrastează a iubi un animal cu a avea cu adevărat unul -- chiar scopul comunicativ al unității.
    glosses:
      lieben: iubesc
      beide: amândoi
      Tiere: animale
      beiden: amândoi
      Haustier: animal de companie
      Hunde: câini
      Katzen: pisici
      Katze: pisică
      spielt: se joacă
      gibt: dă
      jeden: fiecare
      Futter: mâncare
  de.a1.unit56.lesson05.teach.jonas_spielt_oft:
    title: Jonas se joacă des cu pisica lui
    gloss: Jonas se joacă des cu pisica lui.
    note: '*Oft* stă de obicei imediat după verb: Jonas spielt oft mit seiner Katze.'
  de.a1.unit56.lesson05.teach.ich_liebe_hunde:
    title: Iubesc câinii. Nu am animal de companie.
    gloss: Iubesc câinii. Nu am animal de companie.
