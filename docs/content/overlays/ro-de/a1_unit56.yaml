course:
  title: Germană A1
  description: 'Germană pentru începători despre animalele de companie și animalele obișnuite: cum le numim, îngrijirea de bază (plimbare, hrănire, joacă), cum spunem ce animale iubim chiar dacă nu avem unul și pluralul regulat în germană.'
