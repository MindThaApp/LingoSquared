teaching:
  de.a1.unit21.lesson01.teach.kleidung:
    title: Kleidung
    gloss: îmbrăcăminte
    note: '*Kleidung* este un cuvânt general pentru haine.'
    example_gloss: Cumpăr îmbrăcăminte.
  de.a1.unit21.lesson01.teach.hemd:
    title: Hemd
    gloss: cămașă
    note: '*Hemd* este o cămașă, adesea una cu nasturi.'
    example_gloss: Caut o cămașă.
  de.a1.unit21.lesson01.teach.hose:
    title: Hose
    gloss: pantaloni
    note: '*Hose* este la singular în germană pentru o pereche de pantaloni, în timp ce în română „pantaloni” se folosește la plural.'
    example_gloss: Caut pantaloni.
  de.a1.unit21.lesson01.teach.jacke:
    title: Jacke
    gloss: jachetă
    note: '*Jacke* seamănă cu cuvântul românesc „jachetă”.'
    example_gloss: Jacheta este călduroasă.
  de.a1.unit21.lesson01.teach.suche:
    title: Ich suche ein Hemd.
    gloss: Caut o cămașă.
    note: '*suche* este util în magazine: caut.'
    example_gloss: Caut o jachetă.
  de.a1.unit21.lesson02.teach.groesse:
    title: Größe
    gloss: mărime
    note: '*Größe* denumește mărimea hainelor.'
    example_gloss: Mărimea M, vă rog.
  de.a1.unit21.lesson02.teach.blau:
    title: blau
    gloss: albastru
    note: Când ceri o culoare, germana poate spune *in Blau*, adică „în albastru”.
    example_gloss: Caut o cămașă albastră.
  de.a1.unit21.lesson02.teach.rot:
    title: rot
    gloss: roșu
    note: '*rot* înseamnă roșu.'
    example_gloss: Jacheta este roșie.
  de.a1.unit21.lesson02.teach.passt:
    title: Das Hemd passt.
    gloss: Cămașa se potrivește.
    note: '*passt* înseamnă „se potrivește” când vorbim despre haine.'
    example_gloss: 'În context: Da, cămașa se potrivește.'
  de.a1.unit21.lesson02.teach.request:
    title: Ich suche ein Hemd in Blau, Größe M.
    gloss: Caut o cămașă albastră, mărimea M.
    note: Cererea spune articolul, culoarea și mărimea.
  de.a1.unit21.lesson02.teach.label:
    title: Kleidungsetikett
    gloss: etichetă de îmbrăcăminte
    note: O etichetă poate arăta culoarea, mărimea și prețul.
    example_gloss: 'Culoare: albastru. Mărime: M.'
  de.a1.unit21.lesson02.teach.line01:
    title: Vânzătoarea întreabă
    gloss: 'Vânzătoarea: Bună ziua. Ce căutați?'
    note: O vânzătoare îl întreabă pe client ce caută.
    example_gloss: Ce căutați?
  de.a1.unit21.lesson02.teach.line02:
    title: Felix spune articolul, culoarea și mărimea
    gloss: 'Felix: Caut o cămașă albastră, mărimea M.'
    note: Felix dă toate cele trei detalii cerute.
  de.a1.unit21.lesson02.teach.line03:
    title: Vânzătoarea o oferă
    gloss: 'Vânzătoarea: Poftiți. Doriți să o cumpărați?'
    note: Forma de politețe *Sie* păstrează schimbul de replici din magazin politicos.
    example_gloss: Doriți să o cumpărați?
  de.a1.unit21.lesson02.teach.line04:
    title: Felix verifică mărimea și întreabă prețul
    gloss: 'Felix: Da, cămașa se potrivește. Cât costă?'
    note: Felix spune că se potrivește și întreabă prețul.
    example_gloss: 'În context: Da, cămașa se potrivește.'
