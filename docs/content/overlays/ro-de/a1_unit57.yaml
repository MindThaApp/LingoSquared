    title: Mal pro Woche vs. jeden Tag / oft
    gloss: Știi deja jeden Tag (în fiecare zi) și oft (des). Zwei Mal pro Woche (de două ori pe săptămână) este o variantă nouă, mai precisă, de a spune cât de des.
