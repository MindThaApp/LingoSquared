    title: Ce verb se potrivește cu sportul
    gloss: 'Verbul depinde de sport: spielen cu fotbalul, machen cu yoga, gehen plus un infinitiv cu înotul și alergarea.'
    note: Nu există o singură construcție pentru toate sporturile; la acest nivel învață verbul împreună cu sportul.
