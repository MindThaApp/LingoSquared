    gloss: Anna face yoga de două ori pe săptămână. Îi place mișcarea liniștită. Lena nu face yoga, dar iubește înotul. Lena înoată des, aproape în fiecare săptămână. Ce sport faci tu?
    note: Contrastează două sporturi diferite și două moduri diferite de a spune cât de des faci ceva, în același tip de text ca în lecția despre animale.
