    gloss: 'Știi deja Sport treiben din lecția despre hobby-uri (Ich treibe samstags Sport). Pentru un sport anume folosești spielen sau machen: Ich spiele Fußball. Ambele variante sunt germană corectă.'
    note: '*Sport treiben* este refolosit din unitatea despre hobby-uri, nu este nou. Este modul general de a vorbi despre mișcare, în timp ce spielen, machen și gehen denumesc sportul concret.'
