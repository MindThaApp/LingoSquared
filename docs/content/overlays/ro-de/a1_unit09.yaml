teaching:
  de.a1.unit09.lesson01.teach.bank:
    title: Bank
    gloss: bancă
    note: '*Bank* înseamnă bancă -- substantiv feminin, *die Bank*.'
    example_gloss: Trebuie să merg la bancă.
  de.a1.unit09.lesson01.teach.krankenhaus:
    title: Krankenhaus
    gloss: spital
    note: '*Krankenhaus* înseamnă literal „casă de bolnavi” -- substantiv neutru, *das Krankenhaus*.'
    example_gloss: Prietenul meu este în spital.
  de.a1.unit09.lesson01.teach.apotheke:
    title: Apotheke
    gloss: farmacie
    note: '*Apotheke* înseamnă farmacie -- substantiv feminin, *die Apotheke*.'
    example_gloss: Farmacia este deschisă azi.
  de.a1.unit09.lesson01.teach.park:
    title: Park
    gloss: parc
    note: '*Park* înseamnă parc -- substantiv masculin, *der Park*.'
    example_gloss: Ne place să ne plimbăm prin parc.
  de.a1.unit09.lesson01.teach.restaurant:
    title: Restaurant
    gloss: restaurant
    note: '*Restaurant* înseamnă restaurant -- substantiv neutru, *das Restaurant*.'
    example_gloss: Acest restaurant are mâncare bună.
  de.a1.unit09.lesson02.teach.neben:
    title: Die Apotheke ist neben dem Park.
    gloss: Farmacia este lângă parc.
    note: '*neben* înseamnă „lângă”. Este o prepoziție cu dublu regim -- pentru o locație fixă (ca aici) cere dativul, deci *der Park* (masculin) devine *dem Park*.'
  de.a1.unit09.lesson02.teach.gegenueber_von:
    title: Die Apotheke ist gegenüber vom Krankenhaus.
    gloss: Farmacia este vizavi de spital.
    note: '*gegenüber von* înseamnă „vizavi de”. *vom* este forma contrasă obișnuită pentru *von dem* (dativ neutru, *das Krankenhaus*), folosită atât în vorbire, cât și în scris.'
  de.a1.unit09.lesson02.teach.zwischen:
    title: Die Apotheke ist zwischen der Bank und dem Park.
    gloss: Farmacia este între bancă și parc.
    note: '*zwischen* înseamnă „între”. Observă ambele forme de dativ: *der Bank* (feminin) și *dem Park* (masculin).'
  de.a1.unit09.lesson02.teach.hinter:
    title: Das Restaurant ist hinter der Bank.
    gloss: Restaurantul este în spatele băncii.
    note: '*hinter* înseamnă „în spatele” -- *der Bank* este forma de dativ feminin.'
  de.a1.unit09.lesson02.teach.vor:
    title: Der Park ist vor dem Krankenhaus.
    gloss: Parcul este în fața spitalului.
    note: '*vor* înseamnă „în fața” -- *dem Krankenhaus* este forma de dativ neutru.'
  de.a1.unit09.lesson03.teach.wo_ist_die_bank:
    title: Wo ist die Bank?
    gloss: Unde este banca?
    note: '*Wo ist...?* este modul standard de a întreba unde se află ceva.'
  de.a1.unit09.lesson03.teach.sie_ist_neben:
    title: Sie ist neben dem Park.
    gloss: Este lângă parc.
    note: '*Sie* înseamnă aici „ea” (se referă la *die Bank*, feminin). Se scrie cu majusculă doar pentru că începe propoziția. Verbul *ist* arată că nu este forma de politețe „dumneavoastră”, care ar fi *Sie sind*.'
  de.a1.unit09.lesson03.teach.ist_es_weit:
    title: Ist es weit von hier?
    gloss: Este departe de aici?
    note: '*weit* înseamnă departe. *es* este aici un pronume general pentru situație și nu se acordă cu genul vreunui substantiv anume.'
  de.a1.unit09.lesson03.teach.nicht_weit:
    title: Nein, es ist nicht weit.
    gloss: Nu, nu este departe.
    note: '*nicht* neagă adjectivul *weit*.'
  de.a1.unit09.lesson04.teach.entschuldigung_wo:
    title: Entschuldigung, wo ist die Apotheke?
    gloss: Scuzați-mă, unde este farmacia?
    note: '*Entschuldigung* a fost prezentat mai devreme ca „scuzați-mă / pardon” -- aici deschide politicos o întrebare.'
  de.a1.unit09.lesson04.teach.line01:
    title: Felix cere indicații
    gloss: 'Felix spune: Scuzați-mă, unde este farmacia?'
    note: Aceeași formulă politicoasă de început ca în expresia de mai sus, acum într-o conversație reală.
  de.a1.unit09.lesson04.teach.line02:
    title: Anna spune unde se află
    gloss: 'Anna spune: Este vizavi de spital.'
    note: Un răspuns complet precizează locul farmaciei față de un reper cunoscut.
  de.a1.unit09.lesson04.teach.line03:
    title: Felix întreabă cât de departe este
    gloss: 'Felix spune: Este departe de aici?'
    note: O întrebare firească de continuare după ce ai aflat direcția generală.
  de.a1.unit09.lesson04.teach.line04:
    title: Anna răspunde despre distanță
    gloss: 'Anna spune: Nu, nu este departe. Este între bancă și parc.'
    note: Un răspuns complet liniștește în privința distanței, apoi dă un al doilea reper, mai precis.
