teaching:
  de.a1.unit02.lesson01.teach.wie_heissen_sie:
    title: Wie heißen Sie?
    gloss: Cum vă numiți? (formal)
    note: '*Wie heißen Sie?* întreabă literal „cum sunteți numit”, folosind forma de politețe *Sie* din Unitatea 1.'
  de.a1.unit02.lesson01.teach.ich_heisse_anna:
    title: Ich heiße Anna.
    gloss: Mă numesc Anna.
    note: '*heißen* înseamnă „a se numi” — este modul obișnuit de a-ți spune numele.'
  de.a1.unit02.lesson01.teach.wie_heisst_du:
    title: Wie heißt du?
    gloss: Cum te cheamă? (informal)
    note: Varianta informală, cu *du* din Unitatea 1.
  de.a1.unit02.lesson01.teach.ich_heisse_felix:
    title: Ich heiße Felix.
    gloss: Mă numesc Felix.
    note: Aceeași construcție ca în *Ich heiße Anna*, doar cu alt nume.
  de.a1.unit02.lesson01.teach.freut_mich:
    title: Freut mich.
    gloss: Îmi pare bine.
    note: O formulă scurtă și frecventă prin care spui că îți pare bine să cunoști pe cineva, potrivită în ambele registre.
  de.a1.unit02.lesson01.teach.ganz_meinerseits:
    title: Ganz meinerseits.
    gloss: Și mie. / Plăcerea este de partea mea.
    note: Răspunsul firesc la *Freut mich* — literal „în întregime din partea mea”.
  de.a1.unit02.lesson02.teach.ich:
    title: ich
    gloss: eu
    note: '*ich* se scrie cu literă mică în germană, cu excepția începutului de propoziție (ca în *Ich bin Anna.*) — la fel ca „eu” în română.'
  de.a1.unit02.lesson02.teach.du:
    title: du
    gloss: tu
    note: Introdus deja în Unitatea 1 — recapitulat aici ca subiect al unei propoziții întregi.
  de.a1.unit02.lesson02.teach.ich_bin_anna:
    title: Ich bin Anna.
    gloss: Eu sunt Anna.
    note: '*bin* este forma lui *sein* (a fi) pentru *ich*.'
  de.a1.unit02.lesson02.teach.du_bist_felix:
    title: Du bist Felix.
    gloss: Tu ești Felix.
    note: '*bist* este forma lui *sein* pentru *du*.'
  de.a1.unit02.lesson03.teach.deutschland:
    title: Deutschland
    gloss: Germania
    note: Numele de țări nu cer de obicei articol în germană — doar *Deutschland*, nu *das Deutschland*.
    example_gloss: Vin din Germania.
  de.a1.unit02.lesson03.teach.england:
    title: England
    gloss: Anglia
    note: Spre deosebire de românescul „Anglia”, germana folosește forma England, pronunțată cu sunetele germane.
    example_gloss: Vin din Anglia.
  de.a1.unit02.lesson03.teach.frankreich:
    title: Frankreich
    gloss: Franța
    note: 'Atenție la ortografie: în germană numele țării se scrie altfel decât în franceză, *France*, și decât în română, „Franța”.'
    example_gloss: Vin din Franța.
  de.a1.unit02.lesson03.teach.italien:
    title: Italien
    gloss: Italia
    note: Se pronunță aproximativ „i-TA-li-en”.
    example_gloss: Vin din Italia.
  de.a1.unit02.lesson03.teach.spanien:
    title: Spanien
    gloss: Spania
    note: Se pronunță aproximativ „ȘPA-ni-en”.
    example_gloss: Vin din Spania.
  de.a1.unit02.lesson03.teach.russland:
    title: Russland
    gloss: Rusia
    note: Format din *Russ-* + *-land*, ca *Deutschland*.
    example_gloss: Vin din Rusia.
  de.a1.unit02.lesson04.teach.woher_kommen_sie:
    title: Woher kommen Sie?
    gloss: De unde veniți? (formal)
    note: '*Woher* înseamnă „de unde” și conține deja sensul de proveniență, la fel ca „de unde” în română, deci nu mai are nevoie de un cuvânt separat pentru „de”.'
  de.a1.unit02.lesson04.teach.ich_komme_aus_deutschland:
    title: Ich komme aus Deutschland.
    gloss: Vin din Germania.
    note: '*aus* + numele țării exprimă proveniența — în această etapă nu e nevoie de un cuvânt pentru naționalitate.'
  de.a1.unit02.lesson04.teach.woher_kommst_du:
    title: Woher kommst du?
    gloss: De unde vii? (informal)
    note: Varianta informală, cu *du*.
  de.a1.unit02.lesson04.teach.ich_komme_aus_england:
    title: Ich komme aus England.
    gloss: Vin din Anglia.
    note: Aceeași construcție ca în *Ich komme aus Deutschland*, doar cu altă țară.
  de.a1.unit02.lesson04.teach.und_sie:
    title: Und Sie?
    gloss: Și dumneavoastră? (formal)
    note: O modalitate scurtă de a returna întrebarea, în acord cu registrul *Sie*.
  de.a1.unit02.lesson05.teach.line01:
    title: Felix o salută pe Anna
    gloss: 'Felix spune: Bună ziua!'
    note: Felix și Anna sunt vecini care s-au întâlnit o dată înainte (Unitatea 1), dar nu și-au spus numele. Acum se revăd, de data aceasta în stația de autobuz.
  de.a1.unit02.lesson05.teach.line02:
    title: Anna răspunde la salut și îl întreabă cum îl cheamă
    gloss: 'Anna spune: Bună ziua! Cum vă numiți?'
    note: Anna folosește forma de politețe *Sie*, păstrând registrul stabilit între necunoscuți în Unitatea 1.
  de.a1.unit02.lesson05.teach.line03:
    title: Felix își spune numele și întreabă la rândul lui
    gloss: 'Felix spune: Mă numesc Felix. Dar dumneavoastră?'
    note: Felix răspunde și întoarce întrebarea, tot în registru politicos.
  de.a1.unit02.lesson05.teach.line04:
    title: Anna își spune numele
    gloss: 'Anna spune: Mă numesc Anna. Îmi pare bine.'
    note: Anna răspunde la fel și adaugă formula de politețe.
  de.a1.unit02.lesson05.teach.line05:
    title: Felix răspunde și o întreabă de unde este
    gloss: 'Felix spune: Și mie. De unde sunteți?'
    note: Felix întoarce formula de politețe și mută discuția către locul de origine.
  de.a1.unit02.lesson05.teach.line06:
    title: Anna răspunde și întreabă la rândul ei
    gloss: 'Anna spune: Sunt din Germania. Dar dumneavoastră?'
    note: Aflăm că Anna este germană, ceea ce se potrivește cu faptul că cei doi sunt vecini într-un oraș de limbă germană.
  de.a1.unit02.lesson05.teach.line07:
    title: Felix răspunde
    gloss: 'Felix spune: Sunt din Anglia.'
    note: 'Acum aflăm că Felix vine din Anglia: un vecin englez care locuiește în Germania.'
  de.a1.unit02.lesson05.teach.line08:
    title: Anna își ia rămas-bun
    gloss: 'Anna spune: La revedere!'
    note: Formula politicoasă de rămas-bun din Unitatea 1, în acord cu registrul formal *Sie* folosit în continuare.
  de.a1.unit02.lesson05.teach.line09:
    title: Felix își ia rămas-bun
    gloss: 'Felix spune: La revedere!'
    note: Felix încheie la fel, păstrând același registru pe tot parcursul întâlnirii.
  de.a1.unit02.lesson05.teach.steckbrief:
    title: Un scurt profil scris
    gloss: 'Nume: Felix. Țara: Anglia.'
    note: O fișă de profil simplă, cu un nume și o informație despre identitate, aceleași informații pe care Felix le-a spus cu voce tare în dialog.
