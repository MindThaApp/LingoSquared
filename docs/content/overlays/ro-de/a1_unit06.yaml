    gloss: 'Anna spune: Da. Aceasta este mama mea și acesta este tatăl meu.'
  de.a1.unit06.lesson04.teach.line03:
    title: Felix întreabă cine este o persoană
    gloss: 'Felix spune: Cine este aceasta?'
  de.a1.unit06.lesson04.teach.line04:
    title: Anna își prezintă sora
    gloss: 'Anna spune: Aceasta este sora mea. Sora mea este profesoară.'
    note: 'Ca în română, în germană nu se folosește articol înaintea unei meserii: *Meine Schwester ist Lehrerin* = „Sora mea este profesoară”. *Lehrerin* este forma feminină a lui *Lehrer*.'
