    title: Das ist mein Bruder.
    gloss: Acesta este fratele meu.
    note: '*Das ist...* = „Acesta/Aceasta este...” sau „Acela/Aceea este...” – modul simplu de a prezenta pe cineva.'
  de.a1.unit06.lesson03.teach.er_ist_zwanzig:
    title: Er ist zwanzig Jahre alt.
    gloss: El are douăzeci de ani.
