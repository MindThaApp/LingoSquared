  de.a1.unit06.lesson03.teach.nein_einzelkind:
    title: Nein, ich habe keine Geschwister. Ich bin Einzelkind.
    gloss: Nu, nu am frați sau surori. Sunt copil unic.
    note: '*keine* = „niciun / nicio / deloc”. *Einzelkind* = „copil unic”; ca în română, nu se folosește articol: *Ich bin Einzelkind*.'
