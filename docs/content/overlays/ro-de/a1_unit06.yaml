    title: meine Mutter
    gloss: mama mea
    note: '*Mutter* este feminin, deci „mea” se spune *meine*. Posesivul se acordă cu genul substantivului posedat, nu cu al posesorului.'
  de.a1.unit06.lesson02.teach.sein_bruder:
    title: sein Bruder
    gloss: fratele lui
    note: '*sein* = „al lui”. Aceeași regulă: un substantiv masculin primește *sein* (*sein Bruder*), unul feminin primește *seine* (*seine Schwester*).'
  de.a1.unit06.lesson02.teach.ihr_vater_formal:
    title: Ihr Vater
    gloss: tatăl dumneavoastră
    note: '*Ihr* scris cu majusculă = „dumneavoastră”, în acord cu *Sie*. Substantivele masculine primesc *Ihr* (*Ihr Vater*); cele feminine primesc *Ihre* (*Ihre Mutter*).'
