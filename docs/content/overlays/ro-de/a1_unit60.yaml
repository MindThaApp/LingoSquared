    title: Cine ce studiază?
    gloss: Jonas nu doar lucrează, ci și studiază. Urmează un curs de spaniolă la centrul de educație pentru adulți. În fiecare săptămână învață cuvinte noi. Lena face studii la școala superioară. Acolo ea studiază sănătate. Amândurora le place să studieze. Tu ce studiezi sau ce ai vrea să înveți?
