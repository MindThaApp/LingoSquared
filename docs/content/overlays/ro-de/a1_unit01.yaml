teaching:
  de.a1.unit01.lesson01.teach.hallo:
    title: Hallo
    gloss: salut / bună
    note: '*Hallo* este un salut informal, universal, folosit la orice oră din zi, ca „salut” sau „bună” în română.'
    example_gloss: Salut, Felix!
  de.a1.unit01.lesson01.teach.guten_morgen:
    title: Guten Morgen
    gloss: bună dimineața
    note: '*Guten Morgen* se folosește dimineața, aproximativ până spre sfârșitul dimineții.'
  de.a1.unit01.lesson01.teach.guten_tag:
    title: Guten Tag
    gloss: bună ziua
    note: '*Guten Tag* este salutul standard de zi, puțin mai formal, care se poate folosi de la sfârșitul dimineții până după-amiaza.'
  de.a1.unit01.lesson01.teach.guten_abend:
    title: Guten Abend
    gloss: bună seara
    note: '*Guten Abend* se spune când ajungi undeva seara: este un salut, nu o formulă de rămas-bun.'
  de.a1.unit01.lesson02.teach.tschuss:
    title: Tschüss
    gloss: pa
    note: '*Tschüss* este o formulă informală, foarte frecventă, de rămas-bun între prieteni și cunoscuți.'
    example_gloss: Pa, ne vedem în curând!
  de.a1.unit01.lesson02.teach.auf_wiedersehen:
    title: Auf Wiedersehen
    gloss: la revedere
    note: '*Auf Wiedersehen* înseamnă literal „până ne vedem din nou”: este formula standard, mai formală, de rămas-bun, potrivită cu persoane necunoscute sau în context profesional.'
  de.a1.unit01.lesson02.teach.bis_bald:
    title: Bis bald
    gloss: ne vedem în curând
    note: '*Bis bald* este o formulă prietenoasă de rămas-bun când te aștepți să revezi persoana în curând.'
  de.a1.unit01.lesson02.teach.bis_spater:
    title: Bis später
    gloss: ne vedem mai târziu
    note: '*Bis später* se folosește când vei revedea persoana mai târziu în aceeași zi.'
  de.a1.unit01.lesson02.teach.gute_nacht:
    title: Gute Nacht
    gloss: noapte bună
    note: '*Gute Nacht* se spune când cineva merge la culcare sau încheie ziua; spre deosebire de *Guten Abend*, este o formulă de rămas-bun, nu un salut.'
  de.a1.unit01.lesson03.teach.sie:
    title: Sie
    gloss: dumneavoastră
    note: '*Sie* este pronumele de politețe, scris cu majusculă chiar și în mijlocul propoziției; se folosește cu persoane necunoscute, cu vârstnici sau în situații formale ori profesionale. Ca în română (tu / dumneavoastră), germana distinge două forme de adresare, dar Sie se folosește cu verbul la persoana a treia plural.'
  de.a1.unit01.lesson03.teach.du:
    title: du
    gloss: tu
    note: '*du* este forma informală de adresare („tu”), folosită cu prietenii, cu familia și cu copiii. Dacă îi spui *du* unui străin, poate suna prea familiar sau chiar nepoliticos.'
  de.a1.unit01.lesson03.teach.wie_geht_es_ihnen:
    title: Wie geht es Ihnen?
    gloss: Ce mai faceți? (formal)
    note: 'Modul formal de a întreba cum se simte cineva: *Ihnen* este forma de dativ a pronumelui de politețe, potrivită registrului *Sie*.'
  de.a1.unit01.lesson03.teach.wie_gehts:
    title: Wie geht's?
    gloss: Ce mai faci? (informal)
    note: '*Wie geht''s* este forma contrasă de la *Wie geht es*, modul informal de zi cu zi de a întreba cum se simte cineva.'
  de.a1.unit01.lesson03.teach.gut_danke:
    title: Gut, danke.
    gloss: Bine, mulțumesc.
    note: Un răspuns simplu și neutru, potrivit în ambele registre.
  de.a1.unit01.lesson03.teach.sehr_gut_danke:
    title: Sehr gut, danke.
    gloss: Foarte bine, mulțumesc.
    note: Un răspuns mai entuziast decât *Gut, danke.*
  de.a1.unit01.lesson03.teach.und_ihnen:
    title: Und Ihnen?
    gloss: Dar dumneavoastră? (formal)
    note: Modul formal de a întoarce întrebarea, potrivit registrului *Sie*.
  de.a1.unit01.lesson03.teach.und_dir:
    title: Und dir?
    gloss: Dar tu? (informal)
    note: 'Modul informal de a întoarce întrebarea: *dir* este forma de dativ a pronumelui „tu”, potrivită registrului *du*.'
  de.a1.unit01.lesson04.teach.danke:
    title: Danke
    gloss: mulțumesc
    note: '*Danke* a apărut deja în răspunsurile de mai sus; aici este cuvântul de sine stătător.'
    example_gloss: Mulțumesc frumos!
  de.a1.unit01.lesson04.teach.bitte:
    title: Bitte
    gloss: te rog / cu plăcere
    note: '*Bitte* are cu adevărat două sensuri frecvente, în funcție de context: „te rog” când ceri ceva sau „cu plăcere” când răspunzi la o mulțumire. Contextul arată despre care e vorba; nu este o coincidență și nici o greșeală, ambele utilizări sunt perfect standard.'
    example_gloss:
    - O cafea, vă rog.
    - Cu foarte mare plăcere!
  de.a1.unit01.lesson04.teach.entschuldigung:
    title: Entschuldigung
    gloss: scuzați-mă / scuze
    note: '*Entschuldigung* se folosește atât pentru a atrage politicos atenția cuiva, cât și pentru a-ți cere scuze pe scurt.'
    example_gloss: Scuzați-mă, unde este toaleta?
  de.a1.unit01.lesson04.teach.kein_problem:
    title: Kein Problem
    gloss: nicio problemă
    note: Un răspuns informal și prietenos, cu un ton asemănător expresiei românești „nicio problemă”.
  de.a1.unit01.lesson04.teach.gern_geschehen:
    title: Gern geschehen
    gloss: cu plăcere
    note: O formulă mai completă și mai explicită pentru „cu plăcere” decât scurtul *Bitte*.
  de.a1.unit01.lesson05.teach.line01:
    title: Anna îl salută pe Felix
    gloss: 'Anna spune: Bună ziua!'
    note: Anna și Felix se întâlnesc pentru prima dată ca vecini în blocul lor.
  de.a1.unit01.lesson05.teach.line02:
    title: Felix răspunde la salut și o întreabă ce mai face
    gloss: 'Felix spune: Bună ziua! Ce mai faceți?'
    note: Felix folosește registrul formal *Sie*, pentru că tocmai s-au cunoscut.
  de.a1.unit01.lesson05.teach.line03:
    title: Anna răspunde și întoarce întrebarea
    gloss: 'Anna spune: Bine, mulțumesc. Dar dumneavoastră?'
    note: Anna răspunde și întoarce întrebarea în mod formal, potrivit registrului lui Felix.
  de.a1.unit01.lesson05.teach.line04:
    title: Felix răspunde
    gloss: 'Felix spune: Foarte bine, mulțumesc.'
    note: Un răspuns puțin mai entuziast decât un simplu *Gut, danke.*
  de.a1.unit01.lesson05.teach.line05:
    title: Anna își ia rămas-bun
    gloss: 'Anna spune: La revedere!'
    note: Anna folosește formula de rămas-bun mai formală, în acord cu registrul *Sie* folosit pe tot parcursul dialogului.
  de.a1.unit01.lesson05.teach.line06:
    title: Felix își ia rămas-bun și spune „ne vedem în curând”
    gloss: 'Felix spune: La revedere, ne vedem în curând!'
    note: Felix îmbină formula formală de rămas-bun cu „ne vedem în curând”, păstrând registrul *Sie* folosit de ambii vorbitori la prima lor întâlnire.
