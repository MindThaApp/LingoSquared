teaching:
  de.a1.unit19.lesson01.teach.wohnung:
    title: Wohnung
    gloss: apartament
    note: '*Wohnung* este cuvântul obișnuit în germană pentru apartament.'
    example_gloss: Apartamentul meu este mic.
  de.a1.unit19.lesson01.teach.zimmer:
    title: Zimmer
    gloss: cameră
    note: '*Zimmer* poate însemna cameră într-o locuință sau cameră de hotel.'
    example_gloss: Apartamentul are două camere.
  de.a1.unit19.lesson01.teach.kueche:
    title: Küche
    gloss: bucătărie
    note: '*Küche* este camera în care se gătește.'
    example_gloss: Bucătăria este luminoasă.
  de.a1.unit19.lesson01.teach.bad:
    title: Bad
    gloss: baie
    note: '*Bad* este un cuvânt scurt și frecvent pentru baie.'
    example_gloss: Baia este mică.
  de.a1.unit19.lesson01.teach.hell:
    title: hell
    gloss: luminos
    note: '*hell* descrie o cameră cu multă lumină.'
    example_gloss: Apartamentul meu este luminos.
  de.a1.unit19.lesson02.teach.wohnzimmer:
    title: Wohnzimmer
    gloss: living
    note: '*Wohnzimmer* înseamnă literal „cameră de locuit”.'
    example_gloss: Masa este în living.
  de.a1.unit19.lesson02.teach.tisch:
    title: Tisch
    gloss: masă
    note: '*Tisch* este de genul masculin: *der Tisch*.'
    example_gloss: Este o masă.
  de.a1.unit19.lesson02.teach.stuhl:
    title: Stuhl
    gloss: scaun
    note: '*Stuhl* înseamnă scaun.'
    example_gloss: Este un scaun.
  de.a1.unit19.lesson02.teach.es_gibt:
    title: Es gibt einen Tisch.
    gloss: Este o masă.
    note: '*Es gibt* este expresia de bază pentru „există”.'
    example_gloss: În living este o masă.
  de.a1.unit19.lesson02.teach.steht:
    title: Der Tisch steht im Wohnzimmer.
    gloss: Masa este în living.
    note: Pentru locul unde se află mobila, germana folosește adesea *steht* („stă în picioare”).
  de.a1.unit19.lesson02.teach.home_text:
    title: Wohnung in Berlin
    gloss: apartament în Berlin
    note: Descrierea scurtă spune unde este locuința, câte camere are și ce mobilă.
    example_gloss: Apartamentul meu este în Berlin.
  de.a1.unit19.lesson02.teach.line01:
    title: Felix o întreabă despre apartament
    gloss: 'Felix: Cum este apartamentul dumneavoastră, Anna?'
    note: Forma politicoasă *Ihre* se potrivește cu *Sie*.
    example_gloss: Cum este apartamentul dumneavoastră?
  de.a1.unit19.lesson02.teach.line02:
    title: Anna descrie camerele
    gloss: 'Anna: Apartamentul meu este mic, dar luminos. Are două camere, o bucătărie și o baie.'
    note: 'Anna spune cât de mare este apartamentul, cât de luminos și câte camere are. Aici *Sie hat* înseamnă „(el) are”: *Sie* se referă la *die Wohnung*.'
    example_gloss: Are două camere.
  de.a1.unit19.lesson02.teach.line03:
    title: Felix întreabă despre mobilă
    gloss: 'Felix: Există o masă?'
    note: '*Gibt es...?* întreabă dacă există ceva.'
  de.a1.unit19.lesson02.teach.line04:
    title: Anna spune unde este masa
    gloss: 'Anna: Da, masa este în living.'
    note: Răspunsul spune unde se află mobila.
    example_gloss: Masa este în living.
