teaching:
  de.a1.unit05.lesson01.teach.wie_spaet:
    title: Wie spät ist es?
    gloss: Cât este ceasul?
    note: 'Literal: „Cât de târziu este?” – modul obișnuit de a întreba ora.'
  de.a1.unit05.lesson01.teach.drei_uhr:
    title: Es ist drei Uhr.
    gloss: Este ora trei.
    note: '*Uhr* = „ora”. Orele fixe se formează din număr + *Uhr*.'
  de.a1.unit05.lesson01.teach.halb_vier:
    title: halb vier = 3:30
    gloss: Este trei și jumătate (3:30).
    note: 'Germana numește jumătatea de oră după ora spre care se îndreaptă: *halb vier* = „jumătate (din drum) spre patru” = 3:30. În română spunem „trei și jumătate”.'
  de.a1.unit05.lesson01.teach.fuenf_uhr:
    title: Es ist fünf Uhr.
    gloss: Este ora cinci.
  de.a1.unit05.lesson02.teach.viertel_nach:
    title: Es ist Viertel nach drei.
    gloss: Este trei și un sfert (3:15).
    note: '*Viertel* = „sfert”; *nach* = „după”.'
  de.a1.unit05.lesson02.teach.viertel_vor:
    title: Es ist Viertel vor vier.
    gloss: Este patru fără un sfert (3:45).
    note: '*vor* = „înainte de”.'
  de.a1.unit05.lesson02.teach.zehn_nach:
    title: Es ist zehn nach vier.
    gloss: Este patru și zece (4:10).
    note: 'Se spun minutele + *nach* + ora: zehn nach vier (literal „zece după patru”).'
  de.a1.unit05.lesson02.teach.zehn_vor:
    title: Es ist zehn vor fünf.
    gloss: Este cinci fără zece (4:50).
    note: 'Se spun minutele + *vor* + ora următoare: zehn vor fünf (literal „zece înainte de cinci”).'
  de.a1.unit05.lesson03.teach.morgen:
    title: Morgen
    gloss: dimineață
    note: '*Morgen* este substantivul pentru dimineață, aproximativ între 6 și 12.'
    example_gloss: Bună dimineața, Felix!
  de.a1.unit05.lesson03.teach.mittag:
    title: Mittag
    gloss: amiază
    note: '*Mittag* este chiar amiaza, mijlocul zilei dintre Morgen și Nachmittag.'
    example_gloss: Este amiază.
  de.a1.unit05.lesson03.teach.nachmittag:
    title: Nachmittag
    gloss: după-amiază
    note: '*Nachmittag* acoperă aproximativ intervalul 12–18.'
    example_gloss: Lucrez după-amiaza.
  de.a1.unit05.lesson03.teach.abend:
    title: Abend
    gloss: seară
    note: '*Abend* acoperă aproximativ intervalul 18–22.'
    example_gloss: Bună seara, Anna!
  de.a1.unit05.lesson03.teach.nacht:
    title: Nacht
    gloss: noapte
    note: '*Nacht* acoperă aproximativ intervalul 22–6.'
    example_gloss: Noapte bună, Felix!
  de.a1.unit05.lesson03.teach.mitternacht:
    title: Mitternacht
    gloss: miezul nopții
    note: '*Mitternacht* este exact ora 24:00 / 0 Uhr.'
    example_gloss: Petrecerea se termină la miezul nopții.
  de.a1.unit05.lesson03.teach.achtzehn:
    title: achtzehn
    gloss: optsprezece
    note: '*achtzehn* = 18, folosit aici în sistemul de 24 de ore pentru programul oficial (achtzehn Uhr = ora 18:00).'
    example_gloss: Magazinul se închide la 18:00.
  de.a1.unit05.lesson03.teach.laden_oeffnet:
    title: Der Laden öffnet um neun Uhr morgens.
    gloss: Magazinul se deschide la nouă dimineața.
    note: '*um* + oră = „la” o anumită oră; *morgens* = „dimineața”.'
  de.a1.unit05.lesson03.teach.laden_schliesst:
    title: Der Laden schließt um achtzehn Uhr.
    gloss: Magazinul se închide la 18:00.
    note: '*schließt* = „se închide”. Programul oficial de funcționare folosește sistemul de 24 de ore.'
  de.a1.unit05.lesson04.teach.wann:
    title: Wann
    gloss: când
    note: '*Wann* introduce o întrebare despre timp.'
    example_gloss: Când vii?
  de.a1.unit05.lesson04.teach.oeffnet_die:
    title: öffnet die
    gloss: deschide
    note: '*öffnet* este persoana a III-a singular a verbului *öffnen* (a deschide); *die* este articolul hotărât feminin/de plural, potrivit pentru *die Bibliothek*.'
    example_gloss: Când se deschide biblioteca?
  de.a1.unit05.lesson04.teach.bibliothek:
    title: Bibliothek
    gloss: bibliotecă
    note: '*Bibliothek* este un substantiv feminin (*die Bibliothek*), același loc prezentat în Unitatea 4.'
    example_gloss: Merg la bibliotecă.
  de.a1.unit05.lesson04.teach.sie_pronomen:
    title: sie
    gloss: ea / ele / ei (cu literă mică)
    note: Aici *sie* este pronumele de persoana a III-a care înlocuiește substantivul feminin *die Bibliothek* („ea”). Nu-l confunda cu *Sie* scris cu majusculă (forma de politețe, „dumneavoastră”), pe care Anna și Felix o folosesc între ei.
    example_gloss: Îmi place biblioteca. O vizitez des.
  de.a1.unit05.lesson04.teach.dann:
    title: dann
    gloss: atunci
    note: '*dann* apare aici în formula de încheiere *Bis dann!* („ne vedem atunci!”).'
    example_gloss: Ne vedem atunci!
  de.a1.unit05.lesson04.teach.line01:
    title: Felix întreabă despre bibliotecă
    gloss: 'Felix spune: Când se deschide biblioteca?'
  de.a1.unit05.lesson04.teach.line02:
    title: Anna răspunde
    gloss: 'Anna spune: Se deschide la nouă dimineața.'
    note: '*Sie* înseamnă aici „ea” și se referă la *die Bibliothek*; este scris cu majusculă doar pentru că începe propoziția.'
  de.a1.unit05.lesson04.teach.line03:
    title: Felix mai pune o întrebare
    gloss: 'Felix spune: Și când se închide?'
  de.a1.unit05.lesson04.teach.line04:
    title: Anna răspunde din nou
    gloss: 'Anna spune: Se închide la 18:00 (șase seara).'
  de.a1.unit05.lesson04.teach.line05:
    title: Felix își ia rămas-bun
    gloss: 'Felix spune: Bine, ne vedem atunci!'
  de.a1.unit05.lesson04.teach.schild:
    title: Un afiș pe ușă
    gloss: 'Program: de la 9:00 la 18:00.'
    note: '*Öffnungszeiten* = „program de funcționare”; *bis* = „până la”.'
