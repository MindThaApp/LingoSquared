course:
  title: Germană A1
  description: 'Germană pentru începători despre activitățile din timpul liber: vocabular despre hobby-uri, expresii de frecvență, întrebări și răspunsuri despre ce face cineva în timpul liber și compararea hobby-urilor a două persoane.'
units:
  de.a1.unit54.hobbys:
    title: Hobby-uri și timp liber
lessons:
  de.a1.unit54.lesson01.lesen_sport_und_kochen:
    title: Citit, sport și gătit
  de.a1.unit54.lesson02.musik_zeichnen_und_videospiele:
    title: Muzică, desen și jocuri video
  de.a1.unit54.lesson03.was_machst_du_in:
    title: Ce faci în timpul liber?
  de.a1.unit54.lesson04.anna_und_felix_sprechen:
    title: Anna și Felix vorbesc despre hobby-uri
  de.a1.unit54.lesson05.felix_und_anna_vergleichen:
    title: Felix și Anna își compară hobby-urile
  de.a1.unit54.lesson06.ein_wochenende_zusammen_planen:
    title: Planuri pentru un weekend împreună
teaching:
  de.a1.unit54.lesson01.teach.lesen_sport_treiben:
    title: Citit, sport, gătit
    gloss: a citi, a face sport, a găti
    note: 'Trei verbe uzuale pentru hobby-uri: *lesen* (a citi), *Sport treiben* (a face sport) și *kochen* (a găti). Sport este substantiv, deci se scrie cu majusculă.'
    example_gloss:
    - Îmi place să citesc o carte.
    - Fac sport sâmbăta.
    - Îmi place să gătesc pentru prieteni.
  de.a1.unit54.lesson01.teach.die_freizeit:
    title: Timpul liber
    gloss: timpul liber
    note: '*Die Freizeit* este un substantiv feminin: învață-l mereu cu articolul die. Este cuvântul-cheie pentru a vorbi despre hobby-uri.'
    example_gloss: În timpul liber, îmi place să citesc.
  de.a1.unit54.lesson01.teach.in_meiner_freizeit:
    title: Spui ce faci în timpul liber
    gloss: În timpul liber, îmi place să citesc.
    note: '*Lese* este forma pentru ich a verbului *lesen* (a citi). Propoziția începe cu o expresie de timp, dar verbul rămâne tot pe locul al doilea: in meiner Freizeit lese ich gern.'
  de.a1.unit54.lesson02.teach.musik_hoeren_zeichnen:
    title: Muzică, desen, jocuri video
    gloss: a asculta muzică, a desena, a juca jocuri video
    note: 'Încă trei expresii pentru hobby-uri: *Musik hören* (a asculta muzică), *zeichnen* (a desena) și *Videospiele spielen* (a juca jocuri video). Musik și Videospiele sunt substantive, deci se scriu cu majusculă.'
    example_gloss:
    - Îmi place să ascult muzică.
    - Desenez des.
    - Îmi place să joc jocuri video cu prietenii.
  de.a1.unit54.lesson02.teach.ich_hoere_gern:
    title: Spui că îți place să asculți muzică
    gloss: Îmi place să ascult muzică.
    note: În germană se spune *Musik hören*, fără prepoziție, la fel ca în română „a asculta muzică”.
  de.a1.unit54.lesson02.teach.ich_spiele_gern:
    title: Spui că îți place să joci jocuri video cu prietenii
    gloss: Îmi place să joc jocuri video cu prietenii.
    note: '*Mit Freunden* (cu prietenii): după mit se folosește mereu cazul dativ, de aceea Freunde devine Freunden.'
  de.a1.unit54.lesson03.teach.immer_oft_manchmal:
    title: Mereu, des, uneori, niciodată
    gloss: mereu, des, uneori, niciodată
    note: 'Cele patru adverbe de frecvență de bază: immer, oft, manchmal, nie. De obicei stau imediat după verb: ich spiele nie.'
    example_gloss:
    - Fac mereu sport sâmbăta.
    - Citesc des o carte.
    - Desenez uneori.
    - Nu joc niciodată jocuri video.
  de.a1.unit54.lesson03.teach.jede_woche_jedes:
    title: În fiecare săptămână, în fiecare weekend
    gloss: în fiecare săptămână, în fiecare weekend
    note: '*Jede Woche* și *jedes Wochenende* înseamnă amândouă „în fiecare”, dar terminația se schimbă după genul substantivului: vezi cardul următor.'
    example_gloss:
    - Gătesc pentru prieteni în fiecare săptămână.
    - Fac sport în fiecare weekend.
  de.a1.unit54.lesson03.teach.die_woche_jede:
    title: Jede sau jedes
    gloss: Die Woche este feminin, deci se spune jede Woche. Das Wochenende este neutru, deci se spune jedes Wochenende.
    note: '*Woche* este feminin (*die Woche*), deci primește *jede*; *Wochenende* este neutru (*das Wochenende*), deci primește *jedes*. Învață fiecare substantiv cu articolul și vei ști terminația.'
  de.a1.unit54.lesson03.teach.was_machst_du:
    title: Întrebi despre timpul liber
    gloss: Ce faci în timpul liber?
    note: Aceasta este întrebarea de bază a unității -- folosește-o ca să întrebi pe oricine despre hobby-uri.
  de.a1.unit54.lesson04.teach.anna_wir_gehen:
    title: Anna aduce vorba despre hobby-uri
    gloss: 'Anna: Ne plimbăm des împreună. Dar ce mai faci tu în timpul liber, Felix?'
    note: '*Wir gehen oft zusammen spazieren* folosește gehen plus un al doilea verb: verbul conjugat gehen e pe locul al doilea, iar infinitivul spazieren merge la sfârșit.'
  de.a1.unit54.lesson04.teach.felix_ich_koche:
    title: Hobby-urile lui Felix
    gloss: 'Felix: Îmi place să gătesc, și acasă. Și fac des sport.'
    note: '*Auch zu Hause* (și acasă) arată că Felix gătește din plăcere, nu doar la serviciul de la restaurant.'
  de.a1.unit54.lesson04.teach.anna_kochst_du:
    title: Anna este surprinsă
    gloss: 'Anna: Gătești și acasă? Dar tu gătești deja toată ziua la serviciu!'
    note: '*Den ganzen Tag* (toată ziua) este la cazul acuzativ, de aceea der Tag devine den Tag. Duratele de timp de acest fel cer acuzativul.'
  de.a1.unit54.lesson04.teach.felix_ja_aber:
    title: Felix explică
    gloss: 'Felix: Da, dar gătitul mi se pare relaxant. Și tu, ce îți place să faci?'
    note: '*Kochen finde ich entspannend* pune Kochen pe primul loc pentru accent. Verbul rămâne pe locul al doilea, deci ich trece după el.'
  de.a1.unit54.lesson04.teach.anna_ich_lese:
    title: Hobby-urile Annei
    gloss: 'Anna: Îmi place să citesc și ascult des muzică.'
    note: Combină două verbe de hobby din lecțiile 01-02 într-o singură propoziție, cu *und* (și).
  de.a1.unit54.lesson04.teach.felix_spielst_du:
    title: Felix întreabă despre jocuri
    gloss: 'Felix: Joci și tu jocuri video?'
    note: 'O întrebare scurtă cu da/nu: verbul vine primul, spielst du ...?'
  de.a1.unit54.lesson04.teach.anna_nein_ich:
    title: Anna răspunde
    gloss: 'Anna: Nu, nu joc niciodată jocuri video. Dar desenez uneori!'
    note: '*Nie* (niciodată) și *manchmal* (uneori) din lecția 03, puse în contrast într-un singur răspuns. Ambele stau imediat după verb.'
  de.a1.unit54.lesson05.teach.felix_und_ich:
    title: Comparăm hobby-urile
    gloss: Felix și cu mine ne plimbăm des împreună. Dar avem și alte hobby-uri. Lui Felix îi place să gătească, și acasă, și face des sport. Îmi place să citesc și ascult des muzică. Desenez uneori, dar nu joc niciodată jocuri video. Ce îți place să faci în timpul liber?
    note: Mesajul Annei reia fapte din lecția 04 și se încheie cu întrebarea de bază a unității, adresată cititorului.
    glosses:
      spazieren: a se plimba
      oft: des
      zusammen: împreună
      andere: alte
      kocht: gătește
      gern: cu plăcere
      Hause: acasă
      Sport: face sport
      lese: citesc
      höre: ascult
      Musik: muzică
      zeichne: desenez
      manchmal: uneori
      spiele: joc jocuri video
      nie: niciodată
      freien: liber
      Zeit: timp
  de.a1.unit54.lesson06.teach.felix_was_machst:
    title: Felix întreabă despre weekend
    gloss: 'Felix: Ce faci în weekendul acesta?'
    note: '*Dieses Wochenende* (weekendul acesta) are terminația neutră -es, deoarece das Wochenende este neutru.'
  de.a1.unit54.lesson06.teach.anna_ich_weiss:
    title: Anna este indecisă
    gloss: 'Anna: Încă nu știu. Îmi place să citesc, dar vreau și să ies afară.'
    note: '*Nach draußen* (afară, literal „spre afară”) este o formulă uzuală pentru a spune că vrei să ieși din casă.'
  de.a1.unit54.lesson06.teach.felix_gehen_wir:
    title: Felix propune un plan
    gloss: 'Felix: Ne plimbăm împreună? După aceea gătesc eu pentru noi.'
    note: '*Danach* (după aceea) vine primul, deci verbul urmează imediat, iar subiectul după el: danach koche ich.'
  de.a1.unit54.lesson06.teach.anna_gute_idee:
    title: Anna este de acord
    gloss: 'Anna: Bună idee! Îmi place și să mă plimb, și să gătesc.'
    note: '*Gern* după verb arată că îți face plăcere ceva: ich gehe gern spazieren, ich koche gern. Merge cu aproape orice verb.'
  de.a1.unit54.lesson06.teach.felix_perfekt_dann:
    title: Felix confirmă
    gloss: 'Felix: Perfect. Atunci ne vedem sâmbătă!'
    note: 'O replică prietenoasă de încheiere, care confirmă planul pentru *Samstag* (sâmbătă). Zilele săptămânii se folosesc cu *am*: am Samstag.'
