teaching:
  de.a1.unit10.lesson01.teach.links_abbiegen:
    title: Biegen Sie links ab.
    gloss: Virați la stânga.
    note: '*abbiegen* (a vira) este un verb cu prefix separabil: prefixul *ab* trece la sfârșitul propoziției: *Biegen Sie... ab*, nu *Sie biegen ab* sau *Abbiegen Sie*.'
  de.a1.unit10.lesson01.teach.rechts_abbiegen:
    title: Biegen Sie rechts ab.
    gloss: Virați la dreapta.
    note: Același tipar de verb separabil ca la *links abbiegen*, doar cu *rechts* (dreapta).
  de.a1.unit10.lesson01.teach.geradeaus_gehen:
    title: Gehen Sie geradeaus.
    gloss: Mergeți drept înainte.
    note: '*geradeaus* înseamnă „drept înainte”; aici nu există prefix separabil, deci e un imperativ de politețe mai simplu.'
  de.a1.unit10.lesson01.teach.hier_anhalten:
    title: Halten Sie hier an.
    gloss: Opriți aici.
    note: '*anhalten* (a opri) este tot separabil: *an* trece la sfârșit, ca la *abbiegen*.'
  de.a1.unit10.lesson01.teach.ecke:
    title: Ecke
    gloss: colț
    note: '*Ecke* înseamnă „colț”; substantiv feminin: *die Ecke*.'
    example_gloss: Virați la stânga la colț.
  de.a1.unit10.lesson02.teach.wie_komme_ich_zur_bank:
    title: Wie komme ich zur Bank?
    gloss: Cum ajung la bancă?
    note: '*zur* este forma contrasă din *zu der* (dativ feminin, die Bank), la fel ca *vom* (von + dem) din Unitatea 9.'
  de.a1.unit10.lesson02.teach.geradeaus_dann_links:
    title: Gehen Sie geradeaus, dann biegen Sie an der Ecke links ab.
    gloss: Mergeți drept înainte, apoi virați la stânga la colț.
    note: '*dann* (apoi) leagă doi pași ai traseului; *an der Ecke* (la colț) folosește articolul feminin la dativ, ca în tiparul prepozițiilor de loc din Unitatea 9.'
  de.a1.unit10.lesson02.teach.ist_es_weit:
    title: Ist es weit?
    gloss: Este departe?
    note: '*weit* înseamnă „departe”.'
  de.a1.unit10.lesson02.teach.zwei_minuten:
    title: Es ist nur zwei Minuten von hier.
    gloss: Este doar la două minute de aici.
    note: '*nur* înseamnă „doar”.'
  de.a1.unit10.lesson02.teach.nicht_verfehlen:
    title: Das können Sie nicht verfehlen.
    gloss: Nu aveți cum să nu-l găsiți.
    note: '*verfehlen* înseamnă „a rata” (a nu găsi); literal: „Asta puteți nu rata.”'
  de.a1.unit10.lesson03.teach.erste_strasse:
    title: Nehmen Sie die erste Straße links.
    gloss: Luați prima stradă la stânga.
    note: '*erste* înseamnă „prima”; este un numeral ordinal, ca și în română, dar în germană primește terminație înaintea substantivului.'
  de.a1.unit10.lesson03.teach.zweite_strasse:
    title: Nehmen Sie die zweite Straße rechts.
    gloss: Luați a doua stradă la dreapta.
    note: '*zweite* înseamnă „a doua”.'
  de.a1.unit10.lesson03.teach.route_text:
    title: Wegbeschreibung zur Apotheke
    gloss: Indicații spre farmacie
    note: Câteva indicații scrise care combină mai multe expresii învățate deja.
  de.a1.unit10.lesson04.teach.line01:
    title: Felix cere indicații
    gloss: 'Felix: Scuzați-mă, cum ajung la bancă?'
    note: Aceeași formulă politicoasă de început din Unitatea 9, acum pentru a cere un traseu, nu doar un loc.
  de.a1.unit10.lesson04.teach.line02:
    title: Anna explică traseul
    gloss: 'Anna: Mergeți drept înainte, apoi virați la stânga la colț.'
    note: Un răspuns complet leagă doi pași ai traseului cu *dann*.
  de.a1.unit10.lesson04.teach.line03:
    title: Felix confirmă și mai întreabă ceva
    gloss: 'Felix: La colț la stânga, bine. Este departe?'
    note: Felix repetă indicația ca să confirme că a înțeles, apoi pune o întrebare firească.
  de.a1.unit10.lesson04.teach.line04:
    title: Anna răspunde cât de departe este
    gloss: 'Anna: Nu, este doar la două minute de aici. Nu aveți cum să nu-l găsiți.'
    note: Un răspuns complet și liniștitor.
