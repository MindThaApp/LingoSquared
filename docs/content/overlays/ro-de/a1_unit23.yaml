teaching:
  de.a1.unit23.lesson01.teach.telefon:
    title: Telefon
    gloss: telefon
    note: '*Telefon* este aparatul sau contextul convorbirii telefonice.'
    example_gloss: Telefonul este aici.
  de.a1.unit23.lesson01.teach.hier_ist:
    title: Hier ist Anna.
    gloss: Sunt Anna.
    note: La telefon, *Hier ist...* folosești ca să te prezinți.
  de.a1.unit23.lesson01.teach.anrufen:
    title: anrufen
    gloss: a telefona
    note: '*Ich rufe ... an* înseamnă „te sun”, „telefonez”.'
    example_gloss: Îl sun pe Felix.
  de.a1.unit23.lesson01.teach.wiederholen:
    title: Können Sie das bitte wiederholen?
    gloss: Puteți repeta, vă rog?
    note: Folosește această rugăminte formală când nu ai înțeles ceva.
  de.a1.unit23.lesson01.teach.langsam:
    title: Sprechen Sie bitte langsam.
    gloss: Vorbiți rar, vă rog.
    note: Forma de politețe *Sie* păstrează rugămintea politicoasă.
  de.a1.unit23.lesson02.teach.nachricht:
    title: Nachricht
    gloss: mesaj
    note: '*Nachricht* poate însemna un mesaj text sau un mesaj scris.'
    example_gloss: Scriu un mesaj.
  de.a1.unit23.lesson02.teach.wegen:
    title: Ich rufe wegen des Treffens an.
    gloss: Sun în legătură cu întâlnirea.
    note: Învață expresia întreagă ca motiv simplu pentru un apel.
  de.a1.unit23.lesson02.teach.ihnen:
    title: Ich schreibe Ihnen eine Nachricht.
    gloss: Vă scriu un mesaj.
    note: '*Ihnen* este forma de politețe, la dativ, pentru „vouă”, „dumneavoastră”.'
  de.a1.unit23.lesson02.teach.text_message:
    title: Kurze Nachricht
    gloss: mesaj scurt
    note: Mesajul confirmă ora și locul.
    example_gloss: Ne întâlnim la ora nouă.
  de.a1.unit23.lesson02.teach.line01:
    title: Anna răspunde la telefon
    gloss: 'Anna: Bună, sunt Anna.'
    note: Anna răspunde la apel și își spune numele.
    example_gloss: Bună, sunt Anna.
  de.a1.unit23.lesson02.teach.line02:
    title: Felix spune motivul apelului
    gloss: 'Felix: Bună ziua, Anna. Sun în legătură cu întâlnirea. Ne întâlnim la ora nouă în fața cafenelei.'
    note: Felix spune de ce sună și indică ora și locul.
    example_gloss: Sun în legătură cu întâlnirea.
  de.a1.unit23.lesson02.teach.line03:
    title: Anna îl roagă pe Felix să repete
    gloss: 'Anna: Scuzați-mă, puteți repeta, vă rog?'
    note: Anna îl roagă pe Felix să repete informația.
    example_gloss: Scuzați-mă, puteți repeta, vă rog?
  de.a1.unit23.lesson02.teach.line04:
    title: Felix repetă detaliile
    gloss: 'Felix: Da. Ne întâlnim la ora nouă în fața cafenelei.'
    note: Felix repetă ora și locul.
    example_gloss: Ne întâlnim la ora nouă.
  de.a1.unit23.lesson02.teach.line05:
    title: Anna promite un mesaj
    gloss: 'Anna: Mulțumesc. Vă scriu un mesaj.'
    note: Anna spune că va scrie un mesaj.
    example_gloss: Vă scriu un mesaj.
