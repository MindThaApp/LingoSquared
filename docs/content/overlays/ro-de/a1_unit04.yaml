teaching:
  de.a1.unit04.lesson01.teach.montag:
    title: Montag
    gloss: luni
    note: În țările vorbitoare de germană, *Montag* este prima zi a săptămânii, ca în România, nu duminica.
    example_gloss: Am timp luni.
  de.a1.unit04.lesson01.teach.dienstag:
    title: Dienstag
    gloss: marți
    note: '*Dienstag* este a doua zi a săptămânii.'
    example_gloss: Am timp marți.
  de.a1.unit04.lesson01.teach.mittwoch:
    title: Mittwoch
    gloss: miercuri
    note: '*Mittwoch* înseamnă literal „mijlocul săptămânii” și chiar este ziua din mijlocul săptămânii de lucru.'
    example_gloss: Am timp miercuri.
  de.a1.unit04.lesson01.teach.donnerstag:
    title: Donnerstag
    gloss: joi
    note: '*Donnerstag* are numele după zeul germanic Donar (Thor).'
    example_gloss: Am timp joi.
  de.a1.unit04.lesson01.teach.freitag:
    title: Freitag
    gloss: vineri
    note: '*Freitag* are numele după zeița germanică Frigg.'
    example_gloss: Am timp vineri.
  de.a1.unit04.lesson01.teach.samstag:
    title: Samstag
    gloss: sâmbătă
    note: '*Samstag* este cuvântul standard pentru sâmbătă în cea mai mare parte a Germaniei; *Sonnabend* este o variantă regională (nordul și estul Germaniei).'
    example_gloss: Am timp sâmbătă.
  de.a1.unit04.lesson01.teach.sonntag:
    title: Sonntag
    gloss: duminică
    note: '*Sonntag* înseamnă literal „ziua soarelui”.'
    example_gloss: Am timp duminică.
  de.a1.unit04.lesson01.teach.welcher_tag:
    title: Welcher Tag ist heute?
    gloss: Ce zi este azi?
    note: '*heute* înseamnă „azi”; *Welcher Tag* = „ce zi”.'
  de.a1.unit04.lesson02.teach.januar:
    title: Januar
    gloss: ianuarie
    note: '*Januar* este prima lună a anului.'
    example_gloss: Ziua mea de naștere este în ianuarie.
  de.a1.unit04.lesson02.teach.maerz:
    title: März
    gloss: martie
    note: '*März* este a treia lună a anului.'
    example_gloss: Ziua mea de naștere este în martie.
  de.a1.unit04.lesson02.teach.mai:
    title: Mai
    gloss: mai
    note: '*Mai* este scurt și ușor de ținut minte, aproape la fel ca în română.'
    example_gloss: Ziua mea de naștere este în mai.
  de.a1.unit04.lesson02.teach.juli:
    title: Juli
    gloss: iulie
    note: '*Juli* este a șaptea lună a anului.'
    example_gloss: Ziua mea de naștere este în iulie.
  de.a1.unit04.lesson02.teach.september:
    title: September
    gloss: septembrie
    note: '*September* seamănă mult cu forma din română, dar în germană se scrie cu -mb-, iar litera finală diferă: September.'
    example_gloss: Ziua mea de naștere este în septembrie.
  de.a1.unit04.lesson02.teach.dezember:
    title: Dezember
    gloss: decembrie
    note: '*Dezember* este ultima lună a anului.'
    example_gloss: Ziua mea de naștere este în decembrie.
  de.a1.unit04.lesson02.teach.welcher_monat:
    title: Welcher Monat ist es?
    gloss: Ce lună este?
    note: '*Monat* înseamnă „lună”; *es* = „este / ea”.'
  de.a1.unit04.lesson03.teach.wievielte:
    title: Der Wievielte ist heute?
    gloss: Ce dată este azi?
    note: Literal „al câtelea este azi?” – modul standard de a întreba data în germană.
  de.a1.unit04.lesson03.teach.siebte_juli:
    title: Heute ist der siebte Juli.
    gloss: Azi este 7 iulie.
    note: 'Ca în română, germana spune mai întâi ziua, apoi luna: *der siebte Juli* = „al șaptelea (din) iulie”. Învață *der siebte Juli* ca expresie întreagă.'
  de.a1.unit04.lesson03.teach.dienstag_siebte_juli:
    title: Heute ist Dienstag, der siebte Juli.
    gloss: Azi este marți, 7 iulie.
    note: Pune ziua săptămânii înaintea datei, despărțită prin virgulă.
  de.a1.unit04.lesson03.teach.numerische_form:
    title: Man kann es auch als 7.7. schreiben.
    gloss: O poți scrie și 7.7.
    note: 'Datele numerice în germană pun mai întâi ziua, apoi luna, fiecare urmată de punct: 7.7. = 7 iulie.'
  de.a1.unit04.lesson03.teach.geburtstag_frage:
    title: Wann haben Sie Geburtstag?
    gloss: Când aveți ziua de naștere? (formal)
    note: Literal „Când aveți zi de naștere?” – germana spune că *ai* o zi de naștere.
  de.a1.unit04.lesson03.teach.geburtstag_antwort:
    title: Mein Geburtstag ist der dritte März.
    gloss: Ziua mea de naștere este pe 3 martie.
    note: '*Mein Geburtstag* = „ziua mea de naștere”; *der dritte März* = „3 martie” (mai întâi ziua, apoi luna).'
  de.a1.unit04.lesson04.teach.oeffnet:
    title: öffnet
    gloss: se deschide
    note: '*öffnet* este forma de persoana a treia singular a verbului *öffnen* (a deschide) – se folosește pentru „se deschide”, de exemplu un magazin sau o bibliotecă.'
    example_gloss: Magazinul se deschide luni.
  de.a1.unit04.lesson04.teach.wieder:
    title: wieder
    gloss: din nou
    note: '*wieder* înseamnă „din nou” – aici se folosește pentru a întreba când se redeschide ceva.'
    example_gloss: Biblioteca se redeschide luni.
  de.a1.unit04.lesson04.teach.die:
    title: die
    gloss: articolul hotărât (feminin / plural)
    note: '*die* este articolul hotărât pentru feminin singular și pentru toate substantivele la plural – aici stă lângă substantivul feminin *Bibliothek*.'
    example_gloss: Biblioteca este mare.
  de.a1.unit04.lesson04.teach.bibliothek:
    title: Bibliothek
    gloss: bibliotecă
    note: '*Bibliothek* este un substantiv feminin (*die Bibliothek*).'
    example_gloss: Merg la bibliotecă.
  de.a1.unit04.lesson04.teach.am:
    title: am
    gloss: în / la (cu articol)
    note: '*am* este o contragere a lui *an dem*, folosită înaintea zilelor săptămânii și a datelor (*am Montag* = „luni”).'
    example_gloss: Luni lucrez.
  de.a1.unit04.lesson04.teach.den:
    title: den
    gloss: articolul hotărât (masculin, acuzativ)
    note: '*den* este forma de acuzativ masculin a lui *der*. Apare în datele complete după o zi a săptămânii, ca în *am Donnerstag, den neunten Juli* – învață-l ca model fix, fără să analizezi cazul la acest nivel. (Vei vedea și *dem* după *am*, la fel de corect.)'
    example_gloss: Ne întâlnim joi, 9 iulie.
  de.a1.unit04.lesson04.teach.neunten:
    title: neunten
    gloss: al nouălea
    note: '*neunten* este forma flexionată a numeralului ordinal de la *neun* (nouă), folosită în date: *der neunte Juli* (nominativ) devine *den neunten Juli* în această construcție a datei complete.'
    example_gloss: Ziua mea de naștere este pe 9 iulie.
  de.a1.unit04.lesson04.teach.line01:
    title: Felix întreabă data
    gloss: 'Felix spune: Ce dată este azi?'
  de.a1.unit04.lesson04.teach.line02:
    title: Anna spune data
    gloss: 'Anna spune: Azi este marți, 7 iulie.'
  de.a1.unit04.lesson04.teach.line03:
    title: Felix întreabă despre bibliotecă
    gloss: 'Felix spune: Când se deschide din nou biblioteca?'
  de.a1.unit04.lesson04.teach.line04:
    title: Anna răspunde
    gloss: 'Anna spune: Se deschide din nou joi, 9 iulie.'
    note: '*Sie* înseamnă aici „ea” și se referă la *die Bibliothek* (substantiv feminin).'
  de.a1.unit04.lesson04.teach.line05:
    title: Felix își ia rămas-bun
    gloss: 'Felix spune: Bine, ne vedem joi.'
    note: '*bis Donnerstag* = „până joi” – o formulă uzuală pentru „ne vedem joi”.'
  de.a1.unit04.lesson04.teach.notiz:
    title: Un bilet pe ușă
    gloss: Închis până joi, 9 iulie.
    note: '*Geschlossen* înseamnă „închis”.'
