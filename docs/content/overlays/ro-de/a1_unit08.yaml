    title: 'Cumpărături: prețuri și cantități'
teaching:
  de.a1.unit08.lesson01.teach.ein_pfund:
    title: ein Pfund Äpfel
    gloss: o livră de mere
    note: '*Pfund* se mai folosește încă frecvent în Germania în vorbirea informală; un *Pfund* german are exact 500 g (jumătate de kilogram), deși țara folosește oficial sistemul metric.'
  de.a1.unit08.lesson01.teach.ein_dutzend:
    title: ein Dutzend Eier
    gloss: o duzină de ouă
    note: '*Dutzend* înseamnă duzină (douăsprezece).'
  de.a1.unit08.lesson01.teach.eine_flasche:
    title: eine Flasche Wasser
    gloss: o sticlă de apă
    note: '*Flasche* înseamnă sticlă.'
  de.a1.unit08.lesson01.teach.eine_tuete:
    title: eine Tüte Reis
    gloss: o pungă de orez
    note: '*Tüte* înseamnă pungă.'
  de.a1.unit08.lesson01.teach.ein_kilo:
    title: ein Kilo Tomaten
    gloss: un kilogram de roșii
    note: '*Kilo* este unitatea metrică standard de greutate și se folosește mult mai des decât *Pfund*, în afara cantităților mici, de zi cu zi.'
  de.a1.unit08.lesson02.teach.was_kosten_die_aepfel:
    title: Was kosten die Äpfel?
    gloss: Cât costă merele?
    note: '*kosten* înseamnă „a costa” – literal: „Ce costă merele?”'
  de.a1.unit08.lesson02.teach.sie_kosten_zwei_euro:
    title: Sie kosten zwei Euro das Pfund.
    gloss: Costă doi euro livra.
    note: '*Sie* înseamnă aici „ele” (se referă la mere), nu „dumneavoastră” de politețe – *Sie* de politețe și *sie* de plural („ele/ei”) au exact aceeași formă a verbului (*kosten*), iar la începutul propoziției ambele se scriu cu majusculă; doar contextul le deosebește: subiectul despre care se vorbește aici sunt merele, nu o persoană.'
  de.a1.unit08.lesson02.teach.kann_ich_zwei_pfund:
    title: Kann ich zwei Pfund haben, bitte?
    gloss: Pot să iau două livre, vă rog?
    note: Un model de cerere politicoasă, asemănător cu *Ich möchte..., bitte* din Unitatea 7.
  de.a1.unit08.lesson02.teach.ist_es_frisch:
    title: Ist es frisch?
    gloss: Este proaspăt?
    note: '*frisch* înseamnă proaspăt. *es* se referă aici la un substantiv neutru (ca das Brot); pentru un produs masculin ai spune *Ist er frisch?* (der Reis), iar pentru unul feminin *Ist sie frisch?* (die Milch) – pronumele se schimbă după genul substantivului, nu rămâne mereu *es*.'
  de.a1.unit08.lesson03.teach.pro_pfund:
    title: pro Pfund
    gloss: per livră
    note: '*pro* înseamnă „per” – se folosește atât pe etichetele de preț, cât și când spunem prețurile.'
    example_gloss: Merele costă doi euro per livră.
  de.a1.unit08.lesson03.teach.preisschild_text:
    title: Markt-Preisschild
    gloss: Panou de prețuri de la piață
    note: Un panou simplu de prețuri, cu trei produse și prețul lor pe unitate.
  de.a1.unit08.lesson04.teach.das_macht_acht_euro:
    title: Das macht acht Euro.
    gloss: Asta face opt euro.
    note: '*Das macht...* este modul obișnuit de a spune prețul total, deja întâlnit în Unitatea 7.'
  de.a1.unit08.lesson04.teach.line01:
    title: Felix întreabă prețul
    gloss: 'Felix spune: Cât costă merele?'
    note: Aceeași întrebare ca în lecția 2, acum într-o conversație reală.
  de.a1.unit08.lesson04.teach.line02:
    title: Anna spune prețul
    gloss: 'Anna spune: Costă doi euro livra.'
    note: Un răspuns complet indică prețul pe unitate.
  de.a1.unit08.lesson04.teach.line03:
    title: Felix face comanda
    gloss: 'Felix spune: Bine, pot să iau două livre, vă rog?'
    note: '*Gut* înseamnă aici „bine / în regulă”: acceptă prețul înainte de a comanda.'
  de.a1.unit08.lesson04.teach.line04:
    title: Anna întreabă dacă mai dorește ceva
    gloss: 'Anna spune: Desigur. Altceva?'
    note: '*Natürlich* înseamnă „desigur / bineînțeles”.'
  de.a1.unit08.lesson04.teach.line05:
    title: Felix mai comandă ceva
    gloss: 'Felix spune: Da, și o duzină de ouă.'
    note: '*auch* înseamnă „și / de asemenea”.'
  de.a1.unit08.lesson04.teach.line06:
    title: Anna spune totalul
    gloss: 'Anna spune: Face opt euro.'
    note: Două livre de mere (4€) plus o duzină de ouă (4€) fac în total opt euro.
