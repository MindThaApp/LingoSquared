teaching:
  de.a1.unit17.lesson01.teach.kopfschmerzen:
    title: Kopfschmerzen
    gloss: durere de cap
    note: '*Kopfschmerzen* este la plural ca formă, dar se folosește pentru „o durere de cap”.'
    example_gloss: Mă doare capul.
  de.a1.unit17.lesson01.teach.bauchschmerzen:
    title: Bauchschmerzen
    gloss: durere de burtă
    note: '*Bauch* este burta/stomacul; *Schmerzen* înseamnă dureri.'
    example_gloss: Mă doare burta.
  de.a1.unit17.lesson01.teach.hals:
    title: Hals
    gloss: gât
    note: '*Hals* poate însemna „gât" (în față, gâtlej) sau „gât" ca parte a corpului, în funcție de context.'
    example_gloss: Mă doare gâtul.
  de.a1.unit17.lesson01.teach.weh:
    title: Mein Kopf tut weh.
    gloss: Mă doare capul.
    note: 'În germană, partea corpului este subiectul: *tut weh* („face rău"), spre deosebire de româna „mă doare capul".'
    example_gloss: Mă doare burta.
  de.a1.unit17.lesson01.teach.mir_ist_schlecht:
    title: Mir ist schlecht.
    gloss: Mi-e rău.
    note: Nu traduce cuvânt cu cuvânt „sunt rău"; *Mir ist schlecht* este expresia naturală.
    example_gloss: Mi-e rău; mă doare burta.
  de.a1.unit17.lesson02.teach.brauchen_sie_hilfe:
    title: Brauchen Sie Hilfe?
    gloss: Aveți nevoie de ajutor?
    note: Forma de politețe *Sie* păstrează întrebarea politicoasă.
  de.a1.unit17.lesson02.teach.ich_brauche:
    title: Ich brauche Wasser.
    gloss: Am nevoie de apă.
    note: '*brauche* înseamnă „a avea nevoie", nu „a folosi".'
    example_gloss: 'În context: Am nevoie de apă și de o pauză.'
  de.a1.unit17.lesson02.teach.pause:
    title: Pause
    gloss: pauză
    note: '*eine Pause* este o scurtă odihnă sau pauză.'
    example_gloss: Am nevoie de o pauză.
  de.a1.unit17.lesson02.teach.health_instruction:
    title: Trinken Sie Wasser.
    gloss: Beți apă. Faceți o pauză.
    note: Forma de politețe *Sie* păstrează indicația politicoasă.
    example_gloss: Faceți o pauză.
  de.a1.unit17.lesson02.teach.gesundheit_text:
    title: Annas Problem
    gloss: Problema Annei
    note: Textul scurt prezintă simptomul și nevoia imediată.
    example_gloss: Ea are nevoie de apă.
  de.a1.unit17.lesson02.teach.line01:
    title: Felix o întreabă pe Anna cum se simte
    gloss: 'Felix: Anna, vă simțiți bine?'
    note: Felix folosește cu Anna forma de politețe *Ihnen*.
  de.a1.unit17.lesson02.teach.line02:
    title: Anna spune care este problema
    gloss: 'Anna: Nu, am dureri de cap.'
    note: Răspunsul exprimă simplu simptomul.
  de.a1.unit17.lesson02.teach.line03:
    title: Felix oferă ajutor
    gloss: 'Felix: Aveți nevoie de ajutor?'
    note: O ofertă simplă de ajutor.
  de.a1.unit17.lesson02.teach.line04:
    title: Anna spune de ce are nevoie
    gloss: 'Anna: Da, vă rog. Am nevoie de apă și de o pauză.'
    note: Răspunsul conține *Ja, bitte* și numește nevoile imediate.
    example_gloss: 'În context: Am nevoie de apă și de o pauză.'
