    title: Planul lui Jonas
    gloss: 'Jonas: Atunci alerg. După aceea joc și fotbal.'
    note: '*Danach* (după aceea) stă pe primul loc, deci verbul vine imediat după el: danach spiele ich.'
  de.a1.unit59.lesson06.teach.lena_ich_schwimme:
    title: Planul Lenei
    gloss: 'Lena: Prefer să înot, dar vin și eu în parc.'
    note: '*Lieber* (mai degrabă) stă imediat după verb: ich schwimme lieber.'
