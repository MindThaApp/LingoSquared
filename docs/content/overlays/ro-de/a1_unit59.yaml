  de.a1.unit59.lesson05.teach.anna_ruft_felix:
    title: Cine ce folosește?
    gloss: Anna îl sună pe Felix în fiecare zi. Ea folosește telefonul, nu o aplicație. Felix nu are computer acasă, dar folosește internetul pe telefon. Jonas verifică prognoza meteo în fiecare dimineață. Apoi merge la alergat. Lena îi trimite deseori Annei un mesaj. Tu îți folosești și tu telefonul în fiecare zi?
    note: Compară obiceiurile celor patru personaje legate de dispozitive, la fel ca textul comparativ din unitatea despre sport.
