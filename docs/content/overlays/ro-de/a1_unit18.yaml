teaching:
  de.a1.unit18.lesson01.teach.beruf:
    title: Beruf
    gloss: profesie / meserie
    note: '*Beruf* este cuvântul general pentru profesia cuiva.'
    example_gloss: Sunt inginer de meserie.
  de.a1.unit18.lesson01.teach.ingenieur:
    title: Ingenieur
    gloss: inginer
    note: Ca în română („Sunt inginer"), germana spune de obicei *Ich bin Ingenieur*, fără articol.
    example_gloss: Sunt inginer.
  de.a1.unit18.lesson01.teach.lehrerin:
    title: Lehrerin
    gloss: profesoară
    note: '*Lehrerin* este denumirea feminină a profesiei.'
    example_gloss: Ea este profesoară.
  de.a1.unit18.lesson01.teach.kellnerin:
    title: Kellnerin
    gloss: ospătăriță / chelneriță
    note: Se potrivește cu munca Annei la cafenea, pe care o cunoști deja.
    example_gloss: Anna este ospătăriță la cafenea.
  de.a1.unit18.lesson01.teach.was_machen_sie:
    title: Was machen Sie beruflich?
    gloss: Cu ce vă ocupați?
    note: '*beruflich* face ca întrebarea să se refere la muncă, nu la activități în general.'
  de.a1.unit18.lesson02.teach.buero:
    title: Büro
    gloss: birou
    note: '*im Büro* înseamnă „la birou".'
    example_gloss: Lucrez la birou.
  de.a1.unit18.lesson02.teach.arbeite:
    title: Ich arbeite im Cafe.
    gloss: Lucrez la cafenea.
    note: '*arbeite* este forma pentru persoana I: eu lucrez.'
  de.a1.unit18.lesson02.teach.bringe:
    title: Ich bringe Kaffee und Tee.
    gloss: Aduc cafea și ceai.
    note: '*bringe* exprimă o activitate simplă de la locul de muncă.'
  de.a1.unit18.lesson02.teach.work_profile:
    title: Arbeitsprofile
    gloss: profiluri de muncă
    note: Profilul indică meseria, locul de muncă și activitatea.
    example_gloss: El lucrează la birou.
  de.a1.unit18.lesson02.teach.line01:
    title: Anna întreabă despre meserie
    gloss: 'Anna: Cu ce vă ocupați?'
    note: O întrebare politicoasă despre muncă.
  de.a1.unit18.lesson02.teach.line02:
    title: Felix își descrie munca
    gloss: 'Felix: Sunt inginer. Lucrez la birou. Dar dumneavoastră?'
    note: Felix spune ce meserie are și unde lucrează.
    example_gloss: Lucrez la birou.
  de.a1.unit18.lesson02.teach.line03:
    title: Anna povestește despre jobul ei de la cafenea
    gloss: 'Anna: Lucrez la cafenea. Aduc cafea și ceai.'
    note: Anna spune unde lucrează și ce face acolo.
    example_gloss: 'În context: Aduc cafea și ceai.'
