course:
  title: Germană A1
  description: 'Germană pentru începători: descrierea înfățișării unei persoane, adică impresia de înălțime și vârstă, culoarea părului și a ochilor, întrebarea de bază Wie sieht ... aus? și compararea înfățișării a două persoane.'
units:
  de.a1.unit55.aussehen:
    title: Descrierea înfățișării
lessons:
  de.a1.unit55.lesson01.gross_klein_alt_und:
    title: Înalt, scund, bătrân și tânăr
  de.a1.unit55.lesson02.haare_beschreiben:
    title: Descrierea părului
  de.a1.unit55.lesson03.augen_und_wie_jemand:
    title: Ochii și cum arată cineva?
  de.a1.unit55.lesson04.anna_beschreibt_nina:
    title: Anna o descrie pe Nina
  de.a1.unit55.lesson05.jonas_und_lena_im:
    title: Comparație între Jonas și Lena
  de.a1.unit55.lesson06.felix_erkennt_nina:
    title: Felix o recunoaște pe Nina
teaching:
  de.a1.unit55.lesson01.teach.gross_klein:
    title: Înalt și scund
    gloss: înalt / scund
    note: '*Groß* descrie o persoană înaltă, iar *klein* una scundă. Pentru oameni, germana folosește groß (mare), nu lang (lung).'
    example_gloss:
    - Lena este înaltă.
    - Jonas este scund.
  de.a1.unit55.lesson01.teach.alt_jung:
    title: Bătrân și tânăr
    gloss: bătrân / tânăr
    note: '*Alt* și *jung* descriu aici o impresie generală de vârstă, nu un număr exact de ani.'
    example_gloss:
    - Bunicul este bătrân.
    - Felix este tânăr.
  de.a1.unit55.lesson01.teach.alt_kann_eine:
    title: 'Alt: un număr sau o impresie'
    gloss: Alt poate însoți un număr de ani, ca în Ich bin dreißig Jahre alt, sau poate exprima o impresie generală, ca în Opa ist alt.
    note: Poți întreba vârsta exactă a cuiva cu *Wie alt bist du?* Aici *alt* descrie cât de bătrân ARATĂ cineva, fără vreun număr.
  de.a1.unit55.lesson01.teach.lena_ist_gross:
    title: Lena este înaltă, iar Jonas este scund
    gloss: Lena este înaltă, iar Jonas este scund.
    note: O propoziție simplă cu *und* (și), care pregătește comparația directă din lecția 05.
  de.a1.unit55.lesson02.teach.die_haare:
    title: Părul
    gloss: părul
    note: '*Haare* este un substantiv la plural: *die Haare*. Germana are și singularul das Haar, dar pentru părul de pe cap se spune de obicei Haare.'
    example_gloss: Felix are părul scurt și negru.
  de.a1.unit55.lesson02.teach.blond_braun_grau:
    title: Blond, șaten și cărunt
    gloss: blond / șaten / cărunt
    note: 'Trei culori ale părului: blond, braun, grau. Înaintea unui substantiv la plural fără articol primesc terminația -e: blonde, braune, graue Haare.'
    example_gloss:
    - Anna are părul blond.
    - Jonas are părul șaten.
    - Bunicul are părul cărunt.
  de.a1.unit55.lesson02.teach.lang_kurz:
    title: Lung și scurt (părul)
    gloss: lung / scurt (părul)
    note: '*Kurz* (scurt) și *lang* (lung) descriu lungimea părului. Din nou terminația -e: kurze Haare, lange Haare.'
    example_gloss:
    - Lena are părul lung.
    - Jonas are părul scurt.
  de.a1.unit55.lesson02.teach.haare_ist_plural:
    title: Haare primește terminația -e
    gloss: 'Haare este la plural și fără articol, deci adjectivul are terminația -e: kurze Haare, lange Haare, blonde Haare, braune Haare, graue Haare, schwarze Haare.'
    note: Fără articol, un adjectiv aflat înaintea unui substantiv la plural primește terminația -e. Este același tipar ca la *Augen* în lecția 03.
  de.a1.unit55.lesson02.teach.anna_hat_lange:
    title: 'Ihre: ei / al ei'
    gloss: 'Ihre înseamnă aici „ei”, „al ei”: ihre Haare = părul ei. Anna are părul lung, iar părul ei este blond.'
    note: '*Ihre* (cu i mic) este posesivul pentru „ea” și se acordă cu substantivul la plural Haare. Cu I mare, *Ihre* înseamnă „dumneavoastră” (formal).'
  de.a1.unit55.lesson02.teach.felix_hat_kurze:
    title: Felix are părul scurt și negru
    gloss: Felix are părul scurt și negru.
    note: 'Reia *schwarz* (negru), acum pentru păr: schwarze Haare.'
  de.a1.unit55.lesson02.teach.anna_hat_lange_2:
    title: Anna are părul lung și blond
    gloss: Anna are părul lung și blond.
    note: Combină într-o propoziție naturală vocabularul lecției despre lungime și culoare.
  de.a1.unit55.lesson03.teach.die_augen:
    title: Ochii
    gloss: ochii
    note: '*Augen* este pluralul lui *das Auge*. Germana folosește de obicei pluralul, pentru că avem doi ochi.'
    example_gloss: Felix are ochi căprui.
  de.a1.unit55.lesson03.teach.blau_braun_gruen:
    title: Albastru, căprui și verde
    gloss: albastru / căprui / verde
    note: 'Culori: blau (albastru), braun (căprui, maro) și grün (verde).'
    example_gloss:
    - Anna are ochi albaștri.
    - Jonas are ochi căprui.
    - Lena are ochi verzi.
  de.a1.unit55.lesson03.teach.augen_ist_plural:
    title: Augen primește -e
    gloss: 'Augen este la plural, deci adjectivul are terminația -e: blaue Augen, braune Augen, grüne Augen.'
    note: 'Aceeași regulă ca la Haare: lipsa articolului și un substantiv la plural dau terminația -e.'
  de.a1.unit55.lesson03.teach.wie_sieht_anna:
    title: Cum arată Anna?
    gloss: Cum arată Anna?
    note: '*Wie sieht ... aus?* este întrebarea centrală a acestei unități. *Aussehen* este verb cu prefix separabil: sieht ... aus.'
  de.a1.unit55.lesson03.teach.anna_hat_lange:
    title: Anna are părul lung și blond și ochi albaștri
    gloss: Anna are părul lung și blond și ochi albaștri.
    note: Un răspuns model care combină părul și ochii într-o singură propoziție cu *und*.
  de.a1.unit55.lesson04.teach.anna_ein_neues:
    title: Anna o prezintă pe Nina
    gloss: 'Anna: O fată nouă vine la cafeneaua de limbi. O cheamă Nina.'
    note: '*Ein neues Mädchen kommt* introduce o persoană nouă. După *kommt*, direcția *ins* (in das) Sprachcafé cere acuzativul.'
  de.a1.unit55.lesson04.teach.felix_okay_wie:
    title: Felix întreabă cum arată ea
    gloss: 'Felix: Bine! Cum arată?'
    note: 'Reia întrebarea centrală a unității, acum cu *sie* (ea) în loc de un nume: wie sieht sie aus?'
  de.a1.unit55.lesson04.teach.anna_sie_ist:
    title: 'Anna o descrie pe Nina: înălțimea și părul'
    gloss: 'Anna: Este scundă și are părul scurt și blond.'
    note: 'Îl combină pe *klein* cu vocabularul pentru păr din lecția 02. Al doilea *sie* se omite: sie ist klein und hat ...'
  de.a1.unit55.lesson04.teach.felix_und_ihre:
    title: Felix întreabă despre ochii ei
    gloss: 'Felix: Și ochii ei?'
    note: '*Ihre* înseamnă aici „ei” (posesiv), nu este o formă de politețe. Se acordă cu pluralul Augen.'
  de.a1.unit55.lesson04.teach.anna_sie_hat:
    title: Anna descrie ochii Ninei
    gloss: 'Anna: Are ochi verzi.'
    note: Reia expresia *grüne Augen* din lecția 03.
  de.a1.unit55.lesson04.teach.felix_danke_dann:
    title: Felix o va recunoaște
    gloss: 'Felix: Mulțumesc! Atunci sigur o recunosc.'
    note: '*Dann erkenne ich sie bestimmt* înseamnă „atunci sigur o recunosc”. După *dann* verbul este pe locul al doilea: dann erkenne ich sie.'
  de.a1.unit55.lesson05.teach.jonas_und_lena:
    title: 'Jonas și Lena: o comparație'
    gloss: Jonas și Lena sunt frate și soră, dar arată diferit. Jonas este scund și are părul scurt și castaniu și ochi căprui. Lena este mai înaltă decât Jonas și are părul lung și castaniu și ochi verzi. Tu cum arăți?
    note: O scurtă comparație care reia toate cuvintele pentru culori și lungime învățate până acum și se încheie cu întrebarea centrală a unității, adresată cititorului.
    glosses:
      Bruder: frate
      Schwester: soră
      sehen: a arăta
      unterschiedlich: diferit
      klein: scund
      kurze: scund
      braune: castaniu
      Haare: păr
      Augen: ochi
      größer: mai înalt
      lange: lung
      grüne: verde
      aus: (parte din „aussehen” = a arăta, a avea aspectul)
  de.a1.unit55.lesson05.teach.das_muster_kennst:
    title: Comparativul, din nou
    gloss: 'Știi deja structura adjectiv + -er + als (decât). Aici o folosești pentru persoane: Lena este mai înaltă decât Jonas.'
    note: 'Aceeași structură *-er + als* ca în unitatea despre comparații. Din groß devine größer: vocala primește Umlaut.'
  de.a1.unit55.lesson05.teach.lena_hat_laengere:
    title: Lena are părul mai lung decât Jonas
    gloss: Lena are părul mai lung decât Jonas.
    note: '*Längere Haare*: länger primește -e înaintea unui substantiv la plural fără articol, iar lang primește Umlaut la comparativ.'
  de.a1.unit55.lesson05.teach.ich_habe_kurze:
    title: Am părul scurt și castaniu
    gloss: Am părul scurt și castaniu.
    note: O propoziție model la persoana I cu *Ich habe ...*, utilă când îți descrii propriul aspect.
  de.a1.unit55.lesson06.teach.felix_schau_mal:
    title: Felix o zărește pe Nina
    gloss: 'Felix: Uite, aceea e Nina? Are părul scurt și blond și ochi verzi.'
    note: '*Schau mal* („uită-te puțin”) este o formulă prietenoasă de a arăta ceva. Este imperativul pentru du.'
  de.a1.unit55.lesson06.teach.anna_ja_das:
    title: Anna confirmă
    gloss: 'Anna: Da, e Nina!'
    note: O confirmare scurtă și naturală.
  de.a1.unit55.lesson06.teach.nina_hallo_bist:
    title: Nina îl salută pe Felix
    gloss: 'Nina: Salut, tu ești Felix?'
    note: 'O întrebare simplă, informală: *bist du ...?* (ești tu ...?). Bist este forma pentru du a verbului sein.'
  de.a1.unit55.lesson06.teach.felix_ja_freut:
    title: Felix o salută la rândul lui pe Nina
    gloss: 'Felix: Da! Îmi pare bine, Nina.'
    note: '*Freut mich* este formula obișnuită la prima întâlnire, ca în unitatea 2. Cuiva pe care îl cunoști deja i-ai spune *Schön, dich zu sehen*.'
  de.a1.unit55.lesson06.teach.nina_freut_mich:
    title: Nina răspunde la salut
    gloss: 'Nina: Și mie îmi pare bine!'
    note: 'Încheie dialogul: Felix a recunoscut-o pe Nina după descrierea Annei.'
