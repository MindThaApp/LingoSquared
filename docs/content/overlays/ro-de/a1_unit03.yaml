    title: elf, zwölf
    gloss: unsprezece, doisprezece
    note: '*elf* și *zwölf* sunt neregulate: nu urmează modelul folosit de la 13 încolo.'
    example_gloss:
    - Numărul casei mele este unsprezece.
    - Numărul casei mele este doisprezece.
  de.a1.unit03.lesson02.teach.dreizehn_bis_sechzehn:
    title: dreizehn, vierzehn, fünfzehn, sechzehn
    gloss: treisprezece, paisprezece, cincisprezece, șaisprezece
    note: 'De la 13 în sus, numerele germane se formează din cifra de bază + *-zehn* (terminația este -zehn, nu *-teen*). Atenție: *sechzehn*, nu *sechszehn* – *s*-ul final dispare.'
    example_gloss:
    - Numărul casei mele este treisprezece.
    - Numărul casei mele este paisprezece.
    - Numărul casei mele este cincisprezece.
    - Numărul casei mele este șaisprezece.
  de.a1.unit03.lesson02.teach.siebzehn_bis_zwanzig:
    title: siebzehn, achtzehn, neunzehn, zwanzig
    gloss: șaptesprezece, optsprezece, nouăsprezece, douăzeci
    note: 'Atenție: *siebzehn*, nu *siebenzehn* – se pierde terminația *-en* din *sieben* înaintea lui *-zehn*.'
    example_gloss:
    - Numărul casei mele este șaptesprezece.
    - Numărul casei mele este optsprezece.
    - Numărul casei mele este nouăsprezece.
    - Numărul casei mele este douăzeci.
  de.a1.unit03.lesson03.teach.dreissig_bis_fuenfzig:
    title: dreißig, vierzig, fünfzig
    gloss: treizeci, patruzeci, cincizeci
    note: 'Atenție: *dreißig*, nu *dreizig* – numărul 30 se termină în *-ßig*, nu în *-zig* (și 20, *zwanzig*, este neregulat).'
    example_gloss:
    - Costă treizeci de euro.
    - Costă patruzeci de euro.
    - Costă cincizeci de euro.
  de.a1.unit03.lesson03.teach.sechzig_bis_neunzig:
    title: sechzig, siebzig, achtzig, neunzig
    gloss: șaizeci, șaptezeci, optzeci, nouăzeci
    note: 'De la 40 încolo, modelul este regulat: cifră + *-zig* (cu aceleași scurtări *sech-*/*sieb-* ca la 16 și 17).'
    example_gloss:
    - Costă șaizeci de euro.
    - Costă șaptezeci de euro.
    - Costă optzeci de euro.
    - Costă nouăzeci de euro.
  de.a1.unit03.lesson03.teach.hundert:
    title: hundert
    gloss: o sută
    note: '*hundert* singur înseamnă „o sută”; nu ai nevoie de *ein* înaintea lui (*einhundert* este posibil, dar mai rar în vorbirea de zi cu zi).'
    example_gloss: Costă o sută de euro.
  de.a1.unit03.lesson03.teach.einundzwanzig:
    title: einundzwanzig
    gloss: douăzeci și unu
    note: 'Numerele germane compuse de la 21 la 99 au ordinea inversă față de română: cifra unităților + *und* („și”) + zecile, totul într-un SINGUR cuvânt. *einundzwanzig* = *ein* (unu) + *und* (și) + *zwanzig* (douăzeci), adică literal „unu-și-douăzeci”.'
  de.a1.unit03.lesson03.teach.zweiunddreissig:
    title: zweiunddreißig
    gloss: treizeci și doi
    note: 'Același model: *zwei* (doi) + *und* + *dreißig* (treizeci) = „doi-și-treizeci” = 32.'
  de.a1.unit03.lesson04.teach.wie_alt_sind_sie:
    title: Wie alt sind Sie?
    gloss: Câți ani aveți? (formal)
    note: '*alt* înseamnă „în vârstă”; literal: „cât de în vârstă sunteți”. În română întrebăm „Câți ani aveți?”.'
  de.a1.unit03.lesson04.teach.wie_alt_bist_du:
    title: Wie alt bist du?
    gloss: Câți ani ai? (informal)
    note: Varianta informală, cu *du*.
  de.a1.unit03.lesson04.teach.ich_bin_jahre_alt:
    title: Ich bin achtundzwanzig Jahre alt.
    gloss: Am douăzeci și opt de ani.
    note: '*Jahre alt* („ani în vârstă”) stă întotdeauna după număr. Germana spune literal „Sunt de douăzeci și opt de ani în vârstă”, în timp ce româna folosește verbul „a avea”: „Am douăzeci și opt de ani”.'
  de.a1.unit03.lesson05.teach.line01:
    title: Felix întreabă câți ani are Anna
    gloss: 'Felix spune: Câți ani aveți, dacă pot întreba?'
    note: '*wenn ich fragen darf* („dacă pot întreba”) atenuează o întrebare care altfel ar suna cam direct – o notă politicoasă, potrivită pentru registrul formal *Sie*, pe care îl păstrează.'
  de.a1.unit03.lesson05.teach.line02:
    title: Anna răspunde și întreabă la rândul ei
    gloss: 'Anna spune: Am douăzeci și opt de ani. Dar dumneavoastră?'
    note: Anna își spune vârsta și întoarce întrebarea, ca în Unitatea 2.
  de.a1.unit03.lesson05.teach.line03:
    title: Felix răspunde
    gloss: 'Felix spune: Am treizeci și unu de ani.'
    note: Asta arată că Felix are cu trei ani mai mult decât Anna.
