  fr.a1.unit55.lesson01.teach.je_joue_au:
    title: Я играю в футбол
    gloss: Я играю в футбол.
    note: '*Jouer au* + название игры с мячом — обычный способ сказать, что ты играешь, например, в футбол. Для других видов спорта используются *faire du* или *faire de la*; см. заметку о грамматике.'
  fr.a1.unit55.lesson01.teach.faire_du_de:
    title: Faire du / de la + sport
    gloss: '*Faire du*, *de la* или *de l''* + вид спорта показывает, каким спортом ты занимаешься: *faire du yoga*, *faire de la natation*, *faire de la course à pied*. Для футбола говорят *jouer au football*.'
    note: Одна конструкция подходит для любого вида спорта — на этом уровне не нужно учить отдельный глагол для каждого.
  fr.a1.unit55.lesson02.teach.fois_par_semaine:
    title: Раз в неделю
    gloss: раз в неделю
    example_gloss: Я занимаюсь йогой два раза в неделю.
  fr.a1.unit55.lesson02.teach.tu_connais_deja:
    title: Fois par semaine и tous les jours/souvent
    gloss: Ты уже знаешь *tous les jours* (каждый день) и *souvent* (часто). *Deux fois par semaine* (два раза в неделю) — новый, более точный способ сказать, как часто что-то происходит.
    note: Расширяет лексику о частоте, уже знакомую по теме увлечений.
  fr.a1.unit55.lesson02.teach.je_fais_du:
    title: Я занимаюсь йогой два раза в неделю
    gloss: Я занимаюсь йогой два раза в неделю.
  fr.a1.unit55.lesson02.teach.mathieu_joue_souvent:
