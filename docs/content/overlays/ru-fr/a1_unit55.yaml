    title: Камиль и Леа о спорте
    gloss: Камиль занимается йогой два раза в неделю. Она любит спокойные движения. Леа не занимается йогой, но обожает плавать. Леа плавает часто, почти каждую неделю. Каким спортом занимаешься ты?
    note: Сравниваются два разных вида спорта и два разных выражения частоты, как и в тексте о животных в предыдущем уроке.
    glosses:
      fait: занимается
      deux: два
      fois: раза
      semaine: неделя
      yoga: йога
      adore: обожает
      doucement: спокойно
      bouger: двигаться
      nager: плавание
      nage: плавает
      souvent: часто
      presque: почти
      Quel: какой
      sport: спорт
