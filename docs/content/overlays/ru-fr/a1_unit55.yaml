  fr.a1.unit55.lesson04.teach.courir_est_un:
    title: Courir — неправильный глагол
    gloss: '*Courir* («бегать») — неправильный глагол: *je cours, tu cours, il court*. Конечные *s* и *t* не произносятся.'
    note: '*Courir* не спрягается по образцу правильных глаголов на *-er*, поэтому его формы стоит выучить наизусть: *je cours*, *tu cours*, *il court*.'
