    gloss: Матьё часто играет в футбол.
    note: Снова используется *souvent* (часто), уже знакомое по теме распорядка дня из прошлого урока.
  fr.a1.unit55.lesson03.teach.tu_connais_deja:
    title: Faire du sport и faire de la + вид спорта
    gloss: 'Ты уже знаешь *faire du sport* из урока о хобби (*Je fais du sport le samedi*). *Faire de la* + вид спорта называет конкретный спорт: *Je fais de la natation*. Оба варианта правильны.'
    note: '*Faire du sport* уже встречалось в уроке о хобби, это не новое. Здесь оно сравнивается с названием конкретного спорта: один способ говорить о спорте общий, другой — точный.'
