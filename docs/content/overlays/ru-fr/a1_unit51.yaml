teaching:
  fr.a1.unit51.lesson01.teach.combien_ca_coute:
    title: Спрашиваем общую стоимость
    gloss: Сколько это стоит всего?
    note: '*En tout* (всего, в сумме) показывает, что тебя интересует вся сумма целиком, а не цена одной вещи.'
  fr.a1.unit51.lesson01.teach.ca_coute_vingt:
    title: Называем общую стоимость
    gloss: Это стоит двадцать пять евро всего.
    note: В *Ça coûte* используется *ça* (это) с *coûte* — формой глагола *coûter* (стоить) для одной вещи.
  fr.a1.unit51.lesson02.teach.payer_par_carte:
    title: Оплата картой или наличными
    gloss: платить картой, платить наличными
    note: '*Payer par carte* — обычный способ сказать «платить картой», а *payer en espèces* значит «платить наличными». С *carte* используется *par*, а с *espèces* — *en*.'
    example_gloss:
    - Можно здесь заплатить картой?
    - Я плачу наличными.
  fr.a1.unit51.lesson02.teach.je_peux_payer:
    title: Спрашиваем, можно ли платить картой
    gloss: Можно здесь заплатить картой?
    note: '*Ici* (здесь) привязывает вопрос к кассе, у которой ты стоишь.'
  fr.a1.unit51.lesson02.teach.vous_voulez_payer:
    title: Спрашиваем о способе оплаты
    gloss: Вы хотите заплатить наличными или картой?
    note: '*Vous voulez ... ?* — вежливая форма вопроса, её используют с незнакомым кассиром; друзьям говорят *tu veux ... ?*.'
  fr.a1.unit51.lesson03.teach.l_addition:
    title: Счёт
    gloss: счёт
    note: '*Addition* — существительное женского рода: *l''addition*. Перед гласной *la* сокращается до *l''*.'
    example_gloss: Разделим счёт?
  fr.a1.unit51.lesson03.teach.on_partage_l:
    title: Предлагаем разделить счёт
    gloss: Разделим счёт?
    note: '*On ... ?* предлагает сделать что-то вместе, как в *On partage ?*. *Partager* (делить) сочетается с *l''addition*.'
  fr.a1.unit51.lesson03.teach.je_peux_payer:
    title: Просим заплатить раздельно
    gloss: Можно заплатить раздельно?
    note: '*Séparément* (отдельно) стоит сразу после *payer*; это вежливый способ попросить заплатить только за свою часть счёта.'
  fr.a1.unit51.lesson04.teach.la_monnaie:
    title: Сдача
    gloss: сдача
    note: '*Monnaie* — женского рода: *la monnaie*. Так называют монеты и купюры, которые тебе возвращают.'
    example_gloss: Вот ваша сдача.
  fr.a1.unit51.lesson04.teach.voici_votre_monnaie:
    title: Отдаём сдачу
    gloss: Вот ваша сдача.
    note: '*Votre* — вежливое «ваш», оно соответствует форме *vous* на кассе.'
  fr.a1.unit51.lesson04.teach.je_n_ai:
    title: Отказываемся от сдачи
    gloss: Сдача не нужна.
    note: 'После *avoir besoin de* (нуждаться) стоит существительное: *Je n''ai pas besoin de monnaie.* После *ne ... pas* вместо *de la* используется *de*.'
  fr.a1.unit51.lesson05.teach.trente_cinq:
    title: Тридцать пять
    gloss: тридцать пять
    note: '*Trente-cinq* пишется через дефис, и десятки идут первыми: тридцать + пять.'
    example_gloss: Это стоит тридцать пять евро.
  fr.a1.unit51.lesson05.teach.addition_deux_plats:
    title: Читаем счёт из ресторана
    gloss: 'Счёт: два основных блюда и два кофе. Итого: тридцать пять евро. Оплачено картой.'
    note: Обрати внимание, что заказали, какова итоговая сумма и как заплатили.
    glosses:
      Addition: счёт
      deux: два
      plats: основные блюда
      cafés: кофе
      Total: итого
      trente-cinq: тридцать пять
      euros: евро
      Payé: оплачено
      carte: карта
  fr.a1.unit51.lesson06.teach.camille_on_demande:
    title: Камиль просит счёт
    gloss: 'Камиль: Попросим счёт?'
    note: После *demander* (просить) *l'addition* идёт как прямое дополнение, без дополнительных слов.
  fr.a1.unit51.lesson06.teach.mathieu_oui_bonne:
    title: Матьё спрашивает сумму
    gloss: 'Матьё: Да, хорошая мысль. Сколько всего получается?'
    note: Снова вопрос *Combien ça coûte en tout ?* из первого урока.
  fr.a1.unit51.lesson06.teach.camille_ca_fait:
    title: Камиль называет сумму
    gloss: 'Камиль: Получается тридцать пять евро. Разделим?'
    note: '*Ça fait* + сумма называет итог, а *partager* относится к счёту.'
  fr.a1.unit51.lesson06.teach.mathieu_non_laisse:
    title: Матьё настаивает, что заплатит
    gloss: 'Матьё: Нет, дай мне заплатить сегодня. Ты мне так сильно помогла.'
    note: '*Laisse-moi* + инфинитив — предложение что-то сделать, а *aidé* — причастие прошедшего времени от *aider* (помогать).'
  fr.a1.unit51.lesson06.teach.camille_c_est:
    title: Камиль тронута
    gloss: 'Камиль: Как мило с твоей стороны! Спасибо.'
    note: '*C''est gentil de ta part* (как мило с твоей стороны) — тёплый и частый комплимент за щедрый жест.'
  fr.a1.unit51.lesson06.teach.mathieu_je_peux:
    title: Матьё спрашивает про оплату картой
    gloss: 'Матьё: Здесь можно заплатить картой?'
    note: Снова *Je peux payer par carte ici ?* из второго урока, теперь уже в настоящем ресторане.
  fr.a1.unit51.lesson06.teach.mathieu_paie_l:
    title: 'Paie: форма для «он/она»'
    gloss: Матьё оплачивает счёт.
    note: '*Paie* — форма *il/elle* глагола *payer* (платить): *je paie, tu paies, il paie*.'
