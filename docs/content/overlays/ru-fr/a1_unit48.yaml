teaching:
  fr.a1.unit48.lesson01.teach.le_manteau_le:
    title: Пальто, свитер
    gloss: пальто, свитер
    note: '*Le manteau* и *le pull* — оба мужского рода.'
    example_gloss:
    - Я ищу пальто.
    - У меня есть свитер.
  fr.a1.unit48.lesson01.teach.le_pantalon_les:
    title: Брюки, обувь
    gloss: брюки, обувь
    note: '*Pantalon* во французском стоит в единственном числе, хотя русское «брюки» — во множественном: *un pantalon* — одни брюки. *Chaussures* — множественное число от *chaussure*; обувь обычно называют во множественном числе, как и в русском.'
    example_gloss:
    - Я ищу брюки.
    - Я ищу обувь.
  fr.a1.unit48.lesson01.teach.je_cherche_un:
    title: Говорим, что ты ищешь
    gloss: Я ищу пальто.
    note: 'Глагол *chercher* (искать) употребляется с прямым дополнением и без предлога, как и в русском: *je cherche un manteau*.'
  fr.a1.unit48.lesson02.teach.la_taille:
    title: Размер
    gloss: размер
    note: '*Taille* — женского рода: *la taille*.'
    example_gloss: Какой у вас размер?
  fr.a1.unit48.lesson02.teach.quelle_taille_faites:
    title: Спрашиваем о размере
    gloss: Какой у тебя размер?
    note: В *Quelle taille ?* используется *quelle* (какой), потому что *taille* — женского рода, а вариантов ответа немного (S, M, L или число).
  fr.a1.unit48.lesson02.teach.je_fais_du:
    title: Называем свой размер
    gloss: У меня размер M.
    note: '*Faire du M* значит «носить размер M»: для размера французский использует глагол *faire* (делать), а не «быть».'
  fr.a1.unit48.lesson03.teach.noir_bleu:
    title: Чёрный, синий
    gloss: чёрный, синий
    note: Два основных прилагательных цвета в этом уроке.
    example_gloss:
    - Я хочу пальто чёрного цвета.
    - У вас есть такое же в синем цвете?
  fr.a1.unit48.lesson03.teach.je_veux_le:
    title: Просим нужный цвет
    gloss: Я хочу пальто чёрного цвета.
    note: '*En* + цвет — стандартный способ указать цвет вещи, когда её заказываешь или просишь.'
  fr.a1.unit48.lesson03.teach.avez_vous_aussi:
    title: Спрашиваем о другом цвете
    gloss: У вас есть такое же в синем цвете?
    note: '*Aussi* (тоже, также) помогает узнать, есть ли другой цвет; здесь используется вежливая форма *vous*.'
  fr.a1.unit48.lesson04.teach.est_ce_que:
    title: Спрашиваем, подходит ли вещь
    gloss: Это пальто тебе подходит?
    note: '*Aller* (идти, ехать) — естественный глагол для посадки одежды: *il me va bien*, буквально «оно мне хорошо идёт».'
  fr.a1.unit48.lesson04.teach.il_me_va:
    title: Подтверждаем, что вещь хорошо сидит
    gloss: Оно мне хорошо подходит.
    note: '*Bien* (хорошо) описывает, как вещь сидит.'
  fr.a1.unit48.lesson04.teach.c_est_trop:
    title: Слишком маленькое
    gloss: Это слишком маленькое.
    note: '*Trop* (слишком) ставится перед прилагательным, чтобы выразить избыток.'
  fr.a1.unit48.lesson04.teach.c_est_trop_2:
    title: Слишком большое
    gloss: Это слишком большое.
    note: 'Та же модель *trop* + прилагательное, что и в предыдущей карточке: *trop petit*.'
  fr.a1.unit48.lesson05.teach.quatre_vingt_dix:
    title: Девяносто
    gloss: девяносто
    note: '*Quatre-vingt-dix* — число 90 (буквально «четыре двадцатки десять»); здесь оно указано в цене пальто.'
    example_gloss: Пальто стоит девяносто евро.
  fr.a1.unit48.lesson05.teach.le_manteau_coute:
    title: Называем цену
    gloss: Пальто стоит девяносто евро.
    note: '*Coûte* — форма *il* глагола *coûter* (стоить).'
  fr.a1.unit48.lesson05.teach.parka_taille_m:
    title: Читаем чек из магазина
    gloss: 'Парка: размер M, цвет чёрный. Цена: девяносто евро. Это пальто хорошо сидит и тёплое.'
    note: Найди размер, цвет, цену и два качества пальто, о которых сказано в тексте.
    glosses:
      Parka: зимнее пальто
      taille: размер
      couleur: цвет
      noire: чёрный
      Prix: цена
      quatre-vingt-dix: девяносто
      euros: евро
      manteau: пальто
      va: сидит
      chaud: тёплый
  fr.a1.unit48.lesson06.teach.camille_ce_manteau:
    title: Камиль замечает пальто
    gloss: 'Камиль: Какое красивое пальто! Какой у тебя размер?'
    note: '*Joli* (красивый, симпатичный) — общая положительная реакция; здесь оно в мужском роде, потому что согласуется с *manteau*.'
  fr.a1.unit48.lesson06.teach.mathieu_je_fais:
    title: Матьё просит примерить
    gloss: 'Матьё: У меня размер M. Можно его примерить?'
    note: '*Je peux ... ?* — стандартный способ попросить разрешения; *l''essayer* значит «примерить его», а *l''* заменяет пальто.'
  fr.a1.unit48.lesson06.teach.camille_bien_sur:
    title: Камиль спрашивает, как оно сидит
    gloss: 'Камиль: Конечно. Хорошо сидит?'
    note: '*Il* (он, оно) относится к *le manteau* — существительному мужского рода.'
  fr.a1.unit48.lesson06.teach.mathieu_oui_il:
    title: Матьё подтверждает
    gloss: 'Матьё: Да, оно хорошо сидит и тёплое.'
    note: Полностью совпадает с чеком из текста для чтения — это то же самое пальто.
  fr.a1.unit48.lesson06.teach.camille_super_tu:
    title: Камиль спрашивает о цвете
    gloss: 'Камиль: Отлично! Ты берёшь его в чёрном или в синем?'
    note: '*Tu le veux en ... ou en ... ?* предлагает выбор; *le* заменяет пальто.'
  fr.a1.unit48.lesson06.teach.mathieu_je_le:
    title: Матьё решает
    gloss: 'Матьё: Я беру его в чёрном.'
    note: '*Prendre* (брать) — естественный глагол, когда окончательно выбираешь покупку; цвет совпадает с указанным в чеке.'
  fr.a1.unit48.lesson06.teach.on_ecrit_prends:
    title: Prends или prend
    gloss: '*Prends* — форма «я» и «ты» глагола *prendre* (брать); *prend* — форма «он/она».'
    note: 'Спряжение *prendre*: *je prends, tu prends, il/elle prend*.'
