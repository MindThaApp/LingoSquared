answer_policy:
  accent_marks: Display and teach all French accents and the cedilla. In typed A1 answers, accept a variant without accents when every other letter and word is correct.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation or liaison marks.
course:
  title: Французский язык A1
  description: Лексика о ближайших и дальних родственниках, система притяжательных прилагательных mon/ma/mes и описание семьи; продолжение истории Inès и Mathieu с кулинарного мастер-класса из юнитов 01–02. Особое внимание уделяется тому, что французские притяжательные прилагательные согласуются в роде с называемым существительным, а не с владельцем.
units:
  fr.a1.unit03.family:
    title: Семьи Inès и Mathieu
lessons:
  fr.a1.unit03.lesson01.immediate_family:
    title: Близкие родственники
  fr.a1.unit03.lesson02.possessives_mon_ma_mes:
    title: 'Притяжательные прилагательные: mon, ma, mes'
  fr.a1.unit03.lesson03.extended_family:
    title: Дальние родственники
  fr.a1.unit03.lesson04.describing_family_size:
    title: Сколько человек дома
  fr.a1.unit03.lesson05.reading_a_family_profile:
    title: Читаем анкету о семье
  fr.a1.unit03.lesson06.family_photos_dialogue:
    title: Семейные фотографии Inès и Mathieu
teaching:
  fr.a1.unit03.lesson01.teach.mere:
    title: Мать
    gloss: мать
    note: '*Mère* — женского рода. В семье в повседневной речи чаще говорят *maman*, а *mère* — нейтральное слово, которое используется в списках лексики этого курса.'
  fr.a1.unit03.lesson01.teach.pere:
    title: Отец
    gloss: отец
    note: '*Père* — мужского рода. В повседневной речи говорят *papa*, по аналогии с парой *mère*/*maman*.'
  fr.a1.unit03.lesson01.teach.frere:
    title: Брат
    gloss: брат
    note: '*Frère* — мужского рода, единственного числа.'
  fr.a1.unit03.lesson01.teach.soeur:
    title: Сестра
    gloss: сестра
    note: '*Sœur* — женского рода, единственного числа. Лигатура œ во французском правописании — одна буква, а не две отдельные.'
  fr.a1.unit03.lesson01.teach.fils:
    title: Сын
    gloss: сын
    note: '*Fils* — мужского рода; обрати внимание: конечная s здесь произносится (это исключение), а l не произносится.'
  fr.a1.unit03.lesson01.teach.fille:
    title: Дочь
    gloss: дочь
    note: '*Fille* — женского рода, единственного числа; то же слово в других контекстах означает «девочка».'
  fr.a1.unit03.lesson01.teach.parents:
    title: Parents
    gloss: родители
    note: '*Parents* — мужского рода, множественного числа; слово обозначает мать и отца вместе.'
  fr.a1.unit03.lesson01.teach.freres_et_soeurs:
    title: Братья и сёстры
    gloss: братья и сёстры
    note: 'Во французском для смешанной группы используется развёрнутое выражение *frères et sœurs*: оно прямо называет и братьев, и сестёр.'
  fr.a1.unit03.lesson02.teach.ma_mere:
    title: Моя мама
    gloss: моя мама
    note: '*Ma* — притяжательное «мой/моя» в женском роде единственного числа; оно стоит здесь, потому что *mère* — существительное женского рода.'
  fr.a1.unit03.lesson02.teach.mon_pere:
    title: Мой папа
    gloss: мой папа
    note: '*Mon* — притяжательное «мой» в мужском роде единственного числа; оно стоит здесь, потому что *père* — существительное мужского рода.'
  fr.a1.unit03.lesson02.teach.mes_freres_et_soeurs:
    title: Мои братья и сёстры
    gloss: мои братья и сёстры
    note: '*Mes* — притяжательное «мои» во множественном числе; оно используется с любым существительным во множественном числе, независимо от рода. Здесь согласование идёт по числу, а не по роду, как у *ma*/*mon*.'
  fr.a1.unit03.lesson02.teach.as_tu_des_freres_et_soeurs:
    title: Спросить о братьях и сёстрах
    gloss: У тебя есть братья или сёстры?
    note: '*As-tu* — вопросительная форма с инверсией от *tu as* («у тебя есть»); очень частая модель вопроса на уровне A1.'
  fr.a1.unit03.lesson02.teach.jai_deux_soeurs:
    title: Назвать число братьев и сестёр
    gloss: У меня две сестры.
    note: '*J''ai* («у меня есть») + число + название родственников — стандартный способ рассказать о братьях и сёстрах.'
  fr.a1.unit03.lesson02.teach.ta_famille_est_grande:
    title: Спросить, большая ли семья
    gloss: Твоя семья большая?
    note: '*Ta* — неформальное притяжательное «твой/твоя» в женском роде единственного числа; оно согласуется с существительным женского рода *famille*.'
  fr.a1.unit03.lesson02.teach.ma_famille_est_petite:
    title: Описать маленькую семью
    gloss: Моя семья маленькая.
    note: '*Petite* согласуется с существительным женского рода *famille*; с существительным мужского рода стояло бы *petit*. Это согласование прилагательного, описывающего качество, а не принадлежность, как у *mon*/*ma*/*mes*.'
  fr.a1.unit03.lesson03.teach.grand_pere:
    title: Дедушка
    gloss: дедушка
    note: '*Grand-père* — составное слово с дефисом, мужского рода.'
  fr.a1.unit03.lesson03.teach.grand_mere:
    title: Бабушка
    gloss: бабушка
    note: '*Grand-mère* — составное слово с дефисом, женского рода. Обрати внимание: *grand-* здесь не меняется и не принимает форму *grande-mère*.'
  fr.a1.unit03.lesson03.teach.grands_parents:
    title: Бабушка и дедушка
    gloss: бабушка и дедушка
    note: В *grands-parents* во множественное число ставятся обе части слова (*grands*, а не *grand-*), тогда как в единственном числе (*grand-mère*, *grand-père*) первая часть остаётся *grand-*.
  fr.a1.unit03.lesson03.teach.oncle:
    title: Дядя
    gloss: дядя
    note: '*Oncle* — существительное мужского рода.'
  fr.a1.unit03.lesson03.teach.tante:
    title: Тётя
    gloss: тётя
    note: '*Tante* — существительное женского рода.'
  fr.a1.unit03.lesson03.teach.cousin:
    title: Двоюродный брат
    gloss: двоюродный брат
    note: '*Cousin* — мужской род, единственное число. Как и в русском («двоюродный брат» и «двоюродная сестра»), во французском пол родственника выражен: для сестры есть форма cousine.'
  fr.a1.unit03.lesson03.teach.cousine:
    title: Двоюродная сестра
    gloss: двоюродная сестра
    note: '*Cousine* — женский род, единственное число; образуется от *cousin* добавлением -e.'
  fr.a1.unit03.lesson03.teach.mes_grands_parents:
    title: Мои бабушка и дедушка
    gloss: мои бабушка и дедушка
    note: '*Mes* стоит здесь, потому что *grands-parents* — во множественном числе. Род не важен: слово обозначает и дедушку, и бабушку.'
  fr.a1.unit03.lesson04.teach.combien_de_freres_et_soeurs:
    title: Спросить, сколько братьев и сестёр
    gloss: Сколько у тебя братьев и сестёр?
    note: '*Combien de* («сколько») ставится прямо перед существительным; сам вопрос строится с инверсией: as-tu.'
  fr.a1.unit03.lesson04.teach.on_est_cinq:
    title: Сказать, сколько вас в семье
    gloss: Нас дома шестеро.
    note: '*On est* (буквально «человек есть», но в разговорной речи значит «мы есть») — естественный и очень частый способ сказать, сколько вас дома. *Nous sommes* звучит более формально и книжно.'
  fr.a1.unit03.lesson04.teach.ma_famille_est_grande:
    title: Описать большую семью
    gloss: У меня большая семья.
    note: '*Grande* согласуется с существительным женского рода *famille*; с существительным мужского рода стояло бы *grand*.'
  fr.a1.unit03.lesson04.teach.jai_beaucoup_de_cousins:
    title: Сказать, что у тебя много двоюродных братьев и сестёр
    gloss: У меня много двоюродных братьев и сестёр.
    note: '*Beaucoup de* («много») ставится перед существительным; *de* здесь не превращается в *du*/*des*, потому что *beaucoup* уже выражает количество.'
  fr.a1.unit03.lesson04.teach.tu_habites_pres_de_tes_parents:
    title: Спросить, живёт ли человек рядом с родителями
    gloss: Ты живёшь рядом с родителями?
    note: '*Tes* — неформальное притяжательное «твои» во множественном числе; оно нужно, потому что *parents* стоит во множественном числе.'
  fr.a1.unit03.lesson04.teach.jhabite_avec_mes_grands_parents:
    title: Сказать, с кем ты живёшь
    gloss: Я живу с бабушкой и дедушкой.
    note: '*Avec* («с») вводит тех, с кем человек живёт; *j''habite* — форма *je* глагола *habiter*, которую ты уже встречал(а) в *j''habite à Montreuil*.'
  fr.a1.unit03.lesson05.teach.profile_reading:
    title: Рассказ Инес о своей семье
    gloss: 'Меня зовут Инес. Мне тридцать один год, и я живу со своими бабушкой и дедушкой в Париже. Мои мама и папа живут в Лилле. У меня две сестры и брат: нас дома шестеро. Мою младшую сестру зовут Камиль, ей двадцать лет.'
    note: В этом рассказе лексика и конструкции из предыдущих уроков собраны в связный текст, а не в отдельные фразы. Так тренируется умение понимать, кто есть кто.
    glosses:
      trente: тридцать
      ans: лет (о возрасте)
      grands-parents: бабушка и дедушка
      mère: мать
      père: отец
      habitent: живут (от habiter)
      deux: два
      sœurs: сёстры
      frère: брат
      six: шесть
      maison: дом
      petite: младшая / маленькая
      sœur: сестра
      vingt: двадцать
  fr.a1.unit03.lesson05.teach.petite_soeur:
    title: Младшая сестра
    gloss: младшая сестра
    note: '*Petite* (женский род от *petit*) стоит перед существительным, как и большинство коротких употребительных французских прилагательных; остальные прилагательные обычно стоят после существительного.'
  fr.a1.unit03.lesson05.teach.habite_third_person:
    title: Живёт (третье лицо)
    gloss: живёт
    note: '*Habite* — форма 3-го лица единственного числа глагола *habiter*; она используется, когда говорят О ком-то (*Inès habite...*), а не от первого лица (*j''habite*, как в первом разделе и в уроке 4 этого раздела).'
  fr.a1.unit03.lesson05.teach.ses_third_person_plural:
    title: Её/его/их (существительное во мн. числе)
    gloss: её/его/их
    note: '*Ses* — это форма множественного числа от *sa*/*son*: *sa*/*son* ставятся, когда предмет один, а ses — когда предметов несколько. *Ses grands-parents* значит «её дедушка и бабушка», если мы говорим об Inès в третьем лице.'
  fr.a1.unit03.lesson05.teach.a_third_person_avoir:
    title: Имеет (3-е лицо)
    gloss: имеет; есть у
    note: '*A* — форма 3-го лица единственного числа глагола *avoir*; она используется, когда говорят О ком-то (*elle a vingt ans*), а не от первого лица (*j''ai* / *as-tu*, как во всех уроках 2–4 этого раздела).'
  fr.a1.unit03.lesson06.teach.line01:
    title: Показать семейные фото
    gloss: Инес показывает Матьё фотографию и представляет своих родителей и младшую сестру.
    note: '*Voici* («вот») указывает на что-то, что показывают; естественная фраза, когда показываешь фотографию.'
  fr.a1.unit03.lesson06.teach.line02:
    title: Отреагировать и спросить о братьях и сёстрах
    gloss: Матьё тепло реагирует и спрашивает, есть ли у неё другие братья и сёстры.
    note: '*C''est adorable* — естественная, тёплая реакция на фотографию маленького брата или сестры.'
  fr.a1.unit03.lesson06.teach.line03:
    title: Назвать состав семьи и задать вопрос в ответ
    gloss: Инес говорит, что у неё две сестры и брат, дома их шестеро, и спрашивает о семье Матьё.
    note: '*On est six à la maison* сообщает, сколько человек в семье; это продолжение модели из урока 4.'
  fr.a1.unit03.lesson06.teach.line04:
    title: Описать семью поменьше
    gloss: 'Матьё говорит, что его семья меньше: их всего трое — родители и он, — но у него много двоюродных братьев и сестёр.'
    note: '*Mais* («но») подчёркивает контраст между маленькой семьёй и многочисленной роднёй.'
  fr.a1.unit03.lesson06.teach.line05:
    title: Спросить, живут ли родители рядом
    gloss: Инес спрашивает, живёт ли Матьё рядом с родителями.
    note: '*Près de* («рядом с», «около») — обычный способ сказать о физической близости.'
  fr.a1.unit03.lesson06.teach.line06:
    title: Объяснить, что вы далеко, но на связи
    gloss: Матьё отвечает, что нет, они живут в Лионе, и что они разговаривают по телефону каждую неделю.
    note: 'Это продолжает сведения из первого раздела: Матьё родом из Лиона. Его родители остались там, а сам он живёт в Сен-Уане.'
  fr.a1.unit03.lesson06.teach.line07:
    title: Выразить понимание и рассказать о себе
    gloss: Инес говорит, что понимает его, и что она живёт со своими бабушкой и дедушкой здесь, в Париже.
    note: '*Je comprends* («я понимаю») — короткий естественный способ отреагировать на слова собеседника, прежде чем рассказать о своём.'
  fr.a1.unit03.lesson06.teach.line08:
    title: Закончить разговор добрым замечанием
    gloss: Матьё говорит, что это хорошо — когда семья рядом.
    note: '*C''est bien d''avoir sa famille près de soi* завершает разговор тёплой, задумчивой фразой и перекликается с *près de* из урока 4.'
