course:
  title: Французский язык A1
  description: 'Краткий рассказ о недавнем завершённом событии в passé composé со вспомогательными глаголами avoir и être. Продолжение истории Инес и Матьё о кулинарном мастер-классе: Матьё рассказывает о неприятности на прошлой субботе. Во французском два вспомогательных глагола: avoir для большинства глаголов и être для небольшой группы (aller, arriver, rester и др.). Причастия с être согласуются с подлежащим в роде (arrivé/arrivée), как в русском прошедшем времени: «приехал» — «приехала».'
units:
  fr.a1.unit12.past_events:
    title: Что случилось?
lessons:
  fr.a1.unit12.lesson01.passe_compose_avoir:
    title: Passé composé с avoir
  fr.a1.unit12.lesson02.passe_compose_etre:
    title: Passé composé с être
  fr.a1.unit12.lesson03.dialogue_atelier_dernier:
    title: Мастер-класс в прошлую субботу
teaching:
  fr.a1.unit12.lesson01.teach.jai_prepare:
    title: Я приготовил(а)
    gloss: я приготовил(а)
    note: 'У правильных глаголов на -ER причастие в passé composé оканчивается на *-é*: *préparer* → *préparé*; вспомогательный глагол — *avoir*.'
    example_gloss: Я приготовила торт для мастер-класса.
  fr.a1.unit12.lesson01.teach.jai_achete:
    title: Я купил(а)
    gloss: я купил(а)
    note: '*Acheter* образует форму так же, как *préparer*: *avoir* + *-é*.'
    example_gloss: Я купил овощи на рынке.
  fr.a1.unit12.lesson01.teach.jai_oublie:
    title: Я забыл(а)
    gloss: я забыл(а)
    note: '*Oublier* → *oublié*: снова та же правильная модель.'
    example_gloss: Я забыл масло дома!
  fr.a1.unit12.lesson01.teach.tu_as_aime:
    title: Тебе понравилось
    gloss: тебе понравилось
    note: '*Tu as* + причастие — форма для *tu* той же конструкции с *avoir*.'
    example_gloss: Тебе понравился торт?
  fr.a1.unit12.lesson01.teach.il_a_goute:
    title: Он попробовал
    gloss: он попробовал
    note: '*Il a* + причастие — форма для *il*: вспомогательный глагол *avoir* меняется вместе с подлежащим, а причастие остаётся прежним.'
    example_gloss: Матьё попробовал соус.
  fr.a1.unit12.lesson01.teach.grammar_avoir_participe:
    title: Avoir + причастие прошедшего времени
    gloss: avoir + причастие прошедшего времени (-é)
    note: Большинство французских глаголов образуют passé composé с вспомогательным глаголом *avoir* и причастием, которое у правильных глаголов на -ER оканчивается на *-é*.
  fr.a1.unit12.lesson01.teach.la_semaine_derniere:
    title: На прошлой неделе
    gloss: на прошлой неделе
    note: '*Dernière* («прошлая») согласуется с женским родом слова *semaine*; мужская форма — *dernier*, как в *samedi dernier* («в прошлую субботу»).'
    example_gloss: На прошлой неделе я испёк торт.
  fr.a1.unit12.lesson02.teach.je_suis_arrive:
    title: Я приехал(а)
    gloss: я приехал(а)
    note: '*Arriver* — один из небольшой группы глаголов (в основном движения), у которых вспомогательный глагол не *avoir*, а *être*.'
    example_gloss: Я опоздал на мастер-класс.
  fr.a1.unit12.lesson02.teach.je_suis_alle:
    title: Я пошёл / пошла
    gloss: я пошёл / я пошла
    note: '*Aller* тоже берёт *être*. Причастие согласуется с подлежащим: *allé* (мужской род) или *allée* (женский, как скажет Инес).'
    example_gloss: Я сходила на рынок перед мастер-классом.
  fr.a1.unit12.lesson02.teach.il_est_reste:
    title: Он остался
    gloss: он остался
    note: '*Rester* («оставаться») — ещё один глагол с *être*, согласование то же.'
    example_gloss: Матьё остался убрать кухню.
  fr.a1.unit12.lesson02.teach.grammar_etre_accord:
    title: Être + согласование причастия
    gloss: être + причастие прошедшего времени (согласуется с подлежащим)
    note: У глаголов с *être* причастие согласуется с подлежащим в роде и числе, в отличие от глаголов с *avoir*.
  fr.a1.unit12.lesson02.teach.en_retard:
    title: С опозданием
    gloss: с опозданием
    note: '*En retard* значит «позже назначенного времени»; часто встречается вместе с *arriver*.'
    example_gloss: Автобус приехал с опозданием.
  fr.a1.unit12.lesson02.teach.finalement:
    title: В итоге
    gloss: в итоге
    note: '*Finalement* завершает короткий рассказ и показывает итог после прежних сложностей.'
    example_gloss: В итоге торт получился восхитительным.
  fr.a1.unit12.lesson02.teach.quest_ce_qui_sest_passe:
    title: Что случилось?
    gloss: Что случилось?
    note: '*Qu''est-ce qui s''est passé ?* — стандартный вопрос «что случилось?».'
    example_gloss: Что случилось на мастер-классе?
  fr.a1.unit12.lesson03.teach.line01:
    title: Спроси, что случилось
    gloss: 'Инес спрашивает, что было на мастер-классе в прошлую субботу: она не смогла прийти.'
    note: '*Qu''est-ce qui s''est passé ?* («что случилось?») — обычный вопрос о событии в прошлом.'
  fr.a1.unit12.lesson03.teach.line02:
    title: Расскажи о неприятности
    gloss: 'Матьё говорит: ох, он опоздал и забыл масло дома!'
    note: 'В одной фразе две формы passé composé: с *être* (*je suis arrivé*) и с *avoir* (*j''ai oublié*).'
  fr.a1.unit12.lesson03.teach.line03:
    title: Спроси, что он сделал
    gloss: Инес спрашивает, что он сделал потом.
    note: В *Qu'est-ce que tu as fait ?* («что ты сделал?») используется неправильное причастие глагола *faire*.
  fr.a1.unit12.lesson03.teach.line04:
    title: Опиши выход из положения
    gloss: Матьё говорит, что быстро сходил в ближайшую продуктовую лавку.
    note: В *l'épicerie du coin* («лавка на углу», то есть ближайшая) слово *coin* то же, что в *au coin de la rue* («на углу улицы»).
  fr.a1.unit12.lesson03.teach.line05:
    title: Спроси, получилось ли
    gloss: Инес спрашивает, нашёл ли он там масло.
    note: '*Tu as trouvé... ?* («ты нашёл...?») — ещё один вопрос с правильным глаголом и *avoir*.'
  fr.a1.unit12.lesson03.teach.line06:
    title: Счастливый конец
    gloss: 'Матьё говорит: да, и в итоге торт получился восхитительным!'
    note: 'Рассказ заканчивается на хорошей ноте благодаря *finalement*: неприятность разрешилась.'
