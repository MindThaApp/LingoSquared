  fr.a1.unit06.lesson03.dialogue_prochain_atelier:
    title: Следующий мастер-класс
teaching:
  fr.a1.unit06.lesson01.teach.heure:
    title: Час; время
    gloss: час; время
    note: '*Heure* — женского рода; это также единица, с помощью которой называют время по часам (*dix heures* — десять часов).'
    example_gloss: Который час?
  fr.a1.unit06.lesson01.teach.matin:
    title: Утро
    gloss: утро
    note: '*Matin* — мужского рода.'
    example_gloss: Рынок открыт по утрам.
  fr.a1.unit06.lesson01.teach.apres_midi:
    title: День (после полудня)
    gloss: время после полудня
    note: '*Après-midi* может быть и мужского, и женского рода (мужской род встречается чаще); *l''* стоит перед гласным звуком.'
    example_gloss: Я работаю во второй половине дня.
  fr.a1.unit06.lesson01.teach.soir:
    title: Вечер
    gloss: вечер
    note: '*Soir* — мужского рода.'
    example_gloss: Кулинарный мастер-класс проходит вечером.
  fr.a1.unit06.lesson01.teach.midi:
    title: Полдень
    gloss: полдень
    note: 'Когда *midi* обозначает время, артикль не нужен: *à midi*, а не *au midi*.'
    example_gloss: Мы обедаем в полдень.
  fr.a1.unit06.lesson01.teach.minuit:
    title: Полночь
    gloss: полночь
    note: '*Minuit* тоже употребляется без артикля, как и *midi*.'
    example_gloss: Мастер-класс никогда не заканчивается после полуночи.
  fr.a1.unit06.lesson01.teach.latelier_commence_le_soir:
    title: Сказать, когда проходит мастер-класс
    gloss: Мастер-класс начинается вечером, а не утром.
    note: Здесь прямо противопоставлены *le soir* и *le matin* — оба слова из словаря этого урока.
  fr.a1.unit06.lesson02.teach.quelle_heure_est_il:
    title: Спросить, который час
    gloss: Который час?
    note: '*Quelle heure est-il ?* — стандартный универсальный способ спросить, который час; *-il* стоит после глагола, это вопросительная инверсия.'
  fr.a1.unit06.lesson02.teach.il_est_dix_heures:
    title: Назвать час
    gloss: Десять часов.
    note: '*Il est* + число + *heures* — базовая модель для любого часа; *heures* остаётся во множественном числе, кроме *une heure* (час дня или ночи).'
  fr.a1.unit06.lesson02.teach.et_quart:
    title: Назвать четверть часа
    gloss: Четверть одиннадцатого.
    note: '*Et quart* (и четверть) добавляет к названному часу пятнадцать минут.'
  fr.a1.unit06.lesson02.teach.et_demie:
    title: Назвать половину часа
    gloss: Половина одиннадцатого.
    note: '*Et demie* (и половина) добавляет тридцать минут; *demie* получает женское окончание -e, согласуясь с *heure*.'
  fr.a1.unit06.lesson02.teach.moins_le_quart:
    title: Назвать «без четверти»
    gloss: Без четверти одиннадцать.
    note: '*Moins le quart* («минус четверть») отсчитывается назад от СЛЕДУЮЩЕГО часа, а не от текущего. В русском устроено так же: «без четверти одиннадцать» — это тоже отсчёт от следующего часа.'
  fr.a1.unit06.lesson02.teach.a_quelle_heure:
    title: Спроси, во сколько что-то начинается
    gloss: Во сколько начинается мастер-класс?
    note: '*À quelle heure ?* («во сколько») спрашивают о времени запланированного события; это не то же самое, что общий вопрос *Quelle heure est-il ?*.'
  fr.a1.unit06.lesson03.teach.line01:
    title: Спросить о времени мастер-класса на следующей неделе
    gloss: Инес спрашивает, во сколько мастер-класс на следующей неделе.
    note: '*La semaine prochaine* (на следующей неделе) сочетается с вопросом *à quelle heure*, который изучался в этом уроке.'
  fr.a1.unit06.lesson03.teach.line02:
    title: Назвать время начала
    gloss: Матьё говорит, что, кажется, мастер-класс начинается в восемнадцать тридцать (в 18:30).
    note: '*Dix-huit heures trente* — 24-часовой формат, обычный для расписаний во Франции; он отличается от разговорных форм вроде *et demie*.'
  fr.a1.unit06.lesson03.teach.line03:
    title: Уточнить, что это вечер
    gloss: 'Инес уточняет: вечером, а не утром?'
    note: Короткий уточняющий вопрос, в котором противопоставлены *le soir* и *le matin*.
  fr.a1.unit06.lesson03.teach.line04:
    title: Подтвердить и объяснить причину
    gloss: 'Матьё подтверждает, что вечером: так удобнее после работы.'
    note: '*Après le travail* (после работы) — простая практичная причина.'
  fr.a1.unit06.lesson03.teach.line05:
    title: Спросить о времени окончания
    gloss: Инес спрашивает, во сколько он заканчивается.
    note: '*Finit* (заканчивается) противопоставлено слову *commence* (начинается) из второй реплики.'
  fr.a1.unit06.lesson03.teach.line06:
    title: Назвать время окончания
    gloss: 'Матьё отвечает: около двадцати пятнадцати (20:15), как обычно.'
    note: '*Vers* («около») указывает на приблизительное время и звучит мягче, чем точное *à*.'
  fr.a1.unit06.lesson03.teach.line07:
    title: Подтвердить договорённость
    gloss: 'Инес подтверждает: до встречи на следующей неделе, в восемнадцать тридцать!'
    note: Разговор завершается повтором согласованного времени — естественный для французского способ подтвердить договорённость.
