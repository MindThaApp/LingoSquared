answer_policy:
  accent_marks: Display and teach all French accents and the cedilla. In typed A1 answers, accept a variant without accents when every other letter and word is correct.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation or liaison marks.
course:
  title: Французский язык A1
  description: Части суток и время по часам (heure(s), et quart, et demie, moins le quart); продолжение истории Инес и Матьё о кулинарном мастер-классе — они договариваются о следующей встрече. Отдельно показано, что в официальных ситуациях и в расписаниях французы используют 24-часовой формат (dix-huit heures trente), а в разговорной речи — более простые формы, которые изучались раньше в этом разделе.
units:
  fr.a1.unit06.time:
    title: Который час?
lessons:
  fr.a1.unit06.lesson01.moments_de_la_journee:
    title: Части суток
  fr.a1.unit06.lesson02.dire_lheure:
