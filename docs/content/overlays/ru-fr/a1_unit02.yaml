course:
  title: Французский язык A1
  description: 'Числа от 0 до 100 (включая формы soixante-dix, quatre-vingts, quatre-vingt-dix), возраст, номера телефонов и количества в рецептах; продолжение истории Инес и Матьё на кулинарном мастер-классе из первого раздела. Особое внимание: выражение возраста с помощью avoir, остатки двадцатеричного счёта во французских числительных и согласование по роду во фразах с количеством.'
units:
  fr.a1.unit02.numbers:
    title: Числа на кухне
lessons:
  fr.a1.unit02.lesson01.numbers_zero_to_ten:
    title: Числа от нуля до десяти
  fr.a1.unit02.lesson02.numbers_eleven_to_hundred:
    title: 'Особые формы: от одиннадцати до ста'
  fr.a1.unit02.lesson03.asking_age:
    title: Как спросить о возрасте
  fr.a1.unit02.lesson04.phone_numbers:
    title: Номера телефонов
  fr.a1.unit02.lesson05.recipe_quantities:
    title: Количества в рецептах
  fr.a1.unit02.lesson06.recipe_count_dialogue:
    title: Считаем ингредиенты вместе с Инес и Матьё
teaching:
  fr.a1.unit02.lesson01.teach.zero:
    title: Ноль
    gloss: ноль
    note: '*Zéro* — это и само число, и цифра, когда вслух читают ряд цифр.'
  fr.a1.unit02.lesson01.teach.un:
    title: Один
    gloss: один
    note: '*Un* — мужской род; перед существительным женского рода используется форма *une* (*une tasse*, одна чашка). Отдельно, при счёте, остаётся *un*.'
  fr.a1.unit02.lesson01.teach.deux:
    title: Два
    gloss: два
    note: '*Deux* не меняется независимо от рода существительного.'
  fr.a1.unit02.lesson01.teach.trois:
    title: Три
    gloss: три
    note: '*Trois* не изменяется.'
  fr.a1.unit02.lesson01.teach.quatre:
    title: Четыре
    gloss: четыре
    note: '*Quatre* не изменяется.'
  fr.a1.unit02.lesson01.teach.cinq:
    title: Пять
    gloss: пять
    note: '*Cinq* не изменяется. Конечная q обычно произносится, в отличие от немых конечных согласных в ряде других французских числительных.'
  fr.a1.unit02.lesson01.teach.six:
    title: Six
    gloss: шесть
    note: '*Six* при отдельном произнесении оканчивается на звук /s/, но перед существительным, начинающимся с согласной, конечная согласная не произносится (*six livres* звучит как «си ливр»).'
  fr.a1.unit02.lesson01.teach.sept:
    title: Семь
    gloss: семь
    note: '*Sept* не изменяется; p не читается, произносится только конечная t.'
  fr.a1.unit02.lesson01.teach.huit:
    title: Восемь
    gloss: восемь
    note: '*Huit* не изменяется. Буква h здесь не читается — как почти во всех французских словах.'
  fr.a1.unit02.lesson01.teach.neuf:
    title: Девять
    gloss: девять
    note: '*Neuf* не изменяется.'
  fr.a1.unit02.lesson01.teach.dix:
    title: Десять
    gloss: десять
    note: '*Dix* при отдельном произнесении оканчивается на звук /s/; перед согласной конечная согласная не произносится — так же, как у *six*.'
  fr.a1.unit02.lesson02.teach.onze:
    title: Одиннадцать
    gloss: одиннадцать
    note: Числительные от *onze* до *seize* (11–16) — отдельные слова, они не образуются от *dix*, в отличие от чисел после двадцати, где снова используется *vingt*.
  fr.a1.unit02.lesson02.teach.douze:
    title: Двенадцать
    gloss: двенадцать
    note: '*Douze* — одно слово. В начале оно перекликается с *deux*, но явного *dix* в нём нет.'
  fr.a1.unit02.lesson02.teach.treize:
    title: Тринадцать
    gloss: тринадцать
    note: '*Treize* — одно слово. В начале оно перекликается с *trois*, но явного *dix* в нём нет.'
  fr.a1.unit02.lesson02.teach.quatorze:
    title: Четырнадцать
    gloss: четырнадцать
    note: '*Quatorze* — одно слово. В начале оно перекликается с *quatre*, но явного *dix* в нём нет.'
  fr.a1.unit02.lesson02.teach.quinze:
    title: Пятнадцать
    gloss: пятнадцать
    note: '*Quinze* — одно слово. Оно отдалённо родственно *cinq*, но явного *dix* в нём нет.'
  fr.a1.unit02.lesson02.teach.seize:
    title: Шестнадцать
    gloss: шестнадцать
    note: '*Seize* — последнее из слитных слов этого ряда; начиная с *dix-sept* (17) *dix* снова явно складывается с единицей.'
  fr.a1.unit02.lesson02.teach.vingt:
    title: Двадцать
    gloss: двадцать
    note: '*Vingt* — отдельное слово. Начиная с двадцати одного десятки и единицы соединяются (*vingt et un*, *vingt-deux*) по схеме, к которой этот курс вернётся ниже.'
  fr.a1.unit02.lesson02.teach.trente:
    title: Тридцать
    gloss: тридцать
    note: '*Trente* соединяется со следующей единицей через дефис (*trente-quatre*), кроме единицы: с ней ставится *et* (*trente et un*).'
  fr.a1.unit02.lesson02.teach.trente_quatre:
    title: Тридцать четыре
    gloss: тридцать четыре
    note: '*Trente-quatre* пишется через дефис, тогда как по-русски «тридцать четыре» пишется двумя отдельными словами.'
  fr.a1.unit02.lesson02.teach.soixante:
    title: Шестьдесят
    gloss: шестьдесят
    note: '*Soixante* ведёт себя как обычный десяток (*soixante-quatre*, 64) до шестидесяти девяти включительно; неправильная часть начинается с семидесяти — это следующая тема.'
  fr.a1.unit02.lesson02.teach.soixante_dix:
    title: Семьдесят
    gloss: семьдесят
    note: 'Это самый большой сюрприз французских чисел: отдельного слова для «семидесяти» нет. *Soixante-dix* буквально значит «шестьдесят-десять» (60 + 10). Счёт идёт так до *soixante-dix-neuf* (79, «шестьдесят-девятнадцать»), а затем с *quatre-vingts* начинается новая основа — восемьдесят.'
  fr.a1.unit02.lesson02.teach.quatre_vingts:
    title: Восемьдесят
    gloss: восемьдесят
    note: '*Quatre-vingts* буквально значит «четыре двадцатки» (4 × 20) — след старой двадцатеричной системы счёта. Конечная s нужна, только когда слово стоит отдельно или завершает число (*quatre-vingts*, 80); если дальше идёт единица, s пропадает (*quatre-vingt-un*, 81).'
  fr.a1.unit02.lesson02.teach.quatre_vingt_dix:
    title: Девяносто
    gloss: девяносто
    note: '*Quatre-vingt-dix* буквально значит «четыре двадцатки плюс десять» (4×20 + 10); та же двадцатеричная схема, что и в семидесяти, продолжается до *quatre-vingt-dix-neuf* (99).'
  fr.a1.unit02.lesson02.teach.cent:
    title: Сто
    gloss: сто
    note: '*Cent* — форма для ровно 100 без артикля (не «*un cent*»).'
  fr.a1.unit02.lesson03.teach.quel_age_as_tu:
    title: Вопрос о возрасте (неформально)
    gloss: Сколько тебе лет?
    note: 'По-французски возраст «имеют»: используется *avoir* (иметь), а не *être* («быть»).'
  fr.a1.unit02.lesson03.teach.jai_vingt_huit_ans:
    title: Назвать свой возраст
    gloss: Мне двадцать восемь.
    note: '*Ai* — форма *avoir* для je. Слово *ans* (годы, лет) обязательно: одним числом ограничиться нельзя.'
  fr.a1.unit02.lesson03.teach.quel_age_avez_vous:
    title: Вопрос о возрасте (формально)
    gloss: Сколько тебе лет?
    note: В *avez-vous* стоит форма *avoir* для *vous*, что соответствует вежливому обращению из Unit 1.
  fr.a1.unit02.lesson03.teach.jai_trente_et_un_ans:
    title: Назвать возраст из двух слов
    gloss: Мне тридцать один год.
    note: '*Trente et un* — с *et* («и»), а не с дефисом; так образуются только формы на «один» у тридцати, сорока, пятидесяти и шестидесяти (*trente et un*, *quarante et un*, *cinquante et un*, *soixante et un*). Семьдесят один выбивается из ряда: это *soixante et onze* (шестьдесят + одиннадцать), а не *soixante et un*, потому что семидесятые продолжают счёт через формы с *dix* до *soixante-dix-neuf* (79).'
  fr.a1.unit02.lesson03.teach.et_toi_quel_age:
    title: Задать встречный вопрос о возрасте
    gloss: А тебе сколько лет?
    note: '*Et toi* открывает ответный вопрос; *toi* (а не *tu*) — ударное местоимение, которое ставится после *et* для выделения.'
  fr.a1.unit02.lesson04.teach.quel_est_ton_numero:
    title: Спросить номер телефона
    gloss: Какой у тебя номер телефона?
    note: '*Quel* согласуется с существительным мужского рода *numéro*; для существительного женского рода нужно *quelle*.'
  fr.a1.unit02.lesson04.teach.numero_ines:
    title: Номер, прочитанный по цифрам
    gloss: Ноль, шесть, один, пять, ноль, два, девять, семь, четыре, три
    note: Настоящие французские телефонные номера состоят из десяти цифр и обычно читаются парами (*zéro six*, *quinze*, *zéro deux*...). Номера в этом юните имеют реальный десятизначный формат (06 15 02 97 43), но читаются по одной цифре, чтобы сначала потренировать отдельные цифры.
  fr.a1.unit02.lesson04.teach.cest_le:
    title: Начать называть номер
    gloss: Это...
    note: '*Le* (определённый артикль мужского рода) стоит потому, что *numéro* — существительное мужского рода.'
  fr.a1.unit02.lesson04.teach.tu_peux_repeter:
    title: Попросить повторить
    gloss: Можешь повторить, пожалуйста?
    note: '*Peux* — форма *tu* глагола *pouvoir* (мочь); пригодится, когда названный вслух номер прозвучал слишком быстро.'
  fr.a1.unit02.lesson04.teach.bien_sur:
    title: Охотно согласиться
    gloss: Конечно; разумеется
    note: '*Bien sûr* — распространённый дружелюбный способ согласиться на просьбу.'
  fr.a1.unit02.lesson05.teach.jai_besoin_trois_oeufs:
    title: Назвать нужное количество
    gloss: Мне нужны три яйца.
    note: '*J''ai besoin de* (буквально «я имею нужду в») — так по-французски говорят о нужде: с помощью *avoir*, а не отдельного глагола, как русское «мне нужно».'
  fr.a1.unit02.lesson05.teach.combien_oeufs:
    title: Спросить, сколько нужно
    gloss: Сколько яиц тебе нужно?
    note: В *de combien d'œufs* сначала идёт *de combien* («сколько»), а затем предмет; предлог de здесь нужен, потому что его требует avoir besoin de.
  fr.a1.unit02.lesson05.teach.deux_tasses_farine:
    title: Назвать отмеренное количество
    gloss: Две чашки муки
    note: '*De* связывает меру (*tasses*, чашки) с тем, что измеряют (*farine*, мука) — как в русском родительный падеж: «две чашки муки».'
  fr.a1.unit02.lesson05.teach.demi_tasse:
    title: Назвать половинное количество
    gloss: Полчашки сахара
    note: '*Demi-* как приставка перед существительным не изменяется (*une demi-tasse*), в отличие от прилагательного *demi* после существительного, которое согласуется (*une heure et demie*).'
  fr.a1.unit02.lesson05.teach.jai_quatre_oeufs:
    title: Сказать, что есть в наличии
    gloss: У меня на столе четыре яйца.
    note: '*J''ai* («у меня есть») сообщает о том, что уже имеется; *j''ai besoin de* («мне нужно») — о том, чего ещё не хватает.'
  fr.a1.unit02.lesson06.teach.line01:
    title: Спросить, сколько яиц
    gloss: Inès спрашивает Mathieu, сколько яиц ему нужно для рецепта.
    note: 'Inès и Mathieu теперь говорят на *tu*, а не на *vous*, как в Unit 1: как участники одного мастер-класса они быстро перешли на неформальное общение.'
  fr.a1.unit02.lesson06.teach.line02:
    title: Назвать ингредиенты
    gloss: Mathieu говорит, что ему нужны три яйца и две чашки муки.
    note: '*J''ai besoin de* называет то, что ещё нужно для рецепта.'
  fr.a1.unit02.lesson06.teach.line03:
    title: Предложить то, что есть
    gloss: Inès говорит, что у неё на столе четыре яйца, и спрашивает, нужен ли ему ещё сахар.
    note: '*J''ai* сообщает о том, что у Inès уже есть, — это отдельно от того, что нужно Mathieu.'
  fr.a1.unit02.lesson06.teach.line04:
    title: Подтвердить небольшое количество
    gloss: Mathieu отвечает «да, немного» — примерно полчашки.
    note: '*Environ* здесь значит «примерно», «около» и смягчает точное количество.'
  fr.a1.unit02.lesson06.teach.line05:
    title: Спросить номер телефона
    gloss: Inès говорит «отлично» и просит у Mathieu номер телефона, чтобы написать ему о следующем занятии.
    note: '*Comme ça je t''écris* («так я смогу тебе написать») объясняет, зачем она спрашивает; в разговоре так естественно пояснять просьбу о контактах.'
  fr.a1.unit02.lesson06.teach.line06:
    title: Назвать номер телефона
    gloss: Mathieu называет свой номер по одной цифре.
    note: '*C''est le* вводит номер; le согласуется с существительным мужского рода *numéro*.'
  fr.a1.unit02.lesson06.teach.line07:
    title: Поблагодарить и спросить о возрасте
    gloss: 'Inès благодарит его и задаёт ещё один вопрос: сколько ему лет.'
    note: '*Une dernière question* («последний вопрос») показывает естественный переход к другой теме внутри того же разговора.'
  fr.a1.unit02.lesson06.teach.line08:
    title: Назвать свой возраст
    gloss: Mathieu говорит, что ему двадцать восемь, и задаёт Inès тот же вопрос.
    note: В *J'ai vingt-huit ans* используется составное число через дефис, как и в других уроках этого юнита.
  fr.a1.unit02.lesson06.teach.line09:
    title: Назвать её возраст
    gloss: Inès говорит, что ей тридцать один год.
    note: В *J'ai trente et un ans* стоит *et* («и»), а не дефис, потому что тридцать один относится к формам на «один», которые разбираются в уроке.
