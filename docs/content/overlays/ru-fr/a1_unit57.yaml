    title: Кто чем пользуется?
    gloss: Camille каждый день звонит Mathieu. Она пользуется телефоном, а не приложением. У Mathieu нет компьютера дома, но он пользуется интернетом на телефоне. Thomas каждое утро смотрит прогноз погоды. Потом он идёт бегать. Léa часто отправляет Camille сообщения. А ты тоже пользуешься телефоном каждый день?
    note: Сравнивает, как четыре героя пользуются устройствами, по образцу сравнительного текста из темы спорта.
