teaching:
  fr.a1.unit49.lesson01.teach.content_triste_en:
    title: Радость, грусть и злость
    gloss: рад, грустный, сердитый
    note: Три базовых слова для чувств с глаголом *être* (быть). У *content* есть женская форма *contente*, а *triste* и *en colère* не меняются.
    example_gloss:
    - Я рад.
    - Мне грустно.
    - Я сержусь.
  fr.a1.unit49.lesson01.teach.je_suis_content:
    title: Говорим, что ты рад
    gloss: Я рад.
    note: 'Основная модель: *être* (быть) + прилагательное, обозначающее чувство. По-русски мы часто говорим «мне грустно», а по-французски — буквально «я грустный»: Je suis ....'
  fr.a1.unit49.lesson01.teach.je_ne_suis:
    title: Противопоставляем чувства
    gloss: Я не сержусь, мне грустно.
    note: '*Ne ... pas* окружает глагол; во второй части предложения называется настоящее чувство.'
  fr.a1.unit49.lesson02.teach.pourquoi_es_tu:
    title: Спрашиваем «почему»
    gloss: Почему ты рад?
    note: '*Pourquoi* (почему) — обычное вопросительное слово для вопроса о причине.'
  fr.a1.unit49.lesson02.teach.je_suis_content:
    title: Называем причину
    gloss: Я рад, потому что у меня новая квартира.
    note: '*Parce que* (потому что) вводит причину; перед *il* оно сокращается до *parce qu''*.'
  fr.a1.unit49.lesson02.teach.je_suis_triste:
    title: Грустная причина
    gloss: Мне грустно, потому что идёт дождь.
    note: Здесь *il pleut* (идёт дождь) из темы о погоде служит причиной.
  fr.a1.unit49.lesson03.teach.nerveux:
    title: Нервный
    gloss: нервный
    note: Обычное слово для обозначения волнения.
    example_gloss: Я нервничаю перед своей первой сменой.
  fr.a1.unit49.lesson03.teach.je_suis_nerveux:
    title: Говорим, из-за чего ты нервничаешь
    gloss: Я нервничаю перед своей первой сменой.
    note: '*Avant* (буквально «перед») указывает, из-за чего волнение. В русском тоже можно сказать «волноваться перед сменой».'
  fr.a1.unit49.lesson03.teach.ne_t_inquiete:
    title: Успокаиваем человека
    gloss: Не волнуйся.
    note: '*Ne t''inquiète pas* (буквально «не беспокой себя») — устойчивая фраза, чтобы успокоить; глагол *s''inquiéter* возвратный.'
  fr.a1.unit49.lesson04.teach.comment_se_sent:
    title: Спрашиваем, как человек себя чувствует
    gloss: Как себя чувствует Матьё?
    note: '*Se sentir* (чувствовать себя, возвратный глагол) — обычный способ спросить об эмоциональном состоянии или описать его; он встречается и в теме о здоровье.'
  fr.a1.unit49.lesson04.teach.il_se_sent:
    title: Описываем, как человек себя чувствует
    gloss: Он нервничает.
    note: '*Se* («себя») — возвратное местоимение 3-го лица, оно стоит рядом с формой *sent*.'
  fr.a1.unit49.lesson04.teach.pourquoi_se_sent:
    title: Спрашиваем, почему человек так себя чувствует
    gloss: Почему он нервничает?
    note: Здесь *pourquoi* сочетается с *se sentir* из фразы *Il se sent nerveux*; *sent-il* пишется через дефис.
  fr.a1.unit49.lesson05.teach.salut_camille_je:
    title: Читаем сообщение о чувствах
    gloss: Привет, Камиль! Я немного нервничаю перед своей первой самостоятельной сменой. Но я ещё и рад, потому что у меня новая работа и новая квартира. Думаю, всё будет хорошо.
    note: Обрати внимание, из-за чего автор нервничает, что его радует и как он смотрит на будущее.
    glosses:
      peu: немного
      nerveux: нервный, взволнованный
      premier: первый
      service: смена
      seul: один, самостоятельно
      content: довольный
      car: потому что
      nouveau: новый
      travail: работа
      nouvel: новый
      appartement: квартира
      pense: думать
      aller: 'получится, сложится (здесь: всё будет хорошо)'
  fr.a1.unit49.lesson06.teach.camille_salut_mathieu:
    title: Камиль спрашивает, как себя чувствует Матьё
    gloss: 'Камиль: Привет, Матьё! Как ты себя чувствуешь перед своей первой сменой?'
    note: '*Avant ton premier service* («перед твоей первой сменой») повторяет модель *avant* + существительное из третьего урока.'
  fr.a1.unit49.lesson06.teach.mathieu_je_suis:
    title: Матьё признаётся, что нервничает
    gloss: 'Матьё: Я немного нервничаю, если честно.'
    note: '*Honnêtement* («честно говоря») смягчает признание.'
  fr.a1.unit49.lesson06.teach.camille_ne_t:
    title: Камиль его успокаивает
    gloss: 'Камиль: Не волнуйся, у тебя всё получится!'
    note: '*Tu vas y arriver* (буквально «ты туда доберёшься») — ободряющее устойчивое выражение; *aller* + инфинитив образует ближайшее будущее.'
  fr.a1.unit49.lesson06.teach.mathieu_merci_ca:
    title: Матьё благодарит её
    gloss: 'Матьё: Спасибо, это правда помогает.'
    note: '*Aide* — форма *il/elle* глагола *aider* (помогать); *m''* — это *me*.'
  fr.a1.unit49.lesson06.teach.camille_et_apres:
    title: Камиль предсказывает, что будет потом
    gloss: 'Камиль: А потом ты наверняка будешь очень рад и горд.'
    note: '*Sûrement* («наверняка») выражает уверенное предположение; *fier* («гордый») — новое полезное прилагательное.'
  fr.a1.unit49.lesson06.teach.mathieu_oui_je:
    title: Матьё соглашается
    gloss: 'Матьё: Да, я тоже так думаю.'
    note: '*Je pense aussi* — естественный способ согласиться с чужим мнением.'
  fr.a1.unit49.lesson06.teach.il_remplace_mathieu:
    title: Подводим итог с il, elle и l'
    gloss: Матьё нервничает перед своей первой сменой. Камиль ему помогает.
    note: '*Il* заменяет мужское имя (*il est nerveux*), *elle* заменяет женское имя, а *l''* (*elle l''aide*) значит «его»: три маленьких, но важных слова, чтобы говорить о другом человеке.'
