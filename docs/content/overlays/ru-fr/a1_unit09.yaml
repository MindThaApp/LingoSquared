course:
  title: Французский язык A1
  description: 'Как спросить дорогу и объяснить её: à gauche/à droite, tout droit, au coin de la rue, traverser. Продолжение истории о кулинарном мастер-классе Инес и Матьё: Инес ищет магазин кухонной утвари. Во французском дорогу можно объяснять повелительным наклонением с vous ("Tournez à gauche") или настоящим временем ("Tu tournes à gauche").'
units:
  fr.a1.unit09.directions:
    title: Как туда добраться?
lessons:
  fr.a1.unit09.lesson01.vocabulaire_directions:
    title: Слова, чтобы найти дорогу
  fr.a1.unit09.lesson02.donner_des_indications:
    title: Объясняем дорогу
  fr.a1.unit09.lesson03.dialogue_chercher_la_boutique:
    title: В поисках магазина
teaching:
  fr.a1.unit09.lesson01.teach.a_gauche:
    title: Слева
    gloss: слева / налево
    note: '*À gauche* употребляется и для места («он слева»), и для направления («поверните налево»).'
    example_gloss: Поверните налево после булочной.
  fr.a1.unit09.lesson01.teach.a_droite:
    title: Справа
    gloss: справа / направо
    note: Прямая противоположность *à gauche*, употребляется так же.
    example_gloss: Аптека справа от кафе.
  fr.a1.unit09.lesson01.teach.tout_droit:
    title: Прямо
    gloss: прямо
    note: '*Tout droit* значит «прямо» — не путай с *à droite* («направо, справа»): они похожи, но значат разное.'
    example_gloss: Идите прямо до рынка.
  fr.a1.unit09.lesson01.teach.au_coin_de_la_rue:
    title: На углу улицы
    gloss: на углу улицы
    note: '*Au coin de* значит «на углу»; *au coin de la rue* («на углу улицы») — очень частый ориентир.'
    example_gloss: Магазин на углу улицы.
  fr.a1.unit09.lesson01.teach.traverser:
    title: Переходить
    gloss: переходить
    note: '*Traverser* — правильный глагол на -ER: *je traverse*, *tu traverses* и так далее.'
    example_gloss: Чтобы дойти до магазина, нужно перейти улицу.
  fr.a1.unit09.lesson01.teach.la_boutique:
    title: Магазин
    gloss: магазин
    note: '*La boutique* обычно означает небольшой специализированный магазин, а не большой универмаг.'
    example_gloss: Магазин на углу улицы, справа.
  fr.a1.unit09.lesson01.teach.le_carrefour:
    title: Перекрёсток
    gloss: перекрёсток
    note: '*Le carrefour* — место, где пересекаются две улицы; частый ориентир в устных объяснениях дороги.'
    example_gloss: На перекрёстке поверните налево.
  fr.a1.unit09.lesson02.teach.pour_aller_a:
    title: Спросить дорогу
    gloss: Извините, как пройти в магазин, пожалуйста?
    note: '*Pour aller à... ?* (буквально «чтобы пойти в...») — стандартный вежливый способ спросить дорогу к какому-то месту.'
  fr.a1.unit09.lesson02.teach.tournez_a_gauche:
    title: Повернуть налево
    gloss: Поверните налево после аптеки.
    note: '*Tournez* — повелительное наклонение от *tourner* («поворачивать») в форме *vous*; обычная форма, когда объясняешь дорогу малознакомому человеку.'
  fr.a1.unit09.lesson02.teach.continuez_tout_droit:
    title: Идти прямо
    gloss: Идите прямо до перекрёстка.
    note: '*Continuez* («продолжайте») + *tout droit* («прямо») — стандартный способ сказать, чтобы человек шёл дальше, никуда не сворачивая.'
  fr.a1.unit09.lesson02.teach.cest_au_coin:
    title: Указать место
    gloss: Он на углу улицы, справа.
    note: Соединяет *au coin de la rue* и *à droite*, чтобы точно указать место.
  fr.a1.unit09.lesson02.teach.cest_loin:
    title: Сказать, что недалеко
    gloss: Это недалеко, пять минут пешком.
    note: '*À cinq minutes à pied* («пять минут пешком») — та же модель времени в пути, которая встречалась, когда Матьё спрашивал про аптеку.'
  fr.a1.unit09.lesson03.teach.line01:
    title: Спросить про магазин
    gloss: Инес спрашивает Матьё, знает ли он магазин, где можно купить кухонную утварь.
    note: '*Tu connais... ?* («ты знаешь...») — стандартный неформальный способ спросить, знаком ли человек с каким-то местом.'
  fr.a1.unit09.lesson03.teach.line02:
    title: Назвать первый шаг
    gloss: Матьё отвечает, что да, недалеко отсюда есть один — на перекрёстке нужно повернуть налево.
    note: '*Il y en a une* («есть один») — здесь *en* заменяет слово *boutique*, чтобы не повторять его; в разговорной речи так делают постоянно.'
  fr.a1.unit09.lesson03.teach.line03:
    title: Подтвердить и спросить дальше
    gloss: 'Инес подтверждает: налево на перекрёстке — и спрашивает, что дальше.'
    note: '*Et ensuite ?* («а потом?») — простой и естественный способ спросить о следующем шаге маршрута.'
  fr.a1.unit09.lesson03.teach.line04:
    title: Назвать второй шаг
    gloss: 'Матьё говорит: потом ты идёшь прямо и переходишь улицу.'
    note: Два глагола движения, соединённые через *et* — естественный способ коротко описать маршрут.
  fr.a1.unit09.lesson03.teach.line05:
    title: Спросить, где именно
    gloss: Инес спрашивает, где именно находится магазин.
    note: '*Exactement* («точно») просит более точный ответ, чем общее направление.'
  fr.a1.unit09.lesson03.teach.line06:
    title: Назвать точное место
    gloss: Матьё говорит, что магазин на углу улицы, прямо напротив булочной.
    note: '*En face de* («напротив») указывает место через ориентир — естественное завершение объяснения дороги.'
