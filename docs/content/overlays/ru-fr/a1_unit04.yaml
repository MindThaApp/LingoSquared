  fr.a1.unit04.lesson03.dialogue_marche:
    title: На рынке с Инес и Матьё
teaching:
  fr.a1.unit04.lesson01.teach.marche:
    title: Рынок
    gloss: рынок
    note: '*Marché* — существительное мужского рода.'
    example_gloss: Рынок открыт по субботам.
  fr.a1.unit04.lesson01.teach.boulangerie:
    title: Пекарня
    gloss: пекарня
    note: '*Boulangerie* — существительное женского рода; это магазин именно хлеба, в отличие от *pâtisserie* (кондитерской).'
    example_gloss: Здесь рядом есть хорошая булочная.
  fr.a1.unit04.lesson01.teach.legumes:
    title: Овощи
    gloss: овощи
    note: '*Légumes* — существительное мужского рода во множественном числе.'
    example_gloss: Я покупаю свежие овощи для мастер-класса.
  fr.a1.unit04.lesson01.teach.fruits:
    title: Фрукты
    gloss: фрукты
    note: '*Fruits* — мужской род, множественное число. Как и в русском («фрукты»), во французском в этом значении обычно употребляется множественное число: *les fruits*.'
    example_gloss: В этом месяце фрукты дорогие.
  fr.a1.unit04.lesson01.teach.prix:
    title: Цена
    gloss: цена
    note: '*Prix* — существительное мужского рода; форма не меняется: в единственном и множественном числе пишется одинаково.'
    example_gloss: Сколько стоит хлеб?
  fr.a1.unit04.lesson01.teach.cher:
    title: Дорогой
    gloss: дорогой
    note: '*Cher* — форма мужского рода; *chère* — женского, *chers*/*chères* — множественного числа. Прилагательное согласуется с существительным, к которому относится.'
    example_gloss: Этот сыр слишком дорогой.
  fr.a1.unit04.lesson01.teach.pas_cher:
    title: Сегодня недорого
    gloss: Сегодня овощи недорогие.
    note: '*Pas cher(s)* (без *ne*) — обычный разговорный способ сказать, что что-то недорого; полная письменная форма — *ne sont pas chers*.'
  fr.a1.unit04.lesson02.teach.un_kilo_de:
    title: Килограмм
    gloss: килограмм
    note: '*De* стоит сразу после слова, обозначающего количество, без артикля. См. ниже грамматическую заметку о *de* после количества.'
    example_gloss: Мне, пожалуйста, килограмм помидоров.
  fr.a1.unit04.lesson02.teach.un_litre_de:
    title: Литр
    gloss: литр
    note: '*Litre* — существительное мужского рода; им измеряют жидкости, так же как *kilo* — твёрдые продукты.'
    example_gloss: Литр молока, пожалуйста.
  fr.a1.unit04.lesson02.teach.euro:
    title: Один евро
    gloss: один евро
    note: '*Euro* принимает окончание множественного числа по общему правилу: *deux euros*, *cinq euros*.'
    example_gloss: Это стоит пять евро.
  fr.a1.unit04.lesson02.teach.de_after_quantity:
    title: De после количества
    gloss: из, (чего-либо)
    note: 'После слова со значением количества (*un kilo*, *un litre*, *beaucoup*, как в *beaucoup de cousins*) во французском ставится просто *de*, а *du*/*de la*/*des* полностью опускаются: *un kilo de tomates*, но никогда не *un kilo des tomates*.'
  fr.a1.unit04.lesson02.teach.combien_ca_coute:
    title: Спросить цену
    gloss: Сколько это стоит?
    note: '*Combien* (сколько) и *ça coûte* (это стоит) вместе — универсальный способ спросить о цене.'
  fr.a1.unit04.lesson02.teach.cest_combien_pain:
    title: Спросить цену конкретного товара
    gloss: Сколько стоит хлеб?
    note: '*C''est combien, [item] ?* — так называют конкретный товар, цену которого спрашивают; это частая альтернатива фразе *Combien ça coûte ?*.'
  fr.a1.unit04.lesson02.teach.ca_fait_combien:
    title: Спросить итоговую сумму
    gloss: Сколько это всего?
    note: '*Ça fait combien ?* — вопрос об общей сумме; его обычно задают в конце покупки, а не о цене одного товара.'
  fr.a1.unit04.lesson03.teach.line01:
    title: Заказать помидоры
    gloss: Инес здоровается с продавцом и просит килограмм помидоров.
    note: Приветствие *Bonjour* сочетается с оборотом *je voudrais* + количество.
  fr.a1.unit04.lesson03.teach.line02:
    title: Спросить, нужно ли что-то ещё
    gloss: Продавец соглашается и спрашивает, не нужно ли ей что-нибудь ещё.
    note: '*Autre chose ?* («что-нибудь ещё?») — стандартный вопрос продавца.'
  fr.a1.unit04.lesson03.teach.line03:
    title: Добавить сыр и спросить его цену
    gloss: Инес просит ещё немного сыра и спрашивает, сколько он стоит.
    note: В *un peu de fromage* («немного сыра») после слова с количеством тоже стоит просто *de*, как в *un kilo de*.
  fr.a1.unit04.lesson03.teach.line04:
    title: Назвать цену за килограмм
    gloss: Продавец говорит, что килограмм стоит восемь евро.
    note: '*X euros le kilo* — естественный французский способ назвать цену за единицу товара. Здесь *le* соответствует русскому «за», а не просто артиклю.'
  fr.a1.unit04.lesson03.teach.line05:
    title: Объяснить, почему ему нужен хлеб здесь
    gloss: Матьё говорит, что тоже хочет хлеба, но булочная сегодня закрыта.
    note: '*Fermée* («закрыта») стоит в женском роде, согласуясь с *la boulangerie*.'
  fr.a1.unit04.lesson03.teach.line06:
    title: Предложить другой вариант
    gloss: 'Инес успокаивает его: хлеб можно купить и здесь.'
    note: '*On peut* («можно», «мы можем») + инфинитив — частый разговорный способ сказать о возможности.'
  fr.a1.unit04.lesson03.teach.line07:
    title: Подтвердить и назвать сумму
    gloss: 'Продавец подтверждает, что у него есть свежий хлеб, подсчитывает сумму и называет её: тринадцать евро пятьдесят.'
    note: '*Ça fait combien en tout ?* здесь продавец говорит сам с собой, подсчитывая сумму, а не спрашивает Инес.'
  fr.a1.unit04.lesson03.teach.line08:
    title: Поблагодарить продавца
    gloss: Инес горячо благодарит его, расплачиваясь.
    note: '*Voilà* здесь сопровождает передачу денег; это слово-жест.'
