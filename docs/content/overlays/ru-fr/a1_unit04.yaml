course:
  title: Французский язык A1
  description: 'Лексика рынка, вопросы о цене и количестве с combien/kilo/litre, а также различие между du/de la и просто de после обозначений количества. Продолжение истории о кулинарном мастер-классе Инес и Матьё: теперь они делают покупки на рынке. Важно помнить: после явного указания количества во французском частичный артикль не употребляется вовсе (un kilo de tomates, а не un kilo des tomates).'
units:
  fr.a1.unit04.shopping:
    title: Покупки с Инес
lessons:
  fr.a1.unit04.lesson01.au_marche:
    title: На рынке
  fr.a1.unit04.lesson02.combien_ca_coute:
