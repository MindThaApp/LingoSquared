answer_policy:
  accent_marks: Display and teach all French accents and the cedilla. In typed A1 answers, accept a variant without accents when every other letter and word is correct.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation or liaison marks.
course:
  title: Французский язык A1
  description: 'Как выразить и спросить о простых вкусах, неприязни и предпочтениях. Продолжаем историю кулинарного мастер-класса Инес и Матьё: они выбирают один из двух рецептов на субботу. Обрати внимание: в конструкции *préférer X à Y* («предпочитать X чему-то Y») используется *à*, а не *que*.'
units:
  fr.a1.unit13.preferences:
    title: Что ты предпочитаешь?
lessons:
  fr.a1.unit13.lesson01.vocabulaire_preferences:
    title: Любить, предпочитать, ненавидеть
  fr.a1.unit13.lesson02.demander_les_preferences:
    title: Спрашиваем о предпочтениях
  fr.a1.unit13.lesson03.dialogue_choisir_la_recette:
    title: Выбираем рецепт на субботу
teaching:
  fr.a1.unit13.lesson01.teach.preferer:
    title: Предпочитать
    gloss: предпочитать
    note: '*Préférer* — глагол на -ER с изменением основы: *je préfère*, но *nous préférons* (в формах *nous/vous* ударение и написание акцента не меняются).'
    example_gloss: Я предпочитаю шоколадный пирог.
  fr.a1.unit13.lesson01.teach.aimer_mieux:
    title: Любить больше
    gloss: любить больше
    note: '*Aimer mieux* — частая замена *préférer*, но сравнение вводится через *que* (*aimer mieux X que Y*), тогда как *préférer* использует *à* (*préférer X à Y*).'
    example_gloss: Я больше люблю солёные блюда, чем сладкие.
  fr.a1.unit13.lesson01.teach.detester:
    title: Ненавидеть
    gloss: ненавидеть
    note: '*Détester* выражает сильную неприязнь, сильнее, чем *ne pas aimer* («не любить»).'
    example_gloss: Матьё терпеть не может слишком острые специи; он предпочитает мягкие блюда.
  fr.a1.unit13.lesson01.teach.plutot:
    title: Скорее
    gloss: скорее
    note: '*Plutôt* смягчает предпочтение: «скорее это», не отвергая полностью другой вариант.'
    example_gloss: Я лучше возьму сыр.
  fr.a1.unit13.lesson01.teach.sucre:
    title: Сладкий
    gloss: сладкий
    note: '*Sucré* описывает вкус еды («сладкий») и не равно *doux* («мягкий, нежный»). Не путай эти два слова.'
    example_gloss: Этот десерт очень сладкий.
  fr.a1.unit13.lesson01.teach.sale:
    title: Солёный / несладкий
    gloss: солёный / несладкий
    note: '*Salé* — обычная противоположность *sucré* в кулинарной лексике. По-русски для этого нужны два слова: «солёный» и «несладкий» (о блюдах, не относящихся к десертам).'
    example_gloss: Сыр солёный.
  fr.a1.unit13.lesson01.teach.la_recette:
    title: Рецепт
    gloss: рецепт
    note: '*La recette* всегда женского рода.'
    example_gloss: Этот рецепт простой.
  fr.a1.unit13.lesson02.teach.quest_ce_que_tu_preferes:
    title: Спросить о предпочтении
    gloss: Что ты предпочитаешь?
    note: '*Qu''est-ce que...* — стандартный способ задать открытый вопрос «что» в разговорном французском.'
  fr.a1.unit13.lesson02.teach.je_prefere_x_a_y:
    title: Выбрать одно из двух
    gloss: Я предпочитаю пирог кишу.
    note: В конструкции *préférer X à Y* предлог *à* вводит то, что нравится меньше. Союз *que* здесь не используется.
  fr.a1.unit13.lesson02.teach.tu_aimes_plutot:
    title: Спросить об общей склонности
    gloss: Ты больше любишь сладкое или солёное?
    note: Здесь *plutôt* сочетается с вопросом выбора с *ou* («или»).
  fr.a1.unit13.lesson02.teach.moi_aussi_moi_non:
    title: Согласиться или не согласиться
    gloss: Я тоже. / Я нет.
    note: '*Moi aussi* соглашается с утверждением; *moi non* не соглашается или выражает противоположное предпочтение.'
  fr.a1.unit13.lesson02.teach.ca_ne_me_derange_pas:
    title: Сказать, что тебе всё равно
    gloss: Мне всё равно.
    note: '*Ça ne me dérange pas* — удобная нейтральная фраза, когда подходит любой вариант.'
  fr.a1.unit13.lesson02.teach.on_pourrait_faire:
    title: Предложить вариант
    gloss: Можно было бы приготовить киш, да?
    note: '*On pourrait* («мы могли бы») + инфинитив мягко предлагает вариант, а *non ?* приглашает согласиться.'
  fr.a1.unit13.lesson03.teach.line01:
    title: Спросить, что готовить
    gloss: 'Матьё спрашивает, что они приготовят в субботу: пирог или киш.'
    note: В *Qu'est-ce qu'on prépare... ?* («что мы готовим») местоимение *on* означает «мы», как обычно в разговорной речи.
  fr.a1.unit13.lesson03.teach.line02:
    title: Назвать предпочтение и спросить собеседника
    gloss: Инес говорит, что предпочитает пирог, скорее сладкий, и спрашивает Матьё.
    note: '*Et toi ?* («а ты?») — самый простой способ превратить высказывание в вопрос к собеседнику.'
  fr.a1.unit13.lesson03.teach.line03:
    title: Назвать противоположное предпочтение
    gloss: Матьё говорит, что больше любит солёное и предпочитает киш пирогу.
    note: Снова та же конструкция *préférer X à Y*.
  fr.a1.unit13.lesson03.teach.line04:
    title: Предложить компромисс
    gloss: Инес предлагает приготовить и то и другое, да?
    note: '*Les deux* («оба») разрешает спор: предлагается приготовить оба блюда.'
  fr.a1.unit13.lesson03.teach.line05:
    title: Принять компромисс
    gloss: Матьё говорит, что это хорошая идея и он совсем не против.
    note: В *Ça ne me dérange pas du tout* фраза из второго урока усилена словами *du tout* («совсем», «вовсе»).
  fr.a1.unit13.lesson03.teach.line06:
    title: Подтвердить решение
    gloss: 'Инес говорит: отлично, сладкий пирог и солёный киш на субботу.'
    note: Окончательное решение повторяется ещё раз чётко, и разговор завершается.
