answer_policy:
  diacritics: 'Teach and display standard French accents and the cedilla. For free-typed A1 answers, accept otherwise-correct forms without diacritics, including ca for ça, tres for très, and enchante for enchanté. This leniency does not erase meaningful letters: masculine enchanté and feminine enchantée remain distinct through the final e even when accents are omitted.'
  apostrophes: Accept straight and typographic apostrophes interchangeably. Require the apostrophe when an exercise specifically tests elision, such as j’habite; do not accept jhabite in that exercise.
  hyphens: Teach the standard hyphens in inverted questions such as allez-vous and vas-tu. In free transcription exercises, accept an otherwise-correct spaced version at A1, but retain the hyphenated form as the model answer.
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of French spacing before question or exclamation marks. Spoken answers are assessed for intelligibility and appropriate register, not written punctuation.
course:
  title: Французский язык A1
  description: 'Ты выучишь приветствия, знакомство, правила чтения вслух и небольшой разговор при первой встрече на стандартном французском Франции. Особое внимание уделено тому, что важно для русскоговорящих: tu и vous, грамматический род, согласование, спряжение глаголов, элизия и liaison.'
units:
  fr.a1.unit01.greetings:
    title: Приветствия и первые встречи
lessons:
  fr.a1.unit01.lesson01.tu_vous_greetings:
    title: Приветствие на «ты» или на «вы»
  fr.a1.unit01.lesson02.names_introductions:
    title: Как назвать имя и спросить имя
  fr.a1.unit01.lesson03.reading_aloud:
    title: Читаем вслух первую встречу
  fr.a1.unit01.lesson04.wellbeing:
    title: Короткий обмен вопросами о самочувствии
  fr.a1.unit01.lesson05.first_meeting_small_talk:
    title: Знакомство в районе
  fr.a1.unit01.lesson06.workshop_dialogue:
    title: Первая встреча на мастер-классе
teaching:
  fr.a1.unit01.lesson01.teach.bonjour:
    title: Нейтральное приветствие
    gloss: здравствуйте; добрый день
    note: Bonjour подходит и для незнакомых, и для коллег, и для друзей в течение дня. Оно передаёт значение «добрый день».
  fr.a1.unit01.lesson01.teach.salut:
    title: Неформальное приветствие
    gloss: привет; пока
    note: Salut говорят в неформальном общении. Им можно начать и закончить разговор, но с незнакомым взрослым лучше его не выбирать.
  fr.a1.unit01.lesson01.teach.au_revoir:
    title: Нейтральное прощание
    gloss: до свидания; прощай
    note: Au revoir подходит и для вежливого, и для неформального общения.
  fr.a1.unit01.lesson01.teach.tu:
    title: «Ты» — обращение к одному человеку
    gloss: ты
    note: Tu — обращение к одному другу, ребёнку или человеку, с которым неформальные отношения. Как и русское «ты», оно требует своих форм глагола.
  fr.a1.unit01.lesson01.teach.vous:
    title: «Вы» — вежливое или во множественном числе
    gloss: вы (вежливое обращение к одному человеку или обращение к нескольким)
    note: Vous — безопасный выбор для одного незнакомого взрослого, а также форма обращения к любой группе людей. Как и русское «вы», оно служит и вежливой формой, и формой множественного числа.
  fr.a1.unit01.lesson01.teach.comment_allez_vous:
    title: Вежливый вопрос о самочувствии
    gloss: Как вы поживаете?
    note: Allez — форма vous глагола aller. Глагол и местоимение стоят в обратном порядке и соединены дефисом. Это устойчивый вежливый вопрос, а не буквальный вопрос о том, куда человек идёт.
  fr.a1.unit01.lesson01.teach.comment_vas_tu:
    title: Неформальный вопрос о самочувствии
    gloss: Как вы поживаете?
    note: Vas — форма tu глагола aller. В неформальном общении allez-vous заменяется на vas-tu, примерно как русское «как вы поживаете?» заменяется на «как ты поживаешь?».
  fr.a1.unit01.lesson01.teach.register_choice:
    title: Подбери приветствие к отношениям
    gloss: Bonjour — с vous; salut — с tu
    note: Это удобные ориентиры, а не строгие законы. Bonjour можно сказать и друзьям, но salut вместе с vous обычно создаёт противоречивое впечатление.
  fr.a1.unit01.lesson02.teach.je_mappelle:
    title: Называем своё имя
    gloss: Меня зовут Камий.
    note: Je m’appelle буквально значит «я зову себя». Во французском подлежащее je обычно обязательно, в отличие от русского, где «я» часто опускают. Гласная в me исчезает перед appelle, получается m’appelle.
  fr.a1.unit01.lesson02.teach.comment_appelez_vous:
    title: Вежливо спросить имя
    gloss: Как вас зовут?
    note: 'Appelez — форма vous глагола appeler. Второе vous стоит после глагола, потому что в вопросе используется инверсия: vous appelez-vous.'
  fr.a1.unit01.lesson02.teach.tu_tappelles:
    title: Спрашиваем имя неформально
    gloss: Как вас зовут?
    note: T’appelles — форма tu, где возвратное местоимение te сокращается перед гласной. В этом повседневном вопросе tu стоит перед глаголом, а comment — в конце.
  fr.a1.unit01.lesson02.teach.moi_cest:
    title: Представиться в разговоре
    gloss: Я — Ноэ.
    note: Moi, c’est — разговорная формула знакомства. Она звучит живее, чем дословный перевод русского «я есть…».
  fr.a1.unit01.lesson02.teach.enchante:
    title: Мужской род
    gloss: Очень приятно.
    note: Мужчина обычно пишет enchanté. Как и русское «рад / рада», это прилагательное меняется в зависимости от пола говорящего.
  fr.a1.unit01.lesson02.teach.enchantee:
    title: Женский род
    gloss: Очень приятно.
    note: Женщина обычно пишет enchantée, добавляя на конце e. Enchanté и enchantée обычно произносятся одинаково, поэтому разницу лучше видно на письме, чем слышно.
  fr.a1.unit01.lesson02.teach.et_vous:
    title: Вежливо задать вопрос в ответ
    gloss: А вы?
    note: Vous используют, чтобы сохранить вежливый тон или обратиться к нескольким людям.
  fr.a1.unit01.lesson02.teach.et_toi:
    title: Неформально задать вопрос в ответ
    gloss: А вы?
    note: Toi — ударная форма, соответствующая tu. После et во французском ставится toi, а не tu.
  fr.a1.unit01.lesson03.teach.elision_jhabite:
    title: Элизия перед гласной
    gloss: я живу
    note: 'Je теряет гласную перед habite, и апостроф показывает эту элизию: j’habite. Буква h в habiter не мешает элизии.'
  fr.a1.unit01.lesson03.teach.liaison_vous_etes:
    title: Liaison после vous
    gloss: вы есть; вы
    note: 'Конечное s в vous обычно не произносится, но перед гласным звуком в êtes оно связывается и звучит как «з»: vous êtes звучит примерно как «вузэт». Liaison относится к устной речи, а не к написанию.'
  fr.a1.unit01.lesson03.teach.liaison_un_atelier:
    title: Liaison после un
    gloss: мастерская; мастер-класс
    note: Конечное n в un связывается с atelier. Не делай резкой паузы между двумя словами.
  fr.a1.unit01.lesson03.teach.final_e_enchante:
    title: Написание в мужском роде
    gloss: рад познакомиться (говорит мужчина)
    note: Enchanté у мужчины заканчивается на é. Сочетание -an- — носовой гласный, поэтому отдельного звука n произносить не нужно.
  fr.a1.unit01.lesson03.teach.final_e_enchantee:
    title: Написание в женском роде
    gloss: рада познакомиться (говорит женщина)
    note: В enchantée добавляется e для женского рода, но эта буква обычно не добавляет ещё один произносимый слог.
  fr.a1.unit01.lesson03.teach.question_liaison:
    title: Читаем вопрос с инверсией
    gloss: Как вы поживаете?
    note: Читай allez-vous как одно целое. Буква z в allez здесь не даёт отдельного звука «з»; стандартное произношение примерно «але ву».
  fr.a1.unit01.lesson04.teach.ca_va:
    title: Повседневный вопрос о самочувствии
    gloss: как дела?; всё в порядке?
    note: В слове Ça есть седиль, из-за которого c читается как «с» перед a. Это же выражение может быть и вопросом, и ответом — всё зависит от интонации.
  fr.a1.unit01.lesson04.teach.tres_bien:
    title: Очень хороший ответ
    gloss: Очень хорошо, спасибо.
    note: Très усиливает bien. Конечное s не произносится.
  fr.a1.unit01.lesson04.teach.ca_va_bien:
    title: Положительный ответ
    gloss: У меня всё хорошо.
    note: В этом устойчивом ответе нет слова, соответствующего «я», — как и в русском «всё хорошо».
  fr.a1.unit01.lesson04.teach.pas_mal:
    title: Умеренно положительный ответ
    gloss: Неплохо.
    note: Pas mal часто звучит слегка положительно, как и русское «неплохо».
  fr.a1.unit01.lesson04.teach.fatigue:
    title: Согласование прилагательного в мужском роде
    gloss: Я немного устал.
    note: Suis — форма je глагола être. Мужчина пишет fatigué. Как и в русском «устал / устала», прилагательное зависит от пола говорящего.
  fr.a1.unit01.lesson04.teach.fatiguee:
    title: Согласование прилагательного в женском роде
    gloss: Я немного устала.
    note: Женщина пишет fatiguée с e на конце. Мужская и женская формы обычно произносятся одинаково.
  fr.a1.unit01.lesson04.teach.et_vous:
    title: Вежливо вернуть вопрос
    gloss: А вы?
    note: Vous сохраняет уважительный тон, принятый с незнакомым взрослым.
  fr.a1.unit01.lesson04.teach.et_toi:
    title: Неформально вернуть вопрос
    gloss: А вы?
    note: Toi после et используют, когда неформально обращаются к одному другу или ровеснику.
  fr.a1.unit01.lesson05.teach.here_for_workshop:
    title: Уточнить, зачем человек пришёл
    gloss: Вы здесь на мастер-класс?
    note: 'Êtes — форма vous глагола être. Вспомогательных слов для вопроса не нужно: вопрос образует повышающаяся интонация.'
  fr.a1.unit01.lesson05.teach.yes_thats_it:
    title: Подтвердить догадку
    gloss: Да, всё верно.
    note: C’est ça — естественное подтверждение, похожее на русское «да, именно так», а не буквальное «это то».
  fr.a1.unit01.lesson05.teach.live_neighborhood:
    title: Спросить, где человек живёт
    gloss: Вы живёте в этом районе?
    note: Habitez — форма vous глагола habiter. Как и в русском, вопрос можно задать с порядком слов утверждения и вопросительной интонацией.
  fr.a1.unit01.lesson05.teach.i_live:
    title: Говорим, где живёшь
    gloss: Я живу в Монтрёе.
    note: J’habite — форма je глагола habiter с элизией. À указывает на город и не должно смешиваться с a — формой глагола со значением «имеет».
  fr.a1.unit01.lesson05.teach.from_here:
    title: Спросить о местном происхождении
    gloss: Вы местный?
    note: D’ici образовано из de и ici с элизией. Êtes остаётся формой vous глагола être.
  fr.a1.unit01.lesson05.teach.from_lille:
    title: Говорим о своём происхождении
    gloss: Я из Лилля.
    note: Suis — форма je глагола être. Для указания происхождения перед названием города во французском используется de.
  fr.a1.unit01.lesson05.teach.workshop_starts:
    title: Занятие начинается
    gloss: Мастер-класс начинается.
    note: Atelier мужского рода, поэтому его артикль в единственном числе — le. Перед гласной le превращается в l’. Commence — форма третьего лица единственного числа.
  fr.a1.unit01.lesson05.teach.see_you_shortly:
    title: Прощание на короткое время
    gloss: до скорого; увидимся позже сегодня
    note: À tout à l’heure предполагает новую встречу в тот же день, в отличие от общего прощания без определённого срока.
  fr.a1.unit01.lesson06.teach.line01:
    title: Начало разговора
    gloss: Инес здоровается с Матьё и уточняет, пришёл ли он на кулинарный мастер-класс.
    note: Собеседники начинают с vous, потому что они незнакомые взрослые.
  fr.a1.unit01.lesson06.teach.line02:
    title: Начало разговора, ответ
    gloss: Матьё подтверждает, называет своё имя и спрашивает её имя.
    note: Je m’appelle — стандартный способ назвать своё имя.
  fr.a1.unit01.lesson06.teach.line03:
    title: Обмен именами
    gloss: Инес называет своё имя и говорит, что рада познакомиться.
    note: Enchantée согласуется с Инес (женский род); окончание -e пишется, но обычно не слышно.
  fr.a1.unit01.lesson06.teach.line04:
    title: Обмен именами, ответ
    gloss: Матьё отвечает тем же и спрашивает, живёт ли она неподалёку.
    note: Enchanté согласуется с Матьё (мужской род) — это то же слово, которое только что сказала Инес, но без немого -e.
  fr.a1.unit01.lesson06.teach.line05:
    title: Обмен сведениями о районе
    gloss: Инес подтверждает, называет свою улицу и задаёт Матьё тот же вопрос.
    note: 'J’habite плюс название улицы: перед rue предлог не нужен.'
  fr.a1.unit01.lesson06.teach.line06:
    title: Обмен сведениями о районе, ответ
    gloss: Матьё говорит, что живёт в Сен-Уэне, и спрашивает, местная ли она.
    note: J’habite à употребляется перед названием места, в отличие от выражения с улицей, которое только что использовала Инес.
  fr.a1.unit01.lesson06.teach.line07:
    title: Обмен сведениями о происхождении
    gloss: Инес говорит, что она не местная, а из Лилля, и спрашивает Матьё.
    note: Je suis de + город — так говорят, откуда ты родом.
  fr.a1.unit01.lesson06.teach.line08:
    title: 'Обмен вопросами о родном городе: ответ'
    gloss: Матьё говорит, что он из Лиона.
    note: Та же модель je suis de, которую только что использовала Инес.
  fr.a1.unit01.lesson06.teach.line09:
    title: Прерываем разговор
    gloss: Инес замечает, что мастер-класс начинается, и говорит, что скоро увидится с ним.
    note: À tout à l’heure подходит, потому что оба останутся на одном и том же мероприятии.
  fr.a1.unit01.lesson06.teach.line10:
    title: 'Прерываем разговор: ответ'
    gloss: Матьё повторяет то же прощание.
    note: Повторить à tout à l’heure в ответ — естественный способ подтвердить, что вы скоро увидитесь.
exercises:
  fr.a1.unit01.lesson01.exercise01.listen_bonjour:
    instruction: Послушай и выбери фразу, которую ты слышишь.
    correct_option: Bonjour.
    distractors:
    - Salut !
    - Au revoir.
    accepted_answers:
    - Bonjour.
    - Bonjour
  fr.a1.unit01.lesson01.exercise02.choose_informal:
    instruction: Какое местоимение подходит к этому неформальному приветствию?
    correct_option: tu
    distractors:
    - vous
    accepted_answers:
    - tu
    feedback: Salut и tu вместе образуют неформальную пару.
  fr.a1.unit01.lesson01.exercise03.choose_polite_pronoun:
    instruction: Закончи приветствие, обращённое к одному незнакомому взрослому.
    accepted_answers:
    - vous
    feedback: Vous — безопасный вежливый выбор для обращения к незнакомому взрослому.
  fr.a1.unit01.lesson01.exercise04.order_polite_question:
    instruction: Расставь слова вежливого вопроса о самочувствии в правильном порядке.
    correct_response:
    - Comment
    - allez-vous
  fr.a1.unit01.lesson01.exercise05.listen_informal_question:
    instruction: Напиши услышанный неформальный вопрос.
    accepted_answers:
    - Comment vas-tu ?
    - Comment vas-tu?
    - Comment vas tu ?
    - Comment vas tu?
  fr.a1.unit01.lesson01.exercise06.match_register:
    instruction: Соедини каждое приветствие с его обычным регистром общения.
    correct_response:
      Bonjour: vous
      Salut: ты
    pairs:
    - left: Bonjour
      right: vous
    - left: Salut
      right: ты
  fr.a1.unit01.lesson01.exercise07.complete_farewell:
    instruction: Закончи нейтральное прощание.
    accepted_answers:
    - revoir
  fr.a1.unit01.lesson01.exercise08.speak_greeting:
    instruction: Вежливо поздоровайся, спроси, как дела у собеседника, и закончи разговор.
    accepted_answers:
    - Bonjour. Comment allez-vous ? Au revoir.
    - Bonjour, comment allez-vous ? Au revoir.
  fr.a1.unit01.lesson02.exercise01.order_self_intro:
    instruction: Составь представление Камиль.
    correct_response:
    - Je
    - m’appelle
    - Camille
  fr.a1.unit01.lesson02.exercise02.listen_name_question:
    instruction: Послушай и выбери вежливый вопрос об имени.
    correct_option: Comment vous appelez-vous ?
    distractors:
    - Tu t’appelles comment ?
    - Comment allez-vous ?
    accepted_answers:
    - Comment vous appelez-vous ?
    - Comment vous appelez vous ?
  fr.a1.unit01.lesson02.exercise03.informal_name_question:
    instruction: После неформального приветствия спроси, как зовут собеседника.
    accepted_answers:
    - Tu t’appelles comment ?
    - Tu t'appelles comment ?
    - Tu t’appelles comment?
    - Tu t'appelles comment?
  fr.a1.unit01.lesson02.exercise04.complete_moi_cest:
    instruction: Закончи разговорное представление Ноэ.
    accepted_answers:
    - c’est
    - c'est
  fr.a1.unit01.lesson02.exercise05_choose_enchantee:
    instruction: Правильно ли форма, которую говорит Камиль, записана в женском роде?
    correct_option: Да — в enchantée есть женское окончание e.
    distractors:
    - Нет — женская форма — enchanté.
    - Нет — обе письменные формы одинаковы.
    accepted_answers:
    - Да — в enchantée есть женское окончание e.
    feedback: В enchantée есть конечная e, которую пишет говорящая женщина.
  fr.a1.unit01.lesson02.exercise06_return_polite_question:
    instruction: Верни вопрос собеседнику, оставаясь в вежливом регистре.
    accepted_answers:
    - Et vous ?
    - Et vous?
  fr.a1.unit01.lesson02.exercise07.match_introductions:
