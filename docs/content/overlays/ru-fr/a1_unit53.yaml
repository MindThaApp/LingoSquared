answer_policy:
  diacritics: 'Teach and display standard French accents and the cedilla. For free-typed A1 answers, accept otherwise-correct forms without diacritics, including ca for ça, tres for très, and enchante for enchanté. This leniency does not erase meaningful letters: masculine enchanté and feminine enchantée remain distinct through the final e even when accents are omitted.'
  apostrophes: Accept straight and typographic apostrophes interchangeably. Require the apostrophe when an exercise specifically tests elision, such as j’habite; do not accept jhabite in that exercise.
  hyphens: Teach the standard hyphens in inverted questions such as allez-vous and vas-tu. In free transcription exercises, accept an otherwise-correct spaced version at A1, but retain the hyphenated form as the model answer.
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of French spacing before question or exclamation marks. Spoken answers are assessed for intelligibility and appropriate register, not written punctuation.
course:
  title: Французский язык A1
  description: 'Французский для начинающих: как описать внешность человека — рост и впечатление о возрасте, цвет волос и глаз, основной вопрос Comment est ... ? и сравнение внешности двух людей.'
units:
  fr.a1.unit53.apparence:
    title: Описываем внешность
lessons:
  fr.a1.unit53.lesson01.grand_petit_vieux_et:
    title: Высокий, низкий, пожилой и молодой
  fr.a1.unit53.lesson02.decrire_les_cheveux:
    title: Описываем волосы
  fr.a1.unit53.lesson03.les_yeux_et_comment:
    title: Глаза и вопрос «Как выглядит человек?»
  fr.a1.unit53.lesson04.camille_decrit_nina:
    title: Камиль описывает Нину
  fr.a1.unit53.lesson05.comparer_thomas_et_lea:
    title: Сравниваем Томаса и Леа
  fr.a1.unit53.lesson06.mathieu_reconnait_nina:
    title: Матьё узнаёт Нину
teaching:
  fr.a1.unit53.lesson01.teach.grand_petit:
    title: Высокий и низкий
    gloss: высокий / невысокий
    note: '*Grand* описывает высокого человека, а *petit* — невысокого. Они согласуются с человеком: *grand/grande*, *petit/petite*.'
    example_gloss:
    - Леа высокая.
    - Томас невысокий.
  fr.a1.unit53.lesson01.teach.vieux_jeune:
    title: Пожилой и молодой
    gloss: пожилой / молодой
    note: '*Vieux* и *jeune* здесь передают общее впечатление о возрасте, а не точное число лет.'
    example_gloss:
    - Дедушка пожилой.
    - Матьё молодой.
  fr.a1.unit53.lesson01.teach.pour_un_age:
    title: 'Возраст: число или впечатление'
    gloss: Для точного возраста во французском используется *avoir* (*Il a vingt ans*), а *être vieux* передаёт общее впечатление (*Mon grand-père est vieux*).
    note: Ты уже знаешь *Quel âge as-tu ?* для вопроса о точном возрасте. Здесь *vieux* говорит о том, насколько человек ВЫГЛЯДИТ старым, без указания числа.
  fr.a1.unit53.lesson01.teach.lea_est_grande:
    title: Леа высокая, а Томас невысокий
    gloss: Леа высокая, а Томас невысокий.
    note: Простое сложное предложение с *et* («и»), которое готовит прямое сравнение в уроке 5.
  fr.a1.unit53.lesson02.teach.les_cheveux:
    title: Волосы
    gloss: волосы
    note: '*Les cheveux* всегда во множественном числе и мужского рода. В русском «волосы» тоже употребляются во множественном числе.'
    example_gloss: У Матьё короткие чёрные волосы.
  fr.a1.unit53.lesson02.teach.blonds_bruns_gris:
    title: Светлый, каштановый и седой
    gloss: светлый / каштановый / седой
    note: 'Три цвета волос. С *cheveux* цвет принимает окончание множественного числа *s*: *blonds*, *bruns*. *Gris* уже оканчивается на *s*, а *noirs* («чёрные») повторяется из раздела об одежде.'
    example_gloss:
    - У Камиль светлые волосы.
    - У Томаса каштановые волосы.
    - У дедушки седые волосы.
  fr.a1.unit53.lesson02.teach.longs_courts:
    title: Длинные и короткие (волосы)
    gloss: длинный / короткий (о волосах)
    note: '*Longs* («длинные») повторяет идею размера из урока 1, но теперь описывает длину волос. *Courts* («короткие») — новое слово, и оба слова с *cheveux* принимают окончание множественного числа *s*.'
    example_gloss:
    - У Леа длинные волосы.
    - У Томаса короткие волосы.
  fr.a1.unit53.lesson02.teach.cheveux_est_toujours:
    title: Cheveux требует прилагательного во множественном числе
    gloss: '*Cheveux* всегда во множественном числе, поэтому прилагательное принимает *s*: *longs*, *courts*, *blonds*, *bruns*, *noirs*. *Gris* уже оканчивается на *s*.'
    note: 'Цвет и длина согласуются с *cheveux* во множественном числе: *les cheveux longs*. Сравни с *yeux* в уроке 3, где *marron* не изменяется.'
  fr.a1.unit53.lesson02.teach.ses_est_le:
    title: 'Ses: его или её'
    gloss: '*Ses* значит «его» или «её» перед существительным во множественном числе: *ses cheveux*, *ses yeux*. Оно согласуется с тем, чем владеют, а не с владельцем.'
    note: 'В русском есть два разных слова, «его» и «её», а во французском здесь одно: *ses yeux* может значить и «её глаза», и «его глаза», а какой вариант имеется в виду, видно из контекста.'
  fr.a1.unit53.lesson02.teach.mathieu_a_les:
    title: У Матьё короткие чёрные волосы
    gloss: У Матьё короткие чёрные волосы.
    note: Здесь снова *noirs* («чёрные») из раздела об одежде.
  fr.a1.unit53.lesson02.teach.camille_a_les:
    title: У Камиль длинные светлые волосы
    gloss: У Камиль длинные светлые волосы.
    note: В одном естественном предложении соединены слова о длине и цвете из этого урока.
  fr.a1.unit53.lesson03.teach.les_yeux:
    title: Глаза
    gloss: глаза
    note: '*Les yeux* — множественное число от *l''œil* («глаз»); *yeux* оканчивается на *x*, а не на *s*.'
    example_gloss: У Матьё карие глаза.
  fr.a1.unit53.lesson03.teach.bleus_marron_verts:
    title: Голубой, карий и зелёный
    gloss: голубой / карий / зелёный
    note: '*Bleus* («голубые», «синие») ты уже встречал(а) в теме одежды; *marron* («карий», «коричневый») никогда не изменяется; *verts* («зелёные») — новое слово.'
    example_gloss:
    - У Камиль голубые глаза.
    - У Томаса карие глаза.
    - У Леа зелёные глаза.
  fr.a1.unit53.lesson03.teach.avec_yeux_pluriel:
    title: Yeux принимает -s, marron не меняется
    gloss: 'С *yeux* (множественное число) прилагательное принимает *s*: *yeux bleus*, *yeux verts*. *Marron* никогда не изменяется: *yeux marron*.'
    note: 'Сравни с *cheveux* из урока 2: существительное во множественном числе требует прилагательного во множественном числе, кроме цветов вроде *marron*, которые пришли из названий предметов.'
  fr.a1.unit53.lesson03.teach.comment_est_camille:
    title: Как выглядит Камиль?
    gloss: Как выглядит Камиль?
    note: '*Comment est ... ?* — главный вопрос этого раздела; с его помощью можно спросить о внешности любого человека.'
  fr.a1.unit53.lesson03.teach.camille_a_les:
    title: У Камиль длинные светлые волосы и голубые глаза
    gloss: У Камиль длинные светлые волосы и голубые глаза.
    note: Образец ответа, в котором волосы и глаза описаны одним предложением с помощью *et*.
  fr.a1.unit53.lesson04.teach.camille_une_nouvelle:
    title: Камиль рассказывает о Нине
    gloss: 'Камиль: В языковое кафе придёт новая девушка. Её зовут Нина.'
    note: '*Une nouvelle fille vient* вводит нового человека в рассказ; *vient* — форма глагола *venir* («приходить»).'
  fr.a1.unit53.lesson04.teach.mathieu_d_accord:
    title: Матьё спрашивает, как она выглядит
    gloss: 'Матьё: Хорошо! Как она выглядит?'
    note: 'Снова основной вопрос, но с *elle* («она») вместо имени: *Comment est-elle ?* Дефис соединяет глагол и местоимение.'
  fr.a1.unit53.lesson04.teach.camille_elle_est:
    title: Камиль описывает рост и волосы Нины
    gloss: 'Камиль: Она невысокая, и у неё короткие светлые волосы.'
    note: Объединяет *petite* из урока 1 и слова о волосах из урока 2; для девушки *petite* получает окончание *e*.
  fr.a1.unit53.lesson04.teach.mathieu_et_ses:
    title: Матьё спрашивает о её глазах
    gloss: 'Матьё: А глаза?'
    note: '*Ses yeux* здесь значит «её глаза»: *ses* согласуется с *yeux*, а не с девушкой.'
  fr.a1.unit53.lesson04.teach.camille_elle_a:
    title: Камиль описывает глаза Нины
    gloss: 'Камиль: У неё зелёные глаза.'
    note: Снова *yeux verts* из урока 3.
  fr.a1.unit53.lesson04.teach.mathieu_merci_alors:
    title: Матьё узнает её
    gloss: 'Матьё: Спасибо! Тогда я её узнаю.'
    note: '*Je vais la reconnaître* — это *aller* + инфинитив, ближайшее будущее; *la* значит «её».'
  fr.a1.unit53.lesson05.teach.thomas_et_lea:
    title: Сравниваем Томаса и Леа
    gloss: Томас и Леа — брат и сестра, но они совсем не похожи. Томас невысокий, у него короткие каштановые волосы и карие глаза. Леа выше Томаса, у неё длинные каштановые волосы и зелёные глаза. А как выглядишь ты?
    note: Короткое сравнение, в котором встречаются все изученные слова о цвете и длине; в конце читателю задан главный вопрос раздела.
    glosses:
      frère: брат
      sœur: сестра
      ressemblent: выглядеть
      différents: разный
      petit: невысокий
      courts: невысокий
      bruns: карий
      cheveux: волосы
      marron: карий
      yeux: глаза
      grande: выше
      longs: длинный
      verts: зелёный
      se: (часть выражения 'se ressemblent' = быть похожими друг на друга)
  fr.a1.unit53.lesson05.teach.tu_connais_deja:
    title: Plus ... que с людьми
    gloss: 'Ты уже знаешь конструкцию *plus* + прилагательное + *que*. Здесь она используется для людей: Леа выше Томаса.'
    note: Та же конструкция *plus ... que*, что и в теме покупок, но теперь для людей, а не для предметов. *Grande* согласуется с *Léa*, потому что это девушка.
  fr.a1.unit53.lesson05.teach.lea_a_les:
    title: У Леа волосы длиннее, чем у Томаса
    gloss: У Леа волосы длиннее, чем у Томаса.
    note: '*Plus longs que* согласуется с *cheveux* (множественное число): *les cheveux plus longs que Thomas*.'
  fr.a1.unit53.lesson05.teach.j_ai_les:
    title: У меня короткие каштановые волосы
    gloss: У меня короткие каштановые волосы.
    note: Образец предложения от первого лица с *J'ai ...*, который можно использовать, чтобы описать свою внешность.
  fr.a1.unit53.lesson06.teach.mathieu_regarde_c:
    title: Матьё замечает Нину
    gloss: 'Матьё: Смотри, это Нина? У неё короткие светлые волосы и зелёные глаза.'
    note: '*Regarde* («смотри») — повелительная форма глагола *regarder* для *tu*, она уже встречалась в одном из прежних диалогов.'
  fr.a1.unit53.lesson06.teach.camille_oui_c:
    title: Камиль подтверждает
    gloss: 'Камиль: Да, это Нина!'
    note: Короткое естественное подтверждение.
  fr.a1.unit53.lesson06.teach.nina_salut_tu:
    title: Нина здоровается с Матьё
    gloss: 'Нина: Привет, ты Матьё?'
    note: 'Простой вопрос при неформальном приветствии: *Tu es ... ?*'
  fr.a1.unit53.lesson06.teach.mathieu_oui_ravi:
    title: Матьё отвечает на приветствие
    gloss: 'Матьё: Да! Рад познакомиться, Нина.'
    note: '*Ravi de te rencontrer* — стандартная фраза при настоящем первом знакомстве (*ravi* говорит мужчина, *ravie* — женщина). Фраза *content de te revoir* для этого не подходит: она говорится тому, кого ты уже знаешь.'
  fr.a1.unit53.lesson06.teach.nina_ravie_de:
    title: Нина отвечает на приветствие
    gloss: 'Нина: Я тоже рада познакомиться!'
    note: 'Диалог заканчивается: Матьё удалось узнать Нину по описанию Камиль.'
