answer_policy:
  accent_marks: Display and teach all French accents and the cedilla. In typed A1 answers, accept a variant without accents when every other letter and word is correct.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation or liaison marks.
course:
  title: Французский язык A1
  description: 'Простые сравнения (plus/moins/aussi... que) и превосходная степень (le/la plus...); продолжение истории Инес и Матьё из кулинарного мастер-класса: они сравнивают два сыра во время покупок. Важно запомнить, что *meilleur* («лучше») и *le meilleur* («самый лучший») образуются неправильно, в отличие от правильной модели *plus... que*, которая работает для большинства других прилагательных.'
units:
  fr.a1.unit14.comparisons:
    title: Больше или меньше?
lessons:
  fr.a1.unit14.lesson01.vocabulaire_comparaisons:
    title: Больше, меньше, так же
  fr.a1.unit14.lesson02.superlatifs:
    title: Самый, наименее
  fr.a1.unit14.lesson03.dialogue_comparer_fromages:
    title: Сравниваем два сыра на рынке
teaching:
  fr.a1.unit14.lesson01.teach.plus_que:
    title: Более... чем
    gloss: более... чем
    note: 'Конструкция *Plus + adjective + que* — стандартная форма сравнительной степени во французском: прилагательное не меняется, перед ним просто ставится plus, а не используется особое окончание, как в русском «дешевле».'
    example_gloss: Этот сыр дороже другого.
  fr.a1.unit14.lesson01.teach.moins_que:
    title: Менее... чем
    gloss: менее... чем
    note: '*Moins* — прямая противоположность *plus* в той же модели сравнения.'
    example_gloss: Этот рецепт менее сложный, чем другой.
  fr.a1.unit14.lesson01.teach.aussi_que:
    title: Так же... как
    gloss: так же... как
    note: 'Конструкция *Aussi + adjective + que* выражает равенство двух предметов: «такой же… как».'
    example_gloss: Пирог так же вкусен, как киш.
  fr.a1.unit14.lesson01.teach.meilleur_que:
    title: Лучше, чем
    gloss: лучше, чем
    note: '*Meilleur* — особая сравнительная форма от *bon* («хороший»). Говорить *plus bon* по-французски нельзя; в русском похожая ситуация: «лучше», а не «более хороший».'
    example_gloss: Этот торт лучше первого.
  fr.a1.unit14.lesson01.teach.cher_bon_marche:
    title: Дорогой, дешёвый
    gloss: дорогой, дешёвый / недорогой
    note: '*Bon marché* неизменяемо: оно не меняет форму, хотя выглядит так, будто должно согласоваться, как другие прилагательные.'
    example_gloss:
    - Сыр дорогой.
    - Овощи недорогие.
  fr.a1.unit14.lesson01.teach.facile_difficile:
    title: Простой, сложный
    gloss: простой, сложный
    note: Частая пара прилагательных для описания рецептов. В мужском и женском роде у них одна и та же форма; во множественном числе добавляется -s (*faciles*, *difficiles*).
    example_gloss:
    - Этот рецепт простой.
    - Киш немного сложный.
  fr.a1.unit14.lesson02.teach.le_plus_cher:
    title: Самый дорогой
    gloss: самый дорогой
    note: '*Le/la plus + прилагательное* образует превосходную степень. Определённый артикль здесь обязателен, в отличие от сравнительной степени.'
    example_gloss: Это самый дорогой сыр на рынке.
  fr.a1.unit14.lesson02.teach.la_moins_chere:
    title: Самый недорогой
    gloss: самый недорогой
    note: '*La moins chère* согласуется с существительным женского рода *recette*; форма мужского рода — *le moins cher*.'
    example_gloss: Это самый недорогой рецепт.
  fr.a1.unit14.lesson02.teach.le_meilleur:
    title: Самый лучший
    gloss: самый лучший
    note: '*Le meilleur* — особая превосходная степень от *bon*, она соответствует особой сравнительной форме *meilleur* из первого урока.'
    example_gloss: Это лучший торт на мастер-классе!
  fr.a1.unit14.lesson02.teach.la_plus_facile:
    title: Самый простой
    gloss: самый простой
    note: Правильная превосходная степень, образованная прямо по модели *le/la plus + прилагательное*.
    example_gloss: Это самый простой рецепт для приготовления.
  fr.a1.unit14.lesson02.teach.grammar_superlative_note:
    title: Модель превосходной степени
    gloss: le/la plus + прилагательное; meilleur — неправильная форма
    note: 'Большинство французских превосходных степеней образуется правильно (*le/la plus + прилагательное*), но цепочку *bon* → *meilleur* → *le meilleur* нужно просто запомнить как исключение. В русском тоже есть похожее: «хороший» → «лучше» → «самый лучший».'
  fr.a1.unit14.lesson02.teach.comparer_les_prix:
    title: Предложить сравнить цены
    gloss: Давай сравним цены перед покупкой.
    note: '*Comparons* — повелительное наклонение от *comparer* в форме *nous*: «давайте сравним». Естественная фраза для покупок.'
  fr.a1.unit14.lesson03.teach.line01:
    title: Заметить два варианта
    gloss: 'Инес говорит: смотри, тут два вида сыра — какой взять?'
    note: '*Lequel* («который из них?») просит собеседника выбрать один из двух уже названных вариантов.'
  fr.a1.unit14.lesson03.teach.line02:
    title: Сравниваем и оцениваем качество
    gloss: Матьё говорит, что этот сыр дороже другого, но выглядит лучше.
    note: '*Avoir l''air* + прилагательное («выглядеть», «казаться») смягчает оценку качества, когда продукт ещё не пробовали.'
  fr.a1.unit14.lesson03.teach.line03:
    title: Не соглашаемся со сравнением
    gloss: Инес переспрашивает, уверен ли он, и говорит, что другой сыр ничуть не хуже, да ещё и дешевле.
    note: В одной реплике использованы *aussi* и *moins* из первого урока, чтобы вежливо возразить. *Que* опущено, потому что из контекста ясно, с каким сыром (сыром Матьё) идёт сравнение.
  fr.a1.unit14.lesson03.teach.line04:
    title: Признаём довод о цене
    gloss: 'Матьё соглашается: верно, из двух он самый дешёвый.'
    note: '*Des deux* («из двух») ограничивает превосходную степень только этой парой, а не всем рынком.'
  fr.a1.unit14.lesson03.teach.line05:
    title: Принимаем окончательное решение
    gloss: 'Инес говорит: тогда берём тот, это лучший вариант для мастер-класса.'
    note: '*Celui-là* («тот») указывает на более дешёвый сыр, о котором только что шла речь.'
  fr.a1.unit14.lesson03.teach.line06:
    title: Отмечаем выгоду
    gloss: Матьё соглашается и говорит, что у них останется больше денег на десерт!
    note: '*Il nous reste* (буквально «нам остаётся») — обычный способ сказать «у нас осталось…».'
