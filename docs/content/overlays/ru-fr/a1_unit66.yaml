    title: Разговор о временах года
    gloss: 'Сейчас весна. Тюльпаны красивые. Нина спрашивает: Какое время года тебе кажется красивым? Матьё говорит: Я люблю лето. Летом мы плаваем. Камиль говорит: Я люблю зиму. Зимой мы катаемся на коньках.'
    note: 'Краткий пересказ разговора в языковом кафе: реплики героев переданы прямой речью.'
