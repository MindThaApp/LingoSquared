answer_policy:
  accent_marks: Display and teach all French accents and the cedilla. In typed A1 answers, accept a variant without accents when every other letter and word is correct.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation or liaison marks.
course:
  title: Французский язык A1
  description: 'Основная лексика еды и напитков и диалог заказа в кафе: повествование о кулинарном мастер-классе Инес и Матьё продолжается совместным обедом после занятия. Особое внимание уделяется частичным артиклям du/de la/de l'' с неисчисляемыми названиями продуктов, которых в русском языке нет.'
units:
  fr.a1.unit05.food:
    title: Обед после мастер-класса
lessons:
  fr.a1.unit05.lesson01.a_table:
    title: За столом
  fr.a1.unit05.lesson02.au_cafe:
    title: В кафе
  fr.a1.unit05.lesson03.dialogue_cafe:
    title: В кафе после мастер-класса
teaching:
  fr.a1.unit05.lesson01.teach.poulet:
    title: Курица
    gloss: курица
    note: '*Poulet* — существительное мужского рода.'
    example_gloss: Я хотел бы курицу.
  fr.a1.unit05.lesson01.teach.poisson:
    title: Рыба
    gloss: рыба
    note: '*Poisson* — существительное мужского рода (в русском «рыба» — женского).'
    example_gloss: Сегодня рыба свежая.
  fr.a1.unit05.lesson01.teach.salade:
    title: Салат
    gloss: салат
    note: '*Salade* — существительное женского рода (в русском «салат» — мужского).'
    example_gloss: Она ест салат.
  fr.a1.unit05.lesson01.teach.riz:
    title: Рис
    gloss: рис
    note: '*Riz* — мужского рода, форма не меняется: единственное и множественное число пишутся одинаково, как *prix*.'
    example_gloss: Рис хорошо подходит к курице.
  fr.a1.unit05.lesson01.teach.eau:
    title: Вода
    gloss: вода
    note: '*Eau* — женского рода; перед гласным звуком артикль сокращается до *l''*, как и в слове *l''addition* дальше в этом уроке.'
    example_gloss: Я хотел бы воды, пожалуйста.
  fr.a1.unit05.lesson01.teach.vin:
    title: Вино
    gloss: вино
    note: '*Vin* — существительное мужского рода (в русском «вино» — среднего).'
    example_gloss: Красное вино очень вкусное.
  fr.a1.unit05.lesson01.teach.je_voudrais_poulet_salade:
    title: Заказываем курицу и салат
    gloss: Я хотел бы курицу и салат.
    note: '*Du poulet* (мужской род) и *de la salade* (женский род) — частичные артикли («немного»), они согласуются с родом существительного. После слов с количеством (*un kilo de*) используется только *de*.'
  fr.a1.unit05.lesson02.teach.dessert:
    title: Dessert
    gloss: десерт
    note: '*Dessert* — существительное мужского рода.'
    example_gloss: Сегодня десерт за счёт заведения.
  fr.a1.unit05.lesson02.teach.addition:
    title: Счёт
    gloss: счёт
    note: '*Addition* — женского рода; перед гласным звуком артикль сокращается до *l''*. Это обычное слово для счёта в ресторане, а не *facture* (официальный счёт-фактура).'
    example_gloss: Счёт, пожалуйста.
  fr.a1.unit05.lesson02.teach.vous_avez_choisi:
    title: Спросить, готовы ли заказывать
    gloss: Вы уже выбрали?
    note: Стандартный вопрос официанта, когда он подходит к столику принять заказ; используется passé composé глагола *choisir* (выбирать).
  fr.a1.unit05.lesson02.teach.je_voudrais_un_cafe:
    title: Заказать кофе
    gloss: Я хотел бы кофе, пожалуйста.
    note: '*Je voudrais* + то, что заказываешь: та же модель, что и в магазине, теперь для еды и напитков.'
  fr.a1.unit05.lesson02.teach.qcq_comme_dessert:
    title: Спросить, что есть
    gloss: Что у вас есть на десерт?
    note: '*Qu''est-ce que vous avez comme...?* — естественный и частый способ спросить, какой выбор есть в определённой категории.'
  fr.a1.unit05.lesson02.teach.cest_delicieux:
    title: Сказать, что очень вкусно
    gloss: Очень вкусно!
    note: Частая восторженная реакция на еду; *délicieux* здесь не меняется, потому что после *c'est* нет существительного с родом.
  fr.a1.unit05.lesson03.teach.line01:
    title: Приветствие и вопрос о заказе
    gloss: Официант здоровается и спрашивает, готовы ли они сделать заказ.
    note: Начинается со слова *Bonjour* — вежливого приветствия при обслуживании.
  fr.a1.unit05.lesson03.teach.line02:
    title: Заказ салата и воды
    gloss: Инес заказывает салат и воду.
    note: '*Je voudrais* вместе с *et* соединяет два заказанных блюда в одной реплике.'
  fr.a1.unit05.lesson03.teach.line03:
    title: Заказ курицы с рисом
    gloss: Матьё заказывает курицу с рисом.
    note: '*Avec* (с) связывает основное блюдо с гарниром — простая и частая конструкция при заказе.'
  fr.a1.unit05.lesson03.teach.line04:
    title: Подтверждение и вопрос о напитках
    gloss: Официант подтверждает заказ и спрашивает о напитках.
    note: '*Et comme boisson pour vous ?* повторяет модель с *comme* из фразы *Qu''est-ce que vous avez comme dessert ?*, теперь для напитков.'
  fr.a1.unit05.lesson03.teach.line05:
    title: Заказ бокала вина
    gloss: Матьё заказывает бокал красного вина.
    note: '*Un verre de* (бокал/стакан) — стандартный способ заказать вино бокалом.'
  fr.a1.unit05.lesson03.teach.line06:
    title: Реакция на еду
    gloss: Инес говорит, что салат очень вкусный.
    note: Снова *C'est délicieux !*, теперь о конкретном блюде (*cette salade*). После *c'est* слово *délicieux* остаётся в мужском роде, хотя *salade* женского рода; вариант с согласованием — *Elle est délicieuse, cette salade !*.
  fr.a1.unit05.lesson03.teach.line07:
    title: Объяснить голод и попросить счёт
    gloss: Матьё говорит, что после мастер-класса они проголодались, и просит счёт.
    note: '*Nous a donné faim* (буквально «дал нам голод») — естественный французский способ сказать, что от чего-то захотелось есть.'
  fr.a1.unit05.lesson03.teach.line08:
    title: Подтверждение, что счёт скоро будет
    gloss: Официант отвечает, что сейчас принесёт счёт.
    note: '*Tout de suite* (сейчас же) — частая успокаивающая фраза при обслуживании.'
