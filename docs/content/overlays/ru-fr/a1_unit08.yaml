  fr.a1.unit08.lesson03.dialogue_derniere_seance:
    title: Последнее занятие мастер-класса
teaching:
  fr.a1.unit08.lesson01.teach.lundi:
    title: Понедельник
    gloss: понедельник
    note: Дни недели во французском языке мужского рода и, как и в русском, пишутся со строчной буквы.
    example_gloss: Мастер-класс никогда не проходит по понедельникам.
  fr.a1.unit08.lesson01.teach.samedi:
    title: Суббота
    gloss: суббота
    note: '*Le samedi* (с артиклем) означает «по субботам», то есть регулярно; *samedi* без артикля — одна конкретная суббота: ближайшая, будущая или прошедшая, в зависимости от времени глагола.'
    example_gloss: Мастер-класс проходит по субботам.
  fr.a1.unit08.lesson01.teach.dimanche:
    title: Воскресенье
    gloss: воскресенье
    note: Тот же мужской род и строчная буква, что и у других дней недели.
    example_gloss: Булочная закрыта по воскресеньям.
  fr.a1.unit08.lesson01.teach.aujourdhui:
    title: Сегодня
    gloss: сегодня
    note: '*Aujourd''hui* — одно неизменяемое слово, хотя исторически оно образовано из нескольких частей.'
    example_gloss: Сегодня суббота.
  fr.a1.unit08.lesson01.teach.demain:
    title: Завтра
    gloss: завтра
    note: '*Demain* — неизменяемое слово, оно употребляется одинаково в любом контексте.'
    example_gloss: Аптека открывается завтра.
  fr.a1.unit08.lesson01.teach.hier:
    title: Вчера
    gloss: вчера
    note: '*Hier* — прямая противоположность *demain*.'
    example_gloss: Вчера я ел рыбу.
  fr.a1.unit08.lesson01.teach.quel_jour_sommes_nous:
    title: Спрашиваем день недели
    gloss: Какой сегодня день?
    note: '*Quel jour sommes-nous ?* (буквально «какой день мы есть») — стандартный способ спросить, какой сегодня день недели.'
  fr.a1.unit08.lesson02.teach.mars:
    title: Март
    gloss: март
    note: Месяцы, как и дни недели, во французском языке мужского рода и пишутся со строчной буквы — так же, как в русском.
    example_gloss: Мастер-класс заканчивается в марте.
  fr.a1.unit08.lesson02.teach.quelle_est_la_date:
    title: Спрашиваем дату
    gloss: Какое сегодня число?
    note: '*Quelle est la date... ?* — стандартный способ спросить полную дату, в отличие от *Quel jour sommes-nous ?*, который спрашивает только о дне недели.'
  fr.a1.unit08.lesson02.teach.cest_le_quinze_mars:
    title: Назвать дату
    gloss: Сегодня пятнадцатое марта.
    note: '*Le* + количественное числительное + месяц — стандартная французская модель даты: *quinze* («пятнадцать»), а не порядковое «пятнадцатое», как по-русски.'
  fr.a1.unit08.lesson02.teach.nous_sommes_le:
    title: Называем сегодняшнюю дату
    gloss: Сегодня пятнадцатое марта.
    note: '*Nous sommes le...* — столь же частая альтернатива *C''est le...* для названия сегодняшней даты.'
  fr.a1.unit08.lesson02.teach.le_premier:
    title: Первое (число месяца)
    gloss: первое
    note: '*Le premier* — ЕДИНСТВЕННОЕ исключение из правила: все остальные числа месяца называются обычным количественным числительным (*le deux*, *le trois*…), а первое — порядковым *premier*.'
  fr.a1.unit08.lesson02.teach.le_vingt_deux:
    title: Называем дату окончания
    gloss: Мастер-класс заканчивается двадцать второго марта.
    note: '*Se termine* («заканчивается») — возвратный глагол; *vingt-deux* — обычное количественное числительное, как и quinze в *le quinze mars*.'
  fr.a1.unit08.lesson03.teach.line01:
    title: Спрашиваем, когда последнее занятие
    gloss: Инès спрашивает, когда последнее занятие мастер-класса.
    note: '*C''est quand... ?* («когда это?») — естественный и простой способ спросить о времени.'
  fr.a1.unit08.lesson03.teach.line02:
    title: Называем дату и день недели
    gloss: Матьё говорит, что, кажется, двадцать второго марта — в субботу.
    note: '*Un samedi* («одна из суббот», без *le*) просто указывает, на какой день недели приходится эта дата.'
  fr.a1.unit08.lesson03.teach.line03:
    title: Спросить сегодняшнее число
    gloss: Инès спрашивает, какое сегодня число.
    note: Тот же вопрос *Quelle est la date aujourd'hui ?*, которым ты уже спрашивал(а) дату.
  fr.a1.unit08.lesson03.teach.line04:
    title: Называем сегодняшнюю дату и срок
    gloss: Матьё говорит, что сегодня пятнадцатое марта, значит, это через неделю.
    note: '*Dans une semaine* («через неделю») выражает промежуток времени от сегодняшнего дня.'
  fr.a1.unit08.lesson03.teach.line05:
    title: Реагируем планом
    gloss: 'Инès говорит: отлично, у неё есть время приготовить десерт по этому случаю.'
    note: '*J''ai le temps de* + инфинитив («у меня есть время…») — распространённый способ сказать, что времени на что-то хватает.'
  fr.a1.unit08.lesson03.teach.line06:
    title: Подтверждаем план
    gloss: 'Матьё говорит: хорошая идея, тогда увидимся в следующую субботу, двадцать второго.'
    note: '*Samedi prochain* («в следующую субботу») сразу подтверждает и день недели, и дату, завершая разговор.'
