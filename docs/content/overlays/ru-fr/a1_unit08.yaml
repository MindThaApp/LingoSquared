  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation or liaison marks.
course:
  title: Французский язык A1
  description: 'Дни недели и названия дат (le + количественное числительное + месяц, единственное исключение — le premier), продолжение истории о кулинарном мастер-классе Инès и Матьё: они планируют последнее занятие. Во французском в датах везде используются количественные числительные (le quinze mars), в отличие от русского, где нужно порядковое («пятнадцатое марта»); исключение — первое число месяца.'
units:
  fr.a1.unit08.dates:
    title: Какое сегодня число?
lessons:
  fr.a1.unit08.lesson01.jours_de_la_semaine:
    title: Дни недели
  fr.a1.unit08.lesson02.donner_la_date:
