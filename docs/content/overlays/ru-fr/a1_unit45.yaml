teaching:
  fr.a1.unit45.lesson01.teach.tu_fais_quoi:
    title: Спрашиваем о профессии
    gloss: Кем ты работаешь?
    note: Стандартный разговорный способ спросить, кем человек работает.
  fr.a1.unit45.lesson01.teach.le_metier_cuisinier:
    title: Профессия / повар
    gloss: профессия; повар
    note: '*Métier* (профессия) мужского рода: *le métier*. *Cuisinier* меняется для женщины: *un cuisinier*, *une cuisinière*.'
    example_gloss:
    - Кем ты работаешь?
    - Я работаю поваром.
  fr.a1.unit45.lesson01.teach.je_travaille_comme:
    title: Говорим, что ты повар
    gloss: Я работаю поваром.
    note: '*Travailler comme* + профессия — стандартная конструкция, чтобы назвать свою работу; перед названием профессии артикля нет.'
  fr.a1.unit45.lesson01.teach.infirmiere:
    title: Медсестра
    gloss: медсестра
    note: 'Современное название этой профессии, нейтральное по роду: подходит для любого пола.'
    example_gloss: Я работаю медбратом.
  fr.a1.unit45.lesson01.teach.je_travaille_comme_2:
    title: Говорим, что работаешь медбратом
    gloss: Я работаю медбратом.
    note: Та же конструкция *travailler comme*, что и с *cuisinier*; женский род — *infirmière*.
  fr.a1.unit45.lesson02.teach.ou_travailles_tu:
    title: Спрашиваем о месте работы
    gloss: Где ты работаешь?
    note: Естественный вопрос после *Tu fais quoi dans la vie ?*
  fr.a1.unit45.lesson02.teach.je_travaille_dans:
    title: Работа в ресторане
    gloss: Я работаю в ресторане.
    note: Здесь перед *restaurant* стоит неопределённый артикль, потому что это один из многих ресторанов.
  fr.a1.unit45.lesson02.teach.l_hopital:
    title: Больница
    gloss: больница
    note: '*Hôpital* — мужского рода и начинается с гласного звука: *l''hôpital*.'
    example_gloss: Я работаю в больнице.
  fr.a1.unit45.lesson02.teach.je_travaille_a:
    title: Работа в больнице
    gloss: Я работаю в больнице.
    note: В *à l'hôpital* используется определённый артикль, потому что это конкретное, известное место; *le* перед гласным звуком превращается в *l'*.
  fr.a1.unit45.lesson02.teach.certaines_personnes_travaillent:
    title: Работа в офисе
    gloss: Некоторые люди работают в офисе.
    note: '*Dans un bureau* (в офисе) требует артикля, как и *dans un restaurant*.'
  fr.a1.unit45.lesson03.teach.je_commence_a:
    title: Время начала работы
    gloss: Я начинаю в девять часов.
    note: '*Commence* — форма *je* глагола *commencer* (начинать); *à neuf heures* указывает время.'
  fr.a1.unit45.lesson03.teach.je_travaille_du:
    title: Рабочие дни
    gloss: Я работаю с понедельника по пятницу.
    note: '*Du lundi au vendredi* значит «с понедельника по пятницу»; *du* — это *de* + *le*, а *au* — это *à* + *le*.'
  fr.a1.unit45.lesson03.teach.la_pause:
    title: Перерыв
    gloss: перерыв
    note: '*Pause* — женского рода: *la pause*.'
    example_gloss: У меня перерыв в двенадцать часов.
  fr.a1.unit45.lesson03.teach.j_ai_une:
    title: Перерыв на работе
    gloss: У меня перерыв в двенадцать часов.
    note: '*Avoir une pause* (иметь перерыв) — привычное устойчивое выражение.'
  fr.a1.unit45.lesson03.teach.je_finis_a:
    title: Время окончания работы
    gloss: Я заканчиваю в пять часов.
    note: '*Finis* — форма *je* глагола *finir* (заканчивать).'
  fr.a1.unit45.lesson03.teach.je_commence_a_2:
    title: Целый рабочий день
    gloss: Я начинаю в девять часов и заканчиваю в пять часов.
    note: '*Je commence* и *je finis* соединяются с помощью *et* в одно предложение, описывающее весь рабочий день.'
  fr.a1.unit45.lesson04.teach.avec_il_ou:
    title: Окончания глаголов с il и elle
    gloss: 'С «он» и «она» глаголы на -er сохраняют форму, как с «я»: я работаю, он работает, она работает.'
    note: '*Travaille* одинаково для *je*, *il* и *elle*: у правильных глаголов на *-er* в третьем лице ничего не добавляется.'
  fr.a1.unit45.lesson04.teach.camille_travaille_comme:
    title: Работа Камиль
    gloss: Камиль работает медсестрой.
    note: '*Travaille* подходит к *je*, *il* и *elle*: окончание не произносится, поэтому все три формы звучат одинаково.'
  fr.a1.unit45.lesson04.teach.mathieu_travaille_comme:
    title: Работа Матьё
    gloss: Матьё работает поваром.
    note: То же окончание, что и в *Camille travaille comme infirmière*.
  fr.a1.unit45.lesson04.teach.elle_travaille_a:
    title: Используем местоимения
    gloss: Она работает в больнице. Он работает в ресторане.
    note: '*Elle* и *il* заменяют имена Camille и Mathieu, а форма глагола остаётся той же.'
  fr.a1.unit45.lesson05.teach.camille_travaille_comme:
    title: Читаем два рассказа о работе
    gloss: Камиль работает медсестрой в больнице. Она начинает в семь часов и работает с понедельника по пятницу. Матьё работает поваром в ресторане. Он начинает в одиннадцать часов и делает перерыв в четыре часа.
    note: Следи отдельно за профессией, местом работы и графиком каждого человека.
    glosses:
      travaille: работает
      infirmière: медсестра
      l'hôpital: больница
      commence: начинается
      sept: семь
      lundi: понедельник
      vendredi: пятница
      cuisinier: повар / шеф-повар
      restaurant: ресторан
      onze: одиннадцать
      pause: перерыв
  fr.a1.unit45.lesson06.teach.camille_salut_mathieu:
    title: Камиль спрашивает о работе
    gloss: 'Камиль: Привет, Матьё! Мне любопытно, а кем ты работаешь?'
    note: '*Au fait* («кстати») смягчает вопрос: он звучит как дружеский интерес, а не допрос.'
  fr.a1.unit45.lesson06.teach.mathieu_je_travaille:
    title: Матьё отвечает
    gloss: 'Матьё: Я работаю поваром в ресторане. А ты?'
    note: '*Et toi ?* — стандартный способ вернуть вопрос собеседнику.'
  fr.a1.unit45.lesson06.teach.camille_je_travaille:
    title: Камиль отвечает
    gloss: 'Камиль: Я работаю медсестрой в больнице.'
    note: Совпадает с профессией и местом работы, уже названными в предыдущих уроках.
  fr.a1.unit45.lesson06.teach.mathieu_tu_fais:
    title: Матьё спрашивает о графике
    gloss: 'Матьё: А какой у тебя график?'
    note: '*Tu fais quels horaires ?* — естественный способ спросить о рабочем графике; *quels* согласуется с множественным числом *horaires*.'
  fr.a1.unit45.lesson06.teach.camille_je_commence:
    title: Камиль рассказывает о своём графике
    gloss: 'Камиль: Я начинаю в семь часов и работаю с понедельника по пятницу.'
    note: Совпадает с графиком, уже названным в тексте для чтения.
  fr.a1.unit45.lesson06.teach.mathieu_c_est:
    title: Матьё реагирует
    gloss: 'Матьё: Это рано! А я начинаю позже, в одиннадцать часов.'
    note: Совпадает со временем начала работы Матьё, уже названным в уроке.
  fr.a1.unit45.lesson06.teach.camille_chaque_metier:
    title: Камиль завершает тему
    gloss: 'Камиль: У каждой профессии свой ритм, мне кажется.'
    note: 'Естественная итоговая реплика-размышление: достаточно понимать смысл, повторять дословно не нужно.'
