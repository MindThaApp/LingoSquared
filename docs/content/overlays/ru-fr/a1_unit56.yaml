  fr.a1.unit56.lesson05.teach.camille_voyage_tous:
    title: Кто как добирается?
    gloss: Камиль каждый день ездит на работу на поезде. Матьё в основном ездит на велосипеде, но когда идёт дождь, он тоже садится на поезд. Тома предпочитает ездить на машине. Леа живёт совсем рядом и ходит на работу пешком. А ты как добираешься на работу?
    note: Сравниваются четыре способа добраться до работы и одно условие (дождь), как в тексте о видах спорта в предыдущем уроке.
    glosses:
      voyage: ездит
      tous: каждый
      jours: день
      train: поезд
      travail: работать
      vélo: ездит на велосипеде
      surtout: обычно
      pleut: идёт дождь
      prend: едет, садится (на транспорт)
      aller: ездит на машине
      préfère: предпочитает
      voiture: машина
      habite: живёт
      près: близко
      marche: ходит пешком
      vas: ездишь, добираешься
  fr.a1.unit56.lesson05.teach.lea_habite_tout:
    title: Леа живёт рядом и ходит на работу пешком
    gloss: Леа живёт совсем рядом и ходит на работу пешком.
  fr.a1.unit56.lesson06.teach.camille_on_va:
