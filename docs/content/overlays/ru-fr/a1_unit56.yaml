  fr.a1.unit56.lesson04.teach.pour_les_transports:
    title: À vélo, en train
    gloss: По-французски *à* используется для транспорта, на котором ты едешь верхом или идёшь сам (*à vélo*, *à pied*), а *en* — для транспорта, внутри которого ты сидишь (*en train*, *en voiture*).
    note: Не говори *par vélo* или *dans le train*. Запомни *à vélo*, *à pied*, *en train* и *en voiture* как устойчивые выражения.
  fr.a1.unit56.lesson04.teach.mathieu_alors_je:
