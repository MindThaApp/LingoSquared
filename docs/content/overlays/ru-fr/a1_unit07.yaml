teaching:
  fr.a1.unit07.lesson01.teach.gare:
    title: Вокзал
    gloss: вокзал
    note: '*Gare* — женского рода.'
    example_gloss: Вокзал большой.
  fr.a1.unit07.lesson01.teach.pharmacie:
    title: Аптека
    gloss: аптека
    note: '*Pharmacie* — женского рода.'
    example_gloss: Аптека открывается в девять.
  fr.a1.unit07.lesson01.teach.banque:
    title: Банк
    gloss: банк
    note: '*Banque* — женского рода.'
    example_gloss: Банк закрыт по воскресеньям.
  fr.a1.unit07.lesson01.teach.ecole:
    title: Школа
    gloss: школа
    note: '*École* — женского рода; *l''* стоит вместо артикля перед гласным звуком.'
    example_gloss: Школа рядом с парком.
  fr.a1.unit07.lesson01.teach.cafe:
    title: Кафе
    gloss: кафе
    note: '*Café* — мужского рода; в других контекстах это слово также означает «кофе».'
    example_gloss: Кафе открыто весь день.
  fr.a1.unit07.lesson01.teach.poste:
    title: Почта
    gloss: почта
    note: '*Poste* (женский род) здесь означает «почта»; *le poste* (мужской род, другое значение) может означать «должность, место работы» — род меняет значение.'
    example_gloss: Почта закрывается в шесть.
  fr.a1.unit07.lesson01.teach.la_gare_est_grande:
    title: Сравнить два места
    gloss: Вокзал большой, а аптека маленькая.
    note: '*Grande* и *petite* здесь согласуются с существительными женского рода (*la gare*, *la pharmacie*).'
  fr.a1.unit07.lesson02.teach.ou_est_la_gare:
    title: Спросить, где находится место
    gloss: Где вокзал, пожалуйста?
    note: '*Où est... ?* — стандартный универсальный способ спросить, где находится место.'
  fr.a1.unit07.lesson02.teach.en_face_de:
    title: Сказать, что что-то напротив
    gloss: Банк напротив вокзала.
    note: '*En face de* (напротив) оканчивается на *de*, за которым следует ориентир: *en face de la banque*. Перед существительным мужского рода de сливается с артиклем: *en face du café*.'
  fr.a1.unit07.lesson02.teach.a_cote_de:
    title: Сказать, что что-то рядом
    gloss: Аптека рядом с банком.
    note: '*À côté de* (рядом с) строится так же, с *de*, как и *en face de*.'
  fr.a1.unit07.lesson02.teach.pres_de:
    title: Сказать, что что-то близко
    gloss: Школа недалеко отсюда.
    note: '*Près de* (близко от) перед гласным звуком превращается в *près d''*, как в *près d''ici* (недалеко отсюда).'
  fr.a1.unit07.lesson02.teach.loin_de:
    title: Сказать, что что-то далеко
    gloss: Почта далеко отсюда.
    note: '*Loin de* (далеко от) — прямая противоположность *près de*.'
  fr.a1.unit07.lesson02.teach.cest_loin:
    title: Спросить, далеко ли это
    gloss: Это далеко отсюда? — Нет, это недалеко.
    note: '*C''est loin d''ici ?* — естественный уточняющий вопрос после того, как тебе объяснили дорогу. Чтобы ответить отрицательно, поставь *ne... pas* вокруг глагола: *ce n''est pas loin* (это недалеко).'
  fr.a1.unit07.lesson03.teach.line01:
    title: Спросить дорогу у незнакомого человека
    gloss: Матьё вежливо спрашивает прохожую, где аптека.
    note: '*Excusez-moi* (извините) — стандартное вежливое начало, когда обращаешься к незнакомому человеку; сочетается с *vous*.'
  fr.a1.unit07.lesson03.teach.line02:
    title: Объяснить, где находится место
    gloss: Она говорит, что аптека напротив банка, рядом с кафе.
    note: В одном предложении сочетаются *en face de* и *à côté de*, чтобы точно указать место. *De* + *le café* сливается в *du café*.
  fr.a1.unit07.lesson03.teach.line03:
    title: Спрашиваем, далеко ли
    gloss: Матьё спрашивает, далеко ли это отсюда.
    note: Тот же вопрос *C'est loin d'ici ?*, которым спрашивают о расстоянии.
  fr.a1.unit07.lesson03.teach.line04:
    title: 'Успокоить: это близко'
    gloss: Она отвечает, что нет, совсем рядом — пять минут пешком.
    note: '*À pied* (пешком) — стандартный способ указать, что идёшь пешком.'
  fr.a1.unit07.lesson03.teach.line05:
    title: Поблагодарить
    gloss: Матьё тепло благодарит её.
    note: '*Merci beaucoup* усиливает простое *merci*, уже знакомое по прошлым урокам.'
  fr.a1.unit07.lesson03.teach.line06:
    title: Ответить на благодарность
    gloss: 'Она отвечает: «Пожалуйста».'
    note: '*Je vous en prie* — более формальное «пожалуйста», соответствующее вежливой форме *vous*, которую используют с незнакомым человеком; *De rien* — менее формальный, повседневный вариант.'
