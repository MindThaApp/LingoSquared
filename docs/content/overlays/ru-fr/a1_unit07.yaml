course:
  title: Французский язык A1
  description: 'Привычные места в районе, вопросы о дороге и простые указания (en face de, à côté de, près de, loin de); Матьё продолжает искать аптеку рядом с мастерской. Все эти выражения места оканчиваются на de, которое перед существительным мужского рода или множественного числа сливается с артиклем: du café, des arbres.'
