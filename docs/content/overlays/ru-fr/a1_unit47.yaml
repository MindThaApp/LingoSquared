teaching:
  fr.a1.unit47.lesson01.teach.le_temps:
    title: Погода
    gloss: погода
    note: '*Le temps* значит и «погода», и «время»; это слово мужского рода.'
    example_gloss: Какая погода?
  fr.a1.unit47.lesson01.teach.quel_temps_fait:
    title: Вопрос о погоде
    gloss: Какая погода?
    note: '*Quel temps fait-il ?* — стандартный вопрос о погоде; *quel* согласуется с существительным мужского рода *temps*.'
  fr.a1.unit47.lesson01.teach.le_temps_est:
    title: Солнечно
    gloss: Солнечно.
    note: '*Le temps est* + прилагательное — стандартная модель; прилагательное согласуется с существительным мужского рода *temps*.'
  fr.a1.unit47.lesson01.teach.il_pleut:
    title: Дождь
    gloss: Идёт дождь.
    note: '*Pleuvoir* (идти, о дожде) употребляется безлично: *il pleut*, прилагательное не нужно.'
  fr.a1.unit47.lesson01.teach.le_temps_est_2:
    title: Облачно
    gloss: Облачно.
    note: Та же модель *le temps est* + прилагательное, что и с *ensoleillé*.
  fr.a1.unit47.lesson02.teach.il_fait_froid:
    title: Холодно
    gloss: Сегодня холодно.
    note: '*Aujourd''hui* (сегодня) указывает время; в *il fait froid* используется глагол *faire*, а не *être*.'
  fr.a1.unit47.lesson02.teach.il_fait_chaud:
    title: Тепло
    gloss: Сегодня тепло.
    note: '*Il fait chaud* в повседневной речи значит и «тепло», и «жарко».'
  fr.a1.unit47.lesson02.teach.il_ne_fait:
    title: Сравнение температуры
    gloss: Не холодно, а тепло.
    note: '*Ne ... pas* окружает глагол: *il ne fait pas froid*.'
  fr.a1.unit47.lesson03.teach.la_meteo:
    title: Прогноз погоды
    gloss: прогноз погоды
    note: '*La météo* — слово женского рода, сокращение от *la météorologie*.'
    example_gloss: Какой прогноз погоды?
  fr.a1.unit47.lesson03.teach.demain_le_temps:
    title: Погода на завтра
    gloss: Завтра солнечно.
    note: '*Demain* стоит в начале предложения, после него ставится запятая; остальной порядок слов обычный.'
  fr.a1.unit47.lesson03.teach.samedi_le_temps:
    title: Прогноз на два дня
    gloss: В субботу солнечно и тепло, а в воскресенье весь день дождь.
    note: '*Toute la journée* (весь день) подчёркивает, как долго идёт дождь.'
  fr.a1.unit47.lesson04.teach.la_promenade:
    title: Прогулка
    gloss: прогулка
    note: 'Слово *promenade* женского рода: *la promenade*.'
    example_gloss: Пойдём погуляем?
  fr.a1.unit47.lesson04.teach.on_fait_une:
    title: Предложение погулять
    gloss: Пойдём погуляем?
    note: '*On fait une promenade ?* — дружеское предложение; *faire une promenade* — устойчивое выражение со значением «пойти погулять».'
  fr.a1.unit47.lesson04.teach.s_il_pleut:
    title: План на условие
    gloss: Если пойдёт дождь, мы останемся дома.
    note: '*S''il pleut* (если идёт дождь): *si* + *il* превращается в *s''il*; затем *on reste à l''intérieur* говорит, что вы делаете.'
  fr.a1.unit47.lesson04.teach.bonne_idee_faisons:
    title: Согласие и предложение
    gloss: Хорошая идея! Давай погуляем.
    note: '*Faisons ...* («давайте ...») — ещё один частый способ предложить занятие, наряду с *On ... ?*'
  fr.a1.unit47.lesson05.teach.meteo_samedi_le:
    title: Прочитай прогноз на два дня
    gloss: 'Прогноз погоды: в субботу солнечно и тепло. В воскресенье весь день дождь.'
    note: Следи за тем, в какой день какая погода.
    glosses:
      Météo: прогноз погоды
      samedi: суббота
      ensoleillé: солнечный
      chaud: тёплый
      Dimanche: воскресенье
      pleut: идёт дождь
      toute: весь
      journée: день
  fr.a1.unit47.lesson06.teach.camille_quel_temps:
    title: Камиль спрашивает о выходных
    gloss: 'Камиль: Какая погода будет на этих выходных?'
    note: '*Ce week-end* (в эти выходные) относит вопрос к ближайшему будущему.'
  fr.a1.unit47.lesson06.teach.mathieu_samedi_le:
    title: Матьё рассказывает прогноз
    gloss: 'Матьё: В субботу солнечно и тепло, а в воскресенье весь день дождь.'
    note: Полностью совпадает с прогнозом из чтения в уроке 5.
  fr.a1.unit47.lesson06.teach.camille_alors_on:
    title: Камиль предлагает план
    gloss: 'Камиль: Тогда погуляем в субботу?'
    note: '*Alors* (тогда) связывает предложение с хорошей погодой, о которой только что сказал Матьё.'
  fr.a1.unit47.lesson06.teach.mathieu_bonne_idee:
    title: Матьё соглашается и планирует воскресенье
    gloss: 'Матьё: Хорошая идея. А в воскресенье спокойно посидим дома.'
    note: '*Tranquillement* здесь значит «спокойно, не спеша» и делает домашний день приятным.'
  fr.a1.unit47.lesson06.teach.camille_parfait_alors:
    title: Камиль договаривается о плане
    gloss: 'Камиль: Отлично, тогда посмотрим фильм.'
    note: '*Regarder* (смотреть) естественно сочетается с *un film* (фильм).'
