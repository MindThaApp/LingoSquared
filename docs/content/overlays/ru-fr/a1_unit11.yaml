teaching:
  fr.a1.unit11.lesson01.teach.libre:
    title: Свободный
    gloss: свободный
    note: Здесь *libre* описывает наличие свободного времени у человека; для того, что ничего не стоит, во французском используется *gratuit*.
    example_gloss: Ты свободен в субботу?
  fr.a1.unit11.lesson01.teach.occupe:
    title: Занятой
    gloss: занятой
    note: 'Прямая противоположность *libre*. Изменяется по роду: *occupé* / *occupée*.'
    example_gloss: Я занят в пятницу вечером.
  fr.a1.unit11.lesson01.teach.se_retrouver:
    title: Встретиться
    gloss: встретиться
    note: 'В этом значении *se retrouver* — взаимный глагол: двое или больше людей встречаются друг с другом. Не путай с *trouver* («находить»).'
    example_gloss: Где мы встречаемся сегодня вечером?
  fr.a1.unit11.lesson01.teach.vers:
    title: Около (о времени)
    gloss: около / к (о времени)
    note: '*Vers* + время обозначает приблизительное время, мягче, чем точный час.'
    example_gloss: Я зайду около семи часов.
  fr.a1.unit11.lesson01.teach.ca_te_dit_de:
    title: Как насчёт...?
    gloss: Как насчёт того, чтобы вместе сходить за продуктами?
    note: '*Ça te dit de... ?* + инфинитив — распространённый разговорный способ предложить занятие, более непринуждённый, чем *Voulez-vous... ?*'
  fr.a1.unit11.lesson01.teach.venir_chercher:
    title: Зайти за кем-то
    gloss: Ты зайдёшь за мной около шести вечера?
    note: '*Venir chercher quelqu''un* значит «зайти за кем-то, заехать за кем-то», а не просто «искать».'
  fr.a1.unit11.lesson01.teach.daccord_a_tout_a_lheure:
    title: Договорились, до скорого
    gloss: Хорошо, до скорого!
    note: '*D''accord* («хорошо, договорились») подтверждает план; *à tout à l''heure* говорят, когда увидятся снова в тот же день.'
  fr.a1.unit11.lesson02.teach.je_ne_peux_pas:
    title: Отказаться от плана
    gloss: Не могу, я занят.
    note: '*Je ne peux pas* («не могу») + причина — простой и вежливый способ отказаться.'
  fr.a1.unit11.lesson02.teach.avec_plaisir:
    title: Согласиться с радостью
    gloss: С удовольствием!
    note: '*Avec plaisir* (буквально «с удовольствием») — тёплый, радостный способ принять приглашение.'
  fr.a1.unit11.lesson02.teach.a_quelle_heure_on_se_voit:
    title: Спросить, который час
    gloss: Во сколько встречаемся?
    note: '*On se voit* (неформально, буквально «мы видимся») — обычная разговорная альтернатива *se retrouver*, когда договариваются о встрече.'
  fr.a1.unit11.lesson02.teach.devant_le_marche:
    title: Предложить место
    gloss: Перед рынком, тебе подходит?
    note: '*Ça te va ?* («тебе подходит?») помогает узнать, устраивает ли собеседника предложенная деталь.'
  fr.a1.unit11.lesson02.teach.parfait_alors:
    title: Подтвердить план
    gloss: Отлично, тогда до пятницы!
    note: '*Alors* здесь значит «тогда» и подтверждает итог, завершая обсуждение плана.'
  fr.a1.unit11.lesson03.teach.line01:
    title: Предложить вместе сходить за продуктами
    gloss: Инес спрашивает Матьё, хочет ли он вместе сходить за продуктами перед мастер-классом.
    note: '*Ça te dit de... ?* начинает разговор непринуждённым предложением.'
  fr.a1.unit11.lesson03.teach.line02:
    title: Согласиться и спросить, где
    gloss: Матьё с удовольствием соглашается и спрашивает, где они встретятся.
    note: Сочетает *Avec plaisir* («с удовольствием») и *se retrouver* («встретиться»).
  fr.a1.unit11.lesson03.teach.line03:
    title: Предложить место и день
    gloss: Инес предлагает встретиться перед рынком в пятницу вечером.
    note: Короткое предложение с местом (*devant le marché*) и днём (*vendredi soir*).
  fr.a1.unit11.lesson03.teach.line04:
    title: Согласиться и спросить время
    gloss: Матьё соглашается и спрашивает, во сколько.
    note: '*D''accord* подтверждает место и день; следующий вопрос уточняет время.'
  fr.a1.unit11.lesson03.teach.line05:
    title: Предложить конкретное время
    gloss: Инес спрашивает, зайдёт ли Матьё за ней около шести вечера.
    note: Здесь *venir chercher* используется вместе с *vers* и конкретным часом.
  fr.a1.unit11.lesson03.teach.line06:
    title: Подтвердить всё
    gloss: 'Матьё говорит: отлично, тогда до пятницы, в шесть вечера перед рынком.'
    note: Повторяются все три детали плана (день, время, место), чтобы чётко завершить разговор.
