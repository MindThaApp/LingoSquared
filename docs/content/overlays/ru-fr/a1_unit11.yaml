answer_policy:
  accent_marks: Display and teach all French accents and the cedilla. In typed A1 answers, accept a variant without accents when every other letter and word is correct.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation or liaison marks.
course:
  title: Французский язык A1
  description: 'Предложить, принять, отклонить и назначить простой план. Продолжение истории о кулинарном мастер-классе: Инес и Матьё договариваются вместе купить продукты до субботнего занятия. Обрати внимание: *se retrouver* («встретиться») — возвратный глагол со взаимным значением, в русском ему соответствует глагол с -ся («встречаться, видеться»), а *vers* + время обозначает приблизительное, а не точное время встречи.'
units:
  fr.a1.unit11.plans:
    title: Когда встречаемся?
lessons:
  fr.a1.unit11.lesson01.vocabulaire_projets:
    title: Предлагаем время
  fr.a1.unit11.lesson02.accepter_refuser:
