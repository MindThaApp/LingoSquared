teaching:
  fr.a1.unit43.lesson01.teach.le_billet:
    title: Билет
    gloss: билет
    note: '*Billet* мужского рода: *le billet*, *un billet*.'
    example_gloss: Я хотел бы билет до Лиона.
  fr.a1.unit43.lesson01.teach.je_voudrais_un:
    title: Просьба о билете
    gloss: Я хотел бы билет до Лиона.
    note: '*Je voudrais* смягчает просьбу; это вежливее, чем *je veux*.'
  fr.a1.unit43.lesson01.teach.voulez_vous_un:
    title: Кассир уточняет, какой нужен билет
    gloss: Вам билет в один конец или туда и обратно?
    note: '*Voulez-vous* — вежливая форма с *vous* от глагола *vouloir*; здесь она используется для незнакомого сотрудника вокзала.'
  fr.a1.unit43.lesson01.teach.un_aller_retour:
    title: Вежливый ответ
    gloss: Туда и обратно, пожалуйста.
    note: '*S''il vous plaît* — вежливое «пожалуйста», соответствующее обращению на *vous*.'
  fr.a1.unit43.lesson01.teach.au_guichet_on:
    title: Форма обращения у кассы
    gloss: В кассе обычно говорят вежливо, на *vous*.
    note: К незнакомым людям, которые вас обслуживают, обращаются на *vous*; к друзьям и родным — на *tu*.
  fr.a1.unit43.lesson02.teach.le_quai:
    title: Платформа
    gloss: платформа
    note: '*Quai* мужского рода: *le quai*.'
    example_gloss: С какой платформы отправляется поезд до Лиона?
  fr.a1.unit43.lesson02.teach.de_quel_quai:
    title: Вопрос о платформе
    gloss: С какой платформы отправляется поезд до Лиона?
    note: '*De quel quai* спрашивает именно о платформе; *quel* согласуется с существительным мужского рода *quai*.'
  fr.a1.unit43.lesson02.teach.le_train_part:
    title: Сообщаем данные об отправлении
    gloss: Поезд отправляется без четверти десять с платформы пять.
    note: '*Dix heures moins le quart* значит «без четверти десять»: для времени до начала часа французы, как и русские с «без», используют вычитание — *moins* («минус»).'
  fr.a1.unit43.lesson02.teach.a_quelle_heure:
    title: Вопрос о времени прибытия
    gloss: Во сколько прибывает поезд?
    note: '*À quelle heure arrive ... ?* спрашивает о времени; *arriver* — правильный глагол на *-er*: *le train arrive*.'
  fr.a1.unit43.lesson02.teach.le_train_arrive:
    title: Сообщаем время прибытия
    gloss: Поезд прибывает в одиннадцать часов.
    note: '*Arrive* — форма *il/elle* глагола *arriver*; у глаголов на *-er* с *il* и *elle* окончание *-e*.'
  fr.a1.unit43.lesson03.teach.a_l_heure:
    title: Вовремя / задержка
    gloss: вовремя; задержка
    note: '*À l''heure* — устойчивое выражение: «вовремя, по расписанию». *Le retard* («опоздание, задержка») мужского рода.'
    example_gloss:
    - Поезд отправляется не вовремя.
    - 'Внимание: поезд до Лиона опаздывает.'
  fr.a1.unit43.lesson03.teach.attention_le_train:
    title: Объявление
    gloss: 'Внимание: поезд до Лиона опаздывает.'
    note: '*Attention* открывает объявление на вокзале, как наше «Внимание, уважаемые пассажиры».'
  fr.a1.unit43.lesson03.teach.le_train_ne:
    title: 'Отрицание: не вовремя'
    gloss: Поезд отправляется не вовремя.
    note: '*Ne ... pas* обрамляет глагол: *ne part pas à l''heure*.'
  fr.a1.unit43.lesson03.teach.le_train_part:
    title: Смена платформы
    gloss: Поезд отправляется с платформы три вместо платформы пять.
    note: '*Au lieu du* значит «вместо»; *de* + *le* сливаются в *du*.'
  fr.a1.unit43.lesson03.teach.le_train_a:
    title: Сообщаем длительность задержки
    gloss: Поезд задерживается на десять минут.
    note: '*A ... de retard* (буквально «имеет ... опоздания») — естественный способ сказать, что что-то опаздывает; здесь используется глагол *avoir*.'
  fr.a1.unit43.lesson04.teach.l_entree_la:
    title: Вход, выход, зал ожидания
    gloss: вход; выход; зал ожидания
    note: '*L''entrée* теряет *e* и принимает форму *l''* перед гласной; *la sortie* и *la salle d''attente* женского рода.'
    example_gloss:
    - Где вход?
    - Где выход?
    - Где зал ожидания?
  fr.a1.unit43.lesson04.teach.ou_est_le:
    title: Вопрос о местонахождении платформы
    gloss: Где платформа семь?
    note: '*Où est ... ?* спрашивает, где что-то находится; *le quai sept* мужского рода.'
  fr.a1.unit43.lesson04.teach.tout_droit_puis:
    title: Объясняем дорогу
    gloss: Прямо, а потом направо.
    note: '*Tout droit* и *à droite* — слова для указания направления; перед *droite* стоит *à*.'
  fr.a1.unit43.lesson04.teach.ou_est_la:
    title: Вопрос о зале ожидания
    gloss: Где зал ожидания?
    note: Та же модель вопроса, но с новым местом.
  fr.a1.unit43.lesson05.teach.billet_paris_gare:
    title: Читаем печатный билет
    gloss: 'Билет: Париж, Лионский вокзал — Лион, Пар-Дьё. Отправление: десять часов десять минут, платформа семь. Прибытие: без десяти одиннадцать. Туда и обратно. Цена: двенадцать евро сорок.'
    note: Найди время и платформу отправления, время прибытия, тип билета и цену.
    glosses:
      Billet: билет
      Départ: отправление
      dix: десять
      quai: платформа
      sept: семь
      Arrivée: прибытие
      onze: одиннадцать
      Aller-retour: билет туда и обратно
      Prix: цена
      douze: двенадцать
      euros: евро
      quarante: сорок
  fr.a1.unit43.lesson06.teach.mathieu_on_doit:
    title: Матьё говорит о плане
    gloss: 'Матьё: Нам нужно на платформу семь. Поезд отправляется в десять десять.'
    note: '*On doit* (от *devoir*) выражает здесь практическую необходимость, а не строгую обязанность.'
  fr.a1.unit43.lesson06.teach.camille_regarde_voila:
    title: Камий читает табло
    gloss: 'Камий: Смотри, вот табло: задержка, десять минут.'
    note: '*Voilà* указывает на то, что находится рядом: *voilà le panneau*.'
  fr.a1.unit43.lesson06.teach.mathieu_pas_de:
    title: Матьё сохраняет спокойствие
    gloss: 'Матьё: Не проблема, у нас ещё есть время выпить кофе.'
    note: '*Pas de problème* — обычная разговорная фраза, чтобы успокоить.'
  fr.a1.unit43.lesson06.teach.camille_bonne_idee:
    title: Поезд прибывает
    gloss: 'Камий: Хорошая идея. О, а вот уже и поезд. Платформа семь, точно!'
    note: '*Déjà* («уже») показывает, что поезд пришёл раньше, чем ожидалось, учитывая только что объявленную задержку.'
  fr.a1.unit43.lesson06.teach.mathieu_allez_on:
    title: Они садятся в поезд
    gloss: 'Матьё: Идём, садимся. Лион, мы едем!'
    note: '*On* — это повседневное *мы*, которое употребляется с глаголом в форме *il*: *on monte*. *On arrive !* — естественный способ сказать «вот и мы приезжаем»; дословный перевод прозвучал бы странно.'
