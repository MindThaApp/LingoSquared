teaching:
  fr.a1.unit44.lesson01.teach.je_ne_me:
    title: Плохое самочувствие
    gloss: Я плохо себя чувствую.
    note: '*Se sentir* — возвратный глагол (*je me sens*); *ne ... pas bien* — общий, мягкий способ сказать, что что-то не так.'
  fr.a1.unit44.lesson01.teach.malade:
    title: Больной
    gloss: больной
    note: 'Основная форма прилагательного, которое употребляется с *être*: *je suis malade*.'
    example_gloss: Я болен.
  fr.a1.unit44.lesson01.teach.je_suis_malade:
    title: Быть больным
    gloss: Я болен.
    note: '*Malade* описывает более общее и более сильное состояние, чем *pas bien*.'
  fr.a1.unit44.lesson01.teach.mal_a_la:
    title: Головная боль
    gloss: головная боль
    note: '*Mal à la tête* употребляется с *avoir*: *j''ai mal à la tête*; *à la*, потому что *tête* женского рода.'
    example_gloss: У меня болит голова.
  fr.a1.unit44.lesson01.teach.j_ai_mal:
    title: У меня болит голова
    gloss: У меня болит голова.
    note: 'Симптомы употребляются с *avoir* («иметь»): *j''ai mal*.'
  fr.a1.unit44.lesson01.teach.mal_au_ventre:
    title: Боль в животе
    gloss: боль в животе
    note: '*Mal au ventre*: *au* — это слитное *à* + *le*, потому что *ventre* мужского рода.'
    example_gloss: У меня болит живот.
  fr.a1.unit44.lesson01.teach.j_ai_mal_2:
    title: У меня болит живот
    gloss: У меня болит живот.
    note: Та же модель с *avoir*, что и в *mal à la tête*, только *au* вместо *à la*.
  fr.a1.unit44.lesson02.teach.qu_est_ce:
    title: Общий вопрос
    gloss: Что случилось?
    note: Универсальный способ спросить, не случилось ли чего.
  fr.a1.unit44.lesson02.teach.qu_est_ce_2:
    title: Распространённое выражение
    gloss: Что с тобой?
    note: '*Qu''est-ce qui ne va pas ?* — устойчивый вопрос, буквально «что не идёт хорошо»; не переводи его слово в слово.'
  fr.a1.unit44.lesson02.teach.mal_a_la:
    title: Боль в горле
    gloss: боль в горле
    note: '*Mal à la gorge* строится как *mal à la tête*: *gorge* женского рода, поэтому *à la*.'
    example_gloss: У меня болит горло.
  fr.a1.unit44.lesson02.teach.j_ai_mal:
    title: У меня болит горло
    gloss: У меня болит горло.
    note: Та же модель с *avoir*, что и у других симптомов.
  fr.a1.unit44.lesson02.teach.ca_va_non:
    title: Спросить, как дела у человека
    gloss: Ты в порядке? Нет, я плохо себя чувствую.
    note: '*Ça va ?* — очень частый неформальный вопрос между друзьями.'
  fr.a1.unit44.lesson03.teach.la_fievre:
    title: Температура
    gloss: температура
    note: '*La fièvre* женского рода; после *avoir* она употребляется с *de la*: *j''ai de la fièvre*.'
    example_gloss: У меня температура.
  fr.a1.unit44.lesson03.teach.j_ai_de:
    title: У меня температура
    gloss: У меня температура.
    note: Та же модель с *avoir*, с частичным артиклем *de la*.
  fr.a1.unit44.lesson03.teach.le_rhume:
    title: Простуда
    gloss: простуженный / быть простуженным
    note: '*Le rhume* — существительное мужского рода, оно употребляется с *avoir*, а не как прилагательное с *être*.'
    example_gloss: У меня простуда.
  fr.a1.unit44.lesson03.teach.j_ai_un:
    title: Сказать, что ты простудился
    gloss: У меня простуда.
    note: По-французски говорят *j'ai un rhume* («у меня простуда»); фразу *je suis rhume* говорить нельзя.
  fr.a1.unit44.lesson03.teach.malade_se_dit:
    title: Être или avoir?
    gloss: '*Malade* — прилагательное, оно употребляется с *être*: я болен. *Mal*, *fièvre* и *rhume* — существительные, они употребляются с *avoir*: у меня простуда.'
    note: 'Выбор между *être* и *avoir* зависит от части речи: прилагательное вроде *malade* идёт с *être*, существительное вроде *fièvre* — с *avoir*, даже если болезнь совсем лёгкая.'
  fr.a1.unit44.lesson04.teach.la_pharmacie:
    title: Аптека
    gloss: аптека
    note: '*Pharmacie* женского рода: *la pharmacie*.'
    example_gloss: Я иду в аптеку.
  fr.a1.unit44.lesson04.teach.je_peux_vous:
    title: Приветствие фармацевта
    gloss: Чем могу вам помочь?
    note: '*Je peux vous aider ?* — стандартное вежливое приветствие в сфере обслуживания; *vous* — вежливая форма.'
  fr.a1.unit44.lesson04.teach.avez_vous_quelque:
    title: Попросить средство от симптома
    gloss: У вас есть что-нибудь от головной боли?
    note: '*Quelque chose contre* + симптом — естественный способ попросить лекарство.'
  fr.a1.unit44.lesson04.teach.un_comprime:
    title: Таблетка
    gloss: таблетка
    note: '*Comprimé* мужского рода: *un comprimé*.'
    example_gloss: Я принимаю таблетку.
  fr.a1.unit44.lesson04.teach.prenez_un_comprime:
    title: Указания по приёму
    gloss: Принимай таблетку два раза в день.
    note: '*Prenez* — повелительное наклонение глагола *prendre* («брать, принимать») в форме *vous*; оно используется в инструкциях.'
  fr.a1.unit44.lesson04.teach.a_la_pharmacie:
    title: Обращение в аптеке
    gloss: 'В аптеке говорят вежливо — на «вы»: *vous*.'
    note: Фармацевт — незнакомый взрослый, работающий в сфере обслуживания, поэтому ему говорят *vous*, как и на вокзальной кассе.
  fr.a1.unit44.lesson05.teach.conseil_prends_un:
    title: Прочитай совет в аптеке
    gloss: 'Совет: принимай по одной таблетке два раза в день, запивая водой. Хорошо отдыхай и пей много воды. Если через три дня всё ещё плохо себя чувствуешь? Тогда иди к врачу.'
    note: Обрати внимание на дозировку, две рекомендации, не связанные с лекарством, и на то, когда нужно идти к врачу.
    glosses:
      Conseil: совет
      prends: принимай
      fois: раза
      jour: день
      comprimé: таблетка
      Repose-toi: отдыхай
      bois: пей
      sens: чувствовать себя
      toujours: всё ещё
      bien: хорошо
      médecin: врач
  fr.a1.unit44.lesson06.teach.camille_salut_mathieu:
    title: Камиль интересуется самочувствием
    gloss: 'Камиль: Привет, Матьё, как дела? Тебе уже лучше?'
    note: '*Déjà* («уже») показывает, что Камиль проверяет, стало ли Матьё лучше с их последнего разговора.'
  fr.a1.unit44.lesson06.teach.mathieu_pas_encore:
    title: Матьё всё ещё плохо
    gloss: 'Матьё: Пока не очень. У меня всё ещё болит голова, и я устал.'
    note: '*Toujours* («всё ещё») показывает, что головная боль не прошла; *fatigué* («усталый») — новое полезное прилагательное.'
  fr.a1.unit44.lesson06.teach.camille_tu_as:
    title: Камиль спрашивает про лекарство
    gloss: 'Камиль: Ты принял таблетку?'
    note: '*Pris* — причастие прошедшего времени глагола *prendre*; оно употребляется с *as* от *avoir*: *tu as pris*.'
  fr.a1.unit44.lesson06.teach.mathieu_oui_j:
    title: Матьё подтверждает
    gloss: 'Матьё: Да, я принял таблетку. Сейчас пойду отдохну.'
    note: '*Je vais me reposer* («собираюсь отдохнуть») образуется с *aller* + инфинитив и выражает ближайшее будущее.'
  fr.a1.unit44.lesson06.teach.camille_bonne_idee:
    title: Камиль желает ему выздоровления
    gloss: 'Камиль: Хорошая мысль. Хорошенько отдохни. Выздоравливай!'
    note: '*Bon rétablissement !* — стандартное устойчивое выражение, которым желают скорого выздоровления.'
  fr.a1.unit44.lesson06.teach.mathieu_merci_a:
    title: Матьё прощается
    gloss: 'Матьё: Спасибо, до завтра!'
    note: '*À demain !* — это прощание: *à* + слово о времени, как в *à demain*, *à bientôt*.'
