course:
  title: Французский язык A1
  description: 'Рассказ о простом распорядке дня с возвратными глаголами (se réveiller, se lever, se coucher) и словами последовательности (d''abord, ensuite). Продолжение истории о кулинарном мастер-классе Инес и Матьё: Инес спрашивает о субботе Матьё. Французским возвратным глаголам нужно возвратное местоимение (je ME réveille); в русском ему обычно соответствует суффикс -ся: просыпаюсь.'
units:
  fr.a1.unit10.routines:
    title: Субботний распорядок
lessons:
  fr.a1.unit10.lesson01.vocabulaire_routine:
    title: Утренние дела
  fr.a1.unit10.lesson02.la_journee_complete:
    title: Весь день
  fr.a1.unit10.lesson03.dialogue_routine_samedi:
    title: Субботний распорядок Матьё
teaching:
  fr.a1.unit10.lesson01.teach.se_reveiller:
    title: Просыпаться
    gloss: просыпаться
    note: 'Возвратный глагол: *je me réveille*, *tu te réveilles*. Местоимение *me/te/se* всегда соответствует подлежащему.'
    example_gloss: Я просыпаюсь в семь часов.
  fr.a1.unit10.lesson01.teach.se_lever:
    title: Вставать
    gloss: вставать
    note: 'Не путай с *se réveiller* (проснуться): *se lever* — это физически встать с кровати.'
    example_gloss: Сразу после этого я встаю.
  fr.a1.unit10.lesson01.teach.prendre_une_douche:
    title: Принимать душ
    gloss: принимать душ
    note: '*Prendre une douche* (буквально «брать душ») строится с глаголом *prendre* — тем же, что используется для еды и транспорта.'
    example_gloss: Утром я принимаю душ.
  fr.a1.unit10.lesson01.teach.shabiller:
    title: Одеваться
    gloss: одеваться
    note: 'Ещё один возвратный глагол: *je m''habille*; перед гласной me сокращается до *m''*.'
    example_gloss: Я одеваюсь перед завтраком.
  fr.a1.unit10.lesson01.teach.le_petit_dejeuner:
    title: Завтрак
    gloss: завтрак
    note: '*Prendre le petit-déjeuner* (завтракать) строится так же, как *prendre une douche*, — с глаголом *prendre*.'
    example_gloss: Я завтракаю в восемь часов.
  fr.a1.unit10.lesson01.teach.quitter_la_maison:
    title: Уходить из дома
    gloss: уходить из дома
    note: '*Quitter* здесь значит «покидать (место)». Не путай с *partir*: после него нет прямого дополнения.'
    example_gloss: Я ухожу из дома в девять часов.
  fr.a1.unit10.lesson01.teach.dabord_ensuite:
    title: Сначала… потом…
    gloss: Сначала я встаю, потом одеваюсь.
    note: '*D''abord* (сначала) и *ensuite* (потом) — основные слова последовательности, чтобы описывать распорядок дня шаг за шагом.'
  fr.a1.unit10.lesson02.teach.rentrer:
    title: Возвращаться домой
    gloss: возвращаться домой
    note: '*Rentrer* означает вернуться в свой дом, в отличие от более общего *retourner* (вернуться куда-либо).'
    example_gloss: Я возвращаюсь домой после работы.
  fr.a1.unit10.lesson02.teach.diner:
    title: Ужинать
    gloss: ужинать
    note: '*Dîner* может быть глаголом (ужинать) или существительным (*le dîner*, ужин); различить их помогает контекст.'
    example_gloss: По субботним вечерам мы ужинаем вместе.
  fr.a1.unit10.lesson02.teach.se_coucher:
    title: Ложиться спать
    gloss: ложиться спать
    note: Естественное завершение распорядка дня; парный глагол к *se lever* в его начале.
    example_gloss: Я ложусь спать около одиннадцати часов.
  fr.a1.unit10.lesson02.teach.le_weekend:
    title: Выходные
    gloss: выходные
    note: '*Le week-end* — заимствованное слово, как и русское «уик-энд»; во французском оно пишется через дефис.'
    example_gloss: Мастер-класс проходит в выходные.
  fr.a1.unit10.lesson02.teach.dhabitude:
    title: Обычно
    gloss: обычно
    note: '*D''habitude* вводит привычное, регулярное действие, в отличие от *aujourd''hui* (сегодня) для разового события.'
    example_gloss: Обычно я встаю в семь часов.
  fr.a1.unit10.lesson02.teach.ma_routine_du_samedi:
    title: Рассказ о субботе
    gloss: По субботам я встаю поздно, потом иду на рынок перед мастер-классом.
    note: Здесь последовательность, как с *d'abord/ensuite*, передаётся словом *puis* («потом») при описании субботы.
  fr.a1.unit10.lesson02.teach.quest_ce_que_tu_fais:
    title: Что ты делаешь?
    gloss: Что ты делаешь по субботам?
    note: '*Qu''est-ce que tu fais... ?* — стандартный разговорный способ спросить, чем человек занимается.'
  fr.a1.unit10.lesson03.teach.line01:
    title: Вопрос о субботе
    gloss: Инес спрашивает Матьё, что он делает по субботам перед мастер-классом.
    note: '*Tu fais quoi... ?* — естественный разговорный вопрос «что ты делаешь...?», более непринуждённый, чем *Qu''est-ce que tu fais ?*'
  fr.a1.unit10.lesson03.teach.line02:
    title: Рассказ о пробуждении
    gloss: Матьё говорит, что сначала он поздно просыпается, около девяти часов.
    note: '*Vers neuf heures* (около девяти часов): *vers* + время передаёт приблизительное время.'
  fr.a1.unit10.lesson03.teach.line03:
    title: Вопрос «что дальше?»
    gloss: Инес спрашивает, что происходит потом.
    note: Короткий естественный вопрос, чтобы собеседник продолжил рассказ о своём дне.
  fr.a1.unit10.lesson03.teach.line04:
    title: Завтрак и рынок
    gloss: Матьё говорит, что потом он завтракает и идёт на рынок.
    note: Два связанных действия соединены союзом *et*; это продолжение последовательности, начатой с *d'abord*.
  fr.a1.unit10.lesson03.teach.line05:
    title: Вопрос о возвращении домой
    gloss: Инес спрашивает, во сколько Матьё возвращается домой.
    note: В вопросе *Tu rentres à quelle heure ?* снова используется глагол *rentrer* из этого урока.
  fr.a1.unit10.lesson03.teach.line06:
    title: Рассказ о второй половине дня
    gloss: Матьё говорит, что возвращается около полудня, а днём отдыхает перед вечерним мастер-классом.
    note: '*Se reposer* (отдыхать) — ещё один возвратный глагол: *je me repose*.'
