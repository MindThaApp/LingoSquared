  fr.a1.unit54.lesson06.l_oiseau_de_nina:
    title: Птица Нины
teaching:
  fr.a1.unit54.lesson01.teach.l_animal_un:
    title: Животное, питомец
    gloss: животное / домашнее животное
    note: '*Un animal* — общее слово; *un animal de compagnie* (буквально «животное для компании») означает именно домашнего питомца.'
    example_gloss:
    - Собака — это животное.
    - Собака — ещё и домашний питомец.
  fr.a1.unit54.lesson01.teach.le_chien_le:
    title: Собака и кот
    gloss: собака / кот
    example_gloss:
    - У Камиль есть собака.
    - У Томá есть кошка.
  fr.a1.unit54.lesson01.teach.le_poisson_l:
    title: Рыба и птица
    gloss: рыба / птица
    example_gloss:
    - У дедушки есть рыба.
    - У Нины есть птица.
  fr.a1.unit54.lesson01.teach.tu_as_un:
    title: У тебя есть питомец?
    gloss: У тебя есть питомец?
    note: Тот же вопрос *Tu as ... ?*, который ты уже знаешь по прошлым урокам.
  fr.a1.unit54.lesson01.teach.oui_j_ai:
    title: Да, у меня есть собака
    gloss: Да, у меня есть собака.
    note: Простой утвердительный ответ с новой лексикой этого раздела.
  fr.a1.unit54.lesson01.teach.non_je_n:
    title: Нет, у меня нет питомца
    gloss: Нет, у меня нет питомца.
    note: 'После отрицания вместо *un* ставится *pas d''*: *Je n''ai pas d''animal de compagnie.* Смотри заметку по грамматике.'
  fr.a1.unit54.lesson01.teach.apres_ne_pas:
    title: 'Pas de: отрицание с un/une/des'
    gloss: 'После *ne ... pas* артикли *un*, *une* и *des* превращаются в *de* или *d''*, как в *Je n''ai pas de temps* (ты это уже знаешь) и здесь: *Je n''ai pas d''animal de compagnie*.'
    note: 'Это та же конструкция, что и в *Je n''ai pas de temps*: грамматика не новая, просто новое существительное.'
  fr.a1.unit54.lesson02.teach.promener:
    title: Выгуливать (животное)
    gloss: выгуливать (животное)
    note: '*Promener* (выгуливать) — правильный глагол на *-er*; смотри заметку по грамматике.'
    example_gloss: Я выгуливаю собаку каждый день.
  fr.a1.unit54.lesson02.teach.promener_est_un:
    title: Promener — правильный глагол на -er
    gloss: '*Promener* — правильный глагол на *-er*, как *cuisiner*: *je promène, tu promènes, il promène le chien*. Значок над буквой *e* показывает, что она произносится.'
    note: Глагол всегда остаётся целым, как и другие глаголы на *-er*, которые ты уже знаешь.
  fr.a1.unit54.lesson02.teach.donner_a_manger:
    title: Кормить
    gloss: кормить
    example_gloss: Я кормлю кошку каждый день.
  fr.a1.unit54.lesson02.teach.jouer_avec:
    title: Играть с
    gloss: играть с
    example_gloss: Тома играет со своим котом.
  fr.a1.unit54.lesson02.teach.je_promene_le:
    title: Я выгуливаю собаку каждый день
    gloss: Я выгуливаю собаку каждый день.
    note: Соединяет *promener* с *tous les jours* (каждый день), которое ты уже знаешь по прошлому уроку.
  fr.a1.unit54.lesson02.teach.je_donne_a:
    title: Я кормлю кота каждый день
    gloss: Я кормлю кота каждый день.
    note: Соединяет *donner à manger* (буквально «давать есть», то есть кормить) с *tous les jours*.
  fr.a1.unit54.lesson03.teach.au_pluriel_on:
    title: 'Множественное число: chien -> chiens'
    gloss: 'Во множественном числе обычно добавляется *s*, которое не слышно: *chien -> chiens*, *chat -> chats*. Слова на *-al* меняются на *-aux*: *animal -> animaux*.'
    note: Обычное правило образования множественного числа во французском; здесь оно впервые показано на названиях животных.
  fr.a1.unit54.lesson03.teach.chiens_chats:
    title: Собаки и кошки
    gloss: собаки / коты
    example_gloss:
    - Матьё обожает собак.
    - Леа обожает кошек.
  fr.a1.unit54.lesson03.teach.poissons_oiseaux:
    title: Рыбы и птицы
    gloss: рыбы / птицы
    example_gloss:
    - Я обожаю рыбок.
    - Дедушка обожает птиц.
  fr.a1.unit54.lesson03.teach.j_adore_les:
    title: Я обожаю животных
    gloss: Я обожаю животных.
    note: 'После *adorer* (обожать) сразу идёт существительное, а общая любовь выражается с *les*: *J''adore les animaux.*'
  fr.a1.unit54.lesson03.teach.lea_adore_les:
    title: Леа обожает кошек, но у неё нет питомца
    gloss: Леа обожает кошек, но у неё нет питомца.
    note: 'Готовит противопоставление, на котором построен текст для чтения: любить животных и иметь питомца.'
  fr.a1.unit54.lesson04.teach.mathieu_tu_as:
    title: Матьё спрашивает о питомце
    gloss: 'Матьё: У тебя есть питомец, Камиль?'
  fr.a1.unit54.lesson04.teach.camille_oui_j:
    title: У Камиль есть собака
    gloss: 'Камиль: Да, у меня есть собака.'
  fr.a1.unit54.lesson04.teach.mathieu_comment_est:
    title: Матьё спрашивает, какой он
    gloss: 'Матьё: Какой он?'
    note: Снова *Comment est-il ?* из урока о внешности, теперь о животном.
  fr.a1.unit54.lesson04.teach.camille_il_a:
    title: Камиль описывает свою собаку
    gloss: 'Камиль: У него коричневая шерсть, и он маленький.'
    note: Слова о цвете волос и размере из раздела о внешности, но теперь они описывают шерсть животного, а не волосы человека.
  fr.a1.unit54.lesson04.teach.il_et_le:
    title: Il/le для животных
    gloss: '*Il* (он) и *le* (его) употребляются и для животного мужского пола, а не только для человека.'
    note: Раньше *il* и *le* в курсе относились к людям; здесь прямо показано, что их можно использовать и для животных.
  fr.a1.unit54.lesson04.teach.mathieu_tu_le:
    title: Матьё спрашивает о прогулках
    gloss: 'Матьё: Ты гуляешь с ним каждый день?'
  fr.a1.unit54.lesson04.teach.camille_oui_je:
    title: Камиль рассказывает о своём распорядке
    gloss: 'Камиль: Да, я гуляю с ним каждый день и кормлю его.'
  fr.a1.unit54.lesson05.teach.mathieu_et_lea:
    title: Матьё, Леа и Тома о животных
    gloss: 'Матьё и Леа оба обожают животных, но ни у одного из них нет питомца. Матьё обожает собак, а Леа — кошек. А вот у Тома питомец есть: кот. Он часто играет со своим котом и каждый день его кормит. А у тебя есть питомец?'
    note: Противопоставляет любовь к животным и наличие собственного питомца — в этом коммуникативный смысл всего раздела.
    glosses:
      adorent: обожать
      tous: оба
      animaux: животные
      deux: оба
      compagnie: питомец
      chiens: собаки
      chats: коты
      chat: кот
      joue: играет
      donne: даёт
      chaque: каждый
      manger: еда
  fr.a1.unit54.lesson05.teach.thomas_joue_souvent:
    title: Тома часто играет со своим котом
    gloss: Тома часто играет со своим котом.
    note: '*Souvent* (часто) стоит сразу после глагола, как и в прежних рассказах о распорядке дня.'
  fr.a1.unit54.lesson05.teach.j_adore_les:
    title: Я обожаю собак. У меня нет питомца.
    gloss: Я обожаю собак. У меня нет питомца.
    note: Образец ответа из двух предложений, который можно использовать в письменном задании раздела.
  fr.a1.unit54.lesson06.teach.camille_nina_tu:
    title: Камиль спрашивает Нину
    gloss: 'Камиль: Нина, у тебя тоже есть питомец?'
  fr.a1.unit54.lesson06.teach.nina_oui_j:
    title: У Nina есть птица по имени Pico
    gloss: 'Nina: Да, у меня есть птица. Её зовут Pico.'
    note: '*Il s''appelle* (его зовут) — тот же глагол для знакомства, что и в самом первом уроке.'
  fr.a1.unit54.lesson06.teach.mathieu_comme_c:
    title: Матьё реагирует
    gloss: 'Матьё: Как здорово! Что ты делаешь с ним каждый день?'
  fr.a1.unit54.lesson06.teach.nina_je_lui:
    title: Nina кормит птицу каждый день
    gloss: 'Nina: Я кормлю его каждый день.'
  fr.a1.unit54.lesson06.teach.mathieu_j_adore:
    title: Матьё тоже любит птиц
    gloss: 'Матьё: Я тоже обожаю птиц.'
  fr.a1.unit54.lesson06.teach.camille_c_est:
    title: Камиль завершает разговор
    gloss: 'Камиль: Здорово, что мы все трое любим животных!'
    note: Подводит итог всем фактам о животных, которые рассказали три героя раздела.
