teaching:
  fr.a1.unit50.lesson01.teach.appeler:
    title: Звонить
    gloss: звонить
    note: Инфинитив глагола, которым обозначают звонок по телефону.
    example_gloss: Мне нужно тебе позвонить.
  fr.a1.unit50.lesson01.teach.je_t_appelle:
    title: Говорим, что позвоним
    gloss: Я тебе позвоню.
    note: '*Appelle* — форма *je* глагола *appeler*; здесь во французском используется настоящее время, хотя по-русски мы скажем «позвоню».'
  fr.a1.unit50.lesson01.teach.allo_c_est:
    title: Отвечаем на звонок
    gloss: Алло, это Камилла.
    note: '*C''est* + имя — стандартный французский способ представиться по телефону; по-русски мы говорим «это ...».'
  fr.a1.unit50.lesson01.teach.allo_c_est_2:
    title: Матьё отвечает так же
    gloss: Алло, это Матьё.
    note: Та же модель *c'est* + имя, что и в *Allô, c'est Camille*.
  fr.a1.unit50.lesson02.teach.qui_est_a:
    title: Спрашиваем, кто звонит
    gloss: С кем я разговариваю?
    note: '*Qui est à l''appareil ?* — стандартный вопрос, которым спрашивают незнакомого абонента, кто он.'
  fr.a1.unit50.lesson02.teach.vous_parlez_avec:
    title: Представляемся официально
    gloss: Вы говорите с Камиллой.
    note: '*Vous parlez avec* + имя — вежливый аналог *c''est* + имя.'
  fr.a1.unit50.lesson03.teach.tu_peux_repeter:
    title: Просим повторить
    gloss: Ты можешь повторить?
    note: '*Tu peux ...* (ты можешь ...?) + инфинитив *répéter* (повторить).'
  fr.a1.unit50.lesson03.teach.ne_parle_pas:
    title: Просим говорить помедленнее
    gloss: Не говори так быстро, пожалуйста.
    note: '*Ne parle pas si vite* — отрицание глагола: *ne ... pas* обрамляет *parle*, а *si* значит «так».'
  fr.a1.unit50.lesson03.teach.je_ne_t:
    title: Говорим, что плохо слышно
    gloss: Я тебя плохо слышу.
    note: '*Entendre* (слышать) с *ne ... pas bien* сообщает о плохой слышимости; это не то же, что *comprendre* (понимать).'
  fr.a1.unit50.lesson04.teach.le_sms:
    title: Сообщение
    gloss: сообщение
    note: '*SMS* — мужского рода: *un SMS*; это слово пришло из международной аббревиатуры.'
    example_gloss: SMS от Камиллы.
  fr.a1.unit50.lesson04.teach.je_t_envoie:
    title: Как сказать, что отправишь сообщение
    gloss: Я пришлю тебе сообщение.
    note: У глагола *envoyer* (отправлять) местоимение *te* (здесь *t'*) стоит перед глаголом, а затем идёт *un SMS*.
  fr.a1.unit50.lesson04.teach.je_te_rappelle:
    title: Как сказать, что перезвонишь
    gloss: Я позвоню тебе позже.
    note: '*Rappeler* (перезвонить) уже содержит идею «обратно» в приставке *re-*; *plus tard* значит «позже».'
  fr.a1.unit50.lesson05.teach.mathieu_salut_camille:
    title: Прочитай переписку
    gloss: 'Матьё: Привет, Камилла, можешь мне позвонить? Мне нужно тебе кое-что сказать. Камилла: Да, конечно, я перезвоню тебе через пять минут.'
    note: Обрати внимание, о чём просит Матьё, зачем и когда Камилла обещает перезвонить.
    glosses:
      Salut: привет
      peux: мочь
      m'appeler: звонить
      dois: надо / должен
      truc: что-то
      dire: рассказать
      évidemment: конечно
      rappelle: обратно
      cinq: пять
      minutes: минуты
  fr.a1.unit50.lesson06.teach.mathieu_allo_c:
    title: Матьё отвечает на звонок
    gloss: 'Матьё: Алло, это Матьё.'
    note: 'Та же модель *c''est* + имя из первого урока, теперь в настоящем телефонном разговоре: тот, кто снимает трубку, говорит первым и называет своё имя.'
  fr.a1.unit50.lesson06.teach.camille_salut_mathieu:
    title: Камилла представляется
    gloss: 'Камилла: Привет, Матьё, это Камилла. Матьё: Как здорово, что ты звонишь!'
    note: '*C''est sympa que* ... (как здорово, что ...) выражает положительную реакцию на событие; *appelles* — особая форма, которую здесь можно просто запомнить.'
  fr.a1.unit50.lesson06.teach.camille_comment_s:
    title: Камилла спрашивает о смене
    gloss: 'Камилла: Как прошла твоя первая смена?'
    note: '*Comment s''est passé ... ?* — это passé composé глагола *se passer* (проходить, происходить), образованное с *être*; так спрашивают, как что-то прошло.'
  fr.a1.unit50.lesson06.teach.mathieu_ca_s:
    title: Матьё рассказывает хорошую новость
    gloss: 'Матьё: Всё прошло очень хорошо, лучше, чем я думал.'
    note: '*Ça s''est très bien passé* и *je pensais* здесь — устойчивые выражения; *je pensais* — imparfait глагола *penser* (думать).'
  fr.a1.unit50.lesson06.teach.au_passe_compose:
    title: Passé composé с avoir и être
    gloss: s'est passé → происходить, проходить; j'ai pensé → думать; je suis allé → идти, ехать
    note: 'Passé composé образуется с помощью *avoir* или *être* + причастие: *j''ai pensé*, *je suis allé*. *Ça s''est passé* — устойчивое выражение со значением «это прошло»; пока просто запомни его в тех контекстах, где оно встречается в этом уроке.'
  fr.a1.unit50.lesson06.teach.camille_ca_fait:
    title: Камилла гордится
    gloss: 'Камилла: Как приятно это слышать! Я горжусь тобой.'
    note: '*Fière de* (гордая за кого-то) — устойчивое сочетание; нужен предлог *de*, а не *pour*; *fière* здесь в женском роде.'
  fr.a1.unit50.lesson06.teach.mathieu_merci_beaucoup:
    title: Матьё тронут
    gloss: 'Матьё: Большое спасибо, это очень много для меня значит.'
    note: '*Compter* здесь значит «иметь значение»: *ça compte pour moi* (это важно для меня); *pour moi* показывает, для кого это важно.'
  fr.a1.unit50.lesson06.teach.son_premier_service:
    title: Его
    gloss: Его первая смена прошла очень хорошо.
    note: '*Son* здесь — притяжательное слово «его», а не глагол: *son premier service* (его первая смена); *son* стоит в мужском роде, потому что *service* мужского рода.'
