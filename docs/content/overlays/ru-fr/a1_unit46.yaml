teaching:
  fr.a1.unit46.lesson01.teach.l_appartement_le:
    title: Квартира, гостиная, спальня
    gloss: квартира, гостиная, спальня
    note: '*L''appartement* — мужского рода, и перед ним артикль *le* теряет гласную: *l''*. *Le salon* — мужского рода, а *la chambre* — женского.'
    example_gloss:
    - У меня есть квартира.
    - У меня есть гостиная.
    - У меня есть спальня.
  fr.a1.unit46.lesson01.teach.la_cuisine_la:
    title: Кухня, ванная
    gloss: кухня, ванная
    note: '*La cuisine* и *la salle de bains* — оба слова женского рода.'
    example_gloss:
    - У меня есть кухня.
    - У меня есть ванная.
  fr.a1.unit46.lesson01.teach.j_ai_un:
    title: Говорим, что у нас есть квартира
    gloss: У меня есть квартира.
    note: 'Глагол *avoir* («иметь») — естественный выбор, когда говорят, какое у тебя жильё. По-русски мы обычно говорим «у меня есть», а по-французски глагол стоит при подлежащем: j''ai. Это общий пример; квартира самого Матьё (в Лионе) появится дальше в этом уроке.'
  fr.a1.unit46.lesson01.teach.j_ai_un_2:
    title: Перечисляем все комнаты
    gloss: У меня есть гостиная, спальня, кухня и ванная.
    note: 'В одном предложении перечислены все четыре комнаты из лексики этого урока: через запятую, а перед последней стоит *et*.'
  fr.a1.unit46.lesson02.teach.tu_as_combien:
    title: Спрашиваем, сколько комнат
    gloss: Сколько у тебя комнат?
    note: 'После *combien de* («сколько») существительное стоит во множественном числе: *combien de pièces*.'
  fr.a1.unit46.lesson02.teach.j_ai_deux:
    title: Называем количество комнат
    gloss: У меня две спальни.
    note: '*Chambres* — множественное число от *chambre*; оно образуется по правилу, с непроизносимым *-s* на конце.'
  fr.a1.unit46.lesson02.teach.l_appartement_a:
    title: Называем общее число комнат
    gloss: В квартире три комнаты.
    note: '*Pièces* — общее слово для комнат, оно не ограничивается спальнями.'
  fr.a1.unit46.lesson03.teach.le_balcon_le:
    title: Балкон, сад
    gloss: балкон, сад
    note: '*Le balcon* и *le jardin* — оба слова мужского рода.'
    example_gloss:
    - Есть балкон.
    - Сада нет.
  fr.a1.unit46.lesson03.teach.il_y_a:
    title: Говорим, что что-то есть
    gloss: Есть балкон.
    note: '*Il y a* — стандартная конструкция со значением «есть, имеется». В отличие от русского, где «есть» часто опускается, во французском она нужна всегда.'
  fr.a1.unit46.lesson03.teach.il_n_y:
    title: Говорим, что чего-то нет
    gloss: Сада нет.
    note: '*Pas de* используется при отрицании с неопределённым существительным: *pas de jardin*, а не *pas un jardin*.'
  fr.a1.unit46.lesson04.teach.cosy:
    title: Уютный
    gloss: уютный
    note: Очень частое французское прилагательное для тёплой, приятной атмосферы. Оно неизменяемое и не имеет точного одного соответствия в русском.
    example_gloss: Квартира маленькая, но уютная.
  fr.a1.unit46.lesson04.teach.l_appartement_est:
    title: Типичная модель описания
    gloss: Квартира маленькая, но уютная.
    note: '*Petit mais cosy* — очень естественный способ для французов с симпатией описать небольшое жильё.'
  fr.a1.unit46.lesson04.teach.le_salon_est:
    title: Описываем размер комнаты
    gloss: Гостиная большая.
    note: '*Grand* описывает одну конкретную комнату, а не всё жильё; оно согласуется с *le salon* — это слово мужского рода.'
  fr.a1.unit46.lesson04.teach.la_cuisine_est:
    title: Описываем размер другой комнаты
    gloss: Кухня маленькая.
    note: 'Та же модель, что с *grand* на предыдущей карточке, но с другой комнатой: *la cuisine* — женского рода, поэтому *petite*.'
  fr.a1.unit46.lesson05.teach.appartement_a_lyon:
    title: Читаем объявление о жилье
    gloss: 'Квартира в Лионе: одна спальня, гостиная, кухня и ванная. Есть балкон, но нет сада. Квартира маленькая, но уютная.'
    note: Обрати внимание на количество комнат, на то, что есть и чего нет, и на общее впечатление.
    glosses:
      Appartement: квартира
      chambre: спальня
      salon: гостиная
      cuisine: кухня
      bains: ванная
      balcon: балкон
      jardin: сад
      petit: маленький
      cosy: уютный
  fr.a1.unit46.lesson06.teach.camille_salut_mathieu:
    title: Камий спрашивает о квартире
    gloss: 'Камий: Привет, Матьё, как твоя новая квартира в Лионе?'
    note: '*Nouvel* — форма слова *nouveau* («новый») перед существительным мужского рода, которое начинается с гласной: *un nouvel appartement*.'
  fr.a1.unit46.lesson06.teach.mathieu_il_est:
    title: Матьё описывает квартиру
    gloss: 'Матьё: Она маленькая, но уютная. У меня одна спальня, гостиная, кухня и ванная.'
    note: Полностью совпадает с объявлением из урока 5 — это и есть квартира Матьё.
  fr.a1.unit46.lesson06.teach.camille_tu_as:
    title: Камий спрашивает о балконе
    gloss: 'Камий: У тебя есть балкон?'
    note: Прямой вопрос с ответом «да» или «нет» с помощью *Tu as ... ?*
  fr.a1.unit46.lesson06.teach.mathieu_oui_j:
    title: Матьё отвечает
    gloss: 'Матьё: Да, у меня есть балкон, но нет сада.'
    note: 'Совпадает с фактом из объявления урока 5: балкон есть, сада нет.'
  fr.a1.unit46.lesson06.teach.balcon_est_masculin:
    title: Род слова balcon
    gloss: '*Balcon* — мужского рода: un balcon, il est petit («он маленький»).'
    note: '*Il* («он») заменяет существительное мужского рода, например *balcon*, поэтому и прилагательное стоит в мужском роде: *il est petit*.'
  fr.a1.unit46.lesson06.teach.camille_ca_a:
    title: Камий тепло реагирует
    gloss: 'Камий: Звучит здорово! Скоро загляну к тебе.'
    note: В *Je passerai te voir* («загляну к тебе») используется будущее время *passerai* и *te voir* — «увидеть тебя».
  fr.a1.unit46.lesson06.teach.mathieu_super_tu:
    title: Матьё приглашает её
    gloss: 'Матьё: Отлично, тебе всегда рады.'
    note: '*Toujours la bienvenue* («тебе всегда рады») — тёплое приглашение прийти снова; *bienvenue* здесь женского рода, потому что относится к Камий.'
