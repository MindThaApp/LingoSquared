  fr.a1.unit52.lesson04.camille_et_mathieu_parlent:
    title: Камиль и Матьё говорят о хобби
  fr.a1.unit52.lesson05.mathieu_et_camille_comparent:
    title: Матьё и Камилла сравнивают свои увлечения
  fr.a1.unit52.lesson06.planifier_un_week_end:
    title: Планируем выходные вместе
teaching:
  fr.a1.unit52.lesson01.teach.lire_faire_du:
    title: Чтение, спорт, готовка
    gloss: читать, заниматься спортом, готовить
    note: 'Три распространённых глагола для увлечений: *lire* (читать), *faire du sport* (заниматься спортом) и *cuisiner* (готовить).'
    example_gloss:
    - Мне нравится читать книгу.
    - По субботам я занимаюсь спортом.
    - Мне нравится готовить для друзей.
  fr.a1.unit52.lesson01.teach.le_temps_libre:
    title: Свободное время
    gloss: свободное время
    note: '*Temps libre* — мужского рода: *le temps libre*. Это ключевое выражение, когда говорят об увлечениях.'
    example_gloss: В свободное время я люблю читать.
  fr.a1.unit52.lesson01.teach.pendant_mon_temps:
    title: Как сказать, чем занимаешься в свободное время
    gloss: В свободное время я люблю читать.
    note: '*Lis* — форма *je* глагола *lire* (читать); конечная *s* не произносится.'
  fr.a1.unit52.lesson02.teach.ecouter_de_la:
    title: Музыка, рисование, видеоигры
    gloss: слушать музыку, рисовать, играть в видеоигры
    note: 'Ещё три увлечения: *écouter de la musique*, *dessiner* и *jouer aux jeux vidéo*. Со словом «игры» *jouer à* + *les* превращается в *jouer aux*.'
    example_gloss:
    - Я люблю слушать музыку.
    - Я часто рисую.
    - Я люблю играть в видеоигры с друзьями.
  fr.a1.unit52.lesson02.teach.j_aime_ecouter:
    title: Говорим, что любим слушать музыку
    gloss: Я люблю слушать музыку.
    note: 'После *écouter* дополнение идёт без предлога: *écouter de la musique*.'
  fr.a1.unit52.lesson02.teach.j_aime_jouer:
    title: Говорим, что любим играть в видеоигры с друзьями
    gloss: Я люблю играть в видеоигры с друзьями.
    note: '*Avec des amis* (с друзьями) снова использует слово *amis* из первого урока; *des* — артикль множественного числа, «какие-то».'
  fr.a1.unit52.lesson03.teach.toujours_souvent_parfois:
    title: Всегда, часто, иногда, никогда
    gloss: всегда, часто, иногда, никогда
    note: Четыре основных наречия частоты. *Souvent* тебе, возможно, уже знакомо; *toujours*, *parfois* и *jamais* — новые. Перед глаголом при *jamais* нужно *ne*.
    example_gloss:
    - Я всегда занимаюсь спортом по субботам.
    - Я часто читаю книгу.
    - Иногда я рисую.
    - Я никогда не играю в видеоигры.
  fr.a1.unit52.lesson03.teach.chaque_semaine_chaque:
    title: Каждую неделю, каждые выходные
    gloss: каждую неделю, каждые выходные
    note: '*Chaque semaine* и *chaque week-end* означают «каждую неделю» и «каждые выходные». *Chaque* не изменяется, какого бы рода ни было существительное.'
    example_gloss:
    - Я каждую неделю готовлю для друзей.
    - Я занимаюсь спортом каждые выходные.
  fr.a1.unit52.lesson03.teach.chaque_ne_change:
    title: Chaque не изменяется
    gloss: '*Chaque* остаётся одинаковым перед существительными мужского и женского рода: *chaque semaine*, *chaque week-end*.'
    note: '*Semaine* — женского рода, а *week-end* — мужского, но *chaque* одинаково для обоих. Сравни с *tous les* / *toutes les*: эти слова как раз изменяются.'
  fr.a1.unit52.lesson03.teach.qu_est_ce:
    title: Спрашиваем о свободном времени
    gloss: Чем ты занимаешься в свободное время?
    note: Это главный вопрос этого раздела — с ним можно спросить любого человека о его увлечениях.
  fr.a1.unit52.lesson04.teach.camille_on_se:
    title: Камилла заговаривает об увлечениях
    gloss: 'Камилла: Мы часто гуляем вместе. А чем ты ещё занимаешься в свободное время, Матьё?'
    note: В *On se promène souvent* местоимение *on* означает «мы», а *souvent* стоит сразу после глагола.
  fr.a1.unit52.lesson04.teach.mathieu_j_aime:
    title: Увлечения Матьё
    gloss: 'Матьё: Я люблю готовить, даже дома. И я часто занимаюсь спортом.'
    note: '*Même à la maison* (даже дома) показывает, что Матьё готовит для удовольствия, а не только на работе.'
  fr.a1.unit52.lesson04.teach.camille_tu_cuisines:
    title: Камилла удивлена
    gloss: 'Камилла: Ты и дома готовишь? Ты же и так весь день готовишь на работе!'
    note: '*Toute la journée* (весь день) подчёркивает, как много Матьё и так готовит на работе.'
  fr.a1.unit52.lesson04.teach.mathieu_oui_mais:
    title: Матьё объясняет
    gloss: 'Матьё: Да, но готовить, по-моему, расслабляет. А ты, что ты любишь делать?'
    note: 'В *Cuisiner, je trouve ça relaxant* слово *cuisiner* вынесено вперёд для выделения: буквально «готовить — я нахожу это расслабляющим».'
  fr.a1.unit52.lesson04.teach.camille_j_aime:
    title: Увлечения Камиллы
    gloss: 'Камилла: Я люблю читать и часто слушаю музыку.'
    note: Два увлечения из первых двух уроков соединены в одном предложении с помощью *et* (и).
  fr.a1.unit52.lesson04.teach.mathieu_tu_joues:
    title: Матьё спрашивает про видеоигры
    gloss: 'Матьё: Ты тоже играешь в видеоигры?'
    note: 'Короткий вопрос с ответом «да» или «нет»: *Tu joues aussi aux jeux vidéo ?* Вопросом его делает повышающаяся интонация.'
  fr.a1.unit52.lesson04.teach.camille_non_je:
    title: Ответ Камиллы
    gloss: 'Камилла: Нет, я никогда не играю в видеоигры. Но иногда рисую!'
    note: '*Jamais* (никогда) и *parfois* (иногда) из третьего урока, противопоставленные в одном ответе.'
  fr.a1.unit52.lesson05.teach.mathieu_et_moi:
    title: Сравниваем увлечения
    gloss: Матьё и я часто гуляем вместе. Но у нас есть и другие увлечения. Матьё любит готовить, даже дома, и часто занимается спортом. Я люблю читать и часто слушаю музыку. Иногда я рисую, но никогда не играю в видеоигры. А что ты любишь делать в свободное время?
    note: Сообщение Камиллы повторяет факты из предыдущих уроков и заканчивается главным вопросом раздела.
    glosses:
      promène: гуляем
      souvent: часто
      ensemble: вместе
      d'autres: другие
      cuisiner: готовит
      aime: нравится
      maison: дома
      sport: занимается спортом
      lire: читать
      j'écoute: слушаю
      musique: музыка
      dessine: рисую
      parfois: иногда
      jeux: играть в видеоигры
      jamais: никогда
      libre: свободное
      temps: время
  fr.a1.unit52.lesson06.teach.mathieu_qu_est:
    title: Матьё спрашивает о выходных
    gloss: 'Матьё: Что ты делаешь в эти выходные?'
    note: В *Ce week-end* (в эти выходные) стоит *ce*, потому что *week-end* — мужского рода.
  fr.a1.unit52.lesson06.teach.camille_je_ne:
    title: Камилла не определилась
    gloss: 'Камилла: Я пока не знаю. Я люблю читать, но ещё хочу куда-нибудь выйти.'
    note: '*Sortir* (выходить, выбираться куда-то) — распространённый способ сказать, что хочется выйти из дома.'
  fr.a1.unit52.lesson06.teach.mathieu_on_se:
    title: Матьё предлагает план
    gloss: 'Матьё: Погуляем вместе? Потом я приготовлю для нас.'
    note: '*Après* (потом) выстраивает два плана по порядку, как *d''abord* и *ensuite*.'
  fr.a1.unit52.lesson06.teach.camille_bonne_idee:
    title: Камилла соглашается
    gloss: 'Камилла: Хорошая идея! Я одинаково люблю и гулять, и готовить.'
    note: '*Autant ... que* (так же ... как) показывает, что Камилла любит две вещи одинаково, не отдавая предпочтения одной.'
  fr.a1.unit52.lesson06.teach.mathieu_parfait_alors:
    title: Матьё подтверждает
    gloss: 'Матьё: Отлично. Тогда увидимся в субботу!'
    note: Дружеская завершающая реплика, подтверждающая план на *samedi* (субботу).
