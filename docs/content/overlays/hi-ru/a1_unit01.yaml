course:
  title: रूसी A1
  description: रोज़मर्रा के अभिवादन और छोटी सामाजिक बातचीत के लिए A1 स्तर की रूसी सीखिए। सिरिलिक वर्णमाला और вы/ты के औपचारिक-अनौपचारिक भेद की विस्तृत हिंदी व्याख्या साथ में है।
