teaching:
  ru.a1.unit01.lesson01.teach.direction:
    title: पढ़ने की दिशा
    gloss: रूसी वर्णमाला हिंदी की तरह बाएँ से दाएँ पढ़ी जाती है।
    note: रूसी (सिरिलिक लिपि) देवनागरी की तरह बाएँ से दाएँ पढ़ी जाती है, इसलिए पढ़ने की दिशा की कोई नई आदत नहीं डालनी है — बस अक्षरों के नए आकार और ध्वनियाँ सीखनी हैं।
  ru.a1.unit01.lesson01.teach.letter_z:
    title: З з
    gloss: अक्षर З (ज़)
    note: इसका उच्चारण "ज़ू" के "ज़" जैसा है। छोटा रूप з अंक 3 जैसा दिखता है।
  ru.a1.unit01.lesson01.teach.letter_d:
    title: Д д
    gloss: अक्षर Д (द)
    note: इसका उच्चारण "दरवाज़ा" के "द" जैसा है। छोटा रूप д बड़े रूप का ही छोटा संस्करण है, जिसमें रेखा के नीचे छोटे "पैर" होते हैं। यह लैटिन "d" से बिलकुल नहीं मिलता, इसलिए आकार नए सिरे से सीखिए।
  ru.a1.unit01.lesson01.teach.letter_r:
    title: Р р
    gloss: अक्षर Р (र)
    note: इसका उच्चारण जीभ से लुढ़कते "र" जैसा है, हिंदी के "र" की तरह। यह लैटिन "P" जैसा दिखता है — यह भ्रम में डालने वाला आकार है, इसलिए इसे "p" मत पढ़िए।
  ru.a1.unit01.lesson01.teach.letter_a:
    title: А а
    gloss: अक्षर А (आ)
    note: इसका उच्चारण "आम" के "आ" जैसा है। यह लैटिन "A/a" जैसा ही दिखता है और उसके करीब ही सुनाई देता है।
  ru.a1.unit01.lesson01.teach.letter_v:
    title: В в
    gloss: अक्षर В (व)
    note: इसका उच्चारण "वन" के "व" जैसा है। यह लैटिन "B" जैसा दिखता है — यह भी भ्रम में डालने वाला आकार है।
  ru.a1.unit01.lesson01.teach.letter_s:
    title: С с
    gloss: अक्षर С (स)
    note: इसका उच्चारण "सूरज" के "स" जैसा है। यह लैटिन "C/c" जैसा दिखता है, पर रूसी में यह कभी "क" की ध्वनि नहीं देता।
  ru.a1.unit01.lesson01.teach.letter_t:
    title: Т т
    gloss: अक्षर Т (त)
    note: इसका उच्चारण "तारा" के "त" के करीब है। हाथ से लिखते समय छोटा रूप т कभी-कभी छोटे "m" जैसा लिखा जाता है — पहले यहाँ दिया छपा हुआ आकार सीखिए।
  ru.a1.unit01.lesson01.teach.letter_u:
    title: У у
    gloss: अक्षर У (ऊ)
    note: इसका उच्चारण "चूहा" के "ऊ" जैसा है। यह लैटिन "y" जैसा दिखता है — यह ऐसा आकार है जिसकी ध्वनि अपने मिलते-जुलते लैटिन अक्षर से नहीं मिलती।
  ru.a1.unit01.lesson01.teach.letter_ye:
    title: Е е
    gloss: अक्षर Е (ये)
    note: शब्द या अक्षरांश की शुरुआत में इसका उच्चारण "येस" के "ये" जैसा है। यह लैटिन "E/e" जैसा ही दिखता है, पर ध्वनि काफ़ी अलग है।
  ru.a1.unit01.lesson01.teach.hard_sign_note:
    title: 'ъ और ь: कठोर चिह्न और कोमल चिह्न'
    gloss: 'कठोर चिह्न ъ और कोमल चिह्न ь की अपनी कोई ध्वनि नहीं होती: ये पास के अक्षर का उच्चारण बदल देते हैं।'
    note: ये दोनों चिह्न अकेले कोई ध्वनि नहीं देते — ь अपने से पहले के व्यंजन को कोमल बनाता है, और ъ ध्वनियों के बीच कठोर अलगाव दिखाता है। असली शब्दों में आने पर हम इन्हें फिर देखेंगे।
  ru.a1.unit01.lesson01.teach.letter_short_i:
    title: Й й
    gloss: अक्षर छोटा И (й)
    note: इसका उच्चारण "जाय" के अंत की "य" जैसी छोटी फिसलती ध्वनि है, पूरा स्वर नहीं। यह Здравствуйте में आता है, जिस शब्द तक यह पाठ पहुँचता है।
  ru.a1.unit01.lesson01.teach.zdravstvuyte_shape:
    title: Здравствуйте
    gloss: नमस्ते (औपचारिक)
    note: यह पूरा औपचारिक अभिवादन अभी सीखे अक्षरों से बना है। देखने में लंबा और व्यंजनों से भरा लगता है, पर इसका हर अक्षर इसी पाठ में आ चुका है।
    example_gloss: नमस्ते! मेरा नाम विक्टर है।
  ru.a1.unit01.lesson02.teach.zdravstvuyte_privet:
    title: Здравствуйте, Привет
    gloss: नमस्ते (औपचारिक); हाय (अनौपचारिक)
    note: Здравствуйте दिन के किसी भी समय और किसी भी अजनबी के लिए सुरक्षित, औपचारिक अभिवादन है। Привет बोलचाल का है, दोस्तों और हमउम्र लोगों के साथ बोला जाता है।
    example_gloss:
    - नमस्ते! आप कैसे हैं? (औपचारिक)
    - हाय! क्या हाल है? (अनौपचारिक)
  ru.a1.unit01.lesson02.teach.dobroe_utro:
    title: Доброе утро!
    gloss: सुप्रभात
    note: सुबह के समय, लगभग देर सुबह तक बोला जाता है।
  ru.a1.unit01.lesson02.teach.dobryy_den:
    title: Добрый день!
    gloss: शुभ दिन / नमस्ते
    note: दिन का सामान्य अभिवादन, जो देर सुबह से दोपहर तक बोला जा सकता है।
  ru.a1.unit01.lesson02.teach.dobryy_vecher:
    title: Добрый вечер!
    gloss: शुभ संध्या
    note: शाम को कहीं पहुँचने पर बोला जाता है — यह अभिवादन है, विदा लेने की बात नहीं।
  ru.a1.unit01.lesson02.teach.register_note:
    title: अभिवादन चुनना
    gloss: Здравствуйте दिन के किसी भी समय और शिष्ट बातचीत में चलता है। Привет अनौपचारिक है, दोस्तों के बीच बोला जाता है।
    note: अगर समय या सामने वाले के बारे में संदेह हो, तो Здравствуйте हमेशा सुरक्षित है; Привет उन्हीं लोगों के लिए है जिन्हें आप अच्छी तरह जानते हैं।
  ru.a1.unit01.lesson03.teach.kak_dela:
    title: Как дела?
    gloss: क्या हाल है? (अनौपचारिक)
    note: किसी का हाल पूछने का रोज़मर्रा का अनौपचारिक तरीका, दोस्तों और हमउम्र लोगों के साथ।
  ru.a1.unit01.lesson03.teach.kak_pozhivaete:
    title: Как поживаете?
    gloss: आप कैसे हैं? (औपचारिक)
    note: किसी का हाल पूछने का औपचारिक तरीका, जो вы वाले रूप के अनुरूप है।
  ru.a1.unit01.lesson03.teach.horosho_spasibo:
    title: Хорошо, спасибо
    gloss: ठीक हूँ, धन्यवाद
    note: एक सरल, सकारात्मक जवाब जो दोनों रूपों में चलता है।
    example_gloss: आप कैसे हैं? — ठीक हूँ, धन्यवाद।
  ru.a1.unit01.lesson03.teach.tak_sebe:
    title: Так себе
    gloss: बस ऐसे ही
    note: तटस्थ से थोड़ा नकारात्मक जवाब, जब हालात न बहुत अच्छे हों न बुरे।
    example_gloss: क्या हाल है? — बस ऐसे ही।
  ru.a1.unit01.lesson03.teach.a_u_tebya:
    title: А у тебя?
    gloss: और तुम? (अनौपचारिक)
    note: वही सवाल सामने वाले से लौटाने का अनौपचारिक तरीका, जो ты रूप के अनुरूप है।
  ru.a1.unit01.lesson03.teach.do_svidaniya:
    title: До свидания!
    gloss: अलविदा (सामान्य/औपचारिक)
    note: विदा लेने का सामान्य, हर जगह चलने वाला तरीका — शब्दशः "फिर मिलने तक" के करीब।
  ru.a1.unit01.lesson03.teach.poka:
    title: Пока!
    gloss: चलो, फिर मिलते हैं (अनौपचारिक)
    note: दोस्तों और जान-पहचान के लोगों के बीच विदा लेने का आम बोलचाल का तरीका।
  ru.a1.unit01.lesson03.teach.do_zavtra:
    title: До завтра!
    gloss: कल मिलते हैं
    note: दोस्ताना विदाई, जब आप अगले दिन उस व्यक्ति से फिर मिलने की उम्मीद करते हैं।
  ru.a1.unit01.lesson03.teach.anna:
    title: अन्ना मक्सिम का अभिवादन करती है
    gloss: 'अन्ना कहती है: नमस्ते! क्या हाल है?'
    note: अन्ना और मक्सिम सहकर्मी हैं और दिन में एक-दूसरे का अभिवादन कर रहे हैं; дела से पता चलता है कि उनके बीच अनौपचारिक रिश्ता है।
  ru.a1.unit01.lesson03.teach.maksim_reply:
    title: मक्सिम जवाब देता है और सवाल लौटाता है
    gloss: 'मक्सिम कहता है: ठीक हूँ, धन्यवाद। और तुम्हारा?'
    note: मक्सिम जवाब देता है और अन्ना के लहजे के अनुसार अनौपचारिक ढंग से सवाल लौटाता है।
  ru.a1.unit01.lesson03.teach.anna_close:
    title: अन्ना बातचीत समाप्त करती है
    gloss: 'अन्ना कहती है: मैं भी ठीक हूँ। अच्छा, कल मिलते हैं!'
    note: अन्ना छोटी-सी बातचीत समेटकर दोस्ताना विदाई की ओर बढ़ती है।
  ru.a1.unit01.lesson03.teach.maksim_close:
    title: मक्सिम अलविदा कहता है
    gloss: 'मक्सिम कहता है: कल मिलते हैं!'
    note: मक्सिम अन्ना की विदाई दोहराकर बातचीत समाप्त करता है।
