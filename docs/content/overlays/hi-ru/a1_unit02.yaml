teaching:
  ru.a1.unit02.lesson01.teach.kak_vas_zovut:
    title: Как вас зовут?, Как тебя зовут?
    gloss: आपका नाम क्या है? (औपचारिक); तुम्हारा नाम क्या है? (अनौपचारिक)
    note: Как вас зовут? में औपचारिक вас है और यह अजनबियों से या विनम्र माहौल में पूछा जाता है। Как тебя зовут? में अनौपचारिक тебя है, जो दोस्तों, बच्चों और हमउम्र लोगों से पूछा जाता है।
    example_gloss:
    - नमस्ते! आपका नाम क्या है?
    - हाय! तुम्हारा नाम क्या है?
  ru.a1.unit02.lesson01.teach.menya_zovut:
    title: Меня зовут Виктор.
    gloss: मेरा नाम विक्टर है।
    note: 'Меня зовут (शाब्दिक अर्थ: "मुझे बुलाते हैं") रूसी में अपना नाम बताने का मानक तरीका है, चाहे औपचारिकता का कोई भी स्तर हो।'
  ru.a1.unit02.lesson01.teach.menya_zovut_anna:
    title: Меня зовут Анна.
    gloss: मेरा नाम अन्ना है।
    note: यही ढाँचा, Меня зовут ..., दूसरे नाम के साथ -- बोलने वाले के लिंग के अनुसार यह वाक्यांश नहीं बदलता।
  ru.a1.unit02.lesson01.teach.register_note:
    title: सही सवाल चुनना
    gloss: Как вас зовут? विनम्र है या अजनबियों के लिए। Как тебя зовут? दोस्तों, बच्चों और हमउम्र लोगों के लिए।
    note: यहाँ औपचारिक/अनौपचारिक का भेद вы/ты के भेद जैसा ही है, जिसे पाठ 2 में पूरी तरह सिखाया गया है -- вас और тебя क्रमशः вы और ты के कर्म कारक रूप हैं।
  ru.a1.unit02.lesson02.teach.vy_ty:
    title: вы, ты
    gloss: आप (औपचारिक); तुम (अनौपचारिक)
    note: हिंदी में "आप" और "तुम" का जो भेद है, रूसी में वही вы और ты का है -- вы अजनबियों, बड़ों और पेशेवर माहौल में; ты दोस्तों, परिवार और बच्चों के साथ।
    example_gloss:
    - आप कहाँ से हैं? (औपचारिक)
    - तुम कहाँ से हो? (अनौपचारिक)
  ru.a1.unit02.lesson02.teach.vy_ty_rule:
    title: किसका कब इस्तेमाल करें
    gloss: 'Вы औपचारिक है: अजनबियों के साथ, काम पर, बड़ों के साथ। Ты अनौपचारिक है: दोस्तों, परिवार, बच्चों के साथ।'
    note: जो व्यक्ति вы की अपेक्षा रखता है, उससे ты में बात करना ज़रूरत से ज़्यादा बेतकल्लुफ़ या बदतमीज़ी जैसा लग सकता है -- संदेह हो तो вы से शुरू करें।
  ru.a1.unit02.lesson02.teach.mozhno_na_ty:
    title: Можно на ты?
    gloss: क्या हम अनौपचारिक ты पर आ सकते हैं?
    note: रिश्ता दोस्ताना हो जाने पर औपचारिक вы से अनौपचारिक ты पर आने का विनम्र प्रस्ताव रखने का तरीका।
  ru.a1.unit02.lesson02.teach.davayte_pereydyom:
    title: Давайте перейдём на ты.
    gloss: चलिए अनौपचारिक ты पर आ जाएँ।
    note: Можно на ты? की तरह ही वही बदलाव प्रस्तावित करने का थोड़ा ज़्यादा सीधा और आमंत्रित करने वाला तरीका।
  ru.a1.unit02.lesson02.teach.otkuda_vy:
    title: Откуда вы?
    gloss: आप कहाँ से हैं? (औपचारिक)
    note: इसमें औपचारिक вы है, जो पहली मुलाक़ात या पेशेवर माहौल के अनुकूल है।
  ru.a1.unit02.lesson02.teach.otkuda_ty:
    title: Откуда ты?
    gloss: तुम कहाँ से हो? (अनौपचारिक)
    note: इसका अनौपचारिक रूप, जो ऐसे व्यक्ति से कहा जाता है जिसे आप अच्छी तरह जानते हैं।
  ru.a1.unit02.lesson02.teach.ya_iz_kanady:
    title: Я из Канады.
    gloss: मैं कनाडा से हूँ।
    note: Из ("से") के बाद संबंध कारक (संबंध कारक) आता है, इसलिए यहाँ Канада बदलकर Канады हो जाता है -- मूल स्थान बताने वाले इस ढाँचे पर ध्यान दें, भले ही पूरा कारक-व्याकरण बाद में आएगा।
  ru.a1.unit02.lesson02.teach.ya_iz_moskvy:
    title: Я из Москвы.
    gloss: मैं मॉस्को से हूँ।
    note: 'Я из Канады जैसा ही ढाँचा: из के बाद Москва बदलकर Москвы हो जाता है।'
  ru.a1.unit02.lesson03.teach.davayte_poznakomimsya:
    title: Давайте познакомимся.
    gloss: आइए परिचय करें।
    note: पहली बार मिल रहे लोगों के बीच परिचय शुरू करने का विनम्र और आम तरीका।
  ru.a1.unit02.lesson03.teach.ochen_priyatno:
    title: Очень приятно
    gloss: आपसे मिलकर खुशी हुई
    note: किसी के अपना नाम बताने के बाद दिया जाने वाला मानक, विनम्र उत्तर।
    example_gloss: मेरा नाम जॉन है। -- आपसे मिलकर खुशी हुई।
  ru.a1.unit02.lesson03.teach.irina_greeting:
    title: इरीना पेत्रोव्ना परिचय की शुरुआत करती हैं
    gloss: 'इरीना पेत्रोव्ना कहती हैं: नमस्ते! आइए परिचय करें। मेरा नाम इरीना पेत्रोव्ना है।'
    note: इरीना पेत्रोव्ना दफ़्तर के औपचारिक माहौल में पहली बार जॉन से मिल रही हैं, इसलिए वे विनम्र Здравствуйте और पूरे समय вы का रूप इस्तेमाल करती हैं।
  ru.a1.unit02.lesson03.teach.john_reply:
    title: जॉन अपना नाम बताकर जवाब देता है
    gloss: 'जॉन कहता है: आपसे मिलकर खुशी हुई। मेरा नाम जॉन है।'
    note: जॉन Очень приятно कहकर इरीना पेत्रोव्ना के औपचारिक, विनम्र लहजे के अनुरूप बोलता है।
  ru.a1.unit02.lesson03.teach.irina_question:
    title: इरीना पेत्रोव्ना पूछती हैं कि जॉन कहाँ से है
    gloss: 'इरीना पेत्रोव्ना पूछती हैं: जॉन, आप कहाँ से हैं?'
    note: दफ़्तर के माहौल के अनुसार वे औपचारिक Откуда вы इस्तेमाल करती हैं।
  ru.a1.unit02.lesson03.teach.john_answer:
    title: जॉन जवाब देता है और पलटकर पूछता है
    gloss: 'जॉन कहता है: मैं कनाडा से हूँ। और आप कहाँ से हैं?'
    note: जॉन अपना मूल स्थान बताता है और А вы откуда? कहकर विनम्रता से वही सवाल लौटाता है।
  ru.a1.unit02.lesson03.teach.irina_answer:
    title: इरीना पेत्रोव्ना जवाब देती हैं
    gloss: 'इरीना पेत्रोव्ना कहती हैं: मैं मॉस्को से हूँ।'
    note: वे बातचीत पूरी करती हैं, और पाठ 2 में देखा गया मूल स्थान वाला संबंध कारक ढाँचा दोहराती हैं।
