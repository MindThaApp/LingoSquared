    accepted_answers:
    - value: लेना लंबी है।
      status: correct
    feedback: Лена высокая.
  ru.a1.unit26.lesson01.exercise02.listen_igor_nevysokiy:
    instruction: सुनिए और चुनिए कि वक्ता क्या कहता है।
    correct_option: इगोर का क़द छोटा है।
    distractors:
    - इगोर लंबा है।
    - इगोर बूढ़ा है।
    - इगोर जवान है।
