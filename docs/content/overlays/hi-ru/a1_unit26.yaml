teaching:
  ru.a1.unit26.lesson01.teach.vysokiy_nevysokiy:
    title: लंबा और नाटा
    gloss: लंबा / नाटा
    note: '*Высокий* लंबे क़द वाले व्यक्ति के लिए और *невысокий* छोटे क़द वाले के लिए है (शाब्दिक अर्थ ''ऊँचा नहीं'')। लिंग के अनुसार अंत बदलता है: *высокая*, *невысокая*।'
    example_gloss:
    - लेना लंबी है।
    - इगोर का क़द छोटा है।
  ru.a1.unit26.lesson01.teach.staryy_molodoy:
    title: बुज़ुर्ग और जवान
    gloss: बुज़ुर्ग / जवान
    note: यहाँ *старый* और *молодой* उम्र का सामान्य आभास बताते हैं, वर्षों की सटीक संख्या नहीं।
    example_gloss:
    - दादाजी बुज़ुर्ग हैं।
    - दीमा जवान है।
  ru.a1.unit26.lesson01.teach.prilagatelnoe_menyaetsya_po:
    title: विशेषण लिंग के अनुसार बदलता है
    gloss: 'विशेषण व्यक्ति के लिंग के अनुरूप होता है: *он высокий, она высокая*; *он старый, она старая*।'
    note: पुल्लिंग विशेषण *-ый*, *-ий* या *-ой* पर समाप्त होते हैं (*высокий*, *молодой*); स्त्रीलिंग विशेषण *-ая* पर समाप्त होते हैं (*высокая*, *молодая*)।
  ru.a1.unit26.lesson01.teach.lena_vysokaya_a:
    title: लेना लंबी है और इगोर छोटे क़द का है
    gloss: लेना लंबी है और इगोर छोटे क़द का है।
    note: 'दो कथन *а* (जबकि, और) से साथ-साथ रखे गए हैं: *Лена высокая, а Игорь невысокий*।'
  ru.a1.unit26.lesson02.teach.volosy:
    title: बाल
    gloss: बाल
    note: 'रूसी में *Волосы* (बाल) बहुवचन है: *У Насти светлые волосы*; इसे कभी एकवचन संज्ञा नहीं बनाया जाता।'
    example_gloss: दीमा के बाल छोटे और काले हैं।
  ru.a1.unit26.lesson02.teach.svetlye_kashtanovye_sedye:
    title: सुनहरा, भूरा और स्लेटी
    gloss: सुनहरा / भूरा / स्लेटी
    note: '*волосы* के अनुरूप बहुवचन में बालों के तीन रंग: *светлые*, *каштановые*, *седые*।'
    example_gloss:
    - नास्त्या के बाल सुनहरे हैं।
    - इगोर के बाल भूरे (शाहबलूत रंग के) हैं।
    - दादाजी के बाल स्लेटी हैं।
  ru.a1.unit26.lesson02.teach.dlinnye_korotkie:
    title: लंबे और छोटे (बाल)
    gloss: लंबे / छोटे (बाल)
    note: '*Длинные* (लंबे) और *короткие* (छोटे) भी बहुवचन *волосы* के अनुरूप होते हैं।'
    example_gloss:
    - लेना के लंबे बाल हैं।
    - इगोर के बाल छोटे हैं।
  ru.a1.unit26.lesson02.teach.volosy_stoyat_vo:
    title: विशेषण волосы के अनुरूप होते हैं
    gloss: '*Волосы* बहुवचन है, इसलिए विशेषण भी बहुवचन होता है: *длинные волосы*, *короткие волосы*, *светлые волосы*, *чёрные волосы*।'
    note: बहुवचन विशेषण *-ые* या *-ие* पर समाप्त होते हैं। यही अंत आप अगले पाठ में *глаза* के साथ भी देखेंगे।
  ru.a1.unit26.lesson02.teach.posle_u_imya:
    title: у के साथ संबंध कारक (родительный)
    gloss: '*у* के बाद स्वामी संबंध कारक (родительный) में आता है: *у Насти* (नास्त्या के पास/की), *у Димы* (दीमा के पास/का), *у неё* (उसके पास/उसकी)।'
    note: 'रूसी में ''के पास होना'' इसी तरह कहा जाता है: *у* + संबंध कारक + वह वस्तु जो है। ''होना/रखना'' जैसी कोई क्रिया नहीं होती।'
  ru.a1.unit26.lesson02.teach.u_dimy_korotkie:
    title: दीमा के बाल छोटे और काले हैं
    gloss: दीमा के बाल छोटे और काले हैं।
    note: '*Чёрные* (काले) बहुवचन *волосы* के अनुरूप है। इस कोर्स में अक्षर *ё* हमेशा लिखा जाता है।'
  ru.a1.unit26.lesson02.teach.u_nasti_dlinnye:
    title: नास्त्या के बाल लंबे और सुनहरे हैं
    gloss: नास्त्या के बाल लंबे और सुनहरे हैं।
    note: इस पाठ की लंबाई और रंग की शब्दावली एक स्वाभाविक वाक्य में एक साथ आई है।
  ru.a1.unit26.lesson03.teach.glaza:
    title: आँखें
    gloss: आँखें
    note: '*Глаза* (आँखें) *глаз* का बहुवचन है; बहुवचन का अंत *-а* है।'
    example_gloss: दीमा की आँखें भूरी हैं।
  ru.a1.unit26.lesson03.teach.golubye_karie_zelyonye:
    title: नीला, भूरा और हरा
    gloss: नीला / भूरा / हरा
    note: '*Голубые* हल्का नीला है, *карие* केवल आँखों के लिए भूरा है, और *зелёные* हरा है। तीनों बहुवचन हैं।'
    example_gloss:
    - नास्त्या की आँखें नीली हैं।
    - इगोर की आँखें भूरी हैं।
    - लेना की आँखें हरी हैं।
  ru.a1.unit26.lesson03.teach.glaza_stoyat_vo:
    title: विशेषण глаза के अनुरूप होते हैं
    gloss: '*Глаза* बहुवचन है, इसलिए विशेषण भी बहुवचन होता है: *голубые глаза*, *карие глаза*, *зелёные глаза*।'
    note: 'भूरी आँखें *карие* हैं, *коричневые* नहीं, और भूरे बाल *каштановые* हैं: रूसी में आँखों और बालों के लिए अलग शब्द हैं।'
  ru.a1.unit26.lesson03.teach.kak_vyglyadit_nastya:
    title: नास्त्या कैसी दिखती है?
    gloss: नास्त्या कैसी दिखती है?
    note: '*Как выглядит ...?* इस इकाई का मुख्य प्रश्न है। क्रिया *выглядит* एकवचन कर्ता के अनुरूप होती है।'
  ru.a1.unit26.lesson03.teach.u_nasti_dlinnye:
    title: नास्त्या के बाल लंबे और सुनहरे हैं और आँखें नीली हैं
    gloss: नास्त्या के बाल लंबे और सुनहरे हैं और आँखें नीली हैं।
    note: 'आदर्श उत्तर में बाल और आँखें *и* से जुड़ती हैं: *У Насти длинные светлые волосы и голубые глаза*।'
  ru.a1.unit26.lesson04.teach.nastya_v_yazykovoe:
    title: नास्त्या नीना का परिचय देती है
    gloss: 'नास्त्या: भाषा-कैफ़े में एक नई लड़की आएगी। उसका नाम नीना है।'
    note: '*Придёт* (आएगा/आएगी) पूर्ण भविष्य काल है। *Её зовут Нина* का शाब्दिक अर्थ है ''लोग उसे नीना बुलाते हैं''।'
  ru.a1.unit26.lesson04.teach.dima_khorosho_kak:
    title: दीमा पूछता है कि वह कैसी दिखती है
    gloss: 'दीमा: अच्छा! वह कैसी दिखती है?'
    note: वही मुख्य प्रश्न, अब नाम की जगह *она* (वह) के साथ।
  ru.a1.unit26.lesson04.teach.nastya_ona_nevysokaya:
    title: नास्त्या नीना का क़द और बाल बताती है
    gloss: 'नास्त्या: उसका क़द छोटा है और उसके बाल छोटे और सुनहरे हैं।'
    note: यह पाठ 1 का *невысокая* और पाठ 2 के बालों वाले शब्द जोड़ता है। *И у неё* दूसरी बात जोड़ता है।
  ru.a1.unit26.lesson04.teach.dima_a_kakie:
    title: दीमा उसकी आँखों के बारे में पूछता है
    gloss: 'दीमा: और उसकी आँखें कैसी हैं?'
    note: '*Какие у неё глаза?* में *у неё* (''उसके पास/उसकी'') आया है। *Неё*, *у* के बाद *она* का रूप है।'
  ru.a1.unit26.lesson04.teach.nastya_u_neyo:
    title: नास्त्या नीना की आँखों का वर्णन करती है
    gloss: 'नास्त्या: उसकी आँखें हरी हैं।'
    note: पाठ 3 का *зелёные глаза* फिर आया है, 'उसकी' के लिए *у неё* के साथ।
  ru.a1.unit26.lesson04.teach.dima_spasibo_togda:
    title: दीमा उसे पहचान लेगा
    gloss: 'दीमा: धन्यवाद! तब मैं उसे पहचान लूँगा।'
    note: '*Я её узнаю* (मैं उसे पहचान लूँगा): *её*, *она* का कर्म रूप (винительный) है, क्योंकि नीना कर्म है।'
  ru.a1.unit26.lesson05.teach.igor_i_lena:
    title: इगोर और लेना की तुलना
    gloss: इगोर और लेना भाई-बहन हैं, पर वे अलग-अलग दिखते हैं। इगोर का क़द छोटा है, उसके बाल छोटे और भूरे हैं और आँखें भी भूरी हैं। लेना इगोर से लंबी है, उसके बाल लंबे और भूरे हैं और आँखें हरी हैं। आप कैसे दिखते हैं?
    note: अब तक सिखाए गए हर रंग और लंबाई के शब्द इस्तेमाल करने वाली छोटी तुलना, जो अंत में पाठक से इकाई का मुख्य सवाल पूछती है।
    glosses:
      брат: भाई
      сестра: बहन
      выглядят: दिखना
      по-разному: अलग
      невысокий: छोटा
      короткие: छोटा
      каштановые: भूरा
      волосы: बाल
      карие: भूरा
      глаза: आँखें
      выше: ज़्यादा लंबा
      длинные: लंबा
      зелёные: हरा
      выглядишь: तुम दिखते हो / प्रतीत होते हो (जैसे как ты выглядишь? में)
  ru.a1.unit26.lesson05.teach.posle_vyshe_stoit:
    title: выше से तुलना
    gloss: '*выше* (अधिक लंबा/लंबी) के बाद जिससे तुलना की जाती है, वह संबंध कारक (родительный) में आता है: *Лена выше Игоря*।'
    note: तुलनात्मक रूप *выше* लिंग के अनुसार नहीं बदलता। जिससे तुलना हो, वह संबंध कारक में आता है या *чем* के बाद आता है।
  ru.a1.unit26.lesson05.teach.u_leny_volosy:
    title: लेना के बाल इगोर से लंबे हैं
    gloss: लेना के बाल इगोर से लंबे हैं।
    note: '*У Лены волосы длиннее, чем у Игоря*: *длиннее* कभी नहीं बदलता, और *чем* (से) दूसरा भाग शुरू करता है।'
  ru.a1.unit26.lesson05.teach.u_menya_korotkie:
    title: मेरे बाल छोटे और भूरे हैं
    gloss: मेरे बाल छोटे और भूरे हैं।
    note: 'अपने रूप-रंग के लिए एक आदर्श वाक्य: *У меня* (''मेरे पास/मेरे'') + विशेषण + संज्ञा।'
  ru.a1.unit26.lesson06.teach.dima_smotri_eto:
    title: दीमा को नीना दिखती है
    gloss: 'दीमा: देखो, क्या यह नीना है? उसके बाल छोटे और सुनहरे हैं और आँखें हरी हैं।'
    note: '*Смотри* (देखो) अनौपचारिक आज्ञार्थक रूप है, जो पिछले संवादों में भी इसी तरह प्रयोग हुआ है।'
  ru.a1.unit26.lesson06.teach.nastya_da_eto:
    title: नास्त्या पुष्टि करती है
    gloss: 'नास्त्या: हाँ, यह नीना है!'
    note: एक छोटी, स्वाभाविक पुष्टि।
  ru.a1.unit26.lesson06.teach.nina_privet_ty:
    title: नीना दीमा का अभिवादन करती है
    gloss: 'नीना: नमस्ते, क्या तुम दीमा हो?'
    note: 'एक सरल अनौपचारिक प्रश्न: रूसी में ''है/हो'' क्रिया की ज़रूरत नहीं होती, बस *Ты Дима?*'
  ru.a1.unit26.lesson06.teach.dima_da_priyatno:
    title: दीमा भी नीना का अभिवादन करता है
    gloss: 'दीमा: हाँ! आपसे मिलकर ख़ुशी हुई, नीना।'
    note: '*Приятно познакомиться* किसी से पहली बार मिलने पर कहा जाने वाला सामान्य वाक्यांश है। *Познакомиться* का अर्थ है किसी नए व्यक्ति से परिचय करना।'
  ru.a1.unit26.lesson06.teach.nina_mne_tozhe:
    title: Nina भी अभिवादन लौटाती है
    gloss: 'Nina: तुमसे मिलकर मुझे भी खुशी हुई!'
    note: संवाद का समापन -- दीमा ने नास्त्या के वर्णन से नीना को सफलतापूर्वक पहचान लिया।
exercises:
