  ru.a1.unit30.lesson02.teach.soobshchenie:
    title: संदेश
    gloss: संदेश
    example_gloss: मैं ऐप से एक संदेश भेजता/भेजती हूँ।
  ru.a1.unit30.lesson02.teach.prognoz_pogody_slovo:
    title: Прогноз погоды और сообщение
    gloss: '*Прогноз погоды* दो शब्द हैं, और दूसरा शब्द *погоды* संबंध कारक (संबंध कारक) में है। *Сообщение* वह संदेश है जिसे आप भेज या पढ़ सकते हैं।'
    note: नया शब्द मौसम वाली इकाई के पहले सीखे संयुक्त संज्ञा से जुड़ता है।
  ru.a1.unit30.lesson02.teach.nastya_otpravlyaet_soobshchenie:
