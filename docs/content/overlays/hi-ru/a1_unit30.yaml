    gloss: नास्त्या ऐप के ज़रिए संदेश भेजती है।
    note: '*Отправляет* (भेजती है) एक नियमित क्रिया है। संदेश कर्म कारक (कर्म कारक) में कर्म है, और *через приложение* का अर्थ है ''ऐप के ज़रिए''।'
  ru.a1.unit30.lesson02.teach.dima_chitaet_soobshchenie:
