    example_gloss: मैं मौसम का पूर्वानुमान खोजता/खोजती हूँ।
  ru.a1.unit30.lesson03.teach.posle_polzovatsya_slovo:
    title: Пользоваться और искать
    gloss: '*Пользоваться* के साथ करण कारक (करण कारक) आता है (*пользоваться телефоном*), जबकि *искать* के साथ कर्म कारक (कर्म कारक) आता है (*искать прогноз*)।'
    note: 'दोनों क्रियाएँ नियमित हैं: *я пользуюсь, ты пользуешься*; *я ищу, ты ищешь*।'
  ru.a1.unit30.lesson03.teach.igor_ishchet_prognoz:
    title: इगोर मौसम का पूर्वानुमान खोजता है
    gloss: इगोर मौसम का पूर्वानुमान खोजता है।
  ru.a1.unit30.lesson03.teach.potom_on_idyot:
    title: फिर वह दौड़ने जाता है
    gloss: फिर वह दौड़ने जाता है।
    note: '*Идёт бегать* का अर्थ है ''दौड़ने जाता है'': *идёт* गति की क्रिया है, जिसके बाद वह काम क्रिया के मूल रूप (मूल रूप) में आता है जिसके लिए वह जाता है।'
  ru.a1.unit30.lesson04.teach.nastya_davay_v:
    title: नास्त्या प्रस्ताव रखती है
    gloss: 'नास्त्या: क्या हम शनिवार को दस बजे कसरत करें?'
  ru.a1.unit30.lesson04.teach.dima_khoroshaya_ideya:
    title: दीमा सहमत होता है
    gloss: 'दीमा: अच्छा विचार है! मैं मौसम का पूर्वानुमान देखता हूँ।'
    note: '*Хорошая идея* में स्त्रीलिंग विशेषण स्त्रीलिंग संज्ञा के साथ आया है। *Поищу* पूर्ण भविष्य काल है, ''मैं खोजूँगा''।'
  ru.a1.unit30.lesson04.teach.dima_v_subbotu:
    title: दीमा मौसम देखता है
    gloss: 'दीमा: शनिवार को धूप है!'
    note: '*Солнечно* मौसम बताने वाला शब्द है। ''है'' जैसी क्रिया की ज़रूरत नहीं: *В субботу солнечно*।'
  ru.a1.unit30.lesson04.teach.igor_ya_vizhu:
    title: इगोर संदेश देखता है
    gloss: 'इगोर: मुझे संदेश दिख रहा है। शनिवार को मिलते हैं!'
  ru.a1.unit30.lesson04.teach.ty_uzhe_znaesh:
    title: До के साथ संबंध कारक
    gloss: 'आप *До свидания!* जानते हैं। आप किसी दिन का नाम भी ले सकते हैं: *До субботы!*, *До завтра!* *до* के बाद संज्ञा संबंध कारक (संबंध कारक) में आती है।'
    note: अभिवादन वाली इकाई के विदा लेने के ढंग को किसी ख़ास दिन तक बढ़ाता है।
  ru.a1.unit30.lesson05.teach.nastya_kazhdyy_den:
    title: कौन क्या इस्तेमाल करता है?
    gloss: नास्त्या हर दिन दीमा को फ़ोन करती है। वह फ़ोन इस्तेमाल करती है, ऐप नहीं। दीमा के घर में कंप्यूटर नहीं है, लेकिन वह फ़ोन पर इंटरनेट इस्तेमाल करता है। इगोर हर सुबह मौसम का पूर्वानुमान खोजता है। फिर वह दौड़ने जाता है। Лена अक्सर नास्त्या को संदेश भेजती है। क्या तुम भी हर दिन फ़ोन इस्तेमाल करते हो?
    note: चारों पात्रों की उपकरण-आदतों की तुलना करता है, जैसा खेल वाली इकाई का तुलनात्मक पाठ था।
    glosses:
      звонит: फ़ोन करती है
      каждый: हर
      день: दिन
      пользуется: इस्तेमाल करती है
      телефоном: फ़ोन
      приложением: ऐप
      компьютера: कंप्यूटर
      дома: घर पर
      интернетом: इंटरनेट
      ищет: खोजता है
      утро: सुबह
      прогноз: मौसम का पूर्वानुमान
      идёт: जाता है
      бегать: दौड़ना
      отправляет: भेजती है
      часто: अक्सर
      сообщение: संदेश
      пользуешься: इस्तेमाल करते हैं
  ru.a1.unit30.lesson05.teach.igor_kazhdoe_utro:
    title: इगोर हर सुबह पूर्वानुमान खोजता है
    gloss: इगोर हर सुबह मौसम का पूर्वानुमान खोजता है।
  ru.a1.unit30.lesson05.teach.lena_chasto_otpravlyaet:
    title: Лена अक्सर नास्त्या को संदेश भेजती है
    gloss: Лена अक्सर नास्त्या को संदेश भेजती है।
  ru.a1.unit30.lesson06.teach.nastya_ya_vizhu:
    title: नास्त्या योजना पक्की करती है
    gloss: 'नास्त्या: मुझे संदेश दिख रहा है। क्या हम शनिवार को दस बजे पार्क में कसरत करें?'
  ru.a1.unit30.lesson06.teach.dima_da_i:
    title: दीमा मौसम की पुष्टि करता है
    gloss: 'दीमा: हाँ, और शनिवार को धूप भी खिली है!'
  ru.a1.unit30.lesson06.teach.igor_ya_togda:
    title: इगोर की योजना
    gloss: 'इगोर: तब मैं दौड़ लगाऊँगा। उसके बाद फ़ुटबॉल भी खेलूँगा।'
    note: '*Потом* (उसके बाद) दूसरी योजना को पहली के बाद रखता है, और *побегаю* पूर्ण (पूर्ण रूप) रूप है: ''मैं थोड़ी देर दौड़ूँगा''।'
  ru.a1.unit30.lesson06.teach.lena_ya_luchshe:
    title: लेना की योजना
    gloss: 'लेना: मुझे तैरना ज़्यादा पसंद है, लेकिन मैं भी पार्क आ रही हूँ।'
    note: '*Я лучше поплаваю* का अर्थ है ''मैं तैर लेना बेहतर समझूँगा / मैं तैरना पसंद करूँगा''। क्रिया से पहले *лучше* पसंद को व्यक्त करता है।'
  ru.a1.unit30.lesson06.teach.nastya_zdorovo_do:
    title: नास्त्या बातचीत समाप्त करती है
    gloss: 'नास्त्या: बढ़िया! शनिवार को पार्क में मिलते हैं!'
    note: एक ही पंक्ति में इस इकाई की संदेश-बातचीत और खेल वाली इकाई की योजना, दोनों को पूरा करता है।
