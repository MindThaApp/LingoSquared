teaching:
  ru.a1.unit06.lesson01.teach.u_menya_est:
    title: У меня есть ...
    gloss: मेरे पास ... है
    note: 'शाब्दिक अर्थ: "मेरे पास (है)..." — रूसी में "मेरे पास है" कहने का यही सामान्य तरीका है। यूनिट 3 के У меня два брата में भी यही У меня ढाँचा था; जब वाक्य में गिनती बताई जाती है, तो есть प्रायः छोड़ दिया जाता है।'
  ru.a1.unit06.lesson01.teach.eto:
    title: Это ...
    gloss: यह ... है
    note: Это का प्रयोग किसी व्यक्ति या वस्तु का परिचय देने या उसकी ओर इशारा करने के लिए होता है, चाहे उसका व्याकरणिक लिंग कुछ भी हो।
  ru.a1.unit06.lesson01.teach.mat_otets:
    title: мать, отец
    gloss: माँ, पिता
    note: мать रूसी के उन थोड़े-से स्त्रीलिंग संज्ञा शब्दों में से है जो मृदु चिह्न (-ь) पर समाप्त होते हैं।
    example_gloss:
    - ये मेरी माँ हैं।
    - ये मेरे पिता हैं।
  ru.a1.unit06.lesson01.teach.brat_sestra:
    title: брат, сестра
    gloss: भाई, बहन
    note: брат वही शब्द है जिससे आपने यूनिट 3 में गिनती की थी ("У меня два брата"); сестра उसका स्त्रीलिंग रूप है।
    example_gloss:
    - यह मेरा भाई है।
    - मेरी एक बहन है।
  ru.a1.unit06.lesson01.teach.moy_moya:
    title: мой, моя
    gloss: मेरा (पुल्लिंग), मेरी (स्त्रीलिंग)
    note: мой पुल्लिंग संज्ञाओं के साथ आता है, जैसे отец और брат; моя स्त्रीलिंग संज्ञाओं के साथ आता है, जैसे мать और сестра।
  ru.a1.unit06.lesson02.teach.babushka_dedushka:
    title: бабушка, дедушка
    gloss: दादी/नानी, दादा/नाना
    note: 'दोनों शब्द -а पर समाप्त होते हैं, लेकिन дедушка पुरुष को दर्शाता है और मेल के लिए पुल्लिंग है: мой дедушка, पर моя бабушка।'
    example_gloss:
    - ये मेरी दादी/नानी हैं।
    - ये मेरे दादा/नाना हैं।
  ru.a1.unit06.lesson02.teach.muzh_zhena:
    title: муж, жена
    gloss: पति, पत्नी
    note: муж पुल्लिंग है और жена स्त्रीलिंग है, जो लिंग के सामान्य अंत-नियम के अनुसार है।
    example_gloss:
    - यह मेरे पति हैं।
    - यह मेरी पत्नी है।
  ru.a1.unit06.lesson02.teach.syn_doch:
    title: сын, дочь
    gloss: बेटा, बेटी
    note: дочь भी мать की तरह मृदु चिह्न (-ь) पर समाप्त होने वाली स्त्रीलिंग संज्ञा है।
    example_gloss: मेरा एक बेटा और एक बेटी है।
  ru.a1.unit06.lesson02.teach.deti:
    title: дети
    gloss: बच्चे
    note: дети शब्द ребёнок ("बच्चा") का अनियमित बहुवचन है — एकवचन और बहुवचन बिलकुल अलग शब्द हैं।
    example_gloss: क्या आपके बच्चे हैं?
  ru.a1.unit06.lesson02.teach.u_vas_est:
    title: У вас есть ...?
    gloss: क्या आपके पास ... है? (औपचारिक)
    note: इसमें औपचारिक вас का प्रयोग है, जो यूनिट 2 के вы वाले रूप से मेल खाता है।
  ru.a1.unit06.lesson03.teach.kto_eto:
    title: Кто это?
    gloss: यह कौन है?
    note: यह पूछने का सामान्य तरीका है कि कोई कौन है, जैसे फ़ोटो देखते समय।
  ru.a1.unit06.lesson03.teach.eyo_zovut:
    title: Её зовут Анна.
    gloss: उसका नाम अन्ना है।
    note: 'शाब्दिक अर्थ: "लोग उसे अन्ना बुलाते हैं" — Её ("उसे") क्रिया зовут का कर्म है, कर्ता नहीं।'
  ru.a1.unit06.lesson03.teach.maksim_kto_eto:
    title: मक्सिम फ़ोटो के बारे में पूछता है
    gloss: 'मक्सिम: फ़ोटो में यह कौन है?'
    note: मक्सिम फ़ोटो की ओर इशारा करके Кто это на фото? पूछते हुए बात शुरू करता है।
  ru.a1.unit06.lesson03.teach.olga_moya_semya:
    title: ओल्गा अपने परिवार का परिचय देती है
    gloss: 'ओल्गा: यह मेरा परिवार है।'
    note: Это моя семья में семья ("परिवार") स्त्रीलिंग संज्ञा है, इसलिए उसके साथ моя आता है।
  ru.a1.unit06.lesson03.teach.olga_vot_otets:
    title: ओल्गा तीन परिजनों के नाम बताती है
    gloss: 'ओल्गा: ये रहे मेरे पिता, मेरी माँ और मेरा भाई।'
    note: Вот ("यह रहा/ये रहे") सूची की शुरुआत करता है; हर अधिकारसूचक शब्द (мой/моя) अपने बाद आने वाली संज्ञा के अनुसार बदलता है।
  ru.a1.unit06.lesson03.teach.maksim_a_kto_devochka:
    title: मक्सिम लड़की के बारे में पूछता है
    gloss: 'मक्सिम: और वह लड़की कौन है?'
    note: А से मक्सिम फ़ोटो के चौथे व्यक्ति के बारे में अपना अगला सवाल सहजता से जोड़ता है।
  ru.a1.unit06.lesson03.teach.olga_eto_moya_doch:
    title: ओल्गा अपनी बेटी का नाम बताती है
    gloss: 'ओल्गा: यह मेरी बेटी है। उसका नाम अन्ना है।'
    note: ओल्गा моя дочь कहकर उत्तर देती है और फिर Её зовут Анна से नाम बताती है।
