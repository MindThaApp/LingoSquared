    gloss: नीना भाषा कैफ़े में नई है। वह दीमा से पूछती है कि बाकी लोग कैसे हैं। दीमा बताता है। नास्त्या दयालु और धैर्यवान है; वह नर्स का काम करती है। इगोर मज़ेदार है और स्पेनिश भाषा का कोर्स कर रहा है। लेना जिज्ञासु है; उसे नई चीज़ें जानना पसंद है। खुद दीमा शांत स्वभाव का है।
