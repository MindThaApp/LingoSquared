teaching:
  ru.a1.unit27.lesson01.teach.zhivotnoe_domashnee_zhivotnoe:
    title: जानवर, पालतू जानवर
    gloss: जानवर / पालतू जानवर
    note: '*Животное* जानवर के लिए सामान्य शब्द है। *Домашнее животное* (शाब्दिक अर्थ ''घरेलू जानवर'') विशेष रूप से पालतू जानवर को कहते हैं।'
    example_gloss:
    - कुत्ता एक जानवर है।
    - कुत्ता एक पालतू जानवर भी है।
  ru.a1.unit27.lesson01.teach.sobaka_koshka:
    title: कुत्ता और बिल्ली
    gloss: कुत्ता / बिल्ली
    example_gloss:
    - नास्त्या के पास एक कुत्ता है।
    - इगोर के पास एक बिल्ली है।
  ru.a1.unit27.lesson01.teach.ryba_ptitsa:
    title: मछली और पक्षी
    gloss: मछली / पक्षी
    example_gloss:
    - दादाजी के पास एक मछली है।
    - Nina के पास एक पक्षी है।
  ru.a1.unit27.lesson01.teach.u_tebya_est:
    title: क्या आपके पास कोई पालतू जानवर है?
    gloss: क्या आपके पास कोई पालतू जानवर है?
    note: '*У тебя есть ...?* ''क्या तुम्हारे पास ... है?'' पूछने का रूप है: *у тебя* (''तुम्हारे पास'') + *есть* + वह चीज़।'
  ru.a1.unit27.lesson01.teach.da_u_menya:
    title: हाँ, मेरे पास एक कुत्ता है
    gloss: हाँ, मेरे पास एक कुत्ता है।
    note: इस यूनिट की नई शब्दावली के साथ एक सरल सकारात्मक उत्तर।
  ru.a1.unit27.lesson01.teach.net_u_menya:
    title: नहीं, मेरे पास कोई पालतू जानवर नहीं है
    gloss: नहीं, मेरे पास कोई पालतू जानवर नहीं है।
    note: '*Нет* + संबंध कारक (родительный) बताता है कि आपके पास कुछ नहीं है: *у меня нет домашнего животного*। व्याकरण नोट देखिए।'
  ru.a1.unit27.lesson01.teach.posle_net_slovo:
    title: Нет के साथ संबंध कारक
    gloss: '*нет* के बाद जो चीज़ नहीं है, वह संबंध कारक (родительный) में आती है: *у меня нет времени*, *у меня нет домашнего животного*।'
    note: 'सकारात्मक वाक्य से तुलना कीजिए: *у меня есть собака* (प्रथमा, именительный), पर *у меня нет собаки* (संबंध कारक, родительный)।'
  ru.a1.unit27.lesson02.teach.gulyat_s_sobakoy:
    title: (जानवर को) टहलाने ले जाना
    gloss: (जानवर को) टहलाने ले जाना
    note: '*Гулять с собакой* में *с* के साथ करण कारक (творительный) *собакой* आता है। व्याकरण नोट देखिए।'
    example_gloss: मैं रोज़ कुत्ते को टहलाने ले जाता हूँ।
  ru.a1.unit27.lesson02.teach.posle_s_slovo:
    title: С के साथ करण कारक
    gloss: '*с* (के साथ) के बाद संज्ञा करण कारक (творительный) में आती है: *гулять с собакой*, *играть с кошкой*।'
    note: 'स्त्रीलिंग संज्ञाओं का करण कारक *-ой* या *-ей* पर समाप्त होता है: *собакой*, *кошкой*।'
  ru.a1.unit27.lesson02.teach.kormit:
    title: खाना खिलाना
    gloss: खाना खिलाना
    example_gloss: मैं रोज़ बिल्ली को खाना खिलाता हूँ।
  ru.a1.unit27.lesson02.teach.igrat_s:
    title: के साथ खेलना
    gloss: के साथ खेलना
    example_gloss: इगोर अपनी बिल्ली के साथ खेलता है।
  ru.a1.unit27.lesson02.teach.ya_kazhdyy_den:
    title: मैं रोज़ कुत्ते को टहलाने ले जाता हूँ
    gloss: मैं रोज़ कुत्ते को टहलाने ले जाता हूँ।
    note: '*Каждый день* (हर दिन) समय बताने वाला पद है, जिसके साथ कोई पूर्वसर्ग नहीं आता: *Я каждый день гуляю с собакой*।'
  ru.a1.unit27.lesson02.teach.ya_kazhdyy_den_2:
    title: मैं रोज़ बिल्ली को खाना खिलाता हूँ
    gloss: मैं रोज़ बिल्ली को खाना खिलाता हूँ।
    note: '*Кормить* के साथ जानवर कर्म कारक (винительный) में प्रत्यक्ष कर्म बनकर आता है: *кошка* बदलकर *кошку* हो जाता है।'
  ru.a1.unit27.lesson03.teach.posle_lyubit_zhivotnoe:
    title: любить के बाद जानवर
    gloss: '*любить* के बाद जानवर की संज्ञा कर्म कारक (винительный) में आती है, जो सजीव संज्ञाओं के बहुवचन में संबंध कारक (родительный) के समान होता है: *собак*, *кошек*, *птиц*, *рыб*।'
    note: रूसी बहुवचन का नियमित रूप, जो यहाँ पहली बार जानवरों की संज्ञाओं के उदाहरण से सिखाया गया है।
  ru.a1.unit27.lesson03.teach.sobak_koshek:
    title: कुत्ते और बिल्लियाँ
    gloss: कुत्ते / बिल्लियाँ
    example_gloss:
    - दीमा को कुत्ते पसंद हैं।
    - Lena को बिल्लियों से प्यार है।
  ru.a1.unit27.lesson03.teach.ryb_ptits:
    title: मछलियाँ और पक्षी (बहुवचन)
    gloss: मछलियाँ / पक्षी
    example_gloss:
    - मुझे मछलियाँ बहुत पसंद हैं।
    - दादाजी को पक्षी बहुत पसंद हैं।
  ru.a1.unit27.lesson03.teach.ya_lyublyu_zhivotnykh:
    title: मुझे जानवर बहुत पसंद हैं
    gloss: मुझे जानवर बहुत पसंद हैं।
    note: '*Люблю* + कर्म कारक: *Я люблю животных*। सजीव बहुवचन संज्ञाओं में कर्म कारक संबंध कारक जैसा दिखता है।'
  ru.a1.unit27.lesson03.teach.lena_lyubit_koshek:
    title: Lena को बिल्लियाँ प्यारी हैं, पर उसके पास पालतू जानवर नहीं है
    gloss: Lena को बिल्लियों से प्यार है, लेकिन उसके पास कोई पालतू जानवर नहीं है।
    note: यह उस विरोधाभास की भूमिका बनाता है जिस पर इस यूनिट का पठन-अंश आधारित है।
  ru.a1.unit27.lesson04.teach.dima_u_tebya:
    title: दीमा पालतू जानवर के बारे में पूछता है
    gloss: 'दीमा: नास्त्या, क्या तुम्हारे पास कोई पालतू जानवर है?'
  ru.a1.unit27.lesson04.teach.nastya_da_u:
    title: नास्त्या के पास एक कुत्ता है
    gloss: 'नास्त्या: हाँ, मेरे पास एक कुत्ता है।'
  ru.a1.unit27.lesson04.teach.dima_kak_on:
    title: दीमा पूछता है कि वह कैसा दिखता है
    gloss: 'दीमा: वह कैसा दिखता है?'
    note: प्रश्न *Как он выглядит?* जानवरों के लिए भी चलता है। नर पालतू जानवर के लिए *он* (वह) का प्रयोग होता है।
  ru.a1.unit27.lesson04.teach.nastya_u_nego:
    title: नास्त्या अपने कुत्ते का वर्णन करती है
    gloss: 'नास्त्या: उसके भूरे बाल हैं और वह छोटा है।'
    note: बालों के रंग और आकार की शब्दावली रूप-रंग वाली यूनिट से दोहराई गई है, अब किसी व्यक्ति के बालों की जगह जानवर के रोएँ के लिए।
  ru.a1.unit27.lesson04.teach.o_zhivotnom_mozhno:
    title: जानवरों के लिए Он और она
    gloss: 'पालतू जानवर के लिए इंसान की तरह *он* या *она* कहा जा सकता है: *У меня собака, он маленький*।'
    note: व्याकरण की दृष्टि से *собака* स्त्रीलिंग है, पर जब पता हो कि पालतू जानवर नर है, तो रूसी लोग अक्सर *он* कहते हैं।
  ru.a1.unit27.lesson04.teach.dima_ty_gulyaesh:
    title: दीमा सैर के बारे में पूछता है
    gloss: 'दीमा: क्या तुम उसे हर दिन टहलाने ले जाती हो?'
  ru.a1.unit27.lesson04.teach.nastya_da_ya:
    title: नास्त्या अपनी दिनचर्या बताती है
    gloss: 'नास्त्या: हाँ, मैं हर दिन उसे टहलाने ले जाती हूँ और उसे खाना खिलाती हूँ।'
  ru.a1.unit27.lesson05.teach.dima_i_lena:
    title: जानवरों के बारे में दीमा, लेना और इगोर
    gloss: 'दीमा और लेना दोनों को जानवर पसंद हैं, लेकिन दोनों के पास कोई पालतू जानवर नहीं है। दीमा को कुत्ते पसंद हैं और लेना को बिल्लियाँ। लेकिन इगोर के पास पालतू जानवर है: एक बिल्ली। वह अक्सर अपनी बिल्ली के साथ खेलता है और हर दिन उसे खाना देता है। क्या आपके पास कोई पालतू जानवर है?'
    note: किसी जानवर को पसंद करने और सच में उसे पालने का फ़र्क़ दिखाता है -- यही इस यूनिट के संवाद-लक्ष्य की मूल बात है।
    glosses:
      любят: बहुत पसंद है
      оба: दोनों
      животных: जानवर
      обоих: दोनों
      домашнего: पालतू जानवर
      собак: कुत्ते
      кошек: बिल्लियाँ
      кошка: बिल्ली
      играет: खेलता है
      даёт: देता है
      каждый: हर
      корм: खाना
  ru.a1.unit27.lesson05.teach.igor_chasto_igraet:
    title: इगोर अक्सर अपनी बिल्ली के साथ खेलता है
    gloss: इगोर अक्सर अपनी बिल्ली के साथ खेलता है।
    note: '*Со своей кошкой*: कई व्यंजनों के समूह से पहले *с* की जगह *со* आता है, और *своей* का अर्थ है ''अपनी'', जो वाक्य के कर्ता की ओर संकेत करता है।'
  ru.a1.unit27.lesson05.teach.ya_lyublyu_sobak:
    title: मुझे कुत्ते बहुत पसंद हैं। मेरे पास कोई पालतू जानवर नहीं है।
    gloss: मुझे कुत्ते बहुत पसंद हैं। मेरे पास कोई पालतू जानवर नहीं है।
    note: दो वाक्यों का एक आदर्श उत्तर, जिसे इस यूनिट के लेखन-अभ्यास में दोहराया जा सकता है।
  ru.a1.unit27.lesson06.teach.nastya_nina_u:
    title: नास्त्या नीना से पूछती है
    gloss: 'नास्त्या: नीना, क्या तुम्हारे पास भी कोई पालतू जानवर है?'
  ru.a1.unit27.lesson06.teach.nina_da_u:
    title: Nina के पास Pico नाम का पक्षी है
    gloss: 'Nina: हाँ, मेरे पास एक पक्षी है। उसका नाम Pico है।'
    note: '*Его зовут Пико* का शाब्दिक अर्थ है ''लोग उसे पीको बुलाते हैं''। रूसी में नाम इसी तरह बताया जाता है।'
  ru.a1.unit27.lesson06.teach.dima_kak_zdorovo:
    title: दीमा प्रतिक्रिया देता है
    gloss: 'दीमा: कितना अच्छा! तुम हर दिन उसके साथ क्या करती हो?'
  ru.a1.unit27.lesson06.teach.nina_ya_kazhdyy:
    title: Nina रोज़ उसे खाना खिलाती है
    gloss: 'Nina: मैं रोज़ उसे खाना खिलाती हूँ।'
  ru.a1.unit27.lesson06.teach.dima_ya_tozhe:
    title: दीमा को भी पक्षी पसंद हैं
    gloss: 'दीमा: मुझे भी पक्षी पसंद हैं।'
  ru.a1.unit27.lesson06.teach.nastya_kak_khorosho:
    title: नास्त्या बातचीत समाप्त करती है
    gloss: 'नास्त्या: कितना अच्छा है कि हम तीनों को जानवर पसंद हैं!'
    note: इस यूनिट में तीनों पात्रों के जानवरों से जुड़े तथ्यों को एक साथ समेटता है।
