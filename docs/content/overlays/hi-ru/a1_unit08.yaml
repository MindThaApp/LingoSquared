    title: विक्रेता हाँ कहता है
    gloss: 'विक्रेता: हाँ, हैं।'
    note: Да, есть रोज़मर्रा का छोटा जवाब है — शब्दशः "हाँ, है/हैं" — जिसमें चीज़ का नाम दोहराना नहीं पड़ता।
