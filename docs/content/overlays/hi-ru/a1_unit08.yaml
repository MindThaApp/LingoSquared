  ru.a1.unit08.lesson03.teach.pokupatel_pomidory:
    title: ग्राहक टमाटर के बारे में पूछता है
    gloss: 'ग्राहक: क्या आपके पास टमाटर हैं?'
    note: ग्राहक विनम्र У вас есть ...? वाले प्रश्न से शुरुआत करता है।
