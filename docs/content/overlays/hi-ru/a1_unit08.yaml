    note: Двести का अर्थ है "दो सौ"; сто की तरह इसके बाद भी बहुवचन संबंध कारक рублей आता है।
  ru.a1.unit08.lesson03.teach.pokupatel_dayte_kilogramm:
    title: ग्राहक एक किलो खरीदता है
    gloss: 'ग्राहक: एक किलो सेब दीजिए, कृपया।'
    note: Дайте ..., пожалуйста पाठ 2 से, अब килограмм яблок ("एक किलोग्राम सेब") के साथ।
  ru.a1.unit08.lesson03.teach.prodavets_khorosho:
    title: विक्रेता सामान थमाता है
