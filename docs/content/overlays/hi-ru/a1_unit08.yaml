    example_gloss: रोटी सौ रूबल की है।
  ru.a1.unit08.lesson01.teach.khleb_moloko:
    title: хлеб, молоко
    gloss: रोटी, दूध
    note: хлеб पुल्लिंग है और молоко नपुंसकलिंग -- दोनों रोज़मर्रा के आम किराने के सामान हैं।
    example_gloss:
    - रोटी कितने की है?
    - दूध कितने का है?
  ru.a1.unit08.lesson02.teach.dayte_pozhaluysta:
    title: Дайте, пожалуйста, ...
    gloss: कृपया मुझे ... दीजिए
