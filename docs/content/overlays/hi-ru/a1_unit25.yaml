teaching:
  ru.a1.unit25.lesson01.teach.chitat_zanimatsya_sportom:
    title: पढ़ना, कसरत करना, खाना बनाना
    gloss: पढ़ना, कसरत/खेलकूद करना, खाना पकाना
    note: 'तीन आम शौक़ वाली क्रियाएँ: *читать* (पढ़ना), *заниматься спортом* (कसरत करना या खेलकूद करना) और *готовить* (खाना बनाना)।'
    example_gloss:
    - मुझे किताब पढ़ना पसंद है।
    - मैं शनिवार को कसरत करता हूँ।
    - मुझे दोस्तों के लिए खाना बनाना पसंद है।
  ru.a1.unit25.lesson01.teach.svobodnoe_vremya:
    title: ख़ाली समय
    gloss: ख़ाली समय
    note: '*Свободное время* शौक़ों के बारे में बात करने का मुख्य वाक्यांश है। विशेषण *свободное* का अंत *-ое* होता है, क्योंकि वह *время* के अनुसार चलता है।'
    example_gloss: ख़ाली समय में मुझे पढ़ना पसंद है।
  ru.a1.unit25.lesson01.teach.v_svobodnoe_vremya:
    title: ख़ाली समय में क्या करते हैं, यह बताना
    gloss: ख़ाली समय में मुझे पढ़ना पसंद है।
    note: '*Люблю*, *любить* (पसंद करना, प्यार करना) का *я* वाला रूप है। इसके बाद दूसरी क्रिया मूल रूप (मूल रूप) में रहती है: *люблю читать*।'
  ru.a1.unit25.lesson02.teach.slushat_muzyku_risovat:
    title: संगीत, चित्रकारी, वीडियो गेम
    gloss: संगीत सुनना, चित्र बनाना, वीडियो गेम खेलना
    note: 'तीन और शौक़: *слушать музыку* (संगीत सुनना), *рисовать* (चित्र बनाना) और *играть в игры* (वीडियो गेम खेलना)।'
    example_gloss:
    - मुझे संगीत सुनना पसंद है।
    - मैं अक्सर चित्र बनाता/बनाती हूँ।
    - मुझे दोस्तों के साथ वीडियो गेम खेलना पसंद है।
  ru.a1.unit25.lesson02.teach.ya_lyublyu_slushat:
    title: कहना कि आपको संगीत सुनना पसंद है
    gloss: मुझे संगीत सुनना पसंद है।
    note: '*Слушать* के साथ कर्म सीधे आता है: *музыку*, *музыка* का कर्म कारक (कर्म कारक) रूप है, जिसमें अंत *-у* होता है।'
  ru.a1.unit25.lesson02.teach.ya_lyublyu_igrat:
    title: कहना कि आपको दोस्तों के साथ वीडियो गेम खेलना पसंद है
    gloss: मुझे दोस्तों के साथ वीडियो गेम खेलना पसंद है।
    note: '*С друзьями* (दोस्तों के साथ): पूर्वसर्ग *с* के बाद करण कारक (करण कारक) आता है, इसलिए *друзьями*।'
  ru.a1.unit25.lesson03.teach.vsegda_chasto_inogda:
    title: हमेशा, अक्सर, कभी-कभी, कभी नहीं
    gloss: हमेशा, अक्सर, कभी-कभी, कभी नहीं
    note: 'आवृत्ति बताने वाले चार मुख्य क्रियाविशेषण: *всегда*, *часто*, *иногда*, *никогда*। इनका रूप कभी नहीं बदलता।'
    example_gloss:
    - मैं हर शनिवार हमेशा कसरत करता/करती हूँ।
    - मैं अक्सर कोई किताब पढ़ता/पढ़ती हूँ।
    - मैं कभी-कभी चित्र बनाता/बनाती हूँ।
    - मैं कभी वीडियो गेम नहीं खेलता/खेलती।
  ru.a1.unit25.lesson03.teach.kazhduyu_nedelyu_kazhdye:
    title: हर हफ़्ते, हर सप्ताहांत
    gloss: हर हफ़्ते, हर सप्ताहांत
    note: '*Каждую неделю* और *каждые выходные* दोनों का अर्थ "हर" है, पर अंत संज्ञा के अनुसार बदलता है: अगला कार्ड देखिए।'
    example_gloss:
    - मैं हर हफ़्ते दोस्तों के लिए खाना बनाता/बनाती हूँ।
    - मैं हर सप्ताहांत कसरत करता/करती हूँ।
  ru.a1.unit25.lesson03.teach.nedelya_zhenskogo_roda:
    title: '"हर": स्त्रीलिंग और बहुवचन'
    gloss: '*Неделя* स्त्रीलिंग है, इसलिए *каждую неделю* आता है। *Выходные* बहुवचन है, इसलिए *каждые выходные* आता है।'
    note: '*Каждый* किसी भी विशेषण की तरह अपनी संज्ञा के अनुसार बदलता है: *каждый день* (पुल्लिंग), *каждую неделю* (स्त्रीलिंग, कर्म कारक), *каждые выходные* (बहुवचन)।'
  ru.a1.unit25.lesson03.teach.chto_ty_delaesh:
    title: खाली समय के बारे में पूछना
    gloss: आप अपने खाली समय में क्या करते हैं?
    note: यह इस इकाई का मुख्य प्रश्न है -- किसी से भी उसके शौक़ पूछने के लिए इसका इस्तेमाल कीजिए।
  ru.a1.unit25.lesson04.teach.nastya_my_chasto:
    title: नास्त्या शौक़ों की बात छेड़ती है
    gloss: 'नास्त्या: हम अक्सर साथ टहलते हैं। और दीमा, तुम खाली समय में और क्या करते हो?'
    note: '*Мы часто гуляем вместе*: *мы* (हम) के साथ क्रिया का अंत *-ем* होता है, और *гулять* का अर्थ है मन बहलाने के लिए टहलना।'
  ru.a1.unit25.lesson04.teach.dima_ya_lyublyu:
    title: दीमा के शौक़
    gloss: 'दीमा: मुझे खाना बनाना पसंद है, घर पर भी। और मैं अक्सर खेलकूद भी करता हूँ।'
    note: '*И дома тоже* (घर पर भी): *и ... тоже* दिखाता है कि दीमा शौक़ से खाना बनाता है, सिर्फ़ काम के लिए नहीं।'
  ru.a1.unit25.lesson04.teach.nastya_ty_i:
    title: नास्त्या हैरान है
    gloss: 'नास्त्या: तुम घर पर भी खाना बनाते हो? तुम तो पूरे दिन काम पर खाना बनाते ही हो!'
    note: '*Весь день* (पूरा दिन) इस बात पर ज़ोर देता है कि दीमा काम पर पहले ही कितना खाना बनाता है। *Весь* पुल्लिंग *день* के अनुसार आता है।'
  ru.a1.unit25.lesson04.teach.dima_da_no:
    title: दीमा समझाता है
    gloss: 'दीमा: हाँ, पर खाना बनाने से मुझे आराम मिलता है। और तुम, तुम्हें क्या करना पसंद है?'
    note: '*Готовить меня расслабляет* में गतिविधि पहले आती है: शब्दशः ''खाना बनाना मुझे आराम देता है'', जहाँ *меня* कर्म कारक (कर्म कारक) में है।'
  ru.a1.unit25.lesson04.teach.nastya_ya_lyublyu:
    title: नास्त्या के शौक
    gloss: 'नास्त्या: मुझे पढ़ना पसंद है और मैं अक्सर संगीत सुनती हूँ।'
    note: 'पिछले पाठों की दो शौक वाली क्रियाएँ *и* (और) से जुड़ी हैं: *люблю читать и часто слушаю музыку*।'
  ru.a1.unit25.lesson04.teach.dima_ty_tozhe:
    title: दीमा गेम खेलने के बारे में पूछता है
    gloss: 'दीमा: क्या तुम भी गेम खेलती हो?'
    note: 'हाँ/नहीं वाला छोटा प्रश्न: रूसी में शब्द-क्रम वही रहता है, बस स्वर ऊँचा उठता है: *Ты тоже играешь в игры?*'
  ru.a1.unit25.lesson04.teach.nastya_net_ya:
    title: नास्त्या जवाब देती है
    gloss: 'नास्त्या: नहीं, मैं कभी गेम नहीं खेलती। पर कभी-कभी चित्र बनाती हूँ!'
    note: '*Никогда не* (कभी नहीं) में क्रिया से पहले अतिरिक्त *не* ज़रूरी है। *Иногда* (कभी-कभी) उसका विपरीत है।'
  ru.a1.unit25.lesson05.teach.my_s_dimoy:
    title: शौक़ों की तुलना
    gloss: दीमा और मैं अक्सर साथ टहलते हैं। पर हमारे और भी शौक हैं। दीमा को खाना बनाना पसंद है, घर पर भी, और वह अक्सर खेल-कसरत करता है। मुझे पढ़ना पसंद है और मैं अक्सर संगीत सुनती हूँ। मैं कभी-कभी चित्र बनाती हूँ, पर कभी गेम नहीं खेलती। तुम खाली समय में क्या करना पसंद करते हो?
    note: नास्त्या का संदेश पिछले पाठों की बातें दोहराता है और अंत में पाठ का मुख्य प्रश्न पढ़ने वाले से पूछता है।
    glosses:
      гуляем: टहलना
      часто: अक्सर
      вместе: साथ में
      другие: दूसरे
      готовить: खाना बनाता है
      любит: पसंद है
      дома: घर पर
      занимается: कसरत करता है
      читать: पढ़ना
      слушаю: सुनना
      музыку: संगीत
      рисую: चित्र बनाती हूँ
      иногда: कभी-कभी
      играю: वीडियो गेम खेलना
      никогда: कभी नहीं
      свободное: खाली
      время: समय
  ru.a1.unit25.lesson06.teach.dima_chto_ty:
    title: दीमा सप्ताहांत के बारे में पूछता है
    gloss: 'दीमा: इस सप्ताहांत तुम क्या कर रही हो?'
    note: '*В эти выходные* (इस सप्ताहांत): *выходные* बहुवचन है, इसलिए *эти* भी बहुवचन है, और समय बताने वाला *в* कर्म कारक (कर्म कारक) लेता है।'
  ru.a1.unit25.lesson06.teach.nastya_poka_ne:
    title: नास्त्या अभी तय नहीं कर पाई
    gloss: 'नास्त्या: अभी पता नहीं। मुझे पढ़ना पसंद है, पर बाहर भी जाना चाहती हूँ।'
    note: '*Хочу ещё выйти на улицу* का अर्थ है ''मैं बाहर भी जाना चाहती हूँ''। *Хочу*, *хотеть* का *я* वाला रूप है।'
  ru.a1.unit25.lesson06.teach.dima_davay_pogulyaem:
    title: दीमा योजना सुझाता है
    gloss: 'दीमा: चलो साथ टहलें? उसके बाद मैं हमारे लिए खाना बनाऊँगा।'
    note: '*Давай погуляем* साथ कुछ करने का प्रस्ताव रखने का आम तरीका है, और *потом* (उसके बाद) अगला कदम क्रम में रखता है।'
  ru.a1.unit25.lesson06.teach.nastya_khoroshaya_ideya:
    title: नास्त्या सहमत होती है
    gloss: 'नास्त्या: अच्छा विचार है! मुझे टहलना भी पसंद है और खाना बनाना भी।'
    note: '*Мне нравится* का शब्दशः अर्थ है ''मुझे अच्छा लगता है'': पसंद करने वाला व्यक्ति संप्रदान कारक (संप्रदान कारक, *мне*) में होता है और पसंद की चीज़ उसके बाद आती है।'
  ru.a1.unit25.lesson06.teach.dima_otlichno_togda:
    title: दीमा पक्का करता है
    gloss: 'दीमा: बहुत बढ़िया। तो फिर शनिवार को मिलते हैं!'
    note: '*Увидимся в субботу* (शनिवार को मिलते हैं): सप्ताह के दिन के साथ *в* कर्म कारक (कर्म कारक) लेता है, इसलिए *суббота* बदलकर *субботу* हो जाता है।'
