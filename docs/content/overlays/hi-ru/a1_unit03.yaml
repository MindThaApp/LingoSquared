    note: книги भी брата की तरह संबंध कारक के एकवचन का रूप है, जो два, три और четыре के बाद आता है।
    example_gloss: मेरे पास तीन किताबें हैं।
  ru.a1.unit03.lesson01.teach.rubl_rubley:
