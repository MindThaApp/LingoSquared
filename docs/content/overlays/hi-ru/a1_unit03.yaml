    note: рублей संबंध कारक का बहुवचन रूप है, जो пять ("पाँच") से आगे इस्तेमाल होता है।
    example_gloss: मेरे पास पाँच रुबल हैं।
  ru.a1.unit03.lesson02.teach.shest_sem:
