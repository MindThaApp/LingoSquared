  ru.a1.unit03.lesson01.teach.u_menya:
    title: У меня ...
    gloss: मेरे पास ...
    note: शब्दशः "मेरे पास (है) ..." — रूसी में "मेरे पास ... है" कहने का यही मानक तरीका है; इसमें "रखना" जैसी कोई क्रिया नहीं होती।
  ru.a1.unit03.lesson01.teach.odin_dva:
    title: один, два
    gloss: एक, दो
    note: два ("दो") के बाद संज्ञा संबंध कारक के विशेष एकवचन रूप में आती है — брат ("भाई") का रूप брата हो जाता है, बहुवचन नहीं होता।
    example_gloss:
    - मेरा एक भाई है।
    - मेरे दो भाई हैं।
  ru.a1.unit03.lesson01.teach.tri_chetyre:
    title: три, четыре
    gloss: तीन, चार
    note: Три और четыре भी два की तरह संबंध कारक के एकवचन रूप के साथ आते हैं — два/три/четыре में से किसी के बाद книга ("किताब") का रूप книги हो जाता है।
    example_gloss:
    - मेरे पास तीन किताबें हैं।
    - मेरे पास चार किताबें हैं।
  ru.a1.unit03.lesson01.teach.pyat:
    title: пять
    gloss: पाँच
    note: пять ("पाँच") से आगे संज्ञा संबंध कारक के बहुवचन रूप में आती है — рубль ("रुबल") का रूप рублей हो जाता है, рубли नहीं।
    example_gloss: मेरे पास पाँच रुबल हैं।
  ru.a1.unit03.lesson01.teach.brat_bratya:
    title: брат, брата
    gloss: भाई; भाई (बहुवचन, 2–4 के बाद)
    note: брата संबंध कारक का एकवचन रूप है, जो विशेष रूप से два, три और четыре के बाद आता है — यह सामान्य बहुवचन नहीं है।
    example_gloss: मेरे दो भाई हैं।
  ru.a1.unit03.lesson01.teach.kniga_knigi:
