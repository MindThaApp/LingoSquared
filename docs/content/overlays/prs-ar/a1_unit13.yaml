teaching:
  ar.a1.unit13.lesson01.teach.yesterday:
    title: دیروز
    gloss: دیروز
    note: أمس (ams) یعنی دیروز. با فعل زمان گذشته مثل ذهبت می‌آید و می‌تواند آخر یا اول جمله بیاید.
    example_gloss: دیروز به بازار رفتم.
  ar.a1.unit13.lesson01.teach.went:
    title: رفتم
    gloss: رفتم
    note: 'ذهبت (dhahabtu) یعنی رفتم: ختم -tu در زمان گذشته «من» را نشان می‌دهد. بدون حرکت‌ها همین حرف‌ها را می‌شود dhahabta / dhahabti (رفتی، برای مرد / برای زن) یا dhahabat (او رفت) هم خواند؛ از متن معلوم می‌شود.'
    example_gloss: به بازار رفتم.
  ar.a1.unit13.lesson01.teach.bought:
    title: خریدم
    gloss: خریدم
    note: اشتريت (ishtaraytu) یعنی خریدم؛ مثل ذهبت، برای «من» به -tu ختم می‌شود.
    example_gloss: سیب خریدم.
  ar.a1.unit13.lesson01.teach.apples_object:
    title: سیب
    gloss: سیب
    note: تفاحا (tuffāḥan) همان تفاح (سیب، از بخش خرید) است به حیث مفعول فعل؛ ا اضافه ختم -an را می‌نویسد.
    example_gloss: سیب خریدم.
  ar.a1.unit13.lesson02.teach.what_did:
    title: دیروز چه کار کردی؟
    gloss: دیروز چه کار کردید؟
    note: 'ماذا (mādhā) یعنی چه؛ فعلت اینجا یعنی کردی: faʿalta برای مرد، faʿalti برای زن (شکل نوشتاری یکی است). یوسف از لیلا می‌پرسد، پس faʿalti می‌گوید.'
    example_gloss: 'یوسف گفت: دیروز چه کار کردی؟'
  ar.a1.unit13.lesson02.teach.drank:
    title: نوشیدم
    gloss: نوشیدم
    note: شربت (sharibtu) یعنی نوشیدم؛ مثل ذهبت و اشتريت ختم -tu (من) دارد.
    example_gloss: قهوه نوشیدم.
  ar.a1.unit13.lesson02.teach.event_sequence:
    title: ترتیب یک اتفاق تازه
    gloss: به بازار رفتم. سیب خریدم. قهوه نوشیدم.
    note: چند جملهٔ کوتاه گذشته پشت هم می‌گوید که چه کار کرده‌اید. هر فعل برای «من» به -tu ختم می‌شود.
    example_gloss: دیروز به بازار رفتم. سیب خریدم. قهوه نوشیدم.
  ar.a1.unit13.lesson02.teach.line01:
    title: دربارهٔ دیروز پرسیدن
    gloss: یوسف می‌پرسد که لیلا دیروز چه کار کرد.
    note: یوسف از لیلا که یک زن است می‌پرسد، پس فعلت اینجا faʿalti خوانده می‌شود؛ برای مرد faʿalta است.
    example_gloss: 'یوسف گفت: دیروز چه کار کردی؟'
  ar.a1.unit13.lesson02.teach.line02:
    title: رفتن به بازار
    gloss: لیلا می‌گوید که به بازار رفت.
    note: ذهبت حرکت تمام‌شده را نشان می‌دهد.
    example_gloss: 'لیلا گفت: به بازار رفتم.'
  ar.a1.unit13.lesson02.teach.line03:
    title: سیب خریدن
    gloss: لیلا می‌گوید که سیب خرید.
    note: این یک کار تمام‌شدهٔ دوم را اضافه می‌کند.
    example_gloss: 'لیلا گفت: سیب خریدم.'
  ar.a1.unit13.lesson02.teach.line04:
    title: قهوه نوشیدن
    gloss: لیلا می‌گوید که قهوه نوشید.
    note: این گزارش کوتاه اتفاق را تمام می‌کند.
    example_gloss: 'لیلا گفت: قهوه نوشیدم.'
