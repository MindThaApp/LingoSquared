    title: میتانم پرداخت کنم؟
    gloss: آیا می‌توانم با کارت پرداخت کنم؟
    note: هل أستطيع (hal astaṭīʿ) یعنی «آیا می‌توانم»؛ الدفع (ad-dafʿ) یعنی پرداخت کردن.
    example_gloss: آیا می‌توانم نقد پرداخت کنم؟
  ar.a1.unit24.lesson02.teach.line01:
    title: پرسیدن مبلغ
    gloss: لیلا مبلغ را می‌پرسد.
    note: كم می‌پرسد «چقدر».
    example_gloss: 'لیلا گفت: مبلغ چند است؟'
  ar.a1.unit24.lesson02.teach.line02:
    title: گفتن مبلغ
    gloss: دوکاندار می‌گوید مبلغ ده درهم است.
    note: دراهم (darāhim) کلمهٔ واحد پول از درس خرید است.
    example_gloss: 'دوکاندار گفت: مبلغ ده درهم است.'
  ar.a1.unit24.lesson02.teach.line03:
    title: پرسیدن پرداخت با کارت
    gloss: لیلا می‌پرسد که می‌تواند با کارت پرداخت کند یا نه.
    note: این جمله دربارهٔ روش پرداخت قبول‌شده می‌پرسد.
    example_gloss: 'لیلا گفت: آیا می‌توانم با کارت پرداخت کنم؟'
  ar.a1.unit24.lesson02.teach.line04:
    title: پیشنهاد طریقه‌ها
    gloss: دوکاندار می‌گوید کارت یا پول نقد ممکن است.
    note: أو (aw) یعنی «یا».
    example_gloss: 'دوکاندار گفت: بلی، یا نقد.'
  ar.a1.unit24.lesson02.teach.line05:
    title: انتخاب طریقه
    gloss: لیلا می‌گوید با کارت پرداخت می‌کند.
    note: این انتخاب طریقهٔ پرداخت را کامل می‌کند.
    example_gloss: 'لیلا گفت: با کارت پرداخت می‌کنم.'
