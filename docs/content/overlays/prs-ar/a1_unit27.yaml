  description: 'عربی ابتدایی برای صحبت دربارهٔ حیوانات خانگی و حیوانات معمول: نام بردن آن‌ها، مراقبت اساسی (گشت بردن، خوراک دادن، بازی کردن)، گفتن این‌که کدام حیوان را دوست دارید حتی اگر نداشته باشین، و شکل‌های جمع معمول.'
