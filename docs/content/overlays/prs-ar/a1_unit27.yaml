teaching:
  ar.a1.unit27.lesson01.teach.alhywan_hywan_alyf:
    title: حیوان، حیوان خانگی
    gloss: حیوان / حیوان خانگی
    note: حيوان (ḥayawān) یعنی حیوان و حيوان أليف (ḥayawān alīf) یعنی حیوان خانگی. أليف (alīf) صفت است و معنایش اهلی است، پس بعد از اسم می‌آید.
    example_gloss:
    - سگ یک حیوان است.
    - سگ یک حیوان خانگی هم است.
  ar.a1.unit27.lesson01.teach.alklb_alqta:
    title: سگ و پشک
    gloss: سگ / پشک
    example_gloss:
    - لیلا یک سگ دارد.
    - کریم یک گربه دارد.
  ar.a1.unit27.lesson01.teach.alsmka_altair:
    title: ماهی و پرنده
    gloss: ماهی / پرنده
    example_gloss:
    - پدرکلان یک ماهی دارد.
    - نور یک پرنده دارد.
  ar.a1.unit27.lesson01.teach.hl_ldyk_hywan:
    title: حیوان خانگی داری؟
    gloss: حیوان خانگی داری؟
    note: 'هل لديك (hal ladayka) یعنی آیا داری. برای یک زن هم همین‌طور نوشته می‌شود، اما حرکت آخر کسره است: ladayki. هل (hal) سوال بلی/نه را آغاز می‌کند.'
  ar.a1.unit27.lesson01.teach.nam_ldy_klb:
    title: بلی، سگ دارم
    gloss: بلی، یک سگ دارم.
    note: یک جواب مثبت ساده با واژه‌های جدید این درس.
  ar.a1.unit27.lesson01.teach.la_lys_ldy:
    title: نه، من حیوان خانگی ندارم
    gloss: نه، من حیوان خانگی ندارم.
    note: 'ليس لدي (laysa ladayya) یعنی من ندارم: ليس (laysa) نفی می‌کند و لدي (ladayya) یعنی من دارم.'
  ar.a1.unit27.lesson01.teach.nnfy_almlkya_babara:
    title: 'نداشتن: ليس لدي'
    gloss: 'برای گفتن این‌که چیزی ندارین، از ليس لدي (laysa ladayya) استفاده کنید: ليس لدي وقت (وقت ندارم)، ليس لدي حيوان أليف (حیوان خانگی ندارم).'
    note: ليس لدي با هر اسم کار می‌کند و به اساس جنسیت تغییر نمی‌کند. برای او (مرد) و او (زن) بگویین ليس لديه (laysa ladayhi) و ليس لديها (laysa ladayhā).
  ar.a1.unit27.lesson02.teach.akhdh_alhywan_fy:
    title: گشت دادن (حیوان)
    gloss: حیوان را به گشت بردن
    note: أخذ الحيوان في نزهة (akhdh al-ḥayawān fī nuzha) به معنای لفظی یعنی بردن حیوان به گشت. فعل أخذ است، یعنی گرفتن و بردن.
    example_gloss: من هر روز سگ را به گشت می‌برم.
  ar.a1.unit27.lesson02.teach.ytghyr_alfal_ma:
    title: فعل با شخص تغییر می‌کند
    gloss: 'فعل با ضمیر تغییر می‌کند: آخذ الكلب في نزهة (ākhudh al-kalb fī nuzha)، من سگ را به گشت می‌برم؛ كريم يأخذ كلبه في نزهة (karīm yākhudh kalbahu fī nuzha)، کریم سگش را به گشت می‌برد.'
    note: حرف اول أ (a-) «من» را نشان می‌دهد و ي (ya-) «او» را. نزهة (nuzha) یعنی گشت یا سیر کوتاه.
  ar.a1.unit27.lesson02.teach.itaam_alhywan:
    title: غذا دادن
    gloss: غذا دادن
    example_gloss: من هر روز به پشک غذا می‌دهم.
  ar.a1.unit27.lesson02.teach.allab_ma_alhywan:
    title: بازی کردن با
    gloss: بازی کردن با
    example_gloss: کریم با گربه‌اش بازی می‌کند.
  ar.a1.unit27.lesson02.teach.akhdh_alklb_fy:
    title: من هر روز سگ را به گشت می‌برم
    gloss: من هر روز سگ را به گشت می‌برم.
    note: 'كل يوم (kull yawm) یعنی هر روز: كل + اسم مفرد بدون ال.'
  ar.a1.unit27.lesson02.teach.atam_alqta_kl:
    title: من هر روز به پشک غذا می‌دهم
    gloss: من هر روز به پشک غذا می‌دهم.
    note: أطعم (uṭʿim) یعنی من خوراک می‌دهم. القطة (al-qiṭṭa) مؤنث است و ال به اسم وصل می‌شود.
  ar.a1.unit27.lesson03.teach.jma_klb_hw:
    title: 'جمع‌ها: كلب → كلاب'
    gloss: 'بسیاری از جمع‌ها بی‌قاعده استند، پس آن‌ها را همراه با اسم یاد بگیرین: كلب (kalb) می‌شود كلاب (kilāb)، قطة (qiṭṭa) می‌شود قطط (qiṭaṭ) و طائر (ṭāʾir) می‌شود طيور (ṭuyūr).'
    note: جمع‌های عربی بیشتر مکسر استند، پس هر جمع همراه با اسمش یاد گرفته می‌شود؛ جمع حیوانات صفت مفرد مؤنث می‌گیرد.
  ar.a1.unit27.lesson03.teach.klab_qtt:
    title: سگ‌ها و پشک‌ها
    gloss: سگ‌ها / پشک‌ها
    example_gloss:
    - یوسف سگ‌ها را دوست دارد.
    - سارا گربه‌ها را دوست دارد.
  ar.a1.unit27.lesson03.teach.asmak_tywr:
    title: ماهی‌ها و پرنده‌ها (جمع)
    gloss: ماهی‌ها / پرنده‌ها
    example_gloss:
    - من ماهی‌ها را خیلی دوست دارم.
    - کاکا پرنده‌ها را خیلی دوست دارد.
  ar.a1.unit27.lesson03.teach.ahb_alhywanat:
    title: من حیوانات را خیلی دوست دارم
    gloss: من حیوانات را خیلی دوست دارم.
    note: أحب الحيوانات (uḥibb al-ḥayawānāt) یعنی من حیوانات را دوست دارم. جمع به ات ختم می‌شود و ال به آن وصل می‌شود.
  ar.a1.unit27.lesson03.teach.sara_thb_alqtt:
    title: سارا گربه‌ها را دوست دارد، اما حیوان خانگی ندارد
    gloss: سارا گربه‌ها را دوست دارد، اما حیوان خانگی ندارد.
    note: زمینه را برای تضادی آماده می‌کند که متن خواندنی بعدی بر آن ساخته شده است.
  ar.a1.unit27.lesson04.teach.ywsf_hl_ldyk:
    title: یوسف دربارهٔ حیوان خانگی می‌پرسد
    gloss: 'یوسف: لیلا، حیوان خانگی داری؟'
  ar.a1.unit27.lesson04.teach.lyla_nam_ldy:
    title: لیلا یک سگ دارد
    gloss: 'لیلا: بلی، یک سگ دارم.'
  ar.a1.unit27.lesson04.teach.ywsf_kyf_ybdw:
    title: یوسف می‌پرسد ظاهرش چطور است
    gloss: 'یوسف: چطور معلوم می‌شود؟'
    note: كيف يبدو؟ (kayfa yabdū?) می‌پرسد ظاهرش چطور است. يبدو (yabdū) مذکر است، چون كلب، سگ، اسم مذکر است.
  ar.a1.unit27.lesson04.teach.lyla_lh_shar:
    title: لیلا سگش را توصیف می‌کند
    gloss: 'لیلا: موی قهوه‌ای دارد و کوچک است.'
    note: واژه‌های رنگ مو و اندازه از درس ظاهر و قیافه دوباره آمده‌اند، این بار برای توصیف پشم یک حیوان، نه موی یک شخص.
  ar.a1.unit27.lesson04.teach.nqwl_hw_llklb:
    title: ضمیرها برای حیوانات
    gloss: 'هر کلمهٔ حیوان مذکر یا مؤنث است: سگ هو (huwa، او مرد) است و گربه هي (hiya، او زن) است. ه در آخر أطعمه (uṭʿimuhu) یعنی او (مرد) یا آن را.'
    note: کلمهٔ حیوان مذکر مثل كلب ضمیر و صفت مذکر می‌گیرد؛ مؤنث مثل قطة ضمیر و صفت مؤنث می‌گیرد.
  ar.a1.unit27.lesson04.teach.ywsf_hl_takhdhynh:
    title: یوسف دربارهٔ گشت می‌پرسد
    gloss: 'یوسف: هر روز او را به گشت می‌بری؟'
  ar.a1.unit27.lesson04.teach.lyla_nam_akhdhh:
    title: لیلا برنامهٔ روزانه‌اش را توضیح می‌دهد
    gloss: 'لیلا: بلی، هر روز او را به گشت می‌برم و خوراک می‌دهم.'
  ar.a1.unit27.lesson05.teach.ywsf_wsara_yhban:
    title: یوسف، سارا و کریم دربارهٔ حیوانات
    gloss: 'یوسف و سارا هر دو حیوانات را دوست دارند، اما هیچ‌کدام شان حیوان خانگی ندارند. یوسف سگ‌ها را دوست دارد و سارا گربه‌ها را. اما کریم حیوان خانگی دارد: یک گربه. او زیاد با گربه‌اش بازی می‌کند و هر روز به گربه خوراک می‌دهد. آیا تو حیوان خانگی داری؟'
    note: دوست داشتن یک حیوان را با واقعاً داشتنِ آن مقایسه می‌کند؛ نکته اصلی این درس همین است.
    glosses:
      يحبان: خیلی دوست دارند
      كلاهما: هر دو
      الحيوانات: حیوانات
      منهما: شان (هیچ‌کدام شان)
      أليف: 'حیوان خانگی (لفظاً: اهلی)'
      الكلاب: سگ‌ها
      القطط: پشک‌ها
      قطة: پشک
      يلعب: بازی می‌کند
      ويعطي: می‌دهد
      كل: هر
      طعاما: غذا
  ar.a1.unit27.lesson05.teach.krym_ylab_ma:
    title: کریم زیاد با گربه‌اش بازی می‌کند
    gloss: کریم زیاد با گربه‌اش بازی می‌کند.
    note: 'قطته (qiṭṭatuhu) یعنی گربهٔ او: ه (hu) یعنی «اش» و ة در قطة پیش از آن به ت تبدیل می‌شود.'
  ar.a1.unit27.lesson05.teach.ahb_alklab_lys:
    title: من سگ‌ها را دوست دارم. حیوان خانگی ندارم.
    gloss: من سگ‌ها را دوست دارم. حیوان خانگی ندارم.
    note: یک جواب نمونه با دو جمله که برای تمرین نوشتاری این درس آماده است.
  ar.a1.unit27.lesson06.teach.lyla_ya_nwr:
    title: لیلی از نور می‌پرسد
    gloss: 'لیلی: نور، تو هم حیوان خانگی داری؟'
  ar.a1.unit27.lesson06.teach.nwr_nam_ldy:
    title: نور یک پرنده به نام بیکو دارد
    gloss: 'نور: بلی، یک پرنده دارم. نامش بیکو است.'
    note: اسمه (ismuhu) یعنی «نامش»؛ ه در آخر یعنی «ـش». بيكو (bīkū) نام پرنده است.
  ar.a1.unit27.lesson06.teach.ywsf_ma_ajml:
    title: یوسف واکنش نشان می‌دهد
    gloss: 'یوسف: چه قشنگ! هر روز با او چه کار می‌کنی؟'
  ar.a1.unit27.lesson06.teach.nwr_atamh_kl:
    title: نور هر روز به او غذا می‌دهد
    gloss: 'نور: هر روز به او غذا می‌دهم.'
  ar.a1.unit27.lesson06.teach.ywsf_wana_ayda:
    title: یوسف هم پرنده‌ها را دوست دارد
    gloss: 'یوسف: من هم پرنده‌ها را دوست دارم.'
  ar.a1.unit27.lesson06.teach.lyla_ma_ajml:
    title: لیلی گفتگو را ختم می‌کند
    gloss: 'لیلی: چه خوب که ما هر سه حیوانات را دوست داریم!'
    note: حرف‌های هر سه شخصیت درباره حیوانات در این درس را کنار هم جمع‌بندی می‌کند.
