  ar.a1.unit21.lesson01.teach.shirt:
    title: پیراهن
    gloss: پیراهن
    note: 'قميص (qamīṣ) یعنی پیراهن؛ بعد از أريد پایان مفعولی -an می‌گیرد: قميصا (qamīṣan).'
