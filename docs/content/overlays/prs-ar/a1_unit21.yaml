  ar.a1.unit21.lesson01.teach.blue:
    title: آبی
    gloss: آبی
    note: 'أزرق (azraq) شکل مذکر است و با قميص می‌آید؛ با اسم مؤنث زرقاء (zarqāʾ) می‌شود. بعد از أريد، أزرق الف اضافی نمی‌گیرد: قميصا أزرق.'
    example_gloss: من یک پیراهن آبی می‌خواهم.
  ar.a1.unit21.lesson01.teach.blue_shirt:
    title: پیراهن آبی
    gloss: یک پیراهن آبی
    note: 'در عربی رنگ بعد از چیز می‌آید: قميصا أزرق (qamīṣan azraq).'
    example_gloss: من یک پیراهن آبی می‌خواهم.
  ar.a1.unit21.lesson02.teach.size:
    title: اندازه
    gloss: اندازه
    note: مقاس (maqās) یعنی سایز؛ ما المقاس؟ (mā l-maqās) سایز را می‌پرسد.
    example_gloss: چه اندازه؟
  ar.a1.unit21.lesson02.teach.medium:
    title: سایز متوسط
    gloss: سایز متوسط
    note: 'متوسط (mutawassiṭ) یعنی متوسط؛ با بـ (bi-، در) به چیز وصل می‌شود: قميصا بمقاس متوسط (qamīṣan bi-maqāsin mutawassiṭ)، یک پیراهن با سایز متوسط.'
    example_gloss: من یک پیراهن با سایز متوسط می‌خواهم.
  ar.a1.unit21.lesson02.teach.price:
    title: ده درهم
    gloss: ده درهم
    note: 'بعشرة (bi-ʿashara) یعنی به ده: پیشوند بـ قیمت را نشان می‌دهد، مثل درس خرید.'
    example_gloss: پیراهن ده درهم است.
  ar.a1.unit21.lesson02.teach.line01:
    title: درخواست جنس
    gloss: لیلی یک پیراهن آبی می‌خواهد.
    note: من فضلك درخواست را مؤدبانه نگه می‌دارد.
    example_gloss: 'لیلی گفت: لطفاً یک پیراهن آبی می‌خواهم.'
  ar.a1.unit21.lesson02.teach.line02:
    title: پرسیدن سایز
    gloss: فروشنده سایز را می‌پرسد.
    note: 'فروشنده سایز را می‌پرسد: ما المقاس؟'
    example_gloss: 'فروشنده گفت: چه سایزی؟'
  ar.a1.unit21.lesson02.teach.line03:
    title: گفتن سایز
    gloss: لیلی می‌گوید سایز متوسط.
    note: این مستقیماً به سؤال سایز جواب می‌دهد.
    example_gloss: 'لیلی گفت: سایز متوسط.'
  ar.a1.unit21.lesson02.teach.line04:
    title: دادن جنس و قیمت
    gloss: فروشنده پیراهن را می‌دهد و قیمت را می‌گوید.
    note: 'تفضلي (tafaḍḍalī) وقتی چیزی را به یک خانم می‌دهند گفته می‌شود؛ به یک مرد: تفضل (tafaḍḍal).'
    example_gloss: 'فروشنده گفت: بفرمایید. پیراهن ده درهم است.'
