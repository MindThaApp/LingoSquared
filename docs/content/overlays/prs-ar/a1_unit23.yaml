teaching:
  ar.a1.unit23.lesson01.teach.phone:
    title: تیلفون
    gloss: تیلفون
    note: هاتف (hātif) یعنی تیلفون.
    example_gloss: این یک تیلفون است.
  ar.a1.unit23.lesson01.teach.hear:
    title: صدایت را می‌شنوم
    gloss: صدایت را می‌شنوم
    note: أسمعك (asmaʿuka برای مرد، asmaʿuki برای زن) یعنی «صدایت را می‌شنوم»؛ لا أسمعك (lā asmaʿuk) یعنی «صدایت را نمی‌شنوم».
    example_gloss: صدایت را نمی‌شنوم.
  ar.a1.unit23.lesson01.teach.repeat:
    title: تکرار کردن
    gloss: تکرار کن
    note: 'أعد (aʿid) به مرد گفته می‌شود؛ به زن: أعيدي (aʿīdī). أعد من فضلك یعنی از کسی مؤدبانه می‌خواهیم که تکرار کند.'
    example_gloss: صدایت را نمی‌شنوم. لطفاً دوباره بگو.
  ar.a1.unit23.lesson01.teach.slowly:
    title: آهسته صحبت کن
    gloss: آهسته صحبت کن
    note: 'تكلم ببطء (takallam bi-buṭʾ) به مرد گفته می‌شود؛ به زن: تكلمي ببطء (takallamī bi-buṭʾ).'
    example_gloss: لطفاً آهسته صحبت کن.
  ar.a1.unit23.lesson02.teach.message:
    title: پیام
    gloss: پیام
    note: رسالة (risāla) یعنی پیام؛ معنی «نامه» را هم می‌دهد.
    example_gloss: این یک پیام است.
  ar.a1.unit23.lesson02.teach.appointment:
    title: وقت ملاقات
    gloss: وقت ملاقات
    note: موعد (mawʿid) یعنی وقت ملاقات؛ الموعد (al-mawʿid) یعنی «آن وقت ملاقات».
    example_gloss: وقت ملاقات ساعت پنج است.
  ar.a1.unit23.lesson02.teach.line01:
    title: جواب دادن به تیلفون
    gloss: یوسف در تیلفون به لیلی سلام می‌کند و نامش را می‌گوید.
    note: در تیلفون، أنا يوسف (anā Yūsuf) می‌گوید که کی زنگ می‌زند.
    example_gloss: 'یوسف گفت: سلام، من یوسف استم.'
  ar.a1.unit23.lesson02.teach.line02:
    title: نمی‌شنود
    gloss: لیلی می‌گوید که صدای یوسف را نمی‌شنود.
    note: این جمله زمینه‌ی درخواست توضیح را آماده می‌کند.
    example_gloss: 'لیلی گفت: سلام یوسف، صدایت را نمی‌شنوم.'
  ar.a1.unit23.lesson02.teach.line03:
    title: خواستن صحبت آهسته
    gloss: لیلی از یوسف می‌خواهد که آهسته صحبت کند.
    note: من فضلك درخواست را مؤدبانه می‌سازد؛ لیلی تكلم می‌گوید چون با یک مرد صحبت می‌کند.
    example_gloss: 'لیلی گفت: لطفاً آهسته صحبت کن.'
  ar.a1.unit23.lesson02.teach.line04:
    title: جزئیات مهم
    gloss: یوسف می‌گوید که وقت ملاقات ساعت پنج است.
    note: في الساعة الخامسة (fī s-sāʿa l-khāmisa) یعنی «ساعت پنج».
    example_gloss: 'یوسف گفت: وقت ملاقات ساعت پنج است.'
  ar.a1.unit23.lesson02.teach.line05:
    title: خواهش تکرار
    gloss: لیلا از یوسف می‌خواهد که تکرار کند.
    note: أعد من فضلك جملهٔ خواهش تکرار است.
    example_gloss: 'لیلا گفت: لطفاً تکرار کنید.'
  ar.a1.unit23.lesson02.teach.line06:
    title: تکرار جزئیات
    gloss: یوسف وقت ملاقات را تکرار می‌کند.
    note: جملهٔ تکرارشده وقت را تأیید می‌کند.
    example_gloss: 'یوسف گفت: وقت ملاقات ساعت پنج است.'
