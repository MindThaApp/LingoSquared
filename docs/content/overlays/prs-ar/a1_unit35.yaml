    title: لیلا بسته می‌فرستد
    gloss: لیلا برای پدرکلان و مادرکلانش در بیروت بسته دارد. او در پُسته‌خانه تکت پُستی می‌خرد. آدرس را روی بسته می‌نویسد. بسته فردا به آن‌ها می‌رسد. نامه سه روز وقت می‌گیرد.
    note: 'متن کوتاهی درباره‌ی بسته. فعل با فاعلش مطابقت می‌کند: الطرد يصل (aṭ-ṭard yaṣil) برای اسم مذکر، اما ليلى تشتري (Layla tashtarī) برای یک زن.'
    glosses:
      طرد: بسته
      لجدها: برای پدرکلانش
      وجدتها: و مادرکلانش
      تشتري: می‌خرد
      طابعا: تکت پوسته
      البريد: پُسته‌خانه (پُست)
      تكتب: می‌نویسد
      العنوان: آدرس
      يصل: می‌رسد (فعل مذکر)
      غدا: فردا
      إليهما: به آن‌ها (دو نفر)؛ فعل همراه این کلمه یعنی به آن‌ها می‌رسد
      الرسالة: خط
      تستغرق: وقت می‌گیرد
      ثلاثة: سه
      أيام: روزها
