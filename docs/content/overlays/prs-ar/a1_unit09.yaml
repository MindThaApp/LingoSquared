teaching:
  ar.a1.unit09.lesson01.teach.place:
    title: جا
    gloss: جا
    note: مكان (makān) کلمهٔ عمومی برای جا است. هذا (این) همراه عددها یاد گرفته شد.
    example_gloss: این یک جاست.
  ar.a1.unit09.lesson01.teach.library:
    title: کتابخانه
    gloss: کتابخانه
    note: مكتبة (maktaba) می‌تواند کتابخانه یا کتاب‌فروشی باشد؛ اینجا کتابخانه است. المكتبة (al-maktaba) یعنی «کتابخانه» با معرفه.
    example_gloss: کتابخانه اینجاست.
  ar.a1.unit09.lesson01.teach.market:
    title: بازار
    gloss: بازار
    note: سوق (sūq) یعنی بازار؛ السوق (as-sūq) یعنی «بازار» با معرفه.
    example_gloss: بازار اینجاست.
  ar.a1.unit09.lesson01.teach.cafe:
    title: کافه
    gloss: کافه
    note: مقهى (maqhā) یعنی کافه؛ این کلمه به قهوة (قهوه) ربط دارد. المقهى (al-maqhā) یعنی «کافه» با «ال» معرفه.
    example_gloss: کافه اینجاست.
  ar.a1.unit09.lesson01.teach.here:
    title: اینجا
    gloss: اینجا
    note: 'هنا (hunā) معمولاً بعد از جای مورد نظر میآید: المقهى هنا، یعنی کافه اینجاست. در این جمله در عربی به کلمهٔ «است» ضرورت نیست.'
    example_gloss: کافه اینجاست.
  ar.a1.unit09.lesson02.teach.where_library:
    title: کتابخانه کجاست؟
    gloss: کتابخانه کجاست؟
    note: أين (ayna) برای پرسیدن «کجا» است؛ آن را در من أين أنت؟ (تو از کجا استی؟) دیدی.
    example_gloss: 'یوسف گفت: کتابخانه کجاست؟'
  ar.a1.unit09.lesson02.teach.near:
    title: نزدیک
    gloss: نزدیک
    note: 'قرب (qurba) یعنی نزدیک و پیش از جایی میآید که به آن اشاره میکند: قرب المكتبة، نزدیک کتابخانه. بالقرب من (bi-l-qurbi min) هم همین معنی را دارد.'
    example_gloss: کافه نزدیک کتابخانه است.
  ar.a1.unit09.lesson02.teach.library_near_market:
    title: کتابخانه نزدیک بازار است
    gloss: کتابخانه نزدیک بازار است
    note: در عربی در اینجا به کلمهٔ جداگانه برای «است» ضرورت نیست.
    example_gloss: 'لیلا گفت: کتابخانه نزدیک بازار است.'
  ar.a1.unit09.lesson02.teach.line01:
    title: پرسیدن جای چیزی
    gloss: یوسف میپرسد که کتابخانه کجاست.
    note: أين سوال دربارهٔ جای چیزی را شروع میکند.
    example_gloss: 'یوسف گفت: کتابخانه کجاست؟'
  ar.a1.unit09.lesson02.teach.line02:
    title: پیدا کردن جای کتابخانه
    gloss: لیلا میگوید کتابخانه اینجا نزدیک بازار است.
    note: 'هنا و قرب میتوانند باهم بیایند: اینجا، نزدیک بازار.'
    example_gloss: 'لیلا گفت: کتابخانه اینجا نزدیک بازار است.'
  ar.a1.unit09.lesson02.teach.line03:
    title: پرسیدن دربارهٔ کافه
    gloss: یوسف میپرسد که کافه کجاست.
    note: 'و (wa، یعنی «و») به کلمهٔ بعدی چسبیده نوشته میشود: وأين (wa-ayna)، یعنی «و کجا».'
    example_gloss: 'یوسف گفت: و کافه کجاست؟'
  ar.a1.unit09.lesson02.teach.line04:
    title: پیدا کردن جای کافه
    gloss: لیلا میگوید کافه نزدیک کتابخانه است.
    note: 'جای اول + قرب + جای دوم: المقهى قرب المكتبة، یعنی کافه نزدیک کتابخانه است.'
    example_gloss: 'لیلا گفت: کافه نزدیک کتابخانه است.'
