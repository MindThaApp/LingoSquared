    note: درخواست با أريد و بعد چیزهای مورد نظر ساخته می‌شود.
    example_gloss: 'لیلا گفت: سلام. آب و قهوه می‌خواهم، لطفاً.'
  ar.a1.unit07.lesson02.teach.line02:
    title: پرسش بعدی
    gloss: گارسون می‌پرسد که آیا او نان می‌خواهد.
    note: هل پرسش بلی/نخیر را شروع می‌کند.
    example_gloss: 'گارسون گفت: نان می‌خواهین؟'
  ar.a1.unit07.lesson02.teach.line03:
    title: جواب پرسش
    gloss: لیلا بلی می‌گوید و یک تکه نان می‌خواهد.
    note: نعم جواب «بلی» را می‌دهد.
    example_gloss: 'لیلا گفت: بلی، یک تکه نان می‌خواهم.'
  ar.a1.unit07.lesson02.teach.line04:
    title: آوردن سفارش
    gloss: 'گارسون می‌گوید: بفرمایید.'
    note: تفضلي گفتگو را تمام می‌کند.
    example_gloss: 'گارسون گفت: بفرمایید.'
