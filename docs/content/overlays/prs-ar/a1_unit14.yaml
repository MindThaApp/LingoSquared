teaching:
  ar.a1.unit14.lesson01.teach.like:
    title: من دوست دارم
    gloss: دوست دارم
    note: أحب (uḥibbu) یعنی «دوست دارم». عربی برای چیزها به‌صورت عمومی ال (حرف تعریف) را می‌آورد، پس «قهوه را دوست دارم» می‌شود أحب القهوة، یعنی لفظاً «من قهوه‌ی معین را دوست دارم».
    example_gloss: من قهوه را دوست دارم.
  ar.a1.unit14.lesson01.teach.tea:
    title: چای
    gloss: چای
    note: شاي (shāy) یعنی چای؛ الشاي (ash-shāy) ال می‌گیرد، چنان‌که عربی وقتی دربارهٔ چای به‌صورت عمومی صحبت می‌کند چنین می‌کند.
    example_gloss: من چای را دوست ندارم.
  ar.a1.unit14.lesson01.teach.dislike:
    title: دوست ندارم
    gloss: دوست ندارم
    note: در دری منفی با «نـ» روی فعل ساخته می‌شود، اما در عربی لا پیش از أحب می‌آید.
    example_gloss: من چای را دوست ندارم.
  ar.a1.unit14.lesson01.teach.water:
    title: آب
    gloss: آب
    note: الماء (al-māʾ) همان ماء (آب، از بخش غذا) با ال است که برای آب به‌صورت عمومی استفاده می‌شود.
    example_gloss: من آب را دوست دارم.
  ar.a1.unit14.lesson01.teach.and_not:
    title: و نه
    gloss: و نه
    note: 'ولا (wa-lā) از و (و) و لا (نه) ساخته شده است: بعد از یک دوست داشتن، یک دوست نداشتن را اضافه می‌کند.'
    example_gloss: من قهوه را دوست دارم و چای را دوست ندارم.
  ar.a1.unit14.lesson02.teach.prefer:
    title: من بیشتر دوست دارم
    gloss: من بیشتر دوست دارم
    note: 'أفضل (ufaḍḍilu) یعنی «ترجیح می‌دهم»: یک گزینه را بر گزینهٔ دیگر انتخاب می‌کنی.'
    example_gloss: من قهوه را ترجیح می‌دهم.
  ar.a1.unit14.lesson02.teach.what_prefer:
    title: کدام را ترجیح می‌دهی؟
    gloss: تو کدام را بیشتر دوست داری؟
    note: تفضل در اینجا tufaḍḍil یعنی «ترجیح می‌دهی» است که به یک مرد گفته می‌شود؛ به یک زن تفضلين (tufaḍḍilīn) گفته می‌شود. این کلمه با تفضل (tafaḍḍal، بفرمایید) در بخش غذا فرق دارد، هرچند یکسان نوشته می‌شود.
    example_gloss: 'نور گفت: یوسف، تو چه چیز را ترجیح می‌دهی؟'
  ar.a1.unit14.lesson02.teach.line01:
    title: نور می‌پرسد
    gloss: نور از یوسف می‌پرسد که چه چیز را ترجیح می‌دهد.
    note: 'نور خواهر یوسف است. او تفضل می‌گوید چون از یک مرد می‌پرسد؛ برای یک زن: ماذا تفضلين؟'
    example_gloss: 'نور گفت: یوسف، تو چه چیز را ترجیح می‌دهی؟'
  ar.a1.unit14.lesson02.teach.line02:
    title: یوسف قهوه را ترجیح می‌دهد
    gloss: یوسف می‌گوید قهوه را ترجیح می‌دهد.
    note: أفضل یک گزینه را بر گزینه‌های دیگر انتخاب می‌کند؛ أحب فقط می‌گوید چیزی را دوست داری.
    example_gloss: 'یوسف گفت: من قهوه را ترجیح می‌دهم.'
  ar.a1.unit14.lesson02.teach.line03:
    title: یوسف چای را دوست ندارد
    gloss: یوسف می‌گوید چای را دوست ندارد.
    note: لا أحب دوست نداشتن را ساده بیان می‌کند.
    example_gloss: 'یوسف گفت: من چای را دوست ندارم.'
  ar.a1.unit14.lesson02.teach.line04:
    title: نور آب را دوست دارد
    gloss: نور می‌گوید آب را دوست دارد.
    note: أنا را می‌شود برای تأکید آورد.
    example_gloss: 'نور گفت: من آب را دوست دارم.'
