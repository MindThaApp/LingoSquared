teaching:
  ar.a1.unit17.lesson01.teach.pain:
    title: درد
    gloss: درد
    note: ألم (alam) یعنی درد؛ عندي ألم (ʿindī alam) یعنی «درد دارم».
    example_gloss: درد دارم.
  ar.a1.unit17.lesson01.teach.head:
    title: سر
    gloss: سر
    note: الرأس (ar-raʾs) یعنی سر. عربی می‌گوید عندي ألم في الرأس، یعنی «دردی در سر»؛ در دری برای همین مفهوم می‌گوییم «سرم درد می‌کند».
    example_gloss: سرم درد می‌کند.
  ar.a1.unit17.lesson01.teach.stomach:
    title: شکم
    gloss: شکم
    note: البطن (al-baṭn) یعنی شکم یا ناحیهٔ شکم.
    example_gloss: شکمم درد می‌کند.
  ar.a1.unit17.lesson01.teach.problem_sentence:
    title: درد در سر
    gloss: سرم درد می‌کند
    note: عندي ألم، به معنای تحت‌اللفظی «نزد من درد است»، راه گفتن «درد دارم» در عربی است؛ في + عضو بدن جای درد را می‌گوید.
    example_gloss: 'لیلا گفت: سرم درد می‌کند.'
  ar.a1.unit17.lesson02.teach.problem_question:
    title: مشکل چیست؟
    gloss: مشکل چیست؟
    note: ما (mā) یعنی «چه»؛ المشكلة (al-mushkila) یعنی مشکل.
    example_gloss: مشکل چیست، لیلا؟
  ar.a1.unit17.lesson02.teach.drink:
    title: آب بنوش
    gloss: آب بنوش
    note: اشربي (ishrabī) امر «بنوش!» برای یک زن است، اینجا لیلا؛ برای مرد اشرب (ishrab) است.
    example_gloss: 'یوسف گفت: آب بنوش.'
  ar.a1.unit17.lesson02.teach.rest:
    title: استراحت
    gloss: استراحت کن
    note: استريحي (istarīḥī) امر «استراحت کن!» برای یک زن است؛ برای مرد استرح (istariḥ) است.
    example_gloss: امروز استراحت کن.
  ar.a1.unit17.lesson02.teach.need_help:
    title: کمک لازم دارم
    gloss: کمک لازم دارم
    note: أحتاج (aḥtāj) یعنی «لازم دارم» و مساعدة (musāʿada) یعنی کمک. أحتاج إلى مساعدة را هم با إلى خواهید دید؛ هر دو درست است.
    example_gloss: درد دارم. کمک لازم دارم.
  ar.a1.unit17.lesson02.teach.line01:
    title: مشکل را بپرس
    gloss: یوسف از لیلا می‌پرسد مشکل چیست.
    note: يا ليلى لیلا را با نامش صدا می‌کند.
    example_gloss: 'یوسف گفت: مشکل چیست، لیلا؟'
  ar.a1.unit17.lesson02.teach.line02:
    title: علامه را بگو
    gloss: لیلا می‌گوید سرش درد می‌کند.
    note: نشانهٔ مریضی مستقیم گفته شده است.
    example_gloss: 'لیلی گفت: سرم درد می‌کند.'
  ar.a1.unit17.lesson02.teach.line03:
    title: مشورهٔ ساده
    gloss: یوسف به لیلی می‌گوید آب بنوش و استراحت کن.
    note: 'هر دو امر مؤنث اند چون یوسف با لیلی صحبت می‌کند؛ و (wa، یعنی «و») به کلمهٔ بعدی چسپیده نوشته می‌شود: واستريحي.'
    example_gloss: 'یوسف گفت: آب بنوش و استراحت کن.'
  ar.a1.unit17.lesson02.teach.line04:
    title: تشکر
    gloss: لیلی تشکر می‌کند.
    note: شكرا گفتگوی کوتاه را تمام می‌کند.
    example_gloss: 'لیلی گفت: تشکر.'
