teaching:
  ar.a1.unit10.lesson01.teach.right:
    title: راست
    gloss: راست (جهت)
    note: يمين (yamīn) طرف راست را میرساند؛ اليمين (al-yamīn) یعنی «راست» با «ال» معرفه.
    example_gloss: به طرف راست.
  ar.a1.unit10.lesson01.teach.left:
    title: چپ
    gloss: چپ (جهت)
    note: يسار (yasār) طرف چپ را میرساند؛ اليسار (al-yasār) یعنی «چپ» با «ال» معرفه.
    example_gloss: به طرف چپ.
  ar.a1.unit10.lesson01.teach.forward:
    title: سیده
    gloss: سیده / مستقیم
    note: إلى الأمام (ilā l-amām) در اصل یعنی «به طرف پیش»؛ راه معمول گفتن «مستقیم» یا «به پیش» است.
    example_gloss: کتابخانه مستقیم به پیش است.
  ar.a1.unit10.lesson01.teach.to_right:
    title: به طرف راست
    gloss: طرف راست
    note: إلى (ilā) حرکت به طرف یک جهت یا جا را نشان میدهد.
    example_gloss: بازار به طرف راست است.
  ar.a1.unit10.lesson02.teach.walk:
    title: برو
    gloss: برو
    note: امش (imshi) امر «برو!» برای یک مرد است؛ برای یک زن امشي (imshī) میگویند. این فعل معمول برای راه دادن است.
    example_gloss: مستقیم برو.
  ar.a1.unit10.lesson02.teach.then:
    title: بعد
    gloss: بعد / آن وقت
    note: ثم (thumma) دو مرحلهٔ راه را به ترتیب وصل میکند.
    example_gloss: مستقیم برو، بعد به طرف راست.
  ar.a1.unit10.lesson02.teach.route:
    title: دو مرحلهٔ راه
    gloss: مستقیم برو، بعد به طرف راست
    note: مرحلهٔ اول + ثم + مرحلهٔ دوم. فعل بعد از ثم تکرار نمیشود.
    example_gloss: 'لیلی گفت: مستقیم پیش برو، بعد به طرف راست.'
  ar.a1.unit10.lesson02.teach.line01:
    title: پرسیدن در مورد کتابخانه
    gloss: یوسف می‌پرسد که کتابخانه کجاست.
    note: أين المكتبة؟ قبلاً برای جاها استفاده شده بود.
    example_gloss: 'یوسف گفت: کتابخانه کجاست؟'
  ar.a1.unit10.lesson02.teach.line02:
    title: راهنمایی دادن
    gloss: لیلی دو مرحلهٔ ساده راه را می‌گوید.
    note: لیلی امش می‌گوید چون با یک مرد صحبت می‌کند؛ برای یک زن امشي می‌گوید.
    example_gloss: 'لیلی گفت: مستقیم پیش برو، بعد به طرف راست.'
  ar.a1.unit10.lesson02.teach.line03:
    title: تشکر کردن
    gloss: یوسف تشکر می‌کند.
    note: شكرا گفتگوی کمک را مؤدبانه ختم می‌کند.
    example_gloss: 'یوسف گفت: تشکر.'
  ar.a1.unit10.lesson02.teach.line04:
    title: تأیید کردن جا
    gloss: لیلی می‌گوید کتابخانه نزدیک بازار است.
    note: 'این جا قرب را از بخش جاها دوباره به کار می‌برد: کتابخانه نزدیک بازار است.'
    example_gloss: 'لیلی گفت: کتابخانه نزدیک بازار است.'
