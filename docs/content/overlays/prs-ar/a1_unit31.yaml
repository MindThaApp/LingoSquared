  ar.a1.unit31.lesson05.teach.krym_la_yaml:
    title: کی چه می‌خواند؟
    gloss: کریم فقط کار نمی‌کند، درس هم می‌خواند. او در مرکز تعلیم بزرگسالان کورس زبان هسپانوی می‌خواند. هر هفته کلمه‌های تازه یاد می‌گیرد. سارا در کالج در یک برنامهٔ درسی ثبت‌نام است. او آنجا صحت و مراقبت صحی می‌خواند. هر دوی شان درس خواندن را دوست دارند. شما چه می‌خوانید، یا می‌خواهین چه یاد بگیرین؟
    note: درس‌های کریم و سارا را با هم مقایسه می‌کند، مثل متن مقایسه‌ای واحد تکنالوژی.
    glosses:
      يعمل: کار می‌کند
      فقط: فقط
      يدرس: درس می‌خواند
      يتابع: می‌گیرد
      دورة: کورس
      الإسبانية: هسپانوی
      مركز: مرکز (مرکز تعلیم بزرگسالان)
      يتعلم: یاد می‌گیرد
      كل: هر
      أسبوع: هفته
      جديدة: نو
      كلمات: کلمه‌ها
      تلتحق: ثبت‌نام است (در یک برنامه درس می‌خواند)
      ببرنامج: برنامهٔ آموزشی
      الكلية: مکتب عالی
      الرعاية: مراقبت (مراقبت صحی)
      كلاهما: هر دو
      يحب: خوش‌شان می‌آید
      الدراسة: درس خواندن
      تتعلم: یاد گرفتن
