teaching:
  ar.a1.unit19.lesson01.teach.house:
    title: خانه
    gloss: خانه
    note: بیت (bayt) یعنی خانه؛ پایان ـي یعنی «م/من»، پس بيتي (baytī) یعنی خانهٔ من.
    example_gloss: خانهٔ من نزدیک کتابخانه است.
  ar.a1.unit19.lesson01.teach.room:
    title: اتاق
    gloss: اتاق
    note: غرفة (ghurfa) مؤنث است (به ة ختم می‌شود)، پس صفت مؤنث واحدة بعدش می‌آید.
    example_gloss: در خانهٔ من یک اتاق است.
  ar.a1.unit19.lesson01.teach.kitchen:
    title: آشپزخانه
    gloss: آشپزخانه
    note: 'مطبخ (maṭbakh) یعنی آشپزخانه. در عربی اینجا برای «است/وجود دارد» کلمه‌ای نیست: شروع با في بيتي (در خانهٔ من) همین کار را می‌کند.'
    example_gloss: در خانهٔ من یک آشپزخانه است.
  ar.a1.unit19.lesson01.teach.one_room:
    title: یک اتاق
    gloss: یک اتاق
    note: 'عدد «یک» بعد از اسم می‌آید و با آن مطابقت می‌کند: غرفة واحدة (ghurfa wāḥida)؛ با اسم مذکر واحد می‌شود.'
    example_gloss: در خانهٔ من یک اتاق است.
  ar.a1.unit19.lesson02.teach.table:
    title: میز
    gloss: میز
    note: طاولة (ṭāwila) یعنی میز؛ مثل غرفة به ة ختم می‌شود و مؤنث است.
    example_gloss: در اتاق یک میز دارم.
  ar.a1.unit19.lesson02.teach.in_room:
    title: در اتاق
    gloss: در اتاق
    note: الغرفة (al-ghurfa) یعنی «اتاق» (معرفه).
    example_gloss: میز در اتاق است.
  ar.a1.unit19.lesson02.teach.near_library:
    title: نزدیک کتابخانه
    gloss: نزدیک کتابخانه
    note: قرب (qurb) یعنی نزدیک؛ المكتبة همان کتابخانه از بخش جاهاست.
    example_gloss: خانهٔ من نزدیک کتابخانه است.
  ar.a1.unit19.lesson02.teach.line01:
    title: پرسیدن دربارهٔ جا
    gloss: لیلا می‌پرسد خانهٔ یوسف کجاست.
    note: أين یعنی کجا؛ بيتك (baytuka) یعنی خانهٔ تو، وقتی به یک مرد گفته شود؛ برای یک خانم baytuki می‌شود که یک‌رقم نوشته می‌شود.
    example_gloss: 'لیلا گفت: خانهٔ تو کجاست، یوسف؟'
  ar.a1.unit19.lesson02.teach.line02:
    title: جای خانه
    gloss: یوسف می‌گوید خانهٔ او نزدیک کتابخانه است.
    note: بيتي یعنی خانهٔ من.
    example_gloss: 'یوسف گفت: خانهٔ من نزدیک کتابخانه است.'
  ar.a1.unit19.lesson02.teach.line03:
    title: اتاق‌ها
    gloss: یوسف می‌گوید خانهٔ او یک اتاق و یک آشپزخانه دارد.
    note: 'و (wa، «و») این دو ویژگی خانه را وصل می‌کند و به کلمهٔ بعدی چسپیده نوشته می‌شود: ومطبخ.'
    example_gloss: 'یوسف گفت: در خانهٔ من یک اتاق و یک آشپزخانه است.'
  ar.a1.unit19.lesson02.teach.line04:
    title: پرسیدن دربارهٔ چیز
    gloss: لیلا می‌پرسد آیا یوسف میز دارد.
    note: هل سؤال بلی/نخیر را شروع می‌کند؛ عندك (ʿindaka) یعنی «تو داری»، وقتی به یک مرد گفته شود؛ برای یک خانم ʿindaki می‌شود که یک‌رقم نوشته می‌شود.
    example_gloss: 'لیلا گفت: آیا تو میز داری؟'
  ar.a1.unit19.lesson02.teach.line05:
    title: جای چیز
    gloss: یوسف می‌گوید در اتاق میز دارد.
    note: عندي داشتن را بیان می‌کند.
    example_gloss: 'یوسف گفت: بلی، در اتاق یک میز دارم.'
