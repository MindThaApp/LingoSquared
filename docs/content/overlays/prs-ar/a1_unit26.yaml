teaching:
  ar.a1.unit26.lesson01.teach.twyl_qsyr:
    title: قدبلند و قدکوتاه
    gloss: قدبلند / قدکوتاه
    note: 'طويل (ṭawīl) یعنی قدبلند و قصير (qaṣīr) یعنی قدکوتاه. برای زن «ة» می‌گیرند: طويلة (ṭawīla)، قصيرة (qaṣīra).'
    example_gloss:
    - سارا قدبلند است.
    - کریم قدکوتاه است.
  ar.a1.unit26.lesson01.teach.kbyr_fy_alsn:
    title: پیر و جوان
    gloss: پیر / جوان
    note: كبير في السن (kabīr fī as-sinn) و صغير في السن (ṣaghīr fī as-sinn) تصویر کلی از سن را می‌دهند، نه تعداد دقیق سال‌ها را.
    example_gloss:
    - بابه کلان پیر است.
    - یوسف جوان است.
  ar.a1.unit26.lesson01.teach.km_amrk_sual:
    title: 'سن: یک عدد یا یک تصور'
    gloss: كم عمرك؟ (kam ʿumruka?) تعداد سال‌ها را می‌پرسد، اما كبير في السن (kabīr fī as-sinn) تصویر کلی بدون عدد می‌دهد، مثل الجد كبير في السن (al-jadd kabīr fī as-sinn).
    note: برای پرسیدن سن دقیق کسی از كم عمرك؟ استفاده کنید. كبير في السن در اینجا فقط می‌گوید کسی چقدر سن‌دار معلوم می‌شود.
  ar.a1.unit26.lesson01.teach.sara_twyla_wkrym:
    title: سارا قدبلند است و کریم قدکوتاه
    gloss: سارا قدبلند است و کریم قدکوتاه.
    note: 'و (wa-) دو جمله را وصل می‌کند و به کلمهٔ بعدی چسپیده نوشته می‌شود: وكريم (wa-karīm). صفت‌ها با اسم مطابقت می‌کنند: سارة طويلة مؤنث است و كريم قصير مذکر.'
  ar.a1.unit26.lesson02.teach.alshar:
    title: مو
    gloss: مو
    note: 'الشعر (ash-shaʿr) یعنی «مو». ش حرف شمسی است، بنابراین ل در ال تلفظ نمی‌شود: ash-shaʿr.'
    example_gloss: یوسف موی کوتاه سیاه دارد.
  ar.a1.unit26.lesson02.teach.ashqr_bny_rmady:
    title: زرد، قهوه‌یی و خاکستری
    gloss: زرد / قهوه‌یی / خاکستری
    note: 'أشقر (ashqar)، بني (bunnī) و رمادي (ramādī) مو را توصیف می‌کنند و بعد از اسم می‌آیند: شعر أشقر (shaʿr ashqar).'
    example_gloss:
    - لیلا موی بور دارد.
    - کریم موی قهوه‌یی دارد.
    - بابه کلان موهای خاکستری دارد.
  ar.a1.unit26.lesson02.teach.shar_twyl_shar:
    title: بلند و کوتاه (مو)
    gloss: بلند / کوتاه (مو)
    note: 'طويل (ṭawīl) و قصير (qaṣīr) مو را هم توصیف می‌کنند: شعر طويل (shaʿr ṭawīl)، شعر قصير (shaʿr qaṣīr). آن‌ها بعد از شعر می‌آیند که مذکر است.'
    example_gloss:
    - سارا موی بلند دارد.
    - کریم موی کوتاه دارد.
  ar.a1.unit26.lesson02.teach.alsfa_taty_bad:
    title: صفت بعد از اسم می‌آید
    gloss: 'در عربی صفت بعد از اسم می‌آید و با آن مطابقت می‌کند: شعر قصير (shaʿr qaṣīr)، شعر طويل (shaʿr ṭawīl)، شعر أشقر (shaʿr ashqar)، شعر بني (shaʿr bunnī)، شعر رمادي (shaʿr ramādī)، شعر أسود (shaʿr aswad).'
    note: شعر (shaʿr) مذکر است، بنابراین صفت‌هایش هم مذکر اند. وقتی اسم نکره باشد، هیچ‌کدام از دو کلمه ال نمی‌گیرد.
  ar.a1.unit26.lesson02.teach.ndyf_aldmyr_ha:
    title: مو و موی او
    gloss: شعر (shaʿr) یعنی «مو». ضمیر ها (hā، «او» برای زن) را اضافه کنید تا شعرها (shaʿruhā، موی او) شود.
    note: 'پسوند ها صاحب را نشان می‌دهد: شعرها (موی او)، اسمها (نام او)، عيناها (چشم‌های او). این پسوند به کلمه چسپیده نوشته می‌شود.'
  ar.a1.unit26.lesson02.teach.lywsf_shar_qsyr:
    title: یوسف موی کوتاه سیاه دارد
    gloss: یوسف موی کوتاه سیاه دارد.
    note: 'ليوسف شعر قصير أسود (li-yūsuf shaʿr qaṣīr aswad): ل (li-) پیش از نام یعنی «دارد» و به نام چسپیده است.'
  ar.a1.unit26.lesson02.teach.llyla_shar_twyl:
    title: لیلا موی بلند بور دارد
    gloss: لیلا موی بلند بور دارد.
    note: لغات درازی و رنگ این درس در یک جملهٔ طبیعی یکجا شده اند.
  ar.a1.unit26.lesson03.teach.alaynan:
    title: چشم‌ها
    gloss: چشم‌ها
    note: 'العينان (al-ʿaynān) یعنی «چشم‌ها». این اسم مثنی است: عربی برای دقیقاً دو تا پسوند خاص ان دارد.'
    example_gloss: یوسف چشم‌های قهوه‌یی دارد.
  ar.a1.unit26.lesson03.teach.azrq_bny_akhdr:
    title: آبی، قهوه‌یی و سبز
    gloss: آبی / قهوه‌یی / سبز
    note: 'أزرق (azraq) آبی، بني (bunnī) قهوه‌یی و أخضر (akhḍar) سبز شکل‌های مذکر استند. با عينان شکل‌های مثنی استفاده می‌شود: زرقاوان (zarqāwān)، بنيتان (bunnīyatān)، خضراوان (khaḍrāwān).'
    example_gloss:
    - لیلی چشم‌های آبی دارد.
    - کریم چشم‌های قهوه‌یی دارد.
    - سارا چشم‌های سبز دارد.
  ar.a1.unit26.lesson03.teach.aynan_mthna_ldhlk:
    title: چشم‌های مثنی، صفت مثنی
    gloss: 'عينان (ʿaynān) مثنی است، پس صفتش هم مثنی می‌شود: عينان زرقاوان (ʿaynān zarqāwān)، عينان بنيتان (ʿaynān bunnīyatān)، عينان خضراوان (ʿaynān khaḍrāwān).'
    note: در مثنی، پسوند ان هم به اسم و هم به صفت اضافه می‌شود. صفت مؤنث هم می‌آید، چون عين اسم مؤنث است.
  ar.a1.unit26.lesson03.teach.kyf_tbdw_lyla:
    title: لیلی چه شکلی است؟
    gloss: لیلی چه شکلی است؟
    note: كيف تبدو ليلى؟ (kayfa tabdū laylā?) می‌پرسد لیلی چه شکلی است. تبدو (tabdū) مؤنث است، چون لیلی یک زن است؛ برای مرد يبدو (yabdū) می‌آید.
  ar.a1.unit26.lesson03.teach.llyla_shar_twyl:
    title: لیلی موی بلند بور و چشم‌های آبی دارد
    gloss: لیلی موی بلند بور و چشم‌های آبی دارد.
    note: 'لليلى شعر طويل أشقر وعينان زرقاوان (li-laylā shaʿr ṭawīl ashqar wa-ʿaynān zarqāwān): ل + نام یعنی «دارد» و و موی و چشم‌ها را به هم وصل می‌کند.'
  ar.a1.unit26.lesson04.teach.lyla_staty_ftaa:
    title: لیلی نور را معرفی می‌کند
    gloss: 'لیلی: یک دختر نو به کافهٔ زبان‌ها می‌آید. نامش نور است.'
    note: 'ستأتي (sa-taʾtī) یعنی «او (زن) می‌آید»: س (sa-) نشانهٔ آینده است و ت (ta-) یعنی «او (زن)». اسمها (ismuhā) یعنی «نامش».'
  ar.a1.unit26.lesson04.teach.ywsf_hsna_kyf:
    title: یوسف می‌پرسد او چه شکلی است
    gloss: 'یوسف: خوب! چه شکلی است؟'
    note: 'كيف تبدو؟ (kayfa tabdū?) این بار نام ندارد: فعل تبدو خودش یعنی «او (زن) به نظر می‌آید».'
  ar.a1.unit26.lesson04.teach.lyla_hy_qsyra:
    title: لیلی قد و موی نور را توصیف می‌کند
    gloss: 'لیلی: او قد کوتاه دارد و موی کوتاه بور دارد.'
    note: قصيرة (qaṣīra) مؤنث است چون نور یک زن است، اما شعر قصير أشقر مذکر می‌ماند چون شعر اسم مذکر است.
  ar.a1.unit26.lesson04.teach.ywsf_waynaha:
    title: یوسف دربارهٔ چشم‌هایش می‌پرسد
    gloss: 'یوسف: و چشم‌هایش؟'
    note: 'وعيناها (wa-ʿaynāhā) یعنی «و چشم‌هایش»: و (wa-) به اسم وصل می‌شود و ها (hā) در آخر یعنی «اش» (او، زن).'
  ar.a1.unit26.lesson04.teach.lyla_lha_aynan:
    title: لیلی چشم‌های نور را توصیف می‌کند
    gloss: 'لیلی: چشم‌های سبز دارد.'
    note: 'لها (lahā) یعنی «او (زن) دارد»: ل (la-) + ها (hā). عينان خضراوان (ʿaynān khaḍrāwān) اسم مثنی با صفت مثنی است.'
  ar.a1.unit26.lesson04.teach.ywsf_shkra_idhn:
    title: یوسف او را می‌شناسد
    gloss: 'یوسف: تشکر! پس او را می‌شناسم.'
    note: 'سأتعرف عليها (sa-ataʿarraf ʿalayhā) یعنی «او (زن) را می‌شناسم»: س (sa-) نشانهٔ آینده است و ها در عليها یعنی «او (زن)».'
  ar.a1.unit26.lesson05.teach.sara_akht_krym:
    title: مقایسهٔ کریم و سارا
    gloss: کریم و سارا برادر و خواهر استند، اما از نظر ظاهر فرق دارند. کریم قد کوتاه دارد، موی کوتاه قهوه‌یی و چشم‌های قهوه‌یی دارد. سارا از کریم قد بلندتر است، موی بلند قهوه‌یی و چشم‌های سبز دارد. تو چه شکلی استی؟
    note: یک مقایسهٔ کوتاه که همهٔ لغات رنگ و درازی تا اینجا را دوباره به کار می‌برد و با سوال اصلی این بخش از خواننده تمام می‌شود.
    glosses:
      أخ: برادر
      أخت: خواهر
      تبدو: ظاهر شدن، به نظر آمدن
      مختلفان: فرق دار
      القامة: قد کوتاه
      قصير: کوتاه
      بني: قهوه‌یی
      شعر: مو
      بنيتان: قهوه‌یی
      وعينان: چشم‌ها
      أطول: قدبلندتر
      طويل: دراز
      خضراوان: سبز
      المظهر: ظاهر (شکل و قیافهٔ کسی)
  ar.a1.unit26.lesson05.teach.llmqarna_nstkhdm_afal:
    title: مقایسه با أفعل
    gloss: 'برای مقایسه، شکل أفعل (afʿal) + من (min) استفاده می‌شود: سارة أطول من كريم (sāra aṭwal min karīm)، سارا از کریم قد بلندتر است.'
    note: طويل (ṭawīl) در حالت تفضیلی أطول (aṭwal) می‌شود و من (min) یعنی «از». این شکل برای زن تغییر نمی‌کند.
  ar.a1.unit26.lesson05.teach.lsara_shar_atwl:
    title: موی سارا از موی کریم بلندتر است
    gloss: موی سارا از موی کریم بلندتر است.
    note: 'لسارة شعر أطول من شعر كريم (li-sāra shaʿr aṭwal min shaʿr karīm): أطول مذکر می‌ماند چون شعر اسم مذکر است.'
  ar.a1.unit26.lesson05.teach.ldy_shar_qsyr:
    title: موهایم کوتاه و قهوه‌یی است
    gloss: موهایم کوتاه و قهوه‌یی است.
    note: 'لدي (ladayya) یعنی «دارم»؛ در عربی فعل «داشتن» وجود ندارد. صفت‌ها بعد از اسم می‌آیند: شعر قصير بني (shaʿr qaṣīr bunnī).'
  ar.a1.unit26.lesson06.teach.ywsf_anzry_hl:
    title: یوسف نور را می‌بیند
    gloss: 'یوسف: ببین، این نور است؟ موی کوتاه بور و چشم‌های سبز دارد.'
    note: انظري (unẓurī) امر برای یک زن است، چون یوسف با لیلی صحبت می‌کند؛ برای مرد انظر (unẓur) می‌آید. هذه (hādhihi) یعنی «این» برای اسم مؤنث.
  ar.a1.unit26.lesson06.teach.lyla_nam_hdhh:
    title: لیلی تأیید می‌کند
    gloss: 'لیلی: بلی، این نور است!'
    note: یک تأیید کوتاه و طبیعی.
  ar.a1.unit26.lesson06.teach.nwr_mrhba_hl:
    title: نور به یوسف سلام می‌کند
    gloss: 'نور: سلام، شما یوسف استید؟'
    note: 'هل أنت يوسف؟ (hal anta yūsuf?) یک پرسش بلی/نخیر است: هل (hal) + جمله‌یی که فعل «بودن» ندارد.'
  ar.a1.unit26.lesson06.teach.ywsf_nam_tshrft:
    title: یوسف جواب سلام نور را می‌دهد
    gloss: 'یوسف: بلی! از آشنایی با شما خوشوقتم، نور.'
    note: تشرفت بمعرفتك (tasharraftu bi-maʿrifatika) عبارت مؤدبانه برای اولین دیدار است. ب (bi-) به معرفتك وصل می‌شود و ك در آخر یعنی «تو/شما».
  ar.a1.unit26.lesson06.teach.nwr_wana_ayda:
    title: نور جواب می‌دهد
    gloss: 'نور: من هم از آشنایی با شما خوشوقتم!'
    note: گفتگو را تمام می‌کند -- یوسف نور را از روی توصیف قبلی لیلی با موفقیت شناخت.
