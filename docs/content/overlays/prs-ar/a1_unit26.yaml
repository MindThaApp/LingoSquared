  description: 'عربی مقدماتی برای توصیف ظاهر اولیهٔ یک شخص: قد و سن، رنگ مو و چشم، سوال كيف تبدو؟ (kayfa tabdū?) و مقایسهٔ دو نفر با أطول من (aṭwal min).'
