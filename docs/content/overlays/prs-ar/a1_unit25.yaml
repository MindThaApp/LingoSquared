teaching:
  ar.a1.unit25.lesson01.teach.alqraaa_mmarsa_alryada:
    title: خواندن، ورزش، آشپزی
    gloss: خواندن، ورزش کردن، آشپزی کردن
    note: القراءة (al-qirāʾa) یعنی کتاب خواندن، ممارسة الرياضة (mumārasat ar-riyāḍa) یعنی ورزش کردن و الطبخ (aṭ-ṭabkh) یعنی آشپزی. هر کدام اسم است، به همین خاطر ال به آن چسپیده است.
    example_gloss:
    - کتاب خواندن را دوست دارم.
    - روزهای شنبه ورزش می‌کنم.
    - آشپزی برای دوستان را دوست دارم.
  ar.a1.unit25.lesson01.teach.wqt_alfragh:
    title: وقت آزاد
    gloss: وقت آزاد
    note: وقت الفراغ (waqt al-farāgh) در اصل یعنی «وقتِ فراغت». کلمهٔ اول ال ندارد؛ فقط کلمهٔ دوم ال می‌گیرد.
    example_gloss: در وقت آزادم کتاب خواندن را دوست دارم.
  ar.a1.unit25.lesson01.teach.fy_wqt_fraghy:
    title: گفتن اینکه در وقت آزاد چه می‌کنین
    gloss: در وقت آزادم کتاب خواندن را دوست دارم.
    note: أحب (uḥibb) یعنی دوست دارم و برای مرد و زن یکسان است. ي در آخر فراغي (farāghī) یعنی «من/ام».
  ar.a1.unit25.lesson02.teach.alastmaa_ila_almwsyqa:
    title: موسیقی، نقاشی، بازی ویدیویی
    gloss: گوش دادن به موسیقی، نقاشی کردن، بازی ویدیویی کردن
    note: الاستماع إلى الموسيقى (al-istimāʿ ilā al-mūsīqā) یعنی گوش دادن به موسیقی، الرسم (ar-rasm) یعنی نقاشی و لعب ألعاب الفيديو (laʿb alʿāb al-fīdiyū) یعنی بازی کردن بازی‌های ویدیویی.
    example_gloss:
    - دوست دارم موسیقی گوش کنم.
    - من اکثراً نقاشی می‌کنم.
    - دوست دارم با دوستانم ویدیوگیم بازی کنم.
  ar.a1.unit25.lesson02.teach.ahb_alastmaa_ila:
    title: گفتن اینکه موسیقی گوش کردن را دوست دارید
    gloss: دوست دارم موسیقی گوش کنم.
    note: 'الاستماع (al-istimāʿ) پیش از چیزی که به آن گوش می‌تین إلى (ilā، به) می‌خواهد: الاستماع إلى الموسيقى.'
  ar.a1.unit25.lesson02.teach.ahb_lab_alaab:
    title: گفتن اینکه با دوستان ویدیوگیم بازی کردن را دوست دارید
    gloss: دوست دارم با دوستانم ویدیوگیم بازی کنم.
    note: 'مع (maʿa) یعنی با: مع الأصدقاء (maʿa al-aṣdiqāʾ). ال به الأصدقاء چسپیده می‌ماند.'
  ar.a1.unit25.lesson03.teach.daima_kthyra_ahyana:
    title: همیشه، اکثراً، گاهی، هرگز
    gloss: همیشه، اکثراً، گاهی، هرگز
    note: دائما (dāʾiman)، كثيرا (kathīran)، أحيانا (aḥyānan) و أبدا (abadan) قید استند، بنابراین برای مذکر و مؤنث تغییر نمی‌کنند. الف آخر بدون هیچ علامه نوشته می‌شود.
    example_gloss:
    - من همیشه روزهای شنبه ورزش می‌کنم.
    - من اکثراً کتاب می‌خوانم.
    - من گاهی نقاشی می‌کنم.
    - من هرگز ویدیوگیم بازی نمی‌کنم.
  ar.a1.unit25.lesson03.teach.kl_asbwa_kl:
    title: هر هفته، هر آخر هفته
    gloss: هر هفته، هر آخر هفته
    note: كل أسبوع (kull usbūʿ) و كل عطلة نهاية أسبوع (kull ʿuṭlat nihāyat usbūʿ) هر دو از كل (kull، هر) استفاده می‌کنند؛ کارت بعدی را ببینین.
    example_gloss:
    - من هر هفته برای دوستانم آشپزی می‌کنم.
    - من هر آخر هفته ورزش می‌کنم.
  ar.a1.unit25.lesson03.teach.bad_kl_yaty:
    title: 'هر: كل'
    gloss: 'بعد از كل (kull، هر) اسم مفرد می‌آید و ال ندارد: كل أسبوع (kull usbūʿ)، كل عطلة نهاية أسبوع (kull ʿuṭlat nihāyat usbūʿ).'
    note: 'كل (kull) تغییر نمی‌کند: همان کلمه پیش از اسم مذکر مثل أسبوع و اسم مؤنث مثل عطلة استفاده می‌شود.'
  ar.a1.unit25.lesson03.teach.madha_tfal_fy:
    title: پرسیدن دربارهٔ وقت آزاد
    gloss: در وقت آزادت چه می‌کنی؟
    note: این سؤال اصلی این واحد است؛ با آن می‌توانین از هر کسی دربارهٔ سرگرمی‌هایش بپرسین.
  ar.a1.unit25.lesson04.teach.lyla_ntmsha_maa:
    title: لیلا از سرگرمی‌ها صحبت می‌کند
    gloss: 'لیلا: ما اکثراً با هم قدم می‌زنیم. اما یوسف، در وقت فارغ‌ات دیگر چه کار می‌کنی؟'
    note: حرف ن (na-) در اول نتمشى (natamashshā) یعنی «ما»، پس در عربی برای «ما» کلمهٔ جداگانه لازم نیست. معا (maʿan) یعنی با هم.
  ar.a1.unit25.lesson04.teach.ywsf_ahb_altbkh:
    title: سرگرمی‌های یوسف
    gloss: 'یوسف: آشپزی را دوست دارم، در خانه هم. و اکثراً ورزش می‌کنم.'
    note: في البيت أيضا (fī al-bayt ayḍan) یعنی «در خانه هم» را اضافه می‌کند. وأمارس (wa-umāris) و (و) را با فعل وصل می‌کند و یک کلمه نوشته می‌شود.
  ar.a1.unit25.lesson04.teach.lyla_hl_ttbkh:
    title: لیلا حیران می‌شود
    gloss: 'لیلا: در خانه هم آشپزی می‌کنی؟ تو که تمام روز در کارت آشپزی می‌کنی!'
    note: تطبخ (taṭbukh) فعل «تو» برای مرد است؛ برای یک زن می‌گویید تطبخين (taṭbukhīn). طوال اليوم (ṭawāl al-yawm) یعنی تمام روز.
  ar.a1.unit25.lesson04.teach.ywsf_nam_lknny:
    title: یوسف توضیح می‌دهد
    gloss: 'یوسف: بلی، اما آشپزی را آرام‌بخش می‌دانم. و تو، چه کاری را دوست داری؟'
    note: 'أجد (ajid) یعنی می‌یابم و مريحا (murīḥan) یعنی آرام‌بخش. وأنت (wa-anta) یعنی و به أنت وصل شده: و تو.'
  ar.a1.unit25.lesson04.teach.lyla_ahb_alqraaa:
    title: سرگرمی‌های لیلا
    gloss: 'لیلا: کتاب خواندن را دوست دارم و اکثراً به موسیقی گوش می‌دهم.'
    note: 'و دو سرگرمی را وصل می‌کند: أحب القراءة (uḥibb al-qirāʾa) و وأستمع (wa-astamiʿ، و گوش می‌دهم). و به کلمهٔ بعدی چسپیده نوشته می‌شود.'
  ar.a1.unit25.lesson04.teach.ywsf_hl_tlabyn:
    title: یوسف از بازی‌های ویدیویی می‌پرسد
    gloss: 'یوسف: تو هم گیم می‌کنی؟'
    note: تلعبين (talʿabīn) فعل «تو» برای یک زن است، چون یوسف از لیلا می‌پرسد؛ برای مرد تلعب (talʿab) است. هل (hal) سؤال بلی/نخیر را شروع می‌کند.
  ar.a1.unit25.lesson04.teach.lyla_la_la:
    title: لیلا جواب می‌دهد
    gloss: 'لیلا: نخیر، هرگز گیم نمی‌کنم. اما گاهی نقاشی می‌کنم!'
    note: 'أبدا (abadan) یعنی هرگز و أحيانا (aḥyānan) یعنی گاهی. فعل با لا (lā) منفی می‌شود: لا ألعب (lā alʿab) یعنی بازی نمی‌کنم.'
  ar.a1.unit25.lesson05.teach.ana_wywsf_ntmsha:
    title: مقایسهٔ سرگرمی‌ها
    gloss: من و یوسف اکثراً با هم قدم می‌زنیم. اما سرگرمی‌های دیگر هم داریم. یوسف آشپزی را دوست دارد، در خانه هم، و اکثراً ورزش می‌کند. من کتاب خواندن را دوست دارم و اکثراً به موسیقی گوش می‌دهم. گاهی نقاشی می‌کنم، اما هرگز گیم نمی‌کنم. تو در وقت فارغ‌ات چه کار کردن را دوست داری؟
    note: پیام لیلا حقایق درس قبلی را خلاصه می‌کند و با سؤال اصلی این واحد به پایان می‌رسد.
    glosses:
      نتمشى: قدم می‌زنیم
      كثيرا: اکثراً
      معا: با هم
      أخرى: دیگر
      يطبخ: آشپزی می‌کند
      يحب: دوست دارد
      البيت: خانه (در خانه)
      ويمارس: ورزش می‌کند
      أقرأ: خواندن
      وأستمع: گوش می‌کنم
      الموسيقى: موسیقی
      أرسم: نقاشی می‌کنم
      أحيانا: گاهی
      ألعب: بازی کردن (بازی‌های ویدیویی)
      أبدا: هرگز
      فراغك: وقت فارغ‌ات
      وقت: وقت
  ar.a1.unit25.lesson06.teach.ywsf_madha_stfalyn:
    title: یوسف از آخر هفته می‌پرسد
    gloss: 'یوسف: آخر این هفته چه کار می‌کنی؟'
    note: 'ستفعلين (sa-tafʿalīn) آینده است: حرف س (sa-) آن را نشان می‌دهد و پایانهٔ ين برای یک زن است. عطلة نهاية الأسبوع (ʿuṭlat nihāyat al-usbūʿ) یعنی آخر هفته.'
  ar.a1.unit25.lesson06.teach.lyla_la_aarf:
    title: لیلا مردد است
    gloss: 'لیلا: هنوز نمی‌دانم. کتاب خواندن را دوست دارم، اما بیرون رفتن هم می‌خواهم.'
    note: لا أعرف بعد (lā aʿrif baʿd) یعنی هنوز نمی‌دانم. أن أخرج (an akhruj) یعنی بیرون بروم.
  ar.a1.unit25.lesson06.teach.ywsf_hl_ntmsha:
    title: یوسف یک پلان پیشنهاد می‌کند
    gloss: 'یوسف: با هم قدم بزنیم؟ بعدش برای ما آشپزی می‌کنم.'
    note: 'هل نتمشى (hal natamashshā) طریقهٔ معمول پیشنهاد کردن یک کار با هم است: هل + فعل «ما». لنا (lanā) یعنی ل (برای) + نا (ما) و یک کلمه نوشته می‌شود.'
  ar.a1.unit25.lesson06.teach.lyla_fkra_jyda:
    title: لیلا موافقت می‌کند
    gloss: 'لیلا: فکر خوب است! هم قدم زدن را دوست دارم هم آشپزی را.'
    note: 'كليهما (kilayhimā) یعنی هر دو و در آخر می‌آید و به آن دو چیز اشاره می‌کند: المشي والطبخ (al-mashy wa-aṭ-ṭabkh).'
  ar.a1.unit25.lesson06.teach.ywsf_mmtaz_idhn:
    title: یوسف تأیید می‌کند
    gloss: 'یوسف: عالی. پس روز شنبه می‌بینمت!'
    note: يوم السبت (yawm as-sabt) یعنی روز شنبه. ل در ال پیش از س، که حرف شمسی است، تلفظ نمی‌شود، به همین خاطر as-sabt می‌نویسیم.
