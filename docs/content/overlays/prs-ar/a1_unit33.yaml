  ar.a1.unit33.lesson05.teach.bad_alhfla_ams:
    title: کی در خانه چه کار می‌کند؟
    gloss: یوسف از محفلهٔ دیروز خسته است. امروز کارهای خانه را می‌کند. لیلی به یوسف کمک می‌کند. یوسف آشپزخانه را مرتب می‌کند و لیلی تالار را با جاروبرقی پاک می‌کند. یوسف کالاها را هم می‌شوید. لیلی و یوسف باهم خوب کار می‌کنند.
    note: یک متن کوتاه دربارهٔ کارهای خانه. توجه کنید که هر فعل برای یوسف با ي و برای لیلی با ت شروع می‌شود.
