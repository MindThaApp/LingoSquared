teaching:
  ar.a1.unit06.lesson01.teach.family:
    title: خانواده
    gloss: خانواده
    note: عائلة (ʿāʾila) کلمهٔ عمومی برای فامیل/خانواده است. در مثال، هذه شکل مؤنث هذا (این) است، چون عائلة مؤنث است.
