  ar.a1.unit06.lesson01.teach.father:
    title: پدر
    gloss: پدر
    note: أب (ab) یعنی پدر.
    example_gloss: من یک پدر دارم.
  ar.a1.unit06.lesson01.teach.mother:
    title: مادر
    gloss: مادر
    note: أم (umm) یعنی مادر.
    example_gloss: من یک مادر دارم.
  ar.a1.unit06.lesson01.teach.brother:
    title: برادر
    gloss: برادر
    note: أخ (akh) یعنی برادر.
    example_gloss: من یک برادر دارم.
  ar.a1.unit06.lesson01.teach.sister:
    title: خواهر
    gloss: خواهر
    note: أخت (ukht) یعنی خواهر.
    example_gloss: من یک برادر و یک خواهر دارم.
  ar.a1.unit06.lesson01.teach.i_have:
    title: من دارم
    gloss: من دارم
    note: عندي (ʿindī، در اصل «نزد من») راه ساده در سطح A1 برای گفتن «دارم» است؛ لدي (ladayya) معادل رسمی‌تر آن است.
    example_gloss: من یک خواهر دارم.
  ar.a1.unit06.lesson02.teach.in_family:
    title: در فامیل تو
    gloss: در فامیل تو
    note: 'در اینجا من به معنای «man»، یعنی «کی»، است؛ نه «min» به معنای «از» مثل من أين أنت؟ — این دو یکسان نوشته می‌شوند. عائلتك یعنی فامیل تو: ʿāʾilatuka برای مرد و ʿāʾilatuki برای زن.'
    example_gloss: در فامیل تو کی‌ها استند؟
  ar.a1.unit06.lesson02.teach.sister_name:
    title: نامش نور است
    gloss: نامش نور است
    note: اسمها یعنی نامش (نام او، برای زن).
    example_gloss: 'یوسف گفت: نامش نور است.'
  ar.a1.unit06.lesson02.teach.line01:
    title: دربارهٔ فامیل بپرسین
    gloss: لیلی می‌پرسد که در فامیل یوسف کی‌ها استند.
    note: من («man») در اینجا یعنی «کی». يا يوسف یعنی صدا کردن یوسف با نامش.
    example_gloss: 'لیلی گفت: در فامیل تو کی‌ها استند، یوسف؟'
  ar.a1.unit06.lesson02.teach.line02:
    title: فامیل را معرفی کنید
    gloss: یوسف می‌گوید که پدر، مادر و یک خواهر دارد.
    note: و اعضای فامیل را به هم وصل می‌کند.
    example_gloss: 'یوسف گفت: من پدر، مادر و یک خواهر دارم.'
  ar.a1.unit06.lesson02.teach.line03:
    title: نام خواهر را بپرسین
    gloss: لیلی نام خواهر او را می‌پرسد.
    note: 'أختك یعنی خواهر تو: ukhtuka برای مرد و ukhtuki برای زن. در اینجا لیلی از یوسف می‌پرسد، پس ukhtuka.'
    example_gloss: 'لیلی گفت: نام خواهرت چیست؟'
  ar.a1.unit06.lesson02.teach.line04:
    title: نام او را بگویین
    gloss: یوسف می‌گوید نامش نور است.
    note: 'پایانهٔ ـها یعنی «او» (برای زن): اسمها (ismuhā)، نام او.'
    example_gloss: 'یوسف گفت: نامش نور است.'
