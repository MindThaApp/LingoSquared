teaching:
  ar.a1.unit01.lesson01.teach.rtl:
    title: عربی از راست به چپ نوشته می شود
    gloss: عربی از راست به چپ نوشته می شود.
    note: عربی را از کنارهٔ راست به طرف چپ بخوانین.
  ar.a1.unit01.lesson01.teach.mim:
    title: حرف م
    gloss: m
    note: م صدای m را می دهد و بر حسب جای آن در کلمه، شکلش تغییر می کند.
  ar.a1.unit01.lesson01.teach.ra:
    title: حرف ر
    gloss: r
    note: ر صدای r غلتان را می دهد و به حرف بعد از خود وصل نمی شود.
  ar.a1.unit01.lesson01.teach.ha:
    title: حرف ح
    gloss: ḥ
    note: ح یک صدای h نفس دار است که از عمق گلو بیرون می شود و با h ساده فرق دارد.
  ar.a1.unit01.lesson01.teach.ba:
    title: حرف ب
    gloss: b
    note: ب صدای b را می دهد و به حرف های دور و برش وصل می شود.
  ar.a1.unit01.lesson01.teach.alef:
    title: حرف ا
    gloss: ā / a
    note: ا نشانهٔ مصوت بلند ā است و به حرف بعدی وصل نمی شود.
  ar.a1.unit01.lesson01.teach.marhaba_shape:
    title: کلمهٔ مرحبا را بسازید
    gloss: سلام
    note: مرحبا «marḥaban» خوانده می شود. مصوت های کوتاه معمولاً در نوشتهٔ عربی نمی آیند.
    example_gloss: سلام! من سارا استم.
  ar.a1.unit01.lesson02.teach.marhaba:
    title: سلام
    gloss: سلام
    note: مرحبا یک سلام گرم و همه کاره است که تقریباً در هر موقعیت مناسب است.
    example_gloss: سلام، چطور استی؟
  ar.a1.unit01.lesson02.teach.sabah_alkhayr:
    title: صبح بخیر
    gloss: صبح بخیر
    note: صباح الخير «ṣabāḥ al-khayr» خوانده می شود و معنی لفظی آن «صبحِ خیر» است.
  ar.a1.unit01.lesson02.teach.masaa_alkhayr:
    title: عصر بخیر یا شام بخیر
    gloss: عصر بخیر / شام بخیر
    note: مساء الخير «masāʾ al-khayr» خوانده می شود و از اواخر بعد از چاشت تا شب استفاده می شود.
  ar.a1.unit01.lesson02.teach.maa_alsalama:
    title: خداحافظی
    gloss: خداحافظ
    note: مع السلامة «maʿa as-salāma» خوانده می شود و معنی لفظی آن «با سلامتی» است؛ خداحافظی عمومی و معمول است.
    example_gloss: تشکر، خدا حافظ!
  ar.a1.unit01.lesson02.teach.shukran:
    title: تشکر
    gloss: تشکر
    note: شكرا «shukran» خوانده می شود و در هر موقعیت قابل استفاده است.
    example_gloss: بسیار تشکر.
  ar.a1.unit01.lesson02.teach.afwan:
    title: خواهش می کنم
    gloss: خواهش می‌کنم
    note: عفوا «ʿafwan» جواب معمول شكرا است؛ در موقعیت دیگر می تواند معنی «معذرت می‌خواهم» هم بدهد.
  ar.a1.unit01.lesson03.teach.tusbih_ala_khayr:
    title: شب بخیر
    gloss: شب بخیر
    note: تصبح على خير «tuṣbiḥ ʿalā khayr» وقتی گفته می شود که از هم جدا می شوین یا وقت خواب است، نه به حیث سلام اول. تصبح برای مرد گفته می شود؛ برای زن تصبحين على خير «tuṣbiḥīna ʿalā khayr» می گویند.
  ar.a1.unit01.lesson03.teach.ahlan_wa_sahlan:
    title: خوش آمدید
    gloss: خوش آمدید
    note: أهلا وسهلا «ahlan wa sahlan» برای خوش آمدید گفتن به مهمان یا سلام گرم هنگام رسیدن استفاده می شود.
    example_gloss: خوش آمدید! خوش آمدید.
  ar.a1.unit01.lesson03.teach.ila_alliqaa:
    title: به امید دیدار
    gloss: به امید دیدار / تا وقت دیدار
    note: إلى اللقاء «ilā al-liqāʾ» یک خداحافظی رسمی و بی طرف است.
  ar.a1.unit01.lesson03.teach.sabah_alnoor:
    title: صبح بخیر، جواب
    gloss: صبح بخیر [جواب]
    note: صباح النور «ṣabāḥ an-nūr»، یعنی «صبحِ نور»، جواب معمول صباح الخير است.
  ar.a1.unit01.lesson03.teach.masaa_alnoor:
    title: شام بخیر، جواب
    gloss: شام بخیر [جواب]
    note: مساء النور «masāʾ an-nūr» جواب معمول مساء الخير است.
  ar.a1.unit01.lesson03.teach.yawman_saeedan:
    title: روز خوش
    gloss: روز خوش
    note: يوما سعيدا «yawman saʿīdan» یک آرزوی گرم هنگام خداحافظی است.
  ar.a1.unit01.lesson04.teach.kayfa_haluk:
    title: حال تان چطور است؟
    gloss: شما چطور استید؟
    note: كيف حالك؟ «kayfa ḥāluk» طریقهٔ معمول احوال پرسیدن است؛ بدون اعراب، شکل نوشته شده برای هر شنونده درست است.
  ar.a1.unit01.lesson04.teach.gender_note:
    title: «تو» برای مذکر و مؤنث
    gloss: تو (مذکر) / تو (مؤنث)
    note: در عربی گفتاری أنتَ «anta»، برای مرد، از أنتِ «anti»، برای زن، فرق می شود؛ حالَك و حالِك هم به همین شکل. بدون اعراب که اینجا نشان داده شده، شکل های نوشته شده در این کورس برای هر دو یکسان است.
  ar.a1.unit01.lesson04.teach.bikhayr:
    title: خوب / خیریت
    gloss: خوب / خیریت
    note: بخير «bikhayr» جواب مثبت معمول كيف حالك؟ است.
    example_gloss: امروز خوب استم.
  ar.a1.unit01.lesson04.teach.alhamdulillah:
    title: شکر خدا
    gloss: شکر خدا / الحمد لله
    note: الحمد لله «al-ḥamdu lillāh» در جواب اکثراً بعد از بخير می آید، صرف نظر از اینکه گوینده چقدر دین دار باشد؛ مثل «شکر خدا» در دری، یک جملهٔ معمول پایان گفتگو است.
    example_gloss: خوب استم، شکر خدا.
  ar.a1.unit01.lesson04.teach.wa_anta:
    title: و شما؟
    gloss: و شما؟
    note: وأنت؟ «wa anta» برای مرد و «wa anti» برای زن، سؤال را برمی گرداند؛ در نوشتهٔ بدون اعراب هر دو یکسان است.
  ar.a1.unit01.lesson04.teach.mumtaz:
    title: عالی
    gloss: عالی / بسیار خوب
    note: ممتاز «mumtāz» یک درجهٔ پرشور بالاتر از بخير است.
    example_gloss: امروز بسیار عالی استم!
  ar.a1.unit01.lesson04.teach.la_bas:
    title: بد نیست
    gloss: بد نیست
    note: لا بأس «lā baʾs» یک جواب طبیعی و متوسط است، نه شکایت.
