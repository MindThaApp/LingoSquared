teaching:
  ar.a1.unit02.lesson01.teach.ma_ismuka:
    title: نام شما چیست؟
    gloss: نام شما چیست؟
    note: ما اسمك؟ (mā ismuk) راه معمول پرسیدن نام است؛ شکل نوشتاری بدون حرکات برای هر شنونده درست است.
  ar.a1.unit02.lesson01.teach.ismee:
    title: نام من
    gloss: نام من [است]
    note: اسمي (ismī) از اسم (نام) و پسوند ملکی ـي (من) ساخته شده است.
    example_gloss: نام من کریم است.
  ar.a1.unit02.lesson01.teach.ana:
    title: من
    gloss: من
    note: أنا (anā) ضمیر مستقل «من» است؛ فعل‌های عربی شخص را خودشان هم نشان می‌دهند، اما أنا برای تأکید و در جمله‌های ساده‌ای مثل این استفاده می‌شود.
    example_gloss: من سارا استم.
  ar.a1.unit02.lesson01.teach.tasharrafna:
    title: از آشنایی خوشحال شدم
    gloss: از آشنایی تان خوشحال شدم
    note: تشرفنا (tasharrafnā) در اصل یعنی «ما مفتخر شدیم»؛ جواب متقابل معمول هنگام آشنایی است و هر یک از دو نفر می‌تواند اول بگوید.
  ar.a1.unit02.lesson02.teach.min_ayna:
    title: تو از کجا استی؟
    gloss: شما از کجا استید؟
    note: من أين أنت؟ (min ayna anta برای مرد، min ayna anti برای زن) دربارهٔ اصل و وطن کسی می‌پرسد؛ شکل نوشتاری بدون حرکات برای هر دو یکسان است.
  ar.a1.unit02.lesson02.teach.ana_min:
    title: من از ... استم
    gloss: من از ... استم
    note: أنا من (anā min) مستقیم با نام کشور یا شهر دنبال می‌شود.
  ar.a1.unit02.lesson02.teach.lubnan:
    title: لبنان
    gloss: لبنان
    note: لبنان (lubnān) برخلاف بیشتر کشورهای دیگر این درس، ال تعریف نمی‌گیرد.
    example_gloss: من از لبنان استم.
  ar.a1.unit02.lesson02.teach.misr:
    title: مصر
    gloss: مصر
    note: مصر (miṣr) هم ال تعریف نمی‌گیرد.
    example_gloss: من از مصر استم.
  ar.a1.unit02.lesson02.teach.urdun:
    title: اردن
    gloss: اردن
    note: الأردن (al-ʾurdun) همیشه ال تعریف را به‌عنوان بخشی از نامش دارد، مثل المغرب و العراق در این درس.
    example_gloss: من از اردن استم.
  ar.a1.unit02.lesson02.teach.maghrib:
    title: مراکش
    gloss: مراکش
    note: المغرب (al-maghrib) در اصل یعنی «غرب» — از همان ریشه‌ای که برای وقت نماز شام (مغرب) استفاده می‌شود.
    example_gloss: من از مراکش استم.
  ar.a1.unit02.lesson02.teach.soorya:
    title: سوریه
    gloss: سوریه
    note: سوريا (sūryā) «ال» تعریف نمی‌گیرد.
    example_gloss: من از سوریه استم.
  ar.a1.unit02.lesson02.teach.iraq:
    title: عراق
    gloss: عراق
    note: العراق (al-ʿirāq) «ال» تعریف می‌گیرد.
    example_gloss: من از عراق استم.
  ar.a1.unit02.lesson03.teach.hal_anta_min:
    title: آیا شما از ... استید؟
    gloss: آیا شما از مصر استید؟
    note: هل (hal) نشانهٔ سوال بلی/نخیر است که در اول جمله می‌آید و خودش معنای جداگانه ندارد.
  ar.a1.unit02.lesson03.teach.naam:
    title: بلی
    gloss: بلی
    note: نعم (naʿam) جواب مثبت معمول است.
    example_gloss: بلی، من از مصر استم.
  ar.a1.unit02.lesson03.teach.laa:
    title: نخیر
    gloss: نخیر
    note: لا (lā) جواب منفی معمول است.
    example_gloss: نخیر، من از لبنان استم.
  ar.a1.unit02.lesson03.teach.saidtu_biliqaaik:
    title: از دیدنتان خوش شدم
    gloss: از دیدنتان خوش شدم
    note: سعدت بلقائك (saʿidtu bi-liqāʾik) عبارت گرم‌تری از تشرفنا است و اکثراً درست پیش از خدا حافظی گفته می‌شود.
  ar.a1.unit02.lesson03.teach.marhaban_bik:
    title: خوش آمدید
    gloss: خوش آمدی / اینجا خوش آمدی
    note: 'مرحبا بك (marḥaban bik) کلمهٔ بك را اضافه دارد، یعنی «برای تو»: حرف اضافهٔ بـ با ضمیر ـك (تو) که به آن چسپیده است — همان بك که در أهلا بك هم هست.'
  ar.a1.unit02.lesson04.teach.line01:
    title: سلام اول
    gloss: یوسف به لیلی سلام می‌دهد.
    note: گفتگو پیش از معرفی نام‌ها با یک مرحبا ساده شروع می‌شود.
  ar.a1.unit02.lesson04.teach.line02:
    title: سلام اول، جواب
    gloss: لیلی جواب سلامش را می‌دهد.
    note: همین کلمهٔ مرحبا برای هر دو طرف سلام کار می‌رود.
  ar.a1.unit02.lesson04.teach.line03:
    title: پرسیدن نام
    gloss: یوسف نام او را می‌پرسد.
    note: ما اسمك؟ معرفی را شروع می‌کند.
  ar.a1.unit02.lesson04.teach.line04:
    title: پرسیدن نام، جواب
    gloss: لیلی جواب می‌دهد و از او هم می‌پرسد.
    note: وأنت؟ به جای تکرار تمام جمله، سوال را کوتاه می‌کند؛ این یک راه کوتاه معمول است.
  ar.a1.unit02.lesson04.teach.line05:
    title: جواب و خوشی متقابل
    gloss: یوسف نامش را می‌گوید و می‌گوید که از آشنایی با او خوش شده.
    note: تشرفنا تبادلهٔ نام‌ها را ختم می‌کند.
  ar.a1.unit02.lesson04.teach.line06:
    title: خوشی متقابل، جواب
    gloss: لیلی همین عبارت را جواب می‌دهد.
    note: تشرفنا را طبیعتاً هر دو نفر می‌گویند، نه فقط یک نفر.
  ar.a1.unit02.lesson04.teach.line07:
    title: پرسیدن اصلیت
    gloss: یوسف می‌پرسد که او از کجا است.
    note: من أين أنت؟ گفتگو را به موضوع اصلیت می‌برد.
  ar.a1.unit02.lesson04.teach.line08:
    title: پرسیدن اصلیت، جواب
    gloss: لیلی جواب می‌دهد و از او هم می‌پرسد.
    note: او دوباره وأنت؟ را به کار می‌برد، همان راه کوتاه «line04».
  ar.a1.unit02.lesson04.teach.line09:
    title: گفتن اصلیت
    gloss: یوسف می‌گوید که از لبنان است.
    note: أنا من لبنان همان الگویی را دارد که در «lesson02» آموختید.
  ar.a1.unit02.lesson04.teach.line10:
    title: ختم صحبت
    gloss: لیلی می‌گوید که از دیدن او خوش شده.
    note: سعدت بلقائك نشان می‌دهد که گفتگو طبیعتاً به پایان نزدیک می‌شود.
  ar.a1.unit02.lesson04.teach.line11:
    title: خدا حافظی
    gloss: یوسف می‌گوید که هر وقت خوش آمدی و خدا حافظی می‌کند.
    note: دائما (همیشه / هر وقت) مرحبا بك را پیش از خدا حافظی مع السلامة به یک دعوت باز تبدیل می‌کند.
  ar.a1.unit02.lesson04.teach.line12:
    title: خدا حافظی، جواب
    gloss: لیلی خدا حافظی می‌کند.
    note: مع السلامة گفتگو را ختم می‌کند؛ در a1_unit01 آموخته شد.
