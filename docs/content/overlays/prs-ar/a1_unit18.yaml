teaching:
  ar.a1.unit18.lesson01.teach.work:
    title: کار
    gloss: کار
    note: 'عمل (ʿamal) یعنی کار. ما عملك؟ دربارهٔ کار کسی می‌پرسد؛ پایانهٔ ـك یعنی «تان/ت»: ʿamaluka برای مرد و ʿamaluki برای زن، که یکسان نوشته می‌شوند.'
    example_gloss: کار شما چیست؟
  ar.a1.unit18.lesson01.teach.engineer:
    title: انجنیر
    gloss: انجینر
    note: مهندس (muhandis) شکل مذکر است و برای یوسف استفاده می‌شود؛ یک خانم می‌گوید أنا مهندسة (anā muhandisa).
    example_gloss: من انجینر استم.
  ar.a1.unit18.lesson01.teach.office:
    title: دفتر
    gloss: دفتر
    note: مكتب (maktab) یعنی دفتر؛ في مكتب یعنی در یک دفتر.
    example_gloss: من در یک دفتر کار می‌کنم.
  ar.a1.unit18.lesson01.teach.workplace_sentence:
    title: در یک دفتر کار می‌کنم
    gloss: در یک دفتر کار می‌کنم
    note: أعمل (aʿmal) یعنی کار می‌کنم؛ ریشه‌اش با عمل (کار) یکی است و أ در اول «من» را نشان می‌دهد.
    example_gloss: 'یوسف گفت: در یک دفتر کار می‌کنم.'
  ar.a1.unit18.lesson02.teach.write:
    title: می‌نویسم
    gloss: می‌نویسم
    note: أكتب (aktub) یعنی می‌نویسم.
    example_gloss: در کار می‌نویسم.
  ar.a1.unit18.lesson02.teach.read:
    title: می‌خوانم
    gloss: می‌خوانم
    note: أقرأ (aqraʾ) یعنی می‌خوانم.
    example_gloss: در کار می‌خوانم.
  ar.a1.unit18.lesson02.teach.at_work:
    title: در کار
    gloss: در کار
    note: العمل (al-ʿamal) یعنی کار؛ في العمل یعنی در کار.
    example_gloss: در کار می‌نویسم و می‌خوانم.
  ar.a1.unit18.lesson02.teach.line01:
    title: پرسیدن از کار
    gloss: لیلی از یوسف دربارهٔ کارش می‌پرسد.
    note: يا يوسف یوسف را با نامش صدا می‌کند.
    example_gloss: 'لیلی گفت: یوسف، کارت چیست؟'
  ar.a1.unit18.lesson02.teach.line02:
    title: گفتن شغل
    gloss: یوسف می‌گوید که انجنیر است.
    note: برای «هستم» کلمهٔ جداگانه لازم نیست.
    example_gloss: 'یوسف گفت: من انجنیر هستم.'
  ar.a1.unit18.lesson02.teach.line03:
    title: گفتن جای کار
    gloss: یوسف می‌گوید در یک دفتر کار می‌کند.
    note: أعمل في جای کار را می‌گوید.
    example_gloss: 'یوسف گفت: در یک دفتر کار می‌کنم.'
  ar.a1.unit18.lesson02.teach.line04:
    title: پرسیدن از مصروفیت
    gloss: لیلی می‌پرسد یوسف هر روز چه کار می‌کند.
    note: 'این سوال روزمره دوباره آمده است؛ تفعل برای مرد است. برای یک خانم: ماذا تفعلين كل يوم؟'
    example_gloss: 'لیلی گفت: هر روز چه کار می‌کنی؟'
  ar.a1.unit18.lesson02.teach.line05:
    title: گفتن مصروفیت
    gloss: یوسف می‌گوید در کار می‌نویسد و می‌خواند.
    note: 'و (wa، یعنی «و») دو کار را وصل می‌کند و به کلمهٔ بعدی چسپیده نوشته می‌شود: وأقرأ.'
    example_gloss: 'یوسف گفت: در کار می‌نویسم و می‌خوانم.'
