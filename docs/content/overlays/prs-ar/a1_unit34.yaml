  ar.a1.unit34.lesson05.teach.ywsf_yskn_fy:
    title: در محله کی کیست؟
    gloss: یوسف در یک محلهٔ زیبا در اسکندریه، نزدیک سوپرمارکت زندگی می‌کند. سامی همسایهٔ یوسف (مرد) و مریم همسایهٔ یوسف (زن) است. سامی خیلی مهربان است و هر روز به یوسف سلام می‌دهد. یوسف سامی و مریم را خوب می‌شناسد.
    note: 'یک متن کوتاه دربارهٔ همسایه‌ها. جار (jār) همسایهٔ مرد و جارة (jāra) همسایهٔ زن است: ختم ة نشانهٔ مؤنث است.'
    glosses:
      يسكن: زندگی می‌کند
      جميل: خوب
      حي: محل
      قريب: نزدیک
      السوبرماركت: سوپرمارکیت
      جار: همسایهٔ مرد
      جارة: همسایهٔ زن
