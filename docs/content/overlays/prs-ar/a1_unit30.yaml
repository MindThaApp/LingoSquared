  ar.a1.unit30.lesson03.teach.albhth_an:
    title: جستجو کردن
    gloss: جستجو کردن
    example_gloss: من پیش‌بینی هوا را جستجو می‌کنم.
  ar.a1.unit30.lesson03.teach.alfal_abhth_yaty:
    title: فعلی با عن
    gloss: 'بعد از فعل أبحث (abḥath) حرف عن (ʿan) می‌آید: أبحث عن توقعات الطقس (abḥath ʿan tawaqquʿāt aṭ-ṭaqs). اما أستخدم (astakhdim) مفعولش را مستقیم می‌گیرد: أستخدم هاتفي.'
    note: عن (ʿan) یعنی «دربارهٔ» یا «برای». هر فعل عربی حرف اضافهٔ خودش را دارد، پس آن‌ها را با هم یاد بگیرین.
  ar.a1.unit30.lesson03.teach.krym_ybhth_an:
    title: کریم پیش‌بینی هوا را جستجو می‌کند
    gloss: کریم پیش‌بینی هوا را جستجو می‌کند.
  ar.a1.unit30.lesson03.teach.thm_ydhhb_llrkd:
    title: بعد برای دویدن بیرون می‌رود
    gloss: بعد برای دویدن بیرون می‌رود.
    note: 'ثم (thumma) یعنی «بعد»، و یک کلمهٔ جداگانه است، برخلاف و. يذهب للركض (yadhhab li-r-rakḍ) یعنی «برای دویدن می‌رود»: ل + الركض می‌شود للركض.'
  ar.a1.unit30.lesson04.teach.lyla_hl_nmars:
    title: لیلا پیشنهاد می‌کند
    gloss: 'لیلا: روز شنبه ساعت ده ورزش کنیم؟'
  ar.a1.unit30.lesson04.teach.ywsf_fkra_jyda:
    title: یوسف موافقت می‌کند
    gloss: 'یوسف: فکر خوبی است! پیش‌بینی هوا را می‌بینم.'
    note: 'فكرة جيدة (fikra jayyida): صفت جيدة مثل اسم به ة ختم می‌شود، چون هر دو مؤنث اند. سأبحث (sa-abḥath) زمان آینده است: س + أبحث.'
  ar.a1.unit30.lesson04.teach.ywsf_aljw_mshms:
    title: یوسف هوا را بررسی می‌کند
    gloss: 'یوسف: روز شنبه هوا آفتابی است!'
    note: الجو مشمس (al-jaww mushmis) یعنی «هوا آفتابی است»، بدون کلمهٔ «است». مشمس مذکر است تا با الجو مطابقت کند.
  ar.a1.unit30.lesson04.teach.krym_ara_alrsala:
    title: کریم پیام را می‌بیند
    gloss: 'کریم: پیام را دیدم. روز شنبه می‌بینمت!'
  ar.a1.unit30.lesson04.teach.ila_allqaa_abara:
    title: إلى اللقاء + یک روز
    gloss: 'إلى اللقاء (ilā al-liqāʾ، خداحافظ) را می‌دانین. می‌توانین یک روز هم بیفزایید: إلى اللقاء يوم السبت (ilā al-liqāʾ yawm as-sabt)، إلى اللقاء غدا (ilā al-liqāʾ ghadan).'
    note: الگوی خداحافظی بخش سلام و احوالپرسی را به یک روز مشخص گسترش می‌دهد.
  ar.a1.unit30.lesson05.teach.lyla_ttsl_bywsf:
    title: کی از چه چیز استفاده می‌کند؟
    gloss: لیلا هر روز به یوسف زنگ می‌زند. او از تیلفونش کار می‌گیرد، نه از اپلیکیشن. یوسف در خانه کمپیوتر ندارد، اما در تیلفونش از انترنت استفاده می‌کند. کریم هر صبح پیش‌بینی هوا را می‌جوید. بعد برای دویدن می‌رود. سارا اکثراً برای لیلا پیام می‌فرستد. آیا شما هم هر روز از تیلفون تان استفاده می‌کنین؟
    note: عادت‌های استفاده از وسایل هر چهار شخصیت را مقایسه می‌کند، مثل متن مقایسه‌ای بخش ورزش.
    glosses:
