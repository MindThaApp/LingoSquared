  ar.a1.unit30.lesson06.teach.lyla_ara_alrsala:
    title: لیلا پلان را تأیید می‌کند
    gloss: 'لیلا: پیام را دیدم. روز شنبه ساعت ده در باغ ورزش کنیم؟'
  ar.a1.unit30.lesson06.teach.ywsf_nam_waljw:
    title: یوسف هوا را تأیید می‌کند
    gloss: 'یوسف: بلی، و روز شنبه هوا آفتابی است!'
  ar.a1.unit30.lesson06.teach.krym_sarkd_idhn:
    title: پلان کریم
    gloss: 'کریم: پس من می‌دوم. بعدش فوتبال هم بازی می‌کنم.'
    note: 'سأركض (sa-arkuḍ) یعنی «خواهم دوید»: س آینده را نشان می‌دهد. بعد ذلك (baʿda dhālik) یعنی «بعد از آن».'
  ar.a1.unit30.lesson06.teach.sara_afdl_alsbaha:
    title: پلان سارا
    gloss: 'سارا: من شنا را بیشتر دوست دارم، اما به باغ هم می‌آیم.'
    note: أفضل (ufaḍḍil) یعنی «ترجیح می‌دهم». لكنني (lākinnanī) یعنی «اما من»، و سآتي (sa-ātī) یعنی «خواهم آمد».
  ar.a1.unit30.lesson06.teach.lyla_jmyl_ila:
    title: لیلا گفتگو را ختم می‌کند
    gloss: 'لیلا: عالی! روز شنبه در باغ می‌بینیمت!'
    note: در یک جمله، هم رشته پیام‌های این بخش و هم پلان بخش ورزش را به پایان می‌رساند.
