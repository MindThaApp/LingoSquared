    title: 'رسالة: فرستادن و خواندن'
    gloss: رسالة (risāla) یعنی پیامی که می‌فرستید (أرسل رسالة, ursil risāla) یا می‌خوانید (أقرأ رسالة, aqraʾ risāla).
    note: این کلمهٔ نو را با متن پیش‌بینی هوا و پیام‌هایی که مردم می‌فرستند و می‌خوانند وصل می‌کند.
  ar.a1.unit30.lesson02.teach.lyla_trsl_rsala:
    title: لیلا از طریق اپلیکیشن پیام می‌فرستد
    gloss: لیلا از طریق اپلیکیشن پیام می‌فرستد.
    note: 'ترسل (tursil) یعنی «او (زن) می‌فرستد»: حرف اول ت (ta-) نشانهٔ «او (زن)» است. عبر (ʿabra) یعنی «از طریق».'
