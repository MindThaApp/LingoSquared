  ar.a1.unit37.lesson05.teach.nwr_hy_aljdyda:
    title: نور درباره‌ی همه می‌شنود
    gloss: نور در کافه‌ی زبان‌ها تازه آمده است. او از یوسف می‌پرسد که دیگران چطور آدم‌هایی استند. یوسف برایش می‌گوید. لیلی مهربان و صبور است؛ او به حیث نرس کار می‌کند. کریم خنده‌دار است و در یک کورس زبان هسپانوی شرکت می‌کند. سارا کنجکاو است؛ او دوست دارد چیزهای تازه یاد بگیرد. خود یوسف آرام است.
    note: 'یک متن کوتاه درباره‌ی گروه. صفت‌ها با شخص مطابقت می‌کنند: لطیفة (laṭīfa) برای زن و مضحك (muḍḥik) برای مرد.'
    glosses:
