  ar.a1.unit22.lesson01.teach.happy:
    title: خوشحال
    gloss: خوشحال
    note: سعيد (saʿīd) یک مرد را توصیف می‌کند؛ یک خانم می‌گوید أنا سعيدة (anā saʿīda).
