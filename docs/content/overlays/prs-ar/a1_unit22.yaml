    gloss: چون
    note: لأن (li-anna) دلیل را معرفی می‌کند.
    example_gloss: من خوشحال هستم چون هوا آفتابی است.
  ar.a1.unit22.lesson02.teach.how_feel:
    title: چطور احساس میکنی؟
    gloss: چطور احساس میکنی؟
    note: 'كيف تشعر؟ (kayfa tashʿur) از یک مرد می‌پرسد چه احساسی دارد؛ از یک خانم: كيف تشعرين؟ (kayfa tashʿurīn).'
    example_gloss: یوسف، چه احساسی داری؟
  ar.a1.unit22.lesson02.teach.tired:
    title: خسته
    gloss: خسته
    note: متعب (mutʿab) یک مرد را توصیف می‌کند؛ متعبة (mutʿaba) یک خانم را، پس لیلی می‌گوید أنا متعبة.
    example_gloss: من خسته استم.
  ar.a1.unit22.lesson02.teach.okay:
    title: خوب
    gloss: خوب
    note: بخير (bi-khayr) یعنی خوب، لفظاً «در خیر (سلامتی)».
    example_gloss: آیا تو خوب استی؟
  ar.a1.unit22.lesson02.teach.line01:
    title: پرسیدن احوال
    gloss: لیلی از یوسف می‌پرسد که چه احساسی دارد.
    note: يا (yā) پیش از نام کسی می‌آید که او را صدا می‌زنیم.
    example_gloss: 'لیلی گفت: یوسف، چه احساسی داری؟'
  ar.a1.unit22.lesson02.teach.line02:
    title: احساس و دلیل
    gloss: یوسف می‌گوید که خوش است، چون هوا آفتابی است.
    note: در این جمله هم احساس گفته شده و هم دلیل آن.
    example_gloss: 'یوسف گفت: من خوش استم چون هوا آفتابی است.'
  ar.a1.unit22.lesson02.teach.line03:
    title: یک احساس دیگر
    gloss: لیلی می‌گوید که خسته است، چون کار دارد.
    note: متعبة با لیلی (مؤنث) هماهنگ است.
    example_gloss: 'لیلی گفت: من خسته استم چون کار دارم.'
  ar.a1.unit22.lesson02.teach.line04:
    title: پرسیدن از خوبی
    gloss: یوسف از لیلی می‌پرسد که خوب است یا نه.
    note: 'هل (hal) سوال بلی-یا-نه را شروع می‌کند. یوسف از لیلی می‌پرسد، پس أنت به شکل «انتِ» (anti) خوانده می‌شود؛ برای مرد: «أنتَ» (anta).'
    example_gloss: 'یوسف گفت: آیا تو خوب استی؟'
  ar.a1.unit22.lesson02.teach.line05:
    title: گفتن بلی
    gloss: لیلی بلی می‌گوید و از او تشکر می‌کند.
    note: نعم جواب «بلی» است.
    example_gloss: 'لیلی گفت: بلی، تشکر.'
