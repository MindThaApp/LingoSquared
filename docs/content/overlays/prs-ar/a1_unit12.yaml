    example_gloss: ما فردا ساعت پنج می‌رویم.
  ar.a1.unit12.lesson02.teach.propose:
    title: پیشنهاد یک طرح
    gloss: فردا به کافه برویم؟
    note: 'هل (hal) جمله را به پرسش بلی/نه تبدیل می‌کند؛ با نذهب پیشنهاد می‌شود: برویم؟'
    example_gloss: 'لیلا گفت: فردا به کافه برویم؟'
  ar.a1.unit12.lesson02.teach.accept:
    title: قبول کردن با وقت
    gloss: بلی، ساعت پنج
    note: می‌توانین فقط با نعم و وقت جواب بتین؛ فعل لازم نیست.
    example_gloss: 'یوسف گفت: بلی، ساعت پنج.'
  ar.a1.unit12.lesson02.teach.decline:
    title: رد کردن ساده
    gloss: نه، من درس دارم
    note: لا رد ساده است، و بعدش با عندي (من دارم) دلیل می‌آید.
    example_gloss: نه، من فردا درس دارم.
  ar.a1.unit12.lesson02.teach.line01:
    title: لیلا پیشنهاد می‌کند
    gloss: لیلا پیشنهاد می‌کند فردا به کافه بروند.
    note: این جمله گفتگوی طرح‌ریزی را شروع می‌کند.
    example_gloss: 'لیلا گفت: فردا به کافه برویم؟'
  ar.a1.unit12.lesson02.teach.line02:
    title: یوسف قبول می‌کند
    gloss: یوسف قبول می‌کند و وقت را می‌گوید.
    note: حالا طرح یک کار، یک روز و یک وقت دارد.
    example_gloss: 'یوسف گفت: بلی، ساعت پنج.'
  ar.a1.unit12.lesson02.teach.line03:
    title: لیلا تأیید می‌کند
    gloss: لیلا می‌گوید خوب و خداحافظ.
    note: جيد (jayyid) یعنی «خوب»؛ اینجا طرح را تأیید می‌کند. إلى اللقاء خداحافظی بخش سلام‌وعلیک است.
    example_gloss: 'لیلا گفت: خوب. خداحافظ.'
