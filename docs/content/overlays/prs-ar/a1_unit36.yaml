    title: لیلا و یوسف باهم آشپزی می‌کنند
    gloss: لیلا و یوسف باهم در آشپزخانهٔ یوسف در اسکندریه آشپزی می‌کنند. لیلا پیاز را پاره می‌کند. یوسف بادنجان رومی را در تابه سرخ می‌کند. یوسف غذا را آماده می‌کند. لیلا غذا را مزه می‌کند. غذا خوشمزه است!
    note: یک متن کوتاه دربارهٔ باهم آشپزی کردن. پسوند ـان در يطبخان (yaṭbukhān) یعنی آن دو نفر آشپزی می‌کنند.
