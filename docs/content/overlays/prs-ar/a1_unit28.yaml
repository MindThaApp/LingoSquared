    note: ليلى تمارس اليوغا (laylā tumāris al-yūghā) و سارة تسبح (sāra tasbaḥ) فعل‌هایی دارند که با ت (ta-) شروع می‌شوند، چون هر دو زن‌اند. لا پیش از فعل آن را منفی می‌سازد.
