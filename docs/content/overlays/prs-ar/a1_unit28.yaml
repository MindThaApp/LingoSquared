  ar.a1.unit28.lesson01.teach.nqwl_amars_qbl:
    title: 'فعل‌های ورزش: أمارس و ألعب'
    gloss: 'پیش از بیشتر ورزش‌ها أمارس (umāris، می‌کنم) بگویین: أمارس اليوغا (umāris al-yūghā)، أمارس الركض (umāris ar-rakḍ)، أمارس السباحة (umāris as-sibāḥa). برای بازی‌های توپی ألعب (alʿab، بازی می‌کنم) بگویین: ألعب كرة القدم.'
    note: أمارس (umāris) برای بیشتر ورزش‌ها استفاده می‌شود، اما بازی‌های توپی ألعب (alʿab) می‌گیرند؛ پس فعل را همراه با ورزش یاد بگیرین.
