  ar.a1.unit05.lesson02.teach.line03:
    title: پرسیدن «کی»
    gloss: یوسف می‌پرسد درس کی است.
    note: و این سوال را به گفتگوی قبلی وصل می‌کند.
    example_gloss: 'یوسف گفت: و درس کی است؟'
