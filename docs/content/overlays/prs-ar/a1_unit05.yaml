    note: صباحا (ṣabāḥan) می‌تواند وقت را صبح مشخص کند؛ في الصباح هم همین معنا را می‌دهد.
    example_gloss: ساعت پنج صبح است.
  ar.a1.unit05.lesson01.teach.masaa:
    title: در شام
    gloss: شب
    note: مساء (masāʾan) می‌تواند وقت را شام (عصر) مشخص کند؛ في المساء هم همین معنا را می‌دهد.
    example_gloss: ساعت پنج شام است.
