  ar.a1.unit05.lesson01.teach.five_oclock:
    title: ساعت پنج
    gloss: ساعت پنج است.
    note: الخامسة (al-khāmisa)، «ساعت پنجم». در این سطح A1 فقط ساعت‌های تمام استفاده می‌شود.
    example_gloss: 'لیلی گفت: ساعت پنج است.'
