    title: نور و لیلی گل می‌خرند
    gloss: نور و لیلی روز شنبه به بازار گل می‌روند. لیلی کدام رنگ را می‌خواهد؟ لیلی رنگ سرخ را می‌خواهد. نور کدام رنگ را می‌خواهد؟ نور رنگ زرد را می‌خواهد. آنها پنج گل می‌خرند. قیمتش ده درهم است. گل‌ها بسیار قشنگ استند!
