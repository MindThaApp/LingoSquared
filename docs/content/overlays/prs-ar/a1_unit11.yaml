teaching:
  ar.a1.unit11.lesson01.teach.every_day:
    title: هر روز
    gloss: هر روز
    note: كل يوم (kull yawm) معمولاً بعد از فعل می‌آید (أدرس كل يوم)، اما می‌تواند اول جمله هم بیاید (كل يوم أدرس).
    example_gloss: من هر روز درس می‌خوانم.
  ar.a1.unit11.lesson01.teach.wake:
    title: من بیدار می‌شوم
    gloss: من بیدار می‌شوم
    note: أستيقظ (astayqiẓ) یعنی «من بیدار می‌شوم»؛ أ در اول فعل حال، «من» را نشان می‌دهد. السابعة (as-sābiʿa) در ساعت یعنی هفت.
    example_gloss: من ساعت هفت بیدار می‌شوم.
  ar.a1.unit11.lesson01.teach.study:
    title: من درس می‌خوانم
    gloss: من درس می‌خوانم
    note: أدرس (adrus) یعنی «من درس می‌خوانم»؛ ریشهٔ آن با درس یکی است. التاسعة (at-tāsiʿa) در ساعت یعنی نُه.
    example_gloss: من ساعت نُه درس می‌خوانم.
  ar.a1.unit11.lesson01.teach.sleep:
    title: من می‌خوابم
    gloss: می‌خوابم / به بستر می‌روم
    note: أنام (anām) یعنی «من می‌خوابم»؛ با ذکر وقت یعنی «به بستر می‌روم». العاشرة (al-ʿāshira) در ساعت یعنی ده.
    example_gloss: من ساعت ده می‌خوابم.
  ar.a1.unit11.lesson02.teach.what_do:
    title: هر روز چه کار می‌کنی؟
    gloss: هر روز چه کار می‌کنی؟
    note: ماذا (mādhā) یعنی «چه»، و تفعل (tafʿal) یعنی «می‌کنی» که به یک مرد گفته می‌شود؛ به یک زن تفعلين (tafʿalīn) می‌گویند.
    example_gloss: 'لیلی گفت: هر روز چه کار می‌کنی؟'
  ar.a1.unit11.lesson02.teach.routine_sequence:
    title: سه جملهٔ روزمره
    gloss: من ساعت هفت از خواب بیدار می‌شوم. ساعت نُه درس می‌خوانم. ساعت ده می‌خوابم.
    note: هر جمله فعل + في الساعة + ساعت است؛ باهم یک روز کامل را شرح می‌دهند.
    example_gloss: هر روز ساعت هفت از خواب بیدار می‌شوم. ساعت نُه درس می‌خوانم. ساعت ده می‌خوابم.
  ar.a1.unit11.lesson02.teach.line01:
    title: پرسیدن در مورد کارهای روزانه
    gloss: لیلی می‌پرسد که یوسف هر روز چه کار می‌کند.
    note: 'لیلی تفعل می‌گوید چون از یک مرد می‌پرسد؛ برای یک زن: ماذا تفعلين كل يوم؟'
    example_gloss: 'لیلی گفت: هر روز چه کار می‌کنی؟'
  ar.a1.unit11.lesson02.teach.line02:
    title: وقت بیدار شدن
    gloss: یوسف می‌گوید ساعت هفت بیدار می‌شود.
    note: قبل از وقت، في الساعة را به کار ببرید.
    example_gloss: 'یوسف گفت: من ساعت هفت از خواب بیدار می‌شوم.'
  ar.a1.unit11.lesson02.teach.line03:
    title: وقت درس
    gloss: یوسف می‌گوید ساعت نُه درس می‌خواند.
    note: همین الگوی وقت با أدرس هم کار می‌کند.
    example_gloss: 'یوسف گفت: من ساعت نُه درس می‌خوانم.'
  ar.a1.unit11.lesson02.teach.line04:
    title: وقت خواب
    gloss: یوسف می‌گوید ساعت ده به بستر می‌رود.
    note: آخرین کار روز او همین الگوی وقت را با أنام به کار می‌برد.
    example_gloss: 'یوسف گفت: من ساعت ده می‌خوابم.'
