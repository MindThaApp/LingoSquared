teaching:
  ru.a1.unit07.lesson01.teach.menyu:
    title: меню
    gloss: メニュー
    note: меню はフランス語から入った中性名詞で、格変化せず常に同じ形です。
    example_gloss: こちらがメニューです。
  ru.a1.unit07.lesson01.teach.ofitsiant:
    title: официант, официантка
    gloss: ウェイター、ウェイトレス
    note: официант は男性、официантка は女性で、性に応じた規則的な語尾の型になっています。
    example_gloss: ウェイトレスはレストランで働いています。
  ru.a1.unit07.lesson01.teach.stol_svoboden:
    title: Этот столик свободен?
    gloss: このテーブルは空いていますか？
    note: столик は стол(「テーブル」)の指小形で、レストランの席を言うときによく使います。свободен(「空いている」)は男性名詞に合わせた形です。
  ru.a1.unit07.lesson01.teach.da_saditites:
    title: Да, садитесь, пожалуйста.
    gloss: はい、どうぞお座りください。
    note: садитесь は садиться(「座る」)の丁寧・複数の命令形で、вы に対して使います。
  ru.a1.unit07.lesson01.teach.chto_budete_zakazyvat:
    title: Что будете заказывать?
    gloss: ご注文は何になさいますか？
    note: будете заказывать は未来形の言い方(「注文する予定だ」)で、ウェイターが客に何がほしいか尋ねるときに使います。
  ru.a1.unit07.lesson02.teach.ya_khochu:
    title: Я хочу ...
    gloss: …が欲しいです。
    note: хочу は хотеть(「欲しい」)の一人称単数形で、食べ物や飲み物を注文するときに使います。
  ru.a1.unit07.lesson02.teach.chay_kofe:
    title: чай, кофе
    gloss: お茶、コーヒー
    note: чай も кофе もよく注文される飲み物です。кофе は格変化せず、語尾は -е ですが文法上は男性名詞です。
    example_gloss:
    - お茶が欲しいです。
    - コーヒーが欲しいです。
  ru.a1.unit07.lesson02.teach.khleb_borshch:
    title: хлеб, борщ
    gloss: パン、ボルシチ(ビーツのスープ)
    note: борщ はロシアの代表的なビーツのスープです。どちらの名詞も男性名詞です。
    example_gloss:
    - パンはありますか？
    - ボルシチが欲しいです。
  ru.a1.unit07.lesson02.teach.salat:
    title: салат
    gloss: サラダ
    note: и(「と」)は、борщ и салат のように注文する2つの品をつなぐときに使います。
    example_gloss: ボルシチとサラダが欲しいです。
  ru.a1.unit07.lesson03.teach.morozhenoe:
    title: мороженое
    gloss: アイスクリーム
    note: мороженое は形容詞のような形(「凍ったもの」)をした中性名詞で、ロシア語の食べ物の名詞によく見られる型です。
    example_gloss: デザートにアイスクリームを持ってきてください。
  ru.a1.unit07.lesson03.teach.prinesite:
    title: Принесите, пожалуйста, ...
    gloss: …を持ってきてください。
    note: Принесите は принести(「持ってくる」)の丁寧・複数の命令形で、вы に対して使います。
  ru.a1.unit07.lesson03.teach.spasibo:
    title: Спасибо.
    gloss: ありがとうございます。
    note: Спасибо は、丁寧なやり取りならどんな場面でも使える、お礼の基本の言い方です。
  ru.a1.unit07.lesson03.teach.ofitsiantka_chto_budete:
    title: ウェイトレスが注文を尋ねる
    gloss: ウェイトレス：ご注文は何になさいますか？
    note: ウェイトレスは Что будете заказывать? と尋ねて話を始めます。
  ru.a1.unit07.lesson03.teach.turist_ya_khochu_borshch:
    title: 旅行者が料理を注文する
    gloss: 旅行者：ボルシチとサラダが欲しいです。
    note: Турист(「旅行者」)は Я хочу борщ и салат. と答えます。
  ru.a1.unit07.lesson03.teach.ofitsiantka_chto_pit:
    title: ウェイトレスが飲み物を尋ねる
    gloss: ウェイトレス：お飲み物は何になさいますか？
    note: пить(「飲む」)は будете と組み合わせます。先の заказывать の質問と同じ型です。
  ru.a1.unit07.lesson03.teach.turist_ya_khochu_chay:
    title: 旅行者が飲み物を注文する
    gloss: 旅行者：お茶が欲しいです。
    note: 旅行者は Я хочу чай. と簡単に答えます。
  ru.a1.unit07.lesson03.teach.ofitsiantka_a_na_sladkoe:
    title: ウェイトレスがデザートを尋ねる
    gloss: ウェイトレス：デザートは？
    note: А на сладкое? は省略した続きの質問で、「それでは、甘いもの(デザート)は？」という意味です。
  ru.a1.unit07.lesson03.teach.turist_na_sladkoe:
    title: 旅行者がデザートを注文する
    gloss: 旅行者：デザートにアイスクリームを持ってきてください。
    note: 旅行者は На сладкое принесите мороженое, пожалуйста. と答えます。
  ru.a1.unit07.lesson03.teach.ofitsiantka_khorosho:
    title: ウェイトレスが注文を確認する
    gloss: ウェイトレス：かしこまりました。ありがとうございます。
    note: Хорошо(「わかりました」)で注文を確認し、Спасибо で丁寧にやり取りを締めくくります。
