    title: Идти と ехать
    gloss: ロシア語には「行く」を表す動詞が2つあります。*идти* は徒歩で、*ехать* は乗り物で行くときに使います:*Я иду пешком, я еду на велосипеде.*
    note: 手段に合う動詞を選びましょう。徒歩で *ехать* を使ったり、電車で *идти* を使ったりはしません。
