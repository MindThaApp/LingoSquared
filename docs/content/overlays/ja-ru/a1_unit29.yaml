    title: 誰がどのように移動する？
    gloss: ナスチャは毎日電車で通勤しています。ディマはふだん自転車ですが、雨の日は電車で行きます。イーゴリは車で行くほうが好きです。レーナは近くに住んでいて、歩いて通勤しています。あなたはどうやって通勤していますか?
    note: 通勤の4つの方法と、1つの条件(雨)を対比した読み物です:*обычно ... но когда идёт дождь ...*。
    glosses:
      едет: 通勤する
      каждый: 毎～
      день: 日
      поезде: 電車
      работу: 仕事
      велосипеде: 自転車で行く
      обычно: たいてい
      дождь: 雨が降る
      идёт: 乗る
      ездить: 車で行く
      предпочитает: 〜のほうを好む
      машине: 車
      живёт: 住んでいる
      близко: 近くに
      ходит: 歩いて行く
      добираешься: 行く
