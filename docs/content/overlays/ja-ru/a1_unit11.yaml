teaching:
  ru.a1.unit11.lesson01.teach.vstayu:
    title: встаю
    gloss: 私は起きます
    note: встаюはвставать(「起きる」)の一人称単数形です。相手に尋ねるときはвыに対応するвстаётеを使います。
    example_gloss: 私は7時に起きます。
  ru.a1.unit11.lesson01.teach.zavtrakayu:
    title: завтракаю
    gloss: 私は朝食を食べます
    note: завтракаюはзавтракать(「朝食を食べる」)の一人称単数形です。
    example_gloss: 8時に朝食をとります。
  ru.a1.unit11.lesson01.teach.kogda:
    title: Когда вы встаёте?
    gloss: 何時に起きますか？
    note: Когдаは「いつ」、выは丁寧な「あなた」または複数の「あなたたち」です。
  ru.a1.unit11.lesson02.teach.rabotayu:
    title: работаю
    gloss: 私は働きます
    note: работаюはработать(「働く」)の一人称単数形です。с ... до ...は時間の範囲を表し、「…から…まで」という意味です。
    example_gloss: 私は9時から5時まで働きます。
  ru.a1.unit11.lesson02.teach.uzhinayu:
    title: ужинаю
    gloss: 私は夕食を食べます
    note: ужинаюはужинать(「夕食を食べる」)の一人称単数形です。вечеромは「夜に」という意味です。
    example_gloss: 夜に私は夕食を食べます。
  ru.a1.unit11.lesson02.teach.lozhus_spat:
    title: ложусь спать
    gloss: 私は寝ます
    note: ложусь спатьは再帰動詞を使った表現で、直訳は「寝るために横になる」、意味は「就寝する」です。
    example_gloss: 私は11時に寝ます。
  ru.a1.unit11.lesson03.teach.oleg_chto_delayete:
