    gloss: オレグ:朝は何をしていますか。
    note: ОлегはЧто вы делаете утром?と話を切り出します。
  ru.a1.unit11.lesson03.teach.mariya_vstayu_zavtrakayu:
    title: マリアが朝の過ごし方を話す
    gloss: マリア:7時に起きて、それから8時に朝食を食べます。
    note: Марияは2つの動作を、потом(「それから」)でつないで順に挙げています。
  ru.a1.unit11.lesson03.teach.oleg_kogda_rabotayete:
    title: オレグが仕事の時間を尋ねる
    gloss: オレグ:では、いつ働いていますか。
    note: Аは、オレグが続けて質問するときに、話を自然につなぎます。
  ru.a1.unit11.lesson03.teach.mariya_rabotayu_uzhinayu:
    title: マリアが一日の残りを話す
    gloss: マリア:9時から5時まで働きます。夜は夕食を食べて、11時に寝ます。
    note: Марияは、まず仕事の時間を答え、それから夜の過ごし方を話しています。
