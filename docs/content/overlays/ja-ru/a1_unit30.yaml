    title: 私は毎日携帯電話を使います
    gloss: 私は毎日、携帯電話を使います。
    note: '*Каждый день*(毎日)をもう一度使います:*Я каждый день пользуюсь телефоном*。*пользоваться* のあとは、使うものが造格(творительный падеж)になります。'
  ru.a1.unit30.lesson02.teach.prilozhenie:
    title: アプリ
    gloss: アプリ
    example_gloss: 私は天気予報のアプリを持っています。
