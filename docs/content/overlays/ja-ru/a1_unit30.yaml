  ru.a1.unit30.lesson06.teach.dima_da_i:
    title: ディマが天気を確認する
    gloss: ディマ:はい、それに土曜日は晴れです!
  ru.a1.unit30.lesson06.teach.igor_ya_togda:
    title: イーゴリの予定
    gloss: イーゴリ:じゃあ、ぼくは走ります。そのあと、サッカーもします。
    note: '*Потом*(そのあと)は、2つ目の予定を1つ目のあとに置きます。*побегаю* は完了体で、「しばらく走る」という意味です。'
  ru.a1.unit30.lesson06.teach.lena_ya_luchshe:
    title: Lenaの予定
    gloss: Lena：私は泳ぐほうが好きですが、公園にも行きます。
    note: '*Я лучше поплаваю* は「むしろ泳ぎたい」という意味です。動詞の前の *лучше* は、好みを表します。'
  ru.a1.unit30.lesson06.teach.nastya_zdorovo_do:
    title: ナスチャが会話を締めくくる
    gloss: ナスチャ:いいですね!土曜日に公園で会いましょう!
    note: この一文で、この単元のメッセージのやり取りと、スポーツの単元で立てた予定の両方を締めくくります。
