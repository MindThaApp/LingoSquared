    title: メッセージ
    gloss: メッセージ
    example_gloss: アプリでメッセージを送ります。
  ru.a1.unit30.lesson02.teach.prognoz_pogody_slovo:
    title: Прогноз погоды と сообщение
    gloss: '*Прогноз погоды* は2語で、2つ目の *погоды* は生格です。*Сообщение* は送ったり読んだりできるメッセージのことです。'
    note: 新しい単語を、天気の単元ですでに学んだ複合名詞と結び付けています。
  ru.a1.unit30.lesson02.teach.nastya_otpravlyaet_soobshchenie:
    title: ナスチャがアプリでメッセージを送る
    gloss: ナースチャはアプリでメッセージを送ります。
    note: '*Отправляет*(送る)は規則動詞です。メッセージは目的語で、対格になります。*через приложение* は「アプリを通して」という意味です。'
  ru.a1.unit30.lesson02.teach.dima_chitaet_soobshchenie:
    title: ディマがメッセージを読む
    gloss: ディマはメッセージを読みます。
  ru.a1.unit30.lesson03.teach.iskat:
    title: 調べる
    gloss: 調べる
    example_gloss: 私は天気予報を調べます。
  ru.a1.unit30.lesson03.teach.posle_polzovatsya_slovo:
    title: Пользоваться と искать
    gloss: '*Пользоваться* は造格を取ります(*пользоваться телефоном*)。一方、*искать* は対格を取ります(*искать прогноз*)。'
    note: どちらの動詞も規則変化です:*я пользуюсь, ты пользуешься*;*я ищу, ты ищешь*。
  ru.a1.unit30.lesson03.teach.igor_ishchet_prognoz:
    title: イーゴリが天気予報を調べる
    gloss: イーゴリは天気予報を調べます。
  ru.a1.unit30.lesson03.teach.potom_on_idyot:
    title: それから彼はジョギングをします
    gloss: その後、彼はジョギングに行きます。
    note: '*Идёт бегать* は「走りに行く」という意味です。*идёт* は移動の動詞で、そのあとに、しに行くことを不定詞で続けます。'
  ru.a1.unit30.lesson04.teach.nastya_davay_v:
    title: ナスチャが提案する
    gloss: ナスチャ:土曜日の10時に運動しませんか?
  ru.a1.unit30.lesson04.teach.dima_khoroshaya_ideya:
    title: ディマが賛成する
    gloss: ディマ:いい考えですね!天気予報を調べておきます。
    note: '*Хорошая идея* は、女性名詞に女性形の形容詞がついた形です。*Поищу* は完了体の未来形で、「調べておく」という意味です。'
  ru.a1.unit30.lesson04.teach.dima_v_subbotu:
    title: ディマが天気を確認する
    gloss: ディマ:土曜日は晴れです!
    note: '*Солнечно* は天気を表す語です。「ある」にあたる動詞は要りません:*В субботу солнечно*。'
  ru.a1.unit30.lesson04.teach.igor_ya_vizhu:
    title: イーゴリがメッセージを見る
    gloss: イーゴリ:メッセージを見ました。土曜日に会いましょう!
  ru.a1.unit30.lesson04.teach.ty_uzhe_znaesh:
    title: До + 生格
    gloss: '*До свидания!* はもう知っていますね。日にちを入れることもできます:*До субботы!*、*До завтра!* *до* のあとの名詞は生格になります。'
    note: あいさつの単元で学んだ別れの表現を、特定の日を示す形に広げます。
  ru.a1.unit30.lesson05.teach.nastya_kazhdyy_den:
    title: 誰が何を使いますか？
    gloss: ナスチャは毎日ディマに電話をします。アプリではなく、電話を使います。ディマの家にはコンピューターがありませんが、携帯電話でインターネットを使います。イーゴリは毎朝、天気予報を調べます。そのあと走りに行きます。レーナはよくナスチャにメッセージを送ります。あなたも毎日電話を使いますか?
    note: 4人の機器の使い方を比較する、スポーツの単元と同じ形式の読解です。
    glosses:
      звонит: 電話をする
      каждый: 毎～
      день: 日
      пользуется: 使う
      телефоном: 携帯電話
      приложением: アプリ
      компьютера: パソコン
      дома: 自宅で
      интернетом: インターネット
      ищет: 調べる
      утро: 朝
      прогноз: 天気予報
      идёт: 行く
      бегать: 走ること
      отправляет: 送る
      часто: よく
      сообщение: メッセージ
      пользуешься: 使う
  ru.a1.unit30.lesson05.teach.igor_kazhdoe_utro:
    title: イーゴリは毎朝天気予報を調べる
    gloss: イーゴリは毎朝、天気予報を調べます。
  ru.a1.unit30.lesson05.teach.lena_chasto_otpravlyaet:
    title: レーナはよくナスチャにメッセージを送る
    gloss: レーナはよくナスチャにメッセージを送ります。
