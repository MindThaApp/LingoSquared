    title: 一緒に週末の予定を立てる
teaching:
  ru.a1.unit25.lesson01.teach.chitat_zanimatsya_sportom:
    title: 読書、運動、料理
    gloss: 読む、運動する／スポーツをする、料理する
    note: よく使う趣味の動詞が三つ出てきます:*читать*(読む)、*заниматься спортом*(運動する、スポーツをする)、*готовить*(料理する)。
    example_gloss:
    - 私は本を読むのが好きです。
    - 私は土曜日に運動します。
    - 私は友達のために料理するのが好きです。
  ru.a1.unit25.lesson01.teach.svobodnoe_vremya:
    title: 自由時間
    gloss: 自由時間
    note: '*Свободное время*(自由な時間)は趣味を話すときの大切な表現です。形容詞 *свободное* は *время* に合わせて *-ое* で終わります。'
    example_gloss: 私は自由時間に読書をするのが好きです。
  ru.a1.unit25.lesson01.teach.v_svobodnoe_vremya:
    title: 自由時間にすることを伝える
    gloss: 私は自由時間に読書をするのが好きです。
    note: '*Люблю* は *любить*(好む、愛する)の *я* の形です。そのあとの動詞は不定形のままです:*люблю читать*。'
  ru.a1.unit25.lesson02.teach.slushat_muzyku_risovat:
    title: 音楽、絵、ゲーム
    gloss: 音楽を聴く、絵を描く、ゲームをする
    note: 趣味をさらに三つ:*слушать музыку*(音楽を聴く)、*рисовать*(絵を描く)、*играть в игры*(ゲームをする)。
    example_gloss:
    - 私は音楽を聴くのが好きです。
    - 私はよく絵を描きます。
    - 私は友達とゲームをするのが好きです。
  ru.a1.unit25.lesson02.teach.ya_lyublyu_slushat:
    title: 音楽を聴くのが好きだと伝える
    gloss: 私は音楽を聴くのが好きです。
    note: '*Слушать* は目的語をそのまま続けます。*музыку* は *музыка* の対格で、語尾が *-у* になります。'
  ru.a1.unit25.lesson02.teach.ya_lyublyu_igrat:
    title: 友達とゲームをするのが好きだと伝える
    gloss: 私は友達とゲームをするのが好きです。
    note: '*С друзьями*(友達と):前置詞 *с* のあとには造格が来るので、*друзьями* の形になります。'
  ru.a1.unit25.lesson03.teach.vsegda_chasto_inogda:
    title: いつも、よく、ときどき、決して～ない
    gloss: いつも、よく、ときどき、決して～ない
    note: 頻度を表す基本の副詞四つ:*всегда*、*часто*、*иногда*、*никогда*。形は変わりません。
    example_gloss:
    - 私は毎週土曜日に運動します。
    - 私はよく本を読みます。
    - 私はときどき絵を描きます。
    - 私はゲームをまったくしません。
  ru.a1.unit25.lesson03.teach.kazhduyu_nedelyu_kazhdye:
    title: 毎週、毎週末
    gloss: 毎週、毎週末
    note: '*Каждую неделю* も *каждые выходные* も「毎~」の意味ですが、語尾は名詞に合わせて変わります。次のカードを見てください。'
    example_gloss:
    - 私は毎週、友達のために料理をします。
    - 私は毎週末、運動します。
  ru.a1.unit25.lesson03.teach.nedelya_zhenskogo_roda:
    title: 「毎~」:女性名詞と複数形
    gloss: '*Неделя* は女性名詞なので *каждую неделю* になります。*Выходные* は複数形なので *каждые выходные* になります。'
    note: '*Каждый* は他の形容詞と同じく名詞に合わせて変化します:*каждый день*(男性)、*каждую неделю*(女性・対格)、*каждые выходные*(複数)。'
  ru.a1.unit25.lesson03.teach.chto_ty_delaesh:
    title: 余暇の過ごし方を尋ねる
    gloss: 自由時間には何をしますか？
    note: これはこのユニットの中心となる質問です。相手の趣味を尋ねるときに使ってみましょう。
  ru.a1.unit25.lesson04.teach.nastya_my_chasto:
    title: ナスチャが趣味の話を切り出す
    gloss: ナスチャ:私たちはよく一緒に散歩するよね。ディマは、自由な時間にほかに何をしているの?
    note: '*Мы часто гуляем вместе*:*мы*(私たち)には動詞の語尾 *-ем* がつきます。*гулять* は楽しみのために散歩するという意味です。'
  ru.a1.unit25.lesson04.teach.dima_ya_lyublyu:
    title: ディマの趣味
    gloss: ディマ:料理が好きなんだ、家でもね。それに、よく運動もしているよ。
    note: '*И дома тоже*(家でも):*и ... тоже* は、ディマが仕事だけでなく楽しみとしても料理することを表します。'
  ru.a1.unit25.lesson04.teach.nastya_ty_i:
    title: ナスチャが驚く
    gloss: ナスチャ:家でも料理するの?一日中、仕事で料理しているじゃない!
    note: '*Весь день*(一日中)は、ディマがすでに仕事でたくさん料理していることを強調します。*Весь* は男性名詞 *день* に合わせた形です。'
  ru.a1.unit25.lesson04.teach.dima_da_no:
    title: ディマが説明する
    gloss: ディマ:うん、でも料理するとリラックスできるんだ。ナスチャは何をするのが好き?
    note: '*Готовить меня расслабляет* は行為を先に置く言い方で、直訳すると「料理することは私をリラックスさせる」です。*меня* は対格です。'
  ru.a1.unit25.lesson04.teach.nastya_ya_lyublyu:
    title: ナスチャの趣味
    gloss: ナスチャ:私は読書が好きで、よく音楽を聴くよ。
    note: 前のレッスンで学んだ趣味の動詞を *и*(と、そして)でつなげています:*люблю читать и часто слушаю музыку*。
  ru.a1.unit25.lesson04.teach.dima_ty_tozhe:
    title: ディマがゲームについて尋ねる
    gloss: ディマ:ナスチャもゲームをする?
    note: 短い「はい・いいえ」の疑問文:ロシア語では語順を変えず、イントネーションを上げるだけです:*Ты тоже играешь в игры?*
  ru.a1.unit25.lesson04.teach.nastya_net_ya:
    title: ナスチャが答える
    gloss: ナスチャ:ううん、ゲームは全然しない。でも、ときどき絵を描くよ!
    note: '*Никогда не*(決して~ない)では、動詞の前にもう一つ *не* が必要です。*Иногда*(ときどき)が対比になっています。'
  ru.a1.unit25.lesson05.teach.my_s_dimoy:
    title: 趣味を比べる
    gloss: ディマと私はよく一緒に散歩します。でも、ほかの趣味もあります。ディマは料理が好きで、家でも作り、よく運動もします。私は読書が好きで、よく音楽を聴きます。ときどき絵を描きますが、ゲームは決してしません。あなたは自由な時間に何をするのが好きですか?
    note: ナスチャのメッセージはここまでの内容をまとめ、このユニットの中心となる質問で締めくくっています。
    glosses:
      гуляем: 散歩する
      часто: よく
      вместе: 一緒に
      другие: ほかの
      готовить: 料理する
      любит: ～するのが好き
      дома: 家で
      занимается: 運動する
      читать: 読む
      слушаю: 聴く
      музыку: 音楽
      рисую: 絵を描く
      иногда: 時々
      играю: ビデオゲームをする
      никогда: 決して〜ない
      свободное: 自由な
      время: 時間
  ru.a1.unit25.lesson06.teach.dima_chto_ty:
    title: ディマが週末の予定を尋ねる
    gloss: ディマ:今週末は何をするの?
    note: '*В эти выходные*(今週末):*выходные* は複数形なので *эти* も複数形です。時を表す *в* のあとは対格になります。'
  ru.a1.unit25.lesson06.teach.nastya_poka_ne:
    title: ナスチャはまだ決めていない
    gloss: ナスチャ:まだ分からないな。読書は好きだけど、外にも出たいんだ。
    note: '*Хочу ещё выйти на улицу* は「外にも出たい」という意味です。*Хочу* は *хотеть* の *я* の形です。'
  ru.a1.unit25.lesson06.teach.dima_davay_pogulyaem:
    title: ディマが計画を提案する
    gloss: ディマ:一緒に散歩しない?そのあとで、僕が二人の食事を作るよ。
    note: '*Давай погуляем* は、一緒に何かをしようと誘うときの普通の言い方です。*потом*(そのあと)で次の段取りを示します。'
  ru.a1.unit25.lesson06.teach.nastya_khoroshaya_ideya:
    title: ナスチャが賛成する
    gloss: ナスチャ:いい考えだね!散歩も料理も好きなんだ。
    note: '*Мне нравится* は直訳すると「私にとって気に入られている」で、人は与格(*мне*)になり、好きなものがそのあとに続きます。'
  ru.a1.unit25.lesson06.teach.dima_otlichno_togda:
    title: ディマが確認する
    gloss: ディマ:よし。じゃあ、土曜日に会おう!
    note: '*Увидимся в субботу*(土曜日に会いましょう):曜日の前の *в* のあとは対格になるので、*суббота* は *субботу* になります。'
