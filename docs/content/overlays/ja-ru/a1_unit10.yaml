teaching:
  ru.a1.unit10.lesson01.teach.kak_doyti:
    title: Как дойти до...?
    gloss: ~へはどう行けばいいですか？
    note: Как дойти до...? は、見知らぬ人に場所への行き方を丁寧にたずねるときの基本表現です。目的地は生格にして後ろに置きます。
  ru.a1.unit10.lesson01.teach.muzeya:
    title: музей
    gloss: 美術館
    note: музей は男性名詞で、музея はその生格形です。до(「~まで」)の後ろで使います。
    example_gloss: 博物館へはどう行けばいいですか？
  ru.a1.unit10.lesson01.teach.pryamo:
    title: прямо
    gloss: まっすぐ
    note: прямо は「まっすぐ」という意味です。Идите は「行く」の丁寧な命令形です。
    example_gloss: まっすぐ行ってください。
  ru.a1.unit10.lesson01.teach.napravo:
    title: направо
    gloss: 右へ
    note: направо は動きの向き(右へ曲がる)を表します。потом は「それから」という意味です。
    example_gloss: まっすぐ行って、それから右へ行ってください。
  ru.a1.unit10.lesson02.teach.nalevo:
    title: налево
    gloss: 左へ
    note: налево は動きの向きを表し、направо の反対です。
    example_gloss: 左に曲がってください。
  ru.a1.unit10.lesson02.teach.povernite:
    title: поверните
    gloss: 曲がってください(丁寧な命令)
    note: поверните は повернуть(「曲がる」)の丁寧な命令形です。за углом は「角を曲がったところで」という意味です。
    example_gloss: 角を左に曲がってください。
  ru.a1.unit10.lesson02.teach.kvartal_daleko:
    title: квартал, далеко
    gloss: ブロック、遠い
    note: квартал は街の1区画(ブロック)で、два の後ろでは квартала になります。далеко は「遠い」、отсюда は「ここから」という意味です。
    example_gloss:
    - 2ブロック行ってください。
    - それはここから遠いですか？
  ru.a1.unit10.lesson03.teach.tourist_prostite:
    title: 旅行者が道をたずねる
    gloss: 旅行者：すみません、博物館へはどう行けばいいですか？
    note: Турист は、まず Простите(「すみません」)と声をかけてから Как дойти до музея? とたずねます。
  ru.a1.unit10.lesson03.teach.prokhozhiy_eto_prosto:
    title: 通行人が道を教える
    gloss: 通行人：とても簡単ですよ。2ブロックまっすぐ行って、それから右に曲がってください。
    note: Прохожий は Это очень просто と答え、続けて Идите と поверните を使って2段階の道順を教えます。
  ru.a1.unit10.lesson03.teach.tourist_daleko:
    title: 旅行者が遠いかどうかたずねる
    gloss: 旅行者：ここから遠いですか？
    note: Это далеко отсюда? は、歩く距離を確かめるための質問です。
  ru.a1.unit10.lesson03.teach.prokhozhiy_pyat_minut:
    title: 通行人が所要時間を答える
    gloss: 通行人：いいえ、徒歩5分です。
    note: Прохожий は Нет, пять минут пешком(пешком は「徒歩で」)と答えます。
  ru.a1.unit10.lesson03.teach.tourist_spasibo:
    title: 旅行者がお礼を言う
    gloss: 旅行者：どうもありがとうございます。
    note: Спасибо большое は、やりとりを丁寧にしめくくる表現です。
  ru.a1.unit10.lesson03.teach.prokhozhiy_pozhaluysta:
    title: 通行人が答える
    gloss: 通行人：どういたしまして。
    note: Пожалуйста は спасибо に対する「どういたしまして」の返事です。
