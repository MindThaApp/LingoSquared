  ru.a1.unit17.lesson01.teach.ya_vrach_rabotayu_v_bolnitse:
    title: Я врач. Я работаю в больнице.
    gloss: 私は医者です。病院で働いています。
    note: врач は職業の「医者」です。работаю в + 前置格で「~で働いています」という意味になります。
  ru.a1.unit17.lesson01.teach.uchitel:
    title: учитель
    gloss: 教師
    note: учитель は「教師」の意味です。работает は работать の「彼・彼女は働く」の形です。
    example_gloss: 彼女は教師です。学校で働いています。
  ru.a1.unit17.lesson01.teach.inzhener:
    title: инженер
    gloss: エンジニア
    note: инженер は「エンジニア」の意味です。офис は「オフィス」で、в офисе は前置格の形で「オフィスで」という意味です。
    example_gloss: 彼はエンジニアです。オフィスで働いています。
  ru.a1.unit17.lesson02.teach.kem_ty_rabotayesh:
    title: Кем ты работаешь?
    gloss: お仕事は何ですか?
    note: Кем ты работаешь? は相手の職業をたずねる標準的な言い方です。кем は「だれ」の造格で、работать とともに使います。
  ru.a1.unit17.lesson02.teach.prodavets:
    title: продавец
    gloss: 販売員・店員
    note: продавец は「販売員」(店で働く人)の意味です。магазин は「店」で、в магазине は前置格の形です。
    example_gloss: 彼は販売員です。店で働いています。
  ru.a1.unit17.lesson02.teach.povar:
    title: повар
    gloss: 料理人
    note: повар は「料理人」の意味です。ресторан は「レストラン」で、в ресторане は前置格の形です。
    example_gloss: 彼女は料理人です。レストランで働いています。
  ru.a1.unit17.lesson03.teach.nastya_kem_ty_rabotayesh:
    title: ナースチャがディマの仕事をたずねる
    gloss: ナースチャ:ディマ、お仕事は何ですか?
    note: Настя は Кем ты работаешь, Дима? と話しかけます。
  ru.a1.unit17.lesson03.teach.dima_inzhener_ofise:
    title: ディマが答えて聞き返す
    gloss: ディマ:私はエンジニアです。オフィスで働いています。あなたは?
    note: Дима は Я инженер. Я работаю в офисе. А ты? と答えます。
