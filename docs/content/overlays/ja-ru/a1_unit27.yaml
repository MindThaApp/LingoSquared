course:
  title: ロシア語 A1
  description: ペットや身近な動物について話す初級ロシア語です。動物の名前、世話(散歩、えさやり、遊ぶ)、飼っていなくても好きな動物を言う表現、そして規則的なロシア語の複数形を学びます。
