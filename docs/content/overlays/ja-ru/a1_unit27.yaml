teaching:
  ru.a1.unit27.lesson01.teach.zhivotnoe_domashnee_zhivotnoe:
    title: 動物、ペット
    gloss: 動物／ペット
    note: '*Животное* は「動物」を表す一般的な語です。*Домашнее животное*(直訳は「家の動物」)は、特に「ペット」を意味します。'
    example_gloss:
    - 犬は動物です。
    - 犬はペットでもあります。
  ru.a1.unit27.lesson01.teach.sobaka_koshka:
    title: 犬と猫
    gloss: 犬／猫
    example_gloss:
    - ナースチャは犬を飼っています。
    - イーゴリは猫を飼っています。
  ru.a1.unit27.lesson01.teach.ryba_ptitsa:
    title: 魚と鳥
    gloss: 魚／鳥
    example_gloss:
    - おじいさんは魚を飼っています。
    - Ninaは鳥を飼っています。
  ru.a1.unit27.lesson01.teach.u_tebya_est:
    title: ペットを飼っていますか？
    gloss: ペットを飼っていますか？
    note: '*У тебя есть ...?* は「〜を持っていますか」という質問です。*у тебя*(「君のところに」)+ *есть* + 持っているもの、という形です。'
  ru.a1.unit27.lesson01.teach.da_u_menya:
    title: はい、犬を飼っています
    gloss: はい、犬を飼っています。
    note: このユニットの新しい語彙を使った、簡単な肯定の答えです。
  ru.a1.unit27.lesson01.teach.net_u_menya:
    title: いいえ、ペットは飼っていません
    gloss: いいえ、ペットは飼っていません。
    note: '*Нет* + 生格で「〜を持っていない」を表します:*у меня нет домашнего животного*。文法ノートを見てください。'
  ru.a1.unit27.lesson01.teach.posle_net_slovo:
    title: Нет + 生格
    gloss: '*нет* のあとでは、ないものは生格になります:*у меня нет времени*、*у меня нет домашнего животного*。'
    note: 肯定文と比べてみましょう:*у меня есть собака*(主格)に対して、*у меня нет собаки*(生格)です。
  ru.a1.unit27.lesson02.teach.gulyat_s_sobakoy:
    title: （動物を）散歩させる
    gloss: （動物を）散歩させる
    note: '*Гулять с собакой* では、*с* のあとに造格の *собакой* を使います。文法ノートを見てください。'
    example_gloss: 私は毎日犬を散歩させます。
  ru.a1.unit27.lesson02.teach.posle_s_slovo:
    title: С + 造格
    gloss: '*с*(〜と一緒に)のあとでは、名詞は造格になります:*гулять с собакой*、*играть с кошкой*。'
    note: 女性名詞の造格は *-ой* または *-ей* で終わります:*собакой*、*кошкой*。
  ru.a1.unit27.lesson02.teach.kormit:
    title: 餌を与える
    gloss: 餌をあげる
    example_gloss: 私は毎日猫に餌をあげます。
  ru.a1.unit27.lesson02.teach.igrat_s:
    title: ～と遊ぶ
    gloss: ～と遊ぶ
    example_gloss: イーゴリは自分の猫と遊んでいます。
  ru.a1.unit27.lesson02.teach.ya_kazhdyy_den:
    title: 私は毎日犬を散歩させます
    gloss: 私は毎日犬を散歩させます。
    note: '*Каждый день*(毎日)は前置詞を使わない時の表現です:*Я каждый день гуляю с собакой*。'
  ru.a1.unit27.lesson02.teach.ya_kazhdyy_den_2:
    title: 私は毎日猫に餌を与えます
    gloss: 私は毎日猫に餌をあげます。
    note: '*Кормить* は、動物を対格の直接目的語にとります:*кошка* は *кошку* になります。'
  ru.a1.unit27.lesson03.teach.posle_lyubit_zhivotnoe:
    title: любить のあとの動物
    gloss: '*любить* のあとでは動物を表す名詞は対格になり、活動体名詞では複数対格が複数生格と同じ形になります:*собак*、*кошек*、*птиц*、*рыб*。'
    note: 規則的なロシア語の複数形のパターンです。ここで動物の名詞を例にして初めて学びます。
  ru.a1.unit27.lesson03.teach.sobak_koshek:
    title: 犬と猫
    gloss: 犬／猫
    example_gloss:
    - ディマは犬が好きです。
    - Lenaは猫が大好きです。
  ru.a1.unit27.lesson03.teach.ryb_ptits:
    title: 魚と鳥（複数形）
    gloss: 魚／鳥
    example_gloss:
    - 私は魚が大好きです。
    - おじいさんは鳥が大好きです。
  ru.a1.unit27.lesson03.teach.ya_lyublyu_zhivotnykh:
    title: 私は動物が大好きです
    gloss: 私は動物が大好きです。
    note: '*Люблю* + 対格:*Я люблю животных*。活動体名詞の複数では、対格が生格と同じ形になります。'
  ru.a1.unit27.lesson03.teach.lena_lyubit_koshek:
    title: Lenaは猫が大好きですが、ペットは飼っていません
    gloss: Lenaは猫が大好きですが、ペットは飼っていません。
    note: 第5課の読解の中心となる対比を示しています。
  ru.a1.unit27.lesson04.teach.dima_u_tebya:
    title: ディマがペットについて尋ねる
    gloss: ディマ:ナースチャ、ペットを飼っていますか?
  ru.a1.unit27.lesson04.teach.nastya_da_u:
    title: ナースチャは犬を飼っている
    gloss: ナースチャ:はい、犬を飼っています。
  ru.a1.unit27.lesson04.teach.dima_kak_on:
    title: ディマが見た目を尋ねる
    gloss: ディマ:どんな見た目ですか?
    note: '*Как он выглядит?* という質問は動物にも使えます。オスのペットには *Он*(彼)を使います。'
  ru.a1.unit27.lesson04.teach.nastya_u_nego:
    title: ナースチャが犬の様子を説明する
    gloss: ナースチャ:茶色の毛で、小さいです。
    note: 外見についてのユニットで学んだ髪の色や大きさの語彙を、人の髪ではなく動物の毛の説明に使っています。
  ru.a1.unit27.lesson04.teach.o_zhivotnom_mozhno:
    title: 動物を指す он と она
    gloss: ペットは人と同じように *он* でも *она* でも言えます:*У меня собака, он маленький*。
    note: 文法上 *собака* は女性名詞ですが、オスだと分かっているときは、ロシア人はよく *он* と言います。
  ru.a1.unit27.lesson04.teach.dima_ty_gulyaesh:
    title: ディマが散歩について尋ねる
    gloss: ディマ:毎日散歩に連れて行っていますか?
  ru.a1.unit27.lesson04.teach.nastya_da_ya:
    title: ナースチャが日課を説明する
    gloss: ナースチャ:はい、毎日散歩に連れて行って、えさもあげています。
  ru.a1.unit27.lesson05.teach.dima_i_lena:
    title: 動物についてのディマ、レーナ、イーゴリ
    gloss: ディマとレーナは二人とも動物が好きですが、二人ともペットはいません。ディマは犬が好きで、レーナは猫が好きです。一方、イーゴリにはペットがいます。猫です。彼はよく自分の猫と遊び、毎日えさをあげています。あなたはペットを飼っていますか?
    note: 動物が好きなことと、実際に飼っていることの違いを対比しています。これがこの学習目標で伝えたいポイントです。
    glosses:
      любят: 愛する
      оба: 両方とも
      животных: 動物
      обоих: 両方とも
      домашнего: ペット
      собак: 犬たち
      кошек: 猫たち
      кошка: 猫
      играет: 遊ぶ
      даёт: 与える
      каждый: 毎～
      корм: 餌
  ru.a1.unit27.lesson05.teach.igor_chasto_igraet:
    title: イーゴリはよく自分の猫と遊ぶ
    gloss: イーゴリはよく自分の猫と遊んでいます。
    note: '*Со своей кошкой*:*со* は子音が重なる前で使う *с* の形で、*своей* は主語に戻って「自分の」を意味します。'
  ru.a1.unit27.lesson05.teach.ya_lyublyu_sobak:
    title: 私は犬が大好きです。ペットは飼っていません。
    gloss: 私は犬が大好きです。ペットは飼っていません。
    note: このユニットの作文問題でそのまま応用できる、二文からなる解答例です。
  ru.a1.unit27.lesson06.teach.nastya_nina_u:
    title: ナースチャがニーナに尋ねる
    gloss: ナースチャ:ニーナ、あなたもペットを飼っていますか?
  ru.a1.unit27.lesson06.teach.nina_da_u:
    title: NinaはPicoという鳥を飼っています
    gloss: Nina：はい、鳥を飼っています。名前はPicoです。
    note: '*Его зовут Пико* は直訳すると「彼をピコと呼ぶ」です。ロシア語では、このように名前を言います。'
  ru.a1.unit27.lesson06.teach.dima_kak_zdorovo:
    title: ディマが反応する
    gloss: ディマ:すてきですね!毎日その子と何をしていますか?
  ru.a1.unit27.lesson06.teach.nina_ya_kazhdyy:
    title: Ninaは毎日その鳥に餌を与えます
    gloss: Nina：毎日その鳥に餌を与えています。
  ru.a1.unit27.lesson06.teach.dima_ya_tozhe:
    title: ディマも鳥が好き
    gloss: ディマ:ぼくも鳥が好きです。
  ru.a1.unit27.lesson06.teach.nastya_kak_khorosho:
    title: ナースチャが会話をしめくくる
    gloss: ナースチャ:三人とも動物が好きでよかったですね!
    note: このユニットで登場した三人と動物についての話をまとめて、会話を締めくくっています。
