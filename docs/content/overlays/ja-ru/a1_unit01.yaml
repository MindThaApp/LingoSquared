course:
  title: ロシア語 A1
  description: あいさつや短い会話など、日常で使うA1レベルのロシア語を学びます。キリル文字や、вы/тыの使い分けについても日本語で詳しく解説します。
units:
  ru.a1.unit01.greetings:
    title: あいさつと別れの言葉
lessons:
  ru.a1.unit01.lesson01.script_ramp:
    title: キリル文字に出会おう
  ru.a1.unit01.lesson02.vremya_dnya:
    title: 時間帯ごとのあいさつ
  ru.a1.unit01.lesson03.kak_dela_i_proshchanie:
    title: 調子のたずね方と別れのあいさつ
teaching:
  ru.a1.unit01.lesson01.teach.direction:
    title: 読む向き
    gloss: ロシア語のアルファベットは左から右へ読みます。日本語の横書きと同じです。
    note: ロシア語(キリル文字)は日本語の横書きと同じ向きに読みます。新しく覚えるのは文字の形と音だけです。
  ru.a1.unit01.lesson01.teach.letter_z:
    title: З з
    gloss: 文字 З(ゼー)
    note: 「ズ」に近い有声の z の音です。小文字の з は数字の 3 に似ています。
  ru.a1.unit01.lesson01.teach.letter_d:
    title: Д д
    gloss: 文字 Д(デー)
    note: 「ド」の d の音に近い音です。小文字の д は大文字を小さくした形で、下に短い「足」があります。ラテン文字の d とは似ていないので、新しい形として覚えましょう。
  ru.a1.unit01.lesson01.teach.letter_r:
    title: Р р
    gloss: 文字 Р(エル)
    note: 舌先を震わせる巻き舌の「r」です。日本語のラ行とは違います。ラテン文字の P に似ていますが「p」の音ではないので、間違えないでください。
  ru.a1.unit01.lesson01.teach.letter_a:
    title: А а
    gloss: 文字 А(アー)
    note: 日本語の「ア」に近い音です。ラテン文字の A/a と形も音もほぼ同じです。
  ru.a1.unit01.lesson01.teach.letter_v:
    title: В в
    gloss: 文字 В(ヴェー)
    note: 上の歯を下唇に軽く当てて出す v の音です。ラテン文字の B に似ていますが、音は違うので注意しましょう。
  ru.a1.unit01.lesson01.teach.letter_s:
    title: С с
    gloss: 文字 С(エス)
    note: 「ス」に近い s の音です。ラテン文字の C/c に似ていますが、ロシア語では「k」の音にはなりません。
  ru.a1.unit01.lesson01.teach.letter_t:
    title: Т т
    gloss: 文字 Т(テー)
    note: 「ト」に近い t の音です。小文字の т は手書きでは小さい m のように書かれることもありますが、まずは印刷の形を覚えましょう。
  ru.a1.unit01.lesson01.teach.letter_u:
    title: У у
    gloss: 文字 У(ウー)
    note: 唇を丸めて出す「ウ」の音です。ラテン文字の y に似ていますが、音は全く違います。
  ru.a1.unit01.lesson01.teach.letter_ye:
    title: Е е
    gloss: 文字 Е(イェー)
    note: 語頭や音節の頭では「イェ」と発音します。ラテン文字の E/e と同じ形ですが、音は違います。
  ru.a1.unit01.lesson01.teach.hard_sign_note:
    title: ъ と ь：硬音符と軟音符
    gloss: 硬音符 ъ と軟音符 ь には、それ自体の音はありません。隣の文字の発音を変えます。
    note: この2つの記号は単独では音を表しません。ь は直前の子音を軟らかくし、ъ は音をはっきり分けて区切る印です。実際の単語が出てきたときにまた学びます。
  ru.a1.unit01.lesson01.teach.letter_short_i:
    title: Й й
    gloss: 文字 Й(イ・クラートカエ)
    note: 「ボーイ」の最後のような、軽く滑らせる「イ」の音です。母音ほどはっきりとは発音しません。この課の目標の単語 Здравствуйте にも出てきます。
  ru.a1.unit01.lesson01.teach.zdravstvuyte_shape:
    title: Здравствуйте
    gloss: こんにちは(丁寧)
    note: 丁寧なあいさつの完全な形です。長くて子音が多く見えますが、含まれる文字はすべてこの課で学んだものです。
    example_gloss: こんにちは！私の名前はヴィクトルです。
  ru.a1.unit01.lesson02.teach.zdravstvuyte_privet:
    title: Здравствуйте, Привет
    gloss: こんにちは(丁寧)/やあ(くだけた言い方)
    note: Здравствуйте は、時間帯や相手を問わず使える安心な丁寧なあいさつです。Привет はくだけた言い方で、友達や同年代の人に使います。
    example_gloss:
    - こんにちは！お元気ですか？(丁寧)
    - やあ！調子はどう？(くだけた言い方)
  ru.a1.unit01.lesson02.teach.dobroe_utro:
    title: Доброе утро!
    gloss: おはようございます
    note: 朝から午前中の遅い時間ごろまで使います。
  ru.a1.unit01.lesson02.teach.dobryy_den:
    title: Добрый день!
    gloss: こんにちは
    note: 昼のあいさつの定番で、午前の遅い時間から午後にかけて使えます。
  ru.a1.unit01.lesson02.teach.dobryy_vecher:
    title: Добрый вечер!
    gloss: こんばんは
    note: 夕方や夜に会ったときに使います。出会いのあいさつで、別れのあいさつではありません。
  ru.a1.unit01.lesson02.teach.register_note:
    title: あいさつの選び方
    gloss: Здравствуйте は一日中、丁寧な場面で使えます。Привет はくだけた言い方で、友達どうしで使います。
    note: 時間帯や相手に迷ったら、Здравствуйте なら間違いありません。Привет は、すでによく知っている人だけに使いましょう。
  ru.a1.unit01.lesson03.teach.kak_dela:
    title: Как дела?
    gloss: 元気？(親しい相手に対して)
    note: 友達や同年代の人に使う、日常的でくだけた調子のたずね方です。
  ru.a1.unit01.lesson03.teach.kak_pozhivaete:
    title: Как поживаете?
    gloss: お元気ですか？（丁寧）
    note: 調子をたずねる丁寧な言い方で、вы で話す相手に使います。
  ru.a1.unit01.lesson03.teach.horosho_spasibo:
    title: Хорошо, спасибо
    gloss: 元気です、ありがとう
    note: どちらの場面でも使える、シンプルで前向きな返事です。
    example_gloss: 調子はどう？——元気だよ、ありがとう。
  ru.a1.unit01.lesson03.teach.tak_sebe:
    title: Так себе
    gloss: まあまあ
    note: 良くも悪くもないときに使う、中立からやや否定的な返事です。
    example_gloss: 調子はどう？——まあまあだよ。
  ru.a1.unit01.lesson03.teach.a_u_tebya:
    title: А у тебя?
    gloss: 君は？（くだけた表現）
    note: 相手に同じ質問を返すくだけた言い方で、ты で話す相手に使います。
  ru.a1.unit01.lesson03.teach.do_svidaniya:
    title: До свидания!
    gloss: さようなら(標準・丁寧)
    note: 標準的でどんな場面にも使える別れのあいさつです。直訳は「また会う時まで」に近い意味です。
  ru.a1.unit01.lesson03.teach.poka:
    title: Пока!
    gloss: じゃあね(くだけた言い方)
    note: 友達や知り合いの間でよく使う、気軽な別れのあいさつです。
  ru.a1.unit01.lesson03.teach.do_zavtra:
    title: До завтра!
    gloss: また明日
    note: 翌日にまたその人に会う予定のときに使う、親しみのある別れのあいさつです。
  ru.a1.unit01.lesson03.teach.anna:
    title: アンナがマクシムにあいさつする
    gloss: アンナ：こんにちは！調子はどう？
    note: アンナとマクシムは同僚で、昼間にあいさつをしています。дела を使っているので、くだけた言い方です。
  ru.a1.unit01.lesson03.teach.maksim_reply:
    title: マクシムが答えて、たずね返す
    gloss: マクシム：元気だよ、ありがとう。君は？
    note: マクシムは答えたあと、アンナに合わせてくだけた言い方でたずね返しています。
  ru.a1.unit01.lesson03.teach.anna_close:
    title: アンナが会話をしめくくる
    gloss: アンナ：私も元気だよ。じゃあ、また明日！
    note: アンナは世間話を切り上げて、親しみのある別れのあいさつをします。
  ru.a1.unit01.lesson03.teach.maksim_close:
    title: マクシムが別れを告げる
    gloss: マクシム：また明日！
    note: マクシムはアンナの別れのあいさつを繰り返して、会話を終えます。
