teaching:
  ru.a1.unit09.lesson01.teach.gde:
    title: где
    gloss: どこ
    note: где は場所をたずねる語で、よく находится と一緒に使われます。
    example_gloss: 店はどこですか?
  ru.a1.unit09.lesson01.teach.nakhoditsya:
    title: находится
    gloss: ある(位置する)
    note: находится は находиться(「位置する」)の3人称単数形で、магазин のような単数の主語と一緒に使います。
    example_gloss: 店はどこにありますか?
  ru.a1.unit09.lesson01.teach.ulitsa:
    title: улица
    gloss: 通り
    note: улица は女性名詞です。на Тверской улице(「トヴェルスカヤ通りに」)のように、на の後ろでは前置格を使います。
    example_gloss: お店はトヴェルスカヤ通りにあります。
  ru.a1.unit09.lesson01.teach.gde_nakhoditsya_magazin:
    title: Где находится магазин?
    gloss: 店はどこにありますか?
    note: 場所がどこにあるかをたずねるときの基本の文型です。
  ru.a1.unit09.lesson02.teach.bank_apteka:
    title: банк, аптека
    gloss: 銀行、薬局
    note: банк は男性名詞、аптека は女性名詞です。どちらも町でよく見かける場所です。
    example_gloss:
    - 銀行はどこにありますか。
    - 薬局はどこにありますか。
  ru.a1.unit09.lesson02.teach.vokzal_gostinitsa:
    title: вокзал, гостиница
    gloss: 駅、ホテル
    note: вокзал は男性名詞、гостиница は女性名詞です。
    example_gloss:
    - 駅はどこにありますか。
    - ホテルはどこにありますか。
  ru.a1.unit09.lesson02.teach.restoran_biblioteka:
    title: ресторан, библиотека
    gloss: レストラン、図書館
    note: ресторан は男性名詞、библиотека は女性名詞です。Чайковского や Пушкина のような通りの名前は、улица の後で生格になります。
    example_gloss:
    - レストランはどこにありますか。
    - 図書館はどこにありますか。
  ru.a1.unit09.lesson03.teach.chto_est_na_vashey_ulitse:
    title: Что есть на вашей улице?
    gloss: あなたの通りには何がありますか?
    note: вашей は丁寧な「あなたの」で、前置格の女性名詞 улице に合わせた形です。
  ru.a1.unit09.lesson03.teach.anna_chto_est:
    title: アンナが通りについてたずねる
    gloss: アンナ:あなたの通りには何がありますか。
    note: アンナは Что есть на вашей улице? で会話を始めます。
  ru.a1.unit09.lesson03.teach.viktor_na_moey_ulitse:
    title: ヴィクトルが3つの場所を挙げる
    gloss: ヴィクトル:私の通りには、お店と図書館と銀行があります。
    note: На моей улице есть は、есть(「ある」)を使って物を挙げる言い方で、и でつなぎます。
  ru.a1.unit09.lesson03.teach.anna_a_gde_bank:
    title: アンナが銀行の場所をたずねる
    gloss: アンナ:それで、銀行はどこにありますか。
    note: А は、ヴィクトルが挙げた場所の一つについて続けてたずねるときに、自然につなぐ働きをします。
  ru.a1.unit09.lesson03.teach.viktor_bank_na_pushkina:
    title: ヴィクトルが銀行のある通りを答える
    gloss: ヴィクトル:銀行はプーシキン通りにあります。
    note: ヴィクトルは Банк на улице Пушкина と答えます。улице の後の Пушкина は生格です。
  ru.a1.unit09.lesson03.teach.anna_spasibo_bolshoe:
    title: アンナがヴィクトルにお礼を言う
    gloss: アンナ:どうもありがとうございます。
    note: Спасибо большое は、спасибо に большое(「大きい」)を添えて強めた、「どうもありがとうございます」にあたるよく使う言い方です。
  ru.a1.unit09.lesson03.teach.viktor_pozhaluysta:
    title: ヴィクトルが返事をする
    gloss: ヴィクトル:どういたしまして。
    note: Пожалуйста は、спасибо に対する「どういたしまして」の返事です。
