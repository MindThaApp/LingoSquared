teaching:
  ru.a1.unit26.lesson01.teach.vysokiy_nevysokiy:
    title: 背が高い、背が低い
    gloss: 背が高い／背が低い
    note: '*Высокий* は背が高い人、*невысокий* は背が低い人(直訳は「高くない」)を表します。語尾は性によって変わります:*высокая*、*невысокая*。'
    example_gloss:
    - Lenaは背が高いです。
    - イーゴリは背が低いです。
  ru.a1.unit26.lesson01.teach.staryy_molodoy:
    title: 年を取った、若い
    gloss: 年を取った／若い
    note: '*Старый* と *молодой* は、ここでは正確な年数ではなく、年齢の全体的な印象を表します。'
    example_gloss:
    - おじいさんは年を取っています。
    - ディマは若いです。
  ru.a1.unit26.lesson01.teach.prilagatelnoe_menyaetsya_po:
    title: 形容詞は性によって変わる
    gloss: 形容詞は人の性に合わせて変わります:*он высокий, она высокая*;*он старый, она старая*。
    note: 男性形の形容詞は *-ый*、*-ий*、*-ой* で終わります(*высокий*、*молодой*)。女性形は *-ая* で終わります(*высокая*、*молодая*)。
  ru.a1.unit26.lesson01.teach.lena_vysokaya_a:
    title: Lena は背が高く、イーゴリは背が低い
    gloss: Lena は背が高く、イーゴリは背が低いです。
    note: 2つの文を *а*(一方で、〜で)で並べます:*Лена высокая, а Игорь невысокий*。
  ru.a1.unit26.lesson02.teach.volosy:
    title: 髪
    gloss: 髪
    note: '*Волосы*(髪)はロシア語では複数形です:*У Насти светлые волосы*。単数形は使いません。'
    example_gloss: ディマは短い黒髪です。
  ru.a1.unit26.lesson02.teach.svetlye_kashtanovye_sedye:
    title: 金色、茶色、灰色
    gloss: 金色の／茶色の／灰色の
    note: '*волосы* に合わせた複数形の髪の色が3つあります:*светлые*、*каштановые*、*седые*。'
    example_gloss:
    - ナスティヤは金髪です。
    - イーゴリは茶色の髪です。
    - おじいさんは白髪です。
  ru.a1.unit26.lesson02.teach.dlinnye_korotkie:
    title: 長い髪と短い髪
    gloss: 長い／短い（髪）
    note: '*Длинные*(長い)と *короткие*(短い)も、複数形の *волосы* に合わせた形です。'
    example_gloss:
    - Lenaは長い髪をしています。
    - イーゴリは髪が短いです。
  ru.a1.unit26.lesson02.teach.volosy_stoyat_vo:
    title: 形容詞は волосы に合わせる
    gloss: '*Волосы* は複数形なので、形容詞も複数形になります:*длинные волосы*、*короткие волосы*、*светлые волосы*、*чёрные волосы*。'
    note: 複数形の形容詞は *-ые* または *-ие* で終わります。次のレッスンの *глаза* でも同じ語尾が出てきます。
  ru.a1.unit26.lesson02.teach.posle_u_imya:
    title: у + 生格
    gloss: '*у* のあとでは、持ち主が生格になります:*у Насти*(ナスティヤは〜を持っている)、*у Димы*(ディマは〜を持っている)、*у неё*(彼女は〜を持っている)。'
    note: これがロシア語の「持っている」の言い方です:*у* + 生格 + 持っているもの。「持つ」にあたる動詞は使いません。
  ru.a1.unit26.lesson02.teach.u_dimy_korotkie:
    title: ディマは短い黒髪です
    gloss: ディマは短い黒髪です。
    note: '*Чёрные*(黒い)は複数形の *волосы* に合わせた形です。このコースでは文字 *ё* を常に書きます。'
  ru.a1.unit26.lesson02.teach.u_nasti_dlinnye:
    title: ナスティヤは長い金髪です
    gloss: ナスティヤは長い金髪です。
    note: このレッスンで学ぶ長さと色の語彙を、自然な1つの文に組み合わせています。
  ru.a1.unit26.lesson03.teach.glaza:
    title: 目
    gloss: 目
    note: '*Глаза*(目)は *глаз* の複数形で、複数の語尾は *-а* です。'
    example_gloss: ディマは茶色の目をしています。
  ru.a1.unit26.lesson03.teach.golubye_karie_zelyonye:
    title: 青、茶色、緑
    gloss: 青い／茶色い／緑色の
    note: '*Голубые* は明るい青、*карие* は目にだけ使う茶色、*зелёные* は緑です。3つとも複数形です。'
    example_gloss:
    - ナスティヤは青い目をしています。
    - イーゴリは茶色の目をしています。
    - Lenaは緑色の目をしています。
  ru.a1.unit26.lesson03.teach.glaza_stoyat_vo:
    title: 形容詞は глаза に合わせる
    gloss: '*Глаза* は複数形なので、形容詞も複数形になります:*голубые глаза*、*карие глаза*、*зелёные глаза*。'
    note: 茶色の目は *карие*、茶色の髪は *каштановые* で、*коричневые* とは言いません。ロシア語では目と髪で違う語を使います。
  ru.a1.unit26.lesson03.teach.kak_vyglyadit_nastya:
    title: ナスティヤはどんな外見ですか?
    gloss: ナスティヤはどんな外見ですか?
    note: '*Как выглядит ...?* はこのユニットの中心となる質問です。動詞 *выглядит* は単数の主語に合わせた形です。'
  ru.a1.unit26.lesson03.teach.u_nasti_dlinnye:
    title: ナスティヤは長い金髪で青い目です
    gloss: ナスティヤは長い金髪で青い目をしています。
    note: 模範解答では、髪と目を *и* でつなぎます:*У Насти длинные светлые волосы и голубые глаза*。
  ru.a1.unit26.lesson04.teach.nastya_v_yazykovoe:
    title: ナスティヤがニーナを紹介する
    gloss: ナスティヤ:言語カフェに新しい女の子が来ます。名前はニーナです。
    note: '*Придёт*(来る予定だ)は完了体の未来形です。*Её зовут Нина* は直訳すると「彼女をニーナと呼ぶ」です。'
  ru.a1.unit26.lesson04.teach.dima_khorosho_kak:
    title: ディマがどんな外見かたずねる
    gloss: ディマ:いいね!どんな外見?
    note: 中心となる質問がもう一度出てきます。今度は名前ではなく *она*(彼女)を使います。
  ru.a1.unit26.lesson04.teach.nastya_ona_nevysokaya:
    title: ナスティヤがニーナの身長と髪を説明する
    gloss: ナスティヤ:背は高くなくて、短い金髪だよ。
    note: レッスン1の *невысокая* とレッスン2の髪の単語を組み合わせています。*И у неё* で2つ目の情報を加えます。
  ru.a1.unit26.lesson04.teach.dima_a_kakie:
    title: ディマが目についてたずねる
    gloss: ディマ:じゃあ、目は?
    note: '*Какие у неё глаза?* では *у неё*(彼女は〜を持っている)を使います。*Неё* は前置詞 *у* のあとの *она* の形です。'
  ru.a1.unit26.lesson04.teach.nastya_u_neyo:
    title: ナスティヤがニーナの目を説明する
    gloss: ナスティヤ:緑の目だよ。
    note: レッスン3の *зелёные глаза* を、「彼女は持っている」の *у неё* とともにもう一度使っています。
  ru.a1.unit26.lesson04.teach.dima_spasibo_togda:
    title: ディマは彼女だと分かる
    gloss: ディマ:ありがとう!それなら彼女だと分かるよ。
    note: '*Я её узнаю*(私は彼女だと分かる):ニーナが目的語なので、*её* は *она* の対格です。'
  ru.a1.unit26.lesson05.teach.igor_i_lena:
    title: イーゴリと Lena を比べる
    gloss: イーゴリと Lena は兄と妹(または姉と弟)ですが、見た目は違います。イーゴリは背が低く、短い茶色の髪と茶色の目をしています。Lena はイーゴリより背が高く、長い茶色の髪と緑の目をしています。あなたはどんな外見ですか?
    note: これまでに学んだ色や長さを表す語を使って人の見た目を比べ、最後に自分の見た目について答えます。
    glosses:
      брат: 兄弟
      сестра: 姉妹
      выглядят: ～に見える
      по-разному: 異なる
      невысокий: 背が低い
      короткие: 背が低い
      каштановые: 茶色の
      волосы: 髪
      карие: 茶色の
      глаза: 目
      выше: より背が高い
      длинные: 長い
      зелёные: 緑色の
      выглядишь: あなたは〜に見える(как ты выглядишь? のように)
  ru.a1.unit26.lesson05.teach.posle_vyshe_stoit:
    title: выше を使った比較
    gloss: '*выше*(より背が高い)のあとでは、比べる相手が生格になります:*Лена выше Игоря*。'
    note: 比較級の *выше* は性によって変わりません。比べる相手は生格にするか、*чем* のあとに置きます。
  ru.a1.unit26.lesson05.teach.u_leny_volosy:
    title: Lena はイーゴリより髪が長い
    gloss: Lena はイーゴリより髪が長いです。
    note: '*У Лены волосы длиннее, чем у Игоря*:*длиннее* は変化せず、*чем*(〜より)で2つ目の部分が始まります。'
  ru.a1.unit26.lesson05.teach.u_menya_korotkie:
    title: 私は短い茶色の髪をしています
    gloss: 私は短い茶色の髪をしています。
    note: 自分の外見を言うときの模範文です:*У меня*(私は〜を持っている)+ 形容詞 + 名詞。
  ru.a1.unit26.lesson06.teach.dima_smotri_eto:
    title: ディマがニーナを見つける
    gloss: ディマ:見て、あれがニーナ?短い金髪で緑の目だよ。
    note: '*Смотри*(見て)は親しい相手に使う命令形で、これまでの会話でも同じように使われています。'
  ru.a1.unit26.lesson06.teach.nastya_da_eto:
    title: ナスティヤが認める
    gloss: ナスティヤ:うん、ニーナだよ!
    note: 短く自然に、そうだと伝える表現です。
  ru.a1.unit26.lesson06.teach.nina_privet_ty:
    title: ニーナがディマにあいさつする
    gloss: ニーナ:こんにちは、あなたがディマ?
    note: 親しい間柄の簡単な質問です。ロシア語では「〜である」にあたる動詞は不要で、*Ты Дима?* と言うだけです。
  ru.a1.unit26.lesson06.teach.dima_da_priyatno:
    title: ディーマもニーナにあいさつを返す
    gloss: ディーマ:ええ!はじめまして、ニーナ。
    note: '*Приятно познакомиться*は、初めて会う人に言う決まった表現です。*Познакомиться*は「新しい人と知り合いになる」という意味です。'
  ru.a1.unit26.lesson06.teach.nina_mne_tozhe:
    title: Ninaもあいさつを返します
    gloss: Nina：こちらこそ、はじめまして！
    note: 会話の締めくくりです。ディーマは、ナースチャが前に話した特徴からニーナだとうまく見つけられました。
