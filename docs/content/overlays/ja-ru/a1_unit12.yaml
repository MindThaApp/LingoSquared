teaching:
  ru.a1.unit12.lesson01.teach.davay:
    title: Давай пойдём...
    gloss: ~に行こう
    note: Давай は「~しよう」というくだけた誘いの言葉で、пойдём は「行く」の「私たち」の未来形です。2つを合わせて活動を誘います。
  ru.a1.unit12.lesson01.teach.kino:
    title: кино
    gloss: 映画
    note: кино は「映画、映画館」を表す中性名詞で、格変化しません。
    example_gloss: 映画に行こう。
  ru.a1.unit12.lesson01.teach.zavtra_subbotu:
    title: завтра, в субботу
    gloss: 明日、土曜日に
    note: завтра は「明日」という意味です。в субботу のように、曜日には в と対格を使います。
    example_gloss: 明日映画に行こう。
  ru.a1.unit12.lesson02.teach.soglasen:
    title: Хорошо, я согласен.
    gloss: いいよ、賛成です。
    note: согласен(賛成です)は男性が使います。女性は согласна と言います。
  ru.a1.unit12.lesson02.teach.ne_mogu:
    title: К сожалению, я не могу.
    gloss: 残念ですが、行けません。
    note: К сожалению(残念ながら)は断りをやわらげます。не могу は「できません」という意味です。
  ru.a1.unit12.lesson02.teach.vo_skolko:
    title: Во сколько мы встретимся?
    gloss: 何時に会いますか。
    note: Во сколько は時刻を尋ねる言い方です。встретимся は「会う」の「私たち」の未来形です。
    example_gloss: 7時にしましょう。
  ru.a1.unit12.lesson03.teach.nastya_davay_poydyom:
    title: ナースチャが予定を提案する
    gloss: ナースチャ：土曜日に映画に行こうよ。
    note: Настя は Давай пойдём в кино в субботу. と切り出します。
  ru.a1.unit12.lesson03.teach.dima_horosho_soglasen:
    title: ジーマが賛成して時間を尋ねる
    gloss: ジーマ：いいよ。何時に会う？
    note: Дима は賛成してから、Во сколько мы встретимся? と尋ねます。
  ru.a1.unit12.lesson03.teach.nastya_davay_v_sem:
    title: ナースチャが時間と場所を提案する
    gloss: ナースチャ：7時に映画館の前にしよう。
    note: у кинотеатра は「映画館のそばで」という意味で、у のあとは生格になります。
  ru.a1.unit12.lesson03.teach.dima_otlichno:
    title: ジーマが確認する
    gloss: ジーマ：いいね、土曜日に会おう。
    note: Отлично, до субботы で会話が締めくくられます。до субботы は直訳すると「土曜日まで」です。
