teaching:
  ru.a1.unit08.lesson01.teach.magazin:
    title: магазин
    gloss: 店
    note: магазин は「店」を表す男性名詞です。
    example_gloss: 私たちは店に行きます。
  ru.a1.unit08.lesson01.teach.skolko:
    title: сколько
    gloss: いくら
    note: сколько は数量や値段を尋ねる語で、よく стоит と一緒に使われます。
    example_gloss: パンはいくらですか。
  ru.a1.unit08.lesson01.teach.stoit:
    title: стоит
    gloss: 値段が~である
    note: стоит は стоить(「値段が~である」)の3人称単数形で、хлеб のような単数の主語に使います。
    example_gloss: パンは100ルーブルです。
  ru.a1.unit08.lesson01.teach.rubl:
    title: рубль
    gloss: ルーブル
    note: рубль はロシアの通貨です。сто(「100」)のあとは複数生格の рублей になります。
    example_gloss: パンは100ルーブルです。
  ru.a1.unit08.lesson01.teach.khleb_moloko:
    title: хлеб, молоко
    gloss: パン、牛乳
    note: хлеб は男性名詞、молоко は中性名詞で、どちらも日常的な食料品です。
    example_gloss:
    - パンはいくらですか。
    - 牛乳はいくらですか。
  ru.a1.unit08.lesson02.teach.dayte_pozhaluysta:
    title: Дайте, пожалуйста, ...
    gloss: ~をください
    note: Дайте は дать(「与える」)の丁寧な命令形で、вы に対して使います。複数の相手にも使います。
  ru.a1.unit08.lesson02.teach.kilogramm:
    title: килограмм
    gloss: キログラム
    note: килограмм は、野菜やパンなどを量り売りで買うときの標準的な単位です。
    example_gloss: 1キロください。
  ru.a1.unit08.lesson02.teach.polkilo:
    title: полкило
    gloss: 半キロ
    note: полкило は пол-(「半分」)と кило(килограмм の口語的な短縮形)を合わせた語です。
    example_gloss: 半キロください。
  ru.a1.unit08.lesson02.teach.shtuka:
    title: штука
    gloss: 個(品物)
    note: штука は品物を1つずつ数えるときに使います。пять штук は、数詞 пять のあとで複数生格になります。
    example_gloss:
    - 1個ください。
    - 5個ください。
  ru.a1.unit08.lesson03.teach.pomidory_ogurtsy:
    title: помидоры, огурцы
    gloss: トマト、きゅうり
    note: どちらも複数形の野菜の名詞で、помидоры も огурцы も男性名詞です。
    example_gloss:
    - トマトはありますか。
    - きゅうりはありますか。
  ru.a1.unit08.lesson03.teach.kartofel_kapusta:
    title: картофель, капуста
    gloss: じゃがいも、キャベツ
    note: картофель は男性の集合名詞(数えられない名詞のように使います)で、капуста は女性名詞です。
    example_gloss:
    - じゃがいもはありますか。
    - キャベツはありますか。
  ru.a1.unit08.lesson03.teach.yabloki_apelsiny:
    title: яблоки, апельсины
    gloss: りんご、オレンジ
    note: кило яблок(「1キロのりんご」)では、кило のあとで яблоки が複数生格 яблок になります。кило апельсинов も同じ型です。
    example_gloss:
    - りんご1キロはいくらですか。
    - オレンジ1キロはいくらですか。
  ru.a1.unit08.lesson03.teach.u_vas_est:
    title: У вас есть ...?
    gloss: ~はありますか。(丁寧)
    note: 丁寧な вас を使った言い方で、店の人に品物があるか尋ねるときの標準的な表現です。
  ru.a1.unit08.lesson03.teach.da_u_menya_est:
    title: Да, у меня есть ...
    gloss: はい、~があります。
    note: У меня есть(直訳は「私のところに~がある」)は「私は~を持っています」と言う標準的な表現で、店員の答えとして使います。
  ru.a1.unit08.lesson03.teach.pokupatel_pomidory:
    title: 客がトマトについて尋ねる
    gloss: 客:トマトはありますか。
    note: 客は、丁寧な У вас есть ...? の質問で話を始めます。
  ru.a1.unit08.lesson03.teach.prodavets_da_est:
    title: 店員がはいと答える
    gloss: 店員:はい、ありますよ。
    note: Да, есть は、品物名をくり返さない日常的な短い答えで、直訳は「はい、あります」です。
  ru.a1.unit08.lesson03.teach.pokupatel_kilo_yablok:
    title: 客が値段を尋ねる
    gloss: 客:りんご1キロはいくらですか。
    note: кило яблок では、кило のあとで яблок が複数生格になります。
  ru.a1.unit08.lesson03.teach.prodavets_dvesti:
    title: 店員が値段を答える
    gloss: 店員:200ルーブルです。
    note: Двестиは「200」の意味です。сто と同じく、後ろには複数生格の рублей が来ます。
  ru.a1.unit08.lesson03.teach.pokupatel_dayte_kilogramm:
    title: 客が1キロ買う
    gloss: 客:りんごを1キロください。
    note: レッスン2で学んだ Дайте ..., пожалуйста に、今回は килограмм яблок(「りんご1キロ」)がついています。
  ru.a1.unit08.lesson03.teach.prodavets_khorosho:
    title: 店員が商品を渡す
    gloss: 店員:はい、どうぞ。
    note: ここでの Пожалуйста は、店員が商品を渡すときの「どうぞ」の意味で、「お願いします」ではありません。
