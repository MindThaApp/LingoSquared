teaching:
  ru.a1.unit04.lesson01.teach.kakoy_den:
    title: Какой сегодня день?
    gloss: 今日は何曜日ですか？
    note: Какой は男性名詞 день(「日」)に合わせた形です。
  ru.a1.unit04.lesson01.teach.ponedelnik_vtornik:
    title: понедельник, вторник
    gloss: 月曜日、火曜日
    note: ロシア語では曜日名は大文字で始めません。
    example_gloss:
    - 今日は月曜日です。
    - 今日は火曜日です。
  ru.a1.unit04.lesson01.teach.sreda_chetverg:
    title: среда, четверг
    gloss: 水曜日、木曜日
    note: ロシア語の曜日名はすべて小文字で書きます。среда と четверг も、文頭に来るときだけ大文字で始めます。
    example_gloss:
    - 今日は水曜日です。
    - 今日は木曜日です。
  ru.a1.unit04.lesson01.teach.pyatnitsa_subbota:
    title: пятница, суббота
    gloss: 金曜日、土曜日
    note: суббота は б を2つ重ねます。つづりを間違えやすいので注意しましょう。
    example_gloss:
    - 今日は金曜日です。
    - 今日は土曜日です。
  ru.a1.unit04.lesson01.teach.voskresenye:
    title: воскресенье
    gloss: 日曜日
    note: ロシア語の曜日の一覧で、最後の曜日です。
    example_gloss: 今日は日曜日です。
  ru.a1.unit04.lesson01.teach.segodnya:
    title: Сегодня ...
    gloss: 今日は…です。
    note: Сегодня の後に曜日名を続けるだけで、つなぎの動詞は要りません。
  ru.a1.unit04.lesson02.teach.kakoe_chislo:
    title: Какое сегодня число?
    gloss: 今日は何月何日ですか。
    note: Какое は中性名詞 число(「日付、数」)に合わせた形で、上の какой день とは異なります。
  ru.a1.unit04.lesson02.teach.pervoe_tretye:
    title: первое, третье
    gloss: 1日、3日
    note: 日付の序数は、省略された名詞 число に合わせて中性の語尾(-ое/-ье)になります。
    example_gloss:
    - 今日は1月1日です。
    - 今日は1月3日です。
  ru.a1.unit04.lesson02.teach.pyatoe_desyatoe:
    title: пятое, десятое
    gloss: 5日、10日
    note: первое/третье と同じ、中性形の序数の型です。
    example_gloss:
    - 今日は10月5日です。
    - 今日は4月10日です。
  ru.a1.unit04.lesson02.teach.yanvar_aprel:
    title: января, апреля
    gloss: 1月の、4月の
    note: 日付の後ろでは月の名前が生格になります。так январь は января に、апрель は апреля になります。
    example_gloss:
    - 今日は1月3日です。
    - 今日は4月10日です。
  ru.a1.unit04.lesson02.teach.oktyabrya:
    title: октября
    gloss: 10月の
    note: октябрь の生格形です。января/апреля と同じく、日付の後ろで使います。
    example_gloss: 今日は10月5日です。
  ru.a1.unit04.lesson03.teach.kakoe_segodnya_chislo:
    title: Какое сегодня число?
    gloss: 今日は何月何日ですか。
    note: 日付をたずねるときの基本の言い方です。
  ru.a1.unit04.lesson03.teach.vo_vtornik:
    title: во вторник
    gloss: 火曜日に
    note: 発音しやすいように、вторник の前では前置詞 в が во になります。вторник 自体はここでは形が変わりません(女性名詞の曜日は変わります：в среду, в пятницу, в субботу)。
  ru.a1.unit04.lesson03.teach.vstrecha:
    title: встреча
    gloss: 会う約束
    note: 予定されている会合や面会を表す、よく使う名詞です。
    example_gloss: 会議は火曜日です。
  ru.a1.unit04.lesson03.teach.anna_kakoy_den:
    title: アンナが曜日をたずねる
    gloss: アンナ：今日は何曜日ですか？
    note: アンナは lesson01 で習った день の質問で会話を始めます。
  ru.a1.unit04.lesson03.teach.viktor_sreda:
    title: ヴィクトルが曜日と日付で答える
    gloss: ヴィクトル：今日は水曜日、1月3日です。
    note: ヴィクトルは曜日と序数の日付を一緒に言っています。月は生格の января です。
  ru.a1.unit04.lesson03.teach.anna_khorosho:
    title: アンナが火曜日を提案する
    gloss: アンナ：いいですね。会議は火曜日ですか？
    note: アンナは次の質問をする前に、Хорошо でヴィクトルの答えを受けています。
  ru.a1.unit04.lesson03.teach.viktor_da:
    title: ヴィクトルが日付を確認する
    gloss: ヴィクトル：はい、火曜日の1月9日です。
    note: Да で肯定し、そのあと曜日と日付をもう一度言っています。何日に行われるかを言うときは、序数そのものが生格になります：девятого января(「1月9日に」)。Сегодня девятое января(「今日は1月9日です」)と比べてみましょう。
