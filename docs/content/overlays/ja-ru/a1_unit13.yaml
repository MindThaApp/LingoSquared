teaching:
  ru.a1.unit13.lesson01.teach.vchera_byl:
    title: Вчера я был дома.
    gloss: 昨日、私は家にいました。
    note: вчера は「昨日」という意味です。был は「いる・ある(быть)」の男性形の過去形で、男性が使います。
  ru.a1.unit13.lesson01.teach.byla:
    title: была
    gloss: ~にいた(女性が言う場合)
    note: была は「いる・ある(быть)」の女性形の過去形です。動詞は主語の性に合わせて形が変わります。
    example_gloss: 昨日、彼女は家にいました。
  ru.a1.unit13.lesson01.teach.vecherom:
    title: вечером
    gloss: 夕方に
    note: вечером は「夕方に・夜に」という意味で、過去の出来事がいつだったかを絞り込むときに使います。
    example_gloss: 昨日の夜、私は家にいました。
  ru.a1.unit13.lesson02.teach.hodil_v_kino:
    title: Вчера я ходил в кино.
    gloss: 昨日、私は映画に行きました。
    note: ходил(男性形)は「歩いて行く」の過去形で、行って戻ってきたことを表します。
  ru.a1.unit13.lesson02.teach.hodila:
    title: ходила
    gloss: 行った(女性が言う場合)
    note: ходила は「歩いて行く」の女性形の過去形です。
    example_gloss: 昨日、彼女は映画に行きました。
  ru.a1.unit13.lesson02.teach.smotrel_film:
    title: смотрел фильм
    gloss: 映画を見た
    note: смотрел(男性形)/ смотрела(女性形)は「見る」の過去形です。фильм は「映画」という意味です。
    example_gloss: 私は映画を見ました。
  ru.a1.unit13.lesson03.teach.nastya_chto_ty_delal:
    title: Настя が Дима に何をしたか尋ねる
    gloss: Настя:昨日、何をしたの?
    note: Настя は Что ты делал вчера? と話しかけます。
  ru.a1.unit13.lesson03.teach.dima_hodil_smotrel:
    title: Дима が答えて、聞き返す
    gloss: Дима:映画に行ったよ。いい映画を見たんだ。君は?
    note: Дима は Я ходил в кино. Смотрел хороший фильм. А ты? と答えます。
