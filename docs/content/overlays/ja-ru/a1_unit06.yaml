teaching:
  ru.a1.unit06.lesson01.teach.u_menya_est:
    title: У меня есть ...
    gloss: 私には~がいます/あります
    note: 直訳は「私のところに(~が)ある」で、ロシア語で「私は~を持っている・~がいる」と言う基本の表現です。第3課の У меня два брата も同じ У меня の型でした。何人いるかを言うときは、есть が省かれることがよくあります。
  ru.a1.unit06.lesson01.teach.eto:
    title: Это ...
    gloss: これは~です
    note: Это は人や物を紹介したり指し示したりするときに使い、その人や物の文法上の性に関係なく同じ形です。
  ru.a1.unit06.lesson01.teach.mat_otets:
    title: мать, отец
    gloss: 母、父
    note: мать は、軟音符(-ь)で終わる少数の女性名詞の一つです。
    example_gloss:
    - こちらは私の母です。
    - こちらは私の父です。
  ru.a1.unit06.lesson01.teach.brat_sestra:
    title: брат, сестра
    gloss: 兄・弟、姉・妹
    note: брат は第3課で数えるときに使った(「У меня два брата」)単語です。сестра はその女性形にあたる言葉です。
    example_gloss:
    - こちらは私の兄弟です。
    - 私には姉(妹)がいます。
  ru.a1.unit06.lesson01.teach.moy_moya:
    title: мой, моя
    gloss: 私の(男性名詞につく)、私の(女性名詞につく)
    note: мой は отец や брат のような男性名詞に、моя は мать や сестра のような女性名詞に使います。
  ru.a1.unit06.lesson02.teach.babushka_dedushka:
    title: бабушка, дедушка
    gloss: 祖母、祖父
    note: どちらも -а で終わりますが、дедушка は男性を指し、一致の上では男性名詞です。мой дедушка、моя бабушка となります。
    example_gloss:
    - こちらは私の祖母です。
    - こちらは私の祖父です。
  ru.a1.unit06.lesson02.teach.muzh_zhena:
    title: муж, жена
    gloss: 夫、妻
    note: муж は男性名詞、жена は女性名詞で、語尾による性の規則どおりです。
    example_gloss:
    - これは私の夫です。
    - これは私の妻です。
  ru.a1.unit06.lesson02.teach.syn_doch:
    title: сын, дочь
    gloss: 息子、娘
    note: дочь も мать と同じく、軟音符(-ь)で終わる女性名詞です。
    example_gloss: 私には息子と娘がいます。
  ru.a1.unit06.lesson02.teach.deti:
    title: дети
    gloss: 子どもたち
    note: дети は ребёнок(「子ども」)の不規則な複数形で、単数と複数がまったく別の形をしています。
    example_gloss: お子さんはいらっしゃいますか。
  ru.a1.unit06.lesson02.teach.u_vas_est:
    title: У вас есть ...?
    gloss: ~はお持ちですか/いらっしゃいますか(丁寧)
    note: 丁寧な вас を使っており、第2課で学んだ вы の丁寧な言い方に合わせています。
  ru.a1.unit06.lesson03.teach.kto_eto:
    title: Кто это?
    gloss: これは誰ですか。
    note: 写真を見ているときなどに、誰なのかを尋ねる基本の言い方です。
  ru.a1.unit06.lesson03.teach.eyo_zovut:
    title: Её зовут Анна.
    gloss: 彼女の名前はアンナです。
    note: 直訳は「人々は彼女をアンナと呼ぶ」で、Её(「彼女を」)は動詞 зовут の目的語であり、主語ではありません。
  ru.a1.unit06.lesson03.teach.maksim_kto_eto:
    title: マクシムが写真について尋ねる
    gloss: マクシム:写真に写っているのは誰ですか。
    note: マクシムは写真を指して Кто это на фото? と尋ねて会話を始めます。
  ru.a1.unit06.lesson03.teach.olga_moya_semya:
    title: オリガが家族を紹介する
    gloss: オリガ:これは私の家族です。
    note: Это моя семья では、女性名詞の семья(「家族」)に合わせて моя を使います。
  ru.a1.unit06.lesson03.teach.olga_vot_otets:
    title: オリガが家族三人の名前を挙げる
    gloss: オリガ:こちらが私の父と母と兄(弟)です。
    note: Вот(「ここに~がある」)が列挙の導入になります。所有詞(мой/моя)は、それぞれ後ろの名詞の性に合わせます。
  ru.a1.unit06.lesson03.teach.maksim_a_kto_devochka:
    title: マクシムが女の子について尋ねる
    gloss: マクシム:それで、この女の子は誰ですか。
    note: А は、写真の四人目について続けて尋ねるときに、話を自然につなぎます。
  ru.a1.unit06.lesson03.teach.olga_eto_moya_doch:
    title: オリガが娘を紹介する
    gloss: オリガ:これは私の娘です。名前はアンナです。
    note: オリガは моя дочь と答え、続けて Её зовут Анна で名前を伝えます。
