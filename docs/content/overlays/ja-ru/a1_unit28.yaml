    gloss: ディマ:いいね、僕もそこでよくサッカーをするんだ。
  ru.a1.unit28.lesson05.teach.nastya_zanimaetsya_yogoy:
    title: ナスチャとレーナのスポーツの話
    gloss: ナスチャは週に2回ヨガをしています。彼女は静かに体を動かすのが好きです。レーナはヨガはしませんが、泳ぐのが好きです。レーナはよく、ほぼ毎週泳ぎます。あなたはどんなスポーツをしていますか?
    note: 2つのスポーツと2つの頻度を対比した短い文章です:*два раза в неделю* と *почти каждую неделю*。
    glosses:
      занимается: する
      два: '2'
      раза: 回
      неделю: 週
      йогой: ヨガ
      любит: 大好きである
      спокойно: 穏やかに
      двигаться: 動く
      плавать: 泳ぐこと
      плавает: 泳ぐ
      часто: よく
      почти: ほとんど
      Каким: どの
      спортом: スポーツ
  ru.a1.unit28.lesson05.teach.lena_chasto_plavaet:
    title: レーナはよく泳ぎます。ほぼ毎週です
    gloss: レーナはよく泳ぎます。ほぼ毎週です。
  ru.a1.unit28.lesson05.teach.ya_igrayu_v:
    title: 私はサッカーをします。サッカーが大好きです
    gloss: 私はサッカーをします。サッカーが大好きです
    note: このユニットの作文問題でそのまま応用できる、二文からなる解答例です。
  ru.a1.unit28.lesson06.teach.nastya_davay_vmeste:
    title: ナスチャが提案する
    gloss: ナスチャ:一緒に運動しない?
  ru.a1.unit28.lesson06.teach.davay_govoryat_drugu:
    title: Давай と давайте
    gloss: '*Давай* は親しい相手(*ты*)一人に対して使い、*давайте* は複数の人や丁寧な *Вы* に対して使います。'
    note: 予定についての課で学んだ、何かを一緒にしようと提案する構文をそのまま使っています。
  ru.a1.unit28.lesson06.teach.lena_da_zdorovo:
    title: レーナが賛成します
    gloss: レーナ：はい、喜んで！泳ぐのが大好きです。
