    title: Заниматься + 造格
    gloss: '*заниматься* の後では、スポーツは造格になります:*заниматься йогой*、*заниматься бегом*、*заниматься плаванием*。'
    note: この段階では、スポーツごとに別の動詞を覚える必要はありません。一つの構文で、どのスポーツも言い表せます。
  ru.a1.unit28.lesson02.teach.raz_v_nedelyu:
