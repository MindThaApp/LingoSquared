    title: Бегать は一つの動詞
    gloss: '*Бегать* は規則的な語尾をもつ一つの動詞です:*я бегаю*、*ты бегаешь*、*он бегает*。'
    note: '*Бегать* は習慣として走ることを表します。このユニットではこの形だけを使います。語尾は *-аю*、*-аешь*、*-ает* です。'
  ru.a1.unit28.lesson04.teach.dima_kak_zdorovo:
