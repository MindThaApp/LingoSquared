  ru.a1.unit28.lesson02.teach.posle_dva_stoit:
    title: 回数の数え方:раз と раза
    gloss: '*два*(2)の後は *раза*、*пять*(5)の後は *раз* になります:*два раза в неделю*、*пять раз в неделю*。'
