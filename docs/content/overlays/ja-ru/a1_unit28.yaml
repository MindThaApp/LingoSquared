    title: Спортом か、具体的なスポーツか
    gloss: '*Заниматься спортом* はスポーツ全般について話すときに使い、*заниматься йогой* は具体的なスポーツ名を挙げます。'
    note: どちらも正しい言い方です:*Я занимаюсь спортом по субботам*(全般)と *Я занимаюсь йогой*(具体的)。
