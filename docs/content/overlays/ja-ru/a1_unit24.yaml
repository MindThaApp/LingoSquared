teaching:
  ru.a1.unit24.lesson01.teach.mozhno_kartoy:
    title: Можно картой?
    gloss: カードで支払えますか？
    note: картой は карта の造格形で、カードで支払うときに使います。
    example_gloss: 今日はカードで払えますか。
  ru.a1.unit24.lesson01.teach.nalichnymi:
    title: наличными
    gloss: 現金で
    note: наличными は現金で支払うことを表します。
    example_gloss: 現金でできます。
  ru.a1.unit24.lesson01.teach.rubli:
    title: рубли
    gloss: ルーブル
    note: рубли は通貨の名前です。多くの数字の後ろでは рублей になります。
    example_gloss: ルーブルが必要です。
  ru.a1.unit24.lesson02.teach.chek_nuzhen:
    title: Чек нужен?
    gloss: レシートは必要ですか?
    note: нужен は男性名詞の чек に合わせた形です。
    example_gloss: 今日、レシートは必要ですか?
  ru.a1.unit24.lesson02.teach.s_vas_trista:
    title: С вас триста рублей.
    gloss: 300ルーブルになります。
    note: С вас... は、レジで金額を伝えるときによく使う表現です。
    example_gloss: 今日は300ルーブルになります。
  ru.a1.unit24.lesson02.teach_tolko_nalichnymi:
    title: Только наличными.
    gloss: 現金のみです。
    note: Только は「〜だけ」「〜のみ」という意味です。
    example_gloss: 今日は現金のみです。
  ru.a1.unit24.lesson03.teach.dima_mozhno_kartoy:
    title: ディマがカード払いについて尋ねる
    gloss: ディマ:カードで払えますか?
    note: 使える支払い方法を尋ねる表現です。
  ru.a1.unit24.lesson03.teach.kassir_da_s_vas:
    title: 店員が金額を伝える
    gloss: 店員:はい、できます。300ルーブルになります。
    note: 店員はカード払いができると答え、金額を伝えています。
  ru.a1.unit24.lesson03.teach.dima_vot_karta:
    title: ディマがカードを渡す
    gloss: ディマ:カードです。
    note: Вот карта は、物を渡すときの簡単な表現です。
