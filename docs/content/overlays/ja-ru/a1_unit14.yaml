teaching:
  ru.a1.unit14.lesson01.teach.mne_nravitsya_kofe:
    title: Мне нравится кофе.
    gloss: コーヒーが好きです。
    note: мне нравится(「私に気に入る」)は、与格の мне と нравится を組み合わせて「好き」を表します。
  ru.a1.unit14.lesson01.teach.ne_nravitsya:
    title: не нравится
    gloss: 好きではない
    note: не(「〜ない」)を нравится の前に置くと、「好き」の構文が否定になります。
    example_gloss: 私はお茶が好きではありません。
  ru.a1.unit14.lesson01.teach.chay:
    title: чай
    gloss: お茶
    note: чай は「お茶」を表す単語です。
    example_gloss: 私はお茶が好きです。
  ru.a1.unit14.lesson02.teach.ya_hochu_chay:
    title: Я хочу чай.
    gloss: 私はお茶がほしいです。
    note: хочу(「私はほしい」)は хотеть の一人称現在形で、直接目的語とともに望むものを表します。
  ru.a1.unit14.lesson02.teach.ne_hochu:
    title: не хочу
    gloss: ほしくない
    note: не хочу は хочу を否定して「私はほしくない」という意味になります。
    example_gloss: 私はコーヒーがほしくありません。
  ru.a1.unit14.lesson02.teach.sok:
    title: сок
    gloss: ジュース
    note: сок は「ジュース」を表す単語です。
    example_gloss: 私はジュースがほしいです。
  ru.a1.unit14.lesson03.teach.nastya_tebe_nravitsya:
    title: ナースチャはディマにコーヒーが好きか尋ねる
    gloss: ナースチャ:コーヒーは好き?
    note: Настя は Тебе нравится кофе? と話し始めます。
  ru.a1.unit14.lesson03.teach.dima_da_mne_nravitsya:
    title: ディマは答えて、聞き返す
    gloss: ディマ:うん、コーヒーが好きだよ。君は?
    note: Дима は Да, мне нравится кофе. А тебе? と答えます。
  ru.a1.unit14.lesson03.teach.nastya_ne_nravitsya_hochu_chay:
    title: ナースチャは答えて、ほしいものを言う
    gloss: ナースチャ:コーヒーは好きじゃありません。紅茶がほしいです。
    note: ナースチャは Мне не нравится кофе. Я хочу чай. と答えます。
  ru.a1.unit14.lesson03.teach.dima_horosho_hochu_sok:
    title: ジーマは飲みたいものを言います
    gloss: ジーマ:わかりました、ぼくはジュースがほしいです。
    note: ジーマは Хорошо, я хочу сок. と言って会話を終えます。
