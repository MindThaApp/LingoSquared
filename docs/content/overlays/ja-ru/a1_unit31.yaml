    title: 誰が何を学んでいますか？
    gloss: イーゴリは仕事をしているだけでなく、勉強もしています。成人教育センターでスペイン語のコースを受けています。毎週新しい単語を覚えています。レーナはカレッジでプログラムを受けています。そこで医療・保健を学んでいます。二人とも学ぶことが好きです。あなたは何を学んでいますか。それとも、何を学びたいですか。
    note: イーゴリとЛеnaの学びを比べる読み物です。テクノロジーのユニットの比較読解と同じ形式です。
