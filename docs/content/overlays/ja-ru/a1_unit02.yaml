teaching:
  ru.a1.unit02.lesson01.teach.kak_vas_zovut:
    title: Как вас зовут?, Как тебя зовут?
    gloss: お名前は何ですか。(丁寧);名前は何？(くだけた言い方)
    note: Как вас зовут? は丁寧な вас を使い、初対面の人や改まった場面で使います。Как тебя зовут? はくだけた тебя を使い、友だち、子ども、同年代の人に使います。
    example_gloss:
    - こんにちは！お名前は何ですか。
    - やあ！名前は何？
  ru.a1.unit02.lesson01.teach.menya_zovut:
    title: Меня зовут Виктор.
    gloss: 私の名前はヴィクトルです。
    note: Меня зовут(直訳は「人々は私を~と呼ぶ」)は、丁寧さに関係なく名前を言うときの標準的な言い方です。
  ru.a1.unit02.lesson01.teach.menya_zovut_anna:
    title: Меня зовут Анна.
    gloss: 私の名前はアンナです。
    note: 名前だけを変えた同じ型の Меня зовут ... です。この表現は話し手自身の性別によって変わりません。
  ru.a1.unit02.lesson01.teach.register_note:
    title: 適切な質問の選び方
    gloss: Как вас зовут? は丁寧な言い方で、初対面の人に使います。Как тебя зовут? は友だち、子ども、同年代の人に使います。
    note: ここでの丁寧・くだけたの使い分けは、lesson02 で詳しく学ぶ вы と ты の区別と対応しています。вас と тебя は вы と ты の目的語の形です。
  ru.a1.unit02.lesson02.teach.vy_ty:
    title: вы, ты
    gloss: あなた(丁寧);あなた・きみ(くだけた言い方)
    note: 日本語の「あなた」は場面によって失礼になることもありますが、ロシア語では вы と ты を使い分けるのが基本です。вы は初対面の人、年長者、仕事の場面で、ты は友だち、家族、子どもに使います。
    example_gloss:
    - どちらのご出身ですか。(丁寧)
    - どこの出身？(くだけた言い方)
  ru.a1.unit02.lesson02.teach.vy_ty_rule:
    title: それぞれの使い方
    gloss: Вы は丁寧な言い方で、初対面の人、職場、年長者に使います。Ты はくだけた言い方で、友だち、家族、子どもに使います。
    note: вы を期待している相手に ты を使うと、なれなれしく、ときには失礼に聞こえます。迷ったときは вы から始めましょう。
  ru.a1.unit02.lesson02.teach.mozhno_na_ty:
    title: Можно на ты?
    gloss: くだけた ты で話してもいいですか。
    note: 親しくなってきたときに、丁寧な вы からくだけた ты に切り替えることを提案する丁寧な言い方です。
  ru.a1.unit02.lesson02.teach.davayte_pereydyom:
    title: Давайте перейдём на ты.
    gloss: くだけた ты で話しましょう。
    note: Можно на ты? と同じように言葉づかいの切り替えを提案する、もう少し直接的で誘いかけるような言い方です。
  ru.a1.unit02.lesson02.teach.otkuda_vy:
    title: Откуда вы?
    gloss: どちらのご出身ですか。(丁寧)
    note: 丁寧な вы を使っており、初対面や仕事の場面にふさわしい言い方です。
  ru.a1.unit02.lesson02.teach.otkuda_ty:
    title: Откуда ты?
    gloss: どこの出身？(くだけた言い方)
    note: くだけた形で、すでによく知っている相手に使います。
  ru.a1.unit02.lesson02.teach.ya_iz_kanady:
    title: Я из Канады.
    gloss: 私はカナダの出身です。
    note: Из(「~から」)は生格をとるので、ここでは Канада が Канады になります。格の文法は後で学びますが、この出身を表す生格の型に注目しておきましょう。
  ru.a1.unit02.lesson02.teach.ya_iz_moskvy:
    title: Я из Москвы.
    gloss: 私はモスクワの出身です。
    note: Я из Канады と同じ出身を表す生格の型で、из のあとでは Москва が Москвы になります。
  ru.a1.unit02.lesson03.teach.davayte_poznakomimsya:
    title: Давайте познакомимся.
    gloss: お互いに自己紹介しましょう。
    note: 初めて会う人どうしが自己紹介を始めるときによく使う、丁寧な言い方です。
  ru.a1.unit02.lesson03.teach.ochen_priyatno:
    title: Очень приятно
    gloss: はじめまして
    note: 相手が名前を言った直後に返す、標準的で丁寧な言葉です。
    example_gloss: 私の名前はジョンです。--はじめまして。
  ru.a1.unit02.lesson03.teach.irina_greeting:
    title: イリーナ・ペトロヴナが自己紹介を始める
    gloss: イリーナ・ペトロヴナ：こんにちは！お互いに自己紹介しましょう。私の名前はイリーナ・ペトロヴナです。
    note: イリーナ・ペトロヴナは改まったオフィスで初めてジョンに会うので、丁寧な Здравствуйте を使い、終始 вы の丁寧な言い方で話します。
  ru.a1.unit02.lesson03.teach.john_reply:
    title: ジョンが名前を言って答える
    gloss: ジョン：はじめまして。私の名前はジョンです。
    note: ジョンは Очень приятно で、イリーナ・ペトロヴナの改まった丁寧な言葉づかいに合わせています。
  ru.a1.unit02.lesson03.teach.irina_question:
    title: イリーナ・ペトロヴナがジョンの出身をたずねる
    gloss: イリーナ・ペトロヴナ：ジョンさん、どちらのご出身ですか。
    note: オフィスという場面に合わせて、丁寧な Откуда вы を使っています。
  ru.a1.unit02.lesson03.teach.john_answer:
    title: ジョンが答えて、たずね返す
    gloss: ジョン：私はカナダの出身です。あなたはどちらのご出身ですか。
    note: ジョンは出身を答え、А вы откуда? で丁寧に同じ質問を返しています。
  ru.a1.unit02.lesson03.teach.irina_answer:
    title: イリーナ・ペトロヴナが答える
    gloss: イリーナ・ペトロヴナ：私はモスクワの出身です。
    note: lesson02 で学んだ出身を表す生格の型を使って、やりとりを締めくくっています。
