teaching:
  ru.a1.unit03.lesson01.teach.u_menya:
    title: У меня ...
    gloss: 私は~を持っています
    note: 直訳は「私のところに(~が)ある」で、ロシア語で「持っている」を表す標準的な言い方です。「持つ」にあたる動詞は使いません。
  ru.a1.unit03.lesson01.teach.odin_dva:
    title: один, два
    gloss: 1、2
    note: два(2)の後ろでは、名詞は特別な単数生格の形になります。брат(兄・弟)は複数形ではなく брата になります。
    example_gloss:
    - 私には兄(弟)が一人います。
    - 兄弟が2人います。
  ru.a1.unit03.lesson01.teach.tri_chetyre:
    title: три, четыре
    gloss: 3、4
    note: Три と четыре も два と同じ単数生格の名詞を取ります。книга(本)は два/три/четыре の後では книги になります。
    example_gloss:
    - 本を3冊持っています。
    - 私は本を4冊持っています。
  ru.a1.unit03.lesson01.teach.pyat:
    title: пять
    gloss: 五
    note: пять(5)以上では、名詞は生格複数形になります。рубль(ルーブル)は рубли ではなく рублей になります。
    example_gloss: 私は5ルーブル持っています。
  ru.a1.unit03.lesson01.teach.brat_bratya:
    title: брат, брата
    gloss: 兄・弟、2〜4人の兄・弟
    note: брата は два、три、четыре の後だけで使う単数生格の形で、普通の複数形ではありません。
    example_gloss: 兄弟が2人います。
  ru.a1.unit03.lesson01.teach.kniga_knigi:
    title: книга, книги
    gloss: 本、2〜4冊の本
    note: книги は брата と同じ単数生格のパターンで、два、три、четыре の後で使います。
    example_gloss: 本を3冊持っています。
  ru.a1.unit03.lesson01.teach.rubl_rubley:
    title: рубль, рублей
    gloss: ルーブル、5以上のルーブル
    note: рублей は пять(5)以上で使う生格複数形です。
    example_gloss: 私は5ルーブル持っています。
  ru.a1.unit03.lesson02.teach.shest_sem:
    title: шесть, семь
    gloss: 6、7
    note: пять と同様に、шесть と семь も生格複数形の名詞を取ります。
    example_gloss:
    - 6時です。
    - 私は7ルーブル持っています。
  ru.a1.unit03.lesson02.teach.vosem_devyat:
    title: восемь, девять
    gloss: 8、9
    note: どちらも生格複数形のパターンが続きます。книга は книг に、рубль は рублей になります。
    example_gloss:
    - 私は本を8冊持っています。
    - 私は9ルーブル持っています。
  ru.a1.unit03.lesson02.teach.desyat:
    title: десять
    gloss: 十
    note: 年齢の表現にも使います。Мне десять лет(私は10歳です)のように言います。
    example_gloss: 私は10歳です。
  ru.a1.unit03.lesson02.teach.kniga_genitive_plural:
    title: книг
    gloss: 本(生格複数、5以上)
    note: книга の生格複数形で、пять以上で使います。語末の母音がなくなる点が、два/три/четыре の後で使う книги とは異なります。
    example_gloss: 私は本を9冊持っています。
  ru.a1.unit03.lesson02.teach.mne_let:
    title: Мне десять лет.
    gloss: 私は10歳です。
    note: ロシア語では年齢を、「私は~歳だ」という動詞ではなく、与格の「私に」(мне)+数+лет(「年」の生格複数)で表します。
  ru.a1.unit03.lesson02.teach.skolko_vam_let:
    title: Сколько вам лет?
    gloss: おいくつですか？（敬称）
    note: 丁寧な与格 вам を使っており、第2課の вы の丁寧な言い方に対応しています。
  ru.a1.unit03.lesson03.teach.skolko_stoit:
    title: Сколько это стоит?
    gloss: これはいくらですか?
    note: 一つの品物の値段を尋ねる標準的な言い方で、стоит(「かかる」の単数形)を使います。
  ru.a1.unit03.lesson03.teach.skolko_stoyat:
    title: Сколько стоят яблоки?
    gloss: りんごはいくらですか?
    note: яблоки(りんご)が複数なので、стоят(「かかる」の複数形)を使います。Сколько это стоит? の単数形 стоит とは異なります。
  ru.a1.unit03.lesson03.teach.rubley:
    title: рубль, рубля, рублей
    gloss: ルーブル(1)、ルーブル(2〜4)、ルーブル(5以上)
    note: 「ルーブル」は前の数によって形が変わります。1なら рубль、2〜4なら рубля、5以上なら рублей です。
    example_gloss:
    - これは1ルーブルです。
    - これは2ルーブルです。
    - これは5ルーブルです。
  ru.a1.unit03.lesson03.teach.pokupatel_greeting:
    title: 客が売り手に挨拶する
    gloss: 客:こんにちは!りんごはいくらですか。
    note: 市場の屋台で、客は値段を尋ねる前に Здравствуйте と丁寧に挨拶します。
  ru.a1.unit03.lesson03.teach.prodavets_apples:
    title: 売り手が答える
    gloss: 売り手:3ルーブルです。
    note: Три рубля では、три に合わせて「ルーブル」が2〜4用の単数生格の形になっています。
  ru.a1.unit03.lesson03.teach.pokupatel_bread:
    title: 客がパンについて尋ねる
    gloss: 客:では、パンはいくらですか。
    note: 客は А(「では・それで」)を使って、二つ目の品物について自然に続けて尋ねています。
  ru.a1.unit03.lesson03.teach.prodavets_bread:
    title: 店員がもう一度答える
    gloss: 店員:6ルーブルです。
    note: Шесть рублей は、шесть に合わせて、5以上で使う複数生格の形になっています。
  ru.a1.unit03.lesson03.teach.pokupatel_close:
    title: 客が丁寧に会話を終える
    gloss: 客:わかりました、ありがとう!
    note: Хорошо, спасибо! は、あいさつの単元で学んだ語を使って、市場でのやり取りを気持ちよく締めくくる表現です。
