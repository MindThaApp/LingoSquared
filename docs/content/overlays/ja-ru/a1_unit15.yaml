teaching:
  ru.a1.unit15.lesson01.teach.kofe_luchshe_chem_chay:
    title: Кофе лучше, чем чай.
    gloss: コーヒーは紅茶よりおいしいです。
    note: лучше(「よりよい」)と чем(「〜より」)を組み合わせて、基本的な比較の文を作ります。
  ru.a1.unit15.lesson01.teach.huzhe:
    title: хуже
    gloss: より悪い
    note: хуже(「より悪い」)は лучше の反対の比較級で、同じように чем と一緒に使います。
    example_gloss: 紅茶はコーヒーより劣ります。
  ru.a1.unit15.lesson01.teach.kakoy:
    title: какой / какое
    gloss: どの/どんな
    note: какой(男性形)と какое(中性形)は、二つのうちどれかをたずねる言葉で、名詞の性に合わせて形が変わります。
    example_gloss: どちらのコーヒーのほうがいいですか。
  ru.a1.unit15.lesson02.teach.eto_kafe_bolshe:
    title: Это кафе больше, чем то.
    gloss: このカフェはあのカフェより大きいです。
    note: больше(「より大きい/より多い」)と чем で大きさの比較を表します。это/то(「これ/あれ」)で二つのカフェを指しています。
  ru.a1.unit15.lesson02.teach.menshe:
    title: меньше
    gloss: より小さい/より少ない
    note: меньше(「より小さい/より少ない」)は больше の反対の比較級です。
    example_gloss: あのカフェはこのカフェより小さいです。
  ru.a1.unit15.lesson02.teach.dom:
    title: дом
    gloss: 家
    note: дом(「家」)に этот/тот(「この/あの」)を組み合わせると、二つの家の大きさを比べられます。
    example_gloss: この家はあの家より大きいです。
  ru.a1.unit15.lesson03.teach.nastya_kakoye_kafe_luchshe:
    title: ナスチャがどのカフェがいいか尋ねます
    gloss: ナスチャ：どのカフェのほうがいいですか？
    note: Настя は Какое кафе лучше? と話し始めます。
  ru.a1.unit15.lesson03.teach.dima_eto_kafe_luchshe:
    title: ディマが答えます
    gloss: ディマ：このカフェのほうがあのカフェよりいいです。
    note: Дима は Это кафе лучше, чем то. と答えます。
  ru.a1.unit15.lesson03.teach.nastya_a_bolshe:
    title: ナスチャが大きさを尋ね、ディマが肯定します
    gloss: ナスチャ：それで、こちらのカフェのほうが大きいですか？ディマ：はい、このカフェはあのカフェより大きいです。
    note: Настя は А это кафе больше? と尋ね、Дима は Да, это кафе больше, чем то. と肯定します。
