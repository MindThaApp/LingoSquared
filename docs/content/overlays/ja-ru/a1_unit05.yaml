teaching:
  ru.a1.unit05.lesson01.teach.kotoryy_chas:
    title: Который час?
    gloss: 何時ですか？
    note: 時刻をたずねる決まった言い方です。直訳すると「どの時(何時)」です。
  ru.a1.unit05.lesson01.teach.seychas_chas:
    title: Сейчас час.
    gloss: 今、1時です。
    note: 「Час」だけで「1時」を表します。2以上の数詞を使う形と違い、ここでは「один час」とは言いません。
    example_gloss: 何時ですか。―1時です。
  ru.a1.unit05.lesson01.teach.dva_tri_chasa:
    title: два часа, три часа
    gloss: 2時、3時
    note: двａ と три の後では、час は単数生格の часа になります。第3課の数詞と名詞の型と同じです。
    example_gloss:
    - 今、2時です。
    - 今、3時です。
  ru.a1.unit05.lesson01.teach.pyat_desyat_chasov:
    title: пять часов, десять часов
    gloss: 5時、10時
    note: пять以上では、час は複数生格の часов になります。これも第3課の5以上の型と同じです。
    example_gloss:
    - 今、5時です。
    - 今、10時です。
  ru.a1.unit05.lesson02.teach.v_kotorom_chasu:
    title: В котором часу?
    gloss: 何時に？
    note: 何かが起こる時刻をたずねるときに使います。現在の時刻をたずねるだけの Который час? とは違います。
  ru.a1.unit05.lesson02.teach.utrom_dnem:
    title: утром, днём
    gloss: 朝に、昼に
    note: утро と день の副詞形(造格)で、前置詞なしで使います。
    example_gloss:
    - 朝、コーヒーを飲みます。
    - 昼は働いています。
  ru.a1.unit05.lesson02.teach.vecherom_nochyu:
    title: вечером, ночью
    gloss: 夕方に・夜に、夜中に
    note: утром/днём と同じ造格の副詞の型です。
    example_gloss:
    - 夜は家にいます。
    - 夜は寝ます。
  ru.a1.unit05.lesson02.teach.v_dva_chasa_dnya:
    title: В два часа дня.
    gloss: 午後2時に。
    note: 時刻の後に дня(день の生格)を添えると、午前2時ではなく午後2時だとはっきりします。
    example_gloss: 会議は何時ですか。―午後2時です。
  ru.a1.unit05.lesson02.teach.v_sem_chasov_vechera:
    title: В семь часов вечера.
    gloss: 午後7時に。
    note: вечера(вечер の生格)で、この7時が夕方・夜の7時だとはっきりします。
    example_gloss: 店は午後7時に閉まります。
  ru.a1.unit05.lesson03.teach.skazhite_pozhaluysta:
    title: Скажите, пожалуйста, который час?
    gloss: すみません、今何時か教えていただけますか。
    note: Скажите, пожалуйста を添えると質問が丁寧になり、知らない人にたずねるときに適しています。
  ru.a1.unit05.lesson03.teach.kogda_otkhodit:
    title: Когда отходит поезд?
    gloss: 列車はいつ出発しますか。
    note: Отходит(「出発する」)は、列車やバスが駅を出るときに使う標準的な動詞です。
  ru.a1.unit05.lesson03.teach.passazhir_vopros:
    title: 乗客が時刻をたずねる
    gloss: 乗客：すみません、今何時か教えていただけますか。
    note: 乗客は駅員に話しかけるので、丁寧に Скажите, пожалуйста で切り出します。
  ru.a1.unit05.lesson03.teach.kassir_sem:
    title: 窓口係が答える
    gloss: 窓口係：今、午前7時です。
    note: Сейчас семь часов утра は現在の時刻を述べる文で、утра(「午前の」)を添えてはっきりさせています。
  ru.a1.unit05.lesson03.teach.passazhir_kogda:
    title: 乗客が列車についてたずねる
    gloss: 乗客：それで、列車はいつ出発しますか。
    note: А は、乗客の続きの質問を自然につなぎます。
  ru.a1.unit05.lesson03.teach.kassir_vosem:
    title: 窓口係が出発時刻を伝える
    gloss: 窓口係：午前8時です。
    note: В восемь часов утра は、前置詞 в に時刻と時間帯を表す語を続けた答え方です。
