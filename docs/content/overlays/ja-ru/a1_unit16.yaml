teaching:
  ru.a1.unit16.lesson01.teach.u_menya_bolit_golova:
    title: У меня болит голова.
    gloss: 頭が痛いです。
    note: у меняは「私は〜を持っている」(直訳は「私のところに」)という意味です。болитは「痛む」という意味で、голова(頭)のような単数の主語に合わせた形です。
  ru.a1.unit16.lesson01.teach.zhivot:
    title: живот
    gloss: おなか
    note: животは「お腹」という意味です。у меня болит...の形は、どの体の部分にも使えます。
    example_gloss: おなかが痛いです。
  ru.a1.unit16.lesson01.teach.gorlo:
    title: горло
    gloss: のど
    note: горлоは「のど」という意味です。
    example_gloss: 喉が痛いです。
  ru.a1.unit16.lesson02.teach.u_menya_temperatura:
    title: У меня температура.
    gloss: 熱があります。
    note: температураは直訳すると「温度」ですが、ロシア語では「熱がある」と言うときの標準的な言い方です。
  ru.a1.unit16.lesson02.teach.prostuda:
    title: простуда
    gloss: 風邪
    note: простудаは(病気の)「風邪」という意味です。у меня простудаで「風邪をひいています」という意味になります。
    example_gloss: 風邪をひいています。
  ru.a1.unit16.lesson02.teach.mne_ploho:
    title: Мне плохо.
    gloss: 気分が悪いです。/具合が悪いです。
    note: Мне плохоは、特定の症状を言わずに、具合が悪いことを全般的に伝える言い方です。
  ru.a1.unit16.lesson03.teach.dima_zdravstvuyte_bolit:
    title: ディマが医者にあいさつする
    gloss: ディマ：こんにちは！頭とのどが痛いです。
    note: 医者は初対面の相手なので、Димаは丁寧なЗдравствуйте!であいさつします。
  ru.a1.unit16.lesson03.teach.doktor_chto_u_vas_bolit:
    title: 医者が痛いところをたずねる
    gloss: 医者：どこが痛いですか？頭とのどですか？
    note: 医者は親しい間柄で使うтебяではなく、丁寧なвас(「あなた」の敬称・複数形)を使います。
  ru.a1.unit16.lesson03.teach.dima_da_i_eshchyo_temperatura:
    title: ディマがもう一つ症状を伝える
    gloss: ディマ：はい、それと熱もあります。
    note: ещёは「さらに・そのうえ」という意味です。и ещё...で、今言ったことにもう一つ付け加えます。
  ru.a1.unit16.lesson03.teach.doktor_vam_nuzhno_otdyhat:
    title: 医者がアドバイスをする
    gloss: 医者：休んで、水をたくさん飲む必要があります。
    note: Вам нужно+不定詞で「〜する必要があります」という意味です。вамは丁寧な「あなた」の与格です。
