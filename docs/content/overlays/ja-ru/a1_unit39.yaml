    gloss: 今は春です。チューリップがきれいです。ニーナが尋ねます:「どの季節がきれいだと思う?」ディーマは言います:「ぼくは夏が好き。夏には泳ぐんだ。」ナースチャは言います:「わたしは冬が好き。冬にはスケートをするの。」
