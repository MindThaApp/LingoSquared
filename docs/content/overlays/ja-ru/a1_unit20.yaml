teaching:
  ru.a1.unit20.lesson01.teach.segodnya_holodno:
    title: Сегодня холодно.
    gloss: 今日は寒いです。
    note: ロシア語では、天気を表すのに主語のない語をよく使います。холодно は文字どおりには「寒く」です。
    example_gloss: 今日は寒いね、ディマ。
  ru.a1.unit20.lesson01.teach.teplo:
    title: тепло
    gloss: 暖かい
    note: тепло は、天気や気温について холодно と同じように使います。
    example_gloss: 家は暖かいです。
  ru.a1.unit20.lesson01.teach.pogoda:
    title: погода
    gloss: 天気
    note: погода は「天気」という意味です。
    example_gloss: 天気:今日は寒いです。
  ru.a1.unit20.lesson02.teach.idet_dozhd:
    title: Идёт дождь.
    gloss: 雨が降っています。
    note: ロシア語では дождь идёт と言い、文字どおりには「雨が行く」です。日本語と同じく、「それ」のような仮の主語は使いません。
    example_gloss: 今日は雨が降っています。
  ru.a1.unit20.lesson02.teach.solntse:
    title: солнце
    gloss: 太陽
    note: Сегодня солнце は、今日は晴れているという簡単な言い方です。ここでは動詞を使わずに天気を言います。
    example_gloss: 今日は晴れています。
  ru.a1.unit20.lesson02.teach.veter:
    title: ветер
    gloss: 風
    note: На улице ветер は、外は風が強いという自然な言い方です。
    example_gloss: 外は風が強いです。
  ru.a1.unit20.lesson03.teach.nastya_kakaya_pogoda:
    title: ナースチャが天気をたずねる
    gloss: ナースチャ:今日の天気はどう?
    note: Какая сегодня погода? は天気をたずねる決まった言い方です。
  ru.a1.unit20.lesson03.teach.dima_holodno_dozhd:
    title: ディマが天気を説明する
    gloss: ディマ:今日は寒くて、雨が降っているよ。
    note: ディマは и を使って、2つの天気をつなげています。
  ru.a1.unit20.lesson03.teach.nastya_ostanemsya_doma:
    title: ナースチャが提案する
    gloss: ナースチャ:それなら、家にいようよ。
    note: Давай останемся дома は、くだけた誘い方です。
  ru.a1.unit20.lesson03.teach.dima_doma_teplo:
    title: ディマが賛成する
    gloss: ディマ:いいよ、家は暖かいし。
    note: Дома тепло は、その提案の理由を表しています。
