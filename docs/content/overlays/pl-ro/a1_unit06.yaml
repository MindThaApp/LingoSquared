answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit's "Vă rog" (formal, sourced) and "Te rog" (informal, freshly authored) are register-sensitive parallels, matching unit02's ai/aveți and unit05's ai frați/aveți frați pattern -- accept either register for a general "please" unless an exercise explicitly names one. Ana and Mihai's closing café dialogue keeps their existing polite register with each other (both use "vă rog," not "te rog").
course:
  title: Rumuński A1
  description: Zamawianie jedzenia i napojów po rumuńsku -- kawa, herbata, chleb i nie tylko, z kluczowym zwrotem zamawiania „Aș dori ...” („Poproszę ...”) oraz parą grzecznościową vă rog/te rog -- dalszy ciąg historii Any i Mihaia, którzy spotykają się w kawiarni.
units:
  ro.a1.unit06.food:
    title: Jedzenie i napoje
lessons:
  ro.a1.unit06.lesson01.bauturi:
    title: Napoje
  ro.a1.unit06.lesson02.va_rog_si_mancare:
    title: Proszę i jedzenie
  ro.a1.unit06.lesson03.la_cafenea:
    title: W kawiarni
teaching:
  ro.a1.unit06.lesson01.teach.reminder_un_o_si:
    title: 'Powtórka: un, o, și'
    gloss: un/o (jeden/jedna) · și (i)
    note: Wszystkie trzy słowa pojawiły się już we wcześniejszych lekcjach (*și* w Lekcji 1, *o* w Lekcji 2, *un* w Lekcji 4) -- tu wracają w rozmowach o jedzeniu i napojach.
  ro.a1.unit06.lesson01.teach.as_dori:
    title: Poproszę ...
    gloss: Aș dori ... (Poproszę ...)
    note: Codzienny, uprzejmy sposób zamawiania czegoś po rumuńsku -- stała forma trybu warunkowego, która nie zmienia się w zależności od tego, co po niej następuje.
  ro.a1.unit06.lesson01.teach.apa:
    title: Woda
    gloss: apă (woda)
    note: Rzeczownik rodzaju żeńskiego -- gdy nie podajemy ilości, nie używa się rodzajnika, podobnie jak po polsku mówimy po prostu „wodę”.
    example_gloss: Poproszę wodę.
  ro.a1.unit06.lesson01.teach.cafea:
    title: Kawa
    gloss: cafea (kawa)
    note: Rodzaj żeński -- łączy się z *o* („jedna”) tak samo jak każdy inny rzeczownik rodzaju żeńskiego.
    example_gloss: Poproszę kawę.
  ro.a1.unit06.lesson01.teach.ceai:
    title: Herbata
    gloss: ceai (herbata)
    note: Łączy się z *un* („jeden”), a nie z *o* -- ceai jest rzeczownikiem rodzaju męskiego/nijakiego.
    example_gloss: Poproszę herbatę.
  ro.a1.unit06.lesson01.teach.suc:
    title: Sok
    gloss: suc (sok)
    note: Również łączy się z *un*, tak samo jak ceai.
    example_gloss: Poproszę sok.
  ro.a1.unit06.lesson01.teach.lapte:
    title: Mleko
    gloss: lapte (mleko)
    note: Podobnie jak apă, zwykle występuje bez rodzajnika, gdy nie podajemy ilości.
    example_gloss: Poproszę mleko.
  ro.a1.unit06.lesson01.teach.mi_e_sete:
    title: chce mi się pić
    gloss: Mi-e sete (Chce mi się pić)
    note: Stały zwrot idiomatyczny -- dosłownie bliżej mu do „jest mi pragnienie” niż do „jestem spragniony”.
  ro.a1.unit06.lesson01.teach.as_dori_o_cafea:
    title: Poproszę kawę
    gloss: Poproszę kawę.
    note: Łączy zwrot zamawiania i rzeczownik żeński oznaczający napój w jednym pełnym zdaniu.
  ro.a1.unit06.lesson02.teach.reminder_multumesc_bine_da_nu:
    title: 'Powtórka: mulțumesc, bine, da, nu'
    gloss: mulțumesc (dziękuję) · bine (dobrze) · da (tak) · nu (nie)
    note: '*Mulțumesc* i *bine* pojawiły się po raz pierwszy w powitaniach w Lekcji 1, a *da* i *nu* w Lekcji 3 i 5 -- tu wracają w kontekście jedzenia i grzeczności.'
  ro.a1.unit06.lesson02.teach.mi_e_foame:
    title: jestem głodny/głodna
    gloss: Mi-e foame (Jestem głodny/głodna)
    note: Ten sam stały wzór idiomatyczny co *Mi-e sete*, tylko z foame (głód) zamiast sete (pragnienie).
  ro.a1.unit06.lesson02.teach.paine:
    title: Chleb
    gloss: pâine (chleb)
    note: Zwykle występuje bez rodzajnika, podobnie jak po polsku mówimy po prostu „chleb”.
    example_gloss: Jestem głodny. Poproszę chleb.
  ro.a1.unit06.lesson02.teach.mancare:
    title: Jedzenie
    gloss: mâncare (jedzenie)
    note: Ogólne słowo oznaczające „jedzenie”, a nie konkretne danie.
    example_gloss: Poproszę jedzenie.
  ro.a1.unit06.lesson02.teach.carne:
    title: Mięso
    gloss: carne (mięso)
    note: Ogólne słowo oznaczające „mięso” -- konkretne rodzaje (carne de vită, carne de porc) dodają po nim określenie rodzaju.
    example_gloss: Poproszę mięso.
  ro.a1.unit06.lesson02.teach.pui:
    title: Kurczak
    gloss: pui (kurczak)
    note: Konkretne słowo oznaczające kurczaka (jako potrawę), odrębne od ogólnego carne.
    example_gloss: Poproszę kurczaka.
  ro.a1.unit06.lesson02.teach.fructe:
    title: Owoce
    gloss: fructe (owoce)
    note: Codzienna forma liczby mnogiej, używana tak, jak po polsku mówimy ogólnie „owoce”.
    example_gloss: Poproszę owoce.
  ro.a1.unit06.lesson02.teach.va_rog:
    title: Proszę (formalnie)
    gloss: vă rog (proszę, formalnie)
    note: Grzeczny sposób powiedzenia „proszę” -- pasuje do formy dumneavoastră poznanej w Lekcjach 1 i 2.
    example_gloss: Poproszę kawę.
  ro.a1.unit06.lesson02.teach.te_rog:
    title: Proszę (nieformalnie)
    gloss: te rog (proszę, nieformalnie)
    note: Codzienna wersja używana wobec przyjaciół i osób, do których mówisz na *ty* -- pasuje do formy tu z Lekcji 1.
    example_gloss: Herbatę, proszę.
  ro.a1.unit06.lesson03.teach.reminder_buna_ziua_bine_la_revedere:
    title: 'Powtórka: bună, ziua, bine, la revedere, Ana, Mihai'
    gloss: bună ziua (dzień dobry) · bine (dobrze) · la revedere (do widzenia) · Ana, Mihai (imiona)
    note: Wszystko to pojawiło się już w dialogach z Lekcji 1 i 5 -- tu Ana i Mihai spotykają się znowu, tym razem w kawiarni.
  ro.a1.unit06.lesson03.teach.line01:
    title: Przywitaj się i powiedz, że jesteś głodny
    gloss: Ana wita się z Mihaiem i mówi, że jest głodna.
    note: Używa w powitaniu zwrotu *Mi-e foame* z tej samej lekcji.
  ro.a1.unit06.lesson03.teach.line02:
    title: Zamawianie jedzenia
    gloss: Mihai mówi, że chciałby chleb i kurczaka.
    note: Powtarza słownictwo z tej lekcji (pâine/pui) w zwrocie Aș dori.
  ro.a1.unit06.lesson03.teach.line03:
    title: Zamawianie napoju grzecznie
    gloss: Ana mówi, że prosi o kawę.
    note: Łączy Aș dori, cafea i vă rog – trzy rzeczy, które ta lekcja wprowadziła osobno.
  ro.a1.unit06.lesson03.teach.line04:
    title: Zamawianie napoju – ciąg dalszy
    gloss: Mihai mówi, że prosi o herbatę.
    note: Ten sam wzór co w zdaniu Any, tylko z ceai zamiast cafea.
  ro.a1.unit06.lesson03.teach.line05:
    title: Podziękowanie i zakończenie
    gloss: Ana dziękuje Mihaiowi i się żegna.
    note: '*Mulțumesc* to tu proste podziękowanie na koniec, to samo słowo co w *Bine, mulțumesc.* z lekcji 1.'
  ro.a1.unit06.lesson03.teach.line06:
    title: Zakończenie spotkania
    gloss: Mihai również się żegna, zwracając się do Any po imieniu.
    note: Ten sam przyjazny sposób zakończenia, którym kończyły się dialogi z lekcji 1 i 5.
