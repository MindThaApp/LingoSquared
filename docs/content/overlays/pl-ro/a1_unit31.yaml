answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț, with comma-below ș/ț). Typed answers are checked with their diacritics: a spelling without them, or with the older cedilla letters ş/ţ, is accepted only where an exercise lists it explicitly.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the exclamation mark on greetings/farewells. Spoken answers are assessed for intelligibility and appropriate register, not written punctuation.
  register: tu and dumneavoastră are never interchangeable answers for each other's exercises -- a dumneavoastră-register prompt must not accept a tu-conjugated reply and vice versa, the same discipline applied to French tu/vous and Spanish tú/usted elsewhere in this app.
course:
  title: Rumuński A1
  description: 'Rumuński dla początkujących: opisywanie podstawowego wyglądu osoby – wzrostu i wrażenia wieku, koloru włosów i oczu, podstawowego pytania Cum arată ...? oraz porównywania wyglądu dwóch osób.'
units:
  ro.a1.unit31.aspect:
    title: Opisywanie wyglądu
lessons:
  ro.a1.unit31.lesson01.inalt_scund_batran_si:
    title: Wysoki, niski, stary i młody
  ro.a1.unit31.lesson02.descrierea_parului:
    title: Opisywanie włosów
  ro.a1.unit31.lesson03.ochii_si_cum_arata:
    title: Oczy i jak ktoś wygląda?
  ro.a1.unit31.lesson04.ana_o_descrie_pe:
    title: Ana opisuje Ninę
  ro.a1.unit31.lesson05.ii_comparam_pe_andrei:
    title: Porównanie Andreia i Eleny
  ro.a1.unit31.lesson06.mihai_o_recunoaste_pe:
    title: Mihai rozpoznaje Ninę
teaching:
  ro.a1.unit31.lesson01.teach.inalt_scund:
    title: Wysoki i niski
    gloss: wysoki / niski
    note: '*Înalt* opisuje osobę wysoką, a *scund* niską. Oba mają formy żeńskie: *înaltă*, *scundă*.'
    example_gloss:
    - Elena jest wysoka.
    - Andrei jest niski.
  ro.a1.unit31.lesson01.teach.batran_tanar:
    title: Stary i młody
    gloss: stary / młody
    note: '*Bătrân* i *tânăr* opisują tu ogólne wrażenie wieku, a nie dokładną liczbę lat. Formy żeńskie: *bătrână*, *tânără*.'
    example_gloss:
    - Dziadek jest stary.
    - Mihai jest młody.
  ro.a1.unit31.lesson01.teach.pentru_varsta_exacta:
    title: 'Bătrân: wrażenie czy liczba'
    gloss: 'O dokładny wiek pytasz: Câți ani ai?, a bătrân oznacza ogólne wrażenie, jak w zdaniu Bunicul este bătrân.'
    note: 'O dokładny wiek możesz zapytać: *Câți ani ai?* Natomiast *bătrân* opisuje, jak ktoś WYGLĄDA pod względem wieku, bez podawania liczby.'
  ro.a1.unit31.lesson01.teach.elena_este_inalta:
    title: Elena jest wysoka, a Andrei niski
    gloss: Elena jest wysoka, a Andrei jest niski.
    note: 'Proste zdanie złożone ze spójnikiem *și* (i), przygotowujące bezpośrednie porównanie w lekcji 5; przymiotnik zgadza się z podmiotem: *înaltă* przy Elenie, *scund* przy Andreiu.'
  ro.a1.unit31.lesson02.teach.parul:
    title: Włosy
    gloss: włosy
    note: '*Păr* to rzeczownik rodzaju męskiego; rodzajnik dołącza się na końcu: *părul* (włosy).'
    example_gloss: Mihai ma krótkie czarne włosy.
  ro.a1.unit31.lesson02.teach.blond_maro_carunt:
    title: Blond, brązowy i szary
    gloss: blond / brązowy / szary
    note: Trzy kolory włosów. Stoją po rzeczowniku *păr* (rodzaj męski), więc mówisz *părul blond*, *păr maro*, *păr cărunt*.
    example_gloss:
    - Ana ma blond włosy.
    - Andrei ma brązowe włosy.
    - Dziadek ma siwe włosy.
  ro.a1.unit31.lesson02.teach.lung_scurt:
    title: Długie i krótkie (włosy)
    gloss: długi / krótki (o włosach)
    note: '*Lung* (długi) i *scurt* (krótki) opisują długość włosów; podobnie jak kolory, stoją po rzeczowniku.'
    example_gloss:
    - Elena ma długie włosy.
    - Andrei ma krótkie włosy.
  ro.a1.unit31.lesson02.teach.adjectivul_vine_dupa:
    title: Przymiotnik stoi po rzeczowniku
    gloss: 'Przymiotnik stoi po rzeczowniku: păr scurt, păr lung, păr blond, păr maro, păr cărunt, păr negru.'
    note: W rumuńskim przymiotnik stoi zwykle PO rzeczowniku (*păr scurt*), inaczej niż w polskim „krótkie włosy”, gdzie zwykle stoi przed nim.
  ro.a1.unit31.lesson02.teach.posesivul_vine_dupa:
    title: Jego i jej stoją po rzeczowniku
    gloss: 'Zaimek dzierżawczy stoi po rzeczowniku: părul ei (jej włosy), ochii lui (jego oczy).'
    note: '*Ei* znaczy „jej”, a *lui* „jego”; oba stoją po rzeczowniku: *părul ei*. O kogo chodzi, wynika z kontekstu.'
  ro.a1.unit31.lesson02.teach.mihai_are_parul:
    title: Mihai ma krótkie czarne włosy
    gloss: Mihai ma krótkie czarne włosy.
    note: '*Negru* (czarny) to przymiotnik określający kolor; stoi po rzeczowniku: *păr negru*.'
  ro.a1.unit31.lesson02.teach.ana_are_parul:
    title: Ana ma długie blond włosy
    gloss: Ana ma długie blond włosy.
    note: Łączy słownictwo tej lekcji o długości i kolorze w jednym naturalnym zdaniu.
  ro.a1.unit31.lesson03.teach.ochii:
    title: Oczy
    gloss: oczy
    note: '*Ochi* (oko/oczy) wygląda tak samo w liczbie pojedynczej i mnogiej; liczbę pokazuje rodzajnik: *ochiul* (oko), *ochii* (oczy).'
    example_gloss: Mihai ma brązowe oczy.
  ro.a1.unit31.lesson03.teach.albastru_maro_verde:
    title: Niebieski, brązowy i zielony
    gloss: niebieski / brązowy / zielony
    note: '*Albastru* (niebieski), *maro* (brązowy) i *verde* (zielony) to przymiotniki określające kolor. *Maro* się nie zmienia; w liczbie mnogiej *albastru* przechodzi w *albaștri*, a *verde* w *verzi*.'
    example_gloss:
    - Ana ma niebieskie oczy.
    - Andrei ma brązowe oczy.
    - Elena ma zielone oczy.
  ro.a1.unit31.lesson03.teach.la_plural_adjectivul:
    title: Przymiotniki w liczbie mnogiej
    gloss: 'W liczbie mnogiej przymiotnik się zmienia: ochi albaștri, ochi maro, ochi verzi.'
    note: 'Przy rzeczowniku *ochi* w liczbie mnogiej przymiotnik przyjmuje formę liczby mnogiej (*albaștri*, *verzi*); *maro* się nie zmienia. Porównaj liczbę pojedynczą: *păr albastru*.'
  ro.a1.unit31.lesson03.teach.cum_arata_ana:
    title: Jak wygląda Ana?
    gloss: Jak wygląda Ana?
    note: '*Cum arată ...?* to główne pytanie tej lekcji; używaj go, by zapytać o wygląd każdej osoby.'
  ro.a1.unit31.lesson03.teach.ana_are_parul:
    title: Ana ma długie blond włosy i niebieskie oczy
    gloss: Ana ma długie blond włosy i niebieskie oczy.
    note: Wzorcowa odpowiedź łącząca włosy i oczy w jednym zdaniu za pomocą *și*.
  ro.a1.unit31.lesson04.teach.ana_vine_o:
    title: Ana przedstawia Ninę
    gloss: 'Ana: Do kawiarni językowej przychodzi nowa dziewczyna. Ma na imię Nina.'
    note: '*Vine o fată nouă* („przychodzi nowa dziewczyna”) wprowadza nową osobę; *O cheamă Nina* podaje jej imię.'
  ro.a1.unit31.lesson04.teach.mihai_bine_cum:
    title: Mihai pyta, jak ona wygląda
    gloss: 'Mihai: Dobrze! Jak wygląda?'
    note: 'Wracamy do głównego pytania lekcji, tym razem bez imienia: *Cum arată?* (z kontekstu wiadomo, o kogo chodzi).'
  ro.a1.unit31.lesson04.teach.ana_este_scunda:
    title: Ana opisuje wzrost i włosy Niny
    gloss: 'Ana: Jest niska i ma krótkie blond włosy.'
    note: Łączy słowo *scundă* z lekcji 1 ze słownictwem o włosach z lekcji 2.
  ro.a1.unit31.lesson04.teach.mihai_si_ochii:
    title: Mihai pyta o jej oczy
    gloss: 'Mihai: A oczy?'
    note: '*Și ochii?* („A oczy?”) to krótkie pytanie uzupełniające; z kontekstu wiadomo, o kogo chodzi.'
  ro.a1.unit31.lesson04.teach.ana_are_ochi:
    title: Ana opisuje oczy Niny
    gloss: 'Ana: Ma zielone oczy.'
    note: Wraca wyrażenie *ochi verzi* z lekcji 3.
  ro.a1.unit31.lesson04.teach.mihai_multumesc_atunci:
    title: Mihai ją rozpozna
    gloss: 'Mihai: Dzięki! W takim razie na pewno ją rozpoznam.'
    note: '*O recunosc* znaczy „rozpoznam ją”: *o* to zaimek w bierniku („ją”) i stoi przed czasownikiem.'
  ro.a1.unit31.lesson05.teach.andrei_si_elena:
    title: Porównanie Andreia i Eleny
    gloss: Andrei i Elena są rodzeństwem, ale wyglądają inaczej. Andrei jest niski, ma krótkie brązowe włosy i brązowe oczy. Elena jest wyższa od Andreia, ma długie brązowe włosy i zielone oczy. A ty jak wyglądasz?
    note: Krótkie porównanie, w którym wracają wszystkie poznane dotąd słowa określające kolor i długość. Tekst kończy się pytaniem kluczowym dla tej lekcji, skierowanym do czytelnika.
    glosses:
      frate: brat
      soră: siostra
      arată: wyglądać
      diferit: różnie
      scund: niski
      scurt: niski
      maro: brązowy
      părul: włosy
      ochi: oczy
      înaltă: wyższy
      lung: długi
      verzi: zielony
      arăți: wyglądać (np. jak wyglądasz)
  ro.a1.unit31.lesson05.teach.comparativul_se_formeaza:
    title: Stopniowanie z mai ... decât
    gloss: 'Stopień wyższy tworzy się według schematu mai + przymiotnik + decât: Elena este mai înaltă decât Andrei.'
    note: 'W rumuńskim *mai* („bardziej”) stoi przed przymiotnikiem, a *decât* („niż”) przed drugą osobą porównania: *mai înaltă decât Andrei*.'
  ro.a1.unit31.lesson05.teach.elena_are_parul:
    title: Elena ma dłuższe włosy niż Andrei
    gloss: Elena ma dłuższe włosy niż Andrei.
    note: '*Mai lung* działa tak samo przed *decât*: *părul mai lung decât Andrei*; przymiotnik nadal stoi po *părul*.'
  ro.a1.unit31.lesson05.teach.am_parul_scurt:
    title: Mam krótkie brązowe włosy
    gloss: Mam krótkie brązowe włosy.
    note: Wzorcowe zdanie w pierwszej osobie z *Am ...*, które możesz wykorzystać, opisując własny wygląd.
  ro.a1.unit31.lesson06.teach.mihai_uite_ea:
    title: Mihai dostrzega Ninę
    gloss: 'Mihai: Patrz, to Nina? Ma krótkie blond włosy i zielone oczy.'
    note: '*Uite* („patrz”) zwraca uwagę na coś; *ea e Nina?* pyta „czy to Nina?”.'
  ro.a1.unit31.lesson06.teach.ana_da_ea:
    title: Ana potwierdza
    gloss: 'Ana: Tak, to Nina!'
    note: Krótkie, naturalne potwierdzenie.
  ro.a1.unit31.lesson06.teach.nina_salut_tu:
    title: Nina wita Mihaia
    gloss: 'Nina: Cześć, jesteś Mihai?'
    note: 'Proste nieformalne pytanie na powitanie: *tu ești ...?*'
  ro.a1.unit31.lesson06.teach.mihai_da_ma:
    title: Mihai wita Ninę
    gloss: 'Mihai: Tak! Miło cię poznać, Nina.'
    note: '*Mă bucur să te cunosc* („cieszę się, że cię poznaję”) to standardowe zdanie przy pierwszym spotkaniu.'
  ro.a1.unit31.lesson06.teach.nina_si_eu:
    title: Nina odpowiada na powitanie
    gloss: 'Nina: Mnie również miło!'
    note: Kończy dialog – Mihai rozpoznał Ninę dzięki wcześniejszemu opisowi Ani.
