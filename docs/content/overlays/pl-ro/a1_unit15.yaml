answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit's own new vocabulary (tren, pleacă, bilet, peron, București, Drum bun) is entirely person-invariant and carries no register distinction of its own. Ana and Mihai's dialogue keeps their existing formal register with each other; no new tu/dumneavoastră form is introduced this unit.
course:
  title: Rumuński A1
  description: Podstawy podróży pociągiem po rumuńsku – Tren (pociąg), Bilet (bilet), Peron (peron) i Pleacă (odjeżdża) – gdy Mihai jedzie pociągiem do București, a Ana odprowadza go na gară.
units:
  ro.a1.unit15.travel:
    title: Podróż
lessons:
  ro.a1.unit15.lesson01.trenul_pleaca:
    title: Pociąg odjeżdża
  ro.a1.unit15.lesson02.un_bilet_va_rog:
    title: Poproszę bilet
  ro.a1.unit15.lesson03.la_gara:
    title: Na dworcu kolejowym
teaching:
  ro.a1.unit15.lesson01.teach.reminder_gara_ora:
    title: 'Powtórka: gară, este, la, ce, oră, ora, nouă'
    gloss: gară (dworzec kolejowy) · este (jest) · la (o, do) · ce (jaki, co) · oră (godzina) · ora (godzina, z rodzajnikiem) · nouă (dziewięć)
    note: 'Gară pojawiło się w lekcjach 8 i 9, a este/la/ce/oră/ora/nouă w lekcji 4 (czas). Ta lekcja wykorzystuje schemat „la ce oră” / „la ora nouă” z lekcji 4 w nowym celu: pytamy o pociąg, a nie o zajęcia.'
  ro.a1.unit15.lesson01.teach.tren_vocab:
    title: Pociąg
    gloss: Tren (pociąg)
    note: 'Rzeczownik rodzaju nijakiego zakończony na spółgłoskę (w liczbie pojedynczej rzeczowniki nijakie zachowują się jak męskie: *un tren*) -- przyjmuje końcówkę *-ul* w znaczeniu „ten pociąg”, tak samo jak *magazin*->*magazinul*; rzeczowniki na *-ă*, takie jak *gară*, przyjmują zamiast niej *-a* (*gara*).'
    example_gloss:
    - Pociąg stoi na dworcu.
  ro.a1.unit15.lesson01.teach.pleaca_vocab:
    title: Odjeżdża
    gloss: Pleacă (odjeżdża, on/ona/ono)
    note: Czasownik używany, gdy odjeżdża pociąg, autobus lub samolot. *Trenul pleacă* – nie potrzeba *este*, bo *pleacă* jest pełnoprawnym czasownikiem.
    example_gloss:
    - Pociąg odjeżdża.
  ro.a1.unit15.lesson01.teach.trenul_pleaca_ora_noua_phrase:
    title: Pociąg odjeżdża o dziewiątej
    gloss: Trenul pleacă la ora nouă. (Pociąg odjeżdża o dziewiątej.)
    note: Łączy *trenul* i *pleacă* z wyrażeniem *la ora nouă* z lekcji 4 – nie potrzeba nowego słownictwa dotyczącego czasu.
  ro.a1.unit15.lesson01.teach.la_ce_ora_pleaca_trenul_phrase:
    title: O której odjeżdża pociąg?
    gloss: La ce oră pleacă trenul? (O której godzinie odjeżdża pociąg?)
    note: Znany ze lekcji 4 schemat pytania *La ce oră...?*, tym razem o *trenul*, a nie o zajęcia.
  ro.a1.unit15.lesson01.teach.peron_vocab:
    title: Peron
    gloss: Peron (peron)
    note: Peron dworcowy. Rodzaj nijaki, zakończony spółgłoską, więc „peron” z rodzajnikiem to *peronul* – ta sama końcówka *-ul* co w *tren*→*trenul*.
    example_gloss:
    - Pociąg stoi przy peronie trzecim.
  ro.a1.unit15.lesson01.teach.de_la_ce_peron_phrase:
    title: Z którego peronu odjeżdża pociąg?
    gloss: De la ce peron pleacă trenul? (Z którego peronu odjeżdża pociąg?)
    note: '*De la* (z) + *ce peron* (który peron) – wszystkie te słowa już znasz, tutaj są tylko połączone w nowe pytanie.'
  ro.a1.unit15.lesson02.teach.reminder_as_dori_va_rog_cat_costa:
    title: 'Powtórka: aș dori, vă rog, cât costă, costă, lei'
    gloss: aș dori (chciałbym/chciałabym) · vă rog (proszę, formalnie) · cât costă (ile kosztuje) · costă (kosztuje) · lei (lej, waluta)
    note: Wszystko z lekcji 6 (jedzenie) i 7 (zakupy) – ta lekcja używa tych samych grzecznych próśb i zwrotów o cenie, tylko do kupowania biletu na pociąg zamiast jedzenia.
  ro.a1.unit15.lesson02.teach.bilet_vocab:
    title: Bilet
    gloss: Bilet (bilet)
    note: Bilet na pociąg. Rodzaj nijaki (w liczbie pojedynczej występuje z *un*, jak rodzaj męski), więc „bilet” to *un bilet*.
    example_gloss:
    - Mam bilet.
  ro.a1.unit15.lesson02.teach.bucuresti_vocab:
    title: Bukareszt
    gloss: București (Bukareszt)
    note: Stolica Rumunii – naturalny przykład celu podróży w tym kursie.
    example_gloss:
    - Pociąg odjeżdża do Bukaresztu.
  ro.a1.unit15.lesson02.teach.as_dori_bilet_bucuresti_phrase:
    title: Poproszę bilet do Bukaresztu
    gloss: Aș dori un bilet la București, vă rog. (Poproszę bilet do Bukaresztu.)
    note: Grzeczna formuła *Aș dori... vă rog* z lekcji 6 i 7, tym razem przy prośbie o bilet, a nie o jedzenie.
  ro.a1.unit15.lesson02.teach.cat_costa_bilet_bucuresti_phrase:
    title: Ile kosztuje bilet do Bukaresztu?
    gloss: Cât costă un bilet la București? (Ile kosztuje bilet do Bukaresztu?)
    note: To pytanie o cenę, *Cât costă...?*, znasz już z rozdziału 7 – tylko że teraz dotyczy biletu, a nie kilograma ziemniaków.
  ro.a1.unit15.lesson02.teach.costa_zece_lei_phrase:
    title: Kosztuje czterdzieści lei
    gloss: Costă patruzeci de lei. (Kosztuje czterdzieści lei.)
    note: Zece (dziesięć) mieści się w zakresie 2–19, więc przed *lei* nie jest potrzebne *de* – to ta sama zasada, którą ustalił już rozdział 7.
  ro.a1.unit15.lesson03.teach.reminder_travel_words:
    title: 'Powtórka: tren, pleacă, peron, bilet, București, trei, am'
    gloss: tren (pociąg) · pleacă (odjeżdża) · peron (peron) · bilet (bilet) · București (Bukareszt) · trei (trzy, z rozdziału 2) · am (mam, z rozdziału 2)
    note: Tren, pleacă, peron, bilet i București pochodzą z lekcji 1 i 2 tego rozdziału; trei i am wracają z rozdziału 2 (liczby), bo Ana i Mihai używają teraz razem na dworcu zwrotów „peronul trei” i „am un bilet”.
  ro.a1.unit15.lesson03.teach.reminder_buna_multumesc_la_revedere_ana_mihai:
    title: 'Powtórka: bună, mulțumesc, la revedere, Ana, Mihai'
    gloss: bună (cześć) · mulțumesc (dziękuję) · la revedere (do widzenia) · Ana, Mihai (imiona)
    note: Wszystko to było już w poprzednich rozdziałach – ten sam przyjazny początek i koniec, którym kończy się każdy dialog w tym kursie.
  ro.a1.unit15.lesson03.teach.drum_bun_vocab:
    title: Szczęśliwej podróży
    gloss: Drum bun (Szczęśliwej podróży / Szerokiej drogi)
    note: Stała formuła pożegnania dla kogoś, kto wybiera się w podróż – dosłownie „dobra droga”, używana tak jak polskie „szerokiej drogi” lub „szczęśliwej podróży”.
    example_gloss:
    - Szczęśliwej podróży, Mihai!
  ro.a1.unit15.lesson03.teach.line01:
    title: Powitanie i pytanie o pociąg
    gloss: Ana wita się z Mihaiem i pyta, o której odjeżdża pociąg.
    note: Wraca pytanie z lekcji 1 tego rozdziału, tym razem skierowane bezpośrednio do Mihaia.
  ro.a1.unit15.lesson03.teach.line02:
    title: Podanie godziny odjazdu
    gloss: Mihai mówi, że pociąg odjeżdża o dziewiątej.
    note: Dokładnie ta sama fraza z lekcji 1 tego rozdziału.
  ro.a1.unit15.lesson03.teach.line03:
    title: Pytanie o peron
    gloss: Ana pyta, z którego peronu.
    note: Krótkie pytanie uzupełniające – *de la ce peron* padło już w pełnej wersji w lekcji 1; tutaj Ana pyta o to zwięźle, a resztę zostawia Mihaiowi.
  ro.a1.unit15.lesson03.teach.line04:
    title: Podanie peronu i biletu
    gloss: Mihai mówi, że z peronu trzeciego, i że ma bilet do Bukaresztu.
    note: 'Łączy w jednej odpowiedzi słownictwo z tego rozdziału: peron oraz bilet i București.'
  ro.a1.unit15.lesson03.teach.line05:
    title: Życzenie szczęśliwej podróży i pożegnanie
    gloss: Ana życzy Mihaiowi szczęśliwej podróży i żegna się z nim.
    note: Użyto tu *Drum bun* z tej lekcji – pożegnania związanego z podróżą, zamiast samego *la revedere*, którego zwykle używa się w tym kursie.
  ro.a1.unit15.lesson03.teach.line06:
    title: Podziękowanie i pożegnanie
    gloss: Mihai dziękuje Anie i żegna się z nią.
    note: Ten sam sposób zakończenia, którym kończył się dialog w każdym wcześniejszym rozdziale.
