teaching:
  ro.a1.unit27.lesson01.teach.fericit_trist_suparat:
    title: Zadowolony, smutny i zły
    gloss: zadowolony, smutny, zły
    note: 'Trzy podstawowe słowa opisujące uczucia, używane z *a fi* („być”). Każde ma formę żeńską na *-ă*: *fericită*, *tristă*, *supărată*.'
    example_gloss:
    - Jestem zadowolony.
    - Jest mi smutno.
    - Jestem zły.
  ro.a1.unit27.lesson01.teach.sunt_fericit:
    title: Mówimy, że jesteś zadowolony
    gloss: Jestem zadowolony.
    note: '*Sunt* (od *a fi*, „być”) + przymiotnik opisujący uczucie to podstawowy wzór, tak jak po polsku „jestem ...”. Kobieta mówi *Sunt fericită*.'
  ro.a1.unit27.lesson01.teach.nu_sunt_suparat:
    title: Zestawianie uczuć
    gloss: Nie jestem zły, jestem smutny.
    note: '*Nu* przed czasownikiem tworzy przeczenie: *Nu sunt supărat*. Drugie zdanie podaje wtedy rzeczywiste uczucie.'
  ro.a1.unit27.lesson02.teach.de_ce_esti:
    title: Pytanie o powód
    gloss: Dlaczego jesteś szczęśliwy?
    note: '*De ce* („dlaczego”) to standardowe pytanie o przyczynę.'
  ro.a1.unit27.lesson02.teach.sunt_fericit_pentru:
    title: Podawanie powodu
    gloss: Jestem zadowolony, bo mam nowe mieszkanie.
    note: '*Pentru că* („ponieważ”) wprowadza zdanie podające przyczynę; szyk pozostaje zwykły: *am un apartament nou*.'
  ro.a1.unit27.lesson02.teach.sunt_trist_pentru:
    title: Negatywny powód
    gloss: Jestem smutny, bo pada deszcz.
    note: '*Plouă* („pada deszcz”) nie ma w rumuńskim podmiotu, więc samo wystarcza jako zdanie podające przyczynę.'
  ro.a1.unit27.lesson03.teach.emotionat:
    title: Zdenerwowany
    gloss: zdenerwowany
    note: Standardowe słowo oznaczające zdenerwowanie.
    example_gloss: Denerwuję się przed pierwszą zmianą.
  ro.a1.unit27.lesson03.teach.sunt_emotionat_pentru:
    title: Mówimy, czym się denerwujesz
    gloss: Denerwuję się przed pierwszą zmianą.
    note: '*Pentru* (dosłownie „dla”) wprowadza to, czego dotyczy zdenerwowanie; po polsku powiedzielibyśmy raczej „przed” albo „z powodu”.'
  ro.a1.unit27.lesson03.teach.nu_ti_face:
    title: Uspokajanie kogoś
    gloss: Nie martw się.
    note: '*Nu-ți face griji* (dosłownie „nie rób sobie zmartwień”) to standardowy, utrwalony zwrot pocieszenia. Do osoby, do której mówisz per Pan/Pani: *Nu vă faceți griji*.'
  ro.a1.unit27.lesson04.teach.cum_se_simte:
    title: Pytanie, jak ktoś się czuje
    gloss: Jak czuje się Mihai?
    note: '*A se simți* („czuć się”) jest zwrotne: *mă simt* (ja), *te simți* (ty), *se simte* (on/ona). To standardowy sposób pytania o uczucia i opisywania ich.'
  ro.a1.unit27.lesson04.teach.el_se_simte:
    title: Opisywanie, jak ktoś się czuje
    gloss: On się denerwuje.
    note: '*Se* to zaimek zwrotny dla on/ona i stoi przed czasownikiem: *se simte*.'
  ro.a1.unit27.lesson04.teach.de_ce_se:
    title: Pytanie, dlaczego ktoś się tak czuje
    gloss: Dlaczego on się denerwuje?
    note: Łączy *de ce* ze wzorem *se simte* z zdania *El se simte emoționat*.
  ro.a1.unit27.lesson05.teach.salut_ana_sunt:
    title: Przeczytaj wiadomość o uczuciach
    gloss: Cześć, Ana, jestem trochę zdenerwowany przed moją pierwszą zmianą w pojedynkę. Ale jestem też szczęśliwy, bo mam nową pracę i nowe mieszkanie. Myślę, że wszystko się ułoży.
    note: Zwróć uwagę, czym autor się denerwuje, co go cieszy i jakie ma ogólne nastawienie.
    glosses:
      puțin: trochę
      emoționat: zdenerwowany
      prima: pierwszy
      tură: zmiana (w pracy)
      singur: sam
      fericit: szczęśliwy
      fiindcă: ponieważ
      nou: nowy
      serviciu: praca
      apartament: mieszkanie
      cred: myśleć
      rezolvă: 'okazuje się (tu: będzie dobrze)'
  ro.a1.unit27.lesson06.teach.ana_salut_mihai:
    title: Ana pyta, jak czuje się Mihai
    gloss: 'Ana: Cześć, Mihai, jak się czujesz przed swoją pierwszą zmianą?'
    note: '*Cum te simți* zawiera zwrotne *te* („się”); w *prima ta tură* zaimek dzierżawczy *ta* zgadza się z rzeczownikiem rodzaju żeńskiego *tură*.'
  ro.a1.unit27.lesson06.teach.mihai_sunt_putin:
    title: Mihai przyznaje, że jest zdenerwowany
    gloss: 'Mihai: Jestem trochę zdenerwowany, szczerze mówiąc.'
    note: '*Sincer să fiu* („szczerze mówiąc”) łagodzi to przyznanie się.'
  ro.a1.unit27.lesson06.teach.ana_nu_ti:
    title: Ana go pociesza
    gloss: 'Ana: Nie martw się, dobrze sobie poradzisz!'
    note: '*O să te descurci bine* (dosłownie „dobrze sobie poradzisz”) to zachęcający, utrwalony zwrot; *o să* + czasownik tworzy czas przyszły.'
  ro.a1.unit27.lesson06.teach.mihai_multumesc_chiar:
    title: Mihai jej dziękuje
    gloss: 'Mihai: Dzięki, naprawdę pomaga.'
    note: '*Ajută* to forma 3. osoby liczby pojedynczej od *a ajuta* („pomagać”); tutaj znaczy „to pomaga”.'
  ro.a1.unit27.lesson06.teach.ana_si_dupa:
    title: Ana przewiduje, jak to się skończy
    gloss: 'Ana: A potem na pewno będziesz bardzo szczęśliwy i dumny.'
    note: '*Sigur* („na pewno”) wyraża pewne przewidywanie; *mândru* („dumny”) to nowy, przydatny przymiotnik (*mândră* w odniesieniu do kobiety).'
  ro.a1.unit27.lesson06.teach.mihai_da_si:
    title: Mihai się zgadza
    gloss: 'Mihai: Tak, ja też tak myślę.'
    note: '*Și eu cred asta* (dosłownie „ja też to myślę”) to naturalny sposób, by zgodzić się z czyjąś opinią.'
  ro.a1.unit27.lesson06.teach.mihai_este_emotionat:
    title: 'Podsumowanie: este, lui i îl'
    gloss: Mihai jest zdenerwowany przed swoją pierwszą zmianą. Ana mu pomaga.
    note: '*Este* to forma 3. osoby od *a fi* („być”); *lui* po rzeczowniku znaczy „jego”; *îl* znaczy „go/jemu” i stoi przed czasownikiem: *îl ajută*. Trzy małe, ale niezbędne słowa, gdy mówisz o kimś innym.'
