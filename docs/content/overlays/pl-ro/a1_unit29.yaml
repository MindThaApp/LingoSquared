teaching:
  ro.a1.unit29.lesson01.teach.cat_costa_in:
    title: Pytanie o łączną cenę
    gloss: Ile to kosztuje w sumie?
    note: '*În total* („w sumie”) wyjaśnia, że chodzi o pełną łączną cenę, a nie cenę jednej rzeczy; *Cât costă?* pyta „ile to kosztuje?”.'
  ro.a1.unit29.lesson01.teach.costa_douazeci_si:
    title: Podawanie łącznej ceny
    gloss: Kosztuje w sumie sto lei.
    note: '*Costă* to forma 3. os. lp od *a costa* („kosztować”). Po liczbie powyżej 19 rumuński dodaje *de* przed rzeczownikiem: *o sută de lei*.'
  ro.a1.unit29.lesson02.teach.a_plati_cu:
    title: Płacenie kartą lub gotówką
    gloss: płacić kartą, płacić gotówką
    note: '*A plăti cu cardul* znaczy płacić kartą, a *a plăti în numerar* – płacić gotówką; *cu* znaczy „z”, a *în* – „w”.'
    example_gloss:
    - Czy mogę tu zapłacić kartą?
    - Płacę gotówką.
  ro.a1.unit29.lesson02.teach.pot_plati_cu:
    title: Pytanie, czy można zapłacić kartą
    gloss: Czy mogę tu zapłacić kartą?
    note: '*Pot plăti* („mogę zapłacić”) to *a putea* + czasownik; *aici* („tutaj”) odnosi pytanie do miejsca, w którym jesteś.'
  ro.a1.unit29.lesson02.teach.doriti_sa_platiti:
    title: Pytanie o preferowaną formę płatności
    gloss: Woli Pan/Pani zapłacić gotówką czy kartą?
    note: '*Doriți să plătiți ...?* to forma grzecznościowa (*dumneavoastră*), używana przez nieznajomego kasjera; do znajomego powiesz *Vrei să plătești ...?*'
  ro.a1.unit29.lesson03.teach.nota:
    title: Rachunek
    gloss: ten rachunek
    note: 'Rzeczownik rodzaju żeńskiego: *o notă*, *nota* (rodzajnik dołącza się na końcu).'
    example_gloss: Podzielimy rachunek?
  ro.a1.unit29.lesson03.teach.hai_sa_impartim:
    title: Propozycja podzielenia rachunku
    gloss: Podzielimy rachunek?
    note: '*Hai să* + czasownik oznacza propozycję zrobienia czegoś razem.'
  ro.a1.unit29.lesson03.teach.pot_plati_separat:
    title: Prośba o osobne płacenie
    gloss: Czy mogę zapłacić osobno?
    note: '*Separat* („osobno”) stoi po *a plăti*; *Pot plăti separat?* to zwykła prośba, gdy każdy płaci za siebie.'
  ro.a1.unit29.lesson04.teach.restul:
    title: Reszta
    gloss: reszta
    note: '*Restul* dosłownie znaczy „reszta”; tak po rumuńsku nazywa się pieniądze wydawane z powrotem; rodzajnik dołącza się na końcu.'
    example_gloss: Oto Pana/Pani reszta.
  ro.a1.unit29.lesson04.teach.poftiti_restul:
    title: Wydawanie reszty
    gloss: Oto Pana/Pani reszta.
    note: '*Poftiți* to forma grzecznościowa (*dumneavoastră*) oznaczająca „proszę” (przy podawaniu), pasująca do oficjalnego stylu przy ladzie.'
  ro.a1.unit29.lesson04.teach.nu_am_nevoie:
    title: Odmowa przyjęcia reszty
    gloss: Nie potrzebuję reszty.
    note: '*A avea nevoie de* („potrzebować”) łączy się z *de*: *Nu am nevoie de rest*.'
  ro.a1.unit29.lesson05.teach.treizeci_si_cinci:
    title: Trzydzieści pięć
    gloss: trzydzieści pięć
    note: 'Liczby od 21 do 99 rumuński tworzy z *și*: *treizeci și cinci* (dosł. „trzydzieści i pięć”), a przed rzeczownikiem dodaje *de*: *o sută treizeci și cinci de lei*.'
    example_gloss: Kosztuje sto trzydzieści pięć lei.
  ro.a1.unit29.lesson05.teach.nota_doua_feluri:
    title: Czytamy rachunek z restauracji
    gloss: 'Rachunek: dwa dania główne i dwie kawy. Razem: sto trzydzieści pięć lei. Zapłacono kartą.'
    note: Zwróć uwagę, co zamówiono, jaka jest suma i jak zapłacono.
    glosses:
      Nota: rachunek
      două: dwa
      feluri: dania główne
      cafele: kawy
      Total: suma
      '135': sto trzydzieści pięć
      lei: lei
      Plătit: zapłacono
      cardul: karta
  ro.a1.unit29.lesson06.teach.ana_hai_sa:
    title: Ana prosi o rachunek
    gloss: 'Ana: Poprosimy o rachunek?'
    note: '*A cere* („prosić o”) ma za dopełnienie *nota*; *Hai să cerem nota?* proponuje poprosić o nią razem.'
  ro.a1.unit29.lesson06.teach.mihai_da_buna:
    title: Mihai pyta o kwotę
    gloss: 'Mihai: Tak, dobry pomysł. Ile to kosztuje w sumie?'
    note: Wraca pytanie *Cât costă în total?* z lekcji 1.
  ro.a1.unit29.lesson06.teach.ana_sunt_treizeci:
    title: Ana podaje kwotę
    gloss: 'Ana: To sto trzydzieści pięć lei. Podzielimy się?'
    note: '*Împărțim* to forma *noi* („my”) od *a împărți* („dzielić”); *nota* wynika z kontekstu.'
  ro.a1.unit29.lesson06.teach.mihai_nu_lasa:
    title: Mihai nalega, że zapłaci
    gloss: 'Mihai: Nie, pozwól, że dziś ja zapłacę. Tak bardzo mi pomogłaś.'
    note: '*Lasă-mă să* ... („pozwól mi ...”) to standardowy sposób zaproponowania, że coś zrobisz; *m-ai ajutat* („pomogłaś mi”) to forma czasu przeszłego.'
  ro.a1.unit29.lesson06.teach.ana_ce_dragut:
    title: Ana jest wzruszona
    gloss: 'Ana: Jak miło z twojej strony! Dziękuję bardzo.'
    note: '*Ce drăguț din partea ta!* („jak miło z twojej strony”) to ciepły, częsty komplement za hojny gest.'
  ro.a1.unit29.lesson06.teach.mihai_pot_plati:
    title: Mihai pyta o płatność kartą
    gloss: 'Mihai: Mogę tu zapłacić kartą?'
    note: Wraca pytanie *Pot plăti cu cardul aici?* z lekcji 2, teraz w prawdziwej restauracji.
  ro.a1.unit29.lesson06.teach.mihai_plateste_nota:
    title: 'Plătește: forma 3. osoby'
    gloss: Mihai płaci rachunek.
    note: '*Plătește* to forma 3. os. lp od *a plăti* („płacić”).'
