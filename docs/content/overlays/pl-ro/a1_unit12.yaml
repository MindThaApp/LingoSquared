  ro.a1.unit12.lesson03.cum_a_fost_duminica:
    title: Jak było w niedzielę?
teaching:
  ro.a1.unit12.lesson01.teach.reminder_parc_cinema:
    title: 'Przypomnienie: parc, cinema'
    gloss: parc (park) · cinema (kino)
    note: Oba słowa znasz już z lekcji 11 – tutaj łączą się z nową gramatyką czasu przeszłego z tej lekcji.
  ro.a1.unit12.lesson01.teach.reminder_astazi_maine_duminica_sambata:
    title: 'Przypomnienie: astăzi, mâine, duminică, sâmbătă'
    gloss: astăzi (dziś) · mâine (jutro) · duminică (niedziela) · sâmbătă (sobota)
    note: Wszystkie te słowa znasz już z lekcji 3 i 11 – tutaj stanowią kontrast dla nowego słowa *ieri* (wczoraj).
  ro.a1.unit12.lesson01.teach.am_fost_vocab:
    title: byłem / byłam / poszedłem / poszłam
    gloss: Am fost (byłem/byłam, poszedłem/poszłam)
    note: Perfect compus (czas przeszły) czasownika *a fi* (być) – *am* to niezmienna forma pomocnicza dla „ja” i „my”, a *fost* to stała forma imiesłowu. Z nazwą miejsca *am fost la...* to codzienny, naturalny sposób, by powiedzieć „poszedłem/byłem w...” – w mowie częstszy niż osobny czasownik ruchu.
    example_gloss:
    - Byłem/Byłam w parku.
  ro.a1.unit12.lesson01.teach.am_fost_parc_phrase:
    title: Byłem/Byłam w parku
    gloss: Am fost la parc. (Byłem/Byłam w parku.)
    note: 'Pełny wzór: am fost + la + miejsce.'
  ro.a1.unit12.lesson01.teach.am_fost_cinema_phrase:
    title: Byłem/Byłam w kinie
    gloss: Am fost la cinema. (Byłem/Byłam w kinie.)
    note: Ten sam wzór co w *Am fost la parc*, tylko z innym miejscem.
  ro.a1.unit12.lesson01.teach.ieri_vocab:
    title: Wczoraj
    gloss: Ieri (wczoraj)
    note: Znasz już to słowo z lekcji 3, obok *astăzi* (dziś) i *mâine* (jutro) – teraz używasz go z czasem przeszłym, na początku zdania, by powiedzieć, kiedy coś się wydarzyło.
    example_gloss:
    - Wczoraj byłem/byłam w parku.
  ro.a1.unit12.lesson01.teach.ieri_am_fost_parc_phrase:
    title: Wczoraj byłem/byłam w parku
    gloss: Ieri am fost la parc. (Wczoraj byłem/byłam w parku.)
    note: Dodanie *ieri* na początku zdania *Am fost la parc* dokładnie określa, kiedy to było.
  ro.a1.unit12.lesson02.teach.reminder_mananc_beau:
    title: 'Przypomnienie: mănânc, beau'
    gloss: mănânc (jem) · beau (piję)
    note: Oba czasowniki znasz już z lekcji 10 o codziennym planie dnia – tutaj poznajesz ich formy czasu przeszłego.
  ro.a1.unit12.lesson02.teach.reminder_paine_cafea_ceai_si:
    title: 'Przypomnienie: pâine, cafea, ceai, și'
    gloss: pâine (chleb) · cafea (kawa) · ceai (herbata) · și (i)
    note: Wszystkie te słowa znasz już z lekcji 6 i 10 – tutaj wracają w zdaniach w czasie przeszłym.
  ro.a1.unit12.lesson02.teach.am_mancat_vocab:
    title: zjadłem / zjadłam
    gloss: Am mâncat (zjadłem/zjadłam)
    note: Perfect compus czasownika *a mânca* (jeść), który znasz jako *mănânc* (jem, lekcja 10) – ten sam czasownik w czasie przeszłym. Am + mâncat, tak samo jak w *am fost*.
    example_gloss:
    - Zjadłem/Zjadłam chleb.
  ro.a1.unit12.lesson02.teach.am_mancat_paine_phrase:
    title: Zjadłem/Zjadłam chleb
    gloss: Am mâncat pâine. (Zjadłem/Zjadłam chleb.)
    note: 'Pełny wzór: am mâncat + jedzenie.'
  ro.a1.unit12.lesson02.teach.am_baut_vocab:
    title: wypiłem / wypiłam
    gloss: Am băut (wypiłem/wypiłam)
    note: Perfect compus czasownika *a bea* (pić), który znasz jako *beau* (piję, lekcja 10) – ten sam czasownik w czasie przeszłym.
    example_gloss:
    - Wypiłem/Wypiłam herbatę.
  ro.a1.unit12.lesson02.teach.am_baut_ceai_phrase:
    title: Wypiłem/Wypiłam herbatę
    gloss: Am băut ceai. (Wypiłem/Wypiłam herbatę.)
    note: 'Pełny wzór: am băut + napój.'
  ro.a1.unit12.lesson02.teach.am_mancat_am_baut_phrase:
    title: Zjadłem/Zjadłam chleb i wypiłem/wypiłam herbatę
    gloss: Am mâncat pâine și am băut ceai. (Zjadłem/Zjadłam chleb i wypiłem/wypiłam herbatę.)
    note: Dwie czynności w czasie przeszłym połączone spójnikiem *și* – tym samym, którego w lekcji 10 użyto przy czynnościach w czasie teraźniejszym.
  ro.a1.unit12.lesson03.teach.reminder_am_fost_ieri_parc_cinema:
    title: 'Przypomnienie: am fost, ieri, parc, cinema'
    gloss: am fost (byłem/byłam, poszedłem/poszłam) · ieri (wczoraj) · parc (park) · cinema (kino)
    note: Wszystko z pierwszej lekcji tej jednostki – tutaj przygotowuje wspominanie niedzieli.
  ro.a1.unit12.lesson03.teach.reminder_am_mancat_am_baut:
    title: 'Przypomnienie: am mâncat, am băut, pâine, cafea, ceai'
    gloss: am mâncat (zjadłem/zjadłam) · am băut (wypiłem/wypiłam) · pâine (chleb) · cafea (kawa) · ceai (herbata)
    note: Wszystko z drugiej lekcji tej jednostki – tutaj Ana i Mihai opowiadają, co jedli i pili.
  ro.a1.unit12.lesson03.teach.reminder_cum_duminica_bine:
    title: 'Przypomnienie: cum, duminică, bine, mulțumesc, la revedere, Ana, Mihai'
    gloss: cum (jak, lekcje 1 i 9) · duminică (niedziela, lekcja 3) · bine (dobrze, lekcja 1) · mulțumesc (dziękuję) · la revedere (do widzenia) · Ana, Mihai (imiona)
    note: 'Wszystkie te słowa znasz już z wcześniejszych lekcji – *cum* pojawiło się najpierw w pytaniu o imię (lekcja 1) i o drogę (lekcja 9), a tu otwiera inny rodzaj pytania: jak coś poszło.'
  ro.a1.unit12.lesson03.teach.a_fost_vocab:
    title: Było
    gloss: A fost (było; on/ona był/a)
    note: Inna osoba tego samego czasownika co *am fost* – *a* to forma pomocnicza dla „on/ona/ono”, a nie dla „ja/my”. Na razie naucz się *Cum a fost...?* i *A fost bine!* jako stałych zwrotów, a nie wzoru do swobodnego tworzenia zdań.
    example_gloss:
    - Było dobrze!
  ro.a1.unit12.lesson03.teach.a_fost_bine_phrase:
    title: Było dobrze!
    gloss: A fost bine! (Było dobrze!)
    note: Krótki, naturalny sposób, by powiedzieć, że coś się udało – odpowiedź na *Cum a fost...?*
  ro.a1.unit12.lesson03.teach.cum_a_fost_duminica_phrase:
    title: Jak było w niedzielę?
    gloss: Cum a fost duminică? (Jak było w niedzielę?)
    note: Naturalny sposób na rozpoczęcie rozmowy o niedawnym dniu, nawet z kimś, kto też tam był – zachęca do podzielenia się wrażeniami lub tym, co zapadło w pamięć.
  ro.a1.unit12.lesson03.teach.line01:
    title: Przywitaj się i zapytaj, jak było w niedzielę
    gloss: Mihai wita się z Aną i pyta, jak było w niedzielę.
    note: Łączy *Cum a fost duminică?* z tej lekcji ze znanym już *Bună*.
  ro.a1.unit12.lesson03.teach.line02:
    title: Odpowiedz i powiedz, gdzie byłeś/byłaś
    gloss: Ana mówi, że było dobrze i że była w parku.
    note: Łączy *A fost bine!* ze zdaniem *Am fost la parc* z pierwszej lekcji.
  ro.a1.unit12.lesson03.teach.line03:
    title: Powiedz, co zjadł i wypił
    gloss: Mihai mówi, że zjadł chleb i wypił herbatę.
    note: Wraca do zdania *Am mâncat pâine și am băut ceai* z drugiej lekcji – zgodnie z tym, co Mihai zwykle jadł i pił w lekcji 6 (pâine i ceai).
  ro.a1.unit12.lesson03.teach.line04:
    title: Powiedz, co wypiła
    gloss: Ana mówi, że wypiła kawę.
    note: Zgadza się z wyborem Any z lekcji 6 (cafea).
  ro.a1.unit12.lesson03.teach.line05:
    title: Podziękuj i pożegnaj się
    gloss: Mihai dziękuje Anie i się żegna.
    note: Takie samo zakończenie, jakim kończyły się dialogi we wszystkich wcześniejszych lekcjach.
  ro.a1.unit12.lesson03.teach.line06:
    title: Zakończ rozmowę
    gloss: Ana też się żegna, zwracając się do Mihaia po imieniu.
    note: Takie samo przyjazne zakończenie, jakim kończyły się dialogi we wszystkich wcześniejszych lekcjach.
