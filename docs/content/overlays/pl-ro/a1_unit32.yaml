teaching:
  ro.a1.unit32.lesson01.teach.animalul_un_animal:
    title: Zwierzę, zwierzę domowe
    gloss: zwierzę / zwierzę domowe
    note: '*Animal* to słowo ogólne; *animal de companie* („zwierzę towarzyszące”) oznacza właśnie zwierzę domowe. Liczba mnoga to *animale* (*un animal*, *două animale*).'
    example_gloss:
    - Pies to zwierzę.
    - Pies to też zwierzę domowe.
  ro.a1.unit32.lesson01.teach.cainele_pisica:
    title: Pies i kot
    gloss: pies / kot
    example_gloss:
    - Ana ma psa.
    - Andrei ma kota.
  ro.a1.unit32.lesson01.teach.pestele_pasarea:
    title: Ryba i ptak
    gloss: ryba / ptak
    example_gloss:
    - Dziadek ma rybę.
    - Nina ma ptaka.
  ro.a1.unit32.lesson01.teach.ai_un_animal:
    title: Masz zwierzę domowe?
    gloss: Masz zwierzę domowe?
    note: 'Ten sam wzorzec pytania *Ai ...?*, który już znasz: *a avea* („mieć”) + rzeczownik.'
  ro.a1.unit32.lesson01.teach.da_am_un:
    title: Tak, mam psa
    gloss: Tak, mam psa.
    note: Prosta odpowiedź twierdząca z nowym słownictwem z tej lekcji.
  ro.a1.unit32.lesson01.teach.nu_nu_am:
    title: Nie, nie mam zwierzęcia domowego
    gloss: Nie, nie mam zwierzęcia domowego.
    note: Po *nu am* słowo *niciun* („ani jeden”) neguje rzeczownik; zobacz notkę gramatyczną.
  ro.a1.unit32.lesson01.teach.la_negatie_nu:
    title: 'Nu am: bez rodzajnika'
    gloss: 'Po nu am nie używa się un ani o: Nu am timp, nu am niciun animal de companie.'
    note: 'To ten sam wzorzec, co w zdaniu *Nu am timp*: nie jest to nowa gramatyka, tylko nowy rzeczownik w znanej konstrukcji.'
  ro.a1.unit32.lesson02.teach.a_scoate_la:
    title: Wyprowadzać na spacer (zwierzę)
    gloss: wyprowadzać na spacer (zwierzę)
    note: '*A scoate la plimbare* to stały zwrot; zobacz notkę gramatyczną.'
    example_gloss: Codziennie wyprowadzam psa na spacer.
  ro.a1.unit32.lesson02.teach.verbul_se_schimba:
    title: Czasownik zmienia się według osoby
    gloss: 'Czasownik zmienia się według osoby: eu scot, tu scoți, el scoate (wyprowadzam, wyprowadzasz, wyprowadza) psa na spacer.'
    note: 'Rumuńskie czasowniki zmieniają końcówkę w zależności od osoby, więc *a scoate la plimbare* odmienia się jak jeden czasownik: *scot*, *scoți*, *scoate*.'
  ro.a1.unit32.lesson02.teach.a_da_de:
    title: Karmić
    gloss: karmić
    example_gloss: Codziennie daję kotu jedzenie.
  ro.a1.unit32.lesson02.teach.a_se_juca:
    title: Bawić się z
    gloss: bawić się z
    example_gloss: Andrei bawi się ze swoim kotem.
  ro.a1.unit32.lesson02.teach.scot_cainele_la:
    title: Codziennie wyprowadzam psa
    gloss: Codziennie wyprowadzam psa na spacer.
    note: Łączy *a scoate la plimbare* z *în fiecare zi* („codziennie”), znanym już z wcześniejszej lekcji.
  ro.a1.unit32.lesson02.teach.dau_de_mancare:
    title: Codziennie karmię kota
    gloss: Codziennie daję kotu jedzenie.
    note: 'Łączy *a da de mâncare* z *în fiecare zi*; zwierzę występuje w celowniku: *pisicii*.'
  ro.a1.unit32.lesson03.teach.plural_caine_caini:
    title: 'Plural: câine → câini'
    gloss: 'Liczba mnoga: câine → câini, animal → animale, pisică → pisici.'
    note: Regularny wzorzec rumuńskiej liczby mnogiej, wprowadzony tu po raz pierwszy na przykładzie rzeczowników oznaczających zwierzęta.
  ro.a1.unit32.lesson03.teach.caini_pisici:
    title: Psy i koty
    gloss: psy / koty
    example_gloss:
    - Mihai kocha psy.
    - Elena kocha koty.
  ro.a1.unit32.lesson03.teach.pesti_pasari:
    title: Ryby i ptaki (liczba mnoga)
    gloss: ryby / ptaki
    example_gloss:
    - Uwielbiam ryby.
    - Dziadek uwielbia ptaki.
  ro.a1.unit32.lesson03.teach.iubesc_animalele:
    title: Kocham zwierzęta
    gloss: Kocham zwierzęta.
    note: '*A iubi* („kochać”) łączy się z dopełnieniem bez przyimka: *Iubesc animalele*; końcówka rodzajnika *-le* pokazuje, że chodzi o zwierzęta w ogóle.'
  ro.a1.unit32.lesson03.teach.elena_iubeste_pisicile:
    title: Elena kocha koty, ale nie ma zwierzęcia domowego
    gloss: Elena kocha koty, ale nie ma zwierzęcia domowego.
    note: 'Przeciwstawienie: kochać zwierzęta, a mimo to żadnego nie mieć.'
  ro.a1.unit32.lesson04.teach.mihai_ai_un:
    title: Mihai pyta o zwierzę domowe
    gloss: 'Mihai: Masz zwierzę domowe, Ano?'
  ro.a1.unit32.lesson04.teach.ana_da_am:
    title: Ana ma psa
    gloss: 'Ana: Tak, mam psa.'
  ro.a1.unit32.lesson04.teach.mihai_cum_arata:
    title: Mihai pyta, jak on wygląda
    gloss: 'Mihai: Jak on wygląda?'
    note: To znowu pytanie *Cum arată ...?* z lekcji o wyglądzie, tym razem o zwierzęciu.
  ro.a1.unit32.lesson04.teach.ana_are_blana:
    title: Ana opisuje swojego psa
    gloss: 'Ana: Ma brązową sierść i jest mały.'
    note: Słownictwo o kolorze włosów i wielkości z lekcji o wyglądzie, tym razem do opisu sierści zwierzęcia, a nie włosów człowieka.
  ro.a1.unit32.lesson04.teach.pentru_un_animal:
    title: El i ea w odniesieniu do zwierząt
    gloss: 'O zwierzęciu mówisz el lub ea, zależnie od rodzaju: câinele to el, pisica to ea.'
    note: Dotychczas *el* i *ea* w kursie odnosiły się do osób; tutaj rozszerzamy je na zwierzęta, zgodnie z rodzajem rzeczownika.
  ro.a1.unit32.lesson04.teach.mihai_il_scoti:
    title: Mihai pyta o spacery
    gloss: 'Mihai: Wyprowadzasz go codziennie na spacer?'
  ro.a1.unit32.lesson04.teach.ana_da_il:
    title: Ana opisuje swoją rutynę
    gloss: 'Ana: Tak, codziennie wyprowadzam go na spacer i karmię go.'
  ro.a1.unit32.lesson05.teach.mihai_si_elena:
    title: Mihai, Elena i Andrei o zwierzętach
    gloss: 'Mihai i Elena kochają zwierzęta, ale żadne z nich nie ma zwierzęcia domowego. Mihai kocha psy, a Elena koty. Andrei natomiast ma zwierzę domowe: kota. Często bawi się ze swoim kotem i codziennie go karmi. A ty masz zwierzę domowe?'
    note: 'Przeciwstawienie: kochać zwierzę a rzeczywiście je mieć.'
    glosses:
      iubesc: kochać
      amândoi: oboje
      animalele: zwierzęta
      doi: oboje
      companie: zwierzę domowe
      câinii: psy
      pisicile: koty
      pisică: kot
      joacă: bawi się
      dă: daje
      fiecare: każdy
      mâncare: karma
  ro.a1.unit32.lesson05.teach.andrei_se_joaca:
    title: Andrei często bawi się ze swoim kotem
    gloss: Andrei często bawi się ze swoim kotem.
    note: '*Des* („często”) to słowo określające częstotliwość z lekcji o hobby; *a se juca cu* („bawić się z”) to czasownik zwrotny.'
  ro.a1.unit32.lesson05.teach.iubesc_cainii_nu:
    title: Kocham psy. Nie mam zwierzęcia domowego.
    gloss: Kocham psy. Nie mam zwierzęcia domowego.
    note: Wzorcowa odpowiedź z dwóch zdań, którą możesz wykorzystać w zadaniu pisemnym z tej lekcji.
  ro.a1.unit32.lesson06.teach.ana_nina_ai:
    title: Ana pyta Ninę
    gloss: 'Ana: Nina, ty też masz zwierzę domowe?'
  ro.a1.unit32.lesson06.teach.nina_da_am:
    title: Nina ma ptaka o imieniu Pico
    gloss: 'Nina: Tak, mam ptaka. Nazywa się Pico.'
    note: '*O cheamă* („ma na imię”) używa czasownika *a chema*, znanego z podawania imienia; ptak jest rodzaju żeńskiego, więc zaimek to *o*.'
  ro.a1.unit32.lesson06.teach.mihai_ce_frumos:
    title: Mihai reaguje
    gloss: 'Mihai: Jak miło! Co z nim robisz codziennie?'
  ro.a1.unit32.lesson06.teach.nina_ii_dau:
    title: Nina codziennie karmi ptaka
    gloss: 'Nina: Codziennie daję mu jeść.'
  ro.a1.unit32.lesson06.teach.mihai_iubesc_si:
    title: Mihai też kocha ptaki
    gloss: 'Mihai: Ja też kocham ptaki.'
  ro.a1.unit32.lesson06.teach.ana_ce_frumos:
    title: Ana kończy rozmowę
    gloss: 'Ana: Jak miło, że my troje kochamy zwierzęta!'
    note: Zakończenie rozmowy, które łączy to, co w tej lekcji wiemy o zwierzętach wszystkich trojga bohaterów.
