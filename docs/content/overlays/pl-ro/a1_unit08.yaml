teaching:
  ro.a1.unit08.lesson01.teach.reminder_unde_este:
    title: 'Przypomnienie: unde, este'
    gloss: unde (gdzie) · este (jest)
    note: Oba słowa już się pojawiły — *unde* w *Unde pot să cumpăr ...?* z lekcji 7, *este* od lekcji 3 i 4 — tutaj łączą się w podstawowe pytanie o miejsce.
  ro.a1.unit08.lesson01.teach.unde_este_phrase:
    title: Gdzie jest...?
    gloss: Unde este...? (Gdzie jest...?)
    note: Codzienny sposób pytania, gdzie coś jest — po *este* dodaj nazwę miejsca albo użyj samego pytania, gdy z kontekstu wiadomo, o jakie miejsce chodzi.
  ro.a1.unit08.lesson01.teach.gara_magazin_banca:
    title: Dworzec, sklep, bank
    gloss: gară (dworzec kolejowy) · magazin (sklep) · bancă (bank)
    note: 'Trzy popularne miejsca — gdy mowa o konkretnym, znanym miejscu, przyjmują rodzajnik określony: *gara*, *magazinul*, *banca*.'
    example_gloss:
    - Gdzie jest dworzec?
    - Sklep jest blisko.
    - Bank jest daleko.
  ro.a1.unit08.lesson01.teach.aproape_departe:
    title: Blisko, daleko
    gloss: aproape (blisko) · departe (daleko)
    note: Prosty sposób opisania, jak blisko lub daleko jest jakieś miejsce, bez podawania dokładnej drogi.
    example_gloss:
    - Sklep jest blisko.
    - Bank jest daleko.
  ro.a1.unit08.lesson01.teach.magazinul_aproape:
    title: Sklep jest blisko
    gloss: Magazinul este aproape. (Sklep jest blisko.)
    note: Krótkie, pełne zdanie — po *aproape* nie trzeba podawać nazwy miejsca, gdy wiadomo, o które chodzi.
  ro.a1.unit08.lesson01.teach.banca_departe:
    title: Bank jest daleko
    gloss: Banca este departe. (Bank jest daleko.)
    note: Przeciwieństwo *aproape* — ten sam prosty wzór.
  ro.a1.unit08.lesson01.teach.unde_este_gara:
    title: Gdzie jest dworzec?
    gloss: Unde este gara? (Gdzie jest dworzec?)
    note: Łączy *Unde este...?* i *gara* w jedno pełne pytanie.
  ro.a1.unit08.lesson02.teach.spital_posta_biblioteca_statie:
    title: Szpital, poczta, biblioteka, przystanek autobusowy
    gloss: spital (szpital) · poștă (poczta) · bibliotecă (biblioteka) · stație de autobuz (przystanek autobusowy)
    note: 'Cztery kolejne popularne miejsca — tak jak gară/magazin/bancă, przyjmują rodzajnik określony, gdy chodzi o konkretne miejsce: *spitalul*, *poșta*, *biblioteca*, *stația de autobuz*.'
    example_gloss:
    - Szpital jest naprzeciwko sklepu.
    - Poczta jest między sklepem a szpitalem.
    - Biblioteka jest blisko dworca.
    - Przystanek autobusowy jest obok biblioteki.
  ro.a1.unit08.lesson02.teach.langa_vizavi_intre:
    title: Obok, naprzeciwko, między
    gloss: lângă (obok) · vizavi de (naprzeciwko) · între (między)
    note: Trzy sposoby określenia położenia miejsca względem innego. *Vizavi de* i *între* łączą się z drugim miejscem przez *de*/*și*; *lângă* łączy się bezpośrednio.
    example_gloss:
    - Sklep jest obok dworca.
    - Szpital jest naprzeciwko sklepu.
    - Poczta jest między sklepem a szpitalem.
  ro.a1.unit08.lesson02.teach.magazinul_langa_gara:
    title: Sklep jest obok dworca
    gloss: Magazinul este lângă gară. (Sklep jest obok dworca.)
    note: '*Lângă* łączy się bezpośrednio z nazwą miejsca, bez żadnego dodatkowego słowa.'
  ro.a1.unit08.lesson02.teach.spitalul_vizavi_magazin:
    title: Szpital jest naprzeciwko sklepu
    gloss: Spitalul este vizavi de magazin. (Szpital jest naprzeciwko sklepu.)
    note: '*Vizavi de* wymaga *de* przed drugim miejscem.'
  ro.a1.unit08.lesson02.teach.posta_intre:
    title: Poczta jest między sklepem a szpitalem
    gloss: Poșta este între magazin și spital. (Poczta jest między sklepem a szpitalem.)
    note: '*Între* wskazuje dwa miejsca połączone przez *și* (i).'
  ro.a1.unit08.lesson02.teach.statia_langa_biblioteca:
    title: Przystanek autobusowy jest obok biblioteki
    gloss: Stația de autobuz este lângă bibliotecă. (Przystanek autobusowy jest obok biblioteki.)
    note: Ten sam wzorzec z *lângă* co przy sklepie i dworcu, tym razem z przystankiem i biblioteką.
  ro.a1.unit08.lesson03.teach.reminder_buna_multumesc_la_revedere_da:
    title: 'Przypomnienie: bună, mulțumesc, la revedere, da, Ana, Mihai'
    gloss: bună (cześć) · mulțumesc (dziękuję) · la revedere (do widzenia) · da (tak) · Ana, Mihai (imiona)
    note: Wszystko to już znasz z wcześniejszych lekcji – tu Ana i Mihai spotykają się ponownie, tym razem w okolicy.
  ro.a1.unit08.lesson03.teach.line01:
    title: Przywitaj się i zapytaj, gdzie jest poczta
    gloss: Ana wita Mihaia i pyta, gdzie jest poczta.
    note: Łączy *Unde este* z tej lekcji z powitaniem z lekcji 1.
  ro.a1.unit08.lesson03.teach.line02:
    title: Podanie położenia
    gloss: Mihai mówi, że poczta jest między sklepem a szpitalem.
    note: Wykorzystuje ponownie konstrukcję *poșta*/*între ... și* z tej lekcji.
  ro.a1.unit08.lesson03.teach.line03:
    title: Zapytaj o bibliotekę
    gloss: Ana pyta, czy biblioteka jest blisko.
    note: Krótkie pytanie uzupełniające, w którym wracają *este* i *aproape*.
  ro.a1.unit08.lesson03.teach.line04:
    title: Potwierdź i dodaj informację
    gloss: Mihai potwierdza, że biblioteka jest blisko dworca, i dodaje, że przystanek autobusowy jest obok biblioteki.
    note: Łączy *aproape de* i *lângă* – oba przyimki z tej lekcji – w jednej wypowiedzi.
  ro.a1.unit08.lesson03.teach.line05:
    title: Podziękuj i zakończ
    gloss: Ana dziękuje Mihaiowi i się żegna.
    note: '*Mulțumesc* to tu proste podziękowanie na zakończenie, to samo słowo co w *Bine, mulțumesc.* z lekcji 1.'
  ro.a1.unit08.lesson03.teach.line06:
    title: Zakończ spotkanie
    gloss: Mihai również się żegna, zwracając się do Ani po imieniu.
    note: Ten sam przyjazny sposób zakończenia, którym kończyły się dialogi z lekcji 1, 5, 6 i 7.
