answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit's own new vocabulary (vreme, soare, cald, plouă, vânt, frig) is used only in person-invariant impersonal constructions ("Este soare," "Plouă," "Este vânt," "Este frig," "Cum este vremea?") with no register distinction of any kind. No new tu/ dumneavoastră form is introduced this unit; Ana and Mihai keep their existing formal register with each other in the dialogue's greeting/closing lines.
course:
  title: Rumuński A1
  description: Opisywanie podstawowej pogody po rumuńsku – Vreme (pogoda), Soare (słońce), Cald (ciepło), Plouă (pada deszcz), Vânt (wiatr) i Frig (zimno) – gdy Ana i Mihai sprawdzają prognozę na jutro i decydują, kiedy pójść do parku.
units:
  ro.a1.unit19.weather:
    title: Pogoda
lessons:
  ro.a1.unit19.lesson01.vremea_de_azi:
    title: Dzisiejsza pogoda
  ro.a1.unit19.lesson02.vremea_de_maine:
    title: Pogoda na jutro
  ro.a1.unit19.lesson03.planul_de_sambata:
    title: Plan na sobotę
teaching:
  ro.a1.unit19.lesson01.teach.reminder_ana_este:
    title: 'Przypomnienie: Ana, Este, Și'
    gloss: Ana (imię) · Este (jest) · Și (i)
    note: Ana to imię bohaterki, znane od lekcji 1; *este* pochodzi z lekcji 8 o miejscach; *și* z lekcji 5 – w tej lekcji wszystkie trzy służą do opisu dzisiejszej pogody.
  ro.a1.unit19.lesson01.teach.reminder_astazi:
    title: 'Przypomnienie: Astăzi'
    gloss: Astăzi (dziś)
    note: Ze słownictwa o datach z lekcji 3 – tutaj użyte do rozmowy o dzisiejszej pogodzie.
  ro.a1.unit19.lesson01.teach.vreme_vocab:
    title: Pogoda
    gloss: Vreme (pogoda)
    note: '*Vremea* to forma określona od *vreme* – „pogoda”: rzeczownik rodzaju żeńskiego zakończony na -e dostaje -a, tak jak *baie* → *baia* („łazienka”) w lekcji 18.'
    example_gloss:
    - Jaka jest pogoda?
  ro.a1.unit19.lesson01.teach.cum_este_vremea_phrase:
    title: Jaka jest pogoda?
    gloss: Cum este vremea? (Jaka jest pogoda?)
    note: Codzienny sposób pytania o pogodę – *cum* znasz z lekcji 1, 9 i 12.
  ro.a1.unit19.lesson01.teach.soare_vocab:
    title: Słońce / słonecznie
    gloss: Soare (słońce / słonecznie)
    note: 'Używane z *este* do opisu słonecznej pogody: *Este soare* dosłownie „jest słońce”, czyli „jest słonecznie”.'
    example_gloss:
    - Dziś jest słonecznie.
  ro.a1.unit19.lesson01.teach.cald_vocab:
    title: Ciepło / gorąco
    gloss: Cald (ciepło / gorąco)
    note: Niezmienne słowo opisujące pogodę – w *Este cald* zawsze występuje ta sama forma, bez uzgadniania.
    example_gloss:
    - Dziś jest ciepło.
  ro.a1.unit19.lesson01.teach.astazi_soare_cald_phrase:
    title: Dziś jest słonecznie. Jest ciepło.
    gloss: Astăzi este soare. Este cald.
    note: Wszystkie słowa były już poznane lub dopiero się pojawiły; tu łączą się w dwa nowe zdania o dzisiejszej pogodzie.
  ro.a1.unit19.lesson02.teach.reminder_mihai_maine:
    title: 'Przypomnienie: Mihai, Mâine'
    gloss: Mihai (imię) · Mâine (jutro)
    note: Mihai to imię bohatera, znane od lekcji 1; *mâine* pochodzi z lekcji 3 i 12 – w tej lekcji oba służą do opisu jutrzejszej prognozy.
  ro.a1.unit19.lesson02.teach.reminder_nu_mergem_la_parc:
    title: 'Przypomnienie: Nu, Mergem, La parc'
    gloss: Nu (nie) · Mergem (idziemy) · La parc (do parku)
    note: Wszystko ze słownictwa o ustalaniu planów z lekcji 11 – tu użyte do decyzji, czy pogoda pozwala na wyjście do parku.
  ro.a1.unit19.lesson02.teach.ploua_vocab:
    title: Pada deszcz
    gloss: Plouă (pada deszcz)
    note: Forma czasownika bezosobowego – podmiot nie jest potrzebny, tak jak w *Este cald*.
    example_gloss:
    - Jutro pada deszcz.
  ro.a1.unit19.lesson02.teach.vant_vocab:
    title: Wiatr
    gloss: Vânt (wiatr)
    note: 'Używane z *este* tak samo jak *soare*: *Este vânt* – „jest wietrznie”.'
    example_gloss:
    - Jutro jest wietrznie.
  ro.a1.unit19.lesson02.teach.frig_vocab:
    title: Zimno
    gloss: Frig (zimno)
    note: 'Używane z *este*: *Este frig* – „jest zimno”.'
    example_gloss:
    - Jutro jest zimno.
  ro.a1.unit19.lesson02.teach.maine_ploua_phrase:
    title: Jutro pada deszcz. Jest wietrznie i zimno.
    gloss: Mâine plouă. Este vânt și este frig.
    note: Wszystkie słowa były już poznane lub dopiero się pojawiły; tu łączą się w pełną prognozę na jutro.
  ro.a1.unit19.lesson02.teach.nu_mergem_phrase:
    title: Jutro nie idziemy do parku.
    gloss: Nu mergem la parc mâine. (Jutro nie idziemy do parku.)
    note: Plan zależny od pogody, do którego zmierza ta lekcja – wykorzystuje *mergem* i *la parc* z lekcji 11 oraz *nu* przed czasownikiem.
  ro.a1.unit19.lesson03.teach.reminder_buna_ce_mai_faceti_bine_multumesc:
    title: 'Przypomnienie: Bună, Ce mai faceți?, Bine, mulțumesc'
    gloss: Bună (cześć) · Ce mai faceți? (co słychać, formalnie) · Bine, mulțumesc (dobrze, dziękuję)
    note: Wszystko z powitania z lekcji 1 – tu użyte na początku dialogu tej lekcji.
  ro.a1.unit19.lesson03.teach.reminder_sambata_la_revedere:
    title: 'Przypomnienie: Sâmbătă, La revedere'
    gloss: Sâmbătă (sobota) · La revedere (do widzenia)
    note: '*Sâmbătă* pochodzi z lekcji 3, 11 i 12; *la revedere* z lekcji 1 – oba użyte w dialogu o planach na weekend.'
  ro.a1.unit19.lesson03.teach.line01:
    title: Przywitaj Mihaia i zapytaj, jak się miewa
    gloss: Ana wita Mihaia i pyta, co u niego słychać.
    note: Wykorzystuje powitanie *Ce mai faceți?* z lekcji 1.
  ro.a1.unit19.lesson03.teach.line02:
    title: Odpowiedz i zapytaj o jutrzejszą pogodę
    gloss: Mihai odpowiada, a potem pyta Anę, jaka będzie jutro pogoda.
    note: Łączy *Bine, mulțumesc* z lekcji 1 z frazą *Cum este vremea?* z tej lekcji, z dodatkiem *mâine*.
  ro.a1.unit19.lesson03.teach.line03:
    title: Opisz jutrzejszą prognozę
    gloss: Ana mówi, że będzie padać, wietrznie i zimno.
    note: Powtarza dokładnie frazę z drugiej części tej lekcji.
  ro.a1.unit19.lesson03.teach.line04:
    title: Zaproponuj rezygnację z parku i wyjście w sobotę
    gloss: Mihai mówi, że jutro nie pójdą do parku, i pyta o sobotę.
    note: Łączy frazę z drugiej części tej lekcji z *mergem* z lekcji 11 i *sâmbătă* z tej lekcji.
  ro.a1.unit19.lesson03.teach.line05:
    title: Zgódź się, zaznaczając, że w sobotę będzie słonecznie
    gloss: Ana mówi, że w sobotę będzie słonecznie, i zgadza się na plan.
    note: Łączy *soare* z wyrażeniem zgody *Da, bine!* z lekcji 11.
  ro.a1.unit19.lesson03.teach.line06:
    title: Pożegnaj się
    gloss: Mihai się żegna.
    note: Taki sam zwrot na zakończenie, jak w dialogach wszystkich wcześniejszych lekcji.
  ro.a1.unit19.lesson03.teach.line07:
    title: Pożegnaj się
    gloss: Ana się żegna.
    note: Taki sam zwrot na zakończenie, jak w dialogach wszystkich wcześniejszych lekcji.
