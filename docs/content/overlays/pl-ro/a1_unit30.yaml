  ro.a1.unit30.lesson05.mihai_si_ana_isi:
    title: Mihai i Ana porównują swoje hobby
  ro.a1.unit30.lesson06.planuim_impreuna_un_weekend:
    title: Planowanie wspólnego weekendu
teaching:
  ro.a1.unit30.lesson01.teach.a_citi_a:
    title: Czytanie, sport, gotowanie
    gloss: czytać, uprawiać sport, gotować
    note: 'Trzy popularne czasowniki związane z hobby: *a citi* (czytać), *a face sport* (uprawiać sport) i *a găti* (gotować). Rumuńskie formy słownikowe zaczynają się od *a*.'
    example_gloss:
    - Lubię czytać książkę.
    - W soboty uprawiam sport.
    - Lubię gotować dla przyjaciół.
  ro.a1.unit30.lesson01.teach.timpul_liber:
    title: Czas wolny
    gloss: czas wolny
    note: '*Timpul liber* (wolny czas) składa się z rzeczownika rodzaju męskiego *timp* z dodanym rodzajnikiem. To kluczowe wyrażenie, gdy mówisz o hobby.'
    example_gloss: W wolnym czasie lubię czytać.
  ro.a1.unit30.lesson01.teach.in_timpul_liber:
    title: Mówimy, co robisz w wolnym czasie
    gloss: W wolnym czasie lubię czytać.
    note: '*Citesc* to forma *eu* czasownika *a citi* (czytać); po *îmi place să* czasownik ma tę samą formę.'
  ro.a1.unit30.lesson02.teach.a_asculta_muzica:
    title: Muzyka, rysowanie, gry wideo
    gloss: słuchać muzyki, rysować, grać w gry wideo
    note: 'Trzy kolejne zajęcia: *a asculta muzică* (słuchać muzyki), *a desena* (rysować) i *a juca jocuri video* (grać w gry wideo).'
    example_gloss:
    - Lubię słuchać muzyki.
    - Często rysuję.
    - Lubię grać w gry z przyjaciółmi.
  ro.a1.unit30.lesson02.teach.imi_place_sa:
    title: Mówimy, że lubisz słuchać muzyki
    gloss: Lubię słuchać muzyki.
    note: '*Îmi place să ascult muzică*: *îmi place* („podoba mi się”) + *să* + czasownik to zwykły sposób, by powiedzieć, że lubisz coś robić.'
  ro.a1.unit30.lesson02.teach.imi_place_sa_2:
    title: Mówimy, że lubisz grać z przyjaciółmi
    gloss: Lubię grać w gry z przyjaciółmi.
    note: '*Cu prietenii* znaczy „z przyjaciółmi”: *cu* („z”) to przyimek, a *prietenii* to liczba mnoga z rodzajnikiem określonym.'
  ro.a1.unit30.lesson03.teach.mereu_des_uneori:
    title: Zawsze, często, czasami, nigdy
    gloss: zawsze, często, czasami, nigdy
    note: 'Cztery podstawowe przysłówki częstotliwości: *mereu*, *des*, *uneori* i *niciodată*. Zwykle stoją po czasowniku: *Citesc des*.'
    example_gloss:
    - W soboty zawsze ćwiczę.
    - Często czytam książkę.
    - Czasami rysuję.
    - Nigdy nie gram w gry.
  ro.a1.unit30.lesson03.teach.in_fiecare_saptamana:
    title: Co tydzień, w każdy weekend
    gloss: co tydzień, w każdy weekend
    note: '*În fiecare săptămână* i *în fiecare weekend* oznaczają „co tydzień” i „w każdy weekend”; *fiecare* się nie zmienia, zobacz następną kartę.'
    example_gloss:
    - Co tydzień gotuję dla przyjaciół.
    - Uprawiam sport w każdy weekend.
  ro.a1.unit30.lesson03.teach.cuvantul_fiecare_nu:
    title: Fiecare się nie zmienia
    gloss: 'Słowo fiecare się nie zmienia: în fiecare săptămână (co tydzień), în fiecare weekend (w każdy weekend).'
    note: '*Fiecare* pozostaje takie samo przed *săptămână* i *weekend*, niezależnie od rzeczownika, więc nie ma tu czego wybierać.'
  ro.a1.unit30.lesson03.teach.ce_faci_in:
    title: Pytamy o czas wolny
    gloss: Co robisz w wolnym czasie?
    note: To główne pytanie tej lekcji — użyj go, by zapytać kogokolwiek o hobby.
  ro.a1.unit30.lesson04.teach.ana_ne_plimbam:
    title: Ana zaczyna rozmowę o hobby
    gloss: 'Ana: Często spacerujemy razem. A co jeszcze robisz w wolnym czasie, Mihai?'
    note: '*Ne plimbăm* („spacerujemy”) to forma *noi* czasownika zwrotnego *a se plimba*; odnosi się do spacerów, które lubią oboje przyjaciele.'
  ro.a1.unit30.lesson04.teach.mihai_imi_place:
    title: Hobby Mihaia
    gloss: 'Mihai: Lubię gotować, także w domu. I często uprawiam sport.'
    note: '*Și acasă* (także w domu) wyjaśnia, że Mihai gotuje dla przyjemności, a nie tylko w pracy w restauracji.'
  ro.a1.unit30.lesson04.teach.ana_gatesti_si:
    title: Ana jest zaskoczona
    gloss: 'Ana: Gotujesz też w domu? Przecież już cały dzień gotujesz w pracy!'
    note: '*Toată ziua* (cały dzień) podkreśla, ile Mihai już gotuje w pracy; *deja* znaczy „już”.'
  ro.a1.unit30.lesson04.teach.mihai_da_dar:
    title: Mihai wyjaśnia
    gloss: 'Mihai: Tak, ale gotowanie wydaje mi się relaksujące. A ty, co lubisz robić?'
    note: '*Gătitul mi se pare relaxant* dosłownie znaczy „gotowanie wydaje mi się relaksujące”: *mi se pare* to częsty sposób wyrażania opinii.'
  ro.a1.unit30.lesson04.teach.ana_imi_place:
    title: Hobby Any
    gloss: 'Ana: Lubię czytać i często słucham muzyki.'
    note: W jednym zdaniu, połączone przez *și* (i), występują dwa czasowniki dotyczące hobby z lekcji 1 i 2.
  ro.a1.unit30.lesson04.teach.mihai_joci_si:
    title: Mihai pyta o gry
    gloss: 'Mihai: Ty też grasz w gry wideo?'
    note: Krótkie pytanie rozstrzygnięcia z użyciem *jocuri video* z lekcji 2; *joci* to forma *tu* czasownika *a juca*.
  ro.a1.unit30.lesson04.teach.ana_nu_nu:
    title: Ana odpowiada
    gloss: 'Ana: Nie, nigdy nie gram w gry wideo. Ale czasem rysuję!'
    note: '*Niciodată* (nigdy) i *uneori* (czasem) z lekcji 3, zestawione w jednej odpowiedzi; *nu ... niciodată* to podwójne zaprzeczenie, które w rumuńskim jest poprawne.'
  ro.a1.unit30.lesson05.teach.mihai_si_cu:
    title: Porównujemy hobby
    gloss: Mihai i ja często spacerujemy razem. Ale mamy też inne pasje. Mihai lubi gotować, także w domu, i często uprawia sport. Ja lubię czytać i często słucham muzyki. Czasem rysuję, ale nigdy nie gram w gry wideo. A ty, co lubisz robić w wolnym czasie?
    note: Wiadomość Any przypomina informacje z lekcji 4 i kończy się pytaniem do czytelnika, głównym pytaniem tej jednostki.
    glosses:
      plimbăm: spacerować
      des: często
      împreună: razem
      alte: inne
      gătească: gotuje
      place: chętnie
      acasă: w domu
      sport: uprawia (sport)
      citesc: czytam
      ascult: słucham
      muzică: muzyka
      desenez: rysuję
      uneori: czasami
      joc: gram w gry wideo
      niciodată: nigdy
      liber: wolny
      timpul: czas
  ro.a1.unit30.lesson06.teach.mihai_ce_faci:
    title: Mihai pyta o weekend
    gloss: 'Mihai: Co robisz w ten weekend?'
    note: W *în acest weekend* (w ten weekend) użyto *acest* w znaczeniu „ten”.
  ro.a1.unit30.lesson06.teach.ana_inca_nu:
    title: Ana się waha
    gloss: 'Ana: Jeszcze nie wiem. Lubię czytać, ale chcę też wyjść na dwór.'
    note: '*Să ies afară* (wyjść na dwór) to częsty sposób, by powiedzieć, że chcesz wyjść z domu; *vreau să* + czasownik znaczy „chcę ...”.'
  ro.a1.unit30.lesson06.teach.mihai_hai_sa:
    title: Mihai proponuje plan
    gloss: 'Mihai: Pospacerujmy razem! Potem ugotuję dla nas.'
    note: '*După aceea* (potem) wskazuje kolejność wydarzeń; *Hai să* + czasownik to propozycja zrobienia czegoś razem.'
  ro.a1.unit30.lesson06.teach.ana_buna_idee:
    title: Ana się zgadza
    gloss: 'Ana: Dobry pomysł! Lubię i spacerować, i gotować.'
    note: '*Și ..., și ...* („i ..., i ...”) pokazuje, że Ana lubi obie rzeczy jednakowo, a żadnej bardziej.'
  ro.a1.unit30.lesson06.teach.mihai_perfect_atunci:
    title: Mihai potwierdza
    gloss: 'Mihai: Świetnie. W takim razie do zobaczenia w sobotę!'
    note: Przyjazne zakończenie rozmowy, potwierdzające plan na *sâmbătă* (sobotę); *ne vedem* znaczy „zobaczymy się”.
