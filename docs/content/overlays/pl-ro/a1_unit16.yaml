teaching:
  ro.a1.unit16.lesson01.teach.reminder_ma_va_ce_sau:
    title: 'Powtórka: mă, vă, ce, sau'
    gloss: mă (mnie) · vă (Pana/Panią) · ce (co) · sau (albo)
    note: 'Mă pochodzi z rozdziałów 1 i 10 (mă numesc, mă trezesc); vă z rozdziałów 1, 6, 7 i 13 (vă rog); ce z rozdziałów 1, 3, 4 i 15; sau z rozdziału 13 – w tym rozdziale wszystkie cztery służą do nowego celu: mówienia o tym, co boli.'
  ro.a1.unit16.lesson01.teach.doare_vocab:
    title: Boli
    gloss: Doare (boli)
    note: 'Czasownik bezosobowy – po rumuńsku, podobnie jak po polsku, mówi się „boli mnie” (*mă doare*), a nie „ja boleję”. Samo *Mă doare* znaczy „boli (mnie)”; dodaj część ciała, by powiedzieć, co boli: *Mă doare capul*.'
    example_gloss:
    - Boli.
  ro.a1.unit16.lesson01.teach.cap_vocab:
    title: Głowa
    gloss: Cap (głowa)
    note: Rzeczownik rodzaju nijakiego zakończony na spółgłoskę – przyjmuje rodzajnik określony *-ul* (capul), tak samo jak *tren*->*trenul* i *peron*->*peronul*.
    example_gloss:
    - Boli mnie głowa.
  ro.a1.unit16.lesson01.teach.ce_va_doare_phrase:
    title: Co Pana/Panią boli?
    gloss: Ce vă doare? (Co Pana/Panią boli?)
    note: '*Ce* (co) + *vă* (Pana/Panią, forma grzecznościowa) + *doare* – wszystkie te słowa już były lub właśnie je poznałeś, a tu łączą się w nowe pytanie.'
  ro.a1.unit16.lesson01.teach.stomac_vocab:
    title: Żołądek
    gloss: Stomac (żołądek)
    note: Rzeczownik rodzaju nijakiego zakończony na spółgłoskę, więc „ten żołądek” to *stomacul* – ten sam rodzajnik *-ul* co w *cap*->*capul*.
    example_gloss:
    - Boli mnie żołądek.
  ro.a1.unit16.lesson01.teach.ma_doare_capul_sau_stomacul_phrase:
    title: Boli Pana/Panią głowa czy żołądek?
    gloss: Vă doare capul sau stomacul? (Boli Pana/Panią głowa czy żołądek?)
    note: '*Vă* (Pana/Panią) zamiast *mă* zmienia zdanie w pytanie o rozmówcę; *sau* (albo, z rozdziału 13) łączy dwie właśnie poznane części ciała.'
  ro.a1.unit16.lesson02.teach.reminder_nu_bine_am_un_de:
    title: 'Powtórka: nu, bine, am, un, de'
    gloss: nu (nie) · bine (dobrze) · am (mam) · un (rodzajnik nieokreślony, rodzaj męski/nijaki) · de (od/z)
    note: Nu i bine pochodzą z rozdziałów 1, 6 i 11; am z rozdziałów 2, 5 i 15; un i de z rozdziałów 6, 7 i 15 – w tym rozdziale wszystkie pięć służy do mówienia o złym samopoczuciu i potrzebie pójścia do lekarza.
  ro.a1.unit16.lesson02.teach.ma_simt_vocab:
    title: czuję się
    gloss: Mă simt (czuję się)
    note: Czasownik zwrotny, dosłownie „czuję siebie” – ten sam wzorzec *mă* + czasownik co *mă trezesc* i *mă culc* z rozdziału 10.
    example_gloss:
    - Czuję się dobrze.
  ro.a1.unit16.lesson02.teach.nu_ma_simt_bine_phrase:
    title: Źle się czuję
    gloss: Nu mă simt bine. (Nie czuję się dobrze.)
    note: '*Nu* neguje *mă simt bine* – to naturalny sposób, by powiedzieć, że coś jest nie tak, bez wskazywania konkretnego objawu.'
  ro.a1.unit16.lesson02.teach.bolnav_vocab:
    title: Chory
    gloss: Bolnav (chory)
    note: Forma rodzaju męskiego przymiotnika, tak jak mówi ją Mihai (*Sunt bolnav*). Kobieta mówi *Sunt bolnavă* (forma żeńska).
    example_gloss:
    - Jestem chory.
  ro.a1.unit16.lesson02.teach.am_nevoie_de_un_doctor_phrase:
    title: Potrzebuję lekarza
    gloss: Am nevoie de un doctor. (Potrzebuję lekarza.)
    note: '*Am nevoie de* (potrzebuję, dosłownie „mam potrzebę czegoś”) + *un doctor* – stały zwrot, przydatny, gdy prosisz o pomoc w czymkolwiek, nie tylko u lekarza.'
  ro.a1.unit16.lesson02.teach.doctor_vocab:
    title: Doctor
    gloss: Doctor (lekarz)
    note: Rodzaj męski, więc „lekarz” w znaczeniu „jakiś lekarz” to *un doctor*.
    example_gloss:
    - Potrzebuję lekarza.
  ro.a1.unit16.lesson03.teach.reminder_ce_mai_faceti_aveti_da:
    title: 'Przypomnienie: Ce mai faceți?, Aveți, Da'
    gloss: Ce mai faceți? (Jak się Pan/Pani miewa?) · Aveți (macie / ma Pan/Pani) · Da (tak)
    note: Ce mai faceți pochodzi z lekcji 1, Aveți z lekcji 5, a Da z lekcji 6 i 11 – wszystko wraca w dialogu tej lekcji.
  ro.a1.unit16.lesson03.teach.reminder_buna_multumesc_la_revedere_ana_mihai:
    title: 'Przypomnienie: bună, mulțumesc, la revedere, Ana, Mihai'
    gloss: bună (cześć / dzień dobry) · mulțumesc (dziękuję) · la revedere (do widzenia) · Ana, Mihai (imiona)
    note: Wszystko to już znasz z wcześniejszych lekcji – ten sam przyjazny początek i koniec, jaki mają wszystkie dialogi w tym kursie.
  ro.a1.unit16.lesson03.teach.reminder_spitalul_vizavi_magazin:
    title: 'Przypomnienie: Spitalul este vizavi de magazin'
    gloss: Spitalul este vizavi de magazin. (Szpital jest naprzeciwko sklepu.)
    note: Zdanie wzięte wprost z lekcji 8 – szpital stoi w tym samym miejscu, a notatka do czytania w tej lekcji do niego nawiązuje.
  ro.a1.unit16.lesson03.teach.odihna_vocab:
    title: Odpoczynek
    gloss: Odihnă (odpoczynek)
    note: Rzeczownik rodzaju żeńskiego – to, co zaleca lekarz (albo przyjaciel), gdy się źle czujesz.
    example_gloss:
    - Potrzebujesz odpoczynku.
  ro.a1.unit16.lesson03.teach.multa_apa_vocab:
    title: Dużo wody
    gloss: Multă apă (dużo wody)
    note: '*Multă* (dużo, rodzaj żeński) zgadza się z rzeczownikiem żeńskim *apă* (woda, z lekcji 6) – to stałe połączenie, takie jak zaleca lekarz.'
    example_gloss:
    - Odpoczynek i dużo wody.
  ro.a1.unit16.lesson03.teach.line01:
    title: Przywitaj się i zapytaj, jak się miewa
    gloss: Ana wita się z Mihaiem i pyta, jak się miewa.
    note: Wraca powitanie *Ce mai faceți?* z lekcji 1.
  ro.a1.unit16.lesson03.teach.line02:
    title: Powiedz, że źle się czujesz
    gloss: Mihai mówi, że źle się czuje i że boli go głowa.
    note: Łączy zwroty z drugiej i pierwszej części tej lekcji.
  ro.a1.unit16.lesson03.teach.line03:
    title: Zapytaj, czy potrzebuje lekarza
    gloss: Ana pyta, czy Mihai potrzebuje lekarza.
    note: Zwrot z drugiej części tej lekcji użyty w pytaniu, z formą *aveți* z lekcji 5.
  ro.a1.unit16.lesson03.teach.line04:
    title: Potwierdź, że jesteś chory i potrzebujesz lekarza
    gloss: Mihai mówi „tak”, że jest chory i potrzebuje lekarza.
    note: Łączy zwroty *sunt bolnav* i *am nevoie de un doctor* z tej lekcji.
  ro.a1.unit16.lesson03.teach.line05:
    title: Daj radę i pożegnaj się
    gloss: Ana radzi mu odpoczywać i pić dużo wody, po czym się żegna.
    note: Używa zwrotu *Odihnă și multă apă* z tej lekcji – rada dotycząca zdrowia zamiast zwykłego samego pożegnania.
  ro.a1.unit16.lesson03.teach.line06:
    title: Podziękuj jej i pożegnaj się
    gloss: Mihai dziękuje Ani i się żegna.
    note: To samo zakończenie, którym kończyły się dialogi we wszystkich wcześniejszych lekcjach.
