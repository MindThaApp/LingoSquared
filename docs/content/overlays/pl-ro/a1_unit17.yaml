teaching:
  ro.a1.unit17.lesson01.teach.reminder_este_la_mihai:
    title: 'Przypomnienie: este, la, Mihai'
    gloss: este (jest) · la (w, o, u) · Mihai (imię)
    note: Este znasz z lekcji 3, 4 i 8; la – z lekcji 4 (*la ora nouă*, czyli o dziewiątej); Mihai to imię bohatera, znane od lekcji 1. W tej lekcji wszystkie trzy słowa wracają, gdy mówimy o jego pracy.
  ro.a1.unit17.lesson01.teach.reminder_lucrez_lucreaza:
    title: 'Powtórka: lucrez, lucrează'
    gloss: lucrez (pracuję) · lucrează (on/ona pracuje)
    note: Oba słowa pochodzą z lekcji 10 o codziennym rozkładzie dnia (*Lucrez seara.*). Tutaj używamy ich, by mówić o zawodzie, a nie o porze dnia.
  ro.a1.unit17.lesson01.teach.inginer_vocab:
    title: Inżynier
    gloss: inżynier
    note: Rodzaj męski. W tej lekcji używa go tylko Mihai (*Sunt inginer*), więc formy żeńskiej jeszcze nie potrzebujemy.
    example_gloss:
    - Mihai jest inżynierem.
  ro.a1.unit17.lesson01.teach.birou_vocab:
    title: Biuro
    gloss: biuro
    note: Miejsce pracy Mihaia. Użyto go z przyimkiem *la* (w, u), który znasz już z lekcji 4.
    example_gloss:
    - On pracuje w biurze.
  ro.a1.unit17.lesson01.teach.mihai_este_inginer_lucreaza_la_birou_phrase:
    title: Mihai jest inżynierem. Pracuje w biurze.
    gloss: Mihai este inginer. Lucrează la birou.
    note: Wszystkie słowa już znasz lub dopiero je poznałeś. Złożono je w dwa nowe zdania o pracy Mihaia.
  ro.a1.unit17.lesson02.teach.reminder_sunt_unde_ana:
    title: 'Powtórka: sunt, unde, Ana'
    gloss: sunt (jestem) · unde (gdzie) · Ana (imię)
    note: Sunt znasz z lekcji 16 (*Sunt bolnav*); unde – z lekcji 7 i 8 (*Unde pot să cumpăr...?*, *Unde este...?*); Ana to imię bohaterki, znane od lekcji 1. W tej lekcji wszystkie trzy słowa wracają, gdy mówimy o pracy Any.
  ro.a1.unit17.lesson02.teach.profesoara_vocab:
    title: Nauczycielka
    gloss: nauczycielka
    note: Rodzaj żeński. W tej lekcji używa go tylko Ana (*Sunt profesoară*), więc formy męskiej jeszcze nie potrzebujemy.
    example_gloss:
    - Jestem nauczycielką.
  ro.a1.unit17.lesson02.teach.scoala_vocab:
    title: Szkoła
    gloss: szkoła
    note: Miejsce pracy Any. *La* użyto tak samo jak w *la birou*.
    example_gloss:
    - Pracuję w szkole.
  ro.a1.unit17.lesson02.teach.sunt_profesoara_lucrez_la_scoala_phrase:
    title: Jestem nauczycielką. Pracuję w szkole.
    gloss: Sunt profesoară. Lucrez la școală.
    note: Ana mówi o swojej pracy. Łączy dwa nowe słowa z tej lekcji ze znanym już z lekcji 16 *sunt*.
  ro.a1.unit17.lesson02.teach.unde_lucrati_phrase:
    title: Gdzie Pan/Pani pracuje?
    gloss: Unde lucrați? (Gdzie Pan/Pani pracuje?)
    note: '*Lucrați* to grzecznościowa forma „Pan/Pani pracuje” (także „Państwo pracują”). Ma końcówkę -ați/-eți, taką jak w *aveți* i *faceți*. Przydaje się, by zapytać kogokolwiek o pracę.'
  ro.a1.unit17.lesson03.teach.reminder_buna_ce_mai_faceti_bine_multumesc:
    title: 'Powtórka: Bună, Ce mai faceți?, Bine, mulțumesc'
    gloss: Bună (cześć, dzień dobry) · Ce mai faceți? (jak się Pan/Pani miewa?) · Bine, mulțumesc (dobrze, dziękuję)
    note: Wszystko to pochodzi z powitania z lekcji 1. Tu służy do rozpoczęcia dialogu z tej lekcji.
  ro.a1.unit17.lesson03.teach.reminder_si_dumneavoastra_la_revedere:
    title: 'Powtórka: Și dumneavoastră?, La revedere'
    gloss: Și dumneavoastră? (a Pan/Pani?) · La revedere (do widzenia)
    note: Oba zwroty znasz z lekcji 1. Tu pojawiają się jako naturalne pytanie zwrotne i zakończenie rozmowy.
  ro.a1.unit17.lesson03.teach.line01:
    title: Przywitaj się i zapytaj, co słychać
    gloss: Ana wita się z Mihaiem i pyta, jak się miewa.
    note: Wraca powitanie *Ce mai faceți?* z lekcji 1.
  ro.a1.unit17.lesson03.teach.line02:
    title: Odpowiedz i zapytaj, gdzie pracuje
    gloss: Mihai odpowiada, a potem pyta Anę, gdzie pracuje.
    note: Łączy *Bine, mulțumesc* z lekcji 1 z nowym w tej lekcji *Unde lucrați?*.
  ro.a1.unit17.lesson03.teach.line03:
    title: Powiedz, kim jesteś i gdzie pracujesz, a potem zapytaj rozmówcę
    gloss: Ana mówi, że pracuje w szkole jako nauczycielka, a potem zadaje to samo pytanie Mihaiowi.
    note: Łączy zwrot z drugiej części tej lekcji z *Și dumneavoastră?* z lekcji 1.
  ro.a1.unit17.lesson03.teach.line04:
    title: Powiedz, kim jesteś i gdzie pracujesz
    gloss: Mihai mówi, że pracuje w biurze jako inżynier.
    note: Powtarza prawie dokładnie zwrot z pierwszej części tej lekcji.
  ro.a1.unit17.lesson03.teach.line05:
    title: Zakończ rozmowę
    gloss: Ana się żegna.
    note: Takie samo zakończenie mają dialogi we wszystkich wcześniejszych lekcjach.
  ro.a1.unit17.lesson03.teach.line06:
    title: Pożegnaj się
    gloss: Mihai się żegna.
    note: Takie samo zakończenie mają dialogi we wszystkich wcześniejszych lekcjach.
