answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit's own new vocabulary (inginer, birou, profesoară, școală) is used only in fixed first-person forms (Mihai's own "Sunt inginer", Ana's own "Sunt profesoară"). The one new conjugated verb form, "lucrați," reuses the already-established formal -ați/-eți ending. No informal-tu form is introduced this unit; Ana and Mihai keep their existing formal register with each other.
course:
  title: Rumuński A1
  description: Podawanie podstawowego zawodu i miejsca pracy po rumuńsku – Inginer (inżynier), Profesoară (nauczycielka), Birou (biuro) i Școală (szkoła) – gdy Mihai i Ana rozmawiają o tym, gdzie pracują.
