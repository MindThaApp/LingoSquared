answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: '"Vreau" (I want, plain) and "Aș dori" (I would like, polite, established in unit06) are a genuine directness contrast, not interchangeable synonyms -- accept either for a general "I want/I would like" unless an exercise explicitly names one. "Vă rog" (formal) and "te rog" (informal, both established in unit06) remain a register-sensitive pair here too. Ana and Mihai''s market dialogue keeps their existing polite register with each other (vă rog, not te rog).'
course:
  title: Rumuński A1
  description: Pytanie o ceny i ilości po rumuńsku – waluta leu/lei, scump/ieftin oraz zakupy na targu, np. roșii (pomidory) i cartofi (ziemniaki) na kilogramy – a w tle dalsze zakupy Any i Mihaia na targu.
units:
  ro.a1.unit07.shopping:
    title: Zakupy
lessons:
  ro.a1.unit07.lesson01.cat_costa:
    title: Ile to kosztuje?
  ro.a1.unit07.lesson02.rosii_si_cartofi:
    title: Pomidory i ziemniaki
  ro.a1.unit07.lesson03.la_piata:
    title: Na targu
teaching:
  ro.a1.unit07.lesson01.teach.reminder_un_numere:
    title: 'Przypomnienie: un, doi, cinci, zece, douăzeci'
    gloss: un (jeden) · doi (dwa) · cinci (pięć) · zece (dziesięć) · douăzeci (dwadzieścia)
    note: Wszystkie pojawiły się już wcześniej (*un* w lekcji 4, liczby w lekcji 2) – tutaj wracają przy rozmowie o cenach.
  ro.a1.unit07.lesson01.teach.cat_costa:
    title: Ile to kosztuje?
    gloss: Cât costă? (Ile to kosztuje?)
    note: Codzienny sposób pytania o cenę po rumuńsku – dodaj nazwę produktu albo użyj go samodzielnie, gdy z kontekstu wiadomo, o co chodzi.
  ro.a1.unit07.lesson01.teach.leu:
    title: Leu (waluta)
    gloss: 'leu (rumuńska jednostka walutowa – liczba mnoga: lei)'
    note: Waluta Rumunii. Leu to liczba pojedyncza (jeden leu); liczba mnoga lei jest nieregularna, nie powstaje przez dodanie zwykłej końcówki do leu.
    example_gloss: Kosztuje jeden leu.
  ro.a1.unit07.lesson01.teach.costa_cinci_lei:
    title: Kosztuje osiem lei
    gloss: Costă opt lei. (Kosztuje osiem lei.)
    note: Przy liczbach 2–19 lei zostaje bez zmian – przed nim nie dodaje się żadnego słowa.
  ro.a1.unit07.lesson01.teach.costa_douazeci_de_lei:
    title: Kosztuje trzydzieści lei
    gloss: Costă treizeci de lei. (Kosztuje trzydzieści lei.)
    note: Od 20 w górę po rumuńsku wstawia się *de* przed liczonym rzeczownikiem – ta sama zasada, której w lekcji 2 uczyła cię forma *ani* (lata), teraz zastosowana do *lei*.
  ro.a1.unit07.lesson01.teach.leu_lei_de_rule:
    title: 'Zasada: leu → lei i kiedy dodać de'
    gloss: 'leu → lei · liczby 2–19: bez *de* · liczby 20+: dodaj *de*'
    note: Dokładnie ten sam wzór co zasada o *ani* z lekcji 2 (câți ani ai / am treizeci de ani) – gdy znasz ją dla jednego rzeczownika, działa tak samo dla lei.
  ro.a1.unit07.lesson01.teach.scump:
    title: Drogi
    gloss: scump (drogi)
    note: Częsta reakcja na cenę, która wydaje ci się za wysoka.
    example_gloss: Osiem lei? Drogo!
  ro.a1.unit07.lesson01.teach.ieftin:
    title: Tani
    gloss: ieftin (tani)
    note: Przeciwieństwo scump – dobra cena.
    example_gloss: Jeden leu? Tanio!
  ro.a1.unit07.lesson02.teach.reminder_un_o_si_as_dori_rog:
    title: 'Przypomnienie: un, o, și, aș dori, vă rog, te rog'
    gloss: un/o (a – przedimek) · și (i) · aș dori (chciał(a)bym) · vă rog (proszę, formalnie) · te rog (proszę, nieformalnie)
    note: '*Aș dori*, *vă rog* i *te rog* pojawiły się po raz pierwszy w scenie w kawiarni w lekcji 6 – tutaj wracają na targu.'
  ro.a1.unit07.lesson02.teach.piata:
    title: Targ
    gloss: piață (targ)
    note: Rzeczownik rodzaju żeńskiego – targ pod gołym niebem lub kryty, gdzie kupuje się świeże produkty.
    example_gloss: Ile to kosztuje na targu?
  ro.a1.unit07.lesson02.teach.rosii:
    title: Pomidory
    gloss: roșii (pomidory)
    note: Liczba mnoga od roșie (pomidor) – używana, gdy mówi się o kupowaniu pomidorów w ogóle.
    example_gloss: Poproszę pomidory.
  ro.a1.unit07.lesson02.teach.cartofi:
    title: Ziemniaki
    gloss: cartofi (ziemniaki)
    note: Liczba mnoga od cartof (ziemniak), ten sam wzór co roșii.
    example_gloss: Poproszę ziemniaki.
  ro.a1.unit07.lesson02.teach.kilogram:
    title: Kilogram
    gloss: kilogram (kilogram)
    note: 'Standardowa jednostka przy kupowaniu produktów na wagę. *De* łączy ją z tym, co się kupuje: kilogram *de* roșii, „kilogram pomidorów”.'
    example_gloss: Kilogram pomidorów.
  ro.a1.unit07.lesson02.teach.vreau:
    title: chcę
    gloss: vreau (chcę)
    note: Prostsze i bardziej bezpośrednie niż *aș dori* („chciał(a)bym”) – oba są w porządku na targu, vreau jest po prostu mniej uprzejme.
    example_gloss: Chcę ziemniaki.
  ro.a1.unit07.lesson02.teach.unde_pot_sa_cumpar:
    title: Gdzie mogę kupić ...?
    gloss: Unde pot să cumpăr roșii? (Gdzie mogę kupić pomidory?)
    note: Przydatne pytanie, gdy nie wiesz, gdzie zrobić zakupy — zamiast roșii wstaw dowolny inny produkt, którego szukasz.
  ro.a1.unit07.lesson02.teach.cat_costa_kilogram_rosii:
    title: Ile kosztuje kilogram pomidorów?
    gloss: Cât costă un kilogram de roșii? (Ile kosztuje kilogram pomidorów?)
    note: Łączy Cât costă i konstrukcję kilogram de ... w jedno pełne pytanie.
  ro.a1.unit07.lesson02.teach.vreau_kilogram_cartofi:
    title: Chcę kilogram ziemniaków
    gloss: Vreau un kilogram de cartofi. (Chcę kilogram ziemniaków.)
    note: Ten sam wzór kilogram de ..., tym razem w zdaniu oznajmującym z vreau, a nie w pytaniu.
  ro.a1.unit07.lesson03.teach.reminder_buna_multumesc_la_revedere:
    title: 'Przypomnienie: bună, ziua, mulțumesc, bine, la revedere, Ana, Mihai'
    gloss: bună ziua (dzień dobry) · mulțumesc (dziękuję) · bine (dobrze) · la revedere (do widzenia) · Ana, Mihai (imiona)
    note: Wszystko to już znasz z dialogów z lekcji 1 i 6 — tutaj Ana i Mihai spotykają się ponownie, tym razem na targu.
  ro.a1.unit07.lesson03.teach.line01:
    title: Przywitaj się i zapytaj o cenę
    gloss: Ana wita Mihaia i pyta o cenę kilograma pomidorów.
    note: Łączy Cât costă z tej lekcji z powitaniem z lekcji 1.
  ro.a1.unit07.lesson03.teach.line02:
    title: Podaj cenę
    gloss: Mihai mówi, że kosztuje osiem lei, i dodaje, że to tanio.
    note: Powtarza costă, opt lei i ieftin z tej lekcji.
  ro.a1.unit07.lesson03.teach.line03:
    title: Złóż uprzejme zamówienie i dodaj coś jeszcze
    gloss: Ana się zgadza, grzecznie prosi o kilogram pomidorów i dodaje, że chce też ziemniaki.
    note: Łączy aș dori, vă rog i vreau — oba style wypowiedzi ze słownictwa tej lekcji w jednej kwestii.
  ro.a1.unit07.lesson03.teach.line04:
    title: Podaj drugą cenę
    gloss: Mihai mówi, że kilogram ziemniaków kosztuje pięć lei.
    note: Powtarza liczebnik z lekcji 2, który został przypomniany już w pierwszej części tej lekcji.
  ro.a1.unit07.lesson03.teach.line05:
    title: Podziękuj i zakończ rozmowę
    gloss: Ana dziękuje Mihaiowi i żegna się.
    note: '*Mulțumesc* to tu proste podziękowanie na zakończenie — to samo słowo co w *Bine, mulțumesc.* z lekcji 1.'
  ro.a1.unit07.lesson03.teach.line06:
    title: Zakończ spotkanie
    gloss: Mihai również się żegna, zwracając się do Any po imieniu.
    note: Ten sam przyjazny sposób zakończenia rozmowy, którym kończyły się dialogi z lekcji 1, 5 i 6.
