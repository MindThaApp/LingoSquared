answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț, with comma-below ș/ț). Typed answers are checked with their diacritics: a spelling without them, or with the older cedilla letters ş/ţ, is accepted only where an exercise lists it explicitly, matching unit01''s policy.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the question mark/exclamation mark. Spoken answers are assessed for intelligibility, not written punctuation.
  register: tu and dumneavoastră (and their matching verb forms, ai/aveți) are never interchangeable answers for each other's exercises, the same discipline unit01 established.
course:
  title: Rumuński A1
  description: Liczby od zera do stu, w tym wzory tworzenia liczb od 11 do 19 (-sprezece) i dziesiątek (-zeci), różnica rodzajowa doi/două oraz używanie liczb do pytania o wiek i numer telefonu i odpowiadania na takie pytania, w ciągu dalszym historii Any i Mihaia z unit01.
units:
  ro.a1.unit02.numbers:
    title: Liczby
lessons:
  ro.a1.unit02.lesson01.zero_to_ten:
    title: Liczby od zera do dziesięciu
  ro.a1.unit02.lesson02.eleven_to_hundred:
    title: Liczby od jedenastu do stu
  ro.a1.unit02.lesson03.age_and_phone:
    title: Wiek i numer telefonu
teaching:
  ro.a1.unit02.lesson01.teach.zero:
    title: Zero
    gloss: zero
    note: '*Zero* się nie zmienia i służy też do odczytywania cyfry w dłuższej liczbie lub numerze telefonu.'
    example_gloss: Zero, jeden, dwa.
  ro.a1.unit02.lesson01.teach.unu:
    title: Jeden
    gloss: jeden
    note: '*Unu* to forma używana przy samodzielnym liczeniu. Przed rzeczownikiem rodzaju męskiego lub nijakiego skraca się do *un* (*un câine*, jeden pies); przed rzeczownikiem rodzaju żeńskiego przechodzi w *o* (*o sută*, sto).'
    example_gloss: Jeden, dwa, trzy.
  ro.a1.unit02.lesson01.teach.doi:
    title: Dwa (rodzaj męski)
    gloss: dwa
    note: '*Doi* używa się z rzeczownikami rodzaju męskiego (*doi bărbați*, dwóch mężczyzn). Rzeczowniki rodzaju żeńskiego, a także nijakiego, które w liczbie mnogiej zachowują się jak żeńskie, mają inną formę; zobacz następną kartę.'
    example_gloss: Dwa, trzy, cztery.
  ro.a1.unit02.lesson01.teach.doi_doua_gender:
    title: Dwa zmienia się w zależności od rodzaju
    gloss: 'dwa (rodzaj męski: doi; żeński i nijaki: două)'
    note: Podobnie jak w polskim (dwaj/dwie/dwa), rumuńskie *doi* ma osobną formę żeńską *două*, wymaganą przy rzeczownikach żeńskich (*două femei*, dwie kobiety) oraz nijakich, które w liczbie mnogiej są żeńskie (*două numere*, dwa numery). Poza jeden (*un*/*o*) i dwa liczby od *trei* do *zece* są takie same dla każdego rodzaju.
  ro.a1.unit02.lesson01.teach.trei:
    title: Trzy
    gloss: trzy
    note: '*Trei* jest niezmienne we wszystkich rodzajach.'
    example_gloss: Trzy, cztery, pięć.
  ro.a1.unit02.lesson01.teach.patru:
    title: Cztery
    gloss: cztery
    note: '*Patru* jest niezmienne. Zwróć uwagę na nieregularną, skróconą formę w liczbach od 11 do 19: *paisprezece* (14), a nie *patrusprezece*.'
    example_gloss: Cztery, pięć, sześć.
  ro.a1.unit02.lesson01.teach.cinci:
    title: Pięć
    gloss: pięć
    note: '*Cinci* jest niezmienne.'
    example_gloss: Pięć, sześć, siedem.
  ro.a1.unit02.lesson01.teach.sase:
    title: Sześć
    gloss: sześć
    note: '*Șase* jest niezmienne.'
    example_gloss: Sześć, siedem, osiem.
  ro.a1.unit02.lesson01.teach.sapte:
    title: Siedem
    gloss: siedem
    note: '*Șapte* jest niezmienne.'
    example_gloss: Siedem, osiem, dziewięć.
  ro.a1.unit02.lesson01.teach.opt:
    title: Osiem
    gloss: osiem
    note: '*Opt* się nie zmienia.'
    example_gloss: Osiem, dziewięć, dziesięć.
  ro.a1.unit02.lesson01.teach.noua:
    title: Dziewięć
    gloss: dziewięć
    note: '*Nouă* się nie zmienia. Bez znaku diakrytycznego wyglądałoby tak samo jak *noua* („ta nowa”, rodzaj żeński) — dlatego wpisuj *ă*: wpisywane odpowiedzi są sprawdzane razem ze znakami diakrytycznymi.'
    example_gloss: Dziewięć, dziesięć... gotowe!
  ro.a1.unit02.lesson01.teach.zece:
    title: Dziesięć
    gloss: dziesięć
    note: '*Zece* się nie zmienia i stanowi podstawę wszystkich liczebników od jedenastu wzwyż (*zece* + *-sprezece*).'
    example_gloss: Dziesięć! Brawo!
  ro.a1.unit02.lesson02.teach.unsprezece:
    title: Jedenaście
    gloss: jedenaście
    note: '*Unsprezece* dosłownie składa się z *unu* + *spre* + *zece* („jeden ponad dziesięć”). Według tego wzoru tworzone są wszystkie kolejne liczebniki od 11 do 19.'
    example_gloss: Dziesięć, jedenaście, dwanaście.
  ro.a1.unit02.lesson02.teach.teens_pattern:
    title: Od dwunastu do dziewiętnastu
    gloss: doisprezece (12), treisprezece (13), paisprezece (14), cincisprezece (15), șaisprezece (16), șaptesprezece (17), optsprezece (18), nouăsprezece (19)
    note: 'Każdy z tych liczebników powstaje przez dodanie *-sprezece* do zwykłej formy cyfry: *doi* → *doisprezece*, *trei* → *treisprezece* i tak aż do *nouă* → *nouăsprezece*. Dwa są nieregularne: czternaście, gdzie *patru* skraca się do *pai-* (*paisprezece*, nie *patrusprezece*), oraz szesnaście, gdzie *șase* zmienia się w *șai-* (*șaisprezece*, nie *șasesprezece*).'
  ro.a1.unit02.lesson02.teach.douazeci:
    title: Dwadzieścia
    gloss: dwadzieścia
    note: '*Douăzeci* („dwie dziesiątki”) to osobne słowo, na którym opierają się wszystkie liczby od 21 do 29.'
    example_gloss: Dziewiętnaście, dwadzieścia...
  ro.a1.unit02.lesson02.teach.douazeci_si_unu:
    title: Dwadzieścia jeden
    gloss: dwadzieścia jeden
    note: 'Od dwudziestu jeden w górę rumuński łączy dziesiątki i jedności za pomocą *și* („i”): *douăzeci și unu*, *douăzeci și doi* itd. — inaczej niż w liczebnikach od 11 do 19, które zlewają się w jedno słowo.'
    example_gloss: Dwadzieścia, dwadzieścia jeden, dwadzieścia dwa.
  ro.a1.unit02.lesson02.teach.tens_pattern:
    title: Od trzydziestu do dziewięćdziesięciu
    gloss: treizeci (30), patruzeci (40), cincizeci (50), șaizeci (60), șaptezeci (70), optzeci (80), nouăzeci (90)
    note: 'Każda dziesiątka od trzydziestu wzwyż to cyfra plus *-zeci* („dziesiątki”) — *trei* → *treizeci*, *patru* → *patruzeci* itd. Jedyna zmiana w pisowni dotyczy sześćdziesięciu: *șase* zmienia się w *șai-*, stąd *șaizeci* (to samo *șai-* co w *șaisprezece*). Dla 70, 80 i 90 nie ma liczenia dwudziestkami, jak we francuskim.'
  ro.a1.unit02.lesson02.teach.o_suta:
    title: Sto
    gloss: sto
    note: W *o sută* występuje *o* (żeńska forma „jeden/jakiś”), a nie *un*, ponieważ *sută* to rzeczownik rodzaju żeńskiego.
    example_gloss: Dziewięćdziesiąt, sto!
  ro.a1.unit02.lesson03.teach.cati_ani_ai:
    title: Pytanie o wiek (nieformalnie)
    gloss: Ile masz lat?
    note: Dosłownie „ile lat masz”, z użyciem *avea* (mieć) – po rumuńsku wiek podaje się przez „mieć”, a nie przez „być”, podobnie jak w języku *avoir*. *Câți* (ile, rodzaj męskoosobowy) zgadza się z *ani* (lata, rodzaj męski).
  ro.a1.unit02.lesson03.teach.am_nouasprezece_ani:
    title: Podaj swój wiek (poniżej dwudziestu)
    gloss: Mam dziewiętnaście lat.
    note: '*Am* to forma *eu* czasownika *avea*. Przed *ani* przy liczbach poniżej dwudziestu nie potrzeba *de*.'
  ro.a1.unit02.lesson03.teach.cati_ani_aveti:
    title: Pytanie o wiek (formalnie)
    gloss: Ile masz lat?
    note: '*Aveți* to forma *dumneavoastră* czasownika *avea*, zgodna z grzecznościowym rejestrem z lekcji 1.'
  ro.a1.unit02.lesson03.teach.am_treizeci_de_ani:
    title: Podaj swój wiek (od dwudziestu w górę)
    gloss: Mam trzydzieści lat.
    note: '*De* pojawia się tutaj, ponieważ *treizeci* to liczba od dwudziestu wzwyż — pełną regułę znajdziesz na następnej karcie.'
  ro.a1.unit02.lesson03.teach.de_insertion_rule:
    title: Kiedy dodać de przed rzeczownikiem
    gloss: '2–19: bez de (doi ani) / od 20: z de (treizeci de ani)'
    note: 'To typowa reguła rumuńska, której w polskim nie ma: liczby od 2 do 19 łączą się bezpośrednio z rzeczownikiem (*doi ani*, dwa lata; *nouăsprezece ani*, dziewiętnaście lat), ale od 20 wzwyż między liczbą a rzeczownikiem potrzebne jest *de* (*treizeci de ani*, trzydzieści lat; *o sută de ani*, sto lat). Jeden to przypadek szczególny (*un an*, jeden rok — liczba pojedyncza, w obu przypadkach bez *de*).'
  ro.a1.unit02.lesson03.teach.care_e_numarul_tau:
    title: Zapytaj nieformalnie o numer telefonu
    gloss: Jaki jest twój numer telefonu?
    note: '*Care* (który, jaki) to naturalny sposób zapytania o konkretny, istniejący numer, a nie *ce*. *Număr* jest rzeczownikiem rodzaju nijakiego: w liczbie pojedynczej ma takie same formy jak rzeczownik rodzaju męskiego, dlatego „*twój*” to *tău*, a nie *ta*.'
  ro.a1.unit02.lesson03.teach.care_este_numarul_dvs:
    title: Zapytaj formalnie o numer telefonu
    gloss: Jaki jest twój numer telefonu?
    note: '*Este* to pełna forma *e*, częstsza w starannej lub formalnej mowie. *Dumneavoastră* utrzymuje uprzejmy ton rozmowy — to to samo słowo, które poznałeś w lekcji 1.'
  ro.a1.unit02.lesson03.teach.raspuns_telefon:
    title: Podaj numer telefonu cyfra po cyfrze
    gloss: 'To: zero, siedem, dwa, jeden, cztery, pięć, sześć, siedem, osiem, dziewięć.'
    note: W tej lekcji numery odczytujemy po prostu cyfra po cyfrze — to samo uproszczenie, które w lekcji 1 zastosowano przy wyborze rejestru. Rozmówca może też grupować cyfry po dwie, ale pojedyncze cyfry zawsze są zrozumiałe.
