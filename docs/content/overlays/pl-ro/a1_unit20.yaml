  ro.a1.unit20.lesson03.la_magazin:
    title: W sklepie
teaching:
  ro.a1.unit20.lesson01.teach.reminder_vreau_un_ce:
    title: 'Przypomnienie: Vreau, Un, Ce'
    gloss: Vreau (chcę) · Un (jakiś/jeden, r. męski/nijaki) · Ce (co/jaki)
    note: '*Vreau* (chcę), *un* (rodzajnik nieokreślony: jakiś, jeden) i *ce* (co, jak w *Ce mai faceți?*) to słowa, które już znasz – tutaj użyte do poproszenia o ubranie.'
  ro.a1.unit20.lesson01.teach.tricou_vocab:
    title: Koszulka
    gloss: Tricou (koszulka)
    note: Rzeczownik nijaki – ma ten sam rodzajnik *un* (nie *o*) co poznane już rzeczowniki męskie i nijakie, np. *un leu*.
    example_gloss:
    - Chcę koszulkę.
  ro.a1.unit20.lesson01.teach.culoare_vocab:
    title: Kolor
    gloss: Culoare (kolor)
    note: Rzeczownik rodzaju żeńskiego, przydatny do pytania, w jakim kolorze coś jest.
    example_gloss:
    - Jaki kolor?
  ro.a1.unit20.lesson01.teach.rosu_vocab:
    title: Czerwony
    gloss: Roșu (czerwony)
    note: 'Stoi po rzeczowniku, który opisuje – to zwykły rumuński szyk przymiotnika: *tricou roșu*, dosłownie „koszulka czerwona”.'
    example_gloss:
    - Chcę czerwoną koszulkę.
  ro.a1.unit20.lesson01.teach.albastru_vocab:
    title: Niebieski
    gloss: Albastru (niebieski)
    note: 'Ten sam wzór co *roșu* – stoi po rzeczowniku: *tricou albastru*.'
    example_gloss:
    - Chcę niebieską koszulkę.
  ro.a1.unit20.lesson01.teach.vreau_tricou_rosu_phrase:
    title: Chcę czerwoną koszulkę.
    gloss: Vreau un tricou roșu.
    note: 'Podstawowa prośba: *vreau* (chcę) + *un tricou* (koszulkę) + *roșu* (czerwoną), z kolorem po rzeczowniku.'
  ro.a1.unit20.lesson02.teach.reminder_cat_costa_va_rog:
    title: 'Przypomnienie: Cât, Costă, Vă, Rog'
    gloss: Cât costă? (Ile kosztuje?) · Vă rog (proszę, formalnie)
    note: '*Cât costă?* znasz z lekcji o targu; *vă rog* to formalne „proszę” – tutaj służy do zapytania o cenę ubrania i złagodzenia prośby.'
  ro.a1.unit20.lesson02.teach.reminder_mic_mica_mare:
    title: 'Przypomnienie: Mic, Mică, Mare'
    gloss: Mic/Mică (mały, r. męski-nijaki/żeński) · Mare (duży, ta sama forma dla rodzaju męskiego i żeńskiego w liczbie pojedynczej)
    note: Słowa określające wielkość, które znasz już z porównywania jedzenia i napojów – tutaj użyte do rozmiarów ubrań.
  ro.a1.unit20.lesson02.teach.pantaloni_vocab:
    title: Spodnie
    gloss: Pantaloni (spodnie)
    note: Po rumuńsku zwykle w liczbie mnogiej, podobnie jak polskie „spodnie” – *pantaloni* oznacza jedną parę spodni.
    example_gloss:
    - Chcę spodnie.
  ro.a1.unit20.lesson02.teach.marime_vocab:
    title: Rozmiar
    gloss: Mărime (rozmiar)
    note: Rzeczownik rodzaju żeńskiego – łączy się z żeńskim *mică* (mała), przypomnianym wyżej, i niezmiennym *mare* (duża).
    example_gloss:
    - Jaki rozmiar?
  ro.a1.unit20.lesson02.teach.ce_marime_phrase:
    title: Jaki rozmiar?
    gloss: Ce mărime? (Jaki rozmiar?)
    note: Codzienne pytanie przy ladzie – krótkie, bez czasownika, tak samo jak *Ce culoare?* (Jaki kolor?).
  ro.a1.unit20.lesson02.teach.marime_mica_va_rog_phrase:
    title: Poproszę mały rozmiar.
    gloss: Mărime mică, vă rog.
    note: '*Mică* to żeńska forma od *mic*, zgodna z żeńskim rzeczownikiem *mărime* – razem z przypomnianym *vă rog* pozwala grzecznie podać swój rozmiar.'
  ro.a1.unit20.lesson02.teach.cat_costa_pantalonii_phrase:
    title: Ile kosztują te spodnie?
    gloss: Cât costă pantalonii? (Ile kosztują te spodnie?)
    note: '*Pantalonii* to forma określona od *pantaloni* („te spodnie”) – rzeczowniki rodzaju męskiego w liczbie mnogiej dodają *-i* jako rodzajnik określony (*pantaloni* → *pantalonii*). Razem z przypomnianym *cât costă*.'
  ro.a1.unit20.lesson03.teach.reminder_buna_multumesc_bine_la_revedere_si:
    title: 'Przypomnienie: Bună, Mulțumesc, Bine, La revedere, Și'
    gloss: Bună (cześć/dzień dobry) · Mulțumesc (dziękuję) · Bine (dobrze) · La revedere (do widzenia) · Și (i)
    note: Codzienne powitania oraz *și* (i) – tutaj użyte na początek i koniec dialogu w sklepie.
  ro.a1.unit20.lesson03.teach.reminder_zece_douazeci_de_lei:
    title: 'Przypomnienie: Zece, Douăzeci, De, Lei'
    gloss: Zece (dziesięć) · Douăzeci (dwadzieścia) · De (przyimek używany przed lei od 20 wzwyż) · Lei (waluta, liczba mnoga od leu)
    note: Liczby i waluta *leu/lei*, które już znasz – tutaj użyte do cen koszulki i spodni.
  ro.a1.unit20.lesson03.teach.line01:
    title: Przywitaj Mihaia i poproś o czerwoną koszulkę
    gloss: Ana wita Mihaia i mówi, że chce czerwoną koszulkę.
    note: 'Zwrot z pierwszej lekcji: *Vreau un tricou roșu.*'
  ro.a1.unit20.lesson03.teach.line02:
    title: Zapytaj o rozmiar
    gloss: Mihai pyta, jaki rozmiar ona chce.
    note: 'Codzienne pytanie w sklepie: *Ce mărime?* (Jaki rozmiar?).'
  ro.a1.unit20.lesson03.teach.line03:
    title: Podaj rozmiar, grzecznie, i zapytaj o cenę
    gloss: Ana prosi o mały rozmiar, a potem pyta, ile to kosztuje.
    note: '*Mărime mică, vă rog* (poproszę mały rozmiar), potem *Cât costă?* (Ile to kosztuje?).'
  ro.a1.unit20.lesson03.teach.line04:
    title: Podaj cenę
    gloss: Mihai mówi, że to kosztuje pięćdziesiąt lei.
    note: Użyto przypomnianego *cincizeci de lei*.
  ro.a1.unit20.lesson03.teach.line05:
    title: Zgódź się i zapytaj też o spodnie
    gloss: Ana się zgadza, potem mówi, że chce też spodnie, i pyta o ich cenę.
    note: '*Și* oznacza tu „też”: *Vreau și pantaloni* – „Chcę też spodnie”.'
  ro.a1.unit20.lesson03.teach.line06:
    title: Podaj cenę spodni
    gloss: Mihai mówi, że spodnie kosztują sto dwadzieścia lei.
    note: 'Od dwudziestu wzwyż po rumuńsku między liczbą a rzeczownikiem pojawia się *de*: *o sută douăzeci de lei*.'
  ro.a1.unit20.lesson03.teach.line07:
    title: Podziękuj Mihaiowi i pożegnaj się
    gloss: Ana dziękuje mu i się żegna.
    note: Uprzejme podziękowanie i pożegnanie.
  ro.a1.unit20.lesson03.teach.line08:
    title: Pożegnaj się
    gloss: Mihai się żegna.
    note: Proste pożegnanie z dodaniem imienia Any.
