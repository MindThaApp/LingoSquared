answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț, with comma-below ș/ț). Typed answers are checked with their diacritics: a spelling without them, or with the older cedilla letters ş/ţ, is accepted only where an exercise lists it explicitly, matching units 01/02''s policy.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the question mark/exclamation mark. Day and month names are correctly lowercase in standard Romanian writing (except sentence-initially); accept a learner's answer regardless of the case they happen to type it in -- this unit teaches the lowercase convention as a fact to recognize, not a hard-graded spelling rule.
  register: No new register-sensitive forms in this unit -- este (is) is invariant regardless of tu/dumneavoastră, and Ana and Mihai's closing dialogue keeps the dumneavoastră register unit01 already established between them.
course:
  title: Rumuński A1
  description: Dni tygodnia, miesiące roku i sposób podawania daty po rumuńsku (zwykła liczba główna plus nazwa miesiąca, z wyjątkiem pierwszego, dla którego używa się specjalnego słowa întâi) — ciąg dalszy historii Any i Mihaia, którzy planują kolejne spotkanie.
units:
  ro.a1.unit03.dates:
    title: Dni i daty
lessons:
  ro.a1.unit03.lesson01.zilele_saptamanii:
    title: Dni tygodnia
  ro.a1.unit03.lesson02.lunile_si_datele:
    title: Miesiące roku i podawanie daty
  ro.a1.unit03.lesson03.cand_ne_intalnim:
    title: Kiedy spotkamy się znowu?
teaching:
  ro.a1.unit03.lesson01.teach.este:
    title: 'Przypomnienie: este'
    gloss: jest / to jest
    note: '*Este* pojawiło się już w lekcji 2 (*Care este numărul...?*). Nie zmienia się — to to samo słowo niezależnie od tego, czy podmiotem jest dzień, data czy cokolwiek innego, i nie zmienia się między tu a dumneavoastră.'
  ro.a1.unit03.lesson01.teach.astazi_maine:
    title: Dzisiaj, jutro
    gloss: astăzi (dzisiaj) / mâine (jutro)
    note: Oba to niezmienne określenia czasu, które stoją na początku zdania podającego dzień lub datę.
    example_gloss:
    - Dziś jest poniedziałek.
    - Jutro jest wtorek.
  ro.a1.unit03.lesson01.teach.luni_marti:
    title: Poniedziałek, wtorek
    gloss: luni (poniedziałek) / marți (wtorek)
    note: Aby nazwać dzień (Astăzi este luni), użyj formy podstawowej podanej tutaj. Nazwy dni mają też formy z rodzajnikiem — lunea, marțea — które znaczą „w poniedziałki”, „we wtorki”; poznasz je później.
    example_gloss:
    - Dzisiaj jest poniedziałek.
    - Jutro jest wtorek.
  ro.a1.unit03.lesson01.teach.miercuri_joi:
    title: Środa, czwartek
    gloss: miercuri (środa) / joi (czwartek)
    note: Tak jak luni i marți, miercuri i joi mają tę samą formę w liczbie pojedynczej i mnogiej.
    example_gloss:
    - Dziś jest środa.
    - Jutro jest czwartek.
  ro.a1.unit03.lesson01.teach.vineri_sambata:
    title: Piątek, sobota
    gloss: vineri (piątek) / sâmbătă (sobota)
    note: W obecnej pisowni sâmbătă zachowuje â w środku wyrazu, w przeciwieństwie do starszej pisowni sîmbătă.
    example_gloss:
    - Dziś jest piątek.
    - Jutro jest sobota.
  ro.a1.unit03.lesson01.teach.duminica:
    title: niedziela
    gloss: niedziela
    note: Duminică dopełnia tydzień. Aby powiedzieć, jaki jest dzień, użyj tej formy podstawowej; forma z rodzajnikiem duminica znaczy „w niedziele”.
    example_gloss: Dziś jest niedziela.
  ro.a1.unit03.lesson01.teach.ce_zi_e_azi:
    title: Zapytaj, jaki jest dzień
    gloss: Jaki dziś dzień?
    note: Codzienny sposób pytania o dzień tygodnia — zi (dzień) to tutaj nowe słowo, obok znanych już ce, este i astăzi.
  ro.a1.unit03.lesson01.teach.saptamana_ieri:
    title: Tydzień, wczoraj, w zeszłym/przyszłym tygodniu
    gloss: săptămână (tydzień) / ieri (wczoraj) / săptămâna trecută (zeszły tydzień) / săptămâna viitoare (przyszły tydzień)
    note: Dodatkowy zestaw słownictwa, przydatny do mówienia o datach w odniesieniu do teraźniejszości — w ćwiczeniach tej lekcji nie jest ćwiczony tak intensywnie jak same dni tygodnia.
  ro.a1.unit03.lesson01.teach.lowercase_zile:
    title: Dni pisze się małą literą
    gloss: 'Dni tygodnia nie piszemy wielką literą: poniedziałek, piątek.'
    note: Tak samo jak w polskim, rumuńskie nazwy dni tygodnia nie są pisane wielką literą w środku zdania — *luni*, a nie *Luni*, chyba że samo słowo rozpoczyna zdanie.
  ro.a1.unit03.lesson02.teach.ian_feb_mar:
    title: Styczeń, luty, marzec
    gloss: ianuarie (styczeń) / februarie (luty) / martie (marzec)
    note: W przeciwieństwie do nazw dni tygodnia kilka nazw miesięcy łatwo rozpoznać, bo przypominają polskie odpowiedniki (np. martie – marzec, august – sierpień pochodzą z łaciny jak wiele polskich słów).
    example_gloss:
    - Jest styczeń.
    - Jest luty.
    - Jest marzec.
  ro.a1.unit03.lesson02.teach.apr_mai_iun:
    title: Kwiecień, maj, czerwiec
    gloss: aprilie (kwiecień) / mai (maj) / iunie (czerwiec)
    note: Mai (maj) jest krótkie, ale to coś innego niż przysłówek mai (bardziej) używany w innych miejscach kursu (ce mai faci) – kontekst zawsze wyjaśnia, o co chodzi.
    example_gloss:
    - Jest kwiecień.
    - Jest maj.
    - Jest czerwiec.
  ro.a1.unit03.lesson02.teach.iul_aug_sep:
    title: Lipiec, sierpień, wrzesień
    gloss: iulie (lipiec) / august (sierpień) / septembrie (wrzesień)
    note: Nazwa august brzmi i wygląda podobnie jak łacińska nazwa, od której pochodzi, więc łatwo ją rozpoznać, choć po polsku miesiąc ten nazywa się inaczej (sierpień).
    example_gloss:
    - Jest lipiec.
    - Jest sierpień.
    - Jest wrzesień.
  ro.a1.unit03.lesson02.teach.oct_noi_dec:
    title: Październik, listopad, grudzień
    gloss: octombrie (październik) / noiembrie (listopad) / decembrie (grudzień)
    note: Ostatnie trzy miesiące dopełniają listę dwunastu; wszystkie są rzeczownikami o niezmiennej formie.
    example_gloss:
    - Jest październik.
    - Jest listopad.
    - Jest grudzień.
  ro.a1.unit03.lesson02.teach.intai:
    title: Pierwszy (dzień miesiąca)
    gloss: pierwszy
    note: 'To prawdziwa, typowo rumuńska reguła: w standardowej polszczyźnie rumuńskiej pierwszego dnia miesiąca nie mówi się *unu* (zwykłe „jeden”), lecz używa się osobnego słowa *întâi*. (W mowie potocznej można usłyszeć *unu*, ale warto uczyć się formy *întâi*.) Każda inna data, od drugiego dnia wzwyż, używa zwykłej liczby głównej.'
    example_gloss: Dziś jest pierwszy sierpnia.
  ro.a1.unit03.lesson02.teach.date_rule:
    title: Jak po rumuńsku podaje się datę
    gloss: '1: întâi · od 2: zwykła liczba (doi, trei, patru...)'
    note: Po pierwszym dniu miesiąca data to po prostu zwykła liczba główna (znana już z wcześniejszych lekcji) i nazwa miesiąca – bez liczebnika porządkowego i bez dodatkowych słów, np. *trei aprilie* (trzeci kwietnia, dosłownie „trzy kwiecień”).
  ro.a1.unit03.lesson02.teach.ce_data:
    title: Zapytaj o datę
    gloss: Którego dziś mamy?
    note: Dată (data) to tutaj nowe słowo; reszta pytania wykorzystuje ce, este i astăzi dokładnie tak jak pytanie o dzień w lesson01.
  ro.a1.unit03.lesson02.teach.raspuns_data:
    title: Podawanie daty
    gloss: Dziś jest trzeci kwietnia.
    note: Trei (trzy) to liczebnik z Unit 2; nie dodaje się końcówki porządkowej ani żadnego słowa przed aprilie.
  ro.a1.unit03.lesson02.teach.la_multi_ani:
    title: Złóż komuś życzenia z okazji ważnego dnia
    gloss: Sto lat! / Szczęśliwego Nowego Roku!
    note: Dosłownie „(na) wiele lat” – najczęstsze rumuńskie życzenia z okazji urodzin, imienin lub Nowego Roku; zawiera słowo *ani* (lata) z części o wieku w Unit 2.
  ro.a1.unit03.lesson02.teach.lowercase_luni:
    title: Miesiące też pisze się małą literą
    gloss: 'Nazw miesięcy nie pisze się wielką literą: ianuarie, mai.'
    note: Ta sama zasada, co przy nazwach dni tygodnia w lesson01 – rumuńskie nazwy miesięcy w środku zdania pozostają pisane małą literą.
  ro.a1.unit03.lesson03.teach.cand:
    title: Kiedy?
    gloss: kiedy?
    note: Când otwiera pytanie o czas, tak jak polskie „kiedy”.
    example_gloss: Kiedy jest spotkanie?
  ro.a1.unit03.lesson03.teach.intalnirea:
    title: Spotkanie
    gloss: spotkanie
    note: Întâlnirea to forma z rodzajnikiem określonym (to spotkanie) – sam rzeczownik brzmiałby întâlnire.
    example_gloss: Spotkanie jest w poniedziałek.
  ro.a1.unit03.lesson03.teach.cand_e_intalnirea:
    title: Zapytaj, kiedy coś ma miejsce
    gloss: Kiedy jest spotkanie?
    note: Łączy când ze znanym już este i nowym słowem întâlnirea z tej lekcji.
  ro.a1.unit03.lesson03.teach.raspuns_intalnire:
    title: Podaj datę wydarzenia
    gloss: Spotkanie jest w piątek, pierwszego sierpnia.
    note: Dzień tygodnia i datę można podać razem, oddzielone przecinkiem, podobnie jak po polsku.
  ro.a1.unit03.lesson03.teach.fara_de:
    title: Przy dniach i datach nie ma „de”
    gloss: 'Przy dniach i datach nie używa się „de”: vineri, întâi august.'
    note: 'Warto porównać z regułą z Unit 2: liczebniki od 20 wymagają *de* przed zwykłym rzeczownikiem (*treizeci de ani*), ale dzień tygodnia lub data łączą się bezpośrednio, w ogóle bez *de*.'
  ro.a1.unit03.lesson03.teach.line01:
    title: Zapytaj, kiedy jest spotkanie
    gloss: Ana pyta Mihaia, kiedy jest ich spotkanie.
    note: Zwykłe, neutralne pytanie – este nie zmienia się w zależności od tu czy dumneavoastră.
  ro.a1.unit03.lesson03.teach.line02:
    title: Podaj datę
    gloss: Mihai mówi, że spotkanie jest w piątek, pierwszego sierpnia.
    note: 'Mihai używa dokładnie tego samego wzoru daty z lesson02: dzień tygodnia, potem întâi + miesiąc, bez de.'
  ro.a1.unit03.lesson03.teach.line03:
    title: Podziękuj i zakończ rozmowę
    gloss: Ana dziękuje mu i się żegna.
    note: La revedere, poznane w Unit 1, kończy rozmowę tak jak zawsze.
  ro.a1.unit03.lesson03.teach.line04:
    title: Zakończ spotkanie
    gloss: Mihai również się żegna, zwracając się do Any po imieniu.
    note: Powtórzenie la revedere z imieniem rozmówcy to naturalny, przyjazny sposób zakończenia rozmowy.
