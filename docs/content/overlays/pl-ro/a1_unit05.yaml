teaching:
  ro.a1.unit05.lesson01.teach.reminder_am_un_o_si_mare:
    title: 'Powtórka: am, un, o, și, mare'
    gloss: am (mam) · un/o (jakiś/jakaś; rodzajnik nieokreślony) · și (i) · mare (duży)
    note: Wszystkie pięć słów już się pojawiło we wcześniejszych lekcjach (*și* w lekcji 1, *am* i *o* w lekcji 2, *mare* w uwadze o wielkiej literze w lekcji 3, *un* w lekcji 4). Teraz wracają w rozmowie o rodzinie.
  ro.a1.unit05.lesson01.teach.familie:
    title: Rodzina
    gloss: familie (rodzina)
    note: Rzeczownik rodzaju żeńskiego. Z *o* i przymiotnikiem takim jak *mare* oznacza „dużą rodzinę”.
    example_gloss: Mam dużą rodzinę.
  ro.a1.unit05.lesson01.teach.mama:
    title: Matka
    gloss: mamă (matka)
    note: Podstawowe, słownikowe słowo na „matkę”. Jak powiedzieć „moja mama”, zobaczysz na kolejnych kartach.
    example_gloss: Mihai ma mamę i tatę.
  ro.a1.unit05.lesson01.teach.tata:
    title: Ojciec
    gloss: tată (ojciec)
    note: Podstawowe, słownikowe słowo na „ojca”.
    example_gloss: Mój tata jest nauczycielem.
  ro.a1.unit05.lesson01.teach.parintii:
    title: Rodzice
    gloss: părinți (rodzice)
    note: Obejmuje oboje rodziców razem, podobnie jak polskie „rodzice”.
    example_gloss: Moi rodzice mieszkają w Rumunii.
  ro.a1.unit05.lesson01.teach.meu_mea:
    title: 'Mój, moja: meu i mea'
    gloss: meu (mój, r. męski) / mea (moja, r. żeński)
    note: 'Rumuńskie „mój” zgadza się w rodzaju z rzeczą posiadaną, a nie z właścicielem. *Meu* stoi przy rzeczowniku rodzaju męskiego, np. *tată*, a *mea* przy rzeczowniku rodzaju żeńskiego, np. *mamă*. W polskim jest podobnie: mój tata, moja mama.'
  ro.a1.unit05.lesson01.teach.mama_mea:
    title: Moja mama
    gloss: moja matka
    note: Mamă zmienia się w mama (dostaje rodzajnik określony), zanim doda się mea. Właśnie tak naprawdę mówi się „moja mama”; to nie jest tłumaczenie słowo w słowo.
  ro.a1.unit05.lesson01.teach.tatal_meu:
    title: Mój tata
    gloss: mój ojciec
    note: Tată zmienia się w tatăl (dostaje rodzajnik określony, nieregularnie z końcówką -l, bo tată już kończy się na -ă), zanim doda się meu.
  ro.a1.unit05.lesson01.teach.mama_si_tatal:
    title: Moja mama i mój tata
    gloss: Moja mama i mój tata.
    note: Łączy obie formy dzierżawcze w jednym zdaniu, każdą z poprawną zgodnością rodzaju.
  ro.a1.unit05.lesson02.teach.reminder_cati_ai_aveti_doi_nu:
    title: 'Powtórka: câți, ai, aveți, doi, nu'
    gloss: câți (ilu) · ai/aveți (masz/ma Pan/Pani, mają Państwo; nieformalnie/formalnie) · doi (dwóch) · nu (nie)
    note: '*Câți*, *ai* i *aveți* pojawiły się po raz pierwszy w lekcji 2 w pytaniu o wiek („Câți ani ai?”). Tutaj służą do pytania o rodzeństwo i dzieci. *Doi* pochodzi z liczebników z lekcji 2, a *nu* z lekcji 3.'
  ro.a1.unit05.lesson02.teach.da:
    title: Tak
    gloss: da (tak)
    note: Codzienne słowo „tak”, para dla *nu* („nie”) z lekcji 3.
    example_gloss: Tak, mam brata.
  ro.a1.unit05.lesson02.teach.frate_sora:
    title: Brat, siostra
    gloss: frate (brat) / soră (siostra)
    note: Rzeczowniki rodzaju męskiego i żeńskiego oznaczające rodzeństwo. Łączą się z un/o tak samo jak inne rzeczowniki.
    example_gloss:
    - Mam brata.
    - Mam siostrę.
  ro.a1.unit05.lesson02.teach.frati_surori:
    title: Bracia, siostry
    gloss: frați (bracia) / surori (siostry)
    note: Formy liczby mnogiej, używane do pytania o rodzeństwo w ogóle. Rumuni często pytają „Ai frați?” („Masz braci?”), mając na myśli „masz rodzeństwo?”, a potem dodają osobne pytanie „Surori?”, żeby upewnić się co do sióstr.
    example_gloss: Masz braci lub siostry?
  ro.a1.unit05.lesson02.teach.ai_frati:
    title: Masz rodzeństwo? (nieformalnie)
    gloss: Masz braci?
    note: Codzienny, nieformalny sposób pytania. Pasuje do formy *tu* z lekcji 1.
  ro.a1.unit05.lesson02.teach.aveti_frati:
    title: Ma Pan/Pani rodzeństwo? (formalnie)
    gloss: Masz braci?
    note: Uprzejma wersja, z tym samym *aveți*, które padło w pytaniu o wiek w lekcji 2.
  ro.a1.unit05.lesson02.teach.copil_copii:
    title: Dziecko, dzieci
    gloss: copil (dziecko) / copii (dzieci)
    note: 'Copil ma jedną z trudniejszych form liczby mnogiej w rumuńskim: copii, a nie zwykła końcówka -i czy -e. Warto zapamiętać ją osobno.'
    example_gloss: Mam dwoje dzieci.
  ro.a1.unit05.lesson02.teach.fiu_fiica:
    title: Syn, córka
    gloss: fiu (syn) / fiică (córka)
    note: Konkretne słowa na syna i córkę, inne niż ogólne copil/copii.
    example_gloss:
    - Mam syna.
    - Mam córkę.
  ro.a1.unit05.lesson02.teach.cati_copii_ai:
    title: Ile masz dzieci?
    gloss: Ile masz dzieci?
    note: 'Câți (ile) + copii (dzieci) + ai (masz): wszystkie trzy słowa już znasz.'
  ro.a1.unit05.lesson02.teach.casatorit:
    title: Żonaty / zamężna
    gloss: căsătorit (żonaty / zamężna)
    note: Częste pytanie o dane osobiste w codziennej rozmowie, podobnie jak pytanie o wiek.
    example_gloss: Jesteś żonaty / zamężna?
  ro.a1.unit05.lesson03.teach.reminder_bine_la_revedere:
    title: 'Powtórka: bine, la revedere, Ana, Mihai'
    gloss: bine (dobrze) · la revedere (do widzenia) · Ana, Mihai (imiona)
    note: Powtórka słownictwa z wcześniejszych lekcji, użytego ponownie w dialogu z tej lekcji.
  ro.a1.unit05.lesson03.teach.line01:
    title: Pytanie o rodzeństwo
    gloss: Ana pyta Mihaia, czy ma rodzeństwo.
    note: Używa uprzejmego *aveți*, zgodnie z formą, w jakiej rozmawiali dotąd.
  ro.a1.unit05.lesson03.teach.line02:
    title: Odpowiedź i pytanie zwrotne
    gloss: Mihai mówi, że ma brata i siostrę, i pyta, czy Ana ma dzieci.
    note: W jednej wymianie wraca słownictwo frate/soră i copii z tej lekcji.
  ro.a1.unit05.lesson03.teach.line03:
    title: Odpowiedź i zwrot pytania
    gloss: Ana mówi, że ma córkę, i zadaje Mihaiowi to samo pytanie.
    note: '*Și dumneavoastră?* („A Pan/Pani?”) to dokładnie ten sam wzorzec pytania zwrotnego co we wstępnych przedstawieniach z lekcji 1.'
  ro.a1.unit05.lesson03.teach.line04:
    title: Odpowiedź
    gloss: Mihai mówi, że ma syna.
    note: Krótka, bezpośrednia odpowiedź ze słowem fiu z tej lekcji.
  ro.a1.unit05.lesson03.teach.line05:
    title: Reakcja i zakończenie
    gloss: Ana reaguje pozytywnie i żegna się.
    note: '*Bine!* to tutaj krótka pozytywna reakcja, to samo słowo co w *Bine, mulțumesc.* z lekcji 1.'
  ro.a1.unit05.lesson03.teach.line06:
    title: Zakończenie spotkania
    gloss: Mihai również się żegna, zwracając się do Any po imieniu.
    note: Ten sam przyjazny sposób zakończenia, którym kończyły się dialogi z lekcji 1 i 4.
