answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț, with comma-below ș/ț). Typed answers are checked with their diacritics: a spelling without them, or with the older cedilla letters ş/ţ, is accepted only where an exercise lists it explicitly.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the exclamation mark on greetings/farewells. Spoken answers are assessed for intelligibility and appropriate register, not written punctuation.
  register: tu and dumneavoastră are never interchangeable answers for each other's exercises -- a dumneavoastră-register prompt must not accept a tu-conjugated reply and vice versa, the same discipline applied to French tu/vous and Spanish tú/usted elsewhere in this app.
course:
  title: Rumuński A1
  description: Poznaj podstawowe rumuńskie zwroty powitalne i sposoby przedstawiania się. Kurs zwraca szczególną uwagę na różnicę między nieformalnym tu a grzecznościowym dumneavoastră (podobnie jak w polskim ty i Pan/Pani) oraz na dwa codzienne sposoby podania imienia (mă numesc... / mă cheamă...).
units:
  ro.a1.unit01.greetings:
    title: Powitania i pierwsze spotkania
lessons:
  ro.a1.unit01.lesson01.tu_dumneavoastra_greetings:
    title: 'Powitania: tu i dumneavoastră'
  ro.a1.unit01.lesson02.names_introductions:
    title: Jak masz na imię?
  ro.a1.unit01.lesson03.street_meeting:
    title: Spotkanie na ulicy
teaching:
  ro.a1.unit01.lesson01.teach.buna:
    title: Codzienne powitanie
    gloss: cześć; dzień dobry
    note: Bună to codzienne, lekko nieformalne powitanie. Bezpiecznie użyjesz go wobec przyjaciół, rówieśników i w większości swobodnych spotkań w ciągu dnia.
    example_gloss: Cześć, Mihai!
  ro.a1.unit01.lesson01.teach.salut:
    title: Nieformalne powitanie
    gloss: cześć
    note: Salut jest nieformalne i używane między przyjaciółmi i rówieśnikami. Podobnie jak polskie „cześć” może rozpoczynać lub kończyć rozmowę, ale nie jest najlepszym pierwszym wyborem wobec nieznajomej osoby dorosłej.
    example_gloss: Cześć, Ana!
  ro.a1.unit01.lesson01.teach.buna_ziua:
    title: Powitanie formalne
    gloss: dzień dobry (formalnie)
    note: Bună ziua to bezpieczne, grzeczne powitanie wobec nieznajomej osoby dorosłej, sprzedawcy lub każdego, do kogo zwracasz się per dumneavoastră. Dosłownie „dobry dzień”, ale używane jako ogólne grzeczne powitanie, nie tylko w południe.
    example_gloss: Dzień dobry, Ana!
  ro.a1.unit01.lesson01.teach.la_revedere:
    title: Neutralne pożegnanie
    gloss: do widzenia
    note: La revedere pasuje zarówno w sytuacjach oficjalnych, jak i nieformalnych, podobnie jak polskie „do widzenia” w wielu sytuacjach.
    example_gloss: Dzień dobry! Do widzenia!
  ro.a1.unit01.lesson01.teach.tu:
    title: Nieformalne „ty”
    gloss: ty (nieformalnie, liczba pojedyncza)
    note: Polskie „ty” i „Pan/Pani” rozróżniają dystans społeczny, i rumuński robi to podobnie. Tu używasz wobec jednego przyjaciela, dziecka lub osoby, z którą jesteś na „ty”; wymaga ono własnych form czasownika (faci, nie faceți).
  ro.a1.unit01.lesson01.teach.dumneavoastra:
    title: Grzecznościowe lub mnogie „wy”
    gloss: Pan/Pani; wy
    note: Dumneavoastră to bezpieczny wybór wobec jednej nieznajomej osoby dorosłej; służy też do grzecznego zwracania się do grupy. Pochodzi od domnia voastră („wasza wysokość”) i łączy się z formami czasownika w liczbie mnogiej (faceți, numiți), nawet gdy mowa o jednej osobie.
  ro.a1.unit01.lesson01.teach.ce_mai_faceti:
    title: Formalne pytanie o samopoczucie
    gloss: Jak się Pan/Pani miewa?
    note: Faceți to forma dumneavoastră czasownika a face („robić”). To utarte, grzeczne pytanie, a nie dosłowne pytanie o to, co ktoś robi.
  ro.a1.unit01.lesson01.teach.ce_mai_faci:
    title: Nieformalne pytanie o samopoczucie
    gloss: Jak się Pan/Pani miewa?
    note: Faci to forma tu czasownika a face. Między wersją grzeczną a nieformalną tego pytania zmienia się tylko końcówka czasownika, ce mai pozostaje takie samo.
  ro.a1.unit01.lesson01.teach.bine_multumesc:
    title: Standardowa odpowiedź pozytywna
    gloss: Dobrze, dziękuję.
    note: Bine, mulțumesc odpowiada na ce mai faci/faceți niezależnie od rejestru, sama odpowiedź się nie zmienia.
    example_gloss: Co słychać? Dobrze, dziękuję.
  ro.a1.unit01.lesson01.teach.register_choice:
    title: Dopasuj powitanie do relacji
    gloss: Bună ziua z dumneavoastră; Salut z tu
    note: To użyteczne zasady domyślne, a nie absolutne prawa. Bună ziua może też otwierać oficjalną rozmowę, która dalej toczy się per dumneavoastră; połączenie Salut z dumneavoastră zwykle wysyła sprzeczne sygnały społeczne.
  ro.a1.unit01.lesson02.teach.ma_numesc:
    title: Podaj swoje imię (standardowo)
    gloss: Mam na imię Ana.
    note: Mă numesc dosłownie znaczy „nazywam się”. To neutralny sposób podania imienia, odpowiedni wszędzie, podobny rejestrem do polskiego „Nazywam się...”.
    example_gloss: Cześć! Mam na imię Ana.
  ro.a1.unit01.lesson02.teach.cum_va_numiti:
    title: Uprzejme pytanie o imię
    gloss: Jak Pan/Pani ma na imię?
    note: Numiți to forma dumneavoastră czasownika a se numi („nazywać się”). Vă to zaimek zwrotny pasujący do dumneavoastră i jest tu obowiązkowy, tak jak w polskim „się” w pytaniu „Jak się Pan nazywa?”.
  ro.a1.unit01.lesson02.teach.ma_cheama:
    title: Podaj swoje imię (potocznie)
    gloss: Mam na imię Mihai.
    note: Mă cheamă to bardziej potoczny sposób podania imienia, dosłownie „woła mnie”. Zarówno mă numesc, jak i mă cheamă są poprawne i częste; mă cheamă jest nieco bardziej swobodne.
    example_gloss: Cześć! Mam na imię Mihai.
  ro.a1.unit01.lesson02.teach.cum_te_cheama:
    title: Pytanie o imię w formie nieformalnej
    gloss: Jak masz na imię?
    note: Te to zaimek zwrotny pasujący do tu. To codzienny sposób, w jaki przyjaciele i rówieśnicy pytają się o imię.
  ro.a1.unit01.lesson02.teach.imi_pare_bine:
    title: Poznawanie kogoś
    gloss: Miło mi!
    note: 'Îmi pare bine dosłownie znaczy „wydaje mi się dobrze”. To idiomatyczne, stałe wyrażenie, którego nie tłumaczy się słowo w słowo. W przeciwieństwie do polskiego „Miło mi” nie zmienia się jednak w zależności od płci mówiącego (w polskim: „rad/rada” bywa różne).'
    example_gloss: Mam na imię Mihai. Miło mi!
  ro.a1.unit01.lesson02.teach.si_mie_imi_pare_bine:
    title: Odwzajemnienie uczuć
    gloss: Mnie również miło!
    note: Și mie dodaje „też/również” na początku tego samego stałego wyrażenia, którym zaczęła się rozmowa.
  ro.a1.unit01.lesson02.teach.si_dumneavoastra:
    title: Zwrot pytania w formie grzecznościowej
    gloss: A Pan/Pani?
    note: Użyj dumneavoastră, aby zachować grzeczny rejestr lub zwrócić się do grupy.
  ro.a1.unit01.lesson02.teach.si_tu:
    title: Zwrot pytania w formie nieformalnej
    gloss: A Pan/Pani?
    note: Użyj tu po și, gdy nieformalnie mówisz do jednego przyjaciela lub rówieśnika.
  ro.a1.unit01.lesson03.teach.line01:
    title: Rozpoczęcie spotkania
    gloss: Ana wita Mihaia formalnie i podaje swoje imię.
    note: Ana zaczyna grzecznym bună ziua, odpowiednim przy poznawaniu kogoś nieznajomego.
  ro.a1.unit01.lesson03.teach.line02:
    title: Rozpoczęcie spotkania, odpowiedź
    gloss: Mihai odwzajemnia uprzejmość, podaje swoje imię i pyta, co u niej słychać.
    note: 'Mihai zachowuje ten sam grzeczny rejestr, od którego zaczęła Ana: pyta ce mai faceți, a nie ce mai faci.'
  ro.a1.unit01.lesson03.teach.line03:
    title: Odpowiedz i zadaj pytanie zwrotne
    gloss: Ana mówi, że u niej dobrze, i grzecznie zadaje Mihaiowi to samo pytanie.
    note: Și dumneavoastră utrzymuje rozmowę w formalnym tonie, zgodnie z jej początkiem.
  ro.a1.unit01.lesson03.teach.line04:
    title: Odpowiedz i zakończ rozmowę
    gloss: Mihai mówi, że u niego też dobrze, i żegna się.
    note: La revedere to neutralne pożegnanie, pasujące zarówno do rozmowy formalnej, jak i nieformalnej.
  ro.a1.unit01.lesson03.teach.line05:
    title: Zakończ spotkanie
    gloss: Ana odpowiada tym samym pożegnaniem.
    note: Powtórzenie la revedere to naturalny sposób na potwierdzenie przyjaznego zakończenia rozmowy.
exercises:
  ro.a1.unit01.lesson01.exercise01.listen_buna:
    instruction: Posłuchaj i wybierz wyrażenie, które słyszysz.
    correct_option: Bună!
    distractors:
    - Salut!
    - La revedere!
    accepted_answers:
    - Bună!
    - Bună
  ro.a1.unit01.lesson01.exercise02.choose_informal_pronoun:
    instruction: Który zaimek pasuje do tego nieformalnego powitania?
    correct_option: tu
    distractors:
    - dumneavoastră
    accepted_answers:
    - tu
    feedback: Salut i tu tworzą spójne, nieformalne połączenie.
  ro.a1.unit01.lesson01.exercise04.order_polite_question:
    instruction: Ułóż w odpowiedniej kolejności grzeczne pytanie o samopoczucie.
    correct_response:
    - Ce
    - mai
    - faceți
  ro.a1.unit01.lesson01.exercise06.match_register:
    instruction: Dopasuj każde powitanie do jego zwykłego rejestru na poziomie początkującym.
    correct_response:
      Bună ziua: dumneavoastră
      Salut: ty
    pairs:
    - left: Bună ziua
      right: dumneavoastră
    - left: Salut
      right: ty
  ro.a1.unit01.lesson01.exercise03.choose_polite_pronoun:
    instruction: Uzupełnij powitanie skierowane do jednej nieznajomej dorosłej osoby.
    accepted_answers:
    - dumneavoastră
    feedback: Dumneavoastră to bezpieczny, pełen szacunku wybór wobec nieznajomej osoby dorosłej.
  ro.a1.unit01.lesson01.exercise05.listen_informal_question:
    instruction: Wpisz nieformalne pytanie, które słyszysz.
    accepted_answers:
    - Ce mai faci?
    - Ce mai faci
  ro.a1.unit01.lesson01.exercise07.complete_farewell:
    instruction: Uzupełnij neutralne pożegnanie.
    accepted_answers:
    - revedere
  ro.a1.unit01.lesson01.exercise08.speak_greeting:
    instruction: Użyj grzecznego powitania, zapytaj rozmówcę, jak się czuje, i zakończ rozmowę.
    accepted_answers:
    - Bună ziua. Ce mai faceți? La revedere.
    - Bună ziua, ce mai faceți? La revedere.
  ro.a1.unit01.lesson02.exercise02.listen_name_question:
    instruction: Posłuchaj i wybierz grzeczne pytanie o imię.
    correct_option: Cum vă numiți?
    distractors:
    - Cum te cheamă?
    - Ce mai faceți?
    accepted_answers:
    - Cum vă numiți?
    - Cum va numiti?
  ro.a1.unit01.lesson02.exercise05.choose_reply_meaning:
    instruction: Co znaczy odpowiedź Mihaia?
    correct_option: Miło mi!
    distractors:
    - Do widzenia!
    - Jak się Pan/Pani miewa?
    accepted_answers:
    - Miło mi!
  ro.a1.unit01.lesson02.exercise01.order_self_intro:
    instruction: Ułóż zdanie, którym Ana się przedstawia.
    correct_response:
    - Mă
    - numesc
    - Ana
  ro.a1.unit01.lesson02.exercise07.match_introductions:
    instruction: Dopasuj do każdego pytania o imię pasującą odpowiedź.
    correct_response:
      Cum vă numiți?: Mă numesc Ana.
      Cum te cheamă?: Mă cheamă Mihai.
    pairs:
    - left: Cum vă numiți?
      right: Mă numesc Ana.
    - left: Cum te cheamă?
      right: Mă cheamă Mihai.
  ro.a1.unit01.lesson02.exercise03.informal_name_question:
    instruction: Po nieformalnym powitaniu zapytaj drugą osobę o imię.
    accepted_answers:
    - Cum te cheamă?
    - Cum te cheama?
  ro.a1.unit01.lesson02.exercise04.complete_ma_cheama:
    instruction: Uzupełnij wyrażenie podające imię Mihaia.
    accepted_answers:
    - Mă
  ro.a1.unit01.lesson02.exercise06.return_polite_question:
    instruction: Zadaj to samo pytanie, nie zmieniając grzecznego rejestru.
    accepted_answers:
    - Și dumneavoastră?
    - Si dumneavoastra?
  ro.a1.unit01.lesson02.exercise08.write_introduction:
    instruction: 'Jesteś Aną. Napisz: przywitaj się słowem Bună, podaj imię za pomocą mă numesc, a potem powiedz „Miło mi”.'
    accepted_answers:
    - Bună. Mă numesc Ana. Îmi pare bine.
    - Buna. Ma numesc Ana. Imi pare bine.
  ro.a1.unit01.lesson03.exercise01.role_selection:
    instruction: Która osoba w dialogu podaje swoje imię za pomocą tego wyrażenia?
    correct_option: Ana
    distractors:
    - Mihai
    - Żadna z osób
    accepted_answers:
    - Ana
  ro.a1.unit01.lesson03.exercise02.comprehend_register:
    instruction: Jakiego zaimka używają wobec siebie Ana i Mihai?
    correct_option: dumneavoastră
    distractors:
    - ty
    - te
    accepted_answers:
    - dumneavoastră
  ro.a1.unit01.lesson03.exercise03.comprehend_names:
    instruction: Kto używa mă numesc, a kto mă cheamă?
    correct_option: Ana uses mă numesc; Mihai uses mă cheamă.
    distractors:
    - Mihai uses mă numesc; Ana uses mă cheamă.
    - Obie osoby używają mă numesc.
    accepted_answers:
    - Ana uses mă numesc; Mihai uses mă cheamă.
    - Ana; Mihai
  ro.a1.unit01.lesson03.exercise05.order_closing:
    instruction: Ułóż końcową odpowiedź i pożegnanie.
    correct_response:
    - Bine,
    - mulțumesc.
    - La
    - revedere!
  ro.a1.unit01.lesson03.exercise04.role_response:
    instruction: Wciel się w Anę. Odpowiedz grzecznie i zadaj pytanie zwrotne.
    accepted_answers:
    - Bine, mulțumesc. Și dumneavoastră?
    - Bine, multumesc. Si dumneavoastra?
  ro.a1.unit01.lesson03.exercise06.speak_role:
    instruction: Wciel się w Anę. Przywitaj się formalnie z Mihaiem, podaj swoje imię, odpowiedz na jego powitanie i zakończ spotkanie.
    accepted_answers:
    - Bună ziua. Mă numesc Ana. Îmi pare bine! La revedere!
    - Buna ziua. Ma numesc Ana. Imi pare bine! La revedere!
    - Bună ziua. Mă numesc Ana. Și mie îmi pare bine! La revedere!
  ro.a1.unit01.lesson01.exercise09.dictation_buna:
    instruction: Wpisz to, co słyszysz.
    correct_option: Bună
    accepted_answers:
    - value: Bună
      status: correct
    orthography_strict: true
