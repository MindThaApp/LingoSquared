teaching:
  ro.a1.unit28.lesson01.teach.a_suna:
    title: Dzwonić
    gloss: dzwonić
    note: Bezokolicznik czasownika oznaczającego telefonowanie.
    example_gloss: Muszę do ciebie zadzwonić.
  ro.a1.unit28.lesson01.teach.te_sun:
    title: Mówimy, że zadzwonimy
    gloss: Zadzwonię do ciebie.
    note: '*Sun* to forma *eu* czasownika *a suna* (dzwonić); *te* („cię”) stoi przed czasownikiem, a rumuński używa tu czasu teraźniejszego tam, gdzie po polsku powiemy „zadzwonię”.'
  ro.a1.unit28.lesson01.teach.alo_sunt_ana:
    title: Odbieranie telefonu
    gloss: Halo, mówi Ana.
    note: '*Alo* mówi się, odbierając telefon; *sunt* + imię (dosłownie „jestem…”) podaje, kto mówi.'
  ro.a1.unit28.lesson01.teach.alo_sunt_mihai:
    title: Mihai odbiera tak samo
    gloss: Halo, mówi Mihai.
    note: Ten sam wzór *Alo, sunt* + imię co w *Alo, sunt Ana*.
  ro.a1.unit28.lesson02.teach.cu_cine_vorbesc:
    title: Pytanie, kto dzwoni
    gloss: Z kim rozmawiam?
    note: '*Cu cine vorbesc?* (dosłownie „z kim rozmawiam?”) to standardowy sposób zapytania, kim jest nieznany rozmówca.'
  ro.a1.unit28.lesson02.teach.vorbiti_cu_ana:
    title: Przedstawianie się oficjalnie
    gloss: Rozmawia Pan/Pani z Aną.
    note: '*Vorbiți cu* + imię to odpowiedź grzecznościowa: *vorbiți* to forma *dumneavoastră* czasownika *a vorbi* (mówić, rozmawiać).'
  ro.a1.unit28.lesson03.teach.poti_sa_repeti:
    title: Prośba o powtórzenie
    gloss: Możesz to powtórzyć?
    note: '*Poți să* ... (Czy możesz ...?) plus *repeți* (powtarzasz) plus *asta* (to).'
  ro.a1.unit28.lesson03.teach.nu_vorbi_atat:
    title: Prośba o wolniejsze mówienie
    gloss: Nie mów tak szybko, proszę.
    note: '*Nu vorbi* („nie mów”) to *nu* + forma *tu*; *atât de repede* znaczy „tak szybko”.'
  ro.a1.unit28.lesson03.teach.nu_te_aud:
    title: Mówimy, że słabo słychać
    gloss: Słabo cię słyszę.
    note: '*Nu te aud bine*: *aud* to „słyszę”, *te* („cię”) stoi przed czasownikiem, a *bine* znaczy „dobrze”.'
  ro.a1.unit28.lesson04.teach.mesajul:
    title: SMS
    gloss: wiadomość tekstowa
    note: '*Mesaj* jest rodzaju męskiego w liczbie pojedynczej, a w mnogiej żeńskiego (*un mesaj*, *două mesaje*); rodzajnik określony dołącza się na końcu: *mesajul*.'
    example_gloss: SMS jest od Any.
  ro.a1.unit28.lesson04.teach.iti_trimit_un:
    title: Zapowiedź wysłania wiadomości
    gloss: Wyślę ci SMS-a.
    note: '*Îți* („ci”, „tobie”) to zaimek w celowniku stojący przed czasownikiem: *Îți trimit un mesaj*.'
  ro.a1.unit28.lesson04.teach.te_sun_inapoi:
    title: Zapowiedź oddzwonienia
    gloss: Zadzwonię do ciebie później.
    note: '*Înapoi* („z powrotem”) stoi po czasowniku: *te sun înapoi* znaczy „oddzwonię do ciebie”, a *mai târziu* znaczy „później”.'
  ro.a1.unit28.lesson05.teach.mihai_salut_ana:
    title: Przeczytaj wymianę wiadomości
    gloss: 'Mihai: Cześć, Ana, możesz do mnie zadzwonić? Muszę ci coś powiedzieć. Ana: Tak, jasne, oddzwonię za pięć minut.'
    note: Zwróć uwagę, o co prosi Mihai, dlaczego i kiedy Ana mówi, że oddzwoni.
    glosses:
      Salut: cześć
      poți: możesz
      suna: zadzwonić
      Trebuie: muszę
      ceva: coś
      spun: opowiedzieć, powiedzieć
      sigur: jasne
      sun: zadzwonić
      cinci: pięć
      minute: minuty
      înapoi: z powrotem
  ro.a1.unit28.lesson06.teach.mihai_alo_sunt:
    title: Mihai odbiera telefon
    gloss: 'Mihai: Halo, mówi Mihai.'
    note: 'Ten sam wzór *Alo, sunt* + imię z lekcji 1, teraz w prawdziwej rozmowie: osoba, która odbiera, odzywa się pierwsza i podaje imię.'
  ro.a1.unit28.lesson06.teach.ana_salut_mihai:
    title: Ana się przedstawia
    gloss: 'Ana: Cześć, Mihai, tu Ana. Mihai: Jak dobrze, że dzwonisz!'
    note: '*Ce bine că* ... („jak dobrze, że ...”) wyraża pozytywną reakcję na zdarzenie; *suni* to forma *tu* czasownika *a suna*.'
  ro.a1.unit28.lesson06.teach.ana_cum_a:
    title: Ana pyta o zmianę
    gloss: 'Ana: Jak minęła twoja pierwsza zmiana?'
    note: '*A fost* znaczy „był/była/było” (czas przeszły od *a fi*). To perfect compus, zbudowany jak *am mâncat*; zobacz uwagę po następnej kwestii.'
  ro.a1.unit28.lesson06.teach.mihai_a_mers:
    title: Mihai donosi dobre wieści
    gloss: 'Mihai: Poszła bardzo dobrze, lepiej, niż myślałem.'
    note: '*A mers* to czas przeszły od *a merge* (iść, tu „układać się, iść”); *credeam* znaczy „myślałem” (przeszła forma od *a crede*).'
  ro.a1.unit28.lesson06.teach.a_fost_a:
    title: 'Formy przeszłe: a fost, a mers, credeam'
    gloss: był → a fi, poszło → a merge, myślałem → a crede
    note: '*A fost* i *a mers* to formy perfect compus (*a* + imiesłów), a *credeam* to imperfect. Na razie zapamiętaj je jako stałe zwroty w kontekstach z tej lekcji; pełne zasady czasu przeszłego pojawią się na wyższym poziomie.'
  ro.a1.unit28.lesson06.teach.ana_ma_bucur:
    title: Ana jest dumna
    gloss: 'Ana: Cieszę się, że to słyszę! Jestem z ciebie dumna.'
    note: '*Mândră de* („dumna z”) to stałe połączenie; *de* jest obowiązkowe. Mężczyzna mówi *mândru*.'
  ro.a1.unit28.lesson06.teach.mihai_iti_multumesc:
    title: Mihai jest wzruszony
    gloss: 'Mihai: Dziękuję, to wiele dla mnie znaczy.'
    note: '*Înseamnă* to forma 3. osoby od *a însemna* (znaczyć); *pentru mine* („dla mnie”) mówi, dla kogo to ważne.'
  ro.a1.unit28.lesson06.teach.prima_lui_tura:
    title: Jego
    gloss: Jego pierwsza zmiana poszła bardzo dobrze.
    note: '*Lui* po rzeczowniku znaczy „jego”: *prima lui tură*. (Dla „jej” jest *ei*.)'
