answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț, with comma-below ș/ț). Typed answers are checked with their diacritics: a spelling without them, or with the older cedilla letters ş/ţ, is accepted only where an exercise lists it explicitly, matching units 01/02/03''s policy.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the question mark/exclamation mark.
  register: No new register-sensitive forms in this unit -- este (is) is invariant regardless of tu/dumneavoastră, and Ana and Mihai's closing dialogue keeps the dumneavoastră register unit01 already established between them.
course:
  title: Rumuński A1
  description: 'Jak pytać o godzinę i jak jej udzielać po rumuńsku: pełne godziny, wpół do, kwadrans po i kwadrans do, pory dnia oraz pytanie o to, kiedy coś się zaczyna. Dalszy ciąg historii Any i Mihaia, którzy ustalają, kiedy zaczyna się ich kurs rumuńskiego.'
units:
  ro.a1.unit04.time:
    title: Podawanie godziny
lessons:
  ro.a1.unit04.lesson01.ora_fixa_si_jumatate:
    title: Pełna godzina i wpół do
  ro.a1.unit04.lesson02.sferturi_si_intrebari:
    title: Kwadrans i jak pytamy o godzinę
  ro.a1.unit04.lesson03.cand_incepe_cursul:
    title: Kiedy zaczyna się kurs?
teaching:
  ro.a1.unit04.lesson01.teach.este:
    title: 'Przypomnienie: este'
    gloss: jest
    note: '*Este* pojawiło się już w Unit 2 i Unit 3. Pozostaje dokładnie takim samym słowem, niezależnie od tego, czy podajesz liczbę, dzień, datę, czy teraz godzinę.'
  ro.a1.unit04.lesson01.teach.ora:
    title: Godzina
    gloss: godzina
    note: Rzeczownik rodzaju żeńskiego – *ora* stawia się tuż przed liczbą, aby podać godzinę na zegarze, np. *ora unu* (pierwsza).
    example_gloss: Jest pierwsza.
  ro.a1.unit04.lesson01.teach.ora_unu:
    title: Pierwsza
    gloss: pierwsza (godzina)
    note: Dosłownie „godzina jeden” – najpierw stoi ora, potem liczba.
  ro.a1.unit04.lesson01.teach.ora_doua:
    title: Druga
    gloss: druga (godzina)
    note: Liczba przyjmuje tu formę żeńską *două*, zgodną z rzeczownikiem żeńskim *ora* – pełny schemat znajdziesz na następnej karcie.
  ro.a1.unit04.lesson01.teach.ora_gender_note:
    title: 'Prawdziwa nieregularność: unu zostaje unu'
    gloss: ora unu (nie „ora una”) / ora două (nie „ora doi”)
    note: Liczebniki mające formę żeńską zwykle przyjmują ją z rzeczownikiem żeńskim (*doi* → *două* przy rzeczowniku żeńskim takim jak *ora*), ale *unu* jest jedynym wyjątkiem w podawaniu godziny – zawsze mówi się *ora unu*, nigdy *ora una*, mimo że *ora* jest rodzaju żeńskiego.
  ro.a1.unit04.lesson01.teach.ora_trei:
    title: Trzecia
    gloss: trzecia (godzina)
    note: Trei w ogóle nie zmienia formy w zależności od rodzaju, w przeciwieństwie do unu/una czy doi/două – jedna rzecz mniej do zapamiętania.
  ro.a1.unit04.lesson01.teach.jumatate:
    title: Pół
    gloss: pół
    note: 'Używane z și (i), aby powiedzieć „wpół do”: X și jumătate, czyli dosłownie „X i pół”.'
    example_gloss: Pierwsza trzydzieści.
  ro.a1.unit04.lesson01.teach.ora_unu_jumatate:
    title: Pierwsza trzydzieści
    gloss: Jest pierwsza trzydzieści.
    note: Dosłownie „jest jeden i pół” – po rumuńsku liczy się od godziny, która minęła, a nie „pół do następnej”, jak w polskim „wpół do drugiej”.
  ro.a1.unit04.lesson01.teach.cat_e_ora:
    title: Pytanie o godzinę
    gloss: Która jest godzina?
    note: Codzienny sposób pytania o godzinę – cât (ile, pokrewne câți z Unit 2) + este + ora (godzina).
  ro.a1.unit04.lesson02.teach.sfert:
    title: Kwadrans
    gloss: kwadrans
    note: Kwadrans, czyli 15 minut. Łączy się z și (i) lub fără (bez), aby powiedzieć „kwadrans po” lub „kwadrans do”.
    example_gloss: Jest kwadrans po pierwszej.
  ro.a1.unit04.lesson02.teach.sfert_rule:
    title: și a fără przy kwadransie
    gloss: și un sfert = +15 minut · fără un sfert = −15 minut
    note: '*Și* (i) dodaje minuty do godziny, która właśnie minęła, a *fără* (bez) odlicza minuty wstecz od godziny, która dopiero nadejdzie – podobnie jak po polsku „kwadrans po” i „kwadrans do”.'
  ro.a1.unit04.lesson02.teach.ora_doua_sfert:
    title: Kwadrans po drugiej
    gloss: Jest kwadrans po drugiej.
    note: Ora două (2:00) plus și un sfert (+15 minut) = 2:15.
  ro.a1.unit04.lesson02.teach.fara:
    title: Bez / do
    gloss: bez
    note: Odlicza minuty wstecz od NASTĘPNEJ godziny – pełni tę samą rolę co polskie „do” w wyrażeniu „kwadrans do trzeciej”.
    example_gloss: Jest kwadrans do trzeciej.
  ro.a1.unit04.lesson02.teach.ora_trei_fara_sfert:
    title: Kwadrans do trzeciej
    gloss: Jest kwadrans do trzeciej.
    note: Ora trei (3:00) minus fără un sfert (−15 minut) = 2:45 – po rumuńsku podaje się godzinę, do której się odlicza, a nie tę, która właśnie minęła.
  ro.a1.unit04.lesson02.teach.la_ce_ora:
    title: Zapytaj o godzinę wydarzenia
    gloss: O której godzinie?
    note: La (o, na) + ce (jaki) + oră (godzina, tu w formie nieokreślonej, a nie ora) – codzienny sposób pytania, o której godzinie coś się dzieje.
  ro.a1.unit04.lesson02.teach.la_ora_noua:
    title: Podaj, kiedy coś się dzieje
    gloss: O dziewiątej.
    note: La (o) + ora (godzina, tu w formie określonej) + liczba – schemat odpowiedzi na pytanie „La ce oră?”.
  ro.a1.unit04.lesson02.teach.tarziu:
    title: Spóźniony
    gloss: późno
    note: Przydatne, częste słowo, którym reagujemy, gdy sprawdzamy godzinę.
    example_gloss: Już późno!
  ro.a1.unit04.lesson03.teach.cand:
    title: 'Przypomnienie: când'
    gloss: kiedy?
    note: Când pojawiło się już w Unit 3 w pytaniu o termin wydarzenia – tu wraca w pytaniu o to, kiedy coś się zaczyna.
  ro.a1.unit04.lesson03.teach.zi_parts:
    title: Pory dnia
    gloss: rano / po południu / wieczorem / w nocy
    note: Każde z tych słów to forma określona rzeczownika użyta przysłówkowo – po rumuńsku mówi się „rano” po prostu tą formą, bez dodatkowego przyimka.
    example_gloss:
    - Kurs jest rano.
    - Kurs jest po południu.
    - Mihai pracuje wieczorem.
    - Ana śpi w nocy.
  ro.a1.unit04.lesson03.teach.cursul:
    title: Kurs
    gloss: kurs
    note: Forma określona od curs (kurs, zajęcia) – tu chodzi o kurs rumuńskiego Any i Mihaia.
    example_gloss: Kurs zaczyna się o dziewiątej.
  ro.a1.unit04.lesson03.teach.incepe:
    title: Zaczyna się
    gloss: zaczyna się
    note: Forma czasu teraźniejszego dla on, ona, ono – każdego podmiotu w liczbie pojedynczej innego niż ja i ty, np. cursul (kurs).
    example_gloss: Kurs zaczyna się rano.
  ro.a1.unit04.lesson03.teach.cand_incepe_cursul:
    title: Zapytaj, kiedy zaczyna się kurs
    gloss: Kiedy zaczyna się kurs?
    note: 'Łączy când z nowymi słowami z tej lekcji: începe i cursul.'
  ro.a1.unit04.lesson03.teach.raspuns_curs:
    title: Powiedz, kiedy zaczyna się kurs
    gloss: Kurs zaczyna się o dziewiątej rano.
    note: Okolicznik (dimineața) dodany na końcu po przecinku – tak samo jak w Unit 3 dodawało się datę po dniu tygodnia.
  ro.a1.unit04.lesson03.teach.line01:
    title: Zapytaj, kiedy zaczyna się kurs
    gloss: Ana pyta Mihaia, kiedy zaczyna się kurs.
    note: Zwykłe, neutralne pytanie – este i începe nie zmieniają się w zależności od tu czy dumneavoastră.
  ro.a1.unit04.lesson03.teach.line02:
    title: Podaj godzinę
    gloss: Mihai mówi, że kurs zaczyna się o dziewiątej rano.
    note: 'Mihai używa dokładnie schematu z tej lekcji: godzina i pora dnia.'
  ro.a1.unit04.lesson03.teach.line03:
    title: Podziękuj i zakończ rozmowę
    gloss: Ana dziękuje mu i się żegna.
    note: La revedere, poznane w Unit 1, kończy rozmowę tak samo jak zawsze.
  ro.a1.unit04.lesson03.teach.line04:
    title: Zakończ spotkanie
    gloss: Mihai również się żegna, zwracając się do Any po imieniu.
    note: Powtórzenie la revedere z imieniem rozmówcy to naturalny, przyjazny sposób zakończenia rozmowy.
