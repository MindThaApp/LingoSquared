teaching:
  ro.a1.unit09.lesson01.teach.reminder_unde_este_locuri:
    title: 'Przypomnienie: unde, este, gară, magazin, bancă, aproape'
    gloss: unde (gdzie) · este (jest) · gară (dworzec) · magazin (sklep) · bancă (bank) · aproape (blisko)
    note: Wszystko to już znasz – unde od lekcji 7, este od lekcji 3 i 4, gară/magazin/bancă/aproape od lekcji 8 – tutaj łączą się w pytania o drogę i przykłady z tej lekcji.
  ro.a1.unit09.lesson01.teach.cum_pot_sa_ajung:
    title: Jak mogę dojść do...?
    gloss: Cum pot să ajung...? (Jak mogę dojść do...?)
    note: Codzienny sposób zapytania, jak dotrzeć do jakiegoś miejsca – *pot* (mogę) pojawiło się już w *Unde pot să cumpăr...?* z lekcji 7; *ajung* (docieram) jest nowe.
  ro.a1.unit09.lesson01.teach.mergeti_vocab:
    title: Proszę iść
    gloss: Mergeți (proszę iść – forma grzecznościowa)
    note: '*Mergeți* to forma rozkazująca w rejestrze dumneavoastră – uprzejmy sposób, by powiedzieć komuś, żeby poszedł; tak właśnie Ana i Mihai zwracają się już do siebie.'
    example_gloss:
    - Proszę iść prosto.
  ro.a1.unit09.lesson01.teach.inainte_vocab:
    title: Prosto
    gloss: înainte (prosto)
    note: Razem z *Mergeți* tworzy najprostszą możliwą wskazówkę.
    example_gloss:
    - Proszę iść prosto.
  ro.a1.unit09.lesson01.teach.mergeti_inainte_phrase:
    title: Idź prosto
    gloss: Mergeți înainte. (Proszę iść prosto.)
    note: Krótka, pełna wskazówka – najprostsza odpowiedź na *Cum pot să ajung...?*
  ro.a1.unit09.lesson01.teach.cum_ajung_gara:
    title: Jak mogę dojść na dworzec?
    gloss: Cum pot să ajung la gară? (Jak mogę dojść na dworzec?)
    note: 'Łączy *Cum pot să ajung...?* i *gară* w jedno pełne pytanie – *la* („do”, „na”) łączy pytanie z celem. Po *la* rzeczownik zachowuje zwykłą formę: *la gară*, a nie *la gara*.'
  ro.a1.unit09.lesson01.teach.cum_ajung_banca:
    title: Jak mogę dojść do banku?
    gloss: Cum pot să ajung la bancă? (Jak mogę dojść do banku?)
    note: Ten sam wzorzec, tym razem z bankiem – to naturalne pytanie, skoro w Lekcji 8 ustaliliśmy, że bank jest daleko.
  ro.a1.unit09.lesson02.teach.dreapta_stanga_vocab:
    title: W prawo, w lewo
    gloss: la dreapta (w prawo) · la stânga (w lewo)
    note: 'Dwa podstawowe skręty – naucz się każdego jako stałej pary z *la* (do): *la dreapta*, *la stânga*.'
    example_gloss:
    - Proszę iść w prawo.
    - Proszę iść w lewo.
  ro.a1.unit09.lesson02.teach.mergeti_dreapta_phrase:
    title: Proszę iść w prawo
    gloss: Mergeți la dreapta. (Proszę iść w prawo.)
    note: To samo polecenie *Mergeți* co w *Mergeți înainte.*, tylko teraz ze skrętem zamiast jazdy prosto.
  ro.a1.unit09.lesson02.teach.mergeti_stanga_phrase:
    title: Proszę iść w lewo
    gloss: Mergeți la stânga. (Proszę iść w lewo.)
    note: Skręt w przeciwną stronę – ten sam prosty wzorzec.
  ro.a1.unit09.lesson02.teach.aici_acolo_vocab:
    title: Tutaj, tam
    gloss: aici (tutaj) · acolo (tam)
    note: Prosty sposób, by wskazać, gdzie coś jest, gdy już dotarłeś na miejsce albo to widzisz. To coś innego niż aproape/departe z Lekcji 8, które opisują odległość, a nie położenie.
    example_gloss:
    - Sklep jest tutaj.
    - Dworzec jest tam.
  ro.a1.unit09.lesson02.teach.magazinul_aici_phrase:
    title: Sklep jest tutaj
    gloss: Magazinul este aici. (Sklep jest tutaj.)
    note: Krótka, pełna wypowiedź – *aici* wskazuje miejsce, w którym jesteś.
  ro.a1.unit09.lesson02.teach.gara_acolo_phrase:
    title: Dworzec jest tam
    gloss: Gara este acolo. (Dworzec jest tam.)
    note: '*Acolo* wskazuje coś widocznego, ale nie tuż przy tobie – to naturalne zakończenie wskazówek dojścia.'
  ro.a1.unit09.lesson03.teach.reminder_buna_multumesc_la_revedere_da:
    title: 'Powtórka: bună, mulțumesc, la revedere, da, Ana, Mihai'
    gloss: bună (cześć) · mulțumesc (dziękuję) · la revedere (do widzenia) · da (tak) · Ana, Mihai (imiona)
    note: Wszystko to już znasz z wcześniejszych lekcji – tutaj Ana pyta Mihaia o drogę.
  ro.a1.unit09.lesson03.teach.apoi:
    title: Potem
    gloss: apoi (potem / następnie)
    note: Łączy dwa kroki wskazówek w jedno polecenie – naturalny sposób, by podać kilka kroków naraz.
    example_gloss:
    - Proszę iść prosto, potem w prawo.
  ro.a1.unit09.lesson03.teach.line01:
    title: Przywitaj się i zapytaj, jak dojść na dworzec
    gloss: Ana wita się z Mihaiem i pyta, jak dojść na dworzec.
    note: Łączy *Cum pot să ajung* z tej lekcji z powitaniem z Lekcji 1.
  ro.a1.unit09.lesson03.teach.line02:
    title: Podaj dwa kroki wskazówek
    gloss: Mihai mówi, żeby iść prosto, a potem w prawo.
    note: Wykorzystuje *Mergeți înainte* i *la dreapta* z tej lekcji, połączone przez *apoi*.
  ro.a1.unit09.lesson03.teach.line03:
    title: Zapytaj, czy to blisko
    gloss: Ana pyta, czy dworzec jest blisko.
    note: Krótkie pytanie dodatkowe, w którym wracają *este* i *aproape* z Lekcji 8.
  ro.a1.unit09.lesson03.teach.line04:
    title: Potwierdź i wskaż miejsce
    gloss: Mihai potwierdza, że jest blisko, i wskazuje, że dworzec jest tam.
    note: Łączy *aproape* i *acolo* – odległość i położenie – w jednej wypowiedzi.
  ro.a1.unit09.lesson03.teach.line05:
    title: Podziękuj i zakończ
    gloss: Ana dziękuje Mihaiowi i żegna się z nim.
    note: To samo podziękowanie na zakończenie, które było w dialogach z Lekcji 1 i 8.
  ro.a1.unit09.lesson03.teach.line06:
    title: Zakończ rozmowę
    gloss: Mihai również się żegna, zwracając się do Any po imieniu.
    note: Ten sam przyjazny sposób zakończenia, którym kończyły się dialogi z Lekcji 1, 5, 6, 7 i 8.
