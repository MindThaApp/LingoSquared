teaching:
  ro.a1.unit13.lesson01.teach.reminder_cafea_ceai_paine:
    title: 'Przypomnienie: cafea, ceai, pâine'
    gloss: cafea (kawa) · ceai (herbata) · pâine (chleb)
    note: 'Wszystkie te słowa poznałeś/poznałaś już w lekcji 6 – tutaj łączą się z nową gramatyką tej lekcji: lubieniem i nielubieniem.'
  ro.a1.unit13.lesson01.teach.imi_place_vocab:
    title: lubię
    gloss: Îmi place (lubię)
    note: Dosłownie „mi się podoba” – *îmi* (mi) plus niezmienne *place* (podoba się). Mówiąc o lubieniu czegoś w ogóle, po rumuńsku używa się formy określonej rzeczownika (*cafeaua*, a nie zwykłe *cafea* znane z lekcji 6), podczas gdy po polsku mówimy po prostu „lubię kawę”, bez żadnego takiego znacznika.
    example_gloss:
    - Lubię kawę.
  ro.a1.unit13.lesson01.teach.imi_place_cafeaua_phrase:
    title: Lubię kawę
    gloss: Îmi place cafeaua. (Lubię kawę.)
    note: 'Pełny wzór: Îmi place + rzeczownik w formie określonej.'
  ro.a1.unit13.lesson01.teach.imi_place_ceaiul_phrase:
    title: Lubię herbatę
    gloss: Îmi place ceaiul. (Lubię herbatę.)
    note: Ten sam wzór co w *Îmi place cafeaua*, tylko z innym napojem – *ceaiul* to forma określona znanego już z lekcji 6 słowa *ceai*.
  ro.a1.unit13.lesson01.teach.numi_place_vocab:
    title: nie lubię
    gloss: Nu-mi place (nie lubię)
    note: Przeczenie od *Îmi place* – w mowie potocznej *nu îmi* ściąga się do *nu-mi*, więc ta forma z łącznikiem to naturalny sposób wypowiedzi, a nie tylko skrót.
    example_gloss:
    - Nie lubię chleba.
  ro.a1.unit13.lesson01.teach.numi_place_painea_phrase:
    title: Nie lubię chleba
    gloss: Nu-mi place pâinea. (Nie lubię chleba.)
    note: '*Pâinea* to forma określona znanego już z lekcji 6 słowa *pâine*, według tego samego wzoru co *cafeaua*/*ceaiul*.'
  ro.a1.unit13.lesson02.teach.reminder_imi_place_numi_place:
    title: 'Przypomnienie: Îmi place, Nu-mi place'
    gloss: Îmi place (lubię) · Nu-mi place (nie lubię)
    note: Oba z pierwszej części tej lekcji – tutaj dochodzi do nich forma pytająca.
  ro.a1.unit13.lesson02.teach.reminder_cafeaua_ceaiul_painea:
    title: 'Przypomnienie: cafeaua, ceaiul, pâinea'
    gloss: cafeaua (kawa) · ceaiul (herbata) · pâinea (chleb)
    note: Wszystkie z pierwszej części tej lekcji – tutaj wracają w pytaniach i w wyrażaniu preferencji.
  ro.a1.unit13.lesson02.teach.va_place_vocab:
    title: Czy Pan/Pani lubi...?
    gloss: Vă place...? (Czy Pan/Pani lubi...?)
    note: Grzecznościowa forma pytająca od *Îmi place* – *vă* (Panu/Pani) zastępuje *îmi* (mi), w tym samym rejestrze *dumneavoastră* co *aveți*/*faceți*. Dodaj po niej rzeczownik w formie określonej albo użyj jej samej, gdy temat jest już jasny.
    example_gloss:
    - Czy Pan/Pani lubi kawę?
  ro.a1.unit13.lesson02.teach.va_place_cafeaua_phrase:
    title: Czy Pan/Pani lubi kawę?
    gloss: Vă place cafeaua? (Czy Pan/Pani lubi kawę?)
    note: 'Pełny wzór: Vă place + rzeczownik w formie określonej, z rosnącą intonacją pytania.'
  ro.a1.unit13.lesson02.teach.prefer_vocab:
    title: wolę
    gloss: Prefer (wolę)
    note: 'Przejrzyste słowo bliskie polskiemu „preferować” – nie potrzeba konstrukcji „mi się podoba”, *prefer* działa jak zwykły czasownik, podobnie jak polskie „wolę”: *Prefer* + to, co wolisz, w formie określonej, tak jak po *Îmi place*.'
    example_gloss:
    - Wolę kawę.
  ro.a1.unit13.lesson02.teach.prefer_cafeaua_phrase:
    title: Wolę kawę
    gloss: Prefer cafeaua. (Wolę kawę.)
    note: Mocniejsze stwierdzenie niż *Îmi place cafeaua* – przydaje się przy wyborze między dwiema rzeczami.
  ro.a1.unit13.lesson02.teach.sau_vocab:
    title: albo
    gloss: Sau (albo)
    note: Łączy dwie opcje, gdy coś proponujesz lub pytasz o wybór – inaczej niż *și* (i) z lekcji 10 i 12, które łączy dwie rzeczy prawdziwe jednocześnie.
    example_gloss:
    - Kawa czy herbata?
  ro.a1.unit13.lesson02.teach.cafea_sau_ceai_phrase:
    title: Kawa czy herbata?
    gloss: Cafea sau ceai? (Kawa czy herbata?)
    note: Krótki, naturalny sposób na zaproponowanie wyboru – używa się tu zwykłych form nieokreślonych (*cafea*, *ceai*), a nie określonych *cafeaua*/*ceaiul*, bo to otwarta propozycja, a nie stwierdzenie o kawie czy herbacie w ogóle.
  ro.a1.unit13.lesson03.teach.reminder_va_place_prefer_sau:
    title: 'Przypomnienie: Vă place, Prefer, Sau'
    gloss: Vă place? (Czy Pan/Pani lubi?) · Prefer (wolę) · Sau (albo)
    note: Wszystkie z drugiej części tej lekcji – tutaj Ana i Mihai używają ich razem.
  ro.a1.unit13.lesson03.teach.reminder_imi_place_numi_place_cafeaua_ceaiul_painea:
    title: 'Przypomnienie: Îmi place, Nu-mi place, cafeaua, ceaiul, pâinea'
    gloss: Îmi place (lubię) · Nu-mi place (nie lubię) · cafeaua (kawa) · ceaiul (herbata) · pâinea (chleb)
    note: Wszystkie z pierwszej części tej lekcji – tutaj Ana i Mihai mówią, co lubią, a czego nie.
  ro.a1.unit13.lesson03.teach.reminder_buna_multumesc_la_revedere_ana_mihai:
    title: 'Przypomnienie: bună, mulțumesc, la revedere, Ana, Mihai'
    gloss: bună (cześć) · mulțumesc (dziękuję) · la revedere (do widzenia) · Ana, Mihai (imiona)
    note: Wszystkie poznane już we wcześniejszych lekcjach – ten sam przyjazny początek i koniec, jakim kończył się każdy dialog w tym kursie.
  ro.a1.unit13.lesson03.teach.line01:
    title: Powitanie i pytanie o kawę lub herbatę
    gloss: Mihai wita Anę i pyta, czy lubi kawę, czy herbatę.
    note: Łączy *Vă place...?* z tej lekcji ze słowem *sau*, by w jednym pytaniu zaproponować obie opcje.
  ro.a1.unit13.lesson03.teach.line02:
    title: Preferencja i niechęć
    gloss: Ana mówi, że woli kawę i nie lubi herbaty.
    note: Łączy *Prefer* z *Nu-mi place* – jej upodobanie do kawy zgadza się z jej wyborami z lekcji 6 i 12.
  ro.a1.unit13.lesson03.teach.line03:
    title: Wskazanie przeciwnej preferencji
    gloss: Mihai mówi, że lubi herbatę i nie lubi kawy.
    note: Zgadza się z wyborami Mihaia z lekcji 6 i 12 (ceai, nigdy cafea).
  ro.a1.unit13.lesson03.teach.line04:
    title: Pytanie także o chleb
    gloss: Ana pyta Mihaia, czy lubi też chleb.
    note: Zaczyna się od krótkiego pytania *Și pâinea?* (A chleb?), a potem pada pełne pytanie z *Vă place...?* o nowy temat, *pâinea*.
  ro.a1.unit13.lesson03.teach.line05:
    title: Potwierdzenie, podziękowanie i pożegnanie
    gloss: Mihai mówi, że tak, lubi chleb, dziękuje Anie i żegna się.
    note: Zgadza się z wyborami Mihaia z lekcji 6 (pâine) – to samo zakończenie, jakim kończył się dialog w każdej wcześniejszej lekcji.
  ro.a1.unit13.lesson03.teach.line06:
    title: Zakończenie rozmowy
    gloss: Ana też się żegna, zwracając się do Mihaia po imieniu.
    note: To samo przyjazne zakończenie, jakim kończył się dialog w każdej wcześniejszej lekcji.
