answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit's own new vocabulary (mic/mică, mai, decât) is entirely person-invariant and carries no register distinction of its own. Ana and Mihai's dialogue keeps their existing polite register with each other, matching every earlier unit; no new second-person form is introduced here (unlike unit13's Vă place...?).
course:
  title: Rumuński A1
  description: Porównywanie znanych rzeczy po rumuńsku – Mare (duży), Mic/Mică (mały) i konstrukcja stopnia wyższego Mai ... decât (bardziej/-szy ... niż) – gdy Ana i Mihai porównują wielkość swojej kawy, herbaty i chleba.
units:
  ro.a1.unit14.comparisons:
    title: Porównania
lessons:
  ro.a1.unit14.lesson01.mare_mic:
    title: Duży, mały
  ro.a1.unit14.lesson02.mai_mare_mai_mica:
    title: Większy, mniejszy
  ro.a1.unit14.lesson03.cafeaua_mai_mare:
    title: Co jest większe?
teaching:
  ro.a1.unit14.lesson01.teach.reminder_mare:
    title: 'Powtórka: mare'
    gloss: mare (duży)
    note: 'Już znane z rozdziału 3 („literă mare”, wielka litera) i rozdziału 5 („o familie mare”, duża rodzina) – tu dostaje prawdziwego partnera do porównania: *mic/mică*.'
  ro.a1.unit14.lesson01.teach.reminder_cafeaua_ceaiul_painea:
    title: 'Powtórka: cafeaua, ceaiul, pâinea, cafea, ceai'
    gloss: cafeaua (kawa) · ceaiul (herbata) · pâinea (chleb) · cafea (kawa) · ceai (herbata)
    note: Wszystko z rozdziałów 6 i 13 – w tym rozdziale formy określone są rzeczami porównywanymi pod względem wielkości, a formy nieokreślone wracają w ćwiczeniu na dopasowywanie w tej lekcji.
  ro.a1.unit14.lesson01.teach.mic_mica_vocab:
    title: Mały
    gloss: Mic (mały, r. męski/nijaki) · Mică (mała, r. żeński)
    note: Rumuńskie przymiotniki zgadzają się z rzeczownikiem, który opisują – *ceai* (herbata) ma formę męską/nijaką *mic*, a *cafea* (kawa) i *pâine* (chleb) są rodzaju żeńskiego i mają *mică*. *Mare* (duży) ma w liczbie pojedynczej jedną formę dla rodzaju męskiego i żeńskiego, dlatego nie trzeba było go dzielić.
    example_gloss:
    - Herbata jest mała.
    - Kawa jest mała.
  ro.a1.unit14.lesson01.teach.ceaiul_e_mic_phrase:
    title: Herbata jest mała
    gloss: Ceaiul e mic. (Herbata jest mała.)
    note: '*Ceaiul* jest rodzaju nijakiego, dlatego ma formę męską/nijaką *mic*.'
  ro.a1.unit14.lesson01.teach.cafeaua_e_mica_phrase:
    title: Kawa jest mała
    gloss: Cafeaua e mică. (Kawa jest mała.)
    note: '*Cafeaua* jest rodzaju żeńskiego, dlatego ma formę żeńską *mică*.'
  ro.a1.unit14.lesson01.teach.painea_e_mica_phrase:
    title: Chleb jest mały
    gloss: Pâinea e mică. (Chleb jest mały.)
    note: '*Pâinea* też jest rodzaju żeńskiego, więc ma *mică* tak samo jak *cafeaua*.'
  ro.a1.unit14.lesson02.teach.reminder_mare_mic_mica:
    title: 'Powtórka: Mare, Mic, Mică'
    gloss: Mare (duży) · Mic (mały, r. męski/nijaki) · Mică (mała, r. żeński)
    note: Wszystko z lekcji 1 tego rozdziału – tu dostają formę stopnia wyższego.
  ro.a1.unit14.lesson02.teach.reminder_cafeaua_ceaiul_painea:
    title: 'Powtórka: cafeaua, ceaiul, pâinea'
    gloss: cafeaua (kawa) · ceaiul (herbata) · pâinea (chleb)
    note: Wszystko z rozdziału 13, tu znów użyte jako rzeczy do porównania.
  ro.a1.unit14.lesson02.teach.mai_vocab:
    title: Bardziej / -szy
    gloss: Mai (bardziej / -szy, stopień wyższy)
    note: 'To nie jest miesiąc *mai* (maj, rozdział 3). To samo małe słowo znasz z „Ce mai faceți?” (rozdział 1), ale tu pełni inną rolę – partykuły stopnia wyższego: postaw *mai* przed przymiotnikiem, aby powiedzieć „bardziej ___” lub „___-szy”; tak w rumuńskim tworzy się stopień wyższy.'
    example_gloss:
    - Kawa jest większa.
  ro.a1.unit14.lesson02.teach.mai_mare_phrase:
    title: Kawa jest większa
    gloss: Cafeaua e mai mare. (Kawa jest większa.)
    note: '*Mai* + przymiotnik – nie trzeba nic więcej zmieniać.'
  ro.a1.unit14.lesson02.teach.decat_vocab:
    title: Niż
    gloss: Decât (niż)
    note: Dopełnia porównanie – *mai* + przymiotnik + *decât* + druga porównywana rzecz.
    example_gloss:
    - Kawa jest większa niż herbata.
  ro.a1.unit14.lesson02.teach.mai_mare_decat_phrase:
    title: Kawa jest większa niż herbata
    gloss: Cafeaua e mai mare decât ceaiul. (Kawa jest większa niż herbata.)
    note: 'Pełny wzór stopnia wyższego: [rzecz] + e + mai + [przymiotnik] + decât + [druga rzecz].'
  ro.a1.unit14.lesson02.teach.mai_mica_decat_phrase:
    title: Chleb jest mniejszy niż kawa
    gloss: Pâinea e mai mică decât cafeaua. (Chleb jest mniejszy niż kawa.)
    note: Ten sam wzór z formą *mică*, żeńską formą „małego” z lekcji 1 tego rozdziału.
  ro.a1.unit14.lesson03.teach.reminder_mai_decat_mare_mic_mica:
    title: 'Powtórka: Mai, Decât, Mare, Mic, Mică'
    gloss: Mai (bardziej/-szy) · Decât (niż) · Mare (duży) · Mic (mały, r. męski/nijaki) · Mică (mała, r. żeński)
    note: Wszystko z lekcji 1 i 2 tego rozdziału – tu Ana i Mihai używają tych słów razem.
  ro.a1.unit14.lesson03.teach.reminder_cafeaua_ceaiul_painea:
    title: 'Powtórka: cafeaua, ceaiul, pâinea'
    gloss: cafeaua (kawa) · ceaiul (herbata) · pâinea (chleb)
    note: Wszystko z rozdziału 13 – trzy rzeczy, które porównują Ana i Mihai.
  ro.a1.unit14.lesson03.teach.reminder_buna_multumesc_la_revedere_ana_mihai:
    title: 'Powtórka: bună, mulțumesc, la revedere, Ana, Mihai'
    gloss: bună (cześć) · mulțumesc (dziękuję) · la revedere (do widzenia) · Ana, Mihai (imiona)
    note: Wszystko to już znasz z wcześniejszych lekcji – to ten sam przyjazny początek i koniec, którym kończył się każdy dialog w tym kursie.
  ro.a1.unit14.lesson03.teach.line01:
    title: Powitanie i pytanie o rozmiar
    gloss: Mihai wita się z Aną i pyta, czy kawa jest duża, czy mała.
    note: Używa słów z tej lekcji, *mare sau mică* (duża czy mała), do pytania o rozmiar. Konstrukcja „X sau Y?” (wybór między dwiema możliwościami) jest taka sama jak w *cafea sau ceai?* z lekcji 13.
  ro.a1.unit14.lesson03.teach.line02:
    title: Opisanie rozmiaru obu napojów
    gloss: Ana mówi, że kawa jest duża, a herbata mała.
    note: To zwykłe stwierdzenie faktu o rozmiarze, a nie preferencja – w tym dialogu nie pada, kto co lubi ani zamawia, tylko jak duży jest każdy napój.
  ro.a1.unit14.lesson03.teach.line03:
    title: Pytanie potwierdzające porównanie
    gloss: Mihai pyta, czy kawa jest większa niż herbata.
    note: Zamienia dwa osobne stwierdzenia Any (kwestia 2) w bezpośrednie porównanie za pomocą *mai mare decât* – głównej konstrukcji tej lekcji.
  ro.a1.unit14.lesson03.teach.line04:
    title: Potwierdzenie i dodanie chleba
    gloss: Ana potwierdza, a potem mówi, że chleb jest mniejszy niż kawa.
    note: Ponownie użyto *mai ... decât*, tym razem z trzecim przedmiotem, *pâinea*, i z formą *mai mică* („mniejszy”).
  ro.a1.unit14.lesson03.teach.line05:
    title: Potwierdzenie, podziękowanie i pożegnanie
    gloss: Mihai potwierdza, że chleb jest mały, dziękuje Anie i się żegna.
    note: Takie samo zakończenie, jakim kończył się dialog w każdej wcześniejszej lekcji.
  ro.a1.unit14.lesson03.teach.line06:
    title: Zakończenie rozmowy
    gloss: Ana też się żegna i zwraca się do Mihaia po imieniu.
    note: Takie samo przyjazne zakończenie, jakim kończył się dialog w każdej wcześniejszej lekcji.
