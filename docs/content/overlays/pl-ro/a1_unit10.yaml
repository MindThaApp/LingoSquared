teaching:
  ro.a1.unit10.lesson01.teach.reminder_dimineata_seara_noaptea_cafea_paine:
    title: 'Powtórka: dimineața, seara, noaptea, cafea, pâine'
    gloss: dimineața (rano) · seara (wieczorem) · noaptea (w nocy) · cafea (kawa) · pâine (chleb)
    note: Wszystko to już znasz – dimineața/seara/noaptea od Lekcji 4, cafea/pâine od Lekcji 6 – a tutaj łączą się w zdania o codziennym planie dnia z tej lekcji.
  ro.a1.unit10.lesson01.teach.ma_trezesc_vocab:
    title: Budzę się
    gloss: Mă trezesc (Budzę się)
    note: '*Mă* to zaimek zwrotny, który już znasz z *mă numesc*/*mă cheamă* – po rumuńsku „budzić się” jest czasownikiem zwrotnym, dosłownie „budzę siebie”.'
    example_gloss:
    - Rano się budzę.
  ro.a1.unit10.lesson01.teach.ma_trezesc_phrase:
    title: Rano się budzę
    gloss: Mă trezesc dimineața. (Rano się budzę.)
    note: Krótka, pełna wypowiedź – najprostsze możliwe zdanie o planie dnia.
  ro.a1.unit10.lesson01.teach.mananc_vocab:
    title: Jem
    gloss: Mănânc (jem)
    note: Zaimek „ja” nie jest potrzebny – rumuńskie końcówki czasownika już pokazują, kto mówi. Ten sam wzorzec znasz z *vreau*, *cumpăr* i *aș dori*.
    example_gloss:
    - Rano jem chleb.
  ro.a1.unit10.lesson01.teach.beau_vocab:
    title: Piję
    gloss: Beau (piję)
    note: Naturalnie łączy się ze znanymi już napojami, takimi jak *cafea* i *ceai*.
    example_gloss:
    - Rano piję kawę.
  ro.a1.unit10.lesson01.teach.mananc_beau_phrase:
    title: Rano jem chleb i piję kawę
    gloss: Mănânc pâine și beau cafea dimineața. (Rano jem chleb i piję kawę.)
    note: 'Łączy dwie czynności za pomocą *și* (i), które znasz już z Lekcji 4: *ora unu și jumătate*.'
  ro.a1.unit10.lesson02.teach.lucrez_vocab:
    title: pracuję
    gloss: Lucrez (pracuję)
    note: Forma pierwszej osoby od *lucrează*, które widziałeś(-aś) w Lekcji 4, gdy mowa była o wieczornej pracy Mihaia.
    example_gloss:
    - Pracuję wieczorem.
  ro.a1.unit10.lesson02.teach.lucrez_phrase:
    title: Pracuję wieczorem
    gloss: Lucrez seara. (Pracuję wieczorem.)
    note: Krótka, pełna wypowiedź o tym, kiedy pracujesz.
  ro.a1.unit10.lesson02.teach.merg_vocab:
    title: Idę
    gloss: Merg (idę)
    note: Forma pierwszej osoby od *mergeți*, formy rozkazującej poznanej wcześniej – ten sam czasownik, inna osoba.
    example_gloss:
    - Idę do domu.
  ro.a1.unit10.lesson02.teach.acasa_vocab:
    title: Dom
    gloss: Acasă (do domu / w domu)
    note: 'Używane bez przyimka: *merg acasă*, a nie *merg la acasă*. Po polsku „idę do domu” ma przyimek „do”, a po rumuńsku go nie ma.'
    example_gloss:
    - Wracam do domu w nocy.
  ro.a1.unit10.lesson02.teach.merg_acasa_phrase:
    title: Wracam do domu w nocy
    gloss: Merg acasă noaptea. (Idę do domu w nocy.)
    note: Krótka, pełna wypowiedź – naturalny koniec dnia pracy.
  ro.a1.unit10.lesson02.teach.lucrez_merg_phrase:
    title: Pracuję wieczorem i w nocy wracam do domu
    gloss: Lucrez seara și merg acasă noaptea. (Pracuję wieczorem i w nocy idę do domu.)
    note: Łączy oba zdania z tej lekcji w jedno za pomocą *și*.
  ro.a1.unit10.lesson03.teach.reminder_cursul_incepe_ora_apoi:
    title: 'Powtórka: cursul, începe, la ora nouă, apoi'
    gloss: cursul (zajęcia) · începe (zaczyna się) · la ora nouă (o dziewiątej) · apoi (potem)
    note: Cursul/începe/la ora nouă pojawiły się już w Lekcji 4 (zajęcia Mihaia zaczynają się o dziewiątej rano); apoi znasz z Lekcji 9 – tutaj łączą się w opowieść Mihaia o jego własnym planie dnia.
  ro.a1.unit10.lesson03.teach.reminder_buna_multumesc_la_revedere_da:
    title: 'Powtórka: bună, mulțumesc, la revedere, da, Ana, Mihai'
    gloss: bună (cześć) · mulțumesc (dziękuję) · la revedere (do widzenia) · da (tak) · Ana, Mihai (imiona)
    note: Wszystko to znasz już z wcześniejszych lekcji – tutaj Ana pyta Mihaia o jego dzień.
  ro.a1.unit10.lesson03.teach.ma_culc_vocab:
    title: idę spać
    gloss: Mă culc (kładę się spać)
    note: Kolejny czasownik zwrotny, taki sam wzorzec jak *mă trezesc* – dosłownie „kładę się”.
    example_gloss:
    - W nocy kładę się spać.
  ro.a1.unit10.lesson03.teach.ma_culc_phrase:
    title: W nocy kładę się spać
    gloss: Mă culc noaptea. (W nocy kładę się spać.)
    note: Naturalny koniec dnia, domykający rozkład zaczęty od *mă trezesc dimineața*.
  ro.a1.unit10.lesson03.teach.line01:
    title: Przywitaj się i zapytaj, kiedy zaczynają się zajęcia
    gloss: Ana wita się z Mihaiem i pyta, kiedy zaczynają się jego zajęcia.
    note: Wraca pytanie o zajęcia Mihaia z Lekcji 4.
  ro.a1.unit10.lesson03.teach.line02:
    title: Odpowiedz, o której są zajęcia
    gloss: Mihai mówi, że jego zajęcia zaczynają się o dziewiątej rano.
    note: Dokładnie ta sama odpowiedź, której Mihai udzielił w Lekcji 4, tu jako część jego pełniejszego planu dnia.
  ro.a1.unit10.lesson03.teach.line03:
    title: Zapytaj o wieczór
    gloss: 'Ana zadaje krótkie pytanie uzupełniające: „A wieczorem?”'
    note: Naturalny, minimalny sposób, by dopytać o dalszy ciąg dnia bez nowego słowa pytającego.
  ro.a1.unit10.lesson03.teach.line04:
    title: Opisz resztę dnia
    gloss: Mihai mówi, że wieczorem pracuje, a potem w nocy kładzie się spać.
    note: Łączy *lucrez* i *mă culc* z tej lekcji za pomocą *apoi* – i zgadza się z faktem z Lekcji 4, że Mihai pracuje wieczorem.
  ro.a1.unit10.lesson03.teach.line05:
    title: Podziękuj i zakończ
    gloss: Ana mówi „Dobrze!”, dziękuje Mihaiowi i żegna się.
    note: To samo zakończenie z podziękowaniem, które pojawiało się w dialogach z Lekcji 1, 8 i 9.
  ro.a1.unit10.lesson03.teach.line06:
    title: Zakończ spotkanie
    gloss: Mihai również się żegna, zwracając się do Any po imieniu.
    note: To samo przyjazne zakończenie, którym kończył się dialog w każdej wcześniejszej lekcji.
