teaching:
  ro.a1.unit18.lesson01.teach.reminder_ana_mare:
    title: 'Powtórka: Ana, mare'
    gloss: Ana (imię) · mare (duży)
    note: Ana to imię bohaterki, znane od Lekcji 1; *mare* pojawiło się w Lekcji 5 i 14 — w tej lekcji oba słowa wracają w opisie jej domu.
  ro.a1.unit18.lesson01.teach.reminder_articole_trei:
    title: 'Powtórka: un, o, și, trei'
    gloss: un/o (jeden/jedna) · și (i) · trei (trzy)
    note: '*Un*/*o*/*și* pochodzą z Lekcji 5, a *trei* z liczenia w Lekcji 2 — w tej lekcji wszystkie cztery wracają przy liczeniu i opisywaniu pokoi.'
  ro.a1.unit18.lesson01.teach.are_vocab:
    title: Ma
    gloss: Are (on/ona/ono ma)
    note: Nowa forma czasownika *a avea* (mieć) — znasz już *am* (ja mam, z Lekcji 2 i 5) oraz *aveți* (Pan/Pani/Państwo ma/macie); *are* to forma 3. osoby liczby pojedynczej tego samego czasownika, której używamy, by powiedzieć, co ktoś lub coś ma.
  ro.a1.unit18.lesson01.teach.casa_vocab:
    title: Dom
    gloss: dom
    note: Miejsce, w którym ktoś mieszka.
    example_gloss:
    - Ana ma duży dom.
  ro.a1.unit18.lesson01.teach.camera_vocab:
    title: Pokój
    gloss: pokój
    note: Ogólne słowo na pomieszczenie w domu.
    example_gloss:
    - Ana ma duży pokój.
  ro.a1.unit18.lesson01.teach.camere_plural:
    title: Cameră → camere
    gloss: pokój · pokoje
    note: Liczba mnoga od *cameră* to *camere* — używamy jej, gdy liczymy więcej niż jeden pokój.
  ro.a1.unit18.lesson01.teach.dormitor_vocab:
    title: Sypialnia
    gloss: sypialnia
    note: Pokój, w którym ktoś śpi.
    example_gloss:
    - Ana ma sypialnię.
  ro.a1.unit18.lesson01.teach.bucatarie_vocab:
    title: Kuchnia
    gloss: kuchnia
    note: Pomieszczenie, w którym ktoś gotuje.
    example_gloss:
    - Ana ma kuchnię.
  ro.a1.unit18.lesson01.teach.baie_vocab:
    title: Łazienka
    gloss: łazienka
    note: Pomieszczenie z wanną lub prysznicem i toaletą.
    example_gloss:
    - Ana ma łazienkę.
  ro.a1.unit18.lesson01.teach.casa_mare_phrase:
    title: 'Ana ma duży dom. Dom ma trzy pokoje: sypialnię, kuchnię i łazienkę.'
    gloss: 'Ana ma duży dom. Dom ma trzy pokoje: sypialnię, kuchnię i łazienkę.'
    note: 'Wszystkie słowa były już poznane lub właśnie je poznałeś/poznałaś i zostały połączone w dwa nowe zdania o domu Any. *Casa* to forma określona od *casă* — „ten dom”: rzeczownik rodzaju żeńskiego na -ă zamienia je na -a, tak jak *banca* (bank) w Lekcji 8.'
  ro.a1.unit18.lesson02.teach.reminder_mihai_mic:
    title: 'Powtórka: Mihai, mic'
    gloss: Mihai (imię) · mic (mały)
    note: Mihai to imię bohatera, znane od Lekcji 1; *mic* pochodzi z Lekcji 14 — w tej lekcji oba słowa wracają w opisie jego mieszkania.
  ro.a1.unit18.lesson02.teach.reminder_unde_este_doua:
    title: 'Powtórka: unde, este, două'
    gloss: unde (gdzie) · este (jest) · două (dwa, rodzaj żeński)
    note: '*Unde*/*este* pochodzą z Lekcji 8 i 9, a *două* to żeńska forma liczebnika „dwa” z Lekcji 2 — w tej lekcji wszystkie trzy wracają przy pytaniu o pokoje i ich liczeniu.'
  ro.a1.unit18.lesson02.teach.apartament_vocab:
    title: Mieszkanie
    gloss: mieszkanie
    note: Dom Mihaia — mniejsza alternatywa dla domu Any.
    example_gloss:
    - Mihai ma małe mieszkanie.
  ro.a1.unit18.lesson02.teach.fereastra_vocab:
    title: Okno
    gloss: okno
    note: '*Apartamentul* to forma określona od *apartament* — „to mieszkanie”: rzeczownik rodzaju nijakiego zakończony na spółgłoskę przyjmuje -ul, tak jak *magazinul* (sklep) w Lekcji 8 (żeńskie *casă* zamiast tego przyjmuje *casa*).'
    example_gloss:
    - Mieszkanie ma duże okno.
  ro.a1.unit18.lesson02.teach.apartament_mic_phrase:
    title: 'Mihai ma małe mieszkanie. Mieszkanie ma dwa pokoje: sypialnię i kuchnię.'
    gloss: 'Mihai ma małe mieszkanie. Mieszkanie ma dwa pokoje: sypialnię i kuchnię.'
    note: Wszystkie słowa były już poznane lub właśnie je poznałeś/poznałaś i zostały połączone w dwa nowe zdania o mieszkaniu Mihaia.
  ro.a1.unit18.lesson02.teach.unde_este_baia_phrase:
    title: Gdzie jest łazienka?
    gloss: Unde este baia? (Gdzie jest łazienka?)
    note: '*Baia* to forma określona od *baie* — „ta łazienka”. To przydatne pytanie w prawdziwej sytuacji, gdy jesteś w czyimś domu.'
  ro.a1.unit18.lesson03.teach.reminder_buna_ce_mai_faceti_bine_multumesc:
    title: 'Powtórka: Bună, Ce mai faceți?, Bine, mulțumesc'
    gloss: Bună (cześć) · Ce mai faceți? (jak się Pan/Pani miewa?) · Bine, mulțumesc (dobrze, dziękuję)
    note: Wszystko z powitania z Lekcji 1, użyte tutaj na początku dialogu z tej lekcji.
  ro.a1.unit18.lesson03.teach.reminder_la_revedere_mea_aproape_am:
    title: 'Powtórka: La revedere, Mea, Aproape, Am'
    gloss: La revedere (do widzenia) · Mea (moja, rodzaj żeński) · Aproape (blisko) · Am (mam)
    note: '*La revedere* pochodzi z Lekcji 1; *mea* z *Mama mea* z Lekcji 5; *aproape* z odpowiedzi na *Unde este...?* z Lekcji 8 i 9; *am* z Lekcji 2 i 5 — wszystko wraca w dialogu o wizycie w domu.'
  ro.a1.unit18.lesson03.teach.line01:
    title: Przywitaj Anę i zapytaj, jak się miewa
    gloss: Mihai wita Anę i pyta, co u niej słychać.
    note: Wraca powitanie *Ce mai faceți?* z Lekcji 1.
  ro.a1.unit18.lesson03.teach.line02:
    title: Odpowiedz i opisz swój dom
    gloss: Ana odpowiada, a potem mówi Mihaiowi, że jej dom jest duży i ma trzy pokoje.
    note: Łączy *Bine, mulțumesc* z Lekcji 1 ze zdaniem z pierwszej części tej lekcji.
  ro.a1.unit18.lesson03.teach.line03:
    title: Zapytaj, gdzie jest łazienka
    gloss: Mihai pyta Anę, gdzie jest łazienka.
    note: Wraca prawie dokładnie zdanie z drugiej części tej lekcji.
  ro.a1.unit18.lesson03.teach.line04:
    title: Odpowiedz, gdzie jest łazienka
    gloss: Ana mówi mu, że jest blisko.
    note: Łączy *baia* z *aproape* — ten sam wzór odpowiedzi na „gdzie jest...?”, który znasz z Lekcji 8 i 9.
  ro.a1.unit18.lesson03.teach.line05:
    title: Opisz własne mieszkanie i pożegnaj się
    gloss: Mihai mówi, że ma małe mieszkanie z dwoma pokojami, a potem się żegna.
    note: Łączy zdanie z drugiej części tej lekcji z pożegnaniem z Lekcji 1.
  ro.a1.unit18.lesson03.teach.line06:
    title: Pożegnaj się
    gloss: Ana się żegna.
    note: Ten sam wzór pożegnania, którym kończył się dialog w każdej poprzedniej lekcji.
