teaching:
  ro.a1.unit11.lesson01.teach.reminder_da_bine:
    title: 'Powtórka: da, bine, nu, mulțumesc'
    gloss: da (tak) · bine (dobrze) · nu (nie) · mulțumesc (dziękuję)
    note: Wszystkie te słowa znasz już od Lekcji 6 — tutaj łączą się w sposób przyjmowania propozycji typowy dla tej lekcji i w ćwiczenie powtórkowe z dopasowywaniem słownictwa.
  ro.a1.unit11.lesson01.teach.mergem_vocab:
    title: Chodźmy / idziemy
    gloss: Mergem (chodźmy / idziemy)
    note: Pierwsza osoba liczby mnogiej czasownika *a merge*, który już znasz jako *merg* (idę, Lekcja 10) i *mergeți* (forma grzecznościowa rozkazu, Lekcja 9) — ten sam czasownik, inna osoba i liczba. Użyty samodzielnie, z intonacją rosnącą, to naturalny sposób zaproponowania wspólnego zajęcia.
    example_gloss:
    - Pójdziemy do kina?
  ro.a1.unit11.lesson01.teach.cinema_vocab:
    title: Kino
    gloss: Cinema (kino)
    note: Słowo podobne do polskiego „kino” (a także do „cinema” w wielu językach) — łatwo je rozpoznać.
    example_gloss:
    - Pójdziemy do kina?
  ro.a1.unit11.lesson01.teach.mergem_cinema_phrase:
    title: Pójdziemy do kina?
    gloss: Mergem la cinema? (Pójdziemy do kina?)
    note: Pełne zaproszenie — nie potrzeba dodatkowego „czy chcesz”; sam znak zapytania zamienia „idziemy” w propozycję.
  ro.a1.unit11.lesson01.teach.parc_vocab:
    title: Park
    gloss: Parc (park)
    note: Kolejne słowo podobne do polskiego, tak jak *cinema*.
    example_gloss:
    - Pójdziemy do parku?
  ro.a1.unit11.lesson01.teach.mergem_parc_phrase:
    title: Pójdziemy do parku?
    gloss: Mergem la parc? (Pójdziemy do parku?)
    note: Ten sam wzór zaproszenia co w *Mergem la cinema?*, tylko z innym miejscem.
  ro.a1.unit11.lesson01.teach.da_bine_phrase:
    title: Tak, dobrze!
    gloss: Da, bine! (Tak, dobrze!)
    note: Krótki, naturalny sposób przyjęcia planu — znane już słowa w nowym połączeniu.
  ro.a1.unit11.lesson02.teach.reminder_nu_pot:
    title: 'Powtórka: nu, pot'
    gloss: nu (nie) · pot (mogę)
    note: 'Nu znasz od Lekcji 6; pot pojawiło się w Lekcji 9 w zdaniu *cum pot să ajung* (jak mogę dojść). Przed czasownikiem *nu* znaczy „nie”: *nu pot* to „nie mogę” — sposób odmowy w tej lekcji.'
  ro.a1.unit11.lesson02.teach.reminder_sambata_duminica:
    title: 'Powtórka: sâmbătă, duminică'
    gloss: sâmbătă (sobota) · duminică (niedziela)
    note: Oba słowa znasz już z Lekcji 3, z dniami tygodnia.
  ro.a1.unit11.lesson02.teach.mergem_parc_sambata_phrase:
    title: Pójdziemy do parku w sobotę?
    gloss: Mergem la parc sâmbătă? (Pójdziemy do parku w sobotę?)
    note: Zaproszenie z pierwszej części, tym razem z dniem — łączy *Mergem la parc?* z nazwą dnia.
  ro.a1.unit11.lesson02.teach.nu_pot_sambata_phrase:
    title: W sobotę nie mogę
    gloss: Nu pot sâmbătă. (W sobotę nie mogę.)
    note: Zwykła odmowa — *nu pot* i dzień, w którym nie możesz.
  ro.a1.unit11.lesson02.teach.atunci_vocab:
    title: Wtedy / w takim razie
    gloss: Atunci (wtedy / w takim razie)
    note: Nie myl z *apoi* (z Lekcji 9, „potem”, porządkuje dwie czynności) — *atunci* wprowadza alternatywę lub wniosek, to naturalne słowo na „w takim razie co powiesz na…?” przy zmianie terminu.
    example_gloss:
    - W takim razie w niedzielę?
  ro.a1.unit11.lesson02.teach.atunci_duminica_phrase:
    title: W takim razie w niedzielę?
    gloss: Atunci, duminică? (W takim razie w niedzielę?)
    note: Krótka kontrpropozycja po odmowie — wystarczy podać nowy dzień, nie trzeba powtarzać całego zaproszenia.
  ro.a1.unit11.lesson02.teach.da_bine_duminica_phrase:
    title: Tak, dobrze! W niedzielę.
    gloss: Da, bine! Duminică. (Tak, dobrze! W niedzielę.)
    note: Przyjęcie zmienionego terminu, tym samym krótkim wzorem co *Da, bine!* z pierwszej części.
  ro.a1.unit11.lesson03.teach.reminder_la_ce_ora_la_ora_patru:
    title: 'Powtórka: la ce oră, la ora, patru'
    gloss: la ce oră (o której godzinie) · la ora (o godzinie…) · patru (cztery)
    note: La ce oră i la ora znasz z Lekcji 4 (pytanie o godzinę i podawanie jej); patru z Lekcji 2, z liczbami — tutaj łączą się przy ustalaniu godziny spotkania.
  ro.a1.unit11.lesson03.teach.reminder_buna_multumesc_la_revedere_da_ana_mihai:
    title: 'Powtórka: bună, mulțumesc, la revedere, da, Ana, Mihai'
    gloss: bună (cześć) · mulțumesc (dziękuję) · la revedere (do widzenia) · da (tak) · Ana, Mihai (imiona)
    note: Wszystko to znasz już z wcześniejszych lekcji — tutaj Ana i Mihai ustalają godzinę swojego spotkania.
  ro.a1.unit11.lesson03.teach.sigur_vocab:
    title: Pewnie
    gloss: Sigur (pewnie)
    note: Częsty, samodzielny sposób potwierdzenia planu — podobnie jak po polsku „Pewnie!” albo „Oczywiście!”.
    example_gloss:
    - Pewnie! O czwartej.
  ro.a1.unit11.lesson03.teach.sigur_phrase:
    title: Pewnie! O czwartej.
    gloss: Sigur! La ora patru. (Pewnie! O czwartej.)
    note: Jedną krótką odpowiedzią potwierdzasz i plan, i dokładną godzinę.
  ro.a1.unit11.lesson03.teach.line01:
    title: Powitanie i propozycja parku
    gloss: Ana wita Mihaia i pyta, czy pójdą do parku w niedzielę.
    note: Łączy zaproszenie *Mergem la parc?* z tej lekcji ze słowem *duminică*.
  ro.a1.unit11.lesson03.teach.line02:
    title: Zgoda i pytanie o godzinę
    gloss: Mihai się zgadza i pyta, o której.
    note: Wraca pytanie *La ce oră?* z Lekcji 4.
  ro.a1.unit11.lesson03.teach.line03:
    title: Zaproponuj godzinę
    gloss: Ana proponuje godzinę czwartą.
    note: Krótkie pytanie ze wzorem *la ora* z Lekcji 4 i słowem *patru* z tej lekcji.
  ro.a1.unit11.lesson03.teach.line04:
    title: Potwierdź i podziękuj
    gloss: Mihai potwierdza słowem „Pewnie!” i dziękuje Anie.
    note: Łączy *sigur* z tej lekcji ze znanym już *mulțumesc*.
  ro.a1.unit11.lesson03.teach.line05:
    title: Pożegnaj się
    gloss: Ana żegna się z Mihaiem.
    note: Ten sam wzór zakończenia, którym kończyły się dialogi we wszystkich wcześniejszych lekcjach.
  ro.a1.unit11.lesson03.teach.line06:
    title: Zakończ spotkanie
    gloss: Mihai również się żegna, zwracając się do Any po imieniu.
    note: Ten sam przyjazny wzór zakończenia, którym kończyły się dialogi we wszystkich wcześniejszych lekcjach.
