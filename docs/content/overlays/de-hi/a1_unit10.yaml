answer_policy:
  gender_agreement: 'This unit''s central grammar point (habitual present, verb stem + -ता/-ती/-ते + हूँ/हो/है/हैं) is grammatically gendered by the subject. For any exercise where the subject is a NAMED character with an established gender (Arjun: masculine: Priya: feminine), `accepted_answers` contains only that character''s single correct gendered form. For any exercise where the subject is the LEARNER themselves (a self-description prompt phrased with "तुम"/"अपनी"), `accepted_answers` deliberately includes BOTH the masculine and the feminine conjugated forms as equally correct -- the app has no signal of the learner''s own gender, and marking only one form correct would wrongly fail roughly half of all learners regardless of which gendered form the exercise happened to be authored around first.'
  nasalization_marks: Display and teach the correct chandrabindu/anusvara distinction. This unit introduces no new nasalized vocabulary at all -- the only nasalized form used anywhere in this unit is हूँ, reused unchanged from its already-settled unit01 spelling. In typed A1 answers, accept a variant that drops a nasalization mark entirely or substitutes anusvara for chandrabindu (or vice versa) when every other character is correct. Do not extend this tolerance to a wrong vowel or consonant, which changes the actual word.
  punctuation: Hindi text is shown with the traditional danda (।) as the sentence-final mark. In typed answers, accept the danda, a plain period (.), or the mark omitted entirely as equivalent. Question marks (?), exclamation marks, and commas may likewise be omitted, but the fully punctuated form remains the model answer.
  spoken_answers: Judge spoken responses by intelligibility rather than written punctuation, nasalization marks, or (for self-description prompts) which grammatically correct gendered form the learner produces.
course:
  title: Hindi A1
units:
  hi.a1.unit10.routines:
    title: Tagesablauf
lessons:
  hi.a1.unit10.lesson01.uthna_nashta_kaam:
    title: Aufstehen, Frühstück, zur Arbeit gehen
  hi.a1.unit10.lesson02.tum_kab_uthte_ho:
    title: Wann stehst du auf?
  hi.a1.unit10.lesson03.priya_arjun_dincharya:
    title: 'Priya und Arjun: der Tagesablauf'
teaching:
  hi.a1.unit10.lesson01.teach.review_time:
    title: 'Wiederholung: Uhr, Morgen, Nachmittag, Abend, Nacht, um/an'
    gloss: Uhr, Morgen, Nachmittag, Abend, Nacht, um/an (allgemeine Zeitangabe)
    note: Eine kurze Wiederholung der Zeitwörter aus Lektion 4 – sie kommen in dieser Lektion oft vor.
    example_gloss:
    - Es ist jetzt 8 Uhr morgens.
    - Nachts gibt es keinen Unterricht.
  hi.a1.unit10.lesson01.teach.uthna:
    title: Ich stehe auf
    gloss: Ich stehe auf (Sprecher / Sprecherin)
    note: Das erste Verb im habituellen Präsens in dieser Lektion – es erweitert das Muster -ta/-tee aus Lektion 5 (rahta hai/rahtee hai) auf die erste Person mit hoon.
    example_gloss:
    - Ich stehe morgens um 7 auf.
    - Ich stehe morgens um 6 auf.
  hi.a1.unit10.lesson01.teach.roz:
    title: Jeden Tag
    gloss: jeden Tag
    note: Ein neues Adverb, um Routinen zu beschreiben.
    example_gloss: Ich stehe jeden Tag morgens auf.
  hi.a1.unit10.lesson01.teach.nashta_karna:
    title: Ich frühstücke
    gloss: Ich frühstücke (Sprecher / Sprecherin)
    note: „Nashta“ (Frühstück) wird mit „karta/kartee hoon“ (ich mache) verbunden.
    example_gloss:
    - Morgens frühstücke ich.
    - Morgens frühstücke ich.
  hi.a1.unit10.lesson01.teach.kaam_par_jaana:
    title: Ich gehe zur Arbeit
    gloss: Ich gehe zur Arbeit (Sprecher / Sprecherin)
    note: Bei „kaam par jaana“ (zur Arbeit gehen) braucht man das Wort „par“ (auf/an) – ein fester Ausdruck, anders als „school jaana“ weiter unten in dieser Lektion, wo kein zusätzliches Wort steht.
    example_gloss:
    - Dann gehe ich zur Arbeit.
    - Dann gehe ich zur Arbeit.
  hi.a1.unit10.lesson01.teach.habitual_paradigm_note:
    title: Das Muster des habituellen Präsens
    gloss: 'Um eine tägliche Gewohnheit auszudrücken, erhält das Verb die Endung -ta/-tee/-te, und je nach Subjekt kommt hoon/ho/hai/hain dazu: ich stehe auf (m./w.) „hoon“, du stehst auf „ho“, er/sie steht auf „hai“, sie stehen auf „hain“.'
    note: Das ganze Muster wird gleich zu Beginn dargestellt (in Lektion 1 im Dialog schon beiläufig gesehen und in Lektion 5 für die dritte Person erklärt), damit die Übungen dieser Lektion keine ungelernte Form verlangen.
  hi.a1.unit10.lesson01.teach.full_routine_phrase:
    title: Mein Morgen, Schritt für Schritt
    gloss: Ich stehe jeden Morgen um 7 auf, dann frühstücke ich, dann gehe ich zur Arbeit.
    note: Fasst die drei Routineverben dieser Lektion in einem natürlichen Satz mit zeitlicher Abfolge zusammen.
  hi.a1.unit10.lesson02.teach.sona:
    title: Ich schlafe
    gloss: Ich schlafe (Sprecher / Sprecherin)
    note: Dasselbe Muster -ta/-tee + hoon, auf ein neues Verb angewendet.
    example_gloss:
    - Ich schlafe nachts um 11.
    - Ich schlafe nachts um 10.
  hi.a1.unit10.lesson02.teach.school_jaana:
    title: Ich gehe zur Schule
    gloss: Ich gehe zur Schule (Sprecher / Sprecherin)
    note: Anders als bei „kaam par jaana“ steht bei „school jaana“ kein zusätzliches Wort vor „jaana“.
    example_gloss:
    - Ich gehe jeden Morgen um 8 zur Schule.
    - Ich gehe jeden Morgen um 8 zur Schule.
  hi.a1.unit10.lesson02.teach.tum_form_note:
    title: 'Die tum-Form: -te/-tee + ho'
    gloss: 'Bei „tum“ (du, informell) erhält das Verb -te/-tee und „ho“: du stehst auf (Frage an einen Mann) / du stehst auf (Frage an eine Frau), du schläfst (Frage an einen Mann) / du schläfst (Frage an eine Frau).'
    note: Die zweite Person desselben Paradigmas, das in Lektion 1 eingeführt wurde.
  hi.a1.unit10.lesson02.teach.addressee_gender_note:
    title: Nach wessen Geschlecht richtet sich die tum-Form?
    gloss: 'Das Verb in der tum-Form richtet sich nach dem Geschlecht der angesprochenen Person, nicht nach dem der sprechenden – fragt man Priya: „Wann stehst du auf?“ (weibliche Form); fragt man Arjun: „Wann stehst du auf?“ (männliche Form).'
    note: Ein Punkt, den man leicht übersieht; er wurde an allen tum-Formen im Dialog von Lektion 3 überprüft.
  hi.a1.unit10.lesson02.teach.kab_uthte_ho_phrase:
    title: Wann stehst du auf?
    gloss: Wann stehst du auf? (Frage an einen Mann)
    note: Eine fertige Frage mit der neuen tum-Form dieser Lektion.
  hi.a1.unit10.lesson02.teach.pahle_phir_routine:
    title: Zuerst stehe ich auf, dann frühstücke ich
    gloss: Zuerst stehe ich auf, dann frühstücke ich.
    note: „Pahle“/„phir“ (zuerst/dann) aus der Wegbeschreibung in Lektion 9 werden hier wiederverwendet, um Schritte der Routine zu ordnen.
  hi.a1.unit10.lesson02.teach.kaam_idiom_note:
    title: Kaam par und school
    gloss: „Kaam par jaana“ (zur Arbeit gehen) braucht „par“, „school jaana“ (zur Schule gehen) dagegen kein zusätzliches Wort – beides ist richtig und gebräuchlich.
    note: Ein echter idiomatischer Unterschied, keine allgemeine Regel mit Ausnahme.
  hi.a1.unit10.lesson03.teach.vaapas:
    title: Zurück
    gloss: zurück
    note: Wird mit „aana“ (kommen) im Sinn von „zurückkommen“ verwendet.
    example_gloss: Ich gehe zurück.
  hi.a1.unit10.lesson03.teach.aana:
    title: Ich komme
    gloss: Ich komme (Sprecher / Sprecherin)
    note: Ein neues Verb, das dem bereits bekannten Muster des habituellen Präsens folgt.
    example_gloss:
    - Ich komme abends zurück.
    - Ich komme abends zurück.
  hi.a1.unit10.lesson03.teach.khana_verb:
    title: Ich esse (Essen)
    gloss: Ich esse (Sprecher / Sprecherin)
    note: „Khana“ als Nomen (Essen, aus Lektion 6) und „khana“ als Verb (essen) – eine im Hindi ganz natürliche Verdopplung, kein Tippfehler.
    example_gloss:
    - Ich esse nachts.
    - Ich esse nachts.
  hi.a1.unit10.lesson03.teach.raat_ka_khana:
    title: Abendessen
    gloss: 'Abendessen (wörtlich: „Essen der Nacht“)'
    note: Verwendet „raat“ (Nacht), „ka“ (Possessiv) und „khana“ (Essen) wieder – alle bereits gelernt.
    example_gloss: Das Abendessen ist sehr lecker.
  hi.a1.unit10.lesson03.teach.dialogue.line01:
    title: Arjun fragt, wann Priya aufsteht
    gloss: Arjun fragt Priya, um wie viel Uhr sie jeden Tag aufsteht.
    note: Verwendet die weibliche tum-Form und spricht damit Priya korrekt an.
  hi.a1.unit10.lesson03.teach.dialogue.line02:
    title: Priya antwortet
    gloss: 'Priya sagt: Ich stehe jeden Morgen um 6 auf. Dann frühstücke ich.'
  hi.a1.unit10.lesson03.teach.dialogue.line03:
    title: Arjun erzählt von seinem Tagesablauf
    gloss: 'Arjun sagt: Schön! Ich stehe um 7 auf. Ich frühstücke auch, dann gehe ich zur Arbeit.'
  hi.a1.unit10.lesson03.teach.dialogue.line04:
    title: Priya fragt, wann Arjun zurückkommt
    gloss: Priya fragt Arjun, wann er zurückkommt.
    note: Verwendet die männliche tum-Form und spricht damit Arjun korrekt an. Führt „vaapas aana“ im Zusammenhang ein.
  hi.a1.unit10.lesson03.teach.dialogue.line05:
    title: Arjun beschreibt seinen Abend
    gloss: 'Arjun sagt: Ich komme abends um 6 Uhr zurück. Dann esse ich zu Abend, dann schlafe ich.'
  hi.a1.unit10.lesson03.teach.dialogue.line06:
    title: Priya beschreibt ihren Abend
    gloss: 'Priya sagt: Ich komme abends auch zurück, dann esse ich.'
  hi.a1.unit10.lesson03.teach.dialogue.line07:
    title: Arjun fragt, wann Priya schläft
    gloss: Arjun fragt, um wie viel Uhr Priya schläft.
    note: Wieder die weibliche tum-Form, passend zu Priya.
  hi.a1.unit10.lesson03.teach.dialogue.line08:
    title: Priya antwortet und verabschiedet sich
    gloss: 'Priya sagt: Ich schlafe nachts um 11 Uhr. Alles klar, bis morgen!'
  hi.a1.unit10.lesson03.teach.dialogue.line09:
    title: Arjun verabschiedet sich
    gloss: 'Arjun sagt: Alles klar, bis bald!'
