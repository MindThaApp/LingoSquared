teaching:
  hi.a1.unit14.lesson01.teach.arjun_priya_review:
    title: 'Wiederholung: Arjun, Priya, ist'
    gloss: Arjun, Priya, ist
    note: Kurze Wiederholung der Namen der beiden Figuren und der Kopula „hai“, die Sie für Vergleichssätze in dieser Lektion brauchen.
    example_gloss:
    - Arjun geht es gut.
    - Priya geht es gut.
  hi.a1.unit14.lesson01.teach.bada_badi_review:
    title: 'Wiederholung: groß / älter'
    gloss: groß / älter (maskulin / feminin)
    note: In Lektion 5 für das Alter von Geschwistern eingeführt – hier wird es erweitert, um zwei beliebige Personen oder Dinge direkt zu vergleichen.
    example_gloss:
    - Mein älterer Bruder wohnt in Delhi.
    - Meine ältere Schwester wohnt in Delhi.
  hi.a1.unit14.lesson01.teach.chota_choti_review:
    title: 'Wiederholung: klein / jünger'
    gloss: klein / jünger (maskulin / feminin)
    note: In Lektion 5 für das Alter von Geschwistern eingeführt – hier genauso verwendet wie bada/badi.
    example_gloss:
    - Mein jüngerer Bruder ist jetzt Student.
    - Meine jüngere Schwester ist jetzt Studentin.
  hi.a1.unit14.lesson01.teach.se_comparative_grammar:
    title: Se = als
    gloss: '„Se“ kennen Sie bereits in der Bedeutung „von … aus“ (Lektion 9, „yahan se seedhe jao“) und „mit“ (Lektion 12, „Priya se mila“). Jetzt dient es auch dem Vergleich: „X, Y se ADJ hai“ bedeutet „X ist ADJ-er als Y“ – zum Beispiel „Priya Arjun se badi hai“.'
    note: Zeigt die dritte Bedeutung eines schon bekannten Wortes und nennt die beiden früheren Bedeutungen mit Lektionsnummer, bevor die neue folgt.
    target_text: '''से'' पहले ''यहाँ से सीधे जाओ'' (यूनिट 9, matlab ''von/aus'') और ''प्रिया से मिला'' (यूनिट 12, matlab ''mit'') में सीखा था; अब यह तुलना के लिए भी आता है: ''X, Y से ADJ है'' का मतलब है ''X ist ADJ-er als Y'' -- जैसे ''प्रिया अर्जुन से बड़ी है''।'
  hi.a1.unit14.lesson01.teach.arjun_bada_phrase:
    title: Priya ist älter als Arjun.
    gloss: Priya ist älter als Arjun.
    note: Das erste vollständige Beispiel für den Vergleich mit „se“ in dieser Lektion.
  hi.a1.unit14.lesson01.teach.lamba_lambi:
    title: Groß gewachsen / lang
    gloss: groß gewachsen / lang (maskulin / feminin)
    note: Ein neues Adjektivpaar, das dem bekannten Muster -a/-i für Maskulinum/Femininum folgt (bada/badi, chota/choti).
    example_gloss:
    - Mein Bruder ist groß.
    - Meine Schwester ist groß.
  hi.a1.unit14.lesson01.teach.agreement_grammar:
    title: Das Adjektiv richtet sich nach dem Subjekt
    gloss: In einem Vergleichssatz richtet sich das Adjektiv (wie bada/badi, chota/choti) immer nach dem Geschlecht des SUBJEKTS, nicht nach dem Wort nach „se“ – z. B. passt „chota“ in „Arjun Priya se chota hai“ zu Arjun (maskulines Subjekt), nicht zu Priya.
    note: Eine direkte, ausdrückliche Erweiterung des bekannten Adjektivmusters -a/-i, speziell auf Vergleichssätze angewendet.
    target_text: तुलना के वाक्य में विशेषण (जैसे बड़ा/बड़ी, छोटा/छोटी) हमेशा विषय (Subjekt) के लिंग से मेल खाता है, 'से' के बाद वाले शब्द के नहीं -- जैसे 'अर्जुन प्रिया से छोटा है' में 'छोटा' अर्जुन (पुल्लिंग विषय) से मेल खाता है, प्रिया से नहीं।
  hi.a1.unit14.lesson01.teach.priya_chota_phrase:
    title: Arjun ist jünger als Priya.
    gloss: Arjun ist jünger als Priya.
    note: Dieselbe Aussage aus der Gegenrichtung – zeigt die Angleichung an ein maskulines Subjekt.
  hi.a1.unit14.lesson01.teach.kaun_ya_review:
    title: 'Wiederholung: wer, oder'
    gloss: wer, oder
    note: Beide Wörter sind schon bekannt (Lektion 5 und Lektion 6/13) – hier werden sie für eine Vergleichsfrage verwendet.
    example_gloss: Wer ist älter, Arjun oder Priya?
  hi.a1.unit14.lesson02.teach.topi_bag_review:
    title: 'Wiederholung: Mütze, Tasche'
    gloss: Mütze, Tasche
    note: Beide Nomen wurden in der Einkaufslektion 7 eingeführt – hier sind sie die beiden Dinge, die verglichen werden.
    example_gloss:
    - Diese Mütze ist schön.
    - Diese Tasche ist schön.
  hi.a1.unit14.lesson02.teach.sasta_mehnga_review:
    title: 'Wiederholung: billig, teuer'
    gloss: billig, teuer
    note: In Lektion 7 eingeführt – hier für den Vergleich von Gegenständen verwendet.
    example_gloss:
    - Die Tasche ist billig.
    - Die Tasche ist teuer.
  hi.a1.unit14.lesson02.teach.sasti_mehngi_note:
    title: 'Feminine Formen: sasti, mehngi'
    gloss: „Sasta“ und „mehnga“ werden bei femininen Wörtern zu „sasti“ und „mehngi“ – zum Beispiel „topi sasti hai“ (die Mütze ist billig).
    note: Eine kurze Erinnerung an die Angleichungsregel aus Lektion 7, denn „topi“ (Mütze) ist feminin.
  hi.a1.unit14.lesson02.teach.se_object_phrase:
    title: Die Mütze ist billiger als die Tasche.
    gloss: Die Mütze ist billiger als die Tasche.
    note: Der Vergleich mit „se“, hier auf zwei Gegenstände statt auf zwei Personen angewendet.
  hi.a1.unit14.lesson02.teach.zyada_review:
    title: 'Wiederholung: mehr'
    gloss: mehr
    note: In Lektion 13 nur mit „pasand hai“ (um eine Vorliebe auszudrücken) eingeführt – hier wird die Verwendung erweitert.
    example_gloss: Ich mag Tee lieber.
  hi.a1.unit14.lesson02.teach.zyada_mehnga_grammar:
    title: Zyada in jedem Vergleich
    gloss: „Zyada“ kannten Sie bisher nur mit „pasand hai“ (Lektion 13). Jetzt kann es auch vor JEDEM Adjektiv in einem Vergleich stehen – „bag topi se zyada mehnga hai“ bedeutet „die Tasche ist teurer als die Mütze“, genau wie „bag topi se mehnga hai“. „Zyada“ ist optional; es sagt nur ausdrücklich „mehr“.
    note: Eine offen gemachte Erweiterung der Stellungsregel eines bekannten Wortes, kein neuer Grammatikpunkt.
  hi.a1.unit14.lesson02.teach.zyada_mehnga_phrase:
    title: Die Tasche ist teurer als die Mütze.
    gloss: Die Tasche ist teurer als die Mütze.
    note: Dasselbe Vergleichsmuster mit „se“, mit dem optionalen zyada (mehr) ausdrücklich dabei.
  hi.a1.unit14.lesson02.teach.naya_nai:
    title: Neu
    gloss: neu (maskulin / feminin)
    note: Ein neues Adjektivpaar mit demselben Muster -a/-i wie alle anderen Adjektive in dieser Lektion.
    example_gloss:
    - Die Tasche ist neu.
    - Die Mütze ist neu.
  hi.a1.unit14.lesson02.teach.topi_nai_phrase:
    title: Die Mütze ist neuer als die Tasche.
    gloss: Die Mütze ist neuer als die Tasche.
    note: Ein zweites Vergleichsmerkmal (Alter/Neuheit) für dieselben zwei Gegenstände, passend zum bereits eingeführten Preisvergleich.
  hi.a1.unit14.lesson03.teach.review_words:
    title: 'Wiederholung: groß, klein, hochgewachsen, neu'
    gloss: groß/älter, klein/jünger, hochgewachsen/lang, neu
    note: Eine kurze Wiederholung der wichtigsten Adjektive dieser Lektion, die Sie für den Dialog und den Lesetext brauchen.
    example_gloss:
    - Priya ist älter.
    - Arjun ist jünger.
    - Arjun ist groß.
    - Die Tasche ist neu.
  hi.a1.unit14.lesson03.teach.main_hun_review:
    title: 'Wiederholung: ich, bin'
    gloss: ich, bin
    note: In Lektion 1 eingeführt („main theek hun“) – wird gebraucht, damit Arjun im Dialog über sich sprechen kann.
    example_gloss: Mir geht es gut.
  hi.a1.unit14.lesson03.teach.aur_bhi_review:
    title: 'Wiederholung: und, auch'
    gloss: und, auch
    note: Beide Wörter kamen schon in früheren Dialogtexten vor, werden hier aber zum ersten Mal ausdrücklich als Lernvokabular eingeführt.
    example_gloss:
    - Ich mag Tee und Kaffee.
    - Ich mag es auch.
  hi.a1.unit14.lesson03.teach.ka_review:
    title: 'Wiederholung: Besitzanzeige „von“'
    gloss: von (Besitzanzeige)
    note: Die Besitzanzeige, die im ganzen Kurs schon vorkam (z. B. Lektion 5–11) – hier verwendet, um zu sagen, wessen Tasche verglichen wird.
    example_gloss: Arjuns Tasche ist neu.
  hi.a1.unit14.lesson03.teach.dialogue.line01:
    title: Arjun zeigt seine neue Tasche
    gloss: Priya, das ist meine neue Tasche.
  hi.a1.unit14.lesson03.teach.dialogue.line02:
    title: Priya sagt, die Mütze ist billiger
    gloss: Schöne Tasche! Aber die Mütze ist billiger als eine Tasche.
  hi.a1.unit14.lesson03.teach.dialogue.line03:
    title: Arjun gibt zu, dass seine Tasche teuer ist
    gloss: Ja. Meine Tasche ist teuer – sie ist teurer als eine Mütze.
  hi.a1.unit14.lesson03.teach.dialogue.line04:
    title: Priya fragt, wer älter ist
    gloss: Okay, okay! Arjun, wer ist älter, du oder ich?
  hi.a1.unit14.lesson03.teach.dialogue.line05:
    title: Arjun antwortet
    gloss: Du bist älter, aber ich bin größer!
  hi.a1.unit14.lesson03.teach.dialogue.line06:
    title: Priya sagt, die Mütze ist auch neuer
    gloss: Okay, okay! Aber die Mütze ist auch neuer als die Tasche.
  hi.a1.unit14.lesson03.teach.dialogue.line07:
    title: Arjun stimmt zu und verabschiedet sich
    gloss: Ja, das stimmt. Sehen wir uns morgen wieder?
  hi.a1.unit14.lesson03.teach.dialogue.line08:
    title: Priya verabschiedet sich
    gloss: Okay! Bis morgen.
  hi.a1.unit14.lesson03.teach.grammar_summary:
    title: Drei Hauptregeln
    gloss: 'Die drei Hauptregeln dieser Lektion: (1) „X, Y se ADJ hai“ bedeutet „X ist ADJ-er als Y“; (2) das ADJ richtet sich immer nach dem Geschlecht des Subjekts (X), nicht nach Y; (3) „zyada“ kann auch vor dem ADJ stehen, z. B. „X, Y se zyada ADJ hai“ – die Bedeutung bleibt gleich („ADJ-er als“).'
    note: Eine abschließende Zusammenfassung der Grammatik der ganzen Lektion, wie die Übersichtsnotiz in Lektion 13.
    target_text: 'इस यूनिट के तीन मुख्य नियम: (1) ''X, Y से ADJ है'' का मतलब है ''X ist ADJ-er als Y''; (2) ADJ हमेशा विषय (X) के लिंग से मेल खाता है, Y से नहीं; (3) ADJ से पहले ''ज़्यादा'' भी जोड़ सकते हैं, जैसे ''X, Y से ज़्यादा ADJ है'' -- मतलब वही रहता है (''ADJ-er als'')।'
  hi.a1.unit14.lesson03.teach.priya_note:
    title: Priyas Notiz
    gloss: Ich bin älter als Arjun, aber Arjun ist groß. Und meine Mütze ist schön – die Mütze ist günstiger als die Tasche, und die Mütze ist auch neuer als die Tasche. – Priya
    note: Eine kurze schriftliche Notiz, die genau die im Dialog genannten Fakten wiederholt, ohne neue Aussagen.
    glosses:
      बड़ी: älter (weiblich)
      लंबा: groß gewachsen
      टोपी: Mütze
      अच्छी: schön / gut (weiblich)
      बैग: die Tasche
      सस्ती: günstiger / günstig (weiblich)
      नई: neuer / neu (weiblich)
