answer_policy:
  weather_existential: '"Aaj/kal + [weather word] + hai" states the current or a stated day''s weather -- *dhoop hai* ("it''s sunny"), *baarish hai* ("it''s raining"), *hawa hai* ("it''s windy") are each stated as a bare existential sentence, not a progressive verb form. A typed answer using the correct weather noun with *hai* is accepted; using *hain* where the sentence''s own subject is singular (or vice versa) is judged as a real grammar error, the exact contrast this unit''s own grammar_check exercises target -- not tolerated as a minor typo.'
  garm_invariant_thanda_agrees: '*Garm* ("hot") never changes for gender or number -- "mausam garm hai" always uses *garm*. *Thanda*/*thandi* ("cold") DOES change with the noun''s gender, the same "-a"/"-i" pattern already taught for *bada*/*badi* (unit 14) -- masculine *mausam* takes *thanda*, a feminine noun would take *thandi*. Every exercise in this unit pairs *thanda*/*thandi* with *mausam* only, so only *thanda* is ever actually required as a typed answer here; a typed answer using the wrong gender form where one IS tested is marked incorrect as a real grammar error, not tolerated as a typo.'
  kal_context_ambiguity: '*Kal* means both "yesterday" (as taught in units 4/12) and "tomorrow" (as used throughout this unit) -- genuinely ambiguous in real Hindi, disambiguated only by the sentence''s own tense/context. This unit''s own sentences are all future/plan-making in context, so *kal* consistently means "tomorrow" here; don''t mark a learner''s own free sentence wrong merely for using *kal* to mean "yesterday" in a DIFFERENT context than this unit''s own scenario, since both meanings are equally correct Hindi.'
  suggestion_pattern: '"Chalo" + a habitual-plural verb form (e.g. *jaate hain*, *chalte hain*) makes a "Let''s ___" suggestion, the same pattern already used for "chalo, kuch khaate hain!" (unit 6) and "chalo, kuch kharidte hain!" (unit 7). *Jaate hain* here is the same "-te hain" habitual form applied to *jaana* ("to go," unit 15''s infinitive), not a new verb.'
  punctuation: Hindi text is shown with the traditional danda (।) as the sentence-final mark. In typed answers, accept the danda, a plain period (.), or the mark omitted entirely as equivalent. Question marks (?) may likewise be omitted, but the fully punctuated form remains the model answer.
  spoken_answers: Judge spoken responses by intelligibility rather than written punctuation. For any exercise asking the learner to describe today's or tomorrow's weather, accept any of this unit's taught phrasings that fit the prompt, not only the single model sentence given in `accepted_answers`.
course:
  title: Hindi A1
units:
  hi.a1.unit19.weather:
    title: Wetter
lessons:
  hi.a1.unit19.lesson01.mausam_dhoop_baarish_hawa:
    title: Wetter, Sonne, Regen und Wind
  hi.a1.unit19.lesson02.garam_thanda_baadal:
    title: Heiß, kalt und Wolken
  hi.a1.unit19.lesson03.priya_arjun_kal_ka_mausam:
    title: 'Priya und Arjun: Wie wird das Wetter morgen?'
teaching:
  hi.a1.unit19.lesson01.teach.aaj_review:
    title: 'Wiederholung: heute'
    gloss: heute
    note: Zum ersten Mal in Einheit 3 behandelt – das wiederkehrende Zeitwort dieser Einheit, zusammen mit *kal* (morgen) in Lektion 3.
    example_gloss: Heute ist der Dritte.
  hi.a1.unit19.lesson01.teach.mausam:
    title: Wetter
    gloss: Wetter
    note: Ein neues Nomen, das Themenwort dieser Einheit. Maskulin – siehe die Grammatikhinweise dieser Einheit zur Genusübereinstimmung.
    example_gloss: Wie ist das Wetter heute?
  hi.a1.unit19.lesson01.teach.kaisa_review:
    title: 'Wiederholung: wie beschaffen / wie ist es'
    gloss: wie beschaffen / wie ist es
    note: Zum ersten Mal in Einheit 12 behandelt – hier wieder verwendet, um nach dem Wetter zu fragen.
    example_gloss: Wie ist dein Haus?
  hi.a1.unit19.lesson01.teach.hai_hain_review:
    title: 'Wiederholung: ist, sind'
    gloss: ist (Singular), sind (Plural)
    note: Das Singular-/Plural-Paar der Kopula, auf dem das gesamte Wettermuster dieser Einheit beruht.
    example_gloss:
    - Heute ist das Wetter gut.
    - Im Haus gibt es drei Zimmer.
  hi.a1.unit19.lesson01.teach.dhoop:
    title: Sonne / Sonnenschein
    gloss: Sonne / Sonnenschein
    note: 'Ein neues Nomen. Es steht als einfacher Existenzsatz: *aaj dhoop hai* = „Heute ist es sonnig“ (wörtlich „heute gibt es Sonnenschein“).'
    example_gloss: Heute scheint die Sonne.
  hi.a1.unit19.lesson01.teach.baarish:
    title: Regen
    gloss: Regen
    note: 'Ein neues Nomen. Es steht als einfacher Existenzsatz: *aaj baarish hai* = „Heute regnet es“.'
    example_gloss: Heute regnet es.
  hi.a1.unit19.lesson01.teach.hawa:
    title: Wind
    gloss: Wind
    note: 'Ein neues Nomen. Es steht als einfacher Existenzsatz: *aaj hawa hai* = „Heute ist es windig“.'
    example_gloss: Heute ist es windig.
  hi.a1.unit19.lesson01.teach.grammar_mausam_existential:
    title: Das Wettermuster mit „hai“
    gloss: Um das Wetter zu beschreiben, sagt man „aaj/kal + [Wetterwort] + hai“ – z. B. „aaj dhoop hai“, „aaj baarish hai“, „aaj hawa hai“. Es ist dasselbe hai/hain-Muster, das Sie schon für das Haus gelernt haben (Einheit 18), hier aber ohne Zahl, direkt als Subjekt.
    note: Die erste Grammatikanmerkung dieser Einheit; sie verbindet den neuen Wortschatz mit einem bereits bekannten Satzmuster.
  hi.a1.unit19.lesson02.teach.mausam_review:
    title: 'Wiederholung: Wetter'
    gloss: Wetter
    note: Aus Lektion 1 dieser Einheit wieder aufgegriffen.
    example_gloss: Wie ist das Wetter heute?
  hi.a1.unit19.lesson02.teach.garam:
    title: Heiß
    gloss: heiß
    note: Ein neues Adjektiv. Es verändert sich nicht nach Genus – siehe die Grammatikanmerkung dieser Lektion.
    example_gloss: Heute ist das Wetter heiß.
  hi.a1.unit19.lesson02.teach.thanda_thandi:
    title: Kalt (mask. / fem.)
    gloss: kalt (maskulin), kalt (feminin)
    note: Ein neues Adjektiv. Es verändert sich im Unterschied zu *garm* nach dem Genus – das maskuline *mausam* steht mit *thanda*, feminine Nomen (wie *rasoi*, Einheit 18) mit *thandi* – siehe die Grammatikanmerkung dieser Lektion.
    example_gloss:
    - Das Wetter ist heute kalt.
    - Heute ist die Küche kalt.
  hi.a1.unit19.lesson02.teach.grammar_garam_thanda:
    title: Unveränderliche und genusabhängige Adjektive
    gloss: „Garm“ ist ein auf Konsonant endendes Adjektiv und verändert sich nicht nach Genus – bei „mausam garm hai“ bleibt es immer „garm“. „Thanda“/„thandi“ dagegen ist ein Adjektiv auf „-a“ und verändert sich nach Genus, genau wie „bada“/„badi“ (Einheit 14) – zum maskulinen „mausam“ gehört „thanda“, zu einem femininen Nomen „thandi“.
    note: 'Der zentrale Grammatikkontrast dieser Einheit: Ein neues Adjektivpaar wird mit der bereits gelernten Regel aus Einheit 14 verbunden.'
  hi.a1.unit19.lesson02.teach.baadal:
    title: Wolke(n)
    gloss: Wolke(n)
    note: 'Ein neues Nomen, das in dieser Einheit nur in seiner natürlichen Plural-Existenzform vorkommt: *aaj baadal hain* = „Heute gibt es Wolken“ / „Heute ist es bewölkt“.'
    example_gloss: Heute gibt es Wolken.
  hi.a1.unit19.lesson02.teach.accha_review:
    title: 'Wiederholung: gut'
    gloss: gut
    note: Zum ersten Mal in Einheit 9 behandelt – hier wieder verwendet, um das Wetter zu beschreiben.
    example_gloss: Heute ist das Wetter gut.
  hi.a1.unit19.lesson02.teach.bura:
    title: Schlecht
    gloss: schlecht
    note: Ein neues Adjektiv, dem bereits gelernten *accha* (gut) gegenübergestellt. Es kommt in dieser Einheit nur in der maskulinen Form vor, passend zu *mausam*.
    example_gloss: Heute ist das Wetter schlecht.
  hi.a1.unit19.lesson02.teach.bahut_review:
    title: 'Wiederholung: sehr'
    gloss: sehr
    note: Zum ersten Mal in Einheit 6 behandelt – hier wieder verwendet, um eine Wetterbeschreibung zu verstärken.
    example_gloss: Heute ist das Wetter sehr kalt.
  hi.a1.unit19.lesson03.teach.kal_review:
    title: 'Wiederholung: morgen (auch: gestern)'
    gloss: morgen (bedeutet je nach Kontext auch „gestern“)
    note: Zum ersten Mal in Einheit 4 behandelt, in Einheit 12 für „gestern“ wieder aufgegriffen – im echten Hindi tatsächlich mehrdeutig und nur durch den Kontext klar. Die Sätze dieser Einheit beziehen sich alle auf die Zukunft und auf Pläne, daher bedeutet „kal“ hier „morgen“.
    example_gloss: Morgen regnet es.
  hi.a1.unit19.lesson03.teach.ghar_review:
    title: 'Wiederholung: Haus / Zuhause'
    gloss: Haus / Zuhause
    note: Zum ersten Mal in Einheit 8 behandelt – hier wieder verwendet für den daraus folgenden Plan (zu Hause bleiben).
    example_gloss: Das ist ein Haus.
  hi.a1.unit19.lesson03.teach.mein_review:
    title: 'Wiederholung: in / an'
    gloss: in / an
    note: Zum ersten Mal in Einheit 1 behandelt – hier wieder verwendet in „ghar mein“ (zu Hause).
    example_gloss: Im Haus gibt es drei Zimmer.
  hi.a1.unit19.lesson03.teach.hum_review:
    title: 'Wiederholung: wir'
    gloss: wir
    note: Zum ersten Mal in Einheit 11 behandelt – hier wieder verwendet als Subjekt der Planung in dieser Lektion.
    example_gloss: Wir sehen einen Film.
  hi.a1.unit19.lesson03.teach.rehte_hain_review:
    title: 'Wiederholung: [sie/wir] bleiben / wohnen'
    gloss: '[sie/wir] bleiben / wohnen'
    note: Zum ersten Mal in Einheit 5 behandelt (mit einem einzelnen Großvater, über die maskuline Pluralform als Höflichkeitsform) – in dieser Einheit erstmals mit einem echten Plural-Subjekt, „hum“ (wir); dieselbe Verbform, einfacher angewendet.
    example_gloss: Mein Großvater wohnt in Delhi.
  hi.a1.unit19.lesson03.teach.chalo_review:
    title: 'Wiederholung: lass uns / los'
    gloss: Lass uns … / Auf geht's
    note: Wurde in Lektion 1 eingeführt und in den Lektionen 6/7/11 mit einem Verb im habituellen Plural für „Lass uns …“ wiederverwendet – hier ebenso.
    example_gloss: Lass uns etwas essen!
  hi.a1.unit19.lesson03.teach.jaana_review:
    title: 'Wiederholung: gehen'
    gloss: gehen
    note: In Lektion 15 als reiner Infinitiv eingeführt – hier wird er um die habituelle Pluralform „jaate hain“ (wir gehen) erweitert, dieselbe Bildung wie bei „dekhte hain“/„peete hain“ in Lektion 11.
    example_gloss: Ich muss zum Bahnhof gehen.
  hi.a1.unit19.lesson03.teach.aur_review:
    title: 'Wiederholung: und'
    gloss: und
    note: In Lektion 1 eingeführt – hier wiederverwendet, um Wetter und Temperatur von morgen zu verbinden.
    example_gloss: Morgen regnet es und das Wetter ist kalt.
  hi.a1.unit19.lesson03.teach.bahar:
    title: Draußen
    gloss: draußen
    note: Ein neues Wort aus dem Wortschatz dieser Lektion für den daraus folgenden Plan.
    example_gloss: Lass uns nach draußen gehen!
  hi.a1.unit19.lesson03.teach.jaate_hain_phrase:
    title: Lass uns nach draußen gehen!
    gloss: Lass uns nach draußen gehen!
    note: „Chalo“ + habitueller Plural „jaate hain“ (von „jaana“, gehen) – dasselbe „Lass uns …“-Muster wie in den Lektionen 1/6/7/11.
  hi.a1.unit19.lesson03.teach.dialogue.line01:
    title: Arjun fragt Priya nach dem heutigen Wetter
    gloss: Priya, wie ist das Wetter heute?
  hi.a1.unit19.lesson03.teach.dialogue.line02:
    title: Priya beschreibt das heutige Wetter
    gloss: Heute ist es sonnig und das Wetter ist heiß.
  hi.a1.unit19.lesson03.teach.dialogue.line03:
    title: Arjun schlägt vor, nach draußen zu gehen
    gloss: Prima! Lass uns nach draußen gehen.
  hi.a1.unit19.lesson03.teach.dialogue.line04:
    title: Priya fragt nach dem Wetter von morgen
    gloss: Okay! Und wie ist das Wetter morgen?
  hi.a1.unit19.lesson03.teach.dialogue.line05:
    title: Arjun beschreibt das Wetter von morgen
    gloss: Morgen regnet es und das Wetter ist kalt.
  hi.a1.unit19.lesson03.teach.dialogue.line06:
    title: Priya schlägt vor, zu Hause zu bleiben
    gloss: Dann bleiben wir morgen zu Hause?
  hi.a1.unit19.lesson03.teach.dialogue.line07:
    title: Arjun stimmt zu
    gloss: Ja, morgen bleiben wir zu Hause.
  hi.a1.unit19.lesson03.teach.dialogue.line08:
    title: Priya stimmt zu
    gloss: Okay!
  hi.a1.unit19.lesson03.teach.grammar_summary:
    title: Drei Hauptregeln
    gloss: 'Die drei Hauptregeln dieser Lektion: (1) „aaj/kal + [Wetterwort] + hai/hain“ beschreibt das Wetter; (2) „garm“ verändert sich nicht nach dem Geschlecht, „thanda“/„thandi“ dagegen schon, genau wie „bada“/„badi“; (3) „chalo“ + ein Verb im habituellen Plural (z. B. „jaate hain“) ergibt einen Vorschlag – „chalo, bahar jaate hain!“.'
    note: Eine abschließende Zusammenfassung, die die Grammatik der ganzen Lektion verbindet – wie die Grammatikhinweise in den Lektionen 15–18, die ein Paradigma zusammenfassen.
  hi.a1.unit19.lesson03.teach.weather_reading:
    title: Lesetext über heute und morgen
    gloss: Heute ist das Wetter heiß und es ist sonnig. Lass uns nach draußen gehen! Morgen regnet es und das Wetter ist kalt. Morgen bleiben wir zu Hause.
    note: Ein kurzes, direktes Profil (ohne neue Rahmenhandlung), das genau die im Dialog genannten Fakten wiederholt, ohne neue Aussagen – es dient direkt dem Lernziel, eine kurze Wettervorhersage zu lesen.
    glosses:
      आज: heute
      मौसम: Wetter
      गर्म: heiß
      धूप: Sonnenschein
      चलो: lass uns
      बाहर: draußen
      जाते: gehen (von जाना)
      कल: morgen
      बारिश: Regen
      ठंडा: kalt
      रहते: bleiben / wohnen (von रहना)
