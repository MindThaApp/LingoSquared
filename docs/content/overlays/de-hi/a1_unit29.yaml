teaching:
  hi.a1.unit29.lesson01.teach.kul_kitna_hua:
    title: Nach dem Gesamtpreis fragen
    gloss: Wie viel kostet es insgesamt?
    note: '*कुल* bedeutet „insgesamt“, und *कितना हुआ?* („wie viel ist es geworden?“) ist die alltägliche Art, nach dem Gesamtbetrag zu fragen.'
  hi.a1.unit29.lesson01.teach.kul_pachchees_rupye:
    title: Den Gesamtpreis nennen
    gloss: Es kostet insgesamt zweihundertfünfzig Rupien.
    note: '*हुए* richtet sich nach dem Plural *रुपये*: *कुल दो सौ पचास रुपये हुए* heißt wörtlich „insgesamt wurden es zweihundertfünfzig Rupien“.'
  hi.a1.unit29.lesson02.teach.kard_se_pement:
    title: Mit Karte oder bar bezahlen
    gloss: mit Karte bezahlen, bar bezahlen
    note: Hindi sagt *कार्ड से पेमेंट करना* („Zahlung per Karte machen“) und *नकद पेमेंट करना*; *से* kennzeichnet das Zahlungsmittel.
    example_gloss:
    - Kann ich hier mit Karte zahlen?
    - Ich zahle bar.
  hi.a1.unit29.lesson02.teach.kya_main_yahan:
    title: Fragen, ob Kartenzahlung möglich ist
    gloss: Kann ich hier mit Karte zahlen?
    note: '*यहाँ* („hier“) nennt den Ort, und *सकता हूँ* („kann“) steht nach der restlichen Wortgruppe; eine Frau sagt *सकती हूँ*.'
  hi.a1.unit29.lesson02.teach.ap_nakad_pement:
    title: Nach der Zahlungsart fragen
    gloss: Möchten Sie bar oder mit Karte zahlen?
    note: '*आप ... करेंगे* ist die höfliche Zukunftsfrage, wie sie ein Kassierer stellt, und *आप* verlangt die Pluralform *करेंगे*.'
  hi.a1.unit29.lesson03.teach.bil:
    title: Die Rechnung
    gloss: die Rechnung
    note: '*बिल* ist ein maskulines Nomen: *एक बिल*, *बिल का*.'
    example_gloss: Teilen wir die Rechnung?
  hi.a1.unit29.lesson03.teach.bil_bant_len:
    title: Vorschlagen, die Rechnung zu teilen
    gloss: Teilen wir die Rechnung?
    note: '*बाँट लें?* („sollen wir teilen?“) schlägt etwas gemeinsam vor, ohne *हम* zu nennen; *लें* ist die „Lass uns“-Form von *लेना*.'
  hi.a1.unit29.lesson03.teach.kya_main_alag:
    title: Bitten, getrennt zu zahlen
    gloss: Darf ich getrennt bezahlen?
    note: '*अलग से* bedeutet „getrennt“ und steht vor *पेमेंट कर सकता हूँ*.'
  hi.a1.unit29.lesson04.teach.bakee_paise:
    title: Das Wechselgeld
    gloss: das Wechselgeld
    note: '*बाकी पैसे* („das restliche Geld“) steht im Plural und meint das Wechselgeld, das Sie zurückbekommen.'
    example_gloss: Hier ist Ihr Wechselgeld.
  hi.a1.unit29.lesson04.teach.ye_rahe_apke:
    title: Wechselgeld zurückgeben
    gloss: Hier ist Ihr Wechselgeld.
    note: '*आपके* ist das höfliche „Ihr“ (*आप* + *के*) und richtet sich nach dem Plural *पैसे*.'
  hi.a1.unit29.lesson04.teach.mujhe_bakee_paise:
    title: Wechselgeld ablehnen
    gloss: Ich brauche kein Wechselgeld.
    note: '*मुझे ... नहीं चाहिए* („mir ... nicht nötig“) ist die Hindi-Art, „Ich brauche ... nicht“ zu sagen; *नहीं* steht vor *चाहिए*.'
  hi.a1.unit29.lesson05.teach.paintees:
    title: Dreihundertfünfzig
    gloss: dreihundertfünfzig
    note: '*तीन सौ पचास* ist 350: Man nennt zuerst die Hunderter, dann die Zehner.'
    example_gloss: Es kostet dreihundertfünfzig Rupien.
  hi.a1.unit29.lesson05.teach.bil_do_thalee:
    title: Eine Restaurantrechnung lesen
    gloss: 'Rechnung: zwei Thalis und zwei Tee. Gesamt: dreihundertfünfzig Rupien. Zahlung: mit Karte.'
    note: Achten Sie darauf, was bestellt wurde, wie hoch der Gesamtbetrag ist und wie bezahlt wurde.
    glosses:
      बिल: Rechnung
      दो: zwei
      थाली: Thalis
      चाय: Tees
      कुल: Gesamtbetrag
      तीन: drei
      सौ: hundert
      पचास: fünfzig
      रुपये: Rupien
      पेमेंट: Zahlung
      कार्ड: Karte
  hi.a1.unit29.lesson06.teach.priya_bil_mang:
    title: Priya bittet um die Rechnung
    gloss: 'Priya: Sollen wir die Rechnung bestellen?'
    note: '*माँग लें?* („sollen wir sie verlangen?“) verwendet wieder die „Lass uns“-Form von *लेना*, und *माँगना* bedeutet „verlangen, bitten um“.'
  hi.a1.unit29.lesson06.teach.arjun_han_achchha:
    title: Arjun fragt nach dem Gesamtbetrag
    gloss: 'Arjun: Ja, gute Idee. Wie viel ist es insgesamt?'
    note: '*कुल कितना हुआ?* ist die Frage nach dem Gesamtbetrag von vorhin, jetzt am Tisch gestellt.'
  hi.a1.unit29.lesson06.teach.priya_paintees_rupye:
    title: Priya nennt den Gesamtbetrag
    gloss: 'Priya: Es sind dreihundertfünfzig Rupien. Sollen wir teilen?'
    note: '*तीन सौ पचास रुपये हुए* nennt den Gesamtbetrag, und *बाँट लें?* fragt „sollen wir teilen?“.'
  hi.a1.unit29.lesson06.teach.arjun_naheen_aj:
    title: Arjun besteht darauf zu zahlen
    gloss: 'Arjun: Nein, lass mich heute zahlen. Du hast mir so sehr geholfen.'
    note: '*मुझे पेमेंट करने दो* bedeutet „lass mich zahlen“, und *तुमने मेरी बहुत मदद की है* hat *ने*, weil das Verb in der Vergangenheit steht.'
  hi.a1.unit29.lesson06.teach.priya_tum_kitne:
    title: Priya ist gerührt
    gloss: 'Priya: Wie lieb von dir! Vielen Dank.'
    note: '*तुम कितने अच्छे हो!* („wie nett du bist“) ist ein herzliches Kompliment, und *शुक्रिया* bedeutet „danke“.'
  hi.a1.unit29.lesson06.teach.arjun_kya_main:
    title: Arjun fragt nach Kartenzahlung
    gloss: 'Arjun: Kann ich hier mit Karte bezahlen?'
    note: Die Frage *क्या मैं यहाँ कार्ड से पेमेंट कर सकता हूँ?* kommt noch einmal vor, jetzt in einem echten Restaurant.
  hi.a1.unit29.lesson06.teach.arjun_bil_deta:
    title: 'देता है: er bezahlt'
    gloss: Arjun bezahlt die Rechnung.
    note: '*देता है* ist die *वह*-Form von *देना* („geben“); Hindi sagt „die Rechnung geben“ für „die Rechnung bezahlen“.'
