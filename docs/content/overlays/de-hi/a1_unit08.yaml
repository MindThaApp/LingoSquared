teaching:
  hi.a1.unit08.lesson01.teach.ghar_school:
    title: Zuhause, Schule
    gloss: Zuhause / Haus, Schule
    note: Zwei häufige Orte, die in dieser Einheit immer wieder vorkommen.
    example_gloss:
    - Das ist ein Haus.
    - Das ist eine Schule.
  hi.a1.unit08.lesson01.teach.aspatal_bank:
    title: Krankenhaus, Bank
    gloss: Krankenhaus, Bank
    note: Zwei weitere häufige Orte, die Sie in einem Viertel vielleicht suchen müssen.
    example_gloss:
    - Das ist ein Krankenhaus.
    - Das ist eine Bank.
  hi.a1.unit08.lesson01.teach.park_station:
    title: Park, Bahnhof
    gloss: Park, Bahnhof
    note: Die letzten zwei häufigen Orte dieser Einheit.
    example_gloss:
    - Das ist ein Park.
    - Das ist ein Bahnhof.
  hi.a1.unit08.lesson01.teach.yahan_wahan:
    title: Hier, dort
    gloss: hier, dort
    note: Ein grundlegendes Paar, um zu zeigen, wo etwas ist.
    example_gloss:
    - Die Schule ist hier.
    - Die Bank ist dort.
  hi.a1.unit08.lesson01.teach.school_kahan_hai:
    title: Wo ist die Schule?
    gloss: Wo ist die Schule?
    note: Greift *kahaan* (wo) auf, das schon in Einheit 1 vorkam; jetzt fragt es nach einem Ort statt nach der Herkunft einer Person.
  hi.a1.unit08.lesson01.teach.school_yahan_hai:
    title: Die Schule ist hier
    gloss: Die Schule ist hier.
    note: Eine Beispielantwort mit *yahaan*.
  hi.a1.unit08.lesson01.teach.bank_kahan_hai:
    title: Wo ist die Bank?
    gloss: Wo ist die Bank?
    note: Dasselbe Fragemuster, mit einem anderen Ort.
  hi.a1.unit08.lesson01.teach.bank_wahan_hai:
    title: Die Bank ist dort
    gloss: Die Bank ist dort.
    note: Eine Beispielantwort mit *wahaan*.
  hi.a1.unit08.lesson02.teach.paas:
    title: In der Nähe
    gloss: in der Nähe von
    note: Wird hier zum ersten Mal richtig eingeführt – bisher kam es nur in den Beispielsätzen von Einheit 2 vor (*mere paas*, „ich habe“, wörtlich „nahe bei mir“), ohne je als eigenes Wort erklärt zu werden.
    example_gloss: Die Bank ist in der Nähe.
  hi.a1.unit08.lesson02.teach.door:
    title: Weit
    gloss: weit
    note: Das Gegenteil von *paas*.
    example_gloss: Der Bahnhof ist weit weg.
  hi.a1.unit08.lesson02.teach.ke_paas_note:
    title: Ke paas
    gloss: '''Ke paas'' bedeutet in der Nähe eines Ortes, zum Beispiel ''school bank ke paas hai'' (Die Schule ist in der Nähe der Bank). Es ist dasselbe ''paas'' wie zuvor in ''mere paas'' (ich habe); dort bedeutete es „in meinem Besitz“, hier bedeutet es „in der Nähe“ -- ein Wort, zwei verschiedene Verwendungen.'
    note: Eine neue Postposition, die auf einem bereits bekannten Wort aufbaut; die frühere Bedeutung wird ausdrücklich genannt, damit die beiden Verwendungen nicht verwechselt werden.
  hi.a1.unit08.lesson02.teach.school_bank_ke_paas_hai:
    title: Die Schule ist in der Nähe der Bank
    gloss: Die Schule ist in der Nähe der Bank.
    note: Ein Beispielsatz mit *ke paas*.
  hi.a1.unit08.lesson02.teach.samne_peeche:
    title: Gegenüber, hinter
    gloss: gegenüber / vor, hinter
    note: Ein zweites Paar von Ortsangaben, die ebenfalls mit *ke* stehen.
    example_gloss:
    - Das Krankenhaus ist gegenüber dem Bahnhof.
    - Der Park ist hinter der Schule.
  hi.a1.unit08.lesson02.teach.samne_peeche_note:
    title: Samne und peeche
    gloss: '''Samne'' und ''peeche'' stehen wie ''paas'' mit ''ke'' -- und sie sind Gegensätze: ''paark school ke peeche hai'' und ''school paark ke samne hai'' beschreiben genau dieselbe Lage, nur aus zwei verschiedenen Blickwinkeln.'
    note: Dieselbe Tatsache auf zwei Arten ausgedrückt -- ein nützlicher Grammatikpunkt dazu, wie die beiden Wörter zusammenhängen.
  hi.a1.unit08.lesson02.teach.school_park_ke_samne_hai:
    title: Die Schule ist gegenüber dem Park
    gloss: Die Schule ist gegenüber dem Park.
    note: Die andere Seite derselben Tatsache wie bei *paark school ke peeche hai* oben.
  hi.a1.unit08.lesson03.teach.dakghar:
    title: Postamt
    gloss: Postamt
    note: Ein neuer häufiger Ort für den Dialog am Ende dieser Einheit.
    example_gloss: Das Postamt ist in der Nähe der Bank.
  hi.a1.unit08.lesson03.teach.dakghar_kahan_hai:
    title: Wo ist das Postamt?
    gloss: Wo ist das Postamt?
    note: Eröffnet den Dialog am Ende dieser Einheit.
  hi.a1.unit08.lesson03.teach.dialogue.line01:
    title: Arjun fragt nach dem Postamt
    gloss: Arjun fragt Priya, wo das Postamt ist.
    note: Greift die Eröffnungsphrase dieser Lektion wieder auf.
  hi.a1.unit08.lesson03.teach.dialogue.line02:
    title: Priya antwortet
    gloss: Priya sagt, es ist in der Nähe der Bank.
    note: Greift *ke paas* aus Lektion 2 wieder auf.
  hi.a1.unit08.lesson03.teach.dialogue.line03:
    title: Arjun fragt nach dem Krankenhaus
    gloss: Arjun sagt „Aha“ und fragt, wo das Krankenhaus ist.
    note: Greift *achchha* (okay / aha) aus früheren Einheiten wieder auf.
  hi.a1.unit08.lesson03.teach.dialogue.line04:
    title: Priya antwortet
    gloss: Priya sagt, das Krankenhaus ist gegenüber dem Bahnhof.
    note: Greift *ke samne* aus Lektion 2 wieder auf.
  hi.a1.unit08.lesson03.teach.dialogue.line05:
    title: Arjun fragt, ob es weit ist
    gloss: 'Arjun fragt: Ist der Bahnhof weit weg?'
    note: Greift *door* aus Lektion 2 wieder auf.
  hi.a1.unit08.lesson03.teach.dialogue.line06:
    title: Priya bestätigt und stellt gegenüber
    gloss: Priya sagt Ja, ein bisschen weit -- die Bank ist in der Nähe.
    note: 'Führt *thoda* (ein bisschen) ein und bleibt stimmig: Der Bahnhof ist weit, die Bank bleibt nah.'
  hi.a1.unit08.lesson03.teach.dialogue.line07:
    title: Arjun fragt nach dem Park
    gloss: Arjun sagt „Okay“ und fragt, wo der Park ist.
  hi.a1.unit08.lesson03.teach.dialogue.line08:
    title: Priya antwortet
    gloss: Priya sagt, der Park ist hinter der Schule.
    note: Greift *ke peeche* aus Lektion 2 wieder auf.
  hi.a1.unit08.lesson03.teach.dialogue.line09:
    title: Arjun kommt darauf
    gloss: 'Arjun sagt: Dann ist die Schule also vor dem Park!'
    note: Führt *to* (also/dann) ein und verknüpft die Aussage mit dem Grammatikhinweis zu *samne*/*peeche* aus Lektion 2.
  hi.a1.unit08.lesson03.teach.dialogue.line10:
    title: Priya bestätigt
    gloss: 'Priya sagt: Ja, das stimmt!'
    note: Führt *sahi* (richtig/korrekt) ein.
  hi.a1.unit08.lesson03.teach.dialogue.line11:
    title: Arjun bedankt sich bei Priya
    gloss: 'Arjun sagt: Vielen Dank, Priya!'
    note: Greift *bahut* (sehr/viel) und *shukriya* aus früheren Einheiten wieder auf.
  hi.a1.unit08.lesson03.teach.dialogue.line12:
    title: Priya verabschiedet sich
    gloss: 'Priya sagt: Kein Problem! Bis bald.'
    note: Greift die Standard-Abschiedsformeln dieses Kurses aus früheren Einheiten wieder auf.
