teaching:
  hi.a1.unit06.lesson01.teach.khana:
    title: Essen
    gloss: Essen, Mahlzeit
    note: Das allgemeine Wort für Essen, das in dieser Einheit durchgehend vorkommt.
    example_gloss: Mein Essen ist jetzt fertig.
  hi.a1.unit06.lesson01.teach.chai_coffee:
    title: Tee, Kaffee
    gloss: Tee, Kaffee
    note: Zwei gängige Getränke, mit denen in dieser Einheit das Muster *mujhe ... chahiye* geübt wird.
    example_gloss:
    - Ich möchte Tee.
    - Ich möchte Kaffee.
  hi.a1.unit06.lesson01.teach.pani_juice:
    title: Wasser, Saft
    gloss: Wasser, Saft
    note: Zwei weitere gängige Getränke; es ist keine Angleichung an das Genus nötig, da *chahiye* unveränderlich ist.
    example_gloss:
    - Ich hätte gern Wasser.
    - Ich möchte Saft.
  hi.a1.unit06.lesson01.teach.chahiye_note:
    title: Mujhe ... chahiye
    gloss: '*Mujhe ... chahiye* bedeutet „Ich möchte …“. Es ändert sich nicht nach dem Geschlecht der sprechenden Person (anders als *chahta/chahti*), und danach steht nie *hai*.'
    note: 'Der zentrale Grammatikpunkt dieser Einheit: Ein sehr häufiger Lernfehler ist, nach *chahiye* noch *hai* anzuhängen, weil fast alle bisher gelernten Sätze so enden. *Chahiye* ist für sich allein bereits ein vollständiges Prädikat.'
  hi.a1.unit06.lesson01.teach.aapko_kya_chahiye:
    title: Was möchten Sie? (förmlich)
    gloss: Was möchten Sie?
    note: Die förmliche Frage mit *aap*, wie sie ein Kellner oder Gastgeber höflich an jemanden richtet.
  hi.a1.unit06.lesson01.teach.tumhein_kya_chahiye:
    title: Was möchtest du? (informell)
    gloss: Was möchten Sie?
    note: Das informelle Dativpronomen mit *tum*, parallel zu *mujhe* und zu *tumhara/tumhari* aus Einheit 5.
  hi.a1.unit06.lesson01.teach.chai_chahiye_shukriya:
    title: Ich möchte Tee, danke
    gloss: Ich möchte Tee, danke.
    note: Eine natürliche, höfliche Antwort beim Bestellen, in der *shukriya* aus früheren Einheiten wieder vorkommt.
  hi.a1.unit06.lesson01.teach.bahut:
    title: Sehr
    gloss: sehr
    note: Ein häufiges Verstärkungswort, das in dieser Einheit durchgehend zur Beschreibung von Essen und Getränken dient.
    example_gloss: Dieser Tee ist sehr gut.
  hi.a1.unit06.lesson01.teach.swadisht:
    title: Köstlich
    gloss: köstlich, lecker
    note: Ein nützliches Wort, um auf Essen zu reagieren – siehe die Grammatiknotiz in Lektion 3 dieser Einheit, warum es sich nie nach dem Genus ändert.
    example_gloss: Dieses Essen ist sehr lecker.
  hi.a1.unit06.lesson02.teach.roti_chawal:
    title: Fladenbrot, Reis
    gloss: Fladenbrot, Reis
    note: Zwei Grundnahrungsmittel einer alltäglichen indischen Mahlzeit.
    example_gloss:
    - Ich möchte Brot.
    - Ich möchte Reis.
  hi.a1.unit06.lesson02.teach.sabzi_daal:
    title: Gemüsegericht, Linsen
    gloss: Gemüsegericht, Linsen (Dal)
    note: Zwei weitere Grundgerichte, die häufig zusammen mit Roti und Reis gegessen werden.
    example_gloss:
    - Ich möchte das Gemüsegericht.
    - Ich möchte Linsen.
  hi.a1.unit06.lesson02.teach.kap_gilas_plate:
    title: Tasse, Glas, Teller
    gloss: Tasse, Glas, Teller
    note: Gängige Gefäße, die beim Bestellen mit *ek* („ein/eine“) zur Angabe einer Menge verwendet werden.
    example_gloss:
    - Ich möchte eine Tasse Tee.
    - Ich möchte ein Glas Wasser.
    - Ich möchte einen Teller Reis.
  hi.a1.unit06.lesson02.teach.kripya:
    title: Bitte
    gloss: bitte
    note: Ein einfaches Höflichkeitswort für eine Bitte. Meist steht es am Anfang (*kripya mujhe ...*), man hört es aber auch am Ende.
    example_gloss: Ich möchte bitte eine Tasse Tee.
  hi.a1.unit06.lesson02.teach.kuch_aur_chahiye:
    title: Sonst noch etwas?
    gloss: Noch etwas? / Möchten Sie noch etwas?
    note: Die natürliche Anschlussfrage, die ein Kellner stellt, nachdem er einen Teil der Bestellung aufgenommen hat.
  hi.a1.unit06.lesson02.teach.nahin_bas_shukriya:
    title: Nein, das ist alles, danke
    gloss: Nein, das ist alles, danke.
    note: Eine natürliche, höfliche Art, eine Bestellung abzuschließen, mit *nahin* und *shukriya* aus früheren Einheiten.
  hi.a1.unit06.lesson02.teach.sabzi_swadisht_phrase:
    title: Dieses Gemüsegericht ist sehr lecker
    gloss: Dieses Gemüsegericht ist sehr lecker.
    note: Verwendet *bahut* und *swadisht* dieser Einheit mit einem neuen Nomen für Essen, als Vorbereitung auf die Grammatiknotiz in Lektion 3, dass *swadisht* sich nie nach dem Genus ändert.
  hi.a1.unit06.lesson03.teach.chalo_khate_hain:
    title: Lass uns etwas essen!
    gloss: Lass uns etwas essen!
    note: Eine freundliche, feste Wendung, um gemeinsames Essen vorzuschlagen; sie eröffnet den Schlussdialog dieser Einheit.
  hi.a1.unit06.lesson03.teach.ya:
    title: Oder
    gloss: oder
    note: Ein einfaches Bindewort, mit dem man die Wahl zwischen zwei Dingen anbietet.
    example_gloss: Möchtest du Tee oder Kaffee?
  hi.a1.unit06.lesson03.teach.haan:
    title: Ja
    gloss: ja
    note: Ein einfaches Ja, das im Schlussdialog dieser Einheit immer wieder vorkommt.
    example_gloss: Ja, ich möchte Tee.
  hi.a1.unit06.lesson03.teach.swadisht_invariant_note:
    title: Swadisht ändert sich nie
    gloss: '*Swadisht* bleibt bei maskulinen und femininen Wörtern gleich – es ändert sich nicht wie *achha/achhi*.'
    note: 'Eine wichtige Ausnahme: Anders als die bisher gelernten angleichenden Adjektive (achha/achhi, bada/badi, mera/meri) werden Adjektive, die auf einen Konsonanten enden, wie *swadisht*, nie nach dem Genus verändert.'
  hi.a1.unit06.lesson03.teach.accha_phir_milenge:
    title: Gut, bis bald
    gloss: Gut! Bis bald.
    note: Ein freundlicher Abschied, aus dem Abschiedswortschatz früherer Einheiten wiederverwendet.
  hi.a1.unit06.lesson03.teach.theek_hai_phir_milte_hain:
    title: In Ordnung, bis bald
    gloss: In Ordnung, bis bald!
    note: Die informelle Antwort auf den obigen Abschied, passend zu den Abschlussdialogen früherer Einheiten.
  hi.a1.unit06.lesson03.teach.dialogue.line01:
    title: Arjun schlägt vor zu essen
    gloss: 'Arjun sagt: Lass uns etwas essen.'
    note: Verwendet die Eröffnungswendung dieser Einheit erneut.
  hi.a1.unit06.lesson03.teach.dialogue.line02:
    title: Priya fragt, was er möchte
    gloss: Priya stimmt zu und fragt, was Arjun möchte.
    note: Verwendet die informelle Frage *tumhein kya chahiye* aus Lektion 1 erneut.
  hi.a1.unit06.lesson03.teach.dialogue.line03:
    title: Arjun bestellt Essen
    gloss: Arjun sagt, dass er gern einen Teller Roti und Gemüsegericht möchte.
    note: Verbindet die Lebensmittel dieser Lektion, das Muster *ek plate* für Mengenangaben und *chahiye*.
  hi.a1.unit06.lesson03.teach.dialogue.line04:
    title: Priya bietet eine Auswahl an Getränken an
    gloss: Priya sagt „Schön!“ und fragt Arjun, ob er Tee oder Kaffee möchte.
    note: Mit *ya* aus dieser Lektion wird die Wahl zwischen zwei Getränken angeboten.
  hi.a1.unit06.lesson03.teach.dialogue.line05:
    title: Arjun wählt Kaffee
    gloss: Arjun sagt, dass er bitte einen Kaffee möchte.
    note: Greift *kripya* aus Lektion 2 wieder auf.
  hi.a1.unit06.lesson03.teach.dialogue.line06:
    title: Priya kommentiert das Essen
    gloss: Priya sagt „Okay“ und dass dieses Essen sehr lecker ist.
    note: Greift *bahut swadisht* aus Lektion 1 wieder auf.
  hi.a1.unit06.lesson03.teach.dialogue.line07:
    title: Arjun stimmt zu
    gloss: Arjun sagt „Ja, vielen Dank!“
    note: Greift *haan* und *shukriya* wieder auf.
  hi.a1.unit06.lesson03.teach.dialogue.line08:
    title: Priya beendet das Gespräch
    gloss: Priya sagt „Schön!“ und „Bis bald!“
    note: Greift die Abschiedsformel dieser Lektion wieder auf.
  hi.a1.unit06.lesson03.teach.dialogue.line09:
    title: Arjun antwortet
    gloss: Arjun stimmt zu und sagt „Bis bald!“
    note: Greift die Antwortformel dieser Lektion wieder auf.
