teaching:
  hi.a1.unit11.lesson01.teach.review_chai_kaafi:
    title: 'Wiederholung: Tee, Kaffee'
    gloss: Tee, Kaffee
    note: Eine kurze Wiederholung der Getränkewörter aus Lektion 6 – in dieser Lektion verwenden Sie sie, um Pläne vorzuschlagen.
    example_gloss:
    - Ich möchte Tee.
    - Ich möchte Kaffee.
  hi.a1.unit11.lesson01.teach.filma:
    title: Film
    gloss: Film
    note: 'Ein neues Nomen für das Thema dieser Lektion: Pläne machen.'
    example_gloss: Dieser Film ist gut.
  hi.a1.unit11.lesson01.teach.dekhna:
    title: Wir schauen / Schauen wir
    gloss: (wir) schauen / schauen wir
    note: Die Form der Gewohnheit im Plural von 'dekhna' (sehen, schauen); hier wird sie benutzt, um gemeinsam eine Aktivität vorzuschlagen.
    example_gloss: Wir schauen einen Film.
  hi.a1.unit11.lesson01.teach.chalo_film_phrase:
    title: Komm, wir schauen einen Film!
    gloss: Komm, wir schauen einen Film!
    note: '''Chalo'' + Verb im Plural der Gewohnheit ist die alltägliche Art, etwas gemeinsam vorzuschlagen. Sie kam schon beiläufig in den Lektionen 1, 6 und 7 vor (''chalo shuru karte hain'', ''chalo, kuch khaate hain'', ''chalo, kuch khareedte hain''); diese Lektion macht das Muster ausdrücklich und erweitert es.'
  hi.a1.unit11.lesson01.teach.saath:
    title: Zusammen
    gloss: zusammen
    note: Wird benutzt, um eine gemeinsame Aktivität vorzuschlagen.
    example_gloss: Komm, wir schauen zusammen einen Film!
  hi.a1.unit11.lesson01.teach.peena:
    title: Wir trinken / Trinken wir
    gloss: (wir) trinken / trinken wir
    note: Die Form der Gewohnheit im Plural von 'peena' (trinken), nach demselben Muster wie 'dekhte hain'.
    example_gloss: Wir trinken Tee.
  hi.a1.unit11.lesson01.teach.chalo_chai_phrase:
    title: Komm, wir trinken zusammen Tee!
    gloss: Komm, wir trinken zusammen Tee!
    note: Verbindet 'saath' und 'peete hain' aus dieser Lektion zu vorgeschlagenem zweitem Vorschlag, nach demselben 'chalo'-Muster wie beim Filmvorschlag.
  hi.a1.unit11.lesson01.teach.chalo_grammar_note:
    title: Chalo + Verb-te + hain = Komm, wir …
    gloss: 'Um etwas gemeinsam vorzuschlagen, sagt man ''chalo'' + Verb-te + hain: Komm, wir schauen einen Film! Komm, wir trinken zusammen Tee!'
    note: Hier wird das ganze Muster ausdrücklich genannt, das in früheren Lektionen schon dreimal beiläufig vorkam.
  hi.a1.unit11.lesson01.teach.achha_vichar:
    title: Gute Idee!
    gloss: Gute Idee!
    note: Eine fertige Wendung, um einen Vorschlag begeistert anzunehmen.
  hi.a1.unit11.lesson02.teach.vyast:
    title: Beschäftigt
    gloss: beschäftigt
    note: Ein neues Adjektiv, das mit der bereits bekannten Kopula (hoon/ho/hai) benutzt wird, um zu sagen, dass man keine Zeit hat.
    example_gloss: Ich bin heute beschäftigt.
  hi.a1.unit11.lesson02.teach.maaf_karna:
    title: Tut mir leid / Entschuldigung
    gloss: tut mir leid / Entschuldigung
    note: Eine feste höfliche Wendung, die eine Absage abmildert.
    example_gloss: Tut mir leid, ich bin beschäftigt.
  hi.a1.unit11.lesson02.teach.maaf_vyast_phrase:
    title: Tut mir leid, ich bin beschäftigt.
    gloss: Tut mir leid, ich bin beschäftigt.
    note: Der einfache Absagesatz, der die beiden neuen Ausdrücke dieser Lektion verbindet.
  hi.a1.unit11.lesson02.teach.mujhe_kaam_hai:
    title: Ich habe Arbeit.
    gloss: Ich habe Arbeit.
    note: Greift das Muster 'mujhe...hai' (ich habe ...) auf, das wie zuvor 'mujhe...chahiye' (ich möchte/brauche ...) gebaut ist; hier nennt es den Grund für eine Absage.
  hi.a1.unit11.lesson02.teach.decline_grammar_note:
    title: So sagt man höflich ab
    gloss: Um einen Plan höflich abzulehnen, sagt man 'maaf karna' (tut mir leid) und nennt dann die eigene Lage (z. B. 'Ich bin beschäftigt') oder einen Grund (z. B. 'Ich habe Arbeit').
    note: Hier werden bewusst schon bekannte Strukturen (die Kopula und das Muster für Besitz mit dem Dativ) wiederverwendet, statt eine neue Konstruktion für „können“ einzuführen.
  hi.a1.unit11.lesson02.teach.hum_pronoun:
    title: Wir
    gloss: wir
    note: 'Das erste ausdrückliche Pronomen der ersten Person Plural in diesem Kurs. Die Verbform der Gewohnheit (-te + hain) ist dieselbe, die schon bei ve (sie) gelernt wurde – keine neue Konjugation, nur ein neues Pronomen. (Auch tum steht mit -te, aber mit ''ho'': tum milte ho.)'
    example_gloss: Wir treffen uns jeden Tag.
  hi.a1.unit11.lesson02.teach.kab_milte_phrase:
    title: Wann treffen wir uns?
    gloss: Wann treffen wir uns?
    note: Verbindet 'hum' mit 'kab' (Lektion 10) und 'milte hain' (seit den Abschiedsformeln in Lektion 1 bekannt, wo das Subjekt meist wegfiel).
  hi.a1.unit11.lesson02.teach.din_review:
    title: 'Wiederholung: Samstag, Sonntag'
    gloss: Samstag, Sonntag
    note: Eine kurze Wiederholung zweier Wochentage aus Lektion 3, die man braucht, um etwas zu verabreden.
    example_gloss:
    - Heute ist Samstag.
    - Morgen ist Sonntag.
  hi.a1.unit11.lesson02.teach.samay_review:
    title: 'Wiederholung: vier Uhr, um wie viel Uhr'
    gloss: vier Uhr, um wie viel Uhr
    note: Eine kurze Wiederholung der Zeitangaben aus Lektion 4, die man braucht, um etwas zu verabreden.
    example_gloss:
    - Es ist jetzt vier Uhr.
    - Wie viel Uhr ist es jetzt?
  hi.a1.unit11.lesson02.teach.kya_ravivar_thik_phrase:
    title: Passt es am Sonntag?
    gloss: Passt es am Sonntag?
    note: Nutzt 'kya' wieder als Markierung für Ja/Nein-Fragen, wie schon seit Lektion 1 ('kya yeh tumhari pahli baar hai?', 'kya tum yoga karti ho?'), und nicht ein neues Fragewort für „welcher Tag“.
  hi.a1.unit11.lesson03.teach.sandesh:
    title: Nachricht
    gloss: Nachricht
    note: Ein neues Nomen, das für den Teil dieser Lektion mit der schriftlichen Einladung gebraucht wird.
    example_gloss: Das ist Arjuns Nachricht.
  hi.a1.unit11.lesson03.teach.dialogue.line01:
    title: Arjun schlägt für Samstag einen Film vor
    gloss: Priya, komm, wir schauen am Samstag einen Film?
  hi.a1.unit11.lesson03.teach.dialogue.line02:
    title: Priya sagt mit einem Grund ab
    gloss: Tut mir leid, ich bin am Samstag beschäftigt. Ich habe Arbeit.
  hi.a1.unit11.lesson03.teach.dialogue.line03:
    title: Arjun fragt, wann sie sich treffen können
    gloss: Okay. Wann treffen wir uns?
  hi.a1.unit11.lesson03.teach.dialogue.line04:
    title: Priya schlägt stattdessen Sonntag vor
    gloss: Passt es am Sonntag? Komm, wir trinken zusammen Tee!
  hi.a1.unit11.lesson03.teach.dialogue.line05:
    title: Arjun sagt zu und fragt nach der Uhrzeit
    gloss: Gute Idee! Um wie viel Uhr am Sonntag?
  hi.a1.unit11.lesson03.teach.dialogue.line06:
    title: Priya schlägt eine Uhrzeit vor
    gloss: Passt vier Uhr?
  hi.a1.unit11.lesson03.teach.dialogue.line07:
    title: Arjun bestätigt
    gloss: Ja, vier Uhr passt. Dann bis dann!
  hi.a1.unit11.lesson03.teach.dialogue.line08:
    title: Priya beendet das Gespräch
    gloss: Okay, wir sehen uns am Sonntag!
  hi.a1.unit11.lesson03.teach.invitation_message:
    title: Priyas Nachricht
    gloss: Hallo Arjun, lass uns am Sonntag um vier Uhr treffen und Tee trinken. Okay? – Priya
    note: Eine kurze schriftliche Einladung, die den Plan wiederholt, den der Dialog gerade bestätigt hat.
    glosses:
      चलो: lass uns
      रविवार: Sonntag
      मिलते: treffen (von मिलना)
      चाय: Tee
      पीते: trinken (von पीना)
      ठीक: okay / in Ordnung
