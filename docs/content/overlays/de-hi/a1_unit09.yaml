answer_policy:
  nasalization_marks: Display and teach the correct chandrabindu/anusvara distinction. No new spelling AMBIGUITY was needed for this unit's own new vocabulary -- बाएँ/दाएँ/जाऊँ all follow the already-established non-ascending-vowel-sign chandrabindu rule from units 01-08 (यहाँ, वहाँ, कहाँ). In typed A1 answers, accept a variant that drops a nasalization mark entirely or substitutes anusvara for chandrabindu (or vice versa) when every other character is correct. Do not extend this tolerance to a wrong vowel or consonant, which changes the actual word.
  punctuation: Hindi text is shown with the traditional danda (।) as the sentence-final mark. In typed answers, accept the danda, a plain period (.), or the mark omitted entirely as equivalent. Question marks (?), exclamation marks, and commas may likewise be omitted, but the fully punctuated form remains the model answer.
  spoken_answers: Judge spoken responses by intelligibility rather than written punctuation or nasalization marks.
course:
  title: Hindi A1
units:
  hi.a1.unit09.directions:
    title: Wegbeschreibungen
lessons:
  hi.a1.unit09.lesson01.seedhe_baaen_daaen:
    title: Geradeaus, links, rechts
  hi.a1.unit09.lesson02.yahan_se_kaise_jaun:
    title: Wie komme ich dorthin?
  hi.a1.unit09.lesson03.priya_arjun_rasta_poochna:
    title: 'Priya und Arjun: nach dem Weg fragen'
teaching:
  hi.a1.unit09.lesson01.teach.review_places:
    title: 'Wiederholung: Orte'
    gloss: Bank, Schule, Krankenhaus, Park, Bahnhof, Post
    note: Eine kurze Wiederholung der Ortswörter aus der vorigen Einheit -- diese Einheit verwendet sie sehr häufig.
    example_gloss:
    - Die Bank ist hier.
    - Die Post ist bei der Bank.
  hi.a1.unit09.lesson01.teach.review_function_words:
    title: 'Wiederholung: ist, wo, hier, dort, von, von, okay'
    gloss: ist, wo, hier, dort, von/aus, von (Zugehörigkeit), okay
    note: Eine kurze Wiederholung kleiner Funktionswörter aus früheren Einheiten, die in den Übungen dieser Einheit wiederkehren.
    example_gloss:
    - Wo ist die Bank?
    - Der Park ist dort.
  hi.a1.unit09.lesson01.teach.seedhe_baaen_daaen:
    title: Geradeaus, links, rechts
    gloss: geradeaus, links, rechts
    note: Die drei wichtigsten Richtungswörter dieser Einheit.
    example_gloss:
    - Gehen Sie geradeaus.
    - Biegen Sie links ab.
  hi.a1.unit09.lesson01.teach.jao_muro:
    title: Geh!, bieg ab!
    gloss: geh!, bieg ab! (informeller Imperativ)
    note: Befehlsformen für tum -- das natürliche Register, wenn zwei Freunde einander den Weg erklären.
    example_gloss:
    - Gehen Sie geradeaus.
    - Biegen Sie rechts ab.
  hi.a1.unit09.lesson01.teach.yahan_se_seedhe_jao:
    title: Von hier geradeaus gehen
    gloss: Geh von hier geradeaus.
    note: Verbindet die neuen Wörter dieser Lektion mit „yahaan se“ (von hier).
  hi.a1.unit09.lesson01.teach.baaen_muro_phrase:
    title: Links abbiegen
    gloss: Biegen Sie links ab.
    note: Ein eigenständiger Befehl, direkt einsetzbar.
  hi.a1.unit09.lesson01.teach.daaen_muro_phrase:
    title: Rechts abbiegen
    gloss: Biegen Sie rechts ab.
    note: Das Gegenstück zum Befehl „baaen muro“.
  hi.a1.unit09.lesson01.teach.imperative_note:
    title: Die Befehlsendung -o
    gloss: „Jaao“ und „muro“ sind Befehlsformen für tum, wie „bataao“ und „gino“ -- sie alle enden auf „-o“.
    note: Zeigt das gemeinsame Muster des informellen Imperativs an zwei bereits gelernten Wörtern (bataao in Einheit 7, gino in Einheit 2).
  hi.a1.unit09.lesson02.teach.bank_kaise_jaun:
    title: Wie komme ich zur Bank?
    gloss: Wie komme ich zur Bank?
    note: Die Kernfrage, um nach dem Weg zu fragen, in der Form der 1. Person „soll ich gehen“.
  hi.a1.unit09.lesson02.teach.tak:
    title: Bis / bis zu
    gloss: bis / bis zu
    note: Schon in Lektion 2 beim Zählen vorgekommen („zero se das tak“); hier wird es in seiner ebenso gebräuchlichen räumlichen Bedeutung wieder verwendet.
    example_gloss: Gehen Sie geradeaus bis zur Bank.
  hi.a1.unit09.lesson02.teach.bank_tak_seedhe_jao:
    title: Geradeaus bis zur Bank
    gloss: Geh geradeaus bis zur Bank.
    note: Ein Beispielsatz, in dem „tak“ räumlich verwendet wird.
  hi.a1.unit09.lesson02.teach.pahle_phir:
    title: Zuerst, dann
    gloss: zuerst, dann
    note: Ein Wortpaar, mit dem zwei Schritte einer Wegbeschreibung aneinandergereiht werden.
    example_gloss:
    - Geh zuerst geradeaus.
    - Dann biege links ab.
  hi.a1.unit09.lesson02.teach.pahle_seedhe_phir_baaen:
    title: Zuerst geradeaus, dann links
    gloss: Geh zuerst geradeaus, dann biege links ab.
    note: Verbindet „pahle“ und „phir“ zu einer Anweisung in zwei Schritten.
  hi.a1.unit09.lesson02.teach.pahle_phir_note:
    title: Pahle und phir
    gloss: '„Pahle“ und „phir“ verbinden zwei Schritte: Die erste Handlung steht mit „pahle“, die zweite mit „phir“, z. B. „pahle seedhe jaao, phir baaen muro.“'
    note: Ein nützlicher Grammatikpunkt dazu, wie man mehrteilige Wegbeschreibungen ordnet.
  hi.a1.unit09.lesson03.teach.nukkad:
    title: Straßenecke
    gloss: Straßenecke
    note: Ein neues Ortswort für den Schlussdialog dieser Lektion, verwendet mit „par“ (an/auf).
    example_gloss:
    - Die Bank ist an der Ecke.
    - Der Park ist hinter der Schule.
  hi.a1.unit09.lesson03.teach.bas:
    title: Nur / bloß
    gloss: nur / bloß
    note: Ist auch ein gängiges Lehnwort für „Bus“ (das Fahrzeug), doch diese Bedeutung wird in diesem Kurs nicht behandelt, daher entsteht hier keine Verwechslung.
    example_gloss: Geh nur noch ein kleines Stück weiter.
  hi.a1.unit09.lesson03.teach.samajh_gaya:
    title: Verstanden
    gloss: verstanden / alles klar
    note: 'Ein gebräuchlicher Ausdruck aus zwei Wörtern: „samajh“ (der Stamm von „samajhna“, verstehen) plus „gaya“ (ging), das die Handlung als abgeschlossen markiert. Dies ist die männliche Form – Priya würde „samajh gayi“ sagen.'
    example_gloss: Ich habe verstanden. / Alles klar.
  hi.a1.unit09.lesson03.teach.accha_bahut_shukriya:
    title: Okay! Vielen Dank!
    gloss: Okay! Vielen Dank!
    note: Verwendet „accha“, „bahut“ und „shukriya“ aus früheren Lektionen wieder.
  hi.a1.unit09.lesson03.teach.koi_baat_nahin_phir_milenge:
    title: Kein Problem! Bis bald.
    gloss: Kein Problem! Bis bald.
    note: Die übliche Abschlussformel dieses Kurses, wörtlich aus Lektion 8 übernommen.
  hi.a1.unit09.lesson03.teach.dialogue.line01:
    title: Arjun fragt nach dem Postamt
    gloss: Arjun fragt Priya, wie er zum Postamt kommt.
    note: Verwendet das Fragemuster aus Lektion 2 wieder.
  hi.a1.unit09.lesson03.teach.dialogue.line02:
    title: Priya beginnt die Wegbeschreibung
    gloss: 'Priya sagt: Geh von hier zuerst geradeaus.'
    note: Verwendet „yahaan se“ und „pahle“ aus früheren Teilen dieser Lektion wieder.
  hi.a1.unit09.lesson03.teach.dialogue.line03:
    title: Arjun fragt, wie es weitergeht
    gloss: Arjun sagt „In Ordnung“ und fragt, wie es weitergeht.
  hi.a1.unit09.lesson03.teach.dialogue.line04:
    title: Priya erklärt weiter
    gloss: 'Priya sagt: Dann biege an der Ecke der Bank links ab.'
    note: Führt „nukkad“ (Straßenecke) im Zusammenhang ein.
  hi.a1.unit09.lesson03.teach.dialogue.line05:
    title: Arjun bestätigt und fragt weiter
    gloss: Arjun wiederholt „links“, bestätigt mit „In Ordnung“ und fragt, wie es weitergeht.
  hi.a1.unit09.lesson03.teach.dialogue.line06:
    title: Priya beendet die erste Wegbeschreibung
    gloss: 'Priya sagt: Geh nur noch ein kleines Stück weiter – das Postamt ist dort, in der Nähe der Bank.'
    note: Führt „bas“ (nur/bloß) ein und passt zu der in Lektion 8 festgelegten Tatsache, dass das Postamt in der Nähe der Bank liegt.
  hi.a1.unit09.lesson03.teach.dialogue.line07:
    title: Arjun hat verstanden und fragt nach dem Park
    gloss: Arjun sagt, dass er verstanden hat, und fragt, wie er zum Park kommt.
    note: Führt den Ausdruck „samajh gaya“ ein.
  hi.a1.unit09.lesson03.teach.dialogue.line08:
    title: Priya nennt die zweite Route
    gloss: 'Priya sagt: Der Park? Geh zuerst geradeaus, dann biege rechts ab – der Park ist hinter der Schule.'
    note: Passt zu der in Lektion 8 festgelegten Tatsache, dass der Park hinter der Schule liegt.
  hi.a1.unit09.lesson03.teach.dialogue.line09:
    title: Arjun bedankt sich bei Priya
    gloss: Arjun sagt, dass er verstanden hat, und bedankt sich herzlich bei Priya.
  hi.a1.unit09.lesson03.teach.dialogue.line10:
    title: Priya verabschiedet sich
    gloss: Priya sagt „Kein Problem“ und „Bis bald“.
    note: Dieselbe Abschlusszeile wie im Dialog von Lektion 8, wörtlich wiederverwendet.
