  hi.a1.unit34.lesson05.teach.priya_har_din:
    title: Wer fährt wie?
    gloss: Priya fährt jeden Tag mit dem Zug zur Arbeit. Arjun fährt meistens mit dem Fahrrad, aber bei Regen nimmt er auch den Zug. Vikram fährt lieber Auto. Neha wohnt in der Nähe und geht zu Fuß zur Arbeit. Wie kommst du zur Arbeit?
    note: 'Stellt vier Arten gegenüber, zur Arbeit zu kommen, und eine Bedingung (Regen: *बारिश हो तो*).'
