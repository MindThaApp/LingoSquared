teaching:
  hi.a1.unit17.lesson01.teach.tum_tumhara_kya_review:
    title: 'Wiederholung: du, dein, was'
    gloss: du, dein, was
    note: Eine kurze Wiederholung der Wörter, die man braucht, um einen Freund nach seinem Beruf zu fragen.
    example_gloss: Wie heißt du?
  hi.a1.unit17.lesson01.teach.arjun_priya_review:
    title: 'Wiederholung: Arjun, Priya'
    gloss: Arjun, Priya
    note: Eine Erinnerung an die Namen beider Figuren, bevor diese Lektion sie für Fragen mit grammatischem Geschlecht verwendet.
    example_gloss:
    - Ich heiße Arjun.
    - Ich heiße Priya.
  hi.a1.unit17.lesson01.teach.copula_review:
    title: 'Wiederholung: ich, bin, ist, bist'
    gloss: ich, bin, ist, bist (informelles „du“)
    note: Die kleine Formengruppe von „sein“, die für die Sätze dieser Lektion über den Beruf nötig ist.
    example_gloss:
    - Geht es dir gut?
    - Mir geht es gut.
  hi.a1.unit17.lesson01.teach.kaam_review:
    title: 'Wiederholung: Arbeit'
    gloss: die Arbeit
    note: In Lektion 10/11 eingeführt -- hier als Themenwort für die ganze Lektion wieder aufgegriffen.
    example_gloss: Ich habe zu tun.
  hi.a1.unit17.lesson01.teach.karte_karti_karta_verb:
    title: Machen (du, männlich / du, weiblich / ich, männlich)
    gloss: machst (du, männlich, informell), machst (du, weiblich, informell), mache (ich, männlich)
    note: Überträgt die schon in Lektion 10 gelernte Regel der Endungen -ta/-ti/-te (auch in *kya tum yog karti ho?* aus Lektion 1 zu sehen) auf das Verb *karna* (machen, tun).
    example_gloss:
    - Was machst du beruflich?
    - Ich frühstücke.
  hi.a1.unit17.lesson01.teach.tum_kya_kaam_karte_ho_phrase:
    title: Was arbeitest du? (zu einem Mann)
    gloss: Was arbeitest du?
    note: Die Eingangsfrage dieser Lektion, an einen Freund gerichtet.
  hi.a1.unit17.lesson01.teach.tum_kya_kaam_karti_ho_phrase:
    title: Was arbeitest du? (zu einer Frau)
    gloss: Was arbeitest du?
    note: Dieselbe Frage, an eine Freundin gerichtet -- nur die Verbendung ändert sich.
  hi.a1.unit17.lesson01.teach.shikshak_shikshika:
    title: Lehrer (männlich / weiblich)
    gloss: Lehrer, Lehrerin
    note: Ein neues Paar von Berufsbezeichnungen. Anders als die meisten bisher gelernten Nomen richtet es sich nach dem Geschlecht der sprechenden Person -- siehe die Grammatikanmerkung dieser Lektion.
    example_gloss:
    - Ich bin Lehrer.
    - Ich bin Lehrerin.
  hi.a1.unit17.lesson01.teach.grammar_occupation_gender:
    title: Mein + Beruf + hoon
    gloss: ‚Mein + Beruf + hoon‘ nennt einen Beruf, es ist dasselbe ‚mein...hoon‘-Muster wie in Lektion 1. Manche Berufe ändern sich mit dem Geschlecht der sprechenden Person -- ‚shikshak‘ (männlich), ‚shikshika‘ (weiblich), genau wie sich die Verbendung -ta/-ti in Lektion 10 geändert hat. ‚Doctor‘ und ‚engineer‘ ändern sich nicht -- es ist dasselbe Wort für beide Geschlechter.
    note: Legt die Zweiteilung (nach Geschlecht angeglichene Nomen vs. unveränderliche Lehnwörter) ausdrücklich offen, bevor eine Übung darauf aufbaut.
  hi.a1.unit17.lesson01.teach.doctor_review:
    title: 'Wiederholung: Arzt/Ärztin'
    gloss: Arzt/Ärztin
    note: In Einheit 16 eingeführt – hier als geschlechtsunveränderlicher Berufsname wiederverwendet.
    example_gloss: Er/Sie ist Arzt/Ärztin.
  hi.a1.unit17.lesson01.teach.mein_doctor_hoon_phrase:
    title: Ich bin Arzt/Ärztin.
    gloss: Ich bin Arzt/Ärztin.
    note: Das Muster zur Angabe der Identität, angewendet auf ein bekanntes Wort.
  hi.a1.unit17.lesson01.teach.engineer:
    title: Ingenieur
    gloss: Ingenieur/Ingenieurin
    note: Ein neues Berufsnomen, wie *doctor* geschlechtsunveränderlich.
    example_gloss: Er/Sie ist Ingenieur/in.
  hi.a1.unit17.lesson01.teach.mein_engineer_hoon_phrase:
    title: Ich bin Ingenieur/in.
    gloss: Ich bin Ingenieur/in.
    note: Das Muster zur Angabe der Identität, angewendet auf den zweiten neuen Beruf dieser Lektion.
  hi.a1.unit17.lesson02.teach.kahan_review:
    title: 'Wiederholung: wo'
    gloss: wo
    note: In Einheit 1 eingeführt – hier wiederverwendet, um nach einem Arbeitsplatz zu fragen.
    example_gloss: Wo ist das Krankenhaus?
  hi.a1.unit17.lesson02.teach.mein_review:
    title: 'Wiederholung: in / bei'
    gloss: in / bei
    note: In Einheit 1 eingeführt – hier wiederverwendet, um einen Arbeitsplatz zu nennen.
    example_gloss: Ich wohne in London.
  hi.a1.unit17.lesson02.teach.tum_kahan_kaam_karte_ho_phrase:
    title: Wo arbeitest du? (zu einem Mann)
    gloss: Wo arbeitest du?
    note: Die Eröffnungsfrage dieser Lektion, an einen männlichen Freund gerichtet.
  hi.a1.unit17.lesson02.teach.tum_kahan_kaam_karti_ho_phrase:
    title: Wo arbeitest du? (zu einer Frau)
    gloss: Wo arbeitest du?
    note: Dieselbe Frage, an eine Freundin gerichtet.
  hi.a1.unit17.lesson02.teach.school_review:
    title: 'Wiederholung: Schule'
    gloss: Schule
    note: In Einheit 8 eingeführt – der erste Arbeitsplatz dieser Lektion.
    example_gloss: Ich arbeite in der Schule (Sprecherin).
  hi.a1.unit17.lesson02.teach.mein_school_mein_kaam_karti_hoon_phrase:
    title: Ich arbeite in der Schule.
    gloss: Ich arbeite in der Schule.
    note: Das Muster für den Arbeitsplatz, angewendet auf die Schule, weibliche Form.
  hi.a1.unit17.lesson02.teach.hospital_review:
    title: 'Wiederholung: Krankenhaus'
    gloss: Krankenhaus
    note: In Einheit 8 eingeführt – der zweite Arbeitsplatz dieser Lektion, passend zum Beruf Arzt/Ärztin.
    example_gloss: Der Arzt arbeitet im Krankenhaus.
  hi.a1.unit17.lesson02.teach.daftar:
    title: Büro
    gloss: Büro
    note: Ein neues Nomen, der dritte Arbeitsplatz dieser Lektion, passend zum Beruf Ingenieur/in.
    example_gloss: Ich arbeite im Büro (Sprecher).
  hi.a1.unit17.lesson02.teach.mein_daftar_mein_kaam_karta_hoon_phrase:
    title: Ich arbeite im Büro.
    gloss: Ich arbeite im Büro.
    note: Das Muster für den Arbeitsplatz, angewendet auf das Büro, männliche Form.
  hi.a1.unit17.lesson02.teach.grammar_workplace:
    title: Ort + mein + kaam karta/karti hoon
    gloss: '''[Ort] + mein + kaam karta/karti hoon'' verbindet drei bereits bekannte Bausteine: ''mein'' (Einheit 1, ''London mein rehta hoon''), ''kaam'' (Einheit 10/11) und die -ta/-ti/-te-Form von ''karna'' (Einheit 10: ''nashta karta hoon'', und Einheit 1: ''kya tum yog karti ho?''). Das ist keine neue Grammatik – die drei Bausteine werden hier zum ersten Mal in einem Satz kombiniert.'
    note: Nennt jeden bereits gelernten Baustein mit der Einheitsnummer, bevor sie kombiniert werden – wie in allen vorherigen Grammatikhinweisen.
  hi.a1.unit17.lesson03.teach.roz_review:
    title: 'Wiederholung: jeden Tag'
    gloss: jeden Tag
    note: In Einheit 10 eingeführt – hier wiederverwendet, um den täglichen Arbeitsalltag zu beschreiben.
    example_gloss: Ich arbeite jeden Tag.
  hi.a1.unit17.lesson03.teach.jaana_forms_review:
    title: 'Wiederholung: gehen (du, weiblich / du, männlich / ich, männlich)'
    gloss: gehst (du, weiblich, informell), gehst (du, männlich, informell), gehe (ich, männlich)
    note: Die bereits gelernten -ta/-ti/-te-Formen von *jana* (gehen), in Einheit 10 eingeführt, hier für den täglichen Weg zur Arbeit wiederverwendet.
    example_gloss:
    - Ich gehe jeden Tag zur Schule (Sprecherin).
    - Gehst du jeden Tag ins Büro? (zu einem Mann)
  hi.a1.unit17.lesson03.teach.bhi_haan_review:
    title: 'Wiederholung: auch, ja'
    gloss: auch, ja
    note: Beide bereits gelernt (Einheit 1 und Einheit 1/6/13) – hier im Dialog dieser Lektion wiederverwendet.
    example_gloss: Ja, mir hat es auch gefallen.
  hi.a1.unit17.lesson03.teach.dialogue.line01:
    title: Arjun fragt Priya nach ihrem Beruf
    gloss: Priya, was machst du beruflich?
  hi.a1.unit17.lesson03.teach.dialogue.line02:
    title: Priya sagt, dass sie Lehrerin an einer Schule ist
    gloss: Ich bin Lehrerin. Ich arbeite in einer Schule.
  hi.a1.unit17.lesson03.teach.dialogue.line03:
    title: Arjun fragt, ob sie jeden Tag zur Schule geht
    gloss: Schön! Gehst du jeden Tag zur Schule?
  hi.a1.unit17.lesson03.teach.dialogue.line04:
    title: Priya bestätigt und stellt Arjun dieselbe Frage
    gloss: Ja, ich gehe jeden Tag zur Schule. Was machst du beruflich?
  hi.a1.unit17.lesson03.teach.dialogue.line05:
    title: Arjun sagt, dass er Ingenieur in einem Büro ist
    gloss: Ich bin Ingenieur. Ich arbeite in einem Büro.
  hi.a1.unit17.lesson03.teach.dialogue.line06:
    title: Priya fragt, ob er auch jeden Tag ins Büro geht
    gloss: Sehr schön! Gehst du auch jeden Tag ins Büro?
  hi.a1.unit17.lesson03.teach.dialogue.line07:
    title: Arjun bestätigt
    gloss: Ja, ich gehe jeden Tag ins Büro.
  hi.a1.unit17.lesson03.teach.dialogue.line08:
    title: Priya bedankt sich
    gloss: Okay, danke.
  hi.a1.unit17.lesson03.teach.grammar_summary:
    title: Drei Hauptregeln
    gloss: 'Die drei Hauptregeln dieser Einheit: (1) ''mein + Beruf + hoon'' nennt einen Beruf (z. B. ''mein shikshika hoon''), und einige Berufe ändern sich mit dem Geschlecht der sprechenden Person; (2) ''[Ort] + mein + kaam karta/karti hoon'' nennt den Arbeitsplatz (z. B. ''mein daftar mein kaam karta hoon''); (3) ''roz [Ort] jata/jati hoon'' nennt eine tägliche Gewohnheit – dieselbe -ta/-ti-Regel wie in Einheit 10.'
    note: Eine abschließende Zusammenfassung, die die gesamte Grammatik der Einheit verbindet – wie der Grammatikhinweis zum Paradigma in Einheit 15/16.
  hi.a1.unit17.lesson03.teach.work_profile_reading:
    title: Ein kurzes Profil lesen
    gloss: Priya ist Lehrerin. Sie arbeitet in einer Schule. Arjun ist Ingenieur. Er arbeitet in einem Büro.
    note: Ein kurzes, direktes Profil, das genau die im Dialog genannten Fakten wiederholt, ohne neue Aussagen – passend zum Lernziel, ein kurzes Berufsprofil zu lesen.
    glosses:
      शिक्षिका: Lehrerin
      स्कूल: Schule
      काम: arbeiten
      करती: macht / arbeitet (feminin, von करना)
      इंजीनियर: Ingenieur
      दफ़्तर: Büro
      करता: macht / arbeitet (maskulin, von करना)
