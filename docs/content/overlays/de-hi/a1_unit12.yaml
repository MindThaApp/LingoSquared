teaching:
  hi.a1.unit12.lesson01.teach.vyast_review:
    title: 'Wiederholung: beschäftigt'
    gloss: beschäftigt
    note: Eine kurze Wiederholung des Adjektivs aus Lektion 11 -- in dieser Lektion üben Sie damit die neue Vergangenheit der Kopula.
    example_gloss: Arjun ist beschäftigt.
  hi.a1.unit12.lesson01.teach.tha_thi:
    title: War (maskulin / feminin)
    gloss: war
    note: Die Vergangenheit der Kopula (ist/bin/sind), das Gegenstück zu hai/hoon/hain. „Tha“ passt zu einem maskulinen Subjekt, „thi“ zu einem femininen.
    example_gloss:
    - Arjun war gestern beschäftigt.
    - Priya war gestern beschäftigt.
  hi.a1.unit12.lesson01.teach.tha_thi_grammar:
    title: Tha und thi
    gloss: '„Tha“ steht bei einem maskulinen Subjekt, „thi“ bei einem femininen -- sie stehen dort, wo „hai“ steht, ändern sich aber im Gegensatz zu „hai“ mit dem Geschlecht: Arjun ist beschäftigt, Arjun war beschäftigt, Priya war beschäftigt.'
    note: Das Muster der Geschlechtsangleichung wird ausdrücklich genannt und auf die Vergangenheit der bekannten Kopula übertragen.
  hi.a1.unit12.lesson01.teach.kal_review:
    title: 'Wiederholung: gestern'
    gloss: gestern
    note: 'Zum ersten Mal in Lektion 4 gelernt: „kal“ bedeutet sowohl „morgen“ als auch „gestern“; was gemeint ist, zeigt allein die Zeitform des Verbs. In dieser Lektion kommt erstmals die Bedeutung „gestern“ zum Einsatz.'
    example_gloss: Gestern war Samstag.
  hi.a1.unit12.lesson01.teach.kaisa:
    title: Wie (maskulin)
    gloss: wie
    note: Ergänzt ein Paradigma, von dem Sie schon zwei Drittel kennen -- „kaise“ und „kaisi“ (beide aus „Wie geht es Ihnen?“ in Lektion 1) kennen Sie schon; neu ist die maskuline Singularform, die bei Subjekten wie „din“ (Tag) steht.
    example_gloss: Wie war der Tag?
  hi.a1.unit12.lesson01.teach.kal_kaisa_tha_phrase:
    title: Wie war es gestern?
    gloss: Wie war es gestern?
    note: Die zentrale Frage dieser Lektion, die alle bisher gelernten Wörter verbindet.
  hi.a1.unit12.lesson01.teach.din_achha_tha_phrase:
    title: Der Tag war gut.
    gloss: Der Tag war gut.
    note: Eine fertige Antwort auf „Wie war es gestern?“ in der maskulinen Form (din ist maskulin).
  hi.a1.unit12.lesson01.teach.filma_achi_thi:
    title: Der Film war gut.
    gloss: Der Film war gut.
    note: Dasselbe Muster mit einem femininen Subjekt (film ist feminin), eine Wiederholung aus dem Wortschatz von Lektion 11.
  hi.a1.unit12.lesson01.teach.kaisa_kaisi_grammar:
    title: Kaisa, kaisi, kaise
    gloss: „Kaisa“ steht bei einem maskulinen Singular (Wie war der Tag?), „kaisi“ bei einem femininen (Wie war der Tee?), und „kaise“ steht bei aap/tum, wenn man einen Mann fragt (Wie geht es Ihnen?; bei einer Frau heißt es „aap kaisi hain?“) -- alle drei sind Formen desselben Wortes.
    note: Fügt erstmals das ganze Paradigma zusammen -- kaise/kaisi kennen Sie schon aus Lektion 1, kaisa kommt in dieser Lektion neu hinzu.
  hi.a1.unit12.lesson02.teach.names_mai_review:
    title: 'Wiederholung: ich, Arjun, Priya'
    gloss: ich, Arjun, Priya
    note: Eine kurze Wiederholung vor den Vergangenheitsbeispielen in der ersten Person.
    example_gloss:
    - Ich bin Arjun.
    - Ich bin Priya.
  hi.a1.unit12.lesson02.teach.jaana_gaya_gai:
    title: Ging (maskulin / feminin)
    gloss: ging
    note: Die Vergangenheit von „jaana“ (gehen), derselbe Stamm wie der Imperativ „jao“ (Geh!) aus Lektion 9. Sie richtet sich wie „tha“/„thi“ nach dem Geschlecht des Subjekts.
    example_gloss:
    - Arjun ging auf den Markt.
    - Priya ging nach Hause.
  hi.a1.unit12.lesson02.teach.jaana_grammar:
    title: Gaya/gai = Vergangenheit von jaana
    gloss: „Gaya“/„gai“ ist die Vergangenheit von „jaana“ (gehen, jao in Lektion 9) und ändert sich mit dem Geschlecht des Subjekts -- genau wie „tha“/„thi“.
    note: Verbindet die neue Vergangenheitsform ausdrücklich mit dem schon bekannten Imperativstamm.
  hi.a1.unit12.lesson02.teach.bazaar_ghar_review:
    title: 'Wiederholung: Markt, Zuhause'
    gloss: Markt, Zuhause
    note: Eine kurze Wiederholung zweier Ortswörter aus Lektion 7/8, die man braucht, um zu sagen, wohin jemand gegangen ist.
    example_gloss:
    - Das ist der Markt.
    - Das ist zu Hause.
  hi.a1.unit12.lesson02.teach.milna_mila_mili:
    title: Traf (maskulin / feminin)
    gloss: traf
    note: Die Vergangenheit von „milna“ (treffen), derselbe Stamm wie das gewohnheitsmäßige „milte hain“ (aus den Abschiedsformeln in Lektion 1/4/10/11). Sie richtet sich nach dem Geschlecht des Subjekts.
    example_gloss:
    - Arjun hat Priya getroffen.
    - Priya hat Arjun getroffen.
  hi.a1.unit12.lesson02.teach.milna_se_grammar:
    title: Se = „mit“ hier, nicht „aus/von“
    gloss: 'Hier bedeutet „se“ nicht „aus/von“ – „X se milna“ heißt „X treffen“ (wörtlich: „mit X zusammenkommen“), während dasselbe „se“ in „main Bharat se hoon“ „aus“ bedeutete.'
    note: Ein Wort, das Sie schon kennen, hat hier eine zweite Verwendung.
  hi.a1.unit12.lesson02.teach.wahan_review:
    title: 'Wiederholung: dort'
    gloss: dort
    note: Kurze Wiederholung aus Lektion 8/9; hier verwendet, um zu sagen, wo ein Treffen stattfand.
    example_gloss: Die Schule ist dort.
  hi.a1.unit12.lesson02.teach.kal_bazaar_gaya_phrase:
    title: Ich war gestern auf dem Markt.
    gloss: Ich war gestern auf dem Markt.
    note: Verbindet die neue Vergangenheitsform dieser Lektion mit „kal“ aus Lektion 1.
  hi.a1.unit12.lesson02.teach.wahan_priya_se_mila_phrase:
    title: Ich habe dort Priya getroffen.
    gloss: Ich habe dort Priya getroffen.
    note: Verbindet „mila“ aus dieser Lektion mit „se“ („mit“) und „wahan“ (dort).
  hi.a1.unit12.lesson02.teach.saath_review:
    title: 'Wiederholung: zusammen'
    gloss: zusammen
    note: Kurze Wiederholung aus Lektion 11.
    example_gloss: Wir trinken zusammen Tee.
  hi.a1.unit12.lesson03.teach.chai_dukaan_khana_review:
    title: 'Wiederholung: Tee, Laden, Essen'
    gloss: Tee, Laden, Essen
    note: Kurze Wiederholung von drei Nomen aus Lektion 6/7, die für den Dialog und den Lesetext dieser Lektion nötig sind.
    example_gloss:
    - Der Tee ist gut.
    - Der Laden ist gut.
    - Das Essen ist gut.
  hi.a1.unit12.lesson03.teach.ka_kaisi_review:
    title: 'Wiederholung: „von/des“ (ka), wie (feminin)'
    gloss: von / des (ka), wie (feminin, kaisi)
    note: „Ka“ (aus „kitne ka“ und aus Lektion 10, „raat ka khana“) und „kaisi“ (bereits gelernt) werden hier wiederverwendet; es ist keine neue Grammatik.
    example_gloss:
    - Der gestrige Tag war gut.
    - Wie war der Teeladen?
  hi.a1.unit12.lesson03.teach.dialogue.line01:
    title: Arjun fragt, wie der gestrige Tag war
    gloss: Priya, wie war es gestern?
  hi.a1.unit12.lesson03.teach.dialogue.line02:
    title: Priya sagt, es war gut
    gloss: Sehr gut! Wir haben uns getroffen.
  hi.a1.unit12.lesson03.teach.dialogue.line03:
    title: Arjun erwähnt den Markt
    gloss: Ja! Ich war vorher auch auf dem Markt.
  hi.a1.unit12.lesson03.teach.dialogue.line04:
    title: Priya fragt nach dem Markt
    gloss: Schön! Was gab es auf dem Markt?
  hi.a1.unit12.lesson03.teach.dialogue.line05:
    title: Arjun antwortet
    gloss: Das Essen war gut.
  hi.a1.unit12.lesson03.teach.dialogue.line06:
    title: Priya fragt nach dem Teeladen
    gloss: Schön! Und wie war der Teeladen?
  hi.a1.unit12.lesson03.teach.dialogue.line07:
    title: Arjun antwortet
    gloss: Der Teeladen war sehr gut.
  hi.a1.unit12.lesson03.teach.dialogue.line08:
    title: Priya verabschiedet sich
    gloss: Schön! Treffen wir uns dann morgen wieder?
  hi.a1.unit12.lesson03.teach.mile_grammar:
    title: Tum/hum/ve haben die Vergangenheitsform im Plural
    gloss: 'Bei „tum“, „hum“ und „ve“ steht auch in der Vergangenheit dieselbe Form wie im Präsens mit „-te“: „the“ (statt „tha“), „gaye“ (statt „gaya“), „mile“ (statt „mila“) – so wie aus „hum milte hain“ „hum mile“ wird.'
    note: Hier steht das vollständige Muster zum Verständnis, geübt wird in dieser Lektion aber nur „mile“ – „the“ und „gaye“ müssen Sie nur erkennen und finden sich nur in dieser Erklärung.
  hi.a1.unit12.lesson03.teach.priya_note:
    title: Priyas Nachricht
    gloss: Arjun, der gestrige Tag war sehr schön. Das Essen war gut und der Teeladen war auch gut. – Priya
    note: Eine kurze schriftliche Nachricht, die die Fakten aus dem Dialog wiederholt, ohne neue Vokabeln.
    glosses:
      कल: gestern
      दिन: Tag
      अच्छा: gut (maskulin)
      था: war (maskulin)
      खाना: Futter
      दुकान: Geschäft
      अच्छी: gut (feminin)
      थी: war (feminin)
