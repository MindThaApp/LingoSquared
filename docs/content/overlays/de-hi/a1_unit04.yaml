    title: Uhrzeit
lessons:
  hi.a1.unit04.lesson01.kitne_baje_hain:
    title: Wie spät ist es?
  hi.a1.unit04.lesson02.din_ka_samay:
    title: Tageszeiten
  hi.a1.unit04.lesson03.agli_class_ka_samay:
    title: Die Uhrzeit des nächsten Kurses
teaching:
  hi.a1.unit04.lesson01.teach.baje:
    title: Uhr
    gloss: Uhr (bei zwei und mehr)
    note: Steht bei jeder Stunde außer eins -- die Sonderform für *ein Uhr* folgt später in dieser Lektion.
    example_gloss: Es ist jetzt fünf Uhr.
  hi.a1.unit04.lesson01.teach.abhi:
    title: Jetzt
    gloss: jetzt
    note: Ein einfaches Zeitwort, das Sie beim Sagen der aktuellen Uhrzeit ständig brauchen.
    example_gloss: Es ist jetzt zehn Uhr.
  hi.a1.unit04.lesson01.teach.ek_do_teen:
    title: Eins, zwei, drei
    gloss: eins, zwei, drei
    note: 'Aus Lektion 2 bekannt, hier für die Uhrzeit nötig -- beachten Sie: *ek* steht mit dem besonderen *baja*, *do* und *teen* dagegen mit dem regulären *baje*.'
    example_gloss:
    - Es ist jetzt ein Uhr.
    - Es ist jetzt zwei Uhr.
    - Es ist jetzt drei Uhr.
  hi.a1.unit04.lesson01.teach.chaar_paanch_chhah:
    title: Vier, fünf, sechs
    gloss: vier, fünf, sechs
    note: Aus Lektion 2 bekannt -- alle drei stehen mit dem regulären *baje*.
    example_gloss:
    - Es ist jetzt vier Uhr.
    - Es ist jetzt fünf Uhr.
    - Es ist jetzt sechs Uhr.
  hi.a1.unit04.lesson01.teach.saat_aath_nau:
    title: Sieben, acht, neun
    gloss: sieben, acht, neun
    note: Aus Lektion 2 bekannt.
    example_gloss:
    - Es ist jetzt sieben Uhr.
    - Es ist jetzt acht Uhr.
    - Es ist jetzt neun Uhr.
  hi.a1.unit04.lesson01.teach.das_gyaarah_baarah:
    title: Zehn, elf, zwölf
    gloss: zehn, elf, zwölf
    note: Aus Lektion 2 bekannt -- die letzten der Stundenzahlen, die Sie brauchen.
    example_gloss:
    - Es ist jetzt zehn Uhr.
    - Es ist jetzt elf Uhr.
    - Es ist jetzt zwölf Uhr.
  hi.a1.unit04.lesson01.teach.baja_grammar_note:
    title: Baja und baje
    gloss: '*Baja* steht bei *eins*, *baje* bei allen anderen Zahlen: *ek baja hai*, *do baje hain*.'
    note: Eine echte, wichtige Ausnahme bei der Kongruenz, keine Vereinfachung -- *ek baja hai* ist die einzige Stunde mit der Singularform.
  hi.a1.unit04.lesson01.teach.kitne_baje_hain:
    title: Nach der Uhrzeit fragen
    gloss: Wie spät ist es?
    note: Wörtlich „Wie viele Uhr sind es“ -- die übliche Art, nach der Uhrzeit zu fragen.
  hi.a1.unit04.lesson01.teach.abhi_paanch_baje_hain:
    title: Die Uhrzeit sagen
    gloss: Es ist jetzt fünf Uhr.
    note: Die natürliche Antwort in einem ganzen Satz auf *Kitne baje hain?*
  hi.a1.unit04.lesson02.teach.yoga_class_reprise:
    title: Yogakurs
    gloss: Yogakurs
    note: Aus Lektion 1 bekannt -- das durchgehende Beispiel dieser Lektion für Terminplanung.
    example_gloss: Der Yogakurs ist heute.
  hi.a1.unit04.lesson02.teach.subah:
    title: Morgen
    gloss: Morgen, Vormittag
    note: Eines von vier Wörtern für Tageszeiten in dieser Lektion.
    example_gloss: Der Yogakurs ist morgens.
  hi.a1.unit04.lesson02.teach.dopahar:
    title: Nachmittag / Mittag
    gloss: Nachmittag, Mittag
    note: Deckt sowohl die Mittagszeit als auch den frühen Nachmittag ab.
    example_gloss: Am Nachmittag ist kein Kurs.
  hi.a1.unit04.lesson02.teach.shaam:
    title: Abend
    gloss: Abend
    note: Die Zeit des Tages nach *dopahar* und vor *raat*.
    example_gloss: Der nächste Kurs ist um fünf Uhr abends.
  hi.a1.unit04.lesson02.teach.raat:
    title: Nacht
    gloss: Nacht
    note: Das letzte der vier Wörter für Tageszeiten.
    example_gloss: Nachts ist kein Kurs.
  hi.a1.unit04.lesson02.teach.ko_reprise:
    title: Ko bei einer allgemeinen Zeitangabe
    gloss: '*Ko* steht bei einem Wort für die Tageszeit, wenn keine bestimmte Stunde genannt wird: *dopahar ko*, *raat ko*.'
    note: Dasselbe *ko*, das einen Wochentag markiert (Lektion 3), markiert hier einen allgemeinen Zeitraum -- eine echte, natürliche Konstruktion, aber nicht die einzige dieser Lektion (die Form für eine bestimmte Stunde steht in der nächsten Anmerkung).
  hi.a1.unit04.lesson02.teach.time_of_day_baje_note:
    title: Ein Tageszeitwort direkt vor baje
    gloss: 'Bei einer bestimmten Stunde steht das Tageszeitwort direkt vor *baje*, ohne ein Wort dazwischen: *subah saat baje*, *shaam paanch baje*.'
    note: Hier steht kein *ko* -- das gilt nur für einen allgemeinen Zeitraum ohne bestimmte Stunde, wie die vorige Anmerkung erklärt.
  hi.a1.unit04.lesson02.teach.class_kitne_baje_hai:
    title: Nach der Kurszeit fragen
    gloss: Um wie viel Uhr ist der Kurs?
    note: Dasselbe Muster *kitne baje* wie in Lektion 1, jetzt aber für die Frage nach einem Ereignis statt nach der aktuellen Uhrzeit.
  hi.a1.unit04.lesson02.teach.class_subah_saat_baje_hai:
    title: Die Uhrzeit eines Ereignisses nennen
    gloss: Der Unterricht ist um sieben Uhr morgens.
    note: Verbindet *subah* direkt mit *saat baje*, wie in der Grammatikanmerkung oben.
  hi.a1.unit04.lesson03.teach.kal:
    title: Morgen / gestern
    gloss: morgen, gestern
    note: Hindi hat für beides ein Wort – der Kontext (und die Zeitform des Verbs) zeigt, was gemeint ist. In dieser Lektion bedeutet es immer „morgen“.
    example_gloss: Morgen ist der Unterricht um fünf Uhr abends.
  hi.a1.unit04.lesson03.teach.agli_reprise:
    title: Nächste
    gloss: nächste
    note: Aus Einheit 3 wiederholt – weibliche Form, passend zum femininen *class*.
    example_gloss: Der nächste Unterricht ist morgen.
  hi.a1.unit04.lesson03.teach.theek_hai_shukriya_reprise:
    title: Okay, danke
    gloss: Okay, danke!
    note: Beide Wörter stammen aus dem Verabschiedungswortschatz von Einheit 1.
  hi.a1.unit04.lesson03.teach.milte_hain_reprise:
    title: Wir treffen uns / bis bald
    gloss: wir sehen uns / bis bald
    note: Aus der Verabschiedung am Ende von Einheit 3 wiederholt, jetzt mit *kal* für „bis morgen“.
  hi.a1.unit04.lesson03.teach.agli_class_kitne_baje_hai:
    title: Fragen, wann der nächste Unterricht ist
    gloss: Um wie viel Uhr ist der nächste Unterricht?
    note: Verbindet *agli* (feminin, passend zu „class“) mit dem Muster *kitne baje* dieser Einheit.
  hi.a1.unit04.lesson03.teach.agli_class_shaam_paanch_baje_hai:
    title: Die Uhrzeit des nächsten Unterrichts nennen
    gloss: Der nächste Unterricht ist um fünf Uhr abends.
    note: Die natürliche Antwort in einem ganzen Satz auf die obige Frage.
  hi.a1.unit04.lesson03.teach.kal_milte_hain:
    title: Mit der Verabredung für morgen abschließen
    gloss: Okay, bis morgen!
    note: So beendet man natürlich ein Gespräch, wenn eine Uhrzeit vereinbart ist.
  hi.a1.unit04.lesson03.teach.dialogue.line01:
    title: Arjun fragt nach dem nächsten Unterricht
    gloss: Arjun fragt, um wie viel Uhr der nächste Unterricht ist.
    note: Greift die Frage dieser Lektion wörtlich auf.
  hi.a1.unit04.lesson03.teach.dialogue.line02:
    title: Priya nennt die Uhrzeit
    gloss: Priya sagt, der nächste Unterricht sei um fünf Uhr abends.
    note: Greift den Antwortsatz dieser Lektion wörtlich auf.
  hi.a1.unit04.lesson03.teach.dialogue.line03:
    title: Arjun bedankt sich bei ihr
    gloss: 'Arjun sagt: okay, danke.'
    note: Aus dem Wortschatz von Einheit 1 wiederholt.
  hi.a1.unit04.lesson03.teach.dialogue.line04:
    title: Priya beendet das Gespräch
    gloss: 'Priya stimmt zu und sagt: bis morgen.'
    note: Greift den Schlusssatz dieser Lektion wörtlich auf.
