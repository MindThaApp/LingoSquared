teaching:
  hi.a1.unit26.lesson01.teach.jaiket_svetar:
    title: Mantel, Pullover
    gloss: der Mantel, der Pullover
    note: '*जैकेट* ist feminin und *स्वेटर* maskulin, das erkennt man an den Wörtern, die dazugehören: *मेरी जैकेट*, *मेरा स्वेटर*.'
    example_gloss:
    - Ich suche einen Mantel.
    - Ich habe einen Pullover.
  hi.a1.unit26.lesson01.teach.paint_joote:
    title: Hose, Schuhe
    gloss: die Hose, die Schuhe
    note: '*पैंट* ist ein einzelnes Wort für eine Hose (*मेरी पैंट*), und *जूते* ist der Plural von *जूता*: Ein maskulines Nomen auf *-आ* bekommt im Plural die Endung *-ए*.'
    example_gloss:
    - Ich suche eine Hose.
    - Ich suche Schuhe.
  hi.a1.unit26.lesson01.teach.main_ek_jaiket:
    title: Sagen, was man sucht
    gloss: Ich suche einen Mantel.
    note: 'Das Verb steht am Satzende: *मैं एक जैकेट ढूँढ़ रहा हूँ*. *रहा हूँ* drückt aus, dass etwas gerade geschieht („ich suche gerade“), und *रहा* ist die maskuline Form (eine Frau sagt *रही*).'
  hi.a1.unit26.lesson02.teach.saiz:
    title: Größe
    gloss: die Größe
    note: '*साइज़* ist ein maskulines Nomen, daher sind auch die dazugehörigen Wörter maskulin: *मेरा साइज़*.'
    example_gloss: Welche Größe haben Sie?
  hi.a1.unit26.lesson02.teach.apka_saiz_kya:
    title: Nach der Größe fragen
    gloss: Welche Größe hast du?
    note: '*कौन सा* („welcher“) fragt nach einer Auswahl aus mehreren Möglichkeiten, und *सा* richtet sich nach dem Nomen: *कौन सा साइज़*, aber *कौन सी जैकेट*. *आप* ist die höfliche Anrede, hier für den Verkäufer oder die Verkäuferin.'
  hi.a1.unit26.lesson02.teach.mera_saiz_em:
    title: Die eigene Größe nennen
    gloss: Ich habe Größe M.
    note: 'Hindi verwendet hier kein Verb für „haben“: *मेरा साइज़ एम है* heißt wörtlich „meine Größe ist M“, und *मेरा* richtet sich nach dem maskulinen *साइज़*.'
  hi.a1.unit26.lesson03.teach.kala_neela:
    title: Schwarz, Blau
    gloss: schwarz, blau
    note: Die beiden Grundfarben-Adjektive in dieser Lektion.
    example_gloss:
    - Ich möchte den Mantel in Schwarz.
    - Haben Sie diesen auch in Blau?
  hi.a1.unit26.lesson03.teach.mujhe_vah_jaiket:
    title: Eine Farbe wünschen
    gloss: Ich möchte den Mantel in Schwarz.
    note: '*मुझे ... चाहिए* ist die Hindi-Art, „ich möchte“ zu sagen: Der Wunsch besteht „bei mir“ (*मुझे*), und das Gewünschte steht direkt vor *चाहिए*.'
  hi.a1.unit26.lesson03.teach.kya_apke_pas:
    title: Nach einer anderen Farbe fragen
    gloss: Haben Sie diesen auch in Blau?
    note: '*आपके पास ... है?* („bei Ihnen ... ist?“) ist die höfliche Art zu fragen „Haben Sie ...?“, und *भी* („auch“) steht nach dem Wort, auf das es sich bezieht.'
  hi.a1.unit26.lesson04.teach.kya_yah_jaiket:
    title: Nach der Passform fragen
    gloss: Passt dir dieser Mantel?
    note: 'Hindi sagt bei Kleidung, sie „kommt richtig“: *ठीक आती है*. Das Verb richtet sich nach der Sache: Zu einer femininen *जैकेट* gehört *आती*, zu einem maskulinen *स्वेटर* würde *आता* gehören.'
  hi.a1.unit26.lesson04.teach.yah_ekdam_theek:
    title: Gute Passform bestätigen
    gloss: Er passt gut.
    note: '*एकदम* („völlig“) ergibt „passt perfekt“; *आती है* richtet sich nach der femininen *जैकेट*.'
  hi.a1.unit26.lesson04.teach.yah_bahut_chhotee:
    title: Zu klein
    gloss: Er ist zu klein.
    note: '*बहुत* steht vor dem Adjektiv und bedeutet hier „zu“: *बहुत छोटी*. Das Adjektiv richtet sich nach der femininen *जैकेट*.'
  hi.a1.unit26.lesson04.teach.yah_bahut_baree:
    title: Zu groß
    gloss: Er ist zu groß.
    note: 'Dasselbe Muster mit *बड़ी*: *बड़ा* wird bei einem femininen Nomen zu *बड़ी*, also *बहुत बड़ी*.'
  hi.a1.unit26.lesson05.teach.nabbe:
    title: Neunhundert
    gloss: neunhundert
    note: '*नौ सौ* ist die Zahl 900, die hier im Preis der Jacke vorkommt.'
    example_gloss: Die Jacke kostet neunhundert Rupien.
  hi.a1.unit26.lesson05.teach.jaiket_kee_keemat:
    title: Einen Preis nennen
    gloss: Die Jacke kostet neunhundert Rupien.
    note: 'Hindi sagt „der Preis der Jacke ist ...“: *जैकेट की कीमत नौ सौ रुपये है*. *की* richtet sich nach dem femininen *कीमत*, nicht nach *जैकेट*.'
  hi.a1.unit26.lesson05.teach.sardee_kee_jaiket:
    title: Einen Kassenbon lesen
    gloss: 'Winterjacke: Größe M, Farbe Schwarz. Preis: neunhundert Rupien. Diese Jacke passt perfekt und ist warm.'
    note: Achten Sie auf Größe, Farbe, Preis und die zwei Eigenschaften, die zum Mantel genannt werden.
    glosses:
      सर्दी: Winter(jacke)
      साइज़: Größe
      रंग: Farbe
      काला: schwarz
      कीमत: der Preis
      नौ: neun
      सौ: hundert
      रुपये: Rupien
      जैकेट: Mantel
      आती: passt
      गर्म: warm
  hi.a1.unit26.lesson06.teach.priya_yah_jaiket:
    title: Priya bemerkt die Jacke
    gloss: 'Priya: Diese Jacke ist toll! Welche Größe hast du?'
    note: '*अच्छी* richtet sich nach der femininen *जैकेट*. *तुम्हारा* ist das informelle „dein“, wie man es unter Freunden verwendet.'
  hi.a1.unit26.lesson06.teach.arjun_mera_saiz:
    title: Arjun fragt, ob er sie anprobieren darf
    gloss: 'Arjun: Ich habe Größe M. Darf ich sie anprobieren?'
    note: '*पहनकर देखना* („anziehen und sehen“) ist die Hindi-Art, „anprobieren“ zu sagen. *सकता हूँ* bedeutet „kann“ oder „darf“, und eine Frau sagt *सकती हूँ*.'
  hi.a1.unit26.lesson06.teach.priya_zaroor_kya:
    title: Priya fragt nach der Passform
    gloss: 'Priya: Klar. Passt sie gut?'
    note: '*यह* bedeutet „es“ oder „dies“, und *आती* richtet sich nach der femininen *जैकेट*.'
  hi.a1.unit26.lesson06.teach.arjun_han_yah:
    title: Arjun bestätigt
    gloss: 'Arjun: Ja, sie passt perfekt und ist auch warm.'
    note: Entspricht genau dem Kassenbon aus Lektion 5 – es ist derselbe Mantel.
  hi.a1.unit26.lesson06.teach.priya_barhiya_tum:
    title: Priya fragt nach der Farbe
    gloss: 'Priya: Super! Nimmst du sie in Schwarz oder in Blau?'
    note: '*या* („oder“) bietet eine Auswahl an. Das zweite *रंग* kann entfallen: *काले रंग में ... या नीले में*. *तुम* ist informell.'
  hi.a1.unit26.lesson06.teach.arjun_main_ise:
    title: Arjun entscheidet sich
    gloss: 'Arjun: Ich nehme sie in Schwarz.'
    note: '*लूँगा* ist das Futur von *लेना* („nehmen“), dem üblichen Verb, wenn man sich im Geschäft für etwas entscheidet. Eine Frau sagt *लूँगी*.'
  hi.a1.unit26.lesson06.teach.main_leta_hoon:
    title: लेता हूँ und लेता है
    gloss: Ich nehme, er nimmt.
    note: '*-ता* ist die Endung für Gewohnheiten und richtet sich nach dem Subjekt, während *हूँ* zu *मैं* und *है* zu *वह* gehört.'
