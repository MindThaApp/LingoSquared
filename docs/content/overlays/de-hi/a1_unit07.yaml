teaching:
  hi.a1.unit07.lesson01.teach.dukaan_bazaar:
    title: Laden, Markt
    gloss: Laden, Markt
    note: Zwei häufige Orte zum Einkaufen, die in dieser Lektion immer wieder vorkommen.
    example_gloss:
    - Das ist ein Laden.
    - Das ist ein Markt.
  hi.a1.unit07.lesson01.teach.dukaandaar:
    title: Ladenbesitzer
    gloss: Ladenbesitzer
    note: Eine neue Figur in dieser Lektion – die Person, die einen Laden führt. Sie wird mit aap angesprochen, weil sie fremd ist.
    example_gloss: Das ist der Ladenbesitzer.
  hi.a1.unit07.lesson01.teach.kameez_bag_topi:
    title: Hemd, Tasche, Hut
    gloss: Hemd, Tasche, Hut
    note: Drei häufige Dinge beim Einkaufen, an denen Sie in dieser Lektion das Muster *mujhe ... chahiye* aus der Essenslektion üben.
    example_gloss:
    - Ich möchte ein Hemd.
    - Ich möchte eine Tasche.
    - Ich möchte einen Hut.
  hi.a1.unit07.lesson01.teach.mujhe_yah_chahiye:
    title: Ich möchte das hier
    gloss: Ich hätte gern das hier.
    note: Eine allgemeine Wendung, um einen Gegenstand zu wünschen. Sie greift *mujhe ... chahiye* aus der Essenseinheit auf, hier mit *yah* (dieses).
  hi.a1.unit07.lesson01.teach.ji:
    title: Ji (höflicher Titel)
    gloss: eine höfliche Partikel der Ehrerbietung, ähnlich wie „Herr“ oder „Frau“ hinter dem Namen
    note: Wird an einen Namen oder Titel angehängt, um höflicher zu klingen. Üblich bei der Anrede fremder Personen, etwa eines Ladenbesitzers.
    example_gloss: Guten Tag, Herr Händler.
  hi.a1.unit07.lesson01.teach.sirf:
    title: Nur
    gloss: nur
    note: Damit sagt man, dass man nur eine einzige Sache möchte und nicht mehrere.
    example_gloss: Ich hätte gern nur ein Hemd.
  hi.a1.unit07.lesson01.teach.aapko_aur_kuch_chahiye:
    title: Möchten Sie noch etwas? (formell)
    gloss: Möchten Sie noch etwas?
    note: Die natürliche, höfliche Anschlussfrage eines Ladenbesitzers, nachdem er einen Teil der Bestellung aufgenommen hat. Sie greift *aapko* und *chahiye* auf.
  hi.a1.unit07.lesson01.teach.ji_nahin_sirf_yah:
    title: Nein, nur das hier
    gloss: Nein, nur das hier.
    note: Eine natürliche, höfliche Art, weitere Artikel abzulehnen. Sie greift *ji* und *sirf* aus dieser Lektion auf.
  hi.a1.unit07.lesson01.teach.tumhein_kya_chahiye_bataao:
    title: Sag, was du möchtest
    gloss: Sag, was du möchtest.
    note: Die informelle Übungsaufforderung, mit der dieser Kurs zu einer gesprochenen Antwort anregt, passend zur Version in der Essenseinheit.
  hi.a1.unit07.lesson02.teach.keemat:
    title: Preis
    gloss: Preis
    note: Aus Einheit 2 (Zahlen und Preise) übernommen und hier im Kontext des Einkaufens neu gelernt.
    example_gloss: Was kostet das?
  hi.a1.unit07.lesson02.teach.rupaye:
    title: Rupien
    gloss: Rupien
    note: Das Wort für die Währung, aus Einheit 2 übernommen und hier mit zwei verschiedenen Preisen geübt.
    example_gloss:
    - Es kostet zweihundert Rupien.
    - Es kostet fünfhundert Rupien.
  hi.a1.unit07.lesson02.teach.iski_keemat_kya_hai:
    title: Was kostet das?
    gloss: Was kostet das?
    note: Die Standardfrage nach dem Preis, direkt aus Einheit 2 übernommen.
  hi.a1.unit07.lesson02.teach.iski_keemat_bees_rupaye_hai:
    title: Es kostet zweihundert Rupien
    gloss: Es kostet zweihundert Rupien.
    note: Eine Beispielantwort auf die obige Frage nach dem Preis.
  hi.a1.unit07.lesson02.teach.kitne_ka_ki_note:
    title: Kitne ka / kitne ki
    gloss: „Yah kitne ka hai?“ verwendet man für maskuline Dinge, „Yah kitne ki hai?“ für feminine Dinge. *kitne* selbst ändert sich nie – nur *ka/ki* ändert sich, genau wie der Wechsel -a/-i bei *mera/meri* und *tumhara/tumhari*, den Sie schon kennen.
    note: 'Eine zweite, sehr gebräuchliche Art, nach dem Preis zu fragen. Sie folgt demselben Genusmuster wie die Possessivwörter: Nur die Partikel ka/ki ändert sich, nicht kitne.'
  hi.a1.unit07.lesson02.teach.yeh_kitne_ka_hai:
    title: Was kostet das? (maskulin)
    gloss: Wie viel kostet das?
    note: Wird für einen maskulinen Gegenstand verwendet, zum Beispiel eine Tasche.
  hi.a1.unit07.lesson02.teach.yeh_kitne_ki_hai:
    title: Was kostet das? (feminin)
    gloss: Wie viel kostet das?
    note: Wird für einen femininen Gegenstand verwendet, zum Beispiel eine Mütze.
  hi.a1.unit07.lesson02.teach.sasta_mehenga:
    title: Billig, teuer
    gloss: billig, teuer
    note: Ein gebräuchliches Adjektivpaar, um auf einen Preis zu reagieren. Hier stehen die maskulinen Formen.
    example_gloss:
    - Diese Tasche ist billig.
    - Diese Tasche ist teuer.
  hi.a1.unit07.lesson02.teach.sasti_mehengi_note:
    title: Sasti und mehengi
    gloss: „Sasta“ und „mehenga“ ändern sich wie „mera/meri“ nach maskulin und feminin – bei femininen Wörtern sagt man „sasti“ und „mehengi“, zum Beispiel „yah topi sasti hai“ (diese Mütze ist billig) oder „yah kameez mehengi hai“ (dieses Hemd ist teuer).
    note: Ein weiteres echtes Beispiel für dasselbe Genusmuster, auf das dieser Kurs immer wieder ausdrücklich hinweist.
  hi.a1.unit07.lesson03.teach.khareedna:
    title: Kaufen
    gloss: kaufen
    note: Greift die in Einheit 1 für Yoga gelernte Konstruktion „Verb + na chahta/chahti hun“ (ich möchte … ) auf, hier fürs Einkaufen.
    example_gloss:
    - Ich möchte dieses Hemd kaufen.
    - Ich möchte diese Mütze kaufen.
  hi.a1.unit07.lesson03.teach.chalo_kuch_khareedte_hain:
    title: Lass uns etwas kaufen!
    gloss: Lass uns etwas kaufen!
    note: Eine freundliche, feste Wendung, um gemeinsames Einkaufen vorzuschlagen. Sie eröffnet den Dialog am Ende dieser Einheit, passend zum Muster „chalo, kuch khate hain!“ der Essenseinheit.
  hi.a1.unit07.lesson03.teach.dialogue.line01:
    title: Arjun schlägt vor, einkaufen zu gehen
    gloss: 'Arjun sagt: Lass uns etwas kaufen.'
    note: Greift die Eröffnungswendung dieser Einheit auf.
  hi.a1.unit07.lesson03.teach.dialogue.line02:
    title: Priya ist einverstanden
    gloss: 'Priya ist einverstanden und fragt sich: ein Hemd oder eine Mütze?'
    note: Führt *ya* (oder) ein, um zwischen zwei Dingen zur Wahl zu stellen.
  hi.a1.unit07.lesson03.teach.dialogue.line03:
    title: Der Ladenbesitzer begrüßt sie
    gloss: Der Ladenbesitzer grüßt und fragt, was sie möchten.
    note: Die formelle Begrüßung im aap-Register, die *aapko kya chahiye* aus Lektion 1 aufgreift.
  hi.a1.unit07.lesson03.teach.dialogue.line04:
    title: Priya fragt nach einem Hemd
    gloss: Priya begrüßt den Ladenbesitzer höflich, bittet um ein Hemd und fragt dann nach dem Preis.
    note: Verbindet *ji*, *mujhe ... chahiye* und *iski keemat kya hai*.
  hi.a1.unit07.lesson03.teach.dialogue.line05:
    title: Der Ladenbesitzer nennt den Preis
    gloss: Der Ladenbesitzer sagt, es koste dreihundert Rupien.
    note: Greift das Muster *iski keemat ... rupaye hai* mit einer neuen Zahl auf.
  hi.a1.unit07.lesson03.teach.dialogue.line06:
    title: Priya reagiert und entscheidet sich
    gloss: 'Priya sagt: Dreihundert Rupien? Das ist billig! Ich hätte gern dieses Hemd.'
    note: Greift *sasti* aus der Grammatikanmerkung von Lektion 2 auf.
  hi.a1.unit07.lesson03.teach.dialogue.line07:
    title: Arjun fragt nach einer Mütze
    gloss: Arjun sagt, er hätte gern eine Mütze, und fragt, was sie kostet.
    note: Greift die feminine Form *kitne ki hai* aus Lektion 2 auf.
  hi.a1.unit07.lesson03.teach.dialogue.line08:
    title: Der Ladenbesitzer antwortet
    gloss: Der Ladenbesitzer sagt, die Mütze koste fünfhundert Rupien.
    note: Greift *paanch sau* (fünfhundert) aus Lektion 2 auf.
  hi.a1.unit07.lesson03.teach.dialogue.line09:
    title: Arjun reagiert und entscheidet sich trotzdem
    gloss: 'Arjun sagt: Fünfhundert Rupien? Das ist teuer! Na gut, ich hätte gern diese Mütze.'
    note: Greift *mehengi* aus der Grammatikanmerkung von Lektion 2 auf; dann kauft er sie trotzdem.
  hi.a1.unit07.lesson03.teach.dialogue.line10:
    title: Der Ladenbesitzer fragt, ob das alles ist
    gloss: 'Der Ladenbesitzer sagt: Gut, möchten Sie noch etwas?'
    note: Greift *aapko aur kuch chahiye* aus Lektion 1 auf.
  hi.a1.unit07.lesson03.teach.dialogue.line11:
    title: Priya schließt die Bestellung ab
    gloss: 'Priya sagt: Nein, nur das hier. Danke!'
    note: Greift *ji nahin, sirf yah* aus Lektion 1 sowie *shukriya* auf.
  hi.a1.unit07.lesson03.teach.dialogue.line12:
    title: Der Ladenbesitzer verabschiedet sich
    gloss: 'Der Ladenbesitzer sagt: Danke, bis bald!'
    note: Greift die Standard-Abschiedswendung dieses Kurses auf.
