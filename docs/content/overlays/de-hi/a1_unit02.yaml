answer_policy:
  nasalization_marks: Display and teach the correct chandrabindu/anusvara distinction (पाँच vs. मैं, हैं, में). In typed A1 answers, accept a variant that drops the nasalization mark entirely or substitutes anusvara for chandrabindu (पांच for पाँच) when every other character is correct -- these marks are small, easy to miss on a virtual keyboard, and near-homophonous in casual speech; this is a beginner course, not a spelling test. Do not extend this tolerance to a wrong vowel or consonant, which changes the actual word.
  punctuation: Hindi text is shown with the traditional danda (।) as the sentence-final mark, matching how it is actually printed and taught. In typed answers, accept the danda, a plain period (.), or the mark omitted entirely as equivalent -- most everyday Hindi typed on phones/keyboards uses a plain period, and this distinction carries no meaning difference. Question marks (?) and exclamation marks may likewise be omitted, but the fully punctuated form remains the model answer.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register (aap vs. tum) rather than written punctuation or nasalization marks.
course:
  title: Hindi A1
units:
  hi.a1.unit02.numbers:
    title: Zahlen
lessons:
  hi.a1.unit02.lesson01.numbers_zero_to_ten:
    title: Die Zahlen von null bis zehn
  hi.a1.unit02.lesson02.numbers_and_prices:
    title: Zahlen von elf bis hundert und Preise
  hi.a1.unit02.lesson03.phone_and_age:
    title: Telefonnummer und Alter
teaching:
  hi.a1.unit02.lesson01.teach.shoonya:
    title: 'Null'
    gloss: 'null'
    note: Der Ausgangspunkt für alle Zahlen in dieser Lektion.
    example_gloss: Heute beträgt die Temperatur null Grad.
  hi.a1.unit02.lesson01.teach.ek:
    title: Eins
    gloss: eins
    note: Die Hindi-Zahlen von 11 bis 99 sind jeweils eigene Wörter und nicht nach dem Muster „zehn + eins“ gebildet – das sehen Sie in Lektion 2, wo बीस (20) und तीस (30) keinen erkennbaren Bestandteil mit एक (1) oder दो (2) gemeinsam haben.
    example_gloss: Ich habe ein Buch.
  hi.a1.unit02.lesson01.teach.do:
    title: Zwei
    gloss: zwei
    note: Eine einfache, sehr häufige Zahl – zugleich der informelle Imperativ von „geben“, aber der Kontext macht die Bedeutung immer klar.
    example_gloss: Ich habe zwei Brüder.
  hi.a1.unit02.lesson01.teach.teen:
    title: Drei
    gloss: drei
    note: '*Chahiye* („wird gebraucht“) ist eine häufige unpersönliche Konstruktion: *mujhe teen seb chahiye* heißt wörtlich „mir drei Äpfel [wird] gebraucht“ – eine sehr natürliche Art, „Ich brauche“ zu sagen.'
    example_gloss: Ich brauche drei Äpfel.
  hi.a1.unit02.lesson01.teach.chaar:
    title: Vier
    gloss: vier
    note: Hier gibt es keine Unregelmäßigkeit – chaar verhält sich wie jede andere kleine Zahl.
    example_gloss: Ich habe vier Freunde.
  hi.a1.unit02.lesson01.teach.paanch:
    title: Fünf
    gloss: fünf
    note: Wird mit Chandrabindu geschrieben (पाँच), nicht mit Anusvara – das Vokalzeichen für langes a (ा) ragt nicht über die Buchstaben hinaus, und genau dann steht ein Chandrabindu statt eines einfachen Punkts; dasselbe Muster kennen Sie schon aus हाँ/कहाँ in Einheit 1.
    example_gloss: Ich habe fünf Rupien.
  hi.a1.unit02.lesson01.teach.chhah:
    title: Sechs
    gloss: sechs
    note: In älteren Texten manchmal auch छः geschrieben; छह ist die moderne Standardschreibweise.
    example_gloss: Ich habe sechs Bücher.
  hi.a1.unit02.lesson01.teach.saat:
    title: Sieben
    gloss: sieben
    note: Eine nützliche Zahl, um über die Wochentage zu sprechen.
    example_gloss: Eine Woche hat sieben Tage.
  hi.a1.unit02.lesson01.teach.aath:
    title: Acht
    gloss: acht
    note: Keine Unregelmäßigkeit – aath verhält sich wie jede andere kleine Zahl.
    example_gloss: In diesem Zimmer stehen acht Stühle.
  hi.a1.unit02.lesson01.teach.nau:
    title: Neun
    gloss: neun
    note: Hier ist kein Nasalzeichen nötig, anders als bei manchen Nachbarzahlen.
    example_gloss: Der Yogakurs beginnt um neun Uhr morgens.
  hi.a1.unit02.lesson01.teach.das:
    title: Zehn
    gloss: zehn
    note: Die letzte Zahl dieser ersten Gruppe – Lektion 2 geht mit den Zahlen ab elf und den Zehnern weiter, die sich von hier an nicht mehr ableiten lassen.
    example_gloss: Ich habe zehn Finger an meinen Händen.
  hi.a1.unit02.lesson02.teach.gyaarah:
    title: Elf
    gloss: elf
    note: Ab hier ist jede Hindi-Zahl ein eigenes unregelmäßiges Wort – gyaarah enthält weder das Wort für 10 (das) noch das für 1 (ek) erkennbar. Eine Abkürzung gibt es nicht; jede Zahl muss einzeln gelernt werden.
    example_gloss: In dieser Klasse sind elf Schüler.
  hi.a1.unit02.lesson02.teach.baarah:
    title: Zwölf
    gloss: zwölf
    note: Noch eine Zahl zum Auswendiglernen – kein erkennbares Muster verbindet sie mit do (2).
    example_gloss: Ein Jahr hat zwölf Monate.
  hi.a1.unit02.lesson02.teach.pandrah:
    title: Fünfzehn
    gloss: fünfzehn
    note: Häufig, wenn es um kurze Zeitspannen geht, etwa eine Pause von fünfzehn Minuten.
    example_gloss: Ich brauche fünfzehn Minuten.
  hi.a1.unit02.lesson02.teach.bees:
    title: Zwanzig
    gloss: zwanzig
    note: Ein wirklich neues Wort, keine Kombination aus das (10) und do (2) – dieses Muster setzt sich bei allen weiteren Zehnern fort.
    example_gloss: Meine Schwester ist zwanzig Jahre alt.
  hi.a1.unit02.lesson02.teach.tees:
    title: Dreißig
    gloss: dreißig
    note: Wieder ein eigenes Wort – es sieht ein wenig wie teen (3) aus, lässt sich aber nicht aus teen plus das bilden; lernen Sie es daher als eigenes Wort.
    example_gloss: Die Fahrkarte kostet dreißig Rupien.
  hi.a1.unit02.lesson02.teach.pachaas:
    title: Fünfzig
    gloss: fünfzig
    note: Eine sehr häufig verwendete runde Zahl, besonders bei Preisen.
    example_gloss: Ich habe fünfzig Rupien.
  hi.a1.unit02.lesson02.teach.sau:
    title: Einhundert
    gloss: hundert
    note: Eine glatte runde Zahl, im Alltag bei Preisen extrem häufig.
    example_gloss: Dieses Buch kostet hundert Rupien.
  hi.a1.unit02.lesson02.teach.keemat:
    title: Preis
    gloss: Preis; Kosten
    note: '*Keemat* ist ein feminines Nomen – das Possessivwort steht immer in der femininen Form (*iski keemat*, „sein Preis“), ganz gleich, welcher Gegenstand bepreist wird.'
    example_gloss: Was kostet diese Fahrkarte?
  hi.a1.unit02.lesson02.teach.rupaye:
    title: Rupien
    gloss: Rupien
    note: '*Rupaya* ist die Singularform (für genau eine Rupie); *rupaye* steht bei jedem größeren Betrag.'
    example_gloss: Das kostet fünfzig Rupien.
  hi.a1.unit02.lesson02.teach.iski_keemat_kya_hai:
    title: Nach dem Preis fragen
    gloss: Was kostet es?
    note: '*Iski* („sein/ihr“) richtet sich nach dem femininen Nomen *keemat* („Preis“), nicht nach dem Gegenstand, dessen Preis erfragt wird – dasselbe Muster der Übereinstimmung beim Possessivwort, das Einheit 1 mit *mera naam* eingeführt hat.'
  hi.a1.unit02.lesson02.teach.iski_keemat_pachaas_rupaye_hai:
    title: Einen Preis nennen
    gloss: Es kostet fünfzig Rupien.
    note: Die natürliche Antwort in einem ganzen Satz auf Iski keemat kya hai?
  hi.a1.unit02.lesson03.teach.aapka_phone_number_kya_hai:
    title: Formell nach der Telefonnummer fragen
    gloss: Wie lautet Ihre Telefonnummer? (formell)
    note: '*Number* (नंबर) ist ein aus dem Englischen entlehntes Wort, das im Alltags-Hindi ständig gebraucht wird. *Aapka* richtet sich nach dem maskulinen Nomen *number*.'
  hi.a1.unit02.lesson03.teach.tumhara_phone_number_kya_hai:
    title: Nach der Telefonnummer fragen, informell
    gloss: Wie lautet deine Telefonnummer? (informell)
    note: Tumhara ersetzt aapka im Gespräch mit Freunden oder Gleichaltrigen, wie schon in Einheit 1.
  hi.a1.unit02.lesson03.teach.mera_number:
    title: Eine Nummer nennen, Einleitung
    gloss: Meine Nummer ist ...
    note: Ein natürlicher Einstieg, bevor man die Ziffern einzeln vorliest.
  hi.a1.unit02.lesson03.teach.sample_number:
    title: Eine Beispiel-Telefonnummer
    gloss: Sechs, zwei, acht, drei, fünf.
    note: Hindi-Telefonnummern werden Ziffer für Ziffer gelesen, genau wie im Deutschen – alle Ziffern hier kennen Sie bereits aus Lektion 1.
  hi.a1.unit02.lesson03.teach.aapki_umra_kya_hai:
    title: Nach dem Alter fragen, formell
    gloss: Wie alt sind Sie? (formell)
    note: '*Umra* („Alter“) ist ein feminines Nomen, deshalb steht *aapki* hier in der femininen Form – dasselbe Muster wie bei *iski keemat*, nun auf das Alter einer Person statt auf einen Preis angewandt.'
  hi.a1.unit02.lesson03.teach.tumhari_umra_kya_hai:
    title: Nach dem Alter fragen, informell
    gloss: Wie alt bist du? (informell)
    note: Tumhari ersetzt aapki im Gespräch mit Freunden oder Gleichaltrigen.
  hi.a1.unit02.lesson03.teach.meri_umra_tees_saal_hai:
    title: Das eigene Alter nennen
    gloss: Ich bin dreißig Jahre alt.
    note: '*Meri* richtet sich nach *umra* (feminin), nie nach dem Geschlecht der sprechenden Person. Anders als die Verbformen *chahta/chahti* aus Lektion 1 verändert sich dieses Possessivwort nicht, egal wer spricht.'
  hi.a1.unit02.lesson03.teach.dialogue.line01:
    title: Arjun fragt nach Priyas Nummer
    gloss: Arjun fragt Priya informell nach ihrer Telefonnummer.
    note: Greift die informelle Frage nach der Telefonnummer aus dieser Lektion genau auf.
  hi.a1.unit02.lesson03.teach.dialogue.line02:
    title: Priya nennt ihre Nummer und fragt zurück
    gloss: Priya liest ihre Telefonnummer Ziffer für Ziffer vor und fragt dann nach Arjuns Nummer.
    note: Alle Ziffern hier wurden schon in Lektion 1 dieser Einheit gelernt.
  hi.a1.unit02.lesson03.teach.dialogue.line03:
    title: Arjun nennt seine Nummer
    gloss: Arjun liest seine eigene Telefonnummer vor.
    note: Auch hier stammen alle Ziffern aus dem Wortschatz von Lektion 1.
  hi.a1.unit02.lesson03.teach.dialogue.line04:
    title: Priya fragt nach Arjuns Alter
    gloss: Priya bedankt sich und fragt ihn informell nach seinem Alter.
    note: Shukriya („danke“) ändert sich je nach Höflichkeitsstufe nicht, wie schon auf der shukriya-Karte in Einheit 1.
  hi.a1.unit02.lesson03.teach.dialogue.line05:
    title: Arjun nennt sein Alter und fragt zurück
    gloss: Arjun sagt, dass er zwanzig ist, und fragt dann Priya nach ihrem Alter.
    note: Tumhari? allein ist eine kurze, natürliche Art, die Frage zurückzugeben.
  hi.a1.unit02.lesson03.teach.dialogue.line06:
    title: Priya nennt ihr Alter
    gloss: Priya sagt, dass sie dreißig ist.
    note: Meri umra tees saal hai greift genau das Satzmuster auf, das weiter oben in dieser Lektion vorkam.
  hi.a1.unit02.lesson03.teach.dialogue.line07:
    title: Arjun beendet das Gespräch
    gloss: Arjun reagiert positiv und sagt, dass man sich wiedersieht.
    note: Accha und phir milenge greifen beide den Abschiedswortschatz aus Einheit 1 auf.
  hi.a1.unit02.lesson03.teach.dialogue.line08:
    title: Priya beendet das Gespräch
    gloss: Priya stimmt zu und sagt locker „Bis bald“.
    note: Theek hai und phir milte hain greifen beide den Abschiedswortschatz aus Einheit 1 auf.
