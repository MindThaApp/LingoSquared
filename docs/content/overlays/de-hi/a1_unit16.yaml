answer_policy:
  mujhe_noun_hai_symptom: This unit's central grammar point extends the dative + noun + है construction (मुझे/तुम्हें + noun + है) to symptom statements, e.g. "मुझे सिर दर्द है" (I have a headache). A typed answer that drops है entirely, or that appends हैं instead of है (है is invariant here -- it agrees with the following noun, not the दात subject), should be marked incorrect -- this is the exact point being tested.
  ke_paas_sense: '"डॉक्टर के पास जाना है" uses के पास in its third disclosed sense (at a person''s place), distinct from unit08''s "near" and "possession" senses. A typed answer omitting के पास entirely (e.g. just "मुझे डॉक्टर जाना है") should be marked incorrect, since के पास is the load-bearing piece that makes the sentence mean "to the doctor(''s)" rather than something ungrammatical.'
  karo_imperative: '"करो" is a regular तुम-imperative (कर + ओ), the same formation rule already taught for जाओ/मुड़ो/बताओ/गिनो in unit 9. A typed answer using a different, unlearned imperative form should be marked incorrect as a real error, not tolerated as a minor typo.'
  nasalization_marks: Display and teach the correct chandrabindu/anusvara distinction. None of this unit's new words (सिर, दर्द, बुखार, डॉक्टर, आराम, दवा, करो) carry any nasalization mark at all, verified via direct codepoint check -- no tolerance rule is needed for a nasalization mark that was never present.
  punctuation: Hindi text is shown with the traditional danda (।) as the sentence-final mark. In typed answers, accept the danda, a plain period (.), or the mark omitted entirely as equivalent. Question marks (?) may likewise be omitted, but the fully punctuated form remains the model answer.
  spoken_answers: Judge spoken responses by intelligibility rather than written punctuation. For any exercise asking the learner to state their own symptom or need, accept any of this unit's taught phrasings that fit the prompt, not only the single model sentence given in `accepted_answers`.
course:
  title: Hindi A1
units:
  hi.a1.unit16.health:
    title: Gesundheit
lessons:
  hi.a1.unit16.lesson01.sir_dard_bukhar:
    title: Kopfschmerzen und Fieber
  hi.a1.unit16.lesson02.doctor_dawa:
    title: Arzt und Medikamente
  hi.a1.unit16.lesson03.priya_arjun_theek_ho:
    title: 'Priya und Arjun: Geht es dir gut?'
teaching:
  hi.a1.unit16.lesson01.teach.tum_ho_review:
    title: 'Wiederholung: du, gut, bist'
    gloss: du (informell), gut / in Ordnung, bist
    note: Eine kurze Wiederholung der Wörter, die man braucht, um einen Freund zu fragen, wie er sich fühlt.
    example_gloss: Wie geht es dir?
  hi.a1.unit16.lesson01.teach.mujhe_hai_review:
    title: 'Wiederholung: mir, ist'
    gloss: mir / für mich, ist
    note: Die Kopula, die man für die Symptom-Konstruktion dieser Lektion braucht.
    example_gloss: Ich habe zu tun.
  hi.a1.unit16.lesson01.teach.tum_theek_ho_phrase:
    title: Geht es dir gut?
    gloss: Geht es dir gut?
    note: Die Eröffnungsfrage der Einheit, um bei einem Freund nachzufragen.
  hi.a1.unit16.lesson01.teach.main_hoon_nahin_review:
    title: 'Wiederholung: ich, bin, nein / nicht'
    gloss: ich, bin, nein / nicht
    note: Nötig, um die Frage „Geht es dir gut?“ verneinend zu beantworten.
    example_gloss: Mir geht es gut.
  hi.a1.unit16.lesson01.teach.sir:
    title: Kopf
    gloss: Kopf
    note: Ein neues Nomen, das für das erste Symptom dieser Einheit gebraucht wird.
    example_gloss: Mein Kopf ist groß.
  hi.a1.unit16.lesson01.teach.dard:
    title: Schmerz / Schmerzen
    gloss: Schmerz / Schmerzen
    note: Ein neues Nomen. Zusammen mit einem Körperteil benennt es bestimmte Schmerzen – siehe die Grammatikanmerkung dieser Einheit.
    example_gloss: Ich habe Schmerzen.
  hi.a1.unit16.lesson01.teach.mujhe_sir_dard_hai_phrase:
    title: Ich habe Kopfschmerzen.
    gloss: Ich habe Kopfschmerzen.
    note: Der erste vollständige Symptomsatz der Einheit.
  hi.a1.unit16.lesson01.teach.grammar_symptom_hai:
    title: Mujhe + Symptom + hai
    gloss: '„Mujhe + Nomen + hai“ haben Sie schon in Einheit 11 gelernt („mujhe kaam hai“ = Ich habe zu tun). Jetzt wird es auch für Symptome verwendet: „mujhe sir dard hai“ bedeutet „Ich habe Kopfschmerzen“ – „sir dard“ (sir = Kopf, dard = Schmerz) bilden zusammen „Kopfschmerzen“. Das ist keine neue Grammatik, sondern dasselbe Muster wie zuvor.'
    note: Zeigt die zweite Verwendung eines bereits gelernten Musters aus Dativ + Nomen + hai und nennt die frühere Einheit, bevor es auf Symptome angewendet wird.
  hi.a1.unit16.lesson01.teach.bukhar:
    title: Fieber
    gloss: Fieber
    note: Ein neues Nomen, das zweite Symptom dieser Einheit.
    example_gloss: Hast du Fieber?
  hi.a1.unit16.lesson01.teach.mujhe_bukhar_hai_phrase:
    title: Ich habe Fieber.
    gloss: Ich habe Fieber.
    note: Dasselbe Muster aus Dativ + Nomen + hai, angewendet auf das zweite Symptom dieser Lektion.
  hi.a1.unit16.lesson02.teach.tumhein_jaana_review:
    title: 'Wiederholung: dir, gehen'
    gloss: dir / für dich, gehen
    note: Beides schon gelernt (Einheit 6 und Einheit 15) – hier wiederverwendet, um über den Arztbesuch zu sprechen.
    example_gloss:
    - Was möchtest du?
    - Ich muss zum Bahnhof gehen.
  hi.a1.unit16.lesson02.teach.ke_paas_review:
    title: 'Wiederholung: in der Nähe von / bei'
    gloss: in der Nähe von / bei (einem Ort)
    note: In Einheit 8 eingeführt – hier wiederholt und in der Grammatikanmerkung dieser Lektion um eine dritte Bedeutung ergänzt.
    example_gloss: Die Bank ist in der Nähe der Schule.
  hi.a1.unit16.lesson02.teach.doctor:
    title: Arzt / Ärztin
    gloss: Arzt / Ärztin
    note: Ein neues Nomen, das Hauptthema dieser Lektion.
    example_gloss: Der Arzt ist gut.
  hi.a1.unit16.lesson02.teach.mujhe_doctor_ke_paas_jana_hai_phrase:
    title: Ich muss zum Arzt gehen.
    gloss: Ich muss zum Arzt gehen.
    note: Verbindet *ke paas* mit der Konstruktion der Verpflichtung *mujhe...jana hai* aus Einheit 15.
  hi.a1.unit16.lesson02.teach.grammar_ke_paas_third_sense:
    title: 'Ke paas: eine dritte Bedeutung'
    gloss: 'Die ersten beiden Bedeutungen von „ke paas“ kennen Sie schon – Nähe (Einheit 8: „bank school ke paas hai“) und Besitz (Einheit 2: „mere paas ek kitab hai“). Jetzt kommt eine dritte Verwendung: zu einer PERSON gehen, also sie aufsuchen – „doctor ke paas jana hai“ bedeutet „Ich muss zum Arzt gehen“. Auch das Muster „mujhe…jana hai“ aus Einheit 15 wird hier wiederholt.'
    note: Nennt beide früheren Bedeutungen mit Einheitsnummer, bevor die dritte eingeführt wird, und weist darauf hin, dass die Verpflichtungskonstruktion wiederverwendet wird.
  hi.a1.unit16.lesson02.teach.aaraam:
    title: Ruhe
    gloss: ruhen Sie sich aus
    note: Ein neues Nomen, der erste Ratschlag dieser Einheit.
    example_gloss: Ich brauche Ruhe.
  hi.a1.unit16.lesson02.teach.chahiye_review:
    title: 'Wiederholung: wollen / brauchen'
    gloss: wollen / brauchen
    note: In Einheit 6 eingeführt, hier wiederverwendet, um zu sagen, was jemand braucht.
    example_gloss: Ich hätte gern Tee.
  hi.a1.unit16.lesson02.teach.tumhein_aaraam_chahiye_phrase:
    title: Du brauchst Ruhe.
    gloss: Du brauchst Ruhe.
    note: Das bereits bekannte Muster *tumhein...chahiye*, angewendet auf das neue Nomen dieser Lektion.
  hi.a1.unit16.lesson02.teach.dawa:
    title: Medikament
    gloss: Medikament
    note: Ein neues Nomen, der zweite Ratschlag dieser Einheit.
    example_gloss: Ich brauche ein Medikament.
  hi.a1.unit16.lesson02.teach.tumhein_dawa_chahiye_phrase:
    title: Du brauchst ein Medikament.
    gloss: Du brauchst ein Medikament.
    note: Dasselbe Muster mit *chahiye*, angewendet auf Medikamente.
  hi.a1.unit16.lesson02.teach.jaao_aur_review:
    title: 'Wiederholung: geh!, und'
    gloss: geh!, und
    note: Beides schon gelernt (Einheit 9 und Einheit 1/2) – hier wiederverwendet, um zwei Ratschläge zu verbinden.
    example_gloss:
    - Gehen Sie geradeaus.
    - Ich hätte gern Tee und Kaffee.
  hi.a1.unit16.lesson02.teach.karo_grammar:
    title: 'Karo: dieselbe Imperativregel auf -o'
    gloss: '„Karo“ folgt derselben tum-Imperativregel wie zuvor („jao“, „muro“, „batao“, „gino“ – alle enden auf „-o“). Hier wird es aus „karna“ (aus Einheit 11: „maaf karna“) gebildet: Der Stamm „kar“ plus „-o“ ergibt „karo“, also „mach!“. „Aaraam karo“ bedeutet „Ruh dich aus!“'
    note: Eine direkte, ausdrückliche Erweiterung der bekannten Imperativregel, angewendet auf ein Verb, das die Lernenden bereits als Infinitiv kennen.
  hi.a1.unit16.lesson02.teach.aaraam_karo_phrase:
    title: Ruh dich aus!
    gloss: Ruh dich aus!
    note: Der neue Imperativ, angewendet auf den ersten Ratschlag dieser Einheit.
  hi.a1.unit16.lesson02.teach.aaraam_karo_aur_doctor_ke_paas_jaao_phrase:
    title: Ruh dich aus und geh zum Arzt.
    gloss: Ruh dich aus und geh zum Arzt.
    note: Verbindet die zwei Ratschläge dieser Lektion zu einer natürlichen Aufforderung und bereitet die Lesekarte der dritten Lektion vor.
  hi.a1.unit16.lesson03.teach.dialogue.line01:
    title: Priya fragt, ob es Arjun gut geht
    gloss: Arjun, geht es dir gut?
  hi.a1.unit16.lesson03.teach.dialogue.line02:
    title: Arjun sagt, dass er Kopfschmerzen und Fieber hat
    gloss: Nein, ich habe Kopfschmerzen und Fieber.
  hi.a1.unit16.lesson03.teach.dialogue.line03:
    title: Priya sagt, dass er Ruhe braucht
    gloss: Das ist nicht gut. Du brauchst Ruhe.
  hi.a1.unit16.lesson03.teach.dialogue.line04:
    title: Arjun braucht auch ein Medikament
    gloss: Ja, aber ich brauche auch ein Medikament.
  hi.a1.unit16.lesson03.teach.dialogue.line05:
    title: Priya sagt, dass er zum Arzt gehen muss
    gloss: Okay. Du musst zum Arzt gehen.
  hi.a1.unit16.lesson03.teach.dialogue.line06:
    title: Arjun bedankt sich bei Priya
    gloss: Okay, danke.
  hi.a1.unit16.lesson03.teach.dialogue.line07:
    title: Priya sagt ihm, er soll sich ausruhen
    gloss: Ruh dich aus!
  hi.a1.unit16.lesson03.teach.dialogue.line08:
    title: Arjun stimmt zu
    gloss: Okay.
  hi.a1.unit16.lesson03.teach.grammar_summary:
    title: Drei Hauptregeln
    gloss: 'Die drei Hauptregeln dieser Einheit: (1) „mujhe/tumhein + Symptom + hai“ nennt ein gesundheitliches Problem (z. B. „mujhe bukhar hai“); (2) „tumhein/mujhe + Sache + chahiye“ nennt ein Bedürfnis (z. B. „tumhein aaraam chahiye“); (3) „X ke paas jana hai“ sagt, zu wem man gehen muss (z. B. „doctor ke paas jana hai“).'
    note: Eine abschließende Zusammenfassung der gesamten Grammatik der Einheit, parallel zur Grammatikanmerkung mit Paradigma in Einheit 15.
  hi.a1.unit16.lesson03.teach.advice_reading:
    title: Einen Ratschlag lesen
    gloss: Ruh dich aus. Geh zum Arzt.
    note: Eine kurze, direkte Aufforderung (ohne erzählerischen Rahmen, so wie echte gesprochene Ratschläge klingen), die genau die im Dialog genannten Tatsachen wiederholt, ohne neue Aussagen.
    glosses:
      आराम: ruh dich aus
      करो: mach (Imperativ von करना)
      डॉक्टर: Arzt / Ärztin
      जाओ: geh (Imperativ von जाना)
