    title: Eine Meinung zu einer Jahreszeit äußern
    gloss: '*मुझे* + Jahreszeit + Eigenschaft + *लगता है* drückt aus, was Sie von einer Jahreszeit halten: *मुझे गर्मी अच्छी लगती है* (Ich mag den Sommer).'
