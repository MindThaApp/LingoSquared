    title: Ein Gespräch über die Jahreszeiten
    gloss: 'Es ist jetzt Frühling. Die Blumen sind schön. Nina fragt: Welche Jahreszeit findest du schön? Arjun sagt: Ich mag den Sommer. Im Sommer schwimmen wir. Priya sagt: Ich mag den Winter. Im Winter laufen wir Schlittschuh.'
    note: Der Text fasst das Gespräch im Sprachcafé zusammen und gibt die Aussagen der Personen in wörtlicher Rede wieder.
