teaching:
  hi.a1.unit13.lesson01.teach.chai_coffee_review:
    title: 'Wiederholung: Tee, Kaffee'
    gloss: Tee, Kaffee
    note: Eine kurze Wiederholung des Wortschatzes aus Lektion 6, den Sie in dieser Lektion brauchen, um über Vorlieben und Abneigungen zu sprechen.
    example_gloss:
    - Ich möchte Tee.
    - Ich möchte Kaffee.
  hi.a1.unit13.lesson01.teach.mujhe_review:
    title: 'Wiederholung: mir'
    gloss: mir
    note: Das Dativpronomen, das Sie schon kennen und in den Lektionen 6/7/11 durchgehend verwendet haben -- hier bekommt es ein neues Prädikat an die Seite.
    example_gloss: Ich möchte Tee.
  hi.a1.unit13.lesson01.teach.pasand:
    title: Vorliebe / gefällt
    gloss: Vorliebe / gefällt
    note: Ein Nomen mit der Bedeutung „Gefallen“ (nicht „Lieblings-“) -- zusammen mit einem Dativsubjekt (mujhe/tumhein) und der Kopula hai/hain bildet es den Ausdruck für „Ich mag ...“.
    example_gloss: Tee gefällt mir.
  hi.a1.unit13.lesson01.teach.pasand_hai_grammar:
    title: Pasand hai = mögen
    gloss: '''Pasand hai'' bedeutet „X gefällt mir“, also „Ich mag X“. Der Satz beginnt wie ''mujhe...chahiye'' (Lektion 6) mit mujhe/tumhein, aber nach ''chahiye'' steht kein ''hai'', während nach ''pasand'' immer ''hai'' oder ''hain'' folgt.'
    note: Macht den Unterschied zwischen chahiye (wollen/brauchen) und pasand hai (mögen) ausdrücklich deutlich, damit die beiden Konstruktionen nicht verwechselt werden.
  hi.a1.unit13.lesson01.teach.sangeet:
    title: Musik
    gloss: Musik
    note: Ein neues Nomen, an dem die Konstruktion pasand hai mit einem Subjekt im Singular geübt wird, das nicht zählbar ist.
    example_gloss: Ich mag Musik.
  hi.a1.unit13.lesson01.teach.haan_nahi_review:
    title: 'Wiederholung: ja, nicht'
    gloss: ja, nicht
    note: Eine kurze Wiederholung zweier früh gelernter Wörter, die Sie in dieser Lektion brauchen, um auf Fragen nach Vorlieben zu antworten und zu verneinen.
    example_gloss:
    - Ja, ich mag Musik.
    - Nein, ich mag keinen Kaffee.
  hi.a1.unit13.lesson01.teach.pasand_nahi_hai_phrase:
    title: Ich mag keinen Kaffee.
    gloss: Ich mag keinen Kaffee.
    note: Die Verneinung funktioniert genau wie in anderen bereits gelernten hai-Sätzen (z. B. 'yoga class nahin hai' in Lektion 3) -- nahin steht direkt vor hai.
  hi.a1.unit13.lesson01.teach.kitab_kitaben:
    title: Buch / Bücher
    gloss: Buch / Bücher
    note: Ein neues Nomenpaar in Singular und Plural, an dem sich zeigt, dass 'hai'/'hain' nach pasand sich nach der Zahl des Gemochten richtet.
    example_gloss:
    - Ich mag das Buch.
    - Ich mag Bücher.
  hi.a1.unit13.lesson01.teach.number_agreement_grammar:
    title: Hai oder hain nach pasand
    gloss: '''Hai'' oder ''hain'' nach ''pasand'' richtet sich nach der ZAHL des Gemochten -- genau wie bei ''mere paas...hai/hain'' (Lektion 2): Tee/Musik pasand hai (Singular), Bücher pasand hain (Plural).'
    note: Überträgt die bereits gelernte Regel zu hai/hain aus Lektion 2 auf einen neuen Zusammenhang, statt ein neues Grammatikkonzept einzuführen.
  hi.a1.unit13.lesson02.teach.tumhein_review:
    title: 'Wiederholung: dir (informell)'
    gloss: dir (informell)
    note: Erstmals in Lektion 6 mit chahiye gelernt ('tumhein...chahiye?') -- diese Lektion verwendet dasselbe Dativpronomen stattdessen mit pasand hai.
    example_gloss: Magst du Musik?
  hi.a1.unit13.lesson02.teach.kya_tumhein_pasand_hai_grammar:
    title: Kya tumhein...pasand hai?
    gloss: '''Kya'' am Satzanfang kennzeichnet eine Ja/Nein-Frage (Lektion 1); ''tumhein'' wiederholt dasselbe Dativ-Muster wie in ''tumhein...chahiye?'' (Lektion 6) -- hier steht ''pasand hai'' anstelle von ''chahiye''.'
    note: Zeigt, dass es sich um die Wiederverwendung eines bereits bekannten Fragemusters handelt und nicht um einen neuen Grammatikpunkt.
  hi.a1.unit13.lesson02.teach.khel:
    title: Sport / Spiel
    gloss: Sport / Spiel
    note: Ein neues Nomen. In den Beispielen steht es mit 'yah' (dieser), damit die Zahl eindeutig bleibt, denn 'khel' verändert sich von selbst zwischen Singular und Plural nicht.
    example_gloss: Ich mag diesen Sport.
  hi.a1.unit13.lesson02.teach.yah_review:
    title: 'Wiederholung: dieser / diese / dieses'
    gloss: dieser / diese / dieses
    note: Erstmals in Lektion 7 gelernt ('mujhe yah chahiye') -- hier wiederverwendet, damit der Bezug auf 'khel' im Singular eindeutig ist.
    example_gloss: Dieses Buch ist gut.
  hi.a1.unit13.lesson02.teach.ya_review:
    title: 'Wiederholung: oder'
    gloss: oder
    note: Erstmals in Lektion 6/7 beim Bestellen von Essen und beim Kaufen von Waren gelernt -- hier wiederverwendet, um eine Auswahlfrage zu Vorlieben zu stellen.
    example_gloss: Tee oder Kaffee?
  hi.a1.unit13.lesson02.teach.chai_ya_coffee_phrase:
    title: Magst du Tee oder Kaffee?
    gloss: Magst du Tee oder Kaffee?
    note: Verbindet das Fragemuster mit tumhein aus dieser Lektion mit dem bereits gelernten ya (oder), damit die Lernenden zwischen zwei Dingen wählen.
  hi.a1.unit13.lesson02.teach.zyada:
    title: Mehr
    gloss: mehr
    note: Ein neues Wort, das direkt vor 'pasand hai' steht, um eine Vorliebe zwischen zwei bereits genannten Dingen auszudrücken.
    example_gloss: Ich mag Tee lieber.
  hi.a1.unit13.lesson02.teach.zyada_pasand_grammar:
    title: Zyada pasand hai = bevorzugen
    gloss: '''X zyada pasand hai'' bedeutet, von zwei Dingen eines vorzuziehen -- ''mujhe chai zyada pasand hai'' heißt „Ich mag Tee lieber“ / „Ich bevorzuge Tee“.'
    note: Eine Wortschatzerweiterung, keine neue Grammatik -- 'zyada' ergänzt lediglich das bereits gelernte 'pasand hai'.
    target_text: '''X ज़्यादा पसंद है'' का मतलब है दो चीज़ों में से एक को तरजीह देना (bevorzugen) -- ''मुझे चाय ज़्यादा पसंद है'' का मतलब है ''Ich mag Tee lieber'' / ''Ich bevorzuge Tee''।'
  hi.a1.unit13.lesson03.teach.review_words:
    title: 'Wiederholung: Musik, Sport, Bücher'
    gloss: Musik, Sport/Spiel, Bücher
    note: Eine kurze Wiederholung der wichtigsten Nomen dieser Lektion, die Sie für den Dialog und die Lesenotiz brauchen.
    example_gloss:
    - Ich mag Musik.
    - Ich mag diesen Sport nicht.
    - Ich mag Bücher.
  hi.a1.unit13.lesson03.teach.dialogue.line01:
    title: Arjun fragt nach Musik
    gloss: Priya, magst du Musik?
  hi.a1.unit13.lesson03.teach.dialogue.line02:
    title: Priya sagt, dass sie Musik sehr mag
    gloss: Ja, ich mag Musik sehr. Und du?
  hi.a1.unit13.lesson03.teach.dialogue.line03:
    title: Arjun stimmt zu und ergänzt Sport
    gloss: Ich auch! Und ich mag auch Sport.
  hi.a1.unit13.lesson03.teach.dialogue.line04:
    title: Priya mag Bücher lieber als dieses Spiel
    gloss: Schön! Dieses Spiel mag ich nicht. Ich mag Bücher.
  hi.a1.unit13.lesson03.teach.dialogue.line05:
    title: 'Arjun fragt: Tee oder Kaffee?'
    gloss: Okay. Magst du Tee oder Kaffee?
  hi.a1.unit13.lesson03.teach.dialogue.line06:
    title: Priya bevorzugt Tee
    gloss: Ich mag Tee lieber.
  hi.a1.unit13.lesson03.teach.dialogue.line07:
    title: Arjun stimmt zu
    gloss: Sehr gut! Ich mag auch Tee.
  hi.a1.unit13.lesson03.teach.dialogue.line08:
    title: Priya beendet das Gespräch
    gloss: Okay! Sehen wir uns morgen wieder?
  hi.a1.unit13.lesson03.teach.chahiye_pasand_zyada_grammar:
    title: Drei verwandte Muster
    gloss: 'Die drei Muster dieser Lektion: Nach ''chahiye'' (wollen/brauchen, Lektion 6) steht kein ''hai''; ''pasand hai/hain'' (diese Lektion) richtet sich nach der Zahl der Sache; ''zyada pasand hai'' bedeutet, eines von zwei Dingen vorzuziehen.'
    note: Eine abschließende Zusammenfassung, die die gesamte Grammatik der Lektion verbindet, so wie die Grammatiknotiz in Lektion 12 ihr Paradigma zusammenfasst.
    target_text: 'इस यूनिट के तीन तरीके: ''चाहिए'' (चाहना/ज़रूरत, यूनिट 6) के बाद ''है'' नहीं आता; ''पसंद है/हैं'' (यह यूनिट) चीज़ की संख्या से बदलता है; ''ज़्यादा पसंद है'' का मतलब है दो में से एक को तरजीह देना (bevorzugen)।'
  hi.a1.unit13.lesson03.teach.priya_note:
    title: Priyas Notiz
    gloss: Arjun, ich mag Musik sehr. Ich mag auch Bücher. Dieses Spiel mag ich nicht. Tee mag ich lieber. – Priya
    note: Eine kurze schriftliche Notiz, die genau die Fakten aus dem Dialog wiederholt, ohne etwas Neues zu behaupten.
    glosses:
      संगीत: Musik
      बहुत: sehr
      पसंद: gemocht / gefällig
      किताबें: Bücher
      खेल: Spiel
      नहीं: nicht
      चाय: Tee
      ज़्यादा: mehr / lieber
