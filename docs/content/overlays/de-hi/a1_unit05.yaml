teaching:
  hi.a1.unit05.lesson01.teach.parivar:
    title: Familie
    gloss: Familie
    note: Das allgemeine Wort für „Familie“, das in dieser Einheit durchgehend verwendet wird.
    example_gloss: Meine Familie ist in Indien.
  hi.a1.unit05.lesson01.teach.pita_maa:
    title: Vater, Mutter
    gloss: Vater, Mutter
    note: Beide stehen bei der Vorstellung mit der respektvollen Pluralform *hain* statt *hai*, und *pita* steht mit *mere* statt *mera* – siehe die Anmerkung zur Höflichkeitsform weiter unten in dieser Lektion.
    example_gloss:
    - Das ist mein Vater.
    - Das ist meine Mutter.
  hi.a1.unit05.lesson01.teach.bhai_behan:
    title: Bruder, Schwester
    gloss: Bruder, Schwester
    note: 'Das Kernpaar dieser Einheit für den Kontrast mera/meri: *mera bhai*, *meri behan*.'
    example_gloss:
    - Ich habe einen Bruder.
    - Ich habe eine Schwester.
  hi.a1.unit05.lesson01.teach.ek_as_article:
    title: Ek als „ein/eine“
    gloss: '*Ek* bedeutet beim Zählen „eins“ und kann auch als „ein/eine“ stehen: *mera ek bhai hai*.'
    note: Dasselbe Wort, das schon als Zahl 1 gelernt wurde – Hindi hat keinen eigenen unbestimmten Artikel.
  hi.a1.unit05.lesson01.teach.mata_pita:
    title: Eltern
    gloss: Eltern
    note: Eine Zusammensetzung aus *mata* (Mutter, formell) und *pita* (Vater) – das Standardwort für „Eltern“.
    example_gloss: Meine Eltern wohnen in Delhi.
  hi.a1.unit05.lesson01.teach.mera_meri_note:
    title: Mera oder meri
    gloss: '*Mera* steht bei maskulinen Wörtern, *meri* bei femininen Wörtern: *mera bhai* (mein Bruder), *meri behan* (meine Schwester).'
    note: 'Der zentrale Grammatikpunkt dieser Lektion: Das Possessivwort richtet sich nach der besessenen Person oder Sache, nicht nach der sprechenden Person.'
  hi.a1.unit05.lesson01.teach.mere_honorific_note:
    title: Mere für respektierte ältere Personen
    gloss: 'Aus Respekt vor Älteren wird *mera* zu *mere* und *hai* zu *hain*, auch bei nur einer Person: *yeh mere pita hain* (Das ist mein Vater).'
    note: 'Das ist eine echte, feste Konvention und kein Fehler: Respektierte ältere Familienmitglieder im Singular (Vater, Großvater) erhalten diese pluralisch wirkende Form. Mütter und Großmütter behalten *meri*, aber das Verb steht aus demselben Grund trotzdem im Plural (*hain*).'
  hi.a1.unit05.lesson01.teach.yah_mera_bhai_hai:
    title: Das ist mein Bruder
    gloss: Das ist mein Bruder.
    note: Die einfache maskuline Form – für einen Bruder ist keine Höflichkeitsform nötig.
  hi.a1.unit05.lesson01.teach.yah_meri_behan_hai:
    title: Das ist meine Schwester
    gloss: Das ist meine Schwester.
    note: Die einfache feminine Form, passend zu *behan*.
  hi.a1.unit05.lesson01.teach.yah_kaun_hai:
    title: Wer ist das?
    gloss: Wer ist das?
    note: Eine einfache, nützliche Frage, um Familienmitglieder vorzustellen.
  hi.a1.unit05.lesson02.teach.dada_dadi:
    title: Großvater und Großmutter väterlicherseits
    gloss: Großvater väterlicherseits, Großmutter väterlicherseits
    note: Speziell die Eltern Ihres Vaters – siehe die spätere Anmerkung in dieser Lektion, die sie den Eltern Ihrer Mutter gegenüberstellt.
    example_gloss:
    - Mein Großvater wohnt in Delhi.
    - Meine Großmutter wohnt in Delhi.
  hi.a1.unit05.lesson02.teach.nana_nani:
    title: Großvater und Großmutter mütterlicherseits
    gloss: Großvater mütterlicherseits, Großmutter mütterlicherseits
    note: Die Eltern Ihrer Mutter – dafür verwendet Hindi ein ganz anderes Wortpaar als für die Eltern Ihres Vaters.
    example_gloss:
    - Mein Großvater (mütterlicherseits) wohnt in Mumbai.
    - Meine Großmutter (mütterlicherseits) wohnt in Mumbai.
  hi.a1.unit05.lesson02.teach.dilli_mumbai:
    title: Delhi, Mumbai
    gloss: Delhi, Mumbai
    note: Zwei große indische Städte, die in den Beispielen dieser Lektion als Wohnorte von Familienmitgliedern dienen.
    example_gloss:
    - Meine Familie wohnt in Delhi.
    - Mein Bruder wohnt in Mumbai.
  hi.a1.unit05.lesson02.teach.dada_nana_note:
    title: Zwei Großelternpaare
    gloss: 'Eltern des Vaters: *dada-dadi*. Eltern der Mutter: *nana-nani*.'
    note: Anders als im Deutschen mit dem einheitlichen „Großvater/Großmutter“ hat Hindi je nach Seite der Familie völlig getrennte Wörter.
  hi.a1.unit05.lesson02.teach.rehna_verb:
    title: wohnt (rehna)
    gloss: wohnt (maskulin / feminin / respektvoll-Plural)
    note: 'Das Verb für „wohnen“: *rehta hai* bei einem Mann, *rehti hai* bei einer Frau, *rehte hain* bei mehreren Personen oder einer respektierten älteren Person.'
    example_gloss:
    - Mein Bruder wohnt in Delhi.
    - Meine Schwester wohnt in Mumbai.
    - Meine Großeltern wohnen in Delhi.
  hi.a1.unit05.lesson02.teach.tumhara_tumhari:
    title: Dein (informell)
    gloss: dein (informell, maskulin / feminin)
    note: Das Possessivwort der informellen *tum*-Anrede; es richtet sich nach dem besessenen Nomen, genau wie *mera/meri*.
    example_gloss:
    - Wo wohnt dein Bruder?
    - Wo wohnt deine Schwester?
  hi.a1.unit05.lesson02.teach.mera_tumhara_note:
    title: Mera und tumhara zusammen
    gloss: '*Mera* und *tumhara* stehen beide bei maskulinen Wörtern; *meri* und *tumhari* beide bei femininen Wörtern: *mera bhai*/*tumhara bhai*, *meri behan*/*tumhari behan*.'
    note: Dasselbe Übereinstimmungsmuster wie in der ersten Lektion, hier auch bei *tumhara*.
  hi.a1.unit05.lesson03.teach.bada_badi:
    title: Älter / groß
    gloss: älter, groß (maskulin / feminin)
    note: Hindi kennzeichnet ein älteres Geschwister mit diesem veränderlichen Adjektiv und nicht mit einem eigenen Wort.
    example_gloss:
    - Mein älterer Bruder wohnt in Delhi.
    - Meine ältere Schwester wohnt in Mumbai.
  hi.a1.unit05.lesson03.teach.chota_choti:
    title: Jünger / klein
    gloss: jünger, klein (maskulin / feminin)
    note: Das Gegenstück zu *bada/badi*, für ein jüngeres Geschwister.
    example_gloss:
    - Mein jüngerer Bruder ist zurzeit Student.
    - Meine jüngere Schwester ist zurzeit Studentin.
  hi.a1.unit05.lesson03.teach.bada_chota_note:
    title: Bada/chota und die Übereinstimmung
    gloss: '*Bada* und *chota* stehen bei maskulinen Wörtern, *badi* und *choti* bei femininen Wörtern: *bada bhai*, *badi behan*.'
    note: Dieselbe maskuline/feminine Anpassung des Adjektivs wie bei *mera/meri*, nun bei Wörtern für das Alter.
  hi.a1.unit05.lesson03.teach.aur_lekin_bhi:
    title: Und, aber, auch
    gloss: und, aber, auch
    note: Drei grundlegende Bindewörter, die im abschließenden Dialog dieser Lektion immer wieder vorkommen.
    example_gloss:
    - Mein Bruder und meine Schwester wohnen in Delhi.
    - Mein Bruder wohnt in Delhi, aber meine Schwester wohnt in Mumbai.
    - Ich habe auch eine Schwester.
  hi.a1.unit05.lesson03.teach.accha_phir_milenge:
    title: Gut, bis bald
    gloss: Gut! Bis bald.
    note: Ein freundlicher Abschluss, bekannt aus dem Abschiedswortschatz von Einheit 2.
  hi.a1.unit05.lesson03.teach.theek_hai_phir_milte_hain:
    title: Alles klar, bis bald
    gloss: Alles klar, bis bald!
    note: Die informelle Antwort auf den obigen Abschied, passend zu den Abschlussdialogen früherer Einheiten.
  hi.a1.unit05.lesson03.teach.dialogue.line01:
    title: Arjun fragt nach Priyas Familie
    gloss: Arjun fragt, wo Priyas Familie wohnt.
    note: Greift das Muster *parivar kahan rehta hai* dieser Einheit wieder auf.
  hi.a1.unit05.lesson03.teach.dialogue.line02:
    title: Priya erzählt von ihren Eltern und ihrem Bruder
    gloss: Priya sagt, dass ihre Eltern in Delhi wohnen und dass sie auch einen älteren Bruder hat.
    note: Verbindet *mata-pita*, *rehte hain* und *bada bhai bhi hai*.
  hi.a1.unit05.lesson03.teach.dialogue.line03:
    title: Arjun fragt nach ihren Großeltern
    gloss: 'Arjun sagt „Ach so!“ und fragt: Und deine Großeltern?'
    note: '*Tumhare* ist die respektvolle Form von *tumhara* für Ältere, genau wie *mere* für *mera* (Hinweis zur Höflichkeitsform in Lektion 1).'
  hi.a1.unit05.lesson03.teach.dialogue.line04:
    title: Priya erzählt von beiden Großelternpaaren
    gloss: Priya sagt, dass ihre Großeltern väterlicherseits in Delhi wohnen, ihre Großeltern mütterlicherseits aber in Mumbai.
    note: Mit *lekin* werden die Städte der beiden Großelternpaare einander gegenübergestellt; das festigt den Unterschied zwischen dada-dadi und nana-nani aus Lektion 2.
  hi.a1.unit05.lesson03.teach.dialogue.line05:
    title: Arjun erwähnt seine eigene Schwester
    gloss: Arjun sagt, dass er auch eine jüngere Schwester hat.
    note: Greift *bhi* und *choti behan* wieder auf.
  hi.a1.unit05.lesson03.teach.dialogue.line06:
    title: Priya beendet das Gespräch
    gloss: Priya sagt „Schön!“ und „Bis bald“.
    note: Greift den Abschlusssatz dieser Lektion wieder auf.
  hi.a1.unit05.lesson03.teach.dialogue.line07:
    title: Arjun antwortet
    gloss: Arjun stimmt zu und sagt „Bis bald“.
    note: Greift die Antwortphrase dieser Lektion wieder auf.
