  hi.a1.unit18.lesson03.teach.dialogue.line02:
    title: Priya sagt, ihr Haus sei klein
    gloss: Mein Haus ist klein. Im Haus gibt es zwei Zimmer, eine Küche und ein Bad.
  hi.a1.unit18.lesson03.teach.dialogue.line03:
