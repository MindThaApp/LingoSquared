    gloss: Danke!
  hi.a1.unit18.lesson03.teach.grammar_summary:
    title: Drei Hauptregeln
    gloss: 'Die drei Hauptregeln dieser Lektion: (1) ''[Ort] + mein + [Zahl] + [Nomen] + hai/hain'' sagt, was in einem Zuhause ist und wie viele; (2) maskuline Nomen auf ''-a'' bilden den Plural auf ''-e'' (kamra -> kamre); (3) feminine Nomen auf ''-i'' bilden den Plural auf ''-iyan'' (kursi -> kursiyan, khidki -> khidkiyan).'
    note: Eine abschließende Zusammenfassung der gesamten Grammatik dieser Lektion, ähnlich den Grammatikhinweisen in den Lektionen 15–17.
  hi.a1.unit18.lesson03.teach.home_reading:
    title: Lesetext über zwei Häuser
    gloss: Priyas Haus ist klein. Im Haus gibt es zwei Zimmer, eine Küche und ein Bad. Arjuns Haus ist groß. Im Haus gibt es drei Schlafzimmer und eine große Küche.
    note: Ein kurzes, direktes Profil, das genau die im Dialog genannten Fakten wiederholt, ohne neue Angaben -- es dient direkt dem Ziel, eine kurze Wohnungsbeschreibung zu lesen.
    glosses:
      घर: Haus / Zuhause
      छोटा: klein
      कमरे: Zimmer
      रसोई: die Küche
      बाथरूम: Badezimmer
      बड़ा: groß
      बेडरूम: Schlafzimmer
      बड़ी: groß (feminin)
