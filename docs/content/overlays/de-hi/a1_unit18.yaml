teaching:
  hi.a1.unit18.lesson01.teach.ghar_review:
    title: 'Wiederholung: Haus / Zuhause'
    gloss: Haus / Zuhause
    note: Bereits in Einheit 8 gelernt – das Themenwort dieser ganzen Einheit.
    example_gloss: Das ist ein Haus.
  hi.a1.unit18.lesson01.teach.mein_review:
    title: 'Wiederholung: in / an'
    gloss: in / an
    note: Bereits in Einheit 1 gelernt – wird in dieser Einheit durchgehend verwendet, um Zimmer und Gegenstände zu verorten.
    example_gloss: Ich arbeite im Büro.
  hi.a1.unit18.lesson01.teach.hai_hain_review:
    title: 'Wiederholung: ist, sind'
    gloss: ist (Singular), sind (Plural)
    note: Das Paar aus Singular und Plural von „sein“, auf dem das gesamte Mengenmuster dieser Einheit beruht.
    example_gloss:
    - Das ist ein Haus.
    - Mein Großvater wohnt in Delhi.
  hi.a1.unit18.lesson01.teach.numbers_review:
    title: 'Wiederholung: wie viele, eins, zwei, drei'
    gloss: wie viele, eins, zwei, drei
    note: Bereits in den Einheiten 2/7 gelernt – hier wieder verwendet, um Zimmer zu zählen.
    example_gloss:
    - Ich habe drei Brüder.
    - Wie viele Zimmer hat das Haus?
  hi.a1.unit18.lesson01.teach.kamra_kamre:
    title: Zimmer (Singular / Plural)
    gloss: Zimmer (Singular), Zimmer (Plural)
    note: 'Ein neues Nomen. Achten Sie auf den Plural: *kamra* (eins) wird zu *kamre* (mehrere) – siehe die Grammatikbox dieser Lektion.'
    example_gloss:
    - Im Haus gibt es ein Zimmer.
    - Im Haus gibt es drei Zimmer.
  hi.a1.unit18.lesson01.teach.grammar_room_plural:
    title: 'Maskulin: Plural -a → -e'
    gloss: 'Maskuline Nomen auf „-a“ wechseln im Plural zu „-e“ – „kamra“ (eins) wird zu „kamre“ (mehrere). Auch das Verb ändert sich mit der Anzahl: „hai“ für eins, „hain“ für mehrere – z. B. „ghar mein ek kamra hai“, aber „ghar mein teen kamre hain“.'
    note: Die erste in diesem Kurs ausdrücklich gelehrte Pluralregel für Nomen, vorgestellt, bevor eine Übung sie voraussetzt.
  hi.a1.unit18.lesson01.teach.rasoi:
    title: Küche
    gloss: Küche
    note: Ein neues Nomen, das erste Zimmerwort dieser Einheit.
    example_gloss: Im Haus gibt es eine Küche.
  hi.a1.unit18.lesson01.teach.bathroom:
    title: Badezimmer
    gloss: Badezimmer
    note: Ein gängiges Lehnwort aus dem Englischen in der Alltagssprache, nach demselben Muster wie *doctor*/*engineer* (Einheit 16/17).
    example_gloss: Im Haus gibt es ein Bad.
  hi.a1.unit18.lesson01.teach.bedroom:
    title: Schlafzimmer
    gloss: Schlafzimmer
    note: Ebenfalls ein gängiges Lehnwort, unveränderlich wie *bathroom* – es bekommt keine eigene Pluralendung, es gilt nur das Muster Zahlwort + *hain*.
    example_gloss: Im Haus gibt es zwei Schlafzimmer.
  hi.a1.unit18.lesson01.teach.ghar_mein_kitne_kamre_phrase:
    title: Wie viele Zimmer hat das Haus?
    gloss: Wie viele Zimmer hat das Haus?
    note: Die Einstiegsfrage dieser Lektion.
  hi.a1.unit18.lesson01.teach.ghar_mein_teen_kamre_phrase:
    title: Das Haus hat drei Zimmer.
    gloss: Das Haus hat drei Zimmer.
    note: Eine Musterantwort auf die Einstiegsfrage dieser Lektion.
  hi.a1.unit18.lesson02.teach.aur_review:
    title: 'Wiederholung: und'
    gloss: und
    note: Bereits in Einheit 1 gelernt – hier wieder verwendet, um Möbel gemeinsam aufzuzählen.
    example_gloss: Mir hat es auch gefallen, und dir?
  hi.a1.unit18.lesson02.teach.mez:
    title: Tisch
    gloss: Tisch
    note: Ein neues Nomen, das in den Übungen dieser Einheit nur im Singular vorkommt (die eigene Pluralregel wird noch nicht gelehrt).
    example_gloss: In der Küche steht ein Tisch.
  hi.a1.unit18.lesson02.teach.kursi_kursiyan:
    title: Stuhl (Singular / Plural)
    gloss: Stuhl, Stühle
    note: 'Ein neues Nomen. Achten Sie auf den Plural: *kursi* (eins) wird zu *kursiyan* (mehrere) – eine andere Regel als bei *kamra*/*kamre*, siehe die Grammatikbox dieser Lektion.'
    example_gloss:
    - In der Küche steht ein Stuhl.
    - In der Küche stehen vier Stühle.
  hi.a1.unit18.lesson02.teach.chaar_review:
    title: 'Wiederholung: vier'
    gloss: vier
    note: Bereits in Einheit 2 gelernt – hier wieder verwendet, um Stühle zu zählen.
    example_gloss: In der Küche stehen vier Stühle.
  hi.a1.unit18.lesson02.teach.grammar_feminine_plural:
    title: 'Feminin: Plural -i → -iyan'
    gloss: Feminine Nomen auf '-i' bilden den Plural auf '-iyan' -- aus 'kursi' (ein Stuhl) wird 'kursiyan' (mehrere Stühle). Das ist eine andere Regel als bei 'kamra' → 'kamre' weiter vorn in dieser Lektion (maskulin), denn dieses Wort ist feminin und endet auf '-i'.
    note: Die zweite Pluralregel dieser Lektion, bewusst direkt nach der ersten eingeführt, damit der Unterschied leicht erkennbar ist.
  hi.a1.unit18.lesson02.teach.bistar:
    title: Bett
    gloss: Bett
    note: Ein neues Nomen, das in den Übungen dieser Lektion nur im Singular vorkommt.
    example_gloss: Im Schlafzimmer steht ein Bett.
  hi.a1.unit18.lesson02.teach.khidki_khidkiyan:
    title: Fenster (Singular / Plural)
    gloss: Fenster (Sg.), Fenster (Pl.)
    note: Folgt derselben femininen Pluralregel '-i' → '-iyan' wie *kursi*/*kursiyan*.
    example_gloss:
    - Im Schlafzimmer gibt es ein Fenster.
    - Im Schlafzimmer gibt es zwei Fenster.
  hi.a1.unit18.lesson02.teach.rasoi_mein_mez_phrase:
    title: In der Küche steht ein Tisch.
    gloss: In der Küche steht ein Tisch.
    note: Das Muster Ort + Gegenstand, hier auf die Küche angewendet.
  hi.a1.unit18.lesson02.teach.bedroom_mein_bistar_phrase:
