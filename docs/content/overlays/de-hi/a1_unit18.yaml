    example_gloss: Wie ist dein Haus?
  hi.a1.unit18.lesson03.teach.bada_chota_review:
    title: 'Wiederholung: groß, klein'
    gloss: groß (m.), groß (f.), klein (m.), klein (f.)
    note: 'In Lektion 14 eingeführt -- hier wieder verwendet, um ein Zuhause zu beschreiben. Es richtet sich nach dem Genus des Nomens: das maskuline *ghar* steht mit *bada*/*chota*, das feminine *rasoi* mit *badi*.'
    example_gloss:
