    gloss: Im Schlafzimmer steht ein Bett.
    note: Das Muster Ort + Gegenstand, hier auf das Schlafzimmer angewendet.
  hi.a1.unit18.lesson03.teach.kaisa_review:
    title: 'Wiederholung: wie beschaffen / wie ist ...?'
    gloss: wie beschaffen / wie ist ...?
