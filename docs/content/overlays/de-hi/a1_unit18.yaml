    gloss: Im Schlafzimmer gibt es ein Bett und zwei Fenster.
  hi.a1.unit18.lesson03.teach.dialogue.line07:
    title: Priya reagiert
    gloss: Sehr schön!
  hi.a1.unit18.lesson03.teach.dialogue.line08:
