teaching:
  hi.a1.unit03.lesson01.teach.aaj:
    title: Heute
    gloss: heute
    note: Dieses Wort brauchen Sie in fast jedem Satz dieser Lektion.
    example_gloss: Heute ist das Wetter schön.
  hi.a1.unit03.lesson01.teach.somvar:
    title: Montag
    gloss: Montag
    note: 'Benannt nach सोम (dem Mond) – wie im Deutschen: Montag ist der Tag des Mondes.'
    example_gloss: Der Yogakurs findet am Montag statt.
  hi.a1.unit03.lesson01.teach.mangalvar:
    title: Dienstag
    gloss: Dienstag
    note: Benannt nach मंगल (Mars) – nach diesem Muster sind die meisten Hindi-Wochentage benannt.
    example_gloss: Heute ist Dienstag.
  hi.a1.unit03.lesson01.teach.budhvar:
    title: Mittwoch
    gloss: Mittwoch
    note: Benannt nach बुध (Merkur).
    example_gloss: Heute ist Mittwoch.
  hi.a1.unit03.lesson01.teach.guruvar:
    title: Donnerstag
    gloss: Donnerstag
    note: Benannt nach गुरु (Jupiter).
    example_gloss: Heute ist Donnerstag.
  hi.a1.unit03.lesson01.teach.shukravar:
    title: Freitag
    gloss: Freitag
    note: Benannt nach शुक्र (Venus).
    example_gloss: Am Freitag gibt es keinen Yogakurs.
  hi.a1.unit03.lesson01.teach.shanivar:
    title: Samstag
    gloss: Samstag
    note: Benannt nach शनि (Saturn).
    example_gloss: Heute ist Samstag.
  hi.a1.unit03.lesson01.teach.ravivar:
    title: Sonntag
    gloss: Sonntag
    note: 'Benannt nach रवि, einem Sanskrit-Namen für die Sonne – wie im Deutschen: Sonntag ist der Tag der Sonne.'
    example_gloss: Heute ist Sonntag.
  hi.a1.unit03.lesson01.teach.kaun_sa_din_hai:
    title: Nach dem Wochentag fragen
    gloss: Welcher Tag ist heute?
    note: '*Kaun sa* („welcher“) richtet sich nach dem maskulinen Nomen *din* („Tag“) – die feminine Form *kaun si* begegnet Ihnen später bei femininen Nomen.'
  hi.a1.unit03.lesson01.teach.yoga_class_monday:
    title: Sagen, an welchem Tag etwas stattfindet
    gloss: Der Yogakurs findet am Montag statt.
    note: '*Ko* nach einem Wochentag bedeutet „am“ – *somvar ko* heißt „am Montag“, nach demselben Muster bei jedem Wochentag.'
  hi.a1.unit03.lesson01.teach.no_class_friday:
    title: Sagen, dass an einem Tag etwas nicht stattfindet
    gloss: Am Freitag gibt es keinen Yogakurs.
    note: Nahin verneint den Satz; ko markiert weiterhin den Tag und steht hier zur Betonung ganz vorn.
  hi.a1.unit03.lesson02.teach.jan_feb_mar:
    title: Januar, Februar, März
    gloss: Januar, Februar, März
    note: Die Hindi-Monatsnamen sind meist entlehnt und leicht wiederzuerkennen – keine neue Grammatik, nur Vokabeln.
    example_gloss:
    - Ich habe im Januar Geburtstag.
    - Der nächste Feiertag ist im Februar.
    - Mein Geburtstag ist im März.
  hi.a1.unit03.lesson02.teach.apr_may_jun:
    title: April, Mai, Juni
    gloss: April, Mai, Juni
    note: Dasselbe leicht erkennbare Muster wie bei den ersten drei Monaten.
    example_gloss:
    - Der nächste Feiertag ist im April.
    - Ich habe im Mai Geburtstag.
    - Der nächste Feiertag ist im Juni.
  hi.a1.unit03.lesson02.teach.jul_aug_sep:
    title: Juli, August, September
    gloss: Juli, August, September
    note: Sitambar wird hier mit Anusvara geschrieben (सितंबर); die Schreibweise mit halbem m (सितम्बर) ist ebenfalls üblich und genauso richtig.
    example_gloss:
    - Ich habe im Juli Geburtstag.
    - Der nächste Feiertag ist im August.
    - Ich habe im September Geburtstag.
  hi.a1.unit03.lesson02.teach.oct_nov_dec:
    title: Oktober, November, Dezember
    gloss: Oktober, November, Dezember
    note: Navambar und disambar haben dieselbe Anusvara-Schreibung wie sitambar; नवम्बर und दिसम्बर (mit halbem m) sind ebenfalls üblich und genauso richtig.
    example_gloss:
    - Der nächste Feiertag ist im Oktober.
    - Ich habe im November Geburtstag.
    - Der nächste Feiertag ist im Dezember.
  hi.a1.unit03.lesson02.teach.tareekh:
    title: Datum
    gloss: Datum
    note: '*Tareekh* ist ein feminines Nomen – das Fragewort steht daher in der femininen Form (*kitni tareekh*, nie *kitna tareekh*), dasselbe Kongruenzmuster wie bei *keemat* und *umra* in Einheit 2.'
    example_gloss: Heute ist der Dritte.
  hi.a1.unit03.lesson02.teach.mein_postposition:
    title: In (bei Monaten)
    gloss: in – wird mit Monatsnamen verwendet
    note: '*Mein* markiert einen Monat so, wie *ko* einen Tag markiert: *janvari mein* heißt „im Januar“, nie *janvari ko*.'
  hi.a1.unit03.lesson02.teach.aaj_kitni_tareekh_hai:
    title: Nach dem Datum fragen
    gloss: Welches Datum ist heute?
    note: Wörtlich „Wie viele ist heute das Datum“ – kitni richtet sich nach dem femininen tareekh.
  hi.a1.unit03.lesson02.teach.aaj_teen_tareekh_hai:
    title: Das Datum nur mit der Zahl nennen
    gloss: Heute ist der Dritte.
    note: Im Hindi wird das Datum mit einer einfachen Grundzahl (*teen*, „drei“) genannt, nicht mit einer eigenen Ordnungszahl wie im Deutschen „der Dritte“ – Sie brauchen kein eigenes Datumswort, nur die Zahlen, die Sie schon kennen.
  hi.a1.unit03.lesson02.teach.aaj_teen_january_hai:
    title: Das Datum mit Monat nennen
    gloss: Heute ist der dritte Januar.
    note: Dasselbe Grundzahl-Muster, nun mit dem Monatsnamen dahinter.
  hi.a1.unit03.lesson03.teach.kab:
    title: Wann
    gloss: wann
    note: Ein einfaches, sehr häufiges Fragewort.
    example_gloss: Wann ist die nächste Stunde?
  hi.a1.unit03.lesson03.teach.agli:
    title: Nächste
    gloss: nächste
    note: '*Agli* ist die feminine Form – *class* (क्लास) wird im Alltags-Hindi als feminines Nomen behandelt und hat daher *agli*, nicht das maskuline *agla*.'
    example_gloss: Die nächste Stunde ist am Dienstag.
  hi.a1.unit03.lesson03.teach.das_reprise:
    title: Zehn
    gloss: zehn
    note: Schon aus Einheit 2 bekannt – hier für ein echtes Datum nötig.
    example_gloss: Die nächste Stunde ist am Zehnten.
  hi.a1.unit03.lesson03.teach.janmadin:
    title: Geburtstag
    gloss: Geburtstag
    note: Ein maskulines Nomen – mera janmadin, nie meri janmadin.
    example_gloss: Mein Geburtstag ist im Dezember.
  hi.a1.unit03.lesson03.teach.tumhara_janmadin_kab_hai:
    title: Jemanden informell nach dem Geburtstag fragen
    gloss: Wann hast du Geburtstag?
    note: Tumhara richtet sich nach dem maskulinen janmadin.
  hi.a1.unit03.lesson03.teach.mera_janmadin_january_mein_hai:
    title: Den eigenen Geburtstag nennen
    gloss: Mein Geburtstag ist im Januar.
    note: Die natürliche Antwort im ganzen Satz auf Tumhara janmadin kab hai?
  hi.a1.unit03.lesson03.teach.agli_class_kab_hai:
    title: Fragen, wann die nächste Stunde ist
    gloss: Wann ist die nächste Stunde?
    note: Verbindet agli (feminin, passend zu class) mit kab.
  hi.a1.unit03.lesson03.teach.agli_class_mangalvar_das_march:
    title: Wochentag und Datum zusammen nennen
    gloss: Die nächste Stunde ist am Dienstag, dem 10. März.
    note: 'Wochentag und Datum stehen zusammen, ähnlich wie im Deutschen: zuerst der Tag, dann die Datumszahl und der Monat.'
  hi.a1.unit03.lesson03.teach.dialogue.line01:
    title: Arjun fragt nach der nächsten Stunde
    gloss: Arjun fragt, wann die nächste Yogastunde ist.
    note: Greift die Frage dieser Lektion genau auf, mit yog zur Verdeutlichung.
  hi.a1.unit03.lesson03.teach.dialogue.line02:
    title: Priya nennt Tag und Datum
    gloss: Priya sagt, die nächste Stunde ist am Dienstag, dem 10. März.
    note: Greift den Satz mit Tag und Datum aus dieser Lektion genau auf.
  hi.a1.unit03.lesson03.teach.dialogue.line03:
    title: Arjun bedankt sich
    gloss: 'Arjun sagt: Okay, danke.'
    note: Theek hai und shukriya stammen beide aus Einheit 1.
  hi.a1.unit03.lesson03.teach.dialogue.line04:
    title: Priya antwortet
    gloss: Priya sagt, es sei kein Problem.
    note: Koi baat nahin ist eine sehr gebräuchliche, natürliche Art, „gern geschehen“ oder „kein Problem“ zu sagen.
  hi.a1.unit03.lesson03.teach.dialogue.line05:
    title: Arjun fragt Priya nach ihrem Geburtstag
    gloss: Arjun fragt, wann Priya Geburtstag hat.
    note: Greift die informelle Geburtstagsfrage dieser Lektion genau auf.
  hi.a1.unit03.lesson03.teach.dialogue.line06:
    title: Priya antwortet
    gloss: Priya sagt, ihr Geburtstag ist im Januar.
    note: Greift den Antwortsatz dieser Lektion genau auf.
  hi.a1.unit03.lesson03.teach.dialogue.line07:
    title: Arjun reagiert und nennt seinen eigenen
    gloss: Arjun reagiert erfreut und sagt dann, sein Geburtstag ist im Dezember.
    note: Accha stammt aus dem Vokabular von Einheit 1; der Dezember wurde in Lektion 2 dieser Einheit eingeführt.
  hi.a1.unit03.lesson03.teach.dialogue.line08:
    title: Priya beendet das Gespräch
    gloss: Priya stimmt zu und verabschiedet sich locker.
    note: Theek hai und phir milte hain stammen beide aus dem Abschiedsvokabular von Einheit 1.
