teaching:
  hi.a1.unit30.lesson01.teach.parhna_kasrat_karna:
    title: Lesen, Sport, Kochen
    gloss: lesen, Sport treiben, kochen
    note: 'Hindi nennt Hobbys mit einem Verb auf *-ना*: *पढ़ना*, *कसरत करना* und *खाना बनाना* („lesen“, „Sport machen“, „kochen“).'
    example_gloss:
    - Ich lese gern ein Buch.
    - Ich treibe samstags Sport.
    - Ich koche gern für Freunde.
  hi.a1.unit30.lesson01.teach.khalee_samay:
    title: Freizeit
    gloss: Freizeit
    note: '*खाली समय* („leere Zeit“) ist die Schlüsselwendung, um über Hobbys zu sprechen, und *में* bedeutet hier „in“: *खाली समय में*.'
    example_gloss: In meiner Freizeit lese ich gern.
  hi.a1.unit30.lesson01.teach.mujhe_khalee_samay:
    title: Sagen, was man in der Freizeit macht
    gloss: In meiner Freizeit lese ich gern.
    note: '*मुझे ... पढ़ना पसंद है* („mir ist Lesen angenehm“) ist die Hindi-Art zu sagen „Ich lese gern“; *मुझे* nennt die Person, der es gefällt.'
  hi.a1.unit30.lesson02.teach.sangeet_sunna_chitr:
    title: Musik, Zeichnen, Gaming
    gloss: Musik hören, zeichnen, Videospiele spielen
    note: 'Drei weitere Hobbys: *संगीत सुनना*, *चित्र बनाना* und *गेम खेलना*; *गेम* ist ein Lehnwort aus dem Englischen.'
    example_gloss:
    - Ich höre gern Musik.
    - Ich zeichne oft.
    - Ich spiele gern mit Freunden Videospiele.
  hi.a1.unit30.lesson02.teach.mujhe_sangeet_sunna:
    title: Sagen, dass man gern Musik hört
    gloss: Ich höre gern Musik.
    note: 'Bei *संगीत सुनना* („Musik hören“) steht kein zusätzliches Wort: Das Objekt steht direkt vor dem Verb.'
  hi.a1.unit30.lesson02.teach.mujhe_doston_ke:
    title: Sagen, dass man gern mit Freunden Videospiele spielt
    gloss: Ich spiele gern mit Freunden Videospiele.
    note: '*दोस्तों के साथ* („mit Freunden“) setzt *दोस्त* in den Plural des Obliquus (*दोस्तों*), weil es vor *के साथ* steht.'
  hi.a1.unit30.lesson03.teach.hamesha_aksar_kabheekbhee:
    title: Immer, oft, manchmal, nie
    gloss: immer, oft, manchmal, nie
    note: Häufigkeitswörter wie *हमेशा*, *अक्सर*, *कभी-कभी* und *कभी नहीं* stehen meist vor dem Verb; *कभी नहीं* bedeutet „nie“.
    example_gloss:
    - Ich treibe immer samstags Sport.
    - Ich lese oft ein Buch.
    - Ich zeichne manchmal.
    - Ich spiele nie Videospiele.
  hi.a1.unit30.lesson03.teach.har_hafte_har:
    title: Jede Woche, jedes Wochenende
    gloss: jede Woche, jedes Wochenende
    note: '*हर* („jeder“) ändert sich nie, und das Zeitwort danach bleibt in der Grundform: *हर हफ़्ते*, *हर वीकेंड*.'
    example_gloss:
    - Ich koche jede Woche für Freunde.
    - Ich treibe jedes Wochenende Sport.
  hi.a1.unit30.lesson03.teach.har_hafte_har_2:
    title: हर bleibt unverändert
    gloss: Jede Woche, jedes Wochenende.
    note: '*हर* bleibt gleich, egal welches Nomen folgt; es gibt also keine Form auszuwählen: *हर हफ़्ते*, *हर वीकेंड*.'
  hi.a1.unit30.lesson03.teach.tum_khalee_samay:
    title: Nach der Freizeit fragen
    gloss: Was machst du in deiner Freizeit?
    note: Das ist die Kernfrage dieser Lektion – mit ihr können Sie jeden nach seinen Hobbys fragen.
  hi.a1.unit30.lesson04.teach.priya_ham_aksar:
    title: Priya spricht über Hobbys
    gloss: 'Priya: Wir gehen oft zusammen spazieren. Aber was machst du sonst noch in deiner Freizeit, Arjun?'
    note: '*टहलते हैं* steht im Plural, weil *हम* („wir“) das Subjekt ist; *अक्सर* steht vor dem Verb.'
  hi.a1.unit30.lesson04.teach.arjun_mujhe_khana:
    title: Arjuns Hobbys
    gloss: 'Arjun: Ich koche gern, auch zu Hause. Und ich mache oft Sport.'
    note: '*घर पर भी* („auch zu Hause“) zeigt, dass Arjun nicht nur bei der Arbeit, sondern auch zum Vergnügen kocht.'
  hi.a1.unit30.lesson04.teach.priya_tum_ghar:
    title: Priya ist überrascht
    gloss: 'Priya: Du kochst auch zu Hause? Du kochst doch schon den ganzen Tag bei der Arbeit!'
    note: '*पूरा दिन* („den ganzen Tag“) betont, wie viel er schon bei der Arbeit kocht, und *तो* verstärkt die Aussage.'
  hi.a1.unit30.lesson04.teach.arjun_han_lekin:
    title: Arjun erklärt
    gloss: 'Arjun: Ja, aber Kochen entspannt mich. Und du, was machst du gern?'
    note: '*खाना बनाने से सुकून मिलता है* bedeutet „Kochen entspannt mich“ (wörtlich „vom Kochen bekommt man Ruhe“); *बनाना* wird vor *से* zu *बनाने*.'
  hi.a1.unit30.lesson04.teach.priya_mujhe_parhna:
    title: Priyas Hobbys
    gloss: 'Priya: Ich lese gern, und ich höre oft Musik.'
    note: '*और* („und“) verbindet zwei Hobbys, und *सुनती हूँ* ist feminin, weil Priya spricht.'
  hi.a1.unit30.lesson04.teach.arjun_kya_tum:
    title: Arjun fragt nach dem Spielen
    gloss: 'Arjun: Spielst du auch Computerspiele?'
    note: 'Eine kurze Ja/Nein-Frage: *क्या* leitet sie ein, und *खेलती हो* ist feminin, weil Arjun Priya anspricht.'
  hi.a1.unit30.lesson04.teach.priya_naheen_main:
    title: Priya antwortet
    gloss: 'Priya: Nein, ich spiele nie Computerspiele. Aber ich zeichne manchmal!'
    note: '*कभी ... नहीं* („nie“) und *कभी-कभी* („manchmal“) stehen in einer Antwort im Kontrast.'
  hi.a1.unit30.lesson05.teach.arjun_aur_main:
    title: Hobbys im Vergleich
    gloss: Arjun und ich gehen oft zusammen spazieren. Aber wir haben noch andere Hobbys. Arjun kocht gern, auch zu Hause, und er macht oft Sport. Ich lese gern und höre oft Musik. Ich zeichne manchmal, spiele aber nie Computerspiele. Was machst du in deiner Freizeit gern?
    note: Priyas Nachricht fasst Inhalte der vorigen Lektionen zusammen und endet mit der Kernfrage dieser Einheit an die Leserin bzw. den Leser.
    glosses:
      टहलते: spazieren gehen
      अक्सर: oft
      साथ: zusammen
      और: andere
      बनाना: machen (kochen)
      पसंद: mag
      घर: zu Hause
      कसरत: macht Sport
      पढ़ना: lesen
      सुनती: hören
      संगीत: Musik
      चित्र: Bild (Zeichnen)
      कभी-कभी: manchmal
      गेम: Videospiele spielen
      कभी: nie (mit नहीं)
      खाली: frei
      समय: Zeit
  hi.a1.unit30.lesson06.teach.arjun_tum_is:
    title: Arjun fragt nach dem Wochenende
    gloss: 'Arjun: Was machst du dieses Wochenende?'
    note: Bei *इस वीकेंड* („dieses Wochenende“) steht *इस* vor dem Nomen, und *कर रही हो* ist die Verlaufsform „machst du gerade/vor“, feminin, weil Priya angesprochen wird.
  hi.a1.unit30.lesson06.teach.priya_abhee_pata:
    title: Priya ist unentschlossen
    gloss: 'Priya: Noch keine Ahnung. Ich lese gern, aber ich möchte auch nach draußen gehen.'
    note: '*बाहर जाना चाहती हूँ* bedeutet „Ich möchte nach draußen gehen“; *चाहती* ist feminin und steht nach *जाना*.'
  hi.a1.unit30.lesson06.teach.arjun_chalo_sath:
    title: Arjun macht einen Vorschlag
    gloss: 'Arjun: Sollen wir zusammen spazieren gehen? Danach koche ich für uns.'
    note: '*उसके बाद* („danach“) bringt die beiden Pläne in eine Reihenfolge, und *चलो ... टहलें* schlägt den ersten vor.'
  hi.a1.unit30.lesson06.teach.priya_achchha_aidiya:
    title: Priya stimmt zu
    gloss: 'Priya: Gute Idee! Ich mag Spazierengehen und Kochen, beides.'
    note: '*दोनों पसंद हैं* zeigt, dass Priya beides gleich gern mag, und das Verb steht im Plural *हैं*.'
  hi.a1.unit30.lesson06.teach.arjun_barhiya_to:
    title: Arjun bestätigt
    gloss: 'Arjun: Prima. Dann sehen wir uns am Samstag!'
    note: '*शनिवार को मिलते हैं* („wir treffen uns am Samstag“) benutzt das Präsens für einen festen Plan, und *को* markiert den Tag.'
