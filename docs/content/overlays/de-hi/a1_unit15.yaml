answer_policy:
  mujhe_verb_hai: This unit's central grammar point is the दात-subject obligation construction "X + verb-infinitive + है" (मुझे/तुम्हें/हमें/आपको + infinitive + है = "X needs/has to ___"). A typed answer that drops है entirely, or that appends हैं instead of है (है is invariant here -- it agrees with the infinitive verb, not the दात subject), should be marked incorrect -- this is the exact point being tested.
  kitne_ka_gender: '"टिकट कितने का है?" (how much is the ticket) is taught with का, treating टिकट as masculine -- the same कितने का/की gender-agreement rule unit07 already established. Many native speakers also use टिकट as feminine (टिकट कितने की है?), so की with टिकट is ACCEPTED as a valid alternative wherever typed; plural के with one ticket is the error the grammar_check targets.'
  train_gender: ट्रेन is grammatically feminine, so every habitual-present verb form describing it in this unit uses जाती है, never जाता है. A typed answer using जाता है for the train should be marked incorrect as a real agreement error.
  nasalization_marks: Display and teach the correct chandrabindu/anusvara distinction. This unit's one new nasalized word, हमें, uses anusvara, verified against a direct codepoint check -- consistent with the already-established तुम्हें convention. In typed A1 answers, accept a variant that drops a nasalization mark entirely or substitutes anusvara for chandrabindu (or vice versa) when every other character is correct. Do not extend this tolerance to a wrong vowel or consonant, which changes the actual word.
  punctuation: Hindi text is shown with the traditional danda (।) as the sentence-final mark. In typed answers, accept the danda, a plain period (.), or the mark omitted entirely as equivalent. Question marks (?) may likewise be omitted, but the fully punctuated form remains the model answer.
  spoken_answers: Judge spoken responses by intelligibility rather than written punctuation or nasalization marks. For any exercise asking the learner to state their own travel request, accept any of this unit's taught phrasings that fit the prompt, not only the single model sentence given in `accepted_answers`.
course:
  title: Hindi A1
units:
  hi.a1.unit15.travel:
    title: Reisen
lessons:
  hi.a1.unit15.lesson01.station_jana:
    title: Ich muss zum Bahnhof
  hi.a1.unit15.lesson02.platform_samay:
    title: Gleisnummer und Uhrzeit
  hi.a1.unit15.lesson03.priya_arjun_station:
    title: 'Priya und Arjun: am Bahnhof'
teaching:
  hi.a1.unit15.lesson01.teach.station_mujhe_hai_review:
    title: 'Wiederholung: Bahnhof, mir, ist'
    gloss: bahnhof, mir / für mich, ist
    note: Eine kurze Wiederholung des Ortsnomens und der Kopula, die Sie für die Konstruktion der Verpflichtung in dieser Lektion brauchen.
    example_gloss:
    - Der Bahnhof ist hier.
    - Ich habe zu tun.
  hi.a1.unit15.lesson01.teach.jaana:
    title: Gehen
    gloss: gehen (Infinitiv)
    note: Die Infinitivform des Verbs, das Sie bereits als *jao*, den Imperativ zu तुम, kennen (Lektion 9). Diese Lektion führt nun den Infinitiv selbst ein.
    example_gloss: Ich muss gehen.
  hi.a1.unit15.lesson01.teach.grammar_mujhe_verb_hai:
    title: Mujhe + Verb + hai = müssen
    gloss: 'Mujhe kennen Sie schon von chahiye (Lektion 6, mit Nomen) und von hai (Lektion 11, z. B. mujhe kaam hai, „Ich habe zu tun“). Jetzt steht es auch mit einem Verb: mujhe jana hai bedeutet „Ich muss gehen“. Beachten Sie: Bei jana bleibt hai unverändert und wird nie zu hain; es richtet sich nicht nach der sprechenden Person.'
    note: Hier kommt eine dritte Verwendung eines bekannten Musters aus Pronomen und Kopula hinzu; die beiden früheren Verwendungen sind mit Lektionsnummer genannt, bevor das neue Verb folgt.
  hi.a1.unit15.lesson01.teach.mujhe_station_jana_hai_phrase:
    title: Ich muss zum Bahnhof.
    gloss: Ich muss zum Bahnhof.
    note: Das erste vollständige Beispiel für die Konstruktion der Verpflichtung in dieser Lektion.
  hi.a1.unit15.lesson01.teach.tiket:
    title: Fahrkarte
    gloss: Fahrkarte
    note: Ein neues Nomen, das Sie in dieser Reiselektion immer wieder brauchen.
    example_gloss: Wo ist meine Fahrkarte?
  hi.a1.unit15.lesson01.teach.chahiye_review:
    title: 'Wiederholung: möchten / brauchen'
    gloss: möchten / brauchen
    note: In Lektion 6 mit Getränken eingeführt, hier mit einer Fahrkarte wieder verwendet.
    example_gloss: Ich hätte gern einen Tee.
  hi.a1.unit15.lesson01.teach.mujhe_tiket_chahiye_phrase:
    title: Ich brauche eine Fahrkarte.
    gloss: Ich brauche eine Fahrkarte.
    note: Das bereits bekannte Muster *mujhe...chahiye*, angewendet auf das neue Nomen dieser Lektion.
  hi.a1.unit15.lesson01.teach.train:
    title: Zug
    gloss: der Zug
    note: Ein neues Nomen.
    example_gloss: Der Zug ist groß.
  hi.a1.unit15.lesson01.teach.delhi_ka_review:
    title: 'Wiederholung: Delhi, von / Genitivpartikel'
    gloss: Delhi, von / Genitivpartikel (Possessivmarker)
    note: Delhi wurde in Lektion 5 eingeführt; die Possessivpartikel *ka* kennen Sie aus dem ganzen Kurs (z. B. Lektion 5–14). Hier nennt sie das Ziel einer Fahrkarte.
    example_gloss:
    - Mein Bruder wohnt in Delhi.
    - Das ist Arjuns Tasche.
  hi.a1.unit15.lesson01.teach.mujhe_delhi_ka_tiket_chahiye_phrase:
    title: Ich brauche eine Fahrkarte nach Delhi.
    gloss: Ich brauche eine Fahrkarte nach Delhi.
    note: Verbindet das Nomen dieser Lektion mit dem Muster der Possessivpartikel, um ein bestimmtes Ziel zu nennen.
  hi.a1.unit15.lesson01.teach.kahan_tumhein_review:
    title: 'Wiederholung: wo, dir'
    gloss: wo, dir / für dich
    note: Beides ist schon bekannt (Lektion 8 und Lektion 6) und wird hier verwendet, um zu fragen, wohin jemand muss.
    example_gloss:
    - Wo ist die Bank?
    - Was möchtest du?
  hi.a1.unit15.lesson02.teach.number_review:
    title: 'Wiederholung: Nummer'
    gloss: Nummer
    note: In Lektion 2 für Telefonnummern eingeführt, hier für eine Gleisnummer wieder verwendet.
    example_gloss: Wie ist deine Telefonnummer?
  hi.a1.unit15.lesson02.teach.platform:
    title: Bahnsteig
    gloss: Bahnsteig
    note: 'Ein neues Nomen: das übliche Hindi-Wort für „Bahnsteig“ bzw. „Gleis“. Es ist ein gängiges Lehnwort, nach demselben Muster wie *phone* in Lektion 2.'
    example_gloss: Der Bahnsteig ist groß.
  hi.a1.unit15.lesson02.teach.platform_number_kya_hai_phrase:
    title: Welche Gleisnummer ist es?
    gloss: Welche Gleisnummer ist es?
    note: Verwendet das bekannte Fragemuster *kya hai* (z. B. Telefonnummer, Preis, Alter) für ein neues Thema.
  hi.a1.unit15.lesson02.teach.platform_number_teen_hai_phrase:
    title: Die Gleisnummer ist 3.
    gloss: Die Gleisnummer ist 3.
    note: Die natürliche Antwort in einem ganzen Satz auf die obige Frage.
  hi.a1.unit15.lesson02.teach.jaana_habitual_grammar:
    title: Jaati hai (feminine Kongruenz)
    gloss: Jaati hai folgt der Regel aus Lektion 10 für -ta/-ti/-te + hai/hain, hier mit dem neuen Verb jana. „Zug“ ist im Hindi feminin, deshalb heißt es jaati hai und nicht jaata hai.
    note: Eine direkte, ausdrückliche Erweiterung des bekannten Musters der Kongruenz im Präsens der Gewohnheit, angewandt auf ein neues Verb und ein neues, grammatisch feminines Nomen.
  hi.a1.unit15.lesson02.teach.se_review:
    title: 'Wiederholung: von / ab'
    gloss: von / ab
    note: In Lektion 9 für Wegbeschreibungen eingeführt, hier für das Gleis verwendet, von dem der Zug abfährt.
    example_gloss: Gehen Sie von hier aus geradeaus.
  hi.a1.unit15.lesson02.teach.train_platform_se_jaati_hai_phrase:
    title: Der Zug fährt von Gleis 3 ab.
    gloss: Der Zug fährt von Gleis 3 ab.
    note: Verbindet die Verbform des Präsens der Gewohnheit aus dieser Lektion mit der bekannten Postposition für „von“.
  hi.a1.unit15.lesson02.teach.kitne_baje_review:
    title: 'Wiederholung: um wie viel Uhr'
    gloss: um wie viel Uhr
    note: In Lektion 4 für die Uhrzeit eingeführt, hier für die Frage nach einer Abfahrtszeit verwendet.
    example_gloss: Wie spät ist es?
  hi.a1.unit15.lesson02.teach.train_kitne_baje_jaati_hai_phrase:
    title: Um wie viel Uhr fährt der Zug ab?
    gloss: Um wie viel Uhr fährt der Zug ab?
    note: Die Frage „Um wie viel Uhr?“, bezogen auf eine planmäßige Abfahrt statt auf die aktuelle Uhrzeit.
  hi.a1.unit15.lesson02.teach.train_chhah_baje_jaati_hai_phrase:
    title: Der Zug fährt um 6 Uhr ab.
    gloss: Der Zug fährt um 6 Uhr ab.
    note: Die natürliche Antwort in einem ganzen Satz mit der Pluralform *baje* aus Lektion 4 (sechs ist nicht die Ausnahme *baja*, die nur für ein Uhr gilt).
  hi.a1.unit15.lesson02.teach.tiket_kitne_ka_hai_phrase:
    title: Wie viel kostet die Fahrkarte?
    gloss: Wie viel kostet die Fahrkarte?
    note: Verwendet die Preisfrage *kitne ka/ki* aus Lektion 7. *Tikat* gilt meist als maskulin (*ka*); viele Sprecher behandeln es auch als feminin (*kitne ki*), was ebenfalls richtig ist.
  hi.a1.unit15.lesson02.teach.rupaye_review:
    title: 'Wiederholung: Rupien, fünfzig'
    gloss: Rupien, fünfzig
    note: Beides wurde in Lektion 2 für Preise und Mengen eingeführt und wird hier für einen Fahrkartenpreis verwendet.
    example_gloss: Ich habe fünfzig Rupien.
  hi.a1.unit15.lesson02.teach.tiket_pachaas_rupaye_ka_hai_phrase:
    title: Die Fahrkarte kostet 50 Rupien.
    gloss: Die Fahrkarte kostet 50 Rupien.
    note: Die natürliche Antwort in einem ganzen Satz auf die obige Preisfrage.
  hi.a1.unit15.lesson03.teach.hum_hamein:
    title: Wir, uns
    gloss: wir, uns / für uns
    note: Hum („wir“) wurde in Lektion 11 als erstes Pronomen der ersten Person Plural eingeführt; hamein ist seine Dativform und wird hier für den Dialog über gemeinsames Reisen gebraucht.
    example_gloss:
    - Uns geht es gut.
    - Wir müssen zum Bahnhof.
  hi.a1.unit15.lesson03.teach.hamein_grammar:
    title: 'Hamein: das vierte Dativpronomen'
    gloss: Hamein ist die Dativform von hum (Lektion 11), genau wie mujhe (zu main) und tumhein (zu tum). Auch hier bleibt hai bei jana unverändert und wird nie zu hain; es richtet sich nicht nach hum/hamein.
    note: Nennt die drei bisherigen Dativpronomen mit Lektionsnummer, bevor das vierte folgt, und wiederholt den Hinweis aus der ersten Grammatiknotiz dieser Lektion, dass hai unverändert bleibt.
  hi.a1.unit15.lesson03.teach.hamein_station_jana_hai_phrase:
    title: Wir müssen zum Bahnhof.
    gloss: Wir müssen zum Bahnhof.
    note: Die Konstruktion der Verpflichtung mit dem neuen Dativpronomen im Plural.
  hi.a1.unit15.lesson03.teach.ki_review:
    title: 'Wiederholung: von / Genitivpartikel (feminin)'
    gloss: von / Genitivpartikel (Possessivmarker, feminin)
    note: In Lektion 7 zusammen mit *ka*/*kitne* eingeführt. Hier wird es wieder verwendet, weil „Zug“ im Hindi feminin ist; die Possessivform lautet deshalb ki, nicht ka.
    example_gloss: Das ist der Zug nach Delhi.
  hi.a1.unit15.lesson03.teach.dialogue.line01:
    title: Arjun sagt, dass sie gehen müssen
    gloss: Priya, wir müssen zum Bahnhof.
  hi.a1.unit15.lesson03.teach.dialogue.line02:
    title: Priya braucht eine Fahrkarte nach Delhi
    gloss: Okay. Ich brauche eine Fahrkarte nach Delhi.
  hi.a1.unit15.lesson03.teach.dialogue.line03:
    title: Arjun fragt nach dem Preis
    gloss: Ich auch. Wie viel kostet die Fahrkarte?
  hi.a1.unit15.lesson03.teach.dialogue.line04:
    title: Priya nennt den Preis
    gloss: Die Fahrkarte kostet 50 Rupien.
  hi.a1.unit15.lesson03.teach.dialogue.line05:
    title: Arjun fragt nach der Abfahrtszeit
    gloss: Gut. Um wie viel Uhr fährt der Zug?
  hi.a1.unit15.lesson03.teach.dialogue.line06:
    title: Priya nennt Uhrzeit und Gleis
    gloss: Der Zug fährt um 6 Uhr von Gleis 3 ab.
  hi.a1.unit15.lesson03.teach.dialogue.line07:
    title: Arjun hat verstanden und sagt, dass sie los sollen
    gloss: Verstanden. Los geht's!
  hi.a1.unit15.lesson03.teach.dialogue.line08:
    title: Priya stimmt zu
    gloss: Los geht's!
  hi.a1.unit15.lesson03.teach.grammar_summary:
    title: Drei Hauptregeln
    gloss: 'Die drei Hauptregeln dieser Lektion: (1) ''mujhe/tumhein/hamein + Verb + hai'' bedeutet ''etwas tun müssen''; (2) ''X kitne ka/ki hai?'' fragt nach dem Preis; (3) ''X [Uhrzeit] baje [Ort] se jaati hai'' gibt Zeit und Ort einer Fahrt an.'
    note: Zum Abschluss fasst diese Übersicht die gesamte Grammatik der Lektion zusammen.
  hi.a1.unit15.lesson03.teach.tiket_reading:
    title: Eine Fahrkarte lesen
    gloss: 'Fahrkarte: Delhi. Bahnsteig Nummer 3. 6 Uhr.'
    note: Ein kurzer Fahrkartentext in Stichpunkten ohne ganze Sätze, wie auf einer echten Fahrkarte. Er wiederholt nur die Angaben aus dem Dialog.
    glosses:
      टिकट: die Fahrkarte
      प्लेटफ़ॉर्म: das Gleis
      नंबर: Nummer
      बजे: Uhr
