teaching:
  hi.a1.unit27.lesson01.teach.khush_udas_naraz:
    title: Froh, traurig und wütend
    gloss: froh, traurig, wütend
    note: '*खुश*, *उदास* und *नाराज़* sind grundlegende Gefühlswörter, die mit *हूँ* oder *है* („bin“, „ist“) stehen; sie verändern sich nicht nach Geschlecht.'
    example_gloss:
    - Ich bin froh.
    - Ich bin traurig.
    - Ich bin wütend.
  hi.a1.unit27.lesson01.teach.main_khush_hoon:
    title: Sagen, dass man froh ist
    gloss: Ich bin glücklich.
    note: '*मैं खुश हूँ* folgt dem Muster *मैं* + Gefühl + *हूँ*, genau wie „Ich bin ...“.'
  hi.a1.unit27.lesson01.teach.main_naraz_naheen:
    title: Gefühle gegenüberstellen
    gloss: Ich bin nicht wütend, ich bin traurig.
    note: '*नहीं* steht direkt vor *हूँ*: *नाराज़ नहीं हूँ*. Der zweite Teil nennt dann das wirkliche Gefühl.'
  hi.a1.unit27.lesson02.teach.tum_khush_kyon:
    title: Nach dem Grund fragen
    gloss: Warum bist du froh?
    note: '*क्यों* („warum“) steht vor dem Hauptwort: *तुम खुश क्यों हो?*. *तुम* ist das vertraute „du“.'
  hi.a1.unit27.lesson02.teach.main_khush_hoon:
    title: Einen Grund nennen
    gloss: Ich bin froh, weil ich eine neue Wohnung habe.
    note: '*क्योंकि* leitet den Grund ein. *मेरे पास ... है* bedeutet „ich habe“, und das Verb *है* steht am Ende.'
  hi.a1.unit27.lesson02.teach.main_udas_hoon:
    title: Ein negativer Grund
    gloss: Ich bin traurig, weil es regnet.
    note: '*बारिश हो रही है* bedeutet „es regnet“ (wörtlich „Regen geschieht“).'
  hi.a1.unit27.lesson03.teach.narvas:
    title: Nervös
    gloss: nervös
    note: Das gebräuchliche Wort für Nervosität.
    example_gloss: Ich bin nervös vor meiner ersten Schicht.
  hi.a1.unit27.lesson03.teach.main_apnee_pahlee:
    title: Sagen, wovor man nervös ist
    gloss: Ich bin nervös vor meiner ersten Schicht.
    note: '*को लेकर* bedeutet „wegen“ bzw. „in Bezug auf“ und steht nach dem Nomen: *शिफ़्ट को लेकर*. *अपनी* („meine eigene“) richtet sich nach dem Femininum *शिफ़्ट*.'
  hi.a1.unit27.lesson03.teach.chinta_mat_karo:
    title: Jemanden beruhigen
    gloss: Mach dir keine Sorgen.
    note: '*चिंता मत करो* ist das freundliche „Mach dir keine Sorgen“: *मत* + *करो* ist der Imperativ für *तुम* mit Verbot.'
  hi.a1.unit27.lesson04.teach.arjun_kaisa_mahsoos:
    title: Fragen, wie sich jemand fühlt
    gloss: Wie fühlt sich Arjun?
    note: '*कैसा महसूस कर रहा है* fragt „wie fühlt er sich?“. *कैसा* richtet sich nach der Person, bei einer Frau heißt es *कैसी*.'
  hi.a1.unit27.lesson04.teach.vah_narvas_mahsoos:
    title: Beschreiben, wie sich jemand fühlt
    gloss: Er fühlt sich nervös.
    note: 'Hindi hat hier kein eigenes Wort für „sich“: *वह नर्वस महसूस कर रहा है* kommt einfach mit *वह* und *रहा है* aus.'
  hi.a1.unit27.lesson04.teach.vah_narvas_kyon:
    title: Fragen, warum sich jemand so fühlt
    gloss: Warum fühlt er sich nervös?
    note: '*क्यों* steht direkt vor der Verbgruppe: *वह नर्वस क्यों महसूस कर रहा है?*'
  hi.a1.unit27.lesson05.teach.hay_priya_main:
    title: Eine Nachricht über Gefühle lesen
    gloss: Hallo Priya, ich bin wegen meiner ersten Schicht allein ein bisschen nervös. Aber ich freue mich auch, weil ich einen neuen Job und eine neue Wohnung habe. Ich glaube, es wird alles gut.
    note: Achten Sie darauf, wovor der Schreiber nervös ist, was ihn froh macht und wie er insgesamt die Lage sieht.
    glosses:
      थोड़ा: ein bisschen
      नर्वस: nervös
      पहली: erste
      शिफ़्ट: Schicht
      अकेले: allein
      खुश: glücklich
      क्योंकि: denn, weil
      नई: neu
      नौकरी: Arbeit
      नया: neu
      फ़्लैट: Wohnung
      लगता: denken, glauben
      होगा: 'klappt (hier: wird gut gehen)'
  hi.a1.unit27.lesson06.teach.priya_hay_arjun:
    title: Priya fragt, wie es Arjun geht
    gloss: 'Priya: Hallo Arjun, wie fühlst du dich wegen deiner ersten Schicht?'
    note: '*को लेकर* wird wieder verwendet: *अपनी पहली शिफ़्ट को लेकर* („wegen deiner ersten Schicht“). *तुम* ist vertraut.'
  hi.a1.unit27.lesson06.teach.arjun_sach_kahoon:
    title: Arjun gibt zu, dass er nervös ist
    gloss: 'Arjun: Ehrlich gesagt bin ich ein bisschen nervös.'
    note: '*सच कहूँ तो* („wenn ich die Wahrheit sage“) mildert ein Geständnis ab.'
  hi.a1.unit27.lesson06.teach.priya_chinta_mat:
    title: Priya beruhigt ihn
    gloss: 'Priya: Keine Sorge, du schaffst das gut!'
    note: '*तुम यह अच्छे से कर सकते हो* bedeutet „du kannst das gut machen“, und *अच्छे से* heißt „gut“.'
  hi.a1.unit27.lesson06.teach.arjun_shukriya_isse:
    title: Arjun bedankt sich bei ihr
    gloss: 'Arjun: Danke, das hilft wirklich.'
    note: '*इससे मदद मिलती है* heißt wörtlich „hieraus wird Hilfe erhalten“: Das, was hilft, wird mit *से* markiert.'
  hi.a1.unit27.lesson06.teach.priya_aur_bad:
    title: Priya sagt den Ausgang voraus
    gloss: 'Priya: Und hinterher wirst du bestimmt sehr glücklich und stolz sein.'
    note: '*ज़रूर* („bestimmt“) macht die Vorhersage zuversichtlich, und *तुम्हें गर्व होगा* heißt „du wirst Stolz empfinden“.'
  hi.a1.unit27.lesson06.teach.arjun_han_mujhe:
    title: Arjun stimmt zu
    gloss: 'Arjun: Ja, das denke ich auch.'
    note: '*मुझे भी ऐसा ही लगता है* („mir scheint es auch so“) ist die natürliche Art zuzustimmen, und *मुझे* zeigt, wer es empfindet.'
  hi.a1.unit27.lesson06.teach.arjun_narvas_hai:
    title: 'Pronomen: उसकी'
    gloss: Arjun ist nervös. Priya hilft ihm.
    note: '*उसकी* bedeutet „sein“ oder „ihr“ und richtet sich nach dem Femininum *मदद*; *उसकी मदद करना* heißt also „ihm helfen“. *है* und *करती है* sind die Verbformen der dritten Person.'
