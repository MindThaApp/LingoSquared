    - और
    accepted_answers:
    - तुम
    feedback: Tum verwendet man bei Freunden, Gleichaltrigen und anderen informellen, aber respektvollen Beziehungen.
  hi.a1.unit01.lesson01.exercise03.select_aap_kaisi_hain_meaning:
