answer_policy:
  nasalization_marks: Display and teach the correct chandrabindu/anusvara distinction (हूँ, हाँ, कहाँ vs. मैं, हैं, में, मिलेंगे). In typed A1 answers, accept a variant that drops the nasalization mark entirely or substitutes anusvara for chandrabindu (हूं for हूँ, हां for हाँ) when every other character is correct -- these marks are small, easy to miss on a virtual keyboard, and near-homophonous in casual speech; this is a beginner course, not a spelling test. Do not extend this tolerance to a wrong vowel or consonant, which changes the actual word.
  punctuation: Hindi text is shown with the traditional danda (।) as the sentence-final mark, matching how it is actually printed and taught. In typed answers, accept the danda, a plain period (.), or the mark omitted entirely as equivalent -- most everyday Hindi typed on phones/keyboards uses a plain period, and this distinction carries no meaning difference. Question marks (?) and exclamation marks may likewise be omitted, but the fully punctuated form remains the model answer.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register (aap vs. tum) rather than written punctuation or nasalization marks.
course:
  title: Hindi A1
  description: Lernen Sie, auf Hindi Menschen zu begrüßen, zu fragen, wie es jemandem geht, sich vorzustellen und grundlegende persönliche Angaben auszutauschen. Besonders wichtig sind das Höflichkeitssystem aap/tum (ein echter grammatischer Unterschied, ähnlich wie bei Sie/du im Deutschen) sowie die Adjektive und Verbformen des Hindi, die sich nach dem Geschlecht richten.
units:
  hi.a1.unit01.greetings:
    title: Namaste und erste Begegnungen
lessons:
  hi.a1.unit01.lesson01.aap_and_tum:
    title: 'Aap und tum: Fragen, wie es jemandem geht'
  hi.a1.unit01.lesson02.greetings_and_farewells:
    title: Begrüßung und Abschied
  hi.a1.unit01.lesson03.names_origin_and_dialogue:
    title: Namen, Herkunft und eine erste Begegnung im Yogakurs
teaching:
  hi.a1.unit01.lesson01.teach.aap:
    title: „Sie“ (höflich, respektvoll)
    gloss: Sie (höflich, respektvoll)
    note: 'Wie im Deutschen gibt es im Hindi eine soziale Wahl: *aap* verwendet man für ältere oder unbekannte Personen und in respektvollen beruflichen Beziehungen. Grammatisch wird es wie ein Plural behandelt, auch wenn nur eine Person gemeint ist – Verben mit *aap* haben dieselben Endungen wie bei „sie“ (Plural), etwa hain.'
  hi.a1.unit01.lesson01.teach.tum:
    title: Vertrauliche Anrede
    gloss: du/ihr (vertraut, informell)
    note: '*Tum* verwendet man bei Freunden, Gleichaltrigen, Jüngeren oder Familienmitgliedern – eine vertraute, aber weiterhin respektvolle Beziehung (nicht zu verwechseln mit dem noch vertraulicheren *tu*, das dieser Kurs nicht behandelt). *Tum* hat eigene Verbendungen, die sich sowohl von *aap* als auch von *tu* unterscheiden.'
  hi.a1.unit01.lesson01.teach.aap_kaise_hain:
    title: Förmliche Frage nach dem Befinden, an einen Mann
    gloss: Wie geht es Ihnen? (höflich, an einen Mann gerichtet)
    note: '*Kaise* richtet sich nach dem GESCHLECHT DER GEFRAGTEN PERSON, nicht nach dem der sprechenden Person – diese Form verwendet man, wenn man einen Mann anspricht. Im Deutschen bleibt „Wie geht es Ihnen?“ dagegen immer gleich.'
  hi.a1.unit01.lesson01.teach.aap_kaisi_hain:
    title: Förmliche Frage nach dem Befinden, an eine Frau
    gloss: Wie geht es Ihnen? (höflich, an eine Frau gerichtet)
    note: Dieselbe Frage im selben *aap*-Register – nur *kaisi* ersetzt *kaise* und richtet sich nach einer weiblichen Angesprochenen. Das Verb *hain* selbst ändert sich nie; nur die Adjektivform wechselt.
  hi.a1.unit01.lesson01.teach.tum_kaise_ho:
    title: Vertraut nach dem Befinden fragen
    gloss: Wie geht’s? (informell)
    note: Bei *tum* lautet das Verb *ho*, nicht *hain* – vergleichen Sie das höfliche *Aap kaise/kaisi hain?* mit dem informellen *Tum kaise ho?*. Das ist das deutlichste Minimalpaar, um den Unterschied zwischen aap und tum direkt am Verb zu hören.
  hi.a1.unit01.lesson01.teach.main_theek_hoon:
    title: Eine Standardantwort
    gloss: Mir geht es gut, danke.
    note: '*Theek* („gut/in Ordnung“) verändert sich weder nach Geschlecht noch nach Register – anders als *kaise/kaisi* bleibt es gleich, egal wer spricht oder wer angesprochen wird.'
  hi.a1.unit01.lesson01.teach.aur_aap:
    title: Die förmliche Gegenfrage stellen
    gloss: Und Ihnen? (formell)
    note: Eine kurze Möglichkeit, die Frage im höflichen aap-Register zurückzugeben.
  hi.a1.unit01.lesson01.teach.aur_tum:
    title: Die vertrauliche Gegenfrage stellen
    gloss: Und dir? (informell)
    note: Mit tum geben Sie die Frage an einen Freund oder Gleichaltrigen zurück.
  hi.a1.unit01.lesson02.teach.namaste:
    title: Universelle Begrüßung
    gloss: Hallo; Tschüss (auch zum Abschied)
    note: '*Namaste* passt zu jeder Tageszeit, in formellen wie informellen Situationen und sowohl zur Begrüßung als auch zum Abschied – wirklich vielseitig. Das Deutsche trennt dagegen meist zwischen Begrüßung und Verabschiedung.'
    example_gloss: Hallo! Wie geht es Ihnen?
  hi.a1.unit01.lesson02.teach.namaskar:
    title: Respektvolle Begrüßung
    gloss: Guten Tag (förmlicher und respektvoller als namaste)
    note: '*Namaskar* bedeutet im Wesentlichen dasselbe wie *namaste*, klingt aber förmlicher und respektvoller – passend für Ältere, ein großes Publikum oder berufliche Situationen.'
    example_gloss: Guten Tag! Und Ihnen?
  hi.a1.unit01.lesson02.teach.phir_milenge:
    title: Bis bald (Zukunft)
    gloss: Bis bald; bis später
    note: Wörtlich „[Wir] werden uns wiedersehen“ – eine gängige, neutrale Art, sich zu verabschieden, wenn man die Person wiederzusehen erwartet.
  hi.a1.unit01.lesson02.teach.alvida:
    title: Förmlicher Abschied
    gloss: Auf Wiedersehen; Lebewohl
    note: '*Alvida* ist ein echtes, korrekt verwendetes Hindi-Wort für „Auf Wiedersehen“, wirkt im Alltag aber endgültiger, förmlicher und etwas dramatischer als *namaste* oder *phir milenge* – eher wie „Lebewohl“ als ein lockeres „Tschüss“.'
    example_gloss: Auf Wiedersehen! Bis bald.
  hi.a1.unit01.lesson02.teach.phir_milte_hain:
    title: Man sieht sich (locker/gewohnheitsmäßig)
    gloss: Man sieht sich; bis dann
    note: Wörtlich „[Wir] treffen uns wieder“, mit der Verbform der Gegenwart/Gewohnheit statt der Zukunft – eine etwas lockerere Alltagsvariante von *phir milenge*.
  hi.a1.unit01.lesson02.teach.shubh_ratri:
    title: Gute Nacht
    gloss: gute Nacht
    note: Man sagt es, wenn jemand für die Nacht geht oder schlafen geht – wie „Gute Nacht“ im Deutschen ist es ein Abschied, nie eine Begrüßung, anders als *namaste*.
  hi.a1.unit01.lesson02.teach.shubh_din:
    title: Höflicher Abschiedswunsch
    gloss: Einen schönen Tag noch.
    note: Wörtlich „Möge Ihr Tag gut bleiben“ – ein höflicher Abschiedswunsch, passend bei respektvollem Abschied, ob die Beziehung formell oder informell ist.
  hi.a1.unit01.lesson03.teach.aapka_naam_kya_hai:
    title: Förmlich nach dem Namen fragen
    gloss: Wie heißen Sie? (höflich)
    note: '*Aapka* („Ihr“) richtet sich nach dem maskulinen Nomen *naam* („Name“) – Possessiva im Hindi passen sich dem Besitz an, nicht dem Besitzer. Im Deutschen richtet sich dagegen die Form von „dein/Ihr“ ebenfalls nach dem Besitz (mein Name, meine Mutter), aber nicht nach der Person, die besitzt.'
  hi.a1.unit01.lesson03.teach.tumhara_naam_kya_hai:
    title: Den Namen erfragen, informell
    gloss: Wie heißt du? (informell)
    note: Dasselbe Muster mit *tumhara* („dein“, informell) statt *aapka*. Vergleichen Sie das höfliche *Aapka naam kya hai?* mit dem informellen *Tumhara naam kya hai?*.
  hi.a1.unit01.lesson03.teach.mera_naam_priya_hai:
    title: Den eigenen Namen nennen
    gloss: Ich heiße Priya.
    note: Auch *mera* („mein“) richtet sich nach dem maskulinen *naam* – beachten Sie die gleiche maskuline Endung wie bei *aapka*/*tumhara* oben, da alle drei dasselbe Nomen näher bestimmen.
  hi.a1.unit01.lesson03.teach.aapse_milkar_khushi_hui:
    title: Freude über das Kennenlernen, förmlich
    gloss: Freut mich, Sie kennenzulernen. (höflich)
    note: Wörtlich „Nachdem ich Sie getroffen habe, ist Freude entstanden“ – ein fester, weit verbreiteter Ausdruck für ein respektvolles erstes Treffen.
  hi.a1.unit01.lesson03.teach.mujhe_bhi:
    title: Die Freude erwidern
    gloss: Ich auch.
    note: Eine kurze, natürliche Antwort auf Aapse milkar khushi hui oder Tumse milkar accha laga.
  hi.a1.unit01.lesson03.teach.aap_kahan_se_hain:
    title: Nach der Herkunft fragen, höflich
    gloss: Woher kommen Sie? (formell)
    note: Kahan bedeutet „wo“; se bedeutet „von/aus“.
  hi.a1.unit01.lesson03.teach.main_bharat_se_hoon:
    title: Die eigene Herkunft nennen
    gloss: Ich komme aus Indien.
    note: Bharat ist der Hindi-Name für Indien und wird im Alltag ständig verwendet.
  hi.a1.unit01.lesson03.teach.tum_kahan_se_ho:
    title: Vertraut nach der Herkunft fragen
    gloss: Woher kommst du? (informell)
    note: Dieselbe Frage mit *tum* und *ho* statt *aap* und *hain* – das gleiche Muster formeller/informeller Verbendungen wie in dieser ganzen Einheit.
  hi.a1.unit01.lesson03.teach.dialogue.line01:
    title: Die Begegnung beginnen
    gloss: Priya begrüßt Arjun und fragt, ob er zum ersten Mal hier ist.
    note: Beide Sprechenden verwenden von Anfang an das informelle *tum* – natürlich für zwei Gleichaltrige, die sich zwanglos in einem Kurs treffen. *Tumhari* („dein“) richtet sich nach dem femininen Nomen *baar* („Mal“, im Sinne von „Gelegenheit“), nicht nach dem Geschlecht einer der sprechenden Personen.
  hi.a1.unit01.lesson03.teach.dialogue.line02:
    title: 'Die Begegnung beginnen: Antwort'
    gloss: Arjun sagt Ja, es ist sein erstes Mal, und dass er Yoga lernen möchte.
    note: '*Chahta hoon* („ich möchte“) steht hier in der maskulinen Form, weil Arjun als Sprecher ein Mann ist – dieses Verb richtet sich nach dem Geschlecht der SPRECHENDEN Person, anders als *kaisi*/*kaise* weiter oben, die sich nach der ANGESPROCHENEN Person richteten.'
  hi.a1.unit01.lesson03.teach.dialogue.line03:
    title: Namen austauschen
    gloss: Priya sagt „Ich auch!“, nennt ihren Namen und fragt nach Arjuns Namen.
    note: '*Main bhi!* („Ich auch!“) antwortet auf Arjuns *main ... chahta hoon*: Wenn im Satz der anderen Person *main* das Subjekt ist, sagt man „ich auch“ als *main bhi*. *Mujhe bhi* ist die Antwort auf einen Satz mit *mujhe*, wie *Tumse milkar accha laga*. *Mera naam...hai* ist die natürliche, einfache Art, seinen Namen zu nennen.'
  hi.a1.unit01.lesson03.teach.dialogue.line04:
    title: 'Namen austauschen: Antwort'
    gloss: Arjun nennt seinen Namen und sagt ihr informell, dass es ihn freut, sie kennenzulernen.
    note: '*Tumse milkar accha laga* ist das informelle Gegenstück zum förmlichen *Aapse milkar khushi hui* aus dieser Lektion – beide bedeuten ungefähr „Freut mich, dich/Sie kennenzulernen“, passend zum Register.'
  hi.a1.unit01.lesson03.teach.dialogue.line05:
    title: Nach der Herkunft fragen
    gloss: Priya erwidert die Freude und fragt, woher Arjun kommt.
    note: Tum kahan se ho fragt im bereits gelernten informellen Register nach der Herkunft.
  hi.a1.unit01.lesson03.teach.dialogue.line06:
    title: 'Nach der Herkunft fragen: Antwort'
    gloss: Arjun kommt aus Indien, lebt aber derzeit in London, und stellt dieselbe Frage zurück.
    note: '*Rahta hoon* („ich wohne“) ist maskulin und richtet sich nach Arjun als Sprecher – dasselbe Muster der Übereinstimmung mit dem Subjekt wie bei *chahta hoon* in Zeile 02. *Lekin* („aber“) verbindet den Gegensatz zwischen Herkunft und jetzigem Wohnort.'
  hi.a1.unit01.lesson03.teach.dialogue.line07:
    title: Über Herkunft und ein Interesse sprechen
    gloss: Priya sagt, dass sie aus Amerika kommt und ebenfalls Yoga lernen möchte.
    note: '*Chahti hoon* ist die feminine Form desselben Verbs, das Arjun in Zeile 02 verwendet hat (*chahta hoon*) – beide richten sich nach dem Geschlecht der jeweils sprechenden Person, ein direktes Minimalpaar zum Vergleichen.'
  hi.a1.unit01.lesson03.teach.dialogue.line08:
    title: Nach der gemeinsamen Aktivität fragen
    gloss: Arjun reagiert positiv und fragt, ob Priya Yoga macht.
    note: '*Karti ho* („machst du“) ist feminin und richtet sich nach Priya als der gefragten Person – wie *kaisi* weiter oben folgt diese Verbform dem Geschlecht der ANGESPROCHENEN Person, nicht dem der sprechenden.'
  hi.a1.unit01.lesson03.teach.dialogue.line09:
    title: Nach der gemeinsamen Aktivität fragen, Antwort
    gloss: Priya sagt Nein, es ist ihr erstes Mal, und sie lernt gerade noch.
    note: '*Seekh rahi hoon* („ich lerne gerade“) verwendet die feminine Verlaufsform und richtet sich nach Priya als Sprecherin – das Gegenstück in der Verlaufsform zu *chahti hoon*.'
  hi.a1.unit01.lesson03.teach.dialogue.line10:
    title: Das Gespräch beenden
    gloss: 'Arjun stimmt zu anzufangen und sagt dann: Bis später.'
    note: '*Chalo shuru karte hain* („Fangen wir an“) ist eine feste, natürliche Art, vorzuschlagen, gemeinsam etwas zu beginnen. *Phir milte hain* beendet das Gespräch mit dem lockeren Abschied aus Lektion 2.'
