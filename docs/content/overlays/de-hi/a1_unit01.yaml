  hi.a1.unit01.lesson01.exercise08.correct_informal_agreement:
    instruction: Korrigieren Sie die informelle Frage – sie kombiniert tum mit der falschen Verbendung.
    accepted_answers:
    - तुम कैसे हो?
    - तुम कैसे हो
    feedback: Tum hat die Endung ho, nicht hain – hain steht nur bei aap.
