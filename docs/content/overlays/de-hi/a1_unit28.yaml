teaching:
  hi.a1.unit28.lesson01.teach.fon_karna:
    title: Anrufen
    gloss: anrufen
    note: Der Infinitiv des Verbs für „telefonisch anrufen“.
    example_gloss: Ich muss dich anrufen.
  hi.a1.unit28.lesson01.teach.main_tumhen_fon:
    title: Sagen, dass man anruft
    gloss: Ich rufe dich an.
    note: '*करूँगा* ist das Futur von *करना*; Hindi verwendet es, wo das Deutsche oft „Ich rufe dich an“ im Präsens sagt. Die angerufene Person steht mit *तुम्हें* („dir/dich“).'
  hi.a1.unit28.lesson01.teach.hailo_main_priya:
    title: Ans Telefon gehen
    gloss: Hallo, hier ist Priya.
    note: Am Telefon sagt man *मैं ... बोल रही हूँ* („ich spreche gerade“); *रही* ist feminin, weil Priya eine Frau ist.
  hi.a1.unit28.lesson01.teach.hailo_main_arjun:
    title: Arjun meldet sich genauso
    gloss: Hallo, hier ist Arjun.
    note: 'Dasselbe Muster mit dem maskulinen *रहा*: *मैं अर्जुन बोल रहा हूँ*, weil Arjun ein Mann ist.'
  hi.a1.unit28.lesson02.teach.main_kisse_bat:
    title: Fragen, wer anruft
    gloss: Mit wem spreche ich?
    note: '*किससे* („mit wem“) besteht aus *कौन* („wer“) und *से*; *से* markiert die Person, mit der man spricht.'
  hi.a1.unit28.lesson02.teach.ap_priya_se:
    title: Sich förmlich melden
    gloss: Sie sprechen mit Priya.
    note: '*आप* ist das höfliche „Sie“ gegenüber Fremden. *प्रिया से बात कर रहे हैं* setzt *से* hinter den Namen, und *हैं* gehört zu *आप*.'
  hi.a1.unit28.lesson03.teach.kya_tum_yah:
    title: Um Wiederholung bitten
    gloss: Kannst du das wiederholen?
    note: '*सकते हो* bedeutet „können“ und steht nach dem Hauptverb: *कह सकते हो*. *क्या* am Anfang macht daraus eine Frage.'
  hi.a1.unit28.lesson03.teach.itna_tez_mat:
    title: Jemanden bitten, langsamer zu sprechen
    gloss: Sprich nicht so schnell, bitte.
    note: '*मत बोलो* ist das vertraute „sprich nicht“ mit *तुम*, und *इतना तेज़* bedeutet „so schnell“.'
  hi.a1.unit28.lesson03.teach.mujhe_tumharee_avaz:
    title: Sagen, dass man schlecht hört
    gloss: Ich kann dich nicht gut hören.
    note: 'Hindi sagt „deine Stimme kommt nicht“: *मुझे तुम्हारी आवाज़ नहीं आ रही है*. Die sprechende Person steht mit *मुझे* („mir“), die Stimme ist das Subjekt.'
  hi.a1.unit28.lesson04.teach.maisej:
    title: Textnachricht
    gloss: die Textnachricht
    note: '*मैसेज* ist ein gängiges Lehnwort und maskulin: *एक मैसेज*, *यह मैसेज ... का है*.'
    example_gloss: Die Textnachricht ist von Priya.
  hi.a1.unit28.lesson04.teach.main_tumhen_ek:
    title: Sagen, dass man eine Nachricht schickt
    gloss: Ich schicke dir eine Nachricht.
    note: 'Die Reihenfolge ist Person, dann Sache, dann Verb: *तुम्हें एक मैसेज भेजूँगा*. *भेजना* bedeutet „senden“.'
  hi.a1.unit28.lesson04.teach.main_tumhen_bad:
    title: Sagen, dass man zurückruft
    gloss: Ich rufe dich später zurück.
    note: '*वापस फ़ोन करना* bedeutet „zurückrufen“, mit *वापस* vor *फ़ोन करना*; *बाद में* heißt „später“.'
  hi.a1.unit28.lesson05.teach.arjun_hay_priya:
    title: Einen Nachrichtenaustausch lesen
    gloss: 'Arjun: Hi Priya, kannst du mich anrufen? Ich muss dir etwas Wichtiges sagen. Priya: Ja, klar, ich rufe dich in fünf Minuten zurück.'
    note: Achten Sie darauf, worum Arjun bittet, warum und wann Priya zurückruft.
    glosses:
      हाय: hallo
      सकती: kannst
      फ़ोन: anrufen
      ज़रूरी: wichtig (etwas Wichtiges, das man sagen muss)
      कुछ: etwas
      बतानी: erzählen
      ज़रूर: natürlich
      करूँगी: werde anrufen
      पाँच: fünf
      मिनट: Minuten
      वापस: zurück
  hi.a1.unit28.lesson06.teach.arjun_hailo_main:
    title: Arjun nimmt den Anruf entgegen
    gloss: 'Arjun: Hallo, hier ist Arjun.'
    note: Wer abhebt, nennt zuerst den eigenen Namen mit *मैं ... बोल रहा हूँ*, hier mit dem maskulinen *रहा*.
  hi.a1.unit28.lesson06.teach.priya_hay_arjun:
    title: Priya nennt ihren Namen
    gloss: 'Priya: Hi Arjun, hier ist Priya. Arjun: Gut, dass du anrufst!'
    note: '*अच्छा हुआ तुमने फ़ोन किया* bedeutet „gut, dass du angerufen hast“; *तुमने ... किया* ist die Vergangenheit mit *ने*.'
  hi.a1.unit28.lesson06.teach.priya_tumharee_pahlee:
    title: Priya fragt nach der Schicht
    gloss: 'Priya: Wie war deine erste Schicht?'
    note: '*कैसी रही* fragt „wie war es“; *कैसी* ist feminin, weil *शिफ़्ट* feminin ist.'
  hi.a1.unit28.lesson06.teach.arjun_bahut_achchhee:
    title: Arjun berichtet Gutes
    gloss: 'Arjun: Sie lief richtig gut, besser, als ich gedacht hatte.'
    note: '*अच्छी रही* („lief gut“) richtet sich nach dem femininen *शिफ़्ट*, und *जितना मैंने सोचा था उससे भी बेहतर* bedeutet „sogar besser, als ich gedacht hatte“.'
  hi.a1.unit28.lesson06.teach.vah_narvas_tha:
    title: 'था und थी: war'
    gloss: Er war nervös, sie war glücklich.
    note: '*था* ist „war“ für ein maskulines Subjekt, *थी* für ein feminines; die Endung richtet sich danach, wer oder was beschrieben wird.'
  hi.a1.unit28.lesson06.teach.priya_yah_sunkar:
    title: Priya ist stolz
    gloss: 'Priya: Wie schön, das zu hören! Ich bin stolz auf dich.'
    note: '*तुम पर गर्व है* („Stolz ist auf dir“) verwendet *पर*, und die stolze Person steht mit *मुझे*.'
  hi.a1.unit28.lesson06.teach.arjun_bahut_shukriya:
    title: Arjun ist gerührt
    gloss: 'Arjun: Vielen Dank, das bedeutet mir viel.'
    note: '*मेरे लिए* bedeutet „für mich“, und *इसका बहुत मतलब है* heißt „es bedeutet viel“.'
  hi.a1.unit28.lesson06.teach.uskee_pahlee_shift:
    title: Sein
    gloss: Seine erste Schicht ist sehr gut gelaufen.
    note: '*उसकी* bedeutet „sein“ oder „ihr“ (dasselbe Wort für beides) und richtet sich nach dem femininen *शिफ़्ट*.'
