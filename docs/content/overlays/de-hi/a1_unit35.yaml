    title: Ich benutze mein Handy jeden Tag
    gloss: Ich benutze mein Handy jeden Tag.
    note: '*हर दिन* („jeden Tag“) ist eine Zeitangabe, die vor dem Verb steht.'
  hi.a1.unit35.lesson02.teach.aip:
    title: Die App
    gloss: die App
    example_gloss: Ich habe eine App für die Wettervorhersage.
  hi.a1.unit35.lesson02.teach.maisej:
    title: Die Nachricht
    gloss: die Nachricht
    example_gloss: Ich schicke eine Nachricht über die App.
  hi.a1.unit35.lesson02.teach.maisej_bhejte_bhee:
    title: Das Verb richtet sich nach der Person
    gloss: 'Eine *मैसेज* kann man senden oder lesen, und die Verbendung richtet sich nach der Person: *मैं भेजता हूँ*, *तुम पढ़ते हो*, *वह पढ़ता है*.'
    note: Verbindet das neue Wort mit dem bereits gelernten zusammengesetzten Nomen aus der Wetter-Lektion.
  hi.a1.unit35.lesson02.teach.priya_aip_se:
    title: Priya schickt eine Nachricht über die App
    gloss: Priya schickt eine Nachricht über die App.
    note: '*ऐप से* bedeutet „über die App“: *से* kennzeichnet das Mittel, das Sie benutzen.'
  hi.a1.unit35.lesson02.teach.arjun_maisej_parhta:
    title: Arjun liest die Nachricht
    gloss: Arjun liest die Nachricht.
  hi.a1.unit35.lesson03.teach.chek_karna:
    title: Nachschlagen
    gloss: nachschauen; suchen
    example_gloss: Ich schaue die Wettervorhersage nach.
  hi.a1.unit35.lesson03.teach.chek_karna_men:
    title: Nur करना verändert sich
    gloss: 'Bei *चेक करना* bleibt *चेक* gleich; nur *करना* verändert sich mit der Person: *मैं चेक करता हूँ*, *तुम चेक करते हो*. Bei *इस्तेमाल करना* ist es genauso.'
    note: 'Viele Hindi-Verben bestehen aus einem Nomen oder Lehnwort plus *करना*: Lernen Sie das erste Wort einmal und verändern Sie nur *करना*.'
  hi.a1.unit35.lesson03.teach.vikram_mausam_ka:
    title: Vikram schaut die Wettervorhersage nach
    gloss: Vikram schaut die Wettervorhersage nach.
  hi.a1.unit35.lesson03.teach.phir_vah_daurne:
    title: Danach geht er joggen
    gloss: Danach geht er joggen.
    note: '*दौड़ने जाना* („laufen gehen“) setzt das Verb vor *जाना* in die *-ने*-Form.'
  hi.a1.unit35.lesson04.teach.priya_chalo_shanivar:
    title: Priya macht einen Vorschlag
    gloss: 'Priya: Wollen wir Samstag um zehn Sport machen?'
  hi.a1.unit35.lesson04.teach.arjun_achchha_aidiya:
    title: Arjun stimmt zu
    gloss: 'Arjun: Gute Idee! Ich schaue die Wettervorhersage nach.'
    note: '*अच्छा आइडिया!* ist ein kurzes, freundliches „Gute Idee“.'
  hi.a1.unit35.lesson04.teach.arjun_shanivar_ko:
    title: Arjun prüft das Wetter
    gloss: 'Arjun: Am Samstag scheint die Sonne!'
    note: 'Ein „es“ gibt es nicht: Hindi sagt *शनिवार को धूप है* („am Samstag ist Sonnenschein“).'
  hi.a1.unit35.lesson04.teach.vikram_mujhe_maisej:
    title: Vikram sieht die Nachricht
    gloss: 'Vikram: Ich sehe die Nachricht. Bis Samstag!'
  hi.a1.unit35.lesson04.teach.phir_milenge_yah:
    title: फिर मिलेंगे vs. Tag + को
    gloss: 'Sie kennen *फिर मिलेंगे!* („Bis bald!“). Um einen Tag zu nennen, setzen Sie *को* dahinter: *शनिवार को मिलते हैं!*, *सोमवार को मिलते हैं!*'
    note: Überträgt das Verabschiedungsmuster aus der Begrüßungs-Lektion auf einen bestimmten Tag.
  hi.a1.unit35.lesson05.teach.priya_har_din:
    title: Wer nutzt was?
    gloss: Priya ruft Arjun jeden Tag an. Sie benutzt ihr Handy, keine App. Arjun hat zu Hause keinen Computer, aber er nutzt das Internet auf seinem Handy. Vikram schaut jeden Morgen die Wettervorhersage nach. Dann geht er joggen. Neha schickt Priya oft eine Nachricht. Benutzt du auch jeden Tag dein Handy?
    note: Vergleicht die Gewohnheiten aller vier Figuren mit Geräten, ähnlich wie der Vergleichstext in der Sport-Lektion.
    glosses:
      कॉल: ruft an
      हर: jeder
      दिन: Tag
      इस्तेमाल: benutzt
      फ़ोन: Handy
      ऐप: App
      कंप्यूटर: Computer
      घर: zu Hause
      इंटरनेट: Internet
      चेक: schaut nach
      सुबह: der Morgen
      अनुमान: Wettervorhersage
      जाता: geht
      दौड़ने: laufen; joggen
      भेजती: schickt
      अक्सर: oft
      मैसेज: Nachricht
      करते: benutze
  hi.a1.unit35.lesson05.teach.vikram_har_subah:
    title: Vikram schaut jeden Morgen die Vorhersage nach
    gloss: Vikram schaut jeden Morgen die Wettervorhersage nach.
  hi.a1.unit35.lesson05.teach.neha_aksar_priya:
    title: Neha schreibt Priya oft
    gloss: Neha schickt Priya oft eine Nachricht.
  hi.a1.unit35.lesson06.teach.priya_mujhe_maisej:
    title: Priya bestätigt den Plan
    gloss: 'Priya: Ich sehe die Nachricht. Wollen wir Samstag um zehn im Park Sport machen?'
  hi.a1.unit35.lesson06.teach.arjun_han_aur:
    title: Arjun bestätigt das Wetter
    gloss: 'Arjun: Ja, und am Samstag scheint die Sonne!'
  hi.a1.unit35.lesson06.teach.vikram_tab_main:
    title: Vikrams Plan
    gloss: 'Vikram: Dann gehe ich joggen. Danach spiele ich auch noch Fußball.'
    note: '*उसके बाद* („danach“) leitet den zweiten Schritt ein, und *भी* bedeutet „auch“.'
  hi.a1.unit35.lesson06.teach.neha_mujhe_tairna:
    title: Nehas Plan
    gloss: 'Neha: Ich schwimme lieber, aber ich komme auch in den Park.'
    note: Etwas lieber mögen wird mit einem *मुझे ... पसंद है*-Satz ausgedrückt, und *ज़्यादा* fügt „mehr“ hinzu.
  hi.a1.unit35.lesson06.teach.priya_barhiya_shanivar:
    title: Priya beendet das Gespräch
    gloss: 'Priya: Prima! Bis Samstag im Park!'
    note: Schließt in einer Zeile den Nachrichtenverlauf dieser Lektion und den Plan aus der Sport-Lektion ab.
