teaching:
  hi.a1.unit31.lesson01.teach.lanba_chhota:
    title: Groß und klein
    gloss: groß / klein
    note: '*लंबा* und *छोटा* beschreiben die Größe und stehen meist bei *कद* („Körpergröße“): *नेहा का कद लंबा है*. Sie enden auf *-ा* bei einem maskulinen und auf *-ी* bei einem femininen Nomen.'
    example_gloss:
    - Neha ist groß.
    - Vikram ist klein.
  hi.a1.unit31.lesson01.teach.boorha_javan:
    title: Alt und jung
    gloss: alt / jung
    note: '*बूढ़ा* und *जवान* beschreiben, wie alt jemand wirkt, ganz ohne Zahl.'
    example_gloss:
    - Opa ist alt.
    - Arjun ist jung.
  hi.a1.unit31.lesson01.teach.tumharee_umr_kitnee:
    title: उम्र und बूढ़ा
    gloss: Wie alt bist du? Opa ist alt.
    note: Um nach dem genauen Alter zu fragen, verwendet Hindi *उम्र* („Alter“), während *बूढ़ा* eine alte Person ohne Zahl beschreibt.
  hi.a1.unit31.lesson01.teach.neha_ka_kad:
    title: Neha ist groß und Vikram ist klein
    gloss: Neha ist groß und Vikram ist klein.
    note: '*और* („und“) verbindet die beiden Beschreibungen, und jedes *का कद* richtet sich nach dem maskulinen *कद*.'
  hi.a1.unit31.lesson02.teach.bal:
    title: Haare
    gloss: die Haare
    note: '*बाल* („Haare“) ist im Hindi maskulin und Plural, daher enden beschreibende Wörter darauf auf *-े*: *लंबे बाल*.'
    example_gloss: Arjun hat kurze schwarze Haare.
  hi.a1.unit31.lesson02.teach.sunahre_bhoore_safed:
    title: Blond, braun und weiß
    gloss: blond / braun / weiß
    note: 'Drei Haarfarben: *सुनहरे*, *भूरे* und *सफ़ेद*; vor *बाल* enden sie auf *-े*.'
    example_gloss:
    - Priya hat blonde Haare.
    - Vikram hat braune Haare.
    - Opa hat weiße Haare.
  hi.a1.unit31.lesson02.teach.lanbe_chhote:
    title: Lang und kurz (Haare)
    gloss: lang / kurz (Haare)
    note: '*लंबे* („lang“) und *छोटे* („kurz“) beschreiben Haare und enden auf *-े*, weil *बाल* Plural ist.'
    example_gloss:
    - Neha hat lange Haare.
    - Vikram hat kurze Haare.
  hi.a1.unit31.lesson02.teach.lanbe_bal_chhote:
    title: Adjektive vor बाल
    gloss: Lange Haare, kurze Haare, goldene Haare, braune Haare, weiße Haare, schwarze Haare.
    note: '*बाल* ist maskulin Plural, daher endet das Adjektiv davor auf *-े*: *लंबे बाल*, *भूरे बाल*.'
  hi.a1.unit31.lesson02.teach.uske_bal_lanbe:
    title: 'उसके: sein oder ihr'
    gloss: Seine oder ihre Haare sind lang.
    note: '*उसके* bedeutet sowohl „sein“ als auch „ihr“; nur der Kontext zeigt, was gemeint ist. Hier richtet es sich nach dem Plural *बाल*.'
  hi.a1.unit31.lesson02.teach.arjun_ke_bal:
    title: Arjun hat kurze schwarze Haare
    gloss: Arjun hat kurze schwarze Haare.
    note: '*काले* kommt hier noch einmal vor, jetzt für Haare, und es endet auf *-े*, weil *बाल* Plural ist.'
  hi.a1.unit31.lesson02.teach.priya_ke_bal:
    title: Priya hat lange blonde Haare
    gloss: Priya hat lange blonde Haare.
    note: Verbindet Länge und Farbe aus dieser Lektion in einem natürlichen Satz.
  hi.a1.unit31.lesson03.teach.ankhen:
    title: Augen
    gloss: die Augen
    note: '*आँखें* („Augen“) ist ein feminines Pluralnomen; der Singular lautet *आँख*.'
    example_gloss: Arjun hat braune Augen.
  hi.a1.unit31.lesson03.teach.neela_bhoora_hara:
    title: Blau, braun und grün
    gloss: blau / braun / grün
    note: 'Drei Augenfarben: *नीला*, *भूरा* und *हरा*; vor dem femininen *आँखें* werden sie zu *नीली*, *भूरी* und *हरी*.'
    example_gloss:
    - Priya hat blaue Augen.
    - Vikram hat braune Augen.
    - Neha hat grüne Augen.
  hi.a1.unit31.lesson03.teach.neelee_ankhen_bhooree:
    title: Adjektive vor आँखें
    gloss: Blaue Augen, braune Augen, grüne Augen.
    note: '*आँखें* ist feminin, daher endet das Adjektiv davor auf *-ी*: *नीली आँखें*.'
  hi.a1.unit31.lesson03.teach.priya_kaisee_dikhtee:
    title: Wie sieht Priya aus?
    gloss: Wie sieht Priya aus?
    note: '*कैसी दिखती है?* („Wie sieht sie aus?“) ist die Kernfrage: *कैसी* und *दिखती* sind bei einer Frau feminin, *कैसा* und *दिखता* bei einem Mann maskulin.'
  hi.a1.unit31.lesson03.teach.priya_ke_bal:
    title: Priya hat lange blonde Haare und blaue Augen
    gloss: Priya hat lange blonde Haare und blaue Augen.
    note: 'Eine Musterantwort: Haare und Augen werden mit *और* verbunden. Die Person steht mit *के* beim Plural *बाल* und mit *की* bei dem femininen *आँखें*.'
  hi.a1.unit31.lesson04.teach.priya_bhasha_kaife:
    title: Priya stellt Nina vor
    gloss: 'Priya: Ins Sprachcafé kommt ein neues Mädchen. Sie heißt Nina.'
    note: '*आ रही है* („kommt gerade“) führt jemand Neues ein, und *उसका नाम ... है* nennt den Namen.'
  hi.a1.unit31.lesson04.teach.arjun_oke_vah:
    title: Arjun fragt, wie sie aussieht
    gloss: 'Arjun: Okay! Wie sieht sie aus?'
    note: '*वह देखने में कैसी है?* fragt „Wie wirkt sie vom Aussehen her?“; *वह* bedeutet sowohl „er“ als auch „sie“.'
  hi.a1.unit31.lesson04.teach.priya_uska_kad:
    title: Priya beschreibt Ninas Größe und Haare
    gloss: 'Priya: Sie ist klein und hat kurze blonde Haare.'
    note: 'Hier werden Größe und Haare verbunden: *उसका कद छोटा है और उसके बाल छोटे और सुनहरे हैं*.'
  hi.a1.unit31.lesson04.teach.arjun_aur_uskee:
    title: Arjun fragt nach ihren Augen
    gloss: 'Arjun: Und ihre Augen?'
    note: '*उसकी आँखें* heißt „ihre Augen“; *उसकी* ist feminin, passend zu *आँखें*.'
  hi.a1.unit31.lesson04.teach.priya_uskee_ankhen:
    title: Priya beschreibt Ninas Augen
    gloss: 'Priya: Sie hat grüne Augen.'
    note: '*हरी* endet auf *-ी*, weil *आँखें* feminin ist.'
  hi.a1.unit31.lesson04.teach.arjun_shukriya_tab:
    title: Arjun wird sie erkennen
    gloss: 'Arjun: Danke! Dann erkenne ich sie.'
    note: '*पहचान लूँगा* („ich werde erkennen“) ist das Futur von *पहचानना*, und *उसे* heißt „sie“ (als Objekt).'
  hi.a1.unit31.lesson05.teach.vikram_aur_neha:
    title: Vikram und Neha im Vergleich
    gloss: Vikram und Neha sind Bruder und Schwester, aber sie sehen unterschiedlich aus. Vikram ist klein und hat kurze braune Haare und braune Augen. Neha ist größer als Vikram und hat lange braune Haare und grüne Augen. Wie siehst du aus?
    note: Ein kurzer Vergleich mit allen bisher gelernten Farb- und Längenwörtern; am Ende steht die Kernfrage der Einheit an die Leserin bzw. den Leser.
    glosses:
      भाई: Bruder
      बहन: Schwester
      दिखते: ist ... (vom Aussehen her)
      अलग: verschieden
      छोटा: klein
      छोटे: klein
      भूरे: braun
      बाल: Haare
      भूरी: braun
      आँखें: Augen
      लंबी: größer
      लंबे: lang
      हरी: grün
      कैसे: wie (wie in „Wie siehst du aus?“)
  hi.a1.unit31.lesson05.teach.vikram_neha_se:
    title: Vergleichen mit से
    gloss: Vikram ist kleiner als Neha.
    note: '*से* bedeutet hier „als“ und steht nach der Person, mit der verglichen wird: *नेहा से छोटा*; das Adjektiv steht direkt vor dem Verb.'
  hi.a1.unit31.lesson05.teach.neha_ke_bal:
    title: Neha hat längere Haare als Vikram
    gloss: Neha hat längere Haare als Vikram.
    note: '*लंबे* richtet sich nach dem Plural *बाल*, und *विक्रम से* bildet den Vergleich.'
  hi.a1.unit31.lesson05.teach.mere_bal_chhote:
    title: Ich habe kurze braune Haare
    gloss: Ich habe kurze braune Haare.
    note: '*मेरे बाल छोटे और भूरे हैं* („Meine Haare sind kurz und braun“) ist ein Mustersatz, um sich selbst zu beschreiben; *मेरे* richtet sich nach dem Plural *बाल*.'
  hi.a1.unit31.lesson06.teach.arjun_dekho_kya:
    title: Arjun entdeckt Nina
    gloss: 'Arjun: Schau, ist das Nina? Sie hat kurze blonde Haare und grüne Augen.'
    note: '*देखो* („schau“) ist der informelle Imperativ gegenüber einem Freund.'
  hi.a1.unit31.lesson06.teach.priya_han_vahee:
    title: Priya bestätigt
    gloss: 'Priya: Ja, das ist Nina!'
    note: Eine kurze, natürliche Bestätigung.
  hi.a1.unit31.lesson06.teach.neena_hay_kya:
    title: Nina begrüßt Arjun
    gloss: 'Nina: Hallo, bist du Arjun?'
    note: '*क्या तुम अर्जुन हो?* ist eine einfache, informelle Frage an jemanden in deinem Alter.'
  hi.a1.unit31.lesson06.teach.arjun_han_tumse:
    title: Arjun begrüßt Nina zurück
    gloss: 'Arjun: Ja! Schön, dich kennenzulernen, Nina.'
    note: '*तुमसे मिलकर अच्छा लगा* ist die übliche Wendung, wenn man jemanden zum ersten Mal trifft. Das Gefühl „geschieht“ einem gewissermaßen, daher braucht man kein Wort für „ich“.'
  hi.a1.unit31.lesson06.teach.neena_mujhe_bhee:
    title: Nina erwidert die Begrüßung
    gloss: 'Nina: Freut mich auch, dich kennenzulernen!'
    note: 'Das Gespräch endet: Arjun hat Nina anhand von Priyas früherer Beschreibung erkannt.'
