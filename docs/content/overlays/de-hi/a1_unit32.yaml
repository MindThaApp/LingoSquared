teaching:
  hi.a1.unit32.lesson01.teach.janvar_paltoo_janvar:
    title: Tier, Haustier
    gloss: das Tier / ein Haustier
    note: '*जानवर* ist das allgemeine Wort für „Tier“, und *पालतू जानवर* (wörtlich „zahmes Tier“) bedeutet „Haustier“.'
    example_gloss:
    - Ein Hund ist ein Tier.
    - Ein Hund ist auch ein Haustier.
  hi.a1.unit32.lesson01.teach.kutta_billee:
    title: Hund und Katze
    gloss: der Hund / die Katze
    example_gloss:
    - Priya hat einen Hund.
    - Vikram hat eine Katze.
  hi.a1.unit32.lesson01.teach.machhlee_chiriya:
    title: Fisch und Vogel
    gloss: der Fisch / der Vogel
    example_gloss:
    - Opa hat einen Fisch.
    - Nina hat einen Vogel.
  hi.a1.unit32.lesson01.teach.kya_tumhare_pas:
    title: Hast du ein Haustier?
    gloss: Hast du ein Haustier?
    note: '*तुम्हारे पास ... है?* (wörtlich „bei dir ... ist?“) fragt „Hast du ...?“, und *कोई* („irgendein“) hält die Frage offen.'
  hi.a1.unit32.lesson01.teach.han_mere_pas:
    title: Ja, ich habe einen Hund
    gloss: Ja, ich habe einen Hund.
    note: Eine einfache bejahende Antwort mit dem neuen Wortschatz dieser Lektion.
  hi.a1.unit32.lesson01.teach.naheen_mere_pas:
    title: Nein, ich habe kein Haustier
    gloss: Nein, ich habe kein Haustier.
    note: '*कोई ... नहीं है* (wörtlich „es gibt kein ...“) sagt aus, dass man keines hat.'
  hi.a1.unit32.lesson01.teach.mere_pas_koee:
    title: कोई ... नहीं
    gloss: Ich habe kein Haustier.
    note: '*कोई* („irgendein“) zusammen mit *नहीं है* verneint den Besitz: *मेरे पास कोई पालतू जानवर नहीं है*.'
  hi.a1.unit32.lesson02.teach.ghumane_le_jana:
    title: (Ein Tier) ausführen
    gloss: (ein Tier) ausführen, mit dem Hund rausgehen
    note: '*घुमाने ले जाना* (wörtlich „zum Spazierengehen mitnehmen“) ist die Hindi-Wendung für „ein Tier ausführen“; auf *घुमाने* folgt *ले जाना*.'
    example_gloss: Ich gehe jeden Tag mit dem Hund spazieren.
  hi.a1.unit32.lesson02.teach.vah_kutte_ko:
    title: घुमाने ले जाना
    gloss: Sie geht mit dem Hund spazieren.
    note: Das Tier steht mit *को* (*कुत्ते को*), und *घुमाने ले जाती है* steht am Ende; *ले जाना* („mitnehmen“) bleibt als zwei Wörter zusammen.
  hi.a1.unit32.lesson02.teach.khana_dena:
    title: Füttern
    gloss: füttern
    example_gloss: Ich füttere jeden Tag die Katze.
  hi.a1.unit32.lesson02.teach.ke_sath_khelna:
    title: Spielen mit
    gloss: spielen mit
    example_gloss: Vikram spielt mit seiner Katze.
  hi.a1.unit32.lesson02.teach.main_roz_kutte:
    title: Ich gehe jeden Tag mit dem Hund spazieren
    gloss: Ich gehe jeden Tag mit dem Hund spazieren.
    note: '*रोज़* („jeden Tag“) steht vor dem Objekt: *रोज़ कुत्ते को घुमाने ले जाता हूँ*.'
  hi.a1.unit32.lesson02.teach.main_roz_billee:
    title: Ich füttere jeden Tag die Katze
    gloss: Ich füttere jeden Tag die Katze.
    note: '*खाना देना* („Futter geben“) kennzeichnet mit *को*, wer das Futter bekommt: *बिल्ली को खाना देता हूँ*.'
  hi.a1.unit32.lesson03.teach.ek_kutta_do:
    title: Pluralformen
    gloss: Ein Hund, zwei Hunde; eine Katze, zwei Katzen. Ein maskulines Nomen auf *-आ* wird im Plural zu *-ए* (*कुत्ता* → *कुत्ते*), ein feminines Nomen auf *-ई* erhält *-याँ* (*बिल्ली* → *बिल्लियाँ*).
    note: Das regelmäßige Pluralmuster im Hindi, hier erstmals an Tiernamen als Beispielen eingeführt.
  hi.a1.unit32.lesson03.teach.kutte_billiyan:
    title: Hunde und Katzen
    gloss: Hunde / Katzen
    example_gloss:
    - Arjun liebt Hunde.
    - Neha liebt Katzen.
  hi.a1.unit32.lesson03.teach.machhliyan_chiriyan:
    title: Fische und Vögel (Plural)
    gloss: Fische / Vögel
    example_gloss:
    - Ich liebe Fische.
    - Opa liebt Vögel.
  hi.a1.unit32.lesson03.teach.mujhe_janvar_bahut:
    title: Ich liebe Tiere
    gloss: Ich liebe Tiere.
    note: '*मुझे जानवर बहुत पसंद हैं* (wörtlich „mir sind Tiere sehr beliebt“) heißt „Ich liebe Tiere“; *हैं* steht im Plural, weil *जानवर* hier im Plural steht.'
  hi.a1.unit32.lesson03.teach.neha_ko_billiyan:
    title: Neha liebt Katzen, hat aber kein Haustier
    gloss: Neha liebt Katzen, aber sie hat kein Haustier.
    note: Bereitet den Gegensatz vor, um den sich der Lesetext der Lektion dreht.
  hi.a1.unit32.lesson04.teach.arjun_kya_tumhare:
    title: Arjun fragt nach einem Haustier
    gloss: 'Arjun: Hast du ein Haustier, Priya?'
  hi.a1.unit32.lesson04.teach.priya_han_mere:
    title: Priya hat einen Hund
    gloss: 'Priya: Ja, ich habe einen Hund.'
  hi.a1.unit32.lesson04.teach.arjun_vah_kaisa:
    title: Arjun fragt, wie er aussieht
    gloss: 'Arjun: Wie sieht er aus?'
    note: '*वह कैसा दिखता है?* funktioniert auch für Tiere, und *कैसा* ist maskulin, weil der Hund männlich ist.'
  hi.a1.unit32.lesson04.teach.priya_uske_bal:
    title: Priya beschreibt ihren Hund
    gloss: 'Priya: Er hat braunes Fell und ist klein.'
    note: Greift Wortschatz zu Haarfarbe und Größe aus der Lektion zum Aussehen wieder auf, hier für das Fell eines Tieres statt für die Haare eines Menschen.
  hi.a1.unit32.lesson04.teach.vah_mera_kutta:
    title: वह für Tiere
    gloss: Das ist mein Hund. Ich mag ihn sehr.
    note: '*वह* und *उसे* werden für Tiere ebenso verwendet wie für Menschen; Hindi hat hier kein eigenes Wort für „es“.'
  hi.a1.unit32.lesson04.teach.arjun_kya_tum:
    title: Arjun fragt nach dem Spaziergang
    gloss: 'Arjun: Gehst du jeden Tag mit ihm spazieren?'
  hi.a1.unit32.lesson04.teach.priya_han_main:
    title: Priya beschreibt ihren Alltag
    gloss: 'Priya: Ja, ich gehe jeden Tag mit ihm spazieren und gebe ihm Futter.'
  hi.a1.unit32.lesson05.teach.arjun_aur_neha:
    title: Arjun, Neha und Vikram über Tiere
    gloss: 'Arjun und Neha lieben beide Tiere, aber keiner von beiden hat ein Haustier. Arjun liebt Hunde und Neha liebt Katzen. Vikram hat ein Haustier: eine Katze. Er spielt oft mit seiner Katze und gibt ihr jeden Tag Futter. Hast du ein Haustier?'
    note: Stellt gegenüber, ein Tier zu lieben und es wirklich zu besitzen – das ist der kommunikative Kern dieser Lektion.
    glosses:
      पसंद: lieben
      दोनों: beide
      जानवर: Tiere
      किसी: einer von ihnen
      पालतू: Haustier
      कुत्ते: Hunde
      बिल्लियाँ: Katzen
      बिल्ली: Katze
      खेलता: spielt
      देता: gibt
      रोज़: jeder
      खाना: Futter
  hi.a1.unit32.lesson05.teach.vikram_aksar_apnee:
    title: Vikram spielt oft mit seiner Katze
    gloss: Vikram spielt oft mit seiner Katze.
    note: '*अक्सर* („oft“) steht vor dem Verb, und *अपनी* richtet sich nach dem femininen *बिल्ली*.'
  hi.a1.unit32.lesson05.teach.mujhe_kutte_bahut:
    title: Ich liebe Hunde. Ich habe kein Haustier.
    gloss: Ich liebe Hunde. Ich habe kein Haustier.
    note: Eine Muster-Antwort in zwei Sätzen, die Sie für die Schreibaufgabe der Lektion übernehmen können.
  hi.a1.unit32.lesson06.teach.priya_neena_kya:
    title: Priya fragt Nina
    gloss: 'Priya: Nina, hast du auch ein Haustier?'
  hi.a1.unit32.lesson06.teach.neena_han_mere:
    title: Nina hat einen Vogel namens Pico
    gloss: 'Nina: Ja, ich habe einen Vogel. Er heißt Pico.'
    note: '*उसका नाम पीको है* („sein Name ist Pico“) hat *का*, weil *नाम* maskulin ist.'
  hi.a1.unit32.lesson06.teach.arjun_vah_kitna:
    title: Arjun reagiert
    gloss: 'Arjun: Wie schön! Was machst du jeden Tag mit ihm?'
  hi.a1.unit32.lesson06.teach.neena_main_use:
    title: Nina füttert ihn jeden Tag
    gloss: 'Nina: Ich füttere ihn jeden Tag.'
  hi.a1.unit32.lesson06.teach.arjun_mujhe_bhee:
    title: Arjun liebt auch Vögel
    gloss: 'Arjun: Ich liebe Vögel auch.'
  hi.a1.unit32.lesson06.teach.priya_kitna_achchha:
    title: Priya beendet das Gespräch
    gloss: 'Priya: Wie schön, dass wir drei Tiere lieben!'
    note: Schließt den Kreis um alle Aussagen der drei Personen zu Tieren in dieser Lektion.
