    title: खेलना oder करना
    gloss: 'Fußball spielen, Yoga machen. Hindi wählt das Verb nach der Sportart: *खेलना* für Spiele wie Fußball und *करना* für Dinge wie Yoga; die Sportart steht vor dem Verb.'
