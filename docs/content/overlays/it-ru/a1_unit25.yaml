teaching:
  ru.a1.unit25.lesson01.teach.chitat_zanimatsya_sportom:
    title: Leggere, fare sport, cucinare
    gloss: leggere, fare sport, cucinare
    note: 'Tre verbi comuni per gli hobby: *читать* (leggere), *заниматься спортом* (fare sport) e *готовить* (cucinare).'
    example_gloss:
    - Mi piace leggere un libro.
    - Faccio sport il sabato.
    - Mi piace cucinare per gli amici.
  ru.a1.unit25.lesson01.teach.svobodnoe_vremya:
    title: Tempo libero
    gloss: tempo libero
    note: '*Свободное время* è l''espressione chiave per parlare degli hobby. L''aggettivo *свободное* termina in *-ое* per concordare con *время*.'
    example_gloss: Nel mio tempo libero mi piace leggere.
  ru.a1.unit25.lesson01.teach.v_svobodnoe_vremya:
    title: Dire che cosa fai nel tempo libero
    gloss: Nel mio tempo libero mi piace leggere.
    note: '*Люблю* è la forma di *я* di *любить* (amare, piacere). Dopo di essa il secondo verbo resta all''infinito: *люблю читать*.'
  ru.a1.unit25.lesson02.teach.slushat_muzyku_risovat:
    title: Musica, disegno, videogiochi
    gloss: ascoltare musica, disegnare, giocare ai videogiochi
    note: 'Altri tre hobby: *слушать музыку* (ascoltare musica), *рисовать* (disegnare) e *играть в игры* (giocare ai videogiochi).'
    example_gloss:
    - Mi piace ascoltare musica.
    - Disegno spesso.
    - Mi piace giocare ai videogiochi con gli amici.
  ru.a1.unit25.lesson02.teach.ya_lyublyu_slushat:
    title: Dire che ti piace ascoltare musica
    gloss: Mi piace ascoltare musica.
    note: '*Слушать* regge direttamente il complemento: *музыку* è l''accusativo di *музыка*, con la desinenza *-у*.'
  ru.a1.unit25.lesson02.teach.ya_lyublyu_igrat:
    title: Dire che ti piace giocare ai videogiochi con gli amici
    gloss: Mi piace giocare ai videogiochi con gli amici.
    note: '*С друзьями* (con gli amici): la preposizione *с* è seguita dal caso strumentale, per questo *друзьями*.'
  ru.a1.unit25.lesson03.teach.vsegda_chasto_inogda:
    title: Sempre, spesso, a volte, mai
    gloss: sempre, spesso, a volte, mai
    note: 'I quattro avverbi di frequenza fondamentali: *всегда*, *часто*, *иногда*, *никогда*. Non cambiano mai forma.'
    example_gloss:
    - Faccio sempre sport il sabato.
    - Leggo spesso un libro.
    - A volte disegno.
    - Non gioco mai ai videogiochi.
  ru.a1.unit25.lesson03.teach.kazhduyu_nedelyu_kazhdye:
    title: Ogni settimana, ogni fine settimana
    gloss: ogni settimana, ogni fine settimana
    note: '*Каждую неделю* e *каждые выходные* significano entrambi «ogni», ma la desinenza segue il sostantivo: vedi la scheda successiva.'
    example_gloss:
    - Cucino per gli amici ogni settimana.
    - Faccio sport ogni fine settimana.
  ru.a1.unit25.lesson03.teach.nedelya_zhenskogo_roda:
    title: 'Ogni: femminile e plurale'
    gloss: '*Неделя* è femminile, quindi si dice *каждую неделю*. *Выходные* è plurale, quindi si dice *каждые выходные*.'
    note: '*Каждый* concorda con il sostantivo come ogni aggettivo: *каждый день* (maschile), *каждую неделю* (femminile, accusativo), *каждые выходные* (plurale).'
  ru.a1.unit25.lesson03.teach.chto_ty_delaesh:
    title: Chiedere del tempo libero
    gloss: Che cosa fai nel tempo libero?
    note: 'Questa è la domanda chiave dell''unità: usala per chiedere a chiunque dei suoi hobby.'
  ru.a1.unit25.lesson04.teach.nastya_my_chasto:
    title: Nastya parla degli hobby
    gloss: 'Nastya: Passeggiamo spesso insieme. E tu, Dima, che altro fai nel tempo libero?'
    note: '*Мы часто гуляем вместе*: con *мы* (noi) il verbo prende la desinenza *-ем*, e *гулять* significa passeggiare per piacere.'
  ru.a1.unit25.lesson04.teach.dima_ya_lyublyu:
    title: Gli hobby di Dima
    gloss: 'Dima: Mi piace cucinare, anche a casa. E poi faccio spesso sport.'
    note: '*И дома тоже* (anche a casa): *и ... тоже* mostra che Dima cucina per divertimento, non solo al lavoro.'
  ru.a1.unit25.lesson04.teach.nastya_ty_i:
    title: Nastya è sorpresa
    gloss: 'Nastya: Cucini anche a casa? Ma se cucini già tutto il giorno al lavoro!'
    note: '*Весь день* (tutto il giorno) sottolinea quanto Dima cucini già al lavoro. *Весь* concorda con il maschile *день*.'
  ru.a1.unit25.lesson04.teach.dima_da_no:
    title: Dima spiega
    gloss: 'Dima: Sì, ma cucinare mi rilassa. E tu, cosa ti piace fare?'
    note: '*Готовить меня расслабляет* mette l''attività all''inizio: letteralmente «cucinare mi rilassa», con *меня* all''accusativo.'
  ru.a1.unit25.lesson04.teach.nastya_ya_lyublyu:
    title: Gli hobby di Nastya
    gloss: 'Nastya: Mi piace leggere e ascolto spesso musica.'
    note: 'Due verbi di hobby delle lezioni precedenti sono uniti da *и* (e): *люблю читать и часто слушаю музыку*.'
  ru.a1.unit25.lesson04.teach.dima_ty_tozhe:
    title: Dima chiede dei videogiochi
    gloss: 'Dima: Anche tu giochi ai videogiochi?'
    note: 'Una breve domanda sì/no: in russo l''ordine delle parole resta uguale e cambia solo l''intonazione, che sale: *Ты тоже играешь в игры?*'
  ru.a1.unit25.lesson04.teach.nastya_net_ya:
    title: Nastya risponde
    gloss: 'Nastya: No, non gioco mai ai videogiochi. In compenso ogni tanto disegno!'
    note: '*Никогда не* (mai) richiede il *не* davanti al verbo, come nell''italiano «non… mai». *Иногда* (a volte) è il contrario.'
  ru.a1.unit25.lesson05.teach.my_s_dimoy:
    title: Confronto tra hobby
    gloss: Io e Dima passeggiamo spesso insieme. Ma abbiamo anche altri hobby. A Dima piace cucinare, anche a casa, e fa spesso sport. A me piace leggere e ascolto spesso musica. Ogni tanto disegno, ma non gioco mai ai videogiochi. E tu, cosa ti piace fare nel tempo libero?
    note: Il messaggio di Nastya riassume quanto visto nella lezione 4 e si chiude con la domanda centrale dell'unità.
    glosses:
      гуляем: passeggiamo
      часто: spesso
      вместе: insieme
      другие: altri
      готовить: cucina
      любит: piace
      дома: a casa
      занимается: fa sport
      читать: leggere
      слушаю: ascolto
      музыку: musica
      рисую: disegno
      иногда: a volte
      играю: gioco ai videogiochi
      никогда: mai
      свободное: libero
      время: tempo
  ru.a1.unit25.lesson06.teach.dima_chto_ty:
    title: Dima chiede del fine settimana
    gloss: 'Dima: Cosa fai questo fine settimana?'
    note: '*В эти выходные* (questo fine settimana): *выходные* è plurale, quindi anche *эти* è plurale, e *в* con un''indicazione di tempo vuole l''accusativo.'
  ru.a1.unit25.lesson06.teach.nastya_poka_ne:
    title: Nastya è indecisa
    gloss: 'Nastya: Per ora non so. Mi piace leggere, ma voglio anche uscire.'
    note: '*Хочу ещё выйти на улицу* significa «voglio anche uscire». *Хочу* è la forma di *я* di *хотеть*.'
  ru.a1.unit25.lesson06.teach.dima_davay_pogulyaem:
    title: Dima propone un programma
    gloss: 'Dima: Facciamo una passeggiata insieme? Poi ti preparo da mangiare.'
    note: '*Давай погуляем* è il modo abituale per proporre di fare qualcosa insieme, e *потом* (poi) mette in ordine il passo successivo.'
  ru.a1.unit25.lesson06.teach.nastya_khoroshaya_ideya:
    title: Nastya accetta
    gloss: 'Nastya: Bell''idea! Mi piace sia passeggiare sia cucinare.'
    note: '*Мне нравится* significa letteralmente «a me è gradito»: la persona è al dativo (*мне*) e segue ciò che piace.'
  ru.a1.unit25.lesson06.teach.dima_otlichno_togda:
    title: Dima conferma
    gloss: 'Dima: Perfetto. Allora ci vediamo sabato!'
    note: '*Увидимся в субботу* (ci vediamo sabato): *в* con un giorno della settimana vuole l''accusativo, quindi *суббота* diventa *субботу*.'
