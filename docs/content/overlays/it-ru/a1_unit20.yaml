  ru.a1.unit20.lesson02.teach.idet_dozhd:
    title: Идёт дождь.
    gloss: Piove.
    note: 'In russo si dice дождь идёт, letteralmente «la pioggia va». Come in italiano, non serve alcun soggetto come «esso»: il russo non ha un soggetto fittizio.'
