teaching:
  ru.a1.unit03.lesson01.teach.u_menya:
    title: У меня ...
    gloss: Ho ...
    note: 'Alla lettera «presso di me (c''è) ...»: è il modo standard in russo di dire «ho», senza un verbo corrispondente a «avere».'
  ru.a1.unit03.lesson01.teach.odin_dva:
    title: один, два
    gloss: uno, due
    note: 'Dopo два («due») il nome prende una forma speciale di genitivo singolare: брат («fratello») diventa брата, non il plurale che ti aspetteresti in italiano.'
    example_gloss:
    - Ho un fratello.
    - Ho due fratelli.
  ru.a1.unit03.lesson01.teach.tri_chetyre:
    title: три, четыре
    gloss: tre, quattro
    note: 'Три e четыре richiedono la stessa forma di genitivo singolare di два: книга («libro») diventa книги dopo два, три e четыре.'
    example_gloss:
    - Ho tre libri.
    - Ho quattro libri.
  ru.a1.unit03.lesson01.teach.pyat:
    title: пять
    gloss: cinque
    note: 'Da пять («cinque») in su il nome passa invece al genitivo plurale: рубль («rublo») diventa рублей, non рубли.'
    example_gloss: Ho cinque rubli.
  ru.a1.unit03.lesson01.teach.brat_bratya:
    title: брат, брата
    gloss: fratello; fratelli (dopo 2-4)
    note: брата è la forma di genitivo singolare usata proprio dopo два, три e четыре, non il normale plurale.
    example_gloss: Ho due fratelli.
  ru.a1.unit03.lesson01.teach.kniga_knigi:
    title: книга, книги
    gloss: libro; libri (dopo 2-4)
    note: книги segue lo stesso schema di genitivo singolare di брата, usato dopo два, три e четыре.
    example_gloss: Ho tre libri.
  ru.a1.unit03.lesson01.teach.rubl_rubley:
    title: рубль, рублей
    gloss: rublo; rubli (da 5 in su)
    note: рублей è la forma di genitivo plurale usata da пять («cinque») in su.
    example_gloss: Ho cinque rubli.
  ru.a1.unit03.lesson02.teach.shest_sem:
    title: шесть, семь
    gloss: sei, sette
    note: Come пять, anche шесть e семь richiedono il nome al genitivo plurale.
    example_gloss:
    - Sono le sei.
    - Ho sette rubli.
  ru.a1.unit03.lesson02.teach.vosem_devyat:
    title: восемь, девять
    gloss: otto, nove
    note: 'Entrambi proseguono lo schema del genitivo plurale: книга diventa книг e рубль diventa рублей.'
    example_gloss:
    - Ho otto libri.
    - Ho nove rubli.
  ru.a1.unit03.lesson02.teach.desyat:
    title: десять
    gloss: dieci
    note: Si usa anche per dire l'età, come in Мне десять лет («Ho dieci anni»).
    example_gloss: Ho dieci anni.
  ru.a1.unit03.lesson02.teach.kniga_genitive_plural:
    title: книг
    gloss: libri (genitivo plurale, da 5 in su)
    note: 'È il genitivo plurale di книга, usato da пять in su: nota che perde del tutto la vocale finale, a differenza di книги, usato dopo два, три e четыре.'
    example_gloss: Ho nove libri.
  ru.a1.unit03.lesson02.teach.mne_let:
    title: Мне десять лет.
    gloss: Ho dieci anni.
    note: In russo l'età si esprime con il dativo «a me» (мне) più un numero e лет (genitivo plurale di «anni»), senza un verbo come l'italiano «ho» o «sono».
  ru.a1.unit03.lesson02.teach.skolko_vam_let:
    title: Сколько вам лет?
    gloss: Quanti anni ha? (formale)
    note: Usa il dativo formale вам, in linea con il registro вы dell'Unità 2.
  ru.a1.unit03.lesson03.teach.skolko_stoit:
    title: Сколько это стоит?
    gloss: Quanto costa questo?
    note: È il modo standard di chiedere il prezzo di un singolo articolo, con стоит («costa», singolare).
  ru.a1.unit03.lesson03.teach.skolko_stoyat:
    title: Сколько стоят яблоки?
    gloss: Quanto costano le mele?
    note: Usa стоят (il plurale di «costare») perché яблоки («mele») è plurale, a differenza del singolare стоит in Сколько это стоит?
  ru.a1.unit03.lesson03.teach.rubley:
    title: рубль, рубля, рублей
    gloss: rublo (1); rubli (2-4); rubli (5 e oltre)
    note: 'La parola per «rublo» cambia forma in base al numero che la precede: рубль dopo uno, рубля dopo два, три e четыре, e рублей da пять in su.'
    example_gloss:
    - Questo costa un rublo.
    - Questo costa due rubli.
    - Questo costa cinque rubli.
  ru.a1.unit03.lesson03.teach.pokupatel_greeting:
    title: Il cliente saluta il venditore
    gloss: 'Cliente: Buongiorno! Quanto costano le mele?'
    note: Un cliente a una bancarella del mercato inizia con educazione dicendo Здравствуйте prima di chiedere il prezzo.
  ru.a1.unit03.lesson03.teach.prodavets_apples:
    title: Il venditore risponde
    gloss: 'Venditore: Tre rubli.'
    note: Три рубля usa la forma del genitivo singolare di «rublo» richiesta dai numeri da 2 a 4, in accordo con три.
  ru.a1.unit03.lesson03.teach.pokupatel_bread:
    title: Il cliente chiede del pane
    gloss: 'Cliente: E quanto costa il pane?'
    note: Il cliente usa А («e») per passare con naturalezza a una seconda domanda su un altro prodotto.
  ru.a1.unit03.lesson03.teach.prodavets_bread:
    title: Il venditore risponde di nuovo
    gloss: 'Venditore: Sei rubli.'
    note: Шесть рублей usa il genitivo plurale richiesto dai numeri da 5 in su, in accordo con шесть.
  ru.a1.unit03.lesson03.teach.pokupatel_close:
    title: Il cliente chiude con cortesia
    gloss: 'Cliente: Va bene, grazie!'
    note: Хорошо, спасибо! chiude lo scambio al mercato in modo cordiale, riutilizzando il vocabolario dell'unità sui saluti.
