teaching:
  ru.a1.unit10.lesson01.teach.kak_doyti:
    title: Как дойти до...?
    gloss: Come arrivo a...?
    note: Как дойти до...? è il modo standard e cortese per chiedere a uno sconosciuto la strada per un luogo; la destinazione va al genitivo.
  ru.a1.unit10.lesson01.teach.muzeya:
    title: музей
    gloss: museo
    note: музей è maschile; музея è la sua forma al genitivo, usata dopo до («a / fino a»).
    example_gloss: Come arrivo al museo?
  ru.a1.unit10.lesson01.teach.pryamo:
    title: прямо
    gloss: dritto
    note: прямо indica di andare dritto; Идите è la forma di cortesia del comando «andare».
    example_gloss: Vai dritto.
  ru.a1.unit10.lesson01.teach.napravo:
    title: направо
    gloss: a destra
    note: направо indica la direzione del movimento (girare a destra); потом significa «poi».
    example_gloss: Vada dritto, poi a destra.
  ru.a1.unit10.lesson02.teach.nalevo:
    title: налево
    gloss: a sinistra
    note: налево indica la direzione del movimento, l'opposto di направо.
    example_gloss: Gira a sinistra.
  ru.a1.unit10.lesson02.teach.povernite:
    title: поверните
    gloss: giri (comando cortese)
    note: поверните è l'imperativo di cortesia di повернуть («girare»); за углом significa «dietro l'angolo».
    example_gloss: Giri a sinistra dietro l'angolo.
  ru.a1.unit10.lesson02.teach.kvartal_daleko:
    title: квартал, далеко
    gloss: isolato, lontano
    note: квартал è un isolato di città (квартала dopo два); далеко significa «lontano» e отсюда significa «da qui».
    example_gloss:
    - Vada avanti per due isolati.
    - È lontano da qui?
  ru.a1.unit10.lesson03.teach.tourist_prostite:
    title: Il turista chiede la strada
    gloss: 'Turista: Scusi, come arrivo al museo?'
    note: Турист comincia con Простите («scusi») prima di chiedere Как дойти до музея?
  ru.a1.unit10.lesson03.teach.prokhozhiy_eto_prosto:
    title: Il passante dà le indicazioni
    gloss: 'Passante: È molto semplice. Vada dritto per due isolati, poi giri a destra.'
    note: Прохожий risponde con Это очень просто, poi dà un'indicazione in due passaggi con Идите e поверните.
  ru.a1.unit10.lesson03.teach.tourist_daleko:
    title: Il turista chiede se è lontano
    gloss: 'Turista: È lontano da qui?'
    note: Это далеко отсюда? serve a chiedere quanto è lungo il tragitto a piedi.
  ru.a1.unit10.lesson03.teach.prokhozhiy_pyat_minut:
    title: Il passante stima il tempo
    gloss: 'Passante: No, cinque minuti a piedi.'
    note: Прохожий risponde con Нет, пять минут пешком («a piedi»).
  ru.a1.unit10.lesson03.teach.tourist_spasibo:
    title: Il turista ringrazia il passante
    gloss: 'Turista: Grazie mille.'
    note: Спасибо большое chiude lo scambio con cortesia.
  ru.a1.unit10.lesson03.teach.prokhozhiy_pozhaluysta:
    title: Il passante risponde
    gloss: 'Passante: Prego.'
    note: Пожалуйста risponde a спасибо con «prego».
