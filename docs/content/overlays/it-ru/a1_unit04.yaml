teaching:
  ru.a1.unit04.lesson01.teach.kakoy_den:
    title: Какой сегодня день?
    gloss: Che giorno è oggi?
    note: Какой concorda con il sostantivo maschile день («giorno»).
  ru.a1.unit04.lesson01.teach.ponedelnik_vtornik:
    title: понедельник, вторник
    gloss: lunedì, martedì
    note: In russo i giorni della settimana si scrivono con l'iniziale minuscola, come in italiano.
    example_gloss:
    - Oggi è lunedì.
    - Oggi è martedì.
  ru.a1.unit04.lesson01.teach.sreda_chetverg:
    title: среда, четверг
    gloss: mercoledì, giovedì
    note: Come tutti i nomi dei giorni della settimana in russo, среда e четверг si scrivono con la minuscola; la maiuscola serve solo a inizio frase.
    example_gloss:
    - Oggi è mercoledì.
    - Oggi è giovedì.
  ru.a1.unit04.lesson01.teach.pyatnitsa_subbota:
    title: пятница, суббота
    gloss: venerdì, sabato
    note: 'суббота ha una doppia б: è un errore di ortografia frequente.'
    example_gloss:
    - Oggi è venerdì.
    - Oggi è sabato.
  ru.a1.unit04.lesson01.teach.voskresenye:
    title: воскресенье
    gloss: domenica
    note: L'ultimo giorno dell'elenco della settimana russa.
    example_gloss: Oggi è domenica.
  ru.a1.unit04.lesson01.teach.segodnya:
    title: Сегодня ...
    gloss: Oggi è ...
    note: 'In russo Сегодня + giorno della settimana non richiede il verbo «essere»: si dice semplicemente «oggi» + il giorno, senza verbo di collegamento.'
  ru.a1.unit04.lesson02.teach.kakoe_chislo:
    title: Какое сегодня число?
    gloss: Che data è oggi?
    note: Какое concorda con il sostantivo neutro число («data/numero»), a differenza di какой in какой день visto prima.
  ru.a1.unit04.lesson02.teach.pervoe_tretye:
    title: первое, третье
    gloss: 1°, 3°
    note: Le date in ordinale prendono la desinenza neutra (-ое/-ье) per concordare con il sostantivo sottinteso число.
    example_gloss:
    - Oggi è il primo gennaio.
    - Oggi è il 3 gennaio.
  ru.a1.unit04.lesson02.teach.pyatoe_desyatoe:
    title: пятое, десятое
    gloss: 5°, 10°
    note: Stesso schema dell'ordinale neutro di первое/третье.
    example_gloss:
    - Oggi è il 5 ottobre.
    - Oggi è il 10 aprile.
  ru.a1.unit04.lesson02.teach.yanvar_aprel:
    title: января, апреля
    gloss: di gennaio, di aprile
    note: 'Dopo la data il nome del mese passa al genitivo: январь diventa января e апрель diventa апреля.'
    example_gloss:
    - Oggi è il 3 gennaio.
    - Oggi è il 10 aprile.
  ru.a1.unit04.lesson02.teach.oktyabrya:
    title: октября
    gloss: di ottobre
    note: Genitivo di октябрь, con lo stesso schema dopo la data di января/апреля.
    example_gloss: Oggi è il 5 ottobre.
  ru.a1.unit04.lesson03.teach.kakoe_segodnya_chislo:
    title: Какое сегодня число?
    gloss: Che data è oggi?
    note: È il modo standard per chiedere la data.
  ru.a1.unit04.lesson03.teach.vo_vtornik:
    title: во вторник
    gloss: martedì
    note: 'La preposizione в diventa во davanti a вторник per facilitare la pronuncia; вторник stesso qui non cambia forma (i giorni femminili invece cambiano: в среду, в пятницу, в субботу).'
  ru.a1.unit04.lesson03.teach.vstrecha:
    title: встреча
    gloss: riunione
    note: Sostantivo comune per una riunione o un appuntamento fissato.
    example_gloss: La riunione è martedì.
  ru.a1.unit04.lesson03.teach.anna_kakoy_den:
    title: Anna chiede che giorno è
    gloss: 'Anna: Che giorno è oggi?'
    note: Anna apre lo scambio con la domanda sul день vista nella lezione 1.
  ru.a1.unit04.lesson03.teach.viktor_sreda:
    title: Viktor risponde con giorno e data
    gloss: 'Viktor: Oggi è mercoledì 3 gennaio.'
    note: Viktor indica insieme il giorno della settimana e la data in ordinale, usando il mese al genitivo января.
  ru.a1.unit04.lesson03.teach.anna_khorosho:
    title: Anna propone martedì
    gloss: 'Anna: Bene. La riunione è martedì?'
    note: Хорошо prende atto della risposta di Viktor prima che Anna faccia la sua domanda.
  ru.a1.unit04.lesson03.teach.viktor_da:
    title: Viktor conferma la data
    gloss: 'Viktor: Sì, martedì 9 gennaio.'
    note: 'Да conferma, poi Viktor ripete giorno e data. Per dire IN quale data avviene qualcosa, anche l''ordinale va al genitivo: девятого января («il 9 gennaio»); confronta Сегодня девятое января («Oggi è il 9 gennaio»).'
