    title: L'uccellino di Nina
teaching:
  ru.a1.unit27.lesson01.teach.zhivotnoe_domashnee_zhivotnoe:
    title: Animale, animale domestico
    gloss: l'animale / un animale domestico
    note: '*Животное* è la parola generica per «animale». *Домашнее животное* (letteralmente «animale domestico») indica in particolare un animale da compagnia.'
    example_gloss:
    - Il cane è un animale.
    - Il cane è anche un animale domestico.
  ru.a1.unit27.lesson01.teach.sobaka_koshka:
    title: Cane e gatto
    gloss: il cane / il gatto
    example_gloss:
    - Nastya ha un cane.
    - Igor ha un gatto.
  ru.a1.unit27.lesson01.teach.ryba_ptitsa:
    title: Pesce e uccello
    gloss: il pesce / l'uccello
    example_gloss:
    - Il nonno ha un pesce.
    - Nina ha un uccellino.
  ru.a1.unit27.lesson01.teach.u_tebya_est:
    title: Hai un animale domestico?
    gloss: Hai un animale domestico?
    note: '*У тебя есть ...?* è la domanda per «hai ...?»: *у тебя* («presso di te») + *есть* + la cosa.'
  ru.a1.unit27.lesson01.teach.da_u_menya:
    title: Sì, ho un cane
    gloss: Sì, ho un cane.
    note: Una semplice risposta affermativa con il lessico nuovo di questa unità.
  ru.a1.unit27.lesson01.teach.net_u_menya:
    title: No, non ho un animale domestico
    gloss: No, non ho un animale domestico.
    note: '*Нет* + genitivo serve a dire che non hai qualcosa: *у меня нет домашнего животного*. Vedi la nota di grammatica.'
  ru.a1.unit27.lesson01.teach.posle_net_slovo:
    title: Нет + genitivo
    gloss: 'Dopo *нет* ciò che manca va al genitivo: *у меня нет времени*, *у меня нет домашнего животного*.'
    note: 'Confronta con la forma affermativa: *у меня есть собака* (nominativo) ma *у меня нет собаки* (genitivo).'
  ru.a1.unit27.lesson02.teach.gulyat_s_sobakoy:
    title: Portare a spasso (un animale)
    gloss: portare a spasso (un animale)
    note: '*Гулять с собакой* usa *с* più lo strumentale, *собакой*. Vedi la nota di grammatica.'
    example_gloss: Porto a spasso il cane ogni giorno.
  ru.a1.unit27.lesson02.teach.posle_s_slovo:
    title: С + strumentale
    gloss: 'Dopo *с* («con») il nome va allo strumentale: *гулять с собакой*, *играть с кошкой*.'
    note: 'Lo strumentale dei nomi femminili termina in *-ой* o *-ей*: *собакой*, *кошкой*.'
  ru.a1.unit27.lesson02.teach.kormit:
    title: Dare da mangiare
    gloss: dare da mangiare
    example_gloss: Do da mangiare al gatto ogni giorno.
  ru.a1.unit27.lesson02.teach.igrat_s:
    title: Giocare con
    gloss: giocare con
    example_gloss: Igor gioca con il suo gatto.
  ru.a1.unit27.lesson02.teach.ya_kazhdyy_den:
    title: Porto a spasso il cane ogni giorno
    gloss: Porto a spasso il cane ogni giorno.
    note: '*Каждый день* («ogni giorno») è un''espressione di tempo senza preposizione: *Я каждый день гуляю с собакой*.'
  ru.a1.unit27.lesson02.teach.ya_kazhdyy_den_2:
    title: Do da mangiare al gatto ogni giorno
    gloss: Do da mangiare al gatto ogni giorno.
    note: '*Кормить* vuole l''animale come complemento oggetto all''accusativo: *кошка* diventa *кошку*.'
  ru.a1.unit27.lesson03.teach.posle_lyubit_zhivotnoe:
    title: Gli animali dopo любить
    gloss: 'Dopo *любить* il nome di un animale è all''accusativo, che per i nomi animati coincide con il genitivo plurale: *собак*, *кошек*, *птиц*, *рыб*.'
    note: Il modello regolare del plurale russo, presentato qui per la prima volta con i nomi di animali come esempi.
  ru.a1.unit27.lesson03.teach.sobak_koshek:
    title: Cani e gatti
    gloss: cani / gatti
    example_gloss:
    - Dima ama i cani.
    - Lena ama i gatti.
  ru.a1.unit27.lesson03.teach.ryb_ptits:
    title: Pesci e uccelli (plurale)
    gloss: pesci / uccelli
    example_gloss:
    - Adoro i pesci.
    - Il nonno adora gli uccelli.
  ru.a1.unit27.lesson03.teach.ya_lyublyu_zhivotnykh:
    title: Adoro gli animali
    gloss: Adoro gli animali.
    note: '*Люблю* + accusativo: *Я люблю животных*. Per i nomi animati al plurale l''accusativo ha la stessa forma del genitivo.'
  ru.a1.unit27.lesson03.teach.lena_lyubit_koshek:
    title: Lena ama i gatti, ma non ha un animale domestico
    gloss: Lena ama i gatti, ma non ha un animale domestico.
    note: Prepara il contrasto su cui è costruita la lettura della lezione 5.
  ru.a1.unit27.lesson04.teach.dima_u_tebya:
    title: Dima chiede di un animale domestico
    gloss: 'Dima: Hai un animale domestico, Nastya?'
  ru.a1.unit27.lesson04.teach.nastya_da_u:
    title: Nastya ha un cane
    gloss: 'Nastya: Sì, ho un cane.'
  ru.a1.unit27.lesson04.teach.dima_kak_on:
    title: Dima chiede com'è
    gloss: 'Dima: Com''è?'
    note: La domanda *Как он выглядит?* vale anche per gli animali. *Он* («lui») si usa per un animale domestico maschio.
  ru.a1.unit27.lesson04.teach.nastya_u_nego:
    title: Nastya descrive il suo cane
    gloss: 'Nastya: Ha il pelo marrone ed è piccolo.'
    note: Riprende il lessico dei colori dei capelli e delle dimensioni dell'unità sull'aspetto fisico, ora per descrivere il pelo di un animale invece dei capelli di una persona.
  ru.a1.unit27.lesson04.teach.o_zhivotnom_mozhno:
    title: Он e она per gli animali
    gloss: 'Un animale domestico può essere *он* o *она*, come una persona: *У меня собака, он маленький*.'
    note: Grammaticalmente *собака* è femminile, ma i russi spesso dicono *он* quando sanno che l'animale è maschio.
  ru.a1.unit27.lesson04.teach.dima_ty_gulyaesh:
    title: Dima chiede delle passeggiate
    gloss: 'Dima: Lo porti a passeggio ogni giorno?'
  ru.a1.unit27.lesson04.teach.nastya_da_ya:
    title: Nastya descrive la sua routine
    gloss: 'Nastya: Sì, ogni giorno lo porto a passeggio e gli do da mangiare.'
  ru.a1.unit27.lesson05.teach.dima_i_lena:
    title: Dima, Lena e Igor parlano di animali
    gloss: 'Dima e Lena amano entrambi gli animali, ma nessuno dei due ha un animale domestico. Dima ama i cani e Lena ama i gatti. Igor invece ha un animale domestico: un gatto. Gioca spesso con il suo gatto e ogni giorno gli dà da mangiare. Tu hai un animale domestico?'
    note: 'Contrappone l''amare gli animali all''averne davvero uno: è lo scopo comunicativo dell''obiettivo.'
    glosses:
      любят: adorare / piacere molto
      оба: entrambi
      животных: animali
      обоих: entrambi
      домашнего: animale domestico
      собак: cani
      кошек: gatti
      кошка: gatto
      играет: gioca
      даёт: dà
      каждый: ogni / tutti
      корм: cibo
  ru.a1.unit27.lesson05.teach.igor_chasto_igraet:
    title: Igor gioca spesso con il suo gatto
    gloss: Igor gioca spesso con il suo gatto.
    note: '*Со своей кошкой*: *со* è *с* davanti a un gruppo di consonanti, e *своей* significa «proprio», e si riferisce al soggetto.'
  ru.a1.unit27.lesson05.teach.ya_lyublyu_sobak:
    title: Adoro i cani. Non ho un animale domestico.
    gloss: Adoro i cani. Non ho un animale domestico.
    note: Una risposta modello di due frasi, da riutilizzare per l'esercizio di scrittura dell'unità.
  ru.a1.unit27.lesson06.teach.nastya_nina_u:
    title: Nastya chiede a Nina
    gloss: 'Nastya: Nina, hai un animale domestico anche tu?'
  ru.a1.unit27.lesson06.teach.nina_da_u:
    title: Nina ha un uccellino di nome Pico
    gloss: 'Nina: Sì, ho un uccellino. Si chiama Pico.'
    note: '*Его зовут Пико* significa letteralmente «lo chiamano Pico». È così che in russo si dice il nome.'
  ru.a1.unit27.lesson06.teach.dima_kak_zdorovo:
    title: Dima reagisce
    gloss: 'Dima: Che bello! Cosa fai con lui ogni giorno?'
  ru.a1.unit27.lesson06.teach.nina_ya_kazhdyy:
    title: Nina gli dà da mangiare ogni giorno
    gloss: 'Nina: Gli do da mangiare ogni giorno.'
  ru.a1.unit27.lesson06.teach.dima_ya_tozhe:
    title: Anche Dima ama gli uccelli
    gloss: 'Dima: Anch''io amo gli uccelli.'
  ru.a1.unit27.lesson06.teach.nastya_kak_khorosho:
    title: Nastya conclude la conversazione
    gloss: 'Nastya: Che bello che a tutti e tre piacciano gli animali!'
    note: Chiude il cerchio sulle informazioni sugli animali dei tre personaggi di questa unità.
