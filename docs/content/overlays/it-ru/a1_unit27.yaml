course:
  title: Russo A1
  description: 'Russo per principianti per parlare di animali domestici e animali comuni: come chiamarli, le cure di base (portare a spasso, dare da mangiare, giocare), come dire quali animali ami anche senza averne uno, e il plurale regolare russo.'
