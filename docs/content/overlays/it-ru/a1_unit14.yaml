teaching:
  ru.a1.unit14.lesson01.teach.mne_nravitsya_kofe:
    title: Мне нравится кофе.
    gloss: Il caffè mi piace.
    note: мне нравится (letteralmente «a me piace») si forma con il pronome al dativo мне e нравится per esprimere ciò che ti piace.
  ru.a1.unit14.lesson01.teach.ne_nravitsya:
    title: не нравится
    gloss: non piace
    note: не («non») messo prima di нравится rende negativa la costruzione con cui si dice che qualcosa piace.
    example_gloss: Non mi piace il tè.
  ru.a1.unit14.lesson01.teach.chay:
    title: чай
    gloss: tè
    note: чай è la parola che significa «tè».
    example_gloss: Mi piace il tè.
  ru.a1.unit14.lesson02.teach.ya_hochu_chay:
    title: Я хочу чай.
    gloss: Voglio il tè.
    note: хочу («voglio») è la prima persona singolare del presente di хотеть e si usa con un complemento oggetto diretto per dire che cosa si vuole.
  ru.a1.unit14.lesson02.teach.ne_hochu:
    title: не хочу
    gloss: non voglio
    note: не хочу nega хочу e significa «non voglio».
    example_gloss: Non voglio il caffè.
  ru.a1.unit14.lesson02.teach.sok:
    title: сок
    gloss: succo
    note: сок è la parola che significa «succo».
    example_gloss: Voglio il succo.
  ru.a1.unit14.lesson03.teach.nastya_tebe_nravitsya:
    title: Nastja chiede a Dima se gli piace il caffè
    gloss: 'Nastja: Ti piace il caffè?'
    note: Настя inizia con Тебе нравится кофе?
  ru.a1.unit14.lesson03.teach.dima_da_mne_nravitsya:
    title: Dima risponde e rilancia la domanda
    gloss: 'Dima: Sì, mi piace il caffè. E a te?'
    note: Дима risponde Да, мне нравится кофе. А тебе?
  ru.a1.unit14.lesson03.teach.nastya_ne_nravitsya_hochu_chay:
    title: Nastja risponde e dice che cosa vuole
    gloss: 'Nastja: Non mi piace il caffè. Voglio il tè.'
