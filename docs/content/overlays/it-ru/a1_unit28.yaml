    gloss: Nastya pratica yoga due volte a settimana. Ama muoversi con calma. Lena non pratica yoga, ma ama nuotare. Lena nuota spesso, quasi ogni settimana. Che sport pratichi tu?
    note: 'Un breve testo che mette a confronto due sport e due frequenze: *два раза в неделю* e *почти каждую неделю*.'
