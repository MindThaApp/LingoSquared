  ru.a1.unit30.lesson01.teach.ya_kazhdyy_den:
    title: Uso il cellulare tutti i giorni
    gloss: Uso il cellulare ogni giorno.
    note: '*Каждый день* (ogni giorno) ritorna: *Я каждый день пользуюсь телефоном*. Dopo *пользоваться* l''oggetto usato va allo strumentale.'
  ru.a1.unit30.lesson02.teach.prilozhenie:
    title: L'app
    gloss: l'app
    example_gloss: Ho un'app per le previsioni del tempo.
  ru.a1.unit30.lesson02.teach.soobshchenie:
    title: Il messaggio
    gloss: il messaggio
    example_gloss: Mando un messaggio con l'app.
  ru.a1.unit30.lesson02.teach.prognoz_pogody_slovo:
    title: Прогноз погоды e сообщение
    gloss: '*Прогноз погоды* è formato da due parole, e la seconda, *погоды*, è al genitivo. *Сообщение* è un messaggio che si può mandare o leggere.'
    note: Collega la parola nuova al sostantivo composto già visto nell'unità sul tempo atmosferico.
  ru.a1.unit30.lesson02.teach.nastya_otpravlyaet_soobshchenie:
    title: Nastya manda un messaggio tramite l'app
    gloss: Nastya manda un messaggio tramite l'app.
    note: '*Отправляет* (manda) è un verbo regolare. Il messaggio è il complemento oggetto all''accusativo, e *через приложение* significa «tramite l''app».'
  ru.a1.unit30.lesson02.teach.dima_chitaet_soobshchenie:
    title: Dima legge il messaggio
    gloss: Dima legge il messaggio.
  ru.a1.unit30.lesson03.teach.iskat:
    title: Cercare
    gloss: cercare (informazioni)
    example_gloss: Cerco le previsioni del tempo.
  ru.a1.unit30.lesson03.teach.posle_polzovatsya_slovo:
    title: Пользоваться e искать
    gloss: '*Пользоваться* vuole lo strumentale (*пользоваться телефоном*), mentre *искать* vuole l''accusativo (*искать прогноз*).'
    note: 'Entrambi i verbi sono regolari: *я пользуюсь, ты пользуешься*; *я ищу, ты ищешь*.'
  ru.a1.unit30.lesson03.teach.igor_ishchet_prognoz:
    title: Igor cerca le previsioni del tempo
    gloss: Igor cerca le previsioni del tempo.
  ru.a1.unit30.lesson03.teach.potom_on_idyot:
    title: Poi va a correre
    gloss: Poi va a correre.
    note: '*Идёт бегать* significa «va a correre»: *идёт* è un verbo di movimento seguito dall''infinito di ciò che va a fare.'
  ru.a1.unit30.lesson04.teach.nastya_davay_v:
    title: Nastya propone
    gloss: 'Nastya: Facciamo sport sabato alle dieci?'
  ru.a1.unit30.lesson04.teach.dima_khoroshaya_ideya:
    title: Dima accetta
    gloss: 'Dima: Buona idea! Cerco le previsioni del tempo.'
    note: '*Хорошая идея* è un aggettivo femminile con un sostantivo femminile. *Поищу* è il futuro perfettivo, «cercherò».'
  ru.a1.unit30.lesson04.teach.dima_v_subbotu:
    title: Dima controlla il tempo
    gloss: 'Dima: Sabato c''è il sole!'
    note: '*Солнечно* è la parola per il tempo. Non serve il verbo «essere»: *В субботу солнечно*.'
  ru.a1.unit30.lesson04.teach.igor_ya_vizhu:
    title: Igor vede il messaggio
    gloss: 'Igor: Vedo il messaggio. A sabato!'
  ru.a1.unit30.lesson04.teach.ty_uzhe_znaesh:
    title: До + genitivo
    gloss: 'Conosci già *До свидания!* Puoi anche indicare un giorno: *До субботы!*, *До завтра!* Dopo *до* il nome va al genitivo.'
    note: Estende lo schema di saluto dell'unità sui saluti a un giorno preciso.
  ru.a1.unit30.lesson05.teach.nastya_kazhdyy_den:
    title: Chi usa cosa?
    gloss: Nastya telefona a Dima ogni giorno. Usa il telefono, non un'app. Dima a casa non ha il computer, ma usa internet sul telefono. Igor ogni mattina cerca le previsioni del tempo. Poi va a correre. Lena manda spesso un messaggio a Nastya. Anche tu usi il telefono ogni giorno?
    note: Confronta le abitudini dei quattro personaggi con i dispositivi, come la lettura di confronto dell'unità sullo sport.
    glosses:
      звонит: chiama
      каждый: ogni / tutti
      день: giorno
      пользуется: usa
      телефоном: cellulare
      приложением: app
      компьютера: computer
      дома: a casa
      интернетом: internet
      ищет: cerca
      утро: mattina
      прогноз: previsioni del tempo
      идёт: va
      бегать: correre
      отправляет: manda
      часто: spesso
      сообщение: messaggio
      пользуешься: uso
  ru.a1.unit30.lesson05.teach.igor_kazhdoe_utro:
    title: Igor cerca le previsioni ogni mattina
    gloss: Igor ogni mattina cerca le previsioni del tempo.
  ru.a1.unit30.lesson05.teach.lena_chasto_otpravlyaet:
    title: Lena scrive spesso a Nastya
    gloss: Lena manda spesso un messaggio a Nastya.
  ru.a1.unit30.lesson06.teach.nastya_ya_vizhu:
    title: Nastya conferma il programma
    gloss: 'Nastya: Vedo il messaggio. Facciamo sport sabato alle dieci al parco?'
  ru.a1.unit30.lesson06.teach.dima_da_i:
    title: Dima conferma il tempo
    gloss: 'Dima: Sì, e sabato c''è il sole!'
  ru.a1.unit30.lesson06.teach.igor_ya_togda:
    title: Il programma di Igor
    gloss: 'Igor: Allora io correrò un po''. Poi giocherò anche a calcio.'
    note: '*Потом* (poi) mette il secondo programma dopo il primo, e *побегаю* è perfettivo: «correrò per un po''».'
  ru.a1.unit30.lesson06.teach.lena_ya_luchshe:
    title: Il programma di Lena
    gloss: 'Lena: Preferisco nuotare, ma vengo anch''io al parco.'
    note: '*Я лучше поплаваю* significa «preferisco nuotare». *Лучше* prima del verbo esprime preferenza.'
  ru.a1.unit30.lesson06.teach.nastya_zdorovo_do:
    title: Nastya chiude la conversazione
    gloss: 'Nastya: Fantastico! A sabato al parco!'
    note: Chiude in una sola battuta la conversazione di questa unità e il programma dell'unità sullo sport.
