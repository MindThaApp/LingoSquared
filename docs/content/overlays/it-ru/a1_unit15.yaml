teaching:
  ru.a1.unit15.lesson01.teach.kofe_luchshe_chem_chay:
    title: Кофе лучше, чем чай.
    gloss: Il caffè è meglio del tè.
    note: лучше («meglio») più чем («di», «che») forma il comparativo di base.
  ru.a1.unit15.lesson01.teach.huzhe:
    title: хуже
    gloss: peggio / peggiore
    note: хуже («peggio») è il comparativo opposto di лучше e si usa allo stesso modo con чем.
    example_gloss: Il tè è peggio del caffè.
  ru.a1.unit15.lesson01.teach.kakoy:
    title: какой / какое
    gloss: quale / che tipo di
    note: какой (maschile) e какое (neutro) chiedono quale tra due cose e concordano nel genere con il nome.
    example_gloss: Quale caffè è migliore?
  ru.a1.unit15.lesson02.teach.eto_kafe_bolshe:
    title: Это кафе больше, чем то.
    gloss: Questo bar è più grande di quello.
    note: больше («più grande», «di più») più чем forma un comparativo di dimensione; это/то («questo»/«quello») indicano i due bar.
  ru.a1.unit15.lesson02.teach.menshe:
    title: меньше
    gloss: più piccolo / di meno
    note: меньше («più piccolo», «di meno») è il comparativo opposto di больше.
    example_gloss: Quel bar è più piccolo di questo.
  ru.a1.unit15.lesson02.teach.dom:
    title: дом
    gloss: casa
    note: дом («casa») con этот/тот («questo»/«quello») permette di confrontare la grandezza di due case.
    example_gloss: Questa casa è più grande di quella.
  ru.a1.unit15.lesson03.teach.nastya_kakoye_kafe_luchshe:
    title: Nastya chiede quale bar è migliore
    gloss: 'Nastya: Quale bar è migliore?'
    note: Настя inizia con Какое кафе лучше?
  ru.a1.unit15.lesson03.teach.dima_eto_kafe_luchshe:
    title: Dima risponde
    gloss: 'Dima: Questo bar è migliore di quello.'
    note: Дима risponde Это кафе лучше, чем то.
  ru.a1.unit15.lesson03.teach.nastya_a_bolshe:
    title: Nastya chiede della grandezza, Dima conferma
    gloss: 'Nastya: E questo bar è più grande? Dima: Sì, questo bar è più grande di quello.'
    note: Настя chiede А это кафе больше? e Дима conferma Да, это кафе больше, чем то.
