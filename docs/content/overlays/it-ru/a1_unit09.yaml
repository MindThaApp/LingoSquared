    title: Viktor elenca tre luoghi
    gloss: 'Viktor: Nella mia strada c''è un negozio, una biblioteca e una banca.'
    note: На моей улице есть introduce un elenco con есть ("c'è/ci sono"), con gli elementi uniti da и.
