    title: ресторан, библиотека
    gloss: ristorante, biblioteca
    note: ресторан è maschile e библиотека è femminile; i nomi di strade come Чайковского e Пушкина stanno al genitivo dopo улица.
    example_gloss:
    - Dove si trova il ristorante?
    - Dove si trova la biblioteca?
  ru.a1.unit09.lesson03.teach.chto_est_na_vashey_ulitse:
