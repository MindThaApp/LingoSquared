teaching:
  ru.a1.unit02.lesson01.teach.kak_vas_zovut:
    title: Как вас зовут?, Как тебя зовут?
    gloss: Come si chiama? (formale); Come ti chiami? (informale)
    note: Как вас зовут? usa il formale вас e si usa con gli sconosciuti o in contesti di cortesia. Как тебя зовут? usa l'informale тебя, che si usa con amici, bambini e coetanei.
    example_gloss:
    - Buongiorno! Come si chiama?
    - Ciao! Come ti chiami?
  ru.a1.unit02.lesson01.teach.menya_zovut:
    title: Меня зовут Виктор.
    gloss: Mi chiamo Viktor.
    note: Меня зовут (letteralmente «mi chiamano») è il modo standard di dire il proprio nome in russo, in qualsiasi registro.
  ru.a1.unit02.lesson01.teach.menya_zovut_anna:
    title: Меня зовут Анна.
    gloss: Mi chiamo Anna.
    note: 'Lo stesso schema, Меня зовут ..., con un altro nome: la frase non cambia in base al genere di chi parla.'
  ru.a1.unit02.lesson01.teach.register_note:
    title: Scegliere la domanda giusta
    gloss: Как вас зовут? è la forma di cortesia, per gli sconosciuti. Как тебя зовут? è per amici, bambini e coetanei.
    note: 'La distinzione formale/informale rispecchia quella tra вы e ты, che si vede per intero nella lezione 2: вас e тебя sono le forme di caso oggetto di вы e ты.'
  ru.a1.unit02.lesson02.teach.vy_ty:
    title: вы, ты
    gloss: Lei / voi (formale); tu (informale)
    note: 'Come in italiano con tu e Lei, il russo distingue due forme: вы si usa con sconosciuti, persone anziane e in ambito professionale; ты con amici, familiari e bambini.'
    example_gloss:
    - Di dov'è? (formale)
    - Di dove sei? (informale)
  ru.a1.unit02.lesson02.teach.vy_ty_rule:
    title: Quando usare l'uno o l'altro
    gloss: 'Вы è formale: con sconosciuti, al lavoro, con le persone anziane. Ты è informale: con amici, familiari, bambini.'
    note: 'Usare ты con chi si aspetta вы può sembrare troppo confidenziale o persino scortese: nel dubbio, comincia con вы.'
  ru.a1.unit02.lesson02.teach.mozhno_na_ty:
    title: Можно на ты?
    gloss: Possiamo darci del tu?
    note: Un modo cortese per proporre di passare dal вы formale al ты informale, quando il rapporto è abbastanza amichevole.
  ru.a1.unit02.lesson02.teach.davayte_pereydyom:
    title: Давайте перейдём на ты.
    gloss: Passiamo al tu.
    note: Un modo un po' più diretto e invitante di proporre lo stesso passaggio di registro di Можно на ты?
  ru.a1.unit02.lesson02.teach.otkuda_vy:
    title: Откуда вы?
    gloss: Di dove è? (formale)
    note: Usa il вы formale, in linea con il registro di un primo incontro o di un contesto professionale.
  ru.a1.unit02.lesson02.teach.otkuda_ty:
    title: Откуда ты?
    gloss: Di dove sei? (informale)
    note: La controparte informale, usata con una persona che conosci già bene.
  ru.a1.unit02.lesson02.teach.ya_iz_kanady:
    title: Я из Канады.
    gloss: Sono del Canada.
    note: 'Из («da») vuole il genitivo, quindi Канада diventa Канады: vale la pena notare questo schema del genitivo di provenienza, anche se la grammatica completa dei casi arriverà più avanti.'
  ru.a1.unit02.lesson02.teach.ya_iz_moskvy:
    title: Я из Москвы.
    gloss: Sono di Mosca.
    note: 'Lo stesso schema del genitivo di provenienza di Я из Канады: Москва diventa Москвы dopo из.'
  ru.a1.unit02.lesson03.teach.davayte_poznakomimsya:
    title: Давайте познакомимся.
    gloss: Facciamo conoscenza.
    note: Un modo cortese e comune per aprire una presentazione tra persone che si incontrano per la prima volta.
  ru.a1.unit02.lesson03.teach.ochen_priyatno:
    title: Очень приятно
    gloss: piacere
    note: Una risposta standard e cortese dopo che qualcuno ha appena detto il proprio nome.
    example_gloss: Mi chiamo John. — Piacere.
  ru.a1.unit02.lesson03.teach.irina_greeting:
    title: Irina Petrovna apre la presentazione
    gloss: 'Irina Petrovna dice: Buongiorno! Facciamo conoscenza. Mi chiamo Irina Petrovna.'
    note: Irina Petrovna incontra John per la prima volta in un ufficio, in un contesto formale, perciò usa il cortese Здравствуйте e il registro del вы per tutto il dialogo.
  ru.a1.unit02.lesson03.teach.john_reply:
    title: John risponde con il suo nome
    gloss: 'John dice: Piacere. Mi chiamo John.'
    note: John si adegua al registro formale e cortese di Irina Petrovna con Очень приятно.
  ru.a1.unit02.lesson03.teach.irina_question:
    title: Irina Petrovna chiede a John di dov'è
    gloss: 'Irina Petrovna chiede: Di dov''è, John?'
    note: Usa il formale Откуда вы, in linea con il contesto d'ufficio.
  ru.a1.unit02.lesson03.teach.john_answer:
    title: John risponde e a sua volta chiede
    gloss: 'John dice: Sono del Canada. E Lei di dov''è?'
    note: John dice da dove viene e rimanda con cortesia la domanda con А вы откуда?
  ru.a1.unit02.lesson03.teach.irina_answer:
    title: Irina Petrovna risponde
    gloss: 'Irina Petrovna dice: Sono di Mosca.'
    note: Conclude lo scambio, con lo stesso schema del genitivo di provenienza visto nella lezione 2.
