teaching:
  ru.a1.unit06.lesson01.teach.u_menya_est:
    title: У меня есть ...
    gloss: Ho ...
    note: 'Letteralmente «presso di me (c''è)...»: è il modo standard in russo per dire «ho». Nell''unità 3 У меня два брата usava lo stesso schema У меня; есть di solito si omette quando si dice quanti ne hai.'
  ru.a1.unit06.lesson01.teach.eto:
    title: Это ...
    gloss: Questo è ... / Questa è ...
    note: Это si usa per presentare o indicare una persona o una cosa, qualunque sia il genere grammaticale.
  ru.a1.unit06.lesson01.teach.mat_otets:
    title: мать, отец
    gloss: madre, padre
    note: мать fa parte del piccolo gruppo di nomi femminili russi che terminano in segno debole (-ь).
    example_gloss:
    - Questa è mia madre.
    - Questo è mio padre.
  ru.a1.unit06.lesson01.teach.brat_sestra:
    title: брат, сестра
    gloss: fratello, sorella
    note: брат è la parola con cui hai già contato nell'unità 3 («У меня два брата»); сестра ne è il corrispondente femminile.
    example_gloss:
    - Questo è mio fratello.
    - Ho una sorella.
  ru.a1.unit06.lesson01.teach.moy_moya:
    title: мой, моя
    gloss: mio (maschile), mia (femminile)
    note: мой si usa con i nomi maschili come отец e брат; моя con i nomi femminili come мать e сестра.
  ru.a1.unit06.lesson02.teach.babushka_dedushka:
    title: бабушка, дедушка
    gloss: nonna, nonno
    note: 'Entrambe finiscono in -а, ma дедушка indica un uomo ed è maschile per la concordanza: мой дедушка, ma моя бабушка.'
    example_gloss:
    - Questa è mia nonna.
    - Questo è mio nonno.
  ru.a1.unit06.lesson02.teach.muzh_zhena:
    title: муж, жена
    gloss: marito, moglie
    note: муж è maschile e жена è femminile, secondo il normale schema delle desinenze di genere.
    example_gloss:
    - Questo è mio marito.
    - Questa è mia moglie.
  ru.a1.unit06.lesson02.teach.syn_doch:
    title: сын, дочь
    gloss: figlio, figlia
    note: дочь, come мать, è un nome femminile che termina in segno debole (-ь).
    example_gloss: Ho un figlio e una figlia.
  ru.a1.unit06.lesson02.teach.deti:
    title: дети
    gloss: figli
    note: 'дети è il plurale irregolare di ребёнок («bambino»): singolare e plurale sono due parole completamente diverse.'
    example_gloss: Ha figli?
  ru.a1.unit06.lesson02.teach.u_vas_est:
    title: У вас есть ...?
    gloss: Ha ...? (formale)
    note: Usa il вас di cortesia, in linea con il registro вы dell'unità 2.
  ru.a1.unit06.lesson03.teach.kto_eto:
    title: Кто это?
    gloss: Chi è?
    note: Il modo standard per chiedere chi è una persona, per esempio guardando una foto.
  ru.a1.unit06.lesson03.teach.eyo_zovut:
    title: Её зовут Анна.
    gloss: Si chiama Anna.
    note: 'Letteralmente «la chiamano Anna»: Её («la, lei») è il complemento oggetto del verbo зовут, non il soggetto.'
  ru.a1.unit06.lesson03.teach.maksim_kto_eto:
    title: Maksim chiede della foto
    gloss: 'Maksim: Chi è questo nella foto?'
    note: Maksim comincia indicando la foto e chiedendo Кто это на фото?
  ru.a1.unit06.lesson03.teach.olga_moya_semya:
    title: Olga presenta la sua famiglia
    gloss: 'Olga: Questa è la mia famiglia.'
    note: Это моя семья contiene семья («famiglia»), un nome femminile, perciò моя concorda con esso.
  ru.a1.unit06.lesson03.teach.olga_vot_otets:
    title: Olga nomina tre familiari
    gloss: 'Olga: Ecco mio padre, mia madre e mio fratello.'
    note: Вот («ecco») introduce l'elenco; ogni possessivo (мой/моя) concorda con il nome che segue.
  ru.a1.unit06.lesson03.teach.maksim_a_kto_devochka:
    title: Maksim chiede della ragazzina
    gloss: 'Maksim: E quella bambina chi è?'
    note: А introduce con naturalezza la domanda successiva di Maksim su una quarta persona nella foto.
  ru.a1.unit06.lesson03.teach.olga_eto_moya_doch:
    title: Olga dice chi è sua figlia
    gloss: 'Olga: Questa è mia figlia. Si chiama Anna.'
    note: Olga risponde con моя дочь e poi dice il nome con Её зовут Анна.
