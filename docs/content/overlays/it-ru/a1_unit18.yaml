teaching:
  ru.a1.unit18.lesson01.teach.eto_moya_kvartira:
    title: Это моя квартира.
    gloss: Questo è il mio appartamento.
    note: Это significa «questo è»; моя («mia», femminile) concorda con il nome femminile квартира («appartamento»).
  ru.a1.unit18.lesson01.teach.kuhnya:
    title: кухня
    gloss: cucina
    note: кухня significa «cucina». стол significa «tavolo».
    example_gloss: In cucina c'è un tavolo.
  ru.a1.unit18.lesson01.teach.spalnya:
    title: спальня
    gloss: camera da letto
    note: спальня significa «camera da letto». кровать significa «letto».
    example_gloss: In camera da letto c'è un letto.
  ru.a1.unit18.lesson02.teach.divan_v_gostinoy:
    title: Диван в гостиной.
    gloss: Il divano è in soggiorno.
    note: диван significa «divano»; гостиная significa «soggiorno» (гостиной è la sua forma del prepositivo dopo в, «in»).
  ru.a1.unit18.lesson02.teach.stol_na_kuhne:
    title: на
    gloss: su / in
    note: на si usa con кухня (alla lettera «su la cucina», in italiano «in cucina») al posto di в, a differenza della maggior parte delle stanze.
    example_gloss: Il tavolo è in cucina.
  ru.a1.unit18.lesson02.teach.vannaya:
    title: ванная
    gloss: bagno
    note: ванная significa «bagno».
    example_gloss: Il bagno è accanto alla camera da letto.
  ru.a1.unit18.lesson03.teach.dima_gde_ty_zhivyosh:
    title: Dima chiede a Nastja dove abita
    gloss: 'Dima: Nastja, dove abiti?'
    note: Дима comincia con Настя, где ты живёшь?
  ru.a1.unit18.lesson03.teach.nastya_zhivu_v_kvartire:
    title: Nastja dice dove abita
    gloss: 'Nastja: Abito in un appartamento.'
    note: Настя risponde Я живу в квартире; живу è la forma di «io» di жить («vivere, abitare»), e в квартире è il prepositivo di квартира.
  ru.a1.unit18.lesson03.teach.dima_skolko_komnat:
    title: Dima chiede quante stanze ci sono
    gloss: 'Dima: Quante stanze ci sono nell''appartamento?'
    note: 'Сколько («quanti») è seguito dal genitivo plurale: сколько комнат.'
  ru.a1.unit18.lesson03.teach.nastya_dve_komnaty:
    title: Nastja elenca le stanze
    gloss: 'Nastja: Due stanze: una camera da letto e un soggiorno. Ci sono anche una cucina e un bagno.'
    note: 'Настя continua con Две комнаты: спальня и гостиная. Кухня и ванная тоже есть.'
