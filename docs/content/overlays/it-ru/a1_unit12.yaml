teaching:
  ru.a1.unit12.lesson01.teach.davay:
    title: Давай пойдём...
    gloss: Andiamo...
    note: Давай è un segnale informale di proposta («dai, facciamo»); пойдём è la forma di «noi» del futuro di «andare». Insieme servono a proporre un'attività.
  ru.a1.unit12.lesson01.teach.kino:
    title: кино
    gloss: il cinema
    note: кино è un sostantivo neutro indeclinabile che significa «cinema».
    example_gloss: Andiamo al cinema.
  ru.a1.unit12.lesson01.teach.zavtra_subbotu:
    title: завтра, в субботу
    gloss: domani, sabato
    note: завтра significa «domani»; в субботу usa в + accusativo per un giorno della settimana.
    example_gloss: Andiamo al cinema domani.
  ru.a1.unit12.lesson02.teach.soglasen:
    title: Хорошо, я согласен.
    gloss: Va bene, sono d'accordo.
    note: согласен («d'accordo») lo dice un uomo; una donna direbbe согласна.
  ru.a1.unit12.lesson02.teach.ne_mogu:
    title: К сожалению, я не могу.
    gloss: Purtroppo non posso.
    note: К сожалению («purtroppo») attenua un rifiuto; не могу significa «non posso».
  ru.a1.unit12.lesson02.teach.vo_skolko:
    title: Во сколько мы встретимся?
    gloss: A che ora ci vediamo?
    note: Во сколько chiede l'ora; встретимся è la forma di «noi» del futuro di «incontrarsi».
    example_gloss: Facciamo alle sette.
  ru.a1.unit12.lesson03.teach.nastya_davay_poydyom:
    title: Nastya propone un programma
    gloss: 'Nastya: Andiamo al cinema sabato.'
    note: Настя inizia con Давай пойдём в кино в субботу.
  ru.a1.unit12.lesson03.teach.dima_horosho_soglasen:
    title: Dima accetta e chiede l'orario
    gloss: 'Dima: Va bene, sono d''accordo. A che ora ci vediamo?'
    note: Дима accetta, poi chiede Во сколько мы встретимся?
  ru.a1.unit12.lesson03.teach.nastya_davay_v_sem:
    title: Nastya propone l'ora e il luogo
    gloss: 'Nastya: Facciamo alle sette, davanti al cinema.'
    note: у кинотеатра significa «presso/davanti al cinema» e usa у + genitivo.
  ru.a1.unit12.lesson03.teach.dima_otlichno:
    title: Dima conferma
    gloss: 'Dima: Perfetto, a sabato.'
    note: Отлично, до субботы chiude lo scambio; до субботы significa letteralmente «fino a sabato».
