teaching:
  ru.a1.unit07.lesson01.teach.menyu:
    title: меню
    gloss: menù
    note: 'меню è un nome neutro indeclinabile, preso in prestito dal francese: non cambia mai forma.'
    example_gloss: Ecco il menù.
  ru.a1.unit07.lesson01.teach.ofitsiant:
    title: официант, официантка
    gloss: cameriere, cameriera
    note: официант è maschile e официантка è femminile, secondo il normale schema delle desinenze di genere.
    example_gloss: La cameriera lavora in un ristorante.
  ru.a1.unit07.lesson01.teach.stol_svoboden:
    title: Этот столик свободен?
    gloss: Questo tavolo è libero?
    note: столик è un diminutivo di стол («tavolo») usato comunemente per il tavolo di un ristorante; свободен («libero») concorda con il nome maschile.
  ru.a1.unit07.lesson01.teach.da_saditites:
    title: Да, садитесь, пожалуйста.
    gloss: Sì, prego, si accomodi.
    note: садитесь è l'imperativo di cortesia/plurale di садиться («sedersi»), usato con вы.
  ru.a1.unit07.lesson01.teach.chto_budete_zakazyvat:
    title: Что будете заказывать?
    gloss: Che cosa ordinate?
    note: будете заказывать è una forma di futuro («ordinerete») che il cameriere usa per chiedere al cliente che cosa desidera.
  ru.a1.unit07.lesson02.teach.ya_khochu:
    title: Я хочу ...
    gloss: Voglio ...
    note: хочу è la prima persona singolare di хотеть («volere»), usata per ordinare cibo e bevande.
  ru.a1.unit07.lesson02.teach.chay_kofe:
    title: чай, кофе
    gloss: tè, caffè
    note: Sia чай sia кофе sono bevande che si ordinano spesso; кофе è indeclinabile e grammaticalmente maschile, nonostante la desinenza in -е.
    example_gloss:
    - Voglio il tè.
    - Voglio il caffè.
  ru.a1.unit07.lesson02.teach.khleb_borshch:
    title: хлеб, борщ
    gloss: pane, borsč (zuppa di barbabietola)
    note: борщ è la classica zuppa russa di barbabietola; entrambi i nomi sono maschili.
    example_gloss:
    - Avete del pane?
    - Voglio il borsč.
  ru.a1.unit07.lesson02.teach.salat:
    title: салат
    gloss: insalata
    note: и («e») qui unisce due piatti ordinati, come in борщ и салат.
    example_gloss: Voglio il borsč e l'insalata.
  ru.a1.unit07.lesson03.teach.morozhenoe:
    title: мороженое
    gloss: gelato
    note: мороженое è un nome neutro che ha l'aspetto di un aggettivo («[cosa] congelata»), schema frequente nei nomi russi di cibi.
    example_gloss: Come dolce, portate un gelato.
  ru.a1.unit07.lesson03.teach.prinesite:
    title: Принесите, пожалуйста, ...
    gloss: Per favore, portate ...
    note: Принесите è l'imperativo di cortesia/plurale di принести («portare»), usato con вы.
  ru.a1.unit07.lesson03.teach.spasibo:
    title: Спасибо.
    gloss: Grazie.
    note: Спасибо è il modo standard per dire grazie in qualsiasi scambio cortese.
  ru.a1.unit07.lesson03.teach.ofitsiantka_chto_budete:
    title: La cameriera chiede che cosa ordinare
    gloss: 'Cameriera: Che cosa ordinate?'
    note: La cameriera comincia chiedendo Что будете заказывать?
  ru.a1.unit07.lesson03.teach.turist_ya_khochu_borshch:
    title: Il turista ordina da mangiare
    gloss: 'Turista: Voglio il borsč e l''insalata.'
    note: Турист («turista») risponde con Я хочу борщ и салат.
  ru.a1.unit07.lesson03.teach.ofitsiantka_chto_pit:
    title: La cameriera chiede delle bevande
    gloss: 'Cameriera: Che cosa bevete?'
    note: пить («bere») si abbina a будете, come nella domanda precedente con заказывать.
  ru.a1.unit07.lesson03.teach.turist_ya_khochu_chay:
    title: Il turista ordina una bevanda
    gloss: 'Turista: Voglio il tè.'
    note: Il turista risponde semplicemente con Я хочу чай.
  ru.a1.unit07.lesson03.teach.ofitsiantka_a_na_sladkoe:
    title: La cameriera chiede del dolce
    gloss: 'Cameriera: E come dolce?'
    note: 'А на сладкое? è una domanda breve di seguito: «e per il dolce?»'
  ru.a1.unit07.lesson03.teach.turist_na_sladkoe:
    title: Il turista ordina il dolce
    gloss: 'Turista: Come dolce, per favore, portate un gelato.'
    note: Il turista risponde con На сладкое принесите мороженое, пожалуйста.
  ru.a1.unit07.lesson03.teach.ofitsiantka_khorosho:
    title: La cameriera conferma l'ordine
    gloss: 'Cameriera: Bene. Grazie.'
    note: Хорошо («bene, va bene») conferma l'ordine, e Спасибо chiude cortesemente lo scambio.
