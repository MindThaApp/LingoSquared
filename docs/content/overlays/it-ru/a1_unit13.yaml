teaching:
  ru.a1.unit13.lesson01.teach.vchera_byl:
    title: Вчера я был дома.
    gloss: Ieri ero a casa.
    note: вчера significa «ieri»; был è il passato maschile di «essere», usato da chi parla se è un uomo.
  ru.a1.unit13.lesson01.teach.byla:
    title: была
    gloss: ero / sono stata (detto da una donna)
    note: 'была è il passato femminile di «essere»: il verbo concorda con il genere del soggetto.'
    example_gloss: Ieri lei era a casa.
  ru.a1.unit13.lesson01.teach.vecherom:
    title: вечером
    gloss: la sera
    note: вечером significa «di sera» e serve a precisare quando è avvenuto un fatto passato.
    example_gloss: Ieri sera ero a casa.
  ru.a1.unit13.lesson02.teach.hodil_v_kino:
    title: Вчера я ходил в кино.
    gloss: Ieri sono andato al cinema.
    note: ходил (maschile) è il passato di «andare a piedi», usato per un'andata e ritorno già conclusi.
  ru.a1.unit13.lesson02.teach.hodila:
    title: ходила
    gloss: sono andata (detto da una donna)
    note: ходила è la forma femminile del passato di «andare a piedi».
    example_gloss: Ieri lei è andata al cinema.
  ru.a1.unit13.lesson02.teach.smotrel_film:
    title: смотрел фильм
    gloss: ho guardato un film
    note: смотрел (maschile) / смотрела (femminile) è il passato di «guardare»; фильм significa «film».
    example_gloss: Ho guardato un film.
  ru.a1.unit13.lesson03.teach.nastya_chto_ty_delal:
    title: Nastya chiede a Dima cosa ha fatto
    gloss: 'Nastya: Cosa hai fatto ieri?'
    note: Настя inizia con Что ты делал вчера?
  ru.a1.unit13.lesson03.teach.dima_hodil_smotrel:
    title: Dima risponde e chiede a sua volta
    gloss: 'Dima: Sono andato al cinema. Ho guardato un bel film. E tu?'
    note: Дима risponde Я ходил в кино. Смотрел хороший фильм. А ты?
  ru.a1.unit13.lesson03.teach.nastya_byla_otdyhala:
    title: Nastya risponde
    gloss: 'Nastya: Sono stata a casa. Mi sono riposata.'
    note: Настя conclude con Я была дома. Отдыхала.
