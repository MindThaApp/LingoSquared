course:
  title: Russo A1
  description: 'Russo per principianti per descrivere l''aspetto fisico di una persona: altezza e impressione dell''età, colore di capelli e occhi, la domanda fondamentale Как ты выглядишь? e il confronto tra l''aspetto di due persone.'
units:
  ru.a1.unit26.appearance:
    title: Descrivere l'aspetto
lessons:
  ru.a1.unit26.lesson01.vysokiy_nevysokiy_staryy_i:
    title: Alto, basso, anziano e giovane
  ru.a1.unit26.lesson02.opisyvaem_volosy:
    title: Descrivere i capelli
  ru.a1.unit26.lesson03.glaza_i_kak_vyglyadit:
    title: Gli occhi e «Com'è?»
  ru.a1.unit26.lesson04.nastya_opisyvaet_ninu:
    title: Nastya descrive Nina
  ru.a1.unit26.lesson05.sravnivaem_igorya_i_lenu:
    title: Confronto tra Igor e Lena
  ru.a1.unit26.lesson06.dima_uznayot_ninu:
    title: Dima riconosce Nina
teaching:
  ru.a1.unit26.lesson01.teach.vysokiy_nevysokiy:
    title: Alto e basso
    gloss: alto / basso
    note: '*Высокий* descrive una persona alta e *невысокий* una persona bassa (letteralmente «non alto»). La desinenza cambia col genere: *высокая*, *невысокая*.'
    example_gloss:
    - Lena è alta.
    - Igor è basso.
  ru.a1.unit26.lesson01.teach.staryy_molodoy:
    title: Anziano e giovane
    gloss: anziano / giovane
    note: Qui *старый* e *молодой* esprimono un'impressione generale dell'età, non un numero preciso di anni.
    example_gloss:
    - Il nonno è anziano.
    - Dima è giovane.
  ru.a1.unit26.lesson01.teach.prilagatelnoe_menyaetsya_po:
    title: Gli aggettivi cambiano col genere
    gloss: 'L''aggettivo concorda con la persona: *он высокий, она высокая*; *он старый, она старая*.'
    note: Gli aggettivi maschili terminano in *-ый*, *-ий* o *-ой* (*высокий*, *молодой*); quelli femminili in *-ая* (*высокая*, *молодая*).
  ru.a1.unit26.lesson01.teach.lena_vysokaya_a:
    title: Lena è alta e Igor è basso
    gloss: Lena è alta e Igor è basso.
    note: 'Due affermazioni sono messe a confronto con *а* (mentre, invece): *Лена высокая, а Игорь невысокий*.'
  ru.a1.unit26.lesson02.teach.volosy:
    title: I capelli
    gloss: i capelli
    note: 'In russo *волосы* (i capelli) è sempre plurale: *У Насти светлые волосы*, mai un sostantivo singolare.'
    example_gloss: Dima ha i capelli corti e neri.
  ru.a1.unit26.lesson02.teach.svetlye_kashtanovye_sedye:
    title: Biondo, castano e grigio
    gloss: biondo / castano / grigio
    note: 'Tre colori di capelli al plurale, per concordare con *волосы*: *светлые*, *каштановые*, *седые*.'
    example_gloss:
    - Nastya ha i capelli biondi.
    - Igor ha i capelli castani.
    - Il nonno ha i capelli grigi.
  ru.a1.unit26.lesson02.teach.dlinnye_korotkie:
    title: Lunghi e corti (capelli)
    gloss: lungo / corto (capelli)
    note: Anche *длинные* (lunghi) e *короткие* (corti) concordano con il plurale *волосы*.
    example_gloss:
    - Lena ha i capelli lunghi.
    - Igor ha i capelli corti.
  ru.a1.unit26.lesson02.teach.volosy_stoyat_vo:
    title: Gli aggettivi concordano con волосы
    gloss: '*Волосы* è plurale, quindi anche l''aggettivo è plurale: *длинные волосы*, *короткие волосы*, *светлые волосы*, *чёрные волосы*.'
    note: Gli aggettivi plurali terminano in *-ые* o *-ие*. Nella prossima lezione troverai la stessa desinenza con *глаза*.
  ru.a1.unit26.lesson02.teach.posle_u_imya:
    title: У con il genitivo
    gloss: 'Dopo *у* il possessore è al genitivo: *у Насти* (Nastya ha), *у Димы* (Dima ha), *у неё* (lei ha).'
    note: 'Così il russo esprime il possesso: *у* + genitivo + la cosa posseduta. Non si usa un verbo «avere».'
  ru.a1.unit26.lesson02.teach.u_dimy_korotkie:
    title: Dima ha i capelli corti e neri
    gloss: Dima ha i capelli corti e neri.
    note: '*Чёрные* (neri) concorda con il plurale *волосы*. In questo corso la lettera *ё* si scrive sempre.'
  ru.a1.unit26.lesson02.teach.u_nasti_dlinnye:
    title: Nastya ha i capelli lunghi e biondi
    gloss: Nastya ha i capelli lunghi e biondi.
    note: Unisce in un'unica frase naturale il lessico di lunghezza e colore di questa lezione.
  ru.a1.unit26.lesson03.teach.glaza:
    title: Gli occhi
    gloss: gli occhi
    note: '*Глаза* (occhi) è il plurale di *глаз*; la desinenza del plurale è *-а*.'
    example_gloss: Dima ha gli occhi castani.
  ru.a1.unit26.lesson03.teach.golubye_karie_zelyonye:
    title: Azzurro, marrone e verde
    gloss: azzurro / marrone / verde
    note: '*Голубые* significa azzurri, *карие* significa castani e si usa solo per gli occhi, *зелёные* significa verdi. Tutti e tre sono al plurale.'
    example_gloss:
    - Nastya ha gli occhi azzurri.
    - Igor ha gli occhi castani.
    - Lena ha gli occhi verdi.
  ru.a1.unit26.lesson03.teach.glaza_stoyat_vo:
    title: Gli aggettivi concordano con глаза
    gloss: '*Глаза* è plurale, quindi anche l''aggettivo è plurale: *голубые глаза*, *карие глаза*, *зелёные глаза*.'
    note: 'Gli occhi castani sono *карие*, non *коричневые*, e i capelli castani sono *каштановые*: il russo usa parole diverse per occhi e capelli.'
  ru.a1.unit26.lesson03.teach.kak_vyglyadit_nastya:
    title: Com'è Nastya?
    gloss: Com'è Nastya?
    note: '*Как выглядит ...?* è la domanda centrale di questa unità. Il verbo *выглядит* concorda con un soggetto singolare.'
  ru.a1.unit26.lesson03.teach.u_nasti_dlinnye:
    title: Nastya ha i capelli lunghi e biondi e gli occhi azzurri
    gloss: Nastya ha i capelli lunghi e biondi e gli occhi azzurri.
    note: 'Una risposta modello unisce capelli e occhi con *и*: *У Насти длинные светлые волосы и голубые глаза*.'
  ru.a1.unit26.lesson04.teach.nastya_v_yazykovoe:
    title: Nastya presenta Nina
    gloss: 'Nastya: Al caffè delle lingue verrà una ragazza nuova. Si chiama Nina.'
    note: '*Придёт* (verrà) è il futuro perfettivo. *Её зовут Нина* significa letteralmente «la chiamano Nina».'
  ru.a1.unit26.lesson04.teach.dima_khorosho_kak:
    title: Dima chiede com'è
    gloss: 'Dima: Bene! Com''è?'
    note: Di nuovo la domanda centrale, ora con *она* (lei) al posto di un nome.
  ru.a1.unit26.lesson04.teach.nastya_ona_nevysokaya:
    title: Nastya descrive altezza e capelli di Nina
    gloss: 'Nastya: È bassa e ha i capelli corti e biondi.'
    note: Unisce *невысокая* della lezione 1 e le parole per i capelli della lezione 2. *И у неё* aggiunge il secondo dato.
  ru.a1.unit26.lesson04.teach.dima_a_kakie:
    title: Dima chiede degli occhi
    gloss: 'Dima: E che occhi ha?'
    note: '*Какие у неё глаза?* usa *у неё* («lei ha»). *Неё* è la forma di *она* dopo la preposizione *у*.'
  ru.a1.unit26.lesson04.teach.nastya_u_neyo:
    title: Nastya descrive gli occhi di Nina
    gloss: 'Nastya: Ha gli occhi verdi.'
    note: Riprende *зелёные глаза* della lezione 3, con *у неё* per «lei ha».
  ru.a1.unit26.lesson04.teach.dima_spasibo_togda:
    title: Dima la riconoscerà
    gloss: 'Dima: Grazie! Allora la riconoscerò.'
    note: '*Я её узнаю* (la riconoscerò): *её* è l''accusativo di *она*, perché Nina è il complemento oggetto.'
  ru.a1.unit26.lesson05.teach.igor_i_lena:
    title: Confronto tra Igor e Lena
    gloss: Igor e Lena sono fratello e sorella, ma hanno un aspetto diverso. Igor è basso, ha i capelli corti castani e gli occhi castani. Lena è più alta di Igor, ha i capelli lunghi castani e gli occhi verdi. E tu, come sei?
    note: Un breve confronto che riprende tutte le parole di colore e lunghezza viste finora e termina con la domanda chiave dell'unità rivolta a chi legge.
    glosses:
      брат: fratello
      сестра: sorella
      выглядят: essere (di aspetto)
      по-разному: diverso
      невысокий: basso
      короткие: basso
      каштановые: castano
      волосы: i capelli
      карие: castano
      глаза: gli occhi
      выше: più alto
      длинные: lungo
      зелёные: verde
      выглядишь: sembri / hai l'aspetto (come in как ты выглядишь?)
  ru.a1.unit26.lesson05.teach.posle_vyshe_stoit:
    title: Il confronto con выше
    gloss: 'Dopo *выше* (più alto) la persona con cui si confronta è al genitivo: *Лена выше Игоря*.'
    note: Il comparativo *выше* non cambia col genere. La persona con cui si confronta è al genitivo, oppure viene dopo *чем*.
  ru.a1.unit26.lesson05.teach.u_leny_volosy:
    title: Lena ha i capelli più lunghi di Igor
    gloss: Lena ha i capelli più lunghi di Igor.
    note: '*У Лены волосы длиннее, чем у Игоря*: *длиннее* non cambia mai e *чем* (di, che) introduce la seconda parte.'
  ru.a1.unit26.lesson05.teach.u_menya_korotkie:
    title: Ho i capelli corti e castani
    gloss: Ho i capelli corti e castani.
    note: 'Una frase modello per descrivere il tuo aspetto: *У меня* («io ho») + aggettivo + sostantivo.'
  ru.a1.unit26.lesson06.teach.dima_smotri_eto:
    title: Dima nota Nina
    gloss: 'Dima: Guarda, è Nina? Ha i capelli corti e biondi e gli occhi verdi.'
    note: '*Смотри* (guarda) è l''imperativo informale, usato allo stesso modo nei dialoghi precedenti.'
  ru.a1.unit26.lesson06.teach.nastya_da_eto:
    title: Nastya conferma
    gloss: 'Nastya: Sì, è Nina!'
    note: Una conferma breve e naturale.
  ru.a1.unit26.lesson06.teach.nina_privet_ty:
    title: Nina saluta Dima
    gloss: 'Nina: Ciao, sei Dima?'
    note: 'Una semplice domanda informale: in russo non serve il verbo «essere», basta *Ты Дима?*'
  ru.a1.unit26.lesson06.teach.dima_da_priyatno:
    title: Dima ricambia il saluto
    gloss: 'Dima: Sì! Piacere di conoscerti, Nina.'
    note: '*Приятно познакомиться* è la formula standard quando si conosce qualcuno per la prima volta. *Познакомиться* significa fare la conoscenza di una persona nuova.'
  ru.a1.unit26.lesson06.teach.nina_mne_tozhe:
    title: Nina ricambia il saluto
    gloss: 'Nina: Piacere di conoscerti anch''io!'
    note: 'Chiude il dialogo: Dima ha riconosciuto Nina grazie alla descrizione di Nastya.'
