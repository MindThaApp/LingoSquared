teaching:
  ru.a1.unit08.lesson01.teach.magazin:
    title: магазин
    gloss: negozio
    note: магазин è un nome maschile che indica un negozio.
    example_gloss: Andiamo al negozio.
  ru.a1.unit08.lesson01.teach.skolko:
    title: сколько
    gloss: quanto
    note: сколько chiede una quantità o un prezzo ed è spesso abbinato a стоит.
    example_gloss: Quanto costa il pane?
  ru.a1.unit08.lesson01.teach.stoit:
    title: стоит
    gloss: costa
    note: стоит è la terza persona singolare di стоить («costare»), usata con un soggetto singolare come хлеб.
    example_gloss: Il pane costa cento rubli.
  ru.a1.unit08.lesson01.teach.rubl:
    title: рубль
    gloss: rublo
    note: рубль è la valuta russa; сто («cento») richiede il genitivo plurale рублей.
    example_gloss: Il pane costa cento rubli.
  ru.a1.unit08.lesson01.teach.khleb_moloko:
    title: хлеб, молоко
    gloss: pane, latte
    note: 'хлеб è maschile e молоко è neutro: entrambi sono prodotti comuni della spesa quotidiana.'
    example_gloss:
    - Quanto costa il pane?
    - Quanto costa il latte?
  ru.a1.unit08.lesson02.teach.dayte_pozhaluysta:
    title: Дайте, пожалуйста, ...
    gloss: Mi dia, per favore ...
    note: Дайте è l'imperativo formale/plurale di дать («dare»), usato con вы.
  ru.a1.unit08.lesson02.teach.kilogramm:
    title: килограмм
    gloss: chilogrammo
    note: килограмм è l'unità standard per comprare frutta, verdura o pane a peso.
    example_gloss: Mi dia un chilo, per favore.
  ru.a1.unit08.lesson02.teach.polkilo:
    title: полкило
    gloss: mezzo chilo
    note: полкило è composto da пол- («metà») e кило (forma abbreviata e informale di килограмм).
    example_gloss: Mi dia mezzo chilo, per favore.
  ru.a1.unit08.lesson02.teach.shtuka:
    title: штука
    gloss: pezzo
    note: штука serve a contare singoli oggetti; пять штук usa il genitivo plurale dopo il numero пять.
    example_gloss:
    - Mi dia un pezzo, per favore.
    - Mi dia cinque pezzi, per favore.
  ru.a1.unit08.lesson03.teach.pomidory_ogurtsy:
    title: помидоры, огурцы
    gloss: pomodori, cetrioli
    note: Sono entrambi nomi plurali di ortaggi; помидоры e огурцы sono maschili.
    example_gloss:
    - Avete dei pomodori?
    - Avete dei cetrioli?
  ru.a1.unit08.lesson03.teach.kartofel_kapusta:
    title: картофель, капуста
    gloss: patate, cavolo
    note: картофель è un sostantivo maschile collettivo (si usa come un non numerabile), mentre капуста è femminile.
    example_gloss:
    - Avete delle patate?
    - Avete del cavolo?
  ru.a1.unit08.lesson03.teach.yabloki_apelsiny:
    title: яблоки, апельсины
    gloss: mele, arance
    note: кило яблок usa il genitivo plurale яблок dopo кило («un chilo di mele»), come in кило апельсинов.
    example_gloss:
    - Quanto costa un chilo di mele?
    - Quanto costa un chilo di arance?
  ru.a1.unit08.lesson03.teach.u_vas_est:
    title: У вас есть ...?
    gloss: Avete ...? (formale)
    note: Usa il registro formale вас, il modo standard per chiedere a un negoziante se ha un prodotto.
  ru.a1.unit08.lesson03.teach.da_u_menya_est:
    title: Да, у меня есть ...
    gloss: Sì, ho ...
    note: У меня есть (letteralmente «presso di me c'è») è il modo standard per dire «ho»; è la risposta del negoziante.
  ru.a1.unit08.lesson03.teach.pokupatel_pomidory:
    title: Il cliente chiede dei pomodori
    gloss: 'Cliente: Avete i pomodori?'
    note: Il cliente inizia con la domanda cortese У вас есть ...?
  ru.a1.unit08.lesson03.teach.prodavets_da_est:
    title: Il venditore risponde di sì
    gloss: 'Venditore: Sì, ce li abbiamo.'
    note: Да, есть è la risposta breve di tutti i giorni (letteralmente «sì, c'è/ci sono») e non ripete il prodotto.
  ru.a1.unit08.lesson03.teach.pokupatel_kilo_yablok:
    title: Il cliente chiede un prezzo
    gloss: 'Cliente: Quanto costa un chilo di mele?'
    note: кило яблок usa il genitivo plurale яблок dopo кило.
  ru.a1.unit08.lesson03.teach.prodavets_dvesti:
    title: Il venditore dice il prezzo
    gloss: 'Venditore: Duecento rubli.'
    note: Двести significa «duecento»; come сто, è seguito dal genitivo plurale рублей.
  ru.a1.unit08.lesson03.teach.pokupatel_dayte_kilogramm:
    title: Il cliente compra un chilo
    gloss: 'Cliente: Un chilo di mele, per favore.'
    note: Дайте ..., пожалуйста della lezione 2, ora con килограмм яблок («un chilogrammo di mele»).
  ru.a1.unit08.lesson03.teach.prodavets_khorosho:
    title: Il venditore consegna la merce
    gloss: 'Venditore: Va bene, ecco a lei.'
    note: Qui Пожалуйста significa «ecco a lei», mentre il venditore consegna l'acquisto, non «per favore».
