    title: Saluti e congedi
lessons:
  ru.a1.unit01.lesson01.script_ramp:
    title: Alla scoperta dell'alfabeto cirillico
  ru.a1.unit01.lesson02.vremya_dnya:
    title: Saluti per i diversi momenti della giornata
  ru.a1.unit01.lesson03.kak_dela_i_proshchanie:
    title: Come stai? e come salutarsi
teaching:
  ru.a1.unit01.lesson01.teach.direction:
    title: Direzione di lettura
    gloss: L'alfabeto russo si legge da sinistra a destra, come quello italiano.
    note: 'Il russo (scrittura cirillica) si legge nella stessa direzione dell''italiano, quindi non serve alcuna nuova abitudine di lettura: devi imparare solo nuove forme di lettere e nuovi suoni.'
  ru.a1.unit01.lesson01.teach.letter_z:
    title: З з
    gloss: la lettera Z
    note: Si pronuncia come la «s» sonora di «rosa». La forma minuscola з assomiglia al numero 3.
  ru.a1.unit01.lesson01.teach.letter_d:
    title: Д д
    gloss: la lettera D
    note: 'Si pronuncia come la «d» di «dado». La forma minuscola д è una versione piccola della maiuscola, con due «piedini» sotto la riga: non assomiglia affatto alla «d» latina, quindi impara questa forma da zero.'
  ru.a1.unit01.lesson01.teach.letter_r:
    title: Р р
    gloss: la lettera R
    note: 'Si pronuncia come una «r» vibrante, simile a quella italiana. Assomiglia a una «P» latina: è un classico falso amico grafico, quindi non leggerla come «p».'
  ru.a1.unit01.lesson01.teach.letter_a:
    title: А а
    gloss: la lettera A
    note: Si pronuncia come la «a» di «casa». È identica alla «A/a» latina e suona in modo molto simile.
  ru.a1.unit01.lesson01.teach.letter_v:
    title: В в
    gloss: la lettera V
    note: 'Si pronuncia come la «v» di «vino». Assomiglia a una «B» latina: un altro falso amico grafico a cui fare attenzione.'
  ru.a1.unit01.lesson01.teach.letter_s:
    title: С с
    gloss: la lettera S
    note: Si pronuncia come la «s» di «sole». Ha la forma e il suono della «C/c» latina, ma in russo non si legge mai come «k» né come «c» di «cena».
  ru.a1.unit01.lesson01.teach.letter_t:
    title: Т т
    gloss: la lettera T
    note: 'Si pronuncia come la «t» di «tavolo». A mano la minuscola т si scrive talvolta come una piccola «m»: per ora impara la forma stampata.'
  ru.a1.unit01.lesson01.teach.letter_u:
    title: У у
    gloss: la lettera U
    note: 'Si pronuncia come la «u» di «luna». Assomiglia a una «y» latina: un''altra forma che non corrisponde al suono della lettera a cui somiglia.'
  ru.a1.unit01.lesson01.teach.letter_ye:
    title: Е е
    gloss: la lettera Ye
    note: A inizio di parola o di sillaba si pronuncia come «ie» in «ieri». È identica alla «E/e» latina, ma il suono è piuttosto diverso.
  ru.a1.unit01.lesson01.teach.hard_sign_note:
    title: 'ъ e ь: segno duro e segno molle'
    gloss: 'Il segno duro ъ e il segno molle ь non hanno un suono proprio: cambiano la pronuncia della lettera vicina.'
    note: 'Questi due segni non rappresentano mai un suono da soli: ь ammorbidisce la consonante che precede, mentre ъ indica una netta separazione tra i suoni. Li rivedrai quando compariranno nelle parole vere e proprie.'
  ru.a1.unit01.lesson01.teach.letter_short_i:
    title: Й й
    gloss: la lettera I breve
    note: 'Si pronuncia come la «i» di «noi» in fine di sillaba: un rapido suono di passaggio, non una vocale piena. Compare in Здравствуйте, la parola a cui conduce questa lezione.'
  ru.a1.unit01.lesson01.teach.zdravstvuyte_shape:
    title: Здравствуйте
    gloss: salve, buongiorno (formale)
    note: Il saluto formale completo, formato dalle lettere appena presentate. Sembra lungo e pieno di consonanti, ma ogni sua lettera è già stata trattata in questa lezione.
    example_gloss: Buongiorno! Mi chiamo Viktor.
  ru.a1.unit01.lesson02.teach.zdravstvuyte_privet:
    title: Здравствуйте, Привет
    gloss: salve (formale); ciao (informale)
    note: Здравствуйте è il saluto formale sempre sicuro, a qualsiasi ora e con qualsiasi sconosciuto. Привет è confidenziale, usato con amici e coetanei.
    example_gloss:
    - Buongiorno! Come sta? (formale)
    - Ciao! Come va? (informale)
  ru.a1.unit01.lesson02.teach.dobroe_utro:
    title: Доброе утро!
    gloss: buongiorno
    note: Si usa al mattino, più o meno fino a tarda mattinata.
  ru.a1.unit01.lesson02.teach.dobryy_den:
    title: Добрый день!
    gloss: buongiorno
    note: Il saluto standard per il giorno, da tarda mattinata fino al pomeriggio.
  ru.a1.unit01.lesson02.teach.dobryy_vecher:
    title: Добрый вечер!
    gloss: buonasera
    note: 'Si usa quando si arriva da qualche parte di sera: è un saluto di incontro, non di congedo.'
  ru.a1.unit01.lesson02.teach.register_note:
    title: Scegliere il saluto
    gloss: Здравствуйте va bene a qualsiasi ora del giorno e in contesti educati. Привет è informale, usato tra amici.
    note: Se hai dubbi sull'ora o su chi hai davanti, Здравствуйте è sempre sicuro; Привет è riservato a chi conosci già bene.
  ru.a1.unit01.lesson03.teach.kak_dela:
    title: Как дела?
    gloss: Come va? (informale)
    note: Il modo informale di tutti i giorni per chiedere come sta qualcuno, usato con amici e coetanei.
  ru.a1.unit01.lesson03.teach.kak_pozhivaete:
    title: Как поживаете?
    gloss: Come sta? (formale)
    note: Il modo formale per chiedere come sta qualcuno, in accordo con il registro del вы.
  ru.a1.unit01.lesson03.teach.horosho_spasibo:
    title: Хорошо, спасибо
    gloss: bene, grazie
    note: Una risposta semplice e positiva, utilizzabile in entrambi i registri.
    example_gloss: Come va? — Bene, grazie.
  ru.a1.unit01.lesson03.teach.tak_sebe:
    title: Так себе
    gloss: così così
    note: Una risposta tra il neutro e il leggermente negativo, quando le cose non vanno né bene né male.
    example_gloss: Come va? — Così così.
  ru.a1.unit01.lesson03.teach.a_u_tebya:
    title: А у тебя?
    gloss: E tu? (informale)
    note: Il modo informale per restituire la domanda all'altra persona, in accordo con il registro del ты.
  ru.a1.unit01.lesson03.teach.do_svidaniya:
    title: До свидания!
    gloss: arrivederci (neutro/formale)
    note: Il congedo standard, adatto a ogni situazione; letteralmente vicino a «fino a quando ci rivedremo».
  ru.a1.unit01.lesson03.teach.poka:
    title: Пока!
    gloss: ciao (informale, per salutarsi)
    note: Un modo informale e molto comune per salutarsi tra amici e conoscenti.
  ru.a1.unit01.lesson03.teach.do_zavtra:
    title: До завтра!
    gloss: a domani
    note: Un saluto cordiale quando pensi di rivedere la persona il giorno dopo.
  ru.a1.unit01.lesson03.teach.anna:
    title: Anna saluta Maksim
    gloss: 'Anna dice: Buongiorno! Come va?'
    note: Anna e Maksim sono colleghi e si salutano durante il giorno, con il grado di confidenza indicato da дела (registro informale).
  ru.a1.unit01.lesson03.teach.maksim_reply:
    title: Maksim risponde e restituisce la domanda
    gloss: 'Maksim dice: Bene, grazie. E tu?'
    note: Maksim risponde e restituisce la domanda in modo informale, in linea con il registro di Anna.
  ru.a1.unit01.lesson03.teach.anna_close:
    title: Anna chiude lo scambio
    gloss: 'Anna dice: Anch''io bene. Allora, a domani!'
    note: Anna conclude la conversazione e passa a un saluto cordiale.
  ru.a1.unit01.lesson03.teach.maksim_close:
    title: Maksim saluta
    gloss: 'Maksim dice: A domani!'
    note: Maksim ripete il saluto di Anna e chiude lo scambio.
