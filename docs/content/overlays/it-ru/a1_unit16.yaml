teaching:
  ru.a1.unit16.lesson01.teach.u_menya_bolit_golova:
    title: У меня болит голова.
    gloss: Mi fa male la testa.
    note: у меня significa «io ho» (letteralmente «presso di me»); болит significa «fa male / duole» e concorda con un soggetto singolare come голова (testa).
  ru.a1.unit16.lesson01.teach.zhivot:
    title: живот
    gloss: pancia
    note: живот significa «pancia / stomaco». Usa lo stesso schema у меня болит... con qualsiasi parte del corpo.
    example_gloss: Mi fa male la pancia.
  ru.a1.unit16.lesson01.teach.gorlo:
    title: горло
    gloss: gola
    note: горло significa «gola».
    example_gloss: Mi fa male la gola.
  ru.a1.unit16.lesson02.teach.u_menya_temperatura:
    title: У меня температура.
    gloss: Ho la febbre.
    note: температура significa letteralmente «temperatura», ma in russo è il modo normale per dire «la febbre».
  ru.a1.unit16.lesson02.teach.prostuda:
    title: простуда
    gloss: un raffreddore
    note: простуда significa «un raffreddore» (la malattia). Di' у меня простуда per dire «Ho il raffreddore».
    example_gloss: Ho il raffreddore.
  ru.a1.unit16.lesson02.teach.mne_ploho:
    title: Мне плохо.
    gloss: Mi sento male.
    note: Мне плохо è un modo generico per dire che non stai bene, senza indicare un sintomo preciso.
  ru.a1.unit16.lesson03.teach.dima_zdravstvuyte_bolit:
    title: Dima saluta il medico
    gloss: 'Dima: Buongiorno! Mi fanno male la testa e la gola.'
    note: Дима inizia con il formale Здравствуйте! perché il medico è un estraneo.
  ru.a1.unit16.lesson03.teach.doktor_chto_u_vas_bolit:
    title: Il medico chiede che cosa fa male
    gloss: 'Medico: Che cosa le fa male? La testa e la gola?'
    note: Il medico usa вас, la forma di cortesia (anche plurale), invece di тебя, la forma informale.
  ru.a1.unit16.lesson03.teach.dima_da_i_eshchyo_temperatura:
    title: Dima aggiunge un altro sintomo
    gloss: 'Dima: Sì, e anche la febbre.'
    note: 'ещё significa «anche / in più»: и ещё... aggiunge un elemento a quanto hai appena detto.'
  ru.a1.unit16.lesson03.teach.doktor_vam_nuzhno_otdyhat:
    title: Il medico dà un consiglio
    gloss: 'Medico: Deve riposare e bere molta acqua.'
    note: Вам нужно + infinito significa «Lei deve...»; вам è il dativo di cortesia di «Lei / voi».
