teaching:
  ru.a1.unit05.lesson01.teach.kotoryy_chas:
    title: Который час?
    gloss: Che ore sono?
    note: Il modo standard per chiedere l'ora, letteralmente «quale ora».
  ru.a1.unit05.lesson01.teach.seychas_chas:
    title: Сейчас час.
    gloss: Adesso è l'una.
    note: '«Час» da solo significa «l''una»: in russo non si dice «один час» in questo caso, a differenza dello schema dei numeri dal 2 in su.'
    example_gloss: Che ore sono? — È l'una.
  ru.a1.unit05.lesson01.teach.dva_tri_chasa:
    title: два часа, три часа
    gloss: le due, le tre
    note: Dopo два e три, час prende il genitivo singolare часа, secondo lo schema numero-sostantivo dell'Unità 3.
    example_gloss:
    - Adesso sono le due.
    - Adesso sono le tre.
  ru.a1.unit05.lesson01.teach.pyat_desyat_chasov:
    title: пять часов, десять часов
    gloss: le cinque, le dieci
    note: Da пять in su, час passa al genitivo plurale часов, di nuovo secondo lo schema del 5 e oltre dell'Unità 3.
    example_gloss:
    - Adesso sono le cinque.
    - Adesso sono le dieci.
  ru.a1.unit05.lesson02.teach.v_kotorom_chasu:
    title: В котором часу?
    gloss: A che ora?
    note: Si usa per chiedere quando succede qualcosa, a differenza di Который час?, che chiede solo l'ora attuale.
  ru.a1.unit05.lesson02.teach.utrom_dnem:
    title: утром, днём
    gloss: di mattina, di giorno
    note: Sono forme avverbiali (strumentale) di утро e день, usate senza preposizione.
    example_gloss:
    - La mattina bevo il caffè.
    - Di giorno lavoro.
  ru.a1.unit05.lesson02.teach.vecherom_nochyu:
    title: вечером, ночью
    gloss: di sera, di notte
    note: Stesso schema avverbiale (strumentale) di утром/днём.
    example_gloss:
    - La sera sono a casa.
    - Di notte dormo.
  ru.a1.unit05.lesson02.teach.v_dva_chasa_dnya:
    title: В два часа дня.
    gloss: Alle due del pomeriggio.
    note: дня (genitivo di день) aggiunto dopo l'ora chiarisce che sono le due del pomeriggio, non le due di notte.
    example_gloss: A che ora è l'incontro? — Alle due del pomeriggio.
  ru.a1.unit05.lesson02.teach.v_sem_chasov_vechera:
    title: В семь часов вечера.
    gloss: Alle sette di sera.
    note: вечера (genitivo di вечер) chiarisce che sono le sette di sera.
    example_gloss: Il negozio chiude alle sette di sera.
  ru.a1.unit05.lesson03.teach.skazhite_pozhaluysta:
    title: Скажите, пожалуйста, который час?
    gloss: Scusi, sa dirmi che ore sono?
    note: Скажите, пожалуйста attenua la domanda, ed è adatto per rivolgersi a uno sconosciuto.
  ru.a1.unit05.lesson03.teach.kogda_otkhodit:
    title: Когда отходит поезд?
    gloss: Quando parte il treno?
    note: Отходит («parte») è il verbo standard per un treno o un autobus che lascia la stazione.
  ru.a1.unit05.lesson03.teach.passazhir_vopros:
    title: Il passeggero chiede l'ora
    gloss: 'Passeggero: Scusi, sa dirmi che ore sono?'
    note: Il passeggero esordisce con cortesia usando Скажите, пожалуйста, adatto per rivolgersi al personale della stazione.
  ru.a1.unit05.lesson03.teach.kassir_sem:
    title: Il bigliettaio risponde
    gloss: 'Bigliettaio: Sono le sette di mattina.'
    note: Сейчас семь часов утра indica l'ora attuale, con утра («di mattina») per chiarezza.
  ru.a1.unit05.lesson03.teach.passazhir_kogda:
    title: Il passeggero chiede del treno
    gloss: 'Passeggero: E quando parte il treno?'
    note: А introduce con naturalezza la seconda domanda del passeggero.
  ru.a1.unit05.lesson03.teach.kassir_vosem:
    title: Il bigliettaio indica l'orario di partenza
    gloss: 'Bigliettaio: Alle otto di mattina.'
    note: В восемь часов утра risponde con la preposizione в, seguita dall'ora e dalla parte del giorno.
