  ar.a1.unit39.lesson05.teach.alan_alrbya_alwrwd:
    title: Rozmowa o porach roku
    gloss: 'Teraz jest wiosna. Róże są piękne. Nour pyta: Którą porę roku uważasz za piękną? Yusuf mówi: Lubię lato. Latem pływamy. Layla mówi: Lubię zimę. Zimą jeździmy na łyżwach.'
    note: Krótki tekst podsumowujący rozmowę o porach roku. Nazwy pór roku są rodzaju męskiego i występują z ال, np. الصيف (aṣ-ṣayf) i الشتاء (ash-shitāʾ).
    glosses:
      الربيع: wiosna
      الورود: róże
      جميلة: piękne
      تسأل: pyta
      فصل: pora roku
      تراه: uważać / uznawać
      يقول: mówi
      الصيف: lato
      أحب: lubić (lubię)
      نسبح: pływamy
      الشتاء: zima
      نتزلج: jeździć na łyżwach
  ar.a1.unit39.lesson05.teach.alhwar_an_alfswl:
    title: Rozmowa jest fajna
    gloss: Rozmowa o porach roku jest super.
  ar.a1.unit39.lesson06.teach.krym_mrhba_baljmya:
    title: Karim dołącza do grupy
    gloss: 'Karim: Cześć wszystkim! Którą porę roku uważasz za piękną, Layla?'
  ar.a1.unit39.lesson06.teach.lyla_ahb_alshtaa:
    title: Layla odpowiada
    gloss: 'Layla: Lubię zimę. Zimą jeździmy na łyżwach.'
  ar.a1.unit39.lesson06.teach.krym_ara_alkhryf:
    title: Karim odpowiada
    gloss: 'Karim: Uważam jesień za piękną. Jesień jest spokojna.'
