    gloss: Nour i Layla idą w sobotę na targ kwiatowy. Jaki kolor chce Layla? Layla chciałaby czerwony. Jaki kolor chce Nour? Nour chciałaby żółty. Kupują pięć róż. Kosztuje to dziesięć dirhamów. Róże są bardzo ładne!
