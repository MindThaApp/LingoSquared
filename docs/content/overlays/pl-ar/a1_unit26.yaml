course:
  title: Arabski A1
  description: 'Arabski dla początkujących: opisywanie podstawowego wyglądu osoby – wzrost i wiek, kolor włosów i oczu, pytanie كيف تبدو؟ (kayfa tabdū?) oraz porównywanie dwóch osób za pomocą أطول من (aṭwal min).'
units:
