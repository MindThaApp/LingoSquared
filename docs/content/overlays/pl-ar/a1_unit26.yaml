teaching:
  ar.a1.unit26.lesson01.teach.twyl_qsyr:
    title: Wysoki i niski
    gloss: wysoki / niski
    note: 'طويل (ṭawīl) znaczy „wysoki”, a قصير (qaṣīr) „niski”. W odniesieniu do kobiety dostają końcówkę ة: طويلة (ṭawīla), قصيرة (qaṣīra).'
    example_gloss:
    - Sara jest wysoka.
    - Karim jest niski.
  ar.a1.unit26.lesson01.teach.kbyr_fy_alsn:
    title: Stary i młody
    gloss: stary / młody
    note: كبير في السن (kabīr fī as-sinn) i صغير في السن (ṣaghīr fī as-sinn) opisują ogólne wrażenie wieku, a nie dokładną liczbę lat.
    example_gloss:
    - Dziadek jest stary.
    - Yusuf jest młody.
  ar.a1.unit26.lesson01.teach.km_amrk_sual:
    title: 'Wiek: liczba czy wrażenie'
    gloss: كم عمرك؟ (kam ʿumruka?) pyta o liczbę lat, a كبير في السن (kabīr fī as-sinn) podaje ogólne wrażenie bez liczby, jak w zdaniu الجد كبير في السن (al-jadd kabīr fī as-sinn).
    note: Pytania كم عمرك؟ używaj, gdy chcesz zapytać o dokładny wiek. Tutaj كبير في السن opisuje tylko to, jak stara wydaje się dana osoba.
  ar.a1.unit26.lesson01.teach.sara_twyla_wkrym:
    title: Sara jest wysoka, a Karim niski
    gloss: Sara jest wysoka, a Karim niski.
    note: 'و (wa-) łączy dwa zdania i pisze się razem z następnym wyrazem: وكريم (wa-karīm). Przymiotniki zgadzają się z rzeczownikami: سارة طويلة jest w rodzaju żeńskim, a كريم قصير w męskim.'
  ar.a1.unit26.lesson02.teach.alshar:
    title: Włosy
    gloss: włosy
    note: 'الشعر (ash-shaʿr) znaczy „włosy”. ش jest literą słoneczną, więc ل z ال nie jest wymawiane: ash-shaʿr.'
    example_gloss: Yusuf ma krótkie czarne włosy.
  ar.a1.unit26.lesson02.teach.ashqr_bny_rmady:
    title: Blond, brązowy i szary
    gloss: blond / brązowy / szary
    note: 'أشقر (ashqar), بني (bunnī) i رمادي (ramādī) opisują włosy i stoją po rzeczowniku: شعر أشقر (shaʿr ashqar).'
    example_gloss:
    - Layla ma blond włosy.
    - Karim ma brązowe włosy.
    - Dziadek ma siwe włosy.
  ar.a1.unit26.lesson02.teach.shar_twyl_shar:
    title: Długie i krótkie (włosy)
    gloss: długi / krótki (o włosach)
    note: 'طويل (ṭawīl) i قصير (qaṣīr) opisują także włosy: شعر طويل (shaʿr ṭawīl), شعر قصير (shaʿr qaṣīr). Stoją po شعر, który jest rodzaju męskiego.'
    example_gloss:
    - Sara ma długie włosy.
    - Karim ma krótkie włosy.
  ar.a1.unit26.lesson02.teach.alsfa_taty_bad:
    title: Przymiotnik stoi po rzeczowniku
    gloss: 'W arabskim przymiotnik stoi po rzeczowniku i zgadza się z nim: شعر قصير (shaʿr qaṣīr), شعر طويل (shaʿr ṭawīl), شعر أشقر (shaʿr ashqar), شعر بني (shaʿr bunnī), شعر رمادي (shaʿr ramādī), شعر أسود (shaʿr aswad).'
    note: شعر (shaʿr) jest rodzaju męskiego, więc jego przymiotniki też są w rodzaju męskim. Gdy rzeczownik jest nieokreślony, żaden z obu wyrazów nie przyjmuje ال.
  ar.a1.unit26.lesson02.teach.ndyf_aldmyr_ha:
    title: Włosy i jej włosy
    gloss: شعر (shaʿr) znaczy „włosy”. Dodaj zaimek ها (hā, „jej”), a otrzymasz شعرها (shaʿruhā, „jej włosy”).
    note: 'Końcówka ها wskazuje właścicielkę: شعرها („jej włosy”), اسمها („jej imię”), عيناها („jej oczy”). Pisze się ją razem z wyrazem.'
  ar.a1.unit26.lesson02.teach.lywsf_shar_qsyr:
    title: Yusuf ma krótkie czarne włosy
    gloss: Yusuf ma krótkie czarne włosy.
    note: 'ليوسف شعر قصير أسود (li-yūsuf shaʿr qaṣīr aswad): ل (li-) przed imieniem znaczy „ma” i pisze się razem z imieniem.'
  ar.a1.unit26.lesson02.teach.llyla_shar_twyl:
    title: Layla ma długie blond włosy
    gloss: Layla ma długie blond włosy.
    note: Łączy słownictwo tej lekcji o długości i kolorze w jednym naturalnym zdaniu.
  ar.a1.unit26.lesson03.teach.alaynan:
    title: Oczy
    gloss: oczy
    note: 'العينان (al-ʿaynān) znaczy „oczy”. To rzeczownik w liczbie podwójnej: arabski ma specjalną końcówkę ان dla dokładnie dwóch sztuk.'
    example_gloss: Yusuf ma brązowe oczy.
  ar.a1.unit26.lesson03.teach.azrq_bny_akhdr:
    title: Niebieski, brązowy i zielony
    gloss: niebieski / brązowy / zielony
    note: 'أزرق (azraq) „niebieski”, بني (bunnī) „brązowy” i أخضر (akhḍar) „zielony” to formy rodzaju męskiego. Z عينان używa się form liczby podwójnej: زرقاوان (zarqāwān), بنيتان (bunnīyatān), خضراوان (khaḍrāwān).'
    example_gloss:
    - Layla ma niebieskie oczy.
    - Karim ma brązowe oczy.
    - Sara ma zielone oczy.
  ar.a1.unit26.lesson03.teach.aynan_mthna_ldhlk:
    title: Oczy w liczbie podwójnej, przymiotnik też
    gloss: 'عينان (ʿaynān) jest w liczbie podwójnej, więc przymiotnik też: عينان زرقاوان (ʿaynān zarqāwān), عينان بنيتان (ʿaynān bunnīyatān), عينان خضراوان (ʿaynān khaḍrāwān).'
    note: W liczbie podwójnej końcówka ان dodawana jest zarówno do rzeczownika, jak i do przymiotnika. Przymiotnik jest też w rodzaju żeńskim, bo عين jest rzeczownikiem żeńskim.
  ar.a1.unit26.lesson03.teach.kyf_tbdw_lyla:
    title: Jak wygląda Layla?
    gloss: Jak wygląda Layla?
    note: كيف تبدو ليلى؟ (kayfa tabdū laylā?) pyta, jak wygląda Layla. تبدو (tabdū) jest w rodzaju żeńskim, bo Layla jest kobietą; dla mężczyzny mówi się يبدو (yabdū).
  ar.a1.unit26.lesson03.teach.llyla_shar_twyl:
    title: Layla ma długie blond włosy i niebieskie oczy
    gloss: Layla ma długie blond włosy i niebieskie oczy.
    note: 'لليلى شعر طويل أشقر وعينان زرقاوان (li-laylā shaʿr ṭawīl ashqar wa-ʿaynān zarqāwān): ل + imię znaczy „ma”, a و łączy włosy i oczy.'
  ar.a1.unit26.lesson04.teach.lyla_staty_ftaa:
    title: Layla przedstawia Nour
    gloss: 'Layla: Do kawiarni językowej przyjdzie nowa dziewczyna. Ma na imię Nour.'
    note: 'ستأتي (sa-taʾtī) znaczy „ona przyjdzie”: س (sa-) oznacza czas przyszły, a ت (ta-) „ona”. اسمها (ismuhā) znaczy „jej imię”.'
  ar.a1.unit26.lesson04.teach.ywsf_hsna_kyf:
    title: Yusuf pyta, jak ona wygląda
    gloss: 'Yusuf: Dobrze! A jak wygląda?'
    note: 'W كيف تبدو؟ (kayfa tabdū?) tym razem nie ma imienia: czasownik تبدو już oznacza „ona wygląda”.'
  ar.a1.unit26.lesson04.teach.lyla_hy_qsyra:
    title: Layla opisuje wzrost i włosy Nour
    gloss: 'Layla: Jest niska i ma krótkie blond włosy.'
    note: قصيرة (qaṣīra) jest w rodzaju żeńskim, bo Nour jest kobietą, ale شعر قصير أشقر pozostaje w rodzaju męskim, bo شعر jest rzeczownikiem męskim.
  ar.a1.unit26.lesson04.teach.ywsf_waynaha:
    title: Yusuf pyta o jej oczy
    gloss: 'Yusuf: A jej oczy?'
    note: 'وعيناها (wa-ʿaynāhā) znaczy „i jej oczy”: و (wa-) pisze się razem z rzeczownikiem, a ها (hā) na końcu znaczy „jej”.'
  ar.a1.unit26.lesson04.teach.lyla_lha_aynan:
    title: Layla opisuje oczy Nour
    gloss: 'Layla: Ma zielone oczy.'
    note: 'لها (lahā) znaczy „ona ma”: ل (la-) + ها (hā). عينان خضراوان (ʿaynān khaḍrāwān) to rzeczownik w liczbie podwójnej z przymiotnikiem w liczbie podwójnej.'
  ar.a1.unit26.lesson04.teach.ywsf_shkra_idhn:
    title: Yusuf ją rozpozna
    gloss: 'Yusuf: Dzięki! W takim razie ją rozpoznam.'
    note: 'سأتعرف عليها (sa-ataʿarraf ʿalayhā) znaczy „rozpoznam ją”: س (sa-) oznacza czas przyszły, a ها w عليها znaczy „ją”.'
  ar.a1.unit26.lesson05.teach.sara_akht_krym:
    title: Porównanie Karima i Sary
    gloss: Karim i Sara są rodzeństwem, ale różnią się wyglądem. Karim jest niski, ma krótkie brązowe włosy i brązowe oczy. Sara jest wyższa od Karima, ma długie brązowe włosy i zielone oczy. A jak ty wyglądasz?
    note: Krótkie porównanie, w którym wracają wszystkie poznane dotąd słowa określające kolor i długość. Tekst kończy się pytaniem kluczowym dla tej lekcji, skierowanym do czytelnika.
    glosses:
      أخ: brat
      أخت: siostra
      تبدو: wyglądać
      مختلفان: różnie
      القامة: niski (o wzroście)
      قصير: niski
      بني: brązowy
      شعر: włosy
      بنيتان: brązowy
      وعينان: oczy
      أطول: wyższy
      طويل: długi
      خضراوان: zielony
      المظهر: wygląd (jak ktoś wygląda)
  ar.a1.unit26.lesson05.teach.llmqarna_nstkhdm_afal:
    title: Porównywanie za pomocą أفعل
    gloss: 'Aby porównać, użyj formy أفعل (afʿal) + من (min): سارة أطول من كريم (sāra aṭwal min karīm), „Sara jest wyższa od Karima”.'
    note: طويل (ṭawīl) w stopniu wyższym przyjmuje postać أطول (aṭwal), a من (min) znaczy „od”. Ta forma nie zmienia się w odniesieniu do kobiety.
  ar.a1.unit26.lesson05.teach.lsara_shar_atwl:
    title: Sara ma dłuższe włosy niż Karim
    gloss: Sara ma dłuższe włosy niż Karim.
    note: 'لسارة شعر أطول من شعر كريم (li-sāra shaʿr aṭwal min shaʿr karīm): أطول pozostaje w rodzaju męskim, bo شعر jest rzeczownikiem męskim.'
  ar.a1.unit26.lesson05.teach.ldy_shar_qsyr:
    title: Mam krótkie brązowe włosy
    gloss: Mam krótkie brązowe włosy.
    note: 'لدي (ladayya) znaczy „mam”; w arabskim nie ma czasownika „mieć”. Przymiotniki stoją po rzeczowniku: شعر قصير بني (shaʿr qaṣīr bunnī).'
  ar.a1.unit26.lesson06.teach.ywsf_anzry_hl:
    title: Yusuf dostrzega Nour
    gloss: 'Yusuf: Patrz, czy to Nour? Ma krótkie blond włosy i zielone oczy.'
    note: انظري (unẓurī) to rozkaz skierowany do kobiety, bo Yusuf mówi do Layli; do mężczyzny mówi się انظر (unẓur). هذه (hādhihi) znaczy „ta”, przy rzeczowniku żeńskim.
  ar.a1.unit26.lesson06.teach.lyla_nam_hdhh:
    title: Layla potwierdza
    gloss: 'Layla: Tak, to Nour!'
    note: Krótkie, naturalne potwierdzenie.
  ar.a1.unit26.lesson06.teach.nwr_mrhba_hl:
    title: Nour wita Yusufa
    gloss: 'Nour: Cześć, czy ty jesteś Yusuf?'
    note: 'هل أنت يوسف؟ (hal anta yūsuf?) to pytanie rozstrzygnięcia: هل (hal) + zdanie bez czasownika „być”.'
  ar.a1.unit26.lesson06.teach.ywsf_nam_tshrft:
    title: Yusuf wita Nour
    gloss: 'Yusuf: Tak! Miło cię poznać, Nour.'
    note: تشرفت بمعرفتك (tasharraftu bi-maʿrifatika) to grzeczna formuła na pierwsze spotkanie. ب (bi-) pisze się razem z معرفتك, a ك na końcu znaczy „ciebie”.
  ar.a1.unit26.lesson06.teach.nwr_wana_ayda:
    title: Nour odwzajemnia powitanie
    gloss: 'Nour: Mnie też miło cię poznać!'
    note: Kończy dialog – Yusuf rozpoznał Nour dzięki wcześniejszemu opisowi Layli.
