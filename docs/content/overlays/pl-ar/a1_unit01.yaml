teaching:
  ar.a1.unit01.lesson01.teach.rtl:
    title: Pismo arabskie biegnie od prawej do lewej
    gloss: Po arabsku pisze się od prawej do lewej.
    note: Czytaj po arabsku od prawej krawędzi w stronę lewej.
  ar.a1.unit01.lesson01.teach.mim:
    title: Litera م
    gloss: m
    note: م oznacza dźwięk m, a jej kształt zmienia się w zależności od pozycji w wyrazie.
  ar.a1.unit01.lesson01.teach.ra:
    title: Litera ر
    gloss: r
    note: ر oznacza dźwięk r (drżące, jak w polskim) i nie łączy się z następną literą.
  ar.a1.unit01.lesson01.teach.ha:
    title: Litera ح
    gloss: ḥ
    note: ح to przydechowe h wymawiane głęboko w gardle, inne niż zwykłe polskie h.
  ar.a1.unit01.lesson01.teach.ba:
    title: Litera ب
    gloss: b
    note: ب oznacza dźwięk b i łączy się z sąsiednimi literami.
  ar.a1.unit01.lesson01.teach.alef:
    title: Litera ا
    gloss: ā / a
    note: ا oznacza długą samogłoskę ā i nie łączy się z następną literą.
  ar.a1.unit01.lesson01.teach.marhaba_shape:
    title: Ułóż مرحبا
    gloss: cześć
    note: مرحبا czyta się marḥaban. Krótkie samogłoski zwykle pomija się w piśmie arabskim.
    example_gloss: Cześć! Jestem Sara.
  ar.a1.unit01.lesson02.teach.marhaba:
    title: Cześć
    gloss: cześć
    note: مرحبا to serdeczne, uniwersalne powitanie, odpowiednie w prawie każdej sytuacji.
    example_gloss: Cześć, jak się masz?
  ar.a1.unit01.lesson02.teach.sabah_alkhayr:
    title: Dzień dobry (rano)
    gloss: dzień dobry (rano)
    note: صباح الخير czyta się ṣabāḥ al-khayr, dosłownie „poranek dobra”.
  ar.a1.unit01.lesson02.teach.masaa_alkhayr:
    title: Dzień dobry po południu / dobry wieczór
    gloss: dzień dobry (po południu) / dobry wieczór
    note: مساء الخير czyta się masāʾ al-khayr i używa się tego od późnego popołudnia przez cały wieczór.
  ar.a1.unit01.lesson02.teach.maa_alsalama:
    title: Do widzenia
    gloss: do widzenia
    note: مع السلامة czyta się maʿa as-salāma, dosłownie „z bezpieczeństwem” – standardowe, ogólne pożegnanie.
    example_gloss: Dziękuję, do widzenia!
  ar.a1.unit01.lesson02.teach.shukran:
    title: Dziękuję
    gloss: dziękuję
    note: شكرا czyta się shukran i pasuje w każdym stylu wypowiedzi.
    example_gloss: Bardzo dziękuję.
  ar.a1.unit01.lesson02.teach.afwan:
    title: Proszę / nie ma za co
    gloss: nie ma za co
    note: عفوا (ʿafwan) to zwyczajowa odpowiedź na شكرا; w innym kontekście może też znaczyć „przepraszam”.
  ar.a1.unit01.lesson03.teach.tusbih_ala_khayr:
    title: Dobranoc
    gloss: dobranoc
    note: تصبح على خير (tuṣbiḥ ʿalā khayr) mówi się na pożegnanie wieczorem lub przed pójściem spać, nie na powitanie. تصبح to forma kierowana do mężczyzny; do kobiety mówi się تصبحين على خير (tuṣbiḥīna ʿalā khayr).
  ar.a1.unit01.lesson03.teach.ahlan_wa_sahlan:
    title: Witaj
    gloss: witaj / witamy
    note: أهلا وسهلا (ahlan wa sahlan) służy do powitania gościa lub serdecznego przywitania kogoś przy przybyciu.
    example_gloss: Witaj! Serdecznie witamy.
  ar.a1.unit01.lesson03.teach.ila_alliqaa:
    title: Do zobaczenia
    gloss: do zobaczenia
    note: إلى اللقاء (ilā al-liqāʾ) to staranne, neutralne pożegnanie.
  ar.a1.unit01.lesson03.teach.sabah_alnoor:
    title: Dzień dobry – odpowiedź
    gloss: dzień dobry [odpowiedź]
    note: صباح النور (ṣabāḥ an-nūr, „poranek światła”) to zwyczajowa odpowiedź na صباح الخير.
  ar.a1.unit01.lesson03.teach.masaa_alnoor:
    title: Dobry wieczór – odpowiedź
    gloss: dobry wieczór [odpowiedź]
    note: مساء النور (masāʾ an-nūr) to zwyczajowa odpowiedź na مساء الخير.
  ar.a1.unit01.lesson03.teach.yawman_saeedan:
    title: Miłego dnia
    gloss: miłego dnia
    note: يوما سعيدا (yawman saʿīdan) to serdeczne życzenie na zakończenie rozmowy.
  ar.a1.unit01.lesson04.teach.kayfa_haluk:
    title: Jak się masz?
    gloss: Jak się Pan/Pani miewa?
    note: كيف حالك؟ (kayfa ḥāluk) to standardowy sposób pytania, jak się ktoś ma; w zapisie bez znaków wokalizacji pasuje do każdego rozmówcy.
  ar.a1.unit01.lesson04.teach.gender_note:
    title: Ty w rodzaju męskim i żeńskim
    gloss: ty (m) / ty (ż)
    note: W mowie arabski rozróżnia أنتَ (anta, do mężczyzny) i أنتِ (anti, do kobiety) – tak samo حالَك i حالِك. Bez pokazanych tu znaków diakrytycznych zapis używany w tym kursie jest identyczny dla obu form.
  ar.a1.unit01.lesson04.teach.bikhayr:
    title: Dobrze
    gloss: dobrze
    note: بخير (bikhayr) to standardowa pozytywna odpowiedź na كيف حالك؟
    example_gloss: Dziś czuję się dobrze.
  ar.a1.unit01.lesson04.teach.alhamdulillah:
    title: Dzięki Bogu
    gloss: dzięki Bogu / chwała Bogu
    note: الحمد لله (al-ḥamdu lillāh) bardzo często pada po بخير w odpowiedzi, niezależnie od praktyk religijnych mówiącego – to zwykła formuła kończąca wypowiedź, podobnie jak polskie „dzięki Bogu” w potocznym „dobrze, dzięki Bogu”.
    example_gloss: Dobrze, dzięki Bogu.
  ar.a1.unit01.lesson04.teach.wa_anta:
    title: A ty?
    gloss: A Pan/Pani?
    note: وأنت؟ (wa anta do mężczyzny, wa anti do kobiety) zwraca pytanie rozmówcy; zapis bez wokalizacji jest taki sam w obu przypadkach.
  ar.a1.unit01.lesson04.teach.mumtaz:
    title: Doskonale
    gloss: doskonale / świetnie
    note: ممتاز (mumtāz) to entuzjastyczny stopień wyżej niż بخير.
    example_gloss: Dziś czuję się świetnie!
  ar.a1.unit01.lesson04.teach.la_bas:
    title: Nieźle
    gloss: nieźle
    note: لا بأس (lā baʾs) to naturalna, umiarkowana odpowiedź, a nie skarga.
