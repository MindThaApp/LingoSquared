      يبحث: sprawdza
      صباح: ranek
      توقعات: prognoza (prognoza pogody)
      يذهب: idzie
      للركض: biegać (na bieganie)
      ترسل: wysyła
      كثيرا: często
      رسالة: wiadomość
      تستعمل: używasz
