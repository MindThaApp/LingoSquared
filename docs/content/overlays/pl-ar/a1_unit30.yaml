    title: إلى اللقاء + dzień
    gloss: 'Znasz już إلى اللقاء (ilā al-liqāʾ, do zobaczenia). Możesz dodać dzień: إلى اللقاء يوم السبت (ilā al-liqāʾ yawm as-sabt), إلى اللقاء غدا (ilā al-liqāʾ ghadan).'
    note: Rozszerza wzór pożegnania z tematu o powitaniach na konkretny dzień.
  ar.a1.unit30.lesson05.teach.lyla_ttsl_bywsf:
    title: Kto czego używa?
    gloss: Layla codziennie dzwoni do Yusufa. Używa telefonu, a nie aplikacji. Yusuf nie ma w domu komputera, ale korzysta z internetu w telefonie. Karim każdego ranka sprawdza prognozę pogody. Potem idzie biegać. Sara często wysyła Layli wiadomości. A ty też codziennie używasz telefonu?
    note: Porównanie tego, jak wszystkie cztery postacie korzystają z urządzeń, na wzór tekstu porównawczego z tematu o sporcie.
