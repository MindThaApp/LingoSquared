    title: Czasownik z عن
    gloss: 'Po czasowniku أبحث (abḥath) występuje عن (ʿan): أبحث عن توقعات الطقس (abḥath ʿan tawaqquʿāt aṭ-ṭaqs). Natomiast أستخدم (astakhdim) łączy się z dopełnieniem bezpośrednio: أستخدم هاتفي.'
    note: 'عن (ʿan) znaczy: o, za (czymś). Każdy arabski czasownik ma swój przyimek, więc uczysz się ich razem.'
