    note: 'فكرة جيدة (fikra jayyida): przymiotnik جيدة kończy się na ة tak jak rzeczownik, bo oba są rodzaju żeńskiego. سأبحث (sa-abḥath) to czas przyszły: س + أبحث.'
  ar.a1.unit30.lesson04.teach.ywsf_aljw_mshms:
    title: Yusuf sprawdza pogodę
    gloss: 'Yusuf: W sobotę jest słonecznie!'
    note: 'الجو مشمس (al-jaww mushmis) znaczy: jest słonecznie, bez słowa „jest”. مشمس jest rodzaju męskiego, bo zgadza się z الجو.'
