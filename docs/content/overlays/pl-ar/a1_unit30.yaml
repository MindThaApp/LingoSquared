    gloss: Potem idzie pobiegać.
    note: 'ثم (thumma) znaczy: potem i jest osobnym słowem, inaczej niż و. يذهب للركض (yadhhab li-r-rakḍ) znaczy: idzie biegać; ل + الركض daje للركض.'
