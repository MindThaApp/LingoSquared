  ar.a1.unit30.lesson06.teach.sara_afdl_alsbaha:
    title: Plan Sary
    gloss: 'Sara: Wolę pływać, ale też przyjdę do parku.'
    note: 'أفضل (ufaḍḍil) znaczy: wolę. لكنني (lākinnanī) znaczy: ale ja, a سآتي (sa-ātī) znaczy: przyjdę.'
