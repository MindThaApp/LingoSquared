teaching:
  ar.a1.unit05.lesson01.teach.saa_a:
    title: Godzina
    gloss: godzina
    note: الساعة (as-sāʿa) dosłownie znaczy „godzina” (także „zegar”); odpowiedzi o czasie zaczynają się od tego słowa.
    example_gloss: Jest trzecia.
  ar.a1.unit05.lesson01.teach.kam_saa_a:
    title: Która jest godzina?
    gloss: Która jest godzina?
    note: 'كم الساعة؟ dosłownie pyta: „ile (wynosi) godzina?”'
    example_gloss: 'Layla powiedziała: Która jest godzina?'
  ar.a1.unit05.lesson01.teach.three_oclock:
    title: Trzecia
    gloss: Jest trzecia.
    note: 'الثالثة (ath-thālitha) to liczebnik porządkowy „trzecia” w rodzaju żeńskim, zgodny z żeńskim słowem الساعة: dosłownie „trzecia godzina”.'
    example_gloss: 'Layla powiedziała: Jest trzecia.'
  ar.a1.unit05.lesson01.teach.five_oclock:
    title: Godzina piąta
    gloss: Jest piąta.
    note: الخامسة (al-khāmisa), „piąta (godzina)”. Na poziomie A1 podajemy tylko pełne godziny.
    example_gloss: 'Layla powiedziała: Jest piąta.'
  ar.a1.unit05.lesson01.teach.sabah:
    title: Rano
    gloss: rano
    note: صباحا (ṣabāḥan) może doprecyzować, że chodzi o godzinę rano; في الصباح znaczy to samo.
    example_gloss: Jest piąta rano.
  ar.a1.unit05.lesson01.teach.masaa:
    title: Wieczorem
    gloss: wieczorem
    note: مساء (masāʾan) może doprecyzować, że chodzi o godzinę wieczorem; في المساء znaczy to samo.
    example_gloss: Jest piąta po południu.
  ar.a1.unit05.lesson02.teach.mata:
    title: Kiedy
    gloss: kiedy
    note: متى (matā) pyta, kiedy coś się dzieje.
    example_gloss: Kiedy jest lekcja?
  ar.a1.unit05.lesson02.teach.mata_lesson:
    title: Kiedy jest lekcja?
    gloss: Kiedy jest lekcja?
    note: W tak prostym pytaniu po arabsku pomija się czasownik „jest”.
    example_gloss: 'Jusuf powiedział: Kiedy jest lekcja?'
  ar.a1.unit05.lesson02.teach.lesson_at_five:
    title: Lekcja jest o piątej
    gloss: Lekcja jest o piątej.
    note: الساعة może też wprowadzać godzinę z planu zajęć.
    example_gloss: 'Layla powiedziała: Lekcja jest o piątej.'
  ar.a1.unit05.lesson02.teach.line01:
    title: Pytanie o godzinę
    gloss: Jusuf pyta o godzinę.
    note: كم الساعة؟ pyta o aktualną godzinę.
    example_gloss: 'Jusuf powiedział: Która jest godzina?'
  ar.a1.unit05.lesson02.teach.line02:
    title: Podaj godzinę
    gloss: Layla mówi, że jest trzecia.
    note: Odpowiedź zaczyna się od الساعة.
    example_gloss: 'Layla powiedziała: Jest trzecia.'
  ar.a1.unit05.lesson02.teach.line03:
    title: Zapytaj o czas
    gloss: Jusuf pyta, kiedy jest lekcja.
    note: و łączy to pytanie z poprzednią wypowiedzią.
    example_gloss: 'Jusuf powiedział: A kiedy jest lekcja?'
  ar.a1.unit05.lesson02.teach.line04:
    title: Podaj godzinę z planu
    gloss: Layla mówi, że lekcja jest o piątej.
    note: To odpowiedź o godzinie z planu zajęć.
    example_gloss: 'Layla powiedziała: Lekcja jest o piątej.'
