    title: Prawo
    gloss: prawa strona
    note: يمين (yamīn) oznacza prawą stronę; اليمين (al-yamīn) to „prawa strona”.
    example_gloss: W prawo.
  ar.a1.unit10.lesson01.teach.left:
    title: Lewo
    gloss: lewa strona
    note: يسار (yasār) oznacza lewą stronę; اليسار (al-yasār) to „lewa strona”.
    example_gloss: W lewo.
  ar.a1.unit10.lesson01.teach.forward:
    title: Prosto
    gloss: prosto
    note: إلى الأمام (ilā l-amām) dosłownie znaczy „do przodu”; to zwykły sposób, by powiedzieć „prosto” lub „naprzód”.
    example_gloss: Biblioteka jest prosto.
  ar.a1.unit10.lesson01.teach.to_right:
    title: W prawo
    gloss: w prawo
    note: إلى (ilā) wskazuje ruch w stronę kierunku lub miejsca.
    example_gloss: Targ jest po prawej.
  ar.a1.unit10.lesson02.teach.walk:
    title: Idź
    gloss: idź
    note: امش (imshi) to rozkaz „idź!” skierowany do mężczyzny; do kobiety mówi się امشي (imshī). To zwykły czasownik używany przy wskazywaniu drogi pieszo.
    example_gloss: Idź prosto.
  ar.a1.unit10.lesson02.teach.then:
    title: Potem
    gloss: wtedy
    note: ثم (thumma) łączy po kolei dwa etapy trasy.
    example_gloss: Idź prosto, a potem w prawo.
  ar.a1.unit10.lesson02.teach.route:
    title: Dwa etapy trasy
    gloss: Idź prosto, a potem w prawo
    note: Pierwszy etap + ثم + drugi etap. Czasownik nie powtarza się po ثم.
    example_gloss: 'Layla powiedziała: Idź prosto, a potem w prawo.'
  ar.a1.unit10.lesson02.teach.line01:
    title: Pytanie o bibliotekę
    gloss: Yusuf pyta, gdzie jest biblioteka.
    note: أين المكتبة؟ było już użyte przy miejscach.
    example_gloss: 'Yusuf powiedział: Gdzie jest biblioteka?'
  ar.a1.unit10.lesson02.teach.line02:
    title: Wskazywanie drogi
    gloss: Layla podaje dwa podstawowe etapy trasy.
    note: Layla mówi امش, bo zwraca się do mężczyzny; do kobiety powiedziałaby امشي.
    example_gloss: 'Layla powiedziała: Idź prosto, a potem w prawo.'
  ar.a1.unit10.lesson02.teach.line03:
    title: Podziękowanie
    gloss: Yusuf dziękuje.
    note: شكرا grzecznie kończy rozmowę, w której ktoś komuś pomógł.
    example_gloss: 'Yusuf powiedział: Dziękuję.'
  ar.a1.unit10.lesson02.teach.line04:
    title: Potwierdzenie miejsca
    gloss: Layla mówi, że biblioteka jest blisko targu.
    note: 'Wracamy tu do słowa قرب z lekcji o miejscach: biblioteka jest blisko targu.'
    example_gloss: 'Layla powiedziała: Biblioteka jest blisko targu.'
