    title: Tekst o pożarze
    gloss: 'W kawiarni językowej w bibliotece jest pożar. Pracownik mówi: Idźcie do wyjścia ewakuacyjnego! Nour potrzebuje pomocy. Lajla jest z Nour. Jusuf dzwoni do straży pożarnej. Wszyscy są na zewnątrz. To dobrze!'
