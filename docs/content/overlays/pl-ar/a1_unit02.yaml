teaching:
  ar.a1.unit02.lesson01.teach.ma_ismuka:
    title: Jak masz na imię?
    gloss: Jak Pan/Pani ma na imię?
    note: ما اسمك؟ (mā ismuk) to standardowy sposób zapytania o imię; zapis bez samogłosek pasuje do każdego rozmówcy.
  ar.a1.unit02.lesson01.teach.ismee:
    title: Nazywam się
    gloss: nazywam się
    note: اسمي (ismī) składa się z اسم („imię”) i końcówki dzierżawczej ـي („moje”).
    example_gloss: Nazywam się Karim.
  ar.a1.unit02.lesson01.teach.ana:
    title: Ja
    gloss: ja
    note: أنا (anā) to zaimek osobny „ja”; czasowniki arabskie same wskazują osobę, ale أنا używa się dla podkreślenia oraz w prostych zdaniach bezczasownikowych jak to.
    example_gloss: Jestem Sara.
  ar.a1.unit02.lesson01.teach.tasharrafna:
    title: Miło mi
    gloss: miło mi
    note: تشرفنا (tasharrafnā), dosłownie „zostaliśmy zaszczyceni”, to standardowa wzajemna odpowiedź przy poznaniu kogoś — każda z osób może powiedzieć to pierwsza.
  ar.a1.unit02.lesson02.teach.min_ayna:
    title: Skąd jesteś?
    gloss: Skąd Pan/Pani jest?
    note: من أين أنت؟ (min ayna anta do mężczyzny, min ayna anti do kobiety) pyta o pochodzenie; zapis bez samogłosek jest taki sam w obu przypadkach.
  ar.a1.unit02.lesson02.teach.ana_min:
    title: Jestem z
    gloss: jestem z
    note: Po أنا من (anā min) bezpośrednio następuje nazwa kraju lub miasta.
  ar.a1.unit02.lesson02.teach.lubnan:
    title: Liban
    gloss: Liban
    note: لبنان (lubnān) nie przyjmuje rodzajnika określonego, w przeciwieństwie do większości innych krajów w tej lekcji.
    example_gloss: Jestem z Libanu.
  ar.a1.unit02.lesson02.teach.misr:
    title: Egipt
    gloss: Egipt
    note: مصر (miṣr) również występuje bez rodzajnika określonego.
    example_gloss: Jestem z Egiptu.
  ar.a1.unit02.lesson02.teach.urdun:
    title: Jordania
    gloss: Jordania
    note: الأردن (al-ʾurdun) zawsze ma rodzajnik określony الـ jako część nazwy, tak jak المغرب i العراق w tej lekcji.
    example_gloss: Jestem z Jordanii.
  ar.a1.unit02.lesson02.teach.maghrib:
    title: Maroko
    gloss: Maroko
    note: المغرب (al-maghrib) dosłownie znaczy „zachód” – to ten sam rdzeń, od którego pochodzi nazwa modlitwy o zachodzie słońca.
    example_gloss: Jestem z Maroka.
  ar.a1.unit02.lesson02.teach.soorya:
    title: Syria
    gloss: Syria
    note: سوريا (sūryā) występuje bez rodzajnika określonego.
    example_gloss: Jestem z Syrii.
  ar.a1.unit02.lesson02.teach.iraq:
    title: Irak
    gloss: Irak
    note: العراق (al-ʿirāq) występuje z rodzajnikiem określonym.
    example_gloss: Jestem z Iraku.
  ar.a1.unit02.lesson03.teach.hal_anta_min:
    title: Czy jesteś z...?
    gloss: Czy jesteś z Egiptu?
    note: هل (hal) to partykuła pytająca w pytaniach rozstrzygnięcia (tak/nie), stawiana na początku zdania; sama nie ma osobnego znaczenia.
  ar.a1.unit02.lesson03.teach.naam:
    title: Tak
    gloss: tak
    note: نعم (naʿam) to standardowa odpowiedź twierdząca.
    example_gloss: Tak, jestem z Egiptu.
  ar.a1.unit02.lesson03.teach.laa:
    title: Nie
    gloss: nie
    note: لا (lā) to standardowa odpowiedź przecząca.
    example_gloss: Nie, jestem z Libanu.
  ar.a1.unit02.lesson03.teach.saidtu_biliqaaik:
    title: Miło było cię poznać
    gloss: Miło było cię poznać
    note: سعدت بلقائك (saʿidtu bi-liqāʾik) to cieplejsze zwrot na zakończenie niż تشرفنا, często używany tuż przed rozstaniem.
  ar.a1.unit02.lesson03.teach.marhaban_bik:
    title: Witaj
    gloss: witaj / jesteś tu mile widziany
    note: 'مرحبا بك (marḥaban bik) zawiera بك, czyli „tobie”: przyimek بـ z dołączoną końcówką zaimkową ـك (ty) – to samo بك co w أهلا بك.'
  ar.a1.unit02.lesson04.teach.line01:
    title: Powitanie na początek
    gloss: Jusuf wita Lejlę.
    note: Rozmowa zaczyna się od zwykłego مرحبا, jeszcze przed podaniem imion.
  ar.a1.unit02.lesson04.teach.line02:
    title: Powitanie na początek, odpowiedź
    gloss: Lejla odpowiada na powitanie.
    note: To samo słowo مرحبا służy obu stronom powitania.
  ar.a1.unit02.lesson04.teach.line03:
    title: Pytanie o imię
    gloss: Jusuf pyta ją o imię.
    note: ما اسمك؟ rozpoczyna przedstawianie się.
  ar.a1.unit02.lesson04.teach.line04:
    title: Pytanie o imię, odpowiedź
    gloss: Lejla odpowiada i pyta jego.
    note: وأنت؟ powtarza pytanie bez powtarzania całego zdania – to częsty skrót.
  ar.a1.unit02.lesson04.teach.line05:
    title: Odpowiedź i wzajemna radość
    gloss: Jusuf podaje swoje imię i mówi, że miło mu ją poznać.
    note: تشرفنا kończy wymianę imion.
  ar.a1.unit02.lesson04.teach.line06:
    title: Wzajemna radość, odpowiedź
    gloss: Lejla odpowiada tym samym zwrotem.
    note: تشرفنا naturalnie mówią obie osoby, nie tylko jedna.
  ar.a1.unit02.lesson04.teach.line07:
    title: Pytanie o pochodzenie
    gloss: Jusuf pyta, skąd ona pochodzi.
    note: من أين أنت؟ przenosi rozmowę na temat pochodzenia.
  ar.a1.unit02.lesson04.teach.line08:
    title: Pytanie o pochodzenie, odpowiedź
    gloss: Lejla odpowiada i pyta jego.
    note: Znów używa skrótu وأنت؟, tak jak w poprzedniej kwestii.
  ar.a1.unit02.lesson04.teach.line09:
    title: Podanie pochodzenia
    gloss: Jusuf mówi, że jest z Libanu.
    note: أنا من لبنان to ten sam wzór, który poznałeś(-aś) w lekcji 2.
  ar.a1.unit02.lesson04.teach.line10:
    title: Zakończenie rozmowy
    gloss: Lejla mówi, że miło jej było go poznać.
    note: سعدت بلقائك sygnalizuje, że rozmowa naturalnie dobiega końca.
  ar.a1.unit02.lesson04.teach.line11:
    title: Pożegnanie
    gloss: Jusuf zaprasza ją, by wpadała, kiedy zechce, i żegna się.
    note: دائما (zawsze) zmienia مرحبا بك w otwarte zaproszenie przed pożegnaniem مع السلامة.
  ar.a1.unit02.lesson04.teach.line12:
    title: Pożegnanie, odpowiedź
    gloss: Lejla się żegna.
    note: مع السلامة kończy rozmowę; zwrot ten poznałeś(-aś) w a1_unit01.
