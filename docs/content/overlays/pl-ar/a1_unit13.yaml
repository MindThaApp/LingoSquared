teaching:
  ar.a1.unit13.lesson01.teach.yesterday:
    title: Wczoraj
    gloss: wczoraj
    note: أمس (ams) znaczy „wczoraj”. Występuje z czasownikiem w czasie przeszłym, np. ذهبت, i może stać na końcu lub na początku zdania.
    example_gloss: Wczoraj poszedłem na targ.
  ar.a1.unit13.lesson01.teach.went:
    title: Poszedłem
    gloss: poszedłem
    note: 'ذهبت (dhahabtu) znaczy „poszedłem / poszłam”: końcówka czasu przeszłego -tu oznacza „ja”. Bez znaków samogłosek te same litery można też czytać dhahabta / dhahabti („poszedłeś” / „poszłaś”) lub dhahabat („poszła”); wskazuje na to kontekst.'
    example_gloss: Poszedłem na targ.
  ar.a1.unit13.lesson01.teach.bought:
    title: Kupiłem
    gloss: kupiłem
    note: اشتريت (ishtaraytu) znaczy „kupiłem / kupiłam”; tak jak ذهبت, ma końcówkę -tu oznaczającą „ja”.
    example_gloss: Kupiłem jabłka.
  ar.a1.unit13.lesson01.teach.apples_object:
    title: Jabłka
    gloss: jabłka
    note: تفاحا (tuffāḥan) to تفاح („jabłka”, z lekcji o zakupach) jako dopełnienie czasownika; dodatkowe ا zapisuje końcówkę -an.
    example_gloss: Kupiłem jabłka.
  ar.a1.unit13.lesson02.teach.what_did:
    title: Co robiłeś wczoraj?
    gloss: Co Pan/Pani robił(a) wczoraj?
    note: 'ماذا (mādhā) znaczy „co”; فعلت oznacza tu „zrobiłeś / zrobiłaś”: faʿalta do mężczyzny, faʿalti do kobiety (zapis jest taki sam). Yusuf pyta Laylę, więc mówi faʿalti.'
    example_gloss: 'Yusuf powiedział: Co robiłaś wczoraj?'
  ar.a1.unit13.lesson02.teach.drank:
    title: wypiłem / wypiłam
    gloss: wypiłem
    note: شربت (sharibtu) znaczy „wypiłem / wypiłam”; ma tę samą końcówkę -tu („ja”) co ذهبت i اشتريت.
    example_gloss: Wypiłem kawę.
  ar.a1.unit13.lesson02.teach.event_sequence:
    title: Ciąg niedawnych wydarzeń
    gloss: Poszedłem na targ. Kupiłem jabłka. Wypiłem kawę.
    note: Kilka krótkich zdań w czasie przeszłym z rzędu opowiada, co robiłeś(-aś). Każdy czasownik ma końcówkę -tu oznaczającą „ja”.
    example_gloss: Wczoraj poszedłem na targ. Kupiłem jabłka. Wypiłem kawę.
  ar.a1.unit13.lesson02.teach.line01:
    title: Pytanie o wczoraj
    gloss: Yusuf pyta Laylę, co robiła wczoraj.
    note: Yusuf pyta Laylę, czyli kobietę, więc فعلت czyta się tu faʿalti; do mężczyzny mówi się faʿalta.
    example_gloss: 'Yusuf powiedział: Co robiłaś wczoraj?'
  ar.a1.unit13.lesson02.teach.line02:
    title: Poszłam na targ
    gloss: Layla mówi, że poszła na targ.
    note: ذهبت wyraża zakończony ruch.
    example_gloss: 'Layla powiedziała: Poszłam na targ.'
  ar.a1.unit13.lesson02.teach.line03:
    title: Kupiłam jabłka
    gloss: Layla mówi, że kupiła jabłka.
    note: To dodaje drugą zakończoną czynność.
    example_gloss: 'Layla powiedziała: Kupiłam jabłka.'
  ar.a1.unit13.lesson02.teach.line04:
    title: Wypiłam kawę
    gloss: Layla mówi, że wypiła kawę.
    note: To kończy krótką relację o wydarzeniach.
    example_gloss: 'Layla powiedziała: Wypiłam kawę.'
