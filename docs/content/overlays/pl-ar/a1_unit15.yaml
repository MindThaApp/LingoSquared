teaching:
  ar.a1.unit15.lesson01.teach.than:
    title: Niż
    gloss: niż
    note: من (min) to to samo słowo co „z/od” (أنا من لبنان); po stopniu wyższym znaczy „niż”.
    example_gloss: Targ jest większy niż kawiarnia.
  ar.a1.unit15.lesson01.teach.bigger:
    title: Większy
    gloss: większy
    note: أكبر (akbar) pochodzi od كبير (kabīr, „duży”). Stopnie wyższe, takie jak أكبر, أصغر, أقرب i أرخص, zaczynają się od أ i mają tę samą formę dla rzeczowników rodzaju męskiego i żeńskiego.
    example_gloss: Targ jest większy niż kawiarnia.
  ar.a1.unit15.lesson01.teach.smaller:
    title: Mniejszy
    gloss: mniejszy
    note: أصغر (aṣghar), „mniejszy”, ma ten sam wzór z أ co أكبر.
    example_gloss: Kawiarnia jest mniejsza niż targ.
  ar.a1.unit15.lesson01.teach.nearer:
    title: Bliższy
    gloss: bliższy, bliżej
    note: 'أقرب (aqrab) porównuje odległość: „bliższy”, „bliżej”.'
    example_gloss: Kawiarnia jest bliżej niż targ.
  ar.a1.unit15.lesson01.teach.bigger_sentence:
    title: Targ jest większy
    gloss: Targ jest większy niż kawiarnia
    note: W tym porównaniu arabski nie potrzebuje osobnego słowa „jest”.
    example_gloss: 'Jusuf powiedział: Targ jest większy niż kawiarnia.'
  ar.a1.unit15.lesson02.teach.nearer:
    title: Bliższy
    gloss: bliższy, bliżej
    note: 'أقرب (aqrab) porównuje odległość: „bliższy”, „bliżej”.'
    example_gloss: Kawiarnia jest bliżej niż targ.
  ar.a1.unit15.lesson02.teach.cheaper:
    title: Tańszy
    gloss: tańszy
    note: 'أرخص (arkhaṣ) porównuje cenę: „tańszy”.'
    example_gloss: Woda jest tańsza niż kawa.
  ar.a1.unit15.lesson02.teach.nearer_sentence:
    title: Kawiarnia jest bliżej
    gloss: Kawiarnia jest bliżej niż targ
    note: Zachowaj من przed drugim elementem porównania.
    example_gloss: 'Jusuf powiedział: Kawiarnia jest bliżej niż targ.'
  ar.a1.unit15.lesson02.teach.line01:
    title: Pytanie o preferencje
    gloss: Layla pyta, co woli Jusuf.
    note: 'Layla mówi تفضل (tufaḍḍil), bo pyta mężczyznę; do kobiety: ماذا تفضلين؟'
    example_gloss: 'Layla powiedziała: Co wolisz?'
  ar.a1.unit15.lesson02.teach.line02:
    title: Wolę kawiarnię
    gloss: Jusuf mówi, że woli kawiarnię.
    note: Po أفضل może następować miejsce jako wybrana opcja.
    example_gloss: 'Jusuf powiedział: Wolę kawiarnię.'
  ar.a1.unit15.lesson02.teach.line03:
    title: Porównanie odległości
    gloss: Jusuf mówi, że kawiarnia jest bliżej niż targ.
    note: أقرب من podaje powód.
    example_gloss: 'Jusuf powiedział: Kawiarnia jest bliżej niż targ.'
  ar.a1.unit15.lesson02.teach.line04:
    title: Porównanie wielkości
    gloss: Nour dodaje, że targ jest większy niż kawiarnia.
    note: 'والسوق (was-sūq) to و („i”) połączone z السوق: „a targ”.'
    example_gloss: 'Nour powiedziała: A targ jest większy niż kawiarnia.'
