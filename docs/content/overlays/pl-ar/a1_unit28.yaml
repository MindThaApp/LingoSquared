    title: Yusuf reaguje
    gloss: 'Yusuf: Jak miło, ja często gram tam w piłkę nożną.'
  ar.a1.unit28.lesson05.teach.lyla_tmars_alywgha:
    title: Layla i Sara o sporcie
    gloss: Layla uprawia jogę dwa razy w tygodniu. Lubi poruszać się spokojnie. Sara nie uprawia jogi, ale kocha pływanie. Sara pływa dużo, prawie co tydzień. Jaki sport ty uprawiasz?
    note: ليلى تمارس اليوغا (laylā tumāris al-yūghā) i سارة تسبح (sāra tasbaḥ) mają czasowniki zaczynające się od ت (ta-), bo obie są kobietami. لا przed czasownikiem tworzy przeczenie.
    glosses:
      تمارس: uprawia, robi
      مرتين: dwa razy
      الأسبوع: tydzień
      اليوغا: joga
      تحب: uwielbia
      بهدوء: spokojnie
      تتحرك: ruch
      السباحة: pływanie
      تسبح: pływa
      كثيرا: często
      تقريبا: prawie
      ما: jaki
      الرياضة: sport
