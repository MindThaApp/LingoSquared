    title: Dwa sposoby mówienia o sporcie
    gloss: أمارس الرياضة (umāris ar-riyāḍa) mówi o sporcie w ogóle, a أمارس اليوغا (umāris al-yūghā) nazywa konkretny sport. Obie formy są poprawne.
    note: رياضة (riyāḍa) to rzeczownik rodzaju żeńskiego, a اليوغا (al-yūghā) to nazwa sportu z przedimkiem ال.
