    gloss: 'Czasownik zmienia się zależnie od osoby: أنا أركض (anā arkuḍ), كريم يركض (karīm yarkuḍ), أنت تركض (anta tarkuḍ).'
    note: 'Pierwsza litera czasownika pokazuje, kto wykonuje czynność: أ (a-) to „ja”, ي (ya-) to „on”, a ت (ta-) to „ty” lub „ona”.'
