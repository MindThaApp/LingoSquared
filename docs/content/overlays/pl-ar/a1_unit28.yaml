    gloss: 'Aby zaproponować coś wspólnie, użyj هل (hal) + czasownika w formie „my”: هل نتمشى؟ (hal natamashshā?) i هل نمارس الرياضة؟ (hal numāris ar-riyāḍa?).'
    note: Powtarza dokładnie tę samą konstrukcję proponowania planów, którą znasz z lekcji o planach.
