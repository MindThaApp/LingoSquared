    gloss: كثيرا (kathīran) i كل يوم (kull yawm) są ogólne; مرتين في الأسبوع (marratayn fī al-usbūʿ) podaje dokładną częstotliwość. مرتين to liczba podwójna od مرة (marra, „raz”).
