  ar.a1.unit28.lesson01.teach.nqwl_amars_qbl:
    title: 'Czasowniki przy sporcie: أمارس i ألعب'
    gloss: 'Przed większością sportów mów أمارس (umāris, „uprawiam”): أمارس اليوغا (umāris al-yūghā), أمارس الركض (umāris ar-rakḍ), أمارس السباحة (umāris as-sibāḥa). Przy grach w piłkę mów ألعب (alʿab, „gram”): ألعب كرة القدم.'
    note: أمارس (umāris) pasuje do większości sportów, ale gry w piłkę wymagają ألعب (alʿab), więc ucz się czasownika razem ze sportem.
