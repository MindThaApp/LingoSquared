  ar.a1.unit29.lesson05.teach.lyla_tsafr_kl:
    title: Kto jak jeździ?
    gloss: Lajla codziennie jeździ do pracy pociągiem. Jusuf zwykle jeździ rowerem, ale gdy pada deszcz, też jedzie pociągiem. Karim woli jeździć samochodem. Sara mieszka blisko i chodzi do pracy pieszo. A ty, jak dojeżdżasz do pracy?
    note: Czasowniki dotyczące kobiet (تسافر, تسكن, تمشي) zaczynają się od ت (ta-), a czasowniki dotyczące mężczyzn (يركب, يذهب, يقود, يفضل) zaczynają się od ي (ya-).
    glosses:
      تسافر: dojeżdża
      كل: każdy
      يوم: dzień
      بالقطار: pociągiem
      عملها: praca
      يركب: jeździ rowerem
      غالبا: zwykle
      أمطرت: pada deszcz
      يذهب: bierze
      يقود: jedzie
      يفضل: woli
      السيارة: samochód
      تسكن: mieszka
      قريبا: w pobliżu
      وتمشي: chodzi
      تذهب: dojeżdżasz
