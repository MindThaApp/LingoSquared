teaching:
  ar.a1.unit18.lesson01.teach.work:
    title: Praca
    gloss: praca
    note: 'عمل (ʿamal) znaczy „praca”. ما عملك؟ pyta o czyjąś pracę; końcówka ـك oznacza „twój/twoja”: ʿamaluka do mężczyzny, ʿamaluki do kobiety, zapisywane tak samo.'
    example_gloss: Czym się zajmujesz?
  ar.a1.unit18.lesson01.teach.engineer:
    title: Inżynier
    gloss: inżynier
    note: مهندس (muhandis) to forma męska, użyta w odniesieniu do Yusufa; kobieta mówi أنا مهندسة (anā muhandisa).
    example_gloss: Jestem inżynierem.
  ar.a1.unit18.lesson01.teach.office:
    title: Biuro
    gloss: biuro
    note: مكتب (maktab) to biuro; في مكتب znaczy „w biurze”.
    example_gloss: Pracuję w biurze.
  ar.a1.unit18.lesson01.teach.workplace_sentence:
    title: Pracuję w biurze
    gloss: pracuję w biurze
    note: أعمل (aʿmal) znaczy „pracuję”; ma ten sam rdzeń co عمل („praca”), a أ na początku oznacza „ja”.
    example_gloss: 'Yusuf powiedział: Pracuję w biurze.'
  ar.a1.unit18.lesson02.teach.write:
    title: Piszę
    gloss: piszę
    note: أكتب (aktub) znaczy „piszę”.
    example_gloss: W pracy piszę.
  ar.a1.unit18.lesson02.teach.read:
    title: Czytam
    gloss: czytam
    note: أقرأ (aqraʾ) znaczy „czytam”.
    example_gloss: Czytam w pracy.
  ar.a1.unit18.lesson02.teach.at_work:
    title: W pracy
    gloss: w pracy
    note: العمل (al-ʿamal) to „praca”; في العمل znaczy „w pracy”.
    example_gloss: W pracy piszę i czytam.
  ar.a1.unit18.lesson02.teach.line01:
    title: Pytanie o pracę
    gloss: Layla pyta Yusufa o jego pracę.
    note: يا يوسف to zwrot do Yusufa po imieniu (wołacz).
    example_gloss: 'Layla zapytała: Czym się zajmujesz zawodowo, Yusufie?'
  ar.a1.unit18.lesson02.teach.line02:
    title: Podanie zawodu
    gloss: Yusuf mówi, że jest inżynierem.
    note: Nie potrzeba osobnego słowa odpowiadającego „jestem”.
    example_gloss: 'Yusuf powiedział: Jestem inżynierem.'
  ar.a1.unit18.lesson02.teach.line03:
    title: Podanie miejsca pracy
    gloss: Yusuf mówi, że pracuje w biurze.
    note: أعمل في podaje miejsce pracy.
    example_gloss: 'Yusuf powiedział: Pracuję w biurze.'
  ar.a1.unit18.lesson02.teach.line04:
    title: Pytanie o zajęcia
    gloss: Layla pyta, co Yusuf robi każdego dnia.
    note: 'To znane już pytanie o codzienne zajęcia; تفعل mówimy do mężczyzny. Do kobiety: ماذا تفعلين كل يوم؟'
    example_gloss: 'Layla zapytała: Co robisz każdego dnia?'
  ar.a1.unit18.lesson02.teach.line05:
    title: Podanie zajęć
    gloss: Yusuf mówi, że w pracy pisze i czyta.
    note: 'و (wa, „i”) łączy dwie czynności i pisze się razem z następnym słowem: وأقرأ.'
    example_gloss: 'Yusuf powiedział: W pracy piszę i czytam.'
