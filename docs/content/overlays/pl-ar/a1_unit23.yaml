teaching:
  ar.a1.unit23.lesson01.teach.phone:
    title: Telefon
    gloss: telefon
    note: هاتف (hātif) oznacza telefon.
    example_gloss: To jest telefon.
  ar.a1.unit23.lesson01.teach.hear:
    title: Słyszę cię
    gloss: słyszę cię
    note: أسمعك (asmaʿuka do mężczyzny, asmaʿuki do kobiety) oznacza „słyszę cię”; لا أسمعك (lā asmaʿuk) oznacza „nie słyszę cię”.
    example_gloss: Nie słyszę cię.
  ar.a1.unit23.lesson01.teach.repeat:
    title: Powtórz
    gloss: powtórz
    note: 'أعد (aʿid) mówimy do mężczyzny; do kobiety: أعيدي (aʿīdī). أعد من فضلك to uprzejma prośba o powtórzenie.'
    example_gloss: Nie słyszę cię. Powtórz, proszę.
  ar.a1.unit23.lesson01.teach.slowly:
    title: Mów powoli
    gloss: mów powoli
    note: 'تكلم ببطء (takallam bi-buṭʾ) mówimy do mężczyzny; do kobiety: تكلمي ببطء (takallamī bi-buṭʾ).'
    example_gloss: Mów powoli, proszę.
  ar.a1.unit23.lesson02.teach.message:
    title: Wiadomość
    gloss: wiadomość
    note: رسالة (risāla) to wiadomość; może też oznaczać list.
    example_gloss: To jest wiadomość.
  ar.a1.unit23.lesson02.teach.appointment:
    title: Spotkanie
    gloss: termin, wizyta
    note: موعد (mawʿid) oznacza umówione spotkanie lub termin; الموعد (al-mawʿid) to „to spotkanie”.
    example_gloss: Spotkanie jest o piątej.
  ar.a1.unit23.lesson02.teach.line01:
    title: Odbieranie telefonu
    gloss: Yusuf wita Laylę przez telefon i podaje swoje imię.
    note: Przez telefon أنا يوسف (anā Yūsuf) służy do przedstawienia się.
    example_gloss: 'Yusuf powiedział: Cześć, jestem Yusuf.'
  ar.a1.unit23.lesson02.teach.line02:
    title: Nie słychać
    gloss: Layla mówi, że nie słyszy Yusufa.
    note: To wprowadza prośbę o wyjaśnienie.
    example_gloss: 'Layla powiedziała: Cześć, Yusuf, nie słyszę cię.'
  ar.a1.unit23.lesson02.teach.line03:
    title: Prośba o wolniejsze mówienie
    gloss: Layla prosi Yusufa, żeby mówił powoli.
    note: من فضلك sprawia, że prośba jest uprzejma; Layla mówi تكلم, bo zwraca się do mężczyzny.
    example_gloss: 'Layla powiedziała: Mów powoli, proszę.'
  ar.a1.unit23.lesson02.teach.line04:
    title: Najważniejsza informacja
    gloss: Yusuf mówi, że spotkanie jest o piątej.
    note: في الساعة الخامسة (fī s-sāʿa l-khāmisa) oznacza „o piątej”.
    example_gloss: 'Yusuf powiedział: Spotkanie jest o piątej.'
  ar.a1.unit23.lesson02.teach.line05:
    title: Prośba o powtórzenie
    gloss: Layla prosi Yusufa o powtórzenie.
    note: أعد من فضلك to prośba o powtórzenie.
    example_gloss: 'Layla powiedziała: Powtórz, proszę.'
  ar.a1.unit23.lesson02.teach.line06:
    title: Powtórzenie informacji
    gloss: Yusuf powtarza godzinę spotkania.
    note: Powtórzone zdanie potwierdza godzinę.
    example_gloss: 'Yusuf powiedział: Spotkanie jest o piątej.'
