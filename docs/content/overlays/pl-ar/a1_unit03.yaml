teaching:
  ar.a1.unit03.lesson01.teach.waahid:
    title: Jeden
    gloss: jeden
    note: واحد (wāḥid) używa się też samodzielnie, bez rzeczownika, aby odpowiedzieć na pytanie „ile?”.
    example_gloss: Mam jedną książkę.
  ar.a1.unit03.lesson01.teach.ithnaan:
    title: Dwa
    gloss: dwa
    note: اثنان (ithnān) to samodzielna forma podstawowa liczby „dwa”.
    example_gloss: Mam dwóch braci.
  ar.a1.unit03.lesson01.teach.thalaatha:
    title: Trzy
    gloss: trzy
    note: ثلاثة (thalātha) to samodzielna forma podstawowa liczby „trzy”.
    example_gloss: Jeden, dwa, trzy.
  ar.a1.unit03.lesson01.teach.arbaa:
    title: Cztery
    gloss: cztery
    note: أربعة (arbaʿa) to samodzielna forma podstawowa liczby „cztery”.
    example_gloss: Mam cztery książki.
  ar.a1.unit03.lesson01.teach.khamsa:
    title: Pięć
    gloss: pięć
    note: خمسة (khamsa) to samodzielna forma podstawowa liczby „pięć”.
    example_gloss: Mam pięć książek.
  ar.a1.unit03.lesson02.teach.sitta:
    title: Sześć
    gloss: sześć
    note: ستة (sitta) to samodzielna forma podstawowa liczby „sześć”.
    example_gloss: Mam sześć książek.
  ar.a1.unit03.lesson02.teach.sabaa:
    title: Siedem
    gloss: siedem
    note: سبعة (sabʿa) to samodzielna forma podstawowa liczby „siedem”.
    example_gloss: Mam siedem książek.
  ar.a1.unit03.lesson02.teach.thamaaniya:
    title: Osiem
    gloss: osiem
    note: ثمانية (thamāniya) to samodzielna forma podstawowa liczby „osiem”.
    example_gloss: Mam osiem książek.
  ar.a1.unit03.lesson02.teach.tisaa:
    title: Dziewięć
    gloss: dziewięć
    note: تسعة (tisʿa) to samodzielna forma podstawowa liczby „dziewięć”.
    example_gloss: Mam dziewięć dirhamów.
  ar.a1.unit03.lesson02.teach.ashara:
    title: Dziesięć
    gloss: dziesięć
    note: عشرة (ʿashara) to samodzielna forma podstawowa liczby „dziesięć”.
    example_gloss: Mam dziesięć dinarów.
  ar.a1.unit03.lesson03.teach.kam:
    title: Ile to kosztuje?
    gloss: Ile to kosztuje?
    note: كم هذا؟ (kam hādhā) to proste pytanie o cenę; bardzo częste jest też بكم هذا؟ (bi-kam hādhā, dosł. „za ile to?”).
  ar.a1.unit03.lesson03.teach.raqam:
    title: Liczba
    gloss: numer
    note: رقم (raqam) to ogólne słowo oznaczające liczbę lub numer, np. numer telefonu.
    example_gloss: Mój numer to jeden.
  ar.a1.unit03.lesson03.teach.dialogue_line01:
    title: Zapytaj o cenę
    gloss: Yusuf pyta, ile coś kosztuje.
    note: كم هذا؟ otwiera rozmowę.
  ar.a1.unit03.lesson03.teach.dialogue_line02:
    title: Podaj cenę
    gloss: Layla mówi, że to kosztuje pięć.
    note: بخمسة łączy przyimek بـ („za”) bezpośrednio z liczbą.
  ar.a1.unit03.lesson03.teach.dialogue_line03:
    title: Pytanie o inny przedmiot
    gloss: Yusuf wskazuje coś innego.
    note: وهذا؟ skraca pytanie, odwołując się do poprzedniego kontekstu.
  ar.a1.unit03.lesson03.teach.dialogue_line04:
    title: Podaj drugą cenę
    gloss: Layla mówi, że to kosztuje dziesięć.
    note: بعشرة działa tak samo jak بخمسة.
  ar.a1.unit03.lesson03.teach.dialogue_line05:
    title: Podziękowanie
    gloss: Yusuf jej dziękuje.
    note: شكرا, znane z lekcji o powitaniach, kończy rozmowę.
