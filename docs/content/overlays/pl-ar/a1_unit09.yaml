teaching:
  ar.a1.unit09.lesson01.teach.place:
    title: Miejsce
    gloss: miejsce
    note: مكان (makān) to ogólne słowo oznaczające miejsce. هذا („to”) pojawiło się przy liczbach.
    example_gloss: To jest miejsce.
  ar.a1.unit09.lesson01.teach.library:
    title: Biblioteka
    gloss: biblioteka
    note: مكتبة (maktaba) może oznaczać bibliotekę lub księgarnię; tutaj to biblioteka. المكتبة (al-maktaba) to „biblioteka” z rodzajnikiem określonym.
    example_gloss: Biblioteka jest tutaj.
  ar.a1.unit09.lesson01.teach.market:
    title: Targ
    gloss: targ
    note: سوق (sūq) oznacza targ; السوق (as-sūq) to „targ” z rodzajnikiem określonym.
    example_gloss: Targ jest tutaj.
  ar.a1.unit09.lesson01.teach.cafe:
    title: Kawiarnia
    gloss: kawiarnia
    note: مقهى (maqhā) oznacza kawiarnię; to słowo jest spokrewnione z قهوة („kawa”). المقهى (al-maqhā) to „kawiarnia” z rodzajnikiem określonym.
    example_gloss: Kawiarnia jest tutaj.
  ar.a1.unit09.lesson01.teach.here:
    title: Tutaj
    gloss: tutaj
    note: 'هنا (hunā) zwykle stoi po nazwie miejsca: المقهى هنا, czyli „kawiarnia jest tutaj”. W takim zdaniu po arabsku nie używa się słowa „jest”.'
    example_gloss: Kawiarnia jest tutaj.
  ar.a1.unit09.lesson02.teach.where_library:
    title: Gdzie jest biblioteka?
    gloss: Gdzie jest biblioteka?
    note: أين (ayna) pyta o miejsce („gdzie”); znasz je z pytania من أين أنت؟ („skąd jesteś?”).
    example_gloss: 'Jusuf powiedział: Gdzie jest biblioteka?'
  ar.a1.unit09.lesson02.teach.near:
    title: Blisko
    gloss: w pobliżu
    note: 'قرب (qurba) oznacza „blisko, w pobliżu” i stoi przed miejscem, do którego się odnosi: قرب المكتبة, czyli „w pobliżu biblioteki”. بالقرب من (bi-l-qurbi min) znaczy to samo.'
    example_gloss: Kawiarnia jest w pobliżu biblioteki.
  ar.a1.unit09.lesson02.teach.library_near_market:
    title: Biblioteka jest w pobliżu targu
    gloss: Biblioteka jest w pobliżu targu
    note: W tym zdaniu po arabsku nie potrzeba osobnego słowa „jest”.
    example_gloss: 'Layla powiedziała: Biblioteka jest w pobliżu targu.'
  ar.a1.unit09.lesson02.teach.line01:
    title: Zapytaj, gdzie
    gloss: Jusuf pyta, gdzie jest biblioteka.
    note: أين otwiera pytanie o miejsce.
    example_gloss: 'Jusuf powiedział: Gdzie jest biblioteka?'
  ar.a1.unit09.lesson02.teach.line02:
    title: Wskaż, gdzie jest biblioteka
    gloss: Layla mówi, że biblioteka jest tutaj, w pobliżu targu.
    note: 'هنا i قرب mogą wystąpić razem: tutaj, w pobliżu targu.'
    example_gloss: 'Layla powiedziała: Biblioteka jest tutaj, w pobliżu targu.'
  ar.a1.unit09.lesson02.teach.line03:
    title: Zapytaj o kawiarnię
    gloss: Jusuf pyta, gdzie jest kawiarnia.
    note: 'و (wa, „i”) pisze się łącznie z następnym słowem: وأين (wa-ayna), czyli „a gdzie”.'
    example_gloss: 'Jusuf powiedział: A gdzie jest kawiarnia?'
  ar.a1.unit09.lesson02.teach.line04:
    title: Wskaż, gdzie jest kawiarnia
    gloss: Layla mówi, że kawiarnia jest w pobliżu biblioteki.
    note: 'Miejsce + قرب + drugie miejsce: المقهى قرب المكتبة, czyli „kawiarnia jest w pobliżu biblioteki”.'
    example_gloss: 'Layla powiedziała: Kawiarnia jest w pobliżu biblioteki.'
