    title: Zaimki dołączone do czasownika
    gloss: 'Zaimek dołącza się na końcu czasownika: أدعوك (adʿūka, zapraszam cię), أدعوه (adʿūhu, zapraszam go), أدعوها (adʿūhā, zapraszam ją).'
