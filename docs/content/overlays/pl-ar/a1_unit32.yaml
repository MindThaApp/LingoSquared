  ar.a1.unit32.lesson05.teach.ywm_alsbt_ayd:
    title: Kto co robi na imprezie?
    gloss: W sobotę są urodziny Sary. Świętujemy na imprezie. Yusuf zaprasza Karima i Laylę na imprezę. Karim lubi świętować z przyjaciółmi. Layla też przyjdzie na imprezę. Wszyscy cieszą się razem z Sarą.
    note: 'Podsumowanie planu imprezy: kto co robi.'
    glosses:
      السبت: sobota
      ميلاد: narodziny (jak w słowie „urodziny”)
      نحتفل: świętować
      بحفلة: impreza
      يدعو: zaprasza
      إلى: na, do (jak w „zaprasza ... na imprezę”)
      الاحتفال: świętuje
      يحب: chętnie
      الأصدقاء: przyjaciele
      ستأتي: przychodzi
      الجميع: wszyscy
      سعداء: zadowoleni
  ar.a1.unit32.lesson05.teach.ywsf_ydaw_krym:
    title: Yusuf zaprasza Karima i Laylę
    gloss: Yusuf zaprasza Karima i Laylę na imprezę.
  ar.a1.unit32.lesson05.teach.aljmya_sadaa_mn:
    title: Wszyscy cieszą się razem z Sarą
    gloss: Wszyscy cieszą się razem z Sarą.
  ar.a1.unit32.lesson06.teach.ywsf_ayd_mylad:
