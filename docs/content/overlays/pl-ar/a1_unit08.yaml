  ar.a1.unit08.lesson02.teach.line02:
    title: Podaj cenę
    gloss: Sprzedawca mówi, że jabłka kosztują dziesięć dirhamów.
    note: بعشرة dołącza przedrostek ceny do słowa عشرة.
    example_gloss: 'Sprzedawca powiedział: Jabłka kosztują dziesięć dirhamów.'
  ar.a1.unit08.lesson02.teach.line03:
