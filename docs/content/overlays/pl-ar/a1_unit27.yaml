teaching:
  ar.a1.unit27.lesson01.teach.alhywan_hywan_alyf:
    title: Zwierzę, zwierzę domowe
    gloss: zwierzę / zwierzę domowe
    note: حيوان (ḥayawān) znaczy „zwierzę”, a حيوان أليف (ḥayawān alīf) znaczy „zwierzę domowe”. أليف (alīf) to przymiotnik oznaczający „oswojony”, dlatego stoi po rzeczowniku.
    example_gloss:
    - Pies to zwierzę.
    - Pies to też zwierzę domowe.
  ar.a1.unit27.lesson01.teach.alklb_alqta:
    title: Pies i kot
    gloss: pies / kot
    example_gloss:
    - Layla ma psa.
    - Karim ma kota.
  ar.a1.unit27.lesson01.teach.alsmka_altair:
    title: Ryba i ptak
    gloss: ryba / ptak
    example_gloss:
    - Dziadek ma rybę.
    - Nour ma ptaka.
  ar.a1.unit27.lesson01.teach.hl_ldyk_hywan:
    title: Masz zwierzę domowe?
    gloss: Masz zwierzę domowe?
    note: 'هل لديك (hal ladayka) pyta: „czy masz”. Do kobiety pisze się to tak samo, ale ostatnia samogłoska to i: ladayki. هل (hal) otwiera pytanie typu tak/nie.'
  ar.a1.unit27.lesson01.teach.nam_ldy_klb:
    title: Tak, mam psa
    gloss: Tak, mam psa.
    note: Prosta odpowiedź twierdząca z nowym słownictwem z tej lekcji.
  ar.a1.unit27.lesson01.teach.la_lys_ldy:
    title: Nie, nie mam zwierzęcia domowego
    gloss: Nie, nie mam zwierzęcia domowego.
    note: 'ليس لدي (laysa ladayya) znaczy „nie mam”: ليس (laysa) neguje, a لدي (ladayya) znaczy „mam”.'
  ar.a1.unit27.lesson01.teach.nnfy_almlkya_babara:
    title: 'Brak posiadania: ليس لدي'
    gloss: 'Aby powiedzieć, że czegoś nie masz, użyj ليس لدي (laysa ladayya): ليس لدي وقت (nie mam czasu), ليس لدي حيوان أليف (nie mam zwierzęcia domowego).'
    note: ليس لدي pasuje do każdego rzeczownika i nie zmienia się ze względu na rodzaj. Gdy chodzi o „on” i „ona”, mówi się ليس لديه (laysa ladayhi) i ليس لديها (laysa ladayhā).
  ar.a1.unit27.lesson02.teach.akhdh_alhywan_fy:
    title: Wyprowadzać na spacer (zwierzę)
    gloss: wyprowadzać na spacer (zwierzę)
    note: أخذ الحيوان في نزهة (akhdh al-ḥayawān fī nuzha) dosłownie znaczy „zabieranie zwierzęcia na spacer”. Czasownik to أخذ, „brać”.
    example_gloss: Codziennie wyprowadzam psa na spacer.
  ar.a1.unit27.lesson02.teach.ytghyr_alfal_ma:
    title: Czasownik zmienia się według osoby
    gloss: 'Czasownik zmienia się w zależności od osoby: آخذ الكلب في نزهة (ākhudh al-kalb fī nuzha) – zabieram psa na spacer; كريم يأخذ كلبه في نزهة (karīm yākhudh kalbahu fī nuzha) – Karim zabiera swojego psa na spacer.'
    note: Początkowa litera أ (a-) oznacza „ja”, a ي (ya-) oznacza „on”. نزهة (nuzha) to spacer lub krótka wycieczka.
  ar.a1.unit27.lesson02.teach.itaam_alhywan:
    title: Karmić
    gloss: karmić
    example_gloss: Codziennie karmię kota.
  ar.a1.unit27.lesson02.teach.allab_ma_alhywan:
    title: Bawić się z
    gloss: bawić się z
    example_gloss: Karim bawi się ze swoją kotką.
  ar.a1.unit27.lesson02.teach.akhdh_alklb_fy:
    title: Codziennie wyprowadzam psa
    gloss: Codziennie wyprowadzam psa na spacer.
    note: 'كل يوم (kull yawm) znaczy „codziennie”: كل + rzeczownik w liczbie pojedynczej bez ال.'
  ar.a1.unit27.lesson02.teach.atam_alqta_kl:
    title: Codziennie karmię kota
    gloss: Codziennie karmię kota.
    note: أطعم (uṭʿim) znaczy „karmię”. القطة (al-qiṭṭa) jest rodzaju żeńskiego, a ال jest dołączone do rzeczownika.
  ar.a1.unit27.lesson03.teach.jma_klb_hw:
    title: 'Liczba mnoga: كلب → كلاب'
    gloss: 'Wiele liczb mnogich jest nieregularnych, więc ucz się ich razem z rzeczownikiem: كلب (kalb) ma liczbę mnogą كلاب (kilāb), قطة (qiṭṭa) – قطط (qiṭaṭ), a طائر (ṭāʾir) – طيور (ṭuyūr).'
    note: W arabskim przeważają liczby mnogie łamane, więc każdą z nich uczy się razem z jej rzeczownikiem; liczba mnoga nazw zwierząt łączy się z przymiotnikiem w liczbie pojedynczej rodzaju żeńskiego.
  ar.a1.unit27.lesson03.teach.klab_qtt:
    title: Psy i koty
    gloss: psy / koty
    example_gloss:
    - Yusuf kocha psy.
    - Sara kocha koty.
  ar.a1.unit27.lesson03.teach.asmak_tywr:
    title: Ryby i ptaki (liczba mnoga)
    gloss: ryby / ptaki
    example_gloss:
    - Uwielbiam ryby.
    - Dziadek uwielbia ptaki.
  ar.a1.unit27.lesson03.teach.ahb_alhywanat:
    title: Kocham zwierzęta
    gloss: Kocham zwierzęta.
    note: أحب الحيوانات (uḥibb al-ḥayawānāt) znaczy „kocham zwierzęta”. Liczba mnoga kończy się na ات i ma dołączony rodzajnik ال.
  ar.a1.unit27.lesson03.teach.sara_thb_alqtt:
    title: Sara kocha koty, ale nie ma zwierzęcia
    gloss: Sara kocha koty, ale nie ma zwierzęcia domowego.
    note: 'Przeciwstawienie: kochać zwierzęta, a mimo to żadnego nie mieć.'
  ar.a1.unit27.lesson04.teach.ywsf_hl_ldyk:
    title: Yusuf pyta o zwierzę domowe
    gloss: 'Yusuf: Masz zwierzę domowe, Layla?'
  ar.a1.unit27.lesson04.teach.lyla_nam_ldy:
    title: Layla ma psa
    gloss: 'Layla: Tak, mam psa.'
  ar.a1.unit27.lesson04.teach.ywsf_kyf_ybdw:
    title: Yusuf pyta, jak pies wygląda
    gloss: 'Yusuf: Jak on wygląda?'
    note: كيف يبدو؟ (kayfa yabdū?) pyta, jak on wygląda. يبدو (yabdū) jest rodzaju męskiego, ponieważ كلب, „pies”, to rzeczownik rodzaju męskiego.
  ar.a1.unit27.lesson04.teach.lyla_lh_shar:
    title: Layla opisuje swojego psa
    gloss: 'Layla: Ma brązową sierść i jest mały.'
    note: Słownictwo o kolorze włosów i wielkości z lekcji o wyglądzie, tym razem do opisu sierści zwierzęcia, a nie włosów człowieka.
  ar.a1.unit27.lesson04.teach.nqwl_hw_llklb:
    title: Zaimki przy zwierzętach
    gloss: 'Każde słowo oznaczające zwierzę jest rodzaju męskiego lub żeńskiego: pies to هو (huwa, on), a kot to هي (hiya, ona). Końcówka ه w أطعمه (uṭʿimuhu) znaczy „go”.'
    note: Słowo rodzaju męskiego oznaczające zwierzę, jak كلب, łączy się z zaimkami i przymiotnikami rodzaju męskiego; słowo rodzaju żeńskiego, jak قطة, z żeńskimi.
  ar.a1.unit27.lesson04.teach.ywsf_hl_takhdhynh:
    title: Yusuf pyta o spacery
    gloss: 'Yusuf: Chodzisz z nim na spacer codziennie?'
  ar.a1.unit27.lesson04.teach.lyla_nam_akhdhh:
    title: Layla opisuje swój codzienny rozkład
    gloss: 'Layla: Tak, codziennie chodzę z nim na spacer i karmię go.'
  ar.a1.unit27.lesson05.teach.ywsf_wsara_yhban:
    title: Yusuf, Sara i Karim o zwierzętach
    gloss: 'Yusuf i Sara oboje kochają zwierzęta, ale żadne z nich nie ma zwierzęcia domowego. Yusuf kocha psy, a Sara koty. Karim natomiast ma zwierzę domowe: kota. Często bawi się ze swoim kotem i codziennie daje mu jeść. Masz zwierzę domowe?'
    note: 'Przeciwstawienie: kochać zwierzę a rzeczywiście je mieć.'
    glosses:
      يحبان: kochać
      كلاهما: oboje
      الحيوانات: zwierzęta
      منهما: z nich (żaden z nich)
      أليف: zwierzę domowe (dosł. oswojone)
      الكلاب: psy
      القطط: koty
      قطة: kot
      يلعب: bawi się
      ويعطي: daje
      كل: każdy
      طعاما: karma
  ar.a1.unit27.lesson05.teach.krym_ylab_ma:
    title: Karim często bawi się ze swoją kotką
    gloss: Karim często bawi się ze swoją kotką.
    note: 'قطته (qiṭṭatuhu) znaczy „jego kotka”: końcówka ه (hu) oznacza „jego”, a ة w قطة zmienia się w ت przed nią.'
  ar.a1.unit27.lesson05.teach.ahb_alklab_lys:
    title: Kocham psy. Nie mam zwierzęcia domowego.
    gloss: Kocham psy. Nie mam zwierzęcia domowego.
    note: Wzorcowa odpowiedź z dwóch zdań, którą możesz wykorzystać w zadaniu pisemnym z tej lekcji.
  ar.a1.unit27.lesson06.teach.lyla_ya_nwr:
    title: Layla pyta Nour
    gloss: 'Layla: Nour, ty też masz zwierzę domowe?'
  ar.a1.unit27.lesson06.teach.nwr_nam_ldy:
    title: Nour ma ptaka o imieniu Pico
    gloss: 'Nour: Tak, mam ptaka. Ma na imię Pico.'
    note: اسمه (ismuhu) znaczy „jego imię”; ه na końcu oznacza „jego”. بيكو (bīkū) to imię ptaka.
  ar.a1.unit27.lesson06.teach.ywsf_ma_ajml:
    title: Yusuf reaguje
    gloss: 'Yusuf: Jak pięknie! Co z nim robisz codziennie?'
  ar.a1.unit27.lesson06.teach.nwr_atamh_kl:
    title: Nour karmi go codziennie
    gloss: 'Nour: Karmię go codziennie.'
  ar.a1.unit27.lesson06.teach.ywsf_wana_ayda:
    title: Yusuf też kocha ptaki
    gloss: 'Yusuf: Ja też kocham ptaki.'
  ar.a1.unit27.lesson06.teach.lyla_ma_ajml:
    title: Layla kończy rozmowę
    gloss: 'Layla: Jak miło, że my troje kochamy zwierzęta!'
    note: Zakończenie rozmowy, które łączy to, co w tej lekcji wiemy o zwierzętach wszystkich trojga bohaterów.
