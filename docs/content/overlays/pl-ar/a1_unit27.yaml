course:
  title: Arabski A1
  description: 'Arabski dla początkujących: rozmowy o zwierzętach domowych i popularnych zwierzętach. Nazywanie zwierząt, podstawowa opieka (spacer, karmienie, zabawa), mówienie o zwierzętach, które kochasz, nawet jeśli żadnego nie masz, oraz najczęstsze formy liczby mnogiej.'
