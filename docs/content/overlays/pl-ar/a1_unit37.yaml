    title: Nour dowiaduje się o wszystkich
    gloss: Nour jest nowa w kawiarni językowej. Pyta Yusufa, jacy są pozostali. Yusuf jej opowiada. Layla jest miła i cierpliwa; pracuje jako pielęgniarka. Karim jest zabawny i chodzi na kurs hiszpańskiego. Sara jest ciekawska; lubi uczyć się nowych rzeczy. Sam Yusuf jest spokojny.
    note: 'Krótki tekst o grupie. Przymiotniki zgadzają się z osobą: لطيفة (laṭīfa) dla kobiety i مضحك (muḍḥik) dla mężczyzny.'
