teaching:
  ar.a1.unit11.lesson01.teach.every_day:
    title: Codziennie
    gloss: codziennie
    note: كل يوم (kull yawm) często stoi po czasowniku (أدرس كل يوم), ale może też otwierać zdanie (كل يوم أدرس).
    example_gloss: Uczę się codziennie.
  ar.a1.unit11.lesson01.teach.wake:
    title: Budzę się
    gloss: budzę się
    note: أستيقظ (astayqiẓ) znaczy „budzę się”; początkowe أ oznacza „ja” w czasownikach w czasie teraźniejszym. السابعة (as-sābiʿa) to „siódma” w godzinach.
    example_gloss: Budzę się o siódmej.
  ar.a1.unit11.lesson01.teach.study:
    title: Uczę się
    gloss: uczę się
    note: أدرس (adrus) znaczy „uczę się”; ma ten sam rdzeń co درس („lekcja”). التاسعة (at-tāsiʿa) to „dziewiąta” w godzinach.
    example_gloss: Uczę się o dziewiątej.
  ar.a1.unit11.lesson01.teach.sleep:
    title: Śpię
    gloss: śpię / idę spać
    note: أنام (anām) znaczy „śpię”; z podaną godziną oznacza „idę spać”. العاشرة (al-ʿāshira) to „dziesiąta” w godzinach.
    example_gloss: Śpię o dziesiątej.
  ar.a1.unit11.lesson02.teach.what_do:
    title: Co robisz codziennie?
    gloss: Co robisz codziennie?
    note: ماذا (mādhā) znaczy „co”, a تفعل (tafʿal) znaczy „robisz” (do mężczyzny); do kobiety mówimy تفعلين (tafʿalīn).
    example_gloss: 'Layla zapytała: Co robisz codziennie?'
  ar.a1.unit11.lesson02.teach.routine_sequence:
    title: Trzy zdania o rozkładzie dnia
    gloss: Wstaję o siódmej. Uczę się o dziewiątej. Idę spać o dziesiątej.
    note: Każde zdanie składa się z czasownika, في الساعة i godziny; razem opisują cały dzień.
    example_gloss: Codziennie wstaję o siódmej. Uczę się o dziewiątej. Idę spać o dziesiątej.
  ar.a1.unit11.lesson02.teach.line01:
    title: Pytanie o codzienny rozkład dnia
    gloss: Layla pyta, co Yusuf robi codziennie.
    note: 'Layla mówi تفعل, bo pyta mężczyznę; do kobiety: ماذا تفعلين كل يوم؟'
    example_gloss: 'Layla zapytała: Co robisz codziennie?'
  ar.a1.unit11.lesson02.teach.line02:
    title: Godzina wstawania
    gloss: Yusuf mówi, że wstaje o siódmej.
    note: Przed godziną używaj في الساعة.
    example_gloss: 'Yusuf powiedział: Wstaję o siódmej.'
  ar.a1.unit11.lesson02.teach.line03:
    title: Godzina nauki
    gloss: Yusuf mówi, że uczy się o dziewiątej.
    note: Ten sam wzór godziny działa z أدرس.
    example_gloss: 'Yusuf powiedział: Uczę się o dziewiątej.'
  ar.a1.unit11.lesson02.teach.line04:
    title: Godzina snu
    gloss: Yusuf mówi, że kładzie się spać o dziesiątej.
    note: Ostatnia czynność jego dnia ma ten sam wzór godziny z أنام.
    example_gloss: 'Yusuf powiedział: Śpię o dziesiątej.'
