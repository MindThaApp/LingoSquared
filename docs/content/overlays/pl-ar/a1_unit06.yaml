  ar.a1.unit06.lesson01.teach.family:
    title: Rodzina
    gloss: rodzina
    note: عائلة (ʿāʾila) to ogólne słowo oznaczające rodzinę. W przykładzie هذه to żeńska forma od هذا („to”), użyta, bo عائلة jest rodzaju żeńskiego.
    example_gloss: To jest rodzina.
  ar.a1.unit06.lesson01.teach.father:
    title: Ojciec
    gloss: ojciec
    note: أب (ab) znaczy „ojciec”.
    example_gloss: Mam ojca.
  ar.a1.unit06.lesson01.teach.mother:
    title: Matka
    gloss: matka
    note: أم (umm) znaczy „matka”.
    example_gloss: Mam mamę.
  ar.a1.unit06.lesson01.teach.brother:
    title: Brat
    gloss: brat
    note: أخ (akh) znaczy „brat”.
    example_gloss: Mam brata.
  ar.a1.unit06.lesson01.teach.sister:
    title: Siostra
    gloss: siostra
    note: أخت (ukht) znaczy „siostra”.
    example_gloss: Mam brata i siostrę.
  ar.a1.unit06.lesson01.teach.i_have:
    title: Mam
    gloss: mam
    note: عندي (ʿindī, dosłownie „przy mnie”) to prosty sposób na poziomie A1, by powiedzieć, że się coś ma; لدي (ladayya) to bardziej formalny odpowiednik.
    example_gloss: Mam siostrę.
  ar.a1.unit06.lesson02.teach.in_family:
    title: W twojej rodzinie
    gloss: w twojej rodzinie
    note: 'Tu من to man, „kto”, a nie min, „z”, jak w من أين أنت؟ – oba słowa zapisuje się tak samo. عائلتك znaczy „twoja rodzina”: ʿāʾilatuka do mężczyzny, ʿāʾilatuki do kobiety.'
    example_gloss: Kto jest w twojej rodzinie?
  ar.a1.unit06.lesson02.teach.sister_name:
    title: Ma na imię Nour
    gloss: ma na imię Nour
    note: اسمها znaczy „jej imię”.
    example_gloss: 'Yusuf powiedział: Ma na imię Nour.'
  ar.a1.unit06.lesson02.teach.line01:
    title: Pytanie o rodzinę
    gloss: Layla pyta, kto jest w rodzinie Yusufa.
    note: من (man) znaczy tu „kto”. يا يوسف to zwrócenie się do Yusufa po imieniu.
    example_gloss: 'Layla powiedziała: Kto jest w twojej rodzinie, Yusufie?'
  ar.a1.unit06.lesson02.teach.line02:
    title: Opis rodziny
    gloss: Yusuf mówi, że ma ojca, matkę i siostrę.
    note: و łączy członków rodziny.
    example_gloss: 'Yusuf powiedział: Mam ojca, matkę i siostrę.'
  ar.a1.unit06.lesson02.teach.line03:
    title: Pytanie o imię siostry
    gloss: Layla pyta o imię jego siostry.
    note: 'أختك znaczy „twoja siostra”: ukhtuka do mężczyzny, ukhtuki do kobiety. Tu Layla pyta Yusufa, więc ukhtuka.'
    example_gloss: 'Layla powiedziała: Jak ma na imię twoja siostra?'
  ar.a1.unit06.lesson02.teach.line04:
    title: Podanie jej imienia
    gloss: Yusuf mówi, że ona ma na imię Nour.
    note: 'Końcówka ـها znaczy „jej”: اسمها (ismuhā), jej imię.'
    example_gloss: 'Yusuf powiedział: Ma na imię Nour.'
