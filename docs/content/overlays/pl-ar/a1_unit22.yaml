teaching:
  ar.a1.unit22.lesson01.teach.feeling:
    title: Uczucie
    gloss: uczucie
    note: شعور (shuʿūr) znaczy „uczucie”.
    example_gloss: To jest uczucie.
  ar.a1.unit22.lesson01.teach.happy:
    title: Zadowolony
    gloss: szczęśliwy
    note: سعيد (saʿīd) opisuje mężczyznę; kobieta mówi أنا سعيدة (anā saʿīda).
    example_gloss: Jestem zadowolony.
  ar.a1.unit22.lesson01.teach.sad:
    title: Smutny
    gloss: smutny
    note: حزين (ḥazīn) opisuje mężczyznę; kobieta mówi أنا حزينة (anā ḥazīna).
    example_gloss: Jest mi smutno.
  ar.a1.unit22.lesson01.teach.because:
    title: Ponieważ
    gloss: ponieważ / bo
    note: لأن (li-anna) wprowadza przyczynę.
    example_gloss: Jestem szczęśliwy, bo pogoda jest słoneczna.
  ar.a1.unit22.lesson02.teach.how_feel:
    title: Jak się czujesz?
    gloss: Jak się Pan/Pani czuje?
    note: 'كيف تشعر؟ (kayfa tashʿur) to pytanie do mężczyzny, jak się czuje; do kobiety: كيف تشعرين؟ (kayfa tashʿurīn).'
    example_gloss: Jak się czujesz, Yusuf?
  ar.a1.unit22.lesson02.teach.tired:
    title: Zmęczony
    gloss: zmęczony
    note: متعب (mutʿab) opisuje mężczyznę; متعبة (mutʿaba) opisuje kobietę, dlatego Layla mówi أنا متعبة.
    example_gloss: Jestem zmęczony/zmęczona.
  ar.a1.unit22.lesson02.teach.okay:
    title: W porządku
    gloss: w porządku
    note: بخير (bi-khayr) znaczy „w porządku”, dosłownie „w dobrym stanie (zdrowia)”.
    example_gloss: Czy wszystko w porządku?
  ar.a1.unit22.lesson02.teach.line01:
    title: Pytanie o samopoczucie
    gloss: Layla pyta, jak czuje się Yusuf.
    note: يا (yā) stoi przed imieniem osoby, do której się zwracamy.
    example_gloss: 'Layla powiedziała: Jak się czujesz, Yusuf?'
  ar.a1.unit22.lesson02.teach.line02:
    title: Uczucie i przyczyna
    gloss: Yusuf mówi, że jest szczęśliwy, bo pogoda jest słoneczna.
    note: To zdanie podaje i uczucie, i jego przyczynę.
    example_gloss: 'Yusuf powiedział: Jestem szczęśliwy, bo pogoda jest słoneczna.'
  ar.a1.unit22.lesson02.teach.line03:
    title: Inne uczucie
    gloss: Layla mówi, że jest zmęczona, bo ma pracę.
    note: متعبة zgadza się z Laylą (rodzaj żeński).
    example_gloss: 'Layla powiedziała: Jestem zmęczona, bo mam pracę.'
  ar.a1.unit22.lesson02.teach.line04:
    title: Sprawdzenie, czy wszystko w porządku
    gloss: Yusuf pyta, czy u Layli wszystko w porządku.
    note: 'هل (hal) otwiera pytanie typu tak/nie. Yusuf pyta Laylę, więc أنت czytamy jako anti (do mężczyzny: anta).'
    example_gloss: 'Yusuf powiedział: Czy wszystko w porządku?'
  ar.a1.unit22.lesson02.teach.line05:
    title: Odpowiedź „tak”
    gloss: Layla mówi „tak” i dziękuje mu.
    note: نعم to odpowiedź „tak”.
    example_gloss: 'Layla powiedziała: Tak, dziękuję.'
