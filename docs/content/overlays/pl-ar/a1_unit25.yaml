course:
  title: Arabski A1
  description: 'Arabski dla początkujących: opisywanie zajęć w czasie wolnym – słownictwo związane z hobby, określenia częstotliwości, pytanie o to, co ktoś robi w wolnym czasie, i odpowiadanie na nie oraz porównywanie hobby dwóch osób.'
