teaching:
  ar.a1.unit25.lesson01.teach.alqraaa_mmarsa_alryada:
    title: Czytanie, sport, gotowanie
    gloss: czytać, uprawiać sport, gotować
    note: القراءة (al-qirāʾa) to czytanie, ممارسة الرياضة (mumārasat ar-riyāḍa) to uprawianie sportu, a الطبخ (aṭ-ṭabkh) to gotowanie. Każde z tych słów jest rzeczownikiem, więc ma przedrostek ال.
    example_gloss:
    - Lubię czytać książkę.
    - W soboty uprawiam sport.
    - Lubię gotować dla przyjaciół.
  ar.a1.unit25.lesson01.teach.wqt_alfragh:
    title: Czas wolny
    gloss: czas wolny
    note: وقت الفراغ (waqt al-farāgh) znaczy dosłownie „czas wolnej przestrzeni”. Pierwsze słowo nie ma ال; przedrostek przyjmuje tylko drugie.
    example_gloss: W wolnym czasie lubię czytać.
  ar.a1.unit25.lesson01.teach.fy_wqt_fraghy:
    title: Mówimy, co robisz w wolnym czasie
    gloss: W wolnym czasie lubię czytać.
    note: أحب (uḥibb) znaczy „lubię” i jest takie samo dla mężczyzny i kobiety. Końcówka ي w słowie فراغي (farāghī) znaczy „mój”.
  ar.a1.unit25.lesson02.teach.alastmaa_ila_almwsyqa:
    title: Muzyka, rysowanie, gry wideo
    gloss: słuchać muzyki, rysować, grać w gry wideo
    note: الاستماع إلى الموسيقى (al-istimāʿ ilā al-mūsīqā) to słuchanie muzyki, الرسم (ar-rasm) to rysowanie, a لعب ألعاب الفيديو (laʿb alʿāb al-fīdiyū) to granie w gry wideo.
    example_gloss:
    - Lubię słuchać muzyki.
    - Często rysuję.
    - Lubię grać w gry wideo z przyjaciółmi.
  ar.a1.unit25.lesson02.teach.ahb_alastmaa_ila:
    title: Mówimy, że lubisz słuchać muzyki
    gloss: Lubię słuchać muzyki.
    note: 'Po الاستماع (al-istimāʿ) potrzebne jest إلى (ilā, „do”) przed tym, czego się słucha: الاستماع إلى الموسيقى.'
  ar.a1.unit25.lesson02.teach.ahb_lab_alaab:
    title: Mówimy, że lubisz grać z przyjaciółmi
    gloss: Lubię grać w gry wideo z przyjaciółmi.
    note: 'مع (maʿa) znaczy „z”: مع الأصدقاء (maʿa al-aṣdiqāʾ). Przedrostek ال pozostaje przy słowie الأصدقاء.'
  ar.a1.unit25.lesson03.teach.daima_kthyra_ahyana:
    title: Zawsze, często, czasami, nigdy
    gloss: zawsze, często, czasami, nigdy
    note: دائما (dāʾiman), كثيرا (kathīran), أحيانا (aḥyānan) i أبدا (abadan) to przysłówki, więc nie zmieniają się ze względu na rodzaj. Końcowe ا (alif) pisze się bez żadnych znaków.
    example_gloss:
    - W soboty zawsze ćwiczę.
    - Często czytam książkę.
    - Czasami rysuję.
    - Nigdy nie gram w gry.
  ar.a1.unit25.lesson03.teach.kl_asbwa_kl:
    title: Co tydzień, w każdy weekend
    gloss: co tydzień, w każdy weekend
    note: كل أسبوع (kull usbūʿ) i كل عطلة نهاية أسبوع (kull ʿuṭlat nihāyat usbūʿ) zawierają słowo كل (kull, „każdy”); zobacz następną kartę.
    example_gloss:
    - Co tydzień gotuję dla przyjaciół.
    - Co weekend ćwiczę.
  ar.a1.unit25.lesson03.teach.bad_kl_yaty:
    title: 'Każdy: كل'
    gloss: 'Po كل (kull, „każdy”) rzeczownik jest w liczbie pojedynczej i nie ma ال: كل أسبوع (kull usbūʿ), كل عطلة نهاية أسبوع (kull ʿuṭlat nihāyat usbūʿ).'
    note: 'كل (kull) się nie zmienia: to samo słowo stoi przed rzeczownikiem rodzaju męskiego, jak أسبوع, i żeńskiego, jak عطلة.'
  ar.a1.unit25.lesson03.teach.madha_tfal_fy:
    title: Pytamy o czas wolny
    gloss: Co robisz w wolnym czasie?
    note: To główne pytanie tej lekcji — użyj go, by zapytać kogokolwiek o hobby.
  ar.a1.unit25.lesson04.teach.lyla_ntmsha_maa:
    title: Layla zaczyna rozmowę o hobby
    gloss: 'Layla: Często spacerujemy razem. Ale co jeszcze robisz w wolnym czasie, Yusufie?'
    note: Początkowe ن (na-) w نتمشى (natamashshā) oznacza „my”, więc po arabsku nie potrzeba osobnego słowa „my”. معا (maʿan) znaczy „razem”.
  ar.a1.unit25.lesson04.teach.ywsf_ahb_altbkh:
    title: Hobby Jusufa
    gloss: 'Jusuf: Lubię gotować, także w domu. I często uprawiam sport.'
    note: في البيت أيضا (fī al-bayt ayḍan) dodaje informację „też w domu”. وأمارس (wa-umāris) łączy و („i”) z czasownikiem i pisze się jako jedno słowo.
  ar.a1.unit25.lesson04.teach.lyla_hl_ttbkh:
    title: Layla jest zdziwiona
    gloss: 'Layla: Gotujesz też w domu? Przecież już cały dzień gotujesz w pracy!'
    note: تطبخ (taṭbukh) to forma „ty” dla mężczyzny; do kobiety mówisz تطبخين (taṭbukhīn). طوال اليوم (ṭawāl al-yawm) znaczy „przez cały dzień”.
  ar.a1.unit25.lesson04.teach.ywsf_nam_lknny:
    title: Jusuf wyjaśnia
    gloss: 'Jusuf: Tak, ale gotowanie mnie odpręża. A ty, co lubisz robić?'
    note: 'أجد (ajid) znaczy „uważam, że” (dosłownie „znajduję”), a مريحا (murīḥan) znaczy „odprężające”. وأنت (wa-anta) to و połączone z أنت: „a ty”.'
  ar.a1.unit25.lesson04.teach.lyla_ahb_alqraaa:
    title: Hobby Layli
    gloss: 'Layla: Lubię czytać i często słucham muzyki.'
    note: 'و łączy dwa zajęcia: أحب القراءة (uḥibb al-qirāʾa) i وأستمع (wa-astamiʿ, „i słucham”). Pisze się je razem z następnym słowem.'
  ar.a1.unit25.lesson04.teach.ywsf_hl_tlabyn:
    title: Jusuf pyta o gry
    gloss: 'Jusuf: Grasz też w gry wideo?'
    note: تلعبين (talʿabīn) to forma „ty” dla kobiety, bo Jusuf pyta Laylę; dla mężczyzny jest to تلعب (talʿab). هل (hal) rozpoczyna pytanie rozstrzygnięcia (tak/nie).
  ar.a1.unit25.lesson04.teach.lyla_la_la:
    title: Odpowiedź Layli
    gloss: 'Layla: Nie, nigdy nie gram w gry wideo. Ale czasem rysuję!'
    note: 'أبدا (abadan) znaczy „nigdy”, a أحيانا (aḥyānan) „czasami”. Czasownik neguje się przez لا (lā): لا ألعب (lā alʿab) znaczy „nie gram”.'
  ar.a1.unit25.lesson05.teach.ana_wywsf_ntmsha:
    title: Porównujemy hobby
    gloss: Jusuf i ja często razem spacerujemy. Ale mamy też inne hobby. Jusuf lubi gotować, także w domu, i często uprawia sport. Ja lubię czytać i często słucham muzyki. Czasem rysuję, ale nigdy nie gram w gry wideo. Co ty lubisz robić w wolnym czasie?
    note: Wiadomość Layli podsumowuje wcześniej poznane informacje i kończy się pytaniem do czytelnika o to, co lubi robić.
    glosses:
      نتمشى: spacerować
      كثيرا: często
      معا: razem
      أخرى: inne
      يطبخ: gotuje
      يحب: chętnie
      البيت: dom (w domu)
      ويمارس: uprawia (sport)
      أقرأ: czytam
      وأستمع: słucham
      الموسيقى: muzyka
      أرسم: rysuję
      أحيانا: czasami
      ألعب: grać (w gry wideo)
      أبدا: nigdy
      فراغك: twój wolny (czas)
      وقت: czas
  ar.a1.unit25.lesson06.teach.ywsf_madha_stfalyn:
    title: Jusuf pyta o weekend
    gloss: 'Jusuf: Co będziesz robić w ten weekend?'
    note: 'ستفعلين (sa-tafʿalīn) to czas przyszły: oznacza go początkowe س (sa-), a końcówka ين wskazuje na kobietę. عطلة نهاية الأسبوع (ʿuṭlat nihāyat al-usbūʿ) to „weekend”.'
  ar.a1.unit25.lesson06.teach.lyla_la_aarf:
    title: Layla jeszcze nie wie
    gloss: 'Layla: Jeszcze nie wiem. Lubię czytać, ale chcę też wyjść z domu.'
    note: لا أعرف بعد (lā aʿrif baʿd) znaczy „jeszcze nie wiem”. أن أخرج (an akhruj) znaczy „wyjść”.
  ar.a1.unit25.lesson06.teach.ywsf_hl_ntmsha:
    title: Jusuf proponuje plan
    gloss: 'Jusuf: Pójdziemy razem na spacer? Potem coś nam ugotuję.'
    note: 'هل نتمشى (hal natamashshā) to typowy sposób zaproponowania czegoś wspólnie: هل + czasownik w formie „my”. لنا (lanā) to ل („dla”) + نا („nas”), pisane jako jedno słowo.'
  ar.a1.unit25.lesson06.teach.lyla_fkra_jyda:
    title: Layla się zgadza
    gloss: 'Layla: Dobry pomysł! Lubię i spacerować, i gotować.'
    note: 'كليهما (kilayhimā) znaczy „jedno i drugie” i stoi na końcu, odnosząc się do dwóch rzeczy: المشي والطبخ (al-mashy wa-aṭ-ṭabkh).'
  ar.a1.unit25.lesson06.teach.ywsf_mmtaz_idhn:
    title: Jusuf potwierdza
    gloss: 'Jusuf: Świetnie. W takim razie do zobaczenia w sobotę!'
    note: يوم السبت (yawm as-sabt) znaczy „w sobotę”. Litera ل w ال nie jest wymawiana przed س, literą słoneczną, dlatego czytamy as-sabt.
