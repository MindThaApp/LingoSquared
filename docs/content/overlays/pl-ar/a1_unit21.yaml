teaching:
  ar.a1.unit21.lesson01.teach.clothes:
    title: Ubrania
    gloss: ubrania
    note: ملابس (malābis) to rzeczownik w liczbie mnogiej oznaczający „ubrania”.
    example_gloss: Chcę ubrania.
  ar.a1.unit21.lesson01.teach.shirt:
    title: Koszula
    gloss: koszula
    note: 'قميص (qamīṣ) znaczy „koszula”; po أريد przyjmuje końcówkę biernika -an: قميصا (qamīṣan).'
    example_gloss: Chcę koszulę.
  ar.a1.unit21.lesson01.teach.blue:
    title: Niebieski
    gloss: niebieski
    note: 'أزرق (azraq) to forma rodzaju męskiego, zgodna z قميص; przy rzeczowniku rodzaju żeńskiego brzmi زرقاء (zarqāʾ). Po أريد أزرق nie dostaje dodatkowego alifu: قميصا أزرق.'
    example_gloss: Chcę niebieską koszulę.
  ar.a1.unit21.lesson01.teach.blue_shirt:
    title: Niebieska koszula
    gloss: niebieska koszula
    note: 'W arabskim kolor stoi po rzeczowniku: قميصا أزرق (qamīṣan azraq).'
    example_gloss: Chcę niebieską koszulę.
  ar.a1.unit21.lesson02.teach.size:
    title: Rozmiar
    gloss: rozmiar
    note: مقاس (maqās) znaczy „rozmiar”; ما المقاس؟ (mā l-maqās) to pytanie o rozmiar.
    example_gloss: Jaki rozmiar?
  ar.a1.unit21.lesson02.teach.medium:
    title: Rozmiar średni
    gloss: rozmiar średni
    note: 'متوسط (mutawassiṭ) znaczy „średni”; z بـ (bi-, „w”) łączy się z przedmiotem: قميصا بمقاس متوسط (qamīṣan bi-maqāsin mutawassiṭ), czyli koszula w rozmiarze średnim.'
    example_gloss: Chcę koszulę w rozmiarze średnim.
  ar.a1.unit21.lesson02.teach.price:
    title: Dziesięć dirhamów
    gloss: dziesięć dirhamów
    note: 'بعشرة (bi-ʿashara) znaczy „za dziesięć”: przedrostek بـ wskazuje cenę, tak jak w lekcji o zakupach.'
    example_gloss: Koszula kosztuje dziesięć dirhamów.
  ar.a1.unit21.lesson02.teach.line01:
    title: Prośba o rzecz
    gloss: Layla prosi o niebieską koszulę.
    note: من فضلك sprawia, że prośba jest uprzejma.
    example_gloss: 'Layla powiedziała: Poproszę niebieską koszulę.'
  ar.a1.unit21.lesson02.teach.line02:
    title: Pytanie o rozmiar
    gloss: Sprzedawca pyta o rozmiar.
    note: 'Sprzedawca pyta o rozmiar: ما المقاس؟'
    example_gloss: 'Sprzedawca powiedział: Jaki rozmiar?'
  ar.a1.unit21.lesson02.teach.line03:
    title: Podanie rozmiaru
    gloss: Layla mówi, że rozmiar średni.
    note: To bezpośrednia odpowiedź na pytanie o rozmiar.
    example_gloss: 'Layla powiedziała: Rozmiar średni.'
  ar.a1.unit21.lesson02.teach.line04:
    title: Podanie rzeczy i ceny
    gloss: Sprzedawca podaje koszulę i cenę.
    note: 'تفضلي (tafaḍḍalī) mówi się do kobiety, podając jej coś; do mężczyzny: تفضل (tafaḍḍal).'
    example_gloss: 'Sprzedawca powiedział: Proszę. Koszula kosztuje dziesięć dirhamów.'
