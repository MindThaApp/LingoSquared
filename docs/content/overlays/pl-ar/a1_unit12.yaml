    title: Idziemy
    gloss: idziemy
    note: نذهب (nadh-hab) znaczy „idziemy”; ن na początku oznacza „my”. Z غدا czasownik w czasie teraźniejszym opisuje plan.
    example_gloss: Idziemy do kawiarni.
  ar.a1.unit12.lesson01.teach.plan_time:
    title: Jutro o piątej
    gloss: jutro o piątej
    note: في الساعة („o godzinie”) stoi przed godziną, tak jak w lekcji o czasie.
    example_gloss: Idziemy jutro o piątej.
  ar.a1.unit12.lesson02.teach.propose:
    title: Zaproponuj plan
    gloss: Pójdziemy jutro do kawiarni?
    note: 'هل (hal) zamienia zdanie oznajmujące w pytanie rozstrzygnięcia (tak/nie); z نذهب działa jak propozycja: pójdziemy?'
    example_gloss: 'Layla zapytała: Pójdziemy jutro do kawiarni?'
  ar.a1.unit12.lesson02.teach.accept:
    title: Zgoda z podaniem godziny
    gloss: Tak, o piątej
    note: Możesz odpowiedzieć samym نعم i godziną; czasownik nie jest potrzebny.
    example_gloss: 'Yusuf powiedział: Tak, o piątej.'
  ar.a1.unit12.lesson02.teach.decline:
    title: Zwykła odmowa
    gloss: Nie, mam lekcję
    note: لا to zwykła odmowa, po której następuje powód z عندي („mam”).
    example_gloss: Nie, jutro mam lekcję.
  ar.a1.unit12.lesson02.teach.line01:
    title: Layla składa propozycję
    gloss: Layla proponuje pójście jutro do kawiarni.
    note: Ta kwestia rozpoczyna rozmowę o planach.
    example_gloss: 'Layla zapytała: Pójdziemy jutro do kawiarni?'
  ar.a1.unit12.lesson02.teach.line02:
    title: Yusuf się zgadza
    gloss: Yusuf się zgadza i podaje godzinę.
    note: Plan zawiera już czynność, dzień i godzinę.
    example_gloss: 'Yusuf powiedział: Tak, o piątej.'
  ar.a1.unit12.lesson02.teach.line03:
    title: Layla potwierdza
    gloss: Layla mówi „dobrze” i żegna się.
    note: جيد (jayyid) znaczy „dobry, dobrze”; tutaj potwierdza plan. إلى اللقاء to pożegnanie z lekcji o powitaniach.
    example_gloss: 'Layla powiedziała: Dobrze. Do zobaczenia.'
