    title: Lajla wysyła paczkę
    gloss: Lajla ma paczkę dla dziadka i babci w Bejrucie. Kupuje znaczek na poczcie. Pisze adres na paczce. Paczka dotrze do nich jutro. List idzie trzy dni.
    note: 'Krótki tekst o paczce. Czasownik zgadza się z podmiotem: الطرد يصل (aṭ-ṭard yaṣil) przy rzeczowniku rodzaju męskiego, ale ليلى تشتري (Layla tashtarī) przy kobiecie.'
    glosses:
      طرد: paczka
      لجدها: dla jej dziadka
      وجدتها: i jej babci
      تشتري: kupuje
      طابعا: znaczek
      البريد: poczta
      تكتب: pisze
      العنوان: adres
      يصل: dociera (czasownik rodzaju męskiego)
      غدا: jutro
      إليهما: do nich (dwojga); czasownik z tym słowem znaczy „dociera do nich”
      الرسالة: list
      تستغرق: trwa (określony czas)
      ثلاثة: trzy
      أيام: dni
