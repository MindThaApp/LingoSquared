teaching:
  ar.a1.unit19.lesson01.teach.house:
    title: Dom
    gloss: dom
    note: بيت (bayt) to „dom”; końcówka ـي znaczy „mój”, więc بيتي (baytī) to „mój dom”.
    example_gloss: Mój dom jest blisko biblioteki.
  ar.a1.unit19.lesson01.teach.room:
    title: Pokój
    gloss: pokój
    note: غرفة (ghurfa) jest rodzaju żeńskiego (kończy się na ة), dlatego po niej następuje żeńskie واحدة.
    example_gloss: W moim domu jest jeden pokój.
  ar.a1.unit19.lesson01.teach.kitchen:
    title: Kuchnia
    gloss: kuchnia
    note: 'مطبخ (maṭbakh) to „kuchnia”. Po arabsku nie ma tu słowa odpowiadającego „jest”: wystarczy zacząć od في بيتي („w moim domu”).'
    example_gloss: W moim domu jest kuchnia.
  ar.a1.unit19.lesson01.teach.one_room:
    title: Jeden pokój
    gloss: jeden pokój
    note: 'Liczebnik „jeden” stoi po rzeczowniku i zgadza się z nim w rodzaju: غرفة واحدة (ghurfa wāḥida); przy rzeczowniku rodzaju męskiego jest واحد.'
    example_gloss: W moim domu jest jeden pokój.
  ar.a1.unit19.lesson02.teach.table:
    title: Stół
    gloss: stół
    note: طاولة (ṭāwila) to „stół”; podobnie jak غرفة kończy się na ة i jest rodzaju żeńskiego.
    example_gloss: Mam stół w pokoju.
  ar.a1.unit19.lesson02.teach.in_room:
    title: W pokoju
    gloss: w pokoju
    note: الغرفة (al-ghurfa) znaczy „ten pokój”.
    example_gloss: Stół jest w pokoju.
  ar.a1.unit19.lesson02.teach.near_library:
    title: Blisko biblioteki
    gloss: blisko biblioteki
    note: قرب (qurb) znaczy „blisko”; المكتبة to „biblioteka” z lekcji o miejscach.
    example_gloss: Mój dom jest blisko biblioteki.
  ar.a1.unit19.lesson02.teach.line01:
    title: Pytanie o miejsce
    gloss: Layla pyta, gdzie jest dom Yusufa.
    note: أين znaczy „gdzie”; بيتك (baytuka) to „twój dom”, mówione do mężczyzny; do kobiety jest baytuki, zapisywane tak samo.
    example_gloss: 'Layla zapytała: Gdzie jest twój dom, Yusufie?'
  ar.a1.unit19.lesson02.teach.line02:
    title: Położenie domu
    gloss: Yusuf mówi, że jego dom jest blisko biblioteki.
    note: بيتي znaczy „mój dom”.
    example_gloss: 'Yusuf powiedział: Mój dom jest blisko biblioteki.'
  ar.a1.unit19.lesson02.teach.line03:
    title: Pomieszczenia
    gloss: Yusuf mówi, że w jego domu jest jeden pokój i kuchnia.
    note: 'و (wa, „i”) łączy dwa elementy domu i pisze się razem z następnym słowem: ومطبخ.'
    example_gloss: 'Yusuf powiedział: W moim domu jest jeden pokój i kuchnia.'
  ar.a1.unit19.lesson02.teach.line04:
    title: Pytanie o przedmiot
    gloss: Layla pyta, czy Yusuf ma stół.
    note: هل otwiera pytanie rozstrzygnięcia (tak/nie); عندك (ʿindaka) znaczy „masz", gdy mówisz do mężczyzny; do kobiety mówi się ʿindaki, a pisze tak samo.
    example_gloss: 'Layla powiedziała: Masz stół?'
  ar.a1.unit19.lesson02.teach.line05:
    title: Miejsce przedmiotu
    gloss: Yusuf mówi, że ma stół w pokoju.
    note: عندي wyraża posiadanie.
    example_gloss: 'Yusuf powiedział: Tak, mam stół w pokoju.'
