teaching:
  ar.a1.unit14.lesson01.teach.like:
    title: lubię
    gloss: lubię
    note: أحب (uḥibbu) znaczy „lubię”. W arabskim używa się ال (rodzajnika określonego) przy rzeczach ogólnie, więc „lubię kawę” to أحب القهوة, dosłownie „lubię tę kawę”.
    example_gloss: Lubię kawę.
  ar.a1.unit14.lesson01.teach.tea:
    title: Herbata
    gloss: herbata
    note: شاي (shāy) to herbata; الشاي (ash-shāy) ma ال, tak jak w arabskim mówi się o herbacie w ogóle.
    example_gloss: Nie lubię herbaty.
  ar.a1.unit14.lesson01.teach.dislike:
    title: Nie lubię
    gloss: nie lubię
    note: Przeczenie tworzy się w arabskim przez لا przed أحب, bez żadnego czasownika posiłkowego.
    example_gloss: Nie lubię herbaty.
  ar.a1.unit14.lesson01.teach.water:
    title: Woda
    gloss: woda
    note: الماء (al-māʾ) to ماء („woda”, z lekcji o jedzeniu) z ال, użyte o wodzie w ogóle.
    example_gloss: Lubię wodę.
  ar.a1.unit14.lesson01.teach.and_not:
    title: I nie
    gloss: i nie
    note: 'ولا (wa-lā) to و („i”) połączone z لا („nie”): dodaje coś, czego nie lubisz, po tym, co lubisz.'
    example_gloss: Lubię kawę, a nie lubię herbaty.
  ar.a1.unit14.lesson02.teach.prefer:
    title: wolę
    gloss: wolę
    note: 'أفضل (ufaḍḍilu) znaczy „wolę”: wybierasz jedną możliwość zamiast innej.'
    example_gloss: Wolę kawę.
  ar.a1.unit14.lesson02.teach.what_prefer:
    title: Co wolisz?
    gloss: Co wolisz?
    note: تفضل tutaj to tufaḍḍil, „wolisz”, mówione do mężczyzny; do kobiety mówi się تفضلين (tufaḍḍilīn). To inne słowo niż تفضل (tafaḍḍal, „proszę”) z lekcji o jedzeniu, choć zapisuje się tak samo.
    example_gloss: 'Nour powiedziała: Co wolisz, Yusuf?'
  ar.a1.unit14.lesson02.teach.line01:
    title: Nour pyta
    gloss: Nour pyta Yusufa, co woli.
    note: 'نور (Nour) jest siostrą Yusufa. Mówi تفضل, bo pyta mężczyznę; kobietę zapytałaby: ماذا تفضلين؟'
    example_gloss: 'Nour powiedziała: Co wolisz, Yusuf?'
  ar.a1.unit14.lesson02.teach.line02:
    title: Yusuf woli kawę
    gloss: Yusuf mówi, że woli kawę.
    note: أفضل wybiera jedną możliwość spośród innych; أحب po prostu mówi, że coś lubisz.
    example_gloss: 'Yusuf powiedział: Wolę kawę.'
  ar.a1.unit14.lesson02.teach.line03:
    title: Yusuf nie lubi herbaty
    gloss: Yusuf mówi, że nie lubi herbaty.
    note: لا أحب po prostu wyraża brak sympatii.
    example_gloss: 'Yusuf powiedział: Nie lubię herbaty.'
  ar.a1.unit14.lesson02.teach.line04:
    title: Nour lubi wodę
    gloss: Nour mówi, że lubi wodę.
    note: أنا można dodać dla podkreślenia.
    example_gloss: 'Nour powiedziała: Ja lubię wodę.'
