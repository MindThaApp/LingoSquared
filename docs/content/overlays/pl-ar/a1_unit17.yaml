teaching:
  ar.a1.unit17.lesson01.teach.pain:
    title: Ból
    gloss: ból
    note: ألم (alam) znaczy „ból”; عندي ألم (ʿindī alam) znaczy „mam ból”.
    example_gloss: Boli mnie.
  ar.a1.unit17.lesson01.teach.head:
    title: Głowa
    gloss: głowa
    note: الرأس (ar-raʾs) to głowa. Po arabsku mówi się عندي ألم في الرأس, czyli dosłownie „mam ból w głowie”; po polsku powiemy zwykle „boli mnie głowa”.
    example_gloss: Mam ból głowy.
  ar.a1.unit17.lesson01.teach.stomach:
    title: Żołądek
    gloss: brzuch
    note: البطن (al-baṭn) to brzuch lub okolica żołądka.
    example_gloss: Mam ból brzucha.
  ar.a1.unit17.lesson01.teach.problem_sentence:
    title: Ból głowy
    gloss: Boli mnie głowa
    note: عندي ألم, dosłownie „przy mnie (jest) ból”, to sposób, w jaki po arabsku mówi się „mam ból”; في + część ciała wskazuje, gdzie boli.
    example_gloss: 'Layla powiedziała: Boli mnie głowa.'
  ar.a1.unit17.lesson02.teach.problem_question:
    title: Co się stało?
    gloss: Jaki jest problem?
    note: ما (mā) pyta „co”; المشكلة (al-mushkila) znaczy „problem”.
    example_gloss: Jaki masz problem, Layla?
  ar.a1.unit17.lesson02.teach.drink:
    title: Pij wodę
    gloss: pij wodę
    note: اشربي (ishrabī) to rozkaz „pij!” skierowany do kobiety, tutaj do Layli; do mężczyzny mówi się اشرب (ishrab).
    example_gloss: 'Yusuf powiedział: Pij wodę.'
  ar.a1.unit17.lesson02.teach.rest:
    title: Odpoczynek
    gloss: odpocznij
    note: استريحي (istarīḥī) to rozkaz „odpocznij!” skierowany do kobiety; do mężczyzny mówi się استرح (istariḥ).
    example_gloss: Odpocznij dzisiaj.
  ar.a1.unit17.lesson02.teach.need_help:
    title: Potrzebuję pomocy
    gloss: potrzebuję pomocy
    note: أحتاج (aḥtāj) znaczy „potrzebuję”, a مساعدة (musāʿada) „pomoc”. Spotkasz też أحتاج إلى مساعدة z إلى; obie formy są poprawne.
    example_gloss: Boli mnie. Potrzebuję pomocy.
  ar.a1.unit17.lesson02.teach.line01:
    title: Zapytaj o problem
    gloss: Yusuf pyta Laylę, co się stało.
    note: يا ليلى to zwrot do Layli po imieniu.
    example_gloss: 'Yusuf powiedział: Co się stało, Layla?'
  ar.a1.unit17.lesson02.teach.line02:
    title: Nazwij objaw
    gloss: Layla mówi, że boli ją głowa.
    note: Objaw podaje się wprost.
    example_gloss: 'Layla powiedziała: Boli mnie głowa.'
  ar.a1.unit17.lesson02.teach.line03:
    title: Prosta rada
    gloss: Yusuf radzi Layli, żeby piła wodę i odpoczęła.
    note: 'Oba rozkazy mają formę żeńską, bo Yusuf mówi do Layli; و (wa, „i”) pisze się łącznie z następnym słowem: واستريحي.'
    example_gloss: 'Yusuf powiedział: Pij wodę i odpocznij.'
  ar.a1.unit17.lesson02.teach.line04:
    title: Podziękowanie
    gloss: Layla dziękuje.
    note: شكرا kończy tę krótką wymianę zdań.
    example_gloss: 'Layla powiedziała: Dziękuję.'
