    title: Proszę bardzo
    gloss: proszę bardzo
    note: تفضلي (tafaḍḍalī) mówi się do kobiety, podając jej coś; do mężczyzny mówi się تفضل (tafaḍḍal).
    example_gloss: 'Kelner powiedział: Proszę bardzo.'
  ar.a1.unit07.lesson02.teach.line01:
    title: Złóż zamówienie
    gloss: Layla uprzejmie zamawia wodę i kawę.
    note: Prośba składa się z أريد i nazw zamawianych rzeczy.
    example_gloss: 'Layla powiedziała: Witam. Poproszę wodę i kawę.'
  ar.a1.unit07.lesson02.teach.line02:
    title: Zadaj pytanie dodatkowe
    gloss: Kelner pyta, czy Pani chce chleba.
    note: هل otwiera pytanie, na które odpowiada się „tak” lub „nie”.
    example_gloss: 'Kelner powiedział: Czy chce Pani chleba?'
  ar.a1.unit07.lesson02.teach.line03:
    title: Odpowiedz na pytanie dodatkowe
    gloss: Layla mówi „tak” i prosi o jeden kawałek chleba.
    note: نعم oznacza odpowiedź twierdzącą.
    example_gloss: 'Layla powiedziała: Tak, chcę jeden kawałek chleba.'
  ar.a1.unit07.lesson02.teach.line04:
    title: Podaj zamówienie
    gloss: 'Kelner mówi: proszę bardzo.'
    note: تفضلي kończy tę wymianę zdań.
    example_gloss: 'Kelner powiedział: Proszę bardzo.'
