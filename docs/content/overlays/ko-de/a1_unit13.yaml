    example_gloss: 어제 저는 시장에 갔어요.
  de.a1.unit13.lesson02.teach.line01:
    title: Felix가 어제 한 일을 물어요
    gloss: 'Felix: 어제 무엇을 하셨어요?'
    note: 어제 무엇을 했는지 묻는 일반적인 표현이에요.
  de.a1.unit13.lesson02.teach.line02:
    title: Anna가 하루 동안 한 일을 이야기해요
    gloss: 'Anna: 저는 시장에 갔어요. 빵을 사고 수프를 먹었어요.'
    note: Anna는 간 일을 말할 때 *bin*을 쓰고, 사고 먹은 일을 말할 때 *habe*를 써요.
    example_gloss: 문맥에서는 ‘저는 빵을 샀어요.’라는 뜻이에요.
  de.a1.unit13.lesson02.teach.line03:
    title: Felix가 어땠는지 물어요
    gloss: 'Felix: 좋았어요?'
