    note: 과거분사 *gekauft*는 문장 끝에 와요.
  de.a1.unit13.lesson01.teach.gegessen:
    title: Ich habe Suppe gegessen.
    gloss: 저는 수프를 먹었어요.
    note: '*gegessen*은 *essen*의 과거분사예요.'
    example_gloss: 문맥에서는 ‘저는 빵을 사고 수프를 먹었어요.’라는 뜻이에요.
  de.a1.unit13.lesson01.teach.gegangen:
    title: Ich bin zum Markt gegangen.
    gloss: 저는 시장에 갔어요.
    note: 어떤 장소로 이동한 일을 말할 때는 *habe ... gegangen*이 아니라 *bin ... gegangen*을 써요.
