      status: correct
    - value: Gut, danke, und Ihnen?
      status: correct
    - value: Gut danke Und Ihnen
      status: correct
    - value: Danke, gut. Und Ihnen?
      status: correct
    - value: Danke, gut, und Ihnen?
      status: correct
    feedback: '*Gut, danke. Und Ihnen?*은 정중하게 대답한 뒤 같은 높임말로 상대에게도 되물어요.'
  de.a1.unit01.lesson03.exercise07.reply_informally:
    instruction: 친구가 'Wie geht's?'라고 물어요. 아주 잘 지내고 있다고 고맙다는 말과 함께 답한 뒤, 반말로 상대에게도 되물어 보세요.
    accepted_answers:
    - value: Sehr gut, danke. Und dir?
      status: correct
    - value: Sehr gut, danke, und dir?
      status: correct
    - value: Sehr gut danke Und dir
      status: correct
