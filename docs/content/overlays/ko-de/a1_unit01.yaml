teaching:
  de.a1.unit01.lesson01.teach.hallo:
    title: Hallo
    gloss: 안녕하세요 / 안녕
    note: '*Hallo*는 하루 중 언제든 쓸 수 있는 편하고 두루 쓰이는 인사말이에요.'
    example_gloss: 안녕, Felix!
  de.a1.unit01.lesson01.teach.guten_morgen:
    title: Guten Morgen
    gloss: 좋은 아침이에요
    note: '*Guten Morgen*은 아침부터 대략 오전 늦게까지 사용해요.'
  de.a1.unit01.lesson01.teach.guten_tag:
    title: Guten Tag
    gloss: 안녕하세요
    note: '*Guten Tag*은 표준적이고 조금 더 격식 있는 낮 인사로, 오전 늦게부터 오후까지 사용할 수 있어요.'
  de.a1.unit01.lesson01.teach.guten_abend:
    title: Guten Abend
    gloss: 좋은 저녁이에요
    note: '*Guten Abend*은 저녁에 어떤 곳에 도착했을 때 하는 인사예요. 작별 인사가 아니에요.'
  de.a1.unit01.lesson02.teach.tschuss:
    title: Tschüss
    gloss: 안녕
    note: '*Tschüss*는 친구나 지인에게 작별을 고할 때 매우 흔히 쓰는 편한 표현이에요.'
    example_gloss: 안녕, 곧 다시 봐!
  de.a1.unit01.lesson02.teach.auf_wiedersehen:
    title: Auf Wiedersehen
    gloss: 안녕히 가세요 / 안녕히 계세요
    note: '*Auf Wiedersehen*은 글자 그대로 ‘다시 만날 때까지’라는 뜻이에요. 모르는 사람이나 업무 관계에서 쓰기 알맞은 표준적이고 더 격식 있는 작별 인사예요.'
  de.a1.unit01.lesson02.teach.bis_bald:
    title: Bis bald
    gloss: 곧 다시 봐요
    note: '*Bis bald*는 상대방을 곧 다시 만날 것 같을 때 하는 친근한 작별 인사예요.'
  de.a1.unit01.lesson02.teach.bis_spater:
    title: Bis später
    gloss: 나중에 봐요
    note: '*Bis später*는 같은 날 나중에 상대방을 다시 만날 때 사용해요.'
  de.a1.unit01.lesson02.teach.gute_nacht:
    title: Gute Nacht
    gloss: 잘 자요
    note: '*Gute Nacht*는 누군가 잠자리에 들거나 하루를 마칠 때 하는 말이에요. *Guten Abend*과 달리 인사가 아니라 작별 인사예요.'
  de.a1.unit01.lesson03.teach.sie:
    title: Sie
    gloss: 당신 / 여러분
    note: '*Sie*는 모르는 사람이나 연장자에게, 또는 격식을 차리거나 업무상 대화할 때 쓰는 격식 있는 ‘당신’이에요. 문장 중간에서도 대문자로 써요. 독일어에서는 한국어처럼 상대와 상황에 따라 높임의 정도를 구분하며, 이에 따라 대명사도 달라져요.'
  de.a1.unit01.lesson03.teach.du:
    title: du
    gloss: 너
    note: '*du*는 친구, 가족, 어린이에게 쓰는 비격식 ‘너’예요. 모르는 사람에게 *du*를 쓰면 지나치게 친한 척하거나 무례하게 들릴 수 있어요.'
  de.a1.unit01.lesson03.teach.wie_geht_es_ihnen:
    title: Wie geht es Ihnen?
    gloss: 어떻게 지내세요?
    note: 상대방이 어떻게 지내는지 격식 있게 묻는 표현이에요. *Ihnen*은 *Sie* 높임말에 맞는 격식 있는 ‘당신’의 여격 형태예요.
  de.a1.unit01.lesson03.teach.wie_gehts:
    title: Wie geht's?
    gloss: 어떻게 지내?
    note: '*Wie geht''s*는 *Wie geht es*의 축약형으로, 일상에서 상대방이 어떻게 지내는지 편하게 묻는 표현이에요.'
  de.a1.unit01.lesson03.teach.gut_danke:
    title: Gut, danke.
    gloss: 잘 지내요, 고마워요.
    note: 격식체와 비격식체 모두에서 쓸 수 있는 간단하고 무난한 대답이에요.
  de.a1.unit01.lesson03.teach.sehr_gut_danke:
    title: Sehr gut, danke.
    gloss: 아주 잘 지내요, 고마워요.
    note: '*Gut, danke.*보다 더 밝고 적극적인 대답이에요.'
  de.a1.unit01.lesson03.teach.und_ihnen:
    title: Und Ihnen?
    gloss: 그쪽은요?
    note: '*Sie* 높임말에 맞춰 같은 질문을 상대방에게 격식 있게 되묻는 표현이에요.'
  de.a1.unit01.lesson03.teach.und_dir:
    title: Und dir?
    gloss: 너는?
    note: 같은 질문을 상대방에게 편하게 되묻는 표현이에요. *dir*는 *du*에 맞는 비격식 ‘너’의 여격 형태예요.
  de.a1.unit01.lesson04.teach.danke:
    title: Danke
    gloss: 고마워요 / 감사합니다
    note: '*Danke*는 앞서 나온 대답에서도 이미 보았어요. 여기서는 이 단어를 단독으로 쓰는 경우를 배워요.'
    example_gloss: 정말 고마워요!
  de.a1.unit01.lesson04.teach.bitte:
    title: Bitte
    gloss: 부탁합니다 / 천만에요
    note: '*Bitte*에는 문맥에 따라 흔히 쓰이는 두 가지 뜻이 있어요. 부탁할 때는 ‘부탁합니다’, 감사에 답할 때는 ‘천만에요’라는 뜻이에요. 문맥으로 어느 뜻인지 알 수 있으며, 두 용법 모두 완전히 표준적이에요.'
    example_gloss:
    - 커피 한 잔 주세요.
    - 별말씀을요!
  de.a1.unit01.lesson04.teach.entschuldigung:
    title: Entschuldigung
    gloss: 실례합니다 / 죄송합니다
    note: '*Entschuldigung*은 다른 사람의 주의를 정중하게 끌 때와 간단히 사과할 때 모두 사용해요.'
    example_gloss: 실례합니다, 화장실이 어디예요?
  de.a1.unit01.lesson04.teach.kein_problem:
    title: Kein Problem
    gloss: 괜찮아요
    note: 부담 없이 친근하게 ‘괜찮아요’라고 답하는 표현이에요.
  de.a1.unit01.lesson04.teach.gern_geschehen:
    title: Gern geschehen
    gloss: 천만에요
    note: 짧은 *Bitte*보다 ‘천만에요’라는 뜻을 더 완전하고 분명하게 나타내는 표현이에요.
  de.a1.unit01.lesson05.teach.line01:
    title: Anna가 Felix에게 인사해요
    gloss: 'Anna가 말해요: 안녕하세요!'
    note: Anna와 Felix는 아파트 건물의 이웃으로 처음 만났어요.
  de.a1.unit01.lesson05.teach.line02:
    title: Felix가 인사를 되돌려 하고 안부를 물어요
    gloss: 'Felix가 말해요: 안녕하세요! 어떻게 지내세요?'
    note: Felix는 두 사람이 처음 만났기 때문에 격식 있는 *Sie* 높임말을 사용해요.
  de.a1.unit01.lesson05.teach.line03:
    title: Anna가 대답하고 안부를 되물어요
    gloss: 'Anna가 말해요: 고마워요, 잘 지내요. 그쪽은요?'
    note: Anna는 Felix의 말투에 맞춰 대답하고 격식 있게 안부를 되물어요.
  de.a1.unit01.lesson05.teach.line04:
    title: Felix가 대답해요
    gloss: 'Felix가 말해요: 아주 잘 지내요, 고마워요.'
    note: 평범한 *Gut, danke.*보다 조금 더 밝고 적극적인 대답이에요.
  de.a1.unit01.lesson05.teach.line05:
    title: Anna가 작별 인사를 해요
    gloss: 'Anna가 말해요: 안녕히 계세요!'
    note: Anna는 두 사람이 계속 사용한 *Sie* 높임말에 맞춰 더 격식 있는 작별 인사를 해요.
  de.a1.unit01.lesson05.teach.line06:
    title: Felix가 작별 인사를 하며 곧 다시 보자고 해요
    gloss: 'Felix가 말해요: 안녕히 가세요, 곧 다시 봐요!'
    note: Felix는 격식 있는 작별 인사에 ‘곧 다시 봐요’를 덧붙여, 첫 만남 내내 두 사람이 사용한 *Sie* 높임말에 맞게 말해요.
