  de.a1.unit01.lesson01.hallo_und_tageszeiten:
    title: 안녕하세요와 시간대별 인사
  de.a1.unit01.lesson02.abschied:
    title: 작별 인사하기
  de.a1.unit01.lesson03.formell_und_informell:
