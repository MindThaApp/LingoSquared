    - Tschüss
    accepted_answers:
    - value: Wie geht's
      status: correct
    feedback: '*Wie geht''s?*는 상대방의 안부를 편하게 묻는 표현이에요.'
  de.a1.unit01.lesson03.exercise05.order_formal_question:
    instruction: 상대방의 안부를 격식 있게 묻는 말이 되도록 단어를 올바른 순서로 배열하세요.
