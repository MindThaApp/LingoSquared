teaching:
  de.a1.unit10.lesson01.teach.links_abbiegen:
    title: Biegen Sie links ab.
    gloss: 왼쪽으로 도세요.
    note: '*abbiegen*(방향을 틀다)은 분리 동사예요. 접두사 *ab*는 절의 맨 끝으로 이동해요: *Biegen Sie... ab*. *Sie biegen ab*나 *Abbiegen Sie*가 아니에요.'
  de.a1.unit10.lesson01.teach.rechts_abbiegen:
    title: Biegen Sie rechts ab.
    gloss: 오른쪽으로 도세요.
    note: '*links abbiegen*과 같은 분리 동사 구조이며, links 대신 오른쪽을 뜻하는 *rechts*를 써요.'
  de.a1.unit10.lesson01.teach.geradeaus_gehen:
    title: Gehen Sie geradeaus.
    gloss: 곧장 가세요.
    note: '*geradeaus*는 ‘곧장’을 뜻해요. 여기에는 분리되는 접두사가 없어서 더 간단한 존칭 명령문이에요.'
  de.a1.unit10.lesson01.teach.hier_anhalten:
    title: Halten Sie hier an.
    gloss: 여기에 멈추세요.
    note: '*anhalten*(멈추다)도 분리 동사예요. *abbiegen*과 같은 방식으로 *an*이 문장 끝으로 이동해요.'
  de.a1.unit10.lesson01.teach.ecke:
    title: Ecke
    gloss: 모퉁이
    note: '*Ecke*는 모퉁이라는 뜻의 여성 명사예요: *die Ecke*.'
    example_gloss: 모퉁이에서 왼쪽으로 도세요.
  de.a1.unit10.lesson02.teach.wie_komme_ich_zur_bank:
    title: Wie komme ich zur Bank?
    gloss: 은행에 어떻게 가나요?
    note: '*zur*는 *zu der*가 줄어든 형태예요. 여성 명사 die Bank 앞에서 3격으로 쓰여요. 9단원에서 배운 *vom*(von + dem)과 같은 축약 방식이에요.'
