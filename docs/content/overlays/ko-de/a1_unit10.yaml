  de.a1.unit10.lesson04.teach.line01:
    title: 길을 묻는 Felix
    gloss: 'Felix: 실례합니다. 은행에 어떻게 가나요?'
    note: 9단원에서 배운 것과 같은 공손한 말로 시작하지만, 이번에는 단순히 위치가 아니라 가는 길을 물어요.
  de.a1.unit10.lesson04.teach.line02:
    title: 길을 알려 주는 Anna
    gloss: 'Anna: 곧장 가다가 모퉁이에서 왼쪽으로 도세요.'
    note: 완전한 대답에서는 두 단계의 길 안내를 *dann*으로 연결해요.
  de.a1.unit10.lesson04.teach.line03:
    title: 확인하고 더 묻는 Felix
    gloss: 'Felix: 모퉁이에서 왼쪽으로 돌면 되는군요. 알겠습니다. 먼가요?'
    note: Felix는 제대로 이해했는지 확인하려고 길 안내를 되풀이한 뒤 자연스럽게 추가 질문을 해요.
  de.a1.unit10.lesson04.teach.line04:
    title: 거리를 알려 주는 Anna
    gloss: 'Anna: 아니요, 여기서 단 2분 거리예요. 쉽게 찾으실 수 있어요.'
    note: 안심시켜 주는 완전한 대답이에요.
