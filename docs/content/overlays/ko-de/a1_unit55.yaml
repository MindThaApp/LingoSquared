course:
  title: 독일어 A1
  description: 사람의 기본적인 외모를 묘사하는 초급 독일어 과정이에요. 키와 나이의 인상, 머리카락 색과 눈 색, 핵심 질문 Wie sieht ... aus?, 그리고 두 사람의 외모 비교를 배워요.
