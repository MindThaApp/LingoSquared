teaching:
  de.a1.unit55.lesson01.teach.gross_klein:
    title: 키가 큰, 키가 작은
    gloss: 키가 큰 / 키가 작은
    note: '*Groß*는 키가 큰 사람을, *klein*은 키가 작은 사람을 나타내요. 사람에게는 ''긴''에 해당하는 lang이 아니라 groß(큰)를 써요.'
    example_gloss:
    - 레나는 키가 커요.
    - 요나스는 키가 작아요.
  de.a1.unit55.lesson01.teach.alt_jung:
    title: 나이 든, 젊은
    gloss: 나이 든 / 젊은
    note: 여기서 *Alt*와 *jung*은 정확한 나이가 아니라 전반적인 나이의 인상을 나타내요.
    example_gloss:
    - 할아버지는 연세가 많으세요.
    - 펠릭스는 젊어요.
  de.a1.unit55.lesson01.teach.alt_kann_eine:
    title: 'Alt: 숫자 또는 인상'
    gloss: Alt는 Ich bin dreißig Jahre alt처럼 햇수와 함께 쓸 수도 있고, Opa ist alt처럼 전반적인 인상을 나타낼 수도 있어요.
    note: '*Wie alt bist du?*라고 물으면 정확한 나이를 물을 수 있어요. 여기서 *alt*는 숫자 없이 나이가 들어 보이는 인상을 나타내요.'
  de.a1.unit55.lesson01.teach.lena_ist_gross:
    title: 레나는 키가 크고 요나스는 키가 작아요
    gloss: 레나는 키가 크고 요나스는 키가 작아요.
    note: '*und*(그리고)로 이은 간단한 문장으로, 5과의 직접 비교를 준비해요.'
  de.a1.unit55.lesson02.teach.die_haare:
    title: 머리카락
    gloss: 머리카락
    note: '*Haare*는 복수 명사예요: *die Haare*. 독일어에는 단수형 das Haar도 있지만, 머리에 난 머리카락은 보통 Haare라고 해요.'
    example_gloss: 펠릭스는 짧은 검은 머리예요.
  de.a1.unit55.lesson02.teach.blond_braun_grau:
    title: 금발, 갈색, 회색
    gloss: 금발 / 갈색 / 회색
    note: '머리카락 색 세 가지: blond, braun, grau. 관사 없는 복수 명사 앞에서는 -e가 붙어요: blonde, braune, graue Haare.'
    example_gloss:
    - 안나는 금발이에요.
    - 요나스는 갈색 머리예요.
    - 할아버지는 백발이에요.
  de.a1.unit55.lesson02.teach.lang_kurz:
    title: 긴 머리, 짧은 머리
    gloss: 긴 / 짧은 (머리)
    note: '*Kurz*(짧은)와 *lang*(긴)은 머리카락 길이를 나타내요. 여기서도 어미 -e가 붙어요: kurze Haare, lange Haare.'
    example_gloss:
    - 레나는 머리가 길어요.
    - 요나스는 머리가 짧아요.
  de.a1.unit55.lesson02.teach.haare_ist_plural:
    title: Haare에는 어미 -e가 붙어요
    gloss: 'Haare는 복수이고 관사가 없어서 형용사가 -e로 끝나요: kurze Haare, lange Haare, blonde Haare, braune Haare, graue Haare, schwarze Haare.'
    note: 관사가 없을 때 복수 명사 앞의 형용사에는 -e가 붙어요. 3과의 *Augen*과 같은 규칙이에요.
  de.a1.unit55.lesson02.teach.anna_hat_lange:
    title: 'Ihre: 그녀의'
    gloss: '여기서 Ihre는 ''그녀의''라는 뜻이에요: ihre Haare = 그녀의 머리카락. 안나는 머리가 길고, 그녀의 머리카락은 금발이에요.'
    note: 소문자 i로 시작하는 *Ihre*는 '그녀의'를 뜻하는 소유 표현이고, 복수 명사 Haare에 맞춰 쓰여요. 대문자 I로 시작하는 *Ihre*는 '당신의'(존칭)라는 뜻이에요.
  de.a1.unit55.lesson02.teach.felix_hat_kurze:
    title: 펠릭스는 짧은 검은 머리예요
    gloss: 펠릭스는 짧은 검은 머리예요.
    note: '*schwarz*(검은색)를 다시 써요. 이번에는 머리카락에 써요: schwarze Haare.'
  de.a1.unit55.lesson02.teach.anna_hat_lange_2:
    title: 안나는 긴 금발이에요
    gloss: 안나는 긴 금발이에요.
    note: 이번 과의 길이와 색 어휘를 자연스러운 한 문장에 모았어요.
  de.a1.unit55.lesson03.teach.die_augen:
    title: 눈
    gloss: 눈
    note: '*Augen*은 *das Auge*의 복수형이에요. 눈은 두 개라서 독일어에서는 보통 복수형을 써요.'
    example_gloss: 펠릭스는 눈이 갈색이에요.
  de.a1.unit55.lesson03.teach.blau_braun_gruen:
    title: 파란색, 갈색, 초록색
    gloss: 파란색 / 갈색 / 초록색
    note: '색깔: blau(파란색), braun(갈색), grün(초록색).'
    example_gloss:
    - 안나는 눈이 파래요.
    - 요나스는 눈이 갈색이에요.
    - 레나는 눈이 초록색이에요.
  de.a1.unit55.lesson03.teach.augen_ist_plural:
    title: Augen에는 -e가 붙어요
    gloss: 'Augen은 복수이므로 형용사가 -e로 끝나요: blaue Augen, braune Augen, grüne Augen.'
    note: Haare와 같은 규칙이에요. 관사 없는 복수 명사 앞의 형용사에는 어미 -e가 붙어요.
  de.a1.unit55.lesson03.teach.wie_sieht_anna:
    title: 안나는 어떻게 생겼어요?
    gloss: 안나는 어떻게 생겼어요?
    note: '*Wie sieht ... aus?*는 이번 단원의 핵심 질문이에요. *Aussehen*은 분리동사예요: sieht ... aus.'
  de.a1.unit55.lesson03.teach.anna_hat_lange:
    title: 안나는 긴 금발에 파란 눈이에요
    gloss: 안나는 긴 금발에 파란 눈이에요.
    note: '*und*로 머리카락과 눈을 한 문장에 묶은 모범 답이에요.'
  de.a1.unit55.lesson04.teach.anna_ein_neues:
    title: 안나가 니나를 소개해요
    gloss: '안나: 새로운 여자아이가 언어 카페에 와요. 이름은 니나예요.'
    note: '*Ein neues Mädchen kommt*는 새로운 사람을 소개하는 표현이에요. *kommt* 뒤에서 방향을 나타내는 *ins*(in das) Sprachcafé는 4격을 써요.'
  de.a1.unit55.lesson04.teach.felix_okay_wie:
    title: 펠릭스가 어떻게 생겼는지 물어요
    gloss: '펠릭스: 좋아요! 어떻게 생겼어요?'
    note: '이번 단원의 핵심 질문을 다시 쓰되, 이름 대신 *sie*(그녀)를 써요: wie sieht sie aus?'
  de.a1.unit55.lesson04.teach.anna_sie_ist:
    title: 안나가 니나의 키와 머리카락을 설명해요
    gloss: '안나: 키가 작고 짧은 금발이에요.'
    note: '*klein*을 2과의 머리카락 어휘와 함께 썼어요. 두 번째 *sie*는 생략돼요: sie ist klein und hat ...'
  de.a1.unit55.lesson04.teach.felix_und_ihre:
    title: 펠릭스가 눈에 대해 물어요
    gloss: '펠릭스: 그럼 눈은요?'
    note: 여기서 *Ihre*는 '그녀의'라는 뜻의 소유 표현이고, '당신'과 관련된 형태가 아니에요. 복수 명사 Augen에 맞춰 쓰여요.
  de.a1.unit55.lesson04.teach.anna_sie_hat:
    title: 안나가 니나의 눈을 설명해요
    gloss: '안나: 눈은 초록색이에요.'
    note: 3과의 *grüne Augen*을 다시 써요.
  de.a1.unit55.lesson04.teach.felix_danke_dann:
    title: 펠릭스가 니나를 알아볼 거예요
    gloss: '펠릭스: 고마워요! 그럼 분명히 알아볼 수 있겠네요.'
    note: '*Dann erkenne ich sie bestimmt*는 ''그럼 분명히 알아볼 거예요''라는 뜻이에요. *dann* 뒤에서는 동사가 두 번째 자리에 와요: dann erkenne ich sie.'
  de.a1.unit55.lesson05.teach.jonas_und_lena:
    title: 요나스와 레나 비교하기
    gloss: 요나스와 레나는 남매지만 서로 다르게 생겼어요. 요나스는 키가 작고, 짧은 갈색 머리에 갈색 눈이에요. 레나는 요나스보다 키가 크고, 긴 갈색 머리에 초록색 눈이에요. 당신은 어떻게 생겼어요?
    note: 지금까지 배운 색과 길이 어휘를 모두 다시 쓴 짧은 비교 글이에요. 마지막에는 이번 단원의 핵심 질문을 읽는 사람에게 던져요.
    glosses:
      Bruder: 남자 형제
      Schwester: 여자 형제
      sehen: ~해 보이다
      unterschiedlich: 다른
      klein: 짧은
      kurze: 짧은
      braune: 갈색
      Haare: 머리카락
      Augen: 눈
      größer: 키가 더 큰
      lange: 긴
      grüne: 초록색
      aus: ('aussehen' = ~해 보이다 의 일부)
  de.a1.unit55.lesson05.teach.das_muster_kennst:
    title: 다시 만나는 비교급
    gloss: '형용사 + -er + als(~보다) 패턴은 이미 알고 있어요. 여기서는 사람에게 써요: Lena ist größer als Jonas.'
    note: 비교 단원에서 배운 *-er + als* 패턴과 같아요. Groß는 größer가 되어 모음에 움라우트가 붙어요.
  de.a1.unit55.lesson05.teach.lena_hat_laengere:
    title: 레나는 요나스보다 머리가 길어요
    gloss: Lena는 Jonas보다 머리가 길어요.
    note: '*Längere Haare*: 관사 없이 복수 명사 앞에 올 때 länger에는 -e가 붙고, 비교급에서는 lang의 a가 ä로 바뀌어요.'
  de.a1.unit55.lesson05.teach.ich_habe_kurze:
    title: 저는 짧은 갈색 머리예요
    gloss: 저는 짧은 갈색 머리예요.
    note: '*Ich habe ...*를 사용한 1인칭 모범 문장이에요. 자신의 외모를 설명할 때 그대로 쓸 수 있어요.'
  de.a1.unit55.lesson06.teach.felix_schau_mal:
    title: Felix가 Nina를 발견해요
    gloss: 'Felix: 저기 봐, 저 사람 Nina야? 짧은 금발 머리에 초록색 눈이네.'
    note: '*Schau mal*(한번 봐)은 친근하게 무언가를 가리킬 때 쓰는 말이에요. du에 대한 명령형이에요.'
  de.a1.unit55.lesson06.teach.anna_ja_das:
    title: Anna가 확인해 줘요
    gloss: 'Anna: 응, Nina 맞아!'
    note: 짧고 자연스러운 확인 표현이에요.
  de.a1.unit55.lesson06.teach.nina_hallo_bist:
    title: Nina가 Felix에게 인사해요
    gloss: 'Nina: 안녕, 네가 Felix니?'
    note: '친근한 반말 질문이에요: *bist du ...?*(너는 ~이니?). bist는 sein의 du 형태예요.'
  de.a1.unit55.lesson06.teach.felix_ja_freut:
    title: Felix도 Nina에게 인사해요
    gloss: 'Felix: 응! 만나서 반가워, Nina.'
    note: '*Freut mich*는 처음 만났을 때 쓰는 기본 표현이에요. 2단원에서도 나왔어요. 이미 아는 사람에게는 *Schön, dich zu sehen*이라고 말해요.'
  de.a1.unit55.lesson06.teach.nina_freut_mich:
    title: Nina도 인사를 받아 줘요
    gloss: 'Nina: 나도 만나서 반가워!'
    note: 대화를 마무리해요. Felix는 Anna가 앞서 설명한 대로 Nina를 알아봤어요.
