course:
  title: 독일어 A1
  description: 여가 활동을 설명하는 초급 독일어 과정이에요. 취미 관련 어휘와 빈도 표현을 배우고, 여가 시간에 무엇을 하는지 묻고 답하며, 두 사람의 취미를 비교해요.
