teaching:
  de.a1.unit54.lesson01.teach.lesen_sport_treiben:
    title: 독서, 운동, 요리
    gloss: 읽다, 운동하다, 요리하다
    note: 자주 쓰는 취미 동사 세 가지는 *lesen*(읽다), *Sport treiben*(운동하다), *kochen*(요리하다)이에요. Sport는 명사이므로 대문자로 써요.
    example_gloss:
    - 저는 책 읽는 것을 좋아해요.
    - 저는 토요일마다 운동해요.
    - 저는 친구들을 위해 요리하는 것을 좋아해요.
  de.a1.unit54.lesson01.teach.die_freizeit:
    title: 여가 시간
    gloss: 여가 시간
    note: '*Die Freizeit*는 여성 명사이므로 항상 관사 die와 함께 익히세요. 취미에 관해 이야기할 때 중요한 단어예요.'
    example_gloss: 저는 여가 시간에 독서하는 것을 좋아해요.
  de.a1.unit54.lesson01.teach.in_meiner_freizeit:
    title: 여가 시간에 하는 일 말하기
    gloss: 저는 여가 시간에 독서하는 것을 좋아해요.
    note: '*Lese*는 *lesen*(읽다)의 ich 형태예요. 문장이 시간 표현으로 시작해도 동사는 여전히 두 번째 자리에 와요: in meiner Freizeit lese ich gern.'
  de.a1.unit54.lesson02.teach.musik_hoeren_zeichnen:
    title: 음악, 그림 그리기, 비디오 게임
    gloss: 음악을 듣다, 그림을 그리다, 비디오 게임을 하다
    note: 취미를 나타내는 표현 세 가지는 *Musik hören*(음악을 듣다), *zeichnen*(그림을 그리다), *Videospiele spielen*(비디오 게임을 하다)이에요. Musik과 Videospiele는 명사이므로 대문자로 써요.
    example_gloss:
    - 저는 음악 듣는 것을 좋아해요.
    - 저는 그림을 자주 그려요.
    - 저는 친구들과 비디오 게임 하는 것을 좋아해요.
  de.a1.unit54.lesson02.teach.ich_hoere_gern:
    title: 음악 듣기를 좋아한다고 말하기
    gloss: 저는 음악 듣는 것을 좋아해요.
    note: 독일어는 *Musik hören*처럼 전치사 없이 목적어를 바로 써요. 한국어의 '음악을 듣다'와 비슷해요.
  de.a1.unit54.lesson02.teach.ich_spiele_gern:
    title: 친구들과 게임하는 것을 좋아한다고 말하기
    gloss: 저는 친구들과 비디오 게임 하는 것을 좋아해요.
    note: '*Mit Freunden*(친구들과): mit 뒤에는 항상 3격이 와요. 그래서 Freunde가 Freunden이 돼요.'
  de.a1.unit54.lesson03.teach.immer_oft_manchmal:
    title: 항상, 자주, 가끔, 전혀 ~않다
    gloss: 항상, 자주, 가끔, 절대 ~않다
    note: '기본 빈도부사 네 개: immer, oft, manchmal, nie. 보통 동사 바로 뒤에 와요: ich spiele nie.'
    example_gloss:
    - 저는 토요일마다 항상 운동해요.
    - 저는 책을 자주 읽어요.
    - 저는 가끔 그림을 그려요.
    - 저는 게임을 전혀 안 해요.
  de.a1.unit54.lesson03.teach.jede_woche_jedes:
    title: 매주, 주말마다
    gloss: 매주, 주말마다
    note: '*Jede Woche*와 *jedes Wochenende*는 둘 다 ''매~''라는 뜻이지만, 명사의 성에 따라 어미가 달라져요. 다음 카드를 보세요.'
    example_gloss:
    - 저는 매주 친구들을 위해 요리해요.
    - 저는 주말마다 운동해요.
  de.a1.unit54.lesson03.teach.die_woche_jede:
    title: jede와 jedes
    gloss: Die Woche는 여성명사라서 jede Woche예요. Das Wochenende는 중성명사라서 jedes Wochenende예요.
    note: '*Woche*는 여성명사(*die Woche*)라서 *jede*를 쓰고, *Wochenende*는 중성명사(*das Wochenende*)라서 *jedes*를 써요. 명사를 항상 관사와 함께 외우면 어미도 알 수 있어요.'
  de.a1.unit54.lesson03.teach.was_machst_du:
    title: 여가 시간에 대해 묻기
    gloss: 여가 시간에 무엇을 하나요?
    note: 이 단원의 핵심 질문이에요. 누구에게든 취미를 물을 때 이 문장을 쓰세요.
  de.a1.unit54.lesson04.teach.anna_wir_gehen:
    title: 안나가 취미 이야기를 꺼내요
    gloss: '안나: 우리는 자주 같이 산책해요. 그런데 펠릭스, 너는 여가 시간에 그 밖에 뭘 해요?'
    note: '*Wir gehen oft zusammen spazieren*에는 gehen과 두 번째 동사가 함께 쓰여요. 변화한 동사 gehen은 두 번째 자리에 오고, 동사원형 spazieren은 문장 끝에 가요.'
  de.a1.unit54.lesson04.teach.felix_ich_koche:
    title: 펠릭스의 취미
    gloss: '펠릭스: 저는 요리하는 걸 좋아해요, 집에서도요. 그리고 운동도 자주 해요.'
    note: '*Auch zu Hause*(집에서도)는 펠릭스가 식당 일뿐 아니라 취미로도 요리한다는 점을 분명히 해 줘요.'
  de.a1.unit54.lesson04.teach.anna_kochst_du:
    title: 안나가 놀라요
    gloss: '안나: 집에서도 요리해요? 직장에서 이미 하루 종일 요리하잖아요!'
    note: '*Den ganzen Tag*(하루 종일)는 4격이라서 der Tag가 den Tag가 돼요. 이렇게 시간의 길이를 나타내는 표현은 4격을 써요.'
  de.a1.unit54.lesson04.teach.felix_ja_aber:
    title: 펠릭스가 설명해요
    gloss: '펠릭스: 네, 그래도 저는 요리가 편안하다고 느껴요. 그런데 너는 뭘 하는 걸 좋아해요?'
    note: '*Kochen finde ich entspannend*는 강조하려고 Kochen을 맨 앞에 두었어요. 동사는 그래도 두 번째 자리에 있어서 ich가 그 뒤로 가요.'
  de.a1.unit54.lesson04.teach.anna_ich_lese:
    title: 안나의 취미
    gloss: '안나: 저는 책 읽는 걸 좋아하고, 음악도 자주 들어요.'
    note: 앞에서 배운 취미 동사 두 개를 *und*(그리고)로 한 문장에 연결했어요.
  de.a1.unit54.lesson04.teach.felix_spielst_du:
    title: 펠릭스가 게임에 대해 물어요
    gloss: '펠릭스: 너도 게임해요?'
    note: '짧은 예/아니요 질문이에요. 동사가 맨 앞에 와요: spielst du ...?'
  de.a1.unit54.lesson04.teach.anna_nein_ich:
    title: 안나가 대답해요
    gloss: '안나: 아니요, 저는 게임을 전혀 안 해요. 하지만 가끔 그림은 그려요!'
    note: 앞에서 배운 *nie*(전혀 ~않다)와 *manchmal*(가끔)을 한 대답 안에서 대비시켰어요. 둘 다 동사 바로 뒤에 와요.
  de.a1.unit54.lesson05.teach.felix_und_ich:
    title: 취미 비교하기
    gloss: 펠릭스와 저는 자주 같이 산책해요. 하지만 다른 취미도 있어요. 펠릭스는 요리하는 걸 좋아해서 집에서도 하고, 운동도 자주 해요. 저는 책 읽는 걸 좋아하고 음악도 자주 들어요. 가끔 그림을 그리지만 게임은 전혀 안 해요. 여러분은 여가 시간에 뭘 하는 걸 좋아해요?
    note: 안나의 메시지는 앞선 수업의 내용을 정리하고, 읽는 사람에게 이 단원의 핵심 질문을 던지며 끝나요.
    glosses:
      spazieren: 산책하다
      oft: 자주
      zusammen: 함께
      andere: 다른
      kocht: 요리하다
      gern: 즐겨
      Hause: 집에서
      Sport: 운동하다
      lese: 읽다
      höre: 듣다
      Musik: 음악
      zeichne: 그리다
      manchmal: 가끔
      spiele: 게임하다
      nie: 전혀 하지 않다
      freien: 자유로운
      Zeit: 시간
  de.a1.unit54.lesson06.teach.felix_was_machst:
    title: 펠릭스가 주말 계획을 물어요
    gloss: '펠릭스: 이번 주말에 뭐 해요?'
    note: '*Dieses Wochenende*(이번 주말)에는 중성 어미 -es가 붙어요. das Wochenende가 중성명사이기 때문이에요.'
  de.a1.unit54.lesson06.teach.anna_ich_weiss:
    title: 안나가 망설여요
    gloss: '안나: 아직 모르겠어요. 책 읽는 것도 좋아하지만, 밖에도 나가고 싶어요.'
    note: '*Nach draußen*(밖으로, 직역하면 ''바깥으로'')은 집을 나서고 싶다고 할 때 흔히 쓰는 표현이에요.'
  de.a1.unit54.lesson06.teach.felix_gehen_wir:
    title: 펠릭스가 계획을 제안해요
    gloss: '펠릭스: 같이 산책할까요? 그 후에 제가 우리를 위해 요리할게요.'
    note: '*Danach*(그 후에)가 맨 앞에 오면 동사가 그다음에, 주어는 그 뒤에 와요: danach koche ich.'
  de.a1.unit54.lesson06.teach.anna_gute_idee:
    title: 안나가 동의해요
    gloss: '안나: 좋은 생각이에요! 저는 산책하는 것도 좋아하고 요리하는 것도 좋아해요.'
    note: '동사 뒤의 *gern*은 그 일을 즐긴다는 뜻이에요: ich gehe gern spazieren, ich koche gern. 거의 모든 동사와 함께 쓸 수 있어요.'
  de.a1.unit54.lesson06.teach.felix_perfekt_dann:
    title: 펠릭스가 확인해요
    gloss: '펠릭스: 좋아요. 그럼 토요일에 봐요!'
    note: '*Samstag*(토요일)에 만나기로 한 계획을 확인하는 다정한 마무리 인사예요. 요일 앞에는 *am*을 써요: am Samstag.'
