    gloss: '펠릭스: 저는 엔지니어예요. 사무실에서 일해요. 안나 씨는요?'
    note: 펠릭스는 자신의 직업과 일하는 곳을 말해요.
    example_gloss: 저는 사무실에서 일해요.
  de.a1.unit18.lesson02.teach.line03:
    title: 안나가 카페에서 하는 일을 설명해요
    gloss: '안나: 저는 카페에서 일해요. 커피와 차를 가져다줘요.'
    note: 안나는 자신이 일하는 곳과 그곳에서 하는 일을 말해요.
    example_gloss: '문맥상: 저는 커피와 차를 가져다줘요.'
