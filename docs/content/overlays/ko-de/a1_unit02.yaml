    title: Wie heißen Sie?
    gloss: 성함이 어떻게 되세요?
    note: '*Wie heißen Sie?*는 글자 그대로는 ''어떻게 불리세요?''라고 묻는 표현이며, 1단원에서 배운 높임말 *Sie*를 사용해요.'
  de.a1.unit02.lesson01.teach.ich_heisse_anna:
    title: Ich heiße Anna.
    gloss: 제 이름은 Anna예요.
    note: '*heißen*은 ''…라고 불리다''라는 뜻이며, 이름을 말할 때 일반적으로 사용하는 표현이에요.'
  de.a1.unit02.lesson01.teach.wie_heisst_du:
    title: Wie heißt du?
    gloss: 이름이 뭐야?
    note: 1단원에서 배운 *du*를 사용하는 반말 표현이에요.
  de.a1.unit02.lesson01.teach.ich_heisse_felix:
    title: Ich heiße Felix.
    gloss: 제 이름은 Felix예요.
    note: '*Ich heiße Anna*와 같은 구조이며 이름만 달라요.'
  de.a1.unit02.lesson01.teach.freut_mich:
    title: Freut mich.
    gloss: 만나서 반가워요.
    note: 누군가를 만나서 반갑다고 말하는 짧고 흔한 표현으로, 높임말과 반말 상황에서 모두 사용할 수 있어요.
  de.a1.unit02.lesson01.teach.ganz_meinerseits:
    title: Ganz meinerseits.
    gloss: 저도 반가워요.
    note: '*Freut mich*에 자연스럽게 답하는 표현으로, 글자 그대로는 ''전적으로 제 쪽도 그래요''라는 뜻이에요.'
  de.a1.unit02.lesson02.teach.ich:
    title: ich
    gloss: 나
    note: 독일어에서 *ich*는 문장 맨 앞이 아니라면 소문자로 써요. 문장 맨 앞에서는 *Ich bin Anna.*처럼 대문자로 시작해요.
  de.a1.unit02.lesson02.teach.du:
    title: du
    gloss: 너
    note: 1단원에서 이미 배운 말로, 여기서는 완전한 문장의 주어로 다시 익혀요.
  de.a1.unit02.lesson02.teach.ich_bin_anna:
    title: Ich bin Anna.
    gloss: 저는 Anna예요.
    note: '*bin*은 *sein*의 *ich*에 맞는 형태예요.'
  de.a1.unit02.lesson02.teach.du_bist_felix:
    title: Du bist Felix.
    gloss: 너는 Felix야.
    note: '*bist*는 *sein*의 *du*에 맞는 형태예요.'
  de.a1.unit02.lesson03.teach.deutschland:
    title: Deutschland
    gloss: 독일
    note: 독일어의 나라 이름에는 보통 관사를 붙이지 않으므로 *das Deutschland*가 아니라 *Deutschland*라고 해요.
    example_gloss: 저는 독일에서 왔어요.
  de.a1.unit02.lesson03.teach.england:
    title: England
    gloss: 잉글랜드
    note: England은 독일어 발음에 따라 읽어요.
    example_gloss: 저는 잉글랜드에서 왔어요.
  de.a1.unit02.lesson03.teach.frankreich:
