    gloss: 그쪽은요?
    note: '*Sie* 높임말에 맞춰 상대에게 짧게 되묻는 표현이에요.'
  de.a1.unit02.lesson05.teach.line01:
    title: Felix가 Anna에게 인사해요
    gloss: 'Felix가 말해요: 안녕하세요!'
    note: Felix와 Anna는 1단원에서 한 번 만났지만 서로 이름은 묻지 않았던 이웃이에요. 이번에는 버스 정류장에서 다시 마주쳤어요.
  de.a1.unit02.lesson05.teach.line02:
    title: Anna가 인사를 되돌려 주고 이름을 물어요
    gloss: 'Anna가 말해요: 안녕하세요! 성함이 어떻게 되세요?'
    note: Anna는 1단원에서 낯선 사람끼리 사용했던 격식 있는 *Sie*를 계속 사용해요.
  de.a1.unit02.lesson05.teach.line03:
    title: Felix가 이름을 말하고 되물어요
    gloss: 'Felix가 말해요: 제 이름은 Felix예요. 당신은요?'
    note: Felix는 대답한 뒤 격식 있게 같은 질문을 되돌려요.
  de.a1.unit02.lesson05.teach.line04:
    title: Anna가 이름을 말해요
    gloss: 'Anna가 말해요: 제 이름은 Anna예요. 만나서 반가워요.'
    note: Anna도 같은 방식으로 대답하고 반갑다는 인사를 덧붙여요.
  de.a1.unit02.lesson05.teach.line05:
    title: Felix가 화답하고 출신지를 물어요
    gloss: 'Felix가 말해요: 저도 반가워요. 어디에서 오셨어요?'
    note: Felix는 반갑다는 인사에 화답한 뒤 출신지에 관한 이야기로 대화를 이어 가요.
  de.a1.unit02.lesson05.teach.line06:
    title: Anna가 대답하고 되물어요
    gloss: 'Anna가 말해요: 저는 독일에서 왔어요. 당신은요?'
    note: 두 사람이 독일어권 도시에 사는 이웃이라는 설정에 맞게, Anna가 독일 출신임을 확인할 수 있어요.
  de.a1.unit02.lesson05.teach.line07:
    title: Felix가 대답해요
    gloss: 'Felix가 말해요: 저는 잉글랜드에서 왔어요.'
    note: 여기서 Felix가 잉글랜드 출신이며 독일에 사는 이웃이라는 사실을 알게 돼요.
  de.a1.unit02.lesson05.teach.line08:
    title: Anna가 작별 인사를 해요
    gloss: 'Anna가 말해요: 안녕히 가세요!'
    note: 1단원에서 배운 격식 있는 작별 인사로, 두 사람이 계속 *Sie*를 사용하는 것과 잘 맞아요.
  de.a1.unit02.lesson05.teach.line09:
    title: Felix가 작별 인사를 해요
    gloss: 'Felix가 말해요: 안녕히 가세요!'
    note: Felix도 같은 방식으로 작별하며, 만나는 내내 사용한 격식 수준을 유지해요.
  de.a1.unit02.lesson05.teach.steckbrief:
    title: 짧은 서면 소개
    gloss: '이름: Felix. 국가: 잉글랜드.'
