teaching:
  de.a1.unit04.lesson01.teach.montag:
    title: Montag
    gloss: 월요일
    note: 독일어권 국가에서는 *Montag*이 한 주의 첫날이에요. 한국과 마찬가지로 월요일부터 시작하는 방식이에요.
    example_gloss: 저는 월요일에 시간이 있어요.
  de.a1.unit04.lesson01.teach.dienstag:
    title: Dienstag
    gloss: 화요일
    note: '*Dienstag*은 한 주의 둘째 날이에요.'
    example_gloss: 저는 화요일에 시간이 있어요.
  de.a1.unit04.lesson01.teach.mittwoch:
    title: Mittwoch
    gloss: 수요일
    note: '*Mittwoch*은 말 그대로 ‘한 주의 중간’을 뜻하며, 실제로 독일의 평일 가운데 중간에 해당해요.'
    example_gloss: 저는 수요일에 시간이 있어요.
  de.a1.unit04.lesson01.teach.donnerstag:
    title: Donnerstag
    gloss: 목요일
    note: '*Donnerstag*은 게르만 신 도나르, 즉 토르의 이름에서 유래했어요.'
    example_gloss: 저는 목요일에 시간이 있어요.
  de.a1.unit04.lesson01.teach.freitag:
    title: Freitag
    gloss: 금요일
    note: '*Freitag*은 게르만 여신 프리그의 이름에서 유래했어요.'
    example_gloss: 저는 금요일에 시간이 있어요.
  de.a1.unit04.lesson01.teach.samstag:
    title: Samstag
    gloss: 토요일
    note: '*Samstag*은 독일 대부분 지역에서 토요일을 뜻하는 표준어예요. 독일 북부와 동부에서는 지역에 따라 *Sonnabend*도 써요.'
    example_gloss: 저는 토요일에 시간이 있어요.
  de.a1.unit04.lesson01.teach.sonntag:
    title: Sonntag
    gloss: 일요일
    note: '*Sonntag*은 말 그대로 ‘태양의 날’을 뜻해요.'
    example_gloss: 저는 일요일에 시간이 있어요.
  de.a1.unit04.lesson01.teach.welcher_tag:
    title: Welcher Tag ist heute?
    gloss: 오늘은 무슨 요일이에요?
    note: '*heute*는 ‘오늘’, *Welcher Tag*는 ‘어느 날’을 뜻해요.'
  de.a1.unit04.lesson02.teach.januar:
    title: Januar
    gloss: 1월
    note: '*Januar*는 한 해의 첫째 달이에요.'
    example_gloss: 제 생일은 1월이에요.
  de.a1.unit04.lesson02.teach.maerz:
    title: März
    gloss: 3월
    note: '*März*는 한 해의 셋째 달이에요.'
    example_gloss: 제 생일은 3월이에요.
  de.a1.unit04.lesson02.teach.mai:
    title: Mai
    gloss: 5월
    note: '*Mai*는 짧아서 기억하기 쉬워요.'
    example_gloss: 제 생일은 5월이에요.
  de.a1.unit04.lesson02.teach.juli:
    title: Juli
    gloss: 7월
    note: '*Juli*는 한 해의 일곱째 달이에요.'
    example_gloss: 제 생일은 7월이에요.
  de.a1.unit04.lesson02.teach.september:
    title: September
    gloss: 9월
    note: 독일어로 9월은 *September*라고 써요.
    example_gloss: 제 생일은 9월이에요.
  de.a1.unit04.lesson02.teach.dezember:
    title: Dezember
    gloss: 12월
    note: '*Dezember*는 한 해의 마지막 달이에요.'
    example_gloss: 제 생일은 12월이에요.
  de.a1.unit04.lesson02.teach.welcher_monat:
    title: Welcher Monat ist es?
    gloss: 몇 월이에요?
    note: '*Monat*는 ‘달’, *es*는 ‘그것’을 뜻해요.'
  de.a1.unit04.lesson03.teach.wievielte:
    title: Der Wievielte ist heute?
    gloss: 오늘은 며칠이에요?
    note: 말 그대로 ‘오늘은 몇 번째 날인가요?’라는 구조로, 독일어에서 날짜를 묻는 일반적인 표현이에요.
  de.a1.unit04.lesson03.teach.siebte_juli:
    title: Heute ist der siebte Juli.
    gloss: 오늘은 7월 7일이에요.
    note: 독일어에서는 날짜를 일, 월 순서로 말해요. *der siebte Juli*는 ‘7월의 일곱째 날’이라는 뜻이에요. *der siebte Juli*를 하나의 표현으로 익혀 두세요.
  de.a1.unit04.lesson03.teach.dienstag_siebte_juli:
    title: Heute ist Dienstag, der siebte Juli.
    gloss: 오늘은 7월 7일 화요일이에요.
    note: 날짜 앞에 요일을 덧붙이고 쉼표로 구분해요.
  de.a1.unit04.lesson03.teach.numerische_form:
    title: Man kann es auch als 7.7. schreiben.
    gloss: 7.7.처럼 쓸 수도 있어요.
    note: 독일어의 숫자 날짜는 일, 월 순서로 쓰고 각각의 숫자 뒤에 마침표를 붙여요. 7.7.은 7월 7일을 뜻해요.
  de.a1.unit04.lesson03.teach.geburtstag_frage:
    title: Wann haben Sie Geburtstag?
    gloss: 생일이 언제이세요?
    note: 말 그대로 ‘언제 생일을 가지고 계세요?’라는 구조예요. 독일어에서는 생일에 *haben*을 사용해요.
  de.a1.unit04.lesson03.teach.geburtstag_antwort:
    title: Mein Geburtstag ist der dritte März.
    gloss: 제 생일은 3월 3일이에요.
    note: '*Mein Geburtstag*는 ‘내 생일’, *der dritte März*는 ‘3월 3일’을 뜻해요. 일을 먼저 말하고 그다음에 월을 말해요.'
  de.a1.unit04.lesson04.teach.oeffnet:
    title: öffnet
    gloss: 열어요
    note: '*öffnet*은 *öffnen*의 3인칭 단수형으로, 가게나 도서관 등이 ‘문을 열다’라고 할 때 써요.'
    example_gloss: 가게는 월요일에 문을 열어요.
  de.a1.unit04.lesson04.teach.wieder:
    title: wieder
    gloss: 다시
    note: '*wieder*는 ‘다시’를 뜻해요. 여기서는 어떤 곳이 언제 다시 문을 여는지 물을 때 써요.'
    example_gloss: 도서관은 월요일에 다시 문을 열어요.
  de.a1.unit04.lesson04.teach.die:
    title: die
    gloss: 그, 그들
    note: '*die*는 여성 단수 명사와 모든 복수 명사에 쓰는 정관사예요. 여기서는 여성 명사인 *Bibliothek*과 함께 쓰였어요.'
    example_gloss: 그 도서관은 커요.
  de.a1.unit04.lesson04.teach.bibliothek:
    title: Bibliothek
    gloss: 도서관
    note: '*Bibliothek*은 여성 명사예요(*die Bibliothek*).'
    example_gloss: 저는 도서관에 가요.
  de.a1.unit04.lesson04.teach.am:
    title: am
    gloss: ~에
    note: '*am*은 *an dem*의 축약형으로, 요일과 날짜 앞에 써요(*am Montag*는 ‘월요일에’라는 뜻이에요).'
    example_gloss: 월요일에는 제가 일해요.
  de.a1.unit04.lesson04.teach.den:
    title: den
    gloss: 그
    note: '*den*은 *der*의 남성 대격형이에요. *am Donnerstag, den neunten Juli*처럼 요일 뒤에 완전한 날짜를 말할 때 나타나요. 이 단계에서는 격을 분석하기보다 정해진 표현으로 익혀 두세요. *am* 뒤에는 *dem*도 볼 수 있으며, 이 역시 올바른 형태예요.'
    example_gloss: 우리는 7월 9일 목요일에 만나요.
  de.a1.unit04.lesson04.teach.neunten:
    title: neunten
    gloss: 아홉 번째
    note: '*neunten*은 *neun*의 어미가 변화한 서수형으로 날짜에 써요. 주격의 *der neunte Juli*가 이와 같은 완전한 날짜 구조에서는 *den neunten Juli*로 바뀌어요.'
    example_gloss: 제 생일은 7월 9일이에요.
  de.a1.unit04.lesson04.teach.line01:
    title: 펠릭스가 날짜를 물어요
    gloss: 펠릭스가 말해요. 오늘은 며칠이에요?
  de.a1.unit04.lesson04.teach.line02:
    title: 안나가 날짜를 말해요
    gloss: 안나가 말해요. 오늘은 7월 7일 화요일이에요.
  de.a1.unit04.lesson04.teach.line03:
    title: 펠릭스가 도서관에 관해 물어요
    gloss: 'Felix가 말해요: 도서관은 언제 다시 문을 여나요?'
  de.a1.unit04.lesson04.teach.line04:
    title: Anna의 대답
    gloss: 'Anna가 말해요: 7월 9일 목요일에 다시 문을 열어요.'
    note: 여기서 *Sie*는 ‘그것’을 뜻하며, 여성 명사인 *die Bibliothek*을 가리켜요.
  de.a1.unit04.lesson04.teach.line05:
    title: Felix의 작별 인사
    gloss: 'Felix가 말해요: 좋아요, 목요일에 봐요.'
    note: '*bis Donnerstag*는 ‘목요일까지’라는 뜻이며, ‘목요일에 봐요’라는 의미로 흔히 쓰는 작별 인사예요.'
  de.a1.unit04.lesson04.teach.notiz:
    title: 문에 붙은 안내문
    gloss: 7월 9일 목요일까지 휴관해요.
    note: '*Geschlossen*은 ‘닫힌’이라는 뜻이에요.'
