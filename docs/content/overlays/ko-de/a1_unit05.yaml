  de.a1.unit05.lesson01.teach.wie_spaet:
    title: Wie spät ist es?
    gloss: 몇 시예요?
    note: 직역하면 ‘얼마나 늦었나요?’이며, 시간을 물을 때 쓰는 일반적인 표현이에요.
  de.a1.unit05.lesson01.teach.drei_uhr:
    title: Es ist drei Uhr.
    gloss: 3시예요.
    note: '*Uhr*는 ‘시’를 뜻해요. 정각은 숫자 뒤에 *Uhr*를 붙여 나타내요.'
  de.a1.unit05.lesson01.teach.halb_vier:
    title: halb vier = 3:30
    gloss: 3시 30분이에요.
    note: 독일어에서는 30분을 다음 정각을 기준으로 말해요. *halb vier*는 ‘4시까지 절반’이라는 뜻이므로 4시 30분이 아니라 3시 30분이에요.
  de.a1.unit05.lesson01.teach.fuenf_uhr:
    title: Es ist fünf Uhr.
    gloss: 5시예요.
  de.a1.unit05.lesson02.teach.viertel_nach:
    title: Es ist Viertel nach drei.
    gloss: 3시 15분이에요.
    note: '*Viertel*은 ‘4분의 1’, *nach*는 ‘후’를 뜻해요.'
  de.a1.unit05.lesson02.teach.viertel_vor:
    title: Es ist Viertel vor vier.
    gloss: 3시 45분이에요.
    note: '*vor*는 ‘전’을 뜻해요.'
  de.a1.unit05.lesson02.teach.zehn_nach:
    title: Es ist zehn nach vier.
    gloss: 4시 10분이에요.
    note: 정각에서 몇 분이 지났는지는 ‘분 + *nach* + 시’의 순서로 나타내요.
  de.a1.unit05.lesson02.teach.zehn_vor:
    title: Es ist zehn vor fünf.
    gloss: 4시 50분이에요.
    note: 다음 정각까지 몇 분 남았는지는 ‘분 + *vor* + 다음 시각’의 순서로 나타내요.
  de.a1.unit05.lesson03.teach.morgen:
    title: Morgen
    gloss: 아침
    note: '*Morgen*은 아침을 뜻하는 명사로, 대략 오전 6시부터 낮 12시까지를 가리켜요.'
    example_gloss: 좋은 아침이에요, Felix!
  de.a1.unit05.lesson03.teach.mittag:
    title: Mittag
    gloss: 정오
    note: '*Mittag*은 Morgen과 Nachmittag 사이의 한가운데인 정오 자체를 뜻해요.'
    example_gloss: 정오예요.
  de.a1.unit05.lesson03.teach.nachmittag:
    title: Nachmittag
    gloss: 오후
    note: '*Nachmittag*은 대략 낮 12시부터 오후 6시까지를 가리켜요.'
    example_gloss: 저는 오후에 일해요.
  de.a1.unit05.lesson03.teach.abend:
    title: Abend
    gloss: 저녁
    note: '*Abend*는 대략 오후 6시부터 밤 10시까지를 가리켜요.'
    example_gloss: 좋은 저녁이에요, Anna!
  de.a1.unit05.lesson03.teach.nacht:
    title: Nacht
    gloss: 밤
    note: '*Nacht*는 대략 밤 10시부터 오전 6시까지를 가리켜요.'
    example_gloss: 잘 자요, Felix!
  de.a1.unit05.lesson03.teach.mitternacht:
    title: Mitternacht
    gloss: 자정
    note: '*Mitternacht*은 정확히 자정 12시, 즉 0 Uhr예요.'
