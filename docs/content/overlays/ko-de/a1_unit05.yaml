    gloss: 가게는 18시(오후 6시)에 문을 닫아요.
    note: '*schließt*는 ‘문을 닫아요’라는 뜻이에요. 공식 영업시간에는 24시간제를 사용해요.'
  de.a1.unit05.lesson04.teach.wann:
    title: Wann
    gloss: 언제
    note: '*Wann*은 시간에 관한 질문을 시작할 때 써요.'
    example_gloss: 언제 와요?
  de.a1.unit05.lesson04.teach.oeffnet_die:
