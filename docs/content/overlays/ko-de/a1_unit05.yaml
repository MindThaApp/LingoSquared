    gloss: 열여덟
    note: '*achtzehn*은 18을 뜻하며, 여기서는 공식적인 시간을 나타내는 24시간제에 쓰였어요(achtzehn Uhr = 오후 6시).'
    example_gloss: 가게는 18시(오후 6시)에 문을 닫아요.
  de.a1.unit05.lesson03.teach.laden_oeffnet:
