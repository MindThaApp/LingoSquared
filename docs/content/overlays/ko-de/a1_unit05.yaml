    gloss: 가게는 오전 9시에 문을 열어요.
    note: '*um* + 시각은 ‘몇 시에’를 나타내고, *morgens*는 ‘아침에’를 뜻해요.'
  de.a1.unit05.lesson03.teach.laden_schliesst:
