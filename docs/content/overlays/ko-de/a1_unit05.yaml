    gloss: ~을/를 연다
    note: '*öffnet*는 *öffnen*(열다)의 3인칭 단수형이고, *die*는 여성·복수 정관사로 *die Bibliothek*과 호응해요.'
    example_gloss: 도서관은 언제 문을 열어요?
  de.a1.unit05.lesson04.teach.bibliothek:
    title: Bibliothek
    gloss: 도서관
    note: '*Bibliothek*은 여성 명사(*die Bibliothek*)이며, 4단원에서 나온 것과 같은 장소예요.'
    example_gloss: 저는 도서관에 가요.
  de.a1.unit05.lesson04.teach.sie_pronomen:
    title: sie
    gloss: 그것 / 그녀 / 그들(소문자)
    note: 여기서 *sie*는 여성 명사 *die Bibliothek*을 대신하는 3인칭 대명사로 ‘그것’을 뜻해요. Anna와 Felix가 서로에게 쓰는 대문자 *Sie*(존댓말의 ‘당신’)와 혼동하지 마세요.
    example_gloss: 저는 도서관을 좋아해요. 그곳에 자주 가요.
  de.a1.unit05.lesson04.teach.dann:
