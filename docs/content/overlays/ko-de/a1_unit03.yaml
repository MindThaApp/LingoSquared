    note: '*elf*와 *zwölf*는 불규칙한 형태예요. 13부터 쓰는 십 대 숫자의 규칙을 따르지 않아요.'
    example_gloss:
    - 우리 집 번지는 11번이에요.
    - 우리 집 번지는 12번이에요.
  de.a1.unit03.lesson02.teach.dreizehn_bis_sechzehn:
    title: dreizehn, vierzehn, fünfzehn, sechzehn
    gloss: 열셋, 열넷, 열다섯, 열여섯
    note: 13부터 독일어 수는 기본 숫자에 *-zehn*을 붙여 만들어요(한국어에서 ‘열셋’, ‘열넷’처럼 ‘열’을 사용해 십 단위 수를 나타내는 것과는 어순이 달라요). *sechszehn*이 아니라 *sechzehn*이며, *s*가 탈락한다는 점에 유의하세요. 독일어의 *-teen*은 숫자를 만드는 요소가 아니에요.
    example_gloss:
    - 우리 집 번지는 13번이에요.
    - 우리 집 번지는 14번이에요.
    - 우리 집 번지는 15번이에요.
    - 우리 집 번지는 16번이에요.
  de.a1.unit03.lesson02.teach.siebzehn_bis_zwanzig:
    title: siebzehn, achtzehn, neunzehn, zwanzig
    gloss: 열일곱, 열여덟, 열아홉, 스물
    note: '*siebenzehn*이 아니라 *siebzehn*이에요. *-zehn* 앞에서는 *sieben*의 *-en*이 빠져요.'
    example_gloss:
    - 우리 집 번지는 17번이에요.
    - 우리 집 번지는 18번이에요.
    - 우리 집 번지는 19번이에요.
    - 우리 집 번지는 20번이에요.
  de.a1.unit03.lesson03.teach.dreissig_bis_fuenfzig:
    title: dreißig, vierzig, fünfzig
    gloss: 서른, 마흔, 쉰
    note: '*dreizig*이 아니라 *dreißig*이에요. 30은 *-zig* 대신 *-ßig*으로 끝나요. 20을 뜻하는 *zwanzig*도 불규칙한 형태예요.'
    example_gloss:
    - 그건 30유로예요.
    - 그건 40유로예요.
    - 그건 50유로예요.
  de.a1.unit03.lesson03.teach.sechzig_bis_neunzig:
    title: sechzig, siebzig, achtzig, neunzig
    gloss: 예순, 일흔, 여든, 아흔
    note: 40부터는 기본 숫자 뒤에 *-zig*을 붙이는 규칙을 따라요. 십 대 숫자와 마찬가지로 *sech-*와 *sieb-*은 줄어든 형태예요.
    example_gloss:
    - 그건 60유로예요.
    - 그건 70유로예요.
    - 그건 80유로예요.
    - 그건 90유로예요.
  de.a1.unit03.lesson03.teach.hundert:
    title: hundert
    gloss: 백
    note: '*hundert*만으로 ‘백’을 뜻하며, 앞에 *ein*을 붙이지 않아도 돼요. *einhundert*도 가능하지만 일상 대화에서는 덜 흔해요.'
    example_gloss: 그건 100유로예요.
  de.a1.unit03.lesson03.teach.einundzwanzig:
    title: einundzwanzig
    gloss: 스물하나
    note: 독일어의 21부터 99까지의 합성수는 일의 자리 숫자 + *und*(‘그리고’) + 십의 자리 숫자 순서로 쓰며, 모두 한 단어로 붙여 써요. *einundzwanzig* = *ein*(하나) + *und*(그리고) + *zwanzig*(스물), 즉 말 그대로 ‘하나-그리고-스물’이에요.
  de.a1.unit03.lesson03.teach.zweiunddreissig:
    title: zweiunddreißig
    gloss: 서른둘
    note: 같은 규칙이에요. *zwei*(둘) + *und* + *dreißig*(서른), 즉 ‘둘-그리고-서른’이 32예요.
  de.a1.unit03.lesson04.teach.wie_alt_sind_sie:
    title: Wie alt sind Sie?
    gloss: 연세가 어떻게 되세요?
    note: '*alt*는 ‘나이가 든’이라는 뜻이에요. 직역하면 ‘얼마나 나이가 들었나요?’예요.'
  de.a1.unit03.lesson04.teach.wie_alt_bist_du:
    title: Wie alt bist du?
    gloss: 몇 살이야?
    note: '*du*를 사용하는 비격식 표현이에요.'
  de.a1.unit03.lesson04.teach.ich_bin_jahre_alt:
    title: Ich bin achtundzwanzig Jahre alt.
    gloss: 저는 스물여덟 살이에요.
    note: '*Jahre alt*(몇 살인)는 항상 숫자 뒤에 와요. 독일어에서는 나이를 ‘나는 [숫자]살이다’라는 구조로 말해요.'
  de.a1.unit03.lesson05.teach.line01:
    title: Felix가 Anna의 나이를 물어요
    gloss: Felix가 말해요. “실례가 안 된다면, 연세가 어떻게 되세요?”
    note: '*wenn ich fragen darf*(‘여쭤봐도 된다면’)는 다소 직접적으로 느껴질 수 있는 질문을 부드럽게 해 줘요. 두 사람이 계속 격식 있는 *Sie*를 사용하는 상황에 어울리는 공손한 표현이에요.'
  de.a1.unit03.lesson05.teach.line02:
    title: Anna가 대답하고 되물어요
    gloss: Anna가 말해요. “저는 스물여덟 살이에요. 선생님은요?”
    note: Anna는 자신의 나이를 말한 뒤 상대방에게 같은 질문을 되돌려요. 2단원에서 배운 대화 방식과 같아요.
  de.a1.unit03.lesson05.teach.line03:
    title: Felix가 대답해요
    gloss: Felix가 말해요. “저는 서른한 살이에요.”
    note: Felix가 Anna보다 세 살 많다는 것을 알 수 있어요.
