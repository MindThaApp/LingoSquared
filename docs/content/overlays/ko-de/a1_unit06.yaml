    example_gloss: 저는 사진이 한 장 있어요.
  de.a1.unit06.lesson04.teach.line01:
    title: 펠릭스가 사진에 관해 물어요
    gloss: 펠릭스가 말해요. 이분들이 가족이세요?
    note: '*Ihre Familie*에서 *Familie*는 여성 명사이므로 존칭 ‘당신의’는 *Ihre*예요.'
  de.a1.unit06.lesson04.teach.line02:
    title: 안나가 부모님을 소개해요
    gloss: 안나가 말해요. 네. 이분은 제 어머니이고 이분은 제 아버지예요.
  de.a1.unit06.lesson04.teach.line03:
    title: 펠릭스가 누군지 물어요
    gloss: 펠릭스가 말해요. 저분은 누구세요?
  de.a1.unit06.lesson04.teach.line04:
    title: 안나가 자매를 소개해요
    gloss: 안나가 말해요. 저 사람은 제 자매예요. 제 자매는 교사예요.
    note: 독일어에서는 직업명 앞에 관사를 쓰지 않아요. *Meine Schwester ist Lehrerin*은 ‘제 자매는 교사예요’라는 뜻이에요. *Lehrerin*은 *Lehrer*의 여성형이에요.
  de.a1.unit06.lesson04.teach.line05:
    title: 펠릭스가 남자 형제가 있는지 물어요
    gloss: 펠릭스가 말해요. 남자 형제가 있으세요?
    note: '*Brüder*는 *Bruder*의 복수형이에요.'
  de.a1.unit06.lesson04.teach.line06:
    title: 안나가 대답해요
    gloss: 안나가 말해요. 아니요. 자매만 한 명 있어요.
    note: '*nur*는 ‘오직’ 또는 ‘…만’이라는 뜻이에요.'
  de.a1.unit06.lesson04.teach.bildunterschrift:
