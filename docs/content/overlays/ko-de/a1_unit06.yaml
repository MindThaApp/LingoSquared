    title: sein Bruder
    gloss: 그의 형제
    note: '*sein*은 ‘그의’라는 뜻이에요. 같은 규칙에 따라 남성 명사에는 *sein*을 쓰고(*sein Bruder*), 여성 명사에는 *seine*를 써요(*seine Schwester*).'
  de.a1.unit06.lesson02.teach.ihr_vater_formal:
    title: Ihr Vater
    gloss: 당신의 아버지(존칭)
    note: 대문자로 시작하는 *Ihr*는 *Sie*에 대응하는 존칭 ‘당신의’예요. 남성 명사에는 *Ihr*를 쓰고(*Ihr Vater*), 여성 명사에는 *Ihre*를 써요(*Ihre Mutter*).
  de.a1.unit06.lesson02.teach.wer_ist_ihr_vater:
