    gloss: '안나: 죄송하지만 다시 말씀해 주시겠어요?'
    note: 안나가 펠릭스에게 내용을 다시 말해 달라고 해요.
    example_gloss: 죄송하지만 다시 말씀해 주시겠어요?
  de.a1.unit23.lesson02.teach.line04:
    title: 펠릭스가 자세한 내용을 다시 말해요
    gloss: '펠릭스: 네. 9시에 카페 앞에서 만나요.'
    note: 펠릭스가 시간과 장소를 다시 말해요.
    example_gloss: 9시에 만나요.
  de.a1.unit23.lesson02.teach.line05:
    title: 안나가 메시지를 보내겠다고 해요
    gloss: '안나: 고마워요. 메시지를 써 드릴게요.'
    note: 안나가 메시지를 쓰겠다고 말해요.
    example_gloss: 메시지를 써 드려요.
