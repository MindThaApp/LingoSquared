    example_gloss: 무엇을 찾으세요?
  de.a1.unit21.lesson02.teach.line02:
    title: Felix가 품목, 색상, 크기를 말해요
    gloss: 'Felix: 파란색 셔츠를 찾고 있어요. M 사이즈예요.'
    note: Felix가 요청받은 세 가지 정보를 모두 말해요.
  de.a1.unit21.lesson02.teach.line03:
    title: 점원이 물건을 건네요
    gloss: '점원: 여기 있습니다. 구매하시겠어요?'
    note: 격식 있는 *Sie*를 사용하면 가게에서 예의 바르게 대화할 수 있어요.
    example_gloss: 구매하시겠어요?
  de.a1.unit21.lesson02.teach.line04:
    title: Felix가 옷이 맞는지 확인하고 가격을 물어요
    gloss: 'Felix: 네, 셔츠가 잘 맞아요. 얼마예요?'
    note: Felix가 옷이 잘 맞는다고 말하고 가격을 물어요.
    example_gloss: 문맥상 ‘네, 셔츠가 잘 맞아요.’라는 뜻이에요.
