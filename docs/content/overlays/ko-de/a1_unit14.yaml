  de.a1.unit14.lesson01.teach.ich_mag:
    title: Ich mag Tee.
    gloss: 나는 차를 좋아해요.
    note: '*ich mag*는 ‘나는 좋아해요’라는 뜻이에요.'
    example_gloss: 문맥에서는 ‘네, 나는 커피를 좋아해요.’라는 뜻이에요.
  de.a1.unit14.lesson01.teach.nicht_moegen:
    title: Ich mag Kaffee nicht.
    gloss: 나는 커피를 좋아하지 않아요.
    note: 독일어에서는 여기서 싫어하는 대상 뒤에 *nicht*를 쓰며, *ich* 바로 뒤에는 쓰지 않아요.
    example_gloss: 문맥에서는 ‘나는 차를 좋아하지 않아요.’라는 뜻이에요.
  de.a1.unit14.lesson01.teach.lieber:
