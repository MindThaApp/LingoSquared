    gloss: 더 좋아하여 / 더 선호하여
    note: '*lieber*는 여러 선택지 중 무엇을 더 좋아하는지 나타내요.'
    example_gloss: 문맥에서는 ‘나는 차를 마시는 것을 더 좋아해요.’라는 뜻이에요.
  de.a1.unit14.lesson01.teach.nehmen:
