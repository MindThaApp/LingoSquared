    gloss: 나는 물로 할게요.
    note: 물건을 고를 때는 *nehmen*을 쓰는 것이 자연스러워요.
  de.a1.unit14.lesson01.teach.was_nehmen_sie:
    title: Was nehmen Sie?
    gloss: 무엇으로 하시겠어요?
    note: 상대방의 선택을 묻는 격식체 *Sie* 의문문이며, 답할 때는 *ich nehme*를 사용해요.
    example_gloss: 무엇으로 하시겠어요? 나는 물로 할게요.
  de.a1.unit14.lesson02.teach.aber:
    title: aber
    gloss: 하지만
    note: '*aber*는 서로 대조되는 내용을 연결해요.'
    example_gloss: 문맥에서는 ‘나는 커피를 좋아하지만 차를 마시는 것을 더 좋아해요.’라는 뜻이에요.
  de.a1.unit14.lesson02.teach.preference_text:
    title: Vorlieben im Cafe
    gloss: 카페에서의 선호
    note: 이 짧은 글은 Anna와 Felix의 선택을 대조해요.
    example_gloss: 그는 물로 해요.
  de.a1.unit14.lesson02.teach.line01:
    title: Felix가 커피에 관해 물어요
    gloss: 'Felix: 커피를 좋아하세요?'
    note: 선호를 직접 묻는 질문이에요.
  de.a1.unit14.lesson02.teach.line02:
    title: Anna가 자신의 선호를 말해요
    gloss: 'Anna: 네, 나는 커피를 좋아하지만 차를 더 좋아해요.'
    note: Anna는 커피를 좋아하지만 차를 더 좋아해요.
    example_gloss: 문맥에서는 ‘나는 차를 마시는 것을 더 좋아해요.’라는 뜻이에요.
  de.a1.unit14.lesson02.teach.line03:
    title: Felix가 물을 선택해요
    gloss: 'Felix: 나는 차를 좋아하지 않아요. 물로 할게요.'
    note: Felix가 좋아하지 않는 것을 말한 다음 무엇을 고를지 말해요.
    example_gloss: 문맥에서는 ‘나는 물로 할게요.’라는 뜻이에요.
  de.a1.unit14.lesson02.teach.line04:
    title: Anna가 차를 선택해요
    gloss: 'Anna: 좋아요, 나는 차로 할게요.'
    note: Anna가 자신의 선택을 확정해요.
    example_gloss: 문맥에서는 ‘나는 차로 할게요.’라는 뜻이에요.
