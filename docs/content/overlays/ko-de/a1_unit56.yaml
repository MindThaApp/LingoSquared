    note: '*Kein*은 부정문에서 *ein*을 대신하고, 같은 어미를 가져요. ein Haustier는 kein Haustier가 되고, einen Hund는 keinen Hund가 돼요. 동사나 형용사를 부정할 때는 대신 *nicht*를 써요.'
