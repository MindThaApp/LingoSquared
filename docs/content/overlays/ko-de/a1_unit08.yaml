    gloss: 모두 8유로예요.
    note: '*Das macht...*는 총가격을 말하는 일반적인 표현으로, 7단원에서도 배웠어요.'
  de.a1.unit08.lesson04.teach.line01:
    title: Felix가 가격을 물어요
    gloss: 'Felix가 말해요: 사과는 얼마예요?'
    note: 앞에서 배운 것과 같은 질문을 실제 대화에서 사용해요.
  de.a1.unit08.lesson04.teach.line02:
    title: Anna가 가격을 알려 줘요
    gloss: 'Anna가 말해요: 500그램에 2유로예요.'
    note: 완전한 대답에서는 단위당 가격을 말해요.
  de.a1.unit08.lesson04.teach.line03:
    title: Felix가 주문해요
    gloss: 'Felix가 말해요: 좋아요, 500그램짜리 두 단위 주세요.'
    note: 여기서 *Gut*는 가격을 받아들이고 주문하기 전에 말하는 ‘좋아요’라는 뜻이에요.
  de.a1.unit08.lesson04.teach.line04:
    title: Anna가 더 필요한 것이 있는지 물어요
    gloss: 'Anna가 말해요: 물론이죠. 더 필요한 건 없으세요?'
    note: '*Natürlich*는 ‘물론’ 또는 ‘당연히’라는 뜻이에요.'
  de.a1.unit08.lesson04.teach.line05:
    title: Felix가 더 주문해요
    gloss: 'Felix가 말해요: 네, 달걀 한 다스도 주세요.'
    note: '*auch*는 ‘또한’ 또는 ‘~도’라는 뜻이에요.'
  de.a1.unit08.lesson04.teach.line06:
    title: Anna가 합계를 알려 줘요
    gloss: 'Anna가 말해요: 모두 8유로예요.'
    note: 사과 1킬로그램(4€)과 달걀 한 다스(4€)를 더하면 모두 8유로예요.
