  de.a1.unit08.lesson01.teach.ein_pfund:
    title: ein Pfund Äpfel
    gloss: 사과 500그램
    note: 독일에서는 *Pfund*를 일상적으로 여전히 자주 사용해요. 독일의 *Pfund*는 정확히 500 g, 즉 0.5킬로그램이며, 독일이 공식적으로 미터법을 사용하더라도 일상적인 수량을 말할 때 쓰여요.
  de.a1.unit08.lesson01.teach.ein_dutzend:
