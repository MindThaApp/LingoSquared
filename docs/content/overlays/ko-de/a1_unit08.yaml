    gloss: 토마토 1킬로그램
    note: '*Kilo*는 표준 미터법 무게 단위로, 일상적인 소량을 제외하면 *Pfund*보다 훨씬 많이 사용해요.'
  de.a1.unit08.lesson02.teach.was_kosten_die_aepfel:
    title: Was kosten die Äpfel?
    gloss: 사과는 얼마예요?
    note: '*kosten*은 ‘가격이 ~이다’라는 뜻이에요. 직역하면 ‘사과의 가격은 얼마인가요?’라는 구조예요.'
  de.a1.unit08.lesson02.teach.sie_kosten_zwei_euro:
    title: Sie kosten zwei Euro das Pfund.
    gloss: 500그램에 2유로예요.
    note: 여기서 *Sie*는 격식체 ‘당신’이 아니라 사과를 가리키는 ‘그것들’이라는 뜻이에요. 격식체 *Sie*와 복수형 *sie*는 모두 같은 동사 형태인 *kosten*을 사용하고, 문장 첫머리에서는 둘 다 대문자로 시작하므로 문맥으로 구별해요. 여기서는 사람이 아니라 사과가 주어예요.
  de.a1.unit08.lesson02.teach.kann_ich_zwei_pfund:
    title: Kann ich zwei Pfund haben, bitte?
    gloss: 500그램짜리 두 단위 주세요.
    note: 7단원에서 배운 *Ich möchte..., bitte*와 비슷한 정중한 부탁 표현이에요.
  de.a1.unit08.lesson02.teach.ist_es_frisch:
    title: Ist es frisch?
    gloss: 신선한가요?
    note: '*frisch*는 신선하다는 뜻이에요. 여기서 *es*는 das Brot 같은 중성 명사와 성이 일치해요. 남성 명사를 물을 때는 *Ist er frisch?*(der Reis), 여성 명사를 물을 때는 *Ist sie frisch?*(die Milch)라고 해요. 대명사는 항상 *es*로 고정되지 않고 명사의 성에 따라 바뀌어요.'
  de.a1.unit08.lesson03.teach.pro_pfund:
    title: pro Pfund
    gloss: 500그램당
    note: '*pro*는 ‘~당’이라는 뜻으로, 가격표와 말로 가격을 알려 줄 때 모두 사용해요.'
    example_gloss: 사과는 500그램당 2유로예요.
