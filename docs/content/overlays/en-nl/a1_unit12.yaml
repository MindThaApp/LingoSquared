teaching:
  nl.a1.unit12.lesson01.teach.completed_event: {title: "The everyday Dutch past", gloss: "In conversation, a completed event usually uses hebben or zijn plus a past participle.", note: "Dutch normally uses this perfect-tense form where everyday English often uses the simple past. *Ik heb koffie gedronken* can mean I drank coffee; it is not limited to the marked English meaning I have drunk coffee."}
  nl.a1.unit12.lesson01.teach.drinken_model: {title: "I drank coffee", gloss: "to drink → I drank coffee.", note: "*Heb* is the auxiliary and *gedronken* is the past participle of *drinken*."}
  nl.a1.unit12.lesson01.teach.gaan_model: {title: "I went to the supermarket", gloss: "to go → I went to the supermarket.", note: "*Gaan* uses *zijn*: *ik ben gegaan*."}
  nl.a1.unit12.lesson01.teach.word_order: {title: "The participle goes at the end", gloss: "The past participle stands at the end: Ik heb koffie gedronken. Think of the final position of op in Ik sta op.", note: "Unit10 already trained you to listen for an important element at the end of the clause. Here the final element is the past participle."}

  nl.a1.unit12.lesson02.teach.hebben_rule: {title: "Most verbs use hebben", gloss: "Most verbs use hebben.", note: "For this unit, use *hebben* with *drinken*, *eten*, *werken* and *kopen*."}
  nl.a1.unit12.lesson02.teach.drinken: {title: "Drinken with hebben", gloss: "to drink → I drank coffee.", note: "The complete pattern is *ik + heb + object + gedronken*."}
  nl.a1.unit12.lesson02.teach.eten: {title: "Eten with hebben", gloss: "to eat → I ate bread.", note: "The past participle of *eten* is *gegeten*."}
  nl.a1.unit12.lesson02.teach.werken: {title: "Werken with hebben", gloss: "to work → I worked.", note: "The past participle of *werken* is *gewerkt*."}
  nl.a1.unit12.lesson02.teach.kopen: {title: "Kopen with hebben", gloss: "to buy → I bought apples.", note: "The past participle of *kopen* is *gekocht*."}

  nl.a1.unit12.lesson03.teach.zijn_rule: {title: "Gaan and komen use zijn", gloss: "With gaan and komen, use zijn.", note: "These two common motion verbs use *zijn*, not *hebben*, in the completed-event construction taught here."}
  nl.a1.unit12.lesson03.teach.gaan: {title: "Gaan with zijn", gloss: "to go → I went to the supermarket.", note: "Use *ben* with *ik* and place *gegaan* at the end."}
  nl.a1.unit12.lesson03.teach.komen: {title: "Komen with zijn", gloss: "to come → I came to the language café.", note: "Use *ben* with *ik* and place *gekomen* at the end."}
  nl.a1.unit12.lesson03.teach.auxiliary_contrast: {title: "Compare the auxiliaries", gloss: "I worked, but I went to the supermarket.", note: "*Werken* takes *hebben*; *gaan* takes *zijn*."}

  nl.a1.unit12.lesson04.teach.gisteren_vanmorgen: {title: "Yesterday, this morning", gloss: "yesterday, this morning", note: "*Gisteren* identifies the day before today; *vanmorgen* refers to the morning of today."}
  nl.a1.unit12.lesson04.teach.yesterday_work: {title: "I worked yesterday", gloss: "Yesterday I worked.", note: "When *gisteren* starts the sentence, *heb* comes before *ik*."}
  nl.a1.unit12.lesson04.teach.morning_coffee: {title: "Coffee this morning", gloss: "This morning at eight I drank coffee.", note: "This reuses *om acht uur* from the unit04 clock system."}
  nl.a1.unit12.lesson04.teach.time_order: {title: "Time first changes the order", gloss: "After Gisteren or Vanmorgen, the verb comes before ik: Gisteren heb ik ...", note: "This is the same verb-before-*ik* order already seen after *daarna* in unit10."}

  nl.a1.unit12.lesson05.teach.recent_text: {title: "A recent-event account", gloss: "This morning I went to the supermarket. I bought apples. After that I went to the language café. There I drank coffee.", note: "Read for one time reference, the places, and each completed action."}

  nl.a1.unit12.lesson06.teach.question: {title: "What did you do yesterday?", gloss: "Lotte: What did you do yesterday, Omar?", note: "*Wat heb je ... gedaan?* is the ordinary informal question for asking what someone did."}
  nl.a1.unit12.lesson06.teach.answer: {title: "Omar's three actions", gloss: "Omar: I worked. Then I went to the supermarket. I bought apples.", note: "The answer gives three simple completed actions in separate sentences."}
  nl.a1.unit12.lesson06.teach.morning_question: {title: "And this morning?", gloss: "Lotte: And what did you do this morning?", note: "Replace *gisteren* with *vanmorgen* to ask about a different recent time."}
  nl.a1.unit12.lesson06.teach.morning_answer: {title: "Omar came to the language café", gloss: "Omar: This morning I came to the language café at eight.", note: "*Komen* uses *zijn*: *ben ... gekomen*."}
  nl.a1.unit12.lesson06.teach.lotte_answer: {title: "Lotte drank coffee", gloss: "Lotte: Nice. I drank coffee this morning.", note: "*Drinken* uses *hebben*: *heb ... gedronken*."}

exercises:
  nl.a1.unit12.lesson01.exercise01.choose_completed:
    instruction: "Choose the ordinary Dutch sentence meaning 'I drank coffee.'"
    correct_option: "Ik heb koffie gedronken."
    distractors: ["Ik ben koffie gedronken.", "Ik heb gedronken koffie.", "Ik koffie heb gedronken."]
    accepted_answers: [{value: "Ik heb koffie gedronken.", status: correct}]
    feedback: "Everyday Dutch uses heb plus the clause-final participle gedronken."
  nl.a1.unit12.lesson01.exercise02.listen_drinking:
    instruction: "Listen and choose what the speaker did."
    correct_option: "drank coffee"
    distractors: ["ate bread", "worked", "bought apples"]
    accepted_answers: [{value: "drank coffee", status: correct}]
    feedback: "The speaker says Ik heb koffie gedronken."
  nl.a1.unit12.lesson01.exercise03.match_parts:
    instruction: "Match each Dutch word to its role in the completed-event construction."
    accepted_answers: [{value: [{left: heb, right: auxiliary}, {left: ben, right: auxiliary}, {left: gedronken, right: participle}, {left: gegaan, right: participle}], status: correct}]
    feedback: "Heb and ben are auxiliaries; gedronken and gegaan are past participles."
  nl.a1.unit12.lesson01.exercise04.order_drinking:
    instruction: "Put the words in order to say that you drank coffee."
    correct_option: "Ik heb koffie gedronken"
    accepted_answers: [{value: "Ik heb koffie gedronken", status: correct}]
    feedback: "Put heb after ik and gedronken at the end."
  nl.a1.unit12.lesson01.exercise05.fill_participle:
    instruction: "Complete the sentence with the past participle of drinken."
    accepted_answers: [{value: gedronken, status: correct}]
    feedback: "Ik heb koffie gedronken."
  nl.a1.unit12.lesson01.exercise06.speak_drinking:
    instruction: "Say in Dutch that you drank coffee, then enter the sentence."
    accepted_answers: [{value: "Ik heb koffie gedronken.", status: correct}, {value: "Ik heb koffie gedronken", status: correct}]
    feedback: "Ik heb koffie gedronken."

  nl.a1.unit12.lesson02.exercise01.choose_worked:
    instruction: "Choose the Dutch sentence meaning 'I worked.'"
    correct_option: "Ik heb gewerkt."
    distractors: ["Ik ben gewerkt.", "Ik heb werken.", "Ik gewerkt heb."]
    accepted_answers: [{value: "Ik heb gewerkt.", status: correct}]
    feedback: "Werken uses hebben, and its participle is gewerkt."
  nl.a1.unit12.lesson02.exercise02.listen_worked:
    instruction: "Listen and choose the completed action."
    correct_option: worked
    distractors: [ate, drank, shopped]
    accepted_answers: [{value: worked, status: correct}]
    feedback: "Ik heb gewerkt means I worked."
  nl.a1.unit12.lesson02.exercise03.match_participles:
    instruction: "Match each infinitive to its past participle."
    accepted_answers: [{value: [{left: drinken, right: gedronken}, {left: eten, right: gegeten}, {left: werken, right: gewerkt}, {left: kopen, right: gekocht}], status: correct}]
    feedback: "These four activity verbs all use hebben in this unit."
  nl.a1.unit12.lesson02.exercise04.order_bought:
    instruction: "Put the words in order to say that you bought apples."
    correct_option: "Ik heb appels gekocht"
    accepted_answers: [{value: "Ik heb appels gekocht", status: correct}]
    feedback: "Gekocht is the final past participle."
  nl.a1.unit12.lesson02.exercise05.listen_order_bought:
    instruction: "Listen and put the words in the order you hear."
    correct_option: "Ik heb appels gekocht"
    accepted_answers: [{value: "Ik heb appels gekocht", status: correct}]
    feedback: "The complete sentence is Ik heb appels gekocht."
  nl.a1.unit12.lesson02.exercise06.listen_type_eaten:
    instruction: "Listen and type the complete Dutch sentence."
    accepted_answers: [{value: "Ik heb brood gegeten.", status: correct}, {value: "Ik heb brood gegeten", status: correct}]
    feedback: "Eten becomes heb ... gegeten."
  nl.a1.unit12.lesson02.exercise07.write_two_actions:
    instruction: "Write two Dutch sentences: you drank coffee and you ate bread."
    accepted_answers: [{value: "Ik heb koffie gedronken. Ik heb brood gegeten.", status: correct}, {value: "Ik heb koffie gedronken Ik heb brood gegeten", status: correct}]
    feedback: "Both verbs use hebben: heb ... gedronken and heb ... gegeten."

  nl.a1.unit12.lesson03.exercise01.choose_gone:
    instruction: "Choose the Dutch sentence meaning 'I went to the supermarket.'"
    correct_option: "Ik ben naar de supermarkt gegaan."
    distractors: ["Ik heb naar de supermarkt gegaan.", "Ik ben naar de supermarkt gekomen.", "Ik ben de supermarkt gegaan."]
    accepted_answers: [{value: "Ik ben naar de supermarkt gegaan.", status: correct}]
    feedback: "Gaan uses zijn: Ik ben ... gegaan."
  nl.a1.unit12.lesson03.exercise02.listen_gone:
    instruction: "Listen and choose where the speaker went."
    correct_option: "the supermarket"
    distractors: ["the station", "the library", "the language café"]
    accepted_answers: [{value: "the supermarket", status: correct}]
    feedback: "The speaker says naar de supermarkt."
  nl.a1.unit12.lesson03.exercise03.match_auxiliary:
    instruction: "Match each infinitive and participle to the auxiliary used in this unit."
    accepted_answers: [{value: [{left: "drinken → gedronken", right: hebben}, {left: "eten → gegeten", right: hebben}, {left: "gaan → gegaan", right: zijn}, {left: "komen → gekomen", right: zijn}], status: correct}]
    feedback: "Drinken and eten use hebben; gaan and komen use zijn."
  nl.a1.unit12.lesson03.exercise04.order_come:
    instruction: "Put the words in order to say that you came to the language café."
    correct_option: "Ik ben naar het taalcafé gekomen"
    accepted_answers: [{value: "Ik ben naar het taalcafé gekomen", status: correct}]
    feedback: "Use ben and place gekomen at the end."
  nl.a1.unit12.lesson03.exercise05.listen_order_come:
    instruction: "Listen and put the words in the order you hear."
    correct_option: "Ik ben naar het taalcafé gekomen"
    accepted_answers: [{value: "Ik ben naar het taalcafé gekomen", status: correct}]
    feedback: "The complete sentence is Ik ben naar het taalcafé gekomen."
  nl.a1.unit12.lesson03.exercise06.speak_gone:
    instruction: "Say in Dutch that you went to the supermarket, then enter the sentence."
    accepted_answers: [{value: "Ik ben naar de supermarkt gegaan.", status: correct}, {value: "Ik ben naar de supermarkt gegaan", status: correct}]
    feedback: "Ik ben naar de supermarkt gegaan."

  nl.a1.unit12.lesson04.exercise01.choose_yesterday:
    instruction: "Choose the Dutch word for 'yesterday.'"
    correct_option: gisteren
    distractors: [vanmorgen, vandaag, daarna]
    accepted_answers: [{value: gisteren, status: correct}]
    feedback: "Gisteren means yesterday."
  nl.a1.unit12.lesson04.exercise02.listen_yesterday:
    instruction: "Listen and choose when the speaker worked."
    correct_option: yesterday
    distractors: ["this morning", today, tomorrow]
    accepted_answers: [{value: yesterday, status: correct}]
    feedback: "Gisteren places the completed action yesterday."
  nl.a1.unit12.lesson04.exercise03.choose_morning_time:
    instruction: "When did the speaker drink coffee?"
    correct_option: "this morning at 8:00"
    distractors: ["yesterday at 8:00", "this morning at 7:30", "this afternoon at 8:00"]
    accepted_answers: [{value: "this morning at 8:00", status: correct}]
    feedback: "Vanmorgen om acht uur means this morning at 8:00."
  nl.a1.unit12.lesson04.exercise04.match_times:
    instruction: "Match each Dutch time expression to its English meaning."
    accepted_answers: [{value: [{left: gisteren, right: yesterday}, {left: vanmorgen, right: "this morning"}, {left: "om acht uur", right: "at 8:00"}], status: correct}]
    feedback: "These expressions locate a recent event in time."
  nl.a1.unit12.lesson04.exercise05.order_yesterday:
    instruction: "Put the words in order to say that you worked yesterday."
    correct_option: "Gisteren heb ik gewerkt"
    accepted_answers: [{value: "Gisteren heb ik gewerkt", status: correct}]
    feedback: "After Gisteren, heb comes before ik."
  nl.a1.unit12.lesson04.exercise06.listen_order_morning:
    instruction: "Listen and put the words in the order you hear."
    correct_option: "Vanmorgen om acht uur heb ik koffie gedronken"
    accepted_answers: [{value: "Vanmorgen om acht uur heb ik koffie gedronken", status: correct}]
    feedback: "The time phrase comes first and gedronken comes last."
  nl.a1.unit12.lesson04.exercise07.write_timed_event:
    instruction: "Write two Dutch completed-event sentences: one with gisteren and one with vanmorgen om acht uur."
    accepted_answers: [{value: "Gisteren heb ik gewerkt. Vanmorgen om acht uur heb ik koffie gedronken.", status: correct}, {value: "Gisteren heb ik gewerkt Vanmorgen om acht uur heb ik koffie gedronken", status: correct}]
    feedback: "Start with the time reference, then put the auxiliary before ik and the participle at the end."

  nl.a1.unit12.lesson05.exercise01.read_time:
    instruction: "Read the account and choose when the events happened."
    correct_option: "this morning"
    distractors: [yesterday, "this evening", tomorrow]
    accepted_answers: [{value: "this morning", status: correct}]
    feedback: "The account begins with Vanmorgen."
  nl.a1.unit12.lesson05.exercise02.read_first_place:
    instruction: "Read the account and choose where the writer went first."
    correct_option: "the supermarket"
    distractors: ["the language café", "the station", "the library"]
    accepted_answers: [{value: "the supermarket", status: correct}]
    feedback: "The first sentence says naar de supermarkt gegaan."
  nl.a1.unit12.lesson05.exercise03.read_purchase:
    instruction: "Read the account and choose what the writer bought."
    correct_option: apples
    distractors: [bread, coffee, tomatoes]
    accepted_answers: [{value: apples, status: correct}]
    feedback: "Ik heb appels gekocht means I bought apples."
  nl.a1.unit12.lesson05.exercise04.match_account:
    instruction: "Match each detail type to the information in the account."
    accepted_answers: [{value: [{left: time, right: Vanmorgen}, {left: "first place", right: supermarkt}, {left: purchase, right: appels}, {left: "later place", right: taalcafé}], status: correct}]
    feedback: "The account gives a time, two places, and a purchase."
  nl.a1.unit12.lesson05.exercise05.listen_reading_action:
    instruction: "Listen and choose what happened next."
    correct_option: "The speaker went to the language café."
    distractors: ["The speaker went to the station.", "The speaker bought coffee.", "The speaker worked."]
    accepted_answers: [{value: "The speaker went to the language café.", status: correct}]
    feedback: "Daarna marks the next action: naar het taalcafé gegaan."
  nl.a1.unit12.lesson05.exercise06.write_recent_account:
    instruction: "Write at least three simple Dutch sentences about recent completed events. Include a time reference."
    accepted_answers:
      - {value: "Gisteren heb ik gewerkt. Ik heb brood gegeten. Ik heb koffie gedronken.", status: correct}
      - {value: "Vanmorgen ben ik naar de supermarkt gegaan. Ik heb appels gekocht. Daarna heb ik koffie gedronken.", status: correct}
    feedback: "Give a time reference and at least three completed actions using the taught hebben/zijn patterns."

  nl.a1.unit12.lesson06.exercise01.listen_question:
    instruction: "Listen and choose what Lotte asks about."
    correct_option: "what Omar did yesterday"
    distractors: ["what Omar does every day", "Omar's plan for tomorrow", "where the supermarket is"]
    accepted_answers: [{value: "what Omar did yesterday", status: correct}]
    feedback: "Wat heb je gisteren gedaan? asks about completed actions yesterday."
  nl.a1.unit12.lesson06.exercise02.comprehend_event:
    instruction: "What is one action Omar completed yesterday?"
    correct_option: "He worked."
    distractors: ["He ate bread.", "He drank coffee.", "He went to the station."]
    accepted_answers: [{value: "He worked.", status: correct}]
    feedback: "Omar says Ik heb gewerkt."
  nl.a1.unit12.lesson06.exercise03.comprehend_detail:
    instruction: "What did Omar buy?"
    correct_option: apples
    distractors: [tomatoes, bread, coffee]
    accepted_answers: [{value: apples, status: correct}]
    feedback: "Omar says Ik heb appels gekocht."
  nl.a1.unit12.lesson06.exercise04.comprehend_time:
    instruction: "When did Omar come to the language café?"
    correct_option: "this morning at 8:00"
    distractors: ["yesterday at 8:00", "this morning at 7:30", "yesterday at 2:30"]
    accepted_answers: [{value: "this morning at 8:00", status: correct}]
    feedback: "Omar says Vanmorgen ... om acht uur."
  nl.a1.unit12.lesson06.exercise05.order_question:
    instruction: "Put the words in order to ask what someone did yesterday."
    correct_option: "Wat heb je gisteren gedaan"
    accepted_answers: [{value: "Wat heb je gisteren gedaan", status: correct}]
    feedback: "The complete question is Wat heb je gisteren gedaan?"
  nl.a1.unit12.lesson06.exercise06.speak_account:
    instruction: "Answer in Dutch with three completed actions: you worked, went to the supermarket, and bought apples. Say it aloud, then enter it."
    accepted_answers: [{value: "Ik heb gewerkt. Daarna ben ik naar de supermarkt gegaan. Ik heb appels gekocht.", status: correct}, {value: "Ik heb gewerkt Daarna ben ik naar de supermarkt gegaan Ik heb appels gekocht", status: correct}]
    feedback: "Use hebben for werken and kopen, and zijn for gaan."
  nl.a1.unit12.lesson06.exercise07.listen_type_answer:
    instruction: "Listen and type Omar's complete three-sentence answer."
    accepted_answers: [{value: "Ik heb gewerkt. Daarna ben ik naar de supermarkt gegaan. Ik heb appels gekocht.", status: correct}, {value: "Ik heb gewerkt Daarna ben ik naar de supermarkt gegaan Ik heb appels gekocht", status: correct}]
    feedback: "Omar reports work, a trip to the supermarket, and a purchase."
  nl.a1.unit12.lesson06.exercise08.write_account:
    instruction: "Write three Dutch sentences answering Wat heb je gisteren gedaan? Include work, going to the supermarket, and buying apples."
    accepted_answers: [{value: "Gisteren heb ik gewerkt. Daarna ben ik naar de supermarkt gegaan. Ik heb appels gekocht.", status: correct}, {value: "Ik heb gisteren gewerkt. Daarna ben ik naar de supermarkt gegaan. Ik heb appels gekocht.", status: correct}]
    feedback: "A complete answer identifies the time and gives three simple completed actions."
