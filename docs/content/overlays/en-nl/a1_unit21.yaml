    correct_option: "she tells him not to worry and that he can do it well"
    distractors: ["she tells him to call in sick", "she tells him it doesn't matter", "she tells him to ask for help"]
    accepted_answers: [{value: "she tells him not to worry and that he can do it well", status: correct}]
    feedback: "Maak je geen zorgen, je kunt het goed!"
  nl.a1.unit21.lesson06.exercise04.comprehend_lotte_prediction:
    instruction: "Listen to the dialogue and choose how Lotte thinks Omar will feel afterward."
    correct_option: "very happy and proud"
    distractors: ["very tired", "still nervous", "a bit sad"]
    accepted_answers: [{value: "very happy and proud", status: correct}]
    feedback: "En daarna ben je vast heel blij en trots."
  nl.a1.unit21.lesson06.exercise05.order_reassure:
    instruction: "Put the words in order to tell someone not to worry."
    correct_option: "Maak je geen zorgen"
    accepted_answers: [{value: "Maak je geen zorgen", status: correct}]
    feedback: "The complete phrase is Maak je geen zorgen."
  nl.a1.unit21.lesson06.exercise06.respond_admit_nervous:
    instruction: "Answer in Dutch: say you are a bit nervous, honestly."
    accepted_answers: [{value: "Ik ben een beetje zenuwachtig, eerlijk gezegd.", status: correct}, {value: "Ik ben een beetje zenuwachtig eerlijk gezegd", status: correct}]
    feedback: "Ik ben een beetje zenuwachtig, eerlijk gezegd."
  nl.a1.unit21.lesson06.exercise07.listen_type_reassure:
    instruction: "Listen and type the complete Dutch sentence."
    accepted_answers: [{value: "Maak je geen zorgen, je kunt het goed!", status: correct}, {value: "Maak je geen zorgen je kunt het goed", status: correct}]
    feedback: "Maak je geen zorgen, je kunt het goed!"
  nl.a1.unit21.lesson06.exercise08.write_feelings_summary:
    instruction: "Write two Dutch sentences: Omar is nervous about his first shift, and Lotte helps him."
    accepted_answers: [{value: "Omar is zenuwachtig voor zijn eerste dienst. Lotte helpt hem.", status: correct}, {value: "Omar is zenuwachtig voor zijn eerste dienst Lotte helpt hem", status: correct}, {value: "Omar is zenuwachtig voor zijn eerste dienst, en Lotte helpt hem.", status: correct}, {value: "Omar is zenuwachtig voor zijn eerste dienst, en Lotte helpt hem", status: correct}]
