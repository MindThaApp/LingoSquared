course:
  title: "Dutch A1"
  description: "Beginner Dutch for expressing and asking about basic feelings and their simple immediate cause."

units:
  nl.a1.unit21.emotions: {title: "Expressing feelings"}

lessons:
  nl.a1.unit21.lesson01.blij_verdrietig_boos: {title: "Happy, sad, or angry?"}
  nl.a1.unit21.lesson02.waarom_ben_je_blij: {title: "Why are you happy?"}
  nl.a1.unit21.lesson03.zenuwachtig_voor_iets: {title: "Nervous about something"}
  nl.a1.unit21.lesson04.naar_gevoelens_vragen: {title: "Asking about feelings"}
  nl.a1.unit21.lesson05.bericht_lezen: {title: "Reading a message about feelings"}
  nl.a1.unit21.lesson06.eerste_dienst_gesprek: {title: "Lotte reassures Omar"}

teaching:
  nl.a1.unit21.lesson01.teach.blij_verdrietig_boos: {title: "Happy, sad, and angry", gloss: "happy, sad, angry", note: "Three basic, common feeling words used with zijn (to be) to describe how you feel.", example_gloss: ["I am happy.", "I am sad.", "I am angry."]}
  nl.a1.unit21.lesson01.teach.ben_blij: {title: "Saying you're happy", gloss: "I am happy.", note: "*Zijn* (to be) + feeling adjective is the basic pattern, like English 'I am ...'."}
  nl.a1.unit21.lesson01.teach.niet_boos: {title: "Contrasting feelings", gloss: "I am not angry, I am sad.", note: "*Niet* negates *boos* directly; the second clause then states the actual feeling."}

  nl.a1.unit21.lesson02.teach.waarom_blij: {title: "Asking why", gloss: "Why are you happy?", note: "*Waarom* (why) is the standard question word for a reason."}
  nl.a1.unit21.lesson02.teach.blij_omdat_appartement: {title: "Giving a reason", gloss: "I am happy because I have a new apartment.", note: "*Omdat* (because) introduces the reason clause; the verb moves to the end of that clause (*heb* moves after *appartement*)."}
  nl.a1.unit21.lesson02.teach.verdrietig_omdat_regent: {title: "A negative reason", gloss: "I am sad because it is raining.", note: "Reuses *regent* (it rains) from the weather unit as the reason clause."}

  nl.a1.unit21.lesson03.teach.zenuwachtig: {title: "Nervous", gloss: "nervous", note: "The standard word for nervousness.", example_gloss: "I am nervous about my first shift."}
  nl.a1.unit21.lesson03.teach.eerste_dienst: {title: "Stating what you're nervous about", gloss: "I am nervous about my first shift.", note: "*Voor* (literally 'for') introduces what the nervousness is about, where English would say 'about'."}
  nl.a1.unit21.lesson03.teach.geen_zorgen: {title: "Reassuring someone", gloss: "Don't worry.", note: "*Maak je geen zorgen* (literally 'don't make yourself worries') is the standard fixed reassurance phrase."}

  nl.a1.unit21.lesson04.teach.hoe_voelt_omar: {title: "Asking how someone feels", gloss: "How does Omar feel?", note: "*Voelen zich* (to feel, reflexive) is the standard way to ask about or describe an emotional state, distinct from the physical *voelen* used in unit16's health lessons."}
  nl.a1.unit21.lesson04.teach.hij_voelt_zich: {title: "Describing how someone feels", gloss: "He feels nervous.", note: "*Zich* (himself) is the third-person reflexive pronoun, paired with *voelt*."}
  nl.a1.unit21.lesson04.teach.waarom_voelt_hij: {title: "Asking why someone feels a certain way", gloss: "Why does he feel nervous?", note: "Combines *waarom* with the *voelt zich* pattern from *Hij voelt zich zenuwachtig*."}

  nl.a1.unit21.lesson05.teach.bericht:
    title: "Read a message about feelings"
    gloss: "Hi Lotte, I'm a little nervous about my first shift alone. But I'm also happy, because I have a new job and a new apartment. I think it'll be fine."
    note: "Track what the writer is nervous about, what makes him happy, and his overall outlook."
    glosses:
      beetje: "a little"
      zenuwachtig: "nervous"
      eerste: "first"
      dienst: "shift"
      alleen: "alone"
      blij: "happy"
      want: "because"
      nieuwe: "new"
      baan: "job"
      nieuw: "new"
      appartement: "apartment"
      denk: "think"
      komt: "turns out (here: will be fine)"

  nl.a1.unit21.lesson06.teach.lotte_ask_feeling: {title: "Lotte asks how Omar feels", gloss: "Lotte: Hi Omar, how are you feeling about your first shift?", note: "*Voor je eerste dienst* (about your first shift) reuses the *voor* + noun pattern from lesson03."}
  nl.a1.unit21.lesson06.teach.omar_admit_nervous: {title: "Omar admits he's nervous", gloss: "Omar: I'm a bit nervous, honestly.", note: "*Eerlijk gezegd* (honestly/frankly) softens the admission."}
  nl.a1.unit21.lesson06.teach.lotte_reassure: {title: "Lotte reassures him", gloss: "Lotte: Don't worry, you can do it well!", note: "*Je kunt het goed* (literally 'you can do it well') is an encouraging fixed expression."}
  nl.a1.unit21.lesson06.teach.omar_thanks_helps: {title: "Omar thanks her", gloss: "Omar: Thanks, that really helps.", note: "*Helpt* is the third-person form of *helpen* (to help)."}
  nl.a1.unit21.lesson06.teach.lotte_predict: {title: "Lotte predicts the outcome", gloss: "Lotte: And afterward you'll definitely be very happy and proud.", note: "*Vast* (definitely/surely) expresses confident prediction; *trots* (proud) is a new, useful adjective."}
  nl.a1.unit21.lesson06.teach.omar_agree: {title: "Omar agrees", gloss: "Omar: Yes, I think so too.", note: "*Dat denk ik ook* (literally 'that I think too') is the natural way to agree with someone's opinion."}
  nl.a1.unit21.lesson06.teach.summary_pronouns: {title: "Summarizing with is, zijn, and hem", gloss: "Omar is nervous about his first shift. Lotte helps him.", note: "*Is* is the third-person form of *zijn* (to be); *zijn* here means 'his' (possessive); *hem* means 'him' (object pronoun) -- three small but essential words for talking about someone else."}

exercises:
  nl.a1.unit21.lesson01.exercise01.choose_happy:
    instruction: "Choose the Dutch sentence meaning 'I am happy.'"
    correct_option: "Ik ben blij."
    distractors: ["Ik ben boos.", "Ik heb blij.", "Ik ben verdrietig."]
    accepted_answers: [{value: "Ik ben blij.", status: correct}]
    feedback: "Zijn + feeling adjective is the basic pattern."
  nl.a1.unit21.lesson01.exercise02.listen_sad:
    instruction: "Listen and choose what the speaker says."
    correct_option: "I am not angry, I am sad."
    distractors: ["I am angry, not sad.", "I am happy, not sad.", "I am sad, not happy."]
    accepted_answers: [{value: "I am not angry, I am sad.", status: correct}]
    feedback: "Ik ben niet boos, ik ben verdrietig."
  nl.a1.unit21.lesson01.exercise03.match_feelings:
    instruction: "Match each Dutch word or sentence to its meaning."
    accepted_answers: [{value: [{left: blij, right: happy}, {left: verdrietig, right: sad}, {left: boos, right: angry}, {left: "Ik ben blij.", right: "I am happy."}, {left: "Ik ben niet boos, ik ben verdrietig.", right: "I'm not angry, I'm sad."}], status: correct}]
    feedback: "Blij, verdrietig, and boos are three basic feelings."
  nl.a1.unit21.lesson01.exercise04.order_happy:
    instruction: "Put the words in order to say you are happy."
    correct_option: "Ik ben blij"
    accepted_answers: [{value: "Ik ben blij", status: correct}]
    feedback: "The complete sentence is Ik ben blij."
  nl.a1.unit21.lesson01.exercise05.listen_order_happy:
    instruction: "Listen and put the words in the order you hear."
    correct_option: "Ik ben blij"
    accepted_answers: [{value: "Ik ben blij", status: correct}]
    feedback: "The complete sentence is Ik ben blij."
  nl.a1.unit21.lesson01.exercise06.complete_sad:
    instruction: "Complete the sentence: I'm not angry, I'm sad."
    accepted_answers: [{value: verdrietig, status: correct}]
    feedback: "Ik ben niet boos, ik ben verdrietig."
  nl.a1.unit21.lesson01.exercise07.write_angry:
    instruction: "Write in Dutch: I am angry."
    accepted_answers: [{value: "Ik ben boos.", status: correct}, {value: "Ik ben boos", status: correct}]
    feedback: "Ik ben boos."

  nl.a1.unit21.lesson02.exercise01.choose_happy_reason:
    instruction: "Choose the Dutch sentence meaning 'I am happy because I have a new apartment.'"
    correct_option: "Ik ben blij omdat ik een nieuw appartement heb."
    distractors: ["Ik ben blij omdat ik een nieuw appartement heeft.", "Ik ben blij want ik een nieuw appartement heb.", "Ik ben blij omdat ik heb een nieuw appartement."]
    accepted_answers: [{value: "Ik ben blij omdat ik een nieuw appartement heb.", status: correct}]
    feedback: "Omdat sends the verb to the end of its clause: omdat ik een nieuw appartement heb."
  nl.a1.unit21.lesson02.exercise02.listen_sad_reason:
    instruction: "Listen and choose what the speaker says."
    correct_option: "I am sad because it is raining."
    distractors: ["I am happy because it is sunny.", "I am sad because I have no apartment.", "I am happy because I have a new apartment."]
    accepted_answers: [{value: "I am sad because it is raining.", status: correct}]
    feedback: "Ik ben verdrietig omdat het regent."
  nl.a1.unit21.lesson02.exercise03.match_reasons:
    instruction: "Match each Dutch phrase or word to its meaning."
    accepted_answers: [{value: [{left: "blij omdat", right: "happy because"}, {left: "verdrietig omdat", right: "sad because"}, {left: blij, right: happy}, {left: verdrietig, right: sad}, {left: boos, right: angry}, {left: "een nieuw appartement", right: "a new apartment"}], status: correct}]
    feedback: "Omdat introduces the reason for a feeling."
  nl.a1.unit21.lesson02.exercise04.order_happy_reason:
    instruction: "Put the words in order to say you are happy because you have a new apartment."
    correct_option: "Ik ben blij omdat ik een nieuw appartement heb"
    accepted_answers: [{value: "Ik ben blij omdat ik een nieuw appartement heb", status: correct}]
    feedback: "The complete sentence is Ik ben blij omdat ik een nieuw appartement heb."
  nl.a1.unit21.lesson02.exercise05.complete_sad_reason:
    instruction: "Complete the sentence."
    accepted_answers:
      - {value: omdat, status: correct}
      - {value: want, status: correct}
    feedback: "Ik ben verdrietig omdat het regent (or: ...want het regent) -- both mean 'because' here; the clause is too short for word order to tell them apart."
  nl.a1.unit21.lesson02.exercise06.respond_happy_reason:
    instruction: "Answer in Dutch: say you are happy because you have a new apartment."
    accepted_answers: [{value: "Ik ben blij omdat ik een nieuw appartement heb.", status: correct}, {value: "Ik ben blij omdat ik een nieuw appartement heb", status: correct}]
    feedback: "Ik ben blij omdat ik een nieuw appartement heb."

  nl.a1.unit21.lesson03.exercise01.choose_nervous:
    instruction: "Choose the Dutch sentence meaning 'I am nervous about my first shift.'"
    correct_option: "Ik ben zenuwachtig voor mijn eerste dienst."
    distractors: ["Ik ben zenuwachtig met mijn eerste dienst.", "Ik ben zenuwachtig voor mijn dienst eerste.", "Ik ben blij voor mijn eerste dienst."]
    accepted_answers: [{value: "Ik ben zenuwachtig voor mijn eerste dienst.", status: correct}]
    feedback: "Voor introduces what the nervousness is about."
  nl.a1.unit21.lesson03.exercise02.listen_nervous:
    instruction: "Listen and choose what the speaker says."
    correct_option: "I am nervous about my first shift."
    distractors: ["I am happy about my first shift.", "Don't worry.", "I am nervous about my new apartment."]
    accepted_answers: [{value: "I am nervous about my first shift.", status: correct}]
    feedback: "Ik ben zenuwachtig voor mijn eerste dienst."
  nl.a1.unit21.lesson03.exercise03.match_reassurance:
    instruction: "Match each Dutch word or phrase to its meaning."
    accepted_answers: [{value: [{left: zenuwachtig, right: nervous}, {left: "Maak je geen zorgen.", right: "Don't worry."}, {left: "voor mijn eerste dienst", right: "for my first shift"}, {left: blij, right: happy}, {left: verdrietig, right: sad}, {left: boos, right: angry}], status: correct}]
    feedback: "Zenuwachtig describes the feeling; the fixed phrase offers reassurance."
  nl.a1.unit21.lesson03.exercise04.order_nervous:
    instruction: "Put the words in order to say you are nervous about your first shift."
    correct_option: "Ik ben zenuwachtig voor mijn eerste dienst"
    accepted_answers: [{value: "Ik ben zenuwachtig voor mijn eerste dienst", status: correct}]
    feedback: "The complete sentence is Ik ben zenuwachtig voor mijn eerste dienst."
  nl.a1.unit21.lesson03.exercise05.complete_reassurance:
    instruction: "Complete the reassurance."
    accepted_answers: [{value: zorgen, status: correct}]
    feedback: "Maak je geen zorgen."
  nl.a1.unit21.lesson03.exercise06.translate_nervous:
    instruction: "Translate into Dutch."
    accepted_answers: [{value: "Ik ben zenuwachtig voor mijn eerste dienst.", status: correct}, {value: "Ik ben zenuwachtig voor mijn eerste dienst", status: correct}, {value: "Ik ben zenuwachtig over mijn eerste dienst.", status: acceptable_with_note, note: "Over is also heard; this unit models voor."}, {value: "Ik ben zenuwachtig over mijn eerste dienst", status: acceptable_with_note, note: "Over is also heard; this unit models voor."}]
    feedback: "Ik ben zenuwachtig voor mijn eerste dienst."

  nl.a1.unit21.lesson04.exercise01.choose_he_feels:
    instruction: "Choose the Dutch sentence meaning 'He feels nervous.'"
    correct_option: "Hij voelt zich zenuwachtig."
    distractors: ["Hij voelt hem zenuwachtig.", "Hij voel zich zenuwachtig.", "Hij is zich zenuwachtig."]
    accepted_answers: [{value: "Hij voelt zich zenuwachtig.", status: correct}]
    feedback: "Voelen zich is reflexive; zich must match the subject hij."
  nl.a1.unit21.lesson04.exercise02.listen_he_feels:
    instruction: "Listen and choose what is said."
    correct_option: "He feels nervous."
    distractors: ["How does Omar feel?", "Why does he feel nervous?", "He feels happy."]
    accepted_answers: [{value: "He feels nervous.", status: correct}]
    feedback: "Hij voelt zich zenuwachtig."
  nl.a1.unit21.lesson04.exercise03.match_feeling_questions:
    instruction: "Match each Dutch question, sentence, or word to its meaning."
    accepted_answers: [{value: [{left: "Hoe voelt Omar zich?", right: "How does Omar feel?"}, {left: "Waarom voelt hij zich zenuwachtig?", right: "Why does he feel nervous?"}, {left: "Hij voelt zich zenuwachtig.", right: "He feels nervous."}, {left: blij, right: happy}, {left: verdrietig, right: sad}, {left: boos, right: angry}], status: correct}]
    feedback: "Both questions use the voelen zich reflexive pattern."
  nl.a1.unit21.lesson04.exercise04.order_he_feels:
    instruction: "Put the words in order to say he feels nervous."
    correct_option: "Hij voelt zich zenuwachtig"
    accepted_answers: [{value: "Hij voelt zich zenuwachtig", status: correct}]
    feedback: "The complete sentence is Hij voelt zich zenuwachtig."
  nl.a1.unit21.lesson04.exercise05.complete_he_feels:
    instruction: "Complete the sentence: he feels nervous."
    accepted_answers: [{value: zenuwachtig, status: correct}]
    feedback: "Hij voelt zich zenuwachtig."
  nl.a1.unit21.lesson04.exercise06.write_how_feels:
    instruction: "Write in Dutch: ask how Omar feels."
    accepted_answers: [{value: "Hoe voelt Omar zich?", status: correct}, {value: "Hoe voelt Omar zich", status: correct}]
    feedback: "Hoe voelt Omar zich?"

  nl.a1.unit21.lesson05.exercise01.read_nervous_reason:
    instruction: "Read the message and choose what the writer is nervous about."
    correct_option: "his first shift alone"
    distractors: ["his new apartment", "the weather", "his new job interview"]
    accepted_answers: [{value: "his first shift alone", status: correct}]
    feedback: "Ik ben een beetje zenuwachtig voor mijn eerste dienst alleen."
  nl.a1.unit21.lesson05.exercise02.read_happy_reason:
    instruction: "Read the message and choose why the writer is also happy."
    correct_option: "he has a new job and a new apartment"
    distractors: ["the weather is nice", "he finished his first shift", "his friend is visiting"]
    accepted_answers: [{value: "he has a new job and a new apartment", status: correct}]
    feedback: "Ik heb een nieuwe baan en een nieuw appartement."
  nl.a1.unit21.lesson05.exercise03.read_outlook:
    instruction: "Read the message and choose the writer's outlook."
    correct_option: "he thinks it will be fine"
    distractors: ["he thinks it will go badly", "he is not sure how it will go", "he does not think about it"]
    accepted_answers: [{value: "he thinks it will be fine", status: correct}]
    feedback: "Ik denk dat het goed komt."
  nl.a1.unit21.lesson05.exercise04.match_message_feelings:
    instruction: "Match each feeling in the message to its cause."
    accepted_answers: [{value: [{left: zenuwachtig, right: "the first solo shift"}, {left: blij, right: "the new job and apartment"}], status: correct}]
    feedback: "The message states one cause for each feeling."
  nl.a1.unit21.lesson05.exercise05.listen_message:
    instruction: "Listen and choose the writer's outlook."
    correct_option: "he thinks it will be fine"
    distractors: ["he thinks it will go badly", "he is not sure", "he does not say"]
    accepted_answers: [{value: "he thinks it will be fine", status: correct}]
    feedback: "Ik denk dat het goed komt."
  nl.a1.unit21.lesson05.exercise06.write_message_summary:
    instruction: "Write in Dutch: say you are nervous but also happy."
    accepted_answers: [{value: "Ik ben zenuwachtig, maar ook blij.", status: correct}, {value: "Ik ben zenuwachtig maar ook blij", status: correct}, {value: "Ik ben zenuwachtig, maar ik ben ook blij.", status: correct}, {value: "Ik ben zenuwachtig maar ik ben ook blij", status: correct}]
    feedback: "Ik ben zenuwachtig, maar ook blij."

  nl.a1.unit21.lesson06.exercise01.listen_ask_feeling:
    instruction: "Listen and choose what is asked."
    correct_option: "Why does he feel nervous?"
    distractors: ["How does he feel?", "Why is he happy?", "Does he feel better?"]
    accepted_answers: [{value: "Why does he feel nervous?", status: correct}]
    feedback: "Waarom voelt hij zich zenuwachtig?"
  nl.a1.unit21.lesson06.exercise02.comprehend_omar_nervous:
    instruction: "Listen to the dialogue and choose how Omar says he feels."
    correct_option: "a bit nervous"
    distractors: ["very happy", "a bit sad", "not nervous at all"]
    accepted_answers: [{value: "a bit nervous", status: correct}]
    feedback: "Omar says: Ik ben een beetje zenuwachtig, eerlijk gezegd."
  nl.a1.unit21.lesson06.exercise03.comprehend_lotte_reassurance:
