course:
  title: "Dutch A1"
  description: "Beginner Dutch for describing a basic health problem, asking what's wrong, and understanding simple pharmacy advice."

units:
  nl.a1.unit16.health: {title: "How are you feeling?"}

lessons:
  nl.a1.unit16.lesson01.niet_lekker_voelen: {title: "I don't feel well"}
  nl.a1.unit16.lesson02.wat_scheelt_eraan: {title: "What's wrong?"}
  nl.a1.unit16.lesson03.koorts_en_verkouden: {title: "Fever and a cold"}
  nl.a1.unit16.lesson04.bij_de_apotheek: {title: "At the pharmacy"}
  nl.a1.unit16.lesson05.advies_lezen: {title: "Reading an advice note"}
  nl.a1.unit16.lesson06.lotte_checkt_omar: {title: "Lotte checks on Omar"}

teaching:
  nl.a1.unit16.lesson01.teach.niet_lekker: {title: "Feeling unwell", gloss: "I don't feel well.", note: "*Voelen* is reflexive here (*je*/*me voelen*); *niet lekker* is the general, mild way to say something is off."}
  nl.a1.unit16.lesson01.teach.ziek: {title: "Sick", gloss: "sick", note: "The base adjective, used with *zijn* (to be)."}
  nl.a1.unit16.lesson01.teach.ben_ziek: {title: "Being sick", gloss: "I am sick.", note: "*Ziek* describes a more general, stronger state than *niet lekker*."}
  nl.a1.unit16.lesson01.teach.hoofdpijn: {title: "Headache", gloss: "a headache", note: "Used without an article after *hebben*: *Ik heb hoofdpijn*, not *Ik heb een hoofdpijn*."}
  nl.a1.unit16.lesson01.teach.heb_hoofdpijn: {title: "Having a headache", gloss: "I have a headache.", note: "Symptoms typically pair with *hebben* (to have) in Dutch, the same as English."}
  nl.a1.unit16.lesson01.teach.buikpijn: {title: "Stomach ache", gloss: "a stomach ache", note: "Same no-article pattern as *hoofdpijn*."}
  nl.a1.unit16.lesson01.teach.heb_buikpijn: {title: "Having a stomach ache", gloss: "I have a stomach ache.", note: "Follows the same *hebben* pattern as *hoofdpijn*."}

  nl.a1.unit16.lesson02.teach.wat_is_er: {title: "Asking generally", gloss: "What's wrong?", note: "A general, all-purpose way to ask if something is the matter."}
  nl.a1.unit16.lesson02.teach.wat_scheelt: {title: "A common idiom", gloss: "What's the matter?", note: "*Scheelt eraan* is a fixed idiom (literally close to 'what's lacking about it'); don't translate it word for word."}
  nl.a1.unit16.lesson02.teach.keelpijn: {title: "Sore throat", gloss: "a sore throat", note: "Same no-article pattern as *hoofdpijn*/*buikpijn*."}
  nl.a1.unit16.lesson02.teach.heb_keelpijn: {title: "Having a sore throat", gloss: "I have a sore throat.", note: "Follows the same *hebben* pattern as the other symptoms."}
  nl.a1.unit16.lesson02.teach.gaat_het: {title: "Checking in on someone", gloss: "Are you OK? No, I don't feel well.", note: "*Gaat het?* is a very common, casual check-in question among friends."}

  nl.a1.unit16.lesson03.teach.koorts: {title: "Fever", gloss: "a fever", note: "Used without an article after *hebben*, like the other symptoms."}
  nl.a1.unit16.lesson03.teach.heb_koorts: {title: "Having a fever", gloss: "I have a fever.", note: "Follows the *hebben* pattern."}
  nl.a1.unit16.lesson03.teach.verkouden: {title: "Having a cold", gloss: "having a cold / to have a cold", note: "An adjective used with *zijn*, not a noun used with *hebben* -- a common point of confusion for English speakers."}
  nl.a1.unit16.lesson03.teach.ben_verkouden: {title: "Saying you have a cold", gloss: "I have a cold.", note: "Dutch uses *zijn* + *verkouden* where English uses 'have' + noun; don't say *Ik heb een verkouden*."}
  nl.a1.unit16.lesson03.teach.zijn_note: {title: "Zijn vs. hebben depends on word class, not duration", gloss: "Ziek and verkouden are adjectives and use zijn: I am sick, I have a cold. Koorts and hoofdpijn are nouns and use hebben.", note: "The choice between *zijn* and *hebben* tracks grammatical word class (adjective vs. noun-symptom), not how temporary the condition is -- *koorts* (a noun) is just as temporary as *verkouden* (an adjective) but still takes *hebben*, not *zijn*."}

  nl.a1.unit16.lesson04.teach.apotheek: {title: "The pharmacy", gloss: "the pharmacy", note: "A common gender noun: *de apotheek*."}
  nl.a1.unit16.lesson04.teach.waarmee_helpen: {title: "The pharmacist's greeting", gloss: "How can I help you?", note: "*Waarmee kan ik u helpen?* is a standard formal service greeting, continuing the *u* register from the unit01/unit15 register lessons."}
  nl.a1.unit16.lesson04.teach.iets_tegen: {title: "Asking for something for a symptom", gloss: "Do you have something for a headache?", note: "*Iets tegen* + symptom is the natural way to ask for a remedy."}
  nl.a1.unit16.lesson04.teach.tablet: {title: "A tablet", gloss: "a tablet / pill", note: "A neuter noun: *het tablet*, though it's used here indefinitely as *een tablet*."}
  nl.a1.unit16.lesson04.teach.neem_tablet: {title: "Dosage instructions", gloss: "Take a tablet twice a day.", note: "*Neem* is the imperative of *nemen* (to take), used for instructions."}
  nl.a1.unit16.lesson04.teach.register_note: {title: "Register at the pharmacy", gloss: "At the pharmacy, you use the polite form u.", note: "The pharmacist is an unfamiliar service-role adult, the same register rule as the unit15 ticket counter."}

  nl.a1.unit16.lesson05.teach.advies: {title: "Read a pharmacy advice note", gloss: "Advice: take a tablet twice a day with water. Rest well and drink plenty of water. Do you still not feel well after three days? Then go to the doctor.", note: "Track the dosage, the two non-medicine recommendations, and when to see a doctor."}

  nl.a1.unit16.lesson06.teach.lotte_ask: {title: "Lotte checks in", gloss: "Lotte: Hi Omar, how's it going? Are you feeling better yet?", note: "*Al* (yet/already) signals Lotte is checking whether Omar has improved since they last spoke."}
  nl.a1.unit16.lesson06.teach.omar_still_bad: {title: "Omar is still unwell", gloss: "Omar: Not so good yet. I still have a headache and I'm tired.", note: "*Nog steeds* (still) signals the headache from earlier hasn't gone away; *moe* (tired) is a new, useful adjective."}
  nl.a1.unit16.lesson06.teach.lotte_ask_tablet: {title: "Lotte asks about the medicine", gloss: "Lotte: Did you take a tablet?", note: "*Genomen* is the past participle of *nemen*, following the same *heb* + participle pattern from unit12."}
  nl.a1.unit16.lesson06.teach.omar_took_tablet: {title: "Omar confirms", gloss: "Omar: Yes, I took a tablet. I'm going to rest now.", note: "*Ga nu rusten* (going to rest now) uses the near-future *gaan* + infinitive pattern."}
  nl.a1.unit16.lesson06.teach.lotte_wish: {title: "Lotte wishes him well", gloss: "Lotte: Good idea. Rest well. Get well soon!", note: "*Beterschap!* is the standard fixed expression for wishing someone a quick recovery."}
  nl.a1.unit16.lesson06.teach.omar_thanks: {title: "Omar signs off", gloss: "Omar: Thanks, see you tomorrow!", note: "*Tot morgen!* reuses the *tot* + time pattern from earlier units' farewells."}

exercises:
  nl.a1.unit16.lesson01.exercise01.choose_unwell:
    instruction: "Choose the Dutch sentence meaning 'I don't feel well.'"
    correct_option: "Ik voel me niet lekker."
    distractors: ["Ik voel niet me lekker.", "Ik ben me niet lekker.", "Ik voel me niet ziek."]
    accepted_answers: [{value: "Ik voel me niet lekker.", status: correct}]
    feedback: "Voel me niet lekker is the general way to say something feels off."
  nl.a1.unit16.lesson01.exercise02.listen_headache:
    instruction: "Listen and choose what the speaker says."
    correct_option: "I have a headache."
    distractors: ["I have a stomach ache.", "I have a fever.", "I feel better."]
    accepted_answers: [{value: "I have a headache.", status: correct}]
    feedback: "Ik heb hoofdpijn."
  nl.a1.unit16.lesson01.exercise03.match_symptoms:
    instruction: "Match each Dutch word to its meaning."
    accepted_answers: [{value: [{left: ziek, right: sick}, {left: hoofdpijn, right: headache}, {left: buikpijn, right: "stomach ache"}], status: correct}]
    feedback: "Ziek is a general state; hoofdpijn and buikpijn are specific symptoms."
  nl.a1.unit16.lesson01.exercise04.order_stomach_ache:
    instruction: "Put the words in order to say you have a stomach ache."
    correct_option: "Ik heb buikpijn"
    accepted_answers: [{value: "Ik heb buikpijn", status: correct}]
    feedback: "The complete sentence is Ik heb buikpijn."
  nl.a1.unit16.lesson01.exercise05.listen_order_sick:
    instruction: "Listen and put the words in the order you hear."
    correct_option: "Ik ben ziek"
    accepted_answers: [{value: "Ik ben ziek", status: correct}]
    feedback: "The complete sentence is Ik ben ziek."
  nl.a1.unit16.lesson01.exercise06.complete_headache:
    instruction: "Complete the sentence."
    accepted_answers: [{value: heb, status: correct}]
    feedback: "Ik heb hoofdpijn."
  nl.a1.unit16.lesson01.exercise07.write_unwell:
    instruction: "Write in Dutch: I don't feel well."
    accepted_answers: [{value: "Ik voel me niet lekker.", status: correct}, {value: "Ik voel me niet lekker", status: correct}]
    feedback: "Ik voel me niet lekker."

  nl.a1.unit16.lesson02.exercise01.choose_whats_wrong:
    instruction: "Choose the Dutch phrase meaning 'What's wrong?'"
    correct_option: "Wat scheelt eraan?"
    distractors: ["Wat gaat eraan?", "Wat scheelt eraf?", "Wat is scheelt?"]
    accepted_answers: [{value: "Wat scheelt eraan?", status: correct}]
    feedback: "Wat scheelt eraan? is a fixed idiom for asking what's the matter."
  nl.a1.unit16.lesson02.exercise02.listen_sore_throat:
    instruction: "Listen and choose what the speaker says."
    correct_option: "I have a sore throat."
    distractors: ["I have a headache.", "I have a fever.", "I don't feel well."]
    accepted_answers: [{value: "I have a sore throat.", status: correct}]
    feedback: "Ik heb keelpijn."
  nl.a1.unit16.lesson02.exercise03.match_wellness_questions:
    instruction: "Match each Dutch question to its meaning."
    accepted_answers: [{value: [{left: "Wat is er?", right: "What's wrong?"}, {left: "Gaat het?", right: "Are you OK?"}], status: correct}]
    feedback: "Both are common, casual check-in questions."
  nl.a1.unit16.lesson02.exercise04.order_sore_throat:
    instruction: "Put the words in order to say you have a sore throat."
    correct_option: "Ik heb keelpijn"
    accepted_answers: [{value: "Ik heb keelpijn", status: correct}]
    feedback: "The complete sentence is Ik heb keelpijn."
  nl.a1.unit16.lesson02.exercise05.respond_not_ok:
    instruction: "Answer in Dutch: say no, you don't feel well."
    accepted_answers: [{value: "Nee, ik voel me niet lekker.", status: correct}, {value: "Nee ik voel me niet lekker", status: correct}, {value: "Nee, ik voel me niet lekker, en ik heb hoofdpijn.", status: acceptable_with_note, note: "Adding a specific symptom is also a natural, more complete answer."}]
    feedback: "Nee, ik voel me niet lekker."
  nl.a1.unit16.lesson02.exercise06.write_whats_wrong:
    instruction: "Write in Dutch: ask someone what's wrong."
    accepted_answers: [{value: "Wat scheelt eraan?", status: correct}, {value: "Wat scheelt eraan", status: correct}, {value: "Wat is er?", status: correct}, {value: "Wat is er", status: correct}]
    feedback: "Wat scheelt eraan? and Wat is er? both work."

  nl.a1.unit16.lesson03.exercise01.choose_fever:
    instruction: "Choose the Dutch sentence meaning 'I have a fever.'"
    correct_option: "Ik heb koorts."
    distractors: ["Ik ben koorts.", "Ik heb een koorts.", "Ik heb verkouden."]
    accepted_answers: [{value: "Ik heb koorts.", status: correct}]
    feedback: "Koorts patterns with hebben, without an article."
  nl.a1.unit16.lesson03.exercise02.listen_cold:
    instruction: "Listen and choose what the speaker says."
    correct_option: "I have a cold."
    distractors: ["I have a fever.", "I am sick.", "I feel better."]
    accepted_answers: [{value: "I have a cold.", status: correct}]
    feedback: "Ik ben verkouden."
  nl.a1.unit16.lesson03.exercise03.match_conditions:
    instruction: "Match each Dutch word to its meaning."
    accepted_answers: [{value: [{left: koorts, right: fever}, {left: verkouden, right: "having a cold"}, {left: ziek, right: sick}], status: correct}]
    feedback: "Koorts and ziek pattern differently in Dutch than in English -- check the notes."
  nl.a1.unit16.lesson03.exercise04.order_cold:
    instruction: "Put the words in order to say you have a cold."
    correct_option: "Ik ben verkouden"
    accepted_answers: [{value: "Ik ben verkouden", status: correct}]
    feedback: "The complete sentence is Ik ben verkouden."
  nl.a1.unit16.lesson03.exercise05.complete_fever:
    instruction: "Complete the sentence."
    accepted_answers: [{value: heb, status: correct}]
    feedback: "Ik heb koorts."
  nl.a1.unit16.lesson03.exercise06.translate_cold:
    instruction: "Translate into Dutch."
    accepted_answers: [{value: "Ik ben verkouden.", status: correct}, {value: "Ik ben verkouden", status: correct}]
    feedback: "Ik ben verkouden uses zijn, not hebben."

  nl.a1.unit16.lesson04.exercise01.choose_pharmacy_request:
    instruction: "Choose the Dutch sentence meaning 'Do you have something for a headache?'"
    correct_option: "Heeft u iets tegen hoofdpijn?"
    distractors: ["Heeft u iets voor hoofdpijn?", "Heb je iets tegen hoofdpijn?", "Heeft u iets tegen ziek?"]
    accepted_answers: [{value: "Heeft u iets tegen hoofdpijn?", status: correct}]
    feedback: "Iets tegen + symptom asks for a remedy, using the formal u at the pharmacy."
  nl.a1.unit16.lesson04.exercise02.listen_dosage:
    instruction: "Listen and choose the dosage instruction."
    correct_option: "Take a tablet twice a day."
    distractors: ["Take a tablet once a day.", "Take two tablets a day.", "Drink water twice a day."]
    accepted_answers: [{value: "Take a tablet twice a day.", status: correct}]
    feedback: "Neem twee keer per dag een tablet."
  nl.a1.unit16.lesson04.exercise03.match_pharmacy_words:
    instruction: "Match each Dutch word to its meaning."
    accepted_answers: [{value: [{left: "de apotheek", right: "the pharmacy"}, {left: "een tablet", right: "a tablet"}], status: correct}]
    feedback: "Apotheek and tablet are the two key pharmacy words in this lesson."
  nl.a1.unit16.lesson04.exercise04.order_dosage:
    instruction: "Put the words in order to give the dosage instruction."
    correct_option: "Neem twee keer per dag een tablet"
    accepted_answers: [{value: "Neem twee keer per dag een tablet", status: correct}]
    feedback: "The complete instruction is Neem twee keer per dag een tablet."
  nl.a1.unit16.lesson04.exercise05.listen_order_pharmacy_request:
    instruction: "Listen and put the words in the order you hear."
    correct_option: "Heeft u iets tegen hoofdpijn"
    accepted_answers: [{value: "Heeft u iets tegen hoofdpijn", status: correct}]
    feedback: "The complete question is Heeft u iets tegen hoofdpijn?"
  nl.a1.unit16.lesson04.exercise06.complete_dosage:
    instruction: "Complete the dosage instruction."
    accepted_answers: [{value: tablet, status: correct}]
    feedback: "Neem twee keer per dag een tablet."
  nl.a1.unit16.lesson04.exercise07.respond_pharmacist_greeting:
    instruction: "Answer the pharmacist politely: ask if they have something for a headache."
    accepted_answers: [{value: "Heeft u iets tegen hoofdpijn?", status: correct}, {value: "Heeft u iets tegen hoofdpijn", status: correct}]
    feedback: "Heeft u iets tegen hoofdpijn?"

  nl.a1.unit16.lesson05.exercise01.read_dosage:
    instruction: "Read the advice note and choose how often to take the tablet."
    correct_option: "twice a day"
    distractors: ["once a day", "three times a day", "once every two days"]
    accepted_answers: [{value: "twice a day", status: correct}]
    feedback: "Neem twee keer per dag een tablet met water."
  nl.a1.unit16.lesson05.exercise02.read_rest_advice:
    instruction: "Read the advice note and choose the other two recommendations besides the medicine."
    correct_option: "rest well and drink plenty of water"
    distractors: ["exercise and eat well", "sleep more and stay warm", "avoid coffee and go outside"]
    accepted_answers: [{value: "rest well and drink plenty of water", status: correct}]
    feedback: "Rust goed uit en drink veel water."
  nl.a1.unit16.lesson05.exercise03.read_doctor_advice:
    instruction: "Read the advice note and choose what to do if you still feel unwell after three days."
    correct_option: "go to the doctor"
    distractors: ["take another tablet", "go to the pharmacy again", "call Lotte"]
    accepted_answers: [{value: "go to the doctor", status: correct}]
    feedback: "Ga dan naar de huisarts."
  nl.a1.unit16.lesson05.exercise04.listen_leaflet:
    instruction: "Listen and choose what to do if you still feel unwell after three days."
    correct_option: "go to the doctor"
    distractors: ["take another tablet", "drink less water", "rest less"]
    accepted_answers: [{value: "go to the doctor", status: correct}]
    feedback: "Ga dan naar de huisarts."
  nl.a1.unit16.lesson05.exercise05.match_advice_points:
    instruction: "Match each piece of advice to what it recommends."
    accepted_answers: [{value: [{left: "een tablet met water", right: "the medicine advice"}, {left: "rust goed uit", right: "the rest advice"}, {left: "naar de huisarts", right: "the doctor advice"}], status: correct}]
    feedback: "The note gives one medicine instruction and two lifestyle recommendations, plus a fallback."
  nl.a1.unit16.lesson05.exercise06.write_advice_summary:
    instruction: "Write in Dutch: take a tablet twice a day and rest well."
    accepted_answers: [{value: "Neem twee keer per dag een tablet en rust goed uit.", status: correct}, {value: "Neem twee keer per dag een tablet en rust goed uit", status: correct}, {value: "Neem twee keer per dag een tablet, en rust goed uit.", status: correct}, {value: "Neem twee keer per dag een tablet, en rust goed uit", status: correct}, {value: "Neem twee keer per dag een tablet. Rust goed uit.", status: correct}, {value: "Neem twee keer per dag een tablet Rust goed uit", status: correct}]
    feedback: "Neem twee keer per dag een tablet en rust goed uit."

  nl.a1.unit16.lesson06.exercise01.listen_ask_better:
    instruction: "Listen and choose what Lotte asks."
    correct_option: "Are you feeling better yet?"
    distractors: ["Are you going to the pharmacy?", "Are you feeling worse?", "Are you tired?"]
    accepted_answers: [{value: "Are you feeling better yet?", status: correct}]
    feedback: "Voel je je al beter?"
  nl.a1.unit16.lesson06.exercise02.comprehend_how_omar_feels:
    instruction: "Listen to the dialogue and choose how Omar says he feels."
    correct_option: "he still has a headache and he's tired"
    distractors: ["he has a fever and a sore throat", "he feels completely better", "he has a stomach ache"]
    accepted_answers: [{value: "he still has a headache and he's tired", status: correct}]
    feedback: "Omar says: Ik heb nog steeds hoofdpijn en ik ben moe."
  nl.a1.unit16.lesson06.exercise03.comprehend_already_done:
    instruction: "Listen to the dialogue and choose what Omar already did."
    correct_option: "took a tablet"
    distractors: ["went to the pharmacy", "called the doctor", "went for a walk"]
    accepted_answers: [{value: "took a tablet", status: correct}]
    feedback: "Omar says: Ik heb een tablet genomen."
  nl.a1.unit16.lesson06.exercise04.comprehend_lotte_wish:
    instruction: "Listen to the dialogue and choose what Lotte tells Omar to do and how she ends the message."
    correct_option: "rest well, and she wishes him a quick recovery"
    distractors: ["go to the doctor, and she says goodbye", "take another tablet, and she asks him to call", "go for a walk, and she says thanks"]
    accepted_answers: [{value: "rest well, and she wishes him a quick recovery", status: correct}]
    feedback: "Rust lekker uit. Beterschap!"
  nl.a1.unit16.lesson06.exercise05.order_took_tablet:
    instruction: "Put the words in order to say you took a tablet."
    correct_option: "Ik heb een tablet genomen"
    accepted_answers: [{value: "Ik heb een tablet genomen", status: correct}]
    feedback: "The complete sentence is Ik heb een tablet genomen."
  nl.a1.unit16.lesson06.exercise06.respond_took_tablet:
    instruction: "Answer in Dutch: say yes, you took a tablet."
    accepted_answers: [{value: "Ja, ik heb een tablet genomen.", status: correct}, {value: "Ja ik heb een tablet genomen", status: correct}, {value: "Ja, ik heb een tablet genomen, en ik ga nu rusten.", status: acceptable_with_note, note: "Adding the next step is also a natural, more complete answer."}]
    feedback: "Ja, ik heb een tablet genomen."
  nl.a1.unit16.lesson06.exercise07.listen_type_wish:
    instruction: "Listen and type the complete Dutch sentences."
    accepted_answers: [{value: "Rust lekker uit. Beterschap!", status: correct}, {value: "Rust lekker uit Beterschap", status: correct}, {value: "Rust lekker uit, en beterschap!", status: correct}, {value: "Rust lekker uit, en beterschap", status: correct}]
    feedback: "Rust lekker uit. Beterschap!"
  nl.a1.unit16.lesson06.exercise08.write_symptoms:
    instruction: "Write in Dutch: say you have a headache and you are tired."
    accepted_answers: [{value: "Ik heb hoofdpijn en ik ben moe.", status: correct}, {value: "Ik heb hoofdpijn en ik ben moe", status: correct}, {value: "Ik heb hoofdpijn, en ik ben moe.", status: correct}, {value: "Ik heb hoofdpijn, en ik ben moe", status: correct}, {value: "Ik heb hoofdpijn. Ik ben moe.", status: correct}, {value: "Ik heb hoofdpijn Ik ben moe", status: correct}]
    feedback: "Ik heb hoofdpijn en ik ben moe."
