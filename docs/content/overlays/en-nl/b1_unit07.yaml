  notes: >-
    Overlay for nl's seventh B1 unit, authored alongside the realization,
    no sibling-direction file (nl-en) consulted. English speakers' real
    risk here: English "could" is ambiguous between simple past ability
    ("I could swim as a kid") and hypothetical ("I could go tomorrow"),
    which doesn't warn a learner that Dutch uses three structurally
    distinct forms (*kon* simple past, *had ... kunnen* past regret,
    *zou kunnen* hypothetical) where English reuses one word --
    flagged explicitly in lesson03/04's grammar notes as the highest-
    risk interference point. The *had ... kunnen* IPP double-infinitive
    (lesson03) has no direct English parallel in word order ("I could
    have picked it up" vs Dutch's verb-final double-infinitive cluster)
    -- flagged there too, same shape as b1_unit06's *had ... moeten* note.
    Not yet reviewed.

course:
  title: Dutch B1
  description: >-
    Intermediate Dutch: expressing present ability with *kan*, past
    ability with *kon*, past regret about an unrealized ability with
    *had ... kunnen*, and hypothetical possibility with *zou kunnen*.

units:
  nl.b1.unit07.kunnen_en_konden:
    title: "What I Can and Could Do"
    description: Express present ability, past ability, past regret about something you could have done, and hypothetical possibility.

