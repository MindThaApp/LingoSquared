course:
  title: "Dutch A2"
  description: "Grammar-led A2 Dutch for identifying people and things with relative clauses."
  learning_goal: "Identify a person or thing with die or dat and a verb-final relative clause."
units:
  nl.a2.unit98.degene_die_en_dat: {title: "The man who, the book that", description: "Identify people at work and lost or bought things with die and dat relative clauses."}
lessons:
  nl.a2.unit98.lesson01.mensen_en_spullen: {"title": "People and things"}
  nl.a2.unit98.lesson02.die_of_dat: {"title": "Die or dat?"}
  nl.a2.unit98.lesson03.wie_doet_wat: {"title": "Who does what?"}
  nl.a2.unit98.lesson04.in_de_winkel: {"title": "Searching in the shop"}
  nl.a2.unit98.lesson05.noors_bericht: {"title": "Noor's message"}
  nl.a2.unit98.lesson06.lotte_en_omar: {"title": "Lotte and Omar at the shop"}
teaching:
  nl.a2.unit98.lesson01.teach.mensen: {"title": "People at work", "gloss": "the man / the woman / the colleague / the customer / the boss / the cook", "note": "All of these are de-words.", "example_gloss": ["The customer is a man.", "The colleague is a woman.", "The cook and the boss work here."]}
  nl.a2.unit98.lesson01.teach.winkel_werk: {"title": "Shop and work verbs", "gloss": "the shop / to work / to help / to look for / to buy", "note": "*Kocht* is the imperfectum of *kopen*.", "example_gloss": ["I work in the shop.", "The colleague helps the customer.", "I am looking for a bag.", "I bought a book."]}
  nl.a2.unit98.lesson01.teach.spullen: {"title": "Things in the shop, things you lose", "gloss": "the key / the bag / the wallet / the phone / the jacket / the glasses / the watch / the book / the shoes / the sweater / the gift", "note": "Note which words take *de* and which take *het*: *het horloge, het boek, het cadeau*. *De schoenen* is a plural.", "example_gloss": ["The key is in the bag.", "The watch is new.", "The gift is a book."]}
  nl.a2.unit98.lesson01.teach.kwijt: {"title": "Lost and found", "gloss": "lost / to lose / to find", "note": "*Verloor* and *vond* are the imperfectum of *verliezen* and *vinden*.", "example_gloss": ["I have lost my key.", "I lost my glasses.", "The customer found my phone."]}
  nl.a2.unit98.lesson01.teach.zinnen: {"title": "Short sentences", "gloss": "I have lost my bag. The colleague helps me. The customer found my phone."}
  nl.a2.unit98.lesson01.teach.dit_is: {"title": "This is, that is", "gloss": "This is the book. That is the man."}
  nl.a2.unit98.lesson01.teach.gn_patroon: {"title": "Die and dat point back to a noun", "gloss": "the man who works in the shop / the book that I bought", "note": "*Die* and *dat* link a short extra clause to the noun before them. The verb normally goes to the very end of that clause: *die in de winkel werkt*, *dat ik kocht*."}
  nl.a2.unit98.lesson02.teach.meer_spullen: {"title": "More things and some plurals", "gloss": "the bike / the umbrella / the ticket; the keys / the bags / the books / the watches / the sweaters", "note": "All plurals take *de*, also the plural of a het-word: *het boek* becomes *de boeken*.", "example_gloss": ["The umbrella is blue.", "The ticket is small."]}
  nl.a2.unit98.lesson02.teach.adjectieven: {"title": "Adjectives", "gloss": "new / beautiful / old / blue / black", "note": "After *de* or *het* the adjective gets an *-e*: *de nieuwe tas*, *het mooie boek*.", "example_gloss": ["The new bag is black.", "The beautiful book is old."]}
  nl.a2.unit98.lesson02.teach.gn_de_het: {"title": "Die for de-words and plurals, dat for het-words", "gloss": "the bag that / the shoes that / the watch that / the gift that", "note": "Use *die* after a de-word and after every plural. Use *dat* only after a het-word in the singular: *het horloge dat*, but *de horloges die*."}
  nl.a2.unit98.lesson02.teach.zinnen2: {"title": "Two sentences", "gloss": "I am looking for the keys that I lost. The ticket that I found is old.", "note": "A relative clause can also directly follow the subject. The whole group is the subject, so the main verb comes next. A comma after the relative clause is common but optional."}
  nl.a2.unit98.lesson03.teach.werkwoorden: {"title": "More verbs", "gloss": "to call / to see / to know", "note": "*Belde* and *zag* are the imperfectum of *bellen* and *zien*.", "example_gloss": ["I call the boss.", "I see the colleague.", "I know the customer."]}
  nl.a2.unit98.lesson03.teach.gn_onderwerp_voorwerp: {"title": "Who does the action?", "gloss": "the woman who sees me / the woman whom I see", "note": "In *de vrouw die mij ziet*, the woman is the one who sees. In *de vrouw die ik zie*, I am the one who sees. After *die* or *dat* you see either a verb right away (*die werkt*) or a new subject (*die ik zie*)."}
  nl.a2.unit98.lesson03.teach.gn_werkwoord_achteraan: {"title": "The verb goes to the end", "gloss": "The man works in the shop. / the man who works in the shop", "note": "In a normal sentence the verb is in second place. In a relative clause the verb normally goes to the end, after its object and any short phrase such as *in de winkel*."}
  nl.a2.unit98.lesson03.teach.zinnen3: {"title": "Two contrasting phrases", "gloss": "the customer who called me / the customer whom I called"}
  nl.a2.unit98.lesson04.teach.zoeken: {"title": "Lost property", "gloss": "I have lost my wallet. I am looking for the bag that I lost. These are the keys that I lost."}
  nl.a2.unit98.lesson04.teach.hier: {"title": "Helping in the shop", "gloss": "The man who works here helped me. That is the customer who found my phone."}
  nl.a2.unit98.lesson04.teach.gn_modaal: {"title": "Two verbs at the end", "gloss": "the jacket that I want to buy / the bag that I want to have", "note": "With a modal verb and an infinitive, both go to the end. The modal comes first, then the infinitive: *die ik wil kopen*."}
  nl.a2.unit98.lesson04.teach.gn_degene: {"title": "Degene die: the person who", "gloss": "I am looking for the person who found my bag.", "note": "*Degene die* means 'the person who'. Use it when you do not know exactly who the person is. In this unit it is followed by *die*."}
  nl.a2.unit98.lesson05.teach.woorden: {"title": "Useful small words", "gloss": "yesterday / there / again / back / now / also", "example_gloss": ["I bought the bag yesterday.", "Now I have the key again."]}
  nl.a2.unit98.lesson05.teach.reading: {"title": "Noor writes to Lotte", "gloss": "Hi Lotte, I have lost my bag. It is the bag that I bought yesterday. I searched in the shop. The woman who works there helped me. A customer who saw the bag called the boss. Now I have the bag again. The book that was in the bag is back too. Best wishes, Noor", "note": "Note each relative clause and the noun it belongs to.", "glosses": {"zocht": "searched", "hielp": "helped", "zat": "was (in)", "zag": "saw", "Groetjes": "best wishes"}}
  nl.a2.unit98.lesson05.teach.gn_zin_in_zin: {"title": "A relative clause inside a sentence", "gloss": "The woman who works there helped me.", "note": "When the relative clause stands after the subject, the main verb follows it. A comma after the relative clause is common but optional. The relative clause is part of the subject."}
  nl.a2.unit98.lesson06.teach.lotte_kwijt: {"title": "Lotte says (line 1)", "gloss": "Lotte: Hi Omar, I have lost my jacket."}
  nl.a2.unit98.lesson06.teach.omar_gisteren: {"title": "Omar says (line 2)", "gloss": "Omar: Oh no! Is it the jacket that you bought yesterday?"}
  nl.a2.unit98.lesson06.teach.lotte_blauw: {"title": "Lotte says (line 3)", "gloss": "Lotte: No, it is the blue jacket that I bought last week."}
  nl.a2.unit98.lesson06.teach.omar_man: {"title": "Omar says (line 4)", "gloss": "Omar: A man who works in the shop found a blue jacket."}
  nl.a2.unit98.lesson06.teach.lotte_dank: {"title": "Lotte says (line 5)", "gloss": "Lotte: Really? Thank you, Omar! Then I will go to the shop."}
  nl.a2.unit98.lesson06.teach.omar_succes: {"title": "Omar says (line 6)", "gloss": "Omar: Good luck! Ask for the man who found the jacket."}
exercises:
  nl.a2.unit98.lesson01.exercise01.choose_man_winkel: {"instruction": "Choose the correct Dutch phrase.", "correct_option": "De man die in de winkel werkt.", "distractors": ["De man dat in de winkel werkt.", "De man die in de winkel werken.", "Het man die in de winkel werkt."], "accepted_answers": [{"value": "De man die in de winkel werkt.", "status": "correct"}], "feedback": "*De man die in de winkel werkt*: *die* after a de-word, and the verb *werkt* goes to the end."}
  nl.a2.unit98.lesson01.exercise02.choose_boek: {"instruction": "Choose the correct Dutch phrase.", "correct_option": "Het boek dat ik kocht.", "distractors": ["Het boek die ik kocht.", "Het boek dat kocht ik.", "De boek dat ik kocht."], "accepted_answers": [{"value": "Het boek dat ik kocht.", "status": "correct"}], "feedback": "*Het boek dat ik kocht*: *dat* after a het-word, and the verb *kocht* goes to the end."}
  nl.a2.unit98.lesson01.exercise03.match_phrases: {"instruction": "Match each Dutch phrase to its English meaning.", "accepted_answers": [{"value": [{"left": "de man die in de winkel werkt", "right": "the man who works in the shop"}, {"left": "de tas die ik zoek", "right": "the bag that I am looking for"}, {"left": "het boek dat ik kocht", "right": "the book that I bought"}, {"left": "de klant die mijn telefoon vond", "right": "the customer who found my phone"}, {"left": "het horloge dat ik verloor", "right": "the watch that I lost"}, {"left": "de collega die mij helpt", "right": "the colleague who helps me"}], "status": "correct"}], "feedback": "Each phrase names a person or thing and then says which one: *die* or *dat*, then the verb at the end."}
  nl.a2.unit98.lesson01.exercise04.order_dit_is: {"instruction": "Put the words in order to say 'This is the book that I bought.'", "correct_option": "Dit is het boek dat ik kocht", "accepted_answers": [{"value": "Dit is het boek dat ik kocht", "status": "correct"}], "feedback": "*Dit is het boek dat ik kocht.* The verb *kocht* is last."}
  nl.a2.unit98.lesson01.exercise05.complete_die: {"instruction": "Complete the sentence with die or dat.", "correct_option": "die", "accepted_answers": [{"value": "die", "status": "correct"}], "feedback": "*Man* is a de-word, so *die*."}
  nl.a2.unit98.lesson01.exercise06.translate_vrouw: {"instruction": "Translate into Dutch.", "accepted_answers": [{"value": "De vrouw die in de winkel werkt, is mijn collega.", "status": "correct"}, {"value": "De vrouw die in de winkel werkt, is mijn collega", "status": "correct"}, {"value": "De vrouw die in de winkel werkt is mijn collega", "status": "correct"}, {"value": "De vrouw die in de winkel werkt is mijn collega.", "status": "correct"}, {"value": "De vrouw die werkt in de winkel, is mijn collega.", "status": "correct"}, {"value": "De vrouw die werkt in de winkel is mijn collega.", "status": "correct"}, {"value": "Mijn collega is de vrouw die in de winkel werkt.", "status": "correct"}, {"value": "Mijn collega is de vrouw die in de winkel werkt", "status": "correct"}], "feedback": "*De vrouw die in de winkel werkt, is mijn collega.*"}
  nl.a2.unit98.lesson01.exercise07.write_boek: {"instruction": "Write the Dutch phrase.", "correct_option": "Het boek dat ik kocht", "accepted_answers": [{"value": "Het boek dat ik kocht", "status": "correct"}, {"value": "het boek dat ik kocht", "status": "correct"}, {"value": "Het boek dat ik kocht.", "status": "correct"}, {"value": "het boek dat ik kocht.", "status": "correct"}], "feedback": "*Het boek dat ik kocht.*"}
  nl.a2.unit98.lesson02.exercise01.choose_schoenen: {"instruction": "Choose the correct Dutch phrase.", "correct_option": "De schoenen die ik kocht.", "distractors": ["De schoenen dat ik kocht.", "Het schoenen die ik kocht.", "De schoenen die kocht ik."], "accepted_answers": [{"value": "De schoenen die ik kocht.", "status": "correct"}], "feedback": "*Schoenen* is a plural, so *die*."}
  nl.a2.unit98.lesson02.exercise02.choose_horloge: {"instruction": "Choose the correct Dutch phrase.", "correct_option": "Het horloge dat ik zoek.", "distractors": ["Het horloge die ik zoek.", "De horloge dat ik zoek.", "Het horloge dat zoek ik."], "accepted_answers": [{"value": "Het horloge dat ik zoek.", "status": "correct"}], "feedback": "*Horloge* is a het-word, so *dat*."}
  nl.a2.unit98.lesson02.exercise03.match_die_dat: {"instruction": "Match each English phrase to the Dutch phrase.", "accepted_answers": [{"value": [{"left": "the books that I bought", "right": "de boeken die ik kocht"}, {"left": "the watch that I lost", "right": "het horloge dat ik verloor"}, {"left": "the gift that I bought", "right": "het cadeau dat ik kocht"}, {"left": "the umbrella that I lost", "right": "de paraplu die ik verloor"}, {"left": "the shoes that I am looking for", "right": "de schoenen die ik zoek"}, {"left": "the ticket that I found", "right": "het kaartje dat ik vond"}], "status": "correct"}], "feedback": "Check the noun first: de-word or plural gives *die*, singular het-word gives *dat*."}
  nl.a2.unit98.lesson02.exercise04.order_horloge: {"instruction": "Put the words in order to say 'I am looking for the watch that I lost.'", "correct_option": "Ik zoek het horloge dat ik verloor", "accepted_answers": [{"value": "Ik zoek het horloge dat ik verloor", "status": "correct"}, {"value": "Het horloge dat ik verloor zoek ik", "status": "correct"}], "feedback": "*Ik zoek het horloge dat ik verloor.*"}
  nl.a2.unit98.lesson02.exercise05.complete_kaartje: {"instruction": "Complete the sentence with die or dat.", "correct_option": "dat", "accepted_answers": [{"value": "dat", "status": "correct"}], "feedback": "*Kaartje* is a het-word, so *dat*."}
  nl.a2.unit98.lesson02.exercise06.translate_paraplu: {"instruction": "Translate into Dutch. Use the imperfectum for 'lost'.", "accepted_answers": [{"value": "Ik zoek de blauwe paraplu die ik verloor.", "status": "correct"}, {"value": "Ik zoek de blauwe paraplu die ik verloor", "status": "correct"}], "feedback": "*Ik zoek de blauwe paraplu die ik verloor.*"}
  nl.a2.unit98.lesson02.exercise07.write_horloge: {"instruction": "Write the Dutch phrase.", "correct_option": "Het oude horloge dat ik verloor", "accepted_answers": [{"value": "Het oude horloge dat ik verloor", "status": "correct"}, {"value": "het oude horloge dat ik verloor", "status": "correct"}, {"value": "Het oude horloge dat ik verloor.", "status": "correct"}, {"value": "het oude horloge dat ik verloor.", "status": "correct"}], "feedback": "*Het oude horloge dat ik verloor.*"}
  nl.a2.unit98.lesson03.exercise01.choose_klant_belde: {"instruction": "Choose the correct Dutch phrase.", "correct_option": "De klant die mij belde.", "distractors": ["De klant die ik belde.", "De klant dat mij belde.", "De klant die belde mij."], "accepted_answers": [{"value": "De klant die mij belde.", "status": "correct"}], "feedback": "*De klant die mij belde*: the customer is the one who called, and *mij* is the person called."}
  nl.a2.unit98.lesson03.exercise02.listen_vrouw: {"instruction": "Listen and select the sentence you hear.", "correct_option": "De vrouw die ik zie, werkt in de winkel.", "distractors": ["De vrouw die mij ziet, werkt in de winkel.", "De vrouw die ik belde, werkt in de winkel.", "De man die ik zie, werkt in de winkel."], "accepted_answers": [{"value": "De vrouw die ik zie, werkt in de winkel.", "status": "correct"}], "feedback": "You heard *De vrouw die ik zie, werkt in de winkel.* Here I see her."}
  nl.a2.unit98.lesson03.exercise03.match_subject_object: {"instruction": "Match each Dutch phrase to its English meaning.", "accepted_answers": [{"value": [{"left": "de vrouw die mij ziet", "right": "the woman who sees me"}, {"left": "de vrouw die ik zie", "right": "the woman I see"}, {"left": "de man die mij helpt", "right": "the man who helps me"}, {"left": "de man die ik help", "right": "the man I help"}, {"left": "de collega die mij belt", "right": "the colleague who calls me"}, {"left": "de collega die ik bel", "right": "the colleague I call"}], "status": "correct"}], "feedback": "Look at who comes after *die*: *mij* means the noun does the action; *ik* means I do it."}
  nl.a2.unit98.lesson03.exercise04.order_dit_is_man: {"instruction": "Put the words in order to say 'This is the man who works in the shop.'", "correct_option": "Dit is de man die in de winkel werkt", "accepted_answers": [{"value": "Dit is de man die in de winkel werkt", "status": "correct"}], "feedback": "*Dit is de man die in de winkel werkt.*"}
  nl.a2.unit98.lesson03.exercise05.complete_helpt: {"instruction": "Complete the sentence with die or dat.", "correct_option": "die", "accepted_answers": [{"value": "die", "status": "correct"}], "feedback": "*Vrouw* is a de-word, so *die*."}
  nl.a2.unit98.lesson03.exercise06.translate_man_zie: {"instruction": "Translate into Dutch. Use a relative clause with die.", "accepted_answers": [{"value": "De man die ik zie, werkt in de winkel.", "status": "correct"}, {"value": "De man die ik zie, werkt in de winkel", "status": "correct"}, {"value": "De man die ik zie werkt in de winkel", "status": "correct"}, {"value": "De man die ik zie werkt in de winkel.", "status": "correct"}], "feedback": "*De man die ik zie, werkt in de winkel.*"}
  nl.a2.unit98.lesson03.exercise07.write_vrouw_belde: {"instruction": "Write the Dutch phrase.", "correct_option": "De vrouw die mij belde", "accepted_answers": [{"value": "De vrouw die mij belde", "status": "correct"}, {"value": "de vrouw die mij belde", "status": "correct"}, {"value": "De vrouw die mij belde.", "status": "correct"}, {"value": "de vrouw die mij belde.", "status": "correct"}, {"value": "De vrouw die me belde", "status": "correct"}, {"value": "De vrouw die me belde.", "status": "correct"}], "feedback": "*De vrouw die mij belde.*"}
  nl.a2.unit98.lesson04.exercise01.choose_jas_kopen: {"instruction": "Choose the correct Dutch sentence.", "correct_option": "Ik zoek de jas die ik wil kopen.", "distractors": ["Ik zoek de jas dat ik wil kopen.", "Ik zoek de jas die wil ik kopen.", "Ik zoek de jas die ik kopen."], "accepted_answers": [{"value": "Ik zoek de jas die ik wil kopen.", "status": "correct"}], "feedback": "*Jas* is a de-word. Both verbs go to the end: *die ik wil kopen*."}
  nl.a2.unit98.lesson04.exercise02.choose_degene: {"instruction": "Choose the correct Dutch sentence.", "correct_option": "Ik zoek degene die mijn tas vond.", "distractors": ["Ik zoek degene dat mijn tas vond.", "Ik zoek degene die vond mijn tas.", "Ik zoek degene die ik mijn tas vond."], "accepted_answers": [{"value": "Ik zoek degene die mijn tas vond.", "status": "correct"}], "feedback": "*Degene die mijn tas vond*: the verb *vond* is at the end."}
  nl.a2.unit98.lesson04.exercise03.match_situations: {"instruction": "Match each English sentence to the Dutch sentence.", "accepted_answers": [{"value": [{"left": "I have lost my wallet.", "right": "Ik ben mijn portemonnee kwijt."}, {"left": "I am looking for the person who found my bag.", "right": "Ik zoek degene die mijn tas vond."}, {"left": "This is the watch that I bought.", "right": "Dit is het horloge dat ik kocht."}, {"left": "The man who works here helped me.", "right": "De man die hier werkt, hielp mij."}, {"left": "That is the customer who found my phone.", "right": "Dat is de klant die mijn telefoon vond."}, {"left": "These are the keys that I lost.", "right": "Dit zijn de sleutels die ik verloor."}], "status": "correct"}], "feedback": "Each sentence names one thing or person and then adds a clause with *die* or *dat*."}
  nl.a2.unit98.lesson04.exercise04.order_jas: {"instruction": "Put the words in order to say 'I am looking for the jacket that I want to buy.'", "correct_option": "Ik zoek de jas die ik wil kopen", "accepted_answers": [{"value": "Ik zoek de jas die ik wil kopen", "status": "correct"}, {"value": "De jas die ik wil kopen zoek ik", "status": "correct"}], "feedback": "*Ik zoek de jas die ik wil kopen.*"}
  nl.a2.unit98.lesson04.exercise05.complete_degene: {"instruction": "Complete the sentence with the Dutch word for 'the person' (who).", "correct_option": "degene", "accepted_answers": [{"value": "degene", "status": "correct"}], "feedback": "*Degene die* = the person who."}
  nl.a2.unit98.lesson04.exercise06.translate_man_zoek: {"instruction": "Translate into Dutch.", "accepted_answers": [{"value": "Ik zoek de man die in de winkel werkt.", "status": "correct"}, {"value": "Ik zoek de man die in de winkel werkt", "status": "correct"}, {"value": "Ik zoek de man die werkt in de winkel.", "status": "correct"}, {"value": "Ik zoek de man die werkt in de winkel", "status": "correct"}], "feedback": "*Ik zoek de man die in de winkel werkt.*"}
  nl.a2.unit98.lesson04.exercise07.write_tas: {"instruction": "Write one sentence.", "correct_option": "Ik zoek de tas die ik verloor.", "accepted_answers": [{"value": "Ik zoek de tas die ik verloor.", "status": "correct"}, {"value": "Ik zoek de tas die ik verloor", "status": "correct"}, {"value": "Ik zoek mijn tas die ik verloor.", "status": "correct"}, {"value": "Ik zoek mijn tas die ik verloor", "status": "correct"}], "feedback": "*Ik zoek de tas die ik verloor.*"}
  nl.a2.unit98.lesson05.exercise01.read_verloren: {"instruction": "Read Noor's message. What did Noor lose?", "correct_option": "Her bag.", "distractors": ["Her jacket.", "Her phone.", "Her keys."], "accepted_answers": [{"value": "Her bag.", "status": "correct"}], "feedback": "*Ik ben mijn tas kwijt.*"}
  nl.a2.unit98.lesson05.exercise02.read_baas: {"instruction": "Read Noor's message. Who called the boss?", "correct_option": "A customer who saw the bag.", "distractors": ["The woman who works there.", "Lotte.", "Noor."], "accepted_answers": [{"value": "A customer who saw the bag.", "status": "correct"}], "feedback": "*Een klant die de tas zag, belde de baas.*"}
  nl.a2.unit98.lesson05.exercise03.match_reading: {"instruction": "Match each phrase from the message to its meaning.", "accepted_answers": [{"value": [{"left": "de tas die ik gisteren kocht", "right": "the bag that Noor bought yesterday"}, {"left": "de vrouw die daar werkt", "right": "the woman who works there"}, {"left": "een klant die de tas zag", "right": "a customer who saw the bag"}, {"left": "het boek dat in de tas zat", "right": "the book that was in the bag"}, {"left": "Nu heb ik de tas weer", "right": "Noor has the bag again"}, {"left": "Ik ben mijn tas kwijt", "right": "Noor has lost her bag"}], "status": "correct"}], "feedback": "These phrases come from Noor's message."}
  nl.a2.unit98.lesson05.exercise04.order_vrouw: {"instruction": "Put the words in order to say 'The woman who works there helped me.'", "correct_option": "De vrouw die daar werkt hielp mij", "accepted_answers": [{"value": "De vrouw die daar werkt hielp mij", "status": "correct"}, {"value": "Mij hielp de vrouw die daar werkt", "status": "correct"}], "feedback": "*De vrouw die daar werkt, hielp mij.*"}
  nl.a2.unit98.lesson05.exercise05.translate_klant: {"instruction": "Translate into Dutch. Use the imperfectum.", "accepted_answers": [{"value": "Een klant die de tas zag, belde de baas.", "status": "correct"}, {"value": "Een klant die de tas zag, belde de baas", "status": "correct"}, {"value": "Een klant die de tas zag belde de baas", "status": "correct"}, {"value": "Een klant die de tas zag belde de baas.", "status": "correct"}], "feedback": "*Een klant die de tas zag, belde de baas.*"}
  nl.a2.unit98.lesson05.exercise06.dictation_tas: {"instruction": "Type what you hear.", "correct_response": "Dit is de tas die ik gisteren kocht.", "orthography_strict": true, "feedback": "You heard *Dit is de tas die ik gisteren kocht.*"}
