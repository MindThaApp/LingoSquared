    example_gloss: "Could you pick me up from the station?"
  nl.b1.unit05.lesson04.teach.dialogue_sara_gehoord:
    title: "Sara: Have you heard anything from Omar?"
    gloss: "Sara: Have you heard anything from Omar?"
  nl.b1.unit05.lesson04.teach.dialogue_lotte_zei:
    title: "Lotte: Yes, he said he would come tomorrow."
    gloss: "Lotte: Yes, he said he would come tomorrow."
  nl.b1.unit05.lesson04.teach.dialogue_sara_mooizo:
    title: "Sara: Great. Did he ask anything else?"
    gloss: "Sara: Great. Did he ask anything else?"
  nl.b1.unit05.lesson04.teach.dialogue_lotte_ophalen:
    title: "Lotte: He asked whether I could pick him up from the station."
    gloss: "Lotte: He asked whether I could pick him up from the station."

  nl.b1.unit05.lesson05.teach.gisteren:
    title: yesterday
    gloss: yesterday
    example_gloss: "Yesterday Omar called."
  nl.b1.unit05.lesson05.teach.lange_reis:
    title: "a long trip / journey"
    gloss: "a long trip / journey"
    example_gloss: "He was tired after a long trip."
  nl.b1.unit05.lesson05.teach.samen_eten:
    title: "to eat together"
    gloss: "to eat together"
    example_gloss: "He asked whether we could eat together."
  nl.b1.unit05.lesson05.teach.reading_omar_belde:
    title: "Reading: Omar called"
    gloss: "Yesterday Omar called. He said that he was tired after a long trip. He asked whether I could pick him up from the station. I said that that was no problem. Later he also asked whether we could eat together."
    glosses:
      Gisteren: "yesterday"
      belde: "called (past of bellen)"
      zei: "said (past of zeggen)"
      moe: "tired"
      was: "was (past of zijn)"
      na: "after"
      lange: "long"
      reis: "trip, journey"
      vroeg: "asked (past of vragen)"
      of: "whether, if"
      kon: "could (past of kunnen)"
      ophalen: "to pick up"
      geen: "no, not any"
      Later: "later"
      ook: "also, too"
      samen: "together"
      konden: "could (plural, past of kunnen)"
      eten: "to eat"

  nl.b1.unit05.lesson06.teach.wanneer:
    title: when
    gloss: when
    example_gloss: "He asked when I could come."
  nl.b1.unit05.lesson06.teach.wat:
    title: what
    gloss: what
    example_gloss: "She asked what I wanted."
  nl.b1.unit05.lesson06.teach.grammar_review:
    title: "He asked when I could come. She asked what I wanted."
    gloss: "He asked when I could come. She asked what I wanted."
    note: "For a reported wh-question, the question word itself (*wat*, *wanneer*, *waar*, *wie*) replaces *dat*/*of* as the clause-introducer -- the same verb-final clause pattern continues in every case across this whole unit: *zei dat* (statement), *zei dat ... zou* (reported future), *vroeg of* (yes/no question), *vroeg wat/wanneer* (wh-question)."

