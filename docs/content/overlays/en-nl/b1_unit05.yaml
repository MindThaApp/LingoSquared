review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    Overlay for nl's fifth B1 unit, authored alongside the realization.
    English speakers' real advantage here: English also backshifts tense
    in reported speech ("I am tired" -> "he said he WAS tired"), so
    lesson01's core pattern is genuinely intuitive, not a new category
    to learn from scratch -- flagged positively in lesson01's note,
    unlike most of this unit's other real interference risks. The real
    risk is narrower: reported YES/NO questions use *of* ("whether/if"),
    a dedicated word with no equivalent in a direct question, where
    English just inverts word order (Kun je helpen? -> Hij vroeg OF ik
    kon helpen, not a literal "asked can I help") -- flagged in
    lesson03. Fresh-context review 2026-07-11: replaced a fragile listen_select
    distractor ("She said she was coming" is a defensible English
    rendering of the same audio "Ze zei dat ze zou komen"); added
    ze/zij register-pair accepted-answer variants.

course:
  title: Dutch B1
  description: >-
    Intermediate Dutch: reporting what someone said or asked using
    indirect speech -- *zei dat* for statements (with the expected
    present-to-past tense shift), *zou* for a reported future, and
    *vroeg of*/*vroeg wat/wanneer* for reported questions.

units:
  nl.b1.unit05.indirecte_rede:
    title: "Reported Speech"
    description: Report what someone said or asked, using indirect speech with correctly shifted tense.

lessons:
  nl.b1.unit05.lesson01.zei_dat:
    title: "He said that..."
  nl.b1.unit05.lesson02.zei_dat_zou:
    title: "She said she would come"
  nl.b1.unit05.lesson03.vroeg_of:
    title: "He asked whether..."
  nl.b1.unit05.lesson04.omar_belde:
    title: "Have you heard from Omar?"
  nl.b1.unit05.lesson05.omar_belde_lezen:
    title: "Omar called"
  nl.b1.unit05.lesson06.wrapup_production:
    title: "Review"

teaching:
  nl.b1.unit05.lesson01.teach.ik:
    title: I
    gloss: I
    example_gloss: "I am tired."
  nl.b1.unit05.lesson01.teach.hij:
    title: he
    gloss: he
    example_gloss: "He said that he was tired."
  nl.b1.unit05.lesson01.teach.zei:
    title: said
    gloss: said
    example_gloss: "He said that he was tired."
  nl.b1.unit05.lesson01.teach.dat:
    title: that
    gloss: that
    example_gloss: "He said that he was tired."
  nl.b1.unit05.lesson01.teach.moe:
    title: tired
    gloss: tired
    example_gloss: "He said that he was tired."
  nl.b1.unit05.lesson01.teach.was:
    title: was
    gloss: was
    note: "*Ben* (am) and *is* (is) shift to *was* (was) when reported -- the same present-to-past backshift English does ('I am tired' -> 'he said he WAS tired'), so this half of Dutch reported speech is genuinely intuitive for an English speaker, unlike most of this unit's other patterns."
    example_gloss: "He said that he was tired."
  nl.b1.unit05.lesson01.teach.grammar_zei_dat:
    title: "He said that he was tired."
    gloss: "He said that he was tired."
    note: "*Zei dat* + clause (verb-final: *...moe WAS*) is the basic pattern for reporting a statement. Direct speech *Ik ben moe* ('I am tired') backshifts to *hij zei dat hij moe was* once reported -- same tense-shift logic as English."

  nl.b1.unit05.lesson02.teach.ze:
    title: she
    gloss: she
    example_gloss: "She said she would come."
  nl.b1.unit05.lesson02.teach.komen:
    title: "to come"
    gloss: "to come"
    example_gloss: "She said she would come."
  nl.b1.unit05.lesson02.teach.zou:
    title: "would (reported future)"
    gloss: "would (reported future)"
    note: "The same *zou* taught for hypotheticals elsewhere now marks a REPORTED FUTURE: direct *Ik kom morgen* ('I'm coming tomorrow,' present tense used for the future, as Dutch often does) becomes *hij zei dat hij morgen ZOU komen* once reported -- *zou* is what backshifts a future meaning into a past-reporting context, since Dutch has no separate 'would'-shaped future-in-the-past form."
    example_gloss: "He said he would come tomorrow."
  nl.b1.unit05.lesson02.teach.morgen:
    title: tomorrow
    gloss: tomorrow
    example_gloss: "He said he would come tomorrow."
  nl.b1.unit05.lesson02.teach.grammar_zei_dat_zou:
    title: "She said she would come. He said he would come tomorrow."
    gloss: "She said she would come. He said he would come tomorrow."
    note: "Reported future = *zei dat* + subject + ... + *zou* + infinitive (pushed to the end). This is the direct extension of lesson01's pattern to future meaning."

  nl.b1.unit05.lesson03.teach.vroeg:
    title: asked
    gloss: asked
    example_gloss: "He asked whether I could help."
  nl.b1.unit05.lesson03.teach.of:
    title: "whether / if"
    gloss: "whether / if"
    note: "Reporting a yes/no question needs the dedicated word *of* -- there's no literal word-for-word translation of a direct yes/no question the way *dat* handles a statement. English just inverts word order instead ('Can you help?' -> 'he asked whether I could help'), so *of* is a genuinely new piece to add, not a word English already has an equivalent for."
    example_gloss: "He asked whether I could help."
  nl.b1.unit05.lesson03.teach.kon:
    title: could
    gloss: could
    example_gloss: "He asked whether I could help."
  nl.b1.unit05.lesson03.teach.helpen:
    title: "to help"
    gloss: "to help"
    example_gloss: "Can you help?"
  nl.b1.unit05.lesson03.teach.grammar_vroeg_of:
    title: "He asked whether I could help."
    gloss: "He asked whether I could help."
    note: "Reported yes/no question = *vroeg of* + clause (verb-final, modal tense-shifted: direct *kun* -> reported *kon*). Compare with lesson01/02's *zei dat* for statements -- *of* replaces *dat* specifically for a yes/no question being reported."

  nl.b1.unit05.lesson04.teach.heb_je_gehoord:
