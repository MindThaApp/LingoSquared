teaching:
  nl.a2.unit76.lesson01.teach.rooster:
    title: "The schedule"
    gloss: "the schedule/timetable"
    note: "*Het rooster* is a neuter (het) noun, used for a work or class timetable."
    example_gloss: "I check my schedule every week."
  nl.a2.unit76.lesson01.teach.maandag_woensdag:
    title: "Naming two different days' activities"
    gloss: "On Monday I work, and on Wednesday I have a course."
    note: "*Op* + a weekday is the standard way to say 'on' a specific day in Dutch."
  nl.a2.unit76.lesson01.teach.wat_doe_je:
    title: "Asking what someone usually does during the week"
    gloss: "What do you usually do during the week?"
    note: "*Door de week* (during the week, literally 'through the week') refers to weekdays as a set, contrasted with *het weekend*."

  nl.a2.unit76.lesson02.teach.volgorde:
    title: "The order/sequence"
    gloss: "the order/sequence"
    note: "*De volgorde* is a common (de) noun, used for the order events happen in."
    example_gloss: "The order of my day is always the same."
  nl.a2.unit76.lesson02.teach.eerst_daarna:
    title: "Sequencing with eerst and daarna"
    gloss: "First I work, then I go exercise."
    note: "*Eerst* (first) and *daarna* (after that/then) are the two most common sequencing connectors in Dutch."
  nl.a2.unit76.lesson02.teach.ten_slotte:
    title: "Sequencing with ten slotte"
    gloss: "Finally I cook something for dinner."
    note: "*Ten slotte* (finally) closes a sequence started with *eerst* and continued with *daarna*."

  nl.a2.unit76.lesson03.teach.doordeweekse_dag:
    title: "The weekday"
    gloss: "the weekday"
    note: "*De doordeweekse dag* is a common (de) noun phrase, contrasted with *het weekend*."
    example_gloss: "On a weekday I get up early."
  nl.a2.unit76.lesson03.teach.vroeg_op_uitslapen:
    title: "Contrasting weekdays and the weekend"
    gloss: "During the week I get up early, but on the weekend I sleep in."
    note: "*Uitslapen* (to sleep in) is a separable verb; *uit* moves to the end of the clause."
  nl.a2.unit76.lesson03.teach.wat_is_verschil:
    title: "Asking about the difference"
    gloss: "What's the difference between your weekdays and the weekend?"
    note: "*Het verschil tussen ... en ...* (the difference between ... and ...) is the standard comparison frame."

  nl.a2.unit76.lesson04.teach.agenda:
    title: "The schedule/planner"
    gloss: "the schedule/planner"
    note: "*De agenda* is a common (de) noun, used for a personal planner or calendar of appointments."
    example_gloss: "My schedule is completely full this week."
  nl.a2.unit76.lesson04.teach.agenda_vol:
    title: "Saying your schedule is completely full"
    gloss: "My schedule is completely full this week."
    note: "*Zit vol* (literally 'sits full') is the idiomatic way to say a schedule is fully booked."
  nl.a2.unit76.lesson04.teach.geen_vrije_avond:
    title: "Saying you have no free evening"
    gloss: "I have no free evening this week."
    note: "*Vrije avond* (free evening) uses *vrije*, the inflected form of *vrij* before a *de*-word."
  nl.a2.unit76.lesson04.teach.volgende_week_meer_tijd:
    title: "Looking ahead to next week"
    gloss: "Next week I'll have more time."
    note: "*Volgende week* (next week) contrasts with *deze week* (this week), already used earlier in this lesson."

  nl.a2.unit76.lesson05.teach.ninas_week:
    title: "Reading about Nina's busy week"
    gloss: >-
      Nina's week looks busy. On Monday and Tuesday she works at the
      library. On Wednesday evening she has a language course. On
      Thursday she exercises with friends, and on Friday she cooks for
      her family. On the weekend she rests and reads a book.
    note: "*Ziet er druk uit* (looks busy) uses *eruitzien* (to look/appear), a separable verb; *er ... uit* frames the description."

  nl.a2.unit76.lesson06.teach.lotte_vraag:
    title: "Lotte asks about Omar's week"
    gloss: "Lotte: What does your week look like, Omar?"
  nl.a2.unit76.lesson06.teach.omar_druk:
    title: "Omar describes his work schedule"
    gloss: "Omar: Pretty busy. First I work from Monday to Thursday, then I have Friday off."
  nl.a2.unit76.lesson06.teach.lotte_vrije_dag:
    title: "Lotte asks about his day off"
    gloss: "Lotte: What do you do on your day off?"
  nl.a2.unit76.lesson06.teach.omar_sport_kook:
    title: "Omar describes Friday"
    gloss: "Omar: On Fridays I usually exercise, and in the evening I cook something tasty."
  nl.a2.unit76.lesson06.teach.lotte_weekend_vraag:
    title: "Lotte asks about the weekend"
    gloss: "Lotte: And on the weekend?"
  nl.a2.unit76.lesson06.teach.omar_rust_uit:
    title: "Omar describes the weekend"
    gloss: "Omar: On the weekend I rest. During the week I just don't have time."
  nl.a2.unit76.lesson06.teach.grammar_sequencing:
    title: "Third-person sequencing with eerst/daarna/ten slotte"
    gloss: "She works first. Then she exercises. Finally she rests."
    note: "The same eerst/daarna/ten slotte connectors from lesson02 work identically with a third-person subject (*zij*); only the verb conjugation changes."

