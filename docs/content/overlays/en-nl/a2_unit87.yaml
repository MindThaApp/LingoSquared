    - {value: Ik moet eerst douchen, status: correct}
    - {value: Eerst moet ik douchen., status: correct}
    - {value: Eerst moet ik douchen, status: correct}
    feedback: '*Ik moet eerst douchen.* or *Eerst moet ik douchen.*'
