review: {status: unreviewed, required_next_reviewer: ramin_native_pass, notes: 'English overlay for the grammar-led permission and rules unit. OPEN NATIVE QUESTIONS: see realization.'}
course: {title: Dutch A2, description: Grammar-led A2 Dutch for talking about rules and permission., learning_goal: 'Ask whether something is allowed and state what must or need not be done with mogen, moeten and hoeven niet te.'}
units:
  nl.a2.unit87.wat_mag_en_moet: {title: What is allowed and what is required, description: 'Ask permission and state house rules with mogen, moeten and hoeven niet te.'}
lessons:
  nl.a2.unit87.lesson01.mag_dat: {title: Is that allowed?}
  nl.a2.unit87.lesson02.dat_moet: {title: That is required}
  nl.a2.unit87.lesson03.hoeven_niet_te: {title: That is not necessary}
  nl.a2.unit87.lesson04.zwembad_en_sportschool: {title: Swimming pool and gym}
  nl.a2.unit87.lesson05.huisregels_bibliotheek: {title: House rules in the library}
  nl.a2.unit87.lesson06.lotte_en_omar: {title: Lotte and Omar at the gym}
teaching:
  nl.a2.unit87.lesson01.teach.plekken:
    title: Places with rules
    gloss: the library / the swimming pool / the gym
    note: These are three places where rules matter.
    example_gloss: [I read a book in the library., Noor swims in the swimming pool., Omar is at the gym.]
  nl.a2.unit87.lesson01.teach.handelingen:
    title: Things you may or may not do
    gloss: to swim / to eat / to call / to smoke / to borrow
    note: Dutch verbs end in -en in the infinitive. The infinitive is the form you will put at the end of the sentence.
    example_gloss: [I want to swim in the swimming pool., Lotte wants to eat a sandwich., Noor calls Omar., Omar does not smoke., I borrow a book.]
  nl.a2.unit87.lesson01.teach.plaatsen:
    title: Here, inside, outside
    gloss: here / inside / outside
    note: Rules often depend on place.
    example_gloss: [I am here., It is warm inside., It is raining outside.]
  nl.a2.unit87.lesson01.teach.gn_mogen: {title: 'Mogen: to be allowed to', gloss: I may / you may / he may / we may / you (pl.) may / they may, note: '*Mogen* means to be allowed to. The singular forms are all *mag*: *ik mag, jij mag, je mag, hij mag*. The plural is *mogen*.'}
  nl.a2.unit87.lesson01.teach.gn_tweede_plaats: {title: 'Modal second, infinitive last', gloss: 'I may swim here. May I swim here?', note: 'In a statement the modal verb is in second position and the infinitive goes to the very end: *Ik mag hier zwemmen.* In a yes/no question the modal comes first, but the infinitive is still last: *Mag ik hier zwemmen?*'}
  nl.a2.unit87.lesson01.teach.antwoorden: {title: Short answers, gloss: 'Yes, that is allowed. No, that is not allowed.'}
  nl.a2.unit87.lesson01.teach.vragen: {title: Asking permission, gloss: 'May I eat here? May I call here? May I smoke here?'}
  nl.a2.unit87.lesson02.teach.regels:
    title: Rules and cards
    gloss: the rule / the house rules / the card
    note: '*Huisregels* is plural: it names all the rules of a building.'
    example_gloss: [That is a rule., Read the house rules., I have my card.]
  nl.a2.unit87.lesson02.teach.handeling2:
    title: Things you must do
    gloss: to pay / to show / to shower
    note: '*Laten zien* is two words. Together they mean to show.'
    example_gloss: [Omar pays with his card., I am going to show my card., Lotte wants to shower first.]
  nl.a2.unit87.lesson02.teach.afval:
    title: Waste sorting
    gloss: the waste / to separate (to sort)
    note: In the Netherlands you sort waste into glass, paper and plastic.
    example_gloss: [We sort the waste., 'You have to sort glass, paper and plastic.']
  nl.a2.unit87.lesson02.teach.materialen:
    title: Materials
    gloss: the paper / the glass / the plastic
    note: Waste is sorted by material.
    example_gloss: [This is paper., This is glass., This is plastic.]
  nl.a2.unit87.lesson02.teach.gn_moeten: {title: 'Moeten: to have to', gloss: I must / you must / he must / we must / you (pl.) must / they must, note: '*Moeten* means to have to. The singular forms are all *moet*: *ik moet, jij moet, je moet, hij moet*. The plural is *moeten*.'}
  nl.a2.unit87.lesson02.teach.gn_moeten_zin: {title: Moeten works like mogen, gloss: 'You have to show your card. Do I have to pay?', note: '*Moeten* behaves like *mogen*: it is in second position in a statement (after the first part of the sentence), it opens a yes/no question, and the infinitive is last. With *laten zien* both words stay together at the end.'}
  nl.a2.unit87.lesson02.teach.zinnen: {title: Two rules, gloss: I have to show my card. We have to sort the waste.}
  nl.a2.unit87.lesson03.teach.tijd:
    title: Today, now, always
    gloss: today / now / always
    note: These words often appear in rules.
    example_gloss: [The swimming pool is open today., I am at the gym now., Omar is always on time.]
  nl.a2.unit87.lesson03.teach.gn_hoeven: {title: 'Hoeven: not to need to', gloss: I need not / you need not / he need not / we need not / you (pl.) need not / they need not, note: '*Hoeven* is normally used with *niet* or *geen* and *te* + infinitive. It means that something is not necessary. The forms are *ik hoef, jij hoeft, hij hoeft, wij hoeven*. After *jij* in a question the -t drops: *hoef jij*.'}
  nl.a2.unit87.lesson03.teach.gn_hoeven_niet_te: {title: Hoeven niet te + infinitive, gloss: 'You do not have to pay. Do I not have to pay today?', note: 'Use *niet te* directly before the infinitive: *Je hoeft niet te betalen.* The modal *hoeft* is second; *te* + infinitive is at the end.'}
  nl.a2.unit87.lesson03.teach.gn_hoeven_geen: {title: Niet or geen, gloss: You do not have to show your card. You do not have to show a card., note: 'After a definite object such as *je kaart*, *niet* comes after the object: *Je hoeft je kaart niet te laten zien.* With an indefinite noun, use *geen*: *Je hoeft geen kaart te laten zien.* *Te* stands before *laten zien*.'}
  nl.a2.unit87.lesson03.teach.gn_contrast: {title: 'Required, optional, forbidden', gloss: That is required. That is not necessary. That is not allowed. That is allowed., note: '*Dat moet* = required. *Dat hoeft niet* = not necessary, you can choose. *Dat mag niet* = forbidden. To say something is forbidden, use *mag niet*, not *hoeft niet*.'}
  nl.a2.unit87.lesson04.teach.kleedkamer:
    title: Pool and gym words
    gloss: the towel / the changing room / first
    note: '*Eerst* means first and often goes with a rule.'
    example_gloss: [My towel is in the changing room., 'First shower, then swim.', Lotte comes to the gym first.]
  nl.a2.unit87.lesson04.teach.gn_voorop: {title: Another word first, gloss: You may not eat here. In the pool you must shower first., note: 'You can open the sentence with a place word. The modal verb stays in second position, so the subject follows it: *Hier mag je niet eten.* The infinitive is still last.'}
  nl.a2.unit87.lesson04.teach.gn_vraagwoord: {title: Question words, gloss: 'What do I have to do? Where may I eat?', note: 'A question word comes first. Then comes the modal, then the subject, and the infinitive is last: *Wat moet ik doen?* *Waar mag ik eten?*'}
  nl.a2.unit87.lesson04.teach.scenario: {title: At the pool, gloss: 'May I swim here? Yes, you must shower first.'}
  nl.a2.unit87.lesson05.teach.nieuw:
    title: New, three, to come
    gloss: new / three / to come
    note: 'After *de* or *het* the adjective takes -e: *nieuw* becomes *nieuwe* in *de nieuwe bibliotheek*. *Boeken* is the plural of *boek*.'
    example_gloss: [The new library is nice., I borrow three books., 'Are you coming too?']
  nl.a2.unit87.lesson05.teach.reading:
    title: A message for Lotte
    gloss: Hi Lotte, I am in the new library. You have to show your card. You may borrow three books. You may not eat here and you may not call. You do not have to pay. Are you coming too?
    note: Look for what is required, what is allowed, what is forbidden and what is not necessary.
    glosses: {nieuwe: new, drie: three, boeken: books, lenen: to borrow, betalen: to pay}
  nl.a2.unit87.lesson06.teach.lotte_vraag: {title: Lotte asks, gloss: 'Lotte: Hi Omar, I am new at the gym. What do I have to do?'}
  nl.a2.unit87.lesson06.teach.omar_kaart: {title: Omar names the first rule, gloss: 'Omar: First you have to show your card.'}
  nl.a2.unit87.lesson06.teach.lotte_bellen: {title: Lotte asks permission, gloss: 'Lotte: May I call here?'}
  nl.a2.unit87.lesson06.teach.omar_buiten: {title: Omar says no, gloss: 'Omar: No, that is not allowed. You have to call outside.'}
  nl.a2.unit87.lesson06.teach.lotte_betalen: {title: Lotte asks about paying, gloss: 'Lotte: Do I have to pay today?'}
  nl.a2.unit87.lesson06.teach.omar_hoeft: {title: Omar answers, gloss: 'Omar: No, you do not have to pay today.'}
exercises:
  nl.a2.unit87.lesson01.exercise01.choose_eat:
    instruction: Choose the Dutch question.
    correct_option: Mag ik hier eten?
    distractors: ['Mag eten ik hier?', 'Ik hier mag eten?', 'Mag hier ik eten?']
    accepted_answers:
    - {value: 'Mag ik hier eten?', status: correct}
    feedback: In a yes/no question the modal *mag* comes first and the infinitive *eten* stands at the end.
  nl.a2.unit87.lesson01.exercise02.choose_no:
    instruction: Choose the Dutch answer.
    correct_option: Nee, dat mag niet.
    distractors: ['Ja, dat mag.', 'Nee, dat mag.', 'Nee, dat niet mag.']
    accepted_answers:
    - {value: 'Nee, dat mag niet.', status: correct}
    feedback: '*Nee, dat mag niet* is the short answer for not allowed.'
  nl.a2.unit87.lesson01.exercise03.match_words:
    instruction: Match each Dutch word to its English meaning.
    accepted_answers:
    - value:
      - {left: zwemmen, right: to swim}
      - {left: eten, right: to eat}
      - {left: bellen, right: to call}
      - {left: roken, right: to smoke}
      - {left: lenen, right: to borrow}
      - {left: de bibliotheek, right: the library}
      - {left: het zwembad, right: the swimming pool}
      - {left: de sportschool, right: the gym}
      status: correct
    feedback: These words are the building blocks for asking permission.
  nl.a2.unit87.lesson01.exercise04.order_swim:
    instruction: Put the words in order to say 'I may swim here.'
    correct_option: Ik mag hier zwemmen
    accepted_answers:
    - {value: Ik mag hier zwemmen, status: correct}
    - {value: Hier mag ik zwemmen, status: correct}
    feedback: '*Ik mag hier zwemmen*: the modal is second and the infinitive is last. *Hier mag ik zwemmen* is also correct.'
  nl.a2.unit87.lesson01.exercise05.complete_mogen:
    instruction: 'Complete with the correct form of mogen: We are allowed to swim here.'
    correct_option: mogen
    accepted_answers:
    - {value: mogen, status: correct}
    feedback: With *wij* the plural form is *mogen*.
  nl.a2.unit87.lesson01.exercise06.translate_smoke:
    instruction: Translate into Dutch.
    accepted_answers:
    - {value: 'Mag ik hier roken?', status: correct}
    - {value: Mag ik hier roken, status: correct}
    feedback: '*Mag ik hier roken?* The infinitive *roken* is last.'
  nl.a2.unit87.lesson01.exercise07.write_call:
    instruction: Write the requested question using mag.
    correct_option: Mag ik hier bellen?
    accepted_answers:
    - {value: 'Mag ik hier bellen?', status: correct}
    - {value: Mag ik hier bellen, status: correct}
    feedback: '*Mag ik hier bellen?* = May I call here?'
  nl.a2.unit87.lesson02.exercise01.choose_card:
    instruction: Choose the Dutch statement.
    correct_option: Je moet je kaart laten zien.
    distractors: [Je moet laten zien je kaart., Je laten zien moet je kaart., Je moeten je kaart laten zien.]
    accepted_answers:
    - {value: Je moet je kaart laten zien., status: correct}
    feedback: The modal *moet* is second, and *laten zien* stands at the end.
  nl.a2.unit87.lesson02.exercise02.choose_waste:
    instruction: Choose the Dutch sentence.
    correct_option: Wij moeten het afval scheiden.
    distractors: [Wij moet het afval scheiden., Wij moeten scheiden het afval., Wij mogen het afval scheiden.]
    accepted_answers:
    - {value: Wij moeten het afval scheiden., status: correct}
    feedback: With *wij* the form is *moeten*, and the infinitive *scheiden* is last.
  nl.a2.unit87.lesson02.exercise03.match_words:
    instruction: Match each Dutch word to its English meaning.
    accepted_answers:
    - value:
      - {left: de kaart, right: the card}
      - {left: de regel, right: the rule}
      - {left: de huisregels, right: the house rules}
      - {left: het afval, right: the waste}
      - {left: het papier, right: the paper}
      - {left: het glas, right: the glass}
      - {left: betalen, right: to pay}
      - {left: scheiden, right: to separate (sort)}
      - {left: douchen, right: to shower}
      status: correct
    feedback: These words belong to house rules and waste sorting.
  nl.a2.unit87.lesson02.exercise04.order_card:
    instruction: Put the words in order to say 'You have to show your card.'
    correct_option: Je moet je kaart laten zien
    accepted_answers:
    - {value: Je moet je kaart laten zien, status: correct}
    - {value: Je kaart moet je laten zien, status: correct}
    feedback: '*Je moet je kaart laten zien.* *Je kaart moet je laten zien* is also correct.'
  nl.a2.unit87.lesson02.exercise05.complete_moeten:
    instruction: 'Complete with the correct form of moeten: I have to show my card.'
    correct_option: moet
    accepted_answers:
    - {value: moet, status: correct}
    feedback: With *ik* the form is *moet*.
  nl.a2.unit87.lesson02.exercise06.translate_pay:
    instruction: Translate into Dutch.
    accepted_answers:
    - {value: Ik moet betalen., status: correct}
    - {value: Ik moet betalen, status: correct}
    feedback: '*Ik moet betalen.*'
  nl.a2.unit87.lesson02.exercise07.write_pay_q:
    instruction: Write the requested question using moet.
    correct_option: Moet ik betalen?
    accepted_answers:
    - {value: 'Moet ik betalen?', status: correct}
    - {value: Moet ik betalen, status: correct}
    feedback: '*Moet ik betalen?* = Do I have to pay?'
  nl.a2.unit87.lesson03.exercise01.choose_hoeft:
    instruction: Choose the Dutch sentence.
    correct_option: Je hoeft niet te betalen.
    distractors: [Je hoeft te niet betalen., Je hoeven niet te betalen., Je niet hoeft te betalen.]
    accepted_answers:
    - {value: Je hoeft niet te betalen., status: correct}
    feedback: The order is *hoeft niet te* + infinitive.
  nl.a2.unit87.lesson03.exercise02.choose_forbidden:
    instruction: Choose the Dutch sentence that means 'not allowed'.
    correct_option: Je mag hier niet roken.
    distractors: [Je hoeft hier niet te roken., Je moet hier roken., Je hoeft hier te roken niet.]
    accepted_answers:
    - {value: Je mag hier niet roken., status: correct}
    feedback: Not allowed = *mag niet*. *Hoeft niet te* means not necessary.
  nl.a2.unit87.lesson03.exercise03.match_meaning:
    instruction: Match each Dutch sentence to its meaning.
    accepted_answers:
    - value:
      - {left: Dat moet., right: That is required.}
      - {left: Dat hoeft niet., right: That is not necessary.}
      - {left: Dat mag niet., right: That is not allowed.}
      - {left: Dat mag., right: That is allowed.}
      - {left: Je hoeft geen kaart te laten zien., right: You do not have to show a card.}
      - {left: Je moet betalen., right: You have to pay.}
      status: correct
    feedback: Keep required, optional, forbidden and allowed apart.
  nl.a2.unit87.lesson03.exercise04.order_hoeft:
    instruction: Put the words in order to say 'You do not have to pay.'
    correct_option: Je hoeft niet te betalen
    accepted_answers:
    - {value: Je hoeft niet te betalen, status: correct}
    feedback: '*Je hoeft niet te betalen.*'
  nl.a2.unit87.lesson03.exercise05.complete_hoeft:
    instruction: 'Complete with the correct form of hoeven: You do not have to show a card.'
    correct_option: hoeft
    accepted_answers:
    - {value: hoeft, status: correct}
    feedback: With *je* the form is *hoeft*.
  nl.a2.unit87.lesson03.exercise06.translate_card:
    instruction: Translate into Dutch. Use niet after the object.
    accepted_answers:
    - {value: Je hoeft je kaart niet te laten zien., status: correct}
    - {value: Je hoeft je kaart niet te laten zien, status: correct}
    - {value: Jij hoeft je kaart niet te laten zien., status: correct}
    - {value: Jij hoeft je kaart niet te laten zien, status: correct}
    - {value: Je kaart hoef je niet te laten zien., status: correct}
    - {value: Je kaart hoef je niet te laten zien, status: correct}
    - {value: Je kaart hoef jij niet te laten zien., status: correct}
    - {value: Je kaart hoef jij niet te laten zien, status: correct}
    feedback: '*Je hoeft je kaart niet te laten zien.*'
  nl.a2.unit87.lesson03.exercise07.write_today:
    instruction: Write the requested sentence using hoeven.
    correct_option: Je hoeft vandaag niet te betalen.
    accepted_answers:
    - {value: Je hoeft vandaag niet te betalen., status: correct}
    - {value: Je hoeft vandaag niet te betalen, status: correct}
    - {value: Vandaag hoef je niet te betalen., status: correct}
    - {value: Vandaag hoef je niet te betalen, status: correct}
    feedback: '*Je hoeft vandaag niet te betalen.* The time word can also open the sentence: *Vandaag hoef je niet te betalen.*'
  nl.a2.unit87.lesson04.exercise01.choose_shower:
    instruction: Choose the Dutch sentence.
    correct_option: In het zwembad moet je eerst douchen.
    distractors: [In het zwembad je moet eerst douchen., In het zwembad moet je douchen eerst., In het zwembad mag je eerst douchen.]
    accepted_answers:
    - {value: In het zwembad moet je eerst douchen., status: correct}
    feedback: After the opening phrase the modal *moet* comes second, then *je*.
  nl.a2.unit87.lesson04.exercise02.choose_where:
    instruction: Choose the Dutch question.
    correct_option: Waar mag ik eten?
    distractors: ['Waar eten mag ik?', 'Mag waar ik eten?', 'Waar moet ik eten?']
    accepted_answers:
    - {value: 'Waar mag ik eten?', status: correct}
    feedback: The question word comes first, then the modal *mag*, then *ik*; *eten* is last.
  nl.a2.unit87.lesson04.exercise03.match_sentences:
    instruction: Match each Dutch sentence to its English meaning.
    accepted_answers:
    - value:
      - {left: In het zwembad moet je eerst douchen., right: In the pool you must shower first.}
      - {left: Hier mag je niet eten., right: You may not eat here.}
      - {left: 'Wat moet ik doen?', right: 'What do I have to do?'}
      - {left: 'Waar mag ik eten?', right: 'Where may I eat?'}
      - {left: Je hoeft niet te betalen., right: You do not have to pay.}
      - {left: 'Moet ik betalen?', right: 'Do I have to pay?'}
      - {left: 'Mag ik hier bellen?', right: 'May I call here?'}
      status: correct
    feedback: Each sentence has one meaning.
  nl.a2.unit87.lesson04.exercise04.order_here:
    instruction: Put the words in order to say 'You may not eat here.'
    correct_option: Hier mag je niet eten
    accepted_answers:
    - {value: Hier mag je niet eten, status: correct}
    - {value: Je mag hier niet eten, status: correct}
    feedback: '*Hier mag je niet eten* or *Je mag hier niet eten*. The modal is always second.'
  nl.a2.unit87.lesson04.exercise05.complete_waste:
