teaching:
  nl.c1.unit08.lesson01.teach.retorische_vraag: {title: "The rhetorical question", gloss: "question for effect", note: "A *retorische vraag* is a question asked for effect, not to get an answer.", example_gloss: "Who wouldn't want clean air?"}
  nl.c1.unit08.lesson01.teach.parallellisme: {title: "Parallelism", gloss: "parallel structure", note: "*Parallellisme* repeats the same structure to give a sentence rhythm.", example_gloss: "More green, more air, more calm."}
  nl.c1.unit08.lesson01.teach.nadruk: {title: "Emphasis", gloss: "stress", note: "*Nadruk leggen op* means to put emphasis on something.", example_gloss: "I put the emphasis on the green."}
  nl.c1.unit08.lesson01.teach.appel: {title: "The appeal", gloss: "appeal", note: "An *appèl* is a direct call on the audience to act.", example_gloss: "Omar makes an appeal to the neighborhood."}
  nl.c1.unit08.lesson01.teach.beroep: {title: "To appeal to", gloss: "to call upon", note: "*Een beroep doen op* is the natural way to call upon someone to do something."}
  nl.c1.unit08.lesson01.teach.overtuigen: {title: "To persuade", gloss: "persuade", note: "*Overtuigen* means to persuade or convince.", example_gloss: "Omar wants to persuade the neighborhood."}
  nl.c1.unit08.lesson01.teach.scenario: {title: "The scenario", gloss: "the last green strip", note: "The municipality wants to turn the neighborhood's last *groenstrook* into a *parkeerterrein*. Omar must persuade the *buurt* to keep it green, using a rhetorical question, parallelism, emphasis, and an appeal."}
  nl.c1.unit08.lesson02.teach.vraag_zin: {title: "The rhetorical question", gloss: "a question that moves", note: "*Wie wil er nu dat ... verdwijnt?* needs no answer — it moves the listener."}
  nl.c1.unit08.lesson02.teach.parallellisme_zin: {title: "The parallel triad", gloss: "rhythm through repetition", note: "*Meer ... meer ... meer* builds a three-part parallel structure."}
  nl.c1.unit08.lesson02.teach.nadruk_zin: {title: "The emphasized reason", gloss: "the decisive point", note: "*Juist daarom* foregrounds the reason as the decisive point."}
  nl.c1.unit08.lesson02.teach.appel_zin: {title: "The appeal", gloss: "call to action", note: "*Ik doe een beroep op u* addresses the audience directly and calls on them to act."}
  nl.c1.unit08.lesson02.teach.toespraak_note: {title: "How the devices move the listener", gloss: "device by device", note: "Each device does one job: the question engages, parallelism gives rhythm, *nadruk* strengthens, and the *appèl* calls for action."}
  nl.c1.unit08.lesson03.teach.oproep: {title: "The call to action", gloss: "appeal", note: "The *oproep* is the closing call that asks the audience to do something.", example_gloss: "The text ends with a call to action."}
  nl.c1.unit08.lesson03.teach.steun: {title: "Support", gloss: "backing", note: "*Steun verdienen* means to deserve support.", example_gloss: "The green strip deserves our support."}
  nl.c1.unit08.lesson03.teach.frisse_lucht: {title: "Fresh air", gloss: "clean air", note: "*Frisse lucht* is fresh, clean air."}
  nl.c1.unit08.lesson03.teach.leestekst: {title: "Read the persuasive text", gloss: "identify the devices", note: "Read the text and find the *retorische vraag*, the *parallellisme*, the *nadruk*, and the *oproep* at the end."}
  nl.c1.unit08.lesson03.teach.lees_note: {title: "Same devices in writing", gloss: "writing = speaking", note: "A persuasive *tekst* uses the same devices as a speech; the *oproep* at the end is its goal."}
  nl.c1.unit08.lesson04.teach.verzachten: {title: "To soften", gloss: "tone down", note: "*Verzachten* means to soften or tone down your claim.", example_gloss: "With 'maybe' you soften your message."}
  nl.c1.unit08.lesson04.teach.misschien_zin: {title: "A softened claim", gloss: "hedged with doubt", note: "*Misschien* softens a claim by adding doubt."}
  nl.c1.unit08.lesson04.teach.sterker_nog: {title: "An intensified claim", gloss: "going further", note: "*Sterker nog* pushes the claim further and makes it stronger."}
  nl.c1.unit08.lesson04.teach.wel_degelijk: {title: "An emphatic assertion", gloss: "truly the case", note: "*Wel degelijk* insists that something really is the case."}
  nl.c1.unit08.lesson04.teach.intensiteit_note: {title: "Modulate intensity", gloss: "soften or strengthen", note: "Soften with *misschien* and *wellicht*; strengthen with *juist*, *sterker nog*, and *wel degelijk*."}
  nl.c1.unit08.lesson05.teach.drievoud: {title: "The parallel triad", gloss: "three in a row", note: "*Meer groen, meer lucht, meer rust* — three parallel phrases give rhythm."}
  nl.c1.unit08.lesson05.teach.niet_alleen: {title: "Not only ... but also", gloss: "broaden the appeal", note: "*Niet alleen ... maar ook* widens the appeal to include everyone."}
  nl.c1.unit08.lesson05.teach.daarom_oproep: {title: "The reasoned call", gloss: "therefore, vote", note: "*Daarom vraag ik u* ties the call to action back to the reasoning."}
  nl.c1.unit08.lesson05.teach.samen_maken: {title: "Let us together", gloss: "shared action", note: "*Laten we samen ...* invites the audience to act together."}
  nl.c1.unit08.lesson05.teach.opbouw_note: {title: "Build the appeal", gloss: "rhythm, emphasis, call", note: "Build the appeal in order: parallelism gives rhythm, *nadruk* strengthens, and the *oproep* asks the audience to act."}
  nl.c1.unit08.lesson06.teach.volledig_appel: {title: "The full appeal", gloss: "Omar's speech to the neighborhood", note: "Omar delivers the complete appeal: a *retorische vraag*, a parallel triad, an emphasized reason, and a direct call to action."}
exercises:
  nl.c1.unit08.lesson01.exercise01.herken_vraag: {instruction: "What does *de retorische vraag* mean?", correct_option: "A question asked for effect, not for an answer.", distractors: ["A question you ask yourself alone.", "A question about grammar.", "A question that needs a yes or no."], accepted_answers: [{value: "A question asked for effect, not for an answer.", status: correct}], feedback: "A *retorische vraag* is asked for effect — the audience is not expected to answer."}
  nl.c1.unit08.lesson01.exercise02.herken_parallellisme: {instruction: "What does *Meer groen, meer lucht, meer rust* illustrate?", correct_option: "Parallelism — the same structure repeated.", distractors: ["A rhetorical question.", "An appeal to the audience.", "A direct order."], accepted_answers: [{value: "Parallelism — the same structure repeated.", status: correct}], feedback: "The repeated *meer ...* structure is *parallellisme*."}
  nl.c1.unit08.lesson01.exercise03.koppel_middelen: {instruction: "Match each Dutch rhetorical device to its meaning.", pairs: [{left: "de retorische vraag", right: "a question asked for effect, not for an answer"}, {left: "het parallellisme", right: "repeating the same structure for rhythm"}, {left: "de nadruk", right: "special stress on a word or idea"}, {left: "het appèl", right: "a direct call on the audience to act"}, {left: "een beroep doen op", right: "to call upon someone to do something"}, {left: overtuigen, right: "to persuade"}], accepted_answers: [{value: [{left: "de retorische vraag", right: "a question asked for effect, not for an answer"}, {left: "het parallellisme", right: "repeating the same structure for rhythm"}, {left: "de nadruk", right: "special stress on a word or idea"}, {left: "het appèl", right: "a direct call on the audience to act"}, {left: "een beroep doen op", right: "to call upon someone to do something"}, {left: overtuigen, right: "to persuade"}], status: correct}], feedback: "These are the four devices of persuasion."}
  nl.c1.unit08.lesson01.exercise04.orden_nadruk: {instruction: "Order: Ik + leg + de + nadruk + op + het + groen.", accepted_answers: [{value: "Ik leg de nadruk op het groen", status: correct}], feedback: "*Nadruk leggen op* = to emphasize."}
  nl.c1.unit08.lesson01.exercise05.vertaal_overtuigen: {instruction: "Translate: Omar wants to persuade the neighbourhood to keep the green.", accepted_answers: [{value: "Omar wil de buurt overtuigen om het groen te houden", status: correct}, {value: "Omar wil de buurt overtuigen het groen te houden", status: correct}, {value: "Omar wil de buurt ervan overtuigen om het groen te houden", status: correct}, {value: "Omar wil de buurt ervan overtuigen het groen te houden", status: correct}], feedback: "*Overtuigen* is followed by an *om ... te* clause: *Omar wil de buurt overtuigen om het groen te houden.* (Without *om*, or with *ervan*, is also fine.)"}
  nl.c1.unit08.lesson01.exercise06.spreek_appel: {instruction: "Say in Dutch, in one sentence: The municipality wants to turn the last green strip into a parking lot (het parkeerterrein). (Use *van ... maken*.)", accepted_answers: [{value: "De gemeente wil van de laatste groenstrook een parkeerterrein maken", status: correct}, {value: "De gemeente wil een parkeerterrein van de laatste groenstrook maken", status: correct}], feedback: "With a modal the main verb goes to the end: *De gemeente wil van de laatste groenstrook een parkeerterrein maken.* (*... een parkeerterrein van de laatste groenstrook maken* is also fine.)"}
  nl.c1.unit08.lesson01.exercise07.schrijf_nadruk: {instruction: "Write in Dutch: I put the emphasis not on the parking lot (het parkeerterrein) but on the green. (Use *niet ... maar ...*.)", accepted_answers: [{value: "Ik leg de nadruk niet op het parkeerterrein maar op het groen", status: correct}, {value: "Ik leg niet de nadruk op het parkeerterrein maar op het groen", status: correct}], feedback: "*Niet ... maar ...* sets one thing against another: *Ik leg de nadruk niet op het parkeerterrein maar op het groen.* (*Ik leg niet de nadruk ...* is also fine.)"}
  nl.c1.unit08.lesson02.exercise01.luister_toespraak: {instruction: "Listen. Which device does Omar use to open the appeal?", correct_option: "A rhetorical question.", distractors: ["A parallel list of three.", "A direct order.", "A list of statistics."], accepted_answers: [{value: "A rhetorical question.", status: correct}], feedback: "The appeal opens with *Wie wil er nu dat ...?* — a rhetorical question."}
  nl.c1.unit08.lesson02.exercise02.herken_vraag_zin: {instruction: "What does *Wie wil er nu dat het laatste groen uit de buurt verdwijnt?* mean?", correct_option: "Who would want the last green to disappear from the neighborhood?", distractors: ["Who removed the last green yesterday?", "Where is the last green located?", "Why did the green disappear?"], accepted_answers: [{value: "Who would want the last green to disappear from the neighborhood?", status: correct}], feedback: "The *retorische vraag* means: no one would want that — so we must act."}
  nl.c1.unit08.lesson02.exercise03.koppel_toespraak: {instruction: "Match each phrase from the appeal to its meaning.", pairs: [{left: "het laatste groen", right: "the last remaining green"}, {left: "uit de buurt verdwijnt", right: "disappears from the neighborhood"}, {left: "meer lucht", right: "more air"}, {left: "meer rust", right: "more calm"}, {left: "plek om te spelen", right: "a place to play"}, {left: "juist daarom", right: "precisely for that reason"}, {left: "niet opgeven", right: "not give up"}, {left: "een beroep op u", right: "an appeal to you"}], accepted_answers: [{value: [{left: "het laatste groen", right: "the last remaining green"}, {left: "uit de buurt verdwijnt", right: "disappears from the neighborhood"}, {left: "meer lucht", right: "more air"}, {left: "meer rust", right: "more calm"}, {left: "plek om te spelen", right: "a place to play"}, {left: "juist daarom", right: "precisely for that reason"}, {left: "niet opgeven", right: "not give up"}, {left: "een beroep op u", right: "an appeal to you"}], status: correct}], feedback: "Each phrase is one beat of the persuasive appeal."}
  nl.c1.unit08.lesson02.exercise04.orden_nadruk_zin: {instruction: "Order: Juist + daarom + mogen + we + dit + terrein + niet + opgeven.", accepted_answers: [{value: "Juist daarom mogen we dit terrein niet opgeven", status: correct}], feedback: "*Juist daarom* = precisely for that reason."}
  nl.c1.unit08.lesson02.exercise05.vertaal_parallellisme: {instruction: "Translate: More green means more air, more calm, and more space to play. Use Meer groen betekent ...", accepted_answers: [{value: "Meer groen betekent meer lucht, meer rust en meer plek om te spelen.", status: correct}], feedback: "The *meer ... meer ... meer* triad is *parallellisme*."}
  nl.c1.unit08.lesson02.exercise06.spreek_beroep: {instruction: "Say in Dutch: I appeal to everyone. (Use *een beroep doen op*.)", accepted_answers: [{value: "Ik doe een beroep op iedereen", status: correct}, {value: "Ik wil een beroep doen op iedereen", status: correct}, {value: "Ik wil een beroep op iedereen doen", status: correct}], feedback: "*Een beroep doen op* = to appeal to: *Ik doe een beroep op iedereen.* (With *wil*, the infinitive goes to the end: *Ik wil een beroep op iedereen doen.*)"}
  nl.c1.unit08.lesson02.exercise07.schrijf_vraag: {instruction: "Rewrite this plain claim as a rhetorical question with *Wie wil er nu ...*: *Niemand wil dat de gemeente van het groen een parkeerterrein maakt.*", accepted_answers: [{value: "Wie wil er nu dat de gemeente van het groen een parkeerterrein maakt", status: correct}, {value: "Wie wil er nu dat de gemeente een parkeerterrein van het groen maakt", status: correct}], feedback: "A rhetorical question turns the flat claim around: *Wie wil er nu dat de gemeente van het groen een parkeerterrein maakt?* (*... een parkeerterrein van het groen maakt* is also fine.)"}
  nl.c1.unit08.lesson03.exercise01.lees_vraag: {instruction: "In the text, which sentence is the rhetorical question?", correct_option: "Wie wil er nu dat het laatste stukje groen verdwijnt?", distractors: ["De buurt heeft steeds minder ruimte.", "Een groenstrook is niet alleen mooi.", "Stem voor het behoud van het groen."], accepted_answers: [{value: "Wie wil er nu dat het laatste stukje groen verdwijnt?", status: correct}], feedback: "The question *Wie wil er nu ...?* expects no answer — it is the rhetorical device."}
  nl.c1.unit08.lesson03.exercise02.lees_oproep: {instruction: "What is the text's central call to action?", correct_option: "Come to the neighborhood meeting and vote to preserve the green.", distractors: ["To admire the green strip.", "To measure the fresh air.", "To describe the children's games."], accepted_answers: [{value: "Come to the neighborhood meeting and vote to preserve the green.", status: correct}], feedback: "The *oproep* — come to the meeting and vote — is the goal of the text."}
  nl.c1.unit08.lesson03.exercise03.koppel_tekst: {instruction: "Match each phrase from the text to its meaning.", pairs: [{left: "de oproep", right: "the call to action"}, {left: "eindigt met", right: "ends with"}, {left: "onze steun", right: "our support"}, {left: "frisse lucht", right: "fresh air"}, {left: "een plek waar kinderen spelen", right: "a place where children play"}, {left: "het behoud", right: "the preservation"}, {left: "stem voor", right: "vote for"}], accepted_answers: [{value: [{left: "de oproep", right: "the call to action"}, {left: "eindigt met", right: "ends with"}, {left: "onze steun", right: "our support"}, {left: "frisse lucht", right: "fresh air"}, {left: "een plek waar kinderen spelen", right: "a place where children play"}, {left: "het behoud", right: "the preservation"}, {left: "stem voor", right: "vote for"}], status: correct}], feedback: "These phrases carry the text's argument and its call to action."}
  nl.c1.unit08.lesson03.exercise04.orden_steun: {instruction: "Order: De + groenstrook + verdient + onze + steun.", accepted_answers: [{value: "De groenstrook verdient onze steun", status: correct}], feedback: "*Steun verdienen* = to deserve support."}
  nl.c1.unit08.lesson03.exercise05.vertaal_oproep: {instruction: "Translate: The speech ends with a call to the residents. (Use *oproep aan*.)", accepted_answers: [{value: "De toespraak eindigt met een oproep aan de bewoners", status: correct}, {value: "De toespraak sluit af met een oproep aan de bewoners", status: correct}], feedback: "*Een oproep aan* = a call to: *De toespraak eindigt met een oproep aan de bewoners.* (*sluit af met* is also fine.)"}
  nl.c1.unit08.lesson03.exercise06.spreek_steun: {instruction: "Say in Dutch, using *niet alleen ... maar ook ...*: The green strip is not only beautiful, but also provides fresh air. (Use *zorgen voor* for \"provides\".)", accepted_answers: [{value: "De groenstrook is niet alleen mooi, maar zorgt ook voor frisse lucht", status: correct}, {value: "De groenstrook is niet alleen mooi, maar hij zorgt ook voor frisse lucht", status: correct}, {value: "De groenstrook is niet alleen mooi, maar ze zorgt ook voor frisse lucht", status: correct}, {value: "De groenstrook is niet alleen mooi, maar die zorgt ook voor frisse lucht", status: correct}], feedback: "*Niet alleen ... maar ook ...* joins two qualities: *De groenstrook is niet alleen mooi, maar zorgt ook voor frisse lucht.* (With *hij*, *ze* or *die* before *zorgt* is also fine.)"}
  nl.c1.unit08.lesson03.exercise07.schrijf_oproep: {instruction: "Join the two sentences into one that begins with *Juist omdat ...*: *De groenstrook zorgt voor frisse lucht.* *De groenstrook verdient onze steun.* (Reason first, then the claim.)", accepted_answers: [{value: "Juist omdat de groenstrook voor frisse lucht zorgt, verdient hij onze steun", status: correct}, {value: "Juist omdat de groenstrook voor frisse lucht zorgt, verdient ze onze steun", status: correct}, {value: "Juist omdat de groenstrook voor frisse lucht zorgt, verdient de groenstrook onze steun", status: correct}, {value: "Juist omdat de groenstrook zorgt voor frisse lucht, verdient hij onze steun", status: correct}, {value: "Juist omdat de groenstrook zorgt voor frisse lucht, verdient ze onze steun", status: correct}, {value: "Juist omdat de groenstrook zorgt voor frisse lucht, verdient de groenstrook onze steun", status: correct}], feedback: "After *omdat* the verb goes to the end; the main clause then starts with its verb: *Juist omdat de groenstrook voor frisse lucht zorgt, verdient hij onze steun.* (*hij*, *ze* or *de groenstrook*, and *zorgt voor* in the omdat-clause, are also fine.)"}
  nl.c1.unit08.lesson04.exercise01.herken_verzachten: {instruction: "What does *verzachten* mean?", correct_option: "To soften or tone down.", distractors: ["To make louder.", "To translate.", "To repeat."], accepted_answers: [{value: "To soften or tone down.", status: correct}], feedback: "*Verzachten* = to soften."}
  nl.c1.unit08.lesson04.exercise02.herken_sterker: {instruction: "What does *Sterker nog: zonder groen wordt de buurt ongezonder* do?", correct_option: "It intensifies the argument by going further.", distractors: ["It softens the argument with doubt.", "It asks a rhetorical question.", "It ends the argument politely."], accepted_answers: [{value: "It intensifies the argument by going further.", status: correct}], feedback: "*Sterker nog* pushes the point further and makes it stronger."}
  nl.c1.unit08.lesson04.exercise03.koppel_intensiteit: {instruction: "Match each phrase to how it steers the argument.", pairs: [{left: verzachten, right: "to soften or tone down"}, {left: misschien, right: "softens a claim with doubt"}, {left: "sterker nog", right: "intensifies by going further"}, {left: "wel degelijk", right: "asserts something is truly the case"}, {left: "van waarde", right: "of value"}, {left: "zonder groen", right: "without green"}, {left: ongezonder, right: "less healthy"}], accepted_answers: [{value: [{left: verzachten, right: "to soften or tone down"}, {left: misschien, right: "softens a claim with doubt"}, {left: "sterker nog", right: "intensifies by going further"}, {left: "wel degelijk", right: "asserts something is truly the case"}, {left: "van waarde", right: "of value"}, {left: "zonder groen", right: "without green"}, {left: ongezonder, right: "less healthy"}], status: correct}], feedback: "Softening and intensifying are two ways to steer the argument's strength."}
  nl.c1.unit08.lesson04.exercise04.orden_misschien: {instruction: "Order: Misschien + is + het + niet + de + beste + plek.", accepted_answers: [{value: "Misschien is het niet de beste plek", status: correct}], feedback: "*Misschien* softens the claim."}
  nl.c1.unit08.lesson04.exercise05.vertaal_sterker: {instruction: "Translate: Even stronger: without green the neighborhood becomes less healthy. Use Sterker nog: ...", accepted_answers: [{value: "Sterker nog: zonder groen wordt de buurt ongezonder.", status: correct}], feedback: "*Sterker nog* intensifies the argument."}
  nl.c1.unit08.lesson04.exercise06.spreek_wel_degelijk: {instruction: "Someone says: *Het groen heeft geen waarde.* Contradict them firmly in one sentence with *wel degelijk*, using *waarde*.", accepted_answers: [{value: "Het groen is wel degelijk van waarde", status: correct}, {value: "Het groen heeft wel degelijk waarde", status: correct}, {value: "Het is wel degelijk van waarde", status: correct}, {value: "Het heeft wel degelijk waarde", status: correct}], feedback: "*Wel degelijk* insists the opposite is true: *Het groen is wel degelijk van waarde.* (*Het groen heeft wel degelijk waarde* is also fine.)"}
  nl.c1.unit08.lesson04.exercise07.schrijf_misschien: {instruction: "Soften this claim with *misschien*: This is not the best place for a parking lot (het parkeerterrein). (Use *plek voor*.)", accepted_answers: [{value: "Misschien is dit niet de beste plek voor een parkeerterrein", status: correct}, {value: "Misschien is het niet de beste plek voor een parkeerterrein", status: correct}, {value: "Dit is misschien niet de beste plek voor een parkeerterrein", status: correct}, {value: "Het is misschien niet de beste plek voor een parkeerterrein", status: correct}], feedback: "*Misschien* softens the claim; at the start it pushes the verb into second place: *Misschien is dit niet de beste plek voor een parkeerterrein.* (*dit/het* and *misschien* after the verb are also fine.)"}
  nl.c1.unit08.lesson05.exercise01.herken_drievoud: {instruction: "What is *Meer groen, meer lucht, meer rust*?", correct_option: "A parallel triad.", distractors: ["A rhetorical question.", "A single command.", "A formal greeting."], accepted_answers: [{value: "A parallel triad.", status: correct}], feedback: "Three parallel *meer ...* phrases form a triad."}
  nl.c1.unit08.lesson05.exercise02.herken_oproep: {instruction: "What does *Laten we samen van dit terrein een plek voor iedereen maken* ask the audience to do?", correct_option: "Act together to make the plot a place for everyone.", distractors: ["Leave the plot empty.", "Measure the plot.", "Sell the plot."], accepted_answers: [{value: "Act together to make the plot a place for everyone.", status: correct}], feedback: "The *oproep* asks the audience to act together."}
  nl.c1.unit08.lesson05.exercise03.koppel_opbouw: {instruction: "Match each building block of the appeal to its meaning.", pairs: [{left: "meer groen", right: "more green"}, {left: "meer lucht", right: "more air"}, {left: "meer rust", right: "more calm"}, {left: "niet alleen ... maar ook", right: "not only ... but also"}, {left: "daarom vraag ik u", right: "that is why I ask you"}, {left: "stem voor het groen", right: "vote for the green"}, {left: "samen ... maken", right: "together ... make"}, {left: "een plek voor iedereen", right: "a place for everyone"}], accepted_answers: [{value: [{left: "meer groen", right: "more green"}, {left: "meer lucht", right: "more air"}, {left: "meer rust", right: "more calm"}, {left: "niet alleen ... maar ook", right: "not only ... but also"}, {left: "daarom vraag ik u", right: "that is why I ask you"}, {left: "stem voor het groen", right: "vote for the green"}, {left: "samen ... maken", right: "together ... make"}, {left: "een plek voor iedereen", right: "a place for everyone"}], status: correct}], feedback: "These blocks build the appeal: rhythm, breadth, reason, and shared action."}
  nl.c1.unit08.lesson05.exercise04.orden_niet_alleen: {instruction: "Order: Niet + alleen + voor + onze + kinderen + maar + ook + voor + ons + allemaal.", accepted_answers: [{value: "Niet alleen voor onze kinderen maar ook voor ons allemaal", status: correct}], feedback: "*Niet alleen ... maar ook* = not only ... but also."}
  nl.c1.unit08.lesson05.exercise05.vertaal_daarom: {instruction: "Translate: That is why I ask you: vote for the green. Use Daarom vraag ik u: ...", accepted_answers: [{value: "Daarom vraag ik u: stem voor het groen.", status: correct}], feedback: "*Daarom vraag ik u* ties the call to the reasoning."}
  nl.c1.unit08.lesson05.exercise06.spreek_samen: {instruction: "Turn this statement into an invitation that begins with *Laten we ...*: *We maken samen een plek voor iedereen.*", accepted_answers: [{value: "Laten we samen een plek voor iedereen maken", status: correct}, {value: "Laten we een plek voor iedereen samen maken", status: correct}, {value: "Laten wij samen een plek voor iedereen maken", status: correct}, {value: "Laten wij een plek voor iedereen samen maken", status: correct}], feedback: "After *Laten we* the main verb goes to the end: *Laten we samen een plek voor iedereen maken.*"}
  nl.c1.unit08.lesson05.exercise07.schrijf_drievoud: {instruction: "Write in Dutch, starting with *Daarom vraag ik u:* That is why I ask you: come to the neighborhood meeting and vote for the green.", accepted_answers: [{value: "Daarom vraag ik u: kom naar de buurtbijeenkomst en stem voor het groen", status: correct}, {value: "Daarom vraag ik u: kom naar de buurtbijeenkomst en stem voor het behoud van het groen", status: correct}], feedback: "*Daarom vraag ik u:* introduces the call, and the two imperatives follow: *Daarom vraag ik u: kom naar de buurtbijeenkomst en stem voor het groen.*"}
  nl.c1.unit08.lesson06.exercise01.luister_appel: {instruction: "Listen. Which device closes the appeal?", correct_option: "A call to action.", distractors: ["A rhetorical question.", "A parallel list.", "A greeting."], accepted_answers: [{value: "A call to action.", status: correct}], feedback: "The appeal closes with *Ik doe een beroep op u* — a call to action."}
  nl.c1.unit08.lesson06.exercise02.lees_appel: {instruction: "In the appeal, which sentence is the direct call to action?", correct_option: "Ik doe een beroep op u: laten we samen van dit terrein een plek voor iedereen maken.", distractors: ["Wie wil er nu dat het laatste groen uit de buurt verdwijnt?", "Meer groen betekent meer lucht, meer rust en meer plek om te spelen.", "Juist daarom mogen we dit terrein niet opgeven."], accepted_answers: [{value: "Ik doe een beroep op u: laten we samen van dit terrein een plek voor iedereen maken.", status: correct}], feedback: "The sentence with *een beroep op u* is the direct call to action."}
  nl.c1.unit08.lesson06.exercise03.koppel_appel: {instruction: "Match each phrase from the full appeal to its meaning.", pairs: [{left: "wie wil er nu", right: "who would want to now"}, {left: "het laatste groen", right: "the last remaining green"}, {left: "verdwijnt", right: "disappears"}, {left: "meer rust", right: "more calm"}, {left: "plek om te spelen", right: "a place to play"}, {left: "juist daarom", right: "precisely for that reason"}, {left: "niet opgeven", right: "not give up"}, {left: "een beroep op u", right: "an appeal to you"}], accepted_answers: [{value: [{left: "wie wil er nu", right: "who would want to now"}, {left: "het laatste groen", right: "the last remaining green"}, {left: "verdwijnt", right: "disappears"}, {left: "meer rust", right: "more calm"}, {left: "plek om te spelen", right: "a place to play"}, {left: "juist daarom", right: "precisely for that reason"}, {left: "niet opgeven", right: "not give up"}, {left: "een beroep op u", right: "an appeal to you"}], status: correct}], feedback: "These phrases hold the appeal together."}
  nl.c1.unit08.lesson06.exercise04.orden_kern: {instruction: "Order: Meer + groen + betekent + meer + lucht + meer + rust + en + meer + plek + om + te + spelen.", accepted_answers: [{value: "Meer groen betekent meer lucht meer rust en meer plek om te spelen", status: correct}], feedback: "This parallel triad is the heart of the appeal."}
  nl.c1.unit08.lesson06.exercise05.spreek_appel_vol: {instruction: "Say in Dutch, with *niet alleen ... maar ook ...*: The green gives us not only air, but also calm.", accepted_answers: [{value: "Het groen geeft ons niet alleen lucht, maar ook rust", status: correct}, {value: "Het groen geeft niet alleen lucht, maar ook rust", status: correct}], feedback: "The finite verb stays in second place: *Het groen geeft ons niet alleen lucht, maar ook rust.* (Without *ons* is also fine.)"}
  nl.c1.unit08.lesson06.exercise06.schrijf_appel_vol: {instruction: "Rewrite as an *Als ...* sentence with *is er* in both halves: *Minder groen betekent minder lucht.*", accepted_answers: [{value: "Als er minder groen is, is er minder lucht", status: correct}, {value: "Als er minder groen is, dan is er minder lucht", status: correct}, {value: "Als er minder groen is, is er ook minder lucht", status: correct}, {value: "Als er minder groen is, dan is er ook minder lucht", status: correct}], feedback: "After an *als*-clause the verb comes first in the main clause: *Als er minder groen is, is er minder lucht.* (*dan* and *ook* are optional.)"}
  nl.c1.unit08.lesson06.exercise07.dictaat_kern: {instruction: "Type exactly what you hear.", correct_response: "Meer groen betekent meer lucht, meer rust en meer plek om te spelen.", orthography_strict: true, feedback: "The parallel triad is the heart of the appeal."}
