course:
  title: "Dutch A1"
  description: "Beginner Dutch for understanding, asking, saying, reading, and writing simple calendar dates."

units:
  nl.a1.unit03.calendar_dates: {title: "Days and dates"}

lessons:
  nl.a1.unit03.lesson01.weekdagen: {title: "Days of the week"}
  nl.a1.unit03.lesson02.maanden: {title: "Months of the year"}
  nl.a1.unit03.lesson03.rangtelwoorden: {title: "Ordinal numbers in dates"}
  nl.a1.unit03.lesson04.datum_vragen: {title: "Asking for the date"}
  nl.a1.unit03.lesson05.bibliotheekdatum: {title: "A library due date"}
  nl.a1.unit03.lesson06.taalcafe_afspraak: {title: "The language-café date"}

teaching:
  nl.a1.unit03.lesson01.teach.maandag_tot_woensdag: {title: "Monday to Wednesday", gloss: "Monday, Tuesday, Wednesday", note: "Dutch weekday names normally begin with a lowercase letter, unlike English.", example_gloss: ["Today is Monday.", "Today is Tuesday.", "Today is Wednesday."]}
  nl.a1.unit03.lesson01.teach.donderdag_vrijdag: {title: "Thursday, Friday", gloss: "Thursday, Friday", note: "Donderdag and vrijdag continue the weekday sequence, still lowercase.", example_gloss: ["Today is Thursday.", "The language café is on Friday."]}
  nl.a1.unit03.lesson01.teach.zaterdag_zondag: {title: "Saturday, Sunday", gloss: "Saturday, Sunday", note: "Zaterdag and zondag are the weekend days.", example_gloss: ["Today is Saturday.", "Today is Sunday."]}
  nl.a1.unit03.lesson01.teach.ask_day: {title: "Ask which weekday it is", gloss: "What day is it today?", note: "Welke dag ... asks for the weekday, not the numbered calendar date."}
  nl.a1.unit03.lesson01.teach.today_wednesday: {title: "State today's weekday", gloss: "Today is Wednesday.", note: "The weekday remains lowercase inside the sentence."}
  nl.a1.unit03.lesson01.teach.lowercase_days: {title: "Lowercase weekday names", gloss: "Days normally have no capital letter: Monday, Friday.", note: "Unlike English, Dutch does not capitalize weekday names except at the start of a sentence."}

  nl.a1.unit03.lesson02.teach.jan_mar: {title: "January through March", gloss: "January, February, March", note: "Dutch month names normally begin with lowercase letters.", example_gloss: ["My birthday is in January.", "I'm learning Dutch in February.", "My birthday is in March."]}
  nl.a1.unit03.lesson02.teach.apr_jun: {title: "April through June", gloss: "April, May, June", note: "The Dutch mei is May; juni is June.", example_gloss: ["I'm learning Dutch in April.", "My birthday is in May.", "I'm learning Dutch in June."]}
  nl.a1.unit03.lesson02.teach.jul_sep: {title: "July through September", gloss: "July, August, September", note: "The Dutch words juli and juni differ in their final vowel.", example_gloss: ["My birthday is in July.", "I'm learning Dutch in August.", "My birthday is in September."]}
  nl.a1.unit03.lesson02.teach.oct_dec: {title: "October through December", gloss: "October, November, December", note: "The Dutch oktober is spelled with k.", example_gloss: ["I'm learning Dutch in October.", "My birthday is in November.", "I'm learning Dutch in December."]}
  nl.a1.unit03.lesson02.teach.year: {title: "Year", gloss: "the year", note: "Jaar is the word used for a calendar year.", example_gloss: "I'm learning Dutch this year."}
  nl.a1.unit03.lesson02.teach.lowercase_months: {title: "Lowercase month names", gloss: "Months normally have no capital letter: April, September.", note: "Unlike English, Dutch month names are lowercase except at the start of a sentence."}

  nl.a1.unit03.lesson03.teach.first_fourth: {title: "First through fourth", gloss: "1–4: the first, the second, the third, the fourth", note: "Eerste, tweede, and derde are forms to learn directly; vierde is built from vier.", example_gloss: ["It is the first of April.", "It is the second of April.", "It is the third of April.", "It is the fourth of April."]}
  nl.a1.unit03.lesson03.teach.fifth_eighth: {title: "Fifth through eighth", gloss: "5–8: the fifth, the sixth, the seventh, the eighth", note: "These date forms are vijfde, zesde, zevende, and achtste.", example_gloss: ["It is the fifth of April.", "It is the sixth of April.", "It is the seventh of April.", "It is 8 April 2026."]}
  nl.a1.unit03.lesson03.teach.ninth_twelfth: {title: "Ninth through twelfth", gloss: "9–12: the ninth, the tenth, the eleventh, the twelfth", note: "These forms cover the early-month dates used later in the unit.", example_gloss: ["It is the ninth of April.", "It is the tenth of April.", "It is the eleventh of April.", "It is the twelfth of April."]}
  nl.a1.unit03.lesson03.teach.thirteenth_nineteenth: {title: "Thirteenth through nineteenth", gloss: "13–19: the thirteenth, the fourteenth, the fifteenth, the sixteenth, the seventeenth, the eighteenth, the nineteenth", note: "These written-out day ordinals end in -de.", example_gloss: ["It is the thirteenth of April.", "It is the fourteenth of April.", "It is the fifteenth of April.", "It is the sixteenth of April.", "It is the seventeenth of April.", "It is the eighteenth of April.", "It is the nineteenth of April."]}
  nl.a1.unit03.lesson03.teach.twentieth_twenty_fourth: {title: "Twentieth through twenty-fourth", gloss: "20–24: the twentieth, the twenty-first, the twenty-second, the twenty-third, the twenty-fourth", note: "From twintig upward, these tested ordinal forms end in -ste and remain one written word.", example_gloss: ["It is the twentieth of April.", "The book has to go back on the twenty-first of April.", "It is the twenty-second of April.", "It is the twenty-third of April.", "It is the twenty-fourth of April."]}
  nl.a1.unit03.lesson03.teach.twenty_fifth_twenty_ninth: {title: "Twenty-fifth through twenty-ninth", gloss: "25–29: the twenty-fifth, the twenty-sixth, the twenty-seventh, the twenty-eighth, the twenty-ninth", note: "These compound ordinals end in -ste and are written as one word.", example_gloss: ["It is the twenty-fifth of April.", "It is the twenty-sixth of April.", "It is the twenty-seventh of April.", "It is the twenty-eighth of April.", "It is the twenty-ninth of April."]}
  nl.a1.unit03.lesson03.teach.thirtieth_thirty_first: {title: "Thirtieth and thirty-first", gloss: "30–31: the thirtieth, the thirty-first", note: "These are the final two possible day numbers in a month.", example_gloss: ["It is the thirtieth of April.", "It is the thirty-first of December."]}
  nl.a1.unit03.lesson03.teach.spoken_date: {title: "Say a date with an ordinal", gloss: "3 April — the third of April", note: "This unit models an ordinal when the day number is spoken in full; Dutch places the day before the month."}
  nl.a1.unit03.lesson03.teach.on_date: {title: "On a date", gloss: "on 3 April — on the third of April", note: "With a written digit, use op 3 april; when the ordinal is written out, use op de derde april."}

  nl.a1.unit03.lesson04.teach.ask_date: {title: "Ask for the calendar date", gloss: "What is the date today?", note: "Welke datum ... explicitly asks for the calendar date."}
  nl.a1.unit03.lesson04.teach.ask_which_date: {title: "Ask which numbered day it is", gloss: "What date is it today?", note: "De hoeveelste ... is a common conversational way to ask for the day number."}
  nl.a1.unit03.lesson04.teach.date_answer: {title: "Give a full date", gloss: "It is 3 April 2026.", note: "Dutch date order is day–month–year, and april remains lowercase."}
  nl.a1.unit03.lesson04.teach.date_words: {title: "Give the day as an ordinal", gloss: "It is the third of April.", note: "The written-out ordinal includes de: de derde april."}
  nl.a1.unit03.lesson04.teach.written_order: {title: "Day–month–year order", gloss: "day–month–year: 3 April 2026 or 3-4-2026", note: "The numeric form is not US month–day–year: 3-4-2026 means 3 April 2026."}
  nl.a1.unit03.lesson04.teach.day_and_date: {title: "Combine weekday and date", gloss: "Today is Friday 10 April.", note: "Both vrijdag and april are lowercase in the middle of a sentence. 10 April really is a Friday in 2026."}

  nl.a1.unit03.lesson05.teach.when: {title: "When", gloss: "when", note: "Wanneer asks at what time or on what date something happens.", example_gloss: "When is the language café?"}
  nl.a1.unit03.lesson05.teach.book: {title: "Book", gloss: "the book", note: "Boek is a library book here.", example_gloss: "I have the book."}
  nl.a1.unit03.lesson05.teach.due_date: {title: "Due date", gloss: "the due date", note: "An inleverdatum is the date by which something must be handed back.", example_gloss: "What is the due date of the book?"}
  nl.a1.unit03.lesson05.teach.ask_due: {title: "Ask when a book is due", gloss: "When does the book have to go back?", note: "Moet ... terug is a natural simple way to ask when a borrowed item must be returned."}
  nl.a1.unit03.lesson05.teach.due_answer: {title: "Give the due date", gloss: "On 21 April.", note: "The short answer uses op plus the day and lowercase month."}
  nl.a1.unit03.lesson05.teach.due_words: {title: "State the due date in words", gloss: "The book must go back on the twenty-first of April.", note: "With the written-out ordinal, include de after op."}
  nl.a1.unit03.lesson05.teach.label: {title: "Read a due-date label", gloss: "Due date: 21-4-2026", note: "This numeric label follows day–month–year order."}

  nl.a1.unit03.lesson06.teach.dialogue_day: {title: "Lotte asks for the weekday", gloss: "Lotte: What day is it today? Omar: It is Wednesday.", note: "The answer supplies a weekday."}
  nl.a1.unit03.lesson06.teach.dialogue_date: {title: "Lotte asks for the date", gloss: "Lotte: And what is the date? Omar: It is 8 April 2026.", note: "The spoken Dutch answer uses the ordinal de achtste; 8 April really is a Wednesday in 2026, matching the preceding turn."}
  nl.a1.unit03.lesson06.teach.next: {title: "Next", gloss: "next", note: "Volgende identifies the next occurrence.", example_gloss: "When is the next language café?"}
  nl.a1.unit03.lesson06.teach.dialogue_next: {title: "Ask for the next meeting date", gloss: "Lotte: When is the next language café? Omar: On Friday 10 April.", note: "The answer combines op, a lowercase weekday, the day number, and a lowercase month. 10 April really is a Friday in 2026, two days after the 8th."}
  nl.a1.unit03.lesson06.teach.dialogue_close: {title: "Close the exchange", gloss: "Lotte: Good, see you Friday! Omar: See you then!", note: "Tot vrijdag names the day of the next meeting."}

exercises:
  nl.a1.unit03.lesson01.exercise01.choose_wednesday:
    instruction: "Choose the Dutch word for Wednesday."
    correct_option: woensdag
    distractors: [dinsdag, donderdag, zondag]
    accepted_answers: [{value: woensdag, status: correct}]
    feedback: "Wednesday is woensdag."
  nl.a1.unit03.lesson01.exercise02.listen_friday:
    instruction: "Listen and choose the weekday you hear."
    correct_option: vrijdag
    distractors: [dinsdag, donderdag, zaterdag]
    accepted_answers: [{value: vrijdag, status: correct}]
    feedback: "The Dutch word for Friday is vrijdag."
  nl.a1.unit03.lesson01.exercise03.choose_lowercase:
    instruction: "Choose the normally correct spelling for Monday inside a Dutch sentence."
    case_sensitive: true
    correct_option: maandag
    distractors: [Maandag, MAANDAG, maanDag]
    accepted_answers: [{value: maandag, status: correct}]
    feedback: "Dutch weekday names normally use lowercase: maandag."
  nl.a1.unit03.lesson01.exercise04.match_weekdays:
    instruction: "Match each Dutch weekday with its English meaning."
    accepted_answers: [{"value": [{"left": "maandag", "right": "Monday"}, {"left": "dinsdag", "right": "Tuesday"}, {"left": "woensdag", "right": "Wednesday"}, {"left": "donderdag", "right": "Thursday"}, {"left": "vrijdag", "right": "Friday"}, {"left": "zaterdag", "right": "Saturday"}, {"left": "zondag", "right": "Sunday"}], "status": "correct"}]
    feedback: "The Dutch words maandag, woensdag, vrijdag, and zondag are Monday, Wednesday, Friday, and Sunday."
  nl.a1.unit03.lesson01.exercise05.order_day_question:
    instruction: "Put the words in order to ask which weekday it is today."
    accepted_answers: [{value: [Welke, dag, is, het, vandaag], status: correct}]
    feedback: "Welke dag is het vandaag? asks for the weekday."
  nl.a1.unit03.lesson01.exercise06.listen_order_today:
    instruction: "Listen and put the answer in order."
    accepted_answers: [{value: [Vandaag, is, het, woensdag], status: correct}]
    feedback: "The recording says Vandaag is het woensdag."
  nl.a1.unit03.lesson01.exercise07.say_day:
    instruction: "Reply in a complete Dutch sentence. Say it aloud, then enter it."
    accepted_answers: [{value: "Vandaag is het woensdag.", status: correct}, {value: "Vandaag is het woensdag", status: correct}, {value: "Het is woensdag.", status: correct}, {value: "Het is woensdag", status: correct}]
    feedback: "A complete answer is Vandaag is het woensdag."
  nl.a1.unit03.lesson01.exercise08.listen_type_wednesday:
    instruction: "Listen and type the full Dutch sentence."
    accepted_answers: [{value: "Vandaag is het woensdag.", status: correct}, {value: "Vandaag is het woensdag", status: correct}]
    feedback: "The recording says Vandaag is het woensdag."

  nl.a1.unit03.lesson02.exercise01.choose_april:
    instruction: "Choose the Dutch word for April."
    correct_option: april
    distractors: [maart, mei, augustus]
    accepted_answers: [{value: april, status: correct}]
    feedback: "April is april in Dutch, with a lowercase letter."
  nl.a1.unit03.lesson02.exercise02.listen_september:
    instruction: "Listen and choose the month you hear."
    correct_option: september
    distractors: [november, december, augustus]
    accepted_answers: [{value: september, status: correct}]
    feedback: "September is september."
  nl.a1.unit03.lesson02.exercise03.choose_lowercase_month:
    instruction: "Choose the normally correct spelling for January inside a Dutch sentence."
    case_sensitive: true
    correct_option: januari
    distractors: [Januari, JANUARI, januAri]
    accepted_answers: [{value: januari, status: correct}]
    feedback: "Dutch month names normally use lowercase: januari."
  nl.a1.unit03.lesson02.exercise04.match_months:
    instruction: "Match each Dutch month with its English meaning."
    accepted_answers: [{"value": [{"left": "januari", "right": "January"}, {"left": "februari", "right": "February"}, {"left": "maart", "right": "March"}, {"left": "april", "right": "April"}, {"left": "mei", "right": "May"}, {"left": "juni", "right": "June"}, {"left": "juli", "right": "July"}, {"left": "augustus", "right": "August"}, {"left": "september", "right": "September"}, {"left": "oktober", "right": "October"}, {"left": "november", "right": "November"}, {"left": "december", "right": "December"}], "status": "correct"}]
    feedback: "The month names remain lowercase in Dutch."
  nl.a1.unit03.lesson02.exercise05.order_months:
    instruction: "Put these consecutive months in calendar order."
    accepted_answers: [{value: [maart, april, mei, juni], status: correct}]
    feedback: "The order is maart, april, mei, juni."
  nl.a1.unit03.lesson02.exercise06.listen_order_months:
    instruction: "Listen and put the first four months in the order heard."
    accepted_answers: [{value: [januari, februari, maart, april], status: correct}]
    feedback: "The year begins januari, februari, maart, april."
  nl.a1.unit03.lesson02.exercise07.write_october:
    instruction: "Write October in Dutch."
    accepted_answers: [{value: oktober, status: correct}]
    feedback: "October is oktober, spelled with k and normally lowercase."
  nl.a1.unit03.lesson02.exercise08_listen_type_december:
    instruction: "Listen and type the Dutch month you hear."
    accepted_answers: [{value: december, status: correct}]
    feedback: "December is december."

  nl.a1.unit03.lesson03.exercise01.choose_third:
    instruction: "Choose the Dutch ordinal for the displayed day number."
    correct_option: "de derde"
    distractors: ["de tweede", "de vierde", "de dertigste"]
    accepted_answers: [{value: "de derde", status: correct}]
    feedback: "3 as a day ordinal is de derde."
  nl.a1.unit03.lesson03.exercise02.listen_first_four:
    instruction: "Listen and choose the fourth ordinal in the sequence."
    correct_option: "de vierde"
    distractors: ["de eerste", "de tweede", "de derde"]
    accepted_answers: [{value: "de vierde", status: correct}]
    feedback: "The fourth is de vierde."
  nl.a1.unit03.lesson03.exercise03.choose_twenty_first:
    instruction: "Choose the Dutch ordinal for day 21."
    correct_option: "de eenentwintigste"
    distractors: ["de twintigste", "de tweeëntwintigste", "de eenendertigste"]
    accepted_answers: [{value: "de eenentwintigste", status: correct}]
    feedback: "Day 21 is de eenentwintigste."
  nl.a1.unit03.lesson03.exercise04.match_ordinals:
    instruction: "Match each Dutch ordinal with its day number."
    accepted_answers: [{"value": [{"left": "eerste", "right": "1"}, {"left": "tweede", "right": "2"}, {"left": "derde", "right": "3"}, {"left": "vierde", "right": "4"}, {"left": "vijfde", "right": "5"}, {"left": "achtste", "right": "8"}, {"left": "tiende", "right": "10"}, {"left": "twaalfde", "right": "12"}, {"left": "twintigste", "right": "20"}, {"left": "eenentwintigste", "right": "21"}, {"left": "dertigste", "right": "30"}, {"left": "eenendertigste", "right": "31"}], "status": "correct"}]
    feedback: "The matches are first–1, eighth–8, twelfth–12, and thirtieth–30."
  nl.a1.unit03.lesson03.exercise05.order_spoken_date:
    instruction: "Put the words in order to write 3 April with the day as an ordinal."
    accepted_answers: [{value: [de, derde, april], status: correct}]
    feedback: "The written-out form is de derde april."
  nl.a1.unit03.lesson03.exercise06.listen_order_twenty_first:
    instruction: "Listen and put the date expression in order."
    accepted_answers: [{value: [de, eenentwintigste, april], status: correct}]
    feedback: "The recording says de eenentwintigste april."
  nl.a1.unit03.lesson03.exercise07_say_third_april:
    instruction: "Say the displayed date aloud with an ordinal, then enter it in words."
    accepted_answers: [{value: "op de derde april", status: correct}, {value: "Op de derde april", status: correct}, {value: "op de derde april.", status: correct}]
    feedback: "With the ordinal written out, use op de derde april."
  nl.a1.unit03.lesson03.exercise08_listen_type_third_april:
    instruction: "Listen and type the date expression in Dutch words."
    accepted_answers: [{value: "op de derde april", status: correct}, {value: "Op de derde april", status: correct}, {value: "op de derde april.", status: correct}]
    feedback: "The recording says op de derde april."

  nl.a1.unit03.lesson04.exercise01_choose_date_question:
    instruction: "Choose the question that asks for today's calendar date."
    correct_option: "Welke datum is het vandaag?"
    distractors: ["Welke dag is het vandaag?", "Is het vandaag woensdag?", "Hoe oud ben je?"]
    accepted_answers: [{value: "Welke datum is het vandaag?", status: correct}]
    feedback: "Welke datum ... asks for the calendar date; Welke dag ... asks for the weekday."
  nl.a1.unit03.lesson04.exercise02_listen_date:
    instruction: "Listen and choose the date stated."
    correct_option: "3 April"
    distractors: ["2 April", "4 April", "3 March"]
    accepted_answers: [{value: "3 April", status: correct}]
    feedback: "The speaker says de derde april, meaning 3 April."
  nl.a1.unit03.lesson04.exercise03_read_numeric:
    instruction: "Read the Dutch numeric date and choose its meaning."
    correct_option: "3 April 2026"
    distractors: ["4 March 2026", "3 April 2024", "4 April 2026"]
    accepted_answers: [{value: "3 April 2026", status: correct}]
    feedback: "Dutch numeric dates use day–month–year, so 3-4-2026 is 3 April 2026."
  nl.a1.unit03.lesson04.exercise04_match_written_dates:
    instruction: "Match each numeric Dutch date with the same date written using a month name."
    accepted_answers: [{value: [{left: "3-4-2026", right: "3 april 2026"}, {left: "12-4-2026", right: "12 april 2026"}], status: correct}]
    feedback: "The day comes first, followed by the month and year."
  nl.a1.unit03.lesson04.exercise05_order_date_question:
    instruction: "Put the words in order to ask which numbered day it is."
    accepted_answers: [{value: [De, hoeveelste, is, het, vandaag], status: correct}]
    feedback: "De hoeveelste is het vandaag? asks for today's day number."
  nl.a1.unit03.lesson04.exercise06_listen_order_answer:
    instruction: "Listen and put the full date sentence in order."
    accepted_answers: [{value: [Het, is, de, derde, april], status: correct}]
    feedback: "The answer is Het is de derde april."
  nl.a1.unit03.lesson04.exercise07_state_date:
    instruction: "Reply with the displayed date, writing the day as an ordinal."
    accepted_answers: [{value: "Het is de derde april.", status: correct}, {value: "Het is de derde april", status: correct}, {value: "De derde april.", status: acceptable_with_note, note: "Natural as a short answer; a complete sentence begins with Het is."}]
    feedback: "A complete answer is Het is de derde april."
  nl.a1.unit03.lesson04.exercise08_write_date:
    instruction: "Write 3 April 2026 as an unambiguous Dutch date."
    accepted_answers: [{value: "3 april 2026", status: correct}, {value: "3-4-2026", status: correct}, {value: "03-04-2026", status: correct}, {value: "3 april 2026.", status: correct}, {value: "de derde april 2026", status: correct}]
    feedback: "Use day–month–year: 3 april 2026 or 3-4-2026."

  nl.a1.unit03.lesson05.exercise01_choose_due_meaning:
    instruction: "What does inleverdatum mean on a library label?"
    correct_option: "due date"
    distractors: ["publication date", "birth date", "meeting day"]
    accepted_answers: [{value: "due date", status: correct}]
    feedback: "Inleverdatum is the date by which the book must be returned."
  nl.a1.unit03.lesson05.exercise02_listen_due:
