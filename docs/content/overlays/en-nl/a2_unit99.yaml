course: {title: Dutch A2, description: Grammar-led A2 Dutch for comparing and choosing between options., learning_goal: 'Compare several options and pick the best with -er, -st, meer, het meest, even ... als and niet zo ... als.'}
units:
  nl.a2.unit99.de_beste_en_meest: {title: 'The best, the cheapest, the most', description: 'Compare housing, phones and holidays and say which one is the best.'}
lessons:
  nl.a2.unit99.lesson01.groter_dan: {title: Bigger than}
  nl.a2.unit99.lesson02.het_grootste: {title: The biggest}
  nl.a2.unit99.lesson03.even_en_niet_zo: {title: Just as ... as and not as ... as}
  nl.a2.unit99.lesson04.meer_en_meest: {title: More and the most}
  nl.a2.unit99.lesson05.noor_kiest_een_hotel: {title: Noor chooses a hotel}
  nl.a2.unit99.lesson06.een_telefoon_kiezen: {title: Choosing a phone}
teaching:
  nl.a2.unit99.lesson01.teach.eigenschappen:
    title: Describing words
    gloss: big / small / beautiful / expensive / cheap / long
    note: These six adjectives are the base for every comparison in this unit.
    example_gloss: [The house is big and beautiful., 'The phone is expensive, but the hotel is cheap.', The trip is long and the room is small.]
  nl.a2.unit99.lesson01.teach.wonen:
    title: Housing
    gloss: the house / the apartment / the room / the kitchen / the garden
    note: Housing words come back from the first course; here they are the things we compare.
    example_gloss: [The house has a garden., The kitchen is in the apartment., The room is small.]
  nl.a2.unit99.lesson01.teach.telefoon:
    title: Phones
    gloss: the phone / the battery / the camera
    note: Phone words for comparing models. *Goed* means good.
    example_gloss: [My phone has a camera., The battery is good., I have a phone.]
  nl.a2.unit99.lesson01.teach.vakantie:
    title: Holidays
    gloss: the holiday / the hotel / the beach / the city / the trip
    note: Travel words from the first course, used here to compare holiday options.
    example_gloss: [The hotel is near the beach., The holiday is long., The city is big.]
  nl.a2.unit99.lesson01.teach.gn_groter: {title: 'The comparative: add -er', gloss: 'big, bigger; small, smaller; beautiful, more beautiful; expensive, more expensive; cheap, cheaper; long, longer', note: 'Add -er to the adjective. Watch the spelling: *groot* loses an o (*groter*), *goedkoop* loses an o (*goedkoper*), and *duur* gets a d before -er (*duurder*). *Mooi* simply becomes *mooier*.'}
  nl.a2.unit99.lesson01.teach.gn_dan: {title: Comparing with dan, gloss: The house is bigger than the apartment. My room is smaller than your room., note: 'After a comparative (-er form), the thing you compare with follows *dan* (than).'}
  nl.a2.unit99.lesson01.teach.zin_duurder: {title: A phone comparison, gloss: My phone is more expensive than your phone., note: '*Mijn* is my, *jouw* is your (informal). In everyday speech *jouw* is often the unstressed *je*: *je telefoon*.'}
  nl.a2.unit99.lesson02.teach.kiezen:
    title: Choosing words
    gloss: which / this (de-word) / this (het-word) / that / of all
    note: '*Deze* goes with singular de-words (deze telefoon) and plurals, *dit* with singular het-words (dit hotel). *Die* means that (die telefoon).'
    example_gloss: ['Which phone is expensive?', This phone is expensive and that phone is cheap., 'This hotel is beautiful, and that phone is expensive.']
  nl.a2.unit99.lesson02.teach.gn_superlatief: {title: 'The superlative: het + adjective + -st', gloss: 'big, the biggest; small, the smallest; beautiful, the most beautiful; expensive, the most expensive; cheap, the cheapest; long, the longest', note: 'After *is*, use *het* and add -st. The -er spelling changes do not apply: the double vowel stays (*het grootst*, *het goedkoopst*).'}
  nl.a2.unit99.lesson02.teach.gn_superlatief_e: {title: 'The superlative before a noun: -ste', gloss: This is the most expensive phone. This is the smallest house. This is the cheapest room. This is the most beautiful garden., note: 'Before a noun, add -ste: *de duurste telefoon*, *het kleinste huis*. After *is* without a noun, both *het goedkoopst* and *het goedkoopste* are fine.'}
  nl.a2.unit99.lesson02.teach.gn_onregelmatig: {title: 'Irregular: goed and veel', gloss: 'good, better, the best; much/many, more, the most. My phone is better than your phone. This is the best camera. This hotel has the most rooms.', note: '*Goed* and *veel* do not follow the rule: *goed - beter - best* and *veel - meer - meest*. Before a noun it ends in -e: *de beste camera*, *de meeste kamers* (with a het-word: *het beste huis*).'}
  nl.a2.unit99.lesson02.teach.zin_goedkoopst: {title: Of all the hotels, gloss: 'Of all the hotels, this hotel is the cheapest.', note: '*Van alle* names the group you choose from.'}
  nl.a2.unit99.lesson03.teach.gelijk:
    title: Equal and not equal
    gloss: just as / not as / as
    note: '*Even ... als* says two things are equal; *niet zo ... als* says the first is less.'
    example_gloss: [My house is just as big as your house., The hotel is not as expensive as the apartment., The kitchen is just as beautiful as the garden.]
  nl.a2.unit99.lesson03.teach.gn_even: {title: 'Equal: even ... als', gloss: My phone is just as expensive as your phone., note: 'Use the basic adjective (no -er) between *even* and *als*: *even duur als*.'}
  nl.a2.unit99.lesson03.teach.gn_niet_zo: {title: 'Less: niet zo ... als', gloss: The hotel is not as big as the apartment., note: 'Again the basic adjective: *niet zo groot als*. The second thing is bigger.'}
  nl.a2.unit99.lesson03.teach.gn_dan_als: {title: 'Dan or als?', gloss: The hotel is cheaper than the apartment. The hotel is just as cheap as the apartment., note: 'Comparative (-er) goes with *dan*. *Even* and *niet zo* go with the basic adjective and *als*. Never mix them: not *even goedkoper als*.'}
  nl.a2.unit99.lesson04.teach.lange_woorden:
    title: Longer adjectives
    gloss: interesting / practical / modern / comfortable
    note: These longer adjectives are the ones that usually take *meer* and *het meest*.
    example_gloss: [The trip to the city is interesting., The phone is practical., The apartment is modern and comfortable.]
  nl.a2.unit99.lesson04.teach.gn_meer: {title: 'Long adjectives: meer and het meest', gloss: 'interesting, more interesting, the most interesting; modern, more modern, the most modern', note: 'With longer adjectives, put *meer* (more) or *het meest* (the most) before the unchanged adjective. This is the pattern taught here; forms such as *interessanter* also occur in everyday Dutch.'}
  nl.a2.unit99.lesson04.teach.gn_kort_lang: {title: 'Short or long?', gloss: 'Short: expensive, more expensive, the most expensive. Long: comfortable, more comfortable, the most comfortable.', note: 'Short adjectives take -er and -st. Longer adjectives, especially those ending in -ant, -isch, -eel or -abel, usually take *meer* and *het meest*. Both patterns still use *dan* after the comparative.'}
  nl.a2.unit99.lesson04.teach.zin_comfortabel: {title: Choosing a hotel, gloss: 'Which hotel is the most comfortable? This hotel is the most comfortable, but it is also the most expensive.', note: '*Welk* goes with singular het-words (welk hotel); *welke* goes with de-words and all plurals.'}
  nl.a2.unit99.lesson05.teach.reading:
    title: Noor's hotel search
    gloss: Noor is looking for a hotel for her holiday. Hotel Strand is the most expensive, but it is also the most beautiful. Hotel Stad is cheaper than Hotel Strand, but it is not as comfortable as Hotel Strand. Hotel Tuin is just as cheap as Hotel Stad. Noor chooses Hotel Tuin, because the rooms are bigger.
    note: Follow how the three hotels are compared with each other.
    glosses: {zoekt: is looking for, voor: for, haar: her, kiest: chooses, want: because, kamers: rooms, zijn: are}
  nl.a2.unit99.lesson06.teach.beurt01: {title: Lotte asks for an opinion, gloss: 'Lotte: Hi Omar, which phone do you think is the best?'}
  nl.a2.unit99.lesson06.teach.beurt02: {title: Omar names an advantage and a drawback, gloss: 'Omar: This phone has the best camera, but it is also the most expensive.'}
  nl.a2.unit99.lesson06.teach.beurt03: {title: Lotte suggests a cheaper phone, gloss: 'Lotte: That phone is cheaper than this one, and the battery is just as good.'}
  nl.a2.unit99.lesson06.teach.beurt04: {title: Omar asks about the looks, gloss: 'Omar: Is that phone as nice as this one, too?'}
  nl.a2.unit99.lesson06.teach.beurt05: {title: Lotte answers, gloss: 'Lotte: No, it is not as nice as this one, but it is much cheaper.'}
  nl.a2.unit99.lesson06.teach.beurt06: {title: Omar decides, gloss: 'Omar: OK, I choose that phone.'}
exercises:
  nl.a2.unit99.lesson01.exercise01.choose_kleiner:
    instruction: Choose the Dutch sentence that matches the English.
    correct_option: Het appartement is kleiner dan het huis.
    distractors: [Het huis is kleiner dan het appartement., Het appartement is klein dan het huis., Het appartement is kleinste dan het huis.]
    accepted_answers:
    - {value: Het appartement is kleiner dan het huis., status: correct}
    feedback: '*Kleiner* is the comparative of *klein*, followed by *dan*.'
  nl.a2.unit99.lesson01.exercise02.choose_duurder:
    instruction: Choose the Dutch sentence that matches the English.
    correct_option: Mijn telefoon is duurder dan jouw telefoon.
    distractors: [Jouw telefoon is duurder dan mijn telefoon., Mijn telefoon is duur dan jouw telefoon., Mijn telefoon is goedkoper dan jouw telefoon.]
    accepted_answers:
    - {value: Mijn telefoon is duurder dan jouw telefoon., status: correct}
    feedback: '*Duurder dan* means more expensive than.'
  nl.a2.unit99.lesson01.exercise03.match_vergelijking:
    instruction: Match each adjective to its comparative.
    accepted_answers:
    - value:
      - {left: groot, right: groter}
      - {left: klein, right: kleiner}
      - {left: mooi, right: mooier}
      - {left: duur, right: duurder}
      - {left: goedkoop, right: goedkoper}
      - {left: lang, right: langer}
      status: correct
    feedback: 'Add -er and keep the spelling rules in mind: groter, goedkoper, duurder.'
  nl.a2.unit99.lesson01.exercise04.order_groter:
    instruction: Put the words in order to say 'The house is bigger than the apartment.'
    correct_option: Het huis is groter dan het appartement
    accepted_answers:
    - {value: Het huis is groter dan het appartement, status: correct}
    feedback: '*Het huis is groter dan het appartement.*'
  nl.a2.unit99.lesson01.exercise05.complete_groter:
    instruction: Complete the sentence so it means 'The kitchen is bigger than the room.' Use the comparative.
    correct_option: groter
    accepted_answers:
    - {value: groter, status: correct}
    feedback: '*Groter* is the comparative of *groot*.'
  nl.a2.unit99.lesson01.exercise06.translate_goedkoper:
    instruction: Translate into Dutch.
    correct_option: Het hotel is goedkoper dan het appartement.
    accepted_answers:
    - {value: Het hotel is goedkoper dan het appartement., status: correct}
    - {value: Het hotel is goedkoper dan het appartement, status: correct}
    feedback: '*Het hotel is goedkoper dan het appartement.*'
  nl.a2.unit99.lesson01.exercise07.write_kleiner:
    instruction: Write the requested Dutch sentence.
    correct_option: Mijn kamer is kleiner dan jouw kamer.
    accepted_answers:
    - {value: Mijn kamer is kleiner dan jouw kamer., status: correct}
    - {value: Mijn kamer is kleiner dan jouw kamer, status: correct}
    - {value: Mijn kamer is kleiner dan je kamer., status: correct}
    - {value: Mijn kamer is kleiner dan je kamer, status: correct}
    feedback: '*Mijn kamer is kleiner dan jouw kamer.*'
  nl.a2.unit99.lesson02.exercise01.choose_duurste:
    instruction: Choose the Dutch sentence that matches the English.
    correct_option: Dit is de duurste telefoon.
    distractors: [Dit is de duurder telefoon., Dit is duurste telefoon., Dit is de goedkoopste telefoon.]
    accepted_answers:
    - {value: Dit is de duurste telefoon., status: correct}
    feedback: 'Before a noun the superlative ends in -ste: *de duurste telefoon*.'
  nl.a2.unit99.lesson02.exercise02.choose_goedkoopst:
    instruction: Choose the Dutch sentence that matches the English.
    correct_option: Van alle hotels is dit hotel het goedkoopst.
    distractors: [Van alle hotels is dit hotel goedkoper., Van alle hotels is dit hotel het goedkoper., Van alle hotels is dit hotel het duurst.]
    accepted_answers:
    - {value: Van alle hotels is dit hotel het goedkoopst., status: correct}
    feedback: '*Het goedkoopst* = the cheapest. A comparative like *goedkoper* needs *dan*, not *van alle*.'
  nl.a2.unit99.lesson02.exercise03.match_superlatief:
    instruction: Match each adjective to its superlative.
    accepted_answers:
    - value:
      - {left: groot, right: het grootst}
      - {left: klein, right: het kleinst}
      - {left: mooi, right: het mooist}
      - {left: duur, right: het duurst}
      - {left: goedkoop, right: het goedkoopst}
      - {left: lang, right: het langst}
      - {left: goed, right: het best}
      - {left: veel, right: het meest}
      status: correct
    feedback: 'Regular: add -st. Irregular: goed - het best, veel - het meest.'
  nl.a2.unit99.lesson02.exercise04.order_goedkoopste:
    instruction: Put the words in order to say 'This is the cheapest room.'
    correct_option: Dit is de goedkoopste kamer
    accepted_answers:
    - {value: Dit is de goedkoopste kamer, status: correct}
    feedback: '*Dit is de goedkoopste kamer.*'
  nl.a2.unit99.lesson02.exercise05.complete_duurste:
    instruction: Complete with the superlative of duur, meaning 'the most expensive'.
