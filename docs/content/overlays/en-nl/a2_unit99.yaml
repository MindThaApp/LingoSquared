    - {value: Mijn telefoon is beter dan je telefoon, status: correct}
    feedback: '*Beter* is the comparative of *goed*.'
  nl.a2.unit99.lesson02.exercise07.write_meeste:
    instruction: Write the requested Dutch sentence.
    correct_option: Dit hotel heeft de meeste kamers.
    accepted_answers:
    - {value: Dit hotel heeft de meeste kamers., status: correct}
    - {value: Dit hotel heeft de meeste kamers, status: correct}
