    feedback: '*Niet zo* + basic adjective + *als*.'
  nl.a2.unit99.lesson03.exercise03.match_vergelijken:
    instruction: Match each Dutch comparison to its English meaning.
    accepted_answers:
    - value:
      - {left: even duur als, right: just as expensive as}
