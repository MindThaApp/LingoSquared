    - {value: Dit hotel is het meest comfortabel maar ook het duurst, status: correct}
    - {value: 'Dit hotel is het meest comfortabel, maar ook het duurste.', status: correct}
    - {value: Dit hotel is het meest comfortabel maar ook het duurste, status: correct}
