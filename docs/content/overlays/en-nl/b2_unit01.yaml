course:
  title: Dutch B2
  description: >-
    Upper-intermediate Dutch: defend a position in a discussion -- state
    a claim, support it with reasons and evidence (ten eerste,
    bijvoorbeeld, uit onderzoek blijkt dat), acknowledge the strongest
    opposing point (aan de ene kant ... aan de andere kant, hoewel,
    natuurlijk), and rebut it without conceding (toch, daarentegen,
    echter, dat neemt niet weg dat, kortom), around the everyday debate
    of working from home.

units:
  nl.b2.unit01.argumentatie:
    title: "Argumentation"
    description: Defend a position on an everyday issue -- state a claim, support it with reasons and evidence, acknowledge the strongest objection, and rebut it without giving up your claim.

lessons:
  nl.b2.unit01.lesson01.een_standpunt:
    title: "Taking a position"
  nl.b2.unit01.lesson02.argumenten_geven:
    title: "Giving reasons and evidence"
  nl.b2.unit01.lesson03.de_andere_kant:
    title: "Acknowledging the other side"
  nl.b2.unit01.lesson04.weerleggen:
    title: "Rebutting"
  nl.b2.unit01.lesson05.een_betoog_lezen:
    title: "Reading an argument"
  nl.b2.unit01.lesson06.een_standpunt_verdedigen:
    title: "Defending a position"

teaching:
  nl.b2.unit01.lesson01.teach.thuiswerken:
    title: "working from home"
    gloss: "working from home / to work from home"
    note: "*Thuiswerken* is the everyday word for working from home, used both as a noun ('het thuiswerken') and as a verb. It is the topic this whole unit argues about."
    example_gloss: "Working from home saves time."
  nl.b2.unit01.lesson01.teach.op_kantoor_werken:
    title: "working at the office"
    gloss: "to work at the office"
    note: "The opposite pole of the debate. *Op kantoor* means 'at the office'; the infinitive *werken* goes to the end when it follows a helper verb."
  nl.b2.unit01.lesson01.teach.standpunt:
    title: "a position / viewpoint"
    gloss: "a position / a point of view"
    note: "*Een standpunt innemen* means 'to take a position' -- the claim you are going to defend. This is the thing an argument is built around."
    example_gloss: "I have a clear position."
  nl.b2.unit01.lesson01.teach.ik_vind_dat:
    title: "I think that..."
    gloss: "I think that... / In my view..."
    note: "*Ik vind dat...* introduces your own opinion and pushes the rest of the clause into subordinate (verb-final) order: *ik vind dat thuiswerken beter is* (not '...beter is thuiswerken')."
  nl.b2.unit01.lesson01.teach.volgens_mij:
    title: "In my opinion..."
    gloss: "In my opinion... / According to me..."
    note: "*Volgens mij* is a softer, very common way to open an opinion. Because it starts the sentence, the verb comes straight after it: *Volgens mij is thuiswerken beter*."
  nl.b2.unit01.lesson01.teach.beter:
    title: better
    gloss: better
    example_gloss: "This approach is better."
  nl.b2.unit01.lesson01.teach.dan:
    title: than
    gloss: than
    note: "*Dan* is 'than' in a comparison: *beter dan* = 'better than'."
    example_gloss: "Working from home is better than commuting."
  nl.b2.unit01.lesson01.teach.claim_model:
    title: "I think that working from home is better than working at the office."
    gloss: "I think that working from home is better than working at the office."
    note: "The model claim for this unit. Notice the verb-final order after *dat*: *...dat thuiswerken beter is...*."
  nl.b2.unit01.lesson01.teach.ermee_eens:
    title: "I agree with it."
    gloss: "I agree with it."
    note: "*Het ermee eens zijn* = 'to agree with it'. *Ermee* fuses 'with' + 'it'; the opposite is *het er niet mee eens zijn* (to disagree)."
  nl.b2.unit01.lesson01.teach.grammar_standpunt:
    title: "I think that working from home is better than working at the office. In my opinion, that is better."
    gloss: "I think that working from home is better than working at the office. In my opinion, that is better."
    note: "A claim is the position you will defend. Both *ik vind dat...* and *volgens mij...* signal that what follows is your opinion, not a stated fact -- the starting point of every argument in this unit."

  nl.b2.unit01.lesson02.teach.omdat:
    title: because
    gloss: "because (subordinating)"
    note: "*Omdat* gives a reason and sends its verb to the end of the clause: *...omdat het rustig is*. Compare *want* (next card), which does not change the word order."
    example_gloss: "I work from home, because it is quiet."
  nl.b2.unit01.lesson02.teach.want:
    title: "because / for"
    gloss: "because / for (coordinating)"
    note: "*Want* also means 'because', but it joins two main clauses and keeps normal word order: *...want dat is fijn* (not '...want dat fijn is'). English 'because' hides this split that Dutch makes."
    example_gloss: "I stay home, because that is nice."
  nl.b2.unit01.lesson02.teach.ten_eerste_tweede:
    title: "firstly, secondly"
    gloss: "firstly..., secondly..."
    note: "*Ten eerste... ten tweede...* number your reasons so an argument is easy to follow -- the classic way to signpost support."
  nl.b2.unit01.lesson02.teach.daarnaast:
    title: "in addition"
    gloss: "in addition / besides"
    note: "*Daarnaast* adds a further reason. Because it opens the sentence, the verb follows it: *Daarnaast bespaar je geld*."
    example_gloss: "In addition, you save money."
  nl.b2.unit01.lesson02.teach.bijvoorbeeld:
    title: "for example"
    gloss: "for example"
    note: "*Bijvoorbeeld* introduces a concrete example that backs up a reason."
    example_gloss: "You save time, for example commute time."
  nl.b2.unit01.lesson02.teach.uit_onderzoek:
    title: "research shows that..."
    gloss: "research shows that..."
    note: "*Uit onderzoek blijkt dat...* is how you cite evidence in an argument. Like *ik vind dat*, the *dat* sends the following verb to the end."
  nl.b2.unit01.lesson02.teach.reistijd:
    title: "commute time"
    gloss: "commute / travel time"
    example_gloss: "I save a lot of commute time."
  nl.b2.unit01.lesson02.teach.besparen:
    title: "to save"
    gloss: "to save (time, money)"
    note: "*Besparen* = to save. Everyday informal forms: *je bespaart* (you save), *bespaar je* in a fronted sentence."
    example_gloss: "You can save a lot of time."
  nl.b2.unit01.lesson02.teach.veel:
    title: "a lot / much"
    gloss: "a lot / much"
    example_gloss: "I save a lot of time."
  nl.b2.unit01.lesson02.teach.je:
    title: "you (generic)"
    gloss: "you (generic / impersonal)"
    note: "*Je* here is the generic 'you' -- 'you save time' means 'one saves time'. It is the natural way Dutch states a general point in an argument."
    example_gloss: "What do you think of it?"
  nl.b2.unit01.lesson02.teach.productiever:
    title: "more productive"
    gloss: "more productive"
    example_gloss: "At home I am more productive."
  nl.b2.unit01.lesson02.teach.thuis:
    title: "at home"
    gloss: "at home"
    example_gloss: "I like working at home."
  nl.b2.unit01.lesson02.teach.grammar_argumenten:
    title: "Firstly, you save commute time. In addition, you are more productive, because it is quieter at home."
    gloss: "Firstly, you save commute time. In addition, you are more productive, because it is quieter at home."
    note: "Support = the reasons and evidence behind your claim. Number them (*ten eerste*, *daarnaast*), give examples (*bijvoorbeeld*), and cite evidence (*uit onderzoek blijkt dat*) so the argument is easy to follow."

  nl.b2.unit01.lesson03.teach.aan_de_ene_kant:
    title: "on the one hand"
    gloss: "on the one hand"
    note: "*Aan de ene kant...* opens a balanced view; it is almost always paired with *aan de andere kant...* to introduce the opposing point you are about to acknowledge."
  nl.b2.unit01.lesson03.teach.aan_de_andere_kant:
    title: "on the other hand"
    gloss: "on the other hand"
    note: "*Aan de andere kant...* introduces the strongest point against your claim. Acknowledging it (before you rebut it) is what makes a B2 argument convincing rather than one-sided."
  nl.b2.unit01.lesson03.teach.hoewel:
    title: although
    gloss: although
    note: "*Hoewel* concedes a point in a subordinate clause (verb-final): *Hoewel het handig is,...*. It sets up a contrast the main clause will answer."
    example_gloss: "Although it is convenient, I stay flexible."
  nl.b2.unit01.lesson03.teach.natuurlijk:
    title: "of course"
    gloss: "of course / naturally"
    note: "*Natuurlijk* concedes that the opposing point is fair ('of course you miss...') -- a polite way to acknowledge before you push back."
    example_gloss: "Of course you are right."
  nl.b2.unit01.lesson03.teach.dat_klopt:
    title: "That's true."
    gloss: "That's true. / That's correct."
    note: "*Dat klopt* grants that the other side has a real point -- you acknowledge it honestly, then rebut it in the next breath."
  nl.b2.unit01.lesson03.teach.sommigen_vinden:
    title: "some people think that..."
    gloss: "some people think that..."
    note: "*Sommigen vinden dat...* introduces a common objection without owning it yourself -- 'some people think that...' -- so you can then answer it."
  nl.b2.unit01.lesson03.teach.collega:
    title: colleagues
    gloss: colleagues
    note: "*Collega's* (plural of *collega*) takes an apostrophe before the -s, like *foto's* and *auto's*."
    example_gloss: "I miss my colleagues."
  nl.b2.unit01.lesson03.teach.missen:
    title: "to miss"
    gloss: "to miss (someone/something)"
    note: "*Missen* = to miss. Informal forms: *ik mis*, *je mist*, and *mis je* in a fronted sentence."
    example_gloss: "I miss the office sometimes."
  nl.b2.unit01.lesson03.teach.contact_met:
    title: "the contact with..."
    gloss: "the contact with..."
    note: "*Het contact met...* = 'the contact with...' -- the social contact with colleagues is the classic point people raise against working from home."
  nl.b2.unit01.lesson03.teach.soms:
    title: sometimes
    gloss: sometimes
    example_gloss: "Sometimes I work at the office."
  nl.b2.unit01.lesson03.teach.fijn:
    title: "nice / pleasant"
    gloss: "nice / pleasant"
    example_gloss: "Working from home is nice."
  nl.b2.unit01.lesson03.teach.grammar_concessie:
    title: "On the one hand working from home is nice, on the other hand you sometimes miss your colleagues."
    gloss: "On the one hand working from home is nice, on the other hand you sometimes miss your colleagues."
    note: "Acknowledging the other side = naming the strongest point against you fairly, before you answer it. *Aan de ene kant... aan de andere kant...*, *hoewel*, *natuurlijk*, and *dat klopt* all do this without giving up your own position."

  nl.b2.unit01.lesson04.teach.toch:
    title: "yet / still"
    gloss: "yet / still / nevertheless"
    note: "*Toch* answers a concession: you grant the objection, then *toch...* ('still, ...') reasserts your claim. It is the core rebuttal word of this unit."
    example_gloss: "It is busy, yet I keep working."
  nl.b2.unit01.lesson04.teach.daarentegen:
    title: "by contrast"
    gloss: "by contrast / on the other hand"
    note: "*Daarentegen* sets one thing directly against another: 'at the office it's busy; at home, by contrast, it's quiet'. Stronger and more formal than *maar*."
    example_gloss: "At the office it is busy; at home, by contrast, it is quiet."
  nl.b2.unit01.lesson04.teach.maar:
    title: but
    gloss: but
    note: "*Maar* is the everyday contrast word, joining two main clauses with normal word order. It pivots from the acknowledged point back to your claim."
    example_gloss: "It is convenient, but not perfect."
  nl.b2.unit01.lesson04.teach.echter:
    title: however
    gloss: however
    note: "*Echter* is a more formal 'however', usually placed after the finite verb (*Het kan echter eenzaam zijn*). Same job as *maar*, higher register."
    example_gloss: "Working from home is nice. However, it can be lonely."
  nl.b2.unit01.lesson04.teach.neemt_niet_weg:
    title: "that does not change the fact that..."
    gloss: "that does not change the fact that..."
    note: "*Dat neemt niet weg dat...* is a set B2 rebuttal frame: you accept the objection, but say it does not undo your claim. The *dat* sends the following verb to the end."
  nl.b2.unit01.lesson04.teach.kortom:
    title: "in short"
    gloss: "in short"
    note: "*Kortom* signposts your conclusion -- it wraps the argument up: 'in short, ...'. Opening with it puts the verb next: *Kortom, thuiswerken is beter*."
    example_gloss: "In short, working from home is better."
  nl.b2.unit01.lesson04.teach.voordelen:
    title: advantages
    gloss: "advantages (plural of voordeel)"
    example_gloss: "Working from home has many advantages."
  nl.b2.unit01.lesson04.teach.nadelen:
    title: disadvantages
    gloss: "disadvantages (plural of nadeel)"
    example_gloss: "Working from home also has disadvantages."
  nl.b2.unit01.lesson04.teach.wegen:
    title: "to weigh"
    gloss: "to weigh (carry weight)"
    note: "*Wegen* here means 'to carry weight' in an argument. *De voordelen wegen zwaarder* = 'the advantages weigh heavier / count for more'. Singular: *weegt*."
    example_gloss: "The advantages weigh heavier."
  nl.b2.unit01.lesson04.teach.zwaarder:
    title: heavier
    gloss: "heavier (comparative of zwaar)"
    example_gloss: "This argument weighs heavier."
  nl.b2.unit01.lesson04.teach.vrijheid:
    title: freedom
    gloss: freedom
    example_gloss: "Working from home gives a lot of freedom."
  nl.b2.unit01.lesson04.teach.heeft:
    title: "has advantages"
    gloss: "has advantages"
    note: "*Heeft* = 'has' (from *hebben*). *Op kantoor werken heeft voordelen* concedes the other side has advantages -- before you rebut."
  nl.b2.unit01.lesson04.teach.grammar_weerlegging:
    title: "That's true, but that does not change the fact that the advantages weigh heavier. In short, working from home is better."
    gloss: "That's true, but that does not change the fact that the advantages weigh heavier. In short, working from home is better."
    note: "Rebutting = answering the acknowledged objection without giving up your claim. *Toch*, *maar*, *echter*, *daarentegen*, and *dat neemt niet weg dat...* all pivot back to your position; *kortom* signposts the conclusion."

  nl.b2.unit01.lesson05.teach.betoog:
    title: "Reading: working from home is a good development"
    gloss: "More and more people work from home. I am convinced that this is a good development. Firstly, you save a lot of commute time, and research shows that people who work from home are often more productive. Of course, some say that at home you miss the contact with colleagues. That's true, but that does not change the fact that you can still call and video-call. In short, the advantages weigh heavier than the disadvantages."
    glosses:
      Steeds: "increasingly (steeds meer = more and more)"
      mensen: "people"
      ervan: "of it (ervan overtuigd = convinced of it)"
      overtuigd: "convinced (past participle of overtuigen)"
      goede: "good (inflected form of goed)"
      ontwikkeling: "development"
      Ten: "first (ten eerste = firstly)"
      eerste: "first(ly)"
      bespaar: "save (from besparen, to save)"
      reistijd: "commute time / travel time"
      onderzoek: "research"
      blijkt: "shows / turns out (uit onderzoek blijkt = research shows)"
      thuiswerkers: "people who work from home"
      vaak: "often"
      productiever: "more productive"
      Natuurlijk: "of course / naturally"
      sommigen: "some people"
      collega's: "colleagues"
      mist: "miss (from missen, to miss)"
      klopt: "is correct (Dat klopt = that's true)"
      neemt: "takes (dat neemt niet weg dat = that does not change the fact that)"
      weg: "away (part of 'neemt niet weg' = does not undo)"
      nog: "still (nog steeds = still)"
      steeds: "still (nog steeds = still)"
      kunt: "can (from kunnen)"
      bellen: "to call (on the phone)"
      videobellen: "to video-call"
      Kortom: "in short"
      voordelen: "advantages"
      wegen: "weigh (carry weight)"
      zwaarder: "heavier"
      nadelen: "disadvantages"

  nl.b2.unit01.lesson06.teach.waarom_denk_je:
    title: "Why do you think that?"
    gloss: "Why do you think that?"
    note: "*Waarom denk je dat?* asks a debating partner to support their claim -- the cue to give your reasons and evidence."
  nl.b2.unit01.lesson06.teach.daar_zit_wat_in:
    title: "There's something to that."
    gloss: "There's something to that. / You have a point."
    note: "*Daar zit wat in* concedes that the other person's argument is reasonable -- a natural way to acknowledge a good point in discussion."
  nl.b2.unit01.lesson06.teach.dialogue_lotte_claim:
    title: "Lotte: I think working from home is better than working at the office."
    gloss: "Lotte: I think working from home is better than working at the office."
  nl.b2.unit01.lesson06.teach.dialogue_omar_why:
    title: "Omar: Why do you think that?"
    gloss: "Omar: Why do you think that?"
  nl.b2.unit01.lesson06.teach.dialogue_lotte_support:
    title: "Lotte: Firstly, you save a lot of commute time, and research shows that people who work from home are more productive."
    gloss: "Lotte: Firstly, you save a lot of commute time, and research shows that people who work from home are more productive."
  nl.b2.unit01.lesson06.teach.dialogue_omar_objection:
    title: "Omar: On the other hand, you miss the contact with your colleagues."
    gloss: "Omar: On the other hand, you miss the contact with your colleagues."
  nl.b2.unit01.lesson06.teach.dialogue_lotte_rebuttal:
    title: "Lotte: That's true, but that does not change the fact that you can video-call. In short, the advantages weigh heavier."
    gloss: "Lotte: That's true, but that does not change the fact that you can video-call. In short, the advantages weigh heavier."
  nl.b2.unit01.lesson06.teach.dialogue_omar_concede:
    title: "Omar: There's something to that."
    gloss: "Omar: There's something to that."
  nl.b2.unit01.lesson06.teach.grammar_volledig_argument:
    title: "I think working from home is better than working at the office. Firstly, you save a lot of commute time. Of course, you sometimes miss your colleagues. Still, the advantages weigh heavier."
    gloss: "I think working from home is better than working at the office. Firstly, you save a lot of commute time. Of course, you sometimes miss your colleagues. Still, the advantages weigh heavier."
    note: "A complete argument has four moves: claim (*ik vind dat...*), support (*ten eerste...*), acknowledged objection (*natuurlijk...*), and rebuttal (*toch...*). This is exactly what you produce in the speaking and writing tasks of this lesson."

exercises:
  nl.b2.unit01.lesson01.exercise01.recognize_standpunt:
    instruction: "What does this word mean?"
    correct_option: "a position / viewpoint"
    distractors: [a question, an answer, an agreement]
    accepted_answers: [{value: "a position / viewpoint", status: correct}]
    feedback: "Een standpunt is a position or point of view -- the claim you defend."
  nl.b2.unit01.lesson01.exercise02.listen_claim:
    instruction: "Listen and select the meaning of what you hear."
    correct_option: "I think that working from home is better than working at the office."
    distractors: ["I think that working at the office is better than working from home.", "I think that working from home is nicer than travelling.", "I know that working from home is better than working at the office."]
    accepted_answers: [{value: "I think that working from home is better than working at the office.", status: correct}]
    feedback: "Ik vind dat thuiswerken beter is dan op kantoor werken means I think that working from home is better than working at the office."
  nl.b2.unit01.lesson01.exercise03.match_claim_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {thuiswerken: "working from home", "op kantoor werken": "working at the office", "een standpunt": "a position / viewpoint", "Ik vind dat...": "I think that...", "Volgens mij...": "In my opinion...", beter: better, dan: than, "Ik ben het ermee eens.": "I agree with it."}
        status: correct
    feedback: "These are this lesson's claim-stating words."
  nl.b2.unit01.lesson01.exercise04.order_claim:
    instruction: "Put the words in order: I think that working from home is better."
    accepted_answers:
      - {value: "Ik vind dat thuiswerken beter is", status: correct}
    feedback: "Ik vind dat thuiswerken beter is means I think that working from home is better."
  nl.b2.unit01.lesson01.exercise05.translate_volgens_mij:
    instruction: "Translate into Dutch: In my opinion, working from home is better."
    accepted_answers:
      - {value: "Volgens mij is thuiswerken beter", status: correct}
      - {value: "Thuiswerken is volgens mij beter", status: correct}
    feedback: "Volgens mij is thuiswerken beter means in my opinion, working from home is better."
  nl.b2.unit01.lesson01.exercise06.speak_ermee_eens:
    instruction: "Say aloud in Dutch: I agree with it."
    accepted_answers:
      - {value: "Ik ben het ermee eens", status: correct}
    feedback: "Ik ben het ermee eens means I agree with it."
