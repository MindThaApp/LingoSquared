course:
  title: "Dutch A1"
  description: "Beginner Dutch for describing a person's basic physical appearance: height and age impressions, hair and eye color, the core question Hoe ziet ... eruit?, and comparing two people's appearance."

units:
  nl.a1.unit30.appearance: {title: "Describing appearance"}

lessons:
  nl.a1.unit30.lesson01.lang_klein_oud_jong: {title: "Tall, short, old, and young"}
  nl.a1.unit30.lesson02.haar_beschrijven: {title: "Describing hair"}
  nl.a1.unit30.lesson03.ogen_en_eruitzien: {title: "Eyes and what does someone look like?"}
  nl.a1.unit30.lesson04.taalcafe_nina: {title: "Lotte describes Nina"}
  nl.a1.unit30.lesson05.sander_fenna_vergelijken: {title: "Comparing Sander and Fenna"}
  nl.a1.unit30.lesson06.taalcafe_herkenning: {title: "Omar recognizes Nina"}

teaching:
  nl.a1.unit30.lesson01.teach.lang_klein: {title: "Tall and short", gloss: "tall / short", note: "*Lang* describes a tall person; *klein* describes a short person (the same word used for a small object elsewhere in this course).", example_gloss: ["Fenna is tall.", "Sander is short."]}
  nl.a1.unit30.lesson01.teach.oud_jong: {title: "Old and young", gloss: "old / young", note: "*Oud* and *jong* here describe a general appearance impression, not an exact number of years.", example_gloss: ["Grandpa is old.", "Omar is young."]}
  nl.a1.unit30.lesson01.teach.oud_note: {title: "Oud: a number or an impression", gloss: "Oud can mean a precise number of years, as in Hoe oud ben je?, or a general impression without a number, as in Opa is oud.", note: "You already know *oud* from asking someone's exact age (*Hoe oud ben je?*). Here it describes how old someone LOOKS, with no number attached."}
  nl.a1.unit30.lesson01.teach.fenna_sander_phrase: {title: "Fenna is tall and Sander is short", gloss: "Fenna is tall and Sander is short.", note: "A simple combined sentence using *en* (and), setting up the direct comparison in lesson05."}

  nl.a1.unit30.lesson02.teach.haar_noun: {title: "Hair", gloss: "the hair", note: "*Haar* is a het-word: *het haar*.", example_gloss: "Omar has short black hair."}
  nl.a1.unit30.lesson02.teach.haar_kleuren: {title: "Blond, brown, and grey", gloss: "blond / brown / grey", note: "Three hair colors. *Zwart* (black) was covered earlier for clothing -- reused here for hair.", example_gloss: ["Lotte has blond hair.", "Sander has brown hair.", "Grandpa has grey hair."]}
  nl.a1.unit30.lesson02.teach.haar_lengte: {title: "Long and short (hair)", gloss: "long / short (hair)", note: "*Lang* (long) reuses the height word from lesson01, now describing hair length instead. *Kort* (short) is new here.", example_gloss: ["Fenna has long hair.", "Sander has short hair."]}
  nl.a1.unit30.lesson02.teach.haar_agreement_note: {title: "Haar takes a bare adjective", gloss: "Haar is a het-word with no article, so the adjective stays bare: kort haar, lang haar, blond haar, bruin haar, grijs haar, zwart haar.", note: "No -e ending before *haar* in this indefinite, article-less form -- contrast this with *ogen* in lesson03, which does take -e."}
  nl.a1.unit30.lesson02.teach.haar_homoniem_note: {title: "Haar: two meanings", gloss: "Haar has two meanings: 'hair' (this lesson's new noun) and 'her' (the possessive from Unit 5, e.g. haar moeder). Context tells you which is meant.", note: "A real Dutch homonym: *haar* the noun (hair) and *haar* the possessive (her) are spelled identically. The rest of the sentence always makes clear which one is meant."}
  nl.a1.unit30.lesson02.teach.omar_kort_zwart: {title: "Omar has short black hair", gloss: "Omar has short black hair.", note: "Reuses *zwart* (black) from Unit 20's clothing unit."}
  nl.a1.unit30.lesson02.teach.lotte_lang_blond: {title: "Lotte has long blond hair", gloss: "Lotte has long blond hair.", note: "Combines this lesson's length and color vocabulary in one natural sentence."}

  nl.a1.unit30.lesson03.teach.ogen_noun: {title: "Eyes", gloss: "the eyes", note: "*Ogen* is the plural of *het oog*; the plural itself always takes *de*.", example_gloss: "Omar has brown eyes."}
  nl.a1.unit30.lesson03.teach.oog_kleuren: {title: "Blue, brown, and green", gloss: "blue / brown / green", note: "*Blauw* (blue) was covered earlier for clothing; *bruin* (brown) was just taught in lesson02 for hair; *groen* (green) is new here.", example_gloss: ["Lotte has blue eyes.", "Sander has brown eyes.", "Fenna has green eyes."]}
  nl.a1.unit30.lesson03.teach.ogen_agreement_note: {title: "Ogen takes -e", gloss: "With ogen (plural), the adjective gets an extra -e: blauwe ogen, bruine ogen, groene ogen.", note: "Contrast this with lesson02's *haar*, which keeps the adjective bare -- plurals always take -e regardless of de-word/het-word."}
  nl.a1.unit30.lesson03.teach.hoe_ziet_eruit: {title: "What does Lotte look like?", gloss: "What does Lotte look like?", note: "*Hoe ziet ... eruit?* is this unit's core question -- reuse it to ask about anyone's appearance."}
  nl.a1.unit30.lesson03.teach.antwoord_patroon: {title: "Lotte has long blond hair and blue eyes", gloss: "Lotte has long blond hair and blue eyes.", note: "A model answer combining hair and eyes in one sentence with *en*."}

  nl.a1.unit30.lesson04.teach.lotte_intro_nina: {title: "Lotte introduces Nina", gloss: "Lotte: A new girl is coming to the taalcafé. Her name is Nina.", note: "*Er komt* (there is coming / is coming) introduces someone new to the scene."}
  nl.a1.unit30.lesson04.teach.omar_ask_eruit: {title: "Omar asks what she looks like", gloss: "Omar: Okay! What does she look like?", note: "Reuses this unit's core question, now with *ze* (she) instead of a name."}
  nl.a1.unit30.lesson04.teach.lotte_klein_kort_blond: {title: "Lotte describes Nina's height and hair", gloss: "Lotte: She is short and she has short blond hair.", note: "Combines lesson01's *klein* with lesson02's hair vocabulary."}
  nl.a1.unit30.lesson04.teach.omar_ask_ogen: {title: "Omar asks about her eyes", gloss: "Omar: And her eyes?", note: "*Haar* here means 'her' (the possessive from Unit 5), not 'hair' -- see lesson02's homonym note."}
  nl.a1.unit30.lesson04.teach.lotte_groene_ogen: {title: "Lotte describes Nina's eyes", gloss: "Lotte: She has green eyes.", note: "Reuses *groene ogen* from lesson03."}
  nl.a1.unit30.lesson04.teach.omar_bedankt_herken: {title: "Omar will recognize her", gloss: "Omar: Thanks! Then I'll recognize her.", note: "*Herken ik haar wel* -- 'I'll recognize her, no problem' -- *haar* here is again the possessive/object pronoun 'her', not 'hair'."}

  nl.a1.unit30.lesson05.teach.vergelijking:
    title: "Comparing Sander and Fenna"
    gloss: "Sander and Fenna are brother and sister, but they look different. Sander is short and has short brown hair and brown eyes. Fenna is taller than Sander and has long brown hair and green eyes. What do you look like?"
    note: "A short comparison reusing every color/length word taught so far, ending with the unit's core question directed at the reader."
    glosses:
      broer: "brother"
      zus: "sister"
      zien: "look"
      anders: "different"
      klein: "short"
      kort: "short"
      bruin: "brown"
      haar: "hair"
      bruine: "brown"
      ogen: "eyes"
      langer: "taller"
      lang: "long"
      groene: "green"
      eruit: "(part of 'eruit zien' = to look/appear)"
  nl.a1.unit30.lesson05.teach.comparatief_note: {title: "Reusing the comparative pattern", gloss: "You already know this pattern from comparisons: adjective + er + than. Here you use it for people: Fenna is taller than Sander.", note: "The exact *adjective + -er + dan* pattern from Unit 14's backpack-shopping unit, now applied to describing people instead of objects."}
  nl.a1.unit30.lesson05.teach.langer_haar: {title: "Fenna has longer hair than Sander", gloss: "Fenna has longer hair than Sander.", note: "*Langer* stays bare before *haar* (a het-word), the same rule as lesson02's agreement note -- even in the comparative form."}
  nl.a1.unit30.lesson05.teach.ik_heb_haar: {title: "I have short brown hair", gloss: "I have short brown hair.", note: "A model first-person sentence using *Ik heb ...*, ready to reuse when describing your own appearance."}

  nl.a1.unit30.lesson06.teach.omar_kijk_is_dat_nina: {title: "Omar spots Nina", gloss: "Omar: Look, is that Nina? She has short blond hair and green eyes.", note: "*Kijk* (look) was already used the same way in Unit 14's dialogue."}
  nl.a1.unit30.lesson06.teach.lotte_ja_dat_is_nina: {title: "Lotte confirms", gloss: "Lotte: Yes, that's Nina!", note: "A short, natural confirmation."}
  nl.a1.unit30.lesson06.teach.nina_ben_jij_omar: {title: "Nina greets Omar", gloss: "Nina: Hi, are you Omar?", note: "A simple informal greeting question, *ben jij ...?*"}
  nl.a1.unit30.lesson06.teach.omar_leuk_je_te_zien: {title: "Omar greets Nina back", gloss: "Omar: Yes! Nice to meet you, Nina.", note: "*Leuk je te ontmoeten* -- the standard phrase for a genuine first meeting (see Unit 1), not *leuk je te zien*, which is for someone you already know."}
  nl.a1.unit30.lesson06.teach.nina_leuk_je_ook: {title: "Nina returns the greeting", gloss: "Nina: Nice to meet you too!", note: "Closes the dialogue -- Omar successfully recognized Nina from Lotte's earlier description."}

exercises:
  nl.a1.unit30.lesson01.exercise01.choose_fenna_lang:
    instruction: "Choose the English meaning of 'Fenna is lang.'"
    correct_option: "Fenna is tall."
    distractors: ["Fenna is short.", "Fenna is old.", "Fenna is young."]
    accepted_answers: [{value: "Fenna is tall.", status: correct}]
    feedback: "Fenna is lang."
  nl.a1.unit30.lesson01.exercise02.listen_sander_klein:
    instruction: "Listen and choose what the speaker says."
    correct_option: "Sander is short."
    distractors: ["Sander is tall.", "Sander is old.", "Sander is young."]
    accepted_answers: [{value: "Sander is short.", status: correct}]
    feedback: "Sander is klein."
  nl.a1.unit30.lesson01.exercise03.match_lang_klein_oud_jong:
    instruction: "Match each Dutch word or phrase to its meaning."
    accepted_answers: [{value: [{left: lang, right: tall}, {left: klein, right: short}, {left: oud, right: old}, {left: jong, right: young}, {left: "Fenna is lang.", right: "Fenna is tall."}, {left: "Sander is klein.", right: "Sander is short."}, {left: "Opa is oud.", right: "Grandpa is old."}], status: correct}]
    feedback: "Lang/klein/oud/jong describe general height and age impressions."
  nl.a1.unit30.lesson01.exercise04.order_fenna_sander:
    instruction: "Put the words in order to say 'Fenna is tall and Sander is short.'"
    correct_option: "Fenna is lang en Sander is klein"
    accepted_answers: [{value: "Fenna is lang en Sander is klein", status: correct}]
    feedback: "Fenna is lang en Sander is klein."
  nl.a1.unit30.lesson01.exercise05.listen_order_opa_oud:
    instruction: "Listen and put the words in the order you hear."
    correct_option: "Opa is oud"
    accepted_answers: [{value: "Opa is oud", status: correct}]
    feedback: "The complete sentence is Opa is oud."
  nl.a1.unit30.lesson01.exercise06.translate_young:
    instruction: "Translate into Dutch: young."
    accepted_answers: [{value: jong, status: correct}]
    feedback: "Jong means young."

  nl.a1.unit30.lesson02.exercise01.choose_lotte_haar:
    instruction: "Choose the English meaning of 'Lotte heeft lang blond haar.'"
    correct_option: "Lotte has long blond hair."
    distractors: ["Lotte has short black hair.", "Lotte has long brown hair.", "Lotte has grey hair."]
    accepted_answers: [{value: "Lotte has long blond hair.", status: correct}]
    feedback: "Lotte heeft lang blond haar."
  nl.a1.unit30.lesson02.exercise02.listen_omar_haar:
    instruction: "Listen and choose what the speaker says."
    correct_option: "Omar has short black hair."
    distractors: ["Omar has long black hair.", "Omar has short brown hair.", "Omar has short blond hair."]
    accepted_answers: [{value: "Omar has short black hair.", status: correct}]
    feedback: "Omar heeft kort zwart haar."
  nl.a1.unit30.lesson02.exercise03.match_haar_words:
    instruction: "Match each Dutch word or phrase to its meaning."
    accepted_answers: [{value: [{left: haar, right: hair}, {left: blond, right: blond}, {left: bruin, right: brown}, {left: grijs, right: grey}, {left: kort, right: short}, {left: zwart, right: black}, {left: "Lotte heeft lang blond haar.", right: "Lotte has long blond hair."}, {left: "Omar heeft kort zwart haar.", right: "Omar has short black hair."}], status: correct}]
    feedback: "Haar means hair; blond/bruin/grijs/zwart are hair colors."
  nl.a1.unit30.lesson02.exercise04.order_omar_haar:
    instruction: "Put the words in order to say 'Omar has short black hair.'"
    correct_option: "Omar heeft kort zwart haar"
    accepted_answers: [{value: "Omar heeft kort zwart haar", status: correct}]
    feedback: "Omar heeft kort zwart haar."
  nl.a1.unit30.lesson02.exercise05.listen_order_lotte_haar:
    instruction: "Listen and put the words in the order you hear."
    correct_option: "Lotte heeft lang blond haar"
    accepted_answers: [{value: "Lotte heeft lang blond haar", status: correct}]
    feedback: "The complete sentence is Lotte heeft lang blond haar."
  nl.a1.unit30.lesson02.exercise06.complete_lotte_haar:
    instruction: "Complete the sentence."
    accepted_answers: [{value: haar, status: correct}]
    feedback: "Lotte heeft lang blond haar."

  nl.a1.unit30.lesson03.exercise01.choose_hoe_ziet_eruit:
    instruction: "Choose the English meaning of 'Hoe ziet Lotte eruit?'"
    correct_option: "What does Lotte look like?"
    distractors: ["How old is Lotte?", "Where is Lotte?", "What does Lotte like doing?"]
    accepted_answers: [{value: "What does Lotte look like?", status: correct}]
    feedback: "Hoe ziet Lotte eruit?"
  nl.a1.unit30.lesson03.exercise02.listen_lotte_haar_ogen:
    instruction: "Listen and choose what the speaker says."
    correct_option: "Lotte has long blond hair and blue eyes."
    distractors: ["Lotte has short blond hair and blue eyes.", "Lotte has long blond hair and green eyes.", "Lotte has long brown hair and blue eyes."]
    accepted_answers: [{value: "Lotte has long blond hair and blue eyes.", status: correct}]
    feedback: "Lotte heeft lang blond haar en blauwe ogen."
  nl.a1.unit30.lesson03.exercise03.match_ogen_words:
    instruction: "Match each Dutch word or phrase to its meaning."
    accepted_answers: [{value: [{left: ogen, right: eyes}, {left: blauw, right: blue}, {left: bruin, right: brown}, {left: groen, right: green}, {left: "Lotte heeft blauwe ogen.", right: "Lotte has blue eyes."}, {left: "Sander heeft bruine ogen.", right: "Sander has brown eyes."}, {left: "Fenna heeft groene ogen.", right: "Fenna has green eyes."}, {left: "Hoe ziet Lotte eruit?", right: "What does Lotte look like?"}], status: correct}]
    feedback: "Ogen means eyes; blauw/bruin/groen are eye colors."
  nl.a1.unit30.lesson03.exercise04.order_hoe_ziet_eruit:
    instruction: "Put the words in order to ask 'What does Lotte look like?'"
    correct_option: "Hoe ziet Lotte eruit"
    accepted_answers: [{value: "Hoe ziet Lotte eruit", status: correct}]
    feedback: "The complete question is Hoe ziet Lotte eruit?"
  nl.a1.unit30.lesson03.exercise05.listen_order_fenna_ogen:
    instruction: "Listen and put the words in the order you hear."
    correct_option: "Fenna heeft groene ogen"
    accepted_answers: [{value: "Fenna heeft groene ogen", status: correct}]
    feedback: "The complete sentence is Fenna heeft groene ogen."
  nl.a1.unit30.lesson03.exercise06.complete_hoe_ziet_eruit:
    instruction: "Complete the question."
    accepted_answers: [{value: eruit, status: correct}]
    feedback: "Hoe ziet Lotte eruit?"
  nl.a1.unit30.lesson03.exercise07.respond_omar_eruit:
    instruction: "Answer in Dutch: say Omar has short black hair and brown eyes."
    accepted_answers: [{value: "Omar heeft kort zwart haar en bruine ogen.", status: correct}, {value: "Omar heeft kort zwart haar en bruine ogen", status: correct}]
    feedback: "Omar heeft kort zwart haar en bruine ogen."

  nl.a1.unit30.lesson04.exercise01.listen_opening_nina:
    instruction: "Listen and choose what Lotte says."
    correct_option: "A new girl is coming to the taalcafé. Her name is Nina."
    distractors: ["A new boy is coming to the taalcafé.", "Nina is not coming to the taalcafé.", "Nina already came to the taalcafé."]
    accepted_answers: [{value: "A new girl is coming to the taalcafé. Her name is Nina.", status: correct}]
    feedback: "Er komt een nieuw meisje naar het taalcafé. Ze heet Nina."
  nl.a1.unit30.lesson04.exercise02.comprehend_nina_name:
    instruction: "Listen to the dialogue and choose the new person's name."
    correct_option: Nina
    distractors: [Fenna, Lotte, Marieke]
    accepted_answers: [{value: Nina, status: correct}]
    feedback: "Lotte says: Ze heet Nina."
  nl.a1.unit30.lesson04.exercise03.comprehend_nina_height_hair:
    instruction: "Listen to the dialogue and choose what Lotte says about Nina's height and hair."
    correct_option: "short, with short blond hair"
    distractors: ["tall, with long blond hair", "short, with long black hair", "tall, with short brown hair"]
    accepted_answers: [{value: "short, with short blond hair", status: correct}]
    feedback: "Lotte says: Ze is klein en ze heeft kort blond haar."
  nl.a1.unit30.lesson04.exercise04.comprehend_nina_ogen:
    instruction: "Listen to the dialogue and choose Nina's eye color."
    correct_option: green
    distractors: [blue, brown, grey]
    accepted_answers: [{value: green, status: correct}]
    feedback: "Lotte says: Ze heeft groene ogen."
  nl.a1.unit30.lesson04.exercise05.order_nina_hair:
    instruction: "Put the words in order to say 'She has short blond hair.'"
    correct_option: "Ze heeft kort blond haar"
    accepted_answers: [{value: "Ze heeft kort blond haar", status: correct}]
    feedback: "Ze heeft kort blond haar."
  nl.a1.unit30.lesson04.exercise06.respond_nina_eruit:
    instruction: "Answer in Dutch: describe Nina using the facts from this dialogue (height, hair, eyes)."
    accepted_answers: [{value: "Ze is klein en ze heeft kort blond haar en groene ogen.", status: correct}, {value: "Ze is klein en ze heeft kort blond haar en groene ogen", status: correct}, {value: "Ze is klein en heeft kort blond haar en groene ogen.", status: correct}, {value: "Ze is klein en heeft kort blond haar en groene ogen", status: correct}]
    feedback: "Ze is klein en ze heeft kort blond haar en groene ogen."
  nl.a1.unit30.lesson04.exercise07.listen_type_nina_ogen:
    instruction: "Listen and type the complete Dutch sentence."
    accepted_answers: [{value: "Ze heeft groene ogen.", status: correct}, {value: "Ze heeft groene ogen", status: correct}]
    feedback: "Ze heeft groene ogen."
  nl.a1.unit30.lesson04.exercise08.write_nina_appearance:
    instruction: "Write in Dutch: say Nina is short and has short blond hair."
    accepted_answers: [{value: "Nina is klein en heeft kort blond haar.", status: correct}, {value: "Nina is klein en heeft kort blond haar", status: correct}]
    feedback: "Nina is klein en heeft kort blond haar."

  nl.a1.unit30.lesson05.exercise01.read_different:
    instruction: "Read the text and choose whether Sander and Fenna look alike."
    correct_option: "No, the text says they look different."
    distractors: ["Yes, they look identical.", "The text does not say.", "Only their hair looks the same."]
    accepted_answers: [{value: "No, the text says they look different.", status: correct}]
    feedback: "The text says: ze zien er anders uit -- they look different."
  nl.a1.unit30.lesson05.exercise02.read_sander:
    instruction: "Read the text and choose how it describes Sander's hair and eyes."
    correct_option: "short brown hair and brown eyes"
    distractors: ["long brown hair and green eyes", "short black hair and blue eyes", "long blond hair and brown eyes"]
    accepted_answers: [{value: "short brown hair and brown eyes", status: correct}]
    feedback: "Sander is klein en heeft kort bruin haar en bruine ogen."
  nl.a1.unit30.lesson05.exercise03.read_taller:
    instruction: "Read the text and choose who is taller."
    correct_option: Fenna
    distractors: [Sander, "Neither, they are the same height."]
    accepted_answers: [{value: Fenna, status: correct}]
    feedback: "The text says: Fenna is langer dan Sander."
  nl.a1.unit30.lesson05.exercise04.read_fenna:
    instruction: "Read the text and choose how it describes Fenna's hair and eyes."
    correct_option: "long brown hair and green eyes"
    distractors: ["short brown hair and brown eyes", "long blond hair and blue eyes", "long brown hair and blue eyes"]
    accepted_answers: [{value: "long brown hair and green eyes", status: correct}]
    feedback: "Fenna heeft lang bruin haar en groene ogen."
  nl.a1.unit30.lesson05.exercise05.match_siblings:
    instruction: "Match each name or word to what the text says about it."
    accepted_answers: [{value: [{left: Sander, right: "klein, kort bruin haar, bruine ogen"}, {left: Fenna, right: "langer dan Sander, lang bruin haar, groene ogen"}, {left: broer, right: brother}, {left: zus, right: sister}], status: correct}]
    feedback: "Sander and Fenna are brother and sister, but look quite different."
  nl.a1.unit30.lesson05.exercise06.listen_fenna_langer:
    instruction: "Listen and choose what the speaker says."
    correct_option: "Fenna is taller than Sander."
    distractors: ["Sander is taller than Fenna.", "Fenna is shorter than Sander.", "Fenna and Sander are the same height."]
    accepted_answers: [{value: "Fenna is taller than Sander.", status: correct}]
    feedback: "Fenna is langer dan Sander."
