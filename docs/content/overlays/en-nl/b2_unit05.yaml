course:
  title: Dutch B2
  description: >-
    Upper-intermediate Dutch: adapt your formality to the audience -- say
    the same thing appropriately to a close friend and to an institution.
    Switch between informal je/jij and formal u, between Hoi/Groetjes and
    Geachte heer/mevrouw / Met vriendelijke groet, and between a direct
    request (kun je ...?) and an indirect polite one (Zou het mogelijk zijn
    om ...?), around the everyday task of rescheduling an appointment.

units:
  nl.b2.unit05.register:
    title: "Register"
    description: Adapt your formality to who you are addressing -- deliver the same request appropriately to a close friend and to an institution, switching pronouns, greetings, closings and directness.

lessons:
  nl.b2.unit05.lesson01.jij_of_u:
    title: "You or u?"
  nl.b2.unit05.lesson02.aanhef_afsluiting:
    title: "Openings and closings"
  nl.b2.unit05.lesson03.directheid:
    title: "Direct or polite?"
  nl.b2.unit05.lesson04.de_afspraak:
    title: "Rescheduling the appointment"
  nl.b2.unit05.lesson05.twee_berichten:
    title: "Two messages, two readers"
  nl.b2.unit05.lesson06.register_kiezen:
    title: "Choosing the right register"

teaching:
  nl.b2.unit05.lesson01.teach.bericht:
    title: "Lotte is writing a message."
    gloss: "Lotte is writing a message."
    note: "The situation this whole unit works with: your friend Lotte has to send the same request to two very different readers. *Een bericht* = 'a message'."
  nl.b2.unit05.lesson01.teach.je:
    title: "you (informal)"
    gloss: "you / your (informal)"
    note: "The informal 'you': *je/jij* as the subject ('you'), *jou* as the object ('you'), *jouw* as the possessive ('your'). Use it with friends, family and peers -- like Lotte with Omar. *Jij* and *jou* are the stressed forms; *je* is the everyday one."
    example_gloss: "I'm writing you a message."
  nl.b2.unit05.lesson01.teach.u:
    title: "you (formal)"
    gloss: "you / your (formal)"
    note: "The formal 'you': *u* covers both subject and object ('you'), *uw* is the possessive ('your'). Use it with strangers, officials and institutions. There is no separate object form -- *u* does both jobs."
    example_gloss: "I'm writing you a message."
  nl.b2.unit05.lesson01.teach.heb_je:
    title: "Do you have a moment?"
    gloss: "Do you have a moment?"
    note: "Informal. *Heb je...?* is the *je* form of *hebben* ('to have'). *Even* = 'a moment / just'. Compare the formal version on the next card -- same question, different register."
  nl.b2.unit05.lesson01.teach.heeft_u:
    title: "Do you have time? (formal)"
    gloss: "Do you have time?"
    note: "Formal. With *u* the verb takes the 3rd-person-like form: *u heeft* (or *u hebt*), not *u heb*. This verb shift is the heart of switching into the formal register."
  nl.b2.unit05.lesson01.teach.kun_je:
    title: "Can you help? (informal)"
    gloss: "Can you help?"
    note: "Informal. *Kun je...?* is the *je* form of *kunnen* ('can'). It is direct and perfectly polite between friends."
  nl.b2.unit05.lesson01.teach.kunt_u:
    title: "Can you help? (formal)"
    gloss: "Can you help?"
    note: "Formal. *Kunt u...?* -- again *u* takes the -t form (*u kunt*, not *u kun*). Same question as *Kun je helpen?*, shifted up in formality."
  nl.b2.unit05.lesson01.teach.grammar_jij_u:
    title: "Do you have time? / Do you have time? Can you help? / Can you help?"
    gloss: "Do you have time? (informal / formal). Can you help? (informal / formal)."
    note: "The core move of this unit: *je -> u* changes the verb too. *heb je -> heeft u*, *kun je -> kunt u*. Choose *je* for a friend and *u* for an institution."

  nl.b2.unit05.lesson02.teach.hoi:
    title: "Hi / Hey"
    gloss: "Hi / Hey"
    note: "*Hoi* and *Hé* are informal greetings -- for a friend, a text, a chat. *Hé Omar!* is exactly how Lotte opens a message to Omar."
    example_gloss: "Hi Omar!"
  nl.b2.unit05.lesson02.teach.groetjes:
    title: "Cheers (sign-off)"
    gloss: "Cheers / take care"
    note: "*Groetjes* is the informal way to sign off a message to a friend, like 'cheers' or 'take care'. Never use it in a formal letter."
    example_gloss: "Cheers, Lotte"
  nl.b2.unit05.lesson02.teach.geachte:
    title: "Dear Sir or Madam"
    gloss: "Dear Sir or Madam"
    note: "*Geachte heer/mevrouw* is the standard formal salutation when you don't know the reader's name -- the opener for a letter or e-mail to an institution. *Heer* = 'sir/gentleman', *mevrouw* = 'madam'."
  nl.b2.unit05.lesson02.teach.mvg:
    title: "Kind regards"
    gloss: "Kind regards"
    note: "*Met vriendelijke groet* ('with kind regards') is the everyday formal closing -- the standard way to end a polite e-mail or letter. Often abbreviated 'mvg' in casual writing, but write it out in a real letter."
  nl.b2.unit05.lesson02.teach.hoogachtend:
    title: "Yours faithfully"
    gloss: "Yours faithfully (most formal)"
    note: "*Hoogachtend* is the MOST formal sign-off -- more distant than *Met vriendelijke groet*, for very official letters. Roughly 'yours faithfully'."
    example_gloss: "Yours faithfully, Lotte"
  nl.b2.unit05.lesson02.teach.beste:
    title: "Dear (neutral)"
    gloss: "Dear ... (neutral)"
    note: "*Beste* + a name ('Beste Omar,') is the neutral middle ground -- warmer than *Geachte* but still fine for someone you know a little. It sits between the informal *Hoi* and the formal *Geachte*."
    example_gloss: "Dear Omar,"
  nl.b2.unit05.lesson02.teach.grammar_aanhef:
    title: "Hi Omar! Cheers. Dear Sir or Madam, Kind regards."
    gloss: "Hi Omar! Cheers. Dear Sir or Madam, Kind regards."
    note: "Openings and closings come in matched registers. Informal: *Hoi/Hé* ... *Groetjes*. Formal: *Geachte heer/mevrouw* ... *Met vriendelijke groet* (or *Hoogachtend* for the most official). Mixing them -- 'Geachte heer/mevrouw ... Groetjes' -- reads as a mistake."

  nl.b2.unit05.lesson03.teach.dit_doen:
    title: "Can you do this? (informal)"
    gloss: "Can you do this?"
    note: "Informal and direct: *Kun je dit doen?* Between friends a direct request is the normal, friendly choice. *Dit* = 'this', *doen* = 'to do'."
  nl.b2.unit05.lesson03.teach.alsjeblieft:
    title: "please (informal)"
    gloss: "please (informal)"
    note: "*Alsjeblieft* is the informal 'please' -- it literally contains *je*. Use it with friends."
    example_gloss: "Can you do this, please?"
  nl.b2.unit05.lesson03.teach.alstublieft:
    title: "please (formal)"
    gloss: "please (formal)"
    note: "*Alstublieft* is the formal 'please' -- it contains *u*. Same word, one register up: *alsjeblieft* (je) vs *alstublieft* (u)."
    example_gloss: "Can you do this, please? (formal)"
  nl.b2.unit05.lesson03.teach.zou_u_willen:
    title: "Would you be willing to do it?"
    gloss: "Would you be willing to do it?"
    note: "Formal and indirect. English can stay direct and still sound polite ('Can you...?'); formal Dutch softens by going indirect: *Zou u het willen doen?* ('would you be willing to do it?'). *Zou* = 'would', *willen* = 'to want/be willing'."
  nl.b2.unit05.lesson03.teach.zo_vriendelijk:
    title: "Would you be so kind?"
    gloss: "Would you be so kind?"
    note: "The very polite formal frame: *Zou u zo vriendelijk willen zijn...?* ('would you be so kind as to...?'). Reserved for formal requests to an institution. *Zo vriendelijk* = 'so kind'."
  nl.b2.unit05.lesson03.teach.mogelijk:
    title: "possible"
    gloss: "possible"
    note: "*Mogelijk* = 'possible'. The formula *Zou het mogelijk zijn om ... te ...?* ('would it be possible to...?') is a very common polite, indirect way to make a formal request -- it names no one, which makes it feel respectful."
    example_gloss: "Would it be possible to help?"
  nl.b2.unit05.lesson03.teach.grammar_directheid:
    title: "Can you do this? Would you be willing to do it? Would it be possible to help?"
    gloss: "Can you do this? Would you be willing to do it? Would it be possible to help?"
    note: "Directness is a register signal. Informal: a direct *Kun je...?* or an imperative + *alsjeblieft*. Formal: an indirect *Zou u ... willen...?* or *Zou het mogelijk zijn om...?* + *alstublieft*. The more indirect, the more formal."

  nl.b2.unit05.lesson04.teach.afspraak:
    title: "the appointment"
    gloss: "the appointment"
    note: "*De afspraak* = 'the appointment / arrangement' -- a meeting time you've agreed with someone. This is what Lotte needs to change."
    example_gloss: "I have an appointment."
  nl.b2.unit05.lesson04.teach.verzetten:
    title: "to reschedule"
    gloss: "to reschedule / move"
    note: "*Verzetten* = 'to move' an appointment to another time, i.e. 'to reschedule'. *De afspraak verzetten* = 'to reschedule the appointment'. *Wil* = 'want' (the *ik* form of *willen*)."
    example_gloss: "I want to reschedule the appointment."
  nl.b2.unit05.lesson04.teach.maandag:
    title: "Monday"
    gloss: "Monday"
    note: "*Maandag* = 'Monday'. *Ik kan maandag niet* = 'I can't (make it) on Monday' -- Dutch needs no 'on'. *Kan* = 'can' (the *ik* form of *kunnen*), *niet* = 'not'."
    example_gloss: "I can't on Monday."
  nl.b2.unit05.lesson04.teach.helaas:
    title: "unfortunately"
    gloss: "unfortunately"
    note: "*Helaas* = 'unfortunately' -- a softener that makes a refusal or bad news sound more considerate, useful in both registers. *Ik kan maandag helaas niet* = 'unfortunately I can't on Monday'."
    example_gloss: "Unfortunately I can't on Monday."
  nl.b2.unit05.lesson04.teach.volgende_week:
    title: "next week"
    gloss: "next week"
    note: "*Volgende week* = 'next week'. *Kan het volgende week?* = 'can it be next week?' -- an informal way to propose a new time."
    example_gloss: "Can it be next week?"
  nl.b2.unit05.lesson04.teach.informele_vraag:
    title: "Can we reschedule the appointment? (informal)"
    gloss: "Can we reschedule the appointment?"
    note: "The request in its informal form, to a friend: *Kunnen we de afspraak verzetten?* Direct, with *we* and no softening frame. *We* = 'we'."
  nl.b2.unit05.lesson04.teach.formele_vraag:
    title: "Would it be possible to reschedule our appointment? (formal)"
    gloss: "Would it be possible to reschedule our appointment?"
    note: "The SAME request in formal form, to an institution: *Zou het mogelijk zijn om onze afspraak te verzetten?* Indirect and polite. *Onze* = 'our' (the form used with a *de*-word like *afspraak*; *ons* goes with *het*-words)."
  nl.b2.unit05.lesson04.teach.grammar_afspraak:
    title: "Can we reschedule the appointment? / Would it be possible to reschedule our appointment?"
    gloss: "Can we reschedule the appointment? (informal) / Would it be possible to reschedule our appointment? (formal)"
    note: "One request, two registers. Informal: *Kunnen we de afspraak verzetten?* Formal: *Zou het mogelijk zijn om onze afspraak te verzetten?* Same content, different wrapping for a different reader -- the whole point of this unit."

  nl.b2.unit05.lesson05.teach.schikken:
    title: "to suit / be convenient"
    gloss: "to suit / be convenient"
    note: "*Schikken* = '(for a time) to suit / be convenient'. *Schikt het volgende week?* = 'does next week suit?' -- a polite, slightly formal way to propose a new time, the counterpart to the informal *Kan het volgende week?*"
    example_gloss: "Does next week suit?"
  nl.b2.unit05.lesson05.teach.tekst_informeel:
    title: "Informal message (to Omar)"
    gloss: "Hi Omar! Can we reschedule the appointment? Unfortunately I can't on Monday. Can it be next week? Cheers, Lotte"
    glosses:
      Hé: "Hey (informal greeting)"
      Kunnen: "can (we) (form of kunnen)"
      afspraak: "appointment"
      verzetten: "to reschedule / move (an appointment)"
      kan: "can (I) (form of kunnen)"
      maandag: "Monday"
      helaas: "unfortunately"
      niet: "not"
      Kan: "can (it) (form of kunnen)"
      volgende: "next"
      week: "week"
      Groetjes: "Cheers / take care (informal sign-off)"
  nl.b2.unit05.lesson05.teach.tekst_formeel:
    title: "Formal message (to an institution)"
    gloss: "Dear Sir or Madam, Would it be possible to reschedule our appointment? Unfortunately I can't on Monday. Would next week suit? Kind regards, Lotte de Vries"
    glosses:
      Geachte: "Dear (formal salutation)"
      heer: "Sir"
      mevrouw: "Madam"
      Zou: "would (polite request)"
      mogelijk: "possible"
      afspraak: "appointment"
      verzetten: "to reschedule / move"
      kan: "can (1st person of kunnen)"
      maandag: "Monday"
      helaas: "unfortunately"
      volgende: "next"
      week: "week"
      schikken: "to suit / be convenient"
      Met: "with (in a formal sign-off)"
      vriendelijke: "kind / friendly"
      groet: "regards / greeting"

  nl.b2.unit05.lesson06.teach.geen_probleem:
    title: "No problem."
    gloss: "No problem."
    note: "*Geen probleem* = 'no problem' -- a relaxed, informal reply. *Geen* = 'no / not any', *probleem* = 'problem'."
  nl.b2.unit05.lesson06.teach.wanneer:
    title: "when"
    gloss: "when"
    note: "*Wanneer* = 'when'. *Wanneer wel?* = 'when instead?' (literally 'when yes?') -- a natural follow-up after someone says they can't make a time. *Wel* here is the positive counterpart to *niet*."
    example_gloss: "When instead?"
  nl.b2.unit05.lesson06.teach.gemeente:
    title: "the municipality"
    gloss: "the municipality (town/city hall)"
    note: "*De gemeente* = 'the municipality' -- your local government office, a classic institution you'd write to formally. *Mailen* = 'to e-mail', *mail* is the *ik* form."
    example_gloss: "I'm e-mailing the municipality."
  nl.b2.unit05.lesson06.teach.moeten:
    title: "must / have to"
    gloss: "must / have to"
    note: "*Moet* = 'must / have to' (the *ik/hij* form of *moeten*). *En* = 'and', *nog* = 'still / also'. *Ik moet nog mailen* = 'I still have to send an e-mail'."
    example_gloss: "And I still have to send an e-mail."
  nl.b2.unit05.lesson06.teach.netjes:
    title: "properly / politely"
    gloss: "properly / neatly / politely"
    note: "*Netjes* = 'properly / politely' -- doing something the correct, respectful way. Writing *netjes* to an institution means using the formal register."
    example_gloss: "Write it properly."
  nl.b2.unit05.lesson06.teach.anders:
    title: "differently"
    gloss: "differently"
    note: "*Anders* = 'differently'. *Naar de gemeente schrijf je natuurlijk anders* = 'to the municipality you write differently, of course' -- exactly the skill of this unit. *Naar* = 'to', *natuurlijk* = 'of course', *ja* = 'yes'."
    example_gloss: "To the municipality you write differently, of course."
  nl.b2.unit05.lesson06.teach.dialogue_lotte_setup:
    title: "Lotte: Hey Omar, can we reschedule the appointment? I can't on Monday."
    gloss: "Lotte: Hey Omar, can we reschedule the appointment? I can't on Monday."
  nl.b2.unit05.lesson06.teach.dialogue_omar_ok:
    title: "Omar: No problem. When instead?"
    gloss: "Omar: No problem. When instead?"
  nl.b2.unit05.lesson06.teach.dialogue_lotte_gemeente:
    title: "Lotte: Next week? And I still have to e-mail the municipality properly."
    gloss: "Lotte: Next week? And I still have to e-mail the municipality properly."
  nl.b2.unit05.lesson06.teach.dialogue_omar_anders:
    title: "Omar: Yeah, to the municipality you write differently, of course."
    gloss: "Omar: Yeah, to the municipality you write differently, of course."
  nl.b2.unit05.lesson06.teach.grammar_beide_registers:
    title: "Can you reschedule the appointment? / Would it be possible to reschedule our appointment?"
    gloss: "Can you reschedule the appointment? (informal) / Would it be possible to reschedule our appointment? (formal)"
    note: "This is what you produce in this lesson: one request, delivered in the register that fits each reader. Informal to Omar: *Kun je de afspraak verzetten?* Formal to an institution: *Zou het mogelijk zijn om onze afspraak te verzetten?*"

exercises:
  nl.b2.unit05.lesson01.exercise01.recognize_u:
    instruction: "Who do you address as 'u'?"
    correct_option: "someone you treat formally (a stranger or an institution)"
    distractors: ["a close friend", "a child in your family", "your best friend"]
    accepted_answers: [{value: "someone you treat formally (a stranger or an institution)", status: correct}]
    feedback: "U is the formal 'you' -- for strangers, officials and institutions. For a friend you use je/jij."
  nl.b2.unit05.lesson01.exercise02.listen_heeft_u:
    instruction: "Listen and select what you hear."
    correct_option: "Do you have time? (formal)"
    distractors: ["Do you have time? (informal)", "Can you help? (formal)", "Do you have a moment? (informal)"]
    accepted_answers: [{value: "Do you have time? (formal)", status: correct}]
    feedback: "Heeft u tijd? is the formal 'do you have time?' -- u takes the -t form heeft."
  nl.b2.unit05.lesson01.exercise03.match_pronouns:
    instruction: "Match each Dutch word with its meaning and register."
    accepted_answers:
      - value: {je: "you (informal, subject)", jou: "you (informal, object)", jouw: "your (informal)", u: "you (formal)", uw: "your (formal)", "kun je": "can you (informal)", "kunt u": "can you (formal)", tijd: time}
        status: correct
    feedback: "je/jij/jou/jouw are the informal set; u/uw are the formal set -- and the verb follows (kun je vs kunt u)."
  nl.b2.unit05.lesson01.exercise04.order_heb_je:
    instruction: "Put the words in order, informal: Do you have a moment?"
    accepted_answers:
      - {value: "Heb je even tijd", status: correct}
    feedback: "Heb je even tijd? -- the informal je form of hebben."
  nl.b2.unit05.lesson01.exercise05.translate_heeft_u:
    instruction: "Translate into Dutch, formal (addressing the person as u): Do you have time?"
    accepted_answers:
      - {value: "Heeft u tijd", status: correct}
      - {value: "Hebt u tijd", status: correct}
    feedback: "Heeft u tijd? -- with u the verb is heeft (or hebt), not heb."
  nl.b2.unit05.lesson01.exercise06.translate_kun_je:
    instruction: "Translate into Dutch, informal (addressing the person as je): Can you help?"
    accepted_answers:
      - {value: "Kun je helpen", status: correct}
      - {value: "Kan je helpen", status: correct}
    feedback: "Kun je helpen? -- the informal je form of kunnen."
  nl.b2.unit05.lesson01.exercise07.speak_kunt_u:
    instruction: "Say aloud in Dutch, formal (addressing the person as u): Can you help?"
    accepted_answers:
      - {value: "Kunt u helpen", status: correct}
    feedback: "Kunt u helpen? -- with u the verb is kunt, not kun."
  nl.b2.unit05.lesson01.exercise08.dictation_heeft_u:
    instruction: "Type what you hear."
    correct_response: "Heeft u tijd"
    orthography_strict: true
    feedback: "You heard Heeft u tijd? -- the formal 'do you have time?', with u the verb takes the -t form heeft."

  nl.b2.unit05.lesson02.exercise01.recognize_geachte:
    instruction: "When would you write 'Geachte heer/mevrouw'?"
    correct_option: "to open a formal letter to someone whose name you don't know"
    distractors: ["to text a friend", "to sign off a message to your sister", "to greet a child"]
    accepted_answers: [{value: "to open a formal letter to someone whose name you don't know", status: correct}]
    feedback: "Geachte heer/mevrouw is the formal salutation when the reader is unknown -- for an institution, not a friend."
  nl.b2.unit05.lesson02.exercise02.listen_mvg:
    instruction: "Listen and select what you hear."
    correct_option: "Kind regards (formal closing)"
    distractors: ["Cheers (informal sign-off)", "Dear Sir or Madam (formal opening)", "Yours faithfully (most formal closing)"]
    accepted_answers: [{value: "Kind regards (formal closing)", status: correct}]
    feedback: "Met vriendelijke groet is the everyday formal closing -- 'kind regards'."
  nl.b2.unit05.lesson02.exercise03.match_openers_closers:
    instruction: "Match each opening or closing with its meaning and register."
    accepted_answers:
      - value: {Hoi: "informal 'hi'", Groetjes: "informal sign-off (cheers)", "Geachte heer/mevrouw": "formal salutation (Dear Sir or Madam)", "Met vriendelijke groet": "formal closing (kind regards)", Hoogachtend: "most formal closing (yours faithfully)", Beste: "neutral 'Dear' + name"}
        status: correct
    feedback: "Informal Hoi/Groetjes, neutral Beste, formal Geachte heer/mevrouw / Met vriendelijke groet, most formal Hoogachtend."
  nl.b2.unit05.lesson02.exercise04.order_mvg:
    instruction: "Put the words in order, the formal closing: Kind regards."
    accepted_answers:
      - {value: "Met vriendelijke groet", status: correct}
    feedback: "Met vriendelijke groet -- the standard formal sign-off."
  nl.b2.unit05.lesson02.exercise05.translate_geachte:
    instruction: "Write the formal Dutch salutation for a letter to someone you don't know: Dear Sir or Madam."
    accepted_answers:
      - {value: "Geachte heer/mevrouw", status: correct}
      - {value: "Geachte heer/mevrouw,", status: correct}
    feedback: "Geachte heer/mevrouw -- the formal opening when you don't know the reader's name."
  nl.b2.unit05.lesson02.exercise06.write_groetjes:
    instruction: "Write an informal Dutch sign-off to a friend, from Lotte: Cheers, Lotte."
    accepted_answers:
      - {value: "Groetjes, Lotte", status: correct}
      - {value: "Groetjes Lotte", status: correct}
    feedback: "Groetjes, Lotte -- the informal way to close a message to a friend."
  nl.b2.unit05.lesson02.exercise07.recognize_most_formal:
    instruction: "Which closing is the MOST formal?"
    correct_option: Hoogachtend
    distractors: [Groetjes, "Hoi", Beste]
    accepted_answers: [{value: Hoogachtend, status: correct}]
    feedback: "Hoogachtend ('yours faithfully') is the most formal sign-off -- more distant than Met vriendelijke groet."

  nl.b2.unit05.lesson03.exercise01.recognize_alstublieft:
    instruction: "What does this word mean, and in which register?"
    correct_option: "please (formal)"
    distractors: ["please (informal)", "thank you (formal)", "you're welcome (formal)"]
    accepted_answers: [{value: "please (formal)", status: correct}]
    feedback: "Alstublieft is the formal 'please' (it contains u); alsjeblieft is the informal one (it contains je)."
  nl.b2.unit05.lesson03.exercise02.listen_zou_u_willen:
    instruction: "Listen and select what you hear."
    correct_option: "Would you be willing to do it? (formal)"
    distractors: ["Can you do it? (informal)", "Do you want to do it? (informal)", "Would it be possible to do it? (formal)"]
    accepted_answers: [{value: "Would you be willing to do it? (formal)", status: correct}]
    feedback: "Zou u het willen doen? is the formal, indirect request -- 'would you be willing to do it?'."
  nl.b2.unit05.lesson03.exercise03.match_directness:
    instruction: "Match each form with its meaning and register."
    accepted_answers:
      - value: {"kun je": "can you (informal, direct)", "zou u willen": "would you be willing to (formal, polite)", alsjeblieft: "please (informal)", alstublieft: "please (formal)", mogelijk: possible, doen: "to do"}
        status: correct
    feedback: "Informal and direct: kun je, alsjeblieft. Formal and indirect: zou u willen, alstublieft."
  nl.b2.unit05.lesson03.exercise04.order_zou_u_willen:
    instruction: "Put the words in order, formal and polite: Would you be willing to do it?"
    accepted_answers:
      - {value: "Zou u het willen doen", status: correct}
    feedback: "Zou u het willen doen? -- the formal register softens the request by making it indirect."
  nl.b2.unit05.lesson03.exercise05.translate_kun_je_dit:
    instruction: "Translate into Dutch, informal and direct (using kun je): Can you do this?"
    accepted_answers:
      - {value: "Kun je dit doen", status: correct}
    feedback: "Kun je dit doen? -- direct is the friendly, normal choice between friends."
  nl.b2.unit05.lesson03.exercise06.translate_zou_u_dit:
    instruction: "Translate into Dutch, formal and polite (using Zou u ... willen): Would you do this?"
    accepted_answers:
      - {value: "Zou u dit willen doen", status: correct}
    feedback: "Zou u dit willen doen? -- the formal register goes indirect to sound respectful."
  nl.b2.unit05.lesson03.exercise07.speak_mogelijk:
    instruction: "Say aloud in Dutch, as a formal, indirect opener for a request: Would it be possible?"
    accepted_answers:
      - {value: "Zou het mogelijk zijn", status: correct}
    feedback: "Zou het mogelijk zijn? -- a very common polite, indirect formal frame."

  nl.b2.unit05.lesson04.exercise01.recognize_verzetten:
    instruction: "What does this word mean?"
    correct_option: "to reschedule / move"
    distractors: ["to cancel", "to confirm", "to attend"]
    accepted_answers: [{value: "to reschedule / move", status: correct}]
    feedback: "Verzetten means to move an appointment to another time -- to reschedule."
  nl.b2.unit05.lesson04.exercise02.listen_verzetten:
    instruction: "Listen and select what you hear."
    correct_option: "Can we reschedule the appointment? (informal)"
    distractors: ["Would it be possible to reschedule the appointment? (formal)", "Can we cancel the appointment? (informal)", "Do we have an appointment? (informal)"]
    accepted_answers: [{value: "Can we reschedule the appointment? (informal)", status: correct}]
    feedback: "Kunnen we de afspraak verzetten? is the informal form of the request -- direct, no softening frame."
  nl.b2.unit05.lesson04.exercise03.match_appointment_words:
    instruction: "Match each Dutch word or phrase with its meaning."
    accepted_answers:
      - value: {afspraak: appointment, verzetten: "to reschedule / move", maandag: Monday, "volgende week": "next week", helaas: unfortunately, we: we}
        status: correct
    feedback: "These are the words the request is built from -- the same content will be wrapped in either register."
  nl.b2.unit05.lesson04.exercise04.order_formele_vraag:
    instruction: "Put the words in order, formal: Would it be possible to reschedule our appointment?"
    accepted_answers:
      - {value: "Zou het mogelijk zijn om onze afspraak te verzetten", status: correct}
    feedback: "Zou het mogelijk zijn om onze afspraak te verzetten? -- the indirect, polite formal request."
  nl.b2.unit05.lesson04.exercise05.translate_informele_vraag:
    instruction: "Translate into Dutch, informal (to your friend Omar): Can we reschedule the appointment?"
    accepted_answers:
      - {value: "Kunnen we de afspraak verzetten", status: correct}
    feedback: "Kunnen we de afspraak verzetten? -- direct and informal, for a friend."
  nl.b2.unit05.lesson04.exercise06.translate_formele_vraag:
    instruction: "Translate into Dutch, formal (to an institution, using Zou het mogelijk zijn): Would it be possible to reschedule our appointment?"
    accepted_answers:
      - {value: "Zou het mogelijk zijn om onze afspraak te verzetten", status: correct}
    feedback: "Zou het mogelijk zijn om onze afspraak te verzetten? -- the SAME request, wrapped for an institution."
  nl.b2.unit05.lesson04.exercise07.write_helaas:
    instruction: "Write in Dutch, softening the refusal with helaas: Unfortunately, I can't make Monday."
    accepted_answers:
      - {value: "Ik kan maandag helaas niet", status: correct}
      - {value: "Maandag kan ik helaas niet", status: correct}
      - {value: "Ik kan helaas maandag niet", status: correct}
    feedback: "Ik kan maandag helaas niet -- helaas softens the refusal, in either register."
  nl.b2.unit05.lesson04.exercise08.dictation_verzetten:
    instruction: "Type what you hear."
    correct_response: "Kunnen we de afspraak verzetten"
    orthography_strict: true
    feedback: "You heard Kunnen we de afspraak verzetten? -- 'can we reschedule the appointment?', the informal we-form for asking to move a meeting."

  nl.b2.unit05.lesson05.exercise01.read_friend:
    instruction: "Which message is written to a close friend?"
    correct_option: "The one that opens 'Hé Omar!' and signs off 'Groetjes'."
    distractors: ["The one that opens 'Geachte heer/mevrouw' and signs off 'Met vriendelijke groet'.", "Neither -- both are formal.", "Both are informal."]
    accepted_answers: [{value: "The one that opens 'Hé Omar!' and signs off 'Groetjes'.", status: correct}]
    feedback: "Hé Omar! and Groetjes are informal -- markers of a message to a friend."
  nl.b2.unit05.lesson05.exercise02.read_institution:
    instruction: "Which message is written to an institution?"
    correct_option: "The one that opens 'Geachte heer/mevrouw' and signs off 'Met vriendelijke groet'."
    distractors: ["The one that opens 'Hé Omar!' and signs off 'Groetjes'.", "Neither -- both are informal.", "Both are formal."]
    accepted_answers: [{value: "The one that opens 'Geachte heer/mevrouw' and signs off 'Met vriendelijke groet'.", status: correct}]
    feedback: "Geachte heer/mevrouw and Met vriendelijke groet are formal -- markers of a message to an institution."
  nl.b2.unit05.lesson05.exercise03.read_same_request:
    instruction: "Both messages make the SAME request. What is it?"
    correct_option: "To reschedule the appointment."
    distractors: ["To cancel the appointment.", "To confirm Monday.", "To ask for directions."]
    accepted_answers: [{value: "To reschedule the appointment.", status: correct}]
    feedback: "Both ask to reschedule (de afspraak verzetten) -- same content, different register."
  nl.b2.unit05.lesson05.exercise04.read_signal:
    instruction: "Which feature marks the second message as the one for an institution?"
    correct_option: "It uses the indirect 'Zou het mogelijk zijn', not the direct 'Kunnen we'."
    distractors: ["It is shorter.", "It asks about a different day.", "It does not mention the appointment."]
    accepted_answers: [{value: "It uses the indirect 'Zou het mogelijk zijn', not the direct 'Kunnen we'.", status: correct}]
    feedback: "The formal message marks its audience through the indirect Zou het mogelijk zijn frame instead of the direct Kunnen we."
  nl.b2.unit05.lesson05.exercise05.match_register_features:
    instruction: "Match each register feature with what it is."
    accepted_answers:
      - value: {"Hé Omar": "informal greeting (to a friend)", "Geachte heer/mevrouw": "formal greeting (to an institution)", Groetjes: "informal closing", "Met vriendelijke groet": "formal closing", schikken: "to suit / be convenient", "volgende week": "next week"}
        status: correct
    feedback: "The greetings and closings are what most clearly signal who each message is for."
  nl.b2.unit05.lesson05.exercise06.translate_schikken:
    instruction: "Translate into Dutch, formal, using 'schikken' (with impersonal 'het'): Would next week suit?"
    accepted_answers:
      - {value: "Zou het volgende week schikken", status: correct}
      - {value: "Schikt het volgende week", status: correct}
      - {value: "Zou volgende week schikken", status: correct}
    feedback: "Zou het volgende week schikken? -- schikken ('to suit') is the polite, formal way to propose a new time."
  nl.b2.unit05.lesson05.exercise07.write_kan_het:
    instruction: "Write in Dutch, informal: Can it be next week?"
    accepted_answers:
      - {value: "Kan het volgende week", status: correct}
    feedback: "Kan het volgende week? -- the informal way to propose next week to a friend."

  nl.b2.unit05.lesson06.exercise01.comprehend_register_fit:
    instruction: "How does Lotte address Omar, and does that register fit the situation?"
    correct_option: "Informally, with 'Hé Omar' and a direct 'kunnen we' -- and it fits, because Omar is a close friend."
    distractors: ["Formally, with 'u' -- and it fits, because he is a stranger.", "Informally -- but it does not fit; she should use 'u'.", "Formally, with 'u' -- but it does not fit; she should use 'je'."]
    accepted_answers: [{value: "Informally, with 'Hé Omar' and a direct 'kunnen we' -- and it fits, because Omar is a close friend.", status: correct}]
    feedback: "Lotte opens with the informal Hé Omar and asks directly, which is exactly right for a friend -- the register fits the audience."
  nl.b2.unit05.lesson06.exercise02.comprehend_mismatch:
    instruction: "What would it signal if Lotte wrote to the gemeente in the SAME informal way she talks to Omar?"
    correct_option: "It would come across as too casual and disrespectful for an institution."
    distractors: ["It would come across as more efficient and clear.", "It would come across as too formal and distant.", "It would make no difference at all."]
    accepted_answers: [{value: "It would come across as too casual and disrespectful for an institution.", status: correct}]
    feedback: "As Omar says, 'naar de gemeente schrijf je natuurlijk anders' -- informal register with an institution reads as too casual."
  nl.b2.unit05.lesson06.exercise03.comprehend_request:
    instruction: "What does Lotte want to do?"
    correct_option: "Reschedule the appointment."
    distractors: ["Cancel the appointment for good.", "Meet Omar on Monday after all.", "Complain to the municipality."]
    accepted_answers: [{value: "Reschedule the appointment.", status: correct}]
    feedback: "Lotte asks 'kunnen we de afspraak verzetten?' -- she wants to reschedule."
  nl.b2.unit05.lesson06.exercise04.speak_informal:
    instruction: "Say aloud in Dutch the SAME request, first to your friend Omar -- informal, using kun je: Can you reschedule the appointment?"
    accepted_answers:
      - {value: "Kun je de afspraak verzetten", status: correct}
    feedback: "Kun je de afspraak verzetten? -- direct and informal, the right register for Omar."
  nl.b2.unit05.lesson06.exercise05.speak_formal:
    instruction: "Now say aloud in Dutch the SAME request to an institution -- formal, using Zou het mogelijk zijn: Would it be possible to reschedule our appointment?"
    accepted_answers:
      - {value: "Zou het mogelijk zijn om onze afspraak te verzetten", status: correct}
    feedback: "Zou het mogelijk zijn om onze afspraak te verzetten? -- indirect and formal, the right register for an institution."
  nl.b2.unit05.lesson06.exercise06.write_rewrite_formal:
    instruction: "Rewrite this informal message to Omar as a FORMAL one to an institution. Informal: 'Hé Omar, kunnen we de afspraak verzetten?' Write the formal version as two parts: the salutation Geachte heer/mevrouw, then the request using Zou het mogelijk zijn."
    accepted_answers:
      - {value: "Geachte heer/mevrouw, Zou het mogelijk zijn om onze afspraak te verzetten?", status: correct}
      - {value: "Geachte heer/mevrouw, Zou het mogelijk zijn om onze afspraak te verzetten", status: correct}
      - {value: "Geachte heer/mevrouw Zou het mogelijk zijn om onze afspraak te verzetten?", status: correct}
      - {value: "Geachte heer/mevrouw Zou het mogelijk zijn om onze afspraak te verzetten", status: correct}
    feedback: "The formal rewrite swaps 'Hé Omar' for 'Geachte heer/mevrouw' and the direct question for the indirect 'Zou het mogelijk zijn om onze afspraak te verzetten?'."
  nl.b2.unit05.lesson06.exercise07.write_both_registers:
    instruction: "Write the SAME request TWICE. (1) informally to your friend Omar, using kun je: Can you reschedule the appointment? (2) formally to an institution, using Zou het mogelijk zijn: Would it be possible to reschedule our appointment?"
    accepted_answers:
      - {value: "Kun je de afspraak verzetten? Zou het mogelijk zijn om onze afspraak te verzetten?", status: correct}
      - {value: "Kun je de afspraak verzetten? Zou het mogelijk zijn om onze afspraak te verzetten", status: correct}
      - {value: "Kun je de afspraak verzetten Zou het mogelijk zijn om onze afspraak te verzetten?", status: correct}
      - {value: "Kun je de afspraak verzetten Zou het mogelijk zijn om onze afspraak te verzetten", status: correct}
    feedback: "Same request, two registers: informal 'Kun je de afspraak verzetten?' for Omar, formal 'Zou het mogelijk zijn om onze afspraak te verzetten?' for an institution."
