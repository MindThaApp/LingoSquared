  notes: 'English overlay for the starting, stopping, trying unit. OPEN NATIVE QUESTIONS: none identified.'
course:
  title: Dutch A2
  description: Grammar-led A2 Dutch for talking about starting, stopping and trying habits.
  learning_goal: Say what you started, stopped, tried or forgot to do with te + infinitive, stoppen met and staan/zitten/liggen te.
units:
  nl.a2.unit91.beginnen_stoppen_proberen:
    title: Starting, stopping, trying
    description: Say what you started, stopped, tried or forgot to do, and what someone is busy doing.
lessons:
  nl.a2.unit91.lesson01.ik_begin_te_sporten:
    title: I start to exercise
  nl.a2.unit91.lesson02.stoppen_met:
    title: Stopping
  nl.a2.unit91.lesson03.proberen_en_vergeten:
    title: Trying and forgetting
  nl.a2.unit91.lesson04.hij_zit_te_lezen:
    title: He is sitting reading
  nl.a2.unit91.lesson05.noors_plan:
    title: Noor's plan
  nl.a2.unit91.lesson06.lotte_en_omar_sporten:
    title: Lotte and Omar exercise
teaching:
  nl.a2.unit91.lesson01.teach.gewoontes:
    title: Habits
    gloss: to exercise / to sleep / to eat / healthy / earlier
    note: These words name the habits you will talk about in this unit.
    example_gloss:
    - I want to exercise.
    - I want to eat healthily.
    - I want to sleep earlier.
  nl.a2.unit91.lesson01.teach.sportschool:
    title: At the gym
    gloss: the gym / every day / often
    note: '*Vaak* means often; *elke dag* means every day.'
    example_gloss:
    - I go to the gym every day.
    - Noor often goes to the gym.
    - I exercise often.
  nl.a2.unit91.lesson01.teach.gn_beginnen_te:
    title: Beginnen + te + infinitive
    gloss: I start to exercise. I start to eat healthily. Noor starts to sleep earlier.
    note: After *beginnen*, put *te* directly before the infinitive. The infinitive (*sporten, eten, slapen*) comes last. It is *ik begin* but *Noor begint*.
  nl.a2.unit91.lesson01.teach.gn_te_achteraan:
    title: Other words come before te
    gloss: I start going to the gym every day. She often starts to exercise.
    note: Other words (*elke dag, naar de sportschool, vaak*) stand between *beginnen* and *te*. The pair *te* + infinitive stays together at the end.
  nl.a2.unit91.lesson01.teach.zin:
    title: Two actions
    gloss: I start to exercise and to eat healthily.
    note: With two actions, Dutch usually repeats *te* before each infinitive.
  nl.a2.unit91.lesson02.teach.schermtijd:
    title: Habits to stop
    gloss: to smoke / to snack on sweets / to game / the phone / screen time
    note: '*Snoepen* means eating sweets or snacks.'
    example_gloss:
    - Smoking is not healthy.
    - I eat sweets every day.
    - I often game on my phone.
    - My screen time is high.
  nl.a2.unit91.lesson02.teach.minder:
    title: No longer, less
    gloss: to stop / to begin / no longer / less
    note: '*Niet meer* means no longer.'
    example_gloss:
    - I no longer smoke.
    - I game less.
    - I eat fewer sweets.
  nl.a2.unit91.lesson02.teach.gn_stoppen_met:
    title: Stoppen met
    gloss: I stop smoking. Noor stops gaming. She stops snacking.
    note: 'After *stoppen* use *met* plus a noun or an infinitive. There is no *te* here: not *stoppen te roken*. It is *ik stop* but *Noor stopt*.'
  nl.a2.unit91.lesson02.teach.gn_beginnen_met:
    title: Beginnen met
    gloss: I start exercising. Noor starts eating healthily.
    note: '*Beginnen* can also be used with *met* + infinitive or noun, without *te*. *Ik begin te sporten* and *Ik begin met sporten* mean the same.'
  nl.a2.unit91.lesson02.teach.zin:
    title: Less and no more
    gloss: I eat fewer sweets and I no longer game.
    note: '*Minder* and *niet meer* tell how far you have changed a habit.'
  nl.a2.unit91.lesson03.teach.proberen:
    title: Trying and forgetting
    gloss: to try / to forget / to call / to read
    note: '*Bellen* means to phone someone.'
    example_gloss:
    - I try it.
    - I often forget it.
    - I call Lotte.
    - Noor reads every day.
  nl.a2.unit91.lesson03.teach.gn_proberen_te:
    title: Proberen + te
    gloss: I try to sleep earlier. I try to game less. Noor tries to exercise.
    note: After *proberen*, use *te* + infinitive, with the infinitive last. It is *ik probeer* but *Noor probeert*.
  nl.a2.unit91.lesson03.teach.gn_vergeten_te:
    title: Vergeten + te
    gloss: I often forget to call. I forgot to call. I forgot to call Lotte.
    note: '*Vergeten* also takes *te* + infinitive. A short object (*Lotte*) comes before *te*: *Lotte te bellen*.'
  nl.a2.unit91.lesson03.teach.gn_om_te:
    title: Optional om ... te
    gloss: I try to sleep earlier. I forgot to call.
    note: 'After *proberen* and *vergeten* you may add *om*: *om ... te*. The meaning is the same. This unit mostly uses the shorter form without *om*.'
  nl.a2.unit91.lesson03.teach.gn_perfectum:
    title: Perfectum
    gloss: I started to exercise. I stopped smoking. I tried to sleep earlier. I forgot to call.
    note: In the perfectum, *beginnen, stoppen* and *vergeten* take *zijn*, while *proberen* takes *hebben*. With *ik*, use *ben* and *heb*. The *te* + infinitive (or *met* + activity) stays at the end.
  nl.a2.unit91.lesson03.teach.gn_modaal:
    title: Te or no te
    gloss: I want to exercise. I try to exercise. I have to sleep. I try to sleep.
    note: After *willen* and *moeten* the infinitive stands alone, without *te*. After *beginnen, proberen* and *vergeten* you need *te*.
  nl.a2.unit91.lesson04.teach.posities:
    title: Stand, sit, lie
    gloss: to stand / to sit / to lie / the sofa / the bed / the door
    note: In Dutch you often say whether someone stands, sits or lies.
    example_gloss:
    - He sits on the sofa.
    - She lies in bed.
    - He stands by the door.
  nl.a2.unit91.lesson04.teach.tv:
    title: Screens and books
    gloss: to watch / the TV / the book
    note: '*Kijken naar* means to look at or watch.'
    example_gloss:
    - He watches TV.
    - She reads a book.
  nl.a2.unit91.lesson04.teach.uren:
    title: Already for hours
    gloss: already / hours
    note: '*Al uren* means for hours already.'
    example_gloss:
    - He has been sitting on the sofa for hours.
    - I have been gaming for hours.
  nl.a2.unit91.lesson04.teach.gn_staan_te:
    title: Staan, zitten, liggen + te
    gloss: He is reading (sitting). She is sleeping (lying). He is calling (standing). She is gaming (sitting).
    note: '*Staan, zitten* or *liggen* + *te* + infinitive says what someone is doing now. The first verb shows the posture: *zit, ligt, staat*.'
  nl.a2.unit91.lesson04.teach.gn_plaats:
    title: Place before te
    gloss: He is reading on the sofa. She is sleeping in bed. He is calling by the door.
    note: 'A place usually comes before *te* + infinitive. In speech you also hear it afterwards: *Hij zit te lezen op de bank*.'
  nl.a2.unit91.lesson04.teach.zin:
    title: What is he doing?
    gloss: What is he doing? He has been sitting gaming for hours.
    note: '*Al uren* goes before *te gamen* and shows how long it has been going on.'
  nl.a2.unit91.lesson05.teach.reading:
    title: Noor's plan
    gloss: Hi Lotte, I have a plan. Every evening I sit gaming for hours and that is not healthy. Now I am stopping gaming. I am trying to sleep earlier. On Monday I start to exercise. Yesterday I forgot to call you, sorry! Tomorrow I will call you.
    note: Find what Noor stops, tries, starts and forgets.
    glosses:
      plan: plan
      avond: evening
      uren: hours
      dat: that
      Nu: now
      Maandag: Monday
      Gisteren: yesterday
      je: you
      sorry: sorry
      Morgen: tomorrow
      heb: have
  nl.a2.unit91.lesson06.teach.lotte_vraag:
    title: Lotte asks
    gloss: 'Lotte: Hi Omar, have you started exercising yet?'
  nl.a2.unit91.lesson06.teach.omar_gym:
    title: Omar answers
    gloss: 'Omar: Yes, I have started! I try to go to the gym three times a week.'
  nl.a2.unit91.lesson06.teach.lotte_snoepen:
    title: Lotte asks about snacking
    gloss: 'Lotte: Well done! And have you stopped snacking?'
  nl.a2.unit91.lesson06.teach.omar_nee:
    title: Omar admits it
    gloss: 'Omar: No, that is not working yet. I sit on the sofa snacking every evening.'
  nl.a2.unit91.lesson06.teach.lotte_vergeten:
    title: Lotte shares
    gloss: 'Lotte: Too bad! I also forgot to exercise today.'
  nl.a2.unit91.lesson06.teach.omar_samen:
    title: Omar suggests
    gloss: "Omar: Then we'll try it together tomorrow!"
exercises:
  nl.a2.unit91.lesson01.exercise01.choose_begin:
    instruction: Choose the correct Dutch sentence.
    correct_option: Ik begin te sporten.
    distractors:
    - Ik begin sporten.
    - Ik begin te sport.
    - Ik begin sporten te.
    accepted_answers:
    - value: Ik begin te sporten.
      status: correct
    feedback: 'After *beginnen* you need *te* + infinitive: *Ik begin te sporten.*'
  nl.a2.unit91.lesson01.exercise02.choose_ze_begint:
    instruction: Choose the correct Dutch sentence.
    correct_option: Ze begint gezond te eten.
    distractors:
    - Ze begin gezond te eten.
    - Ze begint te gezond eten.
    - Ze begint gezond eten te.
    accepted_answers:
    - value: Ze begint gezond te eten.
      status: correct
    feedback: 'With *ze/hij/Noor* the verb ends in -t: *begint*. *Te* stands right before the infinitive *eten*.'
  nl.a2.unit91.lesson01.exercise03.match_gewoontes:
    instruction: Match each Dutch word to its English meaning.
    accepted_answers:
    - value:
      - left: sporten
        right: to exercise
      - left: slapen
        right: to sleep
      - left: eten
        right: to eat
      - left: gezond
        right: healthy
      - left: vroeger
        right: earlier
      - left: de sportschool
        right: the gym
      status: correct
    feedback: These are the habit words for this unit.
  nl.a2.unit91.lesson01.exercise04.order_noor:
    instruction: Put the words in order to say 'Noor starts to sleep earlier.'
    correct_option: Noor begint vroeger te slapen
    accepted_answers:
    - value: Noor begint vroeger te slapen
      status: correct
    feedback: '*Noor begint vroeger te slapen*: *te* + infinitive at the end.'
  nl.a2.unit91.lesson01.exercise05.complete_te:
    instruction: Complete the sentence with one word.
    correct_option: te
    accepted_answers:
    - value: te
      status: correct
    feedback: '*Ik begin elke dag naar de sportschool te gaan.* The word *te* goes before the infinitive *gaan*.'
  nl.a2.unit91.lesson01.exercise06.translate_eat:
    instruction: Translate into Dutch. Use beginnen + te.
    accepted_answers:
    - value: Ik begin gezond te eten
      status: correct
    - value: Ik begin gezond te eten.
      status: correct
    feedback: '*Ik begin gezond te eten* = I start to eat healthily.'
  nl.a2.unit91.lesson01.exercise07.write_sleep:
    instruction: Write the requested Dutch sentence.
    correct_option: Ik begin vroeger te slapen.
    accepted_answers:
    - value: Ik begin vroeger te slapen
      status: correct
    - value: Ik begin vroeger te slapen.
      status: correct
    feedback: '*Ik begin vroeger te slapen* = I start to sleep earlier.'
  nl.a2.unit91.lesson02.exercise01.choose_stop:
    instruction: Choose the correct Dutch sentence.
