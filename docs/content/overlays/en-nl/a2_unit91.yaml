      status: correct
    feedback: '*Stoppen* goes with *met*, and there is no *te*.'
  nl.a2.unit91.lesson02.exercise02.choose_ze_stopt:
    instruction: Choose the correct Dutch sentence.
    correct_option: Ze stopt met snoepen.
    distractors:
    - Ze stopt te snoepen.
