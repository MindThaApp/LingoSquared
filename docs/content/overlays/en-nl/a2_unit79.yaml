teaching:
  nl.a2.unit79.lesson01.teach.vakantie: {"title": "Holidays", "gloss": "the holiday / the summer holiday", "note": "Both words are de-words. *Vakantie* is the general word; *de zomervakantie* is the long summer break.", "example_gloss": ["In August I have a holiday.", "The summer holiday starts in July."]}
  nl.a2.unit79.lesson01.teach.volgende_week: {"title": "When something happens", "gloss": "next week / next year / soon", "note": "*Week* is a de-word, so it is *volgende week*. *Jaar* is a het-word, so it is *volgend jaar* (no final -e).", "example_gloss": ["Next week I have an appointment.", "Next year I want to go to Belgium.", "Soon I have a holiday."]}
  nl.a2.unit79.lesson01.teach.reizen_boeken: {"title": "Three travel verbs", "gloss": "to travel / to book / to stay", "note": "These are the infinitives. *Boeken* also means 'books' as a noun, but here it is the verb 'to book'.", "example_gloss": ["I like travelling by train.", "I want to book a room.", "I'm staying for a week."]}
  nl.a2.unit79.lesson01.teach.hotel_camping: {"title": "Where to stay", "gloss": "the hotel / the campsite", "note": "*Het hotel* is a het-word; *de camping* is a de-word. You sleep *op de camping* but *in een hotel*.", "example_gloss": ["The hotel is close to the beach.", "We sleep on the campsite."]}
  nl.a2.unit79.lesson01.teach.vraag: {"title": "Asking about holiday plans", "gloss": "What are you going to do in the summer holiday?", "note": "Here *gaan* is a helper: *ga* in second place and the infinitive *doen* at the very end."}
  nl.a2.unit79.lesson01.teach.gn_gaan: {"title": "Near plans: gaan + infinitive", "gloss": "In August I am going to travel to Germany. I am going to book a hotel.", "note": "To say what you are going to do, use a form of *gaan* in second place and put the infinitive at the very end of the sentence: *Ik ga een hotel boeken*. Anything else (a time, a place, an object) goes in between. If a time word comes first, *ga* still stays in second place: *Volgende week ga ik een hotel boeken*."}
  nl.a2.unit79.lesson01.teach.hotel_boeken: {"title": "Booking a hotel", "gloss": "I am going to book a hotel."}
  nl.a2.unit79.lesson02.teach.cursus_verhuizen: {"title": "Three plans for later", "gloss": "to take a course / to move house / to save money", "note": "*Een cursus volgen* is the fixed phrase for taking a course. *Verhuizen* is moving to a new home.", "example_gloss": ["I want to take a course.", "My uncle wants to move house.", "I want to save for a new bike."]}
  nl.a2.unit79.lesson02.teach.later_over: {"title": "Further ahead", "gloss": "later / in a month", "note": "*Over een maand* means 'a month from now'. It works with other periods too: *over een week*.", "example_gloss": ["Later I want to buy a house.", "In a month my course starts."]}
  nl.a2.unit79.lesson02.teach.cursus_begint: {"title": "A course that starts", "gloss": "In a month my course starts."}
  nl.a2.unit79.lesson02.teach.gn_van_plan: {"title": "Intentions: van plan zijn om ... te", "gloss": "I plan to take a course.", "note": "To say what you intend to do, use *ik ben van plan om* and then the rest of the sentence. The infinitive is at the end, with *te* right before it: *een cursus te volgen*. This is for things you want to do, not for fixed arrangements."}
  nl.a2.unit79.lesson02.teach.verhuizen: {"title": "Planning to move house", "gloss": "I plan to move house."}
  nl.a2.unit79.lesson02.teach.sparen: {"title": "Planning to save", "gloss": "I plan to save money."}
  nl.a2.unit79.lesson02.teach.gn_contrast: {"title": "Gaan or van plan zijn?", "gloss": "Tomorrow I am going to the market. Later I plan to move house.", "note": "Use *gaan* for the near, settled future: *Morgen ga ik naar de markt*. Use *van plan zijn* for an intention that is further away or less certain: *Later ben ik van plan om te verhuizen*."}
  nl.a2.unit79.lesson03.teach.misschien: {"title": "Maybe and certainly", "gloss": "maybe / certainly", "note": "*Misschien* expresses doubt. *Zeker* means 'certainly' or 'for sure'.", "example_gloss": ["Maybe it will rain tomorrow.", "That is certainly fun."]}
  nl.a2.unit79.lesson03.teach.dit_jaar: {"title": "This year, this summer", "gloss": "this year / this summer", "note": "*Jaar* is a het-word, so *dit jaar*. *Zomer* is a de-word, so *deze zomer*.", "example_gloss": ["This year I am not going on holiday.", "This summer I am staying at home."]}
  nl.a2.unit79.lesson03.teach.blijf_thuis: {"title": "Staying at home", "gloss": "This summer I am staying at home."}
  nl.a2.unit79.lesson03.teach.gn_misschien: {"title": "Misschien and word order", "gloss": "Tomorrow I am going to work. Maybe I will go to the cinema later.", "note": "*Misschien* at the start of a sentence counts as the first item, so the verb comes right after it: *Misschien ga ik later naar de bioscoop*, not *Misschien ik ga*. The same happens after any time word: *Morgen ga ik werken*."}
  nl.a2.unit79.lesson03.teach.gn_niet: {"title": "Saying you are not going to", "gloss": "I am not going on holiday. I do not plan to move house.", "note": "Put *niet* after *ga* or *ben*, before the rest of the plan: *Ik ga niet op vakantie*. With *van plan zijn*, *niet* comes before *van plan*: *Ik ben niet van plan om te verhuizen*."}
  nl.a2.unit79.lesson04.teach.met_wie: {"title": "Two question phrases", "gloss": "with whom / how long", "note": "*Met wie* asks about a person you do something with. *Hoe lang* asks about a period of time.", "example_gloss": ["Who are you going to the beach with?", "How long are you staying?"]}
  nl.a2.unit79.lesson04.teach.waar_naartoe: {"title": "Where are you going?", "gloss": "Where are you going (to)?", "note": "*Naartoe* goes at the end of the question and shows a direction."}
  nl.a2.unit79.lesson04.teach.met_wie_vakantie: {"title": "Who with?", "gloss": "Who are you going on holiday with?"}
  nl.a2.unit79.lesson04.teach.hoe_lang_daar: {"title": "How long?", "gloss": "How long are you staying there?"}
  nl.a2.unit79.lesson04.teach.met_mijn_zus: {"title": "Answering", "gloss": "I am going with my sister."}
  nl.a2.unit79.lesson04.teach.weken: {"title": "Weeks", "gloss": "one week / two weeks", "note": "The plural of *week* is *weken*.", "example_gloss": ["I am staying for a week.", "We are staying for two weeks."]}
  nl.a2.unit79.lesson04.teach.gn_vragen: {"title": "Questions with gaan", "gloss": "Where are you going? Who are you going with? How long are you going to stay?", "note": "Put the question word first, then *ga* in second place, then *je*. The infinitive, if there is one, goes at the end: *Hoe lang ga je blijven?*"}
  nl.a2.unit79.lesson05.teach.noor_bericht: {"title": "A message from Noor", "gloss": "Hi Lotte! Soon I have a holiday. In August I am going to Belgium with my sister. We are going to stay in a hotel for a week. After that I am going to my parents' for two days. Next year I plan to take a course. Maybe I will move house then too. What are you going to do?", "note": "Noor describes near plans with *gaan* and a longer-term intention with *van plan zijn*. Notice that every infinitive sits at the end of its sentence: *blijven*, *te volgen*, *verhuizen*.", "glosses": {"binnenkort": "soon", "vakantie": "holiday", "augustus": "August", "zus": "sister", "naar": "to", "belgië": "Belgium", "hotel": "hotel", "blijven": "to stay", "daarna": "after that", "ouders": "parents", "dagen": "days", "volgend": "next", "jaar": "year", "plan": "plan (van plan zijn = to plan to)", "cursus": "course", "volgen": "to follow", "misschien": "maybe", "verhuizen": "to move house", "dan": "then", "ook": "also"}}
  nl.a2.unit79.lesson06.teach.lotte_vraag: {"title": "Lotte asks Omar about his plans", "gloss": "Lotte: Hi Omar! Do you have plans for the summer holiday yet?"}
  nl.a2.unit79.lesson06.teach.omar_duitsland: {"title": "Omar answers", "gloss": "Omar: Yes! In August I am going to Germany. I am going to book a hotel."}
  nl.a2.unit79.lesson06.teach.lotte_met_wie: {"title": "Lotte asks who he is going with", "gloss": "Lotte: Nice! Who are you going with?"}
  nl.a2.unit79.lesson06.teach.omar_oom: {"title": "Omar says who and how long", "gloss": "Omar: With my uncle. We are going to stay for a week."}
  nl.a2.unit79.lesson06.teach.lotte_later: {"title": "Lotte asks about later", "gloss": "Lotte: And later? What do you plan to do?"}
  nl.a2.unit79.lesson06.teach.omar_cursus: {"title": "Omar names an intention and asks back", "gloss": "Omar: Next year I plan to take a course. And you?"}
  nl.a2.unit79.lesson06.teach.lotte_antwoord: {"title": "Lotte answers", "gloss": "Lotte: In July I am going to work. Maybe I will go to my parents' after that."}

