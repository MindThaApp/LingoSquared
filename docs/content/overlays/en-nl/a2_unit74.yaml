teaching:
  nl.a2.unit74.lesson01.teach.vertraging:
    title: "The delay"
    gloss: "the delay"
    note: "*De vertraging* is a common (de) noun."
    example_gloss: "There's a delay of ten minutes."
  nl.a2.unit74.lesson01.teach.trein_vertraging:
    title: "Reporting your train is delayed"
    gloss: "My train is delayed."
    note: "*Vertraging hebben* (literally 'to have delay') is the standard way to say a train or bus is running late."
  nl.a2.unit74.lesson01.teach.reden_vertraging:
    title: "Asking the reason for a delay"
    gloss: "What's the reason for the delay?"
    note: "*De reden* (the reason) is a common (de) noun."

  nl.a2.unit74.lesson02.teach.seinstoring:
    title: "The signal failure"
    gloss: "the signal failure"
    note: "*De seinstoring* is the standard NS term for a technical fault in the railway signaling system."
    example_gloss: "My train is cancelled because of a signal failure."
  nl.a2.unit74.lesson02.teach.trein_valt_uit:
    title: "Reporting your train is cancelled"
    gloss: "My train is cancelled because of a signal failure."
    note: "*Uitvallen* (to be cancelled/fail) is a separable verb; *uit* moves to the end of the clause."
  nl.a2.unit74.lesson02.teach.volgende_trein:
    title: "Asking when the next train leaves"
    gloss: "When does the next train leave?"
    note: "*Rijden* (to drive/run) is used for trains and buses running on schedule, not just for driving a car."

  nl.a2.unit74.lesson03.teach.aansluiting:
    title: "The connection"
    gloss: "the connection"
    note: "*De aansluiting* is a common (de) noun, used for a connecting train/bus."
    example_gloss: "I'm missing my connection in Utrecht."
  nl.a2.unit74.lesson03.teach.aansluiting_missen:
    title: "Reporting a missed connection"
    gloss: "I'm missing my connection because of the delay."
    note: "*Missen* (to miss) takes a direct object in Dutch, same as English."
  nl.a2.unit74.lesson03.teach.andere_trein:
    title: "Asking about taking another train"
    gloss: "Can I take another train?"
    note: "*Een andere trein* (another train) uses *andere*, the standard adjective form before a *de*-word."

  nl.a2.unit74.lesson04.teach.servicebalie:
    title: "The service desk"
    gloss: "the service desk"
    note: "*De servicebalie* is a common (de) noun, the standard word for a station help desk."
    example_gloss: "I'm going to the service desk for help."
  nl.a2.unit74.lesson04.teach.help_alternatief:
    title: "Asking for help with an alternative"
    gloss: "Can you help me with an alternative connection?"
    note: "*Kunt u* is the formal/polite form of *kunnen* (can), used with *u*."
  nl.a2.unit74.lesson04.teach.via_amsterdam:
    title: "Being told an alternative route"
    gloss: "You can travel with the intercity via Amersfoort."
    note: "*Via* (via/through) introduces the intermediate stop of an alternative route."

  nl.a2.unit74.lesson05.teach.mededeling:
    title: "Reading a disruption notice"
    gloss: >-
      Important notice: due to a signal failure, no trains are running
      between Utrecht and Arnhem. Travelers can reroute via Amersfoort.
      The delay is expected to last until about three o'clock. We
      advise travelers to check the journey planner.
    note: "*Vijftien uur* is the 24-hour clock form of three o'clock in the afternoon, standard on Dutch public notices."
    glosses:
      Belangrijke: "important (inflected form of belangrijk)"
      mededeling: "notice, announcement"
      door: "because of, due to"
      seinstoring: "signal failure"
      rijden: "run (of trains); drive"
      tussen: "between"
      geen: "no, not any"
      treinen: "trains (plural of trein)"
      Reizigers: "travelers, passengers"
      kunnen: "can, are able to"
      omreizen: "to reroute, travel around"
      via: "via, by way of"
      vertraging: "delay"
      duurt: "lasts (from duren)"
      tot: "until"
      ongeveer: "about, approximately"
      vijftien: "fifteen"
      uur: "o'clock; hour"
      Wij: "we"
      adviseren: "advise"
      reizigers: "travelers, passengers"
      reisplanner: "journey planner"
      raadplegen: "to consult, check"

  nl.a2.unit74.lesson06.teach.medewerker_open:
    title: "Employee opens the conversation"
    gloss: "Employee: NS, good afternoon. How can I help you?"
  nl.a2.unit74.lesson06.teach.lotte_uitgevallen:
    title: "Lotte reports the cancellation"
    gloss: "Lotte: Good afternoon, my train to Arnhem is cancelled. I'd like to know how to get there now."
  nl.a2.unit74.lesson06.teach.medewerker_seinstoring:
    title: "Employee explains the cause"
    gloss: "Employee: There is indeed a signal failure. You can reroute via Amersfoort."
  nl.a2.unit74.lesson06.teach.lotte_ask_time:
    title: "Lotte asks the departure time"
    gloss: "Lotte: What time does that train leave?"
  nl.a2.unit74.lesson06.teach.medewerker_platform:
    title: "Employee gives the platform and time"
    gloss: "Employee: In ten minutes, from platform four."
  nl.a2.unit74.lesson06.teach.lotte_bericht_sturen:
    title: "Lotte decides to send a message"
    gloss: "Lotte: Thank you. I'll just send a message that I'm coming later."
  nl.a2.unit74.lesson06.teach.grammar_uitgevallen:
    title: "Present perfect of uitvallen, and haar/zij"
    gloss: "Her train is cancelled. She can reroute."
    note: "*Is uitgevallen* is the present perfect of *uitvallen* (to be cancelled), formed with *zijn* since it describes a change of state. *Haar* (her, possessive) and *zij* (she, subject) are the third-person feminine forms used when summarizing what happened to Lotte."

