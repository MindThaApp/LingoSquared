review: {status: unreviewed, required_next_reviewer: owner_native_pass, notes: "English overlay for the grammar-led imperfectum unit. OPEN NATIVE QUESTIONS: none identified."}
course:
  title: "Dutch A2"
  description: "Grammar-led A2 Dutch for talking about past incidents."
  learning_goal: "Link a background situation and an event with irregular imperfectum forms, toen and terwijl."
units:
  nl.a2.unit83.wat_gebeurde_er: {title: "What happened?", description: "Describe a small incident, weather change or traffic problem in the imperfectum."}
lessons:
  nl.a2.unit83.lesson01.onregelmatige_vormen: {title: "What happened?"}
  nl.a2.unit83.lesson02.vormen_combineren: {title: "Combining forms"}
  nl.a2.unit83.lesson03.toen_en_terwijl: {title: "Toen and terwijl"}
  nl.a2.unit83.lesson04.een_klein_incident: {title: "A small incident"}
  nl.a2.unit83.lesson05.noors_bericht: {title: "Noor's message"}
  nl.a2.unit83.lesson06.lotte_en_omar: {title: "Lotte and Omar on the road"}
teaching:
  nl.a2.unit83.lesson01.teach.incidenten: {title: "Small incidents", gloss: "the flat tyre / the rain shower / the delay", note: "These nouns name the problems in this unit.", example_gloss: ["My bike has a flat tyre.", "A rain shower suddenly arrived.", "The bus was delayed."]}
  nl.a2.unit83.lesson01.teach.verkeer: {title: "On the road", gloss: "the bike / the bus / the bus stop / on the way", note: "*Onderweg* describes being in the course of a journey.", example_gloss: ["My bike was at the bus stop.", "The bus arrived late.", "It started raining on the way."]}
  nl.a2.unit83.lesson01.teach.weer: {title: "Weather and timing", gloss: "to rain / hard / suddenly / late", note: "*Hard regenen* means to rain heavily.", example_gloss: ["It started raining hard.", "Suddenly the bus arrived.", "The bus arrived late."]}
  nl.a2.unit83.lesson01.teach.gn_irregular_basis: {title: "Six irregular imperfectum verbs", gloss: "to be → was/were; to have → had; to go → went; to come → came; to see → saw; to say → said", note: "Learn these imperfectum forms as a set. Singular and plural often differ: *was/waren, ging/gingen, kwam/kwamen*."}
  nl.a2.unit83.lesson01.teach.gn_irregular_set: {title: "Six more irregular forms", gloss: "to take → took; to give → gave; to stand → stood; to sit → sat; to walk → walked; to ride → rode", note: "The singular forms are *nam, gaf, stond, zat, liep,* and *reed*."}
  nl.a2.unit83.lesson01.teach.vraag: {title: "Ask what happened", gloss: "What happened on the way?", note: "*Gebeurde* is the imperfectum of *gebeuren*."}
  nl.a2.unit83.lesson01.teach.zinnen: {title: "Irregular forms in context", gloss: "I was on my way. The bus was delayed. I saw a rain shower and took the bus."}
  nl.a2.unit83.lesson02.teach.handeling: {title: "Incident verbs", gloss: "to wait / to call / to cycle / to begin / to get", note: "These verbs build the background and event.", example_gloss: ["I have to wait for the bus.", "Lotte wants to call me.", "I want to cycle home.", "It can start to rain.", "I can get a flat tyre."]}
  nl.a2.unit83.lesson02.teach.regular_review: {title: "Regular and irregular imperfectum", gloss: "waited / called / cycled / happened / began / got", note: "The regular forms *wachtte, belde,* and *fietste* follow the rule from Unit 82. *Begon* and *kreeg* are irregular."}
  nl.a2.unit83.lesson02.teach.phrases: {title: "Four incident sentences", gloss: "I was cycling home. Lotte called. It started to rain. I got a flat tyre."}
  nl.a2.unit83.lesson03.teach.connectors: {title: "Time links", gloss: "when / while / next to", note: "Use *toen* for a past moment and *terwijl* for overlapping situations.", example_gloss: ["When I came home, Lotte called.", "While I was waiting, it was raining.", "I stood next to my bike."]}
  nl.a2.unit83.lesson03.teach.gn_toen: {title: "Toen with verb-final order", gloss: "When I was cycling home, it started to rain.", note: "After *toen*, the subordinate-clause verb moves to the end: *ik naar huis fietste*."}
  nl.a2.unit83.lesson03.teach.gn_terwijl: {title: "Terwijl for a background situation", gloss: "While I was waiting for the bus, Lotte called.", note: "After *terwijl*, the verb is final: *ik op de bus wachtte*."}
  nl.a2.unit83.lesson03.teach.gn_inversion: {title: "Inversion after the opening clause", gloss: "After an opening toen- or terwijl-clause, the finite verb comes before the subject: began it; called Lotte.", note: "The comma closes the subordinate clause; the main clause begins with *begon het* or *belde Lotte*."}
  nl.a2.unit83.lesson03.teach.gn_contrast: {title: "Toen versus terwijl", gloss: "Toen names the moment when something happened. Terwijl links two situations that were in progress at the same time.", note: "This unit keeps every narrated action in the imperfectum."}
  nl.a2.unit83.lesson04.teach.halte: {title: "At the stop", gloss: "the stop / home / next to the bike", note: "*Halte* can mean a bus or tram stop.", example_gloss: ["I waited at the stop.", "I arrived home late.", "I stood next to the bike."]}
  nl.a2.unit83.lesson04.teach.regende: {title: "Background weather", gloss: "While I stood next to my bike, it was raining hard."}
  nl.a2.unit83.lesson04.teach.reeks: {title: "A short incident", gloss: "When I was riding home, I got a flat tyre. I walked to the stop and took the bus."}
  nl.a2.unit83.lesson05.teach.reading: {title: "Noor's journey home", gloss: "Yesterday Noor rode home after work. When she was riding along the cycle path, she got a flat tyre. While she stood at the stop, the bus arrived late. She sat on the bus for twenty minutes. When she arrived home, she called Lotte.", note: "Follow the background situations and the events that occurred during them.", glosses: {Gisteren: yesterday, reed: rode, fietspad: cycle path, lekke: flat, band: tyre, halte: stop, twintig: twenty, minuten: minutes}}
  nl.a2.unit83.lesson06.teach.lotte_vraag: {title: "Lotte asks", gloss: "Lotte: Hi Omar, what happened on the way?"}
  nl.a2.unit83.lesson06.teach.omar_band: {title: "Omar names the incident", gloss: "Omar: When I was cycling home, I got a flat tyre."}
  nl.a2.unit83.lesson06.teach.lotte_toen: {title: "Lotte asks what followed", gloss: "Lotte: Oh no! And then?"}
  nl.a2.unit83.lesson06.teach.omar_regen: {title: "Omar adds a weather change", gloss: "Omar: While I stood next to my bike, it started raining hard."}
  nl.a2.unit83.lesson06.teach.lotte_thuis: {title: "Lotte asks how he got home", gloss: "Lotte: How did you get home?"}
  nl.a2.unit83.lesson06.teach.omar_bus: {title: "Omar finishes the account", gloss: "Omar: I walked to the bus stop and took the bus."}
exercises:
  nl.a2.unit83.lesson01.exercise01.choose_had: {instruction: "Choose the Dutch sentence in the imperfectum.", correct_option: "De bus had vertraging.", distractors: ["De bus heeft vertraging.", "De bus waren vertraging.", "De bus hadden vertraging."], accepted_answers: [{value: "De bus had vertraging.", status: correct}], feedback: "*Had* is the singular imperfectum of *hebben*."}
  nl.a2.unit83.lesson01.exercise02.choose_saw: {instruction: "Choose the Dutch sentence in the imperfectum.", correct_option: "Ik zag een regenbui.", distractors: ["Ik zie een regenbui.", "Ik zagen een regenbui.", "Ik was een regenbui."], accepted_answers: [{value: "Ik zag een regenbui.", status: correct}], feedback: "*Zag* is the singular imperfectum of *zien*."}
  nl.a2.unit83.lesson01.exercise03.match_forms: {instruction: "Match each infinitive to its singular imperfectum form.", accepted_answers: [{value: [{left: zijn, right: was}, {left: hebben, right: had}, {left: gaan, right: ging}, {left: komen, right: kwam}, {left: zien, right: zag}, {left: nemen, right: nam}], status: correct}], feedback: "These six high-frequency verbs have irregular imperfectum forms."}
  nl.a2.unit83.lesson01.exercise04.order_delay: {instruction: "Put the words in order to say 'The bus was delayed.'", correct_option: "De bus had vertraging", accepted_answers: [{value: "De bus had vertraging", status: correct}], feedback: "*De bus had vertraging* uses imperfectum *had*."}
  nl.a2.unit83.lesson01.exercise05.complete_saw: {instruction: "Complete the sentence with the singular imperfectum of zien.", correct_option: zag, accepted_answers: [{value: zag, status: correct}], feedback: "*Ik zag een regenbui* = I saw a rain shower."}
  nl.a2.unit83.lesson01.exercise06.translate_took_bus: {instruction: "Translate into Dutch. Use the imperfectum of nemen.", accepted_answers: [{value: "Ik nam de bus.", status: correct}, {value: "Ik nam de bus", status: correct}], feedback: "*Ik nam de bus* = I took the bus."}
  nl.a2.unit83.lesson01.exercise07.write_was_underway: {instruction: "Write the requested Dutch sentence using the imperfectum of zijn.", correct_option: "Ik was onderweg.", accepted_answers: [{value: "Ik was onderweg.", status: correct}, {value: "Ik was onderweg", status: correct}], feedback: "*Ik was onderweg* = I was on my way."}
  nl.a2.unit83.lesson02.exercise01.choose_cycled: {instruction: "Choose the Dutch imperfectum sentence.", correct_option: "Ik fietste naar huis.", distractors: ["Ik fiets naar huis.", "Ik fietsten naar huis.", "Ik reed de bus."], accepted_answers: [{value: "Ik fietste naar huis.", status: correct}], feedback: "*Fietste* is the singular imperfectum of *fietsen*."}
  nl.a2.unit83.lesson02.exercise02.choose_got_flat: {instruction: "Choose the sentence meaning 'I got a flat tyre.'", correct_option: "Ik kreeg een lekke band.", distractors: ["Ik krijg een lekke band.", "Ik kregen een lekke band.", "Ik had vertraging."], accepted_answers: [{value: "Ik kreeg een lekke band.", status: correct}], feedback: "*Kreeg* is the singular imperfectum of *krijgen*."}
  nl.a2.unit83.lesson02.exercise03.match_past: {instruction: "Match each infinitive to its singular imperfectum form.", accepted_answers: [{value: [{left: wachten, right: wachtte}, {left: bellen, right: belde}, {left: fietsen, right: fietste}, {left: beginnen, right: begon}, {left: krijgen, right: kreeg}, {left: gebeuren, right: gebeurde}], status: correct}], feedback: "The first three are regular; *begon* and *kreeg* are irregular."}
  nl.a2.unit83.lesson02.exercise04.order_flat: {instruction: "Put the words in order to say 'I got a flat tyre.'", correct_option: "Ik kreeg een lekke band", accepted_answers: [{value: "Ik kreeg een lekke band", status: correct}], feedback: "*Ik kreeg een lekke band* uses imperfectum *kreeg*."}
  nl.a2.unit83.lesson02.exercise05.complete_rain: {instruction: "Complete with the singular imperfectum of beginnen.", correct_option: begon, accepted_answers: [{value: begon, status: correct}], feedback: "*Het begon te regenen* = It started to rain."}
  nl.a2.unit83.lesson02.exercise06.translate_lotte_called: {instruction: "Translate into Dutch using the imperfectum of bellen.", accepted_answers: [{value: "Lotte belde.", status: correct}, {value: "Lotte belde", status: correct}], feedback: "*Lotte belde* = Lotte called."}
  nl.a2.unit83.lesson02.exercise07.write_cycled_home: {instruction: "Write the requested sentence using the imperfectum of fietsen.", correct_option: "Ik fietste naar huis.", accepted_answers: [{value: "Ik fietste naar huis.", status: correct}, {value: "Ik fietste naar huis", status: correct}], feedback: "*Ik fietste naar huis* = I was cycling home."}
  nl.a2.unit83.lesson03.exercise01.choose_toen: {instruction: "Choose the correct word order after toen.", correct_option: "Toen ik naar huis fietste, begon het te regenen.", distractors: ["Toen ik fietste naar huis, het begon te regenen.", "Toen fietste ik naar huis, begon het te regenen.", "Toen ik naar huis fietste, het begon te regenen."], accepted_answers: [{value: "Toen ik naar huis fietste, begon het te regenen.", status: correct}], feedback: "The subordinate verb is final in *toen ik naar huis fietste*, followed by inversion: *begon het*."}
  nl.a2.unit83.lesson03.exercise02.listen_while: {instruction: "Listen and select what you hear.", correct_option: "Terwijl ik op de bus wachtte, belde Lotte.", distractors: ["Toen ik naar huis fietste, begon het te regenen.", "Terwijl ik naast mijn fiets stond, kwam de bus.", "Toen ik de bus zag, liep ik naar de halte."], accepted_answers: [{value: "Terwijl ik op de bus wachtte, belde Lotte.", status: correct}], feedback: "You heard *Terwijl ik op de bus wachtte, belde Lotte*."}
  nl.a2.unit83.lesson03.exercise03.match_links: {instruction: "Match each Dutch toen- or terwijl-clause to its English meaning.", accepted_answers: [{value: [{left: "Toen ik naar huis fietste", right: "When I was cycling home"}, {left: "Terwijl ik op de bus wachtte", right: "While I was waiting for the bus"}, {left: "Toen ik onderweg was", right: "When I was on my way"}, {left: "Terwijl ik naast mijn fiets stond", right: "While I was standing next to my bike"}, {left: "Toen ik de bus zag", right: "When I saw the bus"}, {left: "Terwijl ik in de bus zat", right: "While I was sitting in the bus"}], status: correct}], feedback: "Toen means a moment in the past; terwijl means two things going on at the same time."}
  nl.a2.unit83.lesson03.exercise04.order_toen: {instruction: "Put the words in order. Use toen, verb-final subordinate-clause order and main-clause inversion.", correct_option: "Toen ik naar huis fietste begon het te regenen", accepted_answers: [{value: "Toen ik naar huis fietste begon het te regenen", status: correct}], feedback: "*Toen ik naar huis fietste, begon het te regenen.*"}
  nl.a2.unit83.lesson03.exercise05.complete_while: {instruction: "Complete with the imperfectum of wachten.", correct_option: wachtte, accepted_answers: [{value: wachtte, status: correct}], feedback: "After *terwijl*, *wachtte* stands at the end of the subordinate clause."}
  nl.a2.unit83.lesson03.exercise06.translate_when: {instruction: "Translate into Dutch using toen, the imperfectum, verb-final subordinate-clause order and main-clause inversion.", accepted_answers: [{value: "Toen ik naar huis fietste, begon het te regenen.", status: correct}, {value: "Toen ik naar huis fietste begon het te regenen", status: correct}], feedback: "*Toen ik naar huis fietste, begon het te regenen.*"}
  nl.a2.unit83.lesson03.exercise07.write_while: {instruction: "Write the requested sentence with terwijl and the imperfectum.", correct_option: "Terwijl ik op de bus wachtte, belde Lotte.", accepted_answers: [{value: "Terwijl ik op de bus wachtte, belde Lotte.", status: correct}, {value: "Terwijl ik op de bus wachtte belde Lotte", status: correct}], feedback: "*Terwijl ik op de bus wachtte, belde Lotte.*"}
  nl.a2.unit83.lesson04.exercise01.choose_incident: {instruction: "Choose the correct Dutch incident sentence.", correct_option: "Toen ik naar huis reed, kreeg ik een lekke band.", distractors: ["Toen ik reed naar huis, ik kreeg een lekke band.", "Toen ik naar huis reed, ik kreeg een lekke band.", "Toen ik naar huis rijden, kreeg ik een lekke band."], accepted_answers: [{value: "Toen ik naar huis reed, kreeg ik een lekke band.", status: correct}], feedback: "*Reed* is final in the toen-clause; *kreeg ik* shows inversion."}
  nl.a2.unit83.lesson04.exercise02.choose_background: {instruction: "Choose the correct sentence with terwijl and the imperfectum.", correct_option: "Terwijl ik naast mijn fiets stond, regende het hard.", distractors: ["Terwijl ik stond naast mijn fiets, het regende hard.", "Terwijl ik naast mijn fiets staat, regende het hard.", "Terwijl ik naast mijn fiets stond, het regende hard."], accepted_answers: [{value: "Terwijl ik naast mijn fiets stond, regende het hard.", status: correct}], feedback: "*Stond* is final in the subordinate clause; *regende het* has inversion."}
  nl.a2.unit83.lesson04.exercise03.match_story: {instruction: "Match each Dutch phrase to its precise English meaning.", accepted_answers: [{value: [{left: "naar huis reed", right: "was riding home"}, {left: "een lekke band kreeg", right: "got a flat tyre"}, {left: "naast mijn fiets stond", right: "stood next to my bike"}, {left: "het regende hard", right: "it was raining hard"}, {left: "naar de halte liep", right: "walked to the stop"}, {left: "de bus nam", right: "took the bus"}], status: correct}], feedback: "Each phrase has one distinct meaning."}
  nl.a2.unit83.lesson04.exercise04.order_walked: {instruction: "Put the words in order to say you first walked to the stop and then took the bus (imperfectum).", correct_option: "Ik liep naar de halte en nam de bus", accepted_answers: [{value: "Ik liep naar de halte en nam de bus", status: correct}], feedback: "*Liep* and *nam* are irregular imperfectum forms."}
  nl.a2.unit83.lesson04.exercise05.complete_stood: {instruction: "Complete with the singular imperfectum of staan.", correct_option: stond, accepted_answers: [{value: stond, status: correct}], feedback: "*Ik stond naast mijn fiets* = I stood next to my bike."}
  nl.a2.unit83.lesson04.exercise06.translate_flat: {instruction: "Translate using toen, the imperfectum and main-clause inversion.", accepted_answers: [{value: "Toen ik naar huis reed, kreeg ik een lekke band.", status: correct}, {value: "Toen ik naar huis fietste, kreeg ik een lekke band.", status: correct}, {value: "Toen ik naar huis fietste kreeg ik een lekke band", status: correct}, {value: "Toen ik naar huis reed kreeg ik een lekke band", status: correct}], feedback: "*Toen ik naar huis reed, kreeg ik een lekke band.*"}
  nl.a2.unit83.lesson04.exercise07.write_incident: {instruction: "Write exactly two Dutch sentences in the imperfectum, following the two numbered content requirements in the prompt.", correct_option: "Toen ik naar huis reed, kreeg ik een lekke band. Ik liep naar de halte en nam de bus.", accepted_answers: [{value: "Toen ik naar huis reed, kreeg ik een lekke band. Ik liep naar de halte en nam de bus.", status: correct}, {value: "Toen ik naar huis reed, kreeg ik een lekke band. Ik liep naar de bushalte en nam de bus.", status: correct}, {value: "Toen ik naar huis reed kreeg ik een lekke band. Ik liep naar de bushalte en nam de bus", status: correct}, {value: "Toen ik naar huis fietste, kreeg ik een lekke band. Ik liep naar de halte en nam de bus.", status: correct}, {value: "Toen ik naar huis fietste kreeg ik een lekke band. Ik liep naar de halte en nam de bus", status: correct}, {value: "Toen ik naar huis fietste, kreeg ik een lekke band. Ik liep naar de bushalte en nam de bus.", status: correct}, {value: "Toen ik naar huis fietste kreeg ik een lekke band. Ik liep naar de bushalte en nam de bus", status: correct}, {value: "Toen ik naar huis reed kreeg ik een lekke band. Ik liep naar de halte en nam de bus", status: correct}], feedback: "*Toen ik naar huis reed, kreeg ik een lekke band. Ik liep naar de halte en nam de bus.*"}
  nl.a2.unit83.lesson05.exercise01.read_flat: {instruction: "Read Noor's message. What happened on the cycle path?", correct_option: "She got a flat tyre.", distractors: ["She saw Lotte.", "The bus arrived late.", "She called Omar."], accepted_answers: [{value: "She got a flat tyre.", status: correct}], feedback: "*Toen ze over het fietspad reed, kreeg ze een lekke band.*"}
  nl.a2.unit83.lesson05.exercise02.read_bus: {instruction: "What happened while Noor stood at the stop?", correct_option: "The bus arrived late.", distractors: ["Her bike was repaired.", "Lotte called her.", "It stopped raining."], accepted_answers: [{value: "The bus arrived late.", status: correct}], feedback: "*Terwijl ze bij de halte stond, kwam de bus te laat.*"}
  nl.a2.unit83.lesson05.exercise03.match_reading: {instruction: "Match each distinct reading detail to what happened there or then.", accepted_answers: [{value: [{left: "na haar werk", right: "Noor rode home"}, {left: "over het fietspad", right: "she got a flat tyre"}, {left: "bij de halte", right: "the bus arrived late"}, {left: "in de bus", right: "she sat for twenty minutes"}, {left: "thuis", right: "she called Lotte"}, {left: "gisteren", right: "the day it happened"}], status: correct}], feedback: "The locations and time phrases distinguish all six details."}
  nl.a2.unit83.lesson05.exercise04.order_home: {instruction: "Put the words in order with a toen-clause and main-clause inversion.", correct_option: "Toen ze thuis kwam belde ze Lotte", accepted_answers: [{value: "Toen ze thuis kwam belde ze Lotte", status: correct}], feedback: "*Toen ze thuis kwam, belde ze Lotte.*"}
  nl.a2.unit83.lesson05.exercise05.translate_noor: {instruction: "Translate using toen, the imperfectum and main-clause inversion.", accepted_answers: [{value: "Toen Noor naar huis reed, kreeg ze een lekke band.", status: correct}, {value: "Toen Noor naar huis fietste, kreeg ze een lekke band.", status: correct}, {value: "Toen Noor naar huis fietste kreeg ze een lekke band", status: correct}, {value: "Toen Noor naar huis reed kreeg ze een lekke band", status: correct}], feedback: "*Toen Noor naar huis reed, kreeg ze een lekke band.*"}
  nl.a2.unit83.lesson05.exercise06.dictation_flat: {instruction: "Type what you hear.", correct_response: "Toen Noor naar huis reed, kreeg ze een lekke band.", orthography_strict: true, feedback: "You heard *Toen Noor naar huis reed, kreeg ze een lekke band.*"}
  nl.a2.unit83.lesson05.exercise07.dictation_bus: {instruction: "Type what you hear.", correct_response: "Terwijl ze bij de halte stond, kwam de bus te laat.", orthography_strict: true, feedback: "You heard *Terwijl ze bij de halte stond, kwam de bus te laat.*"}
  nl.a2.unit83.lesson06.exercise01.listen_question: {instruction: "Listen and select Lotte's opening question.", correct_option: "Hoi Omar, wat gebeurde er onderweg?", distractors: ["Hoi Omar, wat gebeurde er thuis?", "Hoi Omar, wat gebeurde er bij de halte?", "Hoi Omar, begon het onderweg te regenen?"], accepted_answers: [{value: "Hoi Omar, wat gebeurde er onderweg?", status: correct}], feedback: "Lotte opens with *Hoi Omar, wat gebeurde er onderweg?*"}
  nl.a2.unit83.lesson06.exercise02.comprehend_flat: {instruction: "Listen to the dialogue. What happened while Omar was cycling home?", correct_option: "He got a flat tyre.", distractors: ["He missed the bus.", "He saw a traffic accident.", "Lotte called him."], accepted_answers: [{value: "He got a flat tyre.", status: correct}], feedback: "Omar says: *Toen ik naar huis fietste, kreeg ik een lekke band.*"}
  nl.a2.unit83.lesson06.exercise03.match_dialogue: {instruction: "Match each distinct dialogue phrase to its function in Omar's account.", accepted_answers: [{value: [{left: "wat gebeurde er onderweg?", right: "asks about the incident"}, {left: "naar huis fietste", right: "background: what Omar was doing"}, {left: "een lekke band kreeg", right: "names the first event"}, {left: "naast mijn fiets stond", right: "background: where Omar was standing"}, {left: "het begon hard te regenen", right: "names the weather change"}, {left: "naar de bushalte liep", right: "explains how the trip continued"}], status: correct}], feedback: "Each phrase plays one distinct role in the account."}
  nl.a2.unit83.lesson06.exercise04.order_rain: {instruction: "Put the words in order using terwijl, the imperfectum and main-clause inversion.", correct_option: "Terwijl ik naast mijn fiets stond begon het hard te regenen", accepted_answers: [{value: "Terwijl ik naast mijn fiets stond begon het hard te regenen", status: correct}], feedback: "*Terwijl ik naast mijn fiets stond, begon het hard te regenen.*"}
