teaching:
  nl.a1.unit06.lesson01.teach.koffie_thee_water: {title: "Coffee, tea, water", gloss: "coffee, tea, water", note: "*De koffie*, *de thee*, *het water* — note the different articles."}
  nl.a1.unit06.lesson01.teach.melk_sap: {title: "Milk, juice", gloss: "milk, juice", note: "*De melk*, *het sap*."}

  nl.a1.unit06.lesson02.teach.brood_broodje_kaas_appel: {title: "Bread, cheese sandwich, apple", gloss: "bread, cheese sandwich, apple", note: "*Het brood*, *de appel*. *Broodje* means a small bread roll or sandwich; *broodje kaas* is a very common everyday order."}
  nl.a1.unit06.lesson02.teach.ik_wil_graag: {title: "I would like ...", gloss: "I would like ...", note: "*Ik wil graag ...* is a common polite way to order something in everyday speech."}
  nl.a1.unit06.lesson02.teach.ik_wil_graag_koffie: {title: "I would like a coffee", gloss: "I would like a coffee.", note: "*Een* means 'a' or 'an' and is the same with every Dutch noun."}
  nl.a1.unit06.lesson02.teach.ik_wil_graag_broodje: {title: "I would like a cheese sandwich", gloss: "I would like a cheese sandwich.", note: "Say *een broodje kaas*: *kaas* follows *broodje* directly."}

  nl.a1.unit06.lesson03.teach.alstublieft_alsjeblieft: {title: "Please (formal and informal)", gloss: "please (formal), please (informal)", note: "Use *alstublieft* when you address someone formally as *u*, and *alsjeblieft* when addressing someone informally as *jij* or *je*."}
  nl.a1.unit06.lesson03.teach.please_note: {title: "Alstublieft vs alsjeblieft", gloss: "alstublieft = formal please, alsjeblieft = informal please", note: "Choose *alstublieft* with *u* and *alsjeblieft* with *jij* or *je*."}
  nl.a1.unit06.lesson03.teach.twee_thee: {title: "I would like two teas, please", gloss: "I would like two teas, please.", note: "In a café order, *twee thee* naturally means two cups of tea; *thee* stays singular here."}

  nl.a1.unit06.lesson04.teach.wat_wilt_u: {title: "What would you like to drink? (formal)", gloss: "What would you like to drink?", note: "*Wilt u* is the usual formal form in the Netherlands."}
  nl.a1.unit06.lesson04.teach.wat_wil_je: {title: "What would you like to eat? (informal)", gloss: "What would you like to eat?", note: "Use *wil*, not *wilt*, before *je* or *jij*, as in this question."}
  nl.a1.unit06.lesson04.teach.wilt_wil_note: {title: "Wilt vs wil", gloss: "wilt u ... but wil je/jij ...", note: "When the verb comes before the person, use *wilt u* but *wil je* or *wil jij*. Do not say *wilt je* or *wilt jij*."}
  nl.a1.unit06.lesson04.teach.appelsap: {title: "Apple juice", gloss: "apple juice", note: "Write *appelsap* as one word, not as *appel sap*."}
  nl.a1.unit06.lesson04.teach.mag_ik: {title: "May I have an apple juice, please?", gloss: "May I have an apple juice, please?", note: "*Mag ik ...?* is another common, slightly more casual way to order, alongside *ik wil graag ...*"}

  nl.a1.unit06.lesson05.teach.euro_vijftig: {title: "Two euros fifty", gloss: "€2.50 — two euros fifty", note: "€2,50 is commonly said *twee euro vijftig*, without *en* or *cent*."}
  nl.a1.unit06.lesson05.teach.menu: {title: "Menu", gloss: "Menu — Coffee: €2.50. Tea: €2.00. Cheese sandwich: €3.50. Apple juice: €2.50.", note: "Dutch menus write these prices with a decimal comma: €2,50, €2,00 and €3,50."}

  nl.a1.unit06.lesson06.teach.goedemiddag: {title: "Good afternoon", gloss: "good afternoon", note: "A natural greeting at a café counter in the afternoon."}
  nl.a1.unit06.lesson06.teach.komt_eraan: {title: "Coming right up!", gloss: "Coming right up!", note: "A natural, common thing for staff to say after taking an order."}
  nl.a1.unit06.lesson06.teach.lines01_03: {title: "Good afternoon, what would you like to drink?", gloss: "Staff member: Good afternoon, what would you like to drink? Lotte: I would like a coffee, please.", note: "A formal service interaction — note Lotte uses *alstublieft* with the staff member, unlike her informal speech with Omar."}
  nl.a1.unit06.lesson06.teach.lines04_06: {title: "Would you also like something to eat?", gloss: "Staff member: And would you like something to eat too? Lotte: Yes, a cheese sandwich, please. Staff member: Coming right up!", note: "*En wilt u ook iets eten?* is a natural way for staff to ask whether you want food too."}

exercises:
  nl.a1.unit06.lesson01.exercise01.choose_koffie:
    instruction: "Choose the Dutch word for 'coffee'."
    correct_option: koffie
    distractors: [thee, water, melk]
    accepted_answers: [{value: koffie, status: correct}]
    feedback: "Koffie means coffee."
  nl.a1.unit06.lesson01.exercise02.choose_water:
    instruction: "Choose the Dutch word for 'water'."
    correct_option: water
    distractors: [koffie, thee, sap]
    accepted_answers: [{value: water, status: correct}]
    feedback: "Water means water."
  nl.a1.unit06.lesson01.exercise03.listen_koffie:
    instruction: "Listen and choose what you hear."
    correct_option: coffee
    distractors: [tea, water, milk]
    accepted_answers: [{value: coffee, status: correct}]
    feedback: "Koffie means coffee."
  nl.a1.unit06.lesson01.exercise04.match_drinks:
    instruction: "Match each Dutch word to its English meaning."
    accepted_answers:
      - value: [{left: koffie, right: coffee}, {left: thee, right: tea}, {left: water, right: water}, {left: melk, right: milk}]
        status: correct
    feedback: "Koffie/thee/water/melk are coffee/tea/water/milk."
