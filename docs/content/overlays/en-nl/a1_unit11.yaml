teaching:
  nl.a1.unit11.lesson01.teach.samen: {title: "Together", gloss: "together", note: "Samen makes clear that people do the activity together."}
  nl.a1.unit11.lesson01.teach.koffie_drinken: {title: "Have coffee", gloss: "to have coffee", note: "Dutch literally says koffie drinken, to drink coffee."}
  nl.a1.unit11.lesson01.teach.naar_de_film: {title: "Go to a film", gloss: "to go to a film", note: "Naar de film gaan is a common way to describe going to the cinema without introducing a new place word."}
  nl.a1.unit11.lesson01.teach.zullen_we: {title: "Shall we have coffee?", gloss: "Shall we have coffee?", note: "Zullen we ...? is the standard Dutch pattern for proposing a joint activity."}
  nl.a1.unit11.lesson01.teach.zullen_note: {title: "Using Zullen we", gloss: "Zullen we + activity? is the usual way to propose doing something together.", note: "Put the activity after we and the action word at the end: Zullen we koffie drinken?"}
  nl.a1.unit11.lesson01.teach.zin_om: {title: "Do you feel like going to a film?", gloss: "Do you feel like going to a film?", note: "Heb je zin om ...? asks informally whether the other person feels like doing an activity. Use te before gaan here."}

  nl.a1.unit11.lesson02.teach.ja_leuk: {title: "Yes, sounds good!", gloss: "Yes, sounds good!", note: "Ja, leuk! is a brief, enthusiastic acceptance."}
  nl.a1.unit11.lesson02.teach.goed_idee: {title: "Good idea", gloss: "Good idea!", note: "Goed idee! accepts the proposal by evaluating it positively."}
  nl.a1.unit11.lesson02.teach.goed_plan: {title: "That is a good plan", gloss: "That is a good plan.", note: "This is a slightly fuller positive response."}
  nl.a1.unit11.lesson02.teach.sorry_reason: {title: "Decline with a reason", gloss: "Sorry, I can't, because I'm working.", note: "Sorry softens the decline, and want introduces the brief reason."}
  nl.a1.unit11.lesson02.teach.no_time: {title: "I don't have time", gloss: "I don't have time.", note: "Ik heb geen tijd is a direct but ordinary reason for declining."}
  nl.a1.unit11.lesson02.teach.polite_decline: {title: "A friendly decline", gloss: "Sorry + I can't + a short reason makes a decline friendly.", note: "A reason is optional in conversation, but it makes the model useful and polite."}

  nl.a1.unit11.lesson03.teach.afspreken: {title: "Arrange to meet", gloss: "to arrange to meet", note: "Afspreken is written as one word after Zullen we. In We spreken vrijdag af, it splits into spreken and af."}
  nl.a1.unit11.lesson03.teach.friday_half_three: {title: "Meet Friday at half past two", gloss: "Shall we meet Friday at 2:30?", note: "This combines the weekday from unit03 with om plus the time from unit04."}
  nl.a1.unit11.lesson03.teach.half_three_review: {title: "Half three means 2:30", gloss: "half three = 2:30; om half three gives the meeting time.", note: "Dutch counts forward to the next hour: half drie is halfway to three, so it means 2:30."}
  nl.a1.unit11.lesson03.teach.date_time: {title: "A date and time", gloss: "on Friday 17 April at 3:15", note: "Weekdays and months remain lowercase. Use op for the date and om for the clock time."}
  nl.a1.unit11.lesson03.teach.confirm_time: {title: "Confirm the time", gloss: "Yes, Friday at 2:30 is good.", note: "Is goed confirms that the proposed schedule works."}

  nl.a1.unit11.lesson04.teach.bericht: {title: "Message", gloss: "the message", note: "Bericht is a short written or digital message."}
  nl.a1.unit11.lesson04.teach.uitnodiging: {title: "Invitation", gloss: "the invitation", note: "An uitnodiging asks someone to join an activity or event."}
  nl.a1.unit11.lesson04.teach.taalcafe_review: {title: "Language café", gloss: "the language café", note: "Recall taalcafé from earlier units. It is one compound word and keeps its accent."}
  nl.a1.unit11.lesson04.teach.invitation: {title: "Lotte's invitation", gloss: "Hi Omar, do you feel like having coffee at the language café on Saturday 18 April at 2:30? Regards, Lotte.", note: "Read for four details: activity, date, time, and place."}

  nl.a1.unit11.lesson05.teach.proposal_message: {title: "A proposal message", gloss: "Hi Omar, shall we have coffee Friday at 2:30? Regards, Lotte.", note: "The message includes a greeting, activity, day, time, and closing."}
  nl.a1.unit11.lesson05.teach.confirm_message: {title: "A confirmation message", gloss: "Hi Lotte, yes, sounds good! Friday at 2:30 is good. See you Friday! Omar.", note: "The reply both accepts the activity and repeats the schedule to confirm it."}
  nl.a1.unit11.lesson05.teach.message_shape: {title: "What a message includes", gloss: "A short message gives the activity, the day or date, and the time.", note: "A greeting and closing are useful, but the important details are the activity and when it happens."}

  nl.a1.unit11.lesson06.teach.proposal: {title: "Lotte proposes coffee", gloss: "Lotte: Shall we have coffee on Friday? Omar: Yes, sounds good! What time?", note: "Omar accepts the activity before asking for the time."}
  nl.a1.unit11.lesson06.teach.first_time: {title: "Lotte's first time", gloss: "Lotte: At 2:30.", note: "Half drie means 2:30, following the unit04 convention."}
  nl.a1.unit11.lesson06.teach.negotiate: {title: "Omar proposes another time", gloss: "Omar: Sorry, I can't at 2:30. Can we do 3:15?", note: "Kan het om ...? is a concise way to ask whether another time works."}
  nl.a1.unit11.lesson06.teach.confirm: {title: "They confirm the final plan", gloss: "Lotte: Yes, 3:15 is good. Omar: Good plan. Then we'll meet Friday at 3:15.", note: "Here afspreken splits into spreken near the start and af at the end."}

exercises:
  nl.a1.unit11.lesson01.exercise01.choose_joint_proposal:
    instruction: "Choose the standard Dutch proposal meaning 'Shall we have coffee?'"
    correct_option: "Zullen we koffie drinken?"
    distractors: ["Heb je koffie?", "Drink je koffie?", "Ik wil koffie drinken."]
    accepted_answers: [{value: "Zullen we koffie drinken?", status: correct}]
    feedback: "Zullen we ...? proposes a joint activity."
  nl.a1.unit11.lesson01.exercise02.listen_coffee:
    instruction: "Listen and choose the activity being proposed."
    correct_option: "have coffee"
    distractors: ["go to a film", "have breakfast", "go shopping"]
    accepted_answers: [{value: "have coffee", status: correct}]
    feedback: "The speaker proposes koffie drinken."
  nl.a1.unit11.lesson01.exercise03.choose_feel_like:
    instruction: "Choose the Dutch question meaning 'Do you feel like going to a film?'"
    correct_option: "Heb je zin om naar de film te gaan?"
    distractors: ["Zullen we koffie drinken?", "Hoe laat begint de film?", "Ga je naar het taalcafé?"]
    accepted_answers: [{value: "Heb je zin om naar de film te gaan?", status: correct}]
    feedback: "Heb je zin om ...? asks whether someone feels like doing the activity."
  nl.a1.unit11.lesson01.exercise04.match_proposals:
    instruction: "Match each Dutch proposal pattern to its English meaning."
    accepted_answers: [{value: [{left: "Zullen we ...?", right: "Shall we ...?"}, {left: "Heb je zin om ...?", right: "Do you feel like ...?"}], status: correct}]
    feedback: "Both patterns make an informal proposal, with a slightly different emphasis."
  nl.a1.unit11.lesson01.exercise05.order_coffee:
    instruction: "Put the words in order to propose having coffee."
    correct_option: "Zullen we koffie drinken"
    accepted_answers: [{value: "Zullen we koffie drinken", status: correct}]
    feedback: "The action word drinken comes at the end."
  nl.a1.unit11.lesson01.exercise06.listen_order_film:
    instruction: "Listen and put the words in the order you hear."
    correct_option: "Heb je zin om naar de film te gaan"
    accepted_answers: [{value: "Heb je zin om naar de film te gaan", status: correct}]
    feedback: "The complete question is Heb je zin om naar de film te gaan?"
  nl.a1.unit11.lesson01.exercise07.speak_proposal:
    instruction: "Propose having coffee together in Dutch. Say it aloud, then enter it."
    accepted_answers: [{value: "Zullen we koffie drinken?", status: correct}, {value: "Zullen we koffie drinken", status: correct}]
    feedback: "Zullen we koffie drinken?"

  nl.a1.unit11.lesson02.exercise01.choose_accept:
    instruction: "Choose the response that accepts the proposal."
    correct_option: "Ja, leuk!"
    distractors: ["Sorry, ik kan niet.", "Ik heb geen tijd.", "Nee, ik werk."]
    accepted_answers: [{value: "Ja, leuk!", status: correct}]
    feedback: "Ja, leuk! is a friendly acceptance."
  nl.a1.unit11.lesson02.exercise02.listen_accept:
    instruction: "Listen and choose whether the speaker accepts or declines."
    correct_option: accepts
    distractors: [declines, asks, confirms]
    accepted_answers: [{value: accepts, status: correct}]
    feedback: "Ja, leuk! accepts the proposal."
  nl.a1.unit11.lesson02.exercise03.choose_decline:
    instruction: "Choose the polite decline that includes a reason."
    correct_option: "Sorry, ik kan niet, want ik werk."
    distractors: ["Sorry, ik kan niet.", "Ja, leuk!", "Ik werk."]
    accepted_answers: [{value: "Sorry, ik kan niet, want ik werk.", status: correct}]
    feedback: "Sorry softens the decline, and want ik werk gives the reason."
  nl.a1.unit11.lesson02.exercise04.match_responses:
    instruction: "Match each response to accepting or declining."
    accepted_answers: [{value: [{left: "Ja, leuk!", right: accepting}, {left: "Goed idee!", right: accepting}, {left: "Sorry, ik kan niet.", right: declining}, {left: "Ik heb geen tijd.", right: declining}], status: correct}]
    feedback: "Ja, leuk and Goed idee accept; the other two responses decline."
  nl.a1.unit11.lesson02.exercise05.listen_order_reason:
    instruction: "Listen and put the polite decline in order."
    correct_option: "Sorry ik kan niet want ik werk"
    accepted_answers: [{value: "Sorry ik kan niet want ik werk", status: correct}]
    feedback: "The speaker declines and then gives a reason with want."
  nl.a1.unit11.lesson02.exercise06.respond_accept:
    instruction: "Reply in Dutch and accept the proposal."
    accepted_answers: [{value: "Goed idee!", status: correct}, {value: "Goed idee", status: correct}, {value: "Ja, leuk!", status: correct}, {value: "Ja, leuk", status: correct}, {value: "Dat is een goed plan.", status: correct}, {value: "Dat is een goed plan", status: correct}]
    feedback: "Goed idee! and Ja, leuk! are both natural acceptances."
  nl.a1.unit11.lesson02.exercise07.respond_decline:
    instruction: "Reply in Dutch. Decline politely and say that you are working."
    accepted_answers: [{value: "Sorry, ik kan niet, want ik werk.", status: correct}, {value: "Sorry, ik kan niet, want ik werk", status: correct}, {value: "Ik kan niet, want ik werk.", status: acceptable_with_note, note: "Clear and natural, though sorry makes the decline friendlier."}]
    feedback: "A friendly model is: Sorry, ik kan niet, want ik werk."
  nl.a1.unit11.lesson02.exercise08.listen_type_no_time:
    instruction: "Listen and type the complete Dutch sentence."
    accepted_answers: [{value: "Ik heb geen tijd.", status: correct}, {value: "Ik heb geen tijd", status: correct}]
    feedback: "Ik heb geen tijd means I don't have time."

  nl.a1.unit11.lesson03.exercise01.choose_half_three:
    instruction: "Choose the Dutch time expression for 2:30."
    correct_option: "half drie"
    distractors: ["half twee", "drie uur", "kwart over drie"]
    accepted_answers: [{value: "half drie", status: correct}]
    feedback: "Dutch half drie means halfway to three: 2:30."
  nl.a1.unit11.lesson03.exercise02.listen_schedule:
    instruction: "Listen and choose the proposed day and time."
    correct_option: "Friday at 2:30"
    distractors: ["Friday at 3:30", "Saturday at 2:30", "Friday at 3:15"]
    accepted_answers: [{value: "Friday at 2:30", status: correct}]
    feedback: "The speaker says vrijdag om half drie."
  nl.a1.unit11.lesson03.exercise03.choose_full_schedule:
    instruction: "Choose the Dutch expression meaning 'on Friday 17 April at 3:15.'"
    correct_option: "op vrijdag 17 april om kwart over drie"
    distractors: ["op vrijdag 17 april om half drie", "op zaterdag 17 april om kwart over drie", "vrijdag om kwart voor drie"]
    accepted_answers: [{value: "op vrijdag 17 april om kwart over drie", status: correct}]
    feedback: "Use op for the date and om for the time."
  nl.a1.unit11.lesson03.exercise04.match_plan_details:
    instruction: "Match each Dutch plan detail to its type or digital time."
    accepted_answers: [{value: [{left: vrijdag, right: weekday}, {left: "17 april", right: date}, {left: "half drie", right: "2:30"}, {left: "kwart over drie", right: "3:15"}], status: correct}]
    feedback: "These details identify the weekday, date, and two possible times."
  nl.a1.unit11.lesson03.exercise05.order_schedule:
    instruction: "Put the words in order to propose meeting Friday at 2:30."
    correct_option: "Zullen we vrijdag om half drie afspreken"
    accepted_answers: [{value: "Zullen we vrijdag om half drie afspreken", status: correct}]
