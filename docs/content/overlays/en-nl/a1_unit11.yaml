  nl.a1.unit11.lesson05.exercise02.listen_message:
    instruction: "Listen and choose the activity and schedule in Lotte's message."
    correct_option: "coffee on Friday at 2:30"
    distractors: ["coffee on Saturday at 2:30", "a film on Friday at 3:30", "coffee on Friday at 3:15"]
    accepted_answers: [{value: "coffee on Friday at 2:30", status: correct}]
    feedback: "Lotte proposes koffie drinken vrijdag om half drie."
  nl.a1.unit11.lesson05.exercise03.match_message_parts:
    instruction: "Match each part of the Dutch message to its purpose."
    accepted_answers: [{value: [{left: Hoi, right: greeting}, {left: "Zullen we koffie drinken?", right: activity}, {left: "vrijdag om half drie", right: schedule}, {left: Groet, right: closing}], status: correct}]
    feedback: "A short message can move from greeting to proposal and schedule, then close."
  nl.a1.unit11.lesson05.exercise04.order_confirmation:
    instruction: "Put the words in order to confirm the proposed schedule."
    correct_option: "Vrijdag om half drie is goed"
