    accepted_answers: [{value: "Sorry, om half drie kan ik niet. Kan het om kwart over drie?", status: correct}, {value: "Sorry, om half drie kan ik niet. Kan het om kwart over drie", status: correct}, {value: "Sorry, ik kan niet om half drie. Kan het om kwart over drie?", status: correct}, {value: "Sorry, ik kan niet om half drie. Kan het om kwart over drie", status: correct}]
    feedback: "Decline the first time, then propose the alternative with Kan het om ...?"
