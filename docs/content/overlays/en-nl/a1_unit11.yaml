  nl.a1.unit11.lesson04.exercise04.match_message_details:
    instruction: "Match each detail type to the information in Lotte's invitation."
    accepted_answers: [{value: [{left: activity, right: "koffie drinken"}, {left: date, right: "zaterdag 18 april"}, {left: time, right: "half drie"}, {left: place, right: "het taalcafé"}], status: correct}]
