    instruction: "Write a short Dutch reply that accepts and confirms Friday at 2:30."
    accepted_answers: [{value: "Ja, leuk! Vrijdag om half drie is goed.", status: correct}, {value: "Goed idee! Vrijdag om half drie is goed.", status: correct}, {value: "Dat is een goed plan. Vrijdag om half drie is goed.", status: correct}]
    feedback: "Accept first, then repeat the schedule to confirm it."

  nl.a1.unit11.lesson06.exercise01.listen_proposal:
    instruction: "Listen and choose what Lotte proposes."
    correct_option: "coffee on Friday"
    distractors: ["a film on Friday", "coffee on Saturday", "shopping on Friday"]
    accepted_answers: [{value: "coffee on Friday", status: correct}]
    feedback: "Lotte proposes vrijdag koffie drinken."
  nl.a1.unit11.lesson06.exercise02.comprehend_first_time:
    instruction: "In the dialogue, what time does Lotte propose first?"
    correct_option: "2:30"
    distractors: ["2:00", "3:15", "3:30"]
