    distractors: ["2:30", "2:45", "3:30"]
    accepted_answers: [{value: "3:15", status: correct}]
    feedback: "They confirm kwart over drie, meaning 3:15."
  nl.a1.unit11.lesson06.exercise04.comprehend_response:
