    instruction: "Write one Dutch sentence confirming Lotte and Omar's final plan."
    accepted_answers: [{value: "Lotte en Omar drinken vrijdag om kwart over drie koffie.", status: correct}, {value: "Lotte en Omar drinken vrijdag om kwart over drie koffie", status: correct}, {value: "Vrijdag om kwart over drie drinken Lotte en Omar koffie.", status: correct}, {value: "Vrijdag om kwart over drie drinken Lotte en Omar koffie", status: correct}]
