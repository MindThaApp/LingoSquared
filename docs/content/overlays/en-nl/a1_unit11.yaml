  nl.a1.unit11.lesson03.exercise06.listen_order_confirm:
    instruction: "Listen and put the confirmation in order."
    correct_option: "Ja vrijdag om half drie is goed"
    accepted_answers: [{value: "Ja vrijdag om half drie is goed", status: correct}]
    feedback: "Is goed confirms that Friday at 2:30 works."
  nl.a1.unit11.lesson03.exercise07.speak_schedule:
    instruction: "Propose meeting on Friday at 2:30 in Dutch. Say it aloud, then enter it."
    accepted_answers: [{value: "Zullen we vrijdag om half drie afspreken?", status: correct}, {value: "Zullen we vrijdag om half drie afspreken", status: correct}]
    feedback: "Zullen we vrijdag om half drie afspreken?"

  nl.a1.unit11.lesson04.exercise01.read_activity:
    instruction: "Read Lotte's invitation and choose the proposed activity."
    correct_option: "have coffee"
    distractors: ["go to a film", "have breakfast", "go to the market"]
    accepted_answers: [{value: "have coffee", status: correct}]
