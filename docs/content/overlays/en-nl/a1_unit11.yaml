    feedback: "The plan is koffie drinken on zaterdag 18 april om half drie."

  nl.a1.unit11.lesson05.exercise01.choose_complete_message:
    instruction: "Choose the message that clearly includes an activity, day, and time."
    correct_option: "Hoi Omar, zullen we vrijdag om half drie koffie drinken?"
