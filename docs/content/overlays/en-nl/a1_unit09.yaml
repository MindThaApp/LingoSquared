course:
  title: "Dutch A1"
  description: "Beginner Dutch for asking for and following short directions to a nearby place."

units:
  nl.a1.unit09.directions: {title: "Asking for and giving directions"}

lessons:
  nl.a1.unit09.lesson01.richtingswoorden: {title: "Left, right and straight ahead"}
  nl.a1.unit09.lesson02.bevelsvormen: {title: "Go, turn and walk"}
  nl.a1.unit09.lesson03.de_weg_vragen: {title: "Asking for directions"}
  nl.a1.unit09.lesson04.korte_route: {title: "A short route"}
  nl.a1.unit09.lesson05.route_op_de_kaart: {title: "A route on the map"}
  nl.a1.unit09.lesson06.vanaf_het_taalcafe: {title: "From the language café"}

teaching:
  nl.a1.unit09.lesson01.teach.links_rechts: {title: "Left and right", gloss: "left, right", note: "*Links* means left and *rechts* means right."}
  nl.a1.unit09.lesson01.teach.linksaf_rechtsaf_rechtdoor: {title: "Turn left, turn right, straight ahead", gloss: "to the left / turn left, to the right / turn right, straight ahead", note: "*Linksaf*, *rechtsaf*, and *rechtdoor* are each written as one word; in directions they commonly follow *sla*: *sla linksaf*, *sla rechtsaf*."}

  nl.a1.unit09.lesson02.teach.ga_sla_loop_tot: {title: "Go, turn, walk, as far as", gloss: "go, turn, walk, until / as far as", note: "*Ga* tells one person to go, *sla* to turn, and *loop* to walk; *tot* marks the place where a direction step ends."}
  nl.a1.unit09.lesson02.teach.ga_rechtdoor: {title: "Go straight ahead", gloss: "Go straight ahead.", note: "*Ga* is followed directly by *rechtdoor*."}
  nl.a1.unit09.lesson02.teach.sla_linksaf: {title: "Turn left", gloss: "Turn left.", note: "*Sla linksaf* is the usual short spoken direction."}
  nl.a1.unit09.lesson02.teach.sla_rechtsaf: {title: "Turn right", gloss: "Turn right.", note: "*Sla rechtsaf* is the usual short spoken direction."}
  nl.a1.unit09.lesson02.teach.loop_tot: {title: "Walk as far as", gloss: "Walk as far as ...", note: "Add a place after *tot*: *Loop tot de bank*."}
  nl.a1.unit09.lesson02.teach.imperative_note: {title: "Short command forms", gloss: "In an informal command, Dutch normally leaves out jij or je: ga, sla, loop.", note: "These commands fit how Lotte and Omar speak to each other. Do not add *jij* or *je*."}

  nl.a1.unit09.lesson03.teach.supermarkt_station_review: {title: "Supermarket and station", gloss: "the supermarket, the station", note: "Recall *de supermarkt* and *het station* from unit08. *Supermarkt* is written as one word."}
  nl.a1.unit09.lesson03.teach.hoe_kom_ik_bij: {title: "How do I get to ...?", gloss: "How do I get to ...?", note: "Use *Hoe kom ik bij ...?* to ask for a route to a place."}
  nl.a1.unit09.lesson03.teach.ask_supermarket: {title: "How do I get to the supermarket?", gloss: "How do I get to the supermarket?", note: "Use *bij* before the destination: *bij de supermarkt*."}
  nl.a1.unit09.lesson03.teach.vanaf_hier: {title: "From here", gloss: "from here", note: "*Vanaf hier* makes the starting point explicit."}
  nl.a1.unit09.lesson03.teach.ask_station_here: {title: "How do I get to the station from here?", gloss: "How do I get to the station from here?", note: "*Vanaf hier* comes before *bij het station* in this natural route question."}

  nl.a1.unit09.lesson04.teach.bank_bibliotheek_review: {title: "Bank and library", gloss: "the bank, the library", note: "Recall *de bank* and *de bibliotheek* from unit08."}
  nl.a1.unit09.lesson04.teach.straight_to_station: {title: "Go straight to the station", gloss: "Go straight ahead as far as the station.", note: "The station is the end of this direction step."}
  nl.a1.unit09.lesson04.teach.right_at_station: {title: "Turn right at the station", gloss: "Turn right at the station.", note: "*Bij* names the landmark where the turn happens."}
  nl.a1.unit09.lesson04.teach.walk_to_bank: {title: "Walk to the bank", gloss: "Walk as far as the bank.", note: "*Loop* gives the action; *tot de bank* gives its endpoint."}
  nl.a1.unit09.lesson04.teach.library_opposite: {title: "The library is opposite the bank", gloss: "The library is opposite the bank.", note: "This reuses *tegenover* to confirm the destination after a route step."}

  nl.a1.unit09.lesson05.teach.buurtkaart_route: {title: "Neighbourhood map and route", gloss: "the neighbourhood map, the route", note: "Recall *buurtkaart* from unit08 (written as one word); *de route* is the path from the start to the destination."}
  nl.a1.unit09.lesson05.teach.start_doel: {title: "Start and destination", gloss: "START, DESTINATION", note: "*START* marks where the route begins and *DOEL* marks where it ends."}
  nl.a1.unit09.lesson05.teach.marked_route: {title: "A marked route", gloss: "START: library. Go straight to the station, then turn right. DESTINATION: supermarket. The supermarket is next to the station; the bank is next to the supermarket.", note: "The marked route contains only two direction steps."}

  nl.a1.unit09.lesson06.teach.taalcafe_review: {title: "Language café", gloss: "the language café", note: "Recall *taalcafé* from earlier units. It is written as one word with an accent."}
  nl.a1.unit09.lesson06.teach.question: {title: "Omar asks for directions", gloss: "Omar: Lotte, how do I get to the supermarket?", note: "Omar uses the informal route question with Lotte."}
  nl.a1.unit09.lesson06.teach.directions: {title: "Lotte gives two steps", gloss: "Lotte: Go straight ahead as far as the station. Turn right.", note: "The answer stays within two short direction steps."}
  nl.a1.unit09.lesson06.teach.location: {title: "Lotte confirms the location", gloss: "Lotte: The supermarket is next to the station.", note: "The location phrase from unit08 confirms where the route ends."}
  nl.a1.unit09.lesson06.teach.closing: {title: "Thanking Lotte", gloss: "Omar: Great, thank you! Lotte: You're welcome!", note: "The exchange closes informally."}

exercises:
  nl.a1.unit09.lesson01.exercise01.choose_links:
    instruction: "Choose the Dutch word for 'left'."
    correct_option: links
    distractors: [rechts, rechtdoor, rechtsaf]
    accepted_answers: [{value: links, status: correct}]
    feedback: "Links means left."
  nl.a1.unit09.lesson01.exercise02.choose_rechtsaf:
    instruction: "Choose the Dutch direction for 'turn right'."
    correct_option: rechtsaf
    distractors: [linksaf, rechtdoor, rechts]
    accepted_answers: [{value: rechtsaf, status: correct}]
    feedback: "Rechtsaf means to the right or turn right."
  nl.a1.unit09.lesson01.exercise03.listen_linksaf:
    instruction: "Listen and choose the direction you hear."
    correct_option: "turn left"
    distractors: ["turn right", "straight ahead", "walk ahead"]
    accepted_answers: [{value: "turn left", status: correct}]
    feedback: "Linksaf means turn left."
  nl.a1.unit09.lesson01.exercise04.match_directions:
    instruction: "Match each Dutch direction to its English meaning."
    accepted_answers:
      - value: [{left: linksaf, right: "turn left"}, {left: rechtsaf, right: "turn right"}, {left: rechtdoor, right: "straight ahead"}]
        status: correct
    feedback: "Linksaf, rechtsaf and rechtdoor are the three core route directions."
  nl.a1.unit09.lesson01.exercise05.listen_type_rechtdoor:
    instruction: "Listen and type the one Dutch word you hear."
    accepted_answers: [{value: rechtdoor, status: correct}]
    feedback: "Rechtdoor is written as one word."

  nl.a1.unit09.lesson02.exercise01.choose_straight_command:
    instruction: "Choose the Dutch command for 'Go straight ahead.'"
    correct_option: "Ga rechtdoor."
    distractors: ["Sla linksaf.", "Sla rechtsaf.", "Loop tot de bank."]
    accepted_answers: [{value: "Ga rechtdoor.", status: correct}]
    feedback: "Ga rechtdoor means go straight ahead."
  nl.a1.unit09.lesson02.exercise02.listen_left_command:
    instruction: "Listen and choose the action you hear."
    correct_option: "turn left"
    distractors: ["turn right", "go straight ahead", "walk to the station"]
    accepted_answers: [{value: "turn left", status: correct}]
    feedback: "Sla linksaf means turn left."
  nl.a1.unit09.lesson02.exercise03.match_commands:
    instruction: "Match each Dutch command to its English meaning."
    accepted_answers:
      - value: [{left: "Ga rechtdoor", right: "go straight ahead"}, {left: "Sla linksaf", right: "turn left"}, {left: "Sla rechtsaf", right: "turn right"}]
        status: correct
    feedback: "Ga and sla are short command forms without a subject pronoun."
  nl.a1.unit09.lesson02.exercise04.listen_order_straight:
    instruction: "Listen and put the two words in the order you hear."
    correct_option: "Ga rechtdoor"
    accepted_answers: [{value: "Ga rechtdoor", status: correct}]
    feedback: "Ga rechtdoor."
  nl.a1.unit09.lesson02.exercise05.fill_right:
    instruction: "Complete the Dutch command for turning right."
    accepted_answers: [{value: Sla, status: correct}, {value: sla, status: correct}]
    feedback: "Sla rechtsaf means turn right."
  nl.a1.unit09.lesson02.exercise06.speak_left:
    instruction: "Say the short direction in Dutch."
    accepted_answers: [{value: "Sla linksaf", status: correct}, {value: "Sla linksaf.", status: correct}]
    feedback: "Sla linksaf."

  nl.a1.unit09.lesson03.exercise01.choose_route_question:
    instruction: "Choose the Dutch question for 'How do I get to the supermarket?'"
    correct_option: "Hoe kom ik bij de supermarkt?"
    distractors: ["Waar is het station?", "De supermarkt is naast de bank.", "Ga rechtdoor tot de supermarkt."]
    accepted_answers: [{value: "Hoe kom ik bij de supermarkt?", status: correct}]
    feedback: "Hoe kom ik bij ...? asks for a route."
  nl.a1.unit09.lesson03.exercise02.listen_supermarket_question:
    instruction: "Listen and choose the destination being asked about."
    correct_option: "the supermarket"
    distractors: ["the station", "the bank", "the library"]
    accepted_answers: [{value: "the supermarket", status: correct}]
    feedback: "Omar asks how to get to the supermarket."
  nl.a1.unit09.lesson03.exercise03.choose_from_here:
    instruction: "Choose the Dutch words for 'from here'."
    correct_option: "vanaf hier"
    distractors: ["tot hier", "bij het station", "rechtdoor"]
    accepted_answers: [{value: "vanaf hier", status: correct}]
    feedback: "Vanaf hier means from here."
  nl.a1.unit09.lesson03.exercise04.order_route_question:
    instruction: "Put the words in order to ask how to get to the supermarket."
    correct_option: "Hoe kom ik bij de supermarkt"
    accepted_answers: [{value: "Hoe kom ik bij de supermarkt", status: correct}]
    feedback: "Hoe kom ik bij de supermarkt?"
  nl.a1.unit09.lesson03.exercise05.listen_type_station_question:
    instruction: "Listen and type the complete Dutch question."
    accepted_answers:
      - {value: "Hoe kom ik vanaf hier bij het station", status: correct}
      - {value: "Hoe kom ik vanaf hier bij het station?", status: correct}
    feedback: "Hoe kom ik vanaf hier bij het station?"
  nl.a1.unit09.lesson03.exercise06.speak_ask_station:
    instruction: "Ask for the route in Dutch."
    accepted_answers:
      - {value: "Hoe kom ik bij het station", status: correct}
      - {value: "Hoe kom ik bij het station?", status: correct}
    feedback: "Hoe kom ik bij het station?"

  nl.a1.unit09.lesson04.exercise01.choose_first_step:
    instruction: "Choose the direction that says to continue as far as the station."
    correct_option: "Ga rechtdoor tot het station."
    distractors: ["Sla rechtsaf bij het station.", "Loop tot de bank.", "De bibliotheek is tegenover de bank."]
    accepted_answers: [{value: "Ga rechtdoor tot het station.", status: correct}]
    feedback: "Ga rechtdoor tot het station gives one complete route step."
  nl.a1.unit09.lesson04.exercise02.listen_route_station:
    instruction: "Listen to the two directions. What do you do at the station?"
    correct_option: "turn right"
    distractors: ["turn left", "stop at the bank", "go back"]
    accepted_answers: [{value: "turn right", status: correct}]
    feedback: "After going straight to the station, you turn right."
  nl.a1.unit09.lesson04.exercise03.order_walk_bank:
    instruction: "Put the words in order to say 'Walk as far as the bank.'"
    correct_option: "Loop tot de bank"
    accepted_answers: [{value: "Loop tot de bank", status: correct}]
    feedback: "Loop tot de bank."
  nl.a1.unit09.lesson04.exercise04.listen_order_library_route:
    instruction: "Listen and put the two short directions in order."
    correct_option: "Loop tot de bank Sla linksaf"
    accepted_answers: [{value: "Loop tot de bank Sla linksaf", status: correct}]
    feedback: "First walk to the bank; then turn left."
  nl.a1.unit09.lesson04.exercise05.speak_short_route:
    instruction: "Give the two short route steps in Dutch."
    accepted_answers:
      - {value: "Ga rechtdoor tot het station. Sla rechtsaf.", status: correct}
      - {value: "Ga rechtdoor tot het station Sla rechtsaf", status: correct}
    feedback: "Ga rechtdoor tot het station. Sla rechtsaf."
  nl.a1.unit09.lesson04.exercise06.write_short_route:
    instruction: "Write the two short route steps in Dutch."
    accepted_answers:
      - {value: "Loop tot de bank. Sla linksaf.", status: correct}
      - {value: "Loop tot de bank Sla linksaf", status: correct}
    feedback: "Loop tot de bank. Sla linksaf."

  nl.a1.unit09.lesson05.exercise01.read_destination:
    instruction: "Read the marked route. Which place is the destination?"
    correct_option: supermarket
    distractors: [library, station, bank]
    accepted_answers: [{value: supermarket, status: correct}]
    feedback: "DOEL is supermarkt."
  nl.a1.unit09.lesson05.exercise02.read_first_step:
    instruction: "Read the route. What is the first direction step?"
    correct_option: "go straight to the station"
    distractors: ["turn left at the bank", "turn right at the library", "walk to the supermarket"]
    accepted_answers: [{value: "go straight to the station", status: correct}]
    feedback: "The route first says: ga rechtdoor tot het station."
  nl.a1.unit09.lesson05.exercise03.read_turn:
    instruction: "Read the route. Which way do you turn after the station?"
    correct_option: right
    distractors: [left, straight, back]
    accepted_answers: [{value: right, status: correct}]
    feedback: "Sla rechtsaf means turn right."
  nl.a1.unit09.lesson05.exercise04.match_route:
    instruction: "Match each route marker or landmark to what follows it on the map."
    accepted_answers:
      - value: [{left: START, right: bibliotheek}, {left: DOEL, right: supermarkt}, {left: station, right: "then turn right"}]
        status: correct
    feedback: "The route begins at the library, reaches the station, turns right and ends at the supermarket."
  nl.a1.unit09.lesson05.exercise05.write_map_steps:
    instruction: "Use the marked route to write its two direction steps in Dutch."
    accepted_answers:
      - {value: "Ga rechtdoor tot het station. Sla rechtsaf.", status: correct}
      - {value: "Ga rechtdoor tot het station Sla rechtsaf", status: correct}
    feedback: "Ga rechtdoor tot het station. Sla rechtsaf."

  nl.a1.unit09.lesson06.exercise01.listen_question:
    instruction: "Listen and choose which place Omar asks how to reach."
    correct_option: "the supermarket"
    distractors: ["the station", "the bank", "the library"]
    accepted_answers: [{value: "the supermarket", status: correct}]
    feedback: "Omar asks: Hoe kom ik bij de supermarkt?"
  nl.a1.unit09.lesson06.exercise02.comprehend_first_step:
    instruction: "In the dialogue, what is Lotte's first direction step?"
    correct_option: "go straight to the station"
    distractors: ["turn left at the bank", "walk to the library", "turn right immediately"]
    accepted_answers: [{value: "go straight to the station", status: correct}]
    feedback: "Lotte first says: Ga rechtdoor tot het station."
  nl.a1.unit09.lesson06.exercise03.comprehend_turn:
    instruction: "In the dialogue, which way does Lotte tell Omar to turn after the station?"
    correct_option: right
    distractors: [left, straight, back]
    accepted_answers: [{value: right, status: correct}]
    feedback: "Lotte's second step is: Sla rechtsaf."
  nl.a1.unit09.lesson06.exercise04.order_answer:
    instruction: "Put the words in order to give Lotte's first direction step."
    correct_option: "Ga rechtdoor tot het station"
    accepted_answers: [{value: "Ga rechtdoor tot het station", status: correct}]
    feedback: "Ga rechtdoor tot het station."
  nl.a1.unit09.lesson06.exercise05.speak_reply:
    instruction: "Reply to Omar with the two short Dutch directions."
    accepted_answers:
      - {value: "Ga rechtdoor tot het station. Sla rechtsaf.", status: correct}
      - {value: "Ga rechtdoor tot het station Sla rechtsaf", status: correct}
    feedback: "Ga rechtdoor tot het station. Sla rechtsaf."
  nl.a1.unit09.lesson06.exercise06.listen_type_answer:
    instruction: "Listen and type Lotte's two short direction steps."
    accepted_answers:
      - {value: "Ga rechtdoor tot het station. Sla rechtsaf.", status: correct}
      - {value: "Ga rechtdoor tot het station Sla rechtsaf", status: correct}
    feedback: "Ga rechtdoor tot het station. Sla rechtsaf."
  nl.a1.unit09.lesson06.exercise07.write_reply:
    instruction: "Write Lotte's two-step Dutch reply that gives Omar the complete route."
    accepted_answers:
      - {value: "Ga rechtdoor tot het station. Sla rechtsaf.", status: correct}
      - {value: "Ga rechtdoor tot het station Sla rechtsaf", status: correct}
    feedback: "A complete reply is: Ga rechtdoor tot het station. Sla rechtsaf."
