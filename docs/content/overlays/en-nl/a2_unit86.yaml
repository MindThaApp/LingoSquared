course:
  title: "Dutch A2"
  description: "Grammar-led A2 Dutch for predicting and promising."
  learning_goal: "Predict what will happen and make a promise with zullen, contrast it with gaan, and express doubt with misschien."
units:
  nl.a2.unit86.voorspellingen_en_beloftes: {title: "Predictions and promises", description: "Give a forecast, make a promise and say what might happen."}
lessons:
  nl.a2.unit86.lesson01.het_weer_van_morgen: {"title": "Tomorrow's weather"}
  nl.a2.unit86.lesson02.ik_zal_het_doen: {"title": "I will do it"}
  nl.a2.unit86.lesson03.zullen_of_gaan: {"title": "Zullen or gaan?"}
  nl.a2.unit86.lesson04.misschien: {"title": "Maybe"}
  nl.a2.unit86.lesson05.bericht_en_mededeling: {"title": "A message and a notice"}
  nl.a2.unit86.lesson06.lotte_en_omar_beloven: {"title": "Lotte and Omar make promises"}
teaching:
  nl.a2.unit86.lesson01.teach.weer: {"title": "The weather", "gloss": "the weather / the sun / tomorrow / today / cold / warm", "note": "These words describe the weather and the day.", "example_gloss": ["The weather is warm today.", "The sun is shining.", "Tomorrow it is cold."]}
  nl.a2.unit86.lesson01.teach.werkwoorden: {"title": "Weather verbs", "gloss": "to rain / to shine / to be", "note": "*Regent* and *schijnt* are present-tense forms for today. This unit adds the future.", "example_gloss": ["It is raining today.", "The sun is shining today.", "It is warm."]}
  nl.a2.unit86.lesson01.teach.verwachting: {"title": "The forecast", "gloss": "the weather forecast / according to", "note": "*Volgens* introduces the source of a prediction.", "example_gloss": ["The forecast is good.", "According to the forecast, it is warm tomorrow."]}
  nl.a2.unit86.lesson01.teach.gn_zullen_vormen: {"title": "Zullen: the forms", "gloss": "I will / you will / he, she, it will / we, they will", "note": "*Zullen* is the verb of prediction and promise. The singular is *zal* (with *jij/je* also *zult*), the plural is *zullen*. In reduced speech: *we, ze, je*."}
  nl.a2.unit86.lesson01.teach.gn_zullen_zin: {"title": "Zullen + infinitive", "gloss": "It will rain tomorrow. Tomorrow it will rain.", "note": "*Zal* is the finite verb and stays in second position; the infinitive stays at the end of the clause. If a time word comes first, the subject follows *zal*: *Morgen zal het regenen*. Use *zullen* for a forecast."}
  nl.a2.unit86.lesson01.teach.zinnen: {"title": "Forecast sentences", "gloss": "According to the forecast, the sun will shine tomorrow. It will be cold."}
  nl.a2.unit86.lesson02.teach.beloftes: {"title": "Promise words", "gloss": "to promise / the promise / to do / to help / to call", "note": "These verbs are common in promises.", "example_gloss": ["I promise.", "That is a promise.", "I can help you.", "Would you call me?"]}
  nl.a2.unit86.lesson02.teach.afspraken: {"title": "Commitments", "gloss": "on time / certainly / to forget / to come / not", "note": "*Op tijd* means on time, not late.", "example_gloss": ["He comes on time.", "I have not forgotten it.", "I will certainly do that."]}
  nl.a2.unit86.lesson02.teach.gn_belofte: {"title": "Zullen for a promise", "gloss": "I will do it. I will help you. I will call you.", "note": "With *ik*, *zal* can make a promise or a firm commitment. The infinitive (*doen, helpen, bellen*) stands at the end."}
  nl.a2.unit86.lesson02.teach.gn_niet: {"title": "Niet and op tijd", "gloss": "I will not forget it. I will come on time.", "note": "*Niet* usually comes after *het* and before the final infinitive: *het niet vergeten*. A phrase like *op tijd* also comes before the final infinitive."}
  nl.a2.unit86.lesson02.teach.zinnen: {"title": "Promise sentences", "gloss": "We will come on time. I will certainly do it."}
  nl.a2.unit86.lesson03.teach.signalen: {"title": "Signs and plans", "gloss": "look / the cloud / dark / this evening / to work / to cook", "note": "*Kijk* draws attention to something you can see.", "example_gloss": ["Look, the clouds are dark.", "Omar works today.", "I want to cook this evening."]}
  nl.a2.unit86.lesson03.teach.gn_gaan_plan: {"title": "Gaan for a plan", "gloss": "I am going to work tomorrow. Omar is going to cook this evening.", "note": "*Gaan* + infinitive says what someone has planned to do. The infinitive is at the end."}
  nl.a2.unit86.lesson03.teach.gn_gaan_zicht: {"title": "Gaan for what you can see", "gloss": "Look, the clouds are dark. It is going to rain.", "note": "Use *gaan* when you can see the sign right now: dark clouds, so *Het gaat regenen*."}
  nl.a2.unit86.lesson03.teach.gn_contrast: {"title": "Zullen versus gaan", "gloss": "It will rain tomorrow (forecast). Look, it is going to rain (I see it). I am going to work tomorrow (plan). I will do it (promise).", "note": "In this unit: *zullen* for a forecast or a promise, *gaan* for a plan or for something you can see coming. In everyday speech *gaan* is also common for predictions and even promises (*Ik ga het doen*); *zullen* is more typical of forecasts, notices and formal promises."}
  nl.a2.unit86.lesson03.teach.zinnen: {"title": "Gaan sentences", "gloss": "Look, it is going to rain. I am going to work tomorrow."}
  nl.a2.unit86.lesson04.teach.misschien_woorden: {"title": "Maybe and late", "gloss": "maybe / later / late / too late", "note": "*Misschien* shows that you are not sure.", "example_gloss": ["Maybe I will come later.", "It is late.", "The bus is too late."]}
  nl.a2.unit86.lesson04.teach.week: {"title": "Work and appointments", "gloss": "the appointment / the work / the colleague / Monday / Friday / Saturday", "note": "Days of the week are written with a small letter in Dutch.", "example_gloss": ["Lotte has an appointment on Friday.", "Omar has work on Monday.", "Noor works on Saturday."]}
  nl.a2.unit86.lesson04.teach.gn_misschien_voorop: {"title": "Misschien first", "gloss": "Maybe Noor will come tomorrow. Maybe it will rain.", "note": "When *misschien* opens the sentence, the verb comes straight after it and the subject follows: *komt Noor*, *regent het*. Do not put the subject before the verb."}
  nl.a2.unit86.lesson04.teach.gn_misschien_midden: {"title": "Misschien after the verb", "gloss": "Noor may come tomorrow. It may rain.", "note": "*Misschien* can also stand after the verb. The verb stays in second position and the meaning is the same."}
  nl.a2.unit86.lesson04.teach.gn_zeker: {"title": "Zeker or misschien", "gloss": "It will certainly rain. Maybe it will rain.", "note": "*Zeker* shows that you are sure, *misschien* that you are not. Both combine with *zal*."}
  nl.a2.unit86.lesson04.teach.zinnen: {"title": "Maybe sentences", "gloss": "Maybe I will be late. Maybe Omar has time. Maybe it is cold."}
  nl.a2.unit86.lesson05.teach.bericht_woorden: {"title": "Message words", "gloss": "to stay / to buy / coffee / biscuits / also / then / until / at home", "note": "*Tot zaterdag* means see you on Saturday.", "example_gloss": ["I am staying at home.", "I want to buy coffee.", "See you tomorrow!"]}
  nl.a2.unit86.lesson05.teach.mededeling_woorden: {"title": "Notice words", "gloss": "the notice / the meeting / at nine o'clock / everyone / there", "note": "*Om negen uur* gives the time. *Er zal koffie zijn* means there will be coffee.", "example_gloss": ["This is a notice.", "The meeting is today.", "Everyone is there."]}
  nl.a2.unit86.lesson05.teach.gn_weerbericht: {"title": "Forecast style", "gloss": "In the morning the sun will shine. In the afternoon it will rain.", "note": "Forecasts and notices use *zullen* often. A time phrase opens the sentence, so *zal* comes next and the subject after it."}
  nl.a2.unit86.lesson05.teach.lezen_bericht: {"title": "Noor's message", "gloss": "Hi Lotte and Omar, according to the forecast it will rain on Saturday. Maybe we will stay at home then. I will buy coffee and biscuits. I will also come on time. See you Saturday! Noor", "note": "Find the prediction, the uncertain plan and the promises.", "glosses": {"volgens": "according to", "weersverwachting": "forecast", "blijven": "stay", "koffie": "coffee", "koekjes": "biscuits", "kopen": "buy", "tot": "until / see you"}}
  nl.a2.unit86.lesson05.teach.lezen_mededeling: {"title": "A notice", "gloss": "Notice. Tomorrow the meeting will begin at nine o'clock. Everyone will come on time. There will be coffee.", "note": "A notice states what will happen.", "glosses": {"vergadering": "meeting", "negen": "nine", "uur": "o'clock / hour", "iedereen": "everyone", "koffie": "coffee"}}
  nl.a2.unit86.lesson06.teach.lotte1: {"title": "Lotte asks about Saturday", "gloss": "Lotte: Hi Omar, are you going to work on Saturday?"}
  nl.a2.unit86.lesson06.teach.omar1: {"title": "Omar is not sure", "gloss": "Omar: Maybe I will work on Saturday. I will call you."}
  nl.a2.unit86.lesson06.teach.lotte2: {"title": "Lotte gives the forecast", "gloss": "Lotte: According to the forecast it will rain on Saturday."}
  nl.a2.unit86.lesson06.teach.omar2: {"title": "Omar makes a plan", "gloss": "Omar: Then maybe I will stay at home. I am going to cook."}
  nl.a2.unit86.lesson06.teach.lotte3: {"title": "Lotte offers to buy biscuits", "gloss": "Lotte: Great! I will buy biscuits."}
  nl.a2.unit86.lesson06.teach.omar3: {"title": "Omar asks for a promise", "gloss": "Omar: Do you promise?"}
  nl.a2.unit86.lesson06.teach.lotte4: {"title": "Lotte promises", "gloss": "Lotte: I promise."}
exercises:
  nl.a2.unit86.lesson01.exercise01.kies_regenen: {"instruction": "Choose the Dutch sentence.", "correct_option": "Het zal morgen regenen.", "distractors": ["Het regent vandaag.", "Het zal morgen koud zijn.", "De zon schijnt vandaag."], "accepted_answers": [{"value": "Het zal morgen regenen.", "status": "correct"}], "feedback": "*Het zal morgen regenen* = It will rain tomorrow."}
  nl.a2.unit86.lesson01.exercise02.kies_zon: {"instruction": "Choose the Dutch sentence.", "correct_option": "De zon zal schijnen.", "distractors": ["De zon schijnt vandaag.", "Het zal koud zijn.", "Het zal morgen regenen."], "accepted_answers": [{"value": "De zon zal schijnen.", "status": "correct"}], "feedback": "*De zon zal schijnen* = The sun will shine."}
  nl.a2.unit86.lesson01.exercise03.woordenschat: {"instruction": "Match each Dutch word to its English meaning.", "accepted_answers": [{"value": [{"left": "weer", "right": "weather"}, {"left": "zon", "right": "sun"}, {"left": "morgen", "right": "tomorrow"}, {"left": "vandaag", "right": "today"}, {"left": "koud", "right": "cold"}, {"left": "warm", "right": "warm"}, {"left": "regenen", "right": "to rain"}, {"left": "schijnen", "right": "to shine"}], "status": "correct"}], "feedback": "These are the key words for a weather forecast."}
  nl.a2.unit86.lesson01.exercise04.volgorde_koud: {"instruction": "Put the words in order to say 'It will be cold tomorrow.'", "correct_option": "Het zal morgen koud zijn", "accepted_answers": [{"value": "Het zal morgen koud zijn", "status": "correct"}, {"value": "Morgen zal het koud zijn", "status": "correct"}], "feedback": "*Zal* is second; *zijn* is at the end. With *Morgen* first, the subject follows *zal*."}
  nl.a2.unit86.lesson01.exercise05.vul_zal: {"instruction": "Complete with the singular form of zullen.", "correct_option": "zal", "accepted_answers": [{"value": "zal", "status": "correct"}], "feedback": "*Het zal morgen regenen.*"}
  nl.a2.unit86.lesson01.exercise06.vertaal_warm: {"instruction": "Translate into Dutch using zullen.", "accepted_answers": [{"value": "Het zal morgen warm zijn.", "status": "correct"}, {"value": "Het zal morgen warm zijn", "status": "correct"}, {"value": "Morgen zal het warm zijn.", "status": "correct"}, {"value": "Morgen zal het warm zijn", "status": "correct"}], "feedback": "*Het zal morgen warm zijn* or *Morgen zal het warm zijn*."}
  nl.a2.unit86.lesson01.exercise07.schrijf_zon: {"instruction": "Write the requested Dutch sentence using zullen.", "correct_option": "De zon zal morgen schijnen.", "accepted_answers": [{"value": "De zon zal morgen schijnen.", "status": "correct"}, {"value": "De zon zal morgen schijnen", "status": "correct"}, {"value": "Morgen zal de zon schijnen.", "status": "correct"}, {"value": "Morgen zal de zon schijnen", "status": "correct"}], "feedback": "*De zon zal morgen schijnen.*"}
  nl.a2.unit86.lesson02.exercise01.kies_helpen: {"instruction": "Choose the Dutch sentence.", "correct_option": "Ik zal je helpen.", "distractors": ["Ik zal je bellen.", "Ik zal het doen.", "Ik zal het niet vergeten."], "accepted_answers": [{"value": "Ik zal je helpen.", "status": "correct"}], "feedback": "*Ik zal je helpen* = I will help you."}
  nl.a2.unit86.lesson02.exercise02.kies_vergeten: {"instruction": "Choose the Dutch sentence.", "correct_option": "Ik zal het niet vergeten.", "distractors": ["Ik zal het vergeten.", "Ik zal het doen.", "Ik zal op tijd komen."], "accepted_answers": [{"value": "Ik zal het niet vergeten.", "status": "correct"}], "feedback": "*Niet* stands before the final infinitive."}
  nl.a2.unit86.lesson02.exercise03.beloftes: {"instruction": "Match each Dutch promise to its English meaning.", "accepted_answers": [{"value": [{"left": "Ik zal je helpen", "right": "I will help you"}, {"left": "Ik zal je bellen", "right": "I will call you"}, {"left": "Ik zal het doen", "right": "I will do it"}, {"left": "Ik zal het niet vergeten", "right": "I will not forget it"}, {"left": "Ik zal op tijd komen", "right": "I will come on time"}, {"left": "Ik beloof het", "right": "I promise"}], "status": "correct"}], "feedback": "Each sentence is a different promise."}
  nl.a2.unit86.lesson02.exercise04.volgorde_tijd: {"instruction": "Put the words in order to say 'I will come on time.'", "correct_option": "Ik zal op tijd komen", "accepted_answers": [{"value": "Ik zal op tijd komen", "status": "correct"}, {"value": "Op tijd zal ik komen", "status": "correct"}], "feedback": "*Komen* is at the end."}
  nl.a2.unit86.lesson02.exercise05.vul_zullen: {"instruction": "Complete with the correct form of the verb for will (the subject is wij).", "correct_option": "zullen", "accepted_answers": [{"value": "zullen", "status": "correct"}], "feedback": "With *wij* the form is *zullen*."}
  nl.a2.unit86.lesson02.exercise06.vertaal_helpen: {"instruction": "Translate into Dutch using zullen.", "accepted_answers": [{"value": "Wij zullen je helpen.", "status": "correct"}, {"value": "Wij zullen je helpen", "status": "correct"}, {"value": "We zullen je helpen.", "status": "correct"}, {"value": "We zullen je helpen", "status": "correct"}], "feedback": "*Wij zullen je helpen.*"}
  nl.a2.unit86.lesson02.exercise07.schrijf_twee: {"instruction": "Write exactly two Dutch sentences using zullen, following the two numbered requirements.", "correct_option": "Ik zal je helpen. Ik zal je morgen bellen.", "accepted_answers": [{"value": "Ik zal je helpen. Ik zal je morgen bellen.", "status": "correct"}, {"value": "Ik zal je helpen. Ik zal je morgen bellen", "status": "correct"}, {"value": "Ik zal je helpen. Morgen zal ik je bellen.", "status": "correct"}, {"value": "Ik zal je helpen. Morgen zal ik je bellen", "status": "correct"}], "feedback": "*Ik zal je helpen. Ik zal je morgen bellen.*"}
  nl.a2.unit86.lesson03.exercise01.kies_verwachting: {"instruction": "Choose the sentence that is a weather forecast for tomorrow (not a plan, a promise or something you see now).", "correct_option": "Het zal morgen regenen.", "distractors": ["Kijk, het gaat regenen.", "Ik ga morgen werken.", "Het regent vandaag."], "accepted_answers": [{"value": "Het zal morgen regenen.", "status": "correct"}], "feedback": "A forecast uses *zullen*: *Het zal morgen regenen*."}
  nl.a2.unit86.lesson03.exercise02.kies_plan: {"instruction": "Choose the sentence that says what someone is planning to do (not a promise and not a forecast).", "correct_option": "Omar gaat vanavond koken.", "distractors": ["Het zal vanavond koud zijn.", "Ik zal het niet vergeten.", "Kijk, het gaat regenen."], "accepted_answers": [{"value": "Omar gaat vanavond koken.", "status": "correct"}], "feedback": "A plan uses *gaan* + infinitive."}
  nl.a2.unit86.lesson03.exercise03.vul_gaat: {"instruction": "Complete with the correct form of gaan: you can see the clouds.", "correct_option": "gaat", "accepted_answers": [{"value": "gaat", "status": "correct"}], "feedback": "You can see the sign, so *Het gaat regenen*."}
  nl.a2.unit86.lesson03.exercise04.functies: {"instruction": "Match each Dutch sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Het zal morgen warm zijn", "right": "It will be warm tomorrow"}, {"left": "Kijk, het gaat regenen", "right": "Look, it is going to rain"}, {"left": "Ik ga morgen werken", "right": "I am going to work tomorrow"}, {"left": "Ik zal je helpen", "right": "I will help you"}, {"left": "Omar gaat vanavond koken", "right": "Omar is going to cook this evening"}, {"left": "Ik zal het niet vergeten", "right": "I will not forget it"}], "status": "correct"}], "feedback": "Compare the verbs: *zal* for forecast and promise, *gaat/ga* for plan and visible signs."}
  nl.a2.unit86.lesson03.exercise05.volgorde_kijk: {"instruction": "Put the words in order to say 'Look, it is going to rain.'", "correct_option": "Kijk het gaat regenen", "accepted_answers": [{"value": "Kijk het gaat regenen", "status": "correct"}], "feedback": "*Kijk, het gaat regenen.*"}
  nl.a2.unit86.lesson03.exercise06.vertaal_werken: {"instruction": "Translate into Dutch using gaan.", "accepted_answers": [{"value": "Ik ga morgen werken.", "status": "correct"}, {"value": "Ik ga morgen werken", "status": "correct"}, {"value": "Morgen ga ik werken.", "status": "correct"}, {"value": "Morgen ga ik werken", "status": "correct"}], "feedback": "*Ik ga morgen werken.*"}
  nl.a2.unit86.lesson03.exercise07.schrijf_volgens: {"instruction": "Write the requested Dutch sentence using zullen.", "correct_option": "Volgens de weersverwachting zal het morgen koud zijn.", "accepted_answers": [{"value": "Volgens de weersverwachting zal het morgen koud zijn.", "status": "correct"}, {"value": "Volgens de weersverwachting zal het morgen koud zijn", "status": "correct"}, {"value": "Het zal morgen koud zijn volgens de weersverwachting.", "status": "correct"}, {"value": "Het zal morgen koud zijn volgens de weersverwachting", "status": "correct"}, {"value": "Morgen zal het koud zijn volgens de weersverwachting.", "status": "correct"}, {"value": "Morgen zal het koud zijn volgens de weersverwachting", "status": "correct"}, {"value": "Morgen zal het volgens de weersverwachting koud zijn.", "status": "correct"}, {"value": "Morgen zal het volgens de weersverwachting koud zijn", "status": "correct"}, {"value": "Het zal volgens de weersverwachting morgen koud zijn.", "status": "correct"}, {"value": "Het zal volgens de weersverwachting morgen koud zijn", "status": "correct"}, {"value": "Het zal morgen volgens de weersverwachting koud zijn.", "status": "correct"}, {"value": "Het zal morgen volgens de weersverwachting koud zijn", "status": "correct"}], "feedback": "After *Volgens de weersverwachting*, the verb *zal* comes next, then the subject."}
  nl.a2.unit86.lesson04.exercise01.kies_noor: {"instruction": "Choose the Dutch sentence.", "correct_option": "Misschien komt Noor morgen.", "distractors": ["Misschien Noor komt morgen.", "Misschien komt Noor vandaag.", "Noor komt zeker morgen."], "accepted_answers": [{"value": "Misschien komt Noor morgen.", "status": "correct"}], "feedback": "*Misschien komt Noor morgen.*"}
  nl.a2.unit86.lesson04.exercise02.kies_volgorde: {"instruction": "Choose the sentence with the correct word order.", "correct_option": "Misschien regent het morgen.", "distractors": ["Misschien het regent morgen.", "Misschien morgen het regent.", "Misschien het morgen regent."], "accepted_answers": [{"value": "Misschien regent het morgen.", "status": "correct"}], "feedback": "After *misschien* the verb comes before the subject."}
  nl.a2.unit86.lesson04.exercise03.misschien_zinnen: {"instruction": "Match each Dutch sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Misschien komt Noor", "right": "Maybe Noor will come"}, {"left": "Misschien regent het", "right": "Maybe it will rain"}, {"left": "Misschien ben ik laat", "right": "Maybe I will be late"}, {"left": "Misschien heeft Omar tijd", "right": "Maybe Omar has time"}, {"left": "Misschien werkt Lotte morgen", "right": "Maybe Lotte works tomorrow"}, {"left": "Misschien is het koud", "right": "Maybe it is cold"}], "status": "correct"}], "feedback": "In every sentence the verb follows *misschien*."}
  nl.a2.unit86.lesson04.exercise04.volgorde_later: {"instruction": "Put the words in order to say 'Maybe I will come later.'", "correct_option": "Misschien kom ik later", "accepted_answers": [{"value": "Misschien kom ik later", "status": "correct"}, {"value": "Ik kom misschien later", "status": "correct"}, {"value": "Later kom ik misschien", "status": "correct"}], "feedback": "Either *Misschien kom ik later* or *Ik kom misschien later*."}
  nl.a2.unit86.lesson04.exercise05.vul_komt: {"instruction": "Complete with the correct present-tense form of komen.", "correct_option": "komt", "accepted_answers": [{"value": "komt", "status": "correct"}], "feedback": "With *Noor* the verb is *komt*."}
