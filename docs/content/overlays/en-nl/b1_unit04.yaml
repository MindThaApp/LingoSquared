review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    Overlay for nl's fourth B1 unit, authored alongside the realization.
    English speakers' real interference risk: English "that"/"which"/
    "who" don't track grammatical gender at all, so the *die* (common/
    de-words) vs. *dat* (neuter/het-words) choice is a genuinely new
    category to track, not a remapping of an existing English contrast
    -- the correct relative pronoun depends on the ANTECEDENT's gender
    (de collega -> die; het huis -> dat), not on person vs. thing the
    way English who/which loosely does. Flagged in lesson02's note. A
    second risk: *waar*+preposition compounds (*waarover*, etc.) fuse a
    preposition onto *waar* in a single word with no English equivalent
    word order, and never refer to people (people always take *met wie*
    -- "with whom" -- taught at the wrap-up) -- flagged in lesson03/06.
    Fresh-context review 2026-07-11: replaced recognize_dat's "that
    (conjunction)" distractor (a genuinely correct meaning of bare
    dat, making the item unanswerable); softened the met_wie note's
    overstated "never waarmee" claim per AUTHORING_GUIDE §3 (waarmee
    for people is common in casual speech, met wie is the careful
    form); added the equally-correct waar ... over split forms and
    comma-free variants to waarover/relative-clause answers.

course:
  title: Dutch B1
  description: >-
    Intermediate Dutch: combining two facts about a person, place, or
    thing into one richer sentence using a relative clause -- *die*/
    *dat* by grammatical gender, and *waar*+preposition compounds for
    things and places.

units:
  nl.b1.unit04.ingewikkelde_zinnen:
    title: "Complex Sentences"
    description: Combine two facts about a person, place, or thing into a single, richer sentence using a relative clause.

lessons:
  nl.b1.unit04.lesson01.die:
    title: "The colleague who..."
  nl.b1.unit04.lesson02.dat:
    title: "The house that..."
  nl.b1.unit04.lesson03.waar:
    title: "The city where..."
  nl.b1.unit04.lesson04.klein_wereldje:
    title: "What a small world"
  nl.b1.unit04.lesson05.sara_lezen:
    title: "Reading about Sara"
  nl.b1.unit04.lesson06.wrapup_production:
    title: "Review"

teaching:
  nl.b1.unit04.lesson01.teach.ik:
    title: I
    gloss: I
    example_gloss: "I have a colleague."
  nl.b1.unit04.lesson01.teach.de_collega:
    title: "the colleague"
    gloss: "the colleague"
    example_gloss: "The colleague is nice."
  nl.b1.unit04.lesson01.teach.die:
    title: "who / that (common gender)"
    gloss: "who / that (common gender)"
    note: "*Die* is used when the noun it refers back to is a *de*-word (common gender: *de collega*) -- the choice depends on the noun's grammatical gender, not on whether it's a person or a thing, which is the real trap for English speakers (English who/which loosely tracks person-vs-thing; Dutch die/dat tracks de-word-vs-het-word)."
    example_gloss: "The colleague who sits next to me is nice."
  nl.b1.unit04.lesson01.teach.naast:
    title: "next to"
    gloss: "next to"
    example_gloss: "The colleague who sits next to me is nice."
  nl.b1.unit04.lesson01.teach.zit:
    title: sits
    gloss: sits
    example_gloss: "The colleague who sits next to me is nice."
  nl.b1.unit04.lesson01.teach.me:
    title: me
    gloss: me
    example_gloss: "The colleague who sits next to me is nice."
  nl.b1.unit04.lesson01.teach.is:
    title: is
    gloss: is
    example_gloss: "The colleague is nice."
  nl.b1.unit04.lesson01.teach.aardig:
    title: "nice / kind"
    gloss: "nice / kind"
    example_gloss: "The colleague who sits next to me is nice."
  nl.b1.unit04.lesson01.teach.grammar_die:
    title: "The colleague who sits next to me is nice."
    gloss: "The colleague who sits next to me is nice."
    note: "The relative clause (*die naast me zit*) pushes its verb (*zit*) to the very end, then the main clause resumes after the comma. *De collega* is a *de*-word, so it takes *die* -- the next lesson contrasts this with *het*-words, which take *dat* instead."

  nl.b1.unit04.lesson02.teach.het_huis:
    title: "the house"
    gloss: "the house"
    example_gloss: "The house is big."
  nl.b1.unit04.lesson02.teach.koop:
    title: buy
    gloss: buy
    example_gloss: "I am buying a house."
  nl.b1.unit04.lesson02.teach.dat:
    title: "that / which (neuter)"
    gloss: "that / which (neuter)"
    note: "*Dat* is used when the noun it refers back to is a *het*-word (neuter: *het huis*) -- the direct counterpart to *die* for *de*-words in the previous lesson. Same spelling as the conjunction *dat* ('that') from other units, but a different grammatical job here: a relative pronoun, not a subordinator."
    example_gloss: "The house that I'm buying is big."
  nl.b1.unit04.lesson02.teach.groot:
    title: big
    gloss: big
    example_gloss: "The house is big."
  nl.b1.unit04.lesson02.teach.mooi:
    title: beautiful
    gloss: beautiful
    example_gloss: "It is also beautiful."
  nl.b1.unit04.lesson02.teach.ook:
    title: "also / too"
    gloss: "also / too"
    example_gloss: "It is also beautiful."
  nl.b1.unit04.lesson02.teach.grammar_dat:
    title: "The house that I'm buying is big. It is also beautiful."
    gloss: "The house that I'm buying is big. It is also beautiful."
    note: "*Die* vs. *dat* is a genuine grammatical-gender distinction with no English equivalent: check the ANTECEDENT noun's gender (*de*-word -> *die*, *het*-word -> *dat*), not whether it's a person or a thing."

  nl.b1.unit04.lesson03.teach.de_stad:
    title: "the city"
    gloss: "the city"
    example_gloss: "The city is small."
  nl.b1.unit04.lesson03.teach.woon:
    title: live
    gloss: live
    example_gloss: "I live in Utrecht."
  nl.b1.unit04.lesson03.teach.waar:
    title: where
    gloss: where
    note: "*Waar* alone (without a preposition) introduces a relative clause about a PLACE -- 'the city WHERE I live.' The next card shows *waar* fused with a preposition (*waarover*) for a THING being talked about, discussed, etc."
    example_gloss: "The city where I live is small."
  nl.b1.unit04.lesson03.teach.klein:
    title: small
    gloss: small
    example_gloss: "The city is small."
  nl.b1.unit04.lesson03.teach.het_boek:
    title: "the book"
    gloss: "the book"
    example_gloss: "The book is interesting."
  nl.b1.unit04.lesson03.teach.praat:
    title: talk
    gloss: talk
    example_gloss: "I am talking about the book."
  nl.b1.unit04.lesson03.teach.waarover:
    title: "about which"
    gloss: "about which"
    note: "*Waar* + *over* fuses into one word, *waarover* -- Dutch never says *over dat* for a thing (that would be reserved for a person: *over wie*, 'about whom'). The preposition attaches to the front of *waar*, the opposite order from English 'the book I'm talking ABOUT.'"
    example_gloss: "The book I'm talking about is interesting."
  nl.b1.unit04.lesson03.teach.interessant:
    title: interesting
    gloss: interesting
    example_gloss: "The book is interesting."
  nl.b1.unit04.lesson03.teach.grammar_waar:
    title: "The city where I live is small. The book I'm talking about is interesting."
    gloss: "The city where I live is small. The book I'm talking about is interesting."
    note: "*Waar* (place) and *waar*+preposition compounds (*waarover*, *waarmee*, *waarnaar*, etc.) are used ONLY for things and places, never people -- a genuine B1 nuance the wrap-up lesson contrasts with *met wie* ('with whom') for people."

  nl.b1.unit04.lesson04.teach.ken_je:
    title: "Do you know...?"
    gloss: "Do you know...?"
    example_gloss: "Do you know the colleague who sits next to me?"
  nl.b1.unit04.lesson04.teach.de_vrouw:
    title: "the woman"
    gloss: "the woman"
    example_gloss: "Do you mean the woman who always drinks coffee?"
  nl.b1.unit04.lesson04.teach.bedoel_je:
    title: "Do you mean...?"
    gloss: "Do you mean...?"
    example_gloss: "Do you mean the woman?"
  nl.b1.unit04.lesson04.teach.geboren:
    title: born
    gloss: born
    example_gloss: "I was born in Utrecht."
  nl.b1.unit04.lesson04.teach.klein_wereldje:
    title: "a small world"
    gloss: "a small world"
    example_gloss: "It's a small world."
  nl.b1.unit04.lesson04.teach.dialogue_lotte_ken_je:
