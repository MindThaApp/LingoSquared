    feedback: "Die is the relative pronoun for de-words."
  nl.b1.unit04.lesson01.exercise02.listen_collega_die:
    instruction: "Listen and select what you hear."
    correct_option: "The colleague who sits next to me is nice."
    distractors: ["The colleague who sits next to me is busy.", "The colleague who works with me is nice.", "The colleague who sits next to you is nice."]
    accepted_answers: [{value: "The colleague who sits next to me is nice.", status: correct}]
    feedback: "De collega die naast me zit, is aardig means the colleague who sits next to me is nice."
  nl.b1.unit04.lesson01.exercise03.match_die_words:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - value: {ik: I, "de collega": "the colleague", die: "who / that (common gender)", naast: "next to", zit: sits, me: me, is: is, aardig: "nice / kind"}
        status: correct
    feedback: "These are this lesson's core words."
  nl.b1.unit04.lesson01.exercise04.order_collega_die:
    instruction: "Put the words in order: The colleague who sits next to me is nice."
    accepted_answers:
      - {value: "De collega die naast me zit is aardig", status: correct}
