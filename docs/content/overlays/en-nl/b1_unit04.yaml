    gloss: "Omar: How coincidental! It's a small world."

  nl.b1.unit04.lesson05.teach.mijn_beste_vriendin:
    title: "my best friend"
    gloss: "my best friend"
    example_gloss: "My best friend is Sara."
  nl.b1.unit04.lesson05.teach.de_universiteit:
    title: "the university"
    gloss: "the university"
    example_gloss: "I've known her since university."
  nl.b1.unit04.lesson05.teach.een_bedrijf:
    title: "a company"
    gloss: "a company"
    example_gloss: "Sara works at a company."
  nl.b1.unit04.lesson05.teach.rustig:
    title: "quiet / calm"
    gloss: "quiet / calm"
    example_gloss: "The park is very quiet."
  nl.b1.unit04.lesson05.teach.reading_sara:
    title: "Reading: My friend Sara"
    gloss: "My best friend is Sara, whom I've known since university. She lives in a house that stands right next to the park. The park where we often walk is very quiet. Sara works at a company that makes new apps."
    glosses:
      Mijn: "my"
      beste: "best (superlative of goed)"
      vriendin: "(female) friend"
      die: "who / that (relative pronoun for de-words)"
      ken: "know (1st sg of kennen, to be acquainted with)"
      sinds: "since"
      universiteit: "university"
      woont: "lives (3rd sg of wonen)"
      huis: "house"
      dat: "that / which (relative pronoun for het-words)"
      vlak: "right / just (vlak bij = right next to)"
      bij: "near / at"
      park: "park"
      staat: "stands (3rd sg of staan)"
      waar: "where (relative)"
      vaak: "often"
      wandelen: "walk / stroll"
      heel: "very"
      rustig: "quiet / calm"
      werkt: "works (3rd sg of werken)"
      bedrijf: "company"
      nieuwe: "new (inflected form of nieuw)"
      apps: "apps"
      maakt: "makes (3rd sg of maken)"

  nl.b1.unit04.lesson06.teach.met_wie:
    title: "with whom"
    gloss: "with whom"
    note: "For PEOPLE, careful standard Dutch puts the preposition before *wie* ('who/whom') instead of fusing it onto *waar*: *de collega MET WIE ik werk* ('the colleague WITH WHOM I work'). In casual speech you will also hear *de collega waarmee ik werk*, but *met wie* is the form to use yourself, especially in writing."
    example_gloss: "The colleague with whom I work is nice."
  nl.b1.unit04.lesson06.teach.grammar_review:
    title: "The colleague who sits next to me is nice. The house that I'm buying is big. The city where I live is small. The colleague with whom I work is nice."
    gloss: "The colleague who sits next to me is nice. The house that I'm buying is big. The city where I live is small. The colleague with whom I work is nice."
    note: "This unit's full relative-clause paradigm: *die* (de-word subject/object), *dat* (het-word subject/object), *waar*(+preposition) for things/places, and *met wie* (preposition+*wie*) for people -- four shapes for one English who/that/which/where."

exercises:
  nl.b1.unit04.lesson01.exercise01.recognize_die:
    instruction: "What does this word mean?"
    correct_option: "who / that (common gender)"
    distractors: ["that / which (neuter)", where, when]
