    gloss: "Lotte: Do you know the colleague who sits next to me?"
  nl.b1.unit04.lesson04.teach.dialogue_omar_bedoel_je:
    title: "Omar: Do you mean the woman who always drinks coffee?"
    gloss: "Omar: Do you mean the woman who always drinks coffee?"
  nl.b1.unit04.lesson04.teach.dialogue_lotte_precies:
    title: "Lotte: Yes, exactly. She comes from the city where I was born."
    gloss: "Lotte: Yes, exactly. She comes from the city where I was born."
  nl.b1.unit04.lesson04.teach.dialogue_omar_toevallig:
