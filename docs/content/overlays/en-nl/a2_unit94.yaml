course:
  title: "Dutch A2"
  description: "Grammar-led A2 Dutch for saying what you do something for."
  learning_goal: "Say what you do something for with om ... te, including separable verbs, and recognise zodat."
units:
  nl.a2.unit94.om_te_en_zodat: {title: "In order to", description: "Say what you do something for: errands, learning and saving money."}
lessons:
  nl.a2.unit94.lesson01.sparen_om_te: {"title": "Saving to buy"}
  nl.a2.unit94.lesson02.scheidbare_werkwoorden: {"title": "To tidy up: separable verbs"}
  nl.a2.unit94.lesson03.omdat_en_zodat: {"title": "Omdat or zodat"}
  nl.a2.unit94.lesson04.een_lijstje: {"title": "A list for today"}
  nl.a2.unit94.lesson05.noors_dag: {"title": "Noor's busy day"}
  nl.a2.unit94.lesson06.lotte_en_omar: {"title": "Lotte and Omar run errands"}
teaching:
  nl.a2.unit94.lesson01.teach.sparen: {"title": "Saving and buying", "gloss": "to save / the money / to buy / the bike", "note": "These are the first words you need for talking about a goal.", "example_gloss": ["I save money.", "I buy a bike."]}
  nl.a2.unit94.lesson01.teach.boodschappen: {"title": "Errands", "gloss": "the bank / the post office / the supermarket / the bread / the letter / the package", "note": "Places and things for everyday errands.", "example_gloss": ["I go to the bank.", "I go to the post office.", "I buy bread in the supermarket."]}
  nl.a2.unit94.lesson01.teach.leren: {"title": "Learning", "gloss": "to learn / Dutch / to talk / to take a course", "note": "*Een cursus volgen* means to take a course.", "example_gloss": ["I learn Dutch.", "I take a course.", "I talk to Lotte."]}
  nl.a2.unit94.lesson01.teach.gn_om_te: {"title": "Om ... te: what you do something for", "gloss": "I save to buy a bike.", "note": "Use *om ... te* + infinitive to say the purpose of an action. In this unit the infinitive (*kopen*) comes last in the phrase, with *te* right before it: *om een fiets te kopen*. The subject is the same as in the first part (here: *ik*)."}
  nl.a2.unit94.lesson01.teach.zinnen: {"title": "Three purposes", "gloss": "I go to the supermarket to buy bread. I go to the post office to send a letter. I learn Dutch to talk to Lotte.", "note": "*Sturen* means to send."}
  nl.a2.unit94.lesson02.teach.scheidbaar: {"title": "Verbs with a particle", "gloss": "to withdraw money / to pick up a package / to arrange to meet / to tidy up / to call", "note": "In a main clause the little word (*op*, *af*) goes to the end of the clause: *Ik neem geld op.* (*Bellen* has no little word.)", "example_gloss": ["I withdraw money.", "I pick up a package.", "I arrange to meet Lotte.", "I tidy up.", "I call Lotte."]}
  nl.a2.unit94.lesson02.teach.gn_scheidbaar: {"title": "Te goes between the particle and the verb", "gloss": "to withdraw; to pick up; to arrange to meet; to tidy up", "note": "With a separable verb, *te* goes between the particle and the verb: *op te nemen*, *af te spreken*. Verbs without a particle simply take *te* before them: *te kopen*, *te sturen*."}
  nl.a2.unit94.lesson02.teach.zinnen: {"title": "Four errands", "gloss": "I go to the bank to withdraw money. I go to the post office to pick up a package. I call Lotte to arrange to meet. I go home to tidy up."}
  nl.a2.unit94.lesson03.teach.vragen: {"title": "Why and what for", "gloss": "why / what for / because / so that / needed", "note": "*Waarom* asks for a reason; *waarvoor* asks for a purpose.", "example_gloss": ["Why do you save?", "What do you save for?", "I need money."]}
  nl.a2.unit94.lesson03.teach.gn_omdat: {"title": "Omdat gives a reason", "gloss": "Why do you save? Because I need a bike.", "note": "*Omdat* gives a reason, not a purpose. The conjugated verb goes to the end of the *omdat* clause: *omdat ik een fiets nodig heb*. It has its own subject and verb."}
  nl.a2.unit94.lesson03.teach.gn_doel: {"title": "Om ... te gives a purpose", "gloss": "What do you save for? To buy a bike.", "note": "*Om ... te* answers *waarvoor?* and names the goal. It has no subject of its own: the person doing the action is the same as in the main part."}
  nl.a2.unit94.lesson03.teach.gn_zodat: {"title": "Zodat: a different person", "gloss": "I help Omar so that he is ready on time. I write it down so that you do not forget it.", "note": "*Zodat* also gives a purpose, typically with a new subject (*hij*, *jij*), and the conjugated verb goes to the end of its clause. Recognise it for now; you will mostly use *om ... te* when you yourself do the action."}
  nl.a2.unit94.lesson04.teach.lijstje: {"title": "My list", "gloss": "the list / today / first / afterwards / the baker / the bike shop", "note": "*Eerst* and *daarna* put your errands in order.", "example_gloss": ["My list for today.", "I buy bread at the baker.", "I buy a new bike in the bike shop."]}
  nl.a2.unit94.lesson04.teach.gn_voorop: {"title": "The om phrase first", "gloss": "To withdraw money I go to the bank. To buy bread I go to the baker.", "note": "You can start with the *om ... te* phrase. Then the verb comes straight after it and before the subject: *Om brood te kopen ga ik ...*, not *Om brood te kopen ik ga ...*."}
  nl.a2.unit94.lesson04.teach.zinnen: {"title": "Errands in order", "gloss": "First I go to the bank to withdraw money. Afterwards I go to the baker to buy bread.", "note": "After *eerst* or *daarna* at the start, the verb stays in second position: *ga ik*."}
  nl.a2.unit94.lesson05.teach.reading: {"title": "Noor's list", "gloss": "Noor has a lot to do. First she goes to the bank to withdraw money. Afterwards she goes to the post office to send a package. Every month she saves money to buy a new bike. Lotte helps her so that she is ready on time."}
  nl.a2.unit94.lesson06.teach.beurt1: {"title": "Lotte asks", "gloss": "Lotte: Hi Omar, are you going to the post office?"}
  nl.a2.unit94.lesson06.teach.beurt2: {"title": "Omar explains", "gloss": "Omar: Yes, I am going to the post office to pick up a package."}
  nl.a2.unit94.lesson06.teach.beurt3: {"title": "Lotte names her errand", "gloss": "Lotte: I am going to the bank to withdraw money."}
  nl.a2.unit94.lesson06.teach.beurt4: {"title": "Omar asks what for", "gloss": "Omar: What do you need money for?"}
  nl.a2.unit94.lesson06.teach.beurt5: {"title": "Lotte names her goal", "gloss": "Lotte: I am saving to buy a new bike."}
  nl.a2.unit94.lesson06.teach.beurt6: {"title": "Omar offers to wait", "gloss": "Omar: Nice! I will wait for you, so we can go together."}
exercises:
  nl.a2.unit94.lesson01.exercise01.choose_fiets: {"instruction": "Choose the correct Dutch sentence.", "correct_option": "Ik spaar om een fiets te kopen.", "distractors": ["Ik spaar om een fiets kopen.", "Ik spaar om te een fiets kopen.", "Ik spaar een fiets om te kopen."], "accepted_answers": [{"value": "Ik spaar om een fiets te kopen.", "status": "correct"}], "feedback": "*Om ... te* surrounds the object: *om een fiets te kopen*, with *te kopen* at the end."}
  nl.a2.unit94.lesson01.exercise02.choose_brood: {"instruction": "Choose the correct Dutch sentence.", "correct_option": "Ik ga naar de supermarkt om brood te kopen.", "distractors": ["Ik ga naar de supermarkt om brood kopen te.", "Ik ga naar de supermarkt te brood om kopen.", "Ik ga naar de supermarkt om kopen te brood."], "accepted_answers": [{"value": "Ik ga naar de supermarkt om brood te kopen.", "status": "correct"}], "feedback": "The order is *om* + object + *te* + infinitive."}
  nl.a2.unit94.lesson01.exercise03.match_doelen: {"instruction": "Match each Dutch purpose phrase to its English meaning.", "accepted_answers": [{"value": [{"left": "om een fiets te kopen", "right": "to buy a bike"}, {"left": "om brood te kopen", "right": "to buy bread"}, {"left": "om een brief te sturen", "right": "to send a letter"}, {"left": "om Nederlands te leren", "right": "to learn Dutch"}, {"left": "om met Lotte te praten", "right": "to talk to Lotte"}, {"left": "om geld te sparen", "right": "to save money"}], "status": "correct"}], "feedback": "Each phrase names a purpose: *om ... te* + infinitive."}
  nl.a2.unit94.lesson01.exercise04.order_fiets: {"instruction": "Put the words in order to say 'I save to buy a bike.'", "correct_option": "Ik spaar om een fiets te kopen", "accepted_answers": [{"value": "Ik spaar om een fiets te kopen", "status": "correct"}, {"value": "Om een fiets te kopen spaar ik", "status": "correct"}], "feedback": "*Ik spaar om een fiets te kopen* = I save to buy a bike."}
  nl.a2.unit94.lesson01.exercise05.complete_te: {"instruction": "Complete the sentence with the word that goes before the infinitive.", "correct_option": "te", "accepted_answers": [{"value": "te", "status": "correct"}], "feedback": "*Te* comes right before the infinitive in an *om ... te* phrase."}
  nl.a2.unit94.lesson01.exercise06.translate_brief: {"instruction": "Translate into Dutch.", "accepted_answers": [{"value": "Ik ga naar het postkantoor om een brief te sturen.", "status": "correct"}, {"value": "Ik ga naar het postkantoor om een brief te sturen", "status": "correct"}, {"value": "Om een brief te sturen ga ik naar het postkantoor.", "status": "correct"}, {"value": "Om een brief te sturen ga ik naar het postkantoor", "status": "correct"}], "feedback": "*Ik ga naar het postkantoor om een brief te sturen* = I go to the post office to send a letter."}
  nl.a2.unit94.lesson01.exercise07.write_leren: {"instruction": "Write the requested Dutch sentence using om ... te.", "correct_option": "Ik leer Nederlands om met Lotte te praten.", "accepted_answers": [{"value": "Ik leer Nederlands om met Lotte te praten.", "status": "correct"}, {"value": "Ik leer Nederlands om met Lotte te praten", "status": "correct"}, {"value": "Ik leer Nederlands om te praten met Lotte.", "status": "correct"}, {"value": "Ik leer Nederlands om te praten met Lotte", "status": "correct"}, {"value": "Om met Lotte te praten leer ik Nederlands.", "status": "correct"}, {"value": "Om met Lotte te praten leer ik Nederlands", "status": "correct"}, {"value": "Om te praten met Lotte leer ik Nederlands.", "status": "correct"}, {"value": "Om te praten met Lotte leer ik Nederlands", "status": "correct"}], "feedback": "*Ik leer Nederlands om met Lotte te praten* = I learn Dutch to talk to Lotte."}
  nl.a2.unit94.lesson02.exercise01.choose_opnemen: {"instruction": "Choose the correct Dutch sentence.", "correct_option": "Ik ga naar de bank om geld op te nemen.", "distractors": ["Ik ga naar de bank om geld te opnemen.", "Ik ga naar de bank om geld op nemen te.", "Ik ga naar de bank om op geld te nemen."], "accepted_answers": [{"value": "Ik ga naar de bank om geld op te nemen.", "status": "correct"}], "feedback": "Put *te* between the particle and the verb: *op te nemen*."}
  nl.a2.unit94.lesson02.exercise02.choose_afspreken: {"instruction": "Choose the correct Dutch sentence.", "correct_option": "Ik bel Lotte om af te spreken.", "distractors": ["Ik bel Lotte om te afspreken.", "Ik bel Lotte om af spreken te.", "Ik bel Lotte af te om spreken."], "accepted_answers": [{"value": "Ik bel Lotte om af te spreken.", "status": "correct"}], "feedback": "*Afspreken* is separable: *af te spreken*."}
  nl.a2.unit94.lesson02.exercise03.match_vormen: {"instruction": "Match each infinitive to its form after om.", "accepted_answers": [{"value": [{"left": "opnemen", "right": "op te nemen"}, {"left": "ophalen", "right": "op te halen"}, {"left": "afspreken", "right": "af te spreken"}, {"left": "opruimen", "right": "op te ruimen"}, {"left": "sturen", "right": "te sturen"}, {"left": "kopen", "right": "te kopen"}], "status": "correct"}], "feedback": "Verbs with a particle split around *te*; the others just take *te* before the verb."}
  nl.a2.unit94.lesson02.exercise04.order_pakket: {"instruction": "Put the words in order to say 'I go to the post office to pick up a package.'", "correct_option": "Ik ga naar het postkantoor om een pakket op te halen", "accepted_answers": [{"value": "Ik ga naar het postkantoor om een pakket op te halen", "status": "correct"}, {"value": "Om een pakket op te halen ga ik naar het postkantoor", "status": "correct"}], "feedback": "*Op te halen* stays together at the end of the *om* phrase."}
  nl.a2.unit94.lesson02.exercise05.complete_te: {"instruction": "Complete the sentence.", "correct_option": "te", "accepted_answers": [{"value": "te", "status": "correct"}], "feedback": "*Te* goes between *op* and *ruimen*."}
  nl.a2.unit94.lesson02.exercise06.translate_opruimen: {"instruction": "Translate into Dutch.", "accepted_answers": [{"value": "Ik ga naar huis om op te ruimen.", "status": "correct"}, {"value": "Ik ga naar huis om op te ruimen", "status": "correct"}, {"value": "Om op te ruimen ga ik naar huis.", "status": "correct"}, {"value": "Om op te ruimen ga ik naar huis", "status": "correct"}], "feedback": "*Ik ga naar huis om op te ruimen* = I go home to tidy up."}
  nl.a2.unit94.lesson02.exercise07.write_pakket_sturen: {"instruction": "Write the requested Dutch sentence. Note that sturen has no particle.", "correct_option": "Ik ga naar het postkantoor om een pakket te sturen.", "accepted_answers": [{"value": "Ik ga naar het postkantoor om een pakket te sturen.", "status": "correct"}, {"value": "Ik ga naar het postkantoor om een pakket te sturen", "status": "correct"}, {"value": "Om een pakket te sturen ga ik naar het postkantoor.", "status": "correct"}, {"value": "Om een pakket te sturen ga ik naar het postkantoor", "status": "correct"}], "feedback": "*Sturen* has no particle, so it is simply *te sturen*."}
  nl.a2.unit94.lesson03.exercise01.choose_omdat: {"instruction": "Choose the correct Dutch sentence with omdat.", "correct_option": "Ik spaar omdat ik een fiets nodig heb.", "distractors": ["Ik spaar omdat ik nodig een fiets heb.", "Ik spaar omdat ik heb een fiets nodig.", "Ik spaar om ik een fiets nodig heb."], "accepted_answers": [{"value": "Ik spaar omdat ik een fiets nodig heb.", "status": "correct"}], "feedback": "In an *omdat* clause the verb (*heb*) goes to the end."}
  nl.a2.unit94.lesson03.exercise02.listen_zodat: {"instruction": "Listen and select what you hear.", "correct_option": "Ik help Omar, zodat hij op tijd klaar is.", "distractors": ["Ik help Omar, omdat hij op tijd klaar is.", "Ik help Omar, zodat hij het niet vergeet.", "Ik help Omar, zodat hij niet klaar is."], "accepted_answers": [{"value": "Ik help Omar, zodat hij op tijd klaar is.", "status": "correct"}], "feedback": "You heard *Ik help Omar, zodat hij op tijd klaar is.*"}
  nl.a2.unit94.lesson03.exercise03.match_bijzinnen: {"instruction": "Match each Dutch phrase to its English meaning.", "accepted_answers": [{"value": [{"left": "omdat ik geld nodig heb", "right": "because I need money"}, {"left": "om geld op te nemen", "right": "to withdraw money"}, {"left": "zodat jij het niet vergeet", "right": "so that you do not forget it"}, {"left": "om een brief te sturen", "right": "to send a letter"}, {"left": "omdat ik naar de bank ga", "right": "because I am going to the bank"}, {"left": "zodat hij op tijd klaar is", "right": "so that he is ready on time"}], "status": "correct"}], "feedback": "*Omdat* gives a reason, *zodat* a purpose with a different subject, and *om ... te* a purpose with the same subject."}
  nl.a2.unit94.lesson03.exercise04.order_omdat: {"instruction": "Put the words in order to say 'I save because I need a bike.'", "correct_option": "Ik spaar omdat ik een fiets nodig heb", "accepted_answers": [{"value": "Ik spaar omdat ik een fiets nodig heb", "status": "correct"}, {"value": "Omdat ik een fiets nodig heb spaar ik", "status": "correct"}], "feedback": "After *omdat*, *heb* is at the end. If the *omdat* clause comes first, the verb of the main clause follows it: *spaar ik*."}
  nl.a2.unit94.lesson03.exercise05.complete_om: {"instruction": "Complete the sentence with the word that starts a purpose phrase.", "correct_option": "om", "accepted_answers": [{"value": "om", "status": "correct"}], "feedback": "*Om ... op te nemen* names the purpose."}
  nl.a2.unit94.lesson03.exercise06.translate_waarom: {"instruction": "Translate into Dutch. Use omdat.", "accepted_answers": [{"value": "Waarom spaar je? Omdat ik een fiets nodig heb.", "status": "correct"}, {"value": "Waarom spaar je? Omdat ik een fiets nodig heb", "status": "correct"}, {"value": "Waarom spaar jij? Omdat ik een fiets nodig heb.", "status": "correct"}, {"value": "Waarom spaar jij? Omdat ik een fiets nodig heb", "status": "correct"}], "feedback": "*Omdat ik een fiets nodig heb* gives the reason."}
  nl.a2.unit94.lesson03.exercise07.write_twee_zinnen: {"instruction": "Write exactly two Dutch sentences, following the two numbered requirements.", "correct_option": "Ik spaar, omdat ik geld nodig heb. Ik spaar om een fiets te kopen.", "accepted_answers": [{"value": "Ik spaar, omdat ik geld nodig heb. Ik spaar om een fiets te kopen.", "status": "correct"}, {"value": "Ik spaar, omdat ik geld nodig heb. Ik spaar om een fiets te kopen", "status": "correct"}, {"value": "Ik spaar, omdat ik geld nodig heb. Om een fiets te kopen spaar ik.", "status": "correct"}, {"value": "Ik spaar, omdat ik geld nodig heb. Om een fiets te kopen spaar ik", "status": "correct"}, {"value": "Ik spaar omdat ik geld nodig heb. Ik spaar om een fiets te kopen.", "status": "correct"}, {"value": "Ik spaar omdat ik geld nodig heb. Ik spaar om een fiets te kopen", "status": "correct"}, {"value": "Ik spaar omdat ik geld nodig heb. Om een fiets te kopen spaar ik.", "status": "correct"}, {"value": "Ik spaar omdat ik geld nodig heb. Om een fiets te kopen spaar ik", "status": "correct"}, {"value": "Omdat ik geld nodig heb, spaar ik. Ik spaar om een fiets te kopen.", "status": "correct"}, {"value": "Omdat ik geld nodig heb, spaar ik. Ik spaar om een fiets te kopen", "status": "correct"}, {"value": "Omdat ik geld nodig heb, spaar ik. Om een fiets te kopen spaar ik.", "status": "correct"}, {"value": "Omdat ik geld nodig heb, spaar ik. Om een fiets te kopen spaar ik", "status": "correct"}, {"value": "Omdat ik geld nodig heb spaar ik. Ik spaar om een fiets te kopen.", "status": "correct"}, {"value": "Omdat ik geld nodig heb spaar ik. Ik spaar om een fiets te kopen", "status": "correct"}, {"value": "Omdat ik geld nodig heb spaar ik. Om een fiets te kopen spaar ik.", "status": "correct"}, {"value": "Omdat ik geld nodig heb spaar ik. Om een fiets te kopen spaar ik", "status": "correct"}], "feedback": "*Omdat* gives a reason; *om ... te* gives a purpose."}
  nl.a2.unit94.lesson04.exercise01.choose_voorop: {"instruction": "Choose the correct Dutch sentence.", "correct_option": "Om brood te kopen ga ik naar de bakker.", "distractors": ["Om brood te kopen ik ga naar de bakker.", "Om te brood kopen ga ik naar de bakker.", "Om brood kopen te ga ik naar de bakker."], "accepted_answers": [{"value": "Om brood te kopen ga ik naar de bakker.", "status": "correct"}], "feedback": "When the *om* phrase comes first, the verb is next: *ga ik*."}
  nl.a2.unit94.lesson04.exercise02.choose_eerst: {"instruction": "Choose the correct Dutch sentence.", "correct_option": "Eerst ga ik naar de bank om geld op te nemen.", "distractors": ["Eerst ik ga naar de bank om geld op te nemen.", "Eerst ga ik naar de bank om geld te opnemen.", "Eerst ga ik naar de bank geld om op te nemen."], "accepted_answers": [{"value": "Eerst ga ik naar de bank om geld op te nemen.", "status": "correct"}], "feedback": "*Eerst* is followed by the verb (*ga*) and then the subject (*ik*)."}
  nl.a2.unit94.lesson04.exercise03.match_plaatsen: {"instruction": "Match each action to its purpose.", "accepted_answers": [{"value": [{"left": "Ik ga naar de bank", "right": "om geld op te nemen"}, {"left": "Ik ga naar de bakker", "right": "om brood te kopen"}, {"left": "Ik ga naar het postkantoor", "right": "om een brief te sturen"}, {"left": "Ik ga naar de fietsenwinkel", "right": "om een nieuwe fiets te kopen"}, {"left": "Ik volg een cursus", "right": "om Nederlands te leren"}, {"left": "Ik bel Lotte", "right": "om af te spreken"}], "status": "correct"}], "feedback": "Each place or action goes with one natural purpose."}
  nl.a2.unit94.lesson04.exercise04.order_bakker: {"instruction": "Put the words in order, starting with the om phrase.", "correct_option": "Om brood te kopen ga ik naar de bakker", "accepted_answers": [{"value": "Om brood te kopen ga ik naar de bakker", "status": "correct"}, {"value": "Ik ga naar de bakker om brood te kopen", "status": "correct"}], "feedback": "Starting with *om brood te kopen*, the verb *ga* comes next, then *ik*."}
  nl.a2.unit94.lesson04.exercise05.complete_om: {"instruction": "Complete the sentence.", "correct_option": "Om", "accepted_answers": [{"value": "Om", "status": "correct"}, {"value": "om", "status": "correct"}], "feedback": "A purpose phrase starts with *om*."}
