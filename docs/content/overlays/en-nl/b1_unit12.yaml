    gloss: "As soon as I'm home, I'll call you."
    note: "*Zodra* (as soon as) names the moment a result follows. Dutch uses the present tense where English says \"I'll call\": *bel ik je*. The verb of the *zodra*-clause goes to the end: *zodra ik thuis ben*."

