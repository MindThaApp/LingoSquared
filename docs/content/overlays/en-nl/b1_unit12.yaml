    title: "If I have time, I go running."
    gloss: "If I have time, I go running."
    note: "In a Dutch *als*-clause the verb goes to the end (*Als ik tijd heb*). When the condition comes first, the main clause starts with its verb: *ga ik hardlopen*. The order can be turned around: *Ik ga hardlopen als ik tijd heb*."

