course:
  title: "Dutch A1"
  description: "Beginner Dutch for naming family members and describing simple family relationships with mijn/jouw/zijn/haar."

units:
  nl.a1.unit05.family: {title: "Family and possession"}

lessons:
  nl.a1.unit05.lesson01.direct_family: {title: "Close family"}
  nl.a1.unit05.lesson02.extended_family: {title: "Extended family"}
  nl.a1.unit05.lesson03.mijn_je: {title: "Mijn and je"}
  nl.a1.unit05.lesson04.zijn_haar: {title: "Zijn and haar"}
  nl.a1.unit05.lesson05.lotte_profiel: {title: "Lotte's family profile"}
  nl.a1.unit05.lesson06.taalcafe_familie_dialoog: {title: "Family at the language café"}

teaching:
  nl.a1.unit05.lesson01.teach.vader_moeder: {title: "Father and mother", gloss: "father / mother", note: "*Vader* is the standard neutral word for father. *Moeder* is the standard neutral word for mother.", example_gloss: ["This is my father.", "That is my mother."]}
  nl.a1.unit05.lesson01.teach.ouders_broer_zus: {title: "Parents, brother, and sister", gloss: "parents / brother / sister", note: "*Ouders* is always plural in this sense; *de broer* and *de zus* both take *de*.", example_gloss: ["My parents live in Utrecht.", "I have a brother.", "I have a sister."]}
  nl.a1.unit05.lesson01.teach.kind_kinderen: {title: "Child and children", gloss: "the child / the children", note: "*Kind* is a het-word: *het kind*. The plural *kinderen* takes *de*, even though the singular *kind* takes *het*.", example_gloss: ["My sister has one child.", "My uncle and aunt have two children."]}
  nl.a1.unit05.lesson01.teach.have_sentence: {title: "I have a brother and a sister", gloss: "I have a brother and a sister.", note: "*Ik heb ...* is the standard way to say what family members you have."}

  nl.a1.unit05.lesson02.teach.opa_oma_oom_tante: {title: "Grandfather, grandmother, uncle, and aunt", gloss: "grandfather / grandmother / uncle / aunt", note: "*Opa* is the everyday word for grandfather; *grootvader* is more formal/written. *Oma* is the everyday word for grandmother; *grootmoeder* is more formal/written. *De oom*. *De tante*.", example_gloss: ["My grandfather and grandmother live in Rotterdam.", "My grandmother is ninety-nine years old.", "My uncle lives in Amsterdam.", "My uncle and aunt have two children."]}
  nl.a1.unit05.lesson02.teach.neef_nicht_note: {title: "Neef and nicht are ambiguous", gloss: "neef = male cousin or nephew; nicht = female cousin or niece", note: "Dutch does not distinguish cousin from nephew/niece by a different word; context tells you which is meant. Not tested in exercises this unit — noted here only so you recognize the words later."}
  nl.a1.unit05.lesson02.teach.gezin: {title: "Family (household)", gloss: "family (household)", note: "*Gezin* refers to the household you live in (usually parents and children); *familie* is the broader word for extended family/relatives in general.", example_gloss: "My family (household) lives in Utrecht."}
  nl.a1.unit05.lesson02.teach.opa_oma_sentence: {title: "My grandparents live in Rotterdam", gloss: "My grandfather and grandmother live in Rotterdam.", note: "*Wonen in* + city names where someone lives."}
  nl.a1.unit05.lesson02.teach.oom_tante_sentence: {title: "My uncle and aunt have two children", gloss: "My uncle and aunt have two children.", note: "Use *hebben* because *oom en tante* refers to two people."}

  nl.a1.unit05.lesson03.teach.mijn_je_jouw: {title: "My and your (unstressed and stressed)", gloss: "my / your (unstressed) / your (stressed)", note: "*Mijn* always keeps the same form before de and het nouns, whether there is one or more than one. *Je* is the usual informal form when you are not stressing whose it is; it also keeps the same form before every noun. *Jouw* is stronger than *je* and is required when you contrast one person's family member with another's; it too keeps the same form before every noun.", example_gloss: ["This is my brother.", "Is this your sister?", "Is that your sister?"]}
  nl.a1.unit05.lesson03.teach.je_jouw_note: {title: "Je vs jouw", gloss: "je and jouw both mean informal 'your'", note: "Use *je* when there is no special emphasis. Use *jouw* when you stress whose it is, especially in a contrast. The full form *jouw* is also possible without contrast, but *je* is more usual there."}
  nl.a1.unit05.lesson03.teach.dit_is_mijn_broer: {title: "This is my brother", gloss: "This is my brother.", note: "*Dit is ...* introduces someone nearby."}
  nl.a1.unit05.lesson03.teach.is_dat_jouw_zus: {title: "Is that your sister?", gloss: "Is that your sister?", note: "*Dat is ...* refers to someone farther away or already mentioned."}

  nl.a1.unit05.lesson04.teach.zijn_haar: {title: "His and her", gloss: "his / her", note: "*Zijn* always keeps the same form, like *mijn*, *je*, and *jouw*. *Haar* always keeps the same form too.", example_gloss: ["This is his father.", "That is her mother."]}
  nl.a1.unit05.lesson04.teach.zijn_haar_note: {title: "Zijn vs haar", gloss: "zijn = his, haar = her", note: "For the people in these examples, choose *zijn* for a male owner and *haar* for a female owner. The family word that follows does not affect the choice: *zijn vader* and *zijn moeder*; *haar vader* and *haar moeder*."}
  nl.a1.unit05.lesson04.teach.dit_is_zijn_vader: {title: "This is his father", gloss: "This is his father.", note: "*Zijn vader* — his father."}
  nl.a1.unit05.lesson04.teach.dat_is_haar_moeder: {title: "That is her mother", gloss: "That is her mother.", note: "*Haar moeder* — her mother."}

  nl.a1.unit05.lesson05.teach.heet: {title: "Is called / is named", gloss: "is called", note: "*Ik heet ...* / *Hij heet ...* — the standard way to give someone's name, already seen in unit01.", example_gloss: "My name is Lotte."}
  nl.a1.unit05.lesson05.teach.sander_fenna_jan_marieke: {title: "Family member names: Sander, Fenna, Jan, and Marieke", gloss: "Sander (a Dutch male name) / Fenna (a Dutch female name) / Jan (a Dutch male name) / Marieke (a Dutch female name)", note: "All four are common Dutch first names — Sander and Jan are male names, Fenna and Marieke are female names.", example_gloss: ["My brother is called Sander.", "My sister is called Fenna.", "My father is called Jan.", "My mother is called Marieke."]}
  nl.a1.unit05.lesson05.teach.rotterdam: {title: "Rotterdam", gloss: "Rotterdam", note: "A major Dutch city.", example_gloss: "Lotte's grandfather and grandmother live in Rotterdam."}
  nl.a1.unit05.lesson05.teach.profile: {title: "Lotte's family profile", gloss: "My name is Lotte. I have a brother and a sister. My brother is called Sander and my sister is called Fenna. My father is called Jan and my mother is called Marieke. My grandfather and grandmother live in Rotterdam.", note: "A short spoken self-introduction of Lotte's family, reusing vocabulary from this unit's earlier lessons."}

  nl.a1.unit05.lesson06.teach.egypte: {title: "Egypt", gloss: "Egypt", note: "Omar's home country, consistent with earlier units.", example_gloss: "My parents live in Egypt."}
  nl.a1.unit05.lesson06.teach.elke_maand: {title: "Every month", gloss: "every month", note: "*Elke* + singular noun expresses 'every ...'.", example_gloss: "Yes, every month."}
  nl.a1.unit05.lesson06.teach.lines01_04: {title: "Do you have brothers or sisters?", gloss: "Lotte: Do you have brothers or sisters, Omar? Omar: Yes, I have two sisters. No brothers. And you? Lotte: I have a brother and a sister.", note: "*Broers of zussen* — brothers or sisters, using the plural forms."}
  nl.a1.unit05.lesson06.teach.lines05_08: {title: "Do your parents live in the Netherlands too?", gloss: "Omar: Do your parents live in the Netherlands too? Lotte: Yes, my parents live in Utrecht. And your family? Omar: My parents live in Egypt, but my uncle lives here in Amsterdam.", note: "*Wonen ook in* — live also in, asking whether the same is true for someone else."}
  nl.a1.unit05.lesson06.teach.lines09_10: {title: "Do you see him often?", gloss: "Lotte: Nice! Do you see him often? Omar: Yes, every month.", note: "*Zie je hem vaak?* — a natural, common way to ask about visit frequency."}

exercises:
  nl.a1.unit05.lesson01.exercise01.choose_vader:
    instruction: "Choose the Dutch word for 'father'."
    correct_option: vader
    distractors: [moeder, broer, opa]
    accepted_answers: [{value: vader, status: correct}]
    feedback: "Vader means father."
  nl.a1.unit05.lesson01.exercise02.choose_zus:
    instruction: "Choose the Dutch word for 'sister'."
    correct_option: zus
    distractors: [broer, moeder, tante]
    accepted_answers: [{value: zus, status: correct}]
    feedback: "Zus means sister."
  nl.a1.unit05.lesson01.exercise03.listen_broer_zus:
    instruction: "Listen and choose what you hear."
    correct_option: "I have a brother and a sister."
    distractors: ["I have a brother and two sisters.", "I have two sisters.", "I have one sister."]
    accepted_answers: [{value: "I have a brother and a sister.", status: correct}]
    feedback: "The recording says Ik heb een broer en een zus — I have a brother and a sister."
  nl.a1.unit05.lesson01.exercise04.match_family_words:
    instruction: "Match each Dutch word to its English meaning."
    accepted_answers: [{"value": [{"left": "vader", "right": "father"}, {"left": "moeder", "right": "mother"}, {"left": "broer", "right": "brother"}, {"left": "zus", "right": "sister"}, {"left": "ouders", "right": "parents"}, {"left": "kind", "right": "child"}, {"left": "kinderen", "right": "children"}], "status": "correct"}]
    feedback: "Vader/moeder/broer/zus are father/mother/brother/sister."
  nl.a1.unit05.lesson01.exercise05.order_have_sentence:
    instruction: "Put the words in order to say 'I have a brother and a sister.'"
