teaching:
  nl.a2.unit77.lesson01.teach.koptelefoon:
    title: "The headphones"
    gloss: "the headphones"
    note: "*De koptelefoon* is a common (de) noun, singular in Dutch even though 'headphones' is plural in English."
    example_gloss: "I bought new headphones."
  nl.a2.unit77.lesson01.teach.koptelefoon_kapot:
    title: "Reporting the headphones are broken"
    gloss: "These headphones are broken."
    note: "*Kapot* (broken) describes any object that no longer works, from electronics to furniture."
  nl.a2.unit77.lesson01.teach.linkerkant_doet_het_niet:
    title: "Describing which side doesn't work"
    gloss: "The left side doesn't work."
    note: "*Doet het niet* (literally 'does it not') is the standard idiom for a device or part not working."

  nl.a2.unit77.lesson02.teach.geld_terug:
    title: "The money back"
    gloss: "the money back/refund"
    note: "*Het geld terug* is a fixed noun phrase used for a refund."
    example_gloss: "I would like my money back."
  nl.a2.unit77.lesson02.teach.graag_geld_terug:
    title: "Requesting a refund"
    gloss: "I would like my money back."
    note: "*Graag* (gladly/please) softens the request, standard polite phrasing in Dutch."
  nl.a2.unit77.lesson02.teach.ruilen_of_geld:
    title: "Asking about exchange or refund"
    gloss: "Can I exchange it or get my money back?"
    note: "*Ruilen* (to exchange) and *het geld terugkrijgen* (to get the money back) are the two standard resolutions to a complaint."

  nl.a2.unit77.lesson03.teach.bonnetje:
    title: "The receipt"
    gloss: "the receipt"
    note: "*Het bonnetje* (diminutive of *de bon*) is the everyday word for a shop receipt."
    example_gloss: "I still have the receipt, here it is."
  nl.a2.unit77.lesson03.teach.heeft_u_bonnetje:
    title: "Asking if the customer has the receipt"
    gloss: "Do you still have the receipt?"
    note: "*Nog* (still) confirms whether the item is still in the customer's possession."
  nl.a2.unit77.lesson03.teach.acht_dagen_geleden:
    title: "Saying when you bought something"
    gloss: "I bought it eight days ago."
    note: "*Geleden* (ago) follows a time period, the standard way to say how long ago something happened."

  nl.a2.unit77.lesson04.teach.retourbeleid:
    title: "The return policy"
    gloss: "the return policy"
    note: "*Het retourbeleid* is a common compound of *retour* (return) and *beleid* (policy)."
    example_gloss: "What's this shop's return policy?"
  nl.a2.unit77.lesson04.teach.dertig_dagen:
    title: "Stating the return window"
    gloss: "You can return an item within thirty days."
    note: "*Binnen* (within) + a time period is the standard construction for a deadline or window."
  nl.a2.unit77.lesson04.teach.dat_regel_ik:
    title: "Offering to arrange something"
    gloss: "I'll arrange that for you."
    note: "*Dat regel ik* (I'll arrange that) is a common, reassuring phrase used by staff helping a customer."

  nl.a2.unit77.lesson05.teach.beleid:
    title: "Reading a return policy notice"
    gloss: >-
      Return policy: you can return an item within thirty days of
      purchase. Bring the receipt. For a defective item, you'll get
      your money back or you can exchange it for a new one.
    note: "*Bij een defect artikel* (for a defective item) introduces the specific case covered by this part of the policy."

  nl.a2.unit77.lesson06.teach.verkoper_open:
    title: "Employee opens the conversation"
    gloss: "Employee: Good afternoon, how can I help you?"
  nl.a2.unit77.lesson06.teach.omar_kapot:
    title: "Omar reports the problem"
    gloss: "Omar: Good afternoon, these headphones are broken. The left side doesn't work."
  nl.a2.unit77.lesson06.teach.verkoper_bonnetje:
    title: "Employee asks for the receipt"
    gloss: "Employee: That's annoying. Do you still have the receipt?"
  nl.a2.unit77.lesson06.teach.omar_acht_dagen:
    title: "Omar confirms and gives the purchase date"
    gloss: "Omar: Yes, here it is. I bought it eight days ago."
  nl.a2.unit77.lesson06.teach.verkoper_binnen_dertig:
    title: "Employee confirms it's within the window"
    gloss: "Employee: That's not a problem, that's within the thirty days. Would you like to exchange it or get your money back?"
  nl.a2.unit77.lesson06.teach.omar_geld_terug:
    title: "Omar chooses a refund"
    gloss: "Omar: I would like my money back."
  nl.a2.unit77.lesson06.teach.verkoper_regel_het:
    title: "Employee confirms it's arranged"
    gloss: "Employee: Great, I'll arrange that for you."
  nl.a2.unit77.lesson06.teach.grammar_gekocht:
    title: "Third person: hij/zij with heeft"
    gloss: "He bought the headphones. She got her money back."
    note: "*Heeft* is the third-person singular of *hebben* (to have), used with a past participle for the present perfect; *hij* (he) and *zij* (she) plus *haar* (her) are the matching pronouns used to summarize what happened."

