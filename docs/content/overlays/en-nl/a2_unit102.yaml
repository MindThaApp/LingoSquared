review: {status: unreviewed, required_next_reviewer: owner_native_pass, notes: "English overlay for the grammar-led negation unit. OPEN NATIVE QUESTIONS: none identified."}
course:
  title: "Dutch A2"
  description: "Grammar-led A2 Dutch for correcting misunderstandings with niet and geen."
  learning_goal: "Say not yet, no longer and none: place niet correctly, choose niet or geen, and use nog niet, niet meer and geen ... meer."
units:
  nl.a2.unit102.nog_niet_geen_meer: {title: "Not yet, none, no longer", description: "Correct a misunderstanding about bookings, orders and appointments with niet, geen, nog niet, niet meer and geen ... meer."}
lessons:
  nl.a2.unit102.lesson01.niet_en_geen: {title: "Niet and geen"}
  nl.a2.unit102.lesson02.plaats_van_niet: {title: "Where does niet go?"}
  nl.a2.unit102.lesson03.niet_of_geen: {title: "Choosing niet or geen"}
  nl.a2.unit102.lesson04.nog_niet_nog_geen: {title: "Not yet"}
  nl.a2.unit102.lesson05.niet_meer_geen_meer: {title: "No longer, no more"}
  nl.a2.unit102.lesson06.lotte_en_omar_kamer: {title: "Lotte, Omar and the room"}
teaching:
  nl.a2.unit102.lesson01.teach.restaurant: {"title": "At the restaurant", "gloss": "the restaurant / the table / the reservation / the order", "note": "These four nouns come back in the whole unit.", "example_gloss": ["I have a table in the restaurant.", "Omar has a reservation.", "Noor has an order."]}
  nl.a2.unit102.lesson01.teach.hotel: {"title": "At the hotel", "gloss": "the hotel / the room / the booking", "note": "*Hotel* is a het-word; *kamer* and *boeking* are de-words.", "example_gloss": ["The hotel is in Utrecht.", "Lotte has a room.", "I know the booking."]}
  nl.a2.unit102.lesson01.teach.afspraak: {"title": "Appointments and messages", "gloss": "the appointment / the doctor / the time / the message", "note": "*Tijd* has no plural in this use: it names time in general.", "example_gloss": ["I have an appointment with the doctor.", "Omar has time.", "Noor has a message."]}
  nl.a2.unit102.lesson01.teach.gn_niet_einde: {"title": "Niet at the end", "gloss": "I do not work. I do not know the restaurant.", "note": "In a short sentence, *niet* stands at the end. A definite object (*het restaurant*, *de dokter*) comes before *niet*."}
  nl.a2.unit102.lesson01.teach.gn_geen: {"title": "Geen instead of een", "gloss": "I have a table. I have no table.", "note": "*Geen* replaces *een* and negates the noun. Normally do not say *niet een*."}
  nl.a2.unit102.lesson01.teach.zinnen: {"title": "Three negative sentences", "gloss": "I have no reservation. I do not know the hotel. I have no time."}
  nl.a2.unit102.lesson02.teach.eigenschappen: {"title": "Describing words", "gloss": "open / ready / expensive / big / free", "note": "These words describe a noun after *is*.", "example_gloss": ["The restaurant is open.", "The room is big.", "The table is free."]}
  nl.a2.unit102.lesson02.teach.werkwoorden: {"title": "Verbs for bookings", "gloss": "to call / to book / to come / can / to go; called / booked", "note": "Many verbs form the perfect with *heb* + participle: *Ik heb gebeld*. *Kan* is followed by a second verb in the infinitive: *Ik kan komen*.", "example_gloss": ["Lotte has called.", "I have booked the room.", "I can come.", "I am going to the restaurant."]}
  nl.a2.unit102.lesson02.teach.tijd: {"title": "Time words", "gloss": "today / tomorrow / often", "note": "Time words usually stand before *niet*.", "example_gloss": ["I am coming today.", "Omar is calling tomorrow.", "Noor often calls."]}
  nl.a2.unit102.lesson02.teach.gn_niet_voor: {"title": "Niet before ...", "gloss": "The room is not big. I am not going to the restaurant. I cannot come. I have not called.", "note": "*Niet* stands before an adjective (*niet groot*), before a prepositional phrase (*niet naar het restaurant*) and before the second verb (*niet komen*, *niet gebeld*)."}
  nl.a2.unit102.lesson02.teach.gn_niet_na: {"title": "Niet after ...", "gloss": "I have not booked the room. I am not coming tomorrow.", "note": "A definite object (*de kamer*) and a time word (*morgen*, *vandaag*) come before *niet*. If a participle or second verb follows, *niet* stands before it; in a simple sentence like *Ik kom morgen niet*, *niet* is last."}
  nl.a2.unit102.lesson03.teach.meervoud: {"title": "Plurals and uncountables", "gloss": "the rooms / the tables / the place / the money / the coffee", "note": "*Kamers* and *tafels* are plurals. *Geld* and *koffie* have no *een* and no plural in this use.", "example_gloss": ["There are rooms.", "There is coffee.", "We have tables.", "I have money."]}
  nl.a2.unit102.lesson03.teach.gn_geen_regels: {"title": "When to use geen", "gloss": "I have no appointment. There are no rooms. I have no time.", "note": "Use *geen* when the noun has *een*, has no article or is plural: *een afspraak*, *tijd*, *kamers*."}
  nl.a2.unit102.lesson03.teach.gn_niet_regels: {"title": "Niet or geen?", "gloss": "I do not know the doctor. The coffee is not expensive. It is not a restaurant.", "note": "Use *niet* for a definite noun (*de dokter*), for an adjective (*duur*) and for verbs. *Het is een restaurant* becomes *Het is geen restaurant*."}
  nl.a2.unit102.lesson04.teach.betalen: {"title": "Paying and confirming", "gloss": "the bill / the confirmation / paid / ordered / there", "note": "*Betaald* and *besteld* are participles, like *gebeld* and *geboekt*.", "example_gloss": ["I have paid the bill.", "The confirmation is here.", "Noor has ordered coffee."]}
  nl.a2.unit102.lesson04.teach.gn_nog_niet: {"title": "Nog niet = not yet", "gloss": "I have not booked the room yet. The room is not ready yet.", "note": "*Nog niet* means not yet: it is still coming. Keep the same place as *niet*, with *nog* in front."}
  nl.a2.unit102.lesson04.teach.gn_nog_geen: {"title": "Nog geen = no ... yet", "gloss": "I have not booked a room yet. We have no message yet.", "note": "*Nog geen* + noun means no ... yet. *Nog* stands before *geen*."}
  nl.a2.unit102.lesson04.teach.antwoord: {"title": "Short answers", "gloss": "Is the room ready? Not yet. Do you have a table? Not yet."}
  nl.a2.unit102.lesson05.teach.woorden: {"title": "Useful words", "gloss": "more / unfortunately / full / wants / so", "note": "*Meer* is the key word of this lesson.", "example_gloss": ["Unfortunately the hotel is full.", "Omar wants a room.", "I have no time any more."]}
  nl.a2.unit102.lesson05.teach.gn_niet_meer: {"title": "Niet meer = no longer", "gloss": "The restaurant is no longer open. I no longer work.", "note": "*Niet meer* means it was so before, but not now. It keeps the place of *niet*."}
  nl.a2.unit102.lesson05.teach.gn_geen_meer: {"title": "Geen ... meer = no more", "gloss": "There are no rooms left. I have no time left.", "note": "*Geen ... meer* means nothing is left. *Meer* comes after the noun."}
  nl.a2.unit102.lesson05.teach.gn_contrast: {"title": "Nog niet or niet meer?", "gloss": "The room is not free yet. The room is no longer free.", "note": "*Nog niet*: it will come. *Niet meer*: it is over. The two mean opposite things."}
  nl.a2.unit102.lesson05.teach.reading: {"title": "Lotte needs a room", "gloss": "Lotte wants to book a room tomorrow. She calls the hotel, but the hotel is unfortunately full. There are no rooms left. Lotte does not have another room yet. So she calls another hotel, but that hotel is no longer open. So Lotte has no room yet."}
  nl.a2.unit102.lesson06.teach.ask_kamer: {"title": "Lotte asks", "gloss": "Lotte: Hi Omar, have you booked the room?"}
  nl.a2.unit102.lesson06.teach.nog_niet: {"title": "Omar answers", "gloss": "Omar: Not yet. I have no time today."}
  nl.a2.unit102.lesson06.teach.tafel: {"title": "Lotte checks", "gloss": "Lotte: You have a table in the restaurant, don't you?"}
  nl.a2.unit102.lesson06.teach.klopt_niet: {"title": "Omar corrects her", "gloss": "Omar: No, that is not right. I have no table. The restaurant is full."}
  nl.a2.unit102.lesson06.teach.geen_meer: {"title": "Lotte asks again", "gloss": "Lotte: Are there no tables left?"}
  nl.a2.unit102.lesson06.teach.helaas: {"title": "Omar ends", "gloss": "Omar: No, unfortunately not. I am calling tomorrow."}
exercises:
  nl.a2.unit102.lesson01.exercise01.choose_geen: {"instruction": "Choose the correct Dutch sentence for 'I do not have a reservation.'", "correct_option": "Ik heb geen reservering.", "distractors": ["Ik heb niet reservering.", "Ik heb reservering niet.", "Ik niet heb een reservering."], "accepted_answers": [{"value": "Ik heb geen reservering.", "status": "correct"}], "feedback": "*Een reservering* becomes *geen reservering*."}
  nl.a2.unit102.lesson01.exercise02.choose_niet: {"instruction": "Choose the correct Dutch sentence for 'I do not know the hotel.'", "correct_option": "Ik ken het hotel niet.", "distractors": ["Ik ken geen het hotel.", "Ik niet ken het hotel.", "Ik ken het hotel geen."], "accepted_answers": [{"value": "Ik ken het hotel niet.", "status": "correct"}], "feedback": "With a definite object (*het hotel*), use *niet* after it."}
  nl.a2.unit102.lesson01.exercise03.match_words: {"instruction": "Match each Dutch noun to its English meaning.", "accepted_answers": [{"value": [{"left": "de tafel", "right": "the table"}, {"left": "de reservering", "right": "the reservation"}, {"left": "de bestelling", "right": "the order"}, {"left": "de kamer", "right": "the room"}, {"left": "de afspraak", "right": "the appointment"}, {"left": "het bericht", "right": "the message"}, {"left": "de tijd", "right": "the time"}, {"left": "de dokter", "right": "the doctor"}], "status": "correct"}], "feedback": "These nouns are used in every lesson of this unit."}
  nl.a2.unit102.lesson01.exercise04.order_geen_tijd: {"instruction": "Put the words in order to say 'I have no time.'", "correct_option": "Ik heb geen tijd", "accepted_answers": [{"value": "Ik heb geen tijd", "status": "correct"}, {"value": "Geen tijd heb ik", "status": "correct"}], "feedback": "*Geen tijd* = no time."}
  nl.a2.unit102.lesson01.exercise05.complete_geen: {"instruction": "Complete the sentence to say you have no appointment.", "correct_option": "geen", "accepted_answers": [{"value": "geen", "status": "correct"}], "feedback": "*Een afspraak* becomes *geen afspraak*."}
  nl.a2.unit102.lesson01.exercise06.translate_no_time: {"instruction": "Translate into Dutch.", "accepted_answers": [{"value": "Ik heb geen tijd.", "status": "correct"}, {"value": "Ik heb geen tijd", "status": "correct"}], "feedback": "*Ik heb geen tijd* = I have no time."}
  nl.a2.unit102.lesson01.exercise07.write_dont_know: {"instruction": "Write the requested Dutch sentence.", "correct_option": "Ik ken het hotel niet.", "accepted_answers": [{"value": "Ik ken het hotel niet.", "status": "correct"}, {"value": "Ik ken het hotel niet", "status": "correct"}, {"value": "Het hotel ken ik niet.", "status": "correct"}, {"value": "Het hotel ken ik niet", "status": "correct"}], "feedback": "*Het hotel* is definite, so *niet* follows it."}
  nl.a2.unit102.lesson02.exercise01.choose_groot: {"instruction": "Choose the sentence with niet in the right place.", "correct_option": "De kamer is niet groot.", "distractors": ["De kamer is groot niet.", "De kamer niet is groot.", "Niet de kamer is groot."], "accepted_answers": [{"value": "De kamer is niet groot.", "status": "correct"}], "feedback": "*Niet* comes before the adjective *groot*."}
  nl.a2.unit102.lesson02.exercise02.choose_morgen: {"instruction": "Choose the sentence with niet in the right place.", "correct_option": "Ik kan morgen niet komen.", "distractors": ["Ik kan morgen komen niet.", "Ik niet kan morgen komen.", "Niet ik kan morgen komen."], "accepted_answers": [{"value": "Ik kan morgen niet komen.", "status": "correct"}], "feedback": "The time word *morgen* comes first, then *niet*, then the second verb *komen*."}
  nl.a2.unit102.lesson02.exercise03.match_niet: {"instruction": "Match each Dutch sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "De kamer is niet groot.", "right": "The room is not big."}, {"left": "Ik ken het hotel niet.", "right": "I do not know the hotel."}, {"left": "Ik ga niet naar het restaurant.", "right": "I am not going to the restaurant."}, {"left": "Ik kan niet komen.", "right": "I cannot come."}, {"left": "Ik heb de kamer niet geboekt.", "right": "I have not booked the room."}, {"left": "Het restaurant is niet open.", "right": "The restaurant is not open."}], "status": "correct"}], "feedback": "Check where *niet* stands in each sentence."}
  nl.a2.unit102.lesson02.exercise04.order_geboekt: {"instruction": "Put the words in order to say 'I have not booked the room.'", "correct_option": "Ik heb de kamer niet geboekt", "accepted_answers": [{"value": "Ik heb de kamer niet geboekt", "status": "correct"}, {"value": "De kamer heb ik niet geboekt", "status": "correct"}], "feedback": "The definite object *de kamer* comes before *niet*; *geboekt* is last."}
  nl.a2.unit102.lesson02.exercise05.complete_naar: {"instruction": "Complete the sentence to say you are not going to the restaurant.", "correct_option": "niet", "accepted_answers": [{"value": "niet", "status": "correct"}], "feedback": "*Niet* stands before the prepositional phrase *naar het restaurant*."}
  nl.a2.unit102.lesson02.exercise06.translate_today: {"instruction": "Translate into Dutch.", "accepted_answers": [{"value": "Ik kan vandaag niet komen.", "status": "correct"}, {"value": "Ik kan vandaag niet komen", "status": "correct"}, {"value": "Vandaag kan ik niet komen.", "status": "correct"}, {"value": "Vandaag kan ik niet komen", "status": "correct"}], "feedback": "*Vandaag* comes before *niet*, and *komen* is last."}
  nl.a2.unit102.lesson02.exercise07.write_called: {"instruction": "Write the requested Dutch sentence.", "correct_option": "Ik heb niet gebeld.", "accepted_answers": [{"value": "Ik heb niet gebeld.", "status": "correct"}, {"value": "Ik heb niet gebeld", "status": "correct"}], "feedback": "*Niet* stands before the participle *gebeld*."}
  nl.a2.unit102.lesson03.exercise01.choose_kamers: {"instruction": "Choose the correct Dutch sentence for 'There are no rooms.'", "correct_option": "Er zijn geen kamers.", "distractors": ["Er zijn niet kamers.", "Er zijn kamers niet.", "Er geen zijn kamers."], "accepted_answers": [{"value": "Er zijn geen kamers.", "status": "correct"}], "feedback": "A plural noun without article is negated with *geen*."}
  nl.a2.unit102.lesson03.exercise02.choose_restaurant: {"instruction": "Choose the correct Dutch sentence for 'It is not a restaurant.'", "correct_option": "Het is geen restaurant.", "distractors": ["Het is een restaurant niet.", "Het niet is een restaurant.", "Het is niet restaurant."], "accepted_answers": [{"value": "Het is geen restaurant.", "status": "correct"}], "feedback": "*Een restaurant* becomes *geen restaurant*."}
  nl.a2.unit102.lesson03.exercise03.match_contrast: {"instruction": "Match each Dutch sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Ik heb geen afspraak.", "right": "I have no appointment."}, {"left": "Ik ken de dokter niet.", "right": "I do not know the doctor."}, {"left": "Er zijn geen tafels.", "right": "There are no tables."}, {"left": "De koffie is niet duur.", "right": "The coffee is not expensive."}, {"left": "Ik heb geen geld.", "right": "I have no money."}, {"left": "Het is geen hotel.", "right": "It is not a hotel."}], "status": "correct"}], "feedback": "*Geen* goes with an indefinite noun; *niet* goes with a definite noun or an adjective."}
  nl.a2.unit102.lesson03.exercise04.order_geen_hotel: {"instruction": "Put the words in order to say 'It is not a hotel.'", "correct_option": "Het is geen hotel", "accepted_answers": [{"value": "Het is geen hotel", "status": "correct"}], "feedback": "*Een hotel* becomes *geen hotel*."}
  nl.a2.unit102.lesson03.exercise05.complete_duur: {"instruction": "Complete the sentence to say the coffee is not expensive.", "correct_option": "niet", "accepted_answers": [{"value": "niet", "status": "correct"}], "feedback": "*Duur* is an adjective, so use *niet*."}
  nl.a2.unit102.lesson03.exercise06.translate_tables: {"instruction": "Translate into Dutch.", "accepted_answers": [{"value": "We hebben geen tafels.", "status": "correct"}, {"value": "We hebben geen tafels", "status": "correct"}, {"value": "Wij hebben geen tafels.", "status": "correct"}, {"value": "Wij hebben geen tafels", "status": "correct"}], "feedback": "*Tafels* is a plural noun without article, so use *geen*."}
  nl.a2.unit102.lesson03.exercise07.write_two: {"instruction": "Write exactly two Dutch sentences, following the two numbered requirements in the prompt.", "correct_option": "Ik heb geen afspraak. Ik ken de dokter niet.", "accepted_answers": [{"value": "Ik heb geen afspraak. Ik ken de dokter niet.", "status": "correct"}, {"value": "Ik heb geen afspraak. Ik ken de dokter niet", "status": "correct"}, {"value": "Ik heb geen afspraak. De dokter ken ik niet.", "status": "correct"}, {"value": "Ik heb geen afspraak. De dokter ken ik niet", "status": "correct"}], "feedback": "*Geen afspraak* (indefinite), but *de dokter niet* (definite)."}
  nl.a2.unit102.lesson04.exercise01.choose_nog_niet: {"instruction": "Choose the correct Dutch sentence for 'I have not booked the room yet.'", "correct_option": "Ik heb de kamer nog niet geboekt.", "distractors": ["Ik heb de kamer niet nog geboekt.", "Ik heb nog de kamer niet geboekt.", "Ik heb de kamer nog geen geboekt."], "accepted_answers": [{"value": "Ik heb de kamer nog niet geboekt.", "status": "correct"}], "feedback": "*Nog niet* stays together and stands before the participle."}
  nl.a2.unit102.lesson04.exercise02.choose_nog_geen: {"instruction": "Choose the correct Dutch sentence for 'We have no message yet.'", "correct_option": "We hebben nog geen bericht.", "distractors": ["We hebben nog bericht niet.", "We hebben geen nog bericht.", "We hebben bericht nog niet."], "accepted_answers": [{"value": "We hebben nog geen bericht.", "status": "correct"}], "feedback": "*Nog geen* + noun means no ... yet."}
  nl.a2.unit102.lesson04.exercise03.match_nog: {"instruction": "Match each Dutch sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Nog niet.", "right": "Not yet."}, {"left": "De kamer is nog niet klaar.", "right": "The room is not ready yet."}, {"left": "Ik heb nog geen tafel.", "right": "I have no table yet."}, {"left": "De bestelling is er nog niet.", "right": "The order is not here yet."}, {"left": "Ik heb de bevestiging nog niet.", "right": "I do not have the confirmation yet."}, {"left": "Ik heb nog niet gebeld.", "right": "I have not called yet."}, {"left": "Ik heb nog geen afspraak.", "right": "I have no appointment yet."}], "status": "correct"}], "feedback": "All of these sentences describe something that is still to come."}
  nl.a2.unit102.lesson04.exercise04.order_nog_geen: {"instruction": "Put the words in order to say 'I have not booked a room yet.'", "correct_option": "Ik heb nog geen kamer geboekt", "accepted_answers": [{"value": "Ik heb nog geen kamer geboekt", "status": "correct"}, {"value": "Nog geen kamer heb ik geboekt", "status": "correct"}], "feedback": "*Nog geen kamer* stays together; *geboekt* is last."}
  nl.a2.unit102.lesson04.exercise05.complete_nog: {"instruction": "Complete the answer: not yet.", "correct_option": "niet", "accepted_answers": [{"value": "niet", "status": "correct"}], "feedback": "*Nog niet* = not yet."}
  nl.a2.unit102.lesson04.exercise06.translate_not_ready: {"instruction": "Translate into Dutch.", "accepted_answers": [{"value": "De kamer is nog niet klaar.", "status": "correct"}, {"value": "De kamer is nog niet klaar", "status": "correct"}], "feedback": "*Nog niet* stands before the adjective *klaar*."}
  nl.a2.unit102.lesson04.exercise07.write_paid: {"instruction": "Write the requested Dutch sentence.", "correct_option": "Ik heb de rekening nog niet betaald.", "accepted_answers": [{"value": "Ik heb de rekening nog niet betaald.", "status": "correct"}, {"value": "Ik heb de rekening nog niet betaald", "status": "correct"}, {"value": "De rekening heb ik nog niet betaald.", "status": "correct"}, {"value": "De rekening heb ik nog niet betaald", "status": "correct"}], "feedback": "*De rekening* is definite, so it comes before *nog niet*."}
  nl.a2.unit102.lesson05.exercise01.read_vol: {"instruction": "Read Lotte's story and choose the answer.", "correct_option": "The hotel is full.", "distractors": ["Lotte has no time.", "The hotel is not open any more.", "Lotte did not call."], "accepted_answers": [{"value": "The hotel is full.", "status": "correct"}], "feedback": "*Het hotel is helaas vol. Er zijn geen kamers meer.*"}
  nl.a2.unit102.lesson05.exercise02.read_ander: {"instruction": "Read Lotte's story and choose the answer.", "correct_option": "It is no longer open.", "distractors": ["It is full.", "It is not open yet.", "It has no rooms yet."], "accepted_answers": [{"value": "It is no longer open.", "status": "correct"}], "feedback": "*Dat hotel is niet meer open.*"}
  nl.a2.unit102.lesson05.exercise03.match_reading: {"instruction": "Match each Dutch phrase from the text to its English meaning.", "accepted_answers": [{"value": [{"left": "Er zijn geen kamers meer.", "right": "There are no rooms left."}, {"left": "Lotte heeft nog geen andere kamer.", "right": "Lotte has no other room yet."}, {"left": "dat hotel is niet meer open", "right": "that hotel is no longer open"}, {"left": "het hotel is vol", "right": "the hotel is full"}, {"left": "Lotte wil morgen een kamer boeken.", "right": "Lotte wants to book a room tomorrow."}, {"left": "Daarom belt ze een ander hotel", "right": "So she calls another hotel"}], "status": "correct"}], "feedback": "Each phrase is taken from Lotte's story."}
  nl.a2.unit102.lesson05.exercise04.order_geen_meer: {"instruction": "Put the words in order to say 'There are no rooms left.'", "correct_option": "Er zijn geen kamers meer", "accepted_answers": [{"value": "Er zijn geen kamers meer", "status": "correct"}], "feedback": "*Geen kamers meer*: *meer* comes after the noun."}
  nl.a2.unit102.lesson05.exercise05.translate_no_longer: {"instruction": "Translate into Dutch.", "accepted_answers": [{"value": "Het hotel is niet meer open.", "status": "correct"}, {"value": "Het hotel is niet meer open", "status": "correct"}], "feedback": "*Niet meer* stands before the adjective *open*."}
  nl.a2.unit102.lesson05.exercise06.dictation_rooms: {"instruction": "Type what you hear.", "correct_response": "Er zijn geen kamers meer.", "orthography_strict": true, "feedback": "You heard *Er zijn geen kamers meer.*"}
  nl.a2.unit102.lesson05.exercise07.dictation_other: {"instruction": "Type what you hear.", "correct_response": "Lotte heeft nog geen andere kamer.", "orthography_strict": true, "feedback": "You heard *Lotte heeft nog geen andere kamer.*"}
  nl.a2.unit102.lesson06.exercise01.listen_question: {"instruction": "Listen and select Lotte's opening question.", "correct_option": "Hoi Omar, heb je de kamer geboekt?", "distractors": ["Hoi Omar, heb je de tafel geboekt?", "Hoi Omar, heb je de kamer besteld?", "Hoi Omar, ken je de kamer?"], "accepted_answers": [{"value": "Hoi Omar, heb je de kamer geboekt?", "status": "correct"}], "feedback": "Lotte asks: *Hoi Omar, heb je de kamer geboekt?*"}
  nl.a2.unit102.lesson06.exercise02.comprehend_booked: {"instruction": "Listen to the dialogue. Has Omar booked the room?", "correct_option": "Not yet.", "distractors": ["Yes, he has.", "No, the hotel is full.", "He has forgotten the room."], "accepted_answers": [{"value": "Not yet.", "status": "correct"}], "feedback": "Omar says: *Nog niet. Ik heb vandaag geen tijd.*"}
  nl.a2.unit102.lesson06.exercise03.match_mixed: {"instruction": "Match each Dutch sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "De kamer is nog niet vrij.", "right": "The room is not free yet."}, {"left": "De kamer is niet meer vrij.", "right": "The room is no longer free."}, {"left": "Ik heb nog geen tafel.", "right": "I have no table yet."}, {"left": "Ik heb geen tafel meer.", "right": "I have no table left."}, {"left": "Ik heb geen tijd.", "right": "I have no time."}, {"left": "Ik ken het hotel niet.", "right": "I do not know the hotel."}], "status": "correct"}], "feedback": "Watch the difference between *nog niet / nog geen* and *niet meer / geen ... meer*."}
  nl.a2.unit102.lesson06.exercise04.order_not_open: {"instruction": "Put the words in order to say 'The restaurant is no longer open.'", "correct_option": "Het restaurant is niet meer open", "accepted_answers": [{"value": "Het restaurant is niet meer open", "status": "correct"}], "feedback": "*Niet meer* stands before the adjective *open*."}
  nl.a2.unit102.lesson06.exercise05.respond_booked: {"instruction": "Answer in Dutch: say that you have not booked the room yet.", "correct_option": "Nog niet.", "accepted_answers": [{"value": "Nog niet.", "status": "correct"}, {"value": "Nog niet", "status": "correct"}, {"value": "Nee, nog niet.", "status": "correct"}, {"value": "Nee, nog niet", "status": "correct"}, {"value": "Ik heb de kamer nog niet geboekt.", "status": "correct"}, {"value": "Ik heb de kamer nog niet geboekt", "status": "correct"}, {"value": "Nee, ik heb de kamer nog niet geboekt.", "status": "correct"}, {"value": "Nee, ik heb de kamer nog niet geboekt", "status": "correct"}], "feedback": "*Nog niet.* is the short answer."}
  nl.a2.unit102.lesson06.exercise06.translate_no_time: {"instruction": "Translate into Dutch.", "accepted_answers": [{"value": "Ik heb geen tijd meer.", "status": "correct"}, {"value": "Ik heb geen tijd meer", "status": "correct"}], "feedback": "*Geen ... meer* = no more."}
  nl.a2.unit102.lesson06.exercise07.write_three: {"instruction": "Write exactly three Dutch sentences, following the three numbered requirements in the prompt.", "correct_option": "De kamer is nog niet klaar. Er zijn geen tafels meer. Ik heb geen afspraak.", "accepted_answers": [{"value": "De kamer is nog niet klaar. Er zijn geen tafels meer. Ik heb geen afspraak.", "status": "correct"}, {"value": "De kamer is nog niet klaar. Er zijn geen tafels meer. Ik heb geen afspraak", "status": "correct"}], "feedback": "*Nog niet*, *geen ... meer* and *geen* each have their own job."}
