course:
  title: "Dutch A2"
  description: "Grammar-led A2 Dutch for talking about ability and possibility."
  learning_goal: "Say what you can or can't do and what might happen, using kunnen, modal chains and misschien."
units:
  nl.a2.unit88.wat_kan_ik: {title: "What can I do?", description: "Say what you can and cannot do, combine modal verbs, and talk about what might happen."}
lessons:
  nl.a2.unit88.lesson01.dit_kan_ik: {"title": "This is what I can do"}
  nl.a2.unit88.lesson02.kun_je_dat: {"title": "Can you do that?"}
  nl.a2.unit88.lesson03.kunnen_willen_moeten: {"title": "Can, want, must"}
  nl.a2.unit88.lesson04.twee_werkwoorden: {"title": "Two verbs in a row"}
  nl.a2.unit88.lesson05.misschien_kan_het: {"title": "Maybe it is possible"}
  nl.a2.unit88.lesson06.lotte_en_omar: {"title": "Lotte and Omar make a plan"}
teaching:
  nl.a2.unit88.lesson01.teach.vaardigheden: {"title": "Skills", "gloss": "to cook / to swim / to cycle / to draw / to sing / to play the guitar", "note": "These infinitives name things you can do. Each ends in -en.", "example_gloss": ["Omar can cook well.", "Lotte can cycle.", "Noor can sing."]}
  nl.a2.unit88.lesson01.teach.kleine_woorden: {"title": "Small words", "gloss": "I / you / you / he / she / we / you (plural) / also / not / well / very / a little", "note": "These small words recur in every lesson. *Jij* and *je* both mean 'you'; *je* is the unstressed form.", "example_gloss": ["I can't sing.", "You can cycle very well.", "We can cook too.", "He can draw a little."]}
  nl.a2.unit88.lesson01.teach.vrienden: {"title": "Three friends", "gloss": "Lotte / Omar / Noor", "note": "The friends from this course appear throughout the unit.", "example_gloss": ["Lotte, Omar and Noor are friends."]}
  nl.a2.unit88.lesson01.teach.gn_kunnen: {"title": "Kunnen: present tense", "gloss": "I can, you can, he can, she can, we can, you (plural) can, they can", "note": "*Kunnen* (can, to be able to) is irregular. The singular is *ik kan*, *jij kunt*, *hij/zij kan*; the plural is always *kunnen*. In everyday speech *jij kan* is also common. In a question with inversion, the -t disappears: *kun je?*"}
  nl.a2.unit88.lesson01.teach.gn_infinitief: {"title": "The second verb is an infinitive at the end", "gloss": "I can cook. I can cook well. I can't swim.", "note": "After *kunnen*, the second verb is an infinitive and goes to the end of the sentence. Words like *goed* and *niet* come before it."}
  nl.a2.unit88.lesson01.teach.zinnen: {"title": "Three sentences", "gloss": "Omar can cook well. I can play the guitar a little. We can't sing."}
  nl.a2.unit88.lesson02.teach.meer_vaardigheden: {"title": "Languages and technology", "gloss": "to speak English / to type / to repair a computer", "note": "More things you can or cannot do. *Snel* means 'fast'.", "example_gloss": ["Can you speak English?", "Can you type fast?", "I can repair a computer."]}
  nl.a2.unit88.lesson02.teach.scheidbaar: {"title": "Useful separable verbs", "gloss": "to pick up / to call back / to bring along", "note": "These verbs have a separable prefix (*op-, terug-, mee-*). *Me* is 'me', and *je* can also be 'you' as an object.", "example_gloss": ["I can pick you up.", "Can you call me back?", "Lotte can bring the guitar."]}
  nl.a2.unit88.lesson02.teach.antwoorden: {"title": "Short answers", "gloss": "Yes, that's possible. No, I can't do that. Yes, I can do that.", "note": "*Wel* stresses that something is possible: *Dat kan ik wel.*"}
  nl.a2.unit88.lesson02.teach.gn_vraag: {"title": "Questions with kunnen", "gloss": "Can you cook? Can you cook? Can you (plural) cook?", "note": "In a yes/no question the verb comes first. With *je/jij* the verb is *kun* (no -t): *Kun je koken?* In casual speech *Kan je koken?* is also common."}
  nl.a2.unit88.lesson02.teach.gn_scheidbaar: {"title": "Modal plus separable verb", "gloss": "I can pick you up. Can you call me back?", "note": "With a modal verb, the separable verb is not split: it stays whole, as an infinitive at the end. Without a modal the prefix splits off (*Ik haal je op*); with a modal the verb stays whole: *Ik kan je ophalen*."}
  nl.a2.unit88.lesson03.teach.beschikbaar: {"title": "Availability", "gloss": "Saturday / Sunday / tomorrow / this evening / time / to come / to work", "note": "Use these words to say when you are free or busy. *Geen tijd* means 'no time'.", "example_gloss": ["I have no time on Saturday.", "Can you come tomorrow?", "I have to work this evening."]}
  nl.a2.unit88.lesson03.teach.verbinders: {"title": "Giving a reason", "gloss": "because / because / so", "note": "*Want* and *omdat* both give a reason; *dus* gives the result. After *want* and *dus* the word order is normal (subject, then verb); after *omdat* the verbs move to the end of the clause.", "example_gloss": ["I can't come, because I have to work.", "I can't come, because I have to work.", "I have no time, so I can't come."]}
  nl.a2.unit88.lesson03.teach.gn_drie_modalen: {"title": "Three modal verbs", "gloss": "I can, I want to, I have to; we can, we want to, we have to", "note": "*Kunnen, willen* and *moeten* work the same way: a conjugated modal in second position and an infinitive at the end. Each one changes the meaning: ability or possibility, wish, obligation."}
  nl.a2.unit88.lesson03.teach.gn_zonder_infinitief: {"title": "Kunnen without an infinitive", "gloss": "I can't on Saturday. Can you on Sunday? Yes, I can on Sunday.", "note": "When it is clear from context which verb is meant (here *komen*), Dutch often drops the infinitive: *Ik kan zaterdag niet.*"}
  nl.a2.unit88.lesson03.teach.zin_contrast: {"title": "Want versus must", "gloss": "I want to come, but I have to work.", "note": "*Maar* means 'but'."}
  nl.a2.unit88.lesson04.teach.plannen: {"title": "Getting better", "gloss": "to learn / to practise / better / more / next week / later / gladly", "note": "*Graag* adds 'gladly, with pleasure' to *willen*: *Ik wil graag ...* = I would like to ...", "example_gloss": ["I would like to practise more.", "Next week I can come.", "Later I want to cook better."]}
  nl.a2.unit88.lesson04.teach.gn_wil_kunnen: {"title": "Wil kunnen", "gloss": "I want to be able to swim. I want to be able to cook better.", "note": "You can stack modals. Only the first one is conjugated and stays in second position (*wil*). The others are infinitives at the end, in this order: the second modal first, the main verb last: *kunnen zwemmen*."}
  nl.a2.unit88.lesson04.teach.gn_zou_moeten: {"title": "Zou moeten", "gloss": "You should practise more. We should practise more.", "note": "*Zou moeten* gives advice: 'should'. *Zou* is the conjugated verb (singular *zou*, plural *zouden*); *moeten* and the main verb stand at the end."}
  nl.a2.unit88.lesson04.teach.gn_zal_kunnen: {"title": "Zal kunnen", "gloss": "I will be able to come on Saturday. I will be able to pick you up. I will have to work next week.", "note": "*Ik/hij/zij zal*; *jij zult* (also *jij zal*); *wij/jullie/zij zullen*. This verb points to the future. After it come two infinitives at the end. A separable verb like *ophalen* stays whole. *Jou* is the stressed form of *je*: *Ik zal jou kunnen ophalen.*"}
  nl.a2.unit88.lesson04.teach.zin_terugbellen: {"title": "Chain with a separable verb", "gloss": "I will be able to call you back tomorrow."}
  nl.a2.unit88.lesson05.teach.woorden: {"title": "Words for possibility", "gloss": "maybe / to know / together / we / hour, o'clock / two / at", "note": "*We* is the unstressed form of *wij*. *Om twee uur* means 'at two o'clock'.", "example_gloss": ["I don't know.", "We can cook together.", "Can you come at two o'clock?"]}
  nl.a2.unit88.lesson05.teach.gn_misschien: {"title": "Misschien", "gloss": "Maybe I can come. I can maybe come.", "note": "*Misschien* says something is possible but not certain. At the start of the sentence it triggers inversion (verb before subject); after the verb the word order stays normal."}
  nl.a2.unit88.lesson05.teach.gn_het_kan_zijn: {"title": "Het kan zijn dat", "gloss": "It may be that I have to work. It may rain tomorrow.", "note": "*Het kan zijn dat ...* introduces a possibility. After *dat*, the verb group goes to the end: *dat ik moet werken*; here finite *moet* precedes infinitive *werken*. *Kunnen* alone can also express possibility: *Het kan regenen.*"}
  nl.a2.unit88.lesson05.teach.reading: {"title": "Noor writes to Lotte", "gloss": "Hi Lotte, I may not be able to come on Saturday. It may be that I have to work. I will know on Sunday. Maybe we can cycle together on Sunday. I can make it at two o'clock. Best wishes, Noor", "note": "Notice how Noor mixes certainty (*ik kan om twee uur*) and possibility (*misschien*, *het kan zijn dat*).", "glosses": {"misschien": "maybe", "weet": "know", "samen": "together", "uur": "hour, o'clock"}}
  nl.a2.unit88.lesson06.teach.vraag: {"title": "Lotte asks", "gloss": "Lotte: Hi Omar, can you come on Saturday?"}
  nl.a2.unit88.lesson06.teach.antw: {"title": "Omar is not sure", "gloss": "Omar: I don't know yet. It may be that I have to work."}
  nl.a2.unit88.lesson06.teach.terugbellen: {"title": "Lotte asks for a call back", "gloss": "Lotte: Can you call me back, then?"}
  nl.a2.unit88.lesson06.teach.ja_dat_kan: {"title": "Omar agrees", "gloss": "Omar: Yes, that's possible. I can call you back tomorrow."}
  nl.a2.unit88.lesson06.teach.ophalen: {"title": "Lotte asks about Sunday", "gloss": "Lotte: Great! And can you pick me up on Sunday?"}
  nl.a2.unit88.lesson06.teach.zondag: {"title": "Omar offers a time", "gloss": "Omar: Sunday works for me. I can pick you up at two o'clock."}
exercises:
  nl.a2.unit88.lesson01.exercise01.choose_cook: {"instruction": "Choose the correct Dutch sentence.", "correct_option": "Omar kan goed koken.", "distractors": ["Omar kunnen goed koken.", "Omar kan koken goed.", "Omar kunt goed koken."], "accepted_answers": [{"value": "Omar kan goed koken.", "status": "correct"}], "feedback": "*Omar* takes *kan*, and the infinitive *koken* is last."}
  nl.a2.unit88.lesson01.exercise02.choose_swim: {"instruction": "Choose the correct Dutch sentence.", "correct_option": "Ik kan niet zwemmen.", "distractors": ["Ik kan zwemmen niet.", "Ik kunt niet zwemmen.", "Ik kunnen niet zwemmen."], "accepted_answers": [{"value": "Ik kan niet zwemmen.", "status": "correct"}], "feedback": "*Niet* comes before the infinitive: *Ik kan niet zwemmen.*"}
  nl.a2.unit88.lesson01.exercise03.match_skills: {"instruction": "Match each Dutch infinitive to its English meaning.", "accepted_answers": [{"value": [{"left": "koken", "right": "to cook"}, {"left": "zwemmen", "right": "to swim"}, {"left": "fietsen", "right": "to cycle"}, {"left": "tekenen", "right": "to draw"}, {"left": "zingen", "right": "to sing"}, {"left": "gitaar spelen", "right": "to play the guitar"}], "status": "correct"}], "feedback": "These are the skills used in this unit."}
  nl.a2.unit88.lesson01.exercise04.order_sing: {"instruction": "Put the words in order to say 'Noor can sing well.'", "correct_option": "Noor kan goed zingen", "accepted_answers": [{"value": "Noor kan goed zingen", "status": "correct"}], "feedback": "*Noor kan goed zingen*: the infinitive *zingen* is last."}
  nl.a2.unit88.lesson01.exercise05.complete_kunt: {"instruction": "Complete with the present-tense form of kunnen for jij.", "correct_option": "kunt", "accepted_answers": [{"value": "kunt", "status": "correct"}, {"value": "kan", "status": "correct"}], "feedback": "*Jij kunt* is the standard form; *jij kan* is common in speech."}
  nl.a2.unit88.lesson01.exercise06.translate_cycle: {"instruction": "Translate into Dutch.", "accepted_answers": [{"value": "Ik kan fietsen.", "status": "correct"}, {"value": "Ik kan fietsen", "status": "correct"}], "feedback": "*Ik kan fietsen* = I can cycle."}
  nl.a2.unit88.lesson01.exercise07.write_draw: {"instruction": "Write the requested Dutch sentence.", "correct_option": "Lotte kan goed tekenen.", "accepted_answers": [{"value": "Lotte kan goed tekenen.", "status": "correct"}, {"value": "Lotte kan goed tekenen", "status": "correct"}], "feedback": "*Lotte kan goed tekenen* = Lotte can draw well."}
  nl.a2.unit88.lesson02.exercise01.choose_guitar: {"instruction": "Choose the correct Dutch question.", "correct_option": "Kun je gitaar spelen?", "distractors": ["Kunt je gitaar spelen?", "Kun je spelen gitaar?", "Je kun gitaar spelen?"], "accepted_answers": [{"value": "Kun je gitaar spelen?", "status": "correct"}], "feedback": "The verb comes first, and in the inverted form it is *kun je*."}
  nl.a2.unit88.lesson02.exercise02.choose_no: {"instruction": "Choose the correct Dutch answer.", "correct_option": "Nee, dat kan ik niet.", "distractors": ["Nee, dat ik kan niet.", "Nee, dat niet kan ik.", "Nee, dat kunnen ik niet."], "accepted_answers": [{"value": "Nee, dat kan ik niet.", "status": "correct"}], "feedback": "Here *dat* is the first constituent, so finite *kan* is second and subject *ik* follows: *dat kan ik niet*."}
  nl.a2.unit88.lesson02.exercise03.match_sentences: {"instruction": "Match each Dutch sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Kun je Engels spreken?", "right": "Can you speak English?"}, {"left": "Ik kan je ophalen.", "right": "I can pick you up."}, {"left": "Kun je me terugbellen?", "right": "Can you call me back?"}, {"left": "Ik kan niet typen.", "right": "I can't type."}, {"left": "Lotte kan de gitaar meenemen.", "right": "Lotte can bring the guitar."}, {"left": "Nee, dat kan ik niet.", "right": "No, I can't do that."}], "status": "correct"}], "feedback": "Most sentences have a modal and a final infinitive; in *Dat kan ik niet*, the understood action is omitted."}
  nl.a2.unit88.lesson02.exercise04.order_english: {"instruction": "Put the words in order to ask 'Can you speak English?'", "correct_option": "Kun je Engels spreken", "accepted_answers": [{"value": "Kun je Engels spreken", "status": "correct"}], "feedback": "*Kun je Engels spreken?* The verb comes first."}
  nl.a2.unit88.lesson02.exercise05.complete_wel: {"instruction": "Complete with the present-tense form of kunnen for ik.", "correct_option": "kan", "accepted_answers": [{"value": "kan", "status": "correct"}], "feedback": "*Dat kan ik wel* = I can do that."}
  nl.a2.unit88.lesson02.exercise06.translate_callback: {"instruction": "Translate into Dutch (informal 'you').", "accepted_answers": [{"value": "Kun je me terugbellen?", "status": "correct"}, {"value": "Kun je me terugbellen", "status": "correct"}, {"value": "Kun jij me terugbellen?", "status": "correct"}, {"value": "Kun jij me terugbellen", "status": "correct"}, {"value": "Kan je me terugbellen?", "status": "correct"}, {"value": "Kan je me terugbellen", "status": "correct"}, {"value": "Kan jij me terugbellen?", "status": "correct"}, {"value": "Kan jij me terugbellen", "status": "correct"}], "feedback": "The separable verb *terugbellen* stays whole at the end."}
  nl.a2.unit88.lesson02.exercise07.write_pickup: {"instruction": "Write the requested Dutch sentence.", "correct_option": "Ik kan je ophalen.", "accepted_answers": [{"value": "Ik kan je ophalen.", "status": "correct"}, {"value": "Ik kan je ophalen", "status": "correct"}], "feedback": "*Ik kan je ophalen* = I can pick you up."}
  nl.a2.unit88.lesson03.exercise01.choose_want: {"instruction": "Choose the correct Dutch sentence.", "correct_option": "Wij willen zondag komen.", "distractors": ["Wij moeten zondag komen.", "Wij willen zondag werken.", "Wij wil zondag komen."], "accepted_answers": [{"value": "Wij willen zondag komen.", "status": "correct"}], "feedback": "*Willen* expresses a wish; the plural form is *willen*."}
  nl.a2.unit88.lesson03.exercise02.choose_cannot_come: {"instruction": "Choose the correct Dutch sentence.", "correct_option": "Omar kan zaterdag niet komen.", "distractors": ["Omar wil zaterdag niet komen.", "Omar kunnen zaterdag niet komen.", "Omar kan zaterdag komen niet."], "accepted_answers": [{"value": "Omar kan zaterdag niet komen.", "status": "correct"}], "feedback": "*Kan ... niet komen* says that it is not possible; *wil niet* would mean he does not want to."}
  nl.a2.unit88.lesson03.exercise03.match_modals: {"instruction": "Match each Dutch form to its English meaning.", "accepted_answers": [{"value": [{"left": "ik kan", "right": "I can"}, {"left": "ik wil", "right": "I want to"}, {"left": "ik moet", "right": "I have to"}, {"left": "wij kunnen", "right": "we can"}, {"left": "wij willen", "right": "we want to"}, {"left": "wij moeten", "right": "we have to"}], "status": "correct"}], "feedback": "Singular *kan/wil/moet* and plural *kunnen/willen/moeten*."}
  nl.a2.unit88.lesson03.exercise04.order_work: {"instruction": "Put the words in order to say 'I have to work this evening.'", "correct_option": "Ik moet vanavond werken", "accepted_answers": [{"value": "Ik moet vanavond werken", "status": "correct"}, {"value": "Vanavond moet ik werken", "status": "correct"}], "feedback": "The conjugated verb *moet* is in second position; *werken* is last."}
  nl.a2.unit88.lesson03.exercise05.complete_no_time: {"instruction": "Complete with the ik-form of kunnen.", "correct_option": "kan", "accepted_answers": [{"value": "kan", "status": "correct"}], "feedback": "*Dus ik kan niet komen* = so I can't come."}
  nl.a2.unit88.lesson03.exercise06.translate_saturday: {"instruction": "Translate into Dutch.", "accepted_answers": [{"value": "Ik kan zaterdag niet komen.", "status": "correct"}, {"value": "Ik kan zaterdag niet komen", "status": "correct"}, {"value": "Zaterdag kan ik niet komen.", "status": "correct"}, {"value": "Zaterdag kan ik niet komen", "status": "correct"}, {"value": "Ik kan zaterdag niet.", "status": "correct"}, {"value": "Ik kan zaterdag niet", "status": "correct"}, {"value": "Zaterdag kan ik niet.", "status": "correct"}, {"value": "Zaterdag kan ik niet", "status": "correct"}], "feedback": "*Ik kan zaterdag niet komen.* The time word can also come first, followed by the verb."}
  nl.a2.unit88.lesson03.exercise07.write_because: {"instruction": "Write the requested Dutch sentence.", "correct_option": "Ik kan niet komen, want ik moet werken.", "accepted_answers": [{"value": "Ik kan niet komen, want ik moet werken.", "status": "correct"}, {"value": "Ik kan niet komen want ik moet werken", "status": "correct"}, {"value": "Ik kan niet komen, omdat ik moet werken.", "status": "correct"}, {"value": "Ik kan niet komen omdat ik moet werken", "status": "correct"}], "feedback": "*Ik kan niet komen, want ik moet werken.*"}
  nl.a2.unit88.lesson04.exercise01.choose_sing: {"instruction": "Choose the correct Dutch sentence.", "correct_option": "Ik wil kunnen zingen.", "distractors": ["Ik wil zingen kunnen.", "Ik kunnen wil zingen.", "Ik wil kan zingen."], "accepted_answers": [{"value": "Ik wil kunnen zingen.", "status": "correct"}], "feedback": "Only *wil* is conjugated; *kunnen zingen* stands at the end."}
  nl.a2.unit88.lesson04.exercise02.choose_should: {"instruction": "Choose the correct Dutch sentence.", "correct_option": "Je zou meer moeten oefenen.", "distractors": ["Je zou moeten meer oefenen.", "Je zou meer moet oefenen.", "Je moeten zou meer oefenen."], "accepted_answers": [{"value": "Je zou meer moeten oefenen.", "status": "correct"}], "feedback": "*Zou* is second; *moeten oefenen* closes the sentence."}
  nl.a2.unit88.lesson04.exercise03.match_chains: {"instruction": "Match each Dutch sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Ik wil kunnen tekenen.", "right": "I want to be able to draw."}, {"left": "Ik zou moeten oefenen.", "right": "I should practise."}, {"left": "Ik zal kunnen komen.", "right": "I will be able to come."}, {"left": "Ik zal moeten werken.", "right": "I will have to work."}, {"left": "Ik wil beter kunnen koken.", "right": "I want to be able to cook better."}, {"left": "Ik zal je kunnen ophalen.", "right": "I will be able to pick you up."}], "status": "correct"}], "feedback": "In each chain the conjugated modal is second and the infinitives are at the end."}
  nl.a2.unit88.lesson04.exercise04.order_next_week: {"instruction": "Put the words in order to say 'I will be able to come next week.'", "correct_option": "Ik zal volgende week kunnen komen", "accepted_answers": [{"value": "Ik zal volgende week kunnen komen", "status": "correct"}, {"value": "Volgende week zal ik kunnen komen", "status": "correct"}], "feedback": "*Zal* is the conjugated verb; *kunnen komen* are the final infinitives."}
  nl.a2.unit88.lesson04.exercise05.complete_moeten: {"instruction": "Complete with the infinitive of moeten (meaning: I will have to work next week).", "correct_option": "moeten", "accepted_answers": [{"value": "moeten", "status": "correct"}], "feedback": "*Zal moeten werken* = will have to work."}
  nl.a2.unit88.lesson04.exercise06.translate_pickup: {"instruction": "Translate into Dutch.", "accepted_answers": [{"value": "Ik zal je kunnen ophalen.", "status": "correct"}, {"value": "Ik zal jou kunnen ophalen.", "status": "correct"}, {"value": "Ik zal je kunnen ophalen", "status": "correct"}, {"value": "Ik zal jou kunnen ophalen", "status": "correct"}], "feedback": "The separable verb *ophalen* stays whole at the end."}
  nl.a2.unit88.lesson04.exercise07.write_cook_better: {"instruction": "Write the requested Dutch sentence.", "correct_option": "Ik wil beter kunnen koken.", "accepted_answers": [{"value": "Ik wil beter kunnen koken.", "status": "correct"}, {"value": "Ik wil beter kunnen koken", "status": "correct"}], "feedback": "*Ik wil beter kunnen koken.*"}
  nl.a2.unit88.lesson05.exercise01.read_why: {"instruction": "Read Noor's message and choose the answer.", "correct_option": "She may have to work.", "distractors": ["She has no bicycle.", "She is ill.", "She does not want to come."], "accepted_answers": [{"value": "She may have to work.", "status": "correct"}], "feedback": "*Het kan zijn dat ik moet werken.*"}
  nl.a2.unit88.lesson05.exercise02.read_when: {"instruction": "Read Noor's message and choose the answer.", "correct_option": "On Sunday at two o'clock.", "distractors": ["On Saturday at two o'clock.", "On Sunday at four o'clock.", "On Sunday evening."], "accepted_answers": [{"value": "On Sunday at two o'clock.", "status": "correct"}], "feedback": "*Zondag ... om twee uur.*"}
  nl.a2.unit88.lesson05.exercise03.match_words: {"instruction": "Match each Dutch word or phrase to its English meaning.", "accepted_answers": [{"value": [{"left": "misschien", "right": "maybe"}, {"left": "samen", "right": "together"}, {"left": "weten", "right": "to know"}, {"left": "om twee uur", "right": "at two o'clock"}, {"left": "zondag", "right": "Sunday"}, {"left": "Het kan zijn dat", "right": "It may be that"}], "status": "correct"}], "feedback": "These expressions come from Noor's message."}
  nl.a2.unit88.lesson05.exercise04.order_maybe: {"instruction": "Put the words in order to say 'Maybe I can come.'", "correct_option": "Misschien kan ik komen", "accepted_answers": [{"value": "Misschien kan ik komen", "status": "correct"}, {"value": "Ik kan misschien komen", "status": "correct"}], "feedback": "With *misschien* first the verb follows it; both orders shown are correct."}
  nl.a2.unit88.lesson05.exercise05.translate_rain: {"instruction": "Translate into Dutch using kunnen.", "accepted_answers": [{"value": "Het kan morgen regenen.", "status": "correct"}, {"value": "Het kan morgen regenen", "status": "correct"}, {"value": "Morgen kan het regenen.", "status": "correct"}, {"value": "Morgen kan het regenen", "status": "correct"}], "feedback": "*Kunnen* expresses a possibility: *Het kan morgen regenen.*"}
  nl.a2.unit88.lesson05.exercise06.dictation_maybe: {"instruction": "Type what you hear.", "correct_response": "Misschien kunnen we zondag samen fietsen.", "orthography_strict": true, "feedback": "You heard *Misschien kunnen we zondag samen fietsen.*"}
  nl.a2.unit88.lesson05.exercise07.dictation_may_be: {"instruction": "Type what you hear.", "correct_response": "Het kan zijn dat ik moet werken.", "orthography_strict": true, "feedback": "You heard *Het kan zijn dat ik moet werken.*"}
