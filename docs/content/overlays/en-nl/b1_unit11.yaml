  notes: >-
    Overlay for nl's eleventh B1 unit, authored alongside the
    realization, no sibling-direction file (nl-en) consulted. English
    speakers' real risk here: English "while I was cooking" uses the same
    past continuous for background action that it would for almost
    anything else, which doesn't warn a learner that Dutch has no true
    past continuous tense at all -- *aan het koken was* (lesson01) is a
    periphrastic construction (*aan het* + infinitive + *zijn*, in the
    past), not a verb ending, and skipping it for a bare simple past
    (*terwijl ik kookte*) loses the durative/background framing the
    outcome specifically asks for. Also flagged: the separable verb
    *opnemen* changing shape between a main clause (*ik nam ... op*,
    lesson02) and a subordinate clause (*toen ik opnam*, lesson03) is a
    real word-order fact with no English parallel ("I picked up" has no
    equivalent split-vs-joined alternation) -- an English speaker won't
    have any instinct for when Dutch rejoins a separable verb into one
    word. Fresh-context review 2026-07-11: instructions/distractors/
    accepted_answers verified against the realization; word_order
    accepted_answers correctly comma-free; listen_select distractors
    on the full-dialogue audio are not lines the quizzed speaker says;
    matching_pairs keys aligned. One native-judgment flag recorded in
    the realization's review notes (ramin_native_pass): the lesson03
    recognize_toen "then"-distractor polysemy. No objective grading
    bugs.

    Language review 2026-10-20 (session 9, en-nl): 1 fix -- lesson01/02/05/06
    translate/write/speak exercises: added natural variants (Terwijl ik
    kookte, weer for opnieuw, Omar belde later opnieuw, Er gebeurde
    gisteravond iets grappigs, perfect-tense forms, We lachten er uiteindelijk
    samen om). NATIVE FLAGS: none.

