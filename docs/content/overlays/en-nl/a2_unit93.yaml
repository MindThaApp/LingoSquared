review: {status: reviewed, required_next_reviewer: owner_native_pass, notes: "Fresh-context review 2026-11-27 (en-nl A2 units 87-94 pass): 0 fixes. Read together with the realization: instructions vs keys (including the als-not-wanneer and nadat-only cues), every distractor (reversed-sequence and wrong-auxiliary distractors are all wrong for their prompts), clause-order, participle-order, ze/zij and als/wanneer variants in every typed answer, reading and dialogue comprehension keys vs the text, glosses and example_glosses. Some MC feedback strings refer to option positions ('the last option'); feedback is not shown to learners, so this was left as is. NATIVE FLAGS: see the realization review block. Earlier notes: English overlay for the grammar-led time-clause unit. OPEN NATIVE QUESTIONS: none identified."}
course:
  title: "Dutch A2"
  description: "Grammar-led A2 Dutch for ordering events with voordat, nadat, wanneer and als."
  learning_goal: "Order events with before, after and when clauses, with verb-final subclauses and inversion in the main clause."
units:
  nl.a2.unit93.voordat_nadat_wanneer: {title: "Before, after, when", description: "Order everyday and travel events with voordat, nadat, wanneer and als."}
lessons:
  nl.a2.unit93.lesson01.voordat_ik_ga: {title: "Before I go"}
  nl.a2.unit93.lesson02.nadat_ik_gegeten_heb: {title: "After I have eaten"}
  nl.a2.unit93.lesson03.voordat_of_nadat: {title: "Voordat or nadat?"}
  nl.a2.unit93.lesson04.wanneer_en_als: {title: "Wanneer and als"}
  nl.a2.unit93.lesson05.een_reisdag: {title: "A travel day"}
  nl.a2.unit93.lesson06.lotte_en_omar: {title: "Lotte and Omar plan a trip"}
teaching:
  nl.a2.unit93.lesson01.teach.dagelijks: {"title": "Daily actions", "gloss": "to shower / to have breakfast / to eat / to cook / to clean up / to call", "note": "*Opruimen* is separable: *ik ruim op*.", "example_gloss": ["I shower and I have breakfast.", "I eat a sandwich and I drink tea.", "I cook and I clean the kitchen.", "I call Lotte."]}
  nl.a2.unit93.lesson01.teach.plaatsen: {"title": "Places and times", "gloss": "work / home (direction) / at home / the shop / to bed", "note": "*Naar huis* shows direction; *thuis* shows where you are.", "example_gloss": ["I go to work.", "I go home.", "I am at home at six o'clock.", "I go to the shop.", "I go to bed at eleven o'clock."]}
  nl.a2.unit93.lesson01.teach.voordat: {"title": "Voordat", "gloss": "before", "note": "*Voordat* introduces the event that happens second.", "example_gloss": ["Before I eat, I call Lotte.", "Before I cook, I go to the shop.", "Before I go to bed, I drink tea."]}
  nl.a2.unit93.lesson01.teach.gn_voordat: {"title": "Voordat with the verb at the end", "gloss": "Before I go to work, I have breakfast.", "note": "After *voordat* the finite verb goes to the end of the clause: *ik naar mijn werk ga*."}
  nl.a2.unit93.lesson01.teach.gn_inversie: {"title": "Inversion after the opening clause", "gloss": "After voordat the verb is at the end. If the subclause comes first, the main clause starts with the finite verb and then the subject.", "note": "The comma closes the subclause. Then the main clause starts with the verb: *ontbijt ik*, not *ik ontbijt*."}
  nl.a2.unit93.lesson01.teach.zinnen: {"title": "Two sentences with voordat", "gloss": "Before I have breakfast, I shower. Before I go home, I call Lotte."}
  nl.a2.unit93.lesson02.teach.deelwoorden: {"title": "Past participles", "gloss": "to eat – eaten; to cook – cooked; to shower – showered; to call – called; to work – worked; to clean up – cleaned up", "note": "Regular verbs form the participle with *ge-* and *-t* or *-d*; *eten* is irregular (*gegeten*); *opruimen* puts *ge* inside: *opgeruimd*.", "example_gloss": ["I have eaten.", "I have cooked.", "I have called Lotte.", "I have worked and showered.", "I have cleaned the kitchen."]}
  nl.a2.unit93.lesson02.teach.aankomen: {"title": "To arrive", "gloss": "to arrive – arrived", "note": "*Aankomen* is separable: *ik kom aan*.", "example_gloss": ["I arrive at six o'clock.", "I arrived at six o'clock."]}
  nl.a2.unit93.lesson02.teach.nadat: {"title": "Nadat", "gloss": "after", "note": "*Nadat* introduces the event that happened first.", "example_gloss": ["After I have eaten, I clean up.", "After I have worked, I shower.", "After I have cooked, I eat."]}
  nl.a2.unit93.lesson02.teach.gn_nadat: {"title": "Nadat with the perfectum", "gloss": "After I have eaten, I clean up.", "note": "*Nadat* is followed by the perfectum, and both verbs stand at the end: *gegeten heb*."}
  nl.a2.unit93.lesson02.teach.gn_nadat_regel: {"title": "The rule for nadat", "gloss": "After nadat you use the perfectum (in the present). The participle and heb are at the end. The main clause then starts with the finite verb.", "note": "Inversion works as after *voordat*: *Nadat ik gegeten heb, ruim ik op* (not *ik ruim op*)."}
  nl.a2.unit93.lesson02.teach.gn_volgorde: {"title": "Two possible verb orders", "gloss": "Also fine: After I have eaten, I clean up.", "note": "In a subclause both *gegeten heb* and *heb gegeten* are correct. This unit mostly shows *gegeten heb*."}
  nl.a2.unit93.lesson02.teach.gn_aankomen: {"title": "Ben with aankomen", "gloss": "After I have arrived, I call Lotte.", "note": "*Aankomen* takes *zijn*, not *hebben*: *aangekomen ben*."}
  nl.a2.unit93.lesson03.teach.reis_woorden: {"title": "Travel words", "gloss": "the train / the station / the ticket / the suitcase", "note": "*Het kaartje* is a ticket for the train.", "example_gloss": ["The train is at the station.", "I buy a ticket.", "My suitcase is ready."]}
  nl.a2.unit93.lesson03.teach.reis_werkwoorden: {"title": "Travel verbs", "gloss": "to leave – left; to pack – packed; to buy – bought", "note": "*Vertrekken* takes *zijn* (*vertrokken ben*); *inpakken* and *kopen* take *hebben*. *Inpakken* is separable: *ik pak in*.", "example_gloss": ["The train leaves at nine o'clock.", "I leave at nine o'clock.", "I pack my suitcase.", "I have bought a ticket."]}
  nl.a2.unit93.lesson03.teach.gn_voordat_reis: {"title": "Voordat: the second event", "gloss": "Before I leave, I pack my suitcase.", "note": "The *voordat*-clause is the event that happens second: first packing, then leaving."}
  nl.a2.unit93.lesson03.teach.gn_nadat_reis: {"title": "Nadat: the first event", "gloss": "After I have packed my suitcase, I leave.", "note": "The *nadat*-clause is the event that happened first: first packing, then leaving. Same order of events as before, other conjunction."}
  nl.a2.unit93.lesson03.teach.gn_vergelijk: {"title": "Voordat or nadat", "gloss": "Voordat names the event that comes later. Nadat names the event that comes earlier.", "note": "Ask yourself which event comes first in time. In the present, *nadat* is followed by the perfectum in this unit and *voordat* by the simple present."}
  nl.a2.unit93.lesson03.teach.gn_hoofdzin_eerst: {"title": "Main clause first", "gloss": "I pack my suitcase before I leave.", "note": "If the main clause comes first, there is no inversion: *Ik pak ...*, and the subclause follows with the verb at the end."}
  nl.a2.unit93.lesson03.teach.gn_had: {"title": "Nadat in a story about the past", "gloss": "After I had eaten, I called Lotte.", "note": "In a story about the past, *had* replaces *heb* (and *was* replaces *ben*): *gegeten had*. The main clause is in the past too (*belde*)."}
  nl.a2.unit93.lesson04.teach.toestand: {"title": "Tired, early, late, hungry", "gloss": "tired / early / late / hunger", "note": "*Honger hebben* means to be hungry.", "example_gloss": ["I am tired.", "I go to bed early.", "I am home late.", "I am hungry."]}
  nl.a2.unit93.lesson04.teach.gewoonte: {"title": "Habits", "gloss": "to come home / the bike / to take / to rain", "note": "*Thuiskomen* is separable: *ik kom thuis*; in a subclause it is one word: *als ik thuiskom*.", "example_gloss": ["I come home at six o'clock.", "I take the bike.", "I take the bus.", "It is raining."]}
  nl.a2.unit93.lesson04.teach.wanneer_als: {"title": "Wanneer and als", "gloss": "whenever / when", "note": "In this use *wanneer* and *als* mean the same thing: whenever something happens again and again.", "example_gloss": ["Whenever I am tired, I go to bed early.", "When I am hungry, I eat a sandwich.", "Whenever it rains, I take the bus."]}
  nl.a2.unit93.lesson04.teach.gn_als: {"title": "Als with the present tense", "gloss": "When I am tired, I go to bed early.", "note": "A habit is in the present tense. The verb goes to the end: *ik moe ben*."}
  nl.a2.unit93.lesson04.teach.gn_wanneer_regel: {"title": "The rule for wanneer and als", "gloss": "With wanneer or als you say what happens again and again, or what happens later. The verb is at the end, and the main clause starts with the finite verb.", "note": "Careful: *als* can also mean *if*. *Wanneer* only means *when*."}
  nl.a2.unit93.lesson04.teach.gn_toen: {"title": "Toen against als", "gloss": "When I came home, Lotte called. When I get home, I call Lotte.", "note": "*Toen* belongs to one moment in the past and takes the imperfectum. *Wanneer* and *als* belong to habits and the present."}
  nl.a2.unit93.lesson04.teach.gn_toen_regel: {"title": "Choosing toen or wanneer", "gloss": "You use toen for one moment in the past. You use wanneer or als for a habit or for the present.", "note": "Toen was taught in an earlier unit; this is only a short reminder."}
  nl.a2.unit93.lesson05.teach.lezen: {"title": "Noor's travel day", "gloss": "Noor is taking the train tomorrow. Before she leaves, she packs her suitcase. After she has packed her suitcase, she has breakfast. She goes to the station and buys a ticket. Before the train leaves, she drinks coffee. When she arrives, she calls Lotte.", "note": "Follow the order of events: which clause tells you what comes first?", "glosses": {"morgen": "tomorrow", "met": "with", "pakt": "packs", "heeft": "has", "koopt": "buys", "drinkt": "drinks", "koffie": "coffee", "aankomt": "arrives", "belt": "calls", "haar": "her"}}
  nl.a2.unit93.lesson06.teach.lotte_vertrek: {"title": "Lotte asks about tomorrow", "gloss": "Lotte: Hi Omar, what time are you leaving tomorrow?"}
  nl.a2.unit93.lesson06.teach.omar_koffer: {"title": "Omar names his plan", "gloss": "Omar: At nine o'clock. Before I leave, I pack my suitcase."}
  nl.a2.unit93.lesson06.teach.lotte_bel: {"title": "Lotte asks for a call", "gloss": "Lotte: Will you call me after you have arrived?"}
  nl.a2.unit93.lesson06.teach.omar_ja: {"title": "Omar agrees", "gloss": "Omar: Yes, after I have arrived, I call you."}
  nl.a2.unit93.lesson06.teach.lotte_te_laat: {"title": "Lotte asks about a delay", "gloss": "Lotte: What do you do if the train is late?"}
  nl.a2.unit93.lesson06.teach.omar_koffie: {"title": "Omar answers", "gloss": "Omar: If the train is late, I drink coffee."}
exercises:
  nl.a2.unit93.lesson01.exercise01.kies_werk: {"instruction": "Choose the Dutch for 'Before I go to work, I have breakfast.'", "correct_option": "Voordat ik naar mijn werk ga, ontbijt ik.", "distractors": ["Voordat ik naar mijn werk ga, ik ontbijt.", "Voordat ik ga naar mijn werk, ontbijt ik.", "Voordat ik ontbijt, ga ik naar mijn werk."], "accepted_answers": [{"value": "Voordat ik naar mijn werk ga, ontbijt ik.", "status": "correct"}], "feedback": "After the opening *voordat*-clause, the main clause starts with the verb: *ontbijt ik*. The last option puts the events in the opposite order."}
  nl.a2.unit93.lesson01.exercise02.kies_douche: {"instruction": "Choose the correct Dutch for 'Before I have breakfast, I shower.'", "correct_option": "Voordat ik ontbijt, douche ik.", "distractors": ["Voordat ik ontbijt, ik douche.", "Voordat ontbijt ik, douche ik.", "Voordat ik douche, ontbijt ik."], "accepted_answers": [{"value": "Voordat ik ontbijt, douche ik.", "status": "correct"}], "feedback": "*Voordat ik ontbijt, douche ik* = Before I have breakfast, I shower. The last option reverses the order of the events."}
  nl.a2.unit93.lesson01.exercise03.match_voordat: {"instruction": "Match each Dutch voordat-clause to its English meaning.", "accepted_answers": [{"value": [{"left": "voordat ik ontbijt", "right": "before I have breakfast"}, {"left": "voordat ik naar mijn werk ga", "right": "before I go to work"}, {"left": "voordat ik kook", "right": "before I cook"}, {"left": "voordat ik naar bed ga", "right": "before I go to bed"}, {"left": "voordat ik naar huis ga", "right": "before I go home"}, {"left": "voordat ik Lotte bel", "right": "before I call Lotte"}], "status": "correct"}], "feedback": "The verb is at the end of every voordat-clause."}
  nl.a2.unit93.lesson01.exercise04.order_douche: {"instruction": "Put the words in order to say 'Before I have breakfast, I shower.'", "correct_option": "Voordat ik ontbijt douche ik", "accepted_answers": [{"value": "Voordat ik ontbijt douche ik", "status": "correct"}, {"value": "Ik douche voordat ik ontbijt", "status": "correct"}], "feedback": "*Voordat ik ontbijt, douche ik.* You can also put the main clause first: *Ik douche, voordat ik ontbijt.* Then there is no inversion."}
  nl.a2.unit93.lesson01.exercise05.fill_ga: {"instruction": "Complete with the verb gaan (ik).", "correct_option": "ga", "accepted_answers": [{"value": "ga", "status": "correct"}], "feedback": "The verb is at the end: *ik naar mijn werk ga*."}
  nl.a2.unit93.lesson01.exercise06.tr_winkel: {"instruction": "Translate into Dutch.", "accepted_answers": [{"value": "Voordat ik kook, ga ik naar de winkel.", "status": "correct"}, {"value": "Voordat ik kook, ga ik naar de winkel", "status": "correct"}, {"value": "Voordat ik kook ga ik naar de winkel", "status": "correct"}, {"value": "Ik ga naar de winkel, voordat ik kook.", "status": "correct"}, {"value": "Ik ga naar de winkel, voordat ik kook", "status": "correct"}, {"value": "Ik ga naar de winkel voordat ik kook", "status": "correct"}], "feedback": "*Voordat ik kook, ga ik naar de winkel.* The main clause can also come first, without inversion."}
  nl.a2.unit93.lesson01.exercise07.write_thee: {"instruction": "Write the requested Dutch sentence with voordat.", "accepted_answers": [{"value": "Voordat ik naar bed ga, drink ik thee.", "status": "correct"}, {"value": "Voordat ik naar bed ga, drink ik thee", "status": "correct"}, {"value": "Voordat ik naar bed ga drink ik thee", "status": "correct"}, {"value": "Ik drink thee, voordat ik naar bed ga.", "status": "correct"}, {"value": "Ik drink thee, voordat ik naar bed ga", "status": "correct"}, {"value": "Ik drink thee voordat ik naar bed ga", "status": "correct"}], "feedback": "*Voordat ik naar bed ga, drink ik thee.*", "correct_option": "Voordat ik naar bed ga, drink ik thee."}
  nl.a2.unit93.lesson02.exercise01.kies_ruim_op: {"instruction": "Choose the correct Dutch for 'After I have eaten, I clean up.'", "correct_option": "Nadat ik gegeten heb, ruim ik op.", "distractors": ["Nadat ik gegeten heb, ik ruim op.", "Nadat ik gegeten, heb ik ruim op.", "Nadat ik opgeruimd heb, eet ik."], "accepted_answers": [{"value": "Nadat ik gegeten heb, ruim ik op.", "status": "correct"}], "feedback": "Both verbs go to the end of the nadat-clause, and the main clause starts with *ruim ik op*. The last option reverses the events."}
  nl.a2.unit93.lesson02.exercise02.kies_aangekomen: {"instruction": "Choose the correct Dutch for 'After I have arrived, I call Lotte.'", "correct_option": "Nadat ik aangekomen ben, bel ik Lotte.", "distractors": ["Nadat ik aangekomen heb, bel ik Lotte.", "Nadat ik aangekomen ben, ik bel Lotte.", "Nadat ik ben aankomen, bel ik Lotte."], "accepted_answers": [{"value": "Nadat ik aangekomen ben, bel ik Lotte.", "status": "correct"}], "feedback": "*Aankomen* uses *ben*: *aangekomen ben*, then inversion in the main clause: *bel ik Lotte*."}
  nl.a2.unit93.lesson02.exercise03.match_deelwoord: {"instruction": "Match each infinitive to its past participle.", "accepted_answers": [{"value": [{"left": "eten", "right": "gegeten"}, {"left": "koken", "right": "gekookt"}, {"left": "douchen", "right": "gedoucht"}, {"left": "bellen", "right": "gebeld"}, {"left": "werken", "right": "gewerkt"}, {"left": "opruimen", "right": "opgeruimd"}], "status": "correct"}], "feedback": "Six participles you need for nadat-clauses."}
  nl.a2.unit93.lesson02.exercise04.order_nadat: {"instruction": "Put the words in order to say 'After I have eaten, I clean up.'", "correct_option": "Nadat ik gegeten heb ruim ik op", "accepted_answers": [{"value": "Nadat ik gegeten heb ruim ik op", "status": "correct"}, {"value": "Nadat ik heb gegeten ruim ik op", "status": "correct"}, {"value": "Ik ruim op nadat ik gegeten heb", "status": "correct"}, {"value": "Ik ruim op nadat ik heb gegeten", "status": "correct"}], "feedback": "*Nadat ik gegeten heb, ruim ik op.* Both *gegeten heb* and *heb gegeten* are accepted."}
  nl.a2.unit93.lesson02.exercise05.fill_heb: {"instruction": "Complete with the correct form of hebben (ik).", "correct_option": "heb", "accepted_answers": [{"value": "heb", "status": "correct"}], "feedback": "*Heb* stands at the end of the nadat-clause."}
  nl.a2.unit93.lesson02.exercise06.tr_gebeld: {"instruction": "Translate into Dutch.", "accepted_answers": [{"value": "Nadat ik Lotte gebeld heb, kook ik.", "status": "correct"}, {"value": "Nadat ik Lotte gebeld heb, kook ik", "status": "correct"}, {"value": "Nadat ik Lotte gebeld heb kook ik", "status": "correct"}, {"value": "Nadat ik Lotte heb gebeld, kook ik.", "status": "correct"}, {"value": "Nadat ik Lotte heb gebeld, kook ik", "status": "correct"}, {"value": "Nadat ik Lotte heb gebeld kook ik", "status": "correct"}, {"value": "Ik kook, nadat ik Lotte gebeld heb.", "status": "correct"}, {"value": "Ik kook, nadat ik Lotte gebeld heb", "status": "correct"}, {"value": "Ik kook nadat ik Lotte gebeld heb", "status": "correct"}, {"value": "Ik kook, nadat ik Lotte heb gebeld.", "status": "correct"}, {"value": "Ik kook, nadat ik Lotte heb gebeld", "status": "correct"}, {"value": "Ik kook nadat ik Lotte heb gebeld", "status": "correct"}], "feedback": "*Nadat ik Lotte gebeld heb, kook ik.*"}
  nl.a2.unit93.lesson02.exercise07.write_gedoucht: {"instruction": "Write the requested Dutch sentence with nadat and the perfectum.", "accepted_answers": [{"value": "Nadat ik gedoucht heb, ontbijt ik.", "status": "correct"}, {"value": "Nadat ik gedoucht heb, ontbijt ik", "status": "correct"}, {"value": "Nadat ik gedoucht heb ontbijt ik", "status": "correct"}, {"value": "Nadat ik heb gedoucht, ontbijt ik.", "status": "correct"}, {"value": "Nadat ik heb gedoucht, ontbijt ik", "status": "correct"}, {"value": "Nadat ik heb gedoucht ontbijt ik", "status": "correct"}, {"value": "Ik ontbijt, nadat ik gedoucht heb.", "status": "correct"}, {"value": "Ik ontbijt, nadat ik gedoucht heb", "status": "correct"}, {"value": "Ik ontbijt nadat ik gedoucht heb", "status": "correct"}, {"value": "Ik ontbijt, nadat ik heb gedoucht.", "status": "correct"}, {"value": "Ik ontbijt, nadat ik heb gedoucht", "status": "correct"}, {"value": "Ik ontbijt nadat ik heb gedoucht", "status": "correct"}], "feedback": "*Nadat ik gedoucht heb, ontbijt ik.*", "correct_option": "Nadat ik gedoucht heb, ontbijt ik."}
  nl.a2.unit93.lesson03.exercise01.kies_nadat_reis: {"instruction": "Choose the Dutch with nadat for 'First I pack my suitcase, and then I leave.'", "correct_option": "Nadat ik mijn koffer ingepakt heb, vertrek ik.", "distractors": ["Nadat ik mijn koffer ingepakt heb, ik vertrek.", "Nadat ik vertrokken ben, pak ik mijn koffer in.", "Voordat ik mijn koffer ingepakt heb, vertrek ik."], "accepted_answers": [{"value": "Nadat ik mijn koffer ingepakt heb, vertrek ik.", "status": "correct"}], "feedback": "First packing, then leaving: *Nadat ik mijn koffer ingepakt heb, vertrek ik.* The second option puts leaving first."}
  nl.a2.unit93.lesson03.exercise02.match_voor_na: {"instruction": "Match each Dutch clause to its English meaning.", "accepted_answers": [{"value": [{"left": "voordat de trein vertrekt", "right": "before the train leaves"}, {"left": "nadat de trein vertrokken is", "right": "after the train has left"}, {"left": "voordat ik vertrek", "right": "before I leave"}, {"left": "nadat ik vertrokken ben", "right": "after I have left"}, {"left": "voordat ik een kaartje koop", "right": "before I buy a ticket"}, {"left": "nadat ik een kaartje gekocht heb", "right": "after I have bought a ticket"}], "status": "correct"}], "feedback": "Voordat-clauses use the simple present; nadat-clauses use the perfectum."}
  nl.a2.unit93.lesson03.exercise03.order_voordat_reis: {"instruction": "Put the words in order to say 'Before I leave, I pack my suitcase.'", "correct_option": "Voordat ik vertrek pak ik mijn koffer in", "accepted_answers": [{"value": "Voordat ik vertrek pak ik mijn koffer in", "status": "correct"}, {"value": "Ik pak mijn koffer in voordat ik vertrek", "status": "correct"}], "feedback": "*Voordat ik vertrek, pak ik mijn koffer in.* Main clause first is also correct, without inversion."}
  nl.a2.unit93.lesson03.exercise04.fill_kies: {"instruction": "Fill in the correct conjunction so that the sentence matches: first I pack my suitcase, then I leave.", "correct_option": "Nadat", "accepted_answers": [{"value": "Nadat", "status": "correct"}, {"value": "nadat", "status": "correct"}], "feedback": "Packing comes first, so *nadat* with the perfectum."}
  nl.a2.unit93.lesson03.exercise05.fill_had: {"instruction": "Complete with the imperfectum of hebben (a story about the past).", "correct_option": "had", "accepted_answers": [{"value": "had", "status": "correct"}], "feedback": "*Had* stands at the end of the nadat-clause in a story about the past."}
  nl.a2.unit93.lesson03.exercise06.tr_trein_weg: {"instruction": "Translate into Dutch.", "accepted_answers": [{"value": "Nadat de trein vertrokken is, bel ik Lotte.", "status": "correct"}, {"value": "Nadat de trein vertrokken is, bel ik Lotte", "status": "correct"}, {"value": "Nadat de trein vertrokken is bel ik Lotte", "status": "correct"}, {"value": "Nadat de trein is vertrokken, bel ik Lotte.", "status": "correct"}, {"value": "Nadat de trein is vertrokken, bel ik Lotte", "status": "correct"}, {"value": "Nadat de trein is vertrokken bel ik Lotte", "status": "correct"}, {"value": "Ik bel Lotte, nadat de trein vertrokken is.", "status": "correct"}, {"value": "Ik bel Lotte, nadat de trein vertrokken is", "status": "correct"}, {"value": "Ik bel Lotte nadat de trein vertrokken is", "status": "correct"}, {"value": "Ik bel Lotte, nadat de trein is vertrokken.", "status": "correct"}, {"value": "Ik bel Lotte, nadat de trein is vertrokken", "status": "correct"}, {"value": "Ik bel Lotte nadat de trein is vertrokken", "status": "correct"}], "feedback": "*Vertrekken* takes *zijn*: *vertrokken is*."}
  nl.a2.unit93.lesson03.exercise07.write_kaartje: {"instruction": "Write the requested Dutch sentence with voordat.", "accepted_answers": [{"value": "Voordat ik een kaartje koop, ga ik naar het station.", "status": "correct"}, {"value": "Voordat ik een kaartje koop, ga ik naar het station", "status": "correct"}, {"value": "Voordat ik een kaartje koop ga ik naar het station", "status": "correct"}, {"value": "Ik ga naar het station, voordat ik een kaartje koop.", "status": "correct"}, {"value": "Ik ga naar het station, voordat ik een kaartje koop", "status": "correct"}, {"value": "Ik ga naar het station voordat ik een kaartje koop", "status": "correct"}], "feedback": "*Voordat ik een kaartje koop, ga ik naar het station.*", "correct_option": "Voordat ik een kaartje koop, ga ik naar het station."}
