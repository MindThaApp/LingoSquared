course:
  title: Dutch A2
  description: Grammar-led A2 Dutch for describing things.
  learning_goal: Describe an object precisely with size, colour, material and owner, using the correct adjective ending.
units:
  nl.a2.unit100.een_mooie_rode_jas:
    title: A beautiful red jacket
    description: "Describe objects with adjectives: when the adjective takes -e and when it does not."
lessons:
  nl.a2.unit100.lesson01.kleren_en_kleuren:
    title: Clothes, colours and things
  nl.a2.unit100.lesson02.de_rode_jas_het_rode_huis:
    title: The red jacket, the red house
  nl.a2.unit100.lesson03.een_rood_huis_een_rode_jas:
    title: A red house, a red jacket
  nl.a2.unit100.lesson04.groot_oud_van_hout:
