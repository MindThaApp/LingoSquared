teaching:
  nl.a2.unit100.lesson01.teach.kleding:
    title: Clothing
    gloss: the jacket / the sweater / the trousers / the scarf / the dress / the shoe
    note: Clothing words from A1 return here. All of them are *de*-words. The plural of *schoen* is *schoenen*.
    example_gloss:
    - I have a jacket.
    - The sweater is blue.
    - The trousers are long.
    - The shoes are black.
  nl.a2.unit100.lesson01.teach.kleuren:
    title: Colours
    gloss: red / blue / green / yellow / black / white
    note: Colour words are adjectives. You will learn when they get an ending in this unit.
    example_gloss:
    - The jacket is red.
    - The bag is black.
    - The paper is white.
  nl.a2.unit100.lesson01.teach.grootte:
    title: Size
    gloss: big / small / long / short
    example_gloss:
    - The house is big.
    - The key is small.
    - The scarf is long.
    - The dress is short.
  nl.a2.unit100.lesson01.teach.huis:
    title: At home
    gloss: the table / the chair / the lamp / the bed / the house / the book / the paper
    note: "Learn each noun with *de* or *het*. From now on this matters for adjectives: *bed, huis, boek* and *papier* are *het*-words."
    example_gloss:
    - The table is big.
    - The bed is small.
    - The book is blue.
    - The lamp is yellow.
  nl.a2.unit100.lesson01.teach.kwijt:
    title: Lost property
    gloss: the bag / the key / the umbrella / the purse / lost
    note: "*Kwijt zijn* means to have lost something and not know where it is."
    example_gloss:
    - I have lost my bag.
    - The key is small.
    - The umbrella is green.
    - The purse is red.
  nl.a2.unit100.lesson01.teach.gn_na_zijn:
    title: No ending after zijn
    gloss: The jacket is red. The house is big. The jackets are red.
    note: "After *zijn* the adjective stays as it is, without *-e*: *de jas is rood, het huis is groot, de jassen zijn rood*. The *-e* only appears when the adjective stands before the noun."
  nl.a2.unit100.lesson02.teach.eigenschappen:
    title: More adjectives
    gloss: beautiful / old / new / warm / soft
    example_gloss:
    - The lamp is beautiful.
    - The house is old.
    - The sweater is new.
    - The scarf is warm.
    - The bed is soft.
  nl.a2.unit100.lesson02.teach.gn_bepaald:
    title: "With de or het: always -e"
    gloss: the red jacket, the big bag, the blue sweater; the red house, the big bed, the white paper
    note: "After *de* or *het* the adjective before the noun always ends in *-e*, for *de*-words and *het*-words alike: *de rode jas* and *het rode huis*."
  nl.a2.unit100.lesson02.teach.gn_spelling:
    title: Spelling changes
    gloss: "red, big, white, yellow: how they are spelled before a noun"
    note: "Adding *-e* can change the spelling. A long vowel written double loses one letter: *rood → rode, groot → grote, geel → gele*. A short vowel before one final consonant doubles that consonant: *wit → witte*."
  nl.a2.unit100.lesson02.teach.gn_regelmatig:
    title: Most adjectives just add -e
    gloss: blue, black, green, new, old, beautiful, small, long, short, warm, soft
    note: Most adjectives simply add *-e* without any spelling change.
  nl.a2.unit100.lesson02.teach.zinnen:
    title: Three sentences
    gloss: The red jacket is beautiful. The white paper is new. The green chair is old.
    note: "The adjective before the noun takes *-e*; after *is* it stays plain: *de jas is mooi*."
  nl.a2.unit100.lesson03.teach.hebben:
    title: Having things
    gloss: I have a big bed. She has a big bag. She has red shoes. He has a blue book.
    note: "*Zij* and *ze* both mean 'she'. Look at the endings: *groot bed* but *grote tas*."
  nl.a2.unit100.lesson03.teach.gn_een:
    title: With een
    gloss: a red jacket, a big bag; a red house, a big bed
    note: After *een*, a *de*-word keeps *-e* (*een rode jas*), but a *het*-word gets no ending (*een rood huis*). So *het rode huis* but *een rood huis*.
  nl.a2.unit100.lesson03.teach.gn_zonder:
    title: Without an article
    gloss: white paper, red paper; red jackets, red houses, big bags
    note: A singular *het*-word with no article has no ending (*wit papier*). A plural always has *-e* (*rode jassen, rode huizen*), whatever the noun.
  nl.a2.unit100.lesson03.teach.gn_contrast:
    title: "Het-word or de-word?"
    gloss: the red house → a red house; the red jacket → a red jacket
    note: "Before a noun, only one case has no *-e*: a singular *het*-word with *een* or no article. Everything else ends in *-e*."
  nl.a2.unit100.lesson04.teach.materiaal:
    title: Material
    gloss: made of wood / made of wool / made of cotton / made of leather
    note: To say what something is made of, use *van* plus the material.
    example_gloss:
    - The table is made of wood.
    - The sweater is made of wool.
    - The bag is made of leather.
    - The trousers are made of cotton.
  nl.a2.unit100.lesson04.teach.bezit:
    title: Owner
    gloss: my / your / his / her
    note: "*Je* and *jouw* both mean 'your' for one friend."
    example_gloss:
    - My old table is made of wood.
    - Your new jacket is made of wool.
    - His small book is new.
    - Her big bag is black.
  nl.a2.unit100.lesson04.teach.gn_bezit:
    title: Owner words act like de or het
    gloss: my red house, her big bag, his old book, your new jacket
    note: "After *mijn, jouw, je, zijn* and *haar* the adjective ends in *-e*, also for *het*-words: *mijn rode huis*, *zijn oude boek*."
  nl.a2.unit100.lesson04.teach.gn_volgorde:
    title: Size, colour, material
    gloss: a big red bag of leather; the small white house
    note: "Several adjectives each get the same ending. Size comes before colour: *een grote rode tas*. The material follows the noun with *van*: *een tas van leer*."
  nl.a2.unit100.lesson04.teach.zinnen:
    title: Two sentences
    gloss: Omar has a big black bag of leather. His sweater is made of wool.
  nl.a2.unit100.lesson05.teach.bericht:
    title: Noor lost her bag
    gloss: "Hi Lotte, I have lost my bag! It is a small black leather bag. In the bag there is a red purse and a key. The key is for my house. My long yellow woollen scarf is also gone. My umbrella is green and new. Can you help me? Greetings, Noor"
    note: "Look at the endings: *kleine zwarte tas*, but *paraplu is groen*."
    glosses:
      weg: gone
      helpen: to help
      mij: me
      Groetjes: greetings
      zit: is (in)
      Ook: also
  nl.a2.unit100.lesson06.teach.vraag:
    title: Omar asks what is wrong
    gloss: "Omar: Lotte, what is the matter?"
  nl.a2.unit100.lesson06.teach.jas_kwijt:
    title: Lotte says she has lost her jacket
    gloss: "Lotte: I have lost my jacket."
  nl.a2.unit100.lesson06.teach.wat_voor:
    title: Omar asks what kind of jacket
    gloss: "Omar: What kind of jacket is it?"
  nl.a2.unit100.lesson06.teach.beschrijving:
    title: Lotte describes the jacket
    gloss: "Lotte: A long green woollen jacket."
  nl.a2.unit100.lesson06.teach.oud_of_nieuw:
    title: Omar asks whether it is old or new
    gloss: "Omar: Is it your old jacket or your new jacket?"
  nl.a2.unit100.lesson06.teach.nieuwe_jas:
    title: Lotte says it is the new one
    gloss: "Lotte: My new jacket. It is green and very beautiful."
