course: {title: Dutch A2, description: Grammar-led A2 Dutch for asking for information politely., learning_goal: 'Ask polite indirect questions with waar, wanneer, hoe laat, wie, wat and of, with the verb at the end of the embedded clause.'}
units:
  nl.a2.unit96.weet_u_waar: {title: 'Do you know where ...?', description: 'Ask politely for information at stations, offices and museums with embedded questions.'}
lessons:
  nl.a2.unit96.lesson01.weet_u_waar: {title: 'Do you know where the station is?'}
  nl.a2.unit96.lesson02.wanneer_en_hoe_laat: {title: When and what time}
  nl.a2.unit96.lesson03.weet_u_of: {title: 'Do you know whether it is open?'}
  nl.a2.unit96.lesson04.kunt_u_mij_zeggen: {title: 'Could you tell me ...?'}
  nl.a2.unit96.lesson05.omars_bericht: {title: Omar's message}
  nl.a2.unit96.lesson06.lotte_en_omar: {title: Lotte and Omar at the museum}
teaching:
  nl.a2.unit96.lesson01.teach.plaatsen:
    title: Places
    gloss: the station / the office / the museum / the library / the counter / the exit
    note: These are places you often ask about.
    example_gloss: ['Where is the station?', 'Where is the exit?']
  nl.a2.unit96.lesson01.teach.weten:
    title: Know and where
    gloss: to know / where / you (formal) / you (informal) / you (informal, stressed)
    note: '*Weet* is the form after u, je and jij.'
    example_gloss: ['Do you know? (formal)', 'Do you know? (informal)', 'Do you know? (informal)']
  nl.a2.unit96.lesson01.teach.open:
    title: Open and closed
    gloss: open / closed
    example_gloss: [The museum is open., The office is closed.]
  nl.a2.unit96.lesson01.teach.gn_indirect: {title: From direct to indirect, gloss: A direct question and the same question asked indirectly., note: 'In a direct question the verb is second: *Waar IS het station?* After *Weet u ...* the question becomes an embedded clause, so the verb goes to the end of that clause: *Weet u waar het station IS?*'}
  nl.a2.unit96.lesson01.teach.gn_u_je: {title: U or je, gloss: Formal and informal ways to ask the same thing., note: 'Use *u* with strangers and in offices, *je* or *jij* with friends. The verb form *weet* stays the same. Lotte and Omar use *je*.'}
  nl.a2.unit96.lesson01.teach.zinnen: {title: Two questions, gloss: 'Do you know where the museum is? Do you know where the library is?'}
  nl.a2.unit96.lesson02.teach.vraagwoorden:
    title: Question words
    gloss: when / what time / who / what
    note: These question words work like *waar* in an embedded question.
    example_gloss: ['When is the museum open?', 'What time is it?', 'Who is that? That is Lotte.', 'What is that? That is a museum.']
  nl.a2.unit96.lesson02.teach.werkwoorden:
    title: Useful verbs
    gloss: to open / to close / to leave / to cost
    example_gloss: [The museum opens at ten o'clock., The office closes at five o'clock., The train leaves at nine o'clock., The ticket costs ten euros.]
  nl.a2.unit96.lesson02.teach.tijd:
    title: Train and time
    gloss: the train / the ticket / the hour / tomorrow / today / ten / five / nine
    example_gloss: ['What does the ticket cost? It costs ten euros.', 'When does the train leave? Tomorrow.', That is Noor., The office is near the station.]
  nl.a2.unit96.lesson02.teach.gn_wanneer: {title: Wanneer and hoe laat, gloss: Embedded questions with wanneer and hoe laat., note: 'The question word stays in front, the verb goes last: *wanneer het museum opent*, *hoe laat de trein vertrekt*. Use *wanneer* for a day or moment, *hoe laat* for the clock time.'}
  nl.a2.unit96.lesson02.teach.gn_wie_wat: {title: Wie and wat, gloss: Embedded questions with wie and wat., note: '*Wie* and *wat* follow the same pattern. The verb is last: *wie dat is*, *wat het kaartje kost*.'}
  nl.a2.unit96.lesson02.teach.zinnen: {title: Two questions, gloss: 'Do you know what time the office closes? Do you know when the museum opens?'}
  nl.a2.unit96.lesson03.teach.of:
    title: Of, ja, nee
    gloss: whether / yes / no / not
    example_gloss: ['Is the museum open? Yes.', 'Is the office open? No.']
  nl.a2.unit96.lesson03.teach.gn_of: {title: 'Yes/no questions: of', gloss: A yes/no question asked indirectly with of., note: 'A yes/no question has no question word, so the embedded question starts with *of* (whether). The verb goes to the end: *of de bibliotheek open IS*.'}
  nl.a2.unit96.lesson03.teach.gn_contrast: {title: 'Waar or of?', gloss: Compare a wh-question and a yes/no question., note: 'Keep the question word (*waar, wanneer, hoe laat, wie, wat*) when there is one. If the question can be answered with *ja* or *nee*, use *of*. Never use both.'}
  nl.a2.unit96.lesson03.teach.gn_weet_niet: {title: Ik weet niet ..., gloss: Saying you do not know., note: 'After *Ik weet niet* the same embedded clause follows, with the verb last. For a short answer, say *Ik weet het niet.*'}
  nl.a2.unit96.lesson03.teach.zinnen: {title: Two answers, gloss: I do not know. I do not know whether the office is open.}
  nl.a2.unit96.lesson04.teach.richting:
    title: Directions
    gloss: straight on / left / right / how / come / at, to
    note: '*Hoe kom ik bij ...?* asks the way.'
    example_gloss: [The station is straight on., The exit is on the left., The office is on the right., 'How do I get to the station?']
  nl.a2.unit96.lesson04.teach.beleefd:
    title: Polite words
    gloss: excuse me / can (with u, or jij kunt) / can (kun je) / me / me (unstressed) / to say, tell / want / gladly (would like to) / to know
    note: '*Mij* and *me* both mean ''me''. With u the form is *kunt*: *Kunt u ...?* With je the usual form is *kun*: *Kun je ...?* (After jij you also hear *kunt*: *jij kunt*.)'
    example_gloss: ['Excuse me, where is the counter?', I would like to know where the counter is.]
  nl.a2.unit96.lesson04.teach.uitje:
    title: An outing
    gloss: we / to go / to
    example_gloss: [Tomorrow we are going to the museum., 'Do you know when we are going to the museum?']
  nl.a2.unit96.lesson04.teach.gn_kunt_u: {title: 'Kunt u mij zeggen ...?', gloss: A polite way to ask for information., note: 'In this question the verb comes first: *Kunt u* / *Kun je*. Then *mij zeggen* and the embedded question with its verb last. With je the usual form is *kun je*.'}
  nl.a2.unit96.lesson04.teach.gn_wil_weten: {title: Ik wil graag weten ..., gloss: A polite statement instead of a question., note: '*Ik wil graag weten* is a polite statement that asks for information. The embedded question follows with the verb last.'}
  nl.a2.unit96.lesson04.teach.gn_hoe_kom: {title: Hoe ik ... kom, gloss: Asking the way indirectly., note: '*Hoe kom ik bij het station?* becomes *hoe ik bij het station kom*: the verb *kom* moves behind *bij het station*, to the end.'}
  nl.a2.unit96.lesson04.teach.zinnen: {title: At the station, gloss: 'Excuse me, could you tell me where the counter is? I would like to know what time the train leaves.'}
  nl.a2.unit96.lesson05.teach.reading:
    title: Omar's message to Lotte
    gloss: Hi Lotte, tomorrow we are going to the museum. I do not know where the museum is. Do you know how I get to the station? I would like to know what time the train leaves. Do you also know whether the museum is open? Regards, Omar
    note: Notice how Omar uses three different openers for his questions.
    glosses: {Hoi: hi, Groeten: regards, ook: also}
  nl.a2.unit96.lesson06.teach.omar_vraagt_waar: {title: Omar speaks, gloss: 'Hi Lotte, do you know where the museum is?'}
  nl.a2.unit96.lesson06.teach.lotte_wijst: {title: Lotte speaks, gloss: 'Yes, go straight on and then left.'}
  nl.a2.unit96.lesson06.teach.omar_vraagt_tijd: {title: Omar speaks, gloss: 'Do you also know what time it opens?'}
  nl.a2.unit96.lesson06.teach.lotte_tijd: {title: Lotte speaks, gloss: It opens at ten o'clock.}
  nl.a2.unit96.lesson06.teach.omar_vraagt_open: {title: Omar speaks, gloss: 'Do you also know whether the museum is open today?'}
  nl.a2.unit96.lesson06.teach.lotte_weet_niet: {title: Lotte speaks, gloss: I do not know whether it is open today.}
exercises:
  nl.a2.unit96.lesson01.exercise01.kies_station:
    instruction: Choose the correct Dutch sentence.
    correct_option: Weet u waar het station is?
    distractors: ['Weet u waar is het station?', 'Weet u het station waar is?', 'Weet u waar het is station?']
    accepted_answers:
    - {value: 'Weet u waar het station is?', status: correct}
    feedback: In an embedded question the verb *is* goes to the end.
  nl.a2.unit96.lesson01.exercise02.kies_bibliotheek:
    instruction: Choose the correct indirect version, to a friend.
    correct_option: Weet je waar de bibliotheek is?
    distractors: ['Weet je waar is de bibliotheek?', 'Weet je de bibliotheek waar is?', 'Weet je waar de is bibliotheek?']
    accepted_answers:
    - {value: 'Weet je waar de bibliotheek is?', status: correct}
    feedback: '*Waar de bibliotheek is*: the verb moves to the end.'
  nl.a2.unit96.lesson01.exercise03.koppel_vragen:
    instruction: Match each direct question to its indirect version.
    accepted_answers:
    - value:
      - {left: 'Waar is het station?', right: 'Weet u waar het station is?'}
      - {left: 'Waar is het kantoor?', right: 'Weet u waar het kantoor is?'}
      - {left: 'Waar is het museum?', right: 'Weet je waar het museum is?'}
      - {left: 'Waar is de bibliotheek?', right: 'Weet je waar de bibliotheek is?'}
      - {left: 'Waar is het loket?', right: 'Weet u waar het loket is?'}
      - {left: 'Waar is de uitgang?', right: 'Weet je waar de uitgang is?'}
      status: correct
    feedback: Each indirect question keeps the place and moves the verb to the end.
