  nl.b1.unit02.lesson06.wrapup_production:
    title: "Review"

teaching:
  nl.b1.unit02.lesson01.teach.ik:
    title: I
    gloss: I
    example_gloss: "I eat less meat."
  nl.b1.unit02.lesson01.teach.hoewel:
    title: although
    gloss: although
    note: "*Hoewel* opens a full subordinate clause (verb pushed to the end: *...vlees lekker IS*), then the main clause that follows inverts verb and subject (*eet IK*, not *ik eet*) -- the same V2 rule that applies whenever any clause, not just the subject, opens a Dutch sentence."
    example_gloss: "Although meat is tasty, I eat less meat."
  nl.b1.unit02.lesson01.teach.lekker:
    title: "tasty / nice"
    gloss: "tasty / nice"
    example_gloss: "Meat is tasty."
  nl.b1.unit02.lesson01.teach.vlees:
    title: meat
    gloss: meat
    example_gloss: "I eat less meat."
  nl.b1.unit02.lesson01.teach.minder:
    title: less
    gloss: less
    example_gloss: "I eat less meat."
  nl.b1.unit02.lesson01.teach.eet:
    title: eat
    gloss: eat
    example_gloss: "I eat less meat."
  nl.b1.unit02.lesson01.teach.is:
    title: is
    gloss: is
    example_gloss: "Meat is tasty."
  nl.b1.unit02.lesson01.teach.grammar_hoewel:
    title: "Although meat is tasty, I eat less meat."
    gloss: "Although meat is tasty, I eat less meat."
    note: "The concession-clause pattern: *hoewel* + clause (verb-final) + comma + main clause (verb-subject inverted). This is Dutch's standard way to concede a point before stating your real position -- the genuine B1 step up from A2's simpler opinion-plus-reason pattern."

  nl.b1.unit02.lesson02.teach.ondanks:
    title: despite
    gloss: despite
    note: "*Ondanks* can be followed by *dat* + a full clause (this lesson) or, more concisely, by a bare noun phrase with no *dat* at all (*ondanks het werk*, 'despite the work') -- unlike *hoewel*, which always needs a full clause. Don't treat the two as fully interchangeable: *hoewel* clause-only, *ondanks* either shape."
    example_gloss: "Despite meat being tasty, I eat less meat."
  nl.b1.unit02.lesson02.teach.dat:
    title: that
    gloss: that
    note: "Here *dat* is the subordinating conjunction 'that' (as in 'despite THAT...'), a different word from the demonstrative *dat* ('that/it') taught in unit01 -- same spelling, different grammatical job, very common in Dutch."
    example_gloss: "Despite the fact that meat is tasty, I eat less meat."
  nl.b1.unit02.lesson02.teach.het:
    title: "it / the"
    gloss: "it / the"
    example_gloss: "It is healthy."
  nl.b1.unit02.lesson02.teach.gezond:
    title: healthy
    gloss: healthy
    example_gloss: "Eating less meat is healthy."
  nl.b1.unit02.lesson02.teach.beter:
    title: better
    gloss: better
    example_gloss: "It is better for the environment."
  nl.b1.unit02.lesson02.teach.voor:
    title: for
    gloss: for
    example_gloss: "It is better for the environment."
  nl.b1.unit02.lesson02.teach.het_milieu:
    title: "the environment"
    gloss: "the environment"
    example_gloss: "It is better for the environment."
  nl.b1.unit02.lesson02.teach.grammar_ondanks_dat:
    title: "Despite the fact that meat is tasty, I eat less meat. It is better for the environment."
    gloss: "Despite the fact that meat is tasty, I eat less meat. It is better for the environment."
    note: "*Ondanks dat* + clause works exactly like *hoewel* + clause -- both are genuine concession subordinators, largely interchangeable when *ondanks* is followed by *dat*. *Ondanks dat* leans slightly more formal/written than *hoewel* in everyday speech, but both are correct and common."

  nl.b1.unit02.lesson03.teach.toch:
    title: "still / nevertheless"
    gloss: "still / nevertheless"
    note: "*Toch* is a stronger, more deliberate contrast than a plain *maar* ('but') -- it signals 'despite what was just said, this is still true.' Opening a sentence with *toch* triggers V2 inversion: *Toch EET ik...*, verb before subject."
    example_gloss: "Meat is tasty. Nevertheless, I eat less meat."
  nl.b1.unit02.lesson03.teach.echter:
    title: however
    gloss: however
    note: "*Echter* is a more written-register 'however,' often placed after the first word or phrase of its clause rather than right at the start (*Het is ECHTER niet altijd gezond*, literally 'it is however not always healthy') -- a real difference from English 'however,' which usually opens its clause."
    example_gloss: "Meat is tasty. However, it is not always healthy."
  nl.b1.unit02.lesson03.teach.niet:
    title: not
    gloss: not
    example_gloss: "It is not always healthy."
  nl.b1.unit02.lesson03.teach.altijd:
    title: always
    gloss: always
    example_gloss: "It is not always healthy."
  nl.b1.unit02.lesson03.teach.denk:
    title: think
    gloss: think
    example_gloss: "I think that it is better."
  nl.b1.unit02.lesson03.teach.sommige_mensen:
    title: "some people"
    gloss: "some people"
    example_gloss: "Some people eat no meat."
  nl.b1.unit02.lesson03.teach.geen:
    title: "no / none"
    gloss: "no / none"
    example_gloss: "Some people eat no meat."
  nl.b1.unit02.lesson03.teach.grammar_toch_echter:
    title: "Meat is tasty. Nevertheless, I eat less meat. However, it is not always healthy."
    gloss: "Meat is tasty. Nevertheless, I eat less meat. However, it is not always healthy."
    note: "*Toch* and *echter* are both stronger than *maar*, but placed differently: *toch* naturally opens its own clause (with inversion), while *echter* more often sits after the clause's first element. Both mark a genuine, deliberate contrast rather than a casual 'but'."

  nl.b1.unit02.lesson04.teach.eens_zijn:
    title: "to agree"
    gloss: "to agree"
    example_gloss: "I agree with that."
  nl.b1.unit02.lesson04.teach.makkelijk:
    title: easy
    gloss: easy
    example_gloss: "It is not always easy."
  nl.b1.unit02.lesson04.teach.elke_kleine_stap:
    title: "every little step"
    gloss: "every little step"
    example_gloss: "Every little step helps."
  nl.b1.unit02.lesson04.teach.waar:
    title: "true"
    gloss: "true"
    example_gloss: "That is true."
  nl.b1.unit02.lesson04.teach.proberen:
    title: "to try"
    gloss: "to try"
    example_gloss: "I am going to try it."
  nl.b1.unit02.lesson04.teach.moeten:
    title: "must / should"
    gloss: "must / should"
    example_gloss: "People should eat less meat."
  nl.b1.unit02.lesson04.teach.dialogue_lotte_open:
    title: "Lotte: I think people should eat less meat."
    gloss: "Lotte: I think people should eat less meat."
  nl.b1.unit02.lesson04.teach.dialogue_omar_agree:
    title: "Omar: I agree with that, although it is not always easy."
    gloss: "Omar: I agree with that, although it is not always easy."
  nl.b1.unit02.lesson04.teach.dialogue_lotte_snap:
    title: "Lotte: I understand that. Still, every little step helps."
    gloss: "Lotte: I understand that. Still, every little step helps."
  nl.b1.unit02.lesson04.teach.dialogue_omar_ga_proberen:
    title: "Omar: That's true. I am going to try it."
    gloss: "Omar: That's true. I am going to try it."

  nl.b1.unit02.lesson05.teach.groente:
    title: vegetables
    gloss: vegetables
    example_gloss: "They choose vegetables more often."
  nl.b1.unit02.lesson05.teach.de_gezondheid:
    title: health
    gloss: health
    example_gloss: "Some people do this for their health."
  nl.b1.unit02.lesson05.teach.artikel:
    title: "Reading: Eating less meat"
    gloss: "More and more people eat less meat. Although meat remains tasty, they still more often choose vegetables. Some do this for their health. Others think mainly about the environment. Still, it is not always easy to change."

  nl.b1.unit02.lesson06.teach.enerzijds_anderzijds:
    title: "on one hand..., on the other hand..."
    gloss: "on one hand..., on the other hand..."
    example_gloss: "On one hand meat is tasty, on the other hand it is not always healthy."
  nl.b1.unit02.lesson06.teach.grammar_review:
    title: "Although meat is tasty, I eat less meat. On one hand it is tasty, on the other hand it is not always healthy."
    gloss: "Although meat is tasty, I eat less meat. On one hand it is tasty, on the other hand it is not always healthy."
    note: "This unit's full family of nuance connectors: *hoewel*/*ondanks dat* (concede a point before restating your position), *toch*/*echter* (a stronger, more deliberate 'but'), and *enerzijds...anderzijds* (weigh two sides explicitly). All are genuine B1 upgrades from A2's simple *omdat*/*maar*."

