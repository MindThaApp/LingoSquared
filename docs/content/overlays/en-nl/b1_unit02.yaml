review:
  status: unreviewed
  required_next_reviewer: null
  notes: >-
    Overlay for nl's second B1 unit, authored alongside the realization.
    English speakers' real interference risk: English "although" and
    "despite" take different clause shapes (although + full clause,
    despite + noun/gerund: "despite meat being tasty"), which can make
    *hoewel*/*ondanks dat* look interchangeable when they're not quite --
    *hoewel* always introduces a full subordinate clause, *ondanks* can
    take either *dat* + clause or a bare noun phrase with no *dat* at
    all. Flagged in lesson02's contrastive note. A second risk: *toch*/
    *echter* opening a sentence trigger V2 inversion (verb before
    subject) the same way any fronted adverb does in Dutch, which has
    no equivalent in English word order -- flagged in lesson03/06.
    Pending the mandatory fresh-context review before status: reviewed.

course:
  title: Dutch B1
  description: >-
    Intermediate Dutch: debating a topic with nuance -- conceding a
    valid point on the other side using *hoewel*/*ondanks dat*
    ("although"/"despite") before restating your own position, and
    using stronger written-register contrast connectors than a simple
    *maar* ("but").

units:
  nl.b1.unit02.mening_en_nuance:
    title: "Opinion and Nuance"
    description: Debate a topic with nuance -- concede a valid point on the other side before restating your own position, using concessive and contrastive connectors stronger than a simple "but".

