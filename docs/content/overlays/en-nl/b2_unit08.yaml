course:
  title: Dutch B2
  description: >-
    Upper-intermediate Dutch: summarize and evaluate multiple sources --
    attribute a claim to its source (volgens, stelt, beweert, uit ...
    blijkt dat), compare two sources side by side (beide, terwijl,
    daarentegen, in tegenstelling tot), name where they agree (ze zijn het
    eens over) and where they conflict (ze verschillen van mening over, ze
    spreken elkaar tegen op het punt van), and give a reasoned judgement
    between them (het meest overtuigend is, beter onderbouwd, al met al),
    around two conflicting reviews of a new restaurant.

units:
  nl.b2.unit08.synthese:
    title: "Synthesis"
    description: Summarize and evaluate two sources -- attribute each claim, name where the two reviews agree and where they conflict, weigh which is better supported, and write a synthesis that gives a reasoned judgement between them.

lessons:
  nl.b2.unit08.lesson01.wie_zegt_wat:
    title: "Who says what?"
  nl.b2.unit08.lesson02.vergelijken:
    title: "Two sources side by side"
  nl.b2.unit08.lesson03.overeenkomst:
    title: "Where do they agree?"
  nl.b2.unit08.lesson04.conflict:
    title: "Where do they contradict each other?"
  nl.b2.unit08.lesson05.twee_recensies:
    title: "Two reviews side by side"
  nl.b2.unit08.lesson06.synthese_in_gesprek:
    title: "Summarize and judge"

teaching:
  nl.b2.unit08.lesson01.teach.de_pauw:
    title: "De Pauw is a new restaurant."
    gloss: "De Pauw is a new restaurant."
    note: "The situation the whole unit synthesizes: two people have reviewed a new restaurant, *De Pauw*, and you have to weigh what they say. *Een* = 'a'; *het restaurant* is a neuter noun."
  nl.b2.unit08.lesson01.teach.recensie:
    title: "the review"
    gloss: "the review"
    note: "*De recensie* = 'the review'; plural *recensies*. Each review is one of your two sources. *Welke...?* = 'Which...?' -- used to ask which of the sources."
    example_gloss: "Which review is this?"
  nl.b2.unit08.lesson01.teach.bron:
    title: "the source"
    gloss: "the source"
    note: "*De bron* ('source'), plural *bronnen*, is the general word for anything you draw information from -- here, a review. Synthesis means weighing more than one *bron*."
    example_gloss: "A review is a source."
  nl.b2.unit08.lesson01.teach.volgens:
    title: "according to"
    gloss: "according to"
    note: "*Volgens X* = 'according to X' -- the simplest way to attribute a claim to its source instead of asserting it yourself: *Volgens Sanne is het eten lekker*. Because it opens the sentence, the verb comes straight after."
    example_gloss: "According to Sanne, the food is good."
  nl.b2.unit08.lesson01.teach.prijs:
    title: "the price"
    gloss: "the price"
    note: "*De prijs* = 'the price' -- the point the two reviews will end up disagreeing about. *Hoog* = 'high'."
    example_gloss: "The price is high."
  nl.b2.unit08.lesson01.teach.stellen:
    title: "to state / assert"
    gloss: "to state / assert (states)"
    note: "*Stellen* ('to state', he/she form *stelt*) attributes a considered claim to a source: *Sanne stelt dat het niet duur is*. *Dat* ('that') opens the reported clause and sends its verb to the end."
    example_gloss: "Sanne states that it isn't expensive."
  nl.b2.unit08.lesson01.teach.beweren:
    title: "to claim"
    gloss: "to claim (claims)"
    note: "*Beweren* ('to claim', form *beweert*) is a touch more sceptical than *stellen* -- it reports a claim without vouching for it: *Thomas beweert dat het te duur is*. *Te duur* = 'too expensive'."
    example_gloss: "Thomas claims that it is too expensive."
  nl.b2.unit08.lesson01.teach.vinden:
    title: "to find / think"
    gloss: "to find / think (an opinion)"
    note: "*Vinden* is 'to find' in the sense of 'to think / hold an opinion': *ik vind* ('I think'), *hij/zij vindt* ('he/she thinks'). It is how a source voices a judgement, as opposed to a fact."
    example_gloss: "I find the food good."
  nl.b2.unit08.lesson01.teach.uit_blijkt:
    title: "it appears from ... that"
    gloss: "it appears from ... that / ... shows that"
    note: "*Uit X blijkt dat...* = 'X shows / it appears from X that...' -- attribute a conclusion to the evidence itself: *Uit de recensie blijkt dat het eten lekker is*. More formal than *volgens*, and it points at a source as evidence."
    example_gloss: "The review shows that the food is good."
  nl.b2.unit08.lesson01.teach.grammar_attributeren:
    title: "According to Sanne it isn't expensive. Thomas claims it is too expensive. The review shows that the food is good."
    gloss: "According to Sanne it isn't expensive. Thomas claims it is too expensive. The review shows that the food is good."
    note: "Attributing keeps a claim at arm's length -- you report who says it, you don't assert it yourself. Toolkit: *volgens X*, *X stelt/beweert dat...*, *uit X blijkt dat...*. This is the first move of synthesis."

  nl.b2.unit08.lesson02.teach.allebei:
    title: "both (of them)"
    gloss: "both (of them)"
    note: "*Allebei* = 'both (of them)' -- points at two people/things you have already named: *Allebei vinden ze het lekker* ('both of them find it tasty'). *Ze* = 'they'."
    example_gloss: "Both of them find it tasty."
  nl.b2.unit08.lesson02.teach.beide:
    title: "both (the two)"
    gloss: "both (the two)"
    note: "*Beide* = 'both' used directly before a noun: *beide bronnen* ('both sources'). Roughly interchangeable with *allebei*, but *beide* leans on the noun while *allebei* stands alone."
    example_gloss: "Both sources find the food good."
  nl.b2.unit08.lesson02.teach.goedkoop:
    title: cheap
    gloss: "cheap / inexpensive"
    note: "*Goedkoop* = 'cheap / inexpensive', the opposite of *duur*. It is Sanne's take on the price."
    example_gloss: "Sanne finds it cheap."
  nl.b2.unit08.lesson02.teach.terwijl:
    title: whereas
    gloss: "whereas (contrastive)"
    note: "Here *terwijl* is the CONTRASTIVE 'whereas' (not the time-word 'while'). It subordinates its clause, so the verb goes to the END: *..., terwijl Thomas het duur vindt* ('...whereas Thomas finds it expensive')."
    example_gloss: "Sanne finds it cheap, whereas Thomas finds it expensive."
  nl.b2.unit08.lesson02.teach.positief:
    title: positive
    gloss: positive
    note: "*Positief* = 'positive' -- a compact label for one source's overall stance."
    example_gloss: "Sanne is positive."
  nl.b2.unit08.lesson02.teach.negatief:
    title: negative
    gloss: negative
    note: "*Negatief* = 'negative' -- the opposite stance. *Sanne is positief, Thomas is negatief* sums up the contrast in two words."
    example_gloss: "Thomas is negative."
  nl.b2.unit08.lesson02.teach.daarentegen:
    title: "by contrast"
    gloss: "by contrast / on the other hand"
    note: "*Daarentegen* = 'by contrast' -- it flags the second, opposing source. It can follow the subject directly (*Thomas daarentegen is negatief*); if it opens the sentence on its own, the verb comes next (*Daarentegen is Thomas negatief*)."
    example_gloss: "Sanne is positive. Thomas, by contrast, is negative."
  nl.b2.unit08.lesson02.teach.in_tegenstelling_tot:
    title: "in contrast to"
    gloss: "in contrast to / unlike"
    note: "*In tegenstelling tot X* = 'in contrast to / unlike X': *In tegenstelling tot Sanne vindt Thomas het duur*. It sets one source against the other before you state the second view."
    example_gloss: "In contrast to Sanne, Thomas finds it expensive."
  nl.b2.unit08.lesson02.teach.aan_de_kant:
    title: "on one hand ... on the other hand"
    gloss: "on one hand ... on the other hand"
    note: "*Aan de ene kant ... aan de andere kant* = 'on one hand ... on the other hand' -- holds the two views in balance in a single sentence: *Aan de ene kant is het lekker, aan de andere kant is het duur*."
    example_gloss: "On one hand it is good, on the other hand it is expensive."
  nl.b2.unit08.lesson02.teach.grammar_vergelijken:
    title: "Both sources find the food good. Sanne finds it cheap, whereas Thomas finds it too expensive."
    gloss: "Both sources find the food good. Sanne finds it cheap, whereas Thomas finds it too expensive."
    note: "Comparing is the second move of synthesis: line the two sources up. Signal what they SHARE with *beide / allebei*, and what SEPARATES them with *terwijl / daarentegen / in tegenstelling tot / aan de ene kant ... aan de andere kant*."

  nl.b2.unit08.lesson03.teach.eens_zijn_over:
    title: "to agree about"
    gloss: "to agree about"
    note: "*Het eens zijn over X* = 'to agree about X' -- the fixed frame for naming a point of agreement: *Ze zijn het eens over het eten*. The little *het* is part of the idiom, not a separate 'it'."
    example_gloss: "They agree about the food."
  nl.b2.unit08.lesson03.teach.mening:
    title: opinion
    gloss: "the opinion"
    note: "*De mening* = 'opinion': *mijn mening* ('my opinion'). You will need it in lesson 4 for *verschillen van mening* ('to differ in opinion')."
    example_gloss: "That is my opinion."
  nl.b2.unit08.lesson03.teach.punt:
    title: "the point"
    gloss: "the point"
    note: "*Het punt* = 'the point (at issue)': *op dit punt* ('on this point'). It lets you say exactly WHERE two sources agree or clash."
    example_gloss: "On this point they agree."
  nl.b2.unit08.lesson03.teach.op_het_punt_van:
    title: "on the point of"
    gloss: "on the point of"
    note: "*Op het punt van X* = 'on the point of X' -- names the exact issue: *Op het punt van het eten zijn ze het eens*. Reused in lesson 4 for the point of conflict."
    example_gloss: "On the point of the food, they agree."
  nl.b2.unit08.lesson03.teach.zeggen:
    title: "to say"
    gloss: "to say (says)"
    note: "*Zeggen* ('to say', form *zegt*): *Ze zeggen allebei dat het lekker is* ('they both say it's tasty'). A plainer alternative to *stellen/beweren* for reporting a source."
    example_gloss: "They both say it is tasty."
  nl.b2.unit08.lesson03.teach.hetzelfde:
    title: "the same"
    gloss: "the same"
    note: "*Hetzelfde* = 'the same (thing)': *Ze vinden hetzelfde* ('they think the same'). A quick way to state agreement."
    example_gloss: "They think the same."
  nl.b2.unit08.lesson03.teach.grammar_overeenkomst:
    title: "They agree about the food. They both find that it is good."
    gloss: "They agree about the food. They both find that it is good."
    note: "Naming AGREEMENT is the third move of synthesis. Say where the sources line up with *ze zijn het eens over*, *op het punt van X*, *ze vinden hetzelfde* or *ze zeggen allebei dat...*."

  nl.b2.unit08.lesson04.teach.verschillen:
    title: "to disagree about"
    gloss: "to differ / disagree about"
    note: "*Verschillen van mening over X* = 'to differ in opinion about X' -- the mirror of *het eens zijn over*: *Ze verschillen van mening over de prijs*. Fixed frame; don't translate word-for-word."
    example_gloss: "They disagree about the price."
  nl.b2.unit08.lesson04.teach.verschil:
    title: "the difference"
    gloss: "the difference"
    note: "*Het verschil* = 'the difference': *Het verschil is de prijs* ('the difference is the price'). The noun behind *verschillen*."
    example_gloss: "The difference is the price."
  nl.b2.unit08.lesson04.teach.tegenspreken:
    title: "to contradict each other"
    gloss: "to contradict each other"
    note: "*Elkaar tegenspreken* = 'to contradict each other'; the parts split in a main clause: *Ze spreken elkaar tegen*. *Elkaar* = 'each other'. Stronger than merely differing -- the two claims cannot both be right."
    example_gloss: "They contradict each other."
  nl.b2.unit08.lesson04.teach.tegen_op_het_punt:
    title: "contradict each other on the point of"
    gloss: "contradict each other on the point of"
    note: "Combine the two frames to pin the clash exactly: *Ze spreken elkaar tegen op het punt van de prijs* ('they contradict each other on the point of the price')."
    example_gloss: "They contradict each other on the point of the price."
  nl.b2.unit08.lesson04.teach.toch:
    title: "still / nevertheless"
    gloss: "still / nevertheless / all the same"
    note: "*Toch* = 'still / all the same' -- holds a view against a competing one: *Thomas vindt het toch duur* ('Thomas finds it expensive all the same'). It marks where a source digs in."
    example_gloss: "Sanne finds it cheap; Thomas finds it expensive all the same."
  nl.b2.unit08.lesson04.teach.grammar_conflict:
    title: "They disagree about the price. They contradict each other on the point of the price."
    gloss: "They disagree about the price. They contradict each other on the point of the price."
    note: "Naming CONFLICT is the fourth move of synthesis. Say where the sources clash with *ze verschillen van mening over X*, *ze spreken elkaar tegen op het punt van X*, or by naming *het verschil*."

  nl.b2.unit08.lesson05.teach.recensie_sanne:
    title: "Review 1 (Sanne)"
    gloss: "I think De Pauw is great. The food is good and it isn't expensive. I'll definitely come back."
    glosses:
      vind: "think / find (1st person of vinden — an opinion)"
      geweldig: "great / wonderful"
      eten: "food"
      lekker: "good / tasty"
      duur: "expensive"
      kom: "come (1st person of komen); kom ... terug = come back"
      zeker: "definitely / for sure"
      terug: "back (return)"
  nl.b2.unit08.lesson05.teach.recensie_thomas:
    title: "Review 2 (Thomas)"
    gloss: "The food at De Pauw is good, that's true. But I find it too expensive: a pizza costs eighteen euros. For that price I expect more."
    glosses:
      eten: "the food"
      lekker: "good / tasty"
      waar: "true"
      vind: "think / find (1st person of vinden)"
      duur: "expensive"
      pizza: "pizza"
      kost: "costs"
      achttien: "eighteen"
      euro: "euros"
      prijs: "price"
      verwacht: "expect (1st person of verwachten)"
      meer: "more"
  nl.b2.unit08.lesson05.teach.reden:
    title: "the reason"
    gloss: "the reason"
    note: "*De reden* = 'the reason'; *Thomas geeft een reden* ('Thomas gives a reason'). Whether a source backs its view with a reason is what makes one review better supported than the other."
    example_gloss: "Thomas gives a reason."
  nl.b2.unit08.lesson05.teach.onderbouwd:
    title: "backed up / well-supported"
    gloss: "backed up / well-supported"
    note: "*Onderbouwd* = 'backed up with evidence'. *Beter onderbouwd* = 'better supported': a review that gives a concrete reason (Thomas names a price) is *beter onderbouwd* than one that only asserts (Sanne). *Beter* = 'better'."
    example_gloss: "Thomas's review is better supported."
  nl.b2.unit08.lesson05.teach.grammar_feit_conflict:
    title: "Both reviews find the food good. But they disagree about the price."
    gloss: "Both reviews find the food good. But they disagree about the price."
    note: "Reading two sources: first find what they SHARE (both call the food good), then the ONE point they CONFLICT on (the price), then judge which side is *beter onderbouwd* -- backs its claim with a reason."

  nl.b2.unit08.lesson06.teach.leuk:
    title: "nice / enjoyable"
    gloss: "nice / enjoyable"
    note: "*Leuk* = 'nice / enjoyable' -- an everyday all-purpose positive: *Ik vind De Pauw leuk* ('I like De Pauw')."
    example_gloss: "I like De Pauw."
  nl.b2.unit08.lesson06.teach.we:
    title: we
    gloss: "we"
    note: "*We* = 'we': *We vinden het eten lekker* ('we find the food good'). You will use it to state a shared conclusion: *we zijn het eens over...*."
    example_gloss: "We find the food good."
  nl.b2.unit08.lesson06.teach.dus:
    title: "so / therefore"
    gloss: "so / therefore"
    note: "*Dus* = 'so / therefore' -- draws the conclusion of your synthesis: *We zijn het dus eens over het eten* ('so we agree about the food')."
    example_gloss: "So we agree about the food."
  nl.b2.unit08.lesson06.teach.meest_overtuigend:
    title: "the most convincing"
    gloss: "the most convincing"
    note: "*Het meest overtuigend* = 'the most convincing' -- the core judgement frame: *Het meest overtuigend is Thomas*. This is where you evaluate, not just summarize. *Overtuigend* = 'convincing'."
    example_gloss: "The most convincing is Thomas."
  nl.b2.unit08.lesson06.teach.sterker:
    title: "stronger"
    gloss: "stronger"
    note: "*Ik vind X sterker* = 'I find X stronger' -- an alternative judgement frame: *Ik vind Thomas sterker* ('I find Thomas's case stronger'). *Sterker* = 'stronger'."
    example_gloss: "I find Thomas stronger."
  nl.b2.unit08.lesson06.teach.want:
    title: because
    gloss: "because / for"
    note: "*Want* = 'because' -- attaches the REASON to your judgement and keeps normal word order: *..., want hij geeft een reden* ('...because he gives a reason'). A judgement without a *want* is just a preference."
    example_gloss: "Thomas is convincing, because he gives a reason."
  nl.b2.unit08.lesson06.teach.al_met_al:
    title: "all in all / weighing everything"
    gloss: "all in all / weighing everything up"
    note: "*Al met al* = 'all in all'; *alles afwegend* = 'weighing everything up'. Either one opens your final verdict: *Al met al is Thomas het meest overtuigend*. Opening with *al met al* puts the verb next."
    example_gloss: "All in all, Thomas is the most convincing."
  nl.b2.unit08.lesson06.teach.dialogue_lotte_open:
    title: "Lotte: I like De Pauw. The food is good and it isn't expensive."
    gloss: "Lotte: I like De Pauw. The food is good and it isn't expensive."
  nl.b2.unit08.lesson06.teach.dialogue_omar_price:
    title: "Omar: The food is good, that's true. But I find it too expensive. A pizza costs eighteen euros."
    gloss: "Omar: The food is good, that's true. But I find it too expensive. A pizza costs eighteen euros."
  nl.b2.unit08.lesson06.teach.dialogue_lotte_hold:
    title: "Lotte: I still don't find it expensive."
    gloss: "Lotte: I still don't find it expensive."
  nl.b2.unit08.lesson06.teach.dialogue_omar_summary:
    title: "Omar: So we agree about the food, but not about the price."
    gloss: "Omar: So we agree about the food, but not about the price."
  nl.b2.unit08.lesson06.teach.grammar_volledige_synthese:
    title: "They agree about the food. They disagree about the price. The most convincing is Thomas, because he gives a reason."
    gloss: "They agree about the food. They disagree about the price. The most convincing is Thomas, because he gives a reason."
    note: "A full synthesis has THREE named parts: the AGREEMENT (*ze zijn het eens over*), the CONFLICT (*ze verschillen van mening over*), and a reasoned JUDGEMENT (*het meest overtuigend is X, want...*). This is exactly what you produce in this lesson's speaking and writing tasks."

exercises:
  nl.b2.unit08.lesson01.exercise01.recognize_volgens:
    instruction: "What does this word mean?"
    correct_option: "according to"
    distractors: [because, whereas, "the source"]
    accepted_answers: [{value: "according to", status: correct}]
    feedback: "Volgens means 'according to' -- it attributes a claim to a source instead of asserting it yourself."
  nl.b2.unit08.lesson01.exercise02.listen_volgens_sanne:
    instruction: "Listen and select what you hear."
    correct_option: "According to Sanne, it isn't expensive."
    distractors: ["According to Sanne, it is expensive.", "Thomas claims it isn't expensive.", "The review shows it isn't expensive."]
    accepted_answers: [{value: "According to Sanne, it isn't expensive.", status: correct}]
    feedback: "Volgens Sanne is het niet duur means 'according to Sanne, it isn't expensive' -- the claim is attributed to Sanne."
  nl.b2.unit08.lesson01.exercise03.match_attribution_words:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - value: {volgens: "according to", stelt: "states / asserts", beweert: claims, blijkt: "shows / turns out (from evidence)", recensie: review, bron: source, eten: food, prijs: price}
        status: correct
    feedback: "These are the words for attributing a claim to a source: volgens / stelt / beweert / blijkt point at who says what."
  nl.b2.unit08.lesson01.exercise04.order_volgens_sanne:
    instruction: "Put the words in order: According to Sanne, the food is good."
    accepted_answers:
      - {value: "Volgens Sanne is het eten lekker", status: correct}
      - {value: "Het eten is volgens Sanne lekker", status: correct}
    feedback: "Volgens Sanne is het eten lekker -- after the opening 'volgens Sanne', the verb 'is' comes next."
  nl.b2.unit08.lesson01.exercise05.translate_beweert:
    instruction: "Translate into Dutch, using beweren: Thomas claims that it is too expensive."
    accepted_answers:
      - {value: "Thomas beweert dat het te duur is", status: correct}
    feedback: "Thomas beweert dat het te duur is means 'Thomas claims that it is too expensive' -- dat sends the verb 'is' to the end."
  nl.b2.unit08.lesson01.exercise06.speak_volgens_sanne:
    instruction: "Say aloud in Dutch, using volgens: According to Sanne, it isn't expensive."
