  nl.b2.unit08.lesson02.exercise01.recognize_terwijl:
    instruction: "What does this word mean here?"
    correct_option: "whereas (contrast)"
    distractors: ["because", "so / therefore", "the same"]
    accepted_answers: [{value: "whereas (contrast)", status: correct}]
    feedback: "Here terwijl is the contrastive 'whereas' -- it sets one source's view against the other's."
  nl.b2.unit08.lesson02.exercise02.listen_beide_lekker:
    instruction: "Listen and select what you hear."
    correct_option: "Both sources find the food good."
    distractors: ["Both sources find it expensive.", "One source finds the food good.", "Both sources disagree about the food."]
    accepted_answers: [{value: "Both sources find the food good.", status: correct}]
    feedback: "Beide bronnen vinden het eten lekker means 'both sources find the food good' -- the point they agree on."
  nl.b2.unit08.lesson02.exercise03.match_comparison_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {goedkoop: cheap, beide: "both (the two)", terwijl: whereas, daarentegen: "by contrast", "in tegenstelling tot": "in contrast to", "aan de andere kant": "on the other hand", positief: positive, negatief: negative}
        status: correct
    feedback: "These line two sources up: beide for what they share, terwijl / daarentegen / in tegenstelling tot for what separates them."
  nl.b2.unit08.lesson02.exercise04.order_beide_lekker:
    instruction: "Put the words in order: Both sources find the food good."
    accepted_answers:
      - {value: "Beide bronnen vinden het eten lekker", status: correct}
      - {value: "Het eten vinden beide bronnen lekker", status: correct}
    feedback: "Beide bronnen vinden het eten lekker -- beide sits directly before the noun bronnen."
  nl.b2.unit08.lesson02.exercise05.translate_terwijl:
    instruction: "Translate into Dutch, using terwijl: Sanne is positive, whereas Thomas is negative."
    accepted_answers:
      - {value: "Sanne is positief, terwijl Thomas negatief is", status: correct}
      - {value: "Sanne is positief terwijl Thomas negatief is", status: correct}
    feedback: "Sanne is positief, terwijl Thomas negatief is -- terwijl subordinates its clause, so 'is' goes to the end."
  nl.b2.unit08.lesson02.exercise06.translate_in_tegenstelling:
    instruction: "Translate into Dutch, using in tegenstelling tot: In contrast to Sanne, Thomas finds it expensive."
    accepted_answers:
      - {value: "In tegenstelling tot Sanne vindt Thomas het duur", status: correct}
    feedback: "In tegenstelling tot Sanne vindt Thomas het duur -- after the opening phrase, the verb 'vindt' comes next."
  nl.b2.unit08.lesson02.exercise07.write_aan_de_kant:
    instruction: "Write in Dutch, using aan de ene kant ... aan de andere kant: On one hand it is good, on the other hand it is expensive."
    accepted_answers:
      - {value: "Aan de ene kant is het lekker, aan de andere kant is het duur", status: correct}
      - {value: "Aan de ene kant is het lekker aan de andere kant is het duur", status: correct}
    feedback: "Aan de ene kant is het lekker, aan de andere kant is het duur -- the two halves hold the views in balance."
  nl.b2.unit08.lesson02.exercise08.dictation_beide_lekker:
    instruction: "Type what you hear."
    correct_response: "Beide bronnen vinden het eten lekker"
    orthography_strict: true
    feedback: "You heard Beide bronnen vinden het eten lekker — both sources find the food good."

  nl.b2.unit08.lesson03.exercise01.recognize_eens:
    instruction: "What does 'het eens zijn' mean?"
    correct_option: "to agree"
    distractors: ["to disagree", "to contradict", "to state"]
    accepted_answers: [{value: "to agree", status: correct}]
    feedback: "Het eens zijn (over) means 'to agree (about)' -- naming where two sources line up."
  nl.b2.unit08.lesson03.exercise02.listen_eens_over:
    instruction: "Listen and select what you hear."
    correct_option: "They agree about the food."
    distractors: ["They disagree about the food.", "They agree about the price.", "They contradict each other about the food."]
    accepted_answers: [{value: "They agree about the food.", status: correct}]
    feedback: "Ze zijn het eens over het eten means 'they agree about the food'."
  nl.b2.unit08.lesson03.exercise03.match_agreement_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {"het eens zijn over": "to agree about", allebei: "both (of them)", hetzelfde: "the same", "de mening": opinion, "op het punt van": "on the point of", zeggen: "to say"}
        status: correct
    feedback: "These name a point of AGREEMENT: ze zijn het eens over, ze vinden hetzelfde, op het punt van."
  nl.b2.unit08.lesson03.exercise04.order_eens_over:
    instruction: "Put the words in order: They agree about the food."
    accepted_answers:
      - {value: "Ze zijn het eens over het eten", status: correct}
      - {value: "Ze zijn het over het eten eens", status: correct}
      - {value: "Over het eten zijn ze het eens", status: correct}
    feedback: "Ze zijn het eens over het eten -- the little 'het' after 'zijn' is part of the fixed phrase."
  nl.b2.unit08.lesson03.exercise05.translate_eens_over:
    instruction: "Translate into Dutch, using het eens zijn over: They agree about the food."
    accepted_answers:
      - {value: "Ze zijn het eens over het eten", status: correct}
      - {value: "Ze zijn het over het eten eens", status: correct}
    feedback: "Ze zijn het eens over het eten means 'they agree about the food'."
  nl.b2.unit08.lesson03.exercise06.speak_allebei:
    instruction: "Say aloud in Dutch, using allebei: They both find that it is good."
    accepted_answers:
      - {value: "Ze vinden allebei dat het lekker is", status: correct}
      - {value: "Allebei vinden ze dat het lekker is", status: correct}
    feedback: "Ze vinden allebei dat het lekker is means 'they both find that it is good'."
  nl.b2.unit08.lesson03.exercise07.write_eens_over:
    instruction: "Write in Dutch, using ze zijn het eens over: They agree about the food."
    accepted_answers:
      - {value: "Ze zijn het eens over het eten", status: correct}
      - {value: "Ze zijn het over het eten eens", status: correct}
    feedback: "Ze zijn het eens over het eten means 'they agree about the food' -- the fixed frame for agreement."

  nl.b2.unit08.lesson04.exercise01.recognize_verschillen:
    instruction: "What does 'verschillen van mening' mean?"
    correct_option: "to disagree / differ in opinion"
    distractors: ["to agree", "to say the same", "to give a reason"]
    accepted_answers: [{value: "to disagree / differ in opinion", status: correct}]
    feedback: "Verschillen van mening (over) means 'to disagree about' -- the mirror of het eens zijn over."
  nl.b2.unit08.lesson04.exercise02.listen_verschillen:
    instruction: "Listen and select what you hear."
    correct_option: "They disagree about the price."
    distractors: ["They agree about the price.", "They disagree about the food.", "They contradict each other about the food."]
    accepted_answers: [{value: "They disagree about the price.", status: correct}]
    feedback: "Ze verschillen van mening over de prijs means 'they disagree about the price' -- the point of conflict."
  nl.b2.unit08.lesson04.exercise03.match_conflict_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {"verschillen van mening over": "to disagree about", "het verschil": "the difference", "spreken elkaar tegen": "contradict each other", "op het punt van": "on the point of", toch: "still / nevertheless", prijs: price}
        status: correct
    feedback: "These name a point of CONFLICT: verschillen van mening over, spreken elkaar tegen, het verschil."
  nl.b2.unit08.lesson04.exercise04.order_verschillen:
    instruction: "Put the words in order: They disagree about the price."
    accepted_answers:
      - {value: "Ze verschillen van mening over de prijs", status: correct}
      - {value: "Over de prijs verschillen ze van mening", status: correct}
    feedback: "Ze verschillen van mening over de prijs -- the fixed frame 'verschillen van mening over'."
  nl.b2.unit08.lesson04.exercise05.translate_verschillen:
    instruction: "Translate into Dutch, using verschillen van mening over: They disagree about the price."
    accepted_answers:
      - {value: "Ze verschillen van mening over de prijs", status: correct}
    feedback: "Ze verschillen van mening over de prijs means 'they disagree about the price'."
  nl.b2.unit08.lesson04.exercise06.translate_tegenspreken:
    instruction: "Translate into Dutch, using spreken elkaar tegen op het punt van: They contradict each other on the point of the price."
    accepted_answers:
      - {value: "Ze spreken elkaar tegen op het punt van de prijs", status: correct}
      - {value: "Ze spreken elkaar op het punt van de prijs tegen", status: correct}
    feedback: "Ze spreken elkaar tegen op het punt van de prijs means 'they contradict each other on the point of the price'."
  nl.b2.unit08.lesson04.exercise07.write_verschil:
    instruction: "Write in Dutch: The difference is the price."
    accepted_answers:
      - {value: "Het verschil is de prijs", status: correct}
    feedback: "Het verschil is de prijs means 'the difference is the price'."

  nl.b2.unit08.lesson05.exercise01.read_agreement:
    instruction: "On what point do BOTH reviews agree?"
    correct_option: "The food is good."
    distractors: ["The price.", "The service.", "They don't agree on anything."]
    accepted_answers: [{value: "The food is good.", status: correct}]
    feedback: "Both reviews call the food good -- Sanne: 'het eten is lekker', Thomas: 'het eten ... is lekker, dat is waar'. That is their point of agreement."
  nl.b2.unit08.lesson05.exercise02.read_conflict:
    instruction: "On what point do the two reviews CONFLICT?"
    correct_option: "The price."
    distractors: ["The food.", "The name of the restaurant.", "How busy it is."]
    accepted_answers: [{value: "The price.", status: correct}]
    feedback: "The price is the clash: Sanne says 'het is niet duur', Thomas says 'ik vind het te duur'. Same topic, opposite claim."
  nl.b2.unit08.lesson05.exercise03.read_sanne_price:
    instruction: "What does Sanne claim about the price?"
    correct_option: "That it isn't expensive."
    distractors: ["That it is too expensive.", "That a pizza costs eighteen euros.", "She doesn't mention the price."]
    accepted_answers: [{value: "That it isn't expensive.", status: correct}]
    feedback: "Sanne writes 'het is niet duur' -- she claims it isn't expensive, but gives no figure to back it up."
  nl.b2.unit08.lesson05.exercise04.read_better_supported:
    instruction: "Which review backs up its view on the price with a concrete reason?"
    correct_option: "Thomas's -- he names a price (a pizza costs 18 euros)."
    distractors: ["Sanne's -- she explains why it is cheap.", "Both give a concrete reason.", "Neither gives any reason."]
    accepted_answers: [{value: "Thomas's -- he names a price (a pizza costs 18 euros).", status: correct}]
    feedback: "Thomas backs 'te duur' with a figure -- 'een pizza kost achttien euro'. Sanne only asserts 'niet duur', so Thomas's review is beter onderbouwd (better supported)."
  nl.b2.unit08.lesson05.exercise05.match_reading_words:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - value: {geweldig: great, terug: "back (return)", waar: "true", reden: reason, onderbouwd: "backed up / well-supported", verwacht: expects}
        status: correct
    feedback: "These are the reading's key words."
  nl.b2.unit08.lesson05.exercise06.translate_verwacht:
    instruction: "Translate into Dutch, using verwachten: For that price I expect more."
    accepted_answers:
      - {value: "Voor die prijs verwacht ik meer", status: correct}
      - {value: "Ik verwacht meer voor die prijs", status: correct}
      - {value: "Ik verwacht voor die prijs meer", status: correct}
    feedback: "Voor die prijs verwacht ik meer means 'for that price I expect more' -- after the opening phrase the verb 'verwacht' comes next."
  nl.b2.unit08.lesson05.exercise07.write_reden:
    instruction: "Write in Dutch: Thomas gives a reason."
    accepted_answers:
      - {value: "Thomas geeft een reden", status: correct}
    feedback: "Thomas geeft een reden means 'Thomas gives a reason' -- which is what makes his review better supported."

  nl.b2.unit08.lesson06.exercise01.comprehend_agreement:
    instruction: "On what point do Lotte and Omar AGREE?"
    correct_option: "That the food is good."
    distractors: ["That the price is fine.", "That it is too expensive.", "They don't agree on anything."]
    accepted_answers: [{value: "That the food is good.", status: correct}]
    feedback: "Both say the food is good -- Lotte: 'Het eten is lekker', Omar: 'Het eten is lekker, dat is waar'. That is their agreement."
  nl.b2.unit08.lesson06.exercise02.comprehend_conflict:
    instruction: "On what point do Lotte and Omar CONFLICT?"
    correct_option: "The price."
    distractors: ["The food.", "The location.", "Nothing -- they fully agree."]
    accepted_answers: [{value: "The price.", status: correct}]
    feedback: "Omar finds it 'te duur' while Lotte says 'toch vind ik het niet duur' -- they conflict on the price."
  nl.b2.unit08.lesson06.exercise03.comprehend_better_supported:
    instruction: "Whose view on the price is better supported, and why?"
    correct_option: "Omar's -- he gives a concrete price (a pizza costs 18 euros)."
    distractors: ["Lotte's -- she gives a reason.", "Both back it with evidence.", "Neither gives any reason."]
    accepted_answers: [{value: "Omar's -- he gives a concrete price (a pizza costs 18 euros).", status: correct}]
    feedback: "Omar backs 'te duur' with 'Een pizza kost achttien euro'; Lotte only insists 'toch vind ik het niet duur'. Omar's view is better supported."
  nl.b2.unit08.lesson06.exercise04.order_meest_overtuigend:
    instruction: "Put the words in order: The most convincing is Thomas."
    accepted_answers:
      - {value: "Het meest overtuigend is Thomas", status: correct}
      - {value: "Thomas is het meest overtuigend", status: correct}
    feedback: "Het meest overtuigend is Thomas -- the judgement frame 'het meest overtuigend is ...'."
  nl.b2.unit08.lesson06.exercise05.speak_synthese:
    instruction: "Summarize the two reviews aloud and judge between them. Say they agree about the food, disagree about the price, and that Thomas is the most convincing. Use ze zijn het eens over, ze verschillen van mening over, and het meest overtuigend is."
    accepted_answers:
      - {value: "Ze zijn het eens over het eten, maar ze verschillen van mening over de prijs. Het meest overtuigend is Thomas.", status: correct}
      - {value: "Ze zijn het eens over het eten, maar ze verschillen van mening over de prijs. Het meest overtuigend is Thomas", status: correct}
      - {value: "Ze zijn het eens over het eten maar ze verschillen van mening over de prijs. Het meest overtuigend is Thomas.", status: correct}
      - {value: "Ze zijn het eens over het eten maar ze verschillen van mening over de prijs. Het meest overtuigend is Thomas", status: correct}
    feedback: "A synthesis with a judgement: agreement (ze zijn het eens over het eten), conflict (ze verschillen van mening over de prijs), and a verdict (het meest overtuigend is Thomas)."
  nl.b2.unit08.lesson06.exercise06.write_synthese:
    instruction: "Write a THREE-sentence synthesis of the two reviews. (1) Name their AGREEMENT, using ze zijn het eens over: They agree about the food. (2) Name their CONFLICT, using ze verschillen van mening over: They disagree about the price. (3) Give a reasoned JUDGEMENT, using het meest overtuigend is + want: The most convincing is Thomas, because he gives a reason."
    accepted_answers:
      - {value: "Ze zijn het eens over het eten. Ze verschillen van mening over de prijs. Het meest overtuigend is Thomas, want hij geeft een reden.", status: correct}
      - {value: "Ze zijn het eens over het eten. Ze verschillen van mening over de prijs. Het meest overtuigend is Thomas, want hij geeft een reden", status: correct}
      - {value: "Ze zijn het eens over het eten. Ze verschillen van mening over de prijs. Het meest overtuigend is Thomas want hij geeft een reden.", status: correct}
      - {value: "Ze zijn het eens over het eten. Ze verschillen van mening over de prijs. Het meest overtuigend is Thomas want hij geeft een reden", status: correct}
    feedback: "A full synthesis names all three: the agreement (ze zijn het eens over het eten), the conflict (ze verschillen van mening over de prijs), and a reasoned judgement (het meest overtuigend is Thomas, want hij geeft een reden)."
  nl.b2.unit08.lesson06.exercise07.respond_judgement:
    instruction: "Answer 'Welke recensie is het meest overtuigend?' with a judgement AND a reason, using het meest overtuigend is + want."
    accepted_answers:
      - {value: "Het meest overtuigend is Thomas, want hij geeft een reden", status: correct}
      - {value: "Het meest overtuigend is Thomas, want hij geeft een reden.", status: correct}
      - {value: "Het meest overtuigend is Thomas want hij geeft een reden", status: correct}
      - {value: "Het meest overtuigend is Thomas want hij geeft een reden.", status: correct}
    feedback: "Het meest overtuigend is Thomas, want hij geeft een reden -- a judgement backed by a reason (want ...)."
