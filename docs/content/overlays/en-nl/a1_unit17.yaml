course:
  title: "Dutch A1"
  description: "Beginner Dutch for stating an occupation, workplace, and simple work schedule."

units:
  nl.a1.unit17.work: {title: "Work and occupation"}

lessons:
  nl.a1.unit17.lesson01.wat_doe_je_voor_werk: {title: "What do you do for work?"}
  nl.a1.unit17.lesson02.waar_werk_je: {title: "Where do you work?"}
  nl.a1.unit17.lesson03.mijn_werkdag: {title: "My workday"}
  nl.a1.unit17.lesson04.collegas_beschrijven: {title: "Describing colleagues"}
  nl.a1.unit17.lesson05.werkprofielen_lezen: {title: "Reading work profiles"}
  nl.a1.unit17.lesson06.werk_gesprek: {title: "A conversation about work"}

teaching:
  nl.a1.unit17.lesson01.teach.wat_doe_je: {title: "Asking about someone's job", gloss: "What do you do for work?", note: "A standard, casual way to ask about someone's occupation."}
  nl.a1.unit17.lesson01.teach.beroep_kok: {title: "Occupation / cook", gloss: "the occupation; cook", note: "*Het beroep* (occupation) is a neuter noun. *Kok* (cook) is a common gender-neutral occupation noun, used for any gender: *een kok*, *de kok*.", example_gloss: ["What is your job?", "I work as a cook."]}
  nl.a1.unit17.lesson01.teach.werk_als_kok: {title: "Saying you're a cook", gloss: "I work as a cook.", note: "*Werken als* + occupation is the standard pattern for stating a job, no article before the occupation noun."}
  nl.a1.unit17.lesson01.teach.verpleegkundige: {title: "Nurse", gloss: "nurse", note: "The modern, gender-neutral term for this profession, used for any gender.", example_gloss: "I work as a nurse."}
  nl.a1.unit17.lesson01.teach.werk_als_verpleegkundige: {title: "Saying you're a nurse", gloss: "I work as a nurse.", note: "Follows the same *werken als* pattern as *kok*."}

  nl.a1.unit17.lesson02.teach.waar_werk_je: {title: "Asking about a workplace", gloss: "Where do you work?", note: "A direct follow-up question to *Wat doe je voor werk?*"}
  nl.a1.unit17.lesson02.teach.werk_restaurant: {title: "Working in a restaurant", gloss: "I work in a restaurant.", note: "*Een restaurant* takes the indefinite article here since it's one of many restaurants."}
  nl.a1.unit17.lesson02.teach.ziekenhuis: {title: "The hospital", gloss: "the hospital", note: "A neuter noun: *het ziekenhuis*.", example_gloss: "I work in the hospital."}
  nl.a1.unit17.lesson02.teach.werk_ziekenhuis: {title: "Working in the hospital", gloss: "I work in the hospital.", note: "*Het ziekenhuis* takes the definite article -- Dutch treats it as a specific, known institution the way English sometimes does with 'the hospital.'"}
  nl.a1.unit17.lesson02.teach.kantoor: {title: "Working in an office", gloss: "Some people work at an office.", note: "*Op kantoor* (at the office) is a fixed expression without an article, unlike *in een restaurant*/*in het ziekenhuis*."}

  nl.a1.unit17.lesson03.teach.begin_negen: {title: "Starting time", gloss: "I start at nine o'clock.", note: "*Begin* is the ik-form of *beginnen* (to start), reusing the clock-time pattern from unit04."}
  nl.a1.unit17.lesson03.teach.maandag_vrijdag: {title: "Working days", gloss: "I work Monday to Friday.", note: "*Van ... tot ...* reuses the range pattern for days of the week from unit03."}
  nl.a1.unit17.lesson03.teach.pauze: {title: "The break", gloss: "the break", note: "A common gender noun: *de pauze*.", example_gloss: "I have a break at twelve o'clock."}
  nl.a1.unit17.lesson03.teach.heb_pauze: {title: "Having a break", gloss: "I have a break at twelve o'clock.", note: "*Pauze hebben* (to have a break) is the natural fixed pattern."}
  nl.a1.unit17.lesson03.teach.stop_vijf: {title: "Finishing time", gloss: "I finish at five o'clock.", note: "*Stop* is the ik-form of *stoppen* (to stop/finish)."}

  nl.a1.unit17.lesson04.teach.third_person_rule: {title: "Third-person verb endings", gloss: "With he or she, the verb usually gets an extra -t: he works, she works.", note: "*Werk* becomes *werkt* for *hij*/*zij*, the regular Dutch present-tense third-person pattern."}
  nl.a1.unit17.lesson04.teach.lotte_werkt: {title: "Lotte's job", gloss: "Lotte works as a nurse.", note: "*Werkt* (not *werk*) because the subject is a third-person name, not *ik*."}
  nl.a1.unit17.lesson04.teach.omar_werkt: {title: "Omar's job", gloss: "Omar works as a cook.", note: "Same third-person -t ending as lotte_werkt."}
  nl.a1.unit17.lesson04.teach.pronouns_workplaces: {title: "Using pronouns", gloss: "She works in the hospital. He works in a restaurant.", note: "*Zij*/*hij* replace the names Lotte/Omar but keep the same third-person -t verb form."}

  nl.a1.unit17.lesson05.teach.profiel: {title: "Read two work profiles", gloss: "Lotte works as a nurse in the hospital. She starts at seven o'clock and works Monday to Friday. Omar works as a cook in a restaurant. He starts at eleven o'clock and has a break at four o'clock.", note: "Track each person's job, workplace, and schedule separately."}

  nl.a1.unit17.lesson06.teach.lotte_curious: {title: "Lotte asks about work", gloss: "Lotte: Hi Omar! I'm curious, what do you actually do for work?", note: "*Eigenlijk* (actually) softens the question into friendly curiosity rather than an interrogation."}
  nl.a1.unit17.lesson06.teach.omar_answer: {title: "Omar answers", gloss: "Omar: I work as a cook in a restaurant. And you?", note: "*En jij?* is the standard way to turn the question back to the other person."}
  nl.a1.unit17.lesson06.teach.lotte_answer: {title: "Lotte answers", gloss: "Lotte: I work as a nurse in the hospital.", note: "Matches the job and workplace already established in lesson01/lesson02/lesson05."}
  nl.a1.unit17.lesson06.teach.omar_ask_hours: {title: "Omar asks about hours", gloss: "Omar: What hours do you keep?", note: "*Uren maken* (literally 'to make hours') is a fixed idiom for describing one's work schedule."}
  nl.a1.unit17.lesson06.teach.lotte_hours: {title: "Lotte states her hours", gloss: "Lotte: I start at seven o'clock and I work Monday to Friday.", note: "Matches the schedule already established in lesson05's reading profile."}
  nl.a1.unit17.lesson06.teach.omar_reaction: {title: "Omar reacts", gloss: "Omar: That's early! I start later, at eleven o'clock.", note: "Matches Omar's start time already established in lesson05."}
  nl.a1.unit17.lesson06.teach.lotte_closing: {title: "Lotte closes the topic", gloss: "Lotte: Every job has its own rhythm, I guess.", note: "A natural, reflective closing remark -- recognize it for meaning, no need to reproduce it exactly."}

exercises:
  nl.a1.unit17.lesson01.exercise01.choose_cook:
    instruction: "Choose the Dutch sentence meaning 'I work as a cook.'"
    correct_option: "Ik werk als kok."
    distractors: ["Ik werk een kok.", "Ik ben werk als kok.", "Ik werk als verpleegkundige."]
    accepted_answers: [{value: "Ik werk als kok.", status: correct}]
    feedback: "Werk als kok has no article before the occupation."
  nl.a1.unit17.lesson01.exercise02.listen_nurse:
    instruction: "Listen and choose what the speaker says."
    correct_option: "I work as a nurse."
    distractors: ["I work as a cook.", "I work in the hospital.", "What do you do for work?"]
    accepted_answers: [{value: "I work as a nurse.", status: correct}]
    feedback: "Ik werk als verpleegkundige."
  nl.a1.unit17.lesson01.exercise03.match_occupations:
    instruction: "Match each Dutch word or sentence to its meaning."
    accepted_answers: [{value: [{left: kok, right: cook}, {left: verpleegkundige, right: nurse}, {left: "het beroep", right: "the occupation"}, {left: "Ik werk als kok.", right: "I work as a cook."}, {left: "Ik werk als verpleegkundige.", right: "I work as a nurse."}, {left: "Wat doe je voor werk?", right: "What do you do for work?"}], status: correct}]
    feedback: "Kok and verpleegkundige are both used without a gender distinction in modern Dutch."
  nl.a1.unit17.lesson01.exercise04.order_cook:
    instruction: "Put the words in order to say you work as a cook."
    correct_option: "Ik werk als kok"
    accepted_answers: [{value: "Ik werk als kok", status: correct}]
    feedback: "The complete sentence is Ik werk als kok."
  nl.a1.unit17.lesson01.exercise05.listen_order_cook:
    instruction: "Listen and put the words in the order you hear."
