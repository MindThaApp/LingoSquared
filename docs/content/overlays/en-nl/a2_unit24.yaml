course:
  title: "Dutch A2"
  description: "Elementary-plus Dutch for handling a formal appointment to register with local authorities: booking it, understanding required documents, and following a real gemeente conversation."

units:
  nl.a2.unit24.gemeente: {title: "Registering with the local authorities"}

lessons:
  nl.a2.unit24.lesson01.een_afspraak_maken: {title: "Making an appointment"}
  nl.a2.unit24.lesson02.wat_heb_je_nodig: {title: "What do you need?"}
  nl.a2.unit24.lesson03.bij_de_balie: {title: "At the counter"}
  nl.a2.unit24.lesson04.je_bsn_nummer: {title: "Your BSN number"}
  nl.a2.unit24.lesson05.brief_lezen: {title: "Reading an official letter"}
  nl.a2.unit24.lesson06.gemeente_afspraak: {title: "Omar at the gemeente"}

teaching:
  nl.a2.unit24.lesson01.teach.inschrijven: {title: "To register", gloss: "to register (oneself)", note: "A reflexive separable verb: zich inschrijven. The reflexive pronoun changes with the subject (me, je, zich, ...).", example_gloss: "I want to register with the municipality."}
  nl.a2.unit24.lesson01.teach.afspraak_maken: {title: "Requesting an appointment", gloss: "I would like to make an appointment to register.", note: "Om ... te + infinitive expresses purpose ('in order to'); me in te schrijven splits the separable verb inschrijven around the reflexive pronoun."}
  nl.a2.unit24.lesson01.teach.wanneer_tijd: {title: "Asking about availability", gloss: "When do you have time?", note: "A direct, practical way to ask about scheduling, using the formal u."}
  nl.a2.unit24.lesson01.teach.zou_schikken: {title: "The polite conditional", gloss: "Would Wednesday at ten o'clock suit you?", note: "Zou + infinitive is the polite conditional, softer than a direct statement -- a hallmark of A2 formal register."}
  nl.a2.unit24.lesson01.teach.komt_goed_uit: {title: "Confirming a time works", gloss: "Yes, that works out well.", note: "Komt goed uit (literally 'comes out well') is the natural way to confirm a proposed time or plan suits you."}

  nl.a2.unit24.lesson02.teach.paspoort: {title: "Passport", gloss: "the passport", note: "A neuter noun: het paspoort.", example_gloss: "Do you have your passport with you?"}
  nl.a2.unit24.lesson02.teach.huurcontract: {title: "Rental contract", gloss: "the rental contract", note: "A neuter noun: het huurcontract, a compound of huren (to rent) and contract.", example_gloss: "Do you have a rental contract?"}
  nl.a2.unit24.lesson02.teach.geboorteakte: {title: "Birth certificate", gloss: "the birth certificate", note: "A common gender noun: de geboorteakte.", example_gloss: "Do I also need to bring my birth certificate?"}
  nl.a2.unit24.lesson02.teach.wat_heb_ik_nodig: {title: "Asking what's required", gloss: "What do I need to register?", note: "Om ... te + infinitive again expresses purpose, reusing the pattern from lesson01."}
  nl.a2.unit24.lesson02.teach.paspoort_huurcontract: {title: "Stating requirements formally", gloss: "You need a valid passport and your rental contract.", note: "U heeft ... nodig (literally 'you have ... needed') is the standard formal way to state a requirement."}
  nl.a2.unit24.lesson02.teach.moet_ik_meenemen: {title: "Asking about an additional document", gloss: "Do I also need to bring my birth certificate?", note: "Meenemen (to bring along) is a separable verb; here it stays at the end of the question as an infinitive after moet."}

  nl.a2.unit24.lesson03.teach.mag_ik_zien: {title: "Requesting to see documents", gloss: "May I see your passport and rental contract?", note: "Mag ik ... zien? is the standard polite way an official asks to inspect documents."}
  nl.a2.unit24.lesson03.teach.sinds_wanneer: {title: "Asking since when", gloss: "Since when have you lived at this address?", note: "Sinds wanneer (since when) is a formal, precise way to ask about duration, common in official interviews."}
  nl.a2.unit24.lesson03.teach.sinds_vorige_maand: {title: "Stating a starting point", gloss: "I have lived here since last month.", note: "Sinds + time expression states when a still-ongoing situation began, paired with the present tense woon (not a past tense) since the living arrangement continues."}

  nl.a2.unit24.lesson04.teach.bsn: {title: "BSN number", gloss: "the BSN number (Citizen Service Number)", note: "A neuter noun: het BSN-nummer, the Dutch national personal identification number.", example_gloss: "What is a BSN number?"}
  nl.a2.unit24.lesson04.teach.wat_is_bsn: {title: "Asking what the BSN is", gloss: "What is a BSN number?", note: "A basic definition-seeking question, useful for any unfamiliar official term."}
  nl.a2.unit24.lesson04.teach.bsn_uitleg: {title: "Explaining the BSN", gloss: "The BSN number is your personal number with the government.", note: "Bij de overheid (with the government) specifies which institution the number belongs to."}
  nl.a2.unit24.lesson04.teach.nodig_voor: {title: "Listing its uses", gloss: "You need it for work, the bank, and the doctor.", note: "Nodig hebben voor (to need for) reuses the nodig hebben pattern with voor introducing each use."}
  nl.a2.unit24.lesson04.teach.digid: {title: "Introducing DigiD", gloss: "With DigiD you can arrange matters online.", note: "DigiD is the Dutch digital identity system for government services; zaken regelen (to arrange matters) is a common general-purpose phrase for handling official business."}

  nl.a2.unit24.lesson05.teach.brief: {title: "Read an official registration letter", gloss: "To register with the municipality you need the following documents: a valid passport, your rental contract, and, if applicable, your birth certificate. Make an appointment in advance. After registration you will receive your BSN number by post within a few days.", note: "Track the required documents, what to do beforehand, and what happens afterward."}

  nl.a2.unit24.lesson06.teach.ambtenaar_greet: {title: "The official greets Omar", gloss: "Official: Good afternoon, how can I help you?", note: "Waarmee kan ik u helpen? is the standard formal service greeting, continuing the u register from earlier units' service encounters."}
  nl.a2.unit24.lesson06.teach.omar_state_reason: {title: "Omar states his reason", gloss: "Omar: Good afternoon, I have an appointment to register at my new address.", note: "Op mijn nieuwe adres (at my new address) specifies which registration this is."}
  nl.a2.unit24.lesson06.teach.ambtenaar_ask_documents: {title: "The official asks for documents", gloss: "Official: May I see your passport and rental contract, please?", note: "Reuses the mag ik ... zien? pattern from lesson03, with alstublieft added for extra politeness."}
  nl.a2.unit24.lesson06.teach.omar_hand_over: {title: "Omar hands them over", gloss: "Omar: Here you go. I have lived in Utrecht since last month.", note: "Matches the sinds vorige maand fact established in lesson03's teaching example."}
  nl.a2.unit24.lesson06.teach.ambtenaar_confirm: {title: "The official confirms", gloss: "Official: Thank you. Everything is in order. You will receive your BSN number within a few days by post.", note: "Alles is in orde (everything is in order) is a standard confirmation phrase after document review."}
  nl.a2.unit24.lesson06.teach.omar_thanks: {title: "Omar thanks the official", gloss: "Omar: Great, thank you very much for your help!", note: "Voor uw hulp (for your help) closes the formal exchange politely."}
  nl.a2.unit24.lesson06.teach.summary_grammar: {title: "Summarizing the visit", gloss: "Omar registered with the gemeente. He will receive his BSN number by post.", note: "Heeft ... ingeschreven is the present-perfect form of zich inschrijven (ingeschreven is the past participle); zijn here is the possessive 'his', not the verb 'to be'."}

exercises:
  nl.a2.unit24.lesson01.exercise01.choose_appointment_request:
    instruction: "Choose the Dutch sentence meaning 'I would like to make an appointment to register.'"
    correct_option: "Ik wil graag een afspraak maken om me in te schrijven."
    distractors: ["Ik wil graag een afspraak maken om in te schrijven me.", "Ik wil graag een afspraak maken voor inschrijven.", "Ik wil graag me inschrijven een afspraak maken."]
    accepted_answers: [{value: "Ik wil graag een afspraak maken om me in te schrijven.", status: correct}]
    feedback: "Om ... te + infinitive expresses purpose; me in te schrijven splits the separable verb around the reflexive pronoun."
  nl.a2.unit24.lesson01.exercise02.listen_time_suggestion:
    instruction: "Listen and choose what is asked."
    correct_option: "Would Wednesday at ten o'clock suit you?"
    distractors: ["When do you have time?", "That works out well.", "I would like to make an appointment."]
    accepted_answers: [{value: "Would Wednesday at ten o'clock suit you?", status: correct}]
    feedback: "Zou woensdag om tien uur schikken?"
  nl.a2.unit24.lesson01.exercise03.match_appointment_phrases:
    instruction: "Match each Dutch phrase to its meaning."
    accepted_answers: [{value: [{left: "zich inschrijven", right: "to register (oneself)"}, {left: "een afspraak maken", right: "to make an appointment"}, {left: "Wanneer heeft u tijd?", right: "When do you have time?"}, {left: "Zou woensdag om tien uur schikken?", right: "Would Wednesday at ten o'clock suit you?"}, {left: "dat komt goed uit", right: "that works out well"}], status: correct}]
    feedback: "Both phrases are common in scheduling an appointment."
  nl.a2.unit24.lesson01.exercise04.order_time_suggestion:
    instruction: "Put the words in order to ask if Wednesday at ten o'clock would suit someone."
    correct_option: "Zou woensdag om tien uur schikken"
    accepted_answers: [{value: "Zou woensdag om tien uur schikken", status: correct}]
    feedback: "The complete question is Zou woensdag om tien uur schikken?"
  nl.a2.unit24.lesson01.exercise05.listen_order_appointment_request:
    instruction: "Listen and put the words in the order you hear."
    correct_option: "Ik wil graag een afspraak maken"
    accepted_answers: [{value: "Ik wil graag een afspraak maken", status: correct}]
    feedback: "The complete phrase is Ik wil graag een afspraak maken."
  nl.a2.unit24.lesson01.exercise06.complete_time_suggestion:
    instruction: "Complete the question."
    accepted_answers: [{value: schikken, status: correct}]
    feedback: "Zou woensdag om tien uur schikken?"
  nl.a2.unit24.lesson01.exercise07.write_appointment_request:
    instruction: "Write in Dutch: say you would like to make an appointment to register."
    accepted_answers: [{value: "Ik wil graag een afspraak maken om me in te schrijven.", status: correct}, {value: "Ik wil graag een afspraak maken om me in te schrijven", status: correct}]
    feedback: "Ik wil graag een afspraak maken om me in te schrijven."

