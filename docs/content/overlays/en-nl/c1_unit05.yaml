review: {status: reviewed, required_next_reviewer: ramin_native_pass, notes: "Complete overlay for counterfactual reasoning, mixed conditionals, hypothetical consequences, and regret. Fresh-context review 2026-10-10 (content-reviewer.md checklist): checked instructions, options, distractors, accepted answers, glosses and matching pairs against the nl realization. 3 defects fixed: lesson01.exercise05.vertaal_verhuisd and lesson03.exercise05.vertaal_gemengd instructions say then was ik / then woonde ik, which a learner can read as Dutch dan, so the grammatical dan-variants were added; lesson05.exercise02.lees_alternatief correct option now reads He would have moved and would now live in Amsterdam (was the ungrammatical and now lived). Native-pass checklist (moved here from required_next_reviewer, unchanged): Fresh-context native-Dutch review required for the naturalness of counterfactual, mixed-conditional, and regret forms."}
course: {title: "Dutch C1", description: "Advanced Dutch discourse, inference, register, and nuanced argumentation."}
units: {nl.c1.unit05.contrafeitelijk_redeneren: {title: "Reason counterfactually", description: "Link a past unreal condition to a present consequence, express regret, and distinguish fact from the unreal alternative."}}
lessons:
  nl.c1.unit05.lesson01.verleden_voorwaarde: {title: "The unreal condition in the past"}
  nl.c1.unit05.lesson02.spijt_uiten: {title: "Express regret"}
  nl.c1.unit05.lesson03.gemengde_voorwaarde: {title: "The mixed conditional"}
  nl.c1.unit05.lesson04.gevolgen_doortrekken: {title: "Extend consequences to the present"}
  nl.c1.unit05.lesson05.keten_lezen: {title: "Read a counterfactual chain"}
  nl.c1.unit05.lesson06.analyse_schrijven: {title: "Write the counterfactual analysis"}
teaching:
  nl.c1.unit05.lesson01.teach.vijf_jaar_geleden: {title: "Five years ago I was offered a job in Amsterdam.", gloss: "establish the fact (real timeline)", note: "*Vijf jaar geleden kreeg ik een baan aangeboden* states what really happened; *aangeboden* is the past participle of *aanbieden* (to offer)."}
  nl.c1.unit05.lesson01.teach.als_ik_had_aangenomen: {title: "If I had accepted that job, I would have moved to Amsterdam.", gloss: "past counterfactual", note: "Both clauses use the pluperfect: *had aangenomen* in the als-clause, *was verhuisd* in the main clause. *verhuizen* takes *zijn*."}
  nl.c1.unit05.lesson01.teach.dan_ander_leven: {title: "Then I would have had a completely different life.", gloss: "counterfactual consequence", note: "*Dan had ik ... gehad* names the consequence that never materialized."}
  nl.c1.unit05.lesson01.teach.voltooid_verleden: {title: "Both clauses in the pluperfect", gloss: "unreal past = pluperfect in both clauses", note: "A past unreal condition puts the als-clause and the main clause in the *voltooid verleden tijd* (pluperfect)."}
  nl.c1.unit05.lesson02.teach.had_ik_maar: {title: "If only I had seized that chance.", gloss: "inverted regret", note: "*Had ik ... maar* is an inverted wish expressing regret; the particle *maar* is essential."}
  nl.c1.unit05.lesson02.teach.ik_had_beter: {title: "I should have thought about it better.", gloss: "should-have regret", note: "*Ik had ... moeten nadenken* says you ought to have acted differently; *er ... over* refers back to the decision."}
  nl.c1.unit05.lesson02.teach.achteraf_gezien: {title: "In hindsight I should have chosen differently.", gloss: "retrospective regret", note: "*Achteraf gezien* frames the regret from the present, looking back."}
  nl.c1.unit05.lesson02.teach.spijt_kort: {title: "Two short regret forms", gloss: "*Had ik maar* or *achteraf gezien*", note: "*Spijt* can be expressed with the inverted *Had ik ... maar*, or retrospectively with *Achteraf gezien ...*."}
  nl.c1.unit05.lesson03.teach.woonde_ik_nu: {title: "If I had accepted that job, I would now live in Amsterdam.", gloss: "mixed conditional (past → present)", note: "The als-clause is pluperfect; the consequence *woonde ik nu* uses the past form of *wonen* for a present result — a mixed conditional."}
  nl.c1.unit05.lesson03.teach.zou_ik_wonen: {title: "Then I would now live in Amsterdam.", gloss: "mixed conditional with zou", note: "The same mixed idea can use *zou + wonen*: *Dan zou ik nu in Amsterdam wonen*."}
  nl.c1.unit05.lesson03.teach.dan_had_ik_jou: {title: "Then I would never have met you.", gloss: "past consequence of the alternative", note: "*Nooit ontmoet* states a second, emotional consequence of the road not taken."}
  nl.c1.unit05.lesson03.teach.gemengde_voorwaarde: {title: "A mixed conditional links past and present", gloss: "unreal past condition + present consequence", note: "A *gemengde voorwaarde* connects an unreal past condition to a consequence *in het heden* (the present)."}
  nl.c1.unit05.lesson04.teach.in_werkelijkheid: {title: "In reality I turned the job down.", gloss: "state the fact", note: "*In werkelijkheid* marks the real timeline; *afgewezen* is the participle of *afwijzen* (to reject)."}
  nl.c1.unit05.lesson04.teach.anders_zat_ik: {title: "Otherwise I would now be sitting in Amsterdam, far from my friends.", gloss: "the unreal present", note: "*Anders zat ik nu* uses *zitten* in the past form for a present situation that did not happen."}
  nl.c1.unit05.lesson04.teach.hier_bij_jullie: {title: "But now I am here, with you at the taalcafé.", gloss: "the real present consequence", note: "*Hier, bij jullie* states what actually followed from staying."}
  nl.c1.unit05.lesson04.teach.tegenfeitelijke_keten: {title: "A counterfactual chain", gloss: "fact → unreal condition → present consequence", note: "A *tegenfeitelijke keten* runs from the fact, via the unreal condition, to the consequence in the present."}
  nl.c1.unit05.lesson05.teach.leestekst: {title: "A complete counterfactual reflection", gloss: "fact → counterfactual → mixed consequence → no regret", note: "Read for what actually happened, what would have been different, and how the present would differ."}
  nl.c1.unit05.lesson05.teach.tijdlijn: {title: "Two timelines side by side", gloss: "real timeline vs unreal timeline", note: "The *echte tijdlijn* and the *onwerkelijke tijdlijn* are presented alongside each other."}
  nl.c1.unit05.lesson06.teach.volledige_analyse: {title: "Omar's full counterfactual analysis", gloss: "fact + past counterfactual + mixed conditional + regret", note: "Listen and read for the fact, the unreal past, the present consequence, and the regret."}
exercises:
  nl.c1.unit05.lesson01.exercise01.herken_verhuisd: {instruction: "What does this sentence express?", correct_option: "An unreal past condition and its past consequence.", distractors: ["A real plan for the future.", "A request for permission.", "A present habit."], accepted_answers: [{value: "An unreal past condition and its past consequence.", status: correct}], feedback: "Both *had aangenomen* and *was verhuisd* are pluperfect — the unreal past."}
  nl.c1.unit05.lesson01.exercise02.herken_leven: {instruction: "What is the force of Dan had ik een heel ander leven gehad?", correct_option: "A consequence that never happened.", distractors: ["A fact about the present.", "A promise about the future.", "An order."], accepted_answers: [{value: "A consequence that never happened.", status: correct}], feedback: "*Dan had ik ... gehad* names the unreal consequence."}
  nl.c1.unit05.lesson01.exercise03.koppel_verleden: {instruction: "Match each Dutch counterfactual element to its clue.", pairs: [{left: "had aangenomen", right: "had accepted (unreal past)"}, {left: "was verhuisd", right: "had moved (verb zijn)"}, {left: "die baan", right: "that job"}, {left: "een heel ander leven", right: "a completely different life"}, {left: gehad, right: "had had"}, {left: "onwerkelijke voorwaarde", right: "unreal condition"}, {left: "voltooid verleden tijd", right: "pluperfect tense"}, {left: aangeboden, right: "offered"}], accepted_answers: [{value: [{left: "had aangenomen", right: "had accepted (unreal past)"}, {left: "was verhuisd", right: "had moved (verb zijn)"}, {left: "die baan", right: "that job"}, {left: "een heel ander leven", right: "a completely different life"}, {left: gehad, right: "had had"}, {left: "onwerkelijke voorwaarde", right: "unreal condition"}, {left: "voltooid verleden tijd", right: "pluperfect tense"}, {left: aangeboden, right: "offered"}], status: correct}], feedback: "The past unreal uses pluperfect in both clauses."}
  nl.c1.unit05.lesson01.exercise04.orden_verhuisd: {instruction: "Order the exact past counterfactual: Als + ik + die baan + had aangenomen, then was ik + naar Amsterdam + verhuisd.", accepted_answers: [{value: "Als ik die baan had aangenomen was ik naar Amsterdam verhuisd", status: correct}], feedback: "The als-clause ends with the participle aangenomen; the main clause inverts."}
  nl.c1.unit05.lesson01.exercise05.vertaal_verhuisd: {instruction: "Translate with Als ik ... had aangenomen, then was ik naar Amsterdam verhuisd.", accepted_answers: [{value: "Als ik die baan had aangenomen, was ik naar Amsterdam verhuisd.", status: correct}, {value: "Als ik die baan had aangenomen, dan was ik naar Amsterdam verhuisd.", status: correct}], feedback: "Both clauses are pluperfect; verhuisd takes zijn."}
  nl.c1.unit05.lesson01.exercise06.spreek_verhuisd: {instruction: "Turn this fact into a past counterfactual with an als-clause, using the pluperfect in both clauses, and say it as one sentence: \"Ik heb de baan niet aangenomen, dus ik ben niet naar Amsterdam verhuisd.\"", accepted_answers: [{value: "Als ik de baan had aangenomen, was ik naar Amsterdam verhuisd.", status: correct}, {value: "Als ik de baan had aangenomen, was ik verhuisd naar Amsterdam.", status: correct}, {value: "Als ik de baan had aangenomen, dan was ik naar Amsterdam verhuisd.", status: correct}, {value: "Als ik de baan had aangenomen, dan was ik verhuisd naar Amsterdam.", status: correct}, {value: "Als ik de baan aangenomen had, was ik naar Amsterdam verhuisd.", status: correct}, {value: "Als ik de baan aangenomen had, was ik verhuisd naar Amsterdam.", status: correct}, {value: "Als ik de baan aangenomen had, dan was ik naar Amsterdam verhuisd.", status: correct}, {value: "Als ik de baan aangenomen had, dan was ik verhuisd naar Amsterdam.", status: correct}], feedback: "The unreal past puts both clauses in the pluperfect (had aangenomen or aangenomen had; was verhuisd; verhuizen takes zijn). A main-clause dan is optional."}
  nl.c1.unit05.lesson01.exercise07.schrijf_voorwaarde: {instruction: "Translate into Dutch as one past counterfactual with an als-clause (pluperfect in both clauses), using een heel ander leven: \"If I had accepted that job, I would have had a completely different life.\"", accepted_answers: [{value: "Als ik die baan had aangenomen, had ik een heel ander leven gehad.", status: correct}, {value: "Als ik die baan had aangenomen, dan had ik een heel ander leven gehad.", status: correct}, {value: "Als ik die baan aangenomen had, had ik een heel ander leven gehad.", status: correct}, {value: "Als ik die baan aangenomen had, dan had ik een heel ander leven gehad.", status: correct}], feedback: "Both clauses are pluperfect: had aangenomen (or aangenomen had) and had ... gehad. A main-clause dan is optional."}
  nl.c1.unit05.lesson02.exercise01.herken_gegrepen: {instruction: "What does Had ik die kans maar gegrepen express?", correct_option: "Regret over a missed opportunity.", distractors: ["Certainty about the past.", "A question about the future.", "A polite request."], accepted_answers: [{value: "Regret over a missed opportunity.", status: correct}], feedback: "*Had ik ... maar* is the inverted regret form."}
  nl.c1.unit05.lesson02.exercise02.herken_achteraf: {instruction: "What does Achteraf gezien signal?", correct_option: "A retrospective judgement of regret.", distractors: ["A forward-looking plan.", "A factual report.", "A command."], accepted_answers: [{value: "A retrospective judgement of regret.", status: correct}], feedback: "*Achteraf gezien* looks back from the present."}
  nl.c1.unit05.lesson02.exercise03.koppel_spijt: {instruction: "Match each Dutch regret element to its clue.", pairs: [{left: "Had ik maar", right: "if only I had"}, {left: gegrepen, right: "seized"}, {left: kans, right: "opportunity"}, {left: nadenken, right: "to think it over"}, {left: "Achteraf gezien", right: "in hindsight"}, {left: "anders moeten kiezen", right: "should have chosen differently"}, {left: Spijt, right: "regret"}, {left: uitdrukken, right: "to express"}], accepted_answers: [{value: [{left: "Had ik maar", right: "if only I had"}, {left: gegrepen, right: "seized"}, {left: kans, right: "opportunity"}, {left: nadenken, right: "to think it over"}, {left: "Achteraf gezien", right: "in hindsight"}, {left: "anders moeten kiezen", right: "should have chosen differently"}, {left: Spijt, right: "regret"}, {left: uitdrukken, right: "to express"}], status: correct}], feedback: "Regret uses inverted Had ik maar or retrospective achteraf."}
  nl.c1.unit05.lesson02.exercise04.orden_gegrepen: {instruction: "Order the exact inverted regret: Had + ik + die kans + maar + gegrepen.", accepted_answers: [{value: "Had ik die kans maar gegrepen", status: correct}], feedback: "The inversion and the particle maar make the regret."}
  nl.c1.unit05.lesson02.exercise05.vertaal_nadenken: {instruction: "Translate with Ik had er beter over moeten nadenken.", accepted_answers: [{value: "Ik had er beter over moeten nadenken", status: correct}], feedback: "*Er ... over* refers back to the decision; moeten nadenken closes the clause."}
  nl.c1.unit05.lesson02.exercise06.spreek_spijt: {instruction: "Turn this fact into a regret with the inverted wish form Had ik ... maar ...: \"Ik heb die baan niet aangenomen.\"", accepted_answers: [{value: "Had ik die baan maar aangenomen.", status: correct}, {value: "Had ik maar die baan aangenomen.", status: correct}], feedback: "The inverted Had ik ... maar ... expresses an unfulfilled wish; maar may stand right after ik or after die baan."}
  nl.c1.unit05.lesson02.exercise07.schrijf_spijt: {instruction: "Translate into Dutch, starting with Achteraf gezien and using er ... over: \"In hindsight I should have thought about it better.\"", accepted_answers: [{value: "Achteraf gezien had ik er beter over moeten nadenken.", status: correct}, {value: "Achteraf gezien had ik er beter over na moeten denken.", status: correct}], feedback: "Achteraf gezien frames the regret from the present; had ik er beter over moeten nadenken says you ought to have thought it over better; the separable verb may also split: na moeten denken."}
  nl.c1.unit05.lesson03.exercise01.herken_woonde: {instruction: "What kind of conditional is this?", correct_option: "A mixed conditional: past condition, present consequence.", distractors: ["A simple future plan.", "A real past statement.", "An order."], accepted_answers: [{value: "A mixed conditional: past condition, present consequence.", status: correct}], feedback: "Pluperfect als-clause + past-form woonde = mixed."}
  nl.c1.unit05.lesson03.exercise02.herken_ontmoet: {instruction: "What does Dan had ik jou nooit ontmoet add?", correct_option: "An emotional consequence of the alternative.", distractors: ["A fact about today.", "A command.", "A neutral description."], accepted_answers: [{value: "An emotional consequence of the alternative.", status: correct}], feedback: "*Nooit ontmoet* is a second, personal consequence."}
  nl.c1.unit05.lesson03.exercise03.koppel_gemengd: {instruction: "Match each Dutch mixed-conditional element to its clue.", pairs: [{left: "woonde ik nu", right: "I would now live (past form)"}, {left: "zou ik wonen", right: "I would live (with zou)"}, {left: "nooit ontmoet", right: "never met"}, {left: aangenomen, right: "accepted"}, {left: "gemengde voorwaarde", right: "mixed conditional"}, {left: gevolg, right: "consequence"}, {left: heden, right: "the present"}, {left: jou, right: "you (object)"}], accepted_answers: [{value: [{left: "woonde ik nu", right: "I would now live (past form)"}, {left: "zou ik wonen", right: "I would live (with zou)"}, {left: "nooit ontmoet", right: "never met"}, {left: aangenomen, right: "accepted"}, {left: "gemengde voorwaarde", right: "mixed conditional"}, {left: gevolg, right: "consequence"}, {left: heden, right: "the present"}, {left: jou, right: "you (object)"}], status: correct}], feedback: "The mixed conditional crosses time reference."}
  nl.c1.unit05.lesson03.exercise04.orden_woonde: {instruction: "Order the exact mixed conditional: Als + ... + had aangenomen, then woonde ik nu in Amsterdam.", accepted_answers: [{value: "Als ik die baan had aangenomen woonde ik nu in Amsterdam", status: correct}], feedback: "Past condition, present-form consequence."}
  nl.c1.unit05.lesson03.exercise05.vertaal_gemengd: {instruction: "Translate with Als ... had aangenomen, then woonde ik nu in Amsterdam.", accepted_answers: [{value: "Als ik die baan had aangenomen, woonde ik nu in Amsterdam.", status: correct}, {value: "Als ik die baan had aangenomen, dan woonde ik nu in Amsterdam.", status: correct}], feedback: "The mixed form uses woonde for the present result."}
  nl.c1.unit05.lesson03.exercise06.spreek_gemengd: {instruction: "Turn this fact into a mixed conditional: an als-clause about the past (pluperfect) and a main clause about the present using the past form of wonen, not zou. Fact: \"Ik heb de baan niet aangenomen, dus ik woon nu niet in Amsterdam.\"", accepted_answers: [{value: "Als ik de baan had aangenomen, woonde ik nu in Amsterdam.", status: correct}, {value: "Als ik de baan had aangenomen, dan woonde ik nu in Amsterdam.", status: correct}, {value: "Als ik de baan aangenomen had, woonde ik nu in Amsterdam.", status: correct}, {value: "Als ik de baan aangenomen had, dan woonde ik nu in Amsterdam.", status: correct}], feedback: "Mixed conditional: pluperfect for the past condition (had aangenomen or aangenomen had), past-form woonde ik nu for the present result. A main-clause dan is optional."}
  nl.c1.unit05.lesson03.exercise07.schrijf_gemengd: {instruction: "Translate into Dutch as one sentence with a single als-clause, using the past form woonde for the present result and had ... ontmoet for the second consequence: \"If I had accepted that job, I would now live in Amsterdam and I would never have met you.\"", accepted_answers: [{value: "Als ik die baan had aangenomen, woonde ik nu in Amsterdam en had ik jou nooit ontmoet.", status: correct}, {value: "Als ik die baan had aangenomen, woonde ik nu in Amsterdam en had ik je nooit ontmoet.", status: correct}, {value: "Als ik die baan had aangenomen, woonde ik nu in Amsterdam en dan had ik jou nooit ontmoet.", status: correct}, {value: "Als ik die baan had aangenomen, woonde ik nu in Amsterdam en dan had ik je nooit ontmoet.", status: correct}, {value: "Als ik die baan had aangenomen, dan woonde ik nu in Amsterdam en had ik jou nooit ontmoet.", status: correct}, {value: "Als ik die baan had aangenomen, dan woonde ik nu in Amsterdam en had ik je nooit ontmoet.", status: correct}, {value: "Als ik die baan had aangenomen, dan woonde ik nu in Amsterdam en dan had ik jou nooit ontmoet.", status: correct}, {value: "Als ik die baan had aangenomen, dan woonde ik nu in Amsterdam en dan had ik je nooit ontmoet.", status: correct}, {value: "Als ik die baan aangenomen had, woonde ik nu in Amsterdam en had ik jou nooit ontmoet.", status: correct}, {value: "Als ik die baan aangenomen had, woonde ik nu in Amsterdam en had ik je nooit ontmoet.", status: correct}, {value: "Als ik die baan aangenomen had, woonde ik nu in Amsterdam en dan had ik jou nooit ontmoet.", status: correct}, {value: "Als ik die baan aangenomen had, woonde ik nu in Amsterdam en dan had ik je nooit ontmoet.", status: correct}, {value: "Als ik die baan aangenomen had, dan woonde ik nu in Amsterdam en had ik jou nooit ontmoet.", status: correct}, {value: "Als ik die baan aangenomen had, dan woonde ik nu in Amsterdam en had ik je nooit ontmoet.", status: correct}, {value: "Als ik die baan aangenomen had, dan woonde ik nu in Amsterdam en dan had ik jou nooit ontmoet.", status: correct}, {value: "Als ik die baan aangenomen had, dan woonde ik nu in Amsterdam en dan had ik je nooit ontmoet.", status: correct}], feedback: "One als-clause carries both consequences: woonde ik nu in Amsterdam, and after en the verb stays first: had ik jou nooit ontmoet. Dan and je/jou variants are accepted."}
  nl.c1.unit05.lesson04.exercise01.herken_feit: {instruction: "What does this sentence state?", correct_option: "What actually happened (the fact).", distractors: ["An unreal alternative.", "A future plan.", "A request."], accepted_answers: [{value: "What actually happened (the fact).", status: correct}], feedback: "*In werkelijkheid* marks the real timeline."}
  nl.c1.unit05.lesson04.exercise02.herken_alternatief: {instruction: "What does this sentence describe?", correct_option: "The unreal present that would follow from a different past.", distractors: ["A real current situation.", "A command.", "A neutral fact."], accepted_answers: [{value: "The unreal present that would follow from a different past.", status: correct}], feedback: "*Anders zat ik nu* is the unreal present."}
  nl.c1.unit05.lesson04.exercise03.koppel_keten: {instruction: "Match each Dutch chain element to its role.", pairs: [{left: "in werkelijkheid", right: "in reality (the fact)"}, {left: afgewezen, right: "turned down"}, {left: "Anders zat ik", right: "otherwise I would be sitting"}, {left: "ver van mijn vrienden", right: "far from my friends"}, {left: "hier bij jullie", right: "here with you all"}, {left: "tegenfeitelijke keten", right: "counterfactual chain"}, {left: feit, right: "what actually happened"}, {left: "gevolg in het heden", right: "present consequence"}], accepted_answers: [{value: [{left: "in werkelijkheid", right: "in reality (the fact)"}, {left: afgewezen, right: "turned down"}, {left: "Anders zat ik", right: "otherwise I would be sitting"}, {left: "ver van mijn vrienden", right: "far from my friends"}, {left: "hier bij jullie", right: "here with you all"}, {left: "tegenfeitelijke keten", right: "counterfactual chain"}, {left: feit, right: "what actually happened"}, {left: "gevolg in het heden", right: "present consequence"}], status: correct}], feedback: "The chain moves fact → condition → consequence."}
  nl.c1.unit05.lesson04.exercise04.orden_werkelijkheid: {instruction: "Order the exact fact: In + werkelijkheid + heb ik + de baan + afgewezen.", accepted_answers: [{value: "In werkelijkheid heb ik de baan afgewezen", status: correct}], feedback: "The fronted adverb triggers inversion heb ik."}
  nl.c1.unit05.lesson04.exercise05.vertaal_alternatief: {instruction: "Translate with Anders zat ik nu in Amsterdam, ver van mijn vrienden.", accepted_answers: [{value: "Anders zat ik nu in Amsterdam, ver van mijn vrienden.", status: correct}], feedback: "The past form zat gives the unreal present."}
  nl.c1.unit05.lesson04.exercise06.spreek_keten: {instruction: "Say the alternative as one sentence with an als-clause (pluperfect, reversing the fact) instead of Anders, keeping the rest. Fact: \"In werkelijkheid heb ik de baan afgewezen.\" Alternative: \"Anders zat ik nu in Amsterdam, ver van mijn vrienden.\"", accepted_answers: [{value: "Als ik de baan had aangenomen, zat ik nu in Amsterdam, ver van mijn vrienden.", status: correct}, {value: "Als ik de baan had aangenomen, dan zat ik nu in Amsterdam, ver van mijn vrienden.", status: correct}, {value: "Als ik de baan aangenomen had, zat ik nu in Amsterdam, ver van mijn vrienden.", status: correct}, {value: "Als ik de baan aangenomen had, dan zat ik nu in Amsterdam, ver van mijn vrienden.", status: correct}, {value: "Als ik de baan niet had afgewezen, zat ik nu in Amsterdam, ver van mijn vrienden.", status: correct}, {value: "Als ik de baan niet had afgewezen, dan zat ik nu in Amsterdam, ver van mijn vrienden.", status: correct}, {value: "Als ik de baan niet afgewezen had, zat ik nu in Amsterdam, ver van mijn vrienden.", status: correct}, {value: "Als ik de baan niet afgewezen had, dan zat ik nu in Amsterdam, ver van mijn vrienden.", status: correct}], feedback: "The als-clause reverses the fact (had aangenomen, or niet had afgewezen); the main clause keeps zat ik nu for the unreal present. A main-clause dan is optional."}
  nl.c1.unit05.lesson04.exercise07.schrijf_keten: {instruction: "Rewrite this counterfactual as the real fact (perfect tense, ik-form) followed by the unreal present introduced by Anders, keeping the rest of that clause: \"Als ik de baan had aangenomen, zat ik nu in Amsterdam, ver van mijn vrienden.\"", accepted_answers: [{value: "Ik heb de baan afgewezen. Anders zat ik nu in Amsterdam, ver van mijn vrienden.", status: correct}, {value: "Ik heb de baan afgewezen, want anders zat ik nu in Amsterdam, ver van mijn vrienden.", status: correct}, {value: "Ik heb de baan niet aangenomen. Anders zat ik nu in Amsterdam, ver van mijn vrienden.", status: correct}, {value: "Ik heb de baan niet aangenomen, want anders zat ik nu in Amsterdam, ver van mijn vrienden.", status: correct}, {value: "In werkelijkheid heb ik de baan afgewezen. Anders zat ik nu in Amsterdam, ver van mijn vrienden.", status: correct}, {value: "In werkelijkheid heb ik de baan afgewezen, want anders zat ik nu in Amsterdam, ver van mijn vrienden.", status: correct}, {value: "In werkelijkheid heb ik de baan niet aangenomen. Anders zat ik nu in Amsterdam, ver van mijn vrienden.", status: correct}, {value: "In werkelijkheid heb ik de baan niet aangenomen, want anders zat ik nu in Amsterdam, ver van mijn vrienden.", status: correct}], feedback: "Anders replaces the als-clause: first the real fact (afgewezen or niet aangenomen, optionally with In werkelijkheid), then the unreal present. Ik heb de baan afgewezen, want anders zat ik ... is also accepted."}
  nl.c1.unit05.lesson05.exercise01.lees_feit: {instruction: "What actually happened in the real timeline?", correct_option: "He turned the job down and stayed.", distractors: ["He moved to Amsterdam.", "He never received a job offer.", "He regrets moving."], accepted_answers: [{value: "He turned the job down and stayed.", status: correct}], feedback: "The text states he rejected the offer and stayed."}
  nl.c1.unit05.lesson05.exercise02.lees_alternatief: {instruction: "What is the unreal alternative the text describes?", correct_option: "He would have moved and would now live in Amsterdam.", distractors: ["He stayed in Amsterdam.", "He accepted the job and stayed.", "There was no alternative."], accepted_answers: [{value: "He would have moved and would now live in Amsterdam.", status: correct}], feedback: "*Als ik ... had aangenomen, was ik verhuisd* gives the unreal path."}
  nl.c1.unit05.lesson05.exercise03.koppel_tijdlijn: {instruction: "Match each Dutch timeline element to its meaning.", pairs: [{left: feit, right: "what actually happened"}, {left: "onwerkelijke voorwaarde", right: "the unreal condition"}, {left: "gevolg in het heden", right: "the present consequence"}, {left: spijt, right: "regret"}, {left: tijdlijn, right: "timeline"}, {left: blijven, right: "to stay"}, {left: wilde, right: "wanted (past)"}, {left: want, right: "because (reason)"}], accepted_answers: [{value: [{left: feit, right: "what actually happened"}, {left: "onwerkelijke voorwaarde", right: "the unreal condition"}, {left: "gevolg in het heden", right: "the present consequence"}, {left: spijt, right: "regret"}, {left: tijdlijn, right: "timeline"}, {left: blijven, right: "to stay"}, {left: wilde, right: "wanted (past)"}, {left: want, right: "because (reason)"}], status: correct}], feedback: "Fact and alternative sit on two timelines."}
  nl.c1.unit05.lesson05.exercise04.orden_tijdlijn: {instruction: "Order the chain labels: feit, onwerkelijke voorwaarde, gevolg in het heden, spijt.", accepted_answers: [{value: "feit onwerkelijke voorwaarde gevolg in het heden spijt", status: correct}], feedback: "Fact first, then condition, consequence, regret."}
  nl.c1.unit05.lesson05.exercise05.vertaal_woonde: {instruction: "Translate with Dan woonde ik nu misschien in Amsterdam, ver van mijn vrienden.", accepted_answers: [{value: "Dan woonde ik nu misschien in Amsterdam, ver van mijn vrienden.", status: correct}], feedback: "The mixed form with misschien for the present consequence."}
  nl.c1.unit05.lesson05.exercise06.spreek_tijdlijn: {instruction: "Translate into Dutch, using zou + infinitive rather than the past form: \"Then I would perhaps live in Amsterdam now.\"", accepted_answers: [{value: "Dan zou ik nu misschien in Amsterdam wonen.", status: correct}, {value: "Dan zou ik misschien nu in Amsterdam wonen.", status: correct}, {value: "Dan zou ik nu wellicht in Amsterdam wonen", status: correct}, {value: "Dan zou ik wellicht nu in Amsterdam wonen", status: correct}], feedback: "The mixed consequence can use zou + infinitive: Dan zou ik nu misschien in Amsterdam wonen; nu and misschien may swap places."}
  nl.c1.unit05.lesson05.exercise07.schrijf_tijdlijn: {instruction: "Translate into Dutch, starting with an omdat-clause (the reason first, so the main clause inverts) and using the perfect tense (heb ... afgewezen) in the main clause: \"Because I wanted to stay here, I turned that job down.\"", accepted_answers: [{value: "Omdat ik hier wilde blijven, heb ik die baan afgewezen.", status: correct}, {value: "Omdat ik hier blijven wilde, heb ik die baan afgewezen.", status: correct}, {value: "Omdat ik hier wilde blijven, heb ik de baan afgewezen.", status: correct}, {value: "Omdat ik hier blijven wilde, heb ik de baan afgewezen.", status: correct}, {value: "Omdat ik hier wou blijven, heb ik die baan afgewezen.", status: correct}, {value: "Omdat ik hier blijven wou, heb ik die baan afgewezen.", status: correct}, {value: "Omdat ik hier wou blijven, heb ik de baan afgewezen.", status: correct}, {value: "Omdat ik hier blijven wou, heb ik de baan afgewezen.", status: correct}], feedback: "After omdat the finite verb goes to the end of the clause (hier wilde blijven, or hier blijven wilde); the main clause then inverts: heb ik die baan afgewezen."}
  nl.c1.unit05.lesson06.exercise01.luister_analyse: {instruction: "Listen and identify the sequence of Omar's reasoning.", correct_option: "fact → unreal past → present consequence → no regret", distractors: ["unreal past → fact → future plan → apology", "regret → fact → command → silence", "present consequence → fact → unreal past → regret"], accepted_answers: [{value: "fact → unreal past → present consequence → no regret", status: correct}], feedback: "The audio moves from the real event through the unreal path to the present, then expresses no regret."}
  nl.c1.unit05.lesson06.exercise02.lees_analyse: {instruction: "Which map correctly identifies the moves in Omar's reasoning?", correct_option: "fact → unreal condition → present consequence → no regret", distractors: ["regret → regret → regret → regret", "fact → command → apology → silence", "consequence → condition → unrelated topic"], accepted_answers: [{value: "fact → unreal condition → present consequence → no regret", status: correct}], feedback: "Each move has a distinct function in the chain."}
  nl.c1.unit05.lesson06.exercise03.koppel_analyse: {instruction: "Match each Dutch analysis phrase to its function.", pairs: [{left: afgewezen, right: "the fact (turned down)"}, {left: "had aangenomen", right: "the unreal past condition"}, {left: "was verhuisd", right: "the unreal past consequence"}, {left: "woonde ik nu", right: "the present consequence"}, {left: "achteraf gezien", right: "signals the regret judgement"}, {left: "geen spijt", right: "states no regret"}, {left: "leren kennen", right: "got to know"}], accepted_answers: [{value: [{left: afgewezen, right: "the fact (turned down)"}, {left: "had aangenomen", right: "the unreal past condition"}, {left: "was verhuisd", right: "the unreal past consequence"}, {left: "woonde ik nu", right: "the present consequence"}, {left: "achteraf gezien", right: "signals the regret judgement"}, {left: "geen spijt", right: "states no regret"}, {left: "leren kennen", right: "got to know"}], status: correct}], feedback: "Together the phrases realize the literal outcome."}
  nl.c1.unit05.lesson06.exercise04.orden_analyse: {instruction: "Order the chain labels: feit, onwerkelijke voorwaarde, gevolg in het heden, spijt.", accepted_answers: [{value: "feit onwerkelijke voorwaarde gevolg in het heden spijt", status: correct}], feedback: "The analysis follows the chain in order."}
  nl.c1.unit05.lesson06.exercise05.spreek_analyse: {instruction: "Say this sentence with omdat instead of want, keeping the same sentence order (verbs to the end of the omdat-clause): \"Achteraf gezien heb ik geen spijt, want hier heb ik jullie leren kennen.\"", accepted_answers: [{value: "Achteraf gezien heb ik geen spijt, omdat ik jullie hier heb leren kennen.", status: correct}, {value: "Achteraf gezien heb ik geen spijt, omdat ik hier jullie heb leren kennen.", status: correct}], feedback: "After omdat the verbs go to the end: omdat ik jullie hier heb leren kennen. Hier and jullie may swap."}
  nl.c1.unit05.lesson06.exercise06.schrijf_analyse: {instruction: "Translate into Dutch without Als, using inversion in the conditional clause and the pluperfect in both clauses: \"Had I accepted that job, I would have moved.\"", accepted_answers: [{value: "Had ik die baan aangenomen, was ik verhuisd.", status: correct}, {value: "Had ik die baan aangenomen, dan was ik verhuisd.", status: correct}], feedback: "Dropping Als, the auxiliary had moves to the front of the conditional clause: Had ik die baan aangenomen. The main clause is unchanged; dan is optional."}
  nl.c1.unit05.lesson06.exercise07.dictaat_kern: {instruction: "Type exactly what you hear.", correct_response: "Als ik die baan had aangenomen, was ik verhuisd.", orthography_strict: true, feedback: "The audio contains a single past counterfactual."}
