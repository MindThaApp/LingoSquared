course:
  title: "Dutch A1"
  description: "Beginner Dutch for describing free-time activities: hobby vocabulary, frequency expressions, asking and answering what someone does in their free time, and comparing two people's hobbies."

units:
  nl.a1.unit29.hobbies: {title: "Hobbies and free time"}

lessons:
  nl.a1.unit29.lesson01.lezen_sporten_koken: {title: "Reading, exercising, and cooking"}
  nl.a1.unit29.lesson02.muziek_tekenen_gamen: {title: "Music, drawing, and gaming"}
  nl.a1.unit29.lesson03.vrije_tijd_vraag: {title: "What do you do in your free time?"}
  nl.a1.unit29.lesson04.taalcafe_hobbies: {title: "Lotte and Omar talk about hobbies"}
  nl.a1.unit29.lesson05.hobbys_vergelijken: {title: "Omar and Lotte compare their hobbies"}
  nl.a1.unit29.lesson06.weekend_plan: {title: "Planning a weekend together"}

teaching:
  nl.a1.unit29.lesson01.teach.hobbies_set1: {title: "Reading, exercising, cooking", gloss: "to read, to exercise / play sports, to cook", note: "Three common hobby verbs: *lezen* (to read), *sporten* (to exercise or play sports), and *koken* (to cook).", example_gloss: ["I like reading a book.", "I exercise on Saturdays.", "I like cooking for friends."]}
  nl.a1.unit29.lesson01.teach.vrije_tijd: {title: "Free time", gloss: "free time", note: "*De vrije tijd* is a common gender noun: *de vrije tijd*. It's the key phrase for talking about hobbies.", example_gloss: "In my free time, I like to read."}
  nl.a1.unit29.lesson01.teach.in_vrije_tijd: {title: "Saying what you do in your free time", gloss: "In my free time, I like to read.", note: "*Lees* is the first-person singular of *lezen* (to read)."}

  nl.a1.unit29.lesson02.teach.hobbies_set2: {title: "Music, drawing, gaming", gloss: "to listen to music, to draw, to game", note: "Three more hobby verbs: *muziek luisteren* (to listen to music), *tekenen* (to draw), and *gamen* (to game), a common Dutch loanword from English.", example_gloss: ["I like listening to music.", "I often draw.", "I like gaming with friends."]}
  nl.a1.unit29.lesson02.teach.luister_muziek: {title: "Saying you like listening to music", gloss: "I like listening to music.", note: "*Luisteren naar* (to listen to) always takes *naar* before its object."}
  nl.a1.unit29.lesson02.teach.game_vrienden: {title: "Saying you like gaming with friends", gloss: "I like gaming with friends.", note: "*Met vrienden* (with friends) reuses *vrienden* from lesson01."}

  nl.a1.unit29.lesson03.teach.frequency_set1: {title: "Always, often, sometimes, never", gloss: "always, often, sometimes, never", note: "The four core frequency adverbs. *Vaak* was already introduced back in unit05's *Zie je hem vaak?*; the other three are new here.", example_gloss: ["I always exercise on Saturdays.", "I often read a book.", "I sometimes draw.", "I never game."]}
  nl.a1.unit29.lesson03.teach.frequency_set2: {title: "Every week, every weekend", gloss: "every week, every weekend", note: "*Elke week* and *elk weekend* both mean 'every', but the form changes with the noun's gender -- see the next card.", example_gloss: ["I cook for friends every week.", "I exercise every weekend."]}
  nl.a1.unit29.lesson03.teach.elke_elk_grammar: {title: "Elke vs. elk", gloss: "With de-words like week you use elke. With het-words like weekend you use elk.", note: "*Week* is a de-word (*de week*), so it takes *elke*; *weekend* is a het-word (*het weekend*), so it takes *elk* -- the same de/het agreement pattern behind *de rekening* vs. *het wisselgeld* in unit23."}
  nl.a1.unit29.lesson03.teach.vrije_tijd_vraag: {title: "Asking about free time", gloss: "What do you do in your free time?", note: "This is the core question of this unit -- reuse it to ask anyone about their hobbies."}

  nl.a1.unit29.lesson04.teach.lotte_callback: {title: "Lotte brings up hobbies", gloss: "Lotte: We often walk together. But what else do you do in your free time, Omar?", note: "*We wandelen vaak samen* callbacks to unit13, where both Lotte and Omar said they like *wandelen*."}
  nl.a1.unit29.lesson04.teach.omar_cook_sport: {title: "Omar's hobbies", gloss: "Omar: I like cooking, at home too. And I exercise often.", note: "*Ook thuis* (at home too) clarifies Omar cooks for fun, not just at his restaurant job."}
  nl.a1.unit29.lesson04.teach.lotte_surprised: {title: "Lotte is surprised", gloss: "Lotte: You cook at home too? You already cook all day at your job!", note: "*Al de hele dag* (already all day) emphasizes how much Omar already cooks at work."}
  nl.a1.unit29.lesson04.teach.omar_relaxing: {title: "Omar explains", gloss: "Omar: Yes, but I find cooking relaxing. And you, what do you like doing?", note: "*Koken vind ik ontspannend* fronts the object *koken* for emphasis -- literally 'cooking, I find it relaxing'."}
  nl.a1.unit29.lesson04.teach.lotte_reads_music: {title: "Lotte's hobbies", gloss: "Lotte: I like reading and I often listen to music.", note: "Combines two hobby verbs from lessons01-02 in one sentence with *en* (and)."}
  nl.a1.unit29.lesson04.teach.omar_ask_game: {title: "Omar asks about gaming", gloss: "Omar: Do you also game?", note: "A short yes/no question using *gamen* from lesson02."}
  nl.a1.unit29.lesson04.teach.lotte_no_game_draw: {title: "Lotte answers", gloss: "Lotte: No, I never game. But I sometimes draw!", note: "*Nooit* (never) and *soms* (sometimes) from lesson03, contrasted in one answer."}

  nl.a1.unit29.lesson05.teach.vergelijking:
    title: "Comparing hobbies"
    gloss: "Omar and I often walk together. But we also have other hobbies. Omar likes cooking, at home too, and he exercises often. I like reading and I often listen to music. I sometimes draw, but I never game. What do you like doing in your free time?"
    note: "Lotte's message recaps facts from lesson04 and ends by asking the reader the unit's core question."
    glosses:
      wandelen: "walk"
      vaak: "often"
      samen: "together"
      andere: "other"
      kookt: "cooks"
      graag: "likes to"
      thuis: "at home"
      sport: "exercises"
      lees: "read"
      luister: "listen"
      muziek: "music"
      teken: "draw"
      soms: "sometimes"
      game: "play video games"
      nooit: "never"
      vrije: "free"
      tijd: "time"

  nl.a1.unit29.lesson06.teach.omar_ask_weekend: {title: "Omar asks about the weekend", gloss: "Omar: What are you doing this weekend?", note: "*Dit weekend* (this weekend) reuses the time expression from unit19."}
  nl.a1.unit29.lesson06.teach.lotte_unsure: {title: "Lotte is undecided", gloss: "Lotte: I don't know yet. I like reading, but I also want to go outside.", note: "*Naar buiten* (outside, literally 'to outside') is a common way to say you want to leave the house."}
  nl.a1.unit29.lesson06.teach.omar_suggest_walk_cook: {title: "Omar suggests a plan", gloss: "Omar: Shall we walk together? I'll cook for us afterward.", note: "*Daarna* (afterward) reuses the sequencing word from unit10's *eerst, dan, daarna*."}
  nl.a1.unit29.lesson06.teach.lotte_agree_both: {title: "Lotte agrees", gloss: "Lotte: Good idea! I like both walking and cooking.", note: "*Allebei* (both) shows Lotte likes two things equally, not one over the other."}
  nl.a1.unit29.lesson06.teach.omar_confirm_saturday: {title: "Omar confirms", gloss: "Omar: Perfect. Then I'll see you Saturday!", note: "A friendly closing line confirming the plan for *zaterdag* (Saturday)."}

