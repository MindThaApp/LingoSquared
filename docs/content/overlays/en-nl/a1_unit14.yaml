course:
  title: "Dutch A1"
  description: "Beginner Dutch for making and understanding basic comparisons between familiar people, objects, and options."

units:
  nl.a1.unit14.comparisons: {title: "Making comparisons"}

lessons:
  nl.a1.unit14.lesson01.grootte_vergelijken: {title: "Bigger or smaller?"}
  nl.a1.unit14.lesson02.prijzen_vergelijken: {title: "Cheaper or more expensive?"}
  nl.a1.unit14.lesson03.net_zo_als: {title: "Just as pretty as"}
  nl.a1.unit14.lesson04.de_beste_keuze: {title: "The best choice"}
  nl.a1.unit14.lesson05.advertentie_lezen: {title: "Reading an advertisement"}
  nl.a1.unit14.lesson06.lotte_en_omar_kiezen_tas: {title: "Lotte and Omar choose a bag"}

teaching:
  nl.a1.unit14.lesson01.teach.comparative_rule: {title: "Forming the comparative", gloss: "In comparisons, you often add -er to the adjective and use dan.", note: "*Dan* is the Dutch equivalent of than. It always follows the comparative adjective."}
  nl.a1.unit14.lesson01.teach.groot_klein: {title: "Big, small", gloss: "big, small", note: "*Groot* and *klein* are the base adjectives, before adding -er.", example_gloss: ["The backpack is big.", "The bag is small."]}
  nl.a1.unit14.lesson01.teach.rugzak_groter: {title: "The backpack is bigger", gloss: "The backpack is bigger than the bag.", note: "*Groter* is *groot* + *er*; *dan* introduces the second item being compared."}
  nl.a1.unit14.lesson01.teach.tas_kleiner: {title: "The bag is smaller", gloss: "The bag is smaller than the backpack.", note: "*Kleiner* is *klein* + *er*, following the same pattern."}

  nl.a1.unit14.lesson02.teach.rugzak_price: {title: "The backpack's price", gloss: "The backpack costs forty-five euros.", note: "*Kost* is the third-person singular of *kosten*, to cost."}
  nl.a1.unit14.lesson02.teach.tas_price: {title: "The bag's price", gloss: "The bag costs twenty euros.", note: "A lower price than the backpack, set up for the comparison that follows."}
  nl.a1.unit14.lesson02.teach.duur_goedkoop: {title: "Expensive, cheap", gloss: "expensive, cheap", note: "*Duur* and *goedkoop* are the base adjectives, before adding *-der*/*-er*.", example_gloss: ["The backpack is expensive.", "The bag is cheap."]}
  nl.a1.unit14.lesson02.teach.rugzak_duurder: {title: "The backpack is more expensive", gloss: "The backpack is more expensive than the bag.", note: "*Duurder* is *duur* + *der*. Dutch adds *-der* rather than a doubled *-er* after a word already ending in r."}
  nl.a1.unit14.lesson02.teach.tas_goedkoper: {title: "The bag is cheaper", gloss: "The bag is cheaper than the backpack.", note: "*Goedkoper* is *goedkoop* + *er*, the mirror image of the previous sentence."}

  nl.a1.unit14.lesson03.teach.equality_rule: {title: "Comparing equally", gloss: "Use net zo plus the adjective plus als to compare two things as equal.", note: "This is the Dutch equivalent of the English 'just as ... as' pattern."}
  nl.a1.unit14.lesson03.teach.mooi: {title: "Equally nice-looking", gloss: "This backpack is just as nice-looking as that bag.", note: "*Mooi* (nice-looking, pretty) sits between *net zo* and *als*, unchanged -- no -er ending in this pattern."}
  nl.a1.unit14.lesson03.teach.praktisch: {title: "Equally practical", gloss: "The backpack is just as practical as the bag.", note: "Any plain adjective can fill this same *net zo ... als* slot."}

  nl.a1.unit14.lesson04.teach.superlative_rule: {title: "Forming the superlative", gloss: "For a superlative, you often use het plus the adjective plus st.", note: "This predicative form (used after *is*) takes *het* regardless of the noun's gender."}
  nl.a1.unit14.lesson04.teach.duurst: {title: "The most expensive of the two", gloss: "Of these two, the backpack is the most expensive.", note: "*Duurst* is *duur* + *st*. Dutch can use a superlative even when comparing only two options, the same way English sometimes says 'the best of the two.'"}
  nl.a1.unit14.lesson04.teach.irregular_rule: {title: "Irregular: goed, beter, best", gloss: "Goed, beter, best are irregular: this is the best choice. Veel, meer, meest works the same way.", note: "Like English good/better/best and much/more/most, neither chain (*goed/beter/best*, *veel/meer/meest*) follows the regular -er/-st pattern."}
  nl.a1.unit14.lesson04.teach.beste_keuze: {title: "The best choice for the trip", gloss: "This backpack is the best choice for a long train trip.", note: "*Beste* is the attributive form (before a noun), taking the -e ending that Dutch adjectives usually add before a noun."}
  nl.a1.unit14.lesson04.teach.meer_ruimte: {title: "More room", gloss: "The backpack has more room than the bag.", note: "*Meer* is the irregular comparative of *veel* (much/many), the same way English uses more instead of 'muchier.'"}

  nl.a1.unit14.lesson05.teach.advertentie:
    title: "Read a shop advertisement"
    gloss: "Backpack Bergsport: forty-five euros. This backpack is big and strong. Shoulder bag Stad: twenty euros. This bag is smaller and lighter than the backpack, but less strong. For a long trip the backpack is the best choice, because it is stronger and has more room."
    note: "Track the two products' prices, sizes, and which one the ad recommends and why."
    glosses:
      Rugzak: "backpack"
      vijfenveertig: "forty-five"
      euro: "euros"
      groot: "big"
      sterk: "strong"
      Schoudertas: "shoulder bag"
      twintig: "twenty"
      tas: "bag"
      kleiner: "smaller"
      lichter: "lighter"
      minder: "less"
      lange: "long"
      reis: "trip / journey"
      beste: "best"
      keuze: "choice"
      sterker: "stronger"
      ruimte: "room / space"

  nl.a1.unit14.lesson06.teach.lotte_open: {title: "Lotte points out the size", gloss: "Lotte: Look, this backpack is bigger than that bag.", note: "*Kijk* (look) is a common way to draw someone's attention to something."}
  nl.a1.unit14.lesson06.teach.omar_room: {title: "Omar explains why he needs it", gloss: "Omar: Yes, and it has more room. I need a big bag for the train trip.", note: "*Nodig hebben* (to need) is a fixed combination; the thing you need goes between *hebben* and *nodig*."}
  nl.a1.unit14.lesson06.teach.lotte_best_choice: {title: "Lotte confirms the choice", gloss: "Lotte: Then the backpack is the best choice for you.", note: "*Dan* here means 'in that case,' not the comparative *dan* from lesson01 -- the same spelling covers both uses."}
  nl.a1.unit14.lesson06.teach.omar_question: {title: "Omar asks Lotte's opinion", gloss: "Omar: Exactly. Which bag do you think is prettiest?", note: "*Vind jij het mooist* reuses the express-an-opinion pattern from Unit 13's *vinden* lessons."}
  nl.a1.unit14.lesson06.teach.lotte_choice: {title: "Lotte picks the shoulder bag", gloss: "Lotte: I think this shoulder bag is prettiest. And it's light.", note: "*Licht* (light in weight) is a new, useful adjective for describing bags and luggage."}
  nl.a1.unit14.lesson06.teach.omar_close: {title: "They settle the decision", gloss: "Omar: Good, then I'll buy the backpack and you the shoulder bag.", note: "The second clause drops the repeated verb *koop* -- natural in spoken Dutch when it's already clear from context."}
  nl.a1.unit14.lesson06.teach.koopt_form: {title: "Koop vs. koopt", gloss: "Koop is the I-form of kopen (to buy); koopt is the he/she-form.", note: "Regular present-tense pattern: *ik koop*, *jij/hij/zij koopt*."}

exercises:
  nl.a1.unit14.lesson01.exercise01.choose_bigger:
    instruction: "Choose the Dutch sentence meaning 'The backpack is bigger than the bag.'"
    correct_option: "De rugzak is groter dan de tas."
    distractors: ["De rugzak is groot dan de tas.", "De rugzak is groter als de tas.", "De tas is groter dan de rugzak."]
    accepted_answers: [{value: "De rugzak is groter dan de tas.", status: correct}]
    feedback: "Groter (groot + er) plus dan makes the comparison."
  nl.a1.unit14.lesson01.exercise02.listen_bigger:
    instruction: "Listen and choose what the speaker says."
    correct_option: "The backpack is bigger than the bag."
    distractors: ["The bag is bigger than the backpack.", "The backpack is smaller than the bag.", "The backpack is more expensive than the bag."]
    accepted_answers: [{value: "The backpack is bigger than the bag.", status: correct}]
    feedback: "De rugzak is groter dan de tas."
  nl.a1.unit14.lesson01.exercise03.match_adjectives:
    instruction: "Match each Dutch word to its meaning."
    accepted_answers: [{value: [{left: groot, right: big}, {left: groter, right: bigger}, {left: klein, right: small}, {left: kleiner, right: smaller}, {left: rugzak, right: backpack}, {left: tas, right: bag}], status: correct}]
    feedback: "Add -er to the base adjective to form the comparative."
  nl.a1.unit14.lesson01.exercise04.order_smaller:
    instruction: "Put the words in order to say that the bag is smaller than the backpack."
    correct_option: "De tas is kleiner dan de rugzak"
    accepted_answers: [{value: "De tas is kleiner dan de rugzak", status: correct}]
    feedback: "The complete sentence is De tas is kleiner dan de rugzak."
  nl.a1.unit14.lesson01.exercise05.listen_order_bigger:
    instruction: "Listen and put the words in the order you hear."
    correct_option: "De rugzak is groter dan de tas"
    accepted_answers: [{value: "De rugzak is groter dan de tas", status: correct}]
    feedback: "The complete sentence is De rugzak is groter dan de tas."
  nl.a1.unit14.lesson01.exercise06.complete_bigger:
    instruction: "Complete the comparison: the backpack is bigger than the bag."
    accepted_answers: [{value: groter, status: correct}]
    feedback: "De rugzak is groter dan de tas."
  nl.a1.unit14.lesson01.exercise07.write_smaller:
    instruction: "Write the Dutch sentence."
    accepted_answers: [{value: "De tas is kleiner dan de rugzak.", status: correct}, {value: "De tas is kleiner dan de rugzak", status: correct}]
    feedback: "De tas is kleiner dan de rugzak."

  nl.a1.unit14.lesson01.exercise08.dictation_de_rugzak_is_groter:
    instruction: "Type what you hear."
    correct_option: "De rugzak is groter dan de tas"
    accepted_answers: [{value: "De rugzak is groter dan de tas", status: correct}]
    orthography_strict: true

  nl.a1.unit14.lesson02.exercise01.choose_expensive:
    instruction: "Choose the Dutch sentence meaning 'The backpack is more expensive than the bag.'"
    correct_option: "De rugzak is duurder dan de tas."
    distractors: ["De rugzak is duur dan de tas.", "De rugzak is duurder als de tas.", "De tas is duurder dan de rugzak."]
    accepted_answers: [{value: "De rugzak is duurder dan de tas.", status: correct}]
    feedback: "Duurder (duur + der) plus dan makes the comparison."
  nl.a1.unit14.lesson02.exercise02.listen_cheaper:
    instruction: "Listen and choose what the speaker says."
    correct_option: "The bag is cheaper than the backpack."
    distractors: ["The backpack is cheaper than the bag.", "The bag is more expensive than the backpack.", "The bag is bigger than the backpack."]
    accepted_answers: [{value: "The bag is cheaper than the backpack.", status: correct}]
    feedback: "De tas is goedkoper dan de rugzak."
  nl.a1.unit14.lesson02.exercise03.match_price_adjectives:
    instruction: "Match each base adjective to its comparative form."
    accepted_answers: [{value: [{left: goedkoop, right: goedkoper}, {left: duur, right: duurder}, {left: groot, right: groter}, {left: klein, right: kleiner}], status: correct}]
    feedback: "Goedkoop adds -er; duur adds -der."
  nl.a1.unit14.lesson02.exercise04.order_expensive:
    instruction: "Put the words in order to say that the backpack is more expensive than the bag."
    correct_option: "De rugzak is duurder dan de tas"
    accepted_answers: [{value: "De rugzak is duurder dan de tas", status: correct}]
    feedback: "The complete sentence is De rugzak is duurder dan de tas."
  nl.a1.unit14.lesson02.exercise05.listen_order_cheaper:
    instruction: "Listen and put the words in the order you hear."
    correct_option: "De tas is goedkoper dan de rugzak"
    accepted_answers: [{value: "De tas is goedkoper dan de rugzak", status: correct}]
    feedback: "The complete sentence is De tas is goedkoper dan de rugzak."
  nl.a1.unit14.lesson02.exercise06.complete_cheaper:
    instruction: "Complete the comparison: the bag is cheaper than the backpack."
    accepted_answers: [{value: goedkoper, status: correct}]
    feedback: "De tas is goedkoper dan de rugzak."
  nl.a1.unit14.lesson02.exercise07.respond_cheaper:
    instruction: "Answer in Dutch: say that the bag is cheaper."
    accepted_answers: [{value: "De tas is goedkoper.", status: correct}, {value: "De tas is goedkoper", status: correct}, {value: "De tas is goedkoper dan de rugzak.", status: correct}, {value: "De tas is goedkoper dan de rugzak", status: correct}]
    feedback: "De tas is goedkoper (than the backpack)."

  nl.a1.unit14.lesson03.exercise01.choose_equal_looks:
    instruction: "Choose the Dutch sentence meaning 'This backpack is just as nice-looking as that bag.'"
    correct_option: "Deze rugzak is net zo mooi als die tas."
    distractors: ["Deze rugzak is net zo mooier als die tas.", "Deze rugzak is zo mooi net als die tas.", "Deze rugzak is net zo mooi dan die tas."]
    accepted_answers: [{value: "Deze rugzak is net zo mooi als die tas.", status: correct}]
    feedback: "Net zo + adjective + als expresses equality; the adjective stays in its base form."
  nl.a1.unit14.lesson03.exercise02.listen_equal_practical:
    instruction: "Listen and choose what the speaker says."
    correct_option: "The backpack is just as practical as the bag."
    distractors: ["The backpack is more practical than the bag.", "The bag is just as practical as the backpack.", "The backpack is just as expensive as the bag."]
    accepted_answers: [{value: "The backpack is just as practical as the bag.", status: correct}]
    feedback: "De rugzak is net zo praktisch als de tas."
  nl.a1.unit14.lesson03.exercise03.match_equal_meaning:
    instruction: "Match each Dutch word or expression to its meaning."
    accepted_answers: [{value: [{left: "net zo mooi als", right: "equally nice-looking"}, {left: "net zo praktisch als", right: "equally practical"}, {left: groot, right: big}, {left: klein, right: small}, {left: duur, right: expensive}, {left: goedkoop, right: cheap}, {left: mooi, right: "nice-looking"}, {left: praktisch, right: practical}], status: correct}]
    feedback: "Net zo ... als always expresses equality between the two things compared."
  nl.a1.unit14.lesson03.exercise04.order_equal_looks:
    instruction: "Put the words in order to say this backpack is just as nice-looking as that bag."
    correct_option: "Deze rugzak is net zo mooi als die tas"
    accepted_answers: [{value: "Deze rugzak is net zo mooi als die tas", status: correct}]
    feedback: "The complete sentence is Deze rugzak is net zo mooi als die tas."
  nl.a1.unit14.lesson03.exercise05.complete_equal_practical:
    instruction: "Complete the equal comparison: the backpack is just as practical as the bag."
    accepted_answers: [{value: praktisch, status: correct}]
    feedback: "De rugzak is net zo praktisch als de tas."
  nl.a1.unit14.lesson03.exercise06.translate_equal_looks:
    instruction: "Translate into Dutch using net zo ... als."
    accepted_answers: [{value: "Deze rugzak is net zo mooi als die tas.", status: correct}, {value: "Deze rugzak is net zo mooi als die tas", status: correct}]
    feedback: "Deze rugzak is net zo mooi als die tas."

  nl.a1.unit14.lesson04.exercise01.choose_most_expensive:
    instruction: "Choose the Dutch sentence meaning 'Of these two, the backpack is the most expensive.'"
    correct_option: "Van deze twee is de rugzak het duurst."
    distractors: ["Van deze twee is de rugzak de duurst.", "Van deze twee is de rugzak duurst.", "Van deze twee is de rugzak het duurder."]
    accepted_answers: [{value: "Van deze twee is de rugzak het duurst.", status: correct}]
    feedback: "The predicative superlative always takes het, regardless of gender."
  nl.a1.unit14.lesson04.exercise02.listen_best_choice:
    instruction: "Listen and choose what the speaker says."
    correct_option: "This backpack is the best choice for a long train trip."
    distractors: ["This bag is the best choice for a long train trip.", "This backpack is more expensive for a long train trip.", "This backpack has less room for a long train trip."]
    accepted_answers: [{value: "This backpack is the best choice for a long train trip.", status: correct}]
    feedback: "Deze rugzak is de beste keuze voor een lange treinreis."
  nl.a1.unit14.lesson04.exercise03.match_irregular_chains:
    instruction: "Match each Dutch comparative chain or word to its English equivalent."
    accepted_answers: [{value: [{left: "goed - beter - best", right: "good - better - best"}, {left: "veel - meer - meest", right: "much - more - most"}, {left: "duur - duurder - duurst", right: "expensive - more expensive - most expensive"}, {left: groter, right: bigger}, {left: kleiner, right: smaller}, {left: goedkoper, right: cheaper}], status: correct}]
    feedback: "Both chains are irregular in Dutch, the same way their English equivalents are."
  nl.a1.unit14.lesson04.exercise04.order_more_room:
    instruction: "Put the words in order to say the backpack has more room than the bag."
    correct_option: "De rugzak heeft meer ruimte dan de tas"
    accepted_answers: [{value: "De rugzak heeft meer ruimte dan de tas", status: correct}]
    feedback: "The complete sentence is De rugzak heeft meer ruimte dan de tas."
  nl.a1.unit14.lesson04.exercise05.complete_most_expensive:
    instruction: "Complete the superlative: of these two, the backpack is the most expensive."
    accepted_answers: [{value: duurst, status: correct}]
    feedback: "Van deze twee is de rugzak het duurst."
  nl.a1.unit14.lesson04.exercise06.translate_best_choice:
    instruction: "Translate into Dutch."
    accepted_answers: [{value: "Deze rugzak is de beste keuze voor een lange treinreis.", status: correct}, {value: "Deze rugzak is de beste keuze voor een lange treinreis", status: correct}]
    feedback: "Deze rugzak is de beste keuze voor een lange treinreis."
  nl.a1.unit14.lesson04.exercise07.write_more_room:
    instruction: "Write the Dutch sentence."
    accepted_answers: [{value: "De rugzak heeft meer ruimte dan de tas.", status: correct}, {value: "De rugzak heeft meer ruimte dan de tas", status: correct}]
    feedback: "De rugzak heeft meer ruimte dan de tas."

  nl.a1.unit14.lesson05.exercise01.read_price:
    instruction: "Read the advertisement and choose the backpack's price."
    correct_option: "forty-five euros"
    distractors: ["twenty euros", "fifty euros", "fifteen euros"]
    accepted_answers: [{value: "forty-five euros", status: correct}]
    feedback: "Rugzak Bergsport: vijfenveertig euro."
  nl.a1.unit14.lesson05.exercise02.read_bag_description:
    instruction: "Read the advertisement and choose how the bag compares to the backpack."
    correct_option: "smaller and lighter, but less strong"
    distractors: ["bigger and heavier, but stronger", "the same size, but cheaper", "smaller and stronger"]
    accepted_answers: [{value: "smaller and lighter, but less strong", status: correct}]
    feedback: "The bag is kleiner en lichter dan de rugzak, maar minder sterk."
  nl.a1.unit14.lesson05.exercise03.read_recommendation:
    instruction: "Read the advertisement and choose which item it recommends for a long trip."
    correct_option: "the backpack"
    distractors: ["the bag", "neither", "both equally"]
    accepted_answers: [{value: "the backpack", status: correct}]
    feedback: "Voor een lange reis is de rugzak de beste keuze."
  nl.a1.unit14.lesson05.exercise04.listen_recommendation:
    instruction: "Listen and choose the advertisement's recommendation."
    correct_option: "the backpack, for a long trip"
    distractors: ["the bag, for a long trip", "the backpack, for daily use", "neither product"]
    accepted_answers: [{value: "the backpack, for a long trip", status: correct}]
    feedback: "De rugzak is de beste keuze voor een lange reis."
  nl.a1.unit14.lesson05.exercise05.match_items:
    instruction: "Match each product to its description in the advertisement."
    accepted_answers: [{value: [{left: "Rugzak Bergsport", right: "groot, sterk, 45 euro"}, {left: "Schoudertas Stad", right: "kleiner, lichter, 20 euro"}], status: correct}]
    feedback: "The advertisement contrasts the two products on size, strength, and price."
  nl.a1.unit14.lesson05.exercise06.write_comparison:
    instruction: "Write in Dutch that the backpack is bigger and stronger than the bag, using dan."
    accepted_answers: [{value: "De rugzak is groter en sterker dan de tas.", status: correct}, {value: "De rugzak is groter en sterker dan de tas", status: correct}]
    feedback: "De rugzak is groter en sterker dan de tas."

  nl.a1.unit14.lesson06.exercise01.listen_open:
    instruction: "Listen and choose what Lotte says."
    correct_option: "Look, this backpack is bigger than that bag."
    distractors: ["Look, that bag is bigger than this backpack.", "Look, this backpack is more expensive than that bag.", "Look, this backpack is just as big as that bag."]
    accepted_answers: [{value: "Look, this backpack is bigger than that bag.", status: correct}]
    feedback: "Kijk, deze rugzak is groter dan die tas."
  nl.a1.unit14.lesson06.exercise02.comprehend_room:
    instruction: "Listen to the dialogue and choose why Omar wants the backpack."
    correct_option: "It has more room, for the train trip"
    distractors: ["It is cheaper", "It is prettier", "It is just as practical as the bag"]
    accepted_answers: [{value: "It has more room, for the train trip", status: correct}]
    feedback: "Omar says the backpack heeft meer ruimte and he needs a big bag voor de treinreis."
  nl.a1.unit14.lesson06.exercise03.comprehend_best_choice:
    instruction: "Listen to the dialogue and choose what Lotte calls the backpack for Omar."
