course:
  title: "Dutch A2"
  description: "Elementary-plus Dutch for attending a basic doctor's appointment: booking it, describing symptoms in more detail, and understanding a diagnosis and treatment instructions."

units:
  nl.a2.unit27.huisarts: {title: "A consultation with the doctor"}

lessons:
  nl.a2.unit27.lesson01.afspraak_bij_huisarts: {title: "Making a doctor's appointment"}
  nl.a2.unit27.lesson02.wat_zijn_de_klachten: {title: "What are your symptoms?"}
  nl.a2.unit27.lesson03.de_diagnose: {title: "The diagnosis"}
  nl.a2.unit27.lesson04.recept_en_advies: {title: "The prescription and advice"}
