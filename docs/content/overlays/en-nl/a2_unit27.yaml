teaching:
  nl.a2.unit27.lesson01.teach.huisarts: {title: "Family doctor", gloss: "the family doctor/GP", note: "A common gender noun: de huisarts, reused from unit16's health lessons.", example_gloss: "I would like to make an appointment with the doctor."}
  nl.a2.unit27.lesson01.teach.afspraak_huisarts: {title: "Requesting an appointment", gloss: "I would like to make an appointment with the doctor.", note: "Reuses the afspraak maken pattern from unit24's gemeente visit, now with bij de huisarts."}
  nl.a2.unit27.lesson01.teach.reden_bezoek: {title: "The receptionist asks why", gloss: "What is the reason for your visit?", note: "A standard formal question when booking a medical appointment."}
  nl.a2.unit27.lesson01.teach.paar_dagen_niet_lekker: {title: "Stating how long you've felt unwell", gloss: "I haven't been feeling well for a few days.", note: "Al een paar dagen (for a few days already) extends unit16's voel me niet lekker with a duration."}

  nl.a2.unit27.lesson02.teach.klachten: {title: "Symptoms/complaints", gloss: "the symptoms/complaints", note: "A common gender plural noun: de klachten, the standard medical term for symptoms.", example_gloss: "What are your symptoms?"}
  nl.a2.unit27.lesson02.teach.wat_zijn_klachten: {title: "The doctor asks about symptoms", gloss: "What are your symptoms?", note: "The formal opening question of a consultation."}
  nl.a2.unit27.lesson02.teach.drie_dagen_klachten: {title: "Describing symptoms with duration", gloss: "I've had a headache and fever for three days.", note: "Al drie dagen (for three days already) combines with the present tense heb to describe an ongoing symptom, the same construction as unit24's sinds vorige maand."}
  nl.a2.unit27.lesson02.teach.hoe_erg_pijn: {title: "Asking about severity", gloss: "How bad is the pain?", note: "Hoe erg (how bad) asks about severity, a natural follow-up question."}

  nl.a2.unit27.lesson03.teach.griepje: {title: "Mild flu", gloss: "a mild flu/cold", note: "A neuter noun: het griepje, the diminutive of griep (flu) -- the diminutive softens it to something minor, not a serious illness.", example_gloss: "You probably have a mild flu."}
  nl.a2.unit27.lesson03.teach.waarschijnlijk_griepje: {title: "Giving a probable diagnosis", gloss: "You probably have a mild flu.", note: "Waarschijnlijk (probably) softens the diagnosis appropriately for a doctor speaking before further tests."}
  nl.a2.unit27.lesson03.teach.niet_ernstig: {title: "Reassuring about severity", gloss: "It's not serious.", note: "Ernstig (serious) is the key adjective for describing how severe a condition is."}
  nl.a2.unit27.lesson03.teach.geen_zorgen_formeel: {title: "Formal reassurance", gloss: "Don't worry.", note: "The formal-register counterpart to unit21's informal maak je geen zorgen, using u/zich instead of je."}

  nl.a2.unit27.lesson04.teach.recept: {title: "Prescription", gloss: "the prescription", note: "A neuter noun: het recept.", example_gloss: "I'll prescribe you something."}
  nl.a2.unit27.lesson04.teach.schrijf_voor: {title: "The doctor prescribes something", gloss: "I'll prescribe you something.", note: "Voorschrijven (to prescribe) is a separable verb; voor moves to the end of the clause."}
  nl.a2.unit27.lesson04.teach.pillen_innemen: {title: "Taking medication", gloss: "Take the pills twice a day and rest well.", note: "Innemen (to take medicine) is a separable verb, distinct from nemen alone; in moves to the end of its clause."}
  nl.a2.unit27.lesson04.teach.terugkomen_als: {title: "A conditional follow-up instruction", gloss: "Come back in a week if it doesn't get better.", note: "Als (if) introduces the condition; terugkomen (to come back) is separable, with terug at the end."}
  nl.a2.unit27.lesson04.teach.infinitives_note: {title: "The infinitive forms", gloss: "Taking the pills and coming back are the infinitives of these two separable verbs.", note: "Innemen and terugkomen are the dictionary/infinitive forms, distinct from the conjugated imperative forms (neem ... in, kom ... terug) used elsewhere in this lesson."}

  nl.a2.unit27.lesson05.teach.samenvatting:
    title: "Read a visit summary"
    gloss: "Diagnosis: mild flu. Advice: rest well and drink plenty of water. Take the prescribed pills twice a day. Do you still not feel better after a week? Then make a new appointment."
    note: "Track the diagnosis, the two pieces of lifestyle advice, the medication instruction, and the follow-up condition."
    glosses:
      Diagnose: "diagnosis"
      griepje: "a mild flu (diminutive of griep, softening it to something minor)"
      Advies: "advice"
      rust: "rest (imperative; with 'uit' = rest up)"
      uit: "up (particle of 'rust uit' = rest up)"
      drink: "drink (imperative of drinken)"
      veel: "a lot of, plenty of"
      Neem: "take (imperative of nemen)"
      voorgeschreven: "prescribed (past participle of voorschrijven)"
      pillen: "pills"
      keer: "times ('twee keer' = twice)"
      dag: "day ('per dag' = per day)"
      in: "in (separable particle of 'innemen' = to take medicine)"
      Voelt: "feel ('Voelt u zich' = do you feel)"
      zich: "yourself (reflexive pronoun)"
      na: "after"
      nog: "still (in 'nog steeds' = still)"
      steeds: "still (in 'nog steeds' = still)"
      beter: "better"
      Maak: "make (imperative of maken)"
      dan: "then"
      nieuwe: "new"
      afspraak: "appointment"

  nl.a2.unit27.lesson06.teach.huisarts_ask_symptoms: {title: "The doctor opens the consultation", gloss: "Doctor: Good morning, what are your symptoms?", note: "Reuses the wat zijn uw klachten? question from lesson02."}
  nl.a2.unit27.lesson06.teach.omar_symptoms: {title: "Omar describes his symptoms", gloss: "Omar: I've had a headache and fever for three days.", note: "Matches lesson02's teaching example exactly -- this is Omar's actual visit."}
  nl.a2.unit27.lesson06.teach.huisarts_react_diagnose: {title: "The doctor reacts and diagnoses", gloss: "Doctor: That sounds unpleasant. You probably have a mild flu.", note: "Klinkt (sounds) reuses the pattern from unit18's dat klinkt fijn, here with vervelend (unpleasant) instead."}
  nl.a2.unit27.lesson06.teach.omar_ask_serious: {title: "Omar asks if it's serious", gloss: "Omar: Is it serious?", note: "A short, direct follow-up question using ernstig from lesson03."}
  nl.a2.unit27.lesson06.teach.huisarts_reassure_prescribe: {title: "The doctor reassures and prescribes", gloss: "Doctor: No, it's not serious. I'll prescribe you something.", note: "Combines the reassurance from lesson03 with the prescription pattern from lesson04."}
  nl.a2.unit27.lesson06.teach.omar_thanks_doctor: {title: "Omar thanks the doctor", gloss: "Omar: Thank you, doctor.", note: "Dokter is a common, slightly informal way to address a doctor directly, distinct from huisarts (the professional title)."}
  nl.a2.unit27.lesson06.teach.huisarts_final_instructions: {title: "The doctor gives final instructions", gloss: "Doctor: Take the pills twice a day and rest well. Don't worry.", note: "Combines lesson04's medication instruction with lesson03's formal reassurance."}
  nl.a2.unit27.lesson06.teach.summary_grammar: {title: "Summarizing the visit", gloss: "Omar has a mild flu. He needs to take the pills twice a day.", note: "Moet + infinitive (moet ... innemen) expresses a necessity, with the separable verb's in staying attached to innemen at the end."}

exercises:
  nl.a2.unit27.lesson01.exercise01.choose_appointment_request:
    instruction: "Choose the Dutch sentence meaning 'I would like to make an appointment with the doctor.'"
    correct_option: "Ik wil graag een afspraak maken bij de huisarts."
    distractors: ["Ik wil graag een afspraak maken met de huisarts.", "Ik wil graag de huisarts een afspraak maken.", "Ik wil graag een afspraak bij de huisarts."]
    accepted_answers: [{value: "Ik wil graag een afspraak maken bij de huisarts.", status: correct}]
    feedback: "Bij de huisarts (literally 'at the doctor's') is the standard way to say where the appointment is."
  nl.a2.unit27.lesson01.exercise02.listen_reason_question:
    instruction: "Listen and choose what is asked."
    correct_option: "What is the reason for your visit?"
    distractors: ["What are your symptoms?", "When do you have time?", "How bad is the pain?"]
    accepted_answers: [{value: "What is the reason for your visit?", status: correct}]
    feedback: "Wat is de reden van uw bezoek?"
  nl.a2.unit27.lesson01.exercise03.match_appointment_phrases:
    instruction: "Match each Dutch word or phrase to its meaning."
    accepted_answers: [{value: [{left: "de huisarts", right: "the family doctor"}, {left: "een afspraak maken", right: "to make an appointment"}, {left: "de reden van uw bezoek", right: "the reason for your visit"}, {left: "niet lekker", right: "not well"}], status: correct}]
    feedback: "Huisarts is the doctor; reden van uw bezoek is why you're visiting."
  nl.a2.unit27.lesson01.exercise04.order_appointment_request:
    instruction: "Put the words in order to say you would like to make an appointment with the doctor."
    correct_option: "Ik wil graag een afspraak maken bij de huisarts"
    accepted_answers: [{value: "Ik wil graag een afspraak maken bij de huisarts", status: correct}]
