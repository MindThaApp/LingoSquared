review:
  status: unreviewed
  required_next_reviewer: >-
    Native-Dutch confirmation needed (DRAFT). Confirm the English glosses
    match the intended qualification force (tot op zekere hoogte = "to a
    certain extent", niet per se = "not necessarily", dat hangt ervan af =
    "that depends"), that every matching_pairs right-hand gloss discriminates
    its left on real meaning, that the respond-to-opposing frames read as a
    concession-then-pushback rather than a flat rejection, and that the
    culminating writing/speaking answers (lesson06) accept the punctuation
    forms a correct learner would actually produce. See the realization
    file's review block for the full priority list.
  notes: >-
    Overlay for nl's B2 abstraction unit (discuss abstract ideas and
    values), authored alongside the realization (no adaptable
    upper-intermediate public-domain Dutch source exists; see the
    realization provenance note). English speakers' real interference risks
    for this outcome: (1) English learners tend to state a flat opinion ("I
    think X") and stop; the unit forces a QUALIFIED opinion (opinion frame +
    a qualifier such as tot op zekere hoogte / niet per se) and a DIRECT
    response to an opposing view, not a restatement of one's own; (2) 'niet
    per se' is "not necessarily", not "not per se"/"not at all" -- glossed as
    such; (3) 'dat is waar, maar...' and 'ik snap je punt, toch...' are
    concession-then-pushback moves (agree on a point, then disagree), which
    English learners often flatten into a bare "but"; (4) 'daar ben ik het
    (niet) mee eens' has fixed word order English speakers get wrong (the
    'het ... mee eens' frame), so the production prompts name the exact
    frame. The culminating lesson06 writing prompt names both the frame and
    the content required for each sentence so a correct answer is
    well-determined; four punctuation variants are supplied for its
    two-sentence answer (internal comma present/absent x trailing period
    present/absent). No sibling-direction file (nl-en b2) was consulted.

course:
  title: Dutch B2
  description: >-
    Upper-intermediate Dutch: discuss an abstract topic -- ideas and values
    -- by giving a QUALIFIED opinion (ik vind dat / naar mijn mening +
    tot op zekere hoogte, over het algemeen, niet per se, dat hangt ervan
    af) and responding directly to an opposing view (dat is waar, maar...;
    ik snap je punt, toch...; daar ben ik het (niet) mee eens, omdat...),
    around the everyday debate of whether cities should become car-free.

units:
  nl.b2.unit06.abstractie:
    title: "Abstract ideas and values"
    description: Discuss an abstract topic -- weigh a value, give a qualified opinion rather than a flat one, weigh two sides, and respond directly to an opposing view.

lessons:
  nl.b2.unit06.lesson01.wat_vind_jij:
    title: "What do you think?"
  nl.b2.unit06.lesson02.genuanceerd:
    title: "A qualified opinion"
  nl.b2.unit06.lesson03.reageren:
    title: "Responding to a counter-argument"
  nl.b2.unit06.lesson04.voor_en_tegen:
    title: "For and against"
  nl.b2.unit06.lesson05.een_mening_lezen:
    title: "Reading an opinion"
  nl.b2.unit06.lesson06.in_gesprek:
    title: "In conversation: a qualified opinion"

teaching:
  nl.b2.unit06.lesson01.teach.stad:
    title: "the city"
    gloss: "the city (plural: steden, cities)"
    note: "*De stad* = 'the city'; plural *steden* = 'cities'. This unit debates one abstract question about cities: should they become car-free?"
    example_gloss: "I live in the city."
  nl.b2.unit06.lesson01.teach.autovrij:
    title: "car-free"
    gloss: "car-free"
    note: "*Autovrij* = 'car-free'. The debated claim is *Steden moeten autovrij worden* = 'cities should become car-free'. *Worden* = 'to become'; *moeten* here = 'should / ought to'."
    example_gloss: "Cities should become car-free."
  nl.b2.unit06.lesson01.teach.vrijheid:
    title: freedom
    gloss: freedom
    note: "*Vrijheid* ('freedom') is one abstract VALUE at stake in this debate -- the freedom to drive your own car. Abstract-value nouns like this are the raw material of a B2 discussion."
    example_gloss: "Freedom is important."
  nl.b2.unit06.lesson01.teach.duurzaamheid:
    title: sustainability
    gloss: sustainability
    note: "*Duurzaamheid* ('sustainability') is the opposing VALUE -- the environmental case for fewer cars. A B2 discussion weighs one value against another, not just facts."
    example_gloss: "Sustainability counts too."
  nl.b2.unit06.lesson01.teach.ik_vind_dat:
    title: "I think that..."
    gloss: "I think that... / in my view..."
    note: "*Ik vind dat...* introduces an OPINION. It sends the following verb to the end of its clause: *Ik vind dat het een goed idee is* ('I think that it is a good idea'). This is the most everyday opinion frame."
    example_gloss: "I think it's a good idea."
  nl.b2.unit06.lesson01.teach.naar_mijn_mening:
    title: "in my opinion"
    gloss: "in my opinion"
    note: "*Naar mijn mening* = 'in my opinion' -- a touch more formal than *ik vind dat*. Because it opens the sentence, the verb comes straight after: *Naar mijn mening is vrijheid belangrijk*."
    example_gloss: "In my opinion, freedom is important."
  nl.b2.unit06.lesson01.teach.overtuigd:
    title: "I'm convinced that..."
    gloss: "I'm convinced that..."
    note: "*Ik ben ervan overtuigd dat...* = 'I'm convinced that...' -- the strongest opinion frame, for a view you hold firmly. Like *ik vind dat*, it sends the verb to the end of the *dat*-clause."
    example_gloss: "I'm convinced that it works."
  nl.b2.unit06.lesson01.teach.grammar_meningsframes:
    title: "I think it's a good idea. In my opinion, freedom is important. I'm convinced that sustainability counts."
    gloss: "I think it's a good idea. In my opinion, freedom is important. I'm convinced that sustainability counts."
    note: "Three ways to open an opinion, from everyday to firm: *ik vind dat* < *naar mijn mening* < *ik ben ervan overtuigd dat*. At B2 you pair one of these with a QUALIFIER (next lesson) so your opinion is nuanced, not flat."

  nl.b2.unit06.lesson02.teach.tot_op_zekere_hoogte:
    title: "to a certain extent"
    gloss: "to a certain extent"
    note: "*Tot op zekere hoogte* = 'to a certain extent' -- the key QUALIFIER. It grants that something is partly true without agreeing fully: *Dat is tot op zekere hoogte waar* ('that's true up to a point'). Qualifying is what turns a flat opinion into a B2 one."
    example_gloss: "That is true to a certain extent."
  nl.b2.unit06.lesson02.teach.over_het_algemeen:
    title: "in general"
    gloss: "in general / on the whole"
    note: "*Over het algemeen* = 'in general' -- claims something is usually, not always, so. It softens a sweeping statement. Opening with it puts the verb next: *Over het algemeen is de stad beter*."
    example_gloss: "In general, the city is better."
  nl.b2.unit06.lesson02.teach.in_veel_gevallen:
    title: "in many cases"
    gloss: "in many cases"
    note: "*In veel gevallen* = 'in many cases' -- another hedge that avoids an absolute claim. *In veel gevallen klopt dat* = 'in many cases that's right'. *Klopt* = 'is right / checks out'."
    example_gloss: "In many cases that's right."
  nl.b2.unit06.lesson02.teach.niet_per_se:
    title: "not necessarily"
    gloss: "not necessarily"
    note: "*Niet per se* = 'not necessarily' (NOT 'not at all'). It concedes a point may hold sometimes while denying it must always: *Dat is niet per se slecht* = 'that's not necessarily bad'."
    example_gloss: "That's not necessarily bad."
  nl.b2.unit06.lesson02.teach.dat_hangt_ervan_af:
    title: "that depends"
    gloss: "that depends / it depends"
    note: "*Dat hangt ervan af* = 'that depends' -- refuses a yes/no and signals a conditional view. The most compact way to qualify: you neither agree nor disagree outright."
    example_gloss: "Yes, that depends."
  nl.b2.unit06.lesson02.teach.verantwoordelijkheid:
    title: responsibility
    gloss: responsibility
    note: "*De verantwoordelijkheid* ('responsibility') is another abstract value in play -- who is responsible for the environment, the individual or society? *Iedereen* = 'everyone'."
    example_gloss: "Everyone has a responsibility."
  nl.b2.unit06.lesson02.teach.grammar_nuance:
    title: "That is true to a certain extent. In general, the city is better. That depends."
    gloss: "That is true to a certain extent. In general, the city is better. That depends."
    note: "A QUALIFIED opinion hedges its claim instead of asserting it flat. Reach for *tot op zekere hoogte*, *over het algemeen*, *in veel gevallen*, *niet per se*, or *dat hangt ervan af* to grant a point partly -- the core B2 move for discussing values."

  nl.b2.unit06.lesson03.teach.dat_is_waar_maar:
    title: "that's true, but..."
    gloss: "that's true, but..."
    note: "*Dat is waar, maar...* concedes the other person's point THEN pushes back -- the polite spine of a disagreement. You acknowledge before you object, rather than a bare 'but'. *Genoeg* = 'enough'."
    example_gloss: "That's true, but it's not enough."
  nl.b2.unit06.lesson03.teach.ik_snap_je_punt:
    title: "I get your point, still..."
    gloss: "I get your point, still... / I get your point, but..."
    note: "*Ik snap je punt, toch...* = 'I get your point, still...'. *Toch* = 'still / nevertheless' -- it signals you have heard the objection and disagree anyway. *Denk ik anders* = 'I think differently'."
    example_gloss: "I get your point, still I think differently."
  nl.b2.unit06.lesson03.teach.niet_mee_eens:
    title: "I disagree with that, because..."
    gloss: "I disagree with that, because..."
    note: "*Daar ben ik het niet mee eens, omdat...* = 'I disagree with that, because...'. The fixed frame is *daar ... het ... mee eens*; *omdat* then gives your reason. *Te duur* = 'too expensive'."
    example_gloss: "I disagree with that, because it's too expensive."
  nl.b2.unit06.lesson03.teach.wel_mee_eens:
    title: "I agree with that"
    gloss: "I agree with that"
    note: "*Daar ben ik het mee eens* = 'I agree with that' -- the positive counterpart, same *het ... mee eens* frame without *niet*. Useful for a partial agreement before you qualify."
    example_gloss: "Yes, I agree with that."
  nl.b2.unit06.lesson03.teach.milieu:
    title: "the environment"
    gloss: "the environment"
    note: "*Het milieu* = 'the environment' -- the central value on the pro-car-free side of this debate."
    example_gloss: "The environment is important."
  nl.b2.unit06.lesson03.teach.grammar_reageren:
    title: "That's true, but it's not enough. I get your point, still I think differently. I disagree with that, because it's too expensive."
    gloss: "That's true, but it's not enough. I get your point, still I think differently. I disagree with that, because it's too expensive."
    note: "Responding to an opposing view means engaging with it, not restating your own. Concede first (*dat is waar* / *ik snap je punt*), then push back (*maar* / *toch*), or disagree outright with a reason (*daar ben ik het niet mee eens, omdat...*)."

  nl.b2.unit06.lesson04.teach.enerzijds_anderzijds:
    title: "on one hand ... on the other hand"
    gloss: "on one hand ... on the other hand"
    note: "*Enerzijds ... anderzijds* weighs two sides in one breath -- the hallmark of a balanced B2 opinion. Each half is a main clause with the verb second: *Enerzijds is het goed, anderzijds is het duur*."
    example_gloss: "On one hand it's good, on the other hand it's expensive."
  nl.b2.unit06.lesson04.teach.voordeel:
    title: "advantage"
    gloss: "the advantage"
    note: "*Het voordeel* = 'the advantage'. *Een autovrije stad* = 'a car-free city' (*autovrij* takes an -e ending before a noun). Weighing *voordeel* against *nadeel* is how you argue a value."
    example_gloss: "A car-free city has a big advantage."
  nl.b2.unit06.lesson04.teach.nadeel:
    title: "disadvantage"
    gloss: "the disadvantage"
    note: "*Het nadeel* = 'the disadvantage / drawback' -- the mirror of *voordeel*. Naming both sides is what makes an opinion balanced rather than one-sided."
    example_gloss: "There is a drawback too."
  nl.b2.unit06.lesson04.teach.samenleving:
    title: "society"
    gloss: "society"
    note: "*De samenleving* ('society') is the collective-value angle: what is good *voor de samenleving* ('for society'), not just for you. A core abstract noun for values talk."
    example_gloss: "That is good for society."
  nl.b2.unit06.lesson04.teach.gezond:
    title: healthy
    gloss: "healthy (comparative: gezonder, healthier)"
    note: "*Gezond* = 'healthy'; comparative *gezonder* = 'healthier'. A concrete benefit you can weigh in the abstract debate: *Een autovrije stad is gezonder*."
    example_gloss: "A car-free city is healthier."
  nl.b2.unit06.lesson04.teach.grammar_afwegen:
    title: "On one hand there's an advantage, on the other hand there's a disadvantage. That is good for society."
    gloss: "On one hand there's an advantage, on the other hand there's a disadvantage. That is good for society."
    note: "Weighing a value means holding both sides at once: an *voordeel* and a *nadeel*, what's good for the individual and what's good *voor de samenleving*. *Enerzijds ... anderzijds* frames the balance explicitly."

  nl.b2.unit06.lesson05.teach.tekst:
    title: "Reading: should cities be car-free?"
    gloss: "I think cities should become car-free. On one hand that's good for the environment, on the other hand I understand that not everyone wants that. To a certain extent that's true. Still, I'm convinced that a car-free city is better for society. It isn't necessarily easy, but it's worth it."

  nl.b2.unit06.lesson06.teach.dialogue_lotte_open:
    title: "Lotte: I think cities should become car-free. That's better for the environment."
    gloss: "Lotte: I think cities should become car-free. That's better for the environment."
  nl.b2.unit06.lesson06.teach.dialogue_omar_concede:
    title: "Omar: That's true, but not everyone wants that."
    gloss: "Omar: That's true, but not everyone wants that."
  nl.b2.unit06.lesson06.teach.dialogue_lotte_push:
    title: "Lotte: I get your point, still it's better for society."
    gloss: "Lotte: I get your point, still it's better for society."
  nl.b2.unit06.lesson06.teach.dialogue_omar_qualify:
    title: "Omar: I agree with that to a certain extent. But it depends."
    gloss: "Omar: I agree with that to a certain extent. But it depends."
  nl.b2.unit06.lesson06.teach.dialogue_lotte_conviction:
    title: "Lotte: I'm convinced that it's worth it."
    gloss: "Lotte: I'm convinced that it's worth it."
  nl.b2.unit06.lesson06.teach.dialogue_omar_final:
    title: "Omar: In my opinion, that's not necessarily better."
    gloss: "Omar: In my opinion, that's not necessarily better."
  nl.b2.unit06.lesson06.teach.grammar_genuanceerd:
    title: "I think cities should become car-free, but it depends. I don't necessarily agree with that."
    gloss: "I think cities should become car-free, but it depends. I don't necessarily agree with that."
    note: "A real discussion mixes an opinion frame, a qualifier, and a response to the other side: state a view (*ik vind dat*), qualify it (*dat hangt ervan af*, *niet per se*), and answer the opposing view directly (*daar ben ik het (niet) mee eens*). That is exactly what you produce in this lesson's speaking and writing tasks."

exercises:
  nl.b2.unit06.lesson01.exercise01.recognize_vrijheid:
    instruction: "What does this word mean?"
    correct_option: freedom
    distractors: [sustainability, responsibility, society]
    accepted_answers: [{value: freedom, status: correct}]
    feedback: "Vrijheid means freedom -- one of the abstract values this unit weighs."
  nl.b2.unit06.lesson01.exercise02.listen_autovrij_mening:
    instruction: "Listen and select what you hear."
    correct_option: "I think cities should become car-free."
    distractors: ["In my opinion, cities are car-free.", "I'm convinced that cities are car-free.", "I think the city should stay car-free."]
    accepted_answers: [{value: "I think cities should become car-free.", status: correct}]
    feedback: "Ik vind dat steden autovrij moeten worden means I think cities should become car-free -- an opinion frame plus the debated claim."
  nl.b2.unit06.lesson01.exercise03.match_opinion_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {"ik vind dat": "I think that", "naar mijn mening": "in my opinion", "ik ben ervan overtuigd dat": "I'm convinced that", vrijheid: freedom, duurzaamheid: sustainability, autovrij: "car-free", steden: cities}
        status: correct
    feedback: "The three opinion frames run from everyday (ik vind dat) to firm (ik ben ervan overtuigd dat); vrijheid and duurzaamheid are the values in play."
  nl.b2.unit06.lesson01.exercise04.order_vind_dat:
    instruction: "Put the words in order: I think cities should become car-free."
    accepted_answers:
      - {value: "Ik vind dat steden autovrij moeten worden", status: correct}
    feedback: "Ik vind dat steden autovrij moeten worden -- ik vind dat sends the verbs (moeten worden) to the end of the clause."
  nl.b2.unit06.lesson01.exercise05.translate_mening:
    instruction: "Translate into Dutch, using naar mijn mening: In my opinion, freedom is important."
    accepted_answers:
      - {value: "Naar mijn mening is vrijheid belangrijk", status: correct}
    feedback: "Naar mijn mening is vrijheid belangrijk means in my opinion, freedom is important -- the verb comes right after the opening phrase."
  nl.b2.unit06.lesson01.exercise06.speak_overtuigd:
    instruction: "Say aloud in Dutch, using ik ben ervan overtuigd dat: I'm convinced that sustainability counts."
    accepted_answers:
      - {value: "Ik ben ervan overtuigd dat duurzaamheid telt", status: correct}
    feedback: "Ik ben ervan overtuigd dat duurzaamheid telt means I'm convinced that sustainability counts."
  nl.b2.unit06.lesson01.exercise07.write_goed_idee:
    instruction: "Write in Dutch, using ik vind dat: I think it's a good idea."
    accepted_answers:
      - {value: "Ik vind dat het een goed idee is", status: correct}
    feedback: "Ik vind dat het een goed idee is means I think it's a good idea."

  nl.b2.unit06.lesson01.exercise08.dictation_autovrij_mening:
    instruction: "Type what you hear."
    correct_response: "Ik vind dat steden autovrij moeten worden"
    orthography_strict: true
    feedback: "You heard Ik vind dat steden autovrij moeten worden — I think cities should become car-free."

  nl.b2.unit06.lesson02.exercise01.recognize_verantwoordelijkheid:
    instruction: "What does this word mean?"
    correct_option: responsibility
    distractors: [freedom, sustainability, society]
    accepted_answers: [{value: responsibility, status: correct}]
    feedback: "Verantwoordelijkheid means responsibility -- an abstract value about who should act."
  nl.b2.unit06.lesson02.exercise02.listen_tot_op_zekere_hoogte:
    instruction: "Listen and select what you hear."
    correct_option: "That is true to a certain extent."
    distractors: ["That is completely true.", "That is not true at all.", "That is true in general."]
    accepted_answers: [{value: "That is true to a certain extent.", status: correct}]
    feedback: "Dat is tot op zekere hoogte waar means that's true to a certain extent -- a partial, qualified agreement."
  nl.b2.unit06.lesson02.exercise03.match_nuance_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {"tot op zekere hoogte": "to a certain extent", "over het algemeen": "in general", "in veel gevallen": "in many cases", "niet per se": "not necessarily", "dat hangt ervan af": "that depends", verantwoordelijkheid: responsibility}
        status: correct
    feedback: "These are qualifiers: each grants a point only partly, turning a flat opinion into a nuanced one."
  nl.b2.unit06.lesson02.exercise04.order_niet_per_se:
    instruction: "Put the words in order: That's not necessarily bad."
    accepted_answers:
      - {value: "Dat is niet per se slecht", status: correct}
    feedback: "Dat is niet per se slecht -- niet per se means 'not necessarily', not 'not at all'."
  nl.b2.unit06.lesson02.exercise05.translate_algemeen:
    instruction: "Translate into Dutch, using over het algemeen: In general, the city is better."
    accepted_answers:
      - {value: "Over het algemeen is de stad beter", status: correct}
    feedback: "Over het algemeen is de stad beter means in general, the city is better."
  nl.b2.unit06.lesson02.exercise06.write_hangt_af:
    instruction: "Write in Dutch: That depends."
    accepted_answers:
      - {value: "Dat hangt ervan af", status: correct}
    feedback: "Dat hangt ervan af means that depends -- a compact way to qualify without agreeing or disagreeing."
  nl.b2.unit06.lesson02.exercise07.translate_tot_op_zekere_hoogte:
    instruction: "Translate into Dutch, using tot op zekere hoogte: That is true to a certain extent."
    accepted_answers:
      - {value: "Dat is tot op zekere hoogte waar", status: correct}
    feedback: "Dat is tot op zekere hoogte waar means that is true to a certain extent."

  nl.b2.unit06.lesson03.exercise01.recognize_toch:
    instruction: "What does this word mean?"
    correct_option: "still / nevertheless"
    distractors: ["because", "in general", "for sure"]
    accepted_answers: [{value: "still / nevertheless", status: correct}]
    feedback: "Toch means 'still / nevertheless' -- it signals you disagree even after hearing the point."
  nl.b2.unit06.lesson03.exercise02.listen_dat_is_waar:
    instruction: "Listen and select what you hear."
    correct_option: "That's true, but it's not enough."
    distractors: ["That's true, and it's enough.", "That's not true, but it's enough.", "I get your point, but it's enough."]
    accepted_answers: [{value: "That's true, but it's not enough.", status: correct}]
    feedback: "Dat is waar, maar het is niet genoeg means that's true, but it's not enough -- concede, then push back."
  nl.b2.unit06.lesson03.exercise03.match_respond_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {"dat is waar, maar": "that's true, but...", "ik snap je punt, toch": "I get your point, still...", "daar ben ik het niet mee eens": "I disagree with that", "daar ben ik het mee eens": "I agree with that", omdat: because, milieu: environment}
        status: correct
    feedback: "These respond to an opposing view: concede-then-push-back (dat is waar, maar / ik snap je punt, toch), or agree/disagree outright."
  nl.b2.unit06.lesson03.exercise04.order_niet_mee_eens:
    instruction: "Put the words in order: I disagree with that."
    accepted_answers:
      - {value: "Daar ben ik het niet mee eens", status: correct}
    feedback: "Daar ben ik het niet mee eens -- the fixed frame is daar ... het ... mee eens."
  nl.b2.unit06.lesson03.exercise05.translate_dat_is_waar:
    instruction: "Translate into Dutch, conceding then pushing back, using dat is waar, maar...: That's true, but it's not enough."
    accepted_answers:
      - {value: "Dat is waar, maar het is niet genoeg", status: correct}
      - {value: "Dat is waar maar het is niet genoeg", status: correct}
    feedback: "Dat is waar, maar het is niet genoeg means that's true, but it's not enough."
  nl.b2.unit06.lesson03.exercise06.speak_niet_mee_eens:
    instruction: "Say aloud in Dutch, disagreeing with a reason, using daar ben ik het niet mee eens, omdat...: I disagree with that, because it's too expensive."
    accepted_answers:
      - {value: "Daar ben ik het niet mee eens, omdat het te duur is", status: correct}
      - {value: "Daar ben ik het niet mee eens omdat het te duur is", status: correct}
    feedback: "Daar ben ik het niet mee eens, omdat het te duur is means I disagree with that, because it's too expensive."
  nl.b2.unit06.lesson03.exercise07.write_snap_punt:
    instruction: "Write in Dutch, conceding then disagreeing, using ik snap je punt, toch...: I get your point, still I think differently."
    accepted_answers:
      - {value: "Ik snap je punt, toch denk ik anders", status: correct}
      - {value: "Ik snap je punt toch denk ik anders", status: correct}
    feedback: "Ik snap je punt, toch denk ik anders means I get your point, still I think differently -- toch flips to disagreement."

  nl.b2.unit06.lesson03.exercise08.dictation_dat_is_waar:
    instruction: "Type what you hear."
    correct_response: "Dat is waar, maar het is niet genoeg"
    orthography_strict: true
    feedback: "You heard Dat is waar, maar het is niet genoeg — that's true, but it's not enough."

  nl.b2.unit06.lesson04.exercise01.recognize_voordeel:
    instruction: "What does this word mean?"
    correct_option: advantage
    distractors: [disadvantage, environment, freedom]
    accepted_answers: [{value: advantage, status: correct}]
    feedback: "Voordeel means advantage; its opposite is nadeel (disadvantage)."
  nl.b2.unit06.lesson04.exercise02.listen_enerzijds:
    instruction: "Listen and select what you hear."
    correct_option: "On one hand it's good, on the other hand it's expensive."
    distractors: ["On one hand it's good, on the other hand it's healthy.", "On one hand it's bad, on the other hand it's expensive.", "On one hand it's good, and it's cheap."]
    accepted_answers: [{value: "On one hand it's good, on the other hand it's expensive.", status: correct}]
    feedback: "Enerzijds is het goed, anderzijds is het duur means on one hand it's good, on the other hand it's expensive -- weighing both sides."
  nl.b2.unit06.lesson04.exercise03.match_afwegen_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {enerzijds: "on one hand", anderzijds: "on the other hand", voordeel: advantage, nadeel: disadvantage, samenleving: society, gezond: healthy}
        status: correct
    feedback: "Enerzijds ... anderzijds frames the two sides; voordeel and nadeel are what you weigh, for yourself and for de samenleving."
  nl.b2.unit06.lesson04.exercise04.order_gezonder:
    instruction: "Put the words in order: A car-free city is healthier."
    accepted_answers:
      - {value: "Een autovrije stad is gezonder", status: correct}
    feedback: "Een autovrije stad is gezonder -- autovrij takes an -e ending (autovrije) before the noun stad."
  nl.b2.unit06.lesson04.exercise05.translate_enerzijds:
    instruction: "Translate into Dutch, using enerzijds ... anderzijds: On one hand it's good, on the other hand it's expensive."
    accepted_answers:
      - {value: "Enerzijds is het goed, anderzijds is het duur", status: correct}
      - {value: "Enerzijds is het goed anderzijds is het duur", status: correct}
    feedback: "Enerzijds is het goed, anderzijds is het duur -- each half is a main clause with the verb second."
  nl.b2.unit06.lesson04.exercise06.write_samenleving:
    instruction: "Write in Dutch: That is good for society."
    accepted_answers:
      - {value: "Dat is goed voor de samenleving", status: correct}
    feedback: "Dat is goed voor de samenleving means that is good for society."
  nl.b2.unit06.lesson04.exercise07.translate_nadeel:
    instruction: "Translate into Dutch: That is a big disadvantage for the city."
    accepted_answers:
      - {value: "Dat is een groot nadeel voor de stad", status: correct}
    feedback: "Dat is een groot nadeel voor de stad means that is a big disadvantage for the city."

  nl.b2.unit06.lesson05.exercise01.read_stance:
    instruction: "What is the author's overall opinion?"
    correct_option: "Cities should become car-free."
    distractors: ["Cities should keep their cars.", "It makes no difference either way.", "Only villages should be car-free."]
    accepted_answers: [{value: "Cities should become car-free.", status: correct}]
    feedback: "Ik vind dat steden autovrij moeten worden -- the author opens by stating this opinion outright."
  nl.b2.unit06.lesson05.exercise02.read_qualification:
    instruction: "What does the author CONCEDE to the opposing side?"
    correct_option: "That, to a certain extent, not everyone wants a car-free city."
    distractors: ["That the environment does not matter.", "That cars are always better.", "That they were completely wrong."]
    accepted_answers: [{value: "That, to a certain extent, not everyone wants a car-free city.", status: correct}]
    feedback: "Anderzijds snap ik dat niet iedereen dat wil. Tot op zekere hoogte is dat waar -- the author grants the opposing point partly before holding their line."
  nl.b2.unit06.lesson05.exercise03.read_final_value:
    instruction: "On what basis does the author still support the car-free city?"
    correct_option: "It is better for society."
    distractors: ["It is cheaper.", "It is easier.", "Everyone already wants it."]
    accepted_answers: [{value: "It is better for society.", status: correct}]
    feedback: "Toch ben ik ervan overtuigd dat een autovrije stad beter is voor de samenleving -- the collective good is the author's decisive reason."
  nl.b2.unit06.lesson05.exercise04.read_hedge:
    instruction: "Does the author claim it would be easy?"
    correct_option: "No -- they admit it's not necessarily easy, but say it's worth it."
    distractors: ["Yes, they say it would be very easy.", "They don't mention difficulty at all.", "They say it would be impossible."]
    accepted_answers: [{value: "No -- they admit it's not necessarily easy, but say it's worth it.", status: correct}]
    feedback: "Het is niet per se makkelijk, maar het is de moeite waard -- niet per se concedes the difficulty without abandoning the view."
  nl.b2.unit06.lesson05.exercise05.match_reading_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {makkelijk: easy, "de moeite waard": "worth it", wil: wants, beter: better, milieu: environment, samenleving: society}
        status: correct
    feedback: "These are the reading's key words."
  nl.b2.unit06.lesson05.exercise06.translate_moeite_waard:
    instruction: "Translate into Dutch: It is worth it."
    accepted_answers:
      - {value: "Het is de moeite waard", status: correct}
    feedback: "Het is de moeite waard means it is worth it."
  nl.b2.unit06.lesson05.exercise07.write_makkelijk:
    instruction: "Write in Dutch, using niet per se: It is not necessarily easy."
    accepted_answers:
      - {value: "Het is niet per se makkelijk", status: correct}
    feedback: "Het is niet per se makkelijk means it is not necessarily easy."

  nl.b2.unit06.lesson06.exercise01.comprehend_lotte:
    instruction: "What is Lotte's position?"
    correct_option: "Cities should become car-free -- it's better for the environment."
    distractors: ["Cities should keep their cars.", "It depends on the village.", "She has no opinion either way."]
    accepted_answers: [{value: "Cities should become car-free -- it's better for the environment.", status: correct}]
    feedback: "Lotte opens with Ik vind dat steden autovrij moeten worden. Dat is beter voor het milieu -- a clear pro position."
  nl.b2.unit06.lesson06.exercise02.comprehend_omar:
    instruction: "What is Omar's position, and how does he qualify it?"
    correct_option: "He only partly agrees -- to a certain extent, but he says it depends and isn't necessarily better."
    distractors: ["He fully agrees with Lotte.", "He thinks cars should be banned everywhere.", "He refuses to give any opinion."]
    accepted_answers: [{value: "He only partly agrees -- to a certain extent, but he says it depends and isn't necessarily better.", status: correct}]
    feedback: "Daar ben ik het tot op zekere hoogte mee eens. Maar het hangt ervan af ... niet per se beter -- Omar concedes partly but qualifies, rather than agreeing or flatly refusing."
  nl.b2.unit06.lesson06.exercise03.comprehend_difference:
    instruction: "Where do Lotte and Omar mainly DIFFER?"
    correct_option: "On whether a car-free city is worth it and clearly better overall."
    distractors: ["On whether the environment matters at all.", "On what time the meeting starts.", "They don't actually disagree on anything."]
    accepted_answers: [{value: "On whether a car-free city is worth it and clearly better overall.", status: correct}]
    feedback: "Lotte is convinced it's de moeite waard; Omar says it's niet per se beter -- the gap is over how decisive the benefit is, not over whether the environment matters."
  nl.b2.unit06.lesson06.exercise04.order_overtuigd:
    instruction: "Put the words in order: I'm convinced that it's better."
    accepted_answers:
      - {value: "Ik ben ervan overtuigd dat het beter is", status: correct}
    feedback: "Ik ben ervan overtuigd dat het beter is -- the dat-clause sends its verb (is) to the end."
  nl.b2.unit06.lesson06.exercise05.speak_qualified_opinion:
    instruction: "Someone says cities should stay full of cars. Respond aloud with a QUALIFIED opinion that answers them, using tot op zekere hoogte and dat is waar, maar...: That is true to a certain extent, but a car-free city is better for the environment."
    accepted_answers:
      - {value: "Dat is tot op zekere hoogte waar, maar een autovrije stad is beter voor het milieu", status: correct}
      - {value: "Dat is tot op zekere hoogte waar maar een autovrije stad is beter voor het milieu", status: correct}
    feedback: "Dat is tot op zekere hoogte waar, maar een autovrije stad is beter voor het milieu -- you concede partly (qualified), then answer with your own view."
  nl.b2.unit06.lesson06.exercise06.write_qualified_response:
    instruction: "Someone argues that cities should keep their cars. Write TWO Dutch sentences responding with a QUALIFIED opinion that answers them directly. (1) Concede partly, using dat is waar, maar...: That's true, but it's not good for the environment. (2) Give your own qualified opinion, using naar mijn mening: In my opinion, a car-free city is better."
    accepted_answers:
      - {value: "Dat is waar, maar het is niet goed voor het milieu. Naar mijn mening is een autovrije stad beter.", status: correct}
      - {value: "Dat is waar, maar het is niet goed voor het milieu. Naar mijn mening is een autovrije stad beter", status: correct}
      - {value: "Dat is waar maar het is niet goed voor het milieu. Naar mijn mening is een autovrije stad beter.", status: correct}
      - {value: "Dat is waar maar het is niet goed voor het milieu. Naar mijn mening is een autovrije stad beter", status: correct}
    feedback: "Dat is waar, maar het is niet goed voor het milieu. Naar mijn mening is een autovrije stad beter -- you concede the point, then answer with a qualified opinion of your own."
  nl.b2.unit06.lesson06.exercise07.respond_qualified:
    instruction: "Someone states the opposing view 'Steden moeten niet autovrij worden' (cities should not become car-free). Answer them directly with a QUALIFIED opinion, using tot op zekere hoogte to concede partly, then maar and naar mijn mening to give your view."
    accepted_answers:
      - {value: "Dat is tot op zekere hoogte waar, maar naar mijn mening is een autovrije stad beter voor het milieu", status: correct}
      - {value: "Dat is tot op zekere hoogte waar maar naar mijn mening is een autovrije stad beter voor het milieu", status: correct}
    feedback: "Dat is tot op zekere hoogte waar, maar naar mijn mening is een autovrije stad beter voor het milieu -- a qualified concession that answers the opposing view head-on."
