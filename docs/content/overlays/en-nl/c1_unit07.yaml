course: {title: "Dutch C1", description: "Advanced Dutch discourse, inference, register, and nuanced argumentation."}
units: {nl.c1.unit07.bronnen_bemiddelen: {title: "Mediating and synthesizing sources", description: "Distill complex or conflicting source material and relay it accurately and appropriately for a specific listener or reader."}}
lessons:
  nl.c1.unit07.lesson01.bronnen_kernpunten: {title: "Recognize sources and key points"}
  nl.c1.unit07.lesson02.twee_geluiden: {title: "Listen to two accounts"}
  nl.c1.unit07.lesson03.twee_bronnen: {title: "Read two sources"}
  nl.c1.unit07.lesson04.publiek: {title: "Explain for an audience"}
  nl.c1.unit07.lesson05.samenvatting: {title: "Write a mediating summary"}
  nl.c1.unit07.lesson06.volledig_overzicht: {title: "Write the full briefing"}
teaching:
  nl.c1.unit07.lesson01.teach.bron: {title: "The source", gloss: "a source", note: "A *bron* is a document, report, or account you draw your information from.", example_gloss: "This article is my main source."}
  nl.c1.unit07.lesson01.teach.kernpunt: {title: "The key point", gloss: "central point", note: "The *kernpunt* is the most important idea in a source.", example_gloss: "The key point of the article is clear."}
  nl.c1.unit07.lesson01.teach.samenvatten: {title: "To summarize", gloss: "to sum up", note: "*Samenvatten* is restating a source briefly in your own words.", example_gloss: "Can you briefly summarize the text?"}
  nl.c1.unit07.lesson01.teach.volgens: {title: "According to", gloss: "as stated by", note: "*Volgens* attributes a claim to its source — *volgens de gemeente* = according to the municipality.", example_gloss: "According to the article, the problem is small."}
  nl.c1.unit07.lesson01.teach.standpunt: {title: "The position", gloss: "standpoint", note: "A *standpunt* is the position a source or writer takes.", example_gloss: "The writer defends his position."}
  nl.c1.unit07.lesson01.teach.bemiddelen: {title: "To mediate", gloss: "to mediate between", note: "*Bemiddelen* means relaying material accurately and appropriately from a source to an audience.", example_gloss: "Omar mediates between two sources."}
  nl.c1.unit07.lesson01.teach.eigen_woorden: {title: "In your own words", gloss: "rephrase it", note: "*Leg het in eigen woorden uit* is the standard instruction to explain without quoting."}
  nl.c1.unit07.lesson01.teach.scenario: {title: "The scenario", gloss: "two sources, one wind farm", note: "Omar must brief his neighbours on the *gemeentelijk plan* (municipal plan) and the *buurtonderzoek* (neighbourhood survey), which partly disagree."}
  nl.c1.unit07.lesson02.teach.plan_stelt: {title: "The plan states", gloss: "the plan's claim", note: "*Het plan stelt dat ...* introduces the municipal plan's position."}
  nl.c1.unit07.lesson02.teach.onderzoek_tegen: {title: "The survey contradicts", gloss: "the survey's counter", note: "*Spreekt dat tegen* means it contradicts that claim; *geluidsoverlast* is noise nuisance."}
  nl.c1.unit07.lesson02.teach.aan_ene_kant: {title: "On the one hand ... on the other", gloss: "balanced contrast", note: "*Aan de ene kant ... aan de andere kant* weighs two sides of a disagreement."}
  nl.c1.unit07.lesson02.teach.tegenstrijdig: {title: "Contradictory", gloss: "in conflict", note: "*Tegenstrijdig* describes two claims that cannot both be true.", example_gloss: "The two sources are contradictory."}
  nl.c1.unit07.lesson02.teach.tegenspreken: {title: "Contradict each other", gloss: "mutually disagree", note: "*Elkaar tegenspreken* means two sources state opposite things."}
  nl.c1.unit07.lesson02.teach.register_note: {title: "Name the disagreement", gloss: "stay even-handed", note: "When mediating, you *benoem* (name) the difference honestly rather than pretending the sources agree."}
  nl.c1.unit07.lesson03.teach.rapport_stelt: {title: "The report asserts", gloss: "formal claim", note: "*Het rapport stelt dat ...* is a formal way to attribute a claim to a report."}
  nl.c1.unit07.lesson03.teach.volgens_onderzoek: {title: "According to the research", gloss: "attributed doubt", note: "*Volgens het onderzoek is dat nog niet bewezen* flags that a claim is unproven."}
  nl.c1.unit07.lesson03.teach.voorbehoud: {title: "A reservation", gloss: "a caveat", note: "*Een voorbehoud maken bij* means to register a caveat about a figure or claim."}
  nl.c1.unit07.lesson03.teach.vakterm: {title: "The technical term", gloss: "jargon", note: "A *vakterm* like *decibel* needs explaining for a general audience.", example_gloss: "You have to explain the technical term 'decibel'."}
  nl.c1.unit07.lesson03.teach.leestekst: {title: "Read the two sources", gloss: "compare claims", note: "Read what each source claims and where they part ways: the report says the nuisance stays limited; the survey says that is not proven."}
  nl.c1.unit07.lesson03.teach.lezen_note: {title: "Retain, explain, or omit", gloss: "choose for your reader", note: "When reading two sources, decide what to *behouden* (retain), *uitleggen* (explain), or *weglaten* (omit) for your audience."}
  nl.c1.unit07.lesson04.teach.begrijpelijke_taal: {title: "In plain language", gloss: "make it clear", note: "*Ik zet het om in begrijpelijke taal* — I turn it into understandable language."}
  nl.c1.unit07.lesson04.teach.dat_wil_zeggen: {title: "That is to say", gloss: "restate simply", note: "*Dat wil zeggen* introduces a plain restatement of a technical idea."}
  nl.c1.unit07.lesson04.teach.kortom: {title: "In short", gloss: "sum up", note: "*Kortom* opens a one-line summary.", example_gloss: "In short, the two sources disagree."}
  nl.c1.unit07.lesson04.teach.leek: {title: "The layperson", gloss: "non-specialist", note: "A *leek* is a non-specialist; mediation explains jargon for laypeople.", example_gloss: "A layperson listens to this story."}
  nl.c1.unit07.lesson04.teach.publiek_note: {title: "Choose words your audience knows", gloss: "plain over jargon", note: "For an audience of laypeople, replace *vaktermen* with *gewone* words — say 'a measure of sound' instead of 'decibel'."}
  nl.c1.unit07.lesson05.teach.beide_bronnen: {title: "Both sources agree", gloss: "shared ground", note: "*De twee bronnen zijn het met elkaar eens* names the point both sources share."}
  nl.c1.unit07.lesson05.teach.de_een_de_ander: {title: "The one ... the other", gloss: "two sides", note: "*De een ... de ander* contrasts the two positions in one sentence."}
  nl.c1.unit07.lesson05.teach.behoudens: {title: "Barring", gloss: "except for", note: "*Behoudens* names the single exception to an otherwise clear picture.", example_gloss: "Barring this point, there is no contradiction."}
  nl.c1.unit07.lesson05.teach.naar_verluidt: {title: "Reportedly not measured", gloss: "unconfirmed claim", note: "*Naar verluidt* marks something as reported but not confirmed; *gemeten* means measured."}
  nl.c1.unit07.lesson05.teach.samenvatting_note: {title: "Attribute every claim", gloss: "who said what", note: "In a mediating summary, *vermeld* (state) who claims what; *naar verluidt* signals it is unconfirmed, *behoudens* names one exception."}
  nl.c1.unit07.lesson06.teach.briefing: {title: "The full briefing", gloss: "Omar's summary for the neighbours", note: "Omar synthesizes both sources for the residents, attributing each claim with *volgens*, flagging the unproven one with *naar verluidt*, and naming the one disagreement with *behoudens*."}
exercises:
  nl.c1.unit07.lesson01.exercise01.herken_bron: {instruction: "What does *de bron* mean?", correct_option: "The source you draw information from.", distractors: ["A bridge over water.", "A type of bread.", "A loud noise."], accepted_answers: [{value: "The source you draw information from.", status: correct}], feedback: "A *bron* is a source: a document, report, or account."}
  nl.c1.unit07.lesson01.exercise02.herken_samenvatten: {instruction: "What does *samenvatten* mean in Kun je de tekst kort samenvatten?", correct_option: "To summarize briefly.", distractors: ["To write very slowly.", "To read out loud.", "To translate word for word."], accepted_answers: [{value: "To summarize briefly.", status: correct}], feedback: "*Samenvatten* means restating a source briefly in your own words."}
  nl.c1.unit07.lesson01.exercise03.koppel_termen: {instruction: "Match each Dutch mediation term to its meaning.", pairs: [{left: "de bron", right: "the source you draw on"}, {left: "het kernpunt", right: "the key point"}, {left: samenvatten, right: "to summarize"}, {left: volgens, right: "according to"}, {left: "het standpunt", right: "the position taken"}, {left: bemiddelen, right: "to mediate between"}, {left: "in eigen woorden", right: "in your own words"}], accepted_answers: [{value: [{left: "de bron", right: "the source you draw on"}, {left: "het kernpunt", right: "the key point"}, {left: samenvatten, right: "to summarize"}, {left: volgens, right: "according to"}, {left: "het standpunt", right: "the position taken"}, {left: bemiddelen, right: "to mediate between"}, {left: "in eigen woorden", right: "in your own words"}], status: correct}], feedback: "These are the building blocks of mediation: source, key point, summarizing, attribution, position, mediating, and rephrasing."}
  nl.c1.unit07.lesson01.exercise04.orden_volgens: {instruction: "Put the words in order to say: According to the article, the problem is small.", accepted_answers: [{value: "Volgens het artikel is het probleem klein", status: correct}], feedback: "*Volgens* attributes the claim to the article."}
  nl.c1.unit07.lesson01.exercise05.vertaal_samenvatten: {instruction: "Translate (informal je): Can you summarize the key point briefly? Use kort.", accepted_answers: [{value: "Kun je het kernpunt kort samenvatten", status: correct}, {value: "Kan je het kernpunt kort samenvatten", status: correct}, {value: "Kun je kort het kernpunt samenvatten", status: correct}, {value: "Kan je kort het kernpunt samenvatten", status: correct}, {value: "Kun jij het kernpunt kort samenvatten", status: correct}, {value: "Kan jij het kernpunt kort samenvatten", status: correct}, {value: "Kun jij kort het kernpunt samenvatten", status: correct}, {value: "Kan jij kort het kernpunt samenvatten", status: correct}], feedback: "Kun je het kernpunt kort samenvatten? In a question the modal comes first and the infinitive *samenvatten* goes to the end."}
  nl.c1.unit07.lesson01.exercise06.spreek_eigen_woorden: {instruction: "The writer says: 'Mijn standpunt is duidelijk.' Report this in indirect speech, starting with De schrijver zegt dat.", accepted_answers: [{value: "De schrijver zegt dat zijn standpunt duidelijk is", status: correct}], feedback: "De schrijver zegt dat zijn standpunt duidelijk is. In indirect speech *mijn* becomes *zijn* and the verb goes to the end of the *dat*-clause."}
  nl.c1.unit07.lesson01.exercise07.schrijf_standpunt: {instruction: "Join these two sentences into one with omdat; the second sentence gives the reason: 'Het artikel is mijn belangrijkste bron. Het kernpunt is duidelijk.'", accepted_answers: [{value: "Het artikel is mijn belangrijkste bron omdat het kernpunt duidelijk is", status: correct}, {value: "Omdat het kernpunt duidelijk is, is het artikel mijn belangrijkste bron", status: correct}], feedback: "Het artikel is mijn belangrijkste bron omdat het kernpunt duidelijk is. After *omdat* the verb goes to the end; if the *omdat*-clause comes first, the main clause starts with its verb: Omdat het kernpunt duidelijk is, is het artikel mijn belangrijkste bron."}
  nl.c1.unit07.lesson02.exercise01.luister_twee: {instruction: "Listen to the two accounts. On which point do the plan and the survey conflict?", correct_option: "Whether the noise nuisance will stay minimal.", distractors: ["Whether the farm will produce any energy.", "Whether the survey was ever published.", "Whether residents were asked anything."], accepted_answers: [{value: "Whether the noise nuisance will stay minimal.", status: correct}], feedback: "The plan calls the nuisance minimal; the survey says many residents fear noise — that is the conflict."}
  nl.c1.unit07.lesson02.exercise02.herken_tegenstrijdig: {instruction: "What does *De twee bronnen zijn tegenstrijdig* mean?", correct_option: "The two sources contradict each other.", distractors: ["The two sources agree completely.", "The two sources are the same length.", "The two sources are both written."], accepted_answers: [{value: "The two sources contradict each other.", status: correct}], feedback: "*Tegenstrijdig* means they cannot both be true."}
  nl.c1.unit07.lesson02.exercise03.koppel_geluiden: {instruction: "Match each phrase from the two accounts to its meaning.", pairs: [{left: "het plan stelt", right: "the plan claims"}, {left: "de molens leveren", right: "the turbines produce"}, {left: "spreekt dat tegen", right: "contradicts that"}, {left: "veel bewoners vrezen", right: "many residents fear"}, {left: geluidsoverlast, right: "noise nuisance"}, {left: "aan de ene kant", right: "on the one hand"}, {left: "aan de andere kant", right: "on the other hand"}, {left: tegenstrijdig, right: "contradictory"}], accepted_answers: [{value: [{left: "het plan stelt", right: "the plan claims"}, {left: "de molens leveren", right: "the turbines produce"}, {left: "spreekt dat tegen", right: "contradicts that"}, {left: "veel bewoners vrezen", right: "many residents fear"}, {left: geluidsoverlast, right: "noise nuisance"}, {left: "aan de ene kant", right: "on the one hand"}, {left: "aan de andere kant", right: "on the other hand"}, {left: tegenstrijdig, right: "contradictory"}], status: correct}], feedback: "Each phrase captures one side of the disagreement."}
  nl.c1.unit07.lesson02.exercise04.orden_tegenstrijdig: {instruction: "Put the words in order to say: The two sources contradict each other.", accepted_answers: [{value: "De twee bronnen zijn tegenstrijdig", status: correct}], feedback: "*Tegenstrijdig* = contradictory."}
  nl.c1.unit07.lesson02.exercise05.vertaal_kant: {instruction: "Translate: On the one hand there is clean energy, on the other there is concern. Use Aan de ene kant ... aan de andere kant ...", accepted_answers: [{value: "Aan de ene kant is er schone energie, aan de andere kant is er bezorgdheid.", status: correct}, {value: "Aan de ene kant is er schone energie en aan de andere kant is er bezorgdheid.", status: correct}, {value: "Aan de ene kant is er schone energie, maar aan de andere kant is er bezorgdheid.", status: correct}, {value: "Aan de ene kant is er schone energie, aan de andere kant bezorgdheid.", status: correct}, {value: "Aan de ene kant is er schone energie en aan de andere kant bezorgdheid.", status: correct}, {value: "Aan de ene kant is er schone energie, maar aan de andere kant bezorgdheid.", status: correct}, {value: "Aan de ene kant is er schone energie, aan de andere kant zijn er zorgen.", status: correct}, {value: "Aan de ene kant is er schone energie, maar aan de andere kant zijn er zorgen.", status: correct}, {value: "Aan de ene kant is er schone energie en aan de andere kant zijn er zorgen.", status: correct}], feedback: "*Aan de ene kant ... aan de andere kant ...* weighs both sides, e.g. Aan de ene kant is er schone energie, aan de andere kant is er bezorgdheid."}
  nl.c1.unit07.lesson02.exercise06.spreek_tegenspreken: {instruction: "Say: The plan and the survey contradict each other. Use elkaar tegenspreken.", accepted_answers: [{value: "Het plan en het buurtonderzoek spreken elkaar tegen", status: correct}, {value: "Het plan en het onderzoek spreken elkaar tegen", status: correct}, {value: "Het buurtonderzoek en het plan spreken elkaar tegen", status: correct}, {value: "Het onderzoek en het plan spreken elkaar tegen", status: correct}], feedback: "Het plan en het buurtonderzoek spreken elkaar tegen. Two subjects take the plural verb *spreken*, and *elkaar* marks the mutual contradiction."}
  nl.c1.unit07.lesson02.exercise07.schrijf_plan: {instruction: "Report this as a claim of the plan, using stelt dat: 'De molens leveren schone energie.'", accepted_answers: [{value: "Het plan stelt dat de molens schone energie leveren", status: correct}], feedback: "Het plan stelt dat de molens schone energie leveren. After *dat* the verb goes to the end of the clause."}
  nl.c1.unit07.lesson03.exercise01.lees_rapport: {instruction: "In the text, what does *Het rapport stelt dat de overlast beperkt blijft* claim?", correct_option: "That the nuisance will stay limited.", distractors: ["That the nuisance will grow worse.", "That the park will be cancelled.", "That no one was consulted."], accepted_answers: [{value: "That the nuisance will stay limited.", status: correct}], feedback: "The report claims the nuisance stays limited; *beperkt blijft* = stays limited."}
  nl.c1.unit07.lesson03.exercise02.lees_voorbehoud: {instruction: "In the text, what does the *buurtonderzoek* do that the report does not?", correct_option: "It makes a reservation about the claim.", distractors: ["It repeats the claim word for word.", "It endorses the plan fully.", "It publishes the figures."], accepted_answers: [{value: "It makes a reservation about the claim.", status: correct}], feedback: "The survey *maakt een voorbehoud* — it registers a caveat that the claim is unproven."}
  nl.c1.unit07.lesson03.exercise03.koppel_bronnen: {instruction: "Match each phrase to its meaning.", pairs: [{left: "het rapport stelt", right: "the report asserts"}, {left: "beperkt blijft", right: "stays limited"}, {left: "volgens het onderzoek", right: "according to the research"}, {left: "een voorbehoud maken", right: "to make a reservation"}, {left: "niet bewezen", right: "not proven"}, {left: "niet uitgesloten", right: "not ruled out"}, {left: "de vakterm", right: "the technical term"}, {left: uitleggen, right: "to explain"}], accepted_answers: [{value: [{left: "het rapport stelt", right: "the report asserts"}, {left: "beperkt blijft", right: "stays limited"}, {left: "volgens het onderzoek", right: "according to the research"}, {left: "een voorbehoud maken", right: "to make a reservation"}, {left: "niet bewezen", right: "not proven"}, {left: "niet uitgesloten", right: "not ruled out"}, {left: "de vakterm", right: "the technical term"}, {left: uitleggen, right: "to explain"}], status: correct}], feedback: "These phrases let you read a source critically and attribute claims."}
  nl.c1.unit07.lesson03.exercise04.orden_voorbehoud: {instruction: "Put the words in order to say: I have reservations about these figures.", accepted_answers: [{value: "Ik maak een voorbehoud bij deze cijfers", status: correct}], feedback: "*Een voorbehoud maken bij* = to register a caveat about."}
  nl.c1.unit07.lesson03.exercise05.vertaal_onderzoek: {instruction: "Translate: According to the survey (het buurtonderzoek), the nuisance (de overlast) is not proven. Start with Volgens.", accepted_answers: [{value: "Volgens het buurtonderzoek is de overlast niet bewezen", status: correct}, {value: "Volgens het buurtonderzoek is de overlast nog niet bewezen", status: correct}, {value: "Volgens het onderzoek is de overlast niet bewezen", status: correct}, {value: "Volgens het onderzoek is de overlast nog niet bewezen", status: correct}], feedback: "Volgens het buurtonderzoek is de overlast niet bewezen. *Volgens* attributes the doubt to the survey, and the verb comes right after it."}
  nl.c1.unit07.lesson03.exercise06.spreek_vakterm: {instruction: "Omar says: 'Ik moet de vakterm uitleggen.' Report this in indirect speech, starting with Omar zegt dat.", accepted_answers: [{value: "Omar zegt dat hij de vakterm moet uitleggen", status: correct}, {value: "Omar zegt dat hij de vakterm uitleggen moet", status: correct}], feedback: "Omar zegt dat hij de vakterm moet uitleggen. In indirect speech *ik* becomes *hij* and the verbs go to the end of the *dat*-clause."}
  nl.c1.unit07.lesson03.exercise07.schrijf_voorbehoud: {instruction: "Combine these two sentences into one with terwijl (contrast); the report's claim goes in the terwijl-clause: 'Het rapport stelt dat de overlast beperkt blijft. Ik maak een voorbehoud bij deze cijfers.'", accepted_answers: [{value: "Terwijl het rapport stelt dat de overlast beperkt blijft, maak ik een voorbehoud bij deze cijfers", status: correct}, {value: "Terwijl het rapport stelt dat de overlast beperkt blijft, maak ik bij deze cijfers een voorbehoud", status: correct}, {value: "Ik maak een voorbehoud bij deze cijfers, terwijl het rapport stelt dat de overlast beperkt blijft", status: correct}, {value: "Ik maak bij deze cijfers een voorbehoud, terwijl het rapport stelt dat de overlast beperkt blijft", status: correct}], feedback: "Terwijl het rapport stelt dat de overlast beperkt blijft, maak ik een voorbehoud bij deze cijfers. The *terwijl*-clause takes the verb at its end; when it comes first, the main clause starts with its verb (*maak ik*)."}
  nl.c1.unit07.lesson04.exercise01.herken_begrijpelijk: {instruction: "What does *Ik zet het om in begrijpelijke taal* mean?", correct_option: "I convert it into plain language.", distractors: ["I translate it literally.", "I make it more complicated.", "I delete it."], accepted_answers: [{value: "I convert it into plain language.", status: correct}], feedback: "*Begrijpelijke taal* = understandable, plain language."}
  nl.c1.unit07.lesson04.exercise02.herken_dat_wil_zeggen: {instruction: "What is *dat wil zeggen* doing in the sentence Een decibel is een maat voor geluid, dat wil zeggen hoe hard iets klinkt?", correct_option: "It introduces a plain restatement.", distractors: ["It adds a new, unrelated fact.", "It contradicts the first half.", "It quotes a dictionary."], accepted_answers: [{value: "It introduces a plain restatement.", status: correct}], feedback: "*Dat wil zeggen* glosses the technical term in everyday words."}
  nl.c1.unit07.lesson04.exercise03.koppel_publiek: {instruction: "Match each phrase to its meaning.", pairs: [{left: "in begrijpelijke taal", right: "in plain, understandable language"}, {left: "dat wil zeggen", right: "that is to say"}, {left: "een maat voor geluid", right: "a measure of sound"}, {left: kortom, right: "in short"}, {left: "de leek", right: "the layperson"}, {left: "gewone taal", right: "everyday language"}], accepted_answers: [{value: [{left: "in begrijpelijke taal", right: "in plain, understandable language"}, {left: "dat wil zeggen", right: "that is to say"}, {left: "een maat voor geluid", right: "a measure of sound"}, {left: kortom, right: "in short"}, {left: "de leek", right: "the layperson"}, {left: "gewone taal", right: "everyday language"}], status: correct}], feedback: "These phrases help you explain a technical subject to a general audience."}
  nl.c1.unit07.lesson04.exercise04.orden_kortom: {instruction: "Put the words in order to say: In short, the two sources do not agree.", accepted_answers: [{value: "Kortom de twee bronnen zijn het niet eens", status: correct}], feedback: "*Kortom* opens a one-line summary."}
  nl.c1.unit07.lesson04.exercise05.vertaal_dat_wil_zeggen: {instruction: "Translate: A decibel is a measure of sound, that is to say how loud something sounds. Use ... dat wil zeggen ...", accepted_answers: [{value: "Een decibel is een maat voor geluid, dat wil zeggen hoe hard iets klinkt.", status: correct}, {value: "Een decibel is een maat voor geluid, dat wil zeggen hoe luid iets klinkt.", status: correct}], feedback: "*Dat wil zeggen* introduces the plain explanation."}
  nl.c1.unit07.lesson04.exercise06.spreek_kortom: {instruction: "Say: In short, the two sources contradict each other. Use Kortom and elkaar tegenspreken.", accepted_answers: [{value: "Kortom, de twee bronnen spreken elkaar tegen.", status: correct}, {value: "Kortom spreken de twee bronnen elkaar tegen.", status: correct}, {value: "Kortom, beide bronnen spreken elkaar tegen.", status: correct}, {value: "Kortom spreken beide bronnen elkaar tegen.", status: correct}], feedback: "Kortom, de twee bronnen spreken elkaar tegen. *Kortom* opens the conclusion; after it the word order is either subject-verb or, without a comma, verb-subject."}
  nl.c1.unit07.lesson04.exercise07.schrijf_begrijpelijk: {instruction: "Omar says: 'Mijn publiek begrijpt de vaktermen niet.' Report this in indirect speech, starting with Omar zegt dat.", accepted_answers: [{value: "Omar zegt dat zijn publiek de vaktermen niet begrijpt", status: correct}], feedback: "Omar zegt dat zijn publiek de vaktermen niet begrijpt. In indirect speech *mijn* becomes *zijn* and the verb goes to the end of the *dat*-clause."}
  nl.c1.unit07.lesson05.exercise01.herken_beide: {instruction: "What does *De twee bronnen zijn het met elkaar eens* mean?", correct_option: "The two sources agree with each other.", distractors: ["The two sources avoid each other.", "The two sources are both published.", "The two sources are both short."], accepted_answers: [{value: "The two sources agree with each other.", status: correct}], feedback: "*Het met elkaar eens zijn* = to agree with each other."}
  nl.c1.unit07.lesson05.exercise02.herken_naar_verluidt: {instruction: "What does *naar verluidt* signal in Het geluid is naar verluidt nog niet gemeten?", correct_option: "That the claim is reported but unconfirmed.", distractors: ["That the noise was measured carefully.", "That the noise is very loud.", "That the noise stopped."], accepted_answers: [{value: "That the claim is reported but unconfirmed.", status: correct}], feedback: "*Naar verluidt* marks the claim as reported, not confirmed."}
  nl.c1.unit07.lesson05.exercise03.koppel_samenvatting: {instruction: "Match each phrase to its meaning.", pairs: [{left: "de twee bronnen", right: "the two sources"}, {left: "de een ... de ander", right: "the one ... the other"}, {left: "wijst op", right: "points to"}, {left: behoudens, right: "subject to, barring"}, {left: "naar verluidt", right: "reportedly"}, {left: "een uitzondering", right: "an exception"}], accepted_answers: [{value: [{left: "de twee bronnen", right: "the two sources"}, {left: "de een ... de ander", right: "the one ... the other"}, {left: "wijst op", right: "points to"}, {left: behoudens, right: "subject to, barring"}, {left: "naar verluidt", right: "reportedly"}, {left: "een uitzondering", right: "an exception"}], status: correct}], feedback: "These phrases let you synthesize two sources fairly."}
  nl.c1.unit07.lesson05.exercise04.orden_beide: {instruction: "Put the words in order to say: The two sources agree with each other: something has to happen.", accepted_answers: [{value: "De twee bronnen zijn het met elkaar eens er moet iets gebeuren", status: correct}], feedback: "*Het met elkaar eens zijn* names the shared ground."}
  nl.c1.unit07.lesson05.exercise05.vertaal_naar_verluidt: {instruction: "Translate: The figures have reportedly not yet been confirmed. Use naar verluidt.", accepted_answers: [{value: "De cijfers zijn naar verluidt nog niet bevestigd", status: correct}, {value: "Naar verluidt zijn de cijfers nog niet bevestigd", status: correct}], feedback: "De cijfers zijn naar verluidt nog niet bevestigd. *Naar verluidt* = reportedly; it can also open the sentence: Naar verluidt zijn de cijfers nog niet bevestigd."}
  nl.c1.unit07.lesson05.exercise06.spreek_de_een: {instruction: "Contrast these two sources in one sentence with de een ... de ander (the plan is de een, the survey is de ander); join the halves with a comma or en, no other connector: 'Het plan wijst op de schone energie. Het buurtonderzoek wijst op de geluidsoverlast.'", accepted_answers: [{value: "De een wijst op de schone energie, de ander op de geluidsoverlast.", status: correct}, {value: "De een wijst op de schone energie en de ander op de geluidsoverlast.", status: correct}, {value: "De een wijst op de schone energie, de ander wijst op de geluidsoverlast.", status: correct}, {value: "De een wijst op de schone energie en de ander wijst op de geluidsoverlast.", status: correct}], feedback: "De een wijst op de schone energie, de ander op de geluidsoverlast. *De een ... de ander* replaces the two source names; the second verb may be left out or repeated."}
  nl.c1.unit07.lesson05.exercise07.schrijf_behoudens: {instruction: "Write: Barring this point, the two sources agree with each other. Start with Behoudens and use dit punt.", accepted_answers: [{value: "Behoudens dit punt zijn de twee bronnen het met elkaar eens", status: correct}, {value: "Behoudens dit punt zijn de twee bronnen het eens", status: correct}, {value: "Behoudens dit punt zijn de twee bronnen het eens met elkaar", status: correct}, {value: "Behoudens dit punt zijn beide bronnen het met elkaar eens", status: correct}, {value: "Behoudens dit punt zijn beide bronnen het eens", status: correct}, {value: "Behoudens dit punt zijn beide bronnen het eens met elkaar", status: correct}], feedback: "Behoudens dit punt zijn de twee bronnen het met elkaar eens. After the fronted *behoudens dit punt* the verb comes next (*zijn*), then the subject."}
  nl.c1.unit07.lesson06.exercise01.luister_briefing: {instruction: "Listen. Which sentence sums up the conflict between the two sources?", correct_option: "The plan says the nuisance is minimal, but the survey contradicts that.", distractors: ["The plan says the nuisance is severe.", "The survey fully agrees with the plan.", "The municipality has cancelled the project."], accepted_answers: [{value: "The plan says the nuisance is minimal, but the survey contradicts that.", status: correct}], feedback: "The clip contrasts the municipality's 'minimal' with the survey's contradiction."}
  nl.c1.unit07.lesson06.exercise02.lees_briefing: {instruction: "In the briefing, which sentence marks the point the two sources agree on?", correct_option: "The two sources agree that something must happen.", distractors: ["The report claims the nuisance is minimal.", "The survey says the claim is unproven.", "The briefing names a point of disagreement."], accepted_answers: [{value: "The two sources agree that something must happen.", status: correct}], feedback: "The sentence *De twee bronnen zijn het met elkaar eens* marks the shared ground."}
  nl.c1.unit07.lesson06.exercise03.koppel_overzicht: {instruction: "Match each phrase from the briefing to its meaning.", pairs: [{left: "kort samenvatten", right: "to summarize briefly"}, {left: volgens, right: "according to"}, {left: "levert schone energie", right: "produces clean energy"}, {left: "blijft beperkt", right: "stays limited"}, {left: "het eens zijn", right: "to agree"}, {left: behoudens, right: "barring"}, {left: "het punt van tegenspraak", right: "the point of disagreement"}, {left: helder, right: "clear"}], accepted_answers: [{value: [{left: "kort samenvatten", right: "to summarize briefly"}, {left: volgens, right: "according to"}, {left: "levert schone energie", right: "produces clean energy"}, {left: "blijft beperkt", right: "stays limited"}, {left: "het eens zijn", right: "to agree"}, {left: behoudens, right: "barring"}, {left: "het punt van tegenspraak", right: "the point of disagreement"}, {left: helder, right: "clear"}], status: correct}], feedback: "These phrases hold the briefing together: attribution, claims, and the named disagreement."}
  nl.c1.unit07.lesson06.exercise04.orden_kern: {instruction: "Put the words in order to say: According to the municipality, the nuisance is minimal, but the research contradicts that.", accepted_answers: [{value: "Volgens de gemeente is de overlast minimaal maar het onderzoek spreekt dat tegen", status: correct}], feedback: "This one sentence captures both sides of the conflict."}
  nl.c1.unit07.lesson06.exercise05.spreek_briefing: {instruction: "Say: According to the survey, many residents fear noise nuisance. Start with Volgens and use vrezen.", accepted_answers: [{value: "Volgens het buurtonderzoek vrezen veel bewoners geluidsoverlast", status: correct}, {value: "Volgens het buurtonderzoek vrezen veel bewoners voor geluidsoverlast", status: correct}, {value: "Volgens het onderzoek vrezen veel bewoners geluidsoverlast", status: correct}, {value: "Volgens het onderzoek vrezen veel bewoners voor geluidsoverlast", status: correct}], feedback: "Volgens het buurtonderzoek vrezen veel bewoners geluidsoverlast. After *volgens ...* the verb comes next (*vrezen*), then the subject."}
  nl.c1.unit07.lesson06.exercise06.schrijf_briefing: {instruction: "Join these two sentences into one with omdat; the second sentence gives the reason: 'Omar vat de twee bronnen kort samen. Het publiek begrijpt de vaktermen niet.'", accepted_answers: [{value: "Omar vat de twee bronnen kort samen omdat het publiek de vaktermen niet begrijpt", status: correct}, {value: "Omdat het publiek de vaktermen niet begrijpt, vat Omar de twee bronnen kort samen", status: correct}], feedback: "Omar vat de twee bronnen kort samen omdat het publiek de vaktermen niet begrijpt. After *omdat* the verb goes to the end; if the *omdat*-clause comes first, the main clause starts with its verb: Omdat het publiek de vaktermen niet begrijpt, vat Omar de twee bronnen kort samen."}
  nl.c1.unit07.lesson06.exercise07.dictaat_kern: {instruction: "Type exactly what you hear.", correct_response: "Volgens de gemeente is de overlast minimaal, maar het onderzoek spreekt dat tegen.", orthography_strict: true, feedback: "The clip captures both sides: the municipality's 'minimal' and the survey's contradiction."}
