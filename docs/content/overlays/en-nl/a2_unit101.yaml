  nl.a2.unit101.lesson03.exercise06.vertaal_boekje:
    instruction: Translate into Dutch.
    accepted_answers:
    - {value: Dat boekje is goedkoop., status: correct}
    - {value: Dat boekje is goedkoop, status: correct}
    feedback: '*Dat boekje is goedkoop.* A diminutive takes *dat*.'
  nl.a2.unit101.lesson03.exercise07.schrijf_roosjes:
    instruction: Write the requested Dutch sentence.
    accepted_answers:
    - {value: Die roosjes zijn mooi., status: correct}
    - {value: Die roosjes zijn mooi, status: correct}
    feedback: '*Die roosjes zijn mooi.* Plural: *die*.'
    correct_option: Die roosjes zijn mooi.
  nl.a2.unit101.lesson04.exercise01.prijs_broodje:
    instruction: Choose the correct question.
