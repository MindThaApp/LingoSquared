    - {value: Deze appels zijn goedkoop en die tomaten zijn lekker., status: correct}
    feedback: '*Deze appels zijn goedkoop, en die tomaten zijn lekker.*'
  nl.a2.unit101.lesson05.exercise06.dictee_appels: {instruction: Type what you hear., correct_response: 'Deze appels zijn goedkoop, en die tomaten zijn lekker.', orthography_strict: true, feedback: 'You heard *Deze appels zijn goedkoop, en die tomaten zijn lekker.*'}
  nl.a2.unit101.lesson05.exercise07.dictee_bloemetje: {instruction: Type what you hear., correct_response: Ik neem dit bloemetje voor jou., orthography_strict: true, feedback: You heard *Ik neem dit bloemetje voor jou.*}
