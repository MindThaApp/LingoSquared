schema_version: '1.1'
overlay_version: 2026.1-draft.1
overlay_key: en-nl.a2.unit101
source_language: en
target_language: nl
cefr_level: A2
status: complete_draft
review: {status: unreviewed, required_next_reviewer: ramin_native_pass, notes: 'English overlay for the this/that and diminutives unit. OPEN NATIVE QUESTIONS: see the realization review notes.'}
course: {title: Dutch A2, description: Grammar-led A2 Dutch for pointing out and specifying things., learning_goal: 'Point out and specify items with dit, dat, deze and die, and use diminutives, when shopping or choosing.'}
units:
  nl.a2.unit101.deze_die_dit_dat: {title: 'This one, that one', description: 'Point out and choose items at the market, bakery, florist and bookshop with dit, dat, deze, die and diminutives.'}
lessons:
  nl.a2.unit101.lesson01.dit_en_deze: {title: 'This (near): dit and deze'}
  nl.a2.unit101.lesson02.die_en_dat: {title: 'That (far) and plural: die and dat'}
  nl.a2.unit101.lesson03.verkleinwoorden: {title: 'Small things: diminutives with -je'}
  nl.a2.unit101.lesson04.winkelen: {title: 'Shopping: asking prices and choosing'}
  nl.a2.unit101.lesson05.bericht_van_noor: {title: 'Reading: a message from Noor'}
  nl.a2.unit101.lesson06.lotte_en_omar: {title: 'Dialogue: Lotte and Omar at the market'}
teaching:
  nl.a2.unit101.lesson01.teach.markt:
    title: At the market
    gloss: the market / the stall / the apple / the tomato / the cheese
    note: 'Learn each noun with its article: de or het. Every noun in this card is a de-word.'
    example_gloss: [I am at the market., I see a stall., I take an apple.]
  nl.a2.unit101.lesson01.teach.bakker:
    title: At the baker
    gloss: the baker / the bread / the cake / the biscuit
    note: '*Brood* is a het-word; the others are de-words.'
    example_gloss: [I am at the baker., The bread is fresh., The cake is tasty.]
  nl.a2.unit101.lesson01.teach.bloemist:
    title: At the florist
    gloss: the florist / the rose / the bouquet
    note: '*Boeket* is a het-word; *roos* is a de-word.'
    example_gloss: [At the florist I see a rose., The bouquet is beautiful., I take a bouquet.]
  nl.a2.unit101.lesson01.teach.boekwinkel:
    title: At the bookshop
    gloss: the bookshop / the book / the novel / the newspaper
    note: '*Boek* is a het-word; the others are de-words.'
    example_gloss: [In the bookshop I am looking for a book., I am looking for a novel., The newspaper is expensive.]
  nl.a2.unit101.lesson01.teach.bijvoeglijk:
    title: Describing things
    gloss: fresh / tasty / beautiful / cheap / expensive / big / small
    note: These words come after *is* and do not change.
    example_gloss: [The tomato is small., The book is cheap., The stall is big.]
  nl.a2.unit101.lesson01.teach.gn_dit_deze: {title: 'This: dit or deze', gloss: het brood → this bread; de taart → this cake; de roos → this rose; het boek → this book., note: 'To point at something near you, use *dit* with a het-word and *deze* with a de-word. So you must know the article: *dit brood* (het brood), *deze taart* (de taart).'}
  nl.a2.unit101.lesson01.teach.zinnen: {title: Two sentences, gloss: This bread is fresh. This cake is tasty.}
  nl.a2.unit101.lesson02.teach.meervoud:
    title: Plurals
    gloss: the apples / the tomatoes / the roses / the books / the newspapers
    note: 'Plural nouns end in -s or -en. *Het boek* becomes *de boeken*: in the plural every noun takes *de*.'
    example_gloss: [The apples are cheap., The tomatoes are tasty., The roses are beautiful.]
  nl.a2.unit101.lesson02.teach.gn_die_dat: {title: 'That: dat or die', gloss: het brood → that bread; de taart → that cake; het boek → that book; de roos → that rose., note: 'To point at something farther away, use *dat* with a het-word and *die* with a de-word. It is the same pattern as *dit* and *deze*: *dit/dat* for het-words, *deze/die* for de-words.'}
  nl.a2.unit101.lesson02.teach.gn_meervoud: {title: 'Plural: always deze or die', gloss: 'these apples, these books; those roses, those books.', note: 'With a plural noun you always use *deze* (near) or *die* (far), even when the singular is a het-word: *dit boek*, but *deze boeken*. Before a noun, *dit* and *dat* are only for singular het-words (on their own, as in *Wat is dat?*, they can point at anything).'}
  nl.a2.unit101.lesson02.teach.zinnen: {title: Three sentences, gloss: That cake is big. That bread is small. Those apples are cheap.}
  nl.a2.unit101.lesson03.teach.verkleinwoorden:
    title: Small things
    gloss: the bread roll / the booklet / the little biscuit / the little rose / the little apple / the small bunch of flowers
    note: A diminutive names something small or sweet. Bakers, florists and bookshops use them all the time.
    example_gloss: [This bread roll is tasty., The little bunch of flowers is beautiful., The booklet is cheap.]
  nl.a2.unit101.lesson03.teach.gn_je: {title: 'Diminutive: -je', gloss: bread → bread roll; book → booklet; biscuit → little biscuit; rose → little rose; tomato → little tomato., note: 'Most words just add -je: *brood* becomes *broodje*, *boek* becomes *boekje*.'}
  nl.a2.unit101.lesson03.teach.bijzonder:
    title: Two more nouns
    gloss: the tree / the table
    example_gloss: [I see a tree., The table is big.]
  nl.a2.unit101.lesson03.teach.gn_tje_pje: {title: 'Diminutive: -tje and -pje', gloss: apple → little apple; table → little table; tree → little tree; stall → little stall; flower → small bunch of flowers., note: 'After -el you add -tje (*appeltje*). After -m with a long vowel you add -pje (*boompje*, *kraampje*). A few words change more, such as *bloem*, which becomes *bloemetje*. Learn these as you meet them.'}
  nl.a2.unit101.lesson03.teach.gn_het: {title: A diminutive is always a het-word, gloss: 'the apple → the little apple: this little apple, that little apple. the rose → the little rose: this little rose, that little rose.', note: 'Every diminutive is a het-word, even when the base word is a de-word. So *de appel* becomes *het appeltje* and you say *dit appeltje* and *dat appeltje*, never *deze appeltje*.'}
  nl.a2.unit101.lesson03.teach.gn_meervoud_je: {title: Plural of a diminutive, gloss: 'the bread roll → the bread rolls: these bread rolls. the booklet → the booklets: those booklets. the small bunch of flowers → the small bunches of flowers. the little rose → the little roses.', note: 'The plural of a diminutive ends in -jes: *broodjes*, *boekjes*, *appeltjes*, *roosjes*. In the plural you use *deze* and *die*, as with every plural.'}
  nl.a2.unit101.lesson04.teach.prijzen:
    title: Prices
    gloss: what does it cost / what do they cost / euro / two / three / four / five
    note: Use *kost* with one thing and *kosten* with more than one.
    example_gloss: [This bread roll costs two euros., These roses cost five euros., That book costs three euros.]
  nl.a2.unit101.lesson04.teach.gn_kost: {title: Kost or kosten, gloss: 'What does this bread roll cost? What do these bread rolls cost?', note: 'The verb agrees with the noun that is pointed at: one thing takes *kost*, several things take *kosten*.'}
  nl.a2.unit101.lesson04.teach.kiezen: {title: Choosing and asking, gloss: I take that booklet. I am looking for a novel. This small bunch of flowers costs two euros.}
  nl.a2.unit101.lesson04.teach.gn_alleen: {title: Dit and dat on their own, gloss: 'What is that? That is a rose.', note: 'When you point without a noun and ask what something is, you use *dit* or *dat*, even if the thing is a de-word: *Wat is dat? Dat is een roos.*'}
  nl.a2.unit101.lesson05.teach.reading:
    title: Noor's message
    gloss: Hi Lotte! I am at the market. These apples are cheap, and those tomatoes are tasty. At the baker's this bread roll is small, but that loaf is big. I take this bread roll. Those roses are beautiful, but this small bunch of flowers is cheap. I am taking this small bunch of flowers for you!
    note: 'Look at which word Noor uses with each noun: dit/dat with het-words, deze/die with de-words and plurals.'
    glosses: {hoi: hi, maar: but, voor: for, jou: you, bij: at / by}
  nl.a2.unit101.lesson06.teach.lotte_brood: {title: Lotte points out the bread, gloss: 'Lotte: Omar, look! This bread is fresh.'}
  nl.a2.unit101.lesson06.teach.omar_broodje: {title: Omar points at a roll farther away, gloss: 'Omar: Yes, and that bread roll is cheap.'}
  nl.a2.unit101.lesson06.teach.lotte_neemt: {title: Lotte chooses, gloss: 'Lotte: Then I will take that bread roll. And you?'}
  nl.a2.unit101.lesson06.teach.omar_taart: {title: Omar chooses, gloss: 'Omar: I take this cake and this biscuit.'}
  nl.a2.unit101.lesson06.teach.lotte_bloemetje: {title: Lotte sees the flowers, gloss: 'Lotte: Look, this small bunch of flowers is beautiful!'}
  nl.a2.unit101.lesson06.teach.omar_rozen: {title: Omar points at the roses, gloss: 'Omar: Yes, and those roses are beautiful too.'}
exercises:
  nl.a2.unit101.lesson01.exercise01.dit_brood:
    instruction: Choose the Dutch for the English phrase.
    correct_option: Dit brood
    distractors: [Deze brood, Dit taart]
    accepted_answers:
    - {value: Dit brood, status: correct}
    feedback: '*Brood* is a het-word, so you say *dit brood*.'
  nl.a2.unit101.lesson01.exercise02.match_near:
    instruction: Match each Dutch phrase to its English meaning.
    accepted_answers:
    - value:
      - {left: dit brood, right: this bread}
      - {left: deze taart, right: this cake}
      - {left: dit boek, right: this book}
      - {left: deze krant, right: this newspaper}
      - {left: dit boeket, right: this bouquet}
      - {left: deze roos, right: this rose}
      - {left: deze tomaat, right: this tomato}
      - {left: deze kaas, right: this cheese}
      status: correct
    feedback: Het-words take *dit*, de-words take *deze*.
  nl.a2.unit101.lesson01.exercise03.deze_krant:
    instruction: Choose the Dutch for the English phrase.
    correct_option: Deze krant
    distractors: [Dit krant, Dit de krant]
    accepted_answers:
    - {value: Deze krant, status: correct}
    feedback: '*Krant* is a de-word, so you say *deze krant*.'
  nl.a2.unit101.lesson01.exercise04.vul_dit:
    instruction: Complete with the Dutch word for "this" (near you).
    correct_option: dit
    accepted_answers:
    - {value: dit, status: correct}
    - {value: Dit, status: correct}
    feedback: '*Brood* is a het-word: *dit brood*.'
  nl.a2.unit101.lesson01.exercise05.volgorde_taart:
    instruction: 'Put the words in order: "This cake is tasty."'
    correct_option: Deze taart is lekker
    accepted_answers:
    - {value: Deze taart is lekker, status: correct}
    feedback: '*Deze taart is lekker.*'
  nl.a2.unit101.lesson01.exercise06.vertaal_boek:
    instruction: Translate into Dutch.
    accepted_answers:
    - {value: Dit boek is duur., status: correct}
    - {value: Dit boek is duur, status: correct}
    feedback: '*Dit boek is duur.* *Boek* is a het-word.'
  nl.a2.unit101.lesson01.exercise07.schrijf_roos:
    instruction: Write the requested Dutch sentence.
    accepted_answers:
    - {value: Deze roos is mooi., status: correct}
    - {value: Deze roos is mooi, status: correct}
    feedback: '*Deze roos is mooi.* *Roos* is a de-word.'
    correct_option: Deze roos is mooi.
  nl.a2.unit101.lesson02.exercise01.luister_taart:
    instruction: Listen and select what you hear.
    correct_option: Die taart is groot.
    distractors: [Deze taart is groot., Dat brood is groot., Die taart is klein.]
    accepted_answers:
    - {value: Die taart is groot., status: correct}
    feedback: You heard *Die taart is groot.*
  nl.a2.unit101.lesson02.exercise02.die_appels:
    instruction: Choose the Dutch for the English phrase.
    correct_option: Die appels
    distractors: [Dat appels, Deze appels, Dit appels]
    accepted_answers:
    - {value: Die appels, status: correct}
    feedback: 'A plural noun takes *die* for "those": *die appels*.'
  nl.a2.unit101.lesson02.exercise03.match_dit_dat:
    instruction: Match each Dutch phrase to its English meaning.
    accepted_answers:
    - value:
      - {left: dit brood, right: this bread}
      - {left: dat brood, right: that bread}
      - {left: deze taart, right: this cake}
      - {left: die taart, right: that cake}
      - {left: deze appels, right: these apples}
      - {left: die appels, right: those apples}
      - {left: deze boeken, right: these books}
      - {left: die boeken, right: those books}
      status: correct
    feedback: '*Dit/dat* go with singular het-words; *deze/die* go with de-words and with all plurals.'
  nl.a2.unit101.lesson02.exercise04.dat_boek:
    instruction: Choose the Dutch for the English phrase.
    correct_option: Dat boek
    distractors: [Die boek, Deze boek, Dit boek]
    accepted_answers:
    - {value: Dat boek, status: correct}
    feedback: '*Boek* is a het-word, so "that book" is *dat boek*.'
  nl.a2.unit101.lesson02.exercise05.volgorde_appels:
    instruction: 'Put the words in order: "Those apples are cheap."'
    correct_option: Die appels zijn goedkoop
    accepted_answers:
    - {value: Die appels zijn goedkoop, status: correct}
    feedback: '*Die appels zijn goedkoop.*'
  nl.a2.unit101.lesson02.exercise06.vul_die:
    instruction: Complete with the Dutch word for "those".
    correct_option: die
    accepted_answers:
    - {value: die, status: correct}
    - {value: Die, status: correct}
    feedback: 'A plural takes *die* for "those": *die rozen*.'
  nl.a2.unit101.lesson02.exercise07.vertaal_boeken:
    instruction: Translate into Dutch.
    accepted_answers:
    - {value: Die boeken zijn duur., status: correct}
    - {value: Die boeken zijn duur, status: correct}
    feedback: '*Die boeken zijn duur.* Plural: *die*, not *dat*.'
  nl.a2.unit101.lesson03.exercise01.match_verkleining:
    instruction: Match each word to its diminutive.
    accepted_answers:
    - value:
      - {left: brood, right: broodje}
      - {left: boek, right: boekje}
      - {left: appel, right: appeltje}
      - {left: boom, right: boompje}
      - {left: kraam, right: kraampje}
      - {left: roos, right: roosje}
      - {left: bloem, right: bloemetje}
      - {left: tomaat, right: tomaatje}
      status: correct
    feedback: Most take -je; after -el it is -tje, after -m with a long vowel it is -pje; *bloem* becomes *bloemetje*.
  nl.a2.unit101.lesson03.exercise02.dit_broodje:
    instruction: Choose the Dutch for the English phrase.
    correct_option: Dit broodje
    distractors: [Deze broodje, Die broodje, Dit broodjes]
    accepted_answers:
    - {value: Dit broodje, status: correct}
    feedback: 'A diminutive is a het-word: *dit broodje*.'
  nl.a2.unit101.lesson03.exercise03.deze_broodjes:
    instruction: Choose the Dutch for the English phrase.
    correct_option: Deze broodjes
    distractors: [Dit broodjes, Dit broodje, Deze broodje]
    accepted_answers:
    - {value: Deze broodjes, status: correct}
    feedback: 'A plural always takes *deze*: *deze broodjes*.'
  nl.a2.unit101.lesson03.exercise04.vul_appeltje:
    instruction: Complete with the Dutch word for "this" (near you).
    correct_option: dit
    accepted_answers:
    - {value: dit, status: correct}
    - {value: Dit, status: correct}
    feedback: '*Appeltje* is a diminutive, so it is a het-word: *dit appeltje*.'
  nl.a2.unit101.lesson03.exercise05.volgorde_bloemetje:
    instruction: 'Put the words in order: "This small bunch of flowers is beautiful."'
    correct_option: Dit bloemetje is mooi
