units:
  nl.c1.unit01.betoogstructuur: {title: "Structuring an extended contribution", description: "Signpost a long contribution, develop linked points, bound a digression, return explicitly, and sustain cohesion through the synthesis."}
lessons:
  nl.c1.unit01.lesson01.koers_aangeven: {title: "Preview the direction"}
  nl.c1.unit01.lesson02.punten_ontwikkelen: {title: "Connect and develop points"}
