teaching:
  nl.c1.unit01.lesson01.teach.om_te_beginnen: {title: "to begin with", gloss: "to begin with", note: "*Om te beginnen* opens the first stage and promises an organized route rather than merely adding another point."}
  nl.c1.unit01.lesson01.teach.eerst_daarna: {title: "First I outline the problem; then I discuss the advantages.", gloss: "first ... then ...", note: "*Eerst ... daarna ...* gives the listener a two-stage roadmap before the detail begins."}
  nl.c1.unit01.lesson01.teach.in_grote_lijnen: {title: "in broad terms", gloss: "in broad terms / in outline", note: "*In grote lijnen* deliberately limits detail and tells the audience to listen for the overall shape."}
  nl.c1.unit01.lesson01.teach.koerszin: {title: "A complete roadmap", gloss: "To begin, I outline the problem in broad terms; then I discuss the advantages.", note: "This sentence combines an opening boundary, a scope marker, and a promised second stage."}
  nl.c1.unit01.lesson02.teach.vervolgens: {title: "subsequently", gloss: "next / subsequently", note: "*Vervolgens* fulfills the roadmap by moving into the next planned section.", example_gloss: "Next I discuss the main advantage."}
  nl.c1.unit01.lesson02.teach.namelijk: {title: "namely", gloss: "namely / that is", note: "*Namelijk* specifies the exact content of a general point; here it names what the main benefit is.", example_gloss: "There is one main advantage, namely cleaner air."}
  nl.c1.unit01.lesson02.teach.daarbij: {title: "connected with that", gloss: "in addition to that / associated with that", note: "*Daarbij* does more than mean 'also': it presents the next point as attached to the preceding one.", example_gloss: "Associated with that is more space for pedestrians."}
  nl.c1.unit01.lesson02.teach.ontwikkeling: {title: "Developing a linked point", gloss: "Next I discuss the main advantage, namely cleaner air. Associated with that is more space for pedestrians.", note: "The sequence moves from general claim to specification and then to a related consequence."}
  nl.c1.unit01.lesson03.teach.even_een_uitstapje: {title: "Now I will briefly digress.", gloss: "now I will briefly make a digression", note: "*Even* promises brevity and *een uitstapje* explicitly marks departure from the main line."}
  nl.c1.unit01.lesson03.teach.terzijde: {title: "As an aside, I want to mention one objection.", gloss: "as an aside", note: "*Terzijde* creates a clear boundary around material that matters but is not the argument's main route."}
  nl.c1.unit01.lesson03.teach.begrijpelijke_zorg: {title: "Shop owners fear a loss of revenue, an understandable concern.", gloss: "an understandable concern", note: "Calling it *een begrijpelijke zorg* gives the digression genuine relevance instead of treating it as random detail."}
  nl.c1.unit01.lesson03.teach.grens: {title: "Bounding the digression", gloss: "Now I will briefly digress. As an aside, I want to name one objection: shop owners fear loss of revenue.", note: "The two boundary markers tell the audience exactly when the side path begins."}
  nl.c1.unit01.lesson04.teach.om_terug_te_komen: {title: "to return to my main idea", gloss: "to return to my central point", note: "*Om terug te komen op mijn hoofdgedachte* names both the return and the precise line being resumed."}
  nl.c1.unit01.lesson04.teach.dat_neemt_niet_weg: {title: "That does not alter the fact that the city centre becomes more attractive.", gloss: "that does not alter the fact that", note: "*Dat neemt niet weg dat...* acknowledges intervening material while restoring the main claim's force."}
  nl.c1.unit01.lesson04.teach.juist_bezoekers: {title: "An attractive city centre actually draws visitors.", gloss: "actually draws visitors", note: "*Juist* marks the result as contrary to the fear raised during the digression."}
  nl.c1.unit01.lesson04.teach.hervatting: {title: "An explicit resumption", gloss: "But to return to my main idea: an attractive city centre actually draws visitors.", note: "*Maar* pivots, the return frame restores the route, and *juist* reconnects the claim to the objection."}
  nl.c1.unit01.lesson05.teach.dit_voorstel: {title: "This proposal produces cleaner air.", gloss: "this proposal", note: "*Dit voorstel* packages the previously described policy into one reusable reference."}
  nl.c1.unit01.lesson05.teach.die_ruimte: {title: "That space makes the city centre more attractive.", gloss: "that space", note: "*Die ruimte* retrieves a specific result from the preceding sentence and turns it into the next sentence's topic."}
  nl.c1.unit01.lesson05.teach.alles_bij_elkaar: {title: "Taken together, this supports a gradual low-traffic city centre.", gloss: "taken together / all things considered", note: "*Alles bij elkaar* signals that the conclusion draws on all developed strands, not only the last sentence."}
  nl.c1.unit01.lesson05.teach.samenhang: {title: "A cohesive synthesis", gloss: "Fewer cars produce cleaner air. This also creates pedestrian space. That space makes the centre more attractive. Taken together, this supports a gradual low-traffic centre.", note: "Repeated concepts are recast as *daarbij*, *die ruimte*, and *dit*, creating cohesion without mechanical repetition."}
  nl.c1.unit01.lesson06.teach.volledig_betoog: {title: "The complete structured contribution", gloss: "A sustained contribution with roadmap, development, digression, explicit return, and synthesis.", note: "Track the whole route: *om te beginnen* → *vervolgens* → *uitstapje* → *terug te komen* → *alles bij elkaar*."}
exercises:
  nl.c1.unit01.lesson01.exercise01.herken_beginnen: {instruction: "What discourse job does om te beginnen perform?", correct_option: "It opens the first stage.", distractors: ["It closes the contribution.", "It introduces a contradiction.", "It hides the direction."], accepted_answers: [{value: "It opens the first stage.", status: correct}], feedback: "*Om te beginnen* explicitly opens the first stage."}
  nl.c1.unit01.lesson01.exercise02.herken_koers: {instruction: "What does this sentence give the audience before the detail?", correct_option: "A two-stage roadmap", distractors: ["An unrelated aside", "A final synthesis", "An ironic reversal"], accepted_answers: [{value: "A two-stage roadmap", status: correct}], feedback: "*Eerst ... daarna ...* previews two stages."}
  nl.c1.unit01.lesson01.exercise03.koppel_koers:
    instruction: "Match each Dutch roadmap element to its precise English clue."
    pairs: [{left: "om te beginnen", right: "opens the first stage"}, {left: eerst, right: "marks the initial step"}, {left: "schets ik", right: "I outline"}, {left: "het probleem", right: "the issue being examined"}, {left: daarna, right: "moves to the following stage"}, {left: "bespreek ik", right: "I discuss"}, {left: "de voordelen", right: "the positive effects"}, {left: "in grote lijnen", right: "without going into detail"}]
    accepted_answers: [{value: [{left: "om te beginnen", right: "opens the first stage"}, {left: eerst, right: "marks the initial step"}, {left: "schets ik", right: "I outline"}, {left: "het probleem", right: "the issue being examined"}, {left: daarna, right: "moves to the following stage"}, {left: "bespreek ik", right: "I discuss"}, {left: "de voordelen", right: "the positive effects"}, {left: "in grote lijnen", right: "without going into detail"}], status: correct}]
    feedback: "These elements announce scope and direction."
  nl.c1.unit01.lesson01.exercise04.orden_koers: {instruction: "Put the Dutch words in order to open the roadmap.", accepted_answers: [{value: "Om te beginnen schets ik het probleem", status: correct}], feedback: "*Om te beginnen* occupies the first position, followed by inversion."}
  nl.c1.unit01.lesson01.exercise05.vertaal_lijnen: {instruction: "Translate into Dutch using eerst and in grote lijnen: First I outline the problem in broad terms.", accepted_answers: [{value: "Eerst schets ik in grote lijnen het probleem", status: correct}, {value: "Eerst schets ik het probleem in grote lijnen", status: correct}], feedback: "*In grote lijnen* marks deliberate overview rather than detail."}
  nl.c1.unit01.lesson01.exercise06.spreek_koers: {instruction: "Say in Dutch, opening with om te beginnen and using in grote lijnen: To begin with, I outline the advantages in broad terms.", accepted_answers: [{value: "Om te beginnen schets ik de voordelen in grote lijnen", status: correct}, {value: "Om te beginnen schets ik in grote lijnen de voordelen", status: correct}], feedback: "*Om te beginnen* takes the first position, so the verb comes second and *ik* follows it: *Om te beginnen schets ik de voordelen in grote lijnen.* (*In grote lijnen* may also stand before *de voordelen*.)"}
  nl.c1.unit01.lesson01.exercise07.schrijf_koers: {instruction: "Using om te beginnen, in grote lijnen and daarna, write in Dutch: To begin with I outline the advantages in broad terms; then I discuss the problem.", accepted_answers: [{value: "Om te beginnen schets ik in grote lijnen de voordelen; daarna bespreek ik het probleem", status: correct}, {value: "Om te beginnen schets ik de voordelen in grote lijnen; daarna bespreek ik het probleem", status: correct}], feedback: "Each half opens with a sequence marker, so the verb comes second: *Om te beginnen schets ik in grote lijnen de voordelen; daarna bespreek ik het probleem.* (*In grote lijnen* may also follow *de voordelen*.)"}
  nl.c1.unit01.lesson02.exercise01.herken_namelijk: {instruction: "What does namelijk do here?", correct_option: "It specifies the general point.", distractors: ["It begins a digression.", "It withdraws the claim.", "It closes the argument."], accepted_answers: [{value: "It specifies the general point.", status: correct}], feedback: "*Namelijk* introduces the precise content of a general claim."}
  nl.c1.unit01.lesson02.exercise02.herken_daarbij: {instruction: "How does daarbij connect this sentence to the preceding one?", correct_option: "It adds an associated consequence.", distractors: ["It denies the preceding claim.", "It marks an unrelated memory.", "It ends the topic."], accepted_answers: [{value: "It adds an associated consequence.", status: correct}], feedback: "*Daarbij* links pedestrian space to the cleaner-air point."}
  nl.c1.unit01.lesson02.exercise03.koppel_ontwikkeling:
    instruction: "Match each taught Dutch development element to its English clue."
    pairs: [{left: vervolgens, right: "advances to the next section"}, {left: "het belangrijkste voordeel", right: "the chief benefit"}, {left: namelijk, right: "introduces the precise explanation"}, {left: "schonere lucht", right: "air with less pollution"}, {left: daarbij, right: "links an associated point"}, {left: "hoort meer ruimte", right: "includes additional space"}, {left: "voor voetgangers", right: "intended for people on foot"}]
    accepted_answers: [{value: [{left: vervolgens, right: "advances to the next section"}, {left: "het belangrijkste voordeel", right: "the chief benefit"}, {left: namelijk, right: "introduces the precise explanation"}, {left: "schonere lucht", right: "air with less pollution"}, {left: daarbij, right: "links an associated point"}, {left: "hoort meer ruimte", right: "includes additional space"}, {left: "voor voetgangers", right: "intended for people on foot"}], status: correct}]
    feedback: "These forms move, specify, and connect the developed point."
  nl.c1.unit01.lesson02.exercise04.orden_namelijk: {instruction: "Put the Dutch words in order to advance and specify the main cleaner-air advantage with vervolgens and namelijk.", accepted_answers: [{value: "Vervolgens bespreek ik het belangrijkste voordeel namelijk schonere lucht", status: correct}], feedback: "*Vervolgens* advances the route and *namelijk* introduces the exact advantage."}
  nl.c1.unit01.lesson02.exercise05.vertaal_daarbij: {instruction: "Translate into Dutch using daarbij: Associated with that is more space for pedestrians.", accepted_answers: [{value: "Daarbij hoort meer ruimte voor voetgangers", status: correct}], feedback: "*Daarbij* makes the new point depend cohesively on the prior one."}
  nl.c1.unit01.lesson02.exercise06.spreek_ontwikkeling: {instruction: "Using vervolgens and namelijk, say in Dutch: Next I discuss the main advantage, namely more space for pedestrians.", accepted_answers: [{value: "Vervolgens bespreek ik het belangrijkste voordeel, namelijk meer ruimte voor voetgangers", status: correct}, {value: "Ik bespreek vervolgens het belangrijkste voordeel, namelijk meer ruimte voor voetgangers", status: correct}], feedback: "*Vervolgens* advances the route and *namelijk* names the exact advantage: *Vervolgens bespreek ik het belangrijkste voordeel, namelijk meer ruimte voor voetgangers.* (*Ik bespreek vervolgens ...* is also correct.)"}
  nl.c1.unit01.lesson02.exercise07.schrijf_ontwikkeling: {instruction: "Using vervolgens and daarbij, write in Dutch (one sentence with a semicolon): Next I discuss cleaner air; associated with that is more space for pedestrians.", accepted_answers: [{value: "Vervolgens bespreek ik schonere lucht; daarbij hoort meer ruimte voor voetgangers", status: correct}, {value: "Ik bespreek vervolgens schonere lucht; daarbij hoort meer ruimte voor voetgangers", status: correct}], feedback: "*Vervolgens* advances the route; *daarbij* attaches the second point to the first: *Vervolgens bespreek ik schonere lucht; daarbij hoort meer ruimte voor voetgangers.* (*Ik bespreek vervolgens ...* is also correct.)"}
  nl.c1.unit01.lesson03.exercise01.herken_uitstapje: {instruction: "What boundary does this sentence mark?", correct_option: "The start of a brief digression", distractors: ["The final conclusion", "The return to the main line", "The initial roadmap"], accepted_answers: [{value: "The start of a brief digression", status: correct}], feedback: "*Even een uitstapje* marks a temporary, bounded departure."}
  nl.c1.unit01.lesson03.exercise02.herken_terzijde: {instruction: "What status does terzijde give the objection?", correct_option: "Relevant but outside the main line", distractors: ["The central conclusion", "Established fact", "A promised second section"], accepted_answers: [{value: "Relevant but outside the main line", status: correct}], feedback: "*Terzijde* frames the objection as an aside."}
  nl.c1.unit01.lesson03.exercise03.koppel_uitstapje:
    instruction: "Match each taught Dutch digression element to its distinct English clue."
    pairs: [{left: "een uitstapje", right: "a temporary side path in the argument"}, {left: terzijde, right: "as an aside"}, {left: "een bezwaar", right: "an objection"}, {left: winkeliers, right: "shop owners"}, {left: vrezen, right: "fear or anticipate negatively"}, {left: omzetverlies, right: "loss of revenue"}, {left: "een begrijpelijke zorg", right: "a concern that deserves recognition"}]
    accepted_answers: [{value: [{left: "een uitstapje", right: "a temporary side path in the argument"}, {left: terzijde, right: "as an aside"}, {left: "een bezwaar", right: "an objection"}, {left: winkeliers, right: "shop owners"}, {left: vrezen, right: "fear or anticipate negatively"}, {left: omzetverlies, right: "loss of revenue"}, {left: "een begrijpelijke zorg", right: "a concern that deserves recognition"}], status: correct}]
    feedback: "The boundary language and objection vocabulary keep the side path controlled."
  nl.c1.unit01.lesson03.exercise04.orden_terzijde: {instruction: "Put the Dutch words in order to announce one objection as an aside.", accepted_answers: [{value: "Terzijde wil ik één bezwaar noemen", status: correct}], feedback: "*Terzijde* comes first and triggers inversion."}
  nl.c1.unit01.lesson03.exercise05.vertaal_zorg: {instruction: "Translate into Dutch: Shop owners fear a loss of revenue, an understandable concern.", accepted_answers: [{value: "Winkeliers vrezen omzetverlies, een begrijpelijke zorg.", status: correct}], feedback: "The apposition *een begrijpelijke zorg* validates why this aside matters."}
  nl.c1.unit01.lesson03.exercise06.spreek_uitstapje: {instruction: "Say in Dutch, opening with eerst and using even: First I will briefly digress.", accepted_answers: [{value: "Eerst maak ik even een uitstapje", status: correct}], feedback: "*Eerst* takes the first position, so the verb comes second, and *even* limits the digression: *Eerst maak ik even een uitstapje.*"}
  nl.c1.unit01.lesson03.exercise07.schrijf_uitstapje: {instruction: "Opening with terzijde, write in Dutch: As an aside, I want to name an understandable concern: shop owners fear a loss of revenue.", accepted_answers: [{value: "Terzijde wil ik een begrijpelijke zorg noemen: winkeliers vrezen omzetverlies", status: correct}, {value: "Terzijde wil ik één begrijpelijke zorg noemen: winkeliers vrezen omzetverlies", status: correct}], feedback: "The aside is announced first (*terzijde* triggers inversion), then the concern follows the colon: *Terzijde wil ik een begrijpelijke zorg noemen: winkeliers vrezen omzetverlies.*"}
  nl.c1.unit01.lesson04.exercise01.herken_terugkeer: {instruction: "What does this phrase signal?", correct_option: "An explicit return to the central line", distractors: ["A new unrelated theme", "A final farewell", "An uncertain inference"], accepted_answers: [{value: "An explicit return to the central line", status: correct}], feedback: "*Terug te komen op mijn hoofdgedachte* names the resumed line."}
  nl.c1.unit01.lesson04.exercise02.herken_weg: {instruction: "What relationship does dat neemt niet weg dat express?", correct_option: "The prior concern does not cancel the main claim.", distractors: ["The main claim is withdrawn.", "The concern is irrelevant.", "A new roadmap begins."], accepted_answers: [{value: "The prior concern does not cancel the main claim.", status: correct}], feedback: "The construction preserves the claim after acknowledging intervening material."}
  nl.c1.unit01.lesson04.exercise03.koppel_terugkeer:
    instruction: "Match each taught Dutch return element to its precise English clue."
    pairs: [{left: "terug te komen", right: "resume an earlier line"}, {left: "mijn hoofdgedachte", right: "my central claim"}, {left: "Dat neemt niet weg dat...", right: "the preceding point does not cancel what follows"}, {left: "de binnenstad", right: "the central urban district"}, {left: aantrekkelijker, right: "more appealing"}, {left: trekt, right: "draws or attracts"}, {left: juist, right: "contrary to the feared effect"}, {left: bezoekers, right: "people who come to the area"}]
    accepted_answers: [{value: [{left: "terug te komen", right: "resume an earlier line"}, {left: "mijn hoofdgedachte", right: "my central claim"}, {left: "Dat neemt niet weg dat...", right: "the preceding point does not cancel what follows"}, {left: "de binnenstad", right: "the central urban district"}, {left: aantrekkelijker, right: "more appealing"}, {left: trekt, right: "draws or attracts"}, {left: juist, right: "contrary to the feared effect"}, {left: bezoekers, right: "people who come to the area"}], status: correct}]
    feedback: "These forms restore the central line and relate it to the aside."
  nl.c1.unit01.lesson04.exercise04.orden_terugkeer: {instruction: "Put the Dutch words in order to signal return to the main idea.", accepted_answers: [{value: "Om terug te komen op mijn hoofdgedachte", status: correct}], feedback: "The full resumptive frame names the central idea."}
  nl.c1.unit01.lesson04.exercise05.vertaal_bezoekers: {instruction: "Translate into Dutch using juist: An attractive city centre actually draws visitors.", accepted_answers: [{value: "Een aantrekkelijke binnenstad trekt juist bezoekers", status: correct}], feedback: "*Juist* reverses the feared expectation."}
  nl.c1.unit01.lesson04.exercise06.spreek_hervatting: {instruction: "Using maar and juist, say in Dutch: But to return to my main idea: the city centre actually becomes more attractive.", accepted_answers: [{value: "Maar om terug te komen op mijn hoofdgedachte: de binnenstad wordt juist aantrekkelijker", status: correct}], feedback: "The sentence pivots with *maar*, resumes with *om terug te komen op mijn hoofdgedachte*, and restates the claim with *juist*: *Maar om terug te komen op mijn hoofdgedachte: de binnenstad wordt juist aantrekkelijker.*"}
  nl.c1.unit01.lesson04.exercise07.schrijf_weg: {instruction: "After the objection Winkeliers vrezen omzetverlies, answer with one sentence that begins with dat neemt niet weg dat and turns this claim into the clause that follows (mind the verb position after dat): Een aantrekkelijke binnenstad trekt juist bezoekers.", accepted_answers: [{value: "Dat neemt niet weg dat een aantrekkelijke binnenstad juist bezoekers trekt", status: correct}], feedback: "After *dat* the clause is subordinate, so the verb moves to the end: *Dat neemt niet weg dat een aantrekkelijke binnenstad juist bezoekers trekt.*"}
  nl.c1.unit01.lesson05.exercise01.lees_verwijzing: {instruction: "What does Die ruimte refer back to in the reading?", correct_option: "Space for pedestrians", distractors: ["Cleaner air", "Shop-owner concern", "The final conclusion"], accepted_answers: [{value: "Space for pedestrians", status: correct}], feedback: "*Die ruimte* resumes the pedestrian space created in the previous sentence."}
  nl.c1.unit01.lesson05.exercise02.lees_conclusie: {instruction: "Which sentence draws all preceding strands together?", correct_option: "Alles bij elkaar pleit dit voor een geleidelijke autoluwe binnenstad.", distractors: ["Minder auto's leveren schonere lucht op.", "Daarbij ontstaat ruimte voor voetgangers.", "Die ruimte maakt de binnenstad aantrekkelijker."], accepted_answers: [{value: "Alles bij elkaar pleit dit voor een geleidelijke autoluwe binnenstad.", status: correct}], feedback: "*Alles bij elkaar* explicitly signals synthesis."}
  nl.c1.unit01.lesson05.exercise03.koppel_samenhang:
    instruction: "Match each Dutch cohesive element to its English function."
    pairs: [{left: "Dit voorstel", right: "refers to the policy just discussed"}, {left: "levert ... op", right: "produces as a result"}, {left: "Die ruimte", right: "resumes the newly available area"}, {left: "Alles bij elkaar", right: "signals a synthesis of all strands"}, {left: "pleit voor", right: "supports the case for"}, {left: geleidelijke, right: "introduced in stages"}, {left: autoluwe, right: "with strongly reduced car traffic"}]
    accepted_answers: [{value: [{left: "Dit voorstel", right: "refers to the policy just discussed"}, {left: "levert ... op", right: "produces as a result"}, {left: "Die ruimte", right: "resumes the newly available area"}, {left: "Alles bij elkaar", right: "signals a synthesis of all strands"}, {left: "pleit voor", right: "supports the case for"}, {left: geleidelijke, right: "introduced in stages"}, {left: autoluwe, right: "with strongly reduced car traffic"}], status: correct}]
    feedback: "The references and synthesis marker sustain cohesion across sentences."
  nl.c1.unit01.lesson05.exercise04.orden_synthese: {instruction: "Put the Dutch words in order to synthesize the argument.", accepted_answers: [{value: "Alles bij elkaar pleit dit voor een autoluwe binnenstad", status: correct}], feedback: "*Alles bij elkaar* gathers the preceding strands."}
  nl.c1.unit01.lesson05.exercise05.vertaal_ruimte: {instruction: "Translate into Dutch using die ruimte: That space makes the city centre more attractive.", accepted_answers: [{value: "Die ruimte maakt de binnenstad aantrekkelijker", status: correct}], feedback: "The demonstrative creates a precise backward link."}
  nl.c1.unit01.lesson05.exercise06.spreek_synthese: {instruction: "Using die ruimte and juist, say in Dutch: That space actually draws visitors.", accepted_answers: [{value: "Die ruimte trekt juist bezoekers", status: correct}], feedback: "*Die ruimte* refers back to the space just mentioned: *Die ruimte trekt juist bezoekers.*"}
  nl.c1.unit01.lesson05.exercise07.schrijf_samenhang: {instruction: "Rewrite this sentence so it opens with alles bij elkaar (the verb comes second and the separable particle stays at the end): Dit voorstel levert schonere lucht op.", accepted_answers: [{value: "Alles bij elkaar levert dit voorstel schonere lucht op", status: correct}], feedback: "After the fronted *alles bij elkaar* the verb stays second and the subject follows it, while *op* stays at the end: *Alles bij elkaar levert dit voorstel schonere lucht op.*"}
  nl.c1.unit01.lesson06.exercise01.luister_structuur: {instruction: "Listen to Lotte's full contribution. Which sequence describes its structure?", correct_option: "roadmap → developed benefit → shop-owner digression → explicit return → synthesis", distractors: ["digression → roadmap → unrelated ending", "claim → immediate ending → new topic", "examples only with no return"], accepted_answers: [{value: "roadmap → developed benefit → shop-owner digression → explicit return → synthesis", status: correct}], feedback: "The audio marks every stage explicitly, including departure and return."}
  nl.c1.unit01.lesson06.exercise02.lees_route: {instruction: "Which structural map matches Lotte's full contribution?", correct_option: "roadmap → development → digression → return → synthesis", distractors: ["conclusion → digression → roadmap", "examples → contradiction → farewell", "unmarked list of details"], accepted_answers: [{value: "roadmap → development → digression → return → synthesis", status: correct}], feedback: "This is the complete C1 route used throughout the contribution."}
  nl.c1.unit01.lesson06.exercise03.koppel_functies:
