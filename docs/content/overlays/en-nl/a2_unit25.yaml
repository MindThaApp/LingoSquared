course:
  title: "Dutch A2"
  description: "Elementary-plus Dutch for expressing an opinion about a familiar topic, supporting it with a reason, and responding to someone else's opinion."

units:
  nl.a2.unit25.meningen: {title: "Giving your opinion"}

lessons:
  nl.a2.unit25.lesson01.wat_vind_je_daarvan: {title: "What do you think of it?"}
  nl.a2.unit25.lesson02.volgens_mij: {title: "In my opinion..."}
  nl.a2.unit25.lesson03.eens_of_niet_eens: {title: "Agreeing or disagreeing"}
  nl.a2.unit25.lesson04.aan_de_andere_kant: {title: "On the other hand..."}
  nl.a2.unit25.lesson05.forumbericht_lezen: {title: "Reading a forum post"}
  nl.a2.unit25.lesson06.fietspad_gesprek: {title: "Lotte and Omar discuss the bike path"}

teaching:
  nl.a2.unit25.lesson01.teach.fietspad: {title: "Bike path", gloss: "the bike path", note: "A neuter noun: het fietspad, a compound of fiets (bike) and pad (path)."}
  nl.a2.unit25.lesson01.teach.wat_vind_je: {title: "Asking for an opinion", gloss: "What do you think of the new bike path?", note: "Vinden van (literally 'to find of') is the standard way to ask or state an opinion about something specific."}
  nl.a2.unit25.lesson01.teach.wat_is_mening: {title: "Asking directly for an opinion", gloss: "What is your opinion?", note: "Mening (opinion) is the direct noun form, used when vinden van feels too indirect."}

  nl.a2.unit25.lesson02.teach.volgens_mij_goed: {title: "Stating an opinion", gloss: "In my opinion, the bike path is a good idea.", note: "Volgens mij (according to me/in my opinion) is the most common way to frame a personal opinion in Dutch."}
  nl.a2.unit25.lesson02.teach.gevaarlijk: {title: "Dangerous", gloss: "dangerous", note: "A common adjective for describing risk."}
  nl.a2.unit25.lesson02.teach.volgens_mij_gevaarlijk: {title: "Opinion plus reason", gloss: "In my opinion, the bike path is dangerous, because it's too narrow.", note: "Omdat (because) introduces the reason clause; the verb moves to the end of that clause (is moves after te smal)."}

  nl.a2.unit25.lesson03.teach.ben_het_eens: {title: "Agreeing", gloss: "I agree with you.", note: "Het eens zijn met (literally 'to be it in agreement with') is the fixed expression for agreeing."}
  nl.a2.unit25.lesson03.teach.niet_eens: {title: "Disagreeing", gloss: "I disagree with you.", note: "Niet negates the fixed expression: het niet met je eens zijn."}
  nl.a2.unit25.lesson03.teach.gedeeltelijk_eens: {title: "Partially agreeing", gloss: "I partially agree.", note: "Gedeeltelijk (partially) is inserted into the same fixed expression het met je eens zijn, useful for a nuanced response."}

  nl.a2.unit25.lesson04.teach.veiliger_kinderen: {title: "Presenting a counterpoint", gloss: "On the other hand, the bike path is indeed safer for children.", note: "Aan de andere kant (on the other hand) introduces a contrasting point; wel here emphasizes the contrast, not a simple 'yes'."}
  nl.a2.unit25.lesson04.teach.duur_bespaart: {title: "Weighing cost against benefit", gloss: "It's expensive, but on the other hand it saves time.", note: "Maar (but) plus aan de andere kant together frame a classic pros-and-cons contrast."}

  nl.a2.unit25.lesson05.teach.voetgangers: {title: "Pedestrians", gloss: "the pedestrians", note: "A common gender plural noun: de voetgangers, from voet (foot) and gangers (goers)."}
  nl.a2.unit25.lesson05.teach.forumbericht: {title: "Read a forum post", gloss: "I think the new bike path is a bad idea. It's too narrow and there's too little room for pedestrians. On the other hand, I understand that the municipality wants more cyclists. In my opinion, they should make the path wider.", note: "Track the writer's opinion, their reason, the counterpoint they acknowledge, and their suggestion."}

  nl.a2.unit25.lesson06.teach.lotte_ask: {title: "Lotte asks for Omar's opinion", gloss: "Lotte: What do you think of the new bike path, Omar?", note: "Reuses the wat vind je van ...? pattern from lesson01, now addressed directly to Omar."}
  nl.a2.unit25.lesson06.teach.omar_opinion: {title: "Omar gives his opinion", gloss: "Omar: In my opinion, it's a good idea, because it's safer for cyclists.", note: "Combines volgens mij with an omdat-reason, reusing lesson02's pattern."}
  nl.a2.unit25.lesson06.teach.lotte_disagree: {title: "Lotte partly disagrees", gloss: "Lotte: I don't entirely agree with that. It's quite narrow for pedestrians.", note: "Daar (there/with that) refers back to Omar's opinion; helemaal (entirely) softens the disagreement to 'not entirely,' not a flat rejection."}
  nl.a2.unit25.lesson06.teach.omar_concede: {title: "Omar acknowledges and counters", gloss: "Omar: I understand that, but on the other hand there are now fewer cars on the street.", note: "Dat snap ik (I understand that) acknowledges Lotte's point before introducing a counterpoint with aan de andere kant."}
  nl.a2.unit25.lesson06.teach.lotte_agree_maybe: {title: "Lotte softens her position", gloss: "Lotte: That's true. Maybe it'll get better if they make it wider.", note: "Als (if) introduces a conditional clause; wordt is the present tense of worden (to become)."}
  nl.a2.unit25.lesson06.teach.omar_final_agree: {title: "Omar agrees", gloss: "Omar: Yes, I think so too.", note: "Reuses dat denk ik ook from unit22's phone call."}
  nl.a2.unit25.lesson06.teach.vindt_form: {title: "Vindt: the he/she-form", gloss: "Omar thinks the bike path is a good idea.", note: "Vindt is the third-person form of vinden (to think/find), used when describing someone else's opinion."}

exercises:
  nl.a2.unit25.lesson01.exercise01.choose_ask_opinion:
    instruction: "Choose the Dutch sentence meaning 'What do you think of the new bike path?'"
    correct_option: "Wat vind je van het nieuwe fietspad?"
    distractors: ["Wat vind je het nieuwe fietspad?", "Wat vind je aan het nieuwe fietspad?", "Wat is je van het nieuwe fietspad?"]
    accepted_answers: [{value: "Wat vind je van het nieuwe fietspad?", status: correct}]
    feedback: "Vinden van is the standard pattern for asking or stating an opinion about something specific."
  nl.a2.unit25.lesson01.exercise02.listen_ask_opinion:
    instruction: "Listen and choose what is asked."
    correct_option: "What do you think of the new bike path?"
    distractors: ["What is your opinion?", "Do you like the new bike path?", "Where is the new bike path?"]
    accepted_answers: [{value: "What do you think of the new bike path?", status: correct}]
    feedback: "Wat vind je van het nieuwe fietspad?"
  nl.a2.unit25.lesson01.exercise03.match_opinion_questions:
    instruction: "Match each Dutch word or question to its meaning."
    accepted_answers: [{value: [{left: "het fietspad", right: "the bike path"}, {left: "Wat vind je daarvan?", right: "What do you think of it?"}, {left: "Wat is jouw mening?", right: "What is your opinion?"}], status: correct}]
    feedback: "Both questions invite an opinion, one indirectly and one directly."
  nl.a2.unit25.lesson01.exercise04.order_ask_opinion:
    instruction: "Put the words in order to ask what someone thinks of the new bike path."
    correct_option: "Wat vind je van het nieuwe fietspad"
    accepted_answers: [{value: "Wat vind je van het nieuwe fietspad", status: correct}]
    feedback: "The complete question is Wat vind je van het nieuwe fietspad?"
  nl.a2.unit25.lesson01.exercise05.complete_ask_mening:
    instruction: "Complete the question."
    accepted_answers: [{value: mening, status: correct}]
    feedback: "Wat is jouw mening?"
  nl.a2.unit25.lesson01.exercise06.write_ask_opinion:
    instruction: "Write in Dutch: ask someone what they think of the new bike path."
    accepted_answers: [{value: "Wat vind je van het nieuwe fietspad?", status: correct}, {value: "Wat vind je van het nieuwe fietspad", status: correct}]
    feedback: "Wat vind je van het nieuwe fietspad?"

  nl.a2.unit25.lesson02.exercise01.choose_opinion_with_reason:
    instruction: "Choose the Dutch sentence meaning 'In my opinion, the bike path is dangerous, because it's too narrow.'"
    correct_option: "Volgens mij is het fietspad gevaarlijk, omdat het te smal is."
    distractors: ["Volgens mij is het fietspad gevaarlijk, omdat het te smal.", "Volgens mij het fietspad is gevaarlijk, omdat het te smal is.", "Volgens mij is het fietspad gevaarlijk, want het is te smal is."]
    accepted_answers: [{value: "Volgens mij is het fietspad gevaarlijk, omdat het te smal is.", status: correct}]
    feedback: "Omdat sends the verb to the end of its own clause: omdat het te smal is."
  nl.a2.unit25.lesson02.exercise02.listen_opinion_with_reason:
    instruction: "Listen and choose what the speaker says."
    correct_option: "In my opinion, the bike path is dangerous, because it's too narrow."
    distractors: ["In my opinion, the bike path is a good idea.", "In my opinion, the bike path is too expensive.", "In my opinion, the bike path is safe for children."]
    accepted_answers: [{value: "In my opinion, the bike path is dangerous, because it's too narrow.", status: correct}]
    feedback: "Volgens mij is het fietspad gevaarlijk, omdat het te smal is."
  nl.a2.unit25.lesson02.exercise03.match_opinion_reason:
    instruction: "Match each Dutch word or phrase to its meaning."
    accepted_answers: [{value: [{left: "een goed idee", right: "a good idea"}, {left: gevaarlijk, right: dangerous}, {left: smal, right: narrow}, {left: omdat, right: because}, {left: "het fietspad", right: "the bike path"}, {left: "Wat is jouw mening?", right: "What is your opinion?"}], status: correct}]
    feedback: "These words and phrases describe opinions and reasons about the bike path."
  nl.a2.unit25.lesson02.exercise04.order_opinion_good_idea:
    instruction: "Listen and put the words in the order you hear."
    correct_option: "Volgens mij is het fietspad een goed idee"
    accepted_answers: [{value: "Volgens mij is het fietspad een goed idee", status: correct}]
    feedback: "The complete sentence is Volgens mij is het fietspad een goed idee."
  nl.a2.unit25.lesson02.exercise05.complete_opinion_reason:
    instruction: "Complete the sentence."
    accepted_answers: [{value: omdat, status: correct}]
    feedback: "Volgens mij is het fietspad gevaarlijk, omdat het te smal is."
  nl.a2.unit25.lesson02.exercise06.translate_opinion_reason:
    instruction: "Translate into Dutch."
    accepted_answers: [{value: "Volgens mij is het fietspad gevaarlijk, omdat het te smal is.", status: correct}, {value: "Volgens mij is het fietspad gevaarlijk omdat het te smal is", status: correct}]
    feedback: "Volgens mij is het fietspad gevaarlijk, omdat het te smal is."

  nl.a2.unit25.lesson03.exercise01.choose_disagree:
    instruction: "Choose the Dutch sentence meaning 'I disagree with you.'"
    correct_option: "Ik ben het niet met je eens."
    distractors: ["Ik ben niet het met je eens.", "Ik ben het met je niet eens.", "Ik heb het niet met je eens."]
    accepted_answers: [{value: "Ik ben het niet met je eens.", status: correct}]
    feedback: "Niet negates the fixed expression het met je eens zijn."
  nl.a2.unit25.lesson03.exercise02.listen_disagree:
    instruction: "Listen and choose what the speaker says."
    correct_option: "I disagree with you."
    distractors: ["I agree with you.", "I partially agree.", "What is your opinion?"]
    accepted_answers: [{value: "I disagree with you.", status: correct}]
    feedback: "Ik ben het niet met je eens."
  nl.a2.unit25.lesson03.exercise03.match_agreement_degrees:
    instruction: "Match each Dutch word, phrase, or sentence to its meaning."
    accepted_answers: [{value: [{left: "Ik ben het met je eens.", right: "I agree with you."}, {left: "Ik ben het niet met je eens.", right: "I disagree with you."}, {left: "Ik ben het gedeeltelijk met je eens.", right: "I partially agree."}, {left: "een goed idee", right: "a good idea"}, {left: gevaarlijk, right: dangerous}, {left: smal, right: narrow}, {left: "het fietspad", right: "the bike path"}], status: correct}]
    feedback: "These cover agreement/disagreement plus the unit's other key vocabulary."
  nl.a2.unit25.lesson03.exercise04.order_agree:
    instruction: "Put the words in order to say you agree with someone."
    correct_option: "Ik ben het met je eens"
    accepted_answers: [{value: "Ik ben het met je eens", status: correct}]
    feedback: "The complete sentence is Ik ben het met je eens."
  nl.a2.unit25.lesson03.exercise05.complete_partial_agree:
    instruction: "Complete the sentence."
    accepted_answers: [{value: gedeeltelijk, status: correct}]
    feedback: "Ik ben het gedeeltelijk met je eens."
  nl.a2.unit25.lesson03.exercise06.respond_disagree:
    instruction: "Answer in Dutch: disagree with the opinion that the bike path is a good idea."
    accepted_answers: [{value: "Ik ben het niet met je eens.", status: correct}, {value: "Ik ben het niet met je eens", status: correct}]
    feedback: "Ik ben het niet met je eens."

  nl.a2.unit25.lesson04.exercise01.choose_other_hand:
    instruction: "Choose the Dutch sentence meaning 'On the other hand, the bike path is indeed safer for children.'"
    correct_option: "Aan de andere kant is het fietspad wel veiliger voor kinderen."
    distractors: ["Aan de andere kant het fietspad is wel veiliger voor kinderen.", "Aan de ander kant is het fietspad wel veiliger voor kinderen.", "Aan de andere kant is het fietspad veiliger niet voor kinderen."]
    accepted_answers: [{value: "Aan de andere kant is het fietspad wel veiliger voor kinderen.", status: correct}]
    feedback: "Aan de andere kant introduces the contrasting point; is inverts after it since it's a fronted phrase."
  nl.a2.unit25.lesson04.exercise02.listen_other_hand:
    instruction: "Listen and choose what the speaker says."
    correct_option: "On the other hand, the bike path is indeed safer for children."
    distractors: ["On the other hand, the bike path is dangerous for children.", "The bike path is a good idea.", "The bike path is too narrow for pedestrians."]
    accepted_answers: [{value: "On the other hand, the bike path is indeed safer for children.", status: correct}]
    feedback: "Aan de andere kant is het fietspad wel veiliger voor kinderen."
  nl.a2.unit25.lesson04.exercise03.match_contrast_phrases:
    instruction: "Match each Dutch word or phrase to its meaning."
    accepted_answers: [{value: [{left: "aan de andere kant", right: "on the other hand"}, {left: veiliger, right: safer}, {left: bespaart, right: saves}, {left: duur, right: expensive}, {left: "Ik ben het niet met je eens.", right: "I disagree with you."}, {left: gevaarlijk, right: dangerous}, {left: "een goed idee", right: "a good idea"}], status: correct}]
    feedback: "Aan de andere kant is the key contrast connector in this lesson."
  nl.a2.unit25.lesson04.exercise04.order_saves_time:
    instruction: "Put the words in order to say it's expensive, but on the other hand it saves time."
    correct_option: "Het is duur maar aan de andere kant bespaart het tijd"
    accepted_answers: [{value: "Het is duur maar aan de andere kant bespaart het tijd", status: correct}]
    feedback: "The complete sentence is Het is duur, maar aan de andere kant bespaart het tijd."
  nl.a2.unit25.lesson04.exercise05.complete_other_hand:
    instruction: "Complete the sentence."
    accepted_answers: [{value: veiliger, status: correct}]
    feedback: "Aan de andere kant is het fietspad wel veiliger voor kinderen."
  nl.a2.unit25.lesson04.exercise06.write_other_hand:
    instruction: "Write in Dutch: it's expensive, but on the other hand it saves time."
    accepted_answers: [{value: "Het is duur, maar aan de andere kant bespaart het tijd.", status: correct}, {value: "Het is duur maar aan de andere kant bespaart het tijd", status: correct}]
    feedback: "Het is duur, maar aan de andere kant bespaart het tijd."

  nl.a2.unit25.lesson05.exercise01.read_writer_opinion:
    instruction: "Read the forum post and choose the writer's overall opinion of the bike path."
    correct_option: "a bad idea"
    distractors: ["a good idea", "no opinion at all", "a great improvement"]
    accepted_answers: [{value: "a bad idea", status: correct}]
    feedback: "Ik vind het nieuwe fietspad een slecht idee."
  nl.a2.unit25.lesson05.exercise02.read_writer_reason:
    instruction: "Read the forum post and choose the writer's reason."
    correct_option: "it's too narrow and there's too little room for pedestrians"
    distractors: ["it's too expensive", "it's too far from the city center", "it's not used enough"]
    accepted_answers: [{value: "it's too narrow and there's too little room for pedestrians", status: correct}]
    feedback: "Het is te smal en er is te weinig ruimte voor voetgangers."
  nl.a2.unit25.lesson05.exercise03.read_writer_suggestion:
    instruction: "Read the forum post and choose the writer's suggestion."
    correct_option: "make the path wider"
    distractors: ["remove the path entirely", "add more bike paths elsewhere", "close the path to pedestrians"]
    accepted_answers: [{value: "make the path wider", status: correct}]
    feedback: "Volgens mij moeten ze het pad breder maken."
  nl.a2.unit25.lesson05.exercise04.listen_forum:
    instruction: "Listen and choose the writer's suggestion."
    correct_option: "make the path wider"
    distractors: ["remove the path entirely", "add more bike paths elsewhere", "close the path to pedestrians"]
    accepted_answers: [{value: "make the path wider", status: correct}]
    feedback: "Volgens mij moeten ze het pad breder maken."
  nl.a2.unit25.lesson05.exercise05.match_forum_points:
    instruction: "Match each part of the post to what it expresses."
    accepted_answers: [{value: [{left: "een slecht idee", right: "the writer's opinion"}, {left: "te smal", right: "the writer's reason"}, {left: "breder maken", right: "the writer's suggestion"}], status: correct}]
    feedback: "The post states an opinion, a reason, and a suggestion, plus an acknowledged counterpoint."
  nl.a2.unit25.lesson05.exercise06.write_forum_summary:
    instruction: "Write in Dutch: say the bike path is a bad idea, in your opinion, because it's too narrow."
    accepted_answers: [{value: "Volgens mij is het fietspad een slecht idee, omdat het te smal is.", status: correct}, {value: "Volgens mij is het fietspad een slecht idee omdat het te smal is", status: correct}]
    feedback: "Volgens mij is het fietspad een slecht idee, omdat het te smal is."

  nl.a2.unit25.lesson06.exercise01.listen_ask:
    instruction: "Listen and choose what Lotte asks."
    correct_option: "What do you think of the new bike path?"
    distractors: ["What is your opinion of the city?", "Do you agree with me?", "What did you do today?"]
    accepted_answers: [{value: "What do you think of the new bike path?", status: correct}]
    feedback: "Wat vind je van het nieuwe fietspad, Omar?"
  nl.a2.unit25.lesson06.exercise02.comprehend_omar_opinion:
    instruction: "Listen to the dialogue and choose Omar's opinion and reason."
    correct_option: "it's a good idea, because it's safer for cyclists"
    distractors: ["it's a bad idea, because it's too narrow", "it's a good idea, because it saves time", "he has no opinion"]
    accepted_answers: [{value: "it's a good idea, because it's safer for cyclists", status: correct}]
    feedback: "Omar says: Volgens mij is het een goed idee, omdat het veiliger is voor fietsers."
  nl.a2.unit25.lesson06.exercise03.comprehend_lotte_disagree:
    instruction: "Listen to the dialogue and choose why Lotte partly disagrees."
    correct_option: "it's quite narrow for pedestrians"
    distractors: ["it's too expensive", "it's too far away", "she doesn't cycle"]
    accepted_answers: [{value: "it's quite narrow for pedestrians", status: correct}]
    feedback: "Lotte says: Het is best smal voor voetgangers."
  nl.a2.unit25.lesson06.exercise04.comprehend_resolution:
    instruction: "Listen to the dialogue and choose how they leave the discussion."
    correct_option: "hoping it gets better if the path is made wider"
    distractors: ["agreeing to disagree permanently", "deciding the path should be removed", "deciding to ask the gemeente to close it"]
    accepted_answers: [{value: "hoping it gets better if the path is made wider", status: correct}]
    feedback: "Lotte says: Misschien wordt het beter als ze het breder maken, and Omar agrees."
  nl.a2.unit25.lesson06.exercise05.order_omar_concede:
    instruction: "Put the words in order to say there are now fewer cars on the street."
    correct_option: "Dat snap ik maar aan de andere kant zijn er nu minder auto's in de straat"
    accepted_answers: [{value: "Dat snap ik maar aan de andere kant zijn er nu minder auto's in de straat", status: correct}]
    feedback: "The complete sentence is Dat snap ik, maar aan de andere kant zijn er nu minder auto's in de straat."
  nl.a2.unit25.lesson06.exercise06.respond_omar_opinion:
    instruction: "Answer in Dutch: give your opinion that it's a good idea because it's safer for cyclists."
    accepted_answers: [{value: "Volgens mij is het een goed idee, omdat het veiliger is voor fietsers.", status: correct}, {value: "Volgens mij is het een goed idee omdat het veiliger is voor fietsers", status: correct}]
    feedback: "Volgens mij is het een goed idee, omdat het veiliger is voor fietsers."
  nl.a2.unit25.lesson06.exercise07.listen_type_resolution:
    instruction: "Listen and type the complete Dutch sentences."
    accepted_answers: [{value: "Dat is waar. Misschien wordt het beter als ze het breder maken.", status: correct}, {value: "Dat is waar Misschien wordt het beter als ze het breder maken", status: correct}]
    feedback: "Dat is waar. Misschien wordt het beter als ze het breder maken."
  nl.a2.unit25.lesson06.exercise08.write_discussion_summary:
    instruction: "Write two Dutch sentences: Omar thinks the bike path is a good idea, and Lotte doesn't entirely agree."
    accepted_answers: [{value: "Omar vindt het fietspad een goed idee. Lotte is het daar niet helemaal mee eens.", status: correct}, {value: "Omar vindt het fietspad een goed idee Lotte is het daar niet helemaal mee eens", status: correct}, {value: "Omar vindt het fietspad een goed idee, maar Lotte is het daar niet helemaal mee eens.", status: correct}, {value: "Omar vindt het fietspad een goed idee, maar Lotte is het daar niet helemaal mee eens", status: correct}]
    feedback: "Omar vindt het fietspad een goed idee. Lotte is het daar niet helemaal mee eens."
