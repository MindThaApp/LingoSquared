course:
  title: "Dutch A1"
  description: "Beginner Dutch for identifying common places and stating where they are located."

units:
  nl.a1.unit08.places: {title: "Locating places"}

lessons:
  nl.a1.unit08.lesson01.plaatsen: {title: "Places nearby"}
  nl.a1.unit08.lesson02.naast_en_tegenover: {title: "Next to and opposite"}
  nl.a1.unit08.lesson03.achter_en_voor: {title: "Behind and in front of"}
  nl.a1.unit08.lesson04.waar_en_meer_plaatswoorden: {title: "Where is it?"}
  nl.a1.unit08.lesson05.eenvoudige_kaart: {title: "Reading a simple map"}
  nl.a1.unit08.lesson06.waar_is_de_bushalte: {title: "Where is the bus stop?"}

teaching:
  nl.a1.unit08.lesson01.teach.station_supermarkt_bibliotheek_ziekenhuis: {title: "Station, supermarket, library, hospital", gloss: "the station, the supermarket, the library, the hospital", note: "Use *het* with *station*: *het station*. Dutch writes *supermarkt* as one word: *de supermarkt*. Use *de* with *bibliotheek*: *de bibliotheek*. Dutch writes *ziekenhuis* as one word: *het ziekenhuis*.", example_gloss: ["Where is the station?", "The supermarket is next to the station.", "The library is opposite the station.", "The hospital is behind the library."]}
  nl.a1.unit08.lesson01.teach.bank_postkantoor_bushalte: {title: "Bank, post office, bus stop", gloss: "the bank, the post office, the bus stop", note: "For a financial bank, Dutch uses *de bank*. Dutch writes *postkantoor* as one word — use *het*: *het postkantoor*. Dutch writes *bushalte* as one word — use *de*: *de bushalte*.", example_gloss: ["The bank is next to the supermarket.", "The post office is between the library and the hospital.", "The bus stop is in front of the station."]}

  nl.a1.unit08.lesson02.teach.naast_tegenover: {title: "Next to, opposite", gloss: "next to, opposite / across from", note: "*Naast* places one thing directly beside another. *Tegenover* states that two places face each other, often across a street or open space.", example_gloss: ["The bank is next to the supermarket.", "The library is opposite the station."]}
  nl.a1.unit08.lesson02.teach.supermarket_next: {title: "The supermarket is next to the station", gloss: "The supermarket is next to the station.", note: "*Naast* means directly beside: *De supermarkt is naast het station*."}
  nl.a1.unit08.lesson02.teach.library_opposite: {title: "The library is opposite the station", gloss: "The library is opposite the station.", note: "Keep *het* with *station*: *tegenover het station*."}

  nl.a1.unit08.lesson03.teach.achter_voor: {title: "Behind, in front of", gloss: "behind, in front of", note: "*Achter* locates one place behind another. Here, *voor* means in front of — it can mean other things in other sentences.", example_gloss: ["The hospital is behind the library.", "The bus stop is in front of the station."]}
  nl.a1.unit08.lesson03.teach.hospital_behind: {title: "The hospital is behind the library", gloss: "The hospital is behind the library.", note: "Put *achter* before the other place: *achter de bibliotheek*."}
  nl.a1.unit08.lesson03.teach.stop_in_front: {title: "The bus stop is in front of the station", gloss: "The bus stop is in front of the station.", note: "Here, *voor* says where the bus stop is."}

  nl.a1.unit08.lesson04.teach.waar_is: {title: "Where is ...?", gloss: "Where is ...?", note: "Use *Waar is ...?* to ask for the location of one place."}
  nl.a1.unit08.lesson04.teach.where_post_office: {title: "Where is the post office?", gloss: "Where is the post office?", note: "Keep *het* with *postkantoor* in the question."}
  nl.a1.unit08.lesson04.teach.tussen_bij: {title: "Between, near / at", gloss: "between, near / at", note: "Use *tussen ... en ...* to put one place between two others. *Bij* says one place is near another; it is less exact than *naast*.", example_gloss: ["The post office is between the library and the hospital.", "The supermarket is near the station."]}
  nl.a1.unit08.lesson04.teach.in_de_buurt_van: {title: "Near", gloss: "near", note: "The words *in de buurt van* together mean that a place is nearby."}
  nl.a1.unit08.lesson04.teach.post_office_between: {title: "The post office is between two places", gloss: "The post office is between the library and the hospital.", note: "Use *en* between the two other places."}
  nl.a1.unit08.lesson04.teach.supermarket_near: {title: "The supermarket is near the station", gloss: "The supermarket is near the station.", note: "*Bij* states a nearby location without claiming that the buildings are directly beside each other."}
  nl.a1.unit08.lesson04.teach.library_vicinity: {title: "The library is near the station", gloss: "The library is near the station.", note: "Learn the words *in de buurt van* together: *in de buurt van het station*."}

  nl.a1.unit08.lesson05.teach.kaart_buurtkaart: {title: "Map, neighbourhood map", gloss: "the map, the neighbourhood map", note: "*De kaart* can be a map or another type of card; here it means a map. Dutch writes *buurtkaart* as one word: *de buurtkaart*.", example_gloss: ["Where is the map?", "Here is the neighbourhood map."]}
  nl.a1.unit08.lesson05.teach.map_labels:
    title: "Neighbourhood map labels"
    gloss: "Library: opposite the station. Hospital: behind the library. Post office: between the library and hospital. Supermarket: next to the station. Bank: next to the supermarket. Bus stop: in front of the station."
    note: "Each label names a place and says where it is."
    glosses:
      BUURTKAART: "NEIGHBOURHOOD MAP"
      Bibliotheek: "library"
      tegenover: "opposite"
      station: "station"
      Ziekenhuis: "hospital"
      achter: "behind"
      Postkantoor: "post office"
      tussen: "between"
      Supermarkt: "supermarket"
      naast: "next to"
      Bank: "bank"
      Bushalte: "bus stop"

  nl.a1.unit08.lesson06.teach.opening: {title: "Looking at the map", gloss: "Lotte: Look, here is the neighbourhood map. Omar: Good. Where is the bus stop?", note: "Lotte and Omar speak informally, as usual."}
  nl.a1.unit08.lesson06.teach.stop_location: {title: "Locating the bus stop", gloss: "Lotte: The bus stop is in front of the station.", note: "Lotte answers with one direct location statement."}
  nl.a1.unit08.lesson06.teach.more_places: {title: "Locating the supermarket", gloss: "Omar: And where is the supermarket? Lotte: The supermarket is next to the station, near the bank.", note: "The answer says how the supermarket is located relative to two places."}
  nl.a1.unit08.lesson06.teach.library: {title: "Locating the library", gloss: "Omar: Where is the library? Lotte: The library is opposite the station. The language café is in the library.", note: "This reconnects the setting to the library established earlier in the course."}

