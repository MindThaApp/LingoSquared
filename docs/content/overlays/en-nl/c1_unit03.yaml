units: {nl.c1.unit03.registerbeheersing: {title: "Precise control of tone and register", description: "Preserve core content while shifting among familiar, formal diplomatic, sincere emphatic, and controlled ironic styles."}}
lessons:
  nl.c1.unit03.lesson01.publiek: {title: "The same message for a friend and an institution"}
  nl.c1.unit03.lesson02.diplomatiek: {title: "Soften a demand diplomatically"}
  nl.c1.unit03.lesson03.nadrukkelijk: {title: "Increase emphasis deliberately"}
  nl.c1.unit03.lesson04.ironie_of_oprechtheid: {title: "Distinguish irony from sincere emphasis"}
  nl.c1.unit03.lesson05.stijlkeuze: {title: "Match style to intent and relationship"}
  nl.c1.unit03.lesson06.precieze_toon: {title: "Deploy four tones purposefully"}
teaching:
  nl.c1.unit03.lesson01.teach.stuur_je: {title: "Send your answer today.", gloss: "direct familiar request", note: "*Stuur* is an imperative and *je* assumes familiar social distance; efficient with Omar, too blunt for an institution."}
  nl.c1.unit03.lesson01.teach.zou_u: {title: "Could you answer me today?", gloss: "formal softened request", note: "*Zou u ... kunnen antwoorden?* combines formal address with conditional softening while retaining today's deadline."}
  nl.c1.unit03.lesson01.teach.geachte: {title: "Dear Mr De Vries,", gloss: "formal named salutation", note: "*Geachte heer* is conventional institutional distance, unlike an informal greeting to a friend."}
  nl.c1.unit03.lesson01.teach.met_vriendelijke_groet: {title: "Kind regards,", gloss: "professional closing", note: "*Met vriendelijke groet* closes a professional message courteously without personal intimacy."}
  nl.c1.unit03.lesson01.teach.publieksverschuiving: {title: "Audience controls address", gloss: "Lotte writes directly with je to Omar and formally with u to the municipality.", note: "The requested action stays constant; pronoun and request frame encode the relationship."}
  nl.c1.unit03.lesson02.teach.zo_vriendelijk: {title: "Would you be so kind as to answer me today?", gloss: "highly deferential request", note: "*Zou u zo vriendelijk willen zijn ... te antwoorden* layers conditional, courtesy phrase, and infinitive for maximum diplomacy."}
  nl.c1.unit03.lesson02.teach.ik_zou_het_waarderen: {title: "I would appreciate it if you responded today.", gloss: "appreciation-based softening", note: "*Ik zou het op prijs stellen als...* frames compliance as appreciated rather than commanded."}
  nl.c1.unit03.lesson02.teach.wellicht: {title: "Perhaps you could give this priority.", gloss: "tentative priority request", note: "Sentence-initial *wellicht* softens, while *met voorrang* still conveys urgency; V2 gives *kunt u*."}
  nl.c1.unit03.lesson02.teach.gezichtsruimte: {title: "Diplomacy without hiding the deadline", gloss: "The wording leaves room while retaining the desired deadline.", note: "Successful softening protects autonomy but does not make the practical request vague."}
  nl.c1.unit03.lesson03.teach.werkelijk: {title: "That is truly excellently handled.", gloss: "sincere emphatic praise", note: "*Werkelijk* strengthens positive evaluation without changing the claim's content."}
  nl.c1.unit03.lesson03.teach.absoluut_noodzakelijk: {title: "An answer today is absolutely necessary.", gloss: "high-intensity necessity", note: "*Absoluut noodzakelijk* removes tentativeness and increases pressure; it suits escalation, not routine courtesy."}
  nl.c1.unit03.lesson03.teach.wat_ik_benadruk: {title: "What I want to emphasize is that delay is not an option.", gloss: "focus construction for insistence", note: "*Wat ik wil benadrukken, is dat...* spotlights the following proposition and raises its discourse weight."}
  nl.c1.unit03.lesson03.teach.intensiteit: {title: "Different kinds of emphasis", gloss: "Werkelijk strengthens appreciation; necessity and focus raise pressure.", note: "Emphasis can amplify praise or urgency, so appropriacy depends on intent."}
  nl.c1.unit03.lesson04.teach.weer_voortreffelijk: {title: "Well, that has been excellently handled again.", gloss: "literal praise used as criticism", note: "After repeated failure, *nou* and *weer* make *voortreffelijk* dryly ironic rather than sincere."}
  nl.c1.unit03.lesson04.teach.oprecht: {title: "I sincerely mean that: you solved this excellently.", gloss: "explicit sincere praise", note: "*Dat meen ik oprecht* blocks an ironic reading before the emphatic compliment."}
  nl.c1.unit03.lesson04.teach.alweer_mislukt: {title: "The delivery has failed yet again.", gloss: "repeated failure cue", note: "*Alweer* establishes recurrence and supplies the contradiction that licenses the ironic praise."}
  nl.c1.unit03.lesson04.teach.cue: {title: "Cues determine sincere or ironic force", gloss: "Recurrence can reverse praise; oprecht blocks reversal.", note: "Positive vocabulary alone does not determine tone: context plus *weer/nou* or *oprecht* does."}
  nl.c1.unit03.lesson05.teach.ongepast: {title: "inappropriate", gloss: "unsuited to the situation", note: "*Ongepast* judges a style against audience and setting, not its grammaticality.", example_gloss: "That direct demand is inappropriate here."}
  nl.c1.unit03.lesson05.teach.doeltreffend: {title: "The diplomatic version is effective.", gloss: "the diplomatic version achieves its purpose", note: "*De diplomatieke versie is doeltreffend* evaluates whether that precise register choice advances the communicative goal."}
  nl.c1.unit03.lesson05.teach.relatie: {title: "Relationship and purpose determine the suitable tone.", gloss: "contextual appropriacy principle", note: "*Relatie* determines social distance; *doel* determines the needed intensity."}
  nl.c1.unit03.lesson05.teach.vergelijking: {title: "Same content, different social packaging", gloss: "A direct friend version and diplomatic official version retain the deadline.", note: "The comparison isolates what changes—distance and politeness—from what does not—the requested response today."}
  nl.c1.unit03.lesson06.teach.vier_tonen: {title: "Four controlled versions", gloss: "Familiar directness, formal diplomacy, sincere emphasis, and contextual irony.", note: "Each sentence has a recoverable audience or intent and a specific Dutch cue."}
  nl.c1.unit03.lesson06.teach.effect: {title: "Interpersonal effects", gloss: "Directness reduces distance; diplomacy protects relationship; emphasis raises intensity; irony reverses praise.", note: "C1 control means selecting an effect deliberately while keeping the intended core message clear."}
exercises:
  nl.c1.unit03.lesson01.exercise01.herken_informeel: {instruction: "Which audience suits this direct je-request?", correct_option: "A close friend", distractors: ["A municipal department", "An unknown director", "A formal complaints board"], accepted_answers: [{value: "A close friend", status: correct}], feedback: "Imperative *stuur* plus *je* signals familiar directness."}
  nl.c1.unit03.lesson01.exercise02.herken_formeel: {instruction: "Which cues make this suitable for an institution?", correct_option: "u plus zou kunnen", distractors: ["je plus an imperative", "slang plus a nickname", "ironic praise"], accepted_answers: [{value: "u plus zou kunnen", status: correct}], feedback: "Formal *u* and conditional *zou ... kunnen* create distance and softening."}
  nl.c1.unit03.lesson01.exercise03.koppel_publiek: {instruction: "Match each Dutch register form to its precise English function.", pairs: [{left: "Stuur je antwoord", right: "direct request to a familiar person"}, {left: "Zou u kunnen antwoorden?", right: "deferential request to an institution"}, {left: "Geachte heer", right: "formal salutation to a named man"}, {left: "Met vriendelijke groet", right: "standard professional closing"}, {left: direct, right: "unsoftened in manner"}, {left: formeel, right: "suited to official distance"}, {left: gemeente, right: "local public authority"}], accepted_answers: [{value: [{left: "Stuur je antwoord", right: "direct request to a familiar person"}, {left: "Zou u kunnen antwoorden?", right: "deferential request to an institution"}, {left: "Geachte heer", right: "formal salutation to a named man"}, {left: "Met vriendelijke groet", right: "standard professional closing"}, {left: direct, right: "unsoftened in manner"}, {left: formeel, right: "suited to official distance"}, {left: gemeente, right: "local public authority"}], status: correct}], feedback: "Each form encodes a distinct relationship or message boundary."}
  nl.c1.unit03.lesson01.exercise04.orden_formeel: {instruction: "Order the exact formal request: Zou u + mij + vandaag nog + kunnen antwoorden.", accepted_answers: [{value: "Zou u mij vandaag nog kunnen antwoorden", status: correct}], feedback: "The modal infinitive cluster remains at the end."}
  nl.c1.unit03.lesson01.exercise05.vertaal_vriend: {instruction: "Translate for a friend using imperative Stuur, then je antwoord, then vandaag nog.", accepted_answers: [{value: "Stuur je antwoord vandaag nog", status: correct}], feedback: "The pinned order produces familiar directness."}
  nl.c1.unit03.lesson01.exercise06.spreek_instelling: {instruction: "Turn this friendly demand into a formal request to an institution, asking them to answer you: use the frame Zou u ... kunnen with the verb antwoorden. Source: \"Stuur je antwoord vandaag nog.\"", accepted_answers: [{value: "Zou u mij vandaag nog kunnen antwoorden", status: correct}, {value: "Zou u mij nog vandaag kunnen antwoorden", status: correct}, {value: "Zou u me vandaag nog kunnen antwoorden", status: correct}, {value: "Zou u me nog vandaag kunnen antwoorden", status: correct}, {value: "Zou u vandaag nog kunnen antwoorden", status: correct}, {value: "Zou u nog vandaag kunnen antwoorden", status: correct}], feedback: "Accepted: Zou u mij vandaag nog kunnen antwoorden. The imperative becomes a conditional question with u, and the modal infinitive closes the clause."}
  nl.c1.unit03.lesson01.exercise07.schrijf_mailkader: {instruction: "Omar is a friend, so soften this demand without becoming formal: turn it into a polite question with je and the frame zou ... kunnen, asking him to answer you. Source: \"Stuur je antwoord vandaag nog.\"", accepted_answers: [{value: "Zou je mij vandaag nog kunnen antwoorden", status: correct}, {value: "Zou je mij nog vandaag kunnen antwoorden", status: correct}, {value: "Zou je me vandaag nog kunnen antwoorden", status: correct}, {value: "Zou je me nog vandaag kunnen antwoorden", status: correct}, {value: "Zou je vandaag nog kunnen antwoorden", status: correct}, {value: "Zou je nog vandaag kunnen antwoorden", status: correct}, {value: "Zou jij mij vandaag nog kunnen antwoorden", status: correct}, {value: "Zou jij mij nog vandaag kunnen antwoorden", status: correct}, {value: "Zou jij me vandaag nog kunnen antwoorden", status: correct}, {value: "Zou jij me nog vandaag kunnen antwoorden", status: correct}, {value: "Zou jij vandaag nog kunnen antwoorden", status: correct}, {value: "Zou jij nog vandaag kunnen antwoorden", status: correct}], feedback: "Accepted: Zou je mij vandaag nog kunnen antwoorden. The imperative becomes a polite conditional question, but je keeps the familiar register."}
  nl.c1.unit03.lesson02.exercise01.herken_verzachting: {instruction: "What interpersonal effect does op prijs stellen create?", correct_option: "It frames compliance as appreciated.", distractors: ["It issues an unsoftened order.", "It mocks the addressee.", "It cancels the deadline."], accepted_answers: [{value: "It frames compliance as appreciated.", status: correct}], feedback: "The appreciation frame protects the relationship."}
  nl.c1.unit03.lesson02.exercise02.herken_wellicht: {instruction: "How do wellicht and met voorrang work together?", correct_option: "Tentative wording retains practical urgency.", distractors: ["Both remove urgency.", "Both create irony.", "They make the request informal."], accepted_answers: [{value: "Tentative wording retains practical urgency.", status: correct}], feedback: "*Wellicht* softens; *met voorrang* preserves priority."}
  nl.c1.unit03.lesson02.exercise03.koppel_diplomatiek: {instruction: "Match each diplomatic Dutch device to its distinct function.", pairs: [{left: "zo vriendelijk willen zijn", right: "highly deferential request frame"}, {left: "op prijs stellen", right: "express appreciation for compliance"}, {left: wellicht, right: "tentative possibility marker"}, {left: "met voorrang", right: "ahead of less urgent matters"}, {left: ruimte, right: "freedom left to the addressee"}, {left: "gewenste termijn", right: "preferred deadline"}, {left: verzwijgen, right: "leave entirely unmentioned"}], accepted_answers: [{value: [{left: "zo vriendelijk willen zijn", right: "highly deferential request frame"}, {left: "op prijs stellen", right: "express appreciation for compliance"}, {left: wellicht, right: "tentative possibility marker"}, {left: "met voorrang", right: "ahead of less urgent matters"}, {left: ruimte, right: "freedom left to the addressee"}, {left: "gewenste termijn", right: "preferred deadline"}, {left: verzwijgen, right: "leave entirely unmentioned"}], status: correct}], feedback: "The devices soften in different ways without erasing the request."}
  nl.c1.unit03.lesson02.exercise04.orden_waarderen: {instruction: "Order the exact diplomatic sentence: Ik zou het op prijs stellen + als u vandaag reageert.", accepted_answers: [{value: "Ik zou het op prijs stellen als u vandaag reageert", status: correct}], feedback: "The *als*-clause retains normal subordinate structure."}
  nl.c1.unit03.lesson02.exercise05.vertaal_voorrang: {instruction: "Translate with wellicht first, then V2 kunt u, then dit met voorrang bekijken.", accepted_answers: [{value: "Wellicht kunt u dit met voorrang bekijken", status: correct}], feedback: "Fronting *wellicht* triggers V2 *kunt u*."}
  nl.c1.unit03.lesson02.exercise06.spreek_diplomatiek: {instruction: "Make this demand as diplomatic as possible for an official, asking them to answer you: use the frame Zou u zo vriendelijk willen zijn (om) ... te with the verb antwoorden. Source: \"Stuur je antwoord vandaag nog.\"", accepted_answers: [{value: "Zou u zo vriendelijk willen zijn mij vandaag nog te antwoorden", status: correct}, {value: "Zou u zo vriendelijk willen zijn mij nog vandaag te antwoorden", status: correct}, {value: "Zou u zo vriendelijk willen zijn me vandaag nog te antwoorden", status: correct}, {value: "Zou u zo vriendelijk willen zijn me nog vandaag te antwoorden", status: correct}, {value: "Zou u zo vriendelijk willen zijn vandaag nog te antwoorden", status: correct}, {value: "Zou u zo vriendelijk willen zijn nog vandaag te antwoorden", status: correct}, {value: "Zou u zo vriendelijk willen zijn om mij vandaag nog te antwoorden", status: correct}, {value: "Zou u zo vriendelijk willen zijn om mij nog vandaag te antwoorden", status: correct}, {value: "Zou u zo vriendelijk willen zijn om me vandaag nog te antwoorden", status: correct}, {value: "Zou u zo vriendelijk willen zijn om me nog vandaag te antwoorden", status: correct}, {value: "Zou u zo vriendelijk willen zijn om vandaag nog te antwoorden", status: correct}, {value: "Zou u zo vriendelijk willen zijn om nog vandaag te antwoorden", status: correct}], feedback: "Accepted: Zou u zo vriendelijk willen zijn mij vandaag nog te antwoorden. The courtesy frame takes the infinitive with te."}
  nl.c1.unit03.lesson02.exercise07.schrijf_diplomatiek: {instruction: "Re-express this tentative request with the appreciation frame Ik zou het op prijs stellen (als ...), keeping the priority meaning. Source: \"Wellicht kunt u dit met voorrang bekijken.\"", accepted_answers: [{value: "Ik zou het op prijs stellen als u dit met voorrang kunt bekijken", status: correct}, {value: "Ik zou het op prijs stellen als u dit met voorrang bekijken kunt", status: correct}, {value: "Als u dit met voorrang kunt bekijken, zou ik het op prijs stellen", status: correct}, {value: "Als u dit met voorrang kunt bekijken, dan zou ik het op prijs stellen", status: correct}, {value: "Als u dit met voorrang bekijken kunt, zou ik het op prijs stellen", status: correct}, {value: "Als u dit met voorrang bekijken kunt, dan zou ik het op prijs stellen", status: correct}], feedback: "Accepted: Ik zou het op prijs stellen als u dit met voorrang kunt bekijken. Inside the als-clause the verbs go to the end."}
  nl.c1.unit03.lesson03.exercise01.herken_waardering: {instruction: "What kind of emphasis does werkelijk create here?", correct_option: "Sincere intensified praise", distractors: ["Diplomatic uncertainty", "Automatic irony", "Formal distance only"], accepted_answers: [{value: "Sincere intensified praise", status: correct}], feedback: "Without a contradicting context, *werkelijk uitstekend* intensifies approval."}
  nl.c1.unit03.lesson03.exercise02.herken_druk: {instruction: "What effect does absoluut noodzakelijk create?", correct_option: "High pressure and no tentativeness", distractors: ["A casual suggestion", "A humorous aside", "Reduced urgency"], accepted_answers: [{value: "High pressure and no tentativeness", status: correct}], feedback: "The phrase presents compliance as essential."}
  nl.c1.unit03.lesson03.exercise03.koppel_nadruk: {instruction: "Match each Dutch emphasis element to its precise clue.", pairs: [{left: werkelijk, right: "intensifies sincere evaluation"}, {left: uitstekend, right: "exceptionally good"}, {left: geregeld, right: "organized or handled"}, {left: "absoluut noodzakelijk", right: "presented as wholly essential"}, {left: benadrukken, right: "place deliberate stress on"}, {left: uitstel, right: "delay"}, {left: "geen optie", right: "not an acceptable possibility"}, {left: druk, right: "pressure on the addressee"}], accepted_answers: [{value: [{left: werkelijk, right: "intensifies sincere evaluation"}, {left: uitstekend, right: "exceptionally good"}, {left: geregeld, right: "organized or handled"}, {left: "absoluut noodzakelijk", right: "presented as wholly essential"}, {left: benadrukken, right: "place deliberate stress on"}, {left: uitstel, right: "delay"}, {left: "geen optie", right: "not an acceptable possibility"}, {left: druk, right: "pressure on the addressee"}], status: correct}], feedback: "Praise and pressure use different emphatic resources."}
  nl.c1.unit03.lesson03.exercise04.orden_focus: {instruction: "Order the exact focus sentence with Wat ik wil benadrukken first and dat uitstel geen optie is second.", accepted_answers: [{value: "Wat ik wil benadrukken is dat uitstel geen optie is", status: correct}], feedback: "The final *is* closes the subordinate clause."}
  nl.c1.unit03.lesson03.exercise05.vertaal_noodzakelijk: {instruction: "Translate with Een antwoord vandaag as subject, followed by is absoluut noodzakelijk.", accepted_answers: [{value: "Een antwoord vandaag is absoluut noodzakelijk", status: correct}], feedback: "The pinned noun-phrase order avoids a competing adverb placement."}
  nl.c1.unit03.lesson03.exercise06.spreek_waardering: {instruction: "Say this in Dutch with sincere emphasis, using werkelijk and the participle geregeld: 'That is truly excellently handled.'", accepted_answers: [{value: "Dat is werkelijk uitstekend geregeld", status: correct}, {value: "Dit is werkelijk uitstekend geregeld", status: correct}], feedback: "Accepted: Dat is werkelijk uitstekend geregeld. Werkelijk strengthens the evaluation without changing its claim."}
  nl.c1.unit03.lesson03.exercise07.schrijf_focus: {instruction: "Rephrase this claim as an emphatic focus (cleft) sentence with benadrukken, turning the claim into a dat-clause. Source: \"Een antwoord vandaag is absoluut noodzakelijk.\"", accepted_answers: [{value: "Wat ik wil benadrukken, is dat een antwoord vandaag absoluut noodzakelijk is.", status: correct}, {value: "Wat ik wil benadrukken, is dat vandaag een antwoord absoluut noodzakelijk is", status: correct}, {value: "Wat ik benadruk, is dat een antwoord vandaag absoluut noodzakelijk is", status: correct}, {value: "Wat ik benadruk, is dat vandaag een antwoord absoluut noodzakelijk is", status: correct}], feedback: "Accepted: Wat ik wil benadrukken, is dat een antwoord vandaag absoluut noodzakelijk is. In the dat-clause the verb is moves to the end."}
  nl.c1.unit03.lesson04.exercise01.herken_ironie: {instruction: "Given another failed delivery, what does voortreffelijk actually convey?", correct_option: "Criticism of repeated failure", distractors: ["Sincere admiration", "Uncertainty about delivery", "A formal request"], accepted_answers: [{value: "Criticism of repeated failure", status: correct}], feedback: "*Alweer*, *nou*, and *weer* contradict literal praise."}
  nl.c1.unit03.lesson04.exercise02.herken_oprecht: {instruction: "Which word explicitly blocks an ironic reading?", correct_option: oprecht, distractors: [weer, nou, alweer], accepted_answers: [{value: oprecht, status: correct}], feedback: "*Oprecht* directly asserts sincerity."}
  nl.c1.unit03.lesson04.exercise03.koppel_toon: {instruction: "Match each Dutch tone cue to its contextual function.", pairs: [{left: nou, right: "reaction marker that can sound dry"}, {left: weer, right: "signals recurrence"}, {left: voortreffelijk, right: "very good in literal meaning"}, {left: oprecht, right: "explicitly sincere"}, {left: opgelost, right: "successfully resolved"}, {left: "alweer mislukt", right: "failed yet again"}, {left: "herhaald falen", right: "repeated lack of success"}, {left: ironisch, right: "intended meaning opposes literal praise"}], accepted_answers: [{value: [{left: nou, right: "reaction marker that can sound dry"}, {left: weer, right: "signals recurrence"}, {left: voortreffelijk, right: "very good in literal meaning"}, {left: oprecht, right: "explicitly sincere"}, {left: opgelost, right: "successfully resolved"}, {left: "alweer mislukt", right: "failed yet again"}, {left: "herhaald falen", right: "repeated lack of success"}, {left: ironisch, right: "intended meaning opposes literal praise"}], status: correct}], feedback: "Context and lexical cues jointly determine tone."}
  nl.c1.unit03.lesson04.exercise04.orden_oprecht: {instruction: "Order the exact sincere version: Dat meen ik oprecht + je hebt dit uitstekend opgelost.", accepted_answers: [{value: "Dat meen ik oprecht je hebt dit uitstekend opgelost", status: correct}], feedback: "The sincerity frame precedes the praise."}
  nl.c1.unit03.lesson04.exercise05.vertaal_mislukt: {instruction: "Translate with De levering first and alweer immediately before mislukt.", accepted_answers: [{value: "De levering is alweer mislukt", status: correct}], feedback: "*Alweer* supplies the recurrence cue."}
  nl.c1.unit03.lesson04.exercise06.spreek_ironie: {instruction: "After this failure, answer with a dry ironic remark about how well it was arranged: use nou, weer, the praise word voortreffelijk and the participle geregeld. Source: \"De levering is alweer mislukt.\"", accepted_answers: [{value: "Nou, dat is weer voortreffelijk geregeld.", status: correct}, {value: "Nou, dat is alweer voortreffelijk geregeld", status: correct}, {value: "Nou, dat is weer eens voortreffelijk geregeld", status: correct}, {value: "Nou, dit is weer voortreffelijk geregeld", status: correct}, {value: "Nou, dit is alweer voortreffelijk geregeld", status: correct}, {value: "Nou, dit is weer eens voortreffelijk geregeld", status: correct}, {value: "Nou, het is weer voortreffelijk geregeld", status: correct}, {value: "Nou, het is alweer voortreffelijk geregeld", status: correct}, {value: "Nou, het is weer eens voortreffelijk geregeld", status: correct}], feedback: "Accepted: Nou, dat is weer voortreffelijk geregeld. After a repeated failure, nou and weer reverse the literal praise."}
  nl.c1.unit03.lesson04.exercise07.schrijf_oprecht: {instruction: "Omar really did solve it. Add a sincerity statement with the verb meen and the word oprecht, so nobody can read this praise as irony. Source: \"Je hebt dit uitstekend opgelost.\"", accepted_answers: [{value: "Dat meen ik oprecht: je hebt dit uitstekend opgelost.", status: correct}, {value: "Ik meen het oprecht: je hebt dit uitstekend opgelost", status: correct}, {value: "Ik meen dat oprecht: je hebt dit uitstekend opgelost", status: correct}, {value: "je hebt dit uitstekend opgelost, dat meen ik oprecht", status: correct}, {value: "je hebt dit uitstekend opgelost, ik meen het oprecht", status: correct}, {value: "je hebt dit uitstekend opgelost, ik meen dat oprecht", status: correct}], feedback: "Accepted: Dat meen ik oprecht: je hebt dit uitstekend opgelost. The explicit sincerity cue blocks an ironic reading."}
  nl.c1.unit03.lesson05.exercise01.lees_vriend: {instruction: "Which audience suits Lotte's direct je-version?", correct_option: "Her friend Omar", distractors: ["A municipal official", "An unknown client", "A formal tribunal"], accepted_answers: [{value: "Her friend Omar", status: correct}], feedback: "Their established familiar relationship supports *je* and an imperative."}
  nl.c1.unit03.lesson05.exercise02.lees_ambtenaar: {instruction: "Which audience suits the u-version with op prijs stellen?", correct_option: "A public official", distractors: ["Her close friend Omar", "A small child", "A teammate during play"], accepted_answers: [{value: "A public official", status: correct}], feedback: "Formal address and appreciation framing suit institutional distance."}
  nl.c1.unit03.lesson05.exercise03.koppel_stijl: {instruction: "Match each Dutch appropriacy term to its distinct clue.", pairs: [{left: ongepast, right: "unsuitable for the situation"}, {left: doeltreffend, right: "effective in achieving the aim"}, {left: relatie, right: "social connection between participants"}, {left: doel, right: "communicative purpose"}, {left: "passende toon", right: "style suited to context"}, {left: ambtenaar, right: "public official"}, {left: inhoud, right: "propositional content"}, {left: afstand, right: "social distance"}, {left: beleefdheid, right: "politeness"}], accepted_answers: [{value: [{left: ongepast, right: "unsuitable for the situation"}, {left: doeltreffend, right: "effective in achieving the aim"}, {left: relatie, right: "social connection between participants"}, {left: doel, right: "communicative purpose"}, {left: "passende toon", right: "style suited to context"}, {left: ambtenaar, right: "public official"}, {left: inhoud, right: "propositional content"}, {left: afstand, right: "social distance"}, {left: beleefdheid, right: "politeness"}], status: correct}], feedback: "These terms distinguish context, effect, and preserved content."}
  nl.c1.unit03.lesson05.exercise04.orden_passend: {instruction: "Order the exact principle: De relatie en het doel + bepalen + de passende toon.", accepted_answers: [{value: "De relatie en het doel bepalen de passende toon", status: correct}], feedback: "The coordinated subject precedes V2 *bepalen*."}
  nl.c1.unit03.lesson05.exercise05.vertaal_doeltreffend: {instruction: "Translate using De diplomatieke versie as subject, followed by is doeltreffend.", accepted_answers: [{value: "De diplomatieke versie is doeltreffend", status: correct}], feedback: "The wording evaluates effectiveness, not merely politeness."}
  nl.c1.unit03.lesson05.exercise06.spreek_keuze: {instruction: "Hedge this principle by fronting wellicht. Source: \"De relatie en het doel bepalen de passende toon.\"", accepted_answers: [{value: "Wellicht bepalen de relatie en het doel de passende toon", status: correct}], feedback: "Accepted: Wellicht bepalen de relatie en het doel de passende toon. Fronting wellicht triggers V2, so the verb precedes the subject."}
  nl.c1.unit03.lesson05.exercise07.schrijf_contrast: {instruction: "Write in Dutch: 'The content stays the same, but distance and politeness change.' Use the verb blijft and the conjunction maar, in the same order as the English.", accepted_answers: [{value: "De inhoud blijft gelijk, maar afstand en beleefdheid veranderen.", status: correct}], feedback: "Accepted: De inhoud blijft gelijk, maar afstand en beleefdheid veranderen. Maar joins two main clauses without changing their word order."}
  nl.c1.unit03.lesson06.exercise01.luister_tonen: {instruction: "Listen and identify the sequence of tones.", correct_option: "informal direct → formal diplomatic → sincere emphatic → ironic", distractors: ["formal → ironic → informal → neutral", "ironic → diplomatic → formal → informal", "four identical neutral versions"], accepted_answers: [{value: "informal direct → formal diplomatic → sincere emphatic → ironic", status: correct}], feedback: "Pronouns, modal frames, intensifiers, and recurrence cues distinguish the four."}
  nl.c1.unit03.lesson06.exercise02.lees_publiek: {instruction: "Match the four versions to friend, institution, sincere praise, and failed-delivery criticism.", correct_option: "Stuur je → friend; Zou u → institution; werkelijk uitstekend → sincere praise; nou weer voortreffelijk → failed-delivery criticism", distractors: ["All four suit an institution equally.", "All four are ironic.", "The u-version suits a close friend best."], accepted_answers: [{value: "Stuur je → friend; Zou u → institution; werkelijk uitstekend → sincere praise; nou weer voortreffelijk → failed-delivery criticism", status: correct}], feedback: "Each mapping cites a concrete register or tone cue."}
  nl.c1.unit03.lesson06.exercise03.koppel_effect: {instruction: "Match each Dutch form to its interpersonal effect.", pairs: [{left: "Stuur je", right: "familiar directness"}, {left: "Zou u zo vriendelijk", right: "institutional deference"}, {left: "werkelijk uitstekend", right: "sincere emphatic approval"}, {left: "nou ... weer voortreffelijk", right: "dry criticism through reversed praise"}, {left: directheid, right: "reduces interpersonal distance"}, {left: diplomatie, right: "protects the working relationship"}, {left: nadruk, right: "raises communicative intensity"}, {left: ironie, right: "turns literal praise into criticism"}], accepted_answers: [{value: [{left: "Stuur je", right: "familiar directness"}, {left: "Zou u zo vriendelijk", right: "institutional deference"}, {left: "werkelijk uitstekend", right: "sincere emphatic approval"}, {left: "nou ... weer voortreffelijk", right: "dry criticism through reversed praise"}, {left: directheid, right: "reduces interpersonal distance"}, {left: diplomatie, right: "protects the working relationship"}, {left: nadruk, right: "raises communicative intensity"}, {left: ironie, right: "turns literal praise into criticism"}], status: correct}], feedback: "The mappings connect form, intended audience, and effect."}
  nl.c1.unit03.lesson06.exercise04.orden_schaal: {instruction: "Place the four taught Dutch tone labels in the exact assessment order: directness, diplomacy, emphasis, irony.", accepted_answers: [{value: "Directheid diplomatie nadruk ironie", status: correct}], feedback: "This order mirrors the four assessment versions."}
  nl.c1.unit03.lesson06.exercise05.spreek_verschuiving: {instruction: "Soften this demand for an official with the appreciation frame Ik zou het op prijs stellen (als ...), keeping the deadline today and using the verb reageren. Source: \"Een antwoord vandaag is absoluut noodzakelijk.\"", accepted_answers: [{value: "Ik zou het op prijs stellen als u vandaag reageert.", status: correct}, {value: "Ik zou het op prijs stellen als u vandaag nog reageert", status: correct}, {value: "Ik zou het op prijs stellen als u nog vandaag reageert", status: correct}, {value: "Als u vandaag reageert, zou ik het op prijs stellen", status: correct}, {value: "Als u vandaag reageert, dan zou ik het op prijs stellen", status: correct}, {value: "Als u vandaag nog reageert, zou ik het op prijs stellen", status: correct}, {value: "Als u vandaag nog reageert, dan zou ik het op prijs stellen", status: correct}, {value: "Als u nog vandaag reageert, zou ik het op prijs stellen", status: correct}, {value: "Als u nog vandaag reageert, dan zou ik het op prijs stellen", status: correct}], feedback: "Accepted: Ik zou het op prijs stellen als u vandaag reageert. Diplomacy replaces the blunt necessity, and the verb goes last after als."}
  nl.c1.unit03.lesson06.exercise06.schrijf_verschuiving: {instruction: "Turn this ironic remark into sincere praise: remove the irony cues and mark the praise as heartfelt with werkelijk. Source: \"Nou, dat is weer voortreffelijk geregeld.\"", accepted_answers: [{value: "Dat is werkelijk voortreffelijk geregeld.", status: correct}, {value: "Dit is werkelijk voortreffelijk geregeld", status: correct}, {value: "Werkelijk, dat is voortreffelijk geregeld", status: correct}], feedback: "Accepted: Dat is werkelijk voortreffelijk geregeld. Without nou and weer, and with werkelijk, the praise reads as sincere."}
  nl.c1.unit03.lesson06.exercise07.dictaat_formeel: {instruction: "Type exactly what you hear.", correct_response: "Zou u zo vriendelijk willen zijn mij vandaag nog te antwoorden", orthography_strict: true, feedback: "The audio contains the complete formal diplomatic request."}
