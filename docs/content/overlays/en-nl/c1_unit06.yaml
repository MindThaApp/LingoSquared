teaching:
  nl.c1.unit06.lesson01.teach.spijker: {title: "You hit the nail on the head.", gloss: "say exactly the right thing", note: "*Je slaat de spijker op de kop* is figurative: no real nail is struck; it means you say exactly what is going on."}
  nl.c1.unit06.lesson01.teach.koffiedik: {title: "That is reading coffee grounds.", gloss: "impossible to predict", note: "*Koffiedik kijken* means trying to predict the unpredictable; *dat is koffiedik kijken* = it is anyone's guess."}
  nl.c1.unit06.lesson01.teach.aap_mouw: {title: "Now the monkey comes out of the sleeve.", gloss: "the real intention is revealed", note: "*De aap komt uit de mouw* means the hidden truth or real intention finally shows itself."}
  nl.c1.unit06.lesson01.teach.figuurlijk: {title: "Figurative, not literal", gloss: "idioms mean more than their words", note: "A *uitdrukking* like *de spijker op de kop slaan* is *figuurlijk* (figurative): it does not describe a real action."}
  nl.c1.unit06.lesson02.teach.deur_huis: {title: "I came straight to the point.", gloss: "to be blunt and direct", note: "*Met de deur in huis vallen* means to be blunt, to get straight to the point without a preamble."}
  nl.c1.unit06.lesson02.teach.mug_olifant: {title: "You are making an elephant out of a mosquito.", gloss: "blow out of proportion", note: "*Van een mug een olifant maken* means to blow a small matter out of proportion."}
  nl.c1.unit06.lesson02.teach.koude_kleren: {title: "It really got to me.", gloss: "to affect deeply", note: "*Dat gaat me niet in de koude kleren zitten* means it affects you deeply — you are not left cold by it."}
  nl.c1.unit06.lesson02.teach.dialoog.line01: {title: "How did your talk with the chef go?", gloss: "opening question", note: "Lotte asks Omar how his conversation with his chef went."}
  nl.c1.unit06.lesson02.teach.dialoog.line02: {title: "I came straight to the point...", gloss: "Omar uses met de deur in huis vallen", note: "Omar says he was direct and said exactly what he thought."}
  nl.c1.unit06.lesson02.teach.dialoog.line03: {title: "And, what did he say?", gloss: "follow-up question", note: "Lotte asks what the chef replied."}
  nl.c1.unit06.lesson02.teach.dialoog.line04: {title: "He said I hit the nail on the head.", gloss: "chef's praise via idiom", note: "The chef used *de spijker op de kop slaan*: Omar said exactly the right thing."}
  nl.c1.unit06.lesson02.teach.dialoog.line05: {title: "See? You make a mountain out of a molehill.", gloss: "Lotte reassures with an idiom", note: "Lotte says Omar is *van een mug een olifant* maken: blowing it out of proportion."}
  nl.c1.unit06.lesson02.teach.dialoog.line06: {title: "Maybe, but it affected me deeply...", gloss: "Omar's final line", note: "Omar admits *het ging me niet in de koude kleren zitten*: it really mattered to him."}
  nl.c1.unit06.lesson02.teach.register: {title: "Idiom is normal in informal talk", gloss: "informal register fits idioms", note: "Between friends (informal *jij/je*), idiom is very common; the expressions stay figurative."}
  nl.c1.unit06.lesson03.teach.knie: {title: "I have finally got the hang of it.", gloss: "to master", note: "*Onder de knie hebben* means to have mastered something; *onder de knie krijgen* = to master it."}
  nl.c1.unit06.lesson03.teach.gaten: {title: "I keep a close eye on it.", gloss: "keep an eye on", note: "*In de gaten houden* means to watch or monitor something closely."}
  nl.c1.unit06.lesson03.teach.beslissing: {title: "We have to make a decision.", gloss: "een beslissing nemen (not maken)", note: "*Een beslissing nemen* is the fixed collocation; *maken* would be a calque from English."}
  nl.c1.unit06.lesson03.teach.sprake: {title: "He brought the topic up.", gloss: "ter sprake brengen", note: "*Ter sprake brengen* means to raise a topic for discussion."}
  nl.c1.unit06.lesson03.teach.collocatie: {title: "Words that belong together", gloss: "collocations vs calques", note: "Some words form *vaste verbindingen* (collocations). *Een beslissing maken* is a *calque* from English and is wrong."}
  nl.c1.unit06.lesson04.teach.mand: {title: "He fell through the basket.", gloss: "to be exposed", note: "*Door de mand vallen* means to be exposed as dishonest or incompetent."}
  nl.c1.unit06.lesson04.teach.bal: {title: "The ball is in your court now.", gloss: "it is your turn", note: "*De bal ligt bij jou* means the responsibility or next move is yours."}
  nl.c1.unit06.lesson04.teach.hart: {title: "That topic is close to my heart.", gloss: "to care deeply", note: "*Aan het hart gaan* means something matters deeply to you."}
  nl.c1.unit06.lesson04.teach.vergelijk: {title: "We eventually reached an agreement.", gloss: "tot een vergelijk komen", note: "*Tot een vergelijk komen* means to reach a compromise or agreement."}
  nl.c1.unit06.lesson04.teach.leestekst: {title: "A short text with figurative language", gloss: "read for idiom and metaphor", note: "Read the text for what each figurative expression means and how it sets the tone."}
  nl.c1.unit06.lesson04.teach.toon: {title: "Imagery carries tone", gloss: "figurative language = meaning + feeling", note: "*Beeldspraak* gives a text its *toon*: *door de mand vallen* sounds harsh, *aan het hart gaan* sounds warm."}
  nl.c1.unit06.lesson05.teach.pet: {title: "He does it half-heartedly.", gloss: "er met de pet naar gooien", note: "*Er met de pet naar gooien* means to do something carelessly, without real effort."}
  nl.c1.unit06.lesson05.teach.bus: {title: "That is absolutely right.", gloss: "dat klopt als een bus", note: "*Dat klopt als een bus* is a colloquial way to say something is completely correct."}
  nl.c1.unit06.lesson05.teach.raad: {title: "I am at a loss.", gloss: "zich geen raad weten", note: "*Zich geen raad weten* means to be at a loss, not knowing what to do."}
  nl.c1.unit06.lesson05.teach.twee_uitdrukkingen: {title: "Combining two idioms", gloss: "two expressions in one turn", note: "You can combine two *uitdrukkingen* in one turn to sound lively and natural."}
  nl.c1.unit06.lesson06.teach.hand_werken: {title: "Too little control encourages mistakes.", gloss: "iets in de hand werken", note: "*Iets in de hand werken* means to foster or encourage something, usually something negative."}
  nl.c1.unit06.lesson06.teach.handdoek: {title: "He threw in the towel.", gloss: "de handdoek in de ring gooien", note: "*De handdoek in de ring gooien* means to give up."}
  nl.c1.unit06.lesson06.teach.calque_note: {title: "Avoid literal calques", gloss: "write natural, not translated Dutch", note: "*Vermijd letterlijke vertalingen*: *een beslissing maken* is a calque from English; in Dutch you *neem* a decision."}
exercises:
  nl.c1.unit06.lesson01.exercise01.herken_spijker: {instruction: "What does *Je slaat de spijker op de kop* mean?", correct_option: "You say exactly the right thing.", distractors: ["You hammer a nail into a wall.", "You are cooking a meal.", "You are asking a question."], accepted_answers: [{value: "You say exactly the right thing.", status: correct}], feedback: "The idiom means to say precisely what is true or needed."}
  nl.c1.unit06.lesson01.exercise02.herken_koffiedik: {instruction: "What does *Dat is koffiedik kijken* mean?", correct_option: "The outcome is impossible to predict.", distractors: ["Someone is reading coffee grounds.", "A cup of coffee is ready.", "It is a question about the weather."], accepted_answers: [{value: "The outcome is impossible to predict.", status: correct}], feedback: "It means anyone's guess — you cannot know yet."}
  nl.c1.unit06.lesson01.exercise03.koppel_figuurlijk: {instruction: "Match each Dutch idiom to its meaning.", pairs: [{left: "de spijker op de kop slaan", right: "to hit the nail on the head (say exactly the right thing)"}, {left: "koffiedik kijken", right: "to try to predict the unpredictable"}, {left: "de aap komt uit de mouw", right: "the real intention is revealed"}, {left: "een uitdrukking", right: "a fixed expression (idiom)"}, {left: figuurlijk, right: "figurative, not literal"}, {left: letterlijk, right: "literal"}, {left: precies, right: "exactly"}, {left: "de kop", right: "the head"}], accepted_answers: [{value: [{left: "de spijker op de kop slaan", right: "to hit the nail on the head (say exactly the right thing)"}, {left: "koffiedik kijken", right: "to try to predict the unpredictable"}, {left: "de aap komt uit de mouw", right: "the real intention is revealed"}, {left: "een uitdrukking", right: "a fixed expression (idiom)"}, {left: figuurlijk, right: "figurative, not literal"}, {left: letterlijk, right: "literal"}, {left: precies, right: "exactly"}, {left: "de kop", right: "the head"}], status: correct}], feedback: "Figurative idioms mean more than their literal words."}
  nl.c1.unit06.lesson01.exercise04.orden_spijker: {instruction: "Order the exact idiom: Je + slaat + de + spijker + op + de + kop.", accepted_answers: [{value: "Je slaat de spijker op de kop", status: correct}], feedback: "The idiom uses *slaan* with *spijker* and *kop*."}
  nl.c1.unit06.lesson01.exercise05.vertaal_koffiedik: {instruction: "Translate into Dutch, using the idiom *koffiedik kijken*: \"That is guesswork; nobody can predict it.\"", accepted_answers: [{value: "Dat is koffiedik kijken", status: correct}, {value: "Het is koffiedik kijken", status: correct}, {value: "Dit is koffiedik kijken", status: correct}], feedback: "The idiom is *koffiedik kijken* (reading coffee grounds): *Dat is koffiedik kijken.* (*Het* and *Dit* also work.)"}
  nl.c1.unit06.lesson01.exercise06.spreek_aap: {instruction: "Say in Dutch, using the idiom *de aap uit de mouw komen*: \"He says that now the truth is coming out.\"", accepted_answers: [{value: "Hij zegt dat nu de aap uit de mouw komt", status: correct}, {value: "Hij zegt dat de aap nu uit de mouw komt", status: correct}, {value: "Hij zegt nu komt de aap uit de mouw", status: correct}], feedback: "Use the idiom in a *dat*-clause with the verb last: *Hij zegt dat nu de aap uit de mouw komt.* (*nu* may also follow *aap*; a direct quote also works.)"}
  nl.c1.unit06.lesson01.exercise07.schrijf_spijker: {instruction: "Tell a friend in Dutch, using the idiom *de spijker op de kop slaan* in the present tense: \"You are not saying exactly the right thing.\"", accepted_answers: [{value: "Je slaat de spijker niet op de kop", status: correct}, {value: "Jij slaat de spijker niet op de kop", status: correct}], feedback: "Choose the person and place *niet*: *Je slaat de spijker niet op de kop.* (*Jij* also works.)"}
  nl.c1.unit06.lesson02.exercise01.luister_gesprek: {instruction: "Listen. What does Omar mean by *Ik viel met de deur in huis*?", correct_option: "He came straight to the point without preamble.", distractors: ["He fell through the front door.", "He closed the door loudly.", "He waited outside the house."], accepted_answers: [{value: "He came straight to the point without preamble.", status: correct}], feedback: "The idiom means to be direct and blunt, not a physical fall."}
  nl.c1.unit06.lesson02.exercise02.herken_mug: {instruction: "What does *Je maakt van een mug een olifant* mean?", correct_option: "You are blowing a small matter out of proportion.", distractors: ["You are sculpting an elephant.", "You are watching insects.", "You are telling a joke."], accepted_answers: [{value: "You are blowing a small matter out of proportion.", status: correct}], feedback: "It means exaggerating a small problem."}
  nl.c1.unit06.lesson02.exercise03.koppel_gesprek: {instruction: "Match each idiom from the conversation to its meaning.", pairs: [{left: "met de deur in huis vallen", right: "to come straight to the point, bluntly"}, {left: "van een mug een olifant maken", right: "to blow a small matter out of proportion"}, {left: "niet in de koude kleren zitten", right: "to affect someone deeply (not leave them cold)"}, {left: "de spijker op de kop slaan", right: "to say exactly the right thing"}, {left: "het gesprek", right: "the conversation"}, {left: "de chef", right: "the chef (Omar's boss)"}, {left: informeel, right: "informal"}, {left: figuurlijk, right: "figurative (not literal)"}], accepted_answers: [{value: [{left: "met de deur in huis vallen", right: "to come straight to the point, bluntly"}, {left: "van een mug een olifant maken", right: "to blow a small matter out of proportion"}, {left: "niet in de koude kleren zitten", right: "to affect someone deeply (not leave them cold)"}, {left: "de spijker op de kop slaan", right: "to say exactly the right thing"}, {left: "het gesprek", right: "the conversation"}, {left: "de chef", right: "the chef (Omar's boss)"}, {left: informeel, right: "informal"}, {left: figuurlijk, right: "figurative (not literal)"}], status: correct}], feedback: "Each idiom in the conversation has a non-literal meaning."}
  nl.c1.unit06.lesson02.exercise04.orden_deur: {instruction: "Order Omar's exact phrase: Ik + viel + met + de + deur + in + huis.", accepted_answers: [{value: "Ik viel met de deur in huis", status: correct}], feedback: "The idiom means to be blunt and direct."}
  nl.c1.unit06.lesson02.exercise05.vertaal_mug: {instruction: "Translate into Dutch, using the idiom *van een mug een olifant maken*: \"He says you are blowing this out of proportion.\"", accepted_answers: [{value: "Hij zegt dat je van een mug een olifant maakt", status: correct}, {value: "Hij zegt dat jij van een mug een olifant maakt", status: correct}, {value: "Hij zegt je maakt van een mug een olifant", status: correct}, {value: "Hij zegt jij maakt van een mug een olifant", status: correct}], feedback: "The idiom in a *dat*-clause: *Hij zegt dat je van een mug een olifant maakt.* (*jij* and a direct quote also work.)"}
  nl.c1.unit06.lesson02.exercise06.spreek_koude: {instruction: "Ask a friend in Dutch, using the idiom *niet in de koude kleren zitten* in the past tense with *gaan*: \"Didn't that conversation get to you deeply?\"", accepted_answers: [{value: "Ging dat gesprek je niet in de koude kleren zitten", status: correct}, {value: "Ging dat gesprek jou niet in de koude kleren zitten", status: correct}, {value: "Ging het gesprek je niet in de koude kleren zitten", status: correct}, {value: "Ging het gesprek jou niet in de koude kleren zitten", status: correct}], feedback: "The idiom in a question, verb first: *Ging dat gesprek je niet in de koude kleren zitten?* (*het gesprek* and *jou* also work.)"}
  nl.c1.unit06.lesson02.exercise07.schrijf_dialoog: {instruction: "Write in Dutch, using the idiom *met de deur in huis vallen* in the past: \"Omar says that he came straight to the point.\"", accepted_answers: [{value: "Omar zegt dat hij met de deur in huis viel", status: correct}, {value: "Omar zegt dat hij met de deur in huis is gevallen", status: correct}, {value: "Omar zegt hij viel met de deur in huis", status: correct}], feedback: "Reported speech puts the verb last: *Omar zegt dat hij met de deur in huis viel.* (The perfect *is gevallen* and a direct quote also work.)"}
  nl.c1.unit06.lesson03.exercise01.herken_knie: {instruction: "What does *Ik heb het eindelijk onder de knie* mean?", correct_option: "I have finally mastered it.", distractors: ["My knee is injured.", "I am kneeling down.", "I dropped something."], accepted_answers: [{value: "I have finally mastered it.", status: correct}], feedback: "The collocation means to have mastered something."}
  nl.c1.unit06.lesson03.exercise02.herken_sprake: {instruction: "What does *ter sprake brengen* mean?", correct_option: "To bring a topic up for discussion.", distractors: ["To speak very quickly.", "To shout at someone.", "To stay silent."], accepted_answers: [{value: "To bring a topic up for discussion.", status: correct}], feedback: "It means raising a subject for discussion."}
  nl.c1.unit06.lesson03.exercise03.koppel_verbinding: {instruction: "Match each Dutch collocation to its meaning.", pairs: [{left: "onder de knie krijgen", right: "to master (get the hang of)"}, {left: "in de gaten houden", right: "to keep an eye on"}, {left: "een beslissing nemen", right: "to make a decision"}, {left: "ter sprake brengen", right: "to bring a topic up"}, {left: "een vaste verbinding", right: "a fixed collocation"}, {left: "een calque", right: "a literal word-for-word translation"}, {left: "letterlijk vertalen", right: "to translate literally"}, {left: nemen, right: "to take (in een beslissing nemen)"}], accepted_answers: [{value: [{left: "onder de knie krijgen", right: "to master (get the hang of)"}, {left: "in de gaten houden", right: "to keep an eye on"}, {left: "een beslissing nemen", right: "to make a decision"}, {left: "ter sprake brengen", right: "to bring a topic up"}, {left: "een vaste verbinding", right: "a fixed collocation"}, {left: "een calque", right: "a literal word-for-word translation"}, {left: "letterlijk vertalen", right: "to translate literally"}, {left: nemen, right: "to take (in een beslissing nemen)"}], status: correct}], feedback: "Collocations are fixed word pairings; a calque breaks them."}
  nl.c1.unit06.lesson03.exercise04.orden_beslissing: {instruction: "Order: We + moeten + een + beslissing + nemen.", accepted_answers: [{value: "We moeten een beslissing nemen", status: correct}], feedback: "The fixed collocation is *een beslissing nemen*."}
  nl.c1.unit06.lesson03.exercise05.vertaal_knie: {instruction: "Translate into Dutch, using the collocation *onder de knie hebben*: \"I still haven't mastered it.\"", accepted_answers: [{value: "Ik heb het nog niet onder de knie", status: correct}, {value: "Ik heb het nog steeds niet onder de knie", status: correct}, {value: "Ik heb het nog altijd niet onder de knie", status: correct}, {value: "Ik heb dat nog niet onder de knie", status: correct}, {value: "Ik heb dat nog steeds niet onder de knie", status: correct}, {value: "Ik heb dat nog altijd niet onder de knie", status: correct}], feedback: "*Nog niet* goes before *onder de knie*: *Ik heb het nog niet onder de knie.* (*dat*, *nog steeds niet* and *nog altijd niet* also work.)"}
  nl.c1.unit06.lesson03.exercise06.spreek_gaten: {instruction: "Say in Dutch, using the collocation *in de gaten houden*: \"I said that I was keeping an eye on it.\"", accepted_answers: [{value: "Ik zei dat ik het goed  in de gaten houd", status: correct}, {value: "Ik zei dat ik het goed  in de gaten hield", status: correct}, {value: "Ik zei dat ik het  in de gaten houd", status: correct}, {value: "Ik zei dat ik het  in de gaten hield", status: correct}, {value: "Ik zei dat ik dat goed  in de gaten houd", status: correct}, {value: "Ik zei dat ik dat goed  in de gaten hield", status: correct}, {value: "Ik zei dat ik dat  in de gaten houd", status: correct}, {value: "Ik zei dat ik dat  in de gaten hield", status: correct}], feedback: "Subordinate clause with the verb last: *Ik zei dat ik het goed in de gaten houd.* (*hield*, *dat*, and leaving out *goed* also work.)"}
  nl.c1.unit06.lesson03.exercise07.schrijf_sprake: {instruction: "Translate into Dutch, using the collocation *ter sprake brengen*: \"I said that he brought that topic up.\"", accepted_answers: [{value: "Ik zei dat hij het onderwerp ter sprake bracht", status: correct}, {value: "Ik zei dat hij het onderwerp ter sprake heeft gebracht", status: correct}, {value: "Ik zei dat hij het onderwerp ter sprake gebracht heeft", status: correct}, {value: "Ik zei dat hij dat onderwerp ter sprake bracht", status: correct}, {value: "Ik zei dat hij dat onderwerp ter sprake heeft gebracht", status: correct}, {value: "Ik zei dat hij dat onderwerp ter sprake gebracht heeft", status: correct}], feedback: "Past tense of *brengen* is *bracht*: *Ik zei dat hij het onderwerp ter sprake bracht.* (*dat onderwerp* and the perfect also work.)"}
  nl.c1.unit06.lesson04.exercise01.lees_mand: {instruction: "What does *Eén lid viel door de mand* mean in the text?", correct_option: "His dishonesty was exposed.", distractors: ["He fell off a chair.", "He climbed into a basket.", "He won the argument."], accepted_answers: [{value: "His dishonesty was exposed.", status: correct}], feedback: "The text says his figures did not add up, so he was exposed."}
  nl.c1.unit06.lesson04.exercise02.lees_bal: {instruction: "What does *de bal ligt bij het bestuur* mean?", correct_option: "The board now has to decide.", distractors: ["The board is playing football.", "The board lost a ball.", "The board is taking a break."], accepted_answers: [{value: "The board now has to decide.", status: correct}], feedback: "The ball is with the board: it is their turn to act."}
  nl.c1.unit06.lesson04.exercise03.koppel_beeldspraak: {instruction: "Match each figurative expression to its meaning.", pairs: [{left: "door de mand vallen", right: "to be exposed (as dishonest)"}, {left: "de bal ligt bij jou", right: "it is your turn to act"}, {left: "iets aan het hart gaan", right: "to care deeply about something"}, {left: "tot een vergelijk komen", right: "to reach an agreement"}, {left: beeldspraak, right: "figurative imagery / metaphor"}, {left: "de toon", right: "the tone (of a text)"}, {left: "het bestuur", right: "the board"}, {left: streng, right: "harsh, strict"}], accepted_answers: [{value: [{left: "door de mand vallen", right: "to be exposed (as dishonest)"}, {left: "de bal ligt bij jou", right: "it is your turn to act"}, {left: "iets aan het hart gaan", right: "to care deeply about something"}, {left: "tot een vergelijk komen", right: "to reach an agreement"}, {left: beeldspraak, right: "figurative imagery / metaphor"}, {left: "de toon", right: "the tone (of a text)"}, {left: "het bestuur", right: "the board"}, {left: streng, right: "harsh, strict"}], status: correct}], feedback: "Each expression is figurative and carries a tone."}
  nl.c1.unit06.lesson04.exercise04.orden_bal: {instruction: "Order: De + bal + ligt + nu + bij + jou.", accepted_answers: [{value: "De bal ligt nu bij jou", status: correct}], feedback: "The idiom means it is your turn to act."}
  nl.c1.unit06.lesson04.exercise05.vertaal_hart: {instruction: "Translate into Dutch, using the idiom *iemand aan het hart gaan* in the past tense: \"I said that topic mattered deeply to me.\"", accepted_answers: [{value: "Ik zei dat dat onderwerp mij aan het hart ging", status: correct}, {value: "Ik zei dat dat onderwerp me aan het hart ging", status: correct}], feedback: "The idiom in a *dat*-clause, past tense: *Ik zei dat dat onderwerp mij aan het hart ging.* (*me* also works.)"}
  nl.c1.unit06.lesson04.exercise06.spreek_mand: {instruction: "Say in Dutch, using the idiom *door de mand vallen* in the simple past: \"Still, he was exposed.\"", accepted_answers: [{value: "Toch viel hij door de mand", status: correct}, {value: "Hij viel toch door de mand", status: correct}], feedback: "A fronted *toch* pushes the verb before the subject: *Toch viel hij door de mand.* (*Hij viel toch door de mand* also works.)"}
  nl.c1.unit06.lesson04.exercise07.schrijf_vergelijk: {instruction: "Translate into Dutch, using the idiom *tot een vergelijk komen*: \"Everyone said that in the end we reached an agreement.\"", accepted_answers: [{value: "Iedereen zei dat we uiteindelijk tot een vergelijk kwamen", status: correct}, {value: "Iedereen zei dat we uiteindelijk tot een vergelijk zijn gekomen", status: correct}, {value: "Iedereen zei dat we uiteindelijk tot een vergelijk gekomen zijn", status: correct}, {value: "Iedereen zei dat wij uiteindelijk tot een vergelijk kwamen", status: correct}, {value: "Iedereen zei dat wij uiteindelijk tot een vergelijk zijn gekomen", status: correct}, {value: "Iedereen zei dat wij uiteindelijk tot een vergelijk gekomen zijn", status: correct}], feedback: "In the *dat*-clause the verb goes last: *Iedereen zei dat we uiteindelijk tot een vergelijk kwamen.* (*wij* and the perfect also work.)"}
  nl.c1.unit06.lesson05.exercise01.herken_pet: {instruction: "What does *Hij gooit er met de pet naar* mean?", correct_option: "He does it carelessly, without effort.", distractors: ["He throws a cap at someone.", "He puts on a cap.", "He loses his cap."], accepted_answers: [{value: "He does it carelessly, without effort.", status: correct}], feedback: "It means doing something half-heartedly."}
  nl.c1.unit06.lesson05.exercise02.herken_bus: {instruction: "What does *Dat klopt als een bus* mean?", correct_option: "That is absolutely correct.", distractors: ["A bus is arriving.", "That is a bus stop.", "The bus is full."], accepted_answers: [{value: "That is absolutely correct.", status: correct}], feedback: "A colloquial way to say something is exactly right."}
  nl.c1.unit06.lesson05.exercise03.koppel_zelf: {instruction: "Match each Dutch idiom to its meaning.", pairs: [{left: "er met de pet naar gooien", right: "to do something carelessly, half-heartedly"}, {left: "dat klopt als een bus", right: "that is absolutely right"}, {left: "zich geen raad weten", right: "to be at a loss"}, {left: combineren, right: "to combine"}, {left: levendig, right: "lively, vivid"}, {left: natuurlijk, right: "natural"}, {left: "een verhaal", right: "a story"}, {left: "de pet", right: "the cap"}], accepted_answers: [{value: [{left: "er met de pet naar gooien", right: "to do something carelessly, half-heartedly"}, {left: "dat klopt als een bus", right: "that is absolutely right"}, {left: "zich geen raad weten", right: "to be at a loss"}, {left: combineren, right: "to combine"}, {left: levendig, right: "lively, vivid"}, {left: natuurlijk, right: "natural"}, {left: "een verhaal", right: "a story"}, {left: "de pet", right: "the cap"}], status: correct}], feedback: "These idioms describe everyday situations."}
  nl.c1.unit06.lesson05.exercise04.orden_bus: {instruction: "Order: Dat + klopt + als + een + bus.", accepted_answers: [{value: "Dat klopt als een bus", status: correct}], feedback: "The idiom means something is exactly right."}
  nl.c1.unit06.lesson05.exercise05.vertaal_pet: {instruction: "Translate with *Hij gooit er met de pet naar*.", accepted_answers: [{value: "Hij gooit er met de pet naar", status: correct}], feedback: "It means doing something carelessly."}
  nl.c1.unit06.lesson05.exercise06.spreek_twee: {instruction: "Say in Dutch, using the idiom *er met de pet naar gooien*: \"I am not going to do it half-heartedly.\"", accepted_answers: [{value: "Ik ga er niet met de pet naar gooien", status: correct}, {value: "Ik gooi er niet met de pet naar", status: correct}], feedback: "Negate the idiom with *niet* before *met de pet*: *Ik ga er niet met de pet naar gooien.* (*Ik gooi er niet met de pet naar* also works.)"}
  nl.c1.unit06.lesson05.exercise07.schrijf_twee: {instruction: "Translate into Dutch, using the idioms *zich geen raad weten* and *er met de pet naar gooien*: \"I am at a loss for a moment, but I am not going to do it half-heartedly.\"", accepted_answers: [{value: "Ik weet me even geen raad, maar ik ga er niet met de pet naar gooien", status: correct}, {value: "Ik weet me even geen raad, maar ik gooi er niet met de pet naar", status: correct}], feedback: "Two idioms in one turn: *Ik weet me even geen raad, maar ik ga er niet met de pet naar gooien.* (*maar ik gooi er niet met de pet naar* also works.)"}
  nl.c1.unit06.lesson06.exercise01.luister_kern: {instruction: "Listen. Which idiom means Omar has mastered his Dutch?", correct_option: "onder de knie hebben", distractors: ["de spijker op de kop slaan", "met de deur in huis vallen", "er met de pet naar gooien"], accepted_answers: [{value: "onder de knie hebben", status: correct}], feedback: "The audio says *Ik heb het eindelijk onder de knie* — to have mastered it."}
  nl.c1.unit06.lesson06.exercise02.herken_handdoek: {instruction: "What does *Hij gooide de handdoek in de ring* mean?", correct_option: "He gave up.", distractors: ["He cleaned the floor.", "He won the fight.", "He started the race."], accepted_answers: [{value: "He gave up.", status: correct}], feedback: "The idiom means to give up."}
  nl.c1.unit06.lesson06.exercise03.koppel_herschrijf: {instruction: "Match each Dutch phrase to its meaning.", pairs: [{left: "iets in de hand werken", right: "to foster, encourage something"}, {left: "de handdoek in de ring gooien", right: "to give up"}, {left: "een beslissing nemen", right: "to make a decision (not maken)"}, {left: "iets onder de knie hebben", right: "to have mastered something"}, {left: "de spijker op de kop slaan", right: "to say exactly the right thing"}, {left: "van een mug een olifant maken", right: "to blow a small matter out of proportion"}, {left: "door de mand vallen", right: "to be exposed (as dishonest)"}, {left: "ter sprake brengen", right: "to bring a topic up"}], accepted_answers: [{value: [{left: "iets in de hand werken", right: "to foster, encourage something"}, {left: "de handdoek in de ring gooien", right: "to give up"}, {left: "een beslissing nemen", right: "to make a decision (not maken)"}, {left: "iets onder de knie hebben", right: "to have mastered something"}, {left: "de spijker op de kop slaan", right: "to say exactly the right thing"}, {left: "van een mug een olifant maken", right: "to blow a small matter out of proportion"}, {left: "door de mand vallen", right: "to be exposed (as dishonest)"}, {left: "ter sprake brengen", right: "to bring a topic up"}], status: correct}], feedback: "This review spans idioms from across the whole unit, not just today's two."}
  nl.c1.unit06.lesson06.exercise04.orden_handdoek: {instruction: "Order: Hij + gooide + de + handdoek + in + de + ring.", accepted_answers: [{value: "Hij gooide de handdoek in de ring", status: correct}], feedback: "The idiom means to give up."}
  nl.c1.unit06.lesson06.exercise05.spreek_kern: {instruction: "Say in Dutch, using the idiom *de handdoek in de ring gooien* in the present tense: \"Now he is giving up.\"", accepted_answers: [{value: "Nu gooit hij de handdoek in de ring", status: correct}, {value: "Hij gooit nu de handdoek in de ring", status: correct}, {value: "Hij gooit de handdoek nu in de ring", status: correct}], feedback: "The idiom in the present tense; the position of *nu* varies: *Nu gooit hij de handdoek in de ring.* (*Hij gooit nu de handdoek in de ring* also works.)"}
  nl.c1.unit06.lesson06.exercise06.schrijf_herschrijf: {instruction: "Translate into natural Dutch, avoiding a literal calque of the English verb: \"We have to make a decision.\"", accepted_answers: [{value: "We moeten een beslissing nemen", status: correct}, {value: "Wij moeten een beslissing nemen", status: correct}, {value: "We moeten een besluit nemen", status: correct}, {value: "We moeten een keuze maken", status: correct}, {value: "Er moet een beslissing genomen worden", status: correct}, {value: "Er moet een beslissing worden genomen", status: correct}], feedback: "The collocation is *een beslissing nemen*, never *een beslissing maken*: *We moeten een beslissing nemen.* (*besluit nemen*, *keuze maken* and the passive also work.)"}
  nl.c1.unit06.lesson06.exercise07.dictaat_kern: {instruction: "Type exactly what you hear.", correct_response: "Ik heb het eindelijk onder de knie", orthography_strict: true, feedback: "The audio contains a single idiom: *onder de knie hebben*."}
