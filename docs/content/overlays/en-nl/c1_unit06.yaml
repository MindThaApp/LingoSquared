  nl.c1.unit06.lesson01.letterlijk_figuurlijk: {title: "Literal or figurative?"}
  nl.c1.unit06.lesson02.idioom_in_gesprek: {title: "Understand idioms in conversation"}
  nl.c1.unit06.lesson03.vaste_verbindingen: {title: "Use fixed collocations"}
