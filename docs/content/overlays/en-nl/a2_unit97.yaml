course:
  title: "Dutch A2"
  description: "Grammar-led A2 Dutch for passing on messages."
  learning_goal: "Pass on what someone said or asked with zegt dat, vraagt of and laat weten."
units:
  nl.a2.unit97.doorgeven_wat_iemand_zegt: {"title": "Passing on what someone says", "description": "Pass on a message with zegt dat, vraagt of and laat weten, in the present tense."}
lessons:
  nl.a2.unit97.lesson01.wat_zegt_hij: {"title": "What does he say?"}
  nl.a2.unit97.lesson02.ze_vraagt_of: {"title": "She asks whether ..."}
  nl.a2.unit97.lesson03.van_ik_naar_hij: {"title": "From I to he"}
  nl.a2.unit97.lesson04.een_bericht_doorgeven: {"title": "Passing on a message"}
  nl.a2.unit97.lesson05.een_briefje_lezen: {"title": "Reading a note"}
  nl.a2.unit97.lesson06.de_collega_belt: {"title": "The colleague calls"}
teaching:
  nl.a2.unit97.lesson01.teach.berichten: {"title": "Messages and notes", "gloss": "the message / the note / the phone / to call", "note": "Het bericht is the general word for a message; het briefje is a short written note.", "example_gloss": ["Noor calls Omar.", "I have a message.", "The note is at home."]}
  nl.a2.unit97.lesson01.teach.tijd: {"title": "When and where", "gloss": "later / today / tomorrow / this evening / at home", "note": "These small words appear in almost every message.", "example_gloss": ["I am coming later.", "Lotte is working today.", "Tomorrow I am at home.", "This evening I have time."]}
  nl.a2.unit97.lesson01.teach.voornaamwoorden: {"title": "Who is speaking", "gloss": "he / she / she / I / you / you", "note": "Ze and zij both mean 'she' here. Je and jij both mean 'you' between friends; jij is the stressed form, je the everyday one.", "example_gloss": ["He is working today.", "She is coming later.", "I am at home."]}
  nl.a2.unit97.lesson01.teach.werkwoorden: {"title": "Verbs for messages", "gloss": "to come / to work / to say / to ask / also / not", "note": "Zeggen and vragen are the two main verbs you need to pass on a message.", "example_gloss": ["I do not work.", "He is coming too."]}
  nl.a2.unit97.lesson01.teach.gn_dat: {"title": "Zeggen with dat", "gloss": "Omar says: 'I am coming later.' Omar says that he is coming later.", "note": "To pass on a statement, use zegt dat. The words of the speaker become a clause after dat, and the verb (the one that agrees with the subject) goes to the end of that clause. The speaker's ik becomes hij or ze."}
  nl.a2.unit97.lesson01.teach.zinnen: {"title": "Two reported statements", "gloss": "Omar says that he is coming later. Noor says that she is working today."}
  nl.a2.unit97.lesson02.teach.werk: {"title": "Work words", "gloss": "the appointment / the meeting / the colleague / the work / time", "note": "Tijd without an article means 'time' in general: Ik heb tijd.", "example_gloss": ["The meeting is today.", "My colleague is working tomorrow.", "I have time."]}
  nl.a2.unit97.lesson02.teach.vraagwoorden: {"title": "Question words", "gloss": "where / when / who / whether / is / has / waits", "note": "Of is used for yes/no questions in reported speech.", "example_gloss": ["Who is the colleague?", "Where is Omar?", "When is Lotte coming?", "Does Noor have time?", "Is Omar working tomorrow?", "Where is Noor waiting?"]}
  nl.a2.unit97.lesson02.teach.gn_of: {"title": "Vragen with of", "gloss": "He asks: 'Does Noor have time?' He asks whether Noor has time.", "note": "A yes/no question becomes of plus a clause with the verb at the end of the clause. The question word order (verb first) disappears."}
  nl.a2.unit97.lesson02.teach.gn_vraagwoord: {"title": "Vragen with waar and wanneer", "gloss": "She asks: 'Where is the meeting?' She asks where the meeting is.", "note": "A question with a question word keeps that word (waar, wanneer) and the verb goes to the end. No extra word like dat or of is added."}
  nl.a2.unit97.lesson02.teach.zinnen: {"title": "Two reported questions", "gloss": "She asks whether Omar has time. He asks where the meeting is."}
  nl.a2.unit97.lesson03.teach.modaal: {"title": "Small words that change", "gloss": "can / want / must / my / his / her", "note": "Zijn can also mean 'to be', but before a noun, as in zijn telefoon, it means 'his'.", "example_gloss": ["I can come.", "I want to work.", "I have to work.", "Her phone is at home.", "My appointment is today."]}
  nl.a2.unit97.lesson03.teach.gn_voornaamwoord: {"title": "Change the pronouns", "gloss": "Omar says: 'I have my phone.' Omar says that he has his phone.", "note": "When you pass a message on, ik becomes hij or ze, and mijn becomes zijn (for a man) or haar (for a woman). The verb changes too: ik heb becomes hij heeft."}
  nl.a2.unit97.lesson03.teach.gn_contrast: {"title": "Direct speech versus passing it on", "gloss": "Omar says: 'I am coming later.' Omar says that he is coming later.", "note": "Direct speech: a colon, the speaker's own words, the verb in second place (ik kom). Passing it on: dat, hij instead of ik, and the verb at the end (hij later komt)."}
  nl.a2.unit97.lesson03.teach.gn_modaal: {"title": "Two verbs at the end", "gloss": "Omar says: 'I cannot come.' Omar says that he cannot come.", "note": "With kan, wil or moet there are two verbs. In the dat-clause both stand at the end, with the modal verb (the finite one) before the infinitive: dat hij niet kan komen."}
  nl.a2.unit97.lesson03.teach.zinnen: {"title": "Two more reported statements", "gloss": "Noor says that her phone is at home. Omar says that he cannot come."}
  nl.a2.unit97.lesson04.teach.doorgeven: {"title": "Passing on", "gloss": "to pass on / to let know / from / there", "note": "Laten weten means 'to let someone know'. In a sentence: Lotte laat weten dat ...", "example_gloss": ["I want to pass on the message.", "There is a message from Noor.", "Lotte lets us know that she is coming."]}
  nl.a2.unit97.lesson04.teach.gn_opening: {"title": "How to start", "gloss": "There is a message from Noor. She says that she is at home this evening.", "note": "Start with Er is een bericht van ... and then pass on the content with zegt dat or vraagt of. After the first sentence you can use hij or ze."}
  nl.a2.unit97.lesson04.teach.gn_laat_weten: {"title": "Laten weten", "gloss": "Noor lets us know that she is coming tomorrow. Omar lets us know whether he has time.", "note": "Laat weten dat is a good way to pass on news in a message. It works like zegt dat: the verb goes to the end. Laat weten of passes on whether something is the case, as in Omar laat weten of hij tijd heeft."}
  nl.a2.unit97.lesson04.teach.zinnen: {"title": "A short pass-on", "gloss": "There is a message from Omar. He lets us know that he is working tomorrow."}
  nl.a2.unit97.lesson05.teach.reading: {"title": "A note from Omar", "gloss": "Hi Lotte, there is a message from Noor. She says that she cannot come this evening, because she has to work. She asks whether you have time tomorrow. A colleague lets us know that the meeting is at nine o'clock.", "note": "Omar passes on two messages in this note: Noor's and a colleague's."}
  nl.a2.unit97.lesson06.teach.d01: {"title": "Omar tells Lotte about the call", "gloss": "Omar: Hi Lotte, the colleague is calling."}
  nl.a2.unit97.lesson06.teach.d02: {"title": "Lotte asks what he says", "gloss": "Lotte: Oh yes? What does he say?"}
  nl.a2.unit97.lesson06.teach.d03: {"title": "Omar passes on the message", "gloss": "Omar: He says that the meeting is tomorrow at nine o'clock."}
  nl.a2.unit97.lesson06.teach.d04: {"title": "Lotte asks about a question", "gloss": "Lotte: Does he also ask whether I have time?"}
  nl.a2.unit97.lesson06.teach.d05: {"title": "Omar confirms", "gloss": "Omar: Yes, he asks whether you have time tomorrow."}
  nl.a2.unit97.lesson06.teach.d06: {"title": "Lotte answers", "gloss": "Lotte: Good, I have time. I will let the colleague know that I am coming."}
exercises:
  nl.a2.unit97.lesson01.ex01.choose_later: {"instruction": "Choose the Dutch sentence that matches.", "correct_option": "Omar zegt dat hij later komt.", "distractors": ["Omar zegt dat hij vandaag werkt.", "Omar zegt dat hij morgen komt.", "Omar zegt dat ik later kom."], "accepted_answers": [{"value": "Omar zegt dat hij later komt.", "status": "correct"}], "feedback": "Omar zegt dat hij later komt = Omar says that he is coming later."}
  nl.a2.unit97.lesson01.ex02.choose_works: {"instruction": "Choose the Dutch sentence that matches.", "correct_option": "Noor zegt dat ze vandaag werkt.", "distractors": ["Noor zegt dat ze morgen werkt.", "Noor zegt dat ze vandaag niet werkt.", "Noor zegt dat ze vandaag werken."], "accepted_answers": [{"value": "Noor zegt dat ze vandaag werkt.", "status": "correct"}], "feedback": "After dat the verb werkt stands at the end: ze vandaag werkt."}
  nl.a2.unit97.lesson01.ex03.match_words: {"instruction": "Match each Dutch word to its English meaning.", "accepted_answers": [{"value": [{"left": "het bericht", "right": "the message"}, {"left": "het briefje", "right": "the note"}, {"left": "de telefoon", "right": "the phone"}, {"left": "later", "right": "later"}, {"left": "vandaag", "right": "today"}, {"left": "morgen", "right": "tomorrow"}, {"left": "vanavond", "right": "this evening"}], "status": "correct"}], "feedback": "These words are the building blocks for messages in this unit."}
  nl.a2.unit97.lesson01.ex04.order_later: {"instruction": "Put the words in order to say 'Omar says that he is coming later.'", "correct_option": "Omar zegt dat hij later komt", "accepted_answers": [{"value": "Omar zegt dat hij later komt", "status": "correct"}], "feedback": "Verb-final after dat: dat hij later komt."}
  nl.a2.unit97.lesson01.ex05.complete_dat: {"instruction": "Complete the sentence with the word that introduces a reported statement.", "correct_option": "dat", "accepted_answers": [{"value": "dat", "status": "correct"}], "feedback": "Dat introduces the reported statement."}
  nl.a2.unit97.lesson01.ex06.translate_morgen: {"instruction": "Translate into Dutch.", "accepted_answers": [{"value": "Lotte zegt dat ze morgen komt.", "status": "correct"}, {"value": "Lotte zegt dat ze morgen komt", "status": "correct"}, {"value": "Lotte zegt dat zij morgen komt.", "status": "correct"}, {"value": "Lotte zegt dat zij morgen komt", "status": "correct"}], "feedback": "Lotte zegt dat ze morgen komt."}
  nl.a2.unit97.lesson01.ex07.write_works: {"instruction": "Write the requested Dutch sentence.", "correct_option": "Omar zegt dat hij vandaag werkt.", "accepted_answers": [{"value": "Omar zegt dat hij vandaag werkt.", "status": "correct"}, {"value": "Omar zegt dat hij vandaag werkt", "status": "correct"}], "feedback": "Omar zegt dat hij vandaag werkt."}
  nl.a2.unit97.lesson02.ex01.choose_of: {"instruction": "Choose the Dutch sentence that matches.", "correct_option": "Ze vraagt of Omar tijd heeft.", "distractors": ["Ze zegt dat Omar tijd heeft.", "Ze vraagt of Omar heeft tijd.", "Ze vraagt wanneer Omar tijd heeft."], "accepted_answers": [{"value": "Ze vraagt of Omar tijd heeft.", "status": "correct"}], "feedback": "Ze vraagt of Omar tijd heeft."}
  nl.a2.unit97.lesson02.ex02.choose_waar: {"instruction": "Choose the Dutch sentence that matches.", "correct_option": "Hij vraagt waar de afspraak is.", "distractors": ["Hij vraagt wanneer de afspraak is.", "Hij zegt waar de afspraak is.", "Hij vraagt waar is de afspraak."], "accepted_answers": [{"value": "Hij vraagt waar de afspraak is.", "status": "correct"}], "feedback": "Waar stays in place and the verb is goes to the end."}
  nl.a2.unit97.lesson02.ex03.match_questions: {"instruction": "Match each direct question to the way Hij vraagt passes it on.", "accepted_answers": [{"value": [{"left": "Waar is de vergadering?", "right": "Hij vraagt waar de vergadering is."}, {"left": "Heeft Noor tijd?", "right": "Hij vraagt of Noor tijd heeft."}, {"left": "Wanneer komt Lotte?", "right": "Hij vraagt wanneer Lotte komt."}, {"left": "Is de afspraak vandaag?", "right": "Hij vraagt of de afspraak vandaag is."}, {"left": "Werkt Omar morgen?", "right": "Hij vraagt of Omar morgen werkt."}, {"left": "Waar wacht Noor?", "right": "Hij vraagt waar Noor wacht."}], "status": "correct"}], "feedback": "A yes/no question gets of; waar and wanneer stay."}
  nl.a2.unit97.lesson02.ex04.order_tijd: {"instruction": "Put the words in order to say 'She asks whether Omar has time.'", "correct_option": "Ze vraagt of Omar tijd heeft", "accepted_answers": [{"value": "Ze vraagt of Omar tijd heeft", "status": "correct"}], "feedback": "Heeft goes to the end after of."}
  nl.a2.unit97.lesson02.ex05.complete_of: {"instruction": "Complete the sentence. The original question is a yes/no question: Is de afspraak vandaag?", "correct_option": "of", "accepted_answers": [{"value": "of", "status": "correct"}], "feedback": "A yes/no question is passed on with of."}
  nl.a2.unit97.lesson02.ex06.translate_thuis: {"instruction": "Translate into Dutch.", "accepted_answers": [{"value": "Hij vraagt of Noor thuis is.", "status": "correct"}, {"value": "Hij vraagt of Noor thuis is", "status": "correct"}], "feedback": "Hij vraagt of Noor thuis is."}
  nl.a2.unit97.lesson02.ex07.write_waar: {"instruction": "Write the requested Dutch sentence.", "correct_option": "Ze vraagt waar de vergadering is.", "accepted_answers": [{"value": "Ze vraagt waar de vergadering is.", "status": "correct"}, {"value": "Ze vraagt waar de vergadering is", "status": "correct"}, {"value": "Zij vraagt waar de vergadering is.", "status": "correct"}, {"value": "Zij vraagt waar de vergadering is", "status": "correct"}], "feedback": "Ze vraagt waar de vergadering is."}
  nl.a2.unit97.lesson03.ex01.choose_report: {"instruction": "Omar talks about himself. Choose the sentence that passes this on to someone else.", "correct_option": "Omar zegt dat hij later komt.", "distractors": ["Omar zegt dat hij komt later.", "Omar zegt dat hij vandaag komt.", "Omar zegt dat ze later komt."], "accepted_answers": [{"value": "Omar zegt dat hij later komt.", "status": "correct"}], "feedback": "Ik becomes hij and the verb moves to the end."}
  nl.a2.unit97.lesson03.ex02.choose_haar: {"instruction": "Noor talks about her own phone. Choose the sentence that passes this on to someone else.", "correct_option": "Noor zegt dat haar telefoon thuis is.", "distractors": ["Noor zegt dat zijn telefoon thuis is.", "Noor zegt dat haar telefoon is thuis.", "Noor zegt dat haar telefoon niet thuis is."], "accepted_answers": [{"value": "Noor zegt dat haar telefoon thuis is.", "status": "correct"}], "feedback": "Noor is a woman, so mijn becomes haar."}
  nl.a2.unit97.lesson03.ex03.match_shift: {"instruction": "Match each direct statement to the way it is passed on.", "accepted_answers": [{"value": [{"left": "Omar zegt: 'Ik werk vandaag.'", "right": "Omar zegt dat hij vandaag werkt."}, {"left": "Noor zegt: 'Ik werk morgen.'", "right": "Noor zegt dat ze morgen werkt."}, {"left": "Lotte zegt: 'Ik ben thuis.'", "right": "Lotte zegt dat ze thuis is."}, {"left": "Omar zegt: 'Ik heb tijd.'", "right": "Omar zegt dat hij tijd heeft."}, {"left": "Noor zegt: 'Mijn telefoon is thuis.'", "right": "Noor zegt dat haar telefoon thuis is."}, {"left": "Omar zegt: 'Mijn afspraak is vandaag.'", "right": "Omar zegt dat zijn afspraak vandaag is."}], "status": "correct"}], "feedback": "Pronouns and verb forms change together."}
  nl.a2.unit97.lesson03.ex04.order_zijn: {"instruction": "Put the words in order to say 'Omar says that his phone is at home.'", "correct_option": "Omar zegt dat zijn telefoon thuis is", "accepted_answers": [{"value": "Omar zegt dat zijn telefoon thuis is", "status": "correct"}], "feedback": "Is goes to the end after dat."}
  nl.a2.unit97.lesson03.ex05.complete_komt: {"instruction": "Complete the second sentence so that it passes on the first one.", "correct_option": "komt", "accepted_answers": [{"value": "komt", "status": "correct"}], "feedback": "Ik kom becomes ze komt, with komt at the end."}
  nl.a2.unit97.lesson03.ex06.translate_haar: {"instruction": "Translate into Dutch.", "accepted_answers": [{"value": "Noor zegt dat haar afspraak vandaag is.", "status": "correct"}, {"value": "Noor zegt dat haar afspraak vandaag is", "status": "correct"}], "feedback": "Noor zegt dat haar afspraak vandaag is."}
  nl.a2.unit97.lesson03.ex07.write_kan_niet: {"instruction": "Pass on Omar's words in Dutch. Start with Omar zegt dat.", "correct_option": "Omar zegt dat hij niet kan komen.", "accepted_answers": [{"value": "Omar zegt dat hij niet kan komen.", "status": "correct"}, {"value": "Omar zegt dat hij niet kan komen", "status": "correct"}], "feedback": "Both verbs stand at the end: dat hij niet kan komen."}
  nl.a2.unit97.lesson04.ex01.choose_bericht: {"instruction": "Noor makes a statement, not a question. Choose the sentence that passes the message on.", "correct_option": "Noor laat weten dat ze vandaag thuis is.", "distractors": ["Noor laat weten of ze vandaag thuis is.", "Noor laat weten dat ze is vandaag thuis.", "Noor laat weten dat ze vandaag thuis zijn."], "accepted_answers": [{"value": "Noor laat weten dat ze vandaag thuis is.", "status": "correct"}], "feedback": "Ik ben becomes ze is, and is goes to the end."}
  nl.a2.unit97.lesson04.ex02.choose_vraagt: {"instruction": "Choose the sentence that passes the question on.", "correct_option": "Omar vraagt wanneer de vergadering is.", "distractors": ["Omar vraagt dat de vergadering is.", "Omar vraagt waar de vergadering is.", "Omar vraagt wanneer is de vergadering."], "accepted_answers": [{"value": "Omar vraagt wanneer de vergadering is.", "status": "correct"}], "feedback": "A question with wanneer stays a question: vraagt wanneer."}
  nl.a2.unit97.lesson04.ex03.match_openers: {"instruction": "Match each Dutch opening to its English meaning.", "accepted_answers": [{"value": [{"left": "zegt dat", "right": "says that"}, {"left": "vraagt of", "right": "asks whether"}, {"left": "vraagt waar", "right": "asks where"}, {"left": "vraagt wanneer", "right": "asks when"}, {"left": "laat weten dat", "right": "lets (us) know that"}, {"left": "vraagt wie", "right": "asks who"}], "status": "correct"}], "feedback": "Choose the opening by what the original message was."}
  nl.a2.unit97.lesson04.ex04.order_laat_weten: {"instruction": "Put the words in order to say 'Lotte lets us know that she is coming later.'", "correct_option": "Lotte laat weten dat ze later komt", "accepted_answers": [{"value": "Lotte laat weten dat ze later komt", "status": "correct"}], "feedback": "Laat weten dat is followed by a clause with the verb at the end."}
  nl.a2.unit97.lesson04.ex05.complete_laat: {"instruction": "Complete the sentence with the correct form of laten.", "correct_option": "laat", "accepted_answers": [{"value": "laat", "status": "correct"}], "feedback": "With Noor (she) the form is laat."}
  nl.a2.unit97.lesson04.ex06.translate_vraagt: {"instruction": "Translate into Dutch.", "accepted_answers": [{"value": "Noor vraagt of Lotte vandaag werkt.", "status": "correct"}, {"value": "Noor vraagt of Lotte vandaag werkt", "status": "correct"}], "feedback": "Noor vraagt of Lotte vandaag werkt."}
  nl.a2.unit97.lesson04.ex07.write_bericht: {"instruction": "Write exactly two Dutch sentences, following the two numbered requirements.", "correct_option": "Er is een bericht van Omar. Hij zegt dat hij morgen werkt.", "accepted_answers": [{"value": "Er is een bericht van Omar. Hij zegt dat hij morgen werkt.", "status": "correct"}, {"value": "Er is een bericht van Omar. Hij zegt dat hij morgen werkt", "status": "correct"}], "feedback": "Open with Er is een bericht van ... and then pass the content on."}
  nl.a2.unit97.lesson05.ex01.read_why: {"instruction": "Read Omar's note. Choose the answer.", "correct_option": "She has to work.", "distractors": ["She is at home.", "She has a meeting at nine.", "She has no phone."], "accepted_answers": [{"value": "She has to work.", "status": "correct"}], "feedback": "Noor zegt dat ze vanavond niet kan komen, want ze moet werken."}
  nl.a2.unit97.lesson05.ex02.read_ask: {"instruction": "Read Omar's note. Choose the answer.", "correct_option": "Whether Lotte has time tomorrow.", "distractors": ["Where the meeting is.", "When the meeting is.", "Whether Lotte is at home."], "accepted_answers": [{"value": "Whether Lotte has time tomorrow.", "status": "correct"}], "feedback": "Ze vraagt of jij morgen tijd hebt."}
  nl.a2.unit97.lesson05.ex03.match_reading: {"instruction": "Match each phrase from the note to its English meaning.", "accepted_answers": [{"value": [{"left": "ze moet werken", "right": "she has to work"}, {"left": "niet kan komen", "right": "cannot come"}, {"left": "of jij morgen tijd hebt", "right": "whether you have time tomorrow"}, {"left": "om negen uur", "right": "at nine o'clock"}, {"left": "een collega", "right": "a colleague"}, {"left": "want", "right": "because"}], "status": "correct"}], "feedback": "These phrases carry the content of the two messages."}
  nl.a2.unit97.lesson05.ex04.order_moet: {"instruction": "Put the words in order to say 'She says that she has to work.'", "correct_option": "Ze zegt dat ze moet werken", "accepted_answers": [{"value": "Ze zegt dat ze moet werken", "status": "correct"}], "feedback": "Moet and werken both stand at the end."}
  nl.a2.unit97.lesson05.ex05.translate_noor: {"instruction": "Translate into Dutch.", "accepted_answers": [{"value": "Noor zegt dat ze vanavond niet kan komen.", "status": "correct"}, {"value": "Noor zegt dat ze vanavond niet kan komen", "status": "correct"}, {"value": "Noor zegt dat zij vanavond niet kan komen.", "status": "correct"}, {"value": "Noor zegt dat zij vanavond niet kan komen", "status": "correct"}], "feedback": "Noor zegt dat ze vanavond niet kan komen."}
  nl.a2.unit97.lesson05.ex06.dictation_vergadering: {"instruction": "Type what you hear.", "correct_response": "Een collega laat weten dat de vergadering om negen uur is.", "orthography_strict": true, "feedback": "You heard: Een collega laat weten dat de vergadering om negen uur is."}
  nl.a2.unit97.lesson05.ex07.dictation_tijd: {"instruction": "Type what you hear.", "correct_response": "Ze vraagt of jij morgen tijd hebt.", "orthography_strict": true, "feedback": "You heard: Ze vraagt of jij morgen tijd hebt."}
  nl.a2.unit97.lesson06.ex01.listen_opening: {"instruction": "Listen and select Omar's first line.", "correct_option": "Hoi Lotte, de collega belt.", "distractors": ["Hoi Lotte, Noor belt.", "Hoi Lotte, de collega komt.", "Hoi Omar, de collega belt."], "accepted_answers": [{"value": "Hoi Lotte, de collega belt.", "status": "correct"}], "feedback": "Omar says: Hoi Lotte, de collega belt."}
  nl.a2.unit97.lesson06.ex02.comprehend_meeting: {"instruction": "Listen to the dialogue. Choose the answer.", "correct_option": "The meeting is tomorrow at nine o'clock.", "distractors": ["The meeting is today at nine o'clock.", "He cannot come tomorrow.", "He is late for the meeting."], "accepted_answers": [{"value": "The meeting is tomorrow at nine o'clock.", "status": "correct"}], "feedback": "Omar says: Hij zegt dat de vergadering morgen om negen uur is."}
  nl.a2.unit97.lesson06.ex03.match_dialogue: {"instruction": "Match each Dutch phrase from the dialogue to what it means or does in the call.", "accepted_answers": [{"value": [{"left": "Wat zegt hij?", "right": "Lotte asks what the colleague says"}, {"left": "hij zegt dat de vergadering morgen om negen uur is", "right": "the colleague says the meeting is tomorrow at nine"}, {"left": "hij vraagt of je morgen tijd hebt", "right": "the colleague asks whether Lotte has time tomorrow"}, {"left": "Hoi Lotte", "right": "Omar greets Lotte"}, {"left": "Ik heb tijd.", "right": "Lotte says she has time"}, {"left": "Ik laat de collega weten dat ik kom", "right": "Lotte will let the colleague know she is coming"}], "status": "correct"}], "feedback": "Each phrase has its own job in the call."}
  nl.a2.unit97.lesson06.ex04.order_vergadering: {"instruction": "Put the words in order to say 'He says that the meeting is tomorrow at nine o'clock.'", "correct_option": "Hij zegt dat de vergadering morgen om negen uur is", "accepted_answers": [{"value": "Hij zegt dat de vergadering morgen om negen uur is", "status": "correct"}, {"value": "Hij zegt dat morgen de vergadering om negen uur is", "status": "correct"}], "feedback": "Is goes to the end after dat."}
  nl.a2.unit97.lesson06.ex05.respond_wat_zegt: {"instruction": "Answer in Dutch with zegt dat: say that the meeting is tomorrow at nine o'clock.", "correct_option": "Hij zegt dat de vergadering morgen om negen uur is.", "accepted_answers": [{"value": "Hij zegt dat de vergadering morgen om negen uur is.", "status": "correct"}, {"value": "Hij zegt dat de vergadering morgen om negen uur is", "status": "correct"}, {"value": "Hij zegt dat morgen de vergadering om negen uur is.", "status": "correct"}, {"value": "Hij zegt dat morgen de vergadering om negen uur is", "status": "correct"}, {"value": "Hij zegt dat de vergadering morgen om 9 uur is.", "status": "correct"}, {"value": "Hij zegt dat de vergadering morgen om 9 uur is", "status": "correct"}], "feedback": "Hij zegt dat de vergadering morgen om negen uur is."}
  nl.a2.unit97.lesson06.ex06.translate_ik_tijd: {"instruction": "Translate into Dutch.", "accepted_answers": [{"value": "Hij vraagt of ik morgen tijd heb.", "status": "correct"}, {"value": "Hij vraagt of ik morgen tijd heb", "status": "correct"}], "feedback": "Hij vraagt of ik morgen tijd heb."}
  nl.a2.unit97.lesson06.ex07.write_twee: {"instruction": "Pass on Omar's message in exactly two Dutch sentences, following the two numbered requirements.", "correct_option": "Omar zegt dat hij vandaag werkt. Hij vraagt of Noor tijd heeft.", "accepted_answers": [{"value": "Omar zegt dat hij vandaag werkt. Hij vraagt of Noor tijd heeft.", "status": "correct"}, {"value": "Omar zegt dat hij vandaag werkt. Hij vraagt of Noor tijd heeft", "status": "correct"}], "feedback": "Statement: zegt dat; yes/no question: vraagt of. Both verbs go to the end."}
