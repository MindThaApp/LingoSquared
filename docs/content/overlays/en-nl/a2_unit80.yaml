teaching:
  nl.a2.unit80.lesson01.teach.verzetten: {"title": "Changing an appointment", "gloss": "to move (an appointment) / to cancel", "note": "*Een afspraak verzetten* means to move it to another time. *Annuleren* means to cancel it completely.", "example_gloss": ["I want to move my appointment.", "I have to cancel my appointment."]}
  nl.a2.unit80.lesson01.teach.helaas_sorry: {"title": "Saying you are sorry", "gloss": "unfortunately / sorry", "note": "*Helaas* is a polite way to give bad news. *Sorry* is the everyday apology.", "example_gloss": ["Unfortunately I cannot come.", "Sorry, I am too late."]}
  nl.a2.unit80.lesson01.teach.kapsalon: {"title": "The hairdresser's", "gloss": "the hairdresser's (salon)", "note": "*Het kapsalon* is the place; *de kapper* is the person. People often say *naar de kapper* for both.", "example_gloss": "The salon is open from nine to six."}
  nl.a2.unit80.lesson01.teach.kan_verzetten: {"title": "Asking to move an appointment", "gloss": "Can I move my appointment?", "note": "A yes/no question starts with the verb: *Kan ik ...?* The infinitive *verzetten* goes at the end."}
  nl.a2.unit80.lesson01.teach.helaas_niet_komen: {"title": "Saying you cannot come", "gloss": "Unfortunately I cannot come."}
  nl.a2.unit80.lesson01.teach.gn_kan: {"title": "Kan + infinitive", "gloss": "I cannot come on Thursday. Can I move the appointment?", "note": "After *kan* the second verb is an infinitive at the end of the sentence. In a statement, *niet* goes before that infinitive: *Ik kan donderdag niet komen*. A time word like *donderdag* comes before *niet*. In a question, *kan* comes first: *Kan ik de afspraak verzetten?*"}
  nl.a2.unit80.lesson02.teach.andere_dag: {"title": "Another day", "gloss": "another day", "note": "*Andere* ends in -e after *een* here because *dag* is a de-word.", "example_gloss": "Can it also be on another day?"}
  nl.a2.unit80.lesson02.teach.kan_ook_maandag: {"title": "Suggesting a day", "gloss": "Can it also be Monday?", "note": "Dutch needs no preposition before a weekday here: *maandag*, not *op maandag*."}
  nl.a2.unit80.lesson02.teach.komt_uit: {"title": "Does it suit you?", "gloss": "Does Friday suit you? (formal)", "note": "*Uitkomen* means 'to suit'. It is a separable verb, so *uit* goes to the end: *Komt vrijdag u uit?* The polite *u* is used with someone you do not know well."}
  nl.a2.unit80.lesson02.teach.komt_goed_uit: {"title": "Saying yes", "gloss": "Yes, that suits me well."}
  nl.a2.unit80.lesson02.teach.helaas_niet: {"title": "Saying no politely", "gloss": "Unfortunately not."}
  nl.a2.unit80.lesson02.teach.gn_uitkomen: {"title": "Does it suit you?", "gloss": "Does Friday suit you? Yes, that suits me well. No, unfortunately not.", "note": "*Uitkomen* is a separable verb: in the present tense, *uit* moves to the end of the sentence. The question starts with the verb: *Komt vrijdag u uit?* The answer *Ja, dat komt goed uit* confirms. A polite refusal is *Nee, helaas niet*."}
  nl.a2.unit80.lesson03.teach.want: {"title": "Because and I am sorry", "gloss": "because / I am sorry", "note": "*Want* joins two full sentences and gives the reason. *Het spijt me* is a more careful apology than *sorry*.", "example_gloss": ["I cannot come, because I am ill.", "I am sorry."]}
  nl.a2.unit80.lesson03.teach.ongemak: {"title": "Inconvenience", "gloss": "the inconvenience", "note": "*Sorry voor het ongemak* is a polite phrase after you have caused someone extra trouble.", "example_gloss": "Sorry for the inconvenience."}
  nl.a2.unit80.lesson03.teach.werken: {"title": "Reason: work", "gloss": "I cannot come, because I have to work."}
  nl.a2.unit80.lesson03.teach.andere_afspraak: {"title": "Reason: another appointment", "gloss": "I cannot come, because I have another appointment."}
  nl.a2.unit80.lesson03.teach.gn_want: {"title": "Because: want", "gloss": "I cannot come, because I am ill.", "note": "After *want* the word order is the ordinary one: subject, then verb. Put a comma before *want*: *Ik kan niet komen, want ik ben ziek.* Compare *omdat*, which sends the verb to the end; here, use *want*."}
  nl.a2.unit80.lesson04.teach.afspreken: {"title": "Agreeing and in advance", "gloss": "to arrange / in advance", "note": "*Afspreken* is to agree on a time or place together. *Van tevoren* means 'beforehand', 'in advance'.", "example_gloss": ["Shall we arrange something?", "Call a day in advance."]}
  nl.a2.unit80.lesson04.teach.maandag_tien: {"title": "Accepting a time", "gloss": "Monday at ten o'clock is fine."}
  nl.a2.unit80.lesson04.teach.kunt_u: {"title": "Asking if a time works", "gloss": "Can you come on Monday at ten o'clock? (formal)", "note": "*Kunt u* is the polite form of *kun je*. The infinitive *komen* is at the end."}
  nl.a2.unit80.lesson04.teach.zie_u_maandag: {"title": "Closing the arrangement", "gloss": "Then I will see you on Monday."}
  nl.a2.unit80.lesson04.teach.nieuwe_afspraak: {"title": "Making a new appointment", "gloss": "Then I will make a new appointment."}
  nl.a2.unit80.lesson04.teach.gn_tijd: {"title": "Day first, then time", "gloss": "Monday at ten o'clock is fine. Can you come on Monday at ten o'clock?", "note": "When you give a day and a time, the day comes first and then *om* + the time: *maandag om tien uur*. In a polite question use *Kunt u ...?* and put the infinitive at the end."}
  nl.a2.unit80.lesson05.teach.kapsalon_bericht: {"title": "A message from the salon", "gloss": "Dear Omar, your appointment has been moved. Your new appointment is Monday at ten o'clock. Does this not suit you? Then call us a day in advance. Then we will make a new appointment. See you Monday! Kapsalon Jansen", "note": "This is a typical short message from a business, so it uses the polite *u* and *uw*. *Is verzet* means 'has been moved'.", "glosses": {"beste": "dear", "omar": "Omar", "uw": "your (formal)", "afspraak": "appointment", "verzet": "moved", "nieuwe": "new", "maandag": "Monday", "tien": "ten", "uur": "o'clock", "komt": "suits (komt ... uit)", "dit": "this", "niet": "not", "uit": "(part of komt ... uit)", "bel": "call", "ons": "us", "dan": "then", "tevoren": "in advance", "maken": "make", "we": "we", "tot": "until, see you", "kapsalon": "hairdresser's", "jansen": "Jansen"}}
  nl.a2.unit80.lesson06.teach.kapper_opening: {"title": "The salon answers", "gloss": "Hairdresser: Kapsalon Jansen, good afternoon."}
  nl.a2.unit80.lesson06.teach.omar_vraagt: {"title": "Omar explains and asks", "gloss": "Omar: Good afternoon, you are speaking to Omar. I have an appointment on Thursday, but unfortunately I cannot come. Can I move the appointment?"}
  nl.a2.unit80.lesson06.teach.kapper_vrijdag: {"title": "The hairdresser suggests Friday", "gloss": "Hairdresser: Of course. Does Friday suit you?"}
  nl.a2.unit80.lesson06.teach.omar_maandag: {"title": "Omar suggests Monday", "gloss": "Omar: Unfortunately not, because I have to work. Can it also be Monday?"}
  nl.a2.unit80.lesson06.teach.kapper_tien: {"title": "The hairdresser agrees", "gloss": "Hairdresser: Monday at ten o'clock is fine."}
  nl.a2.unit80.lesson06.teach.omar_dank: {"title": "Omar accepts and apologises", "gloss": "Omar: That suits me well. Thank you very much and sorry for the inconvenience."}
  nl.a2.unit80.lesson06.teach.kapper_einde: {"title": "The hairdresser closes", "gloss": "Hairdresser: No problem. See you Monday!"}

