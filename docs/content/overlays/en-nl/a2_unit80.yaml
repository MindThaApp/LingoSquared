  nl.a2.unit80.lesson05.exercise06.dictation_moved: {"instruction": "Type what you hear.", "correct_response": "Uw afspraak is verzet", "orthography_strict": true, "feedback": "You heard *Uw afspraak is verzet* — Your appointment has been moved."}
  nl.a2.unit80.lesson05.exercise07.dictation_call: {"instruction": "Type what you hear.", "correct_response": "Bel ons dan een dag van tevoren", "orthography_strict": true, "feedback": "You heard *Bel ons dan een dag van tevoren* — Then call us a day in advance."}
  nl.a2.unit80.lesson06.exercise01.listen_opening: {"instruction": "Listen and select what you hear.", "correct_option": "Kapsalon Jansen, goedemiddag.", "distractors": ["Kapsalon Jansen, goedemorgen.", "Kapsalon Jansen, goedenavond.", "Kapsalon Peters, goedemiddag."], "accepted_answers": [{"value": "Kapsalon Jansen, goedemiddag.", "status": "correct"}], "feedback": "*Kapsalon Jansen, goedemiddag* = Jansen hairdresser's, good afternoon."}
  nl.a2.unit80.lesson06.exercise02.comprehend_why_friday: {"instruction": "Listen to the dialogue. Why does Friday not suit Omar?", "correct_option": "He has to work", "distractors": ["He is ill", "He has another appointment", "The salon is closed"], "accepted_answers": [{"value": "He has to work", "status": "correct"}], "feedback": "*Helaas niet, want ik moet werken* = Unfortunately not, because I have to work."}
  nl.a2.unit80.lesson06.exercise03.comprehend_new_time: {"instruction": "When is the new appointment?", "correct_option": "Monday at ten o'clock", "distractors": ["Friday at ten o'clock", "Monday at nine o'clock", "Thursday at ten o'clock"], "accepted_answers": [{"value": "Monday at ten o'clock", "status": "correct"}], "feedback": "*Maandag om tien uur is goed* = Monday at ten o'clock is fine."}
  nl.a2.unit80.lesson06.exercise04.comprehend_first_offer: {"instruction": "Which day does the hairdresser offer first?", "correct_option": "Friday", "distractors": ["Monday", "Tuesday", "Thursday"], "accepted_answers": [{"value": "Friday", "status": "correct"}], "feedback": "*Komt vrijdag u uit?* = Does Friday suit you?"}
  nl.a2.unit80.lesson06.exercise05.order_move_appointment: {"instruction": "Put the words in order to ask 'Can I move the appointment?'", "correct_option": "Kan ik de afspraak verzetten", "accepted_answers": [{"value": "Kan ik de afspraak verzetten", "status": "correct"}], "feedback": "*Kan ik de afspraak verzetten?* = Can I move the appointment?"}
  nl.a2.unit80.lesson06.exercise06.respond_friday_no: {"instruction": "Answer in Dutch: say unfortunately not, because you have to work.", "accepted_answers": [{"value": "Helaas niet, want ik moet werken.", "status": "correct"}, {"value": "Helaas niet want ik moet werken.", "status": "correct"}, {"value": "Helaas niet, want ik moet werken", "status": "correct"}, {"value": "Helaas niet want ik moet werken", "status": "correct"}, {"value": "Nee, helaas niet, want ik moet werken.", "status": "correct"}, {"value": "Nee helaas niet want ik moet werken.", "status": "correct"}, {"value": "Nee, helaas niet, want ik moet werken", "status": "correct"}, {"value": "Nee helaas niet want ik moet werken", "status": "correct"}], "feedback": "*Helaas niet, want ik moet werken* = Unfortunately not, because I have to work.", "correct_option": "Helaas niet, want ik moet werken."}
  nl.a2.unit80.lesson06.exercise07.respond_monday_ok: {"instruction": "Answer in Dutch: say that this suits you well.", "accepted_answers": [{"value": "Dat komt goed uit.", "status": "correct"}, {"value": "Dat komt goed uit", "status": "correct"}, {"value": "Ja, dat komt goed uit.", "status": "correct"}, {"value": "Ja dat komt goed uit.", "status": "correct"}, {"value": "Ja, dat komt goed uit", "status": "correct"}, {"value": "Ja dat komt goed uit", "status": "correct"}], "feedback": "*Dat komt goed uit* = That suits me well.", "correct_option": "Dat komt goed uit."}
  nl.a2.unit80.lesson06.exercise08.write_move: {"instruction": "Write two short Dutch sentences: you cannot come on Thursday; ask whether you can move the appointment. Use kan.", "accepted_answers": [{"value": "Ik kan donderdag niet komen. Kan ik de afspraak verzetten.", "status": "correct"}, {"value": "Ik kan donderdag niet komen. Kan ik de afspraak verzetten", "status": "correct"}, {"value": "Ik kan donderdag niet komen. Kan ik mijn afspraak verzetten.", "status": "correct"}, {"value": "Ik kan donderdag niet komen. Kan ik mijn afspraak verzetten", "status": "correct"}, {"value": "Ik kan helaas donderdag niet komen. Kan ik de afspraak verzetten.", "status": "correct"}, {"value": "Ik kan helaas donderdag niet komen. Kan ik de afspraak verzetten", "status": "correct"}, {"value": "Donderdag kan ik niet komen. Kan ik de afspraak verzetten.", "status": "correct"}, {"value": "Donderdag kan ik niet komen. Kan ik de afspraak verzetten", "status": "correct"}], "feedback": "*Ik kan donderdag niet komen. Kan ik de afspraak verzetten?* = I cannot come on Thursday. Can I move the appointment?"}
