  nl.a2.unit80.lesson05.exercise04.listen_new: {"instruction": "Listen and select what you hear.", "correct_option": "Uw nieuwe afspraak is maandag om tien uur.", "distractors": ["Uw nieuwe afspraak is dinsdag om tien uur.", "Uw nieuwe afspraak is maandag om negen uur.", "Uw afspraak is maandag om tien uur."], "accepted_answers": [{"value": "Uw nieuwe afspraak is maandag om tien uur.", "status": "correct"}], "feedback": "*Uw nieuwe afspraak is maandag om tien uur* = Your new appointment is Monday at ten o'clock."}
