course:
  title: "Dutch A1"
  description: "Beginner Dutch for talking about pets and common animals: naming them, basic care (walking, feeding, playing), saying what animals you love even without owning one, and the regular Dutch plural."

units:
  nl.a1.unit31.animals: {title: "Animals and pets"}

lessons:
  nl.a1.unit31.lesson01.huisdieren_woorden: {title: "Dog, cat, fish, and bird"}
  nl.a1.unit31.lesson02.zorg_voor_huisdieren: {title: "Caring for a pet"}
  nl.a1.unit31.lesson03.van_dieren_houden: {title: "Loving animals"}
  nl.a1.unit31.lesson04.taalcafe_lottes_hond: {title: "Omar asks about Lotte's dog"}
  nl.a1.unit31.lesson05.omar_fenna_sander_dieren: {title: "Omar, Fenna, and Sander on animals"}
  nl.a1.unit31.lesson06.taalcafe_ninas_vogel: {title: "Nina's bird"}

teaching:
  nl.a1.unit31.lesson01.teach.dier_huisdier: {title: "Animal, a pet", gloss: "the animal / a pet", note: "*Dier* is the general word for animal; *huisdier* (literally 'house-animal') means specifically a pet.", example_gloss: ["A dog is an animal.", "A dog is also a pet."]}
  nl.a1.unit31.lesson01.teach.hond_kat: {title: "Dog and cat", gloss: "the dog / the cat", example_gloss: ["Lotte has a dog.", "Sander has a cat."]}
  nl.a1.unit31.lesson01.teach.vis_vogel: {title: "Fish and bird", gloss: "the fish / the bird", example_gloss: ["Grandpa has a fish.", "Nina has a bird."]}
  nl.a1.unit31.lesson01.teach.heb_je_huisdier: {title: "Do you have a pet?", gloss: "Do you have a pet?", note: "The same *Heb je ...?* question pattern you already know from earlier units."}
  nl.a1.unit31.lesson01.teach.antwoord_ja: {title: "Yes, I have a dog", gloss: "Yes, I have a dog.", note: "A simple affirmative answer using this unit's new vocabulary."}
  nl.a1.unit31.lesson01.teach.antwoord_nee_geen: {title: "No, I don't have a pet", gloss: "No, I don't have a pet.", note: "*Geen* negates the indefinite noun *een huisdier* -- see the grammar note."}
  nl.a1.unit31.lesson01.teach.geen_note: {title: "Geen: negating an indefinite noun", gloss: "Geen negates an indefinite noun, as in Ik heb geen tijd (which you already know) and here Ik heb geen huisdier.", note: "Reuses the exact *geen* pattern already taught for *Ik heb geen tijd* -- not new grammar, just a new noun to apply it to."}

  nl.a1.unit31.lesson02.teach.uitlaten: {title: "To walk (an animal)", gloss: "to walk (an animal)", note: "A separable verb -- see the grammar note.", example_gloss: "I walk the dog every day."}
  nl.a1.unit31.lesson02.teach.separable_note: {title: "Uitlaten is separable", gloss: "Uitlaten is separable, just like opstaan and aankleden from an earlier lesson: ik laat de hond uit.", note: "Reuses the exact separable-verb pattern (stem + ... + prefix at the end) already taught for daily-routine verbs."}
  nl.a1.unit31.lesson02.teach.eten_geven: {title: "To feed", gloss: "to feed", example_gloss: "I feed the cat every day."}
  nl.a1.unit31.lesson02.teach.spelen_met: {title: "To play with", gloss: "to play with", example_gloss: "Sander plays with his cat."}
  nl.a1.unit31.lesson02.teach.uitlaten_phrase: {title: "I walk the dog every day", gloss: "I walk the dog every day.", note: "Combines *uitlaten* with *elke dag* (every day), already known from an earlier unit."}
  nl.a1.unit31.lesson02.teach.eten_phrase: {title: "I feed the cat every day", gloss: "I feed the cat every day.", note: "Combines *eten geven* with *elke dag*."}

  nl.a1.unit31.lesson03.teach.meervoud_note: {title: "Plural: hond -> honden", gloss: "Plural with -en: hond -> honden, dier -> dieren. With a short vowel, the consonant doubles: kat -> katten.", note: "The regular Dutch plural pattern, introduced here for the first time with animal nouns as the example set."}
  nl.a1.unit31.lesson03.teach.honden_katten: {title: "Dogs and cats", gloss: "dogs / cats", example_gloss: ["Omar loves dogs.", "Fenna loves cats."]}
  nl.a1.unit31.lesson03.teach.vissen_vogels: {title: "Fish and birds (plural)", gloss: "fish (plural) / birds", example_gloss: ["I love fish.", "Grandpa loves birds."]}
  nl.a1.unit31.lesson03.teach.ik_houd_van_dieren: {title: "I love animals", gloss: "I love animals.", note: "Reuses *houden van* from an earlier unit's preferences lesson, now applied to animals."}
  nl.a1.unit31.lesson03.teach.fenna_katten_geen: {title: "Fenna loves cats, but has no pet", gloss: "Fenna loves cats, but she doesn't have a pet.", note: "Sets up the contrast lesson05's reading is built around."}

  nl.a1.unit31.lesson04.teach.omar_vraagt_huisdier: {title: "Omar asks about a pet", gloss: "Omar: Do you have a pet, Lotte?"}
  nl.a1.unit31.lesson04.teach.lotte_ja_hond: {title: "Lotte has a dog", gloss: "Lotte: Yes, I have a dog."}
  nl.a1.unit31.lesson04.teach.omar_hoe_ziet_eruit: {title: "Omar asks what it looks like", gloss: "Omar: What does he look like?", note: "Reuses the *Hoe ziet ... eruit?* question from an earlier appearance-focused unit, now asked about an animal."}
  nl.a1.unit31.lesson04.teach.lotte_beschrijft: {title: "Lotte describes her dog", gloss: "Lotte: He has brown hair and he's small.", note: "Reuses hair-color and size vocabulary from the appearance unit, now describing an animal's fur instead of a person's hair."}
  nl.a1.unit31.lesson04.teach.pronoun_note: {title: "Hij/hem for animals", gloss: "Hij (he) and hem (him) can also be used for an animal, not only for a person.", note: "Every earlier use of hij/hem in this course referred to a person -- this flags the extension to animals explicitly."}
  nl.a1.unit31.lesson04.teach.omar_laat_je_uit: {title: "Omar asks about walks", gloss: "Omar: Do you walk him every day?"}
  nl.a1.unit31.lesson04.teach.lotte_ja_zorg: {title: "Lotte describes her routine", gloss: "Lotte: Yes, I walk him every day and I feed him."}

  nl.a1.unit31.lesson05.teach.tekst:
    title: "Omar, Fenna, and Sander on animals"
    gloss: "Omar and Fenna both love animals, but neither of them has a pet. Omar loves dogs and Fenna loves cats. Sander does have a pet: a cat. He often plays with his cat and feeds the cat every day. Do you have a pet?"
    note: "Contrasts loving an animal with actually owning one -- the outcome's own communicative point."
    glosses:
      houden: "love"
      allebei: "both"
      dieren: "animals"
      beiden: "both"
      huisdier: "pet"
      honden: "dogs"
      katten: "cats"
      kat: "cat"
      speelt: "plays"
      geeft: "gives"
      elke: "every"
      eten: "food"
  nl.a1.unit31.lesson05.teach.sander_speelt: {title: "Sander often plays with his cat", gloss: "Sander often plays with his cat.", note: "Reuses *vaak* (often), already established for Omar's routines in an earlier unit."}
  nl.a1.unit31.lesson05.teach.ik_houd_geen: {title: "I love dogs. I don't have a pet.", gloss: "I love dogs. I don't have a pet.", note: "A model two-sentence answer, ready to reuse for the unit's writing prompt."}

  nl.a1.unit31.lesson06.teach.lotte_vraagt_nina: {title: "Lotte asks Nina", gloss: "Lotte: Nina, do you have a pet too?"}
  nl.a1.unit31.lesson06.teach.nina_ja_vogel: {title: "Nina has a bird named Pico", gloss: "Nina: Yes, I have a bird. His name is Pico.", note: "*Heet* (is named) reuses the introduction verb from the very first unit."}
  nl.a1.unit31.lesson06.teach.omar_wat_leuk: {title: "Omar reacts", gloss: "Omar: How nice! What do you do with him every day?"}
  nl.a1.unit31.lesson06.teach.nina_geeft_eten: {title: "Nina feeds him every day", gloss: "Nina: I feed him every day."}
  nl.a1.unit31.lesson06.teach.omar_houd_ook: {title: "Omar loves birds too", gloss: "Omar: I love birds too."}
  nl.a1.unit31.lesson06.teach.lotte_afsluiting: {title: "Lotte closes the conversation", gloss: "Lotte: Nice that the three of us love animals!", note: "Closes the loop across all three characters' animal facts from this unit."}

