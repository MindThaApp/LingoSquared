course:
  title: "Dutch A2"
  description: "Grammar-led A2 Dutch for reading, hearing and retelling a short story."
  learning_goal: "Read or hear a short story in the imperfectum and retell it in order with sequence words and the voltooid tegenwoordige tijd."
units:
  nl.a2.unit108.een_kort_verhaal: {"title": "A short story", "description": "Read or hear a short story about a day out and retell it in order."}
lessons:
  nl.a2.unit108.lesson01.eerst_daarna_toen: {"title": "First, then, next"}
  nl.a2.unit108.lesson02.verhaal_in_het_imperfectum: {"title": "Telling the story"}
  nl.a2.unit108.lesson03.opschrijven_of_vertellen: {"title": "Writing or telling"}
  nl.a2.unit108.lesson04.een_boottocht: {"title": "A boat tour"}
  nl.a2.unit108.lesson05.een_dag_in_het_pretpark: {"title": "A day at the amusement park"}
  nl.a2.unit108.lesson06.vertel_eens: {"title": "Tell me!"}
teaching:
  nl.a2.unit108.lesson01.teach.uitjes: {"title": "Days out", "gloss": "the zoo / the boat tour / the amusement park / the roller coaster", "note": "These are the outings in this unit.", "example_gloss": ["We are going to the zoo.", "The boat tour is fun.", "Lotte likes the roller coaster."]}
  nl.a2.unit108.lesson01.teach.dieren: {"title": "Zoo animals", "gloss": "the monkey / the elephant / the lion / the penguin", "note": "Plurals: *apen, olifanten, leeuwen, pinguïns*.", "example_gloss": ["The monkeys are funny.", "The elephants are big.", "The lions are sleeping."]}
  nl.a2.unit108.lesson01.teach.dingen: {"title": "Things on a day out", "gloss": "the photo / the ice cream / the boat / the canal", "note": "Small things that come back in the stories.", "example_gloss": ["Noor takes a photo.", "Omar eats an ice cream.", "The boat sails through the canal."]}
  nl.a2.unit108.lesson01.teach.volgorde_woorden: {"title": "Words for the order of events", "gloss": "first / after that / then / next / later / in the end", "note": "They put the events of a story in order. In a story, *toen* means 'then'. This is not the same as *toen* meaning 'when'.", "example_gloss": ["First we buy tickets.", "After that we eat an ice cream.", "In the end we go home."]}
  nl.a2.unit108.lesson01.teach.gn_volgorde: {"title": "Sequence word first, then the verb", "gloss": "First we went to the zoo. After that we saw the monkeys.", "note": "When a sequence word opens the sentence, the verb comes next and the subject after it: *Eerst gingen we*, *Daarna zagen we*. You can also put the sequence word later: *We gingen eerst naar de dierentuin*."}
  nl.a2.unit108.lesson01.teach.verhaal: {"title": "A short story in order", "gloss": "First Lotte, Omar and Noor went to the zoo. After that they saw the monkeys. Then they ate an ice cream. In the end they took the bus home."}
  nl.a2.unit108.lesson02.teach.dingen2: {"title": "At the entrance", "gloss": "the ticket / the coffee / the queue", "note": "Plural: *kaartjes*.", "example_gloss": ["I have a ticket.", "Omar drinks coffee.", "The queue is long."]}
  nl.a2.unit108.lesson02.teach.werkwoorden: {"title": "Verbs for a day out", "gloss": "to go / to see / to eat / to take / to walk / to drink / to buy / to make / to wait / to laugh", "note": "The next two cards give the imperfectum forms.", "example_gloss": ["We go to the zoo.", "I see the lions.", "Noor waits for the boat."]}
  nl.a2.unit108.lesson02.teach.gn_onregelmatig: {"title": "Narration: irregular imperfectum", "gloss": "to go → went; to see → saw; to eat → ate; to take → took; to walk → walked; to drink → drank; to be → was/were", "note": "Stories are written in the imperfectum. The singular form goes with *ik*, *jij/je*, *hij*, *zij* (she) and a single name like *Noor*; the plural form with *we*, *jullie* and *ze* (they). Learn these as a set."}
  nl.a2.unit108.lesson02.teach.gn_regelmatig: {"title": "Narration: regular imperfectum", "gloss": "to make → made; to wait → waited; to laugh → laughed; to buy → bought", "note": "Many regular verbs add *-te* (singular) or *-ten* (plural) to the stem; here the stems end in a sound that takes *-te(n)*. Other regular verbs take *-de(n)*, which comes later. *Kopen* is a special case: *kocht, kochten*."}
  nl.a2.unit108.lesson02.teach.zinnen: {"title": "Small events in the imperfectum", "gloss": "Lotte bought the tickets. Omar drank coffee. Noor laughed. They waited a long time in the queue."}
  nl.a2.unit108.lesson03.teach.woorden: {"title": "Talking about yesterday", "gloss": "yesterday / together / nice, fun / a lot, many / the animals", "note": "Useful when you tell a friend what you did.", "example_gloss": ["Yesterday we were at the zoo.", "We were at the zoo together.", "It was fun.", "I saw a lot of animals.", "The animals were big."]}
  nl.a2.unit108.lesson03.teach.gn_perfectum: {"title": "Telling a friend: voltooid tegenwoordige tijd", "gloss": "First we went to the zoo. After that we saw the monkeys.", "note": "In conversation you usually tell what you did with *hebben* or *zijn* plus a participle. The helping verb is in second place, the participle goes at the end: *Eerst zijn we … gegaan*, *Daarna hebben we … gezien*."}
  nl.a2.unit108.lesson03.teach.gn_deelwoorden: {"title": "Participles with hebben", "gloss": "seen / eaten / taken / drunk / bought / made / waited / laughed", "note": "Most participles start with *ge-*. Regular verbs end in *-t* (*gemaakt, gewacht*); irregular verbs end in *-en* (*gezien, gegeten, genomen, gedronken*). *Gekocht* ends in *-t* even though *kopen* is irregular in the imperfectum, and *lachen* is an exception: *gelachen*."}
  nl.a2.unit108.lesson03.teach.gn_hulpwerkwoord: {"title": "Hebben or zijn?", "gloss": "I saw the monkeys. Noor drank coffee. We laughed. I went to the amusement park. Omar was in the zoo. We came.", "note": "Most verbs use *hebben*. Verbs of going and coming (movement to a place) and *zijn* itself use *zijn*: *gegaan, gekomen, geweest*. Forms: *ik heb / ben, Noor heeft / is, wij hebben / zijn*."}
  nl.a2.unit108.lesson03.teach.gn_contrast: {"title": "Story or conversation?", "gloss": "First they went to the zoo. First we went to the zoo.", "note": "A written story uses the imperfectum (*gingen*). When you tell a friend what you did, you usually use the voltooid tegenwoordige tijd (*zijn … gegaan*). The order of events is shown by the same words in both."}
  nl.a2.unit108.lesson03.teach.zinnen: {"title": "Telling about yesterday", "gloss": "Yesterday we went to the zoo together. We saw a lot of animals. It was fun."}
  nl.a2.unit108.lesson04.teach.plaatsen: {"title": "On the boat tour", "gloss": "the city / the bridge", "note": "You see both from the boat.", "example_gloss": ["The city is beautiful.", "The bridge is old.", "We see the bridge."]}
  nl.a2.unit108.lesson04.teach.gn_stappen: {"title": "One more participle with zijn", "gloss": "Noor got into the boat. Omar took a photo of the bridge.", "note": "*Stappen* (to step, to get in) is regular: *gestapt*. Because it describes a movement into somewhere, it uses *zijn*. *Een foto maken* uses *hebben*: *gemaakt*."}
  nl.a2.unit108.lesson04.teach.verhaal: {"title": "The boat tour in order", "gloss": "Yesterday Omar and Noor took a boat tour. First they bought tickets. After that they got into the boat. Then they took a photo of the bridge. Next they saw the city. Later they drank coffee. In the end they went home."}
  nl.a2.unit108.lesson05.teach.lees: {"title": "A day at the amusement park", "gloss": "On Saturday Lotte, Omar and Noor went to the amusement park. First they bought tickets. After that they went on the roller coaster. Noor was afraid, but Omar laughed. Then they ate an ice cream. Later they waited a long time in the queue. After they had waited, they went on the roller coaster once more. In the end they took the bus home.", "note": "A story is written in the imperfectum. Look for the sequence words to follow the order. One sentence uses *hadden gewacht* (reading only).", "glosses": {"Zaterdag": "Saturday", "bang": "afraid", "maar": "but", "Nadat": "after", "hadden": "had", "gewacht": "waited (participle)", "nog": "another, once more", "keer": "time"}}
  nl.a2.unit108.lesson05.teach.gn_voltooid_verleden: {"title": "Recognise: something that had already happened (reading only)", "gloss": "After they had waited, they went on the roller coaster once more.", "note": "*Hadden gewacht* (had + participle) is the voltooid verleden tijd. It tells you something was already finished before another past moment. After *nadat* the verbs go to the end of the clause, and the main clause that follows starts with its verb: *gingen ze*. You only need to recognise it when you read or listen; when you tell a story yourself, use the imperfectum or the voltooid tegenwoordige tijd."}
  nl.a2.unit108.lesson06.teach.beurt1: {"title": "Lotte asks", "gloss": "Lotte: Hi Omar, what did you do yesterday?"}
  nl.a2.unit108.lesson06.teach.beurt2: {"title": "Omar answers", "gloss": "Omar: Noor and I took a boat tour."}
  nl.a2.unit108.lesson06.teach.beurt3: {"title": "Lotte asks what came first", "gloss": "Lotte: Nice! And what did you do first?"}
  nl.a2.unit108.lesson06.teach.beurt4: {"title": "Omar tells the first events", "gloss": "Omar: First we bought tickets. After that we got into the boat."}
  nl.a2.unit108.lesson06.teach.beurt5: {"title": "Lotte asks what followed", "gloss": "Lotte: And then?"}
  nl.a2.unit108.lesson06.teach.beurt6: {"title": "Omar finishes the story", "gloss": "Omar: Then we saw the city. In the end we drank coffee."}
exercises:
  nl.a2.unit108.lesson01.exercise01.hoor_begin: {"instruction": "Listen and select what you hear.", "correct_option": "Eerst gingen ze naar de dierentuin.", "distractors": ["Daarna gingen ze naar de dierentuin.", "Eerst zagen ze de apen.", "Uiteindelijk gingen ze naar de dierentuin."], "accepted_answers": [{"value": "Eerst gingen ze naar de dierentuin.", "status": "correct"}], "feedback": "You heard *Eerst gingen ze naar de dierentuin.* The first word shows this is the first event."}
  nl.a2.unit108.lesson01.exercise02.kies_laatste: {"instruction": "Choose the Dutch word.", "correct_option": "uiteindelijk", "distractors": ["eerst", "daarna", "later"], "accepted_answers": [{"value": "uiteindelijk", "status": "correct"}], "feedback": "*Uiteindelijk* = in the end; it usually opens the last event."}
  nl.a2.unit108.lesson01.exercise03.plaatsen_dieren: {"instruction": "Match each Dutch word to its English meaning.", "accepted_answers": [{"value": [{"left": "de dierentuin", "right": "zoo"}, {"left": "de boottocht", "right": "boat tour"}, {"left": "het pretpark", "right": "amusement park"}, {"left": "de achtbaan", "right": "roller coaster"}, {"left": "de aap", "right": "monkey"}, {"left": "de olifant", "right": "elephant"}, {"left": "de leeuw", "right": "lion"}, {"left": "het ijsje", "right": "ice cream"}], "status": "correct"}], "feedback": "Each Dutch word has one meaning."}
  nl.a2.unit108.lesson01.exercise04.volgorde_zin: {"instruction": "Put the words in order: First they went to the zoo.", "correct_option": "Eerst gingen ze naar de dierentuin", "accepted_answers": [{"value": "Eerst gingen ze naar de dierentuin", "status": "correct"}, {"value": "Ze gingen eerst naar de dierentuin", "status": "correct"}], "feedback": "With *eerst* first, the verb comes next: *Eerst gingen ze*. *Ze gingen eerst* is also correct."}
  nl.a2.unit108.lesson01.exercise05.vul_uiteindelijk: {"instruction": "Complete with the word for 'in the end'.", "correct_option": "Uiteindelijk", "accepted_answers": [{"value": "Uiteindelijk", "status": "correct"}, {"value": "uiteindelijk", "status": "correct"}], "feedback": "*Uiteindelijk namen ze de bus naar huis* = In the end they took the bus home."}
  nl.a2.unit108.lesson01.exercise06.vertaal_laatste: {"instruction": "Translate into Dutch. Use the imperfectum.", "accepted_answers": [{"value": "Uiteindelijk namen ze de bus naar huis.", "status": "correct"}, {"value": "Uiteindelijk namen ze de bus naar huis", "status": "correct"}, {"value": "Ze namen uiteindelijk de bus naar huis.", "status": "correct"}, {"value": "Ze namen uiteindelijk de bus naar huis", "status": "correct"}, {"value": "Ze namen de bus uiteindelijk naar huis.", "status": "correct"}, {"value": "Ze namen de bus uiteindelijk naar huis", "status": "correct"}, {"value": "Uiteindelijk namen zij de bus naar huis.", "status": "correct"}, {"value": "Uiteindelijk namen zij de bus naar huis", "status": "correct"}, {"value": "Zij namen uiteindelijk de bus naar huis.", "status": "correct"}, {"value": "Zij namen uiteindelijk de bus naar huis", "status": "correct"}], "feedback": "*Uiteindelijk namen ze de bus naar huis.*"}
  nl.a2.unit108.lesson01.exercise07.schrijf_twee: {"instruction": "Write the two requested sentences.", "correct_option": "Eerst gingen ze naar de dierentuin. Daarna zagen ze de apen.", "accepted_answers": [{"value": "Eerst gingen ze naar de dierentuin. Daarna zagen ze de apen.", "status": "correct"}, {"value": "Eerst gingen ze naar de dierentuin. Daarna zagen ze de apen", "status": "correct"}, {"value": "Eerst gingen ze naar de dierentuin. Ze zagen daarna de apen.", "status": "correct"}, {"value": "Eerst gingen ze naar de dierentuin. Ze zagen daarna de apen", "status": "correct"}, {"value": "Ze gingen eerst naar de dierentuin. Daarna zagen ze de apen.", "status": "correct"}, {"value": "Ze gingen eerst naar de dierentuin. Daarna zagen ze de apen", "status": "correct"}, {"value": "Ze gingen eerst naar de dierentuin. Ze zagen daarna de apen.", "status": "correct"}, {"value": "Ze gingen eerst naar de dierentuin. Ze zagen daarna de apen", "status": "correct"}, {"value": "Eerst gingen zij naar de dierentuin. Daarna zagen zij de apen.", "status": "correct"}, {"value": "Eerst gingen zij naar de dierentuin. Daarna zagen zij de apen", "status": "correct"}, {"value": "Eerst gingen zij naar de dierentuin. Zij zagen daarna de apen.", "status": "correct"}, {"value": "Eerst gingen zij naar de dierentuin. Zij zagen daarna de apen", "status": "correct"}, {"value": "Zij gingen eerst naar de dierentuin. Daarna zagen zij de apen.", "status": "correct"}, {"value": "Zij gingen eerst naar de dierentuin. Daarna zagen zij de apen", "status": "correct"}, {"value": "Zij gingen eerst naar de dierentuin. Zij zagen daarna de apen.", "status": "correct"}, {"value": "Zij gingen eerst naar de dierentuin. Zij zagen daarna de apen", "status": "correct"}], "feedback": "*Eerst gingen ze naar de dierentuin. Daarna zagen ze de apen.*"}
  nl.a2.unit108.lesson02.exercise01.kies_dronk: {"instruction": "Choose the Dutch sentence in the imperfectum.", "correct_option": "Omar dronk koffie.", "distractors": ["Omar drinkt koffie.", "Omar dronken koffie.", "Omar at koffie."], "accepted_answers": [{"value": "Omar dronk koffie.", "status": "correct"}], "feedback": "*Dronk* is the singular imperfectum of *drinken*."}
  nl.a2.unit108.lesson02.exercise02.kies_zagen: {"instruction": "Choose the correct Dutch sentence.", "correct_option": "Ze zagen de olifanten.", "distractors": ["Ze zien de olifanten.", "Ze zagen de leeuwen.", "Ze namen de olifanten."], "accepted_answers": [{"value": "Ze zagen de olifanten.", "status": "correct"}], "feedback": "*Zagen* is the plural imperfectum of *zien*."}
  nl.a2.unit108.lesson02.exercise03.vormen: {"instruction": "Match each infinitive to its singular imperfectum form.", "accepted_answers": [{"value": [{"left": "gaan", "right": "ging"}, {"left": "zien", "right": "zag"}, {"left": "eten", "right": "at"}, {"left": "nemen", "right": "nam"}, {"left": "lopen", "right": "liep"}, {"left": "drinken", "right": "dronk"}, {"left": "maken", "right": "maakte"}, {"left": "wachten", "right": "wachtte"}, {"left": "lachen", "right": "lachte"}, {"left": "kopen", "right": "kocht"}], "status": "correct"}], "feedback": "Narration uses these forms; the regular ones end in *-te*."}
  nl.a2.unit108.lesson02.exercise04.volgorde_wachten: {"instruction": "Put the words in order: After that they waited a long time in the queue.", "correct_option": "Daarna wachtten ze lang in de rij", "accepted_answers": [{"value": "Daarna wachtten ze lang in de rij", "status": "correct"}, {"value": "Ze wachtten daarna lang in de rij", "status": "correct"}], "feedback": "*Wachtten* is the plural imperfectum of *wachten*."}
  nl.a2.unit108.lesson02.exercise05.vul_aten: {"instruction": "Complete with the plural imperfectum of eten.", "correct_option": "aten", "accepted_answers": [{"value": "aten", "status": "correct"}], "feedback": "*Aten* is the plural imperfectum of *eten*."}
  nl.a2.unit108.lesson02.exercise06.vertaal_dronk: {"instruction": "Translate into Dutch. Use the imperfectum.", "accepted_answers": [{"value": "Omar dronk koffie en Noor lachte.", "status": "correct"}, {"value": "Omar dronk koffie en Noor lachte", "status": "correct"}, {"value": "Omar dronk koffie, en Noor lachte.", "status": "correct"}, {"value": "Omar dronk koffie, en Noor lachte", "status": "correct"}], "feedback": "*Omar dronk koffie en Noor lachte.*"}
  nl.a2.unit108.lesson02.exercise07.schrijf_kocht: {"instruction": "Write the requested sentence.", "correct_option": "Lotte kocht de kaartjes.", "accepted_answers": [{"value": "Lotte kocht de kaartjes.", "status": "correct"}, {"value": "Lotte kocht de kaartjes", "status": "correct"}], "feedback": "*Lotte kocht de kaartjes.*"}
  nl.a2.unit108.lesson03.exercise01.kies_perfectum: {"instruction": "Choose the sentence in the voltooid tegenwoordige tijd.", "correct_option": "Eerst zijn we naar de dierentuin gegaan.", "distractors": ["Eerst gingen we naar de dierentuin.", "Eerst gaan we naar de dierentuin.", "Eerst gingen ze naar de dierentuin."], "accepted_answers": [{"value": "Eerst zijn we naar de dierentuin gegaan.", "status": "correct"}], "feedback": "The voltooid tegenwoordige tijd uses *zijn* or *hebben* plus a participle: *zijn … gegaan*."}
  nl.a2.unit108.lesson03.exercise02.kies_imperfectum: {"instruction": "Choose the sentence in the imperfectum.", "correct_option": "Daarna zagen ze de apen.", "distractors": ["Daarna hebben ze de apen gezien.", "Daarna zien ze de apen.", "Daarna hebben we de apen gezien."], "accepted_answers": [{"value": "Daarna zagen ze de apen.", "status": "correct"}], "feedback": "The imperfectum is one verb form: *zagen*."}
  nl.a2.unit108.lesson03.exercise03.deelwoorden: {"instruction": "Match each infinitive to its participle.", "accepted_answers": [{"value": [{"left": "zien", "right": "gezien"}, {"left": "eten", "right": "gegeten"}, {"left": "nemen", "right": "genomen"}, {"left": "drinken", "right": "gedronken"}, {"left": "kopen", "right": "gekocht"}, {"left": "maken", "right": "gemaakt"}, {"left": "wachten", "right": "gewacht"}, {"left": "lachen", "right": "gelachen"}, {"left": "gaan", "right": "gegaan"}, {"left": "komen", "right": "gekomen"}], "status": "correct"}], "feedback": "Participles are used with *hebben* or *zijn*."}
  nl.a2.unit108.lesson03.exercise04.vul_zijn: {"instruction": "Complete with the correct helper verb for a verb of movement.", "correct_option": "zijn", "accepted_answers": [{"value": "zijn", "status": "correct"}], "feedback": "*Gaan* uses *zijn*: *we zijn gegaan*."}
  nl.a2.unit108.lesson03.exercise05.volgorde_perfectum: {"instruction": "Put the words in order: After that we saw the monkeys (spoken).", "correct_option": "Daarna hebben we de apen gezien", "accepted_answers": [{"value": "Daarna hebben we de apen gezien", "status": "correct"}, {"value": "We hebben daarna de apen gezien", "status": "correct"}], "feedback": "The participle *gezien* goes at the end."}
  nl.a2.unit108.lesson03.exercise06.vertaal_perfectum: {"instruction": "Translate into Dutch.", "accepted_answers": [{"value": "Daarna hebben we de kaartjes gekocht.", "status": "correct"}, {"value": "Daarna hebben we de kaartjes gekocht", "status": "correct"}, {"value": "Daarna hebben wij de kaartjes gekocht.", "status": "correct"}, {"value": "Daarna hebben wij de kaartjes gekocht", "status": "correct"}, {"value": "We hebben daarna de kaartjes gekocht.", "status": "correct"}, {"value": "We hebben daarna de kaartjes gekocht", "status": "correct"}, {"value": "Wij hebben daarna de kaartjes gekocht.", "status": "correct"}, {"value": "Wij hebben daarna de kaartjes gekocht", "status": "correct"}], "feedback": "*Daarna hebben we de kaartjes gekocht.*"}
  nl.a2.unit108.lesson03.exercise07.schrijf_twee: {"instruction": "Use the voltooid tegenwoordige tijd.", "correct_option": "Eerst zijn we naar de dierentuin gegaan. Daarna hebben we de olifanten gezien.", "accepted_answers": [{"value": "Eerst zijn we naar de dierentuin gegaan. Daarna hebben we de olifanten gezien.", "status": "correct"}, {"value": "Eerst zijn we naar de dierentuin gegaan. Daarna hebben we de olifanten gezien", "status": "correct"}, {"value": "Eerst zijn we naar de dierentuin gegaan. We hebben daarna de olifanten gezien.", "status": "correct"}, {"value": "Eerst zijn we naar de dierentuin gegaan. We hebben daarna de olifanten gezien", "status": "correct"}, {"value": "We zijn eerst naar de dierentuin gegaan. Daarna hebben we de olifanten gezien.", "status": "correct"}, {"value": "We zijn eerst naar de dierentuin gegaan. Daarna hebben we de olifanten gezien", "status": "correct"}, {"value": "We zijn eerst naar de dierentuin gegaan. We hebben daarna de olifanten gezien.", "status": "correct"}, {"value": "We zijn eerst naar de dierentuin gegaan. We hebben daarna de olifanten gezien", "status": "correct"}, {"value": "Eerst zijn wij naar de dierentuin gegaan. Daarna hebben wij de olifanten gezien.", "status": "correct"}, {"value": "Eerst zijn wij naar de dierentuin gegaan. Daarna hebben wij de olifanten gezien", "status": "correct"}, {"value": "Eerst zijn wij naar de dierentuin gegaan. Wij hebben daarna de olifanten gezien.", "status": "correct"}, {"value": "Eerst zijn wij naar de dierentuin gegaan. Wij hebben daarna de olifanten gezien", "status": "correct"}, {"value": "Wij zijn eerst naar de dierentuin gegaan. Daarna hebben wij de olifanten gezien.", "status": "correct"}, {"value": "Wij zijn eerst naar de dierentuin gegaan. Daarna hebben wij de olifanten gezien", "status": "correct"}, {"value": "Wij zijn eerst naar de dierentuin gegaan. Wij hebben daarna de olifanten gezien.", "status": "correct"}, {"value": "Wij zijn eerst naar de dierentuin gegaan. Wij hebben daarna de olifanten gezien", "status": "correct"}], "feedback": "*Eerst zijn we naar de dierentuin gegaan. Daarna hebben we de olifanten gezien.*"}
  nl.a2.unit108.lesson04.exercise01.kies_na_kaartjes: {"instruction": "Choose the correct answer.", "correct_option": "They got into the boat.", "distractors": ["They drank coffee.", "They went home.", "They saw the city."], "accepted_answers": [{"value": "They got into the boat.", "status": "correct"}], "feedback": "*Eerst hebben ze kaartjes gekocht. Daarna zijn ze in de boot gestapt.*"}
