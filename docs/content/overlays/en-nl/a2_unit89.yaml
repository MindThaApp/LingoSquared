review: {status: unreviewed, required_next_reviewer: owner_native_pass, notes: "English overlay for the polite requests and offers unit. OPEN NATIVE QUESTIONS: none identified."}
course:
  title: "Dutch A2"
  description: "Grammar-led A2 Dutch for polite requests, offers and answers."
  learning_goal: "Make polite requests with zou je/u ... kunnen, offer help with zal ik, soften orders with even and eens, and accept or decline."
units:
  nl.a2.unit89.beleefd_vragen: {title: "Polite requests", description: "Ask for help, offer help, and accept or decline politely with friends, neighbours and shop staff."}
lessons:
  nl.a2.unit89.lesson01.zou_je_kunnen: {title: "Could you help me?"}
  nl.a2.unit89.lesson02.je_of_u: {title: "Je or u?"}
  nl.a2.unit89.lesson03.zal_ik: {title: "Shall I do it?"}
  nl.a2.unit89.lesson04.even_en_eens: {title: "Even and eens"}
  nl.a2.unit89.lesson05.graag_of_nee_hoor: {title: "Yes please or no thanks"}
  nl.a2.unit89.lesson06.koffie_bij_lotte: {title: "Coffee at Lotte's"}
teaching:
  nl.a2.unit89.lesson01.teach.buren: {"title": "Neighbours and shops", "gloss": "the (male) neighbour / the (female) neighbour / the shop / the supermarket", "note": "These words name the people and places in this unit.", "example_gloss": ["My neighbour is kind.", "The neighbour goes to the shop.", "The supermarket is open."]}
  nl.a2.unit89.lesson01.teach.spullen: {"title": "Things you ask about", "gloss": "the bag / the key / the parcel / the groceries", "note": "*Boodschappen* is always plural: it means the groceries.", "example_gloss": ["The bag is heavy.", "Where is the key?", "The parcel is big.", "I have a lot of groceries."]}
  nl.a2.unit89.lesson01.teach.werkwoorden: {"title": "Verbs for requests", "gloss": "to help / to bring / to fetch / to buy", "note": "*Halen* means to go and get something.", "example_gloss": ["I help the neighbour.", "I bring the parcel.", "I fetch bread.", "I buy coffee."]}
  nl.a2.unit89.lesson01.teach.gn_zou_je: {"title": "A polite request with zou je ... kunnen", "gloss": "Could you help me?", "note": "Zou je + the thing you want + kunnen + the verb. The main verb goes to the very end."}
  nl.a2.unit89.lesson01.teach.zinnen: {"title": "Three polite requests", "gloss": "Could you fetch the key? Could you bring the parcel? Could you buy the groceries?"}
  nl.a2.unit89.lesson01.teach.natuurlijk: {"title": "Agreeing to a request", "gloss": "Yes, of course."}
  nl.a2.unit89.lesson02.teach.diensten: {"title": "People and services", "gloss": "sir / madam / the baker / the post office", "note": "Use *meneer* and *mevrouw* for people you do not know well.", "example_gloss": ["Good morning, sir.", "Good afternoon, madam.", "The baker has bread.", "The post office is nearby."]}
  nl.a2.unit89.lesson02.teach.brood: {"title": "At the baker and the post office", "gloss": "the bread / this / to weigh / to cut / to wrap", "note": "*Dit* points at something close to you.", "example_gloss": ["The bread is fresh.", "This parcel is heavy."]}
  nl.a2.unit89.lesson02.teach.gn_u: {"title": "Je or u", "gloss": "Could you help me? (to a friend) Could you help me? (to a stranger)", "note": "Use *je* with friends and family. Use *u* with strangers, older people and in many shops and offices. Only the pronoun changes; the rest of the sentence stays the same."}
  nl.a2.unit89.lesson02.teach.gn_alstublieft: {"title": "Please: alsjeblieft or alstublieft", "gloss": "Could you weigh this, please? (friend) Could you weigh this, please? (formal)", "note": "*Alsjeblieft* goes with *je*, *alstublieft* with *u*."}
  nl.a2.unit89.lesson02.teach.zinnen: {"title": "Formal requests", "gloss": "Could you cut the bread? Could you weigh this parcel? Could you wrap this?"}
  nl.a2.unit89.lesson03.teach.werkwoorden: {"title": "Verbs for offers", "gloss": "to carry / to put on (coffee) / to pay / the coffee / for", "note": "*Koffie zetten* means to make coffee.", "example_gloss": ["I carry the bag.", "I make coffee for the neighbour.", "I pay for the coffee."]}
  nl.a2.unit89.lesson03.teach.gn_zal: {"title": "Offering help with zal ik", "gloss": "Shall I carry the bag?", "note": "*Zal ik ...?* offers to do something yourself. The main verb goes to the end."}
  nl.a2.unit89.lesson03.teach.gn_voor: {"title": "Voor je or voor u", "gloss": "Shall I make coffee for you? (friend) Shall I make coffee for you? (formal)", "note": "Add *voor je* to a friend or *voor u* to a stranger to say who the help is for."}
  nl.a2.unit89.lesson03.teach.gn_contrast: {"title": "Asking or offering", "gloss": "Could you carry the bag? Shall I carry the bag?", "note": "*Zou je ... kunnen?* asks the other person to act. *Zal ik ...?* offers to act yourself."}
  nl.a2.unit89.lesson03.teach.zinnen: {"title": "Three offers", "gloss": "Shall I make coffee? Shall I fetch the groceries? Shall I pay?"}
  nl.a2.unit89.lesson04.teach.werkwoorden: {"title": "Little actions at the door", "gloss": "inside / to sit / to wait / to look / to give", "note": "*Binnen* goes with *komen* (to come in).", "example_gloss": ["The neighbour comes in.", "I sit on the chair.", "I wait for the neighbour.", "I look at the parcel.", "I give the key."]}
  nl.a2.unit89.lesson04.teach.gn_imperatief: {"title": "The imperative", "gloss": "Come in. Sit down. Wait. Look. Give the key.", "note": "The imperative is the verb stem, without *je*: *komen* becomes *kom*, *gaan* becomes *ga*, *geven* becomes *geef*."}
  nl.a2.unit89.lesson04.teach.gn_even_eens: {"title": "Even and eens soften the order", "gloss": "Come in, please. Have a seat. Wait a moment. Have a look.", "note": "*Even* and *eens* make an order friendlier. *Even* often only softens the request, and can also suggest something brief."}
  nl.a2.unit89.lesson04.teach.gn_u_imperatief: {"title": "Polite invitations with u", "gloss": "Please come in. Please have a seat.", "note": "To be polite to someone you call *u*, place the finite verb before *u*: *komt u, gaat u*."}
  nl.a2.unit89.lesson04.teach.zinnen: {"title": "Even in requests", "gloss": "Give me the key for a moment. Could you wait for a moment?", "note": "*Me* is the short form of *mij*."}
  nl.a2.unit89.lesson05.teach.woorden: {"title": "At the door", "gloss": "the door / to open / heavy / a lot of", "note": "*Opendoen* is one verb: *Zal ik de deur opendoen?*", "example_gloss": ["The bag is heavy.", "I have a lot of groceries.", "Shall I open the door?"]}
  nl.a2.unit89.lesson05.teach.gn_accept: {"title": "Accepting an offer", "gloss": "Yes please, thank you. (friend) Yes please, thank you. (formal)", "note": "*Graag* means yes please. Add *dank je* with friends and *dank u* in formal situations."}
  nl.a2.unit89.lesson05.teach.gn_decline: {"title": "Declining an offer politely", "gloss": "No, it's fine, I can manage.", "note": "*Het lukt wel* means I can manage. *Hoor* makes the *nee* friendly."}
  nl.a2.unit89.lesson05.teach.gn_verzoek: {"title": "Answering a request", "gloss": "Of course. Sorry, I can't do that.", "note": "Say yes to a request with *Natuurlijk*. Say no with *Sorry, dat lukt niet.*"}
  nl.a2.unit89.lesson05.teach.reading: {"title": "Noor and her neighbours", "gloss": "Noor comes out of the supermarket. She has a lot of groceries and a heavy bag. The neighbour sees her and asks: Shall I carry the bag? Noor says: Yes please, thank you. Then the neighbour asks: Shall I open the door? Noor says: No thanks, I can manage.", "note": "Notice which offer Noor accepts and which she declines.", "glosses": {"uit": "out of", "zware": "heavy", "ziet": "sees", "vraagt": "asks", "zegt": "says", "dan": "then"}}
  nl.a2.unit89.lesson06.teach.welkom: {"title": "Lotte welcomes Omar", "gloss": "Lotte: Hi Omar, come in for a moment."}
  nl.a2.unit89.lesson06.teach.boodschappen: {"title": "Omar has a lot of groceries", "gloss": "Omar: Thanks. I have a lot of groceries."}
  nl.a2.unit89.lesson06.teach.tas: {"title": "Lotte offers help", "gloss": "Lotte: Shall I carry the bag?"}
  nl.a2.unit89.lesson06.teach.koffie: {"title": "Omar declines and asks", "gloss": "Omar: No thanks, I can manage. Could you make coffee?"}
  nl.a2.unit89.lesson06.teach.brood: {"title": "Lotte agrees and offers more", "gloss": "Lotte: Of course. Sit down for a moment. Shall I cut the bread too?"}
  nl.a2.unit89.lesson06.teach.graag: {"title": "Omar accepts", "gloss": "Omar: Yes please, thank you."}
exercises:
  nl.a2.unit89.lesson01.exercise01.kies_helpen: {"instruction": "Choose the sentence that means \"Could you help me?\"", "correct_option": "Zou je mij kunnen helpen?", "distractors": ["Zou je kunnen mij helpen?", "Zou je mij kunt helpen?", "Zou je mij kunnen halen?"], "accepted_answers": [{"value": "Zou je mij kunnen helpen?", "status": "correct"}], "feedback": "*Zou je mij kunnen helpen?* puts *kunnen* before the final verb."}
  nl.a2.unit89.lesson01.exercise02.kies_pakket: {"instruction": "Choose the sentence that means \"Could you bring the parcel?\"", "correct_option": "Zou je het pakket kunnen brengen?", "distractors": ["Zou je het pakket kunnen halen?", "Zou je kunnen het pakket brengen?", "Zou je het pakket kan brengen?"], "accepted_answers": [{"value": "Zou je het pakket kunnen brengen?", "status": "correct"}], "feedback": "*Brengen* is to bring; *halen* would mean to fetch."}
  nl.a2.unit89.lesson01.exercise03.match_woorden: {"instruction": "Match each Dutch word to its English meaning.", "accepted_answers": [{"value": [{"left": "de buurman", "right": "neighbour (man)"}, {"left": "de buurvrouw", "right": "neighbour (woman)"}, {"left": "de winkel", "right": "shop"}, {"left": "de supermarkt", "right": "supermarket"}, {"left": "de tas", "right": "bag"}, {"left": "de sleutel", "right": "key"}, {"left": "het pakket", "right": "parcel"}, {"left": "de boodschappen", "right": "groceries"}], "status": "correct"}], "feedback": "These are the words you need for polite requests."}
  nl.a2.unit89.lesson01.exercise04.orde_helpen: {"instruction": "Put the words in order to ask 'Could you help me?'", "correct_option": "Zou je mij kunnen helpen", "accepted_answers": [{"value": "Zou je mij kunnen helpen", "status": "correct"}], "feedback": "*Zou je mij kunnen helpen?*"}
  nl.a2.unit89.lesson01.exercise05.vul_kunnen: {"instruction": "Complete the polite request.", "correct_option": "kunnen", "accepted_answers": [{"value": "kunnen", "status": "correct"}], "feedback": "*Zou je ... kunnen* is the frame; *kunnen* comes before the final verb."}
  nl.a2.unit89.lesson01.exercise06.vertaal_boodschappen: {"instruction": "Translate into Dutch, speaking to a friend.", "accepted_answers": [{"value": "Zou je de boodschappen kunnen brengen?", "status": "correct"}, {"value": "Zou je de boodschappen kunnen brengen", "status": "correct"}, {"value": "Zou je mij de boodschappen kunnen brengen?", "status": "correct"}, {"value": "Zou je mij de boodschappen kunnen brengen", "status": "correct"}, {"value": "Zou jij de boodschappen kunnen brengen?", "status": "correct"}, {"value": "Zou jij de boodschappen kunnen brengen", "status": "correct"}, {"value": "Zou jij mij de boodschappen kunnen brengen?", "status": "correct"}, {"value": "Zou jij mij de boodschappen kunnen brengen", "status": "correct"}, {"value": "Zou je de boodschappen voor mij kunnen brengen?", "status": "correct"}, {"value": "Zou je de boodschappen voor mij kunnen brengen", "status": "correct"}, {"value": "Zou je voor mij de boodschappen kunnen brengen?", "status": "correct"}, {"value": "Zou je voor mij de boodschappen kunnen brengen", "status": "correct"}], "feedback": "*Zou je de boodschappen kunnen brengen?*"}
  nl.a2.unit89.lesson01.exercise07.schrijf_sleutel: {"instruction": "Write the polite request in Dutch.", "correct_option": "Zou je de sleutel kunnen halen?", "accepted_answers": [{"value": "Zou je de sleutel kunnen halen?", "status": "correct"}, {"value": "Zou je de sleutel kunnen halen", "status": "correct"}, {"value": "Zou je mij de sleutel kunnen halen?", "status": "correct"}, {"value": "Zou je mij de sleutel kunnen halen", "status": "correct"}, {"value": "Zou jij de sleutel kunnen halen?", "status": "correct"}, {"value": "Zou jij de sleutel kunnen halen", "status": "correct"}, {"value": "Zou jij mij de sleutel kunnen halen?", "status": "correct"}, {"value": "Zou jij mij de sleutel kunnen halen", "status": "correct"}, {"value": "Zou je de sleutel voor mij kunnen halen?", "status": "correct"}, {"value": "Zou je de sleutel voor mij kunnen halen", "status": "correct"}, {"value": "Zou je voor mij de sleutel kunnen halen?", "status": "correct"}, {"value": "Zou je voor mij de sleutel kunnen halen", "status": "correct"}], "feedback": "*Zou je de sleutel kunnen halen?*"}
  nl.a2.unit89.lesson02.exercise01.kies_formeel: {"instruction": "Choose the formal sentence that means \"Could you help me?\"", "correct_option": "Zou u mij kunnen helpen?", "distractors": ["Zou u mij kunt helpen?", "Zou u kunnen mij helpen?", "Zou u mij kunnen halen?"], "accepted_answers": [{"value": "Zou u mij kunnen helpen?", "status": "correct"}], "feedback": "With a stranger you say *u*: *Zou u mij kunnen helpen?*"}
  nl.a2.unit89.lesson02.exercise02.kies_informeel: {"instruction": "Choose the informal sentence that means \"Could you bring my bag?\"", "correct_option": "Zou je mijn tas kunnen brengen?", "distractors": ["Zou je mijn tas kan brengen?", "Zou je kunnen mijn tas brengen?", "Zou je mijn tas kunnen kopen?"], "accepted_answers": [{"value": "Zou je mijn tas kunnen brengen?", "status": "correct"}], "feedback": "A friend gets *je*: *Zou je mijn tas kunnen brengen?*"}
  nl.a2.unit89.lesson02.exercise03.match_je_u: {"instruction": "Match each informal request to the same request in formal Dutch.", "accepted_answers": [{"value": [{"left": "Zou je mij kunnen helpen?", "right": "Zou u mij kunnen helpen?"}, {"left": "Zou je het brood kunnen snijden?", "right": "Zou u het brood kunnen snijden?"}, {"left": "Zou je dit pakket kunnen wegen?", "right": "Zou u dit pakket kunnen wegen?"}, {"left": "Zou je de tas kunnen brengen?", "right": "Zou u de tas kunnen brengen?"}, {"left": "Zou je de sleutel kunnen halen?", "right": "Zou u de sleutel kunnen halen?"}, {"left": "Zou je dit kunnen inpakken?", "right": "Zou u dit kunnen inpakken?"}], "status": "correct"}], "feedback": "Only *je* changes into *u*."}
  nl.a2.unit89.lesson02.exercise04.orde_wegen: {"instruction": "Put the words in order: a formal request to weigh this parcel.", "correct_option": "Zou u dit pakket kunnen wegen", "accepted_answers": [{"value": "Zou u dit pakket kunnen wegen", "status": "correct"}], "feedback": "*Zou u dit pakket kunnen wegen?*"}
  nl.a2.unit89.lesson02.exercise05.vul_alstublieft: {"instruction": "Complete the formal request with the right word for please.", "correct_option": "alstublieft", "accepted_answers": [{"value": "alstublieft", "status": "correct"}], "feedback": "*Alstublieft* goes with *u*; *alsjeblieft* goes with *je*."}
  nl.a2.unit89.lesson02.exercise06.vertaal_wegen: {"instruction": "Translate into Dutch. Use the formal u.", "accepted_answers": [{"value": "Zou u dit pakket kunnen wegen?", "status": "correct"}, {"value": "Zou u dit pakket kunnen wegen", "status": "correct"}, {"value": "Zou u dit pakket alstublieft kunnen wegen?", "status": "correct"}, {"value": "Zou u dit pakket alstublieft kunnen wegen", "status": "correct"}], "feedback": "*Zou u dit pakket kunnen wegen?*"}
  nl.a2.unit89.lesson02.exercise07.schrijf_brood: {"instruction": "Write the formal request in Dutch.", "correct_option": "Zou u het brood kunnen snijden?", "accepted_answers": [{"value": "Zou u het brood kunnen snijden?", "status": "correct"}, {"value": "Zou u het brood kunnen snijden", "status": "correct"}, {"value": "Zou u het brood alstublieft kunnen snijden?", "status": "correct"}], "feedback": "*Zou u het brood kunnen snijden?*"}
  nl.a2.unit89.lesson03.exercise01.kies_aanbod: {"instruction": "Choose the offer.", "correct_option": "Zal ik de tas dragen?", "distractors": ["Zou je de tas kunnen dragen?", "Zal ik de tas draag?", "Zal ik dragen de tas?"], "accepted_answers": [{"value": "Zal ik de tas dragen?", "status": "correct"}], "feedback": "To offer, say *Zal ik ...?* *Zou je ... kunnen?* would ask the neighbour to carry it."}
  nl.a2.unit89.lesson03.exercise02.luister_aanbod: {"instruction": "Listen and select what you hear.", "correct_option": "Zal ik koffie voor je zetten?", "distractors": ["Zal ik koffie voor u zetten?", "Zou je koffie kunnen zetten?", "Zal ik brood voor je halen?"], "accepted_answers": [{"value": "Zal ik koffie voor je zetten?", "status": "correct"}], "feedback": "You heard *Zal ik koffie voor je zetten?*"}
  nl.a2.unit89.lesson03.exercise03.match_aanbod: {"instruction": "Match each Dutch offer to its English meaning.", "accepted_answers": [{"value": [{"left": "Zal ik koffie zetten?", "right": "Shall I make coffee?"}, {"left": "Zal ik de tas dragen?", "right": "Shall I carry the bag?"}, {"left": "Zal ik betalen?", "right": "Shall I pay?"}, {"left": "Zal ik brood voor je halen?", "right": "Shall I fetch bread for you?"}, {"left": "Zal ik de sleutel brengen?", "right": "Shall I bring the key?"}, {"left": "Zal ik koffie kopen?", "right": "Shall I buy coffee?"}], "status": "correct"}], "feedback": "Each offer has its own verb."}
  nl.a2.unit89.lesson03.exercise04.orde_koffie: {"instruction": "Put the words in order: an offer to make coffee for a friend.", "correct_option": "Zal ik koffie voor je zetten", "accepted_answers": [{"value": "Zal ik koffie voor je zetten", "status": "correct"}, {"value": "Zal ik voor je koffie zetten", "status": "correct"}], "feedback": "*Zal ik koffie voor je zetten?*"}
  nl.a2.unit89.lesson03.exercise05.vul_zal: {"instruction": "Complete the offer with the word for shall.", "correct_option": "Zal", "accepted_answers": [{"value": "Zal", "status": "correct"}, {"value": "zal", "status": "correct"}], "feedback": "*Zal ik ...?* is the frame for an offer."}
  nl.a2.unit89.lesson03.exercise06.kies_vraag: {"instruction": "Choose the request, not the offer.", "correct_option": "Zou je de tas kunnen dragen?", "distractors": ["Zal ik de tas dragen?", "Zal ik de tas voor u dragen?", "Zal ik de tas voor je dragen?"], "accepted_answers": [{"value": "Zou je de tas kunnen dragen?", "status": "correct"}], "feedback": "A request to another person uses *Zou je ... kunnen?*; the others offer to do it yourself."}
  nl.a2.unit89.lesson03.exercise07.vertaal_dragen: {"instruction": "Translate into Dutch.", "accepted_answers": [{"value": "Zal ik de tas dragen?", "status": "correct"}, {"value": "Zal ik de tas dragen", "status": "correct"}, {"value": "Zal ik de tas voor je dragen?", "status": "correct"}, {"value": "Zal ik de tas voor je dragen", "status": "correct"}, {"value": "Zal ik de tas voor u dragen?", "status": "correct"}, {"value": "Zal ik de tas voor u dragen", "status": "correct"}], "feedback": "*Zal ik de tas dragen?*"}
  nl.a2.unit89.lesson03.exercise08.schrijf_halen: {"instruction": "Write the offer in Dutch.", "correct_option": "Zal ik de boodschappen halen?", "accepted_answers": [{"value": "Zal ik de boodschappen halen?", "status": "correct"}, {"value": "Zal ik de boodschappen halen", "status": "correct"}, {"value": "Zal ik de boodschappen voor je halen?", "status": "correct"}, {"value": "Zal ik de boodschappen voor je halen", "status": "correct"}, {"value": "Zal ik voor je de boodschappen halen?", "status": "correct"}, {"value": "Zal ik voor je de boodschappen halen", "status": "correct"}], "feedback": "*Zal ik de boodschappen halen?*"}
  nl.a2.unit89.lesson04.exercise01.kies_binnen: {"instruction": "Choose the friendly invitation.", "correct_option": "Kom even binnen.", "distractors": ["Even komt binnen.", "Ik kom even binnen.", "Komen even binnen."], "accepted_answers": [{"value": "Kom even binnen.", "status": "correct"}], "feedback": "The imperative is the bare stem: *Kom even binnen.* *Ik kom even binnen* says what you do."}
  nl.a2.unit89.lesson04.exercise02.kies_zitten: {"instruction": "Choose the polite form.", "correct_option": "Gaat u even zitten.", "distractors": ["Ga u even zitten.", "Gaat even u zitten.", "Gaan u even zitten."], "accepted_answers": [{"value": "Gaat u even zitten.", "status": "correct"}], "feedback": "With *u*, the verb takes *-t* and *u* follows it: *Gaat u even zitten.*"}
  nl.a2.unit89.lesson04.exercise03.match_bevel: {"instruction": "Match each Dutch sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Kom even binnen", "right": "Come in for a moment (to a friend)"}, {"left": "Komt u even binnen", "right": "Come in for a moment (formal)"}, {"left": "Ga even zitten", "right": "Sit down for a moment"}, {"left": "Wacht eens", "right": "Wait a moment"}, {"left": "Kijk eens", "right": "Have a look"}, {"left": "Geef me even de sleutel", "right": "Give me the key for a moment"}], "status": "correct"}], "feedback": "Each sentence has its own verb or *u*-form."}
  nl.a2.unit89.lesson04.exercise04.orde_sleutel: {"instruction": "Put the words in order: Give me the key for a moment.", "correct_option": "Geef me even de sleutel", "accepted_answers": [{"value": "Geef me even de sleutel", "status": "correct"}, {"value": "Geef me de sleutel even", "status": "correct"}], "feedback": "*Geef me even de sleutel.*"}
  nl.a2.unit89.lesson04.exercise05.vul_kom: {"instruction": "Complete the invitation to one friend with the imperative of komen.", "correct_option": "Kom", "accepted_answers": [{"value": "Kom", "status": "correct"}, {"value": "kom", "status": "correct"}], "feedback": "The imperative of *komen* is *kom*."}
  nl.a2.unit89.lesson04.exercise06.vertaal_binnen: {"instruction": "Translate into Dutch.", "accepted_answers": [{"value": "Kom even binnen.", "status": "correct"}, {"value": "Kom even binnen", "status": "correct"}], "feedback": "*Kom even binnen.*"}
  nl.a2.unit89.lesson04.exercise07.schrijf_u: {"instruction": "Write the formal invitation in Dutch.", "correct_option": "Komt u even binnen.", "accepted_answers": [{"value": "Komt u even binnen.", "status": "correct"}, {"value": "Komt u even binnen", "status": "correct"}], "feedback": "*Komt u even binnen.*"}
  nl.a2.unit89.lesson05.exercise01.lees_tas: {"instruction": "Read about Noor. Choose the correct answer.", "correct_option": "He offers to carry the bag.", "distractors": ["He offers to open the door.", "He offers to make coffee.", "He offers to weigh a parcel."], "accepted_answers": [{"value": "He offers to carry the bag.", "status": "correct"}], "feedback": "*De buurman ... vraagt: Zal ik de tas dragen?*"}
  nl.a2.unit89.lesson05.exercise02.lees_deur: {"instruction": "Read about Noor. Choose the correct answer.", "correct_option": "She politely declines: she can manage.", "distractors": ["She gladly accepts.", "She asks the neighbour to wait.", "She asks for coffee."], "accepted_answers": [{"value": "She politely declines: she can manage.", "status": "correct"}], "feedback": "*Noor zegt: Nee hoor, het lukt wel.*"}
