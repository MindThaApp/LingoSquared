    instruction: "Choose the Dutch sentence for 'I would like to apply for this vacancy.'"
    correct_option: "Ik wil graag solliciteren voor deze vacature."
    distractors: ["Ik wil graag deze vacature solliciteren.", "Ik solliciteer graag met deze vacature.", "Ik wil graag deze vacature zien."]
    accepted_answers: [{value: "Ik wil graag solliciteren voor deze vacature.", status: correct}]
    feedback: "Solliciteren voor is the fixed verb-plus-preposition pair for applying for something."
  nl.a2.unit73.lesson01.exercise02.listen_nina_ziet_vacature:
    instruction: "Listen and choose what the speaker says."
    correct_option: "Nina sees a vacancy online."
    distractors: ["Nina applies for a vacancy.", "Nina calls about a vacancy.", "Nina has a job interview."]
    accepted_answers: [{value: "Nina sees a vacancy online.", status: correct}]
    feedback: "Nina ziet een vacature online."
  nl.a2.unit73.lesson01.exercise08.dictation_nina_ziet_vacature:
    instruction: "Type what you hear."
