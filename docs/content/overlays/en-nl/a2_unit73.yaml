course:
  title: "Dutch A2"
  description: "Elementary-plus Dutch for applying and interviewing for a part-time job: a vacancy, a phone call to schedule, describing experience and availability, and a full job interview."

units:
  nl.a2.unit73.sollicitatiegesprek: {title: "Applying for a job at Kantoor Bloem"}

lessons:
  nl.a2.unit73.lesson01.ik_wil_solliciteren: {title: "I want to apply"}
  nl.a2.unit73.lesson02.ik_bel_over_de_vacature: {title: "I'm calling about the vacancy"}
  nl.a2.unit73.lesson03.mijn_ervaring_en_vaardigheden: {title: "My experience and skills"}
  nl.a2.unit73.lesson04.ben_ik_beschikbaar: {title: "Am I available?"}
  nl.a2.unit73.lesson05.een_vacature_lezen: {title: "Reading a job posting"}
  nl.a2.unit73.lesson06.het_sollicitatiegesprek: {title: "The job interview"}

teaching:
  nl.a2.unit73.lesson01.teach.vacature: {title: "Vacancy", gloss: "the vacancy / job opening", note: "A common gender noun: de vacature.", example_gloss: "Nina sees a vacancy online."}
  nl.a2.unit73.lesson01.teach.solliciteren_voor: {title: "Applying for a vacancy", gloss: "I would like to apply for this vacancy.", note: "Wil graag softens the request; solliciteren voor is the fixed verb-plus-preposition pair for applying for something."}
  nl.a2.unit73.lesson01.teach.kantoor_bloem_zoekt: {title: "The company states its need", gloss: "Kantoor Bloem is looking for an administrative assistant.", note: "Zoekt (from zoeken, to look for) is the standard verb a job ad uses to state a vacancy."}

  nl.a2.unit73.lesson02.teach.sollicitatiegesprek: {title: "Job interview", gloss: "the job interview", note: "A neuter noun: het sollicitatiegesprek, literally 'application conversation.'", example_gloss: "The job interview is next week."}
  nl.a2.unit73.lesson02.teach.afspraak_maken: {title: "Requesting an appointment", gloss: "Can I make an appointment for a job interview?", note: "Een afspraak maken voor reuses the same appointment-making pattern from unit46."}
  nl.a2.unit73.lesson02.teach.natuurlijk_dinsdag: {title: "Scheduling a time", gloss: "Of course, can you come by on Tuesday at ten o'clock?", note: "Langskomen (to come by/stop in) reuses the separable verb from unit28's woningcorporatie call."}

  nl.a2.unit73.lesson03.teach.ervaring: {title: "Experience", gloss: "the experience", note: "A common gender noun: de ervaring.", example_gloss: "I have experience as a volunteer."}
  nl.a2.unit73.lesson03.teach.vaardigheid: {title: "Skill", gloss: "the skill", note: "A common gender noun: de vaardigheid.", example_gloss: "Typing is an important skill."}
  nl.a2.unit73.lesson03.teach.ervaring_bibliotheek: {title: "Stating specific experience", gloss: "I have experience as a volunteer at the library.", note: "Als vrijwilliger (as a volunteer) states the role; in de bibliotheek reuses the library from unit47."}
  nl.a2.unit73.lesson03.teach.goede_vaardigheden: {title: "Stating general skills", gloss: "I have good skills.", note: "Vaardigheden is the plural of vaardigheid."}

  nl.a2.unit73.lesson04.teach.beschikbaar: {title: "Available", gloss: "available", note: "An adjective, invariable before or after zijn.", example_gloss: "Nina is available from Monday."}
  nl.a2.unit73.lesson04.teach.werktijden: {title: "Working hours", gloss: "the working hours", note: "A plural noun: de werktijden, always used in the plural.", example_gloss: "What are the working hours?"}
  nl.a2.unit73.lesson04.teach.beschikbaar_dagen: {title: "Stating specific availability", gloss: "I am available on Monday, Wednesday, and Friday.", note: "Op + a list of days states which days you are free."}
  nl.a2.unit73.lesson04.teach.werktijden_precies: {title: "Asking a clarifying question", gloss: "What exactly are the working hours?", note: "Precies (exactly) makes the question more specific, a natural clarifying follow-up in an interview."}

  nl.a2.unit73.lesson05.teach.vacature_tekst:
    title: "Read a job posting"
    gloss: "Kantoor Bloem is looking for an administrative assistant. Experience with customer contact is a plus. Working hours: Monday, Wednesday, and Friday, from nine to five. Call for a job interview."
    note: "Track the job title, the preferred experience, and the days/hours."
    glosses:
      zoekt: "is looking for (from zoeken)"
      administratief: "administrative"
      medewerker: "assistant / employee"
      Ervaring: "experience"
      klantcontact: "customer contact"
      pre: "a plus / an advantage (Dutch job-ad idiom)"
      Werktijden: "working hours"
      maandag: "Monday"
      woensdag: "Wednesday"
      vrijdag: "Friday"
      negen: "nine"
      tot: "to / until"
      vijf: "five"
      uur: "hour / o'clock"
      Bel: "call (imperative of bellen)"
      sollicitatiegesprek: "job interview"
  nl.a2.unit73.lesson05.teach.ervaring_klantcontact: {title: "Stating matching experience", gloss: "I have experience with customer contact.", note: "Klantcontact (customer contact) reuses the exact word from the job posting."}

  nl.a2.unit73.lesson06.teach.jansen_greet: {title: "Mevrouw Jansen greets Nina", gloss: "Mevrouw Jansen: Good morning, welcome to Kantoor Bloem. Please tell me about your experience.", note: "Vertelt u eens over... is a standard formal-register way to open an interview question."}
  nl.a2.unit73.lesson06.teach.nina_ervaring: {title: "Nina describes her experience", gloss: "Nina: Good morning. I have experience as a volunteer at the library. There I had a lot of customer contact.", note: "Had is the simple past of hebben, used here to describe a completed period of volunteering."}
  nl.a2.unit73.lesson06.teach.jansen_beschikbaar: {title: "Mevrouw Jansen asks about availability", gloss: "Mevrouw Jansen: Great. Are you available on Monday, Wednesday, and Friday?", note: "Matches lesson04's teaching phrase almost exactly, now as a question."}
  nl.a2.unit73.lesson06.teach.nina_dat_kan: {title: "Nina confirms and asks back", gloss: "Nina: Yes, that works. What exactly are the working hours?", note: "Dat kan (that works/that's possible) is a natural way to confirm availability before asking a follow-up question."}
  nl.a2.unit73.lesson06.teach.jansen_uren_contact: {title: "Mevrouw Jansen answers and closes", gloss: "Mevrouw Jansen: From nine to five. We'll get in touch with you this week.", note: "Contact met u op nemen reuses the separable-verb construction from unit28's woningcorporatie call."}
  nl.a2.unit73.lesson06.teach.nina_dank_gesprek: {title: "Nina thanks mevrouw Jansen", gloss: "Nina: Thank you for the interview.", note: "Dank u wel reuses the formal thanks used throughout the A2 course."}
  nl.a2.unit73.lesson06.teach.summary_grammar: {title: "Summarizing the interview", gloss: "Nina applied at Kantoor Bloem. She has experience as a volunteer at the library.", note: "Heeft ... gesolliciteerd is the present-perfect form of solliciteren (gesolliciteerd is the past participle); zij is the third-person pronoun 'she.'"}

exercises:
