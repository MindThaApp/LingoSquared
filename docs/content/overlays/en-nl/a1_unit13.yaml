course:
  title: "Dutch A1"
  description: "Beginner Dutch for understanding, asking about, and expressing everyday preferences and choices."

units:
  nl.a1.unit13.preferences: {title: "Expressing preferences"}

lessons:
  nl.a1.unit13.lesson01.eten_en_drinken: {title: "What food and drink do you like?"}
  nl.a1.unit13.lesson02.activiteiten: {title: "What do you like doing?"}
  nl.a1.unit13.lesson03.houden_van: {title: "Houden van"}
  nl.a1.unit13.lesson04.kiezen: {title: "Choosing between two options"}
  nl.a1.unit13.lesson05.voorkeur_lezen: {title: "A message about preferences"}
