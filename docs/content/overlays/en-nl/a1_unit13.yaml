    instruction: "Listen to the dialogue and choose Lotte's food preference."
    correct_option: bread
    distractors: ["tomato soup", apples, coffee]
    accepted_answers: [{value: bread, status: correct}]
    feedback: "Lotte says Ik heb liever brood."
  nl.a1.unit13.lesson06.exercise04.comprehend_activity:
    instruction: "Listen and choose the activity Lotte and Omar both like."
    correct_option: "walking in the park"
    distractors: [shopping, cycling, "watching a film"]
    accepted_answers: [{value: "walking in the park", status: correct}]
