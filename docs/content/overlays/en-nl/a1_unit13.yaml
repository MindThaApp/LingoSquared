  nl.a1.unit13.lesson05.exercise06.write_message:
    instruction: "Write the two-clause Dutch message using maar."
    accepted_answers: [{value: "Ik vind de film leuk, maar ik wil liever naar het park.", status: correct}, {value: "Ik vind de film leuk maar ik wil liever naar het park", status: correct}]
    feedback: "Maar joins two main clauses, so the second clause keeps ik wil liever."

  nl.a1.unit13.lesson06.exercise01.listen_question:
    instruction: "Listen and choose what Lotte asks about."
    correct_option: "what Omar wants to eat"
    distractors: ["what Omar did yesterday", "where Omar works", "when Omar arrived"]
    accepted_answers: [{value: "what Omar wants to eat", status: correct}]
