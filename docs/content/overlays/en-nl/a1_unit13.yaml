  nl.a1.unit13.lesson05.exercise05.listen_message:
    instruction: "Listen and choose what Omar would rather do."
    correct_option: "go to the park"
    distractors: ["watch the film", "go shopping", "drink coffee"]
    accepted_answers: [{value: "go to the park", status: correct}]
