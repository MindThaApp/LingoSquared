  nl.a1.unit13.lesson06.exercise05.order_answer:
    instruction: "Put Omar's preferred food answer in order."
    correct_option: "Ik wil liever tomatensoep"
    accepted_answers: [{value: "Ik wil liever tomatensoep", status: correct}]
    feedback: "Liever follows wil."
  nl.a1.unit13.lesson06.exercise06.respond_food:
    instruction: "Answer in Dutch: prefer tomato soup and say that you like its taste."
    accepted_answers: [{value: "Ik wil liever tomatensoep. Ik vind tomatensoep lekker.", status: correct}, {value: "Ik wil liever tomatensoep Ik vind tomatensoep lekker", status: correct}, {value: "Ik wil liever tomatensoep, want ik vind tomatensoep lekker.", status: correct}]
    feedback: "Use liever for the choice and lekker for the taste."
  nl.a1.unit13.lesson06.exercise07.listen_type_answer:
    instruction: "Listen and type Omar's complete two-sentence answer."
    accepted_answers: [{value: "Ik wil liever tomatensoep. Ik vind tomatensoep lekker.", status: correct}, {value: "Ik wil liever tomatensoep Ik vind tomatensoep lekker", status: correct}, {value: "Ik wil liever tomatensoep, want ik vind tomatensoep lekker.", status: correct}]
    feedback: "Omar states both his choice and why it suits his taste."
  nl.a1.unit13.lesson06.exercise08.write_preferences:
    instruction: "Write three Dutch sentences: say you like tomato soup, prefer bread in this choice, and like walking."
    accepted_answers: [{value: "Ik vind tomatensoep lekker. Ik heb liever brood. Ik vind wandelen leuk.", status: correct}, {value: "Ik vind tomatensoep lekker Ik heb liever brood Ik vind wandelen leuk", status: correct}]
    feedback: "Use lekker for food, liever for the choice, and leuk for the activity."
