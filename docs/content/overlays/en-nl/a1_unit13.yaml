    instruction: "Listen to the dialogue and choose Omar's food preference."
    correct_option: "tomato soup"
    distractors: [bread, coffee, apples]
    accepted_answers: [{value: "tomato soup", status: correct}]
    feedback: "Omar says Ik wil liever tomatensoep."
