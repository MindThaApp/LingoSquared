teaching:
  nl.a1.unit13.lesson01.teach.lekker_vinden: {title: "Lekker vinden for food and drink", gloss: "For food and drink, Dutch often uses lekker vinden.", note: "English like does not map to one Dutch expression. With a taste, say *Ik vind ... lekker*, literally that you find it tasty."}
  nl.a1.unit13.lesson01.teach.koffie: {title: "Liking coffee", gloss: "I like coffee.", note: "The food or drink stands between *vind* and *lekker*."}
  nl.a1.unit13.lesson01.teach.thee: {title: "Not liking tea", gloss: "I do not like tea.", note: "Put *niet* before *lekker* to reject the taste."}
  nl.a1.unit13.lesson01.teach.question: {title: "Ask about a taste", gloss: "Do you like tomato soup?", note: "In the informal question, *vind* comes before *je*. This continues the course's *jij/je* register."}

  nl.a1.unit13.lesson02.teach.leuk_vinden: {title: "Leuk vinden for activities", gloss: "With activities, Dutch often uses leuk vinden: I like cycling.", note: "Use *leuk*, not *lekker*, for an activity such as cycling."}
  nl.a1.unit13.lesson02.teach.walking: {title: "Liking walking", gloss: "I like walking.", note: "The activity *wandelen* stands between *vind* and *leuk*."}
  nl.a1.unit13.lesson02.teach.dislike: {title: "Not liking shopping", gloss: "I do not like shopping.", note: "*Niet* comes before *leuk*."}
  nl.a1.unit13.lesson02.teach.activity_question: {title: "Ask about activities", gloss: "What do you like doing?", note: "*Wat vind je leuk om te doen?* is a natural general question about someone's preferred activities."}

  nl.a1.unit13.lesson03.teach.strong_like: {title: "A stronger or general liking", gloss: "Houden van expresses a strong or general liking.", note: "Use it selectively. Ordinary reactions to a particular food or activity are more naturally expressed with *lekker vinden* or *leuk vinden*."}
  nl.a1.unit13.lesson03.teach.music: {title: "Being fond of music", gloss: "I love music / I am very fond of music.", note: "*Houd* is the *ik* form of *houden*; *van* follows it."}
  nl.a1.unit13.lesson03.teach.films: {title: "Not liking films", gloss: "I do not like films.", note: "In the negative form, *niet* stands between *houd* and *van*."}
  nl.a1.unit13.lesson03.teach.contrast: {title: "Choose the natural expression", gloss: "For an ordinary taste, also say: I like coffee. For an activity: I like walking.", note: "Do not mechanically translate every English like with *houden van*."}

  nl.a1.unit13.lesson04.teach.choice_question: {title: "Offer two options", gloss: "Would you like coffee or tea?", note: "*Wil je ... of ...?* asks the other person to choose."}
  nl.a1.unit13.lesson04.teach.want_prefer: {title: "Say what you would rather have", gloss: "I would rather have tea.", note: "*Liever* follows *wil* in this ordinary choice pattern."}
  nl.a1.unit13.lesson04.teach.have_prefer: {title: "Prefer one item", gloss: "I prefer the blue sweater.", note: "*Ik heb liever ...* is also natural when choosing one item over another."}
  nl.a1.unit13.lesson04.teach.liever_note: {title: "Liever marks the preferred option", gloss: "Liever shows that you choose one option over another.", note: "The comparison can stay implicit when both choices are clear from the conversation."}

  nl.a1.unit13.lesson05.teach.message: {title: "Read several preferences", gloss: "Hi Lotte, I like the film, but Omar does not like films. He would rather go to the park. I also like walking.", note: "Track who likes the film, who rejects films, and which alternative Omar chooses."}

  nl.a1.unit13.lesson06.teach.food_question: {title: "Lotte offers two foods", gloss: "Lotte: What do you want to eat, Omar? Would you like bread or tomato soup?", note: "The second question supplies the two choices."}
  nl.a1.unit13.lesson06.teach.omar_choice: {title: "Omar chooses soup", gloss: "Omar: I would rather have tomato soup. I like tomato soup. And you?", note: "Omar first makes a choice with *liever*, then explains it as a taste with *lekker*."}
  nl.a1.unit13.lesson06.teach.lotte_choice: {title: "Lotte chooses bread", gloss: "Lotte: I prefer bread. I do not like tomato soup very much.", note: "*Niet zo lekker* softens the negative and is natural in a friendly conversation."}
  nl.a1.unit13.lesson06.teach.activity: {title: "Choose what to do next", gloss: "Omar: What do you want to do after eating? Lotte: I like walking.", note: "*Leuk* describes the activity *wandelen*."}
  nl.a1.unit13.lesson06.teach.plan: {title: "They share a preference", gloss: "Omar: Me too. I love walking. Shall we go to the park? Lotte: Good idea.", note: "This reconnects to the informal plan-making language from unit11."}

exercises:
  nl.a1.unit13.lesson01.exercise01.choose_food_like:
    instruction: "Choose the natural Dutch sentence for liking the taste of coffee."
    correct_option: "Ik vind koffie lekker."
    distractors: ["Ik vind koffie leuk.", "Ik lekker koffie vind.", "Ik vind lekker koffie."]
    accepted_answers: [{value: "Ik vind koffie lekker.", status: correct}]
    feedback: "For food and drink, use vind + the item + lekker."
  nl.a1.unit13.lesson01.exercise02.listen_dislike:
    instruction: "Listen and choose the speaker's preference."
    correct_option: "The speaker does not like tea."
    distractors: ["The speaker likes tea.", "The speaker does not like coffee.", "The speaker wants tea."]
    accepted_answers: [{value: "The speaker does not like tea.", status: correct}]
    feedback: "Niet lekker makes the statement negative."
  nl.a1.unit13.lesson01.exercise03.match_food:
    instruction: "Match each Dutch sentence to its meaning."
    accepted_answers: [{value: [{left: "Ik vind koffie lekker.", right: "likes coffee"}, {left: "Ik vind thee niet lekker.", right: "does not like tea"}], status: correct}]
    feedback: "Lekker states a positive taste; niet lekker rejects it."
  nl.a1.unit13.lesson01.exercise04.order_food:
    instruction: "Put the words in order to say that you like coffee."
    correct_option: "Ik vind koffie lekker"
    accepted_answers: [{value: "Ik vind koffie lekker", status: correct}]
    feedback: "Place the drink between vind and lekker."
  nl.a1.unit13.lesson01.exercise05.listen_type_food:
    instruction: "Listen and type the complete Dutch sentence."
    accepted_answers: [{value: "Ik vind koffie lekker.", status: correct}, {value: "Ik vind koffie lekker", status: correct}]
    feedback: "The sentence is Ik vind koffie lekker."
  nl.a1.unit13.lesson01.exercise06.respond_food:
    instruction: "Answer positively in Dutch: say that you like tomato soup."
    accepted_answers: [{value: "Ik vind tomatensoep lekker.", status: correct}, {value: "Ik vind tomatensoep lekker", status: correct}, {value: "Ja, ik vind tomatensoep lekker.", status: correct}]
    feedback: "A natural answer is Ik vind tomatensoep lekker."

  nl.a1.unit13.lesson02.exercise01.choose_activity:
    instruction: "Choose the natural Dutch sentence for liking cycling."
    correct_option: "Ik vind fietsen leuk."
    distractors: ["Ik vind fietsen lekker.", "Ik leuk fietsen vind.", "Ik vind leuk fietsen."]
    accepted_answers: [{value: "Ik vind fietsen leuk.", status: correct}]
    feedback: "Use leuk for an activity."
  nl.a1.unit13.lesson02.exercise02.listen_activity:
    instruction: "Listen and choose the activity the speaker likes."
    correct_option: cycling
    distractors: [walking, shopping, working]
    accepted_answers: [{value: cycling, status: correct}]
    feedback: "Fietsen means cycling."
  nl.a1.unit13.lesson02.exercise03.match_context:
    instruction: "Match each item or activity to the natural Dutch adjective."
    accepted_answers: [{value: [{left: koffie, right: lekker}, {left: tomatensoep, right: lekker}, {left: fietsen, right: leuk}, {left: wandelen, right: leuk}], status: correct}]
    feedback: "Tastes are lekker; activities are leuk."
  nl.a1.unit13.lesson02.exercise04.order_question:
    instruction: "Put the words in order to ask what someone likes doing."
    correct_option: "Wat vind je leuk om te doen"
    accepted_answers: [{value: "Wat vind je leuk om te doen", status: correct}]
    feedback: "The question is Wat vind je leuk om te doen?"
  nl.a1.unit13.lesson02.exercise05.listen_type_question:
    instruction: "Listen and type the complete Dutch question."
    accepted_answers: [{value: "Wat vind je leuk om te doen?", status: correct}, {value: "Wat vind je leuk om te doen", status: correct}]
    feedback: "The question asks about preferred activities."
  nl.a1.unit13.lesson02.exercise06.write_activity:
    instruction: "Write two Dutch sentences: you like walking and you do not like shopping."
    accepted_answers: [{value: "Ik vind wandelen leuk. Ik vind winkelen niet leuk.", status: correct}, {value: "Ik vind wandelen leuk Ik vind winkelen niet leuk", status: correct}]
    feedback: "Use leuk for both activities and add niet for the dislike."

  nl.a1.unit13.lesson03.exercise01.choose_music:
    instruction: "Choose the Dutch sentence expressing a strong or general liking for music."
    correct_option: "Ik houd van muziek."
    distractors: ["Ik houd muziek van.", "Ik vind muziek lekker.", "Ik van muziek houd."]
    accepted_answers: [{value: "Ik houd van muziek.", status: correct}]
    feedback: "The fixed combination is houden van."
  nl.a1.unit13.lesson03.exercise02.listen_music:
    instruction: "Listen and choose what the speaker is fond of."
    correct_option: music
    distractors: [films, walking, coffee]
    accepted_answers: [{value: music, status: correct}]
    feedback: "Muziek means music."
  nl.a1.unit13.lesson03.exercise03.match_expression:
    instruction: "Match each context to the most natural expression taught in this unit."
    accepted_answers: [{value: [{left: "food or drink", right: "lekker vinden"}, {left: activity, right: "leuk vinden"}, {left: "strong or general liking", right: "houden van"}], status: correct}]
    feedback: "Dutch chooses among these expressions according to meaning and context."
  nl.a1.unit13.lesson03.exercise04.order_films:
    instruction: "Put the words in order to say that you do not like films."
    correct_option: "Ik houd niet van films"
    accepted_answers: [{value: "Ik houd niet van films", status: correct}]
    feedback: "Put niet between houd and van."
  nl.a1.unit13.lesson03.exercise05.fill_music:
    instruction: "Complete the fixed expression for being fond of music."
    accepted_answers: [{value: van, status: correct}]
    feedback: "The expression is houden van."
  nl.a1.unit13.lesson03.exercise06.translate_music:
    instruction: "Translate into Dutch using houden van."
    accepted_answers: [{value: "Ik houd van muziek.", status: correct}, {value: "Ik houd van muziek", status: correct}, {value: "Ik hou van muziek.", status: acceptable_with_note, note: "Hou is the common spoken form; this unit models houd."}, {value: "Ik hou van muziek", status: acceptable_with_note, note: "Hou is the common spoken form; this unit models houd."}]
    feedback: "Ik houd van muziek expresses a strong or general liking."

  nl.a1.unit13.lesson04.exercise01.choose_tea:
    instruction: "Choose the Dutch sentence that prefers tea over the other option."
    correct_option: "Ik wil liever thee."
    distractors: ["Ik liever wil thee.", "Ik wil thee lekker.", "Ik vind liever thee."]
    accepted_answers: [{value: "Ik wil liever thee.", status: correct}]
    feedback: "Place liever after wil."
  nl.a1.unit13.lesson04.exercise02.listen_tea:
    instruction: "Listen and choose what the speaker prefers."
    correct_option: tea
    distractors: [coffee, soup, bread]
    accepted_answers: [{value: tea, status: correct}]
    feedback: "The speaker says liever thee."
  nl.a1.unit13.lesson04.exercise03.listen_shirt:
    instruction: "Listen and choose which sweater the speaker prefers."
    correct_option: "the blue sweater"
    distractors: ["the red sweater", "the blue coat", "the red coat"]
    accepted_answers: [{value: "the blue sweater", status: correct}]
    feedback: "De blauwe trui means the blue sweater."
  nl.a1.unit13.lesson04.exercise04.order_choice:
    instruction: "Put the words in order to prefer the blue sweater."
    correct_option: "Ik heb liever de blauwe trui"
    accepted_answers: [{value: "Ik heb liever de blauwe trui", status: correct}]
    feedback: "Place liever after heb."
  nl.a1.unit13.lesson04.exercise05.listen_order_tea:
    instruction: "Listen and put the words in the order you hear."
    correct_option: "Ik wil liever thee"
    accepted_answers: [{value: "Ik wil liever thee", status: correct}]
    feedback: "The complete sentence is Ik wil liever thee."
  nl.a1.unit13.lesson04.exercise06.respond_choice:
    instruction: "Answer in Dutch that you would rather have tea."
    accepted_answers: [{value: "Ik wil liever thee.", status: correct}, {value: "Ik wil liever thee", status: correct}, {value: "Ik heb liever thee.", status: acceptable_with_note, note: "Ik heb liever thee is also natural for this choice."}, {value: "Ik heb liever thee", status: acceptable_with_note, note: "Ik heb liever thee is also natural for this choice."}]
    feedback: "Ik wil liever thee makes the preference explicit."
  nl.a1.unit13.lesson04.exercise07.write_choice:
    instruction: "Write the Dutch sentence using Ik heb liever ...."
    accepted_answers: [{value: "Ik heb liever de blauwe trui.", status: correct}, {value: "Ik heb liever de blauwe trui", status: correct}]
    feedback: "Use Ik heb liever followed by the selected item."

  nl.a1.unit13.lesson05.exercise01.read_writer:
    instruction: "Read the message and choose what the writer likes."
    correct_option: "the film"
    distractors: ["the café", "the supermarket", "shopping"]
    accepted_answers: [{value: "the film", status: correct}]
    feedback: "The writer says ik vind de film leuk."
  nl.a1.unit13.lesson05.exercise02.read_omar:
    instruction: "Read the message and choose what Omar does not like."
    correct_option: films
    distractors: [parks, walking, coffee]
    accepted_answers: [{value: films, status: correct}]
    feedback: "Omar houdt niet van films."
  nl.a1.unit13.lesson05.exercise03.read_choice:
    instruction: "Read the message and choose Omar's preferred destination."
    correct_option: "the park"
    distractors: ["the cinema", "the station", "the supermarket"]
    accepted_answers: [{value: "the park", status: correct}]
    feedback: "Hij wil liever naar het park."
  nl.a1.unit13.lesson05.exercise04.match_people:
    instruction: "Match each thing mentioned in the message to what the message says about it."
    accepted_answers: [{value: [{left: "de film", right: "the writer likes it"}, {left: Omar, right: "prefers the park"}, {left: wandelen, right: "the writer likes this too"}], status: correct}]
