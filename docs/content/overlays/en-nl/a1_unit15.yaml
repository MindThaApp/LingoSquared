course:
  title: "Dutch A1"
  description: "Beginner Dutch for handling a basic train journey: buying a ticket, understanding departure and delay announcements, and asking for directions at a station."

units:
  nl.a1.unit15.travel: {title: "Traveling by train"}

lessons:
  nl.a1.unit15.lesson01.een_kaartje_kopen: {title: "Buying a ticket"}
  nl.a1.unit15.lesson02.vertrektijd_en_perron: {title: "What time does the train leave?"}
  nl.a1.unit15.lesson03.vertraging: {title: "Delay"}
  nl.a1.unit15.lesson04.de_weg_op_het_station: {title: "Finding your way at the station"}
  nl.a1.unit15.lesson05.een_kaartje_lezen: {title: "Reading a train ticket"}
  nl.a1.unit15.lesson06.lotte_en_omar_op_reis: {title: "Lotte and Omar travel"}

teaching:
  nl.a1.unit15.lesson01.teach.kaartje: {title: "The ticket", gloss: "the ticket", note: "*Het kaartje* is a neuter noun; use *het*, not *de*.", example_gloss: "I would like a ticket to Utrecht."}
  nl.a1.unit15.lesson01.teach.wil_graag: {title: "Requesting a ticket", gloss: "I would like a ticket to Utrecht.", note: "*Wil graag* softens a request, the same pattern used for ordering food in Unit 6."}
  nl.a1.unit15.lesson01.teach.enkele_of_retour: {title: "The agent asks which kind", gloss: "Would you like a one-way ticket or a return?", note: "*Wilt u* is the formal you-form of *willen*, used here for an unfamiliar station employee."}
  nl.a1.unit15.lesson01.teach.retour_alstublieft: {title: "Answering politely", gloss: "A return, please.", note: "*Alstublieft* is the formal please, matching the *u* register of the exchange."}
  nl.a1.unit15.lesson01.teach.register_note: {title: "Register at the counter", gloss: "At the counter, you usually use the polite form u.", note: "Continues the *jij*/*je* vs. *u* distinction introduced in Unit 1: strangers in a service role default to *u*."}

  nl.a1.unit15.lesson02.teach.perron: {title: "The platform", gloss: "the platform", note: "*Het perron* is neuter; use *het*, not *de*.", example_gloss: "From which platform does the train to Utrecht leave?"}
  nl.a1.unit15.lesson02.teach.welk_perron: {title: "Asking which platform", gloss: "From which platform does the train to Utrecht leave?", note: "*Van welk perron* asks specifically for the platform, distinct from asking for a general location."}
  nl.a1.unit15.lesson02.teach.vertrektijd: {title: "Stating departure details", gloss: "The train leaves at a quarter to ten from platform five.", note: "*Kwart voor tien* reuses the clock-time pattern from Unit 4."}
  nl.a1.unit15.lesson02.teach.hoe_laat_aan: {title: "Asking arrival time", gloss: "What time does the train arrive?", note: "*Komt ... aan* is a separable verb (*aankomen*); *aan* moves to the end of the question."}
  nl.a1.unit15.lesson02.teach.aankomsttijd: {title: "Stating arrival time", gloss: "The train arrives at eleven o'clock.", note: "*Komt aan* again shows the separable verb's two parts split across the sentence."}

  nl.a1.unit15.lesson03.teach.op_tijd_de_vertraging: {title: "On time / the delay", gloss: "on time; the delay", note: "*Op tijd* is a fixed expression describing something happening as scheduled. *De vertraging* (the delay) is a common gender noun.", example_gloss: ["The train does not leave on time.", "Attention: the train to Utrecht is delayed."]}
  nl.a1.unit15.lesson03.teach.let_op: {title: "An announcement", gloss: "Attention: the train to Utrecht is delayed.", note: "*Let op* (literally 'pay attention') opens a station announcement, similar to English 'Attention, passengers.'"}
  nl.a1.unit15.lesson03.teach.niet_op_tijd: {title: "Negating on time", gloss: "The train does not leave on time.", note: "*Niet* stands right before *op tijd* to negate the whole expression."}
  nl.a1.unit15.lesson03.teach.ander_perron: {title: "A platform change", gloss: "The train leaves from platform three instead of platform five.", note: "*In plaats van* means 'instead of'."}
  nl.a1.unit15.lesson03.teach.tien_minuten_vertraging: {title: "Stating the delay length", gloss: "The train has a ten-minute delay.", note: "*Heeft vertraging* (literally 'has delay') is the natural way to state that something is delayed, alongside the adjective *vertraagd*."}

  nl.a1.unit15.lesson04.teach.ingang_uitgang_wachtruimte: {title: "Entrance, exit, waiting room", gloss: "the entrance; the exit; the waiting room", note: "*De ingang*, *de uitgang*, and *de wachtruimte* are all common gender nouns.", example_gloss: ["Where is the entrance?", "Where is the exit?", "Where is the waiting room?"]}
  nl.a1.unit15.lesson04.teach.waar_perron_zeven: {title: "Asking where a platform is", gloss: "Where is platform seven?", note: "This reuses the *Waar is...?* pattern from Unit 9's directions lessons."}
  nl.a1.unit15.lesson04.teach.rechtdoor_rechts: {title: "Giving directions", gloss: "Straight ahead and then right.", note: "*Rechtdoor* and *rechts* are the same direction words taught in Unit 9, reused here in a station context."}
  nl.a1.unit15.lesson04.teach.waar_wachtruimte: {title: "Asking about the waiting room", gloss: "Where is the waiting room?", note: "The same question pattern applied to a new place."}

  nl.a1.unit15.lesson05.teach.kaartje_tekst:
    title: "Read a printed ticket"
    gloss: "Ticket: Amsterdam Centraal to Utrecht Centraal. Departure: ten past ten, platform seven. Arrival: ten to eleven. Return. Price: twelve euros forty."
    note: "Track the departure time and platform, the arrival time, the ticket type, and the price."
    glosses:
      Kaartje: "ticket"
      Vertrek: "departure"
      tien: "ten"
      perron: "platform"
      zeven: "seven"
      Aankomst: "arrival"
      elf: "eleven"
      Retour: "return ticket"
      Prijs: "price"
      twaalf: "twelve"
      euro: "euros"
      veertig: "forty"

  nl.a1.unit15.lesson06.teach.omar_open: {title: "Omar states the plan", gloss: "Omar: We need to get to platform seven. The train leaves at ten past ten.", note: "*Moeten* (must/need to) expresses a practical necessity here, not a strict obligation."}
  nl.a1.unit15.lesson06.teach.lotte_sign: {title: "Lotte reads the sign", gloss: "Lotte: Look, there's the sign: delay, ten minutes.", note: "*Daar staat* (literally 'there stands') is the natural way to say a sign displays something."}
  nl.a1.unit15.lesson06.teach.omar_coffee: {title: "Omar stays calm", gloss: "Omar: No problem, we still have time for a coffee.", note: "*Geen probleem* is a common, casual reassurance."}
  nl.a1.unit15.lesson06.teach.lotte_train_arrives: {title: "The train arrives", gloss: "Lotte: Good idea. Oh, there's the train already. Platform seven, exactly!", note: "*Al* (already) signals the train arrived sooner than expected, given the delay just announced."}
  nl.a1.unit15.lesson06.teach.omar_board: {title: "They board the train", gloss: "Omar: Come on, let's get on. Utrecht, here we come!", note: "*Stappen in* (to get on/board) is a separable verb; *in* moves to the end of the clause. *We komen eraan* (literally 'we are coming to it') is the natural Dutch way to say 'here we come' -- a direct word-for-word translation would sound foreign."}

exercises:
  nl.a1.unit15.lesson01.exercise01.choose_ticket_request:
    instruction: "Choose the Dutch sentence meaning 'I would like a ticket to Utrecht.'"
    correct_option: "Ik wil graag een kaartje naar Utrecht."
    distractors: ["Ik wil graag een kaartje van Utrecht.", "Ik graag wil een kaartje naar Utrecht.", "Ik wil een graag kaartje naar Utrecht."]
    accepted_answers: [{value: "Ik wil graag een kaartje naar Utrecht.", status: correct}]
    feedback: "Wil graag softens the request; naar shows the destination."
  nl.a1.unit15.lesson01.exercise02.listen_ticket_type:
    instruction: "Listen and choose what the agent asks."
    correct_option: "Would you like a one-way ticket or a return?"
    distractors: ["Would you like a ticket to Utrecht?", "Would you like one ticket or two?", "Would you like to pay now?"]
    accepted_answers: [{value: "Would you like a one-way ticket or a return?", status: correct}]
    feedback: "Wilt u een enkele reis of een retour?"
  nl.a1.unit15.lesson01.exercise03.match_ticket_types:
    instruction: "Match each Dutch word or phrase to its meaning."
    accepted_answers: [{value: [{left: "een enkele reis", right: "a one-way ticket"}, {left: "een retour", right: "a return ticket"}, {left: "het kaartje", right: "the ticket"}, {left: "naar Utrecht", right: "to Utrecht"}, {left: alstublieft, right: please}, {left: "Wilt u ...?", right: "Would you like ...? (formal)"}], status: correct}]
    feedback: "Enkele reis is one-way; retour is a return ticket."
  nl.a1.unit15.lesson01.exercise04.order_ticket_request:
    instruction: "Put the words in order to request a ticket to Utrecht."
    correct_option: "Ik wil graag een kaartje naar Utrecht"
    accepted_answers: [{value: "Ik wil graag een kaartje naar Utrecht", status: correct}]
    feedback: "The complete sentence is Ik wil graag een kaartje naar Utrecht."
  nl.a1.unit15.lesson01.exercise05.listen_order_retour:
    instruction: "Listen and put the words in the order you hear."
    correct_option: "Een retour alstublieft"
    accepted_answers: [{value: "Een retour alstublieft", status: correct}]
    feedback: "The complete phrase is Een retour, alstublieft."
  nl.a1.unit15.lesson01.exercise06.complete_ticket_request:
    instruction: "Complete the polite request."
    accepted_answers: [{value: graag, status: correct}]
    feedback: "Ik wil graag een kaartje naar Utrecht."
  nl.a1.unit15.lesson01.exercise07.respond_counter:
    instruction: "Answer the agent politely: request a return ticket to Utrecht."
    accepted_answers: [{value: "Een retour naar Utrecht, alstublieft.", status: correct}, {value: "Een retour naar Utrecht alstublieft", status: correct}, {value: "Ik wil graag een retour naar Utrecht.", status: correct}, {value: "Ik wil graag een retour naar Utrecht", status: correct}, {value: "Een retour naar Utrecht, graag.", status: correct}, {value: "Een retour naar Utrecht graag", status: correct}]
    feedback: "Een retour naar Utrecht, alstublieft."

  nl.a1.unit15.lesson01.exercise08.dictation_een_retour_alstublieft:
    instruction: "Type what you hear."
    correct_option: "Een retour, alstublieft"
    accepted_answers: [{value: "Een retour, alstublieft", status: correct}]
    orthography_strict: true

  nl.a1.unit15.lesson02.exercise01.choose_platform_question:
    instruction: "Choose the Dutch sentence meaning 'From which platform does the train to Utrecht leave?'"
    correct_option: "Van welk perron vertrekt de trein naar Utrecht?"
    distractors: ["Van welk perron komt de trein naar Utrecht?", "Welk perron vertrekt de trein naar Utrecht?", "Van welk perron vertrekt de trein uit Utrecht?"]
    accepted_answers: [{value: "Van welk perron vertrekt de trein naar Utrecht?", status: correct}]
    feedback: "Van welk perron asks specifically for the platform."
  nl.a1.unit15.lesson02.exercise02.listen_departure:
    instruction: "Listen and choose what the speaker says."
    correct_option: "The train leaves at a quarter to ten from platform five."
    distractors: ["The train leaves at ten o'clock from platform five.", "The train arrives at a quarter to ten at platform five.", "The train leaves at a quarter to ten from platform three."]
    accepted_answers: [{value: "The train leaves at a quarter to ten from platform five.", status: correct}]
    feedback: "De trein vertrekt om kwart voor tien van perron vijf."
  nl.a1.unit15.lesson02.exercise03.match_travel_verbs:
    instruction: "Match each Dutch word or phrase to its meaning."
    accepted_answers: [{value: [{left: vertrekt, right: departs}, {left: "komt aan", right: arrives}, {left: "het perron", right: "the platform"}, {left: "het kaartje", right: "the ticket"}, {left: "een enkele reis", right: "a one-way ticket"}, {left: "een retour", right: "a return ticket"}], status: correct}]
    feedback: "Vertrekken is to depart; aankomen is to arrive."
  nl.a1.unit15.lesson02.exercise04.order_arrival_question:
    instruction: "Put the words in order to ask what time the train arrives."
    correct_option: "Hoe laat komt de trein aan"
    accepted_answers: [{value: "Hoe laat komt de trein aan", status: correct}]
    feedback: "The complete question is Hoe laat komt de trein aan?"
  nl.a1.unit15.lesson02.exercise05.listen_order_arrival:
    instruction: "Listen and put the words in the order you hear."
    correct_option: "De trein komt om elf uur aan"
    accepted_answers: [{value: "De trein komt om elf uur aan", status: correct}]
    feedback: "The complete sentence is De trein komt om elf uur aan."
  nl.a1.unit15.lesson02.exercise06.complete_platform:
    instruction: "Complete the sentence: the train leaves from platform five."
    accepted_answers: [{value: vijf, status: correct}]
    feedback: "De trein vertrekt van perron vijf."
  nl.a1.unit15.lesson02.exercise07.write_platform_question:
    instruction: "Write in Dutch: ask from which platform the train to Utrecht departs."
    accepted_answers: [{value: "Van welk perron vertrekt de trein naar Utrecht?", status: correct}, {value: "Van welk perron vertrekt de trein naar Utrecht", status: correct}]
    feedback: "Van welk perron vertrekt de trein naar Utrecht?"

  nl.a1.unit15.lesson03.exercise01.choose_delayed:
    instruction: "Choose the Dutch sentence meaning 'The train to Utrecht is delayed.'"
    correct_option: "De trein naar Utrecht heeft vertraging."
    distractors: ["De trein naar Utrecht is op tijd.", "De trein naar Utrecht heeft een kaartje.", "De trein naar Utrecht vertrekt niet."]
    accepted_answers: [{value: "De trein naar Utrecht heeft vertraging.", status: correct}]
    feedback: "Heeft vertraging states that the train is delayed."
  nl.a1.unit15.lesson03.exercise02.listen_new_platform:
    instruction: "Listen and choose what the announcement says."
    correct_option: "The train leaves from platform three instead of platform five."
    distractors: ["The train leaves from platform five instead of platform three.", "The train leaves on time from platform five.", "The train is cancelled."]
    accepted_answers: [{value: "The train leaves from platform three instead of platform five.", status: correct}]
    feedback: "De trein vertrekt van perron drie in plaats van perron vijf."
  nl.a1.unit15.lesson03.exercise03.match_delay_terms:
    instruction: "Match each Dutch expression to its meaning."
    accepted_answers: [{value: [{left: "op tijd", right: "on time"}, {left: "de vertraging", right: "the delay"}, {left: vertrekt, right: departs}, {left: "komt aan", right: arrives}, {left: "het perron", right: "the platform"}, {left: "het kaartje", right: "the ticket"}, {left: "een enkele reis", right: "a one-way ticket"}, {left: "een retour", right: "a return ticket"}], status: correct}]
    feedback: "Op tijd is the opposite of having vertraging."
  nl.a1.unit15.lesson03.exercise04.order_not_on_time:
    instruction: "Put the words in order to say the train does not leave on time."
    correct_option: "De trein vertrekt niet op tijd"
    accepted_answers: [{value: "De trein vertrekt niet op tijd", status: correct}]
    feedback: "The complete sentence is De trein vertrekt niet op tijd."
  nl.a1.unit15.lesson03.exercise05.listen_order_announcement:
    instruction: "Listen and put the words in the order you hear."
    correct_option: "Let op de trein naar Utrecht heeft vertraging"
    accepted_answers: [{value: "Let op de trein naar Utrecht heeft vertraging", status: correct}]
    feedback: "The complete announcement is Let op: de trein naar Utrecht heeft vertraging."
  nl.a1.unit15.lesson03.exercise06.complete_not_on_time:
    instruction: "Complete the sentence."
    accepted_answers: [{value: op, status: correct}]
    feedback: "De trein vertrekt niet op tijd."
  nl.a1.unit15.lesson03.exercise07.write_delay:
    instruction: "Write in Dutch: The train has a ten-minute delay."
    accepted_answers: [{value: "De trein heeft tien minuten vertraging.", status: correct}, {value: "De trein heeft tien minuten vertraging", status: correct}]
    feedback: "De trein heeft tien minuten vertraging."

  nl.a1.unit15.lesson04.exercise01.choose_platform_location:
    instruction: "Choose the Dutch sentence meaning 'Where is platform seven?'"
    correct_option: "Waar is perron zeven?"
    distractors: ["Waar is perron zeven vandaan?", "Wat is perron zeven?", "Waar is de wachtruimte zeven?"]
    accepted_answers: [{value: "Waar is perron zeven?", status: correct}]
    feedback: "Waar is...? asks for a location, the same pattern from Unit 9."
  nl.a1.unit15.lesson04.exercise02.listen_directions:
    instruction: "Listen and choose the directions given."
    correct_option: "Straight ahead and then right."
    distractors: ["Straight ahead and then left.", "Turn right and then straight ahead.", "Turn left and then right."]
    accepted_answers: [{value: "Straight ahead and then right.", status: correct}]
    feedback: "Rechtdoor en dan rechts."
  nl.a1.unit15.lesson04.exercise03.match_station_places:
    instruction: "Match each Dutch station word to its meaning."
    accepted_answers: [{value: [{left: "de ingang", right: "the entrance"}, {left: "de uitgang", right: "the exit"}, {left: "de wachtruimte", right: "the waiting room"}, {left: "op tijd", right: "on time"}, {left: "de vertraging", right: "the delay"}, {left: vertrekt, right: departs}, {left: "komt aan", right: arrives}, {left: "het perron", right: "the platform"}, {left: "het kaartje", right: "the ticket"}, {left: "een enkele reis", right: "a one-way ticket"}, {left: "een retour", right: "a return ticket"}], status: correct}]
    feedback: "Ingang, uitgang, and wachtruimte are common words for finding your way around a station."
  nl.a1.unit15.lesson04.exercise04.order_waiting_room:
    instruction: "Put the words in order to ask where the waiting room is."
    correct_option: "Waar is de wachtruimte"
    accepted_answers: [{value: "Waar is de wachtruimte", status: correct}]
    feedback: "The complete question is Waar is de wachtruimte?"
  nl.a1.unit15.lesson04.exercise05.listen_order_platform:
    instruction: "Listen and put the words in the order you hear."
    correct_option: "Waar is perron zeven"
    accepted_answers: [{value: "Waar is perron zeven", status: correct}]
    feedback: "The complete question is Waar is perron zeven?"
  nl.a1.unit15.lesson04.exercise06.complete_directions:
    instruction: "Complete the directions: straight ahead and then right."
    accepted_answers: [{value: Rechtdoor, status: correct}, {value: rechtdoor, status: correct}]
    feedback: "Rechtdoor en dan rechts."
  nl.a1.unit15.lesson04.exercise07.respond_platform_directions:
    instruction: "Answer in Dutch: platform seven is straight ahead and then right."
    accepted_answers: [{value: "Perron zeven is rechtdoor en dan rechts.", status: correct}, {value: "Perron zeven is rechtdoor en dan rechts", status: correct}, {value: "Rechtdoor en dan rechts.", status: correct}, {value: "Rechtdoor en dan rechts", status: correct}]
    feedback: "Perron zeven is rechtdoor en dan rechts."

  nl.a1.unit15.lesson05.exercise01.read_platform:
    instruction: "Read the ticket and choose the departure platform."
    correct_option: "platform seven"
    distractors: ["platform five", "platform three", "platform eleven"]
    accepted_answers: [{value: "platform seven", status: correct}]
    feedback: "Vertrek: ... perron zeven."
  nl.a1.unit15.lesson05.exercise02.read_arrival_time:
    instruction: "Read the ticket and choose the arrival time in Utrecht."
    correct_option: "ten to eleven"
    distractors: ["ten past ten", "eleven o'clock", "ten past eleven"]
    accepted_answers: [{value: "ten to eleven", status: correct}]
    feedback: "Aankomst: tien voor elf."
  nl.a1.unit15.lesson05.exercise03.read_ticket_type:
    instruction: "Read the ticket and choose the ticket type."
    correct_option: "a return ticket"
    distractors: ["a one-way ticket", "a season ticket", "a group ticket"]
    accepted_answers: [{value: "a return ticket", status: correct}]
    feedback: "The ticket says Retour."
  nl.a1.unit15.lesson05.exercise04.listen_ticket:
    instruction: "Listen and choose the departure details."
    correct_option: "ten past ten, platform seven"
    distractors: ["ten to eleven, platform seven", "ten past ten, platform five", "ten past ten, platform three"]
    accepted_answers: [{value: "ten past ten, platform seven", status: correct}]
    feedback: "Vertrek: tien over tien, perron zeven."
  nl.a1.unit15.lesson05.exercise05.match_ticket_fields:
    instruction: "Match each field on the ticket to its value."
    accepted_answers: [{value: [{left: Vertrek, right: "tien over tien"}, {left: Aankomst, right: "tien voor elf"}, {left: Prijs, right: "twaalf euro veertig"}], status: correct}]
    feedback: "Vertrek is departure, aankomst is arrival, and prijs is the price."
  nl.a1.unit15.lesson05.exercise06.write_ticket_request:
    instruction: "Write in Dutch, using Ik wil graag ..., that you would like a return ticket to Utrecht."
    accepted_answers: [{value: "Ik wil graag een retour naar Utrecht.", status: correct}, {value: "Ik wil graag een retour naar Utrecht", status: correct}]
    feedback: "Ik wil graag een retour naar Utrecht."

  nl.a1.unit15.lesson06.exercise01.listen_open:
    instruction: "Listen and choose what Omar says."
    correct_option: "We need to get to platform seven."
    distractors: ["We need to buy a ticket.", "We need to find the waiting room.", "We need to get to platform five."]
    accepted_answers: [{value: "We need to get to platform seven.", status: correct}]
    feedback: "We moeten naar perron zeven."
  nl.a1.unit15.lesson06.exercise02.comprehend_sign:
    instruction: "Listen to the dialogue and choose what the sign says."
    correct_option: "a ten-minute delay"
    distractors: ["the train is cancelled", "the platform changed", "the train is on time"]
    accepted_answers: [{value: "a ten-minute delay", status: correct}]
