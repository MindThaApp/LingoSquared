course:
  title: "Dutch A1"
  description: "Beginner Dutch for describing a basic home, its rooms, and simple features like a balcony or garden."

units:
  nl.a1.unit18.housing: {title: "Home"}

lessons:
  nl.a1.unit18.lesson01.mijn_appartement: {title: "My apartment"}
  nl.a1.unit18.lesson02.hoeveel_kamers: {title: "How many rooms do you have?"}
  nl.a1.unit18.lesson03.balkon_en_tuin: {title: "The balcony and the garden"}
  nl.a1.unit18.lesson04.groot_of_klein: {title: "Big or small?"}
  nl.a1.unit18.lesson05.advertentie_lezen: {title: "Reading a housing ad"}
  nl.a1.unit18.lesson06.nieuw_appartement: {title: "Omar's new apartment"}

teaching:
  nl.a1.unit18.lesson01.teach.appartement_woonkamer_slaapkamer: {title: "Apartment, living room, bedroom", gloss: "the apartment, the living room, the bedroom", note: "*Het appartement* is a neuter noun; *de woonkamer* and *de slaapkamer* are common gender nouns."}
  nl.a1.unit18.lesson01.teach.keuken_badkamer: {title: "Kitchen, bathroom", gloss: "the kitchen, the bathroom", note: "*De keuken* and *de badkamer* are both common gender nouns."}
  nl.a1.unit18.lesson01.teach.appartement_utrecht: {title: "Stating you have an apartment", gloss: "I have an apartment.", note: "*Hebben* (to have) is the natural verb for describing what home you have, the same way English uses 'have.' This is a general example; Omar's own specific apartment (in Utrecht) is introduced later in this unit."}

  nl.a1.unit18.lesson02.teach.hoeveel_kamers: {title: "Asking how many rooms", gloss: "How many rooms do you have?", note: "*Hoeveel* (how many/how much) reuses the quantity-question pattern from earlier number lessons."}
  nl.a1.unit18.lesson02.teach.twee_slaapkamers: {title: "Stating a room count", gloss: "I have two bedrooms.", note: "*Slaapkamers* is the plural of *slaapkamer*, formed regularly with -s."}
  nl.a1.unit18.lesson02.teach.drie_kamers: {title: "Stating a total room count", gloss: "The apartment has three rooms.", note: "*Kamers* is a general word for rooms, not limited to bedrooms."}

  nl.a1.unit18.lesson03.teach.balkon_tuin: {title: "Balcony, garden", gloss: "the balcony, the garden", note: "*Het balkon* is neuter; *de tuin* is a common gender noun."}
  nl.a1.unit18.lesson03.teach.er_is_balkon: {title: "Saying something exists", gloss: "There is a balcony.", note: "*Er is* is the standard Dutch existential construction, equivalent to English 'there is.'"}
  nl.a1.unit18.lesson03.teach.geen_tuin: {title: "Saying something doesn't exist", gloss: "There is no garden.", note: "*Geen* negates an indefinite noun -- *geen tuin*, not *niet een tuin*."}

  nl.a1.unit18.lesson04.teach.gezellig: {title: "Cozy", gloss: "cozy", note: "A very common, distinctively Dutch adjective for a warm, pleasant atmosphere -- not a literal translation of any single English word."}
  nl.a1.unit18.lesson04.teach.klein_maar_gezellig: {title: "A common description pattern", gloss: "The apartment is small but cozy.", note: "*Klein maar gezellig* is an extremely common, natural way Dutch speakers describe a compact home positively."}
  nl.a1.unit18.lesson04.teach.woonkamer_groot: {title: "Describing a room's size", gloss: "The living room is big.", note: "*Groot* describing a specific room, not the whole home."}
  nl.a1.unit18.lesson04.teach.keuken_klein: {title: "Describing another room's size", gloss: "The kitchen is small.", note: "Same pattern as the previous card's *groot*, applied to a different room with *klein*."}

  nl.a1.unit18.lesson05.teach.advertentie: {title: "Read a housing advertisement", gloss: "Apartment in Utrecht: one bedroom, a living room, a kitchen, and a bathroom. There is a balcony, but no garden. The apartment is small but cozy.", note: "Track the room count, which features are present or absent, and the overall impression given."}

  nl.a1.unit18.lesson06.teach.lotte_ask: {title: "Lotte asks about the apartment", gloss: "Lotte: Hi Omar, how's your new apartment in Utrecht?", note: "*Nieuwe* is the inflected form of *nieuw* (new), used before a noun."}
  nl.a1.unit18.lesson06.teach.omar_describe: {title: "Omar describes it", gloss: "Omar: It's small but cozy. I have one bedroom, a living room, a kitchen, and a bathroom.", note: "Matches the housing ad read in lesson05 exactly -- this is Omar's actual apartment."}
  nl.a1.unit18.lesson06.teach.lotte_ask_balcony: {title: "Lotte asks about the balcony", gloss: "Lotte: Do you have a balcony?", note: "A direct yes/no question reusing *heb je ...?* from earlier units."}
  nl.a1.unit18.lesson06.teach.omar_balcony_answer: {title: "Omar answers", gloss: "Omar: Yes, I have a balcony, but no garden.", note: "Matches the balcony/no-garden fact from lesson05's ad."}
  nl.a1.unit18.lesson06.teach.hij_pronoun_note: {title: "Using hij for Omar", gloss: "Instead of Omar you can also say hij: he has a balcony.", note: "*Hij* (he) can replace Omar's name once he's already been introduced in the conversation."}
  nl.a1.unit18.lesson06.teach.lotte_reaction: {title: "Lotte reacts warmly", gloss: "Lotte: That sounds nice! I'll come by sometime soon.", note: "*Komen langs* (to come by/visit) is a separable verb; *langs* moves to the end of the clause."}
  nl.a1.unit18.lesson06.teach.omar_welcome: {title: "Omar welcomes her", gloss: "Omar: Great, you're always welcome.", note: "*Altijd welkom* is a warm, natural way to invite someone back."}

exercises:
  nl.a1.unit18.lesson01.exercise01.choose_apartment:
    instruction: "Choose the Dutch sentence meaning 'I have an apartment.'"
    correct_option: "Ik heb een appartement."
    distractors: ["Ik ben een appartement.", "Ik heb een huis.", "Ik zoek een appartement."]
    accepted_answers: [{value: "Ik heb een appartement.", status: correct}]
    feedback: "Hebben is the natural verb for describing what home you have."
  nl.a1.unit18.lesson01.exercise02.listen_apartment:
    instruction: "Listen and choose what the speaker says."
    correct_option: "I have an apartment."
    distractors: ["I have a house.", "How many rooms do you have?", "I am looking for an apartment."]
    accepted_answers: [{value: "I have an apartment.", status: correct}]
    feedback: "Ik heb een appartement."
  nl.a1.unit18.lesson01.exercise03.match_rooms:
    instruction: "Match each Dutch room name to its meaning."
    accepted_answers: [{value: [{left: "de woonkamer", right: "living room"}, {left: "de slaapkamer", right: bedroom}, {left: "de keuken", right: kitchen}, {left: "de badkamer", right: bathroom}], status: correct}]
    feedback: "These are the four most common rooms in a Dutch apartment."
  nl.a1.unit18.lesson01.exercise04.order_apartment:
    instruction: "Put the words in order to say you have an apartment."
    correct_option: "Ik heb een appartement"
    accepted_answers: [{value: "Ik heb een appartement", status: correct}]
    feedback: "The complete sentence is Ik heb een appartement."
  nl.a1.unit18.lesson01.exercise05.listen_order_apartment:
    instruction: "Listen and put the words in the order you hear."
    correct_option: "Ik heb een appartement"
    accepted_answers: [{value: "Ik heb een appartement", status: correct}]
    feedback: "The complete sentence is Ik heb een appartement."
  nl.a1.unit18.lesson01.exercise06.complete_apartment:
    instruction: "Complete the sentence."
    accepted_answers: [{value: appartement, status: correct}]
    feedback: "Ik heb een appartement."
  nl.a1.unit18.lesson01.exercise07.write_rooms:
    instruction: "Write in Dutch: say you have a living room, a bedroom, a kitchen, and a bathroom."
    accepted_answers: [{value: "Ik heb een woonkamer, een slaapkamer, een keuken en een badkamer.", status: correct}, {value: "Ik heb een woonkamer een slaapkamer een keuken en een badkamer", status: correct}]
    feedback: "Ik heb een woonkamer, een slaapkamer, een keuken en een badkamer."

  nl.a1.unit18.lesson02.exercise01.choose_two_bedrooms:
    instruction: "Choose the Dutch sentence meaning 'I have two bedrooms.'"
    correct_option: "Ik heb twee slaapkamers."
    distractors: ["Ik heb twee slaapkamer.", "Ik ben twee slaapkamers.", "Ik heb twee kamers."]
    accepted_answers: [{value: "Ik heb twee slaapkamers.", status: correct}]
    feedback: "Slaapkamers is the plural form, formed with -s."
  nl.a1.unit18.lesson02.exercise02.listen_room_count:
    instruction: "Listen and choose what is asked."
    correct_option: "How many rooms do you have?"
    distractors: ["How many bedrooms do you have?", "Where do you live?", "Do you have a balcony?"]
    accepted_answers: [{value: "How many rooms do you have?", status: correct}]
    feedback: "Hoeveel kamers heb je?"
  nl.a1.unit18.lesson02.exercise03.match_counts:
    instruction: "Match each Dutch phrase to its meaning."
    accepted_answers: [{value: [{left: "twee slaapkamers", right: "two bedrooms"}, {left: "drie kamers", right: "three rooms"}], status: correct}]
    feedback: "Slaapkamers refers specifically to bedrooms; kamers is the general word for rooms."
  nl.a1.unit18.lesson02.exercise04.order_three_rooms:
    instruction: "Put the words in order to say the apartment has three rooms."
    correct_option: "Het appartement heeft drie kamers"
    accepted_answers: [{value: "Het appartement heeft drie kamers", status: correct}]
    feedback: "The complete sentence is Het appartement heeft drie kamers."
  nl.a1.unit18.lesson02.exercise05.complete_room_count:
    instruction: "Complete the sentence."
    accepted_answers: [{value: twee, status: correct}]
    feedback: "Ik heb twee slaapkamers."
  nl.a1.unit18.lesson02.exercise06.respond_room_count:
    instruction: "Answer in Dutch: say you have two bedrooms."
    accepted_answers: [{value: "Ik heb twee slaapkamers.", status: correct}, {value: "Ik heb twee slaapkamers", status: correct}]
    feedback: "Ik heb twee slaapkamers."

  nl.a1.unit18.lesson03.exercise01.choose_balcony:
    instruction: "Choose the Dutch sentence meaning 'There is a balcony.'"
    correct_option: "Er is een balkon."
    distractors: ["Er heeft een balkon.", "Het is een balkon.", "Er is geen balkon."]
    accepted_answers: [{value: "Er is een balkon.", status: correct}]
    feedback: "Er is is the standard existential construction."
  nl.a1.unit18.lesson03.exercise02.listen_no_garden:
    instruction: "Listen and choose what the speaker says."
    correct_option: "There is no garden."
    distractors: ["There is a garden.", "There is a balcony.", "There is no balcony."]
    accepted_answers: [{value: "There is no garden.", status: correct}]
    feedback: "Er is geen tuin."
  nl.a1.unit18.lesson03.exercise03.match_features:
    instruction: "Match each Dutch word to its meaning."
    accepted_answers: [{value: [{left: "het balkon", right: "the balcony"}, {left: "de tuin", right: "the garden"}], status: correct}]
    feedback: "Balkon and tuin are common features to mention when describing a home."
  nl.a1.unit18.lesson03.exercise04.order_balcony:
    instruction: "Put the words in order to say there is a balcony."
    correct_option: "Er is een balkon"
    accepted_answers: [{value: "Er is een balkon", status: correct}]
    feedback: "The complete sentence is Er is een balkon."
  nl.a1.unit18.lesson03.exercise05.complete_no_garden:
    instruction: "Complete the sentence to say there is no garden."
    accepted_answers: [{value: geen, status: correct}]
    feedback: "Er is geen tuin."
  nl.a1.unit18.lesson03.exercise06.translate_no_garden:
    instruction: "Translate into Dutch."
    accepted_answers: [{value: "Er is geen tuin.", status: correct}, {value: "Er is geen tuin", status: correct}]
    feedback: "Er is geen tuin."

  nl.a1.unit18.lesson04.exercise01.choose_cozy:
    instruction: "Choose the Dutch sentence meaning 'The apartment is small but cozy.'"
    correct_option: "Het appartement is klein maar gezellig."
    distractors: ["Het appartement is groot maar gezellig.", "Het appartement is klein en gezellig.", "Het appartement is klein maar duur."]
    accepted_answers: [{value: "Het appartement is klein maar gezellig.", status: correct}]
    feedback: "Klein maar gezellig is an extremely common, natural description in Dutch."
  nl.a1.unit18.lesson04.exercise02.listen_cozy:
    instruction: "Listen and choose what the speaker says."
    correct_option: "The apartment is small but cozy."
    distractors: ["The apartment is big and cozy.", "The living room is big.", "The kitchen is small."]
    accepted_answers: [{value: "The apartment is small but cozy.", status: correct}]
    feedback: "Het appartement is klein maar gezellig."
  nl.a1.unit18.lesson04.exercise03.match_room_sizes:
    instruction: "Match each room to its size in this lesson's examples."
    accepted_answers: [{value: [{left: "de woonkamer", right: groot}, {left: "de keuken", right: klein}], status: correct}]
    feedback: "The living room is described as big; the kitchen as small."
  nl.a1.unit18.lesson04.exercise04.order_living_room_big:
    instruction: "Put the words in order to say the living room is big."
    correct_option: "De woonkamer is groot"
    accepted_answers: [{value: "De woonkamer is groot", status: correct}]
    feedback: "The complete sentence is De woonkamer is groot."
  nl.a1.unit18.lesson04.exercise05.complete_cozy:
    instruction: "Complete the sentence."
    accepted_answers: [{value: gezellig, status: correct}]
    feedback: "Het appartement is klein maar gezellig."
  nl.a1.unit18.lesson04.exercise06.write_kitchen_small:
    instruction: "Write in Dutch: the kitchen is small."
    accepted_answers: [{value: "De keuken is klein.", status: correct}, {value: "De keuken is klein", status: correct}]
    feedback: "De keuken is klein."

  nl.a1.unit18.lesson05.exercise01.read_bedroom_count:
    instruction: "Read the advertisement and choose the number of bedrooms."
    correct_option: one
    distractors: [two, three, zero]
    accepted_answers: [{value: one, status: correct}]
    feedback: "Appartement in Utrecht: één slaapkamer."
  nl.a1.unit18.lesson05.exercise02.read_features:
    instruction: "Read the advertisement and choose which features the apartment has."
    correct_option: "a balcony but no garden"
    distractors: ["a garden but no balcony", "both a balcony and a garden", "neither a balcony nor a garden"]
    accepted_answers: [{value: "a balcony but no garden", status: correct}]
    feedback: "Er is een balkon, maar geen tuin."
  nl.a1.unit18.lesson05.exercise03.read_impression:
    instruction: "Read the advertisement and choose the overall impression it gives."
    correct_option: "small but cozy"
    distractors: ["big but plain", "small and cramped", "big and cozy"]
    accepted_answers: [{value: "small but cozy", status: correct}]
    feedback: "Het appartement is klein maar gezellig."
  nl.a1.unit18.lesson05.exercise04.listen_ad:
    instruction: "Listen and choose which features the apartment has."
    correct_option: "a balcony but no garden"
    distractors: ["a garden but no balcony", "both a balcony and a garden", "neither"]
    accepted_answers: [{value: "a balcony but no garden", status: correct}]
    feedback: "Er is een balkon, maar geen tuin."
  nl.a1.unit18.lesson05.exercise05.match_ad_details:
    instruction: "Match each detail in the ad to what it says."
    accepted_answers: [{value: [{left: slaapkamer, right: "one, plus a living room, kitchen, and bathroom"}, {left: balkon, right: "present"}, {left: tuin, right: "not present"}], status: correct}]
    feedback: "The ad states the room count and which two outdoor features are present or absent."
  nl.a1.unit18.lesson05.exercise06.write_ad_summary:
    instruction: "Write in Dutch: the apartment has a balcony but no garden."
    accepted_answers: [{value: "Het appartement heeft een balkon, maar geen tuin.", status: correct}, {value: "Het appartement heeft een balkon maar geen tuin", status: correct}]
    feedback: "Het appartement heeft een balkon, maar geen tuin."

  nl.a1.unit18.lesson06.exercise01.listen_ask_apartment:
    instruction: "Listen and choose what Lotte asks."
    correct_option: "How's your new apartment in Utrecht?"
    distractors: ["Do you have a new apartment?", "Where is your apartment?", "How many rooms does your apartment have?"]
    accepted_answers: [{value: "How's your new apartment in Utrecht?", status: correct}]
    feedback: "Hoe is je nieuwe appartement in Utrecht?"
  nl.a1.unit18.lesson06.exercise02.comprehend_impression:
    instruction: "Listen to the dialogue and choose how Omar describes his apartment overall."
    correct_option: "small but cozy"
    distractors: ["big but plain", "small and cramped", "big and cozy"]
    accepted_answers: [{value: "small but cozy", status: correct}]
    feedback: "Omar says: Het is klein maar gezellig."
  nl.a1.unit18.lesson06.exercise03.comprehend_rooms:
    instruction: "Listen to the dialogue and choose which rooms Omar says his apartment has."
    correct_option: "one bedroom, a living room, a kitchen, and a bathroom"
    distractors: ["two bedrooms, a living room, and a kitchen", "one bedroom and a kitchen only", "a living room, a kitchen, and a balcony"]
    accepted_answers: [{value: "one bedroom, a living room, a kitchen, and a bathroom", status: correct}]
    feedback: "Omar says: Ik heb één slaapkamer, een woonkamer, een keuken en een badkamer."
  nl.a1.unit18.lesson06.exercise04.comprehend_balcony_garden:
    instruction: "Listen to the dialogue and choose whether Omar's apartment has a balcony, a garden, both, or neither."
    correct_option: "a balcony but no garden"
    distractors: ["a garden but no balcony", "both a balcony and a garden", "neither a balcony nor a garden"]
    accepted_answers: [{value: "a balcony but no garden", status: correct}]
    feedback: "Omar says: Ja, ik heb een balkon, maar geen tuin."
  nl.a1.unit18.lesson06.exercise05.order_balcony_no_garden:
    instruction: "Put the words in order to say you have a balcony but no garden."
    correct_option: "Ik heb een balkon maar geen tuin"
    accepted_answers: [{value: "Ik heb een balkon maar geen tuin", status: correct}]
    feedback: "The complete sentence is Ik heb een balkon maar geen tuin."
  nl.a1.unit18.lesson06.exercise06.respond_has_balcony:
    instruction: "Answer in Dutch: say yes, you have a balcony but no garden."
    accepted_answers: [{value: "Ja, ik heb een balkon, maar geen tuin.", status: correct}, {value: "Ja ik heb een balkon maar geen tuin", status: correct}]
    feedback: "Ja, ik heb een balkon, maar geen tuin."
  nl.a1.unit18.lesson06.exercise07.listen_type_visit:
    instruction: "Listen and type the complete Dutch sentences."
    accepted_answers: [{value: "Dat klinkt fijn! Ik kom snel een keer langs.", status: correct}, {value: "Dat klinkt fijn Ik kom snel een keer langs", status: correct}, {value: "Dat klinkt fijn, en ik kom snel een keer langs.", status: correct}, {value: "Dat klinkt fijn, en ik kom snel een keer langs", status: correct}]
    feedback: "Dat klinkt fijn! Ik kom snel een keer langs."
  nl.a1.unit18.lesson06.exercise08.write_apartment_summary:
    instruction: "Write in Dutch: Omar has an apartment in Utrecht. He has a balcony but no garden."
    accepted_answers: [{value: "Omar heeft een appartement in Utrecht. Hij heeft een balkon, maar geen tuin.", status: correct}, {value: "Omar heeft een appartement in Utrecht Hij heeft een balkon maar geen tuin", status: correct}, {value: "Omar heeft een appartement in Utrecht, en hij heeft een balkon, maar geen tuin.", status: correct}, {value: "Omar heeft een appartement in Utrecht, en hij heeft een balkon, maar geen tuin", status: correct}]
    feedback: "Omar heeft een appartement in Utrecht. Hij heeft een balkon, maar geen tuin."
