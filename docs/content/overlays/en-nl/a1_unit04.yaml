teaching:
  nl.a1.unit04.lesson01.teach.hour: {title: "Hour", gloss: "the hour", note: "Uur follows the number for an exact whole hour: twee uur is two o'clock."}
  nl.a1.unit04.lesson01.teach.two_oclock: {title: "Two o'clock", gloss: "2:00 — two o'clock", note: "For a whole hour, say the number followed by uur."}
  nl.a1.unit04.lesson01.teach.three_oclock: {title: "Three o'clock", gloss: "3:00 — three o'clock", note: "Drie uur is exactly 3:00."}
  nl.a1.unit04.lesson01.teach.half_three: {title: "Halfway to three", gloss: "2:30 — half past two", note: "Critical difference from English: Dutch half drie names the upcoming hour. It is 2:30, not 3:30."}
  nl.a1.unit04.lesson01.teach.half_rule: {title: "Half points to the next hour", gloss: "half three = halfway toward three o'clock = 2:30", note: "Read half + hour as halfway toward that hour. Therefore half vier is 3:30."}
  nl.a1.unit04.lesson01.teach.half_four: {title: "Halfway to four", gloss: "3:30 — half past three", note: "Half vier is halfway toward four, so it means 3:30."}
  nl.a1.unit04.lesson01.teach.time_answer: {title: "State a half hour", gloss: "It is half past two.", note: "Het is ... is the normal frame for stating the current time."}

  nl.a1.unit04.lesson02.teach.quarter: {title: "Quarter hour", gloss: "the quarter hour", note: "Kwart is used in the fixed clock expressions kwart over and kwart voor."}
  nl.a1.unit04.lesson02.teach.quarter_past_two: {title: "Quarter past two", gloss: "2:15 — quarter past two", note: "Kwart over twee is fifteen minutes after two."}
  nl.a1.unit04.lesson02.teach.past_rule: {title: "Over means past", gloss: "past = after the whole hour", note: "In a clock expression, over counts forward from the hour just passed."}
  nl.a1.unit04.lesson02.teach.quarter_to_three: {title: "Quarter to three", gloss: "2:45 — quarter to three", note: "Kwart voor drie is fifteen minutes before three, so it is 2:45."}
  nl.a1.unit04.lesson02.teach.to_rule: {title: "Voor means to", gloss: "to = before the next whole hour", note: "In a clock expression, voor points toward the next hour."}
  nl.a1.unit04.lesson02.teach.quarter_past_three: {title: "Quarter past three", gloss: "3:15 — quarter past three", note: "Over keeps the hour that has just passed: kwart over drie."}
  nl.a1.unit04.lesson02.teach.quarter_to_four: {title: "Quarter to four", gloss: "3:45 — quarter to four", note: "Voor names the approaching hour: kwart voor vier is 3:45."}

  nl.a1.unit04.lesson03.teach.ask_time: {title: "Ask the time", gloss: "What time is it?", note: "Hoe laat is het? is the standard everyday question for the current time."}
  nl.a1.unit04.lesson03.teach.tell_time: {title: "Tell the time", gloss: "It is half past two.", note: "Remember that the Dutch hour word drie makes this 2:30."}
  nl.a1.unit04.lesson03.teach.ask_start: {title: "Ask when an activity starts", gloss: "What time does the language café start?", note: "Hoe laat begins a question asking for a clock time."}
  nl.a1.unit04.lesson03.teach.at_quarter: {title: "At quarter past two", gloss: "At quarter past two.", note: "Use om before the time when saying when an event happens."}
  nl.a1.unit04.lesson03.teach.at_rule: {title: "Use om for an event time", gloss: "at + time: at two o'clock, at half past two", note: "Do not use om when merely saying the current time with Het is."}
  nl.a1.unit04.lesson03.teach.late: {title: "Ask if you are late", gloss: "Am I late?", note: "Laat means late here; the phrase belongs naturally in a timing exchange."}
  nl.a1.unit04.lesson03.teach.on_time: {title: "Say someone is on time", gloss: "No, you are on time.", note: "Op tijd means on time. Je keeps the exchange informal."}

  nl.a1.unit04.lesson04.teach.twenty_four_hour: {title: "Fourteen hundred", gloss: "14:00 — fourteen hundred hours", note: "Schedules and announcements commonly use the 24-hour clock. Veertien uur is an unambiguous spoken reading of 14:00."}
  nl.a1.unit04.lesson04.teach.eighteen_hour: {title: "Eighteen hundred", gloss: "18:00 — eighteen hundred hours", note: "Achttien uur is the 24-hour-clock form for 6 p.m."}
  nl.a1.unit04.lesson04.teach.morning: {title: "Seven in the morning", gloss: "7:00 — seven o'clock in the morning", note: "'s Ochtends means in the morning. The leading 's is part of the fixed expression."}
  nl.a1.unit04.lesson04.teach.afternoon: {title: "Two in the afternoon", gloss: "14:00 — two o'clock in the afternoon", note: "'s Middags covers the afternoon, beginning around noon; it distinguishes 14:00 from 02:00 in 12-hour speech."}
  nl.a1.unit04.lesson04.teach.evening: {title: "Eight in the evening", gloss: "20:00 — eight o'clock in the evening", note: "'s Avonds is used for evening time, broadly after the late afternoon until around midnight."}
  nl.a1.unit04.lesson04.teach.night: {title: "Two at night", gloss: "2:00 — two o'clock at night", note: "'s Nachts is used for the overnight hours; 02:00 is naturally twee uur 's nachts."}
  nl.a1.unit04.lesson04.teach.day_parts: {title: "Parts of the day", gloss: "the morning · the afternoon · the evening · the night", note: "Dutch boundaries are approximate: ochtend runs to around noon, middag from noon through the afternoon, avond through the evening, and nacht covers the overnight period."}

  nl.a1.unit04.lesson05.teach.schedule: {title: "Schedule", gloss: "the schedule", note: "A rooster lists activities and their times."}
  nl.a1.unit04.lesson05.teach.opening_hours: {title: "Language-café opening hours", gloss: "Language café open: 14:00–16:00", note: "Dutch timetables often use a point between hours and minutes; 14.00 is the same time as 14:00."}
  nl.a1.unit04.lesson05.teach.welcome: {title: "Welcome time", gloss: "14:15 Welcome", note: "14.15 can be said kwart over twee in everyday 12-hour clock language."}
  nl.a1.unit04.lesson05.teach.workshop: {title: "Workshop time", gloss: "14:45 Workshop", note: "14.45 is kwart voor drie: the quarter before three."}
  nl.a1.unit04.lesson05.teach.break: {title: "Break time", gloss: "15:30 Break", note: "15.30 is half vier, halfway toward four, not half past four."}
  nl.a1.unit04.lesson05.teach.ask_schedule: {title: "Ask for a schedule time", gloss: "What time does the workshop start?", note: "Begint asks when the activity starts."}
  nl.a1.unit04.lesson05.teach.workshop_answer: {title: "Give the workshop time", gloss: "At quarter to three.", note: "The schedule's 14.45 maps to kwart voor drie."}

  nl.a1.unit04.lesson06.teach.start_turn: {title: "Confirm the language-café time", gloss: "Lotte: What time does the language café start on Friday? Omar: At half past two, so at 14:30.", note: "Omar gives both forms explicitly: half drie and 14.30 refer to the same time."}
  nl.a1.unit04.lesson06.teach.workshop_turn: {title: "Ask about the workshop", gloss: "Lotte: And what time does the workshop start? Omar: At quarter past three.", note: "Kwart over drie is 15:15."}
  nl.a1.unit04.lesson06.teach.arrival_turn: {title: "State an arrival time", gloss: "Lotte: Good. Then I'll be there at quarter past two.", note: "Lotte plans to arrive at 14:15, before the 14:30 start."}
  nl.a1.unit04.lesson06.teach.close_turn: {title: "Close the plan", gloss: "Omar: Great, see you Friday afternoon!", note: "Vrijdagmiddag is a natural compound meaning Friday afternoon."}

