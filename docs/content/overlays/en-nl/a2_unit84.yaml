teaching:
  nl.a2.unit84.lesson01.teach.reiswoorden: {title: "Countries, food and travel", gloss: "Belgium / Germany / Egypt / sushi / Egyptian / to travel / to eat / to take a boat trip", note: "These are the travel and food words used in this unit.", example_gloss: ["I like travelling.", "I like eating sushi.", "I have taken a boat trip."]}
  nl.a2.unit84.lesson01.teach.ervaringswoorden: {title: "Experience words", gloss: "ever / never so far / been / eaten / travelled", note: "Use *ooit* in questions and *nog nooit* when something has never happened up to now.", example_gloss: ["Have you ever been to Belgium?", "I have never eaten sushi."]}
  nl.a2.unit84.lesson01.teach.gn_vragen: {title: "Experience questions with the perfectum", gloss: "Have you ever eaten sushi? Have you ever been to Belgium?", note: "Ask about an activity with *hebben*: *Heb je ooit ... gegeten?* Ask about having been somewhere with *zijn*: *Ben je ooit ... geweest?* The participle is at the end."}
  nl.a2.unit84.lesson01.teach.gn_antwoorden: {title: "Short answers", gloss: "Yes, I have done that before. No, never.", note: "*Al eens* says it has happened before. *Nog nooit* says it has not happened at any time up to now."}
  nl.a2.unit84.lesson02.teach.activiteiten: {title: "Travel activities", gloss: "to take a boat trip / to visit a museum / to sleep in a hotel / to work twice", note: "These infinitive phrases become perfectum experiences in the next card.", example_gloss: ["I take a boat trip.", "I visit a museum."]}
  nl.a2.unit84.lesson02.teach.voltooide_ervaringen: {title: "Participles for experiences", gloss: "taken/made / visited / slept / worked", note: "Use these with *hebben*: *heb gemaakt, heeft bezocht, heb geslapen, heb gewerkt*.", example_gloss: ["I have taken a boat trip.", "I have slept in a hotel."]}
  nl.a2.unit84.lesson02.teach.gn_al_nog_niet: {title: "Already versus not yet", gloss: "I have already done that. I haven't done that yet.", note: "*Al* marks a completed experience. *Nog niet* says it has not happened up to now but may happen later. Both sit before the participle."}
  nl.a2.unit84.lesson02.teach.gn_positie: {title: "Where the experience word goes", gloss: "I have already worked twice. I have never been to Germany.", note: "With *hebben*, put *al/twee keer* before the participle. With *zijn ... geweest*, *nog nooit* comes before the place phrase: *nog nooit in Duitsland geweest*."}
  nl.a2.unit84.lesson03.teach.tijdwoorden: {title: "Specific past-time words", gloss: "yesterday / last year / then / often", note: "*Gisteren, vorig jaar* and *toen* point to a specific past setting, which often calls for the imperfectum when telling what happened.", example_gloss: ["Yesterday I worked.", "Last year I travelled often."]}
  nl.a2.unit84.lesson03.teach.verhaalvormen: {title: "Imperfectum forms", gloss: "ate / was / visited / travelled", note: "These forms tell about one specific past time. Regular imperfectum was taught in unit 82 and irregular forms in unit 83.", example_gloss: ["Yesterday I ate sushi.", "Last year I was in Germany."]}
  nl.a2.unit84.lesson03.teach.gn_contrast: {title: "Experience versus a dated event", gloss: "Have you ever eaten sushi? Yesterday I ate sushi.", note: "Use the perfectum to ask whether an experience has happened. Use the imperfectum to tell a story anchored to one specific past time."}
  nl.a2.unit84.lesson03.teach.gn_rule: {title: "Rule of thumb", gloss: "Experience: I have eaten sushi. Specific story: yesterday I ate sushi.", note: "Ask 'has it happened in someone's life?' and choose the perfectum. If you are narrating what happened at a named past time, choose the imperfectum."}
  nl.a2.unit84.lesson04.teach.vragenlijst: {title: "The questionnaire", gloss: "the questionnaire / Egyptian food / to take a boat trip / to visit a museum", note: "Friends use these topics to compare experiences.", example_gloss: ["We fill in the questionnaire.", "I want to eat Egyptian food."]}
  nl.a2.unit84.lesson04.teach.gn_kort_antwoord: {title: "Answer a hebben-question", gloss: "Have you ever eaten Egyptian food? Yes, I have done that before. No, never.", note: "The short full answer uses *dat heb ik ... gedaan* to refer back to the activity."}
  nl.a2.unit84.lesson04.teach.gn_zijn_antwoord: {title: "Answer a zijn-question", gloss: "Have you ever been to Egypt? No, I have never been to Egypt.", note: "Keep *zijn* with *geweest*. A neutral order is *nog nooit + place + geweest* (the place can also come first: *in Egypte nog nooit*)."}
  nl.a2.unit84.lesson05.teach.noor_profiel: {title: "Noor's travel profile", gloss: "Noor loves travelling and food. She has been to Germany twice and has slept there in a small hotel once. She has often eaten German bread. She has never been to Egypt and has never taken a boat trip. She has already visited a museum in Belgium.", note: "The profile contrasts completed experiences (*al, al eens, twee keer, vaak*) with experiences that have never happened (*nog nooit*).", glosses: {houdt: "loves", reizen: "travelling", twee: "two", keer: "times", klein: "small", Duits: "German", brood: "bread", boottocht: "boat trip", museum: "museum", bezocht: "visited"}}
  nl.a2.unit84.lesson06.teach.lotte_egyptisch: {title: "Lotte asks about food", gloss: "Lotte: Have you ever eaten sushi?"}
  nl.a2.unit84.lesson06.teach.omar_eten_reizen: {title: "Omar answers and asks", gloss: "Omar: Yes, I have eaten that often. Have you ever been to Egypt?"}
  nl.a2.unit84.lesson06.teach.lotte_duitsland: {title: "Lotte compares experiences", gloss: "Lotte: No, never. But I have been to Germany before."}
  nl.a2.unit84.lesson06.teach.omar_boot: {title: "Omar asks about a boat trip", gloss: "Omar: Did you take a boat trip there?"}
  nl.a2.unit84.lesson06.teach.lotte_nog_niet: {title: "Lotte says not yet", gloss: "Lotte: No, I haven't done that yet. And you?"}
  nl.a2.unit84.lesson06.teach.omar_al_eens: {title: "Omar says he has", gloss: "Omar: Yes, I have done that before."}

