review:
  status: unreviewed
  required_next_reviewer: >-
    Native-Dutch confirmation needed (DRAFT). Confirm the English glosses
    match the intended negotiation functions (propose / decline politely /
    conditional concession / agree), that every matching_pairs right-hand
    gloss discriminates its left on real meaning, and that the culminating
    speaking/writing answers (lesson06) accept the punctuation forms a
    correct learner would actually produce (comma-present, comma-absent,
    trailing-period and no-trailing-period variants are supplied). See the
    realization file's review block for the full priority list, especially
    the subordinate-clause 'afwast' word order and the two-sentence
    culminating move.
  notes: >-
    Overlay for nl's B2 negotiation unit, authored alongside the
    realization (no adaptable upper-intermediate public-domain Dutch source
    exists; see the realization provenance note). English speakers' real
    interference risks for this outcome: (1) the polite DECLINE -- English
    speakers reach for a bare "I can't" or "no", whereas Dutch softens with
    'dat gaat helaas niet' / 'liever niet' / 'daar kan ik niet mee akkoord
    gaan'; the glosses mark the softening; (2) the CONDITIONAL CONCESSION is
    the core act and English collapses several Dutch forms -- 'als...dan',
    'op voorwaarde dat', 'mits', 'tenzij' and 'maar alleen als' are taught
    and glossed as distinct so a learner does not treat them as one; (3)
    Dutch subordinate-clause word order sends the verb to the end and
    rejoins the separable 'afwassen' as 'afwast' ('...op voorwaarde dat jij
    afwast'), which English speakers get wrong -- the production prompts
    name the exact frame; (4) 'ik ga akkoord' means "I agree", not "I go" --
    glossed to block the literal read. The culminating lesson06 speaking
    prompt names all three moves (state terms + decline one + conditional
    concession) and the writing prompt names both the revised term and the
    condition word required, so a correct answer is well-determined. No
    sibling-direction file (nl-en b2) was consulted.

course:
  title: Dutch B2
  description: >-
    Upper-intermediate Dutch: negotiate and resolve an everyday
    disagreement -- make a proposal and state your terms (ik stel voor dat,
    zullen we, wat als we), decline a term politely (dat gaat helaas niet,
    liever niet), offer a conditional concession (als...dan, op voorwaarde
    dat, mits, tenzij, ik ga akkoord maar alleen als), and reach agreement
    (afgesproken, dat is goed, akkoord), around the everyday puzzle of two
    friends dividing the work and splitting the bill for a dinner they are
    hosting together.

units:
  nl.b2.unit07.onderhandelen:
    title: "Negotiation"
    description: Negotiate and resolve a disagreement -- state your terms, decline a term politely, offer a conditional concession ("I can do X, but only if you do Y"), and reach an agreement, while telling what's settled from what's still open.

lessons:
  nl.b2.unit07.lesson01.een_voorstel:
    title: "Making a proposal"
  nl.b2.unit07.lesson02.beleefd_weigeren:
    title: "Declining politely"
  nl.b2.unit07.lesson03.een_voorwaarde:
    title: "Attaching a condition"
  nl.b2.unit07.lesson04.tot_een_afspraak:
    title: "Reaching an agreement"
  nl.b2.unit07.lesson05.een_afspraak_lezen:
    title: "What was agreed?"
  nl.b2.unit07.lesson06.onderhandelen_in_gesprek:
    title: "Negotiating in conversation"

teaching:
  nl.b2.unit07.lesson01.teach.etentje_setup:
    title: "We're throwing a dinner party tonight."
    gloss: "We're throwing a dinner party tonight."
    note: "The situation this whole unit negotiates: you and Omar are hosting a dinner together and have to divide the work. *Een etentje geven* = 'to throw a (small) dinner party'."
  nl.b2.unit07.lesson01.teach.koken:
    title: "to cook"
    gloss: "to cook"
    note: "*Koken* = 'to cook'. *Ik kook* = 'I cook'; *jij kookt* = 'you cook'. This is the first task on the table to divide."
    example_gloss: "I like cooking."
  nl.b2.unit07.lesson01.teach.boodschappen:
    title: "the groceries"
    gloss: "the groceries / the shopping"
    note: "*De boodschappen doen* = 'to do the grocery shopping'. Dutch uses *doen* ('to do'): *Ik doe de boodschappen*. *Doe* = 'I do', *doet* = 'he/she/you does'."
    example_gloss: "I do the grocery shopping."
  nl.b2.unit07.lesson01.teach.stel_voor:
    title: "I propose that..."
    gloss: "I propose that..."
    note: "*Ik stel voor dat...* opens a proposal. *Voorstellen* ('to propose') is separable, so *stel...voor* splits: *Ik stel voor dat ik kook*. After *dat* the verb goes to the end: *dat ik kook*."
    example_gloss: "I propose that I cook."
  nl.b2.unit07.lesson01.teach.zullen_we:
    title: "shall we...?"
    gloss: "shall we...?"
    note: "*Zullen we...?* floats a joint plan -- 'shall we...?'. *Zullen we de kosten delen?* = 'shall we split the costs?'. *De kosten* = 'the costs', *delen* = 'to split / share'."
    example_gloss: "Shall we split the costs?"
  nl.b2.unit07.lesson01.teach.wat_als:
    title: "what if we...?"
    gloss: "what if we...?"
    note: "*Wat als we...?* raises a possibility to consider together -- 'what if we...?'. *Samen* = 'together'."
    example_gloss: "What if we cook together?"
  nl.b2.unit07.lesson01.teach.mijn_voorstel:
    title: "my proposal is..."
    gloss: "my proposal is..."
    note: "*Mijn voorstel is dat...* states your terms plainly. After *dat* the verb goes last: *dat jij kookt* ('that you cook')."
    example_gloss: "My proposal is that you cook."
  nl.b2.unit07.lesson01.teach.grammar_voorstellen:
    title: "I propose that I cook. Shall we cook together? What if we split the costs?"
    gloss: "I propose that I cook. Shall we cook together? What if we split the costs?"
    note: "Four ways to put a term on the table: *ik stel voor dat...*, *zullen we...?*, *wat als we...?*, *mijn voorstel is...*. Stating your terms is the opening move of any negotiation."

  nl.b2.unit07.lesson02.teach.gaat_niet:
    title: "Unfortunately, that won't work."
    gloss: "Unfortunately, that won't work."
    note: "*Dat gaat helaas niet* is the everyday polite decline -- literally 'that unfortunately does not go'. *Helaas* ('unfortunately') is what keeps it soft rather than blunt."
  nl.b2.unit07.lesson02.teach.kan_niet:
    title: "I can't do that."
    gloss: "I can't do that."
    note: "*Dat kan ik niet* = 'I can't do that' -- declines because you're unable, not unwilling. *Kan* is 'can' (from *kunnen*)."
  nl.b2.unit07.lesson02.teach.niet_akkoord:
    title: "I can't agree to that."
    gloss: "I can't agree to that."
    note: "*Daar kan ik niet mee akkoord gaan* = 'I can't agree to that' -- a firmer, still-polite refusal of a proposed term. *Akkoord gaan met* = 'to agree to'; *daar...mee* wraps around it."
  nl.b2.unit07.lesson02.teach.liever:
    title: "rather"
    gloss: "rather / preferably"
    note: "*Liever* = 'rather'. *Liever niet* = 'rather not' -- the gentlest decline of all: *Ik doe dat liever niet* ('I'd rather not do that')."
    example_gloss: "I'd rather not do that."
  nl.b2.unit07.lesson02.teach.schoonmaken:
    title: "to clean"
    gloss: "to clean / to clean up"
    note: "*Schoonmaken* = 'to clean' -- another task in the mix (someone has to clean up afterwards). *Moet* = 'have to / must'; *nog* = 'still'."
    example_gloss: "I still have to clean."
  nl.b2.unit07.lesson02.teach.niet_alles:
    title: "I can't do everything."
    gloss: "I can't do everything."
    note: "*Ik kan niet alles doen* = 'I can't do everything' -- the honest reason a negotiation is needed at all. *Alles* = 'everything'."
  nl.b2.unit07.lesson02.teach.grammar_weigeren:
    title: "Unfortunately, that won't work. I can't agree to that. I'd rather not do that."
    gloss: "Unfortunately, that won't work. I can't agree to that. I'd rather not do that."
    note: "Declining a term without giving offence: *dat gaat helaas niet* (soft), *daar kan ik niet mee akkoord gaan* (firm), *dat doe ik liever niet* (gentle preference). A polite 'no' keeps the negotiation alive."

  nl.b2.unit07.lesson03.teach.afwassen:
    title: "to do the dishes"
    gloss: "to do the dishes / to wash up"
    note: "*Afwassen* = 'to do the dishes' -- the task you'll trade in the core move of this unit. It is separable (*ik was af*), but after *als / dat / op voorwaarde dat* it rejoins at the end of the clause: *...als jij afwast* ('...if you do the dishes')."
    example_gloss: "I don't want to do the dishes tonight."
  nl.b2.unit07.lesson03.teach.als_dan:
    title: "if... then..."
    gloss: "if... then..."
    note: "*Als... dan...* is the basic conditional -- 'if... then...'. After *dan* the verb comes second: *Als jij afwast, dan kook ik* ('if you do the dishes, then I'll cook')."
    example_gloss: "If you do the dishes, then I'll cook."
  nl.b2.unit07.lesson03.teach.maar_alleen_als:
    title: "I can cook, but only if you do the dishes."
    gloss: "I can cook, but only if you do the dishes."
    note: "This is the heart of the unit: a CONDITIONAL CONCESSION -- 'I can do X, but only if you do Y'. *Maar alleen als* ('but only if') attaches the condition to what you're offering."
  nl.b2.unit07.lesson03.teach.op_voorwaarde:
    title: "on condition that..."
    gloss: "on condition that..."
    note: "*Op voorwaarde dat...* = 'on condition that...' -- a more formal way to attach a condition. After it the verb goes last: *op voorwaarde dat jij kookt* ('on condition that you cook')."
    example_gloss: "I'll do the shopping, on condition that you cook."
  nl.b2.unit07.lesson03.teach.mits:
    title: "provided that"
    gloss: "provided that"
    note: "*Mits* = 'provided that' -- a compact one-word conditional: *Ik kook, mits jij afwast* ('I'll cook, provided you do the dishes'). Like *op voorwaarde dat*, it sends the verb to the end of its clause."
    example_gloss: "I'll cook, provided that you do the dishes."
  nl.b2.unit07.lesson03.teach.tenzij:
    title: "unless"
    gloss: "unless"
    note: "*Tenzij* = 'unless' -- the negative conditional, naming the one case that would change your offer: *Ik doe het, tenzij jij het liever doet* ('I'll do it, unless you'd rather do it')."
    example_gloss: "I'll do it, unless you'd rather do it."
  nl.b2.unit07.lesson03.teach.ga_akkoord:
    title: "I agree, but only if you do the dishes."
    gloss: "I agree, but only if you do the dishes."
    note: "*Ik ga akkoord* = 'I agree' (NOT 'I go' -- *akkoord gaan* is the fixed phrase 'to agree'). Pair it with a condition to concede on your own terms: *Ik ga akkoord, maar alleen als jij afwast*."
  nl.b2.unit07.lesson03.teach.grammar_voorwaarde:
    title: "I can cook, but only if you do the dishes. I agree, on condition that you do the shopping."
    gloss: "I can cook, but only if you do the dishes. I agree, on condition that you do the shopping."
    note: "A conditional concession gives ground WITHOUT giving in: you offer something (*ik kan koken*, *ik ga akkoord*) but attach a condition (*maar alleen als...*, *op voorwaarde dat...*). This is the move that resolves most real disagreements."

  nl.b2.unit07.lesson04.teach.afgesproken:
    title: "It's a deal!"
    gloss: "Agreed! / It's a deal!"
    note: "*Afgesproken!* seals an agreement -- 'agreed / it's a deal'. It's the single word you say once both sides are happy with the terms."
  nl.b2.unit07.lesson04.teach.dat_is_goed:
    title: "That's fine."
    gloss: "That's fine. / That works."
    note: "*Dat is goed* accepts a proposed term -- 'that's fine by me'. A plain, friendly yes."
  nl.b2.unit07.lesson04.teach.helemaal_akkoord:
    title: "Completely agreed."
    gloss: "Completely agreed."
    note: "*Helemaal akkoord* = 'completely agreed' -- a stronger yes than *dat is goed*. *Helemaal* = 'completely / totally'."
  nl.b2.unit07.lesson04.teach.rekening:
    title: "the bill"
    gloss: "the bill"
    note: "*De rekening* = 'the bill'. *De rekening delen* = 'to split the bill' -- the money side of the negotiation, on top of who does which task."
    example_gloss: "We split the bill together."
  nl.b2.unit07.lesson04.teach.betalen:
    title: "to pay"
    gloss: "to pay"
    note: "*Betalen* = 'to pay'. *Jij betaalt de helft* = 'you pay half'. *De helft* = 'half'."
    example_gloss: "You pay half."
  nl.b2.unit07.lesson04.teach.eens_worden:
    title: "We reach an agreement."
    gloss: "We reach an agreement."
    note: "*Het eens worden* = 'to reach an agreement / to come to terms'. *We worden het eens* = 'we reach an agreement' -- the goal of the whole exchange."
  nl.b2.unit07.lesson04.teach.grammar_afspraak:
    title: "Shall we split the bill? It's a deal. That's fine, completely agreed."
    gloss: "Shall we split the bill? It's a deal. That's fine, completely agreed."
    note: "Closing the deal: once the terms and conditions are settled, seal it with *afgesproken*, *dat is goed*, or *(helemaal) akkoord*. That's how you reach agreement (*het eens worden*)."

  nl.b2.unit07.lesson05.teach.tekst:
    title: "Reading: dividing the dinner"
    gloss: "Omar: I propose that I cook. Shall we do the grocery shopping together? Lotte: I'd rather not do the shopping, because I have to work. But I agree, on condition that you also do the dishes. Omar: It's a deal. And the bill? Lotte: We'll split that together. We'll talk about the shopping again tomorrow."

  nl.b2.unit07.lesson06.teach.idee:
    title: "the idea"
    gloss: "the idea"
    note: "*Het idee* = 'the idea'. *Dat is een goed idee* = 'that's a good idea' -- how you accept the other side's opening before you add your own terms."
    example_gloss: "That's a good idea."
  nl.b2.unit07.lesson06.teach.dialogue_lotte_open:
    title: "Lotte: Shall we cook together tonight?"
    gloss: "Lotte: Shall we cook together tonight?"
  nl.b2.unit07.lesson06.teach.dialogue_omar_propose:
    title: "Omar: Good idea. I propose that I cook."
    gloss: "Omar: Good idea. I propose that I cook."
  nl.b2.unit07.lesson06.teach.dialogue_lotte_ask:
    title: "Lotte: Will you do the grocery shopping too, then?"
    gloss: "Lotte: Will you do the grocery shopping too, then?"
  nl.b2.unit07.lesson06.teach.dialogue_omar_decline_concede:
    title: "Omar: No, unfortunately that won't work. But I agree, on condition that you do the dishes."
    gloss: "Omar: No, unfortunately that won't work. But I agree, on condition that you do the dishes."
  nl.b2.unit07.lesson06.teach.dialogue_lotte_bill:
    title: "Lotte: It's a deal. And we'll split the bill."
    gloss: "Lotte: It's a deal. And we'll split the bill."
  nl.b2.unit07.lesson06.teach.dialogue_omar_agree:
    title: "Omar: That's fine."
    gloss: "Omar: That's fine."
  nl.b2.unit07.lesson06.teach.grammar_volledig:
    title: "I propose that I cook. I'd rather not do the shopping, but I agree on condition that you do the dishes."
    gloss: "I propose that I cook. I'd rather not do the shopping, but I agree on condition that you do the dishes."
    note: "A whole negotiation move in one breath: STATE a term (*ik stel voor dat ik kook*), DECLINE another (*de boodschappen doe ik liever niet*), and offer a CONDITIONAL CONCESSION (*maar ik ga akkoord op voorwaarde dat jij afwast*). This is exactly what you produce in this lesson's speaking and writing tasks."

exercises:
  nl.b2.unit07.lesson01.exercise01.recognize_stel_voor:
    instruction: "What does this phrase do?"
    correct_option: "I propose (something)"
    distractors: ["I agree", "I refuse", "I pay"]
    accepted_answers: [{value: "I propose (something)", status: correct}]
    feedback: "Ik stel voor... opens a proposal -- you put a term on the table."
  nl.b2.unit07.lesson01.exercise02.listen_stel_voor:
    instruction: "Listen and select what you hear."
    correct_option: "I propose that I cook."
    distractors: ["I propose that you cook.", "Shall we cook together?", "I'd rather not cook."]
    accepted_answers: [{value: "I propose that I cook.", status: correct}]
    feedback: "Ik stel voor dat ik kook means I propose that I cook -- stating your own term."
  nl.b2.unit07.lesson01.exercise03.match_proposing:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {"ik stel voor dat": "I propose that", "zullen we": "shall we", "wat als we": "what if we", "mijn voorstel is": "my proposal is", koken: "to cook", "de boodschappen": "the groceries", etentje: "dinner party", kosten: "costs"}
        status: correct
    feedback: "These put a term on the table: ik stel voor dat, zullen we, wat als we, mijn voorstel is -- plus the tasks and costs you'll divide."
  nl.b2.unit07.lesson01.exercise04.order_stel_voor:
    instruction: "Put the words in order: I propose that I cook."
    accepted_answers:
      - {value: "Ik stel voor dat ik kook", status: correct}
    feedback: "Ik stel voor dat ik kook -- voorstellen splits (stel...voor), and after dat the verb (kook) goes last."
  nl.b2.unit07.lesson01.exercise05.translate_zullen_we:
    instruction: "Translate into Dutch, proposing with zullen we: Shall we split the costs?"
    accepted_answers:
      - {value: "Zullen we de kosten delen", status: correct}
    feedback: "Zullen we de kosten delen? means shall we split the costs?"
  nl.b2.unit07.lesson01.exercise06.speak_mijn_voorstel:
    instruction: "Say aloud in Dutch, stating a term with mijn voorstel is: My proposal is that you cook."
    accepted_answers:
      - {value: "Mijn voorstel is dat jij kookt", status: correct}
    feedback: "Mijn voorstel is dat jij kookt means my proposal is that you cook."
  nl.b2.unit07.lesson01.exercise07.write_etentje:
    instruction: "Write in Dutch: We're throwing a dinner party tonight."
    accepted_answers:
      - {value: "We geven vanavond een etentje", status: correct}
    feedback: "We geven vanavond een etentje means we're throwing a dinner party tonight."
  nl.b2.unit07.lesson01.exercise08.dictation_stel_voor:
    instruction: "Type what you hear."
    correct_response: "Ik stel voor dat ik kook"
    orthography_strict: true
    feedback: "You heard Ik stel voor dat ik kook -- I propose that I cook."

  nl.b2.unit07.lesson02.exercise01.recognize_helaas:
    instruction: "What does this word mean?"
    correct_option: "unfortunately"
    distractors: [luckily, quickly, together]
    accepted_answers: [{value: "unfortunately", status: correct}]
    feedback: "Helaas means unfortunately -- it softens a refusal into a polite one."
  nl.b2.unit07.lesson02.exercise02.listen_gaat_niet:
    instruction: "Listen and select what you hear."
    correct_option: "Unfortunately, that won't work."
    distractors: ["That's fine.", "I agree to that.", "Shall we do that?"]
    accepted_answers: [{value: "Unfortunately, that won't work.", status: correct}]
    feedback: "Dat gaat helaas niet means unfortunately, that won't work -- a polite decline."
  nl.b2.unit07.lesson02.exercise03.match_declining:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {"dat gaat helaas niet": "unfortunately that won't work", "dat kan ik niet": "I can't do that", "daar kan ik niet mee akkoord gaan": "I can't agree to that", "liever niet": "rather not", schoonmaken: "to clean", helaas: "unfortunately"}
        status: correct
    feedback: "Different ways to say no politely, from the softest (liever niet) to the firmest (daar kan ik niet mee akkoord gaan)."
  nl.b2.unit07.lesson02.exercise04.order_niet_akkoord:
    instruction: "Put the words in order: I can't agree to that."
    accepted_answers:
      - {value: "Daar kan ik niet mee akkoord gaan", status: correct}
    feedback: "Daar kan ik niet mee akkoord gaan -- daar...mee wraps around akkoord gaan ('to agree to')."
  nl.b2.unit07.lesson02.exercise05.translate_gaat_niet:
    instruction: "Translate into Dutch, declining politely with dat gaat helaas niet: Unfortunately, that won't work."
    accepted_answers:
      - {value: "Dat gaat helaas niet", status: correct}
    feedback: "Dat gaat helaas niet means unfortunately, that won't work."
  nl.b2.unit07.lesson02.exercise06.write_liever_niet:
    instruction: "Write in Dutch, declining softly with liever niet: I'd rather not do that."
    accepted_answers:
      - {value: "Ik doe dat liever niet", status: correct}
    feedback: "Ik doe dat liever niet means I'd rather not do that -- the gentlest way to decline."
  nl.b2.unit07.lesson02.exercise07.translate_niet_alles:
    instruction: "Translate into Dutch, using kan niet: I can't do everything."
    accepted_answers:
      - {value: "Ik kan niet alles doen", status: correct}
    feedback: "Ik kan niet alles doen means I can't do everything -- the reason a negotiation is needed."

  nl.b2.unit07.lesson03.exercise01.recognize_op_voorwaarde:
    instruction: "What does this phrase mean?"
    correct_option: "on condition that"
    distractors: [because, although, "as soon as"]
    accepted_answers: [{value: "on condition that", status: correct}]
    feedback: "Op voorwaarde dat means on condition that -- it attaches a condition to what you're offering."
  nl.b2.unit07.lesson03.exercise02.listen_alleen_als:
    instruction: "Listen and select what you hear."
    correct_option: "I can cook, but only if you do the dishes."
    distractors: ["I can cook, but only if you cook.", "I'll do the shopping, provided you cook.", "I can't cook unless you help."]
    accepted_answers: [{value: "I can cook, but only if you do the dishes.", status: correct}]
    feedback: "Ik kan koken, maar alleen als jij afwast means I can cook, but only if you do the dishes -- a conditional concession."
  nl.b2.unit07.lesson03.exercise03.match_conditions:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {"op voorwaarde dat": "on condition that", mits: "provided that", tenzij: "unless", "maar alleen als": "but only if", "ik ga akkoord": "I agree", afwassen: "to do the dishes"}
        status: correct
    feedback: "These attach a condition to a concession: op voorwaarde dat, mits, tenzij and maar alleen als all set the terms of your yes."
  nl.b2.unit07.lesson03.exercise04.order_core_move:
    instruction: "Put the words in order: I can cook, but only if you do the dishes."
    accepted_answers:
      - {value: "Ik kan koken maar alleen als jij afwast", status: correct}
    feedback: "Ik kan koken, maar alleen als jij afwast -- the core move: offer something, then attach the condition. In the als-clause afwassen rejoins as afwast at the end."
  nl.b2.unit07.lesson03.exercise05.translate_op_voorwaarde:
    instruction: "Translate into Dutch, attaching a condition with op voorwaarde dat: I'll do the shopping, on condition that you cook."
    accepted_answers:
      - {value: "Ik doe de boodschappen, op voorwaarde dat jij kookt", status: correct}
      - {value: "Ik doe de boodschappen op voorwaarde dat jij kookt", status: correct}
    feedback: "Ik doe de boodschappen, op voorwaarde dat jij kookt -- op voorwaarde dat sends the verb (kookt) to the end of its clause."
  nl.b2.unit07.lesson03.exercise06.speak_conditional:
    instruction: "Offer a conditional concession aloud, using maar alleen als: I can cook, but only if you do the dishes."
    accepted_answers:
      - {value: "Ik kan koken, maar alleen als jij afwast", status: correct}
      - {value: "Ik kan koken maar alleen als jij afwast", status: correct}
    feedback: "Ik kan koken, maar alleen als jij afwast -- give ground, but on a condition."
  nl.b2.unit07.lesson03.exercise07.write_ga_akkoord:
    instruction: "Write in Dutch, agreeing with a condition using ik ga akkoord and op voorwaarde dat: I agree, on condition that you do the shopping."
    accepted_answers:
      - {value: "Ik ga akkoord, op voorwaarde dat jij de boodschappen doet", status: correct}
      - {value: "Ik ga akkoord op voorwaarde dat jij de boodschappen doet", status: correct}
    feedback: "Ik ga akkoord, op voorwaarde dat jij de boodschappen doet -- ik ga akkoord means 'I agree', and the condition sends doet to the end."
  nl.b2.unit07.lesson03.exercise08.dictation_alleen_als:
    instruction: "Type what you hear."
    correct_response: "Ik kan koken, maar alleen als jij afwast"
    orthography_strict: true
    feedback: "You heard Ik kan koken, maar alleen als jij afwast -- I can cook, but only if you do the dishes."

  nl.b2.unit07.lesson04.exercise01.recognize_afgesproken:
    instruction: "What does this word mean?"
    correct_option: "agreed / it's a deal"
    distractors: [maybe, never, unfortunately]
    accepted_answers: [{value: "agreed / it's a deal", status: correct}]
    feedback: "Afgesproken means agreed / it's a deal -- you say it once the terms are settled."
  nl.b2.unit07.lesson04.exercise02.listen_rekening:
    instruction: "Listen and select what you hear."
    correct_option: "Shall we split the bill?"
    distractors: ["Will you pay the bill?", "Shall we cook together?", "I'll pay the whole bill."]
    accepted_answers: [{value: "Shall we split the bill?", status: correct}]
    feedback: "Zullen we de rekening delen? means shall we split the bill?"
  nl.b2.unit07.lesson04.exercise03.match_agreeing:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {afgesproken: "it's a deal", "dat is goed": "that's fine", "helemaal akkoord": "completely agreed", "de rekening": "the bill", betalen: "to pay", "de helft": "half", "we worden het eens": "we reach an agreement"}
        status: correct
    feedback: "Sealing the deal (afgesproken, dat is goed, helemaal akkoord) plus the money side (de rekening, betalen, de helft)."
  nl.b2.unit07.lesson04.exercise04.order_rekening:
    instruction: "Put the words in order: We split the bill together."
    accepted_answers:
      - {value: "We delen de rekening samen", status: correct}
    feedback: "We delen de rekening samen means we split the bill together."
  nl.b2.unit07.lesson04.exercise05.translate_dat_is_goed:
    instruction: "Translate into Dutch, accepting an offer with dat is goed: That's fine."
    accepted_answers:
      - {value: "Dat is goed", status: correct}
    feedback: "Dat is goed means that's fine -- a friendly yes to a proposed term."
  nl.b2.unit07.lesson04.exercise06.write_betalen:
    instruction: "Write in Dutch: You pay half."
    accepted_answers:
      - {value: "Jij betaalt de helft", status: correct}
      - {value: "Je betaalt de helft", status: correct}
    feedback: "Jij betaalt de helft means you pay half."
  nl.b2.unit07.lesson04.exercise07.translate_rekening_delen:
    instruction: "Translate into Dutch, proposing with zullen we: Shall we split the bill?"
    accepted_answers:
      - {value: "Zullen we de rekening delen", status: correct}
    feedback: "Zullen we de rekening delen? means shall we split the bill?"

  nl.b2.unit07.lesson05.exercise01.read_agreed:
    instruction: "What have Lotte and Omar definitely AGREED on?"
    correct_option: "Omar cooks and does the dishes, and they split the bill."
    distractors: ["Lotte does the grocery shopping.", "Lotte cooks the dinner.", "Omar pays the whole bill."]
    accepted_answers: [{value: "Omar cooks and does the dishes, and they split the bill.", status: correct}]
    feedback: "Omar cooks, agrees to also do the dishes (Lotte's condition), and they split the bill (Die delen we samen)."
  nl.b2.unit07.lesson05.exercise02.read_open:
    instruction: "Which point is still OPEN, not yet settled?"
    correct_option: "Who does the grocery shopping."
    distractors: ["Who cooks.", "Who does the dishes.", "How to split the bill."]
    accepted_answers: [{value: "Who does the grocery shopping.", status: correct}]
    feedback: "Over de boodschappen praten we morgen nog -- the shopping is left for tomorrow, still open."
  nl.b2.unit07.lesson05.exercise03.read_condition:
    instruction: "On what CONDITION does Lotte agree to the plan?"
    correct_option: "Only if Omar also does the dishes."
    distractors: ["Only if Omar pays for everything.", "Only if they cook together.", "Only if Omar does the shopping too."]
    accepted_answers: [{value: "Only if Omar also does the dishes.", status: correct}]
    feedback: "Ik ga akkoord, op voorwaarde dat jij ook afwast -- her yes is conditional on Omar doing the dishes."
  nl.b2.unit07.lesson05.exercise04.read_declined:
    instruction: "What does Lotte decline to do?"
    correct_option: "The grocery shopping."
    distractors: ["The cooking.", "The dishes.", "Splitting the bill."]
    accepted_answers: [{value: "The grocery shopping.", status: correct}]
    feedback: "De boodschappen doe ik liever niet, want ik moet werken -- Lotte declines the shopping, giving her reason."
  nl.b2.unit07.lesson05.exercise05.match_reading:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - value: {want: "because", werken: "to work", ook: "also / too", die: "that / it", over: "about", praten: "to talk", morgen: "tomorrow"}
        status: correct
    feedback: "These are the reading's key words -- want gives a reason, and over ... praten is 'to talk about ...'."
  nl.b2.unit07.lesson05.exercise06.translate_want:
    instruction: "Translate into Dutch, giving your reason with want: I'd rather not do that, because I have to work."
    accepted_answers:
      - {value: "Ik doe dat liever niet, want ik moet werken", status: correct}
      - {value: "Ik doe dat liever niet want ik moet werken", status: correct}
    feedback: "Ik doe dat liever niet, want ik moet werken -- want introduces your reason and keeps normal word order."
  nl.b2.unit07.lesson05.exercise07.write_morgen:
    instruction: "Write in Dutch: We'll talk about the groceries tomorrow."
    accepted_answers:
      - {value: "We praten morgen over de boodschappen", status: correct}
      - {value: "Morgen praten we over de boodschappen", status: correct}
      - {value: "Over de boodschappen praten we morgen", status: correct}
    feedback: "We praten morgen over de boodschappen means we'll talk about the groceries tomorrow."

  nl.b2.unit07.lesson06.exercise01.comprehend_proposal:
    instruction: "What does Omar PROPOSE?"
    correct_option: "That he (Omar) cooks."
    distractors: ["That Lotte cooks.", "That they eat out.", "That they cancel the dinner."]
    accepted_answers: [{value: "That he (Omar) cooks.", status: correct}]
    feedback: "Ik stel voor dat ik kook -- Omar proposes that he cooks."
  nl.b2.unit07.lesson06.exercise02.comprehend_refusal:
    instruction: "What does Omar REFUSE to do?"
    correct_option: "The grocery shopping."
    distractors: ["The cooking.", "The dishes.", "Splitting the bill."]
    accepted_answers: [{value: "The grocery shopping.", status: correct}]
    feedback: "Asked to do the shopping too, Omar says dat gaat helaas niet -- he declines the shopping (not the cooking or the dishes)."
  nl.b2.unit07.lesson06.exercise03.comprehend_condition:
    instruction: "What CONDITIONAL concession does Omar offer in return?"
    correct_option: "He agrees, on condition that Lotte does the dishes."
    distractors: ["He agrees with no conditions.", "He refuses to help at all.", "He offers to pay the whole bill."]
    accepted_answers: [{value: "He agrees, on condition that Lotte does the dishes.", status: correct}]
    feedback: "Maar ik ga akkoord, op voorwaarde dat jij afwast -- Omar concedes, but only if Lotte does the dishes."
  nl.b2.unit07.lesson06.exercise04.order_concede:
    instruction: "Put the words in order: I agree, on condition that you do the dishes."
    accepted_answers:
      - {value: "Ik ga akkoord op voorwaarde dat jij afwast", status: correct}
    feedback: "Ik ga akkoord, op voorwaarde dat jij afwast -- concede, then attach the condition."
  nl.b2.unit07.lesson06.exercise05.speak_full_move:
    instruction: "You and Omar are hosting a dinner. Negotiate your whole part aloud in THREE moves -- STATE your terms (ik stel voor dat ik kook), DECLINE one task (the shopping, with liever niet), and OFFER A CONDITIONAL CONCESSION (op voorwaarde dat): I propose that I cook. I'd rather not do the shopping, but I agree on condition that you do the dishes."
    accepted_answers:
      - {value: "Ik stel voor dat ik kook. De boodschappen doe ik liever niet, maar ik ga akkoord op voorwaarde dat jij afwast.", status: correct}
      - {value: "Ik stel voor dat ik kook. De boodschappen doe ik liever niet, maar ik ga akkoord op voorwaarde dat jij afwast", status: correct}
      - {value: "Ik stel voor dat ik kook. De boodschappen doe ik liever niet, maar ik ga akkoord, op voorwaarde dat jij afwast.", status: correct}
      - {value: "Ik stel voor dat ik kook. De boodschappen doe ik liever niet, maar ik ga akkoord, op voorwaarde dat jij afwast", status: correct}
    feedback: "The whole move: state a term (Ik stel voor dat ik kook), decline one (De boodschappen doe ik liever niet), and concede on a condition (maar ik ga akkoord op voorwaarde dat jij afwast)."
  nl.b2.unit07.lesson06.exercise06.write_revised_terms:
    instruction: "Write a reply proposing DIFFERENT terms with a condition attached. Offer to do the shopping yourself (ik doe de boodschappen) and attach a condition with mits: I'll do the shopping, provided that you cook."
    accepted_answers:
      - {value: "Ik doe de boodschappen, mits jij kookt", status: correct}
      - {value: "Ik doe de boodschappen mits jij kookt", status: correct}
    feedback: "Ik doe de boodschappen, mits jij kookt -- you propose a new term (you shop) and attach the condition (mits jij kookt) that you cook in return."
  nl.b2.unit07.lesson06.exercise07.respond_negotiate:
    instruction: "Reply to 'Wil jij vanavond koken?' by agreeing on a condition, using op voorwaarde dat."
    accepted_answers:
      - {value: "Ik kook, op voorwaarde dat jij afwast", status: correct}
      - {value: "Ik kook op voorwaarde dat jij afwast", status: correct}
    feedback: "Ik kook, op voorwaarde dat jij afwast -- you agree to cook, but only on the condition that the other person does the dishes."
