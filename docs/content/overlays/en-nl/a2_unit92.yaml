course:
  title: "Dutch A2"
  description: "Grammar-led A2 Dutch for giving reasons and consequences."
  learning_goal: "Give a reason and a consequence in one message with omdat, want and dus."
units:
  nl.a2.unit92.omdat_want_dus: {"title": "Because, for, so", "description": "Explain an excuse or a change of plan by giving a reason and a consequence."}
lessons:
  nl.a2.unit92.lesson01.reden_en_gevolg: {"title": "Reason and consequence"}
  nl.a2.unit92.lesson02.omdat_werkwoord_achteraan: {"title": "Omdat: the verb at the end"}
  nl.a2.unit92.lesson03.omdat_want_of_dus: {"title": "Omdat, want or dus?"}
  nl.a2.unit92.lesson04.afspraak_verzetten: {"title": "Changing the appointment"}
  nl.a2.unit92.lesson05.noors_bericht: {"title": "Noor's message"}
  nl.a2.unit92.lesson06.lotte_en_omar: {"title": "Lotte and Omar"}
teaching:
  nl.a2.unit92.lesson01.teach.klachten: {"title": "Reasons to stay away", "gloss": "ill / tired / busy / headache", "note": "These words often give a reason.", "example_gloss": ["I am ill.", "Omar is tired.", "Lotte is busy.", "I have a headache."]}
  nl.a2.unit92.lesson01.teach.plannen: {"title": "Plans, work and weather", "gloss": "the appointment / the work / the weather / the train", "note": "Appointments, work and weather are common reasons to change a plan.", "example_gloss": ["I have an appointment with Noor.", "I have a lot of work.", "The weather is bad.", "It is raining.", "The train is late."]}
  nl.a2.unit92.lesson01.teach.gevolgen: {"title": "What follows", "gloss": "to stay / to come / at home / later / not", "note": "These words describe what you do because of a reason.", "example_gloss": ["I am staying at home.", "Omar is staying at home.", "I am coming later.", "I am not coming."]}
  nl.a2.unit92.lesson01.teach.gn_reden_gevolg: {"title": "Reason and consequence", "gloss": "The consequence: I am staying at home. The reason: It is raining. One message gives the reason and the consequence.", "note": "The reason says why. The consequence says what happens because of it. In this unit you will put both in one message."}
  nl.a2.unit92.lesson01.teach.gn_want: {"title": "Want gives a reason", "gloss": "With want you give the reason. The word order does not change: I am staying at home, because it is raining.", "note": "*Want* joins two normal main clauses. Each clause keeps its usual order: *het regent* has the verb in second place."}
  nl.a2.unit92.lesson01.teach.gn_dus: {"title": "Dus gives the consequence", "gloss": "With dus you give the consequence: It is raining, so I am staying at home.", "note": "*Dus* joins two main clauses: *het regent, dus ik blijf thuis*. In this unit you practise the pattern *dus ik ...*."}
  nl.a2.unit92.lesson01.teach.zinnen: {"title": "Two full messages", "gloss": "I am tired, so I am staying at home. I am not coming, because I have a headache."}
  nl.a2.unit92.lesson02.teach.waarom: {"title": "Why and because", "gloss": "why / because", "note": "*Waarom* asks for a reason; *omdat* starts the answer.", "example_gloss": ["Why aren't you coming?", "Because I am ill.", "Why are you staying at home?", "Because it is raining."]}
  nl.a2.unit92.lesson02.teach.modaal: {"title": "Must, can and tonight", "gloss": "must / can / to work / tonight", "note": "These verbs are common in excuses.", "example_gloss": ["I have to work.", "I cannot come tonight.", "Omar has to work."]}
  nl.a2.unit92.lesson02.teach.gn_omdat: {"title": "Omdat sends the verb to the end", "gloss": "After omdat the conjugated verb goes at the end: because it is raining; because I am ill; because I have an appointment.", "note": "*Omdat* starts a subordinate clause. The conjugated (finite) verb goes to the end of the clause: *omdat ik ziek ben*, not *omdat ik ben ziek*."}
  nl.a2.unit92.lesson02.teach.gn_omdat_modaal: {"title": "Two verbs at the end", "gloss": "With moeten or kunnen two verbs stand at the end: because I have to work; because I cannot come.", "note": "In the subordinate clause both verbs stand at the end, with the modal verb first: *moet werken*, *kan komen*."}
  nl.a2.unit92.lesson02.teach.zinnen: {"title": "Two sentences with omdat", "gloss": "I am staying at home because I am ill. I am not coming because I have to work."}
  nl.a2.unit92.lesson03.teach.woorden: {"title": "Time and regret", "gloss": "today / tomorrow / unfortunately / too bad", "note": "*Helaas* and *jammer* often start an excuse.", "example_gloss": ["Today I am staying at home.", "Tomorrow I am coming later.", "Unfortunately I have a headache.", "Too bad, I cannot come."]}
  nl.a2.unit92.lesson03.teach.gn_contrast: {"title": "Omdat versus want and dus", "gloss": "Omdat: the verb is at the end. Want: the word order does not change. Dus: gives the consequence.", "note": "Same meaning for *omdat* and *want*, different word order: *omdat ik ziek ben* but *want ik ben ziek*."}
  nl.a2.unit92.lesson03.teach.gn_voorop: {"title": "A fronted omdat-clause", "gloss": "If the omdat-clause comes first, the main clause starts with the verb and then the subject: Because it is raining, I am staying at home.", "note": "After a fronted *omdat*-clause, the main clause has inversion: *blijf ik thuis*. *Want* does not do this: *want ik blijf thuis*, not *want blijf ik thuis*."}
  nl.a2.unit92.lesson03.teach.zinnen: {"title": "Omdat-clause first", "gloss": "Because it is raining, I am staying at home. Because the train is late, I am coming later."}
  nl.a2.unit92.lesson04.teach.verzetten: {"title": "Changing a plan", "gloss": "sorry / the colleague / to reschedule / time", "note": "Use these words to cancel politely and suggest a new time.", "example_gloss": ["Sorry, I cannot come.", "My colleague is ill.", "Can we reschedule the appointment?", "Do you have time tomorrow?"]}
  nl.a2.unit92.lesson04.teach.gn_bericht: {"title": "A message with reason and consequence", "gloss": "A good message has sorry, a consequence, a reason and a question: Sorry, I cannot come, because I have to work. Can we reschedule the appointment?", "note": "Put the consequence first (*ik kan niet komen*), add the reason with *omdat* or *want*, then ask a question."}
  nl.a2.unit92.lesson04.teach.collega: {"title": "Reason, then consequence", "gloss": "My colleague is ill, so I have to work."}
  nl.a2.unit92.lesson05.teach.woorden: {"title": "Words for the message", "gloss": "also / hard / the day after tomorrow / cheers (informal sign-off)", "note": "These words appear in Noor's message.", "example_gloss": ["It is also raining.", "It is raining hard.", "Do you have time the day after tomorrow?", "Cheers, Omar."]}
  nl.a2.unit92.lesson05.teach.reading: {"title": "Noor changes the plan", "gloss": "Hi Lotte, sorry, I cannot come tonight, because I have a headache. It is also raining hard, so I am staying at home. Tomorrow I cannot, because I have to work. Do you have time the day after tomorrow? Can we reschedule the appointment? Cheers, Noor", "note": "Find the reason and the consequence in each sentence.", "glosses": {"Hoi": "hi", "vanavond": "tonight", "hoofdpijn": "headache", "ook": "also", "hard": "hard", "overmorgen": "the day after tomorrow", "groetjes": "cheers", "verzetten": "to reschedule"}}
  nl.a2.unit92.lesson06.teach.lotte_vraagt: {"title": "Lotte asks", "gloss": "Hi Omar, are you coming tonight?"}
  nl.a2.unit92.lesson06.teach.omar_nee: {"title": "Omar declines", "gloss": "No, sorry, I cannot come."}
  nl.a2.unit92.lesson06.teach.lotte_waarom: {"title": "Lotte asks why", "gloss": "Why aren't you coming?"}
  nl.a2.unit92.lesson06.teach.omar_reden: {"title": "Omar gives reason and consequence", "gloss": "Because my colleague is ill. He cannot work, so I am working tonight."}
  nl.a2.unit92.lesson06.teach.lotte_verzetten: {"title": "Lotte suggests a change", "gloss": "Too bad! Can we reschedule the appointment?"}
  nl.a2.unit92.lesson06.teach.omar_graag: {"title": "Omar agrees and asks", "gloss": "Yes, please. Do you have time tomorrow?"}
  nl.a2.unit92.lesson06.teach.lotte_morgen: {"title": "Lotte agrees on a day", "gloss": "Yes, I have time tomorrow."}
exercises:
  nl.a2.unit92.lesson01.exercise01.choose_want: {"instruction": "Choose the Dutch sentence that means the English sentence.", "correct_option": "Ik blijf thuis, want ik ben ziek.", "distractors": ["Ik blijf thuis, dus ik ben ziek.", "Ik ben ziek, want ik blijf thuis.", "Ik blijf thuis, want ik ben niet ziek."], "accepted_answers": [{"value": "Ik blijf thuis, want ik ben ziek.", "status": "correct"}], "feedback": "*Want ik ben ziek* gives the reason; the main clause *Ik blijf thuis* gives what happens."}
  nl.a2.unit92.lesson01.exercise02.choose_dus: {"instruction": "Choose the Dutch sentence that means the English sentence.", "correct_option": "Het regent, dus ik blijf thuis.", "distractors": ["Het regent, want ik blijf thuis.", "Ik blijf thuis, dus het regent.", "Het regent niet, dus ik blijf thuis."], "accepted_answers": [{"value": "Het regent, dus ik blijf thuis.", "status": "correct"}], "feedback": "*Dus* introduces the consequence: *dus ik blijf thuis*."}
  nl.a2.unit92.lesson01.exercise03.match_words: {"instruction": "Match each Dutch word to its English meaning.", "accepted_answers": [{"value": [{"left": "ziek", "right": "ill"}, {"left": "moe", "right": "tired"}, {"left": "druk", "right": "busy"}, {"left": "hoofdpijn", "right": "headache"}, {"left": "afspraak", "right": "appointment"}, {"left": "trein", "right": "train"}], "status": "correct"}], "feedback": "These words recur as reasons throughout the unit."}
  nl.a2.unit92.lesson01.exercise04.order_dus: {"instruction": "Put the words in order to say 'It is raining, so I am staying at home.'", "correct_option": "Het regent dus ik blijf thuis", "accepted_answers": [{"value": "Het regent dus ik blijf thuis", "status": "correct"}, {"value": "Het regent dus blijf ik thuis", "status": "correct"}], "feedback": "*Het regent, dus ik blijf thuis.* This unit practises *dus ik ...*; *dus blijf ik thuis* is also correct Dutch."}
  nl.a2.unit92.lesson01.exercise05.complete_dus: {"instruction": "Complete the sentence so it means 'I am ill, so I am staying at home.'", "correct_option": "dus", "accepted_answers": [{"value": "dus", "status": "correct"}], "feedback": "*Dus* gives the consequence."}
  nl.a2.unit92.lesson01.exercise06.translate_dus: {"instruction": "Translate into Dutch.", "accepted_answers": [{"value": "Ik ben moe, dus ik blijf thuis.", "status": "correct"}, {"value": "Ik ben moe dus ik blijf thuis.", "status": "correct"}, {"value": "Ik ben moe, dus ik blijf thuis", "status": "correct"}, {"value": "Ik ben moe dus ik blijf thuis", "status": "correct"}, {"value": "Ik ben moe, dus blijf ik thuis.", "status": "correct"}, {"value": "Ik ben moe dus blijf ik thuis.", "status": "correct"}, {"value": "Ik ben moe, dus blijf ik thuis", "status": "correct"}, {"value": "Ik ben moe dus blijf ik thuis", "status": "correct"}], "feedback": "*Ik ben moe, dus ik blijf thuis.*"}
  nl.a2.unit92.lesson01.exercise07.write_want: {"instruction": "Write the sentence in Dutch using want.", "correct_option": "Ik blijf thuis, want ik ben moe.", "accepted_answers": [{"value": "Ik blijf thuis, want ik ben moe.", "status": "correct"}, {"value": "Ik blijf thuis want ik ben moe.", "status": "correct"}, {"value": "Ik blijf thuis, want ik ben moe", "status": "correct"}, {"value": "Ik blijf thuis want ik ben moe", "status": "correct"}], "feedback": "*Ik blijf thuis, want ik ben moe.*"}
  nl.a2.unit92.lesson02.exercise01.choose_order: {"instruction": "Choose the Dutch sentence that means the English sentence.", "correct_option": "Ik kom niet, omdat ik ziek ben.", "distractors": ["Ik kom niet, omdat ik ben ziek.", "Ik kom niet, omdat ben ik ziek.", "Ik kom niet, omdat ziek ik ben."], "accepted_answers": [{"value": "Ik kom niet, omdat ik ziek ben.", "status": "correct"}], "feedback": "After *omdat*, the verb *ben* goes to the end."}
  nl.a2.unit92.lesson02.exercise02.choose_answer: {"instruction": "Choose the correct answer to the question.", "correct_option": "Omdat het regent.", "distractors": ["Omdat regent het.", "Dus het regent.", "Omdat ik regent."], "accepted_answers": [{"value": "Omdat het regent.", "status": "correct"}], "feedback": "*Omdat het regent* has the verb at the end and answers *waarom*."}
  nl.a2.unit92.lesson02.exercise03.match_reasons: {"instruction": "Match each Dutch reason to its English meaning.", "accepted_answers": [{"value": [{"left": "omdat het regent", "right": "because it is raining"}, {"left": "omdat ik ziek ben", "right": "because I am ill"}, {"left": "omdat ik moet werken", "right": "because I have to work"}, {"left": "omdat de trein te laat is", "right": "because the train is late"}, {"left": "omdat ik hoofdpijn heb", "right": "because I have a headache"}, {"left": "omdat ik een afspraak heb", "right": "because I have an appointment"}], "status": "correct"}], "feedback": "In each clause the conjugated verb stands at the end."}
  nl.a2.unit92.lesson02.exercise04.order_omdat: {"instruction": "Put the words in order to say 'I am not coming because I have to work.'", "correct_option": "Ik kom niet omdat ik moet werken", "accepted_answers": [{"value": "Ik kom niet omdat ik moet werken", "status": "correct"}, {"value": "Omdat ik moet werken kom ik niet", "status": "correct"}], "feedback": "*Ik kom niet, omdat ik moet werken.* Both verbs of the omdat-clause are at the end."}
  nl.a2.unit92.lesson02.exercise05.complete_omdat: {"instruction": "Complete with the correct form of zijn (to be).", "correct_option": "ben", "accepted_answers": [{"value": "ben", "status": "correct"}], "feedback": "The verb stands at the end: *omdat ik ziek ben*."}
  nl.a2.unit92.lesson02.exercise06.translate_omdat: {"instruction": "Translate into Dutch.", "accepted_answers": [{"value": "Ik kan niet komen, omdat ik moet werken.", "status": "correct"}, {"value": "Ik kan niet komen omdat ik moet werken.", "status": "correct"}, {"value": "Ik kan niet komen, omdat ik moet werken", "status": "correct"}, {"value": "Ik kan niet komen omdat ik moet werken", "status": "correct"}, {"value": "Omdat ik moet werken, kan ik niet komen.", "status": "correct"}, {"value": "Omdat ik moet werken kan ik niet komen.", "status": "correct"}, {"value": "Omdat ik moet werken, kan ik niet komen", "status": "correct"}, {"value": "Omdat ik moet werken kan ik niet komen", "status": "correct"}, {"value": "Ik kom niet, omdat ik moet werken.", "status": "correct"}, {"value": "Ik kom niet omdat ik moet werken.", "status": "correct"}, {"value": "Ik kom niet, omdat ik moet werken", "status": "correct"}, {"value": "Ik kom niet omdat ik moet werken", "status": "correct"}, {"value": "Omdat ik moet werken, kom ik niet.", "status": "correct"}, {"value": "Omdat ik moet werken kom ik niet.", "status": "correct"}, {"value": "Omdat ik moet werken, kom ik niet", "status": "correct"}, {"value": "Omdat ik moet werken kom ik niet", "status": "correct"}], "feedback": "*Ik kan niet komen, omdat ik moet werken.*"}
  nl.a2.unit92.lesson02.exercise07.write_omdat: {"instruction": "Write the sentence in Dutch using omdat.", "correct_option": "Ik blijf thuis, omdat ik hoofdpijn heb.", "accepted_answers": [{"value": "Ik blijf thuis, omdat ik hoofdpijn heb.", "status": "correct"}, {"value": "Ik blijf thuis omdat ik hoofdpijn heb.", "status": "correct"}, {"value": "Ik blijf thuis, omdat ik hoofdpijn heb", "status": "correct"}, {"value": "Ik blijf thuis omdat ik hoofdpijn heb", "status": "correct"}, {"value": "Omdat ik hoofdpijn heb, blijf ik thuis.", "status": "correct"}, {"value": "Omdat ik hoofdpijn heb blijf ik thuis.", "status": "correct"}, {"value": "Omdat ik hoofdpijn heb, blijf ik thuis", "status": "correct"}, {"value": "Omdat ik hoofdpijn heb blijf ik thuis", "status": "correct"}], "feedback": "*Ik blijf thuis, omdat ik hoofdpijn heb.*"}
  nl.a2.unit92.lesson03.exercise01.choose_fronted: {"instruction": "Choose the Dutch sentence that means the English sentence.", "correct_option": "Omdat het regent, blijf ik thuis.", "distractors": ["Omdat het regent, ik blijf thuis.", "Omdat regent het, blijf ik thuis.", "Omdat het regent, thuis blijf ik."], "accepted_answers": [{"value": "Omdat het regent, blijf ik thuis.", "status": "correct"}], "feedback": "After the opening *omdat*-clause comes the verb: *blijf ik thuis*."}
  nl.a2.unit92.lesson03.exercise02.choose_connector: {"instruction": "Choose the Dutch sentence that means the English sentence.", "correct_option": "Ik kom later, omdat de trein te laat is.", "distractors": ["Ik kom later, omdat de trein is te laat.", "Ik kom later, want de trein te laat is.", "Ik kom later, dus de trein is te laat."], "accepted_answers": [{"value": "Ik kom later, omdat de trein te laat is.", "status": "correct"}], "feedback": "*Omdat* needs the verb at the end; *want* does not."}
  nl.a2.unit92.lesson03.exercise03.match_sentences: {"instruction": "Match each Dutch sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Ik ben ziek, dus ik blijf thuis.", "right": "I am ill, so I am staying at home."}, {"left": "Ik kom niet, want ik moet werken.", "right": "I am not coming, because I have to work."}, {"left": "Omdat het regent, blijf ik thuis.", "right": "Because it is raining, I am staying at home."}, {"left": "De trein is te laat, dus ik kom later.", "right": "The train is late, so I am coming later."}, {"left": "Ik blijf thuis, omdat ik hoofdpijn heb.", "right": "I am staying at home, because I have a headache."}, {"left": "Omdat ik een afspraak heb, kom ik later.", "right": "Because I have an appointment, I am coming later."}], "status": "correct"}], "feedback": "Each sentence uses omdat, want or dus with its own word order."}
  nl.a2.unit92.lesson03.exercise04.order_fronted: {"instruction": "Put the words in order to say 'Because I am tired, I am staying at home.'", "correct_option": "Omdat ik moe ben blijf ik thuis", "accepted_answers": [{"value": "Omdat ik moe ben blijf ik thuis", "status": "correct"}, {"value": "Ik blijf thuis omdat ik moe ben", "status": "correct"}], "feedback": "*Omdat ik moe ben, blijf ik thuis.*"}
  nl.a2.unit92.lesson03.exercise05.complete_inversion: {"instruction": "Complete with the correct form of komen (to come).", "correct_option": "kom", "accepted_answers": [{"value": "kom", "status": "correct"}], "feedback": "After the opening omdat-clause the verb comes first: *kom ik later*."}
  nl.a2.unit92.lesson03.exercise06.translate_fronted: {"instruction": "Translate into Dutch.", "accepted_answers": [{"value": "Omdat de trein te laat is, kom ik later.", "status": "correct"}, {"value": "Omdat de trein te laat is kom ik later.", "status": "correct"}, {"value": "Omdat de trein te laat is, kom ik later", "status": "correct"}, {"value": "Omdat de trein te laat is kom ik later", "status": "correct"}, {"value": "Ik kom later, omdat de trein te laat is.", "status": "correct"}, {"value": "Ik kom later omdat de trein te laat is.", "status": "correct"}, {"value": "Ik kom later, omdat de trein te laat is", "status": "correct"}, {"value": "Ik kom later omdat de trein te laat is", "status": "correct"}], "feedback": "*Omdat de trein te laat is, kom ik later.*"}
  nl.a2.unit92.lesson03.exercise07.write_fronted: {"instruction": "Write one Dutch sentence that begins with omdat.", "correct_option": "Omdat ik ziek ben, kom ik niet.", "accepted_answers": [{"value": "Omdat ik ziek ben, kom ik niet.", "status": "correct"}, {"value": "Omdat ik ziek ben kom ik niet.", "status": "correct"}, {"value": "Omdat ik ziek ben, kom ik niet", "status": "correct"}, {"value": "Omdat ik ziek ben kom ik niet", "status": "correct"}, {"value": "Omdat ik ziek ben, kan ik niet komen.", "status": "correct"}, {"value": "Omdat ik ziek ben kan ik niet komen.", "status": "correct"}, {"value": "Omdat ik ziek ben, kan ik niet komen", "status": "correct"}, {"value": "Omdat ik ziek ben kan ik niet komen", "status": "correct"}], "feedback": "*Omdat ik ziek ben, kom ik niet.*"}
  nl.a2.unit92.lesson04.exercise01.choose_dus: {"instruction": "Choose the Dutch sentence that means the English sentence.", "correct_option": "Ik heb een afspraak, dus ik kan niet komen.", "distractors": ["Ik heb een afspraak, omdat ik niet kan komen.", "Ik kan niet komen, dus ik heb een afspraak.", "Ik heb een afspraak, dus ik niet kan komen."], "accepted_answers": [{"value": "Ik heb een afspraak, dus ik kan niet komen.", "status": "correct"}], "feedback": "*Dus* introduces the consequence: *dus ik kan niet komen*."}
  nl.a2.unit92.lesson04.exercise02.choose_message: {"instruction": "Choose the Dutch message that says what the English describes: you cannot come because of a headache, and you ask to reschedule.", "correct_option": "Ik kan niet komen, omdat ik hoofdpijn heb. Kunnen we de afspraak verzetten?", "distractors": ["Ik kan niet komen, omdat ik heb hoofdpijn. Kunnen we de afspraak verzetten?", "Ik kan niet komen, dus ik hoofdpijn heb. Kunnen we de afspraak verzetten?", "Ik kan niet komen, want ik hoofdpijn heb. Kunnen we de afspraak verzetten?"], "accepted_answers": [{"value": "Ik kan niet komen, omdat ik hoofdpijn heb. Kunnen we de afspraak verzetten?", "status": "correct"}], "feedback": "The omdat-clause has its verb at the end: *omdat ik hoofdpijn heb*."}
  nl.a2.unit92.lesson04.exercise03.match_functions: {"instruction": "Match each Dutch phrase to its function in a change of plan.", "accepted_answers": [{"value": [{"left": "Sorry, ik kan niet komen.", "right": "cancels politely"}, {"left": "omdat ik moet werken", "right": "gives the reason"}, {"left": "Kunnen we de afspraak verzetten?", "right": "asks to reschedule"}, {"left": "Heb je morgen tijd?", "right": "asks about tomorrow"}, {"left": "Jammer!", "right": "shows disappointment"}, {"left": "Morgen heb ik tijd.", "right": "says tomorrow is possible"}], "status": "correct"}], "feedback": "Each phrase has its own job in a message about a changed plan."}
  nl.a2.unit92.lesson04.exercise04.order_colleague: {"instruction": "Put the words in order to say 'My colleague is ill, so I have to work.'", "correct_option": "Mijn collega is ziek dus ik moet werken", "accepted_answers": [{"value": "Mijn collega is ziek dus ik moet werken", "status": "correct"}, {"value": "Mijn collega is ziek dus moet ik werken", "status": "correct"}], "feedback": "*Mijn collega is ziek, dus ik moet werken.*"}
