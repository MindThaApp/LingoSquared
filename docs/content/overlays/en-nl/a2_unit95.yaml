course:
  title: "Dutch A2"
  description: "Grammar-led A2 Dutch for talking about real conditions."
  learning_goal: "Say what happens or will happen if a condition is met, using als + present tense, verb-final order in the als-clause and inversion in the main clause."
units:
  nl.a2.unit95.als_dan: {"title": "If ... then", "description": "Talk about weather plans and shop rules with real conditions: als + present, with or without dan."}
lessons:
  nl.a2.unit95.lesson01.als_het_regent: {"title": "If it rains"}
  nl.a2.unit95.lesson02.werkwoord_achteraan: {"title": "The verb at the end"}
  nl.a2.unit95.lesson03.voorop_of_achteraan: {"title": "First or last"}
  nl.a2.unit95.lesson04.regels_in_de_winkel: {"title": "Rules in the shop"}
  nl.a2.unit95.lesson05.noors_bericht: {"title": "Noor's message"}
  nl.a2.unit95.lesson06.lotte_en_omar: {"title": "Lotte and Omar make plans"}
teaching:
  nl.a2.unit95.lesson01.teach.weer: {"title": "Weather", "gloss": "the weather / the sun / to shine / to rain / nice / cold / warm", "note": "Weather sentences use *het*: *Het regent*, *Het is koud*. The sun is the subject of *schijnen*: *De zon schijnt*.", "example_gloss": ["The weather is nice.", "The sun is shining.", "It is raining.", "It is cold.", "It is warm."]}
  nl.a2.unit95.lesson01.teach.plannen: {"title": "Plans", "gloss": "to stay at home / to walk / to go to the park / to go to the beach", "note": "With *ik* the ending of the infinitive drops: *blijven* becomes *ik blijf*, *gaan* becomes *ik ga*. With *we* the verb is the same as the infinitive: *we blijven, we gaan*.", "example_gloss": ["I stay at home.", "I go to the park.", "We go to the beach.", "We stay at home.", "We walk in the park."]}
  nl.a2.unit95.lesson01.teach.vraag: {"title": "Ask about plans", "gloss": "What do you do if it rains?", "note": "*Als* means 'if'. This question has the *als*-clause at the end."}
  nl.a2.unit95.lesson01.teach.gn_als_basis: {"title": "Als for real conditions", "gloss": "If it rains, I stay at home. If the sun shines, I go to the park.", "note": "Use *als* + present tense for something that really can happen. The *als*-clause names the condition, the other clause says what happens or what you do. This unit only covers real conditions, not imaginary ones."}
  nl.a2.unit95.lesson01.teach.zinnen: {"title": "Two plans", "gloss": "If it is cold, I stay at home. If it is warm, we go to the beach."}
  nl.a2.unit95.lesson02.teach.tijd: {"title": "Time and calling", "gloss": "to have time / to call / to come along", "note": "*Hebben* and *komen* change with the subject: *ik heb, je hebt, hij heeft*; *ik kom, je komt, hij komt*. Whenever *je* follows the verb (in a question, or in a main clause after an *als*-clause), the *-t* disappears: *heb je, kom je*.", "example_gloss": ["I have time.", "Do you have time?", "Omar has time.", "I call Lotte.", "Omar calls Lotte.", "Are you coming along?", "He is coming along."]}
  nl.a2.unit95.lesson02.teach.drinken: {"title": "Drinks", "gloss": "to drink / tea / water / coffee", "example_gloss": ["I drink tea.", "We drink coffee.", "I drink water."]}
  nl.a2.unit95.lesson02.teach.gn_werkwoord_achteraan: {"title": "The verb goes last in the als-clause", "gloss": "If I have time, I call Lotte.", "note": "In an *als*-clause the conjugated verb goes to the end of the clause (in the simple sentences of this unit, it is the last word). Say *als ik tijd heb*, not *als ik heb tijd*. The same holds for *als het koud is* and *als de zon schijnt*."}
  nl.a2.unit95.lesson02.teach.gn_personen: {"title": "Other subjects", "gloss": "If you have time, you come along. If Omar has time, he comes along.", "note": "Inside the *als*-clause the verb is last and agrees with its subject: *je hebt*, *Omar heeft*. In the main clause that follows the *als*-clause, the verb comes first and the subject after it: *kom je*, *komt hij*."}
  nl.a2.unit95.lesson02.teach.zinnen: {"title": "Drinks and weather", "gloss": "If it is warm, I drink water. If it is cold, I drink tea."}
  nl.a2.unit95.lesson03.teach.plaatsen: {"title": "Days and places", "gloss": "tomorrow / Saturday / the museum / the market", "example_gloss": ["Tomorrow I go to the market.", "On Saturday we go to the museum.", "The museum is nice."]}
  nl.a2.unit95.lesson03.teach.gn_inversie: {"title": "Als-clause first: verb before subject", "gloss": "If it rains, I go to the museum.", "note": "When the *als*-clause comes first, it counts as the first position of the sentence. The main clause then starts with the verb, and the subject follows: *ga ik*, not *ik ga*. Put a comma after the *als*-clause."}
  nl.a2.unit95.lesson03.teach.gn_dan: {"title": "Optional dan", "gloss": "If it rains, then I go to the museum.", "note": "You may add *dan* ('then') after the comma. It is optional. The verb still comes right after *dan* and before the subject: *dan ga ik*."}
  nl.a2.unit95.lesson03.teach.gn_achteraan: {"title": "Main clause first", "gloss": "I go to the museum if it rains.", "note": "You can also start with the main clause. Then the word order is normal (*ik ga*), there is no inversion, and you usually write no comma. The meaning is the same as *Als het regent, ga ik naar het museum.*"}
  nl.a2.unit95.lesson03.teach.zinnen: {"title": "Both orders", "gloss": "If the sun shines, then we go to the beach. We go to the market if the weather is nice."}
  nl.a2.unit95.lesson04.teach.winkel: {"title": "In the shop", "gloss": "the shop / the receipt / the money / the discount / free", "note": "*De bon* is the receipt you get in a shop. *Geen* means 'no' or 'not any' before a noun: *geen geld*.", "example_gloss": ["I am in the shop.", "I have the receipt.", "I have no money.", "The discount is nice."]}
  nl.a2.unit95.lesson04.teach.werkwoorden: {"title": "Shop verbs", "gloss": "to buy / to pay / to get / back", "note": "*Je krijgt je geld terug* = you get your money back. With *ik* the verb has no ending; with *je* it ends in *-t*, except when *je* follows the verb: *krijg je*.", "example_gloss": ["I buy two.", "You pay fifty euros.", "You get a discount.", "You get your money back."]}
  nl.a2.unit95.lesson04.teach.bedragen: {"title": "Numbers and delivery", "gloss": "two / fifty / euro / more than / delivery / not", "example_gloss": ["The delivery is free.", "I pay more than fifty euros.", "I do not have the receipt."]}
  nl.a2.unit95.lesson04.teach.gn_regels: {"title": "Shop rules use als + present", "gloss": "If you have the receipt, you get your money back.", "note": "Shops state their rules as real conditions: *als* + present tense, verb last in the *als*-clause, and in the main clause after it the verb comes before the subject. Many shops use *u* instead of *je*, but the structure is the same."}
  nl.a2.unit95.lesson04.teach.zinnen: {"title": "Two shop rules", "gloss": "If you buy two, you get a discount. If you do not have the receipt, you do not get your money back."}
  nl.a2.unit95.lesson04.teach.gn_wanneer: {"title": "Als or wanneer?", "gloss": "When do we go to the shop?", "note": "In everyday Dutch, *als* is the normal word for 'if' in a condition. *Wanneer* mainly asks 'when?' in a question. Do not use *wanneer* for the conditions in this unit."}
  nl.a2.unit95.lesson05.teach.reading: {"title": "Noor's plans", "gloss": "Hi Lotte and Omar! On Saturday we are going to the beach if the sun shines. If it rains, we go to the museum. If it is cold, we drink tea. If you have time, will you come along? Greetings, Noor", "note": "Follow which plan goes with which condition. Notice the verb at the end of every *als*-clause.", "glosses": {"Hoi": "hi", "jullie": "you (plural)", "Groetjes": "greetings"}}
  nl.a2.unit95.lesson06.teach.lotte_vraag: {"title": "Lotte asks about Saturday", "gloss": "Lotte: Hi Omar, what are you doing on Saturday?"}
  nl.a2.unit95.lesson06.teach.omar_strand: {"title": "Omar names a condition", "gloss": "Omar: If the weather is nice, I go to the beach."}
  nl.a2.unit95.lesson06.teach.lotte_regen: {"title": "Lotte asks about rain", "gloss": "Lotte: And if it rains?"}
  nl.a2.unit95.lesson06.teach.omar_museum: {"title": "Omar offers a plan and an invitation", "gloss": "Omar: Then I go to the museum. If you have time, will you come along?"}
  nl.a2.unit95.lesson06.teach.lotte_mee: {"title": "Lotte accepts with a condition", "gloss": "Lotte: Yes, I have Saturday off. If the sun shines, I'll come along."}
  nl.a2.unit95.lesson06.teach.omar_tot: {"title": "Omar closes the conversation", "gloss": "Omar: Nice! See you Saturday!"}
exercises:
  nl.a2.unit95.lesson01.exercise01.choose_regent_thuis: {"instruction": "Choose the Dutch sentence that matches the English.", "correct_option": "Als het regent, blijf ik thuis.", "distractors": ["Als de zon schijnt, blijf ik thuis.", "Als het regent, ga ik naar het park.", "Als het koud is, ga ik naar het strand."], "accepted_answers": [{"value": "Als het regent, blijf ik thuis.", "status": "correct"}], "feedback": "*Als het regent* = if it rains; *blijf ik thuis* = I stay at home."}
  nl.a2.unit95.lesson01.exercise02.choose_zon_park: {"instruction": "Choose the Dutch sentence that matches the English.", "correct_option": "Als de zon schijnt, gaan we naar het park.", "distractors": ["Als het regent, gaan we naar het park.", "Als de zon schijnt, blijven we thuis.", "Als het koud is, gaan we naar het park."], "accepted_answers": [{"value": "Als de zon schijnt, gaan we naar het park.", "status": "correct"}], "feedback": "*Als de zon schijnt* = if the sun shines; *gaan we* = we go."}
  nl.a2.unit95.lesson01.exercise03.match_condities: {"instruction": "Match each Dutch phrase to its English meaning.", "accepted_answers": [{"value": [{"left": "het regent", "right": "it rains"}, {"left": "de zon schijnt", "right": "the sun shines"}, {"left": "het is koud", "right": "it is cold"}, {"left": "het is warm", "right": "it is warm"}, {"left": "het is mooi weer", "right": "the weather is nice"}, {"left": "we blijven thuis", "right": "we stay at home"}], "status": "correct"}], "feedback": "These phrases are the building blocks of the sentences in this unit."}
  nl.a2.unit95.lesson01.exercise04.order_regent: {"instruction": "Put the words in order to say 'If it rains, I stay at home.'", "correct_option": "Als het regent blijf ik thuis", "accepted_answers": [{"value": "Als het regent blijf ik thuis", "status": "correct"}, {"value": "Ik blijf thuis als het regent", "status": "correct"}], "feedback": "*Als het regent, blijf ik thuis.* You can also put the *als*-clause last: *Ik blijf thuis als het regent.*"}
  nl.a2.unit95.lesson01.exercise05.complete_regent: {"instruction": "Complete the sentence: 'If it rains, I stay at home.'", "correct_option": "regent", "accepted_answers": [{"value": "regent", "status": "correct"}], "feedback": "*Het regent* = it rains."}
  nl.a2.unit95.lesson01.exercise06.translate_zon_park: {"instruction": "Translate into Dutch.", "accepted_answers": [{"value": "Als de zon schijnt, ga ik naar het park.", "status": "correct"}, {"value": "Als de zon schijnt ga ik naar het park.", "status": "correct"}, {"value": "Ik ga naar het park als de zon schijnt.", "status": "correct"}, {"value": "Ik ga naar het park, als de zon schijnt.", "status": "correct"}], "feedback": "*Als de zon schijnt, ga ik naar het park.*"}
  nl.a2.unit95.lesson01.exercise07.write_koud: {"instruction": "Write the requested Dutch sentence.", "correct_option": "Als het koud is, blijf ik thuis.", "accepted_answers": [{"value": "Als het koud is, blijf ik thuis.", "status": "correct"}, {"value": "Als het koud is blijf ik thuis.", "status": "correct"}, {"value": "Ik blijf thuis als het koud is.", "status": "correct"}, {"value": "Ik blijf thuis, als het koud is.", "status": "correct"}], "feedback": "*Als het koud is, blijf ik thuis.*"}
  nl.a2.unit95.lesson02.exercise01.choose_tijd_bel: {"instruction": "Choose the sentence with the verb in the right place.", "correct_option": "Als ik tijd heb, bel ik Lotte.", "distractors": ["Als ik heb tijd, bel ik Lotte.", "Als ik tijd heb, ik bel Lotte.", "Als ik tijd heb, ik Lotte bel."], "accepted_answers": [{"value": "Als ik tijd heb, bel ik Lotte.", "status": "correct"}], "feedback": "In the *als*-clause the verb is last: *als ik tijd heb*. Then the main clause starts with the verb: *bel ik*."}
  nl.a2.unit95.lesson02.exercise02.choose_omar: {"instruction": "Choose the sentence with the verbs in the right places.", "correct_option": "Als Omar tijd heeft, komt hij mee.", "distractors": ["Als Omar heeft tijd, komt hij mee.", "Als Omar tijd heeft, hij komt mee.", "Als Omar tijd heeft, komt mee hij."], "accepted_answers": [{"value": "Als Omar tijd heeft, komt hij mee.", "status": "correct"}], "feedback": "*Heeft* is last in the *als*-clause; *komt hij mee* starts with the verb."}
  nl.a2.unit95.lesson02.exercise03.match_clauses: {"instruction": "Match each Dutch als-clause to its English meaning.", "accepted_answers": [{"value": [{"left": "Als ik tijd heb", "right": "If I have time"}, {"left": "Als je tijd hebt", "right": "If you have time"}, {"left": "Als Omar tijd heeft", "right": "If Omar has time"}, {"left": "Als het warm is", "right": "If it is warm"}, {"left": "Als het koud is", "right": "If it is cold"}, {"left": "Als de zon schijnt", "right": "If the sun shines"}], "status": "correct"}], "feedback": "Each clause ends with its verb: *heb, hebt, heeft, is, schijnt*."}
  nl.a2.unit95.lesson02.exercise04.order_kom_mee: {"instruction": "Put the words in order to say 'If you have time, you come along.'", "correct_option": "Als je tijd hebt kom je mee", "accepted_answers": [{"value": "Als je tijd hebt kom je mee", "status": "correct"}], "feedback": "*Als je tijd hebt, kom je mee.* *Hebt* is last in the *als*-clause, and *kom* comes right after it."}
  nl.a2.unit95.lesson02.exercise05.complete_heb: {"instruction": "Complete with the present tense of hebben: 'If I have time, I call Lotte.'", "correct_option": "heb", "accepted_answers": [{"value": "heb", "status": "correct"}], "feedback": "*Ik heb* is the present tense of *hebben* for *ik*, and it stands at the end of the *als*-clause."}
  nl.a2.unit95.lesson02.exercise06.translate_je_tijd: {"instruction": "Translate into Dutch.", "accepted_answers": [{"value": "Als je tijd hebt, bel ik Lotte.", "status": "correct"}, {"value": "Als je tijd hebt bel ik Lotte.", "status": "correct"}, {"value": "Ik bel Lotte als je tijd hebt.", "status": "correct"}, {"value": "Ik bel Lotte, als je tijd hebt.", "status": "correct"}, {"value": "Als jij tijd hebt, bel ik Lotte.", "status": "correct"}, {"value": "Ik bel Lotte als jij tijd hebt.", "status": "correct"}], "feedback": "*Als je tijd hebt, bel ik Lotte.*"}
  nl.a2.unit95.lesson02.exercise07.write_warm_water: {"instruction": "Write the requested Dutch sentence.", "correct_option": "Als het warm is, drink ik water.", "accepted_answers": [{"value": "Als het warm is, drink ik water.", "status": "correct"}, {"value": "Als het warm is drink ik water.", "status": "correct"}, {"value": "Ik drink water als het warm is.", "status": "correct"}, {"value": "Ik drink water, als het warm is.", "status": "correct"}], "feedback": "*Als het warm is, drink ik water.*"}
  nl.a2.unit95.lesson03.exercise01.choose_inversie: {"instruction": "Choose the sentence with the correct word order after the als-clause.", "correct_option": "Als het regent, ga ik naar het museum.", "distractors": ["Als het regent, ik ga naar het museum.", "Als het regent, ga naar het museum ik.", "Als het regent ik naar het museum ga."], "accepted_answers": [{"value": "Als het regent, ga ik naar het museum.", "status": "correct"}], "feedback": "After a fronted *als*-clause the verb comes first: *ga ik*."}
  nl.a2.unit95.lesson03.exercise02.choose_achteraan: {"instruction": "Choose the correct sentence with the main clause first.", "correct_option": "Ik ga naar de markt als de zon schijnt.", "distractors": ["Ik ga naar de markt als schijnt de zon.", "Ik ga naar de markt als de zon schijnen.", "Ik naar de markt ga als de zon schijnt."], "accepted_answers": [{"value": "Ik ga naar de markt als de zon schijnt.", "status": "correct"}], "feedback": "With the main clause first the order stays normal, and the *als*-clause ends with its verb."}
  nl.a2.unit95.lesson03.exercise03.listen_zon_strand: {"instruction": "Listen and select what you hear.", "correct_option": "Als de zon schijnt, dan gaan we naar het strand.", "distractors": ["Als het regent, dan gaan we naar het museum.", "Als de zon schijnt, gaan we naar de markt.", "Als de zon schijnt, dan blijven we thuis."], "accepted_answers": [{"value": "Als de zon schijnt, dan gaan we naar het strand.", "status": "correct"}], "feedback": "You heard *Als de zon schijnt, dan gaan we naar het strand.*"}
  nl.a2.unit95.lesson03.exercise04.match_volgorde: {"instruction": "Match each sentence that starts with als to the same sentence with the main clause first.", "accepted_answers": [{"value": [{"left": "Als het regent, ga ik naar het museum.", "right": "Ik ga naar het museum als het regent."}, {"left": "Als de zon schijnt, ga ik naar het strand.", "right": "Ik ga naar het strand als de zon schijnt."}, {"left": "Als het koud is, blijf ik thuis.", "right": "Ik blijf thuis als het koud is."}, {"left": "Als ik tijd heb, ga ik naar de markt.", "right": "Ik ga naar de markt als ik tijd heb."}, {"left": "Als het warm is, drink ik water.", "right": "Ik drink water als het warm is."}, {"left": "Als je tijd hebt, bel ik Lotte.", "right": "Ik bel Lotte als je tijd hebt."}], "status": "correct"}], "feedback": "The meaning stays the same. Only the order changes: *ga ik* (after the als-clause) becomes *ik ga* (main clause first)."}
  nl.a2.unit95.lesson03.exercise05.order_dan: {"instruction": "Put the words in order to say 'If the sun shines, then we go to the beach.'", "correct_option": "Als de zon schijnt dan gaan we naar het strand", "accepted_answers": [{"value": "Als de zon schijnt dan gaan we naar het strand", "status": "correct"}, {"value": "Als de zon schijnt gaan we dan naar het strand", "status": "correct"}], "feedback": "*Als de zon schijnt, dan gaan we naar het strand.* The verb comes right after *dan*."}
  nl.a2.unit95.lesson03.exercise06.complete_ga: {"instruction": "Complete with the verb gaan (I go): 'If it rains, I go to the museum.'", "correct_option": "ga", "accepted_answers": [{"value": "ga", "status": "correct"}], "feedback": "After the *als*-clause the verb comes first: *ga ik*."}
  nl.a2.unit95.lesson03.exercise07.translate_koud_thuis: {"instruction": "Translate into Dutch.", "accepted_answers": [{"value": "Ik blijf thuis als het koud is.", "status": "correct"}, {"value": "Ik blijf thuis, als het koud is.", "status": "correct"}, {"value": "Als het koud is, blijf ik thuis.", "status": "correct"}, {"value": "Als het koud is blijf ik thuis.", "status": "correct"}, {"value": "Als het koud is, dan blijf ik thuis.", "status": "correct"}, {"value": "Als het koud is dan blijf ik thuis.", "status": "correct"}], "feedback": "*Ik blijf thuis als het koud is.* You can also start with the *als*-clause: *Als het koud is, blijf ik thuis.*"}
  nl.a2.unit95.lesson04.exercise01.choose_bon: {"instruction": "Choose the Dutch sentence that matches the English.", "correct_option": "Als je de bon hebt, krijg je je geld terug.", "distractors": ["Als je de bon niet hebt, krijg je je geld terug.", "Als je twee koopt, krijg je je geld terug.", "Als je de bon hebt, krijg je korting."], "accepted_answers": [{"value": "Als je de bon hebt, krijg je je geld terug.", "status": "correct"}], "feedback": "*De bon hebben* = to have the receipt; *je geld terug krijgen* = to get your money back."}
  nl.a2.unit95.lesson04.exercise02.read_bezorging: {"instruction": "Read the shop rule. A customer pays 60 euros. What happens to the delivery?", "correct_option": "The delivery is free.", "distractors": ["The customer gets a receipt.", "The customer must pay more.", "The customer gets no delivery."], "accepted_answers": [{"value": "The delivery is free.", "status": "correct"}], "feedback": "60 euros is more than fifty euros, so the condition is met."}
  nl.a2.unit95.lesson04.exercise03.match_regels: {"instruction": "Match each Dutch condition to the result that fits it.", "accepted_answers": [{"value": [{"left": "Als je de bon hebt", "right": "you get your money back"}, {"left": "Als je de bon niet hebt", "right": "you do not get your money back"}, {"left": "Als je twee koopt", "right": "you get a discount"}, {"left": "Als je meer dan vijftig euro betaalt", "right": "delivery is free"}, {"left": "Als het regent", "right": "I stay at home"}, {"left": "Als de zon schijnt", "right": "we go to the beach"}], "status": "correct"}], "feedback": "Each condition leads to one result."}
  nl.a2.unit95.lesson04.exercise04.order_korting: {"instruction": "Put the words in order to say 'If you buy two, you get a discount.'", "correct_option": "Als je twee koopt krijg je korting", "accepted_answers": [{"value": "Als je twee koopt krijg je korting", "status": "correct"}], "feedback": "*Als je twee koopt, krijg je korting.*"}
  nl.a2.unit95.lesson04.exercise05.complete_bezorging: {"instruction": "Complete the shop rule with the Dutch noun for 'delivery'.", "correct_option": "bezorging", "accepted_answers": [{"value": "bezorging", "status": "correct"}], "feedback": "*De bezorging* = the delivery."}
  nl.a2.unit95.lesson04.exercise06.translate_bezorging: {"instruction": "Translate into Dutch.", "accepted_answers": [{"value": "Als je meer dan vijftig euro betaalt, is de bezorging gratis.", "status": "correct"}, {"value": "Als je meer dan vijftig euro betaalt is de bezorging gratis.", "status": "correct"}, {"value": "Als je meer dan vijftig euro betaalt, dan is de bezorging gratis.", "status": "correct"}, {"value": "Als je meer dan vijftig euro betaalt dan is de bezorging gratis.", "status": "correct"}, {"value": "De bezorging is gratis als je meer dan vijftig euro betaalt.", "status": "correct"}, {"value": "De bezorging is gratis, als je meer dan vijftig euro betaalt.", "status": "correct"}, {"value": "Als jij meer dan vijftig euro betaalt, is de bezorging gratis.", "status": "correct"}, {"value": "Als jij meer dan vijftig euro betaalt, dan is de bezorging gratis.", "status": "correct"}, {"value": "De bezorging is gratis als jij meer dan vijftig euro betaalt.", "status": "correct"}], "feedback": "*Als je meer dan vijftig euro betaalt, is de bezorging gratis.*"}
