    title: "You say that we should work less, but I disagree."
    gloss: "You say that we should work less, but I disagree."
    note: "*Jij zegt dat X, maar ...* restates the other person's claim before countering it -- a real debate move, not neutral reporting. This is the outcome's \"reference the other person's view with a that-clause\" requirement made explicit."

