review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    Overlay for nl's ninth B1 unit, authored alongside the realization,
    no sibling-direction file (nl-en) consulted. English speakers' real
    risk here: English "agree"/"disagree" are single verbs with no
    built-in reference to the claim being (dis)agreed with, which doesn't
    warn a learner that Dutch's *(niet) eens zijn met* is a fixed
    idiom built around the pronoun *het* and the preposition-cluster
    *(er) (niet) mee* -- flagged explicitly in lesson02's grammar note as
    the single highest-risk point in this unit: *ermee* (contracted,
    positive) versus *er niet mee* (split apart by the negation, NOT
    *nermee* or *ermee niet*) is a real, non-obvious Dutch grammar fact
    with no direct English parallel to reason from. Also flagged: English
    "you say (that)" reads as neutral reporting, but Dutch *jij zegt dat*
    (lesson03) followed by an explicit disagreement is a genuine
    rhetorical debate move (restating the other person's claim before
    countering it) that an English speaker might undertranslate as mere
    narration rather than the start of a rebuttal. Fresh-context review
    2026-07-11 complete: instructions/distractors/accepted_answers
    verified against the realization; recognize_eens uses an "in this
    context" instruction (so the "once" sense of *eens* is not a trap);
    listen_select distractors on the full-dialogue audio are not lines
    the quizzed speaker says; matching_pairs keys aligned; no
    snake_case/boolean/"reviewed" leaks. No objective bugs.

course:
  title: Dutch B1
  description: >-
    Intermediate Dutch: agreeing and disagreeing with someone else's
    opinion and supporting your own position with a reason, using the
    *(niet) eens zijn met* construction and its built-in *dat*-clause.

units:
