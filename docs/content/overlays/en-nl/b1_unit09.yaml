    gloss: "because people need more rest"
    example_gloss: "I agree that a four-day work week is good, because people need more rest."
  nl.b1.unit09.lesson01.teach.grammar_eens_dat:
    title: "I agree that a four-day work week is good, because people need more rest."
    gloss: "I agree that a four-day work week is good, because people need more rest."
    note: "*Ik ben het ermee eens dat X* is the fixed idiom for agreeing WITH a specific claim -- the *dat*-clause naming the claim is built into the construction, not an optional add-on. *Ermee* is the contracted, positive form (*er* + *mee*)."

  nl.b1.unit09.lesson02.teach.er_niet_mee_eens:
    title: "I disagree"
    gloss: "I disagree"
    example_gloss: "I disagree that a four-day work week is good."
  nl.b1.unit09.lesson02.teach.bedrijven_geld_kost:
    title: "it costs companies money"
    gloss: "it costs companies money"
    example_gloss: "I disagree that a four-day work week is good, because it costs companies money."
  nl.b1.unit09.lesson02.teach.grammar_ermee_vs_er_niet_mee:
    title: "I agree. I disagree."
    gloss: "I agree. I disagree."
    note: "Negating this idiom does NOT just add *niet* to *ermee* -- *ermee* splits apart into *er ... niet mee*, with *niet* wedged in the middle: *ik ben het ER NIET MEE eens*. There is no such word as *ernietmee* or *ermee niet* in this construction."

  nl.b1.unit09.lesson03.teach.jij_zegt_dat:
    title: "You say that"
