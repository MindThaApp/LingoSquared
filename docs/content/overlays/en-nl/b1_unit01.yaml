  status: reviewed
  required_next_reviewer: null
  notes: >-
    Overlay for nl's first B1 unit, authored alongside the realization
    since no adaptable intermediate-level public-domain Dutch source
    exists (firecrawl returned HTTP 402, WebSearch confirmed no genuine
    FSI/Peace-Corps-equivalent intermediate Dutch course -- see the
    realization file's own provenance note for detail). English
    speakers' real interference risk with *zou*/*zouden*: English
    "would" doesn't change form for singular vs. plural subjects, so
    learners may default to *zou* even with a plural subject (wij/
    jullie/zij) -- flagged explicitly in lesson02's contrastive notes.
    A second, subtler risk: English "if I had" uses the same past-tense
    form for both a real past fact and an unreal hypothetical ("if I
    had time yesterday" vs. "if I had time right now, hypothetically"),
    while Dutch's *als*-clause here is unambiguously irrealis by
    construction (paired with a *zou*-clause) -- flagged in lesson03.
    Fresh-context review 2026-07-11: replaced two unanswerable
