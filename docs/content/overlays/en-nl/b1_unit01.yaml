    geld ...; lesson04.exercise07: added Later zou ik misschien ...;
    lesson06.exercise02: added naar de dokter gaan variants. NATIVE FLAGS:
    een dokter bezoeken sounds stiff (naar de dokter gaan is idiomatic);
    Stel je voor dat je ... zou winnen vs. won.

course:
  title: Dutch B1
  description: >-
    Intermediate Dutch: expressing hypothetical and unreal situations
    using the conditional mood (*zou*/*zouden* + infinitive) together
    with an unreal *als*-clause in the imperfectum (*had*, *was*,
    *kon*) -- Dutch's closest structural equivalent to a subjunctive --
    across everyday wishes, plans, and reflections.

units:
  nl.b1.unit01.hypothetische_situaties:
    title: "Hypothetical Situations"
    description: Say what you would do in a hypothetical or unreal situation, using the conditional mood together with an unreal if-clause.

lessons:
  nl.b1.unit01.lesson01.ik_zou_graag:
    title: "I would gladly..."
  nl.b1.unit01.lesson02.wij_zouden:
    title: "We would..."
  nl.b1.unit01.lesson03.als_had_was:
    title: "If I had... I would..."
  nl.b1.unit01.lesson04.de_loterij:
    title: "Imagine..."
  nl.b1.unit01.lesson05.opnieuw_kiezen:
    title: "If I could choose again"
  nl.b1.unit01.lesson06.wrapup_production:
    title: "Review"

teaching:
  nl.b1.unit01.lesson01.teach.ik:
    title: I
    gloss: I
    example_gloss: "I would gladly travel."
  nl.b1.unit01.lesson01.teach.jij_je:
    title: "you"
    gloss: "you (informal)"
    note: "Two forms of the same word: *je* is the natural, everyday form used almost everywhere; *jij* is used only for real contrastive emphasis, like stressing 'you' in English ('And what would YOU do?'). Both take the same verb forms -- this isn't formal vs. informal (that's *je*/*jij* vs. *u*), it's unstressed vs. stressed."
    example_gloss: ["Would you do that too?", "What would you do?"]
  nl.b1.unit01.lesson01.teach.zou:
    title: would
    gloss: would
    note: "*Zou* is the conditional-mood form used with ik/jij/je/hij/zij (singular subjects). English 'would' never changes form for person or number, but Dutch has two forms -- *zou* (singular) here, *zouden* (plural) in the next lesson. It always pushes the infinitive verb to the very end of the sentence, the same V2-plus-final-infinitive pattern as *kan*/*moet*/*wil*."
    example_gloss: "I would gladly travel."
  nl.b1.unit01.lesson01.teach.graag:
    title: "gladly / would like to"
    gloss: "gladly / would like to"
    note: "*Graag* softens a wish into a polite preference -- *ik zou graag* is the standard way to say 'I would like to,' much softer and more common in speech than a bare *ik zou*."
    example_gloss: "I would gladly drink coffee."
  nl.b1.unit01.lesson01.teach.reizen:
    title: "to travel"
    gloss: "to travel"
    example_gloss: "I would gladly travel."
  nl.b1.unit01.lesson01.teach.naar_spanje:
    title: "to Spain"
    gloss: "to Spain"
    example_gloss: "I would gladly travel to Spain."
  nl.b1.unit01.lesson01.teach.wat:
    title: what
    gloss: what
    example_gloss: "What would you do?"
  nl.b1.unit01.lesson01.teach.doen:
    title: "to do"
    gloss: "to do"
    example_gloss: "What would you do?"
  nl.b1.unit01.lesson01.teach.dat:
    title: "that / it"
    gloss: "that / it"
    example_gloss: "I would gladly do that."
  nl.b1.unit01.lesson01.teach.grammar_zou:
    title: "I would gladly travel to Spain. What would you do?"
    gloss: "I would gladly travel to Spain. What would you do?"
    note: "*Zou* + infinitive is the Dutch conditional mood -- the infinitive always goes to the end of the clause. *Zou* itself is identical for ik, jij/je, and hij/zij; only the plural forms (wij/jullie/zij) change it, in the next lesson."

  nl.b1.unit01.lesson02.teach.zouden:
    title: "would (plural)"
    gloss: "would (plural)"
    note: "*Zouden* is the plural counterpart of *zou* -- used with wij/jullie/zij. English 'would' doesn't change for plural subjects, so this is a real place to double-check subject-verb agreement that English gives you no cue for."
    example_gloss: "We would buy a house."
  nl.b1.unit01.lesson02.teach.wij:
    title: we
    gloss: we
    example_gloss: "We would gladly travel."
  nl.b1.unit01.lesson02.teach.jullie:
    title: "you (plural)"
    gloss: "you (plural)"
    example_gloss: "Would you (plural) do that too?"
  nl.b1.unit01.lesson02.teach.zij_ze:
    title: they
    gloss: they
    note: "Two forms of the same word, same pattern as *jij*/*je*: *ze* is the natural everyday form, *zij* is for emphasis. (*Zij*/*ze* can also mean 'she' in the singular -- context and the verb form, *zou* vs. *zouden*, tell you which.)"
    example_gloss: ["They would buy a house.", "They would gladly travel."]
  nl.b1.unit01.lesson02.teach.een_huis_kopen:
    title: "to buy a house"
    gloss: "to buy a house"
    example_gloss: "We would buy a house."
  nl.b1.unit01.lesson02.teach.meer_geld:
    title: "more money"
    gloss: "more money"
    example_gloss: "With more money, we would buy a house."
  nl.b1.unit01.lesson02.teach.met:
    title: with
    gloss: with
    example_gloss: "With more money, we would buy a house."
  nl.b1.unit01.lesson02.teach.ook:
    title: "also / too"
    gloss: "also / too"
    example_gloss: "Would you (plural) do that too?"
  nl.b1.unit01.lesson02.teach.grammar_zou_zouden:
    title: "I would buy a house. We would buy a house. You (pl.) would buy a house. They would buy a house."
    gloss: "I would buy a house. We would buy a house. You (pl.) would buy a house. They would buy a house."
    note: "*Zou* (ik, jij/je, hij/zij) vs. *zouden* (wij, jullie, zij) -- the only agreement distinction the conditional makes. English speakers' real trap: 'would' never changes in English, so it's easy to default to *zou* even with a plural subject. Check the subject every time, not just the meaning."

  nl.b1.unit01.lesson03.teach.als:
    title: if
    gloss: if
    note: "*Als* introduces a conditional clause. Paired with *had*/*was* (this lesson) and a *zou*-clause, it specifically marks an UNREAL condition -- something not actually true right now -- unlike a plain real condition ('if it rains, I take an umbrella'), which uses ordinary present tense on both sides."
    example_gloss: "If I had time, I would travel."
  nl.b1.unit01.lesson03.teach.tijd:
    title: time
    gloss: time
    example_gloss: "If I had more time, I would exercise."
  nl.b1.unit01.lesson03.teach.had:
    title: "had (unreal 'to have')"
    gloss: "had (unreal 'to have')"
    note: "Same written form as the ordinary simple past of *hebben*, but here it marks an UNREAL present condition, not something that really happened in the past. English does the same double duty with 'had' -- context (paired with a *zou*/'would' clause) is what signals 'unreal now,' not the verb form alone."
    example_gloss: "If I had more time, I would exercise more often."
  nl.b1.unit01.lesson03.teach.was:
    title: "were (unreal 'to be')"
    gloss: "were (unreal 'to be')"
    note: "The unreal-conditional form of *zijn*. English sometimes marks this specially ('if I WERE rich,' not 'if I was rich,' in careful writing) -- Dutch just reuses the ordinary simple-past form *was* for every subject, singular or plural, with no special unreal form to learn separately."
    example_gloss: "If I were rich, I would buy a house."
  nl.b1.unit01.lesson03.teach.rijk:
    title: rich
    gloss: rich
    example_gloss: "If I were rich, I would travel."
  nl.b1.unit01.lesson03.teach.sporten:
    title: "to exercise / play sports"
    gloss: "to exercise / play sports"
    example_gloss: "If I had more time, I would exercise more often."
  nl.b1.unit01.lesson03.teach.vaker:
    title: "more often"
    gloss: "more often"
    example_gloss: "I would exercise more often."
  nl.b1.unit01.lesson03.teach.grammar_als_irrealis:
    title: "If I had more time, I would exercise more often. If I were rich, I would travel."
    gloss: "If I had more time, I would exercise more often. If I were rich, I would travel."
    note: "The full pattern: *als* + imperfectum (*had*/*was*) + comma + *zou*/*zouden* + infinitive. This is Dutch's closest structural equivalent to a subjunctive -- a dedicated unreal-condition form, distinct from ordinary past narration, even though the individual verb forms (*had*, *was*) look identical to the simple past."

  nl.b1.unit01.lesson04.teach.stel_je_voor:
    title: "Imagine that..."
    gloss: "Imagine that..."
    example_gloss: "Imagine that you were rich."
  nl.b1.unit01.lesson04.teach.de_loterij_winnen:
    title: "to win the lottery"
    gloss: "to win the lottery"
    example_gloss: "I would gladly win the lottery."
  nl.b1.unit01.lesson04.teach.stoppen_met_werken:
    title: "to stop working"
    gloss: "to stop working"
    example_gloss: "I would stop working."
  nl.b1.unit01.lesson04.teach.de_wereld_rondreizen:
    title: "to travel around the world"
    gloss: "to travel around the world"
    example_gloss: "I would travel around the world."
  nl.b1.unit01.lesson04.teach.misschien:
    title: maybe
    gloss: maybe
    example_gloss: "Maybe I would do that."
  nl.b1.unit01.lesson04.teach.een_jaar_vrij_nemen:
    title: "to take a year off"
    gloss: "to take a year off"
    example_gloss: "I would take a year off."
  nl.b1.unit01.lesson04.teach.dialogue_lotte_ask:
    title: "Lotte: Imagine that you won the lottery. What would you do?"
    gloss: "Lotte: Imagine that you won the lottery. What would you do?"
  nl.b1.unit01.lesson04.teach.dialogue_omar_answer:
    title: "Omar: I would immediately stop working and travel around the world."
    gloss: "Omar: I would immediately stop working and travel around the world."
  nl.b1.unit01.lesson04.teach.dialogue_lotte_ask_huis:
    title: "Lotte: Wouldn't you buy a house?"
    gloss: "Lotte: Wouldn't you buy a house?"
  nl.b1.unit01.lesson04.teach.dialogue_omar_later:
    title: "Omar: Maybe later. First I would take a year off."
    gloss: "Omar: Maybe later. First I would take a year off."
  nl.b1.unit01.lesson04.teach.dialogue_lotte_geweldig:
    title: "Lotte: That sounds great."
    gloss: "Lotte: That sounds great."

  nl.b1.unit01.lesson05.teach.kon:
    title: "could (unreal 'to be able')"
    gloss: "could (unreal 'to be able')"
    note: "The unreal-conditional form of *kunnen*, paired with *als* the same way *had*/*was* are -- 'if I COULD choose again' describes an unreal ability to redo a real past choice."
    example_gloss: "If I could choose again, I would do something else."
  nl.b1.unit01.lesson05.teach.kiezen:
    title: "to choose"
    gloss: "to choose"
    example_gloss: "I would choose something else."
  nl.b1.unit01.lesson05.teach.iets_anders:
    title: "something else"
    gloss: "something else"
    example_gloss: "I would study something else."
  nl.b1.unit01.lesson05.teach.willen:
    title: "to want"
    gloss: "to want"
    note: "*Zou willen* ('would want') is the natural way to soften a stated wish about the future, similar in feel to *zou graag* but used before another verb (*willen worden*, 'would want to become')."
    example_gloss: "I would want to become a doctor."
  nl.b1.unit01.lesson05.teach.dokter:
    title: doctor
    gloss: doctor
    example_gloss: "She would love to become a doctor."
  nl.b1.unit01.lesson05.teach.werk:
    title: "work / job"
    gloss: "work / job"
    example_gloss: "Anouk is happy with her job."
  nl.b1.unit01.lesson05.teach.reading_sanne:
    title: "Reading: Anouk's other life"
    gloss: "Anouk works as a nurse. Sometimes she thinks: if I could choose again, I would study something else. She would like to become a doctor. That would take many years, though. Still, Anouk is very happy with her job."
    glosses:
      werkt: "works (3rd-person of werken, 'to work')"
      als: "as (here: 'works as'); also 'if' in 'als ik...' = 'if I...'"
      verpleegkundige: "nurse"
      Soms: "sometimes"
      denkt: "thinks (3rd-person of denken)"
      opnieuw: "again / anew"
      kon: "could (unreal past of kunnen, 'to be able')"
      kiezen: "to choose"
      zou: "would (conditional)"
      iets: "something"
      anders: "different / else ('iets anders' = something else)"
      studeren: "to study"
      graag: "gladly / would like to"
      dokter: "doctor"
      willen: "to want"
      worden: "to become"
      wel: "indeed / admittedly (softener here)"
      veel: "many / a lot of"
      jaren: "years (plural of jaar)"
      kosten: "to cost / take"
      Toch: "still / nevertheless"
      blij: "happy / glad"
      werk: "work / job"

  nl.b1.unit01.lesson06.teach.kunnen:
    title: "can / to be able to"
    gloss: "can / to be able to"
    example_gloss: "Could you help me?"
  nl.b1.unit01.lesson06.teach.moeten:
    title: "must / should"
    gloss: "must / should"
    example_gloss: "You should visit a doctor."
  nl.b1.unit01.lesson06.teach.helpen:
    title: "to help"
    gloss: "to help"
    note: "*Me* here is the unstressed object pronoun 'me' -- same idea as *je* vs. *jij*, this is the natural everyday form."
    example_gloss: "Could you help me?"
  nl.b1.unit01.lesson06.teach.bezoeken:
    title: "to visit"
    gloss: "to visit"
    example_gloss: "You should visit a doctor."
  nl.b1.unit01.lesson06.teach.grammar_review:
    title: "Could you help me? You should visit a doctor."
    gloss: "Could you help me? You should visit a doctor."
    note: "*Zou* + *kunnen*/*moeten* + infinitive softens a request or suggestion into something more polite than a bare *kun je*/*moet je* -- the same *zou* from every earlier lesson in this unit, now used for politeness rather than a hypothetical. All six lessons share the one core pattern: *zou*/*zouden* + infinitive at the end, optionally paired with an unreal *als*-clause."

exercises:
  nl.b1.unit01.lesson01.exercise01.recognize_zou:
    instruction: "What does this word mean?"
    correct_option: would
    distractors: [can, want, must]
    accepted_answers: [{value: would, status: correct}]
    feedback: "Zou means would."
  nl.b1.unit01.lesson01.exercise02.listen_zou_spanje:
    instruction: "Listen and select what you hear."
    correct_option: "I would gladly travel to Spain."
    distractors: ["I gladly travel to Spain.", "I would gladly work in Spain.", "I would gladly travel to France."]
    accepted_answers: [{value: "I would gladly travel to Spain.", status: correct}]
    feedback: "Ik zou graag naar Spanje reizen means I would gladly travel to Spain."
  nl.b1.unit01.lesson01.exercise03.match_wish_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {zou: would, graag: "gladly / would like to", reizen: "to travel", "naar Spanje": "to Spain", wat: what, doen: "to do", dat: "that / it"}
        status: correct
    feedback: "These are this lesson's core wish-expressing words."
  nl.b1.unit01.lesson01.exercise04.order_zou_spanje:
    instruction: "Put the words in order: I would gladly travel to Spain."
    accepted_answers:
      - {value: "Ik zou graag naar Spanje reizen", status: correct}
    feedback: "Ik zou graag naar Spanje reizen means I would gladly travel to Spain."
  nl.b1.unit01.lesson01.exercise05.translate_wat_zou_je_doen:
    instruction: "Translate into Dutch: What would you do?"
    accepted_answers:
      - {value: "Wat zou je doen", status: correct}
      - {value: "Wat zou je doen?", status: correct}
      - {value: "Wat zou jij doen", status: correct}
      - {value: "Wat zou jij doen?", status: correct}
    feedback: "Wat zou je doen? means what would you do?"
  nl.b1.unit01.lesson01.exercise06.speak_zou_dat_doen:
    instruction: "Say aloud in Dutch: I would gladly do that."
    accepted_answers:
      - {value: "Ik zou dat graag doen", status: correct}
    feedback: "Ik zou dat graag doen means I would gladly do that."
  nl.b1.unit01.lesson01.exercise07.write_zou_spanje:
    instruction: "Write in Dutch: I would gladly travel to Spain."
    accepted_answers:
      - {value: "Ik zou graag naar Spanje reizen", status: correct}
    feedback: "Ik zou graag naar Spanje reizen means I would gladly travel to Spain."
  nl.b1.unit01.lesson01.exercise08.dictation_zou_spanje:
    instruction: "Type what you hear."
    correct_response: "Ik zou graag naar Spanje reizen"
    orthography_strict: true
    feedback: "You heard Ik zou graag naar Spanje reizen — I would gladly travel to Spain."

  nl.b1.unit01.lesson02.exercise01.recognize_zouden:
    instruction: "What does this word mean?"
    correct_option: "would (plural)"
    distractors: ["would (singular)", "will (plural)", "could (plural)"]
    accepted_answers: [{value: "would (plural)", status: correct}]
    feedback: "Zouden is the plural form of would."
  nl.b1.unit01.lesson02.exercise02.listen_wij_zouden_huis:
    instruction: "Listen and select what you hear."
    correct_option: "We would buy a house."
    distractors: ["We would sell a house.", "They would buy a house.", "We would rent a house."]
    accepted_answers: [{value: "We would buy a house.", status: correct}]
    feedback: "Wij zouden een huis kopen means we would buy a house."
  nl.b1.unit01.lesson02.exercise03.match_plural_wish_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {zouden: "would (plural)", wij: we, jullie: "you (plural)", "zij, ze": they, "een huis kopen": "to buy a house", "meer geld": "more money", met: with, ook: "also / too"}
        status: correct
    feedback: "These are this lesson's plural wish-expressing words."
  nl.b1.unit01.lesson02.exercise04.order_zij_zouden_huis:
    instruction: "Put the words in order: They would buy a house."
    accepted_answers:
      - {value: "Zij zouden een huis kopen", status: correct}
    feedback: "Zij zouden een huis kopen means they would buy a house."
  nl.b1.unit01.lesson02.exercise05.translate_met_meer_geld:
    instruction: "Translate into Dutch: With more money, we would buy a house."
    accepted_answers:
      - {value: "Met meer geld zouden wij een huis kopen", status: correct}
      - {value: "Met meer geld zouden we een huis kopen", status: correct}
      - {value: "Wij zouden met meer geld een huis kopen", status: correct}
      - {value: "Wij zouden met meer geld een huis kopen.", status: correct}
    feedback: "Met meer geld zouden wij een huis kopen means with more money, we would buy a house."
  nl.b1.unit01.lesson02.exercise06.speak_zouden_jullie_ook:
    instruction: "Say aloud in Dutch: Would you (plural) do that too?"
    accepted_answers:
      - {value: "Zouden jullie dat ook doen", status: correct}
    feedback: "Zouden jullie dat ook doen? means would you (plural) do that too?"
  nl.b1.unit01.lesson02.exercise07.write_zij_zouden_huis:
    instruction: "Write in Dutch: They would buy a house."
    accepted_answers:
      - {value: "Zij zouden een huis kopen", status: correct}
      - {value: "Ze zouden een huis kopen", status: correct}
    feedback: "Zij zouden een huis kopen means they would buy a house."
  nl.b1.unit01.lesson02.exercise08.dictation_wij_zouden_huis:
    instruction: "Type what you hear."
    correct_response: "Wij zouden een huis kopen"
    orthography_strict: true
    feedback: "You heard Wij zouden een huis kopen — we would buy a house."

  nl.b1.unit01.lesson03.exercise01.recognize_als:
    instruction: "What does this word mean?"
    correct_option: if
    distractors: [but, because, although]
    accepted_answers: [{value: if, status: correct}]
    feedback: "Als means if."
  nl.b1.unit01.lesson03.exercise02.listen_als_tijd_had:
    instruction: "Listen and select what you hear."
    correct_option: "If I had more time, I would exercise more often."
    distractors: ["If I have more time, I exercise more often.", "If I had more money, I would exercise more often.", "If I had more time, I would travel more often."]
    accepted_answers: [{value: "If I had more time, I would exercise more often.", status: correct}]
    feedback: "Als ik meer tijd had, zou ik vaker sporten means if I had more time, I would exercise more often."
  nl.b1.unit01.lesson03.exercise03.match_irrealis_words:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - value: {als: if, tijd: time, had: "had (unreal 'to have')", was: "were (unreal 'to be')", rijk: rich, sporten: "to exercise / play sports", vaker: "more often"}
        status: correct
    feedback: "These are this lesson's unreal-condition words."
  nl.b1.unit01.lesson03.exercise04.order_als_rijk_was:
    instruction: "Put the words in order: If I were rich, I would travel."
    accepted_answers:
      - {value: "Als ik rijk was zou ik reizen", status: correct}
      - {value: "Ik zou reizen als ik rijk was", status: correct}
    feedback: "Als ik rijk was, zou ik reizen means if I were rich, I would travel."
  nl.b1.unit01.lesson03.exercise05.translate_als_meer_tijd:
