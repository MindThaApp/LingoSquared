review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    Overlay for nl's tenth B1 unit, authored alongside the realization,
    no sibling-direction file (nl-en) consulted. English speakers' real
    risk here: English "I'm almost done, but it's taking a bit longer
    than planned" reads as one flat statement, which doesn't warn a
    learner that Dutch's *het duurt iets langer dan gepland* uses *duren*
    (to take/last, of TIME) rather than a false-cognate reach for a verb
    that looks like "to take" -- flagged in lesson02's grammar note.
    Also flagged: this unit deliberately reuses b1_unit03's established
    *zou u ... kunnen* polite-request construction for a NEW specific
    speech act (asking a colleague for help, lesson03), not meeting
    logistics -- an English speaker who breezed through unit03 might
    assume this phrase only works for scheduling requests; it's a
    general polite-request frame that extends to any favor. Fresh-context
    review 2026-07-11 complete: instructions/distractors/accepted_answers
    verified against the realization; recognition distractors
    unambiguous, listen_select distractors on the full-dialogue audio
    are not lines the quizzed speaker says, matching_pairs keys aligned;
    no snake_case/boolean/"reviewed" leaks. No objective bugs.

course:
  title: Dutch B1
  description: >-
    Intermediate Dutch: describing your job responsibilities, giving a
    colleague a status update on a task, and asking a colleague for
    professional help, in appropriately professional register.

