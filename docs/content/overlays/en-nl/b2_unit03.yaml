course:
  title: Dutch B2
  description: >-
    Upper-intermediate Dutch: express nuance by softening or strengthening
    the same claim -- hedge it (eigenlijk, best, een beetje, nogal,
    enigszins, in zekere zin, volgens mij, naar mijn idee, het lijkt erop
    dat, ik zou zeggen dat), emphasize it (echt, heel, ontzettend, absoluut,
    zeker), or put focus on part of it (the cleft het is ... die/dat, the
    pseudo-cleft wat ... is, is ..., juist, wel degelijk) -- around the
    everyday topic of giving your opinion of a film.

units:
  nl.b2.unit03.nuance:
    title: "Nuance"
    description: Say the same thing tentatively, neutrally, or emphatically -- soften an opinion with a hedge, strengthen it with emphasis, and put focus on the part that matters, all around giving your opinion of a film.

lessons:
  nl.b2.unit03.lesson01.afzwakken:
    title: "Softening a claim"
  nl.b2.unit03.lesson02.voorzichtig:
    title: "Phrasing it cautiously"
  nl.b2.unit03.lesson03.benadrukken:
    title: "Emphasizing a claim"
  nl.b2.unit03.lesson04.focus:
    title: "Placing focus"
  nl.b2.unit03.lesson05.recensie:
    title: "Reading a review"
  nl.b2.unit03.lesson06.in_gesprek:
    title: "Nuance in conversation"

teaching:
  nl.b2.unit03.lesson01.teach.base_claim:
    title: "The film is good."
    gloss: "The film is good."
    note: "The blunt, neutral claim this whole unit softens and strengthens. Every lesson takes a claim like this and delivers it more tentatively (a hedge) or more forcefully (emphasis), without changing what is actually claimed."
  nl.b2.unit03.lesson01.teach.eigenlijk:
    title: actually
    gloss: "actually / really (in fact)"
    note: "*Eigenlijk* softens a claim by framing it as a considered second thought -- 'actually, it's good'. It is one of the most common Dutch hedges. It sits after the verb: *De film is eigenlijk goed*."
    example_gloss: "The film is actually good."
  nl.b2.unit03.lesson01.teach.best:
    title: "quite / pretty"
    gloss: "quite / pretty (fairly)"
    note: "As a hedge, *best* means 'fairly / pretty' -- *best goed* = 'pretty good', a step BELOW plain *goed* in force, not above it. (Do not confuse it with English 'best'.) It scales a claim down gently."
    example_gloss: "The film is pretty good."
  nl.b2.unit03.lesson01.teach.beetje:
    title: "a bit"
    gloss: "a bit / a little"
    note: "*Een beetje* softens by shrinking the degree: *een beetje langzaam* = 'a bit slow'. It makes a criticism gentler and less absolute."
    example_gloss: "The film is a bit slow."
  nl.b2.unit03.lesson01.teach.nogal:
    title: rather
    gloss: "rather / fairly"
    note: "*Nogal* = 'rather / fairly' -- a middling degree, often with a faint note of criticism: *nogal langzaam* = 'rather slow'. A softer hedge than a flat *heel* ('very')."
    example_gloss: "The film is rather slow."
  nl.b2.unit03.lesson01.teach.volgens_mij:
    title: "in my view"
    gloss: "in my view / I think"
    note: "*Volgens mij* ('in my view') hedges by marking the claim as your opinion, not a fact. Opening with it inverts the verb: *Volgens mij is de film goed*."
    example_gloss: "In my view the film is good."
  nl.b2.unit03.lesson01.teach.naar_mijn_idee:
    title: "to my mind"
    gloss: "to my mind / in my opinion"
    note: "*Naar mijn idee* is a slightly more considered cousin of *volgens mij* -- 'to my mind'. Like *volgens mij*, opening with it puts the verb next: *Naar mijn idee is de film goed*."
    example_gloss: "To my mind the film is good."
  nl.b2.unit03.lesson01.teach.wel:
    title: "(softener) after all"
    gloss: "(softening particle) -- 'does / is, after all'"
    note: "*Wel* is a small softening particle that takes the hard edge off a claim, often paired with *eigenlijk*: *De film is eigenlijk wel goed* = 'the film is actually pretty good (when you think about it)'. It signals mild, considered agreement rather than a flat assertion."
    example_gloss: "The film is actually quite good."
  nl.b2.unit03.lesson01.teach.grammar_afzwakken:
    title: "The film is good. The film is actually pretty good, in my view."
    gloss: "The film is good. The film is actually pretty good, in my view."
    note: "Hedging = lowering your commitment to a claim while keeping the claim the same. Stack softeners (*eigenlijk*, *best*, *wel*) and add an opinion frame (*volgens mij*, *naar mijn idee*) to turn a blunt statement into a tentative one."

  nl.b2.unit03.lesson02.teach.enigszins:
    title: somewhat
    gloss: "somewhat / slightly"
    note: "*Enigszins* is a more formal 'somewhat / slightly' -- a careful hedge: *enigszins verwarrend* = 'somewhat confusing'. It downgrades a criticism without dropping it."
    example_gloss: "The story is somewhat confusing."
  nl.b2.unit03.lesson02.teach.in_zekere_zin:
    title: "in a sense"
    gloss: "in a sense / in a way"
    note: "*In zekere zin* ('in a sense') hedges a claim as only partly true: *In zekere zin is het een komedie* = 'in a way it is a comedy'. Opening with it inverts the verb."
    example_gloss: "In a sense it is a comedy."
  nl.b2.unit03.lesson02.teach.lijkt_erop:
    title: "it seems that"
    gloss: "it seems that / it looks like"
    note: "*Het lijkt erop dat...* ('it seems that...') hedges by attributing the claim to appearances, not certainty. It opens a subordinate clause, so the verb goes to the END: *Het lijkt erop dat de film een succes is*."
    example_gloss: "It seems that the film is a success."
  nl.b2.unit03.lesson02.teach.zou_zeggen:
    title: "I would say that"
    gloss: "I would say (that)"
    note: "*Ik zou zeggen dat...* ('I'd say that...') is a classic tentative frame -- it presents the claim as your careful judgement. Like any *dat*-clause, the verb goes to the END: *...dat de film goed is*."
    example_gloss: "I would say that the film is good."
  nl.b2.unit03.lesson02.teach.misschien:
    title: maybe
    gloss: "maybe / perhaps"
    note: "*Misschien* hedges an opinion as merely possible: *De film is misschien te lang* = 'the film is maybe too long'. *Te lang* = 'too long'."
    example_gloss: "The film is maybe too long."
  nl.b2.unit03.lesson02.teach.grammar_voorzichtig:
    title: "I would say that the film is good. It seems that the film is a success."
    gloss: "I would say that the film is good. It seems that the film is a success."
    note: "These frames (*ik zou zeggen dat...*, *het lijkt erop dat...*) hedge by wrapping the claim in tentative packaging. Watch the word order: both open a subordinate clause, so the finite verb (*is*) drops to the end."

  nl.b2.unit03.lesson03.teach.echt:
    title: really
    gloss: "really / truly"
    note: "*Echt* strengthens a claim -- 'really'. Where a hedge lowers your commitment, *echt* raises it: *Het einde is echt voorspelbaar* = 'the ending is really predictable'. *Einde* = 'ending'; *voorspelbaar* = 'predictable'."
    example_gloss: "The ending is really predictable."
  nl.b2.unit03.lesson03.teach.heel:
    title: very
    gloss: very
    note: "*Heel* = 'very', the everyday degree booster: *heel goed* = 'very good'. It raises the strength of the adjective it precedes."
    example_gloss: "The film is very good."
  nl.b2.unit03.lesson03.teach.erg:
    title: "very (really)"
    gloss: "very / really"
    note: "*Erg* also means 'very' before an adjective: *erg mooi* = 'very beautiful'. It overlaps with *heel*; either works here. *Mooi* = 'beautiful / nice'."
    example_gloss: "The film is very beautiful."
  nl.b2.unit03.lesson03.teach.ontzettend:
    title: incredibly
    gloss: "incredibly / tremendously"
    note: "*Ontzettend* is a strong booster -- 'incredibly': *ontzettend spannend* = 'incredibly exciting'. Stronger than *heel*. *Spannend* = 'exciting / gripping'."
    example_gloss: "The film is incredibly exciting."
  nl.b2.unit03.lesson03.teach.absoluut:
    title: absolutely
    gloss: absolutely
    note: "*Absoluut* emphasizes a whole claim -- 'absolutely': *De film is absoluut de moeite waard* = 'the film is absolutely worth it'. *De moeite waard* = 'worth it / worth the effort'."
    example_gloss: "The film is absolutely worth it."
  nl.b2.unit03.lesson03.teach.zeker:
    title: definitely
    gloss: "definitely / certainly"
    note: "*Zeker* emphasizes your certainty about a claim -- 'definitely': *De film is zeker de moeite waard* = 'the film is definitely worth it'."
    example_gloss: "The film is definitely worth it."
  nl.b2.unit03.lesson03.teach.stapelen:
    title: "really incredibly (stacked)"
    gloss: "really incredibly (stacked boosters)"
    note: "You can STACK boosters to emphasize harder: *echt ontzettend goed* = 'really incredibly good'. Stacking is the emphatic mirror image of stacking hedges (*eigenlijk best*) in lesson 1."
    example_gloss: "The film is really incredibly good."
  nl.b2.unit03.lesson03.teach.grammar_benadrukken:
    title: "The film is good. The film is really incredibly good."
    gloss: "The film is good. The film is really incredibly good."
    note: "Emphasis = raising your commitment to a claim while keeping the claim the same. Add boosters (*echt*, *heel*, *ontzettend*) or whole-claim emphasizers (*absoluut*, *zeker*), and stack them for extra force."

  nl.b2.unit03.lesson04.teach.cleft_die:
    title: "it is ... that (cleft)"
    gloss: "it is ... that / who"
    note: "A CLEFT splits a sentence to spotlight one part: *De muziek maakt de film goed* -> *Het is de muziek die de film goed maakt* ('it is the music that makes the film good'). Use *die* to point back to a *de*-word like *de muziek*. *Maakt* = 'makes'."
    example_gloss: "It is the music that makes the film good."
  nl.b2.unit03.lesson04.teach.cleft_dat:
    title: "it is ... that"
    gloss: "it is ... that"
    note: "The same cleft, but with *dat* to point back to a *het*-word like *het verhaal*: *Het is het verhaal dat telt* = 'it is the story that counts'. Choose *die* or *dat* by the gender of the noun you spotlight. *Telt* = 'counts / matters'."
    example_gloss: "It is the story that counts."
  nl.b2.unit03.lesson04.teach.wat_is:
    title: "what ... is, is ..."
    gloss: "what ... is, is ..."
    note: "A pseudo-cleft fronts the point: *Wat goed is, is de muziek* = 'what is good, is the music'. The mid-sentence comma separates the two halves, and *is* appears on both sides."
    example_gloss: "What is good, is the music."
  nl.b2.unit03.lesson04.teach.juist:
    title: precisely
    gloss: "precisely / exactly"
    note: "*Juist* sharpens focus onto one word -- 'precisely / exactly': *Dat is juist het probleem* = 'that is precisely the problem'. It marks the following element as the crux. *Probleem* = 'problem'."
    example_gloss: "That is precisely the problem."
  nl.b2.unit03.lesson04.teach.nou_juist:
    title: "exactly that"
    gloss: "exactly that / that's just it"
    note: "*Nou juist* intensifies *juist* into 'exactly that / that's just my point': *Dat is nou juist wat ik bedoel* = 'that is exactly what I mean'. *Bedoel* = '(I) mean'."
    example_gloss: "That is exactly what I mean."
  nl.b2.unit03.lesson04.teach.wel_degelijk:
    title: "most certainly"
    gloss: "most certainly / really does"
    note: "*Wel degelijk* emphasizes a claim AGAINST a doubt -- 'it most certainly is (whatever someone denied)': *De film is wel degelijk goed* = 'the film really IS good' (contradicting someone who said it wasn't). A strong, insisting emphasizer."
    example_gloss: "The film most certainly is good."
  nl.b2.unit03.lesson04.teach.grammar_focus:
    title: "The music makes the film good. It is the music that makes the film good."
    gloss: "The music makes the film good. It is the music that makes the film good."
    note: "Focus constructions emphasize by isolating ONE part of the claim. The cleft (*het is ... die/dat*) and pseudo-cleft (*wat ... is, is ...*) spotlight a phrase; *juist* and *wel degelijk* sharpen or insist. The claim's content is unchanged -- only what you spotlight moves."

  nl.b2.unit03.lesson05.teach.tekst:
    title: "Reading: a short film review"
    gloss: "The new film is, to my mind, a bit predictable. The beginning is somewhat slow. But the music is really incredibly beautiful. It is precisely the music that saves the film. I would say that the film is worth it."
    glosses:
      nieuwe: "new (inflected form of nieuw)"
      idee: "idea -- here in 'naar mijn idee' = to my mind / in my opinion"
      beetje: "bit -- 'een beetje' = a bit (a hedge that shrinks the degree)"
      voorspelbaar: "predictable"
      begin: "beginning / start"
      enigszins: "somewhat / slightly (a careful hedge)"
      traag: "slow / sluggish"
      Maar: "but"
      muziek: "music"
      echt: "really (booster)"
      ontzettend: "incredibly (a strong booster)"
      mooi: "beautiful"
      juist: "precisely / exactly -- focus marker singling out the music"
      die: "that / which (relative pronoun in the cleft 'het is ... die')"
      redt: "saves (present of redden, 'to save / rescue')"
      zou: "would -- in 'ik zou zeggen' = I would say"
      zeggen: "to say -- 'ik zou zeggen dat' = I would say that"
      moeite: "trouble / effort -- 'de moeite waard' = worth it"
      waard: "worth"

  nl.b2.unit03.lesson06.teach.vond:
    title: "What did you think of the film?"
    gloss: "What did you think of the film?"
    note: "*Wat vond je van...?* = 'what did you think of...?' -- the everyday way to ask someone's opinion. *Vond* is the past of *vinden* ('to think / find'); *van* = 'of / about'."
  nl.b2.unit03.lesson06.teach.dat_is_waar:
    title: "That's true."
    gloss: "That's true."
    note: "*Dat is waar* ('that's true') concedes a point before you build on it. *Waar* here = 'true'."
  nl.b2.unit03.lesson06.teach.hij:
    title: "he / it"
    gloss: "he / it"
    note: "Dutch *hij* stands in for a *de*-word like *de film*, so a film is 'hij', not 'het': *Hij is de moeite waard* = 'it is worth it'."
    example_gloss: "It is worth it."
  nl.b2.unit03.lesson06.teach.dialogue_lotte_vraag:
    title: "Lotte: What did you think of the film?"
    gloss: "Lotte: What did you think of the film?"
  nl.b2.unit03.lesson06.teach.dialogue_omar_hedge:
    title: "Omar: The story is actually pretty predictable, to my mind."
    gloss: "Omar: The story is actually pretty predictable, to my mind."
  nl.b2.unit03.lesson06.teach.dialogue_lotte_emphasis:
    title: "Lotte: Yes, but the music is really incredibly beautiful!"
    gloss: "Lotte: Yes, but the music is really incredibly beautiful!"
  nl.b2.unit03.lesson06.teach.dialogue_omar_focus:
    title: "Omar: That's true. It is precisely the music that saves the film."
    gloss: "Omar: That's true. It is precisely the music that saves the film."
  nl.b2.unit03.lesson06.teach.dialogue_lotte_hedge:
    title: "Lotte: I would say that it is worth it."
    gloss: "Lotte: I would say that it is worth it."
  nl.b2.unit03.lesson06.teach.dialogue_omar_absoluut:
    title: "Omar: Absolutely!"
    gloss: "Omar: Absolutely!"
  nl.b2.unit03.lesson06.teach.grammar_nuance:
    title: "The film is good. The film is, to my mind, actually pretty good. The film is really incredibly good."
    gloss: "The film is good. The film is, to my mind, actually pretty good. The film is really incredibly good."
    note: "The whole unit in one line: one claim, three deliveries -- neutral, hedged (lower commitment), emphatic (higher commitment). Producing the same claim BOTH softened AND strengthened is exactly what this lesson's speaking and writing tasks ask for."

exercises:
  nl.b2.unit03.lesson01.exercise01.recognize_eigenlijk:
    instruction: "As a hedge, what does this word do to a claim?"
    correct_option: "softens it -- 'actually'"
    distractors: ["strengthens it -- 'definitely'", "spotlights one word -- 'precisely'", "negates it -- 'not'"]
    accepted_answers: [{value: "softens it -- 'actually'", status: correct}]
    feedback: "Eigenlijk ('actually') is a softener -- it lowers your commitment to the claim."
  nl.b2.unit03.lesson01.exercise02.listen_eigenlijk_best:
    instruction: "Listen and select what you hear."
    correct_option: "The film is actually pretty good."
    distractors: ["The film is really incredibly good.", "The film is a bit slow.", "In my view the film is good."]
    accepted_answers: [{value: "The film is actually pretty good.", status: correct}]
    feedback: "De film is eigenlijk best goed = the film is actually pretty good -- two stacked hedges (eigenlijk + best)."
  nl.b2.unit03.lesson01.exercise03.match_hedges:
    instruction: "Match each hedge with its meaning."
    accepted_answers:
      - value: {eigenlijk: actually, best: "quite / pretty", "een beetje": "a bit", nogal: "rather (often critical)", "volgens mij": "in my view", langzaam: slow}
        status: correct
    feedback: "These all SOFTEN a claim -- from eigenlijk ('actually') to volgens mij ('in my view'). Only langzaam ('slow') is an ordinary adjective they modify."
  nl.b2.unit03.lesson01.exercise04.order_eigenlijk_best:
    instruction: "Put the words in order: The film is actually pretty good."
    accepted_answers:
      - {value: "De film is eigenlijk best goed", status: correct}
    feedback: "De film is eigenlijk best goed -- the two hedges eigenlijk and best sit after the verb, before the adjective."
  nl.b2.unit03.lesson01.exercise05.translate_volgens_mij:
    instruction: "Translate into Dutch, opening with volgens mij: In my view the film is good."
    accepted_answers:
      - {value: "Volgens mij is de film goed", status: correct}
      - {value: "De film is volgens mij goed", status: correct}
    feedback: "Volgens mij is de film goed -- opening with volgens mij inverts the verb (is de film)."
  nl.b2.unit03.lesson01.exercise06.write_soften:
    instruction: "Soften this blunt statement into a hedged one. Blunt: The film is good. Hedge it using eigenlijk and best (both after 'is'): The film is actually quite good."
    accepted_answers:
      - {value: "De film is eigenlijk best goed", status: correct}
    feedback: "De film is eigenlijk best goed -- the same claim, delivered more tentatively with two stacked hedges."
  nl.b2.unit03.lesson01.exercise07.speak_naar_mijn_idee:
    instruction: "Say aloud in Dutch, opening with naar mijn idee: To my mind the film is good."
    accepted_answers:
      - {value: "Naar mijn idee is de film goed", status: correct}
      - {value: "De film is naar mijn idee goed", status: correct}
    feedback: "Naar mijn idee is de film goed -- opening with the opinion frame inverts the verb."
  nl.b2.unit03.lesson01.exercise08.dictation_eigenlijk_best:
    instruction: "Type what you hear."
    correct_response: "De film is eigenlijk best goed"
    orthography_strict: true
    feedback: "You heard De film is eigenlijk best goed -- the film is actually pretty good."

  nl.b2.unit03.lesson02.exercise01.recognize_enigszins:
    instruction: "What does this word mean?"
    correct_option: "somewhat / slightly"
    distractors: ["incredibly", "absolutely", "precisely"]
    accepted_answers: [{value: "somewhat / slightly", status: correct}]
    feedback: "Enigszins means somewhat -- a careful hedge that downgrades a claim."
  nl.b2.unit03.lesson02.exercise02.listen_zou_zeggen:
    instruction: "Listen and select what you hear."
    correct_option: "I would say that the film is good."
    distractors: ["I know that the film is good.", "It seems that the film is good.", "In my view the film is good."]
    accepted_answers: [{value: "I would say that the film is good.", status: correct}]
    feedback: "Ik zou zeggen dat de film goed is = I would say that the film is good -- a tentative frame, verb (is) at the end."
  nl.b2.unit03.lesson02.exercise03.match_tentative:
    instruction: "Match each hedge with its meaning."
    accepted_answers:
      - value: {enigszins: somewhat, "in zekere zin": "in a sense", "het lijkt erop dat": "it seems that", "ik zou zeggen dat": "I would say that", misschien: maybe, verhaal: story}
        status: correct
    feedback: "These frame a claim tentatively. Only verhaal ('story') is an ordinary noun."
  nl.b2.unit03.lesson02.exercise04.order_zou_zeggen:
    instruction: "Put the words in order: I would say that the film is good."
    accepted_answers:
      - {value: "Ik zou zeggen dat de film goed is", status: correct}
    feedback: "Ik zou zeggen dat de film goed is -- after dat, the verb is drops to the end of the clause."
  nl.b2.unit03.lesson02.exercise05.translate_lijkt_erop:
    instruction: "Translate into Dutch, using het lijkt erop dat: It seems that the film is a success."
    accepted_answers:
      - {value: "Het lijkt erop dat de film een succes is", status: correct}
    feedback: "Het lijkt erop dat de film een succes is -- the verb is goes to the end of the dat-clause."
  nl.b2.unit03.lesson02.exercise06.write_hedge_success:
    instruction: "Soften this blunt statement into a hedged one. Blunt: The film is a success. Hedge it by opening with het lijkt erop dat (verb 'is' goes to the end): It seems that the film is a success."
    accepted_answers:
      - {value: "Het lijkt erop dat de film een succes is", status: correct}
    feedback: "Het lijkt erop dat de film een succes is -- the blunt claim now framed tentatively."
  nl.b2.unit03.lesson02.exercise07.speak_in_zekere_zin:
    instruction: "Say aloud in Dutch, opening with in zekere zin: In a sense it is a comedy."
    accepted_answers:
      - {value: "In zekere zin is het een komedie", status: correct}
    feedback: "In zekere zin is het een komedie -- opening with the phrase inverts the verb (is het)."

  nl.b2.unit03.lesson03.exercise01.recognize_ontzettend:
    instruction: "As an emphasizer, what does this word do to a claim?"
    correct_option: "strengthens it -- 'incredibly'"
    distractors: ["softens it -- 'a bit'", "makes it tentative -- 'maybe'", "spotlights one word -- 'precisely'"]
    accepted_answers: [{value: "strengthens it -- 'incredibly'", status: correct}]
    feedback: "Ontzettend ('incredibly') is a booster -- it raises your commitment to the claim."
  nl.b2.unit03.lesson03.exercise02.listen_echt_ontzettend:
    instruction: "Listen and select what you hear."
    correct_option: "The film is really incredibly good."
    distractors: ["The film is actually pretty good.", "The film is rather slow.", "The film is somewhat confusing."]
    accepted_answers: [{value: "The film is really incredibly good.", status: correct}]
    feedback: "De film is echt ontzettend goed = the film is really incredibly good -- two stacked boosters."
  nl.b2.unit03.lesson03.exercise03.match_emphasis:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - value: {echt: really, heel: very, ontzettend: incredibly, absoluut: absolutely, zeker: definitely, mooi: beautiful, spannend: exciting, "de moeite waard": "worth it"}
        status: correct
    feedback: "These all STRENGTHEN a claim, from heel ('very') up to ontzettend ('incredibly'); mooi and spannend are the adjectives they boost."
  nl.b2.unit03.lesson03.exercise04.order_echt_ontzettend:
    instruction: "Put the words in order: The film is really incredibly good."
    accepted_answers:
      - {value: "De film is echt ontzettend goed", status: correct}
    feedback: "De film is echt ontzettend goed -- the two boosters stack before the adjective."
  nl.b2.unit03.lesson03.exercise05.translate_absoluut:
    instruction: "Translate into Dutch, using absoluut: The film is absolutely worth it."
    accepted_answers:
      - {value: "De film is absoluut de moeite waard", status: correct}
    feedback: "De film is absoluut de moeite waard -- absoluut emphasizes the whole claim."
  nl.b2.unit03.lesson03.exercise06.write_emphasize:
    instruction: "Strengthen this weak statement into an emphatic one. Weak: The film is good. Emphasize it using echt and ontzettend (both after 'is'): The film is really incredibly good."
    accepted_answers:
      - {value: "De film is echt ontzettend goed", status: correct}
    feedback: "De film is echt ontzettend goed -- the same claim, now delivered forcefully."
  nl.b2.unit03.lesson03.exercise07.speak_echt_heel:
    instruction: "Say aloud in Dutch, emphasizing with echt heel: The film is really very good."
    accepted_answers:
      - {value: "De film is echt heel goed", status: correct}
    feedback: "De film is echt heel goed -- really + very, stacked for emphasis."
  nl.b2.unit03.lesson03.exercise08.dictation_echt_ontzettend:
    instruction: "Type what you hear."
    correct_response: "De film is echt ontzettend goed"
    orthography_strict: true
    feedback: "You heard De film is echt ontzettend goed -- the film is really incredibly good."

  nl.b2.unit03.lesson04.exercise01.recognize_wel_degelijk:
    instruction: "What does this phrase do in a claim?"
    correct_option: "insists it IS so, against a doubt -- 'most certainly'"
    distractors: ["softens it -- 'a bit'", "marks it as a guess -- 'maybe'", "asks a question"]
    accepted_answers: [{value: "insists it IS so, against a doubt -- 'most certainly'", status: correct}]
    feedback: "Wel degelijk insists a claim is true against someone's doubt -- 'it most certainly is'."
  nl.b2.unit03.lesson04.exercise02.listen_cleft_muziek:
    instruction: "Listen and select what you hear."
    correct_option: "It is the music that makes the film good."
    distractors: ["It is the story that makes the film good.", "The music makes the film good.", "What is good, is the music."]
    accepted_answers: [{value: "It is the music that makes the film good.", status: correct}]
    feedback: "Het is de muziek die de film goed maakt -- a cleft that spotlights de muziek."
  nl.b2.unit03.lesson04.exercise03.match_focus:
    instruction: "Match each focus device with its meaning."
    accepted_answers:
      - value: {"het is ... die": "it is ... that (cleft)", "wat ... is, is ...": "what ... is, is ...", juist: precisely, "wel degelijk": "most certainly", muziek: music, probleem: problem}
        status: correct
    feedback: "These put focus on part of a claim: the cleft and pseudo-cleft spotlight a phrase; juist and wel degelijk sharpen or insist."
  nl.b2.unit03.lesson04.exercise04.order_cleft_muziek:
    instruction: "Put the words in order: It is the music that makes the film good."
    accepted_answers:
      - {value: "Het is de muziek die de film goed maakt", status: correct}
    feedback: "Het is de muziek die de film goed maakt -- the cleft frame het is ... die spotlights de muziek."
  nl.b2.unit03.lesson04.exercise05.translate_wat_is:
    instruction: "Translate into Dutch, using the focus frame wat ... is, is ...: What is good, is the music."
    accepted_answers:
      - {value: "Wat goed is, is de muziek", status: correct}
      - {value: "Wat goed is is de muziek", status: correct}
    feedback: "Wat goed is, is de muziek -- the pseudo-cleft fronts the point, with is on both sides of the comma."
  nl.b2.unit03.lesson04.exercise06.write_wel_degelijk:
    instruction: "Someone doubts the film is any good. Insist it is, using wel degelijk (after 'is'): The film most certainly is good."
    accepted_answers:
      - {value: "De film is wel degelijk goed", status: correct}
    feedback: "De film is wel degelijk goed -- wel degelijk insists the claim is true against the doubt."
  nl.b2.unit03.lesson04.exercise07.speak_cleft:
    instruction: "Say aloud in Dutch, using the cleft het is ... die to put focus on the music: It is the music that makes the film good."
    accepted_answers:
      - {value: "Het is de muziek die de film goed maakt", status: correct}
    feedback: "Het is de muziek die de film goed maakt -- the cleft spotlights the music as the decisive part."

  nl.b2.unit03.lesson05.exercise01.read_hedge:
    instruction: "Which opinion does the writer hedge with *naar mijn idee* -- present tentatively rather than assert flatly?"
    correct_option: "That the film is predictable."
    distractors: ["That the music is beautiful.", "That the music saves the film.", "That the film is worth it."]
    accepted_answers: [{value: "That the film is predictable.", status: correct}]
    feedback: "Naar mijn idee een beetje voorspelbaar -- the writer hedges the predictability with naar mijn idee and een beetje."
  nl.b2.unit03.lesson05.exercise02.read_hedge_words:
    instruction: "Which words mark the writer's hedge about the film being predictable?"
    correct_option: "naar mijn idee ... een beetje"
    distractors: ["echt ontzettend", "het is juist", "ik zou zeggen dat"]
    accepted_answers: [{value: "naar mijn idee ... een beetje", status: correct}]
    feedback: "Naar mijn idee ('to my mind') frames it as opinion and een beetje ('a bit') shrinks the degree -- together they soften the claim."
  nl.b2.unit03.lesson05.exercise03.read_emphasis:
    instruction: "Which claim does the writer state most emphatically?"
    correct_option: "That the music is beautiful."
    distractors: ["That the film is predictable.", "That the beginning is slow.", "That the film is worth it."]
    accepted_answers: [{value: "That the music is beautiful.", status: correct}]
    feedback: "De muziek is echt ontzettend mooi -- two stacked boosters make this the most emphatic claim in the text."
  nl.b2.unit03.lesson05.exercise04.read_focus:
    instruction: "The writer uses the focus construction 'Het is juist de muziek die de film redt.' What does it single out?"
    correct_option: "That it is specifically the music -- and nothing else -- that saves the film."
    distractors: ["That the film does not need saving.", "That the story saves the film.", "That the music ruins the film."]
    accepted_answers: [{value: "That it is specifically the music -- and nothing else -- that saves the film.", status: correct}]
    feedback: "The cleft het is juist ... die spotlights de muziek as the decisive thing that redt ('saves') the film."
  nl.b2.unit03.lesson05.exercise05.match_reading:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {nieuwe: new, begin: beginning, traag: "sluggish / slow", redt: saves, "de moeite waard": "worth it", voorspelbaar: predictable}
        status: correct
    feedback: "These are the reading's key words."
  nl.b2.unit03.lesson05.exercise06.translate_traag:
    instruction: "Translate into Dutch, using enigszins: The beginning is somewhat slow."
    accepted_answers:
      - {value: "Het begin is enigszins traag", status: correct}
      - {value: "Het begin is enigszins langzaam", status: correct}
    feedback: "Het begin is enigszins traag -- enigszins ('somewhat') hedges the criticism."
  nl.b2.unit03.lesson05.exercise07.write_hedge_predictable:
    instruction: "Soften this blunt statement into a hedged one. Blunt: The film is predictable. Hedge it using naar mijn idee (after 'is') and een beetje: The film is, to my mind, a bit predictable."
    accepted_answers:
      - {value: "De film is naar mijn idee een beetje voorspelbaar", status: correct}
    feedback: "De film is naar mijn idee een beetje voorspelbaar -- opinion frame plus a degree hedge softens the blunt claim."

  nl.b2.unit03.lesson06.exercise01.classify_hedge:
    instruction: "Omar says the story is 'eigenlijk best voorspelbaar, naar mijn idee'. Is he hedging, stating it neutrally, or emphasizing -- and what does that say about his commitment?"
    correct_option: "Hedging -- he softens the claim and signals a lower, more tentative commitment."
    distractors: ["Emphasizing -- he is fully, forcefully committed to it.", "Stating a neutral, plain fact with no stance.", "Asking whether the story is predictable."]
    accepted_answers: [{value: "Hedging -- he softens the claim and signals a lower, more tentative commitment.", status: correct}]
    feedback: "Eigenlijk, best and naar mijn idee are all softeners -- Omar hedges, holding back from a flat assertion."
  nl.b2.unit03.lesson06.exercise02.classify_emphasis:
    instruction: "How does Lotte present her claim about the music ('Ja, maar de muziek is echt ontzettend mooi!')?"
    correct_option: "Emphatically -- she is strongly committed to it (echt ontzettend)."
    distractors: ["Tentatively -- she is only guessing.", "Neutrally -- as a plain, unmarked fact.", "As a question she wants answered."]
    accepted_answers: [{value: "Emphatically -- she is strongly committed to it (echt ontzettend).", status: correct}]
    feedback: "Echt ontzettend mooi stacks two boosters -- Lotte states the claim with full, emphatic commitment."
  nl.b2.unit03.lesson06.exercise03.classify_focus:
    instruction: "What does Omar do with 'Het is juist de muziek die de film redt.'?"
    correct_option: "He puts focus on the music -- singling it out as specifically what saves the film."
    distractors: ["He hedges, admitting he isn't sure.", "He asks Lotte which part she liked.", "He denies that the music matters."]
    accepted_answers: [{value: "He puts focus on the music -- singling it out as specifically what saves the film.", status: correct}]
    feedback: "The cleft het is juist ... die spotlights de muziek as the decisive part -- a focus construction, not a hedge."
  nl.b2.unit03.lesson06.exercise04.speak_same_hedged:
    instruction: "Deliver the claim 'The film is good' as a HEDGE that lowers your commitment. Use naar mijn idee (after 'is'), then eigenlijk best: The film is, to my mind, actually quite good."
    accepted_answers:
      - {value: "De film is naar mijn idee eigenlijk best goed", status: correct}
    feedback: "De film is naar mijn idee eigenlijk best goed -- the same claim, delivered tentatively."
  nl.b2.unit03.lesson06.exercise05.speak_same_emphatic:
    instruction: "Now deliver the SAME claim as an EMPHATIC statement that raises your commitment, using echt ontzettend: The film is really incredibly good."
    accepted_answers:
      - {value: "De film is echt ontzettend goed", status: correct}
    feedback: "De film is echt ontzettend goed -- the identical claim, now delivered forcefully. Same content, opposite nuance from the hedged version."
  nl.b2.unit03.lesson06.exercise06.write_both_ways:
    instruction: "Write the SAME claim about the ending TWO ways, changing only the nuance, not the content. (1) HEDGED, lowering commitment, using een beetje: The ending is a bit predictable. (2) EMPHATIC, raising commitment, using echt heel: The ending is really very predictable."
    accepted_answers:
      - {value: "Het einde is een beetje voorspelbaar. Het einde is echt heel voorspelbaar.", status: correct}
      - {value: "Het einde is een beetje voorspelbaar. Het einde is echt heel voorspelbaar", status: correct}
      - {value: "Het einde is een beetje voorspelbaar, Het einde is echt heel voorspelbaar", status: correct}
    feedback: "Het einde is een beetje voorspelbaar (hedged). Het einde is echt heel voorspelbaar (emphatic). Same claim, delivered once softened and once strengthened."
  nl.b2.unit03.lesson06.exercise07.respond_emphatic:
    instruction: "Reply to 'Wat vond je van de muziek?' emphatically, using echt ontzettend: The music is really incredibly beautiful."
    accepted_answers:
      - {value: "De muziek is echt ontzettend mooi", status: correct}
    feedback: "De muziek is echt ontzettend mooi -- an emphatic reply, strongly committed to the claim."
