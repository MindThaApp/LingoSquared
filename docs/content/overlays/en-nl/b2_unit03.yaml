  status: reviewed
  required_next_reviewer: ramin_native_pass
  notes: >-
    Overlay for nl's third B2 unit (discourse: hedging and emphasis),
    authored alongside the realization (no adaptable upper-intermediate
    public-domain Dutch source exists; see the realization provenance note).
    English speakers' real interference risks for this outcome: (1) English
    'quite' is ambiguous (quite good = fairly / very), whereas Dutch 'best
    goed' here is a HEDGE meaning 'fairly/pretty good' -- glossed 'quite /
    pretty' with a note; (2) English lumps intensifiers, but Dutch 'heel'
    and 'erg' both mean 'very' and are taught separately so a learner is
    never asked to choose between two identical glosses; (3) the FOCUS
    constructions (cleft 'het is ... die/dat', pseudo-cleft 'wat ... is,
    is ...') put the emphasized element up front in a way English clefts
    do too, but the Dutch relative pronoun (die vs dat) tracks the noun's
    gender -- flagged in the notes; (4) subordinate-clause word order after
    'ik zou zeggen dat' / 'het lijkt erop dat' sends the verb to the end,
    which English speakers get wrong, so the production prompts name the
    frame and where the verb goes. Every production prompt names the exact
    construction (and, for two-clause answers, the culminating lesson06
    writing item ships all-periods / no-trailing-period / comma-joined
    variants) so a correct answer is well-determined. No sibling-direction
    file (nl-en b2) was consulted.

    Fresh-context review 2026-10-10 (content-reviewer.md checklist): checked
    every instruction, gloss, MCQ/listen distractor, matching pair and
    accepted-answer set against the realization. Fixed: lesson05 exercise06
