teaching:
  nl.a2.unit85.lesson01.teach.reiswoorden: {title: "Train travel", gloss: "the train / the station / to arrive / to leave", note: "The separable verb aankomen becomes ik kom aan in a main clause.", example_gloss: ["The train arrives at the station.", "The train leaves at eight."]}
  nl.a2.unit85.lesson01.teach.tijdwoorden: {title: "Ordering past events", gloss: "when / already / earlier / late", note: "Al marks that something had already happened before the later reference point.", example_gloss: "I arrived late."}
