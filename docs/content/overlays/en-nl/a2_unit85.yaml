  nl.a2.unit85.lesson01.teach.gn_vvt: {title: "One event before another", gloss: "When I arrived, the train had already left.", note: "The arrival is the later past reference point. Was vertrokken places the train's departure before it."}
  nl.a2.unit85.lesson01.teach.gn_bouw: {title: "Building the past perfect", gloss: "Past perfect: had or was plus a past participle.", note: "Dutch calls this the voltooid verleden tijd. Use had/was and the same participle and auxiliary choice as in the perfectum."}
  nl.a2.unit85.lesson02.teach.bagage: {title: "Lost luggage", gloss: "the suitcase / the bag / to lose / to forget / to find", example_gloss: ["I'm looking for my suitcase.", "Where is my bag?"]}
