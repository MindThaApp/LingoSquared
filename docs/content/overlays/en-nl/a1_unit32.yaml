  nl.a1.unit32.lesson05.teach.fenna_zwemt_vaak: {title: "Fenna swims often, almost every week", gloss: "Fenna swims often, almost every week."}
  nl.a1.unit32.lesson05.teach.ik_doe_aan_en_houd: {title: "I play football. I love football.", gloss: "I play football. I love football.", note: "A model two-sentence answer, ready to reuse for the unit's writing prompt."}

  nl.a1.unit32.lesson06.teach.lotte_zullen_we: {title: "Lotte proposes", gloss: "Lotte: Shall we exercise together?"}
  nl.a1.unit32.lesson06.teach.zullen_we_note: {title: "Zullen we ...?", gloss: "Zullen we ...? is already known from an earlier lesson for proposing something together.", note: "Reuses the exact plan-proposing construction from the plans unit."}
  nl.a1.unit32.lesson06.teach.fenna_ja_leuk: {title: "Fenna agrees", gloss: "Fenna: Yes, nice! I love swimming."}
  nl.a1.unit32.lesson06.teach.omar_liever_voetbal: {title: "Omar prefers football", gloss: "Omar: I'd rather play football."}
  nl.a1.unit32.lesson06.teach.sander_graag_hard: {title: "Sander likes running", gloss: "Sander: And I like running."}
