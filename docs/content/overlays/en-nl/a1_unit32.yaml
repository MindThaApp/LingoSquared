    title: "Lotte and Fenna on sport"
    gloss: "Lotte does yoga twice a week. She loves moving calmly. Fenna doesn't do yoga, but she loves swimming. Fenna swims often, almost every week. What sport do you do?"
    note: "Contrasts two different sports and two different frequency expressions, mirroring unit31's animal-comparison reading shape."
    glosses:
      doet: "does"
