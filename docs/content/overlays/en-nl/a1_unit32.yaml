course:
  title: "Dutch A1"
  description: "Beginner Dutch for talking about sports and exercise: naming common sports, saying how often you do them, the doen-aan-vs-sporten distinction, and making a plan to exercise together."

units:
  nl.a1.unit32.sporten: {title: "Sports and exercise"}

lessons:
  nl.a1.unit32.lesson01.sport_woorden: {title: "Football, yoga, running, and swimming"}
  nl.a1.unit32.lesson02.hoe_vaak_sport_je: {title: "How often do you exercise?"}
  nl.a1.unit32.lesson03.ik_sport_graag: {title: "Exercising and loving a sport"}
  nl.a1.unit32.lesson04.taalcafe_sander_hardlopen: {title: "Omar asks about Sander's running"}
