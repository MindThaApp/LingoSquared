  nl.a1.unit32.lesson06.taalcafe_samen_sporten: {title: "Shall we exercise together?"}

teaching:
  nl.a1.unit32.lesson01.teach.sport: {title: "The sport", gloss: "the sport", example_gloss: ["Football is a sport.", "Yoga is also a sport."]}
  nl.a1.unit32.lesson01.teach.voetbal_yoga: {title: "Football and yoga", gloss: "football / yoga", example_gloss: ["Omar plays football.", "Lotte does yoga."]}
  nl.a1.unit32.lesson01.teach.hardlopen_zwemmen: {title: "Running and swimming", gloss: "running / swimming", example_gloss: ["Sander goes running.", "Fenna goes swimming."]}
  nl.a1.unit32.lesson01.teach.welke_sport: {title: "What sport do you do?", gloss: "What sport do you do?"}
  nl.a1.unit32.lesson01.teach.ik_doe_aan_voetbal: {title: "I play football", gloss: "I play football.", note: "Literally 'I do at football' -- doen aan + sport is the general construction, see the grammar note."}
  nl.a1.unit32.lesson01.teach.doen_aan_note: {title: "Doen aan + sport", gloss: "Doen aan + a sport is a general way to say which sport you do, for any sport: doen aan voetbal, doen aan yoga, doen aan hardlopen, doen aan zwemmen.", note: "One construction covers every sport -- no need to learn a separate verb per sport at this level."}

  nl.a1.unit32.lesson02.teach.keer_per_week: {title: "Times a week", gloss: "times a week", example_gloss: "I do yoga twice a week."}
  nl.a1.unit32.lesson02.teach.frequency_note: {title: "Keer per week vs elke dag/vaak", gloss: "You already know elke dag (every day) and vaak (often). Twee keer per week (twice a week) is a new, more specific way to say how often.", note: "Extends the frequency vocabulary already established in the hobbies unit."}
  nl.a1.unit32.lesson02.teach.lotte_yoga_freq: {title: "I do yoga twice a week", gloss: "I do yoga twice a week."}
  nl.a1.unit32.lesson02.teach.omar_voetbal_vaak: {title: "Omar often plays football", gloss: "Omar often plays football.", note: "Reuses *vaak* (often), already established for routines in an earlier unit."}

  nl.a1.unit32.lesson03.teach.sporten_note: {title: "Sporten vs doen aan + sport", gloss: "You already know sporten from the hobbies lesson (Ik sport op zaterdag -- I exercise on Saturdays). Doen aan + sport names the specific sport: Ik doe aan voetbal. Both are correct Dutch.", note: "Sporten is reused from unit29's hobby verbs, not new -- this contrasts it with the new doen-aan-plus-sport construction, one general and one specific way to talk about exercise."}
  nl.a1.unit32.lesson03.teach.ik_sport_elke_dag: {title: "To exercise", gloss: "to exercise / do sport", example_gloss: "I exercise every day."}
  nl.a1.unit32.lesson03.teach.houden_van_sport: {title: "To love swimming", gloss: "to love swimming", example_gloss: "Fenna loves swimming."}
  nl.a1.unit32.lesson03.teach.fenna_houdt_zin: {title: "Fenna loves swimming", gloss: "Fenna loves swimming.", note: "Reuses *houden van* from an earlier unit's preferences lesson, now applied to a sport."}

  nl.a1.unit32.lesson04.teach.omar_vraagt_sander: {title: "Omar asks Sander", gloss: "Omar: Do you run often, Sander?"}
  nl.a1.unit32.lesson04.teach.sander_ja_twee_keer: {title: "Sander answers", gloss: "Sander: Yes, I run twice a week."}
  nl.a1.unit32.lesson04.teach.omar_waar: {title: "Omar asks where", gloss: "Omar: Where do you run?"}
  nl.a1.unit32.lesson04.teach.sander_in_het_park: {title: "Sander answers where", gloss: "Sander: In the park, close to my house."}
  nl.a1.unit32.lesson04.teach.hardlopen_note: {title: "Hardlopen is not separable", gloss: "Hardlopen is not separable, unlike uitlaten/opstaan/aankleden: ik loop hard (not ik hard-loop).", note: "A learner who just learned separable verbs nearby (walking a dog, getting up) might over-apply that pattern here -- this flags that hardlopen stays fused."}
  nl.a1.unit32.lesson04.teach.omar_leuk_voetbal: {title: "Omar reacts", gloss: "Omar: How nice, I often play football there."}

