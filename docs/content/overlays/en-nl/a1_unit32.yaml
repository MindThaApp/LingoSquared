    accepted_answers: [{value: [{left: voetbal, right: football}, {left: yoga, right: yoga}, {left: hardlopen, right: running}, {left: zwemmen, right: swimming}, {left: sport, right: sport}, {left: "Welke sport doe je?", right: "What sport do you do?"}], status: correct}]
    feedback: "Voetbal/yoga/hardlopen/zwemmen are common sports; sport means sport."
