review: {status: reviewed, required_next_reviewer: owner_native_pass, notes: "Fresh-context review 2026-11-27 (en-nl A2 units 87-94 pass): 0 fixes. Read together with the realization: instructions vs keys (must / should / it is better / waarom niet cues all match the keyed construction), every distractor, je/jij and fronted-time variants, reading and dialogue comprehension keys vs the text, glosses and example_glosses. NATIVE FLAGS: see the realization review block. Earlier notes: English overlay for the giving-advice unit. OPEN NATIVE QUESTIONS: none."}
course:
  title: "Dutch A2"
  description: "Grammar-led A2 Dutch for giving and answering simple advice."
  learning_goal: "Give advice with je moet, je zou ... moeten, het is beter om ... te and waarom ... niet, and respond to advice."
units:
  nl.a2.unit90.goede_raad: {"title": "Good advice", "description": "Give and respond to simple advice about health, study and money problems."}
lessons:
  nl.a2.unit90.lesson01.je_moet_rusten: {"title": "You must rest"}
  nl.a2.unit90.lesson02.je_zou_moeten: {"title": "You should"}
  nl.a2.unit90.lesson03.moet_zou_of_beter: {"title": "Must, should or better"}
  nl.a2.unit90.lesson04.waarom_niet: {"title": "Why not?"}
  nl.a2.unit90.lesson05.bericht_van_lotte: {"title": "A message from Lotte"}
  nl.a2.unit90.lesson06.lotte_en_omar: {"title": "Lotte and Omar"}
teaching:
  nl.a2.unit90.lesson01.teach.gezondheid: {"title": "Health words", "gloss": "headache / doctor / pharmacy / ill / tired", "note": "These words describe a small health problem.", "example_gloss": ["I have a headache.", "I am ill.", "I am tired."]}
  nl.a2.unit90.lesson01.teach.werkwoorden: {"title": "Verbs for advice", "gloss": "to rest / to sleep / to drink / to go / the water", "note": "After *moet*, the action verb stays in the infinitive and normally comes at the end.", "example_gloss": ["I drink water.", "I go to the pharmacy.", "I sleep a lot."]}
  nl.a2.unit90.lesson01.teach.gn_je_moet: {"title": "Giving strong advice with je moet", "gloss": "You must rest. You must drink water. You must go to the doctor.", "note": "Strong, direct advice: *je moet* + the rest of the sentence + the infinitive at the very end. *Moeten* is the infinitive; with *je* it becomes *moet*."}
  nl.a2.unit90.lesson01.teach.jij: {"title": "Je or jij", "gloss": "You must rest. You must rest too.", "note": "*Je* and *jij* both mean 'you'; *jij* is a little more emphatic."}
  nl.a2.unit90.lesson01.teach.vraag: {"title": "Asking for advice", "gloss": "What should I do? (asking for advice)", "note": "*Doen* is the infinitive at the end."}
  nl.a2.unit90.lesson02.teach.studie: {"title": "Study words", "gloss": "test / homework / to study, learn / to practise / every day / tomorrow", "note": "*Leren* can mean to study or to learn.", "example_gloss": ["I have a test tomorrow.", "I am doing my homework."]}
  nl.a2.unit90.lesson02.teach.geld: {"title": "Money words", "gloss": "money / to save / to spend / less / more / little, not much", "note": "These words let you talk about money problems.", "example_gloss": ["I have little money.", "I want to save more."]}
  nl.a2.unit90.lesson02.teach.gn_zou_moeten: {"title": "Giving softer advice: je zou ... moeten", "gloss": "You should rest. You should drink water. You should spend less money.", "note": "Softer advice: *je zou* + the rest of the sentence + *moeten* + the infinitive. *Moeten* and the infinitive stand together at the end: *moeten drinken*, *moeten uitgeven*."}
  nl.a2.unit90.lesson02.teach.problemen: {"title": "Two problems", "gloss": "I have little money. I have a test tomorrow."}
  nl.a2.unit90.lesson03.teach.tijd: {"title": "Time words", "gloss": "early / late / the week / today / the bed", "note": "Use *naar bed gaan* for going to bed.", "example_gloss": ["I am going to bed early today.", "I save every week."]}
  nl.a2.unit90.lesson03.teach.gn_beter_om: {"title": "Het is beter om ... te", "gloss": "It is better to go to bed early. It is better to save every week.", "note": "Calm, neutral advice: *Het is beter om* + the rest + *te* + the infinitive at the end. The word *te* stands directly before the infinitive."}
  nl.a2.unit90.lesson03.teach.gn_contrast: {"title": "Three ways to give advice", "gloss": "You must rest. You should rest. It is better to rest.", "note": "Three levels of advice: *je moet* is strong, *je zou ... moeten* is softer, *het is beter om ... te* is calm and neutral. Use the softer forms with friends when you are not sure."}
  nl.a2.unit90.lesson03.teach.voorbeelden: {"title": "More examples", "gloss": "It is better to drink water. It is better to practise every day."}
  nl.a2.unit90.lesson04.teach.woorden: {"title": "Problem, advice, tip", "gloss": "problem / advice / tip", "note": "*Advies* is the general word for advice; for one small piece of advice people usually say *een tip*.", "example_gloss": ["I have a problem.", "That is a good tip."]}
  nl.a2.unit90.lesson04.teach.gn_waarom_niet: {"title": "Waarom ... niet? as advice", "gloss": "Why don't you go to the doctor? Why don't you save a bit more? Why don't you practise every day?", "note": "A friendly way to suggest something: *Waarom* + verb + *je* + *niet* + rest. The verb comes right after *waarom*, before *je*."}
  nl.a2.unit90.lesson04.teach.gn_reageren: {"title": "Responding to advice", "gloss": "Good idea. I will do that. Thanks for the tip.", "note": "Short ways to answer advice: *Goed idee* (you like it), *Dat doe ik* (you will do it), *Bedankt voor de tip* (you thank the person)."}
  nl.a2.unit90.lesson04.teach.zin: {"title": "Asking for help", "gloss": "I have a problem. What should I do?"}
  nl.a2.unit90.lesson05.teach.lezen: {"title": "Lotte's advice", "gloss": "Hi Omar, thanks for your message. You have a headache and you are tired. You must rest today and drink a lot of water. You should also drink less coffee. It is better to go to bed early. Why don't you go to the doctor tomorrow? Best wishes, Lotte", "note": "Lotte answers Omar with all three kinds of advice and one *waarom ... niet?* suggestion."}
  nl.a2.unit90.lesson06.teach.omar_probleem: {"title": "Omar names his problem", "gloss": "Omar: Hi Lotte, I have a problem. I have a headache."}
  nl.a2.unit90.lesson06.teach.lotte_rusten: {"title": "Lotte gives strong advice", "gloss": "Lotte: How annoying! You must rest and drink water."}
  nl.a2.unit90.lesson06.teach.omar_idee: {"title": "Omar accepts and adds a second problem", "gloss": "Omar: Good idea. I also have little money."}
  nl.a2.unit90.lesson06.teach.lotte_geld: {"title": "Lotte gives softer and neutral advice", "gloss": "Lotte: You should spend less money. It is better to save every week."}
  nl.a2.unit90.lesson06.teach.omar_bedankt: {"title": "Omar promises and thanks", "gloss": "Omar: I will do that. Thanks for the tips!"}
  nl.a2.unit90.lesson06.teach.lotte_bed: {"title": "Lotte ends with a suggestion", "gloss": "Lotte: You're welcome! Why don't you go to bed early?"}
exercises:
  nl.a2.unit90.lesson01.exercise01.kies_rusten: {"instruction": "Choose the Dutch sentence that means 'You must rest.'", "correct_option": "Je moet rusten.", "distractors": ["Je moet slapen.", "Je moet water drinken.", "Ik moet rusten."], "accepted_answers": [{"value": "Je moet rusten.", "status": "correct"}], "feedback": "*Je moet rusten* = You must rest."}
  nl.a2.unit90.lesson01.exercise02.kies_dokter: {"instruction": "Choose the Dutch sentence that means 'You must go to the doctor.'", "correct_option": "Je moet naar de dokter gaan.", "distractors": ["Je moet naar de apotheek gaan.", "Ik moet naar de dokter gaan.", "Je naar de dokter moet gaan."], "accepted_answers": [{"value": "Je moet naar de dokter gaan.", "status": "correct"}], "feedback": "The infinitive *gaan* comes at the end: *Je moet naar de dokter gaan.*"}
  nl.a2.unit90.lesson01.exercise03.koppel_woorden: {"instruction": "Match each Dutch word to its English meaning.", "accepted_answers": [{"value": [{"left": "hoofdpijn", "right": "headache"}, {"left": "dokter", "right": "doctor"}, {"left": "apotheek", "right": "pharmacy"}, {"left": "ziek", "right": "ill"}, {"left": "moe", "right": "tired"}, {"left": "rusten", "right": "to rest"}], "status": "correct"}], "feedback": "These are the health words and the verb for resting."}
  nl.a2.unit90.lesson01.exercise04.volgorde_water: {"instruction": "Put the words in order to say 'You must drink water.'", "correct_option": "Je moet water drinken", "accepted_answers": [{"value": "Je moet water drinken", "status": "correct"}, {"value": "Water moet je drinken", "status": "correct"}], "feedback": "*Je moet water drinken* has the infinitive at the end. Starting with *Water* is also correct."}
  nl.a2.unit90.lesson01.exercise05.vul_moet: {"instruction": "Complete with the form of *moeten* that goes with *je*.", "correct_option": "moet", "accepted_answers": [{"value": "moet", "status": "correct"}], "feedback": "*Je moet* is the strong advice form."}
  nl.a2.unit90.lesson01.exercise06.vertaal_apotheek: {"instruction": "Translate into Dutch. Give strong advice with *moeten*.", "accepted_answers": [{"value": "Je moet naar de apotheek gaan", "status": "correct"}, {"value": "Naar de apotheek moet je gaan", "status": "correct"}, {"value": "Jij moet naar de apotheek gaan", "status": "correct"}, {"value": "Naar de apotheek moet jij gaan", "status": "correct"}], "feedback": "*Je moet naar de apotheek gaan.*"}
  nl.a2.unit90.lesson01.exercise07.schrijf_rusten: {"instruction": "Write the requested sentence in Dutch.", "correct_option": "Je moet rusten.", "accepted_answers": [{"value": "Je moet rusten", "status": "correct"}, {"value": "Jij moet rusten", "status": "correct"}], "feedback": "*Je moet rusten.*"}
  nl.a2.unit90.lesson02.exercise01.kies_zachter: {"instruction": "Choose the softer advice (should, not must): 'You should save more.'", "correct_option": "Je zou meer moeten sparen.", "distractors": ["Je moet meer sparen.", "Ik zou meer moeten sparen.", "Je zou sparen meer moeten."], "accepted_answers": [{"value": "Je zou meer moeten sparen.", "status": "correct"}], "feedback": "*Je zou meer moeten sparen* is softer than *Je moet meer sparen*."}
  nl.a2.unit90.lesson02.exercise02.kies_oefenen: {"instruction": "Choose the Dutch sentence that means 'You should practise every day.'", "correct_option": "Je zou elke dag moeten oefenen.", "distractors": ["Je zou minder moeten uitgeven.", "Ik zou elke dag moeten oefenen.", "Je zou moeten elke dag oefenen."], "accepted_answers": [{"value": "Je zou elke dag moeten oefenen.", "status": "correct"}], "feedback": "*Elke dag* stands before *moeten oefenen*."}
  nl.a2.unit90.lesson02.exercise03.koppel_probleem: {"instruction": "Match each Dutch sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Ik heb hoofdpijn", "right": "I have a headache"}, {"left": "Ik heb morgen een toets", "right": "I have a test tomorrow"}, {"left": "Ik heb weinig geld", "right": "I have little money"}, {"left": "Je moet rusten", "right": "You must rest"}, {"left": "Je zou meer moeten sparen", "right": "You should save more"}, {"left": "Je zou elke dag moeten oefenen", "right": "You should practise every day"}], "status": "correct"}], "feedback": "Each sentence is either a problem or a piece of advice, and each has its own meaning."}
  nl.a2.unit90.lesson02.exercise04.volgorde_sparen: {"instruction": "Put the words in order to say 'You should save more.'", "correct_option": "Je zou meer moeten sparen", "accepted_answers": [{"value": "Je zou meer moeten sparen", "status": "correct"}, {"value": "Meer zou je moeten sparen", "status": "correct"}], "feedback": "*Moeten* stands just before the infinitive *sparen*."}
  nl.a2.unit90.lesson02.exercise05.vul_moeten: {"instruction": "Complete with the infinitive that goes with *zou*.", "correct_option": "moeten", "accepted_answers": [{"value": "moeten", "status": "correct"}], "feedback": "*Je zou water moeten drinken.*"}
  nl.a2.unit90.lesson02.exercise06.vertaal_oefenen: {"instruction": "Translate into Dutch. Give softer advice.", "accepted_answers": [{"value": "Je zou elke dag moeten oefenen", "status": "correct"}, {"value": "Elke dag zou je moeten oefenen", "status": "correct"}, {"value": "Jij zou elke dag moeten oefenen", "status": "correct"}, {"value": "Elke dag zou jij moeten oefenen", "status": "correct"}], "feedback": "*Je zou elke dag moeten oefenen.* Starting with *Elke dag* is also correct."}
  nl.a2.unit90.lesson02.exercise07.schrijf_uitgeven: {"instruction": "Write the requested sentence in Dutch, using *zou* and *moeten*.", "correct_option": "Je zou minder geld moeten uitgeven.", "accepted_answers": [{"value": "Je zou minder geld moeten uitgeven", "status": "correct"}, {"value": "Je zou minder moeten uitgeven", "status": "correct"}, {"value": "Minder geld zou je moeten uitgeven", "status": "correct"}, {"value": "Jij zou minder geld moeten uitgeven", "status": "correct"}, {"value": "Jij zou minder moeten uitgeven", "status": "correct"}], "feedback": "*Je zou minder geld moeten uitgeven.* The word *geld* may be left out."}
  nl.a2.unit90.lesson03.exercise01.kies_beter: {"instruction": "Choose the Dutch sentence that means 'It is better to save every week.'", "correct_option": "Het is beter om elke week te sparen.", "distractors": ["Het is beter om elke week sparen te.", "Het is beter om sparen elke week te.", "Het is beter om te elke week sparen."], "accepted_answers": [{"value": "Het is beter om elke week te sparen.", "status": "correct"}], "feedback": "In *om ... te* sentences, *te* stands directly before the infinitive: *te sparen*."}
  nl.a2.unit90.lesson03.exercise02.kies_sterkst: {"instruction": "Which sentence gives the strongest advice?", "correct_option": "Je moet vroeg naar bed gaan.", "distractors": ["Je zou vroeg naar bed moeten gaan.", "Het is beter om vroeg naar bed te gaan.", "Het is beter om vandaag vroeg naar bed te gaan."], "accepted_answers": [{"value": "Je moet vroeg naar bed gaan.", "status": "correct"}], "feedback": "*Je moet* is the strongest form; the others are softer."}
  nl.a2.unit90.lesson03.exercise03.koppel_niveaus: {"instruction": "Match each Dutch sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Je moet rusten", "right": "You must rest"}, {"left": "Je zou moeten rusten", "right": "You should rest"}, {"left": "Het is beter om te rusten", "right": "It is better to rest"}, {"left": "Je moet naar de dokter gaan", "right": "You must go to the doctor"}, {"left": "Je zou minder moeten uitgeven", "right": "You should spend less"}, {"left": "Het is beter om elke dag te oefenen", "right": "It is better to practise every day"}], "status": "correct"}], "feedback": "The three levels of advice each have their own English wording."}
  nl.a2.unit90.lesson03.exercise04.volgorde_bed: {"instruction": "Put the words in order to say 'It is better to go to bed early.'", "correct_option": "Het is beter om vroeg naar bed te gaan", "accepted_answers": [{"value": "Het is beter om vroeg naar bed te gaan", "status": "correct"}], "feedback": "*Het is beter om vroeg naar bed te gaan.*"}
  nl.a2.unit90.lesson03.exercise05.vul_te: {"instruction": "Complete the sentence with the small word that goes before the infinitive.", "correct_option": "te", "accepted_answers": [{"value": "te", "status": "correct"}], "feedback": "*Te* stands directly before *oefenen*."}
  nl.a2.unit90.lesson03.exercise06.vertaal_water: {"instruction": "Translate into Dutch.", "accepted_answers": [{"value": "Het is beter om water te drinken", "status": "correct"}, {"value": "Het is beter water te drinken", "status": "correct"}], "feedback": "*Het is beter om water te drinken.*"}
  nl.a2.unit90.lesson03.exercise07.schrijf_zacht: {"instruction": "Write the requested sentence in Dutch with *zou* and *moeten* (softer advice).", "correct_option": "Je zou vroeg naar bed moeten gaan.", "accepted_answers": [{"value": "Je zou vroeg naar bed moeten gaan", "status": "correct"}, {"value": "Vroeg zou je naar bed moeten gaan", "status": "correct"}, {"value": "Jij zou vroeg naar bed moeten gaan", "status": "correct"}], "feedback": "*Je zou vroeg naar bed moeten gaan.*"}
  nl.a2.unit90.lesson04.exercise01.kies_reactie: {"instruction": "Someone gives you advice and you like it. Choose the best reaction.", "correct_option": "Goed idee.", "distractors": ["Ik heb een probleem.", "Wat moet ik doen?", "Je moet rusten."], "accepted_answers": [{"value": "Goed idee.", "status": "correct"}], "feedback": "*Goed idee* answers advice positively."}
  nl.a2.unit90.lesson04.exercise02.koppel_vragen: {"instruction": "Match each Dutch sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Waarom ga je niet naar de dokter", "right": "Why don't you go to the doctor"}, {"left": "Waarom spaar je niet wat meer", "right": "Why don't you save a bit more"}, {"left": "Waarom ga je niet vroeg naar bed", "right": "Why don't you go to bed early"}, {"left": "Waarom oefen je niet elke dag", "right": "Why don't you practise every day"}, {"left": "Goed idee", "right": "Good idea"}, {"left": "Dat doe ik", "right": "I will do that"}, {"left": "Bedankt voor de tip", "right": "Thanks for the tip"}], "status": "correct"}], "feedback": "The first four are advice questions, the last three are reactions."}
  nl.a2.unit90.lesson04.exercise03.volgorde_waarom: {"instruction": "Put the words in order to ask 'Why don't you go to the pharmacy?'", "correct_option": "Waarom ga je niet naar de apotheek", "accepted_answers": [{"value": "Waarom ga je niet naar de apotheek", "status": "correct"}], "feedback": "The verb *ga* comes right after *waarom*, then *je*, then *niet*."}
  nl.a2.unit90.lesson04.exercise04.vul_niet: {"instruction": "Complete the advice question 'Why don't you go to the doctor?'", "correct_option": "niet", "accepted_answers": [{"value": "niet", "status": "correct"}], "feedback": "*Waarom ga je niet naar de dokter?*"}
  nl.a2.unit90.lesson04.exercise05.geef_advies: {"instruction": "Give advice with *je moet*: tell the person to study today.", "correct_option": "Je moet vandaag leren.", "accepted_answers": [{"value": "Je moet vandaag leren", "status": "correct"}, {"value": "Vandaag moet je leren", "status": "correct"}, {"value": "Jij moet vandaag leren", "status": "correct"}], "feedback": "*Je moet vandaag leren* is direct advice. *Vandaag moet je leren* works too."}
  nl.a2.unit90.lesson04.exercise06.vertaal_waarom: {"instruction": "Translate into Dutch as a friendly suggestion.", "accepted_answers": [{"value": "Waarom ga je niet vroeg naar bed?", "status": "correct"}, {"value": "Waarom ga je niet vroeg naar bed", "status": "correct"}, {"value": "Waarom ga jij niet vroeg naar bed?", "status": "correct"}, {"value": "Waarom ga jij niet vroeg naar bed", "status": "correct"}], "feedback": "*Waarom ga je niet vroeg naar bed?*"}
  nl.a2.unit90.lesson04.exercise07.schrijf_reactie: {"instruction": "Write two short sentences in Dutch: say it is a good idea, then say you will do it.", "correct_option": "Goed idee. Dat doe ik.", "accepted_answers": [{"value": "Goed idee. Dat doe ik.", "status": "correct"}, {"value": "Dat is een goed idee. Dat doe ik.", "status": "correct"}], "feedback": "*Goed idee. Dat doe ik.*"}
  nl.a2.unit90.lesson05.exercise01.lees_vandaag: {"instruction": "Read Lotte's message. What must Omar do today?", "correct_option": "Rest and drink a lot of water.", "distractors": ["Go to the doctor.", "Go to the pharmacy.", "Go to bed late."], "accepted_answers": [{"value": "Rest and drink a lot of water.", "status": "correct"}], "feedback": "Lotte says *Je moet vandaag rusten en veel water drinken.*"}
  nl.a2.unit90.lesson05.exercise02.lees_dokter: {"instruction": "What does Lotte suggest about the doctor?", "correct_option": "Omar could go to the doctor tomorrow.", "distractors": ["Omar must go to the doctor today.", "Omar should never go to the doctor.", "Lotte will go to the doctor."], "accepted_answers": [{"value": "Omar could go to the doctor tomorrow.", "status": "correct"}], "feedback": "*Waarom ga je morgen niet naar de dokter?* is a suggestion, not an order."}
  nl.a2.unit90.lesson05.exercise03.koppel_lezen: {"instruction": "Match each phrase from the message to its English meaning.", "accepted_answers": [{"value": [{"left": "vandaag rusten", "right": "rest today"}, {"left": "veel water drinken", "right": "drink a lot of water"}, {"left": "minder koffie", "right": "less coffee"}, {"left": "vroeg naar bed", "right": "to bed early"}, {"left": "naar de dokter", "right": "to the doctor"}, {"left": "bedankt voor je bericht", "right": "thanks for your message"}], "status": "correct"}], "feedback": "Each phrase is a piece of Lotte's advice or thanks."}
  nl.a2.unit90.lesson05.exercise04.volgorde_koffie: {"instruction": "Put the words in order to say 'You should drink less coffee.'", "correct_option": "Je zou minder koffie moeten drinken", "accepted_answers": [{"value": "Je zou minder koffie moeten drinken", "status": "correct"}, {"value": "Minder koffie zou je moeten drinken", "status": "correct"}], "feedback": "*Je zou minder koffie moeten drinken.*"}
  nl.a2.unit90.lesson05.exercise05.vertaal_morgen: {"instruction": "Translate into Dutch as a friendly suggestion.", "accepted_answers": [{"value": "Waarom ga je morgen niet naar de dokter?", "status": "correct"}, {"value": "Waarom ga je morgen niet naar de dokter", "status": "correct"}, {"value": "Waarom ga jij morgen niet naar de dokter?", "status": "correct"}, {"value": "Waarom ga jij morgen niet naar de dokter", "status": "correct"}], "feedback": "*Waarom ga je morgen niet naar de dokter?* Put *morgen* before *niet*."}
  nl.a2.unit90.lesson05.exercise06.dictee_rusten: {"instruction": "Type what you hear.", "correct_response": "Je moet vandaag rusten en veel water drinken.", "orthography_strict": true, "feedback": "You heard *Je moet vandaag rusten en veel water drinken.*"}
  nl.a2.unit90.lesson05.exercise07.dictee_bed: {"instruction": "Type what you hear.", "correct_response": "Het is beter om vroeg naar bed te gaan.", "orthography_strict": true, "feedback": "You heard *Het is beter om vroeg naar bed te gaan.*"}
  nl.a2.unit90.lesson06.exercise01.luister_probleem: {"instruction": "Listen and select Omar's first sentence.", "correct_option": "Hoi Lotte, ik heb een probleem.", "distractors": ["Hoi Omar, ik heb een probleem.", "Hoi Lotte, ik heb weinig geld.", "Hoi Lotte, ik heb morgen een toets."], "accepted_answers": [{"value": "Hoi Lotte, ik heb een probleem.", "status": "correct"}], "feedback": "You heard *Hoi Lotte, ik heb een probleem.*"}
  nl.a2.unit90.lesson06.exercise02.begrijp_advies: {"instruction": "Listen to the dialogue. What does Lotte say Omar must do about his headache?", "correct_option": "Rest and drink water.", "distractors": ["Go to the pharmacy.", "Go to the doctor.", "Drink more coffee."], "accepted_answers": [{"value": "Rest and drink water.", "status": "correct"}], "feedback": "Lotte says *Je moet rusten en water drinken.*"}
  nl.a2.unit90.lesson06.exercise03.koppel_functies: {"instruction": "Match each dialogue phrase to its function.", "accepted_answers": [{"value": [{"left": "ik heb een probleem", "right": "Omar names his problem"}, {"left": "Je moet rusten en water drinken", "right": "strong advice about health"}, {"left": "Goed idee", "right": "Omar accepts the advice"}, {"left": "Je zou minder geld moeten uitgeven", "right": "softer advice about money"}, {"left": "Het is beter om elke week te sparen", "right": "neutral advice to save"}, {"left": "Waarom ga je niet vroeg naar bed", "right": "advice as a question"}], "status": "correct"}], "feedback": "Each phrase plays a different role in the conversation."}
