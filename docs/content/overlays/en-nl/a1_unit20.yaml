course:
  title: "Dutch A1"
  description: "Beginner Dutch for identifying clothing items and completing a simple clothing purchase, including size, color, and fit."

units:
  nl.a1.unit20.clothing: {title: "Buying clothes"}

lessons:
  nl.a1.unit20.lesson01.ik_zoek_een_jas: {title: "I'm looking for a coat"}
  nl.a1.unit20.lesson02.welke_maat: {title: "What size do you wear?"}
  nl.a1.unit20.lesson03.welke_kleur: {title: "What color?"}
  nl.a1.unit20.lesson04.past_het: {title: "Does it fit?"}
  nl.a1.unit20.lesson05.bonnetje_lezen: {title: "Reading a receipt"}
  nl.a1.unit20.lesson06.winterjas_passen: {title: "Omar tries on a winter coat"}

teaching:
  nl.a1.unit20.lesson01.teach.jas_trui: {title: "Coat, sweater", gloss: "the coat, the sweater", note: "*De jas* and *de trui* are both common gender nouns."}
  nl.a1.unit20.lesson01.teach.broek_schoenen: {title: "Pants, shoes", gloss: "the pants/trousers, the shoes", note: "*Broek* is grammatically singular in Dutch even though English 'pants' is plural: *een broek*, not *broeken*, for one pair. *Schoenen* is the plural of *schoen*; shoes are almost always referred to in the plural, as in English."}
  nl.a1.unit20.lesson01.teach.zoek_jas: {title: "Saying what you're looking for", gloss: "I am looking for a coat.", note: "*Zoeken* (to look for/search) takes a direct object with no preposition, unlike English 'look for.'"}

  nl.a1.unit20.lesson02.teach.maat: {title: "Size", gloss: "the size", note: "A common gender noun: *de maat*."}
  nl.a1.unit20.lesson02.teach.welke_maat: {title: "Asking about size", gloss: "What size do you wear?", note: "*Welke* (which) is used because *maat* has a small set of expected answers (S, M, L, or a number)."}
  nl.a1.unit20.lesson02.teach.heb_maat_m: {title: "Stating your size", gloss: "I am a size M.", note: "*Hebben* (to have) is used here, the same as English 'I have/am a size.'"}

  nl.a1.unit20.lesson03.teach.zwart_blauw: {title: "Black, blue", gloss: "black, blue", note: "The two base color adjectives in this lesson."}
  nl.a1.unit20.lesson03.teach.wil_in_zwart: {title: "Requesting a color", gloss: "I want the coat in black.", note: "*In het* + color is the standard way to specify a garment's color when ordering or requesting it."}
  nl.a1.unit20.lesson03.teach.ook_in_blauw: {title: "Asking about another color", gloss: "Do you also have this in blue?", note: "*Ook* (also/too) asks whether an alternative color is available, using the formal *u* register."}

  nl.a1.unit20.lesson04.teach.past_deze_jas: {title: "Asking about fit", gloss: "Does this coat fit?", note: "*Passen* (to fit) is the natural verb for clothing fit, distinct from *passen* meaning 'to try on.'"}
  nl.a1.unit20.lesson04.teach.past_goed: {title: "Confirming a good fit", gloss: "It fits well.", note: "*Goed* (well) describes how the item fits."}
  nl.a1.unit20.lesson04.teach.te_klein: {title: "Too small", gloss: "It is too small.", note: "*Te* (too) precedes the adjective to express excess."}
  nl.a1.unit20.lesson04.teach.te_groot: {title: "Too big", gloss: "It is too big.", note: "Same *te* + adjective pattern as the previous card's *te klein*."}

  nl.a1.unit20.lesson05.teach.kost_negentig: {title: "Stating a price", gloss: "The coat costs ninety euros.", note: "*Kost* is the third-person singular of *kosten* (to cost)."}
  nl.a1.unit20.lesson05.teach.bonnetje: {title: "Read a store receipt", gloss: "Winter coat: size M, color black. Price: ninety euros. This coat fits well and is warm.", note: "Track the size, color, price, and the two qualities mentioned about the coat."}

  nl.a1.unit20.lesson06.teach.lotte_notice: {title: "Lotte notices the coat", gloss: "Lotte: This coat is nice! What size are you?", note: "*Mooi* (nice/pretty) is a general positive reaction, reused from earlier units."}
  nl.a1.unit20.lesson06.teach.omar_ask_try: {title: "Omar asks to try it on", gloss: "Omar: I am a size M. May I try it on?", note: "*Mag ik ...?* (May I ...?) is the standard polite way to ask permission; *passen* here means 'try on,' not 'fit.'"}
  nl.a1.unit20.lesson06.teach.lotte_ask_fit: {title: "Lotte asks about the fit", gloss: "Lotte: Of course. Does it fit well?", note: "*Hij* (he/it) refers back to *de jas*, a common gender noun."}
  nl.a1.unit20.lesson06.teach.omar_confirm_fit: {title: "Omar confirms", gloss: "Omar: Yes, it fits well and it's warm.", note: "Matches the receipt read in lesson05 exactly -- this is the same coat."}
  nl.a1.unit20.lesson06.teach.lotte_ask_color: {title: "Lotte asks about color", gloss: "Lotte: Great! Do you want it in black or in blue?", note: "*Wil je ... of ...?* reuses the choice-offering pattern from unit13's preferences lessons."}
  nl.a1.unit20.lesson06.teach.omar_choose_black: {title: "Omar decides", gloss: "Omar: I'll take it in black.", note: "*Nemen* (to take) is the natural verb for finalizing a purchase choice, matching the receipt's stated color."}
  nl.a1.unit20.lesson06.teach.neemt_form: {title: "Neem vs. neemt", gloss: "Neem is the I-form of nemen (to take); neemt is the he/she-form.", note: "Regular present-tense pattern: *ik neem, jij/hij/zij neemt*."}

exercises:
  nl.a1.unit20.lesson01.exercise01.choose_looking_for_coat:
    instruction: "Choose the Dutch sentence meaning 'I am looking for a coat.'"
    correct_option: "Ik zoek een jas."
    distractors: ["Ik zoek een trui.", "Ik heb een jas.", "Ik zoek naar een jas."]
    accepted_answers: [{value: "Ik zoek een jas.", status: correct}]
    feedback: "Zoeken takes a direct object with no preposition."
  nl.a1.unit20.lesson01.exercise02.listen_looking_for_coat:
    instruction: "Listen and choose what the speaker says."
    correct_option: "I am looking for a coat."
    distractors: ["I am looking for a sweater.", "I have a coat.", "What size do you wear?"]
    accepted_answers: [{value: "I am looking for a coat.", status: correct}]
    feedback: "Ik zoek een jas."
  nl.a1.unit20.lesson01.exercise03.match_clothing_items:
    instruction: "Match each Dutch clothing word to its meaning."
    accepted_answers: [{value: [{left: "de jas", right: coat}, {left: "de trui", right: sweater}, {left: "de broek", right: pants}, {left: "de schoenen", right: shoes}], status: correct}]
    feedback: "These are four common clothing items."
  nl.a1.unit20.lesson01.exercise04.order_looking_for_coat:
    instruction: "Put the words in order to say you are looking for a coat."
    correct_option: "Ik zoek een jas"
    accepted_answers: [{value: "Ik zoek een jas", status: correct}]
    feedback: "The complete sentence is Ik zoek een jas."
  nl.a1.unit20.lesson01.exercise05.listen_order_looking_for_coat:
    instruction: "Listen and put the words in the order you hear."
    correct_option: "Ik zoek een jas"
    accepted_answers: [{value: "Ik zoek een jas", status: correct}]
    feedback: "The complete sentence is Ik zoek een jas."
  nl.a1.unit20.lesson01.exercise06.complete_looking_for_coat:
    instruction: "Complete the sentence."
    accepted_answers: [{value: zoek, status: correct}]
    feedback: "Ik zoek een jas."
  nl.a1.unit20.lesson01.exercise07.write_shoes:
    instruction: "Write in Dutch: say you are looking for shoes."
    accepted_answers: [{value: "Ik zoek schoenen.", status: correct}, {value: "Ik zoek schoenen", status: correct}]
    feedback: "Ik zoek schoenen."

  nl.a1.unit20.lesson02.exercise01.choose_size_m:
    instruction: "Choose the Dutch sentence meaning 'I am a size M.'"
    correct_option: "Ik heb maat M."
    distractors: ["Ik ben maat M.", "Ik heb een maat M.", "Ik zoek maat M."]
    accepted_answers: [{value: "Ik heb maat M.", status: correct}]
    feedback: "Hebben is used to state your size."
  nl.a1.unit20.lesson02.exercise02.listen_size_question:
    instruction: "Listen and choose what is asked."
    correct_option: "What size do you wear?"
    distractors: ["What color do you want?", "Does it fit?", "What are you looking for?"]
    accepted_answers: [{value: "What size do you wear?", status: correct}]
    feedback: "Welke maat heeft u?"
  nl.a1.unit20.lesson02.exercise03.match_size_words:
    instruction: "Match each Dutch phrase to its meaning."
    accepted_answers: [{value: [{left: "de maat", right: "the size"}, {left: "Welke maat?", right: "What size?"}], status: correct}]
    feedback: "Maat is the general word for size."
  nl.a1.unit20.lesson02.exercise04.order_size_m:
    instruction: "Put the words in order to say you are a size M."
    correct_option: "Ik heb maat M"
    accepted_answers: [{value: "Ik heb maat M", status: correct}]
    feedback: "The complete sentence is Ik heb maat M."
  nl.a1.unit20.lesson02.exercise05.complete_size_question:
    instruction: "Complete the question."
    accepted_answers: [{value: maat, status: correct}]
    feedback: "Welke maat heeft u?"
  nl.a1.unit20.lesson02.exercise06.respond_size:
    instruction: "Answer in Dutch: say you are a size M."
    accepted_answers: [{value: "Ik heb maat M.", status: correct}, {value: "Ik heb maat M", status: correct}]
    feedback: "Ik heb maat M."

  nl.a1.unit20.lesson03.exercise01.choose_black_coat:
    instruction: "Choose the Dutch sentence meaning 'I want the coat in black.'"
    correct_option: "Ik wil de jas in het zwart."
    distractors: ["Ik wil de jas in het blauw.", "Ik zoek de jas in het zwart.", "Ik wil de jas zwart."]
    accepted_answers: [{value: "Ik wil de jas in het zwart.", status: correct}]
    feedback: "In het + color states the requested garment color."
  nl.a1.unit20.lesson03.exercise02.listen_also_in_blue:
    instruction: "Listen and choose what is asked."
    correct_option: "Do you also have this in blue?"
    distractors: ["Do you have this in black?", "What size do you wear?", "Does it fit?"]
    accepted_answers: [{value: "Do you also have this in blue?", status: correct}]
    feedback: "Heeft u deze ook in het blauw?"
  nl.a1.unit20.lesson03.exercise03.match_colors:
    instruction: "Match each Dutch color to its meaning."
    accepted_answers: [{value: [{left: zwart, right: black}, {left: blauw, right: blue}], status: correct}]
    feedback: "Zwart and blauw are the two colors in this lesson."
  nl.a1.unit20.lesson03.exercise04.order_black_coat:
    instruction: "Put the words in order to say you want the coat in black."
    correct_option: "Ik wil de jas in het zwart"
    accepted_answers: [{value: "Ik wil de jas in het zwart", status: correct}]
    feedback: "The complete sentence is Ik wil de jas in het zwart."
  nl.a1.unit20.lesson03.exercise05.complete_also_in_blue:
    instruction: "Complete the question."
    accepted_answers: [{value: blauw, status: correct}]
    feedback: "Heeft u deze ook in het blauw?"
  nl.a1.unit20.lesson03.exercise06.translate_black_coat:
    instruction: "Translate into Dutch."
    accepted_answers: [{value: "Ik wil de jas in het zwart.", status: correct}, {value: "Ik wil de jas in het zwart", status: correct}]
    feedback: "Ik wil de jas in het zwart."

  nl.a1.unit20.lesson04.exercise01.choose_too_small:
    instruction: "Choose the Dutch sentence meaning 'It is too small.'"
    correct_option: "Het is te klein."
    distractors: ["Het is te groot.", "Het past goed.", "Het is klein."]
    accepted_answers: [{value: "Het is te klein.", status: correct}]
    feedback: "Te precedes the adjective to express excess."
  nl.a1.unit20.lesson04.exercise02.listen_too_small:
    instruction: "Listen and choose what the speaker says."
    correct_option: "It is too small."
    distractors: ["It is too big.", "It fits well.", "Does this coat fit?"]
    accepted_answers: [{value: "It is too small.", status: correct}]
    feedback: "Het is te klein."
  nl.a1.unit20.lesson04.exercise03.match_fit_words:
    instruction: "Match each Dutch phrase to its meaning."
    accepted_answers: [{value: [{left: "past goed", right: "fits well"}, {left: "te klein", right: "too small"}, {left: "te groot", right: "too big"}], status: correct}]
    feedback: "These three phrases describe how clothing fits."
  nl.a1.unit20.lesson04.exercise04.order_too_big:
    instruction: "Put the words in order to say it is too big."
    correct_option: "Het is te groot"
    accepted_answers: [{value: "Het is te groot", status: correct}]
    feedback: "The complete sentence is Het is te groot."
  nl.a1.unit20.lesson04.exercise05.listen_order_fits_well:
    instruction: "Listen and put the words in the order you hear."
    correct_option: "Het past goed"
    accepted_answers: [{value: "Het past goed", status: correct}]
    feedback: "The complete sentence is Het past goed."
  nl.a1.unit20.lesson04.exercise06.complete_fits_well:
    instruction: "Complete the sentence."
    accepted_answers: [{value: goed, status: correct}]
    feedback: "Het past goed."
  nl.a1.unit20.lesson04.exercise07.respond_fit_question:
    instruction: "Answer in Dutch: say it fits well."
    accepted_answers: [{value: "Het past goed.", status: correct}, {value: "Het past goed", status: correct}]
    feedback: "Het past goed."

  nl.a1.unit20.lesson05.exercise01.read_size:
    instruction: "Read the receipt and choose the coat's size."
    correct_option: M
    distractors: [S, L, XL]
    accepted_answers: [{value: M, status: correct}]
    feedback: "Winterjas: maat M."
  nl.a1.unit20.lesson05.exercise02.read_price:
    instruction: "Read the receipt and choose the coat's price."
    correct_option: "ninety euros"
    distractors: ["nineteen euros", "nine euros", "ninety-nine euros"]
    accepted_answers: [{value: "ninety euros", status: correct}]
    feedback: "Prijs: negentig euro."
  nl.a1.unit20.lesson05.exercise03.read_fit:
    instruction: "Read the receipt and choose how it describes the fit and warmth of the coat."
    correct_option: "fits well and is warm"
    distractors: ["fits well but is cold", "is too small but warm", "is too big and cold"]
    accepted_answers: [{value: "fits well and is warm", status: correct}]
    feedback: "Deze jas past goed en is warm."
  nl.a1.unit20.lesson05.exercise04.match_receipt_fields:
    instruction: "Match each field on the receipt to its value."
    accepted_answers: [{value: [{left: maat, right: M}, {left: kleur, right: zwart}, {left: prijs, right: "negentig euro"}], status: correct}]
    feedback: "Maat is size, kleur is color, and prijs is price."
  nl.a1.unit20.lesson05.exercise05.listen_receipt:
    instruction: "Listen and choose the coat's price."
    correct_option: "ninety euros"
    distractors: ["nineteen euros", "nine euros", "ninety-nine euros"]
    accepted_answers: [{value: "ninety euros", status: correct}]
    feedback: "Prijs: negentig euro."
  nl.a1.unit20.lesson05.exercise06.write_receipt_summary:
    instruction: "Write in Dutch: the coat is size M, black, and costs ninety euros."
    accepted_answers: [{value: "De jas is maat M, zwart, en kost negentig euro.", status: correct}, {value: "De jas is maat M zwart en kost negentig euro", status: correct}]
    feedback: "De jas is maat M, zwart, en kost negentig euro."

  nl.a1.unit20.lesson06.exercise01.listen_notice:
    instruction: "Listen and choose what Lotte says."
    correct_option: "I am a size M."
    distractors: ["This coat is too small.", "Do you also have this in blue?", "It fits well."]
    accepted_answers: [{value: "I am a size M.", status: correct}]
    feedback: "This clip plays Omar's line, Ik heb maat M, reused to check recognition of the size phrase."
  nl.a1.unit20.lesson06.exercise02.comprehend_size:
    instruction: "Listen to the dialogue and choose Omar's size."
    correct_option: M
    distractors: [S, L, XL]
    accepted_answers: [{value: M, status: correct}]
    feedback: "Omar says: Ik heb maat M."
  nl.a1.unit20.lesson06.exercise03.comprehend_fit:
    instruction: "Listen to the dialogue and choose how the coat fits and how Omar describes it."
    correct_option: "fits well and is warm"
    distractors: ["is too small but warm", "fits well but is cold", "is too big and cold"]
    accepted_answers: [{value: "fits well and is warm", status: correct}]
    feedback: "Omar says: Ja, hij past goed en hij is warm."
  nl.a1.unit20.lesson06.exercise04.comprehend_color_choice:
    instruction: "Listen to the dialogue and choose which color Omar chooses."
    correct_option: black
    distractors: [blue, "black and blue", neither]
    accepted_answers: [{value: black, status: correct}]
    feedback: "Omar says: Ik neem hem in het zwart."
  nl.a1.unit20.lesson06.exercise05.order_ask_try:
    instruction: "Put the words in order to ask if you may try it on."
    correct_option: "Mag ik hem passen"
    accepted_answers: [{value: "Mag ik hem passen", status: correct}]
    feedback: "The complete question is Mag ik hem passen?"
  nl.a1.unit20.lesson06.exercise06.respond_choose_black:
    instruction: "Answer in Dutch: say you'll take it in black."
    accepted_answers: [{value: "Ik neem hem in het zwart.", status: correct}, {value: "Ik neem hem in het zwart", status: correct}]
    feedback: "Ik neem hem in het zwart."
  nl.a1.unit20.lesson06.exercise07.listen_type_confirm_fit:
    instruction: "Listen and type the complete Dutch sentence."
    accepted_answers: [{value: "Ja, hij past goed en hij is warm.", status: correct}, {value: "Ja hij past goed en hij is warm", status: correct}, {value: "Ja, hij past goed, en hij is warm.", status: correct}, {value: "Ja, hij past goed, en hij is warm", status: correct}]
    feedback: "Ja, hij past goed en hij is warm."
  nl.a1.unit20.lesson06.exercise08.write_purchase_summary:
    instruction: "Write two Dutch sentences: Omar is a size M, and he takes the coat in black."
    accepted_answers: [{value: "Omar heeft maat M. Hij neemt de jas in het zwart.", status: correct}, {value: "Omar heeft maat M Hij neemt de jas in het zwart", status: correct}, {value: "Omar heeft maat M, en hij neemt de jas in het zwart.", status: correct}, {value: "Omar heeft maat M, en hij neemt de jas in het zwart", status: correct}]
    feedback: "Omar heeft maat M. Hij neemt de jas in het zwart."
