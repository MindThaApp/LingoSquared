course:
  title: "Dutch A2"
  description: "Grammar-led A2 Dutch for inviting, accepting and declining."
  learning_goal: "Invite someone, and accept or decline with a reason and an alternative, using modals, omdat/want and gaan/zullen."
units:
  nl.a2.unit107.uitnodigen_en_afslaan: {title: "Inviting and declining", description: "Invite a friend, accept with enthusiasm, or decline politely with a reason and an alternative plan."}
lessons:
  nl.a2.unit107.lesson01.een_uitnodiging: {"title": "An invitation"}
  nl.a2.unit107.lesson02.ja_graag: {"title": "Yes, gladly!"}
  nl.a2.unit107.lesson03.helaas_ik_kan_niet: {"title": "Unfortunately I can't"}
  nl.a2.unit107.lesson04.zullen_we_zondag: {"title": "Shall we do Sunday?"}
  nl.a2.unit107.lesson05.noors_uitnodiging: {"title": "Noor's invitation"}
  nl.a2.unit107.lesson06.lotte_en_omar_plannen: {"title": "Lotte and Omar make plans"}
teaching:
  nl.a2.unit107.lesson01.teach.plekken: {"title": "Places and occasions", "gloss": "the party / the birthday / the cinema / the concert / the theatre", "note": "These are the occasions and places you invite people to.", "example_gloss": ["Lotte has a party on Saturday.", "Noor has a birthday on Sunday.", "We are going to the cinema this evening.", "There is a concert on Saturday.", "The theatre is in town."]}
  nl.a2.unit107.lesson01.teach.film: {"title": "Film, show, ticket", "gloss": "the film / the performance / the ticket / this evening / Saturday / Sunday", "note": "*Voorstelling* is a performance, for example in the theatre.", "example_gloss": ["The film starts at eight o'clock.", "The performance is on Saturday.", "I have two tickets.", "There is a film this evening."]}
  nl.a2.unit107.lesson01.teach.gn_zin: {"title": "Heb je zin om ... te ...?", "gloss": "Do you feel like going to the film on Saturday?", "note": "Use *Heb je zin om ... te + infinitive?* to invite someone. The infinitive (*gaan*) goes at the very end, after *te*.", "example_gloss": ["Do you feel like going to the concert?", "Do you feel like going to the theatre this evening?"]}
  nl.a2.unit107.lesson01.teach.gn_kom_je: {"title": "Kom je ook naar ...?", "gloss": "Are you coming to the party too? Are you coming to the cinema too?", "note": "*Kom je ook naar ...?* is a short, friendly invitation. *Jij* is the stressed form of *je*; both are fine here.", "example_gloss": ["Are you coming to Noor's party too?"]}
  nl.a2.unit107.lesson01.teach.gn_wil_je_mee: {"title": "Wil je mee naar ...?", "gloss": "Do you want to come along to the concert? Do you want to come along to the theatre?", "note": "*Mee* means 'along'. *Wil je mee naar ...?* needs no infinitive: the movement is already in *mee naar*.", "example_gloss": ["Do you want to come along to the film?"]}
  nl.a2.unit107.lesson01.teach.zinnen: {"title": "Three invitations", "gloss": "Do you feel like going to the film this evening? Are you coming to the party too? Do you want to come along to the concert?"}
  nl.a2.unit107.lesson02.teach.leuk: {"title": "Saying yes", "gloss": "nice / cosy and fun / gladly / good idea", "note": "*Gezellig* describes a pleasant, sociable atmosphere. *Graag* means 'gladly'.", "example_gloss": ["How nice!", "That sounds fun to me.", "Yes, gladly!", "Good idea!"]}
  nl.a2.unit107.lesson02.teach.gn_ja: {"title": "Accepting an invitation", "gloss": "Nice! Yes, gladly! I'm coming along. I'll gladly come.", "note": "Accept with a short reaction (*Leuk!*, *Ja, graag!*) and then confirm: *Ik ga mee* or *Ik kom graag*.", "example_gloss": ["I'll gladly come to the party.", "Yes, I'm coming along to the film."]}
  nl.a2.unit107.lesson02.teach.gn_lijkt: {"title": "Dat lijkt me ...", "gloss": "That sounds fun to me. That sounds cosy to me.", "note": "*Dat lijkt me ...* is a common way to say you like a plan. The verb *lijkt* stays in second position.", "example_gloss": ["That seems like a good idea to me."]}
  nl.a2.unit107.lesson02.teach.tijd: {"title": "Asking the time", "gloss": "What time does it start? It starts at eight o'clock.", "note": "After accepting, ask for the time with *Hoe laat begint het?* and answer with *om ... uur*.", "example_gloss": ["The film starts at nine o'clock.", "The performance starts at eight o'clock."]}
  nl.a2.unit107.lesson03.teach.helaas: {"title": "Declining and reasons", "gloss": "unfortunately / not / but / to work / tired / ill / the appointment / no time", "note": "*Helaas* softens a refusal. *Geen tijd* means 'no time'.", "example_gloss": ["Unfortunately I can't.", "I would like to, but I have no time.", "I have to work.", "I am tired.", "I am ill.", "I have an appointment."]}
  nl.a2.unit107.lesson03.teach.gn_modals: {"title": "Kunnen, moeten, willen", "gloss": "I can't come. I have to work. I would like to, but I have no time.", "note": "*Kunnen*, *moeten* and *willen* usually come with a second verb in the infinitive at the end of the clause: *Ik kan niet komen*; *Ik moet werken*.", "example_gloss": ["I can't come to the party.", "I have to work on Saturday."]}
  nl.a2.unit107.lesson03.teach.gn_want: {"title": "Want gives a reason", "gloss": "Unfortunately I can't come, because I have to work.", "note": "*Want* connects two main clauses, so the word order stays normal: subject, then verb (*want ik moet werken*).", "example_gloss": ["I can't come, because I am ill."]}
  nl.a2.unit107.lesson03.teach.gn_omdat: {"title": "Omdat sends the verb to the end", "gloss": "I'm not coming, because I have an appointment.", "note": "After *omdat*, the verb goes to the end of the clause: *omdat ik een afspraak heb*. With a modal, the two verbs stay together at the end, finite verb first: *omdat ik moet werken*.", "example_gloss": ["Unfortunately I can't come, because I have to work."]}
  nl.a2.unit107.lesson03.teach.gn_contrast: {"title": "Want versus omdat", "gloss": "I'm not coming, because I have an appointment. (both sentences)", "note": "Both give a reason. *Want ik heb* keeps the verb in second place; *omdat ik ... heb* puts it last."}
  nl.a2.unit107.lesson03.teach.zin: {"title": "A polite no", "gloss": "Unfortunately I can't, because I have to work."}
  nl.a2.unit107.lesson04.teach.alt: {"title": "Suggesting something else", "gloss": "instead / then / next week / tomorrow / fine / (softener)", "note": "*In plaats daarvan* means 'instead of that'. *Wel* here stresses that this option does work.", "example_gloss": ["Shall we go on Sunday instead?", "Then I have time.", "Next week works for me.", "Tomorrow I am going to work.", "That is fine."]}
  nl.a2.unit107.lesson04.teach.gn_zullen: {"title": "Zullen we ...?", "gloss": "Shall we go to the film on Sunday? Shall we go to the cinema on Sunday instead?", "note": "*Zullen we ...?* proposes a plan together. The verb of the plan (*gaan*) goes at the end.", "example_gloss": ["Shall we go to the concert tomorrow?"]}
  nl.a2.unit107.lesson04.teach.gn_gaan: {"title": "Gaan for the future", "gloss": "I am going to work on Saturday. We are going to the film on Sunday.", "note": "*Gaan* + infinitive talks about plans: *Ik ga zaterdag werken*. The infinitive stays at the end. If a time word comes first, the verb stays second: *Zondag gaan wij ...*.", "example_gloss": ["Tomorrow I am going to the theatre.", "On Sunday we are going to the concert."]}
  nl.a2.unit107.lesson04.teach.gn_zal: {"title": "Zullen for a promise", "gloss": "I will call you tomorrow.", "note": "*Zullen* can also state a plan or promise: *Ik zal je morgen bellen*. *Zal ik ...?* offers; *Zullen we ...?* proposes.", "example_gloss": ["I will come on Sunday."]}
  nl.a2.unit107.lesson04.teach.zinnen: {"title": "No, with an alternative", "gloss": "Unfortunately I can't, because I have to work. Shall we go on Sunday?"}
  nl.a2.unit107.lesson05.teach.woorden: {"title": "Words in a message", "gloss": "the invitation / thanks / best wishes / already / to arrange to meet", "note": "*Groetjes* ends a friendly message.", "example_gloss": ["Thanks for the invitation!", "Best wishes, Lotte", "I already have an appointment."]}
  nl.a2.unit107.lesson05.teach.gn_voltooid: {"title": "Heb + participle (reading only)", "gloss": "I have arranged to meet my parents. I have worked.", "note": "With most verbs, *heb + past participle* (*afgesproken*, *gewerkt*) tells what has already happened. For now, just recognise it when reading; you do not need to write it yet."}
  nl.a2.unit107.lesson05.teach.reading: {"title": "Noor and Lotte write", "gloss": "Hi Lotte, do you feel like coming along to the theatre on Saturday? The performance starts at eight o'clock. Are you coming too? Best wishes, Noor. Hi Noor, thanks for the invitation! Unfortunately I can't, because I have already arranged to meet my parents. Shall we go to the film on Sunday? Then I have time. Best wishes, Lotte", "note": "Find the invitation, the answer, the reason and the alternative.", "glosses": {"afgesproken": "arranged to meet", "ouders": "parents", "uitnodiging": "invitation", "groetjes": "best wishes"}}
  nl.a2.unit107.lesson06.teach.beurt1: {"title": "Lotte invites Omar", "gloss": "Lotte: Hi Omar, do you feel like coming along to the concert on Saturday?"}
  nl.a2.unit107.lesson06.teach.beurt2: {"title": "Omar declines with a reason", "gloss": "Omar: Unfortunately I can't, because I have to work."}
  nl.a2.unit107.lesson06.teach.beurt3: {"title": "Lotte suggests an alternative", "gloss": "Lotte: Too bad! Shall we go to the film on Sunday?"}
  nl.a2.unit107.lesson06.teach.beurt4: {"title": "Omar agrees and asks the time", "gloss": "Omar: Sunday works for me. What time does the film start?"}
  nl.a2.unit107.lesson06.teach.beurt5: {"title": "Lotte gives the time", "gloss": "Lotte: At eight o'clock."}
  nl.a2.unit107.lesson06.teach.beurt6: {"title": "Omar accepts", "gloss": "Omar: Nice, gladly! I'm coming along."}
exercises:
  nl.a2.unit107.lesson01.exercise01.kies_concert: {"instruction": "Choose the Dutch invitation that matches the English.", "correct_option": "Wil je mee naar het concert?", "distractors": ["Kom je ook naar het feest?", "Heb je zin om het concert?", "Wil je naar het concert mee zin?"], "accepted_answers": [{"value": "Wil je mee naar het concert?", "status": "correct"}], "feedback": "*Wil je mee naar het concert?* = Do you want to come along to the concert?"}
  nl.a2.unit107.lesson01.exercise02.kies_zin: {"instruction": "Choose the correct Dutch question.", "correct_option": "Heb je zin om naar de bioscoop te gaan?", "distractors": ["Heb je zin om naar de bioscoop gaan?", "Hebben je zin om naar de bioscoop te gaan?", "Heb je zin om te naar de bioscoop gaan?"], "accepted_answers": [{"value": "Heb je zin om naar de bioscoop te gaan?", "status": "correct"}], "feedback": "*Heb je zin om ... te gaan?*: the infinitive *gaan* follows *te* at the end."}
  nl.a2.unit107.lesson01.exercise03.match_plekken: {"instruction": "Match each Dutch word to its English meaning.", "accepted_answers": [{"value": [{"left": "het feest", "right": "the party"}, {"left": "de bioscoop", "right": "the cinema"}, {"left": "het concert", "right": "the concert"}, {"left": "het theater", "right": "the theatre"}, {"left": "het kaartje", "right": "the ticket"}, {"left": "de voorstelling", "right": "the performance"}], "status": "correct"}], "feedback": "These are the occasions and places you invite people to."}
  nl.a2.unit107.lesson01.exercise04.order_mee: {"instruction": "Put the words in order to ask 'Do you want to come along to the concert?'", "correct_option": "Wil je mee naar het concert", "accepted_answers": [{"value": "Wil je mee naar het concert", "status": "correct"}], "feedback": "*Wil je mee naar het concert?*"}
  nl.a2.unit107.lesson01.exercise05.vul_om: {"instruction": "Complete the invitation.", "correct_option": "om", "accepted_answers": [{"value": "om", "status": "correct"}], "feedback": "*Heb je zin om ... te gaan?*"}
  nl.a2.unit107.lesson01.exercise06.vertaal_kom_je: {"instruction": "Translate into Dutch.", "accepted_answers": [{"value": "Kom je ook naar het feest?", "status": "correct"}, {"value": "Kom je ook naar het feest", "status": "correct"}, {"value": "Kom jij ook naar het feest?", "status": "correct"}, {"value": "Kom jij ook naar het feest", "status": "correct"}], "feedback": "*Kom je ook naar het feest?*"}
  nl.a2.unit107.lesson01.exercise07.schrijf_mee: {"instruction": "Write the invitation with *Wil je mee naar ...?*", "correct_option": "Wil je mee naar het theater?", "accepted_answers": [{"value": "Wil je mee naar het theater?", "status": "correct"}, {"value": "Wil je mee naar het theater", "status": "correct"}], "feedback": "*Wil je mee naar het theater?*"}
  nl.a2.unit107.lesson02.exercise01.kies_ja: {"instruction": "Choose the answer that accepts the invitation.", "correct_option": "Ja, graag! Dat lijkt me gezellig.", "distractors": ["Kom je ook naar het feest?", "Wil je mee naar het concert?", "Hoe laat begint de film?"], "accepted_answers": [{"value": "Ja, graag! Dat lijkt me gezellig.", "status": "correct"}], "feedback": "*Ja, graag!* and *Dat lijkt me gezellig* both accept."}
  nl.a2.unit107.lesson02.exercise02.kies_lijkt: {"instruction": "Choose the correct Dutch sentence.", "correct_option": "Dat lijkt me leuk.", "distractors": ["Dat lijkt me graag.", "Dat leuk lijkt me.", "Dat lijk ik leuk."], "accepted_answers": [{"value": "Dat lijkt me leuk.", "status": "correct"}], "feedback": "*Dat lijkt me leuk.*"}
  nl.a2.unit107.lesson02.exercise03.match_ja: {"instruction": "Match each Dutch phrase to its English meaning.", "accepted_answers": [{"value": [{"left": "Ja, graag!", "right": "Yes, gladly!"}, {"left": "Goed idee!", "right": "Good idea!"}, {"left": "Wat leuk!", "right": "How nice!"}, {"left": "Dat lijkt me gezellig.", "right": "That sounds cosy to me."}, {"left": "Ik ga mee.", "right": "I'm coming along."}, {"left": "Hoe laat begint het?", "right": "What time does it start?"}], "status": "correct"}], "feedback": "Short reactions like these accept an invitation, and *Hoe laat begint het?* asks about the time."}
  nl.a2.unit107.lesson02.exercise04.order_gezellig: {"instruction": "Put the words in order to say 'That sounds cosy to me.'", "correct_option": "Dat lijkt me gezellig", "accepted_answers": [{"value": "Dat lijkt me gezellig", "status": "correct"}], "feedback": "*Dat lijkt me gezellig.*"}
  nl.a2.unit107.lesson02.exercise05.vul_om_uur: {"instruction": "Complete the sentence about the time.", "correct_option": "om", "accepted_answers": [{"value": "om", "status": "correct"}], "feedback": "*De voorstelling begint om acht uur.*"}
  nl.a2.unit107.lesson02.exercise06.vertaal_graag: {"instruction": "Translate into Dutch.", "accepted_answers": [{"value": "Ja, graag! Hoe laat begint het?", "status": "correct"}, {"value": "Ja, graag! Hoe laat begint het", "status": "correct"}, {"value": "Ja graag! Hoe laat begint het?", "status": "correct"}, {"value": "Ja graag! Hoe laat begint het", "status": "correct"}, {"value": "Ja, graag! Hoe laat begint de film?", "status": "correct"}, {"value": "Ja, graag! Hoe laat begint de film", "status": "correct"}, {"value": "Ja graag! Hoe laat begint de film?", "status": "correct"}, {"value": "Ja graag! Hoe laat begint de film", "status": "correct"}, {"value": "Ja, graag! Hoe laat begint de voorstelling?", "status": "correct"}, {"value": "Ja, graag! Hoe laat begint de voorstelling", "status": "correct"}, {"value": "Ja graag! Hoe laat begint de voorstelling?", "status": "correct"}, {"value": "Ja graag! Hoe laat begint de voorstelling", "status": "correct"}], "feedback": "*Ja, graag! Hoe laat begint het?*"}
  nl.a2.unit107.lesson02.exercise07.schrijf_leuk: {"instruction": "Write the acceptance with *Leuk* and *Ik ga mee*.", "correct_option": "Leuk! Ik ga mee.", "accepted_answers": [{"value": "Leuk! Ik ga mee.", "status": "correct"}, {"value": "Leuk! Ik ga mee", "status": "correct"}, {"value": "Leuk! Ik ga mee!", "status": "correct"}, {"value": "Leuk, ik ga mee!", "status": "correct"}, {"value": "Leuk, ik ga mee.", "status": "correct"}, {"value": "Leuk, ik ga mee", "status": "correct"}, {"value": "Leuk ik ga mee.", "status": "correct"}, {"value": "Leuk ik ga mee", "status": "correct"}], "feedback": "*Leuk! Ik ga mee.*"}
  nl.a2.unit107.lesson03.exercise01.kies_want: {"instruction": "Choose the correct Dutch sentence.", "correct_option": "Helaas kan ik niet komen, want ik moet werken.", "distractors": ["Helaas kan ik niet komen, want moet ik werken.", "Helaas kan ik niet komen, want ik werken moet.", "Helaas ik kan niet komen, want ik moet werken."], "accepted_answers": [{"value": "Helaas kan ik niet komen, want ik moet werken.", "status": "correct"}], "feedback": "After *want*, the word order stays normal: *want ik moet werken*."}
  nl.a2.unit107.lesson03.exercise02.kies_omdat: {"instruction": "Choose the correct Dutch sentence with omdat.", "correct_option": "Ik kom niet, omdat ik een afspraak heb.", "distractors": ["Ik kom niet, omdat ik heb een afspraak.", "Ik kom niet, omdat heb ik een afspraak.", "Ik kom niet, omdat een afspraak ik heb."], "accepted_answers": [{"value": "Ik kom niet, omdat ik een afspraak heb.", "status": "correct"}], "feedback": "After *omdat*, the verb goes to the end: *omdat ik een afspraak heb*."}
  nl.a2.unit107.lesson03.exercise03.match_redenen: {"instruction": "Match each Dutch sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Ik moet werken.", "right": "I have to work."}, {"left": "Ik heb een afspraak.", "right": "I have an appointment."}, {"left": "Ik ben moe.", "right": "I am tired."}, {"left": "Ik heb geen tijd.", "right": "I have no time."}, {"left": "Ik ben ziek.", "right": "I am ill."}, {"left": "Ik kan niet.", "right": "I can't."}], "status": "correct"}], "feedback": "These sentences are common reasons for saying no."}
  nl.a2.unit107.lesson03.exercise04.order_helaas: {"instruction": "Put the words in order: unfortunately I can't come, because I have to work.", "correct_option": "Helaas kan ik niet komen want ik moet werken", "accepted_answers": [{"value": "Helaas kan ik niet komen want ik moet werken", "status": "correct"}, {"value": "Ik kan helaas niet komen want ik moet werken", "status": "correct"}], "feedback": "*Helaas kan ik niet komen, want ik moet werken.*"}
  nl.a2.unit107.lesson03.exercise05.vul_heb: {"instruction": "Complete the sentence. The verb goes at the end after omdat.", "correct_option": "heb", "accepted_answers": [{"value": "heb", "status": "correct"}], "feedback": "*omdat ik een afspraak heb*"}
  nl.a2.unit107.lesson03.exercise06.vertaal_geen_tijd: {"instruction": "Translate into Dutch.", "accepted_answers": [{"value": "Helaas kan ik niet komen, want ik heb geen tijd.", "status": "correct"}, {"value": "Helaas kan ik niet komen, want ik heb geen tijd", "status": "correct"}, {"value": "Helaas kan ik niet komen want ik heb geen tijd.", "status": "correct"}, {"value": "Helaas kan ik niet komen want ik heb geen tijd", "status": "correct"}, {"value": "Helaas kan ik niet, want ik heb geen tijd.", "status": "correct"}, {"value": "Helaas kan ik niet, want ik heb geen tijd", "status": "correct"}, {"value": "Helaas kan ik niet want ik heb geen tijd.", "status": "correct"}, {"value": "Helaas kan ik niet want ik heb geen tijd", "status": "correct"}, {"value": "Ik kan helaas niet komen, want ik heb geen tijd.", "status": "correct"}, {"value": "Ik kan helaas niet komen, want ik heb geen tijd", "status": "correct"}, {"value": "Ik kan helaas niet komen want ik heb geen tijd.", "status": "correct"}, {"value": "Ik kan helaas niet komen want ik heb geen tijd", "status": "correct"}, {"value": "Ik kan helaas niet, want ik heb geen tijd.", "status": "correct"}, {"value": "Ik kan helaas niet, want ik heb geen tijd", "status": "correct"}, {"value": "Ik kan helaas niet want ik heb geen tijd.", "status": "correct"}, {"value": "Ik kan helaas niet want ik heb geen tijd", "status": "correct"}, {"value": "Helaas kan ik niet komen, omdat ik geen tijd heb.", "status": "correct"}, {"value": "Helaas kan ik niet komen, omdat ik geen tijd heb", "status": "correct"}, {"value": "Helaas kan ik niet komen omdat ik geen tijd heb.", "status": "correct"}, {"value": "Helaas kan ik niet komen omdat ik geen tijd heb", "status": "correct"}, {"value": "Helaas kan ik niet, omdat ik geen tijd heb.", "status": "correct"}, {"value": "Helaas kan ik niet, omdat ik geen tijd heb", "status": "correct"}, {"value": "Helaas kan ik niet omdat ik geen tijd heb.", "status": "correct"}, {"value": "Helaas kan ik niet omdat ik geen tijd heb", "status": "correct"}, {"value": "Ik kan helaas niet komen, omdat ik geen tijd heb.", "status": "correct"}, {"value": "Ik kan helaas niet komen, omdat ik geen tijd heb", "status": "correct"}, {"value": "Ik kan helaas niet komen omdat ik geen tijd heb.", "status": "correct"}, {"value": "Ik kan helaas niet komen omdat ik geen tijd heb", "status": "correct"}, {"value": "Ik kan helaas niet, omdat ik geen tijd heb.", "status": "correct"}, {"value": "Ik kan helaas niet, omdat ik geen tijd heb", "status": "correct"}, {"value": "Ik kan helaas niet omdat ik geen tijd heb.", "status": "correct"}, {"value": "Ik kan helaas niet omdat ik geen tijd heb", "status": "correct"}], "feedback": "*Helaas kan ik niet komen, want ik heb geen tijd.* or *..., omdat ik geen tijd heb.*"}
  nl.a2.unit107.lesson03.exercise07.schrijf_omdat: {"instruction": "Write the sentence with *helaas* and *omdat*.", "correct_option": "Helaas kan ik niet komen, omdat ik moet werken.", "accepted_answers": [{"value": "Helaas kan ik niet komen, omdat ik moet werken.", "status": "correct"}, {"value": "Helaas kan ik niet komen, omdat ik moet werken", "status": "correct"}, {"value": "Helaas kan ik niet komen omdat ik moet werken.", "status": "correct"}, {"value": "Helaas kan ik niet komen omdat ik moet werken", "status": "correct"}, {"value": "Helaas kan ik niet, omdat ik moet werken.", "status": "correct"}, {"value": "Helaas kan ik niet, omdat ik moet werken", "status": "correct"}, {"value": "Helaas kan ik niet omdat ik moet werken.", "status": "correct"}, {"value": "Helaas kan ik niet omdat ik moet werken", "status": "correct"}, {"value": "Ik kan helaas niet komen, omdat ik moet werken.", "status": "correct"}, {"value": "Ik kan helaas niet komen, omdat ik moet werken", "status": "correct"}, {"value": "Ik kan helaas niet komen omdat ik moet werken.", "status": "correct"}, {"value": "Ik kan helaas niet komen omdat ik moet werken", "status": "correct"}, {"value": "Ik kan helaas niet, omdat ik moet werken.", "status": "correct"}, {"value": "Ik kan helaas niet, omdat ik moet werken", "status": "correct"}, {"value": "Ik kan helaas niet omdat ik moet werken.", "status": "correct"}, {"value": "Ik kan helaas niet omdat ik moet werken", "status": "correct"}], "feedback": "*Helaas kan ik niet komen, omdat ik moet werken.*"}
  nl.a2.unit107.lesson04.exercise01.kies_zullen: {"instruction": "Choose the correct Dutch question.", "correct_option": "Zullen we zondag naar de film gaan?", "distractors": ["Zullen we gaan zondag naar de film?", "Zullen we zondag naar de film te gaan?", "Zal we zondag naar de film gaan?"], "accepted_answers": [{"value": "Zullen we zondag naar de film gaan?", "status": "correct"}], "feedback": "*Zullen we ...?* puts the infinitive *gaan* at the end."}
