  nl.a1.unit10.lesson05.exercise04.match_text_times:
    instruction: "Match each activity in the text to its time."
    accepted_answers: [{"value": [{"left": "opstaan", "right": "half acht"}, {"left": "ontbijten", "right": "acht uur"}, {"left": "eten", "right": "half zeven"}, {"left": "slapen", "right": "elf uur"}, {"left": "werken", "right": "negen uur tot vijf uur"}], "status": "correct"}]
