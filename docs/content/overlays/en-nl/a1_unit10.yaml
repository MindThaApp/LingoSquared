  nl.a1.unit10.lesson05.exercise05.listen_work_sentence:
    instruction: "Listen and type the complete Dutch sentence."
    accepted_answers: [{value: "Daarna werk ik van negen uur tot vijf uur", status: correct}, {value: "Daarna werk ik van negen uur tot vijf uur.", status: correct}]
    feedback: "After daarna, werk comes before ik."
  nl.a1.unit10.lesson05.exercise06.write_own_routine:
    instruction: "Write at least four connected Dutch sentences about your routine. Include times and at least one sequence word."
