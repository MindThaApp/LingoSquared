teaching:
  nl.a1.unit10.lesson01.teach.opstaan: {title: "Get up", gloss: "to get up → I get up", note: "*Opstaan* splits in a main clause: *Ik sta op*. The prefix *op* moves to the end."}
  nl.a1.unit10.lesson01.teach.aankleden: {title: "Get dressed", gloss: "to get dressed → I get dressed", note: "*Zich aankleden* is reflexive and separable. With *ik*, use *me*, and move *aan* to the end: *Ik kleed me aan*."}
  nl.a1.unit10.lesson01.teach.ontbijten: {title: "Have breakfast", gloss: "to have breakfast → I have breakfast", note: "*Ontbijten* does not split: *Ik ontbijt*."}
  nl.a1.unit10.lesson01.teach.werken: {title: "Work", gloss: "to work → I work", note: "*Werken* does not split: *Ik werk*."}
  nl.a1.unit10.lesson01.teach.eten: {title: "Eat", gloss: "to eat → I eat", note: "The *ik* form of *eten* is *eet*: *Ik eet*."}
  nl.a1.unit10.lesson01.teach.afwassen: {title: "Do the dishes", gloss: "to do the dishes → I do the dishes", note: "*Afwassen* splits: *Ik was af*. The prefix *af* moves to the end."}
  nl.a1.unit10.lesson01.teach.slapen: {title: "Sleep", gloss: "to sleep → I sleep", note: "*Slapen* does not split. Its *ik* form has a long vowel: *Ik slaap*."}

  nl.a1.unit10.lesson02.teach.split_rule: {title: "The split pattern", gloss: "In an ordinary main clause, the first part moves to the end: opstaan → Ik sta op.", note: "Do not say *Ik opsta*. Conjugate the main verb and put the short prefix at the end of the main clause."}
  nl.a1.unit10.lesson02.teach.opstaan_split: {title: "Opstaan in a sentence", gloss: "to get up: I get up at seven.", note: "The time expression goes between *sta* and the final prefix *op*."}
  nl.a1.unit10.lesson02.teach.aankleden_split: {title: "Aankleden in a sentence", gloss: "to get dressed: I get dressed.", note: "The pattern is *Ik* + *kleed* + *me* + *aan*. *Aan* stays at the end."}
  nl.a1.unit10.lesson02.teach.afwassen_split: {title: "Afwassen in a sentence", gloss: "to do the dishes: I do the dishes after eating.", note: "*Na het eten* goes between *was* and the final prefix *af*."}
  nl.a1.unit10.lesson02.teach.contrast: {title: "Verbs that do not split", gloss: "Not separable: I have breakfast. I work. I sleep. No part goes at the end.", note: "*Ontbijten*, *werken* and *slapen* stay as one verb form in these main clauses."}

  nl.a1.unit10.lesson03.teach.get_up_time: {title: "Get up at half past seven", gloss: "I get up at 7:30.", note: "Recall the Dutch clock convention: *half acht* means halfway to eight, so 07:30. *Op* remains at the end."}
  nl.a1.unit10.lesson03.teach.dress_time: {title: "Get dressed at quarter to eight", gloss: "I get dressed at 7:45.", note: "The time comes before the final separable prefix *aan*."}
  nl.a1.unit10.lesson03.teach.breakfast_time: {title: "Have breakfast at eight", gloss: "I have breakfast at eight o'clock.", note: "Use *om* before the time. *Ontbijt* does not split."}
  nl.a1.unit10.lesson03.teach.work_time: {title: "Work from nine to five", gloss: "I work from nine o'clock to five o'clock.", note: "*Van ... tot ...* gives a start and end time."}
  nl.a1.unit10.lesson03.teach.eat_time: {title: "Eat at half past six", gloss: "I eat at 6:30 p.m.", note: "*'s Avonds* makes the evening explicit, so *half zeven* is 18:30 here."}
  nl.a1.unit10.lesson03.teach.sleep_time: {title: "Sleep at eleven", gloss: "I sleep at eleven o'clock.", note: "Use *om* before the time: *om elf uur*."}

  nl.a1.unit10.lesson04.teach.eerst_dan_daarna: {title: "First, then, after that", gloss: "first, then, after that", note: "*Eerst* marks the first activity, *dan* moves to the next, and *daarna* links to what came before.", example_gloss: ["First I get up.", "Then I get dressed.", "After that I have breakfast."]}
  nl.a1.unit10.lesson04.teach.sequence: {title: "A three-step morning", gloss: "First I get up. Then I get dressed. After that I have breakfast.", note: "The separable prefixes still finish their clauses: *sta ik op*; *kleed ik me aan*."}
  nl.a1.unit10.lesson04.teach.sequence_order_note: {title: "Verb before ik", gloss: "After eerst, dan and daarna, the verb comes before ik: Daarna ontbijt ik.", note: "Starting with a sequence word changes *Ik ontbijt* into *Daarna ontbijt ik*."}

  nl.a1.unit10.lesson05.teach.routine_text:
    title: "My day"
    gloss: "My day — I get up at 7:30. After that I get dressed, and at eight I have breakfast. I work from nine to five. At 6:30 p.m. I eat. After that I do the dishes. At eleven I sleep."
    note: "Read for both the order of activities and their times. Notice final *op*, *aan* and *af* in the separable-verb clauses."
    glosses:
      Mijn: "my"
      dag: "day"
      sta: "get up (with op)"
      half: "half TO the next hour (half acht = 7:30)"
      acht: "eight"
      Daarna: "after that"
      kleed: "get dressed (with me ... aan)"
      uur: "o'clock / hour"
      ontbijt: "have breakfast"
      werk: "work"
      negen: "nine"
      vijf: "five"
      zeven: "seven"
      avonds: "in the evening"
      eet: "eat"
      was: "wash up (with af)"
      elf: "eleven"
      slaap: "sleep"

  nl.a1.unit10.lesson06.teach.question: {title: "Asking about a day", gloss: "Lotte: What does your day look like, Omar?", note: "*Hoe ziet jouw dag eruit?* is an informal way to invite someone to describe their day. *Eruitzien* is separable: *ziet ... eruit*."}
  nl.a1.unit10.lesson06.teach.morning: {title: "Omar's morning", gloss: "Omar: I get up at 7:30. After that I get dressed, and at eight I have breakfast.", note: "Omar connects three morning activities and keeps *op* and *aan* at the ends of their clauses."}
  nl.a1.unit10.lesson06.teach.work: {title: "Omar's workday", gloss: "Lotte: What time do you work? Omar: I work from nine to five.", note: "Lotte and Omar use informal *je* with each other."}
  nl.a1.unit10.lesson06.teach.evening: {title: "Omar's evening", gloss: "Omar: At 6:30 p.m. I eat. After that I do the dishes. At eleven I sleep.", note: "Starting with a time or *daarna* puts the verb before *ik*: *eet ik*, *was ik*, *slaap ik*. *Af* remains at the end."}
  nl.a1.unit10.lesson06.teach.lotte: {title: "Lotte's morning", gloss: "Lotte: I get up at six, but I don't have breakfast until 6:30.", note: "*Pas* means not until here. Lotte contrasts her get-up time with her breakfast time -- getting up an hour before her 7:00 shift start (established in unit17)."}

exercises:
  nl.a1.unit10.lesson01.exercise01.choose_ontbijten:
    instruction: "Choose the Dutch verb for 'to have breakfast'."
    correct_option: ontbijten
    distractors: [werken, eten, slapen]
    accepted_answers: [{value: ontbijten, status: correct}]
    feedback: "Ontbijten means to have breakfast."
  nl.a1.unit10.lesson01.exercise02.choose_slapen:
    instruction: "Choose the Dutch verb for 'to sleep'."
    correct_option: slapen
    distractors: [eten, werken, ontbijten]
    accepted_answers: [{value: slapen, status: correct}]
    feedback: "Slapen means to sleep."
  nl.a1.unit10.lesson01.exercise03.listen_breakfast:
    instruction: "Listen and choose the activity you hear."
    correct_option: "have breakfast"
    distractors: [work, eat, sleep]
    accepted_answers: [{value: "have breakfast", status: correct}]
    feedback: "Ik ontbijt means I have breakfast."
  nl.a1.unit10.lesson01.exercise04.match_activities:
    instruction: "Match each Dutch activity to its English meaning."
    accepted_answers: [{"value": [{"left": "ontbijten", "right": "have breakfast"}, {"left": "werken", "right": "work"}, {"left": "eten", "right": "eat"}, {"left": "slapen", "right": "sleep"}, {"left": "opstaan", "right": "get up"}, {"left": "zich aankleden", "right": "get dressed"}, {"left": "afwassen", "right": "do the dishes"}], "status": "correct"}]
    feedback: "These four common verbs do not split in a main clause."
  nl.a1.unit10.lesson01.exercise05.listen_type_sleep:
    instruction: "Listen and type the complete Dutch sentence."
    accepted_answers: [{value: "Ik slaap", status: correct}, {value: "Ik slaap.", status: correct}]
    feedback: "Ik slaap means I sleep."
  nl.a1.unit10.lesson01.exercise06.translate_work:
    instruction: "Translate into Dutch: I work."
    accepted_answers: [{value: "Ik werk", status: correct}, {value: "Ik werk.", status: correct}]
    feedback: "Ik werk."

  nl.a1.unit10.lesson01.exercise07.dictation_ik_ontbijt:
    instruction: "Type what you hear."
    correct_option: "Ik ontbijt"
    accepted_answers: [{value: "Ik ontbijt", status: correct}]
    orthography_strict: true

  nl.a1.unit10.lesson02.exercise01.choose_split:
    instruction: "Choose the correct Dutch sentence."
    correct_option: "Ik sta om zeven uur op."
    distractors: ["Ik opsta om zeven uur.", "Ik sta op om zeven uur.", "Ik staan om zeven uur."]
    accepted_answers: [{value: "Ik sta om zeven uur op.", status: correct}]
    feedback: "Opstaan splits: sta comes after ik and op goes at the end."
  nl.a1.unit10.lesson02.exercise02.listen_get_up:
    instruction: "Listen and choose the activity you hear."
    correct_option: "get up"
    distractors: ["get dressed", "have breakfast", "do the dishes"]
    accepted_answers: [{value: "get up", status: correct}]
    feedback: "Ik sta op means I get up."
  nl.a1.unit10.lesson02.exercise03.match_split_verbs:
    instruction: "Match each infinitive to its split ik sentence."
    accepted_answers:
      - value: [{left: opstaan, right: "Ik sta op"}, {left: "zich aankleden", right: "Ik kleed me aan"}, {left: afwassen, right: "Ik was af"}]
        status: correct
    feedback: "Opstaan, zich aankleden and afwassen all put their prefix at the end."
  nl.a1.unit10.lesson02.exercise04.order_get_dressed:
    instruction: "Put the words in order to say 'I get dressed.'"
    correct_option: "Ik kleed me aan"
    accepted_answers: [{value: "Ik kleed me aan", status: correct}]
    feedback: "Ik kleed me aan."
  nl.a1.unit10.lesson02.exercise05.listen_order_dishes:
    instruction: "Listen and put the words in the order you hear."
    correct_option: "Ik was af"
    accepted_answers: [{value: "Ik was af", status: correct}]
    feedback: "Afwassen splits into was ... af."
  nl.a1.unit10.lesson02.exercise06.fill_prefix:
    instruction: "Complete the sentence with the missing final word."
    accepted_answers: [{value: op, status: correct}]
    feedback: "Ik sta om zeven uur op."
  nl.a1.unit10.lesson02.exercise07.write_dressed:
    instruction: "Translate into Dutch: I get dressed."
    accepted_answers: [{value: "Ik kleed me aan", status: correct}, {value: "Ik kleed me aan.", status: correct}]
    feedback: "Aankleden splits: Ik kleed me aan."

  nl.a1.unit10.lesson03.exercise01.choose_half_eight:
    instruction: "Choose the sentence that says 'I get up at 07:30.'"
    correct_option: "Ik sta om half acht op."
    distractors: ["Ik sta om half zeven op.", "Ik sta om acht uur op.", "Ik ontbijt om half acht."]
    accepted_answers: [{value: "Ik sta om half acht op.", status: correct}]
    feedback: "Half acht is 07:30, and op goes at the end."
  nl.a1.unit10.lesson03.exercise02.listen_get_up_time:
    instruction: "Listen and choose the time when the speaker gets up."
    correct_option: "07:30"
    distractors: ["06:30", "07:00", "08:30"]
    accepted_answers: [{value: "07:30", status: correct}]
    feedback: "Half acht means 07:30."
  nl.a1.unit10.lesson03.exercise03.choose_dress_time:
    instruction: "Choose the sentence that says 'I get dressed at 07:45.'"
    correct_option: "Ik kleed me om kwart voor acht aan."
    distractors: ["Ik kleed me om kwart over acht aan.", "Ik kleed me om half acht aan.", "Ik sta om kwart voor acht op."]
    accepted_answers: [{value: "Ik kleed me om kwart voor acht aan.", status: correct}]
    feedback: "Kwart voor acht is 07:45, and aan finishes the clause."
  nl.a1.unit10.lesson03.exercise04.match_times:
    instruction: "Match each Dutch time to the digital time used in this routine."
    accepted_answers:
      - value: [{left: "half acht", right: "07:30"}, {left: "kwart voor acht", right: "07:45"}, {left: "acht uur", right: "08:00"}, {left: "half zeven", right: "18:30"}]
        status: correct
    feedback: "Remember that Dutch half points forward to the coming hour."
  nl.a1.unit10.lesson03.exercise05.listen_order_dress_time:
    instruction: "Listen and put the words in the order you hear."
    correct_option: "Ik kleed me om kwart voor acht aan"
    accepted_answers: [{value: "Ik kleed me om kwart voor acht aan", status: correct}]
    feedback: "The time comes before the final prefix aan."
  nl.a1.unit10.lesson03.exercise06.speak_get_up:
    instruction: "Say in Dutch that you get up at 07:30."
    accepted_answers: [{value: "Ik sta om half acht op", status: correct}, {value: "Ik sta om half acht op.", status: correct}]
    feedback: "Ik sta om half acht op."
  nl.a1.unit10.lesson03.exercise07.listen_type_work:
    instruction: "Listen and type the complete Dutch sentence."
    accepted_answers: [{value: "Ik werk van negen uur tot vijf uur", status: correct}, {value: "Ik werk van negen uur tot vijf uur.", status: correct}]
    feedback: "Van negen uur tot vijf uur gives the start and end of the workday."

  nl.a1.unit10.lesson04.exercise01.choose_first:
    instruction: "Choose the Dutch word for 'first'."
    correct_option: eerst
    distractors: [dan, daarna, maar]
    accepted_answers: [{value: eerst, status: correct}]
    feedback: "Eerst means first."
  nl.a1.unit10.lesson04.exercise02.choose_after_that:
    instruction: "Choose the Dutch word for 'after that'."
    correct_option: daarna
    distractors: [eerst, dan, voor]
    accepted_answers: [{value: daarna, status: correct}]
    feedback: "Daarna means after that."
  nl.a1.unit10.lesson04.exercise03.listen_sequence:
    instruction: "Listen and choose the correct order of activities."
    correct_option: "get up → get dressed → have breakfast"
    distractors: ["get dressed → get up → have breakfast", "have breakfast → get up → get dressed", "get up → have breakfast → get dressed"]
    accepted_answers: [{value: "get up → get dressed → have breakfast", status: correct}]
    feedback: "Eerst, dan and daarna mark the three steps."
  nl.a1.unit10.lesson04.exercise04.match_sequence:
    instruction: "Match each Dutch sequence word to its English meaning."
    accepted_answers:
      - value: [{left: eerst, right: first}, {left: dan, right: then}, {left: daarna, right: "after that"}]
        status: correct
    feedback: "Use these words to connect a short routine."
  nl.a1.unit10.lesson04.exercise05.order_after_breakfast:
    instruction: "Put the words in order to say 'After that I have breakfast.'"
    correct_option: "Daarna ontbijt ik"
    accepted_answers: [{value: "Daarna ontbijt ik", status: correct}]
    feedback: "After daarna, the verb ontbijt comes before ik."
  nl.a1.unit10.lesson04.exercise06.write_sequence:
    instruction: "Write three Dutch routine sentences. Use eerst, dan and daarna once each."
    accepted_answers:
      - {value: "Eerst sta ik op. Dan kleed ik me aan. Daarna ontbijt ik.", status: correct}
      - {value: "Eerst sta ik op Dan kleed ik me aan Daarna ontbijt ik", status: correct}
    feedback: "One model is: Eerst sta ik op. Dan kleed ik me aan. Daarna ontbijt ik."

  nl.a1.unit10.lesson05.exercise01.read_first_activity:
    instruction: "Read the routine and choose Omar's first activity."
    correct_option: "he gets up"
    distractors: ["he gets dressed", "he has breakfast", "he starts work"]
