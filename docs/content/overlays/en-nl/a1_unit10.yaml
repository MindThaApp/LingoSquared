      - {value: "Ik sta om half acht op. Daarna ontbijt ik om acht uur. Ik werk van negen uur tot vijf uur. Om elf uur slaap ik.", status: correct}
    feedback: "Use short clauses, om before a clock time, and a sequence word to connect the activities."

  nl.a1.unit10.lesson06.exercise01.listen_question:
    instruction: "Listen and choose what Lotte asks Omar to describe."
    correct_option: "his day"
    distractors: ["his family", "his route", "his breakfast order"]
    accepted_answers: [{value: "his day", status: correct}]
