course:
  title: Dutch B2
  description: >-
    Upper-intermediate Dutch: recount a complex sequence of events with
    shifting time reference -- set the background with the imperfectum,
    report the foregrounded event with the perfectum, and mark what had
    happened even earlier with de plusquamperfectum -- while keeping the
    timeline unambiguous with toen, terwijl, als/wanneer and the sequence
    markers eerst / daarna / vervolgens / uiteindelijk, around the everyday
    incident of missing a train because of an earlier mishap.

units:
  nl.b2.unit04.verhaal:
    title: "Telling a story"
    description: Recount a complex everyday incident with shifting time reference -- paint the background, report the main event, and mark what had already happened before it, keeping the true order clear even when you tell it out of sequence.

lessons:
  nl.b2.unit04.lesson01.achtergrond:
    title: "The background: how things were"
  nl.b2.unit04.lesson02.gebeurtenis:
    title: "The event and the order"
  nl.b2.unit04.lesson03.toen_terwijl:
    title: "When, while, whenever"
  nl.b2.unit04.lesson04.plusquamperfectum:
    title: "The past before the past"
  nl.b2.unit04.lesson05.verhaal_lezen:
    title: "What happened first?"
  nl.b2.unit04.lesson06.verhaal_vertellen:
    title: "Telling the whole story"

teaching:
  nl.b2.unit04.lesson01.teach.ik_was_moe:
    title: "I was tired."
    gloss: "I was tired."
    note: "*Was* is the imperfectum (simple past) of *zijn*. Dutch uses the imperfectum to paint the BACKGROUND of a story -- how things were -- not the events that then happened."
  nl.b2.unit04.lesson01.teach.die_ochtend:
    title: "that morning"
    gloss: "that morning"
    note: "*Die ochtend* sets the time frame of the whole story. It pairs with an imperfectum verb to describe the scene: *Die ochtend regende het*."
    example_gloss: "That morning I was tired."
  nl.b2.unit04.lesson01.teach.regenen:
    title: "to rain"
    gloss: "to rain"
    note: "*Regenen* = 'to rain'; imperfectum *het regende* ('it was raining / it rained'). Weather is classic background -- it sets the scene rather than moving the story forward."
    example_gloss: "It was raining that morning."
  nl.b2.unit04.lesson01.teach.buiten:
    title: "outside"
    gloss: "outside / outdoors"
    note: "*Buiten* = 'outside'. Note the Dutch inversion when it opens: *Buiten regende het* ('outside it was raining')."
    example_gloss: "Outside it was raining."
  nl.b2.unit04.lesson01.teach.koud:
    title: "cold"
    gloss: "cold"
    note: "*Koud* = 'cold'. Another background detail: *Het was koud buiten* ('it was cold outside')."
    example_gloss: "It was cold outside."
  nl.b2.unit04.lesson01.teach.haast:
    title: "hurry"
    gloss: "hurry / haste"
    note: "*Haast hebben* = 'to be in a hurry'. In the past: *Ik had haast* ('I was in a hurry') -- *had* is the imperfectum of *hebben*. Still background: it describes your state, not an event."
    example_gloss: "I was in a hurry."
  nl.b2.unit04.lesson01.teach.nog_donker:
    title: "It was still dark."
    gloss: "It was still dark."
    note: "*Nog* = 'still'; *donker* = 'dark'. One more scene-setting line in the imperfectum."
  nl.b2.unit04.lesson01.teach.grammar_imperfectum:
    title: "It was raining. I was tired. I was in a hurry."
    gloss: "It was raining. I was tired. I was in a hurry."
    note: "The BACKGROUND of a story goes in the imperfectum (*regende*, *was*, *had*) -- the weather, your mood, the setting. These are not the events; they are the stage the events happen on. The next lesson brings the events."

  nl.b2.unit04.lesson02.teach.trein_missen:
    title: "to miss the train"
    gloss: "to miss the train"
    note: "*De trein missen* = 'to miss the train'; past participle *gemist*. This is the main EVENT of the story -- what actually happened."
  nl.b2.unit04.lesson02.teach.heb_gemist:
    title: "I missed the train."
    gloss: "I missed the train."
    note: "The FOREGROUND event goes in the perfectum: *heb* + participle *gemist*. Dutch prefers the perfectum (*ik heb ... gemist*) over the imperfectum for reporting a single completed event in speech."
  nl.b2.unit04.lesson02.teach.te_laat_gekomen:
    title: "I arrived too late."
    gloss: "I arrived / came too late."
    note: "*Komen* takes *zijn*, not *hebben*, in the perfectum: *ik ben ... gekomen*. *Te laat* = 'too late'. Verbs of motion/change take *ben/is/was* as their auxiliary."
  nl.b2.unit04.lesson02.teach.eerst:
    title: "first"
    gloss: "first / at first"
    note: "*Eerst* orders the events -- the first thing that happened. Opening with it inverts the verb: *Eerst regende het*."
    example_gloss: "First it was raining."
  nl.b2.unit04.lesson02.teach.daarna:
    title: "then"
    gloss: "then / after that"
    note: "*Daarna* = 'after that' -- the next thing in the sequence. *Eerst ..., daarna ...* is the backbone of an ordered account."
    example_gloss: "After that I was in a hurry."
  nl.b2.unit04.lesson02.teach.vervolgens:
    title: "next"
    gloss: "next / subsequently"
    note: "*Vervolgens* is a slightly more formal 'next / then' -- another step in the chain, interchangeable with *daarna* in most narration."
    example_gloss: "Next I was too late."
  nl.b2.unit04.lesson02.teach.uiteindelijk:
    title: "in the end"
    gloss: "in the end / eventually"
    note: "*Uiteindelijk* marks the final outcome of the sequence: *Uiteindelijk heb ik de trein gemist* ('in the end I missed the train')."
    example_gloss: "In the end I missed the train."
  nl.b2.unit04.lesson02.teach.grammar_perfectum:
    title: "I was tired. I was in a hurry. In the end I missed the train."
    gloss: "I was tired. I was in a hurry. In the end I missed the train."
    note: "Background vs foreground: the imperfectum (*was*, *had*) sets the scene; the perfectum (*heb ... gemist*) reports the event that actually moved the story. Sequence words (*eerst*, *daarna*, *vervolgens*, *uiteindelijk*) keep the events in order."

  nl.b2.unit04.lesson03.teach.station:
    title: "the station"
    gloss: "the (train) station"
    note: "*Het station* = 'the station'. *Op het station* = 'at the station' -- Dutch says 'on' the station."
    example_gloss: "I was at the station."
  nl.b2.unit04.lesson03.teach.aankomen:
    title: "to arrive"
    gloss: "to arrive"
    note: "*Aankomen* is a separable verb: *ik kwam ... aan* ('I arrived'). The prefix *aan* jumps to the end of the clause."
    example_gloss: "I arrived at the station."
  nl.b2.unit04.lesson03.teach.vertrekken:
    title: "to leave / depart"
    gloss: "to leave / depart"
    note: "*Vertrekken* = 'to leave / depart' (of a train, a person); imperfectum *vertrok*. *Net* = 'just (now)': *De trein vertrok net* ('the train was just leaving')."
    example_gloss: "The train was just leaving."
  nl.b2.unit04.lesson03.teach.toen:
    title: "When I arrived at the station, the train was just leaving."
    gloss: "When I arrived at the station, the train was just leaving."
    note: "*Toen* = 'when' for a SINGLE moment in the past -- one event interrupting or coinciding with another. It sends its own verb to the end (*...aankwam*) and inverts the main clause (*vertrok de trein*). Use *toen* only for the past, and only for one specific time."
  nl.b2.unit04.lesson03.teach.baas:
    title: "the boss"
    gloss: "the boss"
    note: "*De baas* = 'the boss'; *mijn baas* = 'my boss'."
    example_gloss: "My boss was in a hurry."
  nl.b2.unit04.lesson03.teach.aankleden:
    title: "to get dressed"
    gloss: "to get dressed"
    note: "*Zich aankleden* is reflexive: *ik kleed me aan* / imperfectum *ik kleedde me aan* ('I got dressed'). The reflexive *me* stays with the verb."
    example_gloss: "I was getting dressed."
  nl.b2.unit04.lesson03.teach.bellen:
    title: "to call (on the phone)"
    gloss: "to call / phone"
    note: "*Bellen* = 'to call (by phone)'; imperfectum *belde*. *Mijn baas belde* = 'my boss called'."
    example_gloss: "My boss called."
  nl.b2.unit04.lesson03.teach.terwijl:
    title: "While I was getting dressed, my boss called."
    gloss: "While I was getting dressed, my boss called."
    note: "*Terwijl* = 'while' -- two actions going on at the SAME time, one ongoing (*me aankleedde*) as another happens (*belde*). Like *toen*, it sends its verb to the end and the main clause inverts."
  nl.b2.unit04.lesson03.teach.als_wanneer:
    title: "When(ever) I'm late, I always call my boss."
    gloss: "When(ever) I'm late, I always call my boss."
    note: "For a HABIT or a general rule ('whenever'), Dutch uses *als* (or *wanneer*), NOT *toen*. *Toen* is only for one specific past moment; *als/wanneer* is for repeated or timeless situations: *Als ik te laat ben, bel ik altijd mijn baas*."
  nl.b2.unit04.lesson03.teach.grammar_toen_terwijl:
    title: "When I arrived, the train left. While I was getting dressed, my boss called. Whenever I'm late, I always call."
    gloss: "When I arrived, the train left. While I was getting dressed, my boss called. Whenever I'm late, I always call."
    note: "Three 'when's, three jobs: *toen* = one past moment (interruption); *terwijl* = two things at once (ongoing); *als/wanneer* = a habit or general rule. Choosing *als* for a one-time past event is the classic mistake -- there it must be *toen*."

  nl.b2.unit04.lesson04.teach.niet:
    title: "not"
    gloss: "not"
    note: "*Niet* negates a verb or clause. You need it for the pre-past cause of this story: *Ik had mijn wekker niet gezet* ('I hadn't set my alarm')."
    example_gloss: "I wasn't tired."
  nl.b2.unit04.lesson04.teach.wekker_zetten:
    title: "to set the alarm"
    gloss: "to set the alarm (clock)"
    note: "*De wekker zetten* = 'to set the alarm'; past participle *gezet*. *De wekker* is the alarm clock itself."
  nl.b2.unit04.lesson04.teach.plusquam_wekker:
    title: "I hadn't set my alarm."
    gloss: "I hadn't set my alarm."
    note: "De plusquamperfectum (past perfect): *had* + participle *gezet*. It marks an event that happened BEFORE another past event -- here, before you overslept and missed the train. English: 'I HAD not set...'. Dutch sends the participle to the end."
  nl.b2.unit04.lesson04.teach.avond_ervoor:
    title: "the evening before"
    gloss: "the evening before"
    note: "*De avond ervoor* = 'the evening before' -- a time expression that points back before the day of the story, the natural home of de plusquamperfectum."
    example_gloss: "The evening before, I was tired."
  nl.b2.unit04.lesson04.teach.al_vertrokken:
    title: "The train had already left."
    gloss: "The train had already left."
    note: "*Vertrekken* takes *zijn*, so its plusquamperfectum uses *was*: *was ... vertrokken*. *Al* = 'already' -- the train's departure had happened before you arrived."
  nl.b2.unit04.lesson04.teach.voordat:
    title: "before"
    gloss: "before (conjunction)"
    note: "*Voordat* = 'before' joining two clauses: *Voordat ik vertrok, regende het*. It orders events in time."
    example_gloss: "Before I left, it was raining."
  nl.b2.unit04.lesson04.teach.nadat:
    title: "after"
    gloss: "after (conjunction)"
    note: "*Nadat* = 'after' joining two clauses. It pairs naturally with de plusquamperfectum for the earlier action: the thing after *nadat* happened first."
    example_gloss: "After the train had left, I arrived."
  nl.b2.unit04.lesson04.teach.tegen_de_tijd_dat:
    title: "By the time I arrived, the train had already left."
    gloss: "By the time I arrived, the train had already left."
    note: "*Tegen de tijd dat* = 'by the time (that)' -- it sets a moment and lets you say what had ALREADY happened by then, with de plusquamperfectum (*was ... vertrokken*)."
  nl.b2.unit04.lesson04.teach.grammar_plusquam:
    title: "I hadn't set my alarm. The train had already left."
    gloss: "I hadn't set my alarm. The train had already left."
    note: "De plusquamperfectum = *had/was* + past participle. Use it for the past-before-the-past: an event finished BEFORE another past event. Pick *had* or *was* by the verb, exactly as in a normal perfect tense (*had gezet*, but *was vertrokken*)."

  nl.b2.unit04.lesson05.teach.tekst:
    title: "Reading: how I missed the train"
    gloss: "In the end I missed the train. When I arrived at the station, the train had already left. It was raining that morning and I was in a hurry. But this had started earlier: the evening before, I hadn't set my alarm. As a result, I woke up too late."
    glosses:
      Uiteindelijk: "in the end / eventually"
      trein: "train"
      gemist: "missed (past participle of missen)"
      Toen: "when (a single moment in the past)"
      station: "(train) station"
      aankwam: "arrived (past of aankomen)"
      al: "already"
      vertrokken: "departed / left (past participle of vertrekken)"
      regende: "was raining (past of regenen)"
      ochtend: "morning"
      haast: "hurry / haste (had haast = was in a hurry)"
      Maar: "but"
      eerder: "earlier"
      begonnen: "begun / started (past participle of beginnen)"
      avond: "evening"
      ervoor: "before (that); de avond ervoor = the evening before"
      wekker: "alarm clock"
      gezet: "set (past participle of zetten)"
      Daardoor: "as a result / because of that"
      werd: "became / got (past of worden)"
      laat: "late"
      wakker: "awake (werd ... wakker = woke up)"

  nl.b2.unit04.lesson06.teach.vanochtend:
    title: "this morning"
    gloss: "this morning"
    note: "*Vanochtend* = 'this morning' -- the morning of the day you are speaking. *Ik was vanochtend moe* = 'I was tired this morning'."
    example_gloss: "I was tired this morning."
  nl.b2.unit04.lesson06.teach.je:
    title: "you (informal)"
    gloss: "you (informal)"
    note: "*Je* (stressed *jij*) is the informal 'you' Lotte and Omar use with each other. *Je had haast* = 'you were in a hurry'."
    example_gloss: "You were in a hurry."
  nl.b2.unit04.lesson06.teach.waarom:
    title: "why"
    gloss: "why"
    note: "*Waarom* = 'why'; *zo* = 'so'. *Waarom was je zo laat?* = 'why were you so late?' -- the question that opens the recount."
    example_gloss: "Why were you so late?"
  nl.b2.unit04.lesson06.teach.hij:
    title: "he / it"
    gloss: "he / it"
    note: "*Hij* = 'he', and also 'it' for a masculine noun like *de trein*: *Hij was al vertrokken* here means 'it (the train) had already left'."
    example_gloss: "It had already left."
  nl.b2.unit04.lesson06.teach.verslapen:
    title: "I had overslept."
    gloss: "I had overslept."
    note: "*Zich verslapen* = 'to oversleep' (reflexive). In de plusquamperfectum with *had*: *Ik had me verslapen* -- it happened before you missed the train."
  nl.b2.unit04.lesson06.teach.gebeuren:
    title: "to happen"
    gloss: "to happen"
    note: "*Gebeuren* = 'to happen'; participle *gebeurd*, taking *zijn*: *Dat was eerder gebeurd* ('that had happened earlier') -- de plusquamperfectum again."
    example_gloss: "That had happened earlier."
  nl.b2.unit04.lesson06.teach.miste:
    title: "then you missed the train"
    gloss: "then you missed the train"
    note: "*Miste* is the imperfectum of *missen* ('missed'). Here Lotte re-tells the order: *daarna miste je de trein* ('after that you missed the train')."
  nl.b2.unit04.lesson06.teach.precies:
    title: "exactly"
    gloss: "exactly / precisely"
    note: "*Precies* = 'exactly' -- Omar confirms Lotte has the order right."
    example_gloss: "That's exactly right."
  nl.b2.unit04.lesson06.teach.dialogue_lotte_open:
    title: "Lotte: Why were you so late this morning?"
    gloss: "Lotte: Why were you so late this morning?"
  nl.b2.unit04.lesson06.teach.dialogue_omar_outcome:
    title: "Omar: I missed the train. When I arrived at the station, it had already left."
    gloss: "Omar: I missed the train. When I arrived at the station, it had already left."
  nl.b2.unit04.lesson06.teach.dialogue_lotte_why:
    title: "Lotte: And why were you too late for the station?"
    gloss: "Lotte: And why were you too late for the station?"
  nl.b2.unit04.lesson06.teach.dialogue_omar_prepast:
    title: "Omar: I had overslept. The evening before, I hadn't set my alarm."
    gloss: "Omar: I had overslept. The evening before, I hadn't set my alarm."
  nl.b2.unit04.lesson06.teach.dialogue_lotte_order:
    title: "Lotte: So that had happened first, and then you missed the train."
    gloss: "Lotte: So that had happened first, and then you missed the train."
    note: "*Dus* = 'so / therefore' -- Lotte draws the timeline together, putting the pre-past cause (*was eerst gebeurd*) before the outcome (*daarna miste je de trein*)."
  nl.b2.unit04.lesson06.teach.dialogue_omar_confirm:
    title: "Omar: Exactly. First the alarm, then the train."
    gloss: "Omar: Exactly. First the alarm, then the train."
  nl.b2.unit04.lesson06.teach.grammar_volledig_verhaal:
    title: "It was raining that morning. The evening before, I hadn't set my alarm. In the end I missed the train."
    gloss: "It was raining that morning. The evening before, I hadn't set my alarm. In the end I missed the train."
    note: "A full recount stacks three time layers: BACKGROUND in the imperfectum (*regende*), a PRE-PAST cause in de plusquamperfectum (*had ... gezet*), and the FOREGROUND outcome in the perfectum (*heb ... gemist*). Telling it out of order is fine as long as these markers keep the true sequence clear -- exactly what you produce in this lesson's speaking and writing tasks."

exercises:
  nl.b2.unit04.lesson01.exercise01.recognize_regende:
    instruction: "What does this word mean?"
    correct_option: "was raining"
    distractors: [departed, arrived, called]
    accepted_answers: [{value: "was raining", status: correct}]
    feedback: "Het regende means it was raining -- the imperfectum, painting the background of the story."
  nl.b2.unit04.lesson01.exercise02.listen_regende:
    instruction: "Listen and select what you hear."
    correct_option: "It was raining that morning."
    distractors: ["It was cold that morning.", "It was raining this evening.", "It was still dark that morning."]
    accepted_answers: [{value: "It was raining that morning.", status: correct}]
    feedback: "Het regende die ochtend means it was raining that morning."
  nl.b2.unit04.lesson01.exercise03.match_background_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {"die ochtend": "that morning", regenen: "to rain", moe: tired, koud: cold, buiten: outside, haast: "hurry / haste"}
        status: correct
    feedback: "These are the background words -- the weather, your state, the setting -- all in the imperfectum when you tell the story."
  nl.b2.unit04.lesson01.exercise04.order_nog_donker:
    instruction: "Put the words in order: It was still dark."
    accepted_answers:
      - {value: "Het was nog donker", status: correct}
    feedback: "Het was nog donker means it was still dark -- another background line in the imperfectum."
  nl.b2.unit04.lesson01.exercise05.translate_regende:
    instruction: "Translate into Dutch, setting the background scene with the imperfectum: It was raining that morning."
    accepted_answers:
      - {value: "Het regende die ochtend", status: correct}
      - {value: "Die ochtend regende het", status: correct}
    feedback: "Het regende die ochtend means it was raining that morning."
  nl.b2.unit04.lesson01.exercise06.write_ik_was_moe:
    instruction: "Write in Dutch, using the imperfectum for background: I was tired."
    accepted_answers:
      - {value: "Ik was moe", status: correct}
    feedback: "Ik was moe means I was tired."
  nl.b2.unit04.lesson01.exercise07.speak_haast:
    instruction: "Say aloud in Dutch, using the imperfectum: I was in a hurry."
    accepted_answers:
      - {value: "Ik had haast", status: correct}
    feedback: "Ik had haast means I was in a hurry -- had is the imperfectum of hebben."
  nl.b2.unit04.lesson01.exercise08.dictation_regende_ochtend:
    instruction: "Type what you hear."
    correct_response: "Het regende die ochtend"
    orthography_strict: true
    feedback: "You heard Het regende die ochtend — it was raining that morning."

  nl.b2.unit04.lesson02.exercise01.recognize_gemist:
    instruction: "What does this word mean?"
    correct_option: missed
    distractors: [departed, arrived, overslept]
    accepted_answers: [{value: missed, status: correct}]
    feedback: "Gemist is the past participle of missen -- 'missed', as in de trein gemist."
  nl.b2.unit04.lesson02.exercise02.listen_trein_gemist:
    instruction: "Listen and select what you hear."
    correct_option: "I missed the train."
    distractors: ["I caught the train.", "I missed the bus.", "I arrived too late."]
    accepted_answers: [{value: "I missed the train.", status: correct}]
    feedback: "Ik heb de trein gemist means I missed the train -- the perfectum for the completed event."
  nl.b2.unit04.lesson02.exercise03.match_sequence_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {eerst: first, daarna: "then / after that", uiteindelijk: "in the end / eventually", "de trein": "the train", "te laat": "too late", gemist: missed}
        status: correct
    feedback: "These order the events: eerst, then daarna, and uiteindelijk for the final outcome."
  nl.b2.unit04.lesson02.exercise04.order_te_laat_gekomen:
    instruction: "Put the words in order: I arrived too late."
    accepted_answers:
      - {value: "Ik ben te laat gekomen", status: correct}
    feedback: "Ik ben te laat gekomen means I arrived too late -- komen takes ben, not heb."
  nl.b2.unit04.lesson02.exercise05.translate_heb_gemist:
    instruction: "Translate into Dutch, using the perfectum for the completed event: I missed the train."
    accepted_answers:
      - {value: "Ik heb de trein gemist", status: correct}
    feedback: "Ik heb de trein gemist means I missed the train."
  nl.b2.unit04.lesson02.exercise08.dictation_trein_gemist:
    instruction: "Type what you hear."
    correct_response: "Ik heb de trein gemist"
    orthography_strict: true
    feedback: "You heard Ik heb de trein gemist — I missed the train."
  nl.b2.unit04.lesson02.exercise06.write_uiteindelijk:
    instruction: "Write in Dutch, starting with Uiteindelijk (and inverting the verb): In the end I missed the train."
    accepted_answers:
      - {value: "Uiteindelijk heb ik de trein gemist", status: correct}
    feedback: "Uiteindelijk heb ik de trein gemist means in the end I missed the train."
  nl.b2.unit04.lesson02.exercise07.write_vervolgens:
    instruction: "Write in Dutch, starting with Vervolgens (and inverting the verb), using the imperfectum: After that I was in a hurry."
    accepted_answers:
      - {value: "Vervolgens had ik haast", status: correct}
    feedback: "Vervolgens had ik haast means after that I was in a hurry."

  nl.b2.unit04.lesson03.exercise01.recognize_toen:
    instruction: "In a past story, what does this word signal?"
    correct_option: "when (a single moment in the past)"
    distractors: ["whenever (a habit)", "while (at the same time)", "before"]
    accepted_answers: [{value: "when (a single moment in the past)", status: correct}]
    feedback: "Toen marks one specific moment in the past -- the moment one event interrupts or meets another."
  nl.b2.unit04.lesson03.exercise02.listen_toen_aankwam:
    instruction: "Listen and select what you hear."
    correct_option: "When I arrived at the station, the train was just leaving."
    distractors: ["While I arrived at the station, the train left.", "When I left the station, the train arrived.", "When I arrived at the station, the train had left."]
    accepted_answers: [{value: "When I arrived at the station, the train was just leaving.", status: correct}]
    feedback: "Toen ik op het station aankwam, vertrok de trein net -- toen marks the single past moment, and net means 'just'."
  nl.b2.unit04.lesson03.exercise03.match_time_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {toen: "when (a single past moment)", terwijl: "while (at the same time)", wanneer: "whenever (a habit)", aankomen: "to arrive", vertrekken: "to leave / depart", bellen: "to call (phone)", "het station": "the station", "de baas": "the boss"}
        status: correct
    feedback: "Three 'when's do different jobs: toen (one past moment), terwijl (at the same time), wanneer (a habit)."
  nl.b2.unit04.lesson03.exercise04.order_vertrok_net:
    instruction: "Put the words in order: The train was just leaving."
    accepted_answers:
      - {value: "De trein vertrok net", status: correct}
    feedback: "De trein vertrok net means the train was just leaving -- net is 'just (now)'."
  nl.b2.unit04.lesson03.exercise05.translate_toen:
    instruction: "Translate into Dutch, using toen for the single past interruption, and inverting after the comma: When I arrived at the station, the train was just leaving."
    accepted_answers:
      - {value: "Toen ik op het station aankwam, vertrok de trein net", status: correct}
      - {value: "Toen ik op het station aankwam vertrok de trein net", status: correct}
    feedback: "Toen ik op het station aankwam, vertrok de trein net -- toen sends its verb to the end and the main clause inverts."
  nl.b2.unit04.lesson03.exercise06.translate_terwijl:
    instruction: "Translate into Dutch, using terwijl for the ongoing action, and inverting after the comma: While I was getting dressed, my boss called."
    accepted_answers:
      - {value: "Terwijl ik me aankleedde, belde mijn baas", status: correct}
      - {value: "Terwijl ik me aankleedde belde mijn baas", status: correct}
      - {value: "Terwijl ik me aan het aankleden was, belde mijn baas", status: correct}
      - {value: "Terwijl ik me aan het aankleden was belde mijn baas", status: correct}
    feedback: "Terwijl ik me aankleedde, belde mijn baas -- terwijl marks two things happening at once."
  nl.b2.unit04.lesson03.exercise07.write_als_habit:
    instruction: "Write in Dutch, using als for a HABIT (not a one-time past event): When(ever) I'm late, I always call my boss."
    accepted_answers:
      - {value: "Als ik te laat ben, bel ik altijd mijn baas", status: correct}
      - {value: "Als ik te laat ben bel ik altijd mijn baas", status: correct}
      - {value: "Als ik te laat ben, bel ik mijn baas altijd", status: correct}
      - {value: "Als ik te laat ben bel ik mijn baas altijd", status: correct}
    feedback: "Als ik te laat ben, bel ik altijd mijn baas -- als (not toen) marks a habit or general rule."

  nl.b2.unit04.lesson04.exercise01.recognize_gezet:
    instruction: "What does this word mean?"
    correct_option: "set (past participle)"
    distractors: [departed, forgotten, arrived]
    accepted_answers: [{value: "set (past participle)", status: correct}]
    feedback: "Gezet is the past participle of zetten -- 'set', as in de wekker gezet."
  nl.b2.unit04.lesson04.exercise02.listen_wekker:
    instruction: "Listen and select what you hear."
    correct_option: "I hadn't set my alarm."
    distractors: ["I didn't set my alarm.", "I had set my alarm.", "I hadn't heard my alarm."]
    accepted_answers: [{value: "I hadn't set my alarm.", status: correct}]
    feedback: "Ik had mijn wekker niet gezet means I hadn't set my alarm -- de plusquamperfectum, an event before another past event."
  nl.b2.unit04.lesson04.exercise03.match_prepast_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {voordat: before, nadat: after, "tegen de tijd dat": "by the time (that)", al: already, "de wekker": "the alarm clock", "de avond ervoor": "the evening before", gezet: "set (past participle)", vertrokken: "left / departed"}
        status: correct
    feedback: "These build the past-before-the-past: voordat, nadat and tegen de tijd dat frame it, and al marks what had already happened."
  nl.b2.unit04.lesson04.exercise04.order_al_vertrokken:
    instruction: "Put the words in order: The train had already left."
    accepted_answers:
      - {value: "De trein was al vertrokken", status: correct}
    feedback: "De trein was al vertrokken means the train had already left -- vertrekken takes was in de plusquamperfectum."
  nl.b2.unit04.lesson04.exercise05.translate_wekker:
    instruction: "Translate into Dutch, using de plusquamperfectum (had ... ge-): I hadn't set my alarm."
    accepted_answers:
      - {value: "Ik had mijn wekker niet gezet", status: correct}
    feedback: "Ik had mijn wekker niet gezet means I hadn't set my alarm."
  nl.b2.unit04.lesson04.exercise06.write_al_vertrokken:
    instruction: "Write in Dutch, using de plusquamperfectum with was (was ... vertrokken): The train had already left."
    accepted_answers:
      - {value: "De trein was al vertrokken", status: correct}
    feedback: "De trein was al vertrokken means the train had already left."
  nl.b2.unit04.lesson04.exercise07.translate_tegen_de_tijd:
    instruction: "Translate into Dutch, using tegen de tijd dat and de plusquamperfectum, and inverting after the comma: By the time I arrived, the train had already left."
    accepted_answers:
      - {value: "Tegen de tijd dat ik aankwam, was de trein al vertrokken", status: correct}
      - {value: "Tegen de tijd dat ik aankwam was de trein al vertrokken", status: correct}
    feedback: "Tegen de tijd dat ik aankwam, was de trein al vertrokken -- by the moment you arrived, the departure had already happened."

  nl.b2.unit04.lesson05.exercise01.read_earliest:
    instruction: "The story is told out of order. Which event happened FIRST of all -- the earliest in time?"
    correct_option: "He hadn't set his alarm the evening before."
    distractors: ["He missed the train.", "He arrived at the station.", "It was raining."]
    accepted_answers: [{value: "He hadn't set his alarm the evening before.", status: correct}]
    feedback: "De avond ervoor had ik mijn wekker niet gezet -- the plusquamperfectum marks this as the earliest event, before everything else."
  nl.b2.unit04.lesson05.exercise02.read_result:
    instruction: "What was the direct result of not having set the alarm?"
    correct_option: "He woke up too late."
    distractors: ["He missed the bus.", "It started raining.", "His boss called."]
    accepted_answers: [{value: "He woke up too late.", status: correct}]
    feedback: "Daardoor werd ik te laat wakker -- daardoor ('as a result') links the unset alarm to waking up too late."
  nl.b2.unit04.lesson05.exercise03.read_outcome:
    instruction: "What does the writer present as the final outcome of the story?"
    correct_option: "He missed the train."
    distractors: ["He overslept.", "He arrived at the station.", "It was raining."]
    accepted_answers: [{value: "He missed the train.", status: correct}]
    feedback: "Uiteindelijk heb ik de trein gemist -- the outcome the writer states first but which happened last."
  nl.b2.unit04.lesson05.exercise04.read_prepast:
    instruction: "When the writer reached the station, what had ALREADY happened before that?"
    correct_option: "The train had already left."
    distractors: ["The train had not arrived yet.", "His boss had called.", "He had set his alarm."]
    accepted_answers: [{value: "The train had already left.", status: correct}]
    feedback: "Toen ik op het station aankwam, was de trein al vertrokken -- was ... vertrokken marks the departure as already complete."
  nl.b2.unit04.lesson05.exercise05.match_reading_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {maar: but, en: and, eerder: earlier, daardoor: "because of that / as a result", wakker: awake, begonnen: "begun / started"}
        status: correct
    feedback: "These are the reading's linking words -- eerder and daardoor are what let you re-order the story in time."
  nl.b2.unit04.lesson05.exercise06.translate_regende_haast:
    instruction: "Translate into Dutch, joining two background clauses with en: It was raining that morning and I was in a hurry."
    accepted_answers:
      - {value: "Het regende die ochtend en ik had haast", status: correct}
      - {value: "Die ochtend regende het en ik had haast", status: correct}
    feedback: "Het regende die ochtend en ik had haast means it was raining that morning and I was in a hurry."
  nl.b2.unit04.lesson05.exercise07.write_daardoor:
    instruction: "Write in Dutch, starting with Daardoor (and inverting the verb): As a result, I woke up too late."
    accepted_answers:
      - {value: "Daardoor werd ik te laat wakker", status: correct}
      - {value: "Daardoor ben ik te laat wakker geworden", status: correct}
    feedback: "Daardoor werd ik te laat wakker means as a result I woke up too late."

  nl.b2.unit04.lesson06.exercise01.comprehend_earliest:
    instruction: "Omar tells the story out of order. In the TRUE sequence, which event happened FIRST of all?"
    correct_option: "He hadn't set his alarm the night before."
    distractors: ["He missed the train.", "He arrived at the station.", "He overslept."]
    accepted_answers: [{value: "He hadn't set his alarm the night before.", status: correct}]
    feedback: "De avond ervoor had ik mijn wekker niet gezet -- the plusquamperfectum marks the unset alarm as the earliest event of all."
  nl.b2.unit04.lesson06.exercise02.comprehend_last:
    instruction: "In the TRUE sequence of events, which happened LAST?"
    correct_option: "He missed the train."
    distractors: ["He overslept.", "He set his alarm.", "He got dressed."]
    accepted_answers: [{value: "He missed the train.", status: correct}]
    feedback: "Ik heb de trein gemist -- the outcome Omar states first but which actually came last in time."
  nl.b2.unit04.lesson06.exercise03.comprehend_prepast:
    instruction: "When Omar reached the station, what had ALREADY happened by that time?"
    correct_option: "The train had already left."
    distractors: ["The train had not arrived yet.", "His boss had called.", "It had started raining."]
    accepted_answers: [{value: "The train had already left.", status: correct}]
    feedback: "Toen ik op het station aankwam, was hij al vertrokken -- was al vertrokken marks the train's departure as already complete when he arrived."
  nl.b2.unit04.lesson06.exercise04.order_verslapen:
    instruction: "Put the words in order: I had overslept."
    accepted_answers:
      - {value: "Ik had me verslapen", status: correct}
    feedback: "Ik had me verslapen means I had overslept -- de plusquamperfectum for the cause before the cause."
  nl.b2.unit04.lesson06.exercise05.speak_recount:
    instruction: "Recount the incident aloud in two sentences, with the time layers marked. (1) The background, using the imperfectum joined with en: It was raining and I was in a hurry. (2) A foregrounded event with something that had already happened, using toen and de plusquamperfectum: When I arrived at the station, the train had already left."
    accepted_answers:
      - {value: "Het regende en ik had haast. Toen ik op het station aankwam, was de trein al vertrokken.", status: correct}
      - {value: "Het regende en ik had haast. Toen ik op het station aankwam, was de trein al vertrokken", status: correct}
      - {value: "Het regende en ik had haast. Toen ik op het station aankwam was de trein al vertrokken.", status: correct}
      - {value: "Het regende en ik had haast. Toen ik op het station aankwam was de trein al vertrokken", status: correct}
    feedback: "Het regende en ik had haast (background). Toen ik op het station aankwam, was de trein al vertrokken (an event with a pre-past inside it)."
  nl.b2.unit04.lesson06.exercise06.write_full_account:
    instruction: "Write a short three-sentence account of why you were late, with all three time layers. (1) The background, using the imperfectum: It was raining that morning. (2) A PRE-PAST cause, using de plusquamperfectum (had ... ge-): The evening before, I hadn't set my alarm. (3) The foreground outcome, using the perfectum with uiteindelijk: In the end I missed the train."
    accepted_answers:
      - {value: "Het regende die ochtend. De avond ervoor had ik mijn wekker niet gezet. Uiteindelijk heb ik de trein gemist.", status: correct}
      - {value: "Het regende die ochtend. De avond ervoor had ik mijn wekker niet gezet. Uiteindelijk heb ik de trein gemist", status: correct}
      - {value: "Die ochtend regende het. De avond ervoor had ik mijn wekker niet gezet. Uiteindelijk heb ik de trein gemist.", status: correct}
      - {value: "Die ochtend regende het. De avond ervoor had ik mijn wekker niet gezet. Uiteindelijk heb ik de trein gemist", status: correct}
    feedback: "Three time layers: Het regende die ochtend (background). De avond ervoor had ik mijn wekker niet gezet (pre-past). Uiteindelijk heb ik de trein gemist (foreground outcome)."
  nl.b2.unit04.lesson06.exercise07.respond_why_late:
    instruction: "Reply to 'Waarom was je zo laat?' with a pre-past cause, using de plusquamperfectum: I had overslept."
    accepted_answers:
      - {value: "Ik had me verslapen", status: correct}
    feedback: "Ik had me verslapen means I had overslept -- a pre-past cause in de plusquamperfectum."
