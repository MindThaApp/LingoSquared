course: {title: "Dutch C1", description: "Advanced Dutch discourse and pragmatic interpretation."}
units:
  nl.c1.unit02.tussen_de_regels: {title: "Reading between the lines", description: "Infer implication, irony, understatement, and attitude from the gap between literal wording and contextual meaning."}
lessons:
  nl.c1.unit02.lesson01.implicatie: {title: "From cue to implication"}
  nl.c1.unit02.lesson02.ironie: {title: "Infer irony from conflicting context"}
  nl.c1.unit02.lesson03.understatement: {title: "Scale understatement back to its real severity"}
  nl.c1.unit02.lesson04.houding: {title: "Infer attitude from wording and tone"}
  nl.c1.unit02.lesson05.meerduidigheid: {title: "Support an inference with evidence"}
  nl.c1.unit02.lesson06.bedoelde_boodschap: {title: "Reconstruct the intended message"}
teaching:
  nl.c1.unit02.lesson01.teach.tussen_de_regels: {title: "between the lines", gloss: "between the lines", note: "*Tussen de regels door* directs attention to meaning the speaker leaves unstated."}
  nl.c1.unit02.lesson01.teach.dat_zegt_genoeg: {title: "That says enough.", gloss: "that tells us all we need", note: "*Dat zegt genoeg* claims that an observed cue already supports the conclusion."}
  nl.c1.unit02.lesson01.teach.hij_antwoordde_niet: {title: "He did not answer; that says enough.", gloss: "silence treated as evidence", note: "The silence does not literally say 'no'; the second clause invites that inference."}
  nl.c1.unit02.lesson01.teach.implicatie: {title: "Inferring rejection", gloss: "Between the lines, you understand that his silence means rejection.", note: "The sentence names the cue (*stilte*) separately from the inferred meaning (*afwijzing*)."}
  nl.c1.unit02.lesson02.teach.dat_ging_soepel: {title: "Well, that went smoothly.", gloss: "literal praise; ironic criticism in the taught context", note: "*Nou, dat ging soepel* is ironic only because the surrounding failures contradict its literal praise."}
  nl.c1.unit02.lesson02.teach.twintig_minuten: {title: "The presentation started twenty minutes late.", gloss: "a concrete cue that events did not run smoothly", note: "This factual delay is evidence for the ironic rather than literal reading."}
  nl.c1.unit02.lesson02.teach.microfoon: {title: "The microphone failed.", gloss: "the microphone cut out", note: "A second independent failure makes the intended criticism recoverable."}
  nl.c1.unit02.lesson02.teach.botsing: {title: "Context reverses the wording", gloss: "Because everything went wrong, 'that went smoothly' means precisely that it proceeded chaotically.", note: "Irony arises from the collision between positive wording and negative facts."}
  nl.c1.unit02.lesson03.teach.niet_bepaald: {title: "not exactly flawless", gloss: "far from flawless, expressed with restraint", note: "*Niet bepaald* makes a stronger criticism through restrained negation."}
  nl.c1.unit02.lesson03.teach.ruimte_verbetering: {title: "There is room for improvement.", gloss: "diplomatic criticism that performance was inadequate", note: "In the serious-failure context, this mild wording understates the scale of the problem."}
  nl.c1.unit02.lesson03.teach.zacht_uitgedrukt: {title: "That is putting it mildly.", gloss: "that is an understatement", note: "*Dat is zacht uitgedrukt* explicitly says reality is stronger than the words used."}
  nl.c1.unit02.lesson03.teach.werkelijke_ernst: {title: "Recovering real severity", gloss: "The mild words conceal that the problems were serious.", note: "The interpreter must scale restrained wording back up using context."}
  nl.c1.unit02.lesson04.teach.klonk_beleefd: {title: "His words sounded polite.", gloss: "polite on the surface", note: "*Klonken* concerns surface impression; it does not settle the speaker's underlying stance."}
  nl.c1.unit02.lesson04.teach.behoorlijk_ontevreden: {title: "He was quite dissatisfied.", gloss: "substantially dissatisfied", note: "This is the inferred attitude beneath restrained wording."}
  nl.c1.unit02.lesson04.teach.suggereert: {title: "His word choice suggests criticism without stating it directly.", gloss: "wording as evidence for unstated criticism", note: "*Suggereren* leaves the conclusion inferential; *rechtstreeks* marks what the speaker avoids."}
  nl.c1.unit02.lesson04.teach.houding: {title: "Combining surface and context", gloss: "Literal politeness and negative context together indicate restrained dissatisfaction.", note: "A defensible inference cites both the surface form and the contextual cue."}
  nl.c1.unit02.lesson05.teach.op_zich: {title: "In itself, it was not a disaster.", gloss: "a qualified, notably unenthusiastic assessment", note: "*Op zich* narrows the praise, while *geen ramp* sets an extremely low positive bar."}
  nl.c1.unit02.lesson05.teach.maar: {title: "But she was not enthusiastic.", gloss: "absence of positive attitude", note: "The contrast supplies evidence against treating *geen ramp* as genuine praise."}
  nl.c1.unit02.lesson05.teach.blijkt_uit: {title: "That is evident from her reservation.", gloss: "that is evidenced by", note: "*Blijkt uit* forces an interpretation to be grounded in an observable cue."}
  nl.c1.unit02.lesson05.teach.bewijs: {title: "Literal content and inferred stance", gloss: "Lotte only literally denies that it was disastrous; her reservation and flat tone imply disappointment.", note: "The reading separates literal proposition, contextual evidence, and inferred attitude."}
  nl.c1.unit02.lesson06.teach.dialoog.line01: {title: "Lotte lists the failures", gloss: "The presentation started twenty minutes late, the microphone cut out, and no one could read the last slide.", note: "Lotte reports the concrete failures that set up the ironic and understated replies."}
  nl.c1.unit02.lesson06.teach.dialoog.line02: {title: "Omar's ironic reply", gloss: "Well, that went smoothly.", note: "Against the failures Lotte just listed, Omar's literal praise reads as irony."}
  nl.c1.unit02.lesson06.teach.dialoog.line03: {title: "Lotte answers with understatement", gloss: "Indeed, not exactly flawless.", note: "Lotte agrees, using the restrained *niet bepaald vlekkeloos* to state that it went badly."}
  nl.c1.unit02.lesson06.teach.dialoog.line04: {title: "Omar reports the director", gloss: "And the director said there was room for improvement.", note: "Omar relays the director's diplomatic wording, which understates a negative judgement."}
  nl.c1.unit02.lesson06.teach.dialoog.line05: {title: "Lotte marks the understatement", gloss: "That is putting it mildly.", note: "Lotte signals that the reality is stronger than the director's mild wording."}
  nl.c1.unit02.lesson06.teach.dialoog.line06: {title: "Omar names the inferred attitude", gloss: "His words sounded polite, but between the lines he was quite dissatisfied.", note: "Omar makes the recovered meaning explicit: polite surface, dissatisfied intent."}
  nl.c1.unit02.lesson06.teach.indirecte_boodschap: {title: "The indirect message", gloss: "The literal words are mild or positive, but context makes the critical intention clear.", note: "The assessment requires both the intended judgement and the cue that licenses it."}
exercises:
  nl.c1.unit02.lesson01.exercise01.herken_regels: {instruction: "What does tussen de regels door direct you to recover?", correct_option: "Meaning left unstated", distractors: ["Only dictionary definitions", "The order of paragraphs", "A spoken quotation"], accepted_answers: [{value: "Meaning left unstated", status: correct}], feedback: "*Tussen de regels door* means recovering implicit meaning."}
  nl.c1.unit02.lesson01.exercise02.infer_stilte: {instruction: "What does the speaker imply from the lack of an answer?", correct_option: "The silence amounts to rejection.", distractors: ["He accepted enthusiastically.", "No conclusion is possible in this taught context.", "He did not hear the question."], accepted_answers: [{value: "The silence amounts to rejection.", status: correct}], feedback: "*Dat zegt genoeg* turns the established silence into evidence for rejection."}
  nl.c1.unit02.lesson01.exercise03.koppel_implicatie:
    instruction: "Match each taught Dutch inference element to its distinct English clue."
    pairs: [{left: "tussen de regels door", right: "from meaning left unstated"}, {left: "Dat zegt genoeg.", right: "the cue already supports a conclusion"}, {left: "antwoordde niet", right: "gave no reply"}, {left: stilte, right: "absence of speech"}, {left: afwijzing, right: "rejection"}, {left: betekent, right: "carries the meaning of"}, {left: begrijp, right: "infer or understand"}]
    accepted_answers: [{value: [{left: "tussen de regels door", right: "from meaning left unstated"}, {left: "Dat zegt genoeg.", right: "the cue already supports a conclusion"}, {left: "antwoordde niet", right: "gave no reply"}, {left: stilte, right: "absence of speech"}, {left: afwijzing, right: "rejection"}, {left: betekent, right: "carries the meaning of"}, {left: begrijp, right: "infer or understand"}], status: correct}]
    feedback: "The cue, inferential frame, and conclusion have separate roles."
  nl.c1.unit02.lesson01.exercise04.orden_stilte: {instruction: "Put the Dutch words in order to treat silence as sufficient evidence.", accepted_answers: [{value: "Hij antwoordde niet dat zegt genoeg", status: correct}], feedback: "The second clause evaluates the first as evidence."}
  nl.c1.unit02.lesson01.exercise05.vertaal_regels: {instruction: "Translate into Dutch using tussen de regels door: Between the lines, you understand that his silence means rejection.", accepted_answers: [{value: "Tussen de regels door begrijp je dat zijn stilte afwijzing betekent", status: correct}], feedback: "The exact form separates cue from inferred meaning."}
  nl.c1.unit02.lesson01.exercise06.spreek_implicatie: {instruction: "Say the two clauses in reverse order (clause 2 first), changing no words: Hij antwoordde niet; dat zegt genoeg.", accepted_answers: [{value: "Dat zegt genoeg; hij antwoordde niet.", status: correct}], feedback: "The evaluation comes first, then the observed cue: *Dat zegt genoeg; hij antwoordde niet.*"}
  nl.c1.unit02.lesson01.exercise07.schrijf_betekenis: {instruction: "Turn into a yes/no question that starts with Begrijp je and keeps tussen de regels door right after je: Tussen de regels door begrijp je dat zijn stilte afwijzing betekent.", accepted_answers: [{value: "Begrijp je tussen de regels door dat zijn stilte afwijzing betekent?", status: correct}], feedback: "The verb comes first in a yes/no question: *Begrijp je tussen de regels door dat zijn stilte afwijzing betekent?*"}
  nl.c1.unit02.lesson02.exercise01.herken_letterlijk: {instruction: "What is the literal evaluation in Nou, dat ging soepel?", correct_option: "It went smoothly.", distractors: ["It was chaotic.", "It was cancelled.", "It was too short."], accepted_answers: [{value: "It went smoothly.", status: correct}], feedback: "The literal wording is positive; context may reverse the intended meaning."}
  nl.c1.unit02.lesson02.exercise02.infer_ironie: {instruction: "Given the late start and failed microphone, what does Omar actually mean?", correct_option: "The presentation went badly and chaotically.", distractors: ["The presentation ran perfectly.", "Only the microphone worked well.", "The delay improved the event."], accepted_answers: [{value: "The presentation went badly and chaotically.", status: correct}], feedback: "The factual failures contradict *soepel*, licensing irony."}
  nl.c1.unit02.lesson02.exercise03.koppel_ironie:
    instruction: "Match each Dutch irony/context element to its English clue."
    pairs: [{left: Nou, right: "frames a reaction to what just happened"}, {left: soepel, right: "smooth in the literal wording"}, {left: presentatie, right: "the event being evaluated"}, {left: "begon te laat", right: "started behind schedule"}, {left: "viel uit", right: "stopped functioning"}, {left: misging, right: "went wrong"}, {left: chaotisch, right: "disorganized and confused"}, {left: verliep, right: "proceeded or unfolded"}]
    accepted_answers: [{value: [{left: Nou, right: "frames a reaction to what just happened"}, {left: soepel, right: "smooth in the literal wording"}, {left: presentatie, right: "the event being evaluated"}, {left: "begon te laat", right: "started behind schedule"}, {left: "viel uit", right: "stopped functioning"}, {left: misging, right: "went wrong"}, {left: chaotisch, right: "disorganized and confused"}, {left: verliep, right: "proceeded or unfolded"}], status: correct}]
    feedback: "The negative facts reverse the positive literal wording."
  nl.c1.unit02.lesson02.exercise04.orden_ironie: {instruction: "Put the words in order to produce the taught ironic remark.", accepted_answers: [{value: "Nou dat ging soepel", status: correct}], feedback: "The irony depends on context, not altered syntax."}
  nl.c1.unit02.lesson02.exercise05.vertaal_context: {instruction: "Translate into Dutch: The presentation started twenty minutes late and the microphone failed.", accepted_answers: [{value: "De presentatie begon twintig minuten te laat en de microfoon viel uit", status: correct}], feedback: "These two facts license the ironic reading."}
  nl.c1.unit02.lesson02.exercise06.spreek_ironie: {instruction: "The presentation started twenty minutes late and the microphone failed. Say Omar's ironic remark: start with Nou, then say that the presentation (de presentatie) went smoothly (ging soepel).", accepted_answers: [{value: "Nou, de presentatie ging soepel.", status: correct}, {value: "Nou de presentatie ging wel soepel", status: correct}, {value: "Nou, de presentatie verliep soepel", status: correct}, {value: "Nou, dat ging soepel", status: correct}, {value: "Nou die presentatie ging soepel", status: correct}], feedback: "The literal praise *de presentatie ging soepel* is reversed by the failures, so it is ironic: *Nou, de presentatie ging soepel.*"}
  nl.c1.unit02.lesson02.exercise07.schrijf_uitleg: {instruction: "Combine into one sentence with omdat, putting the omdat-clause at the end: \"Dat ging soepel betekent juist dat het chaotisch verliep.\" + \"Alles misging.\" (Keep the first sentence unchanged.)", accepted_answers: [{value: "Dat ging soepel betekent juist dat het chaotisch verliep, omdat alles misging.", status: correct}, {value: "Omdat alles misging, betekent dat ging soepel juist dat het chaotisch verliep.", status: correct}], feedback: "After *omdat* the verb goes to the end: *omdat alles misging*. The fronted version *Omdat alles misging, betekent dat ging soepel juist dat het chaotisch verliep.* is also accepted."}
  nl.c1.unit02.lesson03.exercise01.herken_bepaald: {instruction: "What does niet bepaald vlekkeloos convey in this failure context?", correct_option: "It was far from flawless.", distractors: ["It was almost perfect.", "No evaluation is given.", "It was deliberately unfinished."], accepted_answers: [{value: "It was far from flawless.", status: correct}], feedback: "The restrained negation intensifies criticism."}
  nl.c1.unit02.lesson03.exercise02.infer_verbetering: {instruction: "What does ruimte voor verbetering imply after multiple serious failures?", correct_option: "The performance was inadequate.", distractors: ["The performance was flawless.", "Improvement is forbidden.", "The event exceeded expectations."], accepted_answers: [{value: "The performance was inadequate.", status: correct}], feedback: "The mild phrase understates a strongly negative assessment."}
  nl.c1.unit02.lesson03.exercise03.koppel_understatement:
    instruction: "Match each Dutch understatement element to its distinct English clue."
    pairs: [{left: "niet bepaald", right: "a restrained negation that strengthens criticism"}, {left: vlekkeloos, right: "without any fault"}, {left: "ruimte voor verbetering", right: "polite signal that performance was inadequate"}, {left: "zacht uitgedrukt", right: "states that wording understates reality"}, {left: "milde woorden", right: "restrained phrasing"}, {left: verbergen, right: "keep the full reality from direct view"}, {left: ernstig, right: "serious rather than minor"}]
    accepted_answers: [{value: [{left: "niet bepaald", right: "a restrained negation that strengthens criticism"}, {left: vlekkeloos, right: "without any fault"}, {left: "ruimte voor verbetering", right: "polite signal that performance was inadequate"}, {left: "zacht uitgedrukt", right: "states that wording understates reality"}, {left: "milde woorden", right: "restrained phrasing"}, {left: verbergen, right: "keep the full reality from direct view"}, {left: ernstig, right: "serious rather than minor"}], status: correct}]
    feedback: "Each expression locates a different part of the understatement mechanism."
  nl.c1.unit02.lesson03.exercise04.orden_zacht: {instruction: "Put the Dutch words in order to say that wording is an understatement.", accepted_answers: [{value: "Dat is zacht uitgedrukt", status: correct}], feedback: "*Zacht uitgedrukt* means putting it mildly."}
  nl.c1.unit02.lesson03.exercise05.vertaal_vlekkeloos: {instruction: "Translate into Dutch using niet bepaald: It did not exactly go flawlessly.", accepted_answers: [{value: "Het verliep niet bepaald vlekkeloos", status: correct}, {value: "Het ging niet bepaald vlekkeloos", status: correct}], feedback: "The named form conveys restrained but strong criticism."}
  nl.c1.unit02.lesson03.exercise06.spreek_understatement: {instruction: "Say that \"ruimte voor verbetering\" is putting it mildly: start with Ruimte voor verbetering and use zacht uitgedrukt.", accepted_answers: [{value: "Ruimte voor verbetering is zacht uitgedrukt", status: correct}, {value: "Ruimte voor verbetering, dat is zacht uitgedrukt", status: correct}, {value: "Ruimte voor verbetering dat is zacht uitgedrukt", status: correct}], feedback: "*Ruimte voor verbetering is zacht uitgedrukt.* The mild phrase understates a strongly negative assessment."}
  nl.c1.unit02.lesson03.exercise07.schrijf_ernst: {instruction: "Write one sentence that starts with \"De milde woorden verbergen dat\" and says the problems (de problemen) were serious (ernstig; past tense, verb at the end).", accepted_answers: [{value: "De milde woorden verbergen dat de problemen ernstig waren", status: correct}], feedback: "*De milde woorden verbergen dat de problemen ernstig waren.* The verb goes to the end of the dat-clause."}
  nl.c1.unit02.lesson04.exercise01.herken_houding: {instruction: "What attitude lies beneath the polite wording?", correct_option: "Considerable dissatisfaction", distractors: ["Unqualified enthusiasm", "Total indifference", "Relief that nothing failed"], accepted_answers: [{value: "Considerable dissatisfaction", status: correct}], feedback: "The clause after *maar* states the inferred attitude."}
  nl.c1.unit02.lesson04.exercise02.citeer_aanwijzing: {instruction: "Which combination licenses the inference of dissatisfaction?", correct_option: "Polite surface wording plus the negative failure context", distractors: ["Polite wording alone", "The speaker's name alone", "A neutral dictionary definition"], accepted_answers: [{value: "Polite surface wording plus the negative failure context", status: correct}], feedback: "Both surface and context are needed for a defensible inference."}
  nl.c1.unit02.lesson04.exercise03.koppel_houding:
    instruction: "Match each Dutch stance element to its distinct English clue."
    pairs: [{left: klonken, right: "came across in tone"}, {left: beleefd, right: "courteous on the surface"}, {left: "behoorlijk ontevreden", right: "substantially dissatisfied"}, {left: woordkeus, right: "choice of wording"}, {left: suggereert, right: "implies without stating"}, {left: kritiek, right: "negative evaluation"}, {left: rechtstreeks, right: "directly and explicitly"}, {left: ingehouden, right: "restrained rather than openly expressed"}]
    accepted_answers: [{value: [{left: klonken, right: "came across in tone"}, {left: beleefd, right: "courteous on the surface"}, {left: "behoorlijk ontevreden", right: "substantially dissatisfied"}, {left: woordkeus, right: "choice of wording"}, {left: suggereert, right: "implies without stating"}, {left: kritiek, right: "negative evaluation"}, {left: rechtstreeks, right: "directly and explicitly"}, {left: ingehouden, right: "restrained rather than openly expressed"}], status: correct}]
    feedback: "These forms distinguish surface delivery, inference, and underlying stance."
  nl.c1.unit02.lesson04.exercise04.orden_suggereert: {instruction: "Put the Dutch words in order to identify word choice as the cue.", accepted_answers: [{value: "Zijn woordkeus suggereert kritiek", status: correct}], feedback: "The subject is the wording, not an unsupported guess."}
  nl.c1.unit02.lesson04.exercise05.vertaal_houding: {instruction: "Translate into Dutch: He was quite dissatisfied.", accepted_answers: [{value: "Hij was behoorlijk ontevreden", status: correct}], feedback: "This names the inferred stance directly."}
  nl.c1.unit02.lesson04.exercise06.spreek_uitleg: {instruction: "Start with \"Zonder die rechtstreeks uit te spreken\" and keep every word (verb second): Zijn woordkeus suggereert kritiek zonder die rechtstreeks uit te spreken.", accepted_answers: [{value: "Zonder die rechtstreeks uit te spreken suggereert zijn woordkeus kritiek", status: correct}], feedback: "Fronting the *zonder* phrase triggers inversion: *Zonder die rechtstreeks uit te spreken suggereert zijn woordkeus kritiek.*"}
  nl.c1.unit02.lesson04.exercise07.schrijf_houding: {instruction: "Rewrite so that the sentence begins with Samen (verb second): De letterlijke beleefdheid en de negatieve context wijzen samen op ingehouden ontevredenheid.", accepted_answers: [{value: "Samen wijzen de letterlijke beleefdheid en de negatieve context op ingehouden ontevredenheid", status: correct}, {value: "Samen wijzen de negatieve context en de letterlijke beleefdheid op ingehouden ontevredenheid", status: correct}], feedback: "Fronting *samen* triggers inversion: *Samen wijzen de letterlijke beleefdheid en de negatieve context op ingehouden ontevredenheid.* The two cues may come in either order."}
  nl.c1.unit02.lesson05.exercise01.lees_letterlijk: {instruction: "What does Lotte literally deny?", correct_option: "Only that it was a disaster", distractors: ["That she attended", "That she was disappointed", "That anyone spoke"], accepted_answers: [{value: "Only that it was a disaster", status: correct}], feedback: "The literal proposition is narrower than a positive recommendation."}
  nl.c1.unit02.lesson05.exercise02.lees_impliciet: {instruction: "What stance do her reservation and flat tone imply?", correct_option: "She was disappointed.", distractors: ["She was delighted.", "She had no opinion.", "She caused the problem."], accepted_answers: [{value: "She was disappointed.", status: correct}], feedback: "The inference is grounded in two supplied cues."}
  nl.c1.unit02.lesson05.exercise03.koppel_bewijs:
    instruction: "Match each Dutch evidence element to its distinct English clue."
    pairs: [{left: "op zich", right: "considered in isolation"}, {left: "geen ramp", right: "not a disaster in literal terms"}, {left: enthousiast, right: "showing strong positive feeling"}, {left: voorbehoud, right: "a reservation or qualification"}, {left: "vlakke toon", right: "delivery without warmth"}, {left: impliceren, right: "convey without direct statement"}, {left: teleurgesteld, right: "disappointed"}, {left: "blijkt uit", right: "is evidenced by"}]
    accepted_answers: [{value: [{left: "op zich", right: "considered in isolation"}, {left: "geen ramp", right: "not a disaster in literal terms"}, {left: enthousiast, right: "showing strong positive feeling"}, {left: voorbehoud, right: "a reservation or qualification"}, {left: "vlakke toon", right: "delivery without warmth"}, {left: impliceren, right: "convey without direct statement"}, {left: teleurgesteld, right: "disappointed"}, {left: "blijkt uit", right: "is evidenced by"}], status: correct}]
    feedback: "Literal content, cues, and conclusion remain distinguishable."
  nl.c1.unit02.lesson05.exercise04.orden_bewijs: {instruction: "Put the Dutch words in order to cite her reservation as evidence.", accepted_answers: [{value: "Dat blijkt uit haar voorbehoud", status: correct}], feedback: "*Blijkt uit* grounds the inference."}
  nl.c1.unit02.lesson05.exercise05.vertaal_enthousiast: {instruction: "Translate into Dutch: But she was not enthusiastic.", accepted_answers: [{value: "Maar ze was niet enthousiast", status: correct}], feedback: "The sentence states the missing positive attitude."}
  nl.c1.unit02.lesson05.exercise06.spreek_bewijs: {instruction: "Say that her being disappointed is evidenced by her reservation and flat tone: start with \"Dat ze teleurgesteld was\" and use blijkt uit.", accepted_answers: [{value: "Dat ze teleurgesteld was blijkt uit haar voorbehoud en vlakke toon", status: correct}, {value: "Dat ze teleurgesteld was blijkt uit haar voorbehoud en haar vlakke toon", status: correct}, {value: "Dat ze teleurgesteld was blijkt uit haar vlakke toon en voorbehoud", status: correct}, {value: "Dat ze teleurgesteld was blijkt uit haar vlakke toon en haar voorbehoud", status: correct}], feedback: "*Dat ze teleurgesteld was, blijkt uit haar voorbehoud en vlakke toon.* *Blijkt uit* grounds the inference in both cues."}
  nl.c1.unit02.lesson05.exercise07.schrijf_bewijs: {instruction: "Combine into one sentence with maar: \"Letterlijk ontkent ze alleen dat het rampzalig was.\" + \"Haar voorbehoud en vlakke toon impliceren dat ze teleurgesteld was.\"", accepted_answers: [{value: "Letterlijk ontkent ze alleen dat het rampzalig was, maar haar voorbehoud en vlakke toon impliceren dat ze teleurgesteld was.", status: correct}, {value: "Letterlijk ontkent ze alleen dat het rampzalig was maar haar voorbehoud en vlakke toon impliceren dat ze teleurgesteld was", status: correct}], feedback: "*Maar* is a coordinating conjunction, so word order stays as in the two sentences: *..., maar haar voorbehoud en vlakke toon impliceren dat ze teleurgesteld was.*"}
  nl.c1.unit02.lesson06.exercise01.luister_bedoeling: {instruction: "Listen to the exchange. What overall attitude do the ironic and understated remarks convey?", correct_option: "The presentation went badly and the director was quite dissatisfied.", distractors: ["The presentation was flawless and everyone was pleased.", "Only the final slide succeeded.", "The director expressed no evaluation."], accepted_answers: [{value: "The presentation went badly and the director was quite dissatisfied.", status: correct}], feedback: "Failures reverse *soepel*, while restrained criticism implies dissatisfaction."}
  nl.c1.unit02.lesson06.exercise02.lees_bedoeling: {instruction: "Which interpretation best captures the exchange's literal wording and actual stance?", correct_option: "Mild or positive words carry a critical meaning because the context contradicts them.", distractors: ["Every statement should be read literally.", "The context supports genuine praise.", "No attitude can be inferred."], accepted_answers: [{value: "Mild or positive words carry a critical meaning because the context contradicts them.", status: correct}], feedback: "The answer states both layers and the relation between them."}
  nl.c1.unit02.lesson06.exercise03.koppel_lagen:
    instruction: "Match each taught Dutch expression to its contextual intended meaning."
    pairs: [{left: "dat ging soepel", right: "literal praise reversed by failures"}, {left: "niet bepaald vlekkeloos", right: "restrained statement that it went badly"}, {left: "ruimte voor verbetering", right: "diplomatic criticism of inadequate performance"}, {left: "zacht uitgedrukt", right: "signals that reality is stronger than the wording"}, {left: "tussen de regels door", right: "meaning recovered beyond literal words"}, {left: "behoorlijk ontevreden", right: "the inferred negative attitude"}]
    accepted_answers: [{value: [{left: "dat ging soepel", right: "literal praise reversed by failures"}, {left: "niet bepaald vlekkeloos", right: "restrained statement that it went badly"}, {left: "ruimte voor verbetering", right: "diplomatic criticism of inadequate performance"}, {left: "zacht uitgedrukt", right: "signals that reality is stronger than the wording"}, {left: "tussen de regels door", right: "meaning recovered beyond literal words"}, {left: "behoorlijk ontevreden", right: "the inferred negative attitude"}], status: correct}]
    feedback: "Each match distinguishes literal form from contextual force."
  nl.c1.unit02.lesson06.exercise04.orden_bedoeling: {instruction: "Put the Dutch words in order to state that context reveals critical intent.", accepted_answers: [{value: "De context maakt de kritische bedoeling duidelijk", status: correct}], feedback: "The sentence identifies context as the interpretive key."}
  nl.c1.unit02.lesson06.exercise05.spreek_beoordeling: {instruction: "Turn into indirect speech, starting with \"De directeur zei dat\": Er is ruimte voor verbetering.", accepted_answers: [{value: "De directeur zei dat er ruimte voor verbetering was", status: correct}, {value: "De directeur zei dat er ruimte was voor verbetering", status: correct}], feedback: "In the dat-clause the verb moves to the end and shifts to the past: *De directeur zei dat er ruimte voor verbetering was.*"}
  nl.c1.unit02.lesson06.exercise06.schrijf_beoordeling: {instruction: "Turn into indirect speech, starting with \"Lotte zei dat\": Op zich was het geen ramp.", accepted_answers: [{value: "Lotte zei dat het op zich geen ramp was.", status: correct}, {value: "Lotte zei dat het geen ramp was op zich.", status: correct}], feedback: "In the dat-clause the subject *het* comes first and the verb goes to the end: *Lotte zei dat het op zich geen ramp was.*"}
  nl.c1.unit02.lesson06.exercise07.dictaat_ironie: {instruction: "Type exactly what you hear.", correct_response: "Nou dat ging soepel", orthography_strict: true, feedback: "You heard *Nou dat ging soepel*; the supplied context determines whether it is ironic."}
