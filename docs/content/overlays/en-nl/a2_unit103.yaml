course:
  title: "Dutch A2"
  description: "Grammar-led A2 Dutch for talking about feelings and personal care."
  learning_goal: "Use reflexive verbs with the full me, je, zich, ons, je, zich paradigm to say how you feel and what you do to look after yourself."
units:
  nl.a2.unit103.zorg_voor_jezelf: {title: "Looking after yourself", description: "Describe how you feel and what you do to look after yourself, using reflexive verbs."}
lessons:
  nl.a2.unit103.zorg_voor_jezelf.lesson01.hoe_voel_je_je: {title: "How do you feel?"}
  nl.a2.unit103.zorg_voor_jezelf.lesson02.het_hele_rijtje: {title: "The whole set"}
  nl.a2.unit103.zorg_voor_jezelf.lesson03.wassen_of_zich_wassen: {title: "Wassen or zich wassen?"}
  nl.a2.unit103.zorg_voor_jezelf.lesson04.bij_de_kapper_en_thuis: {title: "At the barber and at home"}
  nl.a2.unit103.zorg_voor_jezelf.lesson05.noors_bericht: {title: "Noor's message"}
  nl.a2.unit103.zorg_voor_jezelf.lesson06.lotte_en_omar: {title: "Lotte and Omar"}
teaching:
  nl.a2.unit103.zorg_voor_jezelf.lesson01.teach.gezondheid: {"title": "Health", "gloss": "sick / healthy / tired / the pain / the head / the stomach / the doctor", "note": "These words describe how your body feels.", "example_gloss": ["Noor is sick.", "Lotte is healthy.", "Omar is tired.", "I have a pain in my head.", "I have a pain in my stomach.", "Noor goes to the doctor."]}
  nl.a2.unit103.zorg_voor_jezelf.lesson01.teach.gevoelens: {"title": "Feelings", "gloss": "happy / angry / afraid / sad / calm / nervous", "note": "These adjectives name feelings. Use them after a form of zijn or after voelen + the reflexive pronoun.", "example_gloss": ["Omar is happy.", "Noor is angry.", "Lotte is nervous.", "I am afraid.", "He is sad.", "We are calm."]}
  nl.a2.unit103.zorg_voor_jezelf.lesson01.teach.verzorging: {"title": "Personal care", "gloss": "the barber / the hair / the beard / the hand", "note": "Words for looking after your appearance.", "example_gloss": ["Omar goes to the barber.", "Lotte has long hair.", "The man has a beard.", "I have a hand."]}
  nl.a2.unit103.zorg_voor_jezelf.lesson01.teach.gn_voelen: {"title": "Zich voelen: the full paradigm", "gloss": "I feel / you feel / he feels / she feels / we feel / you (all) feel / they feel", "note": "Zich voelen is a reflexive verb: the reflexive pronoun always matches the subject. Ik: me. Jij: je. Hij, zij: zich. Wij: ons. Jullie: je. Zij (they): zich."}
  nl.a2.unit103.zorg_voor_jezelf.lesson01.teach.vraag: {"title": "Ask how someone feels", "gloss": "How do you feel? I feel good.", "note": "Both je are needed: the first one is the subject, the second one is the reflexive pronoun."}
  nl.a2.unit103.zorg_voor_jezelf.lesson01.teach.zinnen: {"title": "Feelings in context", "gloss": "I feel tired. He feels sick. We feel happy. Lotte is sick. She feels unwell."}
  nl.a2.unit103.zorg_voor_jezelf.lesson02.teach.werkwoorden: {"title": "Three reflexive verbs", "gloss": "to wash (oneself) / to hurry / to shave", "note": "In the dictionary these verbs are listed with zich. In a sentence, zich changes with the subject.", "example_gloss": ["I wash every morning.", "Noor hurries to her work.", "Omar shaves today."]}
  nl.a2.unit103.zorg_voor_jezelf.lesson02.teach.tijd: {"title": "Time and speed", "gloss": "every morning / today / this evening / always / quickly / the work", "note": "Time words often stand at the start of the sentence.", "example_gloss": ["Every morning I hurry.", "Today I feel good.", "This evening I am at home.", "You always hurry.", "We wash quickly.", "Lotte goes to work."]}
  nl.a2.unit103.zorg_voor_jezelf.lesson02.teach.gn_rijtje: {"title": "The reflexive pronouns: me, je, zich, ons", "gloss": "I hurry / you hurry / he hurries / she hurries / we hurry / you (all) hurry / they hurry", "note": "The pronoun follows the subject: ik: me; jij: je; hij, zij, het: zich; wij: ons; jullie: je; zij (they): zich. Note the verb endings too: ik haast, jij haast, wij haasten."}
  nl.a2.unit103.zorg_voor_jezelf.lesson02.teach.gn_zich: {"title": "Zich also stands for names and plural nouns", "gloss": "Lotte washes herself. The children wash themselves. You shave. We wash.", "note": "A name or a noun (Lotte, de kinderen) takes zich, just like hij, zij or het. Only ik, jij, wij and jullie have their own forms: me, je, ons, je."}
  nl.a2.unit103.zorg_voor_jezelf.lesson02.teach.zinnen: {"title": "Four short sentences", "gloss": "I wash. You wash. He shaves. We hurry."}
  nl.a2.unit103.zorg_voor_jezelf.lesson03.teach.lichaam: {"title": "Things you can wash", "gloss": "the face / the hands / the teeth / the car / the baby / the children", "note": "When you name a body part, use mijn, je or zijn (your own body part is not a reflexive object).", "example_gloss": ["I wash my hands.", "You wash your face.", "He has nice teeth.", "Lotte washes the car.", "Omar washes the baby.", "The children are at home."]}
  nl.a2.unit103.zorg_voor_jezelf.lesson03.teach.gn_lichaam: {"title": "Body part or whole person", "gloss": "I wash my hands. I wash myself. You wash your face. You wash yourself.", "note": "If you name the body part, use a possessive (mijn, je, zijn) and no reflexive pronoun. If you do not name it, use the reflexive pronoun. Watch out: je can be 'your' (je gezicht) or 'yourself' (wast je)."}
  nl.a2.unit103.zorg_voor_jezelf.lesson03.teach.gn_ander: {"title": "Someone else or yourself", "gloss": "Lotte washes the car. Lotte washes herself. He shaves his beard. He shaves himself.", "note": "Zich is only used when the subject and the object are the same person. Another object (de auto, zijn baard) takes no zich."}
  nl.a2.unit103.zorg_voor_jezelf.lesson03.teach.altijd_zich: {"title": "Always reflexive", "gloss": "to be mistaken / to be bored", "note": "In these meanings the two verbs always take zich (vervelen can also mean to annoy someone, but not in this unit). The pronoun is part of the verb.", "example_gloss": ["Sorry, I am mistaken.", "He is bored today.", "I am bored.", "You are not mistaken.", "We are never bored."]}
  nl.a2.unit103.zorg_voor_jezelf.lesson03.teach.gn_voelen_pijn: {"title": "Voelen with and without me", "gloss": "I feel sick. I feel the pain.", "note": "Voelen is reflexive when it describes how you are (ik voel me ziek). It is not reflexive when you feel something, such as de pijn."}
  nl.a2.unit103.zorg_voor_jezelf.lesson03.teach.gn_zelf: {"title": "Stress with -zelf", "gloss": "I wash myself. You wash yourself. He washes himself.", "note": "Add -zelf only for emphasis, for example when someone else usually does it. In normal sentences me, je and zich are enough."}
  nl.a2.unit103.zorg_voor_jezelf.lesson04.teach.ontspannen: {"title": "Relaxing and the barber", "gloss": "to relax / to cut / the bath / warm", "note": "Zich ontspannen is reflexive like the other verbs in this unit.", "example_gloss": ["I relax in a warm bath.", "The barber cuts my hair."]}
  nl.a2.unit103.zorg_voor_jezelf.lesson04.teach.volgorde_woorden: {"title": "Order and time", "gloss": "first / then / afterwards / Saturday / the weekend / why / never", "note": "Use eerst, dan and daarna to tell a short routine in order.", "example_gloss": ["First I shave.", "Then I go to the barber.", "Afterwards I am at home.", "On Saturday I go to the barber.", "In the weekend I relax.", "Why is he hurrying?", "I am never bored."]}
  nl.a2.unit103.zorg_voor_jezelf.lesson04.teach.gn_vraag: {"title": "Questions with a reflexive verb", "gloss": "Do you feel well? Is he hurrying? Are you bored? Why is he hurrying?", "note": "In a yes/no question the verb comes first, then the subject, then the reflexive pronoun: voel jij je. With a question word (waarom) the question word comes first, then the verb. With jij after the verb the ending -t disappears (jij voelt, but voel jij)."}
  nl.a2.unit103.zorg_voor_jezelf.lesson04.teach.gn_voorop: {"title": "A time word first", "gloss": "Afterwards I relax. First I shave. Today I feel tired.", "note": "When a time word starts the sentence, the verb stays in second position and the subject comes after it. The reflexive pronoun still follows the subject: ontspan ik me."}
  nl.a2.unit103.zorg_voor_jezelf.lesson04.teach.gn_bijzin: {"title": "Reflexive pronoun after dat", "gloss": "I think he is hurrying. I think you are mistaken.", "note": "After dat the subject is followed by the reflexive pronoun, and the conjugated verb goes to the end: dat hij zich haast."}
  nl.a2.unit103.zorg_voor_jezelf.lesson04.teach.bevel: {"title": "Telling someone what to do", "gloss": "Hurry up! Relax!", "note": "In a command with jij, the verb has no -t and the reflexive pronoun je follows it."}
  nl.a2.unit103.zorg_voor_jezelf.lesson04.teach.scenario: {"title": "A Saturday routine", "gloss": "On Saturday I go to the barber. The barber cuts my hair. Afterwards I relax at home."}
  nl.a2.unit103.zorg_voor_jezelf.lesson05.teach.reading: {"title": "Noor's message", "gloss": "Hi Lotte and Omar, this week I do not feel well. I am tired and I have a pain in my head. Every morning I hurry to work. This evening I relax in a warm bath. Do you feel tired too? Best wishes, Noor", "note": "Look for every reflexive verb and the pronoun that goes with it.", "glosses": {"deze": "this", "week": "week", "ook": "too", "groetjes": "best wishes"}}
  nl.a2.unit103.zorg_voor_jezelf.lesson05.teach.extra: {"title": "Words from the message", "gloss": "this week / too / best wishes", "note": "Groetjes is a friendly way to end a message to friends.", "example_gloss": ["This week I am tired.", "Do you feel tired too?", "Best wishes, Lotte"]}
  nl.a2.unit103.zorg_voor_jezelf.lesson06.teach.beurt1: {"title": "Lotte asks how Omar feels", "gloss": "Lotte: Hi Omar, how do you feel today?"}
  nl.a2.unit103.zorg_voor_jezelf.lesson06.teach.beurt2: {"title": "Omar says he is tired", "gloss": "Omar: I feel tired. Every morning I hurry to work."}
  nl.a2.unit103.zorg_voor_jezelf.lesson06.teach.beurt3: {"title": "Lotte gives advice", "gloss": "Lotte: Then relax in the weekend!"}
  nl.a2.unit103.zorg_voor_jezelf.lesson06.teach.beurt4: {"title": "Omar makes a plan", "gloss": "Omar: Yes, on Saturday I go to the barber. Afterwards I relax at home."}
  nl.a2.unit103.zorg_voor_jezelf.lesson06.teach.beurt5: {"title": "Lotte asks about boredom", "gloss": "Lotte: Aren't you bored then?"}
  nl.a2.unit103.zorg_voor_jezelf.lesson06.teach.beurt6: {"title": "Omar answers", "gloss": "Omar: No, I am never bored."}
exercises:
  nl.a2.unit103.zorg_voor_jezelf.lesson01.exercise01.kies_moe: {"instruction": "Choose the correct Dutch sentence.", "correct_option": "Ik voel me moe.", "distractors": ["Ik voel moe.", "Ik ben me moe.", "Ik voel je moe."], "accepted_answers": [{"value": "Ik voel me moe.", "status": "correct"}], "feedback": "Voelen needs the reflexive pronoun *me* when it describes your own state: *Ik voel me moe*."}
  nl.a2.unit103.zorg_voor_jezelf.lesson01.exercise02.kies_blij: {"instruction": "Choose the correct Dutch sentence.", "correct_option": "Omar voelt zich blij.", "distractors": ["Omar voelt me blij.", "Omar voelt ons blij.", "Omar voelt je blij."], "accepted_answers": [{"value": "Omar voelt zich blij.", "status": "correct"}], "feedback": "With hij, zij or a name the reflexive pronoun is *zich*."}
  nl.a2.unit103.zorg_voor_jezelf.lesson01.exercise03.match_gevoelens: {"instruction": "Match each Dutch word to its English meaning.", "accepted_answers": [{"value": [{"left": "ziek", "right": "sick"}, {"left": "moe", "right": "tired"}, {"left": "blij", "right": "happy"}, {"left": "boos", "right": "angry"}, {"left": "bang", "right": "afraid"}, {"left": "rustig", "right": "calm"}], "status": "correct"}], "feedback": "These are the health and feeling words you will use after *voelen*."}
  nl.a2.unit103.zorg_voor_jezelf.lesson01.exercise04.volgorde_hoe: {"instruction": "Put the words in order to ask 'How do you feel?'", "correct_option": "Hoe voel je je", "accepted_answers": [{"value": "Hoe voel je je", "status": "correct"}], "feedback": "*Hoe voel je je?* = How do you feel?"}
  nl.a2.unit103.zorg_voor_jezelf.lesson01.exercise05.vul_ons: {"instruction": "Complete with the reflexive pronoun for wij.", "correct_option": "ons", "accepted_answers": [{"value": "ons", "status": "correct"}], "feedback": "The reflexive pronoun for *wij* is *ons*."}
  nl.a2.unit103.zorg_voor_jezelf.lesson01.exercise06.vertaal_hoe: {"instruction": "Translate into Dutch.", "accepted_answers": [{"value": "Hoe voel je je?", "status": "correct"}, {"value": "Hoe voel je je", "status": "correct"}, {"value": "Hoe voel jij je?", "status": "correct"}, {"value": "Hoe voel jij je", "status": "correct"}], "feedback": "*Hoe voel je je?* or, with extra stress, *Hoe voel jij je?*"}
  nl.a2.unit103.zorg_voor_jezelf.lesson01.exercise07.schrijf_ziek: {"instruction": "Write the requested Dutch sentence (use zich voelen).", "correct_option": "Hij voelt zich ziek.", "accepted_answers": [{"value": "Hij voelt zich ziek.", "status": "correct"}, {"value": "Hij voelt zich ziek", "status": "correct"}], "feedback": "*Hij voelt zich ziek.*"}
  nl.a2.unit103.zorg_voor_jezelf.lesson02.exercise01.kies_haasten: {"instruction": "Choose the correct Dutch sentence.", "correct_option": "Wij haasten ons.", "distractors": ["Wij haasten me.", "Wij haasten je.", "Wij haasten zich."], "accepted_answers": [{"value": "Wij haasten ons.", "status": "correct"}], "feedback": "The reflexive pronoun for *wij* is *ons*, and the verb takes the ending *-en*."}
  nl.a2.unit103.zorg_voor_jezelf.lesson02.exercise02.kies_wast: {"instruction": "Choose the correct Dutch sentence.", "correct_option": "Noor wast zich.", "distractors": ["Noor was zich.", "Noor wassen zich.", "Noor wast zij."], "accepted_answers": [{"value": "Noor wast zich.", "status": "correct"}], "feedback": "A name is third person singular: *wast* + *zich*."}
  nl.a2.unit103.zorg_voor_jezelf.lesson02.exercise03.match_rijtje: {"instruction": "Match each Dutch sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Ik haast me", "right": "I hurry"}, {"left": "Jij haast je", "right": "You hurry (one person)"}, {"left": "Hij haast zich", "right": "He hurries"}, {"left": "Wij haasten ons", "right": "We hurry"}, {"left": "Jullie haasten je", "right": "You hurry (several people)"}, {"left": "Zij haasten zich", "right": "They hurry"}], "status": "correct"}], "feedback": "Each subject has its own reflexive pronoun, and jij and jullie both use *je*."}
  nl.a2.unit103.zorg_voor_jezelf.lesson02.exercise04.volgorde_ochtend: {"instruction": "Put the words in order to say 'We hurry every morning.'", "correct_option": "Wij haasten ons elke ochtend", "accepted_answers": [{"value": "Wij haasten ons elke ochtend", "status": "correct"}, {"value": "Elke ochtend haasten wij ons", "status": "correct"}], "feedback": "Both orders are fine: the time phrase may come first, and then the verb comes before the subject."}
  nl.a2.unit103.zorg_voor_jezelf.lesson02.exercise05.vul_je: {"instruction": "Complete with the reflexive pronoun for jij.", "correct_option": "je", "accepted_answers": [{"value": "je", "status": "correct"}], "feedback": "The reflexive pronoun for *jij* is *je*."}
  nl.a2.unit103.zorg_voor_jezelf.lesson02.exercise06.vertaal_wassen: {"instruction": "Translate into Dutch (use a reflexive verb: wash yourself).", "accepted_answers": [{"value": "Ik was me elke ochtend.", "status": "correct"}, {"value": "Ik was me elke ochtend", "status": "correct"}, {"value": "Elke ochtend was ik me.", "status": "correct"}, {"value": "Elke ochtend was ik me", "status": "correct"}], "feedback": "Dutch needs *me* here; English can drop 'myself'."}
  nl.a2.unit103.zorg_voor_jezelf.lesson02.exercise07.schrijf_scheren: {"instruction": "Write the requested Dutch sentence (use zich scheren).", "correct_option": "Hij scheert zich elke ochtend.", "accepted_answers": [{"value": "Hij scheert zich elke ochtend.", "status": "correct"}, {"value": "Hij scheert zich elke ochtend", "status": "correct"}, {"value": "Elke ochtend scheert hij zich.", "status": "correct"}, {"value": "Elke ochtend scheert hij zich", "status": "correct"}], "feedback": "*Hij scheert zich elke ochtend.*"}
  nl.a2.unit103.zorg_voor_jezelf.lesson03.exercise01.kies_handen: {"instruction": "Choose the correct Dutch sentence.", "correct_option": "Ik was mijn handen.", "distractors": ["Ik was me mijn handen.", "Ik was zich handen.", "Ik was handen mijn."], "accepted_answers": [{"value": "Ik was mijn handen.", "status": "correct"}], "feedback": "When you name the body part, you use *mijn*, not a reflexive pronoun."}
  nl.a2.unit103.zorg_voor_jezelf.lesson03.exercise02.kies_auto: {"instruction": "Choose the correct Dutch sentence.", "correct_option": "Lotte wast de auto.", "distractors": ["Lotte wast zich de auto.", "Lotte wast zich auto.", "Lotte wast me de auto."], "accepted_answers": [{"value": "Lotte wast de auto.", "status": "correct"}], "feedback": "The object is the car, not Lotte herself, so there is no *zich*."}
  nl.a2.unit103.zorg_voor_jezelf.lesson03.exercise03.match_contrast: {"instruction": "Match each Dutch sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Ik was mijn handen", "right": "I wash my hands"}, {"left": "Ik was me", "right": "I wash myself"}, {"left": "Jij wast je handen", "right": "You wash your hands"}, {"left": "Jij wast je", "right": "You wash yourself"}, {"left": "Ik vergis me", "right": "I am mistaken"}, {"left": "Hij verveelt zich", "right": "He is bored"}, {"left": "Ik voel de pijn", "right": "I feel the pain"}, {"left": "Ik voel me ziek", "right": "I feel sick"}], "status": "correct"}], "feedback": "Pay attention to whether a body part or another object is named."}
  nl.a2.unit103.zorg_voor_jezelf.lesson03.exercise04.volgorde_gezicht: {"instruction": "Put the words in order to say 'You wash your face.'", "correct_option": "Jij wast je gezicht", "accepted_answers": [{"value": "Jij wast je gezicht", "status": "correct"}], "feedback": "Here *je* means 'your'. There is no reflexive pronoun because the face is named."}
  nl.a2.unit103.zorg_voor_jezelf.lesson03.exercise05.vul_vergis: {"instruction": "Complete with the reflexive pronoun.", "correct_option": "me", "accepted_answers": [{"value": "me", "status": "correct"}], "feedback": "*Zich vergissen* is always reflexive: *ik vergis me*."}
  nl.a2.unit103.zorg_voor_jezelf.lesson03.exercise06.vertaal_handen: {"instruction": "Translate into Dutch (informal).", "accepted_answers": [{"value": "Jij wast je handen.", "status": "correct"}, {"value": "Jij wast je handen", "status": "correct"}, {"value": "Je wast je handen.", "status": "correct"}, {"value": "Je wast je handen", "status": "correct"}], "feedback": "The hands are named, so *je* is the possessive and there is no reflexive pronoun."}
  nl.a2.unit103.zorg_voor_jezelf.lesson03.exercise07.schrijf_verveel: {"instruction": "Write the requested Dutch sentence.", "correct_option": "Ik verveel me.", "accepted_answers": [{"value": "Ik verveel me.", "status": "correct"}, {"value": "Ik verveel me", "status": "correct"}], "feedback": "*Ik verveel me.* This verb always has a reflexive pronoun."}
  nl.a2.unit103.zorg_voor_jezelf.lesson04.exercise01.kies_vraag: {"instruction": "Choose the correct Dutch question.", "correct_option": "Voel jij je goed?", "distractors": ["Voel jij goed je?", "Jij voel je goed?", "Voelt jij je goed?"], "accepted_answers": [{"value": "Voel jij je goed?", "status": "correct"}], "feedback": "Verb first, then the subject, then *je*; when *jij* follows the verb, the verb loses its -t."}
  nl.a2.unit103.zorg_voor_jezelf.lesson04.exercise02.kies_daarna: {"instruction": "Choose the correct Dutch sentence.", "correct_option": "Daarna ontspan ik me.", "distractors": ["Daarna ik ontspan me.", "Daarna ontspan me ik.", "Daarna ontspannen ik me."], "accepted_answers": [{"value": "Daarna ontspan ik me.", "status": "correct"}], "feedback": "After *daarna* the verb comes second, then the subject, then *me*."}
  nl.a2.unit103.zorg_voor_jezelf.lesson04.exercise03.match_vragen: {"instruction": "Match each Dutch question or command to its English meaning.", "accepted_answers": [{"value": [{"left": "Voel jij je goed?", "right": "Do you feel well?"}, {"left": "Haast hij zich?", "right": "Is he hurrying?"}, {"left": "Verveel jij je?", "right": "Are you bored?"}, {"left": "Ontspannen jullie je?", "right": "Do you (all) relax?"}, {"left": "Haast je!", "right": "Hurry up!"}, {"left": "Ontspan je!", "right": "Relax!"}, {"left": "Vergist zij zich?", "right": "Is she mistaken?"}], "status": "correct"}], "feedback": "The reflexive pronoun follows the subject in questions, and follows the verb in a command."}
  nl.a2.unit103.zorg_voor_jezelf.lesson04.exercise04.volgorde_thuis: {"instruction": "Put the words in order to say 'Afterwards I relax at home.'", "correct_option": "Daarna ontspan ik me thuis", "accepted_answers": [{"value": "Daarna ontspan ik me thuis", "status": "correct"}, {"value": "Ik ontspan me daarna thuis", "status": "correct"}, {"value": "Thuis ontspan ik me daarna", "status": "correct"}], "feedback": "The time phrase may come first (then the verb comes before ik) or the sentence may start with ik."}
  nl.a2.unit103.zorg_voor_jezelf.lesson04.exercise05.vul_zich: {"instruction": "Complete with the reflexive pronoun.", "correct_option": "zich", "accepted_answers": [{"value": "zich", "status": "correct"}], "feedback": "The reflexive pronoun for *hij* is *zich*, also in a question."}
  nl.a2.unit103.zorg_voor_jezelf.lesson04.exercise06.vertaal_verveel: {"instruction": "Translate into Dutch (informal).", "accepted_answers": [{"value": "Verveel je je?", "status": "correct"}, {"value": "Verveel je je", "status": "correct"}, {"value": "Verveel jij je?", "status": "correct"}, {"value": "Verveel jij je", "status": "correct"}], "feedback": "The first *je* is the subject, the second one is the reflexive pronoun."}
