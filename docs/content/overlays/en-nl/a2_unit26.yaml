teaching:
  nl.a2.unit26.lesson01.teach.bankrekening: {title: "Bank account", gloss: "the bank account", note: "A common gender noun: de bankrekening, a compound of bank and rekening (account).", example_gloss: "I would like to open a bank account."}
  nl.a2.unit26.lesson01.teach.rekening_openen: {title: "Requesting to open an account", gloss: "I would like to open a bank account.", note: "Wil graag softens the request, the same pattern reused throughout this course."}
  nl.a2.unit26.lesson01.teach.welke_rekening: {title: "The employee asks which kind", gloss: "What kind of account would you like to open?", note: "Wat voor + noun asks 'what kind of'; the infinitive openen goes to the end of the question after the modal wilt."}

  nl.a2.unit26.lesson02.teach.betaalrekening: {title: "Payment account", gloss: "the payment/checking account", note: "A common gender noun: de betaalrekening, the standard Dutch everyday current account.", example_gloss: "I would like a payment account for my salary."}
  nl.a2.unit26.lesson02.teach.salaris: {title: "Salary", gloss: "the salary", note: "A neuter noun: het salaris.", example_gloss: "Your employer deposits your salary into this account."}
  nl.a2.unit26.lesson02.teach.betaalrekening_salaris: {title: "Stating the account's purpose", gloss: "I would like a payment account for my salary.", note: "Voor mijn salaris specifies the account's purpose."}
  nl.a2.unit26.lesson02.teach.werkgever_stort: {title: "How salary arrives", gloss: "Your employer deposits your salary into this account.", note: "Storten (to deposit) is the standard verb for a bank transfer of funds; op deze rekening specifies the destination."}
  nl.a2.unit26.lesson02.teach.storten_infinitive: {title: "The infinitive form", gloss: "Storten is the infinitive of stort.", note: "The dictionary/infinitive form, distinct from the third-person conjugated form used in the sentence above."}

  nl.a2.unit26.lesson03.teach.identiteitsbewijs: {title: "Identity document", gloss: "the identity document", note: "A neuter noun: het identiteitsbewijs, the general Dutch term covering a passport or ID card.", example_gloss: "Do you have your BSN number and a valid ID with you?"}
  nl.a2.unit26.lesson03.teach.bsn_nodig: {title: "The employee asks for documents", gloss: "Do you have your BSN number and a valid ID with you?", note: "Bij zich hebben (to have with you/on your person) reuses the formal-register pattern from Unit 24's gemeente visit."}
  nl.a2.unit26.lesson03.teach.hier_is: {title: "Handing over documents", gloss: "Yes, here is my passport and my BSN number.", note: "Hier is (here is) is the natural way to hand something over in Dutch."}

  nl.a2.unit26.lesson04.teach.bankpas: {title: "Bank card", gloss: "the bank card", note: "A common gender noun: de bankpas, the Dutch debit card.", example_gloss: "You will receive your bank card within a week by post."}
  nl.a2.unit26.lesson04.teach.bankpas_uitleg: {title: "Explaining card delivery", gloss: "You will receive your bank card within a week by post.", note: "Binnen een week (within a week) states the timeframe; reuses the ontvangt... per post pattern from Unit 24's BSN number."}
  nl.a2.unit26.lesson04.teach.mobiel_bankieren: {title: "Introducing mobile banking", gloss: "With the app you can also do mobile banking.", note: "Mobiel bankieren (mobile banking) is the standard Dutch term for banking via a smartphone app."}

  nl.a2.unit26.lesson05.teach.folder:
    title: "Read a bank account folder"
    gloss: "To open a payment account you need a valid identity document and your BSN number. Your employer uses this account to deposit your salary. After opening, you will receive a bank card by post within a week."
    note: "Track the required documents, the account's purpose, and when the card arrives."
    glosses:
      betaalrekening: "payment/checking account"
      openen: "to open"
      heeft: "have (formal 'heeft u ... nodig' = you need)"
      geldig: "valid"
      identiteitsbewijs: "identity document / ID"
      BSN-nummer: "citizen service number (Dutch social/tax ID)"
      nodig: "needed ('nodig hebben' = to need)"
      werkgever: "employer"
      gebruikt: "uses (3rd-person of gebruiken)"
      rekening: "account"
      salaris: "salary"
      storten: "to deposit (transfer funds)"
      opening: "opening (of the account)"
      ontvangt: "receive (formal 'u ontvangt' = you receive)"
      binnen: "within"
      week: "week"
      bankpas: "bank card / debit card"
      post: "post / mail ('per post' = by mail)"
  nl.a2.unit26.lesson05.teach.ik_heb_nodig: {title: "Stating what you personally need", gloss: "I need a valid identity document and my BSN number.", note: "Heb is the ik-form of hebben, used here instead of the folder's formal heeft u ... nodig to state the same requirement from your own point of view."}

  nl.a2.unit26.lesson06.teach.medewerker_greet: {title: "The employee greets Omar", gloss: "Employee: Good morning, how can I help you?", note: "Waarmee kan ik u helpen? reuses the standard formal service greeting from Unit 24's gemeente visit."}
  nl.a2.unit26.lesson06.teach.omar_state_purpose: {title: "Omar states his purpose", gloss: "Omar: Good morning, I would like to open a payment account for my salary.", note: "Combines the requests from lesson01 and lesson02 into one natural opening line."}
  nl.a2.unit26.lesson06.teach.medewerker_ask_documents: {title: "The employee asks for documents", gloss: "Employee: Of course. Do you have your BSN number and a valid ID with you?", note: "Matches lesson03's teaching phrase exactly."}
  nl.a2.unit26.lesson06.teach.omar_hand_over: {title: "Omar hands them over", gloss: "Omar: Yes, here is my passport and my BSN number.", note: "Matches the BSN number Omar received in Unit 24."}
  nl.a2.unit26.lesson06.teach.medewerker_confirm: {title: "The employee confirms", gloss: "Employee: Thank you. You will receive your bank card within a week by post, and with the app you can also do mobile banking.", note: "Combines the card-delivery and mobile-banking facts from lesson04."}
  nl.a2.unit26.lesson06.teach.omar_thanks: {title: "Omar thanks the employee", gloss: "Omar: Perfect, thank you very much for your help!", note: "Reuses the dank u wel voor uw hulp closing from Unit 24's gemeente visit."}
  nl.a2.unit26.lesson06.teach.summary_grammar: {title: "Summarizing the visit", gloss: "Omar opened a bank account. He will receive his bank card by post.", note: "Heeft ... geopend is the present-perfect form of openen (geopend is the past participle); zijn here is the possessive 'his'."}

exercises:
  nl.a2.unit26.lesson01.exercise01.choose_open_account:
    instruction: "Choose the Dutch sentence meaning 'I would like to open a bank account.'"
    correct_option: "Ik wil graag een bankrekening openen."
    distractors: ["Ik wil graag een bankrekening open.", "Ik wil graag openen een bankrekening.", "Ik heb graag een bankrekening openen."]
    accepted_answers: [{value: "Ik wil graag een bankrekening openen.", status: correct}]
    feedback: "Wil graag softens the request; openen is the infinitive at the end of the clause."
  nl.a2.unit26.lesson01.exercise02.listen_open_account:
    instruction: "Listen and choose what the speaker says."
    correct_option: "I would like to open a bank account."
    distractors: ["What kind of account would you like to open?", "I would like to open a payment account.", "I have a bank account already."]
    accepted_answers: [{value: "I would like to open a bank account.", status: correct}]
    feedback: "Ik wil graag een bankrekening openen."
  nl.a2.unit26.lesson01.exercise03.match_account_words:
    instruction: "Match each Dutch phrase to its meaning."
    accepted_answers: [{value: [{left: "de bankrekening", right: "the bank account"}, {left: "een rekening openen", right: "to open an account"}, {left: "Wat voor rekening wilt u openen?", right: "What kind of account would you like to open?"}], status: correct}]
    feedback: "Bankrekening is the noun; openen is the verb for creating one."
  nl.a2.unit26.lesson01.exercise04.order_open_account:
    instruction: "Put the words in order to say you would like to open a bank account."
    correct_option: "Ik wil graag een bankrekening openen"
    accepted_answers: [{value: "Ik wil graag een bankrekening openen", status: correct}]
    feedback: "The complete sentence is Ik wil graag een bankrekening openen."
  nl.a2.unit26.lesson01.exercise05.listen_order_which_account:
    instruction: "Listen and put the words in the order you hear."
    correct_option: "Wat voor rekening wilt u openen"
    accepted_answers: [{value: "Wat voor rekening wilt u openen", status: correct}]
    feedback: "The complete question is Wat voor rekening wilt u openen?"
  nl.a2.unit26.lesson01.exercise06.complete_open_account:
    instruction: "Complete the sentence."
    accepted_answers: [{value: openen, status: correct}]
    feedback: "Ik wil graag een bankrekening openen."
