course:
  title: Dutch B2
  description: >-
    Upper-intermediate Dutch: speculate about causes and consequences with
    graded certainty -- say what may, might, must, or cannot be the case in
    the present and the past (misschien, waarschijnlijk, zal wel, moet wel,
    zou ... kunnen, kan niet ... zijn, moet ... hebben), and tell an
    evidence-based deduction apart from a guess, around the everyday puzzle
    of a friend who is running late.

units:
  nl.b2.unit02.speculatie:
    title: "Speculation"
    description: Speculate about why something is happening -- weigh how certain you are, deduce a cause from evidence, guess where you have none, and speculate about both a present and a past cause.

lessons:
  nl.b2.unit02.lesson01.hoe_zeker:
    title: "How certain are you?"
  nl.b2.unit02.lesson02.deductie:
    title: "Deduction: it must be so"
  nl.b2.unit02.lesson03.mogelijkheid:
    title: "A guess or a deduction?"
  nl.b2.unit02.lesson04.het_verleden:
    title: "Speculating about the past"
  nl.b2.unit02.lesson05.een_tekst_lezen:
    title: "Fact or speculation?"
  nl.b2.unit02.lesson06.speculeren_in_gesprek:
    title: "Speculating in conversation"

teaching:
  nl.b2.unit02.lesson01.teach.bram_te_laat:
    title: "Bram isn't here yet."
    gloss: "Bram isn't here yet."
    note: "The situation this whole unit speculates about: your friend Bram is running late. *Er* is the 'there' that Dutch needs in *hij is er niet* ('he isn't here')."
  nl.b2.unit02.lesson01.teach.waarom_zo_laat:
    title: "Why is he so late?"
    gloss: "Why is he so late?"
    note: "*Te laat* = 'too late / late'; *zo laat* = 'so late'. This is the question every lesson answers with a different degree of certainty."
  nl.b2.unit02.lesson01.teach.onderweg:
    title: "on the way"
    gloss: "on the way / en route"
    note: "*Onderweg* = 'on the way'. It pairs with a certainty word to make your first guess: *Hij is waarschijnlijk onderweg*. *Zijn* here is the infinitive 'to be', which goes to the end after a modal: *...zal wel onderweg zijn*."
    example_gloss: "He is on the way."
  nl.b2.unit02.lesson01.teach.misschien:
    title: maybe
    gloss: "maybe / perhaps"
    note: "*Misschien* is the lowest rung of certainty -- an open guess. Because it opens the sentence, the verb comes straight after: *Misschien is hij onderweg*."
    example_gloss: "Maybe he is on the way."
  nl.b2.unit02.lesson01.teach.waarschijnlijk:
    title: probably
    gloss: probably
    note: "*Waarschijnlijk* = 'probably' -- more certain than *misschien*, less than a full deduction. It sits comfortably mid-sentence: *Hij is waarschijnlijk onderweg*."
    example_gloss: "He is probably on the way."
  nl.b2.unit02.lesson01.teach.vast_wel:
    title: "surely (I bet)"
    gloss: "surely / I bet (he...)"
    note: "*Vast wel* is an everyday, confident hedge -- 'he's sure to...', 'I bet he...'. *Hij komt vast wel* = 'he's bound to come'. It is a guess spoken with confidence, not proof."
    example_gloss: "He's sure to come."
  nl.b2.unit02.lesson01.teach.zal_wel:
    title: "is most likely (presumably)"
    gloss: "is most likely / presumably"
    note: "*Zal wel* is the classic Dutch deduction hedge. Despite *zal* (from 'zullen'), it is NOT a plain future 'will' here -- *Hij zal wel onderweg zijn* means 'he's most likely on his way'. The infinitive goes to the end."
    example_gloss: "He's most likely on the way."
  nl.b2.unit02.lesson01.teach.ongetwijfeld:
    title: undoubtedly
    gloss: undoubtedly
    note: "*Ongetwijfeld* = 'undoubtedly' -- near the top of the certainty scale, stronger than *waarschijnlijk*."
    example_gloss: "He is undoubtedly busy."
  nl.b2.unit02.lesson01.teach.zeker:
    title: "certainly / for sure"
    gloss: "certainly / for sure"
    note: "*Zeker* = 'certainly / for sure', the top of the scale. *Ik weet het zeker* = 'I know it for sure'; *ik weet het niet zeker* = 'I'm not sure' (lesson 3)."
    example_gloss: "He is sure to come."
  nl.b2.unit02.lesson01.teach.grammar_zekerheidsschaal:
    title: "Maybe he is on the way. He is probably on the way. He's most likely on the way. He is undoubtedly on the way."
    gloss: "Maybe he is on the way. He is probably on the way. He's most likely on the way. He is undoubtedly on the way."
    note: "Speculation is graded: the same guess can be voiced at different strengths. Low to high: *misschien / wellicht* < *waarschijnlijk* < *vast wel / zal wel* < *ongetwijfeld / zeker*. Choosing the right rung is the core skill of this unit."

  nl.b2.unit02.lesson02.teach.moeten:
    title: "must (deduction)"
    gloss: "must / has to (deduction)"
    note: "English 'must' is both a rule ('you must go') and a deduction ('he must be tired'). Here *moet* is the DEDUCTION 'must' -- a conclusion forced by the evidence. *Moet wel* strengthens it: 'he simply must be...'. The infinitive goes to the end: *...moet wel onderweg zijn*."
    example_gloss: "He must be on the way."
  nl.b2.unit02.lesson02.teach.file:
    title: "traffic jam"
    gloss: "the traffic jam"
    note: "*In de file staan* = 'to be stuck in traffic' (literally 'to stand in the queue'). Dutch uses *staan*, not *zijn*, for being stuck in a jam: *Hij staat in de file*."
    example_gloss: "He is stuck in traffic."
  nl.b2.unit02.lesson02.teach.moet_file:
    title: "He must be stuck in traffic."
    gloss: "He must be stuck in traffic."
    note: "A present deduction: given rush hour, the traffic jam is the forced conclusion. *Moet wel ... staan* = 'must (surely) be stuck'."
  nl.b2.unit02.lesson02.teach.kan_niet_zijn:
    title: "cannot be..."
    gloss: "cannot be..."
    note: "*Kan niet ... zijn* is the negative deduction -- ruling a cause out. *Hij kan niet ziek zijn* = 'he can't be sick' (I have evidence against it). It is the mirror image of *moet wel*."
    example_gloss: "He cannot be sick."
  nl.b2.unit02.lesson02.teach.dat_kan_niet:
    title: "That's impossible."
    gloss: "That's impossible. / That can't be."
    note: "*Dat kan niet* flatly rules a suggestion out -- 'that can't be the case'. The strongest way to reject a proposed cause."
  nl.b2.unit02.lesson02.teach.want:
    title: because
    gloss: "because / for"
    note: "*Want* introduces the EVIDENCE behind a deduction and keeps normal (main-clause) word order: *...want ik zag hem net* ('...because I just saw him'). Evidence is what turns a guess into a deduction."
    example_gloss: "He can't be sick, because I just saw him."
  nl.b2.unit02.lesson02.teach.dus:
    title: "so / therefore"
    gloss: "so / therefore"
    note: "*Dus* draws the conclusion from evidence: *Zijn auto is weg, dus hij moet onderweg zijn* ('his car is gone, so he must be on the way'). Evidence + *dus* + *moet* is the shape of a deduction."
    example_gloss: "His car is gone, so he must be on the way."
  nl.b2.unit02.lesson02.teach.grammar_deductie:
    title: "His car is gone, so he must be on the way. He can't be sick, because I just saw him."
    gloss: "His car is gone, so he must be on the way. He can't be sick, because I just saw him."
    note: "A deduction is a conclusion FORCED by evidence, not a free guess. Signal it with *moet (wel)* for the forced cause and *kan niet* for a ruled-out one, and back it with evidence via *want* or *dus*."

  nl.b2.unit02.lesson03.teach.zou_kunnen:
    title: "might / could"
    gloss: "might / could (be)"
    note: "*Zou ... kunnen* is the tentative 'might / could' -- a possibility you float without evidence. Word order stacks the verbs at the end: *Hij zou in de file kunnen staan* ('he could be stuck in traffic'). Weaker than *moet*."
    example_gloss: "He might be stuck in traffic."
  nl.b2.unit02.lesson03.teach.wellicht:
    title: "perhaps / possibly"
    gloss: "perhaps / possibly"
    note: "*Wellicht* is a slightly more written cousin of *misschien* ('perhaps'). Like *misschien*, opening with it puts the verb next: *Wellicht is hij nog thuis*."
    example_gloss: "Perhaps he is still at home."
  nl.b2.unit02.lesson03.teach.weten:
    title: "to know"
    gloss: "to know"
    note: "*Ik weet het niet zeker* = 'I'm not sure' -- the honest label on a guess. Contrast *ik weet het zeker* ('I know for sure'). Marking your uncertainty is part of speculating well."
    example_gloss: "I don't know for sure."
  nl.b2.unit02.lesson03.teach.gokken:
    title: "to guess"
    gloss: "to guess"
    note: "*Ik gok dat...* = 'I guess that...' -- explicitly flags that you have NO firm evidence. This is the opposite pole from a deduction (*moet*, backed by *want/dus*)."
    example_gloss: "I guess that he is at home."
  nl.b2.unit02.lesson03.teach.grammar_gok_vs_deductie:
    title: "I guess he is at home, but I'm not sure. His car is gone, so he must be on the way."
    gloss: "I guess he is at home, but I'm not sure. His car is gone, so he must be on the way."
    note: "Guess vs deduction: a GUESS (*misschien*, *zou ... kunnen*, *ik gok*) rests on nothing firm and you can flag it with *ik weet het niet zeker*; a DEDUCTION (*moet*, *kan niet*) is forced by evidence you can give with *want* or *dus*. Same topic, very different certainty."

  nl.b2.unit02.lesson04.teach.hebben:
    title: "to have"
    gloss: "to have"
    note: "*Hebben* ('to have', he/she form *heeft*) is the auxiliary you need for past speculation: *moet ... gemist hebben* ('must have missed'). It sits at the very end of the verb cluster."
    example_gloss: "He must be busy."
  nl.b2.unit02.lesson04.teach.trein_gemist:
    title: "to miss the train"
    gloss: "to miss the train"
    note: "*De trein missen* = 'to miss the train'; past participle *gemist*. *Hij heeft de trein gemist* = 'he missed the train' (a stated fact) -- next card turns it into speculation."
    example_gloss: "He missed the train."
  nl.b2.unit02.lesson04.teach.moet_gemist_hebben:
    title: "He must have missed the train."
    gloss: "He must have missed the train."
    note: "PAST deduction. The frame is *moet + [past participle] + hebben*: *moet de trein gemist hebben*. English puts 'have' before the participle ('must HAVE missed'); Dutch puts *hebben* last."
  nl.b2.unit02.lesson04.teach.gebeuren:
    title: "to happen"
    gloss: "to happen"
    note: "*Gebeuren* ('to happen') takes *zijn*, not *hebben*, in the past: *Er moet iets gebeurd zijn* = 'something must have happened'. Use *moet ... zijn* for verbs of motion/change."
    example_gloss: "Something must have happened."
  nl.b2.unit02.lesson04.teach.verslapen:
    title: "to oversleep"
    gloss: "to oversleep"
    note: "*Zich verslapen* is reflexive ('to oversleep'): *Hij moet zich verslapen hebben* = 'he must have overslept'. The reflexive *zich* stays with the verb inside the cluster."
    example_gloss: "He must have overslept."
  nl.b2.unit02.lesson04.teach.afspraak_vergeten:
    title: "to forget the appointment"
    gloss: "to forget the appointment"
    note: "*De afspraak vergeten* = 'to forget the appointment'; *vergeten* is its own past participle and here takes *zijn*: *Hij moet de afspraak vergeten zijn* = 'he must have forgotten the appointment'."
    example_gloss: "He must have forgotten the appointment."
  nl.b2.unit02.lesson04.teach.zou_kunnen_hebben:
    title: "might have..."
    gloss: "might have (done)"
    note: "PAST possibility -- weaker than *moet ... hebben*. The frame stacks four verbs at the end: *Hij zou de trein gemist kunnen hebben* = 'he might have missed the train'. Order: *zou ... [participle] kunnen hebben*."
    example_gloss: "He might have missed the train."
  nl.b2.unit02.lesson04.teach.grammar_verleden:
    title: "He must have missed the train. Something must have happened. He might have overslept."
    gloss: "He must have missed the train. Something must have happened. He might have overslept."
    note: "Speculating about the PAST: *moet ... hebben/zijn + participle* for a deduction ('must have'), *zou ... kunnen hebben* for a possibility ('might have'). Pick *hebben* or *zijn* by the verb, exactly as in a normal perfect tense."

  nl.b2.unit02.lesson05.teach.tekst:
    title: "Reading: where is Bram?"
    gloss: "Bram was going to come this evening, but he isn't here yet. His phone is off. He's most likely stuck in traffic, because it's rush hour. Maybe he overslept, but I'm not sure about that. One thing is certain: he isn't home yet, because his car is gone."
    glosses:
      zou: "would (here: was going to)"
      vanavond: "this evening"
      komen: "to come"
      maar: "but"
      er: "here (the 'there' Dutch needs in 'hij is er niet')"
      nog: "yet / still"
      Zijn: "his"
      telefoon: "phone"
      staat: "is (lit. stands; 'staat uit' = is off)"
      uit: "off / out"
      zal: "will (here a deduction hedge with 'wel', not a plain future)"
      wel: "surely (with 'zal'/'moet' it marks a deduction)"
      file: "traffic jam"
      staan: "to stand; here 'be stuck' (in traffic)"
      want: "because / for"
      spitsuur: "rush hour"
      Misschien: "maybe / perhaps"
      heeft: "has (auxiliary for the perfect tense)"
      zich: "himself (reflexive, with verslapen)"
      verslapen: "overslept (past participle of zich verslapen, to oversleep)"
      dat: "that"
      weet: "know (1st person of weten, to know)"
      zeker: "sure / certain"
      Eén: "one"
      ding: "thing"
      thuis: "(at) home"
      zijn: "his"
      auto: "car"
      weg: "gone / away"

  nl.b2.unit02.lesson06.teach.vanochtend:
    title: "this morning"
    gloss: "this morning"
    note: "*Ik sprak hem vanochtend nog* = 'I spoke to him just this morning' -- the kind of evidence that lets you rule a cause out. *Sprak* is the past of *spreken* ('to speak')."
    example_gloss: "I spoke to him just this morning."
  nl.b2.unit02.lesson06.teach.dan:
    title: "then"
    gloss: "then / in that case"
    note: "*Dan* draws the next inference once one cause is ruled out: *Dan moet hij de trein gemist hebben* ('then he must have missed the train'). Opening with it puts the verb next."
    example_gloss: "Then he must have missed the train."
  nl.b2.unit02.lesson06.teach.nee:
    title: "no"
    gloss: "no"
    note: "*Nee* rejects a suggested cause before you give the counter-evidence: *Nee, dat kan niet. Ik sprak hem vanochtend nog.*"
    example_gloss: "No, that's impossible."
  nl.b2.unit02.lesson06.teach.dialogue_lotte_setup:
    title: "Lotte: Bram isn't here yet. Why is he so late?"
    gloss: "Lotte: Bram isn't here yet. Why is he so late?"
  nl.b2.unit02.lesson06.teach.dialogue_omar_deduction:
    title: "Omar: He's most likely stuck in traffic. It's rush hour."
    gloss: "Omar: He's most likely stuck in traffic. It's rush hour."
  nl.b2.unit02.lesson06.teach.dialogue_lotte_possibility:
    title: "Lotte: Could he have overslept?"
    gloss: "Lotte: Could he have overslept?"
  nl.b2.unit02.lesson06.teach.dialogue_omar_rule_out:
    title: "Omar: No, that's impossible. I spoke to him just this morning."
    gloss: "Omar: No, that's impossible. I spoke to him just this morning."
  nl.b2.unit02.lesson06.teach.dialogue_lotte_past_deduction:
    title: "Lotte: Then he must have missed the train."
    gloss: "Lotte: Then he must have missed the train."
  nl.b2.unit02.lesson06.teach.dialogue_omar_guess:
    title: "Omar: Maybe. I'm not sure."
    gloss: "Omar: Maybe. I'm not sure."
  nl.b2.unit02.lesson06.teach.grammar_volledige_speculatie:
    title: "He must have missed the train. He is probably stuck in traffic. He might have overslept, but I'm not sure about that."
    gloss: "He must have missed the train. He is probably stuck in traffic. He might have overslept, but I'm not sure about that."
    note: "Real speculation mixes tenses and certainty levels: a PAST deduction (*moet ... gemist hebben*), a PRESENT probability (*waarschijnlijk*), and a hedged possibility (*zou ... kunnen hebben*, flagged with *ik weet het niet zeker*). This is exactly what you produce in this lesson's speaking and writing tasks."

exercises:
  nl.b2.unit02.lesson01.exercise01.recognize_misschien:
    instruction: "What does this word mean?"
    correct_option: maybe
    distractors: [undoubtedly, certainly, probably]
    accepted_answers: [{value: maybe, status: correct}]
    feedback: "Misschien means maybe -- the lowest, most open rung of certainty."
  nl.b2.unit02.lesson01.exercise02.listen_zal_wel:
    instruction: "Listen and select what you hear."
    correct_option: "He's most likely on the way."
    distractors: ["He is undoubtedly on the way.", "He might be on the way.", "He is on the way for sure."]
    accepted_answers: [{value: "He's most likely on the way.", status: correct}]
    feedback: "Hij zal wel onderweg zijn means he's most likely on the way -- zal wel is a deduction hedge, not a plain future."
  nl.b2.unit02.lesson01.exercise08.dictation_zal_wel_onderweg:
    instruction: "Type what you hear."
    correct_response: "Hij zal wel onderweg zijn"
    orthography_strict: true
    feedback: "You heard Hij zal wel onderweg zijn — he's most likely on the way."
  nl.b2.unit02.lesson01.exercise03.match_certainty_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {misschien: maybe, waarschijnlijk: probably, "vast wel": "surely (I bet)", "zal wel": "is most likely (presumably)", ongetwijfeld: undoubtedly, zeker: "certainly / for sure", onderweg: "on the way", "te laat": late}
        status: correct
    feedback: "These are this lesson's certainty words, from the most open guess (misschien) to near-certainty (ongetwijfeld, zeker)."
  nl.b2.unit02.lesson01.exercise04.order_zal_wel:
    instruction: "Put the words in order: He's most likely on the way."
    accepted_answers:
      - {value: "Hij zal wel onderweg zijn", status: correct}
    feedback: "Hij zal wel onderweg zijn -- the infinitive zijn goes to the end after the modal zal."
  nl.b2.unit02.lesson01.exercise05.translate_waarschijnlijk:
    instruction: "Translate into Dutch, using waarschijnlijk: He is probably on the way."
    accepted_answers:
      - {value: "Hij is waarschijnlijk onderweg", status: correct}
      - {value: "Waarschijnlijk is hij onderweg", status: correct}
    feedback: "Hij is waarschijnlijk onderweg means he is probably on the way."
  nl.b2.unit02.lesson01.exercise06.speak_ongetwijfeld:
    instruction: "Say aloud in Dutch, using ongetwijfeld: He is undoubtedly busy."
    accepted_answers:
      - {value: "Hij is ongetwijfeld druk", status: correct}
      - {value: "Ongetwijfeld is hij druk", status: correct}
      - {value: "Hij heeft het ongetwijfeld druk", status: correct}
    feedback: "Hij is ongetwijfeld druk means he is undoubtedly busy."
  nl.b2.unit02.lesson01.exercise07.write_bram_te_laat:
    instruction: "Write in Dutch: Bram isn't here yet."
    accepted_answers:
      - {value: "Bram is er nog niet", status: correct}
      - {value: "Bram is nog niet hier", status: correct}
      - {value: "Bram is er nog niet", status: correct}
    feedback: "Bram is er nog niet means Bram isn't here yet."

  nl.b2.unit02.lesson02.exercise01.recognize_moet:
    instruction: "In a speculation, what does this word express?"
    correct_option: "must (a deduction)"
    distractors: ["is allowed to", "wants to", "is able to"]
    accepted_answers: [{value: "must (a deduction)", status: correct}]
    feedback: "Here moet is the deduction 'must' -- a conclusion forced by the evidence, not an obligation."
  nl.b2.unit02.lesson02.exercise02.listen_moet_file:
    instruction: "Listen and select what you hear."
    correct_option: "He must be stuck in traffic."
    distractors: ["He might be stuck in traffic.", "He can't be stuck in traffic.", "He is probably stuck in traffic."]
    accepted_answers: [{value: "He must be stuck in traffic.", status: correct}]
    feedback: "Hij moet wel in de file staan means he must be stuck in traffic -- moet wel marks a firm deduction."
  nl.b2.unit02.lesson02.exercise08.dictation_moet_file:
    instruction: "Type what you hear."
    correct_response: "Hij moet wel in de file staan"
    orthography_strict: true
    feedback: "You heard Hij moet wel in de file staan — he must be stuck in traffic."
  nl.b2.unit02.lesson02.exercise03.match_deduction_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {moet: "must (deduction)", "kan niet": "cannot (be)", want: because, dus: "so / therefore", "in de file": "stuck in traffic", ziek: sick, auto: car, weg: "gone / away"}
        status: correct
    feedback: "These are the words of deduction: moet / kan niet draw the conclusion, want / dus give the evidence."
  nl.b2.unit02.lesson02.exercise04.order_kan_niet_ziek:
    instruction: "Put the words in order: He cannot be sick."
    accepted_answers:
      - {value: "Hij kan niet ziek zijn", status: correct}
    feedback: "Hij kan niet ziek zijn -- kan niet ... zijn rules a cause out."
  nl.b2.unit02.lesson02.exercise05.translate_moet_file:
    instruction: "Translate into Dutch, using moet wel (deduction): He must be stuck in traffic."
    accepted_answers:
      - {value: "Hij moet wel in de file staan", status: correct}
    feedback: "Hij moet wel in de file staan means he must be stuck in traffic."
  nl.b2.unit02.lesson02.exercise06.write_kan_niet_ziek:
    instruction: "Write in Dutch, using kan niet: He cannot be sick."
    accepted_answers:
      - {value: "Hij kan niet ziek zijn", status: correct}
    feedback: "Hij kan niet ziek zijn means he cannot be sick."
  nl.b2.unit02.lesson02.exercise07.translate_want:
    instruction: "Translate into Dutch, using want to give your evidence: He cannot be sick, because I saw him just now."
    accepted_answers:
      - {value: "Hij kan niet ziek zijn, want ik zag hem net", status: correct}
      - {value: "Hij kan niet ziek zijn want ik zag hem net", status: correct}
      - {value: "Hij kan niet ziek zijn, want ik heb hem net gezien", status: correct}
      - {value: "Hij kan niet ziek zijn want ik heb hem net gezien", status: correct}
    feedback: "Hij kan niet ziek zijn, want ik zag hem net means he cannot be sick, because I saw him just now."

  nl.b2.unit02.lesson03.exercise01.recognize_wellicht:
    instruction: "What does this word mean?"
    correct_option: "perhaps / possibly"
    distractors: [undoubtedly, "so / therefore", because]
    accepted_answers: [{value: "perhaps / possibly", status: correct}]
    feedback: "Wellicht means perhaps -- a tentative guess, close to misschien."
  nl.b2.unit02.lesson03.exercise02.listen_zou_kunnen:
    instruction: "Listen and select what you hear."
    correct_option: "He might be stuck in traffic."
    distractors: ["He must be stuck in traffic.", "He is stuck in traffic.", "He can't be stuck in traffic."]
    accepted_answers: [{value: "He might be stuck in traffic.", status: correct}]
    feedback: "Hij zou in de file kunnen staan means he might be stuck in traffic -- zou ... kunnen is a possibility, weaker than moet."
  nl.b2.unit02.lesson03.exercise03.match_possibility_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {"zou ... kunnen": "might / could", wellicht: "perhaps / possibly", misschien: maybe, thuis: "at home", "ik gok": "I guess", "ik weet het niet zeker": "I'm not sure"}
        status: correct
    feedback: "These flag a guess rather than a deduction: zou ... kunnen, wellicht and ik gok all leave room for doubt."
  nl.b2.unit02.lesson03.exercise04.order_zou_kunnen:
    instruction: "Put the words in order: He might be stuck in traffic."
    accepted_answers:
      - {value: "Hij zou in de file kunnen staan", status: correct}
    feedback: "Hij zou in de file kunnen staan -- zou ... kunnen staan stacks the verbs at the end."
  nl.b2.unit02.lesson03.exercise05.translate_zou_kunnen_thuis:
    instruction: "Translate into Dutch, using zou ... kunnen: He might be at home."
    accepted_answers:
      - {value: "Hij zou thuis kunnen zijn", status: correct}
    feedback: "Hij zou thuis kunnen zijn means he might be at home."
  nl.b2.unit02.lesson03.exercise06.speak_misschien_thuis:
    instruction: "Say aloud in Dutch, guessing: Maybe he is still at home."
    accepted_answers:
      - {value: "Misschien is hij nog thuis", status: correct}
      - {value: "Hij is misschien nog thuis", status: correct}
    feedback: "Misschien is hij nog thuis means maybe he is still at home."
  nl.b2.unit02.lesson03.exercise07.write_niet_zeker:
    instruction: "Write in Dutch, signalling you are only guessing: I don't know for sure."
    accepted_answers:
      - {value: "Ik weet het niet zeker", status: correct}
      - {value: "Dat weet ik niet zeker", status: correct}
    feedback: "Ik weet het niet zeker means I don't know for sure -- the honest label on a guess."

  nl.b2.unit02.lesson04.exercise01.recognize_gemist:
    instruction: "What does this word mean?"
    correct_option: missed
    distractors: [forgotten, happened, overslept]
    accepted_answers: [{value: missed, status: correct}]
    feedback: "Gemist is the past participle of missen -- 'missed', as in de trein gemist."
  nl.b2.unit02.lesson04.exercise02.listen_moet_trein:
    instruction: "Listen and select what you hear."
    correct_option: "He must have missed the train."
    distractors: ["He might have missed the train.", "He must miss the train.", "He must have caught the train."]
    accepted_answers: [{value: "He must have missed the train.", status: correct}]
    feedback: "Hij moet de trein gemist hebben means he must have missed the train -- a past deduction."
  nl.b2.unit02.lesson04.exercise03.match_past_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {"moet ... hebben": "must have (done)", "zou ... kunnen hebben": "might have (done)", trein: train, gemist: missed, vergeten: forgotten, "zich verslapen": overslept, gebeurd: happened, afspraak: appointment}
        status: correct
    feedback: "These build past speculation: moet ... hebben for a past deduction, zou ... kunnen hebben for a past possibility."
  nl.b2.unit02.lesson04.exercise04.order_moet_gemist:
    instruction: "Put the words in order: He must have missed the train."
    accepted_answers:
      - {value: "Hij moet de trein gemist hebben", status: correct}
      - {value: "Hij moet de trein hebben gemist", status: correct}
    feedback: "Hij moet de trein gemist hebben -- the auxiliary hebben goes to the very end."
  nl.b2.unit02.lesson04.exercise05.translate_moet_gemist:
    instruction: "Translate into Dutch, using moet ... hebben (must have): He must have missed the train."
    accepted_answers:
      - {value: "Hij moet de trein gemist hebben", status: correct}
      - {value: "Hij moet de trein hebben gemist", status: correct}
    feedback: "Hij moet de trein gemist hebben means he must have missed the train."
  nl.b2.unit02.lesson04.exercise06.write_iets_gebeurd:
    instruction: "Write in Dutch, using moet ... zijn (must have): Something must have happened."
    accepted_answers:
      - {value: "Er moet iets gebeurd zijn", status: correct}
      - {value: "Er moet iets zijn gebeurd", status: correct}
    feedback: "Er moet iets gebeurd zijn means something must have happened -- gebeuren takes zijn, not hebben."
  nl.b2.unit02.lesson04.exercise07.translate_zou_kunnen_verslapen:
    instruction: "Translate into Dutch, using zou ... kunnen hebben (might have): He might have overslept."
    accepted_answers:
      - {value: "Hij zou zich verslapen kunnen hebben", status: correct}
      - {value: "Hij zou zich kunnen hebben verslapen", status: correct}
    feedback: "Hij zou zich verslapen kunnen hebben means he might have overslept -- a hedged past possibility."

  nl.b2.unit02.lesson05.exercise01.read_fact:
    instruction: "Which of these does the writer state as a FACT, not as speculation?"
    correct_option: "His car is gone."
    distractors: ["He is stuck in traffic.", "He overslept.", "He missed the train."]
    accepted_answers: [{value: "His car is gone.", status: correct}]
    feedback: "Zijn auto is weg is stated flatly as a fact; the traffic jam and oversleeping are hedged with zal wel and misschien."
  nl.b2.unit02.lesson05.exercise02.read_guess:
    instruction: "Which cause does the writer only GUESS at, admitting they are not sure?"
    correct_option: "That he overslept."
    distractors: ["That his phone is off.", "That it is rush hour.", "That his car is gone."]
    accepted_answers: [{value: "That he overslept.", status: correct}]
    feedback: "Misschien heeft hij zich verslapen, maar dat weet ik niet zeker -- the writer flags oversleeping as an unsure guess."
  nl.b2.unit02.lesson05.exercise03.read_deduction:
    instruction: "How certain is the writer that Bram is stuck in traffic, and on what basis?"
    correct_option: "Fairly certain -- a deduction from it being rush hour."
    distractors: ["Completely unsure -- a wild guess with no reason.", "Certain it is false.", "The writer does not mention it."]
    accepted_answers: [{value: "Fairly certain -- a deduction from it being rush hour.", status: correct}]
    feedback: "Hij zal wel in de file staan, want het is spitsuur -- zal wel plus the evidence want het is spitsuur makes this a confident deduction."
  nl.b2.unit02.lesson05.exercise04.read_evidence:
    instruction: "What is the writer's evidence that Bram is not at home?"
    correct_option: "His car is gone."
    distractors: ["His phone is off.", "It is rush hour.", "He missed the train."]
    accepted_answers: [{value: "His car is gone.", status: correct}]
    feedback: "Hij is nog niet thuis, want zijn auto is weg -- the missing car is the evidence."
  nl.b2.unit02.lesson05.exercise05.match_reading_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {vanavond: "this evening", telefoon: phone, uit: "off / out", spitsuur: "rush hour", ding: thing, één: one}
        status: correct
    feedback: "These are the reading's key words."
  nl.b2.unit02.lesson05.exercise06.translate_telefoon_uit:
    instruction: "Translate into Dutch: His phone is off."
    accepted_answers:
      - {value: "Zijn telefoon staat uit", status: correct}
      - {value: "Zijn telefoon is uit", status: correct}
    feedback: "Zijn telefoon staat uit means his phone is off -- Dutch says the phone 'stands off'."
  nl.b2.unit02.lesson05.exercise07.write_spitsuur:
    instruction: "Write in Dutch: It is rush hour."
    accepted_answers:
      - {value: "Het is spitsuur", status: correct}
    feedback: "Het is spitsuur means it is rush hour."

  nl.b2.unit02.lesson06.exercise01.comprehend_first_cause:
    instruction: "What is Omar's first explanation for why Bram is late?"
    correct_option: "He is probably stuck in traffic."
    distractors: ["He overslept.", "He missed the train.", "He forgot the appointment."]
    accepted_answers: [{value: "He is probably stuck in traffic.", status: correct}]
    feedback: "Omar's first guess: Hij zal wel in de file staan. Het is spitsuur -- a deduction from rush hour."
  nl.b2.unit02.lesson06.exercise02.comprehend_certainty:
    instruction: "When Omar says 'Nee, dat kan niet' about oversleeping, how certain is he, and why?"
    correct_option: "Certain it is not the case -- he rules it out because he spoke to Bram this morning."
    distractors: ["He thinks it is likely.", "He is only guessing.", "He is not sure either way."]
    accepted_answers: [{value: "Certain it is not the case -- he rules it out because he spoke to Bram this morning.", status: correct}]
    feedback: "Nee, dat kan niet. Ik sprak hem vanochtend nog -- dat kan niet rules the cause out, and the evidence (I spoke to him this morning) makes it a firm deduction."
  nl.b2.unit02.lesson06.exercise03.comprehend_guess:
    instruction: "Is Omar's final line ('Misschien. Ik weet het niet zeker.') a deduction or a guess?"
    correct_option: "A guess -- he has no firm evidence and says so."
    distractors: ["A deduction from clear evidence.", "A statement of certain fact.", "A ruled-out cause."]
    accepted_answers: [{value: "A guess -- he has no firm evidence and says so.", status: correct}]
    feedback: "Misschien and ik weet het niet zeker both flag a guess -- Omar offers a possibility without backing it with evidence."
  nl.b2.unit02.lesson06.exercise04.order_zou_verslapen:
    instruction: "Put the words in order: He might have overslept."
    accepted_answers:
      - {value: "Hij zou zich verslapen kunnen hebben", status: correct}
      - {value: "Hij zou zich kunnen hebben verslapen", status: correct}
    feedback: "Hij zou zich verslapen kunnen hebben -- the four-verb cluster zou ... kunnen hebben stacks at the end."
  nl.b2.unit02.lesson06.exercise05.speak_moet_wel:
    instruction: "Bram's car is gone and it is rush hour, but he isn't here. Speculate aloud about the present cause, using moet wel (deduction): He must be stuck in traffic."
    accepted_answers:
      - {value: "Hij moet wel in de file staan", status: correct}
    feedback: "Hij moet wel in de file staan means he must be stuck in traffic -- a present deduction from the evidence."
  nl.b2.unit02.lesson06.exercise06.write_past_and_present:
    instruction: "Write TWO Dutch sentences speculating about why Bram is late, at DIFFERENT certainty levels. (1) A PAST cause you are sure of (deduction), using moet ... hebben: He must have missed the train. (2) A PRESENT cause you are less sure of, using waarschijnlijk: He is probably stuck in traffic."
    accepted_answers:
      - {value: "Hij moet de trein gemist hebben. Hij staat waarschijnlijk in de file.", status: correct}
      - {value: "Hij moet de trein gemist hebben. Hij staat waarschijnlijk in de file", status: correct}
      - {value: "Hij moet de trein hebben gemist. Hij staat waarschijnlijk in de file", status: correct}
      - {value: "Hij moet de trein gemist hebben. Waarschijnlijk staat hij in de file", status: correct}
      - {value: "Hij moet de trein hebben gemist. Waarschijnlijk staat hij in de file", status: correct}
    feedback: "Two speculations at different certainty levels: Hij moet de trein gemist hebben (past, a firm deduction). Hij staat waarschijnlijk in de file (present, only probable)."
  nl.b2.unit02.lesson06.exercise07.respond_speculate:
    instruction: "Bram is late and it is rush hour. Reply to 'Waarom is Bram zo laat?' with a confident present deduction, using zal wel or moet wel: He is most likely stuck in traffic."
    accepted_answers:
      - {value: "Hij zal wel in de file staan", status: correct}
      - {value: "Hij moet wel in de file staan", status: correct}
    feedback: "Hij zal wel in de file staan -- a confident present deduction about why he is late."
