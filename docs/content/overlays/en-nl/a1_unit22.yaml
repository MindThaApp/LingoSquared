course:
  title: "Dutch A1"
  description: "Beginner Dutch for handling a basic phone or text-message exchange, including asking someone to repeat or speak more slowly."

units:
  nl.a1.unit22.communication: {title: "Calling and texting"}

lessons:
  nl.a1.unit22.lesson01.ik_bel_je: {title: "I'll call you"}
  nl.a1.unit22.lesson02.met_wie_spreek_ik: {title: "Who am I speaking with?"}
  nl.a1.unit22.lesson03.kun_je_dat_herhalen: {title: "Can you repeat that?"}
  nl.a1.unit22.lesson04.een_sms_sturen: {title: "Sending a text"}
  nl.a1.unit22.lesson05.sms_gesprek_lezen: {title: "Reading a text exchange"}
  nl.a1.unit22.lesson06.telefoontje_na_dienst: {title: "A phone call after the shift"}

teaching:
  nl.a1.unit22.lesson01.teach.bellen: {title: "To call", gloss: "to call", note: "The infinitive of the verb for making a phone call.", example_gloss: "I have to call you."}
  nl.a1.unit22.lesson01.teach.ik_bel_je: {title: "Saying you'll call", gloss: "I'll call you.", note: "*Bel* is the ik-form of *bellen*; Dutch uses the present tense here where English uses 'will call.'"}
  nl.a1.unit22.lesson01.teach.met_lotte: {title: "Answering the phone", gloss: "Hello, this is Lotte.", note: "*Met* + name (literally 'with name') is the standard Dutch way to identify yourself on the phone, unlike English 'this is.'"}
  nl.a1.unit22.lesson01.teach.met_omar: {title: "Omar answers the same way", gloss: "Hello, this is Omar.", note: "Same *met* + name pattern as met_lotte."}

  nl.a1.unit22.lesson02.teach.met_wie: {title: "Asking who's calling", gloss: "Who am I speaking with?", note: "*Met wie spreek ik?* is the standard formal phrase for an unfamiliar caller."}
  nl.a1.unit22.lesson02.teach.u_spreekt_met: {title: "Identifying yourself formally", gloss: "You're speaking with Lotte.", note: "*U spreekt met* + name is the formal counterpart to the informal *met* + name."}

  nl.a1.unit22.lesson03.teach.kun_je_herhalen: {title: "Asking for repetition", gloss: "Can you repeat that?", note: "*Kun je* ...? (Can you ...?) plus *herhalen* (to repeat) plus *dat* (that)."}
  nl.a1.unit22.lesson03.teach.spreek_niet_snel: {title: "Asking someone to slow down", gloss: "Don't speak so fast, please.", note: "*Niet zo* + adjective negates the degree, not the verb itself: not so fast, not 'don't speak.'"}
  nl.a1.unit22.lesson03.teach.hoor_niet_goed: {title: "Saying you can't hear well", gloss: "I can't hear you well.", note: "*Horen* (to hear) with *niet goed* (not well) states a hearing problem, distinct from *verstaan* (to understand)."}

  nl.a1.unit22.lesson04.teach.sms: {title: "Text message", gloss: "the text message", note: "A common gender noun: *de sms*, borrowed directly from the English/international abbreviation.", example_gloss: "The text message is from Lotte."}
  nl.a1.unit22.lesson04.teach.stuur_sms: {title: "Saying you'll send a text", gloss: "I'll send you a text.", note: "*Sturen* (to send) takes an indirect object (*je*) before the direct object (*een sms*)."}
  nl.a1.unit22.lesson04.teach.bel_later_terug: {title: "Saying you'll call back", gloss: "I'll call you back later.", note: "*Terug* (back) reuses the separable-verb-final-particle pattern; *bellen* + *terug* functions like English 'call back.'"}

  nl.a1.unit22.lesson05.teach.sms_gesprek: {title: "Read a text exchange", gloss: "Omar: Hi Lotte, can you call me? I need to tell you something. Lotte: Yes of course, I'll call you back in five minutes.", note: "Track what Omar asks for, why, and when Lotte says she'll call back."}

  nl.a1.unit22.lesson06.teach.lotte_open_call: {title: "Lotte opens the call", gloss: "Lotte: Hello, this is Lotte.", note: "The same *met* + name pattern from lesson01, now used in the actual phone call."}
  nl.a1.unit22.lesson06.teach.omar_answer_glad: {title: "Omar is glad she called", gloss: "Omar: Hi Lotte, this is Omar. Nice that you're calling!", note: "*Fijn dat* ... (nice/glad that ...) expresses a positive reaction to an event."}
  nl.a1.unit22.lesson06.teach.lotte_ask_shift: {title: "Lotte asks about the shift", gloss: "Lotte: How was your first shift?", note: "*Was* is the simple past of *is* -- a different construction from the perfect tense (hebben/zijn + past participle, e.g. *Ik heb gewerkt*) taught in unit12; see the note right after the next line."}
  nl.a1.unit22.lesson06.teach.omar_report_good: {title: "Omar reports good news", gloss: "Omar: It went really well, better than I thought.", note: "*Ging* is the simple past of *gaan* (to go, here meaning 'to turn out'); *dacht* is the simple past of *denken* (to think)."}
  nl.a1.unit22.lesson06.teach.simple_past_note: {title: "Was, ging, dacht are simple-past forms", gloss: "was → to be, ging → to go, dacht → to think", note: "*Was*, *ging*, and *dacht* are irregular simple-past (verleden tijd) forms -- a different, not-yet-formally-taught pattern from unit12's perfect tense (hebben/zijn + past participle). For now, just memorize was/ging/dacht as fixed phrases in the contexts they appear in this lesson; full simple-past conjugation rules come at a later level."}
  nl.a1.unit22.lesson06.teach.lotte_proud: {title: "Lotte is proud", gloss: "Lotte: How nice to hear! I'm proud of you.", note: "*Trots op* (proud of) is a fixed combination; *op* is required, not *van*."}
  nl.a1.unit22.lesson06.teach.omar_thanks_means: {title: "Omar is touched", gloss: "Omar: Thank you, that means a lot to me.", note: "*Betekent* is the third-person form of *betekenen* (to mean); *voor me* (for me) expresses who it matters to."}
  nl.a1.unit22.lesson06.teach.zijn_possessive: {title: "His", gloss: "His first shift went really well.", note: "*Zijn* here is the possessive 'his,' not the verb 'to be' -- context distinguishes the two identical-looking words."}

exercises:
  nl.a1.unit22.lesson01.exercise01.choose_calling:
    instruction: "Choose the Dutch sentence meaning 'I'll call you.'"
    correct_option: "Ik bel je."
    distractors: ["Ik bel met je.", "Ik bel jou aan.", "Ik heb je gebeld."]
    accepted_answers: [{value: "Ik bel je.", status: correct}]
    feedback: "Bel is the ik-form of bellen, used here in the present tense for a near-future action."
  nl.a1.unit22.lesson01.exercise02.listen_answer_call:
    instruction: "Listen and choose what the speaker says."
    correct_option: "Hello, this is Omar."
    distractors: ["Hello, this is Lotte.", "Who am I speaking with?", "I'll call you."]
    accepted_answers: [{value: "Hello, this is Omar.", status: correct}]
    feedback: "Hallo, met Omar."
  nl.a1.unit22.lesson01.exercise03.match_call_phrases:
    instruction: "Match each Dutch phrase to its meaning."
    accepted_answers: [{value: [{left: bellen, right: "to call"}, {left: "Hallo, met Lotte.", right: "Hello, this is Lotte."}], status: correct}]
    feedback: "Met + name is the standard way to identify yourself on the phone."
  nl.a1.unit22.lesson01.exercise04.order_answer_call:
    instruction: "Put the words in order to answer the phone as Omar."
    correct_option: "Hallo met Omar"
    accepted_answers: [{value: "Hallo met Omar", status: correct}]
    feedback: "The complete phrase is Hallo, met Omar."
  nl.a1.unit22.lesson01.exercise05.listen_order_calling:
    instruction: "Listen and put the words in the order you hear."
    correct_option: "Ik bel je"
    accepted_answers: [{value: "Ik bel je", status: correct}]
    feedback: "The complete sentence is Ik bel je."
  nl.a1.unit22.lesson01.exercise06.complete_answer_call:
    instruction: "Complete the phrase."
    accepted_answers: [{value: met, status: correct}]
    feedback: "Hallo, met Omar."
  nl.a1.unit22.lesson01.exercise07.write_calling:
    instruction: "Write in Dutch: say you'll call someone."
    accepted_answers: [{value: "Ik bel je.", status: correct}, {value: "Ik bel je", status: correct}]
    feedback: "Ik bel je."

  nl.a1.unit22.lesson02.exercise01.choose_who_speaking:
    instruction: "Choose the Dutch sentence meaning 'Who am I speaking with?'"
    correct_option: "Met wie spreek ik?"
    distractors: ["Met wie spreekt u?", "Wie spreek ik met?", "Met wie ik spreek?"]
    accepted_answers: [{value: "Met wie spreek ik?", status: correct}]
    feedback: "Met wie spreek ik? is the standard phrase for an unfamiliar caller."
  nl.a1.unit22.lesson02.exercise02.listen_who_speaking:
    instruction: "Listen and choose what is asked."
    correct_option: "Who am I speaking with?"
    distractors: ["You're speaking with Lotte.", "Can you repeat that?", "I'll call you back later."]
    accepted_answers: [{value: "Who am I speaking with?", status: correct}]
    feedback: "Met wie spreek ik?"
  nl.a1.unit22.lesson02.exercise03.match_phone_identity:
    instruction: "Match each Dutch phrase or word to its meaning."
    accepted_answers: [{value: [{left: "Met wie spreek ik?", right: "Who am I speaking with?"}, {left: "U spreekt met Lotte.", right: "You're speaking with Lotte."}, {left: bellen, right: "to call"}, {left: "Ik bel je.", right: "I'll call you."}, {left: "Hallo, met Omar.", right: "Hello, this is Omar."}, {left: "Hallo, met Lotte.", right: "Hello, this is Lotte."}], status: correct}]
    feedback: "The first phrase asks; the second answers, using the formal u."
  nl.a1.unit22.lesson02.exercise04.order_you_speak_with:
    instruction: "Put the words in order to say 'You're speaking with Lotte.'"
    correct_option: "U spreekt met Lotte"
    accepted_answers: [{value: "U spreekt met Lotte", status: correct}]
    feedback: "The complete sentence is U spreekt met Lotte."
  nl.a1.unit22.lesson02.exercise05.complete_who_speaking:
    instruction: "Complete the question."
    accepted_answers: [{value: wie, status: correct}]
    feedback: "Met wie spreek ik?"
  nl.a1.unit22.lesson02.exercise06.respond_who_speaking:
    instruction: "Answer formally in Dutch: say the caller is speaking with Lotte."
    accepted_answers: [{value: "U spreekt met Lotte.", status: correct}, {value: "U spreekt met Lotte", status: correct}]
    feedback: "U spreekt met Lotte."

  nl.a1.unit22.lesson03.exercise01.choose_repeat_request:
    instruction: "Choose the Dutch sentence meaning 'Can you repeat that?'"
    correct_option: "Kun je dat herhalen?"
    distractors: ["Kun je dat herhaal?", "Kun jij dat herhalen ik?", "Kun je niet herhalen?"]
    accepted_answers: [{value: "Kun je dat herhalen?", status: correct}]
    feedback: "Kun je ...? plus the infinitive herhalen."
  nl.a1.unit22.lesson03.exercise02.listen_hear_badly:
    instruction: "Listen and choose what the speaker says."
    correct_option: "I can't hear you well."
    distractors: ["Can you repeat that?", "Don't speak so fast.", "I'll call you back."]
    accepted_answers: [{value: "I can't hear you well.", status: correct}]
    feedback: "Ik hoor je niet goed."
  nl.a1.unit22.lesson03.exercise03.match_clarification_phrases:
    instruction: "Match each Dutch phrase or word to its meaning."
    accepted_answers: [{value: [{left: "Kun je dat herhalen?", right: "Can you repeat that?"}, {left: "Spreek niet zo snel.", right: "Don't speak so fast."}, {left: "Ik hoor je niet goed.", right: "I can't hear you well."}, {left: "Met wie spreek ik?", right: "Who am I speaking with?"}, {left: bellen, right: "to call"}, {left: "Ik bel je.", right: "I'll call you."}], status: correct}]
    feedback: "These three phrases handle different phone-clarity problems."
  nl.a1.unit22.lesson03.exercise04.order_repeat_request:
    instruction: "Put the words in order to ask someone to repeat something."
    correct_option: "Kun je dat herhalen"
    accepted_answers: [{value: "Kun je dat herhalen", status: correct}]
    feedback: "The complete question is Kun je dat herhalen?"
  nl.a1.unit22.lesson03.exercise05.complete_speak_slowly:
    instruction: "Complete the request."
    accepted_answers: [{value: snel, status: correct}]
    feedback: "Spreek niet zo snel, alsjeblieft."
  nl.a1.unit22.lesson03.exercise06.translate_repeat_request:
    instruction: "Translate into Dutch."
    accepted_answers: [{value: "Kun je dat herhalen?", status: correct}, {value: "Kun je dat herhalen", status: correct}]
    feedback: "Kun je dat herhalen?"

  nl.a1.unit22.lesson04.exercise01.choose_send_text:
    instruction: "Choose the Dutch sentence meaning 'I'll send you a text.'"
    correct_option: "Ik stuur je een sms."
    distractors: ["Ik stuur een sms je.", "Ik bel je een sms.", "Ik stuur jou met een sms."]
    accepted_answers: [{value: "Ik stuur je een sms.", status: correct}]
    feedback: "Sturen takes the indirect object je before the direct object een sms."
  nl.a1.unit22.lesson04.exercise02.listen_call_back:
    instruction: "Listen and choose what the speaker says."
    correct_option: "I'll call you back later."
    distractors: ["I'll send you a text.", "Can you repeat that?", "I'll call you now."]
    accepted_answers: [{value: "I'll call you back later.", status: correct}]
    feedback: "Ik bel je later terug."
  nl.a1.unit22.lesson04.exercise03.match_message_words:
    instruction: "Match each Dutch word or phrase to its meaning."
    accepted_answers: [{value: [{left: "de sms", right: "the text message"}, {left: "later terug", right: "back later"}, {left: "Ik stuur je een sms.", right: "I'll text you."}, {left: bellen, right: "to call"}, {left: "Kun je dat herhalen?", right: "Can you repeat that?"}, {left: "Met wie spreek ik?", right: "Who am I speaking with?"}], status: correct}]
    feedback: "Sms is the word for a text message; later terug describes calling back."
  nl.a1.unit22.lesson04.exercise04.order_send_text:
    instruction: "Put the words in order to say you'll send a text."
    correct_option: "Ik stuur je een sms"
    accepted_answers: [{value: "Ik stuur je een sms", status: correct}]
    feedback: "The complete sentence is Ik stuur je een sms."
  nl.a1.unit22.lesson04.exercise05.complete_call_back:
    instruction: "Complete the sentence."
    accepted_answers: [{value: terug, status: correct}]
    feedback: "Ik bel je later terug."
  nl.a1.unit22.lesson04.exercise06.write_call_back:
    instruction: "Write in Dutch: say you'll call someone back later."
    accepted_answers: [{value: "Ik bel je later terug.", status: correct}, {value: "Ik bel je later terug", status: correct}]
    feedback: "Ik bel je later terug."

  nl.a1.unit22.lesson05.exercise01.read_omar_request:
    instruction: "Read the messages and choose what Omar asks Lotte to do."
    correct_option: "call him"
    distractors: ["text him", "visit him", "wait for him"]
    accepted_answers: [{value: "call him", status: correct}]
    feedback: "Kun je me bellen?"
  nl.a1.unit22.lesson05.exercise02.read_omar_reason:
    instruction: "Read the messages and choose why Omar wants Lotte to call."
    correct_option: "he needs to tell her something"
    distractors: ["he is nervous", "he lost his phone", "he wants to send her a text"]
    accepted_answers: [{value: "he needs to tell her something", status: correct}]
    feedback: "Ik moet je iets vertellen."
  nl.a1.unit22.lesson05.exercise03.read_lotte_reply:
    instruction: "Read the messages and choose when Lotte says she will call back."
    correct_option: "in five minutes"
    distractors: ["right away", "in an hour", "tomorrow"]
    accepted_answers: [{value: "in five minutes", status: correct}]
    feedback: "Ik bel je over vijf minuten terug."
  nl.a1.unit22.lesson05.exercise04.match_sms_turns:
    instruction: "Match each person to what they say in the exchange."
    accepted_answers: [{value: [{left: Omar, right: "asks Lotte to call him"}, {left: Lotte, right: "agrees to call back in five minutes"}], status: correct}]
    feedback: "Omar requests the call; Lotte agrees with a specific time."
  nl.a1.unit22.lesson05.exercise05.listen_sms_reply:
    instruction: "Listen and choose when Lotte will call back."
    correct_option: "in five minutes"
    distractors: ["right away", "in ten minutes", "tomorrow"]
    accepted_answers: [{value: "in five minutes", status: correct}]
    feedback: "Ik bel je over vijf minuten terug."
  nl.a1.unit22.lesson05.exercise06.write_sms_summary:
    instruction: "Write in Dutch: ask someone to call you because you need to tell them something."
    accepted_answers: [{value: "Kun je me bellen? Ik moet je iets vertellen.", status: correct}, {value: "Kun je me bellen Ik moet je iets vertellen", status: correct}]
    feedback: "Kun je me bellen? Ik moet je iets vertellen."

  nl.a1.unit22.lesson06.exercise01.listen_open_call:
    instruction: "Listen and choose what Lotte says."
    correct_option: "Hello, this is Lotte."
    distractors: ["Hello, this is Omar.", "Who am I speaking with?", "Can you repeat that?"]
    accepted_answers: [{value: "Hello, this is Lotte.", status: correct}]
    feedback: "Hallo, met Lotte."
  nl.a1.unit22.lesson06.exercise02.comprehend_shift_question:
    instruction: "Listen to the dialogue and choose what Lotte asks Omar about."
    correct_option: "his first shift"
    distractors: ["his new apartment", "his new coat", "the weather"]
    accepted_answers: [{value: "his first shift", status: correct}]
    feedback: "Hoe was je eerste dienst?"
  nl.a1.unit22.lesson06.exercise03.comprehend_shift_report:
    instruction: "Listen to the dialogue and choose how Omar's first shift went."
    correct_option: "really well, better than expected"
    distractors: ["badly, worse than expected", "okay, about as expected", "he doesn't say"]
    accepted_answers: [{value: "really well, better than expected", status: correct}]
    feedback: "Het ging heel goed, beter dan ik dacht."
  nl.a1.unit22.lesson06.exercise04.comprehend_lotte_pride:
    instruction: "Listen to the dialogue and choose how Lotte reacts to the good news."
    correct_option: "she says she's proud of him"
    distractors: ["she says she's surprised", "she asks him to call again tomorrow", "she doesn't react"]
    accepted_answers: [{value: "she says she's proud of him", status: correct}]
    feedback: "Ik ben trots op je."
  nl.a1.unit22.lesson06.exercise05.order_shift_question:
    instruction: "Put the words in order to ask how someone's first shift was."
    correct_option: "Hoe was je eerste dienst"
    accepted_answers: [{value: "Hoe was je eerste dienst", status: correct}]
    feedback: "The complete question is Hoe was je eerste dienst?"
  nl.a1.unit22.lesson06.exercise06.respond_shift_report:
    instruction: "Answer in Dutch: say it went really well, better than you thought."
    accepted_answers: [{value: "Het ging heel goed, beter dan ik dacht.", status: correct}, {value: "Het ging heel goed beter dan ik dacht", status: correct}]
    feedback: "Het ging heel goed, beter dan ik dacht."
  nl.a1.unit22.lesson06.exercise07.listen_type_proud:
    instruction: "Listen and type the complete Dutch sentences."
    accepted_answers: [{value: "Wat fijn om te horen! Ik ben trots op je.", status: correct}, {value: "Wat fijn om te horen Ik ben trots op je", status: correct}, {value: "Wat fijn om te horen, ik ben trots op je.", status: correct}, {value: "Wat fijn om te horen, ik ben trots op je", status: correct}]
    feedback: "Wat fijn om te horen! Ik ben trots op je."
  nl.a1.unit22.lesson06.exercise08.write_call_summary:
    instruction: "Write two Dutch sentences: Lotte calls Omar, and his first shift went really well."
    accepted_answers: [{value: "Lotte belt Omar. Zijn eerste dienst ging heel goed.", status: correct}, {value: "Lotte belt Omar Zijn eerste dienst ging heel goed", status: correct}, {value: "Lotte belt Omar, en zijn eerste dienst ging heel goed.", status: correct}, {value: "Lotte belt Omar, en zijn eerste dienst ging heel goed", status: correct}]
    feedback: "Lotte belt Omar. Zijn eerste dienst ging heel goed."
