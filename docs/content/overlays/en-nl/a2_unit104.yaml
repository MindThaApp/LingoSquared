review: {status: unreviewed, required_next_reviewer: owner_native_pass, notes: 'English overlay for the grammar-led object-pronoun and er unit. OPEN NATIVE QUESTIONS: see the realization review notes.'}
course: {title: Dutch A2, description: Grammar-led A2 Dutch for referring back to people and things., learning_goal: Refer back to people and things with object pronouns and er instead of repeating them.}
units:
  nl.a2.unit104.hem_haar_ze_er: {title: 'Him, her, them and er', description: 'Use object pronouns and er (with numbers and prepositions) to talk about gifts, borrowing and returning things without repeating yourself.'}
lessons:
  nl.a2.unit104.lesson01.cadeaus_en_boeken: {title: Gifts and books}
  nl.a2.unit104.lesson02.hem_haar_het_ze: {title: 'Hem, haar, het and ze'}
  nl.a2.unit104.lesson03.mij_of_me: {title: 'Mij or me? Jou or je?'}
  nl.a2.unit104.lesson04.hoeveel_er: {title: 'How many? Ik heb er drie'}
  nl.a2.unit104.lesson05.erover_ermee: {title: 'Erover, ervan, ermee, ernaar'}
  nl.a2.unit104.lesson06.boeken_terugbrengen: {title: Returning books}
teaching:
  nl.a2.unit104.lesson01.teach.plaatsen:
    title: Places and celebrations
    gloss: the shop / the library / the birthday / the party
    note: You may know these words from A1; here they set the scene for gifts and borrowing.
    example_gloss: [I go to the library., Noor has a party., In the shop I buy a present.]
  nl.a2.unit104.lesson01.teach.cadeaus:
    title: Gifts and things to borrow
    gloss: the present / the book / the flowers / the pen / the umbrella
    note: '*Het cadeau* and *het boek* are het-words; *de pen* and *de paraplu* are de-words. *De bloemen* is plural.'
    example_gloss: [I have a present for Noor., 'May I borrow your pen?', I buy flowers.]
  nl.a2.unit104.lesson01.teach.werkwoorden:
    title: Buying, giving, borrowing, returning
    gloss: to buy / to give / to borrow / to bring back / to give back
    note: '*Lenen* here means to borrow. *Terugbrengen* and *teruggeven* are separable: *ik breng het terug*, *ik geef het terug*.'
    example_gloss: [I buy flowers., 'May I borrow the pen?', I bring the book back., I give it back.]
  nl.a2.unit104.lesson01.teach.vrienden: {title: The three friends, gloss: 'Lotte, Omar and Noor are friends.'}
  nl.a2.unit104.lesson01.teach.gn_objectvormen: {title: Object pronouns, gloss: I → me; you → you; he → him; she → her; it → it; we → us; you (all) → you (all); they → them, note: 'After a verb you use the object form: *Ik zie hem*. *Me/je/ze* are the normal spoken forms; *mij/jou* are the stressed forms. For several people or things you say *ze*. *Hen* and *hun* exist, mostly in writing: you can avoid them in speech.'}
  nl.a2.unit104.lesson01.teach.gn_nadruk: {title: Stressed or not, gloss: 'I see you. I see you, not him. He sees me. He sees me, not her.', note: Use *me* and *je* normally. Use *mij* and *jou* when you want to stress or contrast the person.}
  nl.a2.unit104.lesson01.teach.zinnen: {title: Pronouns in sentences, gloss: He gives me a present. I give her flowers. Lotte sees us.}
  nl.a2.unit104.lesson02.teach.spullen:
    title: More things and a question word
    gloss: the bike / the bag / the cake / the card / where
    note: '*Taart* and *kaart* are useful for birthdays and parties.'
    example_gloss: ['Where is the bag?', The cake is for the party., I have a card for Lotte.]
  nl.a2.unit104.lesson02.teach.bezit:
    title: Mine and yours
    gloss: my / your / of, from
    note: '*Je* can mean you or your: *Ik zie je* (you) and *je boek* (your book).'
    example_gloss: [I have my pen., I have your book., Noor's book.]
  nl.a2.unit104.lesson02.teach.gn_het_hem: {title: 'Het for het-words, hem for de-words', gloss: 'The book? I have it. The pen? I have it. The bag? I see it.', note: 'For things, Dutch picks the pronoun by the article: a het-word becomes *het*, a singular de-word becomes *hem*. Do not use *het* for a de-word.'}
  nl.a2.unit104.lesson02.teach.gn_ze: {title: Ze for plurals, gloss: 'The flowers? I buy them. Lotte and Omar? I see them.', note: '*Ze* refers to more than one thing or person, in speech. *Hen* also exists for people, but mostly in writing.'}
  nl.a2.unit104.lesson02.teach.zinnen: {title: Four object pronouns, gloss: I see him. I see her. I see it. I see them.}
  nl.a2.unit104.lesson03.teach.werkwoorden:
    title: Verbs and prepositions with people
    gloss: to call / to help / to know / for / with
    note: '*Kennen* is for knowing a person.'
    example_gloss: [I call you., 'Can you help me?', I do not know him., The present is for her., I go with you all.]
  nl.a2.unit104.lesson03.teach.gn_contrast: {title: 'Me/je or mij/jou?', gloss: 'I help you. I help you, not him.', note: 'Normally use *me* and *je*. When you contrast or stress the person, use *mij* and *jou*: *Ik help jou, niet hem.*'}
  nl.a2.unit104.lesson03.teach.gn_voorzetsel: {title: After a preposition, gloss: The present is for me. The present is for you. I go with her., note: 'After a preposition (*voor, met, naar, van*) the standard forms are *mij* and *jou*. In unstressed speech *me* and *je* are also very common (*voor me*, *met je*).'}
  nl.a2.unit104.lesson03.teach.gn_jullie: {title: 'You, you all, them', gloss: I call you. I call you all. I call them., note: '*Je* is one person. *Jullie* is more than one person you talk to. *Ze* is more than one person you talk about.'}
  nl.a2.unit104.lesson04.teach.getallen:
    title: Numbers and quantity
    gloss: one / two / three / four / five / none, no / how many
    note: '*Geen* means none or no.'
    example_gloss: [I have two books., I have no pen., 'How many books do you have?', I have three pens.]
  nl.a2.unit104.lesson04.teach.gn_er_getal: {title: Er + number, gloss: 'How many books do you have? I have three (of them).', note: 'When you leave out the thing and only give a number, put *er* before the number: *Ik heb er drie.* Without *er* the sentence is incomplete.'}
  nl.a2.unit104.lesson04.teach.gn_er_geen: {title: Er + één / geen, gloss: 'Do you have a pen? Yes, I have one. Do you have bags? No, I have none.', note: '*Een* becomes *één* with *er*, and *geen* also follows *er*: *Ik heb er geen.*'}
  nl.a2.unit104.lesson04.teach.gn_er_ze: {title: 'Ze or er?', gloss: 'The books? I have them. Books? I have three.', note: Use *ze* for specific things you both know. Use *er* when you say how many of them.}
  nl.a2.unit104.lesson04.teach.gn_er_kopen: {title: Er with other verbs, gloss: I want to buy two (of them). I borrow five (of them)., note: '*Er* stays near the verb. With *willen* it comes before the number and the infinitive: *Ik wil er twee kopen.*'}
  nl.a2.unit104.lesson05.teach.werkwoorden:
    title: Verbs with a preposition
    gloss: to talk / to look / to write / to love, to hold / happy / about / to
    note: '*Praten over* = to talk about, *kijken naar* = to look at, *schrijven met* = to write with, *houden van* = to love, *blij zijn met* = to be happy with.'
    example_gloss: [I talk about the present., I look at the book., I write with the pen., I love flowers., I am happy with the present.]
  nl.a2.unit104.lesson05.teach.gn_er_voorzetsel: {title: Er + preposition for things, gloss: 'The present? I talk about it. The book? I look at it. The pen? I write with it. Flowers? I love them.', note: 'For things, do not say *over het*, *met hem*. Join *er* and the preposition: *erover, ernaar, ermee, ervan*.'}
  nl.a2.unit104.lesson05.teach.gn_gesplitst: {title: Er and the preposition can split, gloss: 'I am happy with it. Shall we talk about it tomorrow?', note: 'In many sentences *er* comes early and the preposition at the end: *Ik ben er blij mee.* *Ik ben ermee blij* is also possible, but *Ik ben er blij mee* is the neutral form taught here.'}
  nl.a2.unit104.lesson05.teach.gn_personen: {title: People keep the preposition, gloss: I talk about Noor. I talk about her. I look at Omar. I look at him., note: 'For people, do not use *er*: use the preposition plus *hem, haar, ze*. *Erover* and similar forms refer to things and ideas.'}
  nl.a2.unit104.lesson05.teach.lezen:
    title: Noor's message
    gloss: Hi Omar, thanks for the flowers! I love them. Lotte's book is nice, I am happy with it. I still have your pen. I will bring it back tomorrow. Lotte has your umbrella and will bring it back on Friday.
    note: Find which thing each pronoun points back to.
    glosses: {bedankt: thanks, vrijdag: Friday, mooi: 'nice, beautiful', nog: still}
  nl.a2.unit104.lesson06.teach.lotte_bibliotheek: {title: Lotte says where she is going, gloss: 'Lotte: Hi Omar, I am going to the library tomorrow.'}
  nl.a2.unit104.lesson06.teach.omar_boeken: {title: Omar asks a favour, gloss: 'Omar: Can you bring my books back? I have three.'}
  nl.a2.unit104.lesson06.teach.lotte_ja: {title: Lotte agrees and asks about a gift, gloss: 'Lotte: Of course, I will bring them back tomorrow. Do you also have a present for Noor?'}
  nl.a2.unit104.lesson06.teach.omar_bloemen: {title: Omar names the gift, gloss: 'Omar: Yes, I am buying flowers for her. She loves them.'}
  nl.a2.unit104.lesson06.teach.lotte_later: {title: Lotte suggests talking later, gloss: 'Lotte: Nice! Shall we talk about it later?'}
  nl.a2.unit104.lesson06.teach.omar_bel: {title: Omar promises a call, gloss: 'Omar: Fine, I will call you tonight.'}
exercises:
  nl.a2.unit104.lesson01.exercise01.kies_geeft:
    instruction: 'Choose the sentence that means: He gives me a present.'
    correct_option: Hij geeft me een cadeau.
    distractors: [Hij geeft ik een cadeau., Hij geeft jij een cadeau., Hij geeft hij een cadeau.]
    accepted_answers:
    - {value: Hij geeft me een cadeau., status: correct}
    feedback: '*Hij geeft me een cadeau* = He gives me a present. After the verb you need the object form *me*.'
  nl.a2.unit104.lesson01.exercise02.kies_haar:
    instruction: 'Choose the sentence that means: I give her flowers.'
    correct_option: Ik geef haar bloemen.
    distractors: [Ik geef hem bloemen., Ik geef ons bloemen., Ik geef jullie bloemen.]
    accepted_answers:
    - {value: Ik geef haar bloemen., status: correct}
    feedback: '*Haar* is the object form for a woman: *Ik geef haar bloemen*.'
  nl.a2.unit104.lesson01.exercise03.koppel_zinnen:
    instruction: Match each Dutch sentence to its English meaning.
    accepted_answers:
    - value:
      - {left: Ik zie hem., right: I see him.}
      - {left: Ik zie haar., right: I see her.}
      - {left: Hij ziet ons., right: He sees us.}
      - {left: Hij ziet jullie., right: He sees you all.}
      - {left: Hij ziet me., right: He sees me.}
      - {left: Hij ziet je., right: He sees you.}
      status: correct
    feedback: '*Hem, haar, ons, jullie, me* and *je* are all object forms.'
  nl.a2.unit104.lesson01.exercise04.volgorde_cadeau:
    instruction: 'Put the words in order to say: He gives me a present.'
    correct_option: Hij geeft me een cadeau
    accepted_answers:
    - {value: Hij geeft me een cadeau, status: correct}
    feedback: '*Hij geeft me een cadeau.*'
  nl.a2.unit104.lesson01.exercise05.vul_hem:
    instruction: Complete the sentence with the correct object pronoun.
    correct_option: hem
    accepted_answers:
    - {value: hem, status: correct}
    feedback: Omar is a man, so you refer back to him with *hem*.
  nl.a2.unit104.lesson01.exercise06.vertaal_haar:
    instruction: Translate into Dutch.
    correct_option: null
    accepted_answers:
    - {value: Ik zie haar., status: correct}
    - {value: Ik zie haar, status: correct}
    feedback: '*Ik zie haar* = I see her.'
  nl.a2.unit104.lesson01.exercise07.schrijf_bloemen:
    instruction: Write the requested Dutch sentence.
    correct_option: Hij geeft me bloemen.
    accepted_answers:
    - {value: Hij geeft me bloemen., status: correct}
    - {value: Hij geeft me bloemen, status: correct}
    - {value: Hij geeft mij bloemen., status: correct}
    - {value: Hij geeft mij bloemen, status: correct}
    feedback: '*Hij geeft me bloemen* (or *mij*) = He gives me flowers.'
  nl.a2.unit104.lesson02.exercise01.kies_pen:
    instruction: 'Choose the sentence that means: The pen? I have it.'
    correct_option: De pen? Ik heb hem.
    distractors: ['De pen? Ik heb het.', 'De pen? Ik heb ze.', 'De pen? Ik heb ons.']
    accepted_answers:
    - {value: 'De pen? Ik heb hem.', status: correct}
    feedback: '*De pen* is a de-word, so you say *hem*.'
  nl.a2.unit104.lesson02.exercise02.kies_boek:
    instruction: 'Choose the sentence that means: The book? I have it.'
    correct_option: Het boek? Ik heb het.
    distractors: ['Het boek? Ik heb hem.', 'Het boek? Ik heb ze.', 'Het boek? Ik heb haar.']
    accepted_answers:
    - {value: 'Het boek? Ik heb het.', status: correct}
    feedback: '*Het boek* is a het-word, so you say *het*.'
  nl.a2.unit104.lesson02.exercise03.koppel_verwijzing:
    instruction: Match each person or thing to the pronoun that refers back to it after a verb.
    accepted_answers:
    - value:
      - {left: het boek, right: het}
      - {left: de pen, right: hem}
      - {left: de bloemen, right: ze}
      - {left: Noor, right: haar}
      - {left: Lotte en ik, right: ons}
      - {left: Omar en jij, right: jullie}
      status: correct
    feedback: 'Things: *het boek* gives *het*, *de pen* gives *hem*, plural *de bloemen* gives *ze*. People: *Noor* gives *haar*, *Lotte en ik* gives *ons*, *Omar en jij* gives *jullie*.'
  nl.a2.unit104.lesson02.exercise04.volgorde_winkel:
    instruction: 'Put the words in order to say: I buy them in the shop.'
    correct_option: Ik koop ze in de winkel
    accepted_answers:
    - {value: Ik koop ze in de winkel, status: correct}
    - {value: In de winkel koop ik ze, status: correct}
    feedback: '*Ik koop ze in de winkel.* You may also start with the place: *In de winkel koop ik ze.*'
  nl.a2.unit104.lesson02.exercise05.vul_tas:
    instruction: Complete the answer with the correct pronoun.
    correct_option: hem
    accepted_answers:
    - {value: hem, status: correct}
    feedback: '*De tas* is a de-word, so you refer back to it with *hem*.'
  nl.a2.unit104.lesson02.exercise06.vertaal_boek:
    instruction: Translate into Dutch.
    correct_option: null
    accepted_answers:
    - {value: 'Heb je het boek? Ja, ik heb het.', status: correct}
    - {value: 'Heb je het boek? Ja, ik heb het', status: correct}
    - {value: 'Heb jij het boek? Ja, ik heb het.', status: correct}
    - {value: 'Heb jij het boek? Ja, ik heb het', status: correct}
    - {value: 'Heb je het boek? Ja ik heb het', status: correct}
    - {value: 'Heb jij het boek? Ja ik heb het', status: correct}
    feedback: '*Heb je het boek? Ja, ik heb het.*'
  nl.a2.unit104.lesson02.exercise07.schrijf_tas:
    instruction: Write the requested Dutch sentence.
    correct_option: Ik zie hem.
    accepted_answers:
    - {value: Ik zie hem., status: correct}
    - {value: Ik zie hem, status: correct}
    feedback: '*Ik zie hem.* The bag is a de-word.'
  nl.a2.unit104.lesson03.exercise01.kies_contrast:
    instruction: 'Choose the sentence that means: I help you, not him.'
    correct_option: Ik help jou, niet hem.
    distractors: ['Ik help jij, niet hem.', 'Ik help jou, niet hij.', 'Ik help hem, niet jou.']
    accepted_answers:
    - {value: 'Ik help jou, niet hem.', status: correct}
    feedback: Use the stressed form *jou* to contrast.
  nl.a2.unit104.lesson03.exercise02.luister_voor_mij:
    instruction: Listen and select what you hear.
    correct_option: Het cadeau is voor mij.
    distractors: [Het cadeau is voor jou., Het cadeau is voor hem., Het cadeau is voor haar.]
    accepted_answers:
    - {value: Het cadeau is voor mij., status: correct}
    feedback: You heard *Het cadeau is voor mij.*
  nl.a2.unit104.lesson03.exercise03.koppel_voorzetsel:
    instruction: Match each Dutch phrase to its English meaning.
    accepted_answers:
    - value:
      - {left: voor mij, right: for me}
      - {left: met jou, right: with you (one person)}
      - {left: naar haar, right: to her}
      - {left: voor ons, right: for us}
      - {left: met jullie, right: with you all}
      - {left: van hem, right: from him}
      status: correct
    feedback: Each preposition is followed by a full pronoun form.
  nl.a2.unit104.lesson03.exercise04.volgorde_voor_haar:
    instruction: 'Put the words in order to say: The present is for her.'
    correct_option: Het cadeau is voor haar
    accepted_answers:
    - {value: Het cadeau is voor haar, status: correct}
    - {value: Voor haar is het cadeau, status: correct}
    feedback: '*Het cadeau is voor haar.*'
  nl.a2.unit104.lesson03.exercise05.vul_ons:
    instruction: Complete the sentence with the correct pronoun.
    correct_option: ons
    accepted_answers:
    - {value: ons, status: correct}
    feedback: 'Noor and the speaker are two people including the speaker: *ons*.'
  nl.a2.unit104.lesson03.exercise06.vertaal_voor_jou:
    instruction: Translate into Dutch. You is one person.
    correct_option: null
    accepted_answers:
    - {value: Het cadeau is voor jou., status: correct}
    - {value: Het cadeau is voor jou, status: correct}
    - {value: Het cadeau is voor je., status: correct}
    - {value: Het cadeau is voor je, status: correct}
    feedback: After *voor* the standard form is *jou*; unstressed *je* is also common in speech.
  nl.a2.unit104.lesson03.exercise07.schrijf_contrast:
    instruction: Write the requested Dutch sentence with the stressed form.
    correct_option: Ik help jou, niet hem.
    accepted_answers:
    - {value: 'Ik help jou, niet hem.', status: correct}
    - {value: 'Ik help jou, niet hem', status: correct}
    - {value: Ik help jou niet hem., status: correct}
    - {value: Ik help jou niet hem, status: correct}
    feedback: '*Ik help jou, niet hem.*'
  nl.a2.unit104.lesson04.exercise01.kies_er_drie:
    instruction: Choose the correct Dutch answer.
    correct_option: Ik heb er drie.
    distractors: [Ik heb drie er., Ik heb hem drie., Ik heb het drie.]
    accepted_answers:
    - {value: Ik heb er drie., status: correct}
    feedback: 'Add *er* before the number: *Ik heb er drie.*'
  nl.a2.unit104.lesson04.exercise02.kies_er_geen:
    instruction: Choose the correct Dutch answer.
    correct_option: Nee, ik heb er geen.
    distractors: ['Nee, ik heb geen er.', 'Nee, ik heb het geen.', 'Nee, ik heb hem geen.']
    accepted_answers:
    - {value: 'Nee, ik heb er geen.', status: correct}
    feedback: '*Er* is needed before *geen* when the noun is left out.'
  nl.a2.unit104.lesson04.exercise03.koppel_aantal:
    instruction: Match each Dutch sentence to its English meaning.
    accepted_answers:
    - value:
      - {left: Ik heb er één., right: I have one.}
      - {left: Ik heb er twee., right: I have two.}
      - {left: Ik heb er drie., right: I have three.}
      - {left: Ik heb er vier., right: I have four.}
      - {left: Ik heb er vijf., right: I have five.}
      - {left: Ik heb er geen., right: I have none.}
      status: correct
    feedback: The number comes right after *er*.
  nl.a2.unit104.lesson04.exercise04.volgorde_winkel:
    instruction: 'Put the words in order to say: I buy two of them in the shop.'
    correct_option: Ik koop er twee in de winkel
    accepted_answers:
    - {value: Ik koop er twee in de winkel, status: correct}
    - {value: In de winkel koop ik er twee, status: correct}
    - {value: Ik koop er in de winkel twee, status: correct}
    feedback: '*Ik koop er twee in de winkel.* You can also start with the place.'
  nl.a2.unit104.lesson04.exercise05.vul_er:
    instruction: Complete the answer.
    correct_option: er
    accepted_answers:
    - {value: er, status: correct}
    feedback: Use *er* before the number.
  nl.a2.unit104.lesson04.exercise06.vertaal_wil:
