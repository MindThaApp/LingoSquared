    - {value: Ik wil er drie, status: correct}
    - {value: Ik wil er drie hebben., status: correct}
    - {value: Ik wil er drie hebben, status: correct}
    feedback: '*Ik wil er drie.* (Also fine: *Ik wil er drie hebben.*)'
  nl.a2.unit104.lesson04.exercise07.schrijf_koop:
    instruction: Write the requested Dutch sentence with the verb kopen and er.
    correct_option: Ik koop er twee.
    accepted_answers:
    - {value: Ik koop er twee., status: correct}
    - {value: Ik koop er twee, status: correct}
    feedback: '*Ik koop er twee.*'
  nl.a2.unit104.lesson05.exercise01.lees_bloemen:
    instruction: Read Noor's message. What does Noor say about the flowers?
    correct_option: She loves them.
    distractors: [She will bring them back tomorrow., She is reading them., She wants to buy three of them.]
    accepted_answers:
    - {value: She loves them., status: correct}
    feedback: '*Ik hou ervan* = I love them. *Ervan* points back to the flowers.'
  nl.a2.unit104.lesson05.exercise02.lees_hem:
    instruction: 'Read Noor''s message. In "Ik breng hem morgen terug", which thing does hem point back to?'
    correct_option: de pen
    distractors: [de paraplu, het boek, de bloemen]
    accepted_answers:
    - {value: de pen, status: correct}
    feedback: '*Hem* points back to *je pen*, a de-word.'
  nl.a2.unit104.lesson05.exercise03.vul_erover:
    instruction: Complete the sentence with er + the preposition.
    correct_option: erover
    accepted_answers:
    - {value: erover, status: correct}
    feedback: For a thing you use *erover*. For a person you would say *over haar*.
  nl.a2.unit104.lesson05.exercise04.koppel_er:
    instruction: Match each Dutch sentence to its English meaning.
    accepted_answers:
    - value:
      - {left: Ik praat erover., right: I talk about it.}
      - {left: Ik kijk ernaar., right: I look at it.}
      - {left: Ik schrijf ermee., right: I write with it.}
      - {left: Ik hou ervan., right: I love it.}
      - {left: Ik ben er blij mee., right: I am happy with it.}
      - {left: Ik praat over haar., right: I talk about her.}
      status: correct
    feedback: Things take *er* + preposition; the person *haar* keeps *over*.
  nl.a2.unit104.lesson05.exercise05.volgorde_praten:
    instruction: 'Put the words in order to say: Shall we talk about it tomorrow?'
    correct_option: Praten we er morgen over
    accepted_answers:
    - {value: Praten we er morgen over, status: correct}
