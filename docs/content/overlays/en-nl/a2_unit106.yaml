course:
  title: "Dutch A2"
  description: "Grammar-led A2 Dutch for writing to friends."
  learning_goal: "Write a short informal message to a friend: what happened, what is next, and why."
units:
  nl.a2.unit106.een_bericht_aan_een_vriend: {title: "A message to a friend", description: "Read and write informal messages with a greeting, past events, plans, reasons and a closing."}
lessons:
  nl.a2.unit106.lesson01.hoi_lotte_groetjes: {"title": "Hi Lotte, best wishes"}
  nl.a2.unit106.lesson02.wat_is_er_gebeurd: {"title": "What happened?"}
  nl.a2.unit106.lesson03.wat_gaan_we_doen: {"title": "What are we going to do?"}
  nl.a2.unit106.lesson04.omdat_want_dus: {"title": "Because, because, so"}
  nl.a2.unit106.lesson05.berichten_lezen: {"title": "Reading messages"}
  nl.a2.unit106.lesson06.een_bericht_schrijven: {"title": "Writing a message"}
teaching:
  nl.a2.unit106.lesson01.teach.groeten: {"title": "Opening a message", "gloss": "Hi Lotte / Hey Omar / Hi Noor", "note": "Start a message to a friend with Hoi or Hé plus the name and a comma.", "example_gloss": ["Hi Lotte, how are you?", "Hey Omar, thanks for your message!"]}
  nl.a2.unit106.lesson01.teach.afsluiten: {"title": "Closing a message", "gloss": "Best wishes (casual) / Love / See you soon", "note": "Close with one of these, then a comma and your name. Liefs is warm and used for close friends.", "example_gloss": ["Best wishes, Omar", "Love, Lotte", "See you soon, Noor"]}
  nl.a2.unit106.lesson01.teach.bericht: {"title": "Writing to a friend", "gloss": "the message / the friend (male) / the friend (female) / to write", "note": "Vriend is a male friend, vriendin a female friend.", "example_gloss": ["I write a message to my (female) friend.", "Lotte is a friend of Omar.", "Omar is a friend of Noor."]}
  nl.a2.unit106.lesson01.teach.gebeurtenissen: {"title": "Things to write about", "gloss": "the weekend / the party / the film / the cinema / the zoo / the park / the evening", "note": "These are typical topics for a message about your weekend.", "example_gloss": ["The weekend was nice.", "The party was fun.", "I am watching a film at the cinema."]}
  nl.a2.unit106.lesson01.teach.bijvoeglijk: {"title": "How was it? How are you?", "gloss": "nice, fun / cosy, fun / tired / ill / busy", "note": "Gezellig describes a fun, friendly atmosphere, for example at a party.", "example_gloss": ["The film was nice.", "I am tired.", "Omar is ill.", "Lotte is busy."]}
  nl.a2.unit106.lesson01.teach.tijd: {"title": "When?", "gloss": "yesterday / last week / tomorrow / next week / maybe / Saturday", "note": "Time words tell your friend when something happened or will happen. Misschien means maybe.", "example_gloss": ["Yesterday was the party.", "Tomorrow is the weekend.", "Maybe the film is nice."]}
  nl.a2.unit106.lesson01.teach.gn_opbouw: {"title": "Shape of a message to a friend", "gloss": "Hi Lotte, how are you? I am writing you a message. Best wishes, Omar", "note": "A friendly message has four parts: an opening (Hoi or Hé plus the name), what happened, what is next, and a closing (Groetjes, Liefs or Tot snel plus your name). Add a reason with omdat or want when it helps."}
  nl.a2.unit106.lesson01.teach.gn_je: {"title": "Je for a friend", "gloss": "How are you? Thanks for your message!", "note": "To a friend you write je (or jij), never u. Je is also the word for your: je bericht."}
  nl.a2.unit106.lesson01.teach.zin: {"title": "A short message", "gloss": "Hi Lotte, thanks for your message! See you soon, Omar"}
  nl.a2.unit106.lesson02.teach.voltooid_ww: {"title": "Verbs and their participles", "gloss": "to see - seen / to buy - bought / to call - called / to walk - walked / to dance - danced / to eat - eaten / to go - gone / to be - been", "note": "The second form of each pair is the participle used in the present perfect.", "example_gloss": ["I saw a film.", "We danced.", "I went to the park."]}
  nl.a2.unit106.lesson02.teach.gn_hebben: {"title": "Present perfect with hebben", "gloss": "I saw a film yesterday. We danced at the party. I called Noor.", "note": "To say what happened, use heb or hebben plus a participle. In a simple main clause the participle goes at the very end. Dutch often uses this form where English says 'I saw' or 'I called'."}
  nl.a2.unit106.lesson02.teach.gn_zijn: {"title": "Present perfect with zijn", "gloss": "I went to the park. I was at the party. We went to the cinema.", "note": "The verbs gaan and zijn form their perfect with zijn, not hebben: ik ben gegaan, ik ben geweest. Komen works the same way (ik ben gekomen). Most other verbs use hebben. Learn the auxiliary together with the participle."}
  nl.a2.unit106.lesson02.teach.gn_was_had: {"title": "Describing with was and had", "gloss": "The party was fun. The film was nice. I had a nice evening.", "note": "To say how something was, use the imperfectum of known verbs: was and had. Use the present perfect for the events themselves and was or had for the description. Two or three such details make your message lively."}
  nl.a2.unit106.lesson02.teach.zinnen: {"title": "What happened", "gloss": "Yesterday I saw a film. It was nice. I went to the party."}
  nl.a2.unit106.lesson03.teach.plan_ww: {"title": "Words for plans", "gloss": "to visit / to cook / to watch / the uncle / the plan", "note": "Oom is an uncle. Plan is a plan; van plan zijn means to intend.", "example_gloss": ["I visit my uncle in Amsterdam.", "Omar cooks for Lotte.", "We are watching a film."]}
  nl.a2.unit106.lesson03.teach.gn_gaan: {"title": "Plans with gaan", "gloss": "I am going to visit my uncle. Omar is going to cook tomorrow. We are going to see a film.", "note": "Use gaan plus an infinitive for a plan or what you are going to do. The infinitive goes at the end of the clause."}
  nl.a2.unit106.lesson03.teach.gn_voorop: {"title": "Time word first", "gloss": "Tomorrow I am going to cook. Next week we are going to visit my uncle. Maybe I will go to the film.", "note": "When a time word such as morgen or volgende week, or misschien, opens the sentence, the verb comes next and the subject follows it: Morgen ga ik koken. The infinitive still stays at the end."}
  nl.a2.unit106.lesson03.teach.gn_plan: {"title": "Van plan zijn om ... te", "gloss": "I intend to go to the zoo. I intend to visit my uncle.", "note": "Ik ben van plan om ... te + infinitive says what you intend to do. The infinitive with te goes at the end: om mijn oom te bezoeken. It is a little more deliberate than gaan."}
  nl.a2.unit106.lesson03.teach.gn_zullen: {"title": "Zullen for a promise", "gloss": "I will call you tomorrow. We will call you.", "note": "Ik zal and wij zullen plus an infinitive express a promise or an offer: Ik zal je bellen. Use gaan for a plan and zullen when you promise something to your friend."}
  nl.a2.unit106.lesson03.teach.zinnen: {"title": "What is next", "gloss": "Next week I am going to visit my uncle in Amsterdam. I will call you."}
  nl.a2.unit106.lesson04.teach.redenwoorden: {"title": "Words for reasons", "gloss": "because / because / so / the time / no, not any / not / to come / to stay", "note": "Omdat and want both mean because, dus means so. They differ in word order, see the next notes.", "example_gloss": ["I have no time.", "I stay at home.", "I am not coming."]}
  nl.a2.unit106.lesson04.teach.gn_omdat: {"title": "Omdat: the verb goes last", "gloss": "I stay at home because I am ill. Because I am tired, I go home.", "note": "After omdat the verb goes to the end of its own clause: omdat ik ziek ben. If the omdat-clause comes first, the main clause that follows starts with its verb, directly after the comma: Omdat ik moe ben, ga ik naar huis."}
  nl.a2.unit106.lesson04.teach.gn_want: {"title": "Want: normal word order", "gloss": "I stay at home, because I am ill. I am not coming, because I have no time.", "note": "After want the word order stays normal: want ik ben ziek. Want only links two main clauses, so it never starts the sentence."}
  nl.a2.unit106.lesson04.teach.gn_dus: {"title": "Dus: the result", "gloss": "I am ill, so I stay at home. It is busy, so I am not coming.", "note": "Dus introduces the result. It is a conjunction, so it does not change the word order of the clause it joins: Ik ben ziek, dus ik blijf thuis. Inversion is also very common and correct: Ik ben ziek, dus blijf ik thuis. Omdat gives the reason; dus gives the result."}
  nl.a2.unit106.lesson04.teach.gn_verleden: {"title": "Reasons in the past", "gloss": "I was ill, so I did not go to the party. I did not come because I was tired.", "note": "Give reasons for past events in the same way. Describe the reason with was or had (Ik was ziek) and the event with the present perfect (ik ben niet gekomen)."}
  nl.a2.unit106.lesson05.teach.leeswoorden: {"title": "Words for reading", "gloss": "the ticket / already / very / a lot, much / also / but / that / he / to live", "note": "These words appear in the two messages below.", "example_gloss": ["I danced a lot.", "The party was very fun.", "My uncle lives in Amsterdam.", "He is also in the park.", "I am coming, but that is not a problem."]}
  nl.a2.unit106.lesson05.teach.gn_voltooid_verleden: {"title": "Had plus participle (for reading)", "gloss": "I had already bought a ticket. Lotte had already called Omar.", "note": "Had or hadden plus a participle looks back to something that happened before another past moment: I had already bought a ticket. You only need to recognise it when reading. In your own messages, the present perfect is enough."}
  nl.a2.unit106.lesson05.teach.lees_noor: {"title": "Noor's message to Lotte", "gloss": "Hi Lotte, thanks for your message! Yesterday I went to the party. It was very fun and I danced a lot. Tomorrow I am going to the zoo, because I have time. Maybe I will go to the film next week. See you soon, Noor"}
  nl.a2.unit106.lesson05.teach.lees_omar: {"title": "Omar's message to Lotte", "gloss": "Hey Lotte, how are you? I was ill yesterday, so I did not go to the film. I had already bought a ticket, but that was not a problem. Next week I am going to visit my uncle. He lives in Amsterdam. I will call you tomorrow. Best wishes, Omar"}
  nl.a2.unit106.lesson06.teach.lotte_vraag: {"title": "Lotte speaks", "gloss": "Lotte: Hi Omar, how was your weekend?"}
  nl.a2.unit106.lesson06.teach.omar_feestje: {"title": "Omar speaks", "gloss": "Omar: Nice! On Saturday I went to the party and I danced a lot."}
  nl.a2.unit106.lesson06.teach.lotte_plan: {"title": "Lotte speaks", "gloss": "Lotte: How nice! And what are you going to do next week?"}
  nl.a2.unit106.lesson06.teach.omar_oom: {"title": "Omar speaks", "gloss": "Omar: I am going to visit my uncle in Amsterdam, because I have time."}
  nl.a2.unit106.lesson06.teach.lotte_bellen: {"title": "Lotte speaks", "gloss": "Lotte: Fun! I will call you. See you soon!"}
exercises:
  nl.a2.unit106.lesson01.exercise01.kies_tot_snel: {"instruction": "Choose the closing that means 'See you soon'.", "correct_option": "Tot snel", "distractors": ["Hoi", "Groetjes", "Bedankt"], "accepted_answers": [{"value": "Tot snel", "status": "correct"}], "feedback": "*Tot snel* = see you soon. *Groetjes* is a different closing: best wishes."}
  nl.a2.unit106.lesson01.exercise02.match_berichtwoorden: {"instruction": "Match each Dutch word or phrase to its meaning.", "accepted_answers": [{"value": [{"left": "Hoi", "right": "hi"}, {"left": "Groetjes", "right": "best wishes (casual closing)"}, {"left": "Liefs", "right": "love (closing for close friends)"}, {"left": "Tot snel", "right": "see you soon"}, {"left": "Bedankt", "right": "thanks"}, {"left": "het bericht", "right": "the message"}, {"left": "de vriendin", "right": "the female friend"}, {"left": "het feestje", "right": "the party"}], "status": "correct"}], "feedback": "Hoi opens a message; Groetjes, Liefs and Tot snel close it."}
  nl.a2.unit106.lesson01.exercise03.kies_opening: {"instruction": "Choose the opening of a message to Lotte.", "correct_option": "Hoi Lotte,", "distractors": ["Tot snel, Lotte", "Liefs, Lotte", "Groetjes, Lotte"], "accepted_answers": [{"value": "Hoi Lotte,", "status": "correct"}], "feedback": "*Hoi Lotte,* opens a message. The others are closings."}
  nl.a2.unit106.lesson01.exercise04.volgorde_bedankt: {"instruction": "Put the words in order to say 'Thanks for your message.'", "correct_option": "Bedankt voor je bericht", "accepted_answers": [{"value": "Bedankt voor je bericht", "status": "correct"}], "feedback": "*Bedankt voor je bericht* = thanks for your message."}
  nl.a2.unit106.lesson01.exercise05.vul_gaat: {"instruction": "Complete the question to a friend.", "correct_option": "gaat", "accepted_answers": [{"value": "gaat", "status": "correct"}], "feedback": "*Hoe gaat het met je?* = how are you?"}
  nl.a2.unit106.lesson01.exercise06.vertaal_bedankt: {"instruction": "Translate into Dutch.", "accepted_answers": [{"value": "Bedankt voor je bericht!", "status": "correct"}, {"value": "Bedankt voor je bericht", "status": "correct"}, {"value": "Bedankt voor je bericht.", "status": "correct"}], "feedback": "*Bedankt voor je bericht!*"}
  nl.a2.unit106.lesson01.exercise07.schrijf_sluiting: {"instruction": "Write the requested closing.", "correct_option": "Tot snel, Omar", "accepted_answers": [{"value": "Tot snel, Omar", "status": "correct"}, {"value": "Tot snel Omar", "status": "correct"}, {"value": "Tot snel, Omar!", "status": "correct"}, {"value": "Tot snel Omar!", "status": "correct"}], "feedback": "*Tot snel, Omar*"}
  nl.a2.unit106.lesson02.exercise01.kies_gezien: {"instruction": "Choose the correct present perfect sentence.", "correct_option": "Ik heb gisteren een film gezien.", "distractors": ["Ik ben gisteren een film gezien.", "Ik heb gisteren een film zien.", "Ik gezien heb gisteren een film."], "accepted_answers": [{"value": "Ik heb gisteren een film gezien.", "status": "correct"}], "feedback": "Zien uses *hebben*, and the participle *gezien* comes at the end."}
  nl.a2.unit106.lesson02.exercise02.kies_gegaan: {"instruction": "Choose the correct present perfect sentence.", "correct_option": "Ik ben naar het feestje gegaan.", "distractors": ["Ik heb naar het feestje gegaan.", "Ik ben naar het feestje gaan.", "Ik ben naar het feestje gaat."], "accepted_answers": [{"value": "Ik ben naar het feestje gegaan.", "status": "correct"}], "feedback": "Gaan uses *zijn*: *ik ben gegaan*."}
  nl.a2.unit106.lesson02.exercise03.match_participia: {"instruction": "Match each infinitive to its participle.", "accepted_answers": [{"value": [{"left": "zien", "right": "gezien"}, {"left": "kopen", "right": "gekocht"}, {"left": "bellen", "right": "gebeld"}, {"left": "wandelen", "right": "gewandeld"}, {"left": "dansen", "right": "gedanst"}, {"left": "eten", "right": "gegeten"}, {"left": "gaan", "right": "gegaan"}, {"left": "zijn", "right": "geweest"}], "status": "correct"}], "feedback": "The participle is used after heb, hebben, ben or zijn."}
  nl.a2.unit106.lesson02.exercise04.volgorde_gebeld: {"instruction": "Put the words in order to say 'I called Noor yesterday.'", "correct_option": "Ik heb gisteren Noor gebeld", "accepted_answers": [{"value": "Ik heb gisteren Noor gebeld", "status": "correct"}, {"value": "Gisteren heb ik Noor gebeld", "status": "correct"}, {"value": "Ik heb Noor gisteren gebeld", "status": "correct"}], "feedback": "The participle *gebeld* stays at the end. Starting with *Gisteren* puts *heb* second: *Gisteren heb ik Noor gebeld*."}
  nl.a2.unit106.lesson02.exercise05.vul_gedanst: {"instruction": "Complete the present perfect with the right form of hebben or zijn.", "correct_option": "heb", "accepted_answers": [{"value": "heb", "status": "correct"}], "feedback": "Dansen uses *hebben*: *ik heb gedanst*."}
  nl.a2.unit106.lesson02.exercise06.vertaal_gebeld: {"instruction": "Translate into Dutch using heb plus a participle.", "accepted_answers": [{"value": "Ik heb gisteren Noor gebeld.", "status": "correct"}, {"value": "Ik heb gisteren Noor gebeld", "status": "correct"}, {"value": "Gisteren heb ik Noor gebeld.", "status": "correct"}, {"value": "Gisteren heb ik Noor gebeld", "status": "correct"}, {"value": "Ik heb Noor gisteren gebeld.", "status": "correct"}, {"value": "Ik heb Noor gisteren gebeld", "status": "correct"}], "feedback": "*Ik heb gisteren Noor gebeld.*"}
  nl.a2.unit106.lesson02.exercise07.schrijf_gegaan: {"instruction": "Write the requested sentence with ben plus gegaan.", "correct_option": "Ik ben gisteren naar het feestje gegaan.", "accepted_answers": [{"value": "Ik ben gisteren naar het feestje gegaan.", "status": "correct"}, {"value": "Ik ben gisteren naar het feestje gegaan", "status": "correct"}, {"value": "Gisteren ben ik naar het feestje gegaan.", "status": "correct"}, {"value": "Gisteren ben ik naar het feestje gegaan", "status": "correct"}], "feedback": "*Ik ben gisteren naar het feestje gegaan.*"}
  nl.a2.unit106.lesson03.exercise01.kies_koken: {"instruction": "Choose the correct Dutch sentence.", "correct_option": "Morgen ga ik koken.", "distractors": ["Morgen ik ga koken.", "Morgen ik koken ga.", "Morgen ga koken ik."], "accepted_answers": [{"value": "Morgen ga ik koken.", "status": "correct"}], "feedback": "With *Morgen* first, the verb is second: *Morgen ga ik koken.*"}
  nl.a2.unit106.lesson03.exercise02.match_planwoorden: {"instruction": "Match each Dutch word or phrase to its meaning.", "accepted_answers": [{"value": [{"left": "gisteren", "right": "yesterday"}, {"left": "morgen", "right": "tomorrow"}, {"left": "vorige week", "right": "last week"}, {"left": "volgende week", "right": "next week"}, {"left": "misschien", "right": "maybe"}, {"left": "het weekend", "right": "the weekend"}, {"left": "bezoeken", "right": "to visit"}, {"left": "koken", "right": "to cook"}], "status": "correct"}], "feedback": "Look at the time words first: they tell you whether it is past or future."}
  nl.a2.unit106.lesson03.exercise03.volgorde_oom: {"instruction": "Put the words in order to say 'Next week I am going to visit my uncle.'", "correct_option": "Volgende week ga ik mijn oom bezoeken", "accepted_answers": [{"value": "Volgende week ga ik mijn oom bezoeken", "status": "correct"}, {"value": "Ik ga volgende week mijn oom bezoeken", "status": "correct"}, {"value": "Ik ga mijn oom volgende week bezoeken", "status": "correct"}], "feedback": "The infinitive *bezoeken* stays at the end. After *Volgende week*, the verb comes second."}
  nl.a2.unit106.lesson03.exercise04.vul_te: {"instruction": "Complete the sentence with the small word that goes before the infinitive.", "correct_option": "te", "accepted_answers": [{"value": "te", "status": "correct"}], "feedback": "*van plan om ... te* + infinitive: *om mijn oom te bezoeken*."}
  nl.a2.unit106.lesson03.exercise05.vertaal_zullen: {"instruction": "Translate into Dutch using zullen.", "accepted_answers": [{"value": "Ik zal je morgen bellen.", "status": "correct"}, {"value": "Ik zal je morgen bellen", "status": "correct"}, {"value": "Morgen zal ik je bellen.", "status": "correct"}, {"value": "Morgen zal ik je bellen", "status": "correct"}, {"value": "Ik zal jou morgen bellen.", "status": "correct"}, {"value": "Ik zal jou morgen bellen", "status": "correct"}, {"value": "Morgen zal ik jou bellen.", "status": "correct"}, {"value": "Morgen zal ik jou bellen", "status": "correct"}], "feedback": "*Ik zal je morgen bellen.*"}
  nl.a2.unit106.lesson03.exercise06.vertaal_gaan: {"instruction": "Translate into Dutch using gaan plus an infinitive.", "accepted_answers": [{"value": "Volgende week gaan wij mijn oom bezoeken.", "status": "correct"}, {"value": "Volgende week gaan wij mijn oom bezoeken", "status": "correct"}, {"value": "Volgende week gaan we mijn oom bezoeken.", "status": "correct"}, {"value": "Volgende week gaan we mijn oom bezoeken", "status": "correct"}, {"value": "Wij gaan volgende week mijn oom bezoeken.", "status": "correct"}, {"value": "Wij gaan volgende week mijn oom bezoeken", "status": "correct"}, {"value": "We gaan volgende week mijn oom bezoeken.", "status": "correct"}, {"value": "We gaan volgende week mijn oom bezoeken", "status": "correct"}, {"value": "Wij gaan mijn oom volgende week bezoeken.", "status": "correct"}, {"value": "Wij gaan mijn oom volgende week bezoeken", "status": "correct"}, {"value": "We gaan mijn oom volgende week bezoeken.", "status": "correct"}, {"value": "We gaan mijn oom volgende week bezoeken", "status": "correct"}], "feedback": "*Volgende week gaan wij mijn oom bezoeken.*"}
  nl.a2.unit106.lesson03.exercise07.schrijf_vanplan: {"instruction": "Write the requested sentence with van plan om ... te.", "correct_option": "Ik ben van plan om morgen naar de dierentuin te gaan.", "accepted_answers": [{"value": "Ik ben van plan om morgen naar de dierentuin te gaan.", "status": "correct"}, {"value": "Ik ben van plan om morgen naar de dierentuin te gaan", "status": "correct"}, {"value": "Morgen ben ik van plan om naar de dierentuin te gaan.", "status": "correct"}, {"value": "Morgen ben ik van plan om naar de dierentuin te gaan", "status": "correct"}, {"value": "Ik ben van plan morgen naar de dierentuin te gaan.", "status": "correct"}, {"value": "Ik ben van plan morgen naar de dierentuin te gaan", "status": "correct"}, {"value": "Morgen ben ik van plan naar de dierentuin te gaan.", "status": "correct"}, {"value": "Morgen ben ik van plan naar de dierentuin te gaan", "status": "correct"}], "feedback": "*Ik ben van plan om morgen naar de dierentuin te gaan.*"}
  nl.a2.unit106.lesson04.exercise01.kies_omdat: {"instruction": "Choose the correct sentence with omdat.", "correct_option": "Ik blijf thuis, omdat ik ziek ben.", "distractors": ["Ik blijf thuis, omdat ik ben ziek.", "Ik blijf thuis, omdat ben ik ziek.", "Ik blijf thuis, omdat ziek ik ben."], "accepted_answers": [{"value": "Ik blijf thuis, omdat ik ziek ben.", "status": "correct"}], "feedback": "After *omdat* the verb goes to the end: *omdat ik ziek ben*."}
  nl.a2.unit106.lesson04.exercise02.match_redenen: {"instruction": "Match each Dutch clause to its English meaning.", "accepted_answers": [{"value": [{"left": "omdat ik moe ben", "right": "because I am tired"}, {"left": "want ik heb geen tijd", "right": "because I have no time"}, {"left": "dus ik blijf thuis", "right": "so I stay at home"}, {"left": "omdat het druk is", "right": "because it is busy"}, {"left": "want ik ben ziek", "right": "because I am ill"}, {"left": "dus ik ga naar de film", "right": "so I go to the film"}], "status": "correct"}], "feedback": "Omdat and want give a reason; dus gives the result."}
  nl.a2.unit106.lesson04.exercise03.volgorde_omdat: {"instruction": "Put the words in order to say 'I stay at home because I am ill.'", "correct_option": "Ik blijf thuis omdat ik ziek ben", "accepted_answers": [{"value": "Ik blijf thuis omdat ik ziek ben", "status": "correct"}, {"value": "Omdat ik ziek ben blijf ik thuis", "status": "correct"}], "feedback": "*omdat ik ziek ben* ends with the verb. If it comes first, the main clause starts with the verb: *blijf ik thuis*."}
  nl.a2.unit106.lesson04.exercise04.vul_omdat: {"instruction": "Complete the sentence with the connector that sends the verb to the end.", "correct_option": "omdat", "accepted_answers": [{"value": "omdat", "status": "correct"}], "feedback": "The verb *ben* is at the end, so the connector is *omdat*."}
  nl.a2.unit106.lesson04.exercise05.kies_dus: {"instruction": "Choose the connector that means 'so' and introduces the result.", "correct_option": "dus", "distractors": ["omdat", "want", "maar"], "accepted_answers": [{"value": "dus", "status": "correct"}], "feedback": "The second part is the result: *dus ik blijf thuis*."}
  nl.a2.unit106.lesson04.exercise06.vertaal_omdat: {"instruction": "Translate into Dutch using omdat.", "accepted_answers": [{"value": "Ik kom niet, omdat ik moe ben.", "status": "correct"}, {"value": "Ik kom niet, omdat ik moe ben", "status": "correct"}, {"value": "Ik kom niet omdat ik moe ben.", "status": "correct"}, {"value": "Ik kom niet omdat ik moe ben", "status": "correct"}, {"value": "Omdat ik moe ben, kom ik niet.", "status": "correct"}, {"value": "Omdat ik moe ben, kom ik niet", "status": "correct"}, {"value": "Omdat ik moe ben kom ik niet.", "status": "correct"}, {"value": "Omdat ik moe ben kom ik niet", "status": "correct"}], "feedback": "*Ik kom niet, omdat ik moe ben.*"}
