course:
  title: "Dutch A1"
  description: "Beginner Dutch for describing current weather conditions and making a simple weather-related plan."

units:
  nl.a1.unit19.weather: {title: "The weather"}

lessons:
  nl.a1.unit19.lesson01.wat_voor_weer: {title: "What's the weather like?"}
  nl.a1.unit19.lesson02.koud_of_warm: {title: "Cold or warm?"}
  nl.a1.unit19.lesson03.het_weerbericht: {title: "The weather forecast"}
  nl.a1.unit19.lesson04.plannen_maken_bij_weer: {title: "Making plans around the weather"}
  nl.a1.unit19.lesson05.weerbericht_lezen: {title: "Reading a weather forecast"}
  nl.a1.unit19.lesson06.weekend_plannen: {title: "Making weekend plans"}

teaching:
  nl.a1.unit19.lesson01.teach.weer: {title: "Weather", gloss: "the weather", note: "A neuter noun: *het weer*.", example_gloss: "What's the weather like?"}
  nl.a1.unit19.lesson01.teach.wat_voor_weer: {title: "Asking about the weather", gloss: "What's the weather like?", note: "*Wat voor* + noun asks 'what kind of'; a very common general question."}
  nl.a1.unit19.lesson01.teach.zonnig: {title: "Sunny", gloss: "It is sunny.", note: "*Het is* + weather adjective is the standard pattern, using the impersonal *het* (it)."}
  nl.a1.unit19.lesson01.teach.regent: {title: "Raining", gloss: "It is raining.", note: "*Regenen* (to rain) is used impersonally: *het regent*, with no separate adjective needed."}
  nl.a1.unit19.lesson01.teach.bewolkt: {title: "Cloudy", gloss: "It is cloudy.", note: "Follows the same *het is* + adjective pattern as *zonnig*."}

  nl.a1.unit19.lesson02.teach.koud: {title: "Cold", gloss: "It is cold today.", note: "*Vandaag* (today) situates the weather description in time."}
  nl.a1.unit19.lesson02.teach.warm: {title: "Warm", gloss: "It is warm today.", note: "*Warm* covers both 'warm' and 'hot' in everyday Dutch weather talk."}
  nl.a1.unit19.lesson02.teach.niet_koud: {title: "Contrasting temperatures", gloss: "It is not cold, it is warm.", note: "*Niet* negates *koud* directly before the adjective."}

  nl.a1.unit19.lesson03.teach.weerbericht: {title: "The weather forecast", gloss: "the weather forecast", note: "A neuter noun: *het weerbericht*, a compound of *weer* (weather) and *bericht* (report).", example_gloss: "What's the weather forecast?"}
  nl.a1.unit19.lesson03.teach.morgen_zonnig: {title: "Tomorrow's weather", gloss: "Tomorrow it is sunny.", note: "*Morgen* (tomorrow) moves to the front of the sentence, so *is het* is inverted after it."}
  nl.a1.unit19.lesson03.teach.zaterdag_zondag: {title: "A two-day forecast", gloss: "Saturday it is sunny and warm, but Sunday it rains all day.", note: "*De hele dag* (all day) reinforces how long the rain lasts."}

  nl.a1.unit19.lesson04.teach.wandeling: {title: "The walk", gloss: "the walk", note: "A common gender noun: *de wandeling*.", example_gloss: "Shall we go for a walk?"}
  nl.a1.unit19.lesson04.teach.zullen_we_wandeling: {title: "Suggesting a walk", gloss: "Shall we go for a walk?", note: "*Zullen we ...?* reuses the plan-suggesting pattern from unit11; *een wandeling maken* (literally 'to make a walk') is the fixed way to say 'go for a walk.'"}
  nl.a1.unit19.lesson04.teach.binnen_blijven: {title: "A conditional plan", gloss: "If it rains, we stay inside.", note: "*Als* (if) introduces the condition; the main clause *blijven we binnen* inverts subject and verb because the als-clause comes first."}
  nl.a1.unit19.lesson04.teach.goed_idee_laten: {title: "Agreeing and suggesting", gloss: "Good idea! Let's go for a walk.", note: "*Laten we ...* (let's ...) is another common way to propose an activity, alongside *Zullen we ...?* from unit11."}

  nl.a1.unit19.lesson05.teach.weerbericht_tekst: {title: "Read a two-day forecast", gloss: "Weather forecast: Saturday it is sunny and warm. Sunday it rains all day.", note: "Track which day has which conditions."}

  nl.a1.unit19.lesson06.teach.lotte_ask_weather: {title: "Lotte asks about the weekend", gloss: "Lotte: What's the weather like this weekend?", note: "*Dit weekend* (this weekend) situates the question in the near future."}
  nl.a1.unit19.lesson06.teach.omar_forecast: {title: "Omar shares the forecast", gloss: "Omar: Saturday it is sunny and warm, but Sunday it rains all day.", note: "Matches the forecast read in lesson05 exactly."}
  nl.a1.unit19.lesson06.teach.lotte_suggest_walk: {title: "Lotte proposes a plan", gloss: "Lotte: Shall we go for a walk on Saturday then?", note: "*Dan* (then) ties the suggestion directly to the good weather Omar just described."}
  nl.a1.unit19.lesson06.teach.omar_agree: {title: "Omar agrees and plans Sunday", gloss: "Omar: Good idea. And on Sunday let's stay comfortably inside.", note: "*Lekker* here is a filler word meaning something like 'nice and,' commonly used before an adjective or verb to make it sound more appealing."}
  nl.a1.unit19.lesson06.teach.lotte_closing: {title: "Lotte finalizes the plan", gloss: "Lotte: Perfect, then we'll watch a film.", note: "*Kijken* (to watch) pairs naturally with *een film* (a film)."}

exercises:
  nl.a1.unit19.lesson01.exercise01.choose_sunny:
    instruction: "Choose the Dutch sentence meaning 'It is sunny.'"
    correct_option: "Het is zonnig."
    distractors: ["Het regent zonnig.", "Het is bewolkt.", "Het zonnig is."]
    accepted_answers: [{value: "Het is zonnig.", status: correct}]
    feedback: "Het is + adjective is the standard weather pattern."
  nl.a1.unit19.lesson01.exercise02.listen_rain:
    instruction: "Listen and choose what the speaker says."
    correct_option: "It is raining."
    distractors: ["It is sunny.", "It is cloudy.", "What's the weather like?"]
    accepted_answers: [{value: "It is raining.", status: correct}]
    feedback: "Het regent."
  nl.a1.unit19.lesson01.exercise03.match_conditions:
    instruction: "Match each Dutch word or sentence to its meaning."
    accepted_answers: [{value: [{left: zonnig, right: sunny}, {left: regent, right: raining}, {left: bewolkt, right: cloudy}, {left: "het weer", right: "the weather"}, {left: "Het is zonnig.", right: "It is sunny."}, {left: "Het is bewolkt.", right: "It is cloudy."}], status: correct}]
    feedback: "Zonnig and bewolkt are adjectives; regent is a verb form used on its own."
  nl.a1.unit19.lesson01.exercise04.order_cloudy:
    instruction: "Put the words in order to say it is cloudy."
    correct_option: "Het is bewolkt"
    accepted_answers: [{value: "Het is bewolkt", status: correct}]
    feedback: "The complete sentence is Het is bewolkt."
  nl.a1.unit19.lesson01.exercise05.listen_order_sunny:
    instruction: "Listen and put the words in the order you hear."
    correct_option: "Het is zonnig"
    accepted_answers: [{value: "Het is zonnig", status: correct}]
    feedback: "The complete sentence is Het is zonnig."
  nl.a1.unit19.lesson01.exercise06.complete_rain:
    instruction: "Complete the answer."
    accepted_answers: [{value: regent, status: correct}]
    feedback: "Het regent."
  nl.a1.unit19.lesson01.exercise07.write_sunny:
    instruction: "Write in Dutch: it is sunny."
    accepted_answers: [{value: "Het is zonnig.", status: correct}, {value: "Het is zonnig", status: correct}]
    feedback: "Het is zonnig."

  nl.a1.unit19.lesson02.exercise01.choose_cold:
    instruction: "Choose the Dutch sentence meaning 'It is cold today.'"
    correct_option: "Het is koud vandaag."
    distractors: ["Het is koud morgen.", "Het is warm vandaag.", "Het koud is vandaag."]
    accepted_answers: [{value: "Het is koud vandaag.", status: correct}]
    feedback: "Vandaag situates the description in the present day."
  nl.a1.unit19.lesson02.exercise02.listen_warm:
    instruction: "Listen and choose what the speaker says."
    correct_option: "It is warm today."
    distractors: ["It is cold today.", "It is sunny today.", "It is warm tomorrow."]
    accepted_answers: [{value: "It is warm today.", status: correct}]
    feedback: "Het is warm vandaag."
  nl.a1.unit19.lesson02.exercise03.match_temperatures:
    instruction: "Match each Dutch word to its meaning."
    accepted_answers: [{value: [{left: koud, right: cold}, {left: warm, right: warm}, {left: zonnig, right: sunny}, {left: regent, right: raining}, {left: bewolkt, right: cloudy}], status: correct}]
    feedback: "Koud, warm, zonnig, regent, and bewolkt are the basic weather words in this unit."
  nl.a1.unit19.lesson02.exercise04.order_cold:
    instruction: "Put the words in order to say it is cold today."
    correct_option: "Het is koud vandaag"
    accepted_answers: [{value: "Het is koud vandaag", status: correct}]
    feedback: "The complete sentence is Het is koud vandaag."
  nl.a1.unit19.lesson02.exercise05.complete_warm:
    instruction: "Complete the contrast."
    accepted_answers: [{value: warm, status: correct}]
    feedback: "Het is niet koud, het is warm."
  nl.a1.unit19.lesson02.exercise06.translate_cold:
    instruction: "Translate into Dutch."
    accepted_answers: [{value: "Het is koud vandaag.", status: correct}, {value: "Het is koud vandaag", status: correct}]
    feedback: "Het is koud vandaag."

  nl.a1.unit19.lesson03.exercise01.choose_tomorrow:
    instruction: "Choose the Dutch sentence meaning 'Tomorrow it is sunny.'"
    correct_option: "Morgen is het zonnig."
    distractors: ["Morgen het is zonnig.", "Het is morgen zonnig is.", "Vandaag is het zonnig."]
    accepted_answers: [{value: "Morgen is het zonnig.", status: correct}]
    feedback: "Putting morgen first inverts is and het."
  nl.a1.unit19.lesson03.exercise02.listen_forecast:
    instruction: "Listen and choose what the speaker says."
    correct_option: "Tomorrow it is sunny."
    distractors: ["Today it is sunny.", "Tomorrow it is cloudy.", "Tomorrow it rains."]
    accepted_answers: [{value: "Tomorrow it is sunny.", status: correct}]
    feedback: "Morgen is het zonnig."
  nl.a1.unit19.lesson03.exercise03.match_forecast_days:
    instruction: "Match each day, word, or phrase to its meaning."
    accepted_answers: [{value: [{left: zaterdag, right: "sunny and warm"}, {left: zondag, right: "rain all day"}, {left: morgen, right: tomorrow}, {left: "het weerbericht", right: "the weather forecast"}, {left: zonnig, right: sunny}, {left: warm, right: warm}], status: correct}]
    feedback: "Saturday is sunny and warm; Sunday rains all day."
  nl.a1.unit19.lesson03.exercise04.order_forecast_tomorrow:
    instruction: "Put the words in order to say tomorrow it is sunny."
    correct_option: "Morgen is het zonnig"
    accepted_answers: [{value: "Morgen is het zonnig", status: correct}]
    feedback: "The complete sentence is Morgen is het zonnig."
  nl.a1.unit19.lesson03.exercise05.complete_forecast:
    instruction: "Complete the forecast."
    accepted_answers: [{value: dag, status: correct}]
    feedback: "Zondag regent het de hele dag."
  nl.a1.unit19.lesson03.exercise06.write_forecast:
    instruction: "Write in Dutch: on Saturday it is sunny and warm."
    accepted_answers: [{value: "Zaterdag is het zonnig en warm.", status: correct}, {value: "Zaterdag is het zonnig en warm", status: correct}]
    feedback: "Zaterdag is het zonnig en warm."

  nl.a1.unit19.lesson04.exercise01.choose_walk_suggestion:
    instruction: "Choose the Dutch sentence meaning 'Shall we go for a walk?'"
    correct_option: "Zullen we een wandeling maken?"
    distractors: ["Zullen we een wandeling doen?", "Zullen wij wandeling maken?", "Zal we een wandeling maken?"]
    accepted_answers: [{value: "Zullen we een wandeling maken?", status: correct}]
    feedback: "Een wandeling maken is the fixed way to say 'go for a walk.'"
  nl.a1.unit19.lesson04.exercise02.listen_walk_suggestion:
    instruction: "Listen and choose what the speaker suggests."
    correct_option: "going for a walk"
    distractors: ["watching a film", "staying inside", "checking the forecast"]
    accepted_answers: [{value: "going for a walk", status: correct}]
    feedback: "Zullen we een wandeling maken?"
  nl.a1.unit19.lesson04.exercise03.match_weather_plans:
    instruction: "Match each weather condition, word, or phrase to its meaning."
    accepted_answers: [{value: [{left: zonnig, right: "go for a walk"}, {left: regent, right: "stay inside"}, {left: "de wandeling", right: "the walk"}, {left: binnen, right: inside}, {left: "Goed idee!", right: "Good idea!"}, {left: bewolkt, right: cloudy}], status: correct}]
    feedback: "Good weather suggests a walk; rain suggests staying inside."
  nl.a1.unit19.lesson04.exercise04.order_stay_inside:
    instruction: "Put the words in order to say if it rains, we stay inside."
    correct_option: "Als het regent blijven we binnen"
    accepted_answers: [{value: "Als het regent blijven we binnen", status: correct}]
    feedback: "The complete sentence is Als het regent, blijven we binnen."
  nl.a1.unit19.lesson04.exercise05.complete_walk_suggestion:
    instruction: "Complete the suggestion."
    accepted_answers: [{value: wandeling, status: correct}]
    feedback: "Zullen we een wandeling maken?"
  nl.a1.unit19.lesson04.exercise06.respond_walk_suggestion:
    instruction: "Answer in Dutch: agree, and say let's go for a walk."
    accepted_answers: [{value: "Goed idee, laten we een wandeling maken.", status: correct}, {value: "Goed idee laten we een wandeling maken", status: correct}, {value: "Goed idee, en laten we een wandeling maken.", status: correct}, {value: "Goed idee, en laten we een wandeling maken", status: correct}, {value: "Goed idee! Laten we een wandeling maken.", status: correct}, {value: "Goed idee Laten we een wandeling maken", status: correct}]
    feedback: "Goed idee, laten we een wandeling maken."

  nl.a1.unit19.lesson05.exercise01.read_saturday:
    instruction: "Read the forecast and choose Saturday's weather."
    correct_option: "sunny and warm"
    distractors: ["cloudy and cold", "rainy all day", "sunny but cold"]
    accepted_answers: [{value: "sunny and warm", status: correct}]
    feedback: "Zaterdag is het zonnig en warm."
  nl.a1.unit19.lesson05.exercise02.read_sunday:
    instruction: "Read the forecast and choose Sunday's weather."
    correct_option: "rain all day"
    distractors: ["sunny all day", "cloudy in the morning only", "rain in the evening only"]
    accepted_answers: [{value: "rain all day", status: correct}]
    feedback: "Zondag regent het de hele dag."
  nl.a1.unit19.lesson05.exercise03.read_better_day:
    instruction: "Read the forecast and choose the better day for a walk."
    correct_option: Saturday
    distractors: [Sunday, "neither day", "both days equally"]
    accepted_answers: [{value: Saturday, status: correct}]
    feedback: "Saturday is sunny and warm, unlike rainy Sunday."
  nl.a1.unit19.lesson05.exercise04.match_forecast_summary:
    instruction: "Match each day to its forecast."
    accepted_answers: [{value: [{left: zaterdag, right: "sunny and warm"}, {left: zondag, right: "rain all day"}], status: correct}]
    feedback: "The forecast covers two contrasting days."
  nl.a1.unit19.lesson05.exercise05.listen_weather_report:
    instruction: "Listen and choose what Sunday's forecast says."
    correct_option: "rain all day"
    distractors: ["sunny all day", "cloudy all day", "rain in the morning only"]
    accepted_answers: [{value: "rain all day", status: correct}]
    feedback: "Zondag regent het de hele dag."
  nl.a1.unit19.lesson05.exercise06.write_forecast_summary:
    instruction: "Write in Dutch: Saturday it is sunny and warm, but Sunday it rains all day."
    accepted_answers: [{value: "Zaterdag is het zonnig en warm, maar zondag regent het de hele dag.", status: correct}, {value: "Zaterdag is het zonnig en warm maar zondag regent het de hele dag", status: correct}]
    feedback: "Zaterdag is het zonnig en warm, maar zondag regent het de hele dag."

  nl.a1.unit19.lesson06.exercise01.listen_ask_weather:
    instruction: "Listen and choose what Lotte asks."
    correct_option: "What's the weather like this weekend?"
    distractors: ["What's the weather like today?", "Shall we go for a walk?", "What did you do this weekend?"]
    accepted_answers: [{value: "What's the weather like this weekend?", status: correct}]
    feedback: "Wat voor weer is het dit weekend?"
  nl.a1.unit19.lesson06.exercise02.comprehend_saturday:
    instruction: "Listen to the dialogue and choose Saturday's weather."
    correct_option: "sunny and warm"
    distractors: ["cloudy and cold", "rain all day", "sunny but cold"]
    accepted_answers: [{value: "sunny and warm", status: correct}]
    feedback: "Omar says: Zaterdag is het zonnig en warm."
  nl.a1.unit19.lesson06.exercise03.comprehend_sunday:
    instruction: "Listen to the dialogue and choose Sunday's weather."
    correct_option: "rain all day"
    distractors: ["sunny all day", "cloudy all day", "rain in the evening only"]
    accepted_answers: [{value: "rain all day", status: correct}]
    feedback: "Omar says: zondag regent het de hele dag."
  nl.a1.unit19.lesson06.exercise04.comprehend_plan:
    instruction: "Listen to the dialogue and choose what Lotte and Omar plan for Saturday and Sunday."
    correct_option: "a walk on Saturday, a film on Sunday"
    distractors: ["a film on Saturday, a walk on Sunday", "a walk on both days", "a film on both days"]
    accepted_answers: [{value: "a walk on Saturday, a film on Sunday", status: correct}]
    feedback: "They plan a wandeling for Saturday's good weather and a film for Sunday's rain."
  nl.a1.unit19.lesson06.exercise05.order_suggest_walk:
    instruction: "Put the words in order to suggest going for a walk on Saturday."
    correct_option: "Zullen we dan zaterdag een wandeling maken"
    accepted_answers: [{value: "Zullen we dan zaterdag een wandeling maken", status: correct}]
    feedback: "The complete question is Zullen we dan zaterdag een wandeling maken?"
  nl.a1.unit19.lesson06.exercise06.respond_agree_plan:
    instruction: "Answer in Dutch: agree, and say on Sunday you'll stay comfortably inside."
    accepted_answers: [{value: "Goed idee, en zondag blijven we lekker binnen.", status: correct}, {value: "Goed idee en zondag blijven we lekker binnen", status: correct}, {value: "Goed idee. En zondag blijven we lekker binnen.", status: correct}, {value: "Goed idee En zondag blijven we lekker binnen", status: correct}]
    feedback: "Goed idee. En zondag blijven we lekker binnen."
  nl.a1.unit19.lesson06.exercise07.listen_type_closing:
    instruction: "Listen and type the complete Dutch sentence."
    accepted_answers: [{value: "Perfect, dan kijken we een film.", status: correct}, {value: "Perfect dan kijken we een film", status: correct}]
    feedback: "Perfect, dan kijken we een film."
  nl.a1.unit19.lesson06.exercise08.write_weekend_plan:
    instruction: "Write two Dutch sentences: on Saturday they go for a walk, and on Sunday they watch a film."
    accepted_answers: [{value: "Zaterdag maken we een wandeling. Zondag kijken we een film.", status: correct}, {value: "Zaterdag maken we een wandeling Zondag kijken we een film", status: correct}, {value: "Zaterdag maken we een wandeling, en zondag kijken we een film.", status: correct}, {value: "Zaterdag maken we een wandeling, en zondag kijken we een film", status: correct}]
    feedback: "Zaterdag maken we een wandeling. Zondag kijken we een film."
