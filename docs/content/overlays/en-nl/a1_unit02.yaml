course:
  title: "Dutch A1"
  description: "Beginner Dutch for using numbers in common everyday situations in the Netherlands."

units:
  nl.a1.unit02.basic_numbers: {title: "Numbers in everyday life"}

lessons:
  nl.a1.unit02.lesson01.nul_tot_twaalf: {title: "Zero to twelve"}
  nl.a1.unit02.lesson02.vanaf_dertien: {title: "Thirteen to ninety-nine"}
  nl.a1.unit02.lesson03.telefoon_en_huisnummer: {title: "Phone and house numbers"}
  nl.a1.unit02.lesson04.leeftijd_en_aantallen: {title: "Ages and quantities"}
  nl.a1.unit02.lesson05.prijzen: {title: "Prices in euros"}
  nl.a1.unit02.lesson06.inschrijven_bij_de_bibliotheek: {title: "Registering for the language café"}

teaching:
  nl.a1.unit02.lesson01.teach.zero_to_four: {title: "Zero to four", gloss: "0 — zero, 1 — one, 2 — two, 3 — three, 4 — four", note: "Dutch nul is zero, including the first digit of a phone number. The accent marks in één distinguish the number from the article een in writing; ordinary Dutch text sometimes omits them when the meaning is clear.", example_gloss: ["I have zero euros.", "I have one book.", "I have two chairs.", "I have three books.", "There are four people."]}
  nl.a1.unit02.lesson01.teach.five_to_eight: {title: "Five to eight", gloss: "5 — five, 6 — six, 7 — seven, 8 — eight", note: "Vijf, zes, zeven, and acht follow the same simple pattern as zero through four.", example_gloss: ["I have five euros.", "I have six books.", "I have seven chairs.", "There are eight people."]}
  nl.a1.unit02.lesson01.teach.nine_to_twelve: {title: "Nine to twelve", gloss: "9 — nine, 10 — ten, 11 — eleven, 12 — twelve", note: "Negen, tien, elf, and twaalf complete the numbers up to twelve.", example_gloss: ["I have nine euros.", "I have ten chairs.", "I have eleven books.", "There are twelve people."]}
  nl.a1.unit02.lesson01.teach.how_many: {title: "Ask how many", gloss: "How many?", note: "Hoeveel asks for a number or amount."}

  nl.a1.unit02.lesson02.teach.teens: {title: "The teens", gloss: "13–19: thirteen, fourteen, fifteen, sixteen, seventeen, eighteen, nineteen", note: "The Dutch forms from thirteen through nineteen end in -tien.", example_gloss: ["I am thirteen years old.", "I have fourteen euros.", "I am fifteen years old.", "I have sixteen books.", "There are seventeen people.", "I am eighteen years old.", "I have nineteen chairs."]}
  nl.a1.unit02.lesson02.teach.tens: {title: "The tens", gloss: "20–90: twenty, thirty, forty, fifty, sixty, seventy, eighty, ninety", note: "Learn these tens as the building blocks for larger two-digit numbers.", example_gloss: ["I am twenty years old.", "That costs thirty euros.", "I have forty euros.", "There are fifty people.", "I am sixty years old.", "That costs seventy euros.", "There are eighty people.", "I have ninety euros."]}
  nl.a1.unit02.lesson02.teach.inversion_rule: {title: "Units come before tens", gloss: "21–99, except 30, 40, and other exact tens: unit + en + tens", note: "Unlike English, Dutch normally says the unit first: 42 is literally 'two-and-forty.' Exact multiples of ten use only the tens word."}
  nl.a1.unit02.lesson02.teach.twenty_one: {title: "Twenty-one", gloss: "21 — twenty-one", note: "Eenentwintig combines een + en + twintig into one written word.", example_gloss: "The language café is in room twenty-one."}
  nl.a1.unit02.lesson02.teach.twenty_two: {title: "Twenty-two", gloss: "22 — twenty-two", note: "The two dots on ë in tweeëntwintig show that the adjacent vowels start separate syllables.", example_gloss: "I am twenty-two years old."}
  nl.a1.unit02.lesson02.teach.thirty_two: {title: "Thirty-two", gloss: "32 — thirty-two", note: "Tweeëndertig is written as one word, with two dots on the joining ë.", example_gloss: "Omar is thirty-two years old."}
  nl.a1.unit02.lesson02.teach.forty_two: {title: "Forty-two", gloss: "42 is forty-two.", note: "Say the unit before the tens: twee-en-veertig, written together as tweeënveertig."}
  nl.a1.unit02.lesson02.teach.forty_eight: {title: "Forty-eight", gloss: "48 — forty-eight", note: "Achtenveertig is acht + en + veertig, written as one word.", example_gloss: "I live at number forty-eight."}
  nl.a1.unit02.lesson02.teach.seventy_five: {title: "Seventy-five", gloss: "75 — seventy-five", note: "Vijfenzeventig puts vijf before zeventig.", example_gloss: "That costs seventy-five cents."}
  nl.a1.unit02.lesson02.teach.ninety_nine: {title: "Ninety-nine", gloss: "99 — ninety-nine", note: "Negenennegentig is one compound word.", example_gloss: "I am ninety-nine years old."}

  nl.a1.unit02.lesson03.teach.ask_phone: {title: "Ask for a phone number", gloss: "What is your phone number?", note: "Je keeps the question informal, matching Lotte and Omar's language-café setting."}
  nl.a1.unit02.lesson03.teach.phone_number: {title: "Give a Dutch mobile number", gloss: "My phone number is 06 21 43 65 87.", note: "Dutch mobile numbers begin with 06 and are commonly displayed as 06 followed by eight digits."}
  nl.a1.unit02.lesson03.teach.phone_spoken: {title: "Say the phone number in groups", gloss: "zero six, twenty-one, forty-three, sixty-five, eighty-seven", note: "Speakers group phone digits in different ways. This course model uses 06 followed by two-digit groups; saying the digits one by one is also normal when clarity matters."}
  nl.a1.unit02.lesson03.teach.ask_house_number: {title: "Ask for a house number", gloss: "What is your house number?", note: "Huisnummer is the number attached to a street address."}
  nl.a1.unit02.lesson03.teach.house_number: {title: "Give a house number", gloss: "My house number is 48.", note: "Digits are natural in a written address or form."}
  nl.a1.unit02.lesson03.teach.live_number: {title: "Say where you live by number", gloss: "I live at number forty-eight.", note: "Op nummer ... is a natural way to state a house number when the street is already known."}
  nl.a1.unit02.lesson03.teach.repeat: {title: "Ask for repetition", gloss: "Can you repeat that?", note: "Useful when a spoken phone number is too fast to catch."}

  nl.a1.unit02.lesson04.teach.ask_age: {title: "Ask someone's age informally", gloss: "How old are you?", note: "This uses informal je; age questions are appropriate only when the context makes them relevant."}
  nl.a1.unit02.lesson04.teach.age_twenty_eight: {title: "Give an age", gloss: "I am twenty-eight years old.", note: "Dutch says Ik ben ... jaar, literally 'I am ... year.'"}
  nl.a1.unit02.lesson04.teach.age_thirty_two: {title: "State Omar's age", gloss: "Omar is thirty-two years old.", note: "Jaar does not take a plural ending after a number when stating age."}
  nl.a1.unit02.lesson04.teach.how_many_people: {title: "Ask for a number of people", gloss: "How many people are there?", note: "Hoeveel comes directly before the noun mensen."}
  nl.a1.unit02.lesson04.teach.twelve_people: {title: "Give a number of people", gloss: "There are twelve people.", note: "Er zijn is the ordinary plural construction for 'there are.'"}
  nl.a1.unit02.lesson04.teach.three_books: {title: "Count books", gloss: "I have three books.", note: "After numbers greater than one, boek takes the plural boeken."}
  nl.a1.unit02.lesson04.teach.seven_chairs: {title: "Count chairs", gloss: "seven chairs", note: "Stoelen is the plural of stoel."}

  nl.a1.unit02.lesson05.teach.euro: {title: "Euro", gloss: "the euro", note: "Euro normally remains singular after a stated amount: twee euro, not twee euro's.", example_gloss: "That costs two euros."}
  nl.a1.unit02.lesson05.teach.cent: {title: "Cent", gloss: "the cent", note: "Cent also commonly remains singular after a number in a price.", example_gloss: "That's fifty cents."}
  nl.a1.unit02.lesson05.teach.ask_price: {title: "Ask a price", gloss: "How much does this cost?", note: "Hoeveel asks for the amount and kost means 'costs.'"}
  nl.a1.unit02.lesson05.teach.two_fifty: {title: "Two euros fifty", gloss: "€2.50 — two euros fifty", note: "Dutch writes a decimal comma. In everyday speech, €2,50 is commonly twee euro vijftig, with no en."}
  nl.a1.unit02.lesson05.teach.seventy_five_cents: {title: "Seventy-five cents", gloss: "€0.75 — seventy-five cents", note: "When the amount is below one euro, saying only the cents is natural."}
  nl.a1.unit02.lesson05.teach.twelve_euros: {title: "Twelve euros", gloss: "€12 — twelve euros", note: "A whole-euro price needs no cents expression."}
  nl.a1.unit02.lesson05.teach.four_fifty: {title: "Four euros fifty", gloss: "€4.50 — four euros fifty", note: "The same spoken pattern works with other euro-and-cent prices."}
  nl.a1.unit02.lesson05.teach.costs: {title: "State a price", gloss: "That costs two euros fifty.", note: "Dat kost ... answers Hoeveel kost dit? directly."}

  nl.a1.unit02.lesson06.teach.opening: {title: "Omar registers", gloss: "Staff member: Good afternoon. Are you here for the language café? Omar: Yes, I'd like to register.", note: "The scene continues Omar's visits to the library language café from unit01."}
  nl.a1.unit02.lesson06.teach.phone_turn: {title: "Give the phone number", gloss: "Staff member: Great. What is your phone number? Omar: 06 21 43 65 87.", note: "Omar gives the number in the two-digit groups practised earlier."}
  nl.a1.unit02.lesson06.teach.house_turn: {title: "Give the house number", gloss: "Staff member: And what is your house number? Omar: Forty-eight.", note: "A short number-only answer is natural when the question supplies the context."}
  nl.a1.unit02.lesson06.teach.fee_turn: {title: "Understand the fee", gloss: "Staff member: The fee is two euros fifty. Omar: Okay.", note: "The spoken price follows the everyday euro-plus-cents pattern."}
  nl.a1.unit02.lesson06.teach.group_turn: {title: "Ask about the group size", gloss: "Omar: How many people are in the group? Staff member: Twelve.", note: "This scene reuses the Hoeveel mensen ... question pattern taught earlier in the unit."}
  nl.a1.unit02.lesson06.teach.room_turn: {title: "Find the room number", gloss: "Staff member: The language café is in room twenty-one.", note: "Zaal is a room or hall used for an activity."}
  nl.a1.unit02.lesson06.teach.lotte_turn: {title: "Find Lotte's table", gloss: "Lotte: Hi Omar! We're sitting at table seven.", note: "The dialogue ends by reconnecting Omar with Lotte in the same informal setting."}

