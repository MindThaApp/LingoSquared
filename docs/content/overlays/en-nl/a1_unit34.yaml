teaching:
  nl.a1.unit34.lesson01.teach.gebruiken: {title: "To use", gloss: "to use", example_gloss: ["I use my phone."]}
  nl.a1.unit34.lesson01.teach.telefoon_computer: {title: "Phone and computer", gloss: "the phone / the computer", example_gloss: ["Omar has a phone.", "Lotte uses a computer."]}
  nl.a1.unit34.lesson01.teach.internet: {title: "The internet", gloss: "the internet", example_gloss: "Do you have internet at home?"}
  nl.a1.unit34.lesson01.teach.heb_je_internet: {title: "Do you have internet at home?", gloss: "Do you have internet at home?"}
  nl.a1.unit34.lesson01.teach.ik_gebruik_elke_dag: {title: "I use my phone every day", gloss: "I use my phone every day.", note: "Reuses *elke dag* (every day), already established for routines."}

  nl.a1.unit34.lesson02.teach.app: {title: "The app", gloss: "the app", example_gloss: "I have an app for the weather forecast."}
  nl.a1.unit34.lesson02.teach.bericht: {title: "The message", gloss: "the message", example_gloss: "I'll send a message through the app."}
  nl.a1.unit34.lesson02.teach.compound_note: {title: "Weerbericht and bericht", gloss: "You already know *het weerbericht* (weer + bericht). *Bericht* means a message you can send (ik stuur, jij/hij stuurt) or read (ik lees, jij/hij leest).", note: "Ties the new word to the already-taught compound noun from the weather unit."}
  nl.a1.unit34.lesson02.teach.lotte_stuurt_bericht: {title: "Lotte sends a message through the app", gloss: "Lotte sends a message through the app.", note: "Reuses *sturen* (to send), already established from the communication unit's *Ik stuur je een sms.*"}
  nl.a1.unit34.lesson02.teach.omar_leest_bericht: {title: "Omar reads the message", gloss: "Omar reads the message."}

  nl.a1.unit34.lesson03.teach.opzoeken: {title: "To look up", gloss: "to look up", example_gloss: "I look up the weather forecast."}
  nl.a1.unit34.lesson03.teach.opzoeken_note: {title: "Opzoeken is separable", gloss: "Opzoeken is separable, just like *opstaan* and *uitlaten*: ik zoek het op, jij zoekt het op. But *gebruiken* is not separable: ik gebruik het.", note: "Directly contrasts with the routines unit's separable-verb set; gebruiken (with the ge- prefix) never splits."}
  nl.a1.unit34.lesson03.teach.sander_zoekt_op: {title: "Sander looks up the weather forecast", gloss: "Sander looks up the weather forecast."}
  nl.a1.unit34.lesson03.teach.dan_hardlopen: {title: "Then he goes running", gloss: "Then he goes running.", note: "Reuses *hardlopen*, already established in the sports unit."}

  nl.a1.unit34.lesson04.teach.lotte_zullen_we: {title: "Lotte proposes", gloss: "Lotte: Shall we exercise Saturday at ten?"}
  nl.a1.unit34.lesson04.teach.omar_goed_idee: {title: "Omar agrees", gloss: "Omar: Good idea! I'll look up the weather forecast.", note: "Reuses *Goed idee*, already established from the plans/preferences units."}
  nl.a1.unit34.lesson04.teach.omar_zonnig: {title: "Omar checks the weather", gloss: "Omar: It's sunny on Saturday!", note: "Reuses *zonnig*, already established from the weather unit."}
  nl.a1.unit34.lesson04.teach.sander_ziet_bericht: {title: "Sander sees the message", gloss: "Sander: I see the message. See you Saturday!"}
  nl.a1.unit34.lesson04.teach.tot_note: {title: "Tot ziens vs Tot + a day", gloss: "You already know *Tot ziens!* You can also name a day: *Tot zaterdag!*, *Tot morgen!*", note: "Extends the greetings unit's farewell pattern to a specific day."}

  nl.a1.unit34.lesson05.teach.tekst:
    title: "Who uses what?"
    gloss: "Lotte calls Omar every day. She uses her phone, not an app. Omar has no computer at home, but he uses internet on his phone. Sander looks up the weather forecast every morning. Then he goes running. Fenna often sends Lotte a message. Do you also use your phone every day?"
    note: "Compares all four characters' device habits, mirroring the sports unit's comparison-reading shape."
    glosses:
      belt: "calls"
      elke: "every"
      dag: "day"
      gebruikt: "uses"
      telefoon: "phone"
      app: "app"
      computer: "computer"
      thuis: "at home"
      internet: "internet"
      zoekt: "looks up"
      ochtend: "morning"
      weerbericht: "weather forecast"
      gaat: "goes"
      hardlopen: "running"
      stuurt: "sends"
      vaak: "often"
      bericht: "message"
      Gebruik: "use"
  nl.a1.unit34.lesson05.teach.sander_ochtend: {title: "Sander looks up the forecast every morning", gloss: "Sander looks up the weather forecast every morning."}
  nl.a1.unit34.lesson05.teach.fenna_stuurt_lotte: {title: "Fenna often messages Lotte", gloss: "Fenna often sends Lotte a message."}

  nl.a1.unit34.lesson06.teach.lotte_zullen_we_park: {title: "Lotte confirms the plan", gloss: "Lotte: I see the message. Shall we exercise Saturday at ten in the park?"}
  nl.a1.unit34.lesson06.teach.omar_zonnig_zaterdag: {title: "Omar confirms the weather", gloss: "Omar: Yes, and it's sunny on Saturday!"}
  nl.a1.unit34.lesson06.teach.sander_loop_voetbal: {title: "Sander's plan", gloss: "Sander: I'll run then. Afterward I'll also play football.", note: "Reuses *Daarna* (afterward), already established from the past-events unit."}
  nl.a1.unit34.lesson06.teach.fenna_zwem_liever: {title: "Fenna's plan", gloss: "Fenna: I'd rather swim, but I'm coming to the park too.", note: "Reuses *liever*, already established from the preferences and sports units."}
  nl.a1.unit34.lesson06.teach.lotte_leuk_tot_zaterdag: {title: "Lotte closes the conversation", gloss: "Lotte: Nice! See you Saturday in the park!", note: "Closes both this unit's messaging thread and the sports unit's plan in one line."}

