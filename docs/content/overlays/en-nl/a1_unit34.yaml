course:
  title: "Dutch A1"
  description: "Beginner Dutch for talking about technology: naming phones, computers, and the internet, sending and reading messages through an app, looking things up online, and using all of it to make a real plan with friends."

units:
  nl.a1.unit34.technologie: {title: "Technology: phone, app, and internet"}

