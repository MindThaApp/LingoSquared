    distractors: ["Could you write this report?", "Could you send this report?", "Could you review this email?"]
    accepted_answers: [{value: "Could you review this report?", status: correct}]
    feedback: "Zou u dit rapport kunnen nakijken? means could you review this report?"
  nl.b1.unit03.lesson01.exercise03.match_formal_request_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {ik: I, u: "you (formal)", zou: would, kunnen: "can / to be able to", "dit rapport": "this report", nakijken: "to check / review"}
        status: correct
    feedback: "These are this lesson's core formal-request words."
