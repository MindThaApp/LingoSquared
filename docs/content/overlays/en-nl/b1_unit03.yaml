review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    Overlay for nl's third B1 unit, authored alongside the realization.
    English speakers' real interference risk: English has no
    grammatical formal/informal "you" distinction at all (singular
    "you" covers both), so the *jij*/*je* vs. *u* choice has to be
    learned as a genuinely new category, not mapped onto an existing
    English contrast -- flagged explicitly in lesson01's note. A second
    risk: *zou willen voorstellen dat* nests two "would"-shaped ideas
    (would want to propose that...) where English usually just says "I
    would like to propose that," which can tempt a learner to drop
    *willen* entirely -- flagged in lesson02.
    Fresh-context review 2026-07-11: ga je gang -> ga uw gang to match
    the realization's register fix; email signer Sanne -> Jasper;
    added natural word-order variants for the jaarverslag translation.

course:
  title: Dutch B1
  description: >-
    Intermediate Dutch: communicating professionally in a workplace
    setting -- formal *u*-register requests and suggestions softened
    with the conditional, and standard meeting-structuring phrases.

units:
  nl.b1.unit03.werkoverleg:
    title: "Workplace Meetings"
    description: Communicate professionally in a workplace setting -- make a formal-register suggestion or request, participate in a short work-meeting exchange, and write a brief professional message.

lessons:
  nl.b1.unit03.lesson01.zou_u:
    title: "Could you..."
  nl.b1.unit03.lesson02.voorstellen:
    title: "I would like to propose..."
  nl.b1.unit03.lesson03.agenda_vragen:
    title: "Agenda and questions"
  nl.b1.unit03.lesson04.overleg_met_bakker:
    title: "A meeting with meneer Bakker"
  nl.b1.unit03.lesson05.email_lezen:
    title: "Reading an email"
  nl.b1.unit03.lesson06.wrapup_production:
    title: "Review"

teaching:
  nl.b1.unit03.lesson01.teach.ik:
    title: I
    gloss: I
    example_gloss: "I have a question for you."
  nl.b1.unit03.lesson01.teach.u:
    title: "you (formal)"
    gloss: "you (formal)"
    note: "English has no grammatical formal/informal distinction for 'you' at all, so this is a genuinely new category to learn, not a remapping of something English already marks. *U* is used for managers, clients, strangers, and anyone you'd address formally -- the workplace counterpart to the government-office *u* from unit24_gemeente, but softer in tone here."
    example_gloss: "Could you review this report?"
  nl.b1.unit03.lesson01.teach.zou:
    title: would
    gloss: would
    example_gloss: "Could you review this report?"
  nl.b1.unit03.lesson01.teach.kunnen:
    title: "can / to be able to"
    gloss: "can / to be able to"
    note: "*Me* here is the ordinary object pronoun 'me' -- register-neutral, used with both *je* and *u* addressees."
    example_gloss: "Could you help me?"
  nl.b1.unit03.lesson01.teach.dit_rapport:
    title: "this report"
    gloss: "this report"
    example_gloss: "Could you review this report?"
  nl.b1.unit03.lesson01.teach.nakijken:
    title: "to check / review"
    gloss: "to check / review"
    example_gloss: "Could you review this report?"
  nl.b1.unit03.lesson01.teach.grammar_zou_u:
    title: "Could you review this report? Could you help me?"
    gloss: "Could you review this report? Could you help me?"
    note: "*Zou u ... kunnen* + infinitive is the standard softened formal request -- more polite than a bare *kunt u*, the same softening *zou* already does in informal speech, just paired with *u* instead of *je*/*jij*."

  nl.b1.unit03.lesson02.teach.willen:
    title: "to want"
    gloss: "to want"
    note: "*Zou willen* nests two ideas English usually compresses into one ('would LIKE to propose,' not 'would WANT to want to propose') -- don't drop *willen*, both words are needed for the standard formal phrase."
    example_gloss: "I would like to propose that we start tomorrow."
  nl.b1.unit03.lesson02.teach.voorstellen:
    title: "to propose / suggest"
    gloss: "to propose / suggest"
    example_gloss: "I would like to propose that we start tomorrow."
  nl.b1.unit03.lesson02.teach.dat:
    title: that
    gloss: that
    example_gloss: "I would like to propose that we start tomorrow."
  nl.b1.unit03.lesson02.teach.we:
    title: we
    gloss: we
    example_gloss: "We start tomorrow."
  nl.b1.unit03.lesson02.teach.morgen:
    title: tomorrow
    gloss: tomorrow
    example_gloss: "We start tomorrow."
  nl.b1.unit03.lesson02.teach.de_vergadering:
    title: "the meeting"
    gloss: "the meeting"
    example_gloss: "The meeting starts tomorrow."
  nl.b1.unit03.lesson02.teach.beginnen:
    title: "to begin / start"
    gloss: "to begin / start"
    example_gloss: "We start tomorrow."
  nl.b1.unit03.lesson02.teach.grammar_voorstellen:
    title: "I would like to propose that we start tomorrow."
    gloss: "I would like to propose that we start tomorrow."
    note: "*Ik zou willen voorstellen dat...* is the standard formal way to make a suggestion in a Dutch meeting -- noticeably softer than a direct *we moeten morgen beginnen* ('we must start tomorrow')."

  nl.b1.unit03.lesson03.teach.de_agenda:
    title: "the agenda"
    gloss: "the agenda"
    example_gloss: "What is on the agenda?"
  nl.b1.unit03.lesson03.teach.als_eerste_punt:
    title: "as the first item"
    gloss: "as the first item"
    example_gloss: "As the first item, we discuss the report."
  nl.b1.unit03.lesson03.teach.bespreken:
    title: "to discuss"
    gloss: "to discuss"
    example_gloss: "As the first item, we discuss the report."
  nl.b1.unit03.lesson03.teach.het_rapport:
    title: "the report"
    gloss: "the report"
    example_gloss: "We discuss the report."
  nl.b1.unit03.lesson03.teach.nog:
    title: "still / yet"
    gloss: "still / yet"
    example_gloss: "Are there any more questions?"
  nl.b1.unit03.lesson03.teach.vragen:
    title: questions
    gloss: questions
    example_gloss: "Are there any more questions?"
  nl.b1.unit03.lesson03.teach.zijn_er:
    title: "are there"
    gloss: "are there"
    example_gloss: "Are there any more questions?"
  nl.b1.unit03.lesson03.teach.grammar_agenda:
    title: "As the first item, we discuss the report. Are there any more questions?"
    gloss: "As the first item, we discuss the report. Are there any more questions?"
    note: "*Als eerste punt* and *zijn er nog vragen?* are standard meeting-structuring phrases -- the Dutch equivalent of 'first on the agenda' and 'any more questions?' in an English meeting."

  nl.b1.unit03.lesson04.teach.vrijdag:
    title: Friday
    gloss: Friday
    example_gloss: "Could you finish the report by Friday?"
  nl.b1.unit03.lesson04.teach.afronden:
    title: "to finish / complete"
    gloss: "to finish / complete"
    example_gloss: "Could you finish this by Friday?"
  nl.b1.unit03.lesson04.teach.natuurlijk:
    title: "of course"
    gloss: "of course"
    example_gloss: "Of course I'll help you."
  nl.b1.unit03.lesson04.teach.de_cijfers:
    title: "the figures / numbers"
    gloss: "the figures / numbers"
    example_gloss: "Could I get the figures?"
  nl.b1.unit03.lesson04.teach.krijgen:
    title: "to get / receive"
    gloss: "to get / receive"
    example_gloss: "Could I get the figures?"
  nl.b1.unit03.lesson04.teach.dialogue_bakker_open:
    title: "Meneer Bakker: Lotte, could you finish the report by Friday?"
    gloss: "Meneer Bakker: Lotte, could you finish the report by Friday?"
  nl.b1.unit03.lesson04.teach.dialogue_lotte_lukken:
    title: "Lotte: Yes, that should work out. I still have a few questions."
    gloss: "Lotte: Yes, that should work out. I still have a few questions."
  nl.b1.unit03.lesson04.teach.dialogue_bakker_gang:
    title: "Meneer Bakker: Of course, go ahead."
    gloss: "Meneer Bakker: Of course, go ahead."
  nl.b1.unit03.lesson04.teach.dialogue_lotte_cijfers:
    title: "Lotte: Could I get last month's figures?"
    gloss: "Lotte: Could I get last month's figures?"
  nl.b1.unit03.lesson04.teach.dialogue_bakker_stuur:
    title: "Meneer Bakker: I'll send those to you today."
    gloss: "Meneer Bakker: I'll send those to you today."

  nl.b1.unit03.lesson05.teach.het_jaarverslag:
    title: "the annual report"
    gloss: "the annual report"
    example_gloss: "We discuss the annual report."
  nl.b1.unit03.lesson05.teach.donderdag:
    title: Thursday
    gloss: Thursday
    example_gloss: "I would gladly receive it by Thursday."
  nl.b1.unit03.lesson05.teach.email:
    title: "Reading: A meeting email"
    gloss: "Dear colleagues, As the first item we discuss the annual report next week. I would gladly receive your comments by Thursday. I hope this works out. Kind regards, Jasper"

  nl.b1.unit03.lesson06.teach.mogelijk:
    title: possible
    gloss: possible
    example_gloss: "Is it possible to finish this tomorrow?"
  nl.b1.unit03.lesson06.teach.grammar_review:
    title: "Could you review this report? I would like to propose that we start tomorrow. Is it possible?"
    gloss: "Could you review this report? I would like to propose that we start tomorrow. Is it possible?"
    note: "This unit's family of professional softening phrases: *zou u ... kunnen* (a request), *zou willen voorstellen dat* (a suggestion), and *is het mogelijk* (a general polite check) -- all built on the same *zou*-softening pattern used informally elsewhere, just paired with *u* and workplace vocabulary."

