zaterdag naar de markt gegaan, daarna heb ik gekookt, ik heb niet gesport.", "status": "correct"}, {"value": "Ik ben zaterdag naar de markt gegaan, daarna heb ik gekookt, ik heb niet gesport", "status": "correct"}], "feedback": "*Zaterdag ben ik naar de markt gegaan. Daarna heb ik gekookt. Ik heb niet gesport.* = On Saturday I went to the market. After that I cooked. I didn't exercise."}
