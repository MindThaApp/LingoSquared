  nl.a2.unit78.lesson01.exercise07.translate_sunday_uncle: {"instruction": "Translate into Dutch: 'On Sunday I went to my uncle's.' Use the perfectum (heb/ben + participle). Use naar.", "accepted_answers": [{"value": "Zondag ben ik naar mijn oom gegaan.", "status": "correct"}, {"value": "Zondag ben ik naar mijn oom gegaan", "status": "correct"}, {"value": "Ik ben zondag naar mijn oom gegaan.", "status": "correct"}, {"value": "Ik ben zondag naar mijn oom gegaan", "status": "correct"}], "feedback": "*Zondag ben ik naar mijn oom gegaan* = On Sunday I went to my uncle's. *Ik ben zondag naar mijn oom gegaan* is also correct."}
  nl.a2.unit78.lesson02.exercise01.choose_participle_fietsen: {"instruction": "Which is the correct participle of *fietsen* (to cycle)?", "correct_option": "gefietst", "distractors": ["gefietsd", "gefietsen", "gefiets"], "accepted_answers": [{"value": "gefietst", "status": "correct"}], "feedback": "*fiets* ends in *s*, which is one of the *'t kofschip* letters, so the participle is *gefietst*."}
