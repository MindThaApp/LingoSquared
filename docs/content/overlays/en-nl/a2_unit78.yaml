  nl.a2.unit78.lesson06.exercise04.comprehend_not_done: {"instruction": "Which of these things did Omar NOT do this weekend?", "correct_option": "Exercise", "distractors": ["Sleep for a long time", "Eat at his uncle's", "Stay at home"], "accepted_answers": [{"value": "Exercise", "status": "correct"}], "feedback": "*Ik heb niet gesport* = I didn't exercise."}
  nl.a2.unit78.lesson06.exercise05.order_no_shopping: {"instruction": "Put the words in order to say 'I didn't do any shopping.'", "correct_option": "Ik heb geen boodschappen gedaan", "accepted_answers": [{"value": "Ik heb geen boodschappen gedaan", "status": "correct"}], "feedback": "*Ik heb geen boodschappen gedaan* = I didn't do any shopping."}
  nl.a2.unit78.lesson06.exercise06.respond_saturday_uncle: {"instruction": "Answer in Dutch: say that on Saturday you went to your uncle's. Use the perfectum (heb/ben + participle). Use naar.", "accepted_answers": [{"value": "Zaterdag ben ik naar mijn oom gegaan.", "status": "correct"}, {"value": "Zaterdag ben ik naar mijn oom gegaan", "status": "correct"}, {"value": "Ik ben zaterdag naar mijn oom gegaan.", "status": "correct"}, {"value": "Ik ben zaterdag naar mijn oom gegaan", "status": "correct"}], "feedback": "*Zaterdag ben ik naar mijn oom gegaan* = On Saturday I went to my uncle's.", "correct_option": "Zaterdag ben ik naar mijn oom gegaan."}
  nl.a2.unit78.lesson06.exercise07.respond_no_sport: {"instruction": "Answer in Dutch: say no, you didn't exercise. Use the perfectum (heb/ben + participle).", "accepted_answers": [{"value": "Nee, ik heb niet gesport.", "status": "correct"}, {"value": "Nee, ik heb niet gesport", "status": "correct"}, {"value": "Nee ik heb niet gesport", "status": "correct"}], "feedback": "*Nee, ik heb niet gesport* = No, I didn't exercise.", "correct_option": "Nee, ik heb niet gesport."}
