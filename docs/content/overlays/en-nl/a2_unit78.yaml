  nl.a2.unit78.lesson03.exercise06.complete_read_book: {"instruction": "Complete the sentence with the participle of *lezen*.", "correct_option": "gelezen", "accepted_answers": [{"value": "gelezen", "status": "correct"}], "feedback": "*Zaterdag heb ik een boek gelezen* = On Saturday I read a book. *Lezen* is irregular: *gelezen*."}
  nl.a2.unit78.lesson03.exercise07.translate_sunday_home: {"instruction": "Translate into Dutch: 'On Sunday I stayed at home.' Use the perfectum (heb/ben + participle).", "accepted_answers": [{"value": "Zondag ben ik thuisgebleven.", "status": "correct"}, {"value": "Zondag ben ik thuisgebleven", "status": "correct"}, {"value": "Ik ben zondag thuisgebleven.", "status": "correct"}, {"value": "Ik ben zondag thuisgebleven", "status": "correct"}, {"value": "Zondag ben ik thuis gebleven.", "status": "correct"}, {"value": "Zondag ben ik thuis gebleven", "status": "correct"}, {"value": "Ik ben zondag thuis gebleven.", "status": "correct"}, {"value": "Ik ben zondag thuis gebleven", "status": "correct"}], "feedback": "*Zondag ben ik thuisgebleven* = On Sunday I stayed at home. *Ik ben zondag thuisgebleven* is also correct."}
  nl.a2.unit78.lesson04.exercise01.choose_didnt_exercise: {"instruction": "Choose the Dutch sentence meaning 'I didn't exercise.'", "correct_option": "Ik heb niet gesport.", "distractors": ["Ik heb geen gesport.", "Ik ben niet gesport.", "Ik niet heb gesport."], "accepted_answers": [{"value": "Ik heb niet gesport.", "status": "correct"}], "feedback": "*Ik heb niet gesport* = I didn't exercise. *Niet* goes in front of the participle, and *sporten* uses *hebben*."}
  nl.a2.unit78.lesson04.exercise02.listen_no_film: {"instruction": "Listen and select what you hear.", "correct_option": "Ik heb geen film gezien.", "distractors": ["Ik heb een film gezien.", "Ik heb geen boek gelezen.", "Ik heb de film niet gezien."], "accepted_answers": [{"value": "Ik heb geen film gezien.", "status": "correct"}], "feedback": "*Ik heb geen film gezien* = I didn't see a film."}
  nl.a2.unit78.lesson04.exercise03.match_negated: {"instruction": "Match each Dutch sentence to its meaning.", "accepted_answers": [{"value": [{"left": "Ik heb niet gewerkt.", "right": "I didn't work."}, {"left": "Ik heb geen koffie gedronken.", "right": "I didn't drink any coffee."}, {"left": "Ik heb het boek niet gelezen.", "right": "I didn't read the book."}, {"left": "Ik ben niet naar mijn oom gegaan.", "right": "I didn't go to my uncle's."}, {"left": "Ik heb geen tijd gehad.", "right": "I didn't have time."}, {"left": "Ik heb niet gesport.", "right": "I didn't exercise."}], "status": "correct"}], "feedback": "Match each item to its meaning."}
  nl.a2.unit78.lesson04.exercise04.order_first_then: {"instruction": "Put the words in order to say 'First I went to the market, then I cooked.' Start with Eerst.", "correct_option": "Eerst ben ik naar de markt gegaan daarna heb ik gekookt", "accepted_answers": [{"value": "Eerst ben ik naar de markt gegaan daarna heb ik gekookt", "status": "correct"}], "feedback": "*Eerst ben ik naar de markt gegaan, daarna heb ik gekookt* = First I went to the market, then I cooked."}
  nl.a2.unit78.lesson04.exercise05.complete_geen_koffie: {"instruction": "Fill in *niet* or *geen*.", "correct_option": "geen", "accepted_answers": [{"value": "geen", "status": "correct"}], "feedback": "*Ik heb geen koffie gedronken* = I didn't drink any coffee. *Koffie* has no article, so it takes *geen*."}
  nl.a2.unit78.lesson04.exercise06.translate_didnt_go: {"instruction": "Translate into Dutch: 'On Sunday I didn't go to my uncle's.' Use the perfectum (heb/ben + participle). Use naar.", "accepted_answers": [{"value": "Zondag ben ik niet naar mijn oom gegaan.", "status": "correct"}, {"value": "Zondag ben ik niet naar mijn oom gegaan", "status": "correct"}, {"value": "Ik ben zondag niet naar mijn oom gegaan.", "status": "correct"}, {"value": "Ik ben zondag niet naar mijn oom gegaan", "status": "correct"}], "feedback": "*Zondag ben ik niet naar mijn oom gegaan* = On Sunday I didn't go to my uncle's. *Niet* goes before the place."}
  nl.a2.unit78.lesson04.exercise07.respond_didnt_work: {"instruction": "Answer in Dutch: say no, you didn't work. Use the perfectum (heb/ben + participle).", "accepted_answers": [{"value": "Nee, ik heb niet gewerkt.", "status": "correct"}, {"value": "Nee, ik heb niet gewerkt", "status": "correct"}, {"value": "Nee ik heb niet gewerkt", "status": "correct"}, {"value": "Nee, ik heb afgelopen weekend niet gewerkt.", "status": "correct"}, {"value": "Nee, ik heb afgelopen weekend niet gewerkt", "status": "correct"}, {"value": "Nee ik heb afgelopen weekend niet gewerkt", "status": "correct"}], "feedback": "*Nee, ik heb niet gewerkt* = No, I didn't work.", "correct_option": "Nee, ik heb niet gewerkt."}
  nl.a2.unit78.lesson05.exercise01.read_saturday_morning: {"instruction": "Read Noor's message. Where did Noor go on Saturday morning?", "correct_option": "To the market", "distractors": ["To the park", "To the cinema", "To her uncle's"], "accepted_answers": [{"value": "To the market", "status": "correct"}], "feedback": "*Zaterdagochtend ben ik naar de markt gegaan* = On Saturday morning I went to the market."}
  nl.a2.unit78.lesson05.exercise02.read_not_done: {"instruction": "Which two things did Noor NOT do this weekend?", "correct_option": "Exercise and see a film", "distractors": ["Cook and read a book", "Walk in the park and go to the market", "Sleep in and stay at home"], "accepted_answers": [{"value": "Exercise and see a film", "status": "correct"}], "feedback": "*Ik heb niet gesport en ik heb geen film gezien* = I didn't exercise and I didn't see a film."}
  nl.a2.unit78.lesson05.exercise03.read_sunday: {"instruction": "What did Noor do on Sunday?", "correct_option": "She stayed at home, slept a long time and read a book", "distractors": ["She went to the market and bought bread", "She walked in the park and cooked", "She stayed at home and watched a film"], "accepted_answers": [{"value": "She stayed at home, slept a long time and read a book", "status": "correct"}], "feedback": "*Zondag ben ik thuisgebleven. Ik heb lang geslapen en een boek gelezen* = On Sunday I stayed at home. I slept for a long time and read a book."}
  nl.a2.unit78.lesson05.exercise04.listen_slept_read: {"instruction": "Listen and select what you hear.", "correct_option": "Ik heb lang geslapen en een boek gelezen.", "distractors": ["Ik heb lang geslapen en een film gezien.", "Ik heb lang gewerkt en een boek gelezen.", "Ik heb niet geslapen en een boek gelezen."], "accepted_answers": [{"value": "Ik heb lang geslapen en een boek gelezen.", "status": "correct"}], "feedback": "*Ik heb lang geslapen en een boek gelezen* = I slept for a long time and read a book."}
  nl.a2.unit78.lesson05.exercise05.match_noor_weekend: {"instruction": "Match each time or phrase from Noor's message to what she did or did not do.", "accepted_answers": [{"value": [{"left": "zaterdagochtend", "right": "went to the market and bought bread"}, {"left": "'s middags", "right": "walked in the park"}, {"left": "'s avonds", "right": "cooked"}, {"left": "zondag", "right": "stayed at home, slept and read"}, {"left": "niet gesport", "right": "did not exercise"}, {"left": "geen film gezien", "right": "did not see a film"}], "status": "correct"}], "feedback": "Match each part of Noor's message to what happened."}
  nl.a2.unit78.lesson05.exercise06.dictation_market: {"instruction": "Type what you hear.", "correct_response": "Zaterdagochtend ben ik naar de markt gegaan", "orthography_strict": true, "feedback": "You heard *Zaterdagochtend ben ik naar de markt gegaan* — On Saturday morning I went to the market."}
  nl.a2.unit78.lesson05.exercise07.dictation_not_done: {"instruction": "Type what you hear.", "correct_response": "Ik heb niet gesport en ik heb geen film gezien", "orthography_strict": true, "feedback": "You heard *Ik heb niet gesport en ik heb geen film gezien* — I didn't exercise and I didn't see a film."}
  nl.a2.unit78.lesson06.exercise01.listen_question: {"instruction": "Listen and select what you hear.", "correct_option": "Hoi Omar! Wat heb je afgelopen weekend gedaan?", "distractors": ["Hoi Omar! Wat doe je afgelopen weekend?", "Hoi Omar! Wat heb je zaterdag gedaan?", "Hoi Omar! Wat heb je afgelopen weekend gegeten?"], "accepted_answers": [{"value": "Hoi Omar! Wat heb je afgelopen weekend gedaan?", "status": "correct"}], "feedback": "*Hoi Omar! Wat heb je afgelopen weekend gedaan?* = Hi Omar! What did you do last weekend?"}
  nl.a2.unit78.lesson06.exercise02.comprehend_saturday: {"instruction": "Listen to the dialogue. Where did Omar go on Saturday?", "correct_option": "To his uncle's in Amsterdam", "distractors": ["To the market", "To the cinema", "To the park"], "accepted_answers": [{"value": "To his uncle's in Amsterdam", "status": "correct"}], "feedback": "*Zaterdag ben ik naar mijn oom in Amsterdam gegaan* = On Saturday I went to my uncle's in Amsterdam."}
