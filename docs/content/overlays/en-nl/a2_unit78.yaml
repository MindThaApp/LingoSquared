teaching:
  nl.a2.unit78.lesson01.teach.weekend: {"title": "The weekend / last weekend", "gloss": "the weekend / last weekend (the one that just ended)", "note": "*Het weekend* is a neuter (het) noun. *Afgelopen weekend* means the weekend that has just passed, so it is the natural phrase for 'last weekend' when you tell a story about it.", "example_gloss": ["The weekend starts on Saturday.", "Last weekend I worked."]}
  nl.a2.unit78.lesson01.teach.zaterdag_zondag: {"title": "Saturday and Sunday", "gloss": "Saturday / Sunday", "note": "Day names are not capitalised in Dutch unless they start a sentence.", "example_gloss": ["On Saturday I'm free.", "On Sundays I sleep in."]}
  nl.a2.unit78.lesson01.teach.boodschappen: {"title": "Doing errands", "gloss": "to do the shopping / run errands", "note": "*Boodschappen doen* is the fixed phrase for grocery shopping and small errands. *Boodschappen* is plural and has no article.", "example_gloss": "Every Saturday I do the shopping."}
  nl.a2.unit78.lesson01.teach.op_bezoek: {"title": "Going to visit someone", "gloss": "to go and visit (someone)", "note": "*Op bezoek gaan* means to visit people at their home; you add *bij* + the person: *op bezoek bij mijn oom*.", "example_gloss": "I often go and visit my uncle."}
  nl.a2.unit78.lesson01.teach.uitjes: {"title": "Places to go at the weekend", "gloss": "the market / the park / the cinema", "note": "*De markt* and *de bioscoop* are de-words; *het park* is a het-word.", "example_gloss": ["I buy vegetables at the market.", "I like walking in the park.", "On Saturday I'm going to the cinema."]}
  nl.a2.unit78.lesson01.teach.werken_koken: {"title": "Four everyday verbs", "gloss": "to work / to cook / to eat / to drink", "note": "These are the infinitives. Later in this unit you will build their past forms.", "example_gloss": ["I have to work today.", "I can cook well.", "I'd like to eat.", "Would you like to drink coffee?"]}
  nl.a2.unit78.lesson01.teach.vraag: {"title": "Asking what someone did last weekend", "gloss": "What did you do last weekend?", "note": "This is the standard question. *Gedaan* is the participle of *doen*, and it sits at the very end."}
  nl.a2.unit78.lesson01.teach.gn_frame: {"title": "The perfectum: heb/ben + participle", "gloss": "On Saturday I did the shopping. On Sunday I went to my uncle's.", "note": "The *perfectum* is the everyday way to talk about what you did. It has two parts: a form of *hebben* or *zijn* in second place, and the *participle* (*gedaan*, *gegaan*) at the very end of the sentence. Anything else (a day, an object, a place) goes before or between them, but *heb/ben* always stays in second place (in a statement): *Zaterdag heb ik boodschappen gedaan.* Most verbs use *hebben*; *gaan* uses *zijn*. Lesson 3 explains when."}
  nl.a2.unit78.lesson02.teach.weekend_verbs: {"title": "Four weekend activities", "gloss": "to walk / to cycle / to play / to do sports", "note": "*Spelen* is used for games and sports with a ball, and for instruments: *voetbal spelen*. *Sporten* means doing sports in general.", "example_gloss": ["Shall we go for a walk?", "Tomorrow I'm going to cycle.", "The children want to play outside.", "I want to exercise more often."]}
  nl.a2.unit78.lesson02.teach.gn_regular: {"title": "Regular participles: ge- + stem + -t or -d", "gloss": "work → worked, cook → cooked, walk → walked, play → played, cycle → cycled", "note": "Regular verbs build the participle as *ge-* + the stem + *-t* or *-d*. The stem is the *ik*-form: *werk*, *kook*, *wandel*, *speel*, *fiets*. Which ending? Use the *'t kofschip* test on the last letter of the stem (a preview; the full rule comes later): if it is one of *t, k, f, s, ch, p*, add *-t* (*werk → gewerkt*, *kook → gekookt*, *fiets → gefietst*). For any other letter, add *-d* (*wandel → gewandeld*, *speel → gespeeld*). The test looks at the stem (the *ik*-form). One exception for later: if the infinitive has *v* or *z* (*leven, reizen*), use *-d*: *geleefd, gereisd*."}
  nl.a2.unit78.lesson02.teach.gn_stem_t: {"title": "When the stem already ends in -t", "gloss": "I exercise. I have exercised / I exercised.", "note": "If the stem already ends in *-t* (or *-d*), you add nothing more: *sport → gesport*, not *gesportt*. You still put *ge-* in front."}
  nl.a2.unit78.lesson02.teach.park_gewandeld: {"title": "Walking in the park", "gloss": "I walked in the park.", "note": "*Wandelen* takes *hebben* here because there is no destination, just walking around."}
  nl.a2.unit78.lesson02.teach.voetbal_gespeeld: {"title": "Playing football", "gloss": "I played football.", "note": "Sports are *gespeeld*: *voetbal spelen → ik heb voetbal gespeeld*."}
  nl.a2.unit78.lesson03.teach.hebben_zijn: {"title": "The two auxiliaries", "gloss": "to have / to be", "note": "In the perfectum, *hebben* and *zijn* are the helper verbs. Their forms: *ik heb, ik ben*; *het heeft, het is*.", "example_gloss": ["I'd like to have a bike too.", "It can be fun."]}
  nl.a2.unit78.lesson03.teach.gn_irregular: {"title": "Irregular participles: learn them as whole words", "gloss": "see → seen, read → read, sleep → slept, eat → eaten, drink → drunk, buy → bought, do → done", "note": "Irregular verbs do not follow the *-t/-d* rule. Most still start with *ge-*, and many end in *-en*: *gezien, gelezen, geslapen, gegeten, gedronken, gedaan*. A few, like *kopen → gekocht*, end in *-t* but change inside. Quick check: if a participle does not end in a regular *-t* or *-d* added to the stem, it is irregular, and you have to learn it as a whole word."}
  nl.a2.unit78.lesson03.teach.film_gezien: {"title": "Watching a film", "gloss": "I saw a film.", "note": "Dutch says *een film zien* (to see a film) for going to the cinema or watching at home."}
  nl.a2.unit78.lesson03.teach.lang_geslapen: {"title": "Two participles in one sentence", "gloss": "I slept for a long time and read a book.", "note": "With two actions and the same *heb*, you can leave the second *heb* out: *Ik heb lang geslapen en een boek gelezen.*"}
  nl.a2.unit78.lesson03.teach.bezocht: {"title": "A participle without ge-", "gloss": "I visited my uncle.", "note": "Verbs that start with an unstressed prefix like *be-*, *ver-* or *ont-* get no *ge-*: *bezoeken → bezocht* (to visit). This one is irregular too. *Ik heb mijn oom bezocht* and *Ik ben op bezoek geweest bij mijn oom* mean nearly the same."}
  nl.a2.unit78.lesson03.teach.gn_aux: {"title": "Hebben or zijn?", "gloss": "I saw a film. I went to my uncle's. I stayed at home. I was at my uncle's. It got late.", "note": "*Hebben* is the default helper: *Ik heb gewerkt, ik heb een film gezien*. Use *zijn* for two groups: (1) moving to a new place, such as *gaan* and *komen*, and (2) being or changing, such as *zijn, blijven, worden*. Quick test: is the verb itself about going or coming somewhere, staying (*blijven*), being (*zijn*) or becoming (*worden*)? Then *zijn*. Note that *het* takes *is*: *Het is laat geworden* (It got late). Movement without a destination takes *hebben*: *Ik heb in het park gewandeld*, but with a destination it takes *zijn*."}
  nl.a2.unit78.lesson03.teach.zijn_verbs: {"title": "Verbs of movement and change (with zijn)", "gloss": "go → gone, come → come, stay → stayed, become → become, be → been", "note": "These five verbs form their perfectum with *zijn*: *ik ben gegaan, ik ben gekomen, ik ben gebleven, het is geworden, ik ben geweest*. All five have irregular participles."}
  nl.a2.unit78.lesson04.teach.eerst_daarna: {"title": "First and then", "gloss": "first / after that", "note": "*Eerst* and *daarna* put actions in order. They are the connectors you need to tell a weekend story in sequence.", "example_gloss": ["First I work, then I go and exercise.", "First I eat, then I drink coffee."]}
  nl.a2.unit78.lesson04.teach.gn_order: {"title": "Telling it in order: eerst, daarna", "gloss": "First I went to the market, then I cooked.", "note": "After *eerst* or *daarna*, the helper verb comes straight after it, before *ik*: *Daarna heb ik gekookt*, not *Daarna ik heb gekookt*. The participle stays at the end of each part."}
  nl.a2.unit78.lesson04.teach.gn_niet: {"title": "Saying what you did not do: niet", "gloss": "I didn't work. I didn't read the book. I didn't go to my uncle's.", "note": "In the perfectum, *niet* goes in front of the participle: *Ik heb niet gewerkt*. If the sentence has a specific object (*het boek*), the object comes first and *niet* follows it: *Ik heb het boek niet gelezen*. Before a place or direction, *niet* goes in front of it: *Ik ben niet naar mijn oom gegaan*. A time word like *zaterdag* comes before *niet*: *Ik heb zaterdag niet gewerkt*. Never put *niet* after the participle."}
  nl.a2.unit78.lesson04.teach.gn_geen: {"title": "Saying you had none: geen", "gloss": "I didn't drink any coffee. I didn't have time.", "note": "Use *geen* in place of *een* or of no article in front of a noun: *een film → geen film*, *koffie → geen koffie*, *tijd → geen tijd*. Use *niet* for verbs, specific things (*het boek*) and places. *Gehad* is the participle of *hebben*."}
  nl.a2.unit78.lesson04.teach.lotte_gesport: {"title": "Lotte asks about exercise", "gloss": "Lotte: Did you exercise?", "note": "In a yes/no question the helper verb comes first: *Heb je gesport?*"}
  nl.a2.unit78.lesson04.teach.omar_niet_gesport: {"title": "Omar says no", "gloss": "Omar: No, I didn't exercise."}
  nl.a2.unit78.lesson05.teach.noor_bericht: {"title": "A message from Noor", "gloss": "Hi Lotte! It was a quiet weekend. On Saturday morning I went to the market and bought bread. In the afternoon I walked in the park. In the evening I cooked. I didn't exercise and I didn't see a film. On Sunday I stayed at home. I slept for a long time and read a book.", "note": "Noor is telling Lotte about her weekend in order: Saturday morning, afternoon and evening, then Sunday. Notice where the participle goes in every sentence: always at the end. *'s Middags* and *'s Avonds* mean 'in the afternoon' and 'in the evening'.", "glosses": {"hoi": "hi", "rustig": "quiet, calm", "weekend": "weekend", "geweest": "been (participle of zijn)", "zaterdagochtend": "Saturday morning", "markt": "market", "brood": "bread", "gekocht": "bought (participle of kopen)", "middags": "in the afternoon ('s middags)", "park": "park", "gewandeld": "walked (participle of wandelen)", "avonds": "in the evening ('s avonds)", "gekookt": "cooked (participle of koken)", "niet": "not", "gesport": "exercised (participle of sporten)", "geen": "no, not any", "film": "film", "gezien": "seen (participle of zien)", "zondag": "Sunday", "thuisgebleven": "stayed at home (participle of thuisblijven)", "lang": "long, for a long time", "geslapen": "slept (participle of slapen)", "boek": "book", "gelezen": "read (participle of lezen)"}}
  nl.a2.unit78.lesson06.teach.lotte_vraag: {"title": "Lotte asks Omar about his weekend", "gloss": "Lotte: Hi Omar! What did you do last weekend?"}
  nl.a2.unit78.lesson06.teach.omar_zaterdag: {"title": "Omar describes Saturday", "gloss": "Omar: On Saturday I went to my uncle's in Amsterdam. I ate at my uncle's.", "note": "*Bij mijn oom* means 'at my uncle's place'. *Naar mijn oom* is the direction, *bij mijn oom* is the location."}
  nl.a2.unit78.lesson06.teach.lotte_zondag: {"title": "Lotte asks about Sunday", "gloss": "Lotte: Nice! And Sunday?"}
  nl.a2.unit78.lesson06.teach.omar_zondag: {"title": "Omar describes Sunday and asks back", "gloss": "Omar: On Sunday I stayed at home. I slept for a long time and I didn't exercise. And you?"}
  nl.a2.unit78.lesson06.teach.lotte_antwoord: {"title": "Lotte describes her weekend", "gloss": "Lotte: I went to my parents'. I didn't do any shopping, but I cooked."}

