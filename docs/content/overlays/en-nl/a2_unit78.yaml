  nl.a2.unit78.lesson02.exercise04.order_football: {"instruction": "Put the words in order to say 'I played football.'", "correct_option": "Ik heb voetbal gespeeld", "accepted_answers": [{"value": "Ik heb voetbal gespeeld", "status": "correct"}], "feedback": "*Ik heb voetbal gespeeld* = I played football."}
  nl.a2.unit78.lesson02.exercise05.complete_cooked: {"instruction": "Complete the sentence with the participle of *koken*.", "correct_option": "gekookt", "orthography_strict": true, "accepted_answers": [{"value": "gekookt", "status": "correct"}], "feedback": "*Ik heb zaterdag gekookt* = I cooked on Saturday. *Kook* ends in *k*, so the ending is *-t*."}
  nl.a2.unit78.lesson02.exercise06.translate_saturday_worked: {"instruction": "Translate into Dutch: 'On Saturday I worked.' Use the perfectum (heb/ben + participle).", "accepted_answers": [{"value": "Zaterdag heb ik gewerkt.", "status": "correct"}, {"value": "Zaterdag heb ik gewerkt", "status": "correct"}, {"value": "Ik heb zaterdag gewerkt.", "status": "correct"}, {"value": "Ik heb zaterdag gewerkt", "status": "correct"}], "feedback": "*Zaterdag heb ik gewerkt* = On Saturday I worked. *Ik heb zaterdag gewerkt* is also correct."}
  nl.a2.unit78.lesson02.exercise07.dictation_park: {"instruction": "Type what you hear.", "correct_response": "Ik heb in het park gewandeld", "orthography_strict": true, "feedback": "You heard *Ik heb in het park gewandeld* — I walked in the park."}
  nl.a2.unit78.lesson03.exercise01.choose_irregular: {"instruction": "Which of these participles is irregular, not built with a regular *-t* or *-d*?", "correct_option": "gelezen", "distractors": ["gewerkt", "gekookt", "gespeeld"], "accepted_answers": [{"value": "gelezen", "status": "correct"}], "feedback": "*Gelezen* (from *lezen*) is irregular. *Gewerkt, gekookt* and *gespeeld* are regular: stem + *-t* or *-d*."}
  nl.a2.unit78.lesson03.exercise02.listen_stayed_home: {"instruction": "Listen and select what you hear.", "correct_option": "Ik ben thuisgebleven.", "distractors": ["Ik heb thuis gewerkt.", "Ik ben bij mijn oom geweest.", "Ik ben naar mijn oom gegaan."], "accepted_answers": [{"value": "Ik ben thuisgebleven.", "status": "correct"}], "feedback": "*Ik ben thuisgebleven* = I stayed at home."}
  nl.a2.unit78.lesson03.exercise03.match_hebben_zijn: {"instruction": "Match each verb and participle to the helper verb it uses in the perfectum.", "accepted_answers": [{"value": [{"left": "werken → gewerkt", "right": "hebben"}, {"left": "zien → gezien", "right": "hebben"}, {"left": "slapen → geslapen", "right": "hebben"}, {"left": "gaan → gegaan", "right": "zijn"}, {"left": "komen → gekomen", "right": "zijn"}, {"left": "blijven → gebleven", "right": "zijn"}, {"left": "zijn → geweest", "right": "zijn"}, {"left": "worden → geworden", "right": "zijn"}], "status": "correct"}], "feedback": "Most verbs use *hebben*. Verbs of going, coming, staying, being and becoming use *zijn*."}
