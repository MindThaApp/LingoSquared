course:
  title: "Dutch A1"
  description: "Beginner Dutch for handling basic money matters: asking a total price, choosing a payment method, splitting a bill, and handling change."

units:
  nl.a1.unit23.money: {title: "Money and paying"}

lessons:
  nl.a1.unit23.lesson01.hoeveel_kost_het: {title: "How much does it cost in total?"}
  nl.a1.unit23.lesson02.pinnen_of_contant: {title: "Card or cash?"}
  nl.a1.unit23.lesson03.de_rekening_delen: {title: "Splitting the bill"}
  nl.a1.unit23.lesson04.wisselgeld: {title: "Change"}
  nl.a1.unit23.lesson05.bonnetje_lezen: {title: "Reading a restaurant receipt"}
  nl.a1.unit23.lesson06.rekening_vragen: {title: "Lotte and Omar pay the bill"}

teaching:
  nl.a1.unit23.lesson01.teach.hoeveel_totaal: {title: "Asking the total price", gloss: "How much does it cost in total?", note: "In totaal (in total) clarifies you want the full combined price, not one item's price."}
  nl.a1.unit23.lesson01.teach.kost_vijfentwintig: {title: "Stating a total price", gloss: "It costs twenty-five euros in total.", note: "Kost is the third-person singular of kosten (to cost)."}

  nl.a1.unit23.lesson02.teach.pinnen: {title: "Paying by card", gloss: "to pay by card", note: "Pinnen is a distinctively Dutch verb for card payment, derived from the PIN code used to authorize it."}
  nl.a1.unit23.lesson02.teach.contant: {title: "Paying in cash", gloss: "to pay cash", note: "Contant (cash) precedes betalen (to pay) as an adverb describing how you pay."}
  nl.a1.unit23.lesson02.teach.kan_ik_pinnen: {title: "Asking if card payment is possible", gloss: "Can I pay by card here?", note: "Hier (here) situates the question at the current location."}
  nl.a1.unit23.lesson02.teach.wilt_u_betalen: {title: "Asking about payment preference", gloss: "Would you like to pay cash or by card?", note: "Wilt u ...? is the formal version of wil je ...?, used here by an unfamiliar cashier."}

  nl.a1.unit23.lesson03.teach.rekening: {title: "The bill", gloss: "the bill", note: "A common gender noun: de rekening."}
  nl.a1.unit23.lesson03.teach.rekening_delen: {title: "Suggesting to split the bill", gloss: "Shall we split the bill?", note: "Zullen we ...? reuses the plan-suggesting pattern from units 11 and 19."}
  nl.a1.unit23.lesson03.teach.apart_afrekenen: {title: "Asking to pay separately", gloss: "May I pay separately?", note: "Apart (separately) modifies afrekenen (to settle the bill), a near-synonym of betalen used specifically for finalizing a payment."}

  nl.a1.unit23.lesson04.teach.wisselgeld: {title: "The change", gloss: "the change", note: "A neuter noun: het wisselgeld, a compound of wisselen (to exchange) and geld (money)."}
  nl.a1.unit23.lesson04.teach.hier_wisselgeld: {title: "Handing over change", gloss: "Here's your change.", note: "Uw is the formal possessive 'your,' matching the formal register at a register or counter."}
  nl.a1.unit23.lesson04.teach.geen_wisselgeld_nodig: {title: "Declining change", gloss: "I don't need change.", note: "Nodig hebben (to need) reuses the pattern from unit14's rugzak nodig hebben."}

  nl.a1.unit23.lesson05.teach.bonnetje: {title: "Read a restaurant bill", gloss: "Bill: two main courses and two coffees. Total: thirty-five euros. Paid by card.", note: "Track what was ordered, the total, and how it was paid."}

  nl.a1.unit23.lesson06.teach.lotte_ask_bill: {title: "Lotte asks for the bill", gloss: "Lotte: Shall we ask for the bill?", note: "Vragen (to ask for) takes de rekening as its direct object."}
  nl.a1.unit23.lesson06.teach.omar_ask_total: {title: "Omar asks the total", gloss: "Omar: Yes, good idea. How much does it cost in total?", note: "Reuses the hoeveel kost het in totaal? question from lesson01."}
  nl.a1.unit23.lesson06.teach.lotte_state_total: {title: "Lotte states the total", gloss: "Lotte: It's thirty-five euros. Shall we split it?", note: "Delen (to split/share) here refers back to de rekening from context."}
  nl.a1.unit23.lesson06.teach.omar_offer_pay: {title: "Omar insists on paying", gloss: "Omar: No, let me pay today. You've helped me so much.", note: "Laat mij ... (let me ...) is the standard way to offer to do something; geholpen is the past participle of helpen (to help)."}
  nl.a1.unit23.lesson06.teach.lotte_thanks: {title: "Lotte is touched", gloss: "Lotte: That's sweet of you! Thank you.", note: "Lief van je (sweet/kind of you) is a warm, common compliment for a generous gesture."}
  nl.a1.unit23.lesson06.teach.omar_ask_card: {title: "Omar asks about paying by card", gloss: "Omar: Can I pay by card here?", note: "Reuses the kan ik hier pinnen? question from lesson02, now in the actual restaurant."}
  nl.a1.unit23.lesson06.teach.betaalt_form: {title: "Betaalt: the he/she-form", gloss: "Omar pays the bill.", note: "Betaalt is the third-person form of betalen (to pay)."}

exercises:
  nl.a1.unit23.lesson01.exercise01.choose_total_question:
    instruction: "Choose the Dutch sentence meaning 'How much does it cost in total?'"
    correct_option: "Hoeveel kost het in totaal?"
    distractors: ["Hoeveel kost het totaal?", "Hoe kost het in totaal?", "Hoeveel is het in totaal?"]
    accepted_answers: [{value: "Hoeveel kost het in totaal?", status: correct}]
    feedback: "In totaal clarifies you want the full combined price."
  nl.a1.unit23.lesson01.exercise02.listen_total_answer:
    instruction: "Listen and choose what the speaker says."
    correct_option: "It costs twenty-five euros in total."
    distractors: ["It costs fifteen euros in total.", "How much does it cost in total?", "It costs twenty-five euros each."]
    accepted_answers: [{value: "It costs twenty-five euros in total.", status: correct}]
    feedback: "Het kost vijfentwintig euro in totaal."
  nl.a1.unit23.lesson01.exercise03.match_total_words:
    instruction: "Match each Dutch phrase to its meaning."
    accepted_answers: [{value: [{left: "Hoeveel kost het?", right: "How much does it cost?"}, {left: "in totaal", right: "in total"}], status: correct}]
    feedback: "In totaal is added to ask about the combined price."
  nl.a1.unit23.lesson01.exercise04.order_total_question:
    instruction: "Put the words in order to ask how much something costs in total."
    correct_option: "Hoeveel kost het in totaal"
    accepted_answers: [{value: "Hoeveel kost het in totaal", status: correct}]
    feedback: "The complete question is Hoeveel kost het in totaal?"
  nl.a1.unit23.lesson01.exercise05.listen_order_total_answer:
    instruction: "Listen and put the words in the order you hear."
    correct_option: "Het kost vijfentwintig euro in totaal"
    accepted_answers: [{value: "Het kost vijfentwintig euro in totaal", status: correct}]
    feedback: "The complete sentence is Het kost vijfentwintig euro in totaal."
  nl.a1.unit23.lesson01.exercise06.complete_total_question:
    instruction: "Complete the question."
    accepted_answers: [{value: totaal, status: correct}]
    feedback: "Hoeveel kost het in totaal?"

  nl.a1.unit23.lesson02.exercise01.choose_can_i_pay_card:
    instruction: "Choose the Dutch sentence meaning 'Can I pay by card here?'"
    correct_option: "Kan ik hier pinnen?"
    distractors: ["Kan ik hier contant?", "Kan ik hier pin?", "Kan ik pinnen hier?"]
    accepted_answers: [{value: "Kan ik hier pinnen?", status: correct}]
    feedback: "Pinnen is the Dutch verb for card payment."
  nl.a1.unit23.lesson02.exercise02.listen_payment_choice:
    instruction: "Listen and choose what is asked."
    correct_option: "Would you like to pay cash or by card?"
    distractors: ["Can I pay by card here?", "How much does it cost in total?", "Here's your change."]
    accepted_answers: [{value: "Would you like to pay cash or by card?", status: correct}]
    feedback: "Wilt u contant betalen of pinnen?"
  nl.a1.unit23.lesson02.exercise03.match_payment_methods:
    instruction: "Match each Dutch word or phrase to its meaning."
    accepted_answers: [{value: [{left: pinnen, right: "pay by card"}, {left: "contant betalen", right: "pay cash"}], status: correct}]
    feedback: "Pinnen and contant betalen are the two payment methods in this lesson."
  nl.a1.unit23.lesson02.exercise04.order_can_i_pay_card:
    instruction: "Put the words in order to ask if you can pay by card here."
    correct_option: "Kan ik hier pinnen"
    accepted_answers: [{value: "Kan ik hier pinnen", status: correct}]
    feedback: "The complete question is Kan ik hier pinnen?"
  nl.a1.unit23.lesson02.exercise05.complete_payment_choice:
    instruction: "Complete the question."
    accepted_answers: [{value: pinnen, status: correct}]
    feedback: "Wilt u contant betalen of pinnen?"
  nl.a1.unit23.lesson02.exercise06.translate_can_i_pay_card:
    instruction: "Translate into Dutch."
    accepted_answers: [{value: "Kan ik hier pinnen?", status: correct}, {value: "Kan ik hier pinnen", status: correct}]
    feedback: "Kan ik hier pinnen?"

  nl.a1.unit23.lesson03.exercise01.choose_split_bill:
    instruction: "Choose the Dutch sentence meaning 'Shall we split the bill?'"
    correct_option: "Zullen we de rekening delen?"
    distractors: ["Zullen we de rekening betalen delen?", "Zullen wij de rekening deel?", "Zal we de rekening delen?"]
    accepted_answers: [{value: "Zullen we de rekening delen?", status: correct}]
    feedback: "Zullen we ...? is the standard way to suggest a shared plan."
  nl.a1.unit23.lesson03.exercise02.listen_split_bill:
    instruction: "Listen and choose what the speaker suggests."
    correct_option: "splitting the bill"
    distractors: ["paying separately", "paying by card", "asking for the bill"]
    accepted_answers: [{value: "splitting the bill", status: correct}]
    feedback: "Zullen we de rekening delen?"
  nl.a1.unit23.lesson03.exercise03.match_bill_words:
    instruction: "Match each Dutch phrase to its meaning."
    accepted_answers: [{value: [{left: "de rekening", right: "the bill"}, {left: "apart afrekenen", right: "to pay separately"}], status: correct}]
    feedback: "Rekening is the bill itself; afrekenen means to settle it."
  nl.a1.unit23.lesson03.exercise04.order_split_bill:
    instruction: "Put the words in order to suggest splitting the bill."
    correct_option: "Zullen we de rekening delen"
    accepted_answers: [{value: "Zullen we de rekening delen", status: correct}]
    feedback: "The complete question is Zullen we de rekening delen?"
  nl.a1.unit23.lesson03.exercise05.complete_pay_separately:
    instruction: "Complete the question."
    accepted_answers: [{value: apart, status: correct}]
    feedback: "Mag ik apart afrekenen?"
  nl.a1.unit23.lesson03.exercise06.write_pay_separately:
    instruction: "Write in Dutch: ask if you may pay separately."
    accepted_answers: [{value: "Mag ik apart afrekenen?", status: correct}, {value: "Mag ik apart afrekenen", status: correct}]
    feedback: "Mag ik apart afrekenen?"

  nl.a1.unit23.lesson04.exercise01.choose_change:
    instruction: "Choose the Dutch sentence meaning 'Here's your change.'"
    correct_option: "Hier is uw wisselgeld."
    distractors: ["Hier is je wisselgeld.", "Daar is uw wisselgeld.", "Hier is uw rekening."]
    accepted_answers: [{value: "Hier is uw wisselgeld.", status: correct}]
    feedback: "Uw is the formal possessive, matching a cashier's polite register."
  nl.a1.unit23.lesson04.exercise02.listen_change:
    instruction: "Listen and choose what the speaker says."
    correct_option: "Here's your change."
    distractors: ["Here's your bill.", "I don't need change.", "Can I pay by card here?"]
    accepted_answers: [{value: "Here's your change.", status: correct}]
    feedback: "Hier is uw wisselgeld."
  nl.a1.unit23.lesson04.exercise03.match_change_words:
    instruction: "Match each Dutch phrase to its meaning."
    accepted_answers: [{value: [{left: "het wisselgeld", right: "the change"}, {left: "geen wisselgeld nodig", right: "no change needed"}], status: correct}]
    feedback: "Wisselgeld is the money returned after a cash payment."
  nl.a1.unit23.lesson04.exercise04.order_no_change_needed:
    instruction: "Put the words in order to say you don't need change."
    correct_option: "Ik heb geen wisselgeld nodig"
    accepted_answers: [{value: "Ik heb geen wisselgeld nodig", status: correct}]
    feedback: "The complete sentence is Ik heb geen wisselgeld nodig."
  nl.a1.unit23.lesson04.exercise05.complete_change:
    instruction: "Complete the sentence."
    accepted_answers: [{value: wisselgeld, status: correct}]
    feedback: "Hier is uw wisselgeld."
  nl.a1.unit23.lesson04.exercise06.write_no_change_needed:
    instruction: "Write in Dutch: say you don't need change."
    accepted_answers: [{value: "Ik heb geen wisselgeld nodig.", status: correct}, {value: "Ik heb geen wisselgeld nodig", status: correct}]
    feedback: "Ik heb geen wisselgeld nodig."

  nl.a1.unit23.lesson05.exercise01.read_items:
    instruction: "Read the bill and choose what was ordered."
    correct_option: "two main courses and two coffees"
    distractors: ["two main courses and two teas", "one main course and two coffees", "two main courses only"]
    accepted_answers: [{value: "two main courses and two coffees", status: correct}]
    feedback: "Rekening: twee hoofdgerechten en twee koffies."
  nl.a1.unit23.lesson05.exercise02.read_total:
    instruction: "Read the bill and choose the total."
    correct_option: "thirty-five euros"
    distractors: ["twenty-five euros", "fifteen euros", "thirty euros"]
    accepted_answers: [{value: "thirty-five euros", status: correct}]
    feedback: "Totaal: vijfendertig euro."
  nl.a1.unit23.lesson05.exercise03.read_payment_method:
    instruction: "Read the bill and choose how it was paid."
    correct_option: "by card"
    distractors: ["in cash", "half cash, half card", "it doesn't say"]
    accepted_answers: [{value: "by card", status: correct}]
    feedback: "Betaald met pin."
  nl.a1.unit23.lesson05.exercise04.match_bill_fields:
    instruction: "Match each field on the bill to its value."
    accepted_answers: [{value: [{left: Totaal, right: "vijfendertig euro"}, {left: "Betaald met", right: pin}], status: correct}]
    feedback: "Totaal is the total; betaald met states the payment method."
  nl.a1.unit23.lesson05.exercise05.listen_bill:
    instruction: "Listen and choose how the bill was paid."
    correct_option: "by card"
    distractors: ["in cash", "half cash, half card", "it doesn't say"]
    accepted_answers: [{value: "by card", status: correct}]
    feedback: "Betaald met pin."
  nl.a1.unit23.lesson05.exercise06.write_bill_summary:
    instruction: "Write in Dutch: the bill is thirty-five euros, paid by card."
    accepted_answers: [{value: "De rekening is vijfendertig euro. Betaald met pin.", status: correct}, {value: "De rekening is vijfendertig euro Betaald met pin", status: correct}, {value: "De rekening is vijfendertig euro, en betaald met pin.", status: correct}, {value: "De rekening is vijfendertig euro, en betaald met pin", status: correct}]
    feedback: "De rekening is vijfendertig euro. Betaald met pin."

  nl.a1.unit23.lesson06.exercise01.listen_ask_bill:
    instruction: "Listen and choose what Lotte suggests."
    correct_option: "asking for the bill"
    distractors: ["splitting the bill", "paying by card", "leaving a tip"]
    accepted_answers: [{value: "asking for the bill", status: correct}]
    feedback: "Zullen we de rekening vragen?"
  nl.a1.unit23.lesson06.exercise02.comprehend_total:
    instruction: "Listen to the dialogue and choose the total bill."
    correct_option: "thirty-five euros"
    distractors: ["twenty-five euros", "fifteen euros", "forty-five euros"]
    accepted_answers: [{value: "thirty-five euros", status: correct}]
    feedback: "Lotte says: Het is vijfendertig euro."
  nl.a1.unit23.lesson06.exercise03.comprehend_who_pays:
    instruction: "Listen to the dialogue and choose who ends up paying, and why."
    correct_option: "Omar, because Lotte has helped him so much"
    distractors: ["Lotte, because it's her treat", "they split it as originally planned", "neither, they pay separately"]
    accepted_answers: [{value: "Omar, because Lotte has helped him so much", status: correct}]
    feedback: "Omar says: Nee, laat mij het vandaag betalen. Jij hebt mij zo geholpen."
  nl.a1.unit23.lesson06.exercise04.comprehend_payment_method:
    instruction: "Listen to the dialogue and choose how Omar asks to pay."
    correct_option: "by card"
    distractors: ["in cash", "he doesn't specify", "he asks to split it"]
    accepted_answers: [{value: "by card", status: correct}]
    feedback: "Omar asks: Kan ik hier pinnen?"
  nl.a1.unit23.lesson06.exercise05.order_ask_total:
    instruction: "Put the words in order to ask how much it costs in total."
    correct_option: "Hoeveel kost het in totaal"
    accepted_answers: [{value: "Hoeveel kost het in totaal", status: correct}]
    feedback: "The complete question is Hoeveel kost het in totaal?"
  nl.a1.unit23.lesson06.exercise06.respond_offer_pay:
    instruction: "Answer in Dutch: say no, let me pay today."
    accepted_answers: [{value: "Nee, laat mij het vandaag betalen.", status: correct}, {value: "Nee laat mij het vandaag betalen", status: correct}]
    feedback: "Nee, laat mij het vandaag betalen."
  nl.a1.unit23.lesson06.exercise07.listen_type_thanks:
    instruction: "Listen and type the complete Dutch sentences."
    accepted_answers: [{value: "Dat is lief van je! Dank je wel.", status: correct}, {value: "Dat is lief van je Dank je wel", status: correct}, {value: "Dat is lief van je, dank je wel.", status: correct}, {value: "Dat is lief van je, dank je wel", status: correct}]
    feedback: "Dat is lief van je! Dank je wel."
  nl.a1.unit23.lesson06.exercise08.write_dinner_summary:
    instruction: "Write two Dutch sentences: Omar pays the bill, and it is thirty-five euros."
    accepted_answers: [{value: "Omar betaalt de rekening. Het is vijfendertig euro.", status: correct}, {value: "Omar betaalt de rekening Het is vijfendertig euro", status: correct}, {value: "Omar betaalt de rekening, en het is vijfendertig euro.", status: correct}, {value: "Omar betaalt de rekening, en het is vijfendertig euro", status: correct}]
    feedback: "Omar betaalt de rekening. Het is vijfendertig euro."
