course:
  title: "Dutch A2"
  description: "Intermediate Dutch continuing the Lotte and Omar storyline: everyday bureaucracy, opinions, banking, health, and now household maintenance."

units:
  nl.a2.unit28.probleem_melden:
    title: "Reporting a Problem"

lessons:
  nl.a2.unit28.lesson01.er_is_een_probleem:
    title: "There's a Problem"
  nl.a2.unit28.lesson02.de_verwarming_werkt_niet:
    title: "The Heating Isn't Working"
  nl.a2.unit28.lesson03.wanneer_komt_de_monteur:
    title: "When Will the Technician Come?"
  nl.a2.unit28.lesson04.een_melding_doen:
    title: "Making a Report"
  nl.a2.unit28.lesson05.bevestiging_lezen:
    title: "Reading a Confirmation"
  nl.a2.unit28.lesson06.verwarming_melden:
    title: "Omar Reports the Heating"

teaching:
  nl.a2.unit28.lesson01.teach.probleem:
    title: "The problem"
    gloss: "the problem"
    note: "*Het probleem* is a neuter (het) noun."
    example_gloss: "There's a problem in my apartment."
  nl.a2.unit28.lesson01.teach.probleem_appartement:
    title: "Stating there's a problem"
    gloss: "There's a problem in my apartment."
    note: "*Er is* is the standard way to say 'there is' in Dutch."
  nl.a2.unit28.lesson01.teach.wat_is_probleem:
    title: "Asking what the problem is"
    gloss: "What exactly is the problem?"
    note: "*Precies* (exactly) often comes at the end of a formal clarifying question."

  nl.a2.unit28.lesson02.teach.verwarming:
    title: "The heating"
    gloss: "the heating"
    note: "*De verwarming* is a common (de) noun."
    example_gloss: "The heating isn't working."
  nl.a2.unit28.lesson02.teach.verwarming_werkt_niet:
    title: "Reporting the heating is broken"
    gloss: "The heating isn't working."
    note: "*Werkt niet* (isn't working) is used for appliances and systems, same pattern as English."
  nl.a2.unit28.lesson02.teach.erg_koud:
    title: "Describing the resulting cold"
    gloss: "It's very cold in my apartment."
    note: "*Erg* here means 'very', reinforcing the weather vocabulary from earlier units."

  nl.a2.unit28.lesson03.teach.monteur:
    title: "The technician"
    gloss: "the technician/repairman"
    note: "*De monteur* is a common (de) noun."
    example_gloss: "The technician will come by tomorrow morning."
  nl.a2.unit28.lesson03.teach.wanneer_monteur:
    title: "Asking when the technician will come"
    gloss: "When will the technician come by?"
    note: "*Langskomen* (to come by/stop by) is a separable verb; *langs* moves to the end of the clause."
  nl.a2.unit28.lesson03.teach.monteur_morgenochtend:
    title: "Confirming the technician's arrival"
    gloss: "The technician will come by tomorrow morning."
    note: "*Morgenochtend* combines *morgen* (tomorrow) and *ochtend* (morning)."

  nl.a2.unit28.lesson04.teach.melding:
    title: "The report"
    gloss: "the report/notification"
    note: "*De melding* is the standard word for a formal report, e.g. to a company or authority."
    example_gloss: "I would like to report an issue about the heating."
  nl.a2.unit28.lesson04.teach.melding_doen:
    title: "Filing a report about the heating"
    gloss: "I would like to report an issue about the heating."
    note: "*Een melding doen* (literally 'to do a report') is the set phrase for filing a report."
  nl.a2.unit28.lesson04.teach.contact_24_uur:
    title: "The corporation's response commitment"
    gloss: "We will contact you within twenty-four hours."
    note: "*Opnemen* (in the set phrase *contact opnemen met*, to get in touch with) is a separable verb; *op* moves to the end."

  nl.a2.unit28.lesson05.teach.bevestiging:
    title: "Reading a confirmation notice"
    gloss: >-
      Confirmation: your report about the heating has been received. A
      technician will come by tomorrow morning between nine and eleven
      o'clock. Not home? Then call the housing corporation.
    note: "*De woningcorporatie* is the housing corporation that manages rented apartments in the Netherlands."

  nl.a2.unit28.lesson06.teach.medewerker_open:
    title: "Employee opens the call"
    gloss: "Employee: Housing corporation, good afternoon."
  nl.a2.unit28.lesson06.teach.omar_report:
    title: "Omar reports the problem"
    gloss: "Omar: Good afternoon, I would like to report an issue. The heating in my apartment isn't working."
  nl.a2.unit28.lesson06.teach.medewerker_ask_since_when:
    title: "Employee asks since when"
    gloss: "Employee: That's annoying. Since when have you had this problem?"
  nl.a2.unit28.lesson06.teach.omar_since_last_night:
    title: "Omar answers since when"
    gloss: "Omar: Since last night. It's very cold in my apartment."
  nl.a2.unit28.lesson06.teach.medewerker_send_technician:
    title: "Employee promises a technician"
    gloss: "Employee: I understand. We'll send a technician by tomorrow morning."
  nl.a2.unit28.lesson06.teach.omar_ask_time:
    title: "Omar asks what time"
    gloss: "Omar: What time will the technician come?"
  nl.a2.unit28.lesson06.teach.medewerker_time_window:
    title: "Employee gives the time window"
    gloss: "Employee: Between nine and eleven o'clock. Will you be home then?"
  nl.a2.unit28.lesson06.teach.omar_confirm_home:
    title: "Omar confirms he'll be home"
    gloss: "Omar: Yes, I'll be home tomorrow morning. Thank you."
  nl.a2.unit28.lesson06.teach.grammar_gedaan:
    title: "Summarizing what Omar did (present perfect)"
    gloss: "Omar made a report."
    note: "*Heeft ... gedaan* is the present perfect of *doen* (to do), used here to summarize a completed action."

exercises:
  nl.a2.unit28.lesson01.exercise01.choose_state_problem:
    instruction: "Choose the Dutch sentence meaning 'There's a problem in my apartment.'"
    correct_option: "Er is een probleem in mijn appartement."
    distractors: ["Er is geen probleem in mijn appartement.", "Er is een probleem in de straat.", "Er is een probleem met de monteur."]
    accepted_answers: [{value: "Er is een probleem in mijn appartement.", status: correct}]
    feedback: "*Er is een probleem in mijn appartement* = There's a problem in my apartment."
  nl.a2.unit28.lesson01.exercise02.listen_state_problem:
    instruction: "Listen and select what you hear."
    correct_option: "Er is een probleem in mijn appartement."
    distractors: ["Er is een probleem in het gebouw.", "Er is geen probleem meer.", "Er is een probleem met de verwarming."]
    accepted_answers: [{value: "Er is een probleem in mijn appartement.", status: correct}]
    feedback: "*Er is een probleem in mijn appartement* = There's a problem in my apartment."
  nl.a2.unit28.lesson01.exercise03.match_problem_words:
    instruction: "Match each Dutch word or phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "het probleem", right: "the problem"}
          - {left: "mijn appartement", right: "my apartment"}
          - {left: "Wat is het probleem precies?", right: "What exactly is the problem?"}
        status: correct
    feedback: "Match each phrase to its translation."
