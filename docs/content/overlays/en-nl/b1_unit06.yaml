  nl.b1.unit06.lesson02.teach.moeten:
    title: "must / should have (infinitive)"
    gloss: "must / should have (infinitive)"
    note: "This is the bare infinitive *moeten*, not a conjugated form -- when a modal verb like *moeten* governs another infinitive inside a perfect-tense construction, Dutch uses the modal's OWN infinitive instead of its past participle (*moeten*, never *gemoeten*, here). This is why *had ... moeten opruimen* -- not *had gemoeten opruimen* -- expresses 'should have tidied up.'"
    example_gloss: "I should have tidied the room earlier."
  nl.b1.unit06.lesson02.teach.opruimen:
