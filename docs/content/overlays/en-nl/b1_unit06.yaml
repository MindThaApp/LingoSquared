    gloss: "to tidy up"
    example_gloss: "I should have tidied the room earlier."
  nl.b1.unit06.lesson02.teach.grammar_had_moeten:
    title: "I should have tidied the room earlier."
    gloss: "I should have tidied the room earlier."
    note: "*Had* + [object/adverbials] + *moeten* + [bare infinitive at the very end] expresses regret about a past obligation that was never fulfilled -- Dutch's closest match to 'should have done X (but didn't).' Compare lesson01's plain *moet* (present necessity, still time to act) with this past-regret construction (the moment has passed)."

