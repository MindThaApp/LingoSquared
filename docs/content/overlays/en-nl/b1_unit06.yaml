  nl.b1.unit06.lesson03.teach.grammar_hoeven:
    title: "I don't need to cook tonight. You don't need to buy a present."
    gloss: "I don't need to cook tonight. You don't need to buy a present."
    note: "To negate necessity ('don't need to'), Dutch does NOT just add *niet* to *moeten* -- it switches to a different verb entirely: *hoeven (niet/geen) te* + infinitive. *Moet niet* is a real but much rarer, starker construction (closer to 'must not' in a strong warning sense) -- *hoeven* is the ordinary, everyday way to say 'don't need to.'"

