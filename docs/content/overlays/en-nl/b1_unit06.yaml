  notes: >-
    Overlay for nl's sixth B1 unit, authored alongside the realization, no
    sibling-direction file (nl-en) consulted. English speakers' real
    advantage and real risk are both narrower than they first look: English
    "must"/"have to" maps reasonably onto *moeten* (lesson01), but English
    collapses "don't need to" and "must not" into forms that don't
    obviously warn a learner they need two totally different Dutch verbs
    -- *hoeven niet* (needn't, lesson03) vs *mogen niet* (mustn't,
    lesson04) -- flagged explicitly in lesson04's grammar note as the
    single highest-risk interference point in this unit, since an English
    speaker's instinct is to just add "not" to whichever modal already
    means "must," which produces *moet niet* -- a real but different
    (and much rarer/starker) Dutch construction, not the intended meaning
    either negation is going for. Past regret (*had ... moeten* + bare
    infinitive, lesson02) has no direct English parallel in word order
    ("I should have tidied" vs Dutch's verb-final double-infinitive
    cluster) -- flagged there too. Fresh-context review 2026-07-11
    complete: instructions/distractors/accepted_answers verified
    against the realization; recognition distractors unambiguous,
    listen_select distractors are minimal pairs (no collision),
    matching_pairs keys aligned with the realization pairs, no
    snake_case/boolean/"reviewed" leaks. No objective bugs.

course:
  title: Dutch B1
  description: >-
    Intermediate Dutch: expressing necessity and obligation with *moeten*,
    past regret about an unfulfilled obligation with *had ... moeten*, and
    the crucial three-way negation contrast between *hoeven niet* (don't
    need to) and *mogen niet* (not allowed to / must not).

units:
  nl.b1.unit06.verplichtingen:
    title: "Obligations"
    description: Express present necessity, past regret about an unfulfilled obligation, and negate correctly for "don't need to" versus "not allowed to."

