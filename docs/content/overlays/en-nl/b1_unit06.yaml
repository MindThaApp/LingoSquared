  nl.b1.unit06.lesson01.teach.grammar_moet:
    title: "I must clean the house today."
    gloss: "I must clean the house today."
    note: "*Moet* + infinitive (pushed to the end: *schoonMAKEN*) is the basic pattern for present necessity or obligation -- *moeten* fully conjugates like any other Dutch verb (*moet*, *moeten*, *moest*), unlike languages that use a single invariant modal particle for this."

  nl.b1.unit06.lesson02.teach.had:
