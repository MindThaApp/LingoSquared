    gloss: "You are not allowed to smoke here. This is a smoke-free building."
    note: "*Mogen niet* + bare infinitive means 'not allowed to / must not' -- true PROHIBITION, a genuinely different meaning from lesson03's *hoeven niet* ('don't need to,' meaning it's simply optional). Confusing these two is a classic learner error: *je hoeft niet te roken* would mean 'you don't need to smoke' (odd, permissive), while *je mag niet roken* means 'you're not allowed to smoke' (a real rule). An English speaker's instinct to just negate whichever modal means 'must' doesn't work here -- the two negations use two different verbs."
