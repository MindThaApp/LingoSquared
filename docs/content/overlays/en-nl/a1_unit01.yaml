course:
  title: "Dutch A1"
  description: "Beginner Dutch for natural greetings, introductions, and first meetings in the Netherlands."

units:
  nl.a1.unit01.greetings_and_introductions: {title: "Greetings and first meetings"}

lessons:
  nl.a1.unit01.lesson01.jij_je_en_u: {title: "Informal jij/je and formal u"}
  nl.a1.unit01.lesson02.groeten_en_welzijn: {title: "Greetings and asking how someone is"}
  nl.a1.unit01.lesson03.namen: {title: "Exchanging names"}
  nl.a1.unit01.lesson04.herkomst_en_taal: {title: "Origin and language"}
  nl.a1.unit01.lesson05.taalcafe: {title: "Meeting someone at a language café"}
  nl.a1.unit01.lesson06.eerste_ontmoeting: {title: "Closing a first meeting"}

teaching:
  nl.a1.unit01.lesson01.teach.hallo_hoi: {title: "Hello and Hi", gloss: "hello / hi", note: "*Hallo* is neutral and works in both informal and formal encounters. *Hoi* is common and informal.", example_gloss: ["Hello, are you new here?", "Hi, I am Noor."]}
  nl.a1.unit01.lesson01.teach.jij_je_u: {title: "You: informal and formal forms", gloss: "you (stressed informal) / you (unstressed informal) / you (formal)", note: "*Jij* is informal singular and is used when the word is stressed or contrasted. *Je* is the usual unstressed informal singular form in everyday speech. *U* marks respectful distance. In the Netherlands it is natural with some older strangers and in explicitly formal relationships, but jij/je is common among adults in many shops and workplaces too.", example_gloss: ["Are you new here? (informal, stressed)", "You are new here. (informal, unstressed)", "Are you new here? (formal)"]}
  nl.a1.unit01.lesson01.teach.informal_new: {title: "Ask a peer if they are new", gloss: "Are you new here?", note: "In a question, *jij bent* becomes *ben jij*: the -t drops when *jij* follows the verb."}
  nl.a1.unit01.lesson01.teach.formal_new: {title: "Ask formally if someone is new", gloss: "Are you new here?", note: "With *u*, use *bent u*. The -t remains."}
  nl.a1.unit01.lesson01.teach.register_rule: {title: "Choosing the form of you", gloss: "jij/je: informal · u: formal or polite", note: "Use *jij/je* with friends, peers, children, and in many relaxed modern settings. Use *u* when the relationship calls for respect or distance; actual preferences vary, so follow the other person's lead."}

  nl.a1.unit01.lesson02.teach.goedemorgen_tot_goedenavond: {title: "Morning, afternoon, and evening greetings", gloss: "good morning / good afternoon / good evening", note: "*Goedemorgen* is used in the morning, usually until around noon. *Goedemiddag* is used from around noon through the afternoon. *Goedenavond* is an evening greeting.", example_gloss: ["Good morning! How are you?", "Good afternoon, how are you? (formal)", "Good evening! Are you new here?"]}
  nl.a1.unit01.lesson02.teach.hoe_gaat_het: {title: "How are things?", gloss: "How are you?", note: "*Hoe gaat het?* is a common neutral way to ask how someone is."}
  nl.a1.unit01.lesson02.teach.hoe_gaat_met_je: {title: "How are you? Informal", gloss: "How are you?", note: "*Met je* makes the person addressed explicit and informal."}
  nl.a1.unit01.lesson02.teach.hoe_gaat_met_u: {title: "How are you? Formal", gloss: "How are you?", note: "Use *met u* when the encounter calls for formal address."}
  nl.a1.unit01.lesson02.teach.goed_dank_je: {title: "Fine, thanks: informal", gloss: "Fine, thank you.", note: "*Dank je* matches informal address."}
  nl.a1.unit01.lesson02.teach.goed_dank_u: {title: "Fine, thanks: formal", gloss: "Fine, thank you.", note: "*Dank u* matches formal address."}
  nl.a1.unit01.lesson02.teach.prima: {title: "Great", gloss: "great / fine", note: "*Prima* is a short, positive answer.", example_gloss: "Great, thank you."}
  nl.a1.unit01.lesson02.teach.niet_slecht: {title: "Not bad", gloss: "not bad", note: "*Niet slecht* is usually a mildly positive answer."}
  nl.a1.unit01.lesson02.teach.en_met_jou: {title: "And you? Informal", gloss: "And you?", note: "*Jou* is the stressed informal form after *met*."}
  nl.a1.unit01.lesson02.teach.en_met_u: {title: "And you? Formal", gloss: "And you?", note: "*U* keeps the return question formal."}

  nl.a1.unit01.lesson03.teach.hoe_heet_je: {title: "Ask a name informally", gloss: "What is your name?", note: "*Hoe heet je?* is the normal informal name question."}
  nl.a1.unit01.lesson03.teach.hoe_heet_u: {title: "Ask a name formally", gloss: "What is your name?", note: "*Hoe heet u?* is polite; *Wat is uw naam?* is another, more administrative-sounding formal option not tested here."}
  nl.a1.unit01.lesson03.teach.ik_heet_noor: {title: "Give your name", gloss: "My name is Noor.", note: "*Ik heet ...* is a direct, standard way to give your name."}
  nl.a1.unit01.lesson03.teach.ik_ben_noor: {title: "Introduce yourself naturally", gloss: "I'm Noor.", note: "*Ik ben ...* is especially common in spoken introductions."}
  nl.a1.unit01.lesson03.teach.mijn_naam: {title: "My name is", gloss: "My name is Noor.", note: "*Mijn naam is ...* is correct but slightly more explicit than *Ik ben ...* or *Ik heet ...*."}
  nl.a1.unit01.lesson03.teach.leuk_ontmoeten: {title: "Nice to meet you", gloss: "Nice to meet you.", note: "This is friendly and natural in a first meeting."}
  nl.a1.unit01.lesson03.teach.aangenaam: {title: "Pleased to meet you", gloss: "pleased to meet you", note: "*Aangenaam* is conventional and more formal than *Leuk je te ontmoeten*.", example_gloss: "Pleased to meet you! I am Noor."}

  nl.a1.unit01.lesson04.teach.where_from_informal: {title: "Ask where someone is from", gloss: "Where are you from?", note: "*Kom je* is the informal question form."}
  nl.a1.unit01.lesson04.teach.where_from_formal: {title: "Ask formally where someone is from", gloss: "Where are you from?", note: "With *u*, the verb is *komt*: *Waar komt u vandaan?*"}
  nl.a1.unit01.lesson04.teach.from_netherlands: {title: "From the Netherlands", gloss: "I come from the Netherlands.", note: "Use *uit* before a country of origin."}
  nl.a1.unit01.lesson04.teach.from_belgium: {title: "From Belgium", gloss: "I come from Belgium.", note: "*België* has a diaeresis over the second e."}
  nl.a1.unit01.lesson04.teach.from_germany: {title: "From Germany", gloss: "I come from Germany.", note: "*Duitsland* is the country; *Duits* is the language."}
  nl.a1.unit01.lesson04.teach.dutch_nationality: {title: "Dutch nationality", gloss: "I am Dutch.", note: "*Nederlands* can describe nationality as well as the Dutch language."}
  nl.a1.unit01.lesson04.teach.belgian_nationality: {title: "Belgian nationality", gloss: "I am Belgian.", note: "*Belgisch* describes Belgian nationality here."}
  nl.a1.unit01.lesson04.teach.speak_dutch: {title: "Speak Dutch", gloss: "I speak Dutch.", note: "Language names are capitalized in Dutch."}
  nl.a1.unit01.lesson04.teach.speak_english: {title: "Speak English", gloss: "I speak English.", note: "*Engels* is the Dutch word for English."}
  nl.a1.unit01.lesson04.teach.speak_german: {title: "Speak German", gloss: "I speak German.", note: "*Duits* is the Dutch word for German."}

  nl.a1.unit01.lesson05.teach.taalcafe_bibliotheek: {title: "Language café and library", gloss: "the language café / the library", note: "A *taalcafé* is a low-pressure gathering for practising Dutch with other people. Dutch public libraries often host local activities, including language cafés.", example_gloss: ["I am here for the language café.", "I am learning Dutch in the library."]}
  nl.a1.unit01.lesson05.teach.location: {title: "The meeting place", gloss: "The language café is in the library.", note: "This establishes the setting for the scene."}
  nl.a1.unit01.lesson05.teach.here_for: {title: "Check the shared activity", gloss: "Are you here for the language café?", note: "This is a natural informal opener when two people arrive for the same activity."}
  nl.a1.unit01.lesson05.teach.yes_here_for: {title: "Confirm the activity", gloss: "Yes, I'm here for the language café.", note: "The answer repeats the activity clearly."}
  nl.a1.unit01.lesson05.teach.learning: {title: "Say what you are learning", gloss: "I'm learning Dutch.", note: "*Leer* is the first-person form of *leren*, to learn."}
  nl.a1.unit01.lesson05.teach.me_too: {title: "Me too", gloss: "Me too.", note: "*Ik ook* is a short natural way to state a shared fact."}
  nl.a1.unit01.lesson05.teach.first_time: {title: "Ask if it is someone's first time", gloss: "Is this your first time?", note: "This is friendly small talk at a recurring activity."}
  nl.a1.unit01.lesson05.teach.first_time_answer: {title: "Say it is your first time", gloss: "Yes, this is my first time.", note: "*Mijn* means my."}

  nl.a1.unit01.lesson06.teach.lotte_opening: {title: "Lotte opens the conversation", gloss: "Lotte: Hi, I'm Lotte. What's your name?", note: "Lotte uses informal *je* in this relaxed group setting."}
  nl.a1.unit01.lesson06.teach.omar_name: {title: "Omar gives his name", gloss: "Omar: I'm Omar. Nice to meet you.", note: "He answers the name question and acknowledges the meeting."}
  nl.a1.unit01.lesson06.teach.lotte_origin_question: {title: "Lotte asks about origin", gloss: "Lotte: You too! Where are you from?", note: "*Jou ook!* is a natural short reply to *Leuk je te ontmoeten*."}
  nl.a1.unit01.lesson06.teach.omar_origin: {title: "Omar gives his origin", gloss: "Omar: I'm from Egypt. And you?", note: "*En jij?* returns the same question informally."}
  nl.a1.unit01.lesson06.teach.lotte_context: {title: "Lotte continues the small talk", gloss: "Lotte: I'm from the Netherlands. Is this your first time at the language café?", note: "*Bij het taalcafé* means at the language café as an activity."}
  nl.a1.unit01.lesson06.teach.omar_language: {title: "Omar answers and states what he is learning", gloss: "Omar: Yes, this is my first time. I'm learning Dutch.", note: "He answers Lotte's question before adding one basic identity fact."}
  nl.a1.unit01.lesson06.teach.tot_ziens: {title: "Goodbye", gloss: "Goodbye!", note: "*Tot ziens* is a neutral farewell."}
  nl.a1.unit01.lesson06.teach.closing: {title: "A natural close", gloss: "Lotte: Nice! See you next week. Omar: See you next week!", note: "Repeating *Tot volgende week* is natural when both speakers expect to return."}

exercises:
  nl.a1.unit01.lesson01.exercise01.choose_informal:
    instruction: "Which option contains the two informal singular forms of 'you'?"
    correct_option: "jij / je"
    distractors: [u, "jij / u", "je / u"]
    accepted_answers: [{value: "jij / je", status: correct}]
    feedback: "Jij and je are informal singular; u is formal."
  nl.a1.unit01.lesson01.exercise02.choose_formal:
    instruction: "Choose the formal pronoun to complete the question."
    correct_option: u
    distractors: [jij, je, ik]
    accepted_answers: [{value: u, status: correct}]
    feedback: "Bent u nieuw hier? uses formal address."
  nl.a1.unit01.lesson01.exercise03.listen_formal:
    instruction: "Listen and choose the situation that fits the question."
    correct_option: "A formally addressed person is asked whether they are new here."
    distractors: ["A peer is asked whether they are new here.", "A formally addressed person is asked whether they live here.", "A formally addressed person is asked whether they are from here."]
    accepted_answers: [{value: "A formally addressed person is asked whether they are new here.", status: correct}]
    feedback: "Bent u nieuw hier? uses u and bent for formal address."
  nl.a1.unit01.lesson01.exercise04.match_register:
    instruction: "Match each Dutch form with its register."
    accepted_answers:
      - value: [{left: "jij / je", right: informeel}, {left: u, right: "formeel of beleefd"}]
        status: correct
    feedback: "Jij/je is informal; u is formal or polite."
  nl.a1.unit01.lesson01.exercise05.order_formal:
    instruction: "Put the words in order to ask formally, 'Are you new here?'"
    accepted_answers: [{value: [Bent, u, nieuw, hier], status: correct}]
    feedback: "The formal question is Bent u nieuw hier?"
  nl.a1.unit01.lesson01.exercise06.listen_order_informal:
    instruction: "Listen and put the informal question in order."
    accepted_answers: [{value: [Ben, jij, nieuw, hier], status: correct}]
    feedback: "The recording says Ben jij nieuw hier?"
  nl.a1.unit01.lesson01.exercise07.complete_formal:
    instruction: "Complete the formal question."
    accepted_answers:
      - {value: Bent, status: correct}
      - {value: bent, status: correct}
    feedback: "Use bent with u: Bent u nieuw hier?"
  nl.a1.unit01.lesson01.exercise08.listen_type_formal:
    instruction: "Listen and type the full Dutch question."
    accepted_answers:
      - {value: "Bent u nieuw hier?", status: correct}
      - {value: "Bent u nieuw hier", status: correct}
      - {value: "bent u nieuw hier?", status: correct}
      - {value: "bent u nieuw hier", status: correct}
    feedback: "The recording says Bent u nieuw hier?"

  nl.a1.unit01.lesson02.exercise01.choose_morning:
    instruction: "Choose the time-specific greeting that fits 08:30."
    correct_option: Goedemorgen
    distractors: [Goedemiddag, Goedenavond, Hoi]
    accepted_answers: [{value: Goedemorgen, status: correct}]
    feedback: "Goedemorgen is the time-of-day greeting for the morning."
  nl.a1.unit01.lesson02.exercise02.listen_evening:
    instruction: "Listen and choose the English meaning."
    correct_option: "Good evening"
    distractors: ["Good morning", "Good afternoon", Goodbye]
    accepted_answers: [{value: "Good evening", status: correct}]
    feedback: "Goedenavond means 'Good evening.'"
  nl.a1.unit01.lesson02.exercise03.choose_formal_question:
    instruction: "You are speaking to an older customer and choose formal address. Which question fits?"
    correct_option: "Hoe gaat het met u?"
    distractors: ["Hoe gaat het met je?", "Hoe gaat het met jou?", "Hoe gaat het met jij?"]
    accepted_answers: [{value: "Hoe gaat het met u?", status: correct}]
    feedback: "Met u keeps the question formal."
  nl.a1.unit01.lesson02.exercise04.match_times:
    instruction: "Match each greeting with a plausible time."
    accepted_answers:
      - value: [{left: Goedemorgen, right: "08:30"}, {left: Goedemiddag, right: "14:00"}, {left: Goedenavond, right: "20:00"}]
        status: correct
    feedback: "Morning, afternoon, and evening greetings follow the time of day."
  nl.a1.unit01.lesson02.exercise05.listen_order_formal:
    instruction: "Listen and put the formal well-being question in order."
    accepted_answers: [{value: [Hoe, gaat, het, met, u], status: correct}]
    feedback: "The recording says Hoe gaat het met u?"
  nl.a1.unit01.lesson02.exercise06.reply_informal:
    instruction: "Reply naturally and informally, then return the question."
    accepted_answers:
      - {value: "Goed, dank je. En met jou?", status: correct}
      - {value: "Prima, dank je. En met jou?", status: correct}
      - {value: "Niet slecht, dank je. En met jou?", status: correct}
      - {value: "Goed dank je, en met jou?", status: correct}
      - {value: "Goed. En met jou?", status: correct}
      - {value: "Prima. En met jou?", status: correct}
      - {value: "Niet slecht. En met jou?", status: correct}
    feedback: "An informal reply uses dank je and can return the question with En met jou?"
  nl.a1.unit01.lesson02.exercise07.listen_type_reply:
    instruction: "Listen and type the Dutch reply."
    accepted_answers:
      - {value: "Goed, dank je.", status: correct}
      - {value: "Goed, dank je", status: correct}
      - {value: "goed, dank je", status: correct}
      - {value: "Goed dank je", status: correct}
    feedback: "The recording says Goed, dank je."
  nl.a1.unit01.lesson02.exercise08.write_formal_exchange:
    instruction: "Write a formal Dutch question asking how someone is, followed by a suitable formal reply."
    accepted_answers:
      - {value: "Hoe gaat het met u? Goed, dank u.", status: correct}
      - {value: "Hoe gaat het met u? Prima, dank u.", status: correct}
      - {value: "Hoe gaat het met u? Niet slecht, dank u.", status: correct}
      - {value: "Hoe gaat het met u? Goed dank u.", status: correct}
    feedback: "Keep both turns formal by using u and dank u."

  nl.a1.unit01.lesson03.exercise01.choose_name_question:
    instruction: "Choose the informal question for asking a peer's name."
    correct_option: "Hoe heet je?"
    distractors: ["Hoe heet u?", "Hoe heten je?", "Hoe heet jou?"]
    accepted_answers: [{value: "Hoe heet je?", status: correct}]
    feedback: "Hoe heet je? asks a name with informal je."
  nl.a1.unit01.lesson03.exercise02.listen_formal_name:
    instruction: "Listen and choose what information is being requested."
    correct_option: "The listener's name"
    distractors: ["The listener's country", "The listener's language", "How the listener feels"]
    accepted_answers: [{value: "The listener's name", status: correct}]
    feedback: "Hoe heet u? formally asks the listener's name."
  nl.a1.unit01.lesson03.exercise03.choose_natural_answer:
    instruction: "Choose a natural answer to the name question."
    correct_option: "Ik heet Noor."
    distractors: ["Mijn naam Noor.", "Ik heet uit Noor.", "Ik ben naam Noor."]
    accepted_answers: [{value: "Ik heet Noor.", status: correct}]
    feedback: "Ik heet Noor directly gives the speaker's name."
  nl.a1.unit01.lesson03.exercise04.order_name:
    instruction: "Put the words in order to say 'My name is Noor.'"
    accepted_answers: [{value: [Mijn, naam, is, Noor], status: correct}]
    feedback: "The correct order is Mijn naam is Noor."
  nl.a1.unit01.lesson03.exercise05.listen_order_intro:
    instruction: "Listen and put the introduction in order."
    accepted_answers: [{value: [Ik, heet, Noor], status: correct}]
    feedback: "The recording says Ik heet Noor."
  nl.a1.unit01.lesson03.exercise06.reply_with_name:
    instruction: "Reply with Noor's name and add a friendly first-meeting phrase."
    accepted_answers:
      - {value: "Ik heet Noor. Leuk je te ontmoeten.", status: correct}
      - {value: "Ik ben Noor. Leuk je te ontmoeten.", status: correct}
      - {value: "Mijn naam is Noor. Leuk je te ontmoeten.", status: correct}
      - {value: "Ik heet Noor. Aangenaam.", status: acceptable_with_note, note: "Correct, but more formal than the setting requires."}
      - {value: "Ik heet Noor, leuk je te ontmoeten.", status: correct}
      - {value: "Ik ben Noor, leuk je te ontmoeten.", status: correct}
    feedback: "Ik heet Noor and Ik ben Noor are both natural spoken introductions."
  nl.a1.unit01.lesson03.exercise07.listen_type_meeting:
    instruction: "Listen and type the Dutch phrase."
    accepted_answers:
      - {value: "Leuk je te ontmoeten.", status: correct}
      - {value: "Leuk je te ontmoeten", status: correct}
      - {value: "leuk je te ontmoeten", status: correct}
    feedback: "The recording says Leuk je te ontmoeten."
  nl.a1.unit01.lesson03.exercise08.write_self_intro:
    instruction: "Introduce yourself in Dutch with a name. Use Noor for this exercise."
    accepted_answers:
      - {value: "Ik ben Noor.", status: correct}
      - {value: "Ik heet Noor.", status: correct}
      - {value: "Mijn naam is Noor.", status: correct}
      - {value: "Ik ben Noor", status: correct}
      - {value: "Ik heet Noor", status: correct}
      - {value: "Mijn naam is Noor", status: correct}
    feedback: "Ik ben ..., Ik heet ..., and Mijn naam is ... can all introduce a name."

  nl.a1.unit01.lesson04.exercise01.choose_origin_question:
    instruction: "Choose the informal question asking where someone is from."
    correct_option: "Waar kom je vandaan?"
    distractors: ["Waar komt u vandaan?", "Waar komt je vandaan?", "Waar kom u vandaan?"]
    accepted_answers: [{value: "Waar kom je vandaan?", status: correct}]
    feedback: "Waar kom je vandaan? is informal because it uses je and kom."
  nl.a1.unit01.lesson04.exercise02.listen_formal_origin:
    instruction: "Listen and choose the register used."
    correct_option: "Formal"
    distractors: [Informal, "No person is addressed", "A farewell"]
    accepted_answers: [{value: "Formal", status: correct}]
    feedback: "Waar komt u vandaan? uses formal u and komt."
  nl.a1.unit01.lesson04.exercise03.choose_language:
    instruction: "Which sentence names a language the speaker uses?"
    correct_option: "Ik spreek Nederlands."
    distractors: ["Ik kom uit Nederland.", "Ik ben Nederlands.", "Waar kom je vandaan?"]
    accepted_answers: [{value: "Ik spreek Nederlands.", status: correct}]
    feedback: "Spreek identifies a language the speaker speaks."
  nl.a1.unit01.lesson04.exercise04.match_country_language:
    instruction: "Match each country with its Dutch adjective."
    accepted_answers:
      - value: [{left: Nederland, right: Nederlands}, {left: België, right: Belgisch}, {left: Duitsland, right: Duits}]
        status: correct
    feedback: "The adjectives are Nederlands, Belgisch, and Duits."
  nl.a1.unit01.lesson04.exercise05.listen_order_origin:
    instruction: "Listen and put the informal origin question in order."
    accepted_answers: [{value: [Waar, kom, je, vandaan], status: correct}]
    feedback: "The recording says Waar kom je vandaan?"
  nl.a1.unit01.lesson04.exercise06.complete_country:
    instruction: "Complete the sentence with the Dutch word meaning 'from.'"
    accepted_answers:
      - {value: uit, status: correct}
      - {value: Uit, status: correct}
    feedback: "Use uit before the country: Ik kom uit België."
  nl.a1.unit01.lesson04.exercise07.listen_type_language:
    instruction: "Listen and type the Dutch sentence."
    accepted_answers:
      - {value: "Ik spreek Nederlands.", status: correct}
      - {value: "Ik spreek Nederlands", status: correct}
      - {value: "ik spreek Nederlands", status: correct}
      - {value: "ik spreek nederlands", status: acceptable_with_note, note: "The words are right, but language names are normally capitalized in Dutch."}
    feedback: "The recording says Ik spreek Nederlands."
  nl.a1.unit01.lesson04.exercise08.write_origin_language:
    instruction: "Write two Dutch sentences: say you are from the Netherlands and that you speak Dutch."
    accepted_answers:
      - {value: "Ik kom uit Nederland. Ik spreek Nederlands.", status: correct}
      - {value: "Ik kom uit Nederland en ik spreek Nederlands.", status: correct}
      - {value: "Ik kom uit Nederland. Ik spreek Nederlands", status: correct}
    feedback: "Use kom uit for origin and spreek for language."

  nl.a1.unit01.lesson05.exercise01.choose_place:
