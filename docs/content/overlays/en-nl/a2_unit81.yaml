schema_version: "1.1"
overlay_version: "2026.1-draft.1"
source_language: en
target_language: nl
cefr_level: A2
status: complete_draft
review: {status: unreviewed, required_next_reviewer: owner_native_pass, notes: "English overlay for the new grammar-led Dutch A2 unit. Informal jij/je register throughout. OPEN NATIVE QUESTIONS: none."}
course: {overlay_key: en-nl.a2, title: "Dutch A2", description: "Intermediate Dutch with grammar-led practice in describing past events."}
units:
  nl.a2.unit81.een_drukke_ochtend: {title: "A Busy Morning", description: "Describe a morning or commute step by step with separable verbs in the perfectum."}
lessons:
  nl.a2.unit81.lesson01.ge_in_het_midden: {title: "Ge- in the Middle"}
  nl.a2.unit81.lesson02.stappen_op_volgorde: {title: "Steps in Order"}
  nl.a2.unit81.lesson03.wel_of_geen_ge: {title: "With or Without ge-?"}
  nl.a2.unit81.lesson04.de_ochtend_ging_mis: {title: "The Morning Went Wrong"}
  nl.a2.unit81.lesson05.noors_bericht: {title: "Noor's Message"}
  nl.a2.unit81.lesson06.lotte_en_noor: {title: "Lotte and Noor Talk after Work"}
teaching:
  nl.a2.unit81.lesson01.teach.ochtend_reis: {title: "Morning and commute", gloss: "the morning, the alarm clock, the bus, the bicycle, the bag", note: "Core words for getting ready and commuting.", example_gloss: ["The morning starts early.", "My alarm goes off at seven.", "The bus is at the stop.", "My bicycle is outside.", "My bag is ready."]}
  nl.a2.unit81.lesson01.teach.verbindingswoorden: {title: "Put steps in order", gloss: "first, after that, next, finally", note: "These connectors organize a step-by-step account. When one starts a main clause, the finite verb comes before the subject.", example_gloss: ["First I have breakfast.", "After that I pack my bag.", "Next I go outside.", "Finally I board the bus."]}
  nl.a2.unit81.lesson01.teach.gn_midden: {title: "The participle goes around ge-", gloss: "get up → got up; arrive → arrived; get off → got off; get on → got on", note: "In a separable verb, *ge-* sits between the prefix and the verb: *op-ge-staan*, *aan-ge-komen*, *uit-ge-stapt*, *in-ge-stapt*."}
  nl.a2.unit81.lesson01.teach.gn_zinnen: {title: "Finished morning steps", gloss: "I got up early. The bus arrived too late. I got off at the station.", note: "These movement and change-of-position verbs use *zijn* in the perfectum."}
  nl.a2.unit81.lesson01.teach.gn_hulpwerkwoord: {title: "These verbs use zijn", gloss: "I got up; the bus arrived; I got on and got off.", note: "In these completed movement or change-of-position events, use *ben/is* plus the participle."}
  nl.a2.unit81.lesson02.teach.klaarmaken: {title: "Getting ready", gloss: "to get dressed, to tidy up, to wash up, to take along", note: "All four are separable verbs.", example_gloss: ["Getting dressed is quick today.", "I do the tidying after breakfast.", "I do the washing-up after eating.", "Take it along or leave it at home?"]}
  nl.a2.unit81.lesson02.teach.gn_participles: {title: "More separable participles", gloss: "got dressed; tidied up; washed up; taken along", note: "The prefix stays in front and *ge-* appears in the middle: *aan-ge-kleed*, *op-ge-ruimd*, *af-ge-wassen*, *mee-ge-nomen*."}
  nl.a2.unit81.lesson02.teach.stappen: {title: "A four-step routine", gloss: "First I got up. After that I got dressed. Next I washed up my cup. Finally I took my bag with me.", note: "Each connector marks the next completed step."}
  nl.a2.unit81.lesson03.teach.contrastwerkwoorden: {title: "Three verbs without extra ge-", gloss: "to forget, to leave, to have breakfast", note: "These verbs begin with inseparable prefixes and form their participles without an extra *ge-*.", example_gloss: ["To forget is human.", "We want to leave at eight.", "I have breakfast at home."]}
  nl.a2.unit81.lesson03.teach.gn_contrast: {title: "Separable versus inseparable", gloss: "Separable: get up → got up. Not separable: forget → forgotten, leave → left, have breakfast → had breakfast.", note: "Use *opgestaan*, but *vergeten*, *vertrokken* and *ontbeten* without another *ge-*."}
  nl.a2.unit81.lesson03.teach.contrastzinnen: {title: "Compare the forms", gloss: "I got up and had breakfast. After that I left. I forgot my bag.", note: "Only the separable verb *opstaan* places *ge-* after its prefix."}
  nl.a2.unit81.lesson03.teach.gn_modal: {title: "A separable verb after a modal", gloss: "I want to get up early. I have to tidy the kitchen. I can get off at the station.", note: "With present *wil, moet,* or *kan*, the infinitive stays joined and goes at the end: *opstaan, opruimen, uitstappen*."}
  nl.a2.unit81.lesson04.teach.op_tijd_snel: {title: "How the morning went", gloss: "on time, quickly, still / nevertheless", note: "Use these words to explain timing and an unexpected successful result.", example_gloss: ["I want to arrive on time.", "The bus travels quickly.", "It is raining, but I am going anyway."]}
  nl.a2.unit81.lesson04.teach.gn_negatie: {title: "Negated steps", gloss: "I did not take my bag with me. I did not get up on time.", note: "Place *niet* before the element being negated: the separable participle, or the phrase *op tijd*."}
  nl.a2.unit81.lesson04.teach.gn_dat: {title: "The perfectum in a dat-clause", gloss: "I said that I got up early. I heard that the bus arrived too late.", note: "After *dat*, both verb parts move to the end: *ben opgestaan*, *is aangekomen*."}
  nl.a2.unit81.lesson04.teach.scenario: {title: "A morning that went wrong", gloss: "First I did not get up on time. After that I got dressed quickly. Next I did not take my bag. Finally I boarded the bus.", note: "The connectors give the failed and completed steps a clear order."}
  nl.a2.unit81.lesson05.teach.noor_bericht: {title: "Noor's busy morning", gloss: "Hi Lotte! My morning was very busy. First I got up too late. After that I got dressed quickly and had breakfast. Next I tidied the kitchen, but I did not take my lunch with me. I cycled to the bus stop and boarded the bus. Finally I still arrived at work on time.", note: "Read for the order of events and the one thing Noor did not take.", glosses: {erg: "very", druk: "busy", bushalte: "bus stop", lunch: "lunch", toch: "still / nevertheless"}}
  nl.a2.unit81.lesson06.teach.lotte_vraag: {title: "Lotte asks about the morning", gloss: "Lotte: Hi Noor, how did your morning go?"}
  nl.a2.unit81.lesson06.teach.noor_eerst: {title: "Noor names the first problem", gloss: "Noor: Not so well. First I got up too late."}
  nl.a2.unit81.lesson06.teach.lotte_daarna: {title: "Lotte asks what happened next", gloss: "Lotte: Oh no! And after that?"}
  nl.a2.unit81.lesson06.teach.noor_tas: {title: "Noor gives the next steps", gloss: "Noor: After that I got dressed quickly, but I did not take my bag with me."}
  nl.a2.unit81.lesson06.teach.lotte_reis: {title: "Lotte asks about transport", gloss: "Lotte: How did you get to work?"}
  nl.a2.unit81.lesson06.teach.noor_aankomst: {title: "Noor finishes the account", gloss: "Noor: I boarded the bus. Finally I still arrived on time."}
  nl.a2.unit81.lesson06.teach.vraag: {title: "A question", gloss: "the question", note: "*Een vraag stellen* means to ask a question.", example_gloss: "Lotte asks a question about the morning."}
exercises:
  nl.a2.unit81.lesson01.exercise01.choose_opgestaan: {instruction: "Which is the correct participle of *opstaan*?", correct_option: opgestaan, distractors: [geopstaan, opstond, gestaanop], accepted_answers: [{value: opgestaan, status: correct}], feedback: "The separable participle is *op-ge-staan*: *opgestaan*."}
  nl.a2.unit81.lesson01.exercise02.listen_opgestaan: {instruction: "Listen and select what you hear.", correct_option: "Ik ben vroeg opgestaan.", distractors: ["Ik ben vroeg aangekomen.", "Ik ben bij het station uitgestapt.", "De bus is te laat aangekomen."], accepted_answers: [{value: "Ik ben vroeg opgestaan.", status: correct}], feedback: "You heard *Ik ben vroeg opgestaan* — I got up early."}
  nl.a2.unit81.lesson01.exercise03.match_forms: {instruction: "Match each item to its participle or meaning.", accepted_answers: [{value: [{left: opstaan, right: opgestaan}, {left: aankomen, right: aangekomen}, {left: uitstappen, right: uitgestapt}, {left: instappen, right: ingestapt}, {left: eerst, right: first}, {left: daarna, right: "after that"}], status: correct}], feedback: "Prefixes stay in front of *ge-* in these separable participles."}
  nl.a2.unit81.lesson01.exercise04.order_early: {instruction: "Put the words in order to say 'I got up early.'", correct_option: "Ik ben vroeg opgestaan", accepted_answers: [{value: "Ik ben vroeg opgestaan", status: correct}], feedback: "*Ik ben vroeg opgestaan* = I got up early."}
  nl.a2.unit81.lesson01.exercise05.order_bus: {instruction: "Put the words in order to say 'The bus arrived too late.'", correct_option: "De bus is te laat aangekomen", accepted_answers: [{value: "De bus is te laat aangekomen", status: correct}], feedback: "*De bus is te laat aangekomen* = The bus arrived too late."}
  nl.a2.unit81.lesson01.exercise06.complete_arrived: {instruction: "Complete the perfectum sentence with the separable participle of *aankomen*.", correct_option: aangekomen, accepted_answers: [{value: aangekomen, status: correct}], feedback: "*Aankomen* becomes *aangekomen*."}
  nl.a2.unit81.lesson01.exercise07.translate_got_up: {instruction: "Translate into Dutch. Use the perfectum with *zijn* and the separable participle of *opstaan*.", accepted_answers: [{value: "Ik ben vroeg opgestaan.", status: correct}, {value: "Ik ben vroeg opgestaan", status: correct}], feedback: "*Ik ben vroeg opgestaan* = I got up early."}
  nl.a2.unit81.lesson02.exercise01.choose_aangekleed: {instruction: "Which is the correct participle of *aankleden*?", correct_option: aangekleed, distractors: [geaankleed, aankleden, gekleedaan], accepted_answers: [{value: aangekleed, status: correct}], feedback: "*Aankleden* becomes *aangekleed*."}
  nl.a2.unit81.lesson02.exercise02.choose_afgewassen: {instruction: "Which is the correct participle of *afwassen*?", correct_option: afgewassen, distractors: [geafwassen, afgewast, gewassenaf], accepted_answers: [{value: afgewassen, status: correct}], feedback: "*Afwassen* becomes *afgewassen*."}
  nl.a2.unit81.lesson02.exercise03.match_participles: {instruction: "Match each separable verb to its participle.", accepted_answers: [{value: [{left: aankleden, right: aangekleed}, {left: opruimen, right: opgeruimd}, {left: afwassen, right: afgewassen}, {left: meenemen, right: meegenomen}, {left: instappen, right: ingestapt}, {left: uitstappen, right: uitgestapt}], status: correct}], feedback: "Each participle keeps its prefix before *ge-*."}
  nl.a2.unit81.lesson02.exercise04.order_dressed: {instruction: "Put the words in order to say 'After that I got dressed.'", correct_option: "Daarna heb ik me aangekleed", accepted_answers: [{value: "Daarna heb ik me aangekleed", status: correct}], feedback: "*Daarna heb ik me aangekleed* = After that I got dressed."}
  nl.a2.unit81.lesson02.exercise05.order_cup: {instruction: "Put the words in order to say 'Next I washed up my cup.'", correct_option: "Vervolgens heb ik mijn kopje afgewassen", accepted_answers: [{value: "Vervolgens heb ik mijn kopje afgewassen", status: correct}], feedback: "*Vervolgens heb ik mijn kopje afgewassen* = Next I washed up my cup."}
  nl.a2.unit81.lesson02.exercise06.complete_bag: {instruction: "Complete the perfectum sentence with the separable participle of *meenemen*.", correct_option: meegenomen, accepted_answers: [{value: meegenomen, status: correct}], feedback: "*Meenemen* becomes *meegenomen*."}
  nl.a2.unit81.lesson02.exercise07.translate_dressed: {instruction: "Translate into Dutch. Use the perfectum with *hebben*, *daarna*, and the separable participle of *aankleden*.", accepted_answers: [{value: "Daarna heb ik me aangekleed.", status: correct}, {value: "Daarna heb ik me aangekleed", status: correct}], feedback: "*Daarna heb ik me aangekleed* = After that I got dressed."}
  nl.a2.unit81.lesson03.exercise01.choose_no_extra_ge: {instruction: "Which is the correct participle of *ontbijten*?", correct_option: ontbeten, distractors: [geontbeten, ontgebeten, ontbijt], accepted_answers: [{value: ontbeten, status: correct}], feedback: "The inseparable prefix *ont-* does not take an extra *ge-*: *ontbeten*."}
  nl.a2.unit81.lesson03.exercise02.choose_separable: {instruction: "Which participle comes from a separable verb?", correct_option: opgestaan, distractors: [vergeten, vertrokken, ontbeten], accepted_answers: [{value: opgestaan, status: correct}], feedback: "*Opstaan* is separable, so *ge-* appears after *op-*: *opgestaan*."}
  nl.a2.unit81.lesson03.exercise03.match_contrast: {instruction: "Match each verb to its participle.", accepted_answers: [{value: [{left: opstaan, right: opgestaan}, {left: opruimen, right: opgeruimd}, {left: ontbijten, right: ontbeten}, {left: vertrekken, right: vertrokken}, {left: vergeten, right: vergeten}, {left: meenemen, right: meegenomen}], status: correct}], feedback: "Separable verbs place *ge-* after the prefix; these inseparable verbs do not add it."}
  nl.a2.unit81.lesson03.exercise04.order_modal: {instruction: "Put the words in order. Use present *wil* plus the separable infinitive.", correct_option: "Ik wil vroeg opstaan", accepted_answers: [{value: "Ik wil vroeg opstaan", status: correct}], feedback: "After *wil*, the joined infinitive goes last: *Ik wil vroeg opstaan*."}
  nl.a2.unit81.lesson03.exercise05.order_clean: {instruction: "Put the words in order. Use present *moet* plus the separable infinitive.", correct_option: "Ik moet de keuken opruimen", accepted_answers: [{value: "Ik moet de keuken opruimen", status: correct}], feedback: "After *moet*, the joined infinitive goes last: *opruimen*."}
  nl.a2.unit81.lesson03.exercise06.complete_breakfast: {instruction: "Complete the perfectum sentence with the participle of *ontbijten*.", correct_option: ontbeten, accepted_answers: [{value: ontbeten, status: correct}], feedback: "*Ik heb ontbeten* = I had breakfast."}
  nl.a2.unit81.lesson03.exercise07.translate_modal: {instruction: "Translate into Dutch. Use present *wil* plus the separable infinitive *opstaan*.", accepted_answers: [{value: "Ik wil vroeg opstaan.", status: correct}, {value: "Ik wil vroeg opstaan", status: correct}], feedback: "*Ik wil vroeg opstaan* = I want to get up early."}
  nl.a2.unit81.lesson04.exercise01.choose_negated_bag: {instruction: "Choose the Dutch sentence meaning 'I did not take my bag with me.'", correct_option: "Ik heb mijn tas niet meegenomen.", distractors: ["Ik heb niet meegenomen mijn tas.", "Ik ben mijn tas niet meegenomen.", "Ik heb mijn tas geen meegenomen."], accepted_answers: [{value: "Ik heb mijn tas niet meegenomen.", status: correct}], feedback: "Use *hebben* and put *niet* before the participle: *Ik heb mijn tas niet meegenomen*."}
  nl.a2.unit81.lesson04.exercise02.listen_bag: {instruction: "Listen and select what you hear.", correct_option: "Ik heb mijn tas niet meegenomen.", distractors: ["Ik heb mijn lunch niet meegenomen.", "Ik heb mijn tas opgeruimd.", "Ik ben niet op tijd opgestaan."], accepted_answers: [{value: "Ik heb mijn tas niet meegenomen.", status: correct}], feedback: "You heard *Ik heb mijn tas niet meegenomen* — I did not take my bag with me."}
  nl.a2.unit81.lesson04.exercise03.match_steps: {instruction: "Match each connector or verb to its Dutch step or participle.", accepted_answers: [{value: [{left: eerst, right: "niet op tijd opgestaan"}, {left: daarna, right: "snel aangekleed"}, {left: vervolgens, right: "tas niet meegenomen"}, {left: "ten slotte", right: "in de bus gestapt"}, {left: opstaan, right: opgestaan}, {left: meenemen, right: meegenomen}], status: correct}], feedback: "The four connectors mark a clear sequence."}
  nl.a2.unit81.lesson04.exercise04.order_dat: {instruction: "Put the words in order. Use the perfectum in a *dat*-clause.", correct_option: "Ik zei dat ik vroeg ben opgestaan", accepted_answers: [{value: "Ik zei dat ik vroeg ben opgestaan", status: correct}, {value: "Ik zei dat ik vroeg opgestaan ben", status: correct}], feedback: "In the *dat*-clause, *ben opgestaan* comes at the end."}
  nl.a2.unit81.lesson04.exercise05.order_not_on_time: {instruction: "Put the words in order to say you did not get up on time. Use the perfectum with *zijn*.", correct_option: "Ik ben niet op tijd opgestaan", accepted_answers: [{value: "Ik ben niet op tijd opgestaan", status: correct}], feedback: "*Ik ben niet op tijd opgestaan* = I did not get up on time."}
  nl.a2.unit81.lesson04.exercise06.complete_dat_bus: {instruction: "Complete the *dat*-clause with the separable participle of *aankomen*.", correct_option: aangekomen, accepted_answers: [{value: aangekomen, status: correct}], feedback: "The clause ends in *is aangekomen*."}
  nl.a2.unit81.lesson04.exercise07.translate_negated: {instruction: "Translate into Dutch. Use the perfectum with *hebben*, *niet*, and the separable participle of *meenemen*.", accepted_answers: [{value: "Ik heb mijn tas niet meegenomen.", status: correct}, {value: "Ik heb mijn tas niet meegenomen", status: correct}], feedback: "*Ik heb mijn tas niet meegenomen* = I did not take my bag with me."}
  nl.a2.unit81.lesson05.exercise01.read_first: {instruction: "Read Noor's message. What went wrong first?", correct_option: "She got up too late", distractors: ["She missed the bus", "She forgot her bag", "She arrived late at work"], accepted_answers: [{value: "She got up too late", status: correct}], feedback: "Noor writes: *Eerst ben ik te laat opgestaan*."}
  nl.a2.unit81.lesson05.exercise02.read_not_taken: {instruction: "What did Noor not take with her?", correct_option: "Her lunch", distractors: ["Her bag", "Her bicycle", "Her alarm clock"], accepted_answers: [{value: "Her lunch", status: correct}], feedback: "Noor writes: *ik heb mijn lunch niet meegenomen*."}
  nl.a2.unit81.lesson05.exercise03.match_reading: {instruction: "Match each part of Noor's message to what happened.", accepted_answers: [{value: [{left: eerst, right: "got up late"}, {left: daarna, right: "got dressed and had breakfast"}, {left: vervolgens, right: "tidied the kitchen but left her lunch"}, {left: "naar de bushalte", right: cycled}, {left: "in de bus", right: boarded}, {left: "ten slotte", right: "arrived at work on time"}], status: correct}], feedback: "The time expressions track Noor's morning from waking up to arriving."}
  nl.a2.unit81.lesson05.exercise04.order_final: {instruction: "Put the words in order to say 'Finally I arrived at work.'", correct_option: "Ten slotte ben ik op mijn werk aangekomen", accepted_answers: [{value: "Ten slotte ben ik op mijn werk aangekomen", status: correct}], feedback: "*Ten slotte ben ik op mijn werk aangekomen* = Finally I arrived at work."}
  nl.a2.unit81.lesson05.exercise05.complete_lunch: {instruction: "Complete the perfectum sentence with the separable participle of *meenemen*.", correct_option: meegenomen, accepted_answers: [{value: meegenomen, status: correct}], feedback: "*Ik heb mijn lunch niet meegenomen* = I did not take my lunch with me."}
  nl.a2.unit81.lesson05.exercise06.dictation_first: {instruction: "Type what you hear.", correct_response: "Eerst ben ik te laat opgestaan", orthography_strict: true, feedback: "You heard *Eerst ben ik te laat opgestaan*."}
  nl.a2.unit81.lesson05.exercise07.dictation_bus: {instruction: "Type what you hear.", correct_response: "Daarna ben ik snel in de bus gestapt", orthography_strict: true, feedback: "You heard *Daarna ben ik snel in de bus gestapt*."}
  nl.a2.unit81.lesson06.exercise01.comprehend_first: {instruction: "Listen to the dialogue. What went wrong first in Noor's morning?", correct_option: "She got up too late", distractors: ["She left her lunch at home", "She got off at the station", "She arrived late at work"], accepted_answers: [{value: "She got up too late", status: correct}], feedback: "Noor says: *Eerst ben ik te laat opgestaan*."}
  nl.a2.unit81.lesson06.exercise02.comprehend_bag: {instruction: "What did Noor not take with her?", correct_option: "Her bag", distractors: ["Her lunch", "Her bicycle", "Her alarm clock"], accepted_answers: [{value: "Her bag", status: correct}], feedback: "Noor says: *ik heb mijn tas niet meegenomen*."}
  nl.a2.unit81.lesson06.exercise03.match_dialogue: {instruction: "Match each distinct dialogue cue to its answer.", accepted_answers: [{value: [{left: "Lotte's first question", right: "how the morning went"}, {left: "Noor's first problem", right: "got up too late"}, {left: "Noor's second problem", right: "did not take her bag"}, {left: "Lotte's travel question", right: "how Noor went to work"}, {left: "Noor's transport", right: bus}, {left: "Noor's final result", right: "arrived on time"}], status: correct}], feedback: "Each cue refers to one specific turn in the dialogue."}
  nl.a2.unit81.lesson06.exercise04.order_arrival: {instruction: "Put the words in order to say 'Finally I still arrived on time.'", correct_option: "Ten slotte ben ik toch op tijd aangekomen", accepted_answers: [{value: "Ten slotte ben ik toch op tijd aangekomen", status: correct}], feedback: "*Ten slotte ben ik toch op tijd aangekomen* = Finally I still arrived on time."}
  nl.a2.unit81.lesson06.exercise05.respond_bag: {instruction: "Answer Noor's friend in Dutch: say that you did not take your bag. Use the perfectum with *hebben*, *niet*, and the separable participle of *meenemen*.", correct_option: "Ik heb mijn tas niet meegenomen.", accepted_answers: [{value: "Ik heb mijn tas niet meegenomen.", status: correct}, {value: "Ik heb mijn tas niet meegenomen", status: correct}], feedback: "*Ik heb mijn tas niet meegenomen* = I did not take my bag with me."}
  nl.a2.unit81.lesson06.exercise06.respond_dat: {instruction: "Answer in Dutch: report that you said you got up too late. Use *zei dat* and the perfectum with *zijn* in the *dat*-clause.", correct_option: "Ik zei dat ik te laat ben opgestaan.", accepted_answers: [{value: "Ik zei dat ik te laat ben opgestaan.", status: correct}, {value: "Ik zei dat ik te laat opgestaan ben.", status: correct}, {value: "Ik zei dat ik te laat opgestaan ben", status: correct}, {value: "Ik zei dat ik te laat ben opgestaan", status: correct}], feedback: "*Ik zei dat ik te laat ben opgestaan* = I said that I got up too late."}
  nl.a2.unit81.lesson06.exercise07.write_morning: {instruction: "Write four Dutch sentences in this exact order: first you got up late; after that you got dressed quickly; next you did not take your bag; finally you arrived at work. Use the perfectum with the correct auxiliary, and begin the sentences with *Eerst, Daarna, Vervolgens,* and *Ten slotte*. Use *te laat*, *snel*, *me* and *op mijn werk*.", accepted_answers: [{value: "Eerst ben ik te laat opgestaan. Daarna heb ik me snel aangekleed. Vervolgens heb ik mijn tas niet meegenomen. Ten slotte ben ik op mijn werk aangekomen.", status: correct}, {value: "Eerst ben ik te laat opgestaan. Daarna heb ik me snel aangekleed. Vervolgens heb ik mijn tas niet meegenomen. Ten slotte ben ik op mijn werk aangekomen", status: correct}], feedback: "*Eerst ben ik te laat opgestaan. Daarna heb ik me snel aangekleed. Vervolgens heb ik mijn tas niet meegenomen. Ten slotte ben ik op mijn werk aangekomen.*"}
