    instruction: Choose the Dutch sentence.
    correct_option: Ik ben aan het koken.
    distractors: [Ik ben aan het bellen., Ik ben aan het slapen., Ik ben aan het lezen.]
    accepted_answers:
    - {value: Ik ben aan het koken., status: correct}
    feedback: '*Aan het koken* = in the middle of cooking.'
  nl.a2.unit105.lesson01.exercise02.choose_question:
    instruction: Choose the correct Dutch question.
    correct_option: Wat ben je aan het doen?
    distractors: ['Wat je ben aan het doen?', 'Wat ben je doen aan het?', 'Wat is je aan het doen?']
    accepted_answers:
    - {value: 'Wat ben je aan het doen?', status: correct}
    feedback: In the question, *ben* comes right after *wat*, then *je*, then *aan het doen*.
