course: {title: Dutch A2, description: Grammar-led A2 Dutch for describing what is happening right now., learning_goal: Say what you or someone else is in the middle of with aan het + infinitive and zitten/staan/liggen/lopen te.}
units:
  nl.a2.unit105.ik_ben_aan_het_koken: {title: I am cooking, description: 'Say what is going on right now: aan het + infinitive, and sitting, standing, lying or walking while doing something.'}
lessons:
  nl.a2.unit105.lesson01.wat_ben_je_aan_het_doen: {title: 'What are you doing?'}
  nl.a2.unit105.lesson02.met_een_object: {title: With an object}
  nl.a2.unit105.lesson03.nu_of_altijd: {title: 'Now or every day?'}
  nl.a2.unit105.lesson04.zitten_staan_liggen_lopen: {title: 'Sitting, standing, lying, walking'}
  nl.a2.unit105.lesson05.omars_bericht: {title: Omar's message}
  nl.a2.unit105.lesson06.lotte_en_omar_bellen: {title: Lotte and Omar on the phone}
teaching:
  nl.a2.unit105.lesson01.teach.huishouden:
    title: Chores at home
    gloss: to cook / to wash up / to clean / the laundry / to do
    note: '*De was doen* means to do the laundry; *doen* is the verb in *wat ben je aan het doen?*'
    example_gloss: [Omar can cook well., I am going to wash up., Noor is going to clean.]
  nl.a2.unit105.lesson01.teach.telefoon:
    title: Phone and free time
    gloss: to call / to read / to sleep / the phone / with / my / mother / sister
    note: '*Bellen* means to phone someone; add *met* to say who you talk with.'
    example_gloss: [Lotte talks to her mother on the phone., I read a book., My sister is sleeping.]
  nl.a2.unit105.lesson01.teach.wie:
    title: People, now and at home
    gloss: I / you (stressed) / you / he / she / what / now / at home / Lotte / Omar / Noor
    note: '*Jij* is the stressed form of *je*; both mean ''you'' to a friend.'
    example_gloss: [I am at home., He is at home now., 'What is Noor doing?']
  nl.a2.unit105.lesson01.teach.aanhet: {title: Aan het + infinitive, gloss: I am cooking. I am calling. I am reading., note: Use *zijn* + *aan het* + infinitive for something you are in the middle of right now. The infinitive stands at the end.}
  nl.a2.unit105.lesson01.teach.vraag: {title: Ask what someone is doing, gloss: 'What are you doing? I am cooking.', note: 'In the question the verb comes before the subject: *ben je*. In a statement, the order is *je bent*.'}
  nl.a2.unit105.lesson02.teach.zijn: {title: The verb zijn, gloss: 'I am cooking. You are reading. He is calling. We are washing up. Are you cooking? Yes, I am cooking.', note: '*Zijn* changes with the subject: *ben, bent, is, zijn*. In a question with *je* the t disappears: *ben je*.'}
  nl.a2.unit105.lesson02.teach.eten:
    title: Food and kitchen
    gloss: the meal / the soup / the kitchen / the washing-up / to make
    note: '*De afwas doen* is the usual way to say you are washing the dishes.'
    example_gloss: [The meal is ready., The soup is hot., I make tea.]
  nl.a2.unit105.lesson02.teach.object: {title: Object before aan het, gloss: I am doing the laundry. Omar is making soup. Noor is cleaning the kitchen., note: 'The object stands between the form of *zijn* and *aan het*: *ik ben de was aan het doen*. *Aan het* + infinitive stay together at the end.'}
  nl.a2.unit105.lesson02.teach.moeder: {title: Calling someone, gloss: Lotte is calling her mother. We are cooking the meal. You are doing the dishes., note: 'With *bellen* the person you call is the object: *haar moeder aan het bellen*.'}
  nl.a2.unit105.lesson03.teach.tijd:
    title: When?
    gloss: every day / often / at this moment / every Saturday / now
    note: '*Elke dag, vaak* and *elke zaterdag* point to a habit. *Nu* and *op dit moment* point to the present moment.'
    example_gloss: [Every day is different., It is often busy., At this moment it is quiet.]
  nl.a2.unit105.lesson03.teach.presens: {title: The plain present, gloss: I cook every day. He cooks every day. I call often. He calls often. I do the laundry. He does the laundry., note: 'The plain present (*ik kook, hij kookt*) is for habits and facts. The ending -t is added for *hij/ze/het*, and for *jij/je* when it stands before the verb (*jij kookt*).'}
  nl.a2.unit105.lesson03.teach.contrast: {title: 'Habit or right now?', gloss: I cook every day. Now I am cooking. Lotte often calls her mother. Now she is calling her mother., note: 'Plain present: what happens regularly. *Zijn* + *aan het* + infinitive: what is happening at this moment.'}
  nl.a2.unit105.lesson03.teach.nu_voorop: {title: Nu in front, gloss: Now I am doing the laundry. At this moment Omar is cooking., note: 'When *nu* or *op dit moment* opens the sentence, the verb stays in second position: *nu ben ik*. Both orders are fine: *ik ben nu de was aan het doen*.'}
  nl.a2.unit105.lesson04.teach.plekken:
    title: Places and things
    gloss: the couch / the newspaper / the bed / in bed / the garden
    note: '*Op de bank* = on the couch; *in bed* = in bed.'
    example_gloss: [The couch is big., He reads the newspaper., The garden is nice.]
  nl.a2.unit105.lesson04.teach.houdingen:
    title: Posture verbs
    gloss: to sit / to stand / to lie / to walk / to wait
    note: 'These verbs tell you how someone does something: sitting, standing, lying or walking.'
    example_gloss: [I want to sit., She wants to stand., He has to wait.]
  nl.a2.unit105.lesson04.teach.te: {title: 'Zitten, staan, liggen, lopen + te', gloss: He is sitting calling. She is standing cooking. He is lying sleeping. She is walking around calling., note: 'Use *zit / staat / ligt / loopt* + *te* + infinitive to say what someone is doing while sitting, standing, lying or walking. It is very common in spoken Dutch.'}
  nl.a2.unit105.lesson04.teach.object_te: {title: Object and place before te, gloss: He is sitting reading the newspaper. Omar is standing in the kitchen making soup. Lotte is sitting on the couch reading., note: 'Objects and places stand before *te*; the infinitive is last. The conjugated verb stays in second position: *Hij zit ... te lezen.*'}
  nl.a2.unit105.lesson04.teach.vergelijk: {title: Aan het or zitten te, gloss: He is reading. He is sitting reading. She is cooking. She is standing cooking., note: 'Both forms say that something is going on. *Zit/staat/ligt/loopt te* also shows the posture, so choose the verb that fits what the person is really doing.'}
  nl.a2.unit105.lesson05.teach.reading:
    title: Omar's message to Lotte
    gloss: Hi Lotte! I am at home. I am making soup. My sister is sitting on the couch calling my mother. Noor is doing the dishes. And you? What are you doing?
    note: Find who is doing what at this moment.
    glosses: {zus: sister, moeder: mother, afwas: washing-up, soep: soup, bank: couch}
  nl.a2.unit105.lesson06.teach.beurt1: {title: Lotte asks Omar, gloss: 'Lotte: Hi Omar, what are you doing?'}
  nl.a2.unit105.lesson06.teach.beurt2: {title: Omar answers and asks back, gloss: 'Omar: I am making soup. And you?'}
  nl.a2.unit105.lesson06.teach.beurt3: {title: Lotte answers, gloss: 'Lotte: I am doing the laundry.'}
  nl.a2.unit105.lesson06.teach.beurt4: {title: Omar asks about Noor, gloss: 'Omar: And what is Noor doing?'}
  nl.a2.unit105.lesson06.teach.beurt5: {title: Lotte describes Noor, gloss: 'Lotte: Noor is sitting on the couch calling.'}
exercises:
