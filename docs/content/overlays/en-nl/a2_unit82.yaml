schema_version: "1.1"
overlay_version: "2026.1-draft.1"
source_language: en
target_language: nl
realization_key: nl.a2
overlay_key: en-nl.a2.unit82
status: complete_draft
review: {status: unreviewed, required_next_reviewer: fresh_context_then_ramin_native_pass, notes: "Informal jij-register. Mirrors the unit82 realization; no sibling-direction overlay consulted."}
course:
  title: "Dutch A2"
  description: "Intermediate Dutch continuing the Lotte and Omar storyline, now with a grammar-led block on talking about the past."
unit:
  content_key: nl.a2.unit82.hoe_het_vroeger_was
  title: "How things used to be"
  description: "Describe repeated past habits with the regular Dutch imperfectum and contrast earlier life with the present."
teaching:
  nl.a2.unit82.lesson01.teach.tijdwoorden: {title: "Then and now", gloss: "in the past, then, now, nowadays", note: "Use *vroeger* for a broad earlier period and *toen* for a particular time.", example_gloss: ["I used to live in Utrecht.", "I was young then.", "Now I live in an apartment.", "Nowadays I cycle to work."]}
  nl.a2.unit82.lesson01.teach.huisvesting: {title: "Homes and size", gloss: "the house, the apartment, small, big", note: "*Flat* means an apartment, especially one in an apartment building.", example_gloss: ["The house is small.", "The apartment is big."]}
  nl.a2.unit82.lesson01.teach.gn_vorm: {title: "The regular imperfectum", gloss: "wonen → woonde; werken → werkte", note: "Regular singular past forms use the stem plus *-te* or *-de*."}
  nl.a2.unit82.lesson01.teach.contrast: {title: "A then-and-now contrast", gloss: "I used to live in a small house; now I live in an apartment.", note: "The past clause uses *woonde*; the present clause uses *woon*."}
  nl.a2.unit82.lesson02.teach.werkwoorden: {title: "Everyday verbs", gloss: "to cycle, do/make, play, learn, live, work", note: "These regular verbs let you practise both imperfectum endings.", example_gloss: ["I cycle to school.", "I do homework.", "The children play outside.", "We learn Dutch.", "We live in Utrecht.", "I work in the hospital."]}
  nl.a2.unit82.lesson02.teach.schoolwoorden: {title: "School and work places", gloss: "school, homework, outside, the hospital", note: "Useful words for describing an earlier routine.", example_gloss: ["I cycle to school.", "After school I do homework.", "We play outside.", "Lotte works in the hospital."]}
  nl.a2.unit82.lesson02.teach.gn_kofschip: {title: "The 't kofschip rule", gloss: "stem ending in t, k, f, s, ch or p → -te; otherwise → -de", note: "Look at the final sound of the stem: *werk-te*, *fiets-te*, but *woon-de* and *leer-de*."}
  nl.a2.unit82.lesson02.teach.vormen: {title: "Six singular forms", gloss: "I worked, cycled, made, played, learned, lived.", note: "The same singular form is used with *ik*, *jij* and *hij/zij*."}
  nl.a2.unit82.lesson02.teach.elke_dag: {title: "Every day", gloss: "Every day I cycled to school.", note: "*Elke* is used with a de-word: *elke dag*."}
  nl.a2.unit82.lesson03.teach.gewoonte: {title: "Habit time phrases", gloss: "always, every day, every summer, often", note: "These phrases make a repeated past habit explicit.", example_gloss: ["I always cycled to school.", "Every day I did homework.", "Every summer we stayed with Grandpa and Grandma.", "We often played outside."]}
  nl.a2.unit82.lesson03.teach.familie: {title: "Family and neighbourhood", gloss: "grandpa and grandma; the neighbourhood", note: "*Bij opa en oma* means at Grandpa and Grandma's.", example_gloss: ["Grandpa and Grandma lived in Utrecht.", "The neighbourhood was quiet."]}
  nl.a2.unit82.lesson03.teach.logeren: {title: "Stay as a guest", gloss: "to stay overnight / stay as a guest", note: "*Logeren bij* is used for staying at someone's home.", example_gloss: "We stay with Grandpa and Grandma."}
  nl.a2.unit82.lesson03.teach.gn_number: {title: "Singular and plural", gloss: "ik woonde; wij woonden", note: "Plural regular forms add *-n* to the singular imperfectum: *werkte → werkten*, *woonde → woonden*."}
  nl.a2.unit82.lesson03.teach.chunks: {title: "Four useful irregular chunks", gloss: "I was; I had; I went; I came", note: "Treat *was*, *had*, *ging* and *kwam* as fixed vocabulary here, together with *stond* and *deed*, which appear in the reading and dialogue. Their system comes later."}
  nl.a2.unit82.lesson03.teach.plural: {title: "A plural past habit", gloss: "We lived in a quiet neighbourhood and often played outside.", note: "Both plural verbs end in *-en*: *woonden*, *speelden*."}
  nl.a2.unit82.lesson04.teach.plaats: {title: "Places and distance", gloss: "close to, far from, the shop, the playground", note: "Use *dicht bij* and *ver van* before a place.", example_gloss: ["The school is close to my house.", "The hospital is far from my house.", "The shop is in the neighbourhood.", "The children play in the playground."]}
  nl.a2.unit82.lesson04.teach.gn_habit: {title: "Why the imperfectum here?", gloss: "Earlier I cycled to school every day.", note: "This unit uses the imperfectum for repeated habits and situations in the past; it does not compare the imperfectum with the perfectum."}
  nl.a2.unit82.lesson04.teach.buurtzin: {title: "The old neighbourhood", gloss: "I used to live close to school and always played in the playground.", note: "After *en*, the shared subject follows the second past verb: *en speelde ik*."}
  nl.a2.unit82.lesson04.teach.nuzin: {title: "The situation now", gloss: "Now I live far from school and work in the hospital.", note: "Both verbs are present tense because *nu* sets the current time frame."}
  nl.a2.unit82.lesson05.teach.jeugd: {title: "Childhood", gloss: "childhood; after school", note: "*Jeugd* is the period when someone is young.", example_gloss: ["My childhood was nice.", "After school I did homework."]}
  nl.a2.unit82.lesson05.teach.reading: {title: "Reading: Lotte's childhood", gloss: "When Lotte was young, she lived with her parents in Utrecht. Their house was small and stood close to her school. Every day she cycled to school. After school she played outside and did homework. Every summer Lotte and her parents stayed with Grandpa and Grandma. Nowadays Lotte lives in an apartment and works as a nurse in the hospital.", note: "Find repeated habits marked by *elke dag* and *elke zomer*, then the present-day contrast marked by *tegenwoordig*."}
  nl.a2.unit82.lesson06.teach.omar01: {title: "Omar asks about Utrecht", gloss: "Omar: Did you also use to live in Utrecht?"}
  nl.a2.unit82.lesson06.teach.lotte01: {title: "Lotte describes her old home", gloss: "Lotte: Yes, I lived with my parents in a small house."}
  nl.a2.unit82.lesson06.teach.omar02: {title: "Omar asks about the routine", gloss: "Omar: What did you do after school?"}
  nl.a2.unit82.lesson06.teach.lotte02: {title: "Lotte lists three habits", gloss: "Lotte: I cycled home, played outside and then did homework."}
  nl.a2.unit82.lesson06.teach.lotte03: {title: "Lotte contrasts the present", gloss: "Lotte: Now I live in an apartment and work in the hospital."}
  nl.a2.unit82.lesson06.teach.gn_recap: {title: "Then and now", gloss: "vroeger + imperfectum; nu + present tense", note: "Use the imperfectum for the repeated earlier situation and present tense for the current contrast."}
exercises:
  nl.a2.unit82.lesson01.exercise01.choose_past: {instruction: "Choose the Dutch sentence meaning 'I used to live in a small house.'", correct_option: "Vroeger woonde ik in een klein huis.", distractors: ["Vroeger woon ik in een klein huis.", "Nu woonde ik in een klein huis.", "Vroeger werkte ik in een klein huis."], accepted_answers: [{value: "Vroeger woonde ik in een klein huis.", status: correct}], feedback: "*Vroeger woonde ik in een klein huis* uses the regular imperfectum *woonde*."}
  nl.a2.unit82.lesson01.exercise02.listen_house: {instruction: "Listen and select exactly what you hear.", correct_option: "Vroeger woonde ik in een klein huis.", distractors: ["Nu woon ik in een flat.", "Vroeger werkte ik in een klein huis.", "Tegenwoordig woon ik in een groot huis."], accepted_answers: [{value: "Vroeger woonde ik in een klein huis.", status: correct}], feedback: "You heard *Vroeger woonde ik in een klein huis*."}
  nl.a2.unit82.lesson01.exercise03.match_times: {instruction: "Match each Dutch item to its English meaning.", accepted_answers: [{value: [{left: vroeger, right: "in the past"}, {left: toen, right: then}, {left: nu, right: now}, {left: tegenwoordig, right: nowadays}, {left: "het huis", right: "the house"}, {left: "de flat", right: "the apartment"}, {left: klein, right: small}, {left: groot, right: big}], status: correct}], feedback: "The four time words separate earlier life from life now."}
  nl.a2.unit82.lesson01.exercise04.order_old_home: {instruction: "Put the words in order to say 'I used to live in a small house.' Start with Vroeger.", correct_option: "Vroeger woonde ik in een klein huis", accepted_answers: [{value: "Vroeger woonde ik in een klein huis", status: correct}], feedback: "*Vroeger* takes first position, so *woonde* comes before *ik*."}
  nl.a2.unit82.lesson01.exercise05.choose_ending: {instruction: "Choose the regular imperfectum of wonen for ik.", correct_option: woonde, distractors: [woonte, wonen, woont], accepted_answers: [{value: woonde, status: correct}], feedback: "The stem *woon* does not end in a 't kofschip sound, so it takes *-de*: *woonde*."}
  nl.a2.unit82.lesson01.exercise06.complete_woonde: {instruction: "Complete the sentence with the singular regular imperfectum of wonen.", correct_option: woonde, accepted_answers: [{value: woonde, status: correct}], feedback: "*Vroeger woonde ik in een klein huis.*"}
  nl.a2.unit82.lesson01.exercise07.translate_contrast: {instruction: "Translate into Dutch. Use the singular regular imperfectum of wonen in the past clause and present-tense woon in the now clause.", accepted_answers: [{value: "Vroeger woonde ik in een klein huis, nu woon ik in een flat.", status: correct}, {value: "Vroeger woonde ik in een klein huis. Nu woon ik in een flat.", status: correct}], feedback: "*Vroeger woonde ik in een klein huis, nu woon ik in een flat.*"}
  nl.a2.unit82.lesson02.exercise01.choose_fietste: {instruction: "Choose the singular regular imperfectum of fietsen.", correct_option: fietste, distractors: [fietsde, fietsen, fietst], accepted_answers: [{value: fietste, status: correct}], feedback: "The stem *fiets* ends in *s*, so it takes *-te*: *fietste*."}
  nl.a2.unit82.lesson02.exercise02.choose_speelde: {instruction: "Choose the singular regular imperfectum of spelen.", correct_option: speelde, distractors: [speelte, spelen, speelt], accepted_answers: [{value: speelde, status: correct}], feedback: "The stem *speel* does not end in a 't kofschip sound, so it takes *-de*: *speelde*."}
  nl.a2.unit82.lesson02.exercise03.match_forms: {instruction: "Match each infinitive to its singular regular imperfectum.", accepted_answers: [{value: [{left: werken, right: werkte}, {left: fietsen, right: fietste}, {left: maken, right: maakte}, {left: spelen, right: speelde}, {left: leren, right: leerde}, {left: wonen, right: woonde}], status: correct}], feedback: "The final sound of the stem determines *-te* or *-de*."}
  nl.a2.unit82.lesson02.exercise04.order_school: {instruction: "Put the words in order to say 'Every day I cycled to school.' Start with Elke dag.", correct_option: "Elke dag fietste ik naar school", accepted_answers: [{value: "Elke dag fietste ik naar school", status: correct}], feedback: "*Elke dag fietste ik naar school.*"}
  nl.a2.unit82.lesson02.exercise05.complete_worked: {instruction: "Complete the sentence with the singular regular imperfectum of werken.", correct_option: werkte, accepted_answers: [{value: werkte, status: correct}], feedback: "The stem ends in *k*, so the form is *werkte*."}
  nl.a2.unit82.lesson02.exercise06.translate_played: {instruction: "Translate into Dutch. Use the singular regular imperfectum of spelen.", accepted_answers: [{value: "Vroeger speelde ik buiten.", status: correct}, {value: "Ik speelde vroeger buiten.", status: correct}, {value: "Ik speelde vroeger buiten", status: correct}, {value: "Vroeger speelde ik buiten", status: correct}], feedback: "*Vroeger speelde ik buiten.*"}
  nl.a2.unit82.lesson02.exercise07.write_homework: {instruction: "Write in Dutch: 'After school I used to do homework.' Use the singular regular imperfectum of maken.", accepted_answers: [{value: "Na school maakte ik huiswerk.", status: correct}, {value: "Ik maakte na school huiswerk.", status: correct}, {value: "Ik maakte na school huiswerk", status: correct}, {value: "Na school maakte ik huiswerk", status: correct}], feedback: "*Na school maakte ik huiswerk.*"}
  nl.a2.unit82.lesson03.exercise01.choose_plural: {instruction: "Choose the plural regular imperfectum of wonen for wij.", correct_option: woonden, distractors: [woonde, woonten, wonen], accepted_answers: [{value: woonden, status: correct}], feedback: "Plural adds *-n* to *woonde*: *woonden*."}
  nl.a2.unit82.lesson03.exercise02.choose_habit: {instruction: "Choose the sentence that clearly describes a repeated past habit.", correct_option: "Elke zomer logeerden we bij opa en oma.", distractors: ["Nu wonen we in een flat.", "Tegenwoordig werken we in Utrecht.", "De flat is groot."], accepted_answers: [{value: "Elke zomer logeerden we bij opa en oma.", status: correct}], feedback: "*Elke zomer* marks a repeated habit, and *logeerden* is imperfectum."}
  nl.a2.unit82.lesson03.exercise03.match_number: {instruction: "Match each subject and infinitive to the correct regular imperfectum form.", accepted_answers: [{value: [{left: "ik + wonen", right: woonde}, {left: "wij + wonen", right: woonden}, {left: "jij + werken", right: werkte}, {left: "jullie + werken", right: werkten}, {left: "hij + spelen", right: speelde}, {left: "zij + spelen", right: speelden}], status: correct}], feedback: "Singular uses *-te/-de*; plural adds *-n*."}
  nl.a2.unit82.lesson03.exercise04.order_plural: {instruction: "Put the words in order to say 'We often played outside.'", correct_option: "Wij speelden vaak buiten", accepted_answers: [{value: "Wij speelden vaak buiten", status: correct}, {value: "Vaak speelden wij buiten", status: correct}, {value: "Buiten speelden wij vaak", status: correct}], feedback: "*Wij speelden vaak buiten.*"}
  nl.a2.unit82.lesson03.exercise05.complete_logeerden: {instruction: "Complete the sentence with the plural regular imperfectum of logeren.", correct_option: logeerden, accepted_answers: [{value: logeerden, status: correct}], feedback: "*Elke zomer logeerden we bij opa en oma.*"}
  nl.a2.unit82.lesson03.exercise06.translate_plural: {instruction: "Translate into Dutch. Use the plural regular imperfectum of wonen.", accepted_answers: [{value: "Wij woonden in een rustige buurt.", status: correct}, {value: "Vroeger woonden wij in een rustige buurt.", status: correct}, {value: "Vroeger woonden wij in een rustige buurt", status: correct}, {value: "Vroeger woonden we in een rustige buurt.", status: correct}, {value: "Vroeger woonden we in een rustige buurt", status: correct}, {value: "Wij woonden in een rustige buurt", status: correct}, {value: "We woonden in een rustige buurt.", status: correct}, {value: "We woonden in een rustige buurt", status: correct}], feedback: "*Wij woonden in een rustige buurt.*"}
  nl.a2.unit82.lesson03.exercise07.write_habit: {instruction: "Write in Dutch: 'We used to play outside every day.' Use the plural regular imperfectum of spelen.", accepted_answers: [{value: "Wij speelden elke dag buiten.", status: correct}, {value: "Elke dag speelden wij buiten.", status: correct}, {value: "Elke dag speelden wij buiten", status: correct}, {value: "Elke dag speelden we buiten.", status: correct}, {value: "Elke dag speelden we buiten", status: correct}, {value: "Wij speelden elke dag buiten", status: correct}, {value: "We speelden elke dag buiten.", status: correct}, {value: "We speelden elke dag buiten", status: correct}], feedback: "*Wij speelden elke dag buiten.*"}
  nl.a2.unit82.lesson04.exercise01.choose_old_neighbourhood: {instruction: "Choose the Dutch sentence meaning 'I used to live close to school.'", correct_option: "Vroeger woonde ik dicht bij school.", distractors: ["Vroeger woonde ik ver van school.", "Nu woon ik dicht bij school.", "Vroeger werkte ik dicht bij school."], accepted_answers: [{value: "Vroeger woonde ik dicht bij school.", status: correct}], feedback: "*Vroeger woonde ik dicht bij school.*"}
  nl.a2.unit82.lesson04.exercise02.choose_now: {instruction: "Choose the Dutch sentence meaning 'Now I live far from school.'", correct_option: "Nu woon ik ver van school.", distractors: ["Nu woon ik dicht bij school.", "Vroeger woonde ik ver van school.", "Nu werk ik ver van school."], accepted_answers: [{value: "Nu woon ik ver van school.", status: correct}], feedback: "*Nu woon ik ver van school.*"}
  nl.a2.unit82.lesson04.exercise03.match_places: {instruction: "Match each Dutch item to its English meaning.", accepted_answers: [{value: [{left: "dicht bij", right: "close to"}, {left: "ver van", right: "far from"}, {left: "de winkel", right: "the shop"}, {left: "de speeltuin", right: "the playground"}, {left: school, right: school}, {left: "het ziekenhuis", right: "the hospital"}], status: correct}], feedback: "Each left item has one distinct place or distance meaning."}
  nl.a2.unit82.lesson04.exercise04.order_playground: {instruction: "Put the words in order to say 'I always used to play in the playground.' Start with Vroeger.", correct_option: "Vroeger speelde ik altijd in de speeltuin", accepted_answers: [{value: "Vroeger speelde ik altijd in de speeltuin", status: correct}], feedback: "*Vroeger speelde ik altijd in de speeltuin.*"}
  nl.a2.unit82.lesson04.exercise05.complete_fietste: {instruction: "Complete the sentence with the singular regular imperfectum of fietsen.", correct_option: fietste, accepted_answers: [{value: fietste, status: correct}], feedback: "*Elke dag fietste ik naar school.*"}
  nl.a2.unit82.lesson04.exercise06.translate_neighbourhood: {instruction: "Translate into Dutch. Use the singular regular imperfectum of wonen.", accepted_answers: [{value: "Vroeger woonde ik dicht bij de winkel.", status: correct}, {value: "Ik woonde vroeger dicht bij de winkel.", status: correct}, {value: "Ik woonde vroeger dicht bij de winkel", status: correct}, {value: "Vroeger woonde ik dicht bij de winkel", status: correct}], feedback: "*Vroeger woonde ik dicht bij de winkel.*"}
  nl.a2.unit82.lesson04.exercise07.write_contrast: {instruction: "Write one Dutch then-and-now contrast: you used to live close to school; now you live far from school. Use the singular regular imperfectum of wonen, then present tense.", accepted_answers: [{value: "Vroeger woonde ik dicht bij school, nu woon ik ver van school.", status: correct}, {value: "Ik woonde vroeger dicht bij school, nu woon ik ver van school.", status: correct}, {value: "Ik woonde vroeger dicht bij school. Nu woon ik ver van school.", status: correct}, {value: "Vroeger woonde ik dicht bij school, maar nu woon ik ver van school.", status: correct}, {value: "Vroeger woonde ik dicht bij school. Nu woon ik ver van school.", status: correct}], feedback: "*Vroeger woonde ik dicht bij school, nu woon ik ver van school.*"}
  nl.a2.unit82.lesson05.exercise01.read_home: {instruction: "Read the text. Where and with whom did Lotte live when she was young?", correct_option: "In Utrecht with her parents", distractors: ["In Amsterdam with her uncle", "In Egypt with her sisters", "In a hospital with her grandparents"], accepted_answers: [{value: "In Utrecht with her parents", status: correct}], feedback: "The reading says *woonde ze met haar ouders in Utrecht*."}
  nl.a2.unit82.lesson05.exercise02.read_habits: {instruction: "According to the reading, what did Lotte do every day?", correct_option: "She cycled to school", distractors: ["She stayed with her grandparents", "She worked in the hospital", "She lived in an apartment"], accepted_answers: [{value: "She cycled to school", status: correct}], feedback: "*Elke dag fietste ze naar school.*"}
  nl.a2.unit82.lesson05.exercise03.match_reading: {instruction: "Match each reading clue to its unique detail.", accepted_answers: [{value: [{left: "het huis", right: "was small"}, {left: school, right: "was close to home"}, {left: "elke dag", right: "cycled to school"}, {left: "na school", right: "played outside and did homework"}, {left: "elke zomer", right: "stayed with grandpa and grandma"}, {left: nu, right: "lives in an apartment and works in a hospital"}], status: correct}], feedback: "The time clues separate daily and summer habits from the present."}
  nl.a2.unit82.lesson05.exercise04.order_after_school: {instruction: "Put the words in order to describe two past habits after school: start with Na school, first say you played outside, then that you did homework.", correct_option: "Na school speelde ik buiten en maakte ik huiswerk", accepted_answers: [{value: "Na school speelde ik buiten en maakte ik huiswerk", status: correct}], feedback: "*Na school speelde ik buiten en maakte ik huiswerk.*"}
  nl.a2.unit82.lesson05.exercise05.complete_reading: {instruction: "Complete the reading sentence with the singular regular imperfectum of fietsen.", correct_option: fietste, accepted_answers: [{value: fietste, status: correct}], feedback: "*Elke dag fietste ze naar school.*"}
  nl.a2.unit82.lesson05.exercise06.dictation_summer: {instruction: "Type exactly what you hear.", correct_response: "Elke zomer logeerden we bij mijn opa en oma", orthography_strict: true, feedback: "You heard *Elke zomer logeerden we bij mijn opa en oma*."}
  nl.a2.unit82.lesson05.exercise07.dictation_school: {instruction: "Type exactly what you hear.", correct_response: "Vroeger woonde ik dicht bij school", orthography_strict: true, feedback: "You heard *Vroeger woonde ik dicht bij school*."}
  nl.a2.unit82.lesson06.exercise01.listen_where: {instruction: "Listen to the full dialogue. What kind of home did Lotte say she lived in?", correct_option: "A small house", distractors: ["A houseboat", "A farmhouse", "A student room"], accepted_answers: [{value: "A small house", status: correct}], feedback: "Lotte says: *ik woonde met mijn ouders in een klein huis*."}
  nl.a2.unit82.lesson06.exercise02.listen_after_school: {instruction: "Listen to the full dialogue. Which three habits does Lotte name after school?", correct_option: "She cycled home, played outside and did homework", distractors: ["She read books, swam and watched television", "She took the bus, sang and drew", "She walked the dog, danced and listened to music"], accepted_answers: [{value: "She cycled home, played outside and did homework", status: correct}], feedback: "Lotte names *fietste naar huis*, *speelde buiten* and *maakte daarna huiswerk*."}
  nl.a2.unit82.lesson06.exercise03.match_dialogue: {instruction: "Match each dialogue clue to its unique meaning.", accepted_answers: [{value: [{left: "Omars eerste vraag", right: "whether Lotte used to live in Utrecht"}, {left: "Lottes oude woning", right: "a small house"}, {left: "Omars tweede vraag", right: "what Lotte did after school"}, {left: fietsen, right: "cycled home"}, {left: spelen, right: "played outside"}, {left: nu, right: "an apartment and hospital work"}], status: correct}], feedback: "The dialogue moves from the old home to habits and then the present."}
  nl.a2.unit82.lesson06.exercise04.order_lotte: {instruction: "Put the words in order to say that Lotte cycled home first and then played outside.", correct_option: "Ik fietste naar huis en speelde buiten", accepted_answers: [{value: "Ik fietste naar huis en speelde buiten", status: correct}], feedback: "*Ik fietste naar huis en speelde buiten.*"}
  nl.a2.unit82.lesson06.exercise05.complete_work: {instruction: "Complete the sentence with the present tense of werken to describe life now.", correct_option: werk, accepted_answers: [{value: werk, status: correct}], feedback: "*Nu werk ik in het ziekenhuis.*"}
  nl.a2.unit82.lesson06.exercise06.respond_omar: {instruction: "Answer Omar in Dutch: say that you used to play outside. Use the singular regular imperfectum of spelen and begin with Vroeger.", correct_option: "Vroeger speelde ik buiten.", accepted_answers: [{value: "Vroeger speelde ik buiten.", status: correct}, {value: "Vroeger speelde ik buiten", status: correct}], feedback: "*Vroeger speelde ik buiten.*"}
  nl.a2.unit82.lesson06.exercise07.write_then_now: {instruction: "Write four Dutch sentences: (1) you used to live in a small house, (2) every day you cycled to school, (3) after school you played outside, and (4) now you live in an apartment. Use singular regular imperfectum in sentences 1-3 and present tense in sentence 4.", accepted_answers: [{value: "Vroeger woonde ik in een klein huis. Elke dag fietste ik naar school. Na school speelde ik buiten. Nu woon ik in een flat.", status: correct}], feedback: "*Vroeger woonde ik in een klein huis. Elke dag fietste ik naar school. Na school speelde ik buiten. Nu woon ik in een flat.*"}
