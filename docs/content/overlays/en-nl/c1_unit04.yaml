course: {title: "Dutch C1", description: "Advanced Dutch discourse, inference, register, and nuanced argumentation."}
units: {nl.c1.unit04.toegeven_en_wegen: {title: "Concede, qualify, and weigh", description: "Grant a strong objection fairly, narrow its force, answer proportionately, and derive a weighted judgement."}}
lessons:
  nl.c1.unit04.lesson01.echt_toegeven: {title: "Genuinely grant a strong objection"}
  nl.c1.unit04.lesson02.reikwijdte: {title: "Limit the objection's scope"}
  nl.c1.unit04.lesson03.tegenbewijs: {title: "Answer with proportionate counterevidence"}
  nl.c1.unit04.lesson04.afwegen: {title: "Weigh competing considerations"}
  nl.c1.unit04.lesson05.argument_ontleden: {title: "Analyze a subtle argument"}
