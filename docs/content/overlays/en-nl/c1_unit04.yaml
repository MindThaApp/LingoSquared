teaching:
  nl.c1.unit04.lesson01.teach.ik_geef_toe: {title: "I concede that longer opening hours bring extra costs.", gloss: "explicit substantive concession", note: "*Ik geef toe dat...* grants the cost point as true rather than merely mentioning it before dismissal."}
  nl.c1.unit04.lesson01.teach.het_klopt: {title: "It is true that more staff are needed for that.", gloss: "accept factual validity", note: "*Het klopt dat...* validates the opposing premise in a neutral, non-sarcastic way."}
  nl.c1.unit04.lesson01.teach.verdient_gewicht: {title: "That objection deserves serious weight.", gloss: "treat the objection as consequential", note: "*Verdient serieus gewicht* concedes not only truth but relevance to the final decision."}
  nl.c1.unit04.lesson01.teach.geen_schijn: {title: "A real concession precedes the answer", gloss: "Name the objection's strength before countering.", note: "Order matters: granting a valid point after rebutting it sounds cosmetic rather than genuine."}
  nl.c1.unit04.lesson02.teach.dat_geldt_vooral: {title: "That applies mainly when every branch stays open every evening.", gloss: "limit the conditions under which the objection applies", note: "*Geldt vooral wanneer...* preserves the cost concern but confines its strongest force to an expansive version."}
  nl.c1.unit04.lesson02.teach.tot_op_zekere_hoogte: {title: "That is true to a certain extent.", gloss: "limited agreement", note: "*Tot op zekere hoogte* grants part of a claim while signalling that its reach still needs examination."}
  nl.c1.unit04.lesson02.teach.niet_noodzakelijk: {title: "That does not necessarily mean the plan is unaffordable.", gloss: "reject an inevitable inference", note: "*Niet noodzakelijk* challenges the consequence, not the conceded fact that costs exist."}
  nl.c1.unit04.lesson02.teach.begrenzing: {title: "Qualification narrows rather than denies", gloss: "The objection remains valid under fewer conditions.", note: "This is subtler than contradiction: it identifies when the objection becomes decisive."}
  nl.c1.unit04.lesson03.teach.daar_staat_tegenover: {title: "Against that stands the fact that a trial limits costs.", gloss: "introduce a competing consideration", note: "*Daar staat tegenover dat...* answers the concession with a directly relevant counterweight."}
  nl.c1.unit04.lesson03.teach.aantoonbaar_baat: {title: "Students and working people demonstrably benefit from it.", gloss: "evidenced beneficiary claim", note: "*Aantoonbaar* raises the counter from assertion to evidence; *er baat bij hebben* names concrete beneficiaries."}
  nl.c1.unit04.lesson03.teach.desalniettemin: {title: "Nevertheless, its reach justifies a limited trial.", gloss: "counter despite the concession", note: "*Desalniettemin* retains the conceded concern while moving to a proportionate trial, not an unlimited policy."}
  nl.c1.unit04.lesson03.teach.evenredig: {title: "A proportionate counter", gloss: "A limited trial plus demonstrated social benefit answers the cost concern.", note: "The response matches the objection's scale: constrain exposure and show compensating value."}
  nl.c1.unit04.lesson04.teach.enerzijds_anderzijds: {title: "On one hand costs rise; on the other accessibility grows.", gloss: "balanced competing considerations", note: "*Enerzijds ... anderzijds ...* places both considerations visibly on the scale before judgement."}
  nl.c1.unit04.lesson04.teach.weegt_zwaarder: {title: "The societal advantage ultimately carries greater weight.", gloss: "assign greater final force", note: "*Uiteindelijk zwaarder wegen* makes the conclusion comparative rather than pretending the drawback vanished."}
  nl.c1.unit04.lesson04.teach.alles_afwegend: {title: "All things considered, a limited trial is preferable.", gloss: "final judgement after weighing", note: "*Alles afwegend* claims that the conclusion follows from the full balance, not one isolated benefit."}
  nl.c1.unit04.lesson04.teach.weegschaal: {title: "The conclusion comes after the balance", gloss: "Costs, reach, and accessibility are weighed visibly first.", note: "The sequence prevents a predetermined conclusion disguised as analysis."}
  nl.c1.unit04.lesson05.teach.leestekst: {title: "A complete weighted library argument", gloss: "Cost concession → scope limitation → trial and beneficiary evidence → final weighing.", note: "Every move changes the argument: the objection is granted, bounded, answered, and retained in the comparison."}
  nl.c1.unit04.lesson05.teach.stappen: {title: "The argument's four moves", gloss: "concession through qualification and counterevidence to reasoned judgement", note: "*Via* and *naar* present the moves as a logical progression rather than a list of connectors."}
  nl.c1.unit04.lesson06.teach.volledig_betoog: {title: "The assessed subtle argument", gloss: "A sustained paragraph fairly representing costs before preferring a limited trial.", note: "Listen and read for what is granted, where its scope is narrowed, what evidence counters it, and why the final balance follows."}
exercises:
  nl.c1.unit04.lesson01.exercise01.herken_toegeven: {instruction: "What valid opposing point is genuinely granted?", correct_option: "Longer hours create extra costs.", distractors: ["Longer hours cost nothing.", "Libraries should close permanently.", "Students oppose access."], accepted_answers: [{value: "Longer hours create extra costs.", status: correct}], feedback: "*Ik geef toe dat* explicitly grants the cost premise."}
  nl.c1.unit04.lesson01.exercise02.herken_gewicht: {instruction: "What does verdient serieus gewicht add beyond saying the objection exists?", correct_option: "It treats the objection as relevant to the decision.", distractors: ["It dismisses the objection.", "It proves the objection false.", "It changes the subject."], accepted_answers: [{value: "It treats the objection as relevant to the decision.", status: correct}], feedback: "A substantive concession grants practical weight."}
  nl.c1.unit04.lesson01.exercise03.koppel_concessie: {instruction: "Match each Dutch concession element to its precise clue.", pairs: [{left: "geef toe", right: "genuinely acknowledge"}, {left: "ruimere openingstijden", right: "longer public access hours"}, {left: "extra kosten", right: "additional expense"}, {left: meebrengen, right: "cause as a consequence"}, {left: "het klopt", right: "accepts factual validity"}, {left: personeel, right: "staff"}, {left: bezwaar, right: "opposing consideration"}, {left: "verdient serieus gewicht", right: "deserves substantial consideration"}], accepted_answers: [{value: [{left: "geef toe", right: "genuinely acknowledge"}, {left: "ruimere openingstijden", right: "longer public access hours"}, {left: "extra kosten", right: "additional expense"}, {left: meebrengen, right: "cause as a consequence"}, {left: "het klopt", right: "accepts factual validity"}, {left: personeel, right: "staff"}, {left: bezwaar, right: "opposing consideration"}, {left: "verdient serieus gewicht", right: "deserves substantial consideration"}], status: correct}], feedback: "The forms grant truth, relevance, and consequence separately."}
  nl.c1.unit04.lesson01.exercise04.orden_toegeven: {instruction: "Order the exact concession: Ik geef toe dat + ruimere openingstijden + extra kosten meebrengen.", accepted_answers: [{value: "Ik geef toe dat ruimere openingstijden extra kosten meebrengen", status: correct}], feedback: "The verb *meebrengen* closes the subordinate clause."}
  nl.c1.unit04.lesson01.exercise05.vertaal_personeel: {instruction: "Translate with Het klopt dat and subordinate order daarvoor meer personeel nodig is.", accepted_answers: [{value: "Het klopt dat daarvoor meer personeel nodig is", status: correct}], feedback: "The specified frame grants the staffing point."}
  nl.c1.unit04.lesson01.exercise06.spreek_gewicht: {instruction: "Say this as an admission, starting with Ik geef toe dat and ending the clause with meebrengen: Ruimere openingstijden brengen extra kosten mee.", accepted_answers: [{value: "Ik geef toe dat ruimere openingstijden extra kosten meebrengen", status: correct}, {value: "Ik geef toe dat ruimere openingstijden extra kosten mee brengen", status: correct}], feedback: "After dat the verb goes to the end, and brengen ... mee joins into meebrengen: Ik geef toe dat ruimere openingstijden extra kosten meebrengen."}
  nl.c1.unit04.lesson01.exercise07.schrijf_concessie: {instruction: "Rewrite as a factual concession, starting with Het klopt dat and keeping every word of the source in order: Dat bezwaar verdient serieus gewicht.", accepted_answers: [{value: "Het klopt dat dat bezwaar serieus gewicht verdient.", status: correct}], feedback: "In the dat-clause the verb goes last: Het klopt dat dat bezwaar serieus gewicht verdient."}
  nl.c1.unit04.lesson02.exercise01.herken_reikwijdte: {instruction: "How does this sentence qualify the cost concern?", correct_option: "It applies most strongly to opening every branch every evening.", distractors: ["It denies all costs.", "It accepts every possible plan as costly.", "It changes to a staffing topic."], accepted_answers: [{value: "It applies most strongly to opening every branch every evening.", status: correct}], feedback: "*Geldt vooral wanneer* narrows conditions."}
  nl.c1.unit04.lesson02.exercise02.herken_hoogte: {instruction: "What stance does tot op zekere hoogte express?", correct_option: "Partial but real agreement", distractors: ["Total rejection", "Unqualified agreement", "Irony"], accepted_answers: [{value: "Partial but real agreement", status: correct}], feedback: "The phrase grants validity within limits."}
  nl.c1.unit04.lesson02.exercise03.koppel_begrenzing: {instruction: "Match each Dutch qualification element to its clue.", pairs: [{left: "geldt vooral", right: "applies chiefly"}, {left: "elk filiaal", right: "every branch location"}, {left: openblijft, right: "remains open"}, {left: "tot op zekere hoogte", right: "only within a limited degree"}, {left: "niet noodzakelijk", right: "does not inevitably follow"}, {left: onbetaalbaar, right: "too costly to afford"}, {left: beperkt, right: "narrows the scope"}, {left: doorslaggevend, right: "decisive for the judgement"}], accepted_answers: [{value: [{left: "geldt vooral", right: "applies chiefly"}, {left: "elk filiaal", right: "every branch location"}, {left: openblijft, right: "remains open"}, {left: "tot op zekere hoogte", right: "only within a limited degree"}, {left: "niet noodzakelijk", right: "does not inevitably follow"}, {left: onbetaalbaar, right: "too costly to afford"}, {left: beperkt, right: "narrows the scope"}, {left: doorslaggevend, right: "decisive for the judgement"}], status: correct}], feedback: "These forms limit degree, conditions, or inference."}
  nl.c1.unit04.lesson02.exercise04.orden_hoogte: {instruction: "Order the exact limited agreement: Dat is + tot op zekere hoogte + waar.", accepted_answers: [{value: "Dat is tot op zekere hoogte waar", status: correct}], feedback: "The qualifier sits between copula and judgement."}
  nl.c1.unit04.lesson02.exercise05.vertaal_gevolg: {instruction: "Translate with Dat betekent niet noodzakelijk followed by dat het plan onbetaalbaar is.", accepted_answers: [{value: "Dat betekent niet noodzakelijk dat het plan onbetaalbaar is", status: correct}], feedback: "This rejects inevitability, not the conceded cost."}
  nl.c1.unit04.lesson02.exercise06.spreek_reikwijdte: {instruction: "Say this as a scope limit, starting with Dat geldt vooral wanneer and turning the source into a clause with the verb at the end: Elk filiaal blijft elke avond open.", accepted_answers: [{value: "Dat geldt vooral wanneer elk filiaal elke avond openblijft", status: correct}, {value: "Dat geldt vooral wanneer elk filiaal elke avond open blijft", status: correct}], feedback: "After wanneer the verb goes to the end, and blijft ... open joins into openblijft: Dat geldt vooral wanneer elk filiaal elke avond openblijft."}
  nl.c1.unit04.lesson02.exercise07.schrijf_begrenzing: {instruction: "Join these two sentences into one with maar, keeping the first sentence first and every word in order: Dat is tot op zekere hoogte waar. / Het plan is niet noodzakelijk onbetaalbaar.", accepted_answers: [{value: "Dat is tot op zekere hoogte waar, maar het plan is niet noodzakelijk onbetaalbaar.", status: correct}], feedback: "Maar joins two main clauses without changing their word order: Dat is tot op zekere hoogte waar, maar het plan is niet noodzakelijk onbetaalbaar."}
  nl.c1.unit04.lesson03.exercise01.herken_tegenover: {instruction: "What does Daar staat tegenover introduce?", correct_option: "A directly competing cost-limiting consideration", distractors: ["A repetition of the concession", "An unrelated anecdote", "A complete withdrawal"], accepted_answers: [{value: "A directly competing cost-limiting consideration", status: correct}], feedback: "The trial answers the scale of the cost concern."}
  nl.c1.unit04.lesson03.exercise02.herken_baat: {instruction: "Why is aantoonbaar important?", correct_option: "It presents the benefit as evidenced.", distractors: ["It makes the benefit ironic.", "It removes the beneficiaries.", "It means the benefit is impossible."], accepted_answers: [{value: "It presents the benefit as evidenced.", status: correct}], feedback: "The counter is supported, not merely asserted."}
  nl.c1.unit04.lesson03.exercise03.koppel_tegenbewijs: {instruction: "Match each Dutch counterevidence element to its clue.", pairs: [{left: "Daar staat tegenover", right: "introduces a competing consideration"}, {left: proef, right: "limited trial"}, {left: beperkt, right: "keeps within bounds"}, {left: aantoonbaar, right: "supported by evidence"}, {left: "baat bij", right: "benefit from"}, {left: desalniettemin, right: "despite the conceded point"}, {left: rechtvaardigt, right: "provides sufficient grounds for"}, {left: bereik, right: "number or breadth of people reached"}, {left: "maatschappelijk nut", right: "benefit to society"}], accepted_answers: [{value: [{left: "Daar staat tegenover", right: "introduces a competing consideration"}, {left: proef, right: "limited trial"}, {left: beperkt, right: "keeps within bounds"}, {left: aantoonbaar, right: "supported by evidence"}, {left: "baat bij", right: "benefit from"}, {left: desalniettemin, right: "despite the conceded point"}, {left: rechtvaardigt, right: "provides sufficient grounds for"}, {left: bereik, right: "number or breadth of people reached"}, {left: "maatschappelijk nut", right: "benefit to society"}], status: correct}], feedback: "The counter combines limitation, evidence, beneficiaries, and justification."}
  nl.c1.unit04.lesson03.exercise04.orden_tegenover: {instruction: "Order the exact counter: Daar staat tegenover dat + een proef + de kosten beperkt.", accepted_answers: [{value: "Daar staat tegenover dat een proef de kosten beperkt", status: correct}], feedback: "The subordinate verb closes the clause."}
  nl.c1.unit04.lesson03.exercise05.vertaal_baat: {instruction: "Translate with Studenten en werkenden, then hebben er aantoonbaar baat bij.", accepted_answers: [{value: "Studenten en werkenden hebben er aantoonbaar baat bij", status: correct}], feedback: "The pinned order keeps *er* before the evidence adverb."}
  nl.c1.unit04.lesson03.exercise06.spreek_desalniettemin: {instruction: "Say this starting with Desalniettemin, so that the verb comes second and the subject follows it: Het bereik rechtvaardigt een beperkte proef.", accepted_answers: [{value: "Desalniettemin rechtvaardigt het bereik een beperkte proef", status: correct}], feedback: "After a fronted Desalniettemin the verb comes second and the subject follows: Desalniettemin rechtvaardigt het bereik een beperkte proef."}
  nl.c1.unit04.lesson03.exercise07.schrijf_tegenbewijs: {instruction: "Turn this into a counter-consideration, starting with Daar staat tegenover dat and keeping every word of the source in order except the verb, which goes last: Studenten en werkenden hebben er aantoonbaar baat bij.", accepted_answers: [{value: "Daar staat tegenover dat studenten en werkenden er aantoonbaar baat bij hebben.", status: correct}], feedback: "After dat the verb hebben goes to the end: Daar staat tegenover dat studenten en werkenden er aantoonbaar baat bij hebben."}
  nl.c1.unit04.lesson04.exercise01.herken_balans: {instruction: "What does Enerzijds... anderzijds... do?", correct_option: "Places cost and accessibility on opposite sides of the balance", distractors: ["Dismisses both considerations", "States only the conclusion", "Introduces irony"], accepted_answers: [{value: "Places cost and accessibility on opposite sides of the balance", status: correct}], feedback: "Both considerations remain visible."}
  nl.c1.unit04.lesson04.exercise02.herken_oordeel: {instruction: "Which consideration receives greater final weight?", correct_option: "The societal advantage", distractors: ["The financial drawback", "Neither consideration", "Staffing alone"], accepted_answers: [{value: "The societal advantage", status: correct}], feedback: "*Uiteindelijk zwaarder* states the comparative judgement."}
  nl.c1.unit04.lesson04.exercise03.koppel_afweging: {instruction: "Match each Dutch weighing term to its clue.", pairs: [{left: enerzijds, right: "introduces one side of the balance"}, {left: anderzijds, right: "introduces the competing side"}, {left: stijgen, right: "increase"}, {left: groeit, right: "becomes greater"}, {left: toegankelijkheid, right: "ease of access"}, {left: "weegt uiteindelijk zwaarder", right: "has greater force in the final judgement"}, {left: "Alles afwegend", right: "after considering every side"}, {left: voorkeur, right: "preferred choice"}], accepted_answers: [{value: [{left: enerzijds, right: "introduces one side of the balance"}, {left: anderzijds, right: "introduces the competing side"}, {left: stijgen, right: "increase"}, {left: groeit, right: "becomes greater"}, {left: toegankelijkheid, right: "ease of access"}, {left: "weegt uiteindelijk zwaarder", right: "has greater force in the final judgement"}, {left: "Alles afwegend", right: "after considering every side"}, {left: voorkeur, right: "preferred choice"}], status: correct}], feedback: "The vocabulary maps both sides and the resulting preference."}
  nl.c1.unit04.lesson04.exercise04.orden_oordeel: {instruction: "Order the exact judgement: Het maatschappelijke voordeel + weegt uiteindelijk zwaarder.", accepted_answers: [{value: "Het maatschappelijke voordeel weegt uiteindelijk zwaarder", status: correct}], feedback: "*Uiteindelijk* precedes the comparative predicate."}
  nl.c1.unit04.lesson04.exercise05.vertaal_balans: {instruction: "Translate with Enerzijds + V2 stijgen de kosten; then anderzijds + V2 groeit de toegankelijkheid.", accepted_answers: [{value: "Enerzijds stijgen de kosten; anderzijds groeit de toegankelijkheid.", status: correct}], feedback: "Both fronted markers trigger V2."}
  nl.c1.unit04.lesson04.exercise06.spreek_voorkeur: {instruction: "Say this starting with Alles afwegend, so that the verb comes second and the subject follows it: Een beperkte proef verdient de voorkeur.", accepted_answers: [{value: "Alles afwegend verdient een beperkte proef de voorkeur", status: correct}], feedback: "After the fronted Alles afwegend the verb comes second and the subject follows: Alles afwegend verdient een beperkte proef de voorkeur."}
  nl.c1.unit04.lesson04.exercise07.schrijf_afweging: {instruction: "Rewrite starting with Alles afwegend, with the verb second, and add uiteindelijk directly before zwaarder: Het maatschappelijke voordeel weegt zwaarder.", accepted_answers: [{value: "Alles afwegend weegt het maatschappelijke voordeel uiteindelijk zwaarder.", status: correct}], feedback: "After the fronted Alles afwegend the verb weegt comes second, and uiteindelijk sits right before zwaarder: Alles afwegend weegt het maatschappelijke voordeel uiteindelijk zwaarder."}
  nl.c1.unit04.lesson05.exercise01.lees_concessie: {instruction: "Which point does the author genuinely concede?", correct_option: "Longer hours create extra staffing costs that deserve serious weight.", distractors: ["Longer hours have no cost.", "Every branch must open nightly.", "A trial has no beneficiaries."], accepted_answers: [{value: "Longer hours create extra staffing costs that deserve serious weight.", status: correct}], feedback: "The reading grants truth and relevance."}
  nl.c1.unit04.lesson05.exercise02.lees_begrenzing: {instruction: "How does the author limit the conceded cost objection?", correct_option: "It applies especially if every branch opens every evening.", distractors: ["The author denies staffing costs.", "The author abandons the proposal.", "The author calls all costs irrelevant."], accepted_answers: [{value: "It applies especially if every branch opens every evening.", status: correct}], feedback: "The scope, not the truth, is narrowed."}
  nl.c1.unit04.lesson05.exercise03.koppel_stappen: {instruction: "Match each Dutch argumentative element to its precise role.", pairs: [{left: concessie, right: "substantive point granted"}, {left: begrenzing, right: "restriction of scope"}, {left: tegenbewijs, right: "evidence supporting the counter"}, {left: eindoordeel, right: "final reasoned judgement"}, {left: personeelskosten, right: "expense of staffing"}, {left: "centrale bibliotheek", right: "main library branch"}, {left: "financiële nadeel", right: "monetary drawback"}, {left: daarom, right: "marks the inference to the conclusion"}], accepted_answers: [{value: [{left: concessie, right: "substantive point granted"}, {left: begrenzing, right: "restriction of scope"}, {left: tegenbewijs, right: "evidence supporting the counter"}, {left: eindoordeel, right: "final reasoned judgement"}, {left: personeelskosten, right: "expense of staffing"}, {left: "centrale bibliotheek", right: "main library branch"}, {left: "financiële nadeel", right: "monetary drawback"}, {left: daarom, right: "marks the inference to the conclusion"}], status: correct}], feedback: "The analysis distinguishes each move and its content."}
  nl.c1.unit04.lesson05.exercise04.orden_stappen: {instruction: "Order the exact Dutch argument moves: concession, qualification, counterevidence, final judgement.", accepted_answers: [{value: "concessie begrenzing tegenbewijs eindoordeel", status: correct}], feedback: "A fair argument grants before limiting and countering."}
  nl.c1.unit04.lesson05.exercise05.vertaal_eindoordeel: {instruction: "Translate with De maatschappelijke voordelen, then wegen daarom zwaarder dan het financiële nadeel.", accepted_answers: [{value: "De maatschappelijke voordelen wegen daarom zwaarder dan het financiële nadeel", status: correct}], feedback: "*Daarom* links evidence to comparative judgement."}
  nl.c1.unit04.lesson05.exercise06.spreek_stappen: {instruction: "Say this analysis with De tekst beweegt van ... naar ...: The text moves from concessie to eindoordeel.", accepted_answers: [{value: "De tekst beweegt van concessie naar eindoordeel", status: correct}, {value: "De tekst beweegt van concessie naar een gemotiveerd eindoordeel", status: correct}], feedback: "The frame is van ... naar ...: De tekst beweegt van concessie naar eindoordeel (a gemotiveerd eindoordeel is fine too)."}
  nl.c1.unit04.lesson05.exercise07.schrijf_analyse: {instruction: "Write this analysis with De tekst beweegt van ... via ... naar ...: The text moves from begrenzing via tegenbewijs to eindoordeel.", accepted_answers: [{value: "De tekst beweegt van begrenzing via tegenbewijs naar eindoordeel", status: correct}, {value: "De tekst beweegt van begrenzing via tegenbewijs naar een gemotiveerd eindoordeel", status: correct}], feedback: "The frame is van ... via ... naar ...: De tekst beweegt van begrenzing via tegenbewijs naar eindoordeel (a gemotiveerd eindoordeel is fine too)."}
  nl.c1.unit04.lesson06.exercise01.luister_argument: {instruction: "Listen and identify what is conceded, limited, countered, and weighted.", correct_option: "staffing costs → every-branch scope → limited trial and evidenced beneficiaries → societal benefits outweigh cost", distractors: ["benefits denied → all branches close → no evidence → no judgement", "costs dismissed → unlimited opening → anecdote → irony", "conclusion only with no concession"], accepted_answers: [{value: "staffing costs → every-branch scope → limited trial and evidenced beneficiaries → societal benefits outweigh cost", status: correct}], feedback: "The audio preserves the objection while reducing its final weight."}
