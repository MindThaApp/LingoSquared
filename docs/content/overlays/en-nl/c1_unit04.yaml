  nl.c1.unit04.lesson06.exercise03.koppel_letterlijk: {instruction: "Match each Dutch assessment phrase to its argumentative function.", pairs: [{left: "Het klopt", right: "grants factual validity"}, {left: "verdient serieus gewicht", right: "treats the objection substantively"}, {left: "geldt vooral", right: "narrows its scope"}, {left: "Daar staat tegenover", right: "introduces the competing case"}, {left: "aantoonbaar baat", right: "states evidenced benefit"}, {left: "Alles afwegend", right: "signals final balancing"}, {left: "weegt zwaarder", right: "assigns greater final force"}], accepted_answers: [{value: [{left: "Het klopt", right: "grants factual validity"}, {left: "verdient serieus gewicht", right: "treats the objection substantively"}, {left: "geldt vooral", right: "narrows its scope"}, {left: "Daar staat tegenover", right: "introduces the competing case"}, {left: "aantoonbaar baat", right: "states evidenced benefit"}, {left: "Alles afwegend", right: "signals final balancing"}, {left: "weegt zwaarder", right: "assigns greater final force"}], status: correct}], feedback: "Together the phrases realize the literal outcome."}
  nl.c1.unit04.lesson06.exercise04.orden_betoog: {instruction: "Order the four exact Dutch move labels: concessie, begrenzing, tegenbewijs, afweging.", accepted_answers: [{value: "concessie begrenzing tegenbewijs afweging", status: correct}], feedback: "The sequence grants before it limits and answers."}
  nl.c1.unit04.lesson06.exercise05.spreek_beoordeling: {instruction: "Join these two sentences into one with maar, keeping the order of the words: Ik geef toe dat ruimere openingstijden extra kosten meebrengen. / Een proef beperkt de kosten.", accepted_answers: [{value: "Ik geef toe dat ruimere openingstijden extra kosten meebrengen, maar een proef beperkt de kosten", status: correct}, {value: "Ik geef toe dat ruimere openingstijden extra kosten mee brengen, maar een proef beperkt de kosten", status: correct}], feedback: "Maar joins two main clauses without changing the word order: Ik geef toe dat ruimere openingstijden extra kosten meebrengen, maar een proef beperkt de kosten."}
  nl.c1.unit04.lesson06.exercise06.schrijf_beoordeling: {instruction: "Join these two sentences into one with terwijl, keeping the trial sentence first: Een proef beperkt de kosten. / Studenten en werkenden hebben er aantoonbaar baat bij.", accepted_answers: [{value: "Een proef beperkt de kosten, terwijl studenten en werkenden er aantoonbaar baat bij hebben.", status: correct}], feedback: "After terwijl the verb goes to the end: Een proef beperkt de kosten, terwijl studenten en werkenden er aantoonbaar baat bij hebben."}
  nl.c1.unit04.lesson06.exercise07.dictaat_kern: {instruction: "Type exactly what you hear.", correct_response: "Ik geef toe dat ruimere openingstijden extra kosten meebrengen. Toch wegen de maatschappelijke voordelen uiteindelijk zwaarder.", orthography_strict: true, feedback: "The audio contains concession followed by weighted counter-position."}
