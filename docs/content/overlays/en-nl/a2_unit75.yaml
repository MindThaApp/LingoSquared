teaching:
  nl.a2.unit75.lesson01.teach.scherm:
    title: "The screen"
    gloss: "the screen"
    note: "*Het scherm* is a neuter (het) noun."
    example_gloss: "I often look at my screen."
  nl.a2.unit75.lesson01.teach.telefoon_vaak:
    title: "Saying you use your phone often"
    gloss: "I use my phone often."
    note: "*Vaak* (often) typically comes after the object in a simple statement like this one."
  nl.a2.unit75.lesson01.teach.hoe_vaak:
    title: "Asking how often someone uses social media"
    gloss: "How often do you use social media?"
    note: "*Sociale media* is a plural, borrowed-and-adapted term used exactly like in English."

  nl.a2.unit75.lesson02.teach.app:
    title: "The app"
    gloss: "the app"
    note: "*De app* is a common (de) noun, a direct borrowing used unchanged in everyday Dutch."
    example_gloss: "I use an app to chat."
  nl.a2.unit75.lesson02.teach.chatten_vrienden:
    title: "Saying you chat with friends"
    gloss: "I often chat with friends on my phone."
    note: "*Chatten* (to chat) is a borrowed verb, conjugated regularly like a native Dutch verb."
  nl.a2.unit75.lesson02.teach.welke_apps:
    title: "Asking which apps someone uses most"
    gloss: "Which apps do you use most?"
    note: "*Het meest* (the most) is the superlative form used here to ask about the top choice."

  nl.a2.unit75.lesson03.teach.schermtijd:
    title: "Screen time"
    gloss: "screen time"
    note: "*De schermtijd* is a common (de) noun, a compound of *scherm* (screen) and *tijd* (time)."
    example_gloss: "I have too much screen time this week."
  nl.a2.unit75.lesson03.teach.mening_schermtijd:
    title: "Giving an opinion about your own screen time"
    gloss: "I think I have too much screen time."
    note: "*Ik vind dat ...* (I think that ...) is the standard way to introduce an opinion with a following clause."
  nl.a2.unit75.lesson03.teach.slecht_voor_ogen:
    title: "Saying something isn't good for your eyes"
    gloss: "It's not good for your eyes."
    note: "*Je ogen* (your eyes) uses the informal possessive *je*, matching this unit's informal register."

  nl.a2.unit75.lesson04.teach.gewoonte:
    title: "The habit"
    gloss: "the habit"
    note: "*De gewoonte* is a common (de) noun."
    example_gloss: "It's a bad habit to keep checking your phone."
  nl.a2.unit75.lesson04.teach.mening_minder:
    title: "Giving an opinion with volgens mij"
    gloss: "In my opinion, you should spend less time on your phone."
    note: "*Volgens mij* (in my opinion, literally 'according to me') is another standard way to introduce a personal opinion, alongside *ik vind dat*."
  nl.a2.unit75.lesson04.teach.mee_eens:
    title: "Agreeing with someone's opinion"
    gloss: "I agree with that."
    note: "*Het ergens mee eens zijn* (to agree with something) is the set phrase; *daar* refers back to what was just said."

  nl.a2.unit75.lesson05.teach.blog:
    title: "Reading a blog post about screen time"
    gloss: >-
      Many people use their phone more than four hours a day. Social
      media is fun, but too much screen time isn't healthy. Try
      spending an hour every evening without your phone. That's good
      for your eyes and your sleep.
    note: "*Probeer ... door te brengen* (try to spend ...) uses *proberen* + *te* + infinitive, a common construction for suggestions."

  nl.a2.unit75.lesson06.teach.omar_vraag:
    title: "Omar asks how often"
    gloss: "Omar: How often do you use social media, Lotte?"
  nl.a2.unit75.lesson06.teach.lotte_drie_uur:
    title: "Lotte answers with a number"
    gloss: "Lotte: Actually pretty often. I do look at my screen about three hours a day."
  nl.a2.unit75.lesson06.teach.omar_niet_te_veel:
    title: "Omar questions the amount"
    gloss: "Omar: That's quite a lot. Don't you think that's too much?"
  nl.a2.unit75.lesson06.teach.lotte_te_veel:
    title: "Lotte agrees it's too much"
    gloss: "Lotte: Yes, I actually think it's too much. I want to spend less time on my phone."
  nl.a2.unit75.lesson06.teach.omar_wegleggen:
    title: "Omar suggests putting the phone away"
    gloss: "Omar: Maybe you could put your phone away in the evenings."
  nl.a2.unit75.lesson06.teach.lotte_goed_idee:
    title: "Lotte agrees to try it"
    gloss: "Lotte: Good idea. I'll try that starting today."
  nl.a2.unit75.lesson06.teach.grammar_vinden_dat:
    title: "Third person: vindt/heeft/zij/haar"
    gloss: "Lotte thinks she has too much screen time. She wants to spend less time on her phone."
    note: "*Vindt* and *heeft* are the third-person singular forms of *vinden* (to think/find) and *hebben* (to have); *zij* (she) and *haar* (her) are the matching third-person feminine pronouns, used here to summarize Lotte's own words in the third person."

