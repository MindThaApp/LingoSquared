review:
  status: reviewed
  required_next_reviewer: ramin_native_pass
  notes: >-
    Overlay for nl's eighth B1 unit, authored alongside the realization,
    no sibling-direction file (nl-en) consulted. English speakers' real
    risk here: English "if I had more time, I would study" and "if I had
    known, I would have gone" both use "would," which doesn't warn a
    learner that Dutch's past-unreal conditional (lesson03) commonly uses
    a DOUBLE PLUPERFECT (*was ... gegaan*, not *zou ... gegaan zijn*) in
    ordinary spoken register -- flagged explicitly in lesson03's grammar
    note as the single highest-risk point in this unit, since an English
    speaker's instinct is to reach for "would have" (*zou ... hebben/
    zijn*) every time, which is a real but more formal/written Dutch
    alternative, not the everyday spoken form taught here. Also flagged:
    English doesn't mark real vs. unreal conditions with different verb
    forms in the if-clause the way Dutch does (English "if it rains" vs
    Dutch's true present tense *regent*, contrasted with English "if I
    had" vs Dutch's genuine simple past *had* for the counterfactual) --
    an English speaker can produce a grammatically fine-sounding English
    sentence while picking the wrong Dutch tense pairing. Fresh-context
    review 2026-07-11: instructions/distractors/accepted_answers verified
    against the realization; word_order accepted_answers correctly
    comma-free while translation answers keep the comma; listen_select
    distractors are minimal pairs; matching_pairs keys aligned. Two
    native-judgment flags recorded in the realization's review notes
    (ramin_native_pass): the lesson05 "Nu heeft Lotte meer tijd" +
    counterfactual logical tension, and the lesson01 recognize_als
    "when"-distractor polysemy. No objective grading bugs.

course:
  title: Dutch B1
  description: >-
    Intermediate Dutch: expressing a real/possible future condition with
    *als* + present tense, an unreal present condition with *als* + past
    tense paired with *zou*, and an unreal past condition with a double
    pluperfect.

units:
  nl.b1.unit08.reele_en_irreele_situaties:
    title: "Real and Unreal Situations"
    description: Express a real/possible future condition, an unreal present condition, and an unreal past condition, each with a matching *als*-clause and result clause.

