      Dit: "this"
      weekend: "weekend"
      willen: "want to"
      park: "park"
      wel: "does (emphatic — it *does* rain)"
      regent: "rains (from *regenen*)"
      blijven: "stay"
      thuis: "at home"
      kijken: "watch"
      film: "movie"

