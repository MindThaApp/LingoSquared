    note: "An unreal/counterfactual PRESENT condition switches the *als*-clause to simple past (*had*, not *heb*) and the result clause to *zou* + infinitive -- a genuinely different tense pairing from lesson01's real condition, even though English \"would\" doesn't distinguish real from unreal as clearly."

