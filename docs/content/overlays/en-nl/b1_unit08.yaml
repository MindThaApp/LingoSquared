    title: "Reading: Sara's party"
    gloss: "Last year Sara had a party, but Lotte didn't hear about it. If she had known earlier, she would have gone to the party. Now Lotte has more time. If she had more time, she would study Dutch. This weekend, Lotte and Omar want to go to the park if it doesn't rain. If it does rain, they'll stay home and watch a movie."
