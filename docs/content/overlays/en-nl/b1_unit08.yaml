    title: "If it doesn't rain tomorrow, we're going to the park."
    gloss: "If it doesn't rain tomorrow, we're going to the park."
    note: "A real/possible future condition uses present tense in BOTH the *als*-clause and the result clause -- *regent* and *gaan* are both simple present, even though the whole sentence refers to tomorrow. Since the *als*-clause comes first, the result clause inverts to verb-second: *gaan we*, not *we gaan*."

