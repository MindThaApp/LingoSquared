course:
  title: "Dutch A1"
  description: "Beginner Dutch for asking about prices and quantities and making a simple purchase at a market."

units:
  nl.a1.unit07.shopping: {title: "Shopping at the market"}

lessons:
  nl.a1.unit07.lesson01.op_de_markt: {title: "At the market"}
  nl.a1.unit07.lesson02.prijs_vragen: {title: "Asking the price"}
  nl.a1.unit07.lesson03.hoeveelheden: {title: "Choosing quantities"}
  nl.a1.unit07.lesson04.prijskaartjes: {title: "Reading price labels"}
  nl.a1.unit07.lesson05.kopen_en_betalen: {title: "Buying and paying"}
  nl.a1.unit07.lesson06.marktgesprek: {title: "A purchase at the market"}

teaching:
  nl.a1.unit07.lesson01.teach.markt_winkel_kraam: {title: "Market, shop, stall", gloss: "the market, the shop, the stall", note: "*De markt* can mean a market in general or a regular outdoor market. *De winkel* is a shop or store. A *kraam* is a stall at an outdoor market.", example_gloss: ["I'm going to the market.", "I'm going to the shop.", "The stall sells apples."]}
  nl.a1.unit07.lesson01.teach.appels_peren_tomaten_paprikas: {title: "Apples, pears, tomatoes, peppers", gloss: "apples, pears, tomatoes, peppers", note: "The singular is *appel*; the plural is *appels*. The singular is *peer*; the plural is *peren*. The singular is *tomaat*; the plural is *tomaten*. In Dutch, *paprika* means a bell pepper; the written plural is *paprika's*.", example_gloss: ["I would like apples.", "I would like pears.", "I would like tomatoes.", "I would like peppers."]}

  nl.a1.unit07.lesson02.teach.kilo: {title: "A kilo", gloss: "a kilo", note: "*Een kilo* is one kilogram.", example_gloss: "I want a kilo of apples."}
  nl.a1.unit07.lesson02.teach.per_kilo: {title: "Per kilo", gloss: "per kilo", note: "Market labels often give a price per kilo."}
  nl.a1.unit07.lesson02.teach.ask_apples: {title: "How much is a kilo of apples?", gloss: "How much does a kilo of apples cost?", note: "*Hoeveel kost ...?* asks for the price. Here the thing that costs something is *een kilo*, so use singular *kost*."}
  nl.a1.unit07.lesson02.teach.answer_apples: {title: "A kilo of apples costs €2.50", gloss: "A kilo of apples costs €2.50.", note: "Dutch prices use a decimal comma: €2,50."}
  nl.a1.unit07.lesson02.teach.spoken_price: {title: "Two euros fifty", gloss: "€2.50 — two euros fifty", note: "€2,50 is commonly said *twee euro vijftig*, without *en* or *cent*."}

  nl.a1.unit07.lesson03.teach.gram_pond_stuk_stuks: {title: "Grams, a pound, one item, two items", gloss: "one hundred grams, a pound = 500 grams, one item, two items", note: "After a number, Dutch uses *gram* here, not *grammen*. In everyday Dutch, *een pond* means 500 grams — an older informal term, not an official metric unit (an English pound is about 454 grams). *Per stuk* means each item has its own price; after numbers above one, use *stuks* when stating a count by itself, as in *twee stuks*.", example_gloss: ["I want 100 grams of cheese.", "A pound of apples, please.", "May I have one, please?", "I would like two, please."]}
  nl.a1.unit07.lesson03.teach.how_much: {title: "How much would you like?", gloss: "How much would you like?", note: "The vendor uses polite *u*. *Hoeveel* can ask about either a weight or a count."}
  nl.a1.unit07.lesson03.teach.pond_tomatoes: {title: "A pound of tomatoes, please", gloss: "A pound (500 g) of tomatoes, please.", note: "This is a complete, natural short answer when a vendor asks *Hoeveel wilt u?*"}

  nl.a1.unit07.lesson04.teach.prijskaartje: {title: "Price label", gloss: "the price label", note: "*Prijskaartje* is written as one word. Learn the whole word here.", example_gloss: "The price label says €2.50."}
  nl.a1.unit07.lesson04.teach.market_labels: {title: "Market price labels", gloss: "Apples: €2.50 per kilo. Pears: €3.00 per kilo. Tomatoes: €2.00 per kilo. Peppers: €1.00 each.", note: "Read *per kilo* as 'per kilo' and *per stuk* as 'per item'. Dutch labels use a comma in prices."}

  nl.a1.unit07.lesson05.teach.what_would_you_like: {title: "What can I get you?", gloss: "What would you like?", note: "*Wat mag het zijn?* is a common, friendly question from a market vendor or shop worker."}
  nl.a1.unit07.lesson05.teach.take_pears: {title: "Then I'll take a kilo of pears", gloss: "Then I'll take a kilo of pears, please.", note: "*Dan neem ik ...* is a natural way to decide what to buy after hearing the price."}
  nl.a1.unit07.lesson05.teach.anything_else: {title: "Anything else?", gloss: "Anything else?", note: "A common short follow-up from a vendor."}
  nl.a1.unit07.lesson05.teach.no_thanks: {title: "No, thank you", gloss: "No, thank you.", note: "*Dank u* matches the polite *u* register used with the vendor."}
  nl.a1.unit07.lesson05.teach.total: {title: "That comes to €3.00", gloss: "That comes to €3.00 — three euros.", note: "*Dat is dan ...* is a common way for a vendor to state the total. The written price €3,00 is spoken as *drie euro*."}
  nl.a1.unit07.lesson05.teach.pin: {title: "Can I pay by card?", gloss: "Can I pay by card?", note: "*Pinnen* is the everyday Dutch verb for paying by debit or credit card at a terminal."}

  nl.a1.unit07.lesson06.teach.opening: {title: "Greeting and asking the price", gloss: "Vendor: Good afternoon. What can I get you? Lotte: Good afternoon. How much is a kilo of apples?", note: "This is a friendly, polite exchange between a customer and a vendor."}
  nl.a1.unit07.lesson06.teach.purchase: {title: "Choosing the quantity", gloss: "Vendor: Two euros fifty per kilo. Lotte: Then I'll take a kilo, please.", note: "Once apples are understood from the previous turn, Lotte can naturally say just *een kilo*."}
  nl.a1.unit07.lesson06.teach.payment: {title: "Paying by card", gloss: "Vendor: That comes to two euros fifty. Lotte: Can I pay by card? Vendor: Yes, of course.", note: "*Kan ik pinnen?* is the normal practical question at the point of payment."}
  nl.a1.unit07.lesson06.teach.closing: {title: "Closing the exchange", gloss: "Lotte: Thank you. Goodbye! Vendor: Goodbye!", note: "*Tot ziens* is suitable for closing this polite service exchange."}

exercises:
  nl.a1.unit07.lesson01.exercise01.choose_markt:
    instruction: "Choose the Dutch word for 'market'."
    correct_option: "de markt"
    distractors: ["de winkel", "de kraam", "de prijs"]
    accepted_answers: [{value: "de markt", status: correct}]
    feedback: "De markt means the market."
  nl.a1.unit07.lesson01.exercise02.choose_appels:
    instruction: "Choose the Dutch word for 'apples'."
    correct_option: appels
    distractors: [peren, tomaten, "paprika's"]
    accepted_answers: [{value: appels, status: correct}]
    feedback: "Appels means apples."
  nl.a1.unit07.lesson01.exercise03.listen_appels:
    instruction: "Listen and choose what you hear."
    correct_option: apples
    distractors: [pears, tomatoes, peppers]
    accepted_answers: [{value: apples, status: correct}]
    feedback: "Appels means apples."
  nl.a1.unit07.lesson01.exercise04.match_produce:
    instruction: "Match each Dutch word to its English meaning."
    accepted_answers:
      - value: [{left: appels, right: apples}, {left: peren, right: pears}, {left: tomaten, right: tomatoes}, {left: "paprika's", right: peppers}]
        status: correct
    feedback: "Appels, peren, tomaten and paprika's are apples, pears, tomatoes and peppers."
  nl.a1.unit07.lesson01.exercise05.listen_type_tomaten:
    instruction: "Listen and type what you hear."
    accepted_answers: [{value: tomaten, status: correct}]
    feedback: "Tomaten means tomatoes."
  nl.a1.unit07.lesson01.exercise06.translate_kraam:
    instruction: "Translate into Dutch: the stall."
    accepted_answers: [{value: "de kraam", status: correct}]
    feedback: "De kraam means the stall."

  nl.a1.unit07.lesson02.exercise01.choose_price_question:
    instruction: "Choose the question that asks the price of a kilo of apples."
    correct_option: "Hoeveel kost een kilo appels?"
    distractors: ["Hoeveel wilt u?", "Een kilo appels, alstublieft.", "Waar is de markt?"]
    accepted_answers: [{value: "Hoeveel kost een kilo appels?", status: correct}]
    feedback: "Hoeveel kost een kilo appels? asks how much a kilo of apples costs."
  nl.a1.unit07.lesson02.exercise02.listen_price_question:
    instruction: "Listen and choose what the customer asks."
    correct_option: "How much is a kilo of apples?"
    distractors: ["How much is a kilo of pears?", "How many apples would you like?", "Where is the apple stall?"]
    accepted_answers: [{value: "How much is a kilo of apples?", status: correct}]
    feedback: "Hoeveel kost een kilo appels?"
  nl.a1.unit07.lesson02.exercise03.read_price_answer:
    instruction: "Read the sentence and choose the price of one kilo of apples."
    correct_option: "€2,50"
    distractors: ["€2,00", "€3,00", "€5,20"]
    accepted_answers: [{value: "€2,50", status: correct}]
    feedback: "Een kilo appels kost €2,50."
  nl.a1.unit07.lesson02.exercise04.order_price_question:
    instruction: "Put the words in order to ask how much a kilo of apples costs."
    correct_option: "Hoeveel kost een kilo appels"
    accepted_answers: [{value: "Hoeveel kost een kilo appels", status: correct}]
    feedback: "Hoeveel kost een kilo appels?"
  nl.a1.unit07.lesson02.exercise05.listen_order_price:
    instruction: "Listen and put the words in the order you hear."
    correct_option: "Een kilo appels kost twee euro vijftig"
    accepted_answers: [{value: "Een kilo appels kost twee euro vijftig", status: correct}]
    feedback: "Een kilo appels kost twee euro vijftig."
  nl.a1.unit07.lesson02.exercise06.speak_price_question:
    instruction: "Ask this question in Dutch."
    accepted_answers:
      - {value: "Hoeveel kost een kilo appels", status: correct}
      - {value: "Hoeveel kost een kilo appels?", status: correct}
    feedback: "Hoeveel kost een kilo appels?"

  nl.a1.unit07.lesson03.exercise01.choose_pond:
    instruction: "Choose the Dutch market quantity equal to 500 grams."
    correct_option: "een pond"
    distractors: ["een kilo", "honderd gram", "een stuk"]
    accepted_answers: [{value: "een pond", status: correct}]
    feedback: "In everyday Dutch, een pond means 500 grams."
  nl.a1.unit07.lesson03.exercise02.choose_stuks:
