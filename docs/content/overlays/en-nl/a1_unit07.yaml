    correct_option: "Twee stuks alstublieft"
    accepted_answers: [{value: "Twee stuks alstublieft", status: correct}]
    feedback: "Twee stuks, alstublieft."
  nl.a1.unit07.lesson03.exercise06.respond_quantity:
    instruction: "The vendor asks how much you want. Request 500 grams of tomatoes politely."
    accepted_answers:
      - {value: "Een pond tomaten, alstublieft", status: correct}
      - {value: "Een pond tomaten alstublieft", status: correct}
      - {value: "een pond tomaten, alstublieft", status: correct}
      - {value: "een pond tomaten alstublieft", status: correct}
    feedback: "Een pond tomaten, alstublieft."

  nl.a1.unit07.lesson04.exercise01.read_apples:
    instruction: "Read the market labels. How much is a kilo of apples?"
    correct_option: "€2,50"
    distractors: ["€3,00", "€2,00", "€1,00"]
    accepted_answers: [{value: "€2,50", status: correct}]
    feedback: "A kilo of apples costs €2,50."
  nl.a1.unit07.lesson04.exercise02.read_pears:
    instruction: "Read the market labels. How much is a kilo of pears?"
    correct_option: "€3,00"
    distractors: ["€2,50", "€2,00", "€1,00"]
    accepted_answers: [{value: "€3,00", status: correct}]
