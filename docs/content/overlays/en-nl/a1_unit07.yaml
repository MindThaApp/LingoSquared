  nl.a1.unit07.lesson04.exercise04.match_labels:
    instruction: "Match each item to its complete price label."
    accepted_answers:
      - value: [{left: Appels, right: "€2,50 per kilo"}, {left: Peren, right: "€3,00 per kilo"}, {left: Tomaten, right: "€2,00 per kilo"}, {left: "Paprika's", right: "€1,00 per stuk"}]
        status: correct
    feedback: "Each item has a different complete price label."
  nl.a1.unit07.lesson04.exercise05.write_label_answer:
    instruction: "Using the label, write in Dutch: one kilo of pears, €3.00."
    accepted_answers:
      - {value: "een kilo peren €3,00", status: correct}
      - {value: "Een kilo peren €3,00", status: correct}
