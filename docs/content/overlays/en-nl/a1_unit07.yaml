    accepted_answers: [{"value": [{"left": "een kilo", "right": "1 kg"}, {"left": "een pond", "right": "500 g"}, {"left": "honderd gram", "right": "100 g"}, {"left": "een stuk", "right": "one item"}, {"left": "twee stuks", "right": "two items"}], "status": "correct"}]
    feedback: "Een kilo is 1 kg; een pond is 500 g; honderd gram is 100 g; een stuk is one item."
  nl.a1.unit07.lesson03.exercise05.listen_order_stuks:
