    - Это вокзал.
  hi.a1.unit08.lesson01.teach.yahan_wahan:
    title: Здесь, там
    gloss: здесь, там
    note: Основная пара слов, чтобы указать, где что находится.
    example_gloss:
    - Школа здесь.
    - Банк там.
  hi.a1.unit08.lesson01.teach.school_kahan_hai:
    title: Где школа?
    gloss: Где школа?
    note: Снова *kahaan* («где»), впервые встретившееся в уроке 1, но теперь вопрос о месте, а не о происхождении человека.
  hi.a1.unit08.lesson01.teach.school_yahan_hai:
    title: Школа здесь
    gloss: Школа здесь.
    note: Пример ответа со словом *yahaan*.
  hi.a1.unit08.lesson01.teach.bank_kahan_hai:
    title: Где банк?
    gloss: Где находится банк?
    note: Тот же вопрос, но о другом месте.
  hi.a1.unit08.lesson01.teach.bank_wahan_hai:
    title: Банк там
