    - Это школа.
  hi.a1.unit08.lesson01.teach.aspatal_bank:
    title: Больница, банк
    gloss: больница, банк
    note: Ещё два распространённых места, которые может понадобиться найти в районе.
    example_gloss:
    - Это больница.
    - Это банк.
  hi.a1.unit08.lesson01.teach.park_station:
    title: Парк, вокзал
