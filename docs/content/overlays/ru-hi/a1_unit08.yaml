    note: Пример ответа со словом *wahaan*.
  hi.a1.unit08.lesson02.teach.paas:
    title: Близко
    gloss: около, поблизости от
    note: 'Здесь слово вводится формально впервые: раньше оно встречалось только в примерах урока 2 (*mere paas*, «у меня есть», буквально «возле меня») и не разбиралось как отдельное слово.'
    example_gloss: Банк рядом.
  hi.a1.unit08.lesson02.teach.door:
    title: Далеко
    gloss: далеко
    note: Противоположность *paas*.
    example_gloss: Вокзал далеко.
  hi.a1.unit08.lesson02.teach.ke_paas_note:
    title: Ke paas
    gloss: '''Ke paas'' означает «рядом с каким-то местом», например ''school bank ke paas hai'' (школа рядом с банком). Это тот же ''paas'', что раньше встречался в ''mere paas'' («у меня есть»), но там он означал «в моём владении», а здесь — «поблизости»: одно слово, два разных употребления.'
    note: Новый послелог, образованный от уже знакомого слова; его прежнее значение отмечено отдельно, чтобы не путать два употребления.
    target_text: '''के पास'' का मतलब है किसी जगह के नज़दीक -- जैसे ''बैंक स्कूल के पास है''। यह वही ''पास'' है जो पहले ''मेरे पास'' (मेरे पास एक किताब है) में आया था, पर वहाँ इसका मतलब था ''मेरे स्वामित्व में'' (у меня есть), और यहाँ इसका मतलब है ''नज़दीक'' (рядом) -- एक ही शब्द, दो अलग इस्तेमाल।'
  hi.a1.unit08.lesson02.teach.school_bank_ke_paas_hai:
    title: Школа рядом с банком
    gloss: Школа рядом с банком.
    note: Пример предложения с *ke paas*.
  hi.a1.unit08.lesson02.teach.samne_peeche:
    title: Перед, позади
    gloss: напротив / перед, позади
    note: Вторая пара слов для обозначения места; они тоже употребляются с *ke*.
    example_gloss:
    - Больница напротив вокзала.
    - Парк позади школы.
  hi.a1.unit08.lesson02.teach.samne_peeche_note:
    title: Samne и peeche
    gloss: '''Samne'' и ''peeche'', как и ''paas'', употребляются с ''ke'' — и они противоположны друг другу: ''paark school ke peeche hai'' и ''school paark ke samne hai'' описывают одно и то же расположение, только с разных сторон.'
    note: Один и тот же факт, выраженный двумя способами, — полезное правило о том, как связаны эти два слова.
  hi.a1.unit08.lesson02.teach.school_park_ke_samne_hai:
    title: Школа напротив парка
    gloss: Школа напротив парка.
    note: Это тот же факт, но с другой стороны, как в *paark school ke peeche hai* выше.
  hi.a1.unit08.lesson03.teach.dakghar:
    title: Почта
    gloss: почта
    note: Новое привычное место для заключительного диалога этого раздела.
    example_gloss: Почта рядом с банком.
  hi.a1.unit08.lesson03.teach.dakghar_kahan_hai:
    title: Где почта?
    gloss: Где почта?
    note: Открывает заключительный диалог этого раздела.
  hi.a1.unit08.lesson03.teach.dialogue.line01:
    title: Арджун спрашивает про почту
    gloss: Арджун спрашивает Прию, где почта.
    note: Повторяет начальную фразу этого урока.
  hi.a1.unit08.lesson03.teach.dialogue.line02:
    title: Прия отвечает
    gloss: Прия говорит, что почта рядом с банком.
    note: Повторяет *ke paas* из урока 2.
  hi.a1.unit08.lesson03.teach.dialogue.line03:
    title: Арджун спрашивает про больницу
    gloss: Арджун говорит «понятно» и спрашивает, где больница.
    note: Повторяет *achchha* («хорошо», «понятно») из предыдущих разделов.
  hi.a1.unit08.lesson03.teach.dialogue.line04:
    title: Прия отвечает
    gloss: Прия говорит, что больница напротив вокзала.
    note: Повторяет *ke samne* из урока 2.
  hi.a1.unit08.lesson03.teach.dialogue.line05:
    title: Арджун спрашивает, далеко ли это
    gloss: 'Арджун спрашивает: вокзал далеко?'
    note: Повторяет *door* из урока 2.
  hi.a1.unit08.lesson03.teach.dialogue.line06:
    title: Прия подтверждает и противопоставляет
    gloss: 'Прия говорит: да, немного далеко, а банк рядом.'
    note: Вводит *thoda* («немного»); сказанное согласуется с тем, что вокзал далеко, а банк рядом.
  hi.a1.unit08.lesson03.teach.dialogue.line07:
    title: Арджун спрашивает про парк
    gloss: Арджун говорит «хорошо» и спрашивает, где парк.
  hi.a1.unit08.lesson03.teach.dialogue.line08:
    title: Прия отвечает
    gloss: Прия говорит, что парк позади школы.
    note: Повторяет *ke peeche* из урока 2.
  hi.a1.unit08.lesson03.teach.dialogue.line09:
    title: Арджун делает вывод
    gloss: 'Арджун говорит: значит, школа напротив парка!'
    note: Вводит *to* («значит», «тогда») и связывает этот факт с грамматической заметкой урока 2 о *samne* и *peeche*.
  hi.a1.unit08.lesson03.teach.dialogue.line10:
    title: Прия подтверждает
    gloss: 'Прия говорит: да, всё верно!'
    note: Вводит *sahi* («верно», «правильно»).
  hi.a1.unit08.lesson03.teach.dialogue.line11:
    title: Арджун благодарит Прию
    gloss: 'Арджун говорит: большое спасибо, Прия!'
    note: Повторяет *bahut* («очень», «много») и *shukriya* из предыдущих разделов.
  hi.a1.unit08.lesson03.teach.dialogue.line12:
    title: Прия прощается
    gloss: 'Прия говорит: не за что! Увидимся.'
    note: Повторяет стандартные заключительные фразы курса из предыдущих разделов.
