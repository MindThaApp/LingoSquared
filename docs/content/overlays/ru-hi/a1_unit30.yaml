teaching:
  hi.a1.unit30.lesson01.teach.parhna_kasrat_karna:
    title: Чтение, спорт, готовка
    gloss: читать, заниматься спортом, готовить
    note: 'Хобби в хинди называют глаголом на *-ना*: *पढ़ना*, *कसरत करना* и *खाना बनाना* («читать», «заниматься спортом», «готовить»).'
    example_gloss:
    - Мне нравится читать книгу.
    - По субботам я занимаюсь спортом.
    - Мне нравится готовить для друзей.
  hi.a1.unit30.lesson01.teach.khalee_samay:
    title: Свободное время
    gloss: свободное время
    note: '*खाली समय* («свободное время») — ключевое выражение для разговора о хобби, а *में* значит «в»: *खाली समय में*.'
    example_gloss: В свободное время я люблю читать.
  hi.a1.unit30.lesson01.teach.mujhe_khalee_samay:
    title: Как сказать, чем занимаешься в свободное время
    gloss: В свободное время я люблю читать.
    note: '*मुझे ... पढ़ना पसंद है* («мне нравится читать») — так в хинди говорят «я люблю читать»; *मुझे* показывает, кому нравится.'
  hi.a1.unit30.lesson02.teach.sangeet_sunna_chitr:
    title: Музыка, рисование, видеоигры
    gloss: слушать музыку, рисовать, играть в видеоигры
    note: 'Ещё три хобби: *संगीत सुनना*, *चित्र बनाना* и *गेम खेलना*; *गेम* — заимствование из английского, как и русское «гейм».'
    example_gloss:
    - Я люблю слушать музыку.
    - Я часто рисую.
    - Я люблю играть в видеоигры с друзьями.
  hi.a1.unit30.lesson02.teach.mujhe_sangeet_sunna:
    title: Говорим, что любим слушать музыку
    gloss: Я люблю слушать музыку.
    note: 'После *संगीत सुनना* («слушать музыку») не нужно никакого дополнительного слова: дополнение стоит прямо перед глаголом.'
  hi.a1.unit30.lesson02.teach.mujhe_doston_ke:
    title: Говорим, что любим играть в видеоигры с друзьями
    gloss: Я люблю играть в видеоигры с друзьями.
    note: В *दोस्तों के साथ* («с друзьями») слово *दोस्त* стоит в косвенном падеже множественного числа (*दोस्तों*), потому что оно стоит перед *के साथ*.
  hi.a1.unit30.lesson03.teach.hamesha_aksar_kabheekbhee:
    title: Всегда, часто, иногда, никогда
    gloss: всегда, часто, иногда, никогда
    note: Слова частоты, такие как *हमेशा*, *अक्सर*, *कभी-कभी* и *कभी नहीं*, обычно стоят перед глаголом; *कभी नहीं* значит «никогда».
    example_gloss:
    - Я всегда занимаюсь спортом по субботам.
    - Я часто читаю книгу.
    - Иногда я рисую.
    - Я никогда не играю в видеоигры.
  hi.a1.unit30.lesson03.teach.har_hafte_har:
    title: Каждую неделю, каждые выходные
    gloss: каждую неделю, каждые выходные
    note: '*हर* («каждый») никогда не изменяется, и слово времени после него остаётся в простой форме: *हर हफ़्ते*, *हर वीकेंड*.'
    example_gloss:
    - Я каждую неделю готовлю для друзей.
    - Я занимаюсь спортом каждые выходные.
  hi.a1.unit30.lesson03.teach.har_hafte_har_2:
    title: हर не изменяется
    gloss: Каждую неделю, каждые выходные.
    note: '*हर* не меняется, какое бы существительное ни шло после него, поэтому выбирать форму не нужно: *हर हफ़्ते*, *हर वीकेंड*.'
  hi.a1.unit30.lesson03.teach.tum_khalee_samay:
    title: Спрашиваем о свободном времени
    gloss: Чем ты занимаешься в свободное время?
    note: Это главный вопрос этого раздела — с ним можно спросить любого человека о его увлечениях.
  hi.a1.unit30.lesson04.teach.priya_ham_aksar:
    title: Прия заговаривает о хобби
    gloss: 'Прия: Мы часто гуляем вместе. А чем ты ещё занимаешься в свободное время, Арджун?'
    note: '*टहलते हैं* стоит во множественном числе, потому что подлежащее — *हम* («мы»); *अक्सर* стоит перед глаголом.'
  hi.a1.unit30.lesson04.teach.arjun_mujhe_khana:
    title: Хобби Арджуна
    gloss: 'Арджун: Я люблю готовить, в том числе дома. И я часто занимаюсь спортом.'
    note: '*घर पर भी* («и дома») показывает, что Арджун готовит для удовольствия, а не только на работе.'
  hi.a1.unit30.lesson04.teach.priya_tum_ghar:
    title: Прия удивлена
    gloss: 'Прия: Ты и дома готовишь? Ты же и так целый день готовишь на работе!'
    note: '*पूरा दिन* («целый день») подчёркивает, как много он уже готовит на работе, а *तो* добавляет усиление.'
  hi.a1.unit30.lesson04.teach.arjun_han_lekin:
    title: Арджун объясняет
    gloss: 'Арджун: Да, но готовка меня расслабляет. А ты что любишь делать?'
    note: '*खाना बनाने से सुकून मिलता है* значит «готовка меня расслабляет» (буквально «от готовки получается покой»); *बनाना* перед *से* превращается в *बनाने*.'
  hi.a1.unit30.lesson04.teach.priya_mujhe_parhna:
    title: Хобби Прии
    gloss: 'Прия: Я люблю читать и часто слушаю музыку.'
    note: '*और* («и») соединяет два хобби, а *सुनती हूँ* — женского рода, потому что говорит Прия.'
  hi.a1.unit30.lesson04.teach.arjun_kya_tum:
    title: Арджун спрашивает про игры
    gloss: 'Арджун: Ты ещё и в игры играешь?'
    note: 'Короткий вопрос «да/нет»: он начинается с *क्या*, а *खेलती हो* — женского рода, потому что Арджун обращается к Прие.'
  hi.a1.unit30.lesson04.teach.priya_naheen_main:
    title: Ответ Прии
    gloss: 'Прия: Нет, я никогда не играю в игры. Зато иногда рисую!'
    note: В одном ответе противопоставлены *कभी ... नहीं* («никогда») и *कभी-कभी* («иногда»).
  hi.a1.unit30.lesson05.teach.arjun_aur_main:
    title: Сравниваем увлечения
    gloss: Арджун и я часто гуляем вместе. Но у нас есть и другие увлечения. Арджун любит готовить, в том числе дома, и часто занимается спортом. Я люблю читать и часто слушаю музыку. Иногда я рисую, но никогда не играю в игры. А ты чем любишь заниматься в свободное время?
    note: В сообщении Прия подводит итог того, что было в предыдущих уроках, и в конце задаёт читателю главный вопрос этого раздела.
    glosses:
      टहलते: гуляем
      अक्सर: часто
      साथ: вместе
      और: другие
      बनाना: приготовление (еды)
      पसंद: нравится
      घर: дома
      कसरत: занимается спортом
      पढ़ना: читать
      सुनती: слушаю
      संगीत: музыка
      चित्र: рисунок
      कभी-कभी: иногда
      गेम: играть в видеоигры
      कभी: никогда (с नहीं)
      खाली: свободное
      समय: время
  hi.a1.unit30.lesson06.teach.arjun_tum_is:
    title: Арджун спрашивает про выходные
    gloss: 'Арджун: Что ты делаешь в эти выходные?'
    note: В *इस वीकेंड* («в эти выходные») *इस* стоит перед существительным, а *कर रही हो* — форма длительного действия «ты делаешь», женского рода, потому что обращаются к Прие.
  hi.a1.unit30.lesson06.teach.priya_abhee_pata:
    title: Прия не определилась
    gloss: 'Прия: Пока не знаю. Я люблю читать, но ещё хочу выйти на улицу.'
    note: '*बाहर जाना चाहती हूँ* значит «я хочу выйти на улицу»; *चाहती* — женского рода и стоит после *जाना*.'
  hi.a1.unit30.lesson06.teach.arjun_chalo_sath:
    title: Арджун предлагает план
    gloss: 'Арджун: Пойдём погуляем вместе? А потом я приготовлю нам поесть.'
    note: '*उसके बाद* («после этого») расставляет два плана по порядку, а *चलो ... टहलें* предлагает первый из них.'
  hi.a1.unit30.lesson06.teach.priya_achchha_aidiya:
    title: Прия соглашается
    gloss: 'Прия: Отличная идея! Я люблю и гулять, и готовить.'
    note: '*दोनों पसंद हैं* показывает, что Прие нравится и то и другое, а глагол *हैं* стоит во множественном числе.'
  hi.a1.unit30.lesson06.teach.arjun_barhiya_to:
    title: Арджун подтверждает
    gloss: 'Арджун: Отлично. Тогда увидимся в субботу!'
    note: '*शनिवार को मिलते हैं* («встречаемся в субботу») — настоящее время для твёрдого плана, а *को* указывает на день.'
