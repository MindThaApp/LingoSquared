teaching:
  hi.a1.unit29.lesson01.teach.kul_kitna_hua:
    title: Спрашиваем общую стоимость
    gloss: Сколько это стоит всего?
    note: '*कुल* значит «всего», а *कितना हुआ?* («сколько вышло?») — обычный способ спросить общую сумму.'
  hi.a1.unit29.lesson01.teach.kul_pachchees_rupye:
    title: Называем общую стоимость
    gloss: Всего выходит двести пятьдесят рупий.
    note: '*हुए* согласуется с множественным *रुपये*: *कुल दो सौ पचास रुपये हुए* буквально «всего двести пятьдесят рупий вышло».'
  hi.a1.unit29.lesson02.teach.kard_se_pement:
    title: Оплата картой или наличными
    gloss: платить картой, платить наличными
    note: На хинди говорят *कार्ड से पेमेंट करना* («делать оплату картой») и *नकद पेमेंट करना*; *से* указывает на средство оплаты.
    example_gloss:
    - Можно здесь заплатить картой?
    - Я плачу наличными.
  hi.a1.unit29.lesson02.teach.kya_main_yahan:
    title: Спрашиваем, можно ли платить картой
    gloss: Можно здесь заплатить картой?
    note: '*यहाँ* («здесь») задаёт место, а *सकता हूँ* («могу») стоит после основной части фразы; женщина говорит *सकती हूँ*.'
  hi.a1.unit29.lesson02.teach.ap_nakad_pement:
    title: Спрашиваем о способе оплаты
    gloss: Вы хотите заплатить наличными или картой?
    note: '*आप ... करेंगे* — вежливый вопрос в будущем времени, который задаёт кассир, а к *आप* глагол *करेंगे* ставится во множественном числе.'
  hi.a1.unit29.lesson03.teach.bil:
    title: Счёт
    gloss: счёт
    note: '*बिल* — существительное мужского рода: *एक बिल*, *बिल का*.'
    example_gloss: Разделим счёт?
  hi.a1.unit29.lesson03.teach.bil_bant_len:
    title: Предлагаем разделить счёт
    gloss: Разделим счёт?
    note: '*बाँट लें?* («поделим?») предлагает общий план без слова *हम*; *लें* — форма «давайте» от *लेना*.'
  hi.a1.unit29.lesson03.teach.kya_main_alag:
    title: Просим заплатить раздельно
    gloss: Можно заплатить раздельно?
    note: '*अलग से* значит «отдельно» и стоит перед *पेमेंट कर सकता हूँ*.'
  hi.a1.unit29.lesson04.teach.bakee_paise:
    title: Сдача
    gloss: сдача
    note: '*बाकी पैसे* («оставшиеся деньги») стоит во множественном числе и означает сдачу, которую тебе возвращают.'
    example_gloss: Вот ваша сдача.
  hi.a1.unit29.lesson04.teach.ye_rahe_apke:
    title: Отдаём сдачу
    gloss: Вот ваша сдача.
    note: '*आपके* — вежливое «ваш» (*आप* + *के*), согласуется с формой множественного числа *पैसे*.'
  hi.a1.unit29.lesson04.teach.mujhe_bakee_paise:
    title: Отказываемся от сдачи
    gloss: Сдача не нужна.
    note: '*मुझे ... नहीं चाहिए* («мне ... не нужно») — так в хинди говорят «мне не нужно»; *नहीं* стоит перед *चाहिए*.'
  hi.a1.unit29.lesson05.teach.paintees:
    title: Триста пятьдесят
    gloss: триста пятьдесят
    note: '*तीन सौ पचास* — это 350: сначала называются сотни, потом десятки.'
    example_gloss: Это стоит триста пятьдесят рупий.
  hi.a1.unit29.lesson05.teach.bil_do_thalee:
    title: Читаем счёт из ресторана
    gloss: 'Счёт: две тхали и два чая. Итого: триста пятьдесят рупий. Оплата: картой.'
    note: Обрати внимание, что заказали, какова итоговая сумма и как заплатили.
    glosses:
      बिल: счёт
      दो: два
      थाली: тхали
      चाय: чаи
      कुल: итого
      तीन: три
      सौ: сто
      पचास: пятьдесят
      रुपये: рупии
      पेमेंट: оплата
      कार्ड: карта
  hi.a1.unit29.lesson06.teach.priya_bil_mang:
    title: Прия просит счёт
    gloss: 'Прия: Попросим счёт?'
    note: '*माँग लें?* («попросим?») — снова форма «давай» от *लेना*, а *माँगना* значит «просить».'
  hi.a1.unit29.lesson06.teach.arjun_han_achchha:
    title: Арджун спрашивает итог
    gloss: 'Арджун: Да, хорошая мысль. Сколько всего получилось?'
    note: '*कुल कितना हुआ?* — уже знакомый вопрос об итоговой сумме, теперь за столом в кафе.'
  hi.a1.unit29.lesson06.teach.priya_paintees_rupye:
    title: Прия называет сумму
    gloss: 'Прия: Получилось триста пятьдесят рупий. Разделим?'
    note: '*तीन सौ पचास रुपये हुए* называет итог, а *बाँट लें?* значит «разделим?».'
  hi.a1.unit29.lesson06.teach.arjun_naheen_aj:
    title: Арджун настаивает на оплате
    gloss: 'Арджун: Нет, сегодня платить буду я. Ты мне так сильно помогла.'
    note: '*मुझे पेमेंट करने दो* значит «дай мне заплатить», а в *तुमने मेरी बहुत मदद की है* есть *ने*, потому что глагол стоит в прошедшем времени.'
  hi.a1.unit29.lesson06.teach.priya_tum_kitne:
    title: Прия тронута
    gloss: 'Прия: Как это мило с твоей стороны! Большое спасибо.'
    note: '*तुम कितने अच्छे हो!* («какой ты добрый!») — тёплый комплимент, а *शुक्रिया* значит «спасибо».'
  hi.a1.unit29.lesson06.teach.arjun_kya_main:
    title: Арджун спрашивает об оплате картой
    gloss: 'Арджун: Можно здесь заплатить картой?'
    note: Вопрос *क्या मैं यहाँ कार्ड से पेमेंट कर सकता हूँ?* звучит снова, теперь в настоящем ресторане.
  hi.a1.unit29.lesson06.teach.arjun_bil_deta:
    title: 'देता है: он платит'
    gloss: Арджун оплачивает счёт.
    note: '*देता है* — форма *वह* от *देना* («давать»); вместо «оплачивает счёт» в хинди говорят «даёт счёт».'
