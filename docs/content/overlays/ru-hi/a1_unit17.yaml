  notes: 'Derived from en-hi by scripts/derive_cross.py: structure, exercise keys and English answer sets are shared with the sibling; every Russian string was translated and adapted. Needs native Russian review (contrastive notes, register, distractor plausibility). NATIVE FLAGS: pending.'
answer_policy:
  occupation_identity: '"मैं + occupation + हूँ" states identity, e.g. "मैं शिक्षक हूँ" (I am a teacher). *Shikshak* (male) and *shikshika* (female) are NOT interchangeable typed answers -- when an exercise''s context establishes a specific speaker''s gender (e.g. Priya, established female), only the matching form should be marked correct, not both.'
  workplace_mein: '"[place] + में + काम करता/करती हूँ" states where someone works. A typed answer that drops *mein* entirely (e.g. "मैं दफ़्तर काम करता हूँ") is the exact ungrammatical error this unit''s own grammar_check exercise targets, and should be marked incorrect, not tolerated as a minor typo.'
  addressee_gender_verbs: '*Karte*/*karti*/*karta* agree with either the addressee (तुम-form) or the speaker (मैं-form), matching unit 10''s already-established -ता/-ती/ -ते rule. A typed answer using the wrong gender-agreement form for an exercise anchored to a named, established-gender character (Arjun = male, Priya = female) should be marked incorrect as a real grammar error, not tolerated.'
  nasalization_marks: Display and teach the correct chandrabindu/anusvara distinction. इंजीनियर uses anusvara (ं), verified via direct codepoint check -- accept only the anusvara form, not a chandrabindu substitution, since the two mark structurally different phonological patterns (nasal-before- consonant vs. nasalized word-final vowel) and this course's own established convention (हूँ/नहीं/हाँ) uses chandrabindu only for the latter.
  punctuation: Hindi text is shown with the traditional danda (।) as the sentence-final mark. In typed answers, accept the danda, a plain period (.), or the mark omitted entirely as equivalent. Question marks (?) may likewise be omitted, but the fully punctuated form remains the model answer.
  spoken_answers: Judge spoken responses by intelligibility rather than written punctuation. For any exercise asking the learner to state their own occupation or workplace, accept any of this unit's taught phrasings that fit the prompt, not only the single model sentence given in `accepted_answers`.
course:
  title: Хинди A1
units:
  hi.a1.unit17.work:
    title: Работа
lessons:
  hi.a1.unit17.lesson01.shikshak_shikshika_engineer:
    title: Учитель и инженер
  hi.a1.unit17.lesson02.school_aspatal_daftar:
    title: Школа, больница и офис
  hi.a1.unit17.lesson03.priya_arjun_kaam:
    title: 'Прия и Арджун: кем ты работаешь?'
teaching:
  hi.a1.unit17.lesson01.teach.tum_tumhara_kya_review:
    title: 'Повторение: ты, твой, что'
    gloss: ты (неформ.), твой (неформ.), что
    note: Краткое повторение слов, нужных, чтобы спросить друга о его работе.
    example_gloss: Как тебя зовут?
  hi.a1.unit17.lesson01.teach.arjun_priya_review:
    title: 'Повторение: Арджун, Прия'
    gloss: Арджун, Прия
    note: Напоминание об именах обоих героев перед тем, как в этом уроке на них будут строиться вопросы с родом.
    example_gloss:
    - Меня зовут Арджун.
    - Меня зовут Прия.
  hi.a1.unit17.lesson01.teach.copula_review:
    title: 'Повторение: я, есть (я), есть (он/она), есть (ты)'
    gloss: я, есть (я), есть (он/она), есть (ты, неформ.)
    note: Весь небольшой набор связок, нужный для предложений о том, кто ты, в этом уроке.
    example_gloss:
    - Ты в порядке?
    - Я в порядке.
  hi.a1.unit17.lesson01.teach.kaam_review:
    title: 'Повторение: работа'
    gloss: работа
    note: Слово впервые встретилось в уроках 10–11 и здесь повторяется как главное слово всего урока.
    example_gloss: У меня есть дела.
  hi.a1.unit17.lesson01.teach.karte_karti_karta_verb:
    title: Делать (ты, муж. / ты, жен. / я, муж.)
    gloss: делаешь (ты, муж., неформ.), делаешь (ты, жен., неформ.), делаю (я, муж.)
    note: Правило согласования -ta/-ti/-te, уже изученное в уроке 10 (оно встречалось и в уроке 1 во фразе *kya tum yog karti ho?*), распространяется на глагол *karna* (делать).
    example_gloss:
    - Чем ты занимаешься?
    - Я завтракаю.
  hi.a1.unit17.lesson01.teach.tum_kya_kaam_karte_ho_phrase:
    title: Кем ты работаешь? (мужчине)
    gloss: Кем ты работаешь?
    note: Главный вопрос этого урока, обращённый к другу-мужчине.
  hi.a1.unit17.lesson01.teach.tum_kya_kaam_karti_ho_phrase:
    title: Кем ты работаешь? (женщине)
    gloss: Кем ты работаешь?
    note: 'Тот же вопрос, обращённый к подруге: меняется только окончание глагола.'
  hi.a1.unit17.lesson01.teach.shikshak_shikshika:
    title: Учитель (муж. / жен.)
    gloss: учитель, учительница
    note: Новая пара названий профессий. В отличие от большинства изученных существительных, это слово меняется в зависимости от пола самого говорящего — см. грамматическую заметку этого урока.
    example_gloss:
    - Я учитель (говорит мужчина).
    - Я учительница (говорит женщина).
  hi.a1.unit17.lesson01.teach.grammar_occupation_gender:
    title: Mein + профессия + hoon
    gloss: '''Mein + профессия + hoon'' — так называют профессию, это всё та же знакомая конструкция ''mein...hoon'' из урока 1. Некоторые названия профессий меняются в зависимости от пола самого говорящего: ''shikshak'' (муж.), ''shikshika'' (жен.), точно так же, как в уроке 10 менялось окончание глагола -ta/-ti. ''Doctor'' и ''engineer'' не меняются: одно и то же слово для обоих полов.'
    note: Заранее объясняет разделение на два типа (существительные, согласуемые по роду, и неизменяемые заимствования), прежде чем на него опираются упражнения.
  hi.a1.unit17.lesson01.teach.doctor_review:
    title: 'Повторение: врач'
    gloss: врач
    note: Слово впервые встретилось в уроке 16 и здесь повторяется как название профессии, не зависящее от рода.
    example_gloss: Он/она — врач.
  hi.a1.unit17.lesson01.teach.mein_doctor_hoon_phrase:
    title: Я врач.
    gloss: Я врач.
    note: Модель «кто я» на примере уже знакомого слова.
  hi.a1.unit17.lesson01.teach.engineer:
    title: Инженер
    gloss: инженер
    note: Новое название профессии; как и *doctor*, не меняется по роду.
    example_gloss: Он/она — инженер.
  hi.a1.unit17.lesson01.teach.mein_engineer_hoon_phrase:
    title: Я инженер.
    gloss: Я инженер.
    note: Модель «кто я» на примере второй новой профессии этого урока.
  hi.a1.unit17.lesson02.teach.kahan_review:
    title: 'Повторение: где'
    gloss: где
    note: Слово впервые встретилось в уроке 1 и здесь повторяется, чтобы спрашивать о месте работы.
    example_gloss: Где больница?
  hi.a1.unit17.lesson02.teach.mein_review:
    title: 'Повторение: в / на'
    gloss: в / на
    note: Слово впервые встретилось в уроке 1 и здесь повторяется, чтобы назвать место работы.
    example_gloss: Я живу в Лондоне.
  hi.a1.unit17.lesson02.teach.tum_kahan_kaam_karte_ho_phrase:
    title: Где ты работаешь? (мужчине)
    gloss: Где ты работаешь?
    note: Главный вопрос этого урока, обращённый к другу-мужчине.
  hi.a1.unit17.lesson02.teach.tum_kahan_kaam_karti_ho_phrase:
    title: Где ты работаешь? (женщине)
    gloss: Где ты работаешь?
    note: Тот же вопрос, обращённый к подруге.
  hi.a1.unit17.lesson02.teach.school_review:
    title: 'Повторение: школа'
    gloss: школа
    note: Слово впервые встретилось в уроке 8 и здесь служит первым местом работы.
    example_gloss: Я работаю в школе (говорит женщина).
  hi.a1.unit17.lesson02.teach.mein_school_mein_kaam_karti_hoon_phrase:
    title: Я работаю в школе.
    gloss: Я работаю в школе.
    note: Модель «где работаю» на примере школы, женская форма.
  hi.a1.unit17.lesson02.teach.hospital_review:
    title: 'Повторение: больница'
    gloss: больница
    note: Слово впервые встретилось в уроке 8 и здесь служит вторым местом работы, в паре с профессией врача.
    example_gloss: Врач работает в больнице.
  hi.a1.unit17.lesson02.teach.daftar:
    title: Офис
    gloss: офис
    note: Новое существительное, третье место работы в этом уроке, в паре с профессией инженера.
    example_gloss: Я работаю в офисе (говорит мужчина).
  hi.a1.unit17.lesson02.teach.mein_daftar_mein_kaam_karta_hoon_phrase:
    title: Я работаю в офисе.
    gloss: Я работаю в офисе.
    note: Модель «место работы», применённая к слову «офис», мужской род.
  hi.a1.unit17.lesson02.teach.grammar_workplace:
    title: Место + mein + kaam karta/karti hoon
    gloss: '''[Place] + mein + kaam karta/karti hoon'' объединяет три уже знакомых элемента: ''mein'' (урок 1, ''London mein rehta hoon''), ''kaam'' (урок 10/11) и форму -ta/-ti/-te глагола ''karna'' (урок 10, ''nashta karta hoon'', и урок 1, ''kya tum yog karti ho?''). Это не новая грамматика: три знакомых элемента впервые собраны в одном предложении.'
    note: Каждый уже изученный элемент назван с номером урока, а затем они объединяются, как и во всех предыдущих грамматических заметках.
  hi.a1.unit17.lesson03.teach.roz_review:
    title: 'Повторение: каждый день'
    gloss: каждый день
    note: Слово впервые встретилось в уроке 10, здесь оно используется для описания ежедневного рабочего распорядка.
    example_gloss: Я работаю каждый день.
  hi.a1.unit17.lesson03.teach.jaana_forms_review:
    title: 'Повторение: идти, ходить (ты, ж. р. / ты, м. р. / я, м. р.)'
    gloss: ходишь (ты, ж. р.), ходишь (ты, м. р.), хожу (я, м. р.)
    note: Уже изученные формы на -ta/-ti/-te глагола *jana* (идти, ходить), впервые введённые в уроке 10; здесь они используются для ежедневной дороги на работу.
    example_gloss:
    - Я каждый день хожу в школу (говорит женщина).
    - Ты каждый день ходишь в офис? (обращение к мужчине)
  hi.a1.unit17.lesson03.teach.bhi_haan_review:
    title: 'Повторение: тоже, да'
    gloss: тоже, да
    note: Оба слова уже изучены (урок 1 и уроки 1/6/13) и повторяются в диалоге этого урока.
    example_gloss: Да, мне это тоже понравилось.
  hi.a1.unit17.lesson03.teach.dialogue.line01:
    title: Арджун спрашивает Прию о её работе
    gloss: Прия, кем ты работаешь?
  hi.a1.unit17.lesson03.teach.dialogue.line02:
    title: Прия говорит, что она учительница в школе
    gloss: Я учительница. Я работаю в школе.
  hi.a1.unit17.lesson03.teach.dialogue.line03:
    title: Арджун спрашивает, ходит ли она в школу каждый день
    gloss: Здорово! Ты каждый день ходишь в школу?
  hi.a1.unit17.lesson03.teach.dialogue.line04:
    title: Прия подтверждает и задаёт Арджуну тот же вопрос
    gloss: Да, я каждый день хожу в школу. А ты кем работаешь?
  hi.a1.unit17.lesson03.teach.dialogue.line05:
    title: Арджун говорит, что он инженер и работает в офисе
    gloss: Я инженер. Я работаю в офисе.
  hi.a1.unit17.lesson03.teach.dialogue.line06:
    title: Прия спрашивает, ходит ли он тоже каждый день в офис
    gloss: Отлично! Ты тоже каждый день ходишь в офис?
  hi.a1.unit17.lesson03.teach.dialogue.line07:
    title: Арджун подтверждает
    gloss: Да, я каждый день хожу в офис.
  hi.a1.unit17.lesson03.teach.dialogue.line08:
    title: Прия благодарит его
    gloss: Хорошо, спасибо.
  hi.a1.unit17.lesson03.teach.grammar_summary:
    title: Три главных правила
    gloss: 'Три главных правила урока: (1) ''mein + профессия + hoon'' называет профессию (например, ''mein shikshika hoon''), и некоторые профессии меняются в зависимости от пола говорящего; (2) ''[place] + mein + kaam karta/karti hoon'' называет место работы (например, ''mein daftar mein kaam karta hoon''); (3) ''roz [place] jata/jati hoon'' выражает ежедневную привычку, это то же правило -ta/-ti из урока 10.'
    note: Итоговая заметка, объединяющая всю грамматику урока, как и заключительные заметки уроков 15 и 16.
  hi.a1.unit17.lesson03.teach.work_profile_reading:
    title: Читаем короткую анкету
    gloss: Прия — учительница. Она работает в школе. Арджун — инженер. Он работает в офисе.
    note: Короткий прямой рассказ о людях, повторяющий факты из диалога без новых сведений. Он помогает научиться читать краткое описание работы.
    glosses:
      शिक्षिका: учительница
      स्कूल: школа
      काम: работать
      करती: делает / работает (ж. р., от करना)
      इंजीनियर: инженер
      दफ़्तर: офис
      करता: делает / работает (м. р., от करना)
