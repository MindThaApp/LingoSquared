answer_policy:
  nasalization_marks: Display and teach the correct chandrabindu/anusvara distinction (पाँच vs. मैं, हैं, में). In typed A1 answers, accept a variant that drops the nasalization mark entirely or substitutes anusvara for chandrabindu (पांच for पाँच) when every other character is correct -- these marks are small, easy to miss on a virtual keyboard, and near-homophonous in casual speech; this is a beginner course, not a spelling test. Do not extend this tolerance to a wrong vowel or consonant, which changes the actual word.
  punctuation: Hindi text is shown with the traditional danda (।) as the sentence-final mark, matching how it is actually printed and taught. In typed answers, accept the danda, a plain period (.), or the mark omitted entirely as equivalent -- most everyday Hindi typed on phones/keyboards uses a plain period, and this distinction carries no meaning difference. Question marks (?) and exclamation marks may likewise be omitted, but the fully punctuated form remains the model answer.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register (aap vs. tum) rather than written punctuation or nasalization marks.
course:
  title: Хинди A1
units:
  hi.a1.unit02.numbers:
    title: Числа
lessons:
  hi.a1.unit02.lesson01.numbers_zero_to_ten:
    title: Числа от нуля до десяти
  hi.a1.unit02.lesson02.numbers_and_prices:
    title: Числа от одиннадцати до ста и цены
  hi.a1.unit02.lesson03.phone_and_age:
    title: Номер телефона и возраст
teaching:
  hi.a1.unit02.lesson01.teach.shoonya:
    title: Ноль
    gloss: ноль
    note: Отправная точка для всех чисел в этом уроке.
    example_gloss: Сегодня температура ноль.
  hi.a1.unit02.lesson01.teach.ek:
    title: Один
    gloss: один
    note: В хинди числа от 11 до 99 — это отдельные слова, а не конструкция «десять + один». В уроке 2 ты увидишь, что बीस (20) и तीस (30) не имеют ничего общего по звучанию с एक (1) или दो (2).
    example_gloss: У меня одна книга.
  hi.a1.unit02.lesson01.teach.do:
    title: Два
    gloss: два
    note: Простое и очень частотное число; это же слово — неформальная форма повелительного наклонения «дай», но по контексту смысл всегда ясен.
    example_gloss: У меня два брата.
  hi.a1.unit02.lesson01.teach.teen:
    title: Три
    gloss: три
    note: '*Chahiye* («нужно») — частая безличная конструкция: *mujhe teen seb chahiye* буквально значит «мне три яблока нужно» — очень естественный способ сказать «мне нужно».'
    example_gloss: Мне нужны три яблока.
  hi.a1.unit02.lesson01.teach.chaar:
    title: Четыре
    gloss: четыре
    note: 'Здесь нет ничего необычного: chaar ведёт себя как любое другое небольшое число.'
    example_gloss: У меня четыре друга.
  hi.a1.unit02.lesson01.teach.paanch:
    title: Пять
    gloss: пять
    note: 'Пишется с чандрабинду (पाँच), а не с анусваром: знак гласной аа (ा) не поднимается над буквой, поэтому нужен чандрабинду, а не обычная точка — как в हाँ/कहाँ из первого раздела.'
    example_gloss: У меня пять рупий.
  hi.a1.unit02.lesson01.teach.chhah:
    title: Шесть
    gloss: шесть
    note: В старых текстах иногда пишется и छः; современное стандартное написание — छह.
    example_gloss: У меня шесть книг.
  hi.a1.unit02.lesson01.teach.saat:
    title: Семь
    gloss: семь
    note: Полезное число для разговора о днях недели.
    example_gloss: В неделе семь дней.
  hi.a1.unit02.lesson01.teach.aath:
    title: Восемь
    gloss: восемь
    note: 'Здесь нет ничего необычного: aath ведёт себя как любое другое небольшое число.'
    example_gloss: В этой комнате восемь стульев.
  hi.a1.unit02.lesson01.teach.nau:
    title: Девять
    gloss: девять
    note: Здесь не нужен знак назализации, в отличие от некоторых соседних чисел.
    example_gloss: Занятие йогой начинается в девять часов утра.
  hi.a1.unit02.lesson01.teach.das:
    title: Десять
    gloss: десять
    note: Последнее число первой группы; урок 2 продолжается числами второго и следующих десятков, которые уже не предсказуемы.
    example_gloss: У меня на руках десять пальцев.
  hi.a1.unit02.lesson02.teach.gyaarah:
    title: Одиннадцать
    gloss: одиннадцать
    note: 'Начиная отсюда, каждое число в хинди — отдельное слово без закономерности: gyaarah не содержит в себе das (10) или ek (1). Короткого пути нет, каждое число нужно выучить отдельно.'
    example_gloss: В этом классе одиннадцать учеников.
  hi.a1.unit02.lesson02.teach.baarah:
    title: Двенадцать
    gloss: двенадцать
    note: 'Ещё одно слово, которое надо просто запомнить: никакой закономерности, связывающей его с do (2), нет.'
    example_gloss: В году двенадцать месяцев.
  hi.a1.unit02.lesson02.teach.pandrah:
    title: Пятнадцать
    gloss: пятнадцать
    note: Частое число для коротких промежутков времени, например пятнадцатиминутного перерыва.
    example_gloss: Мне нужно пятнадцать минут.
  hi.a1.unit02.lesson02.teach.bees:
    title: Двадцать
    gloss: двадцать
    note: 'Совершенно новое слово, а не сочетание das (10) и do (2): так будет со всеми десятками дальше.'
    example_gloss: Моей сестре двадцать лет.
  hi.a1.unit02.lesson02.teach.tees:
    title: Тридцать
    gloss: тридцать
    note: 'Снова отдельное слово: оно немного похоже на teen (3), но не складывается из teen и das, поэтому учи его отдельно.'
    example_gloss: Билет стоит тридцать рупий.
  hi.a1.unit02.lesson02.teach.pachaas:
    title: Пятьдесят
    gloss: пятьдесят
    note: Очень употребительное круглое число, особенно в ценах.
    example_gloss: У меня пятьдесят рупий.
  hi.a1.unit02.lesson02.teach.sau:
    title: Сто
    gloss: сто
    note: Круглое число, очень частое в повседневных ценах.
    example_gloss: Эта книга стоит сто рупий.
  hi.a1.unit02.lesson02.teach.keemat:
    title: Цена
    gloss: цена; стоимость
    note: '*Keemat* — существительное женского рода, поэтому притяжательное при нём всегда в женской форме (*iski keemat*, «её цена»), какой бы предмет ни оценивался.'
    example_gloss: Сколько стоит этот билет?
  hi.a1.unit02.lesson02.teach.rupaye:
    title: Рупии
    gloss: рупии
    note: '*Rupaya* — форма единственного числа (ровно одна рупия); *rupaye* используется для любой большей суммы.'
    example_gloss: Это стоит пятьдесят рупий.
  hi.a1.unit02.lesson02.teach.iski_keemat_kya_hai:
    title: Вопрос о цене
    gloss: Сколько это стоит?
    note: '*Iski* («его/её») согласуется с существительным женского рода *keemat* («цена»), а не с тем предметом, цену которого спрашивают — та же схема согласования, что и в *mera naam* из первого раздела.'
  hi.a1.unit02.lesson02.teach.iski_keemat_pachaas_rupaye_hai:
    title: Называем цену
    gloss: Это стоит пятьдесят рупий.
    note: Естественный полный ответ на вопрос Iski keemat kya hai?
  hi.a1.unit02.lesson03.teach.aapka_phone_number_kya_hai:
    title: Спросить номер телефона вежливо
    gloss: Какой у вас номер телефона? (вежливо)
    note: '*Number* (नंबर) — частое заимствование из английского, которое постоянно используется в повседневном хинди. *Aapka* согласуется с существительным мужского рода *number*.'
  hi.a1.unit02.lesson03.teach.tumhara_phone_number_kya_hai:
    title: Спросить номер телефона на ты
    gloss: Какой у тебя номер телефона? (неформально)
    note: Tumhara заменяет aapka в разговоре с другом или ровесником — как и в первом разделе.
  hi.a1.unit02.lesson03.teach.mera_number:
    title: 'Назвать номер: начало фразы'
    gloss: Мой номер...
    note: Естественное вступление перед тем, как называть цифры по одной.
  hi.a1.unit02.lesson03.teach.sample_number:
    title: Пример номера телефона
    gloss: Шесть, два, восемь, три, пять.
    note: Номера телефонов в хинди читают по одной цифре; все эти цифры уже были в первом уроке.
  hi.a1.unit02.lesson03.teach.aapki_umra_kya_hai:
    title: Спросить возраст вежливо
    gloss: Сколько вам лет? (вежливо)
    note: '*Umra* («возраст») — существительное женского рода, поэтому *aapki* здесь в женской форме — та же схема согласования, что в *iski keemat*, только теперь с возрастом человека, а не с ценой.'
  hi.a1.unit02.lesson03.teach.tumhari_umra_kya_hai:
    title: Спросить возраст на ты
    gloss: Сколько тебе лет? (неформально)
    note: Tumhari заменяет aapki в разговоре с другом или ровесником.
  hi.a1.unit02.lesson03.teach.meri_umra_tees_saal_hai:
    title: Назвать свой возраст
    gloss: Мне тридцать лет.
    note: '*Meri* согласуется с *umra* (женский род), а не с полом говорящего — в отличие от глагольных форм *chahta/chahti* из первого раздела, это притяжательное не меняется, кто бы ни говорил.'
  hi.a1.unit02.lesson03.teach.dialogue.line01:
    title: Арджун спрашивает номер Прии
    gloss: Арджун неформально просит у Прии номер телефона.
    note: Точно повторяет неформальный вопрос о номере телефона из этого урока.
  hi.a1.unit02.lesson03.teach.dialogue.line02:
    title: Прия называет свой номер и спрашивает в ответ
    gloss: Прия называет свой номер телефона по цифрам, а затем спрашивает номер Арджуна.
    note: Все эти цифры уже были в первом уроке этого раздела.
  hi.a1.unit02.lesson03.teach.dialogue.line03:
    title: Арджун называет свой номер
    gloss: Арджун называет свой номер телефона по цифрам.
    note: Снова всё та же лексика из первого урока.
  hi.a1.unit02.lesson03.teach.dialogue.line04:
    title: Прия спрашивает возраст Арджуна
    gloss: Прия благодарит его и неформально спрашивает, сколько ему лет.
    note: Shukriya («спасибо») не меняется в зависимости от уровня вежливости — как и в карточке shukriya из первого раздела.
  hi.a1.unit02.lesson03.teach.dialogue.line05:
    title: Арджун называет возраст и спрашивает в ответ
    gloss: Арджун говорит, что ему двадцать, и спрашивает возраст Прии.
    note: Одно слово Tumhari? — короткий естественный способ вернуть вопрос.
  hi.a1.unit02.lesson03.teach.dialogue.line06:
    title: Прия называет свой возраст
    gloss: Прия говорит, что ей тридцать.
    note: Meri umra tees saal hai повторяет модель предложения, изученную ранее в этом уроке.
  hi.a1.unit02.lesson03.teach.dialogue.line07:
    title: Арджун заканчивает разговор
    gloss: Арджун доброжелательно реагирует и говорит, что они ещё увидятся.
    note: Accha и phir milenge повторяют лексику прощания из первого раздела.
  hi.a1.unit02.lesson03.teach.dialogue.line08:
    title: Прия заканчивает разговор
    gloss: Прия соглашается и говорит неформальное «до встречи».
    note: Theek hai и phir milte hain повторяют лексику прощания из первого раздела.
