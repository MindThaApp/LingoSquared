teaching:
  hi.a1.unit04.lesson01.teach.baje:
    title: Час (о времени)
    gloss: часов (при числах от двух)
    note: Употребляется с любым часом, кроме первого -- форму для *одного часа* смотри дальше в этом уроке.
    example_gloss: Сейчас пять часов.
  hi.a1.unit04.lesson01.teach.abhi:
    title: Сейчас
    gloss: сейчас
    note: Простое слово о времени, которое тебе постоянно понадобится, когда ты называешь текущее время.
    example_gloss: Сейчас десять часов.
  hi.a1.unit04.lesson01.teach.ek_do_teen:
    title: Один, два, три
    gloss: один, два, три
    note: 'Эти числа из урока 2 нужны здесь для названия времени -- обрати внимание: *ek* требует особой формы *baja*, а *do* и *teen* -- обычной *baje*.'
    example_gloss:
    - Сейчас час.
    - Сейчас два часа.
    - Сейчас три часа.
  hi.a1.unit04.lesson01.teach.chaar_paanch_chhah:
    title: Четыре, пять, шесть
    gloss: четыре, пять, шесть
    note: Из урока 2 -- со всеми тремя используется обычная форма *baje*.
    example_gloss:
    - Сейчас четыре часа.
    - Сейчас пять часов.
    - Сейчас шесть часов.
  hi.a1.unit04.lesson01.teach.saat_aath_nau:
    title: Семь, восемь, девять
    gloss: семь, восемь, девять
    note: Из урока 2.
    example_gloss:
    - Сейчас семь часов.
    - Сейчас восемь часов.
    - Сейчас девять часов.
  hi.a1.unit04.lesson01.teach.das_gyaarah_baarah:
    title: Десять, одиннадцать, двенадцать
    gloss: десять, одиннадцать, двенадцать
    note: Из урока 2 -- последние из чисел для обозначения часа, которые тебе понадобятся.
    example_gloss:
    - Сейчас десять часов.
    - Сейчас одиннадцать часов.
    - Сейчас двенадцать часов.
  hi.a1.unit04.lesson01.teach.baja_grammar_note:
    title: Baja и baje
    gloss: '*Baja* употребляется с числом *один*, *baje* -- со всеми остальными числами: *ek baja hai*, *do baje hain*.'
    note: 'Это настоящее исключение в согласовании, а не упрощение: *ek baja hai* -- единственный час, где используется форма единственного числа.'
  hi.a1.unit04.lesson01.teach.kitne_baje_hain:
    title: Спрашиваем время
    gloss: Который час?
    note: Буквально «сколько часов есть» -- стандартный способ спросить, который час.
  hi.a1.unit04.lesson01.teach.abhi_paanch_baje_hain:
    title: Как назвать время
    gloss: Сейчас пять часов.
    note: Естественный полный ответ на вопрос *Kitne baje hain?*
  hi.a1.unit04.lesson02.teach.yoga_class_reprise:
    title: Занятие йогой
    gloss: занятие йогой
    note: Из урока 1 -- сквозной пример этого урока для разговора о расписании.
    example_gloss: Занятие йогой сегодня.
  hi.a1.unit04.lesson02.teach.subah:
    title: Утро
    gloss: утро
    note: Одно из четырёх слов для времени суток в этом уроке.
    example_gloss: Занятие йогой утром.
  hi.a1.unit04.lesson02.teach.dopahar:
    title: День / полдень
    gloss: день, полдень
    note: Обозначает и середину дня (полдень), и время после полудня.
    example_gloss: Днём занятия нет.
  hi.a1.unit04.lesson02.teach.shaam:
    title: Вечер
    gloss: вечер
    note: Часть суток после *dopahar* и до *raat*.
    example_gloss: Следующее занятие в пять часов вечера.
  hi.a1.unit04.lesson02.teach.raat:
    title: Ночь
    gloss: ночь
    note: Последнее из четырёх слов для времени суток.
    example_gloss: Ночью занятия нет.
  hi.a1.unit04.lesson02.teach.ko_reprise:
    title: Ko с общим обозначением времени
    gloss: '*Ko* ставится после слова, обозначающего время суток, когда точный час не назван: *dopahar ko*, *raat ko*.'
    note: Тот же *ko*, что отмечает день недели (урок 3), здесь отмечает общий отрезок времени -- это естественная конструкция, но не единственная в этом уроке (форму с точным часом смотри в следующей заметке).
  hi.a1.unit04.lesson02.teach.time_of_day_baje_note:
    title: Слово времени суток прямо перед baje
    gloss: 'Для точного часа слово времени суток стоит прямо перед *baje*, без других слов между ними: *subah saat baje*, *shaam paanch baje*.'
    note: 'Здесь нет *ko*: оно используется для общего периода времени без конкретного часа, как объясняется в предыдущей заметке.'
  hi.a1.unit04.lesson02.teach.class_kitne_baje_hai:
    title: Как спросить, когда урок
    gloss: Во сколько урок?
    note: Тот же оборот *kitne baje*, что и в первом уроке, но теперь он спрашивает о времени события, а не о текущем времени.
  hi.a1.unit04.lesson02.teach.class_subah_saat_baje_hai:
    title: Как назвать время события
    gloss: Урок в семь утра.
    note: '*subah* ставится прямо перед *saat baje*, как сказано в грамматической заметке выше.'
  hi.a1.unit04.lesson03.teach.kal:
    title: Завтра / вчера
    gloss: завтра, вчера
    note: 'В хинди для обоих значений одно слово: какое из них имеется в виду, подсказывают контекст и время глагола. В этом уроке оно всегда значит «завтра».'
    example_gloss: Завтра урок в пять вечера.
  hi.a1.unit04.lesson03.teach.agli_reprise:
    title: Следующий
    gloss: следующий
    note: 'Слово из 3-го раздела: женская форма, согласуется с *class* женского рода.'
    example_gloss: Следующий урок завтра.
  hi.a1.unit04.lesson03.teach.theek_hai_shukriya_reprise:
    title: Хорошо, спасибо
    gloss: Хорошо, спасибо!
    note: Оба слова уже были в лексике прощания в 1-м разделе.
  hi.a1.unit04.lesson03.teach.milte_hain_reprise:
    title: Встретимся / увидимся
    gloss: встретимся / увидимся
    note: Из прощания в конце 3-го раздела; теперь вместе с *kal* значит «до завтра».
  hi.a1.unit04.lesson03.teach.agli_class_kitne_baje_hai:
    title: Как спросить, когда следующий урок
    gloss: Во сколько следующий урок?
    note: '*agli* (женский род, согласуется со словом «класс») сочетается с оборотом *kitne baje* из этого раздела.'
  hi.a1.unit04.lesson03.teach.agli_class_shaam_paanch_baje_hai:
    title: Как назвать время следующего урока
    gloss: Следующий урок в пять вечера.
    note: Естественный полный ответ на вопрос выше.
  hi.a1.unit04.lesson03.teach.kal_milte_hain:
    title: Прощание с договорённостью встретиться завтра
    gloss: Хорошо, до завтра!
    note: Естественный способ закончить разговор, когда время уже согласовано.
  hi.a1.unit04.lesson03.teach.dialogue.line01:
    title: Арджун спрашивает о следующем уроке
    gloss: Арджун спрашивает, во сколько следующий урок.
    note: Точно тот же вопрос, что в этом уроке.
  hi.a1.unit04.lesson03.teach.dialogue.line02:
    title: Прия называет время
    gloss: Прия говорит, что следующий урок в пять вечера.
    note: Точно то же предложение-ответ, что в этом уроке.
  hi.a1.unit04.lesson03.teach.dialogue.line03:
    title: Арджун благодарит её
    gloss: 'Арджун говорит: хорошо, спасибо.'
    note: Из лексики 1-го раздела.
  hi.a1.unit04.lesson03.teach.dialogue.line04:
    title: Прия завершает разговор
    gloss: 'Прия соглашается и говорит: до завтра.'
    note: Точно та же заключительная фраза, что в этом уроке.
