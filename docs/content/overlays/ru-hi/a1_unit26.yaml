teaching:
  hi.a1.unit26.lesson01.teach.jaiket_svetar:
    title: Пальто, свитер
    gloss: пальто, свитер
    note: '*जैकेट* — женского рода, а *स्वेटर* — мужского, это видно по сопровождающим словам: *मेरी जैकेट*, *मेरा स्वेटर*.'
    example_gloss:
    - Я ищу пальто.
    - У меня есть свитер.
  hi.a1.unit26.lesson01.teach.paint_joote:
    title: Брюки, обувь
    gloss: брюки, обувь
    note: '*पैंट* — одно слово для одной пары брюк (*मेरी पैंट*), а *जूते* — множественное число от *जूता*: существительное мужского рода на *-आ* во множественном числе меняет окончание на *-ए*.'
    example_gloss:
    - Я ищу брюки.
    - Я ищу обувь.
  hi.a1.unit26.lesson01.teach.main_ek_jaiket:
    title: Говорим, что ты ищешь
    gloss: Я ищу пальто.
    note: 'Глагол стоит в конце: *मैं एक जैकेट ढूँढ़ रहा हूँ*. *रहा हूँ* передаёт значение «ищу сейчас» (действие идёт в данный момент), а *रहा* — форма мужского рода (женщина говорит *रही*).'
  hi.a1.unit26.lesson02.teach.saiz:
    title: Размер
    gloss: размер
    note: '*साइज़* — существительное мужского рода, поэтому и слова при нём мужского рода: *मेरा साइज़*.'
    example_gloss: Какой у вас размер?
  hi.a1.unit26.lesson02.teach.apka_saiz_kya:
    title: Спрашиваем о размере
    gloss: Какой у тебя размер?
    note: '*कौन सा* («какой») спрашивает о выборе одного из набора, а *सा* согласуется с существительным: *कौन सा साइज़*, но *कौन सी जैकेट*. *आप* — вежливое «вы» для продавца.'
  hi.a1.unit26.lesson02.teach.mera_saiz_em:
    title: Называем свой размер
    gloss: У меня размер M.
    note: 'Здесь хинди не использует глагол «иметь»: *मेरा साइज़ एम है* буквально значит «мой размер — M», а *मेरा* согласуется с *साइज़* мужского рода.'
  hi.a1.unit26.lesson03.teach.kala_neela:
    title: Чёрный, синий
    gloss: чёрный, синий
    note: Два основных прилагательных цвета в этом уроке.
    example_gloss:
    - Я хочу пальто чёрного цвета.
    - У вас есть такое же в синем цвете?
  hi.a1.unit26.lesson03.teach.mujhe_vah_jaiket:
    title: Просим нужный цвет
    gloss: Я хочу пальто чёрного цвета.
    note: '*मुझे ... चाहिए* — так на хинди говорят «я хочу»: желание возникает «у меня» (*मुझे*), а нужная вещь стоит прямо перед *चाहिए*.'
  hi.a1.unit26.lesson03.teach.kya_apke_pas:
    title: Спрашиваем о другом цвете
    gloss: У вас есть такое же в синем цвете?
    note: '*आपके पास ... है?* («у вас ... есть?») — вежливый способ спросить «у вас есть ...?», а *भी* («тоже») стоит после слова, к которому относится.'
  hi.a1.unit26.lesson04.teach.kya_yah_jaiket:
    title: Спрашиваем, подходит ли вещь
    gloss: Это пальто тебе подходит?
    note: 'На хинди об одежде говорят, что она «приходится как надо»: *ठीक आती है*. Глагол согласуется с предметом: *जैकेट* женского рода даёт *आती*, а *स्वेटर* мужского рода дал бы *आता*.'
  hi.a1.unit26.lesson04.teach.yah_ekdam_theek:
    title: Подтверждаем, что вещь хорошо сидит
    gloss: Оно мне хорошо подходит.
    note: '*एकदम* («совершенно») даёт значение «сидит идеально»; *आती है* согласуется с *जैकेट* женского рода.'
  hi.a1.unit26.lesson04.teach.yah_bahut_chhotee:
    title: Слишком маленькое
    gloss: Это слишком маленькое.
    note: '*बहुत* стоит перед прилагательным и здесь означает «слишком»: *बहुत छोटी*. Прилагательное согласуется с *जैकेट* женского рода.'
  hi.a1.unit26.lesson04.teach.yah_bahut_baree:
    title: Слишком большое
    gloss: Это слишком большое.
    note: 'Та же схема с *बड़ी*: *बड़ा* для существительного женского рода меняется на *बड़ी*, получается *बहुत बड़ी*.'
  hi.a1.unit26.lesson05.teach.nabbe:
    title: Девятьсот
    gloss: девятьсот
    note: '*नौ सौ* — число 900, используется в цене куртки.'
    example_gloss: Куртка стоит девятьсот рупий.
  hi.a1.unit26.lesson05.teach.jaiket_kee_keemat:
    title: Называем цену
    gloss: Куртка стоит девятьсот рупий.
    note: 'На хинди говорят «цена куртки — ...»: *जैकेट की कीमत नौ सौ रुपये है*. *की* согласуется с *कीमत* женского рода, а не с *जैकेट*.'
  hi.a1.unit26.lesson05.teach.sardee_kee_jaiket:
    title: Читаем чек из магазина
    gloss: 'Зимняя куртка: размер M, цвет чёрный. Цена: девятьсот рупий. Эта куртка хорошо сидит и тёплая.'
    note: Найди размер, цвет, цену и два качества пальто, о которых сказано в тексте.
    glosses:
      सर्दी: зимняя (куртка)
      साइज़: размер
      रंग: цвет
      काला: чёрный
      कीमत: цена
      नौ: девять
      सौ: сто
      रुपये: рупии
      जैकेट: пальто
      आती: сидит
      गर्म: тёплый
  hi.a1.unit26.lesson06.teach.priya_yah_jaiket:
    title: Прия замечает куртку
    gloss: 'Прия: Какая хорошая куртка! Какой у тебя размер?'
    note: '*अच्छी* согласуется с *जैकेट* женского рода. *तुम्हारा* — неформальное «твой», его употребляют между друзьями.'
  hi.a1.unit26.lesson06.teach.arjun_mera_saiz:
    title: Арджун просит примерить
    gloss: 'Арджун: У меня размер M. Можно её примерить?'
    note: '*पहनकर देखना* («надеть и посмотреть») — так на хинди говорят «примерить». *सकता हूँ* значит «могу» или «можно», женщина говорит *सकती हूँ*.'
  hi.a1.unit26.lesson06.teach.priya_zaroor_kya:
    title: Прия спрашивает о посадке
    gloss: 'Прия: Конечно. Она хорошо сидит?'
    note: '*यह* значит «она» или «эта», а *आती* согласуется с *जैकेट* женского рода.'
  hi.a1.unit26.lesson06.teach.arjun_han_yah:
    title: Арджун подтверждает
    gloss: 'Арджун: Да, она отлично сидит и ещё тёплая.'
    note: Полностью совпадает с чеком из текста для чтения — это то же самое пальто.
  hi.a1.unit26.lesson06.teach.priya_barhiya_tum:
    title: Прия спрашивает о цвете
    gloss: 'Прия: Отлично! Ты возьмёшь её чёрную или синюю?'
    note: '*या* («или») предлагает выбор. Второе *रंग* можно опустить: *काले रंग में ... या नीले में*. *तुम* — неформальное обращение.'
  hi.a1.unit26.lesson06.teach.arjun_main_ise:
    title: Арджун решает
    gloss: 'Арджун: Я возьму её чёрную.'
    note: '*लूँगा* — будущее время от *लेना* («брать»), обычного глагола для решения о покупке в магазине. Женщина говорит *लूँगी*.'
  hi.a1.unit26.lesson06.teach.main_leta_hoon:
    title: लेता हूँ и लेता है
    gloss: Я беру, он берёт.
    note: '*-ता* — окончание привычного действия, оно согласуется с подлежащим, а *हूँ* употребляется с *मैं*, *है* — с *वह*.'
