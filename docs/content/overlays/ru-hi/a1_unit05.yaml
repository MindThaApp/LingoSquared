    title: Семья
lessons:
  hi.a1.unit05.lesson01.mera_parivar:
    title: Моя семья
  hi.a1.unit05.lesson02.dada_dadi_aur_nana_nani:
    title: Бабушка и дедушка
  hi.a1.unit05.lesson03.priya_aur_arjun_ka_parivar:
    title: Семьи Прии и Арджуна
teaching:
  hi.a1.unit05.lesson01.teach.parivar:
    title: Семья
    gloss: семья
    note: Общее слово для семьи; используется во всём разделе.
    example_gloss: Моя семья в Индии.
  hi.a1.unit05.lesson01.teach.pita_maa:
    title: Отец, мать
    gloss: отец, мать
    note: При представлении обоих используется уважительная форма множественного числа *hain* вместо *hai*, а при слове *pita* вместо *mera* ставится *mere* — см. заметку об уважительной форме далее в этом уроке.
    example_gloss:
    - Это мой отец.
    - Это моя мать.
  hi.a1.unit05.lesson01.teach.bhai_behan:
    title: Брат, сестра
    gloss: брат, сестра
    note: 'Основная пара этого раздела для сравнения форм mera/meri: *mera bhai*, *meri behan*.'
    example_gloss:
    - У меня есть брат.
    - У меня есть сестра.
  hi.a1.unit05.lesson01.teach.ek_as_article:
    title: Ek как «какой-то/один»
    gloss: '*Ek* означает «один» при счёте, а также может указывать на один из предметов, как «какой-то»: *mera ek bhai hai* (у меня есть брат).'
    note: Это то же слово, что и число 1 — в хинди нет отдельного неопределённого артикля. В русском артиклей тоже нет.
  hi.a1.unit05.lesson01.teach.mata_pita:
    title: Родители
    gloss: родители
    note: Сложное слово из *mata* (мать, официально) и *pita* (отец) — стандартное слово для «родителей».
    example_gloss: Мои родители живут в Дели.
  hi.a1.unit05.lesson01.teach.mera_meri_note:
    title: Mera и meri
    gloss: '*Mera* употребляется с словами мужского рода, *meri* — с словами женского рода: *mera bhai*, *meri behan*.'
    note: 'Главное грамматическое правило раздела: притяжательное слово согласуется с тем, что принадлежит, а не с говорящим.'
  hi.a1.unit05.lesson01.teach.mere_honorific_note:
    title: Mere для уважаемых старших
    gloss: 'Из уважения к старшим *mera* заменяется на *mere*, а *hai* на *hain*, даже если речь об одном человеке: *yeh mere pita hain* (Это мой отец).'
    note: 'Это настоящая устойчивая норма, а не ошибка: уважаемые старшие родственники (отец, дед) в единственном числе принимают эту форму, похожую на множественное число. Для матери и бабушки сохраняется *meri*, но глагол всё равно ставится во множественном числе (*hain*) по той же причине.'
  hi.a1.unit05.lesson01.teach.yah_mera_bhai_hai:
    title: Это мой брат
    gloss: Это мой брат.
    note: Простая форма мужского рода — для брата уважительная форма не нужна.
  hi.a1.unit05.lesson01.teach.yah_meri_behan_hai:
    title: Это моя сестра
    gloss: Это моя сестра.
    note: Простая форма женского рода, согласованная со словом *behan*.
  hi.a1.unit05.lesson01.teach.yah_kaun_hai:
    title: Кто это?
    gloss: Кто это?
    note: Простой и полезный вопрос, когда представляешь членов семьи.
  hi.a1.unit05.lesson02.teach.dada_dadi:
    title: Дедушка и бабушка по отцу
    gloss: дедушка по отцу, бабушка по отцу
    note: Именно родители твоего отца — см. заметку далее в этом уроке, где они сравниваются с родителями матери.
    example_gloss:
    - Мой дедушка живёт в Дели.
    - Моя бабушка живёт в Дели.
  hi.a1.unit05.lesson02.teach.nana_nani:
    title: Дедушка и бабушка по матери
    gloss: дедушка по матери, бабушка по матери
    note: Родители твоей матери — в хинди для них совершенно другая пара слов, чем для родителей отца.
    example_gloss:
    - Мой дедушка (по матери) живёт в Мумбаи.
    - Моя бабушка (по матери) живёт в Мумбаи.
  hi.a1.unit05.lesson02.teach.dilli_mumbai:
    title: Дели, Мумбаи
    gloss: Дели, Мумбаи
    note: Два крупных индийских города; в примерах этого урока в них живут члены семьи.
    example_gloss:
    - Моя семья живёт в Дели.
    - Мой брат живёт в Мумбаи.
  hi.a1.unit05.lesson02.teach.dada_nana_note:
    title: Две пары бабушек и дедушек
    gloss: 'Родители отца: *dada-dadi*. Родители матери: *nana-nani*.'
    note: В русском для дедушки и бабушки одно слово независимо от линии, а в хинди — совершенно разные слова в зависимости от того, с какой стороны семьи родственники.
  hi.a1.unit05.lesson02.teach.rehna_verb:
    title: Живёт (rehna)
    gloss: живёт, живут (мужской род / женский род / уважительная форма мн. ч.)
    note: 'Глагол «жить, проживать»: *rehta hai* — о мужчине, *rehti hai* — о женщине, *rehte hain* — о нескольких людях или об уважаемом старшем.'
    example_gloss:
    - Мой брат живёт в Дели.
    - Моя сестра живёт в Мумбаи.
    - Мои бабушка и дедушка живут в Дели.
  hi.a1.unit05.lesson02.teach.tumhara_tumhari:
    title: Твой (неформально)
    gloss: твой, твоя (неформально, мужской род / женский род)
    note: Притяжательное слово неформального обращения на *tum*; согласуется с предметом обладания точно так же, как *mera/meri*.
    example_gloss:
    - Где живёт твой брат?
    - Где живёт твоя сестра?
  hi.a1.unit05.lesson02.teach.mera_tumhara_note:
    title: Mera и tumhara вместе
    gloss: '*Mera* и *tumhara* употребляются с словами мужского рода, *meri* и *tumhari* — с словами женского рода: *mera bhai*/*tumhara bhai*, *meri behan*/*tumhari behan*.'
    note: Та же модель согласования, что и раньше; теперь видно, что она действует и для *tumhara*.
  hi.a1.unit05.lesson03.teach.bada_badi:
    title: Старший / большой
    gloss: старший, большой (мужской род / женский род)
    note: Старшего брата или сестру в хинди обозначают согласуемым прилагательным, а не отдельным словом. В русском же для этого используют прилагательное «старший», так что отличие скорее в том, что в хинди оно изменяется по роду.
    example_gloss:
    - Мой старший брат живёт в Дели.
    - Моя старшая сестра живёт в Мумбаи.
  hi.a1.unit05.lesson03.teach.chota_choti:
    title: Младший / маленький
    gloss: младший, маленький (мужской род / женский род)
    note: Пара к *bada/badi*, для младшего брата или сестры.
    example_gloss:
    - Мой младший брат сейчас студент.
    - Моя младшая сестра сейчас студентка.
  hi.a1.unit05.lesson03.teach.bada_chota_note:
    title: Согласование bada/chota
    gloss: '*Bada* и *chota* употребляются с словами мужского рода, *badi* и *choti* — с словами женского рода: *bada bhai*, *badi behan*.'
    note: То же согласование по мужскому и женскому роду, что и у *mera/meri*, теперь для слов, обозначающих возраст.
  hi.a1.unit05.lesson03.teach.aur_lekin_bhi:
    title: И, но, тоже
    gloss: и, но, тоже
    note: Три основных соединительных слова; они встречаются в заключительном диалоге этого урока.
    example_gloss:
    - Мои брат и сестра живут в Дели.
    - Мой брат живёт в Дели, а сестра живёт в Мумбаи.
    - У меня тоже есть сестра.
  hi.a1.unit05.lesson03.teach.accha_phir_milenge:
    title: Хорошо, до встречи
    gloss: Хорошо! Увидимся.
    note: Дружелюбное прощание, уже знакомое по лексике прощаний из урока 2.
  hi.a1.unit05.lesson03.teach.theek_hai_phir_milte_hain:
    title: Ладно, до скорого
    gloss: Ладно, до скорой встречи!
    note: Неформальный ответ на предыдущее прощание, как в заключительных обменах репликами прошлых уроков.
  hi.a1.unit05.lesson03.teach.dialogue.line01:
    title: Арджун спрашивает о семье Прии
    gloss: Арджун спрашивает, где живёт семья Прии.
    note: Повторяет конструкцию *parivar kahan rehta hai* из этого раздела.
  hi.a1.unit05.lesson03.teach.dialogue.line02:
    title: Прия рассказывает о родителях и брате
    gloss: Прия говорит, что её родители живут в Дели и что у неё есть старший брат.
    note: Объединяет *mata-pita*, *rehte hain* и *bada bhai bhi hai*.
  hi.a1.unit05.lesson03.teach.dialogue.line03:
    title: Арджун спрашивает о её бабушках и дедушках
    gloss: 'Арджун говорит «понятно» и спрашивает: а твои бабушка и дедушка?'
    note: '*Tumhare* — уважительная форма от *tumhara*, употребляемая со старшими, точно так же, как *mere* от *mera* (заметка об уважительной форме из первого урока).'
  hi.a1.unit05.lesson03.teach.dialogue.line04:
    title: Прия рассказывает об обеих парах бабушек и дедушек
    gloss: Прия говорит, что её бабушка и дедушка по отцу живут в Дели, а бабушка и дедушка по матери — в Мумбаи.
    note: '*Lekin* противопоставляет города двух пар бабушек и дедушек и закрепляет различие dada-dadi/nana-nani из урока 2.'
  hi.a1.unit05.lesson03.teach.dialogue.line05:
    title: Арджун говорит о своей сестре
    gloss: Арджун говорит, что у него тоже есть младшая сестра.
    note: Повторяет *bhi* и *choti behan*.
  hi.a1.unit05.lesson03.teach.dialogue.line06:
    title: Прия заканчивает разговор
    gloss: 'Прия говорит: хорошо, увидимся.'
    note: Повторяет заключительную фразу этого урока.
  hi.a1.unit05.lesson03.teach.dialogue.line07:
    title: Арджун отвечает
    gloss: 'Арджун соглашается и говорит: до скорой встречи.'
    note: Повторяет ответную фразу этого урока.
