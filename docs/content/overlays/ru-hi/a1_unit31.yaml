answer_policy:
  nasalization_marks: Display and teach the correct chandrabindu/anusvara distinction (हूँ, हाँ, कहाँ vs. मैं, हैं, में, मिलेंगे). In typed A1 answers, accept a variant that drops the nasalization mark entirely or substitutes anusvara for chandrabindu (हूं for हूँ, हां for हाँ) when every other character is correct -- these marks are small, easy to miss on a virtual keyboard, and near-homophonous in casual speech; this is a beginner course, not a spelling test. Do not extend this tolerance to a wrong vowel or consonant, which changes the actual word.
  punctuation: Hindi text is shown with the traditional danda (।) as the sentence-final mark, matching how it is actually printed and taught. In typed answers, accept the danda, a plain period (.), or the mark omitted entirely as equivalent -- most everyday Hindi typed on phones/keyboards uses a plain period, and this distinction carries no meaning difference. Question marks (?) and exclamation marks may likewise be omitted, but the fully punctuated form remains the model answer.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register (aap vs. tum) rather than written punctuation or nasalization marks.
course:
  title: Хинди A1
  description: 'Хинди для начинающих: как описать основную внешность человека — рост и впечатление о возрасте, цвет волос и глаз, главный вопрос *कैसा दिखता है?* и сравнение внешности двух людей.'
units:
  hi.a1.unit31.appearance:
    title: Описываем внешность
lessons:
  hi.a1.unit31.lesson01.lanba_chhota_boorha_aur:
    title: Высокий, низкий, пожилой и молодой
  hi.a1.unit31.lesson02.balon_ke_bare_men:
    title: Описываем волосы
  hi.a1.unit31.lesson03.ankhen_aur_vah_kaisa:
    title: Глаза и вопрос «Как выглядит человек?»
  hi.a1.unit31.lesson04.priya_neena_ka_huliya:
    title: Прия описывает Нину
  hi.a1.unit31.lesson05.vikram_aur_neha_kee:
    title: Сравниваем Викрама и Неху
  hi.a1.unit31.lesson06.arjun_neena_ko_pahchanta:
    title: Арджун узнаёт Нину
teaching:
  hi.a1.unit31.lesson01.teach.lanba_chhota:
    title: Высокий и низкий
    gloss: высокий / невысокий
    note: '*लंबा* и *छोटा* описывают рост и обычно употребляются со словом *कद* («рост»): *नेहा का कद लंबा है*. У существительных мужского рода они оканчиваются на *-ा*, у женского — на *-ी*.'
    example_gloss:
    - Неха высокая.
    - Викрам невысокий.
  hi.a1.unit31.lesson01.teach.boorha_javan:
    title: Пожилой и молодой
    gloss: пожилой / молодой
    note: '*बूढ़ा* и *जवान* описывают, насколько человек выглядит старым или молодым, без указания числа лет.'
    example_gloss:
    - Дедушка пожилой.
    - Арджун молодой.
  hi.a1.unit31.lesson01.teach.tumharee_umr_kitnee:
    title: उम्र и बूढ़ा
    gloss: Сколько тебе лет? Дедушка старый.
    note: Чтобы спросить точный возраст, в хинди используют *उम्र* («возраст»), а *बूढ़ा* описывает пожилого человека без указания числа.
  hi.a1.unit31.lesson01.teach.neha_ka_kad:
    title: Неха высокая, а Викрам невысокий
    gloss: Неха высокая, а Викрам невысокий.
    note: '*और* («и») связывает два описания, а каждое *का कद* согласуется с существительным *कद* мужского рода.'
  hi.a1.unit31.lesson02.teach.bal:
    title: Волосы
    gloss: волосы
    note: '*बाल* («волосы») в хинди — существительное мужского рода во множественном числе, поэтому описывающие его слова оканчиваются на *-े*: *लंबे बाल*.'
    example_gloss: У Арджуна короткие чёрные волосы.
  hi.a1.unit31.lesson02.teach.sunahre_bhoore_safed:
    title: Светлые, каштановые и белые
    gloss: светлые / каштановые / седые, белые
    note: 'Три цвета волос: *सुनहरे*, *भूरे* и *सफ़ेद*; перед *बाल* они оканчиваются на *-े*.'
    example_gloss:
    - У Прии светлые волосы.
    - У Викрама каштановые волосы.
    - У дедушки седые волосы.
  hi.a1.unit31.lesson02.teach.lanbe_chhote:
    title: Длинные и короткие (волосы)
    gloss: длинный / короткий (о волосах)
    note: '*लंबे* («длинные») и *छोटे* («короткие») описывают волосы и оканчиваются на *-े*, потому что *बाल* стоит во множественном числе.'
    example_gloss:
    - У Нехи длинные волосы.
    - У Викрама короткие волосы.
  hi.a1.unit31.lesson02.teach.lanbe_bal_chhote:
    title: Прилагательные перед बाल
    gloss: Длинные волосы, короткие волосы, светлые волосы, каштановые волосы, седые волосы, чёрные волосы.
    note: '*बाल* — мужской род, множественное число, поэтому прилагательное перед ним оканчивается на *-े*: *लंबे बाल*, *भूरे बाल*.'
  hi.a1.unit31.lesson02.teach.uske_bal_lanbe:
    title: 'उसके: его или её'
    gloss: Его или её волосы длинные.
    note: '*उसके* значит и «его», и «её», поэтому понять, о ком речь, можно только из контекста; здесь оно согласуется с множественным числом *बाल*.'
  hi.a1.unit31.lesson02.teach.arjun_ke_bal:
    title: У Арджуна короткие чёрные волосы
    gloss: У Арджуна короткие чёрные волосы.
    note: Слово *काले* встречается снова, теперь о волосах, и оканчивается на *-े*, потому что *बाल* стоит во множественном числе.
  hi.a1.unit31.lesson02.teach.priya_ke_bal:
    title: У Прии длинные светлые волосы
    gloss: У Прии длинные светлые волосы.
    note: В одном естественном предложении соединены слова о длине и цвете из этого урока.
  hi.a1.unit31.lesson03.teach.ankhen:
    title: Глаза
    gloss: глаза
    note: '*आँखें* («глаза») — существительное женского рода во множественном числе; единственное число — *आँख*.'
    example_gloss: У Арджуна карие глаза.
  hi.a1.unit31.lesson03.teach.neela_bhoora_hara:
    title: Голубой, карий и зелёный
    gloss: голубой / карий / зелёный
    note: 'Три цвета глаз: *नीला*, *भूरा* и *हरा*; перед *आँखें* женского рода они превращаются в *नीली*, *भूरी* и *हरी*.'
    example_gloss:
    - У Прии голубые глаза.
    - У Викрама карие глаза.
    - У Нехи зелёные глаза.
  hi.a1.unit31.lesson03.teach.neelee_ankhen_bhooree:
    title: Прилагательные перед आँखें
    gloss: Голубые глаза, карие глаза, зелёные глаза.
    note: '*आँखें* — женский род, поэтому прилагательное перед ним оканчивается на *-ी*: *नीली आँखें*.'
  hi.a1.unit31.lesson03.teach.priya_kaisee_dikhtee:
    title: Как выглядит Прия?
    gloss: Как выглядит Прия?
    note: '*कैसी दिखती है?* («как она выглядит?») — главный вопрос: *कैसी* и *दिखती* стоят в женском роде, когда речь о женщине, а *कैसा* и *दिखता* — в мужском, когда речь о мужчине.'
  hi.a1.unit31.lesson03.teach.priya_ke_bal:
    title: У Прии длинные светлые волосы и голубые глаза
    gloss: У Прии длинные светлые волосы и голубые глаза.
    note: 'Образец ответа: волосы и глаза соединены с помощью *और*. Обладатель получает *के* при *बाल* (множественное число) и *की* при *आँखें* (женский род).'
  hi.a1.unit31.lesson04.teach.priya_bhasha_kaife:
    title: Прия рассказывает про Нину
    gloss: 'Прия: В языковое кафе придёт новая девушка. Её зовут Нина.'
    note: '*आ रही है* («идёт, приходит») вводит нового человека, а *उसका नाम ... है* называет имя.'
  hi.a1.unit31.lesson04.teach.arjun_oke_vah:
    title: Арджун спрашивает, как она выглядит
    gloss: 'Арджун: Окей! А как она выглядит?'
    note: '*वह देखने में कैसी है?* значит «какая она на вид?»; *वह* означает и «он», и «она».'
  hi.a1.unit31.lesson04.teach.priya_uska_kad:
    title: Прия описывает рост и волосы Нины
    gloss: 'Прия: Она невысокая, и у неё короткие светлые волосы.'
    note: 'Здесь соединены рост и волосы: *उसका कद छोटा है और उसके बाल छोटे और सुनहरे हैं*.'
  hi.a1.unit31.lesson04.teach.arjun_aur_uskee:
    title: Арджун спрашивает про её глаза
    gloss: 'Арджун: А глаза?'
    note: '*उसकी आँखें* значит «её глаза»; *उसकी* стоит в женском роде, потому что согласуется с *आँखें*.'
  hi.a1.unit31.lesson04.teach.priya_uskee_ankhen:
    title: Прия описывает глаза Нины
    gloss: 'Прия: У неё зелёные глаза.'
    note: '*हरी* оканчивается на *-ी*, потому что *आँखें* — женский род.'
  hi.a1.unit31.lesson04.teach.arjun_shukriya_tab:
    title: Арджун её узнает
    gloss: 'Арджун: Спасибо! Тогда я её узнаю.'
    note: '*पहचान लूँगा* («узнаю») — будущее время от *पहचानना*, а *उसे* значит «её».'
  hi.a1.unit31.lesson05.teach.vikram_aur_neha:
    title: Сравниваем Викрама и Неху
    gloss: Викрам и Неха — брат и сестра, но выглядят по-разному. Викрам невысокий, у него короткие каштановые волосы и карие глаза. Неха выше Викрама, у неё длинные каштановые волосы и зелёные глаза. А как выглядишь ты?
    note: Короткое сравнение, в котором встречаются все изученные слова о цвете и длине; в конце читателю задан главный вопрос раздела.
    glosses:
      भाई: брат
      बहन: сестра
      दिखते: выглядеть
      अलग: разный
      छोटा: невысокий
      छोटे: невысокий
      भूरे: карий
      बाल: волосы
      भूरी: карий
      आँखें: глаза
      लंबी: выше
      लंबे: длинный
      हरी: зелёный
      कैसे: как (в вопросе «как ты выглядишь?»)
  hi.a1.unit31.lesson05.teach.vikram_neha_se:
    title: Сравнение с помощью से
    gloss: Викрам ниже Нехи.
    note: 'Здесь *से* значит «чем» и стоит после того, с кем сравнивают: *नेहा से छोटा*; прилагательное стоит прямо перед глаголом.'
  hi.a1.unit31.lesson05.teach.neha_ke_bal:
    title: У Нехи волосы длиннее, чем у Викрама
    gloss: У Нехи волосы длиннее, чем у Викрама.
    note: '*लंबे* согласуется с множественным числом *बाल*, а *विक्रम से* задаёт сравнение.'
  hi.a1.unit31.lesson05.teach.mere_bal_chhote:
    title: У меня короткие каштановые волосы
    gloss: У меня короткие каштановые волосы.
    note: '*मेरे बाल छोटे और भूरे हैं* («у меня короткие каштановые волосы») — образец предложения для описания себя; *मेरे* согласуется с *बाल* во множественном числе.'
  hi.a1.unit31.lesson06.teach.arjun_dekho_kya:
    title: Арджун замечает Нину
    gloss: 'Арджун: Смотри, это Нина? У неё короткие светлые волосы и зелёные глаза.'
    note: '*देखो* («смотри») — неформальная форма приказа, обращённая к другу.'
  hi.a1.unit31.lesson06.teach.priya_han_vahee:
    title: Прия подтверждает
    gloss: 'Прия: Да, это Нина!'
    note: Короткое естественное подтверждение.
  hi.a1.unit31.lesson06.teach.neena_hay_kya:
    title: Нина здоровается с Арджуном
    gloss: 'Нина: Привет, ты Арджун?'
    note: '*क्या तुम अर्जुन हो?* — простой неформальный вопрос к ровеснику.'
  hi.a1.unit31.lesson06.teach.arjun_han_tumse:
    title: Арджун отвечает Нине на приветствие
    gloss: 'Арджун: Да! Приятно познакомиться, Нина.'
    note: '*तुमसे मिलकर अच्छा लगा* — стандартная фраза при первой встрече; приятное чувство возникает «у тебя», поэтому слово «я» не нужно.'
  hi.a1.unit31.lesson06.teach.neena_mujhe_bhee:
    title: Нина отвечает на приветствие
    gloss: 'Нина: Я тоже рада познакомиться!'
    note: 'Завершает диалог: Арджун узнал Нину по описанию Прии.'
