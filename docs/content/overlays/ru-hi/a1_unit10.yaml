units:
  hi.a1.unit10.routines:
    title: Распорядок дня
lessons:
  hi.a1.unit10.lesson01.uthna_nashta_kaam:
    title: Подъём, завтрак, дорога на работу
  hi.a1.unit10.lesson02.tum_kab_uthte_ho:
    title: Когда ты встаёшь?
  hi.a1.unit10.lesson03.priya_arjun_dincharya:
    title: 'Прия и Арджун: распорядок дня'
teaching:
  hi.a1.unit10.lesson01.teach.review_time:
    title: 'Повторение: час, утро, день, вечер, ночь, в'
    gloss: час (о времени), утро, день, вечер, ночь, в (о времени)
    note: Краткое повторение слов о времени из урока 4 — в этом уроке они будут часто встречаться.
    example_gloss:
    - Сейчас 8 утра.
    - Ночью занятий нет.
  hi.a1.unit10.lesson01.teach.uthna:
    title: Я встаю
    gloss: я встаю (говорит мужчина / женщина)
    note: 'Первый глагол этого урока в настоящем времени привычного действия: модель -ta/-tee, знакомая по уроку 5 (rahta hai/rahtee hai), теперь употребляется с первым лицом и hoon.'
    example_gloss:
    - Я встаю в 7 утра.
    - Я встаю в 6 утра.
  hi.a1.unit10.lesson01.teach.roz:
    title: Каждый день
    gloss: каждый день
    note: Новое наречие для рассказа о распорядке дня.
    example_gloss: Я встаю утром каждый день.
  hi.a1.unit10.lesson01.teach.nashta_karna:
    title: Я завтракаю
    gloss: я завтракаю (говорит мужчина / женщина)
    note: «Nashta» («завтрак») сочетается с «karta/kartee hoon» («я делаю»).
    example_gloss:
    - Утром я завтракаю.
    - Утром я завтракаю.
  hi.a1.unit10.lesson01.teach.kaam_par_jaana:
    title: Я иду на работу
    gloss: я иду на работу (говорит мужчина / женщина)
    note: «Kaam par jaana» («идти на работу») требует слова «par» («на, у») — это устойчивое выражение, в отличие от «school jaana» дальше в этом уроке, где дополнительного слова не нужно.
    example_gloss:
    - Потом я иду на работу.
    - Потом я иду на работу.
  hi.a1.unit10.lesson01.teach.habitual_paradigm_note:
    title: Модель настоящего времени привычного действия
    gloss: 'Чтобы рассказать о ежедневной привычке, к глаголу добавляется -ta/-tee/-te, а затем hoon/ho/hai/hain в зависимости от подлежащего: я встаю (м/ж) — «hoon», ты встаёшь — «ho», он/она встаёт — «hai», они встают — «hain».'
    note: Вся модель дана сразу (она уже мельком встречалась в диалоге урока 1, а для третьего лица была разобрана в уроке 5), чтобы в упражнениях этого урока не приходилось угадывать непройденные формы.
  hi.a1.unit10.lesson01.teach.full_routine_phrase:
    title: Моё утро шаг за шагом
    gloss: Каждое утро я встаю в 7, потом завтракаю, потом иду на работу.
    note: Три глагола распорядка дня из этого урока в одном естественном предложении с последовательностью действий.
  hi.a1.unit10.lesson02.teach.sona:
    title: Я сплю
    gloss: я сплю (говорит мужчина / женщина)
    note: Та же модель -ta/-tee + hoon, применённая к новому глаголу.
    example_gloss:
    - Я ложусь спать в 11 вечера.
    - Я ложусь спать в 10 вечера.
  hi.a1.unit10.lesson02.teach.school_jaana:
    title: Я иду в школу
    gloss: я иду в школу (говорит мужчина / женщина)
    note: В отличие от «kaam par jaana», перед «jaana» в выражении «school jaana» дополнительного слова не нужно.
    example_gloss:
    - Я хожу в школу каждое утро к 8.
    - Я хожу в школу каждое утро к 8.
  hi.a1.unit10.lesson02.teach.tum_form_note:
    title: 'Форма с tum: -te/-tee + ho'
    gloss: 'С «tum» (ты, неформально) глагол принимает -te/-tee и «ho»: ты встаёшь (вопрос мужчине) / ты встаёшь (вопрос женщине), ты спишь (вопрос мужчине) / ты спишь (вопрос женщине).'
    note: Вторая часть той же парадигмы, которая была введена в уроке 1.
  hi.a1.unit10.lesson02.teach.addressee_gender_note:
    title: С чьим родом согласуется форма с «tum»?
    gloss: 'Глагол в форме с tum согласуется с родом того, к кому обращаются, а не того, кто говорит. Если спрашиваешь Прию: «Когда ты встаёшь?» (женская форма); если спрашиваешь Арджуна: «Когда ты встаёшь?» (мужская форма).'
    note: Легко упустить из виду. Это подтверждается всеми репликами с формой tum в диалоге урока 3.
  hi.a1.unit10.lesson02.teach.kab_uthte_ho_phrase:
    title: Когда ты встаёшь?
    gloss: Когда ты встаёшь? (вопрос мужчине)
    note: Готовый вопрос с новой формой tum из этого урока.
  hi.a1.unit10.lesson02.teach.pahle_phir_routine:
    title: Сначала я встаю, потом завтракаю
    gloss: Сначала я встаю, потом завтракаю.
    note: Здесь снова используются «pahle» и «phir» (сначала, потом) из урока 9 про указание пути, но теперь для последовательности дел в распорядке дня.
  hi.a1.unit10.lesson02.teach.kaam_idiom_note:
    title: Kaam par и school
    gloss: В «kaam par jaana» (идти на работу) нужно «par», а в «school jaana» (идти в школу) никакого дополнительного слова не нужно. Оба варианта правильные и употребительные.
    note: Это настоящее идиоматическое различие, а не общее правило с исключением.
  hi.a1.unit10.lesson03.teach.vaapas:
    title: Назад
    gloss: назад, обратно
    note: 'Употребляется с «aana» (приходить): «вернуться».'
    example_gloss: Я иду обратно.
  hi.a1.unit10.lesson03.teach.aana:
    title: Я прихожу
    gloss: я прихожу (говорит мужчина / женщина)
    note: Новый глагол, который строится по уже знакомой модели обычного настоящего времени.
    example_gloss:
    - Я возвращаюсь вечером.
    - Я возвращаюсь вечером.
  hi.a1.unit10.lesson03.teach.khana_verb:
    title: Я ем (еду)
    gloss: я ем (говорит мужчина / женщина)
    note: «Khana» как существительное (еда, из урока 6) и «khana» как глагол (есть). Это естественное для хинди удвоение, а не опечатка.
    example_gloss:
    - Я ем ночью.
    - Я ем ночью.
  hi.a1.unit10.lesson03.teach.raat_ka_khana:
    title: Ужин
    gloss: 'ужин (буквально: «ночная еда»)'
    note: Здесь снова используются «raat» (ночь), «ka» (притяжательная частица) и «khana» (еда), которые уже были в уроках.
    example_gloss: Ужин очень вкусный.
  hi.a1.unit10.lesson03.teach.dialogue.line01:
    title: Арджун спрашивает, когда встаёт Прия
    gloss: Арджун спрашивает Прию, во сколько она встаёт каждый день.
    note: 'Здесь используется женская форма tum: так правильно обращаться к Прие.'
  hi.a1.unit10.lesson03.teach.dialogue.line02:
    title: Прия отвечает
    gloss: 'Прия говорит: Я встаю каждое утро в шесть. Потом завтракаю.'
  hi.a1.unit10.lesson03.teach.dialogue.line03:
    title: Арджун рассказывает о своём распорядке
    gloss: 'Арджун говорит: Здорово! Я встаю в семь. Я тоже завтракаю, потом иду на работу.'
  hi.a1.unit10.lesson03.teach.dialogue.line04:
    title: Прия спрашивает, когда Арджун возвращается
    gloss: Прия спрашивает Арджуна, когда он возвращается.
    note: 'Здесь используется мужская форма tum: так правильно обращаться к Арджуну. Здесь в контексте вводится «vaapas aana».'
  hi.a1.unit10.lesson03.teach.dialogue.line05:
    title: Арджун рассказывает о своём вечере
    gloss: 'Арджун говорит: Я возвращаюсь в шесть вечера. Потом ужинаю, потом ложусь спать.'
  hi.a1.unit10.lesson03.teach.dialogue.line06:
    title: Прия рассказывает о своём вечере
    gloss: 'Прия говорит: Я тоже возвращаюсь вечером, потом ем.'
  hi.a1.unit10.lesson03.teach.dialogue.line07:
    title: Арджун спрашивает, когда Прия ложится спать
    gloss: Арджун спрашивает, во сколько Прия ложится спать.
    note: 'Снова женская форма tum: так правильно обращаться к Прие.'
  hi.a1.unit10.lesson03.teach.dialogue.line08:
    title: Прия отвечает и прощается
    gloss: 'Прия говорит: Я ложусь спать в одиннадцать вечера. Хорошо, до завтра!'
  hi.a1.unit10.lesson03.teach.dialogue.line09:
    title: Арджун прощается
    gloss: 'Арджун говорит: Хорошо, до встречи!'
