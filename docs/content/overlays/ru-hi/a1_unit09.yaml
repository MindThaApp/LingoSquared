teaching:
  hi.a1.unit09.lesson01.teach.review_places:
    title: 'Повторение: места'
    gloss: банк, школа, больница, парк, станция, почта
    note: Краткое повторение слов-мест из предыдущего урока — в этом уроке они будут часто встречаться.
    example_gloss:
    - Банк здесь.
    - Почта рядом с банком.
  hi.a1.unit09.lesson01.teach.review_function_words:
    title: 'Повторение: есть, где, здесь, там, из, принадлежность, хорошо'
    gloss: есть (является), где, здесь, там, от / из, служебное слово «чей-то» (родительный падеж), хорошо
    note: Краткое повторение служебных слов из прошлых уроков, которые понадобятся в упражнениях этого урока.
    example_gloss:
    - Где банк?
    - Парк там.
  hi.a1.unit09.lesson01.teach.seedhe_baaen_daaen:
    title: Прямо, налево, направо
    gloss: прямо, налево, направо
    note: Три основных слова для направлений в этом уроке.
    example_gloss:
    - Иди прямо.
    - Поверни налево.
  hi.a1.unit09.lesson01.teach.jao_muro:
    title: Иди!, поверни!
    gloss: иди!, поверни! (неформальная команда)
    note: Команды в форме «ты» — естественный регистр, когда двое друзей объясняют друг другу дорогу.
    example_gloss:
    - Иди прямо.
    - Поверни направо.
  hi.a1.unit09.lesson01.teach.yahan_se_seedhe_jao:
    title: Иди отсюда прямо
    gloss: Иди отсюда прямо.
    note: Соединяет новые слова урока с «yahaan se» (отсюда).
  hi.a1.unit09.lesson01.teach.baaen_muro_phrase:
    title: Повернуть налево
    gloss: Поверни налево.
    note: Самостоятельная команда, которую можно использовать сразу.
  hi.a1.unit09.lesson01.teach.daaen_muro_phrase:
    title: Повернуть направо
    gloss: Поверни направо.
    note: Зеркальная команда к «baaen muro».
  hi.a1.unit09.lesson01.teach.imperative_note:
    title: Окончание команд «-о»
    gloss: '«Jaao» и «muro» — команды в форме «ты», как «bataao» и «gino»: все они оканчиваются на «-o».'
    note: Показывает общую модель неформальных команд на примере двух слов, уже изученных раньше (bataao — в уроке 7, gino — в уроке 2).
  hi.a1.unit09.lesson02.teach.bank_kaise_jaun:
    title: Как дойти до банка?
    gloss: Как мне пройти к банку?
    note: Главный вопрос, чтобы спросить дорогу, в форме первого лица «как мне пройти?».
  hi.a1.unit09.lesson02.teach.tak:
    title: До
    gloss: до
    note: Уже встречалось в уроке 2 при счёте («zero se das tak»); здесь используется в столь же обычном пространственном значении.
    example_gloss: Иди прямо до банка.
  hi.a1.unit09.lesson02.teach.bank_tak_seedhe_jao:
    title: Иди прямо до банка
    gloss: Иди прямо до банка.
    note: Пример предложения с «tak» в пространственном значении.
  hi.a1.unit09.lesson02.teach.pahle_phir:
    title: Сначала, потом
    gloss: сначала, потом
    note: Пара слов, которая связывает два шага в объяснении дороги.
    example_gloss:
    - Сначала иди прямо.
    - Потом поверни налево.
  hi.a1.unit09.lesson02.teach.pahle_seedhe_phir_baaen:
    title: Сначала прямо, потом налево
    gloss: Сначала иди прямо, потом поверни налево.
    note: Соединяет «pahle» и «phir» в одну инструкцию из двух шагов.
  hi.a1.unit09.lesson02.teach.pahle_phir_note:
    title: Pahle и phir
    gloss: '«Pahle» и «phir» связывают два шага: первое действие идёт с «pahle», второе — с «phir», например: «pahle seedhe jaao, phir baaen muro.»'
    note: Полезное грамматическое правило о том, как выстраивать объяснение дороги из нескольких шагов.
  hi.a1.unit09.lesson03.teach.nukkad:
    title: Угол улицы
    gloss: угол улицы
    note: Новое слово-место для заключительного диалога урока; употребляется с «par» (на / у).
    example_gloss:
    - Банк на углу.
    - Парк за школой.
  hi.a1.unit09.lesson03.teach.bas:
    title: Только / просто
    gloss: только / просто
    note: Это слово также широко используется как заимствование, означающее «автобус», но в этом курсе такое значение не изучается, так что путаницы не будет.
    example_gloss: Просто пройди ещё немного.
  hi.a1.unit09.lesson03.teach.samajh_gaya:
    title: Понял / понятно
    gloss: понял / понятно
    note: 'Распространённое выражение из двух слов: «samajh» (основа глагола «samajhna», понимать) плюс «gaya» (пошёл), что показывает завершённость действия. Это мужская форма — Прия сказала бы «samajh gayi».'
    example_gloss: Я понял. / Понятно.
  hi.a1.unit09.lesson03.teach.accha_bahut_shukriya:
    title: Хорошо! Большое спасибо!
    gloss: Хорошо! Большое спасибо!
    note: Повторяются «accha», «bahut» и «shukriya» из прошлых уроков.
  hi.a1.unit09.lesson03.teach.koi_baat_nahin_phir_milenge:
    title: Не за что! Ещё увидимся.
    gloss: Не за что! Ещё увидимся.
    note: Стандартная заключительная фраза этого курса, повторённая дословно из урока 8.
  hi.a1.unit09.lesson03.teach.dialogue.line01:
    title: Арджун спрашивает про почту
    gloss: Арджун спрашивает Прию, как пройти на почту.
    note: Повторяется вопрос из второго урока этого раздела.
  hi.a1.unit09.lesson03.teach.dialogue.line02:
    title: Прия начинает объяснять дорогу
    gloss: 'Прия говорит: отсюда сначала иди прямо.'
    note: Повторяются «yahaan se» и «pahle» из начала этого урока.
  hi.a1.unit09.lesson03.teach.dialogue.line03:
    title: Арджун спрашивает, что дальше
    gloss: Арджун говорит «хорошо» и спрашивает, что дальше.
  hi.a1.unit09.lesson03.teach.dialogue.line04:
    title: Прия продолжает
    gloss: 'Прия говорит: потом на углу у банка поверни налево.'
    note: Слово «nukkad» (угол улицы) вводится в контексте.
  hi.a1.unit09.lesson03.teach.dialogue.line05:
    title: Арджун переспрашивает и спрашивает дальше
    gloss: Арджун повторяет «налево», говорит «хорошо» и спрашивает, что дальше.
  hi.a1.unit09.lesson03.teach.dialogue.line06:
    title: Прия заканчивает первый маршрут
    gloss: 'Прия говорит: просто пройди ещё немного — почта там, рядом с банком.'
    note: Вводится «bas» (только / просто); это согласуется с фактом из урока 8, что почта находится рядом с банком.
  hi.a1.unit09.lesson03.teach.dialogue.line07:
    title: Арджун понял и спрашивает про парк
    gloss: Арджун говорит, что понял, и спрашивает, как пройти в парк.
    note: Вводится выражение «samajh gaya».
  hi.a1.unit09.lesson03.teach.dialogue.line08:
    title: Прия объясняет второй маршрут
    gloss: 'Прия говорит: парк? Сначала иди прямо, потом поверни направо — парк за школой.'
    note: Это согласуется с фактом из урока 8, что парк находится за школой.
  hi.a1.unit09.lesson03.teach.dialogue.line09:
    title: Арджун благодарит Прию
    gloss: Арджун говорит, что понял, и горячо благодарит Прию.
  hi.a1.unit09.lesson03.teach.dialogue.line10:
    title: Прия прощается
    gloss: 'Прия говорит: не за что, ещё увидимся.'
    note: Та же заключительная реплика, что и в диалоге урока 8, повторённая дословно.
