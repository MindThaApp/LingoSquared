    feedback: Aaj mausam kaisa hai — 'mausam' стоит в единственном числе, поэтому с ним употребляется 'hai', а не 'hain'.
  hi.a1.unit19.lesson01.exercise13.speak_aaj_dhoop_hai:
    instruction: 'Скажи: Сегодня солнечно.'
    accepted_answers:
    - आज धूप है।
