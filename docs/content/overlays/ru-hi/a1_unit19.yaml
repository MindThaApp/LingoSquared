    - आज हवा है।
    - आज हवा है
    - आज मौसम अच्छा है।
    - आज मौसम अच्छा है
  hi.a1.unit19.lesson01.exercise12.fix_aaj_mausam_kaisa_hai:
    instruction: 'Исправь предложение: ''mausam'' (погода) — в единственном числе, поэтому нужно ''hai'', а не ''hain''.'
