  notes: 'Derived from en-hi by scripts/derive_cross.py: structure, exercise keys and English answer sets are shared with the sibling; every Russian string was translated and adapted. Needs native Russian review (contrastive notes, register, distractor plausibility). NATIVE FLAGS: pending.'
answer_policy:
  weather_existential: '"Aaj/kal + [weather word] + hai" states the current or a stated day''s weather -- *dhoop hai* ("it''s sunny"), *baarish hai* ("it''s raining"), *hawa hai* ("it''s windy") are each stated as a bare existential sentence, not a progressive verb form. A typed answer using the correct weather noun with *hai* is accepted; using *hain* where the sentence''s own subject is singular (or vice versa) is judged as a real grammar error, the exact contrast this unit''s own grammar_check exercises target -- not tolerated as a minor typo.'
  garm_invariant_thanda_agrees: '*Garm* ("hot") never changes for gender or number -- "mausam garm hai" always uses *garm*. *Thanda*/*thandi* ("cold") DOES change with the noun''s gender, the same "-a"/"-i" pattern already taught for *bada*/*badi* (unit 14) -- masculine *mausam* takes *thanda*, a feminine noun would take *thandi*. Every exercise in this unit pairs *thanda*/*thandi* with *mausam* only, so only *thanda* is ever actually required as a typed answer here; a typed answer using the wrong gender form where one IS tested is marked incorrect as a real grammar error, not tolerated as a typo.'
  kal_context_ambiguity: '*Kal* means both "yesterday" (as taught in units 4/12) and "tomorrow" (as used throughout this unit) -- genuinely ambiguous in real Hindi, disambiguated only by the sentence''s own tense/context. This unit''s own sentences are all future/plan-making in context, so *kal* consistently means "tomorrow" here; don''t mark a learner''s own free sentence wrong merely for using *kal* to mean "yesterday" in a DIFFERENT context than this unit''s own scenario, since both meanings are equally correct Hindi.'
  suggestion_pattern: '"Chalo" + a habitual-plural verb form (e.g. *jaate hain*, *chalte hain*) makes a "Let''s ___" suggestion, the same pattern already used for "chalo, kuch khaate hain!" (unit 6) and "chalo, kuch kharidte hain!" (unit 7). *Jaate hain* here is the same "-te hain" habitual form applied to *jaana* ("to go," unit 15''s infinitive), not a new verb.'
  punctuation: Hindi text is shown with the traditional danda (।) as the sentence-final mark. In typed answers, accept the danda, a plain period (.), or the mark omitted entirely as equivalent. Question marks (?) may likewise be omitted, but the fully punctuated form remains the model answer.
  spoken_answers: Judge spoken responses by intelligibility rather than written punctuation. For any exercise asking the learner to describe today's or tomorrow's weather, accept any of this unit's taught phrasings that fit the prompt, not only the single model sentence given in `accepted_answers`.
course:
  title: Хинди A1
units:
  hi.a1.unit19.weather:
    title: Погода
lessons:
  hi.a1.unit19.lesson01.mausam_dhoop_baarish_hawa:
    title: 'Погода: солнце, дождь и ветер'
  hi.a1.unit19.lesson02.garam_thanda_baadal:
    title: Жарко, холодно и облака
  hi.a1.unit19.lesson03.priya_arjun_kal_ka_mausam:
    title: 'Прия и Арджун: какая погода завтра?'
teaching:
  hi.a1.unit19.lesson01.teach.aaj_review:
    title: 'Повторение: сегодня'
    gloss: сегодня
    note: Слово впервые встречалось в уроке 3 и постоянно используется в этом разделе вместе со словом *kal* («завтра») из урока 3.
    example_gloss: Сегодня третье число.
  hi.a1.unit19.lesson01.teach.mausam:
    title: Погода
    gloss: погода
    note: Новое существительное, тема всего раздела. Мужского рода — см. грамматические заметки этого раздела о согласовании по роду.
    example_gloss: Какая сегодня погода?
  hi.a1.unit19.lesson01.teach.kaisa_review:
    title: 'Повторение: какой / каково'
    gloss: какой / каково
    note: Слово впервые встречалось в разделе 12; здесь оно используется, чтобы спросить о погоде.
    example_gloss: Какой у тебя дом?
  hi.a1.unit19.lesson01.teach.hai_hain_review:
    title: 'Повторение: есть (ед. и мн. ч.)'
    gloss: есть (ед. ч.), есть (мн. ч.)
    note: Пара связок для единственного и множественного числа, на которой строится вся модель описания погоды в этом разделе.
    example_gloss:
    - Сегодня хорошая погода.
    - В доме три комнаты.
  hi.a1.unit19.lesson01.teach.dhoop:
    title: Солнце / солнечный свет
    gloss: солнце / солнечный свет
    note: 'Новое существительное. Используется в простой конструкции с «есть»: *aaj dhoop hai* = «сегодня солнечно» (буквально «сегодня есть солнце»).'
    example_gloss: Сегодня солнечно.
  hi.a1.unit19.lesson01.teach.baarish:
    title: Дождь
    gloss: дождь
    note: 'Новое существительное. Используется в простой конструкции с «есть»: *aaj baarish hai* = «сегодня идёт дождь».'
    example_gloss: Сегодня идёт дождь.
  hi.a1.unit19.lesson01.teach.hawa:
    title: Ветер
    gloss: ветер
    note: 'Новое существительное. Используется в простой конструкции с «есть»: *aaj hawa hai* = «сегодня ветрено».'
    example_gloss: Сегодня ветрено.
  hi.a1.unit19.lesson01.teach.grammar_mausam_existential:
    title: Конструкция для описания погоды
    gloss: 'Чтобы описать погоду, говорят «aaj/kal + [слово о погоде] + hai», например: ''aaj dhoop hai'', ''aaj baarish hai'', ''aaj hawa hai''. Это та же модель с hai/hain, которую ты уже выучил(а) для дома (раздел 18), но здесь без числительного, прямо в роли подлежащего.'
    note: 'Первая грамматическая заметка этого раздела: она связывает новые слова с уже знакомой моделью предложения.'
  hi.a1.unit19.lesson02.teach.mausam_review:
    title: 'Повторение: погода'
    gloss: погода
    note: Слово уже встречалось в уроке 1 этого раздела.
    example_gloss: Какая сегодня погода?
  hi.a1.unit19.lesson02.teach.garam:
    title: Жарко
    gloss: жарко
    note: Новое прилагательное. Не меняется по роду — см. грамматическую заметку этого урока.
    example_gloss: Сегодня жаркая погода.
  hi.a1.unit19.lesson02.teach.thanda_thandi:
    title: Холодный (м. р. / ж. р.)
    gloss: холодный (м. р.), холодная (ж. р.)
    note: 'Новое прилагательное. В отличие от *garm*, оно МЕНЯЕТСЯ по роду: с существительным мужского рода *mausam* стоит *thanda*, с существительными женского рода (как *rasoi*, раздел 18) — *thandi*. См. грамматическую заметку этого урока.'
    example_gloss:
    - Сегодня холодная погода.
    - Сегодня на кухне холодно.
  hi.a1.unit19.lesson02.teach.grammar_garam_thanda:
    title: Неизменяемые и согласуемые по роду прилагательные
    gloss: '«Garm» — прилагательное, оканчивающееся на согласный, и по роду не меняется: в ''mausam garm hai'' всегда стоит ''garm''. А ''thanda''/''thandi'' — прилагательное на «-a», которое МЕНЯЕТСЯ по роду, как ''bada''/''badi'' (раздел 14): с существительным мужского рода ''mausam'' стоит ''thanda'', с существительным женского рода — ''thandi''.'
    note: 'Главное грамматическое противопоставление раздела: новая пара прилагательных связана с правилом из раздела 14, которое ты уже знаешь.'
  hi.a1.unit19.lesson02.teach.baadal:
    title: Облако / облака
    gloss: облако / облака
    note: 'Новое существительное. В этом разделе используется только во множественном числе в конструкции с «есть»: *aaj baadal hain* = «сегодня есть облака» / «сегодня облачно».'
    example_gloss: Сегодня облачно.
  hi.a1.unit19.lesson02.teach.accha_review:
    title: 'Повторение: хороший'
    gloss: хороший
    note: Слово впервые встречалось в разделе 9; здесь оно используется для описания погоды.
    example_gloss: Сегодня хорошая погода.
  hi.a1.unit19.lesson02.teach.bura:
    title: Плохой
    gloss: плохой
    note: Новое прилагательное, противоположное уже знакомому *accha* («хороший»). В этом разделе используется только в мужском роде, как и *mausam*.
    example_gloss: Сегодня плохая погода.
  hi.a1.unit19.lesson02.teach.bahut_review:
    title: 'Повторение: очень'
    gloss: очень
    note: Слово впервые встречалось в разделе 6; здесь оно усиливает описание погоды.
    example_gloss: Сегодня очень холодно.
  hi.a1.unit19.lesson03.teach.kal_review:
    title: 'Повторение: завтра (а также: вчера)'
    gloss: завтра (в зависимости от контекста может значить и «вчера»)
    note: Слово впервые встречалось в разделе 4, а в разделе 12 использовалось в значении «вчера». В настоящем хинди оно действительно двузначно, и значение определяется только по контексту. Все предложения этого раздела относятся к будущему и планам, поэтому здесь kal значит «завтра».
    example_gloss: Завтра будет дождь.
  hi.a1.unit19.lesson03.teach.ghar_review:
    title: 'Повторение: дом'
    gloss: дом / домой
    note: Слово впервые встречалось в разделе 8; здесь оно используется в итоговом плане (остаться дома).
    example_gloss: Это дом.
  hi.a1.unit19.lesson03.teach.mein_review:
    title: 'Повторение: в / на'
    gloss: в / на
    note: Слово впервые встречалось в разделе 1; здесь оно используется в сочетании «ghar mein» («дома»).
    example_gloss: В доме три комнаты.
  hi.a1.unit19.lesson03.teach.hum_review:
    title: 'Повторение: мы'
    gloss: мы
    note: Слово впервые встречалось в разделе 11; здесь оно выступает подлежащим в плане этого урока.
    example_gloss: Мы смотрим фильм.
  hi.a1.unit19.lesson03.teach.rehte_hain_review:
    title: 'Повторение: [они/мы] остаёмся / живём'
    gloss: '[они/мы] остаёмся / живём'
    note: Впервые встречалось в разделе 5 (с подлежащим «дедушка» в единственном числе — через уважительное согласование с формой мужского рода множественного числа). Здесь форма впервые используется с настоящим множественным подлежащим hum («мы») — та же форма, но проще.
    example_gloss: Мой дедушка живёт в Дели.
  hi.a1.unit19.lesson03.teach.chalo_review:
    title: 'Повторение: давай / пойдём'
    gloss: давай / пойдём
    note: Впервые встречалось в разделе 1, а в разделах 6, 7 и 11 использовалось с глаголом в форме привычного действия во множественном числе в значении «Давай ___». Здесь оно используется так же.
    example_gloss: Давай что-нибудь поедим!
  hi.a1.unit19.lesson03.teach.jaana_review:
    title: 'Повторение: идти / ходить'
    gloss: идти / ехать
    note: Впервые встречалось в разделе 15 как простой инфинитив. В этом уроке оно расширяется до формы привычного действия во множественном числе 'jaate hain' («мы идём»), образованной так же, как 'dekhte hain'/'peete hain' в разделе 11.
    example_gloss: Мне нужно на вокзал.
  hi.a1.unit19.lesson03.teach.aur_review:
    title: 'Повторение: и'
    gloss: и
    note: Впервые встречалось в разделе 1; здесь оно соединяет завтрашнюю погоду и температуру.
    example_gloss: Завтра будет дождь и похолодает.
  hi.a1.unit19.lesson03.teach.bahar:
    title: Снаружи
    gloss: снаружи / на улицу
    note: Новое слово, нужное для итогового плана этого урока.
    example_gloss: Пойдём на улицу!
  hi.a1.unit19.lesson03.teach.jaate_hain_phrase:
    title: Пойдём на улицу!
    gloss: Пойдём на улицу!
    note: '''Chalo'' + форма привычного действия во множественном числе ''jaate hain'' (от ''jaana'', «идти») — та же модель «Давай ___», которая уже встречалась в разделах 1, 6, 7 и 11.'
  hi.a1.unit19.lesson03.teach.dialogue.line01:
    title: Арджун спрашивает Прию о погоде сегодня
    gloss: Прия, какая сегодня погода?
  hi.a1.unit19.lesson03.teach.dialogue.line02:
    title: Прия рассказывает о погоде сегодня
    gloss: Сегодня солнечно и жарко.
  hi.a1.unit19.lesson03.teach.dialogue.line03:
    title: Арджун предлагает выйти на улицу
    gloss: Отлично! Пойдём на улицу.
  hi.a1.unit19.lesson03.teach.dialogue.line04:
    title: Прия спрашивает о погоде завтра
    gloss: Хорошо! А какая погода завтра?
  hi.a1.unit19.lesson03.teach.dialogue.line05:
    title: Арджун рассказывает о погоде на завтра
    gloss: Завтра будет дождь, и погода будет холодной.
  hi.a1.unit19.lesson03.teach.dialogue.line06:
    title: Прия предлагает остаться дома
    gloss: Значит, завтра мы сидим дома?
  hi.a1.unit19.lesson03.teach.dialogue.line07:
    title: Арджун соглашается
    gloss: Да, завтра мы остаёмся дома.
  hi.a1.unit19.lesson03.teach.dialogue.line08:
    title: Прия соглашается
    gloss: Хорошо!
  hi.a1.unit19.lesson03.teach.grammar_summary:
    title: Три главных правила
    gloss: 'Три главных правила этого урока: (1) о погоде говорят так: ''aaj/kal + [слово о погоде] + hai/hain''; (2) ''garm'' не меняется по роду, а ''thanda''/''thandi'' меняется, как ''bada''/''badi''; (3) ''chalo'' + глагол во множественном числе привычного вида (например, ''jaate hain'') образует предложение: ''chalo, bahar jaate hain!''.'
    note: Итоговое резюме, объединяющее грамматику всего урока, как и обобщающие грамматические заметки уроков 15–18.
  hi.a1.unit19.lesson03.teach.weather_reading:
    title: Читаем о сегодняшнем и завтрашнем дне
    gloss: Сегодня жарко и солнечно. Пойдём гулять! Завтра будет дождь, и погода будет холодной. Завтра мы остаёмся дома.
    note: 'Короткий текст, повторяющий факты из диалога без новых сведений: он помогает научиться читать краткий прогноз погоды.'
    glosses:
      आज: сегодня
      मौसम: погода
      गर्म: жаркий, горячий
      धूप: солнечный свет, солнце
      चलो: давай, давайте
      बाहर: снаружи
      जाते: идти (от जाना)
      कल: завтра
      बारिश: дождь
      ठंडा: холодный
      रहते: оставаться, жить (от रहना)
