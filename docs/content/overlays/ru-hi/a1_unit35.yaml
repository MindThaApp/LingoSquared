  hi.a1.unit35.lesson06.teach.priya_mujhe_maisej:
    title: Прия подтверждает план
    gloss: 'Прия: Я вижу сообщение. Давайте в субботу в десять позанимаемся спортом в парке?'
  hi.a1.unit35.lesson06.teach.arjun_han_aur:
    title: Арджун подтверждает погоду
    gloss: 'Арджун: Да, и в субботу будет солнечно!'
  hi.a1.unit35.lesson06.teach.vikram_tab_main:
    title: План Викрама
    gloss: 'Викрам: Тогда я пойду бегать. А после этого ещё и поиграю в футбол.'
    note: '*उसके बाद* («после этого») начинает второй шаг, а *भी* значит «тоже, ещё».'
  hi.a1.unit35.lesson06.teach.neha_mujhe_tairna:
    title: План Неха
    gloss: 'Неха: Я больше люблю плавать, но в парк тоже приду.'
    note: Предпочтение выражается конструкцией *मुझे ... पसंद है*, а *ज़्यादा* добавляет «больше».
  hi.a1.unit35.lesson06.teach.priya_barhiya_shanivar:
    title: Прия завершает разговор
    gloss: 'Прия: Отлично! Встречаемся в субботу в парке!'
    note: Одной фразой завершает переписку этого урока и план из темы спорта.
