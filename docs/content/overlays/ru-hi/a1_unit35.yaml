  hi.a1.unit35.lesson03.teach.chek_karna_men:
    title: Меняется только करना
    gloss: 'В *चेक करना* слово *चेक* остаётся прежним, а с лицом меняется только *करना*: *मैं चेक करता हूँ*, *तुम चेक करते हो*. С *इस्तेमाल करना* то же самое.'
    note: 'Многие хинди-глаголы состоят из существительного или заимствованного слова и *करना*: первое слово выучи один раз, а меняй только *करना*.'
