    gloss: 'Арджун: В субботу солнечно!'
    note: 'Подлежащего вроде «оно» нет: на хинди говорят *शनिवार को धूप है* («в субботу солнце есть»).'
  hi.a1.unit35.lesson04.teach.vikram_mujhe_maisej:
