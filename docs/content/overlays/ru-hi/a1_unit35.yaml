    gloss: 'Викрам: Я вижу сообщение. Встречаемся в субботу!'
  hi.a1.unit35.lesson04.teach.phir_milenge_yah:
    title: फिर मिलेंगे и день + को
    gloss: 'Ты уже знаешь *फिर मिलेंगे!* («до новых встреч»). Чтобы назвать день, поставь после него *को*: *शनिवार को मिलते हैं!*, *सोमवार को मिलते हैं!*'
    note: Модель прощания из темы приветствий переносится на конкретный день.
  hi.a1.unit35.lesson05.teach.priya_har_din:
    title: Кто чем пользуется?
    gloss: Прия каждый день звонит Арджуну. Она пользуется своим телефоном, а не приложением. У Арджуна дома нет компьютера, но он пользуется интернетом на телефоне. Викрам каждое утро смотрит прогноз погоды. Потом он идёт бегать. Неха часто отправляет Прие сообщения. А ты тоже каждый день пользуешься своим телефоном?
    note: Сравнивает, как четыре героя пользуются устройствами, по образцу сравнительного текста из темы спорта.
    glosses:
      कॉल: звонит
      हर: каждый
      दिन: день
      इस्तेमाल: пользуется
      फ़ोन: телефон
      ऐप: приложение
      कंप्यूटर: компьютер
      घर: дома
      इंटरनेट: интернет
      चेक: ищет, смотрит
      सुबह: утро
      अनुमान: прогноз погоды
      जाता: идёт
      दौड़ने: бегать
      भेजती: отправляет
      अक्सर: часто
      मैसेज: сообщение
      करते: пользуешься
  hi.a1.unit35.lesson05.teach.vikram_har_subah:
    title: Викрам каждое утро смотрит прогноз
    gloss: Викрам каждое утро смотрит прогноз погоды.
  hi.a1.unit35.lesson05.teach.neha_aksar_priya:
