teaching:
  hi.a1.unit32.lesson01.teach.janvar_paltoo_janvar:
    title: Животное, питомец
    gloss: животное / домашнее животное
    note: '*जानवर* — общее слово «животное», а *पालतू जानवर* («прирученное животное») означает домашнего питомца.'
    example_gloss:
    - Собака — это животное.
    - Собака — ещё и домашний питомец.
  hi.a1.unit32.lesson01.teach.kutta_billee:
    title: Собака и кот
    gloss: собака / кот
    example_gloss:
    - У Прии есть собака.
    - У Викрама есть кошка.
  hi.a1.unit32.lesson01.teach.machhlee_chiriya:
    title: Рыба и птица
    gloss: рыба / птица
    example_gloss:
    - У дедушки есть рыба.
    - У Нины есть птица.
  hi.a1.unit32.lesson01.teach.kya_tumhare_pas:
    title: У тебя есть питомец?
    gloss: У тебя есть питомец?
    note: '*तुम्हारे पास ... है?* («у тебя ... есть?») спрашивает «есть ли у тебя ...?», а *कोई* («какой-нибудь») оставляет вопрос открытым.'
  hi.a1.unit32.lesson01.teach.han_mere_pas:
    title: Да, у меня есть собака
    gloss: Да, у меня есть собака.
    note: Простой утвердительный ответ с новой лексикой этого раздела.
  hi.a1.unit32.lesson01.teach.naheen_mere_pas:
    title: Нет, у меня нет питомца
    gloss: Нет, у меня нет питомца.
    note: '*कोई ... नहीं है* («нет никакого ...») значит, что у тебя этого нет.'
  hi.a1.unit32.lesson01.teach.mere_pas_koee:
    title: कोई ... नहीं
    gloss: У меня нет домашнего животного.
    note: '*कोई* («какой-нибудь») с *नहीं है* отрицает наличие чего-либо: *मेरे पास कोई पालतू जानवर नहीं है*.'
  hi.a1.unit32.lesson02.teach.ghumane_le_jana:
    title: Выгуливать (животное)
    gloss: выгуливать (животное)
    note: '*घुमाने ले जाना* («вести гулять») — так в хинди говорят «выгуливать животное»; после *घुमाने* идёт *ले जाना*.'
    example_gloss: Я выгуливаю собаку каждый день.
  hi.a1.unit32.lesson02.teach.vah_kutte_ko:
    title: घुमाने ले जाना
    gloss: Она выгуливает собаку.
    note: Животное стоит с *को* (*कुत्ते को*), а *घुमाने ले जाती है* стоит в конце; *ले जाना* («вести с собой») остаётся из двух слов вместе.
  hi.a1.unit32.lesson02.teach.khana_dena:
    title: Кормить
    gloss: кормить
    example_gloss: Я кормлю кошку каждый день.
  hi.a1.unit32.lesson02.teach.ke_sath_khelna:
    title: Играть с
    gloss: играть с
    example_gloss: Викрам играет со своей кошкой.
  hi.a1.unit32.lesson02.teach.main_roz_kutte:
    title: Я выгуливаю собаку каждый день
    gloss: Я выгуливаю собаку каждый день.
    note: '*रोज़* («каждый день») стоит перед дополнением: *रोज़ कुत्ते को घुमाने ले जाता हूँ*.'
  hi.a1.unit32.lesson02.teach.main_roz_billee:
    title: Я кормлю кота каждый день
    gloss: Я кормлю кота каждый день.
    note: '*खाना देना* («давать еду») указывает, кто получает еду, с помощью *को*: *बिल्ली को खाना देता हूँ*.'
  hi.a1.unit32.lesson03.teach.ek_kutta_do:
    title: Формы множественного числа
    gloss: Одна собака, две собаки; одна кошка, две кошки. Существительное мужского рода на *-आ* в множественном числе меняет окончание на *-ए* (*कुत्ता* → *कुत्ते*), а существительное женского рода на *-ई* принимает *-याँ* (*बिल्ली* → *बिल्लियाँ*).
    note: Правильная модель образования множественного числа в хинди; здесь она впервые показана на названиях животных.
  hi.a1.unit32.lesson03.teach.kutte_billiyan:
    title: Собаки и кошки
    gloss: собаки / коты
    example_gloss:
    - Арджун любит собак.
    - Неха любит кошек.
  hi.a1.unit32.lesson03.teach.machhliyan_chiriyan:
    title: Рыбы и птицы
    gloss: рыбы / птицы
    example_gloss:
    - Я обожаю рыбок.
    - Дедушка обожает птиц.
  hi.a1.unit32.lesson03.teach.mujhe_janvar_bahut:
    title: Я обожаю животных
    gloss: Я обожаю животных.
    note: '*मुझे जानवर बहुत पसंद हैं* (буквально: «мне животные очень нравятся») значит «Я обожаю животных»; *हैं* стоит во множественном числе, потому что *जानवर* во множественном числе.'
  hi.a1.unit32.lesson03.teach.neha_ko_billiyan:
    title: Неха обожает кошек, но у неё нет питомца
    gloss: Неха обожает кошек, но у неё нет домашнего животного.
    note: 'Готовит противопоставление, на котором построен текст для чтения: любить животных и иметь питомца.'
  hi.a1.unit32.lesson04.teach.arjun_kya_tumhare:
    title: Арджун спрашивает о питомце
    gloss: 'Арджун: У тебя есть домашнее животное, Прия?'
  hi.a1.unit32.lesson04.teach.priya_han_mere:
    title: У Прии есть собака
    gloss: 'Прия: Да, у меня есть собака.'
  hi.a1.unit32.lesson04.teach.arjun_vah_kaisa:
    title: Арджун спрашивает, как он выглядит
    gloss: 'Арджун: Как он выглядит?'
    note: '*वह कैसा दिखता है?* можно сказать и о животных; *कैसा* стоит в мужском роде, потому что собака — самец.'
  hi.a1.unit32.lesson04.teach.priya_uske_bal:
    title: Прия описывает свою собаку
    gloss: 'Прия: У него коричневая шерсть, и он маленький.'
    note: Слова о цвете волос и размере из раздела о внешности, но теперь они описывают шерсть животного, а не волосы человека.
  hi.a1.unit32.lesson04.teach.vah_mera_kutta:
    title: वह для животных
    gloss: Это моя собака. Он мне очень нравится.
    note: '*वह* и *उसे* употребляются и для животных, и для людей; отдельного слова для «оно» в таких случаях в хинди нет.'
  hi.a1.unit32.lesson04.teach.arjun_kya_tum:
    title: Арджун спрашивает о прогулках
    gloss: 'Арджун: Ты гуляешь с ним каждый день?'
  hi.a1.unit32.lesson04.teach.priya_han_main:
    title: Прия рассказывает о своём распорядке
    gloss: 'Прия: Да, я гуляю с ним каждый день и кормлю его.'
  hi.a1.unit32.lesson05.teach.arjun_aur_neha:
    title: Арджун, Неха и Викрам о животных
    gloss: 'Арджун и Неха оба обожают животных, но ни у одного из них нет питомца. Арджун обожает собак, а Неха — кошек. А вот у Викрама есть питомец: кошка. Он часто играет со своей кошкой и каждый день кормит её. А у тебя есть домашнее животное?'
    note: Противопоставляет любовь к животным и наличие собственного питомца — в этом коммуникативный смысл всего раздела.
    glosses:
      पसंद: обожать
      दोनों: оба
      जानवर: животные
      किसी: любой из них
      पालतू: питомец
      कुत्ते: собаки
      बिल्लियाँ: коты
      बिल्ली: кот
      खेलता: играет
      देता: даёт
      रोज़: каждый
      खाना: еда
  hi.a1.unit32.lesson05.teach.vikram_aksar_apnee:
    title: Викрам часто играет со своей кошкой
    gloss: Викрам часто играет со своей кошкой.
    note: '*अक्सर* («часто») стоит перед глаголом, а *अपनी* согласуется с существительным женского рода *बिल्ली*.'
  hi.a1.unit32.lesson05.teach.mujhe_kutte_bahut:
    title: Я обожаю собак. У меня нет питомца.
    gloss: Я обожаю собак. У меня нет питомца.
    note: Образец ответа из двух предложений, который можно использовать в письменном задании раздела.
  hi.a1.unit32.lesson06.teach.priya_neena_kya:
    title: Прия спрашивает Ниру
    gloss: 'Прия: Нина, а у тебя тоже есть домашнее животное?'
  hi.a1.unit32.lesson06.teach.neena_han_mere:
    title: У Nina есть птица по имени Pico
    gloss: 'Nina: Да, у меня есть птица. Её зовут Pico.'
    note: '*उसका नाम पिको है* («его зовут Пико») содержит *का*, потому что *नाम* — существительное мужского рода.'
  hi.a1.unit32.lesson06.teach.arjun_vah_kitna:
    title: Реакция Арджуна
    gloss: 'Арджун: Ух ты, как здорово! Что ты делаешь с ним каждый день?'
  hi.a1.unit32.lesson06.teach.neena_main_use:
    title: Nina кормит птицу каждый день
    gloss: 'Nina: Я кормлю его каждый день.'
  hi.a1.unit32.lesson06.teach.arjun_mujhe_bhee:
    title: Арджун тоже обожает птиц
    gloss: 'Арджун: Я тоже обожаю птиц.'
  hi.a1.unit32.lesson06.teach.priya_kitna_achchha:
    title: Прия завершает разговор
    gloss: 'Прия: Как здорово, что все мы трое обожаем животных!'
    note: Подводит итог всем фактам о животных, которые рассказали три героя раздела.
