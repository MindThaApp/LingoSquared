    title: Строим планы
lessons:
  hi.a1.unit11.lesson01.prastaav_aur_sweekriti:
    title: Смотрим фильм, пьём чай
  hi.a1.unit11.lesson02.hum_kab_milte_hain:
    title: Когда мы встретимся?
  hi.a1.unit11.lesson03.priya_arjun_yojana:
    title: 'Прия и Арджун: план'
teaching:
  hi.a1.unit11.lesson01.teach.review_chai_kaafi:
    title: 'Повторение: чай, кофе'
    gloss: чай, кофе
    note: Быстрое повторение слов для напитков из 6-го урока — в этом уроке они пригодятся, чтобы предлагать планы.
    example_gloss:
    - Я хочу чай.
    - Я хочу кофе.
  hi.a1.unit11.lesson01.teach.filma:
    title: Фильм
    gloss: фильм
    note: Новое существительное для темы этого урока — составление планов.
    example_gloss: Этот фильм хороший.
  hi.a1.unit11.lesson01.teach.dekhna:
    title: Мы смотрим / давай посмотрим
    gloss: (мы) смотрим / давай посмотрим
    note: Форма множественного числа глагола «dekhna» (смотреть) в значении привычного действия; здесь она используется, чтобы предложить занятие вместе.
    example_gloss: Мы смотрим фильм.
  hi.a1.unit11.lesson01.teach.chalo_film_phrase:
    title: Давай посмотрим фильм!
    gloss: Давай посмотрим фильм!
    note: «Chalo» + глагол во множественном числе — обычный способ предложить что-то сделать вместе. Эта модель уже встречалась в уроках 1, 6 и 7 («chalo shuru karte hain», «chalo, kuch khaate hain», «chalo, kuch khareedte hain»); здесь она закрепляется и расширяется.
  hi.a1.unit11.lesson01.teach.saath:
    title: Вместе
    gloss: вместе
    note: Используется, чтобы предложить заняться чем-то вместе.
    example_gloss: Давай вместе посмотрим фильм!
  hi.a1.unit11.lesson01.teach.peena:
    title: Мы пьём / давай выпьем
    gloss: (мы) пьём / давай выпьем
    note: Форма множественного числа глагола «peena» (пить) в значении привычного действия; образуется так же, как «dekhte hain».
    example_gloss: Мы пьём чай.
  hi.a1.unit11.lesson01.teach.chalo_chai_phrase:
    title: Давай вместе выпьем чаю!
    gloss: Давай вместе выпьем чаю!
    note: Соединяет «saath» и «peete hain» из этого урока во второе предложение по той же модели с «chalo», что и предложение посмотреть фильм.
  hi.a1.unit11.lesson01.teach.chalo_grammar_note:
    title: Chalo + глагол на -te + hain = Давай ___
    gloss: 'Чтобы предложить что-то сделать вместе, скажи «chalo» + глагол на -te + hain: Давай посмотрим фильм! Давай вместе выпьем чаю!'
    note: Здесь модель сформулирована целиком; раньше она уже трижды встречалась мимоходом в предыдущих уроках.
  hi.a1.unit11.lesson01.teach.achha_vichar:
    title: Хорошая идея!
    gloss: Хорошая идея!
    note: Готовая фраза, чтобы с радостью принять предложение.
  hi.a1.unit11.lesson02.teach.vyast:
    title: Занятой
    gloss: занятой
    note: Новое прилагательное; употребляется с уже знакомой связкой (hoon/ho/hai), чтобы сказать, что ты занят.
    example_gloss: Сегодня я занят.
  hi.a1.unit11.lesson02.teach.maaf_karna:
    title: Простите / извините
    gloss: простите / извините
    note: Устойчивое вежливое выражение, смягчающее отказ.
    example_gloss: Простите, я занят.
  hi.a1.unit11.lesson02.teach.maaf_vyast_phrase:
    title: Простите, я занят.
    gloss: Простите, я занят.
    note: Простая фраза для отказа, соединяющая два новых выражения этого урока.
  hi.a1.unit11.lesson02.teach.mujhe_kaam_hai:
    title: У меня есть работа.
    gloss: У меня есть работа.
    note: Использует модель «mujhe...hai» («у меня есть...»), похожую на ранее изученную «mujhe...chahiye» («мне нужно / я хочу»); здесь она называет причину отказа.
  hi.a1.unit11.lesson02.teach.decline_grammar_note:
    title: Как вежливо отказаться
    gloss: Чтобы вежливо отказаться от предложения, скажи «maaf karna» («простите»), а затем назови своё положение (например, «я занят») или причину (например, «у меня есть работа»).
    note: Здесь намеренно используется уже изученная грамматика (связка и конструкция принадлежности с дательным падежом), а не новая конструкция со значением «могу».
  hi.a1.unit11.lesson02.teach.hum_pronoun:
    title: Мы
    gloss: мы
    note: 'Первое в курсе местоимение первого лица множественного числа. Форма привычного действия (-te + hain) та же, что уже изучена для ve («они»): нового спряжения нет, только новое местоимение. (Tum тоже берёт -te, но с «ho»: tum milte ho.)'
    example_gloss: Мы встречаемся каждый день.
  hi.a1.unit11.lesson02.teach.kab_milte_phrase:
    title: Когда мы встретимся?
    gloss: Когда мы встретимся?
    note: Соединяет «hum» с «kab» (урок 10) и «milte hain» (встречается с первого урока в прощаниях, обычно без подлежащего).
  hi.a1.unit11.lesson02.teach.din_review:
    title: 'Повторение: суббота, воскресенье'
    gloss: суббота, воскресенье
    note: Быстрое повторение двух названий дней недели из 3-го урока; они нужны, чтобы назначить встречу.
    example_gloss:
    - Сегодня суббота.
    - Завтра воскресенье.
  hi.a1.unit11.lesson02.teach.samay_review:
    title: 'Повторение: 4 часа, который час'
    gloss: в 4 часа, во сколько
    note: Быстрое повторение слов о времени из 4-го урока; они нужны, чтобы назначить встречу.
    example_gloss:
    - Сейчас 4 часа.
    - Который сейчас час?
  hi.a1.unit11.lesson02.teach.kya_ravivar_thik_phrase:
    title: Воскресенье подойдёт?
    gloss: Воскресенье подойдёт?
    note: Снова используется «kya» как признак вопроса «да/нет», уже знакомый с 1-го урока («kya yeh tumhari pahli baar hai?», «kya tum yoga karti ho?»), а не новое вопросительное слово «в какой день».
  hi.a1.unit11.lesson03.teach.sandesh:
    title: Сообщение
    gloss: сообщение
    note: Новое существительное; используется в части урока о письменном приглашении.
    example_gloss: Это сообщение от Арджуна.
  hi.a1.unit11.lesson03.teach.dialogue.line01:
    title: Арджун предлагает фильм в субботу
    gloss: Прия, давай в субботу посмотрим фильм?
  hi.a1.unit11.lesson03.teach.dialogue.line02:
    title: Прия отказывается и называет причину
    gloss: Простите, в субботу я занята. У меня работа.
  hi.a1.unit11.lesson03.teach.dialogue.line03:
    title: Арджун спрашивает, когда можно встретиться
    gloss: Хорошо. Когда мы встретимся?
  hi.a1.unit11.lesson03.teach.dialogue.line04:
    title: Прия предлагает воскресенье
    gloss: Воскресенье подойдёт? Давай вместе выпьем чаю!
  hi.a1.unit11.lesson03.teach.dialogue.line05:
    title: Арджун соглашается и спрашивает про время
    gloss: Хорошая идея! Во сколько в воскресенье?
  hi.a1.unit11.lesson03.teach.dialogue.line06:
    title: Прия предлагает время
    gloss: В четыре часа подойдёт?
  hi.a1.unit11.lesson03.teach.dialogue.line07:
    title: Арджун подтверждает
    gloss: Да, в четыре часа подойдёт. Тогда увидимся!
  hi.a1.unit11.lesson03.teach.dialogue.line08:
    title: Прия завершает разговор
    gloss: Хорошо, до воскресенья!
  hi.a1.unit11.lesson03.teach.invitation_message:
    title: Сообщение Прии
    gloss: Привет, Арджун, давай встретимся в воскресенье в 4 и выпьем чаю. Хорошо? — Прия
    note: Короткое письменное приглашение, повторяющее план, который только что подтвердили в диалоге.
    glosses:
      चलो: давай
      रविवार: воскресенье
      मिलते: встречаемся (от मिलना)
      चाय: чай
      पीते: пьём (от पीना)
      ठीक: хорошо / ладно
