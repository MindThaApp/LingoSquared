answer_policy:
  gender_agreement: This unit's central grammar point is subject-gender agreement on past- tense verbs (था/थी, गया/गई, मिला/मिली). Typed answers that use the wrong-gender form for a NAMED subject whose gender is already established (Arjun = masculine, Priya = feminine) should be marked incorrect -- this is the exact point being tested. For open-ended "describe your own day" prompts (writing_prompt/speak_response) where the learner's own gender isn't known, accept either gender's form as equally correct.
  intransitive_only: This unit deliberately teaches only intransitive past-tense verbs (जाना -> गया/गई, मिलना -> मिला/मिली) plus the copula (था/थी) -- no ने-marked transitive past tense (e.g. "मैंने खाना खाया") appears anywhere in this unit's accepted answers, by design.
  nasalization_marks: Display and teach the correct chandrabindu/anusvara distinction. This unit introduces no new nasalized vocabulary at all -- the only nasalized forms used anywhere in this unit are हूँ/हैं and वहाँ, all reused unchanged from their already-settled spellings. In typed A1 answers, accept a variant that drops a nasalization mark entirely or substitutes anusvara for chandrabindu (or vice versa) when every other character is correct. Do not extend this tolerance to a wrong vowel or consonant, which changes the actual word.
  punctuation: Hindi text is shown with the traditional danda (।) as the sentence-final mark. In typed answers, accept the danda, a plain period (.), or the mark omitted entirely as equivalent. Question marks (?), exclamation marks, and commas may likewise be omitted, but the fully punctuated form remains the model answer.
  spoken_answers: Judge spoken responses by intelligibility rather than written punctuation or nasalization marks. For any exercise asking the learner to describe their own recent day, accept any of this unit's taught phrasings that fit the prompt, not only the single model sentence given in `accepted_answers`.
course:
  title: Хинди A1
units:
  hi.a1.unit12.past_events:
    title: Вчера
lessons:
  hi.a1.unit12.lesson01.tha_thi:
    title: Как прошёл вчерашний день?
  hi.a1.unit12.lesson02.gaya_gai_mila_mili:
    title: Я ходил(а) на рынок
  hi.a1.unit12.lesson03.arjun_priya_kal:
    title: 'Арджун и Прия: вчера'
teaching:
  hi.a1.unit12.lesson01.teach.vyast_review:
    title: 'Повторение: занятой'
    gloss: занятой
    note: Краткое повторение прилагательного из 11-го урока — в этом уроке оно пригодится для отработки нового прошедшего времени связки.
    example_gloss: Арджун занят.
  hi.a1.unit12.lesson01.teach.tha_thi:
    title: Был / была
    gloss: был, была
    note: Прошедшее время связки (есть/являюсь/являешься), прямое соответствие hai/hoon/hain. «Tha» согласуется с подлежащим мужского рода, «thi» — с подлежащим женского рода.
    example_gloss:
    - Арджун вчера был занят.
    - Прия вчера была занята.
  hi.a1.unit12.lesson01.teach.tha_thi_grammar:
    title: Tha и thi
    gloss: '«Tha» употребляется с подлежащим мужского рода, «thi» — с подлежащим женского рода. Они стоят там же, где стоит «hai», но, в отличие от «hai», меняются по роду: Арджун занят, Арджун был занят, Прия была занята.'
    note: 'Явно описана модель согласования по роду: уже знакомая парадигма связки продолжается в прошедшем времени.'
  hi.a1.unit12.lesson01.teach.kal_review:
    title: 'Повторение: вчера'
    gloss: вчера
    note: Слово изучалось в 4-м уроке, где было отмечено, что «kal» значит и «завтра», и «вчера», а различается только по времени глагола. В этом уроке впервые используется значение «вчера».
    example_gloss: Вчера была суббота.
  hi.a1.unit12.lesson01.teach.kaisa:
    title: Какой (мужской род)
    gloss: какой
    note: 'Дополняет парадигму, две трети которой уже известны: «kaise» и «kaisi» (из «как дела?» 1-го урока). Это недостающая форма мужского рода единственного числа, она употребляется с такими словами, как «din» (день).'
    example_gloss: Каким был день?
  hi.a1.unit12.lesson01.teach.kal_kaisa_tha_phrase:
    title: Как прошёл вчерашний день?
    gloss: Как прошёл вчерашний день?
    note: Главный повторяющийся вопрос этого урока, объединяющий все слова, изученные до сих пор.
  hi.a1.unit12.lesson01.teach.din_achha_tha_phrase:
    title: День был хороший.
    gloss: День был хороший.
    note: Готовый ответ на вопрос «Как прошёл вчерашний день?» в мужском роде (din — мужского рода).
  hi.a1.unit12.lesson01.teach.filma_achi_thi:
    title: Фильм был хороший.
    gloss: Фильм был хороший.
    note: Та же модель с подлежащим женского рода (film — женского рода); возвращение к лексике 11-го урока.
  hi.a1.unit12.lesson01.teach.kaisa_kaisi_grammar:
    title: Kaisa, kaisi, kaise
    gloss: «Kaisa» употребляется с подлежащим мужского рода в единственном числе (Каким был день?), «kaisi» — с подлежащим женского рода (Каким был чай?), а «kaise» — с aap/tum, когда спрашивают мужчину (Как у вас дела?; женщину спрашивают «aap kaisi hain?»). Все три — формы одного слова.
    note: 'Впервые собрана вся парадигма: kaise/kaisi были известны с 1-го урока, kaisa — новая форма этого урока.'
  hi.a1.unit12.lesson02.teach.names_mai_review:
    title: 'Повторение: я, Арджун, Прия'
    gloss: я, Арджун, Прия
    note: Краткое повторение перед примерами прошедшего времени в первом лице.
    example_gloss:
    - Я Арджун.
    - Я Прия.
  hi.a1.unit12.lesson02.teach.jaana_gaya_gai:
    title: Пошёл / пошла
    gloss: пошёл, ходил
    note: Прошедшее время глагола «jaana» (идти, ехать); тот же корень, что в повелительной форме «jao» (иди!) из 9-го урока. Согласуется с подлежащим по роду, как «tha»/«thi».
    example_gloss:
    - Арджун пошёл на рынок.
    - Прия пошла домой.
  hi.a1.unit12.lesson02.teach.jaana_grammar:
    title: Gaya/gai — прошедшее от jaana
    gloss: «Gaya»/«gai» — прошедшее время глагола «jaana» (идти, ехать; jao из 9-го урока). Оно меняется по роду подлежащего, как «tha»/«thi».
    note: Новое прошедшее время явно связано с уже известным корнем повелительной формы.
  hi.a1.unit12.lesson02.teach.bazaar_ghar_review:
    title: 'Повторение: рынок, дом'
    gloss: рынок, дом
    note: Краткое повторение двух слов-мест из 7–8-го уроков; они нужны, чтобы сказать, куда кто-то ходил.
    example_gloss:
    - Это рынок.
    - Это дом.
  hi.a1.unit12.lesson02.teach.milna_mila_mili:
    title: Встретил / встретила
    gloss: встретил
    note: Прошедшее время глагола «milna» (встречаться, встретить); тот же корень, что в привычном «milte hain» (концовки уроков 1/4/10/11). Согласуется с подлежащим по роду.
    example_gloss:
    - Арджун встретил Прию.
    - Прия встретила Арджуна.
  hi.a1.unit12.lesson02.teach.milna_se_grammar:
    title: Se здесь значит «с», а не «из»
    gloss: 'Здесь «se» не значит «из»: «X se milna» — «встретиться С X», тогда как в «main Bharat se hoon» то же слово «se» значило «из».'
    note: Это настоящее двойное употребление уже известного слова, о котором сказано прямо.
  hi.a1.unit12.lesson02.teach.wahan_review:
    title: 'Повторение: там'
    gloss: там
    note: Краткое повторение из 8–9-го уроков; здесь слово нужно, чтобы сказать, где была встреча.
    example_gloss: Школа там.
  hi.a1.unit12.lesson02.teach.kal_bazaar_gaya_phrase:
    title: Вчера я ходил на рынок.
    gloss: Вчера я ходил на рынок.
    note: Новое прошедшее время сочетается со словом «kal» из первого урока.
  hi.a1.unit12.lesson02.teach.wahan_priya_se_mila_phrase:
    title: Я встретил там Прию.
    gloss: Я встретил там Прию.
    note: «Mila» сочетается с «se» («с») и «wahan» (там).
  hi.a1.unit12.lesson02.teach.saath_review:
    title: 'Повторение: вместе'
    gloss: вместе
    note: Краткое повторение из 11-го урока.
    example_gloss: Мы вместе пьём чай.
  hi.a1.unit12.lesson03.teach.chai_dukaan_khana_review:
    title: 'Повторение: чай, магазин, еда'
    gloss: чай, магазин, еда
    note: Краткое повторение трёх существительных из 6–7-го уроков; они нужны для диалога и заметки для чтения в этом уроке.
    example_gloss:
    - Чай хороший.
    - Магазин хороший.
    - Еда хорошая.
  hi.a1.unit12.lesson03.teach.ka_kaisi_review:
    title: 'Повторение: «of» (ka), какая (женский род)'
    gloss: принадлежность, «-ский» (ka); какая (женский род, kaisi)
    note: «Ka» (из «kitne ka» и «raat ka khana» 10-го урока) и «kaisi» уже изучались; здесь они используются снова, это не новая грамматика.
    example_gloss:
    - Вчерашний день был хороший.
    - Какой была чайная?
  hi.a1.unit12.lesson03.teach.dialogue.line01:
    title: Арджун спрашивает, как прошёл вчерашний день
    gloss: Прия, как прошёл вчерашний день?
  hi.a1.unit12.lesson03.teach.dialogue.line02:
    title: Прия говорит, что было хорошо
    gloss: Очень хорошо! Мы встретились.
  hi.a1.unit12.lesson03.teach.dialogue.line03:
    title: Арджун упоминает рынок
    gloss: Да! Я ещё сначала ходил на рынок.
  hi.a1.unit12.lesson03.teach.dialogue.line04:
    title: Прия спрашивает про рынок
    gloss: Хорошо! Что было на рынке?
  hi.a1.unit12.lesson03.teach.dialogue.line05:
    title: Арджун отвечает
    gloss: Еда была хорошая.
  hi.a1.unit12.lesson03.teach.dialogue.line06:
    title: Прия спрашивает про чайную
    gloss: Хорошо! А какой была чайная?
  hi.a1.unit12.lesson03.teach.dialogue.line07:
    title: Арджун отвечает
    gloss: Чайная была очень хорошая.
  hi.a1.unit12.lesson03.teach.dialogue.line08:
    title: Прия заканчивает разговор
    gloss: Хорошо! Тогда встретимся завтра снова?
  hi.a1.unit12.lesson03.teach.mile_grammar:
    title: Tum/hum/ve принимают форму, похожую на множественное число
    gloss: 'С «tum», «hum» и «ve» в прошедшем времени используется та же форма, что в настоящем с «-te»: «the» (вместо «tha»), «gaye» (вместо «gaya»), «mile» (вместо «mila»). Например, «hum milte hain» → «hum mile».'
    note: Здесь показана более полная парадигма для понимания, но в упражнениях этого урока активно отрабатывается только «mile»; «the» и «gaye» нужно лишь узнавать, они встречаются только в этом пояснении.
  hi.a1.unit12.lesson03.teach.priya_note:
    title: Записка Прии
    gloss: Арджун, вчерашний день был очень хорошим. Еда была хорошая, и чайная тоже была хорошая. — Прия
    note: Короткая письменная записка, повторяющая факты из диалога, без новой лексики.
    glosses:
      कल: вчера
      दिन: день
      अच्छा: хороший (мужской род)
      था: был (мужской род)
      खाना: еда
      दुकान: магазин
      अच्छी: хорошая (женский род)
      थी: была (женский род)
