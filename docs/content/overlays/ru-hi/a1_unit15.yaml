answer_policy:
  mujhe_verb_hai: This unit's central grammar point is the दात-subject obligation construction "X + verb-infinitive + है" (मुझे/तुम्हें/हमें/आपको + infinitive + है = "X needs/has to ___"). A typed answer that drops है entirely, or that appends हैं instead of है (है is invariant here -- it agrees with the infinitive verb, not the दात subject), should be marked incorrect -- this is the exact point being tested.
  kitne_ka_gender: '"टिकट कितने का है?" (how much is the ticket) is taught with का, treating टिकट as masculine -- the same कितने का/की gender-agreement rule unit07 already established. Many native speakers also use टिकट as feminine (टिकट कितने की है?), so की with टिकट is ACCEPTED as a valid alternative wherever typed; plural के with one ticket is the error the grammar_check targets.'
  train_gender: ट्रेन is grammatically feminine, so every habitual-present verb form describing it in this unit uses जाती है, never जाता है. A typed answer using जाता है for the train should be marked incorrect as a real agreement error.
  nasalization_marks: Display and teach the correct chandrabindu/anusvara distinction. This unit's one new nasalized word, हमें, uses anusvara, verified against a direct codepoint check -- consistent with the already-established तुम्हें convention. In typed A1 answers, accept a variant that drops a nasalization mark entirely or substitutes anusvara for chandrabindu (or vice versa) when every other character is correct. Do not extend this tolerance to a wrong vowel or consonant, which changes the actual word.
  punctuation: Hindi text is shown with the traditional danda (।) as the sentence-final mark. In typed answers, accept the danda, a plain period (.), or the mark omitted entirely as equivalent. Question marks (?) may likewise be omitted, but the fully punctuated form remains the model answer.
  spoken_answers: Judge spoken responses by intelligibility rather than written punctuation or nasalization marks. For any exercise asking the learner to state their own travel request, accept any of this unit's taught phrasings that fit the prompt, not only the single model sentence given in `accepted_answers`.
course:
  title: Хинди A1
units:
  hi.a1.unit15.travel:
    title: Путешествие
lessons:
  hi.a1.unit15.lesson01.station_jana:
    title: Мне нужно на вокзал
  hi.a1.unit15.lesson02.platform_samay:
    title: Номер платформы и время
  hi.a1.unit15.lesson03.priya_arjun_station:
    title: 'Прия и Арджун: на вокзале'
teaching:
  hi.a1.unit15.lesson01.teach.station_mujhe_hai_review:
    title: 'Повторение: станция, мне, есть'
    gloss: станция, мне / для меня, есть
    note: Краткое повторение существительного-места и связки, которые нужны для конструкции долженствования в этом уроке.
    example_gloss:
    - Станция здесь.
    - У меня есть дело.
  hi.a1.unit15.lesson01.teach.jaana:
    title: Идти
    gloss: идти (инфинитив)
    note: Инфинитив глагола, который ты уже знаешь в форме повелительного наклонения для तुम — *jao* (урок 9). В этом уроке вводится сам инфинитив.
    example_gloss: Мне нужно идти.
  hi.a1.unit15.lesson01.teach.grammar_mujhe_verb_hai:
    title: Mujhe + глагол + hai = нужно
    gloss: '«Mujhe» ты уже встречал с «chahiye» (урок 6, с существительным) и с «hai» (урок 11, например «mujhe kaam hai», у меня есть дело). Теперь оно употребляется и с глаголом: «mujhe jana hai» значит «мне нужно идти». Обрати внимание: с «jana» слово «hai» не меняется и никогда не превращается в «hain»: оно не согласуется с говорящим.'
    note: 'Третье употребление знакомой модели «местоимение + связка»: два прежних случая (урок 6 и урок 11) теперь дополняет глагол.'
  hi.a1.unit15.lesson01.teach.mujhe_station_jana_hai_phrase:
    title: Мне нужно на вокзал.
    gloss: Мне нужно на вокзал.
    note: Первый полный пример конструкции долженствования в этом уроке.
  hi.a1.unit15.lesson01.teach.tiket:
    title: Билет
    gloss: билет
    note: Новое существительное, которое понадобится на протяжении всего этого урока о поездках.
    example_gloss: Где мой билет?
  hi.a1.unit15.lesson01.teach.chahiye_review:
    title: 'Повторение: нужно / хотелось бы'
    gloss: нужно / хотелось бы
    note: Впервые встречалось в уроке 6 с напитками, здесь употребляется с билетом.
    example_gloss: Мне бы чаю.
  hi.a1.unit15.lesson01.teach.mujhe_tiket_chahiye_phrase:
    title: Мне нужен билет.
    gloss: Мне нужен билет.
    note: Уже известная модель *mujhe...chahiye* с новым существительным этого урока.
  hi.a1.unit15.lesson01.teach.train:
    title: Поезд
    gloss: поезд
    note: Новое существительное.
    example_gloss: Поезд большой.
  hi.a1.unit15.lesson01.teach.delhi_ka_review:
    title: 'Повторение: Дели, «чей-то»'
    gloss: Дели, «чей-то» (притяжательная частица)
    note: Слово «Дели» встречалось в уроке 5; притяжательная частица *ka* уже использовалась во всём курсе (например, в уроках 5–14). Здесь она служит для указания пункта назначения билета.
    example_gloss:
    - Мой брат живёт в Дели.
    - Это сумка Арджуна.
  hi.a1.unit15.lesson01.teach.mujhe_delhi_ka_tiket_chahiye_phrase:
    title: Мне нужен билет до Дели.
    gloss: Мне нужен билет до Дели.
    note: Сочетает существительное этого урока с притяжательной частицей, чтобы назвать конкретный пункт назначения.
  hi.a1.unit15.lesson01.teach.kahan_tumhein_review:
    title: 'Повторение: где, тебе'
    gloss: где, тебе / для тебя
    note: Оба слова уже изучены (урок 8 и урок 6); здесь они нужны, чтобы спросить, куда человеку нужно идти.
    example_gloss:
    - Где банк?
    - Что бы ты хотел?
  hi.a1.unit15.lesson02.teach.number_review:
    title: 'Повторение: номер'
    gloss: номер
    note: Слово впервые встретилось в уроке 2 для номеров телефона — здесь оно используется для номера платформы.
    example_gloss: Какой у тебя номер телефона?
  hi.a1.unit15.lesson02.teach.platform:
    title: Платформа
    gloss: платформа
    note: Новое существительное — обычное хинди-слово для платформы на вокзале (распространённое заимствование из английского, по той же модели, что и *phone* в уроке 2).
    example_gloss: Платформа большая.
  hi.a1.unit15.lesson02.teach.platform_number_kya_hai_phrase:
    title: Какой номер платформы?
    gloss: Какой номер платформы?
    note: Снова используется уже знакомая модель вопроса с *kya hai* (номер телефона, цена, возраст) — для новой темы.
  hi.a1.unit15.lesson02.teach.platform_number_teen_hai_phrase:
    title: Платформа номер 3.
    gloss: Номер платформы — 3.
    note: Естественный полный ответ на вопрос выше.
  hi.a1.unit15.lesson02.teach.jaana_habitual_grammar:
    title: Jaati hai (согласование в женском роде)
    gloss: '«Jaati hai» использует правило урока 10: -ta/-ti/-te + hai/hain, с новым глаголом «jana». «Train» в хинди женского рода, поэтому говорят «jaati hai», а не «jaata hai».'
    note: 'Прямое продолжение уже изученной модели согласования в настоящем времени: новый глагол и новое существительное женского рода.'
  hi.a1.unit15.lesson02.teach.se_review:
    title: 'Повторение: от, из'
    gloss: от, из
    note: Впервые встретилось в уроке 9 в указаниях пути — здесь используется для платформы, с которой отправляется поезд.
    example_gloss: Иди прямо отсюда.
  hi.a1.unit15.lesson02.teach.train_platform_se_jaati_hai_phrase:
    title: Поезд отправляется с платформы номер 3.
    gloss: Поезд отправляется с платформы номер 3.
    note: Соединяет глагольную форму настоящего времени из этого урока с уже изученным послелогом «из/от».
  hi.a1.unit15.lesson02.teach.kitne_baje_review:
    title: 'Повторение: во сколько'
    gloss: во сколько
    note: Впервые встретилось в уроке 4 при назывании времени — здесь используется, чтобы спросить о времени отправления.
    example_gloss: Который час?
  hi.a1.unit15.lesson02.teach.train_kitne_baje_jaati_hai_phrase:
    title: Во сколько отправляется поезд?
    gloss: Во сколько отправляется поезд?
    note: Вопрос «во сколько» относится к расписанию отправления, а не к текущему времени.
  hi.a1.unit15.lesson02.teach.train_chhah_baje_jaati_hai_phrase:
    title: Поезд отправляется в шесть.
    gloss: Поезд отправляется в 6 часов.
    note: Естественный полный ответ; используется множественная форма *baje* из урока 4 (шесть — не исключение *baja*, оно относится только к часу дня).
  hi.a1.unit15.lesson02.teach.tiket_kitne_ka_hai_phrase:
    title: Сколько стоит билет?
    gloss: Сколько стоит билет?
    note: Снова вопрос о цене *kitne ka/ki* из урока 7. *Tikat* обычно считается мужского рода (*ka*); многие говорящие употребляют его и в женском роде (*kitne ki*) — это тоже правильно.
  hi.a1.unit15.lesson02.teach.rupaye_review:
    title: 'Повторение: рупии, пятьдесят'
    gloss: рупии, пятьдесят
    note: Оба слова впервые встретились в уроке 2 для цен и количества — здесь используются для цены билета.
    example_gloss: У меня пятьдесят рупий.
  hi.a1.unit15.lesson02.teach.tiket_pachaas_rupaye_ka_hai_phrase:
    title: Билет стоит 50 рупий.
    gloss: Билет стоит 50 рупий.
    note: Естественный полный ответ на вопрос о цене выше.
  hi.a1.unit15.lesson03.teach.hum_hamein:
    title: Мы, нам
    gloss: мы, нам / для нас
    note: «Hum» (мы) уже было введено в уроке 11 как первое местоимение первого лица множественного числа; «hamein» — его дательная форма, она нужна для диалога о совместной поездке.
    example_gloss:
    - У нас всё хорошо.
    - Нам нужно ехать на вокзал.
  hi.a1.unit15.lesson03.teach.hamein_grammar:
    title: 'Hamein: четвёртое дательное местоимение'
    gloss: «Hamein» — дательная форма от «hum» (урок 11), как «mujhe» (от «main») и «tumhein» (от «tum»). И здесь с «jana» слово «hai» не меняется и не превращается в «hain» — оно не согласуется с «hum»/«hamein».
    note: Сначала названы все три уже известных дательных местоимения с номерами уроков, затем добавлено четвёртое; снова напоминается, что «hai» согласуется с глаголом, как и в грамматической заметке первого урока.
  hi.a1.unit15.lesson03.teach.hamein_station_jana_hai_phrase:
    title: Нам нужно ехать на вокзал.
    gloss: Нам нужно ехать на вокзал.
    note: Конструкция долженствования с новым дательным местоимением множественного числа.
  hi.a1.unit15.lesson03.teach.ki_review:
    title: 'Повторение: притяжательный показатель (женский род)'
    gloss: притяжательный показатель «of / 's» (женский род)
    note: Впервые встретилось в уроке 7 вместе с *ka*/*kitne* — здесь повторяется, потому что «train» в хинди женского рода, а значит, притяжательная форма у него «ki», а не «ka».
    example_gloss: Это поезд на Дели.
  hi.a1.unit15.lesson03.teach.dialogue.line01:
    title: Арджун говорит, что им нужно ехать
    gloss: Прия, нам нужно ехать на вокзал.
  hi.a1.unit15.lesson03.teach.dialogue.line02:
    title: Прие нужен билет до Дели
    gloss: Хорошо. Мне нужен билет до Дели.
  hi.a1.unit15.lesson03.teach.dialogue.line03:
    title: Арджун спрашивает цену
    gloss: Мне тоже. Сколько стоит билет?
  hi.a1.unit15.lesson03.teach.dialogue.line04:
    title: Прия называет цену
    gloss: Билет стоит 50 рупий.
  hi.a1.unit15.lesson03.teach.dialogue.line05:
    title: Арджун спрашивает время отправления
    gloss: Хорошо. Во сколько отправляется поезд?
  hi.a1.unit15.lesson03.teach.dialogue.line06:
    title: Прия называет время и платформу
    gloss: Поезд отправляется в шесть, с платформы номер 3.
  hi.a1.unit15.lesson03.teach.dialogue.line07:
    title: Арджун понял и предлагает идти
    gloss: Понятно. Пошли!
  hi.a1.unit15.lesson03.teach.dialogue.line08:
    title: Прия соглашается
    gloss: Пошли!
  hi.a1.unit15.lesson03.teach.grammar_summary:
    title: Три главных правила
    gloss: 'Три главных правила урока: (1) «mujhe/tumhein/hamein + глагол + hai» означает «нужно ___»; (2) «X kitne ka/ki hai?» — вопрос о цене; (3) «X [время] baje [место] se jaati hai» сообщает время и место отправления.'
    note: Итоговое резюме всей грамматики урока, подобное заметке урока 14, которая объединяла парадигмы.
  hi.a1.unit15.lesson03.teach.tiket_reading:
    title: Читаем билет
    gloss: 'Билет: Дели. Платформа номер 3. 6 часов.'
    note: Короткий текст на корешке билета (без полных предложений, как на настоящем билете); повторяет только те факты, что уже были в диалоге, без новых утверждений.
    glosses:
      टिकट: билет
      प्लेटफ़ॉर्म: платформа
      नंबर: номер
      बजे: час
