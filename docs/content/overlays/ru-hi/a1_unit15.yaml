  hi.a1.unit15.lesson01.exercise07.order_mujhe_station_jana_hai:
    instruction: 'Расставь слова в правильном порядке: Мне нужно ехать на вокзал.'
    correct_response:
    - मुझे
    - स्टेशन
    - जाना
    - है
  hi.a1.unit15.lesson01.exercise08.order_mujhe_delhi_ka_tiket_chahiye:
    instruction: 'Расставь слова в правильном порядке: Мне нужен билет до Дели.'
    correct_response:
    - मुझे
    - दिल्ली
    - का
    - टिकट
    - चाहिए
  hi.a1.unit15.lesson01.exercise09.fill_mujhe_station_jana:
    instruction: 'Дополни предложение: Мне нужно ехать на вокзал.'
    accepted_answers:
    - जाना
    feedback: Mujhe station jana hai — «jana» (идти, ехать) вместе с «hai» выражает, что нужно куда-то ехать или идти.
  hi.a1.unit15.lesson01.exercise10.fill_mujhe_delhi_ka_tiket:
    instruction: 'Дополни предложение: Мне нужен билет до Дели.'
    accepted_answers:
    - दिल्ली
    feedback: Mujhe Dilli ka tiket chahiye — «Dilli ka tiket» означает «билет до Дели».
  hi.a1.unit15.lesson01.exercise11.reply_tumhein_kahan_jana_hai:
    instruction: 'Ответь: Мне нужно ехать на вокзал.'
    accepted_answers:
    - मुझे स्टेशन जाना है।
    - मुझे स्टेशन जाना है
  hi.a1.unit15.lesson01.exercise12.fix_mujhe_tiket_chahiye:
    instruction: Исправь предложение — после «chahiye» никогда не стоит «hai».
    accepted_answers:
    - मुझे टिकट चाहिए।
    - मुझे टिकट चाहिए
    feedback: Mujhe tiket chahiye — «chahiye» уже само по себе законченное слово, в отличие от «jana hai», где нужно «hai».
  hi.a1.unit15.lesson01.exercise13.speak_mujhe_station_jana_hai:
    instruction: 'Скажи: Мне нужно ехать на вокзал.'
    accepted_answers:
    - मुझे स्टेशन जाना है।
    - मुझे स्टेशन जाना है
  hi.a1.unit15.lesson02.exercise01.select_platform_meaning:
