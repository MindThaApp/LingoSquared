  hi.a1.unit03.lesson03.next_class_and_birthday:
    title: Следующее занятие и дни рождения
teaching:
  hi.a1.unit03.lesson01.teach.aaj:
    title: Сегодня
    gloss: сегодня
    note: Слово, которое пригодится почти в каждом предложении этого урока.
    example_gloss: Сегодня хорошая погода.
  hi.a1.unit03.lesson01.teach.somvar:
    title: Понедельник
    gloss: понедельник
    note: Назван по слову सोम (Луна) — как и русский «понедельник» он связан не с Луной, но в хинди это «день Луны».
    example_gloss: Занятие йогой в понедельник.
  hi.a1.unit03.lesson01.teach.mangalvar:
    title: Вторник
    gloss: вторник
    note: Назван по слову मंगल (Марс) — по той же схеме образовано большинство названий дней недели в хинди.
    example_gloss: Сегодня вторник.
  hi.a1.unit03.lesson01.teach.budhvar:
    title: Среда
    gloss: среда
    note: Назван по слову बुध (Меркурий).
    example_gloss: Сегодня среда.
  hi.a1.unit03.lesson01.teach.guruvar:
    title: Четверг
    gloss: четверг
    note: Назван по слову गुरु (Юпитер).
    example_gloss: Сегодня четверг.
  hi.a1.unit03.lesson01.teach.shukravar:
    title: Пятница
    gloss: пятница
    note: Назван по слову शुक्र (Венера).
    example_gloss: В пятницу занятия йогой нет.
  hi.a1.unit03.lesson01.teach.shanivar:
    title: Суббота
    gloss: суббота
    note: Назван по слову शनि (Сатурн).
    example_gloss: Сегодня суббота.
  hi.a1.unit03.lesson01.teach.ravivar:
    title: Воскресенье
    gloss: воскресенье
    note: Назван по слову रवि — санскритскому названию солнца; в хинди это «день Солнца».
    example_gloss: Сегодня воскресенье.
  hi.a1.unit03.lesson01.teach.kaun_sa_din_hai:
    title: Вопрос о том, какой сегодня день
    gloss: Какой сегодня день?
    note: '*Kaun sa* («какой») согласуется с существительным мужского рода *din* («день»); форму женского рода, *kaun si*, ты встретишь позже с существительными женского рода.'
  hi.a1.unit03.lesson01.teach.yoga_class_monday:
    title: Когда событие происходит в определённый день
    gloss: Занятие йогой в понедельник.
    note: '*Ko* после названия дня означает «в»: *somvar ko* — «в понедельник»; так же со всеми днями недели.'
  hi.a1.unit03.lesson01.teach.no_class_friday:
    title: Когда события в определённый день нет
    gloss: В пятницу занятия йогой нет.
    note: Nahin делает предложение отрицательным; ko по-прежнему отмечает день, здесь он стоит в начале для выделения.
  hi.a1.unit03.lesson02.teach.jan_feb_mar:
    title: Январь, февраль, март
    gloss: январь, февраль, март
    note: Названия месяцев в хинди в основном заимствованные и легко узнаваемые — новой грамматики здесь нет, только лексика.
    example_gloss:
    - Мой день рождения в январе.
    - Следующий праздник в феврале.
    - Мой день рождения в марте.
  hi.a1.unit03.lesson02.teach.apr_may_jun:
    title: Апрель, май, июнь
    gloss: апрель, май, июнь
    note: Те же узнаваемые названия, что и у первых трёх месяцев.
    example_gloss:
    - Следующий праздник в апреле.
    - Мой день рождения в мае.
    - Следующий праздник в июне.
  hi.a1.unit03.lesson02.teach.jul_aug_sep:
    title: Июль, август, сентябрь
    gloss: июль, август, сентябрь
    note: Sitambar здесь пишется с anusvara (सितंबर); написание с половинной m (सितम्बर) тоже распространено и так же правильно.
    example_gloss:
    - Мой день рождения в июле.
    - Следующий праздник в августе.
    - Мой день рождения в сентябре.
  hi.a1.unit03.lesson02.teach.oct_nov_dec:
    title: Октябрь, ноябрь, декабрь
    gloss: октябрь, ноябрь, декабрь
    note: Navambar и disambar пишутся с anusvara, как и sitambar; написания नवम्बर и दिसम्बर (с половинной m) тоже распространены и так же правильны.
    example_gloss:
    - Следующий праздник в октябре.
    - Мой день рождения в ноябре.
    - Следующий праздник в декабре.
  hi.a1.unit03.lesson02.teach.tareekh:
    title: Дата
    gloss: дата
    note: '*Tareekh* — существительное женского рода, поэтому вопросительное слово принимает женскую форму (*kitni tareekh*, а не *kitna tareekh*) — то же согласование, что в уроке 2 было с *keemat* и *umra*.'
    example_gloss: Сегодня третье число.
  hi.a1.unit03.lesson02.teach.mein_postposition:
    title: В (с названием месяца)
    gloss: в — употребляется с названием месяца
    note: '*Mein* отмечает месяц так же, как *ko* отмечает день: *janvari mein* — «в январе», а не *janvari ko*.'
  hi.a1.unit03.lesson02.teach.aaj_kitni_tareekh_hai:
    title: Вопрос о дате
    gloss: Какое сегодня число?
    note: 'Буквально «какое число сегодняшней даты»: kitni согласуется с существительным женского рода tareekh.'
  hi.a1.unit03.lesson02.teach.aaj_teen_tareekh_hai:
    title: Называем дату одним числом
    gloss: Сегодня третье число.
    note: 'В хинди дату называют обычным количественным числительным (*teen*, «три»), а не порядковым, как в русском «третье»: отдельного «слова для даты» учить не нужно, достаточно уже известных чисел.'
  hi.a1.unit03.lesson02.teach.aaj_teen_january_hai:
    title: Называем дату вместе с месяцем
    gloss: Сегодня третье января.
    note: Та же схема с количественным числительным, теперь после него добавлено название месяца.
  hi.a1.unit03.lesson03.teach.kab:
    title: Когда
    gloss: когда
    note: Простое и очень частотное вопросительное слово.
    example_gloss: Когда следующее занятие?
  hi.a1.unit03.lesson03.teach.agli:
    title: Следующий
    gloss: следующий
    note: '*Agli* — форма женского рода: в повседневном хинди слово *class* (क्लास) считается существительным женского рода, поэтому при нём *agli*, а не *agla* мужского рода.'
    example_gloss: Следующее занятие во вторник.
  hi.a1.unit03.lesson03.teach.das_reprise:
    title: Десять
    gloss: десять
    note: Слово из урока 2 — оно нужно здесь для настоящей даты.
    example_gloss: Следующее занятие десятого числа.
  hi.a1.unit03.lesson03.teach.janmadin:
    title: День рождения
    gloss: день рождения
    note: 'Существительное мужского рода: mera janmadin, а не meri janmadin.'
    example_gloss: Мой день рождения в декабре.
  hi.a1.unit03.lesson03.teach.tumhara_janmadin_kab_hai:
    title: Спрашиваем о дне рождения собеседника на «ты»
    gloss: Когда у тебя день рождения?
    note: Tumhara согласуется с существительным мужского рода janmadin.
  hi.a1.unit03.lesson03.teach.mera_janmadin_january_mein_hai:
    title: Называем свой день рождения
    gloss: Мой день рождения в январе.
    note: Естественный полный ответ на вопрос Tumhara janmadin kab hai?
  hi.a1.unit03.lesson03.teach.agli_class_kab_hai:
    title: Спрашиваем, когда следующее занятие
    gloss: Когда следующее занятие?
    note: Соединяет agli (женский род, согласуется с class) и kab.
  hi.a1.unit03.lesson03.teach.agli_class_mangalvar_das_march:
    title: Называем день недели и дату полностью
    gloss: Следующее занятие во вторник, десятого марта.
    note: 'День недели и дата вместе: сначала день недели, затем число и месяц.'
  hi.a1.unit03.lesson03.teach.dialogue.line01:
    title: Арджун спрашивает о следующем занятии
    gloss: Арджун спрашивает, когда следующее занятие йогой.
    note: Тот же вопрос, что и в этом уроке, только для ясности добавлено yog.
  hi.a1.unit03.lesson03.teach.dialogue.line02:
    title: Прия называет день и дату
    gloss: Прия говорит, что следующее занятие во вторник, десятого марта.
    note: Точно то же предложение с днём и датой, что и в этом уроке.
  hi.a1.unit03.lesson03.teach.dialogue.line03:
    title: Арджун благодарит её
    gloss: 'Арджун говорит: хорошо, спасибо.'
    note: Theek hai и shukriya — слова из урока 1.
  hi.a1.unit03.lesson03.teach.dialogue.line04:
    title: Прия отвечает
    gloss: Прия говорит, что не за что.
    note: Koi baat nahin — очень частый, естественный способ сказать «не за что» или «ничего страшного».
  hi.a1.unit03.lesson03.teach.dialogue.line05:
    title: Арджун спрашивает о дне рождения Прии
    gloss: Арджун спрашивает, когда у Прии день рождения.
    note: Тот же неформальный вопрос о дне рождения, что и в этом уроке.
  hi.a1.unit03.lesson03.teach.dialogue.line06:
    title: Прия отвечает
    gloss: Прия говорит, что её день рождения в январе.
    note: Точно то же предложение-ответ, что и в этом уроке.
  hi.a1.unit03.lesson03.teach.dialogue.line07:
    title: Арджун реагирует и говорит о своём дне рождения
    gloss: Арджун reагирует с интересом, а затем говорит, что его день рождения в декабре.
    note: Accha — слово из урока 1; декабрь уже встречался во втором уроке этого раздела.
  hi.a1.unit03.lesson03.teach.dialogue.line08:
    title: Прия завершает разговор
    gloss: 'Прия соглашается и неформально прощается: «до встречи».'
    note: Theek hai и phir milte hain — слова прощания из урока 1.
