answer_policy:
  nasalization_marks: 'Display and teach the correct chandrabindu/anusvara distinction. This unit''s own new vocabulary needs one new, explicitly disclosed spelling decision: महंगा/महंगी ("expensive") uses अनुस्वार (ं), not चंद्रबिंदु -- this is a class-nasal-before-a-stop-consonant case (the same pattern as गंगा/मंगल), not an application of the existing word-final vowel-height convention that governs हूँ/हाँ/मैं/हैं/में. In typed A1 answers, accept a variant that drops a nasalization mark entirely or substitutes anusvara for chandrabindu (or vice versa) when every other character is correct. Do not extend this tolerance to a wrong vowel or consonant, which changes the actual word.'
  punctuation: Hindi text is shown with the traditional danda (।) as the sentence-final mark. In typed answers, accept the danda, a plain period (.), or the mark omitted entirely as equivalent. Question marks (?), exclamation marks, and commas may likewise be omitted, but the fully punctuated form remains the model answer.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register (aap vs. tum) rather than written punctuation or nasalization marks.
course:
  title: Хинди A1
units:
  hi.a1.unit07.shopping:
    title: Покупки
lessons:
  hi.a1.unit07.lesson01.dukaan_mein:
    title: В магазине
  hi.a1.unit07.lesson02.keemat_aur_matra:
    title: Цена и количество
  hi.a1.unit07.lesson03.priya_aur_arjun_ki_khareedari:
    title: Прия и Арджун идут за покупками
teaching:
  hi.a1.unit07.lesson01.teach.dukaan_bazaar:
    title: Магазин, рынок
    gloss: магазин, рынок
    note: Два привычных места, где покупают вещи; они встретятся во всём уроке.
    example_gloss:
    - Это магазин.
    - Это рынок.
  hi.a1.unit07.lesson01.teach.dukaandaar:
    title: Продавец
    gloss: владелец магазина, продавец
    note: Новый персонаж этого урока — человек, который держит магазин. К нему, как к незнакомому, обращаются на «вы» (aap).
    example_gloss: Это продавец.
  hi.a1.unit07.lesson01.teach.kameez_bag_topi:
    title: Рубашка, сумка, шапка
    gloss: рубашка, сумка, шапка
    note: Три обычные покупки; на них в этом уроке мы отработаем конструкцию *mujhe ... chahiye* из урока про еду.
    example_gloss:
    - Мне нужна рубашка.
    - Мне нужна сумка.
    - Мне нужна шапка.
  hi.a1.unit07.lesson01.teach.mujhe_yah_chahiye:
    title: Мне нужно вот это
    gloss: Мне нужно это.
    note: 'Универсальная фраза, когда хочешь что-то купить: *mujhe ... chahiye* из урока про еду со словом *yah* («это»).'
  hi.a1.unit07.lesson01.teach.ji:
    title: Ji (вежливая частица)
    gloss: вежливая частица уважения, как «господин» или «госпожа»
    note: Ставится после имени или звания для большей вежливости; часто используется при обращении к незнакомому человеку, например к продавцу.
    example_gloss: Здравствуйте, продавец.
  hi.a1.unit07.lesson01.teach.sirf:
    title: Только
    gloss: только, лишь
    note: Используется, когда нужна всего одна вещь, а не несколько.
    example_gloss: Мне нужна только одна рубашка.
  hi.a1.unit07.lesson01.teach.aapko_aur_kuch_chahiye:
    title: Вам нужно что-нибудь ещё? (вежливо)
    gloss: Вам нужно что-нибудь ещё?
    note: Естественный вежливый вопрос продавца после части заказа; в нём повторяются *aapko* и *chahiye*.
  hi.a1.unit07.lesson01.teach.ji_nahin_sirf_yah:
    title: Нет, только это
    gloss: Нет, только это.
    note: Естественный вежливый отказ от дополнительных покупок; в нём повторяются *ji* и *sirf* из этого урока.
  hi.a1.unit07.lesson01.teach.tumhein_kya_chahiye_bataao:
    title: Скажи, что тебе нужно
    gloss: Скажи, что тебе нужно.
    note: Неформальная фраза-задание, которой в курсе просят дать устный ответ; такая же есть и в уроке про еду.
  hi.a1.unit07.lesson02.teach.keemat:
    title: Цена
    gloss: цена
    note: Слово уже встречалось в уроке 2 с числами и ценами; здесь оно повторяется в контексте покупок.
    example_gloss: Сколько это стоит?
  hi.a1.unit07.lesson02.teach.rupaye:
    title: Рупии
    gloss: рупии
    note: Название валюты из урока 2; теперь мы тренируем его с двумя разными ценами.
    example_gloss:
    - Это стоит двести рупий.
    - Это стоит пятьсот рупий.
  hi.a1.unit07.lesson02.teach.iski_keemat_kya_hai:
    title: Сколько это стоит?
    gloss: Сколько это стоит?
    note: Стандартный способ спросить цену, прямо из урока 2.
  hi.a1.unit07.lesson02.teach.iski_keemat_bees_rupaye_hai:
    title: Это стоит двести рупий
    gloss: Это стоит двести рупий.
    note: Пример ответа на вопрос о цене выше.
  hi.a1.unit07.lesson02.teach.kitne_ka_ki_note:
    title: Kitne ka / kitne ki
    gloss: «Yah kitne ka hai?» говорят о предметах мужского рода, а «Yah kitne ki hai?» — о предметах женского рода. Слово *kitne* не меняется — меняется только *ka/ki*, так же как чередуются -а/-и в *mera/meri* и *tumhara/tumhari*, которые ты уже знаешь.
    note: 'Второй, очень распространённый способ спросить цену; он строится по уже знакомому из притяжательных слов правилу согласования по роду: меняется только ka/ki, а не kitne.'
  hi.a1.unit07.lesson02.teach.yeh_kitne_ka_hai:
    title: Сколько это стоит? (мужской род)
    gloss: Сколько это стоит?
    note: Употребляется для предмета мужского рода, например сумки.
  hi.a1.unit07.lesson02.teach.yeh_kitne_ki_hai:
    title: Сколько это стоит? (женский род)
    gloss: Сколько это стоит?
    note: Употребляется для предмета женского рода, например шапки.
  hi.a1.unit07.lesson02.teach.sasta_mehenga:
    title: Дёшево, дорого
    gloss: дешёвый, дорогой
    note: Распространённая пара прилагательных для реакции на цену; здесь показаны формы мужского рода.
    example_gloss:
    - Эта сумка дешёвая.
    - Эта сумка дорогая.
  hi.a1.unit07.lesson02.teach.sasti_mehengi_note:
    title: Sasti и mehengi
    gloss: 'Sasta и mehenga тоже меняются по мужскому и женскому роду, как mera/meri: со словами женского рода говорят sasti и mehengi, например «yah topi sasti hai» (эта шапка дешёвая) или «yah kameez mehengi hai» (эта рубашка дорогая).'
    note: Ещё один пример того же согласования по роду, на которое в курсе не раз обращается внимание.
  hi.a1.unit07.lesson03.teach.khareedna:
    title: Покупать
    gloss: покупать
    note: Здесь повторяется конструкция «глагол + na chahta/chahti hun» («я хочу ...»), которую мы впервые разбирали в уроке 1 на примере занятий йогой; теперь она используется для покупок.
    example_gloss:
    - Я хочу купить эту рубашку.
    - Я хочу купить эту шапку.
  hi.a1.unit07.lesson03.teach.chalo_kuch_khareedte_hain:
    title: Давай что-нибудь купим!
    gloss: Давай что-нибудь купим!
    note: Дружеское устойчивое предложение пойти за покупками; с него начинается заключительный диалог урока, как с «chalo, kuch khate hain!» в уроке про еду.
  hi.a1.unit07.lesson03.teach.dialogue.line01:
    title: Арджун предлагает сходить за покупками
    gloss: 'Арджун говорит: давай что-нибудь купим.'
    note: Повторяется начальная фраза этого урока.
  hi.a1.unit07.lesson03.teach.dialogue.line02:
    title: Прия соглашается
    gloss: 'Прия соглашается и думает: рубашку или шапку?'
    note: Здесь появляется *ya* («или») для выбора из двух вещей.
  hi.a1.unit07.lesson03.teach.dialogue.line03:
    title: Продавец приветствует их
    gloss: Продавец здоровается и спрашивает, что они хотели бы.
    note: Вежливое приветствие на «вы» (aap); повторяется *aapko kya chahiye* из урока 1.
  hi.a1.unit07.lesson03.teach.dialogue.line04:
    title: Прия спрашивает о рубашке
    gloss: Прия вежливо здоровается с продавцом, просит рубашку и спрашивает её цену.
    note: Сочетает *ji*, *mujhe ... chahiye* и *iski keemat kya hai*.
  hi.a1.unit07.lesson03.teach.dialogue.line05:
    title: Продавец называет цену
    gloss: Продавец говорит, что это стоит триста рупий.
    note: Повторяется конструкция *iski keemat ... rupaye hai* с новым числом.
  hi.a1.unit07.lesson03.teach.dialogue.line06:
    title: Прия реагирует и решает
    gloss: 'Прия говорит: триста рупий? Это дёшево! Мне нужна эта рубашка.'
    note: Повторяется *sasti* из грамматической заметки урока 2.
  hi.a1.unit07.lesson03.teach.dialogue.line07:
    title: Арджун спрашивает о шапке
    gloss: Арджун говорит, что ему нужна шапка, и спрашивает, сколько она стоит.
    note: Повторяется форма женского рода *kitne ki hai* из урока 2.
  hi.a1.unit07.lesson03.teach.dialogue.line08:
    title: Продавец отвечает
    gloss: Продавец говорит, что шапка стоит пятьсот рупий.
    note: Повторяется *paanch sau* (пятьсот) из урока 2.
  hi.a1.unit07.lesson03.teach.dialogue.line09:
    title: Арджун реагирует, но всё равно решает купить
    gloss: 'Арджун говорит: пятьсот рупий? Это дорого! Ладно, мне нужна эта шапка.'
    note: Повторяется *mehengi* из грамматической заметки урока 2; Арджун всё равно решает купить шапку.
  hi.a1.unit07.lesson03.teach.dialogue.line10:
    title: Продавец спрашивает, всё ли это
    gloss: 'Продавец говорит: хорошо, вам нужно что-нибудь ещё?'
    note: Повторяется *aapko aur kuch chahiye* из урока 1.
  hi.a1.unit07.lesson03.teach.dialogue.line11:
    title: Прия завершает заказ
    gloss: 'Прия говорит: нет, только это, спасибо!'
    note: Повторяется *ji nahin, sirf yah* из урока 1 и добавляется *shukriya*.
  hi.a1.unit07.lesson03.teach.dialogue.line12:
    title: Продавец прощается
    gloss: 'Продавец говорит: спасибо, до новых встреч.'
    note: Повторяется стандартная фраза прощания, принятая в этом курсе.
