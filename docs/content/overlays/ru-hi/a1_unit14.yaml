  hi.a1.unit14.lesson03.arjun_priya_tulna:
    title: 'Арджун и Прия: сравнения'
teaching:
  hi.a1.unit14.lesson01.teach.arjun_priya_review:
    title: 'Повторение: Арджун, Прия, есть'
    gloss: Арджун, Прия, есть
    note: Краткое повторение имён двух героев и связки 'hai', которая нужна для сравнительных предложений в этом юните.
    example_gloss:
    - У Арджуна всё хорошо.
    - У Прии всё хорошо.
  hi.a1.unit14.lesson01.teach.bada_badi_review:
    title: 'Повторение: большой / старший'
    gloss: большой / старший (м. р. / ж. р.)
    note: Впервые это слово встретилось в юните 5 при разговоре о возрасте братьев и сестёр; теперь им можно напрямую сравнивать любых двух людей или предметы.
    example_gloss:
    - Мой старший брат живёт в Дели.
    - Моя старшая сестра живёт в Дели.
  hi.a1.unit14.lesson01.teach.chota_choti_review:
    title: 'Повторение: маленький / младший'
    gloss: маленький / младший (м. р. / ж. р.)
    note: Впервые это слово встретилось в юните 5 при разговоре о возрасте братьев и сестёр; здесь оно используется так же, как bada/badi.
    example_gloss:
    - Мой младший брат теперь студент.
    - Моя младшая сестра теперь студентка.
  hi.a1.unit14.lesson01.teach.se_comparative_grammar:
    title: Se = «чем»
    gloss: '''Se'' уже встречалось в значении «от, из» (юнит 9, ''yahan se seedhe jao'') и «с» (юнит 12, ''Priya se mila''). Теперь оно используется и для сравнения: ''X, Y se ADJ hai'' означает «X более ADJ, чем Y» -- например, ''Priya Arjun se badi hai''.'
    note: 'Раскрывается третье значение уже знакомого слова: два прежних значения названы с номерами юнитов, после чего вводится новое.'
    target_text: '''से'' раньше встречалось в ''यहाँ से सीधे जाओ'' (यूनिट 9, matlab «от, из») и в ''प्रिया से मिला'' (यूनिट 12, matlab «с»); теперь оно используется и для сравнения: ''X, Y से ADJ है'' означает «X более ADJ, чем Y» -- например, ''प्रिया अर्जुन से बड़ी है''।'
  hi.a1.unit14.lesson01.teach.arjun_bada_phrase:
    title: Прия старше Арджуна.
    gloss: Прия старше Арджуна.
    note: Первый полный пример сравнительной конструкции с se в этом юните.
  hi.a1.unit14.lesson01.teach.lamba_lambi:
    title: Высокий / длинный
    gloss: высокий / длинный (м. р. / ж. р.)
    note: 'Новая пара прилагательных, которая следует уже знакомой схеме согласования: -a для мужского рода, -i для женского (bada/badi, chota/choti).'
    example_gloss:
    - Мой брат высокий.
    - Моя сестра высокая.
  hi.a1.unit14.lesson01.teach.agreement_grammar:
    title: Прилагательное согласуется с подлежащим
    gloss: В сравнительном предложении прилагательное (bada/badi, chota/choti и т. д.) всегда согласуется в роде с ПОДЛЕЖАЩИМ, а не со словом после 'se' -- например, в 'Arjun Priya se chota hai' слово 'chota' согласуется с Arjun (подлежащее мужского рода), а не с Priya.
    note: Прямое применение уже известной схемы согласования прилагательных на -a/-i к сравнительным предложениям.
    target_text: В предложении со сравнением прилагательное (например, बड़ा/बड़ी, छोटा/छोटी) всегда согласуется в роде с подлежащим (subject), а не со словом после 'से' -- например, в 'अर्जुन प्रिया से छोटा है' слово 'छोटा' согласуется с अर्जुन (подлежащее мужского рода), а не с प्रिया।
  hi.a1.unit14.lesson01.teach.priya_chota_phrase:
    title: Арджун младше Прии.
    gloss: Арджун младше Прии.
    note: 'Тот же факт, сказанный с другой стороны: показывает согласование с подлежащим мужского рода.'
  hi.a1.unit14.lesson01.teach.kaun_ya_review:
    title: 'Повторение: кто, или'
    gloss: кто, или
    note: Оба слова уже изучены (юнит 5 и юнит 6/13); здесь они используются, чтобы задать вопрос о сравнении.
    example_gloss: Кто старше, Арджун или Прия?
  hi.a1.unit14.lesson02.teach.topi_bag_review:
    title: 'Повторение: шляпа, сумка'
    gloss: шляпа, сумка
    note: Оба существительных впервые встретились в юните 7 о покупках; здесь это две вещи, которые сравниваются.
    example_gloss:
    - Эта шляпа красивая.
    - Эта сумка красивая.
  hi.a1.unit14.lesson02.teach.sasta_mehnga_review:
    title: 'Повторение: дешёвый, дорогой'
    gloss: дешёвый, дорогой
    note: Впервые это было в юните 7 — здесь используется для сравнения предметов.
    example_gloss:
    - Сумка дешёвая.
    - Сумка дорогая.
  hi.a1.unit14.lesson02.teach.sasti_mehngi_note:
    title: 'Женский род: sasti, mehngi'
    gloss: С существительными женского рода 'sasta' и 'mehnga' превращаются в 'sasti' и 'mehngi' — например, 'topi sasti hai' (шляпа дешёвая).
    note: 'Краткое напоминание правила согласования по роду из юнита 7: ''topi'' (шляпа) — слово женского рода.'
  hi.a1.unit14.lesson02.teach.se_object_phrase:
    title: Шляпа дешевле сумки.
    gloss: Шляпа дешевле сумки.
    note: Сравнительная конструкция с se, теперь для двух предметов, а не двух людей.
  hi.a1.unit14.lesson02.teach.zyada_review:
    title: 'Повторение: больше'
    gloss: больше
    note: В юните 13 слово встречалось только с 'pasand hai' (для выражения предпочтения) — в этом уроке его употребление расширяется.
    example_gloss: Я больше люблю чай.
  hi.a1.unit14.lesson02.teach.zyada_mehnga_grammar:
    title: Zyada в любом сравнении
    gloss: 'Раньше ''zyada'' встречалось только с ''pasand hai'' (юнит 13). Теперь оно может стоять и перед ЛЮБЫМ прилагательным в сравнении: ''bag topi se zyada mehnga hai'' значит «сумка дороже шляпы», точно так же, как ''bag topi se mehnga hai''. ''Zyada'' необязательно, оно лишь прямо передаёт значение «больше».'
    note: Расширение употребления уже знакомого слова, а не новое грамматическое правило.
  hi.a1.unit14.lesson02.teach.zyada_mehnga_phrase:
    title: Сумка дороже шляпы.
    gloss: Сумка дороже шляпы.
    note: Та же сравнительная конструкция с se, но с необязательным zyada («больше»).
  hi.a1.unit14.lesson02.teach.naya_nai:
    title: Новый
    gloss: новый / новая
    note: Новая пара прилагательных; согласование по образцу -a/-i, как у остальных прилагательных этого юнита.
    example_gloss:
    - Сумка новая.
    - Шляпа новая.
  hi.a1.unit14.lesson02.teach.topi_nai_phrase:
    title: Шляпа новее сумки.
    gloss: Шляпа новее сумки.
    note: Ещё одно сравнение тех же двух предметов (по новизне), как и сравнение по цене.
  hi.a1.unit14.lesson03.teach.review_words:
    title: 'Повторение: большой, маленький, высокий, новый'
    gloss: большой / старший, маленький / младший, высокий / длинный, новый
    note: Краткое повторение основных прилагательных юнита — они нужны для диалога и заметки для чтения.
    example_gloss:
    - Прия старше.
    - Арджун младше.
    - Арджун высокий.
    - Сумка новая.
  hi.a1.unit14.lesson03.teach.main_hun_review:
    title: 'Повторение: я, есть'
    gloss: я, (я) есть
    note: Впервые это было в юните 1 ('main theek hun') — нужно, чтобы Арджун мог говорить о себе в диалоге.
    example_gloss: Я в порядке.
  hi.a1.unit14.lesson03.teach.aur_bhi_review:
    title: 'Повторение: и, тоже'
    gloss: и, тоже
    note: Оба слова уже встречались в текстах диалогов, но здесь впервые вводятся как слова для проверки.
    example_gloss:
    - Я люблю чай и кофе.
    - Мне это тоже нравится.
  hi.a1.unit14.lesson03.teach.ka_review:
    title: 'Повторение: притяжательный показатель'
    gloss: притяжательный показатель (родительный падеж)
    note: Притяжательный показатель, уже много раз встречавшийся в курсе (например, в юнитах 5–11); здесь он помогает сказать, чья именно сумка сравнивается.
    example_gloss: Сумка Арджуна новая.
  hi.a1.unit14.lesson03.teach.dialogue.line01:
    title: Арджун показывает свою новую сумку
    gloss: Прия, это моя новая сумка.
  hi.a1.unit14.lesson03.teach.dialogue.line02:
    title: Прия говорит, что шляпа дешевле
    gloss: Хорошая сумка! Но шляпа дешевле сумки.
  hi.a1.unit14.lesson03.teach.dialogue.line03:
    title: Арджун соглашается, что его сумка дорогая
    gloss: Да. Моя сумка дорогая — она дороже шляпы.
  hi.a1.unit14.lesson03.teach.dialogue.line04:
    title: Прия спрашивает, кто старше
    gloss: Ладно, ладно! Арджун, кто старше — ты или я?
  hi.a1.unit14.lesson03.teach.dialogue.line05:
    title: Арджун отвечает
    gloss: Ты старше, зато я высокий!
  hi.a1.unit14.lesson03.teach.dialogue.line06:
    title: Прия говорит, что шляпа к тому же новее
    gloss: Ладно, ладно! Но шляпа ещё и новее сумки.
  hi.a1.unit14.lesson03.teach.dialogue.line07:
    title: Арджун соглашается и прощается
    gloss: Да, это правда. Увидимся завтра?
  hi.a1.unit14.lesson03.teach.dialogue.line08:
    title: Прия прощается
    gloss: Хорошо! До завтра.
  hi.a1.unit14.lesson03.teach.grammar_summary:
    title: Три главных правила
    gloss: 'Три главных правила юнита: (1) ''X, Y se ADJ hai'' значит «X более ADJ, чем Y»; (2) ADJ всегда согласуется с родом подлежащего (X), а не Y; (3) перед ADJ можно добавить ''zyada'', например ''X, Y se zyada ADJ hai'' — значение остаётся тем же («более ADJ, чем»).'
    note: Итоговое резюме всей грамматики юнита, подобное сводной грамматической заметке юнита 13.
    target_text: 'Три главных правила этого юнита: (1) ''X, Y से ADJ है'' означает «X более ADJ, чем Y»; (2) ADJ всегда согласуется в роде с подлежащим (X), а не с Y; (3) перед ADJ можно добавить ''ज़्यादा'', например ''X, Y से ज़्यादा ADJ है'' -- смысл остаётся тем же («более ADJ, чем»)।'
  hi.a1.unit14.lesson03.teach.priya_note:
    title: Записка Прии
    gloss: Я старше Арджуна, зато Арджун высокий. А моя шляпа хорошая — шляпа дешевле сумки, и к тому же шляпа новее сумки. — Прия
    note: Короткая записка, повторяющая факты из диалога, без новых утверждений.
    glosses:
      बड़ी: старше (о женщине)
      लंबा: высокий
      टोपी: шляпа
      अच्छी: хорошая (ж. р.)
      बैग: сумка
      सस्ती: дешевле / дешёвая (ж. р.)
      नई: новее / новая (ж. р.)
