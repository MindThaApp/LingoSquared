  hi.a1.unit14.lesson01.exercise02.select_bada_meaning:
    instruction: Что значит это слово?
    correct_option: большой / старший
    distractors:
    - маленький / младший
    - новый
    accepted_answers:
    - большой / старший
  hi.a1.unit14.lesson01.exercise03.select_arjun_bada_meaning:
