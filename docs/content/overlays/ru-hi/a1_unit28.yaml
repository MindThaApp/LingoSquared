teaching:
  hi.a1.unit28.lesson01.teach.fon_karna:
    title: Звонить
    gloss: звонить
    note: Инфинитив глагола, которым обозначают звонок по телефону.
    example_gloss: Мне нужно тебе позвонить.
  hi.a1.unit28.lesson01.teach.main_tumhen_fon:
    title: Говорим, что позвоним
    gloss: Я тебе позвоню.
    note: '*करूँगा* — будущее время от *करना*; на хинди оно употребляется там, где по-русски говорят «я позвоню». Тот, кому звонят, стоит в форме *तुम्हें* («тебе»).'
  hi.a1.unit28.lesson01.teach.hailo_main_priya:
    title: Отвечаем на звонок
    gloss: Алло, это Прия.
    note: По телефону говорят *मैं ... बोल रही हूँ* («я говорю»); *रही* — женский род, потому что Прия — женщина.
  hi.a1.unit28.lesson01.teach.hailo_main_arjun:
    title: Арджун отвечает так же
    gloss: Алло, это Арджун.
    note: 'Тот же образец с мужским *रहा*: *मैं अर्जुन बोल रहा हूँ*, потому что Арджун — мужчина.'
  hi.a1.unit28.lesson02.teach.main_kisse_bat:
    title: Спрашиваем, кто звонит
    gloss: С кем я разговариваю?
    note: '*किससे* («с кем») — это *कौन* («кто») плюс *से*, а *से* указывает на того, с кем ты разговариваешь.'
  hi.a1.unit28.lesson02.teach.ap_priya_se:
    title: Представляемся официально
    gloss: Вы разговариваете с Прией.
    note: '*आप* — вежливое «вы» для незнакомого человека. В *प्रिया से बात कर रहे हैं* послелог *से* стоит после имени, а *हैं* согласуется с *आप*.'
  hi.a1.unit28.lesson03.teach.kya_tum_yah:
    title: Просим повторить
    gloss: Ты можешь повторить?
    note: '*सकते हो* означает «можешь» и стоит после основного глагола: *कह सकते हो*. *क्या* в начале делает фразу вопросом.'
  hi.a1.unit28.lesson03.teach.itna_tez_mat:
    title: Просим говорить помедленнее
    gloss: Не говори так быстро, пожалуйста.
    note: '*मत बोलो* — дружеское «не говори» с *तुम*, а *इतना तेज़* значит «так быстро».'
  hi.a1.unit28.lesson03.teach.mujhe_tumharee_avaz:
    title: Говорим, что плохо слышно
    gloss: Я тебя плохо слышу.
    note: 'По-хинди говорят «твой голос не приходит»: *मुझे तुम्हारी आवाज़ नहीं आ रही है*. Тот, кто слышит, получает *मुझे*, а подлежащее — голос.'
  hi.a1.unit28.lesson04.teach.maisej:
    title: Сообщение
    gloss: сообщение
    note: '*मैसेज* — распространённое заимствование мужского рода: *एक मैसेज*, *यह मैसेज ... का है*.'
    example_gloss: Это сообщение от Прии.
  hi.a1.unit28.lesson04.teach.main_tumhen_ek:
    title: Как сказать, что отправишь сообщение
    gloss: Я пришлю тебе сообщение.
    note: 'Порядок такой: человек, затем предмет, затем глагол: *तुम्हें एक मैसेज भेजूँगा*. *भेजना* значит «отправлять».'
  hi.a1.unit28.lesson04.teach.main_tumhen_bad:
    title: Как сказать, что перезвонишь
    gloss: Я позвоню тебе позже.
    note: '*वापस फ़ोन करना* значит «перезвонить», *वापस* стоит перед *फ़ोन करना*; *बाद में* значит «позже».'
  hi.a1.unit28.lesson05.teach.arjun_hay_priya:
    title: Прочитай переписку
    gloss: 'Арджун: Привет, Прия, ты можешь мне позвонить? Мне нужно тебе кое-что сказать. Прия: Да, конечно, я перезвоню тебе через пять минут.'
    note: Обрати внимание, о чём просит Арджун, зачем и когда Прия обещает перезвонить.
    glosses:
      हाय: привет
      सकती: мочь
      फ़ोन: звонить
      ज़रूरी: важный (например, важное дело, о котором нужно сказать)
      कुछ: что-то
      बतानी: рассказать
      ज़रूर: конечно
      करूँगी: позвонит
      पाँच: пять
      मिनट: минуты
      वापस: обратно
  hi.a1.unit28.lesson06.teach.arjun_hailo_main:
    title: Арджун отвечает на звонок
    gloss: 'Арджун: Алло, это Арджун.'
    note: 'Тот, кто отвечает на звонок, сначала называет себя: *मैं ... बोल रहा हूँ*, здесь с мужским *रहा*.'
  hi.a1.unit28.lesson06.teach.priya_hay_arjun:
    title: Прия представляется
    gloss: 'Прия: Привет, Арджун, это Прия. Арджун: Как хорошо, что ты позвонила!'
    note: '*अच्छा हुआ तुमने फ़ोन किया* значит «хорошо, что ты позвонил(а)»; *तुमने ... किया* — прошедшее время с *ने*.'
  hi.a1.unit28.lesson06.teach.priya_tumharee_pahlee:
    title: Прия спрашивает о смене
    gloss: 'Прия: Как прошла твоя первая смена?'
    note: '*कैसी रही* спрашивает «как прошло»; *कैसी* женского рода, потому что *शिफ़्ट* женского рода.'
  hi.a1.unit28.lesson06.teach.arjun_bahut_achchhee:
    title: Арджун сообщает хорошую новость
    gloss: 'Арджун: Прошла очень хорошо, лучше, чем я думал.'
    note: '*अच्छी रही* («прошла хорошо») согласуется с женским *शिफ़्ट*, а *जितना मैंने सोचा था उससे भी बेहतर* значит «даже лучше, чем я думал».'
  hi.a1.unit28.lesson06.teach.vah_narvas_tha:
    title: 'था и थी: был, была'
    gloss: Он нервничал, она была счастлива.
    note: '*था* — «был» для подлежащего мужского рода, а *थी* — для женского; окончание согласуется с тем, о ком или о чём речь.'
  hi.a1.unit28.lesson06.teach.priya_yah_sunkar:
    title: Прия гордится
    gloss: 'Прия: Как приятно это слышать! Я горжусь тобой.'
    note: В *तुम पर गर्व है* («гордость на тебе») используется *पर*, а тот, кто гордится, получает *मुझे*.
  hi.a1.unit28.lesson06.teach.arjun_bahut_shukriya:
    title: Арджун тронут
    gloss: 'Арджун: Большое спасибо, для меня это очень много значит.'
    note: '*मेरे लिए* значит «для меня», а *इसका बहुत मतलब है* — «это очень много значит».'
  hi.a1.unit28.lesson06.teach.uskee_pahlee_shift:
    title: Его
    gloss: Его первая смена прошла очень хорошо.
    note: '*उसकी* значит «его» или «её» (одно и то же слово для обоих) и согласуется с женским *शिफ़्ट*.'
