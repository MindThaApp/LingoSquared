teaching:
  hi.a1.unit18.lesson01.teach.ghar_review:
    title: 'Повторение: дом'
    gloss: дом
    note: Это слово уже было в уроке 8 — оно главное в теме всего этого урока.
    example_gloss: Это дом.
  hi.a1.unit18.lesson01.teach.mein_review:
    title: 'Повторение: в / на'
    gloss: в / на
    note: Это слово уже было в уроке 1 — в этом уроке оно указывает, где находятся комнаты и предметы.
    example_gloss: Я работаю в офисе.
  hi.a1.unit18.lesson01.teach.hai_hain_review:
    title: 'Повторение: есть (ед. ч.), есть (мн. ч.)'
    gloss: есть (ед. число), есть (мн. число)
    note: Пара форм связки для единственного и множественного числа — от неё зависит вся модель с количеством в этом уроке.
    example_gloss:
    - Это дом.
    - Мой дедушка живёт в Дели.
  hi.a1.unit18.lesson01.teach.numbers_review:
    title: 'Повторение: сколько, один, два, три'
    gloss: сколько, один, два, три
    note: Эти слова были в уроках 2 и 7 — здесь они нужны, чтобы считать комнаты.
    example_gloss:
    - У меня три брата.
    - Сколько комнат в доме?
  hi.a1.unit18.lesson01.teach.kamra_kamre:
    title: Комната (ед. / мн. число)
    gloss: комната, комнаты
    note: 'Новое существительное. Обрати внимание на множественное число: *kamra* (одна) превращается в *kamre* (больше одной) — см. грамматическое примечание этого урока.'
    example_gloss:
    - В доме одна комната.
    - В доме три комнаты.
  hi.a1.unit18.lesson01.teach.grammar_room_plural:
    title: 'Мужской род: -а → -е во множественном числе'
    gloss: 'Существительные мужского рода на «-а» во множественном числе меняют окончание на «-е»: ''kamra'' (один) становится ''kamre'' (больше одного). Глагол тоже меняется в зависимости от числа: ''hai'' для одного, ''hain'' для нескольких — например, ''ghar mein ek kamra hai'', но ''ghar mein teen kamre hain''.'
    note: Первое правило образования множественного числа существительных в этом курсе; оно объясняется до того, как на него опираются упражнения.
  hi.a1.unit18.lesson01.teach.rasoi:
    title: Кухня
    gloss: кухня
    note: Новое существительное — первое название комнаты в этом уроке.
    example_gloss: В доме есть кухня.
  hi.a1.unit18.lesson01.teach.bathroom:
    title: Ванная
    gloss: ванная
    note: Это распространённое заимствование в повседневной разговорной речи на хинди, как и слова *doctor* и *engineer* (уроки 16 и 17).
    example_gloss: В доме есть ванная.
  hi.a1.unit18.lesson01.teach.bedroom:
    title: Спальня
    gloss: спальня
    note: 'Тоже частое заимствование, неизменяемое, как *bathroom*: оно не получает собственного окончания множественного числа — только числительное и *hain*.'
    example_gloss: В доме две спальни.
  hi.a1.unit18.lesson01.teach.ghar_mein_kitne_kamre_phrase:
    title: Сколько комнат в доме?
    gloss: Сколько комнат в доме?
    note: Вопрос, с которого начинается этот урок.
  hi.a1.unit18.lesson01.teach.ghar_mein_teen_kamre_phrase:
    title: В доме три комнаты.
    gloss: В доме три комнаты.
    note: Образец ответа на вопрос, с которого начинается урок.
  hi.a1.unit18.lesson02.teach.aur_review:
    title: 'Повторение: и'
    gloss: и
    note: Это слово было в уроке 1 — здесь оно помогает перечислять мебель.
    example_gloss: Мне тоже понравилось, а тебе?
  hi.a1.unit18.lesson02.teach.mez:
    title: Стол
    gloss: стол
    note: Новое существительное; в упражнениях этого урока оно только в единственном числе (его правило множественного числа ещё не изучено).
    example_gloss: На кухне есть стол.
  hi.a1.unit18.lesson02.teach.kursi_kursiyan:
    title: Стул (ед. / мн. число)
    gloss: стул, стулья
    note: 'Новое существительное. Обрати внимание на множественное число: *kursi* (один) превращается в *kursiyan* (больше одного) — это другое правило, не как у *kamra*/*kamre*; см. грамматическое примечание этого урока.'
    example_gloss:
    - На кухне есть стул.
    - На кухне четыре стула.
  hi.a1.unit18.lesson02.teach.chaar_review:
    title: 'Повторение: четыре'
    gloss: четыре
    note: Это слово было в уроке 2 — здесь оно нужно, чтобы считать стулья.
    example_gloss: На кухне четыре стула.
  hi.a1.unit18.lesson02.teach.grammar_feminine_plural:
    title: 'Женский род: -и → -иян во множественном числе'
    gloss: 'Существительные женского рода на «-и» во множественном числе меняют окончание на «-иян»: ''kursi'' (один) становится ''kursiyan'' (больше одного), так же как ''kamra'' ранее в этом уроке стало ''kamre'' по правилу мужского рода, — но здесь правило другое, потому что слово женского рода и оканчивается на «-и».'
    note: Второе правило множественного числа в этом уроке; оно намеренно идёт сразу за первым, чтобы различие было хорошо видно.
  hi.a1.unit18.lesson02.teach.bistar:
    title: Кровать
    gloss: кровать
    note: Новое существительное; в упражнениях этого урока оно только в единственном числе.
    example_gloss: В спальне есть кровать.
  hi.a1.unit18.lesson02.teach.khidki_khidkiyan:
    title: Окно (ед. / мн. число)
    gloss: окно, окна
    note: Множественное число образуется по тому же правилу женского рода «-и» → «-иян», что и *kursi*/*kursiyan*.
    example_gloss:
    - В спальне есть окно.
    - В спальне два окна.
  hi.a1.unit18.lesson02.teach.rasoi_mein_mez_phrase:
    title: На кухне есть стол.
    gloss: На кухне есть стол.
    note: Модель «место + предмет» на примере кухни.
  hi.a1.unit18.lesson02.teach.bedroom_mein_bistar_phrase:
    title: В спальне есть кровать.
    gloss: В спальне есть кровать.
    note: Модель «место + предмет» на примере спальни.
  hi.a1.unit18.lesson03.teach.kaisa_review:
    title: 'Повторение: какой / каков'
    gloss: какой / каков
    note: Это слово было в уроке 12 — здесь оно нужно, чтобы спросить о доме.
    example_gloss: Какой у тебя дом?
  hi.a1.unit18.lesson03.teach.bada_chota_review:
    title: 'Повторение: большой, маленький'
    gloss: большой (м. р.), большая (ж. р.), маленький (м. р.), маленькая (ж. р.)
    note: 'Эти слова были в уроке 14 — здесь они нужны, чтобы описать жильё. Они согласуются в роде с существительным: *ghar* мужского рода — *bada*/*chota*, *rasoi* женского рода — *badi*.'
    example_gloss:
    - Мой дом маленький.
    - Это большая кухня.
  hi.a1.unit18.lesson03.teach.ya_review:
    title: 'Повторение: или'
    gloss: или
    note: Это слово было в уроке 14 — здесь оно нужно для вопроса с выбором.
    example_gloss: Твой дом большой или маленький?
  hi.a1.unit18.lesson03.teach.arjun_priya_review:
    title: 'Повторение: Арджун, Прия'
    gloss: Арджун, Прия
    note: 'Напоминание об именах обоих героев перед упражнениями на порядок слов и проверку грамматики в этом уроке: по ним определяется, о чьём доме идёт речь.'
    example_gloss:
    - Меня зовут Арджун.
    - Меня зовут Прия.
  hi.a1.unit18.lesson03.teach.ka_review:
    title: 'Повторение: притяжательное का'
    gloss: 'принадлежность (при существительном мужского рода): «чей-то»'
    note: Это слово уже встречалось в уроках 7, 10, 12, 14 и 15. Здесь оно используется, чтобы сказать, чей дом описывается, и во всём уроке стоит в своей обычной форме.
    example_gloss: Дом Прии маленький.
  hi.a1.unit18.lesson03.teach.dialogue.line01:
    title: Арджун спрашивает Прию о её доме
    gloss: Прия, твой дом большой или маленький?
  hi.a1.unit18.lesson03.teach.dialogue.line02:
    title: Прия говорит, что её дом маленький
    gloss: Мой дом маленький. В доме две комнаты, кухня и ванная.
  hi.a1.unit18.lesson03.teach.dialogue.line03:
    title: Прия задаёт Арджуну тот же вопрос
    gloss: А твой дом, Арджун?
  hi.a1.unit18.lesson03.teach.dialogue.line04:
    title: Арджун говорит, что его дом большой
    gloss: Мой дом большой. В доме три спальни и большая кухня.
  hi.a1.unit18.lesson03.teach.dialogue.line05:
    title: Прия спрашивает, что есть в спальне
    gloss: Ого! А что в спальне?
  hi.a1.unit18.lesson03.teach.dialogue.line06:
    title: Арджун описывает спальню
    gloss: В спальне есть кровать и два окна.
  hi.a1.unit18.lesson03.teach.dialogue.line07:
    title: Прия реагирует
    gloss: Очень хорошо!
  hi.a1.unit18.lesson03.teach.dialogue.line08:
    title: Арджун благодарит её
    gloss: Спасибо!
  hi.a1.unit18.lesson03.teach.grammar_summary:
    title: Три главных правила
    gloss: 'Три главных правила этого урока: (1) «[место] + mein + [число] + [существительное] + hai/hain» — так говорят, что есть в доме и сколько; (2) существительные мужского рода на «-a» во множественном числе получают «-e» (kamra -> kamre); (3) существительные женского рода на «-i» во множественном числе получают «-iyan» (kursi -> kursiyan, khidki -> khidkiyan).'
    note: Итоговое резюме грамматики всего урока, подобное обобщающим грамматическим заметкам уроков 15–17.
  hi.a1.unit18.lesson03.teach.home_reading:
    title: Читаем о двух домах
    gloss: Дом Прии маленький. В доме две комнаты, кухня и ванная. Дом Арджуна большой. В доме три спальни и большая кухня.
    note: Короткий текст-описание, повторяющий только факты из диалога, без новых сведений. Он помогает научиться читать краткое описание жилья.
    glosses:
      घर: дом
      छोटा: маленький
      कमरे: комнаты
      रसोई: кухня
      बाथरूम: ванная
      बड़ा: большой
      बेडरूम: спальни
      बड़ी: большая (ж. р.)
