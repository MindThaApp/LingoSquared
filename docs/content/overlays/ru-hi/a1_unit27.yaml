teaching:
  hi.a1.unit27.lesson01.teach.khush_udas_naraz:
    title: Радость, грусть и злость
    gloss: рад, грустный, сердитый
    note: '*खुश*, *उदास* и *नाराज़* — базовые слова для чувств; они употребляются с *हूँ* или *है* («я являюсь», «он является») и не меняются по роду.'
    example_gloss:
    - Я рад.
    - Мне грустно.
    - Я сержусь.
  hi.a1.unit27.lesson01.teach.main_khush_hoon:
    title: Говорим, что ты рад
    gloss: Я счастлив.
    note: '*मैं खुश हूँ* строится по схеме *मैं* + чувство + *हूँ*, как русское «я рад» без изменений по роду.'
  hi.a1.unit27.lesson01.teach.main_naraz_naheen:
    title: Противопоставляем чувства
    gloss: Я не сержусь, мне грустно.
    note: '*नहीं* стоит прямо перед *हूँ*: *नाराज़ नहीं हूँ*. Во второй части называется настоящее чувство.'
  hi.a1.unit27.lesson02.teach.tum_khush_kyon:
    title: Спрашиваем «почему»
    gloss: Почему ты рад?
    note: '*क्यों* («почему») стоит перед главным словом: *तुम खुश क्यों हो?*. *तुम* — неформальное «ты».'
  hi.a1.unit27.lesson02.teach.main_khush_hoon:
    title: Называем причину
    gloss: Я рад, потому что у меня новая квартира.
    note: '*क्योंकि* вводит причину. *मेरे पास ... है* значит «у меня есть», а глагол *है* стоит в конце.'
  hi.a1.unit27.lesson02.teach.main_udas_hoon:
    title: Грустная причина
    gloss: Мне грустно, потому что идёт дождь.
    note: '*बारिश हो रही है* — «идёт дождь» (буквально «дождь происходит»).'
  hi.a1.unit27.lesson03.teach.narvas:
    title: Нервный
    gloss: нервный
    note: Обычное слово для обозначения волнения.
    example_gloss: Я нервничаю перед своей первой сменой.
  hi.a1.unit27.lesson03.teach.main_apnee_pahlee:
    title: Говорим, из-за чего ты нервничаешь
    gloss: Я нервничаю перед своей первой сменой.
    note: '*को लेकर* значит «по поводу», «из-за» и стоит после существительного: *शिफ़्ट को लेकर*. *अपनी* («свою») согласуется с существительным женского рода *शिफ़्ट*.'
  hi.a1.unit27.lesson03.teach.chinta_mat_karo:
    title: Успокаиваем человека
    gloss: Не волнуйся.
    note: '*चिंता मत करो* — дружеское «не волнуйся»: *मत* + *करो* — это повелительная форма для *तुम* с запретом.'
  hi.a1.unit27.lesson04.teach.arjun_kaisa_mahsoos:
    title: Спрашиваем, как человек себя чувствует
    gloss: Как себя чувствует Арджун?
    note: '*कैसा महसूस कर रहा है* спрашивает «как он себя чувствует». *कैसा* согласуется с лицом: о женщине скажут *कैसी*.'
  hi.a1.unit27.lesson04.teach.vah_narvas_mahsoos:
    title: Описываем, как человек себя чувствует
    gloss: Он нервничает.
    note: 'Отдельного слова для «себя» здесь нет: *वह नर्वस महसूस कर रहा है* использует просто *वह* и *रहा है*.'
  hi.a1.unit27.lesson04.teach.vah_narvas_kyon:
    title: Спрашиваем, почему человек так себя чувствует
    gloss: Почему он нервничает?
    note: '*क्यों* стоит прямо перед глагольной группой: *वह नर्वस क्यों महसूस कर रहा है?*'
  hi.a1.unit27.lesson05.teach.hay_priya_main:
    title: Читаем сообщение о чувствах
    gloss: Привет, Прия, я немного нервничаю из-за своей первой смены в одиночку. Но я и рад, ведь у меня новая работа и новая квартира. Думаю, всё будет хорошо.
    note: Обрати внимание, из-за чего автор нервничает, что его радует и как он смотрит на будущее.
    glosses:
      थोड़ा: немного
      नर्वस: нервный, взволнованный
      पहली: первый
      शिफ़्ट: смена
      अकेले: один, самостоятельно
      खुश: довольный
      क्योंकि: потому что
      नई: новый
      नौकरी: работа
      नया: новый
      फ़्लैट: квартира
      लगता: думать
      होगा: 'получится, сложится (здесь: всё будет хорошо)'
  hi.a1.unit27.lesson06.teach.priya_hay_arjun:
    title: Прия спрашивает, как себя чувствует Арджун
    gloss: 'Прия: Привет, Арджун, как ты себя чувствуешь перед своей первой сменой?'
    note: 'Снова *को लेकर*: *अपनी पहली शिफ़्ट को लेकर* («по поводу твоей первой смены»). *तुम* — неформальное обращение.'
  hi.a1.unit27.lesson06.teach.arjun_sach_kahoon:
    title: Арджун признаётся, что нервничает
    gloss: 'Арджун: Честно говоря, я немного нервничаю.'
    note: '*सच कहूँ तो* («если сказать правду») смягчает признание.'
  hi.a1.unit27.lesson06.teach.priya_chinta_mat:
    title: Прия подбадривает его
    gloss: 'Прия: Не волнуйся, у тебя всё отлично получится!'
    note: '*तुम यह अच्छे से कर सकते हो* значит «ты можешь сделать это хорошо», а *अच्छे से* — «хорошо».'
  hi.a1.unit27.lesson06.teach.arjun_shukriya_isse:
    title: Арджун благодарит её
    gloss: 'Арджун: Спасибо, это правда помогает.'
    note: '*इससे मदद मिलती है* буквально «от этого получается помощь»: источник помощи отмечен словом *से*.'
  hi.a1.unit27.lesson06.teach.priya_aur_bad:
    title: Прия предсказывает, чем всё закончится
    gloss: 'Прия: А потом ты обязательно будешь очень счастлив и горд.'
    note: '*ज़रूर* («обязательно») делает предсказание уверенным, а *तुम्हें गर्व होगा* значит «ты будешь гордиться».'
  hi.a1.unit27.lesson06.teach.arjun_han_mujhe:
    title: Арджун соглашается
    gloss: 'Арджун: Да, мне тоже так кажется.'
    note: '*मुझे भी ऐसा ही लगता है* («мне тоже так кажется») — естественный способ согласиться; *मुझे* показывает, кто это чувствует.'
  hi.a1.unit27.lesson06.teach.arjun_narvas_hai:
    title: 'Местоимения: उसकी'
    gloss: Арджун нервничает. Прия ему помогает.
    note: '*उसकी* значит «его» или «её» и согласуется с существительным женского рода *मदद*, поэтому *उसकी मदद करना* — «помогать ему»; *है* и *करती है* — глагольные формы 3-го лица.'
