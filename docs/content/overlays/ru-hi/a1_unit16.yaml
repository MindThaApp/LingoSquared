answer_policy:
  mujhe_noun_hai_symptom: This unit's central grammar point extends the dative + noun + है construction (मुझे/तुम्हें + noun + है) to symptom statements, e.g. "मुझे सिर दर्द है" (I have a headache). A typed answer that drops है entirely, or that appends हैं instead of है (है is invariant here -- it agrees with the following noun, not the दात subject), should be marked incorrect -- this is the exact point being tested.
  ke_paas_sense: '"डॉक्टर के पास जाना है" uses के पास in its third disclosed sense (at a person''s place), distinct from unit08''s "near" and "possession" senses. A typed answer omitting के पास entirely (e.g. just "मुझे डॉक्टर जाना है") should be marked incorrect, since के पास is the load-bearing piece that makes the sentence mean "to the doctor(''s)" rather than something ungrammatical.'
  karo_imperative: '"करो" is a regular तुम-imperative (कर + ओ), the same formation rule already taught for जाओ/मुड़ो/बताओ/गिनो in unit 9. A typed answer using a different, unlearned imperative form should be marked incorrect as a real error, not tolerated as a minor typo.'
  nasalization_marks: Display and teach the correct chandrabindu/anusvara distinction. None of this unit's new words (सिर, दर्द, बुखार, डॉक्टर, आराम, दवा, करो) carry any nasalization mark at all, verified via direct codepoint check -- no tolerance rule is needed for a nasalization mark that was never present.
  punctuation: Hindi text is shown with the traditional danda (।) as the sentence-final mark. In typed answers, accept the danda, a plain period (.), or the mark omitted entirely as equivalent. Question marks (?) may likewise be omitted, but the fully punctuated form remains the model answer.
  spoken_answers: Judge spoken responses by intelligibility rather than written punctuation. For any exercise asking the learner to state their own symptom or need, accept any of this unit's taught phrasings that fit the prompt, not only the single model sentence given in `accepted_answers`.
course:
  title: Хинди A1
units:
  hi.a1.unit16.health:
    title: Здоровье
lessons:
  hi.a1.unit16.lesson01.sir_dard_bukhar:
    title: Головная боль и жар
  hi.a1.unit16.lesson02.doctor_dawa:
    title: Врач и лекарство
  hi.a1.unit16.lesson03.priya_arjun_theek_ho:
    title: 'Прия и Арджун: ты в порядке?'
teaching:
  hi.a1.unit16.lesson01.teach.tum_ho_review:
    title: 'Повторение: ты, в порядке, есть'
    gloss: ты (неформально), в порядке / хорошо, есть (форма для «ты»)
    note: Краткое повторение слов, нужных, чтобы спросить друга о самочувствии.
    example_gloss: Как ты?
  hi.a1.unit16.lesson01.teach.mujhe_hai_review:
    title: 'Повторение: мне, есть'
    gloss: мне / для меня, есть
    note: Глагол-связка, нужный для конструкции с симптомами в этом уроке.
    example_gloss: У меня есть дело.
  hi.a1.unit16.lesson01.teach.tum_theek_ho_phrase:
    title: Ты в порядке?
    gloss: Ты в порядке?
    note: 'Вопрос, с которого начинается урок: так справляются о самочувствии друга.'
  hi.a1.unit16.lesson01.teach.main_hoon_nahin_review:
    title: 'Повторение: я, есть (я), нет / не'
    gloss: я, есть (я), нет / не
    note: Нужно, чтобы ответить отрицательно на вопрос «Ты в порядке?».
    example_gloss: Я в порядке.
  hi.a1.unit16.lesson01.teach.sir:
    title: Голова
    gloss: голова
    note: Новое существительное, нужное для первого симптома в этом уроке.
    example_gloss: Моя голова большая.
  hi.a1.unit16.lesson01.teach.dard:
    title: Боль
    gloss: боль
    note: Новое существительное. В сочетании с названием части тела оно обозначает конкретную боль -- см. грамматическую заметку этого урока.
    example_gloss: У меня боль.
  hi.a1.unit16.lesson01.teach.mujhe_sir_dard_hai_phrase:
    title: У меня болит голова.
    gloss: У меня болит голова.
    note: Первое полное предложение о симптоме в этом уроке.
  hi.a1.unit16.lesson01.teach.grammar_symptom_hai:
    title: Mujhe + симптом + hai
    gloss: '''Mujhe + существительное + hai'' мы уже изучали в 11-м уроке (''mujhe kaam hai'' = у меня есть дело). Теперь эта конструкция используется и для симптомов: ''mujhe sir dard hai'' значит «у меня болит голова» -- ''sir dard'' (sir = голова, dard = боль) вместе дают «головная боль». Это не новая грамматика, а тот же образец, что и раньше.'
    note: Показывает второе применение уже знакомой конструкции «дательный падеж + существительное + hai», напоминая, в каком уроке она встречалась, прежде чем применить её к симптомам.
    target_text: '''मुझे + संज्ञा + है'' पहले यूनिट 11 में सीखा था (''मुझे काम है'' = у меня есть дело)। अब यह लक्षण बताने के लिए भी इस्तेमाल होता है: ''मुझे सिर दर्द है'' का मतलब है «у меня болит голова» -- ''सिर दर्द'' (सिर = голова, दर्द = боль) एक साथ मिलकर «головная боль» बनाते हैं। यह कोई नया व्याकरण नहीं है, वही पुराना पैटर्न है।'
  hi.a1.unit16.lesson01.teach.bukhar:
    title: Температура
    gloss: температура (жар)
    note: Новое существительное, второй симптом этого урока.
    example_gloss: У тебя жар?
  hi.a1.unit16.lesson01.teach.mujhe_bukhar_hai_phrase:
    title: У меня жар.
    gloss: У меня температура.
    note: Та же конструкция «дательный падеж + существительное + hai», применённая ко второму симптому этого урока.
  hi.a1.unit16.lesson02.teach.tumhein_jaana_review:
    title: 'Повторение: тебе, идти / ехать'
    gloss: тебе / для тебя, идти / ехать
    note: Оба слова уже изучены (уроки 6 и 15) -- здесь они используются, чтобы говорить о походе к врачу.
    example_gloss:
    - Что тебе нужно?
    - Мне нужно на вокзал.
  hi.a1.unit16.lesson02.teach.ke_paas_review:
    title: 'Повторение: возле / у'
    gloss: возле / у (места)
    note: Впервые встретилось в 8-м уроке -- здесь повторяется, а в грамматической заметке этого урока получает третье значение.
    example_gloss: Банк рядом со школой.
  hi.a1.unit16.lesson02.teach.doctor:
    title: Врач
    gloss: врач
    note: Новое существительное, главная тема этого урока.
    example_gloss: Врач хороший.
  hi.a1.unit16.lesson02.teach.mujhe_doctor_ke_paas_jana_hai_phrase:
    title: Мне нужно к врачу.
    gloss: Мне нужно к врачу.
    note: Сочетает *ke paas* с конструкцией долженствования *mujhe...jana hai* из 15-го урока.
  hi.a1.unit16.lesson02.teach.grammar_ke_paas_third_sense:
    title: 'Ke paas: третье значение'
    gloss: 'Первые два значения ke paas уже были: «рядом» (урок 8: bank school ke paas hai) и принадлежность (урок 2: mere paas ek kitab hai). Теперь третье: идти к человеку, то есть обратиться к нему. Doctor ke paas jana hai значит «нужно идти к врачу». Конструкция mujhe...jana hai тоже уже была в уроке 15.'
    note: Напоминает оба прежних значения с номерами уроков, прежде чем ввести третье, и отмечает повторное использование конструкции долженствования.
  hi.a1.unit16.lesson02.teach.aaraam:
    title: Отдых
    gloss: отдых
    note: Новое существительное, первый совет этого урока.
    example_gloss: Мне нужен отдых.
  hi.a1.unit16.lesson02.teach.chahiye_review:
    title: 'Повторение: хотеть / нужно'
    gloss: хотеть / нужно
    note: Слово изучалось в уроке 6, здесь оно используется, чтобы сказать, что кому-то нужно.
    example_gloss: Я бы хотел чаю.
  hi.a1.unit16.lesson02.teach.tumhein_aaraam_chahiye_phrase:
    title: Тебе нужен отдых.
    gloss: Тебе нужен отдых.
    note: Уже знакомая модель *tumhein...chahiye* с новым существительным этого урока.
  hi.a1.unit16.lesson02.teach.dawa:
    title: Лекарство
    gloss: лекарство
    note: Новое существительное, второй совет этого урока.
    example_gloss: Мне нужно лекарство.
  hi.a1.unit16.lesson02.teach.tumhein_dawa_chahiye_phrase:
    title: Тебе нужно лекарство.
    gloss: Тебе нужно лекарство.
    note: Та же модель с *chahiye*, применённая к слову «лекарство».
  hi.a1.unit16.lesson02.teach.jaao_aur_review:
    title: 'Повторение: иди!, и'
    gloss: иди!, и
    note: Оба слова уже изучены (урок 9 и урок 1/2). Здесь они связывают два совета.
    example_gloss:
    - Идите прямо.
    - Я бы хотел чай и кофе.
  hi.a1.unit16.lesson02.teach.karo_grammar:
    title: 'Karo: то же правило повелительного наклонения на -o'
    gloss: 'Karo образуется по тому же правилу повелительного наклонения для «ты», что и раньше (jao, muro, batao, gino: все оканчиваются на «-o»). Здесь оно образовано от karna (maaf karna из урока 11): основа kar плюс «-o» даёт karo, то есть «делай!». Aaraam karo значит «Отдыхай!»'
    note: Прямое и явное применение уже известного правила повелительного наклонения к глаголу, который ученик знает в инфинитиве.
  hi.a1.unit16.lesson02.teach.aaraam_karo_phrase:
    title: Отдыхай!
    gloss: Отдыхай!
    note: Новое повелительное наклонение, применённое к первому совету этого урока.
  hi.a1.unit16.lesson02.teach.aaraam_karo_aur_doctor_ke_paas_jaao_phrase:
    title: Отдохни и сходи к врачу.
    gloss: Отдохни и сходи к врачу.
    note: Объединяет два совета урока в одно естественное указание и готовит к карточке для чтения в уроке 3.
  hi.a1.unit16.lesson03.teach.dialogue.line01:
    title: Прия спрашивает, всё ли в порядке у Арджуна
    gloss: Арджун, ты в порядке?
  hi.a1.unit16.lesson03.teach.dialogue.line02:
    title: Арджун говорит, что у него болит голова и жар
    gloss: Нет, у меня болит голова и жар.
  hi.a1.unit16.lesson03.teach.dialogue.line03:
    title: Прия говорит, что ему нужен отдых
    gloss: Это нехорошо. Тебе нужен отдых.
  hi.a1.unit16.lesson03.teach.dialogue.line04:
    title: Арджуну нужно ещё и лекарство
    gloss: Да, но мне ещё нужно лекарство.
  hi.a1.unit16.lesson03.teach.dialogue.line05:
    title: Прия говорит, что ему нужно к врачу
    gloss: Хорошо. Тебе нужно сходить к врачу.
  hi.a1.unit16.lesson03.teach.dialogue.line06:
    title: Арджун благодарит Прию
    gloss: Хорошо, спасибо.
  hi.a1.unit16.lesson03.teach.dialogue.line07:
    title: Прия говорит ему отдыхать
    gloss: Отдыхай!
  hi.a1.unit16.lesson03.teach.dialogue.line08:
    title: Арджун соглашается
    gloss: Хорошо.
  hi.a1.unit16.lesson03.teach.grammar_summary:
    title: Три главных правила
    gloss: 'Три главных правила этого урока: (1) mujhe/tumhein + симптом + hai говорит о недомогании (например, mujhe bukhar hai); (2) tumhein/mujhe + предмет + chahiye говорит о потребности (например, tumhein aaraam chahiye); (3) X ke paas jana hai говорит, к кому нужно идти (например, doctor ke paas jana hai).'
    note: Итоговое резюме всей грамматики урока, как и грамматическая заметка в уроке 15, которая объединяла парадигму.
  hi.a1.unit16.lesson03.teach.advice_reading:
    title: Читаем совет
    gloss: Отдыхай. Сходи к врачу.
    note: Короткое прямое указание без развёрнутого повествования, как звучат настоящие устные советы. Оно повторяет факты из диалога и ничего нового не добавляет.
    glosses:
      आराम: отдыхай
      करो: делай (повелительное наклонение от करना)
      डॉक्टर: врач
      जाओ: иди (повелительное наклонение от जाना)
