    gloss: 'Сейчас весна. Цветы прекрасны. Нина спрашивает: какое время года тебе кажется красивым? Арджун говорит: мне нравится лето. Летом мы плаваем. Прия говорит: мне нравится зима. Зимой мы катаемся на коньках.'
