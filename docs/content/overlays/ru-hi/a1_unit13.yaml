answer_policy:
  number_agreement: This unit's central grammar point is that 'है'/'हैं' after *पसंद* agrees with the NUMBER of the liked thing (not the speaker's or the liked thing's gender) -- e.g. *चाय पसंद है* (tea, singular) vs. *किताबें पसंद हैं* (books, plural). A typed answer using the wrong number's copula for a thing whose number is already fixed by the sentence (e.g. *किताबें* is always plural) should be marked incorrect -- this is the exact point being tested. For open-ended "what do you like" prompts (writing_prompt/speak_response) where the learner picks their own liked thing, accept either singular or plural framing as long as है/हैं internally agrees with whichever noun the learner chose.
  chahiye_vs_pasand: This unit deliberately distinguishes *चाहिए* (unit 6, "want/need", takes no है after it, invariant) from *पसंद है/हैं* (this unit, "like", always requires a है/हैं copula that agrees in number with the liked thing) -- a typed answer that drops the है/हैं after पसंद, or that adds है after चाहिए, should be marked incorrect as a real structural error, not tolerated as a minor typo.
  nasalization_marks: Display and teach the correct chandrabindu/anusvara distinction. This unit's new nasalized words (पसंद, संगीत, and किताबें's plural ending) all use anusvara, verified against a direct codepoint check -- consistent with the already-established हैं/मुझे/तुम्हें convention. In typed A1 answers, accept a variant that drops a nasalization mark entirely or substitutes anusvara for chandrabindu (or vice versa) when every other character is correct. Do not extend this tolerance to a wrong vowel or consonant, which changes the actual word.
  punctuation: Hindi text is shown with the traditional danda (।) as the sentence-final mark. In typed answers, accept the danda, a plain period (.), or the mark omitted entirely as equivalent. Question marks (?) may likewise be omitted, but the fully punctuated form remains the model answer.
  spoken_answers: Judge spoken responses by intelligibility rather than written punctuation or nasalization marks. For any exercise asking the learner to state their own likes/dislikes/preferences, accept any of this unit's taught phrasings that fit the prompt, not only the single model sentence given in `accepted_answers`.
course:
  title: Хинди A1
units:
  hi.a1.unit13.preferences:
    title: Предпочтения
lessons:
  hi.a1.unit13.lesson01.pasand_hai:
    title: Мне нравится
  hi.a1.unit13.lesson02.tumhein_kya_pasand:
    title: Что тебе нравится?
  hi.a1.unit13.lesson03.arjun_priya_pasand:
    title: 'Арджун и Прия: предпочтения'
teaching:
  hi.a1.unit13.lesson01.teach.chai_coffee_review:
    title: 'Повторение: чай, кофе'
    gloss: чай, кофе
    note: 'Краткое повторение лексики из урока 6: она нужна, чтобы говорить о том, что нравится и что не нравится.'
    example_gloss:
    - Я хочу чаю.
    - Я хочу кофе.
  hi.a1.unit13.lesson01.teach.mujhe_review:
    title: 'Повторение: мне'
    gloss: мне
    note: Местоимение в дательном падеже уже встречалось раньше и использовалось в уроках 6, 7 и 11 — здесь оно сочетается с новым сказуемым.
    example_gloss: Я хочу чаю.
  hi.a1.unit13.lesson01.teach.pasand:
    title: Нравится
    gloss: нравится
    note: Существительное со значением «симпатия, расположение» (а не «любимый»). Вместе с подлежащим в дательном падеже (mujhe/tumhein) и связкой hai/hain оно образует выражение «мне нравится…».
    example_gloss: Мне нравится чай.
  hi.a1.unit13.lesson01.teach.pasand_hai_grammar:
    title: Pasand hai = нравится
    gloss: «Pasand hai» буквально значит «X приятен мне», то есть «мне нравится X». Конструкция начинается с mujhe/tumhein, как и «mujhe...chahiye» (урок 6), но после «chahiye» связка «hai» не нужна, а после «pasand» всегда стоит «hai» или «hain».
    note: Явно показывает разницу между chahiye (хотеть/нуждаться) и pasand hai (нравиться), чтобы не путать эти две конструкции.
  hi.a1.unit13.lesson01.teach.sangeet:
    title: Музыка
    gloss: музыка
    note: 'Новое существительное: на нём отрабатывается конструкция pasand hai с подлежащим в единственном числе, обозначающим неисчисляемое понятие.'
    example_gloss: Я люблю музыку.
  hi.a1.unit13.lesson01.teach.haan_nahi_review:
    title: 'Повторение: да, нет'
    gloss: да, нет
    note: 'Краткое повторение двух ранних слов: они нужны в этом уроке, чтобы отвечать на вопросы о предпочтениях и отрицать.'
    example_gloss:
    - Да, я люблю музыку.
    - Нет, я не люблю кофе.
  hi.a1.unit13.lesson01.teach.pasand_nahi_hai_phrase:
    title: Я не люблю кофе.
    gloss: Мне не нравится кофе.
    note: 'Отрицание строится так же, как в других предложениях с «hai», которые ты уже учил (например, «yoga class nahin hai» в уроке 3): «nahin» стоит прямо перед «hai».'
  hi.a1.unit13.lesson01.teach.kitab_kitaben:
    title: Книга / книги
    gloss: книга / книги
    note: Новая пара существительных, единственное и множественное число. На ней видно, что «hai»/«hain» после «pasand» согласуется с числом того, что нравится.
    example_gloss:
    - Мне нравится эта книга.
    - Я люблю книги.
  hi.a1.unit13.lesson01.teach.number_agreement_grammar:
    title: Hai или hain после pasand
    gloss: '«Hai» или «hain» после «pasand» согласуется с ЧИСЛОМ того, что нравится, точно как в «mere paas...hai/hain» (урок 2): chai/sangeet pasand hai (единственное число), kitaben pasand hain (множественное число).'
    note: Это прямое продолжение правила согласования «hai»/«hain» по числу из урока 2, только в новом контексте. Новой грамматики здесь нет.
  hi.a1.unit13.lesson02.teach.tumhein_review:
    title: 'Повторение: тебе (неформально)'
    gloss: тебе (неформально)
    note: Впервые это слово встретилось в уроке 6 с «chahiye» («tumhein...chahiye?»). Здесь та же дательная форма местоимения используется с «pasand hai».
    example_gloss: Ты любишь музыку?
  hi.a1.unit13.lesson02.teach.kya_tumhein_pasand_hai_grammar:
    title: Kya tumhein...pasand hai?
    gloss: «Kya» в начале вопроса — показатель вопроса «да/нет» (урок 1). «Tumhein» повторяет уже знакомую конструкцию из «tumhein...chahiye?» (урок 6); только вместо «chahiye» здесь «pasand hai».
    note: Это подтверждает, что перед тобой уже знакомая модель вопроса, а не новое грамматическое правило.
  hi.a1.unit13.lesson02.teach.khel:
    title: Спорт / игра
    gloss: спорт / игра
    note: 'Новое существительное. В примерах оно стоит с «yah» (этот), чтобы согласование по числу было однозначным: само по себе «khel» не меняется в единственном и множественном числе.'
    example_gloss: Мне нравится этот вид спорта.
  hi.a1.unit13.lesson02.teach.yah_review:
    title: 'Повторение: этот'
    gloss: этот
    note: Впервые это слово встретилось в уроке 7 («mujhe yah chahiye»). Здесь оно помогает однозначно указать на единственное число «khel».
    example_gloss: Эта книга хорошая.
  hi.a1.unit13.lesson02.teach.ya_review:
    title: 'Повторение: или'
    gloss: или
    note: 'Впервые это слово встретилось в уроках 6–7, когда мы заказывали еду и покупали вещи. Здесь оно нужно, чтобы задать вопрос о выборе: что тебе нравится.'
    example_gloss: Чай или кофе?
  hi.a1.unit13.lesson02.teach.chai_ya_coffee_phrase:
    title: Ты любишь чай или кофе?
    gloss: Ты любишь чай или кофе?
    note: 'Здесь вопросная конструкция с «tumhein» из этого урока соединяется с уже знакомым «ya» (или): собеседнику предлагают выбрать.'
  hi.a1.unit13.lesson02.teach.zyada:
    title: Больше
    gloss: больше
    note: Новое слово. Оно стоит прямо перед «pasand hai» и выражает предпочтение между двумя уже названными вещами.
    example_gloss: Я больше люблю чай.
  hi.a1.unit13.lesson02.teach.zyada_pasand_grammar:
    title: Zyada pasand hai = предпочитать
    gloss: '«X zyada pasand hai» значит, что из двух вещей предпочитают одну: «mujhe chai zyada pasand hai» — «я больше люблю чай» / «я предпочитаю чай».'
    note: 'Это расширение лексики, а не новая грамматика: «zyada» просто уточняет уже знакомое «pasand hai».'
    target_text: '''X ज़्यादा पसंद है'' का मतलब है दो चीज़ों में से एक को तरजीह देना (предпочитать) -- ''मुझे चाय ज़्यादा पसंद है'' का मतलब है «мне больше нравится чай» / «я предпочитаю чай»।'
  hi.a1.unit13.lesson03.teach.review_words:
    title: 'Повторение: музыка, спорт, книги'
    gloss: музыка, спорт/игра, книги
    note: 'Краткое повторение ключевых существительных урока: они нужны для диалога и для записки.'
    example_gloss:
    - Я люблю музыку.
    - Мне не нравится этот вид спорта.
    - Я люблю книги.
  hi.a1.unit13.lesson03.teach.dialogue.line01:
    title: Арджун спрашивает о музыке
    gloss: Прия, ты любишь музыку?
  hi.a1.unit13.lesson03.teach.dialogue.line02:
    title: Прия говорит, что очень любит музыку
    gloss: Да, я очень люблю музыку. А ты?
  hi.a1.unit13.lesson03.teach.dialogue.line03:
    title: Арджун соглашается и добавляет про спорт
    gloss: Я тоже! И ещё я люблю спорт.
  hi.a1.unit13.lesson03.teach.dialogue.line04:
    title: Прия предпочитает книги этой игре
    gloss: Здорово! Мне не нравится эта игра. Я люблю книги.
  hi.a1.unit13.lesson03.teach.dialogue.line05:
    title: 'Арджун спрашивает: чай или кофе'
    gloss: Хорошо. Ты любишь чай или кофе?
  hi.a1.unit13.lesson03.teach.dialogue.line06:
    title: Прия предпочитает чай
    gloss: Я больше люблю чай.
  hi.a1.unit13.lesson03.teach.dialogue.line07:
    title: Арджун соглашается
    gloss: Отлично! Я тоже люблю чай.
  hi.a1.unit13.lesson03.teach.dialogue.line08:
    title: Прия прощается
    gloss: Хорошо! Увидимся завтра?
  hi.a1.unit13.lesson03.teach.chahiye_pasand_zyada_grammar:
    title: Три связанные модели
    gloss: 'Три модели этого урока: после «chahiye» (хотеть/нуждаться, урок 6) «hai» не ставится; «pasand hai/hain» (этот урок) меняется в зависимости от числа предмета; «zyada pasand hai» значит, что из двух вещей предпочитают одну.'
    note: Итоговое резюме, которое связывает всю грамматику урока, как и грамматическая заметка урока 12 связывала свою парадигму.
    target_text: 'इस यूनिट के तीन तरीके: ''चाहिए'' (चाहना/ज़रूरत, यूनिट 6) के बाद ''है'' नहीं आता; ''पसंद है/हैं'' (यह यूनिट) चीज़ की संख्या से बदलता है; ''ज़्यादा पसंद है'' का मतलब है दो में से एक को तरजीह देना (предпочитать)।'
  hi.a1.unit13.lesson03.teach.priya_note:
    title: Записка Прии
    gloss: Арджун, я очень люблю музыку. Ещё я люблю книги. Мне не нравится эта игра. Я больше люблю чай. — Прия
    note: Короткая записка повторяет только то, что уже прозвучало в диалоге, без новых утверждений.
    glosses:
      संगीत: музыка
      बहुत: очень
      पसंद: нравящийся / приятный
      किताबें: книги
      खेल: игра
      नहीं: не
      चाय: чай
      ज़्यादा: больше / предпочтительно
