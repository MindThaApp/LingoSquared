answer_policy:
  nasalization_marks: Display and teach the correct chandrabindu/anusvara distinction (हूँ, हाँ, कहाँ vs. मैं, हैं, में, मिलेंगे). In typed A1 answers, accept a variant that drops the nasalization mark entirely or substitutes anusvara for chandrabindu (हूं for हूँ, हां for हाँ) when every other character is correct -- these marks are small, easy to miss on a virtual keyboard, and near-homophonous in casual speech; this is a beginner course, not a spelling test. Do not extend this tolerance to a wrong vowel or consonant, which changes the actual word.
  punctuation: Hindi text is shown with the traditional danda (।) as the sentence-final mark, matching how it is actually printed and taught. In typed answers, accept the danda, a plain period (.), or the mark omitted entirely as equivalent -- most everyday Hindi typed on phones/keyboards uses a plain period, and this distinction carries no meaning difference. Question marks (?) and exclamation marks may likewise be omitted, but the fully punctuated form remains the model answer.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register (aap vs. tum) rather than written punctuation or nasalization marks.
course:
  title: Хинди A1
  description: 'Научись здороваться, спрашивать, как дела у собеседника, представляться и обмениваться базовой личной информацией на хинди. Особое внимание уделено системе вежливости aap/tum (настоящее грамматическое различие, которого нет в русском: у нас похожий выбор «ты» и «вы», но в хинди есть ещё и особые глагольные формы) и прилагательным и глаголам, которые согласуются по роду, как и в русском.'
units:
  hi.a1.unit01.greetings:
    title: Намасте и первые встречи
lessons:
  hi.a1.unit01.lesson01.aap_and_tum:
    title: 'Aap и tum: как спросить, как дела'
  hi.a1.unit01.lesson02.greetings_and_farewells:
    title: Приветствия и прощания
  hi.a1.unit01.lesson03.names_origin_and_dialogue:
    title: Имена, происхождение и первое знакомство на занятии йогой
teaching:
  hi.a1.unit01.lesson01.teach.aap:
    title: Вежливое «вы»
    gloss: вы (вежливо, уважительно)
    note: 'Как и в русском, в хинди есть выбор между вежливым и неформальным обращением. *Aap* употребляют с тем, кто старше, с малознакомым человеком или в уважительных, например деловых, отношениях. Грамматически это множественное число даже по отношению к одному человеку: глаголы при *aap* имеют те же окончания типа -en/hain, что и при «они», — похоже на русское «вы».'
  hi.a1.unit01.lesson01.teach.tum:
    title: Неформальное «ты»
    gloss: ты (неформально, по-дружески)
    note: '*Tum* употребляют с другом, ровесником, младшим или родственником — отношения неформальные, но всё же уважительные (это не более близкое *tu*, которое в этом курсе не изучается). У *tum* свои особые глагольные окончания, отличные и от *aap*, и от *tu*.'
  hi.a1.unit01.lesson01.teach.aap_kaise_hain:
    title: Вежливый вопрос о самочувствии, к мужчине
    gloss: Как вы? (вежливо, вопрос мужчине)
    note: '*Kaise* согласуется с РОДОМ ТОГО, КОГО СПРАШИВАЮТ, а не говорящего: эта форма используется при обращении к мужчине. Как и в русском прилагательное меняется по роду («какой» / «какая»), но здесь это работает и в вопросе о самочувствии.'
  hi.a1.unit01.lesson01.teach.aap_kaisi_hain:
    title: 'Та же модель, что и в Jak się pan ma?, только вместо pan стоит pani. Форма глагола ma не меняется: это одно и то же окончание третьего лица независимо от пола собеседника.'
    gloss: Как вы? (вежливо, вопрос женщине)
    note: 'Тот же вопрос, тот же вежливый регистр *aap*: меняется только *kaisi* вместо *kaise*, согласуясь с собеседницей-женщиной. Сам глагол *hain* не меняется, меняется только форма прилагательного.'
  hi.a1.unit01.lesson01.teach.tum_kaise_ho:
    title: Неформальный вопрос о самочувствии
    gloss: Как дела? (на «ты»)
    note: 'С *tum* глагол имеет форму *ho*, а не *hain*: сравни вежливое *Aap kaise/kaisi hain?* и неформальное *Tum kaise ho?*. Это самая наглядная пара для того, чтобы услышать разницу между aap и tum в самом глаголе.'
  hi.a1.unit01.lesson01.teach.main_theek_hoon:
    title: Стандартный ответ
    gloss: У меня всё хорошо, спасибо.
    note: '*Theek* («хорошо, нормально») не меняется ни по роду, ни по регистру: в отличие от *kaise/kaisi*, оно остаётся прежним, кто бы ни говорил и к кому бы ни обращались.'
  hi.a1.unit01.lesson01.teach.aur_aap:
    title: Возвращаем вежливый вопрос
    gloss: А Вы? (формально)
    note: Короткий способ задать вопрос в ответ в вежливом регистре aap.
  hi.a1.unit01.lesson01.teach.aur_tum:
    title: Возвращаем неформальный вопрос
    gloss: А ты? (неформально)
    note: Так задают встречный вопрос другу или ровеснику, используя tum.
  hi.a1.unit01.lesson02.teach.namaste:
    title: Универсальное приветствие
    gloss: привет; здравствуйте (также при прощании)
    note: '*Namaste* подходит в любое время суток, в формальной и неформальной обстановке, и для начала, и для завершения разговора — это универсальное слово, в отличие от русского, где приветствие и прощание выражаются разными словами.'
    example_gloss: Здравствуйте! Как вы?
  hi.a1.unit01.lesson02.teach.namaskar:
    title: Уважительное приветствие
    gloss: здравствуйте (более официально и уважительно, чем namaste)
    note: '*Namaskar* означает по сути то же, что и *namaste*, но звучит более официально и уважительно: подходит для старшего, большой аудитории или делового общения.'
    example_gloss: Намаскар! А вы?
  hi.a1.unit01.lesson02.teach.phir_milenge:
    title: До новой встречи (будущее время)
    gloss: до новой встречи; увидимся
    note: Буквально «[мы] встретимся снова» — стандартный нейтральный способ попрощаться, когда ты рассчитываешь снова увидеть человека.
  hi.a1.unit01.lesson02.teach.alvida:
    title: Официальное прощание
    gloss: прощай; прощайте
    note: '*Alvida* — настоящее, правильно употребляемое хинди слово для прощания, но в повседневной речи оно звучит более окончательно, официально и даже немного драматично, чем *namaste* или *phir milenge*, — ближе к русскому «прощайте», чем к обычному «пока».'
    example_gloss: Прощайте! До новой встречи.
  hi.a1.unit01.lesson02.teach.phir_milte_hain:
    title: Увидимся (неформально, привычно)
    gloss: увидимся; до скорого
    note: Буквально «[мы] встречаемся снова», с формой длительного/привычного действия вместо будущего времени — чуть более непринуждённый повседневный вариант *phir milenge*.
  hi.a1.unit01.lesson02.teach.shubh_ratri:
    title: Спокойной ночи
    gloss: спокойной ночи
    note: 'Говорят, когда кто-то уходит на ночь или ложится спать: как и русское «спокойной ночи», это прощание, а не приветствие, в отличие от *namaste*.'
  hi.a1.unit01.lesson02.teach.shubh_din:
    title: Вежливое прощальное пожелание
    gloss: Хорошего дня.
    note: Буквально «пусть ваш день будет хорошим» — вежливое пожелание при прощании, уместное и в формальных, и в неформальных отношениях.
  hi.a1.unit01.lesson03.teach.aapka_naam_kya_hai:
    title: Спросить имя вежливо
    gloss: Как вас зовут?
    note: '*Aapka* («ваш») согласуется с существительным мужского рода *naam* («имя»): притяжательные слова в хинди меняют форму в зависимости от предмета, которым обладают, а не от владельца. В русском так же согласуются «мой/моя/моё», но в хинди это касается и слов вроде aapka.'
  hi.a1.unit01.lesson03.teach.tumhara_naam_kya_hai:
    title: Как спросить имя неформально
    gloss: Как тебя зовут?
    note: Та же модель, только *tumhara* («твоё») вместо *aapka*. Сравни вежливое *Aapka naam kya hai?* и неформальное *Tumhara naam kya hai?*.
  hi.a1.unit01.lesson03.teach.mera_naam_priya_hai:
    title: Называем своё имя
    gloss: Меня зовут Прия.
    note: '*Mera* («мой») тоже согласуется с *naam* мужского рода: обрати внимание, что у него то же мужское окончание, что у *aapka* и *tumhara* выше, ведь все три слова относятся к одному существительному.'
  hi.a1.unit01.lesson03.teach.aapse_milkar_khushi_hui:
    title: Радость от знакомства, вежливо
    gloss: Приятно познакомиться. (вежливо)
    note: Буквально «встретившись с вами, случилась радость» — устойчивое, широко используемое выражение при уважительном первом знакомстве.
  hi.a1.unit01.lesson03.teach.mujhe_bhi:
    title: Отвечаем взаимностью
    gloss: Я тоже.
    note: Короткий естественный ответ на Aapse milkar khushi hui или Tumse milkar accha laga.
  hi.a1.unit01.lesson03.teach.aap_kahan_se_hain:
    title: Как спросить, откуда человек, вежливо
    gloss: Вы откуда?
    note: Kahan значит «где», se — «из, от».
  hi.a1.unit01.lesson03.teach.main_bharat_se_hoon:
    title: Говорим о своём происхождении
    gloss: Я из Индии.
    note: Bharat — хинди название Индии, которое постоянно используется в повседневной речи.
  hi.a1.unit01.lesson03.teach.tum_kahan_se_ho:
    title: Спросить, откуда ты, неформально
    gloss: Откуда ты?
    note: 'Тот же вопрос с *tum* и *ho* вместо *aap* и *hain*: та же разница в глагольных окончаниях между вежливой и неформальной формой, что и во всём этом юните.'
  hi.a1.unit01.lesson03.teach.dialogue.line01:
    title: Начало встречи
    gloss: Прия здоровается с Арджуном и спрашивает, впервые ли он здесь.
    note: Оба собеседника с самого начала говорят на «ты» (*tum*) — это естественно для двух ровесников, случайно встретившихся на занятии в местном сообществе. *Tumhari* («твой») согласуется с существительным женского рода *baar* («раз»), а не с полом кого-либо из говорящих.
  hi.a1.unit01.lesson03.teach.dialogue.line02:
    title: Начало встречи, ответ
    gloss: Арджун отвечает «да», говорит, что он здесь впервые и хочет научиться йоге.
    note: '*Chahta hoon* («я хочу») здесь стоит в мужском роде, потому что говорит Арджун, мужчина: этот глагол согласуется с родом ГОВОРЯЩЕГО, в отличие от *kaisi*/*kaise* выше, которые согласовывались с тем, К КОМУ ОБРАЩАЮТСЯ.'
  hi.a1.unit01.lesson03.teach.dialogue.line03:
    title: Обмен именами
    gloss: Прия говорит «я тоже!», называет своё имя и спрашивает имя Арджуна.
    note: '*Main bhi!* («я тоже!») отвечает на *main ... chahta hoon* Арджуна: когда подлежащее в предложении собеседника — *main*, «я тоже» будет *main bhi*. *Mujhe bhi* — ответ на предложение с *mujhe*, например *Tumse milkar accha laga*. *Mera naam...hai* — естественный и простой способ назвать своё имя.'
  hi.a1.unit01.lesson03.teach.dialogue.line04:
    title: Обмен именами, ответ
    gloss: Арджун называет своё имя и неформально говорит, что ему приятно познакомиться.
    note: '*Tumse milkar accha laga* — неформальный вариант вежливого *Aapse milkar khushi hui* из этого урока: оба примерно значат «приятно познакомиться» и подбираются по регистру.'
  hi.a1.unit01.lesson03.teach.dialogue.line05:
    title: Вопрос о происхождении
    gloss: Прия отвечает взаимностью и спрашивает, откуда Арджун.
    note: Tum kahan se ho спрашивает о происхождении в уже знакомом неформальном регистре.
  hi.a1.unit01.lesson03.teach.dialogue.line06:
    title: Вопрос о происхождении, ответ
    gloss: Арджун из Индии, но сейчас живёт в Лондоне, и задаёт тот же вопрос в ответ.
    note: '*Rahta hoon* («я живу») стоит в мужском роде, согласуясь с Арджуном как говорящим: та же модель согласования с подлежащим, что и в *chahta hoon* в реплике 2. *Lekin* («но») связывает противопоставление происхождения и нынешнего места жительства.'
  hi.a1.unit01.lesson03.teach.dialogue.line07:
    title: Говорим о происхождении и об увлечении
    gloss: Прия говорит, что она из Америки и тоже хочет научиться йоге.
    note: '*Chahti hoon* — женская форма того же глагола, который использовал Арджун в реплике 2 (*chahta hoon*): обе формы согласуются с родом своего говорящего, получается наглядная пара для сравнения.'
  hi.a1.unit01.lesson03.teach.dialogue.line08:
    title: Спрашиваем об общем занятии
    gloss: Арджун радуется и спрашивает, занимается ли Прия йогой.
    note: '*Karti ho* («ты занимаешься») стоит в женском роде, согласуясь с Прией как с той, кого спрашивают: как и *kaisi* выше, эта глагольная форма следует за родом СОБЕСЕДНИКА, а не говорящего.'
  hi.a1.unit01.lesson03.teach.dialogue.line09:
    title: Отвечаем об общем занятии
    gloss: Прия говорит «нет», что она здесь впервые и пока только учится.
    note: '*Seekh rahi hoon* («я учусь») — женская форма длительного времени, согласующаяся с Прией как говорящей; это длительный аналог *chahti hoon*.'
  hi.a1.unit01.lesson03.teach.dialogue.line10:
    title: Завершение разговора
    gloss: Арджун соглашается начинать и говорит «до скорого».
    note: '*Chalo shuru karte hain* («давай начнём») — устойчивый естественный способ предложить начать что-то вместе. *Phir milte hain* завершает разговор неформальным прощанием из урока 2.'
exercises:
  hi.a1.unit01.lesson01.exercise01.select_aap:
    instruction: Какое слово означает вежливое, уважительное «вы»?
    correct_option: आप
    distractors:
    - तुम
    - और
    accepted_answers:
    - आप
    feedback: Aap употребляют с тем, кто старше, с малознакомым человеком или в уважительных отношениях.
  hi.a1.unit01.lesson01.exercise02.select_tum:
    instruction: Какое слово служит неформальным обращением к одному другу или ровеснику?
    correct_option: तुम
    distractors:
    - आप
    - और
    accepted_answers:
    - तुम
    feedback: Tum употребляют с друзьями, ровесниками и в других неформальных, но уважительных отношениях.
  hi.a1.unit01.lesson01.exercise03.select_aap_kaisi_hain_meaning:
    instruction: О чём спрашивает этот вопрос и к кому он обращён?
    correct_option: Как вы? (вежливо, вопрос женщине)
    distractors:
    - Как вы? (вежливо, вопрос мужчине)
    - А вы?
    accepted_answers:
    - Как вы? (вежливо, вопрос женщине)
    feedback: Kaisi согласуется с собеседницей-женщиной; kaise употребляют по отношению к мужчине.
  hi.a1.unit01.lesson01.exercise04.order_aap_kaise_hain:
    instruction: Расставь в правильном порядке вежливый вопрос о самочувствии (к мужчине).
    correct_response:
    - आप
    - कैसे
    - हैं
  hi.a1.unit01.lesson01.exercise05.order_tum_kaise_ho:
    instruction: Расставь в правильном порядке неформальный вопрос о самочувствии.
    correct_response:
    - तुम
    - कैसे
    - हो
  hi.a1.unit01.lesson01.exercise06.return_formal:
    instruction: Верни вопрос, сохраняя вежливый регистр.
    correct_option: और आप?
    distractors:
    - और तुम?
    - तुम कैसे हो?
    accepted_answers:
    - और आप?
    - और आप
    feedback: Aur aap? сохраняет вежливый регистр при встречном вопросе.
  hi.a1.unit01.lesson01.exercise07.return_informal:
    instruction: Верни вопрос другу или ровеснику.
    correct_option: और तुम?
    distractors:
    - और आप?
    - आप कैसे हैं?
    accepted_answers:
    - और तुम?
    - और तुम
    feedback: Aur tum? — неформальный способ задать встречный вопрос.
  hi.a1.unit01.lesson01.exercise08.correct_informal_agreement:
    instruction: 'Исправь неформальный вопрос: в нём tum сочетается с неверным глагольным окончанием.'
    accepted_answers:
    - तुम कैसे हो?
    - तुम कैसे हो
    feedback: 'С tum нужно окончание ho, а не hain: hain употребляется только с aap.'
  hi.a1.unit01.lesson01.exercise09.reply_formally:
    instruction: 'Ответь вежливо: скажи, что у тебя всё хорошо, и поблагодари.'
    accepted_answers:
    - मैं ठीक हूँ, शुक्रिया।
    - मैं ठीक हूँ, शुक्रिया
    - मैं ठीक हूं, शुक्रिया।
    - मैं ठीक हूँ, शुक्रिया। और आप?
    - मैं ठीक हूँ, शुक्रिया, और आप?
    - मैं ठीक हूं, शुक्रिया। और आप?
    - मैं ठीक हूं, शुक्रिया, और आप?
  hi.a1.unit01.lesson01.exercise10.speak_informally:
    instruction: Ответь неформально, поблагодари собеседника и задай вопрос в ответ.
    accepted_answers:
    - मैं ठीक हूँ, शुक्रिया। और तुम?
    - मैं ठीक हूँ, शुक्रिया, और तुम?
    - मैं ठीक हूँ, शुक्रिया। और तुम
    - मैं ठीक हूं, शुक्रिया। और तुम?
    - मैं ठीक हूं, शुक्रिया, और तुम?
