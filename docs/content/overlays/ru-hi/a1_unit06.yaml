answer_policy:
  nasalization_marks: Display and teach the correct chandrabindu/anusvara distinction. This unit's own new vocabulary needs no new nasalization-mark decisions -- it only reuses already-settled spellings (हाँ's chandrabindu, तुम्हें/मिलेंगे/हैं/नहीं's anusvara). In typed A1 answers, accept a variant that drops a nasalization mark entirely or substitutes anusvara for chandrabindu when every other character is correct. Do not extend this tolerance to a wrong vowel or consonant, which changes the actual word.
  punctuation: Hindi text is shown with the traditional danda (।) as the sentence-final mark. In typed answers, accept the danda, a plain period (.), or the mark omitted entirely as equivalent. Question marks (?), exclamation marks, and commas may likewise be omitted, but the fully punctuated form remains the model answer.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register (aap vs. tum) rather than written punctuation or nasalization marks.
course:
  title: Хинди A1
units:
  hi.a1.unit06.food:
    title: Еда и напитки
lessons:
  hi.a1.unit06.lesson01.mujhe_chahiye:
    title: Я бы хотел(а)...
  hi.a1.unit06.lesson02.khana_aur_matra:
    title: Еда и количество
  hi.a1.unit06.lesson03.priya_aur_arjun_ka_khana:
    title: Обед Прии и Арджуна
teaching:
  hi.a1.unit06.lesson01.teach.khana:
    title: Еда
    gloss: еда
    note: Общее слово для еды; встречается во всём этом разделе.
    example_gloss: Моя еда уже готова.
  hi.a1.unit06.lesson01.teach.chai_coffee:
    title: Чай, кофе
    gloss: чай, кофе
    note: Два распространённых напитка; на них в этом разделе отрабатывается конструкция *mujhe ... chahiye*.
    example_gloss:
    - Я бы хотел(а) чай.
    - Я бы хотел(а) кофе.
  hi.a1.unit06.lesson01.teach.pani_juice:
    title: Вода, сок
    gloss: вода, сок
    note: Ещё два распространённых напитка; согласовывать по роду ничего не нужно, потому что *chahiye* не изменяется.
    example_gloss:
    - Я бы хотел воды.
    - Я бы хотел(а) сок.
  hi.a1.unit06.lesson01.teach.chahiye_note:
    title: Mujhe ... chahiye
    gloss: '*Mujhe ... chahiye* значит «я бы хотел(а) ...». Оборот не меняется по роду говорящего (в отличие от *chahta/chahti*), и после него никогда не ставится *hai*.'
    note: Главный грамматический пункт раздела. Очень частая ошибка учащихся — добавлять *hai* после *chahiye*, ведь почти все изученные ранее предложения так заканчиваются. *Chahiye* уже само по себе полноценное сказуемое.
  hi.a1.unit06.lesson01.teach.aapko_kya_chahiye:
    title: Что вы хотите? (вежливо)
    gloss: Что вы желаете?
    note: Вежливый вопрос с *aap*; так обращаются официант или хозяин к гостю.
  hi.a1.unit06.lesson01.teach.tumhein_kya_chahiye:
    title: Что ты хочешь? (неформально)
    gloss: Что вы желаете?
    note: Неформальное местоимение в дательном падеже с *tum*, параллельное *mujhe* и *tumhara/tumhari* из 5-го раздела.
  hi.a1.unit06.lesson01.teach.chai_chahiye_shukriya:
    title: Мне чай, спасибо
    gloss: Я бы хотел(а) чай, спасибо.
    note: Естественный вежливый ответ при заказе; здесь снова встречается *shukriya* из прошлых разделов.
  hi.a1.unit06.lesson01.teach.bahut:
    title: Очень
    gloss: очень
    note: Частое усилительное слово; в этом разделе им описывают еду и напитки.
    example_gloss: Этот чай очень хороший.
  hi.a1.unit06.lesson01.teach.swadisht:
    title: Вкусный
    gloss: вкусный
    note: Полезное слово, чтобы отозваться о еде; почему оно не меняется по роду, объясняется в грамматической заметке урока 3.
    example_gloss: Эта еда очень вкусная.
  hi.a1.unit06.lesson02.teach.roti_chawal:
    title: Лепёшка, рис
    gloss: лепёшка, рис
    note: Два основных продукта обычной индийской трапезы.
    example_gloss:
    - Я хотел бы хлеба.
    - Я бы хотел(а) рис.
  hi.a1.unit06.lesson02.teach.sabzi_daal:
    title: Овощное блюдо, чечевица
    gloss: овощное блюдо, чечевица (дал)
    note: Ещё два основных блюда; их обычно едят вместе с роти и рисом.
    example_gloss:
    - Я бы хотел(а) овощное блюдо.
    - Я бы хотел(а) чечевицу.
  hi.a1.unit06.lesson02.teach.kap_gilas_plate:
    title: Чашка, стакан, тарелка
    gloss: чашка, стакан, тарелка
    note: Распространённые ёмкости; с *ek* («один») они помогают назвать количество при заказе.
    example_gloss:
    - Я бы хотел(а) чашку чая.
    - Я бы хотел(а) стакан воды.
    - Я бы хотел(а) тарелку риса.
  hi.a1.unit06.lesson02.teach.kripya:
    title: Пожалуйста
    gloss: пожалуйста
    note: Простое слово вежливости в просьбе. Чаще всего оно стоит в начале (*kripya mujhe ...*), но его можно услышать и в конце.
    example_gloss: Я бы хотел(а) чашку чая, пожалуйста.
  hi.a1.unit06.lesson02.teach.kuch_aur_chahiye:
    title: Что-нибудь ещё?
    gloss: Что-нибудь ещё?
    note: Естественный вопрос официанта после того, как принята часть заказа.
  hi.a1.unit06.lesson02.teach.nahin_bas_shukriya:
    title: Нет, всё, спасибо
    gloss: Нет, это всё, спасибо.
    note: Естественный вежливый способ закончить заказ; здесь снова встречаются *nahin* и *shukriya* из прошлых разделов.
  hi.a1.unit06.lesson02.teach.sabzi_swadisht_phrase:
    title: Это овощное блюдо очень вкусное
    gloss: Это овощное блюдо очень вкусное.
    note: Снова *bahut* и *swadisht* из этого раздела, но с новым названием еды; это подготовка к грамматической заметке урока 3 о том, что *swadisht* не меняется по роду.
  hi.a1.unit06.lesson03.teach.chalo_khate_hain:
    title: Давай что-нибудь поедим!
    gloss: Давай что-нибудь поедим!
    note: Дружеская устойчивая фраза, которой предлагают поесть вместе; с неё начинается заключительный диалог раздела.
  hi.a1.unit06.lesson03.teach.ya:
    title: Или
    gloss: или
    note: Простой соединительный союз; им предлагают выбор из двух вариантов.
    example_gloss: Ты хочешь чай или кофе?
  hi.a1.unit06.lesson03.teach.haan:
    title: Да
    gloss: да
    note: Простое утвердительное слово; встречается во всём заключительном диалоге раздела.
    example_gloss: Да, я бы хотел(а) чай.
  hi.a1.unit06.lesson03.teach.swadisht_invariant_note:
    title: Swadisht не изменяется
    gloss: '*Swadisht* одинаково употребляется с мужским и женским родом — оно не меняется, как *achha/achhi*.'
    note: 'Важное исключение: в отличие от уже изученных согласуемых прилагательных (achha/achhi, bada/badi, mera/meri), прилагательные на согласный, например *swadisht*, никогда не изменяются по роду.'
  hi.a1.unit06.lesson03.teach.accha_phir_milenge:
    title: Хорошо, до новой встречи
    gloss: Хорошо! Увидимся.
    note: Дружеское прощание, уже знакомое по прощальным фразам прошлых уроков.
  hi.a1.unit06.lesson03.teach.theek_hai_phir_milte_hain:
    title: Ладно, скоро увидимся
    gloss: Ладно, скоро увидимся!
    note: Неформальный ответ на предыдущее прощание, как в прощальных диалогах прошлых уроков.
  hi.a1.unit06.lesson03.teach.dialogue.line01:
    title: Арджун предлагает поесть
    gloss: 'Арджун говорит: давай что-нибудь поедим.'
    note: Повторяется начальная фраза этого урока.
  hi.a1.unit06.lesson03.teach.dialogue.line02:
    title: Прия спрашивает, что он хочет
    gloss: Прия соглашается и спрашивает, что хочет Арджун.
    note: Повторяется неформальный вопрос *tumhein kya chahiye* из первого урока.
  hi.a1.unit06.lesson03.teach.dialogue.line03:
    title: Арджун заказывает еду
    gloss: Арджун говорит, что хочет порцию роти и овощное блюдо.
    note: Сочетает названия еды из этого урока, модель с ёмкостью *ek plate* и слово *chahiye*.
  hi.a1.unit06.lesson03.teach.dialogue.line04:
    title: Прия предлагает выбрать напиток
    gloss: Прия говорит «хорошо» и спрашивает, хочет ли Арджун чай или кофе.
    note: Здесь используется *ya* из этого урока, чтобы предложить выбор из двух напитков.
  hi.a1.unit06.lesson03.teach.dialogue.line05:
    title: Арджун выбирает кофе
    gloss: Арджун говорит, что хочет кофе, пожалуйста.
    note: Повторяется *kripya* из второго урока.
  hi.a1.unit06.lesson03.teach.dialogue.line06:
    title: Прия говорит о еде
    gloss: Прия говорит «хорошо» и что эта еда очень вкусная.
    note: Повторяется *bahut swadisht* из первого урока.
  hi.a1.unit06.lesson03.teach.dialogue.line07:
    title: Арджун соглашается
    gloss: 'Арджун говорит: да, большое спасибо.'
    note: Повторяются *haan* и *shukriya*.
  hi.a1.unit06.lesson03.teach.dialogue.line08:
    title: Прия заканчивает разговор
    gloss: 'Прия говорит: хорошо, увидимся.'
    note: Повторяется прощальная фраза этого урока.
  hi.a1.unit06.lesson03.teach.dialogue.line09:
    title: Арджун отвечает
    gloss: 'Арджун соглашается и говорит: скоро увидимся.'
    note: Повторяется ответная фраза этого урока.
