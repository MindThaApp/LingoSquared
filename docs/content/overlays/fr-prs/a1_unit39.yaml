course:
  title: Dari A1
  description: 'Dari de Kaboul pour débutants : parle des quatre saisons, décris le temps typique de chacune, demande et dis quelle saison tu aimes, et lis un court texte sur les saisons préférées de deux personnes.'
units:
  prs.a1.unit39.seasons:
    title: Les saisons
    description: Parle des quatre saisons et décris le temps ou les activités typiques de chacune.
