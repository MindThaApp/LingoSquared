    title: 'Révision : vous (politesse), oui'
    gloss: vous (politesse) / oui
    note: شما et بلی sont des mots déjà vus, utilisés dans le dialogue sur les saisons.
    target_text: شما (vous, formel) / بلی (oui)
  prs.a1.unit39.lesson04.teach.dialogue_line1:
    title: 'Homayoun : Zarmina, quelle saison aimez-vous ?'
    gloss: Zarmina, quelle saison aimez-vous ?
  prs.a1.unit39.lesson04.teach.dialogue_line2:
    title: 'Zarmina : J’aime le printemps. Le printemps est doux et ensoleillé.'
    gloss: J’aime le printemps. Le printemps est doux et ensoleillé.
  prs.a1.unit39.lesson04.teach.dialogue_line3:
    title: 'Homayoun : Ma saison préférée est l’hiver.'
    gloss: Ma saison préférée est l’hiver.
  prs.a1.unit39.lesson04.teach.dialogue_line4:
    title: 'Zarmina : L’hiver ? L’hiver est très froid !'
    gloss: L’hiver ? L’hiver est très froid !
  prs.a1.unit39.lesson04.teach.dialogue_line5:
    title: 'Homayoun : Oui, mais moi, j’aime la neige.'
    gloss: Oui, mais moi, j’aime la neige.
  prs.a1.unit39.lesson04.teach.dialogue_line6:
    title: 'Zarmina : Moi, je n’aime pas la neige.'
    gloss: Moi, je n’aime pas la neige.
  prs.a1.unit39.lesson05.teach.review_reading_words:
    title: 'Révision : il/elle, il/elle aime'
    gloss: il/elle / il/elle aime
    note: او et دوست دارد sont des formes déjà vues, utilisées dans ce texte de lecture.
    target_text: او (il/elle) / دوست دارد (il/elle aime)
  prs.a1.unit39.lesson05.teach.reading_passage:
    title: 'Lecture : les saisons préférées'
    gloss: La saison préférée d’Homayoun est l’hiver. L’hiver est froid et il neige. Il aime la neige. La saison préférée de Zarmina est le printemps. Le printemps est doux et ensoleillé. Elle aime le printemps.
  prs.a1.unit39.lesson06.teach.review_like_dislike:
    title: 'Révision : j’aime, je n’aime pas'
    gloss: j’aime / je n’aime pas
    note: دوست دارم et دوست ندارم sont des formes déjà vues, utilisées pour opposer une saison aimée et une saison non aimée.
    target_text: دوست دارم (j’aime) / دوست ندارم (je n’aime pas)
  prs.a1.unit39.lesson06.teach.contrast_phrase:
    title: J’aime l’hiver, mais je n’aime pas l’été
    gloss: J’aime l’hiver, mais je n’aime pas l’été.
    note: اما oppose une saison aimée à une saison non aimée dans une même phrase.
  prs.a1.unit39.lesson06.teach.formal_question_phrase:
    title: Quelle saison aimez-vous ?
    gloss: Quelle saison aimez-vous ?
    note: Version avec شما de la question de la leçon 3, pour poser la question directement et poliment.
