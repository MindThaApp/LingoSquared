  prs.a1.unit39.lesson06.wrap_up:
    title: Récapitulatif
teaching:
  prs.a1.unit39.lesson01.teach.review_basics:
    title: 'Révision : quatre, est, année'
    gloss: quatre / est / année
    note: چهار, است et سال sont des mots de révision qui introduisent le vocabulaire des saisons de cette unité.
    target_text: چهار (quatre) / است (est) / سال (an, année)
  prs.a1.unit39.lesson01.teach.review_weather_connectors:
    title: 'Révision : temps, chaud, froid, très, aujourd’hui, et, mais'
    gloss: temps / chaud / froid / très / aujourd’hui / et / mais
    note: هوا, گرم, سرد, خیلی, امروز, و et اما sont des mots de révision utilisés dans toutes les phrases sur les saisons de cette unité.
    target_text: هوا (temps qu’il fait) / گرم (chaud) / سرد (froid) / خیلی (très) / امروز (aujourd’hui) / و (et) / اما (mais)
  prs.a1.unit39.lesson01.teach.fasl_word:
    title: Saison
    gloss: saison
    note: فصل signifie « saison ».
    example_gloss: Il y a quatre saisons dans une année.
  prs.a1.unit39.lesson01.teach.bahar_word:
    title: Le printemps
    gloss: printemps
    note: بهار est le mot dari standard pour « printemps ».
    example_gloss: Le printemps est doux.
  prs.a1.unit39.lesson01.teach.tabestan_word:
    title: L’été
    gloss: été
    note: تابستان signifie « été ».
    example_gloss: L’été est très chaud.
  prs.a1.unit39.lesson01.teach.khonak_word:
    title: Frais
    gloss: frais
    note: خنک signifie « frais » (température).
    example_gloss: Aujourd’hui, le temps est frais.
  prs.a1.unit39.lesson01.teach.khazan_word:
    title: Automne
    gloss: automne
    note: خزان est le mot standard en dari d’Afghanistan pour « automne » ; le persan d’Iran emploie plus couramment پاییز.
    example_gloss: L’automne est frais.
  prs.a1.unit39.lesson01.teach.zemestan_word:
    title: L’hiver
    gloss: hiver
    note: زمستان signifie « hiver ».
    example_gloss: L’hiver est froid.
  prs.a1.unit39.lesson01.teach.warm_seasons_phrase:
    title: Le printemps est doux et l’été est très chaud
    gloss: Le printemps est doux et l’été est très chaud.
    note: و relie les deux propositions décrivant le temps de chaque saison en une seule phrase.
  prs.a1.unit39.lesson01.teach.cool_cold_contrast_phrase:
    title: L’automne est frais, mais l’hiver est froid
    gloss: L’automne est frais, mais l’hiver est froid.
    note: اما oppose le temps de deux saisons différentes dans une même phrase.
  prs.a1.unit39.lesson02.teach.review_in_becomes:
    title: 'Révision : en, devient'
    gloss: en / devient
    note: در et می‌شود sont des mots de révision utilisés pour décrire comment le temps change à chaque saison.
    target_text: در (en/dans) / می‌شود (devient)
  prs.a1.unit39.lesson02.teach.review_rain_snow_sunny:
    title: 'Révision : tomber/pleuvoir, pluie, neige, ensoleillé'
    gloss: tomber/pleuvoir / pluie / neige / ensoleillé
    note: می‌بارد, باران, برف et آفتابی sont des mots de révision utilisés pour décrire le temps typique de chaque saison.
    target_text: می‌بارد (il tombe / il pleut) / باران (pluie) / برف (neige) / آفتابی (ensoleillé)
  prs.a1.unit39.lesson02.teach.rain_in_spring_phrase:
    title: Au printemps, il pleut
    gloss: Au printemps, il pleut.
    note: در بهار باران می‌بارد dit littéralement « au printemps, la pluie tombe ».
  prs.a1.unit39.lesson02.teach.hot_in_summer_phrase:
    title: En été, il fait très chaud
    gloss: En été, il fait très chaud.
    note: می‌شود (devient) exprime un changement du temps au fil d’une saison.
  prs.a1.unit39.lesson02.teach.cool_in_autumn_phrase:
    title: En automne, il fait frais
    gloss: En automne, il fait frais.
    note: Même construction avec می‌شود, appliquée au temps plus frais de l’automne.
  prs.a1.unit39.lesson02.teach.snow_in_winter_phrase:
    title: En hiver, il neige
    gloss: En hiver, il neige.
    note: در زمستان برف می‌بارد signifie littéralement « en hiver, la neige tombe ».
  prs.a1.unit39.lesson02.teach.sunny_summer_phrase:
    title: L’été est ensoleillé
    gloss: L’été est ensoleillé.
    note: Une phrase simple avec است qui décrit le temps typique de l’été.
