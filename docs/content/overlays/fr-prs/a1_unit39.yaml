    title: 'Révision : quel, marque de l’objet, je'
    gloss: quel / marque de l’objet / je
    note: کدام, را et من (je) sont des formes déjà vues, utilisées pour demander et dire quelle saison on préfère.
    target_text: کدام (quel) / را (marque de l’objet) / من (je/moi)
  prs.a1.unit39.lesson03.teach.review_like_forms:
    title: 'Révision : vous aimez (politesse), j’aime, je n’aime pas'
    gloss: vous aimez (politesse) / j’aime / je n’aime pas
    note: دوست دارین, دوست دارم et دوست ندارم sont des formes déjà vues de دوست داشتن (aimer).
    target_text: دوست دارین (vous aimez, formel) / دوست دارم (j’aime) / دوست ندارم (je n’aime pas)
  prs.a1.unit39.lesson03.teach.review_mahboob:
