  prs.a1.unit39.lesson03.teach.which_season_like_question_phrase:
    title: Quelle saison aimez-vous ?
    gloss: Quelle saison aimez-vous ?
    note: کدام فصل را دوست دارین؟ signifie littéralement « quelle saison [marque de l’objet] aimez-vous ? ».
  prs.a1.unit39.lesson03.teach.favorite_season_spring_phrase:
    title: Ma saison préférée est le printemps
    gloss: Ma saison préférée est le printemps.
    note: فصل محبوب من signifie littéralement « saison préférée de moi », c’est-à-dire « ma saison préférée ».
