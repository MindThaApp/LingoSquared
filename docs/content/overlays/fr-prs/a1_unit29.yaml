course:
  title: Dari A1
  description: 'Dari de Kaboul pour débutants : vocabulaire du sport (football, volley-ball, cricket, natation), demander et dire combien de fois par semaine on fait du sport, dire où l’on joue ou s’entraîne, et un dialogue entre Zarmina et Homayoun mêlant sport, fréquence et lieu.'
units:
  prs.a1.unit29.sports:
    title: Les sports
    description: Parle des sports que tu pratiques, de la fréquence et du lieu.
lessons:
  prs.a1.unit29.lesson01.sport_vocabulary:
    title: Les mots du sport
  prs.a1.unit29.lesson02.frequency_question:
    title: Combien de fois par semaine ?
  prs.a1.unit29.lesson03.location:
    title: Où tu fais du sport
  prs.a1.unit29.lesson04.sports_dialogue:
    title: Dialogue sur le sport
  prs.a1.unit29.lesson05.reading_sports:
    title: Lecture sur le sport
  prs.a1.unit29.lesson06.wrap_up:
    title: Récapitulatif
teaching:
  prs.a1.unit29.lesson01.teach.sport_word:
    title: Le sport
    gloss: sport
    note: ورزش signifie « sport » ou « exercice physique » ; c’est le mot général pour toute activité physique.
    example_gloss: La natation est un bon sport.
  prs.a1.unit29.lesson01.teach.football_word:
    title: Le football
    gloss: football
    note: فوتبال signifie football (soccer).
    example_gloss: Le football est un bon sport.
  prs.a1.unit29.lesson01.teach.volleyball_word:
    title: Le volley-ball
    gloss: volley-ball
    note: والیبال signifie volley-ball.
    example_gloss: Le volley-ball aussi est un sport.
  prs.a1.unit29.lesson01.teach.cricket_word:
    title: Le cricket
    gloss: cricket
    note: کرکت signifie cricket, un sport très populaire en Afghanistan en particulier.
    example_gloss: Le cricket est un sport populaire.
  prs.a1.unit29.lesson01.teach.swimming_word:
    title: La natation
    gloss: natation
    note: شنا signifie natation.
    example_gloss: La natation est un bon sport.
  prs.a1.unit29.lesson01.teach.review_bazi_kardan:
    title: Jeu / faire → jouer
    gloss: jeu / faire → je joue
    note: 'بازی (jeu, jouer) s’associe à کردن (faire, révision) pour former بازی می‌کنم (je joue) : c’est le même schéma de verbe composé que dans پیاده‌روی می‌کنم et آشپزی می‌کنم.'
    target_text: بازی (jeu) + کردن (faire) = بازی می‌کنم (je joue)
  prs.a1.unit29.lesson01.teach.combined_sentence:
    title: Le football est un sport
    gloss: Le football est un sport.
    note: Combine فوتبال، یک (un, révision), ورزش et است (est, révision).
  prs.a1.unit29.lesson02.teach.review_chand:
    title: Combien
    gloss: combien
    note: چند sert ici à poser une question sur la fréquence.
    target_text: چند (combien)
  prs.a1.unit29.lesson02.teach.bar_word:
    title: Fois (occurrence)
    gloss: fois (comme dans « une fois » ; occurrence)
    note: بار signifie « fois » au sens de compter des occurrences, et non l’heure.
    example_gloss: Je nage une fois par semaine.
  prs.a1.unit29.lesson02.teach.review_dar_hafta:
    title: Dans / semaine
    gloss: dans / semaine
    note: در (dans, révision) et هفته (semaine, révision des unités 4 et 9) se combinent pour signifier « par semaine ».
    target_text: در (dans, en, à) / هفته (semaine)
  prs.a1.unit29.lesson02.teach.varzesh_mikonin:
    title: Vous faites du sport (formel)
    gloss: vous faites du sport
    note: ورزش می‌کنین est la forme polie (de politesse) de « vous faites du sport ».
    target_text: ورزش می‌کنین (vous faites du sport, formel)
  prs.a1.unit29.lesson02.teach.question_frequency:
    title: Combien de fois par semaine faites-vous du sport ?
    gloss: Combien de fois par semaine faites-vous du sport ?
    note: Combine چند بار (combien de fois) + در هفته (par semaine) + ورزش می‌کنین (vous faites du sport, forme polie).
  prs.a1.unit29.lesson02.teach.do_bar_answer:
    title: Je joue au football deux fois par semaine
    gloss: Je joue au football deux fois par semaine.
    note: دو (deux, révision de l’unité 4) بار در هفته indique la fréquence avant le nom du sport et la construction بازی می‌کنم.
  prs.a1.unit29.lesson03.teach.bashgah_word:
    title: La salle de sport
    gloss: salle de sport
    note: باشگاه signifie salle de sport ou club de sport.
    example_gloss: La salle de sport est grande.
  prs.a1.unit29.lesson03.teach.review_park:
    title: Parc
    gloss: parc
    note: پارک est un mot déjà vu dans la leçon sur les projets de l’unité 13.
    target_text: پارک (parc)
  prs.a1.unit29.lesson03.teach.dar_bashgah:
    title: À la salle de sport
    gloss: à la salle de sport
    note: در (dans/à, révision) + باشگاه.
  prs.a1.unit29.lesson03.teach.dar_park:
    title: Au parc
    gloss: au parc
    note: در (dans, à – révision) + پارک (révision).
  prs.a1.unit29.lesson03.teach.shena_mikonam:
    title: Je nage à la salle de sport
    gloss: Je nage à la salle de sport.
    note: Associe در باشگاه à شنا می‌کنم (je nage), selon le même schéma de verbe composé que بازی می‌کنم.
  prs.a1.unit29.lesson03.teach.futbol_park:
    title: Je joue au football au parc
    gloss: Je joue au football au parc.
    note: Associe در پارک à فوتبال بازی می‌کنم.
  prs.a1.unit29.lesson04.teach.review_to_miokni:
    title: Tu (informel) / tu fais (informel)
    gloss: tu (informel) / tu fais, tu pratiques (informel)
    note: تو (tu, informel) et می‌کنی (tu fais, informel) sont déjà connus ; ils servent dans le dialogue informel de cette leçon entre amis proches.
    target_text: تو (tu, informel) / می‌کنی (tu fais, informel)
  prs.a1.unit29.lesson04.teach.koja_word:
    title: Où
    gloss: où
    note: کجا signifie « où » ; il est lié à کجاست (révision des unités 5 et 6, littéralement « où est »), mais il s’emploie ici seul, devant un verbe.
    target_text: کجا (où)
  prs.a1.unit29.lesson04.teach.review_mikonad:
    title: Il/elle fait, joue
    gloss: il/elle fait, il/elle joue
    note: می‌کند est la forme de la 3e personne (révision) de می‌کنم et de می‌کنی. Elle n’est pas prononcée dans ce dialogue ; elle est travaillée dans le texte de lecture de la leçon suivante.
    target_text: می‌کند (il/elle fait, joue, 3e personne)
  prs.a1.unit29.lesson04.teach.dialogue_line1:
    title: 'Homayoun : Zarmina, combien de fois par semaine fais-tu du sport ?'
    gloss: 'Homayoun : Zarmina, combien de fois par semaine fais-tu du sport ?'
    note: Une question informelle entre amis, avec la forme familière می‌کنی.
  prs.a1.unit29.lesson04.teach.dialogue_line2:
    title: 'Zarmina : Je joue au volley deux fois par semaine'
    gloss: 'Zarmina : Je joue au volley deux fois par semaine.'
    note: Elle répond avec دو بار در هفته et والیبال بازی می‌کنم.
  prs.a1.unit29.lesson04.teach.dialogue_line3:
    title: 'Homayoun : Où joues-tu ?'
    gloss: 'Homayoun : Où joues-tu ?'
    note: Emploie کجا (où), introduit dans cette leçon.
  prs.a1.unit29.lesson04.teach.dialogue_line4:
    title: 'Zarmina : Je joue à la salle de sport'
    gloss: 'Zarmina : Je joue à la salle de sport.'
    note: Une réponse courte avec در باشگاه.
  prs.a1.unit29.lesson04.teach.dialogue_line5:
    title: 'Homayoun : Je joue au football au parc chaque semaine'
    gloss: 'Homayoun : Je joue au football au parc chaque semaine.'
    note: Introduit هر (chaque, révision de l’unité 24) combiné à هفته pour former هر هفته.
  prs.a1.unit29.lesson04.teach.dialogue_line6:
    title: 'Zarmina : Super !'
    gloss: 'Zarmina : Super !'
    note: عالی است conclut l’échange sur une note positive.
  prs.a1.unit29.lesson05.teach.reading_passage:
    title: Lecture sur le sport
    gloss: Zarmina joue au volley deux fois par semaine. Elle joue à la salle de sport. Homayoun joue au football au parc chaque semaine.
    note: Un court texte de lecture qui reprend le vocabulaire du sport de l’unité et introduit می‌کند (fait, 3e personne, révision) et او (il/elle, révision) pour les deux personnages connus.
  prs.a1.unit29.lesson06.teach.review_ama:
    title: Mais
    gloss: mais
    note: اما signifie « mais » (révision des unités précédentes).
    target_text: اما (mais)
  prs.a1.unit29.lesson06.teach.review_like_have_time:
    title: J’aime / temps / je n’ai pas
    gloss: j’aime / temps / je n’ai pas
    note: دوست دارم (j’aime, révision des unités 14 et 26), وقت (temps, révision des unités 11 et 26) et ندارم (je n’ai pas, révision des unités 3 et 28) se combinent dans la phrase de conclusion.
    target_text: دوست دارم (j’aime) / وقت (temps) / ندارم (je n’ai pas)
  prs.a1.unit29.lesson06.teach.wrap_summary:
    title: J’aime le football, mais je n’ai pas le temps
    gloss: J’aime le football, mais je n’ai pas le temps.
    note: Associe une préférence et une contrainte avec اما, ce qui donne à وقت ندارم un vrai sens.
