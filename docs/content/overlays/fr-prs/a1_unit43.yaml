  prs.a1.unit43.lesson04.library_dialogue:
    title: Dialogue à la bibliothèque
  prs.a1.unit43.lesson05.reading:
    title: 'Lecture : le livre emprunté'
  prs.a1.unit43.lesson06.wrap_up:
    title: Récapitulatif
teaching:
  prs.a1.unit43.lesson01.teach.review_book_have_is_in:
    title: 'Révision : livre, j’ai, est, dans'
    gloss: livre / j’ai / est / dans
    note: کتاب, دارم, است et در sont des mots de révision pour parler d’un livre.
    target_text: کتاب (livre) / دارم (j’ai) / است (est) / در (dans)
  prs.a1.unit43.lesson01.teach.review_want_one:
    title: 'Révision : je veux, un'
    gloss: je veux / un / une
    note: می‌خواهم et یک se combinent pour dire ce que tu veux.
    target_text: می‌خواهم (je veux) / یک (un / une)
  prs.a1.unit43.lesson01.teach.library_word:
    title: Bibliothèque
    gloss: bibliothèque
    note: کتابخانه est le mot standard en dari pour « bibliothèque » ; il est formé de کتاب (livre) et خانه (maison).
    example_gloss: Le livre est à la bibliothèque.
  prs.a1.unit43.lesson01.teach.librarian_word:
    title: Bibliothécaire
    gloss: bibliothécaire
    note: کتابدار signifie littéralement « qui tient les livres » (celui qui s’occupe des livres) ; il est formé comme دوکاندار (« commerçant », unité 8).
    example_gloss: Le bibliothécaire est à la bibliothèque.
  prs.a1.unit43.lesson01.teach.want_book_phrase:
    title: Je veux un livre
    gloss: Je veux un livre.
    note: یک کتاب می‌خواهم combine یک (un), کتاب (livre) et می‌خواهم (je veux).
  prs.a1.unit43.lesson01.teach.review_from_object_marker:
    title: 'Révision : de, marque de l’objet'
    gloss: de / (marque de l’objet)
    note: از (de, auprès de) et را (qui marque l’objet de la phrase, unités 14 et 26) sont des mots de révision.
    target_text: از (de / depuis) / را (marqueur de l’objet)
  prs.a1.unit43.lesson01.teach.want_book_from_librarian_phrase:
    title: Je demande le livre au bibliothécaire
    gloss: Je demande le livre au bibliothécaire.
    note: از کتابدار (auprès du bibliothécaire) s’ajoute à کتاب را می‌خواهم.
  prs.a1.unit43.lesson01.teach.want_one_book_from_librarian_phrase:
    title: Je demande un livre au bibliothécaire
    gloss: Je demande un livre au bibliothécaire.
    note: Combine یک (un) avec کتاب را از کتابدار می‌خواهم.
  prs.a1.unit43.lesson02.teach.review_date_day_monday:
    title: 'Révision : date, jour, lundi'
    gloss: date / jour / lundi
    note: تاریخ, روز et دوشنبه (tous de l’unité 9) sont des mots de révision pour demander une date de retour.
    target_text: تاریخ (date) / روز (jour) / دوشنبه (lundi)
  prs.a1.unit43.lesson02.teach.review_which_is:
    title: 'Révision : quel, est'
    gloss: quel / est
    note: کدام et است sont des mots de révision pour poser une question.
    target_text: کدام (quel) / است (est)
  prs.a1.unit43.lesson02.teach.return_giving_back_word:
    title: Rendre
    gloss: rendre
    note: پس دادن signifie littéralement « donner en retour » ; پس (en retour) se combine avec دادن (donner).
    example_gloss: La date de retour est lundi.
  prs.a1.unit43.lesson02.teach.ask_return_date_phrase:
    title: Quel jour faut-il rendre le livre ?
    gloss: Quel jour faut-il rendre le livre ?
    note: تاریخ پس دادن کتاب کدام روز است؟ demande quand un livre emprunté doit être rendu.
  prs.a1.unit43.lesson02.teach.return_date_answer_phrase:
    title: La date de retour est lundi
    gloss: La date de retour est lundi.
    note: تاریخ پس دادن دوشنبه است répond à la question en donnant un jour précis.
  prs.a1.unit43.lesson03.teach.review_want_book_one_this:
    title: 'Révision : je veux, livre, un, ce'
    gloss: je veux / livre / un / ce
    note: می‌خواهم, کتاب, یک et این sont des mots de révision pour demander un livre précis.
    target_text: می‌خواهم (je veux) / کتاب (livre) / یک (un / une) / این (ceci)
  prs.a1.unit43.lesson03.teach.get_word:
    title: Prendre
    gloss: prendre
    note: بگیرم est la forme du subjonctif (« que je prenne »), la même que celle employée avec می‌خواهم dans l’unité 42 pour dire « je veux prendre ».
    example_gloss: Je veux prendre un livre.
  prs.a1.unit43.lesson03.teach.loan_word:
    title: Emprunt
    gloss: emprunt
    note: قرض signifie prêt ou emprunt ; قرض گرفتن (« prendre en prêt ») est la façon courante de dire « emprunter » en dari.
    example_gloss: Ce livre est emprunté.
  prs.a1.unit43.lesson03.teach.want_borrow_book_phrase:
    title: Je veux emprunter le livre
    gloss: Je veux emprunter le livre.
    note: می‌خواهم کتاب را قرض بگیرم combine می‌خواهم, کتاب را, قرض et le subjonctif بگیرم.
  prs.a1.unit43.lesson03.teach.give_back_word:
    title: Donner (en retour)
    gloss: donner (en retour)
    note: بدهم est la forme du subjonctif de دادن (donner) ; avec پس (en retour), il signifie « rendre ».
    example_gloss: Je veux le rendre.
  prs.a1.unit43.lesson03.teach.want_return_book_phrase:
    title: Je veux rendre le livre
    gloss: Je veux rendre le livre.
    note: می‌خواهم کتاب را پس بدهم combine می‌خواهم, کتاب را, پس et le subjonctif بدهم.
  prs.a1.unit43.lesson03.teach.review_very_good:
    title: 'Révision : très, bien'
    gloss: très / bien
    note: بسیار et خوب sont des mots de révision pour confirmer quelque chose.
    target_text: بسیار (très) / خوب (bien / bon)
  prs.a1.unit43.lesson03.teach.good_answer_phrase:
    title: C’est bien
    gloss: C’est bien.
    note: خوب است confirme que quelque chose convient.
  prs.a1.unit43.lesson04.teach.review_hello_want:
    title: 'Révision : bonjour, je veux'
    gloss: bonjour / je veux
    note: سلام et می‌خواهم sont des mots de révision employés dans le dialogue.
    target_text: سلام (bonjour) / می‌خواهم (je veux)
  prs.a1.unit43.lesson04.teach.review_very_thanks_welcome:
    title: 'Révision : très, merci beaucoup, de rien'
    gloss: très / merci beaucoup / de rien
    note: بسیار, تشکر زیاد et خواهش می‌کنم sont des mots de révision employés dans le dialogue.
    target_text: بسیار (très) / تشکر زیاد (merci beaucoup) / خواهش می‌کنم (je vous en prie)
  prs.a1.unit43.lesson04.teach.dialogue_line1:
    title: 'Homayoun : Bonjour. Je voudrais emprunter un livre.'
    gloss: Bonjour. Je voudrais emprunter un livre.
  prs.a1.unit43.lesson04.teach.dialogue_line2:
    title: 'Le bibliothécaire : Bonjour. Quel livre voulez-vous ?'
    gloss: Bonjour. Quel livre voulez-vous ?
    note: می‌خواهین est la forme plurielle de politesse de « vous voulez ».
  prs.a1.unit43.lesson04.teach.dialogue_line3:
    title: 'Homayoun : Je veux ce livre.'
    gloss: Je veux ce livre.
  prs.a1.unit43.lesson04.teach.dialogue_line4:
    title: 'Le bibliothécaire : Très bien. La date de retour est lundi.'
    gloss: Très bien. La date de retour est lundi.
  prs.a1.unit43.lesson04.teach.dialogue_line5:
    title: 'Homayoun : Très bien. Merci beaucoup.'
    gloss: Très bien. Merci beaucoup.
  prs.a1.unit43.lesson04.teach.dialogue_line6:
    title: 'Le bibliothécaire : De rien.'
    gloss: De rien.
  prs.a1.unit43.lesson05.teach.review_he_she_has:
    title: 'Révision : Homayoun, il/elle, il/elle a'
    gloss: Homayoun / il/elle / il/elle a
    note: همایون, او et دارد sont des mots de révision employés dans le texte à lire.
    target_text: همایون (Homayoun) / او (il / elle) / دارد (il / elle a)
  prs.a1.unit43.lesson05.teach.reading_passage:
    title: 'Lecture : le livre emprunté'
    gloss: Homayoun a un livre. Son livre vient de la bibliothèque. La date de retour de son livre est lundi. Homayoun est content.
  prs.a1.unit43.lesson06.teach.review_wrap_up_words:
    title: 'Révision : je n’ai pas, mais, vous (formel)'
    gloss: je n’ai pas / mais / vous (formel)
    note: ندارم, اما et شما sont des mots de révision employés pour opposer deux jours.
    target_text: ندارم (je n’ai pas) / اما (mais) / شما (vous, forme de politesse)
  prs.a1.unit43.lesson06.teach.review_tuesday:
    title: 'Révision : mardi'
    gloss: mardi
    note: سه‌شنبه est un mot de révision.
    target_text: سه‌شنبه (mardi)
  prs.a1.unit43.lesson06.teach.contrast_phrase:
    title: J’ai un livre lundi, mais pas mardi
    gloss: Lundi j’ai un livre, mais mardi je n’en ai pas.
    note: اما oppose le fait d’avoir un livre lundi et de ne pas en avoir mardi.
  prs.a1.unit43.lesson06.teach.formal_question_phrase:
    title: Quel livre voulez-vous ?
    gloss: Quel livre voulez-vous ?
    note: La version formelle, avec شما, pour demander quel livre quelqu’un veut.
