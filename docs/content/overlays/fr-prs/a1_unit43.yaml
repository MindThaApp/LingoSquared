course:
  title: Dari A1
  description: 'Dari de Kaboul pour débutants : emprunter et rendre un document simple à la bibliothèque, demander la date de retour, et lire un court texte sur un livre emprunté. Tu apprendras à demander quel livre quelqu’un veut, à proposer et confirmer une date de retour, et à comprendre un échange de base à la bibliothèque.'
units:
  prs.a1.unit43.library:
    title: La bibliothèque
    description: Demander un livre, l’emprunter et le rendre, demander et confirmer une date de retour, et lire un court texte sur un livre emprunté.
lessons:
  prs.a1.unit43.lesson01.library_vocabulary:
