    feedback: '*گم کرده بودم* signifie j’avais perdu : le participe *گم کرده* plus *بودم*.'
  prs.a2.unit26.lesson01.exercise03.recognize_we_arrived:
    instruction: Que signifie cette phrase ?
    correct_option: Nous étions arrivés
    distractors:
