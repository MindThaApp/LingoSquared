    feedback: 'La terminaison de *بودیم* signifie nous : *ما رسیده بودیم* veut dire nous étions arrivés.'
  prs.a2.unit26.lesson01.exercise04.match_form_and_words:
    instruction: Associe chaque mot dari à son sens.
    accepted_answers:
    - value:
        رفته بودم: j’étais allé(e)
        رفته بودی: tu étais allé(e) (à un ami)
        رفته بود: il ou elle était allé(e)
        رفته بودیم: nous étions allés
        رفته بودین: vous étiez allés (forme de politesse ou pluriel)
        رفته بودند: ils étaient allés
        طیاره: avion
        میدان هوایی: aéroport
        ایستگاه: gare
      status: correct
    feedback: 'Seul *بود-* change selon la personne : *بودم* je, *بودی* tu (ami), *بود* il ou elle, *بودیم* nous, *بودین* vous (formel ou pluriel), *بودند* ils.'
    pairs:
    - left: رفته بودم
      right: j’étais allé(e)
    - left: رفته بودی
      right: tu étais allé(e) (à un ami)
    - left: رفته بود
      right: il ou elle était allé(e)
    - left: رفته بودیم
      right: nous étions allés
    - left: رفته بودین
      right: vous étiez allés (forme de politesse ou pluriel)
    - left: رفته بودند
      right: ils étaient allés
    - left: طیاره
      right: avion
    - left: میدان هوایی
      right: aéroport
    - left: ایستگاه
      right: gare
  prs.a2.unit26.lesson01.exercise05.order_we_arrived_station:
    instruction: 'Remets les mots dans l’ordre pour dire : Nous étions arrivés à la gare.'
