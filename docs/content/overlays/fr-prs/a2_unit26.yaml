    feedback: '*ما به ایستگاه رسیده بودیم* place le participe en premier et *بودیم* à la fin.'
  prs.a2.unit26.lesson01.exercise06.translate_bus_left:
    instruction: 'Traduis en dari, avec le plus-que-parfait de رفتن : Le bus était parti.'
    accepted_answers:
    - value: بس رفته بود.
      status: correct
    - value: آن بس رفته بود.
      status: correct
    feedback: '*بس رفته بود* signifie le bus était parti. *آن* (ce, ce-là) est facultatif.'
  prs.a2.unit26.lesson02.exercise01.recognize_had_eaten:
