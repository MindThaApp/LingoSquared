    - La porte est à l’aéroport
    accepted_answers:
    - value: Le portail avait été fermé
      status: correct
    feedback: '*بسته شده بود* est le plus-que-parfait de *بسته شدن* : la porte avait été fermée.'
  prs.a2.unit26.lesson02.exercise03.match_participles:
    instruction: Associe chaque verbe au plus-que-parfait à son sens.
    accepted_answers:
    - value:
        رفته بود: il ou elle était allé(e)
        خورده بود: il ou elle avait mangé
        دیده بود: il ou elle avait vu
        رسیده بود: il ou elle était arrivé(e)
        آمده بود: il ou elle était venu(e)
        کرده بود: il ou elle avait fait
        برگشته بود: il ou elle était rentré(e)
        گم کرده بود: il ou elle avait perdu
        خراب شده بود: il était tombé en panne
      status: correct
    feedback: 'Tous ces verbes sont un participe en *ه* plus *بود*. Pour les verbes de deux mots, le premier mot reste devant : *گم کرده بود*, *خراب شده بود*.'
    pairs:
    - left: رفته بود
      right: il ou elle était allé(e)
    - left: خورده بود
      right: il ou elle avait mangé
    - left: دیده بود
      right: il ou elle avait vu
    - left: رسیده بود
      right: il ou elle était arrivé(e)
    - left: آمده بود
      right: il ou elle était venu(e)
    - left: کرده بود
      right: il ou elle avait fait
    - left: برگشته بود
      right: il ou elle était rentré(e)
    - left: گم کرده بود
      right: il ou elle avait perdu
    - left: خراب شده بود
      right: il était tombé en panne
  prs.a2.unit26.lesson02.exercise04.order_lost_key:
