      status: correct
    feedback: '*رفته* est le participe de *رفتن*. Avec *بود*, il forme *رفته بود* : le bus était parti.'
  prs.a2.unit26.lesson03.exercise06.translate_manager_left:
    instruction: 'Traduis en dari, avec le plus-que-parfait de رفتن : Quand je suis arrivé, le directeur était parti.'
