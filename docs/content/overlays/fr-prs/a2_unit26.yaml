course:
  title: Dari en français A2
  description: 'Dari afghan de niveau pré-intermédiaire : dire que quelque chose s’était déjà produit avant un moment du passé, par exemple que le bus était parti avant ton arrivée. Le plus-que-parfait (participe plus le passé de بودن), sa forme négative et le contraste avec le passé simple.'
units:
  prs.a2.unit26.already_happened:
    title: C’était déjà arrivé
lessons:
  prs.a2.unit26.lesson01.form_and_travel_words:
    title: La forme « était allé » et les mots du voyage
  prs.a2.unit26.lesson02.more_verbs_with_bud:
    title: Plus de verbes au plus-que-parfait
  prs.a2.unit26.lesson03.earlier_and_later:
    title: L’événement antérieur et l’événement suivant
  prs.a2.unit26.lesson04.time_words:
    title: Déjà, avant, pas encore
  prs.a2.unit26.lesson05.reading_and_listening:
    title: 'Lire et écouter : arriver en retard'
  prs.a2.unit26.lesson06.airport_conversation:
    title: Une conversation sur un avion manqué
teaching:
  prs.a2.unit26.lesson01.teach.bus:
    title: Autobus
    gloss: autobus
    note: '*بس* est le bus, le moyen habituel de voyager entre les villes en Afghanistan. C’est un mot de révision de l’unité sur les transports.'
    example_gloss: Le bus va à Mazar.
  prs.a2.unit26.lesson01.teach.station:
    title: Gare
    gloss: gare, arrêt de bus
    note: '*ایستگاه* désigne une gare ou un arrêt. *ایستگاه بس* est la gare routière.'
    example_gloss: La gare routière est à Kaboul.
  prs.a2.unit26.lesson01.teach.plane:
    title: Avion
    gloss: avion
    note: '*طیاره* est le mot afghan pour désigner un avion.'
    example_gloss: L’avion arrive à Kaboul.
  prs.a2.unit26.lesson01.teach.airport:
    title: Aéroport
    gloss: aéroport
    note: '*میدان هوایی* est l’aéroport. Les avions partent du *میدان هوایی* et les bus partent de l’*ایستگاه*.'
    example_gloss: L’aéroport est à Kaboul.
  prs.a2.unit26.lesson01.teach.car:
    title: Voiture
    gloss: voiture
    note: '*موتر* est le mot afghan pour voiture. Ajoute *-م* pour dire ma voiture : *موترم*.'
    example_gloss: Ma voiture est neuve.
  prs.a2.unit26.lesson01.teach.arrive:
    title: Arriver
    gloss: arriver, atteindre
    note: '*رسیدن* signifie arriver. On indique le lieu d’arrivée avec *به* : *به ایستگاه رسیدم* veut dire je suis arrivé(e) à la gare. Le radical du passé est *رسید*, d’où *رسیدم، رسیدی، رسید، رسیدیم*.'
    example_gloss: Nous sommes arrivés à la gare.
  prs.a2.unit26.lesson01.teach.return:
    title: Rentrer
    gloss: revenir, rentrer
    note: '*برگشتن* signifie revenir ou rentrer. Le radical du passé est *برگشت* : *برگشتم* veut dire je suis rentré(e).'
    example_gloss: Hier, je suis rentré(e) à la maison.
  prs.a2.unit26.lesson01.teach.passport:
    title: Passeport
    gloss: passeport
    note: '*پاسپورت* est un passeport. Ajoute *-م* pour dire mon : *پاسپورتم*.'
    example_gloss: Mon passeport est à la maison.
  prs.a2.unit26.lesson01.teach.key:
    title: Clé
    gloss: clé
    note: '*کلید* est une clé. *کلیدم* est ma clé.'
    example_gloss: Ma clé est à la maison.
  prs.a2.unit26.lesson01.teach.phone:
    title: Téléphone
    gloss: téléphone
    note: '*تیلفون* est le téléphone. *تیلفونم* est mon téléphone. *تیلفون کردن* signifie passer un coup de téléphone.'
    example_gloss: Mon téléphone est neuf.
  prs.a2.unit26.lesson01.teach.lose:
    title: Perdre
    gloss: perdre, égarer
    note: '*گم کردن* signifie perdre quelque chose. *گم* veut dire perdu et *کردن* est le verbe faire : on place l’objet perdu suivi de *را* devant le verbe, comme dans *کلیدم را گم کردم* (j’ai perdu ma clé).'
    example_gloss: Hier, j’ai perdu ma clé.
  prs.a2.unit26.lesson01.teach.when:
    title: Quand
    gloss: quand, au moment où
    note: '*وقتی* introduit une proposition qui donne un moment dans le temps, ici un moment du passé : *وقتی رسیدم* signifie quand je suis arrivé(e). Cette proposition est le point de repère de toute l’unité.'
    example_gloss: Quand je suis arrivé(e) à la maison, j’ai pris mon petit-déjeuner.
  prs.a2.unit26.lesson01.teach.participle:
    title: 'Le participe passé : radical du passé plus ه'
    gloss: allé, mangé, vu, arrivé, venu, fait, devenu (les participes)
    note: 'Le plus-que-parfait se forme avec un participe passé ; apprends-le donc d’abord. Prends l’infinitif, retire le *ن* final pour obtenir le radical du passé, puis ajoute *ه* : *رفتن* a pour radical *رفت*, donc le participe est *رفته*. La même règle donne *خوردن* → *خورده*, *دیدن* → *دیده*, *رسیدن* → *رسیده*, *آمدن* → *آمده*, *کردن* → *کرده*, *شدن* → *شده*. Le participe ne change jamais selon la personne : il est identique pour je, tu, il et ils. C’est aussi l’élément de *رفته‌ام* (je suis allé(e)) que tu rencontreras dans l’unité sur les expériences de vie ; cette unité ne l’emploie qu’avec le passé de *بودن*.'
  prs.a2.unit26.lesson01.teach.paradigm:
    title: 'Le plus-que-parfait : participe plus le passé de بودن'
    gloss: j’étais allé(e), tu étais allé(e), il/elle était allé(e), nous étions allé(e)s, vous étiez allé(e)(s) (politesse ou pluriel), ils/elles étaient allé(e)s
    note: 'Le plus-que-parfait indique que quelque chose s’était déjà produit avant un autre moment du passé. Il se forme avec le participe plus le passé de *بودن* (être) : *بودم، بودی، بود، بودیم، بودین، بودند*. Ainsi *رفته بودم* signifie j’étais allé(e), *رفته بودی* tu étais allé(e) (à un ami), *رفته بود* il ou elle était allé(e) (le simple *بود* n’a pas de terminaison), *رفته بودیم* nous étions allé(e)s, *رفته بودین* vous étiez allé(e)(s) (politesse ou pluriel), *رفته بودند* ils ou elles étaient allé(e)s. Le pronom est facultatif, car la terminaison indique déjà la personne. Le participe et *بود-* s’écrivent en deux mots.'
  prs.a2.unit26.lesson01.teach.sentence:
    title: Quand je suis arrivé(e) à la gare, le bus était parti
    gloss: Quand je suis arrivé(e) à la gare, le bus était parti.
    note: 'C’est le schéma de toute l’unité. *وقتی به ایستگاه رسیدم* est le moment de ton arrivée (passé simple). *بس رفته بود* est ce qui s’était déjà produit avant ce moment (plus-que-parfait) : le bus est parti en premier, tu es arrivé(e) ensuite.'
  prs.a2.unit26.lesson02.teach.more_participles:
    title: Une seule règle pour tous les verbes
    gloss: j’avais mangé, tu avais vu, il/elle était arrivé(e), nous étions venu(e)s, vous aviez fait, ils/elles étaient rentré(e)s
    note: 'La règle de *رفتن* vaut pour tous les verbes : radical du passé plus *ه*, puis *بودم، بودی، بود، بودیم، بودین، بودند*. *خورده بودم* signifie j’avais mangé, *دیده بودی* tu avais vu, *رسیده بود* il ou elle était arrivé(e), *آمده بودیم* nous étions venu(e)s, *کرده بودین* vous aviez fait, *برگشته بودند* ils ou elles étaient rentré(e)s. Seul *بود-* change, jamais le participe.'
  prs.a2.unit26.lesson02.teach.compound_verbs:
    title: Les verbes composés de deux mots
    gloss: j’avais perdu ; il avait été fermé ; il était tombé en panne
    note: 'Beaucoup de verbes se composent d’un mot plus *کردن* ou *شدن*. Le participe se forme sur la deuxième partie et la première reste devant : *گم کردن* donne *گم کرده بودم* (j’avais perdu), *بسته شدن* donne *بسته شده بود* (il avait été fermé), *خراب شدن* donne *خراب شده بود* (il était tombé en panne). *شدن* est utile quand quelque chose est arrivé à une chose : la porte, la voiture, le bureau.'
  prs.a2.unit26.lesson02.teach.gate:
    title: Portail, porte
    gloss: portail, porte
    note: '*دروازه* est un portail ou une grande porte, par exemple la porte d’embarquement à l’aéroport ou la porte d’un bureau.'
    example_gloss: Le portail est ouvert.
  prs.a2.unit26.lesson02.teach.gate_closed:
    title: Le portail avait été fermé
    gloss: Le portail avait été fermé.
    note: '*بسته شده بود* dit que le portail était déjà fermé avant ton arrivée. C’est le plus-que-parfait de *بسته شدن*.'
  prs.a2.unit26.lesson02.teach.break_down:
    title: Tomber en panne
    gloss: tomber en panne, se détraquer
    note: '*خراب* signifie cassé ou abîmé et *شدن* signifie devenir ; *خراب شدن* veut donc dire tomber en panne. Le passé simple est *خراب شد* : *موترم خراب شد* signifie ma voiture est tombée en panne.'
    example_gloss: Ma voiture est tombée en panne.
  prs.a2.unit26.lesson02.teach.ate_breakfast:
    title: J’avais pris mon petit-déjeuner
    gloss: J’avais pris mon petit-déjeuner.
    note: '*صبحانه خورده بودم* dit que le petit-déjeuner était déjà terminé avant le moment dont tu parles.'
  prs.a2.unit26.lesson02.teach.meeting:
    title: Réunion, rendez-vous
    gloss: réunion, rendez-vous
    note: '*جلسه* est une réunion. C’est un autre type de rendez-vous que tu peux manquer ou auquel tu peux arriver en retard.'
    example_gloss: La réunion a commencé à neuf heures.
  prs.a2.unit26.lesson02.teach.manager:
    title: Directeur
    gloss: directeur, responsable
    note: '*مدیر* est le directeur ou le responsable d’un bureau.'
    example_gloss: Le directeur est au bureau.
  prs.a2.unit26.lesson03.teach.contrast:
    title: Plus-que-parfait et passé simple
    gloss: Quand je suis arrivé(e), le bus était parti. / Quand je suis arrivé(e), le bus est parti.
    note: 'Quand on raconte ensemble deux événements passés, celui qui a eu lieu en premier se met au plus-que-parfait et le second, le point de repère, au passé simple. Dans *وقتی رسیدم، بس رفته بود*, tu es arrivé(e) en second et le bus était parti en premier : tu ne trouves plus rien, le bus est déjà parti. Dans *وقتی رسیدم، بس رفت*, les deux verbes sont au passé simple : le bus est donc parti après ton arrivée, ou au moment où tu arrivais. Les deux propositions peuvent aussi être inversées : *بس رفته بود، وقتی رسیدم*.'
  prs.a2.unit26.lesson03.teach.bus_left_simple:
    title: Quand je suis arrivé(e), le bus est parti
    gloss: Quand je suis arrivé(e), le bus est parti.
    note: Compare avec *بس رفته بود*. Ici, le bus est parti après ton arrivée. Tu aurais pu courir pour l’attraper. Avec *رفته بود*, il était déjà parti.
  prs.a2.unit26.lesson03.teach.manager_left:
    title: Quand je suis arrivé(e), le directeur était parti
    gloss: Quand je suis arrivé(e), le directeur était parti.
    note: 'Même schéma que pour le bus : *وقتی رسیدم* est l’arrivée, *مدیر رفته بود* est l’événement antérieur. C’est ce que tu dis quand tu arrives à un rendez-vous et que la personne est déjà partie.'
  prs.a2.unit26.lesson03.teach.negative:
    title: 'La négation : ن sur le participe'
    gloss: je n’étais pas allé(e), tu n’étais pas allé(e), il/elle n’était pas allé(e), nous n’étions pas allé(e)s, vous n’étiez pas allé(e)(s), ils/elles n’étaient pas allé(e)s
    note: 'Pour dire que quelque chose ne s’était pas encore produit, place *ن* au début du participe, et non sur *بود* : *رفته بودم* devient *نرفته بودم* (je n’étais pas allé(e)). *بود-* garde les mêmes terminaisons : *نرفته بودم، نرفته بودی، نرفته بود، نرفته بودیم، نرفته بودین، نرفته بودند*. N’écris pas *رفته نبودم* pour cela.'
  prs.a2.unit26.lesson03.teach.negative_more:
    title: Participes négatifs d’autres verbes
    gloss: je n’avais pas mangé, je n’avais pas vu, je n’étais pas arrivé(e), je n’étais pas venu(e)
    note: 'Le même *ن* se place sur chaque participe : *نخورده* (pas mangé), *ندیده* (pas vu), *نرسیده* (pas arrivé). Le verbe *آمدن* est l’exception à retenir : son participe *آمده* prend *نیـ*, donc la négation est *نیامده* (pas venu), comme dans *نیامده بودم*. Les verbes de deux mots placent le *ن* sur la deuxième partie : *گم نکرده بودم* (je ne l’avais pas perdu).'
  prs.a2.unit26.lesson04.teach.already:
    title: Déjà, auparavant
    gloss: déjà, avant, auparavant
    note: '*قبلاً* signifie avant maintenant ou auparavant. Il souligne que la chose a été faite plus tôt, et se place avant le participe ou au début de la phrase.'
    example_gloss: J’avais déjà pris mon petit-déjeuner.
  prs.a2.unit26.lesson04.teach.from_before:
    title: Déjà, dès avant
    gloss: déjà, d’avance
    note: '*از قبل* signifie à l’avance ou déjà, depuis un moment antérieur. Il se place avant le participe : *از قبل رفته بود* signifie il ou elle était déjà parti(e). Il est très courant avec le plus-que-parfait.'
    example_gloss: Le bus était déjà parti.
  prs.a2.unit26.lesson04.teach.not_yet:
    title: Encore, pas encore
    gloss: 'encore, toujours ; avec une négation : pas encore'
    note: '*هنوز* avec un verbe négatif signifie pas encore. *هنوز نیامده بود* veut dire il ou elle n’était pas encore venu(e). Le plus-que-parfait négatif et *هنوز* vont ensemble : ce que tu attendais ne s’était pas produit à ce moment-là.'
    example_gloss: Il n’était pas encore venu.
  prs.a2.unit26.lesson04.teach.before_clause:
    title: 'قبل از اینکه : avant que j’arrive'
    gloss: Avant que j’arrive, l’avion était parti. / Avant que nous arrivions, l’avion était parti.
    note: '*قبل از اینکه* signifie avant que, et introduit une proposition avec son propre verbe. Le verbe qui suit est au subjonctif, la même forme que celle employée après *باید* : *برسم* (que j’arrive), *برسیم* (que nous arrivions). Ce n’est pas un verbe au passé, même si l’histoire est au passé. La proposition principale dit alors ce qui s’était déjà produit : *طیاره رفته بود*. Ainsi *قبل از اینکه من برسم، طیاره رفته بود* a le même sens que *وقتی رسیدم، طیاره رفته بود* : l’avion est parti en premier. Les propositions peuvent changer de place.'
  prs.a2.unit26.lesson04.teach.friend_not_yet:
    title: Quand je suis arrivé(e), mon ami n’était pas encore venu
    gloss: Quand je suis arrivé(e), mon ami n’était pas encore venu.
    note: Ici, l’événement antérieur est quelque chose qui ne s’était pas encore produit. *هنوز نیامده بود* place l’événement manquant avant le point de repère *وقتی رسیدم*.
  prs.a2.unit26.lesson04.teach.what_happened:
    title: Quand tu es arrivé(e) à la gare, que s’est-il passé ?
    gloss: Quand tu es arrivé(e) à la gare, que s’est-il passé ?
    note: '*چه شد؟* demande ce qui s’est passé. La réponse est généralement au plus-que-parfait : *بس از قبل رفته بود* (le bus était déjà parti).'
  prs.a2.unit26.lesson05.teach.four:
    title: Quatre
    gloss: quatre
    note: '*چهار* signifie quatre. On l’emploie pour l’heure : *ساعت چهار* veut dire quatre heures.'
    example_gloss: Je suis arrivé à la maison à quatre heures.
  prs.a2.unit26.lesson05.teach.staff:
    title: Personnel, employés
    gloss: personnel, employés
    note: '*کارمندان* est le pluriel de *کارمند* (employé). La terminaison *-ان* forme le pluriel des noms de personnes.'
    example_gloss: Les employés sont au bureau.
  prs.a2.unit26.lesson05.teach.passport_office:
    title: Bureau des passeports
    gloss: bureau des passeports
    note: '*دفتر پاسپورت* est le bureau où l’on obtient ou renouvelle un passeport. Tu connais déjà les deux mots.'
    example_gloss: Le bureau des passeports est à Kaboul.
  prs.a2.unit26.lesson05.teach.bus_turn01:
    title: Shakiba demande à Naimat ce qu’il a fait hier
    gloss: Naimat, tu es allé à Mazar hier ?
    note: Shakiba pose une question fermée (oui ou non) sur une action terminée, avec le passé simple *رفتی*. Elle parle à un ami, donc elle utilise *تو*.
  prs.a2.unit26.lesson05.teach.bus_turn02:
    title: Naimat dit ce qu’il a trouvé
    gloss: Non. Quand je suis arrivé à la gare, le bus était parti.
    note: Naimat répond *نخیر*, puis donne le point de repère au passé simple, *وقتی به ایستگاه رسیدم*, et l’événement antérieur au plus-que-parfait, *بس رفته بود*.
  prs.a2.unit26.lesson05.teach.bus_turn03:
    title: Shakiba demande l’heure
    gloss: À quelle heure le bus est-il parti ?
    note: '*ساعت چند* demande l’heure. *حرکت کرد* est le passé simple de *حرکت کردن*, partir.'
  prs.a2.unit26.lesson05.teach.bus_turn04:
    title: Naimat donne les deux heures
    gloss: À huit heures. Moi, je suis arrivé à neuf heures.
    note: 'Deux heures, deux événements : le bus est parti à *ساعت هشت* et Naimat est arrivé à *ساعت نه*. Huit heures, c’est avant neuf heures : le bus est donc parti en premier.'
  prs.a2.unit26.lesson05.teach.bus_turn05:
    title: Shakiba demande ce qui s’est passé ensuite
    gloss: Qu’est-ce que tu as fait ensuite ?
    note: '*بعد چه کردی؟* demande ce que tu as fait ensuite. On emploie le passé simple, car c’est un nouvel événement, après l’arrivée.'
  prs.a2.unit26.lesson05.teach.bus_turn06:
    title: Naimat est rentré chez lui
    gloss: Je suis rentré à la maison.
    note: '*برگشتم* est le passé simple de *برگشتن* : il est rentré chez lui.'
  prs.a2.unit26.lesson05.teach.message:
    title: Un message sur un retard
    gloss: Bonjour Shakiba. Aujourd’hui, je suis arrivé au bureau des passeports à quatre heures, mais le bureau était fermé. Les employés étaient partis. Ma voiture était tombée en panne, donc je suis arrivé en retard. Demain matin, j’y retourne.
    note: 'Un court message écrit au plus-que-parfait. Il dit ce que l’auteur a trouvé en arrivant : le bureau était fermé et les employés étaient partis. Il donne aussi la raison antérieure de son retard : la voiture était tombée en panne.'
  prs.a2.unit26.lesson06.teach.herat:
    title: Hérat
    gloss: Hérat (ville de l’ouest de l’Afghanistan)
    note: '*هرات* est la ville de Hérat, dans l’ouest de l’Afghanistan. On y va en avion depuis Kaboul.'
    example_gloss: L’avion va à Hérat.
  prs.a2.unit26.lesson06.teach.find:
    title: Trouver
    gloss: trouver
    note: '*پیدا کردن* signifie trouver quelque chose que l’on cherchait. L’objet se place avant le verbe, avec *را* : *کلیدم را پیدا کردم* veut dire j’ai trouvé ma clé. La forme négative est *پیدا نکردم* (je ne l’ai pas trouvée).'
    example_gloss: J’ai trouvé ma clé.
  prs.a2.unit26.lesson06.teach.bad:
    title: Mauvais
    gloss: mauvais
    note: '*بد* signifie mauvais. *چه بد!* est une réaction amicale à une mauvaise nouvelle, le contraire de *چه خوب!*.'
    example_gloss: Quel dommage !
  prs.a2.unit26.lesson06.teach.airport_turn01:
    title: Naimat demande pourquoi Shakiba n’y est pas allée
    gloss: Shakiba, pourquoi tu n’es pas allée à Hérat la semaine dernière ?
    note: Naimat demande *چرا* avec le passé simple négatif *نرفتی*. C’est une amie, donc il utilise *تو*.
  prs.a2.unit26.lesson06.teach.airport_turn02:
    title: Shakiba donne la raison
    gloss: Parce que j’avais perdu mon passeport. Je ne l’ai pas retrouvé avant dix heures.
    note: '*چون* (parce que) introduit la raison, et cette raison est l’événement antérieur, d’où le plus-que-parfait : *گم کرده بودم*. *آن را* (le, la) renvoie au passeport.'
  prs.a2.unit26.lesson06.teach.airport_turn03:
    title: Naimat demande ce qui s’est passé à l’aéroport
    gloss: Quand tu es arrivée à l’aéroport, que s’est-il passé ?
    note: Le point de repère est *وقتی به میدان هوایی رسیدی*, au passé simple. *چه شد؟* demande ce qui était déjà le cas.
  prs.a2.unit26.lesson06.teach.airport_turn04:
    title: Shakiba raconte ce qu’elle a trouvé et ce qu’elle a fait
    gloss: L’avion était parti. Ensuite, je suis rentrée à la maison et j’ai téléphoné.
    note: '*طیاره رفته بود* est l’événement antérieur, au plus-que-parfait. Viennent ensuite deux nouveaux événements au passé simple : *برگشتم* et *تیلفون کردم*.'
  prs.a2.unit26.lesson06.teach.airport_turn05:
    title: Naimat réagit
    gloss: Quel dommage !
    note: '*چه بد!* est une courte réaction amicale à une mauvaise nouvelle.'
exercises:
