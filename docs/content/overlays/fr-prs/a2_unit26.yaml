      - را
      - گم
      - کرده
      - بودم
      status: correct
    feedback: '*کلیدم را گم کرده بودم* garde *را* après ce qui a été perdu et le verbe à la fin.'
  prs.a2.unit26.lesson02.exercise05.complete_gate:
    instruction: 'Complète la phrase : La porte avait été fermée.'
    accepted_answers:
    - value: بود
      status: correct
    feedback: '*بود* est le passé de *بودن*. Avec *بسته شده*, il forme le plus-que-parfait.'
  prs.a2.unit26.lesson02.exercise06.translate_car_broke_down:
    instruction: 'Traduis en dari, avec le plus-que-parfait de خراب شدن : Ma voiture était tombée en panne.'
    accepted_answers:
    - value: موترم خراب شده بود.
      status: correct
    - value: موتر من خراب شده بود.
      status: correct
    feedback: '*موترم خراب شده بود* signifie ma voiture était tombée en panne. *موتر من* est la même chose avec le pronom écrit en toutes lettres.'
  prs.a2.unit26.lesson03.exercise01.which_first:
    instruction: Lis la phrase. Qu’est-ce qui s’est passé en premier ?
    correct_option: Le bus est parti
    distractors:
    - je suis arrivé(e)
    - Je suis rentré à la maison
    - J’ai acheté un billet
    accepted_answers:
    - value: Le bus est parti
      status: correct
    feedback: '*بس رفته بود* est l’événement antérieur : le bus est donc parti en premier. *وقتی رسیدم* est le point de repère postérieur.'
  prs.a2.unit26.lesson03.exercise02.bus_left_after:
    instruction: Lis la phrase. Quelle affirmation est vraie ?
    correct_option: Le bus est parti après mon arrivée
    distractors:
    - Le bus est parti avant mon arrivée
    - Le bus n’est jamais parti
    - Je ne suis pas arrivé
    accepted_answers:
    - value: Le bus est parti après mon arrivée
      status: correct
    feedback: 'Les deux verbes sont au passé simple, donc l’ordre des événements est l’ordre des mots : d’abord *رسیدم*, puis *بس رفت*.'
  prs.a2.unit26.lesson03.exercise03.match_simple_perfect:
    instruction: Associe chaque verbe en dari à son sens.
    accepted_answers:
    - value:
        رسیدم: je suis arrivé(e)
        رسیده بودم: j’étais arrivé(e)
        رفت: il ou elle est parti(e)
        رفته بود: il ou elle était parti(e)
        دیدم: j’ai vu
        دیده بودم: j’avais vu
        گم کردم: j’ai perdu
        گم کرده بودم: j’avais perdu
        نرفته بودم: je n’étais pas allé(e)
      status: correct
    feedback: Le passé simple est le radical du passé plus une terminaison. Le plus-que-parfait ajoute un participe et *بود-*, donc il compte deux mots.
    pairs:
    - left: رسیدم
      right: je suis arrivé(e)
    - left: رسیده بودم
      right: j’étais arrivé(e)
    - left: رفت
      right: il ou elle est parti(e)
    - left: رفته بود
      right: il ou elle était parti(e)
    - left: دیدم
      right: j’ai vu
    - left: دیده بودم
      right: j’avais vu
    - left: گم کردم
      right: j’ai perdu
    - left: گم کرده بودم
      right: j’avais perdu
    - left: نرفته بودم
      right: je n’étais pas allé(e)
  prs.a2.unit26.lesson03.exercise04.order_plane_left:
    instruction: 'Remets les mots dans l’ordre pour dire : Quand je suis arrivé, l’avion était parti.'
    accepted_answers:
    - value:
      - وقتی
      - رسیدم
      - طیاره
      - رفته
      - بود
