      - بود
      - وقتی
      - رسیدم
      status: correct
    feedback: '*وقتی رسیدم، طیاره رفته بود.* L’arrivée est le point de repère et le départ de l’avion est l’événement antérieur. Les deux propositions peuvent changer de place.'
  prs.a2.unit26.lesson03.exercise05.complete_bus_left:
    instruction: 'Complète la phrase : Quand je suis arrivé à la gare, le bus était parti.'
    accepted_answers:
