    title: Lecture sur les sentiments
    gloss: Homayoun est content aujourd’hui, parce qu’il fait beau. Zarmina est un peu fatiguée, parce qu’elle a beaucoup de travail. Elle est parfois inquiète, parce qu’elle a beaucoup de travail.
