course:
  title: Dari A1
  description: 'Dari de Kaboul pour débutants : les mots de base pour les sentiments (content, triste, fatigué, en colère, inquiet), demander pourquoi et donner une raison avec چون, et un dialogue entre Zarmina et Homayoun qui comparent leurs sentiments.'
