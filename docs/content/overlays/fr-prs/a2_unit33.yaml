  prs.a2.unit33.lesson06.exercise01.comprehend_why_not_come:
    instruction: Lis la conversation, car il n’y a pas encore d’enregistrement. Pourquoi Najiba n’est-elle pas venue à la salle de sport hier ?
    correct_option: Elle a oublié de se coucher tôt et s’est réveillée tard
    distractors:
    - Elle avait renoncé à aller à la salle de sport
    - Elle a lu un livre toute la matinée
    - Elle était malade et est restée à la maison
    accepted_answers:
    - value: Elle a oublié de se coucher tôt et s’est réveillée tard
      status: correct
    feedback: 'Najiba dit *فراموش کردم که زود بخوابم، پس صبح دیر بیدار شدم* : elle a oublié de se coucher tôt, alors elle s’est réveillée tard.'
  prs.a2.unit33.lesson06.exercise02.comprehend_what_she_tries:
    instruction: Lis la conversation, car il n’y a pas encore d’enregistrement. Qu’est-ce que Najiba essaie de faire chaque soir ?
    correct_option: Se coucher tôt
    distractors:
    - Lire un livre
    - Courir une demi-heure
    - Ne pas manger de sucreries
    accepted_answers:
    - value: Se coucher tôt
      status: correct
    feedback: '*کوشش می‌کنم که هر شب زود بخوابم* veut dire « j’essaie de me coucher tôt chaque soir ».'
  prs.a2.unit33.lesson06.exercise03.recognize_from_today:
    instruction: Que signifie cette phrase ?
    correct_option: À partir d’aujourd’hui, je ne me couche plus tard
    distractors:
    - À partir d’aujourd’hui, j’ai oublié de me coucher tôt
    - Aujourd’hui, je me suis couché tard
    - J’essaie de me coucher tard
    accepted_answers:
    - value: À partir d’aujourd’hui, je ne me couche plus tard
      status: correct
    feedback: '*از امروز* signifie « à partir d’aujourd’hui » et *دیگر ... نمی‌خوابم* signifie « je ne dors plus », donc *دیر* veut dire « tard ».'
  prs.a2.unit33.lesson06.exercise04.order_forgot_sleep:
    instruction: 'Remets les mots dans l’ordre pour dire : J’ai oublié de me coucher tôt.'
    accepted_answers:
    - value:
      - فراموش
      - کردم
      - که
      - زود
      - بخوابم
      status: correct
    feedback: '*فراموش کردم که زود بخوابم.* *فراموش کردم* vient en premier et le subjonctif *بخوابم* en dernier.'
