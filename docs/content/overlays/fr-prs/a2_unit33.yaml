course:
  title: Dari en français A2
  description: 'Dari afghan, niveau pré-intermédiaire : dire ce que tu as commencé, arrêté, essayé de faire ou oublié de faire. Commencer avec le complément et را, avec به et l’infinitif ou avec که et le subjonctif ; abandonner une habitude avec ترک کردن et دیگر ; essayer et oublier avec که et le subjonctif.'
units:
  prs.a2.unit33.starting_stopping_trying:
    title: Commencer, arrêter, essayer
lessons:
  prs.a2.unit33.lesson01.starting:
    title: 'Commencer quelque chose : « J’ai commencé à courir »'
  prs.a2.unit33.lesson02.that_i_run:
    title: '« Que je coure » : commencer et essayer avec که'
  prs.a2.unit33.lesson03.stopping:
    title: 'Arrêter : ترک کردن et « ne… plus »'
  prs.a2.unit33.lesson04.forgetting:
    title: Oublier de faire quelque chose
  prs.a2.unit33.lesson05.reading_and_listening:
    title: Lire et écouter à propos des habitudes
  prs.a2.unit33.lesson06.gym_conversation:
    title: Une conversation à la salle de sport
teaching:
  prs.a2.unit33.lesson01.teach.gym:
    title: La salle de sport
    gloss: salle de sport, club de sport
    note: '*باشگاه* est une salle de sport ou un club de sport. On y va avec *به* : *به باشگاه می‌روم* signifie « je vais à la salle de sport ».'
    example_gloss: La salle de sport est près de la maison.
  prs.a2.unit33.lesson01.teach.run:
    title: Courir
    gloss: courir
    note: '*دویدن* signifie courir. Son radical du présent est *دو*, donc *می‌دوم* signifie « je cours ». Comme tout infinitif, *دویدن* se termine par *-ن*, et tu utiliseras cette forme en *-ن* après *به* dans cette leçon.'
    example_gloss: Je cours tous les matins.
  prs.a2.unit33.lesson01.teach.exercise:
    title: Faire du sport
    gloss: faire du sport
    note: '*ورزش کردن* signifie faire du sport. C’est un verbe en deux mots : *ورزش* reste devant et seul *کردن* change, comme dans *ورزش می‌کنم* (je fais du sport) et *ورزش کردم* (j’ai fait du sport).'
    example_gloss: Je fais du sport tous les jours.
  prs.a2.unit33.lesson01.teach.half_hour:
    title: Une demi-heure
    gloss: une demi-heure
    note: '*نیم ساعت* signifie une demi-heure. *نیم* signifie demi et se place avant le nom, comme dans *نیم ساعت* et *نیم ساعت ورزش*.'
    example_gloss: Tous les matins, je fais du sport une demi-heure.
  prs.a2.unit33.lesson01.teach.habit:
    title: Habitude
    gloss: habitude
    note: '*عادت* signifie habitude. Toute cette unité parle d’habitudes : en commencer une bonne, arrêter une mauvaise, essayer de la garder, et l’oublier.'
    example_gloss: Le sport est une bonne habitude.
  prs.a2.unit33.lesson01.teach.start_noun:
    title: 'Commencer quelque chose : la chose + را + شروع کردن'
    gloss: J’ai commencé le sport. Tu as commencé à courir. Il ou elle a commencé le travail.
    note: 'Pour dire que tu as commencé quelque chose, place la chose avant *را*, puis utilise *شروع کردن* (commencer) : *ورزش را شروع کردم* signifie « j’ai commencé le sport ». C’est un verbe composé de deux mots, comme *ورزش کردن* : seul *کردن* change : *شروع کردم، شروع کردی، شروع کرد، شروع کردیم، شروع کردین، شروع کردند*. Ce que tu commences peut être un nom (*کار*, le travail) ou un infinitif (*دویدن*, courir). Le pronom est facultatif, car la terminaison indique déjà la personne.'
  prs.a2.unit33.lesson01.teach.month_ago:
    title: J’ai commencé le sport il y a un mois
    gloss: J’ai commencé le sport il y a un mois.
    note: '*پیش* placé après un mot de temps signifie « il y a » : *یک ماه پیش* signifie « il y a un mois » et *دو هفته پیش* « il y a deux semaines ». Le mot de temps se place généralement au début de la phrase.'
  prs.a2.unit33.lesson01.teach.start_to:
    title: 'Commencer à faire quelque chose : به + infinitif + شروع کردن'
    gloss: J’ai commencé à courir. Tu as commencé à faire du sport. Il ou elle a commencé à lire.
    note: 'Pour dire que tu as commencé à faire une action, place *به* et l’infinitif (le verbe en *-ن*) avant *شروع کردن* : *به دویدن شروع کردم* signifie « j’ai commencé à courir ». Un verbe composé garde ses deux mots à l’infinitif : *به ورزش کردن شروع کردم* signifie « j’ai commencé à faire du sport ». Tu entendras aussi l’ordre *شروع کردم به دویدن*, qui a le même sens. Compare les deux structures : *ورزش را شروع کردم* nomme une chose que tu as commencée, et *به ورزش کردن شروع کردم* nomme l’action.'
  prs.a2.unit33.lesson01.teach.read_start:
    title: Il ou elle a commencé à lire des livres il y a deux semaines
    gloss: Il ou elle a commencé à lire des livres il y a deux semaines.
    note: '*خواندن* signifie « lire » (et « étudier »). L’infinitif *خواندن* vient après *به*, et son complément *کتاب* peut le suivre : *به خواندن کتاب شروع کرد*.'
  prs.a2.unit33.lesson02.teach.sleep:
    title: Dormir, aller se coucher
    gloss: dormir, aller se coucher
    note: '*خوابیدن* signifie « dormir » ou « aller se coucher ». Son radical du présent est *خواب* : *می‌خوابم* signifie « je dors ». *شب‌ها* signifie « la nuit » ou « le soir », comme mot de temps.'
    example_gloss: Le soir, je me couche tôt.
  prs.a2.unit33.lesson02.teach.try:
    title: Essayer
    gloss: essayer, faire un effort
    note: '*کوشش* signifie « effort » et *کوشش کردن* « essayer ». C’est un verbe composé de deux mots : *کوشش می‌کنم* signifie « j’essaie » et *کوشش کردم* « j’ai essayé ». Ce que tu essaies de faire vient après *که*, au subjonctif.'
    example_gloss: J’essaie de me réveiller tôt.
  prs.a2.unit33.lesson02.teach.subjunctive:
    title: 'Le subjonctif : ب + radical du présent + terminaison'
    gloss: que je coure, que je dorme, que je lise, que je mange, que j’aille, que je voie ; que je fasse du sport, que je me réveille
    note: 'Le subjonctif est la forme du verbe qu’on emploie pour ce qu’on commence, essaie ou oublie de faire. Tu le connais déjà avec *باید*, comme dans *باید بروم*. Pour le former, prends le radical du présent, place *ب-* devant et ajoute les terminaisons *-م، -ی، -د، -یم، -ین، -ند*. Pour *دویدن* (radical *دو*) : *بدوم، بدوی، بدود، بدویم، بدوین، بدوند*. Autres verbes : *خوابیدن* donne *بخوابم*, *خواندن* donne *بخوانم*, *خوردن* donne *بخورم*, *رفتن* donne *بروم*, *دیدن* donne *ببینم*. Un verbe composé n’a pas de *ب-* : le premier mot reste et seul *کردن* ou *شدن* change, d’où *ورزش کنم* (que je fasse du sport) et *بیدار شوم* (que je me réveille).'
  prs.a2.unit33.lesson02.teach.che_pattern:
    title: شروع کردن et کوشش کردن avec که
    gloss: J’ai commencé à courir. J’essaie de me coucher tôt. J’ai essayé de faire du sport.
    note: 'Après *شروع کردن* et *کوشش کردن*, on ajoute *که* et un verbe au subjonctif. *شروع کردم که بدوم* a le même sens que *به دویدن شروع کردم* : j’ai commencé à courir. *کوشش می‌کنم که زود بخوابم* signifie « j’essaie de me coucher tôt ». Le sujet reste normalement le même, donc la terminaison du subjonctif indique la même personne que le verbe principal : *کوشش کردم که بروم*, *کوشش کردی که بروی*, *کوشش کرد که برود*. Le temps du premier verbe donne le moment (j’ai essayé, j’essaie) ; le subjonctif n’a pas de temps propre.'
  prs.a2.unit33.lesson02.teach.negative_subj:
    title: 'Le subjonctif négatif : ن à la place de ب'
    gloss: J’essaie de ne pas manger de sucreries. J’essaie de ne pas me coucher tard.
    note: 'Pour dire « essayer de ne pas », mets *ن-* à la place de *ب-* : *بخورم* devient *نخورم* (que je ne mange pas), *بخوابم* devient *نخوابم*, *بروم* devient *نروم*. N’écris pas *نبخورم*. Un verbe composé met *ن-* sur sa partie verbale : *ورزش نکنم* (que je ne fasse pas de sport).'
  prs.a2.unit33.lesson02.teach.he_tried:
    title: Il ou elle a essayé de se réveiller tôt
    gloss: Il ou elle a essayé de se réveiller tôt.
    note: 'La terminaison du subjonctif indique le sujet : *شود* correspond à « il ou elle », donc *او کوشش کرد که زود بیدار شود* signifie « il ou elle a essayé de se réveiller tôt ».'
  prs.a2.unit33.lesson02.teach.we_started:
    title: Nous avons commencé à faire du sport tous les jours
    gloss: Nous avons commencé à faire du sport tous les jours.
    note: 'La terminaison *-یم* correspond à « nous » dans les deux verbes : *شروع کردیم* et *ورزش کنیم*.'
  prs.a2.unit33.lesson03.teach.quit:
    title: Renoncer à, arrêter
    gloss: renoncer à, arrêter
    note: '*ترک کردن* signifie « renoncer à » ou « arrêter » une habitude. C’est un verbe composé de deux mots : *ترک کردم* signifie « j’ai arrêté » et *ترک می‌کنم* « j’arrête ».'
    example_gloss: Il ou elle a arrêté de manger des sucreries.
  prs.a2.unit33.lesson03.teach.sweets:
    title: Sucreries
    gloss: sucreries, gâteaux, friandises
    note: '*شیرینی* désigne les sucreries et les gâteaux. C’est un bon exemple d’habitude à laquelle on essaie de renoncer.'
    example_gloss: J’aime les sucreries.
  prs.a2.unit33.lesson03.teach.for_hours:
    title: Pendant des heures
    gloss: pendant des heures
    note: '*ساعت‌ها* est le pluriel de *ساعت* et signifie « pendant des heures, longtemps ». On l’emploie pour parler du temps d’écran : *ساعت‌ها ویدیو دیدم* signifie « j’ai regardé des vidéos pendant des heures ».'
    example_gloss: Il ou elle regarde des vidéos pendant des heures.
  prs.a2.unit33.lesson03.teach.sometimes:
    title: Parfois
    gloss: parfois
    note: '*گاهی* signifie « parfois ». Il se place au début de la phrase ou avant le verbe, et c’est le contraire de *همیشه* (toujours) et *هرگز* (jamais).'
    example_gloss: Parfois, je regarde des vidéos.
  prs.a2.unit33.lesson03.teach.quit_pattern:
    title: 'Renoncer à une habitude : l’habitude + را + ترک کردن'
    gloss: J’ai arrêté de manger des sucreries. Tu as arrêté de te coucher tard. Il ou elle a arrêté de regarder des vidéos.
    note: 'Pour dire que tu as renoncé à une habitude, place l’habitude avant *را*, puis utilise *ترک کردن*. L’habitude est une locution à l’infinitif : *شیرینی خوردن* (manger des sucreries), *دیر خوابیدن* (se coucher tard), *ویدیو دیدن* (regarder des vidéos). C’est la même structure que *ورزش را شروع کردم* : la chose, *را*, puis le verbe. Tu peux aussi dire *عادت بد را ترک کردم* (j’ai abandonné une mauvaise habitude).'
  prs.a2.unit33.lesson03.teach.no_longer:
    title: 'Ne plus : دیگر + verbe négatif'
    gloss: Je ne mange plus de sucreries. Je ne regarde plus de vidéos. Je ne me couche plus tard.
    note: '*دیگر* avec un verbe négatif signifie « ne plus » : *دیگر شیرینی نمی‌خورم* signifie « je ne mange plus de sucreries ». Cela décrit la situation actuelle, après avoir renoncé à quelque chose. Pour un récit au passé, on peut employer *دیگر* avec le passé simple négatif : *از آن روز دیگر شیرینی نخوردم* signifie « à partir de ce jour, je n’ai plus mangé de sucreries ». Au présent, *ترک کردم* dit que tu as pris la décision et *دیگر نمی‌خورم* en dit le résultat.'
  prs.a2.unit33.lesson03.teach.from_today:
    title: À partir d’aujourd’hui, je ne me couche plus tard
    gloss: À partir d’aujourd’hui, je ne me couche plus tard.
    note: '*از امروز* signifie « à partir d’aujourd’hui ». Avec *دیگر* et un verbe négatif, cela annonce une nouvelle habitude.'
  prs.a2.unit33.lesson03.teach.bad_habit:
    title: J’ai abandonné une mauvaise habitude
    gloss: J’ai abandonné une mauvaise habitude.
    note: '*عادت بد* signifie « mauvaise habitude ». L’adjectif *بد* se place après le nom.'
  prs.a2.unit33.lesson03.teach.less_phone:
    title: Le soir, j’utilise moins le téléphone
    gloss: Le soir, j’utilise moins le téléphone.
    note: '*کمتر* signifie « moins ». Réduire le temps d’écran est une autre façon de mettre fin à une habitude : on n’arrête pas, on en fait moins.'
  prs.a2.unit33.lesson04.teach.forget:
    title: Oublier
    gloss: oublier
    note: '*فراموش کردن* signifie « oublier ». C’est un verbe composé de deux mots : *فراموش کردم* signifie « j’ai oublié » et *فراموش نکردم* « je n’ai pas oublié ».'
    example_gloss: Excusez-moi, j’ai oublié.
  prs.a2.unit33.lesson04.teach.why_not_come:
    title: Pourquoi n’es-tu pas venu hier ?
    gloss: Pourquoi n’es-tu pas venu hier ?
    note: '*نیامدی* est le passé simple négatif de *آمدن* pour un ami : tu n’es pas venu. *چرا* sert à demander « pourquoi ».'
  prs.a2.unit33.lesson04.teach.forget_pattern:
    title: 'Oublier de faire quelque chose : فراموش کردن که + subjonctif'
    gloss: J’ai oublié de téléphoner. J’ai oublié d’apporter mon livre. J’ai oublié de me coucher tôt.
    note: 'Pour dire que tu as oublié de faire quelque chose, utilise *فراموش کردن* avec *که* et un verbe au subjonctif : *فراموش کردم که تیلفون کنم* signifie « j’ai oublié de téléphoner », donc l’appel n’a pas eu lieu. C’est le même subjonctif que dans les leçons précédentes, et le sujet reste normalement le même. *فراموش کردم* est au passé : tu parles d’un moment déjà révolu ; le subjonctif après *که* n’a pas de temps propre.'
  prs.a2.unit33.lesson04.teach.not_forget:
    title: 'Je n’ai pas oublié de : فراموش نکردم که'
    gloss: Je n’ai pas oublié de téléphoner. Je n’ai pas oublié d’apporter mon livre.
    note: '*فراموش نکردم* met la négation sur *کردم* : je n’ai pas oublié. Ensuite, la chose a été faite : *فراموش نکردم که کتابم را بیاورم* signifie « je n’ai pas oublié d’apporter mon livre », donc je l’ai apporté. Compare avec *فراموش کردم که کتابم را بیاورم* (j’ai oublié d’apporter mon livre, donc je ne l’ai pas apporté).'
  prs.a2.unit33.lesson04.teach.four_verbs:
    title: Quatre verbes, quatre structures
    gloss: J’ai commencé. J’ai arrêté. J’ai essayé. J’ai oublié.
    note: 'Ces quatre verbes se terminent tous par *کردن*, donc les terminaisons de personne sont toujours les mêmes (*کردم، کردی، کرد، کردیم، کردین، کردند*). Ce qui suit diffère. *شروع کردن* : la chose et *را*, ou *به* plus l’infinitif, ou *که* plus le subjonctif. *ترک کردن* : l’habitude et *را*. *کوشش کردن* : *که* plus le subjonctif. *فراموش کردن* : *که* plus le subjonctif. Pour dire que tu ne fais plus quelque chose, utilise *دیگر* et un verbe négatif au présent.'
  prs.a2.unit33.lesson04.teach.sorry_forgot_sleep:
    title: J’ai oublié de me coucher tôt
    gloss: J’ai oublié de me coucher tôt.
    note: C’est le genre de phrase qu’on dit quand quelque chose s’est mal passé parce qu’on n’a pas tenu une habitude.
  prs.a2.unit33.lesson05.teach.read_book:
    title: Lire un livre
    gloss: lire un livre
    note: '*کتاب خواندن* signifie « lire un livre ». Le présent est *کتاب می‌خوانم* (je lis un livre) ; *خواندن* signifie aussi « étudier ».'
    example_gloss: Chaque soir, je lis un livre pendant une demi-heure.
  prs.a2.unit33.lesson05.teach.two_weeks:
    title: J’ai commencé à lire des livres il y a deux semaines
    gloss: J’ai commencé à lire des livres il y a deux semaines.
    note: 'La structure est celle de la première leçon : un mot de temps avec *پیش*, puis *به* plus l’infinitif, puis *شروع کردم*.'
  prs.a2.unit33.lesson05.teach.dlg_turn01:
    title: Najiba demande à Yasin quand il a commencé
    gloss: Yasin, quand as-tu commencé le sport ?
    note: '*ورزش را کی شروع کردی؟* suit la structure chose plus *را* plus *شروع کردی*. *کی* demande « quand ». Les interlocuteurs sont amis, donc ils emploient *تو*.'
  prs.a2.unit33.lesson05.teach.dlg_turn02:
    title: Yasin dit quand et combien de temps
    gloss: Il y a un mois. Maintenant, je cours chaque matin une demi-heure à la salle de sport.
    note: '*یک ماه پیش* est le point de départ. *حالا هر صبح نیم ساعت در باشگاه می‌دوم* est l’habitude qu’il a maintenant.'
  prs.a2.unit33.lesson05.teach.dlg_turn03:
    title: Najiba pose une question sur les sucreries
    gloss: Très bien ! Tu manges aussi des sucreries ?
    note: '*خیلی خوب* est une réaction amicale. *شیرینی هم می‌خوری؟* demande s’il mange aussi des sucreries.'
  prs.a2.unit33.lesson05.teach.dlg_turn04:
    title: Yasin dit qu’il a arrêté les sucreries
    gloss: Non, j’ai arrêté de manger des sucreries. Je n’en mange plus.
    note: '*شیرینی خوردن را ترک کردم* nomme la décision et *دیگر شیرینی نمی‌خورم* en nomme le résultat.'
  prs.a2.unit33.lesson05.teach.dlg_turn05:
    title: Najiba pose une question sur les vidéos
    gloss: Tu regardes des vidéos le soir ?
    note: '*شب‌ها* est un mot de temps qui signifie « le soir, la nuit », et *می‌بینی* signifie « tu vois » ou « tu regardes ».'
  prs.a2.unit33.lesson05.teach.dlg_turn06:
    title: Yasin dit qu’il essaie d’en regarder moins
    gloss: Oui, mais j’essaie d’en regarder moins.
    note: '*کوشش می‌کنم که کمتر ببینم* emploie *کوشش کردن* avec le subjonctif *ببینم*. Il n’a pas renoncé aux vidéos : il essaie.'
  prs.a2.unit33.lesson05.teach.khalida_message:
    title: Un message sur de nouvelles habitudes
    gloss: Bonjour Najiba. Il y a deux semaines, j’ai commencé à lire des livres. Chaque soir, je lis une demi-heure. J’ai arrêté de regarder des vidéos, donc le soir, je n’en regarde plus. J’essaie de me coucher tôt. Hier, j’ai oublié de te téléphoner. Khalida
    note: 'Un court message écrit qui emploie les quatre structures : commencer (*به خواندن کتاب شروع کردم*), arrêter (*ویدیو دیدن را ترک کردم*), essayer (*کوشش می‌کنم که زود بخوابم*) et oublier (*فراموش کردم که تیلفون کنم*). L’auteure est une autre personne que Yasin.'
  prs.a2.unit33.lesson06.teach.late_wake:
    title: Je me suis réveillé tard le matin
    gloss: Je me suis réveillé tard le matin.
    note: '*بیدار شدن* signifie « se réveiller ». *دیر* signifie « tard » et *زود* « tôt » : *صبح زود بیدار شدم* signifie « je me suis réveillé tôt le matin ».'
  prs.a2.unit33.lesson06.teach.every_night:
    title: J’essaie de me coucher tôt chaque soir
    gloss: J’essaie de me coucher tôt chaque soir.
    note: '*هر شب* signifie « chaque soir ». Un mot de temps comme *هر شب* peut se placer avant ou après *زود* ; ici, il vient après *که*.'
  prs.a2.unit33.lesson06.teach.dlg_turn01:
    title: Yasin demande à Najiba pourquoi elle n’est pas venue
    gloss: Najiba, pourquoi n’es-tu pas venue hier à la salle de sport ?
    note: '*چرا* demande pourquoi et *نیامدی* veut dire « tu n’es pas venu(e) ». *به باشگاه* veut dire « à la salle de sport ».'
  prs.a2.unit33.lesson06.teach.dlg_turn02:
    title: Najiba dit ce qu’elle a oublié
    gloss: J’ai oublié de me coucher tôt, alors je me suis réveillée tard ce matin.
    note: '*فراموش کردم که زود بخوابم* donne la raison, avec le subjonctif *بخوابم*. *پس* (alors) introduit le résultat : *صبح دیر بیدار شدم*.'
  prs.a2.unit33.lesson06.teach.dlg_turn03:
    title: Yasin demande ce qu’il en est d’aujourd’hui
    gloss: Tu viens aujourd’hui ?
    note: '*می‌آیی* veut dire « tu viens » ou « tu es en train de venir », en s’adressant à un ami. En dari, le présent simple accompagné d’un mot de temps peut aussi renvoyer au futur proche.'
  prs.a2.unit33.lesson06.teach.dlg_turn04:
    title: Najiba dit qu’elle vient et ce qu’elle essaie de faire
    gloss: Oui, je viens aujourd’hui à six heures. J’essaie de me coucher tôt chaque soir.
    note: '*امروز ساعت شش می‌آیم* est le présent simple avec un mot de temps. *کوشش می‌کنم که هر شب زود بخوابم* est la nouvelle habitude qu’elle veut garder.'
  prs.a2.unit33.lesson06.teach.dlg_turn05:
    title: Yasin réagit
    gloss: Très bien !
    note: '*خیلی خوب* est une courte réaction amicale.'
