course:
  title: Dari en français A2
  description: 'Dari afghan niveau pré-intermédiaire : faire une réclamation en magasin — un radiateur électrique défectueux, expliquer le problème, lire la politique de retour d’un magasin et la conversation au comptoir des retours.'
units:
  prs.a2.unit18.shopping_complaint:
    title: Réclamation en magasin
lessons:
  prs.a2.unit18.lesson01.complaint_vocabulary:
    title: Les mots pour une réclamation en magasin
  prs.a2.unit18.lesson02.explaining_the_problem:
    title: Expliquer le problème
  prs.a2.unit18.lesson03.reading_a_return_policy:
    title: Lire une politique de retour
  prs.a2.unit18.lesson04.return_counter_dialogue:
    title: Au comptoir des retours
teaching:
  prs.a2.unit18.lesson01.teach.broken_word:
    title: Cassé
    gloss: cassé
    note: '*خراب* décrit tout objet défectueux ou qui ne fonctionne pas.'
    example_gloss: Ce radiateur est cassé.
  prs.a2.unit18.lesson01.teach.exchange_word:
    title: Change
    gloss: changer (de l’argent)
    note: '*تعویض کردن* -- *تعویض* signifie « échange », associé à *کردن* (« faire »).'
    example_gloss: Je veux échanger le radiateur.
  prs.a2.unit18.lesson01.teach.refund_word:
    title: Remboursement
    gloss: remboursement
    note: '*بازپرداخت* est le mot formel pour un remboursement.'
    example_gloss: Je veux un remboursement.
  prs.a2.unit18.lesson01.teach.receipt_word:
    title: Reçu
    gloss: ticket de caisse
    note: '*رسید* est le mot déjà utilisé pour un reçu de loyer dans les unités précédentes ; ici, il désigne un ticket de caisse.'
    example_gloss: J’ai le ticket de caisse avec moi.
  prs.a2.unit18.lesson01.teach.warranty_word:
    title: Garantie
    gloss: garantie
    note: '*گارانتی* est un mot emprunté tel quel, que l’on emploie comme le français « garantie ».'
    example_gloss: Ce radiateur a un an de garantie.
  prs.a2.unit18.lesson01.teach.defect_word:
    title: Défaut
    gloss: défaut
    note: '*عیب* désigne un défaut ou une panne dans un objet.'
    example_gloss: Ce radiateur a un défaut.
  prs.a2.unit18.lesson01.teach.when_grammar:
    title: Quand, avec وقتی
    gloss: Quand je l’allume, il ne chauffe pas.
    note: '*وقتی* introduit une proposition de temps -- proche de *اگر* (si) de l’unité 11, mais pour énoncer un fait et non une hypothèse.'
  prs.a2.unit18.lesson01.teach.heater_word:
    title: Radiateur électrique
    gloss: radiateur électrique
    note: '*بخاری برقی* -- *بخاری* signifie « radiateur » et *برقی* signifie « électrique ».'
    example_gloss: J’ai acheté un radiateur électrique pour ma nouvelle maison.
  prs.a2.unit18.lesson01.teach.va_word:
    title: Et
    gloss: et
    note: '*و* est le mot courant qui sert à relier des propositions dans cette unité.'
    target_text: و (et)
  prs.a2.unit18.lesson02.teach.state_item_broken:
    title: Dire qu’un article acheté est cassé
    gloss: Ce radiateur que j’ai acheté hier est cassé.
    note: '*که دیروز خریدم* -- « que j’ai acheté hier » -- une proposition relative qui précise de quel article il s’agit.'
  prs.a2.unit18.lesson02.teach.request_exchange_or_refund:
    title: Demander un échange ou un remboursement
    gloss: Je veux l’échanger ou me faire rembourser.
    note: '*یا* signifie « ou » et propose un choix au commerçant.'
  prs.a2.unit18.lesson02.teach.prefer_question:
    title: Demander ce que préfère le client
    gloss: Lequel préférez-vous ?
    note: '*ترجیح دادن* signifie « préférer » -- c’est l’étape de grammaire de niveau A2 de cette unité pour choisir entre deux options proposées.'
  prs.a2.unit18.lesson03.teach.deadline_word:
    title: Délai
    gloss: délai
    note: '*مهلت* désigne le délai limite dans lequel quelque chose doit être fait.'
    example_gloss: Le délai d’échange est de sept jours.
  prs.a2.unit18.lesson03.teach.original_word:
    title: Original
    gloss: original
    note: '*اصلی* signifie « original », comme dans « le reçu original », et non une copie.'
    example_gloss: Apportez le reçu original, s’il vous plaît.
  prs.a2.unit18.lesson03.teach.policy_text:
    title: Un avis de magasin sur les retours
    gloss: Si un article acheté est défectueux, vous pouvez l’échanger ou vous le faire rembourser dans un délai de sept jours, sur présentation du reçu original.
    note: Un court avis officiel de magasin, rédigé dans le registre écrit formel que cette unité enseigne.
  prs.a2.unit18.lesson04.teach.turn01:
    title: Le commerçant accueille کریم
    gloss: Le commerçant lui demande en quoi il peut l’aider.
    note: Une formule d’accueil formelle, comme celle de l’employé de bureau de l’unité 9 (*بفرمایین، چه خدمتی...*), ici avec *کمکی* (« aide ») à la place de *خدمتی* (« service »).
  prs.a2.unit18.lesson04.teach.turn02:
    title: کریم expose le problème
    gloss: کریم dit que le radiateur qu’il a acheté hier est en panne.
    note: Reprend exactement la phrase de la leçon 2.
  prs.a2.unit18.lesson04.teach.turn03:
    title: Le commerçant demande quel est le problème
    gloss: Le commerçant demande quel est le problème.
    note: '*چه مشکلی دارد؟* signifie littéralement « quel problème a-t-il ? »'
  prs.a2.unit18.lesson04.teach.turn04:
    title: کریم explique le défaut
    gloss: Quand il l’allume, il ne chauffe pas.
    note: '*روشنش می‌کنم* (« je l’allume ») : le suffixe d’objet *-ش* s’ajoute à *روشن*.'
  prs.a2.unit18.lesson04.teach.turn05:
    title: Le commerçant demande le reçu
    gloss: Le commerçant lui demande s’il a le reçu sur lui.
    note: '*همراه‌تان* (« avec vous ») : le suffixe possessif formel *-تان*.'
  prs.a2.unit18.lesson04.teach.turn06:
    title: کریم confirme qu’il l’a
    gloss: Oui, voici son reçu.
    note: '*اینه* est un « voici » familier qu’on emploie en tendant quelque chose ; il a déjà été vu à l’unité 11.'
  prs.a2.unit18.lesson04.teach.turn07:
    title: Le commerçant propose un choix
    gloss: Le commerçant peut l’échanger ou le rembourser. Que préfère-t-il ?
    note: Reprend la question *ترجیح می‌دهین؟* de la leçon 2.
  prs.a2.unit18.lesson04.teach.turn08:
    title: کریم choisit l’échange
    gloss: کریم dit qu’il préfère l’échange, et remercie.
    note: '*بهتر است* signifie « est mieux ».'
