course:
  title: Dari A1
  description: 'Dari de Kaboul pour débutants : nommer des traits de caractère de base, demander comment est quelqu’un, donner des raisons simples avec « parce que » et décrire le caractère d’une personne dans un court texte.'
units:
  prs.a1.unit37.personality:
    title: Le caractère
    description: Décris les traits de caractère de base d’une personne et demande comment est quelqu’un.
lessons:
  prs.a1.unit37.lesson01.personality_words:
    title: Mots du caractère
  prs.a1.unit37.lesson02.more_traits:
    title: D’autres traits
  prs.a1.unit37.lesson03.asking_about_personality:
    title: Demander comment est quelqu’un
  prs.a1.unit37.lesson04.personality_dialogue:
    title: Dialogue sur le caractère
  prs.a1.unit37.lesson05.personality_reading:
    title: Lecture sur le caractère
  prs.a1.unit37.lesson06.wrap_up:
    title: Récapitulatif
teaching:
  prs.a1.unit37.lesson01.teach.mehraban_word:
    title: Sympathique
    gloss: sympathique
    note: مهربان est le mot dari courant pour une personne gentille, au cœur chaleureux.
    example_gloss: Il/elle est gentil(le).
  prs.a1.unit37.lesson01.teach.zahmatkash_word:
    title: Travailleur
    gloss: travailleur
    note: 'زحمتکش signifie littéralement « celui qui prend de la peine » : une personne travailleuse.'
    example_gloss: Il/elle est travailleur(se).
  prs.a1.unit37.lesson01.teach.bahosh_word:
    title: Intelligent
    gloss: intelligent
    note: 'باهوش associe با (avec) et هوش (intelligence) : une personne intelligente, vive d’esprit.'
    example_gloss: Il/elle est intelligent(e).
  prs.a1.unit37.lesson01.teach.tambal_word:
    title: Paresseux
    gloss: paresseux
    note: تنبل signifie paresseux.
    example_gloss: Il/elle est paresseux(se).
  prs.a1.unit37.lesson01.teach.review_basics:
    title: 'Révision : il/elle, est, et, mais'
    gloss: il/elle / est / et / mais
    note: او, است, و et اما sont des formes déjà vues, utilisées dans les phrases sur le caractère de cette unité.
    target_text: او (il/elle) / است (est) / و (et) / اما (mais)
  prs.a1.unit37.lesson01.teach.kind_and_hardworking_phrase:
    title: Il/elle est gentil(le) et travailleur(se)
    gloss: Il/elle est gentil(le) et travailleur(se).
    note: و relie les deux traits en une seule phrase.
  prs.a1.unit37.lesson01.teach.smart_but_lazy_phrase:
    title: Il/elle est intelligent(e), mais paresseux(se)
    gloss: Il/elle est intelligent(e), mais paresseux(se).
    note: اما oppose deux traits dans une même phrase.
  prs.a1.unit37.lesson02.teach.shokh_word:
    title: Drôle
    gloss: drôle / blagueur
    note: شوخ décrit quelqu’un qui plaisante volontiers ou qui est espiègle.
    example_gloss: Il/elle est drôle.
  prs.a1.unit37.lesson02.teach.kamharf_word:
    title: Discret
    gloss: discret / réservé
    note: 'کم‌حرف signifie littéralement « peu de mots » : une personne discrète, réservée.'
    example_gloss: Il/elle est discret(ète).
  prs.a1.unit37.lesson02.teach.rastgoo_word:
    title: Honnête
    gloss: honnête
    note: 'راستگو associe راست (vrai, droit) et گو (qui dit) : une personne sincère, honnête.'
    example_gloss: Il/elle est honnête.
  prs.a1.unit37.lesson02.teach.review_and_but:
    title: 'Révision : et, mais'
    gloss: et / mais
    note: و et اما sont des mots déjà vus, servant à additionner ou à opposer des traits.
    target_text: و (et) / اما (mais)
  prs.a1.unit37.lesson02.teach.funny_and_honest_phrase:
    title: Il/elle est drôle et honnête
    gloss: Il/elle est drôle et honnête.
    note: Associe deux qualités avec و.
  prs.a1.unit37.lesson02.teach.quiet_but_kind_phrase:
    title: Il/elle est discret(ète), mais gentil(le)
    gloss: Il/elle est discret(ète), mais gentil(le).
    note: اما oppose un trait réservé à un trait chaleureux.
  prs.a1.unit37.lesson03.teach.person_word:
    title: Personne
    gloss: personne
    note: آدم est un mot courant, valable pour un homme comme pour une femme, qui désigne une personne ou un être humain.
    example_gloss: C’est une bonne personne.
  prs.a1.unit37.lesson03.teach.review_how_because:
    title: 'Révision : comment / quel genre, parce que, aide'
    gloss: comment, quel genre / parce que / aide
    note: چطور, چون et کمک sont des formes de révision qui servent à demander et à expliquer comment est quelqu’un.
    target_text: چطور (comment, de quel genre) / چون (parce que) / کمک (aide)
  prs.a1.unit37.lesson03.teach.what_kind_person_question:
    title: Quel genre de personne est-il/elle ?
    gloss: Quel genre de personne est-il/elle ?
    note: 'او چطور آدم است؟ signifie littéralement « il/elle est quel genre (de) personne ? » : c’est la façon naturelle de demander comment est quelqu’un.'
  prs.a1.unit37.lesson03.teach.kind_because_helps_phrase:
    title: Il/elle est gentil(le), parce qu’il/elle aide
    gloss: Il/elle est gentil(le), parce qu’il/elle aide.
    note: چون introduit la raison ; کمک می‌کند signifie littéralement « fait aide ».
  prs.a1.unit37.lesson03.teach.hardworking_because_works_phrase:
    title: Il/elle est travailleur(se), parce qu’il/elle travaille beaucoup
    gloss: Il/elle est travailleur(se), parce qu’il/elle travaille beaucoup.
    note: زیاد کار می‌کند signifie littéralement « fait beaucoup (de) travail ».
  prs.a1.unit37.lesson04.teach.review_dialogue_words:
    title: Oui / un peu / toujours
    gloss: oui / un peu / toujours
    note: بلی, کمی et همیشه sont des mots de révision utilisés dans le dialogue sur la personnalité.
    target_text: بلی (oui) / کمی (un peu) / همیشه (toujours)
  prs.a1.unit37.lesson04.teach.dialogue_line1:
    title: 'Homayoun : Zarmina, comment est Karim ?'
    gloss: Zarmina, comment est Karim ?
  prs.a1.unit37.lesson04.teach.dialogue_line2:
    title: 'Zarmina : Karim est gentil et travailleur.'
    gloss: Karim est gentil et travailleur.
  prs.a1.unit37.lesson04.teach.dialogue_line3:
    title: 'Homayoun : Est-il intelligent ?'
    gloss: Est-il intelligent ?
  prs.a1.unit37.lesson04.teach.dialogue_line4:
    title: 'Zarmina : Oui, il est intelligent, mais un peu réservé.'
    gloss: Oui, il est intelligent, mais un peu réservé.
  prs.a1.unit37.lesson04.teach.dialogue_line5:
    title: 'Homayoun : Est-il honnête ?'
    gloss: Est-il honnête ?
  prs.a1.unit37.lesson04.teach.dialogue_line6:
    title: 'Zarmina : Oui, il est toujours honnête.'
    gloss: Oui, il est toujours honnête.
  prs.a1.unit37.lesson05.teach.review_reading_words:
    title: Parfois, tout le monde, marque de l’objet, ils/elles aiment
    gloss: parfois / tout le monde / marque de l’objet / ils/elles aiment
    note: گاهی (parfois) et همه (tout le monde) sont utilisés dans le texte ; را marque un complément d’objet direct défini ; دوست دارند est la forme de la troisième personne du pluriel de دوست دارم (j’aime).
    target_text: گاهی (parfois) / همه (tout le monde) / را (marque de l’objet) / دوست دارند (ils/elles aiment)
  prs.a1.unit37.lesson05.teach.reading_passage:
    title: Texte sur la personnalité de Homayoun
    gloss: Homayoun est gentil et travailleur. Il est intelligent, mais parfois réservé. Il est toujours honnête. Tout le monde l’aime.
  prs.a1.unit37.lesson06.teach.review_i_am_you_are:
    title: 'Révision : je suis, vous êtes'
    gloss: je suis / vous êtes (forme de politesse)
    note: استم et استین sont les formes de révision de la copule pour « je suis » et « vous êtes » (politesse), utilisées dans les phrases de cette leçon de synthèse.
    target_text: استم (je suis) / استین (vous êtes, formel)
  prs.a1.unit37.lesson06.teach.self_description_phrase:
    title: Je suis gentil(le), mais parfois paresseux(se)
    gloss: Je suis gentil(le), mais parfois paresseux(se).
    note: من (je) et استم (je suis) te permettent de décrire directement ta propre personnalité, sur le même modèle او/است que dans toute l’unité.
  prs.a1.unit37.lesson06.teach.formal_question_phrase:
    title: Quel genre de personne êtes-vous ?
    gloss: Quel genre de personne êtes-vous ?
    note: Ajoute شما (vous, politesse) et استین (vous êtes, politesse) à la même question que dans la leçon 3, adressée maintenant directement à l’apprenant.
