  prs.a1.unit30.lesson06.wrap_up:
    title: Récapitulatif
teaching:
  prs.a1.unit30.lesson01.teach.tech_word:
    title: La technologie
    gloss: technologie
    note: تکنالوژی signifie technologie -- c’est l’orthographe afghane standard, différente de l’orthographe iranienne تکنولوژی.
    example_gloss: La technologie, c’est bien.
  prs.a1.unit30.lesson01.teach.mobile_word:
    title: Le téléphone portable
    gloss: téléphone portable
    note: موبایل signifie téléphone portable, à distinguer du mot plus général تلفن (téléphone, révision de l’unité 7).
    example_gloss: J’ai un téléphone portable.
  prs.a1.unit30.lesson01.teach.computer_word:
    title: L’ordinateur
    gloss: ordinateur
    note: کمپیوتر signifie ordinateur ; c’est un emprunt courant au persan et au dari.
    example_gloss: L’ordinateur est au bureau.
  prs.a1.unit30.lesson01.teach.internet_word:
    title: Internet
    gloss: internet
    note: انترنت signifie internet ; c’est un emprunt courant au persan et au dari.
    example_gloss: Internet est lent.
  prs.a1.unit30.lesson01.teach.app_word:
    title: L’application
    gloss: application
    note: اپلیکیشن signifie application ; c’est un emprunt courant au persan et au dari.
    example_gloss: Cette application est bien.
  prs.a1.unit30.lesson01.teach.photo_word:
    title: La photo
    gloss: photo
    note: عکس signifie photo ou image.
    example_gloss: Cette photo est bien.
  prs.a1.unit30.lesson01.teach.review_estefade_kardan:
    title: Utiliser
    gloss: utilisation + faire → j’utilise
    note: استفاده (utilisation) se combine avec کردن (faire, révision) pour former استفاده می‌کنم (j’utilise) -- le même type de verbe composé déjà vu dans ce cours, par exemple بازی می‌کنم (unité 29) et ورزش می‌کنم (unité 29).
    target_text: استفاده (utilisation) + کردن (faire) = استفاده می‌کنم (j’utilise)
  prs.a1.unit30.lesson01.teach.combined_sentence:
    title: J’utilise internet
    gloss: J’utilise internet.
    note: Combine من (je, révision), از (de/avec, révision), انترنت et استفاده می‌کنم.
  prs.a1.unit30.lesson02.teach.review_peyam:
    title: Message
    gloss: message
    note: پیام signifie message.
    target_text: پیام (message)
  prs.a1.unit30.lesson02.teach.mifrestam_phrase:
    title: J’envoie un message
    gloss: J’envoie un message
    note: می‌فرستم signifie « j’envoie » -- un nouveau verbe, différent du verbe de l’unité 7 بگذارم (laisser un message).
  prs.a1.unit30.lesson02.teach.review_zang_mizanam:
    title: J’appelle
    gloss: j’appelle
    note: زنگ می‌زنم signifie « j’appelle ».
    target_text: زنگ می‌زنم (j’appelle)
  prs.a1.unit30.lesson02.teach.akas_migiram_phrase:
    title: Je prends une photo
    gloss: je prends une photo
    note: عکس می‌گیرم reprend می‌گیرم (je prends/je reçois, révision de l’unité 23) avec عکس.
  prs.a1.unit30.lesson02.teach.download_word:
    title: Télécharger
    gloss: télécharger
    note: دانلود est l’emprunt dari standard pour « télécharger » ; il se combine avec کردن (faire, révision) comme verbe composé, par exemple دانلود می‌کنم (je télécharge).
    example_gloss: Je télécharge une application.
  prs.a1.unit30.lesson02.teach.want_download_app_phrase:
    title: Je veux télécharger une application
    gloss: Je veux télécharger une appli
    note: Suit le même schéma می‌خواهم + subjonctif que می‌خواهم یک پیام بگذارم de l’unité 7 (je veux laisser un message).
  prs.a1.unit30.lesson03.teach.review_chand_bar:
    title: Combien / fois
    gloss: combien / fois (occurrence)
    note: چند بار sert ici à poser une question sur la fréquence.
    target_text: چند (combien) / بار (fois)
  prs.a1.unit30.lesson03.teach.review_ruz:
    title: Jour
    gloss: jour
    note: روز signifie « jour ».
    target_text: روز (jour)
  prs.a1.unit30.lesson03.teach.review_mikonin:
    title: Tu utilises / vous utilisez (formel)
    gloss: vous utilisez (forme de politesse)
    note: استفاده می‌کنین est la forme de politesse « vous utilisez », sur le modèle de ورزش می‌کنین de l’unité 29.
    target_text: استفاده می‌کنین (vous utilisez, formel)
  prs.a1.unit30.lesson03.teach.question_frequency:
    title: Combien de fois par jour utilisez-vous votre téléphone portable ?
    gloss: Combien de fois par jour utilisez-vous votre téléphone portable ?
    note: Associe چند بار (combien de fois), در روز (par jour), از موبایل (avec le téléphone portable) et استفاده می‌کنین.
  prs.a1.unit30.lesson03.teach.answer_har_ruz:
    title: J’utilise Internet tous les jours
    gloss: J’utilise Internet tous les jours.
    note: هر روز s’associe à از انترنت استفاده می‌کنم.
  prs.a1.unit30.lesson04.teach.review_mikonad:
    title: Il/elle utilise
    gloss: il/elle utilise
    note: استفاده می‌کند est la forme de la 3e personne, sur le modèle de می‌کند revu dans l’unité 29.
    target_text: استفاده می‌کند (il/elle utilise, 3e personne)
  prs.a1.unit30.lesson04.teach.review_to_miokni:
    title: Toi / tu utilises (informel)
    gloss: tu (informel) / tu utilises (informel)
    note: تو et می‌کنی appartiennent au registre informel employé entre Homayoun et Zarmina.
    target_text: تو (tu, informel) / می‌کنی (tu utilises, informel)
  prs.a1.unit30.lesson04.teach.review_koja:
    title: Où
    gloss: où
    note: کجا signifie « où ».
    target_text: کجا (où)
  prs.a1.unit30.lesson04.teach.dialogue_line1:
    title: 'Homayoun : Zarmina, combien de fois par jour utilises-tu ton téléphone portable ?'
    gloss: Zarmina, combien de fois par jour utilises-tu ton téléphone portable ?
  prs.a1.unit30.lesson04.teach.dialogue_line2:
    title: 'Zarmina : J’utilise beaucoup mon téléphone portable. Je prends des photos et j’envoie des messages.'
    gloss: J’utilise beaucoup mon téléphone portable. Je prends des photos et j’envoie des messages.
  prs.a1.unit30.lesson04.teach.dialogue_line3:
    title: 'Homayoun : Est-ce que tu utilises un ordinateur ?'
    gloss: Est-ce que tu utilises un ordinateur ?
  prs.a1.unit30.lesson04.teach.dialogue_line4:
    title: 'Zarmina : Oui, j’utilise un ordinateur au bureau.'
    gloss: Oui, j’utilise un ordinateur au bureau.
  prs.a1.unit30.lesson04.teach.dialogue_line5:
    title: 'Homayoun : J’utilise Internet tous les jours.'
    gloss: J’utilise Internet tous les jours.
  prs.a1.unit30.lesson04.teach.dialogue_line6:
    title: 'Zarmina : Super !'
    gloss: Super !
  prs.a1.unit30.lesson05.teach.reading_passage:
    title: Lecture sur la technologie
    gloss: Zarmina utilise son téléphone portable tous les jours. Elle prend des photos et envoie des messages. Elle utilise un ordinateur au bureau. Homayoun utilise Internet tous les jours.
  prs.a1.unit30.lesson06.teach.review_ama:
    title: Mais
    gloss: mais
    note: اما signifie « mais ».
    target_text: اما (mais)
  prs.a1.unit30.lesson06.teach.review_like_have_time:
    title: J’aime / temps / je n’ai pas
    gloss: j’aime / temps / je n’ai pas
    note: دوست دارم (j’aime), وقت (temps) et ندارم (je n’ai pas) sont des révisions des unités 11, 14, 26 et 29.
    target_text: دوست دارم (j’aime) / وقت (temps) / ندارم (je n’ai pas)
  prs.a1.unit30.lesson06.teach.wrap_summary:
    title: J’aime la technologie, mais je n’ai pas le temps
    gloss: J’aime la technologie, mais je n’ai pas le temps.
    note: Associe تکنالوژی را دوست دارم (j’aime la technologie, construction déjà vue) et اما وقت ندارم (mais je n’ai pas le temps).
