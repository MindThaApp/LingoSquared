course:
  title: Dari A1
  description: 'Dari de Kaboul pour débutants : vocabulaire de la technologie et des appareils (téléphone portable, ordinateur, internet, application, photo), expressions d’actions au téléphone (envoyer un message, appeler, prendre une photo, télécharger une application), demander et dire combien de fois par jour on utilise son téléphone portable, et dialogue entre Zarmina et Homayoun sur l’usage du téléphone, de l’ordinateur et d’internet.'
units:
  prs.a1.unit30.technology:
    title: La technologie
    description: Parle de téléphones, d’ordinateurs, d’internet et d’applications -- et de la fréquence à laquelle tu les utilises.
lessons:
  prs.a1.unit30.lesson01.device_vocabulary:
    title: Les mots de la technologie
  prs.a1.unit30.lesson02.phone_actions:
    title: Actions au téléphone
  prs.a1.unit30.lesson03.frequency_question:
    title: Combien de fois par jour ?
  prs.a1.unit30.lesson04.tech_dialogue:
    title: Dialogue sur la technologie
  prs.a1.unit30.lesson05.reading_technology:
