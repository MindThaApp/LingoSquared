teaching:
  prs.a2.unit16.lesson01.teach.social_media_word:
    title: Réseau social
    gloss: réseau social
    note: '*شبکهٔ اجتماعی* signifie littéralement « réseau social ».'
    example_gloss: Zarmina consulte les réseaux sociaux tous les jours.
  prs.a2.unit16.lesson01.teach.video_word:
    title: Vidéo
    gloss: vidéo
    note: '*ویدیو* est un emprunt direct, prononcé presque comme en français.'
    example_gloss: Homayoun aime regarder des vidéos.
  prs.a2.unit16.lesson01.teach.download_word:
    title: Télécharger
    gloss: télécharger
    note: '*دانلود کردن* — *دانلود* est un emprunt, associé à *کردن* (« faire »).'
    example_gloss: Je télécharge de la musique.
  prs.a2.unit16.lesson01.teach.messaging_app_word:
    title: Application de messagerie
    gloss: application de messagerie
    note: '*پیام‌رسان* signifie littéralement « porteur de messages ».'
    example_gloss: J’envoie des messages à mes amis avec une application de messagerie.
  prs.a2.unit16.lesson01.teach.computer_game_word:
    title: Jeu vidéo
    gloss: jeu vidéo
    note: '*بازی کمپیوتری* — *بازی* signifie « jeu » et *کمپیوتری* signifie « d’ordinateur ».'
    example_gloss: Homayoun joue aux jeux vidéo.
  prs.a2.unit16.lesson01.teach.free_time_word:
    title: Le temps libre
    gloss: temps libre
    note: '*وقت آزاد* — *وقت* signifie « temps » et *آزاد* signifie « libre ».'
    example_gloss: Pendant mon temps libre, je consulte les réseaux sociaux.
  prs.a2.unit16.lesson01.teach.usually_grammar:
    title: « D’habitude », avec معمولاً
    gloss: D’habitude, pendant mon temps libre, je consulte les réseaux sociaux.
    note: '*معمولاً* (« d’habitude ») est le premier adverbe de fréquence de niveau A2 de cette unité.'
  prs.a2.unit16.lesson01.teach.sometimes_grammar:
    title: « Parfois », avec بعضی اوقات
    gloss: Parfois, cela prend trop de temps.
    note: '*بعضی اوقات* (« parfois ») est le deuxième adverbe de fréquence de cette unité, en contraste avec *معمولاً*.'
  prs.a2.unit16.lesson01.teach.va_word:
    title: Et
    gloss: et
    note: '*و* est le mot de liaison courant utilisé pour relier des propositions dans cette unité.'
    target_text: و (et)
  prs.a2.unit16.lesson01.teach.every_day_grammar:
    title: « Tous les jours », avec هر روز
    gloss: Je consulte les réseaux sociaux tous les jours.
    note: '*هر روز* signifie « tous les jours » — *روز* seul signifie « jour ».'
  prs.a2.unit16.lesson02.teach.ask_how_much_time:
    title: Demander combien de temps quelqu’un passe en ligne
    gloss: Combien de temps passes-tu sur les réseaux sociaux ?
    note: '*تو* est le « tu » familier employé entre amis, à la différence du *شما* et des terminaisons en -*ین* de politesse employés ailleurs dans ce cours avec des inconnus.'
  prs.a2.unit16.lesson02.teach.opinion_phrase:
    title: Donner un avis simple
    gloss: À mon avis, internet est utile, mais parfois cela prend trop de temps.
    note: Reprend la formule *به نظر من* (« à mon avis ») déjà vue dans l’unité 10 pour donner son avis.
  prs.a2.unit16.lesson02.teach.limit_use_phrase:
    title: Dire qu’il faut limiter son usage
    gloss: Nous devrions limiter notre temps.
    note: '*محدود کردن* signifie « limiter ».'
  prs.a2.unit16.lesson02.teach.mostly_word:
    title: Mostly
    gloss: surtout
    note: '*بیشتر* signifie ici « surtout » ou « plus ».'
    target_text: بیشتر (surtout)
  prs.a2.unit16.lesson03.teach.user_word:
    title: Utilisateur
    gloss: utilisateur
    note: '*کاربر* est le mot général pour désigner l’utilisateur d’une application, d’un appareil ou d’un service.'
    example_gloss: Beaucoup d’utilisateurs se servent de leur téléphone tous les jours.
  prs.a2.unit16.lesson03.teach.limit_word:
    title: Limiter
    gloss: limiter
    note: '*محدود کردن* — la même expression que dans la leçon 2, employée ici dans une remarque générale sur les gens plutôt qu’avec « nous ».'
    example_gloss: Certaines personnes limitent leur temps.
  prs.a2.unit16.lesson03.teach.article_text:
    title: Un court article sur le temps d’écran
    gloss: Beaucoup de gens utilisent les réseaux sociaux plusieurs heures par jour. Certaines personnes limitent leur temps pour en avoir davantage pour leur famille et leurs amis.
    note: Un court texte informatif, dans le registre de lecture que cette unité enseigne.
  prs.a2.unit16.lesson04.teach.turn01:
    title: همایون demande à زرمینه combien de temps elle passe en ligne
    gloss: همایون demande à زرمینه combien de temps elle passe sur les réseaux sociaux.
    note: Reprend exactement la question de la leçon 2, avec le registre familier en *تو* déjà établi pour ce duo d’amis.
  prs.a2.unit16.lesson04.teach.turn02:
    title: زرمینه répond et pose la question en retour
    gloss: D’habitude une heure par jour. Et toi ?
    note: '*چطور* signifie ici « et toi ? ».'
  prs.a2.unit16.lesson04.teach.turn03:
    title: همایون décrit sa propre habitude
    gloss: Il regarde surtout des vidéos. Peut-être deux heures par jour.
    note: '*بیشتر* signifie ici « surtout ».'
  prs.a2.unit16.lesson04.teach.turn04:
    title: زرمینه donne son avis
    gloss: À son avis, c’est trop.
    note: Reprend la formule *به نظر من* de la leçon 2 pour donner son avis.
  prs.a2.unit16.lesson04.teach.turn05:
    title: همایون est d’accord mais dit qu’il aime ça
    gloss: Peut-être, mais il y prend plaisir.
    note: '*لذت می‌برم* signifie « j’y prends plaisir ».'
  prs.a2.unit16.lesson04.teach.turn06:
    title: زرمینه suggère de limiter l’usage
    gloss: Elle dit que parfois nous devrions limiter notre temps.
    note: Reprend exactement *محدود کنیم* de la leçon 2.
  prs.a2.unit16.lesson04.teach.turn07:
    title: همایون accepte d’en faire moins
    gloss: C’est vrai. Dès demain, il en fera moins.
    note: '*کمتر* signifie « moins ».'
  prs.a2.unit16.lesson04.teach.turn08:
    title: زرمینه approuve
    gloss: زرمینه dit que c’est génial.
    note: '*عالی است!* est une façon courante de dire « c’est génial ! »'
