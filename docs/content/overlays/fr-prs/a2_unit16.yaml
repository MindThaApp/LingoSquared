course:
  title: Dari en français A2
  description: 'Dari afghan niveau pré-intermédiaire : parler de ses habitudes en ligne — vocabulaire des réseaux sociaux et du temps d’écran, donner un avis simple, lire un texte sur le temps d’écran et suivre une vraie conversation entre deux amis sur leurs habitudes.'
units:
  prs.a2.unit16.online_habits:
    title: Habitudes en ligne
lessons:
  prs.a2.unit16.lesson01.online_habits_vocabulary:
    title: Les mots des habitudes en ligne
  prs.a2.unit16.lesson02.describing_and_giving_an_opinion:
    title: Décrire et donner son avis
  prs.a2.unit16.lesson03.reading_about_screen_time:
    title: Lire un texte sur le temps d’écran
  prs.a2.unit16.lesson04.friends_dialogue:
