course:
  title: Dari A1
  description: 'Dari afghan pour débutants : compter de un à cent, demander et dire l’âge, et échanger des numéros de téléphone.'
units:
  prs.a1.unit04.numbers:
    title: Compter et les nombres
lessons:
  prs.a1.unit04.lesson01.numbers_one_to_ten:
    title: Compter de un à dix
  prs.a1.unit04.lesson02.numbers_eleven_to_twenty:
    title: Compter de onze à vingt
  prs.a1.unit04.lesson03.tens:
    title: Les dizaines jusqu’à cent
  prs.a1.unit04.lesson04.asking_age:
    title: Demander et dire l’âge
  prs.a1.unit04.lesson05.phone_numbers:
