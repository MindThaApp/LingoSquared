teaching:
  prs.a1.unit04.lesson01.teach.one_to_three:
    title: Un, deux, trois
    gloss: 1, 2, 3
    note: یک، دو، سه sont les chiffres de base du persan, communs au dari et au farsi.
    example_gloss:
    - J’ai un frère.
    - J’ai deux livres.
    - J’ai trois sœurs.
  prs.a1.unit04.lesson01.teach.four_to_six:
    title: Quatre, cinq, six
    gloss: 4, 5, 6
    note: چهار est la forme écrite standard ; à l’oral familier, certains la raccourcissent en چار, mais ce cours utilise l’orthographe standard.
    example_gloss:
    - J’ai quatre livres.
    - Attends cinq minutes.
    - Il/Elle a six livres.
  prs.a1.unit04.lesson01.teach.seven_eight:
    title: Sept, huit
    gloss: 7, 8
    note: هفت، هشت poursuivent la suite.
    example_gloss:
    - Il y a sept jours dans une semaine.
    - Je viendrai à huit heures.
  prs.a1.unit04.lesson01.teach.nine_ten:
    title: Neuf, dix
    gloss: 9, 10
    note: نه، ده complètent les nombres de un à dix.
    example_gloss:
    - Il y a neuf personnes dans la classe.
    - J’ai dix doigts.
  prs.a1.unit04.lesson02.teach.eleven_thirteen:
    title: Onze, douze, treize
    gloss: 11, 12, 13
    note: یازده، دوازده، سیزده sont des mots à part entière, et non de simples composés des unités.
    example_gloss:
    - J’ai cours à onze heures.
    - Il y a douze mois dans une année.
    - Il/Elle a treize ans.
  prs.a1.unit04.lesson02.teach.fourteen_sixteen:
    title: Quatorze, quinze, seize
    gloss: 14, 15, 16
    note: چهارده، پانزده، شانزده poursuivent les nombres de la dizaine.
    example_gloss:
    - Je viendrai dans quatorze jours.
    - Il/Elle a quinze livres.
    - Il/Elle a seize ans.
  prs.a1.unit04.lesson02.teach.seventeen_nineteen:
    title: Dix-sept, dix-huit, dix-neuf
    gloss: 17, 18, 19
    note: هفده، هجده، نوزده complètent les nombres de la dizaine.
    example_gloss:
    - Il/Elle a dix-sept livres.
    - Il/Elle a dix-huit ans.
    - Il reste dix-neuf jours.
  prs.a1.unit04.lesson02.teach.twenty:
    title: Vingt
    gloss: '20'
    note: بیست ouvre la série des dizaines, qui sera traitée en détail dans la leçon suivante.
    example_gloss: J’ai vingt livres.
  prs.a1.unit04.lesson03.teach.twenty_thirty_forty:
    title: Vingt, trente, quarante
    gloss: 20, 30, 40
    note: بیست، سی، چهل sont des mots de dizaines, chacun ayant sa propre forme, sans régularité prévisible.
    example_gloss:
    - J’ai vingt ans.
    - Ce mois compte trente jours.
    - Il/Elle a quarante ans.
  prs.a1.unit04.lesson03.teach.fifty_sixty:
    title: Cinquante, soixante
    gloss: 50, 60
    note: پنجاه، شصت poursuivent les dizaines.
    example_gloss:
    - Il/Elle a cinquante livres.
    - Soixante minutes font une heure.
  prs.a1.unit04.lesson03.teach.seventy_eighty:
    title: Soixante-dix, quatre-vingts
    gloss: 70, 80
    note: هفتاد، هشتاد poursuivent les dizaines.
    example_gloss:
    - Ce livre a soixante-dix pages.
    - Il/Elle a quatre-vingts livres.
  prs.a1.unit04.lesson03.teach.ninety_hundred:
    title: Quatre-vingt-dix, cent
    gloss: 90, 100
    note: نود، صد complètent la suite jusqu’à cent.
    example_gloss:
    - Il/Elle a quatre-vingt-dix ans.
    - Il/Elle a cent livres.
  prs.a1.unit04.lesson03.teach.combining_tens:
    title: Combiner dizaines et unités
    gloss: 25 se dit littéralement « vingt et cinq ».
    note: Un mot de dizaine et un mot d’unité se relient par و (et), le même connecteur que l’on retrouve ailleurs dans ce cours, par exemple بیست و پنج (25).
  prs.a1.unit04.lesson04.teach.chand:
    title: Combien
    gloss: combien
    note: چند introduit une question sur une quantité, y compris l’âge.
    example_gloss: Quel âge avez-vous ?
  prs.a1.unit04.lesson04.teach.sal_word:
    title: L'année
    gloss: an, année
    note: سال s’emploie pour dire l’âge, littéralement « années ».
    example_gloss: J’ai vingt ans.
  prs.a1.unit04.lesson04.teach.age_question_polite:
    title: Demander poliment l’âge de quelqu’un
    gloss: Quel âge as-tu ?
    note: چند ساله استین؟ demande littéralement « combien d’années avez-vous ? » ; la forme de politesse استین s’emploie avec une personne que tu ne connais pas bien.
  prs.a1.unit04.lesson04.teach.age_question_informal:
    title: Demander l’âge d’un ami proche
    gloss: Quel âge as-tu ?
    note: چند ساله استی؟ utilise la forme familière استی ; réserve-la à un ami proche ou à une personne de ton âge, selon la même règle de registre que ailleurs dans ce cours.
  prs.a1.unit04.lesson04.teach.age_answer:
    title: Dire son âge
    gloss: J’ai 25 ans.
    note: بیست و پنج ساله استم associe le nombre, ساله (« ans ») et استم.
  prs.a1.unit04.lesson05.teach.number_word:
    title: Numéro
    gloss: numéro
    note: نمبر est un mot afghan très courant au quotidien (venu du persan et de l’anglais) pour dire « numéro », surtout un numéro de téléphone.
    example_gloss: Voici mon numéro de téléphone.
  prs.a1.unit04.lesson05.teach.telephone_word:
    title: Téléphone
    gloss: téléphone
    note: تلفن est le mot standard pour « téléphone ».
    example_gloss: Mon téléphone est en panne.
  prs.a1.unit04.lesson05.teach.phone_question:
    title: Demander un numéro de téléphone
    gloss: Quel est ton numéro de téléphone ?
    note: نمبر تلفن‌تان چند است؟ reprend le même schéma avec چند que la question sur l’âge, appliqué à un numéro de téléphone.
  prs.a1.unit04.lesson05.teach.zero_word:
    title: Zéro
    gloss: zéro
    note: صفر sert à énoncer la plupart des numéros de téléphone afghans.
    example_gloss: Zéro est un nombre.
  prs.a1.unit04.lesson05.teach.phone_answer:
    title: Donner ton numéro de téléphone
    gloss: Mon numéro de téléphone est le 079-345-678.
    note: En Afghanistan, on énonce généralement les numéros de téléphone par petits groupes de chiffres plutôt que chiffre par chiffre, comme dans cet exemple.
  prs.a1.unit04.lesson06.teach.turn01:
    title: Homayoun salue Bashir
    gloss: Homayoun demande à Bashir comment il va, sur un ton familier adapté à un ami proche.
    note: 'جور استی؟ montre que les deux hommes sont déjà proches : le registre familier convient donc dans tout ce dialogue.'
  prs.a1.unit04.lesson06.teach.turn02:
    title: Bashir répond et demande l’âge d’Homayoun
    gloss: Bashir dit qu’il va bien et demande quel âge a Homayoun.
    note: چند ساله استی؟ emploie le registre familier, en accord avec leur amitié.
  prs.a1.unit04.lesson06.teach.turn03:
    title: Homayoun répond et renvoie la question
    gloss: Homayoun dit qu’il a 28 ans et pose la même question à Bashir.
    note: On réutilise directement le schéma de réponse sur l’âge vu dans la leçon 4.
  prs.a1.unit04.lesson06.teach.turn04:
    title: Bashir répond
    gloss: Bashir dit qu’il a 26 ans.
    note: Cela termine l’échange sur l’âge.
  prs.a1.unit04.lesson06.teach.turn05:
    title: Homayoun demande le numéro de téléphone de Bashir
    gloss: Homayoun demande son numéro de téléphone à Bashir.
    note: تلفنت utilise la terminaison possessive familière, comme dans le reste de ce dialogue.
  prs.a1.unit04.lesson06.teach.turn06:
    title: Bashir donne son numéro de téléphone
    gloss: Bashir énonce son numéro de téléphone par groupes de chiffres.
    note: Le numéro est énoncé par groupes, de façon naturelle, comme dans l’exemple de la leçon 5.
  prs.a1.unit04.lesson06.teach.turn07:
    title: Homayoun confirme qu’il l’a enregistré
    gloss: Homayoun le remercie et dit qu’il l’enregistre tout de suite.
    note: سیف می‌کنم (de l’anglais « save ») est un emprunt informatique familier courant en Afghanistan, qui convient à cet échange décontracté entre amis.
