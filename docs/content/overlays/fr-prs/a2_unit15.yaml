course:
  title: Dari en français A2
  description: 'Dari afghan de niveau pré-intermédiaire : gérer une perturbation de voyage — un bus interurbain annulé, demander des solutions de remplacement, lire un avis en gare et dialoguer avec le personnel de la gare.'
units:
  prs.a2.unit15.travel_disruption:
    title: Perturbations de voyage
lessons:
  prs.a2.unit15.lesson01.disruption_vocabulary:
    title: Mots pour les perturbations de voyage
  prs.a2.unit15.lesson02.asking_about_alternatives:
    title: Demander des alternatives
  prs.a2.unit15.lesson03.reading_a_station_notice:
    title: Lire un avis en gare
  prs.a2.unit15.lesson04.station_dialogue:
    title: À la gare routière
teaching:
  prs.a2.unit15.lesson01.teach.delay_word:
    title: Retard
    gloss: retard
    note: '*تأخیر* est un retard en général : un bus, une réunion, tout ce qui est en retard.'
    example_gloss: Le bus d’aujourd’hui a une heure de retard.
  prs.a2.unit15.lesson01.teach.cancellation_word:
    title: Annulation
    gloss: annulation
    note: '*لغو* s’emploie avec *شدن* (*لغو شده*, « a été annulé »).'
    example_gloss: Le bus de 9 heures a été annulé.
  prs.a2.unit15.lesson01.teach.closed_word:
    title: Fermé
    gloss: fermé
    note: '*بسته* se dit d’une route, d’un magasin ou d’un bureau qui n’est pas ouvert.'
    example_gloss: La route Kaboul–Mazar-e Charif est fermée.
  prs.a2.unit15.lesson01.teach.alternative_route_word:
    title: Itinéraire alternatif
    gloss: itinéraire alternatif
    note: '*مسیر بدیل* -- *مسیر* signifie « itinéraire » et *بدیل* signifie « alternatif ».'
    example_gloss: Il n’y a pas d’itinéraire alternatif.
  prs.a2.unit15.lesson01.teach.snowfall_word:
    title: Chute de neige
    gloss: chute de neige
    note: '*برفباری* -- *برف* (neige) plus le suffixe qui en fait une « chute de neige ».'
    example_gloss: À cause de la chute de neige, la route est fermée.
  prs.a2.unit15.lesson01.teach.notice_word:
    title: Annonce / avis
    gloss: annonce
    note: '*اطلاعیه* est un avis affiché, comme ceux que l’on voit sur le mur d’une gare.'
    example_gloss: J’ai lu l’annonce de la gare.
  prs.a2.unit15.lesson01.teach.due_to_grammar:
    title: À cause de, avec به دلیل
    gloss: À cause des chutes de neige, le bus a été annulé.
    note: '*به دلیل* + nom indique une cause. C’est la nouvelle étape de grammaire de niveau A2 de cette unité : un connecteur de cause qui s’ajoute à *چون* (parce que) de l’unité 10, lequel introduit une proposition complète.'
  prs.a2.unit15.lesson01.teach.wait_phrase:
    title: Dire que vous devez attendre
    gloss: Vous devez attendre jusqu’à demain matin.
    note: '*باید ... صبر کنین* -- « vous devez attendre » -- la terminaison verbale du pluriel de politesse, employée avec une personne inconnue.'
  prs.a2.unit15.lesson01.teach.va_word:
    title: Et
    gloss: et
    note: '*و* est le mot de liaison courant qui sert à relier les propositions dans cette unité.'
    target_text: و (et)
  prs.a2.unit15.lesson01.teach.first_person_wait:
    title: Je dois attendre aussi
    gloss: Moi aussi, je dois attendre.
    note: '*من هم باید صبر کنم* présente le subjonctif de la première personne *کنم* (« je fais »), employé seul après *باید* -- « il faut » -- sans *می‌*.'
  prs.a2.unit15.lesson02.teach.ask_next_bus:
    title: Demander quand part le prochain bus
    gloss: Quand part le prochain bus ?
    note: '*بعدی* signifie « prochain ».'
  prs.a2.unit15.lesson02.teach.ask_alternative_route:
    title: Demander s’il existe un itinéraire de remplacement
    gloss: Y a-t-il un autre itinéraire ?
    note: '*وجود دارد؟* -- « est-ce que cela existe ? » -- une façon courante de demander si quelque chose est disponible.'
  prs.a2.unit15.lesson02.teach.tomorrow_departure:
    title: Indiquer l’heure de départ de demain
    gloss: Le bus part demain à 8 heures du matin.
    note: Reprend le schéma avec *ساعت* (heure) déjà vu.
  prs.a2.unit15.lesson03.teach.station_word:
    title: Gare
    gloss: gare
    note: '*ایستگاه* s’emploie pour une gare routière comme pour une gare ferroviaire.'
    example_gloss: Homayoun est allé à la gare routière.
  prs.a2.unit15.lesson03.teach.passengers_word:
    title: Les passagers
    gloss: passagers
    note: '*مسافران* est le pluriel de *مسافر* (passager / voyageur).'
    example_gloss: Les passagers doivent attendre.
  prs.a2.unit15.lesson03.teach.notice_text:
    title: Un avis de la gare sur le bus annulé
    gloss: Le bus de 9 heures pour Mazar-e Charif d’aujourd’hui a été annulé à cause des chutes de neige. La route Kaboul-Mazar-e Charif est fermée. Les passagers doivent attendre jusqu’à demain matin. Le prochain bus part demain à 8 heures du matin.
    note: Un court avis officiel de gare, dans le registre écrit soutenu que cette unité enseigne.
  prs.a2.unit15.lesson04.teach.turn01:
    title: Le personnel de la gare accueille همایون
    gloss: Le personnel de la gare lui demande en quoi il peut l’aider.
    note: Une salutation formelle comme celle de l’employé de bureau de l’unité 9 (*بفرمایین، چه خدمتی...*), ici avec *کمکی* (« aide ») à la place de *خدمتی* (« service »).
  prs.a2.unit15.lesson04.teach.turn02:
    title: همایون demande pour le bus de 9 heures
    gloss: همایون demande quand part le bus de 9 heures pour Mazar-e Charif.
    note: Reprend le schéma de question *کی ... می‌کند؟* vu dans la leçon 2.
  prs.a2.unit15.lesson04.teach.turn03:
    title: Le personnel de la gare explique l’annulation
    gloss: Le personnel de la gare s’excuse et dit que ce bus a été annulé à cause des chutes de neige.
    note: '*متأسفم* signifie « je suis désolé ».'
  prs.a2.unit15.lesson04.teach.turn04:
    title: همایون demande s’il y a une autre solution
    gloss: همایون demande s’il existe un autre itinéraire.
    note: Reprend exactement la question de la leçon 2.
  prs.a2.unit15.lesson04.teach.turn05:
    title: Le personnel de la gare répond et indique l’attente
    gloss: Non, la route est fermée. Vous devez attendre jusqu’à demain matin.
    note: '*نخیر* est un « non » plus formel, qui s’oppose à *بلی* comme dans les autres textes du cours.'
  prs.a2.unit15.lesson04.teach.turn06:
    title: همایون demande pour le bus de demain
    gloss: همایون demande à quelle heure part le bus de demain.
    note: '*چند* signifie ici « quelle (heure) ».'
  prs.a2.unit15.lesson04.teach.turn07:
    title: Le personnel de la gare donne l’heure
    gloss: Le bus de demain part à 8 heures du matin.
    note: Reprend exactement l’information de la leçon 2, puisqu’il s’agit du même détail.
  prs.a2.unit15.lesson04.teach.turn08:
    title: همایون remercie le personnel
    gloss: همایون les remercie pour les renseignements.
    note: '*معلومات‌تان* -- « vos renseignements » -- reçoit le suffixe possessif de politesse *-تان*.'
