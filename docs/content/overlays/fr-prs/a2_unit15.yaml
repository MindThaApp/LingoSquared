      - دلیل
      - برفباری
      - بسته
      - است
      status: correct
    feedback: '*راه به دلیل برفباری بسته است* indique la fermeture et sa cause.'
  prs.a2.unit15.lesson01.exercise05.write_cancellation:
    instruction: Écris en dari le mot qui signifie « annulation ».
    accepted_answers:
    - value: لغو
      status: correct
    feedback: '*لغو* signifie « annulation ».'
  prs.a2.unit15.lesson02.exercise01.recognize_ask_next_bus:
    instruction: Quelle question demande quand part le prochain bus ?
    correct_option: Quand part le prochain bus ?
    distractors:
    - Y a-t-il un autre itinéraire ?
    - Le bus part demain à 8 heures du matin.
    - Vous devez attendre jusqu’à demain matin.
    accepted_answers:
    - value: Quand part le prochain bus ?
      status: correct
    feedback: '*بس بعدی کی حرکت می‌کند؟* demande quand part le prochain bus.'
  prs.a2.unit15.lesson02.exercise02.order_tomorrow_departure:
    instruction: Remets les mots dans l’ordre pour dire que le bus part demain à 8 heures du matin.
    accepted_answers:
    - value:
      - بس
      - فردا
      - ساعت
      - هشت
      - صبح
      - حرکت
      - می‌کند
      status: correct
    feedback: '*بس فردا ساعت هشت صبح حرکت می‌کند.* indique l’heure de départ de demain.'
  prs.a2.unit15.lesson02.exercise03.dialogue_response_ask_alternative:
    instruction: 'L’employé dit : « Le bus a été annulé à cause des chutes de neige. » Demande s’il y a un autre itinéraire.'
    accepted_answers:
    - value: مسیر بدیل وجود دارد؟
      status: correct
    - value: مسیر بدیل وجود دارد
      status: correct
    feedback: '*مسیر بدیل وجود دارد؟* demande s’il existe un autre itinéraire.'
  prs.a2.unit15.lesson02.exercise04.translate_ask_next_bus:
    instruction: 'Traduis : À quelle heure part le prochain bus ?'
    accepted_answers:
    - value: بس بعدی کی حرکت می‌کند؟
      status: correct
    - value: بس بعدی کی حرکت می‌کند
      status: correct
    - value: بس بعدی چه وقت حرکت می‌کند
      status: correct
    feedback: '*بس بعدی کی حرکت می‌کند؟* demande quand part le prochain bus.'
  prs.a2.unit15.lesson02.exercise05.write_alternative_route:
    instruction: Écris en dari pour demander s’il y a un autre itinéraire.
    accepted_answers:
    - value: مسیر بدیل وجود دارد؟
      status: correct
    - value: مسیر بدیل وجود دارد
      status: correct
    feedback: '*مسیر بدیل وجود دارد؟* demande s’il existe un autre itinéraire.'
  prs.a2.unit15.lesson03.exercise01.read_cancellation_reason:
    instruction: Selon l’avis, pourquoi le bus de 9 heures a-t-il été annulé ?
    correct_option: chute de neige
    distractors:
    - une panne du bus
    - un manque de chauffeurs
    - aucune raison donnée
    accepted_answers:
    - value: chute de neige
      status: correct
    feedback: L’avis dit que le bus a été annulé *به دلیل برفباری* -- à cause des chutes de neige.
  prs.a2.unit15.lesson03.exercise02.read_next_departure:
    instruction: Selon l’avis, quand part le prochain bus ?
    correct_option: demain à 8 heures du matin
    distractors:
    - plus tard aujourd’hui
    - demain à midi
    - après-demain
    accepted_answers:
    - value: demain à 8 heures du matin
      status: correct
    feedback: '*بس بعدی فردا ساعت هشت صبح حرکت می‌کند* -- demain à 8 heures du matin.'
  prs.a2.unit15.lesson03.exercise03.recognize_station_word:
    instruction: Que signifie ce mot ?
    correct_option: gare
    distractors:
    - passagers
    - route
    - avis
    accepted_answers:
    - value: gare
      status: correct
    feedback: '*ایستگاه* signifie « gare » ou « station ».'
  prs.a2.unit15.lesson03.exercise04.order_passengers_wait:
    instruction: Remets les mots dans l’ordre pour dire que les passagers doivent attendre jusqu’à demain matin.
    accepted_answers:
    - value:
      - مسافران
      - باید
      - تا
      - فردا
      - صبح
      - صبر
      - کنند
      status: correct
    feedback: '*مسافران باید تا فردا صبح صبر کنند* reprend exactement l’avis : *کنند* est la terminaison de « ils », qui s’accorde avec *مسافران* (passagers).'
  prs.a2.unit15.lesson03.exercise05.write_road_closed:
    instruction: Écris en dari que la route Kaboul-Mazar-e Charif est fermée.
    accepted_answers:
    - value: راه کابل-مزار شریف بسته است.
      status: correct
    - value: راه کابل-مزار شریف بسته است
      status: correct
    - value: راه کابل مزار شریف بسته است
      status: correct
    - value: راه کابل - مزار شریف بسته است
      status: correct
    feedback: '*راه کابل-مزار شریف بسته است* dit que la route est fermée.'
  prs.a2.unit15.lesson04.exercise01.comprehend_cancellation_reason:
    instruction: Pourquoi le bus de همایون a-t-il été annulé ?
    correct_option: chute de neige
    distractors:
    - un problème mécanique
    - pas assez de passagers
    - une grève des chauffeurs
    accepted_answers:
    - value: chute de neige
      status: correct
    feedback: '*آن بس به دلیل برفباری لغو شده* -- annulé à cause des chutes de neige.'
  prs.a2.unit15.lesson04.exercise02.comprehend_alternative_route:
    instruction: Que dit le personnel de la gare au sujet d’un autre itinéraire ?
    correct_option: il n’y en a pas, la route est fermée
    distractors:
    - il y a un itinéraire de remplacement plus long
    - il y a un itinéraire plus rapide en taxi
    - le personnel ne sait pas
    accepted_answers:
    - value: il n’y en a pas, la route est fermée
      status: correct
    feedback: '*نخیر، راه بسته است* -- non, la route est fermée.'
  prs.a2.unit15.lesson04.exercise03.recognize_tomorrow_departure_time:
    instruction: À quelle heure part le bus de demain ?
    correct_option: 8 heures du matin
    distractors:
