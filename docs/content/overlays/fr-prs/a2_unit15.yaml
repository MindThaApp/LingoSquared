    - midi
    - 8 heures du soir
    accepted_answers:
    - value: 8 heures du matin
      status: correct
    feedback: '*بس فردا ساعت هشت صبح حرکت می‌کند* -- 8 heures du matin.'
  prs.a2.unit15.lesson04.exercise04.order_ask_next_bus_time:
    instruction: Remets les mots dans l’ordre pour demander quand part le bus de 9 heures pour Mazar-e Charif.
    accepted_answers:
    - value:
      - بس
      - ساعت
      - نه
      - به
      - مزار
      - شریف
      - کی
      - حرکت
      - می‌کند
      status: correct
    feedback: '*بس ساعت نه به مزار شریف کی حرکت می‌کند؟* interroge sur le bus de 9 heures.'
  prs.a2.unit15.lesson04.exercise05.dialogue_response_as_homayoun:
    instruction: 'Le personnel de la gare te demande : « Comment puis-je vous aider ? » Demande à quelle heure part le bus de 9 heures pour Mazar-e Charif.'
    accepted_answers:
    - value: بس ساعت نه به مزار شریف کی حرکت می‌کند؟
      status: correct
    - value: بس ساعت نه به مزار شریف کی حرکت می‌کند
      status: correct
    - value: بس ساعت نه به مزار شریف چه وقت حرکت می‌کند
      status: correct
    feedback: '*بس ساعت نه به مزار شریف کی حرکت می‌کند؟* est la question de همایون.'
  prs.a2.unit15.lesson04.exercise06.write_disruption_summary:
    instruction: Écris, en tant que همایون parlant de lui-même, que le bus de 9 heures a été annulé à cause de la neige et qu’il doit attendre jusqu’à demain matin (utilise « je dois attendre »).
    accepted_answers:
    - value: بس ساعت نه به دلیل برفباری لغو شده و باید تا فردا صبح صبر کنم.
      status: correct
    - value: بس ساعت نه به دلیل برفباری لغو شده. باید تا فردا صبح صبر کنم.
      status: correct
    - value: بس ساعت نه به دلیل برفباری لغو شده، باید تا فردا صبح صبر کنم.
      status: correct
    - value: بس ساعت نه به دلیل برفباری لغو شده است و باید تا فردا صبح صبر کنم.
      status: correct
    - value: بس ساعت نه به دلیل برفباری لغو شده و من باید تا فردا صبح صبر کنم.
      status: correct
    - value: بس ساعت نه به دلیل برفباری لغو شده است و من باید تا فردا صبح صبر کنم.
      status: correct
    - value: به دلیل برفباری بس ساعت نه لغو شده و باید تا فردا صبح صبر کنم.
      status: correct
    - value: به دلیل برفباری، بس ساعت نه لغو شده و باید تا فردا صبح صبر کنم.
      status: correct
