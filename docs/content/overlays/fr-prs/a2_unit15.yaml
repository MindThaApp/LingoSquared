    - left: برفباری
      right: chute de neige
    - left: اطلاعیه
      right: annonce
  prs.a2.unit15.lesson01.exercise04.order_road_closed:
    instruction: Remets les mots dans l’ordre pour dire que la route est fermée à cause des chutes de neige.
    accepted_answers:
