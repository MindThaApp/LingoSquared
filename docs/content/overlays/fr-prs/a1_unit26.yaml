course:
  title: Dari A1
  description: 'Dari de Kaboul pour débutants : vocabulaire des loisirs et du temps libre (lire, écouter de la musique, regarder des films, marcher, cuisiner), demander à quelqu’un ce qu’il aime faire pendant son temps libre avec دوست دارین, la fréquence avec هر هفته/آخر هفته, et un dialogue entre Zarmina et Homayoun qui comparent leur façon de occuper leur temps libre.'
units:
  prs.a1.unit26.hobbies:
    title: Les loisirs
    description: Décris ce que toi et les autres faites pour vous détendre pendant votre temps libre, et interroge quelqu’un sur ses loisirs.
