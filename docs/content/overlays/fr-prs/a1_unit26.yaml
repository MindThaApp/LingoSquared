    example_gloss: La lecture est mon passe-temps.
  prs.a1.unit26.lesson01.teach.music_word:
    title: Écouter de la musique
    gloss: écouter de la musique
    note: موسیقی گوش کردن signifie littéralement « musique oreille-faire » -- موسیقی (musique, déjà vu plus tôt dans le cours) + گوش (oreille) + کردن (faire).
    example_gloss: Écouter de la musique est mon passe-temps.
  prs.a1.unit26.lesson01.teach.movie_word:
    title: Regarder des films
    gloss: regarder des films
    note: فلم دیدن signifie littéralement « film voir » -- فلم (film) + دیدن (voir).
    example_gloss: Regarder des films est mon passe-temps.
  prs.a1.unit26.lesson01.teach.walking_word:
    title: La marche
    gloss: marche (activité)
    note: پیاده‌روی signifie la marche (comme activité ou exercice physique).
    example_gloss: La marche est mon passe-temps.
  prs.a1.unit26.lesson01.teach.cooking_word:
    title: La cuisine
    gloss: cuisine (activité)
    note: آشپزی signifie « cuisine » (l’activité de cuisiner).
    example_gloss: La cuisine est mon passe-temps.
  prs.a1.unit26.lesson02.teach.free_word:
    title: Libre
    gloss: libre
    note: آزاد signifie « libre » au sens de « disponible, pas occupé », et non « gratuit ».
    example_gloss: Aujourd’hui, je suis libre.
  prs.a1.unit26.lesson02.teach.review_waqt:
    title: Temps
    gloss: temps
    note: وقت signifie « temps » (déjà vu plus tôt dans le cours).
    target_text: وقت (temps, heure)
  prs.a1.unit26.lesson02.teach.free_time_phrase:
    title: Le temps libre
    gloss: temps libre
    note: 'وقت آزاد signifie littéralement « temps libre » : وقت (temps) + آزاد (libre).'
  prs.a1.unit26.lesson02.teach.chi_word:
    title: Quoi
    gloss: quoi
    note: چی est le mot courant, à l’oral, pour dire « quoi » ou « que ».
    target_text: چی (quoi, que)
  prs.a1.unit26.lesson02.teach.review_dar:
    title: Dans / en / à
    gloss: dans
    note: در signifie « dans » ou « à » (déjà vu plus tôt dans le cours).
    target_text: در (dans, en, à)
