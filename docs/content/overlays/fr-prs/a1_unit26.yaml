    note: Combine هر هفته avec پیاده‌روی می‌کنم.
  prs.a1.unit26.lesson04.teach.review_pronouns_verb:
    title: Je / tu / fais-tu ?
    gloss: je / tu (informel) / fais-tu ? (informel)
    note: من (je) et تو (tu, informel) sont des révisions ; می‌کنی est la forme informelle « tu fais », qui suit le même modèle en -ی que رفتی et کردی, déjà vus.
    target_text: من (je, moi) / تو (tu, toi) / می‌کنی (fais-tu ?, informel)
  prs.a1.unit26.lesson04.teach.review_connectors:
    title: Aussi / parfois / et
    gloss: aussi / également / parfois / et
    note: هم (aussi), گاهی (parfois) et و (et) sont des révisions de mots vus plus tôt dans le cours.
    target_text: هم (aussi) / گاهی (parfois) / و (et)
  prs.a1.unit26.lesson04.teach.dialogue_line1:
    title: 'Homayoun : Zarmina, que fais-tu pendant ton temps libre ?'
    gloss: 'Homayoun : Zarmina, que fais-tu pendant ton temps libre ?'
    note: Une question informelle entre amis, avec تو et la terminaison -ی.
  prs.a1.unit26.lesson04.teach.dialogue_line2:
    title: 'Zarmina : J’aime lire, et parfois j’écoute aussi de la musique'
    gloss: 'Zarmina : J’aime lire, et parfois j’écoute aussi de la musique.'
    note: Relie deux activités avec و (et).
  prs.a1.unit26.lesson04.teach.dialogue_line3:
    title: 'Homayoun : Je me promène chaque semaine'
    gloss: 'Homayoun : Je me promène chaque semaine.'
    note: Reprend la phrase de la leçon 3 *من هر هفته پیاده‌روی می‌کنم* (je me promène chaque semaine).
  prs.a1.unit26.lesson04.teach.dialogue_line4:
    title: 'Zarmina : Bien ! Moi aussi, j’aime regarder des films'
    gloss: 'Zarmina : Bien ! Moi aussi, j’aime regarder des films.'
    note: Applique هم (aussi) à une nouvelle activité.
  prs.a1.unit26.lesson04.teach.dialogue_line5:
    title: 'Homayoun : Moi aussi, je cuisine parfois'
    gloss: 'Homayoun : Moi aussi, je cuisine parfois.'
    note: Applique گاهی (parfois) et می‌کنم à آشپزی.
  prs.a1.unit26.lesson05.teach.reading_passage:
    title: Lecture sur les loisirs
    gloss: Zarmina aime lire. Homayoun se promène pendant son temps libre. Lui aussi cuisine parfois.
    note: 'Un court texte qui reprend les mots de loisirs de l’unité, révise او (il/elle) et présente les formes très courantes de la 3e personne : می‌کند (il/elle fait) et دارد (il/elle a, aime).'
  prs.a1.unit26.lesson06.teach.review_ama:
    title: Mais
    gloss: mais
    note: اما signifie « mais » (déjà vu plus tôt dans le cours).
    target_text: اما (mais)
  prs.a1.unit26.lesson06.teach.review_hobby_word:
    title: Loisir (révision)
    gloss: loisir
    note: سرگرمی signifie « loisir » (révision de la leçon 1).
    example_gloss: La cuisine est mon loisir.
  prs.a1.unit26.lesson06.teach.wrap_summary:
    title: Pendant mon temps libre, je me promène, mais j’aime aussi lire parfois
    gloss: Pendant mon temps libre, je me promène, mais j’aime aussi lire parfois.
    note: Combine deux phrases sur les loisirs avec اما.
