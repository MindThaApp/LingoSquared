teaching:
  prs.a1.unit26.lesson01.teach.hobby_word:
    title: Passe-temps
    gloss: passe-temps
    note: سرگرمی signifie « passe-temps ».
    example_gloss: La marche est mon passe-temps.
  prs.a1.unit26.lesson01.teach.reading_word:
    title: Lire (des livres)
    gloss: lire (des livres)
