  prs.a1.unit28.lesson03.describe_pet:
    title: Décrire ton animal
  prs.a1.unit28.lesson04.pet_dialogue:
    title: Dialogue sur les animaux de compagnie
  prs.a1.unit28.lesson05.reading_animals:
    title: Lecture sur les animaux
  prs.a1.unit28.lesson06.wrap_up:
    title: Récapitulatif
teaching:
  prs.a1.unit28.lesson01.teach.animal_word:
    title: Animal
    gloss: animal
    note: حیوان signifie animal ; c’est le mot général qui couvre les animaux de compagnie et les autres bêtes.
    example_gloss: Un chien est un animal.
  prs.a1.unit28.lesson01.teach.dog_word:
    title: Chien
    gloss: chien
    note: سگ signifie chien.
    example_gloss: J’ai un chien.
  prs.a1.unit28.lesson01.teach.cat_word:
    title: Chat
    gloss: chat
    note: پشک signifie chat ; c’est le mot courant en dari d’Afghanistan, différent de گربه en persan d’Iran.
    example_gloss: J’ai un chat.
  prs.a1.unit28.lesson01.teach.bird_word:
    title: Oiseau
    gloss: oiseau
    note: پرنده signifie oiseau.
    example_gloss: J’ai un oiseau.
  prs.a1.unit28.lesson01.teach.fish_word:
    title: Poisson
    gloss: poisson
    note: ماهی signifie poisson.
    example_gloss: J’ai un poisson.
  prs.a1.unit28.lesson01.teach.pet_phrase:
    title: Animal de compagnie
    gloss: animal de compagnie
    note: 'حیوان خانگی signifie littéralement « animal de la maison » : حیوان (animal, révision) + خانگی (domestique).'
    example_gloss: Le chien est mon animal de compagnie.
  prs.a1.unit28.lesson01.teach.review_daram_dast:
    title: J’ai / vous avez (formel) / est
    gloss: j’ai / vous avez / est
    note: دارم (j’ai), دارین (vous avez) et است (est) ont déjà été vus plus tôt dans le cours ; ils servent ici à parler des animaux de compagnie.
    target_text: دارم (j’ai) / دارین (vous avez, formel) / است (est)
  prs.a1.unit28.lesson02.teach.pet_question:
    title: As-tu un animal de compagnie ?
    gloss: As-tu un animal de compagnie ?
    note: حیوان خانگی دارین؟ est la façon polie et formelle de demander à quelqu’un s’il a un animal de compagnie.
  prs.a1.unit28.lesson02.teach.yes_answer:
    title: Oui, j’ai un chien
    gloss: Oui, j’ai un chien.
    note: بلی (oui, vu dans l’unité 3) associé à سگ دارم, vu dans cette unité.
  prs.a1.unit28.lesson02.teach.no_answer:
    title: Non, je n’ai pas d’animal de compagnie
    gloss: Non, je n’ai pas d’animal de compagnie.
    note: نخیر (non, forme soutenue, vu dans l’unité 3) associé à حیوان خانگی ندارم (je n’ai pas d’animal de compagnie).
  prs.a1.unit28.lesson02.teach.review_bali_nakhair:
    title: Oui / non / je n’ai pas
    gloss: oui / non / je n’ai pas
    note: بلی, نخیر et ندارم ont déjà été vus dans l’échange sur les membres de la famille de l’unité 3 ; on les réutilise ici pour parler des animaux de compagnie.
    target_text: بلی (oui) / نخیر (non) / ندارم (je n’ai pas)
  prs.a1.unit28.lesson03.teach.review_rang:
    title: Couleur
    gloss: couleur
    note: رنگ signifie couleur (révision de l’unité 21 sur les vêtements).
    target_text: رنگ (couleur)
  prs.a1.unit28.lesson03.teach.black_word:
    title: Noir
    gloss: noir
    note: سیاه signifie noir.
    example_gloss: Mon chien est noir.
  prs.a1.unit28.lesson03.teach.white_word:
    title: Blanc
    gloss: blanc
    note: سفید signifie « blanc ».
    example_gloss: Mon chat est blanc.
  prs.a1.unit28.lesson03.teach.small_word:
    title: Petit
    gloss: petit
    note: کوچک signifie « petit » (révision des comparaisons de l’unité 15).
    example_gloss: Mon chat est petit.
  prs.a1.unit28.lesson03.teach.big_word:
    title: Grand
    gloss: grand
    note: بزرگ signifie « grand » (révision des comparaisons de l’unité 15).
    example_gloss: Mon chien est grand.
  prs.a1.unit28.lesson03.teach.combined_sentence:
    title: Mon chien est noir et grand
    gloss: Mon chien est noir et grand.
    note: Deux qualités sont reliées par و (« et », révision).
  prs.a1.unit28.lesson04.teach.review_to_dari:
    title: Tu (informel) / tu as (informel)
    gloss: tu (informel) / tu as (informel)
    note: تو (« tu », informel) et داری (« tu as », informel) sont des révisions ; on les emploie dans le dialogue familier de cette leçon, entre amis proches.
    target_text: تو (tu, informel) / داری (tu as, informel)
  prs.a1.unit28.lesson04.teach.review_che_har_roz:
    title: Quel / chaque jour
    gloss: quoi / quel / chaque jour
    note: چه (« quoi / quel », révision de « quelle couleur » de l’unité 21) et هر روز (« chaque jour », révision de l’unité 24) s’emploient ensemble pour poser des questions sur les soins donnés à un animal.
    target_text: چه (quel, quoi) / هر روز (chaque jour)
  prs.a1.unit28.lesson04.teach.dialogue_line1:
    title: 'Homayoun : Zarmina, tu as un animal de compagnie ?'
    gloss: 'Homayoun : Zarmina, tu as un animal de compagnie ?'
    note: Une question informelle entre amis, avec la forme familière داری.
  prs.a1.unit28.lesson04.teach.dialogue_line2:
    title: 'Zarmina : Oui, j’ai un chat'
    gloss: 'Zarmina : Oui, j’ai un chat.'
    note: Elle répond avec بلی et یک پشک دارم.
  prs.a1.unit28.lesson04.teach.dialogue_line3:
    title: 'Homayoun : De quelle couleur est ton chat ?'
    gloss: 'Homayoun : De quelle couleur est ton chat ?'
    note: Emploie چه رنگ (« quelle couleur »), comme dans la question d’achat de l’unité 21.
  prs.a1.unit28.lesson04.teach.dialogue_line4:
    title: 'Zarmina : Il est blanc'
    gloss: 'Zarmina : Il est blanc.'
    note: 'Une réponse courte : seulement la couleur plus است. Le chat est déjà connu grâce à la question, donc پشک n’est pas répété.'
  prs.a1.unit28.lesson04.teach.dialogue_line5:
    title: 'Homayoun : Tu lui donnes à manger tous les jours ?'
    gloss: 'Homayoun : Tu lui donnes à manger tous les jours ?'
    note: Présente غذا می‌دهی (« tu donnes à manger », informel), formé de غذا (« nourriture ») + می‌دهی, équivalent familier de می‌دهد de l’unité 18.
  prs.a1.unit28.lesson04.teach.dialogue_line6:
    title: 'Zarmina : Oui, je lui donne à manger tous les jours'
    gloss: 'Zarmina : Oui, je lui donne à manger tous les jours.'
    note: هر روز (« chaque jour ») est employé avec می‌دهم (« je donne », 1re personne).
  prs.a1.unit28.lesson05.teach.reading_passage:
    title: 'Lecture : un animal de compagnie'
    gloss: Zarmina a un chat. Son chat est blanc et petit. Zarmina donne à manger au chat tous les jours.
    note: Un court texte qui reprend le vocabulaire des animaux de l’unité ; il présente دارد (« il/elle a », 3e personne, révision des unités 26/27) et می‌دهد (« il/elle donne », 3e personne, révision de l’unité 18).
  prs.a1.unit28.lesson06.teach.review_ama:
    title: Mais
    gloss: mais
    note: اما signifie « mais » (révision des unités précédentes).
    target_text: اما (mais)
  prs.a1.unit28.lesson06.teach.review_astam:
    title: Je suis
    gloss: je suis
    note: استم (« je suis ») est une révision de ce qui a été vu plus tôt dans le cours.
    target_text: استم (je suis)
  prs.a1.unit28.lesson06.teach.wrap_summary:
    title: J’ai un chien, mais je n’ai pas de chat
    gloss: J’ai un chien, mais je n’ai pas de chat.
    note: Deux faits sur les animaux possédés sont reliés par اما.
