course:
  title: Dari A1
  description: 'Dari de Kaboul pour débutants : vocabulaire des animaux et des animaux de compagnie (chien, chat, oiseau, poisson), demander et dire si l’on a un animal de compagnie avec حیوان خانگی دارین؟, décrire la taille et la couleur d’un animal, et un dialogue entre Zarmina et Homayoun sur le fait d’avoir un chat et de le nourrir.'
units:
  prs.a1.unit28.animals:
    title: Les animaux
    description: Parle des animaux de compagnie et des animaux courants, dis si tu en as un et décris les soins de base.
lessons:
  prs.a1.unit28.lesson01.animal_vocabulary:
    title: Les mots des animaux
  prs.a1.unit28.lesson02.have_a_pet:
