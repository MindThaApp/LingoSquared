    title: Lecture de révision
teaching:
  prs.a1.unit21.lesson01.teach.lebas:
    title: Les vêtements
    gloss: vêtements
    note: لباس signifie « vêtements » (le mot général).
    example_gloss: Ces vêtements sont neufs.
  prs.a1.unit21.lesson01.teach.perahan:
    title: Chemise
    gloss: chemise
    note: پیراهن signifie « chemise ».
    example_gloss: Cette chemise est jolie.
  prs.a1.unit21.lesson01.teach.patlun:
    title: Pantalon
    gloss: pantalon
    note: پطلون signifie « pantalon » ; c’est le mot authentiquement afghan en dari (emprunté à l’anglais « pantaloon »), différent du شلوار du persan d’Iran.
    example_gloss: Ce pantalon est cher.
  prs.a1.unit21.lesson01.teach.kafsh:
    title: Chaussures
    gloss: chaussures
    note: کفش signifie « chaussures ».
    example_gloss: Ces chaussures ne sont pas chères.
  prs.a1.unit21.lesson01.teach.review_ast:
    title: Est / sont
    gloss: est
    note: است (est) -- déjà vu dans l’unité des salutations.
    example_gloss: C’est une chemise.
  prs.a1.unit21.lesson01.teach.review_geran:
    title: Cher
    gloss: cher
    note: گران (cher) -- déjà vu dans l’unité des achats.
    example_gloss: Ce pantalon est cher.
  prs.a1.unit21.lesson02.teach.rang:
    title: Couleur
    gloss: couleur
    note: رنگ signifie « couleur ».
    example_gloss: De quelle couleur est cette chemise ?
  prs.a1.unit21.lesson02.teach.siyah:
    title: Noir
    gloss: noir
    note: سیاه signifie « noir ».
    example_gloss: Ce pantalon est noir.
  prs.a1.unit21.lesson02.teach.safid:
    title: Blanc
    gloss: blanc
    note: سفید signifie « blanc ».
    example_gloss: Cette chemise est blanche.
  prs.a1.unit21.lesson02.teach.sorkh:
    title: Rouge
    gloss: rouge
    note: سرخ signifie « rouge » ; c’est la forme du dari et du persan classique, et non قرمز, employé familièrement en Iran.
    example_gloss: Ces chaussures sont rouges.
  prs.a1.unit21.lesson03.teach.andaza:
    title: Taille
    gloss: taille
    note: اندازه signifie « taille » (le nom).
    example_gloss: Quelle est votre taille ?
  prs.a1.unit21.lesson03.teach.andazatan_chand:
    title: Quelle est votre taille ?
    gloss: Quelle est votre taille ?
    note: اندازه شما چند است؟ demande littéralement « votre taille est combien ? »
  prs.a1.unit21.lesson03.teach.in_andaza_shoma:
    title: Est-ce votre taille ?
    gloss: Est-ce votre taille ?
    note: این اندازه شما است؟ utilise این (ce, cette), introduit ici.
  prs.a1.unit21.lesson03.teach.review_bozorg:
    title: Grand
    gloss: grand
    note: بزرگ (grand) -- déjà vu dans l’unité des comparaisons.
    example_gloss: Cette chemise est grande.
  prs.a1.unit21.lesson03.teach.review_kochak:
    title: Petit
    gloss: petit
    note: کوچک (petit) -- déjà vu dans l’unité des comparaisons.
    example_gloss: Ces chaussures sont petites.
  prs.a1.unit21.lesson04.teach.pero_kardan:
    title: Puis-je l’essayer ?
    gloss: Puis-je l’essayer ?
    note: پرو کردن signifie « essayer » (un vêtement) ; c’est un mot venu du français, comme en persan. می‌توانم این را پرو کنم؟ signifie littéralement « puis-je ceci essayage faire ? »
  prs.a1.unit21.lesson04.teach.mitanin_pero_konin:
    title: Oui, vous pouvez l’essayer
    gloss: Oui, vous pouvez l’essayer.
    note: می‌توانین پرو کنین est la forme polie de la deuxième personne du même verbe.
  prs.a1.unit21.lesson04.teach.label_text:
    title: Une étiquette de vêtement
    gloss: 'Chemise : taille grande, couleur blanche, 500 afghanis'
    note: Une étiquette simple indiquant l’article, la taille, la couleur et le prix.
  prs.a1.unit21.lesson04.teach.review_ra:
    title: Marqueur d’objet
    gloss: (marqueur d’objet)
    note: را marque le complément d’objet direct -- déjà vu dans les structures des unités précédentes.
    example_gloss: Je veux cette chemise.
  prs.a1.unit21.lesson04.teach.review_afghani:
    title: Afghani
    gloss: afghani
    note: افغانی (afghani) -- la monnaie, déjà vue dans l’unité des achats.
    example_gloss: Ça fait 500 afghanis.
  prs.a1.unit21.lesson05.teach.che_rang_darad:
    title: De quelle couleur est cette chemise ?
    gloss: De quelle couleur est cette chemise ?
    note: این پیراهن چه رنگ دارد؟ utilise دارد (a, possède), introduit ici.
  prs.a1.unit21.lesson05.teach.turn01:
    title: Le commerçant accueille
    gloss: Bonjour, bienvenue.
  prs.a1.unit21.lesson05.teach.turn02:
    title: Zarmina demande
    gloss: Bonjour. De quelle couleur est cette chemise ?
    note: زرمینه (Zarmina) est un personnage récurrent du cours, présenté pour la première fois dans les unités sur l’heure et la routine quotidienne.
  prs.a1.unit21.lesson05.teach.turn03:
    title: Le commerçant répond
    gloss: J’en ai en noir et en blanc.
  prs.a1.unit21.lesson05.teach.turn04:
    title: Zarmina choisit
    gloss: Je veux la chemise blanche. Est-elle en grande taille ?
    note: اندازه‌اش (sa taille) ajoute la terminaison possessive à اندازه.
  prs.a1.unit21.lesson05.teach.turn05:
    title: Le commerçant confirme
    gloss: Oui, elle est grande. Vous pouvez l’essayer.
  prs.a1.unit21.lesson05.teach.turn06:
    title: Zarmina l’essaie
    gloss: Merci. C’est ma taille. Combien coûte-t-elle ?
  prs.a1.unit21.lesson05.teach.turn07:
    title: Le commerçant annonce le prix
    gloss: Elle coûte 500 afghanis.
  prs.a1.unit21.lesson05.teach.turn08:
    title: Zarmina accepte
    gloss: Très bien, je la prends.
    note: می‌خرم est la première personne du présent de خریدن (acheter).
  prs.a1.unit21.lesson05.teach.review_dokandar:
    title: Commerçant
    gloss: commerçant
    note: دوکاندار (commerçant) -- déjà vu dans l’unité des achats.
    example_gloss: Le commerçant vend des chemises.
  prs.a1.unit21.lesson05.teach.review_besyar_khoob:
    title: Très bien
    gloss: très bien
    note: 'بسیار خوب (très bien) : tu connais déjà cette expression grâce à l’unité sur les achats.'
    example_gloss: Très bien, merci.
  prs.a1.unit21.lesson05.teach.review_che:
    title: Quoi / Quel
    gloss: quel / quoi
    note: 'چه (quel, quoi) : tu connais déjà ce mot, vu dans les questions des unités précédentes.'
    example_gloss: De quelle couleur est ceci ?
  prs.a1.unit21.lesson06.teach.review_va:
    title: Et
    gloss: et
    note: 'و (et) : tu connais déjà ce mot grâce à l’unité sur les achats.'
    example_gloss: J’achète une chemise et un pantalon.
  prs.a1.unit21.lesson06.teach.review_yak:
    title: Un
    gloss: un
    note: 'یک (un) : tu connais déjà ce mot grâce à l’unité sur les nombres.'
    example_gloss: J’achète une chemise.
  prs.a1.unit21.lesson06.teach.review_ba:
    title: À / Vers
    gloss: à, vers
    note: 'به (à, vers) : tu connais déjà ce mot grâce aux unités sur les directions et la routine quotidienne.'
    example_gloss: Je vais au magasin.
  prs.a1.unit21.lesson06.teach.review_dokan:
    title: Boutique
    gloss: boutique
    note: 'دوکان (boutique) : tu connais déjà ce mot grâce à l’unité sur les achats.'
    example_gloss: Cette boutique est grande.
  prs.a1.unit21.lesson06.teach.review_raft:
    title: Est allé(e)
    gloss: est allé
    note: 'رفت (est allé(e), troisième personne) : tu connais déjà cette forme grâce à l’unité sur les événements passés.'
    example_gloss: Zarmina est allée à la boutique.
  prs.a1.unit21.lesson06.teach.review_qeymatesh:
    title: Son prix
    gloss: son prix
    note: 'قیمتش (son prix) : tu connais déjà ce mot grâce à l’unité sur les achats.'
    example_gloss: Son prix était de 500 afghanis.
  prs.a1.unit21.lesson06.teach.summary_text:
    title: Résumé d’un achat
    gloss: Zarmina est allée à la boutique. Elle a acheté une grande chemise blanche. Elle coûtait 500 afghanis.
    note: خرید (a acheté) et بود (était) sont deux formes du passé simple que tu connais déjà grâce à l’unité sur les événements passés.
