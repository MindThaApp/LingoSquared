course:
  title: Dari A1
  description: 'Dari de Kaboul pour débutants : vocabulaire des vêtements, couleurs, tailles, essayage, lecture d’une étiquette et dialogue complet pour acheter une chemise dans un magasin.'
units:
  prs.a1.unit21.clothing:
    title: Acheter des vêtements
    description: Identifier les vêtements courants et faire un achat simple de vêtement.
