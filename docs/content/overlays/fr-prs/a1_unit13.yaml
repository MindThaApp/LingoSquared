teaching:
  prs.a1.unit13.lesson01.teach.plan_word:
    title: Projet
    gloss: projet
    note: پلان signifie « projet ».
    example_gloss: J’ai un projet.
  prs.a1.unit13.lesson01.teach.park_word:
    title: Parc
    gloss: parc
    note: پارک signifie « parc ».
    example_gloss: Je vais au parc.
  prs.a1.unit13.lesson01.teach.berawim_word:
    title: Allons-y
    gloss: allons-y
    note: برویم (allons-y) est la forme du subjonctif « nous allons », utilisée pour faire des suggestions.
    example_gloss: Allons au parc.
  prs.a1.unit13.lesson01.teach.chetor_ast_word:
    title: Ça vous dit ?
    gloss: Ça vous dit ?
    note: چطور است؟ emploie la forme complète است, conformément au registre de ce cours.
  prs.a1.unit13.lesson02.teach.mikhahid_word:
    title: Voulez-vous (poli)
    gloss: voulez-vous (poli)
    note: می‌خواهین (voulez-vous, forme polie) sert à commencer une question de proposition.
    example_gloss: Voulez-vous aller au parc ?
  prs.a1.unit13.lesson02.teach.jomeh_review:
    title: Vendredi (révision)
    gloss: vendredi
    note: جمعه reprend le nom de jour vu à l’unité 9.
    example_gloss: Si on allait au parc vendredi ?
  prs.a1.unit13.lesson02.teach.propose_phrase:
    title: Voulez-vous aller au parc vendredi ?
    gloss: Voulez-vous aller au parc vendredi ?
    note: می‌خواهین جمعه برویم پارک؟ combine les mots de cette leçon en une proposition complète.
  prs.a1.unit13.lesson03.teach.khoob_ast_word:
    title: Ça va
    gloss: bien
    note: خوب است signifie « d’accord » ou « bien ».
    example_gloss: Vendredi, ça me convient.
  prs.a1.unit13.lesson03.teach.aali_ast_word:
    title: Super
    gloss: super
    note: عالی است signifie « super » ou « excellent ».
    example_gloss: Le parc est super.
  prs.a1.unit13.lesson03.teach.qabool_ast_word:
    title: C’est d’accord
    gloss: c’est d’accord
    note: قبول است signifie « c’est accepté » ou « c’est d’accord ».
    example_gloss: C’est d’accord, allons au parc vendredi.
  prs.a1.unit13.lesson03.teach.aali_o_qabool:
    title: Super et d’accord
    gloss: Super, c’est d’accord !
    note: '*و* (et) relie deux courtes propositions, par exemple *عالی است و قبول است*.'
  prs.a1.unit13.lesson04.teach.motasef_astam_word:
    title: Je suis désolé
    gloss: je suis désolé
    note: متأسف استم signifie « je suis désolé » ; on y retrouve la copule استم déjà vue.
    example_gloss: Je suis désolé, j’ai des choses à faire.
  prs.a1.unit13.lesson04.teach.nemitawanam_word:
    title: Je ne peux pas
    gloss: je ne peux pas
    note: نمی‌توانم signifie « je ne peux pas » (forme complète, non contractée).
    example_gloss: Je suis désolé, je ne peux pas.
  prs.a1.unit13.lesson04.teach.kar_daram_word:
    title: J’ai des choses à faire
    gloss: j’ai des choses à faire
    note: کار دارم signifie littéralement « j’ai du travail / des choses à faire » ; c’est une excuse polie courante.
  prs.a1.unit13.lesson05.teach.dawat_word:
    title: Invitation
    gloss: invitation
    note: دعوت signifie « invitation ».
    example_gloss: L’invitation est sympa.
  prs.a1.unit13.lesson05.teach.saat_panj_review:
    title: Cinq heures de l’après-midi
    gloss: cinq heures de l’après-midi
    note: ساعت پنج بعد از ظهر associe la structure de l’heure vue à l’unité 11 et بعد از ظهر (l’après-midi).
  prs.a1.unit13.lesson05.teach.montazer_astam_word:
    title: J’attends
    gloss: j’attends
    note: منتظر استم signifie « j’attends » et emploie la copule استم déjà vue.
    example_gloss: J’attends vendredi.
  prs.a1.unit13.lesson05.teach.invitation_message:
    title: Exemple de message d’invitation
    gloss: Salut ! Tu veux aller au parc vendredi à cinq heures de l’après-midi ? J’attends ta réponse.
    note: Un court message écrit d’invitation, comme on peut en recevoir par SMS.
  prs.a1.unit13.lesson05.teach.shoma_ra_mibinam_word:
    title: Je vous verrai
    gloss: je vous verrai
    note: شما را می‌بینم (je vous verrai, forme de politesse) est une façon courante de conclure la confirmation d’un projet.
    example_gloss: Je vous verrai vendredi.
  prs.a1.unit13.lesson06.teach.names:
    title: Farid et Negar
    gloss: Farid, Negar
    note: فرید et نگار sont les deux interlocuteurs du dialogue de cette leçon.
    example_gloss:
    - Je suis Farid.
    - Je suis Negar.
  prs.a1.unit13.lesson06.teach.che_saat_word:
    title: À quelle heure ?
    gloss: À quelle heure ?
    note: چه ساعت؟ est une façon naturelle de demander une heure précise.
  prs.a1.unit13.lesson06.teach.dialogue_line1:
    title: Negar, vous voulez aller au parc vendredi ?
    gloss: Negar, vous voulez aller au parc vendredi ?
    note: Farid commence par proposer le projet.
  prs.a1.unit13.lesson06.teach.dialogue_line2:
    title: À quelle heure ?
    gloss: À quelle heure ?
    note: Negar demande l’heure précise avant de décider.
  prs.a1.unit13.lesson06.teach.dialogue_line3:
    title: À cinq heures de l’après-midi.
    gloss: À cinq heures de l’après-midi.
    note: Farid indique l’heure.
  prs.a1.unit13.lesson06.teach.dialogue_line4:
    title: D’accord, super ! C’est entendu.
    gloss: D’accord, super ! C’est entendu.
    note: Negar accepte avec enthousiasme.
  prs.a1.unit13.lesson06.teach.dialogue_line5:
    title: Bien, je vous verrai vendredi.
    gloss: Bien, je vous verrai vendredi.
    note: Farid confirme et conclut l’échange avec la formule de politesse شما را می‌بینم.
