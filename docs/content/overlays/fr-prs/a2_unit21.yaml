  title: Dari en français A2
  description: 'Dari afghan niveau pré-intermédiaire : déplacer un rendez-vous chez le coiffeur. می‌توانم + subjonctif, demandes polies, donner une raison avec چون et convenir d’un nouveau jour et d’une nouvelle heure.'
