teaching:
  prs.a2.unit21.lesson01.teach.tghr_dadn_lghw:
    title: Changer un rendez-vous
    gloss: déplacer (un rendez-vous) / annuler
    note: '*قرار را تغییر دادن* signifie le déplacer à un autre moment. *لغو کردن* signifie l’annuler complètement.'
    example_gloss:
    - Je veux déplacer mon rendez-vous.
    - Je dois annuler mon rendez-vous.
  prs.a2.unit21.lesson01.teach.mtasfanh_bbkhshn:
    title: S’excuser
    gloss: malheureusement / pardon
    note: '*متأسفانه* est une façon polie d’annoncer une mauvaise nouvelle. *ببخشین* est l’excuse de tous les jours.'
    example_gloss:
    - Malheureusement, je ne peux pas venir.
    - Pardon, je suis très en retard.
  prs.a2.unit21.lesson01.teach.slman:
    title: Le salon de coiffure
    gloss: le salon de coiffure
    note: '*سلمانی* désigne la boutique du barbier, le lieu. *دلاک* est le mot traditionnel pour le barbier lui-même.'
    example_gloss: Le salon est ouvert de neuf heures à six heures.
  prs.a2.unit21.lesson01.teach.mtwanm_qrarm_ra:
    title: Demander à déplacer un rendez-vous
    gloss: Puis-je déplacer mon rendez-vous ?
    note: 'Une question fermée garde l’ordre de la phrase affirmative et seule l’intonation monte : *می‌توانم قرارم را تغییر بدهم؟* Le second verbe, *تغییر بدهم*, se place à la fin.'
  prs.a2.unit21.lesson01.teach.mn_mtasfanh_nmtwanm:
    title: Dire que tu ne peux pas venir
    gloss: Malheureusement, je ne peux pas venir.
  prs.a2.unit21.lesson01.teach.njshnbh_nmtwanm_bam:
    title: می‌توانم + subjonctif
    gloss: Je ne peux pas venir jeudi. Puis-je déplacer le rendez-vous ?
    note: 'Après *می‌توانم* (je peux), le second verbe est au subjonctif et se place à la fin : *می‌توانم بیایم*. Pour dire *je ne peux pas*, le *ن* se place sur l’auxiliaire : *نمی‌توانم بیایم*. Le mot qui désigne le jour vient en premier : *پنجشنبه نمی‌توانم بیایم*. La question garde le même ordre des mots ; seule l’intonation monte : *می‌توانم قرار را تغییر بدهم؟*'
  prs.a2.unit21.lesson02.teach.rwz_dr:
    title: Un autre jour
    gloss: un autre jour
    note: '*دیگر* signifie autre et se place après le nom : *یک روز دیگر* veut dire un autre jour.'
    example_gloss: Est-ce que ce serait possible un autre jour aussi ?
  prs.a2.unit21.lesson02.teach.dwshnbh_hm_mmn:
    title: Proposer un jour
    gloss: Est-ce que lundi est possible aussi ?
    note: 'Aucune préposition n’est nécessaire devant un jour de la semaine : *دوشنبه هم ممکن است؟* *هم* signifie aussi et se place après le jour.'
  prs.a2.unit21.lesson02.teach.jmah_bra_shma:
    title: Est-ce que ça vous convient ?
    gloss: Est-ce que vendredi vous convient ? (formel)
    note: '*مناسب* signifie convenable. *برای شما مناسب است* est la façon polie de demander si un horaire convient à quelqu’un que l’on connaît peu. *برایم* est la forme courte de *برای من* (pour moi).'
  prs.a2.unit21.lesson02.teach.bl_bram_mnasb:
    title: Dire oui
    gloss: Oui, ça me convient bien.
  prs.a2.unit21.lesson02.teach.mtasfanh_nh:
    title: Refuser poliment
    gloss: Malheureusement non.
  prs.a2.unit21.lesson02.teach.jmah_bra_shma_2:
    title: Est-ce que ça vous convient ?
    gloss: Est-ce que vendredi vous convient ? Oui, ça me convient bien. Non, malheureusement non.
    note: Pour demander si un horaire convient à quelqu’un, on emploie *برای شما مناسب است؟*, avec le *شما* de politesse. Réponds *بلی، برایم مناسب است* pour accepter, ou *متأسفانه نه* pour refuser poliment. *برای* suivi d’une terminaison pronominale (*برایم*, *برایتان*) signifie pour moi, pour vous.
  prs.a2.unit21.lesson03.teach.wn_mtasfm:
    title: Parce que et je suis désolé
    gloss: parce que / je suis désolé
    note: '*چون* relie deux phrases complètes et donne la raison. *متأسفم* est une excuse plus soignée que *ببخشین*.'
    example_gloss:
    - Je ne peux pas venir, parce que je suis malade.
    - Je suis désolé.
  prs.a2.unit21.lesson03.teach.zhmt:
    title: Le dérangement
    gloss: le dérangement
    note: '*بابت زحمت ببخشین* est une formule polie après avoir causé un surcroît de peine à quelqu’un. *زحمت* signifie peine ou effort.'
    example_gloss: Excusez-moi pour le dérangement.
  prs.a2.unit21.lesson03.teach.nmtwanm_bam_wn:
    title: 'Raison : le travail'
    gloss: Je ne peux pas venir, parce que je dois travailler.
  prs.a2.unit21.lesson03.teach.nmtwanm_bam_wn_2:
    title: 'Raison : un autre rendez-vous'
    gloss: Je ne peux pas venir, parce que j’ai un autre rendez-vous.
  prs.a2.unit21.lesson03.teach.nmtwanm_bam_wn_3:
    title: 'Parce que : la raison'
    gloss: Je ne peux pas venir, parce que je suis malade.
    note: 'Après *چون*, la phrase est une phrase ordinaire, avec son verbe à la fin. On met une virgule avant : *نمی‌توانم بیایم، چون مریض استم.* La forme *استم* est la forme de la première personne (*je*) de *است*.'
  prs.a2.unit21.lesson04.teach.qrar_dhashtn_az:
    title: Convenir et à l’avance
    gloss: fixer un rendez-vous / à l’avance
    note: '*قرار گذاشتن* signifie convenir ensemble d’une heure ou d’un lieu. *از قبل* signifie auparavant, à l’avance.'
    example_gloss:
    - On fixe un rendez-vous ?
    - Appelez un jour à l’avance.
  prs.a2.unit21.lesson04.teach.dwshnbh_saat_dh:
    title: Accepter un horaire
    gloss: Lundi à dix heures, c’est bien.
  prs.a2.unit21.lesson04.teach.dwshnbh_saat_dh_2:
    title: Demander si un horaire convient
    gloss: Pouvez-vous venir lundi à dix heures ? (formel)
    note: '*می‌توانین* est la forme de politesse (*vous*) de *می‌توانی* ; la terminaison de pluriel *-ین* s’emploie avec *شما*. Le second verbe, *بیایین*, se place à la fin.'
  prs.a2.unit21.lesson04.teach.s_shma_ra:
    title: Conclure l’arrangement
    gloss: Alors je vous vois lundi.
  prs.a2.unit21.lesson04.teach.s_qrar_jdd:
    title: Fixer un nouveau rendez-vous
    gloss: Alors je fixe un nouveau rendez-vous.
  prs.a2.unit21.lesson04.teach.dwshnbh_saat_dh_3:
    title: D’abord le jour, ensuite l’heure
    gloss: Lundi à dix heures, c’est bien. Pouvez-vous venir lundi à dix heures ?
    note: 'Quand on donne un jour et une heure, le jour vient en premier, puis *ساعت* + le nombre : *دوشنبه ساعت ده*. Dans une question polie, on emploie *می‌توانین ...؟* et on met le verbe à la fin.'
  prs.a2.unit21.lesson05.teach.hmawn_azz_qrartan:
    title: Un message du salon
    gloss: Cher Homayoun, votre rendez-vous a été déplacé. Votre nouveau rendez-vous est lundi à dix heures. Cela ne vous convient pas ? Alors appelez-nous un jour à l’avance. Nous fixerons alors un nouveau rendez-vous. À lundi ! Salon de coiffure Ariana
    note: Voici un court message typique d’un commerce ; il emploie donc la terminaison de politesse *-تان* (*قرارتان*, *برایتان*). *تغییر داده شد* signifie a été déplacé.
    glosses:
      عزیز: cher
      همایون: Homayoun
      قرارتان: votre
      قرار: rendez-vous
      تغییر: déplacé
      جدیدتان: nouveau
      دوشنبه: lundi
      ده: dix
      ساعت: heures
      مناسب: qui convient
      این: ceci
      نیست: ne… pas
      برایتان: pour vous
      تماس: appeler
      با: avec nous
      پس: alors
      قبل: à l’avance
      می‌گذاریم: faire
      ما: nous
      تا: jusqu’à ; à bientôt
      سلمانی: salon de coiffure
      آریانا: Ariana
  prs.a2.unit21.lesson06.teach.slman_arana_rwz:
    title: Le salon répond
    gloss: 'Coiffeur : Salon Ariana, bonjour.'
  prs.a2.unit21.lesson06.teach.rwz_bkhr_hmawn:
    title: Homayoun explique et demande
    gloss: 'Homayoun : Bonjour, ici Homayoun. J’ai rendez-vous jeudi, mais malheureusement je ne peux pas venir. Puis-je déplacer le rendez-vous ?'
  prs.a2.unit21.lesson06.teach.albth_jmah_bra:
    title: Le coiffeur propose vendredi
    gloss: 'Coiffeur : Bien sûr. Est-ce que vendredi vous convient ?'
  prs.a2.unit21.lesson06.teach.mtasfanh_nh_wn:
    title: Homayoun propose lundi
    gloss: 'Homayoun : Malheureusement non, parce que je dois travailler. Est-ce que lundi est possible aussi ?'
  prs.a2.unit21.lesson06.teach.dwshnbh_saat_dh:
    title: Le coiffeur est d’accord
    gloss: 'Coiffeur : Lundi à dix heures, c’est bon.'
  prs.a2.unit21.lesson06.teach.bram_mnasb_ast:
    title: Homayoun accepte et s’excuse
    gloss: 'Homayoun : Cela me convient très bien. Merci beaucoup, et excusez-moi pour le dérangement.'
  prs.a2.unit21.lesson06.teach.mshl_nst_ta:
    title: Le coiffeur conclut
    gloss: 'Coiffeur : Aucun problème. À lundi !'
