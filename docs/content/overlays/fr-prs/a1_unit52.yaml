course:
  title: Dari A1
  description: 'Dari de Kaboul pour débutants : aller au cinéma, lire un programme de cinéma, acheter un billet, demander l’horaire d’une séance et parler simplement d’un film.'
units:
  prs.a1.unit52.cinema:
    title: Cinéma
    description: Aller au cinéma, lire un programme de cinéma, acheter un billet pour une séance précise et dire quel film tu veux.
lessons:
  prs.a1.unit52.lesson01.cinema_and_staff_vocabulary:
    title: Le cinéma et l’employé
  prs.a1.unit52.lesson02.reading_the_schedule:
    title: Lire le programme du cinéma
  prs.a1.unit52.lesson03.choosing_a_film_and_asking_for_a_ticket:
    title: Choisir un film et demander un billet
  prs.a1.unit52.lesson04.cinema_dialogue:
