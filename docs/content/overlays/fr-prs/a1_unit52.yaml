  prs.a1.unit52.lesson06.wrap_up:
    title: Récapitulatif
teaching:
  prs.a1.unit52.lesson01.teach.review_this_is_in_good:
    title: 'Révision : ceci, est, dans, bon'
    gloss: ceci / est / dans / bon
    note: Ce sont des mots de révision (utilisés tout au long de ce cours) pour parler du cinéma.
    target_text: این (ceci / c') / است (est) / در (dans / à) / خوب (bon)
  prs.a1.unit52.lesson01.teach.cinema_word:
    title: Cinéma
    gloss: cinéma
    note: C’est le mot dari pour désigner un cinéma, une salle de projection.
    example_gloss: Le cinéma est bien.
  prs.a1.unit52.lesson01.teach.review_staff_word:
    title: 'Révision : employé'
    gloss: employé
    note: C’est le même mot général pour « employé » déjà vu à la piscine, réutilisé ici pour le guichet du cinéma.
    target_text: کارمند (employé)
  prs.a1.unit52.lesson01.teach.this_is_cinema_phrase:
    title: C’est un cinéma
    gloss: C’est un cinéma.
    note: Cette phrase associe ceci, est et cinéma, comme le cours le fait déjà pour d’autres mots.
  prs.a1.unit52.lesson01.teach.staff_at_cinema_phrase:
    title: L’employé est au cinéma
    gloss: L’employé est au cinéma.
    note: Cette phrase associe employé, dans et cinéma.
  prs.a1.unit52.lesson02.teach.review_price_and_schedule_words:
    title: 'Révision : combien, afghani, est, trente, cinq, heure, et, dans, film, programme, intéressant'
    gloss: combien / afghani / est / trente / cinq / heure / et / dans / film / programme / intéressant
    note: Ce sont des mots de révision (vus dans des unités précédentes) pour lire le programme du cinéma et demander un prix.
    target_text: چند (combien) / افغانی (afghani) / است (est) / سی (trente) / پنج (cinq) / ساعت (heure) / و (et) / در (dans / à) / فلم (film) / برنامه (programme) / جالب (intéressant)
  prs.a1.unit52.lesson02.teach.sky_word:
    title: Ciel
    gloss: ciel
    note: Le film de cette unité s’appelle Ciel, qui est le mot dari courant pour « ciel ».
    example_gloss: Le film Ciel est intéressant.
  prs.a1.unit52.lesson02.teach.its_ticket_word:
    title: Son billet
    gloss: son billet
    note: On retrouve le même suffixe possessif déjà vu dans ce cours, ajouté ici à « billet ».
    example_gloss: Son billet est bien.
  prs.a1.unit52.lesson02.teach.schedule_reading:
    title: Lire le programme du cinéma
    gloss: Au programme du cinéma, le film Ciel est à cinq heures et son billet coûte 30 afghanis.
  prs.a1.unit52.lesson02.teach.ask_sky_ticket_price_phrase:
    title: Combien coûte un billet pour le film Ciel ?
    gloss: Combien coûte un billet pour le film Ciel ?
    note: Cette phrase associe les mots vus plus tôt dans cette leçon.
  prs.a1.unit52.lesson02.teach.sky_ticket_price_answer_phrase:
    title: Son billet coûte 30 afghanis
    gloss: Son billet coûte 30 afghanis.
    note: Cette phrase indique le prix du billet du film d’après le programme.
  prs.a1.unit52.lesson03.teach.review_ask_want_setup:
    title: 'Révision : vous (forme de politesse), qu’est-ce que c’est, je, je veux, un/une'
    gloss: vous (politesse) / qu’est-ce que c’est / je / je veux / un/une
    note: Ce sont des mots de révision pour demander et dire quel film ou quel billet tu veux.
    target_text: شما (vous, formel) / چیست (qu'est-ce que) / من (je / moi) / می‌خواهم (je veux) / یک (un / une)
  prs.a1.unit52.lesson03.teach.review_which_and_you_want:
    title: 'Révision : quel, film, vous voulez (politesse)'
    gloss: quel / film / vous voulez (politesse)
    note: Ce sont des mots de révision pour demander quel film veut quelqu’un.
    target_text: کدام (quel) / فلم (film) / می‌خواهین (vous voulez, formel)
  prs.a1.unit52.lesson03.teach.which_film_phrase:
    title: Quel film voulez-vous ?
    gloss: Quel film voulez-vous ?
    note: Cette phrase reprend la construction de la question avec « quel » déjà vue dans ce cours, appliquée à « film ».
  prs.a1.unit52.lesson03.teach.want_sky_phrase:
    title: Je veux le film Ciel
    gloss: Je veux le film Ciel.
    note: 'Cette phrase reprend la construction avec « vouloir » déjà utilisée dans ce cours, avec un nouveau complément : le film Ciel.'
  prs.a1.unit52.lesson03.teach.review_ticket_please:
    title: 'Révision : billet, s’il vous plaît'
    gloss: billet / s’il vous plaît
    note: Ce sont des mots de révision pour demander un billet.
    target_text: تکت (billet) / لطفاً (s'il vous plaît)
  prs.a1.unit52.lesson03.teach.want_ticket_please_phrase:
    title: Je voudrais un billet, s’il vous plaît
    gloss: Je voudrais un billet, s’il vous plaît.
    note: Cette phrase associe billet, vouloir et s’il vous plaît.
  prs.a1.unit52.lesson04.teach.review_hello_want_ticket:
    title: 'Révision : bonjour, un/une, billet, je veux'
    gloss: bonjour / un/une / billet / je veux
    note: Ce sont des mots de révision pour ouvrir le dialogue.
    target_text: سلام (bonjour) / یک (un / une) / تکت (billet) / می‌خواهم (je veux)
  prs.a1.unit52.lesson04.teach.review_welcome_which_film:
    title: 'Révision : je vous en prie, quel, film, vous voulez (politesse)'
    gloss: je vous en prie / quel / film / vous voulez (politesse)
    note: Ce sont des mots de révision pour demander quel film veut le client.
    target_text: بفرمایین (je vous en prie / voici) / کدام (quel) / فلم (film) / می‌خواهین (vous voulez, formel)
  prs.a1.unit52.lesson04.teach.review_good_showtime_price:
    title: 'Révision : très bien, Ciel, heure, cinq, trente, afghani, est'
    gloss: très bien / Ciel / heure / cinq / trente / afghani / est
    note: Ce sont des mots de révision pour indiquer l’horaire et le prix du film.
    target_text: بسیار خوب (très bien) / آسمان (Ciel) / ساعت (heure) / پنج (cinq) / سی (trente) / افغانی (afghani) / است (est)
  prs.a1.unit52.lesson04.teach.review_thanks_welcome:
    title: 'Révision : merci beaucoup, de rien'
    gloss: merci beaucoup / de rien
    note: Ce sont des mots de révision pour conclure le dialogue.
    target_text: تشکر زیاد (merci beaucoup) / خواهش می‌کنم (de rien)
  prs.a1.unit52.lesson04.teach.dialogue_line1:
    title: 'Homayoun : Bonjour. Je voudrais un billet.'
    gloss: Bonjour. Je voudrais un billet.
  prs.a1.unit52.lesson04.teach.dialogue_line2:
    title: 'L’employé : Bonjour, je vous en prie. Quel film voulez-vous ?'
    gloss: Bonjour, je vous en prie. Quel film voulez-vous ?
  prs.a1.unit52.lesson04.teach.dialogue_line3:
    title: 'Homayoun : Je veux le film Ciel.'
    gloss: Je veux le film Ciel.
  prs.a1.unit52.lesson04.teach.dialogue_line4:
    title: 'L’employé : Très bien. Le film Ciel est à cinq heures. Le billet coûte 30 afghanis.'
    gloss: Très bien. Le film Ciel est à cinq heures. Le billet coûte 30 afghanis.
  prs.a1.unit52.lesson04.teach.dialogue_line5:
    title: 'Homayoun : Merci beaucoup.'
    gloss: Merci beaucoup.
  prs.a1.unit52.lesson04.teach.dialogue_line6:
    title: 'L’employé : De rien.'
    gloss: De rien.
  prs.a1.unit52.lesson05.teach.review_this_is_in_cinema:
    title: 'Révision : ceci, est, dans, cinéma'
    gloss: ceci / est / dans / cinéma
    note: Ce sont des mots de révision utilisés dans le texte à lire.
    target_text: این (ceci / c') / است (est) / در (dans / à) / سینما (cinéma)
  prs.a1.unit52.lesson05.teach.review_he_sky_showtime_ticket:
    title: 'Révision : il/elle, film, Ciel, cinq heures, son billet, 30 afghanis'
    gloss: il/elle / film / Ciel / cinq heures / son billet / 30 afghanis
    note: Ce sont des mots de révision (de cette unité) utilisés dans le texte à lire.
    target_text: او (il / elle) / فلم (film) / آسمان (Ciel) / ساعت پنج (cinq heures) / تکتش (son billet) / سی افغانی (30 afghanis)
  prs.a1.unit52.lesson05.teach.wants_3rd_person_word:
    title: Veut
    gloss: veut
    note: C’est la forme de la troisième personne au présent du verbe déjà vu pour « je veux ».
    example_gloss: Il/Elle veut un billet.
  prs.a1.unit52.lesson05.teach.reading_passage:
    title: 'Lecture : au cinéma'
    gloss: Homayoun est au cinéma. Il veut voir le film Ciel. Le film est à cinq heures. Son billet coûte 30 afghanis.
  prs.a1.unit52.lesson06.teach.review_but_second_showtime:
    title: 'Révision : mais, heure, huit, quarante, afghani, est'
    gloss: mais / heure / huit / quarante / afghani / est
    note: « Mais » est un mot de révision, déjà vu dans les unités précédentes.
    target_text: اما (mais) / ساعت (heure) / هشت (huit) / چهل (quarante) / افغانی (afghani) / است (est)
  prs.a1.unit52.lesson06.teach.showtime_price_contrast_phrase:
    title: Le billet de 5 heures coûte 30, mais celui de 8 heures coûte 40
    gloss: Le billet de 5 heures coûte 30 afghanis, mais le billet de 8 heures coûte 40 afghanis.
    note: « Mais » oppose le prix des deux séances.
  prs.a1.unit52.lesson06.teach.review_your_ticket_how_much:
    title: 'Révision : votre billet, combien'
    gloss: votre billet / combien
    note: « Votre billet » utilise le même suffixe de politesse que « votre billet de piscine » de l’unité 50, « votre linge » de l’unité 49 et « votre commande » de l’unité 51.
    target_text: تکت‌تان (votre billet) / چند (combien)
  prs.a1.unit52.lesson06.teach.your_ticket_question_phrase:
    title: Combien coûte votre billet ?
    gloss: Combien coûte votre billet ?
    note: C’est la forme de politesse, avec le suffixe, pour demander le prix d’un billet de cinéma.
