course:
  title: Dari en français A2
  description: 'Dari afghan, niveau pré-intermédiaire : demander des informations de façon indirecte et polie, par exemple « Savez-vous où est la gare ? ». La structure می‌دانین که ... avec une question intégrée inchangée (où, quand, pourquoi, quel, combien), « je ne sais pas que ... », oui ou non avec یا نه, et la demande polie می‌توانین بگویین که ... .'
units:
  prs.a2.unit38.asking_indirectly:
    title: Demander indirectement
lessons:
  prs.a2.unit38.lesson01.do_you_know_where:
    title: Savez-vous où est la gare ?
  prs.a2.unit38.lesson02.i_dont_know:
    title: je ne sais pas quand le bus part
  prs.a2.unit38.lesson03.yes_or_no:
    title: Ouvert ou non ?
  prs.a2.unit38.lesson04.polite_requests:
    title: Excusez-moi, pouvez-vous me dire ...
  prs.a2.unit38.lesson05.reading_and_listening:
    title: 'Lecture et écoute : un musée et une banque'
  prs.a2.unit38.lesson06.station_conversation:
    title: Une conversation à la gare
teaching:
  prs.a2.unit38.lesson01.teach.station:
    title: Gare
    gloss: gare, arrêt
    note: '*ایستگاه* signifie « gare » ou « arrêt ». Cette unité demande où se trouvent des lieux, et la gare est le premier : *ایستگاه بس* est la gare routière.'
    example_gloss: La gare est à Kaboul.
  prs.a2.unit38.lesson01.teach.museum:
    title: Musée
    gloss: musée
    note: '*موزیم* signifie « musée ». Le Musée national d’Afghanistan se trouve à Kaboul.'
    example_gloss: Le musée est à Kaboul.
  prs.a2.unit38.lesson01.teach.office:
    title: Bureau
    gloss: le bureau
    note: '*دفتر* signifie « bureau », par exemple le bureau des passeports ou le bureau d’une compagnie de bus.'
    example_gloss: Le bureau est près.
  prs.a2.unit38.lesson01.teach.library:
    title: Bibliothèque
    gloss: bibliothèque
    note: '*کتابخانه* signifie « bibliothèque ». *نزدیک* signifie « près ».'
    example_gloss: La bibliothèque est près.
  prs.a2.unit38.lesson01.teach.where:
    title: Où est-ce ?
    gloss: où est-ce ?
    note: '*کجا* signifie « où », et *کجاست* signifie « où est-ce ? » : *کجا* plus la forme courte de *است*. Mets d’abord le lieu : *ایستگاه کجاست؟* signifie « où est la gare ? ».'
    example_gloss: Où est le musée ?
  prs.a2.unit38.lesson01.teach.know:
    title: Savoir
    gloss: je sais
    note: '*دانستن* signifie savoir un fait : *می‌دانم* signifie « je sais ». Utilise-le pour des faits (où se trouve un lieu, quand part un bus), pas pour connaître une personne.'
    example_gloss: Je sais.
  prs.a2.unit38.lesson01.teach.know_paradigm:
    title: 'Savoir : می‌دانم'
    gloss: je sais, tu sais, il/elle sait, nous savons, vous savez (poli ou pluriel), ils savent
    note: 'Le présent de *دانستن* se forme avec *می‌* plus la terminaison : *می‌دانم، می‌دانی، می‌داند، می‌دانیم، می‌دانین، می‌دانند*. La terminaison de la 2e personne du pluriel est *-ین*. Avec un inconnu, une personne plus âgée ou un groupe, tu dis *می‌دانین* ; avec un ami proche, tu dis *می‌دانی*. Le pronom est facultatif.'
  prs.a2.unit38.lesson01.teach.direct_to_indirect:
    title: De la question directe à la question indirecte
    gloss: Où est la gare ? Savez-vous où est la gare ?
    note: 'Une question indirecte est plus douce et plus polie qu’une question directe. Commence par *می‌دانین که* (savez-vous que), puis place la question directe après, sans rien changer : *ایستگاه کجاست؟* devient *می‌دانین که ایستگاه کجاست؟*. Le mot interrogatif *کجا* reste à sa place, et l’ordre des mots reste celui d’une phrase affirmative.'
  prs.a2.unit38.lesson01.teach.do_you_know_museum:
    title: Savez-vous où est le musée ?
    gloss: Savez-vous où est le musée ?
    note: 'C’est la phrase modèle de l’unité. *که* (que) est facultatif : *می‌دانین موزیم کجاست؟* est aussi correct. Le point d’interrogation apparaît une seule fois, à la fin, car toute la phrase forme une seule question.'
  prs.a2.unit38.lesson01.teach.friend_or_polite:
    title: Ami ou forme polie
    gloss: 'Ami : sais-tu où est la bibliothèque ? Forme polie : savez-vous où est la bibliothèque ?'
    note: 'Seule la terminaison de *دانستن* change selon la personne à qui tu parles : *می‌دانی* pour un ami, *می‌دانین* pour quelqu’un à qui tu t’adresses poliment. Tout ce qui suit *که* reste identique.'
  prs.a2.unit38.lesson02.teach.know_not_know:
    title: Je sais / je ne sais pas
    gloss: Je sais où est le musée. Je ne sais pas où est le musée.
    note: 'La même structure sert pour une affirmation. *می‌دانم که* signifie « je sais que » et *نمی‌دانم که* « je ne sais pas que », avec *ن* devant le verbe. La question intégrée suit sans changement : *نمی‌دانم که موزیم کجاست.* Cette fois, la phrase se termine par un point, car c’est une affirmation.'
  prs.a2.unit38.lesson02.teach.order_unchanged:
    title: Le verbe reste comme dans la question directe
    gloss: Quand le musée ouvre-t-il ? Je ne sais pas quand le musée ouvre.
    note: 'Rien ne change dans la question intégrée. Le mot interrogatif garde sa place, le verbe garde son temps, et aucun subjonctif n’est nécessaire. Le dari ne modifie pas l’ordre des mots : la question directe et la question intégrée s’écrivent de la même façon.'
  prs.a2.unit38.lesson02.teach.when:
    title: Quand
    gloss: quand, à quel moment
    note: '*کی* signifie « quand ». Tu peux aussi demander l’heure avec *ساعت چند* : *بس ساعت چند حرکت می‌کند؟*'
    example_gloss: Quand le bus part-il ?
  prs.a2.unit38.lesson02.teach.opens:
    title: Ouvrir
    gloss: ouvre (devient ouvert)
    note: '*باز* signifie « ouvert » et *شدن* « devenir », donc *باز می‌شود* signifie « il ouvre ». Dis-le pour des bureaux, des musées, des banques et des magasins.'
    example_gloss: Le bureau ouvre à neuf heures.
  prs.a2.unit38.lesson02.teach.closes:
    title: Fermer
    gloss: ferme (devient fermé)
    note: '*بسته* signifie « fermé ». *بسته می‌شود* signifie « il ferme ». C’est le contraire de *باز می‌شود*.'
    example_gloss: Le bureau ferme à quatre heures.
  prs.a2.unit38.lesson02.teach.leaves:
    title: Partir
    gloss: part
    note: '*حرکت کردن* signifie « partir, se mettre en route ». On l’emploie pour les bus, les trains et les avions : *بس حرکت می‌کند* signifie « le bus part ».'
    example_gloss: Le bus part à huit heures.
  prs.a2.unit38.lesson02.teach.ticket:
    title: Billet
    gloss: billet
    note: '*بلیت* signifie « billet » : pour un bus, un avion ou un musée.'
    example_gloss: Le billet est au bureau.
  prs.a2.unit38.lesson02.teach.why:
    title: Pourquoi
    gloss: pourquoi
    note: '*چرا* signifie « pourquoi ». Dans une question intégrée, il garde sa place : *نمی‌دانم که چرا دفتر بسته است.*'
    example_gloss: Pourquoi le bureau est-il fermé ?
  prs.a2.unit38.lesson02.teach.which:
    title: Lequel / Quel
    gloss: quel / lequel
    note: '*کدام* signifie « quel » et se place avant le nom : *کدام بس* signifie « quel bus ».'
    example_gloss: Quel bus va à Mazar ?
  prs.a2.unit38.lesson02.teach.question_words:
    title: Mots interrogatifs après که
    gloss: Je ne sais pas combien coûte le billet. Je ne sais pas pourquoi le bureau est fermé. Je ne sais pas quel bus va à Mazar.
    note: 'Tous les mots interrogatifs de la question directe peuvent suivre *که* : *کجا* (où), *کی* (quand), *ساعت چند* (à quelle heure), *چند* (combien), *چرا* (pourquoi), *کدام* (quel). Chacun reste à sa place, et le reste de la phrase est une affirmation normale.'
  prs.a2.unit38.lesson03.teach.open:
    title: Ouvert
    gloss: ouvert
    note: '*باز* signifie « ouvert ». *باز است* signifie « il est ouvert ».'
    example_gloss: Le musée est ouvert aujourd’hui.
  prs.a2.unit38.lesson03.teach.closed:
    title: Fermé
    gloss: fermé
    note: '*بسته* signifie fermé. *بانک* est une banque.'
    example_gloss: La banque est fermée aujourd’hui.
  prs.a2.unit38.lesson03.teach.market:
    title: Marché
    gloss: marché, bazar
    note: '*بازار* est le marché ou le bazar.'
    example_gloss: Le marché est proche.
  prs.a2.unit38.lesson03.teach.yes_no:
    title: 'Questions oui/non : یا نه'
    gloss: Le bureau est-il ouvert ? Savez-vous si le bureau est ouvert ou non ?
    note: 'Une question oui/non n’a pas de mot interrogatif ; la forme indirecte ajoute donc *یا نه* (ou non) à la fin : *می‌دانین که دفتر باز است یا نه؟* signifie « Savez-vous si le bureau est ouvert ou non ? ». Ici, *که* et *یا نه* encadrent la proposition. *یا نه* est la façon habituelle de dire « si » en dari.'
  prs.a2.unit38.lesson03.teach.yes_no_negative:
    title: Je ne sais pas si
    gloss: Je ne sais pas si le bureau est ouvert ou non.
    note: 'La forme affirmative est la même : *نمی‌دانم که دفتر باز است یا نه.* Tout ce qui se trouve entre *که* et *یا نه* est la phrase ordinaire *دفتر باز است*.'
  prs.a2.unit38.lesson03.teach.aya:
    title: 'آیا : si'
    gloss: Le musée est-il ouvert ? Je ne sais pas si le musée est ouvert ou non.
    note: '*آیا* est un mot soutenu qui marque une question oui/non : *آیا موزیم باز است؟* Dans une question indirecte, tu peux l’ajouter après *که*, comme dans *که آیا موزیم باز است یا نه*, mais ce n’est pas obligatoire : *یا نه* suffit.'
  prs.a2.unit38.lesson03.teach.answer_yes_no:
    title: Oui, c’est ouvert. Non, c’est fermé.
    gloss: Oui, c’est ouvert. Non, c’est fermé.
    note: '*بلی* signifie oui et *نخیر* signifie non. Une réponse courte reprend l’adjectif : *باز است* (c’est ouvert) ou *بسته است* (c’est fermé).'
  prs.a2.unit38.lesson03.teach.know_open_today:
    title: Savez-vous si c’est ouvert aujourd’hui ?
    gloss: Savez-vous si c’est ouvert aujourd’hui ?
    note: 'Quand le lieu a déjà été mentionné, on peut l’omettre : *امروز باز است* signifie « c’est ouvert aujourd’hui ».'
  prs.a2.unit38.lesson04.teach.excuse:
    title: Excusez-moi
    gloss: excusez-moi, pardon
    note: '*ببخشین* signifie « excusez-moi ». On le dit à un inconnu avant de poser une question.'
    example_gloss: Excusez-moi, où est le bureau ?
  prs.a2.unit38.lesson04.teach.staff:
    title: Employé
    gloss: employé, employé de bureau
    note: '*کارمند* signifie employé. À un guichet, on s’adresse souvent à un *کارمند*.'
    example_gloss: L’employé est au bureau.
  prs.a2.unit38.lesson04.teach.polite_request:
    title: Pouvez-vous me dire… ?
    gloss: Excusez-moi, pouvez-vous me dire où est la gare ?
    note: Pour demander poliment à un inconnu, utilise *می‌توانین بگویین که* (pouvez-vous me dire) suivi de la question directe. C’est une demande, plus douce que *می‌دانین که*. *بگویین* est l’impératif de politesse de *گفتن*.
  prs.a2.unit38.lesson04.teach.polite_more:
    title: Demande avec d’autres questions
    gloss: Pouvez-vous me dire combien coûte le billet ? Pouvez-vous me dire si le bureau est ouvert ou non ?
    note: 'La même demande fonctionne avec toutes les questions indirectes de cette unité : *چند* (combien), *کی*, *کجا*, *چرا*, et la forme oui/non avec *یا نه*.'
  prs.a2.unit38.lesson04.teach.answer_politely:
    title: Répondre poliment
    gloss: Oui, je sais. La gare est proche. Désolé, je ne sais pas.
    note: Pour répondre à *می‌دانین که ...؟*, dis *بلی، می‌دانم* et donne l’information, ou *ببخشین، نمی‌دانم* si tu ne sais pas. Tu peux aussi dire *من هم نمی‌دانم* (je ne sais pas non plus).
  prs.a2.unit38.lesson04.teach.me_neither:
    title: Je ne sais pas non plus
    gloss: Je ne sais pas non plus.
    note: '*هم* signifie « aussi ». Avec un verbe négatif, il signifie « non plus » : *من هم نمی‌دانم* se traduit par « je ne sais pas non plus ».'
  prs.a2.unit38.lesson05.teach.first:
    title: D’abord
    gloss: d’abord, au début
    note: '*اول* signifie d’abord. *اول ... بعد ...* signifie d’abord… puis…'
    example_gloss: D’abord, je vais à la banque.
  prs.a2.unit38.lesson05.teach.then:
    title: Puis, ensuite
    gloss: puis, ensuite
    note: '*بعد* signifie puis ou ensuite.'
    example_gloss: Ensuite, je vais à la bibliothèque.
  prs.a2.unit38.lesson05.teach.museum_turn01:
    title: Samir demande à Samina où est le musée
    gloss: Samina, tu sais où est le musée ?
    note: Samir s’adresse à une amie, il utilise donc *می‌دانی*. La question indirecte est *موزیم کجاست؟*.
  prs.a2.unit38.lesson05.teach.museum_turn02:
    title: Samina répond
    gloss: Oui, le musée est près de la gare.
    note: 'Samina dit *بلی* et donne l’information : *نزدیک ایستگاه است* (c’est près de la gare).'
  prs.a2.unit38.lesson05.teach.museum_turn03:
    title: Samir demande l’heure d’ouverture
    gloss: Tu sais à quelle heure il ouvre ?
    note: Le musée a déjà été mentionné, donc Samir ne le répète pas. *ساعت چند باز می‌شود* est la question indirecte.
  prs.a2.unit38.lesson05.teach.museum_turn04:
    title: Samina ne sait pas
    gloss: Non, je ne sais pas à quelle heure il ouvre.
    note: Samina reprend la question indirecte après *نمی‌دانم که*. *نه* est un non amical.
  prs.a2.unit38.lesson05.teach.museum_turn05:
    title: Samir demande si c’est ouvert demain
    gloss: Tu sais si c’est ouvert demain ou non ?
    note: Une question oui/non avec *یا نه*. *فردا* signifie demain.
  prs.a2.unit38.lesson05.teach.museum_turn06:
    title: Samina va d’abord téléphoner
    gloss: Je ne sais pas. Je vais d’abord téléphoner.
    note: '*تیلفون می‌کنم* signifie « je téléphone ». *اول* signifie d’abord. Elle téléphonera avant de répondre.'
  prs.a2.unit38.lesson05.teach.message:
    title: Un message depuis le marché
    gloss: Salut Samina. Aujourd’hui, je suis au marché. Tu sais où est la banque ? Je ne sais pas si la banque est près du marché ou non. Tu sais si la banque est ouverte aujourd’hui ou non ? Ensuite, je vais à la bibliothèque.
    note: 'Un court message qui emploie trois questions indirectes : où est la banque, si elle est proche et si elle est ouverte. Remarque que la première est une question à une amie (*می‌دانی*) et que la deuxième est une affirmation (*نمی‌دانم که ... یا نه*).'
  prs.a2.unit38.lesson06.teach.gate:
    title: Portail, porte
    gloss: portail, porte
    note: '*دروازه* est un portail ou une grande porte, par exemple celle d’une gare ou d’un bureau.'
    example_gloss: Le portail est ouvert.
  prs.a2.unit38.lesson06.teach.thousand:
    title: Mille
    gloss: mille
    note: '*هزار* signifie mille. *افغانی* est la monnaie afghane : *هزار افغانی* signifie mille afghanis.'
    example_gloss: Le billet coûte mille afghanis.
  prs.a2.unit38.lesson06.teach.station_turn01:
    title: Samir interroge l’employé
    gloss: Excusez-moi, savez-vous quand part le bus pour Mazar ?
    note: Samir parle à un inconnu, il utilise donc *ببخشین* et *می‌دانین*. *بس به مزار* signifie le bus pour Mazar.
  prs.a2.unit38.lesson06.teach.station_turn02:
    title: L’employé répond
    gloss: Oui, je sais. Le bus part à huit heures.
    note: L’employé dit *بلی، می‌دانم* et donne l’heure.
  prs.a2.unit38.lesson06.teach.station_turn03:
    title: Samir demande le prix
    gloss: Pouvez-vous me dire combien coûte le billet ?
    note: 'Une demande polie : *می‌توانین بگویین که* suivi de *بلیت چند است؟*.'
  prs.a2.unit38.lesson06.teach.station_turn04:
    title: L’employé donne le prix
    gloss: Le billet coûte mille afghanis.
    note: Une réponse directe, sans question indirecte.
  prs.a2.unit38.lesson06.teach.station_turn05:
    title: Samir demande où est le bureau
    gloss: Merci. Savez-vous où est le bureau ?
    note: '*تشکر* signifie merci.'
  prs.a2.unit38.lesson06.teach.station_turn06:
    title: L’employé indique où est le bureau
    gloss: Le bureau est près du portail.
    note: '*نزدیک دروازه است* signifie « c’est près du portail ».'
exercises:
  prs.a2.unit38.lesson01.exercise01.recognize_station:
    instruction: Que signifie cette phrase ?
    correct_option: Savez-vous où est la gare ?
    distractors:
    - Où est la gare ?
    - Je sais où est la gare
    - La gare est proche
    accepted_answers:
    - value: Savez-vous où est la gare ?
      status: correct
    feedback: '*می‌دانین که ایستگاه کجاست؟* signifie « Savez-vous où est la gare ? ». On demande si l’autre personne le sait.'
  prs.a2.unit38.lesson01.exercise02.recognize_library_friend:
    instruction: Que signifie cette phrase ?
    correct_option: Tu sais où est la bibliothèque ? (à un ami)
    distractors:
    - Savez-vous où est la bibliothèque ? (poli)
    - Je ne sais pas où est la bibliothèque
    - La bibliothèque est-elle proche ?
    accepted_answers:
    - value: Tu sais où est la bibliothèque ? (à un ami)
      status: correct
    feedback: '*می‌دانی* porte la terminaison familière *-ی* : c’est la même question, adressée à un ami.'
  prs.a2.unit38.lesson01.exercise03.match_forms:
    instruction: Associe chaque mot dari à son sens.
    accepted_answers:
    - value:
        می‌دانم: je sais
        می‌دانی: tu sais (à un ami)
        می‌داند: il ou elle sait
        می‌دانیم: nous savons
        می‌دانین: vous savez (poli ou pluriel)
        می‌دانند: ils savent
        ایستگاه: gare
        موزیم: musée
        کتابخانه: bibliothèque
        دفتر: le bureau
      status: correct
    feedback: 'Seule la terminaison de *می‌دان-* change : *-م* je, *-ی* tu (ami), -د il ou elle, *-یم* nous, *-ین* vous (poli ou pluriel), *-ند* ils/elles.'
    pairs:
    - left: می‌دانم
      right: je sais
    - left: می‌دانی
      right: tu sais (à un ami)
    - left: می‌داند
      right: il ou elle sait
    - left: می‌دانیم
      right: nous savons
    - left: می‌دانین
      right: vous savez (poli ou pluriel)
    - left: می‌دانند
      right: ils savent
    - left: ایستگاه
      right: gare
    - left: موزیم
      right: musée
    - left: کتابخانه
      right: bibliothèque
    - left: دفتر
      right: le bureau
  prs.a2.unit38.lesson01.exercise04.order_do_you_know:
    instruction: 'Remets les mots dans l’ordre pour dire : Savez-vous où est la gare ?'
    accepted_answers:
    - value:
      - می‌دانین
      - که
      - ایستگاه
      - کجاست
      status: correct
    feedback: '*می‌دانین که ایستگاه کجاست؟* place d’abord le verbe, puis *که*, puis la question directe.'
  prs.a2.unit38.lesson01.exercise05.fill_where:
    instruction: 'Complète la phrase : Savez-vous où est le musée ?'
    accepted_answers:
    - value: کجاست
      status: correct
    feedback: '*کجاست* signifie « où est-il ». La question directe *موزیم کجاست؟* se place après *که*.'
  prs.a2.unit38.lesson01.exercise06.translate_museum:
    instruction: 'Traduis en dari, en utilisant می‌دانین : Savez-vous où est le musée ?'
    accepted_answers:
    - value: می‌دانین که موزیم کجاست؟
      status: correct
    - value: می‌دانین موزیم کجاست؟
