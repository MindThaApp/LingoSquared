    - left: مدت
      right: durée
    - left: شدید
      right: sévère
    - left: آزمایش
      right: examen médical
    - left: نسخه
      right: ordonnance
    - left: تجویز
      right: prescrire
  prs.a2.unit12.lesson01.exercise04.order_since_two_days:
    instruction: Mets les mots dans l’ordre pour dire « depuis deux jours ».
    accepted_answers:
    - value:
      - از
      - دو
      - روز
      - پیش
      status: correct
    feedback: '*از دو روز پیش* signifie « depuis deux jours ».'
  prs.a2.unit12.lesson01.exercise05.write_prescription:
    instruction: Écris en dari le mot qui signifie « ordonnance ».
    accepted_answers:
    - value: نسخه
      status: correct
    feedback: '*نسخه* signifie ordonnance.'
  prs.a2.unit12.lesson02.exercise01.recognize_headache_severe_since:
    instruction: Quelle phrase décrit un mal de tête fort qui dure depuis deux jours ?
    correct_option: Mon mal de tête est très fort et il a commencé il y a deux jours.
    distractors:
    - Dois-je faire des analyses ?
    - Je dois prendre ce médicament deux fois par jour.
    - La durée de ma maladie est de deux jours.
    accepted_answers:
    - value: Mon mal de tête est très fort et il a commencé il y a deux jours.
      status: correct
    feedback: '*سردردم خیلی شدید است و از دو روز پیش شروع شده.* décrit à la fois l’intensité et la durée.'
  prs.a2.unit12.lesson02.exercise02.order_take_medicine_twice:
    instruction: Mets les mots dans l’ordre pour dire que tu dois prendre ce médicament deux fois par jour.
    accepted_answers:
    - value:
      - باید
      - این
      - دوا
      - را
      - روزی
      - دو
      - بار
      - بخورم
      status: correct
    feedback: '*باید این دوا را روزی دو بار بخورم.* exprime la consigne.'
  prs.a2.unit12.lesson02.exercise03.dialogue_response_describe_problem:
    instruction: 'Le médecin demande : « Quel problème avez-vous ? » Décris ton mal de tête fort et dis depuis quand il a commencé.'
    accepted_answers:
    - value: سردردم خیلی شدید است و از دو روز پیش شروع شده.
      status: correct
    - value: سردردم خیلی شدید است. از دو روز پیش شروع شده.
      status: correct
    - value: سردردم خیلی شدید است، از دو روز پیش شروع شده.
      status: correct
    feedback: Relier l’intensité et la durée avec *و*, avec un point ou avec une virgule est tout aussi naturel.
  prs.a2.unit12.lesson02.exercise04.translate_need_test:
    instruction: 'Traduis : Ai-je besoin d''un examen ?'
    accepted_answers:
    - value: آیا باید آزمایش بدهم؟
      status: correct
    - value: آیا باید آزمایش بدهم
      status: correct
    feedback: '*آیا باید آزمایش بدهم؟* demande si une analyse est nécessaire.'
  prs.a2.unit12.lesson02.exercise05.write_take_medicine_twice:
    instruction: Écris en dari que tu dois prendre ce médicament deux fois par jour.
    accepted_answers:
    - value: باید این دوا را روزی دو بار بخورم.
      status: correct
    - value: باید این دوا را روزی دو بار بخورم
      status: correct
    feedback: '*باید این دوا را روزی دو بار بخورم.* exprime la consigne.'
  prs.a2.unit12.lesson03.exercise01.read_appointment_day:
    instruction: D’après l’avis, quel jour et à quelle heure est le rendez-vous ?
    correct_option: Mercredi à neuf heures du matin
    distractors:
    - Mercredi à neuf heures du soir
    - Jeudi à neuf heures du matin
    - Mercredi à dix heures du matin
    accepted_answers:
