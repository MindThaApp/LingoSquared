      status: correct
    feedback: '*نوبت داکتر شما روز چهارشنبه ساعت نه صبح است* -- mercredi à neuf heures du matin.'
  prs.a2.unit12.lesson03.exercise02.read_what_to_bring:
    instruction: D’après l’avis, que dois-tu apporter au rendez-vous ?
    correct_option: la tazkira (carte d’identité afghane)
    distractors:
