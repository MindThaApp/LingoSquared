    - une toux
    - aucun autre symptôme
    accepted_answers:
    - value: un peu de fièvre
      status: correct
    feedback: '*یک‌کمی تب دارم* -- J’ai un peu de fièvre.'
  prs.a2.unit12.lesson04.exercise04.order_since_when_question:
    instruction: Remets les mots dans l’ordre pour demander depuis quand un symptôme a commencé.
    accepted_answers:
    - value:
      - از
      - کی
      - شروع
      - شده
      status: correct
    feedback: '*از کی شروع شده؟* demande depuis quand.'
  prs.a2.unit12.lesson04.exercise05.dialogue_response_as_bashir:
    instruction: 'Le médecin demande : « Comment allez-vous ? Quel problème avez-vous ? » Réponds en tant que بشیر : salue le médecin avec respect et nomme ton symptôme.'
    accepted_answers:
    - value: سلام داکتر صاحب. سردردم خیلی شدید است.
      status: correct
    - value: سلام داکتر صاحب، سردردم خیلی شدید است.
      status: correct
    feedback: '*سلام داکتر صاحب. سردردم خیلی شدید است.* salue le médecin et nomme le symptôme ; une virgule convient aussi bien qu’un point.'
  prs.a2.unit12.lesson04.exercise06.write_doctor_instruction:
    instruction: Écris, en citant le médecin, à quelle fréquence il faut prendre le médicament.
    accepted_answers:
    - value: باید این دوا را روزی دو بار بخورین.
      status: correct
    - value: باید این دوا را روزی دو بار بخورین
      status: correct
    feedback: '*باید این دوا را روزی دو بار بخورین.* est la consigne du médecin, citée telle quelle.'
