    correct_option: confirmation
    distractors:
    - examen médical
    - symptôme
    - durée
    accepted_answers:
    - value: confirmation
      status: correct
    feedback: '*تاییدی* signifie confirmation.'
  prs.a2.unit12.lesson03.exercise04.order_appointment_day:
    instruction: Mets les mots dans l’ordre pour dire que votre rendez-vous chez le médecin est mercredi à neuf heures du matin.
    accepted_answers:
    - value:
      - نوبت
      - داکتر
      - شما
      - روز
      - چهارشنبه
      - ساعت
      - نه
      - صبح
      - است
      status: correct
    feedback: '*نوبت داکتر شما روز چهارشنبه ساعت نه صبح است* indique le rendez-vous, exactement comme dans l’avis.'
  prs.a2.unit12.lesson03.exercise05.write_call_if_cannot_come:
    instruction: Écris en dari que si tu ne peux pas venir, tu dois appeler un jour à l’avance.
    accepted_answers:
    - value: اگر نتوانین بیایین، یک روز پیش زنگ بزنین.
      status: correct
    - value: اگر نتوانین بیایین. یک روز پیش زنگ بزنین.
      status: correct
    - value: اگر نتوانین بیایین و یک روز پیش زنگ بزنین
      status: correct
    feedback: Relier la condition et la consigne avec une virgule, un point ou *و* est tout aussi naturel.
  prs.a2.unit12.lesson04.exercise01.comprehend_since_when:
    instruction: Depuis quand بشیر a-t-il mal à la tête ?
    correct_option: depuis deux jours
    distractors:
    - depuis hier
    - depuis une semaine
    - depuis ce matin
    accepted_answers:
    - value: depuis deux jours
      status: correct
    feedback: '*از دو روز پیش* -- depuis deux jours.'
  prs.a2.unit12.lesson04.exercise02.comprehend_medicine_instructions:
    instruction: À quelle fréquence بشیر doit-il prendre le médicament ?
    correct_option: deux fois par jour
    distractors:
    - une fois par jour
    - trois fois par jour
    - une fois par semaine
    accepted_answers:
