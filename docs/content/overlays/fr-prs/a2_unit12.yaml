course:
  title: Dari en français A2
  description: 'Dari afghan, niveau intermédiaire inférieur : une consultation chez le médecin — vocabulaire, description détaillée d’un symptôme, lecture d’une confirmation de rendez-vous et consultation elle-même.'
units:
  prs.a2.unit12.doctor:
    title: Chez le médecin
lessons:
  prs.a2.unit12.lesson01.doctor_vocabulary:
    title: Les mots de la consultation médicale
  prs.a2.unit12.lesson02.describing_a_symptom:
    title: Décrire un symptôme
  prs.a2.unit12.lesson03.reading_an_appointment_confirmation:
    title: Lire une confirmation de rendez-vous
  prs.a2.unit12.lesson04.doctor_visit_dialogue:
    title: La consultation
teaching:
  prs.a2.unit12.lesson01.teach.symptom_word:
    title: Symptôme
    gloss: symptôme
    note: '*علامت* est le mot général pour un symptôme ou un signe de maladie.'
    example_gloss: Le symptôme de Bashir est un mal de tête.
  prs.a2.unit12.lesson01.teach.duration_word:
    title: Durée
    gloss: durée
    note: '*مدت* demande ou indique depuis combien de temps quelque chose dure.'
    example_gloss: La durée de ma maladie est de deux jours.
  prs.a2.unit12.lesson01.teach.severe_word:
    title: Sévère
    gloss: sévère, intense
    note: '*شدید* décrit un symptôme fort ou sévère.'
    example_gloss: Mon mal de tête est très fort.
  prs.a2.unit12.lesson01.teach.exam_word:
    title: Examen médical
    gloss: examen médical
    note: '*آزمایش* est un examen médical, par exemple une analyse de sang.'
    example_gloss: Le médecin veut une analyse de sang.
  prs.a2.unit12.lesson01.teach.prescription_slip_word:
    title: Ordonnance
    gloss: ordonnance (le papier écrit)
    note: '*نسخه* est l’ordonnance écrite elle-même, le papier remis par le médecin.'
    example_gloss: Le médecin m’a rédigé une ordonnance.
  prs.a2.unit12.lesson01.teach.prescribe_word:
    title: Prescrire
    gloss: prescrire
    note: '*تجویز* désigne l’action de prescrire un médicament ou un traitement.'
    example_gloss: Le médecin a prescrit un nouveau médicament.
  prs.a2.unit12.lesson01.teach.since_ago_grammar:
    title: « Depuis ... » avec از ... پیش
    gloss: depuis deux jours
    note: '*از ... پیش* -- « depuis ... » -- sert à indiquer depuis combien de temps dure un symptôme.'
    target_text: از دو روز پیش (depuis deux jours)
  prs.a2.unit12.lesson02.teach.headache_severe_since:
    title: Décrire un symptôme intense et persistant
    gloss: Mon mal de tête est très fort et il a commencé il y a deux jours.
    note: Associe *شدید* (fort, intense) à la construction de durée *از ... پیش*.
  prs.a2.unit12.lesson02.teach.need_test_question:
    title: Demander si une analyse est nécessaire
    gloss: Pour ce problème, dois-je faire des analyses ?
    note: '*آیا* introduit une question fermée (oui/non) ; *باید* signifie « devoir ».'
  prs.a2.unit12.lesson02.teach.take_medicine_twice:
    title: Dire comment prendre le médicament
    gloss: Je dois prendre ce médicament deux fois par jour.
    note: '*روزی دو بار* signifie « deux fois par jour » -- littéralement « par jour, deux fois ».'
  prs.a2.unit12.lesson03.teach.confirmation_word:
    title: Confirmation
    gloss: confirmation
    note: '*تاییدی* est une confirmation écrite, par exemple d’un rendez-vous.'
    example_gloss: La confirmation de mon rendez-vous est arrivée.
  prs.a2.unit12.lesson03.teach.checkup_word:
    title: Examen / bilan de santé
    gloss: examen médical / bilan de santé
    note: '*معاینه* est l’examen physique effectué par le médecin.'
    example_gloss: Le médecin a fait un bref examen.
  prs.a2.unit12.lesson03.teach.notice_text:
    title: Un avis de confirmation de rendez-vous
    gloss: Votre rendez-vous chez le médecin est mercredi à neuf heures du matin. Veuillez apporter votre tazkira (carte d’identité afghane). Si vous ne pouvez pas venir, appelez un jour à l’avance.
    note: Un court avis officiel de rendez-vous, dans le registre écrit formel que cette unité enseigne.
  prs.a2.unit12.lesson04.teach.turn01:
    title: Le médecin salue بشیر
    gloss: Le médecin le salue et lui demande quel problème il a.
    note: '*چطور استین؟* est la question de salutation polie « comment allez-vous ? ».'
  prs.a2.unit12.lesson04.teach.turn02:
    title: بشیر rend le salut et nomme son symptôme
    gloss: Il salue le médecin avec respect et dit que son mal de tête est très fort.
    note: '*داکتر صاحب* est la forme d’adresse respectueuse afghane pour s’adresser à un médecin.'
  prs.a2.unit12.lesson04.teach.turn03:
    title: Le médecin demande depuis quand
    gloss: Le médecin demande depuis quand cela a commencé.
    note: '*از کی...؟* signifie « depuis quand ? ».'
  prs.a2.unit12.lesson04.teach.turn04:
    title: بشیر répond
    gloss: Depuis deux jours.
    note: Utilise la construction de durée *از ... پیش* (« depuis ... »).
  prs.a2.unit12.lesson04.teach.turn05:
    title: Le médecin interroge sur la fièvre
    gloss: Le médecin demande aussi s’il a de la fièvre.
    note: '*آیا ... هم ...؟* demande « est-ce qu’il y a aussi... ? ».'
  prs.a2.unit12.lesson04.teach.turn06:
    title: بشیر confirme avoir un peu de fièvre
    gloss: Oui, il a un peu de fièvre.
    note: '*یک‌کمی* signifie « un peu ».'
  prs.a2.unit12.lesson04.teach.turn07:
    title: Le médecin donne ses instructions
    gloss: Il doit prendre ce médicament deux fois par jour. S’il ne va pas mieux, il doit revenir.
    note: '*اگر بهتر نشدین، دوباره بیایین* -- « si vous n’allez pas mieux, revenez » -- utilise la construction conditionnelle avec *اگر* (« si »).'
  prs.a2.unit12.lesson04.teach.turn08:
    title: بشیر remercie le médecin
    gloss: بشیر remercie le médecin avec respect.
    note: '*داکتر صاحب* s’adresse de nouveau au médecin avec respect.'
exercises:
