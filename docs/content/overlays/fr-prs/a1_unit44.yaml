course:
  title: Dari A1
  description: 'Dari de Kaboul pour débutants : trier les déchets ménagers dans la bonne poubelle, demander dans quelle poubelle va un objet et lire un court calendrier de collecte à deux éléments. Tu parleras des déchets, du papier, du plastique et du verre, et tu confirmeras avec un ami le tri entre poubelle verte et poubelle bleue.'
units:
  prs.a1.unit44.waste_disposal:
    title: Le tri des déchets
    description: Trie les déchets ménagers dans la bonne poubelle, demande dans quelle poubelle va un objet et comprends un calendrier de collecte des déchets simple.
lessons:
  prs.a1.unit44.lesson01.waste_bin_vocabulary:
    title: 'Vocabulaire : déchets, poubelle et plastique'
  prs.a1.unit44.lesson02.paper_and_glass:
    title: Papier, verre et poubelle bleue
  prs.a1.unit44.lesson03.throwing_away_waste:
    title: Jeter les déchets
  prs.a1.unit44.lesson04.waste_sorting_dialogue:
    title: Dialogue sur le tri des déchets
  prs.a1.unit44.lesson05.reading:
    title: 'Lecture : Wahid et les déchets'
  prs.a1.unit44.lesson06.wrap_up:
    title: Récapitulatif
teaching:
  prs.a1.unit44.lesson01.teach.review_is_in:
    title: 'Révision : est, dans'
    gloss: est / dans
    note: است et در (employés tout au long de ce cours) sont des mots de révision qui servent à dire où se trouve quelque chose.
    target_text: است (est) / در (dans)
  prs.a1.unit44.lesson01.teach.review_colors:
    title: 'Révision : couleur, vert, bleu'
    gloss: couleur / vert / bleu
    note: رنگ, سبز et آبی sont des mots de révision qui servent à nommer les deux poubelles de tri.
    target_text: رنگ (couleur) / سبز (vert) / آبی (bleu)
  prs.a1.unit44.lesson01.teach.bin_word:
    title: Poubelle
    gloss: poubelle
    note: سطل est le mot dari courant pour désigner une poubelle ou un seau.
    example_gloss: La poubelle est verte.
  prs.a1.unit44.lesson01.teach.waste_word:
    title: Déchets / ordures
    gloss: déchets / ordures
    note: زباله désigne les déchets ménagers, les ordures.
    example_gloss: Les ordures sont dans la poubelle.
  prs.a1.unit44.lesson01.teach.green_bin_phrase:
    title: Poubelle verte
    gloss: poubelle verte
    note: سطل سبز associe سطل (poubelle) et سبز (vert).
  prs.a1.unit44.lesson01.teach.plastic_word:
    title: Plastique
    gloss: plastique
    note: پلاستیک est un emprunt courant, utilisé dans toutes les variétés du persan, y compris le dari.
    example_gloss: Le plastique est dans la poubelle bleue.
  prs.a1.unit44.lesson01.teach.waste_in_green_bin_phrase:
    title: Les ordures sont dans la poubelle verte
    gloss: Les ordures sont dans la poubelle verte.
    note: زباله در سطل سبز است réunit les mots appris plus tôt dans cette leçon.
  prs.a1.unit44.lesson02.teach.review_which_in_is:
    title: 'Révision : quel, dans, est'
    gloss: quel / dans / est
    note: کدام, در et است sont des mots de révision qui servent à demander dans quelle poubelle va un objet.
    target_text: کدام (quel) / در (dans) / است (est)
  prs.a1.unit44.lesson02.teach.paper_word:
    title: Le papier
    gloss: le papier
    note: کاغذ est le mot dari courant pour désigner le papier.
    example_gloss: Le papier est dans la poubelle.
  prs.a1.unit44.lesson02.teach.glass_word:
    title: Verre
    gloss: verre
    note: شیشه est le mot dari courant pour désigner le verre.
    example_gloss: Le verre est dans la poubelle.
  prs.a1.unit44.lesson02.teach.blue_bin_phrase:
    title: Poubelle bleue
    gloss: poubelle bleue
    note: سطل آبی associe سطل (poubelle) et آبی (bleu) ; elle sert aux matériaux recyclables comme le papier, le plastique et le verre.
  prs.a1.unit44.lesson02.teach.ask_which_bin_paper_phrase:
    title: Dans quelle poubelle est le papier ?
    gloss: Dans quelle poubelle est le papier ?
    note: کاغذ در کدام سطل است؟ sert à demander dans quelle poubelle va un objet.
  prs.a1.unit44.lesson02.teach.paper_blue_bin_phrase:
    title: Le papier est dans la poubelle bleue
    gloss: Le papier est dans la poubelle bleue.
    note: کاغذ در سطل آبی است répond à la question en donnant la bonne poubelle.
  prs.a1.unit44.lesson02.teach.glass_blue_bin_phrase:
    title: Le verre est dans la poubelle bleue
    gloss: Le verre est dans la poubelle bleue.
    note: شیشه در سطل آبی است suit le même modèle que la phrase sur le papier.
  prs.a1.unit44.lesson03.teach.review_object_marker_put:
    title: 'Révision : marque de l''objet, je mets / je jette'
    gloss: (marque de l'objet) / je mets / je jette
    note: 'را et می‌اندازم (vu à l''unité 36, où il signifiait « j''ajoute du sel ») sont des mots de révision : انداختن couvre réellement à la fois « ajouter / mettre » et « jeter ».'
    target_text: را (marqueur de l’objet) / می‌اندازم (je mets / je jette)
  prs.a1.unit44.lesson03.teach.away_word:
    title: Loin / au rebut
    gloss: away
    note: دور (loin, au rebut) se combine avec می‌اندازم dans la construction usuelle دور انداختن (« jeter »).
    example_gloss: Je le jette.
  prs.a1.unit44.lesson03.teach.throw_away_waste_phrase:
    title: Je jette les déchets
    gloss: Je jette les déchets.
    note: زباله را دور می‌اندازم réunit زباله را, دور et می‌اندازم.
  prs.a1.unit44.lesson03.teach.put_plastic_green_bin_phrase:
    title: Je mets le plastique dans la poubelle bleue
    gloss: Je mets le plastique dans la poubelle bleue.
    note: پلاستیک را در سطل آبی می‌اندازم emploie می‌اندازم au sens de « mettre dans ».
  prs.a1.unit44.lesson03.teach.put_paper_blue_bin_phrase:
    title: Je mets le papier dans la poubelle bleue
    gloss: Je mets le papier dans la poubelle bleue.
    note: کاغذ را در سطل آبی می‌اندازم suit le même modèle avec la poubelle bleue.
  prs.a1.unit44.lesson03.teach.review_negative_put:
    title: 'Révision : je ne mets pas / je ne jette pas'
    gloss: je ne mets pas / je ne jette pas
    note: نمی‌اندازم est la forme négative régulière en نمی- de می‌اندازم.
    target_text: نمی‌اندازم (je ne mets pas / je ne jette pas)
  prs.a1.unit44.lesson03.teach.not_glass_green_bin_phrase:
    title: Je ne mets pas le verre dans la poubelle verte
    gloss: Je ne mets pas le verre dans la poubelle verte.
    note: شیشه را در سطل سبز نمی‌اندازم énonce une règle de tri à la forme négative.
  prs.a1.unit44.lesson03.teach.glass_blue_bin_action_phrase:
    title: Je mets le verre dans la poubelle bleue
    gloss: Je mets le verre dans la poubelle bleue.
    note: شیشه را در سطل آبی می‌اندازم donne le bon geste pour le verre.
  prs.a1.unit44.lesson04.teach.review_this:
    title: 'Révision : ce / cette'
    gloss: ce / cette
    note: این est un mot de révision utilisé dans le dialogue.
    target_text: این (ceci)
  prs.a1.unit44.lesson04.teach.review_very_good_thanks_welcome:
    title: 'Révision : très, bien, merci beaucoup, de rien'
    gloss: très / bien / merci beaucoup / de rien
    note: بسیار, خوب, تشکر زیاد et خواهش می‌کنم sont des mots de révision qui servent à conclure le dialogue.
    target_text: بسیار (très) / خوب (bien / bon) / تشکر زیاد (merci beaucoup) / خواهش می‌کنم (je vous en prie)
  prs.a1.unit44.lesson04.teach.dialogue_line1:
    title: 'Wahid : Shukria, dans quelle poubelle est-ce que je mets ce verre ?'
    gloss: Shukria, dans quelle poubelle est-ce que je mets ce verre ?
  prs.a1.unit44.lesson04.teach.dialogue_line2:
    title: 'Shukria : Le verre va dans la poubelle bleue.'
    gloss: Le verre va dans la poubelle bleue.
  prs.a1.unit44.lesson04.teach.dialogue_line3:
    title: 'Wahid : Dans quelle poubelle est-ce que je mets ces déchets ?'
    gloss: Dans quelle poubelle est-ce que je mets ces déchets ?
  prs.a1.unit44.lesson04.teach.dialogue_line4:
    title: 'Shukria : Les ordures vont dans la poubelle verte.'
    gloss: Les ordures vont dans la poubelle verte.
  prs.a1.unit44.lesson04.teach.dialogue_line5:
    title: 'Wahid : Très bien. Merci beaucoup.'
    gloss: Très bien. Merci beaucoup.
  prs.a1.unit44.lesson04.teach.dialogue_line6:
    title: 'Shukria : De rien.'
    gloss: De rien.
  prs.a1.unit44.lesson05.teach.review_wahid_he_she_every_day:
    title: 'Révision : Wahid, il/elle, chaque jour, aussi, content'
    gloss: Wahid / il/elle / chaque jour / aussi / content
    note: وحید, او, هر روز, هم et خوشحال sont des mots de révision utilisés dans le texte à lire.
    target_text: وحید (Wahid) / او (il / elle) / هر روز (chaque jour) / هم (aussi) / خوشحال (heureux / heureuse)
  prs.a1.unit44.lesson05.teach.review_throws_third_person:
    title: 'Révision : il/elle jette'
    gloss: il/elle met / jette
    note: می‌اندازد est la forme de la 3e personne de la famille می‌اندازم/نمی‌اندازم vue plus tôt dans cette unité.
    target_text: می‌اندازد (il / elle met / jette)
  prs.a1.unit44.lesson05.teach.reading_passage:
    title: 'Lecture : Wahid et les déchets'
    gloss: Wahid jette les déchets chaque jour. Le papier est dans la poubelle bleue. Le plastique aussi est dans la poubelle bleue. Les ordures sont dans la poubelle verte. Wahid est content.
  prs.a1.unit44.lesson06.teach.review_days_but_formal_you:
    title: 'Révision : lundi, mardi, mais, vous (forme de politesse)'
    gloss: lundi / mardi / mais / vous (forme de politesse)
    note: دوشنبه, سه‌شنبه, اما et شما sont des mots de révision qui servent à énoncer un calendrier à deux éléments.
    target_text: دوشنبه (lundi) / سه‌شنبه (mardi) / اما (mais) / شما (vous, forme de politesse)
  prs.a1.unit44.lesson06.teach.collection_word:
    title: Collecte
    gloss: collecte
    note: جمع‌آوری signifie collecte ou ramassage ; il s'emploie pour le jour de collecte des déchets, comme « collecte des ordures » en français.
    example_gloss: Le jour de collecte est lundi.
  prs.a1.unit44.lesson06.teach.paper_collection_day_phrase:
    title: Le jour de collecte du papier est lundi
    gloss: Le jour de collecte du papier est le lundi.
    note: روز جمع‌آوری کاغذ دوشنبه است désigne l’objet collecté et son jour de collecte.
  prs.a1.unit44.lesson06.teach.waste_collection_day_phrase:
    title: Le jour de collecte des ordures est le mardi
    gloss: Le jour de collecte des ordures est le mardi.
    note: روز جمع‌آوری زباله سه‌شنبه است suit le même schéma pour les ordures.
  prs.a1.unit44.lesson06.teach.contrast_schedule_phrase:
    title: Le papier le lundi, mais les ordures le mardi
    gloss: Le jour de collecte du papier est le lundi, mais celui des ordures est le mardi.
    note: اما oppose les deux jours de collecte.
  prs.a1.unit44.lesson06.teach.review_throw_formal:
    title: 'Révision : vous jetez / mettez (forme de politesse)'
    gloss: vous jetez / mettez (politesse)
    note: می‌اندازین est la forme de politesse (pluriel) ; elle prolonge la même famille en -ین que می‌خواهین et کنین.
    target_text: می‌اندازین (vous mettez / vous jetez, forme de politesse)
  prs.a1.unit44.lesson06.teach.formal_question_phrase:
    title: Quel jour jetez-vous les ordures ?
    gloss: Quel jour jetez-vous les ordures ?
    note: Voici la version de politesse, avec شما, pour demander quel jour on jette les ordures.
