teaching:
  prs.a2.unit17.lesson01.teach.week_word:
    title: Semaine
    gloss: semaine
    note: '*هفته* signifie « semaine ».'
    example_gloss: Je suis très occupé(e) cette semaine.
  prs.a2.unit17.lesson01.teach.weekend_word:
    title: Week-end
    gloss: le week-end
    note: '*آخر هفته* signifie littéralement « fin de la semaine ».'
    example_gloss: Je me repose le week-end.
  prs.a2.unit17.lesson01.teach.schedule_word:
    title: Horaire
    gloss: horaire
    note: '*برنامه* s’emploie pour un emploi du temps, un projet ou un programme.'
    example_gloss: Mon emploi du temps de la semaine est chargé.
  prs.a2.unit17.lesson01.teach.first_word:
    title: D’abord
    gloss: d’abord
    note: '*اول* ouvre une suite d’étapes.'
    example_gloss: D’abord, je prends le petit-déjeuner.
  prs.a2.unit17.lesson01.teach.then_word:
    title: Ensuite
    gloss: puis
    note: '*بعد* poursuit une suite après *اول*.'
    example_gloss: Ensuite, je vais au bureau.
  prs.a2.unit17.lesson01.teach.finally_word:
    title: Enfin
    gloss: enfin
    note: '*در آخر* clôt une séquence – *اول ... بعد ... در آخر* est le schéma de séquence de niveau A2 de cette unité.'
    example_gloss: Enfin, j’étudie un peu.
  prs.a2.unit17.lesson01.teach.sequence_grammar:
    title: Une phrase séquencée complète
    gloss: En semaine, d’abord je vais au bureau, ensuite je fais du sport, et enfin j’étudie un peu.
    note: '*اول ... بعد ... و در آخر* enchaîne trois activités dans une seule phrase – c’est l’étape grammaticale centrale de niveau A2 de cette unité.'
  prs.a2.unit17.lesson01.teach.days_word:
    title: Jours de semaine
    gloss: jours de semaine
    note: '*روزهای هفته* – littéralement « les jours de la semaine » – désigne les jours ouvrables, par opposition à *آخر هفته*.'
    example_gloss: En semaine, je suis occupé(e) par le travail.
  prs.a2.unit17.lesson02.teach.ask_weekly_schedule:
    title: Demander à quelqu’un son emploi du temps de la semaine
    gloss: Comment est ton emploi du temps de la semaine ?
    note: '*تو* est le « tu » familier, utilisé entre amis.'
  prs.a2.unit17.lesson02.teach.weekday_full_sentence:
    title: Décrire une suite d’actions en semaine
    gloss: En semaine, d’abord je vais au bureau, ensuite je fais du sport.
    note: Reprend le schéma de séquence de la leçon 1 avec *اول* et *بعد*.
  prs.a2.unit17.lesson02.teach.weekend_activity:
    title: Décrire une activité du week-end
    gloss: Le week-end, je me lève tard et je passe du temps avec ma famille.
    note: '*دیر بیدار می‌شوم* – « je me réveille tard » – s’oppose directement au réveil matinal en semaine dans le texte de la leçon 3.'
  prs.a2.unit17.lesson03.teach.difference_word:
    title: Différence
    gloss: différence
    note: '*تفاوت* signifie « différence ».'
    example_gloss: Il y a une grande différence entre la semaine et le week-end.
  prs.a2.unit17.lesson03.teach.rest_word:
    title: Se reposer
    gloss: se reposer
    note: '*استراحت کردن* signifie « se reposer » ou « se détendre ».'
    example_gloss: Je me repose le week-end.
  prs.a2.unit17.lesson03.teach.comparison_text:
    title: Un court texte comparant la semaine de همایون
    gloss: En semaine, همایون se réveille tôt et va au bureau. Mais le week-end, il se réveille tard et se repose.
    note: Un court texte descriptif qui oppose les routines de la semaine et du week-end, dans le registre de lecture enseigné dans cette unité.
  prs.a2.unit17.lesson04.teach.turn01:
    title: زرمینه interroge همایون sur sa semaine
    gloss: زرمینه demande comment est son emploi du temps de la semaine.
    note: Reprend exactement la question de la leçon 2, avec le registre familier en *تو* déjà établi pour ce duo d’amis.
  prs.a2.unit17.lesson04.teach.turn02:
    title: همایون décrit ses jours de semaine
    gloss: En semaine, d’abord il va au bureau, ensuite il fait du sport.
    note: Reprend exactement la phrase de la leçon 2.
  prs.a2.unit17.lesson04.teach.turn03:
    title: زرمینه l’interroge sur son week-end
    gloss: زرمینه demande ce qu’il fait le week-end.
    note: '*چه کار می‌کنی؟* signifie « que fais-tu ? »'
  prs.a2.unit17.lesson04.teach.turn04:
    title: همایون décrit son week-end et pose la question en retour
    gloss: Le week-end, il se lève tard et passe du temps avec sa famille. Il lui pose la même question.
    note: Reprend exactement la phrase du week-end de la leçon 2.
  prs.a2.unit17.lesson04.teach.turn05:
    title: زرمینه décrit ses jours de semaine
    gloss: En semaine, d’abord elle travaille, puis elle rentre à la maison et cuisine.
    note: '*آشپزی* signifie « cuisine » (le fait de cuisiner).'
  prs.a2.unit17.lesson04.teach.turn06:
    title: زرمینه décrit son week-end
    gloss: Le week-end, elle va au marché avec ses amies.
    note: '*دوستانم* – « mes amis » – ajoute le suffixe possessif *-َم* à *دوستان* (amis).'
  prs.a2.unit17.lesson04.teach.turn07:
    title: همایون approuve
    gloss: همایون dit qu’elle a un bon emploi du temps.
    note: '*برنامهٔ خوبی داری!* signifie « tu as un bon emploi du temps ! »'
