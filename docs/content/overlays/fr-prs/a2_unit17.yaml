course:
  title: Dari en français A2
  description: 'Dari afghan niveau pré-intermédiaire : décrire un emploi du temps hebdomadaire — connecteurs de séquence, contraste entre semaine et week-end, lecture d’une comparaison hebdomadaire et vraie conversation entre deux amis sur leurs semaines.'
