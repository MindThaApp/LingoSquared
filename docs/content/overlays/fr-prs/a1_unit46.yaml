course:
  title: Dari A1
  description: 'Dari de Kaboul pour débutants : demander un médicament simple à un pharmacien, décrire un symptôme simple (mal de tête, de ventre ou de dents), demander un comprimé ou un sirop et comprendre une indication de posologie simple.'
units:
  prs.a1.unit46.pharmacy:
    title: Pharmacie et médicaments
    description: Demander un médicament simple à un pharmacien, décrire un symptôme simple, demander un comprimé ou un sirop et comprendre une indication de posologie simple.
lessons:
  prs.a1.unit46.lesson01.pharmacy_and_pharmacist_vocabulary:
    title: Pharmacie et pharmacien
  prs.a1.unit46.lesson02.symptom_vocabulary:
    title: Mal de tête, de ventre et de dents
  prs.a1.unit46.lesson03.medicine_forms:
    title: Comprimé et sirop
  prs.a1.unit46.lesson04.pharmacy_dialogue:
    title: Dialogue à la pharmacie
  prs.a1.unit46.lesson05.reading:
    title: Lire une ordonnance
  prs.a1.unit46.lesson06.wrap_up:
    title: Récapitulatif
teaching:
  prs.a1.unit46.lesson01.teach.review_this_is_in:
    title: 'Révision : ceci, est, dans'
    gloss: ceci / est / dans
    note: این, است et در (utilisés tout au long de ce cours) sont des mots de révision qui servent à parler de la pharmacie.
    target_text: این (ceci) / است (est) / در (dans)
  prs.a1.unit46.lesson01.teach.pharmacy_word:
    title: Pharmacie
    gloss: pharmacie
    note: دواخانه signifie littéralement « maison du médicament » ; il est construit comme کتابخانه (« maison des livres », bibliothèque, unité 43).
    example_gloss: C'est une pharmacie.
  prs.a1.unit46.lesson01.teach.this_is_pharmacy_phrase:
    title: C’est une pharmacie
    gloss: C’est une pharmacie.
    note: این دواخانه است combine les mots appris plus tôt dans cette leçon.
  prs.a1.unit46.lesson01.teach.pharmacist_word:
    title: Pharmacien
    gloss: pharmacien
    note: دواساز signifie littéralement « fabricant de médicaments ».
    example_gloss: Le pharmacien est dans la pharmacie.
  prs.a1.unit46.lesson01.teach.pharmacist_in_pharmacy_phrase:
    title: Le pharmacien est dans la pharmacie
    gloss: Le pharmacien est dans la pharmacie.
    note: دواساز در دواخانه است combine دواساز (pharmacien) et دواخانه (pharmacie).
  prs.a1.unit46.lesson01.teach.review_medicine_want:
    title: 'Révision : médicament, je veux'
    gloss: médicament / je veux
    note: دوا et می‌خواهم sont des mots de révision qui servent à demander un médicament.
    target_text: دوا (médicament) / می‌خواهم (je veux)
  prs.a1.unit46.lesson01.teach.want_medicine_phrase:
    title: Je veux un médicament
    gloss: Je veux un médicament.
    note: دوا می‌خواهم combine دوا (médicament) et می‌خواهم (je veux).
  prs.a1.unit46.lesson02.teach.review_headache_stomachache_have:
    title: 'Révision : mal de tête, mal de ventre, j’ai, vous avez'
    gloss: mal de tête / mal de ventre / j’ai / vous avez (politesse)
    note: سردرد, دل‌درد, دارم et دارین sont des mots de révision qui servent à décrire un symptôme.
    target_text: سردرد (mal de tête) / دل‌درد (mal au ventre) / دارم (j’ai) / دارین (vous avez, forme de politesse)
  prs.a1.unit46.lesson02.teach.review_very_yes_no:
    title: 'Révision : très, oui, non'
    gloss: très / oui / non
    note: بسیار, بلی et نخیر (vus dans les unités précédentes) sont des mots de révision qui servent à répondre à une question sur un symptôme.
    target_text: بسیار (très) / بلی (oui) / نخیر (non)
  prs.a1.unit46.lesson02.teach.toothache_word:
    title: Mal de dents
    gloss: mal de dents
    note: دندان‌درد associe دندان (dent, unité 42) au même élément -درد (« douleur ») déjà employé dans سردرد et دل‌درد.
    example_gloss: J’ai mal aux dents.
  prs.a1.unit46.lesson02.teach.severe_toothache_phrase:
    title: J’ai très mal aux dents
    gloss: J’ai très mal aux dents.
    note: بسیار دندان‌درد دارم emploie بسیار (très) pour renforcer le symptôme.
  prs.a1.unit46.lesson02.teach.do_you_have_headache_phrase:
    title: Avez-vous mal à la tête ?
    gloss: Avez-vous mal à la tête ?
    note: سردرد دارین؟ est une question fermée formée par l’intonation montante, sans mot interrogatif.
  prs.a1.unit46.lesson02.teach.no_toothache_phrase:
    title: Non, j’ai mal aux dents
    gloss: Non, j’ai mal aux dents.
    note: نخیر répond à la question précédente, puis on nomme le symptôme réel.
  prs.a1.unit46.lesson03.teach.review_want_one:
    title: 'Révision : je veux, un / une'
    gloss: je veux / un, une / un
    note: می‌خواهم et یک (vus dans les unités précédentes) sont des mots de révision qui servent à demander une forme de médicament.
    target_text: می‌خواهم (je veux) / یک (un / une)
  prs.a1.unit46.lesson03.teach.tablet_word:
    title: Comprimé
    gloss: comprimé / cachet
    note: قرص est le mot dari courant pour désigner un comprimé ou un cachet.
    example_gloss: Je veux un comprimé.
  prs.a1.unit46.lesson03.teach.want_tablet_phrase:
    title: Je veux un comprimé
    gloss: Je veux un comprimé.
    note: یک قرص می‌خواهم associe یک (un) et قرص (comprimé).
  prs.a1.unit46.lesson03.teach.syrup_word:
    title: Sirop
    gloss: sirop
    note: شربت est le mot dari courant pour désigner un médicament liquide ou un sirop.
    example_gloss: Je veux du sirop.
  prs.a1.unit46.lesson03.teach.want_syrup_phrase:
    title: Je veux du sirop
    gloss: Je veux du sirop.
    note: شربت می‌خواهم associe شربت (sirop) et می‌خواهم (je veux).
  prs.a1.unit46.lesson03.teach.review_which_medicine_want_polite:
    title: 'Révision : quel, médicament, vous voulez (poli)'
    gloss: quel / médicament / vous voulez (poli)
    note: کدام, دوا et می‌خواهین sont des mots de révision qui servent à demander ce que veut un client.
    target_text: کدام (quel) / دوا (médicament) / می‌خواهین (vous voulez, forme de politesse)
  prs.a1.unit46.lesson03.teach.which_medicine_phrase:
    title: Quel médicament voulez-vous ?
    gloss: Quel médicament voulez-vous ?
    note: کدام دوا می‌خواهین؟ est la question polie que poserait un pharmacien.
  prs.a1.unit46.lesson04.teach.review_hello_stomachache_have:
    title: 'Révision : bonjour, mal au ventre, j''ai'
    gloss: bonjour / mal au ventre / j'ai
    note: سلام, دل‌درد et دارم (vus dans les unités précédentes) sont des mots de révision qui servent à ouvrir le dialogue.
    target_text: سلام (bonjour) / دل‌درد (mal au ventre) / دارم (j’ai)
  prs.a1.unit46.lesson04.teach.review_medicine_want_polite_yes:
    title: 'Révision : médicament, vous voulez (poli), oui'
    gloss: médicament / vous voulez (poli) / oui
    note: دوا, می‌خواهین et بلی (vus dans les unités précédentes) sont des mots de révision utilisés dans les questions du pharmacien.
    target_text: دوا (médicament) / می‌خواهین (vous voulez, forme de politesse) / بلی (oui)
  prs.a1.unit46.lesson04.teach.review_this_tablet_good_is:
    title: 'Révision : ce, comprimé, bon, est'
    gloss: ce, cette / comprimé / bon / est
    note: این, قرص, خوب et است (vus dans les unités précédentes et dans cette leçon) sont des mots de révision qui servent à décrire le médicament.
    target_text: این (ceci) / قرص (comprimé) / خوب (bon) / است (est)
  prs.a1.unit46.lesson04.teach.piece_word:
    title: Unité
    gloss: unité / dose
    note: دانه est un classificateur qui désigne une unité ou une dose ; il s'emploie pour les comprimés.
    example_gloss: Trois unités.
  prs.a1.unit46.lesson04.teach.take_word:
    title: Prendre
    gloss: prenez
    note: بگیرین est l'impératif poli « prenez » ; il appartient à la même famille en -ین que کنین et بنوشین ailleurs dans ce cours.
    example_gloss: Prenez trois comprimés par jour.
  prs.a1.unit46.lesson04.teach.review_day_three_thanks_welcome:
    title: 'Révision : jour, trois, merci beaucoup, de rien'
    gloss: jour / trois / merci beaucoup / de rien
    note: روز, سه, تشکر زیاد et خواهش می‌کنم (vus dans les unités précédentes) sont des mots de révision qui servent à conclure le dialogue.
    target_text: روز (jour) / سه (trois) / تشکر زیاد (merci beaucoup) / خواهش می‌کنم (je vous en prie)
  prs.a1.unit46.lesson04.teach.dialogue_line1:
    title: 'Homayoun : Bonjour. J''ai mal au ventre.'
    gloss: Bonjour. J'ai mal au ventre.
  prs.a1.unit46.lesson04.teach.dialogue_line2:
    title: 'Le pharmacien : Bonjour. Vous voulez un médicament ?'
    gloss: Bonjour. Vous voulez un médicament ?
  prs.a1.unit46.lesson04.teach.dialogue_line3:
    title: 'Homayoun : Oui, je veux un comprimé.'
    gloss: Oui, je veux un comprimé.
  prs.a1.unit46.lesson04.teach.dialogue_line4:
    title: 'Le pharmacien : Ce comprimé est bon. Prenez-en trois par jour.'
    gloss: Ce comprimé est bon. Prenez-en trois par jour.
  prs.a1.unit46.lesson04.teach.dialogue_line5:
    title: 'Homayoun : Merci beaucoup.'
    gloss: Merci beaucoup.
  prs.a1.unit46.lesson04.teach.dialogue_line6:
    title: 'Le pharmacien : De rien.'
    gloss: De rien.
  prs.a1.unit46.lesson05.teach.review_this_is_from:
    title: 'Révision : ce, est, Homayoun, de'
    gloss: ce, ceci / est / Homayoun / de
    note: 'این, است et همایون sont des mots de révision utilisés dans le texte à lire. از (vu dans les unités précédentes, il signifie généralement « de ») s''emploie ici avec است pour exprimer la possession : این نسخه از همایون است se traduit littéralement par « cette ordonnance est de Homayoun », mais signifie en fait « c''est l''ordonnance de Homayoun », sur le même modèle que این کتاب از من است, « ce livre est à moi ».'
    target_text: این (ceci) / است (est) / همایون / از (de)
  prs.a1.unit46.lesson05.teach.review_one_tablet_day_three_piece_take:
    title: 'Révision : un, comprimé, jour, trois, unité, prenez'
    gloss: un / comprimé / jour / trois / unité / prenez
    note: یک, قرص, روز, سه, دانه et بگیرین (vus dans cette unité) sont des mots de révision utilisés dans le texte à lire.
    target_text: یک (un) / قرص (comprimé) / روز (jour) / سه (trois) / دانه (unité) / بگیرین (prenez)
  prs.a1.unit46.lesson05.teach.prescription_word:
    title: Ordonnance
    gloss: ordonnance
    note: نسخه est le mot dari courant pour désigner une ordonnance ou une étiquette de médicament.
    example_gloss: Voici une ordonnance.
  prs.a1.unit46.lesson05.teach.reading_passage:
    title: Lire une ordonnance
    gloss: C'est l'ordonnance de Homayoun. C'est un comprimé. Prenez-en trois par jour.
  prs.a1.unit46.lesson06.teach.review_but_formal_you_how_many:
    title: 'Révision : mais, vous (formel), combien'
    gloss: mais / vous (formel) / combien
    note: اما, شما et چند (vus dans les unités précédentes) sont des mots de révision qui servent à indiquer un horaire de prise.
    target_text: اما (mais) / شما (vous, forme de politesse) / چند (combien)
  prs.a1.unit46.lesson06.teach.review_morning_night_two_three_piece_is_prescription:
    title: 'Révision : matin, nuit, deux, trois, unité, est, votre ordonnance'
    gloss: matin / nuit, soir / deux / trois / unité / est / votre ordonnance
    note: صبح, شب, دو, سه, دانه, است (vus dans les unités précédentes et dans cette unité) et نسخه‌تان (votre ordonnance, avec le même suffixe -تان que نام‌تان et تلفن‌تان ailleurs dans ce cours) sont des mots de révision qui servent à conclure l'unité.
    target_text: صبح (matin) / شب (nuit / soir) / دو (deux) / سه (trois) / دانه (unité) / است (est) / نسخه‌تان (votre ordonnance)
  prs.a1.unit46.lesson06.teach.morning_night_contrast_phrase:
    title: Le matin, c'est deux comprimés, mais le soir, c'est trois comprimés
    gloss: Le matin, c'est deux comprimés, mais le soir, c'est trois comprimés.
    note: اما oppose la dose du matin et celle du soir.
  prs.a1.unit46.lesson06.teach.your_prescription_question_phrase:
    title: Votre ordonnance, c'est combien de comprimés ?
    gloss: Votre ordonnance, c'est combien de comprimés ?
    note: C'est la version formelle, avec شما et le suffixe -تان, pour poser une question sur la posologie d'une ordonnance.
