course:
  title: Dari A1
  description: 'Dari afghan pour débutants : vocabulaire de la nourriture et des boissons, commander poliment, demander ce qui est disponible, les quantités, et les usages au restaurant, y compris demander l’addition.'
units:
  prs.a1.unit08.food:
    title: La nourriture et la commande d’un repas
lessons:
  prs.a1.unit08.lesson01.food_and_drink_vocabulary:
    title: Nourriture et boissons
  prs.a1.unit08.lesson02.polite_ordering:
    title: Commander poliment
  prs.a1.unit08.lesson03.asking_whats_available:
    title: Demander ce qui est disponible
  prs.a1.unit08.lesson04.quantities:
    title: Commander des quantités précises
  prs.a1.unit08.lesson05.restaurant_etiquette_and_bill:
    title: Les usages au restaurant et l’addition
  prs.a1.unit08.lesson06.restaurant_dialogue:
    title: Une conversation complète au salon de thé
teaching:
  prs.a1.unit08.lesson01.teach.naan:
    title: Le pain
    gloss: pain
    note: نان est la base de tous les repas afghans.
    example_gloss: Le pain est frais.
  prs.a1.unit08.lesson01.teach.palaw:
    title: Pilaf de riz
    gloss: pilaf de riz
    note: پلو est le pilaf de riz afghan, assaisonné de façon particulière et souvent cuisiné avec de la viande, des carottes ou des raisins secs ; ce n’est pas simplement du riz nature.
    example_gloss: Le pilaf est délicieux.
  prs.a1.unit08.lesson01.teach.qorma:
    title: Ragoût de viande et de légumes
    gloss: ragoût de viande et de légumes
    note: قورمه est le terme général pour un ragoût de viande et de légumes, généralement servi avec du پلو.
    example_gloss: Je mange le ragoût avec du pilaf.
  prs.a1.unit08.lesson01.teach.chai_review:
    title: Thé (révision)
    gloss: thé
    note: چای est la boisson offerte par défaut presque partout en Afghanistan.
    example_gloss: Un thé, s’il vous plaît.
  prs.a1.unit08.lesson01.teach.ab_water:
    title: L’eau
    gloss: eau
    note: آب est le mot courant pour désigner l’eau.
    example_gloss: Un verre d’eau, s’il vous plaît.
  prs.a1.unit08.lesson01.teach.va_word:
    title: Et
    gloss: et
    note: و est le mot de liaison courant pour énumérer des plats.
    target_text: و (et)
  prs.a1.unit08.lesson02.teach.mikham_chai:
    title: Commander un thé poliment
    gloss: Je voudrais un thé.
    note: یک چای می‌خواهم est une façon neutre et polie de commander, qui emploie directement می‌خواهم (je veux) plutôt qu’une tournure plus indirecte.
  prs.a1.unit08.lesson02.teach.lotfan:
    title: S’il vous plaît
    gloss: s’il vous plaît
    note: لطفاً permet d’adoucir presque n’importe quelle demande.
    example_gloss: Aidez-moi, s’il vous plaît.
  prs.a1.unit08.lesson02.teach.mikham_naan:
    title: Commander du pain poliment
    gloss: Je voudrais un pain.
    note: Le même modèle یک [item] می‌خواهم s’emploie avec n’importe quel nom d’aliment ou de boisson.
  prs.a1.unit08.lesson03.teach.what_do_you_have:
    title: Demander ce qu’il y a
    gloss: Qu’est-ce que vous avez ?
    note: چی دارین؟ est la façon naturelle de demander à un commerçant ou à un serveur quels plats sont disponibles.
  prs.a1.unit08.lesson03.teach.we_have_both:
    title: Répondre en disant ce qu’il y a
    gloss: Nous avons du pilaf et du ragoût.
    note: پلو و قورمه داریم utilise داریم (nous avons), la forme « nous » de دارم. Le commerçant dit « nous » parce qu’il parle au nom de toute la boutique.
  prs.a1.unit08.lesson03.teach.fresh_word:
    title: Frais
    gloss: frais
    note: تازه se dit d’un plat qui vient d’être préparé.
    example_gloss: Ce pain est frais.
  prs.a1.unit08.lesson04.teach.yek_boshghab:
    title: Une assiette de pilaf
    gloss: une assiette de pilaf
    note: بشقاب (assiette) est le mot de comptage pour un plat servi dans une assiette.
  prs.a1.unit08.lesson04.teach.do_ta_naan:
    title: Deux pains
    gloss: deux pains
    note: تا est le mot de comptage général placé après un nombre pour la plupart des objets dénombrables, ici deux pains.
  prs.a1.unit08.lesson04.teach.combined_order:
    title: Faire une commande complète
    gloss: Une assiette de pilaf et deux pains, s’il vous plaît.
    note: On peut relier plusieurs quantités avec و (et) dans une même commande.
  prs.a1.unit08.lesson05.teach.bill_word:
    title: L’addition
    gloss: l’addition
    note: بل (de l’anglais « bill ») est le mot courant en Afghanistan pour l’addition au restaurant.
    example_gloss: L’addition, s’il vous plaît.
  prs.a1.unit08.lesson05.teach.bill_request:
    title: Demander le montant de l’addition
    gloss: Combien coûte l’addition ?
    note: 'بل چند می‌شه؟ demande littéralement « l’addition devient combien », la façon courante de demander le total. می‌شه est la forme parlée de می‌شود : c’est celle que tu entendras dans un magasin, tandis que l’écrit emploie می‌شود.'
  prs.a1.unit08.lesson05.teach.khoshmaze:
    title: Dire que le repas était délicieux
    gloss: C’était très bon.
    note: خیلی خوش‌مزه بود est un compliment naturel à faire après un repas.
  prs.a1.unit08.lesson05.teach.chaikhana:
    title: Maison de thé
    gloss: maison de thé / petit restaurant
    note: چایخانه est un type courant de petit restaurant en Afghanistan, surtout à Kaboul, où l’on sert du thé et des repas simples.
  prs.a1.unit08.lesson06.teach.welcome_review:
    title: Bienvenue (révision)
    gloss: bienvenue
    note: خوش آمدین a été vu dans l’unité sur les salutations ; ici, c’est le salut d’un commerçant.
  prs.a1.unit08.lesson06.teach.turn01:
    title: Le commerçant accueille le client
    gloss: Le commerçant souhaite la bienvenue au client et lui demande ce qu’il désire.
    note: چی میل دارین؟ est une question d’accueil polie, de fonction proche de چی دارین؟, mais centrée sur le souhait du client.
  prs.a1.unit08.lesson06.teach.turn02:
    title: Le client demande ce qui est disponible
    gloss: Le client salue le commerçant et demande ce qu’il y a.
    note: چی دارین؟ ouvre l’échange de commande, vu dans la leçon 3.
  prs.a1.unit08.lesson06.teach.turn03:
    title: Le commerçant énumère ce qu’il propose
    gloss: Le commerçant dit qu’il a du pilaf et du ragoût, tous deux frais.
    note: هردو (les deux) confirme la fraîcheur des deux plats mentionnés.
  prs.a1.unit08.lesson06.teach.turn04:
    title: Le client passe une commande complète
    gloss: Le client accepte et commande une assiette de pilaf avec du ragoût, ainsi qu’un thé.
    note: Cela combine le modèle de quantité de la leçon 4 et le vocabulaire des aliments de la leçon 1.
  prs.a1.unit08.lesson06.teach.turn05:
    title: Le commerçant confirme la commande
    gloss: Le commerçant dit qu’il apporte tout de suite la commande.
    note: چشم, littéralement « sur mon œil », est une façon respectueuse de dire « certainement ». می‌آرم est la forme parlée de می‌آورم (j’apporte), et همین حالا signifie « tout de suite ».
  prs.a1.unit08.lesson06.teach.turn06:
    title: Le client complimente le repas et demande l’addition
    gloss: Le client dit que c’était délicieux et demande l’addition.
    note: Les deux phrases reprennent directement le vocabulaire de la leçon 5.
  prs.a1.unit08.lesson06.teach.turn07:
    title: Le commerçant annonce le total
    gloss: Le commerçant remercie et dit que cela fait deux cents afghanis.
    note: افغانی est la monnaie de l’Afghanistan ; دوصد (deux cents) se place avec le nom de la monnaie pour indiquer un prix.
