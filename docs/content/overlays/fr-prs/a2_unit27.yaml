course:
  title: Dari en français A2
  description: 'Dari afghan, niveau pré-intermédiaire : dire ce que tu prévois de faire bientôt et ce que tu as l’intention de faire plus tard. Le présent avec un mot de temps pour les projets (demain, la semaine prochaine, en été), می‌خواهم suivi du subjonctif et تصمیم دارم pour les intentions, avec les vacances, les cours et le déménagement.'
units:
  prs.a2.unit27.my_plans:
    title: Mes projets
lessons:
  prs.a2.unit27.lesson01.tomorrow_and_next_week:
    title: 'Demain et la semaine prochaine : le présent pour les projets'
  prs.a2.unit27.lesson02.everyone_and_holiday:
    title: 'Les projets de chacun : personnes, questions, vacances'
  prs.a2.unit27.lesson03.i_want_to:
    title: 'Je veux… : les intentions avec می‌خواهم'
  prs.a2.unit27.lesson04.decisions_and_moving:
    title: Décisions, cours et déménagement
  prs.a2.unit27.lesson05.reading_and_listening:
    title: Lire et écouter à propos des projets
  prs.a2.unit27.lesson06.conversation_and_writing:
    title: Une conversation sur une nouvelle maison, et expression écrite
teaching:
  prs.a2.unit27.lesson01.teach.names:
    title: Mahtab et Latif
    gloss: Mahtab et Latif sont amis.
    note: Deux amis, *مهتاب* (une femme) et *لطیف* (un homme), parlent de leurs projets dans cette unité. Ils se parlent en amis, donc ils utilisent *تو*.
  prs.a2.unit27.lesson01.teach.tomorrow:
    title: Demain
    gloss: demain
    note: '*فردا* veut dire « demain ». C’est le mot de temps que tu utiliseras le plus pour parler d’un projet.'
    example_gloss: Demain, je vais à Kaboul.
  prs.a2.unit27.lesson01.teach.next_week:
    title: La semaine prochaine
    gloss: la semaine prochaine
    note: '*هفتهٔ آینده* veut dire « la semaine prochaine ». *آینده* signifie « prochain » et s’emploie aussi avec d’autres mots de temps : *ماه آینده* (le mois prochain), *سال آینده* (l’année prochaine).'
    example_gloss: La semaine prochaine, je vais à Hérat.
  prs.a2.unit27.lesson01.teach.next_month:
    title: Le mois prochain
    gloss: le mois prochain
    note: '*ماه آینده* veut dire « le mois prochain ». Il suit le même modèle que *هفتهٔ آینده*.'
    example_gloss: Le mois prochain, je vais à Mazar.
  prs.a2.unit27.lesson01.teach.next_year:
    title: L’année prochaine
    gloss: l’année prochaine
    note: '*سال آینده* veut dire « l’année prochaine ».'
    example_gloss: L’année prochaine, je viens à Kaboul.
  prs.a2.unit27.lesson01.teach.summer:
    title: L’été
    gloss: été, en été
    note: '*تابستان* veut dire « l’été » et aussi « en été » : il n’y a pas besoin d’un autre mot pour « en ».'
    example_gloss: En été, je vais à Bamiyan.
  prs.a2.unit27.lesson01.teach.plan:
    title: Projet
    gloss: projet, programme
    note: '*برنامه* veut dire « projet, programme ». *برنامه دارم* signifie « j’ai un projet » ; c’est la façon habituelle de dire que l’on a des projets.'
    example_gloss: J’ai un projet pour l’été.
  prs.a2.unit27.lesson01.teach.rule:
    title: Le présent avec un mot de temps exprime ce que tu prévois de faire
    gloss: Demain, je pars. La semaine prochaine, je pars. En été, je pars.
    note: 'Le dari n’a pas de mot courant distinct pour marquer le futur, comme la terminaison du futur en français. Pour parler d’un projet, on emploie le présent ordinaire, *می‌* plus le radical du présent, et on ajoute un mot de temps qui renvoie à l’avenir : *فردا می‌روم* signifie « demain je pars », *هفتهٔ آینده می‌روم* signifie « la semaine prochaine je pars ». C’est le mot de temps qui indique à l’interlocuteur que le projet se situe dans le futur. Sans mot de temps, *می‌روم* signifie simplement « je vais, je pars » (maintenant). En français, on peut aussi dire « je partirai » ou « je vais partir », ce qui traduit bien un projet comme celui-ci. L’ordre des mots est libre : le mot de temps vient le plus souvent en premier, mais *به هرات فردا می‌روم* est aussi correct.'
  prs.a2.unit27.lesson01.teach.paradigm:
    title: Le présent de رفتن à toutes les personnes
    gloss: je vais, tu vas, il/elle va, nous allons, vous allez (forme de politesse ou pluriel), ils/elles vont
    note: 'Le présent se forme avec le préfixe *می‌* (écrit avec une demi-espace), le radical du présent *رو* et une terminaison personnelle : *می‌روم* (je), *می‌روی* (tu, un ami), *می‌رود* (il ou elle), *می‌رویم* (nous), *می‌روین* (vous, politesse ou pluriel), *می‌روند* (ils/elles). Le pronom est facultatif, car la terminaison indique déjà la personne. Dans ce cours, la terminaison de la 2e personne du pluriel est *-ین*.'
  prs.a2.unit27.lesson01.teach.sentence:
    title: Demain, je vais à Hérat
    gloss: Demain, je vais à Hérat.
    note: 'C’est le modèle de l’unité : un mot de temps, puis le lieu avec *به*, puis le verbe au présent à la fin.'
  prs.a2.unit27.lesson02.teach.holiday:
    title: Vacances
    gloss: vacances, congé
    note: '*رخصتی* désigne les vacances ou un congé du travail ou de l’école. C’est le mot afghan que tu entendras le plus.'
    example_gloss: Pendant les vacances, je vais à Hérat.
  prs.a2.unit27.lesson02.teach.travel:
    title: Voyager
    gloss: voyager, partir en voyage
    note: '*سفر کردن* veut dire « voyager ». On indique la destination avec *به* : *به بامیان سفر می‌کنم* signifie « je voyage à Bamiyan ». La terminaison se place sur *کردن*, donc le verbe change comme n’importe quel verbe au présent : *سفر می‌کنم، سفر می‌کنی، سفر می‌کند*.'
    example_gloss: Pendant les vacances, il ou elle voyage à Bamiyan.
  prs.a2.unit27.lesson02.teach.hotel:
    title: Réserver un hôtel
    gloss: réserver un hôtel
    note: '*رزرو کردن* veut dire « réserver » et *هوتل* « hôtel ». Une réservation est un projet typique, donc le présent avec un mot de temps convient : *فردا هوتل رزرو می‌کنم*.'
    example_gloss: Demain, je réserve un hôtel.
  prs.a2.unit27.lesson02.teach.buy:
    title: Acheter
    gloss: acheter
    note: '*خریدن* veut dire « acheter ». Le radical du présent est *خر* : *می‌خرم، می‌خری، می‌خرد*.'
    example_gloss: Demain, j’achète des fruits.
  prs.a2.unit27.lesson02.teach.more_verbs:
    title: Le présent de آمدن
    gloss: je viens, tu viens, il/elle vient, nous venons, vous venez (forme de politesse ou pluriel), ils/elles viennent
    note: 'Le radical du présent de *آمدن* est *آی*, donc le verbe fait *می‌آیم، می‌آیی، می‌آید، می‌آییم، می‌آیین، می‌آیند*. Les mêmes terminaisons valent pour tous les verbes : *می‌مانم* (je reste), *می‌گیرم* (je prends), *می‌خرم* (j’achète), *می‌کنم* (je fais). Chacun peut exprimer un projet si tu ajoutes un mot de temps : *هفتهٔ آینده می‌آیم* signifie « la semaine prochaine, je viens ».'
  prs.a2.unit27.lesson02.teach.negative:
    title: 'La négation : نمی‌ à toutes les personnes'
    gloss: je ne vais pas, tu ne vas pas, il/elle ne va pas, nous n’allons pas, vous n’allez pas, ils/elles ne vont pas
    note: 'Pour dire que tu ne vas pas faire quelque chose, place *ن* devant *می‌* : *می‌روم* devient *نمی‌روم*. Les terminaisons restent les mêmes. *جمعه به مکتب نمی‌روم* signifie « vendredi, je ne vais pas à l’école ». N’oublie pas la demi-espace entre *نمی‌* et le radical.'
  prs.a2.unit27.lesson02.teach.questions:
    title: Demander les projets de quelqu’un
    gloss: Que fais-tu demain ? Où vas-tu la semaine prochaine ? Avec qui y vas-tu ?
    note: 'On interroge sur un projet avec le même présent : *فردا چه می‌کنی؟* signifie « que fais-tu demain ? », *کجا می‌روی؟* « où vas-tu ? », *با کی می‌روی؟* « avec qui y vas-tu ? ». La réponse est aussi au présent, donc une conversation sur les projets n’exige aucune nouvelle forme verbale.'
  prs.a2.unit27.lesson02.teach.stay:
    title: Je reste là-bas une semaine
    gloss: Je reste là-bas une semaine.
    note: '*می‌مانم* signifie « je reste ». Une durée comme *یک هفته* se place avant le verbe et n’a pas besoin d’un mot supplémentaire pour « pendant ».'
  prs.a2.unit27.lesson03.teach.pattern:
    title: 'L’intention : می‌خواهم plus le subjonctif'
    gloss: Je veux aller à Hérat. Je veux venir. Je veux acheter un livre.
    note: 'Pour dire ce que tu comptes ou veux faire, utilise *می‌خواهم* (je veux), puis un second verbe au subjonctif : *می‌خواهم بروم* signifie « je veux aller ». En français, on met un infinitif après « vouloir ». En dari, on emploie un second verbe avec une terminaison personnelle, sans mot pour « de » ou « à ». Les deux verbes sont à la même personne : *می‌خواهم بروم* (je veux aller), *می‌خواهیم برویم* (nous voulons aller). Ne mets pas l’infinitif après *می‌خواهم*. Le mot *که* n’est pas nécessaire ici.'
  prs.a2.unit27.lesson03.teach.subjunctive:
    title: 'Le subjonctif : بـ plus le radical du présent'
    gloss: que j’aille, que tu ailles, qu’il/elle aille, que nous allions, que vous alliez, qu’ils/elles aillent
    note: 'Le subjonctif se forme avec *بـ* plus le radical du présent et les mêmes terminaisons que le présent : *رو* donne *بروم، بروی، برود، برویم، بروین، بروند*. Autres verbes : *بخرم* (que j’achète), *بگیرم* (que je prenne), *بمانم* (que je reste), *بخورم* (que je mange). *آمدن* fait exception : *بیایم* (que je vienne). Tu le rencontreras après *می‌خواهم* et aussi après *باید*.'
  prs.a2.unit27.lesson03.teach.want_paradigm:
    title: Le présent de خواستن
    gloss: je veux, tu veux, il/elle veut, nous voulons, vous voulez (forme de politesse ou pluriel), ils/elles veulent
    note: '*خواستن* a pour radical du présent *خواه* : *می‌خواهم، می‌خواهی، می‌خواهد، می‌خواهیم، می‌خواهین، می‌خواهند*. Le second verbe suit la même personne : *او می‌خواهد برود* (il ou elle veut aller), *ما می‌خواهیم برویم* (nous voulons aller).'
  prs.a2.unit27.lesson03.teach.want_negative:
    title: Je ne veux pas
    gloss: Je ne veux pas y aller. Nous ne voulons pas venir.
    note: 'Place *ن* devant *می‌خواهم* pour dire que tu ne veux pas : *نمی‌خواهم بروم* signifie « je ne veux pas aller ». Le second verbe reste au subjonctif et ne prend pas de seconde négation.'
  prs.a2.unit27.lesson03.teach.plan_vs_intention:
    title: Un projet et une intention
    gloss: Demain, je vais à Hérat. Je veux aller à Hérat.
    note: 'Compare les deux. *فردا به هرات می‌روم* est un projet : c’est décidé, tu donnes un moment et tu emploies le présent. *می‌خواهم به هرات بروم* est une intention ou un souhait : tu en as envie, mais ce n’est pas encore fixé, donc il n’y a souvent pas de date précise. Quand tu as la date et que tout est organisé, dis le projet. Quand tu en as seulement envie, dis *می‌خواهم*.'
  prs.a2.unit27.lesson03.teach.course:
    title: Cours
    gloss: cours, formation
    note: '*کورس* désigne un cours, par exemple de langue ou d’informatique. On le suit avec *گرفتن* : *کورس گرفتن* signifie « suivre un cours ».'
    example_gloss: Je veux suivre un cours d’anglais.
  prs.a2.unit27.lesson03.teach.start:
    title: Commencer
    gloss: commencer, débuter
    note: '*شروع شدن* veut dire « commencer ». Il s’emploie pour une chose qui débute, un cours, une réunion ou une leçon : *شروع می‌شود* signifie « ça commence ». Avec un mot de temps, c’est aussi un projet.'
    example_gloss: Le cours commence la semaine prochaine.
  prs.a2.unit27.lesson03.teach.university:
    title: L’université
    gloss: université
    note: '*پوهنتون* veut dire « université ». C’est le mot afghan ; on y va avec *به*.'
    example_gloss: Je veux aller à l’université.
  prs.a2.unit27.lesson04.teach.move:
    title: Déménager
    gloss: déménager, changer de maison
    note: '*عوض کردن* veut dire « changer », donc *خانه عوض کردن* signifie « déménager ». *خانه را عوض می‌کنم* est aussi correct. La terminaison se place sur *کردن* : *خانه عوض می‌کنم، خانه عوض می‌کنی*.'
    example_gloss: Le mois prochain, je déménage.
  prs.a2.unit27.lesson04.teach.rent:
    title: Louer
    gloss: louer (une maison)
    note: '*کرایه* est le loyer. *کرایه گرفتن* signifie « louer une maison pour soi », par exemple *یک خانه کرایه می‌گیرم*. Avec *می‌خواهم*, le second verbe est *بگیرم*.'
    example_gloss: Je veux louer une nouvelle maison.
  prs.a2.unit27.lesson04.teach.near:
    title: Près de
    gloss: près, proche
    note: '*نزدیک* veut dire « près ». On dit près de quoi directement après : *نزدیک مکتب* signifie « près de l’école ».'
    example_gloss: La nouvelle maison est près de l’école.
  prs.a2.unit27.lesson04.teach.decide:
    title: 'تصمیم دارم : j’ai décidé de'
    gloss: J’ai l’intention d’aller à l’université l’année prochaine.
    note: '*تصمیم دارم* signifie « j’ai décidé, j’ai l’intention de ». C’est un peu plus fort que *می‌خواهم* : tu y as réfléchi. Comme *می‌خواهم*, il est suivi du subjonctif : *تصمیم دارم بروم* signifie « j’ai l’intention d’aller ». Tu connais déjà *قصد دارم* de l’unité sur les vacances, qui a le même sens et est aussi accepté. Le subjonctif reste à la fin de la proposition, après le mot de temps et le lieu.'
  prs.a2.unit27.lesson04.teach.written_future:
    title: 'Le futur écrit : خواهم رفت'
    gloss: Demain, j’irai à Hérat. (écrit)
    note: 'Dans les avis, les informations et l’écrit formel, tu verras *خواهم رفت*, *خواهد رفت*, *خواهیم رفت* : *خواه-* plus la terminaison, puis le radical du passé *رفت*. Cela signifie « j’irai, il ira, nous irons ». Tu as seulement besoin de le reconnaître. À l’oral, utilise le présent avec un mot de temps : *فردا به هرات می‌روم*.'
  prs.a2.unit27.lesson04.teach.because:
    title: Parce que ma maison est petite
    gloss: Parce que ma maison est petite.
    note: '*چون* veut dire « parce que ». Il est suivi d’une courte raison, ici avec la copule *است*.'
  prs.a2.unit27.lesson05.teach.morning:
    title: Matin
    gloss: matin, le matin
    note: '*صبح* veut dire « le matin ». *فردا صبح* signifie « demain matin ».'
    example_gloss: Demain matin, je vais à Bamiyan.
  prs.a2.unit27.lesson05.teach.holiday_turn01:
    title: Mahtab interroge Latif sur les vacances
    gloss: Latif, tu as un projet pour les vacances ?
    note: Mahtab demande à Latif quels sont ses projets pour les vacances. *برنامه داری؟* signifie « as-tu un projet ? », et elle utilise *تو* parce que c’est un ami.
  prs.a2.unit27.lesson05.teach.holiday_turn02:
    title: Latif présente son projet
    gloss: Oui. La semaine prochaine, je vais à Hérat. J’y reste une semaine.
    note: 'Latif répond *بلی* (oui). Son projet comporte un mot de temps, *هفتهٔ آینده*, et le présent : *می‌روم*. *یک هفته آنجا می‌مانم* est un second projet au présent.'
  prs.a2.unit27.lesson05.teach.holiday_turn03:
    title: Mahtab demande ce qu’il fera après
    gloss: C’est bien ! Que fais-tu après ça ?
    note: '*بعد از آن* signifie « après ça ». La question est au présent, comme toujours pour un projet.'
  prs.a2.unit27.lesson05.teach.holiday_turn04:
    title: Latif dit ce qu’il veut
    gloss: Je veux suivre un cours d’anglais.
    note: 'Latif n’a pas de date précise, donc il exprime une intention : *می‌خواهم* plus le subjonctif *بگیرم*.'
  prs.a2.unit27.lesson05.teach.holiday_turn05:
    title: Mahtab demande quand le cours commence
    gloss: Super ! Quand le cours commence-t-il ?
    note: '*کورس کی شروع می‌شود؟* demande quand un cours commence. Le présent *شروع می‌شود* parle d’une date future.'
  prs.a2.unit27.lesson05.teach.holiday_turn06:
    title: Latif donne le mois
    gloss: À partir du mois prochain.
    note: '*از ماه آینده* signifie « à partir du mois prochain ». Une réponse courte suffit.'
  prs.a2.unit27.lesson05.teach.message:
    title: Un message sur les projets
    gloss: Salut Mahtab. Demain matin, je vais à Bamyan et j’y reste deux jours. La semaine prochaine, je travaille au bureau. L’année prochaine, j’ai l’intention d’aller à l’université.
    note: Un court message écrit. Il contient un projet pour demain, un projet pour la semaine prochaine et une intention pour l’année prochaine. Tous les projets sont au présent avec un mot de temps, et l’intention s’exprime avec *تصمیم دارم* suivi du subjonctif.
  prs.a2.unit27.lesson06.teach.help:
    title: Aider
    gloss: aider
    note: '*کمک* signifie « aide ». *کمک کردن* signifie « aider » : *فردا کمک می‌کنم* veut dire « demain, j’aiderai ». La terminaison de la personne se place sur *کردن*.'
    example_gloss: Demain, j’aide mon ami.
  prs.a2.unit27.lesson06.teach.house_turn01:
    title: Latif demande ce qu’elle fait le mois prochain
    gloss: Mahtab, que fais-tu le mois prochain ?
    note: Latif interroge sur un projet avec un mot de temps, *ماه آینده*, et le présent.
  prs.a2.unit27.lesson06.teach.house_turn02:
    title: Mahtab donne son projet
    gloss: Le mois prochain, je déménage.
    note: '*خانه عوض می‌کنم* signifie « je déménage ». C’est un projet, donc on utilise le présent avec le mot de temps.'
  prs.a2.unit27.lesson06.teach.house_turn03:
    title: Latif demande pourquoi
    gloss: Pourquoi ?
    note: '*چرا؟* signifie « pourquoi ». Une question d’un seul mot est naturelle entre amis.'
  prs.a2.unit27.lesson06.teach.house_turn04:
    title: Mahtab explique
    gloss: Parce que ma maison est petite. Je veux louer une nouvelle maison, près de l’école.
    note: '*چون* donne la raison, avec *است*. Vient ensuite une intention : *می‌خواهم* suivi du subjonctif *بگیرم*, car elle n’a pas encore trouvé la maison.'
  prs.a2.unit27.lesson06.teach.house_turn05:
    title: Latif propose son aide
    gloss: Bien ! Demain, je viens et je t’aide.
    note: 'Latif fait un projet sur le moment avec *فردا* et le présent : *می‌آیم* et *کمک می‌کنم*. *کمک کردن* signifie « aider ».'
  prs.a2.unit27.lesson06.teach.house_turn06:
    title: Mahtab le remercie
    gloss: Merci !
    note: '*تشکر!* est une façon courte de dire merci à un ami.'
exercises:
  prs.a2.unit27.lesson01.exercise01.recognize_tomorrow:
    instruction: Que signifie cette phrase ?
    correct_option: Demain, je vais à Kaboul
    distractors:
    - Hier, je suis allé à Kaboul
    - Je vais toujours à Kaboul
    - Je veux aller à Kaboul
    accepted_answers:
    - value: Demain, je vais à Kaboul
      status: correct
    feedback: '*فردا* renvoie au futur et *می‌روم* est au présent : c’est un projet, « demain, je vais à Kaboul ».'
  prs.a2.unit27.lesson01.exercise02.recognize_we_next_week:
    instruction: Que signifie cette phrase ?
    correct_option: La semaine prochaine, nous allons à Hérat
    distractors:
    - La semaine dernière, nous sommes allés à Hérat
    - Nous allons à Hérat chaque semaine
    - Nous sommes à Hérat maintenant
    accepted_answers:
    - value: La semaine prochaine, nous allons à Hérat
      status: correct
    feedback: '*هفتهٔ آینده* signifie « la semaine prochaine » et *می‌رویم* « nous allons » : la semaine prochaine, nous allons à Hérat.'
  prs.a2.unit27.lesson01.exercise03.match_time_words:
    instruction: Associe chaque mot de temps en dari à son sens.
    accepted_answers:
    - value:
        فردا: demain
