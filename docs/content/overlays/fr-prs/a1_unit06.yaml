course:
  title: Dari A1
  description: 'Dari afghan pour débutants : mots de direction de base, indiquer où tourner, enchaîner plusieurs étapes d’un itinéraire, demander poliment son chemin et donner des indications à l’aide de repères.'
units:
  prs.a1.unit06.directions:
    title: Indiquer la direction et trouver son chemin
lessons:
  prs.a1.unit06.lesson01.direction_words:
    title: Les mots de direction de base
  prs.a1.unit06.lesson02.giving_turn_instructions:
    title: Dire où tourner
  prs.a1.unit06.lesson03.sequencing_directions:
    title: Enchaîner plusieurs étapes d’un itinéraire
  prs.a1.unit06.lesson04.politely_asking_directions:
    title: Demander poliment son chemin
  prs.a1.unit06.lesson05.landmark_directions:
    title: Indiquer le chemin avec des repères
  prs.a1.unit06.lesson06.giving_directions_dialogue:
    title: Trouver le chemin de la pharmacie
teaching:
  prs.a1.unit06.lesson01.teach.straight:
    title: Tout droit
    gloss: tout droit
    note: مستقیم désigne le fait d’aller tout droit.
    example_gloss: Allez tout droit.
  prs.a1.unit06.lesson01.teach.left:
    title: Gauche
    gloss: gauche
    note: چپ désigne la direction de gauche.
    example_gloss: Tourne à gauche.
  prs.a1.unit06.lesson01.teach.right:
    title: Droite
    gloss: droite
    note: راست désigne la direction de droite.
    example_gloss: Tourne à droite.
  prs.a1.unit06.lesson01.teach.turn_verb:
    title: Tourner (impératif de politesse)
    gloss: tourner
    note: بپیچین est l’impératif de politesse du verbe « tourner », employé pour indiquer le chemin à quelqu’un.
    example_gloss: Tourne à droite.
  prs.a1.unit06.lesson01.teach.to_word:
    title: À / vers
    gloss: à / vers
    note: به se combine avec un mot de direction, comme dans به چپ (à gauche).
    target_text: به (à / vers)
  prs.a1.unit06.lesson02.teach.go_straight:
    title: Dire à quelqu’un d’aller tout droit
    gloss: Va tout droit.
    note: مستقیم بروین est la consigne de direction de base, à l’impératif de politesse.
  prs.a1.unit06.lesson02.teach.turn_left:
    title: Dire à quelqu’un de tourner à gauche
    gloss: Tourne à gauche.
    note: به چپ بپیچین signifie littéralement « tournez à gauche ».
  prs.a1.unit06.lesson02.teach.turn_right:
    title: Dire à quelqu’un de tourner à droite
    gloss: Tourne à droite.
    note: به راست بپیچین suit le même modèle, avec راست à la place de چپ.
  prs.a1.unit06.lesson03.teach.first_word:
    title: D’abord
    gloss: d’abord
    note: اول marque la première étape d’une suite d’indications.
    example_gloss: D’abord, allez tout droit.
  prs.a1.unit06.lesson03.teach.then_word:
    title: Ensuite
    gloss: alors
    note: بعد marque l’étape suivante, après la première.
    example_gloss: Puis tourne à gauche.
  prs.a1.unit06.lesson03.teach.sequenced_example:
    title: Combiner deux étapes
    gloss: D’abord, allez tout droit, ensuite tournez à droite.
    note: اول et بعد permettent d’enchaîner plusieurs étapes dans une même indication.
  prs.a1.unit06.lesson04.teach.polite_ask:
    title: Demander poliment comment se rendre quelque part
    gloss: Pourriez-vous m’indiquer comment aller au marché ?
    note: می‌توانین بگویین...؟ est une manière polie de demander « Pourriez-vous me dire... ? » et convient pour demander son chemin à un inconnu. بروم signifie « j’aille », donc la phrase entière demande comment je peux m’y rendre.
  prs.a1.unit06.lesson04.teach.bebakhshid_review:
    title: Demander où se trouve un lieu (révision)
    gloss: Excusez-moi, où est la pharmacie ?
    note: ببخشین، [place] کجاست؟ a été vu dans l’unité sur les lieux ; c’est une entrée en matière naturelle avant de demander son chemin.
  prs.a1.unit06.lesson04.teach.fahmidam:
    title: Confirmer que tu as compris
    gloss: Merci beaucoup, j’ai compris.
    note: تشکر زیاد، فهمیدم conclut poliment l’échange et confirme que les indications étaient claires.
  prs.a1.unit06.lesson04.teach.daftar_review:
    title: Bureau (révision)
    gloss: bureau
    note: دفتر a déjà été vu dans une unité précédente ; il sert ici de destination pour s’entraîner à demander poliment son chemin.
    example_gloss: Le bureau est proche.
  prs.a1.unit06.lesson05.teach.after_word:
    title: Après
    gloss: après
    note: بعد از introduit un repère que l’on rencontre avant la destination.
    example_gloss: Après la mosquée, il y a la banque.
  prs.a1.unit06.lesson05.teach.opposite_review:
    title: En face de
    gloss: en face de
    note: روبه‌رو est un nouveau synonyme de مقابل (en face), vu dans l’unité sur les lieux ; les deux s’emploient pour dire « en face » dans le dari de tous les jours.
    example_gloss: La banque est en face de la mosquée.
  prs.a1.unit06.lesson05.teach.landmark_example:
    title: Donner une indication à l’aide d’un repère
    gloss: Après la mosquée, la banque est en face de vous.
    note: بعد از مسجد، بانک روبه‌روی شماست associe un repère (بعد از مسجد) à une position relative (روبه‌روی شماست).
  prs.a1.unit06.lesson05.teach.maktab_review:
    title: École (révision)
    gloss: école
    note: مکتب a été vu dans l’unité sur les lieux ; il sert ici de repère dans la phrase d’entraînement.
    example_gloss: L’école est proche.
  prs.a1.unit06.lesson06.teach.turn01:
    title: Sohaila demande son chemin
    gloss: Sohaila demande poliment à un commerçant comment aller à la pharmacie.
    note: ببخشین ouvre la question avec respect, et می‌توانین بگویین؟ est la formule polie pour demander son chemin, vue dans la leçon 4.
  prs.a1.unit06.lesson06.teach.turn02:
    title: Le commerçant donne la première étape
    gloss: Le commerçant acquiesce et dit d’aller d’abord tout droit.
    note: اول مستقیم بروین commence la suite d’indications.
  prs.a1.unit06.lesson06.teach.turn03:
    title: Sohaila confirme et demande la suite
    gloss: Sohaila répète « tout droit » pour confirmer, puis demande ce qui vient ensuite.
    note: بعد چطور؟ est une façon naturelle et concise de demander l’étape suivante.
  prs.a1.unit06.lesson06.teach.turn04:
    title: Le commerçant donne la deuxième étape et le repère
    gloss: Le commerçant dit de tourner à gauche, puis situe la pharmacie grâce à la mosquée et à la banque.
    note: Cela combine la consigne pour tourner vue dans la leçon 2 et la structure avec repères vue dans la leçon 5.
  prs.a1.unit06.lesson06.teach.turn05:
    title: Sohaila le remercie et confirme qu’elle a compris
    gloss: Sohaila le remercie beaucoup et dit qu’elle a compris.
    note: تشکر زیاد، فهمیدم conclut l’échange, comme vu dans la leçon 4.
  prs.a1.unit06.lesson06.teach.turn06:
    title: La réponse modeste du commerçant et ses adieux
    gloss: Le commerçant minimise les remerciements et lui souhaite bon voyage.
    note: قابلی نداره a été vu dans l’unité sur les lieux ; سفر خوش (bon voyage / bonne route) est une formule d’adieu naturelle pour quelqu’un qui s’apprête à partir à pied.
