course:
  title: Dari A1
  description: 'Dari afghan pour débutants : échanger les noms, dire d’où l’on vient et ce que l’on fait, présenter une tierce personne, et employer correctement les titres de politesse et le registre adapté lors d’une première rencontre.'
units:
  prs.a1.unit02.introductions:
    title: Se présenter et faire connaissance
lessons:
  prs.a1.unit02.lesson01.name_exchange:
    title: Demander et donner son nom
  prs.a1.unit02.lesson02.origin_and_hometown:
    title: Demander la ville et le pays d’origine
  prs.a1.unit02.lesson03.occupation:
    title: Demande à quelqu’un quel est son métier
  prs.a1.unit02.lesson04.introducing_others:
    title: Présenter une troisième personne
  prs.a1.unit02.lesson05.polite_titles_and_register:
    title: Utiliser les titres de politesse et le bon registre
  prs.a1.unit02.lesson06.gathering_dialogue:
    title: Faire connaissance lors d’une réunion
teaching:
  prs.a1.unit02.lesson01.teach.name_question_polite:
    title: Demander poliment le nom de quelqu’un
    gloss: Comment vous appelez-vous ?
    note: نام‌تان چیست؟ est la forme respectueuse pour une nouvelle connaissance adulte, dans la continuité du registre شما/استین de l’unité 1.
  prs.a1.unit02.lesson01.teach.name_answer:
    title: Donner ton nom avec است
    gloss: Je m’appelle Faridun.
    note: نام من ... است est la façon écrite d’indiquer un nom. À l’oral, on dit plutôt نامم ... است (نامم = نام + -م, mon nom). Les deux sont corrects.
  prs.a1.unit02.lesson01.teach.i_am_name:
    title: Donner ton nom avec استم
    gloss: Je suis Faridun.
    note: استم suit directement le nom ; c’est la même copule dari de la première personne que dans l’unité 1.
  prs.a1.unit02.lesson01.teach.name_question_informal:
    title: Demander le nom d’un ami proche
    gloss: Comment tu t’appelles ?
    note: نامت چیست؟ utilise le possessif familier -ت. Réserve-le à une personne de ton âge ou à un ami proche, exactement comme تو/استی dans l’unité 1.
  prs.a1.unit02.lesson01.teach.what_is_your_name_word:
    title: Le mot pour « nom »
    gloss: nom
    note: نام est le nom employé tel quel dans les deux questions ci-dessus, polie et familière.
    example_gloss: Comment tu t’appelles ?
  prs.a1.unit02.lesson01.teach.register_note:
    title: Possessif poli et possessif d’ami proche
    gloss: -تان pour une personne à qui tu t’adresses avec respect ; -ت pour un ami proche.
    note: La même distinction de registre que dans l’unité 1 (شما/تو) se retrouve dans les terminaisons possessives ajoutées à نام.
  prs.a1.unit02.lesson02.teach.where_from_polite:
    title: Demander d’où vient quelqu’un
    gloss: D’où venez-vous ?
    note: شما از کجا استین؟ garde l’association respectueuse شما/استین.
  prs.a1.unit02.lesson02.teach.from_kabul:
    title: Dire que tu viens de Kaboul
    gloss: Je viens de Kaboul.
    note: من از کابل استم suit le modèle من از [lieu] استم, valable pour n’importe quelle ville.
  prs.a1.unit02.lesson02.teach.from_herat:
    title: Dire que tu viens de Hérat
    gloss: Je viens de Hérat.
    note: هرات est une grande ville de l’ouest de l’Afghanistan.
  prs.a1.unit02.lesson02.teach.from_mazar:
    title: Dire que tu viens de Mazar-e Charif
    gloss: Je viens de Mazar-e Charif.
    note: مزار شریف s’écrit en deux mots et désigne une grande ville du nord de l’Afghanistan.
  prs.a1.unit02.lesson02.teach.country:
    title: L’Afghanistan
    gloss: Afghanistan
    note: افغانستان s’emploie après از, comme un nom de ville.
    example_gloss: Je viens d’Afghanistan.
  prs.a1.unit02.lesson02.teach.city_word:
    title: Le mot pour « ville »
    gloss: ville
    note: شهر désigne une ville en général, à distinguer du nom d’une ville précise.
    example_gloss: Kaboul est une grande ville.
  prs.a1.unit02.lesson03.teach.occupation_question:
    title: Demander le métier de quelqu’un
    gloss: Quel est votre métier ?
    note: کار شما چیست؟ demande littéralement « quel est votre travail ? » ; c’est la façon ordinaire de s’informer sur la profession.
  prs.a1.unit02.lesson03.teach.doctor:
    title: Médecin
    gloss: médecin
    note: داکتر est le terme dari courant pour désigner un médecin et, de façon familière, une personne titulaire d’un doctorat.
    example_gloss: Il/Elle est médecin.
  prs.a1.unit02.lesson03.teach.teacher:
    title: Professeure
    gloss: professeur
    note: معلم est un terme général pour « enseignant », à tous les niveaux scolaires.
    example_gloss: Il/elle est enseignant(e).
  prs.a1.unit02.lesson03.teach.engineer:
    title: Ingénieur
    gloss: ingénieur
    note: مهندس désigne les ingénieurs en général, sans préciser de spécialité.
    example_gloss: Il/Elle est ingénieur(e).
  prs.a1.unit02.lesson03.teach.shopkeeper:
    title: Commerçant
    gloss: commerçant
    note: دوکاندار (de دوکان, boutique) est le terme courant à Kaboul ; ce cours emploie la graphie dari دوکان plutôt que le مغازه du persan d’Iran.
    example_gloss: Il/elle est commerçant(e).
  prs.a1.unit02.lesson03.teach.i_am_teacher:
    title: Indiquer ton métier
    gloss: Je suis enseignante.
    note: من [métier] استم est le modèle pour tous les métiers vus dans cette leçon.
  prs.a1.unit02.lesson04.teach.introduce_formal:
    title: Présenter quelqu’un de façon formelle
    gloss: Permettez-moi de vous présenter mon collègue.
    note: اجازه بدهین همکارم را معرفی کنم est une manière respectueuse d’introduire une troisième personne dans la conversation.
  prs.a1.unit02.lesson04.teach.this_is:
    title: Nommer la personne que tu présentes
    gloss: Voici ma collègue Arezoo.
    note: این [personne] است indique directement qui est présenté.
  prs.a1.unit02.lesson04.teach.pleased_after_intro:
    title: Dire que tu es heureux de faire la connaissance de quelqu’un
    gloss: Enchanté(e).
    note: از آشنایی با شما خوش شدم est la même formule de première rencontre que dans l’unité 1, réutilisée ici après la présentation d’une troisième personne.
  prs.a1.unit02.lesson04.teach.pleased_reply:
    title: Répondre que toi aussi, tu es heureux
    gloss: Moi aussi, je suis enchanté(e).
    note: من هم خوش شدم est la réponse courte et naturelle.
  prs.a1.unit02.lesson04.teach.friend_word:
    title: Ami
    gloss: ami
    note: دوست est un mot général pour « ami », sans préciser le degré de proximité.
    example_gloss: C’est mon ami / mon amie.
  prs.a1.unit02.lesson04.teach.colleague_word:
    title: Collègue
    gloss: collègue
    note: همکار désigne une personne avec qui l’on travaille ; il figurait déjà dans le dialogue au travail de l’unité 1.
    example_gloss: C’est mon collègue / ma collègue.
  prs.a1.unit02.lesson05.teach.title_jenab:
    title: Monsieur
    gloss: Monsieur
    note: جناب précède le nom ou le titre d’un homme comme marque de respect ; il est courant dans l’usage urbain afghan de tous les jours.
    example_gloss: Monsieur, je vous en prie.
  prs.a1.unit02.lesson05.teach.title_khanom:
    title: Madame
    gloss: Madame
    note: خانم précède le nom d’une femme, quelle que soit sa situation familiale.
    example_gloss: Madame, je vous en prie.
  prs.a1.unit02.lesson05.teach.title_with_name:
    title: S’adresser poliment à un homme
    gloss: Monsieur Faridun
    note: جناب suivi d’un prénom est une formule d’adresse polie courante ; le nom de famille n’est pas obligatoire.
  prs.a1.unit02.lesson05.teach.title_with_name_female:
    title: S’adresser poliment à une femme
    gloss: Madame Arezoo
    note: خانم suivi d’un prénom fonctionne comme جناب pour un homme.
  prs.a1.unit02.lesson05.teach.register_reminder:
    title: Quand utiliser chaque registre
    gloss: Emploie شما et استین avec une personne que tu viens de rencontrer ; emploie تو et استی uniquement avec un ami proche.
    note: Cela reprend la règle de registre de l’unité 1 pour le contexte des présentations.
  prs.a1.unit02.lesson05.teach.polite_could_you:
    title: Demander poliment à quelqu’un de répéter son nom
    gloss: Pourriez-vous répéter votre nom ?
    note: می‌توانین نام‌تان را دوباره بگویین؟ est une façon naturelle et polie de demander une répétition sans gêner l’interlocuteur.
  prs.a1.unit02.lesson06.teach.gathering_word:
    title: Réunion / fête
    gloss: réunion
    note: مهمانی désigne un rassemblement social informel, cadre du dialogue de cette leçon.
    example_gloss: La réunion est agréable.
  prs.a1.unit02.lesson06.teach.turn01:
    title: Leila commence les présentations
    gloss: Leila salue Faridun et lui demande son nom, en s’adressant à lui avec respect par جناب.
    note: Leila et Faridun ne se sont jamais rencontrés ; elle emploie donc dès le début le registre respectueux.
  prs.a1.unit02.lesson06.teach.turn02:
    title: Faridun donne son nom
    gloss: Faridun répond à son salut et donne son nom.
    note: سلام علیکم est la salutation plus complète de l’unité 1, adaptée à une première rencontre. À l’oral, Faridun dit نامم فریدون است (نامم = نام من, mon nom), la forme parlée courante.
  prs.a1.unit02.lesson06.teach.turn03:
    title: Leila lui demande d’où il vient
    gloss: Leila dit qu’elle est heureuse de le rencontrer et lui demande d’où il vient.
    note: La même formule از آشنایی با شما خوش شدم vient du dialogue au travail de l’unité 1.
  prs.a1.unit02.lesson06.teach.turn04:
    title: Faridun répond et renvoie la question
    gloss: Faridun dit qu’il vient de Hérat et pose la même question à Leila.
    note: و شما؟ permet de renvoyer une question de façon économe, comme dans l’unité 1.
  prs.a1.unit02.lesson06.teach.turn05:
    title: Leila répond et interroge sur le métier
    gloss: Leila dit qu’elle vient de Kaboul et demande à Faridun quel est son métier.
    note: La conversation passe naturellement de l’origine à la profession.
  prs.a1.unit02.lesson06.teach.turn06:
    title: Faridun répond et renvoie la question
    gloss: Faridun dit qu’il est ingénieur et pose la même question à Leila.
    note: شما چطور؟ est une manière brève de renvoyer une question déjà comprise grâce au contexte.
  prs.a1.unit02.lesson06.teach.turn07:
    title: Leila indique son métier
    gloss: Leila dit qu’elle est enseignante.
    note: Cela complète l’échange sur le métier avec le modèle vu plus tôt dans l’unité.
  prs.a1.unit02.lesson06.teach.turn08:
    title: Faridun présente une troisième personne
    gloss: Faridun présente sa collègue Arezoo.
    note: Une troisième personne entre ainsi dans la conversation, grâce à la formule de présentation formelle vue plus tôt.
  prs.a1.unit02.lesson06.teach.turn09:
    title: Leila souhaite la bienvenue à Arezoo
    gloss: Leila souhaite la bienvenue à Arezoo, en s’adressant à elle avec respect par خانم.
    note: خوش آمدین est la formule de bienvenue de l’unité 1, ici adressée à une personne qu’on vient de présenter.
  prs.a1.unit02.lesson06.teach.turn10:
    title: Arezoo répond
    gloss: Arezoo remercie Leila et dit qu’elle est heureuse de la rencontrer.
    note: از دیدن شما خوشحال شدم est une variante naturelle de la formule « enchanté(e) », qui utilise دیدن (voir) au lieu de آشنایی.
exercises:
