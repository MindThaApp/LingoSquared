  prs.a1.unit02.lesson01.exercise02.recognize_polite_vs_informal:
    instruction: نامت چیست؟ convient pour s’adresser à…
    correct_option: un(e) ami(e) proche
    distractors:
    - un inconnu que tu viens de rencontrer
    - une personne âgée lors d’un événement officiel
    - un client de ta boutique
    accepted_answers:
    - value: un(e) ami(e) proche
      status: correct
    feedback: Le possessif familier -ت dans نامت ne convient qu’à un ami proche ou à une personne de ton âge, comme la règle de تو/استی à l’unité 1.
