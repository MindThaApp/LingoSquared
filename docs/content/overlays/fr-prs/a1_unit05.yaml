course:
  title: Dari A1
  description: 'Dari afghan pour débutants : nommer les lieux courants de la ville, demander où se trouve quelque chose, donner des réponses simples sur l’emplacement et suivre des indications de base pour se rendre quelque part.'
units:
  prs.a1.unit05.places:
    title: Lieux importants de la ville
