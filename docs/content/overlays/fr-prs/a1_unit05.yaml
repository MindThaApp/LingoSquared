  prs.a1.unit05.lesson06.finding_pharmacy_dialogue:
    title: Trouver la pharmacie dans le quartier
teaching:
  prs.a1.unit05.lesson01.teach.bazaar:
    title: Marché
    gloss: marché / bazar
    note: بازار est le mot courant pour une zone de marché, souvent toute une rue ou un quartier de boutiques.
    example_gloss: Le bazar est proche.
  prs.a1.unit05.lesson01.teach.bank:
    title: Banque
    gloss: banque
    note: بانک est un emprunt direct, très proche du mot français « banque » par son sens et son usage.
    example_gloss: Où est la banque ?
  prs.a1.unit05.lesson01.teach.mosque:
    title: Mosquée
    gloss: mosquée
    note: مسجد est le mot standard pour une mosquée.
    example_gloss: La mosquée est grande.
  prs.a1.unit05.lesson01.teach.hospital:
    title: Hôpital
    gloss: hôpital
    note: شفاخانه est le mot courant en dari afghan pour « hôpital ». Il diffère du mot persan d’Iran بیمارستان, que les locuteurs du dari peuvent comprendre mais n’emploient normalement pas.
    example_gloss: L’hôpital est loin.
  prs.a1.unit05.lesson01.teach.school:
    title: École
    gloss: école
    note: مکتب est le mot courant en dari afghan pour « école ». Il diffère du mot persan d’Iran مدرسه, qui en dari désigne plutôt une école religieuse.
    example_gloss: L’école est près de la maison.
  prs.a1.unit05.lesson01.teach.pharmacy:
    title: Pharmacie
    gloss: pharmacie
    note: دواخانه est le mot courant en dari afghan pour « pharmacie » (de دوا, médicament). Il diffère du mot persan d’Iran داروخانه.
    example_gloss: Où est la pharmacie ?
  prs.a1.unit05.lesson01.teach.va_word:
    title: Et
    gloss: et
    note: و est le mot de liaison courant pour énumérer plusieurs lieux.
    target_text: و (et)
  prs.a1.unit05.lesson02.teach.post_office:
    title: Bureau de poste
    gloss: bureau de poste
    note: پوسته خانه associe پوسته (poste, courrier) et خانه (maison, bâtiment).
    example_gloss: La poste est fermée.
  prs.a1.unit05.lesson02.teach.embassy:
    title: Ambassade
    gloss: ambassade
    note: سفارت est le mot standard pour une ambassade.
    example_gloss: L’ambassade est à Kaboul.
  prs.a1.unit05.lesson02.teach.airport:
    title: Aéroport
    gloss: aéroport
    note: میدان هوایی est le terme courant en dari afghan pour « aéroport » (littéralement « champ d’air »). Il diffère du mot persan d’Iran فرودگاه.
    example_gloss: L’aéroport est loin.
  prs.a1.unit05.lesson02.teach.office_review:
    title: Bureau (révision)
    gloss: bureau
    note: دفتر a déjà été vu dans une unité précédente ; il figure ici avec les autres lieux administratifs.
    example_gloss: Mon bureau est proche.
  prs.a1.unit05.lesson03.teach.kojast_bazaar:
    title: Demander où est le marché
    gloss: Où est le marché ?
    note: بازار کجاست؟ est la structure de base pour demander où se trouve un lieu.
  prs.a1.unit05.lesson03.teach.kojast_hospital:
    title: Demander où est l’hôpital
    gloss: Où est l’hôpital ?
    note: La même structure avec کجاست s’applique à n’importe quel nom de lieu.
  prs.a1.unit05.lesson03.teach.bebakhshid:
    title: Attirer poliment l’attention de quelqu’un
    gloss: Excusez-moi, où est la pharmacie ?
    note: ببخشین ouvre poliment une question à un inconnu, comme « excusez-moi » en français.
  prs.a1.unit05.lesson03.teach.kojast_grammar:
    title: Comment se forme کجاست
    gloss: کجاست est کجا (où) plus است (est), contractés ensemble.
    note: Reconnaître cette décomposition t’aide à voir la structure, plutôt que de mémoriser کجاست comme un bloc inanalysé.
  prs.a1.unit05.lesson04.teach.near:
    title: Près de
    gloss: près de
    note: نزدیک décrit ce qui est proche.
    example_gloss: La banque est proche.
  prs.a1.unit05.lesson04.teach.far:
    title: Loin
    gloss: loin
    note: دور décrit ce qui se trouve à distance.
    example_gloss: L’hôpital est loin.
  prs.a1.unit05.lesson04.teach.here:
    title: Ici
    gloss: ici
    note: این‌جا désigne l’endroit où se trouve la personne qui parle.
    example_gloss: La banque est ici.
  prs.a1.unit05.lesson04.teach.there:
    title: Là-bas
    gloss: là-bas
    note: آن‌جا désigne un endroit éloigné de la personne qui parle.
    example_gloss: La pharmacie est là-bas.
  prs.a1.unit05.lesson04.teach.bazaar_near:
    title: Dire que le marché est proche
    gloss: Le marché est proche.
    note: بازار نزدیک است emploie la même copule است que dans le reste du cours.
  prs.a1.unit05.lesson04.teach.airport_far:
    title: Dire que l’aéroport est loin
    gloss: L’aéroport est loin.
    note: میدان هوایی دور است suit la même structure, avec دور à la place de نزدیک.
  prs.a1.unit05.lesson05.teach.next_to:
    title: À côté de
    gloss: à côté de
    note: در کنار signifie littéralement « sur le côté de ».
  prs.a1.unit05.lesson05.teach.behind:
    title: Derrière
    gloss: derrière
    note: پشت indique que quelque chose se trouve derrière un autre lieu.
    example_gloss: La pharmacie est derrière l’école.
  prs.a1.unit05.lesson05.teach.opposite:
    title: En face de
    gloss: en face de
    note: مقابل indique que quelque chose se trouve juste en face d’un autre lieu.
    example_gloss: La banque est en face de la mosquée.
  prs.a1.unit05.lesson05.teach.hospital_next_to_mosque:
    title: Situer l’hôpital par rapport à la mosquée
    gloss: L’hôpital est à côté de la mosquée.
    note: شفاخانه در کنار مسجد است associe un lieu, la préposition در کنار et la copule است.
  prs.a1.unit05.lesson06.teach.tashakor_ziad:
    title: Merci beaucoup
    gloss: Merci beaucoup.
    note: تشکر زیاد renforce تشکر, déjà appris et employé au quotidien.
  prs.a1.unit05.lesson06.teach.turn01:
    title: Zarmina demande où est la pharmacie
    gloss: Zarmina demande poliment à un passant où se trouve la pharmacie.
    note: ببخشین ouvre la question avec respect, ce qui convient pour s’adresser à un inconnu.
  prs.a1.unit05.lesson06.teach.turn02:
    title: Le passant indique le chemin
    gloss: Le passant dit que la pharmacie n’est pas loin, qu’il faut aller tout droit, puis qu’elle est à côté de l’école.
    note: 'Cette phrase combine plusieurs structures de l’unité : دور نیست (دور à la forme négative), مستقیم بروین et در کنار.'
  prs.a1.unit05.lesson06.teach.turn03:
    title: Zarmina remercie le passant
    gloss: Zarmina le remercie chaleureusement.
    note: تشکر زیاد conclut poliment l’échange.
  prs.a1.unit05.lesson06.teach.turn04:
    title: La réponse modeste du passant
    gloss: Il n’y a pas de quoi.
    note: 'قابلی نداره est une façon modeste et courante, en dari afghan de tous les jours, de répondre à des remerciements ; sa fonction est proche de خواهش می‌کنم, mais le ton est plus familier. نداره est la forme parlée de ندارد : à l’oral on entend نداره, tandis que l’écrit soigné emploie ندارد.'
