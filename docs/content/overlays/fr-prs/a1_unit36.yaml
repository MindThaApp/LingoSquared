course:
  title: Dari A1
  description: 'Dari de Kaboul pour débutants : nomme les ustensiles et les ingrédients de la cuisine, décris des gestes culinaires, suis des étapes de recette simples et parle de la préparation d’un repas.'
units:
  prs.a1.unit36.cooking:
    title: La cuisine
    description: Nommer les gestes de base en cuisine, décrire la préparation d’un plat, et suivre ou donner des instructions de cuisine simples.
