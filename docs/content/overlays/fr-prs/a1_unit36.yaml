teaching:
  prs.a1.unit36.lesson01.teach.kitchen_word:
    title: Cuisine
    gloss: cuisine
    note: آشپزخانه est le mot dari standard pour désigner une cuisine.
    example_gloss: Aujourd’hui, je suis dans la cuisine.
  prs.a1.unit36.lesson01.teach.food_word:
    title: Nourriture
    gloss: nourriture / repas
    note: غذا désigne la nourriture ou un repas en général, à la différence d’un plat précis comme پلو.
    example_gloss: Le repas est délicieux.
  prs.a1.unit36.lesson01.teach.onion_word:
    title: Oignon
    gloss: oignon
    note: پیاز est le mot dari courant pour l’oignon, très utilisé dans la cuisine afghane.
    example_gloss: L’oignon est frais.
  prs.a1.unit36.lesson01.teach.meat_word:
    title: La viande
    gloss: viande
    note: گوشت signifie viande.
    example_gloss: La viande est fraîche.
  prs.a1.unit36.lesson01.teach.review_basics:
    title: 'Révision : un, vouloir, dans, être'
    gloss: un/une / je veux / dans ou à / je suis
    note: یک, می‌خواهم, در et استم sont des formes déjà vues, utilisées dans les phrases de cuisine de cette unité.
    target_text: یک (un/une) / می‌خواهم (je veux) / در (dans/à) / استم (je suis)
  prs.a1.unit36.lesson01.teach.cook_food_phrase:
    title: Je prépare le repas
    gloss: Je prépare le repas.
    note: می‌پزم est la forme de la première personne du présent de پختن, cuire, faire cuire.
  prs.a1.unit36.lesson01.teach.in_kitchen_phrase:
    title: Je suis dans la cuisine
    gloss: Je suis dans la cuisine.
    note: استم est la forme de la première personne de la copule, employée ici avec در pour indiquer le lieu.
  prs.a1.unit36.lesson02.teach.salt_word:
    title: Sel
    gloss: sel
    note: نمک signifie sel.
    example_gloss: Je veux du sel.
  prs.a1.unit36.lesson02.teach.rice_grain_word:
    title: Riz
    gloss: riz
    note: برنج désigne le riz cru (le grain), à la différence de پلو, le plat de riz cuit étudié dans l’unité sur la nourriture.
    example_gloss: Je fais cuire du riz.
  prs.a1.unit36.lesson02.teach.review_do_cut:
    title: 'Révision : je fais, coupé'
    gloss: je fais / coupé, haché
    note: می‌کنم est une révision ; خرد est nouveau et se combine avec les formes de کردن pour signifier hacher ou couper.
    target_text: می‌کنم (je fais) / خرد (coupé / haché)
  prs.a1.unit36.lesson02.teach.chop_onion_phrase:
    title: Je hache l’oignon
    gloss: Je hache l’oignon.
    note: 'خرد می‌کنم signifie littéralement « je le rends haché » : c’est un schéma courant de verbe composé.'
  prs.a1.unit36.lesson02.teach.add_salt_phrase:
    title: J’ajoute du sel
    gloss: J’ajoute du sel.
    note: می‌اندازم (de انداختن, jeter, mettre dedans) est le verbe dari naturel pour ajouter un ingrédient.
  prs.a1.unit36.lesson02.teach.cook_meat_phrase:
    title: Je fais cuire de la viande
    gloss: Je fais cuire de la viande.
    note: Remplace گوشت par برنج pour nommer un autre aliment que l’on cuisine.
  prs.a1.unit36.lesson03.teach.review_first_then:
    title: 'Révision : d’abord, ensuite'
    gloss: d’abord / ensuite
    note: اول et بعد sont des mots déjà vus, utilisés pour ordonner les étapes d’une recette.
    target_text: اول (d’abord) / بعد (ensuite)
  prs.a1.unit36.lesson03.teach.review_water_hot:
    title: 'Révision : eau, chaud'
    gloss: eau / chaud
    note: آب et گرم sont des mots déjà vus dans des unités précédentes.
    target_text: آب (eau) / گرم (chaud)
  prs.a1.unit36.lesson03.teach.pour_word:
    title: Je verse
    gloss: je verse
    note: می‌ریزم (de ریختن, verser) est le verbe naturel pour ajouter un liquide ; il se distingue de می‌اندازم, employé pour les ingrédients solides.
    example_gloss: Je verse de l’eau.
  prs.a1.unit36.lesson03.teach.first_chop_phrase:
    title: D’abord, je hache l’oignon
    gloss: D’abord, je hache l’oignon.
    note: اول marque la première étape d’une suite d’actions.
  prs.a1.unit36.lesson03.teach.then_cook_meat_phrase:
    title: Ensuite, je fais cuire la viande
    gloss: Ensuite, je fais cuire la viande.
    note: بعد marque l’étape suivante d’une suite d’actions.
  prs.a1.unit36.lesson03.teach.pour_hot_water_phrase:
    title: Je verse de l’eau chaude
    gloss: Je verse de l’eau chaude.
    note: Associe گرم (chaud) et می‌ریزم (je verse).
  prs.a1.unit36.lesson04.teach.review_dialogue_words:
    title: Bonjour / oui / s’il vous plaît / d’accord / merci / ragoût / délicieux / est
    gloss: bonjour / oui / s’il vous plaît / d’accord, bien sûr / merci / ragoût / délicieux / est
    note: سلام, بلی, لطفاً, چشم, تشکر, قورمه, خوش‌مزه et است sont des mots de révision utilisés dans le dialogue en cuisine.
    target_text: سلام (bonjour) / بلی (oui) / لطفاً (s’il vous plaît) / چشم (d’accord / bien sûr) / تشکر (merci) / قورمه (ragoût) / خوش‌مزه (délicieux) / است (est)
  prs.a1.unit36.lesson04.teach.dialogue_line1:
    title: 'Nadia : Bonjour, qu’est-ce que vous faites cuire ?'
    gloss: Bonjour, qu’est-ce que vous faites cuire ?
    note: چی می‌پزین؟ utilise la forme de politesse می‌پزین (vous).
  prs.a1.unit36.lesson04.teach.dialogue_line2:
    title: 'Farid : Je fais cuire un qorma.'
    gloss: Je fais cuire un qorma.
  prs.a1.unit36.lesson04.teach.dialogue_line3:
    title: 'Nadia : Je vous aide ?'
    gloss: Je vous aide ?
    note: کمک می‌کنم؟ signifie littéralement « Est-ce que j’aide ? », une façon naturelle de proposer son aide.
  prs.a1.unit36.lesson04.teach.dialogue_line4:
    title: 'Farid : Oui, hachez l’oignon, s’il vous plaît.'
    gloss: Oui, hachez l’oignon, s’il vous plaît.
    note: 'کنین est l’impératif de politesse : « hachez ! »'
  prs.a1.unit36.lesson04.teach.dialogue_line5:
    title: 'Nadia : Bien sûr.'
    gloss: Bien sûr.
  prs.a1.unit36.lesson04.teach.dialogue_line6:
    title: 'Farid : Merci, c’est délicieux.'
    gloss: Merci, c’est délicieux.
  prs.a1.unit36.lesson05.teach.review_he_she_words:
    title: Il/elle, dans, fait, cuisine, très, heureux/heureuse, est
    gloss: il/elle / dans ou à / il/elle fait / il/elle fait cuire / très / content(e) / est
    note: او est le pronom dari pour « il » ou « elle » ; می‌کند et می‌پزد sont les formes de la troisième personne des verbes employés plus haut dans cette unité.
    target_text: او (il/elle) / در (dans/à) / می‌کند (il/elle fait) / می‌پزد (il/elle cuisine) / بسیار (très) / خوشحال (heureux/heureuse) / است (est)
  prs.a1.unit36.lesson05.teach.reading_passage:
    title: 'Lecture : Nadia fait la cuisine'
    gloss: Nadia est dans la cuisine. Elle hache l’oignon. Ensuite, elle fait cuire la viande. Le plat est très bon. Nadia est contente.
  prs.a1.unit36.lesson06.teach.review_like_but_time:
    target_text: دوست دارم (j’aime) / را (marque de l’objet) / اما (mais) / وقت ندارم (je n’ai pas le temps)
