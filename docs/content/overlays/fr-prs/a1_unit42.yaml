    title: 'Homayoun : Bonjour. Je voudrais prendre rendez-vous avec le dentiste.'
    gloss: Bonjour. Je voudrais prendre rendez-vous avec le dentiste.
  prs.a1.unit42.lesson04.teach.dialogue_line2:
    title: 'La réceptionniste : Bonjour. Quel jour êtes-vous libre ?'
    gloss: Bonjour. Quel jour êtes-vous libre ?
  prs.a1.unit42.lesson04.teach.dialogue_line3:
    title: 'Homayoun : Je suis libre lundi.'
    gloss: Je suis libre lundi.
  prs.a1.unit42.lesson04.teach.dialogue_line4:
    title: 'La réceptionniste : Très bien. Lundi à dix heures, ça vous va ?'
    gloss: Très bien. Lundi à dix heures, ça vous va ?
  prs.a1.unit42.lesson04.teach.dialogue_line5:
    title: 'Homayoun : C’est très bien. Merci beaucoup.'
    gloss: C’est très bien. Merci beaucoup.
  prs.a1.unit42.lesson04.teach.dialogue_line6:
    title: 'La réceptionniste : Je vous en prie.'
    gloss: Je vous en prie.
  prs.a1.unit42.lesson05.teach.review_he_she_has:
    title: 'Révision : Homayoun, il/elle, il/elle a'
    gloss: Homayoun / il, elle / il/elle a
    note: همایون, او et دارد sont des mots de révision employés dans le texte à lire.
    target_text: همایون (Homayoun) / او (il / elle) / دارد (il / elle a)
  prs.a1.unit42.lesson05.teach.reading_passage:
    title: 'Lecture : le rendez-vous'
    gloss: Homayoun a un rendez-vous. Son rendez-vous est chez le dentiste. Son rendez-vous est lundi. Son rendez-vous est à dix heures. Homayoun est content.
  prs.a1.unit42.lesson06.teach.review_wrap_up_words:
    title: 'Révision : je n’ai pas, mais, vous (forme de politesse)'
    gloss: je n’ai pas / mais / vous (forme de politesse)
    note: ندارم, اما et شما sont des mots de révision qui servent à opposer deux jours.
    target_text: ندارم (je n’ai pas) / اما (mais) / شما (vous, forme de politesse)
  prs.a1.unit42.lesson06.teach.review_tuesday:
    title: 'Révision : mardi'
