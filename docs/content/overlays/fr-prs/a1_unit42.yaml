teaching:
  prs.a1.unit42.lesson01.teach.review_appointment_doctor_have:
    title: 'Révision : rendez-vous, médecin, j’ai, est'
    gloss: rendez-vous / médecin / j’ai / est
    note: قرار, داکتر, دارم et است sont des mots de révision utilisés pour parler d’un rendez-vous.
    target_text: قرار (rendez-vous) / داکتر (médecin) / دارم (j’ai) / است (est)
  prs.a1.unit42.lesson01.teach.review_want_one:
    title: 'Révision : je veux, un/une'
    gloss: je veux / un, une / un
    note: می‌خواهم et یک se combinent pour dire ce que tu veux.
    target_text: می‌خواهم (je veux) / یک (un / une)
  prs.a1.unit42.lesson01.teach.tooth_word:
    title: Dent
    gloss: dent
    note: دندان est le mot dari standard pour « dent ».
    example_gloss: J’ai une dent.
  prs.a1.unit42.lesson01.teach.dentist_phrase:
    title: Dentiste
    gloss: dentiste
    note: داکتر دندان signifie littéralement « médecin des dents » ; c’est le mot dari courant en Afghanistan pour désigner un dentiste.
  prs.a1.unit42.lesson01.teach.want_appointment_phrase:
    title: Je veux un rendez-vous
    gloss: Je veux un rendez-vous.
    note: یک قرار می‌خواهم combine یک (un), قرار (rendez-vous) et می‌خواهم (je veux).
  prs.a1.unit42.lesson01.teach.review_with:
    title: 'Révision : avec'
    gloss: avec
    note: با signifie « avec ».
    target_text: با (avec)
  prs.a1.unit42.lesson01.teach.want_appointment_dentist_phrase:
    title: Je veux un rendez-vous avec le dentiste
    gloss: Je veux un rendez-vous avec le dentiste.
    note: با داکتر دندان (avec le dentiste) s’ajoute à یک قرار می‌خواهم.
  prs.a1.unit42.lesson02.teach.review_which_day:
    title: 'Révision : quel, jour'
    gloss: quel / jour
    note: کدام et روز sont des mots de révision qui servent à poser une question sur un jour.
    target_text: کدام (quel) / روز (jour)
  prs.a1.unit42.lesson02.teach.review_free_are:
    title: 'Révision : libre, vous êtes (poli)'
    gloss: libre / vous êtes (poli)
    note: آزاد et استین se combinent pour demander si quelqu’un est libre.
    target_text: آزاد (libre) / استین (êtes, vous de politesse)
  prs.a1.unit42.lesson02.teach.which_day_free_phrase:
    title: Quel jour êtes-vous libre ?
    gloss: Quel jour êtes-vous libre ?
    note: کدام روز آزاد استین؟ demande quel jour quelqu’un est disponible.
  prs.a1.unit42.lesson02.teach.review_monday_am:
    title: 'Révision : lundi, je suis'
    gloss: lundi / je suis
    note: دوشنبه et استم sont des mots de révision qui servent à répondre.
    target_text: دوشنبه (lundi) / استم (je suis)
  prs.a1.unit42.lesson02.teach.day_free_answer_phrase:
    title: Je suis libre lundi
    gloss: Je suis libre lundi.
    note: دوشنبه آزاد استم répond à la question en donnant un jour précis.
  prs.a1.unit42.lesson02.teach.review_hour_what:
    title: 'Révision : heure, quel/combien'
    gloss: heure / quel, combien
    note: ساعت et چند (vus aux unités 9 et 11) se combinent pour demander l’heure d’un rendez-vous.
    target_text: ساعت (heure) / چند (combien / quel nombre)
  prs.a1.unit42.lesson02.teach.what_time_free_phrase:
    title: À quelle heure êtes-vous libre ?
    gloss: À quelle heure êtes-vous libre ?
    note: ساعت چند آزاد استین؟ demande à quelle heure quelqu’un est disponible.
  prs.a1.unit42.lesson03.teach.review_want_appointment:
    title: 'Révision : je veux, rendez-vous'
    gloss: je veux / rendez-vous
    note: می‌خواهم et قرار sont des mots de révision qui servent à demander un rendez-vous.
    target_text: می‌خواهم (je veux) / قرار (rendez-vous)
  prs.a1.unit42.lesson03.teach.get_word:
    title: Prendre
    gloss: prendre
    note: بگیرم est une forme du subjonctif (« que je prenne »), employée avec می‌خواهم pour dire « je veux prendre ».
    example_gloss: Je veux prendre un rendez-vous.
  prs.a1.unit42.lesson03.teach.for_word:
    title: Pour
    gloss: pour
    note: برای signifie « pour ».
    example_gloss: Pour le dentiste.
  prs.a1.unit42.lesson03.teach.review_ten_how:
    title: 'Révision : dix, comment'
    gloss: dix / comment
    note: ده et چطور sont des mots de révision qui servent à proposer une heure.
    target_text: ده (dix) / چطور (comment)
  prs.a1.unit42.lesson03.teach.confirm_time_phrase:
    title: Lundi à dix heures, ça vous va ?
    gloss: Lundi à dix heures, ça vous va ?
    note: دوشنبه ساعت ده چطور است؟ propose un jour et une heure précis.
  prs.a1.unit42.lesson03.teach.review_very_good:
    title: 'Révision : très, bien'
    gloss: très / bon, bien
    note: بسیار et خوب sont des mots de révision qui servent à confirmer une heure.
    target_text: بسیار (très) / خوب (bien / bon)
  prs.a1.unit42.lesson03.teach.confirm_answer_phrase:
    title: C’est très bien
    gloss: C’est très bien.
    note: بسیار خوب است confirme que l’heure proposée convient.
  prs.a1.unit42.lesson04.teach.review_greeting_want:
