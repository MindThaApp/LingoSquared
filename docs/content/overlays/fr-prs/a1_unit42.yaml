    gloss: bonjour / je veux
    note: سلام et می‌خواهم sont des mots de révision employés dans le dialogue.
    target_text: سلام (bonjour) / می‌خواهم (je veux)
  prs.a1.unit42.lesson04.teach.review_thanks_welcome:
    title: 'Révision : merci beaucoup, de rien'
    gloss: merci beaucoup / de rien
    note: تشکر زیاد et خواهش می‌کنم sont des mots de révision employés dans le dialogue.
    target_text: تشکر زیاد (merci beaucoup) / خواهش می‌کنم (je vous en prie)
  prs.a1.unit42.lesson04.teach.receptionist_word:
