    title: J’ai rendez-vous lundi, mais pas mardi
    gloss: J’ai rendez-vous lundi, mais je n’en ai pas mardi.
    note: اما oppose le fait d’avoir un rendez-vous lundi et de ne pas en avoir mardi.
