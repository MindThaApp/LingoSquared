course:
  title: Dari A1
  description: 'Dari de Kaboul pour débutants : prendre et confirmer un rendez-vous simple en indiquant le service, le jour et l’heure. Tu apprendras à demander quel jour quelqu’un est libre, à proposer et confirmer un jour et une heure, et à lire un court texte sur un rendez-vous pris.'
units:
  prs.a1.unit42.appointments:
    title: Prendre rendez-vous
    description: Demander quel jour quelqu’un est libre, nommer un service, proposer et confirmer un jour et une heure, et lire un court texte sur un rendez-vous pris.
