    title: 'Révision : votre billet, combien'
    gloss: votre billet / combien
    note: « Votre billet » utilise le même suffixe de politesse que « votre billet de piscine » de l’unité 50 et « votre billet de cinéma » de l’unité 52.
    target_text: تکت‌تان (votre billet) / چند (combien)
