course:
  title: Dari A1
  description: 'Dari de Kaboul pour débutants : visiter un musée, lire une information sur une exposition et le prix d’un billet, acheter un billet d’entrée, demander les horaires d’ouverture et parler simplement de ce que tu as vu.'
units:
  prs.a1.unit53.museum:
    title: Musée
    description: Visiter un musée, acheter un billet d’entrée, poser une question sur une exposition ou sur les horaires d’ouverture, et parler simplement de ce que tu as vu.
lessons:
  prs.a1.unit53.lesson01.museum_and_staff_vocabulary:
    title: Le musée et l’employé
  prs.a1.unit53.lesson02.exhibition_and_ticket_price:
    title: L’exposition et le prix du billet
  prs.a1.unit53.lesson03.asking_about_the_exhibition_and_getting_a_ticket:
    title: Se renseigner sur l’exposition et obtenir un billet
  prs.a1.unit53.lesson04.museum_dialogue:
    title: Dialogue au musée
  prs.a1.unit53.lesson05.reading:
    title: Lecture sur le musée
  prs.a1.unit53.lesson06.wrap_up:
    title: Récapitulatif
teaching:
  prs.a1.unit53.lesson01.teach.review_this_is_in_good:
    title: 'Révision : ceci, est, dans, bien'
    gloss: ceci / est / dans / bien
    note: Ce sont des mots de révision (utilisés tout au long du cours) pour parler du musée.
    target_text: این (ceci / c') / است (est) / در (dans / à) / خوب (bon)
  prs.a1.unit53.lesson01.teach.museum_word:
    title: Musée
    gloss: musée
    note: C’est le mot courant en dari d’Afghanistan pour dire « musée » ; il diffère du mot موزه utilisé en persan d’Iran.
    example_gloss: Le musée est bien.
  prs.a1.unit53.lesson01.teach.review_staff_word:
    title: 'Révision : employé'
    gloss: employé
    note: C’est le même mot général pour « employé » déjà vu au cinéma et à la piscine, réutilisé ici pour le guichet du musée.
    target_text: کارمند (employé)
  prs.a1.unit53.lesson01.teach.this_is_museum_phrase:
    title: Ceci est un musée
    gloss: C’est un musée.
    note: Cette phrase associe « ceci », « est » et « musée » comme le fait déjà ce cours ailleurs.
  prs.a1.unit53.lesson01.teach.staff_at_museum_phrase:
    title: L’employé est au musée
    gloss: L’employé est au musée.
    note: Cette phrase associe « employé », « dans » et « musée ».
  prs.a1.unit53.lesson02.teach.review_price_and_exhibit_words:
    title: 'Révision : combien, afghani, est, quarante, dans, photo, intéressant, billet'
    gloss: combien / afghani / est / quarante / dans / photo / intéressant / billet
    note: Ce sont des mots de révision (vus dans les unités précédentes) pour parler du prix et de l’exposition du musée.
    target_text: چند (combien) / افغانی (afghani) / است (est) / چهل (quarante) / در (dans / à) / عکس (photo) / جالب (intéressant) / تکت (billet)
  prs.a1.unit53.lesson02.teach.exhibition_word:
    title: Exposition
    gloss: exposition
    note: 'C’est un mot courant en dari et en persan pour « exposition » : نمایش (présentation) + گاه (lieu).'
    example_gloss: L’exposition de photos est intéressante.
  prs.a1.unit53.lesson02.teach.museum_notice_reading:
    title: Lire l’affiche du musée
    gloss: Au musée, il y a une exposition de photos. Le billet coûte 40 afghanis.
  prs.a1.unit53.lesson02.teach.ask_museum_ticket_price_phrase:
    title: Combien coûte le billet du musée ?
    gloss: Combien coûte le billet du musée ?
    note: Cette phrase réunit les mots vus plus tôt dans cette leçon.
  prs.a1.unit53.lesson02.teach.museum_ticket_price_answer_phrase:
    title: Le billet coûte 40 afghanis
    gloss: Le billet coûte 40 afghanis.
    note: Cette phrase donne le prix du billet du musée indiqué sur l’affiche.
  prs.a1.unit53.lesson03.teach.review_ask_want_setup:
    title: 'Révision : vous (formel), qu’est-ce que c’est, je, je veux, un/une'
    gloss: vous (formel) / qu’est-ce que c’est / je / je veux / un/une
    note: Ce sont des mots de révision pour poser une question et dire ce que l’on veut.
    target_text: شما (vous, formel) / چیست (qu'est-ce que) / من (je / moi) / می‌خواهم (je veux) / یک (un / une)
  prs.a1.unit53.lesson03.teach.review_exhibition_word:
    title: 'Révision : exposition'
    gloss: exposition
    note: C’est un mot de révision pour demander ce qu’est l’exposition.
    target_text: نمایشگاه (exposition)
  prs.a1.unit53.lesson03.teach.ask_exhibition_phrase:
    title: Qu’est-ce que c’est, l’exposition ?
    gloss: Qu’est-ce que c’est, l’exposition ?
    note: Cette phrase reprend la structure de question « qu’est-ce que c’est » déjà établie dans ce cours, appliquée à l’exposition.
  prs.a1.unit53.lesson03.teach.exhibition_is_photos_phrase:
    title: L’exposition est une exposition de photos
    gloss: L’exposition est une exposition de photos.
    note: Cette phrase indique le thème de l’exposition.
  prs.a1.unit53.lesson03.teach.review_ticket_please:
    title: 'Révision : billet, s’il vous plaît'
    gloss: billet / s’il vous plaît
    note: Ce sont des mots de révision pour demander un billet.
    target_text: تکت (billet) / لطفاً (s'il vous plaît)
  prs.a1.unit53.lesson03.teach.want_ticket_please_phrase:
    title: Je voudrais un billet, s’il vous plaît
    gloss: Je voudrais un billet, s’il vous plaît.
    note: Cette phrase associe « billet », « vouloir » et « s’il vous plaît ».
  prs.a1.unit53.lesson04.teach.review_hello_want_ticket:
    title: 'Révision : bonjour, un/une, billet, je veux'
    gloss: bonjour / un/une / billet / je veux
    note: Ce sont des mots de révision pour ouvrir le dialogue.
    target_text: سلام (bonjour) / یک (un / une) / تکت (billet) / می‌خواهم (je veux)
  prs.a1.unit53.lesson04.teach.review_welcome_open_hours:
    title: 'Révision : voici, musée, à partir de, heure, neuf, ouvert'
    gloss: voici / musée / à partir de / heure / neuf / ouvert
    note: Ce sont des mots de révision pour indiquer l’heure d’ouverture du musée.
    target_text: بفرمایین (je vous en prie / voici) / موزیم (musée) / از (de) / ساعت (heure) / نه (neuf) / باز (ouvert)
  prs.a1.unit53.lesson04.teach.review_ask_exhibition:
    title: 'Révision : exposition, qu’est-ce que c’est'
    gloss: exposition / qu’est-ce que c’est
    note: Ce sont des mots de révision pour poser une question sur l’exposition.
    target_text: نمایشگاه (exposition) / چیست (qu'est-ce que)
  prs.a1.unit53.lesson04.teach.review_photos_and_price:
    title: 'Révision : photo, quarante, afghani, est'
    gloss: photo / quarante / afghani / est
    note: Ce sont des mots de révision pour indiquer le thème de l’exposition et le prix du billet.
    target_text: عکس (photo) / چهل (quarante) / افغانی (afghani) / است (est)
  prs.a1.unit53.lesson04.teach.review_thanks_welcome:
    title: 'Révision : merci beaucoup, de rien'
    gloss: merci beaucoup / de rien
    note: Ce sont des mots de révision pour conclure le dialogue.
    target_text: تشکر زیاد (merci beaucoup) / خواهش می‌کنم (de rien)
  prs.a1.unit53.lesson04.teach.dialogue_line1:
    title: 'Homayoun : Bonjour. Je voudrais un billet.'
    gloss: Bonjour. Je voudrais un billet.
  prs.a1.unit53.lesson04.teach.dialogue_line2:
    title: 'L’employé : Bonjour, voici. Le musée est ouvert à partir de neuf heures.'
    gloss: Bonjour, voici. Le musée est ouvert à partir de neuf heures.
  prs.a1.unit53.lesson04.teach.dialogue_line3:
    title: 'Homayoun : Qu’est-ce que c’est, l’exposition ?'
    gloss: Qu’est-ce que c’est, l’exposition ?
  prs.a1.unit53.lesson04.teach.dialogue_line4:
    title: 'L’employé : L’exposition est une exposition de photos. Le billet coûte 40 afghanis.'
    gloss: L’exposition est une exposition de photos. Le billet coûte 40 afghanis.
  prs.a1.unit53.lesson04.teach.dialogue_line5:
    title: 'Homayoun : Merci beaucoup.'
    gloss: Merci beaucoup.
  prs.a1.unit53.lesson04.teach.dialogue_line6:
    title: 'L’employé : De rien.'
    gloss: De rien.
  prs.a1.unit53.lesson05.teach.review_this_is_in_museum:
    title: 'Révision : ceci, est, dans, musée'
    gloss: ceci / est / dans / musée
    note: Ce sont des mots de révision utilisés dans le texte à lire.
    target_text: این (ceci / c') / است (est) / در (dans / à) / موزیم (musée)
