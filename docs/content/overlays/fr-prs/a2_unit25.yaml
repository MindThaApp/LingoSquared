    feedback: '*رفته‌ام* est le participe *رفته* plus la terminaison *-ام* : *به هرات رفته‌ام* signifie « je suis allé à Hérat ».'
  prs.a2.unit25.lesson01.exercise02.recognize_we_bamyan:
