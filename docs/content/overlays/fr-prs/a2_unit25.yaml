course:
  title: Dari en français A2
  description: 'Dari afghan, niveau pré-intermédiaire : dire et demander ce que l’on a fait ou jamais fait. Le passé composé (participe passé et copule courte) dans sa forme écrite رفته‌ام et dans sa forme parlée de Kaboul رفتیم, la négation, et le contraste avec le passé simple.'
units:
  prs.a2.unit25.have_you_ever:
    title: As-tu déjà… ?
lessons:
  prs.a2.unit25.lesson01.experience_words_and_perfect_forms:
    title: Mots de l’expérience et la forme رفته‌ام
  prs.a2.unit25.lesson02.more_participles_and_spoken_forms:
    title: Plus de participes et les formes parlées
  prs.a2.unit25.lesson03.negative_and_simple_past_contrast:
    title: La négation, et le passé composé face au passé simple
  prs.a2.unit25.lesson04.ever_never_already_yet:
    title: Jamais, déjà et pas encore
  prs.a2.unit25.lesson05.reading_and_listening:
    title: Lire et écouter des récits d’expériences
  prs.a2.unit25.lesson06.conversation_about_experiences:
    title: Une conversation sur les expériences
teaching:
  prs.a2.unit25.lesson01.teach.ever:
    title: Jusqu’à présent, déjà
    gloss: jusqu’à présent, déjà
    note: '*تا حال* signifie jusqu’à maintenant. Dans une question, il porte sur toute ta vie jusqu’ici : *آیا تا حال به هرات رفته‌ای؟* signifie : es-tu déjà allé à Hérat ? *آیا* introduit une question à réponse oui ou non.'
    example_gloss: Es-tu déjà allé à Hérat ?
  prs.a2.unit25.lesson01.teach.herat:
    title: Hérat
    gloss: Hérat
    note: '*هرات* est une grande ville de l’ouest de l’Afghanistan, connue pour sa vieille citadelle et ses marchés.'
    example_gloss: Mon ami vient de Hérat.
  prs.a2.unit25.lesson01.teach.mazar:
    title: Mazar-e Charif
    gloss: Mazar-e Charif
    note: '*مزار شریف* est la grande ville du nord de l’Afghanistan, connue pour son sanctuaire aux faïences bleues.'
    example_gloss: Mon ami habite à Mazar-e Charif.
  prs.a2.unit25.lesson01.teach.bamyan:
    title: Bâmiyân
    gloss: Bâmiyân
    note: '*بامیان* est une vallée des hauts plateaux du centre de l’Afghanistan, connue pour ses paysages de montagne.'
    example_gloss: Mon ami est allé à Bâmiyân.
  prs.a2.unit25.lesson01.teach.qabili:
    title: Qabili palaw
    gloss: qabili palaw (riz à la viande, aux carottes et aux raisins secs)
    note: '*قابلی پلو* est du riz cuit avec de la viande, des carottes et des raisins secs, un plat afghan très apprécié.'
    example_gloss: Le qabili palaw est très bon.
  prs.a2.unit25.lesson01.teach.mantu:
    title: Mantu
    gloss: mantu (raviolis vapeur)
    note: '*منتو* sont des raviolis cuits à la vapeur, farcis de viande et d’oignon.'
    example_gloss: J’aime les mantu.
  prs.a2.unit25.lesson01.teach.plane:
    title: Avion
    gloss: avion
    note: '*طیاره* est le mot afghan pour dire « avion ».'
    example_gloss: L’avion est arrivé à Kaboul.
  prs.a2.unit25.lesson01.teach.travel:
    title: Voyager
    gloss: voyager
    note: '*سفر کردن* signifie voyager. On indique le moyen de transport avec *با* : *با بس سفر کردن* signifie voyager en bus.'
    example_gloss: Mon ami a voyagé en bus.
  prs.a2.unit25.lesson01.teach.been_herat:
    title: je suis allé(e) à Hérat
    gloss: Je suis allé(e) à Hérat.
    note: '*به* signifie « à, vers ». C’est la première phrase au passé composé de l’unité : *رفته‌ام* dit que tu as été quelque part à un moment de ta vie, sans préciser quand.'
  prs.a2.unit25.lesson01.teach.formal_paradigm:
    title: 'Le passé composé, forme écrite : participe + terminaison'
    gloss: je suis allé(e), tu es allé(e), il/elle est allé(e), nous sommes allés, vous êtes allé(e)(s) (politesse ou pluriel), ils/elles sont allé(e)s
    note: 'Le passé composé dit ce que tu as fait ou non dans ta vie jusqu’à maintenant, sans préciser quand. Il a deux parties. D’abord le participe passé : prends le radical du passé et ajoute *ه*. Le radical du passé de *رفتن* (aller) est *رفت*, donc le participe est *رفته*. Ensuite une courte terminaison selon la personne : *رفته‌ام* (je suis allé), *رفته‌ای* (tu es allé, à un ami), *رفته است* (il ou elle est allé), *رفته‌ایم* (nous), *رفته‌این* (vous, politesse ou pluriel ; *رفته‌اید* est aussi accepté), *رفته‌اند* (ils). À l’écrit, les terminaisons se rattachent au participe par une demi-espace. Le pronom (*من، تو، او*) est facultatif, car la terminaison indique déjà la personne. C’est la forme écrite soutenue, celle des lettres, des actualités et des livres.'
  prs.a2.unit25.lesson01.teach.spoken_paradigm:
    title: Le passé composé, forme parlée de Kaboul
    gloss: je suis allé(e), tu es allé(e), il/elle est allé(e), nous sommes allés, vous êtes allé(e)(s) (politesse ou pluriel), ils/elles sont allé(e)s
    note: 'Dans la langue de tous les jours à Kaboul, le participe et la terminaison se contractent en un seul mot court, construit sur le radical du passé : *رفتیم* (je suis allé), *رفتی* (tu es allé, à un ami), *رفته* (il ou elle), *رفتیم* (nous), *رفتین* (vous, pluriel), *رفتن* (ils). La 3e personne du singulier est simplement le participe *رفته*. Fais attention à la 1re personne : *رفتیم* à l’oral (je suis allé) n’est pas le passé simple *رفتم* (j’allai / je suis allé à un moment précis) ; il se termine par *-یم* et s’écrit comme le pluriel *رفتیم* (nous sommes allés). Le contexte permet de les distinguer : *تا حال، هرگز، هنوز، قبلا* et une question sur l’expérience indiquent le passé composé (*تا حال رفتیم* = je suis allé jusqu’à présent), alors qu’un moment précis comme *پارسال* ou *دیروز* indique le passé simple (*پارسال رفتم*). Les formes écrites attachées (*رفته‌ام*) restent au programme et ce cours accepte les deux dans chaque réponse : utilise les formes attachées à l’écrit ou dans un cadre formel, et les formes parlées contractées avec les amis et la famille. La terminaison du pluriel de « vous » est *-ین* dans les deux cas : *رفته‌این* et *رفتین*.'
  prs.a2.unit25.lesson02.teach.participle_rule:
    title: 'Le participe passé : radical du passé + ه'
    gloss: allé, mangé, vu, cuisiné, fait
    note: 'Une seule règle donne le participe de presque tous les verbes : pars de l’infinitif, retire *ن* pour obtenir le radical du passé, puis ajoute *ه*. *رفتن* donne *رفت*, puis *رفته* (allé). *خوردن* donne *خورد* et *خورده* (mangé). *دیدن* donne *دید* et *دیده* (vu). *پختن* donne *پخت* et *پخته* (cuit, cuisiné). *کردن* donne *کرد* et *کرده* (fait). Le participe ne change jamais selon la personne ; seule la terminaison qui le suit change.'
  prs.a2.unit25.lesson02.teach.eat_paradigm:
    title: 'Mêmes terminaisons, nouveau verbe : manger'
    gloss: j’ai mangé, tu as mangé, il/elle a mangé, nous avons mangé, vous avez mangé (politesse ou pluriel), ils/elles ont mangé
    note: 'Les terminaisons apprises avec *رفته* fonctionnent avec tous les participes : *خورده‌ام، خورده‌ای، خورده است، خورده‌ایم، خورده‌این، خورده‌اند*. À l’oral, le même participe se contracte : *خوردیم، خوردی، خورده، خوردیم، خوردین، خوردن*. Ainsi, pour dire que tu as vu un film, tu peux écrire *فلم دیده‌ام* ou dire *فلم دیدیم*.'
  prs.a2.unit25.lesson02.teach.spoken_more:
    title: Formes parlées des mêmes verbes
    gloss: j’ai mangé, tu as mangé, il/elle a mangé, vous avez mangé (pluriel), ils/elles ont mangé ; j’ai vu, tu as vu ; j’ai cuisiné, tu as cuisiné ; j’ai fait, tu as fait
    note: 'Les formes parlées fonctionnent de la même façon pour tous les verbes : prends le radical du passé et ajoute la terminaison. *خورد* donne *خوردیم، خوردی، خورده، خوردین، خوردن* ; *دید* donne *دیدیم، دیدی* ; *پخت* donne *پختیم، پختی* ; *کرد* donne *کردیم، کردی*. N’oublie pas que *خوردیم* à l’oral (j’ai mangé) n’est pas le passé simple *خوردم* (je mangeai) ; un mot comme *تا حال* ou *هرگز*, ou l’absence de moment précis, indique le passé composé.'
  prs.a2.unit25.lesson02.teach.movie:
    title: Film
    gloss: film
    note: '*فلم* est le mot afghan pour « film ». On voit un film avec le verbe *دیدن* : *فلم دیدن* signifie regarder un film.'
    example_gloss: Hier soir, j’ai regardé un film.
  prs.a2.unit25.lesson02.teach.kebab:
    title: Kébab
    gloss: kébab, viande grillée
    note: '*کباب* est de la viande grillée, l’un des plats les plus courants que tu peux goûter en Afghanistan.'
    example_gloss: Hier, j’ai mangé du kébab.
  prs.a2.unit25.lesson02.teach.mantu_qabili:
    title: J’ai mangé des mantu et du qabili palaw
    gloss: J’ai mangé des mantu et du qabili palaw.
    note: '*و* signifie « et ». Un seul participe à la fin, *خورده‌ام*, couvre les deux plats.'
  prs.a2.unit25.lesson02.teach.seen_herat:
    title: J’ai vu Hérat
    gloss: J’ai vu Hérat.
    note: '*را* suit un complément défini, comme le nom d’une ville, qui reçoit l’action : *هرات را* désigne la ville de Hérat. *دیده‌ام* est le participe de *دیدن* plus *-ام*.'
  prs.a2.unit25.lesson02.teach.cooked:
    title: J’ai cuisiné du qabili palaw
    gloss: J’ai cuisiné du qabili palaw.
    note: '*پخته‌ام* est le participe de *پختن* (cuisiner) plus *-ام*. À l’oral : *قابلی پلو پختیم*.'
  prs.a2.unit25.lesson03.teach.last_year:
    title: L’année dernière
    gloss: l’année dernière
    note: '*پارسال* signifie « l’année dernière ». Un mot comme celui-ci situe l’événement à un moment précis ; le verbe qui suit est donc au passé simple, et non au passé composé.'
    example_gloss: L’année dernière, je suis allé à Kaboul.
  prs.a2.unit25.lesson03.teach.two_years_ago:
    title: Il y a deux ans
    gloss: il y a deux ans
    note: '*پیش* après une durée signifie « il y a » : *دو سال پیش* veut dire il y a deux ans. C’est un autre mot de temps qui exige le passé simple.'
    example_gloss: Il y a deux ans, je suis allé à Mazar-e Charif.
  prs.a2.unit25.lesson03.teach.never:
    title: Jamais
    gloss: jamais
    note: '*هرگز* signifie « jamais ». Il s’emploie avec un verbe négatif : la phrase garde donc le *ن* de la négation : *به بامیان هرگز نرفته‌ام* signifie je ne suis jamais allé à Bamiyan.'
    example_gloss: Je ne suis jamais allé à Bamiyan.
  prs.a2.unit25.lesson03.teach.never_alt:
    title: Jamais (autre mot)
    gloss: jamais, à aucun moment
    note: '*هیچ‌وقت* a ici le même sens que *هرگز* et exige aussi un verbe négatif : *هیچ‌وقت فلم ندیده‌ام* signifie je n’ai jamais vu de film. Il est un peu plus courant à l’oral que *هرگز*.'
    example_gloss: Je ne suis jamais allé à Bamiyan.
  prs.a2.unit25.lesson03.teach.neg_formal:
    title: 'La négation : ن sur le participe'
    gloss: je ne suis pas allé(e), tu n’es pas allé(e), il/elle n’est pas allé(e), nous ne sommes pas allés, vous n’êtes pas allé(e)(s) (politesse ou pluriel), ils/elles ne sont pas allé(e)s
    note: 'Pour dire que tu n’as pas fait quelque chose, place *ن* devant le participe et garde les mêmes terminaisons : *رفته‌ام* (je suis allé) devient *نرفته‌ام* (je ne suis pas allé). La série complète est *نرفته‌ام، نرفته‌ای، نرفته است، نرفته‌ایم، نرفته‌این، نرفته‌اند*. Le *ن* appartient au participe, jamais à la terminaison.'
  prs.a2.unit25.lesson03.teach.neg_spoken:
    title: La négation à la forme parlée
    gloss: je ne suis pas allé(e), tu n’es pas allé(e), il/elle n’est pas allé(e), nous ne sommes pas allés, vous n’êtes pas allé(e)(s) (politesse ou pluriel), ils/elles ne sont pas allé(e)s
    note: 'La négation parlée fonctionne de la même façon : *ن* se place sur la forme contractée : *نرفتیم، نرفتی، نرفته، نرفتیم، نرفتین، نرفتن*. *نرفته‌ام* et *نرفتیم* sont tous deux corrects et signifient je ne suis pas allé. Ne confonds pas *نرفتیم* à l’oral (je ne suis pas allé) avec le passé simple négatif *نرفتم* (je ne suis pas allé, à un moment précis) : un moment précis comme *دیروز* va avec *نرفتم*.'
  prs.a2.unit25.lesson03.teach.neg_more:
    title: Le même ن avec d’autres verbes
    gloss: je n’ai pas mangé, je n’ai pas vu, je n’ai pas cuisiné, je n’ai pas fait
    note: 'La règle est la même pour tous les verbes : *نخورده‌ام* (je n’ai pas mangé), *ندیده‌ام* (je n’ai pas vu), *نپخته‌ام* (je n’ai pas cuisiné), *نکرده‌ام* (je n’ai pas fait). Avec les verbes formés d’un mot suivi de *کردن*, le *ن* se place sur *کرده* : *سفر نکرده‌ام* (je n’ai pas voyagé), jamais *نسفر کرده‌ام*. À l’oral : *نخوردیم، ندیدیم، نپختیم، نکردیم*.'
  prs.a2.unit25.lesson03.teach.contrast:
    title: Passé composé ou passé simple ?
    gloss: L’année dernière, je suis allé à Hérat. / Je suis déjà allé à Hérat. / Je vais à Hérat.
    note: 'Utilise le passé simple quand tu dis quand quelque chose s’est passé : *پارسال به هرات رفتم* (l’année dernière, je suis allé à Hérat) ou *دو سال پیش رفتم*. Utilise le passé composé quand le moment n’est pas donné et que tu dis seulement que cela fait partie de ton expérience : *به هرات رفته‌ام* (je suis déjà allé à Hérat). Le présent est encore différent : *به هرات می‌روم* (je vais à Hérat). Ainsi, un mot de temps comme *پارسال* ou *دیروز* va avec *رفتم*, tandis que *تا حال* et *هرگز* vont avec *رفته‌ام* et *نرفته‌ام*.'
  prs.a2.unit25.lesson04.teach.already:
    title: Déjà, auparavant
    gloss: déjà, auparavant
    note: '*قبلا* signifie « avant maintenant » ou « déjà ». Il s’emploie avec un passé composé affirmatif : *قبلا به هرات رفته‌ام* signifie je suis déjà allé à Hérat.'
    example_gloss: Je suis déjà allé à Hérat.
  prs.a2.unit25.lesson04.teach.not_yet:
    title: Pas encore, toujours
    gloss: pas encore, encore
    note: '*هنوز* avec un passé composé négatif signifie « pas encore » : *هنوز به هرات نرفته‌ام* signifie je ne suis pas encore allé à Hérat.'
    example_gloss: Je ne suis pas encore allé à Hérat.
  prs.a2.unit25.lesson04.teach.times:
    title: Une fois, deux fois
    gloss: une fois, deux fois
    note: '*بار* signifie « fois ». *یک بار* veut dire une fois et *دو بار* deux fois. Le nombre se place avant *بار* et la phrase reste au passé composé.'
    example_gloss:
    - Je suis allé deux fois à Mazar-e Charif.
    - J’ai voyagé une fois en avion.
  prs.a2.unit25.lesson04.teach.how_many:
    title: Combien de fois y es-tu allé(e) ?
    gloss: Combien de fois es-tu allé(e) à Mazar-e Charif ?
    note: '*چند* signifie « combien ». *چند بار* demande combien de fois, et la réponse est un nombre suivi de *بار* : *دو بار*.'
  prs.a2.unit25.lesson04.teach.yes_no:
    title: Oui, non
    gloss: oui, non
    note: '*بلی* signifie « oui » et *نخیر* est le « non » poli de tous les jours. Une réponse courte reprend le participe : *بلی، رفته‌ام* ou *نخیر، نرفته‌ام*.'
    example_gloss:
    - Oui, je suis allé à Hérat.
    - Non, je ne suis pas encore allé à Hérat.
  prs.a2.unit25.lesson04.teach.but:
    title: Mais
    gloss: mais
    note: '*ولی* relie quelque chose que tu as fait à quelque chose que tu n’as pas fait : *به مزار شریف رفته‌ام، ولی به هرات نرفته‌ام*.'
    example_gloss: Je suis allé à Mazar-e Charif, mais je ne suis pas allé à Hérat.
  prs.a2.unit25.lesson04.teach.qa:
    title: Poser des questions et répondre sur l’expérience
    gloss: Es-tu déjà allé à Hérat ? Oui, j’y suis allé. Non, jamais.
    note: 'Pour demander si quelqu’un a déjà fait quelque chose, utilise *آیا* et *تا حال* avec le passé composé : *آیا تا حال به هرات رفته‌ای؟* Avec un ami, tu peux aussi employer la forme parlée : *آیا تا حال به هرات رفتی؟* Réponds par *بلی* et le participe (*بلی، رفته‌ام*) ou par *نخیر* et la forme négative (*نخیر، تا حال نرفته‌ام*). Tu peux ajouter la fréquence : *بلی، دو بار رفته‌ام*. Le mot interrogatif *آیا* peut être omis à l’oral quand l’intonation indique clairement la question.'
  prs.a2.unit25.lesson04.teach.adverbs:
    title: Déjà, pas encore, jamais
    gloss: J’y suis déjà allé. Je n’y suis pas encore allé. Je n’y suis jamais allé.
    note: 'Trois petits mots répondent à la question de savoir si tu as déjà fait quelque chose. *قبلا رفته‌ام* signifie j’y suis déjà allé. *هنوز نرفته‌ام* signifie je n’y suis pas encore allé, ce qui laisse entendre que tu peux encore y aller. *هرگز نرفته‌ام* signifie je n’y suis jamais allé, sans cette idée. *قبلا* s’emploie avec un participe affirmatif ; *هنوز* et *هرگز* s’emploient avec un participe négatif. Tous trois se placent avant le participe, généralement après le lieu : *به هرات هنوز نرفته‌ام*. Les formes parlées fonctionnent de la même façon : *هنوز نرفتیم*.'
  prs.a2.unit25.lesson05.teach.also:
    title: Aussi
    gloss: aussi
    note: '*هم* signifie « aussi ». Il se place juste après l’élément qu’il ajoute : *قابلی پلو هم پخته‌ام* signifie j’ai aussi cuisiné du qabili palaw.'
    example_gloss: J’ai aussi cuisiné du qabili palaw.
  prs.a2.unit25.lesson05.teach.profile:
    title: Zarmina parle de ses expériences
    gloss: Je suis Zarmina. Jusqu’à présent, je suis allée à Hérat et à Mazar-e Charif, mais je ne suis pas allée à Bamiyan. J’ai mangé des mantu et du qabili palaw. J’ai aussi cuisiné du qabili palaw. Je n’ai pas voyagé en avion.
    note: 'Un court profil écrit dans la forme écrite soutenue. Quatre choses qu’elle a faites et deux qu’elle n’a pas faites : *به بامیان نرفته‌ام* et *با طیاره سفر نکرده‌ام*.'
  prs.a2.unit25.lesson05.teach.ex_q:
    title: Homayoun demande à Zarmina si elle a déjà pris l’avion
    gloss: Zarmina, as-tu déjà voyagé en avion ?
    note: Homayoun emploie la forme parlée *سفر کردی* avec une amie. La question commence par *آیا تا حال*.
  prs.a2.unit25.lesson05.teach.ex_a:
    title: Zarmina dit qu’elle ne l’a jamais fait
    gloss: Non, je n’ai jamais voyagé en avion. Et toi ?
    note: '*هرگز* se place avant le participe négatif *نکردیم*. *تو چطور؟* est une façon courte de demander « et toi ? ».'
  prs.a2.unit25.lesson05.teach.ex_a2:
    title: 'Homayoun répond : une fois'
    gloss: Oui, j’ai voyagé une fois.
    note: '*بلی* répond « oui » et *یک بار* dit combien de fois. Le lieu est omis, car il est clair d’après la question.'
  prs.a2.unit25.lesson06.teach.turn01:
    title: Zarmina interroge Homayoun sur Mazar-e Charif
    gloss: Homayoun, es-tu déjà allé à Mazar-e Charif ?
    note: Zarmina emploie la forme parlée *رفتی* avec un ami. La question commence par *آیا تا حال*.
  prs.a2.unit25.lesson06.teach.turn02:
    title: Homayoun répond deux fois, puis pas encore
    gloss: Oui, j’y suis allé deux fois. Mais je ne suis pas encore allé à Hérat. Et toi ?
    note: '*دو بار* dit combien de fois. *ولی هنوز به هرات نرفتیم* oppose un lieu où il n’est pas encore allé à celui où il est allé.'
  prs.a2.unit25.lesson06.teach.turn03:
    title: Zarmina parle de Hérat et de Bamiyan
    gloss: Je suis allée une fois à Hérat, mais je ne suis jamais allée à Bamiyan.
    note: '*یک بار* signifie « une fois » et *به بامیان هرگز نرفتیم* signifie « jamais ». *هرگز* s’emploie avec le participe négatif.'
  prs.a2.unit25.lesson06.teach.turn04:
    title: Homayoun pose une question sur la cuisine
    gloss: As-tu déjà préparé du qabili palaw ?
    note: Une question fermée sur l’expérience, avec *تا حال* et la forme parlée *پختی*.
  prs.a2.unit25.lesson06.teach.turn05:
    title: Zarmina l’a déjà préparé
    gloss: Oui, j’en ai déjà préparé. Et toi ?
    note: '*قبلا پختیم* signifie « j’en ai déjà préparé ». Le plat n’est pas répété, car les deux interlocuteurs le connaissent.'
  prs.a2.unit25.lesson06.teach.turn06:
    title: Homayoun n’en a pas encore préparé
    gloss: Non, je n’en ai pas encore préparé. Mais j’en ai mangé.
    note: '*هنوز نپختیم* signifie « pas encore », avec *ن* sur le participe. *ولی خوردیم* ajoute ce qu’il a fait.'
  prs.a2.unit25.lesson06.teach.turn07:
    title: Zarmina réagit
    gloss: Super !
    note: '*چه خوب!* est une réaction amicale à une bonne nouvelle.'
