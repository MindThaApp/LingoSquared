course:
  title: Dari A1
  description: 'Dari de Kaboul pour débutants : vocabulaire de l’apparence physique (grand, petit, cheveux, yeux, barbe, lunettes), demander à quoi ressemble quelqu’un avec قیافه‌اش چطور است؟, couleur des cheveux et des yeux (رنگ مو/رنگ چشم), et un dialogue entre Zarmina et Homayoun pour reconnaître quelqu’un à son apparence.'
units:
  prs.a1.unit27.appearance:
    title: Apparence
    description: Décris l’apparence physique de base d’une personne et demande à quoi ressemble quelqu’un.
lessons:
  prs.a1.unit27.lesson01.appearance_vocabulary:
    title: Mots de l’apparence
  prs.a1.unit27.lesson02.appearance_question:
    title: Demander l’apparence
  prs.a1.unit27.lesson03.hair_eye_color:
    title: Couleur des cheveux et des yeux
  prs.a1.unit27.lesson04.appearance_dialogue:
    title: Dialogue sur l’apparence
  prs.a1.unit27.lesson05.reading_appearance:
    title: Lecture sur l’apparence
  prs.a1.unit27.lesson06.wrap_up:
    title: Récapitulatif
teaching:
  prs.a1.unit27.lesson01.teach.tall_phrase:
    title: Grand
    gloss: grand
    note: 'قد بلند signifie littéralement « taille longue » : قد (taille) + بلند (long/grand).'
    example_gloss: Il/elle est grand(e).
  prs.a1.unit27.lesson01.teach.short_phrase:
    title: Petit
    gloss: petit
    note: 'قد کوتاه signifie littéralement « taille courte » : قد (taille, révision) + کوتاه (court).'
    example_gloss: Il/elle est petit(e).
  prs.a1.unit27.lesson01.teach.hair_word:
    title: Les cheveux
    gloss: cheveux
    note: مو signifie cheveux ; موی est le même mot à l’état construit, utilisé devant un autre mot (par ex. موی سیاه, « cheveux noirs »).
    example_gloss: Il/elle a les cheveux noirs.
  prs.a1.unit27.lesson01.teach.eye_word:
    title: Œil
    gloss: œil
    note: چشم signifie œil (on l’emploie au singulier pour décrire la couleur des yeux, ce qui est la tournure naturelle et courante).
    example_gloss: Il/elle a les yeux noirs.
  prs.a1.unit27.lesson01.teach.beard_word:
    title: Barbe
    gloss: barbe
    note: ریش signifie barbe.
    example_gloss: Il/elle a une barbe.
  prs.a1.unit27.lesson01.teach.glasses_word:
    title: Lunettes
    gloss: lunettes
    note: عینک signifie lunettes.
    example_gloss: Il/elle porte des lunettes.
  prs.a1.unit27.lesson01.teach.review_ast_dast:
    title: Est / a (3e personne)
    gloss: est / a (3e personne)
    note: است (est) et دارد (a, 3e personne) ont déjà été vus plus tôt dans le cours ; ils servent tout au long de cette unité à décrire l’apparence de quelqu’un.
    target_text: است (est) / دارد (a, 3e personne)
  prs.a1.unit27.lesson02.teach.qiyafa_word:
    title: Apparence / physique
    gloss: apparence / physique
    note: قیافه désigne l’apparence physique d’une personne (par ex. خوش قیافه, « beau »).
    example_gloss: Il/Elle a un beau physique.
  prs.a1.unit27.lesson02.teach.review_chetor:
    title: Comment
    gloss: comment
    note: چطور signifie « comment » (déjà vu plus tôt dans le cours, dans des salutations comme چطور استین؟).
    target_text: چطور (comment)
  prs.a1.unit27.lesson02.teach.qiyafash_word:
    title: Son apparence
    gloss: son apparence
    note: قیافه‌اش associe قیافه (apparence) au suffixe possessif ‌اش (« son / sa »).
  prs.a1.unit27.lesson02.teach.question_appearance:
    title: À quoi ressemble-t-il/elle ?
    gloss: À quoi ressemble-t-il/elle ?
    note: قیافه‌اش چطور است؟ est la façon naturelle de demander à quoi ressemble quelqu’un. On n’emploie volontairement pas چطور است؟ seul, qui signifierait plutôt « Comment va-t-il/elle ? » (salutation sur la santé).
  prs.a1.unit27.lesson02.teach.answer_tall:
    title: Il/Elle est grand(e)
    gloss: Il/Elle est grand(e).
    note: Associe او (il/elle, révision) à قد بلند است, vu dans cette unité.
  prs.a1.unit27.lesson02.teach.answer_black_hair:
    title: Il/Elle a les cheveux noirs
    gloss: Il/Elle a les cheveux noirs.
    note: Associe موی (cheveux), سیاه (noir) et دارد (a).
  prs.a1.unit27.lesson02.teach.answer_beard:
    title: Il/Elle a une barbe
    gloss: Il/Elle a une barbe.
    note: Emploie ریش دارد, avec la même construction avec « avoir » que pour les cheveux noirs ci-dessus.
  prs.a1.unit27.lesson03.teach.review_rang:
    title: Couleur
    gloss: couleur
    note: رنگ signifie « couleur » (déjà vu plus tôt dans le cours, dans l’unité 21 sur les vêtements).
    target_text: رنگ (couleur)
  prs.a1.unit27.lesson03.teach.blue_word:
    title: Bleu
    gloss: bleu
    note: آبی signifie « bleu ».
    example_gloss: Il/Elle a les yeux bleus.
  prs.a1.unit27.lesson03.teach.brown_word:
    title: Marron
    gloss: marron
    note: قهوه‌ای signifie « marron » (pour la couleur des cheveux ou des yeux).
    example_gloss: Il/Elle a les cheveux marron.
  prs.a1.unit27.lesson03.teach.eye_color_phrase:
    title: Couleur des yeux
    gloss: couleur des yeux
    note: 'رنگ چشم signifie littéralement « couleur d’œil » : رنگ (couleur) + چشم (œil).'
  prs.a1.unit27.lesson03.teach.hair_color_phrase:
    title: Couleur des cheveux
    gloss: couleur des cheveux
    note: 'رنگ مو signifie littéralement « couleur de cheveu » : رنگ (couleur) + مو (cheveux).'
  prs.a1.unit27.lesson03.teach.eye_blue_sentence:
    title: Il/Elle a les yeux bleus
    gloss: Il/Elle a les yeux bleus.
    note: Applique آبی, vu dans cette leçon, à چشم.
  prs.a1.unit27.lesson03.teach.hair_brown_sentence:
    title: Il/Elle a les cheveux marron
    gloss: Il/Elle a les cheveux marron.
    note: Applique قهوه‌ای, vu dans cette leçon, à موی.
  prs.a1.unit27.lesson04.teach.review_baradar:
    title: Frère / ton frère
    gloss: frère / ton frère (informel)
    note: برادر (frère) est une révision de l’unité 3 ; برادرت ajoute le suffixe possessif informel ‌ت (« ton / ta »), en accord avec le registre informel de تو déjà vu.
    target_text: برادر (frère) / برادرت (ton frère, informel)
  prs.a1.unit27.lesson04.teach.review_bali_tashakor:
    title: Oui / merci / aussi
    gloss: oui / merci / aussi
    note: بلی (oui), تشکر (merci) et هم (aussi) sont tous des révisions de ce qui a été vu plus tôt dans le cours.
    target_text: بلی (oui) / تشکر (merci) / هم (aussi)
  prs.a1.unit27.lesson04.teach.dialogue_line1:
    title: 'Homayoun : Zarmina, comment est ton frère physiquement ?'
    gloss: 'Homayoun : Zarmina, comment est ton frère physiquement ?'
    note: Une question informelle entre amis, avec le suffixe possessif -ت sur برادر.
  prs.a1.unit27.lesson04.teach.dialogue_line2:
    title: 'Zarmina : Il est grand et il a les cheveux noirs'
    gloss: 'Zarmina : Il est grand et il a les cheveux noirs.'
    note: Associe deux traits avec و (et).
  prs.a1.unit27.lesson04.teach.dialogue_line3:
    title: 'Homayoun : Il a une barbe ?'
    gloss: 'Homayoun : Il a une barbe ?'
    note: Une question fermée formée simplement par l’intonation montante sur ریش دارد.
  prs.a1.unit27.lesson04.teach.dialogue_line4:
    title: 'Zarmina : Oui, il a une barbe, et il a aussi des lunettes'
    gloss: 'Zarmina : Oui, il a une barbe, et il a aussi des lunettes.'
    note: Emploie هم (aussi) pour un second trait.
  prs.a1.unit27.lesson04.teach.dialogue_line5:
    title: 'Homayoun : Bien, merci'
    gloss: 'Homayoun : Bien, merci.'
    note: خوب (bien) est un nouveau mot simple pour conclure ; تشکر (merci) est une révision.
  prs.a1.unit27.lesson05.teach.reading_passage:
    title: Lecture sur l’apparence
    gloss: Karim est grand. Il a les cheveux noirs et les yeux marron. Il n’a pas de barbe, mais il a des lunettes.
    note: Un court texte qui reprend les mots d’apparence de l’unité. Il présente le personnage کریم (Karim, déjà rencontré dans l’unité des comparaisons) et ندارد (n’a pas, forme négative de دارد à la 3e personne).
  prs.a1.unit27.lesson06.teach.review_ama:
    title: Mais
    gloss: mais
    note: اما signifie « mais » (vu plus tôt dans cette unité, dans le texte de lecture de la leçon 5 ; c’est aussi une révision des unités précédentes).
    target_text: اما (mais)
  prs.a1.unit27.lesson06.teach.review_astam:
    title: Je suis / j’ai
    gloss: je suis / j’ai
    note: استم (je suis) et دارم (j’ai) sont des révisions de ce qui a été vu plus tôt dans le cours ; ils servent ici à se décrire à la première personne.
    target_text: استم (je suis) / دارم (j’ai)
  prs.a1.unit27.lesson06.teach.wrap_summary:
    title: Je suis petit(e), mais j’ai les cheveux noirs
    gloss: Je suis petit(e), mais j’ai les cheveux noirs.
    note: Associe deux faits d’apparence avec اما.
