        آن‌ها می‌گویند که جلسه ساعت ده است: Ils disent que la réunion est à dix heures
        او می‌گوید که فردا می‌آید: Il ou elle dit qu’il ou elle vient demain
        حشمت می‌گوید که مینا فردا می‌آید: Hashmat dit que Mina vient demain
      status: correct
    feedback: 'Seule la terminaison du verbe change selon la personne : *-م* je, *-د* il ou elle, *-ند* ils. Après *که* vient ce qui est dit.'
    pairs:
    - left: می‌گویم
      right: je dis
    - left: می‌گوید
      right: il ou elle dit
    - left: می‌گویند
      right: ils disent
    - left: پیام
      right: message
    - left: مدیر می‌گوید که جلسه ساعت نه است
      right: Le directeur dit que la réunion est à neuf heures
    - left: آن‌ها می‌گویند که جلسه ساعت ده است
      right: Ils disent que la réunion est à dix heures
    - left: او می‌گوید که فردا می‌آید
      right: Il ou elle dit qu’il ou elle vient demain
    - left: حشمت می‌گوید که مینا فردا می‌آید
      right: Hashmat dit que Mina vient demain
  prs.a2.unit39.lesson01.exercise05.order_manager_says:
    instruction: 'Mets les mots dans l’ordre pour dire : Le directeur dit que la réunion est à neuf heures.'
    accepted_answers:
    - value:
      - مدیر
      - می‌گوید
      - که
      - جلسه
      - ساعت
      - نه
      - است
      status: correct
    feedback: '*مدیر می‌گوید که جلسه ساعت نه است.* Celui qui parle et le verbe viennent d’abord, puis *که*, puis l’affirmation.'
  prs.a2.unit39.lesson01.exercise06.translate_manager_says:
    instruction: 'Traduis en dari, avec می‌گوید که : Le directeur dit que la réunion est à neuf heures.'
    accepted_answers:
    - value: مدیر می‌گوید که جلسه ساعت نه است.
      status: correct
    - value: مدیر می‌گوید جلسه ساعت نه است.
      status: correct
    feedback: '*مدیر می‌گوید که جلسه ساعت نه است.* signifie « le directeur dit que la réunion est à neuf heures ». Le mot *که* peut être omis dans la langue de tous les jours.'
  prs.a2.unit39.lesson02.exercise01.recognize_where_manager:
    instruction: Que signifie cette phrase ?
    correct_option: Il demande où est le directeur
    distractors:
    - Il dit que le directeur est à la maison
    - Il demande qui est le directeur
    - Il veut que le directeur vienne
    accepted_answers:
    - value: Il demande où est le directeur
      status: correct
    feedback: '*می‌پرسد* signifie « demande » et *کجا* « où » : il demande où est le directeur.'
  prs.a2.unit39.lesson02.exercise02.recognize_coming_tomorrow:
    instruction: Que signifie cette phrase ?
    correct_option: Hashmat demande si tu viens demain
    distractors:
    - Hashmat dit que tu viens demain
    - Hashmat demande s’il peut venir demain
    - Hashmat demande pourquoi tu es venu hier
    accepted_answers:
    - value: Hashmat demande si tu viens demain
      status: correct
