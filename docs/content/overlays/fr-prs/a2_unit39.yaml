course:
  title: Dari en français A2
  description: 'Dari afghan, niveau élémentaire supérieur : transmettre un message simple au présent avec می‌گوید که, می‌پرسد که et می‌خواهد که + subjonctif, à partir de messages téléphoniques et de notes.'
units:
  prs.a2.unit39.passing_message:
    title: Transmettre un message
lessons:
  prs.a2.unit39.lesson01.he_says_that:
    title: Il dit que ...
  prs.a2.unit39.lesson02.he_asks_that:
    title: Il demande que ...
  prs.a2.unit39.lesson03.he_wants_that:
    title: Il veut que ...
  prs.a2.unit39.lesson04.messages_and_notes:
    title: Messages et notes
  prs.a2.unit39.lesson05.reading_and_listening:
    title: Lire et écouter des messages
  prs.a2.unit39.lesson06.office_conversation:
    title: Une conversation au bureau
teaching:
  prs.a2.unit39.lesson01.teach.message:
    title: Message
    gloss: message
    note: '*پیام* est un message, par exemple un message téléphonique ou un SMS. Dans cette unité, tu transmets un message : tu dis à une deuxième personne ce qu’une première personne a dit, demandé ou voulu.'
    example_gloss: J’ai un message pour vous.
  prs.a2.unit39.lesson01.teach.says:
    title: Il ou elle dit
    gloss: il dit, elle dit
    note: '*می‌گوید* signifie « il ou elle dit », au présent de *گفتن*. Tu connais déjà *می‌گویم* (je dis). La terminaison *-د* est celle de la troisième personne du singulier (il, elle), comme dans *می‌آید*.'
    example_gloss: Il ou elle dit qu’il ou elle vient demain.
  prs.a2.unit39.lesson01.teach.pattern:
    title: 'Transmettre ce que dit quelqu’un : می‌گوید که + affirmation'
    gloss: Le directeur dit que la réunion est à dix heures. Il dit qu’il vient demain.
    note: 'Pour transmettre ce que quelqu’un dit en ce moment, utilise *می‌گوید که* suivi de l’affirmation. *که* signifie « que ». L’affirmation garde son présent : *جلسه ساعت ده است*. Dans cette unité, tu ne transmets que des messages au présent. Les messages au passé viendront plus tard dans le cours.'
  prs.a2.unit39.lesson01.teach.person:
    title: « Je » devient « il » ou « elle » quand tu transmets
    gloss: 'Mina : Je viens demain. Mina dit qu’elle vient demain.'
    note: 'Quand Mina dit *من فردا می‌آیم* (je viens demain) et que tu transmets ses paroles, la personne change : pour toi, Mina est maintenant *او* (elle), donc la terminaison du verbe passe de *-م* à *-د* : *مینا می‌گوید که فردا می‌آید*. Le mot *او* est facultatif, car la terminaison indique déjà de qui il s’agit.'
  prs.a2.unit39.lesson01.teach.they_say:
    title: Ils disent
    gloss: ils disent
    note: '*می‌گویند* signifie « ils disent ». Ajoute *-ند* au radical : *می‌گویند* est la forme de *آن‌ها* pour *می‌گوید*.'
    example_gloss: Ils disent que la réunion est à dix heures.
  prs.a2.unit39.lesson01.teach.hashmat:
    title: Hashmat dit que Mina vient demain
    gloss: Hashmat dit que Mina vient demain.
    note: Ici, la personne qui parle (*حشمت*) et la personne qui vient (*مینا*) sont différentes, et la phrase nomme les deux. Quand tu lis un message, vérifie toujours qui parle et qui vient.
  prs.a2.unit39.lesson02.teach.asks:
    title: Il ou elle demande
    gloss: il demande, elle demande
    note: '*می‌پرسد* signifie « il ou elle demande », au présent de *پرسیدن*. Il a la même terminaison *-د* que *می‌گوید*.'
    example_gloss: Il ou elle demande où est le directeur.
  prs.a2.unit39.lesson02.teach.wh:
    title: 'Transmettre une question : می‌پرسد که + question'
    gloss: Hashmat demande où tu es. Mina demande quelle heure il est.
    note: Pour transmettre une question, utilise *می‌پرسد که* suivi de la question avec son mot interrogatif (*کجا*, *ساعت چند*, *چه*, *کی*, *چرا*). L’ordre des mots de la question ne change pas. *استی* signifie « tu es » (à un ami), la forme de *تو* pour *است*. Quand tu t’adresses à la personne à qui la question a été posée, *تو* reste *تو*.
  prs.a2.unit39.lesson02.teach.yesno:
    title: Transmettre une question à laquelle on répond par oui ou non
    gloss: Il ou elle demande si tu viens demain.
    note: 'Dans cette unité, on garde la question telle qu’elle est prononcée, sans marqueur supplémentaire (tu peux aussi ajouter *آیا* ou *یا نه* comme dans l’unité 38). Une question fermée se transmet avec *می‌پرسد که* : *او می‌پرسد که تو فردا می‌آیی*. La réponse est *بلی* ou *نخیر*. *می‌آیی* signifie « tu viens » (à un ami), la forme de *تو* pour *می‌آید*.'
  prs.a2.unit39.lesson02.teach.id:
    title: Le directeur demande si tu as une carte d’identité
    gloss: Le directeur demande si tu as une carte d’identité.
    note: Autre question fermée. *تذکره* est la carte d’identité afghane, et *داری* signifie « tu as ».
  prs.a2.unit39.lesson02.teach.person:
    title: La personne interrogée change le pronom
    gloss: Mina demande où tu es. Mina demande où est Hashmat.
    note: 'Mina demande à Hashmat : *تو کجا استی؟* (Où es-tu ?). Si tu t’adresses à Hashmat, tu dis *مینا می‌پرسد که تو کجا استی* et *تو* reste. Si tu t’adresses à quelqu’un d’autre, Hashmat passe à la troisième personne : *مینا می‌پرسد که حشمت کجا است*.'
  prs.a2.unit39.lesson03.teach.pattern:
    title: 'Transmettre un souhait : می‌خواهد که + subjonctif'
    gloss: Il ou elle veut que tu viennes. Il ou elle veut que j’y aille.
    note: 'Pour transmettre ce que quelqu’un veut qu’une autre personne fasse, utilise *می‌خواهد که* suivi du subjonctif : *او می‌خواهد که تو بیایی* (il ou elle veut que tu viennes). Le subjonctif est la même forme que celle qu’on emploie après *باید* et dans *بروم* (que j’aille). Ce n’est pas le présent en *می‌* : il n’y a pas de *می‌* dans *بیایی*.'
  prs.a2.unit39.lesson03.teach.go:
    title: Le subjonctif de رفتن
    gloss: que j’aille, que tu ailles, qu’il ou elle aille, que nous allions, que vous alliez (forme de politesse ou pluriel), qu’ils aillent
    note: 'Le subjonctif se forme avec *ب* + le radical du présent + la terminaison : *ب + رو + م* donne *بروم*. Les terminaisons sont *-م، -ی، -د، -یم، -ین، -ند*. Donc : *بروم، بروی، برود، برویم، بروین، بروند*. Tu connais déjà *بروم* ; cette carte ajoute les autres formes.'
  prs.a2.unit39.lesson03.teach.come:
    title: Le subjonctif de آمدن
    gloss: que je vienne, que tu viennes, qu’il ou elle vienne, que nous venions, que vous veniez (forme de politesse ou pluriel), qu’ils viennent
    note: '*آمدن* est irrégulier : le radical du subjonctif est *بیای-*. Les terminaisons sont les mêmes : *بیایم، بیایی، بیاید، بیاییم، بیایین، بیایند*. Tu connais déjà *بیایم* et *بیایین*.'
  prs.a2.unit39.lesson03.teach.do:
    title: Le subjonctif de کردن et آوردن
    gloss: que je fasse, que tu fasses, qu’il ou elle fasse, que nous fassions, que vous fassiez, qu’ils fassent. que j’apporte, que tu apportes, qu’il ou elle apporte.
    note: '*کردن* n’a pas de *ب* : *کنم، کنی، کند، کنیم، کنین، کنند*. Ainsi *تیلفون کردن* donne *تیلفون کنی* (que tu téléphones). *آوردن* fonctionne comme *آمدن* avec *بیاور-* : *بیاورم، بیاوری، بیاورد*.'
  prs.a2.unit39.lesson03.teach.tell:
    title: Le subjonctif de گفتن
    gloss: que je dise, que tu dises, qu’il ou elle dise
    note: 'Au subjonctif, *گفتن* a le radical *گوی-* : *بگویم، بگویی، بگوید*. Le schéma est *ب* + radical + terminaison, comme pour *بروم*.'
  prs.a2.unit39.lesson03.teach.phone:
    title: Le directeur veut que tu téléphones
    gloss: Le directeur veut que tu téléphones.
    note: La personne qui veut est *مدیر*, la personne qui doit agir est *تو*, et le verbe après *که* est *کنی*.
  prs.a2.unit39.lesson03.teach.computer:
    title: Il ou elle veut que tu apportes l’ordinateur
    gloss: Il ou elle veut que tu apportes l’ordinateur.
    note: '*را* suit la chose apportée, comme dans toute phrase avec un complément d’objet.'
  prs.a2.unit39.lesson03.teach.same:
    title: Le même subjonctif quand celui qui veut est aussi celui qui part
    gloss: Je veux partir. Il ou elle veut partir.
    note: 'Si la personne qui veut et la personne qui agit sont les mêmes, on emploie aussi le subjonctif : *من می‌خواهم که بروم*. Utilise la terminaison qui convient : *-م* pour « je », *-د* pour « il ou elle ». Cette unité transmet surtout un souhait concernant quelqu’un d’autre, comme dans *او می‌خواهد که تو بیایی*.'
  prs.a2.unit39.lesson04.teach.note:
    title: Note
    gloss: note, mémo
    note: '*یادداشت* est une courte note écrite, par exemple laissée sur une table ou sur une porte. C’est aussi un moyen de transmettre un message quand la personne n’est pas là.'
    example_gloss: La note est au bureau.
  prs.a2.unit39.lesson04.teach.writes:
    title: Il ou elle écrit
    gloss: il écrit, elle écrit
    note: '*می‌نویسد* signifie « il ou elle écrit », au présent de *نوشتن*. *می‌نویسم* signifie « j’écris ».'
    example_gloss: Hashmat écrit une note.
  prs.a2.unit39.lesson04.teach.sends:
    title: Il ou elle envoie
    gloss: il envoie, elle envoie
    note: '*می‌فرستد* signifie « il ou elle envoie ». Tu connais *می‌فرستم* (j’envoie).'
    example_gloss: Le directeur envoie un message.
  prs.a2.unit39.lesson04.teach.written:
    title: 'Un message écrit : می‌نویسد که'
    gloss: Dans la note, il ou elle écrit que la réunion est à neuf heures.
    note: 'Un message écrit se transmet comme un message oral : *می‌نویسد که* suivi de l’affirmation. *در یادداشت* signifie « dans la note ». L’ordre est le même que pour *می‌گوید که*.'
  prs.a2.unit39.lesson04.teach.tell_him:
    title: 'Dire à qui l’on parle : به'
    gloss: Je lui dis que la réunion est à neuf heures. Le directeur dit à Mina que la réunion est demain.
    note: 'Place *به* et la personne à qui l’on parle avant le verbe pour dire qui est informé : *به او می‌گویم* (je lui dis), *به مینا می‌گوید* (il dit à Mina). Le reste du schéma ne change pas : *که* puis le message.'
  prs.a2.unit39.lesson04.teach.phone_says:
    title: Il ou elle téléphone et dit qu’il ou elle vient demain
    gloss: Il ou elle téléphone et dit qu’il ou elle vient demain.
    note: 'Un message téléphonique contient souvent deux verbes à la suite : *تیلفون می‌کند* (téléphone) et *می‌گوید که ...* (dit que ...), reliés par *و*.'
  prs.a2.unit39.lesson04.teach.i_write:
    title: J’écris une note
    gloss: J’écris une note.
    note: Tu écris une note quand tu ne peux pas transmettre le message en personne.
  prs.a2.unit39.lesson05.teach.not_come:
    title: Il ou elle ne vient pas
    gloss: il ne vient pas, elle ne vient pas
    note: '*نمی‌آید* signifie « il ou elle ne vient pas » : *ن* devant *می‌آید*. Tu connais *نمی‌روم* (je ne vais pas).'
    example_gloss: Il ou elle ne vient pas demain.
  prs.a2.unit39.lesson05.teach.call_turn01:
    title: Réplique 1
    gloss: Hashmat, qui a téléphoné ?
    note: Mina rentre à la maison et demande qui a téléphoné.
  prs.a2.unit39.lesson05.teach.call_turn02:
    title: Réplique 2
    gloss: Le directeur a téléphoné. Il dit que la réunion est demain à neuf heures.
    note: Hashmat répond et transmet la première partie du message avec *می‌گوید که*.
  prs.a2.unit39.lesson05.teach.call_turn03:
    title: Réplique 3
    gloss: À neuf heures ? Qu’est-ce qu’il dit d’autre ?
    note: Mina en demande plus. *چه می‌گوید* signifie « qu’est-ce qu’il dit ».
  prs.a2.unit39.lesson05.teach.call_turn04:
    title: Réplique 4
    gloss: Il demande si tu viens demain. Et il veut que tu apportes l’ordinateur.
    note: 'Deux autres parties du message : une question avec *می‌پرسد که* et un souhait avec *می‌خواهد که* et le subjonctif *بیاوری*.'
  prs.a2.unit39.lesson05.teach.call_turn05:
    title: Réplique 5
    gloss: Oui, je viens demain et j’apporte l’ordinateur.
    note: Mina répond à la question et au souhait à la première personne.
  prs.a2.unit39.lesson05.teach.call_turn06:
    title: Réplique 6
    gloss: Bien. Alors je vais lui téléphoner.
    note: Hashmat va transmettre la réponse de Mina par téléphone. *به او تیلفون می‌کنم* signifie « je lui téléphone ».
  prs.a2.unit39.lesson05.teach.note_read:
    title: Un mot de Hashmat
    gloss: Bonjour Mina. Aujourd’hui à quatre heures, ton ami a téléphoné. Il dit qu’il ne vient pas demain, parce qu’il a du travail. Il demande si tu as du temps vendredi. Il veut que tu lui téléphones. Son numéro est dans ce mot. Hashmat
    note: 'Un message écrit qui rapporte un appel téléphonique avec les trois verbes de cette unité : *می‌گوید که*, *می‌پرسد که* et *می‌خواهد که*. L’appel de l’ami n’est pas le même que celui du directeur dans la conversation.'
  prs.a2.unit39.lesson06.teach.office_turn01:
    title: Réplique 1
    gloss: Rahila, j’ai un message pour toi.
    note: 'Behzad commence : il a un message à transmettre.'
  prs.a2.unit39.lesson06.teach.office_turn02:
    title: Réplique 2
    gloss: De qui est-il ?
    note: Rahila demande de qui vient le message.
  prs.a2.unit39.lesson06.teach.office_turn03:
    title: Réplique 3
    gloss: Du cabinet du médecin. Un employé a téléphoné. Il dit que ton rendez-vous est jeudi à deux heures.
    note: Behzad transmet la première partie avec *می‌گوید که*.
  prs.a2.unit39.lesson06.teach.office_turn04:
    title: Réplique 4
    gloss: Jeudi à deux heures ? Qu’est-ce qu’il dit d’autre ?
    note: Rahila demande la suite.
  prs.a2.unit39.lesson06.teach.office_turn05:
    title: Réplique 5
    gloss: Il demande si tu as une carte d’identité. Et il veut que tu viennes à une heure.
    note: Une question avec *می‌پرسد که* et un souhait avec *می‌خواهد که* suivi du subjonctif *بیایی*.
  prs.a2.unit39.lesson06.teach.office_turn06:
    title: Réplique 6
    gloss: Oui, je l’ai. Je vais écrire un mot. Merci beaucoup.
    note: Rahila répond à la question, dit qu’elle écrit un mot pour ne pas oublier, et remercie Behzad.
  prs.a2.unit39.lesson06.teach.summary:
    title: Trois verbes, trois sortes de message
    gloss: Il dit que le rendez-vous est jeudi. Il demande si tu as une carte d’identité. Il veut que tu viennes à une heure.
    note: Un message contient en général une affirmation, une question ou un souhait. *می‌گوید که* est suivi d’une affirmation, *می‌پرسد که* d’une question et *می‌خواهد که* du subjonctif. La terminaison du verbe indique qui parle, et le message garde le présent.
exercises:
  prs.a2.unit39.lesson01.exercise01.recognize_manager_says:
    instruction: Que signifie cette phrase ?
    correct_option: Le directeur dit que la réunion est à neuf heures
    distractors:
    - Le directeur demande si la réunion est à neuf heures
    - Le directeur a dit que la réunion était à neuf heures
    - La réunion est dans le bureau du directeur
    accepted_answers:
    - value: Le directeur dit que la réunion est à neuf heures
      status: correct
    feedback: '*مدیر می‌گوید که جلسه ساعت نه است* signifie « le directeur dit que la réunion est à neuf heures ».'
  prs.a2.unit39.lesson01.exercise02.recognize_they_say:
    instruction: Que signifie cette phrase ?
    correct_option: Ils disent que la réunion est à dix heures
    distractors:
    - Ils demandent à quelle heure est la réunion
    - Ils disent que la réunion est à neuf heures
    - Ils disent que la réunion était à dix heures
    accepted_answers:
    - value: Ils disent que la réunion est à dix heures
      status: correct
    feedback: '*می‌گویند* signifie « ils disent », et *ساعت ده* « dix heures ».'
  prs.a2.unit39.lesson01.exercise03.recognize_who_says:
    instruction: Que signifie cette phrase ?
    correct_option: Hashmat dit que Mina vient demain
    distractors:
    - Mina dit que Hashmat vient demain
    - Hashmat demande si Mina vient demain
    - Hashmat dit que Mina est venue hier
    accepted_answers:
    - value: Hashmat dit que Mina vient demain
      status: correct
    feedback: 'Celui qui parle vient en premier : *حشمت می‌گوید*. Ce qu’il dit, c’est *مینا فردا می‌آید*.'
  prs.a2.unit39.lesson01.exercise04.match_says:
    instruction: Associe chaque mot ou phrase en dari à son sens.
    accepted_answers:
    - value:
        می‌گویم: je dis
        می‌گوید: il ou elle dit
        می‌گویند: ils disent
        پیام: message
