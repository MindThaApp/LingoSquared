course:
  title: Dari A1
  description: 'Dari de Kaboul pour débutants : vocabulaire de l’éducation et des études (université, école, filière, étudiant, leçon), dire sa filière (médecine, droit, économie, littérature), demander et dire où l’on étudie, et dialogue entre Karim et Parwin sur leurs études et ce qu’ils en pensent.'
units:
  prs.a1.unit31.education:
    title: L’éducation
    description: Parle de ce que tu étudies, de l’endroit où tu étudies et de ce que tu en penses.
lessons:
  prs.a1.unit31.lesson01.study_vocabulary:
    title: Les mots des études
  prs.a1.unit31.lesson02.fields_of_study:
