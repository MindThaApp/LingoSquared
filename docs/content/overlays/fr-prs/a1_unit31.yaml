  prs.a1.unit31.lesson03.where_question:
    title: Où étudies-tu ?
  prs.a1.unit31.lesson04.education_dialogue:
    title: Dialogue sur l’éducation
  prs.a1.unit31.lesson05.reading_education:
    title: Lecture sur l’éducation
  prs.a1.unit31.lesson06.wrap_up:
    title: Récapitulatif
teaching:
  prs.a1.unit31.lesson01.teach.education_word:
    title: L’éducation
    gloss: éducation / études
    note: تحصیل signifie l’éducation ou les études en général ; c’est le mot-thème de cette unité.
    example_gloss: L’éducation, c’est bien.
  prs.a1.unit31.lesson01.teach.university_word:
    title: L’université
    gloss: université
    note: پوهنتون signifie université ; c’est le mot courant en Afghanistan (comme dans le nom de l’université de Kaboul), différent du mot iranien دانشگاه.
    example_gloss: L’université est à Kaboul.
  prs.a1.unit31.lesson01.teach.school_word:
    title: École
    gloss: école
    note: مکتب signifie école.
    example_gloss: Cette école est bien.
  prs.a1.unit31.lesson01.teach.field_word:
    title: La filière
    gloss: filière / spécialité
    note: رشته signifie filière ou spécialité universitaire ; c’est un mot courant commun au persan et au dari.
    example_gloss: Ma filière est la médecine.
  prs.a1.unit31.lesson01.teach.student_word:
    title: L’étudiant
    gloss: étudiant
    note: محصل signifie étudiant d’université ; c’est le terme courant du dari afghan, différent du mot iranien دانشجو.
    example_gloss: Il/Elle est étudiant(e).
  prs.a1.unit31.lesson01.teach.lesson_word:
    title: La leçon
    gloss: leçon
    note: درس signifie leçon ; avec خواندن (lire), il forme l’expression verbale qui signifie « étudier ».
    example_gloss: J’étudie chaque jour.
  prs.a1.unit31.lesson01.teach.review_khandan:
    title: Étudier
    gloss: leçon + lire → j’étudie
    note: درس (leçon) se combine avec خواندن (lire) pour former درس می‌خوانم (j’étudie) ; littéralement « je lis une leçon ». C’est un nouveau type de verbe composé dans ce cours.
    target_text: درس (leçon) + خواندن (lire, étudier) = درس می‌خوانم (j’étudie)
  prs.a1.unit31.lesson01.teach.combined_sentence:
    title: J’étudie à l’université
    gloss: J’étudie à l’université.
    note: Combine من (je, révision), در (à, révision), پوهنتون et درس می‌خوانم.
  prs.a1.unit31.lesson02.teach.medicine_word:
    title: Médicament
    gloss: médicament
    note: طب signifie médecine comme filière d’études ; c’est un mot courant commun au persan et au dari.
    example_gloss: La médecine est difficile.
  prs.a1.unit31.lesson02.teach.law_word:
    title: Le droit
    gloss: droit
    note: حقوق signifie droit comme filière d’études ; c’est un mot courant commun au persan et au dari.
    example_gloss: Le droit est intéressant.
  prs.a1.unit31.lesson02.teach.economics_word:
    title: L’économie
    gloss: économie
    note: اقتصاد signifie économie comme filière d’études ; c’est un mot courant commun au persan et au dari.
    example_gloss: L’économie aussi est difficile.
  prs.a1.unit31.lesson02.teach.literature_word:
    title: La littérature
    gloss: littérature
    note: ادبیات signifie littérature comme filière d’études ; c’est un mot courant commun au persan et au dari.
    example_gloss: J’aime la littérature.
  prs.a1.unit31.lesson02.teach.reshte_ast_phrase:
    title: Ma filière est la médecine
    gloss: Ma filière, c’est la médecine.
    note: Associe رشته من (ma filière, révision) à است (est), introduit ici.
  prs.a1.unit31.lesson02.teach.mikhanam_subject_phrase:
    title: J’étudie la médecine
    gloss: J’étudie la médecine.
    note: Applique من ... می‌خوانم (j’étudie, révision) directement à un nom de filière, par exemple طب.
  prs.a1.unit31.lesson03.teach.review_koja:
    title: Où
    gloss: où
    note: کجا signifie « où ».
    target_text: کجا (où)
  prs.a1.unit31.lesson03.teach.review_mikhanin:
    title: Vous étudiez (formel)
    gloss: vous étudiez (forme de politesse)
    note: درس می‌خوانین est la forme de politesse « vous étudiez », qui suit le modèle verbal en -ین déjà vu (par exemple استفاده می‌کنین, unité 30).
    target_text: درس می‌خوانین (vous étudiez, formel)
  prs.a1.unit31.lesson03.teach.question_where:
    title: Où étudiez-vous ?
    gloss: Où étudiez-vous ?
    note: Associe شما (vous, politesse, révision), کجا (où), درس et می‌خوانین.
  prs.a1.unit31.lesson03.teach.answer_kabul_university:
    title: J’étudie à l’université de Kaboul
    gloss: J’étudie à l’université de Kaboul.
    note: Associe من در ... درس می‌خوانم (j’étudie à ..., révision) à پوهنتون کابل (l’université de Kaboul).
  prs.a1.unit31.lesson04.teach.review_mikhanad:
    title: Il/elle étudie
    gloss: il/elle étudie
    note: درس می‌خواند est la forme de la 3e personne, qui suit le modèle verbal en -د déjà vu (par exemple استفاده می‌کند, unité 30).
    target_text: درس می‌خواند (il/elle étudie, 3e personne)
  prs.a1.unit31.lesson04.teach.review_to_mikhani:
    title: Toi / tu étudies (informel)
    gloss: tu (familier) / tu étudies
    note: تو et می‌خوانی sont le registre familier employé entre Karim et Parwin.
    target_text: تو (toi, informel) / می‌خوانی (tu étudies, informel)
  prs.a1.unit31.lesson04.teach.dialogue_line1:
    title: 'Karim : Parwin, où étudies-tu ?'
    gloss: Parwin, où étudies-tu ?
  prs.a1.unit31.lesson04.teach.dialogue_line2:
    title: 'Parwin : J’étudie à l’université de Kaboul. Ma filière, c’est la médecine.'
    gloss: J’étudie à l’université de Kaboul. Ma filière, c’est la médecine.
  prs.a1.unit31.lesson04.teach.dialogue_line3:
    title: 'Karim : La médecine, c’est difficile ?'
    gloss: La médecine, c’est difficile ?
  prs.a1.unit31.lesson04.teach.dialogue_line4:
    title: 'Parwin : Oui, c’est difficile mais passionnant. Et toi ?'
    gloss: Oui, c’est difficile mais passionnant. Et toi ?
  prs.a1.unit31.lesson04.teach.dialogue_line5:
    title: 'Karim : J’étudie au lycée.'
    gloss: J’étudie au lycée.
  prs.a1.unit31.lesson04.teach.dialogue_line6:
    title: 'Parwin : Super !'
    gloss: Super !
  prs.a1.unit31.lesson05.teach.reading_passage:
    title: Lecture sur les études
    gloss: Parwin étudie à l’université de Kaboul. Sa filière, c’est la médecine. La médecine est difficile mais passionnante. Karim étudie au lycée.
  prs.a1.unit31.lesson06.teach.review_like_have_time:
    title: J’aime / temps / je n’ai pas
    gloss: j’aime / temps / je n’ai pas
    note: دوست دارم (j’aime), وقت (temps) et ندارم (je n’ai pas) sont tous des révisions des unités 11, 14, 26, 29 et 30.
    target_text: دوست دارم (j’aime) / وقت (temps) / ندارم (je n’ai pas)
  prs.a1.unit31.lesson06.teach.wrap_summary:
    title: J’aime les études, mais je n’ai pas le temps
    gloss: J’aime les études, mais je n’ai pas le temps.
    note: Associe تحصیل را دوست دارم (j’aime les études, construction revue) à اما وقت ندارم (mais je n’ai pas le temps).
