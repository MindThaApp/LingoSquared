course:
  title: Dari A1
  description: 'Dari de Kaboul pour débutants : le vocabulaire des transports (bus, taxi, voiture, vélo, à pied), dire comment on se déplace, acheter un ticket, et un dialogue entre Zarmina et Homayoun qui compare les façons de faire le trajet.'
units:
  prs.a1.unit24.transportation:
    title: Les transports
    description: Parle de tes déplacements en ville, achète un ticket et demande quel transport prendre.
