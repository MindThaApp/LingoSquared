    title: Voiture
    gloss: voiture
    note: 'موتر signifie « voiture » : c’est le mot courant en dari d’Afghanistan (le persan d’Iran dit ماشین).'
    example_gloss: J’ai une voiture.
  prs.a1.unit24.lesson01.teach.bicycle:
    title: Vélo
    gloss: vélo
    note: دوچرخه signifie « vélo ».
    example_gloss: J’ai un vélo.
  prs.a1.unit24.lesson01.teach.on_foot:
    title: À pied
    gloss: à pied
    note: پیاده signifie « à pied » ou « en marchant ».
    example_gloss: Je vais à pied.
  prs.a1.unit24.lesson01.teach.review_miravam:
    title: je vais
    gloss: je vais
    note: می‌روم signifie « je vais » (déjà vu plus tôt dans le cours).
    example_gloss: Je vais à pied.
  prs.a1.unit24.lesson02.teach.ba:
    title: Par / avec
    gloss: par / avec
    note: با est la préposition qui exprime le moyen, utilisée pour « en [transport] ».
    example_gloss: Je vais en bus.
  prs.a1.unit24.lesson02.teach.ba_bus:
    title: Je vais en bus
    gloss: Je vais en bus.
    note: با بس می‌روم signifie « Je vais en bus ».
  prs.a1.unit24.lesson02.teach.ba_taxi:
    title: Je vais en taxi
    gloss: Je vais en taxi.
    note: با تکسی می‌روم signifie « Je vais en taxi ».
  prs.a1.unit24.lesson02.teach.chetor:
    title: Comment
    gloss: comment
    note: چطور signifie « comment ».
    example_gloss: Comment vas-tu ?
  prs.a1.unit24.lesson02.teach.chetor_miravi:
    title: Comment y vas-tu ?
    gloss: Comment y vas-tu ?
    note: Question courante pour demander à quelqu’un son moyen de transport.
  prs.a1.unit24.lesson03.teach.ticket:
    title: Billet
    gloss: billet
    note: تکت signifie « ticket » ; c’est un emprunt courant dans la vie de tous les jours.
    example_gloss: J’achète un ticket.
  prs.a1.unit24.lesson03.teach.station:
    title: Gare
    gloss: station / arrêt
    note: ایستگاه signifie « station » ou « arrêt ».
    example_gloss: Où est la gare routière ?
  prs.a1.unit24.lesson03.teach.ticket_price_q:
    title: Combien coûte le billet ?
    gloss: Combien coûte le billet ?
    note: Question courante quand on achète un ticket.
  prs.a1.unit24.lesson03.teach.review_khoram:
    title: J’achète
    gloss: j’achète
    note: می‌خرم signifie « j’achète » (déjà vu plus tôt dans le cours).
    example_gloss: J’achète un ticket.
  prs.a1.unit24.lesson04.teach.dialogue_line1:
    title: 'Zarmina : Comment vas-tu en ville ?'
    gloss: 'Zarmina : Homayoun, comment vas-tu en ville ?'
    note: شهر signifie « ville » ; mot nouveau dans cette réplique.
  prs.a1.unit24.lesson04.teach.dialogue_line2:
    title: 'Homayoun : J’y vais à pied, c’est près'
    gloss: 'Homayoun : J’y vais à pied, c’est près. Et toi, comment y vas-tu ?'
    note: نزدیک signifie « près » ; mot nouveau dans cette réplique.
  prs.a1.unit24.lesson04.teach.dialogue_line3:
    title: 'Zarmina : J’y vais en taxi, c’est direct et rapide'
    gloss: 'Zarmina : J’y vais en taxi, c’est direct et rapide.'
    note: تیز signifie « rapide » ; mot nouveau dans cette réplique.
  prs.a1.unit24.lesson04.teach.dialogue_line4:
    title: 'Homayoun : Le bus est bien aussi, il est bon marché'
    gloss: 'Homayoun : Le bus est bien aussi, il est bon marché.'
    note: ارزان signifie « bon marché » ; mot nouveau dans cette réplique.
  prs.a1.unit24.lesson04.teach.dialogue_line5:
    title: 'Zarmina : Oui, mais le taxi est plus rapide'
    gloss: 'Zarmina : Oui, mais le taxi est plus rapide.'
    note: اما signifie « mais » ; تیزتر est le comparatif « plus rapide ».
  prs.a1.unit24.lesson05.teach.reading_passage:
    title: Lecture sur les trajets quotidiens
    gloss: Zarmina va en ville en taxi tous les jours. Le taxi est rapide, mais il n’est pas bon marché. Homayoun y va à pied, parce que sa maison est proche. Il met de l’argent de côté pour une voiture.
    note: Un court texte qui reprend le vocabulaire de l’unité et le connecteur « چون » (parce que).
  prs.a1.unit24.lesson06.teach.review_dochakhe:
    title: Vélo (révision)
    gloss: vélo
    note: دوچرخه signifie « vélo » (révision de la leçon 1).
    example_gloss: Je vais en vélo.
  prs.a1.unit24.lesson06.teach.wrap_summary:
    title: Je vais à pied ou en bus tous les jours
    gloss: Je vais à pied ou en bus tous les jours.
    note: یا signifie « ou » ; mot nouveau dans cette phrase de synthèse.
