course:
  title: Dari en français A2
  description: 'Dari afghan de niveau pré-intermédiaire : un entretien d’embauche de base — vocabulaire, décrire son expérience et ses disponibilités, lire une offre d’emploi et l’entretien lui-même.'
units:
  prs.a2.unit14.job_interview:
    title: Entretien d’embauche
lessons:
  prs.a2.unit14.lesson01.interview_vocabulary:
    title: Les mots de l’entretien d’embauche
  prs.a2.unit14.lesson02.describing_experience_and_availability:
    title: Décrire son expérience et ses disponibilités
  prs.a2.unit14.lesson03.reading_a_job_posting:
    title: Lire une offre d’emploi
  prs.a2.unit14.lesson04.interview_dialogue:
    title: L’entretien
teaching:
  prs.a2.unit14.lesson01.teach.experience_word:
    title: Expérience
    gloss: expérience
    note: '*تجربه* est le mot général pour l’expérience professionnelle.'
    example_gloss: لیمه a trois ans d’expérience.
  prs.a2.unit14.lesson01.teach.skill_word:
    title: Compétence
    gloss: compétence
    note: '*مهارت* désigne une compétence ou une capacité.'
    example_gloss: La maîtrise de l’informatique est importante.
  prs.a2.unit14.lesson01.teach.salary_word:
    title: Salaire
    gloss: salaire
    note: '*حقوق* signifie salaire ou rémunération.'
    example_gloss: Le salaire pour ce poste est de 30 000 afghanis.
  prs.a2.unit14.lesson01.teach.position_word:
    title: Poste / emploi
    gloss: poste / emploi
    note: '*وظیفه* est un mot général pour un emploi ou un poste, à distinguer du mot plus formel *بست* (un poste officiel à pourvoir).'
    example_gloss: Ce poste est dans un bureau.
  prs.a2.unit14.lesson01.teach.resume_word:
    title: CV
    gloss: CV
    note: '*رزومه* est un mot emprunté (de l’anglais « resume ») pour désigner un CV.'
    example_gloss: J’ai envoyé mon CV à la personne qui mène l’entretien.
  prs.a2.unit14.lesson01.teach.interview_word:
    title: Entretien
    gloss: entretien
    note: '*مصاحبه* désigne un entretien d’embauche.'
    example_gloss: L’entretien de لیمه est demain.
  prs.a2.unit14.lesson01.teach.how_many_years_grammar:
    title: Demander « combien d’années » avec چند سال
    gloss: Combien d’années d’expérience avez-vous ?
    note: '*چند سال...؟* -- une structure de question de quantité pour demander le nombre d’années d’expérience.'
    target_text: چند سال تجربه دارین؟ (Combien d’années d’expérience avez-vous ?)
  prs.a2.unit14.lesson02.teach.three_years_experience:
    title: Dire ses années d’expérience
    gloss: J’ai trois ans d’expérience dans ce poste.
    note: '*در این وظیفه* signifie « dans ce poste ».'
  prs.a2.unit14.lesson02.teach.can_start_next_week:
    title: Dire quand on peut commencer
    gloss: Je peux commencer à partir de la semaine prochaine.
    note: '*از هفتهٔ آینده* signifie « à partir de la semaine prochaine » ; *می‌توانم* signifie « je peux ».'
  prs.a2.unit14.lesson02.teach.ask_salary:
    title: Demander le salaire
    gloss: Quel est le salaire pour ce poste ?
    note: '*چقدر؟* demande « combien ? ».'
  prs.a2.unit14.lesson03.teach.vacancy_word:
    title: Poste vacant / poste officiel
    gloss: poste vacant / poste officiel
    note: '*بست* est le terme afghan utilisé dans les offres d’emploi pour un poste officiel à pourvoir, plus formel que *وظیفه*.'
    example_gloss: Ce poste à pourvoir est dans un bureau.
  prs.a2.unit14.lesson03.teach.requirements_word:
    title: Conditions requises
    gloss: conditions requises
    note: '*شرایط* énumère les conditions requises pour un poste.'
    example_gloss: La condition requise pour ce poste est la maîtrise de l’informatique.
  prs.a2.unit14.lesson03.teach.notice_text:
    title: Une offre d’emploi
    gloss: 'Pour ce poste, au moins deux ans d’expérience sont requis. Conditions : maîtrise de l’informatique et de l’anglais. Salaire : 30 000 afghanis par mois.'
    note: Une courte offre d’emploi formelle, dans le registre que cette unité enseigne.
  prs.a2.unit14.lesson04.teach.turn01:
    title: L’employeur accueille لیمه
    gloss: L’employeur lui souhaite la bienvenue et lui demande de parler de son expérience.
    note: '*خوش آمدین* est un « bienvenue » formel.'
  prs.a2.unit14.lesson04.teach.turn02:
    title: لیمه parle de son expérience
    gloss: Elle dit qu’elle a trois ans d’expérience dans ce poste.
    note: C’est la même phrase que précédemment pour indiquer ses années d’expérience.
  prs.a2.unit14.lesson04.teach.turn03:
    title: L’employeur interroge sur les compétences
    gloss: L’employeur lui demande quelles sont ses compétences.
    note: '*مهارت‌های شما چیست؟* -- « Quelles sont vos compétences ? ».'
  prs.a2.unit14.lesson04.teach.turn04:
    title: لیمه énumère ses compétences
    gloss: Elle a des compétences en informatique et en anglais.
    note: Deux compétences sont énumérées et reliées par *و*.
  prs.a2.unit14.lesson04.teach.turn05:
    title: L’interviewer demande la date de début
    gloss: L’interviewer demande quand elle peut commencer.
    note: '*از کی می‌توانین شروع کنین؟* -- « À partir de quand pouvez-vous commencer ? ».'
  prs.a2.unit14.lesson04.teach.turn06:
    title: لیمه répond et pose une question sur le salaire
    gloss: Elle peut commencer la semaine prochaine et demande quel est le salaire pour ce poste.
    note: Associe l’expression *از هفتهٔ آینده می‌توانم شروع کنم* à la question sur le salaire.
  prs.a2.unit14.lesson04.teach.turn07:
    title: L’interviewer indique le salaire
    gloss: L’interviewer dit 30 000 afghanis par mois.
    note: Le salaire correspond à l’offre d’emploi que tu as lue plus tôt.
exercises:
