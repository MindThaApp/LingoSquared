course:
  title: Dari en français A2
  description: 'Dari afghan, niveau pré-intermédiaire : raconter étape par étape le déroulement d’une matinée ou d’un trajet, y compris une étape que tu as sautée. Verbes composés au passé simple, leur négation sur le verbe léger, la place de را et les connecteurs اول، بعد، بعد از آن، در آخر.'
units:
  prs.a2.unit22.busy_morning:
    title: Une matinée chargée
lessons:
  prs.a2.unit22.lesson01.morning_words_and_compound_verbs:
    title: Mots du matin et verbes composés
  prs.a2.unit22.lesson02.more_compound_verbs:
    title: Encore des verbes composés
  prs.a2.unit22.lesson03.negative_compound_verbs:
    title: Nier les verbes composés et place de را
  prs.a2.unit22.lesson04.telling_in_order:
    title: Raconter dans l’ordre
  prs.a2.unit22.lesson05.reading_and_listening:
    title: 'Lecture et écoute : une matinée chargée'
  prs.a2.unit22.lesson06.morning_conversation:
    title: Une conversation sur la matinée
teaching:
  prs.a2.unit22.lesson01.teach.this_morning:
    title: Ce matin
    gloss: aujourd’hui matin, ce matin
    note: '*امروز* signifie « aujourd’hui » et *صبح* « matin ». Ensemble, *امروز صبح* signifie « ce matin », le cadre temporel de cette unité. Dans une phrase en dari, le mot de temps vient en premier et le verbe en dernier.'
    example_gloss: Ce matin, je suis allé au bureau.
  prs.a2.unit22.lesson01.teach.late_early:
    title: Tard, tôt
    gloss: tard, tôt
    note: '*دیر* signifie « tard » et *زود* « tôt ». Tous deux se placent devant le verbe, juste avant lui, alors qu’en français l’adverbe vient après le verbe.'
    example_gloss:
    - Ce matin, je me suis réveillé tard.
    - Aujourd’hui, il s’est réveillé tôt.
  prs.a2.unit22.lesson01.teach.office:
    title: Bureau
    gloss: le bureau
    note: '*دفتر* est le bureau, le lieu où beaucoup de gens travaillent le matin en semaine à Kaboul.'
    example_gloss: Le matin, je suis allé au bureau.
  prs.a2.unit22.lesson01.teach.school:
    title: École
    gloss: école
    note: '*مکتب* est le mot afghan courant pour « école ». On y va avec *به*, comme dans *به مکتب رفتم*.'
    example_gloss: Il est allé à l’école le matin.
  prs.a2.unit22.lesson01.teach.by_bus_car:
    title: En bus, en voiture
    gloss: en bus, en voiture
    note: '*با* signifie « avec » ou « par ». *با بس* signifie « en bus » et *با موتر* « en voiture ». *بس* est le bus et *موتر* est le mot afghan pour « voiture ».'
    example_gloss:
    - Je suis allé au bureau en bus.
    - Nous sommes allés à l’école en voiture.
  prs.a2.unit22.lesson01.teach.on_foot:
    title: À pied
    gloss: à pied
    note: '*پیاده* signifie « à pied ». *پیاده رفتن* signifie « aller à pied, marcher jusqu’à un endroit », et *پیاده* se place juste avant le verbe.'
    example_gloss: Je suis allé à l’école à pied.
  prs.a2.unit22.lesson01.teach.bus_stop:
    title: Arrêt de bus, station
    gloss: arrêt de bus, arrêt
    note: '*ایستگاه* est un arrêt ou une station. *ایستگاه بس* est un arrêt de bus.'
    example_gloss: Je suis allé à l’arrêt de bus.
  prs.a2.unit22.lesson01.teach.gate:
    title: Portail, porte
    gloss: portail, porte extérieure d’une maison
    note: '*دروازه* est le portail ou la porte extérieure d’une maison. On l’ouvre chaque matin ; tu le retrouveras donc avec le petit mot *را* dans les prochaines leçons.'
    example_gloss: J’ai ouvert le portail.
  prs.a2.unit22.lesson01.teach.clothes:
    title: Mes vêtements
    gloss: mes vêtements
    note: '*لباس* est le vêtement, *لباس‌ها* les vêtements (la terminaison du pluriel *-ها* s’écrit avec un petit espace), et *-م* ajoute « mon/mes » : *لباس‌هایم* signifie « mes vêtements ».'
    example_gloss: J’ai mis mes vêtements.
  prs.a2.unit22.lesson01.teach.shower:
    title: Douche
    gloss: douche
    note: '*دوش* est une douche. On ne dit pas « laver une douche » : on la prend, avec le verbe *گرفتن*, que tu verras dans la prochaine leçon.'
    example_gloss: Le matin, j’ai pris une douche.
  prs.a2.unit22.lesson01.teach.tea:
    title: Le thé
    gloss: thé
    note: '*چای* est le thé, la boisson habituelle du matin. En dari, on « mange » le thé : le verbe est donc *خوردن*.'
    example_gloss: Le matin, j’ai bu du thé.
  prs.a2.unit22.lesson01.teach.breakfast:
    title: Le petit-déjeuner
    gloss: petit-déjeuner
    note: '*صبحانه* est le petit-déjeuner. À Kaboul, tu entendras aussi *ناشتا* pour le même repas ; ce cours utilise *صبحانه*.'
    example_gloss: Au petit-déjeuner, j’ai mangé du pain et bu du thé.
  prs.a2.unit22.lesson01.teach.wake_up:
    title: Se réveiller
    gloss: 'se réveiller (littéralement : devenir éveillé)'
    note: '*بیدار* signifie « éveillé » et *شدن* « devenir ». Ensemble, *بیدار شدن* signifie « se réveiller ». C’est un verbe composé : un mot qui n’est pas un verbe (ici un adjectif) plus un verbe léger.'
    example_gloss: Ce matin, je me suis réveillé.
  prs.a2.unit22.lesson01.teach.get_ready:
    title: Se préparer
    gloss: 'se préparer (littéralement : devenir prêt)'
    note: '*آماده* signifie « prêt » et *شدن* « devenir ». *آماده شدن* signifie « se préparer », un deuxième verbe composé formé avec *شدن*.'
    example_gloss: Ce matin, je me suis préparé.
  prs.a2.unit22.lesson01.teach.open:
    title: Ouvrir
    gloss: 'ouvrir (littéralement : rendre ouvert)'
    note: '*باز* signifie « ouvert » et *کردن* « faire ». *باز کردن* signifie « ouvrir ». C’est un verbe composé formé avec *کردن* : on rend quelque chose ouvert.'
    example_gloss: J’ai ouvert le portail.
  prs.a2.unit22.lesson01.teach.went_office:
    title: Je suis allé au bureau
    gloss: Je suis allée au bureau.
    note: '*رفتم* est le passé simple de *رفتن* vu à l’unité 19 : radical du passé *رفت* plus *-م*. *به* signifie « à », donc *به دفتر رفتم* signifie « je suis allé au bureau ».'
  prs.a2.unit22.lesson01.teach.opened_gate:
    title: j’ai ouvert le portail
    gloss: J’ai ouvert le portail.
    note: '*را* est un petit mot qui marque un objet précis, ici le portail. Pour l’instant, apprends la phrase entière. La leçon 3 explique exactement où se place *را*.'
  prs.a2.unit22.lesson01.teach.compound_rule:
    title: 'Verbes composés au passé : la terminaison se place sur le verbe léger'
    gloss: je me suis réveillé, tu t’es réveillé, il/elle s’est réveillé(e), nous nous sommes réveillés, vous vous êtes réveillés (forme de politesse ou pluriel), ils se sont réveillés
    note: 'Beaucoup de verbes courants en dari sont des verbes composés : un nom ou un adjectif suivi d’un verbe léger comme *شدن* ou *کردن*. *بیدار شدن* (se réveiller), *آماده شدن* (se préparer) et *باز کردن* (ouvrir) sont tous des verbes composés. Au passé simple, la première partie ne change jamais. Seul le verbe léger prend la terminaison du passé que tu connais déjà avec *رفتم* : prends l’infinitif, enlève *ن* (*شدن* donne *شد*), puis ajoute *-م، -ی، nothing، -یم، -ین، -ند* (« nothing » signifie qu’il n’y a aucune terminaison à la 3e personne du singulier). Ainsi, *بیدار شدم* veut dire « je me suis réveillé(e) », *بیدار شدی* « tu t’es réveillé(e) » (à un ami), *بیدار شد* « il ou elle s’est réveillé(e) », *بیدار شدیم* « nous nous sommes réveillé(e)s », *بیدار شدین* « vous vous êtes réveillé(e)(s) » (forme de politesse ou pluriel) et *بیدار شدند* « ils ou elles se sont réveillé(e)s ». Le pronom est facultatif, car la terminaison indique déjà qui a fait l’action.'
  prs.a2.unit22.lesson02.teach.take_shower:
    title: Prendre une douche
    gloss: prendre une douche
    note: '*دوش گرفتن* signifie « prendre une douche ». Le verbe léger est ici *گرفتن*, « prendre ». Son radical du passé est *گرفت* ; « j’ai pris une douche » se dit donc *دوش گرفتم*.'
    example_gloss: Ce matin, j’ai pris une douche.
  prs.a2.unit22.lesson02.teach.take_walk:
    title: Faire une promenade
    gloss: faire une promenade, se promener
    note: '*قدم* signifie un pas. *قدم زدن* signifie se promener, pour le plaisir et sans but précis. Le verbe léger est *زدن* et son radical du passé est *زد* : *قدم زدم* signifie « je me suis promené(e) ». Compare avec *پیاده رفتن*, aller à pied quelque part.'
    example_gloss: Je me suis promené(e) dans le parc.
  prs.a2.unit22.lesson02.teach.talk:
    title: Parler, discuter
    gloss: parler, discuter
    note: '*حرف* signifie un mot ou des paroles. *حرف زدن* signifie parler, de nouveau avec *زدن* : *حرف زدم* signifie « j''ai parlé ».'
    example_gloss: J'ai parlé avec mon ami.
  prs.a2.unit22.lesson02.teach.my_friend:
    title: Mon ami
    gloss: mon ami
    note: '*دوست* signifie un ami et *-م* ajoute « mon » : *دوستم* signifie « mon ami ». Place *به* devant la personne que tu appelles : *به دوستم*.'
    example_gloss: Ce matin, j'ai parlé avec mon ami.
  prs.a2.unit22.lesson02.teach.phone:
    title: Téléphoner
    gloss: téléphoner, passer un appel
    note: '*تیلفون* signifie le téléphone. *تیلفون کردن* signifie téléphoner, un autre verbe composé avec *کردن*. La personne que tu appelles se construit avec *به* : *به دوستم تیلفون کردم*.'
    example_gloss: J'ai téléphoné à mon ami.
  prs.a2.unit22.lesson02.teach.wait:
    title: Attendre
    gloss: 'attendre (littéralement : tirer une attente)'
    note: '*انتظار* signifie l''attente. *انتظار کشیدن* signifie attendre. Le verbe léger est *کشیدن*, tirer, et son radical du passé est *کشید* : *انتظار کشیدم* signifie « j''ai attendu ».'
    example_gloss: J'ai attendu à l'arrêt.
  prs.a2.unit22.lesson02.teach.get_on:
    title: Monter (dans un véhicule)
    gloss: monter (dans un bus, une voiture)
    note: '*سوار* signifie monté, à bord, et *شدن* signifie devenir. *سوار شدن* signifie monter dans un bus ou une voiture. Le véhicule se construit avec *به* : *به بس سوار شدم*.'
    example_gloss: Je suis monté(e) dans le bus.
  prs.a2.unit22.lesson02.teach.get_off:
    title: Descendre (d'un véhicule)
    gloss: descendre (d'un véhicule)
    note: '*پیاده شدن* signifie descendre d''un bus ou d''une voiture. Attention : *پیاده رفتم* signifie « j''y suis allé(e) à pied » et *پیاده شدم* signifie « je suis descendu(e) ». Le véhicule que l''on quitte se construit avec *از* : *از بس پیاده شدم*.'
    example_gloss: Je suis descendu(e) du bus.
  prs.a2.unit22.lesson02.teach.put_on:
    title: Mettre, porter (un vêtement)
    gloss: mettre (des vêtements), porter
    note: '*پوشیدن* signifie mettre des vêtements. C''est un verbe simple, non composé : son radical du passé est *پوشید*, donc *پوشیدم* signifie « j''ai mis ».'
    example_gloss: J’ai mis mes vêtements.
  prs.a2.unit22.lesson02.teach.close:
    title: Fermer
    gloss: fermer
    note: '*بستن* signifie fermer. C''est un verbe simple dont le radical du passé est *بست*, donc *بستم* signifie « j''ai fermé ». C''est le contraire de *باز کردن*.'
    example_gloss: J'ai fermé le portail.
  prs.a2.unit22.lesson02.teach.arrive:
    title: Arriver
    gloss: arriver, atteindre
    note: '*رسیدن* signifie arriver. Le lieu où l''on arrive se construit avec *به*, et le radical du passé est *رسید* : *به دفتر رسیدم* signifie « je suis arrivé(e) au bureau ».'
    example_gloss: Je suis arrivé(e) au bureau.
  prs.a2.unit22.lesson02.teach.light_verbs:
    title: Cinq verbes légers et leurs radicaux du passé
    gloss: je me suis réveillé(e), j'ai ouvert, j'ai pris une douche, je me suis promené(e), j'ai attendu
    note: 'Un verbe composé tire son sens de ses deux parties : apprends donc le verbe léger avec la première partie. Ces cinq verbes légers forment la plupart des verbes composés d''une matinée. *شدن* (radical du passé *شد*) signifie devenir : *بیدار شدم*, *سوار شدم*. *کردن* (*کرد*) signifie faire : *باز کردم*, *تیلفون کردم*. *گرفتن* (*گرفت*) signifie prendre : *دوش گرفتم*. *زدن* (*زد*) signifie frapper, mais dans les verbes composés il ne fait que porter l''action : *قدم زدم*, *حرف زدم*. *کشیدن* (*کشید*) signifie tirer : *انتظار کشیدم*. La terminaison s''ajoute au radical du verbe léger, comme pour *رفتم*. Les verbes simples comme *پوشیدن* (*پوشیدم*), *بستن* (*بستم*) et *رسیدن* (*رسیدم*) prennent les mêmes terminaisons.'
  prs.a2.unit22.lesson03.teach.neg_rule:
    title: 'Nier un verbe composé : le ن se place sur le verbe léger'
    gloss: je ne me suis pas réveillé(e), tu ne t'es pas réveillé(e), il/elle ne s'est pas réveillé(e), nous ne nous sommes pas réveillés, vous ne vous êtes pas réveillé(e)(s) (forme polie ou pluriel), ils/elles ne se sont pas réveillé(e)s
    note: 'À l''unité 19, tu as placé *ن* devant un verbe simple au passé : *رفتم* est devenu *نرفتم*. Un verbe composé a deux parties, et le *ن* se place sur le verbe léger, jamais sur la première partie. *بیدار شدم* (je me suis réveillé(e)) devient *بیدار نشدم* (je ne me suis pas réveillé(e)), et les six formes sont *بیدار نشدم، بیدار نشدی، بیدار نشد، بیدار نشدیم، بیدار نشدین، بیدار نشدند*. La même règle vaut pour tous les verbes légers : *نکردم، نگرفتم، نزدم، نکشیدم*. Écrire *نبیدار شدم* est faux. Les verbes simples se comportent comme avant : *نپوشیدم، نبستم، نرسیدم*. Il n''y a toujours pas de *نمی* au passé simple négatif.'
  prs.a2.unit22.lesson03.teach.neg_phone_walk:
    title: Le même ن avec cinq verbes légers
    gloss: je n'ai pas téléphoné, je ne me suis pas promené(e), je n'ai pas attendu, je n'ai pas pris de douche, je n'ai pas ouvert
    note: 'Reprends les cinq verbes légers de la leçon précédente et mets *ن* sur chacun : *کردم* donne *نکردم* (*تیلفون نکردم*, *باز نکردم*), *زدم* donne *نزدم* (*قدم نزدم*), *کشیدم* donne *نکشیدم* (*انتظار نکشیدم*), *گرفتم* donne *نگرفتم* (*دوش نگرفتم*). La première partie reste à sa place et le verbe qui la suit est négatif.'
  prs.a2.unit22.lesson03.teach.no_breakfast:
    title: Je n'ai pas pris de petit-déjeuner
    gloss: Je n'ai pas pris de petit-déjeuner.
    note: '*نخوردم* est *ن* plus *خوردم*. *خوردن* est un verbe simple, donc le *ن* se place devant le verbe entier. À l''unité 19, tu as vu *خوردی*, tu as mangé, adressé à un ami : *صبحانه خوردی؟* signifie « as-tu pris ton petit-déjeuner ? »'
  prs.a2.unit22.lesson03.teach.on_time:
    title: À l’heure
    gloss: à l’heure
    note: '*وقت* signifie le temps. *به وقت* signifie à l''heure. Cela se place avant le verbe : *به وقت بیدار نشدم* signifie « je ne me suis pas réveillé(e) à l''heure ».'
    example_gloss: Ce matin, je ne me suis pas réveillé(e) à l'heure.
  prs.a2.unit22.lesson03.teach.make_tea:
    title: Préparer, faire
    gloss: 'préparer, faire (littéralement : rendre correct)'
    note: '*درست* signifie correct, juste, et *درست کردن* signifie faire ou préparer quelque chose, comme du thé ou un repas. C''est un verbe composé avec *کردن*. L''objet vient devant : *چای درست کردم*.'
    example_gloss: J'ai préparé du thé.
  prs.a2.unit22.lesson03.teach.ra_rule:
    title: Où se place را devant un verbe composé
    gloss: J'ai ouvert le portail. Je n'ai pas ouvert le portail. Je n'ai pas mis mes vêtements. J'ai préparé du thé.
    note: 'Quand l''objet du verbe est défini, c''est-à-dire connu ou précis (*دروازه*, le portail que tu ouvres chaque matin, ou *لباس‌هایم*, tes propres vêtements), le dari le marque avec *را*. Dans un verbe composé, *را* vient juste après l''objet et avant la première partie du verbe : *دروازه را باز کردم*, jamais au milieu de *باز کردم*. Le verbe composé reste uni, et la négation suit la même règle que précédemment : *دروازه را باز نکردم*. Quand l''objet n''est pas précis, comme dans *چای درست کردم* (j''ai préparé du thé), on n''emploie pas *را*.'
  prs.a2.unit22.lesson04.teach.first:
    title: D’abord
    gloss: d’abord
    note: '*اول* ouvre une suite d''actions. Il se place au début de la première proposition.'
    example_gloss: D'abord, j'ai pris une douche.
  prs.a2.unit22.lesson04.teach.then:
    title: Ensuite
    gloss: ensuite, après
    note: '*بعد* continue la suite après *اول*. Il se place au début de la proposition qu''il introduit.'
    example_gloss: Ensuite, j'ai mis mes vêtements.
  prs.a2.unit22.lesson04.teach.after_that:
    title: Après ça
    gloss: après ça
    note: '*بعد از آن* signifie après cela. C''est un *بعد* un peu plus développé, utile quand tu as déjà employé *بعد* une fois et que tu as une troisième étape.'
    example_gloss: Après cela, j'ai fermé le portail.
  prs.a2.unit22.lesson04.teach.finally:
    title: Enfin
    gloss: enfin, à la fin
    note: '*در آخر* clôt une suite d''actions, après *اول*، *بعد* et *بعد از آن*. *آخر* signifie la fin.'
    example_gloss: Enfin, je suis arrivé(e) au bureau.
  prs.a2.unit22.lesson04.teach.but:
    title: Mais
    gloss: mais
    note: '*ولی* oppose une étape que tu as faite à une étape que tu n''as pas faite, ou l''inverse.'
    example_gloss: Je n'ai pas pris de petit-déjeuner, mais j'ai bu du thé.
  prs.a2.unit22.lesson04.teach.no:
    title: Non
    gloss: non
    note: '*نخیر* est le non poli et courant pour répondre à une question fermée. Entre amis, tu peux aussi entendre le plus court *نی*.'
    example_gloss: Non, je n'ai pas téléphoné.
  prs.a2.unit22.lesson04.teach.start_work:
    title: Commencer, débuter
    gloss: commencer, débuter
    note: '*شروع* signifie un début et *شروع کردن* signifie commencer. C''est un verbe composé avec *کردن*, et *کار* signifie le travail : *کار را شروع کردم* signifie « j''ai commencé le travail ».'
    example_gloss: J'ai commencé le travail.
  prs.a2.unit22.lesson04.teach.order_rule:
    title: Raconter une matinée dans l'ordre
    gloss: D'abord, j'ai pris une douche, ensuite j'ai mis mes vêtements, après cela j'ai ouvert le portail et enfin je suis allé(e) à pied au bureau.
    note: 'Pour raconter le déroulement d''une matinée, donne à chaque étape terminée son propre verbe au passé et marque l''ordre avec *اول* (d''abord), *بعد* (ensuite), *بعد از آن* (après cela) et *در آخر* (enfin). Les étapes suivent l''ordre où elles ont eu lieu. Relie-les par une virgule, un point ou *و* : *اول دوش گرفتم، بعد لباس‌هایم را پوشیدم.* Pour ajouter une étape qui n''a pas eu lieu, emploie un verbe composé négatif : *بعد از آن تیلفون نکردم.* Le connecteur se place au début de sa proposition, et le verbe reste à la fin.'
  prs.a2.unit22.lesson05.teach.way:
    title: Chemin, route
    gloss: chemin, route ; en chemin (avec در)
    note: '*راه* signifie le chemin ou la route. *در راه* signifie en chemin. Cela indique à quel moment du trajet quelque chose s''est passé.'
    example_gloss: En chemin, nous avons parlé.
  prs.a2.unit22.lesson05.teach.we_form:
    title: 'Faire les choses ensemble : la terminaison -یم (nous)'
    gloss: Avec mon ami, nous sommes allés à l'école à pied. En chemin, nous avons parlé. Enfin, nous sommes arrivés à l'école.
    note: 'Quand un ami fait les étapes avec toi, remplace la terminaison *-م* par *-یم* : *رفتیم* (nous sommes allés), *حرف زدیم* (nous avons parlé), *رسیدیم* (nous sommes arrivés). Dans un verbe composé, la terminaison se place toujours sur le verbe léger seul : *حرف زدیم*, et non *حرف‌یم زد*. La négation fonctionne de la même façon : *حرف نزدیم* signifie « nous n''avons pas parlé ».'
  prs.a2.unit22.lesson05.teach.message:
    title: Soraya raconte sa matinée
    gloss: Ce matin, je me suis réveillée tôt. D'abord, j'ai pris une douche et j'ai mis mes vêtements. Ensuite, j'ai pris mon petit-déjeuner, mais je n'ai pas préparé de thé. Après cela, j'ai ouvert le portail. Avec mon amie, nous sommes allées à l'école à pied. En chemin, nous avons parlé. Enfin, nous sommes arrivées à l'école.
    note: 'Un court récit écrit, dans l''ordre. Chaque étape est une action terminée avec un verbe au passé ; les verbes composés *بیدار شدم*, *دوش گرفتم*, *حرف زدیم* et le négatif *درست نکردم* gardent tous le verbe léger à la fin. Une étape n''a pas eu lieu : *چای درست نکردم*.'
  prs.a2.unit22.lesson05.teach.exchange_q:
    title: Naveed demande à Soraya si elle a préparé du thé
    gloss: Soraya, tu as préparé du thé ce matin ?
    note: 'Naveed pose la question au passé d''un verbe composé, *درست کردی*, à la forme du tu (ami) : la terminaison *-ی* se place sur le verbe léger.'
  prs.a2.unit22.lesson05.teach.exchange_a:
    title: Soraya répond
    gloss: Non, je n'ai pas préparé de thé. J'ai pris mon petit-déjeuner.
    note: Soraya dit d'abord ce qui n'a pas eu lieu, *چای درست نکردم*, puis ce qui a eu lieu, *صبحانه خوردم*.
  prs.a2.unit22.lesson06.teach.turn01:
    title: Soraya demande à Naveed comment s'est passée sa matinée
    gloss: Naveed, qu'est-ce que tu as fait ce matin ?
    note: '*چه کار کردی؟* signifie « qu''as-tu fait ? ». Cela demande une action terminée, donc on emploie le passé *کردی*.'
  prs.a2.unit22.lesson06.teach.turn02:
    title: Naveed donne les premières étapes et une étape qu'il a sautée
    gloss: D'abord, je me suis réveillé tard, ensuite j'ai pris une douche et j'ai mis mes vêtements. Je n'ai pas pris de petit-déjeuner.
    note: Naveed emploie *اول* et *بعد* pour l'ordre et termine par une étape négative, *صبحانه نخوردم*.
  prs.a2.unit22.lesson06.teach.turn03:
    title: Soraya demande ce qui s'est passé ensuite
    gloss: Qu'est-ce que tu as fait après cela ?
    note: '*بعد از آن* signifie « après cela » : elle demande donc l''étape suivante.'
  prs.a2.unit22.lesson06.teach.turn04:
    title: Naveed raconte comment il est allé au travail
    gloss: J'ai ouvert le portail et je suis allé à pied à l'arrêt de bus. J'ai attendu à l'arrêt et je suis monté dans le bus.
    note: 'Quatre étapes terminées avec quatre verbes au passé : *باز کردم، رفتم، انتظار کشیدم، سوار شدم*. Remarque *دروازه را باز کردم* : *را* vient juste après l''objet.'
  prs.a2.unit22.lesson06.teach.turn05:
    title: Soraya interroge sur l'appel téléphonique
    gloss: Tu m'as téléphoné ?
    note: Une question fermée sur une action terminée. *به من* signifie « à moi ».
  prs.a2.unit22.lesson06.teach.turn06:
    title: Naveed répond non et termine son récit
    gloss: Non, je n'ai pas téléphoné. Mais enfin, je suis arrivé au bureau.
    note: '*نخیر، تیلفون نکردم* répond avec le verbe composé négatif. *ولی در آخر* clôt ensuite le récit.'
