course:
  title: Dari en français A2
  description: 'Dari afghan niveau élémentaire supérieur : dire pourquoi on fait quelque chose. Le but avec برای suivi d’un nom ou d’un infinitif, برای اینکه et تا suivis du subjonctif, et la négation (pour que je ne ... pas), à propos des courses, de l’apprentissage et de l’épargne.'
