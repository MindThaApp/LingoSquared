teaching:
  prs.a2.unit36.lesson01.errands_and_for.teach.friends:
    title: Faroozan et Arif
    gloss: Voici Faroozan. Voici Arif. Ils sont amis.
    note: '*فروزان* et *عارف* sont deux amis qui apparaissent dans les conversations et les exemples de cette unité. Faroozan est une femme et Arif est un homme.'
  prs.a2.unit36.lesson01.errands_and_for.teach.post:
    title: Bureau de poste
    gloss: poste
    note: '*پُسته خانه* est le bureau de poste. On y va pour envoyer une lettre ou un colis.'
    example_gloss: La poste est proche.
  prs.a2.unit36.lesson01.errands_and_for.teach.letter:
    title: Lettre
    gloss: lettre
    note: '*نامه* est une lettre. Pour dire qu’on envoie une lettre, on utilise *را* : *نامه را می‌فرستم*.'
    example_gloss: La lettre est à la poste.
  prs.a2.unit36.lesson01.errands_and_for.teach.bank:
    title: Banque
    gloss: banque
    note: '*بانک* est la banque. On y va pour retirer de l’argent (*پول*) ou pour en déposer.'
    example_gloss: La banque est au marché.
  prs.a2.unit36.lesson01.errands_and_for.teach.send:
    title: Envoyer
    gloss: envoyer
    note: '*فرستادن* signifie envoyer. C’est aussi l’infinitif qu’on emploie après *برای* : *برای فرستادن نامه* signifie pour envoyer une lettre.'
    example_gloss: Envoyer une lettre est facile.
  prs.a2.unit36.lesson01.errands_and_for.teach.shopping:
    title: Les achats
    gloss: courses, achats
    note: '*خرید* désigne les courses, ce qu’on achète. *خرید دارم* signifie : j’ai des courses à faire.'
    example_gloss: Aujourd’hui, j’ai beaucoup de courses.
  prs.a2.unit36.lesson01.errands_and_for.teach.for_noun:
    title: 'برای + nom : ce pour quoi on fait quelque chose'
    gloss: Je vais au marché pour faire des courses. Je viens à Kaboul pour le travail. Je rentre à la maison pour me reposer.
    note: 'Place *برای* devant un nom pour dire dans quel but on fait quelque chose : *برای خرید* (pour les courses), *برای کار* (pour le travail), *برای استراحت* (pour se reposer). Le lieu reste introduit par *به* : *به بازار می‌روم*. Comme en français avec « pour », le nom après *برای* exprime déjà le but.'
  prs.a2.unit36.lesson01.errands_and_for.teach.for_inf:
    title: 'برای + infinitif : pour faire quelque chose'
    gloss: Pour envoyer une lettre, je vais à la poste. Pour acheter du pain, je vais à la boutique. Pour retirer de l’argent, je vais à la banque.
    note: 'Pour dire dans quel but on fait quelque chose, mets l’infinitif après *برای* : *فرستادن* (envoyer), *خریدن* (acheter), *گرفتن* (prendre, recevoir). L’infinitif se termine par *ن*. Ce qu’on envoie, achète ou prend vient après l’infinitif : *فرستادن نامه*, *خریدن نان*, *گرفتن پول*.'
  prs.a2.unit36.lesson01.errands_and_for.teach.order_question:
    title: Le but peut venir en dernier ; demander pourquoi
    gloss: Je vais à la banque pour retirer de l’argent. Pourquoi vas-tu à la banque ?
    note: 'Le but peut aussi venir à la fin : *به بانک می‌روم برای گرفتن پول*. Pour demander pourquoi, dis *برای چه؟* : *برای چه به بانک می‌روی؟* signifie « pourquoi vas-tu à la banque ? ». On répond avec *برای* et un nom ou un infinitif.'
  prs.a2.unit36.lesson01.errands_and_for.teach.sentence:
    title: Pour envoyer une lettre, je vais à la poste
    gloss: Pour envoyer une lettre, je vais à la poste.
    note: 'C’est le schéma de la première leçon : *برای* + infinitif d’abord, puis le lieu avec *به*, puis le verbe à la fin.'
  prs.a2.unit36.lesson02.for_that_subjunctive.teach.subj_form:
    title: 'Le subjonctif : ب + radical du présent + terminaison'
    gloss: que j’achète, que j’aille, que je prenne, que j’envoie, que je lise, que je voie, que je vienne, que j’apporte
    note: 'Le subjonctif est la forme verbale qui vient après *برای اینکه* et *تا*. On la construit à partir du radical du présent : on ajoute *ب-* devant et la terminaison de la personne. Pour « je », la terminaison est *-م* : *بخرم* (que j’achète), *بروم* (que j’aille), *بگیرم* (que je prenne). C’est la même forme que tu connais déjà dans *می‌خواهم بروم* et *باید بیایم*. Deux formes s’écrivent différemment et sont à apprendre telles quelles : *بیایم* (de *آمدن*) et *بیاورم* (de *آوردن*).'
  prs.a2.unit36.lesson02.for_that_subjunctive.teach.subj_paradigm:
    title: Les six personnes du subjonctif
    gloss: que j’achète, que tu achètes, qu’il ou elle achète, que nous achetions, que vous achetiez (politesse ou pluriel), qu’ils achètent
    note: 'Les terminaisons sont *-م، -ی، -د، -یم، -ین، -ند*. La terminaison de « vous » (politesse ou pluriel) est *-ین*, comme partout dans ce cours. Le subjonctif n’a pas de *می‌* : compare *می‌خرم* (j’achète) et *بخرم* (que j’achète).'
  prs.a2.unit36.lesson02.for_that_subjunctive.teach.for_that:
    title: 'برای اینکه + subjonctif : pour que je fasse quelque chose'
    gloss: Pour acheter du pain, je vais à la boutique. Pour retirer de l’argent, je vais à la banque.
    note: '*برای اینکه* signifie « afin que » ou « pour que ». Il introduit une proposition avec son propre verbe au subjonctif, et le verbe indique la personne : *برای اینکه نان بخرم* signifie « pour que j’achète du pain ». La proposition principale dit ce que tu fais. Comme en français avec « pour que », le verbe est conjugué au subjonctif. Les deux propositions peuvent changer de place : *به دوکان می‌روم برای اینکه نان بخرم*.'
  prs.a2.unit36.lesson02.for_that_subjunctive.teach.more_verbs:
    title: D’autres exemples, et les verbes composés
    gloss: Pour envoyer une lettre, je vais à la poste. Pour voir mon ami, je vais à Kaboul. Pour économiser, je marche.
    note: 'La même règle vaut pour tous les verbes. Avec un verbe composé comme *پس‌انداز کردن*, seule la partie verbale change et il n’y a pas de *ب-* : *پس‌انداز کنم* (que j’économise), *کار کنم* (que je travaille). Place ce que tu vois ou prends avec *را* avant le verbe : *دوستم را ببینم*.'
  prs.a2.unit36.lesson02.for_that_subjunctive.teach.sentence:
    title: Pour acheter du pain, je vais à la boutique
    gloss: Pour acheter du pain, je vais à la boutique.
    note: 'Compare avec la leçon 1 : *برای خریدن نان* (infinitif) et *برای اینکه نان بخرم* (proposition au subjonctif) disent la même chose.'
  prs.a2.unit36.lesson03.ta_and_negative.teach.ta:
    title: 'تا + subjonctif : la forme courte'
    gloss: Je vais à la boutique pour acheter du pain. Je vais à la banque pour retirer de l’argent. Je vais à la poste pour envoyer une lettre.
    note: '*تا* est une forme courte de *برای اینکه*. Il vient après la proposition principale et est suivi d’un verbe au subjonctif : *به دوکان می‌روم تا نان بخرم*. *تا* a aussi d’autres sens, par exemple « jusqu’à » dans *تا ساعت ده*. Si un verbe au subjonctif avec *ب-* suit, il signifie « pour que ».'
  prs.a2.unit36.lesson03.ta_and_negative.teach.persons:
    title: 'Les autres personnes : nous, il, ils'
    gloss: Nous allons acheter du pain. Il va envoyer une lettre. Ils vont retirer de l’argent.
    note: 'Les deux verbes prennent la même personne quand le sujet est le même : *می‌رویم* et *بخریم* se terminent tous deux par *-یم* (nous). Les terminaisons du subjonctif sont *-م، -ی، -د، -یم، -ین، -ند* ; ainsi *بفرستد* signifie « qu’il ou elle envoie » et *بگیرند* « qu’ils prennent ».'
  prs.a2.unit36.lesson03.ta_and_negative.teach.negative:
    title: 'La négation : ن + radical'
    gloss: Je pars tôt pour ne pas arriver en retard. Pour ne pas arriver en retard, je pars tôt.
    note: 'Pour dire ce que tu veux éviter, place *ن-* devant le radical et supprime le *ب-* : *برسم* (que j’arrive) devient *نرسم* (que je n’arrive pas). La proposition principale dit ce que tu fais pour l’éviter : *زود می‌روم*.'
  prs.a2.unit36.lesson03.ta_and_negative.teach.negative_two_word:
    title: La négation des verbes composés
    gloss: Je mets mon argent à la banque pour ne pas le perdre.
    note: 'Avec un verbe composé, le *ن-* se place sur la partie verbale : *گم کنم* (que je perde) devient *گم نکنم* (que je ne perde pas). *آن را* (le, la) renvoie à l’argent.'
  prs.a2.unit36.lesson03.ta_and_negative.teach.sentence:
    title: Je pars tôt pour ne pas arriver en retard
    gloss: Je pars tôt pour ne pas arriver en retard.
    note: '*تا دیر نرسم* nomme ce que tu ne veux pas, et *زود می‌روم* est ce que tu fais pour l’éviter.'
  prs.a2.unit36.lesson04.learning_and_saving.teach.lesson:
    title: Leçon, étude
    gloss: leçon, cours
    note: '*درس* est une leçon ou un cours. Avec *خواندن*, cela signifie étudier : *درس خواندن*.'
    example_gloss: Le cours d’anglais est à quatre heures.
  prs.a2.unit36.lesson04.learning_and_saving.teach.exam:
    title: Examen
    gloss: examen, épreuve
    note: '*امتحان* est un examen. On passe l’examen et on reçoit une note (*نمبر*).'
    example_gloss: L’examen est demain.
  prs.a2.unit36.lesson04.learning_and_saving.teach.learn:
    title: Apprendre
    gloss: apprendre
    note: '*یاد گرفتن* signifie apprendre. *یاد* est la première partie et *گرفتن* est le verbe. Le subjonctif pour « je » est *یاد بگیرم*, avec *ب-* devant *گیر*.'
    example_gloss: J’apprends l’anglais.
  prs.a2.unit36.lesson04.learning_and_saving.teach.study:
    title: Étudier
    gloss: étudier
    note: '*درس خواندن* signifie étudier. *می‌خوانم* signifie « je lis » ou « j’étudie ». La leçon reste devant, comme dans *درس می‌خوانم*.'
    example_gloss: Chaque soir, j’étudie.
  prs.a2.unit36.lesson04.learning_and_saving.teach.expensive:
    title: Cher
    gloss: cher
    note: '*گران* signifie cher. Son contraire est *ارزان* (bon marché).'
    example_gloss: Le cours est cher.
  prs.a2.unit36.lesson04.learning_and_saving.teach.cheap:
    title: Bon marché
    gloss: bon marché
    note: '*ارزان* signifie bon marché. Les choses *ارزان* t’aident à économiser de l’argent.'
    example_gloss: Le vélo est bon marché.
  prs.a2.unit36.lesson04.learning_and_saving.teach.spend:
    title: Dépenser de l’argent
    gloss: dépenser (de l’argent)
    note: '*خرج کردن* signifie dépenser de l’argent. La négation du verbe composé place *ن* sur *کردن* : *خرج نکنم* (que je ne dépense pas).'
    example_gloss: Je ne dépense pas beaucoup d’argent.
  prs.a2.unit36.lesson04.learning_and_saving.teach.for_noun2:
    title: برای + nom avec des mots d’apprentissage et d’épargne
    gloss: J’étudie pour l’examen. J’économise de l’argent pour le cours.
    note: 'Le schéma de la leçon 1 fonctionne aussi avec ces mots : *برای امتحان* (pour l’examen), *برای کورس* (pour le cours). Un nom après *برای* est une façon courte de dire en vue de quoi on fait un effort.'
  prs.a2.unit36.lesson04.learning_and_saving.teach.learn_clause:
    title: Des propositions de but sur l’apprentissage
    gloss: Pour apprendre l’anglais, je lis un livre chaque soir. Pour avoir une bonne note à l’examen, j’étudie beaucoup.
    note: 'Utilise *برای اینکه* ou *تا* avec un verbe au subjonctif pour dire pourquoi tu étudies : *یاد بگیرم* (que j’apprenne), *نمبر خوب بگیرم* (que j’obtienne une bonne note). Les deux propositions peuvent venir dans n’importe quel ordre.'
  prs.a2.unit36.lesson04.learning_and_saving.teach.save_clause:
    title: Des propositions de but sur l’épargne
    gloss: J’économise pour acheter un vélo. J’achète un livre bon marché pour ne pas dépenser beaucoup d’argent.
    note: Pour l’épargne, la proposition principale dit ce que tu fais et la proposition en *تا* dit dans quel but. La négation *خرج نکنم* dit ce que tu ne veux pas qu’il arrive.
  prs.a2.unit36.lesson04.learning_and_saving.teach.sentence:
    title: J’économise pour acheter un vélo
    gloss: J’économise de l’argent pour acheter un vélo.
    note: Une phrase courte qui nomme d’abord l’action, puis le but.
  prs.a2.unit36.lesson05.reading_and_listening.teach.narges:
    title: Fozia
    gloss: Fozia est l’amie de Faroozan.
    note: '*فوزیه* est une troisième amie. Elle écrit le message de cette leçon. Ce n’est pas la même personne que Faroozan.'
  prs.a2.unit36.lesson05.reading_and_listening.teach.fare:
    title: 'Payer le trajet : کرایه دادن'
    gloss: Je paie le trajet. Je ne paie pas le trajet. Pour ne pas payer le trajet, j’y vais à pied.
    note: '*کرایه دادن* signifie payer le prix d’un trajet en taxi ou en bus. Le présent est *می‌دهم*, le négatif est *نمی‌دهم*, et le subjonctif négatif est *ندهم* (que je ne paie pas). *پیاده می‌روم* signifie « j’y vais à pied ».'
  prs.a2.unit36.lesson05.reading_and_listening.teach.errand_turn01:
    title: Faroozan demande à Arif où il va
    gloss: Arif, où vas-tu aujourd’hui ?
    note: Faroozan demande *به کجا می‌روی؟* avec le présent *می‌روی*. C’est une amie, donc elle utilise *تو*.
  prs.a2.unit36.lesson05.reading_and_listening.teach.errand_turn02:
    title: Arif cite deux courses
    gloss: D’abord je vais à la poste pour envoyer cette lettre. Ensuite je vais à la banque.
    note: 'La première course a un but : *تا این نامه را بفرستم*. *اول* et *بعد* mettent les deux courses dans l’ordre.'
  prs.a2.unit36.lesson05.reading_and_listening.teach.errand_turn03:
    title: Faroozan interroge Arif sur la banque
    gloss: Qu’as-tu à faire à la banque ?
    note: '*چه کار داری؟* demande quelle affaire tu as quelque part.'
  prs.a2.unit36.lesson05.reading_and_listening.teach.errand_turn04:
    title: Arif dit pourquoi
    gloss: Je vais retirer de l’argent.
    note: La réponse courte *می‌روم تا پول بگیرم* exprime le but avec *تا* et le subjonctif *بگیرم*.
  prs.a2.unit36.lesson05.reading_and_listening.teach.errand_turn05:
    title: Faroozan demande comment il y va
    gloss: Tu y vas en voiture ?
    note: '*با موتر* signifie « en voiture ».'
  prs.a2.unit36.lesson05.reading_and_listening.teach.errand_turn06:
    title: Arif y va à pied pour économiser le trajet
    gloss: Non, j’y vais à pied pour ne pas payer le trajet.
    note: '*نخیر* signifie « non ». *تا کرایه ندهم* est le but négatif : il marche pour économiser de l’argent.'
  prs.a2.unit36.lesson05.reading_and_listening.teach.message:
    title: Un message sur l’épargne
    gloss: Bonjour Faroozan. Chaque mois, j’économise deux mille afghanis pour pouvoir acheter un vélo. Pour ne pas payer le trajet, je veux aller à l’école à vélo. Demain, je vais à la banque pour retirer mon argent. Fozia
    note: 'Un court message avec trois buts : *تا یک بایسکل بخرم* (pour acheter un vélo), *برای اینکه کرایه ندهم* (pour ne pas payer le trajet) et *تا پولم را بگیرم* (pour retirer son argent). Fozia emploie le présent simple *می‌روم* avec *فردا* pour exprimer le projet.'
  prs.a2.unit36.lesson06.english_conversation.teach.give_book:
    title: 'Deux sujets différents : je donne, pour que tu ne dépenses pas'
    gloss: Je te donne mon livre. Je te donne mon livre pour que tu ne dépenses pas d’argent.
    note: 'Les deux verbes peuvent avoir des sujets différents. Dans *کتابم را به تو می‌دهم تا پول خرج نکنی*, celui qui donne est « je » (*می‌دهم*) et celui qui ne dépense pas est « tu » (*نکنی*). Le subjonctif s’accorde avec son propre sujet : *-ی* pour « tu ».'
  prs.a2.unit36.lesson06.english_conversation.teach.english_turn01:
    title: Arif demande à Faroozan pourquoi elle lit chaque soir
    gloss: Faroozan, pourquoi lis-tu un livre chaque soir ?
    note: '*می‌خوانی* signifie « tu lis ». *چرا* demande « pourquoi » et appelle une raison ou un but.'
  prs.a2.unit36.lesson06.english_conversation.teach.english_turn02:
    title: Faroozan dit pourquoi elle étudie
    gloss: Pour apprendre l’anglais.
    note: 'Une réponse courte qui n’est qu’une proposition de but : *برای اینکه انگلیسی یاد بگیرم*. La principale est omise parce que la question l’a déjà donnée.'
  prs.a2.unit36.lesson06.english_conversation.teach.english_turn03:
    title: Arif demande le but plus profond
    gloss: Pour quoi faire ?
    note: '*برای چه؟* demande le but suivant, derrière le premier.'
  prs.a2.unit36.lesson06.english_conversation.teach.english_turn04:
    title: Faroozan donne le but suivant
    gloss: Pour avoir une bonne note à l’examen.
    note: '*تا در امتحان نمبر خوب بگیرم* est une proposition en *تا* à elle seule. *نمبر* signifie « la note ».'
  prs.a2.unit36.lesson06.english_conversation.teach.english_turn05:
    title: Arif veut étudier aussi
    gloss: Moi aussi, je veux étudier l’anglais, mais le cours est cher.
    note: '*می‌خواهم انگلیسی بخوانم* emploie le subjonctif *بخوانم* après *می‌خواهم*.'
  prs.a2.unit36.lesson06.english_conversation.teach.english_turn06:
    title: Faroozan propose son livre
    gloss: Je te donne mon livre pour que tu ne dépenses pas d’argent.
    note: '*تا پول خرج نکنی* a un sujet différent de celui du verbe principal : le livre est donné par « je », l’argent n’est pas dépensé par « toi ».'
exercises:
  prs.a2.unit36.lesson01.errands_and_for.exercise01.recognize_send_letter:
    instruction: Que signifie cette phrase ?
    correct_option: Je vais à la poste pour envoyer une lettre
    distractors:
    - J’enverrai une lettre à la banque
    - La poste est proche
    - Je ne veux pas envoyer de lettre
    accepted_answers:
    - value: Je vais à la poste pour envoyer une lettre
      status: correct
    feedback: '*برای فرستادن نامه* signifie « pour envoyer une lettre » et *به پُسته خانه می‌روم* signifie « je vais à la poste ».'
  prs.a2.unit36.lesson01.errands_and_for.exercise02.recognize_shopping:
    instruction: Que signifie cette phrase ?
    correct_option: Je vais au marché pour faire des achats
    distractors:
    - Le marché est loin de la maison
    - Je ne vais pas au marché
    - Hier, j’ai acheté du pain au marché
    accepted_answers:
    - value: Je vais au marché pour faire des achats
      status: correct
    feedback: '*برای خرید* signifie « pour faire des achats ». Avec *به بازار می‌روم*, cela donne « je vais au marché pour faire des achats ».'
  prs.a2.unit36.lesson01.errands_and_for.exercise03.match_errand_words:
    instruction: Associe chaque mot dari à son sens.
    accepted_answers:
    - value:
        پُسته خانه: poste
        نامه: lettre
        بانک: banque
        فرستادن: envoyer
        خریدن: acheter
        گرفتن: prendre, obtenir
        خرید: achats, courses
        استراحت: repos
