course:
  title: Dari en français A2
  description: 'Dari afghan de niveau pré-intermédiaire : prédire ce qui va arriver et faire une promesse. Le présent simple avec un mot de temps (فردا باران می‌بارد), peut-être et probablement avec le subjonctif, les promesses avec حتماً et قول می‌دهم, et le futur écrit pour lire les prévisions et les annonces.'
