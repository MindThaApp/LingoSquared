teaching:
  prs.a2.unit28.lesson01.teach.weather:
    title: Le temps
    gloss: temps (météo), air
    note: '*هوا* désigne le temps qu’il fait et aussi l’air. *هوای کابل* est le temps à Kaboul : on ajoute *-ی* après le premier mot pour relier les deux mots.'
    example_gloss: Aujourd’hui, il fait froid à Kaboul.
  prs.a2.unit28.lesson01.teach.cold:
    title: Froid
    gloss: froid
    note: '*سرد* signifie froid. Le contraire est *گرم* (chaud), un mot que tu connais. *هوا سرد است* dit qu’il fait froid maintenant ; *هوا سرد می‌شود* dit qu’il va se mettre à faire froid.'
    example_gloss: Demain matin, il fera froid.
  prs.a2.unit28.lesson01.teach.sunny:
    title: Ensoleillé
    gloss: ensoleillé
    note: '*آفتابی* signifie ensoleillé : *هوا آفتابی است* veut dire « il fait beau, il y a du soleil ».'
    example_gloss: Aujourd’hui, il fait beau.
  prs.a2.unit28.lesson01.teach.cloudy:
    title: Nuageux
    gloss: nuageux
    note: '*ابری* signifie nuageux. Les nuages viennent souvent avant *باران* (la pluie) et *برف* (la neige).'
    example_gloss: Ce soir, le ciel va se couvrir.
  prs.a2.unit28.lesson01.teach.forecast:
    title: Prévision
    gloss: prévision, prédiction
    note: '*پیش‌بینی* signifie prévision ou prédiction. *پیش‌بینی هوا* est la météo, les prévisions météorologiques. C’est le mot qu’on entend à la radio, à la télévision et au téléphone avant de planifier un voyage.'
    example_gloss: J’ai vu la météo.
  prs.a2.unit28.lesson01.teach.tonight:
    title: Ce soir
    gloss: ce soir, cette nuit
    note: '*امشب* signifie ce soir. C’est un mot de temps, comme *فردا* (demain) et *امروز* (aujourd’hui). C’est le premier des mots de temps qu’on emploie pour parler de ce qui va arriver.'
    example_gloss: Ce soir, il pleuvra.
  prs.a2.unit28.lesson01.teach.dayafter:
    title: Après-demain
    gloss: après-demain
    note: '*پس‌فردا* signifie après-demain. Il s’écrit avec une petite espace à l’intérieur du mot (la demi-espace), comme dans *می‌شود*.'
    example_gloss: Après-demain, il fera chaud.
  prs.a2.unit28.lesson01.teach.predict_form:
    title: 'Une prédiction : می‌ plus un mot de temps'
    gloss: Demain, il pleuvra. Ce soir, il fera froid. Après-demain, il fera beau.
    note: 'Pour dire ce qui va arriver, utilise le présent simple avec *می‌* et place un mot de temps dans la phrase. Le verbe ne change pas : *می‌بارد* (il pleut) et *فردا باران می‌بارد* (demain il pleuvra) contiennent le même verbe. C’est le mot de temps *فردا*, *امشب* ou *پس‌فردا* qui indique à l’auditeur qu’il s’agit du futur. Pour la météo, on emploie souvent *می‌شود* (il devient) : *فردا هوا سرد می‌شود* signifie « demain il fera plus froid ». C’est la manière orale normale de prédire quelque chose dont on est assez sûr.'
  prs.a2.unit28.lesson01.teach.plans_form:
    title: La même forme pour les projets et les événements
    gloss: Demain, je vais au bazar. La semaine prochaine, nous allons à Bamyan.
    note: 'Le même présent en *می‌* avec un mot de temps fonctionne aussi pour les personnes : *فردا به بازار می‌روم* signifie « demain j’irai au bazar », et *هفتهٔ آینده به بامیان می‌رویم* signifie « la semaine prochaine nous irons à Bamyan ». Apprends ici la forme de *ما* : *می‌رویم* (nous allons). Autres mots de temps : *امسال* (cette année), *هفتهٔ آینده* (la semaine prochaine), *بعد* (plus tard).'
  prs.a2.unit28.lesson01.teach.sentence:
    title: Demain, il fera froid
    gloss: Demain, il fera froid.
    note: 'Voici le schéma de toute l’unité : un mot de temps, un sujet et un verbe simple en *می‌*. Tu n’as besoin d’aucune terminaison spéciale du futur.'
  prs.a2.unit28.lesson02.teach.maybe:
    title: Peut-être
    gloss: peut-être
    note: '*شاید* signifie « peut-être ». Il se place au début de la proposition, et le verbe qui suit est au subjonctif (la forme que tu emploies après *باید*), parce que le locuteur n’est pas sûr : *شاید برف ببارد* veut dire « il neigera peut-être ». *ممکن است برف ببارد* a le même sens.'
    example_gloss: Il pleuvra peut-être demain.
  prs.a2.unit28.lesson02.teach.probably:
    title: Probablement
    gloss: probablement
    note: '*احتمالاً* est plus fort que *شاید* : tu penses que c’est plus probable que le contraire. Il se construit avec le présent simple, non avec le subjonctif : *احتمالاً امشب برف می‌بارد*.'
    example_gloss: Il neigera probablement cette nuit.
  prs.a2.unit28.lesson02.teach.possible:
    title: Il se peut qu’il neige
    gloss: Il se peut qu’il neige.
    note: '*ممکن است* signifie « il est possible que ». Comme *شاید*, il est suivi du subjonctif : *ممکن است برف ببارد*.'
  prs.a2.unit28.lesson02.teach.subj_form:
    title: 'Le subjonctif : ب + le radical du présent'
    gloss: que j’aille, que tu ailles, qu’il aille, que nous allions, que vous alliez (politesse ou pluriel), qu’ils aillent
    note: 'Le subjonctif se forme avec le radical du présent précédé de *ب* et les mêmes terminaisons que le présent : *می‌روم* (je vais) devient *بروم* (que j’aille). Les terminaisons sont *-م، -ی، -د، -یم، -ین، -ند*, ce qui donne *بروم، بروی، برود، برویم، بروین، بروند*. Tu connais déjà cette forme grâce à *باید* ; *شاید* emploie la même. Ne mets pas *می‌* devant.'
  prs.a2.unit28.lesson02.teach.subj_more:
    title: Le subjonctif des autres verbes
    gloss: Il viendra peut-être. Le bus arrivera peut-être. Il neigera peut-être. Il tombera peut-être en panne.
    note: 'La même règle vaut pour tous les verbes : *آمدن* donne *بیاید* (qu’il vienne), *رسیدن* donne *برسد* (qu’il arrive), *باریدن* donne *ببارد* (qu’il neige). *شدن* a la forme courte *شود*, donc on dit *شاید خراب شود* (il tombera peut-être en panne). Avec *بودن*, le subjonctif est *باشد* : *شاید در خانه باشد* (il est peut-être à la maison).'
  prs.a2.unit28.lesson02.teach.subj_negative:
    title: 'La négation : ن devant le subjonctif'
    gloss: Il ne viendra peut-être pas. Nous n’irons peut-être pas. Il ne neigera peut-être pas.
    note: 'Pour dire « peut-être pas », place *ن* devant le subjonctif et supprime le *ب* : *بروم* devient *نروم*, *برویم* devient *نرویم*, *ببارد* devient *نبارد*. Le verbe *آمدن* est celui à retenir : sa négation est *نیاید* (et non *نبیاید*).'
  prs.a2.unit28.lesson02.teach.sentence:
    title: Il neigera peut-être demain
    gloss: Il neigera peut-être demain.
    note: Compare avec *فردا برف می‌بارد*. Cette phrase dit qu’il neigera ; l’autre dit qu’il pourrait neiger.
  prs.a2.unit28.lesson02.teach.sure_vs_maybe:
    title: Sûr ou pas sûr
    gloss: Il vient demain. Il viendra peut-être demain.
    note: 'Le verbe indique à l’interlocuteur ton degré de certitude. Avec *می‌*, tu es sûr : *فردا می‌آید* signifie « il vient demain ». Avec *شاید*, le verbe est au subjonctif et tu n’es pas sûr : *شاید فردا بیاید* signifie « il viendra peut-être demain ».'
  prs.a2.unit28.lesson03.teach.surely:
    title: Certainement
    gloss: certainement, sans faute
    note: '*حتماً* signifie « certainement » ou « sans faute ». Place-le devant un verbe simple en *می‌* pour faire une promesse ou exprimer une décision ferme : *حتماً می‌آیم* signifie « je viendrai sans faute ».'
    example_gloss: Je viendrai sans faute demain.
  prs.a2.unit28.lesson03.teach.promise_word:
    title: Promesse
    gloss: promesse, parole donnée
    note: '*قول* est une promesse. *قول می‌دهم* signifie « je promets », littéralement « je donne une promesse ». Tu peux ajouter *که* et une proposition : *قول می‌دهم که می‌آیم*.'
    example_gloss: Je promets que je viendrai.
  prs.a2.unit28.lesson03.teach.give_promise:
    title: Je le promets
    gloss: Je promets.
    note: '*می‌دهم* signifie « je donne ». Tu connais déjà *می‌دهین* (vous donnez) ; ici c’est la forme de *من*. Dis *قول می‌دهم* quand tu veux que l’autre te fasse confiance.'
  prs.a2.unit28.lesson03.teach.forget:
    title: Oublier
    gloss: oublié ; oublier
    note: '*فراموش کردن* signifie « oublier ». Une promesse se termine souvent par *فراموش نمی‌کنم* (je n’oublierai pas).'
    example_gloss: Je n’oublierai pas ma clé.
  prs.a2.unit28.lesson03.teach.later:
    title: Plus tard
    gloss: plus tard, après
    note: '*بعداً* signifie « plus tard ». C’est un mot de temps pour une promesse que tu tiendras bientôt, mais pas tout de suite.'
    example_gloss: Je téléphonerai plus tard.
  prs.a2.unit28.lesson03.teach.promise_form:
    title: 'Une promesse : حتماً + le présent simple'
    gloss: Je viendrai sans faute. Je téléphonerai sans faute. J’aiderai sans faute. Je l’enverrai sans faute.
    note: 'Une promesse comporte deux parties : *حتماً* et un verbe simple en *می‌* à la forme de *من*. Il n’y a pas de forme spéciale. Le mot de temps peut être présent ou non : *حتماً امشب تیلفون می‌کنم* signifie « je téléphonerai sans faute ce soir ». Pour une promesse faite à quelqu’un, tu peux ajouter *قول می‌دهم* au début.'
  prs.a2.unit28.lesson03.teach.you_come_q:
    title: Vous viendrez ?
    gloss: Tu viens ? Tu viendras ?
    note: '*می‌آیی* signifie « tu viens », à un ami. Le présent en *می‌* interroge sur le futur comme il l’exprime : *تو می‌آیی؟* signifie « est-ce que tu viendras ? ». La réponse est souvent une promesse : *حتماً می‌آیم*.'
  prs.a2.unit28.lesson03.teach.negative_promise:
    title: Promettre de ne pas faire quelque chose
    gloss: Je ne viendrai plus en retard. Je n’oublierai jamais.
    note: 'Pour promettre de ne pas faire quelque chose, emploie *نمی‌* dans le même schéma : *دیگر دیر نمی‌آیم* signifie « je ne viendrai plus en retard », et *هرگز فراموش نمی‌کنم* signifie « je n’oublierai jamais ». *دیگر* avec un verbe négatif signifie « ne... plus ».'
  prs.a2.unit28.lesson03.teach.sentence:
    title: Je téléphonerai sans faute ce soir
    gloss: Je téléphonerai sans faute ce soir.
    note: 'Une promesse avec un mot de temps : *حتماً*, *امشب* et *تیلفون می‌کنم*.'
  prs.a2.unit28.lesson04.teach.important:
    title: Important
    gloss: important
    note: '*مهم* signifie « important ». Une *جلسه مهم* est une réunion importante, à laquelle tu promets de venir.'
    example_gloss: Aujourd’hui, il y a une réunion importante.
  prs.a2.unit28.lesson04.teach.ladder:
    title: De sûr à pas sûr
    gloss: Il viendra sans faute. Il viendra probablement. Il viendra peut-être. Il se peut qu’il ne vienne pas.
    note: 'Choisis le mot selon ton degré de certitude. *حتماً* + un verbe simple en *می‌* : sûr. *احتمالاً* + un verbe au présent simple : probablement. *شاید* + le subjonctif : peut-être. *ممکن است* + le subjonctif : possible, et cela peut aussi être négatif : *ممکن است نیاید* (il se peut qu’il ne vienne pas).'
  prs.a2.unit28.lesson04.teach.maybe_but:
    title: Peut-être en retard, mais une promesse
    gloss: J’arriverai peut-être en retard, mais je viendrai sans faute.
    note: 'Tu peux relier un « peut-être » et une promesse avec *ولی* (mais) : *شاید دیر برسم، ولی حتماً می‌آیم*. La première partie dit ce dont tu n’es pas sûr, la seconde ce que tu promets. Emploie *شاید* pour ce que tu ne maîtrises pas et *حتماً* pour ce que tu maîtrises.'
  prs.a2.unit28.lesson04.teach.meeting_tomorrow:
    title: Une réunion demain
    gloss: Il y a une réunion demain. Tu viendras ?
    note: Une question sur demain emploie le présent avec un mot de temps. La meilleure réponse est une promesse avec *حتماً*.
  prs.a2.unit28.lesson05.teach.future_written:
    title: 'Le futur écrit : à reconnaître seulement'
    gloss: Il fera froid. Il neigera. Le bus partira. Le bus n’ira pas.
    note: 'Dans les journaux, les prévisions et les avis, tu liras un futur écrit : *خواهد* + l’infinitif court, comme dans *سرد خواهد بود* (il fera froid), *خواهد بارید* (il tombera de la pluie ou de la neige), *حرکت خواهد کرد* (il partira). La négation est *نخواهد* : *نخواهد رفت* (il n’ira pas). Tu as seulement besoin de comprendre cette forme à la lecture. Quand tu parles ou écris à un ami, emploie la forme que tu as apprise : *فردا برف می‌بارد* et *حتماً می‌روم*.'
  prs.a2.unit28.lesson05.teach.forecast_reading:
    title: Une prévision météo
    gloss: 'Prévisions météo : vendredi, il fera froid à Bamiyan. Il neigera peut-être. La semaine prochaine, il fera beau.'
    note: Une courte prévision à la radio. La première phrase emploie le futur écrit *خواهد بود*. La deuxième emploie *شاید* et le subjonctif, car la neige n’est pas sûre. La troisième emploie le simple *می‌شود* avec un mot de temps. Ensemble, elles montrent comment une prévision exprime le sûr, le pas sûr et la semaine prochaine.
  prs.a2.unit28.lesson05.teach.notice_reading:
    title: Un avis aux passagers
    gloss: 'Avis aux passagers de Bamiyan : la semaine prochaine, vendredi à huit heures, le bus partira de la gare routière. Veuillez être à la gare routière à sept heures. Le bus ne partira pas en retard.'
    note: 'Un avis à la gare routière. Il emploie le futur écrit *حرکت خواهد کرد* et la négation *حرکت نخواهد کرد* pour le programme, et une demande polie avec *لطفاً* et le subjonctif *باشین* (soyez). L’heure est *ساعت هشت* : le bus part à huit heures et les passagers doivent venir une heure plus tôt.'
  prs.a2.unit28.lesson05.teach.d1_t1:
    title: Basira interroge sur la météo
    gloss: Nader, as-tu vu la météo de vendredi ?
    note: Basira interroge sur la météo avec le passé simple *دیدی*. *هوای جمعه* signifie « le temps de vendredi ».
  prs.a2.unit28.lesson05.teach.d1_t2:
    title: Nader donne la prévision
    gloss: Oui. Vendredi, il fera froid et il neigera peut-être.
    note: 'Nader emploie les deux formes dans une seule phrase : le simple *می‌شود* pour le froid, qui est sûr, et *شاید* avec *ببارد* pour la neige, qui n’est pas sûre.'
  prs.a2.unit28.lesson05.teach.d1_t3:
    title: Basira pense qu’il vaut peut-être mieux ne pas y aller
    gloss: Alors nous n’irons peut-être pas à Bamiyan vendredi.
    note: '*شاید* avec le subjonctif négatif *نرویم* signifie « peut-être que nous n’irons pas ».'
  prs.a2.unit28.lesson05.teach.d1_t4:
    title: Nader propose la semaine prochaine
    gloss: Oui. Nous irons la semaine prochaine. Il fera beau.
    note: Nader reporte le voyage à *هفتهٔ آینده* avec le simple *می‌رویم* et un mot de temps.
  prs.a2.unit28.lesson05.teach.d1_t5:
    title: Basira est d’accord
    gloss: D’accord. La semaine prochaine, nous irons sans faute.
    note: 'Basira répond avec *حتماً* : elle est sûre pour la semaine prochaine.'
  prs.a2.unit28.lesson05.teach.d1_t6:
    title: Nader promet
    gloss: Je promets.
    note: Nader termine par *قول می‌دهم*, une promesse.
  prs.a2.unit28.lesson06.teach.d2_t1:
    title: Basira interroge Nader
    gloss: Nader, demain il y a une réunion importante. Tu viendras ?
    note: Basira emploie le présent avec *فردا* pour interroger sur demain. La réunion est *مهم*, donc elle veut une réponse ferme.
  prs.a2.unit28.lesson06.teach.d2_t2:
    title: Nader promet, avec un doute
    gloss: Je viendrai sans faute. Mais j’arriverai peut-être en retard, parce qu’il y a beaucoup de circulation.
    note: Nader promet avec *حتماً می‌آیم*, puis dit ce dont il n’est pas sûr avec *شاید دیر برسم*. *چون* donne la raison.
  prs.a2.unit28.lesson06.teach.d2_t3:
    title: Basira demande un appel
    gloss: Pas de problème. Tu téléphoneras ce soir ?
    note: 'Basira accepte le risque du retard avec *مشکلی نیست* et demande encore une promesse : un coup de téléphone ce soir.'
  prs.a2.unit28.lesson06.teach.d2_t4:
    title: Nader promet de téléphoner
    gloss: Je promets. Je téléphonerai sans faute ce soir. Je n’oublierai pas.
    note: 'Trois promesses de suite : *قول می‌دهم*, *حتماً امشب تیلفون می‌کنم* et *فراموش نمی‌کنم*.'
exercises:
