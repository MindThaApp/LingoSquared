    - Il ne neige jamais à Kaboul
    - J’aime la neige
    accepted_answers:
    - value: Il neigera demain
      status: correct
    feedback: '*فردا برف می‌بارد* signifie « il neigera demain » : le présent simple *می‌بارد* plus le mot de temps *فردا*.'
  prs.a2.unit28.lesson01.exercise02.recognize_cold_tonight:
    instruction: Que signifie cette phrase ?
    correct_option: Ce soir, il fera froid
