    - value: Il y a beaucoup de circulation
      status: correct
    feedback: '*چون ترافیک زیاد است* signifie « parce qu’il y a beaucoup de circulation ».'
  prs.a2.unit28.lesson06.exercise03.comprehend_phone:
    instruction: Lis la conversation, car il n’y a pas encore d’enregistrement. Que promet Nader de faire ce soir ?
