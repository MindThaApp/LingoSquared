  prs.a2.unit28.lesson06.exercise01.comprehend_will_come:
    instruction: Lis la conversation, car il n’y a pas encore d’enregistrement. Nader viendra-t-il à la réunion ?
    correct_option: Oui, il promet de venir, mais il sera peut-être en retard
    distractors:
    - Non, il ne peut pas venir
    - Il ne sait pas encore
    - Oui, et il sera en avance
    accepted_answers:
    - value: Oui, il promet de venir, mais il sera peut-être en retard
      status: correct
    feedback: '*حتماً می‌آیم* signifie « je viendrai sans faute », et *شاید دیر برسم* signifie « j’arriverai peut-être en retard ».'
  prs.a2.unit28.lesson06.exercise02.comprehend_why_late:
    instruction: Lis la conversation, car il n’y a pas encore d’enregistrement. Pourquoi Nader pourrait-il être en retard ?
    correct_option: Il y a beaucoup de circulation
    distractors:
    - Sa voiture est en panne
    - Il a une autre réunion
    - Il fait froid
