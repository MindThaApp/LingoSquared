course:
  title: Dari A1
  description: 'Dari de Kaboul pour débutants : comparaisons de base (plus grand/plus petit, plus cher/moins cher, plus grand/plus jeune), donner une raison pour une comparaison, et courte lecture ou dialogue comparant deux choses.'
units:
  prs.a1.unit15.comparisons:
    title: Comparaisons
    description: Faire et comprendre des comparaisons simples entre des personnes, des objets ou des options familiers.
lessons:
  prs.a1.unit15.lesson01.basic_comparative:
    title: Comparaisons de base
  prs.a1.unit15.lesson02.comparing_prices:
    title: Comparer des prix
  prs.a1.unit15.lesson03.comparing_people:
    title: Comparer des personnes
  prs.a1.unit15.lesson04.giving_reasons:
    title: Donner une raison pour une comparaison
  prs.a1.unit15.lesson05.reading_a_comparison:
    title: Lire une comparaison
  prs.a1.unit15.lesson06.comparisons_dialogue:
    title: Un dialogue qui compare deux choses
teaching:
  prs.a1.unit15.lesson01.teach.in_word:
    title: Ceci
    gloss: ce / cette
    note: این signifie « ceci / ce ».
    example_gloss: Celui-ci est plus grand.
  prs.a1.unit15.lesson01.teach.aan_word:
    title: Cela
    gloss: cela / celui-là
    note: 'آن signifie « cela / celui-là » : le dialecte de ce cours emploie la forme complète آن, et non la forme familière iranienne اون.'
    example_gloss: Celui-là est plus petit.
  prs.a1.unit15.lesson01.teach.bozorgtar_ast_word:
    title: C’est plus grand
    gloss: c’est plus grand
    note: 'بزرگ‌تر است est la forme complète, non contractée (c’est plus grand) : *بزرگ‌تر* est le comparatif de *بزرگ* (grand), et *است* reste un mot séparé.'
    example_gloss: Celui-ci est plus grand que celui-là.
  prs.a1.unit15.lesson01.teach.koochaktar_ast_word:
    title: C’est plus petit
    gloss: c’est plus petit
    note: 'کوچک‌تر است est la forme complète (c’est plus petit) : کوچک est l’orthographe standard du dari (et non کوچیک, forme familière iranienne).'
    example_gloss: Celui-là est plus petit que celui-ci.
  prs.a1.unit15.lesson01.teach.az_word:
    title: Que (comparaison)
    gloss: que
    note: 'از introduit le terme de comparaison : X از Y بزرگ‌تر است signifie « X est plus grand que Y ».'
    target_text: از (que)
  prs.a1.unit15.lesson02.teach.gerantar_ast_word:
    title: C’est plus cher
    gloss: c’est plus cher
    note: 'گران‌تر است est la forme complète (c’est plus cher) : گران est l’orthographe standard du dari (et non گرون, forme familière iranienne).'
    example_gloss: Celui-ci est plus cher que celui-là.
  prs.a1.unit15.lesson02.teach.arzantar_ast_word:
    title: C’est moins cher
    gloss: c’est moins cher
    note: 'ارزان‌تر است est la forme complète (c’est moins cher) : ارزان est l’orthographe standard du dari (et non ارزون, forme familière iranienne).'
    example_gloss: Celui-là est moins cher que celui-ci.
  prs.a1.unit15.lesson03.teach.names:
    title: Karim et Negar
    gloss: Karim, Negar
    note: Prénoms afghans courants, utilisés tout au long de ce cours.
    example_gloss:
    - Je suis Karim.
    - Je suis Negar.
  prs.a1.unit15.lesson03.teach.ghad_bolandtar_phrase:
    title: Plus grand
    gloss: plus grand / il est plus grand, elle est plus grande
    note: '*قد بلندتر است* signifie littéralement « la taille est plus haute » : *قد* (taille), *بلندتر* (plus grand ou plus haut, comparatif de *بلند*, grand), *است* (est).'
  prs.a1.unit15.lesson03.teach.javantar_ast_word:
    title: Plus jeune
    gloss: plus jeune / il est plus jeune, elle est plus jeune
    note: جوان‌تر است est la forme complète (il/elle est plus jeune) ; جوان est l’orthographe standard en dari (et non le جوون familier iranien).
    example_gloss: Negar est plus jeune que Karim.
  prs.a1.unit15.lesson04.teach.behtar_ast_word:
    title: C’est mieux
    gloss: c’est mieux
    note: بهتر است est la forme complète ; بهتر (mieux, meilleur) est le comparatif irrégulier de خوب (bon).
    example_gloss: Celui-ci est mieux que celui-là.
  prs.a1.unit15.lesson04.teach.badtar_ast_word:
    title: C’est pire
    gloss: c’est pire
    note: بدتر است est la forme complète ; بدتر (pire) est le comparatif irrégulier de بد (mauvais).
    example_gloss: Celui-là est pire que celui-ci.
  prs.a1.unit15.lesson04.teach.choon_word:
    title: Parce que
    gloss: parce que
    note: چون introduit une raison.
    target_text: چون (parce que)
  prs.a1.unit15.lesson04.teach.va_word:
    title: Et
    gloss: et
    note: و signifie « et » et relie deux propositions ou deux éléments.
    target_text: و (et)
  prs.a1.unit15.lesson05.teach.reading_text:
    title: Exemple de texte comparatif
    gloss: Karim est plus grand que Negar. Negar est plus jeune que Karim.
    note: Un court texte de comparaison à la troisième personne, qui réunit le vocabulaire de cette unité.
  prs.a1.unit15.lesson06.teach.names:
    title: Karim et Negar
    gloss: Karim, Negar
    example_gloss:
    - Karim est plus grand.
    - Negar est plus jeune.
  prs.a1.unit15.lesson06.teach.ama_word:
    title: Mais
    gloss: mais
    note: اما signifie « mais » et introduit une opposition.
    target_text: اما (mais)
  prs.a1.unit15.lesson06.teach.bali_word:
    title: Oui
    gloss: oui
    note: بلی est le mot poli et formel pour dire « oui », en accord avec le registre de ce cours.
    example_gloss: Oui, celui-ci est plus cher.
  prs.a1.unit15.lesson06.teach.dialogue_line1:
    title: Karim dit
    gloss: Celui-ci est plus cher que celui-là, mais il est mieux.
  prs.a1.unit15.lesson06.teach.dialogue_line2:
    title: Negar répond
    gloss: Oui, mais celui-là est moins cher.
