course:
  title: Dari en français A2
  description: 'Dari afghan niveau pré-intermédiaire : raconter ce que tu as fait le week-end dernier, dans l’ordre, y compris ce que tu n’as pas fait. Le passé simple comme système (radical du passé plus terminaisons), le passé négatif et le contraste avec le présent.'
units:
  prs.a2.unit19.last_weekend:
    title: Le week-end dernier
lessons:
  prs.a2.unit19.lesson01.weekend_words_and_past_form:
    title: Les mots du week-end et la forme du passé
  prs.a2.unit19.lesson02.building_the_past:
    title: Former le passé avec d’autres verbes
  prs.a2.unit19.lesson03.negative_past:
    title: Le passé négatif, et passé ou présent
  prs.a2.unit19.lesson04.telling_in_order:
    title: Raconter dans l’ordre
  prs.a2.unit19.lesson05.reading_and_listening:
    title: Lire et écouter un récit de week-end
  prs.a2.unit19.lesson06.weekend_conversation:
    title: Une conversation sur le week-end
teaching:
  prs.a2.unit19.lesson01.teach.last_weekend:
    title: Le week-end dernier
    gloss: le week-end dernier
    note: '*آخر هفته* désigne le week-end et *گذشته* signifie passé ou dernier. Ensemble, *آخر هفتهٔ گذشته* veut dire « le week-end dernier », le cadre temporel de toute cette unité.'
    example_gloss: Le week-end dernier, je suis allé au bazar.
  prs.a2.unit19.lesson01.teach.thursday_friday:
    title: Jeudi, vendredi
    gloss: Jeudi, vendredi
    note: En Afghanistan, le vendredi est le jour de repos hebdomadaire, et beaucoup de gens commencent leur week-end le jeudi après-midi. *پنجشنبه* et *جمعه* sont donc les deux jours que tu utiliseras le plus pour raconter un week-end.
    example_gloss:
    - Jeudi après-midi, je suis allé à la banque.
    - Vendredi, je suis allé au parc.
  prs.a2.unit19.lesson01.teach.afternoon:
    title: Après-midi
    gloss: après-midi, fin d’après-midi
    note: '*عصر* désigne la fin d’après-midi. Il se place après le jour : *پنجشنبه عصر* signifie « jeudi après-midi ».'
    example_gloss: Jeudi après-midi, je suis allé à la banque.
  prs.a2.unit19.lesson01.teach.yesterday:
    title: Hier
    gloss: hier
    note: '*دیروز* est un mot revu de l’unité sur les événements passés. Il s’emploie avec le même verbe au passé que tu vas construire dans cette unité.'
    example_gloss: Hier, j’ai pris mon petit-déjeuner.
  prs.a2.unit19.lesson01.teach.in_bazaar:
    title: Au bazar
    gloss: au bazar
    note: '*در* signifie « dans » ou « à », et *بازار* est le bazar ou le marché, lieu de nombreuses courses du week-end.'
    example_gloss: Au bazar, j’ai acheté du pain et des fruits.
  prs.a2.unit19.lesson01.teach.bank:
    title: Banque
    gloss: banque
    note: '*بانک* est la banque. C’est un autre endroit où l’on va faire des courses ou des démarches.'
    example_gloss: L’après-midi, je suis allé à la banque.
  prs.a2.unit19.lesson01.teach.park:
    title: Parc
    gloss: parc
    note: '*پارک* est le parc, un mot revu dans les unités sur les sorties.'
    example_gloss: Vendredi, je suis allé au parc avec mes amis.
  prs.a2.unit19.lesson01.teach.shopping:
    title: Faire les courses
    gloss: faire les courses, faire du shopping
    note: '*خرید کردن* est la façon courante de dire que tu as fait des achats. *خرید* signifie « achats » et *کردن* est le verbe « faire ».'
    example_gloss: J’ai fait des achats au bazar.
  prs.a2.unit19.lesson01.teach.visiting:
    title: Aller rendre visite
    gloss: aller rendre visite à quelqu’un
    note: '*به دیدن* plus une personne plus *رفتن* signifie aller rendre visite à cette personne : *به دیدن فامیلم رفتم* veut dire « je suis allé rendre visite à ma famille ». Les visites sont le deuxième grand thème de cette unité.'
    example_gloss: Vendredi, je suis allé rendre visite à ma famille.
  prs.a2.unit19.lesson01.teach.family:
    title: Famille, proches
    gloss: famille, proches
    note: '*فامیل* désigne ta famille et tes proches. Ajoute *-م* pour dire « ma/mes » : *فامیلم* signifie « ma famille ».'
    example_gloss: Ma famille est à Kaboul.
  prs.a2.unit19.lesson01.teach.errands:
    title: Avoir des courses à faire
    gloss: avoir des choses à faire, avoir des courses à faire
    note: '*کار* signifie « travail », mais aussi tâche ou course à faire. *کار داشتن* veut dire « avoir des choses à faire ». *چند* signifie « quelques » ou « combien ».'
    example_gloss: Jeudi après-midi, j’avais quelques courses à faire.
  prs.a2.unit19.lesson01.teach.go_paradigm:
    title: 'Le passé simple : radical du passé plus terminaisons'
    gloss: je suis allé, tu es allé, il/elle est allé(e), nous sommes allés, vous êtes allés (politesse ou pluriel), ils sont allés
    note: 'Le passé simple est un système, pas une liste de mots à mémoriser. Prends l’infinitif *رفتن* (aller) et retire le *ن* final : le radical du passé est *رفت*. Ajoute ensuite une terminaison : *-م* pour « je » (*رفتم*), *-ی* pour « tu » (*رفتی*), rien pour « il/elle » (*رفت*), *-یم* pour « nous » (*رفتیم*), *-ین* pour « vous » de politesse ou pluriel (*رفتین*), *-ند* pour « ils/elles » (*رفتند*). Le pronom (*من، تو، او*) est facultatif, car la terminaison indique déjà qui a fait l’action. Remarque que le passé n’a pas de *می* devant, contrairement au présent.'
  prs.a2.unit19.lesson02.teach.eat_paradigm:
    title: 'Même règle, nouveau verbe : manger'
    gloss: j’ai mangé, tu as mangé, il/elle a mangé, nous avons mangé, vous avez mangé (politesse ou pluriel), ils ont mangé
    note: 'La règle de *رفتن* vaut pour presque tous les verbes. *خوردن* (manger) perd son *ن* et donne le radical du passé *خورد*, suivi des mêmes six terminaisons : *خوردم، خوردی، خورد، خوردیم، خوردین، خوردند*. La forme « il/elle » est simplement le radical nu : *خورد* signifie « il/elle a mangé ».'
  prs.a2.unit19.lesson02.teach.breakfast:
    title: J’ai pris mon petit-déjeuner hier
    gloss: Hier, j’ai pris mon petit-déjeuner.
    note: '*صبحانه* est le petit-déjeuner, un mot revu dans les unités sur la routine quotidienne. *خوردم* est le passé de *خوردن* avec la terminaison *-م*.'
  prs.a2.unit19.lesson02.teach.bread_fruit:
    title: Du pain et des fruits
    gloss: du pain et des fruits
    note: '*نان* est le pain et *میوه* est le fruit. *و* signifie « et ».'
    example_gloss: Au bazar, j’ai acheté du pain et des fruits.
  prs.a2.unit19.lesson02.teach.more_verbs:
    title: Cinq autres verbes, une seule règle
    gloss: voir, acheter, faire, devenir, avoir au passé
    note: 'Tous les verbes ici suivent la même règle : retire le *ن*, puis ajoute la terminaison. *دیدن* (voir) donne *دیدم* (j’ai vu) et *دیدی* (tu as vu). *خریدن* (acheter) donne *خریدم* (j’ai acheté). *کردن* (faire) donne *کردم* (j’ai fait) et *کردی* (tu as fait). *شدن* (devenir) donne *شدم* (je suis devenu). *داشتن* (avoir) donne *داشتم* (j’avais). Seule la fin du verbe change, jamais le radical. Remarque que *خرید* est à la fois le radical du passé de *خریدن* (acheté) et le nom « achats », comme dans *خرید کردن*.'
  prs.a2.unit19.lesson02.teach.movie:
    title: J’ai vu un film
    gloss: J’ai vu un film.
    note: '*فلم* est un film. En dari, on dit *فلم دیدن*, littéralement « voir un film », donc *دیدم* est le verbe.'
  prs.a2.unit19.lesson02.teach.exercise:
    title: J’ai fait du sport
    gloss: J’ai fait du sport.
    note: '*ورزش* est le sport, l’exercice. *ورزش کردن* signifie « faire du sport », et la terminaison se place sur *کردن* : *ورزش کردم*.'
  prs.a2.unit19.lesson02.teach.woke_late:
    title: Je me suis réveillé tard
    gloss: Je me suis réveillé tard.
    note: '*دیر* signifie « tard » et *بیدار شدن* signifie « se réveiller ». *بیدار شدم* veut dire « je me suis réveillé », et *دیر* se place devant.'
  prs.a2.unit19.lesson03.teach.neg_paradigm:
    title: 'Le passé négatif : ن plus le verbe au passé'
    gloss: je ne suis pas allé, tu n’es pas allé, il/elle n’est pas allé(e), nous ne sommes pas allés, vous n’êtes pas allés (politesse ou pluriel), ils ne sont pas allés
    note: 'Pour dire que tu n’as pas fait quelque chose, place *ن* tout au début du verbe au passé : *رفتم* (je suis allé) devient *نرفتم* (je ne suis pas allé). Rien d’autre ne change, et les six mêmes terminaisons suivent : *نرفتم، نرفتی، نرفت، نرفتیم، نرفتین، نرفتند*. Il n’y a pas de *نمی* au passé simple négatif. Une action terminée qui n’a pas eu lieu, c’est simplement *ن* plus le verbe au passé.'
  prs.a2.unit19.lesson03.teach.neg_breakfast:
    title: Je n’ai pas pris de petit-déjeuner
    gloss: Je n’ai pas pris de petit-déjeuner.
    note: '*نخوردم* est *ن* plus *خوردم* : je n’ai pas mangé.'
  prs.a2.unit19.lesson03.teach.neg_more:
    title: Le même ن avec d’autres verbes
    gloss: je n’ai pas vu, je n’ai pas acheté, je n’avais pas, je n’ai pas fait
    note: 'La règle vaut pour tous les verbes que tu as rencontrés : *ندیدم* (je n’ai pas vu), *نخریدم* (je n’ai pas acheté), *نداشتم* (je n’avais pas), *نکردم* (je n’ai pas fait). Toujours *ن* d’abord, puis le verbe au passé. Quelques verbes commençant par آ changent d’orthographe : *آمدم* (je suis venu) devient *نیامدم* (je ne suis pas venu).'
  prs.a2.unit19.lesson03.teach.neg_compound:
    title: Nier les verbes avec کردن
    gloss: Je n’ai pas fait d’achats au bazar. Je n’ai pas fait de sport.
    note: 'Certains verbes sont composés d’un nom plus *کردن*, comme *خرید کردن* (faire des achats) et *ورزش کردن* (faire du sport). Place le *ن* sur *کردن*, pas sur le nom : *خرید نکردم*, *ورزش نکردم*. Écrire *نخرید کردم* est incorrect.'
  prs.a2.unit19.lesson03.teach.past_vs_present:
    title: Passé et présent
    gloss: Je vais au bazar. / Je suis allé au bazar. / Je ne suis pas allé au bazar.
    note: 'Le présent de ce verbe est *می‌روم* (je vais) : *می* plus le radical du présent *رو* plus la terminaison. Le passé est *رفتم*, sans *می*. Pour nier le présent, on emploie *نمی‌روم*, mais pour nier le passé, on emploie seulement *ن* : *نرفتم*. Emploie le passé pour une action terminée, comme le week-end dernier, et le présent pour ce que tu fais régulièrement ou en ce moment.'
  prs.a2.unit19.lesson04.teach.first:
    title: D’abord
    gloss: d’abord
    note: '*اول* ouvre une suite d’actions. C’est un mot revu de l’unité sur l’emploi du temps de la semaine.'
    example_gloss: D’abord, j’ai pris mon petit-déjeuner.
  prs.a2.unit19.lesson04.teach.then:
    title: Puis, ensuite
    gloss: puis, ensuite
    note: '*بعد* poursuit la suite d’actions après *اول*.'
    example_gloss: Ensuite, je suis allé à la banque.
  prs.a2.unit19.lesson04.teach.but:
    title: Mais
    gloss: mais
    note: '*ولی* relie ce que tu as fait à ce que tu n’as pas fait : il oppose les deux.'
    example_gloss: Je suis allé au bazar, mais je n’ai rien acheté.
  prs.a2.unit19.lesson04.teach.no:
    title: Non
    gloss: non
    note: '*نخیر* est le « non » poli de tous les jours en dari, utilisé pour répondre à une question fermée.'
    example_gloss: Non, je n’ai pas vu de film.
  prs.a2.unit19.lesson04.teach.finally:
    title: Enfin
    gloss: enfin, à la fin
    note: '*در آخر* clôt une suite d’actions, après *اول* et *بعد*. Tu connais déjà les deux mots qui le composent.'
    example_gloss: Enfin, je suis allé rendre visite à ma famille.
  prs.a2.unit19.lesson04.teach.home:
    title: Maison, chez soi
    gloss: maison, chez soi
    note: '*خانه* est la maison ou le foyer, un mot revu de l’unité sur le logement.'
    example_gloss: Enfin, je suis rentré à la maison.
  prs.a2.unit19.lesson04.teach.order_grammar:
    title: Raconter un week-end dans l’ordre
    gloss: Jeudi, d’abord je suis allé à la banque, ensuite j’ai fait des achats au bazar, et enfin je suis rentré à la maison.
    note: 'Pour raconter ce que tu as fait dans l’ordre, donne à chaque action terminée son propre verbe au passé et emploie *اول، بعد، در آخر* pour indiquer l’ordre. Les actions se suivent dans l’ordre où elles ont eu lieu : *اول به بانک رفتم، بعد در بازار خرید کردم و در آخر به خانه رفتم.* Tu peux relier les parties avec une virgule, un point ou *و*. Pour ajouter ce que tu n’as pas fait, emploie *ولی* et un verbe au passé négatif : *به بازار رفتم، ولی خرید نکردم.*'
  prs.a2.unit19.lesson05.teach.also:
    title: Aussi
    gloss: aussi
    note: '*هم* signifie « aussi » et se place après l’élément qu’il ajoute : *فلم هم ندیدم* veut dire « je n’ai pas non plus vu de film ».'
    example_gloss: Moi aussi, je suis allé au bazar.
  prs.a2.unit19.lesson05.teach.my_friend:
    title: Mon ami
    gloss: mon ami
    note: '*دوست* signifie ami, et *-م* ajoute « mon » : *دوستم* veut dire mon ami.'
    example_gloss: Vendredi, je suis allé rendre visite à mon ami.
  prs.a2.unit19.lesson05.teach.my_friends:
    title: Mes amis
    gloss: mes amis
    note: '*دوستان* signifie amis (le pluriel de *دوست*), et *-م* ajoute « mes » : *دوستانم* veut dire mes amis.'
    example_gloss: Vendredi, je suis allé au parc avec mes amis.
  prs.a2.unit19.lesson05.teach.with:
    title: Avec
    gloss: avec
    note: '*با* signifie avec. Il se place devant la personne : *با دوستانم* veut dire avec mes amis.'
    example_gloss: Je suis allé au bazar avec mes amis.
  prs.a2.unit19.lesson05.teach.message:
    title: Un message sur le week-end dernier
    gloss: Le week-end dernier, jeudi après-midi, j’avais plusieurs choses à faire. D’abord, je suis allé à la banque, puis j’ai acheté du pain et des fruits au bazar. Vendredi, je me suis réveillé tard et j’ai pris le petit-déjeuner, puis je suis allé rendre visite à ma famille. Je n’ai pas fait de sport et je n’ai pas non plus vu de film.
    note: 'Un court récit écrit d’un week-end, dans l’ordre des événements. Deux choses ne se sont pas passées, et chacune est un verbe négatif au passé : *ورزش نکردم* et *فلم ندیدم*.'
  prs.a2.unit19.lesson05.teach.exchange_q:
    title: Homayoun interroge Zarmina sur jeudi
    gloss: Zarmina, tu es allée à la banque jeudi ?
    note: Homayoun pose la question avec le verbe au passé *رفتی*, la forme de « tu » (ami). C’est une question à réponse oui ou non sur une action terminée.
  prs.a2.unit19.lesson05.teach.exchange_a:
    title: Zarmina répond
    gloss: Non, je ne suis pas allée à la banque. J’ai vu un film.
    note: Zarmina dit d’abord ce qui ne s’est pas passé, *به بانک نرفتم*, puis ce qui s’est passé, *فلم دیدم*.
  prs.a2.unit19.lesson06.teach.turn01:
    title: Zarmina interroge Homayoun sur le week-end dernier
    gloss: Homayoun, qu’est-ce que tu as fait le week-end dernier ?
    note: '*چه کار کردی؟* signifie « qu’as-tu fait ? ». Cela demande une action terminée, donc on emploie le passé *کردی*.'
  prs.a2.unit19.lesson06.teach.turn02:
    title: Homayoun raconte ses courses et sa visite
    gloss: Jeudi après-midi, j’avais plusieurs choses à faire. D’abord, je suis allé à la banque, puis j’ai acheté du pain et des fruits au bazar. Vendredi, je suis allé rendre visite à ma famille.
    note: Homayoun énumère ses courses dans l’ordre avec *اول* et *بعد*, puis passe à vendredi.
  prs.a2.unit19.lesson06.teach.turn03:
    title: Zarmina demande s’il a fait du sport
    gloss: Tu as fait du sport ?
    note: Une question à réponse oui ou non sur une action terminée, avec le passé *کردی*.
  prs.a2.unit19.lesson06.teach.turn04:
    title: Homayoun répond non et renvoie la question
    gloss: Non, je n’ai pas fait de sport. Et toi ?
    note: '*نخیر، ورزش نکردم* répond avec le passé négatif. *تو چطور؟* est une façon courte de demander « et toi ? ».'
  prs.a2.unit19.lesson06.teach.turn05:
    title: Zarmina raconte son week-end
    gloss: Jeudi, j’ai vu un film. Vendredi, je suis allée au bazar avec mes amis, mais je n’ai rien acheté.
    note: Zarmina emploie *ولی* pour opposer ce qu’elle a fait, aller au bazar, à ce qu’elle n’a pas fait, *خرید نکردم*.
  prs.a2.unit19.lesson06.teach.turn06:
    title: Homayoun réagit
    gloss: Super !
    note: '*چه خوب!* signifie « comme c’est bien ! » ou « super ! », une réaction amicale à une bonne nouvelle.'
exercises:
  prs.a2.unit19.lesson01.exercise01.recognize_last_weekend:
    instruction: Que signifie cette expression ?
    correct_option: le week-end dernier
    distractors:
    - ce week-end
    - le week-end prochain
    - tous les week-ends
    accepted_answers:
    - value: le week-end dernier
      status: correct
    feedback: '*آخر هفتهٔ گذشته* signifie le week-end dernier.'
  prs.a2.unit19.lesson01.exercise02.recognize_went_bazaar:
    instruction: Que signifie cette phrase ?
    correct_option: Je suis allé au bazar
    distractors:
    - J’irai au bazar
    - Je suis allé à la banque
    - J’ai acheté des choses au bazar
    accepted_answers:
    - value: Je suis allé au bazar
      status: correct
    feedback: '*به بازار رفتم* signifie je suis allé au bazar : le radical du passé *رفت* plus la terminaison *-م*.'
  prs.a2.unit19.lesson01.exercise03.recognize_we_went_park:
    instruction: Que signifie cette phrase ?
    correct_option: Nous sommes allés au parc
    distractors:
    - Je suis allé au parc
    - Ils sont allés au parc
    - Il est allé au parc
    accepted_answers:
    - value: Nous sommes allés au parc
      status: correct
    feedback: 'La terminaison *-یم* dans *رفتیم* signifie « nous » : *ما به پارک رفتیم* veut dire nous sommes allés au parc.'
  prs.a2.unit19.lesson01.exercise04.match_go_forms:
    instruction: Associe chaque mot dari à son sens.
    accepted_answers:
    - value:
        رفتم: je suis allé
        رفتی: tu es allé (à un ami)
        رفت: il ou elle est allé(e)
        رفتیم: nous sommes allés
        رفتین: vous êtes allé(e)(s) (formel ou pluriel)
        رفتند: ils sont allés
        بازار: bazar
        بانک: banque
        پارک: parc
      status: correct
    feedback: 'Chaque terminaison indique qui est allé : *-م* je, *-ی* tu (ami), aucune terminaison il ou elle, *-یم* nous, *-ین* vous (politesse ou pluriel), *-ند* ils/elles.'
    pairs:
    - left: رفتم
      right: je suis allé
    - left: رفتی
      right: tu es allé (à un ami)
    - left: رفت
      right: il ou elle est allé(e)
    - left: رفتیم
      right: nous sommes allés
    - left: رفتین
      right: vous êtes allé(e)(s) (formel ou pluriel)
    - left: رفتند
      right: ils sont allés
    - left: بازار
      right: bazar
    - left: بانک
      right: banque
    - left: پارک
      right: parc
  prs.a2.unit19.lesson01.exercise05.order_thursday_bank:
    instruction: 'Remets les mots dans l’ordre pour dire : Jeudi après-midi, je suis allé à la banque.'
    accepted_answers:
    - value:
      - پنجشنبه
      - عصر
      - به
      - بانک
      - رفتم
      status: correct
    - value:
      - به
      - بانک
      - پنجشنبه
      - عصر
      - رفتم
      status: correct
    feedback: '*پنجشنبه عصر به بانک رفتم* place le moment en premier, le lieu ensuite et le verbe au passé à la fin.'
  prs.a2.unit19.lesson01.exercise06.translate_went_bank:
    instruction: 'Traduis en dari, avec le passé de رفتن : Je suis allé à la banque.'
    accepted_answers:
    - value: به بانک رفتم
      status: correct
    - value: من به بانک رفتم
