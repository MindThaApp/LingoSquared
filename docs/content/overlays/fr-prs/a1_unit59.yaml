    title: Lac
    gloss: lac
    note: '*دریاچه* est le mot standard en dari et en persan pour un lac ; il est formé de *دریا* (rivière / grande étendue d’eau) et d’un suffixe de lieu.'
    example_gloss: Le bateau est sur le lac.
