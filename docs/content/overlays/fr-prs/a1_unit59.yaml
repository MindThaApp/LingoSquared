    target_text: این (ceci) / است (est) / در (dans) / خوب (bon)
  prs.a1.unit59.lesson01.teach.boat_word:
    title: Bateau
    gloss: bateau
    note: '*قایق* est le mot standard en dari et en persan pour un petit bateau ; c’est un mot de base, sans variation dialectale.'
    example_gloss: Ce bateau est joli.
