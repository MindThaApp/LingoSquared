course:
  title: Dari en français A2
  description: 'Dari afghan de niveau intermédiaire inférieur : donner et accueillir des conseils simples sur la santé, les études et l’argent avec le subjonctif. Conseils doux avec بهتر است که, conseils fermes avec باید et نباید, suggestions polies avec پیشنهاد می‌کنم که, demander quoi faire, et accepter, remettre en doute ou refuser un conseil.'
units:
  prs.a2.unit32.giving_advice:
    title: Donner des conseils
lessons:
  prs.a2.unit32.lesson01.better_to_go:
    title: Il vaut mieux que tu ailles chez le médecin
  prs.a2.unit32.lesson02.must_and_must_not:
    title: Devoir et ne pas devoir
  prs.a2.unit32.lesson03.i_suggest:
    title: Je suggère que
  prs.a2.unit32.lesson04.ask_and_answer:
    title: Demander un conseil et y répondre
  prs.a2.unit32.lesson05.reading_and_listening:
    title: Lire et écouter à propos de la santé
  prs.a2.unit32.lesson06.money_conversation:
    title: Une conversation sur l’argent
teaching:
  prs.a2.unit32.lesson01.teach.doctor:
    title: Médecin
    gloss: médecin
    note: '*داکتر* est le mot afghan pour « médecin ». Pour aller chez le médecin, on dit *به داکتر رفتن* : *به داکتر می‌روم* signifie « je vais chez le médecin ».'
    example_gloss: Le médecin est au cabinet aujourd’hui.
  prs.a2.unit32.lesson01.teach.medicine:
    title: Médicament
    gloss: médicament
    note: '*دوا* signifie « médicament ». En dari, on ne le « boit » pas et on ne le « prend » pas : on le « mange », *دوا خوردن*. *دوا را می‌خورم* signifie « je prends le médicament ».'
    example_gloss: Je prends le médicament après le repas.
  prs.a2.unit32.lesson01.teach.sick:
    title: Malade
    gloss: malade
    note: '*مریض* signifie « malade ». *مریض استم* : je suis malade ; *او مریض است* : il ou elle est malade.'
    example_gloss: Mon frère est malade.
  prs.a2.unit32.lesson01.teach.rest:
    title: Se reposer
    gloss: se reposer
    note: '*استراحت کردن* signifie « se reposer ». C’est un verbe en deux mots : *استراحت* reste devant et seul *کردن* change, comme dans *استراحت می‌کنم* (je me repose).'
    example_gloss: Après le travail, je me repose.
  prs.a2.unit32.lesson01.teach.sleep:
    title: Dormir
    gloss: dormir, aller se coucher
    note: '*خوابیدن* signifie « dormir » ou « aller se coucher ». *شب‌ها* signifie « la nuit, le soir » : *شب‌ها زود می‌خوابم* : le soir, je me couche tôt. *دیر خوابیدن* : se coucher tard.'
    example_gloss: Se coucher tôt est important.
  prs.a2.unit32.lesson01.teach.head:
    title: J’ai mal à la tête
    gloss: J’ai mal à la tête.
    note: 'Pour dire qu’une partie du corps fait mal, ajoute *-م* à la partie du corps, puis *درد می‌کند* : *سرم درد می‌کند* (j’ai mal à la tête). C’est le problème habituel qui pousse un ami à te donner des conseils.'
  prs.a2.unit32.lesson01.teach.stem:
    title: 'Le conseil utilise le subjonctif : impératif + ی'
    gloss: 'va : que tu ailles ; mange : que tu manges ; dors : que tu dormes ; repose-toi : que tu te reposes'
    note: 'Pour donner un conseil, on emploie une forme verbale appelée subjonctif. Pour un ami (*تو*), c’est facile : prends l’impératif adressé à un ami et ajoute *ی*. *برو* (va) donne *بروی*, *بخور* (mange) donne *بخوری*, *بخواب* (dors) donne *بخوابی*, *استراحت کن* (repose-toi) donne *استراحت کنی*. Pour la plupart des verbes, l’impératif commence par *ب-* ; les verbes formés avec *کردن* n’ont pas de *ب-* (*کن*, et non *بکن*, dans cette unité).'
  prs.a2.unit32.lesson01.teach.paradigm:
    title: 'Le subjonctif de رفتن : les six personnes'
    gloss: que j’aille, que tu ailles (ami), qu’il ou elle aille, que nous allions, que vous alliez (formel ou pluriel), qu’ils aillent
    note: 'Le radical d’impératif *برو* prend ces terminaisons : *بروم* (je), *بروی* (tu, à un ami), *برود* (il ou elle), *برویم* (nous), *بروین* (vous, formel ou pluriel), *بروند* (ils). Les terminaisons sont *-م، -ی، -د، -یم، -ین، -ند*. Cette unité écrit la terminaison de la 2e personne du pluriel *-ین*, comme le reste du cours. Le subjonctif n’indique pas le moment : c’est le conseil ou le verbe principal autour qui donne le sens.'
  prs.a2.unit32.lesson01.teach.better:
    title: Donner un conseil avec بهتر است که
    gloss: Il vaut mieux que tu ailles chez le médecin.
    note: '*بهتر است* (il vaut mieux) + *که* + le subjonctif est la manière douce et amicale de conseiller : *بهتر است که به داکتر بروی* signifie « il vaut mieux que tu ailles chez le médecin ». Le mot *که* peut être omis : *بهتر است به داکتر بروی* a le même sens. Cette unité écrit toujours *است* en entier ; il n’existe pas de forme plus courte dans le dari écrit du cours. La personne qui doit agir n’apparaît que par la terminaison du subjonctif : *بروی* correspond à « tu ».'
  prs.a2.unit32.lesson01.teach.better_more:
    title: Encore des conseils pour un ami malade
    gloss: Il vaut mieux que tu prennes le médicament. Il vaut mieux que tu ailles te coucher. Il vaut mieux que tu te reposes.
    note: 'Le même modèle avec d’autres verbes : *دوا بخوری* (que tu prennes le médicament), *بخوابی* (que tu ailles te coucher), *استراحت کنی* (que tu te reposes). Seul le verbe final change ; *بهتر است که* reste identique.'
  prs.a2.unit32.lesson01.teach.neg:
    title: 'Le négatif : ن à la place de ب'
    gloss: Il vaut mieux que tu n’y ailles pas. Il vaut mieux que tu ne te couches pas tard.
    note: 'Pour dire ce qu’un ami ne doit pas faire, mets *ن-* à la place de *ب-* : *بروی* devient *نروی*, *بخوری* devient *نخوری*, *بخوابی* devient *نخوابی*. Avec les verbes en *کردن*, le négatif est *نکنی*. Ainsi, *بهتر است که دیر نخوابی* signifie « il vaut mieux que tu ne te couches pas tard ».'
  prs.a2.unit32.lesson01.teach.formal:
    title: 'Conseil à une personne que l’on respecte : -ین'
    gloss: Il vaut mieux que vous alliez chez le médecin. (forme de politesse ou pluriel)
    note: 'À une personne que tu respectes, une personne âgée, un inconnu ou plusieurs personnes, tu emploies *شما* et la terminaison *-ین* : *بروین، بخورین، بخوابین، کنین*. *بهتر است که شما به داکتر بروین* signifie « il vaut mieux que vous alliez chez le médecin ». Avec un ami, on emploie *بروی*.'
  prs.a2.unit32.lesson01.teach.water:
    title: Boire beaucoup d’eau
    gloss: Il vaut mieux que tu boives beaucoup d’eau.
    note: 'En dari, on « mange » l’eau comme un médicament : *آب خوردن* signifie boire de l’eau. *آب زیاد* signifie beaucoup d’eau. C’est un conseil très courant pour un ami malade.'
  prs.a2.unit32.lesson02.teach.lesson:
    title: Leçon, étude
    gloss: leçon, travail scolaire
    note: '*درس* signifie leçon ou travail scolaire. *درس خواندن* signifie étudier (littéralement « lire une leçon ») : *درس می‌خوانم* signifie « j’étudie ».'
    example_gloss: Tous les jours, j’étudie.
  prs.a2.unit32.lesson02.teach.exam:
    title: Examen
    gloss: examen, épreuve
    note: '*امتحان* signifie examen ou épreuve. Les conseils sur les études concernent très souvent un *امتحان* qui approche.'
    example_gloss: Mon examen est demain.
  prs.a2.unit32.lesson02.teach.book:
    title: Livre
    gloss: livre
    note: '*کتاب* signifie livre. Ajoute *-م* pour dire « mon » : *کتابم*. Le pluriel s’écrit *کتاب‌ها*.'
    example_gloss: Mon livre est à l’école.
  prs.a2.unit32.lesson02.teach.review:
    title: Répéter, réviser
    gloss: répéter, revoir
    note: '*تکرار کردن* signifie répéter ou revoir quelque chose. C’est le conseil habituel avant un examen : *درس را تکرار کن*.'
    example_gloss: Chaque soir, je révise la leçon.
  prs.a2.unit32.lesson02.teach.early:
    title: Tôt, bientôt
    gloss: tôt, bientôt
    note: '*زود* signifie tôt ou bientôt. *زود خوابیدن* signifie se coucher tôt, et *صبح زود* signifie tôt le matin.'
    example_gloss: Tôt le matin, je vais à l’école.
  prs.a2.unit32.lesson02.teach.late:
    title: Tard
    gloss: tard
    note: '*دیر* signifie tard ; c’est le contraire de *زود*. *دیر خوابیدن* signifie se coucher tard.'
    example_gloss: Aujourd’hui, il ou elle est venu(e) tard.
  prs.a2.unit32.lesson02.teach.must:
    title: 'باید plus le subjonctif : devoir'
    gloss: Tu dois étudier tous les jours.
    note: '*باید* (devoir, falloir) est lui aussi suivi du subjonctif : *باید هر روز درس بخوانی* signifie « tu dois étudier tous les jours ». *باید* ne change jamais ; c’est la terminaison du subjonctif qui indique la personne. *باید* est plus fort que *بهتر است که* : il exprime une obligation ou un besoin clair. L’ordre des mots est libre : *هر روز باید درس بخوانی* est aussi correct.'
  prs.a2.unit32.lesson02.teach.must_paradigm:
    title: باید avec les six personnes
    gloss: je dois aller, tu dois aller, il/elle doit aller, nous devons aller, vous devez aller (politesse ou pluriel), ils/elles doivent aller
    note: 'Seule la terminaison du subjonctif change : *باید بروم* (je dois aller), *باید بروی* (tu dois aller), *باید برود* (il ou elle doit aller), *باید برویم* (nous devons aller), *باید بروین* (vous devez aller, politesse ou pluriel), *باید بروند* (ils ou elles doivent aller).'
  prs.a2.unit32.lesson02.teach.must_not:
    title: 'نباید : ne pas devoir'
    gloss: Tu ne dois pas te coucher tard.
    note: '*نباید* (ne pas devoir) est *باید* précédé de *ن-*. Le verbe qui suit reste à la forme positive : *نباید دیر بخوابی* signifie « tu ne dois pas te coucher tard ». N’ajoute pas un second *ن-* : on dit *نباید بخوابی*, et non *نباید نخوابی*.'
  prs.a2.unit32.lesson02.teach.soft_strong:
    title: Conseil doux et conseil ferme
    gloss: Il vaut mieux que tu te couches tôt. Tu dois te coucher tôt.
    note: Les deux phrases donnent le même conseil, mais avec une force différente. *بهتر است که زود بخوابی* est amical et doux, comme « il vaudrait mieux que… ». *باید زود بخوابی* est ferme, comme « tu dois vraiment… ». Emploie *بهتر است که* avec un ami quand tu ne fais que conseiller, et *باید* quand c’est important, par exemple avant un examen.
  prs.a2.unit32.lesson02.teach.review_adv:
    title: Conseil avant un examen
    gloss: Il vaut mieux que tu révises la leçon.
    note: 'Ce sur quoi on travaille se place avant le verbe, avec *را* : *درس را تکرار کنی* (que tu révises la leçon). C’est un bon conseil pour étudier.'
  prs.a2.unit32.lesson03.teach.money:
    title: L’argent
    gloss: argent
    note: '*پول* signifie argent. *پولم* signifie mon argent. *پولم کم است* signifie « je n’ai pas beaucoup d’argent ».'
    example_gloss: Je n’ai pas beaucoup d’argent.
  prs.a2.unit32.lesson03.teach.spend:
    title: Dépenser
    gloss: dépenser
    note: '*خرج کردن* signifie dépenser de l’argent. L’argent se place avant le verbe : *پول خرج کردن*. *زیاد خرج کردن* signifie dépenser beaucoup.'
    example_gloss: Chaque mois, il ou elle dépense beaucoup d’argent.
  prs.a2.unit32.lesson03.teach.save:
    title: Économiser
    gloss: économiser (de l’argent)
    note: '*پس‌انداز کردن* signifie économiser de l’argent. Comme *خرج کردن*, c’est un verbe composé de deux mots. *پس‌انداز* s’écrit avec la petite espace entre *پس* et *انداز*.'
    example_gloss: Chaque mois, j’économise un peu d’argent.
  prs.a2.unit32.lesson03.teach.expensive:
    title: Cher
    gloss: cher
    note: '*گران* signifie cher. Le contraire est *ارزان* (bon marché).'
    example_gloss: Cette voiture est chère.
  prs.a2.unit32.lesson03.teach.cheap:
    title: Bon marché
    gloss: bon marché
    note: '*ارزان* signifie bon marché. Le contraire est *گران*.'
    example_gloss: Ce livre est bon marché.
  prs.a2.unit32.lesson03.teach.month:
    title: Le mois
    gloss: le mois
    note: '*ماه* signifie mois. *هر ماه* signifie chaque mois. C’est un mot utile quand on parle d’argent, car beaucoup de gens reçoivent et dépensent de l’argent chaque mois.'
    example_gloss: Chaque mois, je vais à la banque.
  prs.a2.unit32.lesson03.teach.suggest:
    title: پیشنهاد می‌کنم که plus le subjonctif
    gloss: Je te suggère d’économiser de l’argent chaque mois.
    note: '*پیشنهاد می‌کنم* signifie « je suggère », et *که* plus le subjonctif dit ce que l’on suggère : *پیشنهاد می‌کنم که هر ماه پول پس‌انداز کنی* signifie « je te suggère d’économiser de l’argent chaque mois ». Le verbe *می‌کنم* a le *می‌* et la terminaison *-م* (je). Le verbe après *که* est de nouveau au subjonctif : *پس‌انداز کنی*. Pour suggérer quelque chose à plusieurs, dis *پیشنهاد می‌کنیم که* (nous suggérons que).'
  prs.a2.unit32.lesson03.teach.three:
    title: Trois façons de donner le même conseil
    gloss: Il vaut mieux que tu économises de l’argent. Tu dois économiser de l’argent. Je te suggère d’économiser de l’argent.
    note: Tu connais maintenant trois structures qui demandent toutes le subjonctif. *بهتر است که* est celle de l’ami, douce. *باید* est ferme. *پیشنهاد می‌کنم که* est polie et claire ; elle ressemble à la suggestion de quelqu’un qui te respecte, et c’est celle à employer quand tu n’es pas proche de la personne.
  prs.a2.unit32.lesson03.teach.we_suggest:
    title: Nous suggérons
    gloss: Nous te suggérons de te coucher tôt.
    note: 'Pour « nous », la terminaison de *می‌کنم* devient *-یم* : *پیشنهاد می‌کنیم* signifie « nous suggérons ». Emploie-le quand tu parles au nom d’un groupe, par exemple une famille ou une équipe.'
  prs.a2.unit32.lesson03.teach.suggest_neg:
    title: Suggérer ce qu’il ne faut pas faire
    gloss: Je te suggère de ne pas dépenser beaucoup d’argent.
    note: 'Après *پیشنهاد می‌کنم که*, emploie le subjonctif négatif pour ce qu’il ne faut pas faire : *نکنی* de *کردن*, *نخری* de *خریدن*. La partie *می‌کنم* reste positive : tu suggères, et ce que tu suggères est négatif.'
  prs.a2.unit32.lesson03.teach.expensive_things:
    title: Ne pas acheter de choses chères
    gloss: Je te suggère de ne pas acheter de choses chères.
    note: '*چیزهای گران* signifie « des choses chères » : le pluriel de *چیز* est *چیزها*, et un *-ی* de liaison l’unit à l’adjectif qui suit. *نخری* est le négatif de *بخری* (que tu achètes), de *خریدن*.'
  prs.a2.unit32.lesson04.teach.what_do:
    title: Que dois-je faire ?
    gloss: Que dois-je faire ?
    note: 'Pour demander conseil, on emploie aussi le subjonctif : *چه کار کنم؟* signifie « que dois-je faire ? » (et non « que fais-je ? »). Le pluriel est *چه کار کنیم؟* (que devons-nous faire ?). Dis d’abord le problème, puis demande : *سرم درد می‌کند. چه کار کنم؟*'
  prs.a2.unit32.lesson04.teach.your_view:
    title: À une personne que l’on respecte
    gloss: À ton avis, que dois-je faire ?
    note: '*به نظر شما* signifie « à votre avis ». Avec une personne âgée ou un inconnu, c’est la façon polie de demander conseil : *به نظر شما چه کار کنم؟*. L’autre personne peut alors répondre avec *بهتر است که* ou *پیشنهاد می‌کنم که*.'
  prs.a2.unit32.lesson04.teach.what_suggest:
    title: Que suggérez-vous ?
    gloss: Que suggérez-vous ?
    note: '*شما چه پیشنهاد می‌کنین؟* demande à une personne que l’on respecte ce qu’elle suggère. On y trouve la terminaison *-ین* de *شما*. Avec un ami, on dit *تو چه پیشنهاد می‌کنی؟*.'
  prs.a2.unit32.lesson04.teach.accept:
    title: Accepter le conseil
    gloss: C’est une bonne idée. Je vais faire exactement cela.
    note: '*فکر خوبی است* signifie « c’est une bonne idée ». *همین کار را می‌کنم* signifie « je vais faire exactement cela ». Le présent *می‌کنم* sert aussi à dire ce que l’on décide de faire. Emploie ces deux phrases quand tu veux suivre le conseil.'
  prs.a2.unit32.lesson04.teach.thanks:
    title: Remercier pour le conseil
    gloss: Merci pour ta suggestion.
    note: '*از پیشنهادت ممنون* signifie « merci pour ta suggestion ». *پیشنهادت* est *پیشنهاد* avec *-ت*, « ton/ta ». C’est une façon amicale de terminer la conversation après un conseil.'
  prs.a2.unit32.lesson04.teach.decline:
    title: Dire que l’on ne peut pas
    gloss: Je ne peux pas, parce que je n’ai pas le temps.
    note: 'Quand tu ne peux pas suivre le conseil, dis-le et donne la raison : *نمی‌توانم، چون وقت ندارم* signifie « je ne peux pas, parce que je n’ai pas le temps ». *می‌توانم* signifie « je peux », et *نمی‌توانم* « je ne peux pas ». La raison vient après *چون*.'
  prs.a2.unit32.lesson04.teach.maybe:
    title: Un conseil plus doux avec شاید et le subjonctif de بودن
    gloss: Peut-être vaudrait-il mieux que tu te reposes. Peut-être que c’est juste.
    note: '*شاید* (peut-être) est suivi du subjonctif. Le subjonctif de *بودن* est *باشم، باشی، باشد، باشیم، باشین، باشند*. Ainsi, *شاید بهتر باشد که استراحت کنی* signifie « peut-être vaudrait-il mieux que tu te reposes » : un conseil très doux. Tu peux aussi réagir à un conseil avec *شاید درست باشد* (peut-être que c’est juste) quand tu n’es pas encore sûr. *ممکن است درست باشد* (cela peut être juste) a presque le même sens.'
  prs.a2.unit32.lesson04.teach.agree:
    title: Être d’accord
    gloss: C’est juste. Je vais faire exactement cela.
    note: '*درست است* signifie « c’est juste ». Après un conseil, cela veut dire que tu es d’accord. Avec *همین کار را می‌کنم*, c’est un oui clair.'
  prs.a2.unit32.lesson05.teach.three:
    title: Trois
    gloss: trois
    note: '*سه* signifie trois. *سه روز* signifie trois jours. Un médecin dit souvent combien de jours de repos il te faut.'
    example_gloss: J’ai été à Kaboul pendant trois jours.
  prs.a2.unit32.lesson05.teach.said:
    title: Il ou elle a dit
    gloss: il ou elle a dit
    note: '*گفت* est le passé de *گفتن* (dire) pour « il » ou « elle ». Après *گفت*, une courte phrase suit, comme dans *داکتر گفت: ...* (le médecin a dit : ...).'
    example_gloss: 'Il a dit : je viens demain.'
  prs.a2.unit32.lesson05.teach.please_wait:
    title: Attendre, être patient
    gloss: attendre, être patient
    note: '*صبر کردن* signifie attendre ou être patient. *نباید صبر کنی* signifie « tu ne dois pas attendre », c’est-à-dire « fais-le tout de suite ».'
    example_gloss: Attends un peu.
  prs.a2.unit32.lesson05.teach.dlg1_turn01:
    title: Jamila dit ce qui ne va pas
    gloss: Zakaria, j’ai mal à la tête et je ne dors pas bien la nuit. Que dois-je faire ?
    note: Jamila décrit son problème avec *سرم درد می‌کند* et *خوب نمی‌خوابم* (je ne dors pas bien), puis demande conseil avec *چه کار کنم؟*.
  prs.a2.unit32.lesson05.teach.dlg1_turn02:
    title: Zakaria donne deux conseils
    gloss: Il vaut mieux que tu ailles chez le médecin. Tu dois boire beaucoup d’eau.
    note: Zakaria emploie d’abord le doux *بهتر است که به داکتر بروی*, puis le plus ferme *باید آب زیاد بخوری*. Il parle à une amie, donc la terminaison est *-ی*.
  prs.a2.unit32.lesson05.teach.dlg1_turn03:
    title: Jamila accepte et prévoit demain
    gloss: C’est une bonne idée. Demain, j’irai chez le médecin.
    note: 'Jamila accepte avec *فکر خوبی است*. Elle prévoit d’y aller demain : *فردا به داکتر می‌روم*, le présent avec un mot de temps.'
  prs.a2.unit32.lesson05.teach.dlg1_turn04:
    title: Zakaria dit d’y aller aujourd’hui
    gloss: Je te suggère d’y aller aujourd’hui. Tu ne dois pas attendre.
    note: 'Zakaria dit que c’est urgent : *پیشنهاد می‌کنم که امروز بروی*, et avec *نباید صبر کنی* il ajoute « n’attends pas ». Remarque qu’il ne répète pas *به داکتر*, parce que c’est clair.'
  prs.a2.unit32.lesson05.teach.dlg1_turn05:
    title: Jamila est d’accord
    gloss: Très bien, j’irai aujourd’hui. Merci.
    note: 'Jamila change son projet pour aujourd’hui : *امروز می‌روم*. Elle termine poliment par *ممنون*.'
  prs.a2.unit32.lesson05.teach.message:
    title: Un message après la visite chez le médecin
    gloss: 'Bonjour Zakaria. Merci pour ton conseil. Aujourd’hui, je suis allée chez le médecin. Le médecin a dit : il vaut mieux que tu te reposes trois jours, et tu dois prendre des médicaments. Tu ne dois pas te coucher tard le soir. Demain, je n’irai pas à l’école.'
    note: 'Jamila écrit le message suivant. Le médecin a donné ses conseils avec trois structures : *بهتر است که* (se reposer trois jours), *باید* (prendre des médicaments) et *نباید* (ne pas se coucher tard). Les conseils sont rapportés après *گفت:* sous la même forme.'
  prs.a2.unit32.lesson06.teach.start:
    title: Commencer
    gloss: commencer, débuter
    note: '*شروع کردن* signifie commencer. *از امروز شروع می‌کنم* veut dire « je commence dès aujourd’hui », une promesse que l’on fait après avoir accepté un conseil.'
    example_gloss: Je commence à partir de demain.
  prs.a2.unit32.lesson06.teach.only:
    title: Seulement, juste
    gloss: seulement, juste
    note: '*فقط* signifie « seulement » ou « juste ». *فقط چیزهای مهم* veut dire « seulement les choses importantes ».'
    example_gloss: Je n’ai qu’un seul livre.
  prs.a2.unit32.lesson06.teach.dlg2_turn01:
    title: Zakaria explique son problème
    gloss: Jamila, je n’ai pas beaucoup d’argent et je dépense beaucoup chaque mois. Que dois-je faire ?
    note: 'Zakaria expose son problème en deux parties : *پولم کم است* et *هر ماه زیاد خرج می‌کنم*. Puis il demande conseil : *چه کار کنم؟*.'
  prs.a2.unit32.lesson06.teach.dlg2_turn02:
    title: Jamila suggère d’économiser
    gloss: Je te suggère d’économiser un peu d’argent chaque mois.
    note: Jamila emploie la formule polie *پیشنهاد می‌کنم که* suivie du subjonctif *پس‌انداز کنی*. *کمی* signifie « un peu ».
  prs.a2.unit32.lesson06.teach.dlg2_turn03:
    title: Zakaria dit qu’il ne peut pas
    gloss: C’est une bonne idée, mais je ne peux pas. Tout est cher.
    note: 'Zakaria dit que l’idée est bonne, mais il donne une raison pour laquelle il ne peut pas la suivre : *همه چیز گران است* (tout est cher).'
  prs.a2.unit32.lesson06.teach.dlg2_turn04:
    title: Jamila conseille ce qu’il ne faut pas acheter
    gloss: Alors tu ne dois pas acheter de choses chères. Il vaut mieux que tu n’achètes que des choses importantes.
    note: 'Jamila nuance son conseil : *نباید چیزهای گران بخری* (une règle ferme) et *بهتر است که فقط چیزهای مهم بخری* (une suggestion douce).'
  prs.a2.unit32.lesson06.teach.dlg2_turn05:
    title: Zakaria est d’accord et commence
    gloss: C’est vrai. Je commence dès aujourd’hui. Merci.
    note: 'Zakaria approuve avec *درست است* et fait une promesse : *از امروز شروع می‌کنم*.'
