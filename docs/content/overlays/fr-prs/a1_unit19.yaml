course:
  title: Dari A1
  description: 'Dari de Kaboul pour débutants : les pièces de base (chambre, cuisine, salle de bain), les objets de la maison (table, chaise, lit, fenêtre), associer quantité et lieu, lire une courte puis une plus longue description d’une maison, et un dialogue pour s’informer sur le logement de quelqu’un.'
units:
  prs.a1.unit19.housing:
    title: Le logement
    description: 'Décrire une maison simple : pièces, objets et emplacement.'
lessons:
  prs.a1.unit19.lesson01.room_words:
    title: Les pièces
  prs.a1.unit19.lesson02.object_words:
    title: Les objets de la maison
  prs.a1.unit19.lesson03.quantity_and_location:
    title: Quantité et emplacement
  prs.a1.unit19.lesson04.reading_a_home_description:
    title: Lire la description d’une maison
  prs.a1.unit19.lesson05.reading_a_longer_description:
    title: Lire une description plus longue d’une maison
  prs.a1.unit19.lesson06.home_dialogue:
    title: Un dialogue sur le logement de quelqu’un
teaching:
  prs.a1.unit19.lesson01.teach.house_word:
    title: Maison / chez-soi
    gloss: maison
    note: خانه signifie maison ou chez-soi.
    example_gloss: J’ai une maison.
  prs.a1.unit19.lesson01.teach.room_word:
    title: Pièce
    gloss: pièce
    note: اتاق signifie pièce.
    example_gloss: J’ai une chambre.
  prs.a1.unit19.lesson01.teach.sleep_word:
    title: Dormir
    gloss: sommeil
    note: خواب signifie sommeil ; اتاق خواب signifie littéralement « pièce de sommeil », c’est-à-dire chambre.
    example_gloss: J’ai une chambre.
  prs.a1.unit19.lesson01.teach.kitchen_word:
    title: Cuisine
    gloss: cuisine
    note: آشپزخانه signifie cuisine.
    example_gloss: J’ai une cuisine.
  prs.a1.unit19.lesson01.teach.bathroom_word:
    title: Salle de bain
    gloss: salle de bains
    note: تشناب est le terme courant en dari afghan pour salle de bain/toilettes, différent du دستشویی du persan d’Iran.
    example_gloss: J’ai une salle de bains.
  prs.a1.unit19.lesson01.teach.have_word:
    title: J’ai
    gloss: j’ai
    note: دارم est la première personne du présent de داشتن (avoir).
    target_text: دارم (j’ai)
  prs.a1.unit19.lesson02.teach.table_word:
    title: Table
    gloss: table
    note: میز signifie table.
    example_gloss: J’ai une table.
  prs.a1.unit19.lesson02.teach.chair_word:
    title: Chaise
    gloss: chaise
    note: چوکی est le terme courant en dari afghan pour chaise, différent du صندلی du persan d’Iran.
    example_gloss: J’ai une chaise.
  prs.a1.unit19.lesson02.teach.bed_word:
    title: Lit
    gloss: lit
    note: تخت signifie lit.
    example_gloss: J’ai un lit.
  prs.a1.unit19.lesson02.teach.window_word:
    title: Fenêtre
    gloss: fenêtre
    note: کلکین est le terme courant en dari afghan pour fenêtre, différent du پنجره du persan d’Iran.
    example_gloss: J’ai une fenêtre.
  prs.a1.unit19.lesson03.teach.two_word:
    title: Deux
    gloss: deux
    note: دو signifie deux.
    example_gloss: J’ai deux pièces.
  prs.a1.unit19.lesson03.teach.three_word:
    title: Trois
    gloss: trois
    note: سه signifie trois.
    example_gloss: J’ai trois pièces.
  prs.a1.unit19.lesson03.teach.near_word:
    title: Près de
    gloss: près de
    note: نزدیک signifie près de.
    example_gloss: La table est près de la fenêtre.
  prs.a1.unit19.lesson03.teach.is_word:
    title: Est
    gloss: est
    note: 'است est la copule : میز نزدیک کلکین است signifie « la table est près de la fenêtre ».'
    target_text: است (est)
  prs.a1.unit19.lesson04.teach.this_word:
    title: Ce / cette / ceci
    gloss: ce / cette
    note: این signifie ce / cette / ceci.
    target_text: این (ce / cette / ceci)
  prs.a1.unit19.lesson04.teach.has_word:
    title: Il/elle a
    gloss: il/elle a
    note: دارد est la troisième personne du présent de داشتن (avoir).
    target_text: دارد (il/elle a -- 3e personne)
  prs.a1.unit19.lesson04.teach.one_word:
    title: Un
    gloss: un
    note: یک signifie un / une.
    example_gloss: J’ai une cuisine.
  prs.a1.unit19.lesson04.teach.and_word:
    title: Et
    gloss: et
    note: و signifie et ; il relie deux propositions ou deux éléments.
    target_text: و (et)
  prs.a1.unit19.lesson04.teach.description_text:
    title: Une courte description de maison
    gloss: Cette maison a deux chambres. Elle a une cuisine et une salle de bain.
    note: Une courte description à la troisième personne, indiquant le nombre de pièces.
  prs.a1.unit19.lesson05.teach.big_word:
    title: Grand
    gloss: grand
    note: بزرگ signifie grand, déjà vu dans cette formation avec son comparatif بزرگ‌تر dans l’unité sur les comparaisons.
    example_gloss: La cuisine est grande.
  prs.a1.unit19.lesson05.teach.across_from_word:
    title: En face de
    gloss: en face de
    note: مقابل signifie en face de ou à l’opposé de.
    target_text: مقابل (en face de)
  prs.a1.unit19.lesson05.teach.longer_description_text:
    title: Une description de maison plus longue
    gloss: Cette maison a deux chambres. Elle a une cuisine et une salle de bain. La cuisine est grande. La table est en face de la fenêtre.
    note: La même description que dans la leçon précédente, enrichie d’informations sur la taille et l’emplacement.
  prs.a1.unit19.lesson06.teach.names:
    title: Laila et Feridoon
    gloss: Laila, Feridoon
    note: Personnages récurrents de cette formation.
    example_gloss:
    - Je suis Laila.
    - Je suis Feridoon.
  prs.a1.unit19.lesson06.teach.you_word:
    title: Vous (politesse)
    gloss: vous
    note: شما est le pronom de politesse de la deuxième personne.
    target_text: شما (vous -- politesse)
  prs.a1.unit19.lesson06.teach.how_many_word:
    title: Combien
    gloss: combien
    note: چند signifie combien.
    target_text: چند (combien)
  prs.a1.unit19.lesson06.teach.yes_word:
    title: Oui
    gloss: oui
    note: بلی est le mot poli/formel pour « oui », en accord avec le registre de cette formation.
    example_gloss: Oui, elle est grande.
  prs.a1.unit19.lesson06.teach.dialogue_line1:
    title: Feridoon demande
    gloss: Combien de pièces votre maison a-t-elle ?
  prs.a1.unit19.lesson06.teach.dialogue_line2:
    title: Laila répond
    gloss: Elle a deux chambres.
  prs.a1.unit19.lesson06.teach.dialogue_line3:
    title: Feridoon demande
    gloss: La cuisine est-elle grande ?
  prs.a1.unit19.lesson06.teach.dialogue_line4:
    title: Laila répond
    gloss: Oui, elle est grande.
