course:
  title: Dari A1
  description: 'Dari de Kaboul pour débutants : vocabulaire de l’argent et du paiement, demander le mode de paiement, change de devises chez un صرافی (changeur) et dialogue entre Zarmina et Homayoun pour changer des dollars en afghanis.'
units:
  prs.a1.unit23.money:
    title: L’argent
    description: 'Savoir se débrouiller avec l’argent au quotidien : changer de l’argent, payer et demander le mode de paiement.'
lessons:
  prs.a1.unit23.lesson01.money_vocabulary:
    title: Les mots de l’argent
  prs.a1.unit23.lesson02.payment_method:
    title: Mode de paiement
  prs.a1.unit23.lesson03.currency_exchange:
    title: Change de devises
  prs.a1.unit23.lesson04.exchange_dialogue:
    title: Chez le changeur
  prs.a1.unit23.lesson05.reading_receipt:
    title: Lire un ticket de caisse
  prs.a1.unit23.lesson06.wrap_up:
    title: Récapitulatif
teaching:
  prs.a1.unit23.lesson01.teach.pul:
    title: L’argent
    gloss: l’argent
    note: پول signifie « argent ».
    example_gloss: J’ai de l’argent.
  prs.a1.unit23.lesson01.teach.naqd:
    title: Espèces
    gloss: en espèces
    note: نقد signifie « espèces, liquide ».
    example_gloss: Je paie en espèces.
  prs.a1.unit23.lesson01.teach.kart:
    title: Carte
    gloss: carte
    note: کارت signifie « carte » (carte de paiement).
    example_gloss: J’ai une carte.
  prs.a1.unit23.lesson01.teach.dollar:
    title: Dollar
    gloss: dollar
    note: دالر signifie « dollar » (USD) -- très utilisé et coté à côté de l’afghani dans le change quotidien en Afghanistan.
    example_gloss: J’ai cent dollars.
  prs.a1.unit23.lesson01.teach.review_dorom:
    title: J’ai
    gloss: j’ai
    note: دارم signifie « j’ai » (déjà vu dans l’unité 10, les achats).
    example_gloss: J’ai de l’argent.
  prs.a1.unit23.lesson01.teach.review_sad:
    title: Cent
    gloss: cent
    note: صد signifie « cent » -- déjà vu dans l’unité 4 (les nombres) et réutilisé dans l’unité 10 (les achats).
    example_gloss: J’ai cent dollars.
  prs.a1.unit23.lesson02.teach.mipardazam:
    title: Je paie
    gloss: je paie
    note: می‌پردازم signifie « je paie ».
    example_gloss: Je paie en espèces.
  prs.a1.unit23.lesson02.teach.ya:
    title: Ou
    gloss: ou
    note: یا signifie « ou ».
    example_gloss: Je paie en espèces ou par carte.
  prs.a1.unit23.lesson02.teach.naqdi_ya_karti:
    title: Espèces ou carte ?
    gloss: Vous payez en espèces ou par carte ?
    note: Une question courante dans un magasin ou à un guichet de change.
  prs.a1.unit23.lesson02.teach.review_mitanom:
    title: Je peux
    gloss: je peux
    note: می‌توانم signifie « je peux » (déjà vu plus tôt dans le cours).
    example_gloss: Je peux payer en espèces.
  prs.a1.unit23.lesson02.teach.bepardazam:
    title: Payer
    gloss: payer
    note: بپردازم est la forme du subjonctif de « payer », employée après می‌توانم (je peux) -- می‌توانم نقد بپردازم signifie littéralement « je peux payer en espèces ».
    example_gloss: Je peux payer en espèces.
  prs.a1.unit23.lesson03.teach.sarafi:
    title: Changeur
    gloss: changeur
    note: صرافی est l’établissement courant et bien réel où l’on change de l’argent en Afghanistan -- à distinguer d’une بانک (banque) officielle.
    example_gloss: Je vais chez le changeur.
  prs.a1.unit23.lesson03.teach.tabdil_kardan:
    title: Changer (de l’argent)
    gloss: changer (de l’argent)
    note: تبدیل کردن signifie « changer » (de la monnaie).
    example_gloss: Je change des dollars en afghanis.
  prs.a1.unit23.lesson03.teach.narkh:
    title: Taux de change
    gloss: taux de change
    note: نرخ signifie « taux, taux de change ».
    example_gloss: Quel est le taux du dollar aujourd’hui ?
  prs.a1.unit23.lesson03.teach.narkh_chand_ast:
    title: Quel est le taux aujourd’hui ?
    gloss: Quel est le taux du dollar aujourd’hui ?
    note: La façon habituelle de demander le taux de change.
  prs.a1.unit23.lesson03.teach.review_afghani:
    title: Afghani
    gloss: afghani
    note: افغانی est la monnaie de l’Afghanistan (déjà vu dans l’unité 10, les achats, par ex. « صد افغانی »).
    example_gloss: J’ai cent afghanis.
  prs.a1.unit23.lesson03.teach.review_ast_emroz_chand:
    title: 'Révision : est, aujourd’hui, combien'
    gloss: est / aujourd’hui / combien
    note: است, امروز et چند sont des mots de révision (déjà vus plus tôt dans le cours), réunis dans la question sur le taux de cette leçon.
    example_gloss: Quel est le taux du dollar aujourd’hui ?
  prs.a1.unit23.lesson03.teach.review_ba_ra_mikonam:
    title: 'Révision : à, marqueur d’objet, je fais, faire, je veux'
    gloss: à / marqueur d’objet / je fais / faire / je veux
    note: به, را, می‌کنم, کنم et می‌خواهم sont des mots de révision (déjà vus plus tôt dans le cours), réunis dans les phrases d’échange de cette leçon.
    example_gloss: Je veux changer des dollars en afghanis.
  prs.a1.unit23.lesson04.teach.review_mikhaham:
    title: je veux
    gloss: je veux
    note: می‌خواهم signifie « je veux » (déjà vu dans les unités précédentes).
    example_gloss: Je veux changer des dollars.
  prs.a1.unit23.lesson04.teach.chand_darin:
    title: Combien en avez-vous ?
    gloss: Combien de dollars avez-vous ?
    note: دارین est la forme de politesse/du pluriel de « avoir », qui s’adresse au client.
  prs.a1.unit23.lesson04.teach.bufarmayin:
    title: Voici
    gloss: voici, tenez
    note: بفرمایین est une formule de politesse employée quand on tend quelque chose.
    example_gloss: Tenez, sept mille afghanis.
  prs.a1.unit23.lesson04.teach.hazar:
    title: Mille
    gloss: mille
    note: هزار signifie « mille ».
    example_gloss: Sept mille afghanis.
  prs.a1.unit23.lesson04.teach.review_zarmina:
    title: Zarmina
    gloss: Zarmina
    note: زرمینه, personnage récurrent du cours.
    example_gloss: Zarmina va chez le changeur.
  prs.a1.unit23.lesson04.teach.review_besyar_khub:
    title: Très bien
    gloss: très bien
    note: بسیار خوب, déjà vu, est employé ici pour accepter une offre.
    example_gloss: Très bien, merci.
  prs.a1.unit23.lesson04.teach.review_haftad_tashakor_kard:
    title: 'Révision : soixante-dix, merci, a fait'
    gloss: soixante-dix / merci / a fait (il/elle)
    note: هفتاد et تشکر sont des mots de révision ; کرد est la 3e personne du passé de کردن (faire), déjà employée dans la leçon sur le passé de l’unité 20 -- réunis ici pour résumer l’échange.
    example_gloss: Zarmina a changé cent dollars en afghanis.
  prs.a1.unit23.lesson04.teach.turn01:
    title: 'Zarmina : Bonjour, je veux changer des dollars en afghanis.'
    gloss: Bonjour, je veux changer des dollars en afghanis.
  prs.a1.unit23.lesson04.teach.turn02:
    title: 'Le changeur : Combien de dollars avez-vous ?'
    gloss: Combien de dollars avez-vous ?
  prs.a1.unit23.lesson04.teach.turn03:
    title: 'Zarmina : J’ai cent dollars. Quel est le taux aujourd’hui ?'
    gloss: J’ai cent dollars. Quel est le taux aujourd’hui ?
  prs.a1.unit23.lesson04.teach.turn04:
    title: 'Le changeur : Aujourd’hui, un dollar vaut soixante-dix afghanis.'
    gloss: Aujourd’hui, un dollar vaut soixante-dix afghanis.
  prs.a1.unit23.lesson04.teach.turn05:
    title: 'Zarmina : Très bien, changez-les, s’il vous plaît.'
    gloss: Très bien, changez-les, s’il vous plaît.
    note: 'تبدیل کنین est l’impératif poli : « (s’il vous plaît) changez ».'
  prs.a1.unit23.lesson04.teach.turn06:
    title: 'Le changeur : Voici, sept mille afghanis.'
    gloss: Voici, sept mille afghanis.
  prs.a1.unit23.lesson04.teach.turn07:
    title: 'Zarmina : Merci.'
    gloss: Merci.
  prs.a1.unit23.lesson05.teach.rasid:
    title: Reçu
    gloss: reçu
    note: رسید signifie « reçu ».
    example_gloss: Je prends un reçu.
  prs.a1.unit23.lesson05.teach.migiram:
    title: Je prends / je reçois
    gloss: je prends / je reçois
    note: می‌گیرم signifie « je prends / je reçois ».
    example_gloss: Je prends l’argent.
  prs.a1.unit23.lesson05.teach.reading_text:
    title: Texte à lire
    gloss: Zarmina est allée chez le changeur. Elle avait cent dollars et voulait les changer en afghanis. Le taux du jour était de soixante-dix afghanis. Zarmina a reçu sept mille afghanis et a pris un reçu.
  prs.a1.unit23.lesson05.teach.review_raft:
    title: Est allé(e)
    gloss: est allé
    note: رفت est le passé « est allé(e) » (il/elle).
    example_gloss: Zarmina est allée chez le changeur.
  prs.a1.unit23.lesson05.teach.review_haft_gereft:
    title: 'Révision : sept, a pris/a reçu (il/elle), j’ai pris/j’ai reçu'
    gloss: sept / a pris, a reçu (il/elle) / j’ai pris, j’ai reçu
    note: هفت est un nombre déjà vu ; گرفت et گرفتم sont le passé de la 3e personne et de la 1re personne de گرفتن (prendre, recevoir), employés ici pour la somme que Zarmina a reçue.
    example_gloss: Zarmina a reçu sept mille afghanis.
  prs.a1.unit23.lesson06.teach.review_summary:
    title: Résumé final
    gloss: 'J’ai de l’argent : des espèces et une carte. Je peux changer des dollars en afghanis chez le changeur. Le taux du jour est de soixante-dix afghanis pour un dollar.'
  prs.a1.unit23.lesson06.teach.review_bara:
    title: Pour
    gloss: pour
    note: برای signifie « pour ».
    example_gloss: Soixante-dix afghanis pour un dollar.
  prs.a1.unit23.lesson06.teach.review_va:
    title: Et
    gloss: et
    note: و signifie « et » ; tu l’as déjà vu dans les unités précédentes.
    example_gloss: 'J’ai de l’argent : des espèces et une carte.'
