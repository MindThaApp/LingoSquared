  prs.a1.unit57.lesson01.teach.beach_word:
    title: La plage
    gloss: plage / rivage
    note: '*ساحل* est le mot standard, en dari comme en persan, pour désigner une plage, un rivage ou une côte. Comme l’Afghanistan n’a pas d’accès à la mer, ce cours l’emploie pour la rive sablonneuse d’un lac ou d’une rivière, un lieu de sortie réel et très courant.'
