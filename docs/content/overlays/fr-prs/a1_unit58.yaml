teaching:
  prs.a1.unit58.lesson01.teach.review_this_is_in_good:
    title: 'Révision : ceci, est, dans, bon'
    gloss: ceci / est / dans / bon
    note: Ce sont des mots de révision pour parler du zoo.
    target_text: این (ceci) / است (est) / در (dans) / خوب (bon)
  prs.a1.unit58.lesson01.teach.zoo_word:
    title: Le zoo
    gloss: zoo
    note: '*باغ وحش* (littéralement « jardin des bêtes sauvages ») est le mot standard en dari comme en persan pour désigner un zoo ; c’est le mot courant.'
    example_gloss: Ce zoo est beau.
  prs.a1.unit58.lesson01.teach.lion_word:
    title: Le lion
    gloss: lion
    note: '*شیر* est le mot standard en dari comme en persan pour lion. Attention : dans un autre contexte, c’est aussi le mot pour « lait ». Dans ce cours, il n’apparaît ici que dans des contextes de zoo ou d’animaux, sans ambiguïté.'
    example_gloss: Le lion est au zoo.
  prs.a1.unit58.lesson01.teach.zoo_is_nice_phrase:
    title: Ce zoo est beau
    gloss: Ce zoo est beau.
    note: Cette phrase combine « zoo » et « bien ».
  prs.a1.unit58.lesson01.teach.lion_at_zoo_phrase:
    title: Le lion est au zoo
    gloss: Le lion est au zoo.
  prs.a1.unit58.lesson02.teach.review_zoo_open_closed_is:
    title: 'Révision : zoo, ouvert, fermé, est'
    gloss: zoo / ouvert / fermé / est
    note: Ce sont des mots de révision pour lire les horaires d’ouverture du zoo.
    target_text: باغ وحش (zoo) / باز (ouvert) / بسته (fermé) / است (est)
  prs.a1.unit58.lesson02.teach.review_hours_words:
