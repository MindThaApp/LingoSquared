  prs.a1.unit32.lesson03.invitation_phrase:
    title: Invitation à une fête
  prs.a1.unit32.lesson04.celebration_dialogue:
    title: 'Dialogue : la fête d’anniversaire'
  prs.a1.unit32.lesson05.reading_celebration:
    title: Lecture sur une fête
  prs.a1.unit32.lesson06.wrap_up:
    title: Récapitulatif
teaching:
  prs.a1.unit32.lesson01.teach.birthday_word:
    title: Anniversaire
    gloss: anniversaire
    note: تولد signifie « anniversaire », le mot central de cette unité.
    example_gloss: Mon anniversaire est en Hamal.
  prs.a1.unit32.lesson01.teach.celebration_word:
    title: La fête
    gloss: fête / célébration
    note: جشن signifie « fête » ou « célébration ».
    example_gloss: Notre fête est grande.
  prs.a1.unit32.lesson01.teach.cake_word:
    title: Le gâteau
    gloss: gâteau
    note: کیک signifie « gâteau » ; c’est un emprunt courant, commun au persan et au dari.
    example_gloss: Le gâteau est délicieux.
  prs.a1.unit32.lesson01.teach.gift_word:
    title: Le cadeau
    gloss: cadeau
    note: هدیه signifie « cadeau », un mot courant du dari et du persan (on emploie aussi تحفه).
    example_gloss: Ce cadeau est pour vous.
  prs.a1.unit32.lesson01.teach.congratulations_word:
    title: Les félicitations
    gloss: félicitations
    note: تبریک signifie « félicitations » ; on l’emploie avec می‌گویم (je dis) dans l’expression courante تبریک می‌گویم (je vous félicite).
    example_gloss: Félicitations !
  prs.a1.unit32.lesson01.teach.review_mubarak:
    title: Joyeux anniversaire (formation)
    gloss: ton anniversaire (familier) + béni → Joyeux anniversaire
    note: تولدت associe تولد (anniversaire) au suffixe familier « ton » -ت ; مبارک signifie « béni » ou « heureux ». Ensemble, تولدت مبارک est la formule habituelle pour souhaiter un joyeux anniversaire en dari et en persan.
    target_text: تولدت (ton anniversaire, informel) + مبارک (béni) = تولدت مبارک (Joyeux anniversaire)
  prs.a1.unit32.lesson01.teach.happy_birthday_phrase:
    title: Joyeux anniversaire !
    gloss: Joyeux anniversaire !
    note: La formule authentique et très répandue en dari et en persan pour souhaiter un joyeux anniversaire (تولدتان مبارک est la variante de registre soutenu, non testée dans les exercices de cette unité).
  prs.a1.unit32.lesson02.teach.review_shoma_dar_ast:
    title: Vous / dans-à / est
    gloss: vous (politesse) / dans-à / est
    note: شما (vous, politesse), در (dans, à) et است (est) sont déjà connus des unités précédentes.
    target_text: شما (vous, formel) / در (dans/à) / است (est)
  prs.a1.unit32.lesson02.teach.review_man_kodam:
    title: Je / quel
    gloss: je / quel
    note: من (je) et کدام (quel) sont déjà connus des unités précédentes.
    target_text: من (je/moi) / کدام (quel)
  prs.a1.unit32.lesson02.teach.month_word:
    title: Le mois
    gloss: mois
    note: ماه signifie « mois » ; c’est un mot vraiment nouveau dans ce cours.
    example_gloss: Ce mois est chaud.
  prs.a1.unit32.lesson02.teach.review_hamal:
    title: Hamal
    gloss: Hamal (le premier mois)
    note: حمل est le premier mois du calendrier solaire hégirien.
    target_text: حمل (Hamal, le premier mois)
  prs.a1.unit32.lesson02.teach.question_which_month:
    title: Votre anniversaire est en quel mois ?
    gloss: Votre anniversaire est en quel mois ?
    note: Réunit تولد (anniversaire, déjà vu), شما (vous, politesse, déjà vu), در (dans, déjà vu), کدام (quel, déjà vu) et ماه (mois).
  prs.a1.unit32.lesson02.teach.answer_hamal:
    title: Mon anniversaire est en Hamal
    gloss: Mon anniversaire est en Hamal.
    note: Réunit la construction تولد من در ... است (mon anniversaire est en ..., déjà vue) et حمل (Hamal).
  prs.a1.unit32.lesson03.teach.review_dawat_mehmani:
    title: Invitation / fête
    gloss: invitation / fête
    note: دعوت et مهمانی sont présentés à nouveau ici, selon la règle de vocabulaire propre à chaque leçon de ce cours.
    target_text: دعوت (invitation) / مهمانی (fête)
  prs.a1.unit32.lesson03.teach.review_ra_ba:
    title: Marque de l’objet / à
    gloss: marqueur d’objet / à, vers
    note: را (marqueur d’objet) et به (à, vers) sont deux mots-outils déjà vus, que l’on révise ici.
    target_text: را (marque de l’objet) / به (à / vers)
  prs.a1.unit32.lesson03.teach.review_mikonam:
    title: Je fais
    gloss: je fais → j’invite
    note: می‌کنم (je fais, déjà vu) se combine avec دعوت pour former le verbe composé دعوت می‌کنم (j’invite).
    target_text: می‌کنم (je fais) — دعوت می‌کنم (j’invite)
  prs.a1.unit32.lesson03.teach.invite_sentence:
    title: Je vous invite à la fête d’anniversaire
    gloss: Je vous invite à la fête d’anniversaire.
    note: Cette phrase combine la construction من ... را به ... دعوت می‌کنم (j’invite ... à ..., déjà vue) avec جشن تولد (fête d’anniversaire).
  prs.a1.unit32.lesson03.teach.review_miyayin:
    title: Viendrez-vous ? (formel)
    gloss: viendrez-vous ? (forme de politesse)
    note: می‌آیین suit le modèle de terminaison verbale de politesse en -ین, déjà vu avec استین, می‌خوانین et می‌کنین.
    target_text: می‌آیین؟ (viendrez-vous ? formel)
  prs.a1.unit32.lesson03.teach.will_you_come_question:
    title: Vous viendrez ?
    gloss: Vous viendrez ?
    note: Cette phrase combine شما (vous, forme de politesse, déjà vu) avec می‌آیین.
  prs.a1.unit32.lesson04.teach.review_time_words:
    title: Vendredi / heure / combien / sept
    gloss: vendredi / heure, … heures / combien, quel / sept
    note: جمعه, ساعت, چند et هفت ont déjà été vus dans les unités précédentes (jours et heure).
    target_text: جمعه (vendredi) / ساعت (heure) / چند (combien / quel) / هفت (sept)
  prs.a1.unit32.lesson04.teach.review_informal_come:
    title: Toi (informel) / tu viens / je viens / oui / très bien / merci beaucoup
    gloss: tu / tu viens / je viens / oui / très bien / merci beaucoup
    note: تو, می‌آیی, می‌آیم, بلی, بسیار خوب et تشکر زیاد ont déjà été vus ; on les regroupe ici pour le registre familier du dialogue.
    target_text: تو (toi, informel) / می‌آیی (tu viens, informel) / می‌آیم (je viens) / بلی (oui) / بسیار خوب (très bien) / تشکر زیاد (merci beaucoup)
  prs.a1.unit32.lesson04.teach.dialogue_line1:
    title: 'Basir : Maryam, vendredi, c’est ma fête d’anniversaire. Tu viens ?'
    gloss: Maryam, vendredi, c’est ma fête d’anniversaire. Tu viens ?
  prs.a1.unit32.lesson04.teach.dialogue_line2:
    title: 'Maryam : Oui, je viens ! Vendredi, à quelle heure ?'
    gloss: Oui, je viens ! Vendredi, à quelle heure ?
  prs.a1.unit32.lesson04.teach.dialogue_line3:
    title: 'Basir : À sept heures.'
    gloss: À sept heures.
  prs.a1.unit32.lesson04.teach.dialogue_line4:
    title: 'Maryam : Très bien. Joyeux anniversaire, Basir !'
    gloss: Très bien. Joyeux anniversaire, Basir !
  prs.a1.unit32.lesson04.teach.dialogue_line5:
    title: 'Basir : Merci beaucoup !'
    gloss: Merci beaucoup !
  prs.a1.unit32.lesson05.teach.happy_word:
    title: Heureux
    gloss: heureux
    note: خوشحال signifie « content ».
    example_gloss: Il/Elle est content(e).
  prs.a1.unit32.lesson05.teach.review_u_yak:
    title: Il/elle / un, une
    gloss: il/elle / un, une
    note: او (il/elle, vu dans l’unité 31) et یک (un/une, vu dans l’unité 4) sont rappelés ici.
    target_text: او (il / elle) / یک (un / une)
  prs.a1.unit32.lesson05.teach.review_miyayad_miyawarad:
    title: Il/elle vient / il/elle apporte
    gloss: il/elle vient / il/elle apporte
    note: می‌آید et می‌آورد sont des formes de la 3e personne, qui suivent le modèle en -د déjà vu (par ex. می‌خواند dans l’unité 31).
    target_text: می‌آید (il/elle vient) / می‌آورد (il/elle apporte)
  prs.a1.unit32.lesson05.teach.reading_passage:
    title: 'Lecture : une fête'
    gloss: La fête d’anniversaire de Basir a lieu vendredi. Elle est à sept heures. Maryam vient à la fête. Elle apporte un cadeau. Basir est content.
  prs.a1.unit32.lesson06.teach.review_like_have_time:
    title: J’aime / temps / je n’ai pas / mais
    gloss: j’aime / temps / je n’ai pas / mais
    note: دوست دارم (j’aime), وقت (temps), ندارم (je n’ai pas) et اما (mais) ont déjà été vus ; ils prolongent la construction de conclusion de l’unité 31.
    target_text: دوست دارم (j’aime) / وقت (temps) / ندارم (je n’ai pas) / اما (mais)
  prs.a1.unit32.lesson06.teach.wrap_summary:
    title: J’aime les fêtes, mais je n’ai pas le temps
    gloss: J’aime les fêtes, mais je n’ai pas le temps.
    note: Cette phrase combine جشن را دوست دارم (j’aime les fêtes, construction déjà vue) avec اما وقت ندارم (mais je n’ai pas le temps).
