course:
  title: Dari A1
  description: 'Dari de Kaboul pour débutants : vocabulaire de la fête et de l’anniversaire (anniversaire, fête, gâteau, cadeau, félicitations), demander et dire en quel mois tombe un anniversaire, une formule d’invitation de politesse et un dialogue entre Basir et Maryam sur une fête d’anniversaire.'
units:
  prs.a1.unit32.celebrations:
    title: Les fêtes
    description: 'Parle d’anniversaires et de fêtes : dis quand est ton anniversaire, invite quelqu’un et félicite-le.'
lessons:
  prs.a1.unit32.lesson01.celebration_vocabulary:
    title: Les mots de la fête
  prs.a1.unit32.lesson02.birthday_month:
