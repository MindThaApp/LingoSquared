    title: 'Employé : Bonjour, voici. Le concert de Sima commence à huit heures du soir.'
    gloss: Bonjour, voici. Le concert de Sima commence à huit heures du soir.
  prs.a1.unit54.lesson04.teach.dialogue_line3:
    title: 'Homayoun : Combien coûte le billet ?'
    gloss: Combien coûte le billet ?
  prs.a1.unit54.lesson04.teach.dialogue_line4:
    title: 'Employé : Le billet coûte 30 afghanis.'
    gloss: Le billet coûte 30 afghanis.
  prs.a1.unit54.lesson04.teach.dialogue_line5:
    title: 'Homayoun : Merci beaucoup.'
    gloss: Merci beaucoup.
  prs.a1.unit54.lesson04.teach.dialogue_line6:
    title: 'Employé : Je vous en prie.'
    gloss: Je vous en prie.
  prs.a1.unit54.lesson05.teach.review_this_is_in_to:
    title: 'Révision : ceci, est, dans, à'
    gloss: ceci / est / dans / à
    note: Ce sont des mots de révision utilisés dans le texte de lecture.
    target_text: این (ceci / c') / است (est) / در (dans / à) / به (à)
  prs.a1.unit54.lesson05.teach.review_he_went_object_saw_was:
    title: 'Révision : il/elle, est allé(e), (marque de l’objet), a vu, était, bien'
