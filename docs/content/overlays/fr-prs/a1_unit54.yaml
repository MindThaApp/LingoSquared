course:
  title: Dari A1
  description: 'Dari de Kaboul pour débutants : faire des projets pour aller à un concert, lire une affiche de concert, acheter un billet, demander à quelle heure il commence et en parler simplement ensuite.'
units:
  prs.a1.unit54.concert:
    title: Concert
    description: Faire des projets pour aller à un concert, acheter un billet, demander à quelle heure il commence et en parler simplement ensuite.
