    note: Ce sont des mots de révision utilisés dans le texte de lecture.
    target_text: او (il / elle) / رفت (est allé) / را (marqueur d'objet) / دید (a vu) / بود (était) / خوب (bon)
  prs.a1.unit54.lesson05.teach.review_concert_singer_name:
