teaching:
  prs.a1.unit54.lesson01.teach.review_this_is_in_good:
    title: 'Révision : ce/ceci, est, dans, bien'
    gloss: ceci / est / dans / bien
    note: Ce sont des mots de révision (utilisés tout au long de ce cours) pour parler du concert.
    target_text: این (ceci / c') / است (est) / در (dans / à) / خوب (bon)
  prs.a1.unit54.lesson01.teach.concert_word:
    title: Concert
    gloss: concert
    note: C’est le mot dari moderne courant pour dire « concert » ; il est emprunté, comme *موزیم* (musée), à une langue européenne, ce qui le rend facile à reconnaître en français.
    example_gloss: Ce concert est bien.
  prs.a1.unit54.lesson01.teach.singer_word:
    title: Chanteur
    gloss: chanteur / chanteuse
    note: C’est le mot moderne simple et courant pour dire chanteur ou chanteuse. Il existe aussi un mot plus classique, *آوازخوان*, mais il est moins courant dans la langue de tous les jours.
    example_gloss: Le chanteur est au concert.
  prs.a1.unit54.lesson01.teach.this_is_concert_phrase:
    title: C’est un concert
    gloss: C’est un concert.
    note: Cette phrase combine ceci, est et concert, comme le cours assemble déjà ces mots ailleurs.
  prs.a1.unit54.lesson01.teach.singer_at_concert_phrase:
    title: Le chanteur est au concert
    gloss: Le chanteur est au concert.
    note: Cette phrase combine chanteur, dans et concert.
  prs.a1.unit54.lesson02.teach.review_price_and_time_words:
    title: 'Révision : combien, afghani, est, trente, heure, huit, soir, se passe, dans, billet'
    gloss: combien / afghani / est / trente / heure / huit / soir / se passe / dans / billet
    note: Ce sont des mots de révision (vus dans les unités précédentes) pour parler de l’heure de début et du prix du concert.
    target_text: چند (combien) / افغانی (afghani) / است (est) / سی (trente) / ساعت (heure) / هشت (huit) / شب (soir) / می‌شود (devient / est) / در (dans / à) / تکت (billet)
  prs.a1.unit54.lesson02.teach.start_word:
    title: Début
    gloss: début
    note: Ce mot se combine avec *می‌شود* (se passe) pour dire « ça commence », selon le même schéma de verbe léger que ce cours a déjà employé.
    example_gloss: Le concert commence à huit heures du soir.
  prs.a1.unit54.lesson02.teach.singer_name_word:
    title: Sima
    gloss: Sima
    note: Sima est un prénom afghan courant ; ici, c’est le nom de la chanteuse du concert.
    example_gloss: Sima est chanteuse.
  prs.a1.unit54.lesson02.teach.concert_poster_reading:
    title: Lecture de l’affiche du concert
    gloss: Sima est chanteuse. Le concert commence à huit heures du soir. Le billet coûte 30 afghanis.
  prs.a1.unit54.lesson02.teach.review_when_word:
    title: 'Révision : quand'
    gloss: quand
    note: C’est un mot de révision utilisé pour demander quand le concert commence.
    target_text: کی (quand)
  prs.a1.unit54.lesson02.teach.ask_start_time_phrase:
    title: Quand le concert commence-t-il ?
    gloss: Quand le concert commence-t-il ?
    note: Cette phrase combine les mots appris plus tôt dans cette leçon.
  prs.a1.unit54.lesson02.teach.answer_start_time_phrase:
    title: Le concert commence à huit heures du soir
    gloss: Le concert commence à huit heures du soir.
    note: Cette phrase donne l’heure de début du concert indiquée sur l’affiche.
  prs.a1.unit54.lesson03.teach.review_propose_words:
    title: 'Révision : voulez-vous, vendredi, allons-y'
    gloss: voulez-vous (poli) / vendredi / allons
    note: Ce sont des mots de révision pour proposer un projet, selon le même schéma que ce cours a déjà établi pour proposer une sortie au parc.
    target_text: می‌خواهین (voulez-vous, poli) / جمعه (vendredi) / برویم (allons)
  prs.a1.unit54.lesson03.teach.review_concert_word:
    title: 'Révision : concert'
    gloss: concert
    note: C’est un mot de révision utilisé pour proposer d’aller au concert.
    target_text: کنسرت (concert)
  prs.a1.unit54.lesson03.teach.propose_concert_phrase:
    title: Voulez-vous aller au concert vendredi ?
    gloss: Voulez-vous aller au concert vendredi ?
    note: Cette phrase reprend le schéma de proposition déjà établi dans ce cours, appliqué au concert.
  prs.a1.unit54.lesson03.teach.review_accept_words:
    title: 'Révision : oui, super, d’accord'
    gloss: oui / super / d’accord
    note: Ce sont des mots de révision pour accepter une proposition.
    target_text: بلی (oui) / عالی (super) / قبول (d'accord)
  prs.a1.unit54.lesson03.teach.accept_plan_phrase:
    title: Oui, super ! D’accord.
    gloss: Oui, super ! D’accord.
    note: Cette phrase accepte la proposition d’aller au concert.
  prs.a1.unit54.lesson04.teach.review_hello_want_ticket:
    title: 'Révision : bonjour, un/une, billet, je veux'
    gloss: bonjour / un, une / billet / je veux
    note: Ce sont des mots de révision pour ouvrir le dialogue.
    target_text: سلام (bonjour) / یک (un / une) / تکت (billet) / می‌خواهم (je veux)
  prs.a1.unit54.lesson04.teach.review_welcome_concert_start:
    title: 'Révision : voici, concert, Sima, heure, huit, soir, commence'
    gloss: voici / concert / Sima / heure / huit / soir / commence
    note: Ce sont des mots de révision pour indiquer l’heure de début du concert.
    target_text: بفرمایین (je vous en prie / voici) / کنسرت (concert) / سیما (Sima) / ساعت (heure) / هشت (huit) / شب (soir) / شروع می‌شود (commence)
  prs.a1.unit54.lesson04.teach.review_ask_price:
    title: 'Révision : combien, afghani, est'
    gloss: combien / afghani / est
    note: Ce sont des mots de révision pour demander et indiquer le prix du billet.
    target_text: چند (combien) / افغانی (afghani) / است (est)
  prs.a1.unit54.lesson04.teach.review_thanks_welcome:
    title: 'Révision : merci beaucoup, de rien'
    gloss: merci beaucoup / de rien
    note: Ce sont des mots de révision pour conclure le dialogue.
    target_text: تشکر زیاد (merci beaucoup) / خواهش می‌کنم (de rien)
  prs.a1.unit54.lesson04.teach.dialogue_line1:
    title: 'Homayoun : Bonjour. Je voudrais un billet de concert.'
    gloss: Bonjour. Je voudrais un billet de concert.
