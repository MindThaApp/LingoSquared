    title: Le concert de 8 heures coûte 30 afghanis, mais celui de 10 heures coûte 50 afghanis
    gloss: Le concert de huit heures coûte 30 afghanis, mais le concert de dix heures coûte 50 afghanis.
    note: « Mais » oppose les heures de début et les prix de deux concerts différents.
