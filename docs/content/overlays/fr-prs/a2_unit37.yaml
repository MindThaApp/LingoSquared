course:
  title: Dari en français A2
  description: 'Dari afghan de niveau pré-intermédiaire : dire ce qui arrive ou arrivera si une condition est remplie, par exemple s’il pleut demain ou si tu as le reçu. اگر suivi du subjonctif, avec une proposition principale au présent ou à l’impératif ; projets selon la météo et règles des magasins.'
