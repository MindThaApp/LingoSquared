teaching:
  prs.a2.unit37.lesson01.teach.weather:
    title: Le temps
    gloss: temps (météo), air
    note: '*هوا* désigne le temps qu’il fait, et aussi l’air. *هوا خوب است* signifie « il fait beau », et *هوا بد است* « il fait mauvais ».'
    example_gloss: Il fait beau aujourd’hui.
  prs.a2.unit37.lesson01.teach.cold:
    title: Froid
    gloss: froid
    note: '*سرد* signifie « froid ». Son contraire est *گرم* (chaud), que tu connais déjà.'
    example_gloss: Il fait froid aujourd’hui.
  prs.a2.unit37.lesson01.teach.outside:
    title: Dehors
    gloss: dehors
    note: '*بیرون* signifie « dehors ». *بیرون می‌روم* signifie « je sors », et *بیرون از خانه* « en dehors de la maison ».'
    example_gloss: Je suis en dehors de la maison.
  prs.a2.unit37.lesson01.teach.if_pattern:
    title: 'اگر : une condition réelle'
    gloss: S’il fait beau, je vais au parc. S’il pleut, je reste à la maison.
    note: '*اگر* signifie « si ». Il introduit une condition qui peut réellement se produire, et le verbe de la condition est au subjonctif : *باشد*, *ببارد*. C’est la même forme que tu rencontres après *باید* : un verbe avec *ب-* devant le radical du présent (*ببارد*), et *باشد* pour *بودن*, qui ne prend pas *ب-*. La proposition principale dit ensuite ce qui se passe, au présent simple avec *می‌* : *به پارک می‌روم*. Le présent avec *می‌* sert aussi pour le futur : tu n’as donc pas besoin d’une forme spéciale de futur. Mets une virgule après la condition.'
  prs.a2.unit37.lesson01.teach.paradigm_ro:
    title: Le subjonctif de رفتن après اگر
    gloss: si je vais, si tu vas, s’il ou si elle va, si nous allons, si vous allez (formel ou pluriel), s’ils ou si elles vont
    note: 'Le radical du présent de *رفتن* est *رو*. Mets *ب-* devant et ajoute les terminaisons : *بروم* (je), *بروی* (tu, à un ami), *برود* (il, elle), *برویم* (nous), *بروین* (vous, formel ou pluriel), *بروند* (ils, elles). Tous les verbes prennent les mêmes six terminaisons : *-م، -ی، -د، -یم، -ین، -ند*. La terminaison *-ین* est celle de « vous » (formel ou pluriel). Les formes en *-ید* sont aussi comprises, mais ce cours écrit *-ین*.'
  prs.a2.unit37.lesson01.teach.snow_phrase:
    title: S’il neige, je ne sors pas
    gloss: S’il neige, je ne sors pas.
    note: 'La proposition principale peut être négative. Mets *نمی‌* devant le radical du présent : *نمی‌روم* signifie « je ne vais pas ». La condition reste la même : *اگر برف ببارد* signifie « s’il neige ».'
  prs.a2.unit37.lesson01.teach.cold_phrase:
    title: S’il fait froid, je reste à la maison
    gloss: S’il fait froid, je reste à la maison.
    note: '*اگر هوا سرد باشد* signifie « s’il fait froid ». Avec *هوا* et un adjectif, la condition se termine toujours par *باشد*.'
  prs.a2.unit37.lesson02.teach.weekend:
    title: Week-end
    gloss: week-end, fin de la semaine
    note: '*آخر هفته* est le week-end. *آخر* signifie « fin » et *هفته* « semaine ».'
    example_gloss: Le week-end, nous allons au parc.
  prs.a2.unit37.lesson02.teach.tonight:
    title: Ce soir
    gloss: ce soir
    note: '*امشب* signifie « ce soir ». C’est un mot de temps, que la proposition principale avec *می‌* peut utiliser : *امشب می‌روم* signifie « j’y vais ce soir ».'
    example_gloss: Ce soir, je vais au cinéma.
  prs.a2.unit37.lesson02.teach.formation:
    title: Le subjonctif des autres verbes
    gloss: que j’achète, que je prenne, que je donne, que je vienne, que je reste, que je mange
    note: 'La règle vue avec *رفتن* vaut pour tous les verbes : radical du présent avec *ب-* devant, puis les terminaisons. *خر* donne *بخرم* (j’achète), *گیر* donne *بگیرم* (je prends), *ده* donne *بدهم* (je donne), *مان* donne *بمانم* (je reste), *خور* donne *بخورم* (je mange). *آمدن* est à retenir : son subjonctif est *بیایم، بیایی، بیاید، بیاییم، بیایین، بیایند*, avec un *ی* supplémentaire. Après *اگر*, chacune de ces formes signifie « si j’achète », « si je prends », etc.'
  prs.a2.unit37.lesson02.teach.be_have:
    title: Le subjonctif de بودن et de داشتن
    gloss: que je sois, que tu sois, qu’il ou qu’elle soit, que nous soyons, que vous soyez (formel ou pluriel), qu’ils ou qu’elles soient
    note: '*باشم، باشی، باشد، باشیم، باشین، باشند* sont les six formes du subjonctif de *بودن* ; elles ne prennent pas *ب-*. Pour dire « si j’ai », le dari utilise *داشته باشم* : le participe *داشته* plus *باشم*. Ainsi *اگر وقت داشته باشم* signifie « si j’ai le temps » et *اگر پول داشته باشی* « si tu as de l’argent ». Pour une situation future possible, c’est la forme habituelle.'
  prs.a2.unit37.lesson02.teach.money_phrase:
    title: Si j’ai de l’argent, j’achète un livre
    gloss: Si j’ai de l’argent, j’achète un livre.
    note: '*اگر پول داشته باشم* signifie « si j’ai de l’argent ». La proposition principale est au présent simple : *کتاب می‌خرم* signifie « j’achète un livre » ou « j’achèterai un livre ».'
  prs.a2.unit37.lesson02.teach.negative:
    title: 'La négation : ن au lieu de ب'
    gloss: si je ne vais pas, si je ne viens pas, si je n’achète pas, s’il n’y a pas, s’il ne pleut pas
    note: 'Pour mettre la condition à la forme négative, remplace *ب-* par *ن-* : *بروم* devient *نروم*, *بخرم* devient *نخرم* et *بیایم* devient *نیایم*. *باشد* et *ببارد* deviennent *نباشد* et *نبارد*. Ainsi *اگر باران نبارد* signifie « s’il ne pleut pas ».'
  prs.a2.unit37.lesson02.teach.friend_phrase:
    title: Si mon ami vient, nous jouons au football ensemble
    gloss: Si mon ami vient, nous jouons au football ensemble.
    note: 'La condition contient *بیاید* (le subjonctif de *آمدن* pour « il » ou « elle »). La proposition principale dit maintenant « nous » : *می‌کنیم* signifie « nous faisons » ou « nous jouons », et *می‌رویم* « nous allons ». *با هم* signifie « ensemble ».'
  prs.a2.unit37.lesson02.teach.norain_phrase:
    title: S’il ne pleut pas, nous allons au parc
    gloss: S’il ne pleut pas, nous allons au parc.
    note: '*اگر باران نبارد* signifie « s’il ne pleut pas ». La proposition principale est affirmative, et *می‌رویم* signifie « nous allons ».'
  prs.a2.unit37.lesson02.teach.time_phrase:
    title: Si j’ai le temps, je vais au cinéma ce soir
    gloss: Si j’ai le temps, je vais au cinéma ce soir.
    note: Une condition sur le fait d’avoir du temps utilise *داشته باشم*. Le mot de temps *امشب* dans la proposition principale montre que le projet est pour ce soir.
  prs.a2.unit37.lesson03.teach.clothes:
    title: Les vêtements
    gloss: vêtements, habits
    note: '*لباس* signifie « vêtements » ou « un vêtement ». *لباس گرم* désigne des vêtements chauds, pour le temps froid.'
    example_gloss: J’ai des vêtements chauds.
  prs.a2.unit37.lesson03.teach.imperative:
    title: 'L’ordre : après اگر, la proposition principale peut être un ordre'
    gloss: prends (à un ami, formel ou pluriel), mets (un vêtement), viens, téléphone
    note: 'La proposition principale peut aussi être un ordre. À un ami, l’impératif se forme avec *ب-* plus le radical du présent, sans terminaison : *بگیر* (prends), *بپوش* (mets), *بیا* (viens). À une personne à qui l’on dit « vous », ou à plusieurs personnes, ajoute *-ین* : *بگیرین، بپوشین، بیایین*. Les verbes composés de deux mots n’ont pas de *ب-* : *تیلفون کن* (à un ami), *تیلفون کنین* (formel ou pluriel). Ainsi *اگر باران ببارد، چتر بگیر* signifie « s’il pleut, prends un parapluie ».'
  prs.a2.unit37.lesson03.teach.neg_imperative:
    title: L’ordre négatif
    gloss: n’y va pas, ne viens pas, ne fais pas (à un ami, formel ou pluriel)
    note: 'L’ordre négatif utilise *ن-* à la place de *ب-* : *نرو* (n’y va pas), *نیا* (ne viens pas), *نکن* (ne fais pas). Les formes pour « vous » (formel ou pluriel) ajoutent *-ین* : *نروین، نیایین، نکنین*. Par exemple, *اگر باران ببارد، بیرون نرو* signifie « s’il pleut, ne sors pas ».'
  prs.a2.unit37.lesson03.teach.present_state:
    title: 'Le présent dans la condition : ce qui est vrai maintenant'
    gloss: Si tu as le temps, viens. Si tu as froid, mets des vêtements chauds.
    note: 'Quand la condition est quelque chose de vrai en ce moment, elle peut utiliser le présent ordinaire au lieu du subjonctif : *اگر وقت داری* (si tu as le temps maintenant) et *اگر سردت است* (si tu as froid). *اگر وقت داشته باشی* est aussi correct et fait plutôt penser à une situation future possible. Une personne qui a froid dit *سردم است* ; *سردت است* signifie « tu as froid ».'
  prs.a2.unit37.lesson03.teach.rain_umbrella:
    title: S’il pleut, prends un parapluie
    gloss: S’il pleut, prends un parapluie.
    note: 'La condition est au subjonctif *ببارد*, et la proposition principale est un ordre donné à un ami : *بگیر*.'
  prs.a2.unit37.lesson03.teach.late_phone:
    title: Si tu es en retard, téléphone
    gloss: Si tu es en retard, téléphone.
    note: '*دیر شوی* est le subjonctif de *دیر شدن* pour « tu » (ami) : si tu deviens en retard. *تیلفون کن* est l’ordre adressé à un ami.'
  prs.a2.unit37.lesson03.teach.problem_phone:
    title: Si vous avez un problème, téléphonez
    gloss: Si vous avez un problème, téléphonez.
    note: 'Quand on s’adresse à un client ou à plusieurs personnes, on utilise *-ین* dans les deux propositions : *دارین* (vous avez) et *کنین* (faites un appel). Un magasin pourrait dire cela sur une affiche.'
  prs.a2.unit37.lesson04.teach.item:
    title: Marchandise, article
    gloss: marchandise, article, produit
    note: '*کالا* désigne une marchandise ou un article que l’on achète dans un magasin.'
    example_gloss: Cet article est défectueux.
  prs.a2.unit37.lesson04.teach.customer:
    title: Client
    gloss: client
    note: '*مشتری* signifie « client ». Le pluriel est *مشتریان*, avec la terminaison *-ان* pour les personnes.'
    example_gloss: Le client est dans le magasin.
  prs.a2.unit37.lesson04.teach.receipt:
    title: Reçu
    gloss: ticket de caisse
    note: '*رسید* est un reçu, le papier qui montre ce que tu as payé. Il ressemble au passé de *رسیدن* (il est arrivé), mais dans un magasin il signifie « reçu ».'
    example_gloss: Avez-vous le reçu sur vous ?
  prs.a2.unit37.lesson04.teach.exchange:
    title: Changer (de l’argent)
    gloss: échanger, changer
    note: '*عوض کردن* signifie « échanger » ou « changer » quelque chose. On met l’objet et *را* devant : *کالا را عوض می‌کنم* signifie « j’échange l’article ».'
    example_gloss: Je veux échanger le livre.
  prs.a2.unit37.lesson04.teach.give_back:
    title: Rendre
    gloss: rendre, restituer, rembourser
    note: '*پس دادن* signifie « rendre ». Un magasin qui rembourse dit *پول را پس می‌دهیم* (nous rendons l’argent).'
    example_gloss: Nous rendons l’argent.
  prs.a2.unit37.lesson04.teach.modal:
    title: 'Pouvoir : می‌توانم'
    gloss: je peux, tu peux, il ou elle peut, nous pouvons, vous pouvez (formel ou pluriel), ils ou elles peuvent
    note: '*می‌توانم* signifie « je peux » et s’écrit toujours avec *می‌* et une petite espace. Les six formes sont *می‌توانم، می‌توانی، می‌تواند، می‌توانیم، می‌توانین، می‌توانند*. Le verbe suivant est au subjonctif, à la même personne : *می‌توانیم عوض کنیم* signifie « nous pouvons échanger ». Pour la négation, mets *ن* devant : *نمی‌توانیم* signifie « nous ne pouvons pas ».'
  prs.a2.unit37.lesson04.teach.shop_if:
    title: Les règles d’un magasin avec اگر
    gloss: Si l’article est défectueux, nous l’échangeons. Si vous avez le reçu sur vous, nous pouvons échanger l’article.
    note: 'Les magasins utilisent *اگر* pour dire ce qu’ils font dans chaque cas. La condition contient *باشد* (*خراب باشد*, *همراه‌تان باشد*), et la proposition principale est au présent simple (*عوض می‌کنیم*) ou avec *می‌توانیم* suivi du subjonctif. *همراه‌تان باشد* signifie « vous l’avez sur vous » (littéralement : il est avec vous).'
  prs.a2.unit37.lesson04.teach.no_receipt:
    title: 'Une règle négative : pas de reçu'
    gloss: Si vous n’avez pas de reçu, nous ne pouvons pas rembourser.
    note: '*نداشته باشین* est la forme négative de *داشته باشین* (si vous avez). La proposition principale est aussi négative : *نمی‌توانیم پول را پس بدهیم* signifie « nous ne pouvons pas rendre l’argent ». Le magasin s’adresse au client avec *-ین*.'
  prs.a2.unit37.lesson04.teach.seven_days:
    title: Si vous l’apportez dans les sept jours, nous échangeons l’article
    gloss: Si vous l’apportez dans les sept jours, nous échangeons l’article.
    note: '*تا هفت روز* signifie « jusqu’à sept jours ». *بیاورین* est le subjonctif de *آوردن* pour « vous » (formel ou pluriel) : si vous apportez.'
  prs.a2.unit37.lesson05.teach.notice:
    title: Une affiche dans un magasin
    gloss: Une affiche de magasin pour les clients, sur l’échange des articles et le remboursement.
    note: 'C’est le genre d’affiche que l’on voit dans un magasin. Lis-la pour repérer les conditions : ce que fait le magasin si tu as un reçu, si l’article est défectueux, si tu n’as pas de reçu et si tu as un problème. Chaque règle est composée d’une proposition en *اگر* et d’une proposition principale.'
  prs.a2.unit37.lesson05.teach.weather_turn01:
    title: Zeynab demande ce qu’il fait demain
    gloss: Shahin, qu’est-ce que tu fais demain ?
    note: Zeynab interroge son ami sur ses projets avec la question *فردا چه می‌کنی؟* (que fais-tu demain ?), en utilisant le présent pour le futur.
  prs.a2.unit37.lesson05.teach.weather_turn02:
    title: Shahin présente deux projets
    gloss: S’il fait beau, je vais au parc avec mes amis. S’il pleut, je reste à la maison.
    note: Shahin a deux conditions avec deux projets. Les deux conditions sont au subjonctif (*باشد، ببارد*) et les deux propositions principales au présent (*می‌روم، می‌مانم*).
  prs.a2.unit37.lesson05.teach.weather_turn03:
    title: Zeynab viendra peut-être
    gloss: Si j’ai le temps, je viendrai aussi.
    note: '*داشته باشم* est le subjonctif pour « si j’ai ». *من هم* signifie « moi aussi ».'
  prs.a2.unit37.lesson05.teach.weather_turn04:
    title: Shahin l’invite
    gloss: Super ! Si tu viens, nous jouerons aussi au football.
    note: '*بیایی* est le subjonctif de *آمدن* pour « tu » (ami). La proposition principale dit « nous » : *می‌کنیم*.'
  prs.a2.unit37.lesson05.teach.weather_turn05:
    title: Zeynab demande l’heure
    gloss: À quelle heure y allez-vous ?
    note: '*می‌روین* signifie « vous allez » (formel ou pluriel) : Zeynab interroge tout le groupe.'
  prs.a2.unit37.lesson05.teach.weather_turn06:
    title: Shahin lui demande de téléphoner
    gloss: À dix heures. Si tu es en retard, téléphone.
    note: La condition est *دیر شوی* et la proposition principale est l’ordre *تیلفون کن*.
  prs.a2.unit37.lesson05.teach.weather_turn07:
    title: Zeynab fait sa propre proposition
    gloss: D’accord. S’il pleut, je téléphonerai.
    note: 'Zeynab utilise aussi *اگر* avec *ببارد* et une proposition principale au présent : *تیلفون می‌کنم*.'
  prs.a2.unit37.lesson06.teach.shop_turn01:
    title: Fariba explique son problème
    gloss: Excusez-moi, hier j’ai acheté un parapluie dans ce magasin. Le parapluie est défectueux.
    note: Fariba commence poliment par *ببخشین*. Elle dit que le parapluie est *خراب* et qu’elle l’a acheté *دیروز*.
  prs.a2.unit37.lesson06.teach.shop_turn02:
    title: Le vendeur pose une condition
    gloss: Si vous avez le reçu sur vous, nous pouvons l’échanger.
    note: 'Le magasin reprend le schéma de l’affiche : une condition avec *باشد* et *می‌توانیم* suivi du subjonctif. *آن را* signifie « le » ou « la ».'
  prs.a2.unit37.lesson06.teach.shop_turn03:
    title: Fariba a le reçu
    gloss: Oui, voici le reçu.
    note: '*رسید این است* signifie « voici le reçu ». *بلی* signifie « oui ».'
  prs.a2.unit37.lesson06.teach.shop_turn04:
    title: La vendeuse propose deux choix
    gloss: Très bien. Si vous voulez un autre parapluie, prenez-en un. Si vous n’en voulez pas, nous vous rembourserons.
    note: 'Deux conditions, toutes deux au présent : *اگر ... می‌خواهین* (si vous voulez) avec l’impératif *بگیرین*, et *اگر نمی‌خواهین* (si vous ne voulez pas) avec *پس می‌دهیم*.'
  prs.a2.unit37.lesson06.teach.shop_turn05:
    title: Fariba fait son choix
    gloss: Je prends un autre parapluie. Merci.
    note: 'Fariba répond au présent : *می‌گیرم* signifie « je prends », et cela montre qu’elle a décidé.'
  prs.a2.unit37.lesson06.teach.want:
    title: Si vous ne voulez pas d’autre parapluie, nous vous remboursons
    gloss: Si vous ne voulez pas d’autre parapluie, nous vous remboursons.
    note: 'Pour un souhait présent, la condition peut utiliser le présent ordinaire : *می‌خواهین* signifie « vous voulez » et *نمی‌خواهین* « vous ne voulez pas ». La proposition principale indique ce que fait le magasin.'
exercises:
  prs.a2.unit37.lesson01.exercise01.recognize_good_weather:
    instruction: Que signifie cette phrase ?
    correct_option: S’il fait beau, je vais au parc
    distractors:
    - S’il pleut, je vais au parc
    - Il faisait beau, donc je suis allé au parc
    - Je ne vais pas au parc
    accepted_answers:
    - value: S’il fait beau, je vais au parc
      status: correct
    feedback: '*اگر هوا خوب باشد* signifie « s’il fait beau », et *به پارک می‌روم* indique ce qui se passe alors.'
  prs.a2.unit37.lesson01.exercise02.recognize_rain_home:
    instruction: Que signifie cette phrase ?
    correct_option: S’il pleut, je reste à la maison
    distractors:
    - S’il pleut, je sors
    - Il a plu, donc je suis resté à la maison
    - Je ne reste jamais à la maison
    accepted_answers:
    - value: S’il pleut, je reste à la maison
      status: correct
    feedback: '*اگر باران ببارد* signifie « s’il pleut », et *در خانه می‌مانم* « je reste à la maison ».'
  prs.a2.unit37.lesson01.exercise03.complete_warm:
    instruction: 'Complète la phrase : S’il fait chaud, je sors.'
    accepted_answers:
    - value: باشد
      status: correct
    feedback: '*باشد* est le subjonctif de *بودن*. Après *اگر هوا گرم*, il forme la condition : s’il fait chaud.'
  prs.a2.unit37.lesson01.exercise04.match_subjunctive_weather:
    instruction: Associe chaque mot dari à son sens.
