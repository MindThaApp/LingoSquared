course:
  title: Dari en français A2
  description: 'Dari afghan niveau intermédiaire inférieur : donner une cause et une conséquence dans un même message. Les causes avec چون (et زیرا pour la lecture), les conséquences avec به همین دلیل / برای همین et بنابراین, et به دلیل suivi d’un nom, avec du vocabulaire pour les excuses et les changements de programme.'
units:
  prs.a2.unit34.because_so:
    title: Parce que et donc
lessons:
  prs.a2.unit34.lesson01.ask_and_give_reasons:
    title: Pourquoi ? Parce que…
  prs.a2.unit34.lesson02.order_and_not_coming:
    title: L’ordre des propositions et « je ne suis pas venu(e) »
  prs.a2.unit34.lesson03.because_of_this:
    title: 'C’est pourquoi : به همین دلیل et برای همین'
  prs.a2.unit34.lesson04.because_of_and_therefore:
    title: به دلیل, بنابراین et زیرا
  prs.a2.unit34.lesson05.reading_and_listening:
    title: Lire et écouter des explications
  prs.a2.unit34.lesson06.change_of_plan:
    title: Une conversation pour changer de programme
teaching:
  prs.a2.unit34.lesson01.teach.headache:
    title: Mal de tête
    gloss: mal de tête
    note: '*سردرد* signifie « mal de tête ». On dit *سردرد دارم* (j’ai mal à la tête) et *سردرد داشتم* (j’avais mal à la tête). C’est une raison très courante quand on ne peut pas faire quelque chose.'
    example_gloss: Hier, j’avais mal à la tête.
  prs.a2.unit34.lesson01.teach.tired:
    title: Fatigué
    gloss: fatigué
    note: '*خسته* signifie « fatigué ». C’est un adjectif : il s’emploie avec *استم* (je suis) et *بودم* (j’étais) : *خسته بودم* signifie « j’étais fatigué(e) ».'
    example_gloss: Aujourd’hui, je suis très fatigué(e).
  prs.a2.unit34.lesson01.teach.busy:
    title: Occupé
    gloss: occupé(e)
    note: '*مصروف* signifie « occupé ». *مصروف بودم* signifie « j’étais occupé(e) ». C’est la courte excuse habituelle pour manquer une réunion ou une visite.'
    example_gloss: Cette semaine, je suis occupé(e).
  prs.a2.unit34.lesson01.teach.weather:
    title: Le temps
    gloss: temps (météo), air
    note: '*هوا* signifie « le temps (qu’il fait) » et aussi « l’air ». *هوا خوب است* signifie « il fait beau ».'
    example_gloss: Aujourd’hui, il fait beau.
  prs.a2.unit34.lesson01.teach.cold:
    title: Froid
    gloss: froid
    note: '*سرد* signifie « froid ». *هوا سرد است* signifie « il fait froid », en parlant du temps.'
    example_gloss: La nuit, il fait froid.
  prs.a2.unit34.lesson01.teach.excuse:
    title: Excuse
    gloss: excuse, raison avancée
    note: '*عذر* est la raison qu’on donne pour ne pas faire quelque chose : une excuse. Une bonne *عذر* répond à la question *چرا؟*.'
    example_gloss: Son excuse était un mal de tête.
  prs.a2.unit34.lesson01.teach.why_because:
    title: Demander pourquoi et répondre parce que
    gloss: Pourquoi n’es-tu pas allé(e) au bureau ? Parce que j’étais fatigué(e).
    note: '*چرا* demande une raison et *چون* la donne. La réponse peut être une proposition entière : *چون خسته بودم* (parce que j’étais fatigué(e)). Dans une réponse courte, on ne répète pas le reste de la question. Rien ne change dans la proposition après *چون* : le verbe reste à la fin, comme dans toute phrase en dari.'
  prs.a2.unit34.lesson01.teach.reason_sentence:
    title: Je ne suis pas allé(e) au bureau parce que j’étais malade
    gloss: Je ne suis pas allé(e) au bureau parce que j’étais malade.
    note: 'C’est le modèle de l’unité : d’abord ce qui s’est passé, puis une virgule, puis *چون* et la raison. Les deux parties peuvent aussi échanger leur place : *چون مریض بودم، به دفتر نرفتم*.'
  prs.a2.unit34.lesson02.teach.friends:
    title: Marjan et Haroon
    gloss: Marjan et Haroon sont amis.
    note: 'Marjan et Haroon sont les deux amis de cette unité. Ils se tutoient avec *تو*. La terminaison *-ند* de *استند* est le pluriel de *است* : ils sont.'
  prs.a2.unit34.lesson02.teach.came:
    title: 'Venir : le passé simple'
    gloss: je suis venu(e), tu es venu(e), il/elle est venu(e), nous sommes venus, vous êtes venu(e)(s) (forme polie ou pluriel), ils sont venus
    note: 'Le passé de *آمدن* est *آمدم، آمدی، آمد، آمدیم، آمدین، آمدند*. On indique le lieu où l’on vient avec *به* : *به جلسه آمدم* signifie « je suis venu(e) à la réunion ». Les terminaisons sont les mêmes que pour tous les verbes au passé que tu connais.'
  prs.a2.unit34.lesson02.teach.did_not_come:
    title: 'Je ne suis pas venu(e) : ن + یامد'
    gloss: je ne suis pas venu(e), tu n’es pas venu(e), il/elle n’est pas venu(e), nous ne sommes pas venus, vous n’êtes pas venu(e)(s), ils ne sont pas venus
    note: 'Le négatif de *آمدن* au passé est *نیامدم* (je ne suis pas venu(e)). On place *ن* devant le verbe : *نـ + آمدم* devient *نیامدم*, avec un *ی* entre les deux sons *ا*. Les autres formes sont *نیامدی، نیامد، نیامدیم، نیامدین، نیامدند*. Pour *رفتن*, c’est simple : *نرفتم، نرفتی، نرفت*.'
  prs.a2.unit34.lesson02.teach.stay:
    title: Rester
    gloss: rester
    note: '*ماندن* signifie « rester ». Le passé est *ماندم، ماندی، ماندیم*, et le présent est *می‌مانم، می‌مانی، می‌مانیم*. *در خانه ماندم* signifie « je suis resté(e) à la maison », une conséquence très courante quand il fait mauvais ou quand on est malade.'
    example_gloss: Aujourd’hui, je reste à la maison.
  prs.a2.unit34.lesson02.teach.either_order:
    title: La cause peut venir en premier ou en second
    gloss: Comme il fait froid, je reste à la maison. / Je reste à la maison parce qu’il fait froid.
    note: 'La proposition avec *چون* peut se placer avant ou après la proposition principale, sans changer le sens. Quand elle vient en premier, on met une virgule après : *چون هوا سرد است، در خانه می‌مانم*. Les verbes dari restent à la fin de chaque proposition dans les deux cas, donc l’ordre des mots à l’intérieur des propositions ne change jamais.'
  prs.a2.unit34.lesson02.teach.sorry:
    title: Je suis désolé(e), je ne suis pas venu(e) à la réunion
    gloss: Je suis désolé(e), je ne suis pas venu(e) à la réunion.
    note: '*متأسفم* signifie « je suis désolé(e) ». On le dit souvent en premier, puis on donne la raison avec *چون*.'
  prs.a2.unit34.lesson02.teach.stayed_home:
    title: Comme j’étais fatigué(e), je suis resté(e) à la maison
    gloss: Comme j’étais fatigué(e), je suis resté(e) à la maison.
    note: La cause (*خسته بودم*) est au passé et la conséquence (*در خانه ماندم*) est aussi au passé.
  prs.a2.unit34.lesson03.teach.so_dalil:
    title: 'به همین دلیل : pour cette raison, donc'
    gloss: J’étais occupé(e). C’est pourquoi je ne suis pas venu(e).
    note: '*به همین دلیل* donne la conséquence de ce qu’on vient de dire. Cela signifie « pour cette même raison », « c’est pourquoi ». Cette expression commence la deuxième phrase : d’abord la cause (*مصروف بودم*), puis la conséquence (*به همین دلیل نیامدم*). C’est le miroir de *چون* : *چون* introduit la cause, *به همین دلیل* introduit la conséquence.'
  prs.a2.unit34.lesson03.teach.so_hamin:
    title: 'برای همین : c’est pourquoi'
    gloss: Il faisait froid. C’est pourquoi nous sommes restés à la maison.
    note: '*برای همین* a le même sens que *به همین دلیل* et il est plus court. Il est courant à l’oral, alors que *به همین دلیل* est un peu plus soigné. Tu peux mettre *و* devant l’un ou l’autre : *هوا سرد بود و برای همین در خانه ماندیم*.'
  prs.a2.unit34.lesson03.teach.because_vs_so:
    title: Deux façons de dire la même chose
    gloss: Comme j’étais malade, je ne suis pas venu(e). / J’étais malade. C’est pourquoi je ne suis pas venu(e).
    note: 'Ces deux phrases disent la même chose. Avec *چون*, la cause se place au début ou à la fin, à l’intérieur d’une seule phrase. Avec *به همین دلیل*, il y a deux phrases : d’abord la cause, puis la conséquence. La cause garde toujours le même sens. Utilise un seul connecteur pour un seul lien : ne mets pas *چون* et *به همین دلیل* dans la même phrase.'
  prs.a2.unit34.lesson03.teach.busy_not_come:
    title: J’étais occupé(e). C’est pourquoi je ne suis pas venu(e)
    gloss: J’étais occupé(e). C’est pourquoi je ne suis pas venu(e).
    note: 'Un court message pour expliquer une absence : la cause, puis la conséquence.'
  prs.a2.unit34.lesson03.teach.cold_stayed:
    title: Il faisait froid. C’est pourquoi nous sommes restés à la maison
    gloss: Il faisait froid. C’est pourquoi nous sommes restés à la maison.
    note: Le même schéma avec *برای همین*. *ماندیم* signifie « nous sommes restés ».
  prs.a2.unit34.lesson03.teach.car_broken:
    title: Ma voiture était en panne. C’est pourquoi je suis arrivé(e) en retard
    gloss: Ma voiture était en panne. C’est pourquoi je suis arrivé(e) en retard.
    note: 'La conséquence peut être une autre sorte d’action : pas seulement rester à la maison, mais aussi arriver en retard.'
  prs.a2.unit34.lesson04.teach.be_dalil:
    title: 'به دلیل + nom : à cause de'
    gloss: à cause de la neige, à cause d’un mal de tête, à cause du travail
    note: '*به دلیل* signifie « à cause de » et il est suivi d’un nom, non d’une proposition entière : *به دلیل برف* (à cause de la neige), *به دلیل سردرد* (à cause d’un mal de tête). La phrase qui suit exprime la conséquence. *به دلیل برف* joue le même rôle que *چون برف می‌بارید*, en moins de mots. Utilise *چون* quand tu as un verbe et *به دلیل* quand tu n’as qu’un nom.'
  prs.a2.unit34.lesson04.teach.snow_cancel:
    title: À cause de la neige, la réunion a été annulée
    gloss: À cause de la neige, la réunion a été annulée.
    note: '*لغو شد* signifie « a été annulée ». Le groupe avec *به دلیل* se place souvent au début et il est suivi d’une virgule.'
  prs.a2.unit34.lesson04.teach.headache_office:
    title: À cause d’un mal de tête, je ne suis pas allé(e) au bureau
    gloss: À cause d’un mal de tête, je ne suis pas allé(e) au bureau.
    note: 'Le même schéma avec un autre nom. Tu peux aussi le mettre à la fin : *به دفتر نرفتم، به دلیل سردرد*.'
  prs.a2.unit34.lesson04.teach.change_plan:
    title: Changer
    gloss: changer, modifier
    note: '*تغییر دادن* signifie « changer quelque chose ». Ce que tu changes se place avant le verbe avec *را* : *برنامه را تغییر دادیم* signifie « nous avons changé le programme ». Le passé est *دادم، دادی، دادیم* et le présent est *می‌دهیم* : *برنامه را تغییر می‌دهیم* signifie « nous changeons le programme ».'
    example_gloss: Nous avons changé le programme.
  prs.a2.unit34.lesson04.teach.banabarin:
    title: 'بنابراین : donc, par conséquent'
    gloss: La route était fermée. Par conséquent, le bus n’est pas parti.
    note: '*بنابراین* signifie « par conséquent » et il commence une phrase qui donne la conséquence : d’abord la cause, puis *بنابراین* et le résultat. Il joue le même rôle que *به همین دلیل*, mais il est plus formel. Tu le trouveras surtout dans des messages écrits, des avis et des rapports. À l’oral, on préfère *برای همین* ou *به همین دلیل*.'
  prs.a2.unit34.lesson04.teach.zira:
    title: 'زیرا : car (à l’écrit)'
    gloss: La réunion a été annulée parce que le directeur n’est pas venu.
    note: '*زیرا* signifie aussi « car », mais on le voit à l’écrit, pas à l’oral. Il vient en général après la conséquence et une virgule : d’abord le résultat, puis *زیرا* et la cause. Quand tu parles ou que tu écris un message à un(e) ami(e), utilise *چون*. Tu as seulement besoin de reconnaître *زیرا*.'
  prs.a2.unit34.lesson04.teach.connectors:
    title: Mots de cause et mots de conséquence
    gloss: 'parce que, car (écrit), à cause de : la cause. pour cette raison, c’est pourquoi, par conséquent : la conséquence.'
    note: Classe les mots selon leur rôle. *چون*, *زیرا* et *به دلیل* accompagnent la cause. *به همین دلیل*, *برای همین* et *بنابراین* accompagnent la conséquence. À l’oral, utilise *چون* et *برای همین*. Dans un message formel, utilise *زیرا*, *به دلیل* et *بنابراین*.
  prs.a2.unit34.lesson05.teach.meeting_today:
    title: Réunion (forme liée)
    gloss: réunion de ... (forme liée)
    note: 'Quand *جلسه* est suivi d’un autre mot qui le complète, un petit signe (le hamza sur le *ه* final) relie les deux : *جلسهٔ امروز* signifie « la réunion d’aujourd’hui ». Dans l’écriture courante, ce signe est souvent omis.'
    example_gloss: La réunion d’aujourd’hui est à dix heures.
  prs.a2.unit34.lesson05.teach.niloufar:
    title: Niloufar (prénom)
    gloss: Niloufar (prénom féminin)
    note: '*نیلوفر* est un prénom féminin. C’est elle qui écrit le message que tu vas lire.'
    example_gloss: Niloufar travaille dans un bureau.
  prs.a2.unit34.lesson05.teach.d1_t1:
    title: Marjan demande à Haroon pourquoi il n’est pas venu
    gloss: Haroon, pourquoi n’es-tu pas venu à la réunion hier ?
    note: Marjan demande *چرا* avec le passé simple négatif *نیامدی*. Elle parle à un ami, donc elle utilise *تو*.
  prs.a2.unit34.lesson05.teach.d1_t2:
    title: Haroon explique
    gloss: Je suis désolé. J’avais mal à la tête, alors je suis resté à la maison.
    note: Haroon s’excuse, puis donne la cause (*سردرد داشتم*) et la conséquence (*به همین دلیل در خانه ماندم*) en deux phrases courtes.
  prs.a2.unit34.lesson05.teach.d1_t3:
    title: Marjan interroge sur l’appel téléphonique
    gloss: Pourquoi n’as-tu pas téléphoné ?
    note: '*تیلفون نکردی* signifie « tu n’as pas téléphoné ». Elle demande une autre raison avec *چرا*.'
  prs.a2.unit34.lesson05.teach.d1_t4:
    title: Haroon donne une deuxième raison
    gloss: Parce que mon téléphone était en panne.
    note: 'Une réponse courte : *چون* et la raison, rien d’autre.'
  prs.a2.unit34.lesson05.teach.d1_t5:
    title: Marjan réagit
    gloss: Quel dommage ! Tu vas bien maintenant ?
    note: '*چه بد!* est une réaction amicale à une mauvaise nouvelle. *استی* est la forme familière de « tu es ».'
  prs.a2.unit34.lesson05.teach.d1_t6:
    title: Haroon répond
    gloss: Oui, je vais bien maintenant.
    note: '*استم* signifie « je suis ».'
  prs.a2.unit34.lesson05.teach.message:
    title: Un message de Niloufar
    gloss: Bonjour Marjan. Je suis désolée, la réunion d’aujourd’hui a été annulée, car le directeur n’est pas venu au bureau. À cause de la neige, la route était fermée. Par conséquent, la réunion aura lieu jeudi. Niloufar
    note: 'Un court message écrit. Il emploie les mots de cause de l’écrit : *زیرا* pour la cause, *به دلیل برف* pour une cause qui est un nom, et *بنابراین* pour la conséquence.'
  prs.a2.unit34.lesson06.teach.d2_t1:
    title: Haroon propose un jour
    gloss: Marjan, on va au parc mercredi ?
    note: 'Le présent simple *می‌رویم* avec un jour de la semaine exprime un projet : nous y allons mercredi. La question se termine par une voix montante.'
  prs.a2.unit34.lesson06.teach.d2_t2:
    title: Marjan donne une raison
    gloss: Pas mercredi, parce qu’il va neiger.
    note: Marjan refuse avec *نه* et donne la raison avec *چون*. Le présent *برف می‌بارد* sert aussi à parler de la météo de demain.
  prs.a2.unit34.lesson06.teach.d2_t3:
    title: Haroon change le programme
    gloss: Alors on change le programme. On y va jeudi ?
    note: '*پس* signifie « alors », « donc ». *برنامه را تغییر می‌دهیم* signifie « nous changeons le programme ».'
  prs.a2.unit34.lesson06.teach.d2_t4:
    title: Marjan ne peut pas venir jeudi
    gloss: J’ai une réunion jeudi, donc je ne peux pas.
    note: La cause (*جلسه دارم*) et la conséquence (*به همین دلیل نمی‌توانم*) dans une seule phrase, reliées par une virgule. *نمی‌توانم* signifie « je ne peux pas ».
  prs.a2.unit34.lesson06.teach.d2_t5:
    title: Haroon choisit un autre jour
    gloss: Bon, alors on y va vendredi.
    note: '*پس* signifie ici « alors » : c’est décidé.'
  prs.a2.unit34.lesson06.teach.d2_t6:
    title: Marjan est d’accord
    gloss: Oui, vendredi, ça va.
    note: '*جمعه خوب است* signifie « vendredi, ça va », pour accepter un projet.'
exercises:
  prs.a2.unit34.lesson01.exercise01.recognize_headache:
    instruction: Que signifie cette expression ?
    correct_option: Parce que j’ai mal à la tête
    distractors:
    - Parce que j’avais mal à la tête
    - Pourquoi ai-je mal à la tête ?
    - Parce que je suis fatigué(e)
    accepted_answers:
    - value: Parce que j’ai mal à la tête
      status: correct
    feedback: '*چون* signifie « parce que » et *سردرد دارم* signifie « j’ai mal à la tête ».'
  prs.a2.unit34.lesson01.exercise02.recognize_not_go:
    instruction: Que signifie cette phrase ?
    correct_option: Je ne suis pas allé(e) au bureau parce que j’étais fatigué(e)
    distractors:
    - Je suis allé(e) au bureau parce que j’étais fatigué(e)
    - Je n’irai pas au bureau parce que je suis fatigué(e)
    - J’étais fatigué(e) parce que je ne suis pas allé(e) au bureau
    accepted_answers:
    - value: Je ne suis pas allé(e) au bureau parce que j’étais fatigué(e)
      status: correct
    feedback: '*چون خسته بودم* est la cause (parce que j’étais fatigué(e)) et *به دفتر نرفتم* est ce qui s’est passé (je ne suis pas allé(e) au bureau).'
  prs.a2.unit34.lesson01.exercise03.recognize_cold:
    instruction: Quelle est la cause dans cette phrase ?
    correct_option: Il fait froid
    distractors:
    - Je suis malade
    - Je suis occupé(e)
    - Je n’aime pas les parcs
    accepted_answers:
    - value: Il fait froid
      status: correct
    feedback: 'La cause vient après *چون* : *هوا سرد است* signifie « il fait froid ».'
  prs.a2.unit34.lesson01.exercise04.match_reason_words:
    instruction: Associe chaque mot dari à son sens.
    accepted_answers:
