        سرد: froid
        عذر: excuse
        مریض: malade
        برف: neige
        باران: pluie
      status: correct
    feedback: '*چرا* demande la cause et *چون* la donne. Les autres mots sont des causes courantes : un mal de tête, la fatigue, être occupé, le temps qu’il fait.'
    pairs:
    - left: چرا
      right: pourquoi
    - left: چون
      right: parce que
    - left: سردرد
      right: mal de tête
    - left: خسته
      right: fatigué
    - left: مصروف
      right: occupé(e)
    - left: هوا
      right: météo
    - left: سرد
      right: froid
    - left: عذر
      right: excuse
    - left: مریض
      right: malade
    - left: برف
      right: neige
    - left: باران
      right: pluie
  prs.a2.unit34.lesson01.exercise05.order_not_go_ill:
    instruction: 'Remets les mots dans l’ordre pour dire : je ne suis pas allé(e) au bureau parce que j’étais malade.'
    accepted_answers:
    - value:
      - به
      - دفتر
      - نرفتم
      - چون
      - مریض
      - بودم
      status: correct
    - value:
      - چون
      - مریض
      - بودم
      - به
      - دفتر
      - نرفتم
      status: correct
