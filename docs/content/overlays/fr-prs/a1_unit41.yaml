course:
  title: Dari A1
  description: 'Dari de Kaboul pour débutants : signaler la perte d’un objet personnel, demander s’il a été retrouvé, le décrire par sa couleur et sa taille, et lire un court texte sur un objet trouvé.'
units:
  prs.a1.unit41.lost_items:
    title: Objets perdus
    description: Signale la perte d’un objet personnel, demande s’il a été retrouvé, décris-le et reconnais-le quand on le retrouve.
