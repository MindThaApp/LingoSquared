  prs.a1.unit41.lesson06.wrap_up:
    title: Récapitulatif
teaching:
  prs.a1.unit41.lesson01.teach.review_this_is:
    title: 'Révision : ceci, est'
    gloss: ceci / est
    note: این et است sont des mots vus au début, qui servent à dire ce qu’est quelque chose.
    target_text: این (ceci) / است (est)
  prs.a1.unit41.lesson01.teach.review_have:
    title: 'Révision : j’ai'
    gloss: j’ai
    note: دارم est un mot de révision qui sert à dire quel objet tu possèdes ou portes sur toi.
    target_text: دارم (j’ai)
  prs.a1.unit41.lesson01.teach.bag_word:
    title: Sac
    gloss: sac
    note: خریطه est le mot courant en dari pour dire « sac ».
    example_gloss: J’ai un sac.
  prs.a1.unit41.lesson01.teach.wallet_word:
    title: Portefeuille
    gloss: portefeuille
    note: کیف پول signifie « portefeuille » ; le mot combine littéralement کیف (sac) et پول (argent).
    example_gloss: J’ai un portefeuille.
  prs.a1.unit41.lesson01.teach.key_word:
    title: Clé
    gloss: clé
    note: کلید signifie « clé ».
    example_gloss: J’ai une clé.
  prs.a1.unit41.lesson01.teach.glasses_word:
    title: Lunettes
    gloss: lunettes
    note: عینک signifie « lunettes ».
    example_gloss: J’ai des lunettes.
  prs.a1.unit41.lesson01.teach.lost_word:
    title: Est perdu
    gloss: est perdu
    note: 'گم شده combine گم (perdu) et شده (est devenu) : c’est la façon habituelle de dire qu’une chose est perdue, sur le même modèle que زخمی است (est blessé) de l’unité 40.'
    example_gloss: Mon sac est perdu.
  prs.a1.unit41.lesson01.teach.wallet_lost_phrase:
    title: Mon portefeuille est perdu !
    gloss: Mon portefeuille est perdu !
    note: کیف پولم combine کیف پول et le suffixe possessif -م (mon/ma), sur le même modèle que خانه‌ام (ma maison) vu dans les unités précédentes.
  prs.a1.unit41.lesson02.teach.review_can_help:
    title: 'Révision : pouvez-vous, moi, aide, faites (impératif de politesse)'
    gloss: pouvez-vous / moi / aide / faites
    note: می‌توانین, مه ره, کمک et کنین se combinent pour demander de l’aide.
    target_text: می‌توانین (pouvez-vous) / مه ره (moi) / کمک (aide) / کنین (faites — impératif de politesse)
  prs.a1.unit41.lesson02.teach.review_ra:
    title: 'Révision : (marque de l’objet)'
    gloss: (marque de l’objet)
    note: را marque la chose sur laquelle porte l’action, ici la chose qui a été vue.
    target_text: را (marqueur de l’objet)
  prs.a1.unit41.lesson02.teach.did_you_see_word:
    title: Avez-vous vu ?
    gloss: avez-vous vu
    note: دیدین est la forme de politesse (2e personne du pluriel) au passé de دیدن (voir), déjà croisé dans l’unité 2 avec از دیدن شما خوشحال شدم.
    example_gloss: Avez-vous vu mon sac ?
  prs.a1.unit41.lesson02.teach.did_you_see_my_bag_phrase:
    title: Avez-vous vu mon sac ?
    gloss: Avez-vous vu mon sac ?
    note: Combine خریطه‌ام (mon sac) avec را et دیدین pour demander si quelqu’un l’a remarqué.
  prs.a1.unit41.lesson02.teach.is_found_word:
    title: Est retrouvé / a été retrouvé
    gloss: est retrouvé / a été retrouvé
    note: 'پیدا شده combine پیدا (trouvé, disponible) et شده (est devenu) : c’est la façon habituelle de demander si une chose a été retrouvée.'
    example_gloss: Ma clé a été retrouvée.
  prs.a1.unit41.lesson02.teach.has_key_been_found_phrase:
    title: Ma clé a-t-elle été retrouvée ?
    gloss: Ma clé a-t-elle été retrouvée ?
    note: کلیدم combine کلید et le suffixe possessif -م (ma clé).
  prs.a1.unit41.lesson03.teach.review_color_black_white:
    title: 'Révision : couleur, noir, blanc, et'
    gloss: couleur / noir / blanc / et
    note: رنگ, سیاه, سفید et و servent à décrire la couleur d’un objet.
    target_text: رنگ (couleur) / سیاه (noir) / سفید (blanc) / و (et)
  prs.a1.unit41.lesson03.teach.review_size:
    title: 'Révision : grand, petit'
    gloss: grand / petit
    note: بزرگ et کوچک servent à décrire la taille d’un objet.
    target_text: بزرگ (grand) / کوچک (petit)
  prs.a1.unit41.lesson03.teach.here_word:
    title: Ici
    gloss: ici
    note: اینجا signifie « ici ».
    example_gloss: La clé est ici.
  prs.a1.unit41.lesson03.teach.bag_black_phrase:
    title: Mon sac est noir
    gloss: Mon sac est noir.
    note: خریطه‌ام (mon sac) suivi de سیاه (noir) décrit l’objet pour aider à l’identifier.
  prs.a1.unit41.lesson03.teach.wallet_small_black_phrase:
    title: Mon portefeuille est petit et noir
    gloss: Mon portefeuille est petit et noir.
    note: 'و (et) relie deux mots descriptifs : کوچک (petit) et سیاه (noir).'
  prs.a1.unit41.lesson04.teach.review_what_thanks:
    title: 'Révision : quoi, merci beaucoup'
    gloss: quoi / merci beaucoup
    note: چه et تشکر زیاد sont des mots de révision employés dans le dialogue.
    target_text: چه (quoi / que) / تشکر زیاد (merci beaucoup)
  prs.a1.unit41.lesson04.teach.review_yes_welcome:
    title: 'Révision : oui, je vous en prie'
    gloss: oui / je vous en prie
    note: بلی et خواهش می‌کنم sont des mots de révision employés dans le dialogue.
    target_text: بلی (oui) / خواهش می‌کنم (je vous en prie)
  prs.a1.unit41.lesson04.teach.dialogue_line1:
    title: 'Homayoun : Zarmina, mon sac est perdu !'
    gloss: Zarmina, mon sac est perdu !
  prs.a1.unit41.lesson04.teach.dialogue_line2:
    title: 'Zarmina : De quelle couleur est-il ?'
    gloss: De quelle couleur est-il ?
  prs.a1.unit41.lesson04.teach.dialogue_line3:
    title: 'Homayoun : Il est noir.'
    gloss: Il est noir.
  prs.a1.unit41.lesson04.teach.dialogue_line4:
    title: 'Zarmina : Oui, je l’ai vu ! Il est ici.'
    gloss: Oui, je l’ai vu ! Il est ici.
  prs.a1.unit41.lesson04.teach.dialogue_line5:
    title: 'Homayoun : Merci beaucoup !'
    gloss: Merci beaucoup !
  prs.a1.unit41.lesson04.teach.dialogue_line6:
    title: 'Zarmina : Je vous en prie.'
    gloss: Je vous en prie.
  prs.a1.unit41.lesson05.teach.review_one_have:
    title: 'Révision : un, il/elle a'
    gloss: un / il/elle a
    note: یک et دارد sont des mots de révision employés dans le texte de lecture.
    target_text: یک (un) / دارد (il / elle a)
  prs.a1.unit41.lesson05.teach.reading_passage:
    title: 'Lecture : un sac perdu'
    gloss: Homayoun a un sac. Son sac est noir. Son sac est perdu. Zarmina voit le sac. Le sac est ici !
  prs.a1.unit41.lesson06.teach.review_wrap_up_words:
    title: 'Révision : je n’ai pas, mais, vous (forme de politesse)'
    gloss: je n’ai pas / mais / vous (forme de politesse)
    note: ندارم, اما et شما sont des mots de révision employés pour opposer une possession à une absence et pour poser une question de politesse.
    target_text: ندارم (je n’ai pas) / اما (mais) / شما (vous, forme de politesse)
  prs.a1.unit41.lesson06.teach.contrast_phrase:
    title: J’ai la clé, mais je n’ai pas le sac
    gloss: J’ai la clé, mais je n’ai pas le sac.
    note: اما oppose le fait d’avoir la clé au fait de ne pas avoir le sac.
  prs.a1.unit41.lesson06.teach.formal_question_phrase:
    title: Avez-vous vu mon sac ?
    gloss: Avez-vous vu mon sac ?
    note: La version de politesse avec شما en tête, pour demander directement et poliment si quelqu’un a vu l’objet.
