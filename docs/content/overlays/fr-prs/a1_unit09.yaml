teaching:
  prs.a1.unit09.lesson01.teach.shanbe_yakshanbe:
    title: Samedi et dimanche
    gloss: Samedi, dimanche
    note: شنبه (samedi) est le premier jour de la semaine en Afghanistan ; یکشنبه (dimanche) vient ensuite.
    example_gloss:
    - Aujourd'hui, c'est samedi.
    - Demain, c’est dimanche.
  prs.a1.unit09.lesson01.teach.doshanbe_seshanbe:
    title: Lundi et mardi
    gloss: lundi, mardi
    note: دوشنبه et سه‌شنبه signifient littéralement « deuxième jour » et « troisième jour » après شنبه.
    example_gloss:
    - J’ai cours le lundi.
    - J’ai un rendez-vous mardi.
  prs.a1.unit09.lesson01.teach.chaharshanbe_panjshanbe:
    title: Mercredi et jeudi
    gloss: mercredi, jeudi
    note: 'چهارشنبه et پنجشنبه suivent le même modèle : « quatrième jour » et « cinquième jour ».'
    example_gloss:
    - Je travaille le mercredi.
    - On se voit jeudi.
  prs.a1.unit09.lesson01.teach.jomeh:
    title: vendredi
    gloss: vendredi
    note: جمعه est le jour de congé hebdomadaire en Afghanistan, l’équivalent d’un jour de week-end.
    example_gloss: Le vendredi est un jour de congé.
  prs.a1.unit09.lesson01.teach.tarikh_word:
    title: Date
    gloss: date
    note: تاریخ est le mot général pour une date du calendrier.
    example_gloss: Quelle est la date d’aujourd’hui ?
  prs.a1.unit09.lesson01.teach.va_word:
    title: Et
    gloss: et
    note: و est le mot de liaison courant, utilisé tout au long de cette unité.
    target_text: و (et)
  prs.a1.unit09.lesson01.teach.weekend_note:
    title: Le jour de congé hebdomadaire
    gloss: Le vendredi est le jour de repos de la semaine.
    note: En Afghanistan, le principal jour de congé hebdomadaire est *جمعه* (vendredi), et non le week-end du samedi et du dimanche ; le jeudi est souvent une demi-journée.
  prs.a1.unit09.lesson02.teach.hamal:
    title: Hamal (1er mois)
    gloss: Hamal, le premier mois du calendrier hégirien solaire (environ fin mars-avril)
    note: حمل ouvre l’année solaire afghane et coïncide avec le Norouz, le nouvel an.
    example_gloss: Hamal est le premier mois de l’année.
  prs.a1.unit09.lesson02.teach.sawr:
    title: Sawr (2e mois)
    gloss: Sawr, le deuxième mois (environ avril-mai)
    note: ثور vient après حمل.
    example_gloss: Il fait beau en Sawr.
  prs.a1.unit09.lesson02.teach.jawza:
    title: Jawza (3e mois)
    gloss: Jawza, le troisième mois (environ mai-juin)
    note: جوزا vient après ثور.
    example_gloss: Je suis né(e) en Jawza.
  prs.a1.unit09.lesson02.teach.calendar_note:
    title: Le calendrier de l’Afghanistan
    gloss: L’Afghanistan utilise le calendrier hégirien solaire (Hijri Shamsi).
    note: C’est le même calendrier solaire que celui utilisé en Iran ; il est différent du calendrier grégorien et du calendrier hégirien lunaire.
  prs.a1.unit09.lesson03.teach.what_day_today:
    title: Demander quel jour on est
    gloss: Quel jour sommes-nous aujourd’hui ?
    note: امروز چند شنبه است؟ signifie littéralement « aujourd’hui, c’est quel -shanbe ? » ; c’est la façon naturelle de demander le jour de la semaine.
  prs.a1.unit09.lesson03.teach.today_word:
    title: Aujourd’hui
    gloss: aujourd’hui
    note: امروز désigne le jour présent.
    example_gloss: Quelle est la date aujourd’hui ?
  prs.a1.unit09.lesson04.teach.give_full_date:
    title: Donner une date complète
    gloss: Aujourd’hui, c’est jeudi 15 Hamal.
    note: امروز پنجشنبه، پانزدهم حمل است associe le jour de la semaine, la date en nombre ordinal et le nom du mois.
  prs.a1.unit09.lesson05.teach.which_day_meeting:
    title: Demander quel jour a lieu un événement
    gloss: Quel jour a lieu la réunion ?
    note: جلسه کدام روز است؟ utilise کدام (quel) pour demander le jour d’un événement.
  prs.a1.unit09.lesson05.teach.which_date:
    title: Demander une date précise
    gloss: Quel jour de Hamal tombe lundi ?
    note: دوشنبه چندم حمل است؟ demande à quel numéro du mois correspond lundi.
  prs.a1.unit09.lesson06.teach.nozdahom:
    title: 19e
    gloss: 19e
    note: '*نوزدهم* est la forme ordinale de dix-neuf ; elle suit le même modèle que *پانزدهم* (15e).'
    example_gloss: Aujourd’hui, c’est le 19.
  prs.a1.unit09.lesson06.teach.turn01:
    title: Homayoun demande quel jour a lieu la réunion
    gloss: Homayoun demande à Bashir quel jour a lieu la réunion.
    note: جلسه کدام روز است؟ vu à la leçon 5.
  prs.a1.unit09.lesson06.teach.turn02:
    title: Bashir répond
    gloss: Bashir dit qu’il pense que c’est lundi.
    note: فکر می‌کنم (je pense) adoucit la réponse, car il n’en est pas tout à fait sûr.
  prs.a1.unit09.lesson06.teach.turn03:
    title: Homayoun demande la date exacte
    gloss: Homayoun demande quel jour de Hamal tombe lundi.
    note: دوشنبه چندم حمل است؟ vu à la leçon 5.
  prs.a1.unit09.lesson06.teach.turn04:
    title: Bashir donne la date exacte
    gloss: Bashir dit que lundi, c’est le 19 Hamal.
    note: '*دوشنبه نوزدهم حمل است* associe le jour, la date en nombre ordinal et le mois, selon le modèle de la leçon 4.'
  prs.a1.unit09.lesson06.teach.turn05:
    title: Homayoun propose vendredi
    gloss: Homayoun est d’accord et demande à Bashir s’il est libre vendredi.
    note: وقت داری؟ (as-tu du temps ?) est une façon naturelle de demander la disponibilité.
  prs.a1.unit09.lesson06.teach.turn06:
    title: Bashir dit qu’il est occupé
    gloss: 'Bashir répond non : il est occupé vendredi.'
    note: مصروف استم (je suis occupé) explique pourquoi vendredi ne convient pas.
  prs.a1.unit09.lesson06.teach.turn07:
    title: Homayoun confirme lundi
    gloss: Homayoun dit que ce n’est pas un problème et qu’il verra Bashir lundi.
    note: مشکل نیست (pas de problème) apaise le conflit d’emploi du temps avant de confirmer le projet initial de lundi.
