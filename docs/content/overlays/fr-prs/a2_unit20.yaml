course:
  title: Dari en français A2
  description: 'Dari afghan niveau pré-intermédiaire : parler de ses projets de vacances. Le présent avec un mot de temps pour les projets proches, قصد دارم + subjonctif pour les intentions, شاید + subjonctif pour le doute, la négation et les questions sur les projets.'
