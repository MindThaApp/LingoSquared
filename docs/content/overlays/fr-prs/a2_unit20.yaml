teaching:
  prs.a2.unit20.lesson01.teach.rkhst_rkhst_tabstan:
    title: Les vacances
    gloss: les vacances / les vacances d’été
    note: '*رخصتی* est le mot courant pour des vacances ou un congé, et *رخصتی تابستان* désigne les grandes vacances d’été. *تابستان* signifie « été ».'
    example_gloss:
    - En août, j’ai des vacances.
    - Les vacances d’été commencent en juillet.
  prs.a2.unit20.lesson01.teach.hfth_andh_sal:
    title: Quand quelque chose a lieu
    gloss: la semaine prochaine / l’année prochaine / bientôt
    note: '*آینده* signifie « prochain » et se place après le nom : *هفته آینده* veut dire « la semaine prochaine » et *سال آینده* « l’année prochaine ». *به‌زودی* signifie « bientôt ».'
    example_gloss:
    - La semaine prochaine, j’ai un rendez-vous.
    - L’année prochaine, je veux aller en Belgique.
    - Bientôt, j’ai des vacances.
  prs.a2.unit20.lesson01.teach.sfr_rdn_rzrw:
    title: Trois verbes de voyage
    gloss: voyager / réserver / rester
    note: '*سفر کردن* se compose de « voyage » + *کردن*, et *رزرو کردن* de « réservation » + *کردن*. Dans une phrase, seul *کردن* change : *سفر می‌کنم*, *رزرو می‌کنم*. *ماندن* signifie « rester ».'
    example_gloss:
    - J’aime voyager en train.
    - Je veux réserver une chambre.
    - Je reste une semaine.
  prs.a2.unit20.lesson01.teach.hwtl_m:
    title: Où loger
    gloss: l’hôtel / le camping
    note: '*هوتل* est l’orthographe afghane habituelle du mot « hôtel ». *کمپ* désigne un camping. On dort *در هوتل* ou *در کمپ*.'
    example_gloss:
    - L’hôtel est près de la plage.
    - Nous dormons au camping.
  prs.a2.unit20.lesson01.teach.dr_rkhst_tabstan:
    title: Demander les projets de vacances
    gloss: Que vas-tu faire pendant les vacances d’été ?
    note: 'Le dari n’a pas de tournure particulière pour les projets proches : on emploie le présent ordinaire *می‌کنی*, et le mot interrogatif *چه* se place avant le verbe, à la fin de la phrase.'
  prs.a2.unit20.lesson01.teach.dr_mah_ast:
    title: 'Les projets proches : le présent'
    gloss: En août, je vais voyager en Allemagne. Je vais réserver un hôtel.
    note: 'Pour dire ce que tu vas faire bientôt, le dari emploie le présent avec un mot de temps : *می‌روم* (je vais) avec *در ماه اگست* (en août). Ajoute au radical le préfixe du présent *می‌* et la terminaison *-م* : *رزرو می‌کنم*. Le verbe reste tout à la fin de la phrase, et le mot de temps peut venir en premier : *هفته آینده یک هوتل رزرو می‌کنم*. Sans mot de temps, la même forme peut aussi exprimer une habitude.'
  prs.a2.unit20.lesson01.teach.mn_hwtl_rzrw:
    title: Réserver un hôtel
    gloss: Je vais réserver un hôtel.
  prs.a2.unit20.lesson02.teach.wrs_rftn_w:
    title: Trois projets pour plus tard
    gloss: suivre un cours / déménager / économiser de l’argent
    note: '*کورس گرفتن* est l’expression figée pour « suivre un cours ». *کوچ کردن* signifie « déménager ».'
    example_gloss:
    - Je veux suivre un cours.
    - Mon oncle veut déménager.
    - Je veux économiser pour un nouveau vélo.
  prs.a2.unit20.lesson02.teach.bad_bad_az:
    title: Plus loin dans le temps
    gloss: plus tard / dans un mois
    note: '*بعد از یک ماه* signifie « dans un mois ». Cela fonctionne aussi avec d’autres durées : *بعد از یک هفته*.'
    example_gloss:
    - Plus tard, je veux acheter une maison.
    - Dans un mois, mon cours commence.
  prs.a2.unit20.lesson02.teach.bad_az_mah:
    title: Un cours qui commence
    gloss: Dans un mois, mon cours commence.
  prs.a2.unit20.lesson02.teach.mn_qsd_darm:
    title: 'Les intentions : قصد دارم + subjonctif'
    gloss: J’ai l’intention de suivre un cours.
    note: 'Pour dire ce que tu as l’intention de faire, utilise *قصد دارم* (j’ai l’intention) suivi du second verbe au subjonctif : *قصد دارم یک کورس بگیرم*. Le subjonctif se forme avec le préfixe *بـ* + le radical + la terminaison personnelle : *بـ* + *گیر* + *-م* = *بگیرم*. Les verbes composés avec *کردن* ne prennent pas *بـ* : *پس‌انداز کنم*. Emploie cette forme pour ce que tu veux faire, pas pour des arrangements déjà fixés.'
  prs.a2.unit20.lesson02.teach.mn_qsd_darm_2:
    title: Avoir l’intention de déménager
    gloss: J’ai l’intention de déménager.
  prs.a2.unit20.lesson02.teach.mn_qsd_darm_3:
    title: Avoir l’intention d’économiser
    gloss: J’ai l’intention d’économiser de l’argent.
  prs.a2.unit20.lesson02.teach.frda_bh_bazar:
    title: Présent ou قصد دارم ?
    gloss: Demain, je vais au marché. Plus tard, j’ai l’intention de déménager.
    note: 'Emploie le présent avec un mot de temps pour le futur proche et décidé : *فردا به بازار می‌روم*. Emploie *قصد دارم* + subjonctif pour une intention plus lointaine ou moins certaine : *بعد قصد دارم کوچ کنم*.'
  prs.a2.unit20.lesson03.teach.shad_htma:
    title: Peut-être et certainement
    gloss: peut-être / certainement
    note: '*شاید* exprime le doute et est suivi du subjonctif. *حتما* signifie « certainement » ou « à coup sûr ».'
    example_gloss:
    - Peut-être qu’il pleuvra demain.
    - Ce sera certainement amusant.
  prs.a2.unit20.lesson03.teach.amsal_an_tabstan:
    title: Cette année, cet été
    gloss: cette année / cet été
    note: '*امسال* est un mot unique pour « cette année ». *این تابستان* signifie « cet été » : *این* veut dire « ce/cet/cette » et se place avant le nom.'
    example_gloss:
    - Cette année, je ne pars pas en vacances.
    - Cet été, je reste à la maison.
    - Pars-tu en vacances cette année ?
  prs.a2.unit20.lesson03.teach.an_tabstan_dr:
    title: Rester à la maison
    gloss: Cet été, je reste à la maison.
  prs.a2.unit20.lesson03.teach.frda_ar_mnm:
    title: شاید et le subjonctif
    gloss: Demain, je travaille. Peut-être que j’irai ensuite au cinéma.
    note: 'Après *شاید*, le verbe est au subjonctif : *شاید بعد به سینما بروم* (*بـ* + le radical *رو* + *-م*), et non *می‌روم*. Le verbe reste à la fin de la phrase. Après un simple mot de temps, on emploie le présent ordinaire : *فردا کار می‌کنم*.'
  prs.a2.unit20.lesson03.teach.bh_rkhst_nmrwm:
    title: Dire que tu ne vas pas faire quelque chose
    gloss: Je ne pars pas en vacances. Je n’ai pas l’intention de déménager.
    note: 'Pour mettre le présent à la forme négative, place *ن* devant le préfixe du verbe : *می‌روم* devient *نمی‌روم* : *به رخصتی نمی‌روم*. Pour nier une intention, on nie *دارم* : *قصد ندارم کوچ کنم* (je n’ai pas l’intention de déménager) ; le second verbe reste au subjonctif.'
  prs.a2.unit20.lesson04.teach.ba_h_mdt:
    title: Deux expressions interrogatives
    gloss: avec qui / combien de temps
    note: '*با کی* demande avec qui on fait quelque chose ; *با* signifie « avec ». *چه مدت* interroge sur une durée.'
    example_gloss:
    - Avec qui vas-tu à la plage ?
    - Combien de temps restes-tu ?
  prs.a2.unit20.lesson04.teach.ja_mrw:
    title: Où vas-tu ?
    gloss: Où vas-tu ?
    note: '*کجا* signifie « où » et, avec un verbe de mouvement, aussi « vers où » : *کجا می‌روی؟* Le mot interrogatif se place au milieu de la phrase, juste avant le verbe.'
  prs.a2.unit20.lesson04.teach.ba_bh_rkhst:
    title: Avec qui ?
    gloss: Avec qui pars-tu en vacances ?
  prs.a2.unit20.lesson04.teach.h_mdt_anja:
    title: Combien de temps ?
    gloss: Combien de temps restes-tu là-bas ?
  prs.a2.unit20.lesson04.teach.ba_khwahrm_mrwm:
    title: Répondre
    gloss: J’y vais avec ma sœur.
  prs.a2.unit20.lesson04.teach.hfth_dw_hfth:
    title: Les semaines
    gloss: une semaine / deux semaines
    note: 'Après un nombre, le nom reste au singulier en dari : *دو هفته*, et non *دو هفته‌ها*.'
    example_gloss:
    - Je reste une semaine.
    - Nous restons deux semaines.
  prs.a2.unit20.lesson04.teach.ja_mrw_ba:
    title: Questions sur les projets
    gloss: Où vas-tu ? Avec qui y vas-tu ? Combien de temps vas-tu rester ?
    note: 'Les questions en dari gardent l’ordre normal des mots : place le mot interrogatif là où se trouverait la réponse et garde le verbe à la fin : *با کی به رخصتی می‌روی؟*, *چه مدت می‌مانی؟*. À un ami, le verbe se termine par *-ی* : *می‌روی*, *می‌مانی*.'
  prs.a2.unit20.lesson05.teach.slam_zrmnh_bhzwd:
    title: Un message de Maryam
    gloss: Salut Zarmina ! J’ai bientôt des vacances. En août, je pars en Belgique avec ma sœur et nous resterons une semaine dans un hôtel. Ensuite, j’irai deux jours chez mes parents. L’année prochaine, j’ai l’intention de suivre un cours, et peut-être que je déménagerai. Et toi ?
    note: 'Maryam décrit ses projets proches au présent et un projet à plus long terme avec *قصد دارم*. Remarque que chaque verbe se trouve à la fin de sa phrase : *می‌مانیم*, *بگیرم*, *کنم*.'
    glosses:
      به‌زودی: bientôt
      رخصتی: vacances
      اگست: Août
      خواهرم: sœur
      به: à, vers
      بلجیم: Belgique
      هوتل: hôtel
      می‌مانیم: rester
      بعد: ensuite
      والدینم: parents
      روز: jours
      آینده: prochain
      سال: année
      قصد: intention (قصد دارم = j’ai l’intention de)
      کورس: cours
      بگیرم: suivre (un cours)
      شاید: peut-être
      کوچ: déménager
      آن‌وقت: alors, à ce moment-là
      هم: aussi
  prs.a2.unit20.lesson06.teach.slam_hmawn_bra:
    title: Zarmina interroge Homayoun sur ses projets
    gloss: 'Zarmina : Salut Homayoun ! Tu as déjà des projets pour les vacances d’été ?'
  prs.a2.unit20.lesson06.teach.bl_dr_mah:
    title: Homayoun répond
    gloss: 'Homayoun : Oui ! En août, je vais en Allemagne. Je vais réserver un hôtel.'
  prs.a2.unit20.lesson06.teach.aal_ba_mrw:
    title: Zarmina demande avec qui il part
    gloss: 'Zarmina : Super ! Tu pars avec qui ?'
  prs.a2.unit20.lesson06.teach.ba_aam_ma:
    title: Homayoun dit avec qui et pour combien de temps
    gloss: 'Homayoun : Avec mon oncle. Nous allons rester une semaine.'
  prs.a2.unit20.lesson06.teach.w_bad_h:
    title: Zarmina demande ce qu’il fera ensuite
    gloss: 'Zarmina : Et ensuite ? Qu’est-ce que tu as l’intention de faire ?'
  prs.a2.unit20.lesson06.teach.sal_andh_qsd:
    title: Homayoun exprime une intention et pose la question en retour
    gloss: 'Homayoun : L’année prochaine, j’ai l’intention de suivre un cours. Et toi ?'
  prs.a2.unit20.lesson06.teach.dr_mah_jwla:
    title: Zarmina répond
    gloss: 'Zarmina : En juillet, je vais travailler. Peut-être que j’irai chez mes parents après.'
