course:
  title: Dari en français A2
  description: 'Dari afghan, niveau pré-intermédiaire : ouvrir un compte bancaire simple — vocabulaire, demande d’ouverture de compte, lecture d’un avis de la banque et conversation au guichet.'
units:
  prs.a2.unit11.banking:
    title: Ouvrir un compte bancaire
lessons:
  prs.a2.unit11.lesson01.banking_vocabulary:
    title: Les mots de la banque
  prs.a2.unit11.lesson02.requesting_an_account:
    title: Demander l’ouverture d’un compte
  prs.a2.unit11.lesson03.reading_a_bank_notice:
