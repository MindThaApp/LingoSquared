      right: banque
    - left: حساب بانکی
      right: compte bancaire
    - left: کارت بانکی
      right: carte bancaire
    - left: رمز
      right: code PIN
    - left: موجودی
      right: solde
    - left: امضا
      right: signature
  prs.a2.unit11.lesson01.exercise04.order_card_and_pin:
    instruction: Remets les mots dans l’ordre pour dire « carte bancaire et code PIN ».
    accepted_answers:
    - value:
      - کارت
      - بانکی
      - و
      - رمز
      status: correct
    feedback: '*کارت بانکی و رمز* relie les deux mots avec *و*.'
  prs.a2.unit11.lesson01.exercise05.write_signature:
    instruction: Écris le mot dari pour « signature ».
    accepted_answers:
    - value: امضا
      status: correct
    feedback: '*امضا* signifie « signature ».'
  prs.a2.unit11.lesson02.exercise01.recognize_request_account:
    instruction: Quelle phrase demande poliment à ouvrir un compte bancaire ?
    correct_option: Je voudrais ouvrir un compte bancaire.
    distractors:
    - Si vous avez votre tazkera et un reçu de loyer, vous pouvez ouvrir un compte.
    - Votre carte bancaire sera prête dans trois jours.
    - Le solde minimum du compte est de 500 afghanis.
    accepted_answers:
    - value: Je voudrais ouvrir un compte bancaire.
      status: correct
    feedback: '*می‌خواستم یک حساب بانکی باز کنم.* formule la demande de compte avec douceur.'
  prs.a2.unit11.lesson02.exercise02.order_card_ready_timeline:
    instruction: Remets les mots dans l’ordre pour dire que la carte sera prête d’ici trois jours.
    accepted_answers:
    - value:
      - کارت
      - بانکی‌تان
      - تا
      - سه
      - روز
      - دیگر
      - آماده
      - می‌شود
      status: correct
    feedback: '*کارت بانکی‌تان تا سه روز دیگر آماده می‌شود.* indique le délai.'
  prs.a2.unit11.lesson02.exercise03.dialogue_response_why_here:
    instruction: 'L’employé demande : « Que puis-je faire pour vous ? » Réponds que tu voudrais ouvrir un compte bancaire.'
    accepted_answers:
    - value: می‌خواستم یک حساب بانکی باز کنم.
      status: correct
    - value: می‌خواستم یک حساب بانکی باز کنم
      status: correct
    feedback: '*می‌خواستم یک حساب بانکی باز کنم.* est la demande polie.'
  prs.a2.unit11.lesson02.exercise04.translate_open_account:
    instruction: 'Traduis en dari : Je voudrais ouvrir un compte bancaire.'
    accepted_answers:
    - value: می‌خواستم یک حساب بانکی باز کنم.
      status: correct
    - value: می‌خواستم یک حساب بانکی باز کنم
      status: correct
    feedback: '*می‌خواستم یک حساب بانکی باز کنم.* est la demande polie.'
  prs.a2.unit11.lesson02.exercise05.write_if_documents:
    instruction: Écris que si tu as ta carte d’identité nationale et un reçu de loyer, tu peux ouvrir un compte.
    accepted_answers:
    - value: اگر تذکره و رسید کرایه خانه داشته باشین، می‌توانین حساب باز کنین.
      status: correct
    - value: اگر تذکره و رسید کرایه خانه داشته باشین. می‌توانین حساب باز کنین.
      status: correct
    - value: اگر تذکره و رسید کرایه خانه داشته باشین و می‌توانین حساب باز کنین
      status: correct
    feedback: Relier la condition et le résultat par une virgule, un point ou *و* est tout aussi naturel.
  prs.a2.unit11.lesson03.exercise01.read_required_documents:
    instruction: D’après l’avis, quels documents faut-il pour ouvrir un compte ?
    correct_option: une carte d’identité nationale et un reçu de loyer
    distractors:
    - un reçu de loyer seulement
    - un passeport et une photo
    - rien, juste ton nom
    accepted_answers:
    - value: une carte d’identité nationale et un reçu de loyer
      status: correct
    feedback: L’avis demande ta *تذکره* et un *رسید کرایه خانه*.
  prs.a2.unit11.lesson03.exercise02.read_minimum_balance:
    instruction: D’après l’avis, quel est le solde minimum du compte ?
    correct_option: 500 afghanis
    distractors:
    - 1000 afghanis
    - 50 afghanis
    - il n’y a pas de minimum
    accepted_answers:
    - value: 500 afghanis
      status: correct
    feedback: '*حداقل موجودی حساب پنجصد افغانی است* -- le solde minimum est de 500 afghanis.'
  prs.a2.unit11.lesson03.exercise03.recognize_fee_word:
    instruction: Que signifie ce mot ?
    correct_option: frais
    distractors:
    - minimum
    - solde
    - signature
    accepted_answers:
    - value: frais
      status: correct
    feedback: '*کارمزد* signifie « frais ».'
  prs.a2.unit11.lesson03.exercise04.order_minimum_balance:
    instruction: Remets les mots dans l’ordre pour dire que le solde minimum du compte est de 500 afghanis.
    accepted_answers:
    - value:
      - حداقل
      - موجودی
      - حساب
      - پنجصد
      - افغانی
      - است
      status: correct
    feedback: '*حداقل موجودی حساب پنجصد افغانی است* indique le solde minimum, exactement comme dans l’avis.'
  prs.a2.unit11.lesson03.exercise05.write_no_fee:
    instruction: Écris qu’il n’y a pas de frais mensuels.
    accepted_answers:
    - value: کارمزد ماهانه نیست.
      status: correct
    - value: کارمزد ماهانه نیست
      status: correct
    feedback: '*کارمزد ماهانه نیست.* dit qu’il n’y a pas de frais mensuels.'
  prs.a2.unit11.lesson04.exercise01.comprehend_required_documents:
    instruction: Qu’est-ce que l’employé demande à همایون ?
    correct_option: sa carte d’identité nationale et un reçu de loyer
    distractors:
    - un passeport seulement
    - un contrat de location seulement
    - rien du tout
    accepted_answers:
    - value: sa carte d’identité nationale et un reçu de loyer
      status: correct
    feedback: '*تذکره و یک رسید کرایه خانه دارین؟* -- l’employé demande les deux documents.'
  prs.a2.unit11.lesson04.exercise02.comprehend_card_ready:
    instruction: Quand la carte bancaire de همایون sera-t-elle prête ?
    correct_option: d’ici trois jours
    distractors:
    - d’ici un jour
    - d’ici une semaine
    - d’ici un mois
    accepted_answers:
    - value: d’ici trois jours
      status: correct
    feedback: '*کارت بانکی‌تان تا سه روز دیگر آماده می‌شود* -- d’ici trois jours.'
  prs.a2.unit11.lesson04.exercise03.recognize_pin_timing:
    instruction: Quand همایون recevra-t-il son code PIN ?
    correct_option: le jour même où il récupère la carte
    distractors:
    - le jour où il ouvre le compte
    - une semaine après que la carte est prête
    - il doit appeler pour le demander
    accepted_answers:
    - value: le jour même où il récupère la carte
      status: correct
    feedback: '*همان روزی که کارت را تحویل می‌گیرین* -- le jour même où vous récupérez la carte.'
  prs.a2.unit11.lesson04.exercise04.order_documents_question:
    instruction: Remets les mots dans l’ordre pour demander à quelqu’un s’il a sa carte d’identité nationale et un reçu de loyer.
    accepted_answers:
    - value:
      - تذکره
      - و
      - یک
      - رسید
      - کرایه
      - خانه
      - دارین
      status: correct
    feedback: '*تذکره و یک رسید کرایه خانه دارین؟* demande les deux documents.'
  prs.a2.unit11.lesson04.exercise05.dialogue_response_as_homayoun:
    instruction: 'L’employé demande : « Que puis-je faire pour vous ? » Réponds en tant que همایون.'
    accepted_answers:
    - value: می‌خواستم یک حساب بانکی باز کنم.
      status: correct
    - value: می‌خواستم یک حساب بانکی باز کنم
      status: correct
    feedback: '*می‌خواستم یک حساب بانکی باز کنم.* est la demande de همایون.'
  prs.a2.unit11.lesson04.exercise06.write_pin_summary:
    instruction: 'Dis, dans une phrase complète à la première personne, quand tu reçois le code PIN : le jour même où tu récupères la carte.'
    accepted_answers:
    - value: رمزش را همان روزی می‌گیرم که کارت را تحویل می‌گیرم.
      status: correct
    - value: رمزش را همان روزی می‌گیرم که کارت را تحویل می‌گیرم
      status: correct
    - value: رمزش را همان روزی که کارت را تحویل می‌گیرم می‌گیرم.
      status: correct
    - value: همان روزی که کارت را تحویل می‌گیرم، رمزش را می‌گیرم.
      status: correct
    - value: همان روزی که کارت را تحویل می‌گیرم رمزش را می‌گیرم
      status: correct
    feedback: '*رمزش را همان روزی می‌گیرم که کارت را تحویل می‌گیرم.* transforme la réponse de l’employé (*تحویل می‌گیرین*, « vous récupérez ») en phrase à la première personne (« je le reçois le jour où je récupère la carte »).'
