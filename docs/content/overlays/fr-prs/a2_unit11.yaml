teaching:
  prs.a2.unit11.lesson01.teach.bank_word:
    title: Banque
    gloss: banque
    note: '*بانک* est le mot courant pour « banque ».'
    example_gloss: La banque est près de la maison de Homayoun.
  prs.a2.unit11.lesson01.teach.account_word:
    title: Compte bancaire
    gloss: compte bancaire
    note: '*حساب بانکی* : *حساب* seul signifie aussi « compte » dans d’autres contextes.'
    example_gloss: Homayoun veut un compte bancaire.
  prs.a2.unit11.lesson01.teach.card_word:
    title: Carte bancaire
    gloss: carte bancaire
    note: '*کارت بانکی* : *کارت* seul est le mot général pour « carte ».'
    example_gloss: J’ai perdu ma carte bancaire.
  prs.a2.unit11.lesson01.teach.pin_word:
    title: code PIN
    gloss: code PIN / mot de passe
    note: '*رمز* désigne aussi bien un code PIN bancaire qu’un mot de passe en général.'
    example_gloss: J’ai oublié le code de ma carte bancaire.
  prs.a2.unit11.lesson01.teach.balance_word:
    title: Solde
    gloss: solde
    note: '*موجودی* est la somme d’argent qui se trouve actuellement sur un compte.'
    example_gloss: Le solde de mon compte est bas.
  prs.a2.unit11.lesson01.teach.signature_word:
    title: Signature
    gloss: signature
    note: '*امضا* désigne à la fois l’action de signer et la signature elle-même.'
    example_gloss: Veuillez signer ici.
  prs.a2.unit11.lesson01.teach.if_grammar:
    title: « Si » avec اگر
    gloss: Si vous avez votre tazkera, vous pouvez ouvrir un compte.
    note: '*اگر* introduit une proposition conditionnelle, un nouveau type de subordonnée à côté de *چون* (parce que).'
  prs.a2.unit11.lesson01.teach.open_account_word:
    title: Ouvrir un compte
    gloss: ouverture d’un compte
    note: '*باز کردن حساب* : *باز کردن* signifie « ouvrir ».'
  prs.a2.unit11.lesson01.teach.va_word:
    title: Et
    gloss: et
    note: '*و* est le mot de liaison courant utilisé dans toute cette unité.'
    target_text: و (et)
  prs.a2.unit11.lesson02.teach.request_account:
    title: Demander à ouvrir un compte
    gloss: Je voudrais ouvrir un compte bancaire.
    note: Reprend la formule de demande atténuée *می‌خواستم* déjà vue.
  prs.a2.unit11.lesson02.teach.if_documents:
    title: Indiquer les conditions requises, avec اگر
    gloss: Si vous avez votre tazkera et un reçu de loyer, vous pouvez ouvrir un compte.
    note: '*اگر... داشته باشین* : « si vous avez... » ; associe la nouvelle condition à *رسید کرایه خانه* (reçu de loyer).'
  prs.a2.unit11.lesson02.teach.card_ready_timeline:
    title: Dire quand la carte sera prête
    gloss: Votre carte bancaire sera prête dans trois jours.
    note: '*تا سه روز دیگر* signifie « d’ici trois jours ».'
  prs.a2.unit11.lesson03.teach.fee_word:
    title: Frais
    gloss: frais
    note: '*کارمزد* désigne des frais de service ou de transaction.'
    example_gloss: Ce compte n’a pas de frais.
  prs.a2.unit11.lesson03.teach.minimum_word:
    title: Minimum
    gloss: minimum
    note: '*حداقل* signifie « minimum » ou « au moins ».'
    example_gloss: Le solde minimum du compte est de 500 afghanis.
  prs.a2.unit11.lesson03.teach.notice_text:
    title: Un avis de la banque sur l’ouverture d’un compte
    gloss: Pour ouvrir un compte, veuillez apporter votre tazkera et un reçu de loyer. Le solde minimum du compte est de 500 afghanis. Il n’y a pas de frais mensuels.
    note: Un court avis officiel de la banque, dans le registre écrit formel que cette unité enseigne.
  prs.a2.unit11.lesson04.teach.turn01:
    title: L’employé accueille همایون
    gloss: L’employé l’invite à entrer et lui demande en quoi il peut l’aider.
    note: C’est la même formule d’accueil formelle qu’un employé de bureau utilise pour proposer son aide.
  prs.a2.unit11.lesson04.teach.turn02:
    title: همایون demande à ouvrir un compte
    gloss: همایون dit qu’il voudrait ouvrir un compte bancaire.
    note: C’est la même formule de demande polie *می‌خواستم* que précédemment.
  prs.a2.unit11.lesson04.teach.turn03:
    title: L’employé demande des documents
    gloss: L’employé demande s’il a sa carte d’identité nationale et un reçu de loyer.
    note: '*دارین؟* -- « avez-vous ? » -- la forme interrogative polie.'
  prs.a2.unit11.lesson04.teach.turn04:
    title: همایون confirme qu’il les a
    gloss: Oui, voici sa carte d’identité nationale et son reçu de loyer.
    note: '*این هم ...* (« voici ... ») s’utilise quand on tend quelque chose à quelqu’un.'
  prs.a2.unit11.lesson04.teach.turn05:
    title: L’employé confirme et donne le délai
    gloss: Bien. Sa carte bancaire sera prête d’ici trois jours.
    note: Répète le délai *تا سه روز دیگر آماده می‌شود* (« prête d’ici trois jours »).
  prs.a2.unit11.lesson04.teach.turn06:
    title: همایون pose une question sur le code PIN
    gloss: Il demande quand il recevra le code PIN.
    note: '*رمزش* -- « son code » -- ajoute le suffixe possessif *-ش* à *رمز*.'
  prs.a2.unit11.lesson04.teach.turn07:
    title: L’employé répond
    gloss: 'L’employé répond : le jour même où il récupère la carte.'
    note: '*همان روزی که ...* signifie « le jour même où ... ».'
  prs.a2.unit11.lesson04.teach.turn08:
    title: همایون remercie l’employé
    gloss: همایون remercie l’employé de son temps.
    note: '*تشکر از وقت‌تان* (« merci pour votre temps ») est une formule de politesse pour conclure.'
exercises:
  prs.a2.unit11.lesson01.exercise01.recognize_bank:
