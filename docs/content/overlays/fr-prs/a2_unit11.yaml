        بانک: banque
        حساب بانکی: compte bancaire
        کارت بانکی: carte bancaire
        رمز: code PIN
        موجودی: solde
        امضا: signature
      status: correct
    feedback: Ces six mots couvrent le vocabulaire de base de la visite à la banque de cette unité.
    pairs:
