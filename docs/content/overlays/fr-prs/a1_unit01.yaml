    accepted_answers:
    - value: وعلیکم سلام
      status: correct
    - value: و علیکم سلام
      status: correct
    - value: وعلیکم السلام
      status: correct
    - value: و علیکم السلام
      status: correct
    - value: سلام
      status: acceptable_with_note
      note: Réponse plus courte mais moins réciproque.
    feedback: Utilise وعلیکم سلام ou وعلیکم السلام comme réponse complète habituelle.
  prs.a1.unit01.lesson03.exercise01.translate_morning:
    instruction: 'Traduis en dari : Bonjour (le matin).'
    accepted_answers:
    - value: صبح بخیر
      status: correct
    - value: صبح به خیر
      status: acceptable_with_note
      note: Variante d’espacement courante.
    feedback: صبح بخیر signifie « bonjour » (le matin).
  prs.a1.unit01.lesson03.exercise02.recognize_day_reading:
    instruction: Que signifie cette expression ?
    correct_option: bonne journée (salutation en journée)
    distractors:
    - bonne nuit
    - bon après-midi / bonsoir
    - passe une bonne journée
    accepted_answers:
    - value: bonne journée (salutation en journée)
      status: correct
    feedback: روز بخیر signifie « bonjour » (en journée).
  prs.a1.unit01.lesson03.exercise03.evening_meaning:
