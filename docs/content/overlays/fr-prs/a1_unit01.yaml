course:
  title: Dari A1
  description: 'Dari afghan pour débutants : lecture de l’écriture perso-arabe, compréhension de la langue parlée courante en Afghanistan, salutations développées et première rencontre respectueuse dans un lieu de travail à Kaboul.'
units:
  prs.a1.unit01.greetings:
    title: Salutations et premières rencontres
lessons:
  prs.a1.unit01.lesson01.script_ramp:
    title: Lis les lettres utilisées dans cette unité
  prs.a1.unit01.lesson02.everyday_greetings:
    title: Échange des salutations courantes
  prs.a1.unit01.lesson03.time_and_farewells:
    title: Dis bonjour et au revoir selon le moment de la journée
  prs.a1.unit01.lesson04.formal_informal_small_talk:
    title: Fais la conversation de façon polie ou familière
  prs.a1.unit01.lesson05.afghan_hospitality:
    title: Demande des nouvelles d’une famille et montre du respect envers les invités
  prs.a1.unit01.lesson06.first_meeting_dialogue:
    title: Commence une première journée dans un lieu de travail à Kaboul
teaching:
  prs.a1.unit01.lesson01.teach.alef_be_te_dal:
    title: Les lettres ا، ب، ت et د
    gloss: a/ā, b, t et d
    note: Le dari s’écrit de droite à gauche. La lettre د ne se lie pas à la lettre suivante, à sa gauche.
  prs.a1.unit01.lesson01.teach.re_ze:
    title: Les lettres ر et ز
    gloss: r et z
    note: Aucune de ces deux lettres ne se lie à la lettre suivante.
  prs.a1.unit01.lesson01.teach.sin_shin_sad:
    title: Les lettres س، ش et ص
    gloss: s, ch et s
    note: س et ص notent toutes deux un son s en dari courant ; ش note le son ch.
  prs.a1.unit01.lesson01.teach.jim_che_he_khe:
    title: Les lettres ج، چ، ح et خ
    gloss: dj, tch, h et kh
    note: چ note le son tch. خ note le son habituellement transcrit kh.
  prs.a1.unit01.lesson01.teach.ayn_ghayn_fe_qaf:
    title: Les lettres ع، غ، ف et ق
    gloss: ʿ, gh, f et q
    note: La prononciation exacte de غ et de ق varie selon les locuteurs du dari ; distingue-les toujours à l’écrit.
  prs.a1.unit01.lesson01.teach.ke_gaf_lam_mim:
    title: Les lettres ک، گ، ل et م
    gloss: k, g, l et m
    note: ک est le kaf persan ; c’est la forme utilisée pour k en dari. ل et م se lient aux lettres qui les précèdent et qui les suivent.
  prs.a1.unit01.lesson01.teach.nun_vav_he_ye:
    title: Les lettres ن، و، ه et ی
    gloss: n, w/v/o/u, h et y/i long
    note: ی est le yé persan, utilisé pour y et pour la voyelle longue ī. و peut être une consonne (w/v) ou une voyelle longue (o/ou).
  prs.a1.unit01.lesson01.teach.connected_salam:
    title: Lis un mot lié
    gloss: bonjour
    note: Les lettres se lient pour former سلام. Les voyelles brèves sont normalement omises.
    example_gloss: Bonjour ! Je suis Karim.
  prs.a1.unit01.lesson02.teach.salam_alaikum:
    title: Une salutation courante et respectueuse
    gloss: Que la paix soit sur vous / bonjour
    note: سلام علیکم est très répandu en Afghanistan et convient aussi bien entre proches que dans les rencontres respectueuses.
  prs.a1.unit01.lesson02.teach.wa_alaikum_salam:
    title: Rends la salutation
    gloss: Et que la paix soit sur vous
    note: وعلیکم سلام est la réponse habituelle à سلام علیکم. Les formes contenant السلام sont aussi acceptées.
  prs.a1.unit01.lesson02.teach.salam:
    title: Une salutation brève
    gloss: bonjour
    note: سلام est une salutation brève d’emploi souple.
    example_gloss: Bonjour, comment allez-vous ?
  prs.a1.unit01.lesson02.teach.khosh_amadeed:
    title: Bienvenue
    gloss: bienvenue
    note: خوش آمدین est la formule de bienvenue respectueuse à l’oral, employée pour une seule personne ou pour plusieurs.
  prs.a1.unit01.lesson02.teach.tashakor:
    title: Merci
    gloss: merci
    note: تشکر est la forme afghane privilégiée dans ce cours. ممنون et ممنونم sont des variantes secondaires que l’on comprend.
    example_gloss: Merci beaucoup.
  prs.a1.unit01.lesson02.teach.khahesh:
    title: Une réponse soutenue à des remerciements
    gloss: avec plaisir
    note: خواهش می‌کنم est une réponse polie employée dans tout le monde persanophone. Elle n’est pas présentée comme un usage familier propre à l’Afghanistan.
  prs.a1.unit01.lesson02.teach.khoda_hafez:
    title: Au revoir
    gloss: au revoir
    note: خدا حافظ est une formule d’adieu courante en dari afghan ; elle s’écrit souvent en deux mots.
  prs.a1.unit01.lesson03.teach.sobh_bekheyr:
    title: Saluer le matin
    gloss: bonjour
    note: صبح بخیر s’emploie le matin.
  prs.a1.unit01.lesson03.teach.rooz_bekheyr:
    title: Salutation de la journée
    gloss: bonne journée
    note: روز بخیر est une salutation polie employée pendant la journée.
  prs.a1.unit01.lesson03.teach.asr_bekheyr:
    title: Salutation de fin de journée
    gloss: bon après-midi / bonsoir
    note: عصر بخیر convient à la fin de la journée.
  prs.a1.unit01.lesson03.teach.shab_bekheyr:
    title: Expression de la nuit
    gloss: bonne nuit
    note: شب بخیر sert plutôt à conclure une soirée qu’à ouvrir une rencontre ordinaire en journée.
  prs.a1.unit01.lesson03.teach.rooz_khosh:
    title: Un au revoir poli pour la journée
    gloss: bonne journée
    note: روز خوش est une formule d’adieu polie, assez soutenue et employée dans tout le monde persanophone, plutôt qu’une formule familière propre à l’Afghanistan.
  prs.a1.unit01.lesson03.teach.be_omide_didar:
    title: Jusqu’à la prochaine rencontre
    gloss: à bientôt, j’espère
    note: به امید دیدار est une formule d’adieu chaleureuse mais respectueuse.
  prs.a1.unit01.lesson04.teach.polite_question:
    title: Demande poliment comment va quelqu’un
    gloss: Comment allez-vous ?
    note: استین est une forme parlée polie courante en dari afghan, employée avec شما.
  prs.a1.unit01.lesson04.teach.informal_question:
    title: Demande à un camarade ou à un ami proche
    gloss: Comment allez-vous ?
    note: تو et استی sont des formes familières du singulier ; n’emploie pas automatiquement cette combinaison avec une personne âgée ou une nouvelle connaissance.
  prs.a1.unit01.lesson04.teach.good_answer:
    title: Dis que tu vas bien
    gloss: Je vais bien, merci.
    note: استم signifie « je suis ». C’est la forme parlée du dari afghan utilisée tout au long de ce cours.
  prs.a1.unit01.lesson04.teach.jor_answer:
    title: Dis que tu es en forme ou que tout va bien
    gloss: Ça va bien.
    note: جور évoque le fait d’aller bien ou d’être en bonne santé et revient souvent dans les salutations afghanes.
  prs.a1.unit01.lesson04.teach.not_bad:
    title: Une réponse réservée
    gloss: Je ne vais pas mal.
    note: بد نیستم est une réponse neutre.
  prs.a1.unit01.lesson04.teach.and_you:
    title: Renvoie la question
    gloss: Et vous ?
    note: و شما؟ garde l’échange respectueux et concis.
  prs.a1.unit01.lesson04.teach.everyone_well:
    title: Prolonge la salutation
    gloss: Tout le monde va bien ?
    note: Les salutations afghanes peuvent se poursuivre par des questions sur la maisonnée avant d’aborder les affaires.
  prs.a1.unit01.lesson05.teach.family_well:
    title: Demande des nouvelles de la famille de quelqu’un
    gloss: Votre famille va bien ?
    note: Demander des nouvelles de la famille fait souvent partie d’une salutation développée en Afghanistan. Le cours écrit la forme possessive فامیل‌تان.
  prs.a1.unit01.lesson05.teach.household_well:
    title: Demande des nouvelles des gens de la maison
    gloss: Tout le monde à la maison va bien ?
    note: اهل خانه désigne collectivement les membres de la maisonnée.
  prs.a1.unit01.lesson05.teach.everyone_well:
    title: Réponds à la question sur la famille
    gloss: Dieu merci, tout le monde va bien.
    note: Ici, شکر est une expression abrégée de gratitude, et non le mot « sucre » au sens alimentaire.
  prs.a1.unit01.lesson05.teach.zenda_bashin:
    title: Offre une réponse chaleureuse et polie
    gloss: Longue vie à vous / merci.
    note: زنده باشین est une formule de politesse afghane courante, souvent dite en réponse à des remerciements ou à des paroles aimables. باشین est la forme parlée de politesse pour « vous ».
  prs.a1.unit01.lesson05.teach.own_home:
    title: Accueille chaleureusement un invité
    gloss: Ici, vous êtes chez vous.
    note: خانهٔ خودتان است assure l’invité qu’il est le bienvenu.
  prs.a1.unit01.lesson05.teach.seat_of_honor:
    title: Propose la place d’honneur
    gloss: Veuillez prendre la place d’honneur.
    note: Dans la pièce où l’on reçoit les invités, بالا بفرمایین invite l’hôte vers la place la plus honorifique, éloignée de l’entrée. Cela ne veut pas forcément dire « à l’étage ».
  prs.a1.unit01.lesson05.teach.elders_first:
    title: Salue d’abord les aînés
    gloss: Nous saluons d’abord les aînés.
    note: Saluer d’abord les aînés est une marque de respect. Les gestes de salutation dépendent de la relation, du genre et des signes de chacun ; un apprenant ne doit pas supposer qu’une poignée de main convient.
  prs.a1.unit01.lesson06.teach.daftar:
    title: Bureau
    gloss: bureau
    note: دفتر désigne un bureau ou un lieu de travail.
    example_gloss: Mon bureau est à Kaboul.
  prs.a1.unit01.lesson06.teach.kabul:
    title: Kaboul
    gloss: Kaboul
    note: کابل est la capitale de l’Afghanistan et le cadre de ce dialogue.
    example_gloss: J’habite à Kaboul.
  prs.a1.unit01.lesson06.teach.line01:
    title: Hamed se présente comme le nouveau collègue
    gloss: Hamed dit qu’il est le nouveau collègue.
    note: Les deux interlocuteurs sont des collègues adultes, des hommes, qui se rencontrent dans un bureau à Kaboul.
  prs.a1.unit01.lesson06.teach.line02:
    title: Najib l’accueille et lui demande son nom
    gloss: Najib l’accueille et lui demande son nom.
    note: خوش آمدین est la formule d’accueil respectueuse de la langue parlée en dari ; elle s’emploie pour une ou plusieurs personnes.
  prs.a1.unit01.lesson06.teach.line03:
    title: Hamed donne son nom
    gloss: Hamed donne son nom.
    note: نامم حامد است (je m’appelle Hamed) est la forme courante à l’oral ; نامم est نام + -م (mon). À l’écrit, on trouve aussi نام من حامد است. Les deux formes sont correctes.
  prs.a1.unit01.lesson06.teach.line04:
    title: Najib se présente et dit qu’il est ravi de faire sa connaissance
    gloss: Najib se présente et dit qu’il est ravi de faire sa connaissance.
    note: از آشنایی با شما خوش شدم renvoie explicitement au fait de faire connaissance ; cette phrase convient donc à une première rencontre.
  prs.a1.unit01.lesson06.teach.line05:
    title: Hamed répond qu’il est lui aussi ravi et demande à Najib comment il va
    gloss: Hamed répond qu’il est lui aussi ravi et demande à Najib comment il va.
    note: L’échange garde le vouvoiement respectueux avec شما et استین entre nouveaux collègues.
  prs.a1.unit01.lesson06.teach.line06:
    title: Najib répond
    gloss: Najib dit qu’il va bien, merci.
    note: جور استم، تشکر répond à la question sur la santé, comme vu plus tôt dans cette unité.
  prs.a1.unit01.lesson06.teach.line07:
    title: Najib demande des nouvelles de la famille de Hamed
    gloss: Najib demande des nouvelles de la famille de Hamed.
    note: La question sur la maisonnée prolonge les salutations avant qu’ils passent au travail.
  prs.a1.unit01.lesson06.teach.line08:
    title: Hamed dit que tout le monde va bien
    gloss: Hamed dit que tout le monde va bien.
    note: شکر، همه جور استند répond à la question sur la famille, comme vu plus tôt dans cette unité.
  prs.a1.unit01.lesson06.teach.line09:
    title: Najib propose de présenter les autres collègues
    gloss: Najib propose de présenter les autres collègues.
    note: بفرمایین invite ici Hamed à suivre Najib, et non à s’asseoir ou à prendre quelque chose.
  prs.a1.unit01.lesson06.teach.line10:
    title: Hamed accepte en remerciant
    gloss: Hamed accepte en remerciant.
    note: بسیار خوب est présenté ici comme une réponse affirmative claire.
  prs.a1.unit01.lesson06.teach.line11:
    title: Najib répond chaleureusement et indique le bureau de Hamed
    gloss: Najib répond chaleureusement et indique le bureau de Hamed.
    note: Le dialogue se termine sur le début de la journée de travail, sans reprendre les formules d’adieu d’une visite à domicile.
  prs.a1.unit01.lesson06.teach.line12:
    title: Hamed le remercie
    gloss: Hamed le remercie.
    note: تشکر conclut l’échange simplement.
exercises:
