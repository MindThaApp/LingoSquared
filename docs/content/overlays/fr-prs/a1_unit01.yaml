      status: correct
    feedback: L’orthographe correcte est سلام.
  prs.a1.unit01.lesson02.exercise01.recognize_greeting_reading:
    instruction: Que signifie cette expression ?
    correct_option: bonjour (que la paix soit sur vous)
    distractors:
    - au revoir
    - bienvenue
    - merci
    accepted_answers:
    - value: bonjour (que la paix soit sur vous)
      status: correct
    feedback: سلام علیکم signifie « bonjour » (littéralement « que la paix soit sur vous »).
  prs.a1.unit01.lesson02.exercise02.translate_response:
    instruction: 'Traduis en dari : « Et que la paix soit aussi sur vous » (la réponse habituelle à سلام علیکم).'
    accepted_answers:
    - value: وعلیکم سلام
      status: correct
    - value: و علیکم سلام
      status: acceptable_with_note
      note: Variante d’espacement acceptée.
    - value: وعلیکم السلام
      status: acceptable_with_note
      note: Variante courante de la réponse complète.
    - value: و علیکم السلام
      status: acceptable_with_note
      note: Réponse complète courante avec conjonction séparée par un espace.
    feedback: وعلیکم سلام est la réponse habituelle ; les formes complètes courantes contenant السلام sont aussi valables.
  prs.a1.unit01.lesson02.exercise03.reply_greeting:
    instruction: Réponds à سلام علیکم.
    accepted_answers:
    - value: وعلیکم سلام
      status: correct
    - value: و علیکم سلام
      status: correct
    - value: وعلیکم السلام
      status: correct
    - value: و علیکم السلام
      status: correct
    - value: سلام
      status: acceptable_with_note
      note: Compréhensible, mais moins réciproque que la réponse complète.
    feedback: وعلیکم سلام et وعلیکم السلام sont des réponses complètes habituelles.
  prs.a1.unit01.lesson02.exercise04.welcome_meaning:
    instruction: Choisis le sens de خوش آمدین.
    correct_option: bienvenue
    distractors:
    - au revoir
    - merci
    - bonne nuit
    accepted_answers:
    - value: bienvenue
      status: correct
    feedback: خوش آمدین signifie « bienvenue ».
  prs.a1.unit01.lesson02.exercise05.produce_thanks:
    instruction: 'Traduis en dari : Merci.'
    accepted_answers:
    - value: تشکر
      status: correct
    - value: ممنون
      status: acceptable_with_note
      note: Compris en dari ; تشکر est la forme privilégiée dans ce cours.
    - value: ممنونم
      status: acceptable_with_note
      note: Compris en dari ; تشکر est la forme privilégiée dans ce cours.
    feedback: تشکر est la réponse afghane privilégiée dans ce cours.
  prs.a1.unit01.lesson02.exercise06.order_youre_welcome:
    instruction: Remets dans l’ordre la formule polie, employée dans toutes les régions, pour dire « De rien ».
    accepted_answers:
