  prs.a1.unit45.lesson02.bathroom_and_reservation:
    title: Salle de bain et réservation
  prs.a1.unit45.lesson03.room_number_and_nights:
    title: Numéro de chambre et nombre de nuits
  prs.a1.unit45.lesson04.hotel_checkin_dialogue:
    title: Dialogue d’enregistrement à l’hôtel
  prs.a1.unit45.lesson05.reading:
    title: 'Lecture : la réservation de Homayoun'
  prs.a1.unit45.lesson06.wrap_up:
    title: Récapitulatif
teaching:
  prs.a1.unit45.lesson01.teach.review_this_is_in:
    title: 'Révision : ceci, est, dans'
    gloss: ce / est / dans
    note: این, است et در (utilisés tout au long de ce cours) sont des mots de révision qui servent à parler des hôtels et des chambres.
    target_text: این (ceci) / است (est) / در (dans)
  prs.a1.unit45.lesson01.teach.hotel_word:
    title: Hôtel
    gloss: hôtel
    note: هوتل est le mot du dari afghan pour « hôtel », écrit avec un waw ; il diffère du هتل du persan d’Iran.
    example_gloss: C'est un hôtel.
  prs.a1.unit45.lesson01.teach.room_word:
    title: Pièce
    gloss: pièce
    note: اتاق est le mot courant en dari pour « chambre ».
    example_gloss: La chambre est dans l’hôtel.
  prs.a1.unit45.lesson01.teach.room_in_hotel_phrase:
    title: La chambre est dans l’hôtel
    gloss: La chambre est dans l’hôtel.
    note: اتاق در هوتل است combine des mots appris plus tôt dans cette leçon.
  prs.a1.unit45.lesson01.teach.key_word:
    title: Clé
    gloss: clé
    note: کلید est le mot standard en dari pour « clé ».
    example_gloss: C’est une clé.
  prs.a1.unit45.lesson01.teach.room_key_phrase:
    title: Clé de la chambre
    gloss: clé de la chambre
    note: کلید اتاق combine کلید (clé) et اتاق (chambre).
  prs.a1.unit45.lesson01.teach.this_is_room_key_phrase:
    title: C’est la clé de la chambre
    gloss: C’est la clé de la chambre.
    note: این کلید اتاق است combine des mots appris plus tôt dans cette leçon.
  prs.a1.unit45.lesson02.teach.review_have:
    title: 'Révision : j’ai, il/elle a'
    gloss: j’ai / il/elle a
    note: دارم et دارد sont des mots de révision utilisés pour poser des questions sur les équipements de la chambre.
    target_text: دارم (j’ai) / دارد (il / elle a)
  prs.a1.unit45.lesson02.teach.bathroom_word:
    title: Salle de bain
    gloss: salle de bains
    note: تشناب est le mot courant en dari pour « salle de bain » ou « toilettes ».
    example_gloss: La chambre a une salle de bain.
  prs.a1.unit45.lesson02.teach.room_has_bathroom_question_phrase:
    title: La chambre a-t-elle une salle de bain ?
    gloss: La chambre a-t-elle une salle de bain ?
    note: اتاق تشناب دارد؟ est une question fermée formée par l’intonation montante, sans mot interrogatif.
  prs.a1.unit45.lesson02.teach.yes_has_bathroom_phrase:
    title: Oui, elle a une salle de bain
    gloss: Oui, elle a une salle de bain.
    note: بلی est le mot de révision pour « oui ».
  prs.a1.unit45.lesson02.teach.reservation_word:
    title: Réservation
    gloss: réservation
    note: رزرو est un emprunt très répandu pour « réservation ».
    example_gloss: J’ai une réservation.
  prs.a1.unit45.lesson02.teach.have_reservation_phrase:
    title: J’ai une réservation
    gloss: J’ai une réservation.
    note: رزرو دارم combine رزرو (réservation) et دارم (j’ai).
  prs.a1.unit45.lesson03.teach.review_which_number_for:
    title: 'Révision : combien/quel numéro, pour, je veux'
    gloss: combien / quel numéro / pour / je veux
    note: چند, برای et می‌خواهم sont des mots de révision utilisés pour poser des questions sur la chambre.
    target_text: چند (combien / quel nombre) / برای (pour) / می‌خواهم (je veux)
  prs.a1.unit45.lesson03.teach.number_word:
    title: Numéro
    gloss: numéro
    note: نمبر est l’emprunt courant du dari afghan pour « numéro » ; on l’emploie pour les numéros de chambre, de téléphone, etc.
    example_gloss: numéro de chambre
  prs.a1.unit45.lesson03.teach.what_is_room_number_phrase:
    title: Quel est le numéro de la chambre ?
    gloss: Quel est le numéro de la chambre ?
    note: نمبر اتاق چند است؟ demande le numéro de la chambre à l’aide de چند.
  prs.a1.unit45.lesson03.teach.review_night_numbers:
    title: 'Révision : nuit, deux, trois'
    gloss: nuit / deux / trois
    note: شب, دو et سه sont des mots de révision utilisés pour indiquer la durée du séjour.
    target_text: شب (nuit) / دو (deux) / سه (trois)
  prs.a1.unit45.lesson03.teach.stay_word:
    title: Je reste
    gloss: je reste
    note: می‌مانم vient de ماندن, « rester ».
    example_gloss: Je reste deux nuits.
  prs.a1.unit45.lesson03.teach.stay_two_nights_phrase:
    title: Je reste deux nuits
    gloss: Je reste deux nuits.
    note: دو شب می‌مانم combine دو شب (deux nuits) et می‌مانم (je reste).
  prs.a1.unit45.lesson03.teach.for_two_nights_phrase:
    title: Je le veux pour deux nuits
    gloss: Je la veux pour deux nuits.
    note: برای دو شب می‌خواهم emploie برای (pour) avec le mot de révision می‌خواهم.
  prs.a1.unit45.lesson03.teach.review_stay_formal:
    title: 'Révision : vous restez (forme de politesse)'
    gloss: vous restez (forme de politesse)
    note: می‌مانین est la forme de politesse (pluriel) de می‌مانم, de la même famille en -ین que می‌خواهین et کنین ailleurs dans ce cours.
    target_text: می‌مانین (vous restez, forme de politesse)
  prs.a1.unit45.lesson03.teach.how_many_nights_formal_phrase:
    title: Combien de nuits restez-vous ?
    gloss: Combien de nuits restez-vous ?
    note: چند شب می‌مانین؟ est la question de politesse que poserait un réceptionniste d’hôtel.
  prs.a1.unit45.lesson04.teach.review_welcome_name_am:
    title: 'Révision : bienvenue, comment vous appelez-vous ?, je suis'
    gloss: bienvenue / comment vous appelez-vous ? / je suis
    note: خوش آمدین, نام‌تان چیست؟ et استم sont des mots de révision utilisés à l’enregistrement.
    target_text: خوش آمدین (bienvenue) / نام‌تان چیست؟ (comment vous appelez-vous ?) / استم (je suis)
  prs.a1.unit45.lesson04.teach.review_also_how_about_please_thanks:
    title: 'Révision : aussi, et pour, voici, merci beaucoup'
    gloss: aussi / et pour… ? / voici / merci beaucoup
    note: هم, چطور, بفرمایین et تشکر زیاد (vus dans des unités précédentes) sont des mots de révision utilisés pour conclure le dialogue.
    target_text: هم (aussi) / چطور (et comment / et… ?) / بفرمایین (tenez / je vous en prie) / تشکر زیاد (merci beaucoup)
  prs.a1.unit45.lesson04.teach.breakfast_phrase:
    title: Le petit-déjeuner
    gloss: petit-déjeuner
    note: چای صبح signifie littéralement « thé du matin » ; c’est la façon courante de dire « petit-déjeuner » en dari afghan, formée de چای (thé, unité 8) et صبح (matin, unité 16).
  prs.a1.unit45.lesson04.teach.included_word:
    title: Inclus
    gloss: inclus
    note: شامل signifie « inclus » et sert à dire qu’un service est compris avec la chambre.
    example_gloss: Le petit-déjeuner est inclus.
  prs.a1.unit45.lesson04.teach.wifi_word:
    title: Wi-Fi
    gloss: wifi
    note: وای‌فای est l’emprunt courant pour « wifi ».
    example_gloss: Il y a aussi le wifi.
  prs.a1.unit45.lesson04.teach.dialogue_line1:
    title: 'Homayoun : Bonjour. J’ai une réservation. Je reste deux nuits.'
    gloss: Bonjour. J’ai une réservation. Je reste deux nuits.
  prs.a1.unit45.lesson04.teach.dialogue_line2:
    title: 'Réceptionniste : Bienvenue. Quel est votre nom ?'
    gloss: Bienvenue. Quel est votre nom ?
  prs.a1.unit45.lesson04.teach.dialogue_line3:
    title: 'Homayoun : Je suis Homayoun.'
    gloss: Je suis Homayoun.
  prs.a1.unit45.lesson04.teach.dialogue_line4:
    title: 'Réceptionniste : Très bien. La chambre a une salle de bain et le petit-déjeuner est compris.'
    gloss: Très bien. La chambre a une salle de bain et le petit-déjeuner est compris.
  prs.a1.unit45.lesson04.teach.dialogue_line5:
    title: 'Homayoun : Et le wifi ?'
    gloss: Et le wifi ?
  prs.a1.unit45.lesson04.teach.dialogue_line6:
    title: 'Réceptionniste : Oui, il y a aussi le wifi. Voici la clé.'
    gloss: Oui, il y a aussi le wifi. Voici la clé.
  prs.a1.unit45.lesson05.teach.review_reading_words:
    title: 'Révision : réservation, numéro, cinq, lundi, mardi et « et »'
    gloss: réservation / numéro / cinq / lundi / mardi / et
    note: رزرو, نمبر (de cette unité), پنج, دوشنبه, سه‌شنبه et و sont des mots de révision utilisés dans le texte de lecture.
    target_text: رزرو (réservation) / نمبر (numéro) / پنج (cinq) / دوشنبه (lundi) / سه‌شنبه (mardi) / و (et)
  prs.a1.unit45.lesson05.teach.review_stays_third_person:
    title: 'Révision : il/elle reste'
    gloss: il/elle reste
    note: می‌ماند est la forme de la 3e personne de la famille می‌مانم/می‌مانین vue plus tôt dans cette unité.
    target_text: می‌ماند (il / elle reste)
  prs.a1.unit45.lesson05.teach.reading_passage:
    title: 'Lecture : la réservation d’Homayoun'
    gloss: 'Voici la réservation d’Homayoun. La chambre est le numéro cinq. Homayoun reste deux nuits : lundi et mardi. La chambre a une salle de bain et le petit-déjeuner est compris.'
  prs.a1.unit45.lesson06.teach.review_but_formal_you_hour_time_numbers:
    title: 'Révision : mais, vous (forme de politesse), heure, moment, sept, douze'
    gloss: mais / vous (politesse) / heure / moment / sept / douze
    note: اما, شما, ساعت, وقت (d’unités précédentes) et هفت/دوازده sont des mots de révision utilisés pour indiquer un horaire.
    target_text: اما (mais) / شما (vous, forme de politesse) / ساعت (heure) / وقت (temps / heure) / هفت (sept) / دوازده (douze)
  prs.a1.unit45.lesson06.teach.checkout_word:
    title: Départ (de l’hôtel) / sortie
    gloss: départ (de l’hôtel) / sortie
    note: خروج désigne le départ de l’hôtel, comme dans وقت خروج.
    example_gloss: heure de départ
  prs.a1.unit45.lesson06.teach.checkout_time_phrase:
    title: L’heure de départ est midi
    gloss: L’heure de départ est midi.
    note: وقت خروج ساعت دوازده است indique l’heure de départ de l’hôtel.
  prs.a1.unit45.lesson06.teach.contrast_breakfast_checkout_phrase:
    title: Le petit-déjeuner est à sept heures, mais le départ est à midi
    gloss: Le petit-déjeuner est à sept heures, mais l’heure de départ est midi.
    note: اما oppose l’heure du petit-déjeuner et l’heure de départ.
  prs.a1.unit45.lesson06.teach.checkout_time_question_phrase:
    title: Quelle est votre heure de départ ?
    gloss: Quelle est votre heure de départ ?
    note: La version de politesse, avec شما, pour demander l’heure de départ.
  prs.a1.unit45.lesson04.teach.review_very_good_tea_morning_and:
    target_text: بسیار خوب (très bien) / چای (thé) / صبح (matin) / و (et)
