course:
  title: Dari A1
  description: 'Dari de Kaboul débutant : s’enregistrer à l’hôtel, poser des questions sur la chambre (salle de bain, petit-déjeuner, wifi) et la clé, indiquer combien de nuits tu restes, lire une courte confirmation de réservation et demander l’heure de départ.'
units:
  prs.a1.unit45.accommodation:
    title: L’hôtel et la chambre
    description: S’enregistrer à l’hôtel, poser des questions sur la chambre et la clé, indiquer la durée du séjour, lire une confirmation de réservation et demander l’heure de départ.
lessons:
  prs.a1.unit45.lesson01.hotel_room_key_vocabulary:
