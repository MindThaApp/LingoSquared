course:
  title: Dari A1
  description: 'Dari afghan pour débutants : répondre au téléphone, se présenter lors d’un appel, demander de répéter ou de parler lentement, laisser un message et envoyer des SMS simples.'
units:
  prs.a1.unit07.communication:
    title: Parler au téléphone
lessons:
  prs.a1.unit07.lesson01.answering_the_phone:
    title: Répondre au téléphone
  prs.a1.unit07.lesson02.identifying_yourself:
    title: Se présenter lors d’un appel
  prs.a1.unit07.lesson03.asking_to_repeat_or_slow_down:
    title: Demander de répéter ou de parler plus lentement
  prs.a1.unit07.lesson04.leaving_a_message:
    title: Laisser un message
  prs.a1.unit07.lesson05.text_messages:
    title: Lire et écrire un SMS
  prs.a1.unit07.lesson06.phone_call_dialogue:
    title: Une conversation téléphonique complète
teaching:
  prs.a1.unit07.lesson01.teach.alo:
    title: Allô (au téléphone)
    gloss: allô
    note: الو s’emploie uniquement pour répondre au téléphone ou commencer un appel, à la différence de سلام, qu’on dit en personne.
    example_gloss: Allô, ici Karim.
  prs.a1.unit07.lesson01.teach.goosh_astam:
    title: Inviter l’appelant à continuer
    gloss: Oui, je vous écoute.
    note: بلی، بفرمایین est la façon naturelle de répondre après avoir décroché. Il reprend la formule de politesse بفرمایین (« je vous en prie », « allez-y ») déjà vue dans ce cours ; ce n’est pas une traduction littérale de « je vous écoute ».
  prs.a1.unit07.lesson01.teach.telephone_review:
    title: Téléphone (révision)
    gloss: téléphone
    note: تلفن a été introduit dans l’unité sur les nombres ; il sert ici de cadre à toute l’unité.
    example_gloss: Mon téléphone est en panne.
  prs.a1.unit07.lesson02.teach.who_speaking:
    title: Demander qui appelle
    gloss: Excusez-moi, qui est à l’appareil ?
    note: ببخشین، کی صحبت می‌کند؟ demande poliment l’identité de l’appelant.
  prs.a1.unit07.lesson02.teach.this_is_speaking:
    title: Se présenter
    gloss: C’est Farid.
    note: من فرید استم indique directement qui appelle, avec le même schéma en استم que dans les unités précédentes.
  prs.a1.unit07.lesson02.teach.colleague_context:
    title: Expliquer son lien avec la personne appelée
    gloss: Je suis un collègue de Homayoun.
    note: همکار همایون استم donne la raison de l’appel ; c’est utile quand la personne qui répond ne vous connaît pas.
  prs.a1.unit07.lesson03.teach.speak_slowly:
    title: Demander à quelqu’un de parler lentement
    gloss: Parlez lentement, s’il vous plaît.
    note: لطفاً آهسته صحبت کنین est une demande naturelle et polie quand la ligne est mauvaise ou quand on apprend la langue.
  prs.a1.unit07.lesson03.teach.repeat_review:
    title: Demander de répéter (révision)
    gloss: Pourriez-vous répéter ?
    note: می‌توانین دوباره بگویین؟ a été introduit dans l’unité sur les présentations ; il convient tout aussi bien au téléphone.
  prs.a1.unit07.lesson03.teach.combined_request:
    title: Combiner les deux demandes
    gloss: Parlez lentement, s’il vous plaît, et répétez.
    note: و relie les deux demandes en une seule phrase naturelle.
  prs.a1.unit07.lesson04.teach.payam_word:
    title: Message
    gloss: message
    note: پیام est le mot général pour « message », oral ou écrit.
    example_gloss: J’ai un message pour vous.
  prs.a1.unit07.lesson04.teach.want_to_leave_message:
    title: Dire qu’on veut laisser un message
    gloss: Je voudrais laisser un message.
    note: می‌خواهم یک پیام بگذارم se dit quand la personne que l’on appelle n’est pas disponible.
  prs.a1.unit07.lesson04.teach.will_call_later:
    title: Dire qu’on rappellera plus tard
    gloss: Je rappellerai plus tard.
    note: بعد زنگ می‌زنم est une alternative simple au fait de laisser un message.
  prs.a1.unit07.lesson05.teach.short_message:
    title: SMS
    gloss: SMS (message court)
    note: پیام کوتاه signifie littéralement « message court » ; c’est l’expression courante pour désigner un SMS.
  prs.a1.unit07.lesson05.teach.meeting_tomorrow:
    title: Un exemple de message
    gloss: Demain, la réunion est à neuf heures.
    note: فردا جلسه ساعت نه است est une information complète et naturelle à transmettre dans un message.
  prs.a1.unit07.lesson05.teach.will_deliver:
    title: Confirmer qu’on transmettra le message
    gloss: Je le transmettrai.
    note: می‌رسانم confirme que le message parviendra à son destinataire.
  prs.a1.unit07.lesson06.teach.turn01:
    title: Lima répond au téléphone
    gloss: Lima répond avec la formule du téléphone.
    note: الو؟ est la façon habituelle de répondre à un appel entrant.
  prs.a1.unit07.lesson06.teach.turn02:
    title: Farid la salue et vérifie son identité
    gloss: Farid la salue et lui demande si elle est Lima.
    note: الو، سلام associe la formule du téléphone à la salutation de tous les jours.
  prs.a1.unit07.lesson06.teach.turn03:
    title: Lima l’invite à continuer et demande qui appelle
    gloss: Lima l’invite à continuer et demande qui appelle.
    note: بلی، بفرمایین et کی صحبت می‌کند؟ ont été vus dans les leçons 1 et 2.
  prs.a1.unit07.lesson06.teach.turn04:
    title: Farid se présente
    gloss: Farid dit qu’il est un collègue de Homayoun.
    note: Cette phrase reprend le schéma du collègue vu dans la leçon 2 et donne à Lima une raison de faire confiance à l’appelant.
  prs.a1.unit07.lesson06.teach.turn05:
    title: Lima lui demande de parler lentement
    gloss: Lima le salue et lui demande de parler lentement.
    note: آهسته صحبت کنین، لطفاً reprend la demande de la leçon 3.
  prs.a1.unit07.lesson06.teach.turn06:
    title: Farid accepte et demande à laisser un message
    gloss: Farid accepte et dit qu’il voudrait laisser un message pour Homayoun.
    note: Cette phrase prolonge le schéma de پیام vu dans la leçon 4 en nommant un destinataire précis (برای همایون, « pour Homayoun »).
  prs.a1.unit07.lesson06.teach.turn07:
    title: Lima accepte de noter le message
    gloss: Lima l’invite à parler et dit qu’elle note.
    note: Ici, بفرمایین invite Farid à continuer de parler.
  prs.a1.unit07.lesson06.teach.turn08:
    title: Farid donne le contenu du message
    gloss: Farid lui demande de dire que la réunion est demain à neuf heures.
    note: Cette phrase reprend directement le message d’exemple de la leçon 5.
  prs.a1.unit07.lesson06.teach.turn09:
    title: Lima confirme et promet de transmettre le message
    gloss: Lima confirme les détails et dit qu’elle transmettra le message.
    note: می‌رسانم conclut la partie de l’appel consacrée au message, comme dans la leçon 5.
  prs.a1.unit07.lesson06.teach.turn10:
    title: Farid la remercie et lui dit au revoir
    gloss: Farid la remercie beaucoup et lui dit au revoir.
    note: تشکر زیاد et خدا حافظ reprennent du vocabulaire des unités précédentes.
  prs.a1.unit07.lesson06.teach.turn11:
    title: Lima dit au revoir
    gloss: Lima dit au revoir.
    note: خدا حافظ met fin à l’appel.
  prs.a1.unit07.lesson06.teach.past_tense_left:
    title: Dire que quelqu’un a laissé un message (passé)
    gloss: Farid a laissé un message.
    note: گذاشت est le passé simple (« a laissé ») du verbe employé dans می‌خواهم یک پیام بگذارم de la leçon 4, où بگذارم signifie « je laisse ». On l’utilise pour résumer ce qui s’est passé après un appel.
    target_text: فرید پیام گذاشت (Farid a laissé un message)
