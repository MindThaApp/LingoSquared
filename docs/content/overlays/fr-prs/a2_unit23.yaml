course:
  title: Dari en français A2
  description: 'Dari afghan de niveau intermédiaire inférieur : décrire comment était la vie autrefois, pendant l’enfance, dans un ancien logement ou un ancien travail, et comment elle est aujourd’hui. Le passé habituel (می‌ plus le radical du passé), sa forme négative, et le contraste avec le passé simple et le présent.'
units:
  prs.a2.unit23.how_it_used_to_be:
    title: Comment était la vie autrefois
lessons:
  prs.a2.unit23.lesson01.then_and_now_words:
    title: Les mots d’autrefois et d’aujourd’hui et la forme habituelle
  prs.a2.unit23.lesson02.more_verbs:
    title: Le passé habituel avec d’autres verbes
  prs.a2.unit23.lesson03.past_or_habit_or_now:
    title: Passé simple, passé habituel, présent et négation
  prs.a2.unit23.lesson04.my_old_life:
    title: 'Mon ancienne vie : quartier, école et travail'
  prs.a2.unit23.lesson05.reading_and_listening:
    title: 'Lecture et écoute : une enfance'
  prs.a2.unit23.lesson06.conversation_then_and_now:
    title: Une conversation sur autrefois et aujourd’hui
teaching:
  prs.a2.unit23.lesson01.teach.before:
    title: Avant, autrefois
    gloss: avant, autrefois, jadis
    note: '*قبلاً* renvoie à une époque antérieure de ta vie. C’est le mot qui ouvre la plupart des phrases sur « comment c’était avant » : *قبلاً در هرات زندگی می‌کردم.* Il ne rend pas à lui seul le verbe habituel ; c’est le verbe qui le fait, comme tu le verras plus bas.'
    example_gloss: Avant, je vivais à Hérat.
  prs.a2.unit23.lesson01.teach.now:
    title: Maintenant
    gloss: maintenant, à présent
    note: '*حالا* signifie maintenant, l’autre moitié de tout contraste entre autrefois et aujourd’hui. Après *حالا*, le verbe est au présent simple : *حالا در کابل زندگی می‌کنم.*'
    example_gloss: Maintenant, je vis à Kaboul.
  prs.a2.unit23.lesson01.teach.every_day:
    title: Chaque jour
    gloss: tous les jours
    note: '*هر* signifie chaque et *روز* signifie jour. *هر روز* est l’expression de temps la plus claire pour une habitude répétée, au passé comme au présent.'
    example_gloss: Chaque jour, j’allais à l’école.
  prs.a2.unit23.lesson01.teach.always:
    title: Toujours
    gloss: toujours
    note: '*همیشه* signifie toujours. Comme *هر روز*, il va naturellement avec une habitude et indique à l’interlocuteur que quelque chose s’est répété maintes fois.'
    example_gloss: Je jouais toujours avec mes amis.
  prs.a2.unit23.lesson01.teach.when_small:
    title: Quand j’étais petit
    gloss: quand j’étais petit, quand j’étais enfant
    note: '*وقتی* signifie quand, *کوچک* signifie petit et *بودم* signifie j’étais. Ensemble, *وقتی کوچک بودم* est la façon habituelle de commencer un récit sur son enfance.'
  prs.a2.unit23.lesson01.teach.school:
    title: École
    gloss: école
    note: '*مکتب* est le mot afghan courant pour école. Un élève se dit *شاگرد*, mais ici tu n’as besoin que de *مکتب*.'
    example_gloss: Je vais à l’école tous les jours.
  prs.a2.unit23.lesson01.teach.on_foot:
    title: À pied
    gloss: à pied
    note: '*پیاده* signifie à pied. Il se place avant le verbe : *پیاده به مکتب می‌رفتم* signifie j’allais à l’école à pied.'
    example_gloss: Je vais à l’école à pied.
  prs.a2.unit23.lesson01.teach.cities:
    title: Hérat, Kaboul
    gloss: Hérat, Kaboul
    note: '*هرات* et *کابل* sont deux villes afghanes. Les villes se construisent avec *در* (à, dans) : *در هرات* signifie à Hérat, *در کابل* signifie à Kaboul.'
    example_gloss:
    - Il ou elle est à Hérat.
    - Nous sommes à Kaboul.
  prs.a2.unit23.lesson01.teach.to_live:
    title: Vivre
    gloss: vivre, habiter quelque part
    note: '*زندگی کردن* signifie vivre, au sens d’habiter dans un lieu. *زندگی* est la vie et *کردن* est le verbe qui reçoit les terminaisons : *زندگی می‌کنم* veut dire « je vis ».'
    example_gloss: Nous vivons à Kaboul.
  prs.a2.unit23.lesson01.teach.go_paradigm:
    title: 'L’imparfait d’habitude : می + radical du passé + terminaisons'
    gloss: j’allais, tu allais, il ou elle allait, nous allions, vous alliez (formel ou pluriel), ils allaient
    note: 'Pour dire ce qui se passait régulièrement, place *می‌* devant le radical du passé et ajoute les mêmes terminaisons que celles du passé simple. Le radical du passé de *رفتن* (aller) est *رفت* (on enlève le *ن* final). Ainsi : *می‌رفتم* (j’allais), *می‌رفتی* (tu allais, à un ami), *می‌رفت* (il ou elle allait), *می‌رفتیم* (nous allions), *می‌رفتین* (vous alliez, formel ou pluriel) et *می‌رفتند* (ils allaient). Compare avec le passé simple *رفتم*, qui exprime un événement unique et terminé, et avec le présent *می‌روم*, qui utilise le radical du présent *رو*. L’imparfait d’habitude peut aussi se traduire par « j’allais » ou « j’avais l’habitude d’aller ». Le pronom (*من، تو، او*) est facultatif, car la terminaison indique déjà la personne. Ne confonds pas *می‌رفتم* et *می‌روم* : une seule lettre change avant la terminaison, mais le premier est au passé et le second au présent.'
  prs.a2.unit23.lesson01.teach.do_forms:
    title: 'Même règle, nouveau verbe : faire'
    gloss: je faisais, tu faisais, il ou elle faisait, nous faisions, vous faisiez (formel ou pluriel), ils faisaient
    note: '*کردن* (faire) a pour radical du passé *کرد*. L’imparfait d’habitude est *می‌کردم، می‌کردی، می‌کرد، می‌کردیم، می‌کردین، می‌کردند*. Ce verbe est très utile, car beaucoup de verbes dari sont formés d’un nom + *کردن* : *زندگی کردن* (vivre), *بازی کردن* (jouer), *کار کردن* (travailler). Le *می‌* et la terminaison se placent toujours sur *کردن*, jamais sur le nom : *زندگی می‌کردم*, « je vivais ».'
  prs.a2.unit23.lesson01.teach.zwnj:
    title: 'Orthographe : می‌ et نمی‌ sont suivis d’une demi-espace'
    gloss: j’allais et je n’allais pas
    note: 'À l’écrit, *می‌* et *نمی‌* sont des préfixes distincts : ils sont suivis d’un espace sans chasse (ZWNJ, la « demi-espace ») : *می‌رفتم*, *نمی‌رفتم*. Ils ne se lient pas au verbe et ne sont pas séparés par une vraie espace. Si tu écris avec un clavier persan, utilise la touche de demi-espace (souvent Maj + Espace) après *می* et *نمی*. La même demi-espace s’emploie dans le pluriel en *ها* et dans *آن‌ها*.'
  prs.a2.unit23.lesson02.teach.eat_paradigm:
    title: 'Même règle, nouveau verbe : manger'
    gloss: je mangeais, tu mangeais, il ou elle mangeait, nous mangions, vous mangiez (formel ou pluriel), ils mangeaient
    note: 'La règle de *رفتن* vaut pour les verbes réguliers. *خوردن* (manger) perd son *ن* et donne le radical du passé *خورد*. Place *می‌* devant et ajoute les terminaisons : *می‌خوردم، می‌خوردی، می‌خورد، می‌خوردیم، می‌خوردین، می‌خوردند*. La forme « il ou elle » est le radical nu précédé de *می‌* : *می‌خورد* signifie « il ou elle mangeait ».'
  prs.a2.unit23.lesson02.teach.tea:
    title: Le thé
    gloss: thé
    note: '*چای* est le thé, la boisson que les Afghans prennent à presque tous les repas. On dit *چای می‌خوری* pour « tu bois du thé », avec le verbe *خوردن*.'
    example_gloss: Chaque matin, je buvais du thé.
  prs.a2.unit23.lesson02.teach.morning:
    title: Matin
    gloss: matin, le matin
    note: '*صبح* est le matin. *هر روز صبح* signifie « chaque matin », et *هر شب* « chaque soir ».'
    example_gloss: Chaque matin, j’allais à l’école.
  prs.a2.unit23.lesson02.teach.night:
    title: Nuit
    gloss: nuit, soir
    note: '*شب* signifie nuit ou soir. *هر شب* veut dire « chaque soir ». C’est un mot de révision des unités sur la routine quotidienne.'
    example_gloss: Chaque soir, je lisais un livre.
  prs.a2.unit23.lesson02.teach.book:
    title: Livre
    gloss: livre
    note: '*کتاب* est un livre. Avec *خواندن* (lire), on dit *کتاب خواندن*, lire un livre. Avec le même verbe, on dit aussi *درس خواندن*, étudier.'
    example_gloss: Je lisais un livre.
  prs.a2.unit23.lesson02.teach.football:
    title: Jouer au football
    gloss: jouer au football
    note: '*بازی کردن* signifie jouer, et *فوتبال* est le football. Comme pour les autres verbes « nom + *کردن* », le *می‌* et la terminaison se placent sur *کردن* : *فوتبال بازی می‌کردم*.'
    example_gloss: Je jouais au football avec mes amis.
  prs.a2.unit23.lesson02.teach.after_school:
    title: Après l’école
    gloss: après l’école
    note: '*بعد از* signifie « après » et se construit avec un nom : *بعد از مکتب* veut dire « après l’école ».'
    example_gloss: Après l’école, je rentrais à la maison.
  prs.a2.unit23.lesson02.teach.friends:
    title: Mes amis
    gloss: mes amis
    note: '*دوستان* signifie « amis » et *-م* ajoute « mes » : *دوستانم* veut dire « mes amis », un mot de révision. « Avec » se dit *با* : *با دوستانم*.'
    example_gloss: Mes amis venaient chez nous.
  prs.a2.unit23.lesson02.teach.more_verbs:
    title: Quatre autres verbes, une seule règle
    gloss: voir, faire, venir, lire à l’imparfait d’habitude
    note: 'Tout verbe régulier suit la même forme : enlève le *ن* de l’infinitif et place *می‌* devant le radical du passé avec les terminaisons. *دیدن* (voir) donne *می‌دیدم*. *کردن* (faire) donne *می‌کردم*. *آمدن* (venir) donne *می‌آمدم* ; le radical du passé *آمد* garde son *آ* long après *می‌*, donc on écrit *می‌آمدم*, jamais *می‌امدم*. *خواندن* (lire ou étudier) donne *می‌خواندم*. Le dari parlé et le dari écrit utilisent cette forme.'
  prs.a2.unit23.lesson02.teach.be_have:
    title: Être et avoir au passé
    gloss: j’étais, tu étais, il ou elle était, nous étions, vous étiez (formel ou pluriel), ils étaient ; j’avais, tu avais, ...
    note: 'Le passé de *بودن* (être) est *بودم، بودی، بود، بودیم، بودین، بودند*, et celui de *داشتن* (avoir) est *داشتم، داشتی، داشت، داشتیم، داشتین، داشتند*. Ces deux verbes expriment des états : ils servent déjà de formes d’« habitude » et on n’ajoute normalement pas *می‌* : *وقتی کوچک بودم، یک بایسکل داشتم* signifie « quand j’étais petit, j’avais un vélo ».'
  prs.a2.unit23.lesson02.teach.bicycle:
    title: Vélo
    gloss: vélo
    note: '*بایسکل* est le mot afghan pour « vélo ». *یک* signifie « un » ou « une ».'
    example_gloss: Quand j’étais petit, j’avais un vélo.
  prs.a2.unit23.lesson03.teach.contrast:
    title: Un événement, une habitude, ou maintenant
    gloss: Un jour, je suis allé au bazar. Chaque jour, j’allais à l’école. Maintenant, je vais au bureau.
    note: 'Trois formes verbales peuvent se ressembler : demande-toi ce que dit la phrase. S’il s’agit d’UN événement unique et terminé, utilise le passé simple : *یک روز به بازار رفتم* (un jour, je suis allé au bazar). S’il s’agit de quelque chose qui se répétait dans le passé, utilise *می‌* + le radical du passé : *هر روز به مکتب می‌رفتم* (chaque jour, j’allais à l’école). Si c’est vrai maintenant, utilise *می‌* + le radical du présent : *حالا به دفتر می‌روم* (maintenant, je vais au bureau). Les mots de temps aident : *یک روز، دیروز* vont avec le passé simple ; *هر روز، همیشه، قبلاً* vont avec l’imparfait d’habitude ; *حالا* va avec le présent.'
  prs.a2.unit23.lesson03.teach.one_day:
    title: Un jour
    gloss: un jour, une fois
    note: '*یک روز* signifie « un jour ». Il introduit UN seul événement passé : le verbe est donc au passé simple, sans *می‌*.'
    example_gloss: Un jour, je suis allé au bazar.
  prs.a2.unit23.lesson03.teach.yesterday:
    title: Hier
    gloss: hier
    note: '*دیروز* signifie « hier ». Il renvoie à une journée terminée : le verbe est donc au passé simple : *دیروز به دفتر رفتم*.'
    example_gloss: Hier, je suis allé au bureau.
  prs.a2.unit23.lesson03.teach.office:
    title: Bureau
    gloss: bureau
    note: '*دفتر* est un bureau, un lieu de travail. On s’y rend avec *به*.'
    example_gloss: Maintenant, je vais au bureau tous les jours.
  prs.a2.unit23.lesson03.teach.bus:
    title: Autobus
    gloss: autobus
    note: '*بس* est le mot afghan pour « bus ». « Avec » se dit *با* : *با بس* signifie « en bus ».'
    example_gloss: Je vais au bureau en bus.
  prs.a2.unit23.lesson03.teach.neg_paradigm:
    title: 'L’imparfait d’habitude négatif : نمی + radical du passé'
    gloss: je n’allais pas, tu n’allais pas, il ou elle n’allait pas, nous n’allions pas, vous n’alliez pas (formel ou pluriel), ils n’allaient pas
    note: 'Pour dire que quelque chose n’arrivait PAS habituellement, mets *نمی‌* à la place de *می‌* : *نمی‌رفتم* (je n’allais pas, je n’allais jamais), *نمی‌رفتی، نمی‌رفت، نمی‌رفتیم، نمی‌رفتین، نمی‌رفتند*. Ne le confonds pas avec le passé simple négatif *نرفتم*, qui dit qu’un événement précis n’a pas eu lieu. Compare : *دیروز به مکتب نرفتم* (hier, je ne suis pas allé à l’école) et *جمعه به مکتب نمی‌رفتم* (le vendredi, je n’allais pas à l’école, par habitude). Écris-le avec la demi-espace : *نمی‌*.'
  prs.a2.unit23.lesson03.teach.no_longer:
    title: 'Ne plus : دیگر + négation'
    gloss: Je ne joue plus au football.
    note: '*دیگر* avec un verbe négatif signifie « ne ... plus » : *دیگر فوتبال بازی نمی‌کنم* veut dire « je ne joue plus au football ». Le verbe est au présent négatif *نمی‌کنم*, car la phrase parle d’aujourd’hui. Pour ce que tu faisais avant et as arrêté, on associe souvent les deux moitiés : *قبلاً هر روز فوتبال بازی می‌کردم، ولی دیگر بازی نمی‌کنم* (avant, je jouais au football tous les jours, mais je ne joue plus).'
  prs.a2.unit23.lesson04.teach.neighbourhood:
    title: Quartier
    gloss: quartier, secteur d’une ville
    note: '*محله* est le quartier, la partie de la ville où l’on habite. *قدیمی* signifie « vieux ».'
    example_gloss: Notre maison était dans un vieux quartier.
  prs.a2.unit23.lesson04.teach.old:
    title: Vieux
    gloss: vieux, ancien (pour un lieu ou une chose)
    note: '*قدیمی* signifie « vieux », « ancien », pour les choses et les lieux qui existent depuis longtemps. Il se place après le nom : *محلهٔ قدیمی*.'
    example_gloss: Nous avions une vieille maison.
  prs.a2.unit23.lesson04.teach.neighbours:
    title: Voisins
    gloss: voisins
    note: '*همسایه* est un voisin. Le pluriel prend la demi-espace : *همسایه‌ها*. Les voisins tiennent une grande place dans la vie d’un quartier afghan.'
    example_gloss: Les voisins venaient toujours chez nous.
  prs.a2.unit23.lesson04.teach.grandmother:
    title: Grand-mère
    gloss: grand-mère
    note: '*مادرکلان* est la grand-mère, le mot standard. *-م* ajoute « ma » : *مادرکلانم* veut dire « ma grand-mère ».'
    example_gloss: Le vendredi, nous allions rendre visite à ma grand-mère.
  prs.a2.unit23.lesson04.teach.fridays:
    title: Le vendredi
    gloss: le vendredi, chaque vendredi
    note: '*جمعه‌ها* (les vendredis, avec la demi-espace) signifie « chaque vendredi ». C’est une autre façon de dire que quelque chose se répétait.'
    example_gloss: Le vendredi, nous allions au parc.
  prs.a2.unit23.lesson04.teach.shop:
    title: Boutique
    gloss: boutique
    note: '*دوکان* est le mot afghan pour « boutique ». *در دوکان کار کردن* signifie « travailler dans une boutique ».'
    example_gloss: Avant, je travaillais dans une boutique.
  prs.a2.unit23.lesson04.teach.where_before:
    title: Où habitais-tu avant ?
    gloss: Où habitais-tu avant ?
    note: '*کجا* signifie « où ». Un ami demande *قبلاً کجا زندگی می‌کردی؟* avec l’imparfait d’habitude à la forme « tu » (ami). Pour quelqu’un que tu connais peu, dis *می‌کردین*.'
  prs.a2.unit23.lesson05.teach.street:
    title: Rue
    gloss: rue, route
    note: '*سرک* est le mot afghan pour « rue » ou « route ». On joue ou on marche *در سرک*, dans la rue.'
    example_gloss: Nous jouions dans la rue.
  prs.a2.unit23.lesson05.teach.yes:
    title: Oui
    gloss: oui
    note: '*بلی* signifie « oui » en dari, et son contraire est *نخیر* (non). Utilise *بلی* pour répondre à une question fermée.'
    example_gloss: Oui, j’y allais tous les jours.
  prs.a2.unit23.lesson05.teach.but:
    title: Mais
    gloss: mais
    note: '*ولی* oppose deux choses. Dans un récit « avant et maintenant », il relie souvent ce qui se faisait autrefois à ce qui est différent aujourd’hui.'
    example_gloss: J’y allais, mais maintenant je n’y vais plus.
  prs.a2.unit23.lesson05.teach.read_text:
    title: Une enfance à Hérat
    gloss: Quand j’étais petit, nous vivions à Hérat. Notre maison était dans un vieux quartier. Chaque matin, j’allais à l’école à pied. Après l’école, je jouais au football dans la rue avec mes amis. Le vendredi, nous allions rendre visite à ma grand-mère. Maintenant, je vis à Kaboul et je vais au bureau en bus. Je ne joue plus au football.
    note: 'Un court récit écrit sur une enfance à Hérat. Remarque le changement : l’imparfait d’habitude (*می‌رفتم، بازی می‌کردم، می‌رفتیم*) décrit l’ancienne vie et le présent (*زندگی می‌کنم، می‌روم*) décrit aujourd’hui. La dernière phrase, *دیگر فوتبال بازی نمی‌کنم*, dit ce qui a cessé.'
  prs.a2.unit23.lesson05.teach.audio_q:
    title: Salima demande à Javid comment c’était à l’école
    gloss: Javid, tu allais à l’école tous les jours ?
    note: Salima interroge sur une habitude passée avec l’imparfait d’habitude à la forme « tu » (ami), *می‌رفتی*. C’est une question fermée.
  prs.a2.unit23.lesson05.teach.audio_a:
    title: Javid répond
    gloss: Oui, j’y allais à pied tous les jours, mais le vendredi, je n’y allais pas.
    note: 'Javid dit d’abord ce qu’il faisait, puis ce qu’il ne faisait pas : *جمعه نمی‌رفتم*. L’imparfait d’habitude négatif *نمی‌رفتم* montre que le vendredi, il n’y allait jamais.'
  prs.a2.unit23.lesson06.teach.turn01:
    title: Salima demande à Javid où il habitait avant
    gloss: Javid, où habitais-tu avant ?
    note: Salima interroge sur le passé avec *می‌کردی*, l’imparfait d’habitude à la forme « tu » (ami).
  prs.a2.unit23.lesson06.teach.turn02:
    title: Javid décrit son enfance
    gloss: Quand j’étais petit, nous vivions à Hérat. Chaque jour, j’allais à l’école à pied, et après l’école, je jouais au football avec mes amis.
    note: 'Javid utilise l’imparfait d’habitude pour tout ce qui se répétait : *زندگی می‌کردیم، می‌رفتم، بازی می‌کردم*.'
  prs.a2.unit23.lesson06.teach.turn03:
    title: Salima demande ce qu’il en est aujourd’hui
    gloss: Tu joues encore au football maintenant ?
    note: '*حالا هم* interroge sur le présent : maintenant aussi ? Le verbe passe à *می‌کنی* (présent, « tu »).'
  prs.a2.unit23.lesson06.teach.turn04:
    title: Javid dit ce qui a changé
    gloss: Non, je ne joue plus au football. Maintenant, je vis à Kaboul et je vais au bureau en bus. Et toi ?
    note: '*دیگر ... نمی‌کنم* signifie « je ne ... plus ». Le reste de sa réponse est au présent, car il parle d’aujourd’hui. *تو چطور؟* est une façon courte de dire « et toi ? ».'
  prs.a2.unit23.lesson06.teach.turn05:
