    title: 'Révision : un, proche, est, je veux'
    gloss: un/une / proche / est / je veux
    note: یک, نزدیک, است et می‌خواهم sont des formes déjà vues, utilisées dans des demandes simples au guichet.
    target_text: یک (un/une) / نزدیک (près) / است (est) / می‌خواهم (je veux)
  prs.a1.unit35.lesson01.teach.want_stamp_phrase:
    title: Je voudrais un timbre
    gloss: Je voudrais un timbre.
    note: Utilise می‌خواهم pour une demande simple et polie.
