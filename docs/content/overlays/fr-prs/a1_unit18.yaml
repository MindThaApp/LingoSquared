  prs.a1.unit18.lesson06.teach.dialogue_line2:
    title: Negar répond
    gloss: Je suis médecin. Je travaille dans un hôpital.
  prs.a1.unit18.lesson06.teach.dialogue_line3:
    title: Bachir demande
    gloss: Vous travaillez tous les jours ?
  prs.a1.unit18.lesson06.teach.dialogue_line4:
    title: Negar répond
    gloss: Oui, je travaille tous les jours.
