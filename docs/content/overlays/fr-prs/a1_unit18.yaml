    note: دوکاندار est le terme standard en dari afghan pour « commerçant », déjà vu dans l’unité sur les achats de ce cours.
    example_gloss: Je suis commerçant.
  prs.a1.unit18.lesson01.teach.work_word:
    title: Travail / emploi
    gloss: travail / emploi
    note: کار signifie « travail » ou « emploi ».
    example_gloss: J’ai du travail.
  prs.a1.unit18.lesson01.teach.am_word:
    title: Je suis
    gloss: je suis
    note: استم est la copule polie de la première personne, conforme au registre استم/استین de ce cours.
    target_text: استم (je suis)
  prs.a1.unit18.lesson02.teach.office_word:
    title: Bureau
    gloss: bureau
    note: دفتر signifie « bureau ».
    example_gloss: Je travaille dans un bureau.
  prs.a1.unit18.lesson02.teach.shop_word:
    title: Boutique
    gloss: boutique
    note: دوکان signifie « boutique ».
    example_gloss: Je travaille dans une boutique.
  prs.a1.unit18.lesson02.teach.hospital_word:
    title: Hôpital
    gloss: hôpital
    note: شفاخانه est le terme authentique du dari afghan pour « hôpital », déjà vu dans l’unité sur les lieux de ce cours.
    example_gloss: Je travaille dans un hôpital.
  prs.a1.unit18.lesson02.teach.school_word:
    title: École
    gloss: école
    note: مکتب est le terme authentique du dari afghan pour « école », déjà vu dans l’unité sur les lieux de ce cours.
    example_gloss: Je travaille dans une école.
  prs.a1.unit18.lesson02.teach.in_word:
    title: Dans / à
    gloss: dans / à
    note: 'در indique le lieu où se passe quelque chose : در مکتب signifie « à l’école ».'
    target_text: در (dans / à)
  prs.a1.unit18.lesson02.teach.i_work_word:
    title: Je travaille
    gloss: je fais / je travaille
    note: 'می‌کنم est la première personne du présent de کردن (faire) : کار می‌کنم signifie littéralement « je fais du travail », c’est-à-dire « je travaille ».'
    target_text: کار می‌کنم (je travaille)
  prs.a1.unit18.lesson03.teach.where_word:
    title: Où
    gloss: où
    note: کجا signifie « où ».
