course:
  title: Dari A1
  description: 'Dari de Kaboul pour débutants : les métiers de base (enseignant, ingénieur, médecin, commerçant), les lieux de travail (bureau, boutique, hôpital, école), l’association d’un métier et d’un lieu, la lecture d’un court puis d’un plus long profil professionnel, et un dialogue pour demander le métier de quelqu’un.'
units:
  prs.a1.unit18.work:
    title: Le travail
    description: Indiquer un métier de base, un lieu de travail et une activité professionnelle simple.
