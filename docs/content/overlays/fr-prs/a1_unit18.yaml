    title: Est (3e personne)
    gloss: est
    note: 'است est la copule de la troisième personne : معلم است signifie « il/elle est enseignant(e) ».'
    target_text: است (est -- 3e personne)
  prs.a1.unit18.lesson04.teach.he_she_works_word:
    title: Il/elle travaille
    gloss: il/elle travaille
    note: 'می‌کند est la troisième personne du présent de کردن (faire) : کار می‌کند signifie « il/elle travaille ».'
    target_text: کار می‌کند (il/elle travaille)
  prs.a1.unit18.lesson04.teach.laila_word:
    title: Laïla
    gloss: Laïla
    note: Un personnage récurrent de ce cours, présenté pour la première fois dans l’unité sur les présentations.
    example_gloss: Laïla est enseignante.
  prs.a1.unit18.lesson04.teach.profile_text:
    title: Un court profil professionnel
    gloss: Laïla est enseignante. Elle travaille dans une école.
    note: Un court profil à la troisième personne qui indique un métier et un lieu de travail.
  prs.a1.unit18.lesson05.teach.every_word:
    title: Chaque
    gloss: chaque / tous les
    note: هر signifie « chaque » ou « tous les ».
    example_gloss: Je travaille tous les jours.
  prs.a1.unit18.lesson05.teach.day_word:
    title: Jour
    gloss: jour
    note: 'روز signifie « jour » : هر روز signifie « chaque jour » ou « tous les jours ».'
    example_gloss: Elle enseigne tous les jours.
  prs.a1.unit18.lesson05.teach.lesson_word:
    title: Leçon
    gloss: leçon / cours
    note: درس signifie « leçon » ou « cours ».
    example_gloss: Laïla enseigne.
  prs.a1.unit18.lesson05.teach.gives_word:
    title: Il/elle donne
    gloss: il/elle donne
    note: 'می‌دهد est la troisième personne du présent de دادن (donner) : درس می‌دهد signifie littéralement « donne des cours », c’est-à-dire « enseigne ».'
    target_text: می‌دهد (il/elle donne -- درس می‌دهد signifie « enseigne »)
  prs.a1.unit18.lesson05.teach.longer_profile_text:
    title: Un profil professionnel plus long
    gloss: Laïla est enseignante. Elle travaille dans une école. Elle enseigne tous les jours.
    note: Le même profil que dans la leçon précédente, complété par une activité quotidienne.
  prs.a1.unit18.lesson06.teach.names:
    title: Bachir et Negar
    gloss: Bachir, Negar
    note: Des personnages récurrents de ce cours.
    example_gloss:
    - Je suis Bachir.
    - Je suis Negar.
  prs.a1.unit18.lesson06.teach.you_word:
    title: Vous (politesse)
    gloss: vous
    note: شما est le pronom poli de la deuxième personne.
    target_text: شما (vous -- politesse)
