teaching:
  prs.a1.unit38.lesson01.teach.review_basics:
    title: 'Révision : couleur, est, noir, blanc, rouge'
    gloss: couleur / est / noir / blanc / rouge
    note: رنگ, است, سیاه, سفید et سرخ sont des mots de révision utilisés tout au long de cette unité.
    target_text: رنگ (couleur) / است (est) / سیاه (noir) / سفید (blanc) / سرخ (rouge)
  prs.a1.unit38.lesson01.teach.review_objects:
    title: 'Révision : ce/cette, chemise, voiture, livre, je, et, mais'
    gloss: ce / cette / chemise / voiture / livre / je / et / mais
    note: این, پیراهن, موتر, کتاب, من, و et اما sont des mots de révision utilisés pour construire les phrases sur les couleurs de cette unité.
    target_text: این (ce/cette) / پیراهن (chemise) / موتر (voiture) / کتاب (livre) / من (je/moi) / و (et) / اما (mais)
  prs.a1.unit38.lesson01.teach.abi_word:
    title: Bleu
    gloss: bleu
    note: آبی est le mot dari standard pour « bleu ».
    example_gloss: La voiture est bleue.
  prs.a1.unit38.lesson01.teach.zard_word:
    title: Jaune
    gloss: jaune
    note: زرد signifie « jaune ».
    example_gloss: Cette chemise est jaune.
  prs.a1.unit38.lesson01.teach.sabz_word:
    title: Vert
    gloss: vert
    note: سبز signifie « vert ».
    example_gloss: Le livre est vert.
  prs.a1.unit38.lesson01.teach.narenji_word:
    title: Orange
    gloss: orange
    note: نارنجی signifie « orange » (la couleur).
    example_gloss: Cette chemise est orange.
  prs.a1.unit38.lesson01.teach.blue_and_white_phrase:
    title: Ma chemise est bleue et blanche
    gloss: Ma chemise est bleue et blanche.
    note: و relie les deux couleurs en une seule phrase.
  prs.a1.unit38.lesson01.teach.black_but_orange_phrase:
    title: La voiture est noire, mais la chemise est orange
    gloss: La voiture est noire, mais la chemise est orange.
    note: اما oppose, dans une même phrase, les couleurs de deux objets différents.
  prs.a1.unit38.lesson02.teach.review_house:
    title: 'Révision : maison'
    gloss: maison
    note: خانه est un mot de révision utilisé dans les phrases de couleurs de cette leçon.
    target_text: خانه (maison)
  prs.a1.unit38.lesson02.teach.khakestari_word:
    title: Gris
    gloss: gris
    note: خاکستری signifie « gris ».
    example_gloss: La voiture est grise.
  prs.a1.unit38.lesson02.teach.banafsh_word:
    title: Violet
    gloss: violet
    note: بنفش signifie « violet ».
    example_gloss: Cette chemise est violette.
  prs.a1.unit38.lesson02.teach.qahwei_word:
    title: Marron
    gloss: marron
    note: 'قهوه‌یی vient de قهوه (café) : couleur café, c’est le mot dari standard pour « marron ».'
    example_gloss: La maison est marron.
  prs.a1.unit38.lesson02.teach.gray_and_brown_phrase:
    title: La maison est grise et marron
    gloss: La maison est grise et marron.
