    title: 'Révision : quoi/que, quel'
    gloss: que / quel
    note: چه et کدام sont des formes de révision utilisées pour poser des questions sur les couleurs.
    target_text: چه (quoi / que) / کدام (quel)
  prs.a1.unit38.lesson03.teach.what_color_question_phrase:
    title: De quelle couleur est ce livre ?
    gloss: De quelle couleur est ce livre ?
    note: 'این کتاب چه رنگ است؟ signifie littéralement « ce livre est de quelle couleur ? » : c’est la façon naturelle de demander la couleur de quelque chose.'
  prs.a1.unit38.lesson03.teach.review_like_formal:
    title: 'Révision : tu aimes (forme de politesse), la marque de l’objet'
    gloss: vous aimez / marque de l’objet
    note: دوست دارین et را sont des formes déjà vues, utilisées ici pour demander quelle couleur on préfère.
    target_text: دوست دارین (vous aimez, formel) / را (marque de l’objet)
  prs.a1.unit38.lesson03.teach.which_color_like_question_phrase:
    title: Quelle couleur aimez-vous ?
    gloss: Quelle couleur aimez-vous ?
    note: کدام رنگ را دوست دارین؟ signifie littéralement « quelle couleur [marque de l’objet] aimez-vous ? ».
  prs.a1.unit38.lesson03.teach.i_like_green_phrase:
    title: J’aime la couleur verte
    gloss: J’aime la couleur verte.
    note: دوست دارم est la forme de la première personne du verbe دوست داشتن (aimer).
  prs.a1.unit38.lesson04.teach.review_dialogue_words:
    title: 'Révision : vous (forme de politesse)'
    gloss: vous (formel)
    note: شما est un mot déjà vu, utilisé dans le dialogue sur les couleurs.
    target_text: شما (vous, formel)
  prs.a1.unit38.lesson04.teach.dialogue_line1:
    title: 'Homayoun : Zarmina, de quelle couleur est votre voiture ?'
    gloss: Zarmina, de quelle couleur est votre voiture ?
  prs.a1.unit38.lesson04.teach.dialogue_line2:
    title: 'Zarmina : Ma voiture est bleue.'
    gloss: Ma voiture est bleue.
  prs.a1.unit38.lesson04.teach.dialogue_line3:
    title: 'Homayoun : De quelle couleur est votre chemise ?'
    gloss: De quelle couleur est votre chemise ?
  prs.a1.unit38.lesson04.teach.dialogue_line4:
    title: 'Zarmina : Ma chemise est verte et blanche.'
    gloss: Ma chemise est verte et blanche.
  prs.a1.unit38.lesson04.teach.dialogue_line5:
    title: 'Homayoun : Quelle couleur aimez-vous ?'
    gloss: Quelle couleur aimez-vous ?
  prs.a1.unit38.lesson04.teach.dialogue_line6:
    title: 'Zarmina : J’aime la couleur bleue.'
    gloss: J’aime la couleur bleue.
  prs.a1.unit38.lesson05.teach.review_reading_words:
    title: 'Révision : il/elle, pièce, table, il/elle aime'
    gloss: il/elle / pièce / table / il/elle aime
    note: او, اتاق et میز sont des mots déjà vus ; دوست دارد est la forme de la troisième personne de دوست داشتن (aimer), employée plus tôt dans ce cours pour d’autres personnes.
    target_text: او (il/elle) / اتاق (chambre, pièce) / میز (table) / دوست دارد (il/elle aime)
  prs.a1.unit38.lesson05.teach.reading_passage:
    title: 'Lecture : la maison de Zarmina'
    gloss: Voici la maison de Zarmina. Sa maison est blanche et bleue. Sa chambre est verte. Sa table est marron. Elle aime la couleur verte.
  prs.a1.unit38.lesson06.teach.review_like_dislike:
    title: 'Révision : j’aime, je n’aime pas'
    gloss: j’aime / je n’aime pas
    note: دوست دارم et دوست ندارم sont les formes affirmative et négative déjà vues de دوست داشتن (aimer), introduites à la leçon 3 et ici mises en contraste avec اما dans cette leçon de synthèse.
    target_text: دوست دارم (j’aime) / دوست ندارم (je n’aime pas)
  prs.a1.unit38.lesson06.teach.contrast_phrase:
    title: J’aime le rouge, mais je n’aime pas le noir
    gloss: J’aime le rouge, mais je n’aime pas le noir.
    note: اما oppose une couleur que l’on aime à une couleur que l’on n’aime pas, avec دوست دارم et دوست ندارم dans la même phrase.
  prs.a1.unit38.lesson06.teach.formal_question_phrase:
    title: Quelle couleur aimez-vous ?
    gloss: Quelle couleur aimez-vous ?
    note: Ajoute شما (vous, forme de politesse) à la même question que dans les leçons 3 et 4, posée maintenant directement à toi.
