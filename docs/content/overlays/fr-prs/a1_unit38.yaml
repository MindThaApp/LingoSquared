course:
  title: Dari A1
  description: 'Dari de Kaboul pour débutants : identifier et décrire les couleurs des objets du quotidien, demander de quelle couleur est quelque chose, dire et demander ses préférences de couleur, et décrire la maison d’une personne dans un court texte.'
units:
