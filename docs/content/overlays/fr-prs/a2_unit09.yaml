      - سند
      - و
      - آدرس
      status: correct
    feedback: '*سند و آدرس* relie les deux mots avec *و*.'
  prs.a2.unit09.lesson01.exercise05.write_tazkira:
    instruction: Écris en dari le mot pour la carte d’identité nationale.
    accepted_answers:
    - value: تذکره
      status: correct
    feedback: '*تذکره* signifie la carte d’identité nationale.'
  prs.a2.unit09.lesson02.exercise01.recognize_request_appointment:
    instruction: Quelle phrase demande poliment un rendez-vous ?
    correct_option: Je voudrais prendre rendez-vous pour changer mon adresse.
    distractors:
    - Comme j’ai déménagé, je dois changer mon adresse.
    - Pourriez-vous me dire ce que je dois apporter ?
    - J’apporterai la quittance de loyer.
    accepted_answers:
    - value: Je voudrais prendre rendez-vous pour changer mon adresse.
      status: correct
    feedback: '*می‌خواستم برای تغییر آدرس وقت بگیرم.* demande le rendez-vous avec politesse.'
  prs.a2.unit09.lesson02.exercise02.recognize_because_clause:
    instruction: Quelle phrase donne une raison avec « parce que » ?
    correct_option: Comme j’ai déménagé, je dois changer mon adresse.
    distractors:
    - Je voudrais prendre rendez-vous pour changer mon adresse.
    - Pourriez-vous me dire ce que je dois apporter ?
    - Le délai d’enregistrement court jusqu’à la fin de ce mois.
    accepted_answers:
    - value: Comme j’ai déménagé, je dois changer mon adresse.
      status: correct
    feedback: '*چون* introduit la proposition de cause.'
  prs.a2.unit09.lesson02.exercise03.order_what_should_i_bring:
    instruction: Remets les mots dans l’ordre pour demander poliment ce que tu dois apporter.
    accepted_answers:
    - value:
      - می‌شود
      - بگویین
      - چه
      - چیزی
      - باید
      - بیاورم
      status: correct
    feedback: '*می‌شود بگویین چه چیزی باید بیاورم؟* demande poliment ce qu’il faut apporter.'
  prs.a2.unit09.lesson02.exercise04.dialogue_response_why_change:
    instruction: 'L’employé demande : « Pourquoi devez-vous changer votre adresse ? » Réponds en donnant ta raison.'
    accepted_answers:
    - value: چون خانه‌ام را عوض کردم، باید آدرسم را عوض کنم.
      status: correct
    - value: چون خانه‌ام را عوض کردم. باید آدرسم را عوض کنم.
      status: correct
    - value: چون خانه‌ام را عوض کردم و باید آدرسم را عوض کنم
      status: correct
    feedback: Relier la cause et le résultat par une virgule, un point ou *و* est tout aussi naturel.
  prs.a2.unit09.lesson02.exercise05.write_appointment_request:
    instruction: Écris que tu voudrais prendre rendez-vous pour changer ton adresse.
    accepted_answers:
    - value: می‌خواستم برای تغییر آدرس وقت بگیرم.
      status: correct
    - value: می‌خواستم برای تغییر آدرس وقت بگیرم
      status: correct
    feedback: '*می‌خواستم برای تغییر آدرس وقت بگیرم.* est la demande polie.'
  prs.a2.unit09.lesson03.exercise01.read_required_documents:
    instruction: Selon l’avis, quels documents faut-il apporter pour l’enregistrement ?
    correct_option: la carte d’identité nationale et une quittance de loyer
    distractors:
    - seulement une quittance de loyer
    - un passeport et une photo
    - rien, juste votre nom
    accepted_answers:
    - value: la carte d’identité nationale et une quittance de loyer
      status: correct
    feedback: L’avis demande votre *تذکره* et une *رسید کرایه خانه*.
  prs.a2.unit09.lesson03.exercise02.read_deadline:
    instruction: Selon l’avis, quel est le délai d’enregistrement ?
    correct_option: jusqu’à la fin de ce mois
    distractors:
    - jusqu’à la fin de cette semaine
    - jusqu’à la fin du mois prochain
    - il n’y a pas de délai
    accepted_answers:
    - value: jusqu’à la fin de ce mois
      status: correct
    feedback: '*مهلت ثبت تا آخر همین ماه است* — le délai est la fin de ce mois.'
  prs.a2.unit09.lesson03.exercise03.recognize_deadline_word:
    instruction: Que signifie ce mot ?
    correct_option: délai
    distractors:
    - quittance de loyer
    - carte d’identité nationale (livret)
    - mairie
    accepted_answers:
    - value: délai
      status: correct
    feedback: '*مهلت* signifie « délai ».'
  prs.a2.unit09.lesson03.exercise04.order_bring_documents:
    instruction: Remets les mots dans l’ordre pour dire « apportez la carte d’identité nationale et une quittance de loyer ».
    accepted_answers:
    - value:
      - تذکره
      - و
      - یک
      - رسید
      - کرایه
      - خانه
      - بیارین
      status: correct
    feedback: '*تذکره و یک رسید کرایه خانه بیارین* est la liste exigée, identique à celle de l’avis.'
  prs.a2.unit09.lesson03.exercise05.write_will_bring_receipt:
    instruction: Écris que tu apporteras la quittance de loyer.
    accepted_answers:
    - value: رسید کرایه خانه را می‌آورم.
      status: correct
    - value: رسید کرایه خانه را می‌آورم
      status: correct
    feedback: '*رسید کرایه خانه را می‌آورم.* dit que tu apporteras la quittance de loyer.'
  prs.a2.unit09.lesson04.exercise01.comprehend_since_when:
    instruction: Depuis quand کریم habite-t-il dans la nouvelle maison ?
    correct_option: depuis le mois dernier
    distractors:
    - depuis la semaine dernière
    - depuis l’année dernière
    - depuis hier
    accepted_answers:
    - value: depuis le mois dernier
      status: correct
    feedback: '*از ماه گذشته* -- depuis le mois dernier.'
  prs.a2.unit09.lesson04.exercise02.comprehend_required_documents:
    instruction: Que doit apporter کریم, selon l’employé ?
    correct_option: sa carte d’identité (تذکره) et une quittance de loyer
    distractors:
    - uniquement un passeport
    - uniquement un contrat de location
    - rien du tout
    accepted_answers:
    - value: sa carte d’identité (تذکره) et une quittance de loyer
      status: correct
    feedback: '*تذکره و یک رسید کرایه خانه کافی است* -- la carte d’identité et une quittance de loyer suffisent.'
  prs.a2.unit09.lesson04.exercise03.recognize_appointment_day:
    instruction: Quel jour et à quelle heure est le rendez-vous de کریم ?
    correct_option: mardi à dix heures
    distractors:
    - mercredi à dix heures
    - mardi à neuf heures
    - jeudi à onze heures
    accepted_answers:
    - value: mardi à dix heures
      status: correct
    feedback: '*سه‌شنبه ساعت ده خوب است* -- mardi à dix heures convient.'
  prs.a2.unit09.lesson04.exercise04.order_since_when_question:
    instruction: Remets les mots dans l’ordre pour demander depuis quand quelqu’un habite dans sa nouvelle maison.
    accepted_answers:
    - value:
      - از
      - کی
      - در
      - خانهٔ
      - جدید
      - زندگی
      - می‌کنین
      status: correct
    feedback: '*از کی در خانهٔ جدید زندگی می‌کنین؟* demande depuis quand.'
  prs.a2.unit09.lesson04.exercise05.dialogue_response_as_karim:
    instruction: 'L’employé demande : « Depuis quand habitez-vous dans la nouvelle maison ? » Réponds en tant que کریم, puis demande ce que tu dois apporter.'
    accepted_answers:
    - value: از ماه گذشته. می‌شود بگویین چه چیزی باید بیاورم؟
      status: correct
    - value: از ماه گذشته، می‌شود بگویین چه چیزی باید بیاورم؟
      status: correct
    - value: از ماه گذشته و می‌شود بگویین چه چیزی باید بیاورم؟
      status: correct
    feedback: Relier la réponse et la question suivante par un point, une virgule ou *و* est tout aussi naturel.
  prs.a2.unit09.lesson04.exercise06.write_registry_summary:
    instruction: Écris, en citant l’employé, quels documents suffisent à apporter.
    accepted_answers:
    - value: تذکره و یک رسید کرایه خانه کافی است.
      status: correct
    - value: تذکره و یک رسید کرایه خانه کافی است
      status: correct
    feedback: '*تذکره و یک رسید کرایه خانه کافی است.* est la réponse de l’employé, citée telle quelle.'
