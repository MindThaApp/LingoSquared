course:
  title: Dari en français A2
  description: 'Dari afghan, niveau pré-intermédiaire : prendre un rendez-vous officiel pour enregistrer une nouvelle adresse à la mairie — vocabulaire, prise de rendez-vous, lecture d’un avis officiel et rendez-vous lui-même.'
units:
  prs.a2.unit09.bureaucracy:
    title: Démarches administratives
lessons:
  prs.a2.unit09.lesson01.bureaucracy_vocabulary:
    title: Les mots pour s’adresser à un bureau
  prs.a2.unit09.lesson02.making_an_appointment:
    title: Prendre rendez-vous
  prs.a2.unit09.lesson03.reading_the_notice:
    title: Lire l’avis
  prs.a2.unit09.lesson04.at_the_municipality_office:
    title: À la mairie
teaching:
  prs.a2.unit09.lesson01.teach.vaght_word:
    title: Rendez-vous
    gloss: rendez-vous / créneau
    note: '*وقت* signifie littéralement « temps » ; *وقت گرفتن* (prendre un rendez-vous) est la façon courante de dire « prendre rendez-vous ».'
  prs.a2.unit09.lesson01.teach.sanad_word:
    title: Document
    gloss: document
    note: '*سند* est le mot général pour un document officiel.'
  prs.a2.unit09.lesson01.teach.address_word:
    title: Adresse
    gloss: adresse
    note: '*آدرس* est le mot courant pour l’adresse d’un domicile.'
  prs.a2.unit09.lesson01.teach.tazkira_word:
    title: Carte d’identité nationale
    gloss: carte d’identité nationale afghane (tazkira)
    note: '*تذکره* — le document mis à jour dans cette unité — est le livret d’identité nationale de l’Afghanistan, un document distinct de la *کارت ملی* iranienne.'
  prs.a2.unit09.lesson01.teach.municipality_word:
    title: Mairie
    gloss: mairie
    note: '*شاروالی* est le terme afghan pour le bureau de la municipalité, distinct du *شهرداری* du persan d’Iran.'
  prs.a2.unit09.lesson01.teach.va_word:
    title: Et
    gloss: et
    note: '*و* est le mot de liaison courant employé dans toute cette unité.'
    target_text: و (et)
  prs.a2.unit09.lesson02.teach.request_appointment:
    title: Demander un rendez-vous
    gloss: Je voudrais prendre rendez-vous pour changer mon adresse.
    note: '*می‌خواستم* (littéralement « je voulais ») adoucit la demande et la rend polie.'
  prs.a2.unit09.lesson02.teach.because_moved:
    title: Expliquer pourquoi, avec چون (parce que)
    gloss: Comme j’ai déménagé, je dois changer mon adresse.
    note: '*چون* (« parce que ») introduit la proposition de cause, suivie du résultat.'
  prs.a2.unit09.lesson02.teach.what_should_i_bring:
    title: Demander poliment ce qu’il faut apporter
    gloss: Pourriez-vous me dire ce que je dois apporter ?
    note: '*می‌شود بگویین...؟* (« pourriez-vous me dire... ? ») est une forme de question indirecte polie.'
  prs.a2.unit09.lesson03.teach.rent_receipt_word:
    title: Quittance de loyer
    gloss: quittance de loyer
    note: '*رسید کرایه خانه* est une quittance de loyer, l’un des justificatifs de domicile acceptés.'
  prs.a2.unit09.lesson03.teach.deadline_word:
    title: Délai
    gloss: délai
    note: '*مهلت* est le mot général pour un délai ou une date limite.'
  prs.a2.unit09.lesson03.teach.notice_text:
    title: Un avis du bureau sur le changement d’adresse
    gloss: Pour changer votre adresse, veuillez apporter votre carte d’identité nationale et une quittance de loyer. Le délai d’enregistrement court jusqu’à la fin de ce mois.
    note: Un court avis officiel, dans le registre écrit formel que cette unité enseigne.
  prs.a2.unit09.lesson03.teach.i_will_bring_receipt:
    title: Dire ce que tu apporteras
    gloss: J’apporterai la quittance de loyer.
    note: '*می‌آورم* signifie « j’apporte ».'
  prs.a2.unit09.lesson04.teach.turn01:
    title: L’employé accueille کریم
    gloss: L’employé l’invite à entrer et lui demande en quoi il peut lui rendre service.
    note: '*بفرمایین* l’invite à avancer ; *چه خدمتی می‌توانم برایتان انجام بدهم؟* est une façon polie et formelle pour un employé de proposer son aide.'
  prs.a2.unit09.lesson04.teach.turn02:
    title: کریم demande un rendez-vous
    gloss: کریم dit qu’il voudrait prendre rendez-vous pour changer son adresse.
    note: La même formule de demande polie avec *می‌خواستم* que précédemment.
  prs.a2.unit09.lesson04.teach.turn03:
    title: L’employé demande depuis quand
    gloss: L’employé lui demande depuis quand il habite dans la nouvelle maison.
    note: '*از کی...؟* signifie « depuis quand ? ».'
  prs.a2.unit09.lesson04.teach.turn04:
    title: کریم répond et demande ce qu’il faut apporter
    gloss: 'Il répond : depuis le mois dernier, et demande ce qu’il doit apporter.'
    note: Associe *از ماه گذشته* (« depuis le mois dernier ») à la question polie *می‌شود بگویین...؟*.
  prs.a2.unit09.lesson04.teach.turn05:
    title: L’employé énumère les documents
    gloss: L’employé dit que la carte d’identité nationale et une quittance de loyer suffisent.
    note: '*کافی است* signifie « suffit ».'
  prs.a2.unit09.lesson04.teach.turn06:
    title: کریم propose un jour
    gloss: Il demande s’il peut venir mardi.
    note: '*می‌توانم...؟* exprime la possibilité ou la permission.'
  prs.a2.unit09.lesson04.teach.turn07:
    title: L’employé confirme et donne un numéro de suivi
    gloss: L’employé confirme mardi à dix heures et donne le numéro de suivi trois mille cinquante.
    note: '*نمبر پیگیری* est le numéro de suivi ou de référence du rendez-vous — *نمبر* est un emprunt courant en Afghanistan, associé à *پیگیری* (suivi) ; *بلی* est le mot dari pour « oui ».'
exercises:
