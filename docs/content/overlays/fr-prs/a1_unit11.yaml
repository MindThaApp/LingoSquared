teaching:
  prs.a1.unit11.lesson01.teach.saat_word:
    title: Heure / horloge
    gloss: heure / horloge
    note: '*ساعت* signifie à la fois « heure » et « horloge », et sert aussi à indiquer l''heure exacte dans les expressions de temps.'
    example_gloss: Quelle heure est-il ?
  prs.a1.unit11.lesson01.teach.daqiqa_word:
    title: Minute
    gloss: minute
    note: '*دقیقه* signifie « minute ».'
    example_gloss: Attendez cinq minutes.
  prs.a1.unit11.lesson01.teach.nim_word:
    title: La moitié
    gloss: demi
    note: '*نیم* signifie « demi » et sert pour la demi-heure (par ex. *ساعت سه و نیم*, trois heures et demie).'
    example_gloss: Il est sept heures et demie.
  prs.a1.unit11.lesson01.teach.rub_word:
    title: Quart
    gloss: quart
    note: '*ربع* signifie « quart » et sert pour les quarts d''heure (par ex. *ساعت چهار و ربع*, quatre heures et quart).'
    example_gloss: Il est huit heures moins le quart.
  prs.a1.unit11.lesson01.teach.numbers_review:
    title: Les nombres de 1 à 5 (révision)
    gloss: un, deux, trois, quatre, cinq
    note: '*یک، دو، سه، چهار، پنج* reprennent les nombres de l''unité 4, nécessaires pour dire l''heure.'
    example_gloss:
    - J’ai un livre.
    - J’ai deux frères.
    - J'ai trois sœurs.
    - Il reste quatre jours.
    - Attendez cinq minutes.
  prs.a1.unit11.lesson02.teach.chand_word:
    title: Combien / quel
    gloss: combien / quel
    note: '*چند* se combine avec *ساعت* pour demander l''heure : *ساعت چند است؟*'
    example_gloss: Quelle heure est-il ?
  prs.a1.unit11.lesson02.teach.saat_chand_ast:
    title: Quelle heure est-il ?
    gloss: Quelle heure est-il ?
    note: '*ساعت چند است؟* est la façon neutre et polie de demander l''heure en dari.'
  prs.a1.unit11.lesson02.teach.register_note:
    title: Note de registre
    gloss: ساعت چند است؟ (forme complète et neutre)
    note: '*ساعت چند است؟* est la forme complète et neutre : elle est correcte à l''écrit comme à l''oral. Dans la langue parlée rapide et familière, *است* se réduit souvent à un simple -ه final (comme dans *چنده*), mais utilise la forme complète tant que tu apprends.'
    target_text: ساعت چند است؟ (forme complète, neutre)
  prs.a1.unit11.lesson03.teach.saat_se_ast:
    title: Il est trois heures.
    gloss: Il est trois heures.
    note: '*ساعت سه است* indique l''heure pile.'
  prs.a1.unit11.lesson03.teach.saat_se_o_nim:
    title: Il est trois heures et demie.
    gloss: Il est trois heures et demie.
    note: '*و* (et) relie l''heure et la demie : *ساعت سه و نیم است*.'
  prs.a1.unit11.lesson03.teach.saat_char_o_rub:
    title: Il est quatre heures et quart.
    gloss: Il est quatre heures et quart.
    note: '*ساعت چهار و ربع است* ajoute un quart d''heure à l''heure.'
  prs.a1.unit11.lesson04.teach.sobh_review:
    title: Matin (révision)
    gloss: matin
    note: '*صبح* reprend la salutation du matin de l''unité 1 (*صبح بخیر*).'
    example_gloss: Je me réveille tôt le matin.
  prs.a1.unit11.lesson04.teach.zohr_word:
    title: Midi
    gloss: midi
    note: '*ظهر* signifie « midi » : c''est un mot nouveau, absent des salutations de l''unité 1.'
    example_gloss: Je déjeune à midi.
  prs.a1.unit11.lesson04.teach.asr_review:
    title: Après-midi (révision)
    gloss: après-midi
    note: '*عصر* reprend la salutation de l''après-midi / du soir de l''unité 1 (*عصر بخیر*).'
    example_gloss: Je travaille l’après-midi.
  prs.a1.unit11.lesson04.teach.shab_review:
    title: Nuit (révision)
    gloss: nuit
    note: '*شب* reprend la salutation de la nuit de l''unité 1 (*شب بخیر*).'
    example_gloss: Je me couche tôt le soir.
  prs.a1.unit11.lesson04.teach.saat_noh_sobh:
    title: Il est neuf heures du matin.
    gloss: Il est neuf heures du matin.
    note: '*ساعت نه صبح است* associe l''heure et le moment de la journée.'
  prs.a1.unit11.lesson04.teach.haft_word:
    title: Sept (7)
    gloss: sept (7)
    note: '*هفت* signifie « sept » ; il sert à dire sept heures du soir.'
    example_gloss: Je viendrai à sept heures.
  prs.a1.unit11.lesson05.teach.qarar_word:
    title: Rendez-vous
    gloss: rendez-vous
    note: '*قرار* signifie « rendez-vous » : mot nouveau pour le contexte des rendez-vous personnels de cette unité, à distinguer de *جلسه* (réunion), vu dans le dialogue précédent sur la planification des réunions.'
    example_gloss: J'ai un rendez-vous.
  prs.a1.unit11.lesson05.teach.qarar_saat_chand:
    title: À quelle heure est votre rendez-vous ?
    gloss: À quelle heure est votre rendez-vous ?
    note: '*قرار شما ساعت چند است؟* demande poliment l''heure du rendez-vous de quelqu''un (*شما*).'
  prs.a1.unit11.lesson05.teach.qarar_answer:
    title: Mon rendez-vous est à huit heures et demie.
    gloss: Mon rendez-vous est à huit heures et demie.
    note: '*قرار من ساعت هشت و نیم است* indique l''heure de ton propre rendez-vous.'
  prs.a1.unit11.lesson06.teach.names:
    title: Zarmina et Homayoun
    gloss: Zarmina, Homayoun
    note: '*زرمینه* et *همایون* sont les deux interlocuteurs du dialogue de cette leçon.'
    example_gloss:
    - Zarmina vient à sept heures.
    - Homayoun vient à huit heures.
  prs.a1.unit11.lesson06.teach.dialogue_line1:
    title: Excusez-moi, à quelle heure est la réunion ?
    gloss: Excusez-moi, à quelle heure est la réunion ?
    note: Zarmina demande poliment l'heure de la réunion.
  prs.a1.unit11.lesson06.teach.dialogue_line2:
    title: La réunion est à neuf heures du matin.
    gloss: La réunion est à neuf heures du matin.
    note: Homayoun indique l'heure de la réunion.
  prs.a1.unit11.lesson06.teach.dialogue_line3:
    title: À neuf heures ? Très bien. Je viendrai à huit heures et demie.
    gloss: À neuf heures ? Très bien. Je viendrai à huit heures et demie.
    note: Zarmina confirme et indique sa propre heure d'arrivée.
  prs.a1.unit11.lesson06.teach.dialogue_line4:
    title: Très bien, je vous attendrai.
    gloss: Très bien, je vous attendrai.
    note: '*منتظر استم* (j''attends) utilise la terminaison de copule *استم* déjà vue.'
