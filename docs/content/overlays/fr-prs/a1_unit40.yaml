course:
  title: Dari A1
  description: 'Dari de Kaboul pour débutants : reconnaître une urgence simple, demander de l’aide, dire si tu as besoin de la police, d’une ambulance ou des pompiers, décrire une blessure et lire un court texte sur les urgences.'
units:
  prs.a1.unit40.emergencies:
    title: Les urgences
    description: Reconnaître une urgence simple, demander de l’aide et dire de quel type d’aide on a besoin (police, ambulance ou pompiers).
lessons:
  prs.a1.unit40.lesson01.emergency_types:
    title: Aide d’urgence
  prs.a1.unit40.lesson02.asking_for_help:
    title: Demander de l’aide
  prs.a1.unit40.lesson03.describing_the_emergency:
    title: Blessé et saignant
  prs.a1.unit40.lesson04.emergency_dialogue:
    title: Dialogue d’urgence
  prs.a1.unit40.lesson05.emergency_reading:
    title: 'Lecture : l’aide d’urgence'
  prs.a1.unit40.lesson06.wrap_up:
    title: Récapitulatif
teaching:
  prs.a1.unit40.lesson01.teach.review_help_want:
    title: 'Révision : aide, je veux'
    gloss: aide / je veux
    note: کمک et می‌خواهم sont des mots de révision utilisés dans toute cette unité pour dire de quel type d’aide on a besoin.
    target_text: کمک (aide) / می‌خواهم (je veux)
  prs.a1.unit40.lesson01.teach.review_this_is:
    title: 'Révision : ceci, est'
    gloss: ceci / est
    note: این et است sont des mots de base déjà vus, utilisés pour dire de quel type de situation il s’agit.
    target_text: این (ceci) / است (est)
  prs.a1.unit40.lesson01.teach.emergency_word:
    title: Urgence
    gloss: urgence
    note: اضطراری signifie urgence / urgent.
    example_gloss: C’est une urgence.
  prs.a1.unit40.lesson01.teach.police_word:
    title: Police
    gloss: police
    note: پولیس est le mot courant pour « police » en dari afghan (emprunté à l’anglais), un peu comme le mot français « police » qui lui ressemble.
    example_gloss: Il me faut la police.
  prs.a1.unit40.lesson01.teach.ambulance_word:
    title: Ambulance
    gloss: ambulance
    note: امبولانس signifie ambulance.
    example_gloss: J’ai besoin d’une ambulance.
  prs.a1.unit40.lesson01.teach.fire_word:
    title: Feu
    gloss: feu
    note: آتش signifie « feu ».
    example_gloss: Il y a un incendie.
  prs.a1.unit40.lesson01.teach.fire_brigade_word:
    title: Pompiers
    gloss: pompiers
    note: اطفائیه est le terme courant à Kaboul pour désigner les pompiers (la caserne ou le service d’incendie).
    example_gloss: J’ai besoin des pompiers.
  prs.a1.unit40.lesson01.teach.emergency_help_phrase:
    title: C’est une urgence ! J’ai besoin de la police !
    gloss: C’est une urgence ! J’ai besoin de la police !
    note: این اضطراری است associe این (ceci), اضطراری (urgence) et است (est).
  prs.a1.unit40.lesson02.teach.review_can_you_do:
    title: 'Révision : pouvez-vous, faites (impératif de politesse), à/pour, vite'
    gloss: pouvez-vous / faites / à, pour / vite
    note: می‌توانین, کنین, به et زود (vus dans les unités précédentes) se combinent avec d’autres mots pour former des demandes et des ordres polis.
    target_text: می‌توانین (pouvez-vous) / کنین (faites — impératif de politesse) / به (à / pour) / زود (vite)
  prs.a1.unit40.lesson02.teach.mera_word:
    title: Moi
    gloss: me, moi
    note: 'مه ره est la forme parlée du dari de Kaboul pour مرا (« me », complément d’objet) : مه est la forme parlée de من, et ره la forme parlée de la marque d’objet را. À l’écrit, on voit surtout مرا, également accepté.'
    example_gloss: Peux-tu m’aider ?
  prs.a1.unit40.lesson02.teach.can_you_help_me_phrase:
    title: Pouvez-vous m’aider ?
    gloss: Pouvez-vous m’aider ?
    note: Une phrase dari réelle et très courante pour demander de l’aide directement.
  prs.a1.unit40.lesson02.teach.call_word:
    title: Appelez ! (impératif)
    gloss: appelez
    note: زنگ بزنین est l’impératif de politesse de زنگ زدن (appeler, téléphoner), construit sur زنگ می‌زنم (j’appelle), déjà vu.
    example_gloss: Appelez la police !
  prs.a1.unit40.lesson02.teach.come_word:
    title: Venez ! (impératif)
    gloss: venez
    note: بیایین est l’impératif de politesse de آمدن (venir).
    example_gloss: Venez vite !
  prs.a1.unit40.lesson02.teach.call_ambulance_phrase:
    title: Appelez l’ambulance !
    gloss: Appelez l’ambulance !
    note: به (à/pour), puis امبولانس (ambulance), puis l’impératif زنگ بزنین.
  prs.a1.unit40.lesson03.teach.review_he_she_has:
    title: 'Révision : il/elle, il/elle a'
    gloss: il/elle / il/elle a
    note: او et دارد sont des formes déjà vues, utilisées pour décrire l’état d’une autre personne en cas d’urgence.
    target_text: او (il / elle) / دارد (il / elle a)
  prs.a1.unit40.lesson03.teach.injured_word:
    title: Blessé
    gloss: blessé(e)
    note: زخمی signifie « blessé(e) ».
    example_gloss: Il/elle est blessé(e).
  prs.a1.unit40.lesson03.teach.bleeding_word:
    title: Saignement
    gloss: saignement
    note: خون‌ریزی signifie « saignement ».
    example_gloss: Il/elle saigne.
  prs.a1.unit40.lesson03.teach.injured_ambulance_phrase:
    title: Il/elle est blessé(e) ! J’ai besoin d’une ambulance !
    gloss: Il/elle est blessé(e) ! J’ai besoin d’une ambulance !
    note: Associe زخمی à امبولانس می‌خواهم, déjà vu.
  prs.a1.unit40.lesson03.teach.bleeding_come_quickly_phrase:
    title: Il/elle saigne ! Venez vite !
    gloss: Il/elle saigne ! Venez vite !
    note: Associe خون‌ریزی à زود بیایین, déjà vu.
  prs.a1.unit40.lesson04.teach.review_dialogue_words:
    title: 'Révision : quoi, il/elle vient, j’appelle, merci beaucoup'
    gloss: quoi / il/elle vient / j’appelle / merci beaucoup
    note: چه, می‌آید, زنگ می‌زنم et تشکر زیاد sont des mots déjà vus, utilisés dans le dialogue d’urgence.
    target_text: چه (quoi / que) / می‌آید (il / elle vient) / زنگ می‌زنم (j’appelle) / تشکر زیاد (merci beaucoup)
  prs.a1.unit40.lesson04.teach.dialogue_line1:
    title: 'Homayoun : Zarmina, à l’aide ! Au secours !'
    gloss: Zarmina, à l’aide ! Au secours !
  prs.a1.unit40.lesson04.teach.dialogue_line2:
    title: 'Zarmina : Quoi ?'
    gloss: Quoi ?
  prs.a1.unit40.lesson04.teach.dialogue_line3:
    title: 'Homayoun : Il/elle est blessé(e) ! Il/elle saigne !'
    gloss: Il/elle est blessé(e) ! Il/elle saigne !
  prs.a1.unit40.lesson04.teach.dialogue_line4:
    title: 'Zarmina : J’ai besoin d’une ambulance. J’appelle !'
    gloss: J’ai besoin d’une ambulance. J’appelle !
  prs.a1.unit40.lesson04.teach.dialogue_line5:
    title: 'Homayoun : Merci beaucoup !'
    gloss: Merci beaucoup !
  prs.a1.unit40.lesson04.teach.dialogue_line6:
    title: 'Zarmina : L’ambulance arrive vite.'
    gloss: L’ambulance arrive vite.
  prs.a1.unit40.lesson05.teach.review_reading_words:
    title: 'Révision : un, personne, ville, il/elle fait, dans/à'
    gloss: un / personne / ville / il/elle fait / dans, à
    note: یک, نفر, شهر, می‌کند et در sont des mots déjà vus, utilisés dans ce texte à lire.
    target_text: یک (un) / نفر (personne) / شهر (ville) / می‌کند (il / elle fait) / در (dans / à)
  prs.a1.unit40.lesson05.teach.reading_passage:
    title: 'Lecture : une urgence'
    gloss: Dans la ville, une personne est blessée. Elle saigne. Homayoun aide. Une ambulance arrive.
  prs.a1.unit40.lesson06.teach.review_wrap_up_words:
    title: 'Révision : téléphone, je n’ai pas, mais, vous (formel)'
    gloss: téléphone / je n’ai pas / mais / vous (formel)
    note: تلفن, ندارم, اما et شما sont des mots déjà vus, utilisés pour opposer un besoin à une limite et pour poser une question formelle.
    target_text: تلفن (téléphone) / ندارم (je n’ai pas) / اما (mais) / شما (vous, forme de politesse)
  prs.a1.unit40.lesson06.teach.contrast_phrase:
    title: J’ai besoin d’aide, mais je n’ai pas de téléphone
    gloss: J’ai besoin d’aide, mais je n’ai pas de téléphone.
    note: اما oppose le besoin d’aide au fait de ne pas avoir de téléphone pour en demander.
  prs.a1.unit40.lesson06.teach.formal_question_phrase:
    title: Peux-tu m’aider ?
    gloss: Pouvez-vous aider ?
    note: La version formelle avec شما pour demander de l’aide poliment et directement.
