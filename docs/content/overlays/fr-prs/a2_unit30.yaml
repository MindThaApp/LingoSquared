course:
  title: Dari en français A2
  description: 'Dari afghan, niveau pré-intermédiaire : dire ce que tu peux et ne peux pas faire, quand tu es libre ou occupé, et ce qui pourrait arriver. Le modal می‌توانم avec le subjonctif, ممکن است et شاید avec le subjonctif, et la façon de fixer un moment où tu peux venir.'
units:
  prs.a2.unit30.can_and_might:
    title: Ce que je peux et pourrais faire
lessons:
  prs.a2.unit30.lesson01.what_i_can_do:
    title: Ce que je sais faire
  prs.a2.unit30.lesson02.all_persons_and_no:
    title: Toutes les personnes et la négation
  prs.a2.unit30.lesson03.free_or_busy:
    title: Libre ou occupé
  prs.a2.unit30.lesson04.might_and_maybe:
    title: Il se peut, peut-être
  prs.a2.unit30.lesson05.reading_and_listening:
    title: Lire et écouter à propos du temps libre
  prs.a2.unit30.lesson06.plans_conversation:
    title: Une conversation sur vendredi
teaching:
  prs.a2.unit30.lesson01.teach.swim:
    title: Nager
    gloss: nager
    note: '*شنا کردن* signifie nager. C’est un verbe composé de deux mots : le nom *شنا* plus *کردن*. Beaucoup de savoir-faire se nomment ainsi : *آشپزی کردن* (cuisiner), *رانندگی کردن* (conduire), *صحبت کردن* (parler).'
    example_gloss: Je nage bien.
  prs.a2.unit30.lesson01.teach.paint:
    title: Peindre, dessiner
    gloss: peindre, dessiner
    note: '*نقاشی کردن* signifie peindre ou dessiner. Comme *شنا کردن*, c’est un nom plus *کردن*.'
    example_gloss: Mon ami peint.
  prs.a2.unit30.lesson01.teach.letter:
    title: Lettre
    gloss: lettre
    note: '*نامه* signifie lettre. Le verbe écrire est *نوشتن*, et la lettre est ce que l’on écrit : *نامه نوشتن* signifie écrire une lettre.'
    example_gloss: La lettre est à la maison.
  prs.a2.unit30.lesson01.teach.dari:
    title: Le dari
    gloss: dari (la langue)
    note: '*دری* est le nom de la langue que tu apprends. On la parle avec *صحبت کردن* : *دری صحبت کردن*, et *انگلیسی صحبت کردن* signifie parler anglais.'
    example_gloss: Je parle un peu dari.
  prs.a2.unit30.lesson01.teach.can:
    title: 'می‌توانم : je peux'
    gloss: Je peux y aller. Je peux venir. Je sais cuisiner.
    note: '*می‌توانم* signifie je peux, je suis capable de. Il est toujours suivi d’un second verbe au subjonctif : *می‌توانم بروم* (je peux y aller), *می‌توانم بیایم* (je peux venir), *می‌توانم آشپزی کنم* (je sais cuisiner). Les deux verbes se suivent et sont tous deux à la première personne. Écris *می‌توانم* avec une demi-espace (ZWNJ) entre *می* et *توانم*, et non une espace normale.'
  prs.a2.unit30.lesson01.teach.subjunctive:
    title: 'Le subjonctif : ب + le radical du présent + م'
    gloss: que j’aille, mange, lise, écrive, cuisine, achète, voie, dise
    note: 'Le subjonctif se compose de trois éléments : *ب* + le radical du présent + la terminaison personnelle. Pour « je », la terminaison est *-م*. Le radical du présent de *رفتن* est *رو*, d’où *بروم*. La même règle donne *خوردن* → *بخورم*, *خواندن* → *بخوانم*, *نوشتن* → *بنویسم*, *پختن* → *بپزم*, *خریدن* → *بخرم*, *دیدن* → *ببینم*, *گفتن* → *بگویم*. Tu as déjà rencontré cette forme après *باید*. Après *می‌توانم*, c’est le second verbe. *آمدن* est irrégulier : *بیایم*.'
  prs.a2.unit30.lesson01.teach.compound:
    title: Les verbes composés n’ont pas de ب
    gloss: Je sais cuisiner, conduire, nager, parler, peindre
    note: 'Un verbe formé d’un nom et de *کردن* ne prend pas *ب*. Seul le verbe léger change : *کنم*. La forme écrite standard est *آشپزی کنم* ; *آشپزی بکنم* s’entend aussi à l’oral. Compare *می‌توانم آشپزی کنم* (je sais cuisiner) et *می‌توانم بروم* (je peux y aller). Le même schéma fonctionne pour *رانندگی کنم*, *شنا کنم*, *صحبت کنم*, *نقاشی کنم*. Le verbe simple *کردن* seul donne *بکنم*.'
  prs.a2.unit30.lesson01.teach.cook:
    title: Je sais cuisiner
    gloss: Je sais cuisiner.
    note: 'Voici le schéma de base : le sujet (facultatif), *می‌توانم*, la compétence, puis le subjonctif de *کردن*.'
  prs.a2.unit30.lesson01.teach.speak_dari:
    title: Je sais parler dari
    gloss: Je sais parler dari.
    note: Le sujet *من* peut être omis, car *می‌توانم* indique déjà qui parle. Le verbe *صحبت کنم* termine la phrase.
  prs.a2.unit30.lesson02.teach.paradigm:
    title: Le paradigme complet
    gloss: je peux y aller, tu peux y aller, il/elle peut y aller, nous pouvons y aller, vous (formel ou pluriel) pouvez y aller, ils peuvent y aller
    note: 'Les deux verbes changent selon la personne. Le modal : *می‌توانم، می‌توانی، می‌تواند، می‌توانیم، می‌توانین، می‌توانند*. Le subjonctif : *بروم، بروی، برود، برویم، بروین، بروند*. Ainsi *می‌توانی بروی* signifie « tu peux aller » (à un ami), *می‌تواند برود* « il ou elle peut aller », *می‌توانیم برویم* « nous pouvons aller », *می‌توانین بروین* « vous pouvez aller » (forme de politesse, une personne que tu respectes, ou plusieurs personnes), *می‌توانند بروند* « ils ou elles peuvent aller ». La terminaison de la deuxième personne du pluriel est *-ین* dans les deux verbes.'
  prs.a2.unit30.lesson02.teach.agreement:
    title: 'Verbes à deux mots : seul کنم change'
    gloss: Il peut conduire. Vous pouvez conduire. Nous pouvons cuisiner.
    note: 'Avec les verbes à deux mots, le nom reste identique et seul *کنم* change : *کنم، کنی، کند، کنیم، کنین، کنند*. Ainsi : *می‌توانم رانندگی کنم*, *می‌توانی رانندگی کنی*, *می‌تواند رانندگی کند*, *می‌توانیم رانندگی کنیم*, *می‌توانین رانندگی کنین*, *می‌توانند رانندگی کنند*. La personne doit être la même dans les deux verbes.'
  prs.a2.unit30.lesson02.teach.negative:
    title: 'La négation : نمی‌توانم'
    gloss: je ne peux pas aller, tu ne peux pas aller, il/elle ne peut pas aller, nous ne pouvons pas aller, vous ne pouvez pas aller, ils/elles ne peuvent pas aller
    note: 'Pour dire que tu ne peux pas faire quelque chose, ajoute *ن* au modal : *می‌توانم* devient *نمی‌توانم*. Le second verbe reste à la forme affirmative : *نمی‌توانم بروم* (je ne peux pas aller), et non *نمی‌توانم نروم*. Toutes les terminaisons sont les mêmes qu’au paradigme affirmatif.'
  prs.a2.unit30.lesson02.teach.help_q:
    title: Pouvez-vous m’aider ?
    gloss: Pouvez-vous m’aider ?
    note: 'Voici comment demander à un ami s’il est capable de faire quelque chose : *می‌توانی* suivi du subjonctif. À une personne que tu respectes, ou à plusieurs personnes, dis *می‌توانین به من کمک کنین؟*.'
  prs.a2.unit30.lesson02.teach.no_drive:
    title: Il ne peut pas conduire
    gloss: Il ne peut pas conduire. / Elle ne peut pas conduire.
    note: '*او* signifie « il » ou « elle » : la phrase parle donc d’une seule personne qui n’est pas capable de conduire. *نمی‌تواند* est la forme négative ; *کند* est le subjonctif de *کردن* à la troisième personne du singulier.'
  prs.a2.unit30.lesson03.teach.busy:
    title: Occupé
    gloss: occupé(e)
    note: '*مشغول* signifie « occupé ». On dit *مشغول استم* (je suis occupé), le contraire de *آزاد استم* (je suis libre).'
    example_gloss: Aujourd’hui, je suis occupé.
  prs.a2.unit30.lesson03.teach.tonight:
    title: Ce soir
    gloss: ce soir
    note: '*امشب* signifie « ce soir ». Comme *فردا* (demain) et *امروز* (aujourd’hui), c’est un mot de temps qui se place avant le verbe.'
    example_gloss: Ce soir, je suis à la maison.
  prs.a2.unit30.lesson03.teach.five:
    title: Cinq
    gloss: cinq
    note: '*پنج* signifie « cinq ». *ساعت پنج* veut dire « cinq heures » et *بعد از ساعت پنج* « après cinq heures ».'
    example_gloss: À cinq heures, je rentre à la maison.
  prs.a2.unit30.lesson03.teach.time_word:
    title: Mot de temps + می‌توانم
    gloss: Demain, je peux venir. Ce soir, je ne peux pas venir. Vendredi, je peux venir.
    note: 'Pour dire quand tu es capable de faire quelque chose, place un mot de temps dans la phrase : *فردا*, *امشب*, *روز جمعه*. Les verbes restent les mêmes, *می‌توانم بیایم* ; le mot de temps indique qu’il s’agit du futur, donc tu n’as pas besoin d’une autre forme de futur. Le mot de temps peut venir en premier (*فردا می‌توانم بیایم*) ou après le modal (*می‌توانم فردا بیایم*). La question est *فردا می‌توانی بیایی؟* (Peux-tu venir demain ?).'
  prs.a2.unit30.lesson03.teach.reply:
    title: Oui, non, parce que, mais
    gloss: Oui, je peux venir. Non, je ne peux pas venir, parce que je suis occupé. Mais vendredi, je suis libre.
    note: 'Pour accepter, réponds *بلی* et répète le modal : *بلی، می‌توانم بیایم*. Pour refuser, réponds *نخیر* et donne la raison avec *چون* : *نخیر، نمی‌توانم بیایم، چون مشغول استم*. *ولی* (mais) propose ensuite un autre moment : *ولی روز جمعه آزاد استم*. *آزاد استم* signifie « je suis libre » et *مشغول استم* « je suis occupé ». Tu peux aussi dire *کار دارم* (j’ai du travail).'
  prs.a2.unit30.lesson03.teach.after_five:
    title: Libre après cinq heures
    gloss: Après cinq heures, je suis libre.
    note: Cette phrase indique à l’autre personne quand tu es libre. *بعد از ساعت پنج* signifie « après cinq heures ».
  prs.a2.unit30.lesson03.teach.when_q:
    title: Quand peux-tu venir ?
    gloss: Quand peux-tu venir ?
    note: '*کی* demande le moment. La réponse est un mot de temps avec le même schéma : *فردا می‌توانم بیایم* ou *بعد از ساعت پنج می‌توانم بیایم*.'
  prs.a2.unit30.lesson04.teach.possible:
    title: C’est possible, il se pourrait que
    gloss: il est possible que, il se pourrait que
    note: '*ممکن است* signifie « il est possible que ». Il est suivi d’une proposition dont le verbe est au subjonctif : *ممکن است باران ببارد* (il se pourrait qu’il pleuve). *ممکن* ne change jamais ; c’est le verbe qui suit qui porte la personne.'
    example_gloss: Il se pourrait qu’il pleuve demain.
  prs.a2.unit30.lesson04.teach.maybe:
    title: Peut-être
    gloss: peut-être
    note: '*شاید* signifie « peut-être ». Comme *ممکن است*, il est suivi du subjonctif : *شاید بیایم* (peut-être que je viendrai), *شاید او بیاید* (peut-être qu’il viendra). *شاید* est plus court et s’emploie davantage à l’oral.'
    example_gloss: Peut-être qu’il viendra.
  prs.a2.unit30.lesson04.teach.rain:
    title: Pluie
    gloss: pluie
    note: '*باران* signifie « pluie ». Le verbe est *باریدن* : *باران ببارد* (il se peut qu’il pleuve), *باران نبارد* (il se peut qu’il ne pleuve pas). Le subjonctif de *باریدن* est *ببارد*.'
    example_gloss: Aujourd’hui, il pleut.
  prs.a2.unit30.lesson04.teach.sure:
    title: Bien sûr
    gloss: sûr(e), certain(e)
    note: '*مطمئن* signifie « sûr ». *مطمئن نیستم* veut dire « je ne suis pas sûr ». C’est une phrase naturelle avant d’ajouter *شاید* ou *ممکن است*.'
    example_gloss: Je ne suis pas sûr.
  prs.a2.unit30.lesson04.teach.possible_subj:
    title: ممکن است + subjonctif
    gloss: Il se peut que j’arrive en retard. Il se peut qu’il vienne. Il se peut qu’il pleuve.
    note: 'Après *ممکن است*, le verbe est au subjonctif, à la personne voulue : *بیایم* (que je vienne), *بیایی* (que tu viennes), *بیاید* (qu’il vienne), *بیاییم* (que nous venions), *بیایین* (que vous veniez), *بیایند* (qu’ils viennent). La négation place *ن* sur le subjonctif : *ممکن است نیاید* (il se peut qu’il ne vienne pas). Compare avec *می‌توانم* : celui-ci dit « je suis capable », tandis que *ممکن است* dit « il est possible que cela arrive ».'
  prs.a2.unit30.lesson04.teach.maybe_subj:
    title: شاید + subjonctif
    gloss: Peut-être que je viendrai. Peut-être que tu viendras. Peut-être qu’il viendra. Peut-être qu’ils ne viendront pas.
    note: '*شاید* fonctionne exactement comme *ممکن است* : il est suivi du subjonctif et la personne est indiquée par la terminaison du verbe : *شاید بیایم، شاید بیایی، شاید بیاید، شاید بیاییم، شاید بیایین، شاید بیایند*. La négation met *ن* sur le verbe : *شاید نیایند* (peut-être qu’ils ne viendront pas). Un mot de temps peut se placer devant : *شاید فردا بیایم*.'
  prs.a2.unit30.lesson04.teach.can_maybe:
    title: 'شاید بتوانم : peut-être que je peux'
    gloss: Peut-être que je peux venir. Peut-être que je ne peux pas venir. Il pourrait être capable de venir.
    note: 'Tu peux combiner les deux idées : *شاید* ou *ممکن است* + le subjonctif de *توانستن*, qui est *بتوانم، بتوانی، بتواند، بتوانیم، بتوانین، بتوانند*, + le second verbe. Ainsi *شاید بتوانم بیایم* signifie « peut-être que je peux venir ». La négation est *نتوانم* : *شاید نتوانم بیایم* signifie « peut-être que je ne peux pas venir ». C’est utile quand tu ne sais pas encore si tu es libre.'
  prs.a2.unit30.lesson04.teach.maybe_tomorrow:
    title: Peut-être que je peux venir demain
    gloss: Peut-être que je peux venir demain.
    note: Tu n’es pas sûr, mais il y a une chance. Le mot de temps *فردا* se place après *شاید*.
  prs.a2.unit30.lesson04.teach.rain_phrase:
    title: Il pourrait pleuvoir
    gloss: Il se pourrait qu’il pleuve.
    note: '*ممکن است* + *ببارد* : une possibilité, pas une promesse.'
  prs.a2.unit30.lesson05.teach.fix:
    title: Réparer
    gloss: réparer, arranger, faire
    note: '*درست کردن* signifie « réparer » quelque chose, et aussi « faire », comme dans *چای درست کردن* (faire du thé). L’objet vient en premier avec *را* : *کمپیوترم را درست می‌کنم*.'
    example_gloss: Mon ami répare ma voiture.
  prs.a2.unit30.lesson05.teach.problem:
    title: Problème
    gloss: problème, difficulté
    note: '*مشکل* signifie « problème ». *مشکل کوچک* veut dire « un petit problème ».'
    example_gloss: Le problème est petit.
  prs.a2.unit30.lesson05.teach.turn01:
    title: Wahida demande à Sakhi s’il peut venir
    gloss: Sakhi, peux-tu venir chez nous demain ?
    note: 'Wahida demande à un ami s’il est libre demain : *فردا می‌توانی ... بیایی؟*. Elle utilise *تو* parce que Sakhi est un ami.'
  prs.a2.unit30.lesson05.teach.turn02:
    title: Sakhi indique ses disponibilités
    gloss: Le matin, je ne peux pas, parce que j’ai du travail au bureau. Mais après cinq heures, je suis libre.
    note: Sakhi refuse le matin avec *نمی‌توانم* et donne la raison avec *چون*. Après *نمی‌توانم*, le second verbe est omis parce que *بیایم* est clair d’après la question. Puis il propose un autre moment avec *ولی*.
  prs.a2.unit30.lesson05.teach.turn03:
    title: Wahida demande de l’aide
    gloss: C’est bien. Mon ordinateur est en panne. Peux-tu le réparer ?
    note: '*می‌توانی ... درست کنی؟* demande s’il est capable de le réparer. *آن را* (le) renvoie à l’ordinateur.'
  prs.a2.unit30.lesson05.teach.turn04:
    title: Sakhi n’est pas sûr
    gloss: Peut-être que je peux. Il se peut que le problème soit petit.
    note: Sakhi n’est pas certain, alors il dit *شاید بتوانم* (peut-être que je peux) et *ممکن است ... باشد* (il se peut que ce soit). Les deux sont suivis du subjonctif.
  prs.a2.unit30.lesson05.teach.message:
    title: Un message d’un ami
    gloss: Bonjour, mon ami. Demain, je ne peux pas venir, parce que le matin j’ai du travail au bureau. Après cinq heures, je suis libre, mais il se peut que j’arrive en retard. Peut-être que je pourrai venir jeudi. Es-tu libre jeudi ?
    note: 'Un court message qui reprend les trois idées de l’unité : ce que l’auteur ne peut pas faire (*نمی‌توانم بیایم*), quand il est libre (*بعد از ساعت پنج آزاد استم*), et ce qui pourrait arriver (*ممکن است دیر برسم، شاید ... بتوانم*).'
  prs.a2.unit30.lesson06.teach.park:
    title: Parc
    gloss: parc
    note: '*پارک* signifie « parc ». On va *به پارک* (au parc) et on reste *در پارک* (dans le parc).'
    example_gloss: Le parc est à Kaboul.
  prs.a2.unit30.lesson06.teach.tea:
    title: Le thé
    gloss: thé
    note: '*چای* signifie « thé ». *چای درست کردن* veut dire « faire du thé », avec le verbe vu dans la leçon précédente.'
    example_gloss: Le thé est chaud.
  prs.a2.unit30.lesson06.teach.turn01:
    title: Hamid demande ce qu’elle fait vendredi
    gloss: Palwasha, tu vas au parc vendredi ?
    note: '*جمعه به پارک می‌روی؟* interroge sur un projet avec le présent simple *می‌روی* et un mot de temps. Palwasha est une amie, donc il utilise *تو*.'
  prs.a2.unit30.lesson06.teach.turn02:
    title: Palwasha n’est pas sûre
    gloss: Peut-être que j’irai. Il se peut qu’il pleuve.
    note: Palwasha n’est pas sûre. *شاید بروم* signifie « peut-être que j’irai » et *ممکن است باران ببارد* « il se peut qu’il pleuve ». Les deux verbes sont au subjonctif.
  prs.a2.unit30.lesson06.teach.turn03:
    title: Hamid propose et demande
    gloss: Moi, je peux préparer à manger. Toi, peux-tu faire du thé ?
    note: Hamid dit ce qu’il peut faire (*می‌توانم غذا بپزم*) et demande ce que Palwasha peut faire (*می‌توانی چای درست کنی؟*).
  prs.a2.unit30.lesson06.teach.turn04:
    title: Palwasha accepte, avec une condition
    gloss: Oui, je peux. Mais s’il pleut, nous ne pouvons pas rester dans le parc.
    note: '*بلی، می‌توانم* accepte. Puis *اگر باران ببارد* (s’il pleut) pose une condition, et *نمی‌توانیم ... بمانیم* dit ce que les deux ne peuvent pas faire. *اگر* est lui aussi suivi du subjonctif.'
  prs.a2.unit30.lesson06.teach.turn05:
    title: Hamid a une autre idée
    gloss: Alors peut-être que nous mangerons chez moi.
    note: '*شاید ... بخوریم* est une suggestion qui pourrait convenir : peut-être que nous mangerons chez moi. *پس* (alors, donc) découle du problème de la pluie.'
exercises:
  prs.a2.unit30.lesson01.exercise01.recognize_swim:
    instruction: Que signifie cette phrase ?
    correct_option: Je sais nager
    distractors:
    - J’ai nagé hier
    - J’aime l’eau
    - Je veux apprendre à nager
    accepted_answers:
    - value: Je sais nager
      status: correct
    feedback: '*می‌توانم شنا کنم* signifie « je sais nager » : *می‌توانم* + le subjonctif *کنم*.'
  prs.a2.unit30.lesson01.exercise02.recognize_letter:
    instruction: Que signifie cette phrase ?
    correct_option: Je peux écrire une lettre
    distractors:
    - J’ai écrit une lettre
    - J’ai une lettre
    - Je dois écrire une lettre
    accepted_answers:
    - value: Je peux écrire une lettre
      status: correct
    feedback: '*می‌توانم نامه بنویسم* signifie « je peux écrire une lettre » : *نامه* est la lettre et *بنویسم* est le subjonctif de *نوشتن*.'
  prs.a2.unit30.lesson01.exercise03.match_skills:
    instruction: Associe chaque phrase en dari à son sens.
