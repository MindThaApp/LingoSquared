    - Je sais conduire
    - Ils ou elles peuvent conduire
    accepted_answers:
    - value: Il ou elle peut conduire
      status: correct
    feedback: '*می‌تواند* est la forme de la 3e personne du singulier du verbe modal, et *کند* est le subjonctif qui lui correspond.'
  prs.a2.unit30.lesson02.exercise02.match_paradigm:
    instruction: Associe chaque forme en dari à son sens.
    accepted_answers:
    - value:
        می‌توانم بروم: je peux y aller
        می‌توانی بروی: tu peux y aller (à un ami)
        می‌تواند برود: il ou elle peut y aller
        می‌توانیم برویم: nous pouvons y aller
        می‌توانین بروین: vous pouvez y aller (formel ou pluriel)
        می‌توانند بروند: ils peuvent y aller
        نمی‌توانم بروم: je ne peux pas y aller
        نمی‌توانند بروند: ils ne peuvent pas y aller
      status: correct
    feedback: 'Les deux verbes changent selon la personne : *-م* je, *-ی* tu (ami), *-د* il ou elle, *-یم* nous, *-ین* vous (forme de politesse ou pluriel), *-ند* ils ou elles. La négation ajoute *ن* uniquement devant *می‌توانم* et ses formes.'
    pairs:
    - left: می‌توانم بروم
      right: je peux y aller
    - left: می‌توانی بروی
      right: tu peux y aller (à un ami)
    - left: می‌تواند برود
      right: il ou elle peut y aller
    - left: می‌توانیم برویم
      right: nous pouvons y aller
    - left: می‌توانین بروین
      right: vous pouvez y aller (formel ou pluriel)
    - left: می‌توانند بروند
      right: ils peuvent y aller
    - left: نمی‌توانم بروم
      right: je ne peux pas y aller
    - left: نمی‌توانند بروند
      right: ils ne peuvent pas y aller
