    title: پروین donne son opinion
    gloss: پروین dit qu’à son avis, il vaut mieux étudier à l’étranger.
    note: Le même schéma *به نظر من ... بهتر است* pour exprimer une opinion.
  prs.a2.unit10.lesson04.teach.turn02:
    title: احمد n’est pas d’accord
    gloss: احمد dit qu’il ne pense pas.
    note: '*من فکر نمی‌کنم* vu plus tôt dans cette leçon.'
  prs.a2.unit10.lesson04.teach.turn03:
    title: پروین demande pourquoi
    gloss: پروین demande pourquoi.
    note: '*چرا؟* est le mot courant pour « pourquoi ? ».'
  prs.a2.unit10.lesson04.teach.turn04:
    title: احمد donne ses raisons
    gloss: احمد dit qu’il veut rester près de sa famille et qu’il pense pouvoir mieux aider sa patrie en restant.
    note: Deux raisons reliées par *و* (et).
  prs.a2.unit10.lesson04.teach.turn05:
    title: پروین concède un point mais reprend sa raison
    gloss: پروین dit que c’est vrai, mais qu’à son avis il y a plus d’opportunités de travail à l’étranger.
    note: '*درست است، ولی...* (c’est vrai, mais…) permet de concéder poliment un point avant de redire le sien.'
  prs.a2.unit10.lesson04.teach.turn06:
    title: احمد reconnaît l’argument mais maintient sa position
    gloss: احمد dit peut-être, mais que lui reste ici.
    note: '*شاید، ولی...* (peut-être, mais…) reconnaît doucement l’argument de l’autre sans changer d’avis.'
