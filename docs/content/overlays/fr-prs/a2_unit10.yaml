  prs.a2.unit10.lesson02.teach.in_my_opinion_better:
    title: Exprimer une opinion
    gloss: À mon avis, il vaut mieux étudier à l’étranger.
    note: '*به نظر من ...* (à mon avis…) est la façon habituelle d’introduire une opinion.'
  prs.a2.unit10.lesson02.teach.because_universities_jobs:
    title: Donner une raison avec چون (parce que)
    gloss: Parce qu’il y a de meilleures universités et plus d’opportunités de travail.
    note: '*چون* (« parce que ») introduit la raison qui appuie l’opinion.'
  prs.a2.unit10.lesson02.teach.full_opinion_with_reason:
    title: Associer l’opinion et la raison
    gloss: À mon avis, il vaut mieux étudier à l’étranger, parce qu’il y a de meilleures universités et plus d’opportunités de travail.
    note: 'C’est le schéma complet *به نظر من ... چون ...* : une opinion suivie de sa raison.'
