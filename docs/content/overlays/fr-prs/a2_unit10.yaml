    title: La famille
    gloss: famille
    note: '*فامیل* est le mot dari courant pour la famille.'
  prs.a2.unit10.lesson03.teach.message_text:
    title: Un message écrit donnant une opinion
    gloss: À mon avis, il vaut bien mieux étudier à l’étranger, parce qu’il y a de meilleures universités et plus d’opportunités de travail, et que je peux acquérir une nouvelle expérience.
    note: Une courte opinion écrite avec deux raisons reliées par *و* (et), le style écrit enseigné dans cette unité.
  prs.a2.unit10.lesson04.teach.i_dont_think_so:
    title: Exprimer poliment son désaccord
    gloss: Je ne pense pas.
    note: '*من فکر نمی‌کنم* est une façon simple et polie de ne pas être d’accord -- ce n’est pas impoli, juste direct.'
