teaching:
  prs.a2.unit13.lesson01.teach.malfunction_word:
    title: Panne / problème
    gloss: panne / dégât
    note: '*خرابی* est le mot général pour dire que quelque chose est cassé ou ne fonctionne pas.'
    example_gloss: J’ai signalé la panne du tuyau.
  prs.a2.unit13.lesson01.teach.pipe_word:
    title: Tuyau
    gloss: tuyau
    note: '*لوله* est le mot courant pour désigner un tuyau.'
    example_gloss: Le tuyau de la cuisine fuit.
  prs.a2.unit13.lesson01.teach.electricity_word:
    title: Électricité
    gloss: électricité / courant
    note: '*برق* signifie l’électricité ou l’alimentation en courant.'
    example_gloss: L’électricité de ma chambre ne fonctionne pas.
  prs.a2.unit13.lesson01.teach.leak_word:
    title: Fuite
    gloss: fuite / goutte-à-goutte
    note: '*چکه* décrit de l’eau qui fuit ou qui goutte.'
    example_gloss: La fuite du tuyau empire chaque nuit.
  prs.a2.unit13.lesson01.teach.repair_word:
    title: Réparation
    gloss: réparation
    note: '*تعمیر* est le mot général pour une réparation.'
    example_gloss: La réparation du tuyau a lieu demain.
  prs.a2.unit13.lesson01.teach.worker_word:
    title: Réparateur
    gloss: réparateur / ouvrier
    note: '*کارگر* désigne un ouvrier en général, ici plus précisément un réparateur.'
    example_gloss: Le propriétaire envoie un réparateur.
  prs.a2.unit13.lesson01.teach.asap_grammar:
    title: Dire « dès que possible » avec هر چه زودتر
    gloss: dès que possible
    note: '*هر چه زودتر* -- une construction qui exprime l’urgence, littéralement « le plus tôt que possible ».'
    target_text: هر چه زودتر (dès que possible)
  prs.a2.unit13.lesson02.teach.pipe_leaking_asap:
    title: Signaler le tuyau qui fuit, avec urgence
    gloss: Le tuyau de ma cuisine fuit et doit être réparé dès que possible.
    note: Associe *چکه می‌کند* (fuit) à *هر چه زودتر* et à *باید* (il faut).
  prs.a2.unit13.lesson02.teach.when_send_worker:
    title: Demander quand un réparateur peut venir
    gloss: Quand pouvez-vous envoyer un réparateur ?
    note: '*کی می‌توانین...؟* signifie « quand pouvez-vous... ? ».'
  prs.a2.unit13.lesson02.teach.bedroom_electricity_not_working:
    title: Signaler un deuxième problème
    gloss: L’électricité de ma chambre ne fonctionne pas.
    note: '*کار نمی‌کند* signifie « ne fonctionne pas », pour un appareil ou une installation.'
  prs.a2.unit13.lesson03.teach.cost_word:
    title: Coût / frais
    gloss: coût / frais
    note: '*هزینه* est le mot général pour un coût ou une dépense.'
    example_gloss: La réparation électrique est payante.
  prs.a2.unit13.lesson03.teach.free_word:
    title: Gratuit
    gloss: gratuit
    note: '*رایگان* signifie « gratuit », sans frais.'
    example_gloss: La réparation du tuyau est gratuite.
  prs.a2.unit13.lesson03.teach.notice_text:
    title: Un avis de maintenance de l’immeuble
    gloss: L’ouvrier de maintenance vient jeudi à dix heures. La réparation des tuyaux est gratuite, mais la réparation électrique est payante.
    note: Un court avis général de l’immeuble, en registre écrit formel -- un avis distinct de l’appel téléphonique de کریم plus loin dans l’unité, et non la même visite.
  prs.a2.unit13.lesson04.teach.turn01:
    title: Le propriétaire répond au téléphone
    gloss: 'Le propriétaire répond : « Allô, je vous écoute. »'
    note: '*الو* est ce qu’on dit en décrochant le téléphone ; *بفرمایین* signifie ici « je vous écoute » et non son sens habituel « je vous en prie, entrez ».'
  prs.a2.unit13.lesson04.teach.turn02:
    title: کریم se présente et signale la fuite
    gloss: Il salue, dit qu’il est کریم et que le tuyau de sa cuisine fuit.
    note: '*استم* est la copule « je suis » : *من کریم استم* signifie « je suis کریم ».'
  prs.a2.unit13.lesson04.teach.turn03:
    title: Le propriétaire demande depuis quand
    gloss: Le propriétaire demande depuis quand cela a commencé.
    note: '*از کی شروع شده؟* signifie « depuis quand cela a-t-il commencé ? ».'
  prs.a2.unit13.lesson04.teach.turn04:
    title: کریم répond avec urgence
    gloss: Depuis hier soir. Il faut le réparer dès que possible.
    note: '*دیشب* signifie « hier soir » ou « cette nuit ».'
  prs.a2.unit13.lesson04.teach.turn05:
    title: Le propriétaire fixe une heure
    gloss: D’accord, j’enverrai un réparateur demain à neuf heures.
    note: '*باشد* signifie « d’accord » ou « entendu ».'
  prs.a2.unit13.lesson04.teach.turn06:
    title: کریم le remercie et signale un deuxième problème
    gloss: Il remercie le propriétaire et dit que l’électricité de sa chambre ne fonctionne pas non plus.
    note: '*هم* signifie ici « aussi » et ajoute le deuxième problème.'
  prs.a2.unit13.lesson04.teach.turn07:
    title: Le propriétaire confirme qu’il transmettra l’information
    gloss: Le propriétaire dit qu’il en parlera aussi au réparateur.
    note: '*آن را هم به کارگر می‌گویم* -- « j’en parlerai aussi au réparateur » -- renvoie au problème d’électricité.'
