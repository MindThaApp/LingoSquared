course:
  title: Dari en français A2
  description: 'Dari afghan, niveau pré-intermédiaire : signaler un problème domestique à son propriétaire — vocabulaire, description du problème, lecture d’un avis de maintenance et appel téléphonique.'
units:
  prs.a2.unit13.maintenance:
    title: Signaler un problème dans le logement
lessons:
  prs.a2.unit13.lesson01.maintenance_vocabulary:
    title: Les mots des problèmes domestiques
  prs.a2.unit13.lesson02.reporting_the_problem:
    title: Signaler le problème
  prs.a2.unit13.lesson03.reading_a_maintenance_notice:
