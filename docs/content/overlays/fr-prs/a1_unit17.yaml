course:
  title: Dari A1
  description: 'Dari de Kaboul pour débutants : les symptômes de base (mal de tête, fièvre, mal au ventre), dire que tu te sens mal, demander un médecin ou un médicament, lire une courte consigne de santé et un court message décrivant des symptômes, et un dialogue avec un médecin.'
units:
  prs.a1.unit17.health:
    title: La santé
    description: Exprimer un problème de santé simple et comprendre des conseils immédiats simples.
lessons:
  prs.a1.unit17.lesson01.symptom_words:
    title: Les mots des symptômes
  prs.a1.unit17.lesson02.feeling_unwell:
    title: Dire que tu te sens mal
  prs.a1.unit17.lesson03.asking_for_help:
    title: Demander un médecin ou un médicament
  prs.a1.unit17.lesson04.reading_health_advice:
    title: Lire une consigne de santé
  prs.a1.unit17.lesson05.reading_a_health_message:
    title: Lire un message sur la santé
  prs.a1.unit17.lesson06.doctor_dialogue:
    title: Un dialogue avec le médecin
teaching:
  prs.a1.unit17.lesson01.teach.headache_word:
    title: Mal de tête
    gloss: mal de tête
    note: سردرد est un mot composé de سر (tête) et درد (douleur, mal).
    example_gloss: J’ai mal à la tête.
  prs.a1.unit17.lesson01.teach.fever_word:
    title: Fièvre
    gloss: fièvre
    note: تب signifie « fièvre ».
    example_gloss: J’ai de la fièvre.
  prs.a1.unit17.lesson01.teach.stomachache_word:
    title: Mal au ventre
    gloss: mal au ventre
    note: دل‌درد est un mot composé de دل (ventre, estomac, en langue familière) et درد (douleur, mal).
    example_gloss: J’ai mal au ventre.
  prs.a1.unit17.lesson01.teach.have_word:
    title: J’ai
    gloss: j’ai
    note: دارم est la forme de la première personne du présent du verbe داشتن (avoir).
    target_text: دارم (j’ai)
  prs.a1.unit17.lesson02.teach.sick_word:
    title: Malade
    gloss: malade
    note: مریض signifie « malade ».
    example_gloss: Je suis malade.
  prs.a1.unit17.lesson02.teach.am_word:
    title: Je suis
    gloss: je suis
    note: استم est la forme polie de la copule à la première personne, en accord avec le registre استم/استین de ce cours.
    target_text: استم (je suis)
  prs.a1.unit17.lesson02.teach.my_condition_word:
    title: Comment je vais
    gloss: comment je me sens / mon état
    note: حالم (حال + م) signifie littéralement « mon état » -- حالم خوب نیست signifie « je ne me sens pas bien ».
    target_text: حالم (comment je vais / mon état)
  prs.a1.unit17.lesson02.teach.good_word:
    title: Bon
    gloss: bon
    note: خوب signifie « bon » ou « bien ».
    example_gloss: Je ne me sens pas bien.
  prs.a1.unit17.lesson02.teach.not_word:
    title: N’est pas
    gloss: n’est pas
    note: نیست est la copule négative -- خوب نیست signifie « n’est pas bon / ne va pas bien ».
    target_text: نیست (n’est pas)
  prs.a1.unit17.lesson03.teach.doctor_word:
    title: Médecin
    gloss: médecin
    note: داکتر est l’orthographe et la prononciation standard du dari afghan pour « médecin » (différent de دکتر en persan d’Iran).
    example_gloss: Je voudrais un médecin.
  prs.a1.unit17.lesson03.teach.medicine_word:
    title: Médicament
    gloss: médicament
    note: دوا signifie « médicament ».
    example_gloss: Je voudrais un médicament.
  prs.a1.unit17.lesson03.teach.want_word:
    title: Je veux
    gloss: je veux
    note: می‌خواهم signifie « je veux ».
    target_text: می‌خواهم (je veux)
  prs.a1.unit17.lesson04.teach.rest_word:
    title: Repos
    gloss: repose-toi
    note: استراحت est le nom « repos » -- avec کنین, il forme l’impératif « Reposez-vous ! »
    example_gloss: Reposez-vous.
  prs.a1.unit17.lesson04.teach.do_word:
    title: Faites (politesse)
    gloss: faites (impératif poli)
    note: کنین est l’impératif poli de کردن (faire) -- استراحت کنین signifie littéralement « faites du repos », c’est-à-dire « Reposez-vous ».
    target_text: کنین (faites -- impératif de politesse)
  prs.a1.unit17.lesson04.teach.water_word:
    title: L’eau
    gloss: eau
    note: آب signifie « eau ».
    example_gloss: Buvez beaucoup d’eau.
  prs.a1.unit17.lesson04.teach.a_lot_word:
    title: Beaucoup
    gloss: beaucoup
    note: زیاد signifie « beaucoup ».
    example_gloss: Buvez beaucoup d’eau.
  prs.a1.unit17.lesson04.teach.drink_word:
    title: Buvez (politesse)
    gloss: buvez (impératif poli)
    note: بنوشین est l’impératif poli de نوشیدن (boire).
    target_text: بنوشین (buvez -- impératif de politesse)
  prs.a1.unit17.lesson04.teach.advice_text:
    title: Une consigne de santé
    gloss: Reposez-vous. Buvez beaucoup d’eau.
    note: Une courte note donnant deux conseils de santé de base.
  prs.a1.unit17.lesson05.teach.hello_word:
    title: Bonjour
    gloss: bonjour
    note: سلام signifie « bonjour ».
    example_gloss: Bonjour. Je suis malade.
  prs.a1.unit17.lesson05.teach.and_word:
    title: Et
    gloss: et
    note: و signifie « et » et relie deux éléments ou deux propositions.
    target_text: و (et)
  prs.a1.unit17.lesson05.teach.message_text:
    title: Un court message sur la santé
    gloss: Bonjour. Je suis malade. J’ai mal à la tête et de la fièvre.
    note: Un court message à la première personne décrivant deux symptômes.
  prs.a1.unit17.lesson06.teach.names:
    title: Bachir et le médecin
    gloss: Bachir, le médecin
    note: Bachir est un personnage récurrent de ce cours ; on s’adresse au médecin avec le titre honorifique صاحب.
    example_gloss:
    - Je suis Bachir.
    - Je suis le médecin.
  prs.a1.unit17.lesson06.teach.how_word:
    title: Comment
    gloss: comment
    note: چطور signifie « comment ».
    target_text: چطور (comment)
  prs.a1.unit17.lesson06.teach.are_you_word:
    title: Vous êtes (politesse)
    gloss: vous êtes
    note: استین est la copule polie de la deuxième personne, en accord avec le registre استم/استین de ce cours.
    target_text: استین (vous êtes -- politesse)
  prs.a1.unit17.lesson06.teach.thanks_word:
    title: Merci
    gloss: merci
    note: تشکر signifie « merci ».
    example_gloss: Merci, docteur.
  prs.a1.unit17.lesson06.teach.sir_word:
    title: Monsieur
    gloss: monsieur
    note: 'صاحب est un titre de respect ajouté après un nom ou un titre : داکتر صاحب signifie « Docteur », avec déférence. C’est un usage typiquement afghan.'
    example_gloss: Merci, docteur.
  prs.a1.unit17.lesson06.teach.dialogue_line1:
    title: Le docteur salue Bashir
    gloss: Bonjour. Comment allez-vous ?
  prs.a1.unit17.lesson06.teach.dialogue_line2:
    title: Bashir répond
    gloss: Bonjour. Je suis malade. J’ai mal à la tête et de la fièvre.
  prs.a1.unit17.lesson06.teach.dialogue_line3:
    title: Le docteur donne des conseils
    gloss: Reposez-vous. Buvez beaucoup d’eau.
  prs.a1.unit17.lesson06.teach.dialogue_line4:
    title: Bashir remercie le docteur
    gloss: Merci, docteur.
