    title: Il/elle / chaque jour / est
    gloss: il/elle / chaque jour / est
    note: او (il/elle, révision), هر روز (chaque jour, révision) et است (est, révision) sont présentés de nouveau ici.
    target_text: او (il/elle) / هر روز (chaque jour) / است (est)
  prs.a1.unit33.lesson05.teach.review_mishuyad:
    title: Il/elle lave
    gloss: il/elle lave
    note: می‌شوید est la forme de la 3e personne de شستن, qui suit le modèle des verbes en -د déjà vu (par ex. می‌کند).
    target_text: می‌شوید (il/elle lave)
