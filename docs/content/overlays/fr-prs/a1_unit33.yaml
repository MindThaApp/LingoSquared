teaching:
  prs.a1.unit33.lesson01.teach.housework_word:
    title: Les tâches ménagères
    gloss: tâches ménagères
    note: کار خانه signifie les tâches ménagères, l’expression qui donne le thème de cette unité.
    example_gloss: Il y a beaucoup de ménage à faire.
  prs.a1.unit33.lesson01.teach.broom_word:
    title: Balai
    gloss: balai
    note: جاروب signifie balai ; c’est le mot dari couramment utilisé en Afghanistan.
    example_gloss: Où est le balai ?
  prs.a1.unit33.lesson01.teach.dishes_word:
    title: Vaisselle
    gloss: vaisselle
    note: ظرف signifie vaisselle ; c’est un mot courant, commun au persan et au dari.
    example_gloss: La vaisselle est dans la cuisine.
  prs.a1.unit33.lesson01.teach.clean_word:
    title: Propre
    gloss: propre
    note: پاک signifie propre ; il décrit une pièce ou un objet.
    example_gloss: La chambre est propre.
  prs.a1.unit33.lesson01.teach.review_wash_do:
    title: Laver / faire
    gloss: laver / faire — je lave / je fais
    note: شستن (laver) est un verbe vraiment nouveau ; کردن (faire) et می‌کنم (je fais) sont des révisions des unités précédentes.
    target_text: شستن (laver) / کردن (faire) — می‌شویم (je lave) / می‌کنم (je fais)
  prs.a1.unit33.lesson01.teach.sweep_phrase:
    title: Je balaie
    gloss: Je balaie.
    note: Associe جاروب (balai) à می‌کنم (je fais, révision) — littéralement « je fais balai ».
  prs.a1.unit33.lesson01.teach.wash_dishes_phrase:
    title: Je lave la vaisselle
    gloss: Je lave la vaisselle.
    note: Associe ظرف (vaisselle) à می‌شویم (je lave), la forme de la 1re personne de شستن.
  prs.a1.unit33.lesson02.teach.review_emrouz_che_bali:
    title: Aujourd’hui / quoi / oui
    gloss: aujourd’hui / quoi / oui
    note: امروز, چه et بلی sont des révisions des unités précédentes.
    target_text: امروز (aujourd’hui) / چه (quoi / que) / بلی (oui)
  prs.a1.unit33.lesson02.teach.must_word:
    title: Il faut / devoir
    gloss: devoir / il faut
    note: باید est un mot modal vraiment nouveau ; il sert ici à dire qu’une tâche doit être faite.
    target_text: باید (il faut / devoir)
  prs.a1.unit33.lesson02.teach.subjunctive_konam:
    title: Que je fasse
    gloss: que je fasse
    note: کنم est la forme du subjonctif, sans préfixe می‌, utilisée après باید avec les verbes formés avec کردن.
    target_text: کنم (que je fasse — utilisé après باید avec les verbes en کردن, sans le préfixe می‌)
  prs.a1.unit33.lesson02.teach.must_sweep_phrase:
    title: Aujourd’hui, je dois balayer
    gloss: Aujourd’hui, je dois balayer.
    note: Associe امروز (aujourd’hui, révision) à باید جاروب کنم (je dois balayer).
  prs.a1.unit33.lesson02.teach.must_clean_phrase:
    title: Je dois nettoyer
    gloss: Je dois nettoyer.
    note: Associe باید (devoir, révision) à پاک کنم (que je nettoie).
  prs.a1.unit33.lesson02.teach.what_must_question:
    title: Que dois-je faire ?
    gloss: Que dois-je faire ?
    note: Associe چه کار (quelle tâche / quel travail) à باید کنم (je dois faire).
  prs.a1.unit33.lesson02.teach.answer_must_sweep:
    title: Oui, je dois balayer
    gloss: Oui, je dois balayer.
    note: Combine بلی (oui, révision) avec باید جاروب کنم (je dois balayer).
  prs.a1.unit33.lesson03.teach.help_word:
    title: Aide
    gloss: aide
    note: کمک signifie « aide » ; c’est un mot nouveau dans ce cours.
    example_gloss: Je voudrais de l’aide.
  prs.a1.unit33.lesson03.teach.review_lotfan_kardan_man:
    title: S’il vous plaît / faire / je / faites ! (formel)
    gloss: s’il vous plaît / faire / je, moi / faites ! (forme de politesse)
    note: لطفاً, کردن, من et کنین (l’impératif de politesse, qui suit la terminaison -ین déjà vue) sont tous des mots révisés des unités précédentes.
    target_text: لطفاً (s’il vous plaît) / کردن (faire) / من (je/moi) / کنین (faites ! formel)
  prs.a1.unit33.lesson03.teach.please_help_phrase:
    title: Aidez-moi, s’il vous plaît
    gloss: Aidez-moi, s’il vous plaît.
    note: Combine لطفاً (s’il vous plaît, révision) avec کمک کنین (aidez !, impératif de politesse).
  prs.a1.unit33.lesson03.teach.review_ki_mikonad:
    title: Qui / il ou elle fait
    gloss: qui / il/elle fait
    note: کی (qui, révision) et می‌کند (il/elle fait, révision) sont présentés de nouveau ici.
    target_text: کی (qui) / می‌کند (il/elle fait)
  prs.a1.unit33.lesson03.teach.who_sweeps_question:
    title: Qui balaie ?
    gloss: Qui balaie ?
    note: Combine کی (qui, révision) avec جاروب می‌کند (balaie, 3e personne).
  prs.a1.unit33.lesson03.teach.wahid_sweeps_answer:
    title: Wahid balaie
    gloss: Wahid balaie.
    note: Présente le personnage de Wahid (وحید), qui répond à la question « Qui balaie ? ».
  prs.a1.unit33.lesson03.teach.i_help_phrase:
    title: J’aide
    gloss: J’aide.
    note: Combine من (je, révision) avec کمک می‌کنم (j’aide).
  prs.a1.unit33.lesson04.teach.review_informal_words:
    title: Toi (informel) / tu fais / aussi / merci / beaucoup
    gloss: tu, toi (familier) / tu fais (familier) / aussi / merci / beaucoup
    note: تو, می‌کنی, هم, تشکر et زیاد sont des mots révisés, réunis ici pour le registre familier du dialogue.
    target_text: تو (toi, informel) / می‌کنی (tu fais, informel) / هم (aussi) / تشکر (merci) / زیاد (beaucoup)
  prs.a1.unit33.lesson04.teach.review_room_object_marker:
    title: Chambre / marque de l’objet
    gloss: pièce / marque de l’objet
    note: اتاق et را (marque de l’objet, révision) sont présentés de nouveau ici.
    target_text: اتاق (chambre, pièce) / را (marque de l’objet)
  prs.a1.unit33.lesson04.teach.dialogue_line1:
    title: 'Wahid : Shukria, aujourd’hui je dois balayer. Tu m’aides ?'
    gloss: Shukria, aujourd’hui je dois balayer. Tu m’aides ?
  prs.a1.unit33.lesson04.teach.dialogue_line2:
    title: 'Shukria : Oui, je t’aide. Je fais la vaisselle.'
    gloss: Oui, je t’aide. Je fais la vaisselle.
  prs.a1.unit33.lesson04.teach.dialogue_line3:
    title: 'Wahid : Tu nettoies aussi ?'
    gloss: Tu nettoies aussi ?
  prs.a1.unit33.lesson04.teach.dialogue_line4:
    title: 'Shukria : Oui, je nettoie la chambre.'
    gloss: Oui, je nettoie la chambre.
  prs.a1.unit33.lesson04.teach.dialogue_line5:
    title: 'Wahid : Merci beaucoup !'
    gloss: Merci beaucoup !
