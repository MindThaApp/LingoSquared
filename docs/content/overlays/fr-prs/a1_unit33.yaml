course:
  title: Dari A1
  description: 'Dari de Kaboul pour débutants : le vocabulaire des tâches ménagères (tâches ménagères, balai, vaisselle, propre, aide), dire quelle tâche doit être faite aujourd’hui avec باید, demander de l’aide pour une tâche, et un dialogue entre Wahid et Shukria sur le partage des tâches ménagères.'
units:
  prs.a1.unit33.household:
    title: Les tâches ménagères
    description: 'Parle des tâches ménagères : dis lesquelles il faut faire, qui les fait, et demande de l’aide pour l’une d’elles.'
