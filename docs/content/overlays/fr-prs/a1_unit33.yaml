    note: خوشحال signifie « content(e) ».
    target_text: خوشحال (heureux/heureuse)
  prs.a1.unit33.lesson05.teach.reading_passage:
    title: Lecture sur les tâches ménagères
    gloss: Wahid balaie chaque jour. Shukria fait la vaisselle. Il/Elle aide aussi. Wahid est content.
  prs.a1.unit33.lesson06.teach.review_like_have_time:
    title: J’aime / temps / je n’ai pas / mais
    gloss: j’aime / temps / je n’ai pas / mais
    note: دوست دارم (j’aime), وقت (temps), ندارم (je n’ai pas) et اما (mais) sont des mots révisés des unités précédentes, dans la continuité de ce récapitulatif.
    target_text: دوست دارم (j’aime) / وقت (temps) / ندارم (je n’ai pas) / اما (mais)
  prs.a1.unit33.lesson06.teach.wrap_summary:
    title: J’aime les tâches ménagères, mais je n’ai pas le temps
