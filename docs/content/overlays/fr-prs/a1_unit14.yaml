course:
  title: Dari A1
  description: 'Dari de Kaboul pour débutants : exprimer ses goûts, demander des préférences, choisir entre deux options, donner des raisons simples, et une courte lecture/un dialogue sur les préférences de deux personnes.'
units:
  prs.a1.unit14.preferences:
    title: Préférences
    description: Exprimer et demander ce qu’on aime ou non, avec des raisons simples.
lessons:
  prs.a1.unit14.lesson01.basic_likes:
    title: 'Goûts simples : aimer et ne pas aimer'
  prs.a1.unit14.lesson02.asking_preferences:
    title: Demander les préférences
  prs.a1.unit14.lesson03.choosing_between_options:
    title: Choisir entre deux choses
  prs.a1.unit14.lesson04.giving_reasons:
    title: Donner une raison
  prs.a1.unit14.lesson05.reading_about_preferences:
    title: Lire sur les préférences
  prs.a1.unit14.lesson06.preferences_dialogue:
    title: Un dialogue sur les préférences
teaching:
  prs.a1.unit14.lesson01.teach.doost_daram_phrase:
    title: J’aime
    gloss: j’aime
    note: دوست دارم signifie littéralement « j’ai de l’amitié (pour cela) » ; c’est la façon courante de dire « j’aime ».
  prs.a1.unit14.lesson01.teach.qahwa_word:
    title: Le café
    gloss: café
    note: قهوه signifie « café ».
    example_gloss: J’aime le café.
  prs.a1.unit14.lesson01.teach.chai_word:
    title: Le thé
    gloss: thé
    note: چای signifie « thé ».
    example_gloss: Je n’aime pas le thé.
  prs.a1.unit14.lesson01.teach.doost_nadaram_phrase:
    title: Je n’aime pas
    gloss: je n’aime pas
    note: دوست ندارم est la forme négative de دوست دارم.
  prs.a1.unit14.lesson01.teach.man_word:
    title: je
    gloss: je
    note: من est le pronom personnel de la première personne, employé seul.
    example_gloss: J’aime le café.
  prs.a1.unit14.lesson01.teach.ra_word:
    title: (marque de l’objet)
    gloss: (marque le complément d’objet du verbe)
    note: را marque un complément d’objet direct défini. En dari, on l’emploie aussi bien à l’oral qu’à l’écrit ; la forme رو, propre à l’usage iranien, ne s’emploie pas.
    target_text: را (marque de l’objet)
  prs.a1.unit14.lesson02.teach.kodam_word:
    title: Lequel / Quel
    gloss: quel / lequel
    note: کدام signifie « quel » ou « lequel ».
    example_gloss: Lequel aimez-vous ?
  prs.a1.unit14.lesson02.teach.moosiqi_word:
    title: La musique
    gloss: musique
    note: موسیقی signifie « musique ».
    example_gloss: J’aime la musique.
  prs.a1.unit14.lesson02.teach.darid_grammar:
    title: Vous avez / vous aimez (politesse)
    gloss: vous avez / vous aimez
    note: دارین est la forme de politesse (ou du pluriel) à la deuxième personne du verbe داشتن (avoir), en accord avec le registre poli adopté dans ce cours, comme pour استم/استین.
    target_text: دارین (vous avez / vous aimez, forme de politesse)
  prs.a1.unit14.lesson02.teach.kodam_ra_question:
    title: Lequel aimez-vous ?
    gloss: Lequel aimez-vous ?
    note: کدام را دوست دارین؟ -- را marque l’objet, ici la chose que tu choisis.
  prs.a1.unit14.lesson03.teach.bishtar_word:
    title: Plus
    gloss: plus
    note: بیشتر signifie « plus » ou « davantage ».
    example_gloss: J’aime davantage le café.
  prs.a1.unit14.lesson03.teach.ya_word:
    title: Ou
    gloss: ou
    note: یا signifie « ou » ; il sert à proposer un choix entre deux choses.
    target_text: یا (ou)
  prs.a1.unit14.lesson03.teach.qahwa_ya_chai_question:
    title: Café ou thé ?
    gloss: Du café ou du thé ?
    note: قهوه یا چای؟ propose un choix entre les deux boissons vues dans la leçon 01.
  prs.a1.unit14.lesson04.teach.choon_word:
    title: Parce que
    gloss: parce que
    note: چون introduit une raison.
    target_text: چون (parce que)
  prs.a1.unit14.lesson04.teach.khoshmaza_ast_word:
    title: C’est délicieux
    gloss: c’est délicieux
    note: 'خوش‌مزه است est la forme complète, non contractée (« c’est délicieux ») : dans ce cours, است reste séparé et n’est pas contracté.'
    example_gloss: J’aime le café parce que c’est délicieux.
  prs.a1.unit14.lesson04.teach.jaleb_ast_word:
    title: C’est intéressant
    gloss: c’est intéressant
    note: جالب است est la forme complète, non contractée (« c’est intéressant »).
    example_gloss: J’aime la musique parce que c’est intéressant.
  prs.a1.unit14.lesson04.teach.va_word:
    title: Et
    gloss: et
    note: و signifie « et » ; il relie deux propositions ou deux éléments.
    target_text: و (et)
  prs.a1.unit14.lesson05.teach.negar_name:
    title: Negar
    gloss: Negar
    note: Prénom féminin afghan courant.
    example_gloss: Negar aime le thé.
  prs.a1.unit14.lesson05.teach.darad_grammar:
    title: Il/elle aime
    gloss: il/elle aime
    note: دارد est la forme complète de la troisième personne de داشتن (avoir) ; دوست دارد signifie « il/elle aime », sur le modèle de دوست دارم à la première personne.
    target_text: دوست دارد (il/elle aime, forme complète à la 3e personne)
  prs.a1.unit14.lesson05.teach.nadarad_grammar:
    title: Il/elle n’aime pas
    gloss: il/elle n’aime pas
    note: ندارد est la forme négative complète de la troisième personne ; دوست ندارد signifie « il/elle n’aime pas ».
    target_text: دوست ندارد (il/elle n’aime pas, forme complète à la 3e personne)
  prs.a1.unit14.lesson05.teach.garm_ast_word:
    title: C’est chaud
    gloss: c’est chaud
    note: گرم است est la forme complète, non contractée (« c’est chaud »).
    example_gloss: Negar aime le thé parce qu’il est chaud.
  prs.a1.unit14.lesson05.teach.reading_text:
    title: Exemple de texte sur les préférences
    gloss: Negar aime le thé parce qu’il est chaud. Negar n’aime pas la musique.
    note: Un court récit à la troisième personne qui réunit le vocabulaire des préférences de cette unité.
  prs.a1.unit14.lesson06.teach.names:
    title: Karim et Negar
    gloss: Karim, Negar
    note: Prénoms afghans courants, utilisés tout au long de ce cours.
    example_gloss:
    - Je suis Karim.
    - Je suis Negar.
  prs.a1.unit14.lesson06.teach.shoma_chetor_phrase:
    title: Et vous ?
    gloss: Et vous ?
    note: شما چطور؟ est la façon polie de renvoyer la question à l’autre personne, en accord avec le registre poli de la famille استین.
  prs.a1.unit14.lesson06.teach.aali_ast_word:
    title: C’est super
    gloss: c’est super
    note: عالی است est la forme complète, non contractée (« c’est super »).
    example_gloss: Le café est super.
  prs.a1.unit14.lesson06.teach.dialogue_line1:
    title: Karim demande
    gloss: Thé ou café, lequel aimez-vous le plus ?
  prs.a1.unit14.lesson06.teach.dialogue_line2:
    title: Negar répond
    gloss: J’aime davantage le café parce qu’il est délicieux. Et vous ?
  prs.a1.unit14.lesson06.teach.dialogue_line3:
    title: Karim répond
    gloss: J’aime le thé parce qu’il est chaud.
  prs.a1.unit14.lesson06.teach.dialogue_line4:
    title: Negar réagit
    gloss: C’est super !
