    - Je veux beaucoup de pain
    accepted_answers:
    - value: Pourriez-vous me donner un peu de pain ?
      status: correct
    feedback: '*می‌شود که* introduit une demande polie et *بدهین* est le verbe : pourriez-vous donner.'
  prs.a2.unit31.lesson01.exercise02.recognize_help:
