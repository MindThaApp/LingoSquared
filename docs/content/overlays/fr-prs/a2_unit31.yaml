course:
  title: Dari en français A2
  description: 'Dari afghan de niveau pré-intermédiaire : faire des demandes polies avec می‌شود که et لطفاً, proposer son aide, accepter ou refuser poliment, et demander à quelqu’un de ne pas faire quelque chose avec l’impératif négatif (نکنین).'
units:
  prs.a2.unit31.polite_requests:
    title: Pourriez-vous… ? Demandes polies et propositions d’aide
lessons:
  prs.a2.unit31.lesson01.polite_request:
    title: Pourriez-vous… ? Les demandes polies
  prs.a2.unit31.lesson02.please_and_commands:
    title: S’il vous plaît et l’impératif
  prs.a2.unit31.lesson03.offers_and_replies:
    title: Proposer son aide, accepter et refuser
  prs.a2.unit31.lesson04.dont:
    title: 'Ne… pas : l’impératif négatif'
  prs.a2.unit31.lesson05.reading_and_listening:
    title: 'Lire et écouter : à propos d’un voisin'
  prs.a2.unit31.lesson06.shop_call:
    title: Un appel téléphonique à la boutique
teaching:
  prs.a2.unit31.lesson01.teach.neighbour:
    title: Voisin
    gloss: voisin
    note: '*همسایه* signifie voisin. Les voisins se demandent souvent de petits services : c’est donc la première personne à qui tu feras des demandes polies.'
    example_gloss: Notre voisin est très gentil.
  prs.a2.unit31.lesson01.teach.shopkeeper:
    title: Commerçant
    gloss: commerçant
    note: '*دوکاندار* est la personne qui travaille dans un *دوکان* (boutique). Tu demandes au *دوکاندار* ce dont tu as besoin, et il ou elle peut te proposer davantage.'
    example_gloss: Le commerçant est dans la boutique.
  prs.a2.unit31.lesson01.teach.milk:
    title: Le lait
    gloss: lait
    note: '*شیر* signifie lait. C’est une chose courante à demander dans une boutique, comme *نان* (pain).'
    example_gloss: Je bois du lait tous les jours.
  prs.a2.unit31.lesson01.teach.bag:
    title: Sac
    gloss: sac
    note: '*کیسه* signifie sac, par exemple le sac dans lequel le commerçant met tes courses.'
    example_gloss: J’ai acheté un sac de pain.
  prs.a2.unit31.lesson01.teach.frame:
    title: 'La demande polie : می‌شود که ...؟'
    gloss: 'Pourriez-vous me donner un peu de pain ? (litt. : Est-il possible que vous donniez un peu de pain ?)'
    note: 'Pour demander poliment quelque chose, commence par *می‌شود که* (est-il possible que) et mets le verbe au subjonctif : *می‌شود که کمی نان بدهین؟* Le verbe après *که* est de la même forme que celle qu’on emploie après *باید*, et il se termine par *-ین* quand tu t’adresses poliment à une personne ou à plusieurs (*شما*). Une demande est une question : la phrase se termine donc par *؟*. Une version parlée plus courte omet *که* : *می‌شود کمی نان بدهین؟*. Tu peux aussi demander avec *می‌توانین* : *می‌توانین کمی نان بدهین؟*'
  prs.a2.unit31.lesson01.teach.subj:
    title: Le subjonctif de دادن
    gloss: que je donne, que tu donnes, qu’il/elle donne, que nous donnions, que vous donniez (poli ou pluriel), qu’ils donnent
    note: Le subjonctif se forme avec *ب* + le radical du présent + les terminaisons *-م، -ی، -د، -یم، -ین، -ند*. Pour *دادن*, le radical est *ده* ; on obtient donc *بدهم، بدهی، بدهد، بدهیم، بدهین، بدهند*. Pour une demande à un voisin ou à un commerçant, il te faut la forme en *-ین*, *بدهین*.
  prs.a2.unit31.lesson01.teach.subj_more:
    title: Les demandes avec d’autres verbes
    gloss: donner, apporter, envoyer, prendre, emporter, dire, faire
    note: 'Mets le même subjonctif en *-ین* après *می‌شود که* avec n’importe quel verbe : *بیاورین* (apporter), *بفرستین* (envoyer), *بگیرین* (prendre), *ببرین* (emporter quelque chose quelque part), *بگویین* (dire) et *کنین* (faire). Les verbes formés avec *کردن* utilisent *کنین* après le premier mot : *کمک کنین* (aider), *صبر کنین* (attendre), *تیلفون کنین* (téléphoner), *باز کنین* (ouvrir).'
  prs.a2.unit31.lesson01.teach.help_req:
    title: Pourriez-vous m’aider ?
    gloss: Pourriez-vous m’aider ?
    note: '*می‌شود که کمک کنین؟* est la façon courante de demander de l’aide à un voisin. Commence par *ببخشین* (excusez-moi) si tu ne connais pas bien la personne.'
  prs.a2.unit31.lesson01.teach.bag_req:
    title: Excusez-moi, pourriez-vous me donner un sac ?
    gloss: Excusez-moi, pourriez-vous me donner un sac ?
    note: '*ببخشین* est une formule d’ouverture polie, et non de véritables excuses. Vient ensuite la demande : *می‌شود که یک کیسه بدهین؟*'
  prs.a2.unit31.lesson01.teach.yes_sure:
    title: Oui, bien sûr
    gloss: Oui, bien sûr.
    note: '*بلی، حتماً.* est une réponse polie et positive à une demande. *البته.* (bien sûr) a le même sens.'
  prs.a2.unit31.lesson02.teach.table:
    title: Table
    gloss: table
    note: '*میز* signifie table. C’est quelque chose que tu peux avoir besoin d’aide pour porter ou déplacer.'
    example_gloss: La table est dans la pièce.
  prs.a2.unit31.lesson02.teach.here:
    title: Ici
    gloss: ici
    note: '*اینجا* signifie ici, à cet endroit. Le contraire est *آنجا* (là-bas).'
    example_gloss: La clé est ici.
  prs.a2.unit31.lesson02.teach.imp_pl:
    title: L’impératif poli en -ین
    gloss: venez, allez, donnez, dites, prenez, apportez, faites (à un voisin ou à plusieurs personnes)
    note: 'Un ordre adressé à *شما* (un voisin, une personne plus âgée ou plusieurs personnes) se termine par *-ین* : *بیایین* (venez), *بروین* (allez), *بدهین* (donnez), *بگویین* (dites), *بگیرین* (prenez), *بیاورین* (apportez), *کنین* (faites). C’est la même forme que le subjonctif employé après *می‌شود که*.'
  prs.a2.unit31.lesson02.teach.imp_sg:
    title: L’impératif à un ami (sans terminaison)
    gloss: viens, va, donne, dis, prends, apporte, fais (à un ami ou à un enfant)
    note: 'À un ami ou à un enfant, supprime le *-ین* : *بیا، برو، بده، بگو، بگیر، بیاور، کن*. C’est la forme nue, qui est brusque à elle seule ; emploie-la donc uniquement avec les personnes que tu appelles *تو*. Avec un voisin ou un commerçant, utilise toujours la forme en *-ین*.'
  prs.a2.unit31.lesson02.teach.imp_rule:
    title: Comment se forme l’impératif
    gloss: 'Le schéma : b + radical du présent'
    note: L’impératif se forme avec *ب* + le radical du présent (*رو، ده، گو، گیر*), et on ajoute *-ین* pour *شما*. Le verbe *کردن* n’a pas de *ب* (*کن، کنین*), et *آمدن* donne *بیا، بیایین*. *آوردن* donne *بیاور* pour un ami et *بیاورین* à la forme polie.
  prs.a2.unit31.lesson02.teach.please_wait:
    title: Veuillez attendre un peu
    gloss: Veuillez attendre un peu.
    note: '*لطفاً* (s’il vous plaît) se place au début d’un ordre et le rend poli : *لطفاً کمی صبر کنین.*'
  prs.a2.unit31.lesson02.teach.please_bring:
    title: Veuillez apporter le sac
    gloss: Veuillez apporter le sac.
    note: 'Le complément d’objet se place avant le verbe et prend *را* quand il s’agit d’une chose précise : *کیسه را بیاورین*.'
  prs.a2.unit31.lesson02.teach.please_table:
    title: Veuillez porter cette table dans la pièce
    gloss: Veuillez porter cette table dans la pièce.
    note: '*ببرین* signifie emporter quelque chose quelque part. *به اتاق* indique où.'
  prs.a2.unit31.lesson02.teach.two_ways:
    title: Deux façons de demander
    gloss: Veuillez ouvrir le portail. / Excusez-moi, pourriez-vous ouvrir le portail ?
    note: '*لطفاً* suivi de l’impératif est court et direct, et convient quand on attend de l’autre personne qu’elle le fasse, par exemple un commerçant. *می‌شود که ...؟* est plus doux et mieux adapté pour un service demandé à un voisin. Les deux sont polis.'
  prs.a2.unit31.lesson03.teach.offer_forms:
    title: 'Proposer son aide : le verbe avec -م'
    gloss: Je vous aide ? Je vous apporte du thé ? Je vous donne aussi un sac ? Je vous envoie aussi du thé ?
    note: 'Pour proposer quelque chose, pose une question avec la forme du subjonctif de *من* : *کنم* (que je fasse), *بیاورم* (que j’apporte), *بدهم* (que je donne), *بفرستم* (que j’envoie). *کمک کنم؟* signifie « Je vous aide ? ». Tu peux ajouter *هم* (aussi) : *کیسه هم بدهم؟*'
  prs.a2.unit31.lesson03.teach.want_that:
    title: Voulez-vous que j’aide ?
    gloss: Voulez-vous que j’aide ?
    note: '*می‌خواهین که ...؟* est une autre façon de proposer son aide. On demande si l’autre personne le souhaite, et le verbe après *که* est de nouveau à la forme en *-م*.'
  prs.a2.unit31.lesson03.teach.offer_vs_request:
    title: Proposition ou demande ?
    gloss: Je vous apporte du thé ? / Apportez du thé, s’il vous plaît.
    note: 'La terminaison indique qui fait l’action. *بیاورم* (j’apporte) est une offre : je le fais pour vous. *بیاورین* (vous apportez) est une demande : vous le faites pour moi. Ainsi, *کیسه هم بدهم؟* est le commerçant qui propose, et *کیسه بدهین* est le client qui demande.'
  prs.a2.unit31.lesson03.teach.sugar:
    title: Sucre
    gloss: sucre
    note: '*قند* signifie « sucre ». En Afghanistan, on boit le thé avec ou sans *قند*.'
    example_gloss: Le thé avec du sucre, c’est bon.
  prs.a2.unit31.lesson03.teach.kindness:
    title: Gentillesse
    gloss: gentillesse, faveur
    note: '*لطف* signifie « gentillesse ». *لطف می‌کنین* est une façon polie de remercier : vous êtes bien aimable.'
    example_gloss: Merci de votre gentillesse.
  prs.a2.unit31.lesson03.teach.self:
    title: Moi-même
    gloss: moi-même, tout seul
    note: '*خودم* signifie « moi-même ». *خودم می‌کنم* veut dire « je le ferai moi-même ».'
    example_gloss: Je ferai le travail moi-même.
  prs.a2.unit31.lesson03.teach.yes_please:
    title: Oui, volontiers
    gloss: Oui, s’il vous plaît.
    note: Cette phrase sert à accepter une offre. Après *بلی*, tu peux ajouter *تشکر*.
  prs.a2.unit31.lesson03.teach.yes_kind:
    title: Oui, merci, c’est aimable
    gloss: Oui, merci. C’est gentil de votre part.
    note: Une façon plus chaleureuse d’accepter. *لطف می‌کنین* signifie que l’autre personne est aimable.
  prs.a2.unit31.lesson03.teach.no_thanks:
    title: Non, merci
    gloss: Non, merci.
    note: Le refus poli le plus simple. Ajoute toujours *تشکر* ; un *نه* seul est abrupt.
  prs.a2.unit31.lesson03.teach.no_need:
    title: Ce n’est pas nécessaire
    gloss: Ce n’est pas nécessaire.
    note: '*لازم نیست* signifie « ce n’est pas nécessaire ». Utilise-le pour refuser une offre avec gentillesse. Tu peux dire *نه، تشکر. لازم نیست.* ou *خودم می‌کنم.*'
  prs.a2.unit31.lesson04.teach.neg_pl:
    title: 'Ne pas... : l’impératif négatif avec نـ'
    gloss: ne fais pas, ne va pas, ne dis pas, ne donne pas, ne prends pas, ne viens pas (forme polie)
    note: 'Pour dire « ne... pas », on met *نـ* sur l’impératif à la place de *بـ* : *بروین* devient *نروین*, *بگویین* devient *نگویین*, *بدهین* devient *ندهین*, *بگیرین* devient *نگیرین*. *کنین* n’a pas de *بـ* : on lui ajoute simplement *نـ* devant : *نکنین*. *بیایین* est à retenir : il devient *نیایین*.'
  prs.a2.unit31.lesson04.teach.neg_sg:
    title: L’impératif négatif à un ami
    gloss: ne fais pas, ne va pas, ne dis pas, ne donne pas, ne viens pas, ne prends pas
    note: 'À un ami, la même règle s’applique sans la terminaison : *نکن، نرو، نگو، نده، نیا، نگیر*. Un simple *نکن* est brusque : réserve-le aux amis et aux enfants. À un voisin, dis toujours *نکنین* et ajoute *لطفاً*.'
  prs.a2.unit31.lesson04.teach.leave:
    title: 'Mettre, laisser : بگذارین et نگذارین'
    gloss: mets/laisse, mettez/laissez (poli) ; ne mets/laisse pas, ne mettez/laissez pas (poli)
    note: '*گذاشتن* signifie mettre ou laisser quelque chose quelque part. *دروازه را باز بگذارین* veut dire « laissez le portail ouvert » ; *دروازه را باز نگذارین* veut dire « ne laissez pas le portail ouvert ».'
  prs.a2.unit31.lesson04.teach.dont_late:
    title: Ne soyez pas en retard, s’il vous plaît
    gloss: Ne soyez pas en retard, s’il vous plaît.
    note: '*دیر کردن* signifie être en retard ou tarder. *لطفاً دیر نکنین* est un rappel poli avant que quelqu’un n’apporte ou n’envoie quelque chose.'
  prs.a2.unit31.lesson04.teach.dont_go:
    title: N’y allez pas demain, s’il vous plaît
    gloss: N’y allez pas demain, s’il vous plaît.
    note: '*لطفاً* suivi d’un impératif négatif sert à demander poliment de ne pas faire quelque chose.'
  prs.a2.unit31.lesson04.teach.dont_come_late:
    title: Ne venez pas en retard, s’il vous plaît
    gloss: Ne venez pas en retard, s’il vous plaît.
    note: '*نیایین* est la forme négative de *بیایین* (venez).'
  prs.a2.unit31.lesson04.teach.gate_open:
    title: Veuillez ne pas laisser le portail ouvert
    gloss: Ne laissez pas le portail ouvert, s’il vous plaît.
    note: Une demande typique adressée à un voisin ou à un visiteur d’une boutique.
  prs.a2.unit31.lesson04.teach.park:
    title: Ne laissez pas de voiture ici, s’il vous plaît
    gloss: Ne laissez pas de voiture ici, s’il vous plaît.
    note: 'Un autre emploi courant de *نگذارین* : ne vous garez pas ici, s’il vous plaît.'
  prs.a2.unit31.lesson04.teach.no_trouble:
    title: Ne vous dérangez pas, s’il vous plaît
    gloss: Ne vous donnez pas cette peine, s’il vous plaît.
    note: '*زحمت کشیدن* signifie se donner de la peine. On dit *لطفاً زحمت نکشین* quand quelqu’un propose du thé ou de l’aide, pour refuser poliment et avec reconnaissance.'
  prs.a2.unit31.lesson04.teach.better_not:
    title: Il vaut mieux ne pas y aller demain
    gloss: Il vaut mieux que vous n’y alliez pas demain.
    note: '*بهتر است* (il vaut mieux) est une façon plus douce de dire « ne... pas ». C’est un conseil, pas un ordre.'
  prs.a2.unit31.lesson05.teach.mrs:
    title: Madame
    gloss: Madame
    note: '*خانم* se place devant le nom d’une femme comme titre de politesse : *خانم رحیمه*.'
    example_gloss: Madame Rahima est notre voisine.
  prs.a2.unit31.lesson05.teach.mr:
    title: Monsieur
    gloss: Monsieur
    note: '*آقای* se place devant le nom d’un homme : *آقای مسعود*.'
    example_gloss: Monsieur Masood est dans la boutique.
  prs.a2.unit31.lesson05.teach.flower:
    title: Fleur
    gloss: fleur
    note: '*گل* signifie « fleur ». Ajoute *‌ها* pour le pluriel et *-م* pour « mon/mes » : *گل‌هایم* (mes fleurs).'
    example_gloss: Mes fleurs sont dans la maison.
  prs.a2.unit31.lesson05.teach.water:
    title: L’eau
    gloss: eau
    note: '*آب* signifie « eau ». *آب دادن* veut dire arroser une plante : *به گل‌ها آب بدهین*.'
    example_gloss: Je bois de l’eau.
  prs.a2.unit31.lesson05.teach.not_home:
    title: Je ne suis pas à la maison jusqu’à vendredi
    gloss: Je ne suis pas à la maison jusqu’à vendredi.
    note: '*نیستم* signifie « je ne suis pas ». *تا جمعه* signifie « jusqu’à vendredi ».'
  prs.a2.unit31.lesson05.teach.may_i:
    title: Puis-je... ?
    gloss: Puis-je laisser la clé chez vous ?
    note: 'Avec la forme en *-م*, *می‌شود که ...؟* demande la permission : *می‌شود که کلید را پیش شما بگذارم؟* signifie « puis-je laisser la clé chez vous ? ». Avec la forme en *-ین*, c’est une demande adressée à l’autre personne. Compare *می‌شود که کمک کنم؟* (puis-je aider ?) et *می‌شود که کمک کنین؟* (pourriez-vous aider ?).'
  prs.a2.unit31.lesson05.teach.people:
    title: Majida et Shafiq sont voisins
    gloss: Majida et Shafiq sont voisins.
    note: Dans le texte ci-dessous, Majida laisse un mot à son voisin Shafiq.
  prs.a2.unit31.lesson05.teach.d1_t1:
    title: Masood demande de l’aide
    gloss: Bonjour madame Rahima. Excusez-moi, pourriez-vous m’aider un peu aujourd’hui ?
    note: Masood commence par une salutation et *ببخشین*, puis demande avec *می‌شود که* et la forme en *-ین* *کنین*.
  prs.a2.unit31.lesson05.teach.d1_t2:
    title: Rahima accepte
    gloss: Bonjour monsieur Masood. Bien sûr. Que dois-je faire ?
    note: '*البته* est un « oui » poli. *چه کار کنم؟* utilise la forme en *-م* pour demander ce qu’elle doit faire.'
  prs.a2.unit31.lesson05.teach.d1_t3:
    title: Masood dit ce dont il a besoin
    gloss: Pourriez-vous porter cette table dans la pièce avec moi ?
    note: Une deuxième demande, cette fois pour un objet précis. *با من* signifie « avec moi ».
  prs.a2.unit31.lesson05.teach.d1_t4:
    title: Rahima accepte
    gloss: Oui, bien sûr.
    note: Une acceptation brève et chaleureuse.
  prs.a2.unit31.lesson05.teach.d1_t5:
    title: Masood propose du thé
    gloss: Merci beaucoup. Je vous apporte du thé ?
    note: '*خیلی تشکر* signifie « merci beaucoup ». *چای بیاورم؟* est une offre avec la forme en *-م*.'
  prs.a2.unit31.lesson05.teach.d1_t6:
    title: Rahima refuse
    gloss: Non, merci. Ne vous donnez pas cette peine, s’il vous plaît.
    note: Rahima refuse avec *نه، تشکر*, puis emploie l’impératif négatif *نکشین* pour dire « ne vous donnez pas de peine ».
  prs.a2.unit31.lesson05.teach.message:
    title: Un mot pour une voisine ou un voisin
    gloss: Bonjour monsieur Shafiq. Demain, je pars à Mazar et je ne serai pas à la maison jusqu’à vendredi. Puis-je laisser la clé de ma maison chez vous ? Arrosez mes fleurs tous les jours, s’il vous plaît. Ne laissez pas le portail ouvert, s’il vous plaît. Merci de votre gentillesse. Majida
    note: Un court mot écrit avec une demande de permission, une demande et une demande négative. Remarque qu’il reprend les mêmes structures que la conversation.
  prs.a2.unit31.lesson06.teach.d2_t1:
    title: Farzana téléphone à la boutique
    gloss: Allô, bonjour. Pourriez-vous envoyer deux pains et un carton de lait chez nous ?
    note: Farzana téléphone à la boutique. *الو* signifie « allô » au téléphone. *بفرستین* est la forme de demande polie de *فرستادن* (envoyer).
  prs.a2.unit31.lesson06.teach.d2_t2:
    title: Le commerçant accepte et demande l’heure
    gloss: Oui, bien sûr. À quelle heure dois-je l’envoyer ?
    note: Le commerçant accepte et utilise la forme en *-م* *بفرستم* pour demander quand.
  prs.a2.unit31.lesson06.teach.d2_t3:
    title: Farzana donne l’heure
    gloss: À cinq heures. Ne soyez pas en retard, s’il vous plaît.
    note: Farzana répond avec l’heure et ajoute un impératif négatif.
  prs.a2.unit31.lesson06.teach.d2_t4:
    title: Le commerçant promet et propose du thé
    gloss: Non, je ne serai pas en retard. J’envoie aussi du thé ?
    note: 'Ici, *نه* répond à la demande négative : non, je ne serai pas en retard. Ensuite, il propose du thé.'
  prs.a2.unit31.lesson06.teach.d2_t5:
    title: Farzana refuse
    gloss: Non, merci. J’ai du thé.
    note: 'Elle refuse et donne une raison : elle a déjà du thé.'
  prs.a2.unit31.lesson06.teach.d2_t6:
    title: Le commerçant conclut
    gloss: Très bien.
    note: Une brève formule de clôture.
  prs.a2.unit31.lesson06.teach.cannot:
    title: Désolé, je ne peux pas maintenant
    gloss: Désolé, je ne peux pas maintenant.
    note: 'Pour refuser une demande, dis que tu es désolé avec *متأسفم* ou *ببخشین*, puis explique pourquoi ou quand : *متأسفم، فردا نمی‌توانم.*'
  prs.a2.unit31.lesson06.teach.summary:
    title: Le système complet
    gloss: Demande, ordre poli, ordre négatif, offre
    note: 'Une demande : *می‌شود که ... بدهین؟* ou *لطفاً ... بدهین*. Une demande de ne pas faire quelque chose : *لطفاً ... نکنین*. Une offre : *... بدهم؟* ou *می‌خواهین که ... کنم؟*. Réponses : *بلی، لطفاً.* ou *نه، تشکر.* Un refus à une demande : *متأسفم، نمی‌توانم.*'
exercises:
  prs.a2.unit31.lesson01.exercise01.recognize_bread:
    instruction: Que signifie cette phrase ?
    correct_option: Pourriez-vous me donner un peu de pain ?
    distractors:
    - Je t’ai donné du pain
