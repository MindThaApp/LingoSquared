  prs.a1.unit16.lesson06.confirming_travel_plans:
    title: Confirmer des projets de voyage
teaching:
  prs.a1.unit16.lesson01.teach.belit_word:
    title: Billet
    gloss: billet
    note: تکت signifie « billet ». C’est le mot afghan courant ; بلیط (aussi écrit بلیت, le mot utilisé en Iran) est compris et accepté, mais تکت est ce que tu entendras le plus souvent.
    example_gloss: J’ai un billet.
  prs.a1.unit16.lesson01.teach.qatar_word:
    title: Train
    gloss: train
    note: قطار signifie « train ».
    example_gloss: Le train est bien.
  prs.a1.unit16.lesson01.teach.bas_word:
    title: Autobus
    gloss: autobus
    note: بس signifie « bus », emploi courant en dari afghan.
    example_gloss: Le bus est bien.
  prs.a1.unit16.lesson01.teach.maidan_hawayi_word:
    title: Aéroport
    gloss: aéroport
    note: 'میدان هوایی signifie « aéroport » : c’est le terme afghan retenu dans ce cours (et non فرودگاه, utilisé en Iran), comme dans l’unité 5.'
    example_gloss: L’aéroport est bien.
  prs.a1.unit16.lesson01.teach.yak_word:
    title: Un / une
    gloss: un / une / un seul
    note: یک signifie « un » et sert ici d’article indéfini (un billet).
    target_text: یک (un / une)
  prs.a1.unit16.lesson01.teach.az_word:
    title: De / depuis
    gloss: de, depuis
    note: از signifie « de » et marque l’origine (à distinguer de son autre emploi, « que », dans les comparaisons).
    target_text: از (de / depuis)
  prs.a1.unit16.lesson01.teach.doo_word:
    title: Deux
    gloss: deux
    note: دو signifie « deux ».
    example_gloss: J’ai deux billets.
  prs.a1.unit16.lesson01.teach.sekooye_word:
    title: Quai deux
    gloss: quai numéro deux
    note: سکوی دو associe سکو (quai) au lien d’ézafé -ی et à دو (deux).
    target_text: سکوی دو (quai deux)
  prs.a1.unit16.lesson02.teach.herat_word:
    title: Hérat
    gloss: Hérat
    note: Grande ville de l’ouest de l’Afghanistan.
    example_gloss: Je vais à Hérat.
  prs.a1.unit16.lesson02.teach.mikhaham_word:
    title: Je veux
    gloss: je veux
    note: می‌خواهم est la forme complète, non contractée, de « je veux », conforme au registre de ce cours.
    target_text: می‌خواهم (je veux)
  prs.a1.unit16.lesson02.teach.be_word:
    title: À / vers
    gloss: à / pour
    note: 'به marque la destination : به هرات signifie « à Hérat ».'
    target_text: به (à / vers)
  prs.a1.unit16.lesson02.teach.belit_be_herat_phrase:
    title: Je voudrais un billet pour Hérat
    gloss: Je voudrais un billet pour Hérat
    note: 'یک تکت به هرات می‌خواهم réunit le vocabulaire de cette leçon : c’est la façon habituelle de demander un billet.'
  prs.a1.unit16.lesson03.teach.sekoo_word:
    title: Quai
    gloss: quai
    note: سکو signifie « quai » (dans une gare).
    example_gloss: Le train part du quai deux.
  prs.a1.unit16.lesson03.teach.harekat_mikonad_phrase:
    title: Il part
    gloss: il part
    note: حرکت می‌کند est la forme complète, non contractée, de « il part / il se met en route ».
    target_text: حرکت می‌کند (il part)
  prs.a1.unit16.lesson03.teach.kay_word:
    title: Quand
    gloss: quand
    note: کی signifie « quand » et sert à poser une question sur l’heure.
    target_text: کی (quand)
  prs.a1.unit16.lesson04.teach.sobh_word:
    title: Matin
    gloss: matin
    note: صبح signifie « matin ».
    example_gloss: Le train part à huit heures du matin.
  prs.a1.unit16.lesson04.teach.schedule_text:
    title: Exemple d’horaire
    gloss: Le train pour Hérat part du quai deux à huit heures du matin.
    note: Courte annonce factuelle qui réunit le vocabulaire de voyage de cette unité ; ce texte écrit remplace une annonce sonore de gare.
  prs.a1.unit16.lesson05.teach.farda_word:
    title: Demain
    gloss: demain
    note: فردا signifie « demain ».
    example_gloss: J’y vais demain matin.
  prs.a1.unit16.lesson05.teach.besyar_khoob_word:
    title: Très bien / d’accord
    gloss: très bien / d’accord
    note: بسیار خوب est la façon complète et soignée de dire « d’accord / très bien », conforme au registre de ce cours (et non le familier باشه).
    example_gloss: Le train est très bien.
  prs.a1.unit16.lesson05.teach.dialogue_line1:
    title: Le voyageur dit
    gloss: Je voudrais un billet pour Hérat.
  prs.a1.unit16.lesson05.teach.dialogue_line2:
    title: Le vendeur demande
    gloss: Quand voulez-vous partir ?
  prs.a1.unit16.lesson05.teach.dialogue_line3:
    title: Le voyageur répond
    gloss: Demain matin.
  prs.a1.unit16.lesson05.teach.dialogue_line4:
    title: Le vendeur confirme
    gloss: Très bien, le train part du quai deux à huit heures du matin.
  prs.a1.unit16.lesson06.teach.tashakor_ziyad_word:
    title: Merci beaucoup
    gloss: merci beaucoup
    note: تشکر زیاد est une façon polie courante de dire « merci beaucoup », déjà vue dans les unités 5 et 6.
  prs.a1.unit16.lesson06.teach.qabeli_nadara_phrase:
    title: De rien
    gloss: avec plaisir
    note: قابلی نداره est la réponse polie habituelle à un remerciement (« de rien »), déjà vue dans les unités 5 et 6.
  prs.a1.unit16.lesson06.teach.safar_khosh_phrase:
    title: Bon voyage
    gloss: bon voyage
    note: سفر خوش est un souhait d’adieu courant pour quelqu’un qui part en voyage, déjà vu dans l’unité 6.
  prs.a1.unit16.lesson06.teach.va_word:
    title: Et
    gloss: et
    note: و signifie « et » et relie deux propositions ou deux éléments.
    target_text: و (et)
