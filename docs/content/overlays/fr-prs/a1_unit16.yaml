course:
  title: Dari A1
  description: 'Dari de Kaboul pour débutants : vocabulaire de base du voyage, acheter un billet, demander l’heure de départ et le quai, lire un horaire court et dialogue au guichet.'
units:
  prs.a1.unit16.travel:
    title: Voyage
    description: Comprendre les informations de base sur les transports, les billets, les destinations et les départs.
lessons:
  prs.a1.unit16.lesson01.basic_travel_vocab:
    title: Vocabulaire de base du voyage
