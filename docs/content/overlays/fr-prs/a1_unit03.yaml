  prs.a1.unit03.lesson02.exercise07.speak_distinction:
    instruction: 'Explique le lien de parenté, sans parler d’une personne précise : dis qu’un oncle paternel (کاکا) est le frère de ton père, et qu’un oncle maternel (ماما) est le frère de ta mère.'
