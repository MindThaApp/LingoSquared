teaching:
  prs.a1.unit03.lesson01.teach.mother:
    title: Mère
    gloss: mère
    note: مادر est le mot dari neutre pour « mère ».
    example_gloss: Ma mère est gentille.
  prs.a1.unit03.lesson01.teach.father:
    title: Père
    gloss: père
    note: پدر est le mot dari neutre pour « père ».
    example_gloss: Mon père est médecin.
  prs.a1.unit03.lesson01.teach.brother:
    title: Frère
    gloss: frère
    note: برادر signifie « frère ».
    example_gloss: J’ai un frère.
  prs.a1.unit03.lesson01.teach.sister:
    title: Sœur
    gloss: sœur
    note: خواهر signifie « sœur ».
    example_gloss: Ma sœur est enseignante.
  prs.a1.unit03.lesson01.teach.parents:
    title: Les parents
    gloss: père et mère ; parents
    note: Le dari dit couramment پدر و مادر pour parler de ses parents.
    example_gloss: Mes parents vivent à Kaboul.
  prs.a1.unit03.lesson01.teach.my_mother:
    title: Présenter ta mère
    gloss: C’est ma mère.
    note: La terminaison ـم dans مادرم signifie « mon / ma ».
  prs.a1.unit03.lesson02.teach.grandfather:
    title: Grand-père
    gloss: grand-père
    note: پدرکلان est le terme habituel en dari afghan ; littéralement, « grand père » ou « père aîné ».
    example_gloss: Mon grand-père est âgé.
  prs.a1.unit03.lesson02.teach.grandmother:
    title: Grand-mère
    gloss: grand-mère
    note: مادرکلان est le terme habituel en dari afghan ; littéralement, « grande mère » ou « mère aînée ».
    example_gloss: Ma grand-mère est gentille.
  prs.a1.unit03.lesson02.teach.paternal_uncle:
    title: Le frère du père
    gloss: oncle paternel
    note: کاکا désigne précisément le frère de ton père.
    example_gloss: Mon oncle vit à Hérat.
  prs.a1.unit03.lesson02.teach.paternal_aunt:
    title: La sœur du père
    gloss: tante paternelle
    note: عمه désigne précisément la sœur de ton père.
    example_gloss: Ma tante est enseignante.
  prs.a1.unit03.lesson02.teach.maternal_uncle:
    title: Le frère de la mère
    gloss: oncle maternel
    note: ماما désigne précisément le frère de ta mère en dari.
    example_gloss: Mon oncle (maternel) est ingénieur.
  prs.a1.unit03.lesson02.teach.maternal_aunt:
    title: La sœur de la mère
    gloss: tante maternelle
    note: خاله désigne précisément la sœur de ta mère.
    example_gloss: Ma tante (maternelle) vit à Kaboul.
  prs.a1.unit03.lesson02.teach.side_distinction:
    title: Distinguer les deux côtés de la famille
    gloss: Kaka et amma sont du côté paternel ; mama et khala sont du côté maternel.
    note: Comme en français, « oncle » et « tante » ne disent pas de quel côté de la famille ils viennent ; le dari, lui, l’exprime avec ces quatre mots distincts.
  prs.a1.unit03.lesson03.teach.family:
    title: La famille
    gloss: famille
    note: فامیل est le mot courant en dari afghan pour « famille ».
    example_gloss: Ma famille est grande.
  prs.a1.unit03.lesson03.teach.how_many_people:
    title: Demander poliment la taille de la famille
    gloss: Combien de personnes y a-t-il dans votre famille ?
    note: ـتان marque le « votre » de politesse ; نفر est le mot de comptage pour les personnes.
  prs.a1.unit03.lesson03.teach.five_people:
    title: Indiquer la taille de la famille
    gloss: Nous sommes cinq dans notre famille.
    note: Le dari exprime la taille de la famille par un nombre de personnes avec نفر است.
  prs.a1.unit03.lesson03.teach.have_siblings:
    title: Compter ses frères et sœurs
    gloss: J’ai un frère et deux sœurs.
    note: دارم signifie « j’ai ». Le nom reste au singulier après un nombre.
  prs.a1.unit03.lesson03.teach.only_child:
    title: Enfant unique
    gloss: Je suis enfant unique.
    note: استم est la forme de la première personne en dari de Kaboul enseignée dans ce cours.
  prs.a1.unit03.lesson03.teach.possession:
    title: Les formes du verbe « avoir »
    gloss: j’ai ; nous avons ; vous avez
    note: دارین est le « vous avez » de politesse ou de pluriel, dans le dari familier cultivé de Kaboul.
  prs.a1.unit03.lesson04.teach.have_siblings_question:
    title: Poser une question sur les frères et sœurs
    gloss: Avez-vous des frères et sœurs ?
    note: دارین rend la question polie ou pluriel.
  prs.a1.unit03.lesson04.teach.how_many_siblings:
    title: Demander combien quelqu’un a de frères et sœurs
    gloss: Combien de frères et sœurs avez-vous ?
    note: چند demande « combien ».
  prs.a1.unit03.lesson04.teach.parents_well:
    title: Demander des nouvelles des parents de quelqu’un
    gloss: Vos parents vont-ils bien ?
    note: جور استند est une façon familière en Afghanistan de dire « ils vont bien ».
  prs.a1.unit03.lesson04.teach.yes_answer:
    title: Réponse affirmative
    gloss: Oui, j’ai un frère.
    note: بلی est le « oui » poli et standard employé en Afghanistan.
  prs.a1.unit03.lesson04.teach.no_answer:
    title: Réponse négative
    gloss: Non, je n’ai pas de sœur.
    note: نخیر est le « non » respectueux ; ندارم signifie « je n’ai pas ».
  prs.a1.unit03.lesson04.teach.polite_your:
    title: Le « votre » de politesse
    gloss: votre famille ; votre mère ; votre père
    note: La terminaison possessive ـتان est respectueuse ou plurielle. Ce cours la rattache au mot avec un ZWNJ.
  prs.a1.unit03.lesson05.teach.married:
    title: Marié
    gloss: marié(e)
    note: متأهل est un terme neutre pour la situation matrimoniale.
    example_gloss: Il / elle est marié(e).
  prs.a1.unit03.lesson05.teach.single:
    title: Célibataire
    gloss: célibataire
    note: مجرد signifie « célibataire » dans ce contexte.
    example_gloss: Je suis célibataire.
  prs.a1.unit03.lesson05.teach.husband:
    title: Mari
    gloss: mari
    note: شوهر est le mot courant pour dire « mari ».
    example_gloss: Mon mari est ingénieur.
  prs.a1.unit03.lesson05.teach.wife:
    title: Épouse
    gloss: épouse
    note: خانم peut signifier « épouse » ou « madame » quand on s’adresse poliment à une femme ; le contexte permet de les distinguer.
    example_gloss: Mon épouse est enseignante.
  prs.a1.unit03.lesson05.teach.marriage_question:
    title: Demander poliment si l’on est marié
    gloss: Êtes-vous marié(e) ?
    note: Littéralement, cela demande « Vous êtes-vous marié(e) ? ». La terminaison ـین est la forme de politesse de Kaboul.
  prs.a1.unit03.lesson05.teach.married_answer:
    title: Dire que l’on est marié
    gloss: Oui, je suis marié(e).
    note: استم est la forme de la première personne du verbe « être » en dari d’Afghanistan, employée ici.
  prs.a1.unit03.lesson05.teach.children:
    title: Demander si l’on a des enfants
    gloss: Tu as des enfants ?
    note: اولاد est un mot collectif courant pour parler de son enfant ou de ses enfants.
  prs.a1.unit03.lesson06.teach.turn01:
    title: Maryam demande combien de personnes compte la famille
    gloss: Combien de personnes y a-t-il dans votre famille ?
    note: Maryam emploie la terminaison de politesse ـتان.
  prs.a1.unit03.lesson06.teach.turn02:
    title: Fereshteh parle de ses frères et sœurs
    gloss: Nous sommes cinq. J’ai un frère et une sœur.
    note: Les membres de la famille se comptent avec نفر.
  prs.a1.unit03.lesson06.teach.turn03:
    title: Maryam demande si elle est mariée
    gloss: Êtes-vous mariée ?
    note: La question est polie et neutre dans sa forme.
  prs.a1.unit03.lesson06.teach.turn04:
    title: Fereshteh parle de son mari
    gloss: Oui, je suis mariée. Mon mari est étudiant.
    note: محصل, et non le mot iranien دانشجو, est le mot dari afghan établi pour dire « étudiant ».
  prs.a1.unit03.lesson06.teach.turn05:
    title: Maryam demande si elle a des enfants
    gloss: Tu as des enfants ?
    note: دارین conserve la forme de politesse.
  prs.a1.unit03.lesson06.teach.turn06:
    title: Fereshteh répond
    gloss: Non, nous n’avons pas encore d’enfants.
    note: نخیر est un « non » poli ; نداریم signifie « nous n’avons pas ».
