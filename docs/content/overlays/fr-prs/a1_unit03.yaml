    title: La famille et les proches
lessons:
  prs.a1.unit03.lesson01.immediate_family:
    title: Les membres de la famille proche
  prs.a1.unit03.lesson02.extended_family:
    title: Les proches du côté de ta mère et de ton père
  prs.a1.unit03.lesson03.family_size:
    title: Combien de personnes y a-t-il dans ta famille ?
  prs.a1.unit03.lesson04.ask_about_family:
    title: Poser des questions sur la famille de quelqu’un
  prs.a1.unit03.lesson05.marital_status:
