course:
  title: Dari A1
  description: 'Dari afghan pour débutants : le vocabulaire de la boutique et des prix, demander un prix poliment, lire une étiquette de prix, demander une quantité, marchander une réduction et une conversation complète au marché.'
units:
  prs.a1.unit10.shopping:
    title: Achats et prix
lessons:
  prs.a1.unit10.lesson01.shopping_vocabulary:
    title: Les mots du magasin
  prs.a1.unit10.lesson02.asking_a_price:
