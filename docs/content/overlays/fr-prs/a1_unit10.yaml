  prs.a1.unit10.lesson06.market_dialogue:
    title: Une conversation complète au marché
teaching:
  prs.a1.unit10.lesson01.teach.dokan:
    title: Boutique
    gloss: boutique
    note: دوکان est le mot authentiquement afghan pour une petite boutique de quartier ; en persan d’Iran, on dit مغازه.
    example_gloss: Cette boutique est grande.
  prs.a1.unit10.lesson01.teach.qeymat:
    title: Le prix
    gloss: le prix
    note: قیمت signifie « prix ».
    example_gloss: Combien coûte ceci ?
  prs.a1.unit10.lesson01.teach.arzan:
    title: Bon marché
    gloss: bon marché
    note: ارزان signifie « bon marché » ou « peu cher ».
    example_gloss: Ceci est bon marché.
  prs.a1.unit10.lesson01.teach.gran:
    title: Cher
    gloss: cher
    note: گران est le contraire de ارزان.
    example_gloss: Ceci est cher.
  prs.a1.unit10.lesson01.teach.takhfif:
    title: Réduction
    gloss: réduction
    note: تخفیف signifie « réduction de prix ».
    example_gloss: Vous avez une réduction ?
  prs.a1.unit10.lesson01.teach.va_word:
    title: Et
    gloss: et
    note: و est le mot courant qui sert à relier deux courtes phrases ou demandes.
    example_gloss: J’achète des pommes et du pain.
  prs.a1.unit10.lesson02.teach.qeymatesh_chand:
    title: Combien ça coûte ?
    gloss: Ça fait combien ?
    note: قیمتش چند است؟ signifie littéralement « son prix, c’est combien ? ».
  prs.a1.unit10.lesson02.teach.sad_afghani:
    title: C’est cent afghanis.
    gloss: C’est cent afghanis.
    note: صد افغانی است indique un prix avec افغانی, la monnaie afghane.
  prs.a1.unit10.lesson03.teach.sib:
    title: Pomme(s)
    gloss: pomme(s)
    note: سیب signifie « pomme » ; ici, il est employé au pluriel ou de façon générale pour des pommes vendues en lot.
    example_gloss: Je voudrais un kilo de pommes.
  prs.a1.unit10.lesson03.teach.kilo:
    title: Kilo
    gloss: kilo
    note: کیلو est l’unité habituelle pour vendre les produits au poids.
    example_gloss: Je voudrais un kilo de pommes.
  prs.a1.unit10.lesson03.teach.label_text:
    title: 'Pommes : un kilo, cent afghanis'
    gloss: 'Pommes : un kilo, cent afghanis'
    note: 'سیب: یک کیلو صد افغانی est une étiquette de prix typique au marché.'
  prs.a1.unit10.lesson04.teach.yak_kilo_sib:
    title: Je voudrais un kilo de pommes.
    gloss: Je voudrais un kilo de pommes.
    note: یک کیلو سیب می‌خواهم reprend le schéma یک [article] می‌خواهم vu pour commander à manger dans l’unité 8.
  prs.a1.unit10.lesson04.teach.do_kilo:
    title: Je voudrais deux kilos.
    gloss: Je voudrais deux kilos.
    note: دو کیلو می‌خواهم remplace یک par دو (deux) pour une quantité plus grande.
  prs.a1.unit10.lesson05.teach.takhfif_mitanin:
    title: Pouvez-vous faire une réduction ?
    gloss: Pouvez-vous faire une réduction ?
    note: تخفیف می‌توانین بدهین؟ demande poliment un prix plus bas, avec می‌توانین (vous pouvez).
  prs.a1.unit10.lesson05.teach.baraye_shoma:
    title: Pour vous, ça fait 180 afghanis.
    gloss: Pour vous, ça fait 180 afghanis.
    note: 'برای شما صد و هشتاد افغانی می‌شه propose un total réduit : 20 afghanis de moins que les 200 afghanis pour deux kilos à 100 chacun.'
  prs.a1.unit10.lesson06.teach.befarmayin:
    title: Je vous en prie, allez-y
    gloss: je vous en prie, allez-y
    note: بفرمایین est une formule chaleureuse et polie que le commerçant adresse au client qui arrive.
    example_gloss: Voilà, c’est le prix.
  prs.a1.unit10.lesson06.teach.turn01:
    title: Bonjour, entrez, je vous en prie.
    gloss: Bonjour, entrez, je vous en prie.
    note: Le commerçant accueille chaleureusement le client.
  prs.a1.unit10.lesson06.teach.turn02:
    title: Bonjour. Combien coûtent les pommes ?
    gloss: Bonjour. Combien coûtent les pommes ?
    note: Le client demande le prix des pommes.
  prs.a1.unit10.lesson06.teach.turn03:
    title: Un kilo coûte cent afghanis.
    gloss: Un kilo coûte cent afghanis.
    note: Le commerçant indique le prix au kilo.
  prs.a1.unit10.lesson06.teach.turn04:
    title: Je voudrais deux kilos. Pouvez-vous faire une réduction ?
    gloss: Je voudrais deux kilos. Pouvez-vous faire une réduction ?
    note: Le client indique la quantité et demande une réduction.
  prs.a1.unit10.lesson06.teach.turn05:
    title: Oui, pour vous, deux kilos font 180 afghanis.
    gloss: Oui, pour vous, deux kilos font 180 afghanis.
    note: Le commerçant accepte et donne le total avec réduction, en accord avec le prix de 100 afghanis le kilo indiqué plus haut (200 moins une réduction de 20 afghanis).
  prs.a1.unit10.lesson06.teach.turn06:
    title: Très bien, merci.
    gloss: Très bien, merci.
    note: Le client accepte le prix et remercie le commerçant.
