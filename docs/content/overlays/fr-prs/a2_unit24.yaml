course:
  title: Dari en français A2
  description: 'Dari afghan niveau pré-intermédiaire : dire ce qui se passait quand autre chose est arrivé. Le passé en cours avec می‌ et le radical du passé, la forme facultative در حال ... بودم, le passé simple pour l’événement qui interrompt, relié par وقتی که, ناگهان et همان وقت.'
units:
  prs.a2.unit24.what_was_happening:
    title: Que se passait-il quand...
lessons:
  prs.a2.unit24.lesson01.words_and_continuing_past:
    title: Mots de la météo et de la rue, et la forme می‌رفتم
  prs.a2.unit24.lesson02.more_verbs_and_things:
    title: Plus de verbes, et des mots tirés de l’histoire
  prs.a2.unit24.lesson03.contrast_finished_or_ongoing:
    title: Action terminée ou action en cours
  prs.a2.unit24.lesson04.telling_what_was_happening:
    title: 'Raconter ce qui se passait : وقتی که …'
  prs.a2.unit24.lesson05.reading_and_listening:
    title: Lire et écouter le récit d’un incident
  prs.a2.unit24.lesson06.conversation_and_mixed:
    title: Une conversation sur la soirée d’hier
teaching:
  prs.a2.unit24.lesson01.teach.sarak:
    title: Rue
    gloss: rue, route
    note: '*سرک* désigne une rue ou une route. Avec *در*, cela donne « dans la rue » : *در سرک*. L’unité commence dans la rue, car la plupart de nos petits incidents s’y produisent.'
    example_gloss: Notre bureau est près de la rue.
  prs.a2.unit24.lesson01.teach.piyada:
    title: À pied
    gloss: à pied
    note: '*پیاده* signifie « à pied ». *پیاده می‌روم* veut dire « j’y vais à pied, je marche ». Ici, le verbe est au présent *می‌روم* ; dans cette unité, tu vas découvrir le passé du même modèle.'
    example_gloss: Tous les jours, je vais au bureau à pied.
  prs.a2.unit24.lesson01.teach.rain:
    title: Pluie
    gloss: pluie
    note: '*باران* signifie « pluie ». *شروع شد* veut dire « a commencé » : *باران شروع شد* se traduit par « la pluie a commencé ». Tu utiliseras cette paire tout au long de l’unité pour l’événement qui interrompt.'
    example_gloss: La pluie a commencé.
  prs.a2.unit24.lesson01.teach.snow:
    title: Il pleut, il neige
    gloss: il pleut, il neige
    note: '*برف* signifie « neige ». Le verbe *باریدن* (tomber, en parlant de la pluie ou de la neige) sert pour les deux : *باران می‌بارد* veut dire « il pleut » et *برف می‌بارد* « il neige ». Ce sont deux formes du présent avec *می*.'
    example_gloss:
    - Aujourd'hui, il pleut.
    - À Kaboul, il neige.
  prs.a2.unit24.lesson01.teach.wind:
    title: Vent
    gloss: vent
    note: '*باد* signifie « vent ». Pour dire qu’il y a du vent, on dit qu’il y a beaucoup de vent : *باد زیاد است*.'
    example_gloss: Aujourd’hui, il y a beaucoup de vent.
  prs.a2.unit24.lesson01.teach.traffic:
    title: La circulation
    gloss: circulation
    note: '*ترافیک* signifie « circulation, trafic ». *ترافیک زیاد* désigne une circulation dense, une raison très courante d’être en retard.'
    example_gloss: Il y a beaucoup de circulation dans la rue.
  prs.a2.unit24.lesson01.teach.imperfect_paradigm:
    title: 'J’allais : می + radical du passé + terminaisons'
    gloss: j’allais, tu allais, il/elle allait, nous allions, vous alliez (forme de politesse ou pluriel), ils/elles allaient
    note: 'Tu connais déjà le passé simple pour une action terminée : *رفتم* signifie « je suis allé(e) ». Pour dire ce qui se passait à un moment du passé, on place *می‌* devant le verbe au passé : *می‌رفتم* signifie « j’allais ». Le modèle est *می‌* + radical du passé (*رفت*) + les mêmes terminaisons : *می‌رفتم، می‌رفتی، می‌رفت، می‌رفتیم، می‌رفتین، می‌رفتند*. Les pronoms *من، تو، او، ما، شما، آن‌ها* sont facultatifs. La météo fonctionne de la même façon : *باران می‌بارید* signifie « il pleuvait » et *برف می‌بارید* « il neigeait ». Compare avec le présent *می‌روم* (je vais) : seuls le radical et la terminaison changent. La même forme *می‌رفتم* peut aussi signifier « j’allais (habituellement) », comme dans *هر روز پیاده می‌رفتم* ; c’est la phrase autour qui indique le sens voulu. Dans cette unité, elle signifiera surtout « j’allais » pour une action en cours.'
  prs.a2.unit24.lesson02.teach.car:
    title: Voiture
    gloss: voiture
    note: '*موتر* est le mot afghan courant pour « voiture ». *در موتر* signifie « dans la voiture ».'
    example_gloss: Notre voiture est neuve.
  prs.a2.unit24.lesson02.teach.phone:
    title: Téléphone
    gloss: téléphone
    note: '*تیلفون* signifie « téléphone ». Ajoute *-م* pour dire « mon » : *تیلفونم* signifie « mon téléphone ».'
    example_gloss: Mon téléphone est allumé.
  prs.a2.unit24.lesson02.teach.umbrella:
    title: Le parasol
    gloss: parasol
    note: '*چتر* signifie « parapluie ». La pluie et le parapluie vont ensemble : *چتر دارم* veut dire « j’ai un parapluie » et *چتر ندارم* « je n’en ai pas ».'
    example_gloss: Aujourd’hui, il pleut ; j’ai un parapluie.
  prs.a2.unit24.lesson02.teach.wet:
    title: Se faire mouiller
    gloss: être mouillé(e), se faire mouiller
    note: '*خیس* signifie « mouillé » et *خیس شدن* « se faire mouiller ». *خیس شدم* veut dire « je me suis fait(e) mouiller », une conséquence fréquente de la pluie.'
    example_gloss: S’il pleut, je me fais mouiller.
  prs.a2.unit24.lesson02.teach.ring:
    title: Sonner, téléphoner
    gloss: sonner, téléphoner à quelqu’un
    note: '*زنگ زدن* a deux emplois. Un téléphone peut sonner : *تیلفونم زنگ زد* (mon téléphone a sonné). Une personne peut téléphoner à quelqu’un : *دوستم به من زنگ زد* (mon ami m’a téléphoné). Le radical du passé est *زد*, de *زدن*.'
    example_gloss: Mon ami m’a téléphoné.
  prs.a2.unit24.lesson02.teach.driving:
    title: Conduire
    gloss: conduire
    note: '*رانندگی کردن* signifie « conduire ». *رانندگی* est la conduite et *کردن* le verbe « faire », comme dans *خرید کردن*. C’est un nom suivi de *کردن* : c’est donc la partie verbale qui change : *رانندگی کردم*.'
    example_gloss: Je conduis tous les jours.
  prs.a2.unit24.lesson02.teach.more_verbs:
    title: Le même modèle avec d’autres verbes
    gloss: je faisais, tu faisais, je mangeais, je voyais ou je regardais, je venais
    note: 'Tous les verbes suivent la même règle : *می‌* + radical du passé + terminaison. *کردن* donne *می‌کردم* (je faisais) et *می‌کردی* (tu faisais). *خوردن* donne *می‌خوردم* (je mangeais). *دیدن* donne *می‌دیدم* (je voyais ; pour un film, je regardais). *آمدن* donne *می‌آمدم* (je venais). Avec un verbe comme *آشپزی کردن*, seule la partie verbale change : *آشپزی می‌کردم* signifie « je cuisinais », et non *می‌آشپزی*. Le radical ne change jamais, seules les terminaisons changent.'
  prs.a2.unit24.lesson02.teach.cooking:
    title: je cuisinais
    gloss: Je cuisinais.
    note: '*آشپزی* signifie « cuisine (l’action de cuisiner) », un mot de révision des unités sur la routine quotidienne. *آشپزی می‌کردم* dit que tu étais en plein milieu de la cuisine.'
  prs.a2.unit24.lesson02.teach.watching:
    title: Je regardais un film à la maison
    gloss: Je regardais un film à la maison.
    note: '*فلم دیدن* signifie « regarder un film » ; le passé en cours est donc *فلم می‌دیدم*. *در خانه* signifie « à la maison ».'
  prs.a2.unit24.lesson02.teach.driving_car:
    title: Je conduisais dans la voiture
    gloss: Je conduisais la voiture.
    note: '*در موتر* signifie « dans la voiture » et *رانندگی می‌کردم* « je conduisais ».'
  prs.a2.unit24.lesson03.teach.was_paradigm:
    title: 'Étais, était : بودن au passé'
    gloss: j’étais, tu étais, il/elle était, nous étions, vous étiez (forme de politesse ou pluriel), ils/elles étaient
    note: '*بودن* signifie « être ». Son passé se forme comme tout autre passé : radical *بود* plus les terminaisons *بودم، بودی، بود، بودیم، بودین، بودند*. C’est ainsi qu’on dit « j’étais », « il était » : *در موتر بودم* (j’étais dans la voiture), *ترافیک زیاد بود* (la circulation était dense). Ne le confonds pas avec le présent *استم، استی، است*. Un état, comme se trouver quelque part ou attendre, n’a pas besoin de *می‌*, car *بودم* décrit déjà une situation à ce moment du passé.'
  prs.a2.unit24.lesson03.teach.waiting:
    title: Attendre
    gloss: attendre, être en train d’attendre
    note: '*منتظر بودن* signifie « attendre ». Attendre est un état ; le passé est donc simplement *منتظر بودم* (j’attendais), sans *می‌*. Ce qu’on attend se place avant *منتظر* : *منتظر بس بودم*.'
    example_gloss: À l’arrêt, j’attendais le bus.
  prs.a2.unit24.lesson03.teach.negative_continuing:
    title: 'Je n’allais pas : نمی + radical du passé'
    gloss: je n’allais pas, je ne mangeais pas, je ne voyais pas, je ne faisais pas
    note: 'Pour dire que tu ne faisais pas quelque chose à ce moment-là, place *نمی‌* devant le radical du passé au lieu de *می‌* : *نمی‌رفتم* (je n’allais pas), *نمی‌خوردم* (je ne mangeais pas), *نمی‌دیدم* (je ne voyais pas), *نمی‌کردم* (je ne faisais pas). Compare avec le passé négatif simple vu dans l’unité sur le week-end : *نرفتم* signifie « je ne suis pas allé(e) » (un fait terminé : cela n’a pas eu lieu), tandis que *نمی‌رفتم* signifie « je n’allais pas » (pas en cours à ce moment-là, ou je n’avais pas l’habitude d’y aller).'
  prs.a2.unit24.lesson03.teach.finished_vs_ongoing:
    title: Je suis allé(e) et j’allais
    gloss: Je suis rentré(e) à la maison. / J’allais à la maison.
    note: 'Les deux formes se ressemblent presque, mais elles racontent des histoires différentes. *به خانه رفتم* signifie « je suis rentré(e) à la maison » : le trajet est terminé. *به خانه می‌رفتم* signifie « je rentrais à la maison » : j’étais en chemin, pas encore arrivé(e), et quelque chose peut arriver en route. Quand tu racontes ce qui se passait, l’action de fond, plus longue, prend *می‌*, et l’événement soudain se met au passé simple sans *می‌*.'
  prs.a2.unit24.lesson03.teach.when_two_pasts:
    title: Quand + passé simple ou quand + می
    gloss: Quand je suis arrivé(e) à la maison, la pluie a commencé. / Quand je marchais dans la rue, la pluie a commencé.
    note: 'Les deux phrases utilisent *وقتی که* (quand), mais c’est le verbe qui suit qui décide du sens. Avec un passé simple, *وقتی که به خانه رسیدم، باران شروع شد*, le premier événement est terminé et le second le suit : après mon arrivée à la maison, la pluie a commencé. Avec *می‌*, *وقتی که در سرک می‌رفتم، باران شروع شد*, la première action était encore en cours et la pluie a commencé au milieu. Pour raconter ce qui se passait, il faut le second modèle.'
  prs.a2.unit24.lesson03.teach.in_progress_emphasis:
    title: 'Facultatif : در حال … بودم'
    gloss: J’étais en train d’aller. / J’étais en train de cuisiner. / Je suis en train d’aller.
    note: 'Le dari a une seconde manière, un peu plus forte, de dire qu’une action était en cours : *در حال* + l’infinitif + *بودم*. *در حال رفتن بودم* signifie « j’étais en train d’aller », et avec un nom suivi de *کردن*, tout l’infinitif suit : *در حال آشپزی کردن بودم*. Cela a le même sens que *می‌رفتم* et *آشپزی می‌کردم* simples ; cela insiste seulement davantage sur le fait que l’action était en cours. Tu n’es jamais obligé(e) de l’utiliser, et les deux formes sont correctes partout dans cette unité. Le présent a la même forme d’insistance : *در حال رفتن استم* signifie « je suis en train d’aller », mais c’est le simple *می‌روم* que l’on dit le plus souvent.'
  prs.a2.unit24.lesson04.teach.when_pattern:
    title: 'Le modèle : وقتی که + می, puis l’événement'
    gloss: Quand je marchais dans la rue, la pluie a commencé.
    note: 'Pour dire ce qui se passait quand quelque chose est arrivé, construis la phrase en deux parties. D’abord le fond : *وقتی که* + l’action en cours avec *می‌* : *وقتی که در سرک می‌رفتم*. Puis une virgule et l’événement qui a interrompu, au passé simple sans *می‌* : *باران شروع شد*. Cela donne *وقتی که در سرک می‌رفتم، باران شروع شد.* L’action longue (*می‌رفتم*) était déjà en cours et l’événement court (*شروع شد*) est venu l’interrompre. Cela fonctionne aussi avec la forme d’insistance facultative : *وقتی که در حال رفتن بودم، باران شروع شد*. Tu peux omettre *که* et dire simplement *وقتی*.'
  prs.a2.unit24.lesson04.teach.suddenly:
    title: Soudain
    gloss: soudain
    note: '*ناگهان* signifie « soudain ». Il se place juste avant le verbe de l’événement soudain, comme dans *ناگهان باران شروع شد*. Il convient bien au verbe qui interrompt, lequel est au passé simple.'
    example_gloss: Soudain, la pluie a commencé.
  prs.a2.unit24.lesson04.teach.same_time:
    title: À ce moment-là
    gloss: à ce moment précis
    note: '*همان وقت* signifie « à ce moment précis ». Utilise-le au début d’une nouvelle phrase pour ajouter un second événement survenu en même temps : *همان وقت تیلفونم زنگ زد*.'
    example_gloss: À ce moment précis, mon téléphone a sonné.
  prs.a2.unit24.lesson04.teach.power_cut:
    title: Le courant a été coupé
    gloss: le courant a été coupé
    note: '*برق* signifie « électricité ». *برق رفت* veut dire « le courant a été coupé » (l’électricité est partie), un petit incident qui interrompt ce que tu faisais.'
    example_gloss: Soudain, le courant a été coupé.
  prs.a2.unit24.lesson04.teach.event_vs_background:
    title: Quel verbe a می et lequel n’en a pas
    gloss: Quand je regardais un film, soudain le courant a été coupé. À ce moment précis, mon téléphone a sonné.
    note: 'Dans chaque phrase, repère deux sortes de verbes. L’action de fond a *می‌* : *فلم می‌دیدم* (je regardais un film), car elle dure un moment. L’événement qui interrompt n’a pas de *می‌* : *برق رفت* (le courant a été coupé), car il arrive une fois et c’est fini. *ناگهان* ou *همان وقت* vont avec l’événement, pas avec le fond. Si les deux verbes avaient *می‌*, ou si aucun n’en avait, la phrase n’indiquerait plus lequel a interrompu l’autre.'
  prs.a2.unit24.lesson05.teach.got_wet_we:
    title: Nous nous sommes fait mouiller
    gloss: nous nous sommes fait mouiller
    note: '*شدیم* signifie « nous sommes devenus », le passé simple de *شدن* avec la terminaison *-یم*. *خیس شدیم* veut dire « nous nous sommes fait mouiller ».'
    example_gloss: Dans la rue, la pluie a commencé et nous nous sommes fait mouiller.
  prs.a2.unit24.lesson05.teach.friend_pl:
    title: Avec mes amis
    gloss: avec mes amis
    note: '*دوستانم* signifie « mes amis » et *با* « avec » : *با دوستانم* signifie « avec mes amis ». Tu l’entendras dans le prochain échange.'
    example_gloss: Vendredi, j’étais au bazar avec mes amis.
  prs.a2.unit24.lesson05.teach.message:
    title: Un message sur hier matin
    gloss: Hier matin, j’allais au bureau. Il y avait beaucoup de circulation dans la rue. Pendant que j’attendais dans le bus, la pluie a commencé. À ce moment précis, mon téléphone a sonné. C’était mon ami. Je suis arrivé(e) en retard au bureau.
    note: 'Un court récit écrit d’un petit incident. Le fond a *می‌* : *به دفتر می‌رفتم*. L’attente est un état : *منتظر بودم*. Les deux événements sont au passé simple : *باران شروع شد* et *تیلفونم زنگ زد*.'
  prs.a2.unit24.lesson05.teach.exchange_q:
    title: Homayoun demande à Zarmina ce qui s’est passé vendredi
    gloss: Zarmina, que s’est-il passé au bazar vendredi ?
    note: Homayoun demande *چه شد؟*, « que s’est-il passé ? ». C’est la manière habituelle de demander le récit d’un petit incident.
  prs.a2.unit24.lesson05.teach.exchange_a:
    title: Zarmina raconte ce qui s’est passé
    gloss: Quand j’allais au bazar avec mes amis, la pluie a commencé. Je n’avais pas de parapluie et nous nous sommes fait mouiller.
    note: Zarmina donne le fond avec *می‌* (*می‌رفتم*), puis l’événement (*باران شروع شد*). Son résultat, *خیس شدیم*, est lui aussi au passé simple.
  prs.a2.unit24.lesson06.teach.turn01:
    title: Homayoun demande ce que Zarmina faisait
    gloss: Zarmina, que faisais-tu hier soir ?
    note: '*چه کار می‌کردی؟* signifie « que faisais-tu ? ». La question porte sur une action en cours ; on utilise donc *می‌کردی*, et non le *کردی* de l’action terminée.'
  prs.a2.unit24.lesson06.teach.turn02:
    title: Zarmina dit ce qu’elle faisait et ce qui s’est passé
    gloss: Quand je regardais un film, soudain le courant a été coupé.
    note: Le fond est *فلم می‌دیدم*, puis vient l’événement *برق رفت* avec *ناگهان*.
  prs.a2.unit24.lesson06.teach.turn03:
    title: Homayoun demande ce qu’elle a fait ensuite
    gloss: Qu’as-tu fait ensuite ?
    note: '*چه کار کردی؟* au passé simple porte sur une action terminée : « qu’as-tu fait ? ».'
  prs.a2.unit24.lesson06.teach.turn04:
    title: Zarmina raconte l’appel téléphonique et pose la question en retour
    gloss: Au même moment, mon téléphone a sonné. C’était mon amie. J’ai parlé avec elle. Et toi ?
    note: '*همان وقت* ajoute un deuxième événement. *با او صحبت کردم* signifie « j’ai parlé avec elle », et *تو چطور؟* signifie « et toi ? ».'
  prs.a2.unit24.lesson06.teach.turn05:
    title: Homayoun raconte le bus et la météo
    gloss: Je rentrais du bureau à la maison. J’étais dans le bus. Il y avait beaucoup de circulation et en plus il pleuvait.
    note: Il emploie *می‌آمدم* pour le trajet, *بودم* et *زیاد بود* pour la situation, et *می‌بارید* pour la pluie en cours.
  prs.a2.unit24.lesson06.teach.bad:
    title: Quel dommage !
    gloss: mauvais ; quel dommage !
    note: '*بد* signifie « mauvais ». *چه بد!* signifie « quel dommage ! », une réaction amicale à un petit malheur.'
    example_gloss: Aujourd’hui, il pleut et la circulation est mauvaise.
  prs.a2.unit24.lesson06.teach.turn06:
    title: Zarmina réagit
    gloss: Quel dommage !
    note: '*چه بد!* est une réaction amicale à une mauvaise nouvelle, le contraire de *چه خوب!*.'
exercises:
  prs.a2.unit24.lesson01.exercise01.recognize_it_was_raining:
    instruction: Que signifie cette phrase ?
    correct_option: Il pleuvait
    distractors:
    - Il pleut en ce moment
    - Il pleuvra demain
    - Il neigeait
    accepted_answers:
    - value: Il pleuvait
      status: correct
    feedback: '*باران می‌بارید* signifie « il pleuvait » : *می‌* plus le radical du passé *بارید*.'
  prs.a2.unit24.lesson01.exercise02.recognize_we_were_walking:
    instruction: Que signifie cette phrase ?
    correct_option: Nous marchions dans la rue
    distractors:
    - Je marchais dans la rue
    - Ils marchaient dans la rue
    - Nous marchons dans la rue
    accepted_answers:
    - value: Nous marchions dans la rue
      status: correct
    feedback: 'La terminaison *-یم* de *می‌رفتیم* signifie « nous », et *می‌* indique une action en cours : *ما در سرک پیاده می‌رفتیم*.'
  prs.a2.unit24.lesson01.exercise03.recognize_it_was_snowing:
    instruction: Que signifie cette phrase ?
    correct_option: Il neigeait
    distractors:
    - Il pleuvait
    - Il neige en ce moment
    - Il neigera demain
    accepted_answers:
    - value: Il neigeait
      status: correct
    feedback: '*برف* signifie « neige », donc *برف می‌بارید* signifie « il neigeait ».'
  prs.a2.unit24.lesson01.exercise04.match_forms_and_words:
    instruction: Associe chaque mot dari à son sens.
    accepted_answers:
