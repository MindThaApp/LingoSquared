teaching:
  prs.a1.unit47.lesson01.teach.review_this_is_in:
    title: 'Révision : ceci, est, dans'
    gloss: ceci / est / dans
    note: این, است et در (utilisés tout au long de ce cours) sont des mots de révision qui servent à parler du salon de coiffure.
    target_text: این (ceci) / است (est) / در (dans)
  prs.a1.unit47.lesson01.teach.barbershop_word:
    title: Salon de coiffure
    gloss: salon de coiffure
    note: سلمانی est le mot courant, employé à Kaboul, pour désigner un salon de coiffure ou de barbier.
    example_gloss: C’est un salon de coiffure.
  prs.a1.unit47.lesson01.teach.this_is_barbershop_phrase:
    title: C’est un salon de coiffure
    gloss: C’est un salon de coiffure.
    note: این سلمانی است combine des mots appris plus tôt dans cette leçon.
  prs.a1.unit47.lesson01.teach.barber_word:
    title: Barbier
    gloss: barbier
    note: دلاک est le mot dari afghan traditionnel pour désigner un barbier.
    example_gloss: Le barbier est au salon de coiffure.
  prs.a1.unit47.lesson01.teach.barber_in_barbershop_phrase:
    title: Le barbier est au salon de coiffure
    gloss: Le barbier est au salon de coiffure.
    note: دلاک در سلمانی است associe دلاک (barbier) et سلمانی (salon de coiffure).
  prs.a1.unit47.lesson01.teach.review_appointment_want:
    title: 'Révision : rendez-vous, je veux'
    gloss: rendez-vous / je veux
    note: قرار et می‌خواهم sont des mots de révision qui servent à demander un rendez-vous.
    target_text: قرار (rendez-vous) / می‌خواهم (je veux)
  prs.a1.unit47.lesson01.teach.want_appointment_phrase:
    title: Je veux un rendez-vous
    gloss: Je voudrais un rendez-vous.
    note: قرار می‌خواهم associe قرار (rendez-vous) et می‌خواهم (je veux).
  prs.a1.unit47.lesson02.teach.review_hair_short:
    title: 'Révision : cheveux, court'
    gloss: cheveux / court
    note: مو, موی et کوتاه sont des mots de révision qui servent à décrire une coupe de cheveux.
    target_text: مو / موی (cheveux) / کوتاه (court)
  prs.a1.unit47.lesson02.teach.review_want_want_polite:
    title: 'Révision : je veux, vous voulez (poli)'
    gloss: je veux / vous voulez (poli)
    note: می‌خواهم et می‌خواهین (vus dans des unités précédentes) sont des mots de révision qui servent à demander une coupe.
    target_text: می‌خواهم (je veux) / می‌خواهین (vous voulez, forme de politesse)
  prs.a1.unit47.lesson02.teach.shorter_word:
    title: Plus court
    gloss: plus court
    note: کوتاه‌تر ajoute à کوتاه (court, unité 27) la même terminaison de comparatif -تر que celle déjà vue dans بزرگ‌تر et کوچک‌تر (unité 15).
    example_gloss: Celui-ci est plus court.
  prs.a1.unit47.lesson02.teach.shorter_phrase:
    title: Je veux les cheveux plus courts
    gloss: Je veux les cheveux plus courts.
    note: موی کوتاه‌تر می‌خواهم associe موی (cheveux) et کوتاه‌تر (plus court).
  prs.a1.unit47.lesson02.teach.shorter_question_phrase:
    title: Vous voulez les cheveux plus courts ?
    gloss: Vous voulez les cheveux plus courts ?
    note: موی کوتاه‌تر می‌خواهین؟ est une question à réponse oui/non formée par l’intonation montante, sans mot interrogatif.
  prs.a1.unit47.lesson02.teach.review_no_word:
    title: 'Révision : non'
    gloss: non
    note: نخیر (vu dans des unités précédentes) est un mot de révision qui sert à répondre à une question sur la coupe.
    target_text: نخیر (non)
  prs.a1.unit47.lesson02.teach.trim_word:
    title: Retouche / coupe
    gloss: retouche / coupe
    note: اصلاح est le mot dari courant pour une retouche ou des soins de coiffure ; c’est ce que l’on demande.
    example_gloss: Je voudrais une retouche.
  prs.a1.unit47.lesson02.teach.no_just_trim_phrase:
    title: Non, juste une retouche
    gloss: Non, je veux juste une retouche.
    note: نخیر (vu dans des unités précédentes) répond à la question précédente et indique ce que l’on veut vraiment.
  prs.a1.unit47.lesson03.teach.review_trim_beard:
    title: 'Révision : retouche, barbe'
    gloss: retouche / barbe
    note: اصلاح (vu dans cette unité) et ریش sont des mots de révision qui servent à demander une taille de barbe.
    target_text: اصلاح (taille / coupe d’entretien) / ریش (barbe)
  prs.a1.unit47.lesson03.teach.beard_trim_phrase:
    title: Je veux une taille de barbe
    gloss: Je veux une taille de barbe.
    note: اصلاح ریش می‌خواهم associe اصلاح (retouche) et ریش (barbe).
  prs.a1.unit47.lesson03.teach.shave_word:
    title: Je rase
    gloss: je rase
    note: می‌تراشم est la forme de la première personne au présent de تراشیدن, « raser ».
    example_gloss: Je rase ma barbe.
  prs.a1.unit47.lesson03.teach.shave_beard_phrase:
    title: Je rase ma barbe
    gloss: Je rase ma barbe.
    note: ریش می‌تراشم associe ریش (barbe) et می‌تراشم (je rase).
  prs.a1.unit47.lesson03.teach.review_which_want_polite:
    title: 'Révision : quel, vous voulez (poli)'
    gloss: quel / vous voulez (poli)
    note: کدام et می‌خواهین (vus dans des unités précédentes) sont des mots de révision qui servent à demander quel service un client souhaite.
    target_text: کدام (quel) / می‌خواهین (vous voulez, forme de politesse)
  prs.a1.unit47.lesson03.teach.which_service_phrase:
    title: Quel type de retouche voulez-vous ?
    gloss: Quel type de retouche voulez-vous ?
    note: کدام اصلاح می‌خواهین؟ est la question polie que poserait un barbier.
  prs.a1.unit47.lesson04.teach.review_hello_trim_want:
    title: 'Révision : bonjour, retouche, je veux'
    gloss: bonjour / retouche / je veux
