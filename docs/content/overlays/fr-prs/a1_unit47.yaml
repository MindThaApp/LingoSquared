course:
  title: Dari A1
  description: 'Dari de Kaboul pour débutants : demander une coupe de cheveux ou un rafraîchissement chez le barbier, décrire une préférence simple de coiffure (plus court), demander une taille de barbe et comprendre un échange simple sur les prix et les services.'
units:
  prs.a1.unit47.personal_care:
    title: Chez le barbier et coupe de cheveux
    description: Demander une coupe de cheveux ou un rafraîchissement chez le barbier, décrire une préférence simple de coiffure, demander une taille de barbe et comprendre un échange simple sur les prix et les services.
