course:
  title: Dari en français A2
  description: 'Dari afghan, niveau pré-intermédiaire : mettre les événements dans l’ordre avec des propositions de temps, par exemple avant que je parte, après que je suis arrivé et quand l’eau a bouilli. Avant et après avec un nom, بعد از اینکه avec le passé, قبل از اینکه avec le subjonctif, et وقتی که.'
units:
  prs.a2.unit35.before_after_when:
    title: Avant, après, quand
lessons:
  prs.a2.unit35.lesson01.before_after_nouns:
    title: Avant et après avec un nom
  prs.a2.unit35.lesson02.after_clause_travel:
    title: Après une proposition et les démarches de voyage
  prs.a2.unit35.lesson03.before_clause_cooking:
    title: Avant une proposition et la cuisine
  prs.a2.unit35.lesson04.when_clause:
    title: Quand
  prs.a2.unit35.lesson05.reading_and_listening:
    title: 'Lecture et écoute : le riz et un voyage'
  prs.a2.unit35.lesson06.morning_conversation:
    title: Une conversation sur le matin
teaching:
  prs.a2.unit35.lesson01.teach.before:
    title: Avant
    gloss: avant (avec un nom)
    note: '*قبل از* signifie « avant ». Il est suivi d’un nom, sans verbe propre : *قبل از صبحانه* veut dire « avant le petit-déjeuner ».'
    example_gloss: Avant le petit-déjeuner, je prends une douche.
  prs.a2.unit35.lesson01.teach.after:
    title: Après
    gloss: après (avec un nom)
    note: '*بعد از* signifie « après » et se construit aussi avec un nom : *بعد از مکتب* veut dire « après l’école ».'
    example_gloss: Après l’école, je rentre à la maison.
  prs.a2.unit35.lesson01.teach.dinner:
    title: Le dîner
    gloss: dîner, le repas du soir
    note: '*شام* est le dîner. *می‌خورم* signifie « je mange » ou « je bois » : *شام می‌خورم* veut dire « je dîne » et *چای می‌خورم* « je bois du thé ». Le dari emploie un seul verbe pour les deux.'
    example_gloss: Après le dîner, je bois du thé.
  prs.a2.unit35.lesson01.teach.get_dressed:
    title: S’habiller
    gloss: mettre ses vêtements, s’habiller
    note: '*لباس* signifie « vêtements » et *پوشیدن* « mettre (un vêtement) ». *لباس می‌پوشم* veut dire « je m’habille » ; *می‌پوشم* est le présent à la forme « je ».'
    example_gloss: Chaque matin, je m’habille.
  prs.a2.unit35.lesson01.teach.wake_up:
    title: Se réveiller
    gloss: se réveiller
    note: '*بیدار شدن* signifie « se réveiller ». *شدن* veut dire « devenir » : *بیدار می‌شوم* signifie donc « je me réveille », littéralement « je deviens éveillé(e) ».'
    example_gloss: Je me réveille à six heures.
  prs.a2.unit35.lesson01.teach.noun_pattern:
    title: Avant et après avec un nom
    gloss: avant le petit-déjeuner, après le petit-déjeuner, avant l’école, après l’école, avant le dîner, après le dîner
    note: 'Place un nom juste après *قبل از* ou *بعد از* pour dire quand quelque chose a lieu : *قبل از صبحانه* (avant le petit-déjeuner), *بعد از مکتب* (après l’école). Ce groupe n’a pas de verbe propre ; le verbe se trouve dans la partie principale de la phrase. Le groupe peut ouvrir la phrase (*بعد از شام چای می‌خورم*) ou venir à la fin (*چای می‌خورم بعد از شام*).'
  prs.a2.unit35.lesson01.teach.sequence_words:
    title: D’abord, puis, après cela, enfin
    gloss: D’abord, je me réveille. Puis, je prends une douche. Après cela, je prends le petit-déjeuner. À la fin, je vais à l’école.
    note: 'Pour raconter une journée dans l’ordre, utilise de petits mots de liaison : *اول* (d’abord), *بعد* (puis), *بعد از آن* (après cela) et *در آخر* (enfin, à la fin). *بعد از آن* est *بعد از* avec *آن* (cela) comme nom ; il renvoie donc à l’étape que tu viens de citer.'
  prs.a2.unit35.lesson01.teach.phrase_school:
    title: Après le petit-déjeuner, je vais à l’école
    gloss: Après le petit-déjeuner, je vais à l’école.
    note: Le nom *صبحانه* suit *بعد از*, et le verbe *می‌روم* vient à la fin. C’est la manière la plus simple de dire ce qui vient après quoi.
  prs.a2.unit35.lesson02.teach.ticket:
    title: Billet
    gloss: billet (avion ou bus)
    note: '*تکت* est un billet d’avion ou de bus. *تکت گرفتن* signifie « prendre ou acheter un billet ».'
    example_gloss: J’ai pris le billet d’avion.
  prs.a2.unit35.lesson02.teach.suitcase:
    title: Valise
    gloss: valise
    note: '*چمدان* est une valise. Ajoute *-م* pour « mon/ma » : *چمدانم* veut dire « ma valise ».'
    example_gloss: Ma valise est à la maison.
  prs.a2.unit35.lesson02.teach.pack:
    title: j’ai fait ma valise
    gloss: J’ai fait ma valise.
    note: '*چمدان را بستن* signifie « faire sa valise » (c’est le même verbe *بستن* que dans *دروازه بسته است*). La valise vient d’abord, puis *را*, puis le verbe : *بستم* est le passé simple à la forme « je ».'
  prs.a2.unit35.lesson02.teach.after_past:
    title: بعد از اینکه + passé
    gloss: Après que j’ai pris le billet, j’ai fait ma valise.
    note: '*بعد از اینکه* signifie « après que » et ouvre une proposition avec son propre verbe. Quand tu racontes une histoire au passé, ce verbe est au passé simple : *بعد از اینکه تکت را گرفتم* veut dire « après que j’ai pris le billet ». La proposition principale dit alors ce qui a suivi : *چمدانم را بستم*. L’événement de la proposition en *بعد از اینکه* a eu lieu en premier.'
  prs.a2.unit35.lesson02.teach.after_habit:
    title: بعد از اینکه pour les habitudes
    gloss: Après que j’arrive à la gare, je prends un billet.
    note: 'Pour une action qui se répète, mets le verbe au présent avec *می‌* : *بعد از اینکه به ایستگاه می‌رسم* veut dire « après que j’arrive à la gare », et *تکت می‌گیرم* « je prends un billet ». *می‌رسم* est le présent de *رسیدن* à la forme « je ».'
  prs.a2.unit35.lesson02.teach.swap:
    title: Les propositions peuvent échanger leur place
    gloss: J’ai fait ma valise, après que j’ai pris le billet.
    note: 'Tu peux placer la proposition en *بعد از اینکه* en second. Le sens ne change pas : l’action de la proposition en *بعد از اینکه* a toujours eu lieu en premier. Seul l’ordre des mots change, pas l’ordre des événements.'
  prs.a2.unit35.lesson02.teach.noun_or_clause:
    title: Nom ou proposition
    gloss: après le dîner / après que j’ai dîné
    note: Emploie *بعد از* avec un nom et *بعد از اینکه* avec une proposition entière. *بعد از شام* veut dire « après le dîner ». *بعد از اینکه شام خوردم* veut dire « après que j’ai dîné ». La seconde a un verbe, elle peut donc aussi indiquer qui a agi.
  prs.a2.unit35.lesson02.teach.phrase_station:
    title: Après que je suis arrivé à la gare, j’ai téléphoné
    gloss: Après que je suis arrivé(e) à la gare, j’ai passé un coup de téléphone.
    note: 'Une vraie suite de voyage : d’abord *رسیدم* (l’arrivée), puis *تیلفون کردم* (le coup de téléphone). *تیلفون کردن* est la façon habituelle de dire « téléphoner ».'
  prs.a2.unit35.lesson03.teach.subjunctive_forms:
    title: قبل از اینکه + subjonctif
    gloss: avant que j’arrive, avant que j’aille, avant que je mange, avant que je vienne, avant que j’achète
    note: '*قبل از اینکه* signifie « avant que » et ouvre une proposition avec son propre verbe. Ce verbe n’est pas au passé. C’est le subjonctif, la même forme qu’après *باید* : *ب-* plus le radical du présent plus la terminaison. *رسیدن* donne *برسم*, *رفتن* donne *بروم*, *خوردن* donne *بخورم*, *آمدن* donne *بیایم*, *خریدن* donne *بخرم*.'
  prs.a2.unit35.lesson03.teach.subjunctive_paradigm:
    title: Les terminaisons du subjonctif
    gloss: que j’arrive, que tu arrives, qu’il/elle arrive, que nous arrivions, que vous arriviez (politesse ou pluriel), qu’ils arrivent
    note: Les terminaisons sont *-م، -ی، -د، -یم، -ین، -ند*. Ainsi *قبل از اینکه من برسم* veut dire « avant que j’arrive », *قبل از اینکه تو برسی* « avant que tu arrives » (à un ami), *قبل از اینکه او برسد* « avant qu’il ou elle arrive », *قبل از اینکه ما برسیم* « avant que nous arrivions », *قبل از اینکه شما برسین* « avant que vous arriviez » (politesse ou pluriel), *قبل از اینکه آن‌ها برسند* « avant qu’ils arrivent ». La deuxième personne du pluriel se termine en *-ین* en dari ; la forme écrite *-ید* est aussi comprise.
  prs.a2.unit35.lesson03.teach.past_story:
    title: Même dans un récit au passé
    gloss: Avant de partir de chez moi, j’ai fait ma valise.
    note: 'Le récit est au passé, on attendrait donc un verbe au passé après *قبل از اینکه*. Mais on emploie le subjonctif : *بروم*, et non *رفتم*. La raison est qu’au moment de faire la valise, le départ n’avait pas encore eu lieu. Ne dis pas *قبل از اینکه رفتم* ni *قبل از اینکه می‌روم* dans ce cas. La proposition principale est au passé simple : *چمدانم را بستم*.'
  prs.a2.unit35.lesson03.teach.noun_or_clause:
    title: Nom ou proposition
    gloss: avant le dîner / avant que je dîne
    note: 'Avec un nom, emploie *قبل از* : *قبل از شام*. Avec une proposition, ajoute *اینکه* et mets le verbe au subjonctif : *قبل از اینکه شام بخورم*. Cela fait écho à *بعد از شام* et *بعد از اینکه شام خوردم*, sauf qu’après *بعد از اینکه* le verbe est au passé, et après *قبل از اینکه* au subjonctif.'
  prs.a2.unit35.lesson03.teach.rice:
    title: Riz
    gloss: riz
    note: '*برنج* est le riz. C’est l’un des aliments de base de la cuisine afghane.'
    example_gloss: Je mange du riz.
  prs.a2.unit35.lesson03.teach.onion:
    title: Oignon
    gloss: oignon
    note: '*پیاز* est un oignon. De nombreux plats commencent par des oignons.'
    example_gloss: Il y a des oignons à la maison.
  prs.a2.unit35.lesson03.teach.chop:
    title: Hacher
    gloss: hacher, couper en petits morceaux
    note: '*خرد کردن* signifie « couper quelque chose en petits morceaux ». L’objet vient d’abord avec *را* : *پیاز را خرد می‌کنم* veut dire « je hache l’oignon ».'
    example_gloss: Je hache l’oignon.
  prs.a2.unit35.lesson03.teach.cook:
    title: Cuisiner
    gloss: cuisiner, faire cuire
    note: '*پختن* signifie cuisiner un plat. Le radical du présent est *پز* : *می‌پزم* veut dire « je cuisine », *بپزم* « que je cuisine » (le subjonctif, employé après *قبل از اینکه*), et *پختم* « j’ai cuisiné ».'
    example_gloss: Je fais cuire du riz.
  prs.a2.unit35.lesson03.teach.sleep:
    title: Dormir
    gloss: dormir, aller se coucher
    note: '*خوابیدن* signifie dormir ou aller au lit. *می‌خوابم* veut dire « je dors », et *بخوابم* « que je dorme » (le subjonctif).'
    example_gloss: Je vais me coucher à dix heures.
  prs.a2.unit35.lesson03.teach.phrase_cook:
    title: Avant de cuire le riz, je coupe l’oignon
    gloss: Avant de cuire le riz, je coupe l’oignon.
    note: 'Les étapes d’une recette dans l’ordre. *بپزم* est le subjonctif après *قبل از اینکه* ; *خرد می‌کنم* est le présent d’une habitude ou d’une recette : d’abord l’oignon, ensuite le riz.'
  prs.a2.unit35.lesson04.teach.when_past:
    title: وقتی که pour un événement unique au passé
    gloss: Quand je suis rentré à la maison, j’ai dîné.
    note: '*وقتی که* signifie « quand » et introduit une proposition avec son propre verbe. Pour un événement unique au passé, on emploie le passé simple dans les deux parties : *وقتی که به خانه رسیدم* (quand je suis arrivé à la maison), *شام خوردم* (j’ai dîné). Les deux événements ont lieu à peu près en même temps, ou l’un juste après l’autre.'
  prs.a2.unit35.lesson04.teach.when_habit:
    title: وقتی که pour une habitude
    gloss: Quand je rentre à la maison, je bois du thé.
    note: 'Pour ce qui arrive chaque fois, on emploie le présent avec *می‌* dans les deux parties : *وقتی که به خانه می‌رسم، چای می‌خورم* signifie « quand je rentre à la maison, je bois du thé ».'
  prs.a2.unit35.lesson04.teach.when_future:
    title: وقتی که pour ce qui est à venir
    gloss: Demain, quand j’arriverai à Hérat, je téléphonerai.
    note: 'Quand le moment est encore à venir, le verbe après *وقتی که* est au subjonctif (*برسم*) et le verbe principal est au présent avec *می‌* accompagné d’un mot de temps : *فردا ... تیلفون می‌کنم* (demain je téléphone, donc je téléphonerai). Il n’est pas nécessaire d’employer une forme de futur spéciale.'
  prs.a2.unit35.lesson04.teach.water:
    title: L’eau
    gloss: eau
    note: '*آب* signifie « eau ». L’eau froide se dit *آب سرد* ; pour l’eau chaude, dis *آب گرم*.'
    example_gloss: L’eau est chaude.
  prs.a2.unit35.lesson04.teach.boil:
    title: Bouillir
    gloss: bouillir (en parlant de l’eau)
    note: '*جوش شدن* signifie « bouillir ». Le passé simple est *جوش شد* et le présent est *جوش می‌شود* : *آب جوش می‌شود* signifie « l’eau bout ».'
    example_gloss: L’eau a bouilli.
  prs.a2.unit35.lesson04.teach.salt:
    title: Sel
    gloss: sel
    note: '*نمک* signifie « sel ». Il va avec *برنج* et *آب* dans une recette simple.'
    example_gloss: Il y a du sel et du riz à la maison.
  prs.a2.unit35.lesson04.teach.throw_in:
    title: Mettre dedans
    gloss: jeter dedans, mettre dedans
    note: '*انداختن* signifie jeter ou mettre quelque chose dedans. En cuisine, c’est le verbe habituel pour ajouter un ingrédient : *نمک را می‌اندازم* signifie « je mets le sel ». Le passé simple est *انداختم*.'
    example_gloss: Je mets le sel dans l’eau.
  prs.a2.unit35.lesson04.teach.phrase_boil:
    title: Quand l’eau bout, je mets le riz
    gloss: Quand l’eau bout, je mets le riz.
    note: 'Une habitude dans une recette : les deux verbes sont au présent avec *می‌*.'
  prs.a2.unit35.lesson04.teach.when_short:
    title: وقتی که ou simplement وقتی
    gloss: quand je suis arrivé / quand je suis arrivé
    note: Les deux formes sont correctes. *وقتی که* est un peu plus complet et *وقتی* seul est plus court ; le sens est le même. Le cours utilise d’abord *وقتی که* ; tu peux écrire l’une ou l’autre.
  prs.a2.unit35.lesson04.teach.phrase_ready:
    title: Quand le riz a été prêt, je l’ai mangé
    gloss: Quand le riz a été prêt, je l’ai mangé.
    note: '*آماده شد* signifie « il est devenu prêt ». *آن را* (« le », avec *را*) renvoie au riz.'
  prs.a2.unit35.lesson05.teach.pack_present:
    title: Faire sa valise
    gloss: faire sa valise
    note: '*چمدان بستن* signifie « faire sa valise ». Le présent pour « je » est *می‌بندم* : *چمدانم را می‌بندم* signifie « je fais ma valise ». Le passé simple est *بستم*.'
    example_gloss: Avant un voyage, je fais ma valise.
  prs.a2.unit35.lesson05.teach.travel_turn01:
    title: Narguès demande l’heure du vol
    gloss: Akbar, à quelle heure part l’avion demain ?
    note: Narguès demande l’heure avec *ساعت چند*. *حرکت می‌کند* est le présent de *حرکت کردن* (partir) ; avec *فردا*, il indique ce qui se passera demain.
  prs.a2.unit35.lesson05.teach.travel_turn02:
    title: Akbar donne l’heure et une première étape
    gloss: À dix heures. Avant d’aller à l’aéroport, je fais ma valise.
    note: Akbar donne l’heure, puis dit ce qu’il fait d’abord avec une proposition en *قبل از اینکه*. *بروم* est au subjonctif, et *می‌بندم* est le présent à sens futur.
  prs.a2.unit35.lesson05.teach.travel_turn03:
    title: Narguès demande s’il a son billet
    gloss: Tu as ton billet ?
    note: '*تکت داری؟* est une question amicale posée à un ami : *داری* signifie « tu as », à la forme familière du singulier.'
  prs.a2.unit35.lesson05.teach.travel_turn04:
    title: Akbar dit qu’il a le billet
    gloss: Oui, j’ai pris le billet hier.
    note: '*گرفتم* est le passé simple : il a pris le billet hier. *بلی* signifie « oui ».'
  prs.a2.unit35.lesson05.teach.travel_turn05:
    title: Narguès lui demande de téléphoner à son arrivée
    gloss: Quand tu arriveras à Hérat, tu me téléphoneras ?
    note: La proposition *وقتی که به هرات برسی* est encore à venir, donc le verbe est au subjonctif *برسی* (tu arrives). *به من تیلفون می‌کنی؟* signifie « tu me téléphoneras ? ».
  prs.a2.unit35.lesson05.teach.travel_turn06:
    title: Akbar promet
    gloss: Oui. Quand j’arriverai, je téléphonerai.
    note: 'Akbar emploie la même construction : *وقتی که برسم*, subjonctif pour « je », puis *تیلفون می‌کنم*.'
  prs.a2.unit35.lesson05.teach.message:
    title: Un message sur la cuisson du riz
    gloss: Salut Akbar. Hier, j’ai cuisiné du riz à la maison. D’abord, j’ai coupé l’oignon. Après que l’eau a bouilli, j’ai mis le sel et le riz. Quand le riz a été prêt, je l’ai mangé. Avant d’aller dormir, j’ai bu du thé.
    note: 'Un court message écrit qui emploie les trois connecteurs pour raconter les étapes dans l’ordre : *اول*, *بعد از اینکه*, *وقتی که* et *قبل از اینکه*.'
  prs.a2.unit35.lesson06.teach.work_my:
    title: Mon travail
    gloss: mon travail, mon emploi
    note: '*کار* signifie « travail » et *کارم* « mon travail ». *کارم را شروع می‌کنم* signifie « je commence mon travail ».'
    example_gloss: Mon travail est au bureau.
  prs.a2.unit35.lesson06.teach.morning_turn01:
    title: Nasrin demande à quelle heure Youssouf se réveille
    gloss: Youssouf, à quelle heure te réveilles-tu chaque matin ?
    note: '*هر صبح* signifie « chaque matin ». *چه وقت* demande « quand », et *بیدار می‌شوی* signifie « tu te réveilles » (à un ami).'
  prs.a2.unit35.lesson06.teach.morning_turn02:
    title: Youssouf donne l’heure et une première étape
    gloss: À six heures. Après m’être réveillé, je prends une douche.
    note: 'Une habitude : les verbes après *بعد از اینکه* sont donc au présent avec *می‌* : *بیدار می‌شوم*, puis *دوش می‌گیرم*.'
  prs.a2.unit35.lesson06.teach.morning_turn03:
    title: Nasrin demande ce qui vient ensuite
    gloss: Que fais-tu après ça ?
    note: '*بعد از آن* signifie « après cela ». Cela renvoie à l’étape qui vient d’être mentionnée.'
  prs.a2.unit35.lesson06.teach.morning_turn04:
    title: Youssouf dit les étapes suivantes
    gloss: Je m’habille. Avant d’aller au bureau, je prends mon petit-déjeuner.
    note: '*لباس می‌پوشم* est l’étape suivante. Puis vient une proposition en *قبل از اینکه* : *بروم* est au subjonctif et *صبحانه می‌خورم* est le verbe principal.'
  prs.a2.unit35.lesson06.teach.morning_turn05:
    title: Nasrin demande l’heure du bureau
    gloss: À quelle heure vas-tu au bureau ?
    note: '*ساعت چند* demande l’heure et *می‌روی* signifie « tu vas ».'
  prs.a2.unit35.lesson06.teach.morning_turn06:
    title: Youssouf dit ce qu’il fait au bureau
    gloss: À huit heures. Quand j’arrive, je commence d’abord mon travail.
    note: '*وقتی که می‌رسم* signifie « quand j’arrive » (une habitude : tous les jours), et *اول کارم را شروع می‌کنم* signifie « d’abord, je commence mon travail ».'
  prs.a2.unit35.lesson06.teach.summary:
    title: Les trois connecteurs ensemble
    gloss: avant que je parte ; après que je suis arrivé ; quand je suis arrivé
    note: 'Trois connecteurs, trois constructions. *قبل از اینکه* + subjonctif (*بروم*) : le verbe prend la forme avec *ب-*. *بعد از اینکه* + passé simple (*رسیدم*) dans un récit, ou présent pour une habitude (*بیدار می‌شوم*) : le premier événement est terminé. *وقتی که* + passé simple, présent ou subjonctif : le temps du verbe indique s’il s’agit d’un événement unique, d’une habitude ou de quelque chose à venir. Avec un nom, on emploie *قبل از* ou *بعد از* seuls.'
