course:
  title: Dari en français A2
  description: 'Dari afghan, niveau pré-intermédiaire : dire ce que tu dois, ne dois pas ou n’as pas besoin de faire, et demander si quelque chose est permis. Les règles d’une bibliothèque, d’une piscine et d’une salle de sport avec باید، نباید، لازم نیست، اجازه دارم et می‌توانم.'
units:
  prs.a2.unit29.rules_permission:
    title: Règles et permission
lessons:
  prs.a2.unit29.lesson01.must_and_places:
    title: Devoir, et les lieux du centre
  prs.a2.unit29.lesson02.must_not:
    title: 'Ne pas devoir : les règles de la bibliothèque'
  prs.a2.unit29.lesson03.ask_permission:
    title: 'Demander : puis-je ? est-ce que je peux ?'
  prs.a2.unit29.lesson04.no_need:
    title: 'Pas besoin : tu n’es pas obligé'
  prs.a2.unit29.lesson05.reading_and_listening:
    title: Lire et écouter à propos des règles
  prs.a2.unit29.lesson06.gym_conversation:
    title: Une conversation à la salle de sport et à la piscine
teaching:
  prs.a2.unit29.lesson01.teach.library:
    title: Bibliothèque
    gloss: bibliothèque
    note: '*کتابخانه* signifie une bibliothèque. Pour dire où l’on va, on emploie *به* : *به کتابخانه می‌روم* veut dire « je vais à la bibliothèque ». Cette unité porte sur les règles d’un centre communautaire qui a une bibliothèque, une piscine et une salle de sport.'
    example_gloss: La bibliothèque est près de chez moi.
  prs.a2.unit29.lesson01.teach.pool:
    title: La piscine
    gloss: piscine
    note: '*حوض آب‌بازی* signifie une piscine. C’est le mot de l’unité sur la piscine.'
    example_gloss: Je vais à la piscine chaque semaine.
  prs.a2.unit29.lesson01.teach.gym:
    title: La salle de sport
    gloss: salle de sport, club de sport
    note: '*باشگاه* signifie une salle de sport ou un club de sport. C’est le mot de l’unité sur la salle de sport.'
    example_gloss: La salle de sport est ouverte à six heures.
  prs.a2.unit29.lesson01.teach.rules:
    title: Les règles
    gloss: 'règles (singulier : règle, loi)'
    note: '*قانون* signifie une règle, et *قانون‌ها* signifie les règles. Le lieu se place après avec *-ی* : *قانون‌های کتابخانه* sont les règles de la bibliothèque. La marque du pluriel s’écrit comme un petit élément séparé après le nom, avec une demi-espace.'
    example_gloss: Les règles de la salle de sport sont au bureau.
  prs.a2.unit29.lesson01.teach.membership:
    title: Carte d’adhérent
    gloss: carte d’adhérent
    note: '*کارت عضویت* signifie une carte d’adhérent, la carte qui te permet d’emprunter des livres ou d’utiliser une salle de sport. *کارت* est un mot que tu connais déjà.'
    example_gloss: Ma carte d’adhérent est à la maison.
  prs.a2.unit29.lesson01.teach.sports_shoes:
    title: Chaussures de sport
    gloss: chaussures de sport, baskets
    note: '*کفش* signifie une chaussure et *ورزشی* veut dire « de sport », de *ورزش*. Donc *کفش ورزشی* signifie des chaussures de sport.'
    example_gloss: Mes chaussures de sport sont neuves.
  prs.a2.unit29.lesson01.teach.must:
    title: 'Devoir : باید plus le subjonctif'
    gloss: je dois y aller, tu dois y aller (à un ami), il/elle doit y aller, nous devons y aller, vous devez y aller (formel ou pluriel), ils/elles doivent y aller
    note: '*باید* signifie « devoir » ou « il faut ». Il ne change jamais. La personne se voit dans le verbe qui suit, au subjonctif : *بروم، بروی، برود، برویم، بروین، بروند*. Les terminaisons sont les mêmes qu’au présent, *-م، -ی، -د، -یم، -ین، -ند*, mais le verbe commence par *ب-* au lieu de *می‌*. Tu as déjà rencontré cette forme après *می‌خواهم* (*می‌خواهم یک تکت بگیرم*). L’ordre des mots est *باید* en premier, le verbe à la fin : *من باید به کتابخانه بروم*. Le pronom *من* est facultatif, car la terminaison montre déjà qui fait l’action.'
  prs.a2.unit29.lesson01.teach.formation:
    title: Former le subjonctif
    gloss: 'je vais : que j’aille. je viens : que je vienne. je fais : que je fasse. je prends : que je prenne. je donne : que je donne. j’emporte : que j’emporte.'
    note: 'Prends le présent, enlève *می‌* et place *ب-* devant : *می‌روم* devient *بروم*, *می‌گیرم* devient *بگیرم*, *می‌دهم* devient *بدهم*, *می‌برم* devient *ببرم*. Deux verbes sont différents. *آمدن* donne *بیایم* (et non *بآیم*), et *کردن* donne *کنم* sans *ب-* (tu entendras aussi *بکنم*, ce qui est correct). Avec les verbes de deux mots, seule la partie verbale change : *پس بدهم*, *کار کنم*, *دوش بگیرم*. Les autres personnes suivent les mêmes terminaisons : *بگیری، بگیرد، بگیریم، بگیرین، بگیرند*.'
  prs.a2.unit29.lesson01.teach.wear:
    title: Porter (un vêtement)
    gloss: porter, mettre (un vêtement)
    note: '*پوشیدن* signifie porter ou mettre des vêtements et des chaussures. Le subjonctif est *بپوشم، بپوشی، بپوشد، بپوشیم، بپوشین، بپوشند*, donc *باید کفش بپوشم* veut dire « je dois mettre des chaussures ».'
    example_gloss: À la salle de sport, je dois porter des chaussures neuves.
  prs.a2.unit29.lesson01.teach.more_verbs:
    title: Devoir avec d’autres verbes
    gloss: Je dois prendre une carte. Tu dois prendre une douche. Nous devons rendre le livre. Vous devez mettre des chaussures de sport. Ils doivent venir à la salle de sport.
    note: 'Le même schéma fonctionne pour tous les verbes : *باید* puis le subjonctif avec la bonne terminaison. *دوش گرفتن* signifie prendre une douche et *پس دادن* signifie rendre, donc *باید کتاب را پس بدهیم* veut dire « nous devons rendre le livre ». Ce que l’on donne ou prend se place avant le verbe, avec *را* quand la chose est déterminée : *کتاب را*.'
  prs.a2.unit29.lesson01.teach.sentence:
    title: Je dois aller à la bibliothèque
    gloss: Je dois aller à la bibliothèque.
    note: Voici le schéma de toute l’unité. *باید* indique une règle ou un devoir, et *بروم* montre la personne. Tout le monde au centre suit les mêmes règles.
  prs.a2.unit29.lesson02.teach.quiet:
    title: Discret
    gloss: silencieux, calme
    note: '*ساکت* signifie silencieux ou calme. *ساکت باشین* veut dire « soyez silencieux, s’il vous plaît » (à plusieurs personnes ou à quelqu’un que l’on respecte).'
    example_gloss: La bibliothèque est silencieuse.
  prs.a2.unit29.lesson02.teach.be_paradigm:
    title: 'Devoir être : باشم'
    gloss: je dois être silencieux, tu dois être silencieux, il/elle doit être silencieux, nous devons être silencieux, vous devez être silencieux (formel ou pluriel), ils/elles doivent être silencieux
    note: 'Le subjonctif de *بودن* (être) est *باشم، باشی، باشد، باشیم، باشین، باشند*. Après *باید*, il indique que quelqu’un doit être dans un certain état : *باید ساکت باشین* veut dire « vous devez être silencieux ». Tu as déjà rencontré *باشد* et *باشین* ; *باشم، باشی، باشیم* complètent la série.'
  prs.a2.unit29.lesson02.teach.food:
    title: Nourriture
    gloss: nourriture, repas
    note: '*غذا* signifie la nourriture ou un repas. *غذا خوردن* signifie prendre un repas, et *غذا بخورم* en est le subjonctif.'
    example_gloss: Nous mangeons à la maison.
  prs.a2.unit29.lesson02.teach.cigarette:
    title: Cigarette
    gloss: cigarette
    note: '*سگرت* signifie une cigarette. *سگرت کشیدن* signifie fumer, avec le verbe *کشیدن*.'
    example_gloss: Il fume des cigarettes tous les jours.
  prs.a2.unit29.lesson02.teach.forbidden:
    title: Interdit
    gloss: interdit, défendu
    note: '*ممنوع* signifie interdit et c’est ce que l’on lit sur les panneaux : *غذا خوردن ممنوع است* veut dire « il est interdit de manger ». L’activité vient d’abord à l’infinitif (*کشیدن، خوردن، گرفتن*), puis *ممنوع است*.'
    example_gloss: Il est interdit de fumer dans la salle de sport.
  prs.a2.unit29.lesson02.teach.loud:
    title: Fort, à voix haute
    gloss: 'fort, fortement (aussi : grand, haut)'
    note: '*بلند* signifie « fort » quand on dit comment quelqu''un parle : *بلند صحبت کردن* veut dire parler fort. *صحبت کردن* est un verbe que tu connais déjà.'
    example_gloss: Il parle fort.
  prs.a2.unit29.lesson02.teach.must_not:
    title: 'Interdiction : نباید plus le subjonctif'
    gloss: je ne dois pas manger, tu ne dois pas manger, il/elle ne doit pas manger, nous ne devons pas manger, vous ne devez pas manger (forme de politesse ou pluriel), ils/elles ne doivent pas manger
    note: '*نباید* est la forme négative de *باید* et signifie « ne pas devoir ». Le *ن* se place devant *باید*, et le verbe qui suit reste à la forme affirmative : *نباید غذا بخورین* signifie « vous ne devez pas manger ». Le verbe a les mêmes terminaisons du subjonctif qu''après *باید*. *نباید* exprime une règle ou un conseil ferme ; c''est donc ce que disent le personnel d''une bibliothèque ou d''une piscine.'
  prs.a2.unit29.lesson02.teach.forbidden_same:
    title: Deux façons de dire que c'est interdit
    gloss: Il est interdit de manger. Vous ne devez pas manger.
    note: '*ممنوع است* et *نباید* disent la même chose. Un panneau utilise l''infinitif : *غذا خوردن ممنوع است*. Une personne qui te parle emploie *نباید* avec le subjonctif : *نباید غذا بخورین*.'
  prs.a2.unit29.lesson02.teach.no_eat_library:
    title: Vous ne devez pas manger dans la bibliothèque
    gloss: Vous ne devez pas manger dans la bibliothèque.
    note: Le lieu vient en premier, puis *نباید*, puis l'objet, et le verbe à la fin.
  prs.a2.unit29.lesson02.teach.quiet_library:
    title: Vous devez être silencieux dans la bibliothèque
    gloss: Vous devez être silencieux dans la bibliothèque.
    note: '*باید ساکت باشین* est une règle qui dit ce qu''il faut faire, alors que *نباید* dit ce qu''il ne faut pas faire.'
  prs.a2.unit29.lesson02.teach.phone_forms:
    title: Interdiction avec d'autres personnes
    gloss: Je ne dois pas parler au téléphone. Tu ne dois pas parler au téléphone (à un ami). Vous ne devez pas parler au téléphone (forme de politesse ou pluriel).
    note: 'Avec un verbe composé comme *صحبت کردن*, seule la partie verbale change : *صحبت کنم، صحبت کنی، صحبت کنین*. À un ami, tu dis *نباید ... کنی* ; à plusieurs personnes ou à quelqu''un que tu respectes, *نباید ... کنین*.'
  prs.a2.unit29.lesson02.teach.no_phone_gym:
    title: Vous ne devez pas parler au téléphone dans la salle de sport
    gloss: Vous ne devez pas parler au téléphone dans la salle de sport.
    note: '*با تیلفون صحبت کردن* signifie parler au téléphone. *صحبت کنین* est le subjonctif de *صحبت کردن* pour *شما*.'
  prs.a2.unit29.lesson03.teach.here:
    title: Ici
    gloss: ici
    note: '*اینجا* signifie « ici ». Tu connais déjà *آنجا* (là-bas) : *اینجا* est celui qui est proche.'
    example_gloss: La bibliothèque est ici.
  prs.a2.unit29.lesson03.teach.permission:
    title: Permission
    gloss: permission
    note: '*اجازه* signifie « permission ». *اجازه دارم* veut dire « j''ai le droit » (j''ai la permission) et *اجازه ندارم* « je n''ai pas le droit ». Pour une autre personne, on dit *اجازه دارین* (vous avez le droit) ou *اجازه ندارین* (vous n''avez pas le droit).'
    example_gloss: Vous avez le droit d'être ici.
  prs.a2.unit29.lesson03.teach.photo:
    title: La photo
    gloss: photo
    note: '*عکس* signifie « photo ». *عکس گرفتن* veut dire prendre une photo, avec le verbe *گرفتن*.'
    example_gloss: Mes photos sont sur mon téléphone.
  prs.a2.unit29.lesson03.teach.ask_allowed:
    title: Puis-je ? اجازه دارم plus le subjonctif
    gloss: Puis-je prendre une photo ici ? Puis-je emporter le livre chez moi ? Puis-je utiliser le téléphone ?
    note: 'Pour demander si tu as le droit de faire quelque chose, dis *اجازه دارم* puis le subjonctif du verbe : *اجازه دارم اینجا عکس بگیرم؟* signifie « puis-je prendre une photo ici ? ». Commence par *ببخشین* (excusez-moi) pour être poli. La personne est indiquée par le verbe après *اجازه دارم* ; pour une autre personne, tu changes donc les deux : *اجازه دارین عکس بگیرین* signifie « vous pouvez prendre une photo ».'
  prs.a2.unit29.lesson03.teach.can_paradigm:
    title: 'Pouvoir : می‌توانم'
    gloss: je peux, tu peux (à un ami), il/elle peut, nous pouvons, vous pouvez (forme de politesse ou pluriel), ils/elles peuvent
    note: '*می‌توانم* signifie « je peux ». Il s''écrit avec un petit espace entre *می* et *توانم*. Les formes sont *می‌توانم، می‌توانی، می‌تواند، می‌توانیم، می‌توانین، می‌توانند*. Le subjonctif vient ensuite : *می‌توانم اینجا عکس بگیرم؟* signifie « puis-je prendre une photo ici ? ». Demander *می‌توانم ...؟* est une autre façon de demander la permission, aussi courante que *اجازه دارم ...؟*.'
  prs.a2.unit29.lesson03.teach.answers:
    title: Dire oui ou non
    gloss: Oui, vous avez le droit. Oui, vous pouvez. Non, vous n'avez pas le droit. Non, vous ne pouvez pas. Non, c'est interdit.
    note: 'Réponds avec le même verbe que celui de la question : *اجازه دارم؟* appelle *اجازه دارین / اجازه ندارین*, et *می‌توانم؟* appelle *می‌توانین / نمی‌توانین*. Quand une règle l''interdit, tu peux aussi dire *ممنوع است*. Tu peux ajouter *بلی، البته* (oui, bien sûr).'
  prs.a2.unit29.lesson03.teach.polite_ask:
    title: Excusez-moi, puis-je emporter ce livre chez moi ?
    gloss: Excusez-moi, puis-je emporter ce livre chez moi ?
    note: '*ببخشین* ouvre poliment la question. *به خانه ببرم* signifie « emporter chez soi ».'
  prs.a2.unit29.lesson03.teach.answer_yes:
    title: Oui, vous pouvez
    gloss: Oui, vous avez le droit.
    note: Un oui court et poli en réponse à une question avec *اجازه دارم*.
  prs.a2.unit29.lesson03.teach.answer_no_photo:
    title: Non, les photos sont interdites ici
    gloss: Non, il est interdit de prendre des photos ici.
    note: 'Un non qui donne la raison avec *ممنوع* : *عکس گرفتن ممنوع است*.'
  prs.a2.unit29.lesson04.teach.no_need:
    title: 'Pas besoin : لازم نیست plus le subjonctif'
    gloss: Nous n'avons pas besoin de venir. Vous n'avez pas besoin de payer.
    note: '*لازم نیست* signifie « ce n''est pas nécessaire », donc « il n''est pas obligatoire de ». Il est suivi du subjonctif, comme *باید* : *لازم نیست پول بدهین* signifie « vous n''avez pas besoin de payer ». *لازم نیست* n''interdit rien. Il dit seulement que c''est à vous de choisir.'
  prs.a2.unit29.lesson04.teach.no_need_formal:
    title: 'Plus formel : ضرورت ندارد'
    gloss: Il n'est pas nécessaire d'apporter une carte.
    note: '*ضرورت ندارد* a le même sens que *لازم نیست*, mais il est un peu plus formel et on le voit sur les avis : *ضرورت ندارد کارت بیاورین* signifie « il n''est pas nécessaire d''apporter une carte ». Le verbe qui suit est de nouveau au subjonctif. Dans la langue de tous les jours, on choisit plutôt *لازم نیست*.'
  prs.a2.unit29.lesson04.teach.three_meanings:
    title: Trois sens différents
    gloss: Je dois venir. Je ne dois pas venir. Je n'ai pas besoin de venir.
    note: '*باید بیایم* est une obligation, *نباید بیایم* est une interdiction, et *لازم نیست بیایم* est une liberté : je peux venir, mais je n''y suis pas obligé. Ne confonds pas *نباید* et *لازم نیست* : *نباید* interdit, *لازم نیست* n''interdit pas.'
  prs.a2.unit29.lesson04.teach.towel:
    title: Serviette
    gloss: serviette de toilette
    note: '*حوله* signifie « serviette de toilette ». *حوله‌ام* signifie « ma serviette ».'
    example_gloss: Ma serviette est dans la salle de sport.
  prs.a2.unit29.lesson04.teach.everyone:
    title: Tout le monde, tous
    gloss: tout le monde, tous
    note: '*همه* signifie « tout le monde » ou « tous ». C''est utile pour les règles qui concernent chacun : *همه باید ساکت باشند* signifie « tout le monde doit être silencieux ».'
    example_gloss: Tout le monde est silencieux dans la bibliothèque.
  prs.a2.unit29.lesson04.teach.bring:
    title: Apporter
    gloss: apporter
    note: '*آوردن* signifie « apporter ». Le subjonctif est *بیاورم، بیاوری، بیاورد، بیاوریم، بیاورین، بیاورند*. Tu connais déjà *بیاورم* : *لازم نیست حوله بیاوری* signifie « tu n''as pas besoin d''apporter une serviette ».'
    example_gloss: Demain, tu dois apporter mes livres.
  prs.a2.unit29.lesson04.teach.towel_phrase:
    title: Dans la salle de sport, vous n'avez pas besoin d'apporter de serviette
    gloss: Dans la salle de sport, vous n'avez pas besoin d'apporter de serviette.
    note: 'La salle de sport fournit ses propres serviettes, donc il n''est pas nécessaire d''en apporter une. C''est un bon exemple de *لازم نیست* : ce n''est pas interdit, simplement pas nécessaire.'
  prs.a2.unit29.lesson04.teach.pay_phrase:
    title: Vous n'avez pas besoin de payer
    gloss: Vous n'avez pas besoin de payer.
    note: L'inscription à la bibliothèque est gratuite, vous n'avez donc rien à payer. *پول بدهین* est le subjonctif de *پول دادن*.
  prs.a2.unit29.lesson05.teach.centre:
    title: Centre
    gloss: centre
    note: '*مرکز اجتماعی* est un centre communautaire, un bâtiment avec une bibliothèque, une piscine et une salle de sport. Tu connais *اجتماعی* grâce aux unités précédentes.'
    example_gloss: Le centre communautaire est près de chez moi.
  prs.a2.unit29.lesson05.teach.rubbish:
    title: Déchets, poubelle
    gloss: 'déchets, ordures (et : poubelle)'
    note: '*زباله* signifie « déchets » et *سطل* « poubelle ». Les deux mots viennent de l''unité sur les déchets. Le verbe est *انداختن*, jeter : *زباله را در سطل بیندازین* signifie « mettez les déchets dans la poubelle ».'
    example_gloss: Les déchets sont dans la poubelle.
  prs.a2.unit29.lesson05.teach.run:
    title: Courir
    gloss: courir
    note: '*دویدن* signifie « courir ». Le subjonctif est *بدوم، بدوی، بدود، بدویم، بدوین، بدوند* ; ainsi *نباید بدوین* signifie « vous ne devez pas courir ».'
    example_gloss: Tu ne dois pas courir dans la piscine.
  prs.a2.unit29.lesson05.teach.throw:
    title: Jeter, mettre
    gloss: jeter, mettre dans
    note: '*انداختن* signifie « jeter ». Le subjonctif est *بیندازم، بیندازی، بیندازد، بیندازیم، بیندازین، بیندازند* ; ainsi *باید زباله را در سطل بیندازین* signifie « vous devez mettre les déchets dans la poubelle ».'
    example_gloss: Mettez les déchets dans la poubelle.
  prs.a2.unit29.lesson05.teach.library_turn01:
    title: Shakila demande à emporter un livre chez elle
    gloss: Excusez-moi, puis-je emporter ce livre chez moi ?
    note: Shakila est nouvelle à la bibliothèque et demande avec *اجازه دارم* plus le subjonctif *ببرم*. Elle dit *ببخشین* pour être polie.
  prs.a2.unit29.lesson05.teach.library_turn02:
    title: Nasir dit qu'elle a d'abord besoin d'une carte
    gloss: Oui, mais vous devez d'abord prendre une carte d'adhérent.
    note: 'Nasir est le bibliothécaire, il dit donc *شما* avec la forme en *-ین* : *بگیرین*. *اول باید* signifie « d''abord, vous devez ».'
  prs.a2.unit29.lesson05.teach.library_turn03:
    title: Shakila demande s'il faut payer
    gloss: Dois-je payer ?
    note: '*باید پول بدهم؟* est une question avec *باید* : « dois-je payer ? ».'
  prs.a2.unit29.lesson05.teach.library_turn04:
    title: Nasir dit qu'il n'y a rien à payer, mais qu'il faut rendre le livre
    gloss: Non, vous n'avez pas besoin de payer. Vous devez rendre le livre dans un délai de deux semaines.
    note: '*لازم نیست* dit qu''il n''y a pas besoin de payer. *باید کتاب را تا دو هفته پس بدهین* est une obligation : le livre doit être rendu dans un délai de deux semaines.'
  prs.a2.unit29.lesson05.teach.library_turn05:
    title: Shakila demande si elle peut manger
    gloss: Puis-je manger ici ?
    note: '*می‌توانم ...؟* demande si c''est permis. Le subjonctif est *بخورم*.'
  prs.a2.unit29.lesson05.teach.library_turn06:
    title: Nasir dit qu'il ne faut pas manger et qu'il faut être silencieux
    gloss: Non, vous ne devez pas manger. Vous devez aussi être silencieux.
    note: '*نباید غذا بخورین* est une interdiction et *باید ساکت هم باشین* est une obligation. *هم* signifie « aussi ».'
  prs.a2.unit29.lesson05.teach.notice:
    title: Un avis sur les règles du centre
    gloss: 'Avis. Règlement du centre communautaire. Bibliothèque : dans la bibliothèque, vous ne devez pas manger et vous devez être silencieux. Piscine : avant d''entrer dans la piscine, vous devez prendre une douche. Vous ne devez pas courir dans la piscine. Salle de sport : dans la salle de sport, vous devez porter des chaussures de sport. Vous n''avez pas besoin d''apporter de serviette. Vous devez jeter les déchets dans la poubelle.'
    note: 'Un vrai avis mélange les trois types de règles : *باید* pour ce qu''il faut faire, *نباید* pour ce qu''il ne faut pas faire, et *لازم نیست* pour ce qui n''est pas nécessaire. L''avis s''adresse à tout le monde ; il emploie donc la forme en *-ین*.'
  prs.a2.unit29.lesson06.teach.first_time:
    title: La première fois
    gloss: la première fois
    note: '*اولین بار* signifie « la première fois ». *اولین* veut dire « premier » et *بار* « fois », comme dans *هر بار* (chaque fois).'
    example_gloss: Je vais à cette bibliothèque pour la première fois.
  prs.a2.unit29.lesson06.teach.what_must_i:
    title: Que dois-je faire ?
    gloss: Que dois-je faire ?
    note: 'Une question utile : *چه* (quoi), *باید* et le subjonctif *بکنم*. *بکنم* et *کنم* sont tous deux corrects ici.'
  prs.a2.unit29.lesson06.teach.gym_turn01:
    title: Nazila demande ce qu’elle doit faire
    gloss: Fahim, demain je vais à la salle de sport pour la première fois. Que dois-je faire ?
    note: Nazila dit *تو* à son ami. *فردا ... می‌روم* est le présent simple employé pour parler de demain.
  prs.a2.unit29.lesson06.teach.gym_turn02:
    title: Fahim énonce une obligation et une absence de nécessité
    gloss: Tu dois mettre des chaussures de sport. Tu n’as pas besoin d’apporter de serviette, la salle en fournit.
    note: 'Fahim parle à un ami, donc les verbes se terminent par *-ی* : *بپوشی، بیاوری*. *باید* exprime une obligation, *لازم نیست* exprime l’absence de nécessité.'
  prs.a2.unit29.lesson06.teach.gym_turn03:
    title: Nazila interroge Fahim sur la piscine
    gloss: Après la salle de sport, puis-je aller à la piscine ?
    note: '*می‌توانم ... بروم؟* demande si elle a la permission d’y aller.'
  prs.a2.unit29.lesson06.teach.gym_turn04:
    title: Fahim dit oui, avec deux règles
    gloss: Oui, mais tu dois d’abord prendre une douche. Il ne faut pas non plus courir dans la piscine.
    note: '*اول باید دوش بگیری* exprime une obligation et *نباید بدوی* une interdiction. Les deux verbes prennent la terminaison *-ی* pour un ami.'
  prs.a2.unit29.lesson06.teach.gym_turn05:
    title: Nazila le remercie
    gloss: Très bien ! Merci.
    note: Une fin brève et amicale. *تشکر* signifie « merci ».
exercises:
