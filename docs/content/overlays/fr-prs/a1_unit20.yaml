course:
  title: Dari A1
  description: 'Dari de Kaboul débutant : le passé simple de trois verbes courants (aller, manger, faire/travailler), lecture de textes courts puis plus longs racontant la journée d’hier, et un dialogue pour demander ce que quelqu’un a fait hier.'
units:
  prs.a1.unit20.past_events:
    title: Les activités d’hier
    description: Raconte ce que tu as fait hier avec le passé simple.
