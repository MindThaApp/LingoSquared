teaching:
  prs.a1.unit20.lesson01.teach.yesterday_word:
    title: Hier
    gloss: hier
    note: دیروز signifie « hier ».
    example_gloss: Hier, j’y suis allé(e).
  prs.a1.unit20.lesson01.teach.office_word:
    title: Au bureau
    gloss: au bureau
    note: 'به دفتر signifie « au bureau » : tu le connais déjà grâce à l’unité sur les routines quotidiennes.'
    example_gloss: Je suis allé(e) au bureau.
  prs.a1.unit20.lesson01.teach.went_word:
    title: Je suis allé(e)
    gloss: je suis allé
    note: رفتم est le passé simple de رفتن (aller) à la première personne.
    target_text: رفتم (je suis allé(e) -- passé de رفتن)
  prs.a1.unit20.lesson02.teach.breakfast_word:
    title: Le petit-déjeuner
    gloss: petit-déjeuner
    note: 'صبحانه signifie « petit-déjeuner » : tu le connais déjà grâce à l’unité sur les routines quotidiennes.'
    example_gloss: J’ai pris mon petit-déjeuner.
  prs.a1.unit20.lesson02.teach.ate_word:
    title: J’ai mangé
    gloss: j’ai mangé
    note: خوردم est le passé simple de خوردن (manger) à la première personne.
    target_text: خوردم (j’ai mangé -- passé de خوردن)
  prs.a1.unit20.lesson03.teach.work_word:
    title: Le travail
    gloss: travail
    note: کار signifie « travail » (le nom).
    example_gloss: J’ai travaillé.
  prs.a1.unit20.lesson03.teach.did_word:
    title: J’ai fait
    gloss: j’ai fait
    note: 'کردم est le passé simple à la première personne de کردن (faire) : کار کردم signifie littéralement « j’ai fait du travail », c’est-à-dire « j’ai travaillé ».'
    target_text: کردم (j’ai fait – passé de کردن)
  prs.a1.unit20.lesson04.teach.yesterday_text:
    title: Un petit récit d’hier
    gloss: Hier, je suis allé au bureau. J’ai pris mon petit-déjeuner. J’ai travaillé.
    note: Un court récit à la première personne de ce que l’auteur a fait hier, avec les nouveaux verbes au passé de cette leçon.
  prs.a1.unit20.lesson05.teach.seven_oclock:
    title: Sept heures
    gloss: sept heures
    note: ساعت هفت signifie « sept heures » ; tu connais déjà cette expression grâce aux unités sur l’heure et les routines.
    example_gloss: Je suis parti à sept heures.
  prs.a1.unit20.lesson05.teach.tired_word:
    title: Fatigué
    gloss: fatigué
    note: خسته signifie « fatigué ».
    example_gloss: Je me suis fatigué.
  prs.a1.unit20.lesson05.teach.became_word:
    title: Je suis devenu(e)
    gloss: je suis devenu / je suis devenue
    note: شدم est le passé simple à la première personne de شدن (devenir), le même verbe que dans بیدار می‌شوم (je me réveille) de l’unité sur les routines quotidiennes. خسته شدم signifie littéralement « je suis devenu fatigué », c’est-à-dire « je me suis fatigué ».
    target_text: شدم (je suis devenu(e) – passé de شدن)
  prs.a1.unit20.lesson05.teach.longer_yesterday_text:
    title: Un récit d’hier plus long
    gloss: Hier, à sept heures, je suis allé au bureau. J’ai pris mon petit-déjeuner. J’ai travaillé. Je me suis fatigué.
    note: Le même récit que dans la leçon précédente, complété par une heure précise et par ce que l’auteur a ressenti ensuite.
  prs.a1.unit20.lesson06.teach.names:
    title: Zarmina et Homayoun
    gloss: Zarmina, Homayoun
    note: Des personnages qui reviennent dans ce cours, présentés pour la première fois dans les unités sur l’heure et les routines quotidiennes.
    example_gloss:
    - Je suis Zarmina.
    - Je suis Homayoun.
  prs.a1.unit20.lesson06.teach.where_word:
    title: Où
    gloss: où
    note: کجا signifie « où ».
    target_text: کجا (où)
  prs.a1.unit20.lesson06.teach.you_went_word:
    title: Tu es allé(e)
    gloss: tu es allé / tu es allée
    note: رفتی est le passé simple à la deuxième personne de رفتن (aller).
    target_text: رفتی (tu es allé(e) – 2e personne de رفتن)
  prs.a1.unit20.lesson06.teach.you_worked_word:
    title: Tu as travaillé
    gloss: tu as fait / tu as travaillé
    note: کردی est le passé simple à la deuxième personne de کردن (faire).
    target_text: کردی (tu as fait / tu as travaillé – 2e personne de کردن)
  prs.a1.unit20.lesson06.teach.she_went_word:
    title: Elle/il est allé(e)
    gloss: elle est allée / il est allé
    note: 'رفت est le passé simple à la troisième personne de رفتن : c’est le radical du passé nu, sans terminaison.'
    target_text: رفت (elle/il est allé(e) – 3e personne de رفتن, utile pour résumer le dialogue sur Zarmina)
  prs.a1.unit20.lesson06.teach.she_worked_word:
    title: Elle/il a travaillé
    gloss: elle a fait / travaillé / il a fait / travaillé
    note: 'کرد est le passé simple à la troisième personne de کردن : c’est le radical du passé nu.'
    target_text: کرد (elle/il a fait / a travaillé – 3e personne de کردن)
  prs.a1.unit20.lesson06.teach.she_became_word:
    title: Elle/il est devenu(e)
    gloss: elle est devenue / il est devenu
    note: 'شد est le passé simple à la troisième personne de شدن : c’est le radical du passé nu.'
    target_text: شد (elle/il est devenu(e) – 3e personne de شدن)
  prs.a1.unit20.lesson06.teach.yes_word:
    title: Oui
    gloss: oui
    note: بلی est le mot poli et soutenu pour « oui », en accord avec le registre de ce cours.
    example_gloss: Oui, j’ai travaillé.
  prs.a1.unit20.lesson06.teach.dialogue_line1:
    title: Homayoun demande
    gloss: Zarmina, où es-tu allée hier ?
  prs.a1.unit20.lesson06.teach.dialogue_line2:
    title: Zarmina répond
    gloss: Je suis allée au bureau.
  prs.a1.unit20.lesson06.teach.dialogue_line3:
    title: Homayoun demande
    gloss: As-tu travaillé ?
  prs.a1.unit20.lesson06.teach.dialogue_line4:
    title: Zarmina répond
    gloss: Oui, j’ai travaillé. Je me suis fatiguée.
