teaching:
  hi.a1.unit26.lesson01.teach.jaiket_svetar:
    title: コート、セーター
    gloss: コート、セーター
    note: '*जैकेट* は女性名詞、*स्वेटर* は男性名詞で、これは一緒に使う語に表れます:*मेरी जैकेट*、*मेरा स्वेटर*。'
    example_gloss:
    - コートを探しています。
    - セーターを持っています。
  hi.a1.unit26.lesson01.teach.paint_joote:
    title: ズボン、靴
    gloss: ズボン、靴
    note: '*पैंट* はズボン1本を表す一つの単語です（*मेरी पैंट*）。*जूते* は *जूता* の複数形で、*-आ* で終わる男性名詞は複数形で *-ए* に変わります。'
    example_gloss:
    - 私はズボンを探しています。
    - 靴を探しています。
  hi.a1.unit26.lesson01.teach.main_ek_jaiket:
    title: 探しているものを言う
    gloss: コートを探しています。
    note: 動詞は最後に来ます:*मैं एक जैकेट ढूँढ़ रहा हूँ*。*रहा हूँ* は「~しているところです」(今まさに進行中)の意味を表し、*रहा* は男性形です(女性は *रही* と言います)。
  hi.a1.unit26.lesson02.teach.saiz:
    title: サイズ
    gloss: サイズ
    note: '*साइज़* は男性名詞なので、一緒に使う語も男性形になります:*मेरा साइज़*。'
    example_gloss: サイズはいくつですか?
  hi.a1.unit26.lesson02.teach.apka_saiz_kya:
    title: サイズをたずねる
    gloss: サイズはいくつですか?
    note: '*कौन सा*(「どの」)は、いくつかの中から一つを尋ねる言い方で、*सा* は名詞に合わせて変わります:*कौन सा साइज़*、でも *कौन सी जैकेट*。*आप* は店員さんに使う丁寧な「あなた」です。'
  hi.a1.unit26.lesson02.teach.mera_saiz_em:
    title: 自分のサイズを言う
    gloss: 私はMサイズです。
    note: ここでは「持つ」にあたる動詞は使いません。*मेरा साइज़ एम है* は直訳すると「私のサイズはMです」で、*मेरा* は男性名詞の *साइज़* に合わせた形です。
  hi.a1.unit26.lesson03.teach.kala_neela:
    title: 黒、青
    gloss: 黒、青
    note: このレッスンで学ぶ、基本の色を表す形容詞2つです。
    example_gloss:
    - 黒のコートがほしいです。
    - これの青もありますか?
  hi.a1.unit26.lesson03.teach.mujhe_vah_jaiket:
    title: 色を頼む
    gloss: 黒のコートがほしいです。
    note: '*मुझे ... चाहिए* はヒンディー語で「~がほしい」と言う表現です。願いが「私に」(*मुझे*)生じるという形で、ほしいものは *चाहिए* の直前に置きます。'
  hi.a1.unit26.lesson03.teach.kya_apke_pas:
    title: 別の色についてたずねる
    gloss: これの青もありますか?
    note: '*आपके पास ... है?*(直訳「あなたのところに…ありますか?」)は、「~をお持ちですか?」と丁寧に尋ねる言い方です。*भी*(「も」)は、付け加える語の後ろに置きます。'
  hi.a1.unit26.lesson04.teach.kya_yah_jaiket:
    title: サイズが合うかたずねる
    gloss: このコートはサイズが合いますか?
    note: ヒンディー語では服が「ちょうどよく来る」と言います:*ठीक आती है*。動詞は物に合わせて変わるので、女性名詞の *जैकेट* なら *आती*、男性名詞の *स्वेटर* なら *आता* になります。
  hi.a1.unit26.lesson04.teach.yah_ekdam_theek:
    title: ぴったりだと伝える
    gloss: ぴったり合います。
    note: '*एकदम*(「完全に」)が付くと「ぴったり合う」になります。*आती है* は女性名詞の *जैकेट* に合わせた形です。'
  hi.a1.unit26.lesson04.teach.yah_bahut_chhotee:
    title: 小さすぎる
    gloss: 小さすぎます。
    note: '*बहुत* は形容詞の前に置き、ここでは「~すぎる」の意味になります:*बहुत छोटी*。形容詞は女性名詞の *जैकेट* に合わせた形です。'
  hi.a1.unit26.lesson04.teach.yah_bahut_baree:
    title: 大きすぎる
    gloss: 大きすぎます。
    note: '*बड़ी* でも同じ型です。*बड़ा* は女性名詞では *बड़ी* になるので、*बहुत बड़ी* となります。'
  hi.a1.unit26.lesson05.teach.nabbe:
    title: '900'
    gloss: '900'
    note: '*नौ सौ* は数字の900で、ジャケットの値段に使われています。'
    example_gloss: そのコートは900ルピーです。
  hi.a1.unit26.lesson05.teach.jaiket_kee_keemat:
    title: 値段を言う
    gloss: そのコートは900ルピーです。
    note: ヒンディー語では「ジャケットの値段は…です」と言います:*जैकेट की कीमत नौ सौ रुपये है*。*की* は *जैकेट* ではなく、女性名詞の *कीमत* に合わせた形です。
  hi.a1.unit26.lesson05.teach.sardee_kee_jaiket:
    title: お店のレシートを読む
    gloss: 冬用コート:サイズM、色は黒。価格:900ルピー。このコートはぴったり合っていて、暖かいです。
    note: サイズ、色、価格、そしてコートについて述べられている2つの特徴に注目しましょう。
    glosses:
      सर्दी: 冬の(ジャケット)
      साइज़: サイズ
      रंग: 色
      काला: 黒い
      कीमत: 料金
      नौ: '9'
      सौ: 百
      रुपये: ルピー
      जैकेट: コート
      आती: 合う
      गर्म: 暖かい
  hi.a1.unit26.lesson06.teach.priya_yah_jaiket:
    title: プリヤがコートに目をとめる
    gloss: プリヤ:このコート、素敵ね!あなたのサイズは何?
    note: '*अच्छी* は女性名詞の *जैकेट* に合わせた形です。*तुम्हारा* は友達同士で使うくだけた「あなたの」です。'
  hi.a1.unit26.lesson06.teach.arjun_mera_saiz:
    title: アルジュンが試着をお願いする
    gloss: アルジュン:僕のサイズはMだよ。試着してもいいかな?
    note: '*पहनकर देखना*(直訳「着て見る」)が、ヒンディー語で「試着する」を表す言い方です。*सकता हूँ* は「できる」「してもよい」の意味で、女性は *सकती हूँ* と言います。'
  hi.a1.unit26.lesson06.teach.priya_zaroor_kya:
    title: プリヤが着心地を尋ねる
    gloss: プリヤ:もちろん。ちょうどいい?
    note: '*यह* は「それ」または「これ」の意味で、*आती* は女性名詞の *जैकेट* に合わせた形です。'
  hi.a1.unit26.lesson06.teach.arjun_han_yah:
    title: アルジュンが答える
    gloss: アルジュン:うん、ぴったりだし、暖かいよ。
    note: レッスン5で読んだレシートの内容とまったく同じで、同じコートです。
  hi.a1.unit26.lesson06.teach.priya_barhiya_tum:
    title: プリヤが色を尋ねる
    gloss: プリヤ:いいね!黒にする?それとも青?
    note: '*या*(「または」)は選択肢を示します。2つ目の *रंग* は省略できます:*काले रंग में ... या नीले में*。*तुम* はくだけた言い方です。'
  hi.a1.unit26.lesson06.teach.arjun_main_ise:
    title: アルジュンが決める
    gloss: アルジュン:黒にするよ。
    note: '*लूँगा* は *लेना*(「取る」)の未来形で、お店で買うものを決めるときによく使う動詞です。女性は *लूँगी* と言います。'
  hi.a1.unit26.lesson06.teach.main_leta_hoon:
    title: लेता हूँ と लेता है
    gloss: 私は取ります、彼は取ります。
    note: '*-ता* は習慣を表す語尾で、主語に合わせて変わります。*हूँ* は *मैं* と、*है* は *वह* と一緒に使います。'
