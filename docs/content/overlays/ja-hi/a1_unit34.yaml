    gloss: プリヤは毎日電車で通勤しています。アルジュンはたいてい自転車ですが、雨の日は電車にも乗ります。ヴィクラムは車を運転するほうが好きです。ネハは近くに住んでいて、歩いて通勤しています。あなたはどうやって通勤していますか?
