answer_policy:
  nasalization_marks: Display and teach the correct chandrabindu/anusvara distinction. This unit's own new vocabulary needs no new nasalization-mark decisions -- it only reuses already-settled spellings (हाँ's chandrabindu, तुम्हें/मिलेंगे/हैं/नहीं's anusvara). In typed A1 answers, accept a variant that drops a nasalization mark entirely or substitutes anusvara for chandrabindu when every other character is correct. Do not extend this tolerance to a wrong vowel or consonant, which changes the actual word.
  punctuation: Hindi text is shown with the traditional danda (।) as the sentence-final mark. In typed answers, accept the danda, a plain period (.), or the mark omitted entirely as equivalent. Question marks (?), exclamation marks, and commas may likewise be omitted, but the fully punctuated form remains the model answer.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register (aap vs. tum) rather than written punctuation or nasalization marks.
course:
  title: ヒンディー語 A1
units:
  hi.a1.unit06.food:
    title: 食べ物と飲み物
lessons:
  hi.a1.unit06.lesson01.mujhe_chahiye:
    title: 〜がほしいです
  hi.a1.unit06.lesson02.khana_aur_matra:
    title: 食べ物と量
  hi.a1.unit06.lesson03.priya_aur_arjun_ka_khana:
    title: プリヤとアルジュンの食事
teaching:
  hi.a1.unit06.lesson01.teach.khana:
    title: 食べ物
    gloss: 食べ物、食事
    note: 食べ物を表す一般的な語で、このユニットを通して使います。
    example_gloss: 私の食事はもう用意できています。
  hi.a1.unit06.lesson01.teach.chai_coffee:
    title: 紅茶、コーヒー
    gloss: お茶、コーヒー
    note: よく飲む二つの飲み物です。このユニットで *mujhe ... chahiye* の型を練習するのに使います。
    example_gloss:
    - 紅茶がほしいです。
    - コーヒーがほしいです。
  hi.a1.unit06.lesson01.teach.pani_juice:
    title: 水、ジュース
    gloss: 水、ジュース
    note: よく飲む飲み物がさらに二つ。*chahiye* は形が変わらないので、性による変化を気にする必要はありません。
    example_gloss:
    - 水をください。
    - ジュースがほしいです。
  hi.a1.unit06.lesson01.teach.chahiye_note:
    title: Mujhe ... chahiye
    gloss: '*Mujhe ... chahiye* は「〜がほしいです」という意味です。話し手の性によって形が変わらず(*chahta/chahti* とは違います)、後ろに *hai* は付きません。'
    note: このユニットの中心となる文法事項です。ここまで習ったほとんどの文が *hai* で終わるため、*chahiye* の後ろに hai を付けてしまう間違いは学習者によくあります。*Chahiye* だけで述語として完結しています。
  hi.a1.unit06.lesson01.teach.aapko_kya_chahiye:
    title: 何になさいますか？(丁寧)
    gloss: 何になさいますか？
    note: 丁寧な *aap* を使った質問で、店員や招待した側が相手に丁寧に尋ねるときに使います。
  hi.a1.unit06.lesson01.teach.tumhein_kya_chahiye:
    title: 何がほしい？(くだけた言い方)
    gloss: 何になさいますか？
    note: くだけた *tum* の与格の代名詞です。*mujhe* や、ユニット5の *tumhara/tumhari* と対応します。
  hi.a1.unit06.lesson01.teach.chai_chahiye_shukriya:
    title: 紅茶をお願いします
    gloss: 紅茶がほしいです、ありがとう。
    note: 注文するときの自然で丁寧な返事です。前のユニットで習った *shukriya* を再び使います。
  hi.a1.unit06.lesson01.teach.bahut:
    title: とても
    gloss: とても、たくさん
    note: よく使う程度を強める語で、このユニットでは食べ物や飲み物を表すときに使います。
    example_gloss: この紅茶はとてもおいしいです。
  hi.a1.unit06.lesson01.teach.swadisht:
    title: おいしい
    gloss: おいしい
    note: 食べ物の感想を言うのに便利な語です。なぜ性で形が変わらないのかは、第3課の文法ノートで説明します。
    example_gloss: この食事はとてもおいしいです。
  hi.a1.unit06.lesson02.teach.roti_chawal:
    title: パン、ご飯
    gloss: ロティ、ご飯
    note: インドの日常の食事の主食となる二つです。
    example_gloss:
    - パンをください。
    - ご飯がほしいです。
  hi.a1.unit06.lesson02.teach.sabzi_daal:
    title: 野菜料理、レンズ豆
    gloss: 野菜料理、レンズ豆(ダール)
    note: 主食となる料理がさらに二つ。ロティやご飯と一緒に食べることが多いです。
    example_gloss:
    - 野菜料理がほしいです。
    - レンズ豆(ダール)がほしいです。
  hi.a1.unit06.lesson02.teach.kap_gilas_plate:
    title: カップ、グラス、皿
    gloss: カップ、グラス、皿
    note: 注文のときに *ek*(「1つの」)と一緒に使って量を伝える、よく使う入れ物の語です。
    example_gloss:
    - 紅茶を一杯ください。
    - 水を一杯ください。
    - ご飯を一皿ください。
  hi.a1.unit06.lesson02.teach.kripya:
    title: お願いします
    gloss: お願いします
    note: お願いするときに使う簡単な丁寧語です。たいてい文頭(*kripya mujhe ...*)に置きますが、文末に付けるのもよく耳にします。
    example_gloss: 紅茶を一杯お願いします。
  hi.a1.unit06.lesson02.teach.kuch_aur_chahiye:
    title: ほかに何かありますか？
    gloss: ほかにはよろしいですか？/何かほかにいかがですか？
    note: 注文の一部を受けた後に、店員が尋ねる自然な続きの質問です。
  hi.a1.unit06.lesson02.teach.nahin_bas_shukriya:
    title: いいえ、以上です、ありがとう
    gloss: いいえ、以上です。ありがとうございます。
    note: 注文を終えるときの自然で丁寧な言い方です。前のユニットで習った *nahin* と *shukriya* を再び使います。
  hi.a1.unit06.lesson02.teach.sabzi_swadisht_phrase:
    title: この野菜料理はとてもおいしいです
    gloss: この野菜料理はとてもおいしいです。
    note: このユニットの *bahut* と *swadisht* を、新しい食べ物の名詞で使います。*swadisht* が性で変わらないことは、第3課の文法ノートにつながります。
  hi.a1.unit06.lesson03.teach.chalo_khate_hain:
    title: 何か食べよう！
    gloss: 何か食べよう！
    note: 一緒に食べようと誘う、親しみのある決まった言い方です。このユニットの最後の会話の始まりになります。
  hi.a1.unit06.lesson03.teach.ya:
    title: または
    gloss: または
    note: 二つのものから選ぶことを尋ねるときに使う、簡単な接続の語です。
    example_gloss: 紅茶とコーヒー、どちらがいいですか？
  hi.a1.unit06.lesson03.teach.haan:
    title: はい
    gloss: はい
    note: 肯定の簡単な返事で、このユニットの最後の会話で繰り返し使います。
    example_gloss: はい、紅茶がほしいです。
  hi.a1.unit06.lesson03.teach.swadisht_invariant_note:
    title: Swadisht は変わらない
    gloss: '*Swadisht* は男性名詞にも女性名詞にも同じ形で使います。*achha/achhi* のようには変わりません。'
    note: これは大事な例外です。すでに習った性に合わせて変わる形容詞(achha/achhi、bada/badi、mera/meri)と違い、*swadisht* のように子音で終わる形容詞は性によって変化しません。
  hi.a1.unit06.lesson03.teach.accha_phir_milenge:
    title: では、またね
    gloss: そう！また会いましょう。
    note: 親しみのある別れのあいさつで、前のユニットで習った別れの表現を再び使います。
  hi.a1.unit06.lesson03.teach.theek_hai_phir_milte_hain:
    title: わかりました、また近いうちに
    gloss: わかりました、また近いうちに！
    note: 上の別れのあいさつに対するくだけた返事で、前のユニットの別れのやり取りと対応しています。
  hi.a1.unit06.lesson03.teach.dialogue.line01:
    title: アルジュンが食事に誘う
    gloss: アルジュンが「何か食べよう」と言います。
    note: このユニットの最初のフレーズを再び使います。
  hi.a1.unit06.lesson03.teach.dialogue.line02:
    title: プリヤが何がほしいか尋ねる
    gloss: プリヤは同意して、アルジュンに何がほしいか尋ねます。
    note: 第1課で習った、くだけた *tumhein kya chahiye* の質問を再び使います。
  hi.a1.unit06.lesson03.teach.dialogue.line03:
    title: アルジュンが料理を注文する
    gloss: アルジュンは、ロティと野菜料理を一皿ほしいと言います。
    note: このユニットの食べ物の名詞、*ek plate* という入れ物の型、そして *chahiye* を組み合わせています。
  hi.a1.unit06.lesson03.teach.dialogue.line04:
    title: プリヤが飲み物を選ばせる
    gloss: プリヤは「いいね」と言って、紅茶とコーヒーのどちらがいいかアルジュンに尋ねます。
    note: このユニットの *ya* を使って、二つの飲み物から選ばせます。
  hi.a1.unit06.lesson03.teach.dialogue.line05:
    title: アルジュンがコーヒーを選ぶ
    gloss: アルジュンは、コーヒーをお願いしますと言います。
    note: 第2課の *kripya* をもう一度使います。
  hi.a1.unit06.lesson03.teach.dialogue.line06:
    title: プリヤが料理の感想を言う
    gloss: プリヤは「いいですね！この料理はとてもおいしいです」と言っています。
    note: 第1課の *bahut swadisht* をもう一度使います。
  hi.a1.unit06.lesson03.teach.dialogue.line07:
    title: アルジュンが同意する
    gloss: アルジュンは「はい、どうもありがとう」と言っています。
    note: '*haan* と *shukriya* をもう一度使います。'
  hi.a1.unit06.lesson03.teach.dialogue.line08:
    title: プリヤが会話を締めくくる
    gloss: プリヤは「いいですね、また会いましょう」と言っています。
    note: この課の締めくくりのフレーズをもう一度使います。
  hi.a1.unit06.lesson03.teach.dialogue.line09:
    title: アルジュンが返事をする
    gloss: アルジュンは同意して「ではまた近いうちに」と言っています。
    note: この課の返事のフレーズをもう一度使います。
