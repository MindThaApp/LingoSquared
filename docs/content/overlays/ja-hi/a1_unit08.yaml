    - これは学校です。
  hi.a1.unit08.lesson01.teach.aspatal_bank:
    title: 病院、銀行
    gloss: 病院、銀行
    note: 近所で探すことがありそうな、よく使う場所をあと二つ学びます。
    example_gloss:
    - これは病院です。
    - ここは銀行です。
  hi.a1.unit08.lesson01.teach.park_station:
    title: 公園、駅
    gloss: 公園、駅
    note: このユニットで最後の、よく使う場所二つです。
    example_gloss:
    - ここは公園です。
    - これは駅です。
  hi.a1.unit08.lesson01.teach.yahan_wahan:
    title: ここ、あそこ
    gloss: ここ、あそこ
    note: ものがどこにあるかを示すときの基本のペアです。
    example_gloss:
    - 学校はここです。
    - 銀行はそこです。
  hi.a1.unit08.lesson01.teach.school_kahan_hai:
    title: 学校はどこですか。
    gloss: 学校はどこですか。
    note: ユニット1で学んだ *kahaan*（どこ）をもう一度使います。今回は人の出身ではなく、場所をたずねます。
  hi.a1.unit08.lesson01.teach.school_yahan_hai:
    title: 学校はここです
    gloss: 学校はここです。
    note: '*yahaan* を使った答えの例です。'
  hi.a1.unit08.lesson01.teach.bank_kahan_hai:
    title: 銀行はどこですか?
    gloss: 銀行はどこですか?
    note: 同じ質問の型で、別の場所をたずねます。
  hi.a1.unit08.lesson01.teach.bank_wahan_hai:
    title: 銀行はあそこです
    gloss: 銀行はそこです。
    note: '*wahaan* を使った答えの例です。'
  hi.a1.unit08.lesson02.teach.paas:
    title: 近く
    gloss: 近く
    note: 単語として正式に取り上げるのは、これが初めてです。これまではユニット2の例文（*mere paas*、「私は持っている」、直訳は「私の近くに」）に出てきただけで、独立した単語としては学んでいませんでした。
    example_gloss: 銀行は近いです。
  hi.a1.unit08.lesson02.teach.door:
    title: 遠い
    gloss: 遠い
    note: '*paas* の反対の言葉です。'
    example_gloss: 駅は遠いです。
  hi.a1.unit08.lesson02.teach.ke_paas_note:
    title: Ke paas
    gloss: '''Ke paas'' は、ある場所の近くを表します。たとえば ''school bank ke paas hai''（学校は銀行の近くにあります）のように使います。これは前に ''mere paas''（私は持っている）で出てきた ''paas'' と同じ語ですが、そこでは「私の所有している」という意味で、ここでは「近く」という意味です。一つの語に、二つの使い方があります。'
    note: すでに出てきた語をもとにした新しい後置詞です。以前の意味と混同しないよう、二つの使い方をはっきり区別して覚えましょう。
    target_text: '''के पास'' का मतलब है किसी जगह के नज़दीक -- जैसे ''बैंक स्कूल के पास है''। यह वही ''पास'' है जो पहले ''मेरे पास'' (मेरे पास एक किताब है) में आया था, पर वहाँ इसका मतलब था ''मेरे स्वामित्व में'' (持っている), और यहाँ इसका मतलब है ''नज़दीक'' (近く) -- एक ही शब्द, दो अलग इस्तेमाल।'
  hi.a1.unit08.lesson02.teach.school_bank_ke_paas_hai:
    title: 学校は銀行の近くにあります
    gloss: 学校は銀行の近くにあります。
    note: '*ke paas* を使った例文です。'
  hi.a1.unit08.lesson02.teach.samne_peeche:
    title: 〜の前に、〜の後ろに
    gloss: 〜の前に、〜の後ろに
    note: 位置を表す語のもう一組です。これらも *ke* と一緒に使います。
    example_gloss:
    - 病院は駅の前にあります。
    - 公園は学校の後ろにあります。
  hi.a1.unit08.lesson02.teach.samne_peeche_note:
    title: Samne と peeche
    gloss: '''Samne'' と ''peeche'' も、''paas'' と同じように ''ke'' と一緒に使います。この二つは互いに反対の意味です。''paark school ke peeche hai'' と ''school paark ke samne hai'' は、まったく同じ位置関係を、二つの異なる側から言っているだけです。'
    note: 同じ事実を二通りに言い表す、二つの語の関係についての、実際に役立つ文法ポイントです。
  hi.a1.unit08.lesson02.teach.school_park_ke_samne_hai:
    title: 学校は公園の前にあります
    gloss: 学校は公園の前にあります。
    note: 上の *paark school ke peeche hai* と同じ事実を、反対の側から言った文です。
  hi.a1.unit08.lesson03.teach.dakghar:
    title: 郵便局
    gloss: 郵便局
    note: このユニットの最後の会話に出てくる、よく使う新しい場所です。
    example_gloss: 郵便局は銀行の近くにあります。
  hi.a1.unit08.lesson03.teach.dakghar_kahan_hai:
    title: 郵便局はどこですか
    gloss: 郵便局はどこですか
    note: このユニットの最後の会話の始まりです。
  hi.a1.unit08.lesson03.teach.dialogue.line01:
    title: アルジュンが郵便局についてたずねる
    gloss: アルジュンはプリヤに、郵便局がどこにあるかたずねます。
    note: このレッスンの最初のフレーズをもう一度使います。
  hi.a1.unit08.lesson03.teach.dialogue.line02:
    title: プリヤが答える
    gloss: プリヤは、銀行の近くだと言います。
    note: レッスン2の *ke paas* をもう一度使います。
  hi.a1.unit08.lesson03.teach.dialogue.line03:
    title: アルジュンが病院についてたずねる
    gloss: アルジュンは「なるほど」と言って、病院がどこにあるかたずねます。
    note: これまでのユニットで学んだ *achchha*（なるほど／そうですか）をもう一度使います。
  hi.a1.unit08.lesson03.teach.dialogue.line04:
    title: プリヤが答える
    gloss: プリヤは、病院は駅の前にあると言います。
    note: レッスン2の *ke samne* をもう一度使います。
  hi.a1.unit08.lesson03.teach.dialogue.line05:
    title: アルジュンが遠いかどうかたずねる
    gloss: アルジュンはたずねます。「駅は遠いですか。」
    note: レッスン2の *door* をもう一度使います。
  hi.a1.unit08.lesson03.teach.dialogue.line06:
    title: プリヤが肯定して、対比させる
    gloss: プリヤは「はい、少し遠いです。銀行は近いです」と言います。
    note: '*thoda*（少し）が初めて出てきます。駅は遠く、銀行は近いという関係は変わりません。'
  hi.a1.unit08.lesson03.teach.dialogue.line07:
    title: アルジュンが公園についてたずねる
    gloss: アルジュンは「わかりました」と言って、公園がどこにあるかたずねます。
  hi.a1.unit08.lesson03.teach.dialogue.line08:
    title: プリヤが答える
    gloss: プリヤは、公園は学校の後ろにあると言います。
    note: レッスン2の *ke peeche* をもう一度使います。
  hi.a1.unit08.lesson03.teach.dialogue.line09:
    title: アルジュンが気づく
    gloss: アルジュンは「では、学校は公園の前にあるんですね！」と言います。
    note: '*to*（では／それなら）が初めて出てきます。レッスン2の *samne*／*peeche* の文法ポイントともつながっています。'
  hi.a1.unit08.lesson03.teach.dialogue.line10:
    title: プリヤが確認する
    gloss: プリヤは「はい、そのとおりです！」と言います。
    note: '*sahi*（正しい）が初めて出てきます。'
  hi.a1.unit08.lesson03.teach.dialogue.line11:
    title: アルジュンがプリヤにお礼を言う
    gloss: アルジュンは「プリヤ、本当にありがとう！」と言います。
    note: これまでのユニットで学んだ *bahut*（とても）と *shukriya* をもう一度使います。
  hi.a1.unit08.lesson03.teach.dialogue.line12:
    title: プリヤが締めくくる
    gloss: プリヤは「どういたしまして！またね」と言います。
    note: これまでのユニットで学んだ、このコースの定番の締めくくりのフレーズをもう一度使います。
