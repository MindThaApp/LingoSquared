teaching:
  hi.a1.unit27.lesson01.teach.khush_udas_naraz:
    title: うれしい、悲しい、怒っている
    gloss: うれしい、悲しい、怒っている
    note: '*खुश*、*उदास*、*नाराज़*は基本的な気持ちを表す言葉で、*हूँ*や*है*(です)と一緒に使います。性別によって形は変わりません。'
    example_gloss:
    - 私はうれしいです。
    - 私は悲しいです。
    - 私は怒っています。
  hi.a1.unit27.lesson01.teach.main_khush_hoon:
    title: うれしいと言う
    gloss: 私はうれしいです。
    note: '*मैं खुश हूँ*は、*मैं* + 気持ち + *हूँ*という型で、「私は〜です」にあたります。'
  hi.a1.unit27.lesson01.teach.main_naraz_naheen:
    title: 気持ちを対比させる
    gloss: 私は怒っていません、悲しいんです。
    note: '*नहीं*は*हूँ*の直前に置きます：*नाराज़ नहीं हूँ*。後半で本当の気持ちを伝えています。'
  hi.a1.unit27.lesson02.teach.tum_khush_kyon:
    title: 理由をたずねる
    gloss: どうしてうれしいの？
    note: '*क्यों*(なぜ)は述語の前に置きます：*तुम खुश क्यों हो?*。*तुम*は親しい間柄で使う「あなた」です。'
  hi.a1.unit27.lesson02.teach.main_khush_hoon:
    title: 理由を言う
    gloss: 新しいアパートがあるので、私はうれしいです。
    note: '*क्योंकि*は理由を導きます。*मेरे पास ... है*は「私は〜を持っている」という意味で、動詞*है*は文末に来ます。'
  hi.a1.unit27.lesson02.teach.main_udas_hoon:
    title: よくない理由
    gloss: 雨が降っているので、私は悲しいです。
    note: '*बारिश हो रही है*は「雨が降っている」という意味です(直訳は「雨が起きている」)。'
  hi.a1.unit27.lesson03.teach.narvas:
    title: 緊張している
    gloss: 緊張している
    note: 緊張を表す基本的な言葉です。
    example_gloss: 初めてのシフトの前で、私は緊張しています。
  hi.a1.unit27.lesson03.teach.main_apnee_pahlee:
    title: 何に緊張しているかを言う
    gloss: 初めてのシフトの前で、私は緊張しています。
    note: '*को लेकर*は「〜について」という意味で、名詞の後ろに置きます：*शिफ़्ट को लेकर*。*अपनी*(自分の)は女性名詞の*शिफ़्ट*に合わせた形です。'
  hi.a1.unit27.lesson03.teach.chinta_mat_karo:
    title: 相手を安心させる
    gloss: 心配しないで。
    note: '*चिंता मत करो*は親しみのある「心配しないで」です。*मत* + *करो*は、*तुम*に対する「〜しないで」という命令表現です。'
  hi.a1.unit27.lesson04.teach.arjun_kaisa_mahsoos:
    title: 相手の気持ちをたずねる
    gloss: アルジュンはどんな気持ちですか？
    note: '*कैसा महसूस कर रहा है*は「彼はどんな気持ちですか」とたずねる表現です。*कैसा*は人に合わせて変わり、女性なら*कैसी*になります。'
  hi.a1.unit27.lesson04.teach.vah_narvas_mahsoos:
    title: 人の気持ちを説明する
    gloss: 彼は緊張しています。
    note: ここでは「自分自身」にあたる別の語は使いません。*वह नर्वस महसूस कर रहा है*は、*वह*と*रहा है*だけで表します。
  hi.a1.unit27.lesson04.teach.vah_narvas_kyon:
    title: 人がなぜそう感じるのかをたずねる
    gloss: なぜ彼は緊張しているのですか。
    note: '*क्यों*は動詞句の直前に置きます：*वह नर्वस क्यों महसूस कर रहा है?*'
  hi.a1.unit27.lesson05.teach.hay_priya_main:
    title: 気持ちについてのメッセージを読む
    gloss: こんにちは、プリヤ。初めての一人でのシフトに、少し緊張しています。でも、新しい仕事と新しいフラットがあるので、うれしくもあります。きっとうまくいくと思います。
    note: 書き手が何に緊張しているか、何がうれしいのか、全体としてどう見通しているかをつかみましょう。
    glosses:
      थोड़ा: 少し
      नर्वस: 緊張している
      पहली: 最初の
      शिफ़्ट: シフト
      अकेले: ひとりで
      खुश: うれしい
      क्योंकि: なぜなら
      नई: 新しい
      नौकरी: 仕事
      नया: 新しい
      फ़्लैट: アパート
      लगता: 思う
      होगा: うまくいく
  hi.a1.unit27.lesson06.teach.priya_hay_arjun:
    title: プリヤがアルジュンの気持ちをたずねる
    gloss: プリヤ：こんにちは、アルジュン。初めてのシフトについて、今どんな気持ち？
    note: ここでも*को लेकर*を使っています：*अपनी पहली शिफ़्ट को लेकर*(あなたの初めてのシフトについて)。*तुम*は親しい間柄で使います。
  hi.a1.unit27.lesson06.teach.arjun_sach_kahoon:
    title: アルジュンが緊張していると打ち明ける
    gloss: アルジュン：正直に言うと、少し緊張しているんだ。
    note: '*सच कहूँ तो*(本当のことを言うと)は、打ち明け話をやわらげる言い方です。'
  hi.a1.unit27.lesson06.teach.priya_chinta_mat:
    title: プリヤが励ます
    gloss: プリヤ：心配しないで、あなたならきっとうまくできるよ！
    note: '*तुम यह अच्छे से कर सकते हो*は「あなたはこれをうまくできる」という意味で、*अच्छे से*は「うまく」です。'
  hi.a1.unit27.lesson06.teach.arjun_shukriya_isse:
    title: アルジュンがお礼を言う
    gloss: アルジュン：ありがとう、本当に助かるよ。
    note: '*इससे मदद मिलती है*は直訳すると「これから助けが得られる」で、助けの元になるものを*से*で示します。'
  hi.a1.unit27.lesson06.teach.priya_aur_bad:
    title: プリヤが結果を予想する
    gloss: プリヤ：それに、後できっととてもうれしくなって、誇らしく思うよ。
    note: '*ज़रूर*(きっと)で予想に自信が加わり、*तुम्हें गर्व होगा*は「あなたは誇らしく思うでしょう」という意味です。'
  hi.a1.unit27.lesson06.teach.arjun_han_mujhe:
    title: アルジュンが同意する
    gloss: アルジュン：うん、僕もそう思うよ。
    note: '*मुझे भी ऐसा ही लगता है*(直訳：私にもそう思われる)は、同意を伝える自然な言い方で、*मुझे*が感じる人を示します。'
  hi.a1.unit27.lesson06.teach.arjun_narvas_hai:
    title: 代名詞：उसकी
    gloss: アルジュンは緊張しています。プリヤは彼を助けます。
    note: '*उसकी*は「彼の」「彼女の」という意味で、女性名詞の*मदद*に合わせた形です。そのため*उसकी मदद करना*は「彼を助ける」になります。*है*と*करती है*は三人称の動詞です。'
