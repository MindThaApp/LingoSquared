teaching:
  hi.a1.unit03.lesson01.teach.aaj:
    title: 今日
    gloss: 今日
    note: このレッスンのほとんどの文で何度も使う単語です。
    example_gloss: 今日はいい天気です。
  hi.a1.unit03.lesson01.teach.somvar:
    title: 月曜日
    gloss: 月曜日
    note: सोम（月）に由来します。日本語の「月曜日」と同じく、月の日という意味です。
    example_gloss: ヨガのクラスは月曜日です。
  hi.a1.unit03.lesson01.teach.mangalvar:
    title: 火曜日
    gloss: 火曜日
    note: मंगल（火星）に由来します。ヒンディー語の曜日名の多くが同じ仕組みです。
    example_gloss: 今日は火曜日です。
  hi.a1.unit03.lesson01.teach.budhvar:
    title: 水曜日
    gloss: 水曜日
    note: बुध（水星）に由来します。
    example_gloss: 今日は水曜日です。
  hi.a1.unit03.lesson01.teach.guruvar:
    title: 木曜日
    gloss: 木曜日
    note: गुरु（木星）に由来します。
    example_gloss: 今日は木曜日です。
  hi.a1.unit03.lesson01.teach.shukravar:
    title: 金曜日
    gloss: 金曜日
    note: शुक्र（金星）に由来します。
    example_gloss: 金曜日はヨガのクラスがありません。
  hi.a1.unit03.lesson01.teach.shanivar:
    title: 土曜日
    gloss: 土曜日
    note: शनि（土星）に由来します。
    example_gloss: 今日は土曜日です。
  hi.a1.unit03.lesson01.teach.ravivar:
    title: 日曜日
    gloss: 日曜日
    note: रवि（サンスクリット語で太陽の名）に由来します。日本語の「日曜日」と同じく、太陽の日という意味です。
    example_gloss: 今日は日曜日です。
  hi.a1.unit03.lesson01.teach.kaun_sa_din_hai:
    title: 何曜日かをたずねる
    gloss: 今日は何曜日ですか？
    note: '*Kaun sa*（「どの」）は男性名詞 *din*（「日」）に合わせた形です。女性名詞には女性形の *kaun si* を使います。これは後で出てきます。'
  hi.a1.unit03.lesson01.teach.yoga_class_monday:
    title: 曜日に予定があると言う
    gloss: ヨガのクラスは月曜日です。
    note: 曜日名の後ろの *ko* は「〜に」の意味です。*somvar ko* は「月曜日に」で、どの曜日も同じ形です。
  hi.a1.unit03.lesson01.teach.no_class_friday:
    title: ある曜日に予定がないと言う
    gloss: 金曜日はヨガのクラスがありません。
    note: Nahin は文を否定します。ko は引き続き曜日を示し、ここでは強調のために文頭に置かれています。
  hi.a1.unit03.lesson02.teach.jan_feb_mar:
    title: 1月、2月、3月
    gloss: 1月、2月、3月
    note: ヒンディー語の月の名前は外来語が多く、パターンがわかればすぐに見当がつきます。新しい文法はなく、単語だけです。
    example_gloss:
    - 私の誕生日は1月です。
    - 次の祝日は2月です。
    - 私の誕生日は3月です。
  hi.a1.unit03.lesson02.teach.apr_may_jun:
    title: 4月、5月、6月
    gloss: 4月、5月、6月
    note: 最初の3つの月と同じく、見当のつきやすい形です。
    example_gloss:
    - 次の祝日は4月です。
    - 私の誕生日は5月です。
    - 次の祝日は6月です。
  hi.a1.unit03.lesson02.teach.jul_aug_sep:
    title: 7月、8月、9月
    gloss: 7月、8月、9月
    note: Sitambar はここでは anusvara を使って（सितंबर）書いています。半分の m を使った सितम्बर という綴りもよく使われ、どちらも正しいです。
    example_gloss:
    - 私の誕生日は7月です。
    - 次の祝日は8月です。
    - 私の誕生日は9月です。
  hi.a1.unit03.lesson02.teach.oct_nov_dec:
    title: 10月、11月、12月
    gloss: 10月、11月、12月
    note: Navambar と disambar も sitambar と同じく anusvara の綴りです。半分の m を使った नवम्बर と दिसम्बर もよく使われ、どちらも正しいです。
    example_gloss:
    - 次の祝日は10月です。
    - 私の誕生日は11月です。
    - 次の祝日は12月です。
  hi.a1.unit03.lesson02.teach.tareekh:
    title: 日付
    gloss: 日付
    note: '*Tareekh* は女性名詞なので、疑問詞も女性形になります（*kitni tareekh* で、*kitna tareekh* とは言いません）。第2課で *keemat* や *umra* で学んだ一致と同じ仕組みです。'
    example_gloss: 今日は3日です。
  hi.a1.unit03.lesson02.teach.mein_postposition:
    title: 〜に（月と一緒に）
    gloss: 〜に――月の名前と一緒に使います
    note: '*Mein* は、*ko* が曜日を示すのと同じように月を示します。*janvari mein* は「1月に」で、*janvari ko* とは言いません。'
  hi.a1.unit03.lesson02.teach.aaj_kitni_tareekh_hai:
    title: 日付をたずねる
    gloss: 今日は何月何日ですか?
    note: 直訳すると「今日の日付はいくつですか」です。kitni は女性名詞 tareekh に合わせた形です。
  hi.a1.unit03.lesson02.teach.aaj_teen_tareekh_hai:
    title: 数だけで日付を言う
    gloss: 今日は3日です。
    note: ヒンディー語では日付を、基数（*teen*「3」）だけで言います。日本語の「3日」のような日の数え方に当たる特別な語はなく、すでに知っている数をそのまま使います。
  hi.a1.unit03.lesson02.teach.aaj_teen_january_hai:
    title: 月も付けて日付を言う
    gloss: 今日は1月3日です。
    note: 同じ基数の形で、その後ろに月の名前を付けます。
  hi.a1.unit03.lesson03.teach.kab:
    title: いつ
    gloss: いつ
    note: とてもよく使う、簡単な疑問詞です。
    example_gloss: 次のクラスはいつですか？
  hi.a1.unit03.lesson03.teach.agli:
    title: 次の
    gloss: 次の
    note: '*Agli* は女性形です。日常のヒンディー語では *class*（क्लास）を女性名詞として扱うので、男性形の *agla* ではなく *agli* を使います。'
    example_gloss: 次のクラスは火曜日です。
  hi.a1.unit03.lesson03.teach.das_reprise:
    title: 十
    gloss: 十
    note: 第2課で出てきた語です。ここでは実際の日付に必要です。
    example_gloss: 次のクラスは10日です。
  hi.a1.unit03.lesson03.teach.janmadin:
    title: 誕生日
    gloss: 誕生日
    note: 男性名詞です。mera janmadin で、meri janmadin とは言いません。
    example_gloss: 私の誕生日は12月です。
  hi.a1.unit03.lesson03.teach.tumhara_janmadin_kab_hai:
    title: 親しい相手に誕生日をたずねる
    gloss: あなたの誕生日はいつですか？（くだけた言い方）
    note: Tumhara は男性名詞 janmadin に合わせた形です。
  hi.a1.unit03.lesson03.teach.mera_janmadin_january_mein_hai:
    title: 自分の誕生日を言う
    gloss: 私の誕生日は1月です。
    note: Tumhara janmadin kab hai? に対する、自然な文での答え方です。
  hi.a1.unit03.lesson03.teach.agli_class_kab_hai:
    title: 次のクラスがいつかをたずねる
    gloss: 次のクラスはいつですか？
    note: class に合わせた女性形の agli と kab を組み合わせています。
  hi.a1.unit03.lesson03.teach.agli_class_mangalvar_das_march:
    title: 曜日と日付をまとめて言う
    gloss: 次のクラスは3月10日火曜日です。
    note: 曜日と日付を続けて言います。ヒンディー語では曜日が先で、その後に日と月の順で言います。日本語の「3月10日火曜日」とは順序が異なります。
  hi.a1.unit03.lesson03.teach.dialogue.line01:
    title: アルジュンが次のクラスについてたずねる
    gloss: アルジュンが次のヨガのクラスはいつか聞きます。
    note: このレッスンの質問をそのまま使い、わかりやすいように yog を加えています。
  hi.a1.unit03.lesson03.teach.dialogue.line02:
    title: プリヤが曜日と日付を答える
    gloss: プリヤが、次のクラスは3月10日火曜日だと言います。
    note: このレッスンの曜日と日付の文をそのまま使っています。
  hi.a1.unit03.lesson03.teach.dialogue.line03:
    title: アルジュンがお礼を言う
    gloss: アルジュンが「わかりました、ありがとう」と言います。
    note: Theek hai と shukriya は、どちらも第1課の語彙です。
  hi.a1.unit03.lesson03.teach.dialogue.line04:
    title: プリヤが答える
    gloss: プリヤが「どういたしまして」と言います。
    note: Koi baat nahin は「どういたしまして」「気にしないで」という意味でよく使う自然な言い方です。
  hi.a1.unit03.lesson03.teach.dialogue.line05:
    title: アルジュンがプリヤの誕生日をたずねる
    gloss: アルジュンがプリヤに誕生日はいつか聞きます。
    note: このレッスンのくだけた誕生日の質問をそのまま使っています。
  hi.a1.unit03.lesson03.teach.dialogue.line06:
    title: プリヤが答える
    gloss: プリヤが、自分の誕生日は1月だと言います。
    note: このレッスンの答えの文をそのまま使っています。
  hi.a1.unit03.lesson03.teach.dialogue.line07:
    title: アルジュンが反応し、自分の誕生日も言う
    gloss: アルジュンが「そうなんだ！」と反応し、自分の誕生日は12月だと言います。
    note: Accha は第1課の語彙です。12月はこの単元の第2課で学びました。
  hi.a1.unit03.lesson03.teach.dialogue.line08:
    title: プリヤが会話を締めくくる
    gloss: プリヤが同意して、「またね」と気軽に言います。
    note: Theek hai と phir milte hain は、どちらも第1課の別れのあいさつの語彙です。
