teaching:
  hi.a1.unit09.lesson01.teach.review_places:
    title: 復習：場所
    gloss: 銀行、学校、病院、公園、駅、郵便局
    note: 前のユニットで学んだ場所を表す語の簡単な復習です。このユニットでもたくさん使います。
    example_gloss:
    - 銀行はここにあります。
    - 郵便局は銀行の近くにあります。
  hi.a1.unit09.lesson01.teach.review_function_words:
    title: 復習：〜です・ある、どこ、ここ、あそこ、〜から、〜の、オーケー
    gloss: 〜です・ある、どこ、ここ、あそこ、〜から、〜の、オーケー
    note: これまでのユニットで学んだ小さな機能語の簡単な復習です。このユニットの練習問題でも使います。
    example_gloss:
    - 銀行はどこですか。
    - 公園はあそこです。
  hi.a1.unit09.lesson01.teach.seedhe_baaen_daaen:
    title: まっすぐ、左、右
    gloss: まっすぐ、左、右
    note: このユニットの中心となる、方向を表す3つの語です。
    example_gloss:
    - まっすぐ行ってください。
    - 左に曲がってください。
  hi.a1.unit09.lesson01.teach.jao_muro:
    title: 行って！、曲がって！
    gloss: 行って！、曲がって！（くだけた命令）
    note: tum の形の命令で、友達どうしが道を教え合うときに自然な言い方です。
    example_gloss:
    - まっすぐ行ってください。
    - 右に曲がってください。
  hi.a1.unit09.lesson01.teach.yahan_se_seedhe_jao:
    title: ここからまっすぐ行く
    gloss: ここからまっすぐ行ってください。
    note: このレッスンの新しい語と 'yahaan se'（ここから）を組み合わせた表現です。
  hi.a1.unit09.lesson01.teach.baaen_muro_phrase:
    title: 左に曲がる
    gloss: 左に曲がってください。
    note: 単独で使える命令の表現で、そのまま使えます。
  hi.a1.unit09.lesson01.teach.daaen_muro_phrase:
    title: 右に曲がる
    gloss: 右に曲がってください。
    note: '''baaen muro'' と対になる命令の表現です。'
  hi.a1.unit09.lesson01.teach.imperative_note:
    title: 命令形の語尾 -o
    gloss: '''Jaao'' と ''muro'' は tum の形の命令で、''bataao'' や ''gino'' と同じく、すべて ''-o'' で終わります。'
    note: 以前のユニットで学んだ2つの語（ユニット7の bataao とユニット2の gino）と共通する、くだけた命令形のパターンを示しています。
  hi.a1.unit09.lesson02.teach.bank_kaise_jaun:
    title: 銀行へはどう行けばいいですか？
    gloss: 銀行へはどう行けばいいですか？
    note: 道をたずねるときの基本の質問で、一人称の「（私は）行けばいいか」の形を使います。
  hi.a1.unit09.lesson02.teach.tak:
    title: 〜まで
    gloss: 〜まで
    note: ユニット2の数え方（'zero se das tak'）で出てきましたが、ここでは場所を表す、同じくよく使う意味で使います。
    example_gloss: 銀行までまっすぐ行ってください。
  hi.a1.unit09.lesson02.teach.bank_tak_seedhe_jao:
    title: 銀行までまっすぐ行く
    gloss: 銀行までまっすぐ行ってください。
    note: '''tak'' を場所の意味で使った例文です。'
  hi.a1.unit09.lesson02.teach.pahle_phir:
    title: 最初に、それから
    gloss: 最初に、それから
    note: 道順の2つのステップを順に並べるときに使う語のペアです。
    example_gloss:
    - まず、まっすぐ行ってください。
    - それから、左に曲がってください。
  hi.a1.unit09.lesson02.teach.pahle_seedhe_phir_baaen:
    title: まずまっすぐ、それから左
    gloss: まずまっすぐ行って、それから左に曲がってください。
    note: '''pahle'' と ''phir'' を組み合わせた、2段階の指示です。'
  hi.a1.unit09.lesson02.teach.pahle_phir_note:
    title: Pahle と phir
    gloss: '''Pahle'' と ''phir'' は2つのステップをつなぎます。最初の動作に ''pahle''、次の動作に ''phir'' を付けます。例：''pahle seedhe jaao, phir baaen muro.'''
    note: 複数のステップからなる道案内を順序立てて言うための、実用的な文法ポイントです。
  hi.a1.unit09.lesson03.teach.nukkad:
    title: 街角
    gloss: 街角
    note: このレッスン最後の会話で使う新しい場所を表す語で、'par'（〜に・〜で）と一緒に使います。
    example_gloss:
    - 銀行は角にあります。
    - 公園は学校の裏にあります。
  hi.a1.unit09.lesson03.teach.bas:
    title: ただ〜だけ・ちょっと
    gloss: ちょうど・〜だけ
    note: 「バス」(乗り物)の意味でもよく使われる外来語ですが、このコースではその意味は扱わないので、混同する心配はありません。
    example_gloss: もう少しだけ行ってください。
  hi.a1.unit09.lesson03.teach.samajh_gaya:
    title: わかりました
    gloss: わかりました・了解
    note: よく使う2語の表現です。'samajh'(「理解する」の 'samajhna' の語幹)に、動作が完了したことを表す 'gaya'(行った)が付いています。これは男性の形で、プリヤなら 'samajh gayi' と言います。
    example_gloss: わかりました。/了解です。
  hi.a1.unit09.lesson03.teach.accha_bahut_shukriya:
    title: わかりました！ありがとうございます！
    gloss: わかりました！ありがとうございます！
    note: これまでのユニットで出てきた 'accha'、'bahut'、'shukriya' をもう一度使っています。
  hi.a1.unit09.lesson03.teach.koi_baat_nahin_phir_milenge:
    title: どういたしまして！またね。
    gloss: どういたしまして！またね。
    note: このコースで決まって使う別れのあいさつで、ユニット8とまったく同じ表現です。
  hi.a1.unit09.lesson03.teach.dialogue.line01:
    title: アルジュンが郵便局への行き方を尋ねる
    gloss: アルジュンがプリヤに、郵便局への行き方を尋ねます。
    note: このレッスンの2で出てきた、最初の質問の型をもう一度使っています。
  hi.a1.unit09.lesson03.teach.dialogue.line02:
    title: プリヤが道案内を始める
    gloss: プリヤが言います：ここから、まずまっすぐ行ってください。
    note: このユニットの前半で出てきた 'yahaan se' と 'pahle' をもう一度使っています。
  hi.a1.unit09.lesson03.teach.dialogue.line03:
    title: アルジュンが次を尋ねる
    gloss: アルジュンは「わかりました」と言って、その次を尋ねます。
  hi.a1.unit09.lesson03.teach.dialogue.line04:
    title: プリヤが続ける
    gloss: プリヤが言います：それから、銀行の角で左に曲がってください。
    note: 文の中で 'nukkad'(街角)を初めて学びます。
  hi.a1.unit09.lesson03.teach.dialogue.line05:
    title: アルジュンが確認して、また尋ねる
    gloss: アルジュンは「左」と繰り返して了解し、その次を尋ねます。
  hi.a1.unit09.lesson03.teach.dialogue.line06:
    title: プリヤが最初の道順を終える
    gloss: プリヤが言います：もう少しだけ行ってください。郵便局はそこ、銀行の近くです。
    note: '''bas''(ただ・〜だけ)を初めて学びます。郵便局が銀行の近くにあるという、ユニット8で出てきた設定とも合っています。'
  hi.a1.unit09.lesson03.teach.dialogue.line07:
    title: アルジュンが理解し、公園への行き方を尋ねる
    gloss: アルジュンは「わかりました」と言って、公園への行き方を尋ねます。
    note: '''samajh gaya'' という表現を初めて学びます。'
  hi.a1.unit09.lesson03.teach.dialogue.line08:
    title: プリヤが2つ目の道順を教える
    gloss: プリヤが言います：公園ですか？まずまっすぐ行って、それから右に曲がってください。公園は学校の裏にあります。
    note: 公園が学校の裏にあるという、ユニット8で出てきた設定と合っています。
  hi.a1.unit09.lesson03.teach.dialogue.line09:
    title: アルジュンがプリヤにお礼を言う
    gloss: アルジュンは「わかりました」と言って、プリヤに深く感謝します。
  hi.a1.unit09.lesson03.teach.dialogue.line10:
    title: プリヤが締めくくる
    gloss: プリヤは「どういたしまして、またね」と言います。
    note: ユニット8の会話と同じ締めのひと言を、そのまま使っています。
