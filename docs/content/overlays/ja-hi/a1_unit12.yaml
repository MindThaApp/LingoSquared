teaching:
  hi.a1.unit12.lesson01.teach.vyast_review:
    title: 復習：忙しい
    gloss: 忙しい
    note: ユニット11で学んだ形容詞の復習です。このユニットでは、新しい過去形の「〜だった」の練習にこの語を使います。
    example_gloss: アルジュンは忙しいです。
  hi.a1.unit12.lesson01.teach.tha_thi:
    title: 〜だった(男性形/女性形)
    gloss: 〜だった
    note: 「〜です」にあたるコピュラ(hai/hoon/hain)の過去形です。'Tha' は男性の主語に、'thi' は女性の主語に合わせて使います。
    example_gloss:
    - アルジュンは昨日忙しかったです。
    - プリヤは昨日忙しかったです。
  hi.a1.unit12.lesson01.teach.tha_thi_grammar:
    title: Tha と thi の使い分け
    gloss: '''Tha'' は男性の主語に、''thi'' は女性の主語に使います。文中で ''hai'' が入る位置に入りますが、''hai'' と違って性によって形が変わります。アルジュンは忙しい、アルジュンは忙しかった、プリヤは忙しかった。'
    note: すでに学んだコピュラの活用を過去形へ広げ、性による一致のパターンをはっきり示します。
  hi.a1.unit12.lesson01.teach.kal_review:
    title: 復習：昨日
    gloss: 昨日
    note: ユニット4で最初に学んだ語で、'kal' は「明日」と「昨日」の両方の意味があり、動詞の時制で区別すると説明しました。このコースで「昨日」の意味を実際に使うのは、このユニットが初めてです。
    example_gloss: 昨日は土曜日でした。
  hi.a1.unit12.lesson01.teach.kaisa:
    title: どんな(男性形)
    gloss: どんな
    note: このコースですでに3つのうち2つを学んだ活用が、これで揃います。ユニット1の「お元気ですか」で 'kaise' と 'kaisi' を学びました。今回は欠けていた男性単数形で、'din'(日)のような主語に使います。
    example_gloss: 一日はどうでしたか？
  hi.a1.unit12.lesson01.teach.kal_kaisa_tha_phrase:
    title: 昨日はどうでしたか？
    gloss: 昨日はどうでしたか？
    note: このユニットで繰り返し出てくる中心的な質問で、ここまでに学んだ語をすべて組み合わせています。
  hi.a1.unit12.lesson01.teach.din_achha_tha_phrase:
    title: いい一日でした。
    gloss: いい一日でした。
    note: 「昨日はどうでしたか？」にそのまま使える答えです。'din' は男性名詞なので男性形を使います。
  hi.a1.unit12.lesson01.teach.filma_achi_thi:
    title: 映画は良かったです。
    gloss: 映画は良かったです。
    note: 女性名詞の主語でも同じパターンです('film' は女性名詞)。ユニット11の語彙の復習にもなります。
  hi.a1.unit12.lesson01.teach.kaisa_kaisi_grammar:
    title: Kaisa、kaisi、kaise
    gloss: '''Kaisa'' は男性単数の主語に(一日はどうでしたか？)、''kaisi'' は女性の主語に(お茶はどうでしたか？)使います。''kaise'' は男性に aap/tum で尋ねるときに使います(お元気ですか？)。女性に尋ねるときは ''aap kaisi hain?'' です。この3つは同じ語の変化形です。'
    note: 活用の全体を初めてまとめます。kaise と kaisi はユニット1ですでに学びました。kaisa はこのレッスンで新しく加わる形です。
  hi.a1.unit12.lesson02.teach.names_mai_review:
    title: 復習：私、アルジュン、プリヤ
    gloss: 私、アルジュン、プリヤ
    note: このレッスンで出てくる一人称の過去形の例文の前に、簡単に復習します。
    example_gloss:
    - 私はアルジュンです。
    - 私はプリヤです。
  hi.a1.unit12.lesson02.teach.jaana_gaya_gai:
    title: 行った(男性形/女性形)
    gloss: 行った
    note: '''jaana''(行く)の過去形です。ユニット9で学んだ命令形 ''jao''(行きなさい)と同じ語根です。''tha''/''thi'' と同じように、主語の性に合わせて形が変わります。'
    example_gloss:
    - アルジュンは市場に行きました。
    - プリヤは家に帰りました。
  hi.a1.unit12.lesson02.teach.jaana_grammar:
    title: Gaya/gai は jaana の過去形
    gloss: '''Gaya''/''gai'' は ''jaana''(行く。ユニット9の jao)の過去形で、''tha''/''thi'' と同じように主語の性に合わせて変わります。'
    note: 新しい過去形を、すでに学んだ命令形の語根と結びつけて示します。
  hi.a1.unit12.lesson02.teach.bazaar_ghar_review:
    title: 復習：市場、家
    gloss: 市場、家
    note: ユニット7・8で学んだ場所を表す2つの語の復習です。どこへ行ったかを言うのに必要です。
    example_gloss:
    - ここは市場です。
    - ここは家です。
  hi.a1.unit12.lesson02.teach.milna_mila_mili:
    title: 会った(男性形/女性形)
    gloss: 会った
    note: '''milna''(会う)の過去形です。ユニット1・4・10・11の別れのあいさつにあった習慣を表す ''milte hain'' と同じ語根です。主語の性に合わせて形が変わります。'
    example_gloss:
    - アルジュンはプリヤに会いました。
    - プリヤはアルジュンに会いました。
  hi.a1.unit12.lesson02.teach.milna_se_grammar:
    title: ここでの se は「と」の意味で、「から」ではありません
    gloss: ここでの 'se' は「〜から」ではありません。'X se milna' は「Xと会う」という意味です。一方、'main Bharat se hoon' では同じ 'se' が「〜から(出身)」の意味でした。
    note: すでに学んだ語に2つの使い方があることを、はっきり示します。
  hi.a1.unit12.lesson02.teach.wahan_review:
    title: 復習：そこ
    gloss: そこに
    note: ユニット8・9で学んだ語の復習です。ここでは会った場所を言うのに使います。
    example_gloss: 学校はそこにあります。
  hi.a1.unit12.lesson02.teach.kal_bazaar_gaya_phrase:
    title: 昨日、市場に行きました。
    gloss: 昨日、市場に行きました。
    note: このレッスンの新しい過去形に、レッスン1の 'kal' を組み合わせています。
  hi.a1.unit12.lesson02.teach.wahan_priya_se_mila_phrase:
    title: そこでプリヤに会いました。
    gloss: そこでプリヤに会いました。
    note: このレッスンの 'mila' に、'se'(と)と 'wahan'(そこ)を組み合わせています。
  hi.a1.unit12.lesson02.teach.saath_review:
    title: 復習：一緒に
    gloss: 一緒に
    note: ユニット11で学んだ語の簡単な復習です。
    example_gloss: 私たちは一緒にお茶を飲みます。
  hi.a1.unit12.lesson03.teach.chai_dukaan_khana_review:
    title: 復習：お茶、店、食べ物
    gloss: お茶、店、食べ物
    note: ユニット6・7で学んだ3つの名詞の復習です。このレッスンの会話と読み物の解説で必要になります。
    example_gloss:
    - お茶は良いです。
    - 店は良いです。
    - 食べ物は良いです。
  hi.a1.unit12.lesson03.teach.ka_kaisi_review:
    title: 復習：「の」(ka)、どんな(女性形)
    gloss: 〜の、どんな(女性形)
    note: '''Ka'' は以前の ''kitne ka'' やユニット10の ''raat ka khana'' で、''kaisi'' も以前に学んだ語です。どちらもここで再び使いますが、新しい文法ではありません。'
    example_gloss:
    - 昨日は良い一日でした。
    - 喫茶店はどうでしたか？
  hi.a1.unit12.lesson03.teach.dialogue.line01:
    title: アルジュンが昨日のことを尋ねる
    gloss: プリヤ、昨日はどうでしたか？
  hi.a1.unit12.lesson03.teach.dialogue.line02:
    title: プリヤが良かったと答える
    gloss: とても良かったです！私たちは会いました。
  hi.a1.unit12.lesson03.teach.dialogue.line03:
    title: アルジュンが市場のことを話す
    gloss: はい！最初に市場にも行きました。
  hi.a1.unit12.lesson03.teach.dialogue.line04:
    title: プリヤが市場のことを尋ねる
    gloss: そうなんですね！市場には何がありましたか？
  hi.a1.unit12.lesson03.teach.dialogue.line05:
    title: アルジュンが答える
    gloss: 食べ物が良かったです。
  hi.a1.unit12.lesson03.teach.dialogue.line06:
    title: プリヤが喫茶店のことを尋ねる
    gloss: そうなんですね！それで、喫茶店はどうでしたか？
  hi.a1.unit12.lesson03.teach.dialogue.line07:
    title: アルジュンが答える
    gloss: 喫茶店はとても良かったです。
  hi.a1.unit12.lesson03.teach.dialogue.line08:
    title: プリヤが話を締めくくる
    gloss: いいですね！では、明日また会いましょうか？
  hi.a1.unit12.lesson03.teach.mile_grammar:
    title: Tum/hum/ve は複数形の形の過去形を取る
    gloss: '''Tum''、''hum''、''ve'' の過去形は、現在形で ''-te'' を取るときと同じ形になります。''tha'' の代わりに ''the''、''gaya'' の代わりに ''gaye''、''mila'' の代わりに ''mile'' です。たとえば ''hum milte hain'' は ''hum mile'' になります。'
    note: 理解を深めるために活用の全体像を示します。ただし、このユニットの練習問題で実際に練習するのは 'mile' だけです。'the'/'gaye' は見て分かればよく、この解説の中にしか出てきません。
  hi.a1.unit12.lesson03.teach.priya_note:
    title: プリヤのメモ
    gloss: アルジュン、昨日はとても良い一日でした。食事もおいしくて、チャイ屋さんもよかったです。― プリヤ
    note: 会話で確認したばかりの内容をまとめた短いメモです。新しい単語はありません。
    glosses:
      कल: 昨日
      दिन: 日
      अच्छा: 良い(男性形)
      था: 〜だった(男性形)
      खाना: 食べ物
      दुकान: 店
      अच्छी: 良い(女性形)
      थी: 〜だった(女性形)
