teaching:
  hi.a1.unit11.lesson01.teach.review_chai_kaafi:
    title: 復習:お茶、コーヒー
    gloss: お茶、コーヒー
    note: 第6課で学んだ飲み物の言葉をさっと復習します。この課では、これらを使って誘い方を練習します。
    example_gloss:
    - お茶が欲しいです。
    - コーヒーが欲しいです。
  hi.a1.unit11.lesson01.teach.filma:
    title: 映画
    gloss: 映画
    note: この課のテーマである「予定を立てる」ための新しい名詞です。
    example_gloss: この映画はおもしろいです。
  hi.a1.unit11.lesson01.teach.dekhna:
    title: 私たちは見る/見ましょう
    gloss: (私たちは)見る/見ましょう
    note: '''dekhna''(見る)の習慣を表す複数形です。ここでは、いっしょに何かをしようと誘うときに使います。'
    example_gloss: 私たちは映画を見ます。
  hi.a1.unit11.lesson01.teach.chalo_film_phrase:
    title: 映画を見ましょう!
    gloss: 映画を見ましょう!
    note: '''Chalo'' + 習慣を表す複数形の動詞は、いっしょに何かをしようと誘う日常的な言い方です。第1課・第6課・第7課でもすでに自然な形で出てきました(''chalo shuru karte hain''、''chalo, kuch khaate hain''、''chalo, kuch khareedte hain'')。この課ではこの型を整理して広げます。'
  hi.a1.unit11.lesson01.teach.saath:
    title: いっしょに
    gloss: いっしょに
    note: いっしょに何かをすることを誘うときに使います。
    example_gloss: いっしょに映画を見ましょう!
  hi.a1.unit11.lesson01.teach.peena:
    title: 私たちは飲む/飲みましょう
    gloss: (私たちは)飲む/飲みましょう
    note: '''peena''(飲む)の習慣を表す複数形で、''dekhte hain'' と同じ型です。'
    example_gloss: 私たちはお茶を飲みます。
  hi.a1.unit11.lesson01.teach.chalo_chai_phrase:
    title: いっしょにお茶を飲みましょう!
    gloss: いっしょにお茶を飲みましょう!
    note: この課の 'saath' と 'peete hain' を組み合わせた2つ目の誘い文句で、映画の誘いと同じ 'chalo' の型を使います。
  hi.a1.unit11.lesson01.teach.chalo_grammar_note:
    title: Chalo + 動詞-te + hain =「~しましょう」
    gloss: いっしょに何かをしようと誘うときは、'chalo' + 動詞-te + hain と言います:映画を見ましょう!いっしょにお茶を飲みましょう!
    note: これまで前の課で自然な形で3回出てきた型を、はっきりと整理して示します。
  hi.a1.unit11.lesson01.teach.achha_vichar:
    title: いい考えですね!
    gloss: いい考えだね!
    note: 誘いを喜んで受けるときにそのまま使える言い方です。
  hi.a1.unit11.lesson02.teach.vyast:
    title: 忙しい
    gloss: 忙しい
    note: 新しい形容詞です。すでに学んだ「~です」にあたる hoon/ho/hai と組み合わせて、都合がつかないことを表します。
    example_gloss: 今日は忙しいです。
  hi.a1.unit11.lesson02.teach.maaf_karna:
    title: ごめんなさい/すみません
    gloss: ごめんなさい/すみません
    note: 決まった丁寧な表現で、断りをやわらげるときに使います。
    example_gloss: ごめんなさい、忙しいんです。
  hi.a1.unit11.lesson02.teach.maaf_vyast_phrase:
    title: ごめんなさい、忙しいんです。
    gloss: ごめんなさい、忙しいんです。
    note: この課の2つの新しい表現を組み合わせた、基本的な断りの文です。
  hi.a1.unit11.lesson02.teach.mujhe_kaam_hai:
    title: 私は用事があります。
    gloss: 私は用事があります。
    note: 前に学んだ 'mujhe...chahiye'(~がほしい/必要)と同じ 'mujhe...hai'(私には~がある)の型を使い、ここでは断る理由を伝えます。
  hi.a1.unit11.lesson02.teach.decline_grammar_note:
    title: 丁寧に断る方法
    gloss: 誘いを丁寧に断るときは、'maaf karna'(ごめんなさい)に続けて、自分の状況(例:「忙しいです」)や理由(例:「用事があります」)を言います。
    note: 新しい「できる」の表現を導入せず、すでに学んだ文法(「~です」の hoon/ho/hai と、「私には~がある」の型)をあえて使い回しています。
  hi.a1.unit11.lesson02.teach.hum_pronoun:
    title: 私たち
    gloss: 私たち
    note: このコースで初めて正式に学ぶ一人称複数の代名詞です。習慣を表す現在形(-te + hain)は、ve(彼ら)ですでに学んだものと同じで、新しい活用はなく代名詞だけが新しくなります。(tum も -te を取りますが、'ho' と一緒に使います:tum milte ho。)
    example_gloss: 私たちは毎日会います。
  hi.a1.unit11.lesson02.teach.kab_milte_phrase:
    title: いつ会いますか?
    gloss: いつ会いますか?
    note: '''hum'' に ''kab''(第10課)と ''milte hain''(第1課の別れのあいさつから使っていますが、主語は省かれることが多かった表現)を組み合わせています。'
  hi.a1.unit11.lesson02.teach.din_review:
    title: 復習:土曜日、日曜日
    gloss: 土曜日、日曜日
    note: ユニット3で学んだ曜日の名前を2つ、予定を立てるために簡単に復習します。
    example_gloss:
    - 今日は土曜日です。
    - 明日は日曜日です。
  hi.a1.unit11.lesson02.teach.samay_review:
    title: 復習:4時、何時
    gloss: 4時、何時
    note: ユニット4で学んだ時刻の言葉を、予定を立てるために簡単に復習します。
    example_gloss:
    - 今は4時です。
    - 今は何時ですか?
  hi.a1.unit11.lesson02.teach.kya_ravivar_thik_phrase:
    title: 日曜日で大丈夫?
    gloss: 日曜日で大丈夫?
    note: 「क्या」は、ユニット1から出てきたとおり(「क्या यह तुम्हारी पहली बार है?」「क्या तुम योग करती हो?」)、はい・いいえで答える質問の目印として使っています。「何曜日」のような新しい疑問詞ではありません。
  hi.a1.unit11.lesson03.teach.sandesh:
    title: メッセージ
    gloss: メッセージ
    note: 新しい名詞です。このレッスンでは、書面での誘いの部分に使います。
    example_gloss: これはアルジュンのメッセージです。
  hi.a1.unit11.lesson03.teach.dialogue.line01:
    title: アルジュンが土曜日の映画に誘う
    gloss: プリヤ、土曜日に映画を見に行かない?
  hi.a1.unit11.lesson03.teach.dialogue.line02:
    title: プリヤが理由を言って断る
    gloss: ごめん、土曜日は忙しいの。仕事があるんだ。
  hi.a1.unit11.lesson03.teach.dialogue.line03:
    title: アルジュンがいつ会えるか尋ねる
    gloss: わかった。いつ会おうか?
  hi.a1.unit11.lesson03.teach.dialogue.line04:
    title: プリヤが代わりに日曜日を提案する
    gloss: 日曜日はどう?一緒にお茶を飲もうよ!
  hi.a1.unit11.lesson03.teach.dialogue.line05:
    title: アルジュンが承諾して時間を尋ねる
    gloss: いいね!日曜日は何時にする?
  hi.a1.unit11.lesson03.teach.dialogue.line06:
    title: プリヤが時間を提案する
    gloss: 4時で大丈夫?
  hi.a1.unit11.lesson03.teach.dialogue.line07:
    title: アルジュンが確認する
    gloss: うん、4時で大丈夫。じゃあ、そのときにね!
  hi.a1.unit11.lesson03.teach.dialogue.line08:
    title: プリヤが締めくくる
    gloss: わかった、日曜日に会おうね!
  hi.a1.unit11.lesson03.teach.invitation_message:
    title: プリヤのメッセージ
    gloss: こんにちは、アルジュン。日曜日の4時に会って、お茶を飲もうよ。いいかな?- プリヤ
    note: 会話で決まった予定をもう一度伝える、短い誘いのメッセージです。
    glosses:
      चलो: 〜しよう
      रविवार: 日曜日
      मिलते: 会う(मिलनाから)
      चाय: 紅茶
      पीते: 飲む(पीनाから)
      ठीक: いいよ/大丈夫
