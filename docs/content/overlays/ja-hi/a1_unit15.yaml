teaching:
  hi.a1.unit15.lesson01.teach.station_mujhe_hai_review:
    title: 復習:駅、私に、です
    gloss: 駅、私に/私にとって、です
    note: この課の「〜しなければならない」の構文を作るのに必要な、場所を表す名詞とコピュラの簡単な復習です。
    example_gloss:
    - 駅はここです。
    - 私は用事があります。
  hi.a1.unit15.lesson01.teach.jaana:
    title: 行く
    gloss: 行く(不定詞)
    note: すでに習った तुम の命令形 *jao*(ユニット9)の動詞の不定詞です。この課では、基本形の不定詞そのものを学びます。
    example_gloss: 私は行かなければなりません。
  hi.a1.unit15.lesson01.teach.grammar_mujhe_verb_hai:
    title: Mujhe + 動詞 + hai = 〜しなければならない
    gloss: '''Mujhe'' は、''chahiye''(ユニット6、名詞と一緒に)や ''hai''(ユニット11、''mujhe kaam hai''「私は用事があります」のように)ですでに習いました。今回は動詞とも一緒に使います。''mujhe jana hai'' は「私は行かなければなりません」という意味です。注意:''jana'' のときも ''hai'' は変わらず、''hain'' にはなりません。話し手に合わせて変わることはありません。'
    note: すでに習った「代名詞+コピュラ」の型の3つ目の用法です。新しい動詞を入れる前に、これまでの2つの用法をユニット番号で振り返っています。
  hi.a1.unit15.lesson01.teach.mujhe_station_jana_hai_phrase:
    title: 私は駅に行かなければなりません。
    gloss: 私は駅に行かなければなりません。
    note: このユニットで最初に出てくる、義務を表す構文の完全な例文です。
  hi.a1.unit15.lesson01.teach.tiket:
    title: 切符
    gloss: 切符
    note: この旅行のユニット全体で必要になる新しい名詞です。
    example_gloss: 私の切符はどこですか。
  hi.a1.unit15.lesson01.teach.chahiye_review:
    title: 復習:ほしい/必要
    gloss: ほしい/必要
    note: ユニット6で飲み物と一緒に習いました。ここでは切符と一緒に使います。
    example_gloss: お茶をいただきたいです。
  hi.a1.unit15.lesson01.teach.mujhe_tiket_chahiye_phrase:
    title: 切符が必要です。
    gloss: 切符が必要です。
    note: すでに習った *mujhe...chahiye* の型を、このユニットの新しい名詞に当てはめます。
  hi.a1.unit15.lesson01.teach.train:
    title: 列車
    gloss: 電車
    note: 新しい名詞です。
    example_gloss: 電車は大きいです。
  hi.a1.unit15.lesson01.teach.delhi_ka_review:
    title: 復習:デリー、の
    gloss: デリー、の(所有を表す語)
    note: デリーはユニット5で習いました。所有を表す *ka* はユニット5〜14などコース全体で使ってきました。ここでは切符の行き先を示すのに使います。
    example_gloss:
    - 私の兄(弟)はデリーに住んでいます。
    - これはアルジュンのかばんです。
  hi.a1.unit15.lesson01.teach.mujhe_delhi_ka_tiket_chahiye_phrase:
    title: デリー行きの切符が必要です。
    gloss: デリー行きの切符が必要です。
    note: この課の名詞と所有を表す語の型を組み合わせて、具体的な行き先を示します。
  hi.a1.unit15.lesson01.teach.kahan_tumhein_review:
    title: 復習:どこ、あなたに
    gloss: どこ、あなたに/あなたにとって
    note: どちらもすでに習いました(ユニット8とユニット6)。ここでは、相手がどこへ行かなければならないかを尋ねるのに使います。
    example_gloss:
    - 銀行はどこですか。
    - 何がよろしいですか。
  hi.a1.unit15.lesson02.teach.number_review:
    title: 復習:番号
    gloss: 番号
    note: ユニット2で電話番号の言い方として習いました。ここではホームの番号に使います。
    example_gloss: あなたの電話番号は何番ですか。
  hi.a1.unit15.lesson02.teach.platform:
    title: プラットホーム
    gloss: プラットホーム
    note: 新しい名詞で、ヒンディー語で駅のホームを指す標準的な語です(英語からの借用語で、ユニット2の *phone* と同じ型です)。
    example_gloss: ホームは大きいです。
  hi.a1.unit15.lesson02.teach.platform_number_kya_hai_phrase:
    title: ホームの番号は何番ですか。
    gloss: ホームの番号は何番ですか。
    note: すでに習った *kya hai* の疑問文の型(電話番号、値段、年齢など)を、新しい話題に使います。
  hi.a1.unit15.lesson02.teach.platform_number_teen_hai_phrase:
    title: ホームは3番です。
    gloss: ホームの番号は3番です。
    note: 上の質問に対する、自然な完全文の答えです。
  hi.a1.unit15.lesson02.teach.jaana_habitual_grammar:
    title: Jaati hai(女性形への一致)
    gloss: '''Jaati hai'' は、ユニット10の -ta/-ti/-te + hai/hain の規則を新しい動詞 ''jana'' に当てはめた形です。「電車」は文法上女性なので、''jaata hai'' ではなく ''jaati hai'' になります。'
    note: すでに習った習慣を表す現在形の一致の型を、新しい動詞と新しい(文法上女性の)名詞にそのまま広げたものです。
  hi.a1.unit15.lesson02.teach.se_review:
    title: 復習:〜から
    gloss: 〜から
    note: ユニット9で道案内に使って習いました。ここでは、電車が出るホームを示すのに使います。
    example_gloss: ここからまっすぐ行ってください。
  hi.a1.unit15.lesson02.teach.train_platform_se_jaati_hai_phrase:
    title: 電車は3番ホームから出ます。
    gloss: 電車は3番ホームから出ます。
    note: この課の習慣を表す現在形の動詞と、すでに習った「〜から」の後置詞を組み合わせています。
  hi.a1.unit15.lesson02.teach.kitne_baje_review:
    title: 復習:何時に
    gloss: 何時に
    note: 単元4で時刻を言うときに最初に学びました。ここでは出発時刻をたずねるために再び使います。
    example_gloss: 何時ですか?
  hi.a1.unit15.lesson02.teach.train_kitne_baje_jaati_hai_phrase:
    title: 電車は何時に出ますか?
    gloss: 電車は何時に出ますか?
    note: 「何時に」という質問を、現在の時刻ではなく、予定された出発時刻に使っています。
  hi.a1.unit15.lesson02.teach.train_chhah_baje_jaati_hai_phrase:
    title: 電車は6時に出ます。
    gloss: 電車は6時に出ます。
    note: 完全な文での自然な答えです。単元4の複数形 *baje* を使っています（6時は *baja* の例外ではありません。baja の例外は1時だけです）。
  hi.a1.unit15.lesson02.teach.tiket_kitne_ka_hai_phrase:
    title: 切符はいくらですか？
    gloss: 切符はいくらですか？
    note: 単元7の *kitne ka/ki* を使った値段の質問を再び使います。*Tikat* は普通、男性名詞（*ka*）として扱われますが、女性名詞（*kitne ki*）として扱う人も多く、それも正しい言い方です。
  hi.a1.unit15.lesson02.teach.rupaye_review:
    title: 復習：ルピー、50
    gloss: ルピー、50
    note: どちらも単元2で値段や数量を表すために最初に学びました。ここでは切符の値段に再び使います。
    example_gloss: 私は50ルピー持っています。
  hi.a1.unit15.lesson02.teach.tiket_pachaas_rupaye_ka_hai_phrase:
    title: 切符は50ルピーです。
    gloss: 切符は50ルピーです。
    note: 上の値段の質問に対する、自然な文での答えです。
  hi.a1.unit15.lesson03.teach.hum_hamein:
    title: 私たち、私たちに
    gloss: 私たち、私たちに／私たちにとって
    note: '''Hum''（私たち）は単元11で、このコースで最初の一人称複数の代名詞として登場しました。''hamein'' はその与格形で、ここでの二人で移動する会話に必要です。'
    example_gloss:
    - 私たちは元気です。
    - 私たちは駅に行かなければなりません。
  hi.a1.unit15.lesson03.teach.hamein_grammar:
    title: Hamein：4つ目の与格代名詞
    gloss: '''Hamein'' は ''hum''（単元11）の与格形で、''mujhe''（main）や ''tumhein''（tum）と同じ仲間です。ここでも ''jana'' と一緒に使う ''hai'' は変わらず、''hain'' にはなりません。''hum''/''hamein'' に合わせて変化することはないのです。'
    note: これまでに出た3つの与格代名詞を単元番号つきで挙げてから4つ目を加えています。また、第1課の文法ノートで説明した「'hai' は動詞に合わせる」という点を、もう一度確認しています。
  hi.a1.unit15.lesson03.teach.hamein_station_jana_hai_phrase:
    title: 私たちは駅に行かなければなりません。
    gloss: 私たちは駅に行かなければなりません。
    note: 新しい複数形の与格代名詞を使った、必要・義務の表現です。
  hi.a1.unit15.lesson03.teach.ki_review:
    title: 復習：〜の（女性形）
    gloss: 〜の（所有を表す語、女性形）
    note: 単元7で *ka*/*kitne* と一緒に最初に学びました。ヒンディー語では「電車」が女性名詞なので、所有を表す形は 'ka' ではなく 'ki' になります。そのため、ここで再び使います。
    example_gloss: これはデリー行きの電車です。
  hi.a1.unit15.lesson03.teach.dialogue.line01:
    title: アルジュンが、行かなければならないと言います
    gloss: プリヤ、私たちは駅に行かなければなりません。
  hi.a1.unit15.lesson03.teach.dialogue.line02:
    title: プリヤはデリー行きの切符が必要です
    gloss: わかりました。私はデリー行きの切符が必要です。
  hi.a1.unit15.lesson03.teach.dialogue.line03:
    title: アルジュンが値段をたずねます
    gloss: 私もです。切符はいくらですか？
  hi.a1.unit15.lesson03.teach.dialogue.line04:
    title: プリヤが値段を答えます
    gloss: 切符は50ルピーです。
  hi.a1.unit15.lesson03.teach.dialogue.line05:
    title: アルジュンが出発時刻をたずねます
    gloss: そうですか。電車は何時に出ますか？
  hi.a1.unit15.lesson03.teach.dialogue.line06:
    title: プリヤが時刻とプラットフォームを答えます
    gloss: 電車は6時に、3番線から出ます。
  hi.a1.unit15.lesson03.teach.dialogue.line07:
    title: アルジュンが、わかったので行こうと言います
    gloss: わかりました。行きましょう！
  hi.a1.unit15.lesson03.teach.dialogue.line08:
    title: プリヤが同意します
    gloss: 行きましょう！
  hi.a1.unit15.lesson03.teach.grammar_summary:
    title: 3つの大切なルール
    gloss: この単元の3つの大切なルール：(1) 'mujhe/tumhein/hamein + 動詞 + hai' は「〜しなければならない」という意味です。(2) 'X kitne ka/ki hai?' で値段をたずねます。(3) 'X [時刻] baje [場所] se jaati hai' で、移動の時刻と場所を伝えます。
    note: この単元の文法全体をまとめる最後の要約で、単元14の文法ノートが活用形をまとめていたのと同じ形になっています。
  hi.a1.unit15.lesson03.teach.tiket_reading:
    title: 切符を読む
    gloss: 切符：デリー。3番線。6時。
    note: 実際の切符の書き方に合わせて、完全な文を使わない短い断片的な文面にしています。内容は会話ですでに出た事実だけで、新しい情報はありません。
    glosses:
      टिकट: 切符
      प्लेटफ़ॉर्म: プラットホーム
      नंबर: 番号
      बजे: 時
