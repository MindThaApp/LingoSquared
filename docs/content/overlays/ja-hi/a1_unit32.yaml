teaching:
  hi.a1.unit32.lesson01.teach.janvar_paltoo_janvar:
    title: 動物、ペット
    gloss: 動物／ペット
    note: '*जानवर* は動物全般を指す言葉で、*पालतू जानवर*（「人に慣れた動物」）はペットを意味します。'
    example_gloss:
    - 犬は動物です。
    - 犬はペットでもあります。
  hi.a1.unit32.lesson01.teach.kutta_billee:
    title: 犬と猫
    gloss: 犬／猫
    example_gloss:
    - プリヤは犬を飼っています。
    - ヴィクラムは猫を飼っています。
  hi.a1.unit32.lesson01.teach.machhlee_chiriya:
    title: 魚と鳥
    gloss: 魚／鳥
    example_gloss:
    - おじいさんは魚を飼っています。
    - Ninaは鳥を飼っています。
  hi.a1.unit32.lesson01.teach.kya_tumhare_pas:
    title: ペットを飼っていますか？
    gloss: ペットを飼っていますか？
    note: '*तुम्हारे पास ... है?*（直訳「あなたのそばに…ある？」）は「…を持っていますか」「…を飼っていますか」という意味で、*कोई*（「何か」）を使うと特定しない聞き方になります。'
  hi.a1.unit32.lesson01.teach.han_mere_pas:
    title: はい、犬を飼っています
    gloss: はい、犬を飼っています。
    note: このユニットの新しい語彙を使った、簡単な肯定の答えです。
  hi.a1.unit32.lesson01.teach.naheen_mere_pas:
    title: いいえ、ペットは飼っていません
    gloss: いいえ、ペットは飼っていません。
    note: '*कोई ... नहीं है*（「…は何もない」）は、何も持っていないことを表します。'
  hi.a1.unit32.lesson01.teach.mere_pas_koee:
    title: कोई ... नहीं
    gloss: 私はペットを飼っていません。
    note: '*कोई*（「何か」）と *नहीं है* を組み合わせると、何かを持っていないことを表します：*मेरे पास कोई पालतू जानवर नहीं है*。'
  hi.a1.unit32.lesson02.teach.ghumane_le_jana:
    title: （動物を）散歩させる
    gloss: （動物を）散歩させる
    note: '*घुमाने ले जाना*（「散歩に連れて行く」）は、ヒンディー語で動物を散歩させることを表す言い方で、*घुमाने* の後に *ले जाना* が続きます。'
    example_gloss: 私は毎日犬を散歩させます。
  hi.a1.unit32.lesson02.teach.vah_kutte_ko:
    title: घुमाने ले जाना
    gloss: 彼女は犬を散歩に連れて行きます。
    note: 動物には *को* がつき（*कुत्ते को*）、*घुमाने ले जाती है* が最後に来ます。*ले जाना*（「連れて行く」）は二語でひとまとまりです。
  hi.a1.unit32.lesson02.teach.khana_dena:
    title: 餌を与える
    gloss: 餌をあげる
    example_gloss: 私は毎日猫に餌をあげます。
  hi.a1.unit32.lesson02.teach.ke_sath_khelna:
    title: ～と遊ぶ
    gloss: ～と遊ぶ
    example_gloss: ヴィクラムは自分の猫と遊びます。
  hi.a1.unit32.lesson02.teach.main_roz_kutte:
    title: 私は毎日犬を散歩させます
    gloss: 私は毎日犬を散歩させます。
    note: '*रोज़*（「毎日」）は目的語の前に置きます：*रोज़ कुत्ते को घुमाने ले जाता हूँ*。'
  hi.a1.unit32.lesson02.teach.main_roz_billee:
    title: 私は毎日猫に餌を与えます
    gloss: 私は毎日猫に餌をあげます。
    note: '*खाना देना*（「食べ物をあげる」）では、あげる相手を *को* で示します：*बिल्ली को खाना देता हूँ*。'
  hi.a1.unit32.lesson03.teach.ek_kutta_do:
    title: 複数形
    gloss: 犬が一匹、犬が二匹。猫が一匹、猫が二匹。*-आ* で終わる男性名詞は複数形で *-ए* になり（*कुत्ता* → *कुत्ते*）、*-ई* で終わる女性名詞は *-याँ* がつきます（*बिल्ली* → *बिल्लियाँ*）。
    note: 動物の名詞を例に、ヒンディー語の規則的な複数形のパターンを初めて学びます。
  hi.a1.unit32.lesson03.teach.kutte_billiyan:
    title: 犬と猫
    gloss: 犬／猫
    example_gloss:
    - アルジュンは犬が大好きです。
    - ネハは猫が大好きです。
  hi.a1.unit32.lesson03.teach.machhliyan_chiriyan:
    title: 魚と鳥（複数形）
    gloss: 魚／鳥
    example_gloss:
    - 私は魚が大好きです。
    - おじいさんは鳥が大好きです。
  hi.a1.unit32.lesson03.teach.mujhe_janvar_bahut:
    title: 私は動物が大好きです
    gloss: 私は動物が大好きです。
    note: '*मुझे जानवर बहुत पसंद हैं*（直訳「私には動物がとても好まれている」）は「私は動物が大好きです」という意味です。*जानवर* が複数なので *हैं* も複数形になります。'
  hi.a1.unit32.lesson03.teach.neha_ko_billiyan:
    title: ネハは猫が大好きだけれど、ペットはいない
    gloss: ネハは猫が大好きですが、ペットは飼っていません。
    note: 第5課の読解の中心となる対比を示しています。
  hi.a1.unit32.lesson04.teach.arjun_kya_tumhare:
    title: アルジュンがペットについて尋ねる
    gloss: アルジュン：プリヤ、ペットを飼っていますか。
  hi.a1.unit32.lesson04.teach.priya_han_mere:
    title: プリヤは犬を飼っている
    gloss: プリヤ：ええ、犬を飼っています。
  hi.a1.unit32.lesson04.teach.arjun_vah_kaisa:
    title: アルジュンが見た目を尋ねる
    gloss: アルジュン：どんな犬ですか。
    note: '*वह कैसा दिखता है?* は動物にも使えます。犬がオスなので *कैसा* は男性形です。'
  hi.a1.unit32.lesson04.teach.priya_uske_bal:
    title: プリヤが自分の犬を説明する
    gloss: プリヤ：毛は茶色で、小さい子です。
    note: 外見についてのユニットで学んだ髪の色や大きさの語彙を、人の髪ではなく動物の毛の説明に使っています。
  hi.a1.unit32.lesson04.teach.vah_mera_kutta:
    title: 動物に使う वह
    gloss: あれは私の犬です。私はこの子がとても好きです。
    note: '*वह* や *उसे* は人にも動物にも使います。ヒンディー語には、この場面で「それ」にあたる別の言葉はありません。'
  hi.a1.unit32.lesson04.teach.arjun_kya_tum:
    title: アルジュンが散歩について尋ねる
    gloss: アルジュン：毎日散歩に連れて行っているんですか。
  hi.a1.unit32.lesson04.teach.priya_han_main:
    title: プリヤが日課を話す
    gloss: プリヤ：ええ、毎日散歩に連れて行って、えさもあげています。
  hi.a1.unit32.lesson05.teach.arjun_aur_neha:
    title: 動物について話すアルジュン、ネハ、ヴィクラム
    gloss: アルジュンとネハは二人とも動物が大好きですが、二人ともペットは飼っていません。アルジュンは犬が大好きで、ネハは猫が大好きです。ヴィクラムはペットを飼っています。猫です。彼はよく猫と遊び、毎日猫にえさをあげています。あなたはペットを飼っていますか。
    note: 動物が好きなことと、実際に飼っていることの違いを対比しています。これがこの学習目標で伝えたいポイントです。
    glosses:
      पसंद: 愛する
      दोनों: 二人とも
      जानवर: 動物
      किसी: そのうちのだれか
      पालतू: ペット
      कुत्ते: 犬たち
      बिल्लियाँ: 猫たち
      बिल्ली: 猫
      खेलता: 遊ぶ
      देता: 与える
      रोज़: 毎～
      खाना: 餌
  hi.a1.unit32.lesson05.teach.vikram_aksar_apnee:
    title: ヴィクラムはよく自分の猫と遊ぶ
    gloss: ヴィクラムはよく自分の猫と遊びます。
    note: '*अक्सर*（「よく」）は動詞の前に置き、*अपनी* は女性名詞の *बिल्ली* に合わせた形です。'
  hi.a1.unit32.lesson05.teach.mujhe_kutte_bahut:
    title: 私は犬が大好きです。ペットは飼っていません。
    gloss: 私は犬が大好きです。ペットは飼っていません。
    note: このユニットの作文問題でそのまま応用できる、二文からなる解答例です。
  hi.a1.unit32.lesson06.teach.priya_neena_kya:
    title: プリヤがニーナに尋ねる
    gloss: プリヤ：ニーナ、あなたもペットを飼っていますか。
  hi.a1.unit32.lesson06.teach.neena_han_mere:
    title: NinaはPicoという鳥を飼っています
    gloss: Nina：はい、鳥を飼っています。名前はPicoです。
    note: '*उसका नाम पीको है*（「その子の名前はピコです」）では、*नाम* が男性名詞なので *का* を使います。'
  hi.a1.unit32.lesson06.teach.arjun_vah_kitna:
    title: アルジュンが反応する
    gloss: アルジュン：わあ、すてきですね！毎日その子と何をしているんですか。
  hi.a1.unit32.lesson06.teach.neena_main_use:
    title: Ninaは毎日その鳥に餌を与えます
    gloss: Nina：毎日その鳥に餌を与えています。
  hi.a1.unit32.lesson06.teach.arjun_mujhe_bhee:
    title: アルジュンも鳥が大好き
    gloss: アルジュン：僕も鳥が大好きです。
  hi.a1.unit32.lesson06.teach.priya_kitna_achchha:
    title: プリヤが会話をしめくくる
    gloss: プリヤ：私たち三人とも動物が大好きなんて、すてきですね！
    note: このユニットで登場した三人と動物についての話をまとめて、会話を締めくくっています。
