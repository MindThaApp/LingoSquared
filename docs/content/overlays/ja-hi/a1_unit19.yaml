answer_policy:
  weather_existential: '"Aaj/kal + [weather word] + hai" states the current or a stated day''s weather -- *dhoop hai* ("it''s sunny"), *baarish hai* ("it''s raining"), *hawa hai* ("it''s windy") are each stated as a bare existential sentence, not a progressive verb form. A typed answer using the correct weather noun with *hai* is accepted; using *hain* where the sentence''s own subject is singular (or vice versa) is judged as a real grammar error, the exact contrast this unit''s own grammar_check exercises target -- not tolerated as a minor typo.'
  garm_invariant_thanda_agrees: '*Garm* ("hot") never changes for gender or number -- "mausam garm hai" always uses *garm*. *Thanda*/*thandi* ("cold") DOES change with the noun''s gender, the same "-a"/"-i" pattern already taught for *bada*/*badi* (ユニット14) -- masculine *mausam* takes *thanda*, a feminine noun would take *thandi*. Every exercise in this unit pairs *thanda*/*thandi* with *mausam* only, so only *thanda* is ever actually required as a typed answer here; a typed answer using the wrong gender form where one IS tested is marked incorrect as a real grammar error, not tolerated as a typo.'
  kal_context_ambiguity: '*Kal* means both "yesterday" (as taught in units 4/12) and "tomorrow" (as used throughout this unit) -- genuinely ambiguous in real Hindi, disambiguated only by the sentence''s own tense/context. This unit''s own sentences are all future/plan-making in context, so *kal* consistently means "tomorrow" here; don''t mark a learner''s own free sentence wrong merely for using *kal* to mean "yesterday" in a DIFFERENT context than this unit''s own scenario, since both meanings are equally correct Hindi.'
  suggestion_pattern: '"Chalo" + a habitual-plural verb form (e.g. *jaate hain*, *chalte hain*) makes a "Let''s ___" suggestion, the same pattern already used for "chalo, kuch khaate hain!" (ユニット6) and "chalo, kuch kharidte hain!" (ユニット7). *Jaate hain* here is the same "-te hain" habitual form applied to *jaana* ("to go," ユニット15''s infinitive), not a new verb.'
  punctuation: Hindi text is shown with the traditional danda (।) as the sentence-final mark. In typed answers, accept the danda, a plain period (.), or the mark omitted entirely as equivalent. Question marks (?) may likewise be omitted, but the fully punctuated form remains the model answer.
  spoken_answers: Judge spoken responses by intelligibility rather than written punctuation. For any exercise asking the learner to describe today's or tomorrow's weather, accept any of this unit's taught phrasings that fit the prompt, not only the single model sentence given in `accepted_answers`.
course:
  title: ヒンディー語 A1
units:
  hi.a1.unit19.weather:
    title: 天気
lessons:
  hi.a1.unit19.lesson01.mausam_dhoop_baarish_hawa:
    title: 天気・日ざし・雨・風
  hi.a1.unit19.lesson02.garam_thanda_baadal:
    title: 暑い・寒い・雲
  hi.a1.unit19.lesson03.priya_arjun_kal_ka_mausam:
    title: プリヤとアルジュン:明日の天気はどう?
teaching:
  hi.a1.unit19.lesson01.teach.aaj_review:
    title: 復習:今日
    gloss: 今日
    note: 第3課で初めて習いました。このユニットでは、第3課の *kal*(明日)と並んで何度も出てくる時を表す言葉です。
    example_gloss: 今日は3日です。
  hi.a1.unit19.lesson01.teach.mausam:
    title: 天気
    gloss: 天気
    note: 新しい名詞で、このユニットのテーマとなる言葉です。男性名詞です。このユニットの性の一致に関する文法ノートも見てください。
    example_gloss: 今日はどんな天気ですか?
  hi.a1.unit19.lesson01.teach.kaisa_review:
    title: 復習:どんな・どのような様子か
    gloss: どんな・どのような様子か
    note: 第12課で初めて習いました。ここでは天気をたずねるために使います。
    example_gloss: あなたの家はどんな家ですか。
  hi.a1.unit19.lesson01.teach.hai_hain_review:
    title: 復習:です・あります・います(単数/複数)
    gloss: है(単数)、हैं(複数)
    note: このユニットの天気を表す「ある」の文型は、単数と複数のこの2つの形に基づいています。
    example_gloss:
    - 今日は天気がいいです。
    - 家に部屋が3つあります。
  hi.a1.unit19.lesson01.teach.dhoop:
    title: 日ざし・日光
    gloss: 日ざし・日光
    note: 新しい名詞です。*aaj dhoop hai* =「今日は晴れです」(直訳は「今日は日ざしがある」)のように、「ある」の文として言います。
    example_gloss: 今日は晴れています。
  hi.a1.unit19.lesson01.teach.baarish:
    title: 雨
    gloss: 雨
    note: 新しい名詞です。*aaj baarish hai* =「今日は雨です」のように、「ある」の文として言います。
    example_gloss: 今日は雨が降っています。
  hi.a1.unit19.lesson01.teach.hawa:
    title: 風
    gloss: 風
    note: 新しい名詞です。*aaj hawa hai* =「今日は風が強いです」のように、「ある」の文として言います。
    example_gloss: 今日は風があります。
  hi.a1.unit19.lesson01.teach.grammar_mausam_existential:
    title: 天気を表す「ある」の文型
    gloss: 天気を言うときは、「aaj/kal + [天気の言葉] + hai」と言います。例:'aaj dhoop hai'、'aaj baarish hai'、'aaj hawa hai'。これはユニット18で家の部屋について習った hai/hain の文型と同じですが、ここでは数を入れず、そのまま主語として使います。
    note: このユニット最初の文法ノートです。新しい単語を、すでに知っている文型と結びつけます。
  hi.a1.unit19.lesson02.teach.mausam_review:
    title: 復習:天気
    gloss: 天気
    note: このユニットの第1課で出てきた単語です。
    example_gloss: 今日はどんな天気ですか?
  hi.a1.unit19.lesson02.teach.garam:
    title: 暑い
    gloss: 暑い
    note: 新しい形容詞です。性によって形が変わりません。この課の文法ノートも見てください。
    example_gloss: 今日は暑いです。
  hi.a1.unit19.lesson02.teach.thanda_thandi:
    title: 寒い・冷たい(男性形/女性形)
    gloss: 寒い・冷たい(男性形)、寒い・冷たい(女性形)
    note: 新しい形容詞です。*garm* と違って、性によって形が変わります。男性名詞の *mausam* には *thanda*、女性名詞(ユニット18の *rasoi* など)には *thandi* を使います。この課の文法ノートも見てください。
    example_gloss:
    - 今日は寒いです。
    - 今日はキッチンが寒いです。
  hi.a1.unit19.lesson02.teach.grammar_garam_thanda:
    title: 形が変わらない形容詞と、性に合わせて変わる形容詞
    gloss: '''Garm'' は子音で終わる形容詞で、性によって形が変わりません。''mausam garm hai'' では常に ''garm'' を使います。一方、''thanda''/''thandi'' は ''-a'' で終わる形容詞で、ユニット14の ''bada''/''badi'' と同じように性によって形が変わります。男性名詞の ''mausam'' には ''thanda''、女性名詞には ''thandi'' を使います。'
    note: このユニットの中心となる文法の対比です。新しい形容詞のペアを、ユニット14で習った規則と結びつけます。
  hi.a1.unit19.lesson02.teach.baadal:
    title: 雲
    gloss: 雲
    note: 新しい名詞です。このユニットでは、自然な複数形の「ある」の文だけで使います。*aaj baadal hain* =「今日は雲があります」「今日は曇りです」。
    example_gloss: 今日は雲があります。
  hi.a1.unit19.lesson02.teach.accha_review:
    title: 復習:よい
    gloss: 良い
    note: 第9課で初めて習いました。ここでは天気を表すために使います。
    example_gloss: 今日は天気がいいです。
  hi.a1.unit19.lesson02.teach.bura:
    title: 悪い
    gloss: 悪い
    note: 新しい形容詞で、すでに習った *accha*(よい)と対になります。このユニットでは *mausam* に合わせて男性形だけを使います。
    example_gloss: 今日は天気が悪いです。
  hi.a1.unit19.lesson02.teach.bahut_review:
    title: 復習:とても
    gloss: とても
    note: 第6課で初めて習いました。ここでは天気の表現を強めるために使います。
    example_gloss: 今日はとても寒いです。
  hi.a1.unit19.lesson03.teach.kal_review:
    title: 復習:明日(昨日の意味もあります)
    gloss: 明日(文脈によっては「昨日」の意味にもなります)
    note: 第4課で初めて習い、ユニット12では「昨日」の意味でも出てきました。実際のヒンディー語でも本当にどちらにも取れ、文脈だけで区別します。このユニットの文はすべて未来の予定についてなので、ここでは 'kal' は「明日」の意味です。
    example_gloss: 明日は雨です。
  hi.a1.unit19.lesson03.teach.ghar_review:
    title: 復習:家
    gloss: 家
    note: ユニット8で最初に学びました。ここでは、その結果としての予定(家にいる)で再び使います。
    example_gloss: これは家です。
  hi.a1.unit19.lesson03.teach.mein_review:
    title: 復習:〜の中に / 〜で
    gloss: 〜で / 〜に
    note: ユニット1で最初に学びました。ここでは「ghar mein」(家で)の形で再び使います。
    example_gloss: 家に部屋が3つあります。
  hi.a1.unit19.lesson03.teach.hum_review:
    title: 復習:私たち
    gloss: 私たち
    note: ユニット11で最初に学びました。ここでは、この課で予定を立てる主語として再び使います。
    example_gloss: 私たちは映画を見ます。
  hi.a1.unit19.lesson03.teach.rehte_hain_review:
    title: 復習:住んでいる / 滞在する
    gloss: 住んでいる / 滞在する
    note: ユニット5で最初に学びました(単数の祖父に対し、男性複数形の敬意の一致を使っていました)。このユニットでは初めて、本当の複数の主語「hum」(私たち)と一緒に使います。動詞の形は同じで、よりシンプルな使い方です。
    example_gloss: 祖父はデリーに住んでいます。
  hi.a1.unit19.lesson03.teach.chalo_review:
    title: 復習:〜しよう / さあ
    gloss: 〜しよう / さあ
    note: ユニット1で最初に学び、ユニット6・7・11では習慣を表す複数形の動詞と組み合わせて「〜しよう」の意味で使いました。ここでも同じように使います。
    example_gloss: 何か食べよう!
  hi.a1.unit19.lesson03.teach.jaana_review:
    title: 復習:行く
    gloss: 行く
    note: ユニット15で、基本形(不定詞)としてそのまま学びました。この課では、習慣を表す複数形「jaate hain」(私たちは行く)に広げます。ユニット11で「dekhte hain」「peete hain」に使ったのと同じ作り方です。
    example_gloss: 私は駅に行かなければなりません。
  hi.a1.unit19.lesson03.teach.aur_review:
    title: 復習:と
    gloss: と・そして
    note: ユニット1で最初に学びました。ここでは、明日の天気と気温をつなげるために再び使います。
    example_gloss: 明日は雨で、寒くなります。
  hi.a1.unit19.lesson03.teach.bahar:
    title: 外
    gloss: 外
    note: 新出単語です。この課で決まる予定に使う語彙です。
    example_gloss: 外に行こう!
  hi.a1.unit19.lesson03.teach.jaate_hain_phrase:
    title: 外に行こう!
    gloss: 外に行こう!
    note: 「Chalo」+ 習慣を表す複数形「jaate hain」(「jaana」=行く、から)。ユニット1・6・7・11で学んだ「〜しよう」と同じ型です。
  hi.a1.unit19.lesson03.teach.dialogue.line01:
    title: アルジュンがプリヤに今日の天気をたずねる
    gloss: プリヤ、今日の天気はどう?
  hi.a1.unit19.lesson03.teach.dialogue.line02:
    title: プリヤが今日の天気を説明する
    gloss: 今日は日が照っていて、暑いよ。
  hi.a1.unit19.lesson03.teach.dialogue.line03:
    title: アルジュンが外に行こうと誘う
    gloss: いいね!外に行こう。
  hi.a1.unit19.lesson03.teach.dialogue.line04:
    title: プリヤが明日の天気をたずねる
    gloss: わかった!じゃあ、明日の天気はどう?
  hi.a1.unit19.lesson03.teach.dialogue.line05:
    title: アルジュンが明日の天気を説明する
    gloss: 明日は雨で、寒くなります。
  hi.a1.unit19.lesson03.teach.dialogue.line06:
    title: プリヤが家にいようと提案する
    gloss: じゃあ、明日は家にいる?
  hi.a1.unit19.lesson03.teach.dialogue.line07:
    title: アルジュンが賛成する
    gloss: うん、明日は家にいよう。
  hi.a1.unit19.lesson03.teach.dialogue.line08:
    title: プリヤが賛成する
    gloss: わかった!
  hi.a1.unit19.lesson03.teach.grammar_summary:
    title: 3つの大事なルール
    gloss: このユニットの3つの大事なルール:(1)天気は「aaj/kal + [天気の語] + hai/hain」で言います。(2)「garm」は性によって変わりませんが、「thanda」/「thandi」は変わります。「bada」/「badi」と同じです。(3)「chalo」+ 習慣を表す複数形の動詞(「jaate hain」など)で提案になります。「chalo, bahar jaate hain!」
    note: このユニット全体の文法をまとめる総括です。ユニット15〜18の、活用のまとめ文法ノートと同じ役割です。
  hi.a1.unit19.lesson03.teach.weather_reading:
    title: 今日と明日についての読み物
    gloss: 今日は暑くて、日が照っています。外に行こう!明日は雨で、寒くなります。明日は家にいましょう。
    note: ダイアログですでに出てきた内容だけをそのまま述べた短い紹介文です。新しい内容はありません。「短い天気予報を読む」という目標に直接つながります。
    glosses:
      आज: 今日
      मौसम: 天気
      गर्म: 暑い
      धूप: 日ざし
      चलो: 〜しよう
      बाहर: 外
      जाते: 行く(जानाより)
      कल: 明日
      बारिश: 雨
      ठंडा: 寒い
      रहते: 住む / 滞在する(रहनाより)
