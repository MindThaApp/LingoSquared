teaching:
  hi.a1.unit28.lesson01.teach.fon_karna:
    title: 電話する
    gloss: 電話する
    note: 電話をかけることを表す動詞の不定詞です。
    example_gloss: あなたに電話しなければなりません。
  hi.a1.unit28.lesson01.teach.main_tumhen_fon:
    title: 電話すると伝える
    gloss: あなたに電話します。
    note: '*करूँगा* は *करना* の未来形で、ヒンディー語では日本語の「〜しますね」のように、これから自分がすると言うときに使います。電話をかける相手には *तुम्हें*（「あなたに」）を使います。'
  hi.a1.unit28.lesson01.teach.hailo_main_priya:
    title: 電話に出る
    gloss: もしもし、プリヤです。
    note: 電話では *मैं ... बोल रही हूँ*（「〜が話しています」）と言います。プリヤは女性なので *रही* は女性形です。
  hi.a1.unit28.lesson01.teach.hailo_main_arjun:
    title: アルジュンも同じように答えます
    gloss: もしもし、アルジュンです。
    note: 同じ型で男性形の *रहा* を使います：*मैं अर्जुन बोल रहा हूँ*。アルジュンは男性だからです。
  hi.a1.unit28.lesson02.teach.main_kisse_bat:
    title: 誰からの電話か尋ねる
    gloss: どちら様ですか？
    note: '*किससे*（「誰と」）は *कौन*（「誰」）に *से* が付いた形で、*से* は話す相手を表します。'
  hi.a1.unit28.lesson02.teach.ap_priya_se:
    title: 丁寧に名乗る
    gloss: プリヤと話しています。
    note: '*आप* は知らない人に使う丁寧な「あなた」です。*प्रिया से बात कर रहे हैं* では名前の後ろに *से* を置き、*आप* には *हैं* が合います。'
  hi.a1.unit28.lesson03.teach.kya_tum_yah:
    title: もう一度言ってもらう
    gloss: それをもう一度言ってもらえますか？
    note: '*सकते हो* は「できる」の意味で、主動詞の後に来ます：*कह सकते हो*。文頭の *क्या* で疑問文になります。'
  hi.a1.unit28.lesson03.teach.itna_tez_mat:
    title: ゆっくり話してもらう
    gloss: そんなに速く話さないでください。
    note: '*मत बोलो* は *तुम* に対する親しい「話さないで」で、*इतना तेज़* は「そんなに速く」という意味です。'
  hi.a1.unit28.lesson03.teach.mujhe_tumharee_avaz:
    title: よく聞こえないと伝える
    gloss: よく聞こえません。
    note: ヒンディー語では「あなたの声が来ない」と言います：*मुझे तुम्हारी आवाज़ नहीं आ रही है*。聞く人は *मुझे* で表し、声が主語になります。
  hi.a1.unit28.lesson04.teach.maisej:
    title: メッセージ
    gloss: メッセージ
    note: '*मैसेज* はよく使われる外来語で男性名詞です：*एक मैसेज*、*यह मैसेज ... का है*。'
    example_gloss: このメッセージはプリヤからです。
  hi.a1.unit28.lesson04.teach.main_tumhen_ek:
    title: メッセージを送ると伝える
    gloss: あなたにメッセージを送ります。
    note: 語順は「人、物、動詞」です：*तुम्हें एक मैसेज भेजूँगा*。*भेजना* は「送る」という意味です。
  hi.a1.unit28.lesson04.teach.main_tumhen_bad:
    title: かけ直すと伝える
    gloss: 後でかけ直します。
    note: '*वापस फ़ोन करना* は「かけ直す」という意味で、*वापस* を *फ़ोन करना* の前に置きます。*बाद में* は「後で」です。'
  hi.a1.unit28.lesson05.teach.arjun_hay_priya:
    title: メッセージのやり取りを読む
    gloss: アルジュン：やあプリヤ、電話してもらえる？ 伝えたいことがあるんだ。 プリヤ：ええ、もちろん。5分後にかけ直すね。
    note: アルジュンが何を頼んでいるか、その理由、そしてプリヤがいつかけ直すと言っているかに注目しましょう。
    glosses:
      हाय: やあ
      सकती: できる
      फ़ोन: 電話する
      ज़रूरी: 大切な（大事な話がある、というときの）
      कुछ: 何か
      बतानी: 伝える
      ज़रूर: もちろん
      करूँगी: かけ直します
      पाँच: '5'
      मिनट: 分
      वापस: 折り返す
  hi.a1.unit28.lesson06.teach.arjun_hailo_main:
    title: アルジュンが電話に出る
    gloss: アルジュン：もしもし、アルジュンです。
    note: 電話に出た人はまず *मैं ... बोल रहा हूँ* で名前を言います。ここでは男性形の *रहा* です。
  hi.a1.unit28.lesson06.teach.priya_hay_arjun:
    title: プリヤが名乗る
    gloss: プリヤ：やあアルジュン、プリヤだよ。 アルジュン：電話してくれてうれしいな！
    note: '*अच्छा हुआ तुमने फ़ोन किया* は「電話してくれてよかった」という意味です。*तुमने ... किया* は *ने* を使う過去形です。'
  hi.a1.unit28.lesson06.teach.priya_tumharee_pahlee:
    title: プリヤがシフトについて尋ねる
    gloss: プリヤ：初めてのシフトはどうだった？
    note: '*कैसी रही* は「どうだった？」と尋ねる表現です。*शिफ़्ट* が女性名詞なので *कैसी* は女性形です。'
  hi.a1.unit28.lesson06.teach.arjun_bahut_achchhee:
    title: アルジュンが良い知らせを伝える
    gloss: アルジュン：とてもうまくいったよ、思っていたよりもよかった。
    note: '*अच्छी रही*（「うまくいった」）は女性名詞の *शिफ़्ट* に合わせた形で、*जितना मैंने सोचा था उससे भी बेहतर* は「思っていたよりさらによい」という意味です。'
  hi.a1.unit28.lesson06.teach.vah_narvas_tha:
    title: था と थी：〜だった
    gloss: 彼は緊張していて、彼女はうれしかった。
    note: '*था* は男性が主語のときの「〜だった」、*थी* は女性が主語のときの形です。語尾は、描かれる人や物に合わせて変わります。'
  hi.a1.unit28.lesson06.teach.priya_yah_sunkar:
    title: プリヤが誇りに思う
    gloss: プリヤ：それを聞けてうれしいな！ あなたを誇りに思うよ。
    note: '*तुम पर गर्व है*（直訳「誇りがあなたの上にある」）では *पर* を使い、誇りに思う人は *मुझे* で表します。'
  hi.a1.unit28.lesson06.teach.arjun_bahut_shukriya:
    title: アルジュンが感激する
    gloss: アルジュン：ありがとう、僕にとってすごく大きな意味があるよ。
    note: '*मेरे लिए* は「私にとって」、*इसका बहुत मतलब है* は「それには大きな意味がある」という意味です。'
  hi.a1.unit28.lesson06.teach.uskee_pahlee_shift:
    title: 彼の
    gloss: 彼の初めてのシフトはとてもうまくいきました。
    note: '*उसकी* は「彼の」「彼女の」のどちらにも使う同じ語で、女性名詞の *शिफ़्ट* に合わせた形です。'
