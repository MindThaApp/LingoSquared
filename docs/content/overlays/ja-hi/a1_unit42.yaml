    title: Nina がみんなについて聞きます
    gloss: ニナは言語カフェに来たばかりです。彼女はアルジュンに、ほかの人たちはどんな人かを尋ねます。アルジュンが教えてくれます。プリヤは優しくて忍耐強く、看護師として働いています。ヴィクラムは面白くて、スペイン語の講座を受けています。ネハは好奇心旺盛で、新しいことを学ぶのが好きです。アルジュン自身は穏やかです。
