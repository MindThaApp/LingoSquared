answer_policy:
  nasalization_marks: Display and teach the correct chandrabindu/anusvara distinction (पाँच vs. मैं, हैं, में). In typed A1 answers, accept a variant that drops the nasalization mark entirely or substitutes anusvara for chandrabindu (पांच for पाँच) when every other character is correct -- these marks are small, easy to miss on a virtual keyboard, and near-homophonous in casual speech; this is a beginner course, not a spelling test. Do not extend this tolerance to a wrong vowel or consonant, which changes the actual word.
  punctuation: Hindi text is shown with the traditional danda (।) as the sentence-final mark, matching how it is actually printed and taught. In typed answers, accept the danda, a plain period (.), or the mark omitted entirely as equivalent -- most everyday Hindi typed on phones/keyboards uses a plain period, and this distinction carries no meaning difference. Question marks (?) and exclamation marks may likewise be omitted, but the fully punctuated form remains the model answer.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register (aap vs. tum) rather than written punctuation or nasalization marks.
course:
  title: ヒンディー語 A1
units:
  hi.a1.unit02.numbers:
    title: 数
lessons:
  hi.a1.unit02.lesson01.numbers_zero_to_ten:
    title: 0から10までの数
  hi.a1.unit02.lesson02.numbers_and_prices:
    title: 11から100までの数と値段
  hi.a1.unit02.lesson03.phone_and_age:
    title: 電話番号と年齢
teaching:
  hi.a1.unit02.lesson01.teach.shoonya:
    title: ゼロ
    gloss: ゼロ
    note: このユニットのすべての数の出発点です。
    example_gloss: 今日の気温はゼロ度です。
  hi.a1.unit02.lesson01.teach.ek:
    title: 一
    gloss: 一
    note: 日本語では「十一」「二十」のように「十+一」の形で規則的に作れますが、ヒンディー語の11〜99はそれぞれが独立した単語です。レッスン2で見るように、बीस(20)や तीस(30)には एक(1)や दो(2)と共通する部分が見当たりません。
    example_gloss: 本を1冊持っています。
  hi.a1.unit02.lesson01.teach.do:
    title: 二
    gloss: 二
    note: よく使うシンプルな数です。くだけた命令形の「ちょうだい」(与える)にもなりますが、文脈で意味ははっきり分かります。
    example_gloss: 兄弟が2人います。
  hi.a1.unit02.lesson01.teach.teen:
    title: 三
    gloss: 三
    note: '*Chahiye*(「必要である」)はよく使われる非人称構文です。*mujhe teen seb chahiye* は直訳すると「私に、りんご3つが必要」で、「私は〜が必要です」を表す自然な言い方です。'
    example_gloss: りんごが3つ必要です。
  hi.a1.unit02.lesson01.teach.chaar:
    title: 四
    gloss: 四
    note: 不規則なところはありません。chaar は他の小さい数と同じように使えます。
    example_gloss: 私には友達が4人います。
  hi.a1.unit02.lesson01.teach.paanch:
    title: 五
    gloss: 五
    note: アヌスワーラ(点)ではなくチャンドラビンドゥを使って पाँच と書きます。ा の母音記号は文字の上に出ないため、ただの点ではなくチャンドラビンドゥが必要になります。ユニット1の हाँ/कहाँ と同じパターンです。
    example_gloss: 私は5ルピー持っています。
  hi.a1.unit02.lesson01.teach.chhah:
    title: 六
    gloss: 六
    note: 古い文献では छः と綴られることもありますが、現代の標準的な綴りは छह です。
    example_gloss: 本を6冊持っています。
  hi.a1.unit02.lesson01.teach.saat:
    title: 七
    gloss: 七
    note: 曜日の話をするときに便利な数です。
    example_gloss: 1週間は7日です。
  hi.a1.unit02.lesson01.teach.aath:
    title: 八
    gloss: 八
    note: 不規則なところはありません。aath は他の小さい数と同じように使えます。
    example_gloss: この部屋にはいすが8脚あります。
  hi.a1.unit02.lesson01.teach.nau:
    title: 九
    gloss: 九
    note: 前後の数と違って、ここには鼻音化の記号は必要ありません。
    example_gloss: ヨガのクラスは朝9時に始まります。
  hi.a1.unit02.lesson01.teach.das:
    title: 十
    gloss: 十
    note: 最初のまとまりの最後の数です。レッスン2では十いくつと十の位に進みますが、ここから先は規則的に予測できなくなります。
    example_gloss: 私の両手には指が10本あります。
  hi.a1.unit02.lesson02.teach.gyaarah:
    title: 十一
    gloss: 十一
    note: ここから先、ヒンディー語の数はそれぞれが不規則な独立した単語です。日本語の「十一」のように gyaarah の中に das(10)や ek(1)が見えるわけではありません。近道はなく、一つずつ覚える必要があります。
    example_gloss: このクラスには生徒が11人います。
  hi.a1.unit02.lesson02.teach.baarah:
    title: 十二
    gloss: 十二
    note: これも単純に暗記する数です。do(2)と結びつく規則的なパターンはありません。
    example_gloss: 1年は12か月です。
  hi.a1.unit02.lesson02.teach.pandrah:
    title: 十五
    gloss: 十五
    note: 15分の休憩など、短い時間を言うときによく使います。
    example_gloss: 15分必要です。
  hi.a1.unit02.lesson02.teach.bees:
    title: 二十
    gloss: 二十
    note: das(10)と do(2)を組み合わせたものではなく、まったく新しい単語です。これ以降の十の位もすべてこのパターンが続きます。
    example_gloss: 私の妹は20歳です。
  hi.a1.unit02.lesson02.teach.tees:
    title: 三十
    gloss: 三十
    note: これも独立した単語です。teen(3)に少し似ていますが、teen と das から作れるわけではないので、別の単語として覚えましょう。
    example_gloss: チケットは30ルピーです。
  hi.a1.unit02.lesson02.teach.pachaas:
    title: 五十
    gloss: 五十
    note: 特に値段でとてもよく使われる、区切りのよい数です。
    example_gloss: 私は50ルピー持っています。
  hi.a1.unit02.lesson02.teach.sau:
    title: 百
    gloss: '100'
    note: きりのよい数で、日常の値段で非常によく使われます。
    example_gloss: この本は100ルピーです。
  hi.a1.unit02.lesson02.teach.keemat:
    title: 値段
    gloss: 値段
    note: '*Keemat* は女性名詞です。値段をつける物が何であっても、所有を表す語は必ず女性形になります(*iski keemat*「その値段」)。'
    example_gloss: このチケットの値段はいくらですか?
  hi.a1.unit02.lesson02.teach.rupaye:
    title: ルピー
    gloss: ルピー
    note: '*Rupaya* は単数形で、ちょうど1ルピーのときに使います。それより大きい金額には *rupaye* を使います。'
    example_gloss: これは50ルピーです。
  hi.a1.unit02.lesson02.teach.iski_keemat_kya_hai:
    title: 値段をたずねる
    gloss: その値段はいくらですか?
    note: '*Iski*(「その」)は、実際に値段をつけている物ではなく、女性名詞 *keemat*(「値段」)に合わせた形です。ユニット1の *mera naam* で出てきた所有の一致と同じパターンです。'
  hi.a1.unit02.lesson02.teach.iski_keemat_pachaas_rupaye_hai:
    title: 値段を言う
    gloss: その値段は50ルピーです。
    note: Iski keemat kya hai? に対する、文の形での自然な答えです。
  hi.a1.unit02.lesson03.teach.aapka_phone_number_kya_hai:
    title: 丁寧に電話番号をたずねる
    gloss: お電話番号は何番ですか?(丁寧)
    note: '*Number*(नंबर)は英語から入った外来語で、日常のヒンディー語でしょっちゅう使われます。*Aapka* は男性名詞 *number* に合わせた形です。'
  hi.a1.unit02.lesson03.teach.tumhara_phone_number_kya_hai:
    title: くだけた言い方で電話番号をたずねる
    gloss: 電話番号は何番?(くだけた言い方)
    note: 友達や同年代の人と話すときは aapka の代わりに tumhara を使います。ユニット1と同じパターンです。
  hi.a1.unit02.lesson03.teach.mera_number:
    title: 番号を言う前の導入
    gloss: 私の番号は…です。
    note: 数字を一つずつ読み上げる前の、自然な切り出し方です。
  hi.a1.unit02.lesson03.teach.sample_number:
    title: 電話番号の例
    gloss: 6、2、8、3、5。
    note: ヒンディー語の電話番号も日本語と同じく一桁ずつ読みます。ここに出てくる数字はすべてレッスン1で習ったものです。
  hi.a1.unit02.lesson03.teach.aapki_umra_kya_hai:
    title: 丁寧な言い方で年齢をたずねる
    gloss: おいくつですか?(丁寧)
    note: '*Umra*(「年齢」)は女性名詞なので、*aapki* も女性形になります。*iski keemat* と同じ一致のパターンを、値段ではなく人の年齢に使っています。'
  hi.a1.unit02.lesson03.teach.tumhari_umra_kya_hai:
    title: くだけた言い方で年齢をたずねる
    gloss: おいくつ?(くだけた言い方)
    note: 友達や同年代の人と話すときは aapki の代わりに tumhari を使います。
  hi.a1.unit02.lesson03.teach.meri_umra_tees_saal_hai:
    title: 自分の年齢を言う
    gloss: 私は30歳です。
    note: '*Meri* は(女性名詞の)*umra* に合わせた形で、話し手自身の性別には影響されません。ユニット1で習った動詞の *chahta/chahti* の形とは違い、この所有を表す語は誰が話しても変わりません。'
  hi.a1.unit02.lesson03.teach.dialogue.line01:
    title: アルジュンがプリヤに電話番号をたずねる
    gloss: アルジュンがプリヤに、くだけた言い方で電話番号をたずねます。
    note: このレッスンで習った、くだけた電話番号の質問がそのまま出てきます。
  hi.a1.unit02.lesson03.teach.dialogue.line02:
    title: プリヤが番号を伝えて、たずね返す
    gloss: プリヤが電話番号を一桁ずつ読み上げ、アルジュンの番号をたずねます。
    note: ここの数字はすべてこのユニットのレッスン1で習ったものです。
  hi.a1.unit02.lesson03.teach.dialogue.line03:
    title: アルジュンが番号を伝える
    gloss: アルジュンが自分の電話番号を読み上げます。
    note: ここでも、数字はすべてレッスン1の語彙の再利用です。
  hi.a1.unit02.lesson03.teach.dialogue.line04:
    title: プリヤがアルジュンの年齢をたずねる
    gloss: プリヤがお礼を言って、くだけた言い方で年齢をたずねます。
    note: Shukriya(「ありがとう」)は、ユニット1の shukriya のカードと同じく、丁寧さの度合いで形が変わりません。
  hi.a1.unit02.lesson03.teach.dialogue.line05:
    title: アルジュンが年齢を答えて、たずね返す
    gloss: アルジュンは20歳だと答え、プリヤの年齢をたずね返します。
    note: Tumhari? だけで、質問を返す短くて自然な言い方になります。
  hi.a1.unit02.lesson03.teach.dialogue.line06:
    title: プリヤが年齢を答える
    gloss: プリヤは30歳だと言います。
    note: Meri umra tees saal hai は、このレッスンで先に習った文型そのままです。
  hi.a1.unit02.lesson03.teach.dialogue.line07:
    title: アルジュンが会話を締めくくる
    gloss: アルジュンは前向きに反応し、また会おうと言います。
    note: Accha と phir milenge は、どちらもユニット1の別れのあいさつの語彙の再利用です。
  hi.a1.unit02.lesson03.teach.dialogue.line08:
    title: プリヤが会話を締めくくる
    gloss: プリヤは了解して、気軽に「またね」と言います。
    note: Theek hai と phir milte hain は、どちらもユニット1の別れのあいさつの語彙の再利用です。
