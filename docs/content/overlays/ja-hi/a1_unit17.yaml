teaching:
  hi.a1.unit17.lesson01.teach.tum_tumhara_kya_review:
    title: 復習:あなた、あなたの、何
    gloss: あなた(くだけた言い方)、あなたの(くだけた言い方)、何
    note: 友だちに仕事を尋ねるために必要な単語の簡単な復習です。
    example_gloss: お名前は何ですか?
  hi.a1.unit17.lesson01.teach.arjun_priya_review:
    title: 復習:アルジュン、プリヤ
    gloss: アルジュン、プリヤ
    note: このレッスンでは性別に合わせた質問の軸として二人を使うので、先に二人の名前をおさらいします。
    example_gloss:
    - 私の名前はアルジュンです。
    - 私の名前はプリヤです。
  hi.a1.unit17.lesson01.teach.copula_review:
    title: 復習:私、(私は)〜です、(彼・彼女は)〜です、(あなたは)〜です
    gloss: 私、(私は)〜です、(彼・彼女は)〜です、(くだけた言い方のあなたは)〜です
    note: このユニットの「〜は…です」の文に必要な、小さな「です」のセットです。
    example_gloss:
    - 大丈夫ですか?
    - 私は大丈夫です。
  hi.a1.unit17.lesson01.teach.kaam_review:
    title: 復習:仕事
    gloss: 仕事
    note: ユニット10・11で学習済みの単語で、ここではユニット全体のテーマの単語として再び使います。
    example_gloss: 私は仕事があります。
  hi.a1.unit17.lesson01.teach.karte_karti_karta_verb:
    title: する(男性のあなた/女性のあなた/男性の私)
    gloss: する(男性へのくだけた言い方)、する(女性へのくだけた言い方)、する(男性の私)
    note: ユニット10で学んだ -ta/-ti/-te の一致のルール(ユニット1の *kya tum yog karti ho?* にも出てきました)を、動詞 *karna*(する)に広げます。
    example_gloss:
    - お仕事は何をしていますか?
    - 私は朝食をとります。
  hi.a1.unit17.lesson01.teach.tum_kya_kaam_karte_ho_phrase:
    title: どんなお仕事をしていますか?(男性に)
    gloss: どんな仕事をしていますか?
    note: このレッスンの最初の質問で、男性の友だちに向けたものです。
  hi.a1.unit17.lesson01.teach.tum_kya_kaam_karti_ho_phrase:
    title: どんなお仕事をしていますか?(女性に)
    gloss: どんな仕事をしていますか?
    note: 同じ質問を女性の友だちに向けたものです。変わるのは動詞の語尾だけです。
  hi.a1.unit17.lesson01.teach.shikshak_shikshika:
    title: 教師(男性/女性)
    gloss: 教師(男性)、教師(女性)
    note: 新しい職業名のペアです。これまでの多くの名詞と違い、この名詞は話し手自身の性別によって変わります。このレッスンの文法ノートを見てください。
    example_gloss:
    - 私は教師です(男性)。
    - 私は教師です(女性)。
  hi.a1.unit17.lesson01.teach.grammar_occupation_gender:
    title: Mein + 職業 + hoon
    gloss: '''Mein + 職業 + hoon'' で職業を言います。ユニット1と同じ ''mein...hoon'' の型です。職業には、話し手自身の性別によって変わるものがあります。''shikshak''(男性)、''shikshika''(女性)で、ユニット10で動詞の語尾 -ta/-ti が変わったのと同じです。''Doctor'' と ''engineer'' は変わりません。どちらの性別でも同じ単語です。'
    note: 練習問題で使う前に、性別によって変わる名詞と変わらない外来語の2種類があることをはっきり示します。
  hi.a1.unit17.lesson01.teach.doctor_review:
    title: 復習:医者
    gloss: 医者
    note: ユニット16で学習済みの単語で、ここでは性別によって変わらない職業として再び使います。
    example_gloss: 彼/彼女は医師です。
  hi.a1.unit17.lesson01.teach.mein_doctor_hoon_phrase:
    title: 私は医師です。
    gloss: 私は医師です。
    note: 復習の単語に「〜は…です」の型を当てはめます。
  hi.a1.unit17.lesson01.teach.engineer:
    title: エンジニア
    gloss: エンジニア
    note: 新しい職業名で、*doctor*(医師)と同じく性別によって変わりません。
    example_gloss: 彼/彼女はエンジニアです。
  hi.a1.unit17.lesson01.teach.mein_engineer_hoon_phrase:
    title: 私はエンジニアです。
    gloss: 私はエンジニアです。
    note: このレッスンの2つ目の新しい職業に「〜は…です」の型を当てはめます。
  hi.a1.unit17.lesson02.teach.kahan_review:
    title: 復習:どこ
    gloss: どこ
    note: ユニット1で学習済みの単語で、ここでは職場を尋ねるために再び使います。
    example_gloss: 病院はどこですか?
  hi.a1.unit17.lesson02.teach.mein_review:
    title: 復習:〜で/〜に(場所)
    gloss: 〜で / 〜に
    note: ユニット1で学習済みの単語で、ここでは職場を言うために再び使います。
    example_gloss: 私はロンドンに住んでいます。
  hi.a1.unit17.lesson02.teach.tum_kahan_kaam_karte_ho_phrase:
    title: どこで働いていますか?(男性に)
    gloss: どこで働いていますか?
    note: このレッスンの最初の質問で、男性の友だちに向けたものです。
  hi.a1.unit17.lesson02.teach.tum_kahan_kaam_karti_ho_phrase:
    title: どこで働いていますか?(女性に)
    gloss: どこで働いていますか?
    note: 同じ質問を女性の友だちに向けたものです。
  hi.a1.unit17.lesson02.teach.school_review:
    title: 復習:学校
    gloss: 学校
    note: ユニット8で学習済みの単語で、このレッスン最初の職場です。
    example_gloss: 私は学校で働いています(女性の話し手)。
  hi.a1.unit17.lesson02.teach.mein_school_mein_kaam_karti_hoon_phrase:
    title: 私は学校で働いています。
    gloss: 私は学校で働いています。
    note: 職場を言う型を学校に当てはめた、女性形の文です。
  hi.a1.unit17.lesson02.teach.hospital_review:
    title: 復習:病院
    gloss: 病院
    note: ユニット8で学習済みの単語で、このレッスン2つ目の職場です。職業の「医師」と組み合わせます。
    example_gloss: 医師は病院で働いています。
  hi.a1.unit17.lesson02.teach.daftar:
    title: 事務所
    gloss: オフィス
    note: 新しい名詞で、このレッスン3つ目の職場です。職業の「エンジニア」と組み合わせます。
    example_gloss: 私は会社(オフィス)で働いています(男性の話し手)。
  hi.a1.unit17.lesson02.teach.mein_daftar_mein_kaam_karta_hoon_phrase:
    title: 私はオフィスで働いています。
    gloss: 私はオフィスで働いています。
    note: 職場を言う型をオフィスに当てはめた、男性形の文です。
  hi.a1.unit17.lesson02.teach.grammar_workplace:
    title: 場所 + mein + kaam karta/karti hoon
    gloss: '''[場所] + mein + kaam karta/karti hoon'' は、すでに知っている3つの部品を組み合わせたものです。''mein''(ユニット1の ''London mein rehta hoon'')、''kaam''(ユニット10・11)、そして ''karna'' の -ta/-ti/-te の形(ユニット10の ''nashta karta hoon'' と、ユニット1の ''kya tum yog karti ho?'')です。新しい文法ではなく、3つを初めて1つの文にまとめたものです。'
    note: 組み合わせる前に、学習済みの部品をユニット番号つきで示します。これまでの文法ノートと同じ進め方です。
  hi.a1.unit17.lesson03.teach.roz_review:
    title: 復習:毎日
    gloss: 毎日
    note: ユニット10で学習済みの単語で、ここでは毎日の仕事の習慣を表すために再び使います。
    example_gloss: 私は毎日働いています。
  hi.a1.unit17.lesson03.teach.jaana_forms_review:
    title: 復習:行く(女性のあなた/男性のあなた/男性の私)
    gloss: 行く(女性へのくだけた言い方)、行く(男性へのくだけた言い方)、行く(男性の私)
    note: ユニット10で最初に示した *jana*(行く)の -ta/-ti/-te の形で、ここでは毎日の通勤に再び使います。
    example_gloss:
    - 私は毎日学校に行きます(女性の話し手)。
    - 毎日オフィスに行きますか?(男性に)
  hi.a1.unit17.lesson03.teach.bhi_haan_review:
    title: 復習:〜も、はい
    gloss: 〜も、はい
    note: どちらも学習済み(ユニット1、およびユニット1・6・13)で、このレッスンの会話で再び使います。
    example_gloss: はい、私もそれが気に入りました。
  hi.a1.unit17.lesson03.teach.dialogue.line01:
    title: アルジュンがプリヤに仕事を尋ねる
    gloss: プリヤ、どんな仕事をしているの?
  hi.a1.unit17.lesson03.teach.dialogue.line02:
    title: プリヤが学校の教師だと話す
    gloss: 私は教師です。学校で働いています。
  hi.a1.unit17.lesson03.teach.dialogue.line03:
    title: アルジュンが毎日学校に行くのかを尋ねる
    gloss: そうなんだ!毎日学校に行くの?
  hi.a1.unit17.lesson03.teach.dialogue.line04:
    title: プリヤが答えて、アルジュンに同じ質問をする
    gloss: ええ、毎日学校に行きます。あなたはどんな仕事をしているの?
  hi.a1.unit17.lesson03.teach.dialogue.line05:
    title: アルジュンがオフィスで働くエンジニアだと話す
    gloss: 僕はエンジニアです。オフィスで働いています。
  hi.a1.unit17.lesson03.teach.dialogue.line06:
    title: プリヤが彼も毎日オフィスに行くのかを尋ねる
    gloss: すごいね!あなたも毎日オフィスに行くの?
  hi.a1.unit17.lesson03.teach.dialogue.line07:
    title: アルジュンが答える
    gloss: うん、毎日オフィスに行くよ。
  hi.a1.unit17.lesson03.teach.dialogue.line08:
    title: プリヤがお礼を言う
    gloss: わかった、ありがとう。
  hi.a1.unit17.lesson03.teach.grammar_summary:
    title: 3つの主なルール
    gloss: このユニットの3つの主なルールです。(1)'mein + 職業 + hoon' で職業を言います(例:'mein shikshika hoon')。職業には話し手自身の性別によって変わるものがあります。(2)'[場所] + mein + kaam karta/karti hoon' で職場を言います(例:'mein daftar mein kaam karta hoon')。(3)'roz [場所] jata/jati hoon' で毎日の習慣を言います。ユニット10と同じ -ta/-ti のルールです。
    note: ユニット全体の文法をまとめる総括ノートです。ユニット15・16の、活用をまとめた文法ノートと同じ形です。
  hi.a1.unit17.lesson03.teach.work_profile_reading:
    title: 短いプロフィールを読む
    gloss: プリヤは教師です。学校で働いています。アルジュンはエンジニアです。オフィスで働いています。
    note: 会話ですでに出た事実だけを、新しい話の枠組みなしにそのまま述べた短いプロフィールです。「仕事のプロフィールを読む」という目標に合っています。
    glosses:
      शिक्षिका: 教師(女性)
      स्कूल: 学校
      काम: 仕事
      करती: する/働く(女性形、करना の変化形)
      इंजीनियर: エンジニア
      दफ़्तर: オフィス
      करता: する/働く(男性形、करना の変化形)
