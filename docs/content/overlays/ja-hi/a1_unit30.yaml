teaching:
  hi.a1.unit30.lesson01.teach.parhna_kasrat_karna:
    title: 読書、運動、料理
    gloss: 読む、運動する／スポーツをする、料理する
    note: ヒンディー語では、趣味を *-ना* で終わる動詞で表します：*पढ़ना*、*कसरत करना*、*खाना बनाना*(「読書する」「運動する」「料理する」)。
    example_gloss:
    - 私は本を読むのが好きです。
    - 私は土曜日に運動します。
    - 私は友達のために料理するのが好きです。
  hi.a1.unit30.lesson01.teach.khalee_samay:
    title: 自由時間
    gloss: 空いている時間
    note: '*खाली समय*(直訳は「空いた時間」)は趣味を話すときの重要な表現で、*में* が「に」を表します：*खाली समय में*。'
    example_gloss: 私は自由時間に読書をするのが好きです。
  hi.a1.unit30.lesson01.teach.mujhe_khalee_samay:
    title: 自由時間にすることを伝える
    gloss: 私は自由時間に読書をするのが好きです。
    note: '*मुझे ... पढ़ना पसंद है*(直訳「私には読むことが好まれている」)が、ヒンディー語で「私は読書が好きです」と言う形です。*मुझे* が好きな人を表します。'
  hi.a1.unit30.lesson02.teach.sangeet_sunna_chitr:
    title: 音楽、絵、ゲーム
    gloss: 音楽を聴く、絵を描く、ゲームをする
    note: さらに三つの趣味です：*संगीत सुनना*、*चित्र बनाना*、*गेम खेलना*。*गेम* は英語からの借用語です。
    example_gloss:
    - 私は音楽を聴くのが好きです。
    - 私はよく絵を描きます。
    - 私は友達とゲームをするのが好きです。
  hi.a1.unit30.lesson02.teach.mujhe_sangeet_sunna:
    title: 音楽を聴くのが好きだと伝える
    gloss: 私は音楽を聴くのが好きです。
    note: '*संगीत सुनना*(「音楽を聞く」)には、助詞などの余計な語は要りません。目的語がそのまま動詞の前に来ます。'
  hi.a1.unit30.lesson02.teach.mujhe_doston_ke:
    title: 友達とゲームをするのが好きだと伝える
    gloss: 私は友達とゲームをするのが好きです。
    note: '*दोस्तों के साथ*(「友達と」)では、*के साथ* の前に来るため、*दोस्त* が斜格の複数形(*दोस्तों*)になります。'
  hi.a1.unit30.lesson03.teach.hamesha_aksar_kabheekbhee:
    title: いつも、よく、ときどき、決して～ない
    gloss: いつも、よく、ときどき、決して～ない
    note: '*हमेशा*、*अक्सर*、*कभी-कभी*、*कभी नहीं* などの頻度を表す語は、ふつう動詞の前に置かれます。*कभी नहीं* は「決して…ない」という意味です。'
    example_gloss:
    - 私は毎週土曜日に運動します。
    - 私はよく本を読みます。
    - 私はときどき絵を描きます。
    - 私はゲームをまったくしません。
  hi.a1.unit30.lesson03.teach.har_hafte_har:
    title: 毎週、毎週末
    gloss: 毎週、毎週末
    note: '*हर*(「毎…」)は形が変わらず、その後ろの時を表す語も基本の形のままです：*हर हफ़्ते*、*हर वीकेंड*。'
    example_gloss:
    - 私は毎週、友達のために料理をします。
    - 私は毎週末、運動します。
  hi.a1.unit30.lesson03.teach.har_hafte_har_2:
    title: हर は形が変わらない
    gloss: 毎週、毎週末。
    note: '*हर* は後ろにどんな名詞が来ても形が変わらないので、選ぶ形はありません：*हर हफ़्ते*、*हर वीकेंड*。'
  hi.a1.unit30.lesson03.teach.tum_khalee_samay:
    title: 余暇の過ごし方を尋ねる
    gloss: 自由時間には何をしますか？
    note: これはこのユニットの中心となる質問です。相手の趣味を尋ねるときに使ってみましょう。
  hi.a1.unit30.lesson04.teach.priya_ham_aksar:
    title: プリヤが趣味の話を切り出す
    gloss: プリヤ：私たちはよく一緒に散歩するよね。ところでアルジュン、あなたは暇な時間にほかに何をするの？
    note: 主語が *हम*(「私たち」)なので *टहलते हैं* は複数形になり、*अक्सर* は動詞の前に置かれます。
  hi.a1.unit30.lesson04.teach.arjun_mujhe_khana:
    title: アルジュンの趣味
    gloss: アルジュン：僕は料理が好きなんだ、家でもね。それに、よく運動もするよ。
    note: '*घर पर भी*(「家でも」)から、アルジュンが仕事だけでなく楽しみとしても料理をしていることが分かります。'
  hi.a1.unit30.lesson04.teach.priya_tum_ghar:
    title: プリヤが驚く
    gloss: プリヤ：家でも料理するの？仕事で一日中料理してるじゃない！
    note: '*पूरा दिन*(「一日中」)は、仕事ですでにたくさん料理していることを強調し、*तो* が強調を加えます。'
  hi.a1.unit30.lesson04.teach.arjun_han_lekin:
    title: アルジュンが説明する
    gloss: アルジュン：うん、でも料理をすると心が落ち着くんだ。君は何をするのが好き？
    note: '*खाना बनाने से सुकून मिलता है* は「料理をすると落ち着く」という意味です(直訳は「料理から安らぎが得られる」)。*से* の前で *बनाना* は *बनाने* になります。'
  hi.a1.unit30.lesson04.teach.priya_mujhe_parhna:
    title: プリヤの趣味
    gloss: プリヤ：私は読書が好きで、よく音楽を聞くよ。
    note: '*और*(「と」「そして」)が二つの趣味をつなぎ、話し手がプリヤなので *सुनती हूँ* は女性形です。'
  hi.a1.unit30.lesson04.teach.arjun_kya_tum:
    title: アルジュンがゲームについて尋ねる
    gloss: アルジュン：ゲームもするの？
    note: 短いはい・いいえ疑問文です。*क्या* で始まり、アルジュンがプリヤに尋ねているので *खेलती हो* は女性形です。
  hi.a1.unit30.lesson04.teach.priya_naheen_main:
    title: プリヤが答える
    gloss: プリヤ：ううん、ゲームは全然しないの。でも、ときどき絵は描くよ！
    note: '*कभी ... नहीं*(「決して…ない」)と *कभी-कभी*(「ときどき」)が、一つの答えの中で対比されています。'
  hi.a1.unit30.lesson05.teach.arjun_aur_main:
    title: 趣味を比べる
    gloss: アルジュンと私はよく一緒に散歩します。でも、ほかにも趣味があります。アルジュンは料理が好きで、家でもします。それに、よく運動もします。私は読書が好きで、よく音楽を聞きます。ときどき絵を描きますが、ゲームは決してしません。あなたは暇な時間に何をするのが好きですか？
    note: プリヤのメッセージはこれまでのレッスンの内容を振り返り、最後に読み手へこのユニットの中心となる質問を投げかけています。
    glosses:
      टहलते: 散歩する
      अक्सर: よく
      साथ: 一緒に
      और: ほかの
      बनाना: 作ること(料理)
      पसंद: ～するのが好き
      घर: 家で
      कसरत: 運動する
      पढ़ना: 読む
      सुनती: 聴く
      संगीत: 音楽
      चित्र: 絵(を描くこと)
      कभी-कभी: 時々
      गेम: ビデオゲームをする
      कभी: 決して(नहीं と一緒に)
      खाली: 自由な
      समय: 時間
  hi.a1.unit30.lesson06.teach.arjun_tum_is:
    title: アルジュンが週末の予定を尋ねる
    gloss: アルジュン：今週末は何をするの？
    note: '*इस वीकेंड*(「今週末」)では *इस* が名詞の前に来ます。*कर रही हो* は進行中の「しているところ」を表す形で、プリヤに話しかけているので女性形です。'
  hi.a1.unit30.lesson06.teach.priya_abhee_pata:
    title: プリヤはまだ決めていない
    gloss: プリヤ：まだ分からないの。読書は好きだけど、外にも出かけたいな。
    note: '*बाहर जाना चाहती हूँ* は「外に出かけたい」という意味です。*चाहती* は女性形で、*जाना* の後ろに来ます。'
  hi.a1.unit30.lesson06.teach.arjun_chalo_sath:
    title: アルジュンが計画を提案する
    gloss: アルジュン：一緒に散歩しない？そのあと、僕が二人のために料理するよ。
    note: '*उसके बाद*(「そのあと」)が二つの予定の順序を示し、*चलो ... टहलें* が最初の予定を提案しています。'
  hi.a1.unit30.lesson06.teach.priya_achchha_aidiya:
    title: プリヤが賛成する
    gloss: プリヤ：いいね！散歩も料理も、どっちも好き。
    note: '*दोनों पसंद हैं* から、プリヤが両方を同じように好きだと分かります。動詞は複数形の *हैं* です。'
  hi.a1.unit30.lesson06.teach.arjun_barhiya_to:
    title: アルジュンが約束を確認する
    gloss: アルジュン：いいね。じゃあ、土曜日に会おう！
    note: '*शनिवार को मिलते हैं*(「土曜日に会う」)は、決まった予定に現在形を使っています。*को* が曜日を表します。'
