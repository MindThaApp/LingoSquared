teaching:
  hi.a1.unit04.lesson01.teach.baje:
    title: 〜時
    gloss: 〜時（2時以上）
    note: 1時を除くすべての時刻に使います。*1時*の特別な形はこのレッスンの後半で出てきます。
    example_gloss: 今、5時です。
  hi.a1.unit04.lesson01.teach.abhi:
    title: 今
    gloss: 今
    note: 現在の時刻を言うときによく使う、シンプルな時の言葉です。
    example_gloss: 今、10時です。
  hi.a1.unit04.lesson01.teach.ek_do_teen:
    title: 1、2、3
    gloss: 1、2、3
    note: 第2課で出てきた数ですが、ここでは時刻を言うのに必要です。*ek* は特別な *baja* を取り、*do* と *teen* は普通の *baje* を取ることに注意しましょう。
    example_gloss:
    - 今、1時です。
    - 今、2時です。
    - 今、3時です。
  hi.a1.unit04.lesson01.teach.chaar_paanch_chhah:
    title: 4、5、6
    gloss: 4、5、6
    note: 第2課で出てきた数です。3つとも普通の *baje* を取ります。
    example_gloss:
    - 今、4時です。
    - 今、5時です。
    - 今、6時です。
  hi.a1.unit04.lesson01.teach.saat_aath_nau:
    title: 7、8、9
    gloss: 7、8、9
    note: 第2課で出てきた数です。
    example_gloss:
    - 今、7時です。
    - 今、8時です。
    - 今、9時です。
  hi.a1.unit04.lesson01.teach.das_gyaarah_baarah:
    title: 10、11、12
    gloss: 10、11、12
    note: 第2課で出てきた数です。時刻に必要な数は、これで最後です。
    example_gloss:
    - 今、10時です。
    - 今、11時です。
    - 今、12時です。
  hi.a1.unit04.lesson01.teach.baja_grammar_note:
    title: Baja と baje
    gloss: '*Baja* は *1* に付き、*baje* はそれ以外のすべての数に付きます:*ek baja hai*、*do baje hain*。'
    note: これは簡略化ではなく、本当に守るべき一致の例外です。*ek baja hai* は、単数形を使う唯一の時刻です。
  hi.a1.unit04.lesson01.teach.kitne_baje_hain:
    title: 時間をたずねる
    gloss: 何時ですか?
    note: 直訳すると「いくつの時になっていますか」で、時刻をたずねる標準的な言い方です。
  hi.a1.unit04.lesson01.teach.abhi_paanch_baje_hain:
    title: 時刻の伝え方
    gloss: 今、5時です。
    note: '*Kitne baje hain?* に対する、文の形での自然な答え方です。'
  hi.a1.unit04.lesson02.teach.yoga_class_reprise:
    title: ヨガクラス
    gloss: ヨガのクラス
    note: 第1課で出てきた言葉で、このレッスンでは予定を言うときの例として使います。
    example_gloss: ヨガのクラスは今日です。
  hi.a1.unit04.lesson02.teach.subah:
    title: 朝
    gloss: 朝
    note: このレッスンで学ぶ4つの時間帯の言葉の1つです。
    example_gloss: ヨガのクラスは朝です。
  hi.a1.unit04.lesson02.teach.dopahar:
    title: 午後・正午
    gloss: 午後、正午
    note: 真昼（正午）と、昼過ぎの午後の両方を表します。
    example_gloss: 午後はクラスがありません。
  hi.a1.unit04.lesson02.teach.shaam:
    title: 夕方
    gloss: 夕方
    note: '*dopahar* のあと、*raat* の前の時間帯です。'
    example_gloss: 次のクラスは夕方5時です。
  hi.a1.unit04.lesson02.teach.raat:
    title: 夜
    gloss: 夜
    note: 4つの時間帯の言葉のうち、最後の1つです。
    example_gloss: 夜はクラスがありません。
  hi.a1.unit04.lesson02.teach.ko_reprise:
    title: 一般的な時間帯を表す Ko
    gloss: 具体的な時刻を言わないときは、時間帯の言葉に *ko* を付けます：*dopahar ko*、*raat ko*。
    note: 曜日を表す *ko*（第3課）と同じ ko が、今度は大まかな時間帯を表しています。これは自然な表現ですが、このレッスンで学ぶ唯一の形ではありません（具体的な時刻の形は次のノートを見てください）。
  hi.a1.unit04.lesson02.teach.time_of_day_baje_note:
    title: 時間帯の言葉は baje の直前に置く
    gloss: 具体的な時刻を言うときは、時間帯の言葉を *baje* の直前に置き、間に何も入れません：*subah saat baje*、*shaam paanch baje*。
    note: ここでは *ko* を付けません。ko は、具体的な時刻のない大まかな時間帯に使うもので、前のノートで説明したとおりです。
  hi.a1.unit04.lesson02.teach.class_kitne_baje_hai:
    title: クラスの時間をたずねる
    gloss: クラスは何時ですか。
    note: 第1課の *kitne baje* と同じ型ですが、今回は現在の時刻ではなく、予定の時間をたずねています。
  hi.a1.unit04.lesson02.teach.class_subah_saat_baje_hai:
    title: 予定の時間を言う
    gloss: クラスは朝7時です。
    note: 上の文法ノートのとおり、*subah* を *saat baje* の直前に置いています。
  hi.a1.unit04.lesson03.teach.kal:
    title: 明日・昨日
    gloss: 明日、昨日
    note: ヒンディー語では、どちらも同じ1つの言葉で表します。どちらの意味かは文脈（と動詞の時制）で分かります。このレッスンでは、いつも「明日」の意味です。
    example_gloss: 明日のクラスは夕方5時です。
  hi.a1.unit04.lesson03.teach.agli_reprise:
    title: 次の
    gloss: 次の
    note: ユニット3で既習です。女性形で、女性名詞の*クラス*に合わせた形です。
    example_gloss: 次のクラスは明日です。
  hi.a1.unit04.lesson03.teach.theek_hai_shukriya_reprise:
    title: わかりました、ありがとう
    gloss: わかりました、ありがとう！
    note: ユニット1の別れのあいさつの語彙から、両方の単語を再利用しています。
  hi.a1.unit04.lesson03.teach.milte_hain_reprise:
    title: また会いましょう
    gloss: また会いましょう
    note: ユニット3の最後の別れのあいさつを再利用し、今回は *kal* と組み合わせて「また明日」の意味にしています。
  hi.a1.unit04.lesson03.teach.agli_class_kitne_baje_hai:
    title: 次の授業の時間をたずねる
    gloss: 次の授業は何時ですか?
    note: '*agli*(女性形で、「クラス」に合わせた形)と、このユニットの *kitne baje* の型を組み合わせています。'
  hi.a1.unit04.lesson03.teach.agli_class_shaam_paanch_baje_hai:
    title: 次の授業の時間を言う
    gloss: 次のクラスは夕方5時です。
    note: 上の質問に対する、自然な文での答えです。
  hi.a1.unit04.lesson03.teach.kal_milte_hain:
    title: 明日会う約束で締めくくる
    gloss: わかりました、また明日!
    note: 時間が決まったあとに会話を締めくくる、自然な言い方です。
  hi.a1.unit04.lesson03.teach.dialogue.line01:
    title: アルジュンが次の授業についてたずねる
    gloss: アルジュンは次の授業が何時かたずねます。
    note: このレッスンの質問をそのまま再利用しています。
  hi.a1.unit04.lesson03.teach.dialogue.line02:
    title: プリヤが時間を伝える
    gloss: プリヤは次の授業は夕方5時だと言います。
    note: このレッスンの答えの文をそのまま再利用しています。
  hi.a1.unit04.lesson03.teach.dialogue.line03:
    title: アルジュンがお礼を言う
    gloss: アルジュンは「わかりました、ありがとう」と言います。
    note: ユニット1の語彙の再利用です。
  hi.a1.unit04.lesson03.teach.dialogue.line04:
    title: プリヤが会話を締めくくる
    gloss: プリヤは了解して、また明日と言います。
    note: このレッスンの締めの一言をそのまま再利用しています。
