teaching:
  hi.a1.unit16.lesson01.teach.tum_ho_review:
    title: 復習：あなた、元気、いる／です
    gloss: あなた（親しい相手）、元気／大丈夫、いる／です
    note: 友達の体調をたずねるのに必要な言葉の簡単な復習です。
    example_gloss: お元気ですか。
  hi.a1.unit16.lesson01.teach.mujhe_hai_review:
    title: 復習：私に、ある／です
    gloss: 私に／私にとって、ある／です
    note: このレッスンの「症状」の言い方を作るのに必要な「ある／です」にあたる動詞です。
    example_gloss: 私は用事があります。
  hi.a1.unit16.lesson01.teach.tum_theek_ho_phrase:
    title: 大丈夫？
    gloss: 大丈夫？
    note: このユニットの最初の質問で、友達の様子を気づかうときに使います。
  hi.a1.unit16.lesson01.teach.main_hoon_nahin_review:
    title: 復習：私、いる／です、いいえ／〜ない
    gloss: 私、いる／です、いいえ／〜ない
    note: 「大丈夫？」に「いいえ」と答えるために必要です。
    example_gloss: 私は元気です。
  hi.a1.unit16.lesson01.teach.sir:
    title: 頭
    gloss: 頭
    note: 新しい名詞で、このユニット最初の症状に必要です。
    example_gloss: 私の頭は大きいです。
  hi.a1.unit16.lesson01.teach.dard:
    title: 痛み
    gloss: 痛み
    note: 新しい名詞です。体の部位と組み合わせて、特定の痛みを表します。このユニットの文法ノートを見てください。
    example_gloss: 痛みがあります。
  hi.a1.unit16.lesson01.teach.mujhe_sir_dard_hai_phrase:
    title: 頭が痛いです。
    gloss: 頭が痛いです。
    note: このユニット最初の、症状を表す完全な文です。
  hi.a1.unit16.lesson01.teach.grammar_symptom_hai:
    title: Mujhe + 症状 + hai
    gloss: '''Mujhe + 名詞 + hai'' はユニット11で学びました (''mujhe kaam hai'' = 用事があります)。これが症状を表すときにも使われます。''mujhe sir dard hai'' は「頭が痛いです」という意味で、''sir dard'' (''sir'' = 頭、''dard'' = 痛み) が合わさって「頭痛」になります。新しい文法ではなく、これまでと同じパターンです。'
    note: すでに学んだ「与格＋名詞＋hai」の型の2つ目の使い方です。症状に使う前に、前に学んだユニットを示しています。
    target_text: '''मुझे + संज्ञा + है'' पहले यूनिट 11 में सीखा था (''मुझे काम है'' = 仕事があります)। अब यह लक्षण बताने के लिए भी इस्तेमाल होता है: ''मुझे सिर दर्द है'' का मतलब है ''頭が痛いです'' -- ''सिर दर्द'' (सिर = 頭, दर्द = 痛み) एक साथ मिलकर ''頭痛'' बनाते हैं। यह कोई नया व्याकरण नहीं है, वही पुराना पैटर्न है।'
  hi.a1.unit16.lesson01.teach.bukhar:
    title: 熱
    gloss: 熱
    note: 新しい名詞で、このユニットの2つ目の症状です。
    example_gloss: 熱はありますか。
  hi.a1.unit16.lesson01.teach.mujhe_bukhar_hai_phrase:
    title: 熱があります。
    gloss: 熱があります。
    note: 同じ「与格＋名詞＋hai」の型を、このレッスン2つ目の症状に使っています。
  hi.a1.unit16.lesson02.teach.tumhein_jaana_review:
    title: 復習：あなたに、行くこと
    gloss: あなたに／あなたにとって、行くこと
    note: どちらもすでに学んだ言葉です（ユニット6とユニット15）。ここでは医者に行く話をするために使います。
    example_gloss:
    - 何がほしいですか。
    - 私は駅に行かなければなりません。
  hi.a1.unit16.lesson02.teach.ke_paas_review:
    title: 復習：～の近く／～のところ
    gloss: ～の近く／～のところ（場所）
    note: ユニット8で学びました。ここでも使い、このレッスンの文法ノートで3つ目の意味が加わります。
    example_gloss: 銀行は学校の近くにあります。
  hi.a1.unit16.lesson02.teach.doctor:
    title: 医者
    gloss: 医者
    note: 新しい名詞で、このレッスンの中心となる話題です。
    example_gloss: その医者はいい人です。
  hi.a1.unit16.lesson02.teach.mujhe_doctor_ke_paas_jana_hai_phrase:
    title: 医者に行かなければなりません。
    gloss: 医者に行かなければなりません。
    note: '*ke paas* と、ユニット15の義務を表す *mujhe...jana hai* の型を組み合わせています。'
  hi.a1.unit16.lesson02.teach.grammar_ke_paas_third_sense:
    title: Ke paas：3つ目の意味
    gloss: '''Ke paas'' の最初の2つの意味は前に学びました。近く（ユニット8：''bank school ke paas hai''）と所有（ユニット2：''mere paas ek kitab hai''）です。ここで3つ目の使い方が加わります。「人」のところへ行く、つまりその人に会いに行くという意味です。''doctor ke paas jana hai'' は「医者に行かなければならない」という意味です。''mujhe...jana hai'' の型もユニット15から繰り返しています。'
    note: 3つ目の意味を導入する前に、これまでの2つの意味をユニット番号つきで示し、義務を表す型を再び使っていることも確認しています。
  hi.a1.unit16.lesson02.teach.aaraam:
    title: 休息
    gloss: 休息
    note: 新しい名詞で、このユニット最初の助言に使います。
    example_gloss: 私は休息が必要です。
  hi.a1.unit16.lesson02.teach.chahiye_review:
    title: 復習：ほしい／必要
    gloss: ほしい／必要
    note: ユニット6で学びました。ここでは、誰かに何が必要かを言うために使います。
    example_gloss: お茶がほしいです。
  hi.a1.unit16.lesson02.teach.tumhein_aaraam_chahiye_phrase:
    title: あなたは休息が必要です。
    gloss: あなたは休息が必要です。
    note: すでに学んだ *tumhein...chahiye* の型を、このレッスンの新しい名詞に使っています。
  hi.a1.unit16.lesson02.teach.dawa:
    title: 薬
    gloss: 薬
    note: 新しい名詞で、このユニット2つ目の助言に使います。
    example_gloss: 私は薬が必要です。
  hi.a1.unit16.lesson02.teach.tumhein_dawa_chahiye_phrase:
    title: あなたは薬が必要です。
    gloss: あなたは薬が必要です。
    note: 同じ *chahiye* の型を「薬」に使っています。
  hi.a1.unit16.lesson02.teach.jaao_aur_review:
    title: 復習：行って！、と／そして
    gloss: 行って！、と／そして
    note: どちらもすでに学んだ言葉です（ユニット9とユニット1・2）。ここでは2つの助言をつなぐために使います。
    example_gloss:
    - まっすぐ行ってください。
    - お茶とコーヒーがほしいです。
  hi.a1.unit16.lesson02.teach.karo_grammar:
    title: Karo：-o の命令形ルールの再利用
    gloss: '''Karo'' は、前に学んだ tum の命令形と同じルールで作ります (''jao''、''muro''、''batao''、''gino'' はどれも ''-o'' で終わります)。ここでは ''karna'' (ユニット11の ''maaf karna'') の語幹 ''kar'' に ''-o'' がついて ''karo''、つまり「しなさい！」になります。''Aaraam karo'' は「休みなさい！」という意味です。'
    note: すでに学んだ命令形のルールを、不定詞としてすでに知っている動詞に、はっきり広げて使っています。
  hi.a1.unit16.lesson02.teach.aaraam_karo_phrase:
    title: 休みなさい！
    gloss: 休みなさい！
    note: 新しい命令形を、このユニット最初の助言に使っています。
  hi.a1.unit16.lesson02.teach.aaraam_karo_aur_doctor_ke_paas_jaao_phrase:
    title: 休んで、医者に行きなさい。
    gloss: 休んで、医者に行きなさい。
    note: このレッスンの2つの助言を1つの自然な指示にまとめています。レッスン3の読み物カードの予告にもなっています。
  hi.a1.unit16.lesson03.teach.dialogue.line01:
    title: プリヤがアルジュンに大丈夫か聞く
    gloss: アルジュン、大丈夫？
  hi.a1.unit16.lesson03.teach.dialogue.line02:
    title: アルジュンが頭痛と熱があると言う
    gloss: ううん、頭が痛くて熱もあるんだ。
  hi.a1.unit16.lesson03.teach.dialogue.line03:
    title: プリヤが休息が必要だと言う
    gloss: それはよくないね。休んだほうがいいよ。
  hi.a1.unit16.lesson03.teach.dialogue.line04:
    title: アルジュンは薬もほしいと言う
    gloss: うん、でも薬も必要なんだ。
  hi.a1.unit16.lesson03.teach.dialogue.line05:
    title: プリヤが医者に行かなければならないと言う
    gloss: わかった。医者に行かなきゃだめだよ。
  hi.a1.unit16.lesson03.teach.dialogue.line06:
    title: アルジュンがプリヤにお礼を言う
    gloss: わかりました、ありがとう。
  hi.a1.unit16.lesson03.teach.dialogue.line07:
    title: プリヤが休むように言う
    gloss: 休みなさい！
  hi.a1.unit16.lesson03.teach.dialogue.line08:
    title: アルジュンが同意する
    gloss: わかった。
  hi.a1.unit16.lesson03.teach.grammar_summary:
    title: 3つの主なルール
    gloss: このユニットの3つの主なルール:(1)'mujhe/tumhein + 症状 + hai' で体の不調を伝えます(例:'mujhe bukhar hai')。(2)'tumhein/mujhe + 物 + chahiye' で必要なものを伝えます(例:'tumhein aaraam chahiye')。(3)'X ke paas jana hai' で、誰のところへ行く必要があるかを伝えます(例:'doctor ke paas jana hai')。
    note: ユニット全体の文法をまとめる締めくくりの要約です。
  hi.a1.unit16.lesson03.teach.advice_reading:
    title: アドバイスを読もう
    gloss: 休んでください。医者に行ってください。
    note: 短くて直接的な指示文です。実際の会話のアドバイスらしい言い方で、会話に出てきた内容だけをもう一度述べています。
    glosses:
      आराम: 休息
      करो: しなさい(करना の命令形)
      डॉक्टर: 医者
      जाओ: 行きなさい(जाना の命令形)
