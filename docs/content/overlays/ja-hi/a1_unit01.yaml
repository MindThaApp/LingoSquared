answer_policy:
  nasalization_marks: Display and teach the correct chandrabindu/anusvara distinction (हूँ, हाँ, कहाँ vs. मैं, हैं, में, मिलेंगे). In typed A1 answers, accept a variant that drops the nasalization mark entirely or substitutes anusvara for chandrabindu (हूं for हूँ, हां for हाँ) when every other character is correct -- these marks are small, easy to miss on a virtual keyboard, and near-homophonous in casual speech; this is a beginner course, not a spelling test. Do not extend this tolerance to a wrong vowel or consonant, which changes the actual word.
  punctuation: Hindi text is shown with the traditional danda (।) as the sentence-final mark, matching how it is actually printed and taught. In typed answers, accept the danda, a plain period (.), or the mark omitted entirely as equivalent -- most everyday Hindi typed on phones/keyboards uses a plain period, and this distinction carries no meaning difference. Question marks (?) and exclamation marks may likewise be omitted, but the fully punctuated form remains the model answer.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register (aap vs. tum) rather than written punctuation or nasalization marks.
course:
  title: ヒンディー語 A1
  description: 挨拶をする、相手の調子を尋ねる、自己紹介をする、基本的な個人情報をやり取りするといったことをヒンディー語で学びます。日本語と同じように、ヒンディー語にも相手との関係に応じて使い分ける「आप/तुम」の敬意の区別があります。また、形容詞や動詞の形が性別に合わせて変わる点も、日本語にはないヒンディー語の特徴として取り上げます。
units:
  hi.a1.unit01.greetings:
    title: ナマステと初対面のあいさつ
lessons:
  hi.a1.unit01.lesson01.aap_and_tum:
    title: アープとトゥム:相手の調子を尋ねる
  hi.a1.unit01.lesson02.greetings_and_farewells:
    title: あいさつと別れの言葉
  hi.a1.unit01.lesson03.names_origin_and_dialogue:
    title: 名前・出身、そしてヨガ教室での初対面
teaching:
  hi.a1.unit01.lesson01.teach.aap:
    title: 敬意を込めた「あなた」
    gloss: あなた(丁寧・敬意)
    note: 日本語の「あなた」や「きみ」と同じように、ヒンディー語にも相手との関係で選ぶ二人称があります。*aap* は年上の人、初対面の人、仕事上で敬意を払うべき相手に使います。文法上は、相手が一人でも複数扱いになり、*aap* に合わせる動詞は「彼ら」に使うのと同じ -en/hain 系の語尾になります。
  hi.a1.unit01.lesson01.teach.tum:
    title: 親しい「きみ・あなた」
    gloss: あなた・きみ(くだけた、親しい間柄)
    note: '*Tum* は友人、同年代の人、年下の人、家族に使います。くだけた関係で使いますが、失礼ではありません(さらに親密な *tu* とは別で、このコースでは扱いません)。*Tum* には、*aap* とも *tu* とも異なる独自の動詞語尾が付きます。'
  hi.a1.unit01.lesson01.teach.aap_kaise_hain:
    title: 男性への丁寧な調子の尋ね方
    gloss: お元気ですか?(丁寧・男性に)
    note: '*Kaise* は話し手ではなく、尋ねられる相手の性別に合わせて変わります。この形は男性に話しかけるときに使います。日本語の「お元気ですか」には、相手の性別による変化はありません。'
  hi.a1.unit01.lesson01.teach.aap_kaisi_hain:
    title: お元気ですか?(女性に対して・丁寧)
    gloss: お元気ですか?(丁寧・女性に)
    note: 同じ質問で、*aap* の丁寧さも同じです。*kaise* が *kaisi* に変わるだけで、女性の相手に合わせた形です。動詞 *hain* は変わらず、形容詞の形だけが変わります。
  hi.a1.unit01.lesson01.teach.tum_kaise_ho:
    title: 親しい相手への体調のたずね方
    gloss: 元気?(親しい相手に対して)
    note: '*tum* では動詞は *hain* ではなく *ho* になります。丁寧な *Aap kaise/kaisi hain?* とくだけた *Tum kaise ho?* を比べてみましょう。aap と tum の違いが動詞そのものに表れていることが、最もよくわかる組み合わせです。'
  hi.a1.unit01.lesson01.teach.main_theek_hoon:
    title: 決まった答え方
    gloss: 元気です、ありがとう。
    note: '*Theek*(「元気」「大丈夫」)は性別や丁寧さによって変わりません。*kaise/kaisi* と違い、誰が話しても、誰に話しても同じ形です。'
  hi.a1.unit01.lesson01.teach.aur_aap:
    title: 丁寧に聞き返す
    gloss: あなたは？（丁寧）
    note: 丁寧な aap の話し方で、同じ質問を相手に返す短い言い方です。
  hi.a1.unit01.lesson01.teach.aur_tum:
    title: 親しい相手に聞き返す
    gloss: 君は？（くだけた表現）
    note: 友人や同年代の人に質問を返すときは tum を使います。
  hi.a1.unit01.lesson02.teach.namaste:
    title: どんな場面でも使えるあいさつ
    gloss: こんにちは;やあ(別れのあいさつにも使う)
    note: '*Namaste* は一日のどの時間でも、改まった場でもくだけた場でも使え、会話の始まりにも終わりにも使えます。まさにオールマイティーです。日本語が「こんにちは」と「さようなら」を別々の言葉で使い分けるのとは対照的です。'
    example_gloss: こんにちは!お元気ですか?
  hi.a1.unit01.lesson02.teach.namaskar:
    title: 敬意を込めたあいさつ
    gloss: こんにちは(namaste より改まった、敬意のこもった言い方)
    note: '*Namaskar* は *namaste* とほぼ同じ意味ですが、より改まった敬意のこもった響きがあります。目上の人、大勢の聴衆、仕事の場面にふさわしい言い方です。'
    example_gloss: こんにちは!あなたは?
  hi.a1.unit01.lesson02.teach.phir_milenge:
    title: また会いましょう(未来形)
    gloss: また会いましょう;またあとで
    note: 直訳は「[私たちは]また会うでしょう」です。相手にまた会うと思っているときの、標準的で中立的な別れのあいさつです。
  hi.a1.unit01.lesson02.teach.alvida:
    title: 改まった別れのあいさつ
    gloss: さようなら;ごきげんよう
    note: '*Alvida* は「さようなら」を意味する正しいヒンディー語ですが、日常では *namaste* や *phir milenge* よりも、最後の別れのような、改まった、やや劇的な響きがあります。気軽な「じゃあね」よりも「ごきげんよう」に近い言葉です。'
    example_gloss: さようなら!また会いましょう。
  hi.a1.unit01.lesson02.teach.phir_milte_hain:
    title: またね(くだけた・習慣的)
    gloss: またね;また会おうね
    note: 直訳は「[私たちは]また会う」で、未来形ではなく継続・習慣を表す動詞の形を使います。*phir milenge* よりも少しくだけた、日常的な言い方です。
  hi.a1.unit01.lesson02.teach.shubh_ratri:
    title: おやすみなさい
    gloss: おやすみなさい
    note: 夜に人が去るときや寝るときに言います。日本語の「おやすみなさい」と同じく別れのあいさつで、*namaste* と違って、会ったときのあいさつとしては使いません。
  hi.a1.unit01.lesson02.teach.shubh_din:
    title: 丁寧な別れの願いの言葉
    gloss: 良い一日を。
    note: 直訳は「あなたの一日が良いものでありますように」です。相手と別れるときの丁寧な結びの言葉で、改まった間柄でも親しい間柄でも使えます。
  hi.a1.unit01.lesson03.teach.aapka_naam_kya_hai:
    title: 丁寧に名前を尋ねる
    gloss: お名前は何ですか？（丁寧）
    note: '*Aapka*(「あなたの」)は男性名詞 *naam*(「名前」)に合わせた形です。ヒンディー語の所有を表す語は、持ち主ではなく所有されるものに合わせて形が変わります。日本語の「あなたの」には、このような変化はありません。'
  hi.a1.unit01.lesson03.teach.tumhara_naam_kya_hai:
    title: くだけた名前の尋ね方
    gloss: 名前は何？（くだけた表現）
    note: '*aapka* の代わりに *tumhara*(くだけた「あなたの」)を使うだけで、同じ型の文です。丁寧な *Aapka naam kya hai?* とくだけた *Tumhara naam kya hai?* を比べてみましょう。'
  hi.a1.unit01.lesson03.teach.mera_naam_priya_hai:
    title: 自分の名前を言う
    gloss: 私の名前はプリヤです。
    note: '*Mera*(「私の」)も、男性名詞の *naam* に合わせた形です。上の *aapka*/*tumhara* と同じ男性形の語尾になっているのがわかります。三つとも同じ名詞を修飾しているからです。'
  hi.a1.unit01.lesson03.teach.aapse_milkar_khushi_hui:
    title: 初対面の喜びを丁寧に伝える
    gloss: はじめまして。(丁寧)
    note: 直訳は「あなたにお会いして、喜びが起こりました」です。敬意を込めた初対面の場面で広く使われる決まり文句です。
  hi.a1.unit01.lesson03.teach.mujhe_bhi:
    title: 同じ気持ちを返す
    gloss: 私もです。
    note: Aapse milkar khushi hui や Tumse milkar accha laga に対する、短く自然な返事です。
  hi.a1.unit01.lesson03.teach.aap_kahan_se_hain:
    title: 丁寧な出身の尋ね方
    gloss: ご出身はどちらですか？（丁寧）
    note: Kahan は「どこ」、se は「〜から」という意味です。
  hi.a1.unit01.lesson03.teach.main_bharat_se_hoon:
    title: 出身を伝える
    gloss: 私はインド出身です。
    note: Bharat はインドを表すヒンディー語の名前で、日常会話でよく使われます。
  hi.a1.unit01.lesson03.teach.tum_kahan_se_ho:
    title: 親しく出身を尋ねる
    gloss: どこの出身？（くだけた表現）
    note: '*aap* と *hain* の代わりに *tum* と *ho* を使った同じ質問です。この単元で見てきた、丁寧とくだけた場合の動詞語尾の違いと同じ型です。'
  hi.a1.unit01.lesson03.teach.dialogue.line01:
    title: 出会いのきっかけ
    gloss: プリヤはアルジュンにあいさつし、ここに来るのは初めてかと尋ねます。
    note: 二人とも最初からくだけた *tum* で話しています。地域の教室で気軽に出会った同年代の二人には自然です。*Tumhari*(「あなたの」)は、どちらの話し手の性別でもなく、女性名詞 *baar*(「回、機会」の意味の「時」)に合わせた形です。
  hi.a1.unit01.lesson03.teach.dialogue.line02:
    title: 出会いのきっかけ(返事)
    gloss: アルジュンは、はいと答え、初めてで、ヨガを習いたいと言います。
    note: '*Chahta hoon*(「私は望む」)は、話し手のアルジュンが男性なので男性形です。この動詞は話し手の性別に合わせて変わります。先ほどの *kaisi*/*kaise* が、話しかけられる相手の性別に合わせていたのとは異なります。'
  hi.a1.unit01.lesson03.teach.dialogue.line03:
    title: 名前を言い合う
    gloss: プリヤは「私も!」と言い、自分の名前を伝えて、アルジュンの名前を尋ねます。
    note: '*Main bhi!*(「私も!」)は、アルジュンの *main ... chahta hoon* に対する返事です。相手の文の主語が *main* のときは、「私も」は *main bhi* になります。*Mujhe bhi* は、*Tumse milkar accha laga* のような *mujhe* 型の文への返事です。*Mera naam...hai* は、名前を伝える自然でシンプルな言い方です。'
  hi.a1.unit01.lesson03.teach.dialogue.line04:
    title: 名前を言い合う(返事)
    gloss: アルジュンは名前を言い、くだけた言い方で、会えてうれしいと伝えます。
    note: '*Tumse milkar accha laga* は、このレッスンで学んだ丁寧な *Aapse milkar khushi hui* に対応するくだけた言い方です。どちらも「はじめまして」くらいの意味で、丁寧さに合わせて使い分けます。'
  hi.a1.unit01.lesson03.teach.dialogue.line05:
    title: 出身をたずねる
    gloss: プリヤも同じ気持ちを返し、アルジュンの出身を尋ねます。
    note: Tum kahan se ho は、すでに学んだくだけた言い方で出身を尋ねる表現です。
  hi.a1.unit01.lesson03.teach.dialogue.line06:
    title: 出身をたずねる(返事)
    gloss: アルジュンはインド出身ですが、今はロンドンに住んでいると言い、同じ質問を返します。
    note: '*Rahta hoon*(「私は住んでいる」)は、話し手のアルジュンに合わせた男性形です。line02 の *chahta hoon* と同じ、主語に合わせる型です。*Lekin*(「しかし」)は、出身と現在の居住地の対比をつないでいます。'
  hi.a1.unit01.lesson03.teach.dialogue.line07:
    title: 出身と興味について話す
    gloss: プリヤはアメリカ出身で、自分もヨガを習いたいと言います。
    note: '*Chahti hoon* は、アルジュンが line02 で使った動詞(*chahta hoon*)の女性形です。どちらも話し手自身の性別に合わせており、比べるのにちょうどよい組み合わせです。'
  hi.a1.unit01.lesson03.teach.dialogue.line08:
    title: 共通の話題について尋ねる
    gloss: アルジュンは好意的に反応し、プリヤにヨガをするのか尋ねます。
    note: '*Karti ho*(「あなたはしますか」)は、尋ねられる相手のプリヤに合わせた女性形です。先ほどの *kaisi* と同じで、この動詞の形は話し手ではなく、話しかけられる相手の性別に合わせます。'
  hi.a1.unit01.lesson03.teach.dialogue.line09:
    title: 共通の話題について尋ね、答える
    gloss: プリヤは、いいえ、初めてで、今習っているところだと言います。
    note: '*Seekh rahi hoon*(「私は習っているところです」)は女性の継続形で、話し手のプリヤに合わせています。*chahti hoon* の現在進行形にあたります。'
  hi.a1.unit01.lesson03.teach.dialogue.line10:
    title: 会話を終える
    gloss: アルジュンは始めることに同意し、またねと言います。
    note: '*Chalo shuru karte hain*(「始めましょう」)は、一緒に何かを始めようと誘うときの決まった自然な言い方です。*Phir milte hain* は、レッスン2で学んだくだけた別れのあいさつで、やり取りを締めくくります。'
exercises:
  hi.a1.unit01.lesson01.exercise01.select_aap:
    instruction: 「あなた」を表す、丁寧で敬意のある言葉はどれですか?
    correct_option: आप
    distractors:
    - तुम
    - और
    accepted_answers:
    - आप
    feedback: Aap は、年上の人、初対面の人、敬意を払うべき関係の人に使います。
  hi.a1.unit01.lesson01.exercise02.select_tum:
    instruction: 親しい友人や同年代の一人に呼びかける言葉はどれですか?
    correct_option: तुम
    distractors:
    - आप
    - और
    accepted_answers:
    - तुम
    feedback: Tum は、友人や同年代の人など、くだけていても失礼にならない関係の人に使います。
  hi.a1.unit01.lesson01.exercise03.select_aap_kaisi_hain_meaning:
    instruction: この質問は何を尋ねていて、誰に向けたものですか?
    correct_option: お元気ですか?(丁寧・女性に)
    distractors:
    - お元気ですか?(丁寧・男性に)
    - あなたは?
    accepted_answers:
    - お元気ですか?(丁寧・女性に)
    feedback: Kaisi は女性の相手に合わせた形で、男性には kaise を使います。
  hi.a1.unit01.lesson01.exercise04.order_aap_kaise_hain:
    instruction: 男性への丁寧な調子の尋ね方を、正しい順に並べましょう。
    correct_response:
    - आप
    - कैसे
    - हैं
  hi.a1.unit01.lesson01.exercise05.order_tum_kaise_ho:
    instruction: 親しい相手への調子の尋ね方を、正しい順に並べましょう。
    correct_response:
    - तुम
    - कैसे
    - हो
  hi.a1.unit01.lesson01.exercise06.return_formal:
    instruction: 丁寧さを保ったまま、質問を返しましょう。
    correct_option: और आप?
    distractors:
    - और तुम?
    - तुम कैसे हो?
    accepted_answers:
    - और आप?
    - और आप
    feedback: Aur aap? は、質問を返すときも丁寧な言い方を保つ表現です。
  hi.a1.unit01.lesson01.exercise07.return_informal:
    instruction: 友人や同年代の人に質問を返しましょう。
    correct_option: और तुम?
    distractors:
    - और आप?
    - आप कैसे हैं?
    accepted_answers:
    - और तुम?
    - और तुम
    feedback: Aur tum? は、質問をくだけた言い方で返す表現です。
  hi.a1.unit01.lesson01.exercise08.correct_informal_agreement:
    instruction: くだけた質問を直しましょう。tum に合わない動詞の語尾が混ざっています。
    accepted_answers:
    - तुम कैसे हो?
    - तुम कैसे हो
    feedback: Tum には hain ではなく ho が付きます。hain は aap のときだけ使います。
  hi.a1.unit01.lesson01.exercise09.reply_formally:
    instruction: 丁寧に答えましょう。元気だと言い、お礼を伝えてください。
    accepted_answers:
    - मैं ठीक हूँ, शुक्रिया।
    - मैं ठीक हूँ, शुक्रिया
    - मैं ठीक हूं, शुक्रिया।
    - मैं ठीक हूँ, शुक्रिया। और आप?
    - मैं ठीक हूँ, शुक्रिया, और आप?
    - मैं ठीक हूं, शुक्रिया। और आप?
    - मैं ठीक हूं, शुक्रिया, और आप?
  hi.a1.unit01.lesson01.exercise10.speak_informally:
    instruction: くだけた言い方で答え、お礼を言って、相手に同じ質問を返しましょう。
    accepted_answers:
    - मैं ठीक हूँ, शुक्रिया। और तुम?
    - मैं ठीक हूँ, शुक्रिया, और तुम?
    - मैं ठीक हूँ, शुक्रिया। और तुम
    - मैं ठीक हूं, शुक्रिया। और तुम?
    - मैं ठीक हूं, शुक्रिया, और तुम?
  hi.a1.unit01.lesson02.exercise01.select_namaste:
    instruction: 「こんにちは」と「さようなら」の両方の意味になる言葉はどれですか?
    correct_option: नमस्ते
    distractors:
    - अलविदा
    - शुभ रात्रि
    accepted_answers:
    - नमस्ते
  hi.a1.unit01.lesson02.exercise02.select_alvida:
    instruction: 改まった、最後の別れのように聞こえる「さようなら」を表す言葉はどれですか?
    correct_option: अलविदा
    distractors:
    - नमस्ते
    - फिर मिलेंगे
    accepted_answers:
    - अलविदा
  hi.a1.unit01.lesson02.exercise03.select_shubh_ratri_meaning:
    instruction: このフレーズはどんな意味ですか?
    correct_option: おやすみなさい。
    distractors:
    - おはようございます。
    - またね。
    accepted_answers:
