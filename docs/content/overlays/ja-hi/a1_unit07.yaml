answer_policy:
  nasalization_marks: 'Display and teach the correct chandrabindu/anusvara distinction. This unit''s own new vocabulary needs one new, explicitly disclosed spelling decision: महंगा/महंगी ("expensive") uses अनुस्वार (ं), not चंद्रबिंदु -- this is a class-nasal-before-a-stop-consonant case (the same pattern as गंगा/मंगल), not an application of the existing word-final vowel-height convention that governs हूँ/हाँ/मैं/हैं/में. In typed A1 answers, accept a variant that drops a nasalization mark entirely or substitutes anusvara for chandrabindu (or vice versa) when every other character is correct. Do not extend this tolerance to a wrong vowel or consonant, which changes the actual word.'
  punctuation: Hindi text is shown with the traditional danda (।) as the sentence-final mark. In typed answers, accept the danda, a plain period (.), or the mark omitted entirely as equivalent. Question marks (?), exclamation marks, and commas may likewise be omitted, but the fully punctuated form remains the model answer.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register (aap vs. tum) rather than written punctuation or nasalization marks.
course:
  title: ヒンディー語 A1
units:
  hi.a1.unit07.shopping:
    title: 買い物
lessons:
  hi.a1.unit07.lesson01.dukaan_mein:
    title: お店で
  hi.a1.unit07.lesson02.keemat_aur_matra:
    title: 値段と数量
  hi.a1.unit07.lesson03.priya_aur_arjun_ki_khareedari:
    title: プリヤとアルジュンが買い物に行く
teaching:
  hi.a1.unit07.lesson01.teach.dukaan_bazaar:
    title: お店、市場
    gloss: お店、市場
    note: 買い物をする代表的な2つの場所で、この単元を通して使います。
    example_gloss:
    - これはお店です。
    - これは市場です。
  hi.a1.unit07.lesson01.teach.dukaandaar:
    title: 店主
    gloss: 店員
    note: この単元の新しい登場人物で、お店を切り盛りする人です。初対面の相手なので aap で呼びかけます。
    example_gloss: こちらは店主です。
  hi.a1.unit07.lesson01.teach.kameez_bag_topi:
    title: シャツ、バッグ、帽子
    gloss: シャツ、バッグ、帽子
    note: 買い物でよく出てくる3つの品物で、食べ物の単元で学んだ *mujhe ... chahiye* の型を練習するためにこの単元で使います。
    example_gloss:
    - シャツがほしいです。
    - バッグがほしいです。
    - 帽子がほしいです。
  hi.a1.unit07.lesson01.teach.mujhe_yah_chahiye:
    title: これがほしいです
    gloss: これがほしいです。
    note: 品物をほしいと伝えるときの汎用フレーズです。食べ物の単元の *mujhe ... chahiye* に *yah*（これ）を組み合わせています。
  hi.a1.unit07.lesson01.teach.ji:
    title: ジー（丁寧な敬称）
    gloss: 丁寧・敬意を表す語で、「〜さん」「〜様」を付けるようなもの
    note: 名前や肩書きの後ろに付けて丁寧にする語で、店主のような初対面の人に呼びかけるときによく使います。
    example_gloss: 店主さん、こんにちは。
  hi.a1.unit07.lesson01.teach.sirf:
    title: だけ
    gloss: 〜だけ、ただ〜のみ
    note: いくつもではなく、1つだけほしいと言うときに使います。
    example_gloss: シャツを1枚だけください。
  hi.a1.unit07.lesson01.teach.aapko_aur_kuch_chahiye:
    title: ほかに何かご入り用ですか？（丁寧な言い方）
    gloss: ほかに何かご入り用ですか？
    note: 店主が注文を一部受けた後にたずねる、自然で丁寧な質問です。*aapko* と *chahiye* をもう一度使っています。
  hi.a1.unit07.lesson01.teach.ji_nahin_sirf_yah:
    title: いいえ、これだけです
    gloss: いいえ、これだけです。
    note: これ以上の品を丁寧に断る自然な言い方です。このレッスンで学んだ *ji* と *sirf* を使っています。
  hi.a1.unit07.lesson01.teach.tumhein_kya_chahiye_bataao:
    title: 何がほしいか教えてください
    gloss: 何がほしいか教えてください。
    note: 声に出して答えるよう促すときに、このコースで使うくだけた練習用の指示文です。食べ物のユニットの同じ表現と対応しています。
  hi.a1.unit07.lesson02.teach.keemat:
    title: 値段
    gloss: 値段
    note: ユニット2の数字・値段の内容で出てきた語です。このユニットの買い物の場面でもう一度学びます。
    example_gloss: これの値段はいくらですか。
  hi.a1.unit07.lesson02.teach.rupaye:
    title: ルピー
    gloss: ルピー
    note: ユニット2で出てきた通貨の単語です。ここでは2つの異なる値段で練習します。
    example_gloss:
    - これの値段は200ルピーです。
    - これの値段は500ルピーです。
  hi.a1.unit07.lesson02.teach.iski_keemat_kya_hai:
    title: これの値段はいくらですか。
    gloss: これの値段はいくらですか。
    note: 値段をたずねる標準的な言い方です。ユニット2で学んだものをそのまま使います。
  hi.a1.unit07.lesson02.teach.iski_keemat_bees_rupaye_hai:
    title: これの値段は200ルピーです
    gloss: これの値段は200ルピーです。
    note: 上の値段の質問に対する答えの例です。
  hi.a1.unit07.lesson02.teach.kitne_ka_ki_note:
    title: Kitne ka / kitne ki
    gloss: '''Yah kitne ka hai?'' は男性名詞の物に使い、''Yah kitne ki hai?'' は女性名詞の物に使います。*kitne* 自体は変わらず、変わるのは *ka/ki* だけです。*mera/meri* や *tumhara/tumhari* で学んだ -a/-i の入れ替わりと同じです。'
    note: 値段をたずねるもう一つのよく使う言い方です。所有を表す語で学んだ性の一致と同じ仕組みで、変わるのは ka/ki の部分だけで、kitne は変わりません。
  hi.a1.unit07.lesson02.teach.yeh_kitne_ka_hai:
    title: これはいくらですか(男性名詞)
    gloss: これはいくらですか。
    note: バッグのような男性名詞の物に使います。
  hi.a1.unit07.lesson02.teach.yeh_kitne_ki_hai:
    title: これはいくらですか(女性名詞)
    gloss: これはいくらですか。
    note: 帽子のような女性名詞の物に使います。
  hi.a1.unit07.lesson02.teach.sasta_mehenga:
    title: 安い、高い
    gloss: 安い、高い
    note: 値段に対する感想を言うときによく使う形容詞のペアです。ここでは男性形を示しています。
    example_gloss:
    - このバッグは安いです。
    - このバッグは高いです。
  hi.a1.unit07.lesson02.teach.sasti_mehengi_note:
    title: Sasti と mehengi
    gloss: '''Sasta'' と ''mehenga'' も mera/meri と同じように男性・女性で形が変わります。女性名詞には ''sasti'' と ''mehengi'' を使い、たとえば ''yah topi sasti hai''(この帽子は安いです)や ''yah kameez mehengi hai''(このシャツは高いです)のように言います。'
    note: このコースが繰り返し取り上げている性の一致の、2つ目の実例です。
  hi.a1.unit07.lesson03.teach.khareedna:
    title: 買う
    gloss: 買う
    note: ユニット1でヨガを習う場面で学んだ「V + na chahta/chahti hun」(〜したいです)の構文を、ここでは買い物に応用します。
    example_gloss:
    - このシャツを買いたいです。
    - この帽子を買いたいです。
  hi.a1.unit07.lesson03.teach.chalo_kuch_khareedte_hain:
    title: 何か買いましょう！
    gloss: 何か買いましょう！
    note: いっしょに買い物をしようと誘う、親しみのある決まった言い方です。このユニットの最後の会話の始まりで、食べ物のユニットの 'chalo, kuch khate hain!' と同じパターンです。
  hi.a1.unit07.lesson03.teach.dialogue.line01:
    title: アルジュンが買い物に誘う
    gloss: アルジュンが「何か買おう」と言います。
    note: このユニットの最初に出てきたフレーズを再び使います。
  hi.a1.unit07.lesson03.teach.dialogue.line02:
    title: プリヤが同意する
    gloss: プリヤは同意して、シャツにするか帽子にするか考えます。
    note: 2つの品物から選ぶときの *ya*(または)を学びます。
  hi.a1.unit07.lesson03.teach.dialogue.line03:
    title: 店員が挨拶する
    gloss: 店員が挨拶をして、何がほしいかたずねます。
    note: aap を使う丁寧な挨拶です。レッスン1の *aapko kya chahiye* を再び使います。
  hi.a1.unit07.lesson03.teach.dialogue.line04:
    title: プリヤがシャツについてたずねる
    gloss: プリヤは店員に丁寧に挨拶し、シャツがほしいと伝えて、その値段をたずねます。
    note: '*ji*、*mujhe ... chahiye*、*iski keemat kya hai* を組み合わせています。'
  hi.a1.unit07.lesson03.teach.dialogue.line05:
    title: 店員が値段を答える
    gloss: 店員が、値段は300ルピーだと言います。
    note: '*iski keemat ... rupaye hai* のパターンを、新しい数字で再び使います。'
  hi.a1.unit07.lesson03.teach.dialogue.line06:
    title: プリヤが反応して決める
    gloss: プリヤは「300ルピー？安いですね！このシャツをください」と言います。
    note: レッスン2の文法ノートで学んだ *sasti* を再び使います。
  hi.a1.unit07.lesson03.teach.dialogue.line07:
    title: アルジュンが帽子についてたずねる
    gloss: アルジュンは帽子がほしいと言って、いくらかたずねます。
    note: レッスン2で学んだ女性形の *kitne ki hai* を再び使います。
  hi.a1.unit07.lesson03.teach.dialogue.line08:
    title: 店員が答える
    gloss: 店員が、この帽子は500ルピーだと言います。
    note: レッスン2で学んだ *paanch sau*(500)を再び使います。
  hi.a1.unit07.lesson03.teach.dialogue.line09:
    title: アルジュンは反応しつつも買うことにする
    gloss: アルジュンは「500ルピー？高いですね！でも、いいです。この帽子をください」と言います。
    note: レッスン2の文法ノートで学んだ *mehengi* を再び使い、それでも買うことにします。
  hi.a1.unit07.lesson03.teach.dialogue.line10:
    title: 店員が、ほかにないかたずねる
    gloss: 店員が「わかりました。ほかに何かご入り用ですか」と言います。
    note: レッスン1の *aapko aur kuch chahiye* を再び使います。
  hi.a1.unit07.lesson03.teach.dialogue.line11:
    title: プリヤが注文を締めくくる
    gloss: プリヤは「いいえ、これだけです。ありがとう！」と言います。
    note: レッスン1の *ji nahin, sirf yah* に *shukriya* を加えて再び使います。
  hi.a1.unit07.lesson03.teach.dialogue.line12:
    title: 店員が別れの挨拶をする
    gloss: 店員が「ありがとうございます。またお会いしましょう」と言います。
    note: このコースで決まって使う、別れの挨拶を再び使います。
