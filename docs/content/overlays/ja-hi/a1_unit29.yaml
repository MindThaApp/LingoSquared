teaching:
  hi.a1.unit29.lesson01.teach.kul_kitna_hua:
    title: 合計金額をたずねる
    gloss: 合計でいくらですか?
    note: '*कुल* は「合計」という意味で、*कितना हुआ?*(「いくらになりましたか」)は合計を聞くときの日常的な言い方です。'
  hi.a1.unit29.lesson01.teach.kul_pachchees_rupye:
    title: 合計金額を伝える
    gloss: 合計で250ルピーです。
    note: '*हुए* は複数形の *रुपये* に合わせた形です。*कुल दो सौ पचास रुपये हुए* を直訳すると「全部で250ルピーになった」です。'
  hi.a1.unit29.lesson02.teach.kard_se_pement:
    title: カードや現金で支払う
    gloss: カードで支払う、現金で支払う
    note: ヒンディー語では *कार्ड से पेमेंट करना*(「カードで支払いをする」)や *नकद पेमेंट करना* と言います。*से* は支払い手段を表します。
    example_gloss:
    - ここでカードで支払えますか?
    - 現金で支払います。
  hi.a1.unit29.lesson02.teach.kya_main_yahan:
    title: カードが使えるかたずねる
    gloss: ここでカードで支払えますか?
    note: '*यहाँ*(「ここ」)は場所を表し、*सकता हूँ*(「できる」)は主な部分の後ろに来ます。女性が言うときは *सकती हूँ* になります。'
  hi.a1.unit29.lesson02.teach.ap_nakad_pement:
    title: 支払い方法の希望をたずねる
    gloss: 現金とカード、どちらでお支払いですか?
    note: '*आप ... करेंगे* は店員が使う丁寧な未来形の質問で、*आप* には複数形の動詞 *करेंगे* が使われます。'
  hi.a1.unit29.lesson03.teach.bil:
    title: お会計
    gloss: そのお会計
    note: '*बिल* は男性名詞です:*एक बिल*、*बिल का*。'
    example_gloss: 割り勘にしましょうか?
  hi.a1.unit29.lesson03.teach.bil_bant_len:
    title: 割り勘を提案する
    gloss: 割り勘にしましょうか?
    note: '*बाँट लें?*(「割り勘にしましょうか」)は、*हम* を言わなくても一緒にする提案になります。*लें* は *लेना* の「〜しましょう」の形です。'
  hi.a1.unit29.lesson03.teach.kya_main_alag:
    title: 別々に支払いたいとたずねる
    gloss: 別々に支払ってもいいですか?
    note: '*अलग से* は「別々に」という意味で、*पेमेंट कर सकता हूँ* の前に置きます。'
  hi.a1.unit29.lesson04.teach.bakee_paise:
    title: おつり
    gloss: おつり
    note: '*बाकी पैसे*(「残りのお金」)は複数形で、戻ってくるおつりを指します。'
    example_gloss: こちらがおつりです。
  hi.a1.unit29.lesson04.teach.ye_rahe_apke:
    title: おつりを渡す
    gloss: こちらがおつりです。
    note: '*आपके* は丁寧な「あなたの」(*आप* + *के*)で、複数形の *पैसे* に合わせた形です。'
  hi.a1.unit29.lesson04.teach.mujhe_bakee_paise:
    title: おつりを断る
    gloss: おつりはいりません。
    note: '*मुझे ... नहीं चाहिए*(「私には…必要ない」)は、ヒンディー語で「いりません」と言う言い方です。*नहीं* は *चाहिए* の前に置きます。'
  hi.a1.unit29.lesson05.teach.paintees:
    title: '350'
    gloss: '350'
    note: '*तीन सौ पचास* は350です。百の位を先に言い、その後に十の位を言います。'
    example_gloss: 値段は350ルピーです。
  hi.a1.unit29.lesson05.teach.bil_do_thalee:
    title: レストランのお会計を読む
    gloss: お会計:ターリー2つとチャイ2つ。合計:350ルピー。支払い:カード。
    note: 注文した物、合計金額、支払い方法に注目しましょう。
    glosses:
      बिल: お会計
      दो: '2'
      थाली: ターリー
      चाय: チャイ
      कुल: 合計
      तीन: '3'
      सौ: 百
      पचास: '50'
      रुपये: ルピー
      पेमेंट: 支払い
      कार्ड: カード
  hi.a1.unit29.lesson06.teach.priya_bil_mang:
    title: プリヤが会計を頼む
    gloss: プリヤ:お会計をお願いしましょうか?
    note: '*माँग लें?*(「頼みましょうか」)でも *लेना* の「〜しましょう」の形が使われています。*माँगना* は「頼む、求める」という意味です。'
  hi.a1.unit29.lesson06.teach.arjun_han_achchha:
    title: アルジュンが合計をたずねる
    gloss: アルジュン:うん、いいね。合計でいくらになる?
    note: '*कुल कितना हुआ?* は先ほどの合計をたずねる質問で、ここでは食卓で使われています。'
  hi.a1.unit29.lesson06.teach.priya_paintees_rupye:
    title: プリヤが合計を伝える
    gloss: プリヤ:350ルピーだよ。割り勘にする?
    note: '*तीन सौ पचास रुपये हुए* は合計を伝える言い方で、*बाँट लें?* は「割り勘にしましょうか」とたずねています。'
  hi.a1.unit29.lesson06.teach.arjun_naheen_aj:
    title: アルジュンが支払うと言い張る
    gloss: アルジュン:いや、今日は僕に払わせて。君にはすごく助けてもらったから。
    note: '*मुझे पेमेंट करने दो* は「私に払わせて」という意味です。*तुमने मेरी बहुत मदद की है* は動詞が過去なので *ने* が使われています。'
  hi.a1.unit29.lesson06.teach.priya_tum_kitne:
    title: プリヤが感激する
    gloss: プリヤ:なんて優しいの!ありがとう。
    note: '*तुम कितने अच्छे हो!*(「なんて優しいの」)は温かい褒め言葉で、*शुक्रिया* は「ありがとう」という意味です。'
  hi.a1.unit29.lesson06.teach.arjun_kya_main:
    title: アルジュンがカード払いについてたずねる
    gloss: アルジュン:ここでカードで払えますか?
    note: '*क्या मैं यहाँ कार्ड से पेमेंट कर सकता हूँ?* という質問が、今度は実際のレストランで再び使われています。'
  hi.a1.unit29.lesson06.teach.arjun_bil_deta:
    title: देता है:支払う
    gloss: アルジュンが会計をします。
    note: '*देता है* は *देना*(「与える」)の *वह* の形です。ヒンディー語では「会計をする」を「会計を渡す」と言います。'
