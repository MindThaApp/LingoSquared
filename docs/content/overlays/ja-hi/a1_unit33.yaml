  hi.a1.unit33.lesson01.teach.main_futbol_khelta:
    title: 私はサッカーをします
    gloss: 私はサッカーをします。
    note: ヒンディー語では、スポーツに合った動詞を使います。サッカーには *खेलना*(「遊ぶ・プレーする」)を使って、*मैं फ़ुटबॉल खेलता हूँ* と言います。
  hi.a1.unit33.lesson01.teach.futbol_khelna_yog:
    title: खेलना か करना か
    gloss: サッカーをする、ヨガをする。ヒンディー語ではスポーツによって動詞を選びます。サッカーのような球技・ゲームには *खेलना*、ヨガのようなものには *करना* を使います。スポーツ名は動詞の前に置きます。
    note: この段階では、スポーツごとに別の動詞を覚える必要はありません。一つの構文で、どのスポーツも言い表せます。
  hi.a1.unit33.lesson02.teach.hafte_men_do:
    title: 週に～回
    gloss: 週に～回
    example_gloss: 私は週に2回ヨガをします。
  hi.a1.unit33.lesson02.teach.main_hafte_men:
    title: हफ़्ते में दो बार
    gloss: 私は週に2回走ります。*हफ़्ते में दो बार*(「1週間に2回」)は、*रोज़* や *अक्सर* より具体的な頻度の言い方で、動詞の前に置きます。
    note: 趣味の単元ですでに学んだ頻度の表現をさらに広げます。
  hi.a1.unit33.lesson02.teach.main_hafte_men_2:
    title: 私は週に2回ヨガをします
    gloss: 私は週に2回ヨガをします。
  hi.a1.unit33.lesson02.teach.arjun_aksar_futbol:
