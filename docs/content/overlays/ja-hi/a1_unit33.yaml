    note: '*अक्सर*(「よく」)は動詞の前に置きます:*अर्जुन अक्सर फ़ुटबॉल खेलता है*。'
  hi.a1.unit33.lesson03.teach.main_kasrat_karta:
    title: कसरत करना か खेलना か
    gloss: 私は運動します。私はサッカーをします。
    note: '*कसरत करना* は一般的な「運動する」で、*फ़ुटबॉल खेलना* は具体的なスポーツを表します。'
