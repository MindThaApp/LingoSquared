    gloss: アルジュン:へえ、僕もそこでよくサッカーをするよ。
  hi.a1.unit33.lesson05.teach.priya_hafte_men:
    title: プリヤとネハのスポーツの話
    gloss: プリヤは週に2回ヨガをします。ゆったり体を動かすのが好きです。ネハはヨガはしませんが、水泳が大好きです。ネハはよく、ほぼ毎週泳ぎます。あなたはどのスポーツをしますか?
    note: この文章では、2つのスポーツと、頻度の2つの言い方が対比されています。*हफ़्ते में दो बार* と *अक्सर, लगभग हर हफ़्ते* です。動詞 *करती है* と *तैरती है* は女性形です。
    glosses:
      करती: する
      दो: '2'
      बार: 回
      हफ़्ते: 週
      योग: ヨガ
      पसंद: 大好きである
      आराम: 穏やかに
      कसरत: 運動
      तैरना: 泳ぐこと
      तैरती: 泳ぐ
      अक्सर: よく
      लगभग: ほとんど
      कौन: どの
      खेल: スポーツ
  hi.a1.unit33.lesson05.teach.neha_aksar_tairtee:
    title: ネハはよく、ほぼ毎週泳ぐ
    gloss: ネハはよく、ほぼ毎週泳ぎます。
  hi.a1.unit33.lesson05.teach.main_futbol_khelta:
    title: 私はサッカーをします。サッカーが大好きです
    gloss: 私はサッカーをします。サッカーが大好きです
    note: このユニットの作文問題でそのまま応用できる、二文からなる解答例です。
  hi.a1.unit33.lesson06.teach.priya_chalo_sath:
    title: プリヤが誘う
    gloss: プリヤ:ねえ、一緒に運動しない?
  hi.a1.unit33.lesson06.teach.chalo_sath_men:
    title: चलो + खेलें
    gloss: さあ、一緒に遊びましょう。*चलो* のあとに *-एँ* 形(*खेलें*)を続けると、一緒にしようという提案になります。「〜しませんか」にあたる言い方です。
    note: 予定についての課で学んだ、何かを一緒にしようと提案する構文をそのまま使っています。
  hi.a1.unit33.lesson06.teach.neha_han_maza:
    title: ネハが賛成する
    gloss: ネハ:うん、楽しそう!私は水泳が大好きなの。
  hi.a1.unit33.lesson06.teach.arjun_main_futbol:
    title: アルジュンはサッカーのほうが好き
    gloss: アルジュン:僕はサッカーをするほうがいいな。
  hi.a1.unit33.lesson06.teach.vikram_aur_mujhe:
    title: ヴィクラムは走るのが好き
    gloss: ヴィクラム:僕は走るのが好きだな。
  hi.a1.unit33.lesson06.teach.priya_to_is:
    title: プリヤが会話をまとめる
    gloss: プリヤ:じゃあ、今週は4人で一緒に運動しましょう!
    note: このユニットに出てくる4人全員のスポーツの好みをまとめています。
