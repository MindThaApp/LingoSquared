    title: 季節についての会話
    gloss: 今は春です。花が美しいです。ニーナが尋ねます：どの季節が美しいと思いますか？アルジュンが言います：私は夏が好きです。夏には泳ぎます。プリヤが言います：私は冬が好きです。冬にはスケートをします。
    note: 会話の内容を直接話法で振り返りながら、季節についての表現を復習します。
    glosses:
      वसंत: 春
      फूल: 花(複数)
      सुंदर: 美しい
      पूछती: 尋ねる
      मौसम: 季節
      लगता: (私には)〜と感じられる
      कहता: 言う
      गर्मी: 夏
      अच्छी: よい・好ましい(女性形)
      तैरते: 泳ぐ
      सर्दी: 冬
      स्केटिंग: アイススケートをする
