    title: ニーナとプリヤ、花を買う
    gloss: ニーナとプリヤは土曜日に花市場へ行きます。プリヤはどの色がほしいですか?プリヤは赤がほしいです。ニーナはどの色がほしいですか?ニーナは黄色がほしいです。二人は花を5本買います。100ルピーです。花はとてもきれいです!
    note: 土曜日の花市場へのお出かけを振り返る文章です。家庭、近所、郵便、料理、性格を扱う各単元と同じく、学んだ表現を比べながら確認できる構成になっています。
    glosses:
      जाती: 行く(女性・複数)
      शनिवार: 土曜日
      फूल-मंडी: 花市場
      रंग: 色
      चाहिए: 必要だった/欲しかった
      को: 欲しい人を表す
      लाल: 赤
      पीला: 黄色
      ख़रीदती: 買う
      पाँच: '5'
      फूल: 花(複数)
      दाम: 料金
      सौ: 百
      रुपये: ルピー
      सुंदर: 美しい
