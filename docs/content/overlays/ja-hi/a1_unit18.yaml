teaching:
  hi.a1.unit18.lesson01.teach.ghar_review:
    title: 復習：家
    gloss: 家
    note: ユニット8で学習済み -- このユニット全体のテーマとなる単語です。
    example_gloss: これは家です。
  hi.a1.unit18.lesson01.teach.mein_review:
    title: 復習：～で、～に
    gloss: ~で、~に
    note: ユニット1で学習済み -- このユニットでは、部屋や物の場所を表すのに何度も使います。
    example_gloss: 私は職場で働いています。
  hi.a1.unit18.lesson01.teach.hai_hain_review:
    title: 復習：～です・ある・いる（単数）、（複数）
    gloss: ～です・ある・いる（単数）、（複数）
    note: このユニットの数の表現はすべて、この単数形と複数形のペアが土台になっています。
    example_gloss:
    - これは家です。
    - 私の祖父はデリーに住んでいます。
  hi.a1.unit18.lesson01.teach.numbers_review:
    title: 復習：いくつ、1、2、3
    gloss: いくつ、1、2、3
    note: ユニット2と7で学習済み -- ここでは部屋の数を数えるのに再び使います。
    example_gloss:
    - 私には兄弟が3人います。
    - この家には部屋がいくつありますか？
  hi.a1.unit18.lesson01.teach.kamra_kamre:
    title: 部屋（単数・複数）
    gloss: 部屋
    note: 新しい名詞です。複数形に注意しましょう。*kamra*（1つ）は *kamre*（2つ以上）になります。このレッスンの文法ノートも見てください。
    example_gloss:
    - 家には部屋が1つあります。
    - 家には部屋が3つあります。
  hi.a1.unit18.lesson01.teach.grammar_room_plural:
    title: 男性名詞の -a → -e の複数形
    gloss: 「-a」で終わる男性名詞は、複数形では「-e」に変わります。「kamra」（1つ）は「kamre」（2つ以上）になります。動詞も数によって変わり、1つなら「hai」、2つ以上なら「hain」を使います。例：「ghar mein ek kamra hai」（家には部屋が1つあります）と「ghar mein teen kamre hain」（家には部屋が3つあります）。
    note: このコースで初めて正式に学ぶ名詞の複数形の規則です。
  hi.a1.unit18.lesson01.teach.rasoi:
    title: キッチン
    gloss: キッチン
    note: 新しい名詞です。このユニットで最初に出てくる部屋の単語です。
    example_gloss: 家にはキッチンがあります。
  hi.a1.unit18.lesson01.teach.bathroom:
    title: バスルーム
    gloss: 浴室
    note: 日常のヒンディー語でよく使われる英語由来の外来語で、*doctor*／*engineer*（ユニット16・17）と同じ型です。
    example_gloss: 家にはバスルームがあります。
  hi.a1.unit18.lesson01.teach.bedroom:
    title: 寝室
    gloss: 寝室
    note: こちらも一般的な外来語で、*bathroom* と同じく形が変わりません。独自の複数形語尾は付かず、数詞＋*hain* の形だけを使います。
    example_gloss: 家にはベッドルームが2つあります。
  hi.a1.unit18.lesson01.teach.ghar_mein_kitne_kamre_phrase:
    title: この家には部屋がいくつありますか？
    gloss: この家には部屋がいくつありますか？
    note: このレッスンの最初の質問です。
  hi.a1.unit18.lesson01.teach.ghar_mein_teen_kamre_phrase:
    title: 家には部屋が3つあります。
    gloss: 家には部屋が3つあります。
    note: このレッスンの最初の質問に対する答えの例です。
  hi.a1.unit18.lesson02.teach.aur_review:
    title: 復習:と
    gloss: と・そして
    note: ユニット1で学習済みです。ここでは家具をまとめて挙げるために再び使います。
    example_gloss: 私もそれが気に入りました。あなたはどうですか？
  hi.a1.unit18.lesson02.teach.mez:
    title: テーブル
    gloss: テーブル
    note: 新しい名詞です。このユニットの練習では単数形だけを使います（複数形の規則はまだ学習しません）。
    example_gloss: 台所にテーブルが1つあります。
  hi.a1.unit18.lesson02.teach.kursi_kursiyan:
    title: いす（単数／複数）
    gloss: いす、いす（複数）
    note: 新しい名詞です。複数形に注意しましょう。*kursi*（1脚）が *kursiyan*（複数）になります。*kamra*／*kamre* とは別の規則です。このレッスンの文法ノートを見てください。
    example_gloss:
    - 台所にいすが1脚あります。
    - 台所にいすが4脚あります。
  hi.a1.unit18.lesson02.teach.chaar_review:
    title: 復習：4
    gloss: '4'
    note: ユニット2で学習済みです。ここではいすの数を数えるために再び使います。
    example_gloss: 台所にいすが4脚あります。
  hi.a1.unit18.lesson02.teach.grammar_feminine_plural:
    title: 女性名詞の -i → -iyan の複数形
    gloss: 「-i」で終わる女性名詞は、複数形では「-iyan」になります。「kursi」（1脚）は「kursiyan」（複数）になります。このユニットの前半で「kamra」が男性名詞の規則で「kamre」になったのと同じ変化ですが、規則は異なります。この語は女性名詞で「-i」で終わるからです。
    note: このユニットで2つ目の複数形の規則です。違いが分かりやすいように、1つ目の直後に学習します。
  hi.a1.unit18.lesson02.teach.bistar:
    title: ベッド
    gloss: ベッド
    note: 新しい名詞です。このユニットの練習では単数形だけを使います。
    example_gloss: ベッドルームにベッドが1つあります。
  hi.a1.unit18.lesson02.teach.khidki_khidkiyan:
    title: 窓（単数／複数）
    gloss: 窓、窓（複数）
    note: '*kursi*／*kursiyan* と同じ、女性名詞の「-i」→「-iyan」の複数形の規則に従います。'
    example_gloss:
    - ベッドルームに窓が1つあります。
    - ベッドルームに窓が2つあります。
  hi.a1.unit18.lesson02.teach.rasoi_mein_mez_phrase:
    title: 台所にテーブルが1つあります。
    gloss: 台所にテーブルが1つあります。
    note: 「場所＋物」の型を台所に当てはめた文です。
  hi.a1.unit18.lesson02.teach.bedroom_mein_bistar_phrase:
    title: ベッドルームにベッドが1つあります。
    gloss: ベッドルームにベッドが1つあります。
    note: 「場所＋物」の型をベッドルームに当てはめた文です。
  hi.a1.unit18.lesson03.teach.kaisa_review:
    title: 復習：どんな／どのような
    gloss: どんな／どのような
    note: ユニット12で学習済みです。ここでは家について尋ねるために再び使います。
    example_gloss: あなたの家はどんな家ですか？
  hi.a1.unit18.lesson03.teach.bada_chota_review:
    title: 復習：大きい、小さい
    gloss: 大きい（男性形）、大きい（女性形）、小さい（男性形）、小さい（女性形）
    note: ユニット14で学習済みです。ここでは家を説明するために再び使います。名詞の性に合わせて形が変わります。男性名詞の *ghar* には *bada*／*chota*、女性名詞の *rasoi* には *badi* を使います。
    example_gloss:
    - 私の家は小さいです。
    - これは大きな台所です。
  hi.a1.unit18.lesson03.teach.ya_review:
    title: 復習:または
    gloss: または
    note: ユニット14で学習済みです。ここでは二択の質問をするために再び使います。
    example_gloss: あなたの家は大きいですか、小さいですか？
  hi.a1.unit18.lesson03.teach.arjun_priya_review:
    title: 復習：アルジュン、プリヤ
    gloss: アルジュン、プリヤ
    note: このレッスンの語順・文法チェックの問題で、誰の家について述べているかを示すのに使う2人の名前を、最初に確認します。
    example_gloss:
    - 私の名前はアルジュンです。
    - 私の名前はプリヤです。
  hi.a1.unit18.lesson03.teach.ka_review:
    title: 復習：〜の（所有）
    gloss: 〜の（所有、男性名詞が続く場合）
    note: ユニット7・10・12・14・15で学習済みです。ここでは誰の家について述べているかを示すために再び使い、このユニットでは基本の形のまま使います。
    example_gloss: プリヤの家は小さいです。
  hi.a1.unit18.lesson03.teach.dialogue.line01:
    title: アルジュンがプリヤに家のことを尋ねる
    gloss: プリヤ、あなたの家は大きいですか、小さいですか？
  hi.a1.unit18.lesson03.teach.dialogue.line02:
    title: プリヤが自分の家は小さいと言う
    gloss: 私の家は小さいです。家には部屋が2つあって、台所とバスルームです。
  hi.a1.unit18.lesson03.teach.dialogue.line03:
    title: プリヤが同じ質問をアルジュンに返す
    gloss: あなたの家はどうですか、アルジュン？
  hi.a1.unit18.lesson03.teach.dialogue.line04:
    title: アルジュンが自分の家は大きいと言う
    gloss: 私の家は大きいです。家にはベッドルームが3つと、大きな台所があります。
  hi.a1.unit18.lesson03.teach.dialogue.line05:
    title: プリヤがベッドルームに何があるか尋ねる
    gloss: わあ！ベッドルームには何がありますか？
  hi.a1.unit18.lesson03.teach.dialogue.line06:
    title: アルジュンがベッドルームを説明する
    gloss: ベッドルームにはベッドが1つと窓が2つあります。
  hi.a1.unit18.lesson03.teach.dialogue.line07:
    title: プリヤの反応
    gloss: とてもいいですね！
  hi.a1.unit18.lesson03.teach.dialogue.line08:
    title: アルジュンがお礼を言う
    gloss: ありがとう!
  hi.a1.unit18.lesson03.teach.grammar_summary:
    title: 3つの主な規則
    gloss: このユニットの3つの主な規則：(1)「[場所] + mein + [数] + [名詞] + hai/hain」で、家にあるものとその数を表します。(2)「-a」で終わる男性名詞は、複数形で「-e」になります（kamra → kamre）。(3)「-i」で終わる女性名詞は、複数形で「-iyan」になります（kursi → kursiyan、khidki → khidkiyan）。
    note: ユニット全体の文法をまとめる総括です。ユニット15〜17の活用をまとめる文法ノートと同じ役割です。
  hi.a1.unit18.lesson03.teach.home_reading:
    title: 2つの家についての読み物
    gloss: プリヤの家は小さいです。家には部屋が2つあって、台所とバスルームです。アルジュンの家は大きいです。家にはベッドルームが3つと、大きな台所があります。
    note: 会話で出てきた内容をそのまま短くまとめた紹介文です。新しい情報はありません。「住まいの短い説明を読む」という目標に対応しています。
    glosses:
      घर: 家
      छोटा: 小さい
      कमरे: 部屋（複数）
      रसोई: キッチン
      बाथरूम: 浴室
      बड़ा: 大きい
      बेडरूम: 寝室(複数)
      बड़ी: 大きい（女性形）
