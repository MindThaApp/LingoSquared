teaching:
  hi.a1.unit31.lesson01.teach.lanba_chhota:
    title: 背が高い、背が低い
    gloss: 背が高い／背が低い
    note: '*लंबा* と *छोटा* は身長を表し、たいてい *कद*(「身長」)と一緒に使います:*नेहा का कद लंबा है*。男性名詞には *-ा*、女性名詞には *-ी* の語尾がつきます。'
    example_gloss:
    - ネーハーは背が高いです。
    - ヴィクラムは背が低いです。
  hi.a1.unit31.lesson01.teach.boorha_javan:
    title: 年を取った、若い
    gloss: 年を取った／若い
    note: '*बूढ़ा* と *जवान* は、数字を使わずに、その人が何歳くらいに見えるかを表します。'
    example_gloss:
    - おじいさんは年を取っています。
    - アルジュンは若いです。
  hi.a1.unit31.lesson01.teach.tumharee_umr_kitnee:
    title: उम्र と बूढ़ा
    gloss: おいくつですか?おじいさんは年をとっています。
    note: 正確な年齢をたずねるときは *उम्र*(「年齢」)を使い、*बूढ़ा* は数字を使わずに年をとった人を表します。
  hi.a1.unit31.lesson01.teach.neha_ka_kad:
    title: ネーハーは背が高く、ヴィクラムは背が低い
    gloss: ネーハーは背が高く、ヴィクラムは背が低いです。
    note: '*और*(「と・そして」)で二つの描写をつなぎ、それぞれの *का कद* は男性名詞 *कद* に合わせた形です。'
  hi.a1.unit31.lesson02.teach.bal:
    title: 髪
    gloss: 髪
    note: '*बाल*(「髪」)はヒンディー語では男性・複数の名詞なので、それを説明する語は *-े* で終わります:*लंबे बाल*。'
    example_gloss: アルジュンは短い黒髪です。
  hi.a1.unit31.lesson02.teach.sunahre_bhoore_safed:
    title: 金色・茶色・白
    gloss: 金髪の/茶色の/白い
    note: 髪の色を表す3つの語 *सुनहरे*、*भूरे*、*सफ़ेद*:*बाल* の前では *-े* で終わります。
    example_gloss:
    - プリヤは金髪です。
    - ヴィクラムは茶色の髪です。
    - おじいさんは白髪です。
  hi.a1.unit31.lesson02.teach.lanbe_chhote:
    title: 長い髪と短い髪
    gloss: 長い／短い（髪）
    note: '*लंबे*(「長い」)と *छोटे*(「短い」)は髪を表し、*बाल* が複数形なので *-े* で終わります。'
    example_gloss:
    - ネーハーは髪が長いです。
    - ヴィクラムは髪が短いです。
  hi.a1.unit31.lesson02.teach.lanbe_bal_chhote:
    title: बाल の前の形容詞
    gloss: 長い髪、短い髪、金色の髪、茶色の髪、白い髪、黒い髪。
    note: '*बाल* は男性複数なので、その前の形容詞は *-े* で終わります:*लंबे बाल*、*भूरे बाल*。'
  hi.a1.unit31.lesson02.teach.uske_bal_lanbe:
    title: उसके:彼の/彼女の
    gloss: 彼(彼女)の髪は長いです。
    note: '*उसके* は「彼の」と「彼女の」の両方を意味するので、どちらかは文脈で判断します。ここでは複数形の *बाल* に合わせた形です。'
  hi.a1.unit31.lesson02.teach.arjun_ke_bal:
    title: アルジュンは短い黒髪です
    gloss: アルジュンは短い黒髪です。
    note: '*काले* が今度は髪に使われています。*बाल* が複数形なので *-े* で終わります。'
  hi.a1.unit31.lesson02.teach.priya_ke_bal:
    title: プリヤは長い金髪です
    gloss: プリヤは長い金髪です。
    note: このレッスンで学ぶ長さと色の語彙を、自然な1つの文に組み合わせています。
  hi.a1.unit31.lesson03.teach.ankhen:
    title: 目
    gloss: 目
    note: '*आँखें*(「目」)は女性複数名詞で、単数形は *आँख* です。'
    example_gloss: アルジュンは茶色い目です。
  hi.a1.unit31.lesson03.teach.neela_bhoora_hara:
    title: 青、茶色、緑
    gloss: 青い／茶色い／緑色の
    note: 目の色を表す3つの語 *नीला*、*भूरा*、*हरा*:女性名詞 *आँखें* の前では *नीली*、*भूरी*、*हरी* になります。
    example_gloss:
    - プリヤは青い目です。
    - ヴィクラムは茶色い目です。
    - ネーハーは緑の目です。
  hi.a1.unit31.lesson03.teach.neelee_ankhen_bhooree:
    title: आँखें の前の形容詞
    gloss: 青い目、茶色い目、緑の目。
    note: '*आँखें* は女性名詞なので、その前の形容詞は *-ी* で終わります:*नीली आँखें*。'
  hi.a1.unit31.lesson03.teach.priya_kaisee_dikhtee:
    title: プリヤはどんな外見ですか?
    gloss: プリヤはどんな外見ですか?
    note: '*कैसी दिखती है?*(「どんな見た目ですか?」)は基本の質問です。女性には *कैसी* と *दिखती*、男性には *कैसा* と *दिखता* を使います。'
  hi.a1.unit31.lesson03.teach.priya_ke_bal:
    title: プリヤは長い金髪で青い目です
    gloss: プリヤは長い金髪で青い目です。
    note: 模範解答:髪と目を *और* でつなぎます。持ち主を表す語は、複数形の *बाल* には *के*、女性名詞の *आँखें* には *की* がつきます。
  hi.a1.unit31.lesson04.teach.priya_bhasha_kaife:
    title: プリヤがニーナを紹介する
    gloss: プリヤ:言語カフェに新しい女の子が来るの。名前はニーナよ。
    note: '*आ रही है*(「来る・来ている」)で新しい人を紹介し、*उसका नाम ... है* で名前を伝えます。'
  hi.a1.unit31.lesson04.teach.arjun_oke_vah:
    title: アルジュンがどんな外見か尋ねる
    gloss: アルジュン:オーケー!どんな見た目の子?
    note: '*वह देखने में कैसी है?* は「見た目はどんな感じ?」と尋ねる表現です。*वह* は「彼」にも「彼女」にもなります。'
  hi.a1.unit31.lesson04.teach.priya_uska_kad:
    title: プリヤがニーナの身長と髪を説明する
    gloss: プリヤ:背が低くて、髪は短い金髪よ。
    note: 身長と髪をつなげた文です:*उसका कद छोटा है और उसके बाल छोटे और सुनहरे हैं*。
  hi.a1.unit31.lesson04.teach.arjun_aur_uskee:
    title: アルジュンが目について尋ねる
    gloss: アルジュン:目は?
    note: '*उसकी आँखें* は「彼女の目」という意味で、*आँखें* に合わせて *उसकी* は女性形になります。'
  hi.a1.unit31.lesson04.teach.priya_uskee_ankhen:
    title: プリヤがニーナの目を説明する
    gloss: プリヤ:緑の目よ。
    note: '*आँखें* は女性名詞なので、*हरी* は *-ी* で終わります。'
  hi.a1.unit31.lesson04.teach.arjun_shukriya_tab:
    title: アルジュンは彼女を見つけられる
    gloss: アルジュン:ありがとう!それならすぐ分かるよ。
    note: '*पहचान लूँगा*(「見分けるでしょう」)は *पहचानना* の未来形で、*उसे* は「彼女を」という意味です。'
  hi.a1.unit31.lesson05.teach.vikram_aur_neha:
    title: ヴィクラムとネーハーを比べる
    gloss: ヴィクラムとネーハーは兄妹ですが、見た目は違います。ヴィクラムは背が低く、短い茶色の髪で、目も茶色です。ネーハーはヴィクラムより背が高く、長い茶色の髪で、目は緑です。あなたはどんな外見ですか?
    note: これまでに学んだ色や長さを表す語を使って人の見た目を比べ、最後に自分の見た目について答えます。
    glosses:
      भाई: 兄弟
      बहन: 姉妹
      दिखते: ～に見える
      अलग: 異なる
      छोटा: 背が低い
      छोटे: 背が低い
      भूरे: 茶色の
      बाल: 髪
      भूरी: 茶色の
      आँखें: 目
      लंबी: より背が高い
      लंबे: 長い
      हरी: 緑色の
      कैसे: どんな(「どんな外見ですか」の「どんな」)
  hi.a1.unit31.lesson05.teach.vikram_neha_se:
    title: से で比べる
    gloss: ヴィクラムはネーハーより背が低いです。
    note: ここで *से* は「〜より」という意味で、比べる相手のあとに置きます:*नेहा से छोटा*。形容詞は動詞の直前に来ます。
  hi.a1.unit31.lesson05.teach.neha_ke_bal:
    title: ネーハーはヴィクラムより髪が長いです
    gloss: ネーハーはヴィクラムより髪が長いです。
    note: '*लंबे* は複数形の *बाल*（髪）に合わせた形で、*विक्रम से* が比較の対象（「〜より」）を表します。'
  hi.a1.unit31.lesson05.teach.mere_bal_chhote:
    title: 私は短い茶色の髪をしています
    gloss: 私は短い茶色の髪をしています。
    note: '*मेरे बाल छोटे और भूरे हैं*（「私の髪は短くて茶色です」）は、自分の外見を説明するときの基本の文です。*मेरे* は複数形の *बाल* に合わせた形です。'
  hi.a1.unit31.lesson06.teach.arjun_dekho_kya:
    title: アルジュンがニーナを見つける
    gloss: アルジュン：見て、あれはニーナですか？髪は短い金髪で、目は緑色です。
    note: '*देखो*（「見て」）は友達に使うくだけた命令の形です。'
  hi.a1.unit31.lesson06.teach.priya_han_vahee:
    title: プリヤーが確認する
    gloss: プリヤー：ええ、まさにニーナです！
    note: 短く自然に、そうだと伝える表現です。
  hi.a1.unit31.lesson06.teach.neena_hay_kya:
    title: ニーナがアルジュンに挨拶する
    gloss: ニーナ：こんにちは、アルジュンさんですか？
    note: '*क्या तुम अर्जुन हो?* は、同年代の相手にたずねるシンプルでくだけた質問です。'
  hi.a1.unit31.lesson06.teach.arjun_han_tumse:
    title: アルジュンもニーナに挨拶する
    gloss: アルジュン：はい！はじめまして、ニーナ。
    note: '*तुमसे मिलकर अच्छा लगा* は初対面のときの決まり文句です。うれしい気持ちが「あなたに会って」自分の中に生まれる言い方なので、「私」にあたる語は要りません。'
  hi.a1.unit31.lesson06.teach.neena_mujhe_bhee:
    title: Ninaもあいさつを返します
    gloss: Nina：こちらこそ、はじめまして！
    note: 対話の締めくくりです。アルジュンは、先ほどのプリヤーの説明のおかげでニーナだと分かりました。
