teaching:
  hi.a1.unit14.lesson01.teach.arjun_priya_review:
    title: 復習:アルジュン、プリヤ、〜です
    gloss: アルジュン、プリヤ、〜です
    note: 2人の名前と、「〜です」にあたる 'hai' をさっと復習します。このユニットで比べる文を作るのに必要です。
    example_gloss:
    - アルジュンは元気です。
    - プリヤは元気です。
  hi.a1.unit14.lesson01.teach.bada_badi_review:
    title: 復習:大きい/年上
    gloss: 大きい/年上(男性形/女性形)
    note: ユニット5で兄弟姉妹の年齢を言うときに学びました。このユニットでは、これを2人の人やものを直接比べる場面に広げます。
    example_gloss:
    - 兄はデリーに住んでいます。
    - 姉はデリーに住んでいます。
  hi.a1.unit14.lesson01.teach.chota_choti_review:
    title: 復習:小さい/年下
    gloss: 小さい/年下(男性形/女性形)
    note: ユニット5で兄弟姉妹の年齢を言うときに学びました。ここでも bada/badi と同じように使います。
    example_gloss:
    - 弟は今、学生です。
    - 妹は今、学生です。
  hi.a1.unit14.lesson01.teach.se_comparative_grammar:
    title: Se =「〜より」
    gloss: '''Se'' はすでに「〜から」(ユニット9、''yahan se seedhe jao'')と「〜と」(ユニット12、''Priya se mila'')の意味で学びました。今度は比較の意味でも使います。''X, Y se ADJ hai'' は「XはYより ADJ だ」という意味です -- 例:''Priya Arjun se badi hai''。'
    note: すでに学んだ語の3つ目の意味を紹介します。新しい意味の前に、これまでの2つの意味をユニット番号つきで確認します。
    target_text: '''से'' は以前、''यहाँ से सीधे जाओ''(यूनिット 9、matlab「〜から」)と ''प्रिया से मिला''(यूनिट 12、matlab「〜と」)で学びました。今度は比較にも使います。''X, Y से ADJ है'' は「XはYより ADJ だ」という意味です -- 例:''प्रिया अर्जुन से बड़ी है''。'
  hi.a1.unit14.lesson01.teach.arjun_bada_phrase:
    title: プリヤはアルジュンより年上です。
    gloss: プリヤはアルジュンより年上です。
    note: se を使った比較の文型の、このユニット最初の完全な例文です。
  hi.a1.unit14.lesson01.teach.lamba_lambi:
    title: 背が高い/長い
    gloss: 背が高い/長い(男性形/女性形)
    note: 新しい形容詞のペアです。これまでの -a/-i による男性形・女性形の一致(bada/badi、chota/choti)と同じ規則に従います。
    example_gloss:
    - 兄は背が高いです。
    - 姉は背が高いです。
  hi.a1.unit14.lesson01.teach.agreement_grammar:
    title: 形容詞は主語に合わせる
    gloss: 比べる文では、形容詞(bada/badi、chota/choti など)は、'se' の後ろの語ではなく、いつも主語の性に合わせます。例:'Arjun Priya se chota hai' では、'chota' は男性の主語アルジュンに合わせた形で、プリヤには合わせません。
    note: これまで学んだ -a/-i の形容詞の一致規則を、比べる文にそのまま当てはめたものです。
    target_text: तुलना के वाक्य में विशेषण (जैसे बड़ा/बड़ी, छोटा/छोटी) हमेशा विषय (subject) के लिंग से मेल खाता है, 'से' के बाद वाले शब्द के नहीं -- जैसे 'अर्जुन प्रिया से छोटा है' में 'छोटा' अर्जुन (पुल्लिंग विषय) से मेल खाता है, प्रिया से नहीं।
  hi.a1.unit14.lesson01.teach.priya_chota_phrase:
    title: アルジュンはプリヤより年下です。
    gloss: アルジュンはプリヤより年下です。
    note: 同じ事実を反対の側から言い直した文です。男性の主語に形容詞が合う例になります。
  hi.a1.unit14.lesson01.teach.kaun_ya_review:
    title: 復習:誰、または
    gloss: 誰、または
    note: どちらもすでに学んだ語です(ユニット5と、ユニット6/13)。ここでは比べる質問を作るのに使います。
    example_gloss: アルジュンとプリヤ、どちらが年上ですか。
  hi.a1.unit14.lesson02.teach.topi_bag_review:
    title: 復習:帽子、バッグ
    gloss: 帽子、バッグ
    note: どちらもユニット7の買い物の場面で学んだ名詞です。ここでは比べる2つのものとして使います。
    example_gloss:
    - この帽子はすてきです。
    - このバッグはすてきです。
  hi.a1.unit14.lesson02.teach.sasta_mehnga_review:
    title: 復習:安い、高い
    gloss: 安い、高い
    note: ユニット7で学びました。ここでは、ものを比べるのに使います。
    example_gloss:
    - バッグは安いです。
    - そのバッグは高いです。
  hi.a1.unit14.lesson02.teach.sasti_mehngi_note:
    title: 女性形:sasti、mehngi
    gloss: '''Sasta'' と ''mehnga'' は、女性名詞と一緒のときは ''sasti'' と ''mehngi'' になります -- 例:''topi sasti hai''(帽子は安いです)。'
    note: ユニット7で学んだ性の一致規則の簡単な復習です。'topi'(帽子)は女性名詞なので必要になります。
  hi.a1.unit14.lesson02.teach.se_object_phrase:
    title: 帽子はバッグより安いです。
    gloss: 帽子はバッグより安いです。
    note: se を使った比較の文型を、2人の人ではなく2つのものに当てはめた例です。
  hi.a1.unit14.lesson02.teach.zyada_review:
    title: 復習:もっと
    gloss: もっと
    note: ユニット13では 'pasand hai' と一緒に(好みを表すときだけ)学びました。このレッスンでは、使い方を広げます。
    example_gloss: お茶のほうが好きです。
  hi.a1.unit14.lesson02.teach.zyada_mehnga_grammar:
    title: どんな比較にも使える zyada
    gloss: '''Zyada'' はこれまで ''pasand hai'' と一緒にしか学んでいませんでした(ユニット13)。今度は、比べる文のどんな形容詞の前にも置けます -- ''bag topi se zyada mehnga hai'' は「バッグは帽子より高いです」という意味で、''bag topi se mehnga hai'' とまったく同じです。''Zyada'' はなくてもかまいません。「もっと」をはっきり言うだけです。'
    note: すでに学んだ単語の位置の規則を一般化して示したものです。新しい文法事項ではありません。
  hi.a1.unit14.lesson02.teach.zyada_mehnga_phrase:
    title: バッグは帽子より高いです。
    gloss: バッグは帽子より高いです。
    note: se を使った比較の同じ型に、省略できる zyada(より)をはっきり入れた形です。
  hi.a1.unit14.lesson02.teach.naya_nai:
    title: 新しい
    gloss: 新しい(男性形/女性形)
    note: 新しい形容詞のペアです。この単元の他の形容詞と同じ -a/-i の一致パターンに従います。
    example_gloss:
    - バッグは新しいです。
    - 帽子は新しいです。
  hi.a1.unit14.lesson02.teach.topi_nai_phrase:
    title: 帽子はバッグより新しいです。
    gloss: 帽子はバッグより新しいです。
    note: 同じ二つの物の間で、二つ目の比較(新しさ)を表します。すでに学んだ値段の比較と同じ型です。
  hi.a1.unit14.lesson03.teach.review_words:
    title: 復習:大きい、小さい、背が高い、新しい
    gloss: 大きい/年上の、小さい/年下の、背が高い/長い、新しい
    note: この単元の主な形容詞の簡単な復習です。会話と読み物で必要になります。
    example_gloss:
    - プリヤは年上です。
    - アルジュンは年下です。
    - アルジュンは背が高いです。
    - バッグは新しいです。
  hi.a1.unit14.lesson03.teach.main_hun_review:
    title: 復習:私、(です)
    gloss: 私、(です)
    note: 第1単元で学びました(「main theek hun」)。会話でアルジュンが自分のことを話すために必要です。
    example_gloss: 私は元気です。
  hi.a1.unit14.lesson03.teach.aur_bhi_review:
    title: 復習:と、も
    gloss: と、も
    note: どちらもこれまでの会話文に出てきましたが、テスト対象の語彙として正式に扱うのはここが初めてです。
    example_gloss:
    - 私は紅茶とコーヒーが好きです。
    - 私もそれが好きです。
  hi.a1.unit14.lesson03.teach.ka_review:
    title: 復習:〜の(所有)
    gloss: 〜の(所有を表す語)
    note: 第5〜11単元など、これまでのコースで使ってきた所有を表す語です。ここでは、誰のバッグを比べているかを話すために再び使います。
    example_gloss: アルジュンのバッグは新しいです。
  hi.a1.unit14.lesson03.teach.dialogue.line01:
    title: アルジュンが新しいバッグを見せる
    gloss: プリヤ、これは私の新しいバッグだよ。
  hi.a1.unit14.lesson03.teach.dialogue.line02:
    title: プリヤが帽子のほうが安いと言う
    gloss: いいバッグね!でも帽子はバッグより安いよ。
  hi.a1.unit14.lesson03.teach.dialogue.line03:
    title: アルジュンが自分のバッグは高いと認める
    gloss: うん。僕のバッグは高いよ。帽子より高いんだ。
  hi.a1.unit14.lesson03.teach.dialogue.line04:
    title: プリヤがどちらが年上か尋ねる
    gloss: はいはい!アルジュン、どっちが年上? あなた、それとも私?
  hi.a1.unit14.lesson03.teach.dialogue.line05:
    title: アルジュンが答える
    gloss: 君のほうが年上だけど、僕は背が高いよ!
  hi.a1.unit14.lesson03.teach.dialogue.line06:
    title: プリヤが帽子のほうが新しいとも言う
    gloss: はいはい!でも帽子はバッグより新しくもあるよ。
  hi.a1.unit14.lesson03.teach.dialogue.line07:
    title: アルジュンが認めて話を締める
    gloss: うん、その通りだね。明日また会おうか?
  hi.a1.unit14.lesson03.teach.dialogue.line08:
    title: プリヤが話を締める
    gloss: いいよ!また明日ね。
  hi.a1.unit14.lesson03.teach.grammar_summary:
    title: 三つの主な規則
    gloss: この単元の三つの主な規則:(1)「X, Y se ADJ hai」は「XはYよりADJだ」という意味です。(2)ADJは常に主語(X)の性に一致し、Yには一致しません。(3)ADJの前に「zyada」を加えて「X, Y se zyada ADJ hai」と言うこともできます。意味は変わりません(「YよりADJ」)。
    note: この単元の文法全体をまとめる締めくくりの説明です。第13単元の文法のまとめに対応します。
    target_text: 'इस यूनिट के तीन मुख्य नियम: (1) ''X, Y से ADJ है'' は「XはYより ADJ だ」という意味; (2) ADJ हमेशा विषय (X) के लिंग से मेल खाता है, Y से नहीं; (3) ADJ से पहले ''ज़्यादा'' भी जोड़ सकते हैं, जैसे ''X, Y से ज़्यादा ADJ है'' -- 意味は同じです(「Yより ADJ」)。'
  hi.a1.unit14.lesson03.teach.priya_note:
    title: プリヤのメモ
    gloss: 私はアルジュンより年上ですが、アルジュンは背が高いです。それに、私の帽子はすてきです。帽子はバッグより安いし、バッグより新しくもあります。——プリヤ
    note: 会話ですでに出た事実をそのまま書き直した短いメモです。新しい内容はありません。
    glosses:
      बड़ी: 年上の(女性形)
      लंबा: 背が高い
      टोपी: 帽子
      अच्छी: すてきな/良い(女性形)
      बैग: バッグ
      सस्ती: より安い/安い(女性形)
      नई: より新しい/新しい(女性形)
