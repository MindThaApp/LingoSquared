teaching:
  hi.a1.unit13.lesson01.teach.chai_coffee_review:
    title: 復習：チャイ、コーヒー
    gloss: お茶、コーヒー
    note: 好き嫌いを話すために必要な、ユニット6の単語の簡単な復習です。
    example_gloss:
    - お茶が欲しいです。
    - コーヒーが欲しいです。
  hi.a1.unit13.lesson01.teach.mujhe_review:
    title: 復習：私に
    gloss: 私に
    note: 以前に学んだ与格の代名詞（「〜に」）で、第6・7・11ユニットでも繰り返し使いました。このユニットでは、新しい述語と組み合わせます。
    example_gloss: お茶が欲しいです。
  hi.a1.unit13.lesson01.teach.pasand:
    title: 好み／気に入っている
    gloss: 好き・好み
    note: 「好み」を意味する名詞です（「お気に入り」ではありません）。与格の主語（mujhe/tumhein）と、be動詞にあたる hai/hain を組み合わせて、「〜が好きです」という表現を作ります。
    example_gloss: 私はお茶が好きです。
  hi.a1.unit13.lesson01.teach.pasand_hai_grammar:
    title: Pasand hai = 好きです
    gloss: '''Pasand hai'' は「Xは私にとって好ましい」、つまり「Xが好きです」という意味です。''mujhe...chahiye''（第6ユニット）と同じように mujhe/tumhein で始まりますが、''chahiye'' の後には ''hai'' が付かないのに対し、''pasand'' の後には必ず ''hai'' または ''hain'' が付きます。'
    note: chahiye（欲しい・必要）と pasand hai（好き）の構造の違いをはっきり示し、2つの表現を混同しないようにします。
  hi.a1.unit13.lesson01.teach.sangeet:
    title: 音楽
    gloss: 音楽
    note: 新しい名詞です。単数で数えない名詞を主語にして、pasand hai の文型を練習します。
    example_gloss: 私は音楽が好きです。
  hi.a1.unit13.lesson01.teach.haan_nahi_review:
    title: 復習：はい、いいえ（〜ない）
    gloss: はい、いいえ
    note: 初期に学んだ2つの単語の簡単な復習です。このユニットで好みの質問に答えたり否定したりするのに必要です。
    example_gloss:
    - はい、音楽が好きです。
    - いいえ、コーヒーは好きではありません。
  hi.a1.unit13.lesson01.teach.pasand_nahi_hai_phrase:
    title: コーヒーは好きではありません。
    gloss: コーヒーは好きではありません。
    note: 否定文は、これまでに学んだ他の hai の文（例：第3ユニットの 'yoga class nahin hai'）とまったく同じです。nahin を hai のすぐ前に置きます。
  hi.a1.unit13.lesson01.teach.kitab_kitaben:
    title: 本／本（複数）
    gloss: 本／本（複数）
    note: 単数と複数がそろった新しい名詞です。pasand の後の 'hai'/'hain' が、好きな物の数に一致することを示すために使います。
    example_gloss:
    - その本が好きです。
    - 本が好きです。
  hi.a1.unit13.lesson01.teach.number_agreement_grammar:
    title: pasand の後の Hai と hain
    gloss: '''pasand'' の後の ''hai'' か ''hain'' かは、好きな物の数によって決まります。''mere paas...hai/hain''（第2ユニット）とまったく同じです：tea/music pasand hai（単数）、books pasand hain（複数）。'
    note: 第2ユニットで学んだ hai/hain の数の一致のルールを新しい場面に広げるもので、新しい文法事項ではありません。
  hi.a1.unit13.lesson02.teach.tumhein_review:
    title: 復習：あなたに（親しい間柄）
    gloss: あなたに(親しい相手へ)
    note: 第6ユニットで chahiye と一緒に初めて学びました（'tumhein...chahiye?'）。このユニットでは、同じ与格の代名詞を pasand hai と組み合わせて使います。
    example_gloss: 音楽は好きですか？
  hi.a1.unit13.lesson02.teach.kya_tumhein_pasand_hai_grammar:
    title: Kya tumhein...pasand hai?
    gloss: 文頭の 'Kya' は、はい／いいえで答える疑問文の目印です（第1ユニット）。'tumhein' は、'tumhein...chahiye?'（第6ユニット）で使った与格の主語の型をそのまま繰り返したものです。ここでは 'chahiye' の代わりに 'pasand hai' が入ります。
    note: すでに知っている疑問文の型をもう一度使うだけで、新しい文法事項ではありません。
  hi.a1.unit13.lesson02.teach.khel:
    title: スポーツ／ゲーム
    gloss: スポーツ・ゲーム
    note: 新しい名詞です。'khel' は単数と複数で形が変わらないため、例文では 'yah'（この）と組み合わせて、数の一致がはっきりわかるようにしています。
    example_gloss: このスポーツが好きです。
  hi.a1.unit13.lesson02.teach.yah_review:
    title: 復習：この・これ
    gloss: これ
    note: 第7ユニットで初めて学びました（'mujhe yah chahiye'）。ここでは 'khel' が単数であることをはっきり示すために再び使います。
    example_gloss: この本はいい本です。
  hi.a1.unit13.lesson02.teach.ya_review:
    title: 復習：または
    gloss: または
    note: 第6・7ユニットで、食べ物や品物を注文するときに学びました。ここでは、好みについて選択を尋ねる質問に再び使います。
    example_gloss: 紅茶ですか、コーヒーですか？
  hi.a1.unit13.lesson02.teach.chai_ya_coffee_phrase:
    title: 紅茶とコーヒーのどちらが好きですか？
    gloss: 紅茶とコーヒーのどちらが好きですか？
    note: このレッスンの tumhein の疑問文の型と、すでに学んだ ya（または）を組み合わせて、相手に選んでもらう質問にします。
  hi.a1.unit13.lesson02.teach.zyada:
    title: もっと
    gloss: もっと
    note: 新しい単語です。すでに名前を挙げた2つの物のうち、どちらが好きかを表すために、'pasand hai' のすぐ前に置きます。
    example_gloss: 紅茶のほうが好きです。
  hi.a1.unit13.lesson02.teach.zyada_pasand_grammar:
    title: Zyada pasand hai = 〜のほうが好き
    gloss: '''X zyada pasand hai'' は、2つの物のうち一方をより好むという意味です。''mujhe chai zyada pasand hai'' は「紅茶のほうが好きです」という意味になります。'
    note: 語彙の広がりで、新しい文法ではありません。'zyada' が、すでに学んだ 'pasand hai' を修飾するだけです。
    target_text: '''X ज़्यादा पसंद है'' का मतलब है दो चीज़ों में से एक को तरजीह देना (好む・選ぶ) -- ''मुझे चाय ज़्यादा पसंद है'' का मतलब है ''मैं दूसरी चीज़ों से ज़्यादा चाय पसंद करता हूँ'' (私はチャイのほうが好きです / チャイを選びます)।'
  hi.a1.unit13.lesson03.teach.review_words:
    title: 復習：音楽、スポーツ、本
    gloss: 音楽、スポーツ／ゲーム、本
    note: このユニットの重要な名詞の簡単な復習です。会話と読み物のノートで必要になります。
    example_gloss:
    - 私は音楽が好きです。
    - このスポーツは好きではありません。
    - 本が好きです。
  hi.a1.unit13.lesson03.teach.dialogue.line01:
    title: アルジュンが音楽について尋ねる
    gloss: プリヤ、音楽は好きですか？
  hi.a1.unit13.lesson03.teach.dialogue.line02:
    title: プリヤは音楽が大好きだと答える
    gloss: はい、音楽が大好きです。あなたは？
  hi.a1.unit13.lesson03.teach.dialogue.line03:
    title: アルジュンも同じで、スポーツも好きだと付け加える
    gloss: 私もです！スポーツも好きです。
  hi.a1.unit13.lesson03.teach.dialogue.line04:
    title: プリヤはこのゲームより本が好き
    gloss: いいですね！このゲームは好きではありません。本が好きです。
  hi.a1.unit13.lesson03.teach.dialogue.line05:
    title: アルジュンが紅茶かコーヒーかを尋ねる
    gloss: わかりました。紅茶とコーヒーのどちらが好きですか？
  hi.a1.unit13.lesson03.teach.dialogue.line06:
    title: プリヤは紅茶のほうが好き
    gloss: 紅茶のほうが好きです。
  hi.a1.unit13.lesson03.teach.dialogue.line07:
    title: アルジュンも同じ意見
    gloss: すばらしい！私も紅茶が好きです。
  hi.a1.unit13.lesson03.teach.dialogue.line08:
    title: プリヤが会話を締めくくる
    gloss: わかりました！明日また会いましょうか？
  hi.a1.unit13.lesson03.teach.chahiye_pasand_zyada_grammar:
    title: 関連する3つのパターン
    gloss: このユニットの3つのパターン：'chahiye'（欲しい・必要、第6ユニット）の後には 'hai' が付かない。'pasand hai/hain'（このユニット）は、物の数によって形が変わる。'zyada pasand hai' は、2つの物のうち一方をより好むという意味。
    note: ユニット全体の文法をまとめる締めくくりのノートで、第12ユニットの活用表をまとめた文法ノートに対応しています。
    target_text: 'इस यूनिट के तीन तरीके: ''चाहिए'' (चाहना/ज़रूरत, यूनिट 6) के बाद ''है'' नहीं आता; ''पसंद है/हैं'' (यह यूनिट) चीज़ की संख्या से बदलता है; ''ज़्यादा पसंद है'' का मतलब है दो में से एक को तरजीह देना (好む・選ぶ)।'
  hi.a1.unit13.lesson03.teach.priya_note:
    title: プリヤのメモ
    gloss: アルジュンへ。音楽が大好きです。本も好きです。このゲームは好きではありません。紅茶のほうが好きです。――プリヤ
    note: 会話ですでにわかった内容をそのまま書いた短いメモで、新しい情報はありません。
    glosses:
      संगीत: 音楽
      बहुत: とても
      पसंद: 好まれる／気に入った
      किताबें: 本(複数)
      खेल: ゲーム
      नहीं: ~ない
      चाय: お茶
      ज़्यादा: より／むしろ
