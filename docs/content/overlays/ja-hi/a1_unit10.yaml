units:
  hi.a1.unit10.routines:
    title: 毎日の生活
lessons:
  hi.a1.unit10.lesson01.uthna_nashta_kaam:
    title: 起きる、朝食、仕事に行く
  hi.a1.unit10.lesson02.tum_kab_uthte_ho:
    title: いつ起きますか?
  hi.a1.unit10.lesson03.priya_arjun_dincharya:
    title: プリヤとアルジュン:毎日の生活
teaching:
  hi.a1.unit10.lesson01.teach.review_time:
    title: 復習:〜時、朝、昼、夕方、夜、〜に
    gloss: 〜時、朝、昼、夕方、夜、〜に(時を表す)
    note: 第4課で学んだ時を表す言葉の簡単な復習です。この課でもたくさん使います。
    example_gloss:
    - 今は朝の8時です。
    - 夜は授業がありません。
  hi.a1.unit10.lesson01.teach.uthna:
    title: 起きます
    gloss: 起きます(男性の話し手/女性の話し手)
    note: この課で最初の習慣を表す現在形の動詞です。第5課で学んだ -ta/-tee のパターン(rahta hai/rahtee hai)を、hoon を使って一人称に広げます。
    example_gloss:
    - 私は朝7時に起きます。
    - 私は朝6時に起きます。
  hi.a1.unit10.lesson01.teach.roz:
    title: 毎日
    gloss: 毎日
    note: 毎日の習慣を話すときに使う新しい副詞です。
    example_gloss: 私は毎朝起きます。
  hi.a1.unit10.lesson01.teach.nashta_karna:
    title: 朝食を食べます
    gloss: 朝食を食べます(男性の話し手/女性の話し手)
    note: 「nashta」(朝食)は「karta/kartee hoon」(します)と組み合わせて使います。
    example_gloss:
    - 朝は朝食を食べます。
    - 朝は朝食を食べます。
  hi.a1.unit10.lesson01.teach.kaam_par_jaana:
    title: 仕事に行きます
    gloss: 仕事に行きます(男性の話し手/女性の話し手)
    note: 「Kaam par jaana」(仕事に行く)には「par」(〜で/〜に)が必要な決まった表現です。この課の後半に出てくる「school jaana」は、余分な言葉を必要としません。
    example_gloss:
    - そのあと、仕事に行きます。
    - そのあと、仕事に行きます。
  hi.a1.unit10.lesson01.teach.habitual_paradigm_note:
    title: 習慣を表す現在形のパターン
    gloss: 毎日の習慣を表すには、動詞に -ta/-tee/-te をつけ、主語に応じて hoon/ho/hai/hain を添えます。私は起きます(男性/女性)は「hoon」、あなたは起きますは「ho」、彼/彼女は起きますは「hai」、彼らは起きますは「hain」です。
    note: このパターン全体を最初に示します(第1課の会話で少し出てきており、第5課で三人称を整理しました)。この課の練習で、まだ習っていない形を推測させることがないようにするためです。
  hi.a1.unit10.lesson01.teach.full_routine_phrase:
    title: 私の朝、順を追って
    gloss: 私は毎朝7時に起きて、それから朝食を食べて、それから仕事に行きます。
    note: この課の3つの日課の動詞を、順序のある自然な1つの文にまとめます。
  hi.a1.unit10.lesson02.teach.sona:
    title: 私は寝ます
    gloss: 寝ます(男性の話し手/女性の話し手)
    note: 同じ -ta/-tee + hoon のパターンを新しい動詞に当てはめます。
    example_gloss:
    - 私は夜11時に寝ます。
    - 私は夜10時に寝ます。
  hi.a1.unit10.lesson02.teach.school_jaana:
    title: 学校に行きます
    gloss: 学校に行きます(男性の話し手/女性の話し手)
    note: 「kaam par jaana」とは違い、「school jaana」は「jaana」の前に余分な言葉が要りません。
    example_gloss:
    - 私は毎朝8時に学校に行きます。
    - 私は毎朝8時に学校に行きます。
  hi.a1.unit10.lesson02.teach.tum_form_note:
    title: tum の形:-te/-tee + ho
    gloss: 「tum」(あなた、くだけた言い方)には、動詞に -te/-tee と「ho」がつきます。起きますか(男性に)/起きますか(女性に)、寝ますか(男性に)/寝ますか(女性に)。
    note: 第1課で出てきた同じ活用表のうち、二人称の部分です。
  hi.a1.unit10.lesson02.teach.addressee_gender_note:
    title: tum の形は誰の性に合わせる?
    gloss: tum の形の動詞は、話し手ではなく、尋ねられる相手の性に合わせます。プリヤに「いつ起きますか?」と尋ねるときは女性形、アルジュンに「いつ起きますか?」と尋ねるときは男性形を使います。
    note: 見落としやすい大切なポイントです。第3課の会話に出てくる tum の形の文はすべてこの通りになっています。
  hi.a1.unit10.lesson02.teach.kab_uthte_ho_phrase:
    title: いつ起きますか?
    gloss: いつ起きますか?(男性に尋ねる)
    note: この課で習った tum の形を使った、そのまま使える質問です。
  hi.a1.unit10.lesson02.teach.pahle_phir_routine:
    title: まず起きて、それから朝食を食べます
    gloss: まず私は起きて、それから朝食を食べます。
    note: 第9課の道順の説明で使った「pahle」「phir」(まず/それから)を、今度は日課の順序を言うのに使います。
  hi.a1.unit10.lesson02.teach.kaam_idiom_note:
    title: Kaam par と school の違い
    gloss: 「Kaam par jaana」(仕事に行く)には「par」が必要ですが、「school jaana」(学校に行く)には余分な言葉は要りません。どちらも正しく、よく使われます。
    note: 例外のある一つの決まりではなく、慣用表現としての本当の違いです。
  hi.a1.unit10.lesson03.teach.vaapas:
    title: 戻す
    gloss: 戻す/返す
    note: 「aana」(来る)と一緒に使って「戻ってくる」の意味になります。
    example_gloss: 私は戻ります。
  hi.a1.unit10.lesson03.teach.aana:
    title: 来ます
    gloss: 来ます(男性の話し手/女性の話し手)
    note: すでに学んだ習慣を表す現在形のパターンに沿った新しい動詞です。
    example_gloss:
    - 私は夕方に戻ってきます。
    - 私は夕方に戻ってきます。
  hi.a1.unit10.lesson03.teach.khana_verb:
    title: 食事をします
    gloss: 食事をします(男性の話し手/女性の話し手)
    note: 名詞の「khana」(食べ物、第6課)と動詞の「khana」(食べる)が重なっています。ヒンディー語ではよくある自然な形で、間違いではありません。
    example_gloss:
    - 私は夜に食事をします。
    - 私は夜に食事をします。
  hi.a1.unit10.lesson03.teach.raat_ka_khana:
    title: 夕食
    gloss: 夕食(直訳:「夜の食事」)
    note: すでに習った「raat」(夜)、「ka」(〜の)、「khana」(食べ物)を組み合わせています。
    example_gloss: 夕食はとてもおいしいです。
  hi.a1.unit10.lesson03.teach.dialogue.line01:
    title: アルジュンがプリヤに起きる時間を尋ねる
    gloss: アルジュンはプリヤに、毎日何時に起きるのか尋ねます。
    note: 女性形の tum の形を使って、プリヤに正しく呼びかけています。
  hi.a1.unit10.lesson03.teach.dialogue.line02:
    title: プリヤの答え
    gloss: プリヤ:私は毎朝6時に起きます。それから朝食を食べます。
  hi.a1.unit10.lesson03.teach.dialogue.line03:
    title: アルジュンが自分の日課を話す
    gloss: アルジュン:いいですね!私は7時に起きます。私も朝食を食べて、それから仕事に行きます。
  hi.a1.unit10.lesson03.teach.dialogue.line04:
    title: プリヤがアルジュンに帰る時間を尋ねる
    gloss: プリヤはアルジュンに、いつ戻ってくるのか尋ねます。
    note: 男性形の tum の形を使って、アルジュンに正しく呼びかけています。会話の中で「vaapas aana」が初めて出てきます。
  hi.a1.unit10.lesson03.teach.dialogue.line05:
    title: アルジュンが夜の過ごし方を話す
    gloss: アルジュン:私は夕方6時に戻ってきます。それから夕食を食べて、それから寝ます。
  hi.a1.unit10.lesson03.teach.dialogue.line06:
    title: プリヤが夜の過ごし方を話す
    gloss: プリヤ:私も夕方に戻ってきて、それから食事をします。
  hi.a1.unit10.lesson03.teach.dialogue.line07:
    title: アルジュンがプリヤに寝る時間を尋ねる
    gloss: アルジュンはプリヤに、何時に寝るのか尋ねます。
    note: ここでも女性形の tum の形で、プリヤに正しく呼びかけています。
  hi.a1.unit10.lesson03.teach.dialogue.line08:
    title: プリヤが答えて会話を終える
    gloss: プリヤ:私は夜11時に寝ます。わかりました、また明日会いましょう!
  hi.a1.unit10.lesson03.teach.dialogue.line09:
    title: アルジュンが会話を終える
    gloss: アルジュン:わかりました、またね!
