  hi.a1.unit35.lesson03.teach.chek_karna_men:
    title: 変わるのは करना だけ
    gloss: '*चेक करना*では*चेक*は変わらず、*करना*だけが人称に合わせて変わります。*मैं चेक करता हूँ*、*तुम चेक करते हो*。*इस्तेमाल करना*も同じです。'
    note: ヒンディー語の動詞の多くは、名詞や外来語に*करना*が付いた形です。最初の語は一度覚えれば十分で、変わるのは*करना*だけです。
  hi.a1.unit35.lesson03.teach.vikram_mausam_ka:
