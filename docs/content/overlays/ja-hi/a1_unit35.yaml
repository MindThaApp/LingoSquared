    note: あいさつの単元で学んだ別れの表現を、特定の日を示す形に広げます。
  hi.a1.unit35.lesson05.teach.priya_har_din:
    title: 誰が何を使いますか？
    gloss: プリヤは毎日アルジュンに電話します。アプリではなく、携帯電話を使います。アルジュンは家にパソコンがありませんが、携帯電話でインターネットを使います。ヴィクラムは毎朝天気予報を調べます。それから走りに行きます。ネーハーはよくプリヤにメッセージを送ります。あなたも毎日携帯電話を使いますか？
    note: 4人の機器の使い方を比較する、スポーツの単元と同じ形式の読解です。
