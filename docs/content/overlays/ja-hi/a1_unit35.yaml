  hi.a1.unit35.lesson02.teach.maisej_bhejte_bhee:
    title: 動詞は人称に合わせて変わる
    gloss: '*मैसेज*は送ることも読むこともでき、動詞の語尾は人称に合わせて変わります。*मैं भेजता हूँ*（私は送ります）、*तुम पढ़ते हो*（あなたは読みます）、*वह पढ़ता है*（彼は読みます）。'
    note: 新しい単語を、天気の単元ですでに学んだ複合名詞と結び付けています。
