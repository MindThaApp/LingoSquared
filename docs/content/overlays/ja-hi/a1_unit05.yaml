teaching:
  hi.a1.unit05.lesson01.teach.parivar:
    title: 家族
    gloss: 家族
    note: 家族を表す一般的な語で、このユニット全体で使います。
    example_gloss: 私の家族はインドにいます。
  hi.a1.unit05.lesson01.teach.pita_maa:
    title: 父、母
    gloss: 父、母
    note: 紹介するとき、どちらも *hai* ではなく敬意を表す複数形 *hain* を取ります。また *pita* には *mera* ではなく *mere* がつきます。このレッスンの後半にある敬称の説明を参照してください。
    example_gloss:
    - こちらは私の父です。
    - こちらは私の母です。
  hi.a1.unit05.lesson01.teach.bhai_behan:
    title: 兄弟、姉妹
    gloss: 兄・弟、姉・妹
    note: このユニットの中心となる、mera/meri の使い分けを学ぶペアです:*mera bhai*、*meri behan*。
    example_gloss:
    - 私には兄(弟)がいます。
    - 私には姉(妹)がいます。
  hi.a1.unit05.lesson01.teach.ek_as_article:
    title: 数字以外で使う Ek(「ひとりの」「ある」)
    gloss: '*Ek* は数を数えるときの「1」を表すほか、「ひとりの〜」のようにも使えます:*mera ek bhai hai*(私には兄弟が一人います)。'
    note: 数字の1としてすでに学んだ語と同じです。ヒンディー語には、不定冠詞にあたる別の語はありません。
  hi.a1.unit05.lesson01.teach.mata_pita:
    title: 両親
    gloss: 両親
    note: '*mata*(母、改まった語)と *pita*(父)を組み合わせた複合語で、「両親」を表す標準的な語です。'
    example_gloss: 私の両親はデリーに住んでいます。
  hi.a1.unit05.lesson01.teach.mera_meri_note:
    title: Mera と meri の違い
    gloss: '*Mera* は男性名詞に、*meri* は女性名詞に使います:*mera bhai*、*meri behan*。'
    note: このユニットの中心となる文法事項です。所有を表す語は、話し手ではなく、所有されている人や物に合わせて変わります。
  hi.a1.unit05.lesson01.teach.mere_honorific_note:
    title: 敬うべき年長者に使う Mere
    gloss: 年長者への敬意から、一人を指す場合でも *mera* は *mere*、*hai* は *hain* になります:*yeh mere pita hain*(こちらは私の父です)。
    note: 誤りではなく、れっきとした慣習です。敬うべき家族の年長者(父、祖父)を一人指す場合は、このような複数形に見える形を取ります。母や祖母は *meri* のままですが、同じ理由で動詞は複数形(*hain*)になります。
  hi.a1.unit05.lesson01.teach.yah_mera_bhai_hai:
    title: こちらは私の兄(弟)です
    gloss: こちらは私の兄弟です。
    note: 男性形そのままの言い方です。兄弟に敬称は必要ありません。
  hi.a1.unit05.lesson01.teach.yah_meri_behan_hai:
    title: これは私の姉(妹)です
    gloss: これは私の姉(妹)です。
    note: '*behan* に合わせた、女性形そのままの言い方です。'
  hi.a1.unit05.lesson01.teach.yah_kaun_hai:
    title: こちらはどなたですか?
    gloss: これは誰ですか。
    note: 家族を紹介するときに使える、簡単で便利な質問です。
  hi.a1.unit05.lesson02.teach.dada_dadi:
    title: 父方の祖父、祖母
    gloss: 父方の祖父、父方の祖母
    note: お父さんの両親を指します。母方の祖父母との違いは、このレッスンの後半のノートで確認します。
    example_gloss:
    - 祖父はデリーに住んでいます。
    - 祖母はデリーに住んでいます。
  hi.a1.unit05.lesson02.teach.nana_nani:
    title: 母方の祖父、祖母
    gloss: 母方の祖父、母方の祖母
    note: お母さんの両親を指します。ヒンディー語では、父方の祖父母とはまったく別の言葉の組み合わせを使います。
    example_gloss:
    - 母方の祖父はムンバイに住んでいます。
    - 母方の祖母はムンバイに住んでいます。
  hi.a1.unit05.lesson02.teach.dilli_mumbai:
    title: デリー、ムンバイ
    gloss: デリー、ムンバイ
    note: インドの二大都市です。このレッスンでは、家族の住んでいる場所の例に使います。
    example_gloss:
    - 私の家族はデリーに住んでいます。
    - 兄(弟)はムンバイに住んでいます。
  hi.a1.unit05.lesson02.teach.dada_nana_note:
    title: 2組の祖父母
    gloss: 父の両親は *dada-dadi*、母の両親は *nana-nani* です。
    note: 日本語では父方・母方に関係なく「祖父」「祖母」と言いますが、ヒンディー語では家系の側によってまったく別の言葉を使います。
  hi.a1.unit05.lesson02.teach.rehna_verb:
    title: 住んでいる(rehna)
    gloss: 住んでいる(男性/女性/敬意・複数)
    note: 「住む」という意味の動詞です。男性には *rehta hai*、女性には *rehti hai*、複数の人や目上の人には *rehte hain* を使います。
    example_gloss:
    - 兄(弟)はデリーに住んでいます。
    - 姉(妹)はムンバイに住んでいます。
    - 祖父母はデリーに住んでいます。
  hi.a1.unit05.lesson02.teach.tumhara_tumhari:
    title: あなたの(くだけた言い方)
    gloss: あなたの(くだけた言い方、男性/女性)
    note: くだけた *tum* の言い方に対応する「〜の」です。*mera/meri* と同じように、後ろの名詞に合わせて形が変わります。
    example_gloss:
    - あなたのお兄さん(弟さん)はどこに住んでいますか?
    - あなたのお姉さん(妹さん)はどこに住んでいますか?
  hi.a1.unit05.lesson02.teach.mera_tumhara_note:
    title: meraとtumharaを一緒に
    gloss: '*mera* と *tumhara* はどちらも男性名詞に、*meri* と *tumhari* はどちらも女性名詞に付きます。例:*mera bhai*/*tumhara bhai*、*meri behan*/*tumhari behan*。'
    note: レッスン1で学んだ性の一致のしくみが、*tumhara* にも当てはまります。
  hi.a1.unit05.lesson03.teach.bada_badi:
    title: 年上/大きい
    gloss: 年上の、大きい(男性/女性)
    note: 日本語では「兄」「姉」のように年上かどうかを別々の言葉で表しますが、ヒンディー語では「兄」「姉」にあたる別の語はなく、性に応じて形が変わるこの形容詞を付けて表します。
    example_gloss:
    - 兄はデリーに住んでいます。
    - 姉はムンバイに住んでいます。
  hi.a1.unit05.lesson03.teach.chota_choti:
    title: 年下/小さい
    gloss: 年下の、小さい(男性/女性)
    note: '*bada/badi* の反対の語で、年下のきょうだいを表します。'
    example_gloss:
    - 弟は今、学生です。
    - 妹は今、学生です。
  hi.a1.unit05.lesson03.teach.bada_chota_note:
    title: bada/chotaの一致
    gloss: '*Bada* と *chota* は男性名詞に、*badi* と *choti* は女性名詞に付きます。例:*bada bhai*、*badi behan*。'
    note: '*mera/meri* で学んだ男性形・女性形の一致が、年齢を表す語にも当てはまります。'
  hi.a1.unit05.lesson03.teach.aur_lekin_bhi:
    title: そして、しかし、も
    gloss: そして、しかし、〜も
    note: 基本的なつなぎ言葉3つです。このレッスンの最後の会話でも使います。
    example_gloss:
    - 兄と姉はデリーに住んでいます。
    - 兄はデリーに住んでいますが、姉はムンバイに住んでいます。
    - 私には姉(妹)もいます。
  hi.a1.unit05.lesson03.teach.accha_phir_milenge:
    title: わかりました、またね
    gloss: わかった!また会いましょう。
    note: 親しみのある別れのあいさつで、ユニット2のさよならの表現にも出てきました。
  hi.a1.unit05.lesson03.teach.theek_hai_phir_milte_hain:
    title: オーケー、またね
    gloss: オーケー、また会おう!
    note: 上のあいさつに対するくだけた返事で、これまでのユニットの結びの会話と同じ型です。
  hi.a1.unit05.lesson03.teach.dialogue.line01:
    title: アルジュンがプリヤの家族について尋ねる
    gloss: アルジュンが、プリヤの家族はどこに住んでいるのか尋ねます。
    note: このユニットの *parivar kahan rehta hai* の型をもう一度使っています。
  hi.a1.unit05.lesson03.teach.dialogue.line02:
    title: プリヤが両親と兄について話す
    gloss: プリヤは、両親はデリーに住んでいて、兄もいると話します。
    note: '*mata-pita*、*rehte hain*、*bada bhai bhi hai* を組み合わせた文です。'
  hi.a1.unit05.lesson03.teach.dialogue.line03:
    title: アルジュンが祖父母について尋ねる
    gloss: アルジュンは「そうなんだ」と言って、「じゃあ、あなたの祖父母は?」と尋ねます。
    note: '*Tumhare* は、目上の人について言うときの *tumhara* の形です。*mera* に対する *mere* と同じで、レッスン1の敬意のノートで学びました。'
  hi.a1.unit05.lesson03.teach.dialogue.line04:
    title: プリヤが両方の祖父母について話す
    gloss: プリヤは、父方の祖父母はデリーに住んでいて、母方の祖父母はムンバイに住んでいると話します。
    note: '*lekin* を使って、2組の祖父母の住む都市を対比しています。dada-dadi と nana-nani の区別の復習にもなります。'
  hi.a1.unit05.lesson03.teach.dialogue.line05:
    title: アルジュンが自分の妹について話す
    gloss: アルジュンは、自分にも妹がいると話します。
    note: '*bhi* と *choti behan* をもう一度使っています。'
  hi.a1.unit05.lesson03.teach.dialogue.line06:
    title: プリヤが会話を締めくくる
    gloss: プリヤは「そっか、またね」と言います。
    note: このレッスンで学んだ結びのフレーズをもう一度使っています。
  hi.a1.unit05.lesson03.teach.dialogue.line07:
    title: アルジュンが返事をする
    gloss: アルジュンは了解して、「またね」と言います。
    note: このレッスンで学んだ返事のフレーズをもう一度使っています。
