  notes: >-
    Draft only. Overlay against the shared en/a1_unit47_appointments.yaml
    realization (itself still unreviewed). This unit had NO overlay in any
    direction (nl-en/fa-en/prs-en) before this file -- it was an orphaned
    realization, authored but unreachable by any learner. Authored entirely
    independently from the target realization and universal spine; no
    sibling-direction overlay was opened or consulted (none existed for
    this unit at authoring time in any direction, confirmed via a fresh ls
    of docs/content/overlays/{nl-en,fa-en,prs-en}/ before starting). One
    main contrastive point, deliberately different from every point already
    used in this direction (see unit45/46's overlay notes for the running
    list): the polite English "I'd like to make an appointment" uses the
    conditional would ('d), while everyday spoken Dutch almost always
    reaches for the simpler "Ik wil graag een afspraak maken" (literally
    "I want gladly," no conditional at all) rather than the more formal
    "Ik zou graag een afspraak willen maken" -- so a Dutch speaker's first
    instinct tends to under-translate the politeness marker into English,
    producing the blunter "I want to make an appointment" instead. Flagged
    explicitly on the id_like_to_make_an_appointment teaching card. Needs
    the mandatory fresh-context review before shipping.

