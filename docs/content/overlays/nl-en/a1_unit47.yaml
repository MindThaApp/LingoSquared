  en.a1.unit47.lesson02.teach.id_like_to_make_an_appointment: {title: "I'd like to make an appointment.", gloss: "Ik wil graag een afspraak maken.", note: "*I'd* is de samentrekking van I would -- letterlijk ik zou graag, maar het Nederlands zegt dit meestal eenvoudiger als ik wil graag, zonder zou."}
  en.a1.unit47.lesson02.teach.are_you_available_on_friday: {title: "Are you available on Friday?", gloss: "Ben je vrijdag beschikbaar?", note: "*on Friday* gebruikt altijd het voorzetsel on bij een dag van de week; het Nederlands laat op vaak weg."}
  en.a1.unit47.lesson02.teach.what_time_works_for_you: {title: "What time works for you?", gloss: "Welke tijd komt jou uit?", note: "*works for you* betekent hier komt jou uit -- een vaste uitdrukking, niet letterlijk werken."}
  en.a1.unit47.lesson02.teach.that_time_works_for_me: {title: "That time works for me.", gloss: "Die tijd komt mij uit.", note: "*That time works for me.* betekent die tijd komt mij uit."}
  en.a1.unit47.lesson02.teach.can_we_reschedule_for_monday: {title: "Can we reschedule for Monday?", gloss: "Kunnen we het verzetten naar maandag?", note: "*reschedule for ...* gebruikt for, niet to, om de nieuwe datum aan te geven."}
  en.a1.unit47.lesson02.teach.your_appointment_is_confirmed: {title: "Your appointment is confirmed.", gloss: "Je afspraak is bevestigd.", note: "*Your appointment is confirmed.* betekent je afspraak is bevestigd."}

  en.a1.unit47.lesson03.teach.dialogue_line1: {title: "Mia's vraag", gloss: "Mia vraagt: Leila, gaat het goed met Max? Hij lijkt de laatste tijd een beetje moe.", note: "*He seems a little tired lately.* betekent hij lijkt de laatste tijd een beetje moe."}
  en.a1.unit47.lesson03.teach.dialogue_line2: {title: "Leila's uitleg", gloss: "Leila zegt: Het gaat prima met hem, maak je geen zorgen. Hij is gewoon toe aan zijn jaarlijkse controle. Ik moet de dierenarts bellen.", note: "*due for* betekent toe zijn aan, gebruikt voor iets dat op tijd moet gebeuren."}
  en.a1.unit47.lesson03.teach.dialogue_line3: {title: "Leila belt de dierenarts", gloss: "Leila zegt: Hoi, ik wil graag een afspraak maken voor de controle van mijn hond.", note: "Zie de vergelijking tussen I'd like to en het Nederlandse ik wil graag hierboven."}
  en.a1.unit47.lesson03.teach.dialogue_line4: {title: "Mia's vraag", gloss: "Mia vraagt: Wat zeiden ze?", note: "*did they say* gebruikt did als hulpwerkwoord in de verleden tijd."}
  en.a1.unit47.lesson03.teach.dialogue_line5: {title: "Leila's antwoord", gloss: "Leila zegt: Ze zijn donderdag om drie uur beschikbaar.", note: "*at 3pm* gebruikt at voor een specifiek tijdstip."}
  en.a1.unit47.lesson03.teach.dialogue_line6: {title: "Mia's controlevraag", gloss: "Mia vraagt: Komt die tijd jou uit?", note: "*Does that time work for you?* is de vraagvorm van that time works for you, met do-support net als bij eerdere vragen."}
  en.a1.unit47.lesson03.teach.dialogue_line7: {title: "Leila's bevestiging", gloss: "Leila zegt: Ja, dat komt mij uit. Donderdag om drie uur -- bedankt! Max's afspraak is bevestigd.", note: "*Max's appointment* gebruikt de bezits-'s, net als in het Nederlands Max' afspraak."}

  en.a1.unit47.lesson04.teach.reading_passage: {title: "Tekst over het maken van een afspraak", gloss: "Hoe je een afspraak maakt: Als je naar een dokter, een tandarts of een andere dienst moet, moet je meestal eerst een afspraak maken. Bel en zeg dat je graag een afspraak wilt maken. De receptionist vertelt je welke dagen en tijden beschikbaar zijn. Kies een tijd die jou uitkomt, en ze bevestigen je afspraak. Als er iets verandert, bel dan opnieuw en vraag om te verzetten. Vorige week belde Leila de dierenarts om een afspraak te maken voor de jaarlijkse controle van haar hond Max. Ze waren donderdag om drie uur beschikbaar, en Leila bevestigde de tijd. Daniel heeft ook een afspraak -- hij gaat maandagochtend naar de tandarts voor een controle. Hij zei dat hij niet zenuwachtig is, alleen een beetje druk deze week.", note: "*a little busy this week* betekent een beetje druk deze week."}

