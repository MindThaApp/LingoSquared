  en.a1.unit45.lesson02.teach.i_need_help: {title: "I need help!", gloss: "Ik heb hulp nodig!", note: "*I need help!* betekent ik heb hulp nodig!"}
  en.a1.unit45.lesson02.teach.send_the_police: {title: "Send the police, please.", gloss: "Stuur de politie, alstublieft.", note: "*Send the police, please.* betekent stuur de politie, alstublieft."}
  en.a1.unit45.lesson02.teach.send_an_ambulance: {title: "Send an ambulance, please.", gloss: "Stuur een ambulance, alstublieft.", note: "*Send an ambulance, please.* betekent stuur een ambulance, alstublieft."}
  en.a1.unit45.lesson02.teach.theres_a_fire: {title: "There's a fire!", gloss: "Er is brand!", note: "*There's a fire!* betekent er is brand!"}
  en.a1.unit45.lesson02.teach.whats_your_emergency: {title: "What's your emergency?", gloss: "Wat is uw noodgeval?", note: "Dit is de standaardvraag van een Amerikaanse alarmcentrale zodra je 911 belt."}

  en.a1.unit45.lesson03.teach.dialogue_line1: {title: "Leila ruikt rook", gloss: "Leila vraagt: Daniel, is er iets aan het branden? Ik ruik rook!", note: "*smell* + zelfstandig naamwoord, zonder voorzetsel: I smell smoke, niet I smell aan smoke."}
  en.a1.unit45.lesson03.teach.dialogue_line2: {title: "Daniels verklaring", gloss: "Daniel zegt: O nee, de pan vloog in brand! Ik was het avondeten aan het koken.", note: "*caught fire* is een vaste uitdrukking voor plotseling vlam vatten."}
  en.a1.unit45.lesson03.teach.dialogue_line3: {title: "Leila's instructies", gloss: "Leila zegt: Blijf kalm. Zet het fornuis uit! Ik bel om hulp.", note: "*call for help* betekent letterlijk bellen om hulp -- for hier niet weglaten."}
  en.a1.unit45.lesson03.teach.dialogue_line4: {title: "Daniels waarschuwing", gloss: "Daniel zegt: Schiet op, het vuur wordt groter!", note: "*getting bigger* betekent groter worden -- get + bijvoeglijk naamwoord voor een verandering."}
  en.a1.unit45.lesson03.teach.dialogue_line5: {title: "Leila belt het alarmnummer", gloss: "Leila zegt: Hallo, dit is een noodgeval. Er is brand in de keuken van mijn vriend. Stuur alstublieft de brandweer.", note: "Dit is precies het 911-gesprek waarbij het verschil met het Nederlandse 112 belangrijk is."}
  en.a1.unit45.lesson03.teach.dialogue_line6: {title: "Daniels opluchting", gloss: "Daniel zegt: Goddank. Ik denk dat het nu uit is, maar laten we voor de zekerheid buiten wachten.", note: "*just in case* betekent voor de zekerheid."}
  en.a1.unit45.lesson03.teach.dialogue_line7: {title: "Leila's advies", gloss: "Leila zegt: Goed idee. Het is veiliger om buiten te wachten tot ze aankomen.", note: "*safer* is de vergrotende trap van safe, met -er net als in het Nederlands (veilig -> veiliger)."}

  en.a1.unit45.lesson04.teach.reading_passage: {title: "Tekst over noodmaatregelen", gloss: "Bij brand: Blijf ten eerste kalm. Verlaat ten tweede meteen het gebouw. Gebruik de lift niet; gebruik de trap. Bel ten derde, zodra je buiten bent, 911 en geef je adres. Wacht ten slotte buiten tot de brandweer arriveert. Na Daniels keukenbrand wachtten hij en Leila buiten, precies zoals de mededeling zei. De brandweer kwam snel en zorgde dat alles veilig was. Later kwam Mia langs om te kijken hoe het met hen ging, en ze was opgelucht dat niemand gewond was.", note: "Amerikaans-Engels *elevator* is de lift -- niet te verwarren met het Britse woord *lift*, dat qua vorm meer op het Nederlandse woord lijkt maar in deze cursus niet wordt gebruikt."}

exercises:
  en.a1.unit45.lesson01.exercise01.listen_word:
    instruction: "Luister en kies het genoemde woord."
    correct_option: "police"
    distractors: ["help", "ambulance", "fire department"]
    accepted_answers: [{value: "police", status: correct}]
    feedback: "*police* betekent politie."
  en.a1.unit45.lesson01.exercise02.choose_ambulance_meaning:
    instruction: "Welk woord betekent het voertuig dat gewonden naar het ziekenhuis brengt?"
    correct_option: "ambulance"
    distractors: ["police", "fire department", "help"]
    accepted_answers: [{value: "ambulance", status: correct}]
    feedback: "*ambulance* betekent ambulance."
  en.a1.unit45.lesson01.exercise03.match_emergency_words:
    instruction: "Verbind elke omschrijving met het juiste woord."
    accepted_answers: [{value: [{left: "a sudden, dangerous situation that needs quick action", right: "emergency"}, {left: "what you ask for when you need someone to come quickly", right: "help"}, {left: "who you call about a crime", right: "police"}, {left: "the vehicle that takes injured people to the hospital", right: "ambulance"}, {left: "who you call to put out a fire", right: "fire department"}], status: correct}]
    feedback: "emergency=noodgeval, help=hulp, police=politie, ambulance=ambulance, fire department=brandweer."
  en.a1.unit45.lesson01.exercise04.order_ambulance_sentence:
    instruction: "Zet de woorden in de juiste volgorde voor 'We hebben een ambulance nodig.'"
    accepted_answers: [{value: ["We", "need", "an", "ambulance."], status: correct}]
    feedback: "De juiste volgorde is We need an ambulance."
  en.a1.unit45.lesson01.exercise05.write_help_word:
    instruction: "Schrijf het woord dat je roept als je snel iemand nodig hebt."
    accepted_answers:
      - {value: "help", status: correct}
      - {value: "Help", status: correct}
    feedback: "*help* betekent hulp."

  en.a1.unit45.lesson02.exercise01.listen_phrase:
    instruction: "Luister en kies de zin die gezegd wordt."
    correct_option: "There's a fire!"
    distractors: ["Call 911!", "I need help!", "Send an ambulance, please."]
    accepted_answers: [{value: "There's a fire!", status: correct}]
    feedback: "There's a fire! betekent er is brand!"
  en.a1.unit45.lesson02.exercise02.choose_send_ambulance_meaning:
    instruction: "Welke zin vraagt om het voertuig dat gewonden naar het ziekenhuis brengt?"
    correct_option: "Send an ambulance, please."
    distractors: ["Send the police, please.", "There's a fire!", "Call 911!"]
    accepted_answers: [{value: "Send an ambulance, please.", status: correct}]
    feedback: "Send an ambulance, please. betekent stuur een ambulance, alstublieft."
  en.a1.unit45.lesson02.exercise03.choose_whats_your_emergency_meaning:
    instruction: "Welke zin vraagt een hulpdienst meestal eerst als je belt voor hulp?"
    correct_option: "What's your emergency?"
    distractors: ["I need help!", "Call 911!", "There's a fire!"]
    accepted_answers: [{value: "What's your emergency?", status: correct}]
    feedback: "What's your emergency? betekent wat is uw noodgeval?"
  en.a1.unit45.lesson02.exercise04.order_send_police_sentence:
    instruction: "Zet de woorden in de juiste volgorde voor 'Stuur de politie, alstublieft.'"
    accepted_answers: [{value: ["Send", "the", "police,", "please."], status: correct}]
    feedback: "De juiste volgorde is Send the police, please."
  en.a1.unit45.lesson02.exercise05.translate_i_need_help:
    instruction: "Vertaal: 'Ik heb hulp nodig!'"
    accepted_answers:
      - {value: "I need help!", status: correct}
      - {value: "I need help", status: correct}
    feedback: "I need help! betekent ik heb hulp nodig!"

  en.a1.unit45.lesson03.exercise01.comprehension_leila_smells:
    instruction: "Wat ruikt Leila volgens het gesprek?"
    correct_option: "smoke"
    distractors: ["gas", "burnt food"]
    accepted_answers: [{value: "smoke", status: correct}]
    feedback: "Leila zegt: I smell smoke!"
  en.a1.unit45.lesson03.exercise02.comprehension_daniel_why_fire:
    instruction: "Wat was Daniel aan het doen toen de pan vlam vatte, volgens het gesprek?"
    correct_option: "cooking dinner"
    distractors: ["cleaning the kitchen", "doing the dishes"]
    accepted_answers: [{value: "cooking dinner", status: correct}]
    feedback: "Daniel zegt: I was cooking dinner."
  en.a1.unit45.lesson03.exercise03.listen_dialogue_leila_request:
    instruction: "Wat vraagt Leila de alarmcentrale te sturen, volgens het gesprek?"
    correct_option: "the fire department"
    distractors: ["the police", "an ambulance", "a taxi"]
    accepted_answers: [{value: "the fire department", status: correct}]
    feedback: "Leila zegt: please send the fire department."
  en.a1.unit45.lesson03.exercise04.respond_own_emergency_request:
    instruction: "Zeg dat je hulp nodig hebt, of zeg welke hulpdienst gestuurd moet worden."
    accepted_answers: ["I need help", "I need help.", "Call the police", "Call the police.", "Call an ambulance", "Call an ambulance.", "There's a fire", "There's a fire.", "Send the fire department", "Send the fire department.", "Send the police", "Send the police.", "Send an ambulance", "Send an ambulance."]
    feedback: "Gebruik I need help of Send the police/an ambulance/the fire department."

  en.a1.unit45.lesson04.exercise01.reading_first_step:
    instruction: "Wat moet je volgens de mededeling als eerste doen bij brand?"
    correct_option: "stay calm"
    distractors: ["call the fire department", "leave the building"]
    accepted_answers: [{value: "stay calm", status: correct}]
    feedback: "De tekst zegt: first, stay calm."
  en.a1.unit45.lesson04.exercise02.reading_use_instead_of_elevator:
    instruction: "Wat moet je volgens de mededeling gebruiken in plaats van de lift?"
    correct_option: "the stairs"
    distractors: ["the elevator", "the window"]
    accepted_answers: [{value: "the stairs", status: correct}]
    feedback: "De tekst zegt: use the stairs."
  en.a1.unit45.lesson04.exercise03.reading_who_checked_on_them:
    instruction: "Wie kwam er volgens de tekst achteraf bij Daniel en Leila kijken?"
    correct_option: "Mia"
    distractors: ["a neighbor", "their landlord"]
    accepted_answers: [{value: "Mia", status: correct}]
    feedback: "De tekst zegt: Mia came to check on them."
  en.a1.unit45.lesson04.exercise04.write_own_emergency_message:
    instruction: "Schrijf een kort bericht: zeg dat er een noodgeval is en welke hulp je nodig hebt."
    accepted_answers: ["There's a fire. Send the fire department.", "There's a fire. Send the fire department, please.", "I need help. Send an ambulance.", "I need help. Send an ambulance, please.", "There's an emergency. Send the police.", "There's an emergency. Send the police, please."]
    feedback: "Gebruik There's a fire/I need help/There's an emergency, gevolgd door Send the police/an ambulance/the fire department."
