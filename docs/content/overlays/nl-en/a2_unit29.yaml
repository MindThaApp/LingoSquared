  en.a2.unit29.lesson02.exercise01.listen_request:
    instruction: "Luister en kies de zin die gezegd wordt."
    correct_option: "I'd like to report a problem with my kitchen sink"
    distractors: ["It's leaking since this morning.", "Your appointment is confirmed for 3pm.", "I have a headache."]
    accepted_answers: [{value: "I'd like to report a problem with my kitchen sink", status: "correct"}]
    feedback: "dit betekent dat je een probleem met je keukengootsteen wilt melden."
  en.a2.unit29.lesson02.exercise02.choose_polite_report_request:
    instruction: "Je belt formeel naar de huismeester om een probleem te melden. Wat zeg je?"
    correct_option: "I'd like to report a problem with my kitchen sink."
    distractors: ["Should I take any medicine?", "The repair number is 6180.", "Do I need to be home?"]
    accepted_answers: [{value: "I'd like to report a problem with my kitchen sink.", status: "correct"}]
    feedback: "*I'd like to...* is een beleefde, formele manier om iets te melden."
  en.a2.unit29.lesson02.exercise03.choose_ask_repair_timing:
    instruction: "Je hebt het probleem beschreven. Nu wil je weten wanneer het gerepareerd wordt. Wat vraag je?"
    correct_option: "When can someone come to fix it?"
    distractors: ["What's wrong with the sink?", "Thank you very much.", "The repair number is 6180."]
    accepted_answers: [{value: "When can someone come to fix it?", status: "correct"}]
    feedback: "*When can someone come to fix it?* betekent wanneer iemand het kan komen repareren."
  en.a2.unit29.lesson02.exercise04.order_leaking_since_morning:
    instruction: "Zet de woorden in de juiste volgorde voor «het lekt al sinds vanochtend»."
    accepted_answers: [{value: ["It's", "been", "leaking", "since", "this", "morning"], status: "correct"}]
    feedback: "de juiste volgorde is *It's been leaking since this morning*."
  en.a2.unit29.lesson02.exercise05.order_ask_repair_timing:
    instruction: "Zet de woorden in de juiste volgorde voor «wanneer kan iemand het komen repareren?»."
    accepted_answers: [{value: ["When", "can", "someone", "come", "to", "fix", "it"], status: "correct"}]
    feedback: "de juiste volgorde is *When can someone come to fix it*."
