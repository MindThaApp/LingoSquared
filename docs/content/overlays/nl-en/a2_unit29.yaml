    instruction: "De huismeester zegt: wat is er mis met de gootsteen? Ik begrijp het. Ik stuur morgen tussen 14.00 en 16.00 uur een loodgieter. Ja, wees alstublieft thuis tussen 14.00 en 16.00 uur. Hier is uw reparatienummer: 6180."
