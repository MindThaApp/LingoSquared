course:
  title: Engels A1
  description: >-
    Engels voor beginners, met heldere uitleg in het Nederlands en aandacht
    voor alledaagse gesprekken.

units:
  en.a1.unit42.personality: {title: "Persoonlijkheid beschrijven"}

lessons:
  en.a1.unit42.lesson01.personality_vocabulary: {title: "Woorden voor persoonlijkheid"}
  en.a1.unit42.lesson02.talking_about_someones_character: {title: "Praten over iemands karakter"}
  en.a1.unit42.lesson03.dialogue_what_is_daniel_like: {title: "Gesprek: Hoe is Daniel?"}
  en.a1.unit42.lesson04.three_friends_three_personalities: {title: "Lezen: Drie vrienden, drie persoonlijkheden"}

teaching:
  en.a1.unit42.lesson01.teach.friendly: {title: "friendly", gloss: "vriendelijk", note: "*friendly* betekent vriendelijk en makkelijk om mee te praten.", example_gloss: "Mijn buurman is erg vriendelijk."}
  en.a1.unit42.lesson01.teach.funny: {title: "funny", gloss: "grappig", note: "*funny* betekent grappig -- iemand die anderen aan het lachen maakt.", example_gloss: "Mijn broer is echt grappig."}
  en.a1.unit42.lesson01.teach.hardworking: {title: "hardworking", gloss: "hardwerkend", note: "*hardworking* betekent hardwerkend, iemand die niet snel opgeeft.", example_gloss: "Zij is een hardwerkende werknemer."}
  en.a1.unit42.lesson01.teach.shy: {title: "shy", gloss: "verlegen", note: "*shy* betekent verlegen of nerveus bij nieuwe mensen.", example_gloss: "Hij is in het begin een beetje verlegen."}
  en.a1.unit42.lesson01.teach.calm: {title: "calm", gloss: "kalm / rustig", note: "*calm* betekent kalm -- wordt niet snel overstuur of nerveus.", example_gloss: "Mijn moeder is erg kalm."}
  en.a1.unit42.lesson01.teach.talkative: {title: "talkative", gloss: "praatgraag / spraakzaam", note: "*talkative* betekent praatgraag -- iemand die veel praat.", example_gloss: "Mijn zus is erg praatgraag."}

  en.a1.unit42.lesson02.teach.a_little_shy: {title: "a little shy", gloss: "een beetje verlegen", note: "*a little* betekent hier een beetje (mate), niet klein (grootte) -- let op dat je het niet letterlijk als 'klein verlegen' vertaalt.", example_gloss: "Hij is in het begin een beetje verlegen, maar hij warmt snel op."}
  en.a1.unit42.lesson02.teach.very_hardworking: {title: "very hardworking", gloss: "erg hardwerkend", note: "*very hardworking* betekent erg hardwerkend.", example_gloss: "Mijn collega is erg hardwerkend."}
  en.a1.unit42.lesson02.teach.have_a_great_sense_of_humor: {title: "have a great sense of humor", gloss: "een geweldig gevoel voor humor hebben", note: "*have a great sense of humor* betekent een geweldig gevoel voor humor hebben.", example_gloss: "Daniel heeft een geweldig gevoel voor humor."}
  en.a1.unit42.lesson02.teach.get_along_with_everyone: {title: "get along with everyone", gloss: "met iedereen goed opschieten", note: "*get along with everyone* betekent met iedereen goed opschieten.", example_gloss: "Mia schiet op het werk met iedereen goed op."}
  en.a1.unit42.lesson02.teach.warm_up_quickly: {title: "warm up quickly", gloss: "snel opwarmen / snel op je gemak raken", note: "*warm up quickly* betekent snel op je gemak raken bij nieuwe mensen.", example_gloss: "Hij is verlegen, maar hij warmt snel op zodra hij je kent."}
  en.a1.unit42.lesson02.teach.whats_he_like_question: {title: "What's he like?", gloss: "Hoe is hij?", note: "What's he like? vraagt naar iemands karakter, niet naar hoe hij eruitziet."}

  en.a1.unit42.lesson03.teach.dialogue_line1: {title: "Mia's vraag", gloss: "Mia vraagt: Ik begin volgende week aan een nieuw project met Daniel. Hoe is hij?", note: "What's he like? vraagt naar iemands karakter."}
  en.a1.unit42.lesson03.teach.dialogue_line2: {title: "Leila's antwoord", gloss: "Leila zegt: Hij is erg vriendelijk, en ook echt grappig.", note: "and he's really funny too betekent en hij is ook echt grappig."}
  en.a1.unit42.lesson03.teach.dialogue_line3: {title: "Mia's vraag", gloss: "Mia zegt: Fijn om te horen! Werkt hij makkelijk samen?", note: "Is he easy to work with? vraagt of iemand makkelijk is om mee samen te werken."}
  en.a1.unit42.lesson03.teach.dialogue_line4: {title: "Leila's antwoord", gloss: "Leila zegt: Ja, hij is ook erg hardwerkend. Hij maakt zijn taken altijd op tijd af.", note: "finishes his tasks on time betekent maakt zijn taken op tijd af."}
  en.a1.unit42.lesson03.teach.dialogue_line5: {title: "Mia's vraag", gloss: "Mia vraagt: Is hij weleens verlegen in vergaderingen?", note: "ever hier betekent weleens/ooit."}
  en.a1.unit42.lesson03.teach.dialogue_line6: {title: "Leila's antwoord", gloss: "Leila zegt: Een beetje, maar hij raakt meer op zijn gemak zodra hij je kent.", note: "once he knows you betekent zodra hij je kent."}
  en.a1.unit42.lesson03.teach.dialogue_line7: {title: "Mia's dank", gloss: "Mia zegt: Bedankt, Leila. Nu voel ik me meer ontspannen over het project.", note: "I feel more relaxed betekent ik voel me meer ontspannen."}

  en.a1.unit42.lesson04.teach.reading_passage: {title: "Tekst over drie persoonlijkheden", gloss: "Daniel, Leila en Mia zijn goede vrienden, maar ze hebben heel verschillende persoonlijkheden. Daniel is vriendelijk en grappig -- hij maakt zijn vrienden altijd aan het lachen. Hij is een beetje verlegen als hij nieuwe mensen ontmoet, maar hij raakt snel op zijn gemak. Leila is kalm en creatief. Ze houdt van schilderen omdat het haar helpt ontspannen, en ze wordt zelden ergens boos over. Mia is extravert en georganiseerd. Ze houdt van plannen maken voor de groep, en ze is erg geduldig als ze haar vrienden iets nieuws leert -- ze leerde Daniel koken. Ook al zijn ze allemaal verschillend, ze schieten met iedereen goed op en genieten ervan om tijd samen door te brengen.", note: "even though betekent ook al / hoewel."}

exercises:
  en.a1.unit42.lesson01.exercise01.listen_word:
    instruction: "Luister en kies het genoemde woord."
    correct_option: "hardworking"
    distractors: ["friendly", "funny", "shy"]
    accepted_answers: [{value: "hardworking", status: correct}]
    feedback: "*hardworking* betekent hardwerkend."
  en.a1.unit42.lesson01.exercise02.choose_shy_meaning:
    instruction: "Welk woord beschrijft iemand die nerveus wordt van nieuwe mensen ontmoeten?"
    correct_option: "shy"
    distractors: ["friendly", "calm", "talkative"]
    accepted_answers: [{value: "shy", status: correct}]
    feedback: "*shy* betekent verlegen."
  en.a1.unit42.lesson01.exercise03.match_personality_words:
    instruction: "Verbind elk woord met de juiste betekenis."
    accepted_answers: [{value: [{left: "kind and easy to talk to", right: "friendly"}, {left: "makes people laugh", right: "funny"}, {left: "works hard and doesn't give up easily", right: "hardworking"}, {left: "nervous or quiet around new people", right: "shy"}, {left: "doesn't get upset or nervous easily", right: "calm"}, {left: "talks a lot", right: "talkative"}], status: correct}]
    feedback: "friendly=vriendelijk, funny=grappig, hardworking=hardwerkend, shy=verlegen, calm=kalm, talkative=praatgraag."
  en.a1.unit42.lesson01.exercise04.order_hardworking_sentence:
    instruction: "Zet de woorden in de juiste volgorde voor 'Zij is een hardwerkende werknemer.'"
    accepted_answers: [{value: ["She", "is", "a", "hardworking", "employee."], status: correct}]
    feedback: "De juiste volgorde is She is a hardworking employee."
  en.a1.unit42.lesson01.exercise05.write_calm_word:
    instruction: "Schrijf het woord voor iemand die niet snel overstuur of nerveus wordt."
    accepted_answers:
      - {value: "calm", status: correct}
      - {value: "Calm", status: correct}
    feedback: "*calm* betekent kalm."

  en.a1.unit42.lesson02.exercise01.listen_phrase:
    instruction: "Luister en kies de zin die gezegd wordt."
    correct_option: "get along with everyone"
    distractors: ["a little shy", "very hardworking", "warm up quickly"]
    accepted_answers: [{value: "get along with everyone", status: correct}]
    feedback: "get along with everyone betekent met iedereen goed opschieten."
  en.a1.unit42.lesson02.exercise02.choose_sense_of_humor_meaning:
    instruction: "Welke uitdrukking betekent dat iemand erg grappig is en mensen aan het lachen maakt?"
    correct_option: "have a great sense of humor"
    distractors: ["get along with everyone", "very hardworking", "a little shy"]
    accepted_answers: [{value: "have a great sense of humor", status: correct}]
    feedback: "have a great sense of humor betekent een geweldig gevoel voor humor hebben."
  en.a1.unit42.lesson02.exercise03.choose_warm_up_quickly_meaning:
    instruction: "Welke uitdrukking betekent dat iemand snel op zijn gemak raakt na het ontmoeten van nieuwe mensen?"
    correct_option: "warm up quickly"
    distractors: ["a little shy", "have a great sense of humor", "very hardworking"]
    accepted_answers: [{value: "warm up quickly", status: correct}]
    feedback: "warm up quickly betekent snel op je gemak raken."
  en.a1.unit42.lesson02.exercise04.order_coworker_sentence:
    instruction: "Zet de woorden in de juiste volgorde voor 'Mijn collega is erg hardwerkend.'"
    accepted_answers: [{value: ["My", "coworker", "is", "very", "hardworking."], status: correct}]
    feedback: "De juiste volgorde is My coworker is very hardworking."
  en.a1.unit42.lesson02.exercise05.translate_whats_he_like:
    instruction: "Vertaal: 'Hoe is hij?'"
    accepted_answers:
      - {value: "What's he like?", status: correct}
      - {value: "What's he like", status: correct}
    feedback: "What's he like? betekent hoe is hij?"

  en.a1.unit42.lesson03.exercise01.comprehension_leila_daniel_personality:
    instruction: "Wat zegt Leila over Daniels persoonlijkheid volgens het gesprek?"
    correct_option: "friendly and funny"
    distractors: ["shy and quiet", "serious and calm"]
    accepted_answers: [{value: "friendly and funny", status: correct}]
    feedback: "Leila zegt: he's very friendly, and he's really funny too."
  en.a1.unit42.lesson03.exercise02.comprehension_leila_daniel_work:
    instruction: "Wat zegt Leila over Daniels werkgewoontes volgens het gesprek?"
    correct_option: "hardworking"
    distractors: ["talkative", "disorganized"]
    accepted_answers: [{value: "hardworking", status: correct}]
    feedback: "Leila zegt: he's also very hardworking."
  en.a1.unit42.lesson03.exercise03.listen_dialogue_meetings:
    instruction: "Wat zegt Leila over Daniel tijdens vergaderingen volgens het gesprek?"
    correct_option: "a little shy"
    distractors: ["very talkative", "always late", "not very organized"]
    accepted_answers: [{value: "a little shy", status: correct}]
    feedback: "Leila zegt: a little, but he gets more comfortable once he knows you."
  en.a1.unit42.lesson03.exercise04.respond_own_personality:
    instruction: "Zeg iets over je eigen persoonlijkheid, of vraag hoe iemand is."
    accepted_answers: ["I'm friendly and funny", "I'm friendly and funny.", "I'm hardworking", "I'm hardworking.", "I'm a little shy", "I'm a little shy.", "I'm calm", "I'm calm.", "What's she like?", "What's he like?"]
    feedback: "Gebruik I'm friendly/hardworking/a little shy/calm, of What's he/she like?"

  en.a1.unit42.lesson04.exercise01.reading_daniel_traits:
    instruction: "Welke twee eigenschappen beschrijven Daniel volgens de tekst?"
    correct_option: "friendly and funny"
    distractors: ["shy and quiet", "serious and organized"]
    accepted_answers: [{value: "friendly and funny", status: correct}]
    feedback: "De tekst zegt: Daniel is friendly and funny."
  en.a1.unit42.lesson04.exercise02.reading_leila_hobby_reason:
    instruction: "Waarom houdt Leila van schilderen volgens de tekst?"
    correct_option: "it helps her relax"
    distractors: ["it helps her earn money", "her friends taught her"]
    accepted_answers: [{value: "it helps her relax", status: correct}]
    feedback: "De tekst zegt: it helps her relax."
  en.a1.unit42.lesson04.exercise03.reading_mia_taught_daniel:
    instruction: "Wat leerde Mia Daniel volgens de tekst?"
    correct_option: "how to cook"
    distractors: ["how to paint", "how to swim"]
    accepted_answers: [{value: "how to cook", status: correct}]
    feedback: "De tekst zegt: she taught Daniel how to cook."
  en.a1.unit42.lesson04.exercise04.write_own_personality_sentence:
    instruction: "Schrijf één zin over je eigen persoonlijkheid, met 'I'm...' of 'I am...'."
    accepted_answers: ["I'm friendly", "I'm friendly.", "I am friendly", "I am friendly.", "I'm funny", "I'm funny.", "I'm hardworking", "I'm hardworking.", "I'm a little shy", "I'm a little shy.", "I'm calm", "I'm calm.", "I'm talkative", "I'm talkative."]
    feedback: "Gebruik I'm... of I am... plus een eigenschap."
