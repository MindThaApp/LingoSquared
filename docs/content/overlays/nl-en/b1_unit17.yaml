review: {status: "unreviewed", required_next_reviewer: "fresh_context", notes: "Seventeenth nl-en B1 overlay, authored directly against the reviewed English realization b1_unit17_regret. Informal jij/je register in the Dutch instructions/glosses throughout (the taught English forms are past-hypothetical wish/should have/if-had constructions, as required by the realization -- Dutch explanatory text stays informal per the lane pin). Pending fresh-context review. lesson02.exercise04/05, lesson03.exercise05, and lesson04.exercise05/06 name the required form/turn in the Dutch instruction to avoid the underdetermined-prompt bug class. Character canon checked: Daniel/Leila are established colleagues from units 09-16 (Daniel's evening class, joined the team in March, two-project workload from unit16); unit17 continues directly from unit16's workload scenario with no conflicting facts."}

course:
  title: "Engels B1"
  description: >-
    Engels leren op B1-niveau voor alledaagse gesprekken over verplichtingen,
    mogelijkheden, hypothetische situaties, tegenstellingen, verhalen,
    beschrijvingen met bijzinnen, professionele communicatie, klachten,
    advies en spijt over het verleden, met gedetailleerde uitleg in het
    Nederlands.

units:
  en.b1.unit17.regret: {title: "I wish I had asked for help sooner"}

lessons:
  en.b1.unit17.lesson01.regret_vocabulary: {title: "Woorden voor spijt en wensen"}
  en.b1.unit17.lesson02.past_hypothetical_forms: {title: "I wish I had asked for help sooner"}
  en.b1.unit17.lesson03.reading_a_reflective_message: {title: "Lezen: terugblikken op een drukke maand"}
  en.b1.unit17.lesson04.the_regret_dialogue: {title: "If I had asked Mia sooner..."}

teaching:
  en.b1.unit17.lesson01.teach.regret: {title: "regret", gloss: "spijt", note: "*regret* betekent een gevoel van verdriet over iets dat je wel of niet hebt gedaan.", example_gloss: "Daniel had spijt van het missen van de deadline."}
  en.b1.unit17.lesson01.teach.wish: {title: "wish", gloss: "wens", note: "*wish* betekent een verlangen dat iets anders was dan het werkelijk was.", example_gloss: "Daniel had één wens over de afgelopen week."}
  en.b1.unit17.lesson01.teach.mistake: {title: "mistake", gloss: "fout", note: "*mistake* betekent een verkeerde actie door slecht inzicht.", example_gloss: "Zo lang wachten om hulp te vragen was een fout."}
  en.b1.unit17.lesson01.teach.hindsight: {title: "hindsight", gloss: "achteraf gezien", note: "*hindsight* betekent inzicht in een gebeurtenis dat je pas achteraf hebt.", example_gloss: "Achteraf gezien had Daniel eerder iets moeten zeggen."}
  en.b1.unit17.lesson01.teach.procrastinate: {title: "procrastinate", gloss: "uitstellen", note: "*procrastinate* betekent iets uitstellen dat je zou moeten doen.", example_gloss: "Daniel stelt taken vaak uit als ze moeilijk aanvoelen."}
  en.b1.unit17.lesson01.teach.delay: {title: "delay", gloss: "vertraging", note: "*delay* betekent een periode waardoor iets later komt dan gepland.", example_gloss: "De vertraging zorgde ervoor dat Daniel zijn eerste deadline miste."}

  en.b1.unit17.lesson02.teach.wish_had_asked: {title: "I wish I had + voltooid deelwoord", gloss: "Ik wou dat ik eerder om hulp had gevraagd.", note: "*I wish I had asked* drukt een wens uit over iets dat niet gebeurde in het verleden."}
  en.b1.unit17.lesson02.teach.should_have_talked: {title: "I should have + voltooid deelwoord", gloss: "Ik had eerder met mijn manager moeten praten.", note: "*I should have talked* zegt wat achteraf de juiste actie was geweest."}
  en.b1.unit17.lesson02.teach.if_i_had_asked_would_have_finished: {title: "if I had + voltooid deelwoord, I would have + voltooid deelwoord", gloss: "Als ik Mia in week één om hulp had gevraagd, zou ik op tijd klaar zijn geweest.", note: "*if I had asked..., I would have finished...* beschrijft een onwerkelijk verleden gevolg."}
  en.b1.unit17.lesson02.teach.grammar_past_hypothetical: {title: "vormen om spijt over het verleden uit te drukken", gloss: "Om spijt over het verleden uit te drukken, gebruik je wish + voltooid deelwoord (I wish I had asked...), should have + voltooid deelwoord (I should have talked...), of if + voltooid deelwoord met would have + voltooid deelwoord (If I had asked..., I would have finished...). Alle drie beschrijven wat eigenlijk niet is gebeurd.", note: "vorm: kies tussen wish + had, should have, of if + had ... would have."}

  en.b1.unit17.lesson03.teach.looking_back: {title: "looking back", gloss: "terugkijkend", note: "*looking back* introduceert een reflectie over het verleden.", example_gloss: "Terugkijkend heeft Daniel spijt dat hij niet eerder om hulp vroeg."}
  en.b1.unit17.lesson03.teach.missed_deadline: {title: "missed deadline", gloss: "gemiste deadline", note: "*missed deadline* betekent een uiterste datum die niet is gehaald.", example_gloss: "Daniel miste één deadline voordat hij om hulp vroeg."}
  en.b1.unit17.lesson03.teach.reading_passage: {title: "leestekst: terugblikken op een drukke maand", gloss: "Hoi Leila, terugkijkend wou ik dat ik eerder om hulp had gevraagd. Ik had eerder met mijn manager moeten praten over de werklast. Tegen de tijd dat ik dat deed, had ik al één deadline gemist. Als ik Mia in week één om hulp had gevraagd, zou ik beide projecten op tijd hebben afgerond. Het was een fout om zo lang te wachten. Daniel", note: "een korte, reflectieve boodschap op B1-niveau."}

  en.b1.unit17.lesson04.teach.q_wish_asked_sooner: {title: "Daniel begint met een reflectie", gloss: "Daniel zegt: terugkijkend wou ik dat ik eerder om hulp had gevraagd.", note: "*looking back* opent een reflectief gesprek."}
  en.b1.unit17.lesson04.teach.a_what_happened: {title: "Leila vraagt om meer uitleg", gloss: "Leila zegt: wat is er gebeurd?", note: "een korte, open vraag om meer te horen."}
  en.b1.unit17.lesson04.teach.q_should_have_talked_missed: {title: "Daniel legt uit wat hij had moeten doen", gloss: "Daniel zegt: ik had eerder met mijn manager moeten praten over de werklast. Tegen de tijd dat ik dat deed, had ik al één deadline gemist.", note: "*should have talked* en *had already missed* combineren spijt met een concreet gevolg."}
  en.b1.unit17.lesson04.teach.a_fair_regret_fixed: {title: "Leila erkent de spijt maar relativeert", gloss: "Leila zegt: dat is een terechte spijt, maar je hebt het uiteindelijk opgelost.", note: "*that's a fair regret, but...* erkent het gevoel en biedt perspectief."}
  en.b1.unit17.lesson04.teach.q_true_if_had_asked: {title: "Daniel beschrijft wat anders had kunnen zijn", gloss: "Daniel zegt: waar. Als ik Mia in week één om hulp had gevraagd, zou ik beide projecten op tijd hebben afgerond.", note: "*if I had asked..., I would have finished...* beschrijft een onwerkelijk verleden gevolg."}
  en.b1.unit17.lesson04.teach.a_now_you_know: {title: "Leila sluit bemoedigend af", gloss: "Leila zegt: nou, nu weet je het voor de volgende keer.", note: "een korte, positieve afsluiting van het gesprek."}

