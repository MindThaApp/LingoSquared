review:
  status: unreviewed
  required_next_reviewer: codex_fresh_context
  notes: >-
    Draft only. Overlay against the shared en/a1_unit36_education.yaml
    realization (itself still unreviewed). This unit had NO overlay in
    any direction (nl-en/fa-en/prs-en) before this file -- it was an
    orphaned realization, authored but unreachable by any learner. One
    main contrastive point, deliberately different from the ones
    already used in this direction (unit16's frequency-adverb placement,
    unit25/unit30's V2 inversion after a fronted adverb, unit31's
    subject-verb inversion/do-support in questions, unit32's "any" in
    questions plus gendered animal pronouns, unit33's
    verb-per-transport-mode lexicalization, unit34's play/go/do light
    verbs and the frequency "a" = per, unit35's stranded prepositions
    and communication light-verb collocations): take a class is a real
    false-friend trap for Dutch speakers specifically, because the
    ordinary Dutch verb for attending a course is volgen (literally "to
    follow") -- een cursus volgen -- so a Dutch learner's first instinct
    is to produce *follow a class in English, which sounds wrong; the
    correct English light verb is take, not follow. Flagged explicitly
    on the take_a_class teaching card and reinforced again in the
    lesson03 dialogue note and the lesson04 reading note, since it is
    exactly the kind of interference error a Dutch speaker is likely to
    make repeatedly, not just once. No sibling-direction overlay exists
    for this unit in any language (confirmed via a fresh ls of
    docs/content/overlays/{nl-en,fa-en,prs-en}/ before authoring), so
    there was nothing to isolate from, but this file was still drafted
    entirely independently from the target realization and universal
    spine, per the standing rule. Needs the mandatory fresh-context
    review before shipping.

course:
  title: Engels A1
  description: >-
    Engels voor beginners, met heldere uitleg in het Nederlands en aandacht
    voor alledaagse gesprekken.

units:
  en.a1.unit36.education: {title: "Praten over studeren"}

lessons:
  en.a1.unit36.lesson01.education_vocabulary: {title: "Lessen en leren"}
  en.a1.unit36.lesson02.taking_a_class: {title: "Een les volgen"}
  en.a1.unit36.lesson03.dialogue_photography_class: {title: "Gesprek: Een fotografieles"}
  en.a1.unit36.lesson04.learning_something_new: {title: "Lezen: Iets nieuws leren"}

teaching:
  en.a1.unit36.lesson01.teach.class: {title: "class", gloss: "les", note: "*class* betekent les (een bijeenkomst waar je iets leert).", example_gloss: "Ik heb elke dinsdagavond les."}
  en.a1.unit36.lesson01.teach.course: {title: "course", gloss: "cursus", note: "*course* betekent cursus (een reeks lessen over één onderwerp).", example_gloss: "Hij volgt dit jaar een computercursus."}
  en.a1.unit36.lesson01.teach.student: {title: "student", gloss: "student / cursist", note: "*student* betekent student of cursist -- iemand die op school of in een les leert.", example_gloss: "Zij studeert aan een avondschool voor volwassenen."}
  en.a1.unit36.lesson01.teach.homework: {title: "homework", gloss: "huiswerk", note: "*homework* betekent huiswerk.", example_gloss: "Ik maak mijn huiswerk na het avondeten."}
  en.a1.unit36.lesson01.teach.subject: {title: "subject", gloss: "vak", note: "*subject* betekent vak (een onderwerp dat je studeert).", example_gloss: "Wiskunde is mijn favoriete vak."}
  en.a1.unit36.lesson01.teach.test: {title: "test", gloss: "toets", note: "*test* betekent toets.", example_gloss: "We hebben vrijdag een toets."}

  en.a1.unit36.lesson02.teach.take_a_class: {title: "take a class", gloss: "een les volgen", note: "*take a class* is de vaste Engelse combinatie voor een les volgen -- let op: het Nederlandse werkwoord volgen vertaal je hier NIET letterlijk als *follow a class* (dat klinkt vreemd in het Engels); je gebruikt altijd take.", example_gloss: "Ik volg elke dinsdagavond een les."}
  en.a1.unit36.lesson02.teach.do_homework: {title: "do homework", gloss: "huiswerk maken", note: "*do homework* -- het werkwoord is do, niet make, ook al zeg je in het Nederlands huiswerk maken.", example_gloss: "Hij maakt zijn huiswerk na het avondeten."}
  en.a1.unit36.lesson02.teach.study_for_a_test: {title: "study for a test", gloss: "leren voor een toets", note: "*study for a test* betekent leren voor een toets -- for geeft hier het doel aan (waarvoor je leert).", example_gloss: "Ik leer elke vrijdag voor een toets."}
  en.a1.unit36.lesson02.teach.community_college: {title: "community college", gloss: "buurtcollege / avondopleiding", note: "*community college* is een Amerikaans type opleiding waar vooral volwassenen naast hun werk cursussen volgen -- er is geen exacte Nederlandse vertaling; het Engelse begrip wordt meestal gewoon zo overgenomen.", example_gloss: "Zij studeert aan een community college."}
  en.a1.unit36.lesson02.teach.in_the_evening: {title: "in the evening", gloss: "'s avonds", note: "*in the evening* betekent 's avonds.", example_gloss: "Mijn les is 's avonds."}
  en.a1.unit36.lesson02.teach.what_are_you_studying_question: {title: "What are you studying?", gloss: "Wat studeer jij?", note: "Deze vraag gebruikt de present continuous (are you studying), voor iets dat op dit moment in je leven bezig is -- niet de eenvoudige tegenwoordige tijd."}

  en.a1.unit36.lesson03.teach.dialogue_line1: {title: "Daniels vraag", gloss: "Daniel vraagt: Doe je vandaag na het werk nog iets?", note: "anything hier betekent iets/wat dan ook, gebruikt in een vraag."}
  en.a1.unit36.lesson03.teach.dialogue_line2: {title: "Mia's antwoord", gloss: "Mia zegt: Ja, ik heb vanavond een fotografieles.", note: "tonight betekent vanavond, specifiek voor de avond van vandaag."}
  en.a1.unit36.lesson03.teach.dialogue_line3: {title: "Daniels reactie", gloss: "Daniel zegt: Oh, leuk! Waar volg je die?", note: "Where do you take it? -- take hoort hier weer bij een les/cursus volgen, net als bij take a class."}
  en.a1.unit36.lesson03.teach.dialogue_line4: {title: "Mia's antwoord", gloss: "Mia zegt: Bij de community college in het centrum. Het is twee keer per week.", note: "twice a week -- dezelfde a-als-per-constructie die je in unit 34 hebt geleerd."}
  en.a1.unit36.lesson03.teach.dialogue_line5: {title: "Daniels vraag", gloss: "Daniel zegt: Hoe gaat het tot nu toe?", note: "so far betekent tot nu toe."}
  en.a1.unit36.lesson03.teach.dialogue_line6: {title: "Mia's antwoord", gloss: "Mia zegt: Ik vind het echt leuk. Ik leer mijn camera veel beter te gebruiken.", note: "I'm learning how to... -- present continuous voor een vaardigheid die je op dit moment aan het ontwikkelen bent."}
  en.a1.unit36.lesson03.teach.dialogue_line7: {title: "Daniels laatste opmerking", gloss: "Daniel zegt: Wat leuk! Misschien kun je het mij een keer leren.", note: "sometime betekent een keer / ooit, een vage tijdsaanduiding in de toekomst."}

  en.a1.unit36.lesson04.teach.reading_passage: {title: "Tekst over Daniel, Leila en Mia", gloss: "Daniel, Leila en Mia leren allemaal iets nieuws naast hun werk. Daniel volgt op maandagavond een computercursus om nieuwe vaardigheden te leren voor zijn baan. Leila leert Spaans omdat ze ooit naar Mexico wil reizen. Mia heeft twee keer per week een fotografieles bij de community college, en ze maakt nu al veel betere foto's. Soms praten ze samen over hun lessen tijdens de lunch.", note: "takes a computer course -- take, niet follow, opnieuw dezelfde valkuil als bij take a class."}

exercises:
  en.a1.unit36.lesson01.exercise01.listen_word:
    instruction: "Luister en kies het genoemde woord."
    correct_option: "homework"
    distractors: ["class", "course", "test"]
    accepted_answers: [{value: "homework", status: correct}]
    feedback: "*homework* betekent huiswerk."
  en.a1.unit36.lesson01.exercise02.choose_student_meaning:
    instruction: "Welk woord betekent iemand die op een school of in een les leert?"
    correct_option: "student"
    distractors: ["class", "course", "subject"]
    accepted_answers: [{value: "student", status: correct}]
    feedback: "*student* betekent student/cursist."
  en.a1.unit36.lesson01.exercise03.match_education_words:
    instruction: "Verbind elke omschrijving met het juiste woord."
    accepted_answers: [{value: [{left: "een vaste bijeenkomst waar je iets leert, vaak één keer per week", right: "class"}, {left: "een reeks lessen over één onderwerp, soms met een certificaat aan het eind", right: "course"}, {left: "iemand die op een school of in een les leert", right: "student"}, {left: "schoolwerk dat je thuis doet, niet in de les", right: "homework"}, {left: "een onderwerp dat je studeert, zoals wiskunde of geschiedenis", right: "subject"}, {left: "een korte toets die test wat je hebt geleerd", right: "test"}], status: correct}]
    feedback: "class=les, course=cursus, student=student, homework=huiswerk, subject=vak, test=toets."
  en.a1.unit36.lesson01.exercise04.order_subject_sentence:
    instruction: "Zet de woorden in de juiste volgorde voor 'Wiskunde is mijn favoriete vak.'"
    accepted_answers: [{value: ["Math", "is", "my", "favorite", "subject."], status: correct}]
    feedback: "De juiste volgorde is Math is my favorite subject."
  en.a1.unit36.lesson01.exercise05.write_subject_word:
    instruction: "Schrijf het woord voor een onderwerp dat je studeert, zoals wiskunde of geschiedenis."
    accepted_answers: [{value: "subject", status: correct}]
    feedback: "*subject* betekent vak."

  en.a1.unit36.lesson02.exercise01.listen_phrase:
    instruction: "Luister en kies de genoemde uitdrukking."
    correct_option: "community college"
    distractors: ["take a class", "do homework", "study for a test"]
    accepted_answers: [{value: "community college", status: correct}]
    feedback: "*community college* betekent buurtcollege/avondopleiding."
  en.a1.unit36.lesson02.exercise02.choose_community_college_meaning:
    instruction: "Welke uitdrukking betekent een school waar veel volwassenen parttime lessen volgen?"
    correct_option: "community college"
    distractors: ["in the evening", "take a class", "study for a test"]
    accepted_answers: [{value: "community college", status: correct}]
    feedback: "*community college* is een Amerikaanse opleiding voor volwassenen."
  en.a1.unit36.lesson02.exercise03.choose_in_the_evening_meaning:
    instruction: "Welke uitdrukking betekent tijdens het late deel van de dag, niet 's ochtends?"
    correct_option: "in the evening"
    distractors: ["community college", "take a class", "do homework"]
    accepted_answers: [{value: "in the evening", status: correct}]
    feedback: "*in the evening* betekent 's avonds."
  en.a1.unit36.lesson02.exercise04.order_homework_sentence:
    instruction: "Zet de woorden in de juiste volgorde voor 'Hij maakt zijn huiswerk na het avondeten.'"
    accepted_answers: [{value: ["He", "does", "his", "homework", "after", "dinner."], status: correct}]
    feedback: "De juiste volgorde is He does his homework after dinner."
  en.a1.unit36.lesson02.exercise05.translate_what_are_you_studying:
    instruction: "Vertaal: 'Wat studeer jij?'"
    accepted_answers:
      - {value: "What are you studying?", status: correct}
      - {value: "What are you studying", status: correct}
    feedback: "What are you studying? gebruikt de present continuous."

  en.a1.unit36.lesson03.exercise01.comprehension_mia_class:
    instruction: "Welke les volgt Mia volgens het gesprek?"
    correct_option: "a photography class"
    distractors: ["a computer course", "a Spanish class"]
    accepted_answers: [{value: "a photography class", status: correct}]
    feedback: "Mia zegt: I have a photography class tonight."
  en.a1.unit36.lesson03.exercise02.comprehension_mia_frequency:
    instruction: "Hoe vaak komt Mia's les volgens het gesprek samen?"
    correct_option: "Twice a week"
    distractors: ["Once a week", "Every day"]
    accepted_answers: [{value: "Twice a week", status: correct}]
    feedback: "Mia zegt: it's twice a week."
  en.a1.unit36.lesson03.exercise03.listen_dialogue_where:
    instruction: "Waar volgt Mia volgens het gesprek haar les?"
    correct_option: "the community college downtown"
    distractors: ["her office downtown", "a school near her house"]
    accepted_answers: [{value: "the community college downtown", status: correct}]
    feedback: "Mia zegt: at the community college downtown."
  en.a1.unit36.lesson03.exercise04.respond_own_study:
    instruction: "Zeg één ding dat jij studeert of aan het leren bent."
    accepted_answers: ["I take a class", "I take a class.", "I am a student", "I am a student.", "I study English", "I study English.", "I do my homework", "I do my homework.", "I am taking a course", "I am taking a course.", "I am learning something new", "I am learning something new."]
    feedback: "Gebruik I take a class, I study of I am learning."

  en.a1.unit36.lesson04.exercise01.reading_daniel_course:
    instruction: "Welke cursus volgt Daniel volgens de tekst op maandagavond?"
    correct_option: "a computer course"
    distractors: ["a photography class", "a Spanish class"]
    accepted_answers: [{value: "a computer course", status: correct}]
    feedback: "De tekst zegt: Daniel takes a computer course on Monday nights."
  en.a1.unit36.lesson04.exercise02.reading_leila_reason:
    instruction: "Waarom leert Leila volgens de tekst Spaans?"
    correct_option: "she wants to travel to Mexico someday"
    distractors: ["she has family in Mexico", "her job requires it"]
    accepted_answers: [{value: "she wants to travel to Mexico someday", status: correct}]
    feedback: "De tekst zegt: because she wants to travel to Mexico someday."
  en.a1.unit36.lesson04.exercise03.reading_mia_class:
    instruction: "Welke les heeft Mia volgens de tekst twee keer per week?"
    correct_option: "photography"
    distractors: ["computer", "Spanish"]
    accepted_answers: [{value: "photography", status: correct}]
    feedback: "De tekst zegt: Mia has a photography class twice a week."
  en.a1.unit36.lesson04.exercise04.write_own_study_sentence:
    instruction: "Schrijf één zin over wat jij studeert of aan het leren bent, met 'I study', 'I am learning' of 'I am taking a class in'."
    accepted_answers: ["I study English", "I study English.", "I am learning English", "I am learning English.", "I am taking a class in English", "I am taking a class in English.", "I am learning something new", "I am learning something new."]
    feedback: "Gebruik I study/I am learning/I am taking a class in + het onderwerp."
