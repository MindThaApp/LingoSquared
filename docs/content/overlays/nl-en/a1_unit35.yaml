  en.a1.unit35.lesson01.teach.phone: {title: "phone", gloss: "telefoon", note: "*phone* betekent telefoon.", example_gloss: "Ik bel mijn moeder met mijn telefoon."}
  en.a1.unit35.lesson01.teach.laptop: {title: "laptop", gloss: "laptop", note: "*laptop* betekent laptop.", example_gloss: "Zij gebruikt haar laptop voor werk."}
  en.a1.unit35.lesson01.teach.tablet: {title: "tablet", gloss: "tablet", note: "*tablet* betekent tablet.", example_gloss: "Hij leest boeken op zijn tablet."}
  en.a1.unit35.lesson01.teach.computer: {title: "computer", gloss: "computer", note: "*computer* betekent computer.", example_gloss: "We hebben thuis een computer."}
  en.a1.unit35.lesson01.teach.app: {title: "app", gloss: "app", note: "*app* betekent app.", example_gloss: "Ik heb een nieuwe app op mijn telefoon."}
  en.a1.unit35.lesson01.teach.camera: {title: "camera", gloss: "camera", note: "*camera* betekent camera.", example_gloss: "Deze camera maakt geweldige foto's."}

  en.a1.unit35.lesson02.teach.make_a_call: {title: "make a call", gloss: "bellen", note: "*make a call* is een vaste combinatie van werkwoord + zelfstandig naamwoord die je samen moet onthouden -- het Nederlands heeft hiervoor gewoon het ene werkwoord bellen, zonder een los woord voor call.", example_gloss: "Ik bel elke zondag mijn broer."}
  en.a1.unit35.lesson02.teach.send_a_text: {title: "send a text", gloss: "een berichtje sturen / appen", note: "*send a text* is net als *make a call* een vaste werkwoord + zelfstandig-naamwoordcombinatie -- het Nederlands gebruikt hiervoor de eigen werkwoorden appen of sms'en; in het Engels bestaat zo'n los werkwoord niet en zeg je altijd send a text.", example_gloss: "Zij stuurt elke ochtend een berichtje naar haar vriendin."}
  en.a1.unit35.lesson02.teach.download_an_app: {title: "download an app", gloss: "een app downloaden", note: "*download an app* -- download is hier zowel in het Engels als het Nederlands hetzelfde soort werkwoord, dus dit is de makkelijkste van de drie vaste combinaties.", example_gloss: "Hij downloadt elke week een nieuwe app."}
  en.a1.unit35.lesson02.teach.wifi: {title: "wifi", gloss: "wifi", note: "*wifi* betekent wifi.", example_gloss: "De wifi bij mij thuis is snel."}
  en.a1.unit35.lesson02.teach.battery: {title: "battery", gloss: "batterij", note: "*battery* betekent batterij.", example_gloss: "Mijn telefoonbatterij is bijna leeg."}
  en.a1.unit35.lesson02.teach.how_use_phone_question: {title: "How do you use your phone?", gloss: "Hoe gebruik je je telefoon?", note: "Do you use...? -- dezelfde do-support-structuur als bij andere Engelse vragen (unit 31)."}

  en.a1.unit35.lesson03.teach.dialogue_line1: {title: "Mia's klacht", gloss: "Mia zegt: Mijn telefoon is zo oud. Hij is echt traag.", note: "so + bijvoeglijk naamwoord (so old) versterkt de betekenis, zoals heel/zo in het Nederlands."}
  en.a1.unit35.lesson03.teach.dialogue_line2: {title: "Leila's advies", gloss: "Leila zegt: Je zou een nieuwe moeten kopen. Waar gebruik je hem meestal voor?", note: "Let op de zinsbouw: What do you use it for most? eindigt met het voorzetsel for. Het Nederlands kent iets vergelijkbaars (Waar gebruik je hem voor?), maar begint de vraag dan met waar -- in het Engels begint de vraag altijd met what en blijft for aan het eind staan."}
  en.a1.unit35.lesson03.teach.dialogue_line3: {title: "Mia's antwoord", gloss: "Mia zegt: Ik app vooral mijn zus en maak foto's.", note: "text als werkwoord (I text my sister) is hier een vlottere vertaling dan send a text -- allebei zijn correct Engels."}
  en.a1.unit35.lesson03.teach.dialogue_line4: {title: "Leila's gebruik", gloss: "Leila zegt: Ik bel mijn ouders elk weekend met mijn telefoon. Ik gebruik ook veel apps.", note: "call als werkwoord (I call my parents) is de vlottere, informele manier -- make a call is de vaste combinatie die je in les 2 hebt geleerd."}
  en.a1.unit35.lesson03.teach.dialogue_line5: {title: "Mia's vraag", gloss: "Mia vraagt: Welke apps gebruik jij?", note: "Which apps do you use? -- which vraagt naar een keuze uit een groep (apps), net als welke in het Nederlands."}
  en.a1.unit35.lesson03.teach.dialogue_line6: {title: "Leila's apps", gloss: "Leila zegt: Ik gebruik een kookapp en een kaartapp. Wil je ze downloaden?", note: "Do you want to...? gebruikt do-support, ook al is want zelf al een gewoon werkwoord."}
  en.a1.unit35.lesson03.teach.dialogue_line7: {title: "Mia's antwoord", gloss: "Mia zegt: Ja, graag, stuur me de namen!", note: "please direct voor het werkwoord (please send ...) maakt het verzoek beleefder."}

  en.a1.unit35.lesson04.teach.reading_passage: {title: "Tekst over Daniel, Leila en Mia", gloss: "Daniel, Leila en Mia gebruiken hun telefoon allemaal anders. Daniel houdt niet van appen; hij belt liever mensen. Leila gebruikt haar telefoon voor kaarten en een kookapp als ze nieuwe recepten probeert. Mia maakt veel foto's en stuurt ze naar haar familie. Ze gebruiken allemaal een laptop voor werk, en ze videobellen in het weekend met vrienden.", note: "prefers to call people instead -- instead of + -ing-vorm (of texting) geeft aan waar iets de vervanging voor is, vergelijkbaar met in plaats van in het Nederlands."}

exercises:
  en.a1.unit35.lesson01.exercise01.listen_device:
    instruction: "Luister en kies het genoemde apparaat."
    correct_option: "tablet"
    distractors: ["phone", "laptop", "computer"]
    accepted_answers: [{value: "tablet", status: correct}]
    feedback: "*tablet* betekent tablet."
  en.a1.unit35.lesson01.exercise02.choose_app_meaning:
    instruction: "Welk woord betekent een programma dat je op een telefoon of tablet downloadt?"
    correct_option: "app"
    distractors: ["phone", "camera", "wifi"]
    accepted_answers: [{value: "app", status: correct}]
    feedback: "*app* betekent app."
  en.a1.unit35.lesson01.exercise03.match_devices:
    instruction: "Verbind elk woord met zijn betekenis."
    accepted_answers:
      - value:
          - {left: "calls with your mom", right: "phone"}
          - {left: "a computer in your bag", right: "laptop"}
          - {left: "a flat touchscreen device for reading, browsing, or watching videos", right: "tablet"}
          - {left: "a program you download onto a phone or tablet", right: "app"}
          - {left: "a device or part of a phone that takes photos", right: "camera"}
        status: "correct"
    feedback: "Elke omschrijving hoort bij één Engels woord of één Engelse uitdrukking."
  en.a1.unit35.lesson01.exercise04.order_laptop_sentence:
    instruction: "Zet de woorden in de juiste volgorde voor 'Zij gebruikt haar laptop voor werk.'"
    accepted_answers: [{value: ["She", "uses", "her", "laptop", "for", "work."], status: correct}]
    feedback: "De juiste volgorde is She uses her laptop for work."
  en.a1.unit35.lesson01.exercise05.write_app_word:
    instruction: "Schrijf het woord voor een programma dat je op een telefoon of tablet downloadt."
    accepted_answers: [{value: "app", status: correct}]
    feedback: "*app* betekent app."

  en.a1.unit35.lesson02.exercise01.listen_phrase:
    instruction: "Luister en kies de genoemde uitdrukking."
    correct_option: "download an app"
    distractors: ["make a call", "send a text", "look something up online"]
    accepted_answers: [{value: "download an app", status: correct}]
    feedback: "*download an app* betekent een app downloaden."
  en.a1.unit35.lesson02.exercise02.choose_wifi_meaning:
    instruction: "Welk woord betekent een draadloze internetverbinding?"
    correct_option: "wifi"
    distractors: ["battery", "app", "camera"]
    accepted_answers: [{value: "wifi", status: correct}]
    feedback: "*wifi* betekent wifi."
  en.a1.unit35.lesson02.exercise03.choose_battery_meaning:
    instruction: "Welk woord betekent het onderdeel van een telefoon dat stroom opslaat?"
    correct_option: "battery"
    distractors: ["wifi", "app", "camera"]
    accepted_answers: [{value: "battery", status: correct}]
    feedback: "*battery* betekent batterij."
  en.a1.unit35.lesson02.exercise04.order_text_sentence:
    instruction: "Zet de woorden in de juiste volgorde voor 'Zij stuurt elke ochtend een berichtje naar haar vriendin.'"
    accepted_answers: [{value: ["She", "sends", "a", "text", "to", "her", "friend", "every", "morning."], status: correct}]
    feedback: "De juiste volgorde is She sends a text to her friend every morning."
  en.a1.unit35.lesson02.exercise05.translate_how_use_phone:
    instruction: "Vertaal: 'Hoe gebruik je je telefoon?'"
    accepted_answers:
      - {value: "How do you use your phone?", status: correct}
      - {value: "How do you use your phone", status: correct}
    feedback: "How do you use your phone? gebruikt do-support (do)."

  en.a1.unit35.lesson03.exercise01.comprehension_mia_uses:
    instruction: "Wat doet Mia volgens het gesprek vooral met haar telefoon?"
    correct_option: "text her sister and take photos"
    distractors: ["call her parents and use apps", "download a cooking app"]
    accepted_answers: [{value: "text her sister and take photos", status: correct}]
    feedback: "Mia zegt: I mostly text my sister and take photos."
  en.a1.unit35.lesson03.exercise02.comprehension_leila_calls:
    instruction: "Wie belt Leila volgens het gesprek elk weekend?"
    correct_option: "her parents"
    distractors: ["her sister", "her friend"]
    accepted_answers: [{value: "her parents", status: correct}]
    feedback: "Leila zegt: I use my phone to call my parents every weekend."
  en.a1.unit35.lesson03.exercise03.listen_dialogue_apps:
    instruction: "Welke twee apps noemt Leila volgens het gesprek?"
    correct_option: "a cooking app and a map app"
    distractors: ["a photo app and a game app", "a music app and a news app"]
    accepted_answers: [{value: "a cooking app and a map app", status: correct}]
    feedback: "Leila zegt: I use a cooking app and a map app."
  en.a1.unit35.lesson03.exercise04.respond_own_use:
    instruction: "Zeg één ding waar jij je telefoon voor gebruikt."
    accepted_answers: ["I text my friends", "I text my friends.", "I text my sister", "I text my sister.", "I call my parents", "I call my parents.", "I call my mom", "I call my mom.", "I use a cooking app", "I use a cooking app.", "I take a lot of photos", "I take a lot of photos.", "I take photos", "I take photos.", "I look things up online", "I look things up online.", "I download apps", "I download apps."]
    feedback: "Gebruik I call, I text of I use + de activiteit."

  en.a1.unit35.lesson04.exercise01.reading_daniel_prefers:
    instruction: "Wat doet Daniel volgens de tekst liever dan appen?"
    correct_option: "call people"
    distractors: ["take photos", "use a cooking app"]
    accepted_answers: [{value: "call people", status: correct}]
    feedback: "De tekst zegt: he prefers to call people instead."
  en.a1.unit35.lesson04.exercise02.reading_leila_app:
    instruction: "Wat gebruikt Leila volgens de tekst als ze nieuwe recepten probeert?"
    correct_option: "a cooking app"
    distractors: ["a map app", "a photo app"]
    accepted_answers: [{value: "a cooking app", status: correct}]
    feedback: "De tekst zegt: a cooking app when she tries new recipes."
  en.a1.unit35.lesson04.exercise03.reading_mia_photos:
    instruction: "Waar maakt Mia volgens de tekst veel van en stuurt ze naar haar familie?"
    correct_option: "photos"
    distractors: ["texts", "videos"]
    accepted_answers: [{value: "photos", status: correct}]
    feedback: "De tekst zegt: Mia takes a lot of photos and sends them to her family."
  en.a1.unit35.lesson04.exercise04.write_own_phone_sentence:
    instruction: "Schrijf één zin over hoe jij je telefoon gebruikt, met 'I call', 'I text' of 'I use an app'."
    accepted_answers: ["I call my friends", "I call my friends.", "I call my parents", "I call my parents.", "I text my friends", "I text my friends.", "I text my sister", "I text my sister.", "I use an app", "I use an app.", "I use a map app", "I use a map app.", "I use a cooking app", "I use a cooking app."]
