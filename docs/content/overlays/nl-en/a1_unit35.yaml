  notes: >-
    Fresh-context review 2026-07-10: glosses and all 7 dialogue-line
    glosses verified against the realization; device vocab and the
    make-a-call/send-a-text light-verb contrast are correct Dutch.
    Fixed two factually wrong teaching notes: (1) the preposition-
    stranding note claimed Dutch always fronts a fused "waarvoor" while
    its own gloss used the equally standard split "Waar ... voor?" --
    rewritten to acknowledge both and keep the real contrast (English
    fronts what, strands for); (2) the dialogue_line7 note said please
    sits at the END of "Yes, please send me the names!" when it is
    pre-verbal -- corrected. Also added accepted-answer variants the
    unit's own dialogue models (I text my sister, I call my parents/mom,
    I take photos, I use a cooking app) to both open-response exercises.
    Flagged (realization-side, NOT fixed): lesson02's translation
    exercise target_block displays the English answer verbatim -- part
    of the class-wide units 30-58 realization bug.

course:
  title: Engels A1
  description: >-
    Engels voor beginners, met heldere uitleg in het Nederlands en aandacht
    voor alledaagse gesprekken.

