  notes: >-
    Draft only. Overlay against the shared en/a1_unit54_laundry.yaml
    realization (itself still unreviewed). This unit had NO overlay in any
    direction (nl-en/fa-en/prs-en) before this file -- it was an orphaned
    realization, authored but unreachable by any learner. One main
    contrastive point, deliberately different from the ones already used
    elsewhere in this direction: English reuses the single verb *take* for
    two unrelated meanings in this dialogue -- "the machines take quarters"
    (take = accept as payment) and "how long does the wash cycle take"
    (take = require/last a certain duration) -- while Dutch has two
    genuinely distinct verbs for these, aannemen/accepteren (accept
    payment) and duren (take time), so a Dutch speaker cannot lean on one
    memorized translation of "take" the way they might expect. Flagged
    explicitly on both the take-quarters teaching card and the
    how-long-does-it-take phrase card, and reinforced again in the
    lesson03 dialogue notes where both senses appear back to back in
    consecutive Attendant lines. No sibling-direction overlay exists for
    this unit in any language (confirmed via a fresh ls of docs/content/
    overlays/{nl-en,fa-en,prs-en}/ before authoring), so there was nothing
    to isolate from, but this file was still drafted entirely
    independently from the target realization and universal spine, per
    the standing rule. Followed the realization's own explicit
    same-speaker-distractor guidance for lesson03's price/duration/
    closing-time questions -- every numeric/time fact in the dialogue is
    its own single-fact Attendant turn, so cross-distracting between them
    (e.g. "thirty minutes" as a wrong answer to a cost question) is safe
    per the realization's own analysis, and was used that way here. Every
    kind:vocabulary teaching card's example_gloss is a faithful Dutch
    translation of the realization's own example sentence; lesson02/03/04
    cards carry no example_gloss since their realization counterparts
    declare no example (phrase/dialogue/reading cards are exempt per
    AUTHORING_GUIDE.md #19). Needs the mandatory fresh-context review
    before shipping.

    2026-10-11: accepted answers widened for
    lesson03.exercise04.respond_own_laundry_statement,
    lesson04.exercise04.write_own_laundromat_message; off-prompt answer
    removed; reading gloss "cafe verderop" -> "café ernaast" (en
    realization review).

course:
  title: Engels A1
  description: >-
    Engels voor beginners, met heldere uitleg in het Nederlands en aandacht
    voor alledaagse gesprekken.

