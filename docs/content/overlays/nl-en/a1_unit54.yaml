  en.a1.unit54.lesson01.teach.quarters: {title: "quarters", gloss: "kwartjes (Amerikaanse munten van 25 cent)", note: "*quarters* zijn Amerikaanse munten van vijfentwintig cent -- vaak nodig voor wasmachines in een wasserette. Er bestaat geen precies Nederlands equivalent; het Engelse woord blijft meestal onvertaald in uitleg.", example_gloss: "De machines nemen kwartjes aan."}
  en.a1.unit54.lesson01.teach.detergent: {title: "detergent", gloss: "wasmiddel", note: "*detergent* betekent wasmiddel.", example_gloss: "Je hebt wasmiddel nodig om je kleren schoon te maken."}
  en.a1.unit54.lesson01.teach.load: {title: "load", gloss: "wasje / lading", note: "*load* betekent hier een wasje -- de hoeveelheid was die je in één keer wast.", example_gloss: "Ik heb een grote lading was."}

  en.a1.unit54.lesson02.teach.id_like_to_wash_a_few_things: {title: "I'd like to wash a few things, please.", gloss: "Ik wil graag een paar dingen wassen, alstublieft.", note: "I'd like to (samentrekking van I would like to) is de beleefde manier om iets te vragen."}
  en.a1.unit54.lesson02.teach.do_you_have_change: {title: "Do you have change for the machines?", gloss: "Heeft u wisselgeld voor de machines?", note: "change betekent hier wisselgeld (losse munten), niet verandering."}
  en.a1.unit54.lesson02.teach.how_long_does_the_cycle_take: {title: "How long does the wash cycle take?", gloss: "Hoe lang duurt de wascyclus?", note: "*take* betekent hier duren (een bepaalde tijd nodig hebben) -- een heel ander gebruik dan bij the machines take quarters, waar take betekent aannemen. Het Nederlands gebruikt hiervoor het aparte werkwoord duren."}
  en.a1.unit54.lesson02.teach.its_three_dollars_for_one_load: {title: "It's three dollars for one load.", gloss: "Het is drie dollar voor één wasje.", note: "for one load betekent voor één wasbeurt."}
  en.a1.unit54.lesson02.teach.what_time_do_you_close: {title: "What time do you close?", gloss: "Hoe laat sluit u?", note: "do you close gebruikt do-support voor de vraagvorm."}
  en.a1.unit54.lesson02.teach.please_pick_up_by_nine: {title: "Please pick up your laundry by nine o'clock.", gloss: "Haal uw was alstublieft voor negen uur op.", note: "pick up betekent ophalen -- by nine o'clock betekent voor negen uur (uiterlijk dat tijdstip)."}

  en.a1.unit54.lesson03.teach.dialogue_line1: {title: "De medewerker begroet hen", gloss: "De Medewerker zegt: Hoi! Heeft u een wasmachine nodig?", note: "Do you need...? gebruikt do-support voor de vraagvorm."}
  en.a1.unit54.lesson03.teach.dialogue_line2: {title: "Leila's reden", gloss: "Leila zegt: Ja, graag. Mijn wasmachine thuis is kapot.", note: "at home betekent thuis."}
  en.a1.unit54.lesson03.teach.dialogue_line3: {title: "Daniels verzoek", gloss: "Daniel zegt: Ik heb ook een klein wasje. Kan ik ook een machine gebruiken?", note: "too betekent hier ook, aan het einde van de zin -- as well heeft dezelfde betekenis en staat in de tweede zin."}
  en.a1.unit54.lesson03.teach.dialogue_line4: {title: "De medewerker over de munten", gloss: "De Medewerker zegt: Natuurlijk! De machines nemen kwartjes aan.", note: "*take* betekent hier aannemen/accepteren (als betaling) -- let op het verschil met take in How long does it take? verderop, waar take duren betekent."}
  en.a1.unit54.lesson03.teach.dialogue_line5: {title: "Leila heeft kwartjes", gloss: "Leila zegt: Ja, ik heb kwartjes.", note: "Een korte bevestiging, geen nieuw feit."}
  en.a1.unit54.lesson03.teach.dialogue_line6: {title: "De duur van de wascyclus", gloss: "De Medewerker zegt: De wascyclus duurt dertig minuten.", note: "*take* betekent hier duren -- een andere betekenis dan take quarters hierboven."}
  en.a1.unit54.lesson03.teach.dialogue_line7: {title: "Daniel vraagt naar de prijs", gloss: "Daniel zegt: En hoeveel kost het?", note: "How much does it cost? -- opnieuw do-support (does) voor de vraagvorm."}
  en.a1.unit54.lesson03.teach.dialogue_line8: {title: "De prijs", gloss: "De Medewerker zegt: Het is drie dollar voor één wasje.", note: "Een apart feit, los van het aantal kwartjes en de duur."}
  en.a1.unit54.lesson03.teach.dialogue_line9: {title: "De sluitingstijd", gloss: "De Medewerker zegt: De wasserette sluit om negen uur, dus haal uw was voor die tijd op.", note: "so betekent hier dus/daarom -- het verbindt de sluitingstijd met de instructie om op tijd te komen."}

  en.a1.unit54.lesson04.teach.reading_passage: {title: "Tekst: Een bezoek aan de wasserette", gloss: "Op een middag ging de wasmachine in Leila's flatgebouw kapot. Ze besloot naar de wasserette verderop in de straat te gaan. Daniel ging mee omdat hij ook een klein wasje had. In de wasserette legde de medewerker uit dat de machines kwartjes aannemen en dat de wascyclus dertig minuten duurt. Het kostte drie dollar voor één wasje. Terwijl hun kleren wasten, praatten Daniel en Leila en dronken ze koffie in het café ernaast. De wasserette sluit om negen uur, dus zorgden ze ervoor hun was op tijd op te halen. Leila was Daniel dankbaar voor het gezelschap, en ze zei dat de wasmachine thuis waarschijnlijk voor het weekend gerepareerd zou zijn.", note: "*would be fixed* is de conditionele toekomende tijd -- Leila verwacht dat de machine gerepareerd wordt, maar het is nog niet zeker."}

