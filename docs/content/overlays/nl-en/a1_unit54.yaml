  en.a1.unit54.lesson01.teach.laundromat: {title: "laundromat", gloss: "wasserette", note: "*laundromat* betekent wasserette -- een plek met wasmachines waar je tegen betaling kunt wassen.", example_gloss: "Ik ga vandaag naar de wasserette."}
