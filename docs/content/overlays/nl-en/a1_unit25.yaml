    outage contingency). Overlay against the shared en/a1_unit30_hobbies.yaml
    realization (itself still unreviewed) -- continues nl-en's own
    sequential numbering (unit25, following unit24) even though the
    underlying realization file is named unit30; the manifest is
    position-matched, not name-matched. New contrastive-grammar point:
    Dutch V2 word order forces subject-verb inversion after a fronted
    adverb ("Soms ga ik hardlopen" -- literally "Sometimes go I
    running"), while English does not invert ("Sometimes I go
    running") -- a real, well-documented error Dutch learners make when
    transferring V2 into English. Deliberately different from the
    frequency-adverb-placement note already used in unit16 (usually
    before the verb) per the sibling-isolation/no-repeat directive.
    Needs the mandatory fresh-context review before shipping.

