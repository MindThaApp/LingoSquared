  en.a1.unit30.lesson03.teach.i_like_pattern: {title: "I like reading.", gloss: "Ik hou van lezen.", note: "I like + -ing vorm gebruik je om te zeggen dat je iets leuk vindt."}
  en.a1.unit30.lesson03.teach.dialogue_line1: {title: "Leila's vraag", gloss: "Leila vraagt: Wat doe jij in je vrije tijd, Daniel?", note: "Leila opent het gesprek met een directe vraag aan Daniel."}
  en.a1.unit30.lesson03.teach.dialogue_line2: {title: "Daniels antwoord", gloss: "Daniel zegt: Ik ga vaak hardlopen. En ik kook soms. En jij?", note: "Daniel noemt twee hobby's met frequentie en kaatst de vraag terug met What about you?."}
  en.a1.unit30.lesson03.teach.dialogue_line3: {title: "Leila over schilderen", gloss: "Leila zegt: Ik hou van schilderen. Ik schilder bijna elk weekend.", note: "almost every weekend betekent bijna elk weekend."}
  en.a1.unit30.lesson03.teach.dialogue_line4: {title: "Daniels vervolgvraag", gloss: "Daniel zegt: Dat is geweldig! Speel jij weleens videogames?", note: "Do you ever...? gebruik je om te vragen of iemand iets weleens doet."}
  en.a1.unit30.lesson03.teach.dialogue_line5: {title: "Leila's laatste antwoord", gloss: "Leila zegt: Zelden. Ik lees liever een boek.", note: "I prefer... betekent ik geef de voorkeur aan..., ik doe liever..."}

  en.a1.unit30.lesson04.teach.reading_passage: {title: "Tekst over hobby's", gloss: "Daniel en Leila hebben verschillende hobby's. Daniel gaat altijd op zaterdagochtend hardlopen, en hij kookt soms eten voor zijn vrienden. Leila gaat nooit hardlopen, maar ze schildert vaak in het weekend. Ze houden allebei van videogames, maar ze spelen alleen soms samen.", note: "Deze tekst vergelijkt de hobby's en frequenties van Daniel en Leila direct met elkaar."}

exercises:
  en.a1.unit30.lesson01.exercise01.listen_hobby:
    instruction: "Luister en kies de genoemde hobby."
    correct_option: "painting"
    distractors: ["reading", "cooking", "running"]
    accepted_answers: [{value: "painting", status: correct}]
    feedback: "painting betekent schilderen."
  en.a1.unit30.lesson01.exercise02.choose_reading_meaning:
    instruction: "Welke hobby betekent naar een boek kijken en de woorden begrijpen?"
    correct_option: "reading"
    distractors: ["cooking", "painting", "running"]
    accepted_answers: [{value: "reading", status: correct}]
    feedback: "reading betekent lezen."
  en.a1.unit30.lesson01.exercise03.match_hobbies:
    instruction: "Verbind elke omschrijving met de juiste hobby."
    accepted_answers:
      - value:
          - {left: "looking at a book and understanding the words", right: "reading"}
          - {left: "preparing food to eat", right: "cooking"}
          - {left: "making pictures with a brush", right: "painting"}
        status: "correct"
    feedback: "Elke omschrijving hoort bij één Engels woord of één Engelse uitdrukking."
  en.a1.unit30.lesson01.exercise04.order_running_sentence:
    instruction: "Zet de woorden in de juiste volgorde voor 'Hij gaat elke ochtend hardlopen'."
    accepted_answers: [{value: ["He", "goes", "running", "every", "morning"], status: correct}]
    feedback: "De juiste volgorde is He goes running every morning."
  en.a1.unit30.lesson01.exercise05.write_hobby:
    instruction: "Schrijf de hobby die betekent eten klaarmaken."
    accepted_answers:
      - {value: "cooking", status: correct}
      - {value: "Cooking", status: correct}
    feedback: "cooking betekent koken."

  en.a1.unit30.lesson02.exercise01.listen_frequency:
    instruction: "Luister en kies het genoemde bijwoord."
    correct_option: "often"
    distractors: ["always", "sometimes", "never"]
    accepted_answers: [{value: "often", status: correct}]
    feedback: "often betekent vaak."
  en.a1.unit30.lesson02.exercise02.choose_never_meaning:
