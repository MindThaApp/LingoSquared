course:
  title: "Engels B2"
  description: >-
    Engels leren op B2-niveau voor genuanceerde gesprekken, argumenten,
    speculatie en professionele discussie, met uitleg in informeel Nederlands.

units:
  en.b2.unit08.synthesis: {title: "Where the sources agree and conflict"}

lessons:
  en.b2.unit08.lesson01_source_relationships: {title: "Overeenkomst, tegenstrijdigheid en onderbouwing"}
  en.b2.unit08.lesson02_linking_sources: {title: "Both sources agree, but..."}
  en.b2.unit08.lesson03.reading_two_sources: {title: "Lezen: een enquête en een rapport van de vervoerder"}
  en.b2.unit08.lesson04.the_synthesis_dialogue: {title: "Which account is better supported?"}

teaching:
  en.b2.unit08.lesson01.teach.source: {title: "source", gloss: "bron", note: "*source* is een bron die informatie geeft. Gebruik niet overal *according to*; soms gaat het om overeenkomst of conflict tussen bronnen.", example_gloss: "Een bron geeft informatie."}
  en.b2.unit08.lesson01.teach.synthesize: {title: "synthesize", gloss: "samenbrengen, synthetiseren", note: "*synthesize* betekent informatie uit meerdere bronnen combineren tot een samenhangend antwoord.", example_gloss: "Synthetiseren is informatie uit bronnen combineren."}
  en.b2.unit08.lesson01.teach.evaluate: {title: "evaluate", gloss: "beoordelen", note: "*evaluate* betekent beoordelen hoe sterk iets is.", example_gloss: "Beoordelen is inschatten hoe sterk iets is."}
  en.b2.unit08.lesson01.teach.agreement: {title: "agreement", gloss: "overeenkomst", note: "*agreement* betekent dat bronnen hetzelfde zeggen over een punt.", example_gloss: "Overeenkomst betekent dat de bronnen hetzelfde zeggen."}
  en.b2.unit08.lesson01.teach.conflict: {title: "conflict", gloss: "tegenstrijdigheid, conflict", note: "*conflict* betekent dat bronnen elkaar tegenspreken of verschillen over een punt.", example_gloss: "Conflict betekent dat de bronnen het oneens zijn."}
  en.b2.unit08.lesson01.teach.judgement: {title: "judgment", gloss: "oordeel, afgewogen beoordeling", note: "*judgment* is een onderbouwd oordeel over welke bron sterker is. In Amerikaans Engels schrijf je *judgment*; in Brits Engels zie je ook *judgement*.", example_gloss: "Een oordeel legt uit welke bron sterker is."}

  en.b2.unit08.lesson02.teach_agree_conflict: {title: "Overeenkomst plus conflict", gloss: "Beide bronnen zijn het erover eens dat de vraag toenam, maar ze zijn het oneens over de oorzaak.", note: "*Both sources agree... but they disagree...* is beter dan twee losse zinnen met steeds *according to*."}
  en.b2.unit08.lesson02.teach_by_contrast: {title: "by contrast", gloss: "daarentegen, in tegenstelling daarmee", note: "*By contrast* gebruik je wanneer je echt twee bronnen of punten contrasteert. Gebruik het niet als algemeen stopwoord voor Nederlands daarentegen."}
  en.b2.unit08.lesson02.teach_better_supported: {title: "better supported", gloss: "beter onderbouwd", note: "*better supported on the cause* betekent dat het bewijs voor de oorzaak sterker is."}
  en.b2.unit08.lesson02.teach_grammar_synthesis: {title: "Synthese opbouwen", gloss: "Een synthese moet noemen waar bronnen overeenkomen, waar ze botsen en welk verslag beter onderbouwd is.", note: "Gebruik *agree*, *conflict* en *better supported* om de bronrelaties precies te maken."}

  en.b2.unit08.lesson03.teach_survey: {title: "survey", gloss: "enquête, onderzoek", note: "*survey* verzamelt antwoorden of opmerkingen van meerdere mensen.", example_gloss: "Een enquête kan veel opmerkingen verzamelen."}
  en.b2.unit08.lesson03.teach_account: {title: "account", gloss: "verslag, weergave", note: "*account* is een verslag of uitleg van wat er gebeurde.", example_gloss: "Een verslag legt uit wat er gebeurde."}
  en.b2.unit08.lesson03.teach.source_a: {title: "Source A", gloss: "Bron A: De passagiersenquête zegt dat late bussen vaker voorkwamen nadat het nieuwe ziekenhuis opende. Veel passagiers zeggen dat de route nu druk is, vooral in de ochtend. De enquête betoogt dat de hoofdoorzaak hogere vraag is.", note: "Bron A heeft veel opmerkingen van passagiers, maar dat is niet automatisch het sterkste bewijs voor de oorzaak."}
  en.b2.unit08.lesson03.teach.source_b: {title: "Source B", gloss: "Bron B: Het rapport van de vervoerder is het ermee eens dat de vraag toenam nadat het ziekenhuis opende, maar noemt chauffeurstekorten de hoofdoorzaak van late service. Het rapport bevat personeelsgegevens voor dezelfde periode.", note: "*staffing records* geven sterker bewijs voor de oorzaak dan alleen ervaring van passagiers."}

  en.b2.unit08.lesson04.teach.q_survey: {title: "Tessa noemt bron A", gloss: "Tessa zegt: Ik heb twee verslagen gelezen over de late busdienst. De passagiersenquête zegt dat de vraag toenam nadat het nieuwe ziekenhuis opende.", note: "Dit introduceert een bron en een punt over hogere vraag."}
  en.b2.unit08.lesson04.teach.a_operator: {title: "Rowan noemt bron B", gloss: "Rowan zegt: Het rapport van de vervoerder is het ermee eens dat de vraag toenam, maar zegt dat chauffeurstekorten het hoofdprobleem waren.", note: "Bron B bevestigt een punt, maar verschilt over de oorzaak."}
  en.b2.unit08.lesson04.teach.q_agree_conflict: {title: "Tessa synthetiseert", gloss: "Tessa zegt: Dus de bronnen zijn het eens over hogere vraag, maar botsen over de oorzaak.", note: "*agree on* en *conflict about* vatten de bronrelatie samen."}
  en.b2.unit08.lesson04.teach.a_better_supported: {title: "Rowan vraagt naar bewijs", gloss: "Rowan vraagt: Welk verslag is beter onderbouwd?", note: "Hij vraagt om een oordeel, niet alleen om samenvatting."}
  en.b2.unit08.lesson04.teach.q_evidence_compare: {title: "Tessa vergelijkt bewijs", gloss: "Tessa zegt: De enquête heeft veel opmerkingen van passagiers, maar het rapport van de vervoerder bevat personeelsgegevens.", note: "Dit is een bewijsvraag: opmerkingen versus gegevens."}
  en.b2.unit08.lesson04.teach.a_judgement_question: {title: "Rowan vraagt om oordeel", gloss: "Rowan vraagt: En dan je oordeel?", note: "*judgment* vraagt om een onderbouwde conclusie."}
  en.b2.unit08.lesson04.teach.q_final_judgement: {title: "Tessa geeft haar oordeel", gloss: "Tessa zegt: Het rapport van de vervoerder is beter onderbouwd over de oorzaak, hoewel de enquête nuttig is om de passagierservaring te laten zien.", note: "*although* houdt beide bronnen in beeld terwijl je toch een oordeel geeft."}

exercises:
