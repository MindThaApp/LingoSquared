      - {left: "evaluate", right: "beoordelen"}
      - {left: "agreement", right: "overeenkomst"}
      - {left: "conflict", right: "verschil of tegenspraak tussen bronnen"}
      - {left: "judgment", right: "oordeel, afgewogen beoordeling"}
    accepted_answers:
      - value:
          - {left: "source", right: "bron"}
          - {left: "synthesize", right: "samenbrengen, synthetiseren"}
          - {left: "evaluate", right: "beoordelen"}
          - {left: "agreement", right: "overeenkomst"}
          - {left: "conflict", right: "verschil of tegenspraak tussen bronnen"}
          - {left: "judgment", right: "oordeel, afgewogen beoordeling"}
        status: "correct"
    feedback: "Houd overeenkomst, conflict en oordeel apart; dat maakt de synthese duidelijk."
  en.b2.unit08.lesson01.exercise04_write_evaluate:
    instruction: "Schrijf het Engelse woord dat betekent: beoordelen hoe sterk iets is."
    accepted_answers:
      - {value: "evaluate", status: "correct"}
