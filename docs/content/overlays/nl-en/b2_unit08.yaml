    distractors: ["evaluate", "conflict", "judgment"]
    accepted_answers: [{value: "synthesize", status: "correct"}]
    feedback: "*synthesize* betekent informatie samenbrengen."
  en.b2.unit08.lesson01.exercise02_choose_conflict:
    instruction: "Welk woord betekent dat bronnen het oneens zijn?"
    correct_option: "conflict"
    distractors: ["agreement", "source", "support"]
    accepted_answers: [{value: "conflict", status: "correct"}]
    feedback: "*conflict* betekent dat bronnen botsen of elkaar tegenspreken."
