  en.b2.unit08.lesson04.exercise06_write_synthesis:
    instruction: "Schrijf de volledige synthese in drie zinnen: beide bronnen zijn het eens dat de vraag steeg nadat het ziekenhuis openging, maar ze botsen over de oorzaak; de enquête wijst op hogere vraag, terwijl het rapport van de vervoerder wijst op een tekort aan chauffeurs en personeelsgegevens bevat; wat de oorzaak betreft, is het rapport van de vervoerder beter onderbouwd."
    accepted_answers:
