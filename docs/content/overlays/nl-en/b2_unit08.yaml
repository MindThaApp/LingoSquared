      - {value: "Both sources agree that demand increased but they disagree about the cause.", status: "correct"}
      - {value: "Both sources agree that demand increased, but they conflict about the cause.", status: "correct"}
      - {value: "Both sources agree that demand increased but they conflict about the cause.", status: "correct"}
