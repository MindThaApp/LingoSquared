  en.b2.unit08.lesson02.exercise01_choose_agree_conflict:
    instruction: "Welke zin noemt zowel overeenkomst als conflict tussen bronnen?"
    correct_option: "Both sources agree that demand increased, but they disagree about the cause."
    distractors: ["By contrast, the operator report includes staffing records.", "The operator report is better supported on the cause.", "The survey has many passenger comments."]
    accepted_answers: [{value: "Both sources agree that demand increased, but they disagree about the cause.", status: "correct"}]
    feedback: "Deze zin combineert *agree* en *disagree* in een synthesezin."
  en.b2.unit08.lesson02.exercise02_choose_judgement:
    instruction: "Welke zin geeft een onderbouwd oordeel over bewijs?"
    correct_option: "The operator report is better supported on the cause."
    distractors: ["Both sources agree that demand increased, but they disagree about the cause.", "By contrast, the operator report includes staffing records.", "The passenger survey says demand increased."]
    accepted_answers: [{value: "The operator report is better supported on the cause.", status: "correct"}]
    feedback: "*better supported* geeft een oordeel over bewijssterkte."
  en.b2.unit08.lesson02.exercise03_order_sources_agree:
    instruction: "Zet de woorden in de juiste volgorde voor 'beide bronnen zijn het erover eens dat de vraag toenam'."
    accepted_answers: [{value: ["Both", "sources", "agree", "that", "demand", "increased"], status: "correct"}]
    feedback: "De juiste volgorde is *Both sources agree that demand increased*."
