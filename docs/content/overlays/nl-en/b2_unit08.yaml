course:
  title: "Engels B2"
  description: >-
    Engels leren op B2-niveau voor genuanceerde gesprekken, argumenten,
    speculatie en professionele discussie, met uitleg in informeel Nederlands.

units:
  en.b2.unit08.synthesis: {title: "Where the sources agree and conflict"}

lessons:
  en.b2.unit08.lesson01_source_relationships: {title: "Agreement, conflict en support"}
  en.b2.unit08.lesson02_linking_sources: {title: "Both sources agree, but..."}
  en.b2.unit08.lesson03.reading_two_sources: {title: "Lezen: survey en operator report"}
  en.b2.unit08.lesson04.the_synthesis_dialogue: {title: "Which account is better supported?"}

teaching:
  en.b2.unit08.lesson01.teach.source: {title: "source", gloss: "bron", note: "*source* is een bron die informatie geeft. Gebruik niet overal *according to*; soms gaat het om overeenkomst of conflict tussen bronnen.", example_gloss: "Een bron geeft informatie."}
  en.b2.unit08.lesson01.teach.synthesize: {title: "synthesize", gloss: "samenbrengen, synthetiseren", note: "*synthesize* betekent informatie uit meerdere bronnen combineren tot een samenhangend antwoord.", example_gloss: "Synthetiseren is informatie uit bronnen combineren."}
  en.b2.unit08.lesson01.teach.evaluate: {title: "evaluate", gloss: "beoordelen", note: "*evaluate* betekent beoordelen hoe sterk iets is.", example_gloss: "Beoordelen is inschatten hoe sterk iets is."}
  en.b2.unit08.lesson01.teach.agreement: {title: "agreement", gloss: "overeenkomst", note: "*agreement* betekent dat bronnen hetzelfde zeggen over een punt.", example_gloss: "Overeenkomst betekent dat de bronnen hetzelfde zeggen."}
  en.b2.unit08.lesson01.teach.conflict: {title: "conflict", gloss: "tegenstrijdigheid, conflict", note: "*conflict* betekent dat bronnen elkaar tegenspreken of verschillen over een punt.", example_gloss: "Conflict betekent dat de bronnen het oneens zijn."}
  en.b2.unit08.lesson01.teach.judgement: {title: "judgment", gloss: "oordeel, afgewogen beoordeling", note: "*judgment* is een onderbouwd oordeel over welke bron sterker is. De realization gebruikt Amerikaanse spelling: *judgment*.", example_gloss: "Een oordeel legt uit welke bron sterker is."}

  en.b2.unit08.lesson02.teach_agree_conflict: {title: "overeenkomst plus conflict", gloss: "Beide bronnen zijn het erover eens dat de vraag toenam, maar ze zijn het oneens over de oorzaak.", note: "*Both sources agree... but they disagree...* is beter dan twee losse zinnen met steeds *according to*."}
  en.b2.unit08.lesson02.teach_by_contrast: {title: "by contrast", gloss: "daarentegen, in tegenstelling daarmee", note: "*By contrast* gebruik je wanneer je echt twee bronnen of punten contrasteert. Vertaal Nederlands *daarentegen* niet als een algemeen stopwoord."}
  en.b2.unit08.lesson02.teach_better_supported: {title: "better supported", gloss: "beter onderbouwd", note: "*better supported on the cause* betekent dat het bewijs voor de oorzaak sterker is."}
  en.b2.unit08.lesson02.teach_grammar_synthesis: {title: "synthese opbouwen", gloss: "Een synthese moet noemen waar bronnen overeenkomen, waar ze botsen en welk verslag beter onderbouwd is.", note: "Gebruik *agree*, *conflict* en *better supported* om de bronrelaties precies te maken."}

  en.b2.unit08.lesson03.teach_survey: {title: "survey", gloss: "enquete, onderzoek", note: "*survey* verzamelt antwoorden of opmerkingen van meerdere mensen.", example_gloss: "Een enquete kan veel opmerkingen verzamelen."}
  en.b2.unit08.lesson03.teach_account: {title: "account", gloss: "verslag, weergave", note: "*account* is een verslag of uitleg van wat er gebeurde.", example_gloss: "Een verslag legt uit wat er gebeurde."}
  en.b2.unit08.lesson03.teach.source_a: {title: "Source A", gloss: "Bron A: De passagiersenquete zegt dat late bussen vaker voorkwamen nadat het nieuwe ziekenhuis opende. Veel passagiers zeggen dat de route nu druk is, vooral in de ochtend. De enquete betoogt dat de hoofdoorzaak hogere vraag is.", note: "Bron A heeft veel opmerkingen van passagiers, maar dat is niet automatisch het sterkste bewijs voor de oorzaak."}
  en.b2.unit08.lesson03.teach.source_b: {title: "Source B", gloss: "Bron B: Het operatorrapport is het ermee eens dat de vraag toenam nadat het ziekenhuis opende, maar noemt chauffeurstekorten de hoofdoorzaak van late service. Het rapport bevat personeelsgegevens voor dezelfde periode.", note: "*staffing records* geven sterker bewijs voor de oorzaak dan alleen ervaring van passagiers."}

  en.b2.unit08.lesson04.teach.q_survey: {title: "Tessa noemt bron A", gloss: "Tessa zegt: ik heb twee verslagen gelezen over de late busdienst. De passagiersenquete zegt dat de vraag toenam nadat het nieuwe ziekenhuis opende.", note: "Dit introduceert een bron en een punt over hogere vraag."}
  en.b2.unit08.lesson04.teach.a_operator: {title: "Rowan noemt bron B", gloss: "Rowan zegt: het operatorrapport is het ermee eens dat de vraag toenam, maar zegt dat chauffeurstekorten het hoofdprobleem waren.", note: "Bron B bevestigt een punt, maar verschilt over de oorzaak."}
  en.b2.unit08.lesson04.teach.q_agree_conflict: {title: "Tessa synthetiseert", gloss: "Tessa zegt: dus de bronnen zijn het eens over hogere vraag, maar botsen over de oorzaak.", note: "*agree on* en *conflict about* vatten de bronrelatie samen."}
  en.b2.unit08.lesson04.teach.a_better_supported: {title: "Rowan vraagt naar bewijs", gloss: "Rowan zegt: welk verslag is beter onderbouwd?", note: "Hij vraagt om een oordeel, niet alleen om samenvatting."}
  en.b2.unit08.lesson04.teach.q_evidence_compare: {title: "Tessa vergelijkt bewijs", gloss: "Tessa zegt: de enquete heeft veel opmerkingen van passagiers, maar het operatorrapport bevat personeelsgegevens.", note: "Dit is een bewijsvraag: opmerkingen versus gegevens."}
  en.b2.unit08.lesson04.teach.a_judgement_question: {title: "Rowan vraagt om oordeel", gloss: "Rowan zegt: en dan je oordeel?", note: "*judgment* vraagt om een onderbouwde conclusie."}
  en.b2.unit08.lesson04.teach.q_final_judgement: {title: "Tessa geeft haar oordeel", gloss: "Tessa zegt: het operatorrapport is beter onderbouwd over de oorzaak, hoewel de enquete nuttig is om de passagierservaring te laten zien.", note: "*although* houdt beide bronnen in beeld terwijl je toch een oordeel geeft."}

exercises:
  en.b2.unit08.lesson01.exercise01_choose_synthesize:
    instruction: "Welk woord betekent informatie uit meer dan een bron combineren?"
    correct_option: "synthesize"
    distractors: ["evaluate", "conflict", "judgment"]
    accepted_answers: [{value: "synthesize", status: "correct"}]
    feedback: "*synthesize* betekent informatie samenbrengen."
  en.b2.unit08.lesson01.exercise02_choose_conflict:
    instruction: "Welk woord betekent dat bronnen het oneens zijn?"
    correct_option: "conflict"
    distractors: ["agreement", "source", "support"]
    accepted_answers: [{value: "conflict", status: "correct"}]
    feedback: "*conflict* betekent dat bronnen botsen of elkaar tegenspreken."
  en.b2.unit08.lesson01.exercise03_match_synthesis_terms:
    instruction: "Verbind elk synthesewoord met zijn betekenis."
    accepted_answers:
      - value:
          - {left: "source", right: "provides information"}
          - {left: "synthesize", right: "combine information from sources"}
          - {left: "evaluate", right: "judge how strong something is"}
          - {left: "agreement", right: "sources say the same thing"}
          - {left: "conflict", right: "a difference between two reports"}
          - {left: "judgment", right: "reasoned decision about support"}
        status: "correct"
    feedback: "Houd overeenkomst, conflict en oordeel apart; dat maakt de synthese duidelijk."
  en.b2.unit08.lesson01.exercise04_write_evaluate:
    instruction: "Schrijf het Engelse woord dat betekent: beoordelen hoe sterk iets is."
    accepted_answers:
      - {value: "evaluate", status: "correct"}
      - {value: "Evaluate", status: "correct"}
    feedback: "*evaluate* betekent beoordelen."
  en.b2.unit08.lesson01.exercise05_write_judgement:
    instruction: "Schrijf het Engelse woord dat betekent: een onderbouwd oordeel over bewijs."
    accepted_answers:
      - {value: "judgment", status: "correct"}
      - {value: "Judgment", status: "correct"}
    feedback: "Gebruik hier de Amerikaanse spelling *judgment*."

  en.b2.unit08.lesson02.exercise01_choose_agree_conflict:
    instruction: "Welke zin noemt zowel overeenkomst als conflict tussen bronnen?"
    correct_option: "Both sources agree that demand increased, but they disagree about the cause."
    distractors: ["By contrast, the operator report includes staffing records.", "The operator report is better supported on the cause.", "The survey has many passenger comments."]
    accepted_answers: [{value: "Both sources agree that demand increased, but they disagree about the cause.", status: "correct"}]
    feedback: "Deze zin combineert *agree* en *disagree* in een synthesezin."
  en.b2.unit08.lesson02.exercise02_choose_judgement:
    instruction: "Welke zin geeft een onderbouwd oordeel over bewijs?"
    correct_option: "The operator report is better supported on the cause."
    distractors: ["Both sources agree that demand increased, but they disagree about the cause.", "By contrast, the operator report includes staffing records.", "The passenger survey says demand increased."]
    accepted_answers: [{value: "The operator report is better supported on the cause.", status: "correct"}]
    feedback: "*better supported* geeft een oordeel over bewijssterkte."
  en.b2.unit08.lesson02.exercise03_order_sources_agree:
    instruction: "Zet de woorden in de juiste volgorde voor «beide bronnen zijn het erover eens dat de vraag toenam»."
    accepted_answers: [{value: ["Both", "sources", "agree", "that", "demand", "increased"], status: "correct"}]
    feedback: "De juiste volgorde is *Both sources agree that demand increased*."
  en.b2.unit08.lesson02.exercise04_reply_agree_conflict:
    instruction: "Schrijf precies deze synthesezin: 'Both sources agree that demand increased, but they disagree about the cause.'"
    accepted_answers:
      - {value: "Both sources agree that demand increased, but they disagree about the cause.", status: "correct"}
      - {value: "Both sources agree that demand increased but they disagree about the cause.", status: "correct"}
    feedback: "Dit is sterker dan overal *according to* gebruiken."
  en.b2.unit08.lesson02.exercise05_write_judgement:
    instruction: "Schrijf precies dit oordeel: 'The operator report is better supported on the cause.'"
    accepted_answers:
      - {value: "The operator report is better supported on the cause.", status: "correct"}
      - {value: "The operator report is better supported on the cause", status: "correct"}
    feedback: "*on the cause* beperkt het oordeel tot de oorzaak."

  en.b2.unit08.lesson03.exercise01_choose_agreement:
    instruction: "Waarover zijn de twee bronnen het eens?"
    correct_option: "demand increased after the hospital opened"
    distractors: ["driver shortages caused every delay", "passenger comments are staffing records", "the route became quieter"]
    accepted_answers: [{value: "demand increased after the hospital opened", status: "correct"}]
    feedback: "Beide bronnen noemen hogere vraag na de opening van het ziekenhuis."
  en.b2.unit08.lesson03.exercise02_choose_conflict:
    instruction: "Wat is het conflictpunt tussen de twee bronnen?"
    correct_option: "the main cause of late service"
    distractors: ["whether the hospital opened", "whether passengers exist", "whether buses are a service"]
    accepted_answers: [{value: "the main cause of late service", status: "correct"}]
    feedback: "Ze zijn het eens over hogere vraag, maar niet over de hoofdoorzaak."
  en.b2.unit08.lesson03.exercise03_match_sources:
    instruction: "Verbind elke syntheserol met het juiste detail uit de bronnen."
    accepted_answers:
      - value:
          - {left: "Source A evidence", right: "passenger comments"}
          - {left: "Source B evidence", right: "staffing records"}
          - {left: "agreement", right: "demand increased after the hospital opened"}
          - {left: "Source A cause", right: "higher demand"}
          - {left: "Source B cause", right: "driver shortages"}
          - {left: "stronger support for the cause", right: "operator report"}
        status: "correct"
    feedback: "De matching houdt bewijs, overeenkomst, conflict en oordeel uit elkaar."
  en.b2.unit08.lesson03.exercise04_write_agreement:
    instruction: "Schrijf precies: 'Both sources agree that demand increased after the hospital opened.'"
    accepted_answers:
      - {value: "Both sources agree that demand increased after the hospital opened.", status: "correct"}
      - {value: "Both sources agree that demand increased after the hospital opened", status: "correct"}
    feedback: "*Both sources agree that...* is een compacte syntheseformule."
  en.b2.unit08.lesson03.exercise05_write_conflict:
    instruction: "Schrijf precies: 'They conflict about whether higher demand or driver shortages caused the late service.'"
    accepted_answers:
      - {value: "They conflict about whether higher demand or driver shortages caused the late service.", status: "correct"}
      - {value: "They conflict about whether higher demand or driver shortages caused the late service", status: "correct"}
    feedback: "*whether... or...* benoemt het conflictpunt precies."

  en.b2.unit08.lesson04.exercise01_choose_agreement:
    instruction: "Luister naar het gesprek. Waarover zijn de twee verslagen het eens?"
    correct_option: "demand increased"
    distractors: ["fares doubled", "the timetable disappeared", "all drivers resigned"]
    accepted_answers: [{value: "demand increased", status: "correct"}]
    feedback: "Beide verslagen zeggen dat de vraag toenam."
  en.b2.unit08.lesson04.exercise02_listen_judgement:
    instruction: "Luister en kies Tessa's oordeel over welke bron beter onderbouwd is."
    correct_option: "The operator report is better supported on the cause"
    distractors: ["The survey proves the staffing budget", "The hospital report is the newest source", "The comments are better for the cause"]
    accepted_answers: [{value: "The operator report is better supported on the cause", status: "correct"}]
    feedback: "Tessa zegt dat het operatorrapport beter onderbouwd is over de oorzaak."
  en.b2.unit08.lesson04.exercise03_order_conflict:
    instruction: "Zet de woorden in de juiste volgorde voor «de bronnen zijn het eens over hogere vraag, maar botsen over de oorzaak»."
    accepted_answers: [{value: ["the", "sources", "agree", "on", "higher", "demand", "but", "conflict", "about", "the", "cause"], status: "correct"}]
    feedback: "De juiste volgorde is *the sources agree on higher demand but conflict about the cause*."
  en.b2.unit08.lesson04.exercise04_reply_as_tessa:
    instruction: "Vergelijk de onderbouwing in de twee bronnen precies: 'The survey has many passenger comments, but the operator report includes staffing records.'"
    accepted_answers:
      - {value: "The survey has many passenger comments, but the operator report includes staffing records.", status: "correct"}
      - {value: "The survey has many passenger comments but the operator report includes staffing records.", status: "correct"}
    feedback: "Hier contrasteer je soorten bewijs; *by contrast* past alleen wanneer je expliciet contrasteert."
  en.b2.unit08.lesson04.exercise05_speak_synthesis:
    instruction: "Vat de twee bronnen hardop samen met drie verplichte onderdelen: overeenkomst, conflict en onderbouwd oordeel."
    accepted_answers:
      - {value: "Both sources agree that demand increased after the hospital opened, but they conflict about the cause. The survey points to higher demand, while the operator report points to driver shortages and includes staffing records. The operator report is better supported on the cause.", status: "correct"}
      - {value: "Both sources agree that demand increased after the hospital opened but they conflict about the cause. The survey points to higher demand, while the operator report points to driver shortages and includes staffing records. The operator report is better supported on the cause.", status: "correct"}
    feedback: "De synthese noemt niet alleen wat elke bron zegt, maar ook hoe de bronnen zich tot elkaar verhouden."
  en.b2.unit08.lesson04.exercise06_write_synthesis:
    instruction: "Schrijf deze volledige synthese met overeenkomst, conflict en oordeel: 'Both sources agree that demand increased after the hospital opened, but they conflict about the cause. The survey points to higher demand, while the operator report points to driver shortages and includes staffing records. The operator report is better supported on the cause.'"
    accepted_answers:
      - {value: "Both sources agree that demand increased after the hospital opened, but they conflict about the cause. The survey points to higher demand, while the operator report points to driver shortages and includes staffing records. The operator report is better supported on the cause.", status: "correct"}
      - {value: "Both sources agree that demand increased after the hospital opened but they conflict about the cause. The survey points to higher demand, while the operator report points to driver shortages and includes staffing records. The operator report is better supported on the cause.", status: "correct"}
    feedback: "Dit levert het B2-doel: meerdere bronnen samenvatten, vergelijken en beoordelen."
