    feedback: "de juiste volgorde is *I can't be home between 2pm and 4pm*."
  en.a2.unit38.lesson02.exercise06.reply_ask_for_morning:
    instruction: "De beheerder biedt het middagtijdvak aan. Vraag formeel of de loodgieter in plaats daarvan in de ochtend kan komen."
    accepted_answers:
      - {value: "Would it be possible to come in the morning instead?", status: "correct"}
      - {value: "Would it be possible to come in the morning instead", status: "correct"}
    feedback: "*Would it be possible to come in the morning instead?* is het verzoek uit deze les."
  en.a2.unit38.lesson02.exercise07.write_reschedule_request:
    instruction: "Schrijf dat je de reparatie moet verzetten."
    accepted_answers:
      - {value: "I need to reschedule the repair.", status: "correct"}
      - {value: "I need to reschedule the repair", status: "correct"}
    feedback: "*I need to reschedule the repair* betekent: ik moet de reparatie verzetten."

  en.a2.unit38.lesson03.exercise01.read_new_time:
    instruction: "Wanneer komt de loodgieter nu, volgens het bericht?"
    correct_option: "tomorrow between 9am and 11am"
    distractors: ["today between 9am and 11am", "tomorrow between 2pm and 4pm", "on Friday between 9am and 11am"]
    accepted_answers: [{value: "tomorrow between 9am and 11am", status: "correct"}]
    feedback: "in het bericht staat *tomorrow between 9am and 11am*."
  en.a2.unit38.lesson03.exercise02.read_who_opens_the_door:
