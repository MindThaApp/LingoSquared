    accepted_answers: [{value: "Repair 6180 has been rescheduled", status: "correct"}]
    feedback: "het bericht begint met *Repair 6180 has been rescheduled*."
  en.a2.unit38.lesson03.exercise05.order_plumber_new_window:
    instruction: "Zet de woorden in de juiste volgorde voor «de loodgieter komt morgen tussen negen en elf uur»."
    accepted_answers: [{value: ["The", "plumber", "will", "come", "tomorrow", "between", "9am", "and", "11am"], status: "correct"}]
    feedback: "de juiste volgorde is *The plumber will come tomorrow between 9am and 11am*."
  en.a2.unit38.lesson03.exercise06.write_confirm_request:
    instruction: "Schrijf het verzoek uit het bericht, beginnend met Please confirm."
    accepted_answers:
      - {value: "Please confirm this new time by message today.", status: "correct"}
      - {value: "Please confirm this new time by message today", status: "correct"}
    feedback: "*Please confirm this new time by message today* betekent: bevestig deze nieuwe tijd vandaag nog per bericht."

  en.a2.unit38.lesson04.exercise01.listen_new_window:
    instruction: "Luister naar het gesprek en kies het nieuwe tijdvak van de loodgieter."
    correct_option: "between 9am and 11am"
    distractors: ["between 8am and 10am", "between 10am and 12pm", "between 1pm and 3pm"]
    accepted_answers: [{value: "between 9am and 11am", status: "correct"}]
    feedback: "de beheerder zegt *between 9am and 11am*."
  en.a2.unit38.lesson04.exercise02.listen_key_arrangement:
    instruction: "Luister en kies wat Daniel met de sleutel doet."
    correct_option: "I will leave the key with my neighbor"
    distractors: ["I will bring the key to the office", "I will leave the key under the door", "I will give the key to the plumber"]
    accepted_answers: [{value: "I will leave the key with my neighbor", status: "correct"}]
    feedback: "Daniel zegt *I will leave the key with my neighbor*."
  en.a2.unit38.lesson04.exercise03.choose_reason:
    instruction: "Waarom kan Daniel niet tussen twee en vier uur thuis zijn?"
    correct_option: "because I am at work"
    distractors: ["because he is not at home in the morning", "because his neighbor has the key", "because the plumber is late"]
    accepted_answers: [{value: "because I am at work", status: "correct"}]
    feedback: "Daniel zegt *because I am at work*."
  en.a2.unit38.lesson04.exercise04.order_possible_morning:
    instruction: "Zet de woorden in de juiste volgorde voor «zou het mogelijk zijn om in plaats daarvan in de ochtend te komen?»."
    accepted_answers: [{value: ["Would", "it", "be", "possible", "to", "come", "in", "the", "morning", "instead"], status: "correct"}]
    feedback: "de juiste volgorde is *Would it be possible to come in the morning instead*."
  en.a2.unit38.lesson04.exercise05.reply_why_cant_you_be_home:
    instruction: "De beheerder vraagt waarom je niet thuis kunt zijn. Geef het tijdvak en de reden, met because."
    accepted_answers:
      - {value: "I can't be home between 2pm and 4pm because I am at work.", status: "correct"}
      - {value: "I can't be home between 2pm and 4pm because I am at work", status: "correct"}
    feedback: "*I can't be home between 2pm and 4pm because I am at work* geeft eerst het probleem en daarna de reden."
  en.a2.unit38.lesson04.exercise06.speak_repair_visit_dialogue:
    instruction: "Speel Daniel aan de telefoon: zeg waarvoor je belt, geef je reden en vraag om de ochtend."
    accepted_answers:
      - {value: "I need to reschedule the repair. I can't be home between 2pm and 4pm because I am at work. Would it be possible to come in the morning instead?", status: "correct"}
      - {value: "I need to reschedule the repair. I cannot be home between 2pm and 4pm because I am at work. Would it be possible to come in the morning instead?", status: "correct"}
