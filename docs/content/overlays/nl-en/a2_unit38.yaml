    correct_option: "your neighbor"
    distractors: ["the building manager", "the plumber", "nobody"]
    accepted_answers: [{value: "your neighbor", status: "correct"}]
    feedback: "in het bericht staat *Your neighbor will open the door*."
  en.a2.unit38.lesson03.exercise03.read_what_you_must_do:
    instruction: "Wat moet je volgens het bericht nog doen?"
