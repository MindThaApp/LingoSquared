course:
  title: "Engels A2"
  description: "Engels leren op A2-niveau voor formelere situaties, met gedetailleerde uitleg in het Nederlands."

units:
  en.a2.unit38.repair_visit: {title: "Een reparatieafspraak verzetten en bevestigen"}

lessons:
  en.a2.unit38.lesson01.repair_visit_vocabulary: {title: "Verzetten, sleutels en buren"}
  en.a2.unit38.lesson02.moving_the_appointment: {title: "De afspraak naar een ander moment verzetten"}
  en.a2.unit38.lesson03.reading_a_rescheduling_message: {title: "Een bericht over de nieuwe afspraak lezen"}
  en.a2.unit38.lesson04.repair_visit_dialogue: {title: "Bellen om de reparatie te verzetten"}

teaching:
  en.a2.unit38.lesson01.teach.reschedule: {title: "reschedule", gloss: "verzetten", note: "*reschedule* betekent een afspraak naar een ander moment verplaatsen.", example_gloss: "Ik moet de reparatie verzetten, want ik ben dan op mijn werk."}
  en.a2.unit38.lesson01.teach.neighbor: {title: "neighbor", gloss: "buurman, buurvrouw", note: "*neighbor* is de persoon die naast je woont; het Engelse woord zegt niets over man of vrouw.", example_gloss: "Mijn buurvrouw kan de deur voor de loodgieter opendoen."}
  en.a2.unit38.lesson01.teach.key: {title: "key", gloss: "sleutel", note: "*key* is het metalen dingetje waarmee je je deur opendoet.", example_gloss: "Ik laat de sleutel bij mijn buurvrouw achter."}
  en.a2.unit38.lesson01.teach.leak: {title: "leak", gloss: "lekkage", note: "*leak* is hier een zelfstandig naamwoord: het lek zelf. Het werkwoord *to leak* betekent lekken.", example_gloss: "De lekkage onder mijn aanrecht wordt erger."}
  en.a2.unit38.lesson01.teach.fixed: {title: "fixed", gloss: "gemaakt, gerepareerd", note: "*fixed* is het voltooid deelwoord van *to fix*: niet meer kapot.", example_gloss: "De kraan is nu gemaakt en het water is gestopt."}
  en.a2.unit38.lesson01.teach.afternoon: {title: "afternoon", gloss: "middag", note: "*afternoon* is het deel van de dag na twaalf uur; *morning* is de ochtend.", example_gloss: "De loodgieter kwam in de middag, niet in de ochtend."}
  en.a2.unit38.lesson01.teach.grammar_cant_wont: {title: "can't en won't om te zeggen dat het niet lukt", gloss: "Ik kan niet tussen twee en vier uur thuis zijn. Ik ben 's middags niet thuis.", note: "*can't* zegt dat iets onmogelijk is; *won't* zegt dat het gewoon niet gaat gebeuren."}

  en.a2.unit38.lesson02.teach.need_to_reschedule: {title: "zeggen dat je de afspraak wilt verzetten", gloss: "Ik moet de reparatie verzetten.", note: "*I need to...* is neutraal en zakelijk: het moet, maar het klinkt niet onbeleefd."}
  en.a2.unit38.lesson02.teach.possible_in_the_morning: {title: "vragen om een ander tijdstip", gloss: "Zou het mogelijk zijn om in plaats daarvan in de ochtend te komen?", note: "*Would it be possible to...?* is de voorzichtigste manier om iets te vragen; *instead* betekent in plaats daarvan."}
  en.a2.unit38.lesson02.teach.leave_key_with_neighbor: {title: "vertellen waar de sleutel is", gloss: "Ik laat de sleutel bij mijn buurvrouw achter.", note: "*leave something with someone* betekent iets bij iemand achterlaten."}
  en.a2.unit38.lesson02.teach.is_the_leak_fixed: {title: "vragen of het probleem verholpen is", gloss: "Is de lekkage nu gemaakt?", note: "*Is ... fixed?* vraagt naar het resultaat, niet naar het werk zelf."}
  en.a2.unit38.lesson02.teach.grammar_because_reason: {title: "een reden geven met because", gloss: "Ik kan niet tussen twee en vier uur thuis zijn, omdat ik dan op mijn werk ben.", note: "*because* verbindt het probleem met de reden; in het Engels verandert de woordvolgorde daarna niet."}

  en.a2.unit38.lesson03.teach.message: {title: "message", gloss: "bericht", note: "*message* is elk kort geschreven bericht: een sms, een appje of een mailtje.", example_gloss: "Ik kreeg een bericht over de nieuwe reparatietijd."}
  en.a2.unit38.lesson03.teach.rescheduling_text: {title: "het bericht over de nieuwe afspraak", gloss: "Reparatie 6180 is verzet. De loodgieter komt morgen tussen negen en elf uur. Uw buurvrouw doet de deur open. Bevestig deze nieuwe tijd vandaag nog per bericht.", note: "een bericht van de beheerder is kort en zakelijk: wat er veranderd is, wanneer, en wat jij nog moet doen."}
  en.a2.unit38.lesson03.teach.confirm_by_message: {title: "gevraagd worden om te bevestigen", gloss: "Bevestig deze nieuwe tijd vandaag nog per bericht.", note: "*confirm* betekent bevestigen; *by message* betekent per bericht."}

  en.a2.unit38.lesson04.teach.q_need_to_reschedule: {title: "Daniel belt de beheerder", gloss: "Daniel zegt: hallo, ik moet de reparatie verzetten.", note: "aan de telefoon begin je met *Hello* en meteen daarna met de reden van je telefoontje."}
  en.a2.unit38.lesson04.teach.a_which_repair: {title: "de beheerder vraagt welke reparatie", gloss: "De beheerder zegt: geen probleem. Om welke reparatie gaat het?", note: "*Which repair is it?* vraagt naar één ding uit een bekende groep."}
  en.a2.unit38.lesson04.teach.q_repair_6180: {title: "Daniel noemt het reparatienummer", gloss: "Daniel zegt: reparatie 6180, de lekkage onder mijn aanrecht.", note: "hetzelfde reparatienummer als in unit 29: dezelfde lekkende kraan."}
  en.a2.unit38.lesson04.teach.a_why_cant_you_be_home: {title: "de beheerder vraagt naar de reden", gloss: "De beheerder zegt: ik begrijp het. Waarom kunt u niet thuis zijn?", note: "*Why can't you...?* vraagt naar de reden waarom iets niet lukt."}
  en.a2.unit38.lesson04.teach.q_at_work_ask_morning: {title: "Daniel geeft de reden en vraagt om de ochtend", gloss: "Daniel zegt: ik kan niet tussen twee en vier uur thuis zijn, omdat ik dan op mijn werk ben. Zou het mogelijk zijn om in plaats daarvan in de ochtend te komen?", note: "eerst de reden, dan het verzoek -- dat is beleefder dan meteen om iets vragen."}
  en.a2.unit38.lesson04.teach.a_plumber_can_come_morning: {title: "de beheerder biedt een nieuw tijdvak aan", gloss: "De beheerder zegt: ja, de loodgieter kan tussen negen en elf uur komen.", note: "*between 9am and 11am* is het nieuwe tijdvak."}
  en.a2.unit38.lesson04.teach.q_leave_key: {title: "Daniel regelt de sleutel", gloss: "Daniel zegt: dank u wel. Ik laat de sleutel bij mijn buurvrouw achter.", note: "dezelfde zin die we in les 2 hebben geleerd."}
  en.a2.unit38.lesson04.teach.a_please_confirm: {title: "de beheerder vraagt om bevestiging", gloss: "De beheerder zegt: goed. Bevestig deze nieuwe tijd vandaag nog per bericht.", note: "dezelfde instructie als in het bericht in les 3."}
  en.a2.unit38.lesson04.teach.q_will_confirm_this_afternoon: {title: "Daniel zegt wanneer hij bevestigt", gloss: "Daniel zegt: ik bevestig het vanmiddag.", note: "*this afternoon* betekent vanmiddag, dus vandaag na twaalf uur."}

exercises:
  en.a2.unit38.lesson01.exercise01.listen_word:
    instruction: "Luister en kies het woord dat gezegd wordt."
    correct_option: "neighbor"
    distractors: ["key", "leak", "afternoon"]
    accepted_answers: [{value: "neighbor", status: "correct"}]
    feedback: "*neighbor* betekent buurman of buurvrouw."
  en.a2.unit38.lesson01.exercise02.choose_reschedule_word:
    instruction: "Welk woord betekent een afspraak naar een ander moment verplaatsen?"
    correct_option: "reschedule"
    distractors: ["repair", "confirm", "leave"]
    accepted_answers: [{value: "reschedule", status: "correct"}]
    feedback: "*reschedule* betekent verzetten."
  en.a2.unit38.lesson01.exercise03.choose_neighbor_word:
    instruction: "Welk woord betekent de persoon die naast je woont?"
    correct_option: "neighbor"
    distractors: ["plumber", "manager", "key"]
    accepted_answers: [{value: "neighbor", status: "correct"}]
    feedback: "*neighbor* betekent buurman of buurvrouw."
  en.a2.unit38.lesson01.exercise04.match_repair_visit_words:
    instruction: "Verbind elk Engels woord met de juiste Nederlandse omschrijving."
    pairs: [{left: "reschedule", right: "een afspraak naar een ander moment verplaatsen"}, {left: "neighbor", right: "persoon die naast je woont"}, {left: "key", right: "klein metalen voorwerp waarmee je jouw deur opent"}, {left: "leak", right: "water dat uit een leiding komt waar dat niet hoort"}, {left: "fixed", right: "niet meer kapot en weer werkend"}, {left: "afternoon", right: "deel van de dag na twaalf uur"}, {left: "plumber", right: "vakman die problemen met waterleidingen oplost"}, {left: "repair", right: "werk waarmee iets dat kapot is weer gaat functioneren"}]
    accepted_answers: [{value: [{left: "reschedule", right: "een afspraak naar een ander moment verplaatsen"}, {left: "neighbor", right: "persoon die naast je woont"}, {left: "key", right: "klein metalen voorwerp waarmee je jouw deur opent"}, {left: "leak", right: "water dat uit een leiding komt waar dat niet hoort"}, {left: "fixed", right: "niet meer kapot en weer werkend"}, {left: "afternoon", right: "deel van de dag na twaalf uur"}, {left: "plumber", right: "vakman die problemen met waterleidingen oplost"}, {left: "repair", right: "werk waarmee iets dat kapot is weer gaat functioneren"}], status: "correct"}]
    feedback: "*reschedule*=verzetten, *neighbor*=buurvrouw, *key*=sleutel, *leak*=lekkage, *fixed*=gemaakt, *afternoon*=middag, *plumber*=loodgieter, *repair*=reparatie."
  en.a2.unit38.lesson01.exercise05.write_neighbor:
    instruction: "Schrijf het Engelse woord voor de persoon die naast je woont."
    accepted_answers:
      - {value: "neighbor", status: "correct"}
      - {value: "Neighbor", status: "correct"}
    feedback: "*neighbor* betekent buurman of buurvrouw."

  en.a2.unit38.lesson02.exercise01.listen_reschedule_request:
    instruction: "Luister en kies de zin die gezegd wordt."
    correct_option: "I need to reschedule the repair"
    distractors: ["I will leave the key with my neighbor.", "Is the leak fixed now?", "Would it be possible to come in the morning instead?"]
    accepted_answers: [{value: "I need to reschedule the repair", status: "correct"}]
    feedback: "dit betekent: ik moet de reparatie verzetten."
  en.a2.unit38.lesson02.exercise02.choose_reschedule_request:
    instruction: "Je belt de beheerder omdat het afgesproken tijdstip je niet uitkomt. Wat zeg je als eerste?"
    correct_option: "I need to reschedule the repair."
    distractors: ["I will leave the key with my neighbor.", "Is the leak fixed now?", "Would it be possible to come in the morning instead?"]
    accepted_answers: [{value: "I need to reschedule the repair.", status: "correct"}]
    feedback: "eerst zeg je waarvoor je belt; het nieuwe tijdstip vraag je daarna."
  en.a2.unit38.lesson02.exercise03.choose_polite_morning_request:
    instruction: "Je wilt dat de loodgieter in de ochtend komt. Hoe vraag je dat formeel?"
    correct_option: "Would it be possible to come in the morning instead?"
    distractors: ["I need to reschedule the repair.", "I will leave the key with my neighbor.", "Is the leak fixed now?"]
    accepted_answers: [{value: "Would it be possible to come in the morning instead?", status: "correct"}]
    feedback: "*Would it be possible to...?* is de voorzichtigste, meest formele verzoekvorm."
  en.a2.unit38.lesson02.exercise04.order_leave_key:
