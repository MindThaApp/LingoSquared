review:
  status: reviewed
  required_next_reviewer: codex_fresh_context
  notes: >-
    Draft only. Overlay against the shared en/a1_unit31_appearance.yaml
    realization (itself still unreviewed). Named to match the underlying
    realization's unit number (unit31), not nl-en's own older sequential
    numbering. New contrastive-grammar point, deliberately different from
    the two already used in this direction (unit16's frequency-adverb
    placement, unit25/unit30's V2 inversion after a fronted adverb): Dutch
    questions invert subject and verb directly with no auxiliary ("Hoe
    ziet zij eruit?" -- literally "How looks she out?"), while English
    requires do-support with a content verb ("What does she look like?",
    never "*What looks she like?"). This directly reinforces the
    what_look_like phrase card the underlying realization already teaches.
    Strong sibling-isolation rule applied -- fa-en/prs-en overlays for
    this same unit were not opened. Needs the mandatory fresh-context
    review before shipping.

course:
  title: Engels A1
  description: >-
    Engels voor beginners, met heldere uitleg in het Nederlands en aandacht
    voor alledaagse gesprekken.

units:
  en.a1.unit31.appearance: {title: "Uiterlijk beschrijven"}

lessons:
  en.a1.unit31.lesson01.height_and_hair: {title: "Lengte en haar"}
  en.a1.unit31.lesson02.eyes_and_description: {title: "Oogkleur en iemand beschrijven"}
  en.a1.unit31.lesson03.dialogue_new_coworker: {title: "Gesprek: De nieuwe collega"}
  en.a1.unit31.lesson04.comparing_appearances: {title: "Lezen: Twee vrienden"}

teaching:
  en.a1.unit31.lesson01.teach.tall: {title: "tall", gloss: "lang", note: "tall betekent lang (voor de lengte van een persoon)."}
  en.a1.unit31.lesson01.teach.short: {title: "short", gloss: "klein", note: "short betekent hier klein (voor een persoon); voor kort haar gebruik je ook short, maar voor een korte lengte bij dingen gebruik je meestal een ander woord."}
  en.a1.unit31.lesson01.teach.hair: {title: "hair", gloss: "haar", note: "hair betekent haar."}
  en.a1.unit31.lesson01.teach.blond: {title: "blond", gloss: "blond", note: "blond betekent blond."}
  en.a1.unit31.lesson01.teach.curly: {title: "curly", gloss: "krullend", note: "curly betekent krullend."}

  en.a1.unit31.lesson02.teach.eyes: {title: "eyes", gloss: "ogen", note: "eyes betekent ogen."}
  en.a1.unit31.lesson02.teach.blue: {title: "blue", gloss: "blauw", note: "blue betekent blauw."}
  en.a1.unit31.lesson02.teach.brown: {title: "brown", gloss: "bruin", note: "brown betekent bruin."}
  en.a1.unit31.lesson02.teach.green: {title: "green", gloss: "groen", note: "green betekent groen."}
  en.a1.unit31.lesson02.teach.glasses: {title: "glasses", gloss: "een bril", note: "glasses betekent een bril; wears glasses betekent draagt een bril."}
  en.a1.unit31.lesson02.teach.what_look_like: {title: "What does she look like?", gloss: "Hoe ziet zij eruit?", note: "Let op de zinsbouw: in het Nederlands draai je onderwerp en werkwoord gewoon om voor een vraag (Hoe ziet zij eruit? -- letterlijk 'How looks she out?'), zonder hulpwerkwoord nodig. In het Engels moet je bij een gewoon werkwoord (look) altijd does/do gebruiken: What does she look like?, NOOIT 'What looks she like?'. Dit does-gebruik (do-support) is een van de dingen die Nederlandstaligen het vaakst vergeten."}

  en.a1.unit31.lesson03.teach.dialogue_line1: {title: "Leila's opening", gloss: "Leila zegt: We hebben vandaag een nieuwe collega. Ze heet Mia.", note: "starting today betekent vandaag beginnend/vanaf vandaag."}
  en.a1.unit31.lesson03.teach.dialogue_line2: {title: "Daniels vraag", gloss: "Daniel vraagt: Hoe ziet zij eruit?", note: "Nogmaals do-support: does, niet weglaten of omdraaien zoals in het Nederlands."}
  en.a1.unit31.lesson03.teach.dialogue_line3: {title: "Leila's beschrijving", gloss: "Leila zegt: Ze is lang en heeft krullend, blond haar.", note: "She's is de samentrekking van she is."}
  en.a1.unit31.lesson03.teach.dialogue_line4: {title: "Daniels vervolgvraag", gloss: "Daniel vraagt: Draagt ze een bril?", note: "Ook hier do-support: Does she wear glasses?, geen omgekeerde volgorde zonder does."}
  en.a1.unit31.lesson03.teach.dialogue_line5: {title: "Leila's antwoord", gloss: "Leila zegt: Ja, dat klopt. Ze heeft ook groene ogen.", note: "Yes, she does is een kort bevestigend antwoord dat het hulpwerkwoord does herhaalt."}
  en.a1.unit31.lesson03.teach.dialogue_line6: {title: "Daniels laatste opmerking", gloss: "Daniel zegt: Oké, ik denk dat ik haar nu bij de deur zie.", note: "at the door betekent bij de deur."}

  en.a1.unit31.lesson04.teach.reading_passage: {title: "Tekst over Daniel en Leila", gloss: "Daniel en Leila zijn goede vrienden, maar ze zien er niet hetzelfde uit. Daniel is lang en heeft kort, zwart haar. Hij draagt een bril. Leila is klein en heeft lang, krullend, blond haar. Zij heeft groene ogen, en Daniel heeft bruine ogen. Ze lachen allebei graag veel.", note: "don't look the same betekent zien er niet hetzelfde uit -- ook hier do-support (don't = do not), zelfs in een ontkenning."}

exercises:
  en.a1.unit31.lesson01.exercise01.listen_trait:
    instruction: "Luister en kies het genoemde kenmerk."
    correct_option: "curly"
    distractors: ["tall", "short", "blond"]
    accepted_answers: [{value: "curly", status: correct}]
    feedback: "curly betekent krullend."
  en.a1.unit31.lesson01.exercise02.choose_short_meaning:
    instruction: "Welk woord beschrijft iemand die niet lang is?"
    correct_option: "short"
    distractors: ["tall", "curly", "blond"]
    accepted_answers: [{value: "short", status: correct}]
    feedback: "short betekent klein (voor een persoon)."
  en.a1.unit31.lesson01.exercise03.match_traits:
    instruction: "Verbind elke omschrijving met het juiste woord."
    accepted_answers: [{value: [{left: "having a big height", right: "tall"}, {left: "having a small height", right: "short"}, {left: "grows on your head", right: "hair"}, {left: "a light yellow hair color", right: "blond"}, {left: "hair with lots of small circles or waves", right: "curly"}], status: correct}]
    feedback: "tall=lang, short=klein, hair=haar, blond=blond, curly=krullend."
  en.a1.unit31.lesson01.exercise04.order_hair_sentence:
    instruction: "Zet de woorden in de juiste volgorde voor 'Ze heeft lang haar.'"
    accepted_answers: [{value: ["She", "has", "long", "hair."], status: correct}]
    feedback: "De juiste volgorde is She has long hair."
  en.a1.unit31.lesson01.exercise05.write_trait:
    instruction: "Schrijf het woord dat betekent dat iemand een grote lengte heeft."
    accepted_answers:
      - {value: "tall", status: correct}
      - {value: "Tall", status: correct}
    feedback: "tall betekent lang."

  en.a1.unit31.lesson02.exercise01.listen_eyes:
    instruction: "Luister en kies de genoemde oogkleur."
    correct_option: "green eyes"
    distractors: ["blue eyes", "brown eyes"]
    accepted_answers: [{value: "green eyes", status: correct}]
    feedback: "green eyes betekent groene ogen."
  en.a1.unit31.lesson02.exercise02.choose_glasses_meaning:
    instruction: "Welk woord betekent het object dat je op je gezicht draagt om beter te zien?"
    correct_option: "glasses"
    distractors: ["eyes", "hair", "blue"]
    accepted_answers: [{value: "glasses", status: correct}]
    feedback: "glasses betekent een bril."
  en.a1.unit31.lesson02.exercise03.choose_eye_color:
    instruction: "Welke van deze woorden is een oogkleur?"
    correct_option: "blue"
    distractors: ["tall", "curly", "glasses"]
    accepted_answers: [{value: "blue", status: correct}]
    feedback: "blue betekent blauw, een oogkleur."
  en.a1.unit31.lesson02.exercise04.order_eyes_sentence:
    instruction: "Zet de woorden in de juiste volgorde voor 'Haar ogen zijn blauw.'"
    accepted_answers: [{value: ["Her", "eyes", "are", "blue."], status: correct}]
    feedback: "De juiste volgorde is Her eyes are blue."
  en.a1.unit31.lesson02.exercise05.translate_look_like:
    instruction: "Vertaal: 'Hoe ziet zij eruit?'"
    accepted_answers:
      - {value: "What does she look like?", status: correct}
      - {value: "What does she look like", status: correct}
    feedback: "What does she look like? gebruikt do-support (does) -- niet weglaten, ook al draai je in het Nederlands gewoon onderwerp en werkwoord om zonder hulpwerkwoord."

  en.a1.unit31.lesson03.exercise01.comprehension_mia_hair:
    instruction: "Hoe ziet Mia's haar eruit volgens het gesprek?"
    correct_option: "curly, blond hair"
    distractors: ["short, black hair", "long, brown hair"]
    accepted_answers: [{value: "curly, blond hair", status: correct}]
    feedback: "Leila zegt: she has curly, blond hair."
  en.a1.unit31.lesson03.exercise02.comprehension_mia_eyes:
    instruction: "Welke oogkleur heeft Mia?"
    correct_option: "green"
    distractors: ["blue", "brown"]
    accepted_answers: [{value: "green", status: correct}]
    feedback: "Leila zegt: She has green eyes too."
  en.a1.unit31.lesson03.exercise03.listen_dialogue_height:
    instruction: "Hoe lang is Mia volgens het gesprek?"
    correct_option: "tall"
    distractors: ["short", "average height"]
    accepted_answers: [{value: "tall", status: correct}]
    feedback: "Leila zegt: She's tall."
  en.a1.unit31.lesson03.exercise04.respond_describe_someone:
    instruction: "Beschrijf het uiterlijk van een vriend(in) of familielid in één zin."
    accepted_answers: ["She has brown hair", "She has brown hair.", "He has brown hair", "He has brown hair.", "She has blond hair", "She has blond hair.", "He has blond hair", "He has blond hair.", "She is tall", "She is tall.", "He is tall", "He is tall.", "She has blue eyes", "She has blue eyes.", "He has blue eyes", "He has blue eyes."]
    feedback: "Gebruik has + haarkleur/ogen of is + lengte."

  en.a1.unit31.lesson04.exercise01.reading_daniel_hair:
    instruction: "Hoe ziet Daniels haar eruit volgens de tekst?"
    correct_option: "short, black hair"
    distractors: ["long, curly hair", "blond hair"]
    accepted_answers: [{value: "short, black hair", status: correct}]
    feedback: "De tekst zegt: Daniel is tall and has short, black hair."
  en.a1.unit31.lesson04.exercise02.reading_who_wears_glasses:
    instruction: "Wie draagt er volgens de tekst een bril?"
    correct_option: "Daniel"
    distractors: ["Leila", "Both", "Neither"]
    accepted_answers: [{value: "Daniel", status: correct}]
    feedback: "De tekst zegt: He wears glasses (over Daniel)."
  en.a1.unit31.lesson04.exercise03.reading_leila_eyes:
    instruction: "Welke oogkleur heeft Leila volgens de tekst?"
    correct_option: "green"
    distractors: ["blue", "brown"]
    accepted_answers: [{value: "green", status: correct}]
    feedback: "De tekst zegt: She has green eyes."
  en.a1.unit31.lesson04.exercise04.write_own_description:
    instruction: "Schrijf één zin over hoe jij eruitziet, met 'I have' of 'I am'."
    accepted_answers: ["I have brown hair", "I have brown hair.", "I have black hair", "I have black hair.", "I have blond hair", "I have blond hair.", "I have blue eyes", "I have blue eyes.", "I have green eyes", "I have green eyes.", "I have brown eyes", "I have brown eyes.", "I am tall", "I am tall.", "I am short", "I am short."]
    feedback: "I have + haarkleur/ogen of I am + lengte is een natuurlijke manier om jezelf te beschrijven."
