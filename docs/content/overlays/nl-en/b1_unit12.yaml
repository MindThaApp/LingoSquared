review: {status: "reviewed", required_next_reviewer: "ramin_native_pass", notes: "Twelfth nl-en B1 overlay, authored directly against the reviewed English realization b1_unit12_concession. Informal jij/je register throughout. Pending fresh-context review. Fresh-context review 2026-10-10 (content-reviewer.md checklist): checked all 23 exercises and 15 teaching items against b1_unit12_concession (accepted-answer completeness incl. contractions/comma/that-omission, distractor validity, listen distractors vs the full dialogue audio, speaker attribution, Dutch gloss/instruction accuracy, booleans, jargon). Fixed 5: (1) lesson01.exercise04 matching right for even though was 'hoewel, ook al', which also fits although ('hoewel') -- now 'ook al' (pairs + accepted_answers); (2) lesson02.exercise04 (question 'Wat doet Daniel ondanks de afleiding?') only accepted the full despite-sentence -- added he/Daniel finishes his report on time (with and without the despite phrase, both clause orders); (3) lesson02.exercise05 added the end-position variant 'Daniel finishes his report on time despite the distractions'; (4) lesson03.exercise05 added that-omission and 'They both agree...' variants; (5) Dutch grammar: reading_passage gloss 'Hoewel ze het missen' -> 'ze het mist' (Mia, singular); q_valid_point_however gloss and lesson04.exercise05 instruction used non-reflexive concentreren -> 'ik me / je je alleen beter kan/kunt concentreren'. Not changed: word_order clause-swapped orders (capitalised first tile cues the order; the validator flags swaps as scrambled). Dutch text changed, so native pass required. Review 2026-10-22 (shared-en r3): 3 fixes - lesson03 exercise01 prompt reworded (ungrammatical 'what does she get done'); reading passage no longer says home is quiet while the office is quiet (nl/fa/prs glosses updated); accepted answers made consistent. NATIVE FLAGS: none."}

course:
  title: "Engels B1"
  description: >-
    Engels leren op B1-niveau voor alledaagse gesprekken over verplichtingen,
    mogelijkheden, hypothetische situaties, tegenstellingen en verhalen, met
    gedetailleerde uitleg in het Nederlands.

units:
  en.b1.unit12.concession: {title: "Al is het fijn, ik werk liever thuis"}

lessons:
  en.b1.unit12.lesson01.concession_vocabulary: {title: "Although, despite en however"}
  en.b1.unit12.lesson02.concession_clauses: {title: "Although, despite en een volledige bijzin"}
  en.b1.unit12.lesson03.reading_where_to_work: {title: "Lezen: waar je werkt"}
  en.b1.unit12.lesson04.the_workplace_debate_dialogue: {title: "That's a valid point, however..."}

teaching:
  en.b1.unit12.lesson01.teach.although: {title: "although", gloss: "hoewel", note: "*although* introduceert een tegenstelling met een volledige bijzin in dezelfde zin.", example_gloss: "Hoewel het kantoor rustig is, werkt Mia liever thuis."}
  en.b1.unit12.lesson01.teach.even_though: {title: "even though", gloss: "hoewel, ook al", note: "*even though* benadrukt de tegenstelling sterker dan *although*.", example_gloss: "Leila blijft geconcentreerd, ook al is haar appartement klein."}
  en.b1.unit12.lesson01.teach.despite: {title: "despite", gloss: "ondanks", note: "*despite* wordt gevolgd door een zelfstandig naamwoord of een -ing-vorm, niet door een volledige bijzin.", example_gloss: "Ondanks de afleiding maakt Daniel zijn rapport op tijd af."}
  en.b1.unit12.lesson01.teach.however: {title: "however", gloss: "echter, maar", note: "*however* begint een nieuwe zin na een punt of puntkomma.", example_gloss: "Het kantoor is rustig. Toch werkt Mia liever thuis."}
  en.b1.unit12.lesson01.teach.valid_point: {title: "valid point", gloss: "goed punt", note: "*valid point* betekent een redelijk of overtuigend argument.", example_gloss: "Dat is een goed punt over concentratie."}
  en.b1.unit12.lesson01.teach.convince: {title: "convince", gloss: "overtuigen", note: "*convince* betekent iemand ergens van overtuigen.", example_gloss: "Leila probeerde Mia te overtuigen om terug naar kantoor te komen."}

  en.b1.unit12.lesson02.teach.office_quiet_home: {title: "although + volledige bijzin", gloss: "Hoewel het kantoor rustig is, werkt Mia liever thuis.", note: "*although* + onderwerp + werkwoord vormt een volledige bijzin van tegenstelling."}
  en.b1.unit12.lesson02.teach.distractions_report: {title: "despite + zelfstandig naamwoord", gloss: "Ondanks de afleiding maakt Daniel zijn rapport op tijd af.", note: "na *despite* volgt een zelfstandig naamwoord, geen volledige bijzin."}
  en.b1.unit12.lesson02.teach.grammar_concession: {title: "although, despite en however", gloss: "Although en even though beginnen een volledige bijzin: Although the office is quiet, Mia prefers home. Despite wordt gevolgd door een zelfstandig naamwoord of -ing-vorm, geen bijzin: Despite the distractions, Daniel finishes his report. However begint een nieuwe zin na een punt of puntkomma: The office is quiet. However, Mia prefers home.", note: "vorm: *although/even though* + bijzin; *despite* + zelfstandig naamwoord/-ing; *however* als zinsbijwoord na een punt."}

  en.b1.unit12.lesson03.teach.flexibility: {title: "flexibility", gloss: "flexibiliteit", note: "*flexibility* betekent het vermogen om plannen of een werkstijl makkelijk te veranderen.", example_gloss: "Mia en Leila zijn het beiden eens dat flexibiliteit belangrijk is."}
  en.b1.unit12.lesson03.teach.teamwork: {title: "teamwork", gloss: "teamwerk", note: "*teamwork* betekent samenwerken als team.", example_gloss: "Leila denkt dat het kantoor beter teamwerk oplevert."}
  en.b1.unit12.lesson03.teach.reading_passage: {title: "leestekst: waar je werkt", gloss: "Mia en Leila zijn het oneens over waar ze werken. Mia werkt thuis omdat het comfortabel is. Hoewel ze het mist om haar collega's te zien, krijgt ze thuis meer werk gedaan. Leila werkt liever op kantoor. Ondanks het lawaai vindt ze het fijn om tijdens pauzes met collega's te praten. Ook al maakt Mia een goed punt over concentratie, Leila denkt nog steeds dat het kantoor beter teamwerk oplevert. Toch zijn ze het beiden eens dat flexibiliteit belangrijk is.", note: "een korte leestekst met tegenstellingen op B1-niveau."}

  en.b1.unit12.lesson04.teach.q_although_nice_home: {title: "Mia introduceert de tegenstelling", gloss: "Mia zegt: Leila, hoewel het kantoor fijn is, krijg ik thuis meer werk gedaan.", note: "*although* + volledige bijzin in het begin van de zin."}
  en.b1.unit12.lesson04.teach.a_despite_noise_breaks: {title: "Leila geeft haar kant van het verhaal", gloss: "Leila zegt: ik begrijp het, maar ondanks het lawaai vind ik het echt fijn om tijdens pauzes met mensen te praten.", note: "*despite* + zelfstandig naamwoord (*the noise*)."}
  en.b1.unit12.lesson04.teach.q_valid_point_however: {title: "Mia erkent het punt, maar houdt vast aan haar mening", gloss: "Mia zegt: dat is een goed punt. Toch denk ik dat ik me alleen beter kan concentreren.", note: "*however* begint hier een nieuwe zin na een punt."}
  en.b1.unit12.lesson04.teach.a_even_though_convince: {title: "Leila plaagt Mia", gloss: "Leila zegt: ook al werk ik liever op kantoor, ik kan je niet overtuigen om van gedachten te veranderen, hè?", note: "*even though* benadrukt de tegenstelling."}
  en.b1.unit12.lesson04.teach.q_however_flexibility: {title: "Mia komt tot een compromis", gloss: "Mia zegt: waarschijnlijk niet! Toch zijn we het eens dat flexibiliteit het belangrijkst is.", note: "*however* verbindt twee tegenovergestelde ideeën als een nieuwe zin."}
  en.b1.unit12.lesson04.teach.a_despite_preferences_time: {title: "Leila sluit het gesprek positief af", gloss: "Leila zegt: ondanks onze verschillende voorkeuren maken we alles op tijd af.", note: "*despite* + zelfstandig naamwoord (*our different preferences*)."}

