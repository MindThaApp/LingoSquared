  en.b1.unit16.lesson04.exercise05.reply_as_daniel:
    instruction: "Leila zegt: je zou eerst prioriteit moeten geven aan het project met de kortste deadline. Hoe zit het met een collega vragen om met het andere project te helpen? Geef Daniels antwoord: zeg dat je dat goed vindt, en dat je Mia gaat vragen of ze deze week tijd heeft."
    accepted_answers:
      - {value: "I like that. I'll ask Mia if she has time this week.", status: "correct"}
      - {value: "I like that. I'll ask Mia if she has time this week", status: "correct"}
    feedback: "*I like that* toont acceptatie van het advies."
  en.b1.unit16.lesson04.exercise06.speak_advice_dialogue:
    instruction: "Daniel zegt: ik voel me een beetje overweldigd. Ik leid twee projecten, en ik heb nog steeds drie keer per week mijn avondcursus. Antwoord hardop als Leila: geef advies om met zijn manager over de werklast te praten, beginnend met 'If I were you'."
