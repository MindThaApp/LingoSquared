    instruction: "Luister en kies wat Leila voorstelt."
    correct_option: "talk to your manager about the workload"
    distractors: ["talk to your colleague about the deadline", "talk to human resources about the class", "talk to Mia about the project"]
    accepted_answers: [{value: "talk to your manager about the workload", status: "correct"}]
