    correct_option: "overwhelmed"
    distractors: ["advice", "prioritize", "decline"]
    accepted_answers: [{value: "overwhelmed", status: "correct"}]
    feedback: "*overwhelmed* betekent overweldigd."
  en.b1.unit16.lesson01.exercise02.choose_prioritize:
    instruction: "Welk woord betekent de belangrijkste taak eerst aanpakken?"
    correct_option: "prioritize"
    distractors: ["suggest", "workload", "decline"]
    accepted_answers: [{value: "prioritize", status: "correct"}]
    feedback: "*prioritize* betekent prioriteit geven aan."
