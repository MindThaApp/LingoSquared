      - {left: "decline", right: "afwijzen"}
    accepted_answers:
      - value:
          - {left: "advice", right: "advies"}
          - {left: "suggest", right: "voorstellen"}
          - {left: "overwhelmed", right: "overweldigd"}
          - {left: "prioritize", right: "prioriteit geven aan"}
          - {left: "workload", right: "werklast"}
          - {left: "decline", right: "afwijzen"}
        status: "correct"
    feedback: "*advice*=advies, *suggest*=voorstellen, *overwhelmed*=overweldigd, *prioritize*=prioriteit geven aan, *workload*=werklast, *decline*=afwijzen."
  en.b1.unit16.lesson01.exercise05.write_workload:
    instruction: "Schrijf het woord dat de totale hoeveelheid werk betekent die iemand moet doen."
    accepted_answers:
      - {value: "workload", status: "correct"}
