    instruction: "Luister naar het gesprek en kies wat Daniels probleem is."
    correct_option: "leading two projects, and I still have my evening class three times a week"
    distractors: ["leading one small project part-time", "starting a new evening class next month", "leaving the company at the end of the year"]
