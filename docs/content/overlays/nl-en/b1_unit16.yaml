  en.b1.unit16.lesson02.exercise01.choose_if_i_were_you:
    instruction: "Welke zin geeft advies met de onwerkelijke vorm 'If I were you'?"
    correct_option: "If I were you, I would talk to your manager."
    distractors: ["You should prioritize the project with the closer deadline.", "How about asking a colleague to help?", "I talked to my manager yesterday."]
    accepted_answers: [{value: "If I were you, I would talk to your manager.", status: "correct"}]
    feedback: "*If I were you, I would...* is de onwerkelijke hypothetische vorm."
  en.b1.unit16.lesson02.exercise02.choose_how_about:
    instruction: "Welke zin doet een zachte suggestie met 'How about'?"
    correct_option: "How about asking a colleague to help?"
    distractors: ["If I were you, I would talk to your manager.", "You should prioritize the project with the closer deadline.", "A colleague is helping today."]
    accepted_answers: [{value: "How about asking a colleague to help?", status: "correct"}]
    feedback: "*How about...?* is de zachte suggestievorm."
  en.b1.unit16.lesson02.exercise03.order_you_should_prioritize:
