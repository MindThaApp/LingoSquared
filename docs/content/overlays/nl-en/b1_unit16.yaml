course:
  title: "Engels B1"
  description: >-
    Engels leren op B1-niveau voor alledaagse gesprekken over verplichtingen,
    mogelijkheden, hypothetische situaties, tegenstellingen, verhalen,
    beschrijvingen met bijzinnen, professionele communicatie, klachten en
    advies, met gedetailleerde uitleg in het Nederlands.

units:
  en.b1.unit16.advice: {title: "If I were you, I would..."}

lessons:
  en.b1.unit16.lesson01.advice_vocabulary: {title: "Woorden voor het geven van advies"}
  en.b1.unit16.lesson02.advice_forms: {title: "If I were you, I would talk to your manager"}
  en.b1.unit16.lesson03.reading_advice_between_friends: {title: "Lezen: advies over een zware werklast"}
  en.b1.unit16.lesson04.the_advice_dialogue: {title: "You should prioritize the closer deadline"}

teaching:
  en.b1.unit16.lesson01.teach.advice: {title: "advice", gloss: "advies", note: "*advice* betekent een mening over wat iemand zou moeten doen.", example_gloss: "Leila gaf Daniel wat nuttig advies."}
  en.b1.unit16.lesson01.teach.suggest: {title: "suggest", gloss: "voorstellen", note: "*suggest* betekent een idee voorstellen ter overweging.", example_gloss: "Leila stelde een manier voor om zijn werklast te beheren."}
  en.b1.unit16.lesson01.teach.overwhelmed: {title: "overwhelmed", gloss: "overweldigd", note: "*overwhelmed* betekent het gevoel hebben meer te moeten doen dan je aankunt.", example_gloss: "Daniel voelde zich overweldigd door zijn twee projecten."}
  en.b1.unit16.lesson01.teach.prioritize: {title: "prioritize", gloss: "prioriteit geven aan", note: "*prioritize* betekent de belangrijkste taak eerst aanpakken.", example_gloss: "Daniel besloot prioriteit te geven aan het project met de eerstvolgende deadline."}
  en.b1.unit16.lesson01.teach.workload: {title: "workload", gloss: "werklast", note: "*workload* betekent de totale hoeveelheid werk die iemand moet doen.", example_gloss: "Daniels werklast groeide nadat hij in maart bij het team kwam."}
  en.b1.unit16.lesson01.teach.decline: {title: "decline", gloss: "afwijzen", note: "*decline* betekent een voorstel of aanbod beleefd afwijzen.", example_gloss: "Daniel kon het advies opvolgen of beleefd afwijzen."}

  en.b1.unit16.lesson02.teach.if_i_were_you: {title: "if I were you, I would + basisvorm", gloss: "Als ik jou was, zou ik met je manager praten.", note: "*if I were you, I would* is de onwerkelijke voorwaardelijke vorm om advies te geven."}
  en.b1.unit16.lesson02.teach.you_should_prioritize: {title: "you should + basisvorm", gloss: "Je zou prioriteit moeten geven aan het project met de eerstvolgende deadline.", note: "*you should* is een directe aanbeveling."}
  en.b1.unit16.lesson02.teach.how_about: {title: "how about + -ing", gloss: "Wat dacht je ervan om een collega om hulp te vragen?", note: "*how about + -ing* is een zachtere manier om iets voor te stellen."}
  en.b1.unit16.lesson02.teach.grammar_advice_forms: {title: "Vormen om advies te geven", gloss: "Advies en suggesties gebruiken verschillende vormen: If I were you, I would... (een onwerkelijke hypothese), You should... (een directe aanbeveling), en How about + -ing...? (een zachtere suggestie). Kies een sterkere of zachtere vorm afhankelijk van hoe zeker je wilt klinken.", note: "Vorm: kies tussen een onwerkelijke hypothese, een directe aanbeveling of een zachte suggestie."}

  en.b1.unit16.lesson03.teach.deadline: {title: "deadline", gloss: "deadline", note: "*deadline* betekent de datum waarop iets af moet zijn.", example_gloss: "Daniels eerstvolgende deadline is aanstaande vrijdag."}
  en.b1.unit16.lesson03.teach.that_makes_sense: {title: "that makes sense. I'll try it.", gloss: "Dat klinkt logisch. Ik probeer het.", note: "*that makes sense* laat zien dat je het advies begrijpt en accepteert.", example_gloss: "Dat klinkt logisch. Ik probeer het deze week."}
  en.b1.unit16.lesson03.teach.reading_passage: {title: "Leestekst: advies over een zware werklast", gloss: "Hoi Leila, ik voel me deze week overweldigd. Ik leid twee projecten, en mijn avondcursus komt daar nog bovenop. Enig advies? Hoi Daniel, als ik jou was, zou ik met je manager praten over de werklast. Je zou ook prioriteit moeten geven aan het project met de eerstvolgende deadline. Wat dacht je ervan om Mia te vragen om met het andere project te helpen? Bedankt, dat klinkt logisch. Ik probeer het en laat je weten hoe het gaat.", note: "Een kort, warm advies tussen collega's."}

  en.b1.unit16.lesson04.teach.q_overwhelmed_two_projects: {title: "Daniel legt zijn probleem uit", gloss: "Daniel zegt: ik voel me een beetje overweldigd. Ik leid twee projecten, en ik heb nog steeds drie keer per week mijn avondcursus.", note: "*a little overwhelmed* beschrijft mild te veel werk hebben."}
  en.b1.unit16.lesson04.teach.a_talk_to_manager: {title: "Leila geeft haar eerste advies", gloss: "Leila zegt: als ik jou was, zou ik met je manager praten over de werklast.", note: "*if I were you, I would* is de onwerkelijke hypothetische vorm."}
  en.b1.unit16.lesson04.teach.q_dont_want_to_seem: {title: "Daniel twijfelt", gloss: "Daniel zegt: dat is een goed idee, maar ik wil niet dat het lijkt alsof ik het niet aankan.", note: "*I don't want to seem like* drukt een zorg uit over hoe je overkomt."}
  en.b1.unit16.lesson04.teach.a_prioritize_and_how_about: {title: "Leila geeft twee concrete suggesties", gloss: "Leila zegt: je zou eerst prioriteit moeten geven aan het project met de eerstvolgende deadline. Wat dacht je ervan om een collega te vragen om met het andere project te helpen?", note: "*you should* en *how about* combineren een directe en een zachte suggestie."}
  en.b1.unit16.lesson04.teach.q_ask_mia_this_week: {title: "Daniel accepteert het advies", gloss: "Daniel zegt: dat vind ik goed. Ik vraag Mia of ze deze week tijd heeft.", note: "*I like that* laat zien dat je het advies accepteert."}
  en.b1.unit16.lesson04.teach.a_sounds_like_solid_plan: {title: "Leila bevestigt het plan", gloss: "Leila zegt: dat klinkt als een solide plan.", note: "Een korte, bemoedigende afsluiting van het gesprek."}

