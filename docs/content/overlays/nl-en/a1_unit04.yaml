  en.a1.unit04.lesson03.teach.its_july_7: {title: "It's July 7th.", gloss: "Het is 7 juli.", note: "In het Amerikaans-Engels komt de maand VOOR de dag: July 7th. Dit is precies omgekeerd aan de Nederlandse volgorde dag-maand: 7 juli."}
