  en.a1.unit04.lesson04.teach.again: {title: "Again", gloss: "weer/opnieuw", note: "again betekent weer of opnieuw."}
  en.a1.unit04.lesson04.teach.q_date: {title: "Daniel vraagt de datum", gloss: "Daniel: Wat is de datum vandaag?", note: "Dezelfde vraag als eerder geleerd, nu in een echt gesprek."}
  en.a1.unit04.lesson04.teach.a_date: {title: "Antwoord op de datum", gloss: "Leila: Het is dinsdag, 7 juli.", note: "Een volledig antwoord geeft zowel de dag van de week als de datum."}
  en.a1.unit04.lesson04.teach.q_library: {title: "Vragen naar de heropening", gloss: "Daniel vraagt wanneer de bibliotheek weer open is", note: "When's the library open again? vraagt naar de datum van heropening."}
  en.a1.unit04.lesson04.teach.a_library: {title: "Antwoord over de heropening", gloss: "Leila zegt dat de bibliotheek donderdag 9 juli weer opengaat", note: "It opens on Thursday, July 9th; het voorzetsel on komt vóór de dag van de week."}
  en.a1.unit04.lesson04.teach.closing: {title: "Het gesprek afsluiten", gloss: "Daniel zegt: Geweldig, tot ziens dan!", note: "See you then betekent dat je elkaar op het genoemde moment weer ziet."}

exercises:
  en.a1.unit04.lesson01.exercise01.listen_weekday:
    instruction: "Luister en kies de genoemde dag van de week."
    correct_option: "woensdag"
    distractors: ["maandag", "vrijdag", "zondag"]
    accepted_answers: [{value: "woensdag", status: correct}]
    feedback: "Wednesday betekent woensdag."
  en.a1.unit04.lesson01.exercise02.choose_weekend:
    instruction: "Kies de dag die in Amerika bij het weekend hoort."
    correct_option: "Saturday"
    distractors: ["Monday", "Wednesday", "Friday"]
    accepted_answers: [{value: "Saturday", status: correct}]
    feedback: "Saturday (zaterdag) hoort in de Amerikaanse kalender bij het weekend."
  en.a1.unit04.lesson01.exercise03.match_days:
    instruction: "Verbind elke dag van de week met de juiste volgorde."
    accepted_answers: [{value: [{left: "1st weekday", right: "Monday"}, {left: "2nd weekday", right: "Tuesday"}, {left: "3rd weekday", right: "Wednesday"}, {left: "4th weekday", right: "Thursday"}], status: correct}]
    feedback: "De werkweek: Monday, Tuesday, Wednesday, Thursday."
  en.a1.unit04.lesson01.exercise04.order_question:
    instruction: "Zet de woorden in de juiste volgorde om te vragen welke dag het is."
    accepted_answers: [{value: ["What", "day", "is", "it", "today"], status: correct}]
    feedback: "De juiste volgorde is What day is it today?"
  en.a1.unit04.lesson01.exercise05.write_friday:
    instruction: "Schrijf de dag die na donderdag komt in het Engels."
    accepted_answers:
      - {value: "Friday", status: correct}
      - {value: "Friday.", status: correct}
    feedback: "De dag na Thursday is Friday (vrijdag)."

  en.a1.unit04.lesson02.exercise01.listen_month:
    instruction: "Luister en kies de genoemde maand."
    correct_option: "september"
    distractors: ["januari", "maart", "december"]
    accepted_answers: [{value: "september", status: correct}]
    feedback: "September betekent september."
  en.a1.unit04.lesson02.exercise02.choose_summer_month:
    instruction: "Kies de maand die in het noordelijk halfrond een zomermaand is."
    correct_option: "July"
    distractors: ["January", "March", "December"]
    accepted_answers: [{value: "July", status: correct}]
    feedback: "July (juli) is midden in de zomer op het noordelijk halfrond."
  en.a1.unit04.lesson02.exercise03.match_months:
    instruction: "Verbind elke maand met het juiste volgnummer in het jaar."
    accepted_answers: [{value: [{left: "1st month", right: "January"}, {left: "3rd month", right: "March"}, {left: "7th month", right: "July"}, {left: "12th month", right: "December"}], status: correct}]
    feedback: "January is de eerste, March de derde, July de zevende en December de twaalfde maand."
  en.a1.unit04.lesson02.exercise04.order_month_question:
    instruction: "Zet de woorden in de juiste volgorde om te vragen welke maand het is."
    accepted_answers: [{value: ["Which", "month", "is", "it"], status: correct}]
    feedback: "De juiste volgorde is Which month is it?"
  en.a1.unit04.lesson02.exercise05.write_december:
    instruction: "Schrijf de laatste maand van het jaar in het Engels."
    accepted_answers:
      - {value: "December", status: correct}
      - {value: "December.", status: correct}
    feedback: "De laatste maand is December."

  en.a1.unit04.lesson03.exercise01.listen_date_question:
    instruction: "Luister en kies wat er gevraagd wordt."
    correct_option: "de volledige datum van vandaag"
    distractors: ["de dag van de week", "de huidige maand", "iemands leeftijd"]
    accepted_answers: [{value: "de volledige datum van vandaag", status: correct}]
    feedback: "What's today's date? vraagt naar de hele datum (dag van de week, maand en dag van de maand)."
  en.a1.unit04.lesson03.exercise02.choose_date_answer:
    instruction: "Kies het juiste antwoord op de vraag naar de datum van vandaag."
    correct_option: "It's Tuesday, July 7th."
    distractors: ["It's ten dollars.", "My birthday is March 3rd.", "It opens on Thursday."]
    accepted_answers: [{value: "It's Tuesday, July 7th.", status: correct}]
    feedback: "It's Tuesday, July 7th. betekent Het is dinsdag, 7 juli."
  en.a1.unit04.lesson03.exercise03.order_birthday_question:
    instruction: "Zet de woorden in de juiste volgorde om naar iemands verjaardag te vragen."
    accepted_answers: [{value: ["When's", "your", "birthday"], status: correct}]
    feedback: "De juiste volgorde is When's your birthday?"
  en.a1.unit04.lesson03.exercise04.reply_birthday:
    instruction: "Antwoord op deze vraag over je verjaardag (3 maart)."
    accepted_answers:
      - {value: "My birthday is March 3rd.", status: correct}
      - {value: "My birthday is March 3rd", status: correct}
    feedback: "My birthday is March 3rd. betekent Mijn verjaardag is 3 maart."
  en.a1.unit04.lesson03.exercise05.write_date:
    instruction: "Schrijf de datum 7 juli voluit in het Engels."
    accepted_answers:
      - {value: "It's July 7th.", status: correct}
      - {value: "It's July 7th", status: correct}
      - {value: "July 7th", status: acceptable_with_note, note: "Correct, maar het volledige antwoord begint met It's."}
    feedback: "7 juli schrijf je in het Engels als July 7th."

  en.a1.unit04.lesson04.exercise01.listen_today_date:
    instruction: "Luister naar het gesprek en kies de datum van vandaag."
    correct_option: "dinsdag, 7 juli"
    distractors: ["donderdag, 9 juli", "maandag, 7 juli", "dinsdag, 9 juli"]
    accepted_answers: [{value: "dinsdag, 7 juli", status: correct}]
    feedback: "Leila zegt: It's Tuesday, July 7th."
  en.a1.unit04.lesson04.exercise02.listen_open_date:
    instruction: "Luister en kies wanneer de bibliotheek weer opengaat."
    correct_option: "donderdag, 9 juli"
    distractors: ["dinsdag, 7 juli", "vrijdag, 10 juli", "donderdag, 7 juli"]
    accepted_answers: [{value: "donderdag, 9 juli", status: correct}]
    feedback: "Leila zegt: It opens on Thursday, July 9th."
  en.a1.unit04.lesson04.exercise03.choose_reopen_date:
    instruction: "Kies het juiste antwoord over de heropening van de bibliotheek."
    correct_option: "Thursday, July 9th"
    distractors: ["Tuesday, July 7th", "Monday, July 6th", "Friday, July 10th"]
    accepted_answers: [{value: "Thursday, July 9th", status: correct}]
    feedback: "De bibliotheek gaat donderdag 9 juli weer open."
  en.a1.unit04.lesson04.exercise04.order_reopen_question:
    instruction: "Zet de woorden in de juiste volgorde om te vragen wanneer de bibliotheek weer opengaat."
    accepted_answers: [{value: ["When's", "the", "library", "open", "again"], status: correct}]
    feedback: "De juiste volgorde is When's the library open again?"
  en.a1.unit04.lesson04.exercise05.reply_as_leila:
    instruction: "Antwoord als Leila: geef zowel de datum van vandaag als de heropeningsdatum."
    accepted_answers:
      - {value: "It's Tuesday, July 7th. It opens on Thursday, July 9th.", status: correct}
      - {value: "It's Tuesday, July 7th, and it opens on Thursday, July 9th.", status: correct}
    feedback: "Een volledig antwoord geeft beide data apart."
  en.a1.unit04.lesson04.exercise06.speak_dates:
    instruction: "Antwoord als Leila hardop met beide data."
    accepted_answers:
      - {value: "It's Tuesday, July 7th. It opens on Thursday, July 9th.", status: correct}
      - {value: "It's Tuesday, July 7th, and it opens on Thursday, July 9th.", status: correct}
    feedback: "Een volledig antwoord dekt zowel vandaag als de heropeningsdatum."
