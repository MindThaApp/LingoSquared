teaching:
  en.a1.unit04.lesson01.teach.monday: {title: "Monday", gloss: "maandag", note: "Monday betekent maandag; in het Engels beginnen dagnamen altijd met een hoofdletter, anders dan in het Nederlands."}
  en.a1.unit04.lesson01.teach.tuesday: {title: "Tuesday", gloss: "dinsdag", note: "Tuesday betekent dinsdag."}
  en.a1.unit04.lesson01.teach.wednesday: {title: "Wednesday", gloss: "woensdag", note: "Wednesday betekent woensdag; de d wordt in de uitspraak nauwelijks gehoord."}
  en.a1.unit04.lesson01.teach.thursday: {title: "Thursday", gloss: "donderdag", note: "Thursday betekent donderdag."}
  en.a1.unit04.lesson01.teach.friday: {title: "Friday", gloss: "vrijdag", note: "Friday betekent vrijdag; in de Amerikaanse kalender een gewone werkdag, geen vrije dag."}
