  en.a1.unit04.lesson02.teach.july: {title: "July", gloss: "juli", note: "July is de zevende maand van het jaar."}
  en.a1.unit04.lesson02.teach.september: {title: "September", gloss: "september", note: "September is de negende maand van het jaar."}
