  en.a1.unit04.lesson03.teach.birthday_question: {title: "When's your birthday?", gloss: "Wanneer is je/uw verjaardag?", note: "When's your birthday? vraagt naar de geboortedatum."}
  en.a1.unit04.lesson03.teach.birthday_answer: {title: "My birthday is March 3rd.", gloss: "Mijn verjaardag is 3 maart.", note: "Bij een verjaardag komt het werkwoord is, net als bij de datum van vandaag."}

