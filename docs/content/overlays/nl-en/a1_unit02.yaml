teaching:
  en.a1.unit02.lesson01.teach.whats_your_name:
    title: "What's your name?"
    gloss: "Hoe heet je/u?"
    note: >-
      What's is de verkorting van What is. Vertaal de zin als geheel: in het
      Nederlands vraag je meestal Hoe heet je?, niet letterlijk Wat is je naam?
  en.a1.unit02.lesson01.teach.my_name_is:
    title: "My name is Leila."
    gloss: "Mijn naam is Leila."
    note: "My name is... is explicieter en iets langer dan I'm..."
  en.a1.unit02.lesson01.teach.im_leila:
    title: "I'm Leila."
    gloss: "Ik ben Leila."
    note: "I'm is de gewone gesproken verkorting van I am."
  en.a1.unit02.lesson01.teach.nice_to_meet_you:
    title: "Nice to meet you."
    gloss: "Leuk je te ontmoeten."
    note: "Gebruik deze vaste zin nadat je elkaars naam hebt gehoord."

  en.a1.unit02.lesson02.teach.i_am_student:
    title: "I am a student."
    gloss: "Ik ben student."
    note: >-
      In het Nederlands kun je Ik ben student zeggen, zonder een. In het
      Engels heb je vóór een enkelvoudig woord als student meestal a of an
      nodig: I am a student.
  en.a1.unit02.lesson02.teach.are_you_teacher:
    title: "Are you a teacher?"
    gloss: "Ben je/u leraar?"
    note: >-
      Bij een gewone vraag met be komt are vóór you. Anders dan in het
      Nederlands heeft het Engels hier een lidwoord nodig: Are you a teacher?
      In het Nederlands zeg je meestal Ben je leraar?, zonder een.
  en.a1.unit02.lesson02.teach.yes_i_am:
    title: "Yes, I am."
    gloss: "Ja. / Ja, dat ben ik."
    note: "In een kort Engels antwoord herhaal je am: Yes, I am. Alleen Yes kan ook, maar is minder volledig."
  en.a1.unit02.lesson02.teach.no_im_student:
    title: "No, I'm a student."
    gloss: "Nee, ik ben student."
    note: "Na No kun je met I'm... meteen de juiste informatie geven."
  en.a1.unit02.lesson02.teach.are_you_member:
    title: "Are you a new member?"
    gloss: "Ben je/u een nieuw lid?"
    note: "Member betekent lid; new staat, net als nieuw, vóór het zelfstandig naamwoord."
  en.a1.unit02.lesson02.teach.he_is_teacher:
    title: "He is a teacher."
    gloss: "Hij is leraar."
    note: "He verwijst naar een man of jongen. Ook hier heeft het Engels a vóór teacher."
  en.a1.unit02.lesson02.teach.she_is_engineer:
    title: "She is an engineer."
    gloss: "Zij is ingenieur."
    note: >-
      She verwijst naar een vrouw of meisje. Engels gebruikt an vóór een
      klinkerklank, dus an engineer; het Nederlands heeft maar één vorm: een.

  en.a1.unit02.lesson03.teach.library:
    title: "Library"
    gloss: "bibliotheek"
    note: "Library betekent bibliotheek: een plek waar je boeken kunt lenen."
    example_gloss: "Ik ben in de bibliotheek."
  en.a1.unit02.lesson03.teach.library_assistant:
    title: "Library assistant"
    gloss: "bibliotheekmedewerker"
    note: "Library assistant betekent bibliotheekmedewerker; library geeft aan waar diegene werkt."
  en.a1.unit02.lesson03.teach.opening:
    title: "Daniel begroet Leila"
    gloss: "Daniel: Goedemiddag. Ik ben Daniel."
    note: "Daniel begint met een begroeting en noemt daarna zijn naam."
  en.a1.unit02.lesson03.teach.request:
    title: "Daniel vraagt naar haar naam"
    gloss: "Daniel: Hoe heet je?"
    note: "What's your name? is de vaste Engelse vraag naar iemands naam."
  en.a1.unit02.lesson03.teach.names:
    title: "Leila stelt zich voor"
    gloss: "Leila: Hoi. Ik ben Leila. Ik ben student. Leuk je te ontmoeten."
    note: "Leila noemt haar naam, zegt dat ze student is en sluit haar introductie vriendelijk af."
  en.a1.unit02.lesson03.teach.room_and_member:
    title: "Daniel vraagt of Leila lid is"
    gloss: "Daniel: Ook leuk jou te ontmoeten. Ben je een nieuw lid? Leila: Ja."
    note: "Yes, I am. is het volledige korte antwoord op een vraag die met Are you...? begint."
  en.a1.unit02.lesson03.teach.role:
    title: "Daniel vertelt waar hij werkt"
    gloss: "Daniel: Ik werk bij de bibliotheek."
    note: >-
      In I work at the library verwijst the naar de specifieke bibliotheek
      waar het gesprek plaatsvindt. Het Engels heeft één bepaald lidwoord,
      the; het Nederlands kiest bij zelfstandige naamwoorden tussen de en het.
  en.a1.unit02.lesson03.teach.closing:
    title: "Een vriendelijk welkom"
    gloss: "Daniel: Welkom in de bibliotheek. Leila: Dank je."
    note: "Met Welcome to... heet je iemand welkom op een plek of bij een organisatie."

