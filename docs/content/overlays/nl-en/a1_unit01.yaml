teaching:
  en.a1.unit01.lesson01.teach.hello:
    title: "Hello"
    gloss: "hallo"
    note: "Hello past in bijna elke situatie en klinkt iets neutraler dan Hi."
    example_gloss: "Hallo, Daniel!"
  en.a1.unit01.lesson01.teach.hi:
    title: "Hi"
    gloss: "hoi"
    note: "Hi is een informele, veelgebruikte begroeting."
    example_gloss: "Hoi, Leila!"
  en.a1.unit01.lesson01.teach.good_morning:
    title: "Good morning"
    gloss: "goedemorgen"
    note: "Gebruik Good morning wanneer je iemand 's ochtends begroet."
  en.a1.unit01.lesson01.teach.good_afternoon:
    title: "Good afternoon"
    gloss: "goedemiddag"
    note: "Good afternoon is gebruikelijk vanaf het middaguur tot het einde van de middag."
  en.a1.unit01.lesson01.teach.good_evening:
    title: "Good evening"
    gloss: "goedenavond"
    note: "Good evening is een begroeting in de avond, geen wens voor het slapengaan."
  en.a1.unit01.lesson01.teach.goodbye:
    title: "Goodbye"
    gloss: "tot ziens"
    note: "Goodbye is een algemeen afscheid en klinkt wat formeler dan Bye."
    example_gloss: "Tot ziens, tot morgen!"
  en.a1.unit01.lesson01.teach.bye:
    title: "Bye"
    gloss: "doei"
    note: "Bye is de gewone informele manier om afscheid te nemen."
    example_gloss: "Doei, tot snel!"

  en.a1.unit01.lesson03.teach.how_are_you:
    title: "How are you?"
    gloss: "Hoe gaat het met je/u?"
    note: >-
      Het Engelse you kan zowel jij als u betekenen. How are you? past dus
      bij informele én beleefde gesprekken; de situatie bepaalt de toon.
  en.a1.unit01.lesson03.teach.im_fine:
    title: "I'm fine, thanks."
    gloss: "Het gaat goed, bedankt."
    note: "I'm is de gebruikelijke verkorting van I am; de apostrof hoort erbij."
  en.a1.unit01.lesson03.teach.im_good:
    title: "I'm good, thanks."
    gloss: "Het gaat goed, bedankt."
    note: "I'm good is in alledaags Amerikaans-Engels een heel gewoon antwoord."
  en.a1.unit01.lesson03.teach.not_bad:
    title: "Not bad, thanks."
    gloss: "Niet slecht, bedankt."
    note: "Not bad klinkt meestal gematigd positief, net als Niet slecht in het Nederlands."
  en.a1.unit01.lesson03.teach.and_you:
    title: "And you?"
    gloss: "En jij/u?"
    note: "Met And you? kaats je dezelfde vraag kort terug."
  en.a1.unit01.lesson03.teach.are_you_okay:
    title: "Are you okay?"
    gloss: "Gaat het? / Ben je oké?"
    note: >-
      In een gewone, neutrale vraag met be komt de persoonsvorm vóór het
      onderwerp: Are you...? Dat lijkt op de Nederlandse volgorde in Ben je...?;
      do is hier niet nodig. You are okay? kan in een gesprek wel een verbaasde
      reactie of een vraag om bevestiging zijn.

  en.a1.unit01.lesson05.teach.nice_to_meet_you:
    title: "Nice to meet you."
    gloss: "Leuk je te ontmoeten."
    note: "Dit is een vaste, vriendelijke zin wanneer je iemand voor het eerst ontmoet."
  en.a1.unit01.lesson05.teach.nice_to_meet_you_too:
    title: "Nice to meet you too."
    gloss: "Leuk jou ook te ontmoeten."
    note: "Zet too aan het einde om te zeggen dat dit voor jou ook geldt."
  en.a1.unit01.lesson05.teach.see_you_later:
    title: "See you later."
    gloss: "Tot later."
    note: "See you later is een informeel afscheid; het hoeft geen concrete afspraak voor later te zijn."
  en.a1.unit01.lesson05.teach.have_a_good_day:
    title: "Have a good day."
    gloss: "Fijne dag."
    note: "Have a good day is een vriendelijke afsluiting, bijvoorbeeld in een winkel of op het werk."

