  en.a1.unit62.lesson04.teach.reading_passage: {title: "Tekst: Een kort telefoongesprek", gloss: "Een kort telefoongesprek: Leila belde Mia in de middag. Het geluid was niet duidelijk, dus Mia vroeg Leila langzaam te spreken. Mia zei dat de vergadering om vier uur in kamer 5 was. Leila vroeg Mia de tijd te herhalen. Later schreef Leila een telefoonbericht. In het bericht stond dat Mia om 4.00 uur had gebeld en vroeg om terug te bellen.", note: "*called* is de verleden tijd van *call*."}

exercises:
