  en.a1.unit62.lesson03.teach.dialogue_line7: {title: "Mia herhaalt vier uur", gloss: "Mia zegt: Vier uur.", note: "*Four o'clock* is een volledige kloktijd."}
  en.a1.unit62.lesson03.teach.dialogue_line8: {title: "Leila belt later terug", gloss: "Leila zegt: Dank je. Ik bel later terug.", note: "*I'll* is de samentrekking van *I will*."}

