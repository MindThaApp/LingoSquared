  notes: >-
    Draft only. Overlay against the shared en/a1_unit55_swimming_pool.yaml
    realization (itself still unreviewed). This unit had NO overlay in any
    direction (nl-en/fa-en/prs-en) before this file -- it was an orphaned
    realization, authored but unreachable by any learner. Two contrastive
    points, deliberately different from the ones already used elsewhere in
    this direction: (1) English pool-rule signage favors the passive
    construction "swim caps are required," a formal register a Dutch
    speaker is more likely to render as a direct modal statement (je moet
    een badmuts dragen) or a bare adjective (badmutsen zijn verplicht) --
    flagged on the rules teaching card and the dialogue's swim-cap line, so
    the learner sees that this passive is the natural register for signage
    and spoken rule-statements alike, not something to avoid; (2) English
    freely stacks two nouns together to form a compound ("a dollar coin" --
    a coin worth a dollar), while Dutch needs an explicit linking
    preposition, van, to express the same value relationship ("een munt van
    een dollar") -- flagged on the dialogue's locker-payment line, since a
    literal word-for-word translation without van would sound foreign in
    Dutch and the reverse error (dropping the compound and inserting a stray
    "of"/"from") is the natural mistake in the English direction. No
    sibling-direction overlay exists for this unit in any language
    (confirmed via a fresh ls of docs/content/overlays/{nl-en,fa-en,
    prs-en}/ before authoring), so there was nothing to isolate from, but
    this file was still drafted entirely independently from the target
    realization and universal spine, per the standing rule. Followed the
    realization's own explicit same-speaker-distractor guidance for
    lesson03's price/rule/locker/closing-time questions -- every fact is
    its own single-fact Lifeguard turn, so cross-distracting between them
    is safe per the realization's own analysis, and was used that way
    here. Every kind:vocabulary teaching card's example_gloss is a
    faithful Dutch translation of the realization's own example sentence;
    lesson02/03/04 cards carry no example_gloss since their realization
    counterparts declare no example (phrase/dialogue/reading cards are
    exempt per AUTHORING_GUIDE.md #19). Needs the mandatory fresh-context
    review before shipping.

course:
  title: Engels A1
  description: >-
    Engels voor beginners, met heldere uitleg in het Nederlands en aandacht
    voor alledaagse gesprekken.

