    accepted_answers: [{value: "to cool off", status: correct}]
    feedback: "De tekst zegt: Daniel and Mia decided to cool off at the community swimming pool."
  en.a1.unit55.lesson04.exercise02.reading_locker_payment:
    instruction: "Wat hebben de kluisjes volgens de tekst nodig?"
    correct_option: "a dollar coin"
    distractors: ["five dollars", "a ticket"]
    accepted_answers: [{value: "a dollar coin", status: correct}]
    feedback: "De tekst zegt: the lockers were near the entrance and needed a dollar coin."
  en.a1.unit55.lesson04.exercise03.reading_close_time:
    instruction: "Hoe laat sluit het zwembad volgens de tekst?"
    correct_option: "eight o'clock"
    distractors: ["seven o'clock", "nine o'clock"]
    accepted_answers: [{value: "eight o'clock", status: correct}]
    feedback: "De tekst zegt: the pool closes at eight o'clock."
  en.a1.unit55.lesson04.exercise04.write_own_pool_message:
    instruction: "Schrijf een kort bericht: zeg hoeveel een kaartje kost, en zeg hoe laat het zwembad sluit."
    accepted_answers: ["It's five dollars for one ticket, and the pool closes at eight o'clock.", "It's five dollars for one ticket. The pool closes at eight o'clock.", "It's five dollars for one ticket and the pool closes at eight o'clock."]
    feedback: "Gebruik It's five dollars for one ticket, and the pool closes at eight o'clock."
