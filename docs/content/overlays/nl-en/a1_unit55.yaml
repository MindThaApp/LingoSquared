teaching:
  en.a1.unit55.lesson01.teach.swimming_pool: {title: "swimming pool", gloss: "zwembad", note: "*swimming pool* betekent zwembad.", example_gloss: "Het zwembad gaat elke ochtend open."}
  en.a1.unit55.lesson01.teach.ticket: {title: "ticket", gloss: "kaartje / toegangsbewijs", note: "*ticket* betekent kaartje of toegangsbewijs.", example_gloss: "Je hebt een kaartje nodig om het zwembad in te gaan."}
  en.a1.unit55.lesson01.teach.locker: {title: "locker", gloss: "kluisje", note: "*locker* betekent kluisje.", example_gloss: "Stop je tas in een kluisje."}
  en.a1.unit55.lesson01.teach.swim_cap: {title: "swim cap", gloss: "badmuts", note: "*swim cap* betekent badmuts.", example_gloss: "Draag alstublieft een badmuts in het zwembad."}
  en.a1.unit55.lesson01.teach.rules: {title: "rules", gloss: "regels", note: "*rules* betekent regels.", example_gloss: "Lees de zwembadregels voordat je gaat zwemmen."}
  en.a1.unit55.lesson01.teach.lifeguard: {title: "lifeguard", gloss: "badmeester / reddingzwemmer", note: "*lifeguard* betekent badmeester of reddingzwemmer -- de persoon die op de zwemmers let.", example_gloss: "De badmeester houdt elke dag toezicht op het zwembad."}

  en.a1.unit55.lesson02.teach.id_like_to_buy_a_ticket: {title: "I'd like to buy a ticket, please.", gloss: "Ik wil graag een kaartje kopen, alstublieft.", note: "I'd like to (samentrekking van I would like to) is de beleefde manier om iets te vragen."}
  en.a1.unit55.lesson02.teach.where_are_the_lockers: {title: "Where are the lockers?", gloss: "Waar zijn de kluisjes?", note: "Where are...? gebruikt de omgekeerde volgorde (werkwoord voor het onderwerp) die typisch is voor Engelse vragen."}
  en.a1.unit55.lesson02.teach.what_time_do_you_open: {title: "What time do you open?", gloss: "Hoe laat gaat u open?", note: "do you open gebruikt do-support voor de vraagvorm."}
  en.a1.unit55.lesson02.teach.its_five_dollars_for_one_ticket: {title: "It's five dollars for one ticket.", gloss: "Het is vijf dollar voor één kaartje.", note: "for one ticket betekent voor één kaartje."}
  en.a1.unit55.lesson02.teach.do_i_need_a_swim_cap: {title: "Do I need a swim cap?", gloss: "Heb ik een badmuts nodig?", note: "Do I need...? gebruikt do-support voor de vraagvorm."}
  en.a1.unit55.lesson02.teach.we_close_at_eight: {title: "We close at eight o'clock.", gloss: "Wij sluiten om acht uur.", note: "at eight o'clock -- Engels gebruikt at voor een klokvast tijdstip, net als het Nederlandse om."}

  en.a1.unit55.lesson03.teach.dialogue_line1: {title: "De badmeester begroet hen", gloss: "De Badmeester zegt: Hoi! Komen jullie vandaag zwemmen?", note: "Are you here to swim today? gebruikt to swim als doel-infinitief -- vergelijkbaar met het Nederlandse om te zwemmen."}
  en.a1.unit55.lesson03.teach.dialogue_line2: {title: "Daniels kaartjes", gloss: "Daniel zegt: Ja, twee kaartjes, alstublieft.", note: "Een kort, direct verzoek om twee kaartjes."}
  en.a1.unit55.lesson03.teach.dialogue_line3: {title: "De prijs", gloss: "De Badmeester zegt: Natuurlijk! Het is vijf dollar voor één kaartje.", note: "Eén apart feit: de prijs per kaartje."}
  en.a1.unit55.lesson03.teach.dialogue_line4: {title: "Mia vraagt naar de badmuts", gloss: "Mia zegt: Hebben we een badmuts nodig?", note: "Do we need...? -- opnieuw do-support voor de vraagvorm."}
  en.a1.unit55.lesson03.teach.dialogue_line5: {title: "De badmutsregel", gloss: "De Badmeester zegt: Ja, badmutsen zijn verplicht in het zwembad.", note: "swim caps are required is een lijdende vorm (passief) -- een formele manier om een regel te noemen, vaak gebruikt op zwembadborden en door personeel. Het Nederlands zegt dit vaak directer met een modaal werkwoord (je moet) of het bijvoeglijk naamwoord verplicht, maar deze passieve vorm is de natuurlijke manier om het in het Engels te zeggen."}
  en.a1.unit55.lesson03.teach.dialogue_line6: {title: "Daniel vraagt naar de kluisjes", gloss: "Daniel zegt: Waar zijn de kluisjes?", note: "Een korte vraag, geen nieuw feit over prijs of tijd."}
  en.a1.unit55.lesson03.teach.dialogue_line7: {title: "De locatie van de kluisjes", gloss: "De Badmeester zegt: De kluisjes zijn bij de ingang.", note: "Eén apart feit: de locatie van de kluisjes -- anders dan wat de kluisjes nodig hebben."}
  en.a1.unit55.lesson03.teach.dialogue_line8: {title: "Wat de kluisjes nodig hebben", gloss: "De Badmeester zegt: Ze hebben een dollarmunt nodig.", note: "*a dollar coin* is een Engels samengesteld zelfstandig naamwoord (dollar + coin) -- het Engels plakt de twee woorden gewoon achter elkaar zonder voorzetsel, terwijl het Nederlands hier het voorzetsel van nodig heeft: een munt van een dollar."}
  en.a1.unit55.lesson03.teach.dialogue_line9: {title: "Mia vraagt naar de sluitingstijd", gloss: "Mia zegt: Hoe laat sluiten jullie?", note: "What time do you close? gebruikt do-support voor de vraagvorm."}
  en.a1.unit55.lesson03.teach.dialogue_line10: {title: "De sluitingstijd", gloss: "De Badmeester zegt: Wij sluiten om acht uur.", note: "Een vierde, apart feit: de sluitingstijd."}

  en.a1.unit55.lesson04.teach.reading_passage: {title: "Tekst: Een dagje naar het zwembad", gloss: "Op een hete middag in juli besloten Daniel en Mia af te koelen bij het buurtzwembad. Bij de ingang stond een bord met de zwembadregels: niet rennen, en badmutsen zijn verplicht in het zwembad. Ze vroegen de badmeester om twee kaartjes. Het was vijf dollar voor één kaartje. De badmeester legde uit dat de kluisjes bij de ingang waren en een dollarmunt nodig hadden. Daniel en Mia stopten hun tassen in een kluisje en zwommen bijna twee uur. Voordat ze weggingen, controleerden ze het bord nog een keer: het zwembad sluit om acht uur. Mia zei dat ze het volgende weekend terug wilde komen om de duikplank te proberen.", note: "*required* is een lijdende vorm (passief) -- swim caps are required betekent badmutsen zijn verplicht."}

exercises:
  en.a1.unit55.lesson01.exercise01.listen_word:
    instruction: "Luister en kies het genoemde woord."
    correct_option: "locker"
    distractors: ["ticket", "rules", "lifeguard"]
    accepted_answers: [{value: "locker", status: correct}]
    feedback: "*locker* betekent kluisje."
  en.a1.unit55.lesson01.exercise02.choose_lifeguard_meaning:
    instruction: "Welk woord betekent de persoon die op zwemmers let om ze veilig te houden?"
    correct_option: "lifeguard"
    distractors: ["ticket", "locker", "rules"]
    accepted_answers: [{value: "lifeguard", status: correct}]
    feedback: "*lifeguard* betekent badmeester."
  en.a1.unit55.lesson01.exercise03.match_pool_words:
    instruction: "Verbind elke omschrijving met het juiste woord."
    accepted_answers: [{value: [{left: "a public place with a large pool where people go to swim", right: "swimming pool"}, {left: "the card or paper you buy to enter the pool", right: "ticket"}, {left: "a small locked space where you keep your bag and clothes", right: "locker"}, {left: "a tight cap you wear on your head while swimming", right: "swim cap"}, {left: "the instructions everyone at the pool must follow", right: "rules"}, {left: "the person who watches swimmers to keep them safe", right: "lifeguard"}], status: correct}]
    feedback: "swimming pool=zwembad, ticket=kaartje, locker=kluisje, swim cap=badmuts, rules=regels, lifeguard=badmeester."
  en.a1.unit55.lesson01.exercise04.order_lifeguard_sentence:
    instruction: "Zet de woorden in de juiste volgorde voor 'De badmeester houdt elke dag toezicht op het zwembad.'"
    accepted_answers: [{value: ["The", "lifeguard", "watches", "the", "pool", "every", "day."], status: correct}]
    feedback: "De juiste volgorde is The lifeguard watches the pool every day."
  en.a1.unit55.lesson01.exercise05.write_ticket:
    instruction: "Schrijf het woord voor wat je moet kopen voordat je het zwembad in mag."
    accepted_answers: [{value: "ticket", status: correct}]
    feedback: "*ticket* betekent kaartje."

  en.a1.unit55.lesson02.exercise01.listen_phrase:
    instruction: "Luister en kies de genoemde zin."
    correct_option: "What time do you open?"
    distractors: ["I'd like to buy a ticket, please.", "Where are the lockers?", "Do I need a swim cap?"]
    accepted_answers: [{value: "What time do you open?", status: correct}]
    feedback: "What time do you open? betekent hoe laat gaat u open?"
  en.a1.unit55.lesson02.exercise02.choose_buy_ticket_meaning:
