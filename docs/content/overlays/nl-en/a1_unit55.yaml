    correct_option: "I'd like to buy a ticket, please."
    distractors: ["Where are the lockers?", "Do I need a swim cap?", "We close at eight o'clock."]
    accepted_answers: [{value: "I'd like to buy a ticket, please.", status: correct}]
    feedback: "I'd like to buy a ticket, please. is de beleefde manier om een kaartje te kopen."
  en.a1.unit55.lesson02.exercise03.choose_close_time_meaning:
    instruction: "Welke zin vertelt hoe laat het zwembad sluit?"
    correct_option: "We close at eight o'clock."
    distractors: ["What time do you open?", "Do I need a swim cap?", "It's five dollars for one ticket."]
    accepted_answers: [{value: "We close at eight o'clock.", status: correct}]
    feedback: "We close at eight o'clock. vertelt de sluitingstijd."
  en.a1.unit55.lesson02.exercise04.order_price_sentence:
    instruction: "Zet de woorden in de juiste volgorde voor 'Het is vijf dollar voor één kaartje.'"
    accepted_answers: [{value: ["It's", "five", "dollars", "for", "one", "ticket."], status: correct}]
