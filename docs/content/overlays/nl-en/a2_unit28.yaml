  en.a2.unit28.lesson01.teach.getting_worse: {title: "getting worse", gloss: "erger worden", note: "*getting worse* betekent dat een klacht erger wordt.", example_gloss: "Mijn hoofdpijn wordt erger, niet beter."}
  en.a2.unit28.lesson01.teach.insurance_card: {title: "insurance card", gloss: "verzekeringspas", note: "*insurance card* betekent de pas waarmee je doktersbezoek wordt betaald.", example_gloss: "Neem je verzekeringspas mee naar de afspraak."}
