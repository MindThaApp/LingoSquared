course:
  title: "Engels A2"
  description: "Engels leren op A2-niveau voor formelere situaties, met gedetailleerde uitleg in het Nederlands."

units:
  en.a2.unit39.after_the_interview: {title: "Opvolging na een sollicitatiegesprek"}

lessons:
  en.a2.unit39.lesson01.offer_vocabulary: {title: "Aanbiedingen, contracten en startdatums"}
  en.a2.unit39.lesson02.following_up: {title: "Nog even van je laten horen en het aanbod aannemen"}
  en.a2.unit39.lesson03.reading_an_offer_message: {title: "Een aanbod lezen"}
  en.a2.unit39.lesson04.offer_call_dialogue: {title: "Het telefoontje met het aanbod"}

teaching:
  en.a2.unit39.lesson01.teach.offer: {title: "offer", gloss: "aanbod", note: "*offer* is hier het aanbod van een baan; als werkwoord betekent *to offer* aanbieden.", example_gloss: "Ik heb een aanbod gekregen van Bright Path Marketing."}
  en.a2.unit39.lesson01.teach.contract: {title: "contract", gloss: "contract", note: "*contract* is de schriftelijke afspraak tussen jou en het bedrijf.", example_gloss: "Het contract is voor één jaar."}
  en.a2.unit39.lesson01.teach.salary: {title: "salary", gloss: "salaris", note: "*salary* is het bedrag dat je per maand of per jaar verdient.", example_gloss: "We kunnen volgende week over het salaris praten."}
  en.a2.unit39.lesson01.teach.accept: {title: "accept", gloss: "aannemen, accepteren", note: "*accept* betekent ja zeggen tegen iets wat je aangeboden wordt.", example_gloss: "Ik wil de functie graag aannemen."}
  en.a2.unit39.lesson01.teach.start_date: {title: "start date", gloss: "startdatum", note: "*start date* is de eerste dag van je nieuwe baan.", example_gloss: "De startdatum is de eerste maandag van de maand."}
  en.a2.unit39.lesson01.teach.reply: {title: "reply", gloss: "antwoord", note: "*reply* is zowel het antwoord op een bericht als het werkwoord antwoorden.", example_gloss: "Ik heb nog dezelfde dag een antwoord gestuurd."}
  en.a2.unit39.lesson01.teach.grammar_would_like_to: {title: "would like to voor een beleefde wens", gloss: "Ik wil het aanbod graag aannemen. Ik wil graag op maandag beginnen.", note: "*I would like to...* is beleefder dan *I want to...* en past bij zakelijk contact."}

  en.a2.unit39.lesson02.teach.thank_you_for_the_interview: {title: "je bericht beginnen", gloss: "Hartelijk dank voor het gesprek van gisteren.", note: "*Thank you for...* is de gewone opening van een zakelijk bedankberichtje."}
  en.a2.unit39.lesson02.teach.still_interested: {title: "zeggen dat je nog steeds geïnteresseerd bent", gloss: "Ik ben nog steeds erg geïnteresseerd in de functie.", note: "*still* betekent nog steeds; het staat vóór het bijvoeglijk naamwoord."}
  en.a2.unit39.lesson02.teach.could_you_tell_me_start_date: {title: "beleefd naar de startdatum vragen", gloss: "Kunt u mij de startdatum laten weten?", note: "*Could you tell me...?* is een indirecte vraag: beleefder dan *When is the start date?*"}
  en.a2.unit39.lesson02.teach.would_like_to_accept: {title: "het aanbod aannemen", gloss: "Ik wil het aanbod graag aannemen.", note: "dit is de standaardzin waarmee je een baan aanneemt."}
  en.a2.unit39.lesson02.teach.grammar_indirect_questions: {title: "indirecte vragen met Could you tell me", gloss: "Kunt u mij de startdatum laten weten? Kunt u mij iets over de werktijden vertellen?", note: "na *Could you tell me* komt geen vraagvolgorde meer -- je zegt *the start date*, niet *what is the start date*."}

  en.a2.unit39.lesson03.teach.full_time: {title: "full time", gloss: "voltijds", note: "*full time* betekent een volledige werkweek; het tegenovergestelde is *part time*.", example_gloss: "De functie is voltijds, niet twee dagen per week."}
  en.a2.unit39.lesson03.teach.offer_message: {title: "het bericht met het aanbod", gloss: "Beste Mia, hartelijk dank voor je komst op dinsdag. We willen je graag de functie van marketingcoördinator aanbieden. Het contract is voltijds en de startdatum is maandag. Graag een antwoord vóór vrijdag. Bright Path Marketing.", note: "een aanbodbericht noemt altijd vier dingen: de functie, het soort contract, de startdatum en de datum waarop je moet reageren."}
  en.a2.unit39.lesson03.teach.please_reply_by_friday: {title: "de reactietermijn", gloss: "Graag een antwoord vóór vrijdag.", note: "*by Friday* betekent uiterlijk vrijdag, dus vrijdag zelf mag ook nog."}

  en.a2.unit39.lesson04.teach.q_calling_about_interview: {title: "de interviewer belt Mia", gloss: "De interviewer zegt: hallo Mia, ik bel over het gesprek van dinsdag.", note: "*I am calling about...* is de standaardopening van een zakelijk telefoontje."}
  en.a2.unit39.lesson04.teach.a_still_interested: {title: "Mia zegt dat ze nog steeds geïnteresseerd is", gloss: "Mia zegt: dank u wel voor uw telefoontje. Ik ben nog steeds erg geïnteresseerd in de functie.", note: "dezelfde zin die we in les 2 hebben geleerd."}
  en.a2.unit39.lesson04.teach.q_offer_you_the_job: {title: "de interviewer biedt de baan aan", gloss: "De interviewer zegt: mooi, want we willen u de baan graag aanbieden.", note: "*because* verbindt hier haar antwoord met het goede nieuws dat volgt."}
  en.a2.unit39.lesson04.teach.a_great_news_ask_start_date: {title: "Mia reageert en vraagt naar de startdatum", gloss: "Mia zegt: wat goed nieuws. Kunt u mij de startdatum laten weten?", note: "eerst kort reageren op het nieuws, dan pas je vraag stellen."}
  en.a2.unit39.lesson04.teach.q_start_date_and_contract: {title: "de interviewer noemt datum en contract", gloss: "De interviewer zegt: de startdatum is maandag en het contract is voltijds.", note: "dezelfde twee feiten als in het bericht in les 3."}
  en.a2.unit39.lesson04.teach.a_ask_working_hours: {title: "Mia vraagt naar de werktijden", gloss: "Mia vraagt: kunt u mij iets over de werktijden vertellen?", note: "dezelfde indirecte vraagvorm als bij de startdatum."}
  en.a2.unit39.lesson04.teach.q_nine_to_five: {title: "de interviewer noemt de werktijden", gloss: "De interviewer zegt: van negen tot vijf, met een uur pauze voor de lunch.", note: "*from nine to five* is de vaste manier om een werkdag te beschrijven."}
  en.a2.unit39.lesson04.teach.a_accept_the_offer: {title: "Mia neemt het aanbod aan", gloss: "Mia zegt: dank u wel. Ik wil het aanbod graag aannemen.", note: "dezelfde zin die we in les 2 hebben geleerd."}
  en.a2.unit39.lesson04.teach.q_send_the_contract: {title: "de interviewer sluit af", gloss: "De interviewer zegt: geweldig. We sturen u het contract vandaag nog.", note: "*Wonderful* is een warme, positieve reactie -- ook in zakelijk Engels heel gewoon."}

exercises:
  en.a2.unit39.lesson01.exercise01.listen_word:
    instruction: "Luister en kies het woord dat gezegd wordt."
    correct_option: "offer"
    distractors: ["contract", "salary", "reply"]
    accepted_answers: [{value: "offer", status: "correct"}]
    feedback: "*offer* betekent aanbod."
  en.a2.unit39.lesson01.exercise02.choose_contract_word:
    instruction: "Welk woord betekent de schriftelijke afspraak tussen jou en je nieuwe bedrijf?"
    correct_option: "contract"
    distractors: ["offer", "salary", "reply"]
    accepted_answers: [{value: "contract", status: "correct"}]
    feedback: "*contract* betekent contract."
  en.a2.unit39.lesson01.exercise03.choose_start_date_phrase:
    instruction: "Welke uitdrukking betekent de eerste dag van je nieuwe baan?"
    correct_option: "start date"
    distractors: ["working hours", "start of the contract", "first reply"]
    accepted_answers: [{value: "start date", status: "correct"}]
    feedback: "*start date* betekent startdatum."
  en.a2.unit39.lesson01.exercise04.match_offer_words:
    instruction: "Verbind elke omschrijving met het juiste Engelse woord of de juiste uitdrukking."
    accepted_answers:
      - value:
          - {left: "when a company says it wants to give you the job", right: "offer"}
          - {left: "the written agreement between you and the company", right: "contract"}
          - {left: "the money you get for your work each month", right: "salary"}
          - {left: "to say yes to something you are given", right: "accept"}
          - {left: "the first day of your new job", right: "start date"}
          - {left: "an answer to a message", right: "reply"}
          - {left: "the meeting where a company asks about your experience", right: "interview"}
          - {left: "the job you do inside a company", right: "position"}
        status: "correct"
    feedback: "*offer*=aanbod, *contract*=contract, *salary*=salaris, *accept*=aannemen, *start date*=startdatum, *reply*=antwoord, *interview*=sollicitatiegesprek, *position*=functie."
  en.a2.unit39.lesson01.exercise05.write_contract:
    instruction: "Schrijf het Engelse woord voor de schriftelijke afspraak tussen jou en het bedrijf."
    accepted_answers:
      - {value: "contract", status: "correct"}
      - {value: "Contract", status: "correct"}
    feedback: "*contract* betekent contract."

  en.a2.unit39.lesson02.exercise01.listen_acceptance:
    instruction: "Luister en kies de zin die gezegd wordt."
    correct_option: "I would like to accept the offer"
    distractors: ["Thank you for the interview yesterday.", "I am still very interested in the position.", "Could you tell me the start date?"]
    accepted_answers: [{value: "I would like to accept the offer", status: "correct"}]
    feedback: "dit betekent: ik wil het aanbod graag aannemen."
  en.a2.unit39.lesson02.exercise02.choose_follow_up_opening:
    instruction: "Je schrijft een dag na je sollicitatiegesprek een kort berichtje. Hoe begin je?"
    correct_option: "Thank you for the interview yesterday."
    distractors: ["I would like to accept the offer.", "Could you tell me the start date?", "I am still very interested in the position."]
    accepted_answers: [{value: "Thank you for the interview yesterday.", status: "correct"}]
    feedback: "*Thank you for the interview yesterday* is de gewone opening van zo'n bericht; de rest komt daarna."
  en.a2.unit39.lesson02.exercise03.choose_ask_start_date:
    instruction: "Je wilt weten op welke dag de baan begint. Hoe vraag je dat formeel?"
    correct_option: "Could you tell me the start date?"
    distractors: ["Thank you for the interview yesterday.", "I would like to accept the offer.", "I am still very interested in the position."]
    accepted_answers: [{value: "Could you tell me the start date?", status: "correct"}]
    feedback: "*Could you tell me...?* is de beleefde, indirecte vraagvorm."
  en.a2.unit39.lesson02.exercise04.order_still_interested:
    instruction: "Zet de woorden in de juiste volgorde voor «ik ben nog steeds erg geïnteresseerd in de functie»."
    accepted_answers: [{value: ["I", "am", "still", "very", "interested", "in", "the", "position"], status: "correct"}]
    feedback: "de juiste volgorde is *I am still very interested in the position*."
  en.a2.unit39.lesson02.exercise05.order_accept_the_offer:
    instruction: "Zet de woorden in de juiste volgorde voor «ik wil het aanbod graag aannemen»."
    accepted_answers: [{value: ["I", "would", "like", "to", "accept", "the", "offer"], status: "correct"}]
    feedback: "de juiste volgorde is *I would like to accept the offer*."
  en.a2.unit39.lesson02.exercise06.reply_accept_the_offer:
    instruction: "Het bedrijf biedt je de baan aan. Neem het aanbod aan met de zin uit deze les."
    accepted_answers:
      - {value: "I would like to accept the offer.", status: "correct"}
      - {value: "I would like to accept the offer", status: "correct"}
    feedback: "*I would like to accept the offer* is de standaardzin waarmee je een baan aanneemt."
  en.a2.unit39.lesson02.exercise07.write_follow_up_message:
    instruction: "Schrijf een kort bericht na je gesprek: bedank ze eerst voor het gesprek van gisteren en zeg daarna dat je nog steeds erg geïnteresseerd bent in de functie."
    accepted_answers:
      - {value: "Thank you for the interview yesterday. I am still very interested in the position.", status: "correct"}
      - {value: "Thank you for the interview yesterday, and I am still very interested in the position.", status: "correct"}
    feedback: "dit bericht combineert het bedanken met je interesse in de functie -- allebei de vormen zijn goed."

  en.a2.unit39.lesson03.exercise01.read_which_position:
    instruction: "Welke functie wordt Mia aangeboden?"
    correct_option: "marketing coordinator"
    distractors: ["social media manager", "team coordinator", "marketing assistant"]
    accepted_answers: [{value: "marketing coordinator", status: "correct"}]
    feedback: "in het bericht staat *the position of marketing coordinator*."
  en.a2.unit39.lesson03.exercise02.read_start_date:
    instruction: "Wat is de startdatum in het bericht?"
    correct_option: "Monday"
    distractors: ["Tuesday", "Friday", "the first day of the month"]
    accepted_answers: [{value: "Monday", status: "correct"}]
    feedback: "in het bericht staat *the start date is Monday*."
  en.a2.unit39.lesson03.exercise03.read_reply_deadline:
    instruction: "Wanneer moet Mia antwoorden?"
    correct_option: "by Friday"
    distractors: ["by Monday", "by Tuesday", "within two weeks"]
    accepted_answers: [{value: "by Friday", status: "correct"}]
    feedback: "in het bericht staat *Please reply by Friday*."
  en.a2.unit39.lesson03.exercise04.choose_contract_type:
    instruction: "Wat voor contract beschrijft het bericht?"
    correct_option: "full time"
    distractors: ["two days a week", "for one month", "without a start date"]
    accepted_answers: [{value: "full time", status: "correct"}]
    feedback: "in het bericht staat *The contract is full time*."
  en.a2.unit39.lesson03.exercise05.order_offer_sentence:
    instruction: "Zet de woorden in de juiste volgorde voor «we willen je graag de functie van marketingcoördinator aanbieden»."
    accepted_answers: [{value: ["We", "would", "like", "to", "offer", "you", "the", "position", "of", "marketing", "coordinator"], status: "correct"}]
    feedback: "de juiste volgorde is *We would like to offer you the position of marketing coordinator*."
  en.a2.unit39.lesson03.exercise06.write_reply_deadline:
    instruction: "Schrijf het verzoek uit het bericht over antwoorden, beginnend met Please reply."
    accepted_answers:
      - {value: "Please reply by Friday.", status: "correct"}
      - {value: "Please reply by Friday", status: "correct"}
    feedback: "*Please reply by Friday* betekent: graag een antwoord vóór vrijdag."

  en.a2.unit39.lesson04.exercise01.listen_start_date:
    instruction: "Luister naar het gesprek en kies de startdatum."
    correct_option: "The start date is Monday"
    distractors: ["The start date is Tuesday", "The start date is next month", "The start date is not fixed yet"]
    accepted_answers: [{value: "The start date is Monday", status: "correct"}]
    feedback: "de interviewer zegt *The start date is Monday*."
  en.a2.unit39.lesson04.exercise02.listen_working_hours:
    instruction: "Luister en kies de werktijden."
    correct_option: "From nine to five"
    distractors: ["From eight to four", "From nine to six", "From ten to five"]
    accepted_answers: [{value: "From nine to five", status: "correct"}]
    feedback: "de interviewer zegt *From nine to five, with one hour for lunch*."
  en.a2.unit39.lesson04.exercise03.choose_what_mia_does:
    instruction: "Wat zegt Mia aan het eind van het telefoongesprek?"
    correct_option: "I would like to accept the offer."
    distractors: ["I would like to think about it.", "Could you tell me the salary?", "I am not interested in the position."]
    accepted_answers: [{value: "I would like to accept the offer.", status: "correct"}]
    feedback: "Mia zegt *I would like to accept the offer*."
  en.a2.unit39.lesson04.exercise04.order_ask_working_hours:
    instruction: "Zet de woorden in de juiste volgorde voor «kunt u mij iets over de werktijden vertellen?»."
    accepted_answers: [{value: ["Could", "you", "tell", "me", "about", "the", "working", "hours"], status: "correct"}]
    feedback: "de juiste volgorde is *Could you tell me about the working hours*."
  en.a2.unit39.lesson04.exercise05.reply_accept_as_mia:
    instruction: "De interviewer heeft de werktijden genoemd. Neem nu als Mia het aanbod aan."
    accepted_answers:
      - {value: "I would like to accept the offer.", status: "correct"}
      - {value: "I would like to accept the offer", status: "correct"}
    feedback: "*I would like to accept the offer* is Mia's antwoord in het gesprek."
  en.a2.unit39.lesson04.exercise06.speak_offer_call_dialogue:
    instruction: "Speel Mia aan de telefoon: zeg dat je nog steeds geïnteresseerd bent, vraag naar de startdatum en neem daarna het aanbod aan."
    accepted_answers:
      - {value: "I am still very interested in the position. Could you tell me the start date? I would like to accept the offer.", status: "correct"}
    feedback: "dit antwoord dekt alle drie de stappen van het gesprek: je interesse, je vraag en het aannemen van het aanbod."
