units:
  en.a2.unit34.shopping_complaint: {title: "Een klacht indienen over een aankoop"}

lessons:
  en.a2.unit34.lesson01.complaint_vocabulary: {title: "Terugbetalingen, ruilen en bonnen"}
  en.a2.unit34.lesson02.making_a_complaint: {title: "Het probleem uitleggen en om een terugbetaling vragen"}
  en.a2.unit34.lesson03.reading_a_return_policy: {title: "Een retourbeleid lezen"}
  en.a2.unit34.lesson04.store_dialogue: {title: "De blender terugbrengen"}

teaching:
  en.a2.unit34.lesson01.teach.refund: {title: "refund", gloss: "terugbetaling", note: "*refund* betekent je geld terugkrijgen.", example_gloss: "Ik wil graag een terugbetaling voor deze blender."}
  en.a2.unit34.lesson01.teach.exchange: {title: "exchange", gloss: "ruilen", note: "*exchange* betekent een artikel omruilen voor een ander.", example_gloss: "Wilt u een terugbetaling of ruilen?"}
  en.a2.unit34.lesson01.teach.receipt: {title: "receipt", gloss: "bon", note: "*receipt* betekent de bon die bewijst dat je iets gekocht hebt.", example_gloss: "Heeft u uw bon?"}
  en.a2.unit34.lesson01.teach.return_policy: {title: "return policy", gloss: "retourbeleid", note: "*return policy* betekent de regels van een winkel over het terugbrengen van artikelen.", example_gloss: "Het retourbeleid van de winkel staat 30 dagen toe."}
  en.a2.unit34.lesson01.teach.defective: {title: "defective", gloss: "defect", note: "*defective* betekent kapot of niet goed werkend.", example_gloss: "De blender was defect, dus ik heb hem teruggebracht."}

  en.a2.unit34.lesson02.teach.return_blender_stopped_working: {title: "een defect artikel terugbrengen", gloss: "Ik wil graag deze blender terugbrengen. Hij stopte met werken na één keer gebruiken.", note: "*I'd like to return...* is een beleefde manier om een artikel terug te brengen."}
  en.a2.unit34.lesson02.teach.refund_or_exchange_question: {title: "de winkelmedewerker biedt een keuze aan", gloss: "Wilt u een terugbetaling of ruilen?", note: "*Would you like...or...?* gebruik je om een keuze aan te bieden."}
  en.a2.unit34.lesson02.teach.id_like_a_refund: {title: "om een terugbetaling vragen", gloss: "Ik wil graag een terugbetaling, alstublieft.", note: "*I'd like..., please* is een beleefde manier om iets te vragen."}

  en.a2.unit34.lesson03.teach.within_30_days: {title: "vertellen binnen welke termijn je kunt retourneren", gloss: "Artikelen kunnen binnen 30 dagen worden geretourneerd met een bon.", note: "*within 30 days* betekent binnen een termijn van 30 dagen."}
  en.a2.unit34.lesson03.teach.policy_text: {title: "retourbeleidtekst", gloss: "Retourbeleid: artikelen kunnen binnen 30 dagen worden geretourneerd met een bon. Defecte artikelen kunnen op elk moment worden geruild of terugbetaald.", note: "dit is een echt, formeel retourbeleid -- A2-niveau."}
  en.a2.unit34.lesson03.teach.i_have_my_receipt: {title: "vertellen dat je je bon hebt", gloss: "Ik heb mijn bon van vorige week.", note: "*from last week* betekent van vorige week."}

  en.a2.unit34.lesson04.teach.q_return_blender: {title: "Leila brengt de blender terug", gloss: "Leila zegt: hoi, ik wil graag deze blender terugbrengen. Hij stopte met werken na één keer gebruiken.", note: "dezelfde zin die we in les 2 hebben geleerd, nu met een begroeting."}
  en.a2.unit34.lesson04.teach.a_sorry_do_you_have_receipt: {title: "de medewerker vraagt om de bon", gloss: "de medewerker zegt: wat vervelend om te horen. Heeft u uw bon?", note: "*I'm sorry to hear that* is een beleefde manier om medeleven te tonen."}
  en.a2.unit34.lesson04.teach.q_yes_bought_last_week: {title: "Leila bevestigt de aankoop", gloss: "Leila zegt: ja, hier is hij. Ik heb hem vorige week gekocht.", note: "Leila geeft de bon en vertelt wanneer ze de blender kocht."}
  en.a2.unit34.lesson04.teach.a_refund_or_exchange: {title: "de medewerker biedt een keuze aan", gloss: "de medewerker zegt: dank u. Wilt u een terugbetaling of ruilen?", note: "dezelfde vraag die we in les 2 hebben geleerd."}
  en.a2.unit34.lesson04.teach.q_id_like_a_refund: {title: "Leila kiest een terugbetaling", gloss: "Leila zegt: ik wil graag een terugbetaling, alstublieft.", note: "dezelfde zin die we in les 2 hebben geleerd."}
  en.a2.unit34.lesson04.teach.a_refund_thirty_five: {title: "de medewerker geeft de terugbetaling", gloss: "de medewerker zegt: geen probleem. Hier is uw terugbetaling van vijfendertig dollar.", note: "de medewerker rondt de klacht af met het precieze bedrag."}

exercises:
  en.a2.unit34.lesson01.exercise01.listen_word:
    instruction: "Luister en kies het woord dat gezegd wordt."
    correct_option: "defective"
    distractors: ["refund", "exchange", "receipt"]
    accepted_answers: [{value: "defective", status: "correct"}]
    feedback: "*defective* betekent defect."
  en.a2.unit34.lesson01.exercise02.choose_money_back_word:
    instruction: "Welk woord betekent je geld terugkrijgen?"
    correct_option: "refund"
    distractors: ["exchange", "receipt", "return policy"]
    accepted_answers: [{value: "refund", status: "correct"}]
    feedback: "*refund* betekent terugbetaling."
  en.a2.unit34.lesson01.exercise03.choose_proof_of_purchase_word:
    instruction: "Welk woord betekent het papier dat bewijst dat je iets gekocht hebt?"
    correct_option: "receipt"
    distractors: ["refund", "exchange", "defective"]
    accepted_answers: [{value: "receipt", status: "correct"}]
    feedback: "*receipt* betekent bon."
  en.a2.unit34.lesson01.exercise04.match_complaint_words:
    instruction: "Verbind elke omschrijving met het juiste Engelse woord of de juiste uitdrukking."
    accepted_answers:
      - value:
          - {left: "getting your money back", right: "refund"}
          - {left: "trading an item for a different one", right: "exchange"}
          - {left: "the paper that proves you bought something", right: "receipt"}
          - {left: "a store's rules about returning items", right: "return policy"}
          - {left: "broken or not working correctly", right: "defective"}
          - {left: "what's wrong with an item", right: "problem"}
          - {left: "words used to apologize to a customer", right: "I'm sorry to hear that"}
        status: "correct"
    feedback: "*refund*=terugbetaling, *exchange*=ruilen, *receipt*=bon, *return policy*=retourbeleid, *defective*=defect, *problem*=probleem, *I'm sorry to hear that*=wat vervelend om te horen."
  en.a2.unit34.lesson01.exercise05.write_exchange:
    instruction: "Schrijf het woord voor een artikel omruilen voor een ander."
    accepted_answers:
      - {value: "exchange", status: "correct"}
      - {value: "Exchange", status: "correct"}
    feedback: "*exchange* betekent ruilen."

  en.a2.unit34.lesson02.exercise01.listen_return_request:
    instruction: "Luister en kies de zin die gezegd wordt."
    correct_option: "I'd like to return this blender"
    distractors: ["Would you like a refund or an exchange?", "Do you have your receipt?", "I bought it last week."]
    accepted_answers: [{value: "I'd like to return this blender", status: "correct"}]
    feedback: "dit betekent dat je deze blender wilt terugbrengen."
  en.a2.unit34.lesson02.exercise02.choose_polite_return_request:
    instruction: "Je wilt een kapot artikel terugbrengen naar een winkel. Wat zeg je?"
    correct_option: "I'd like to return this blender. It stopped working after one use."
    distractors: ["Would you like a refund or an exchange?", "Do you have your receipt?", "Here's your refund of thirty-five dollars."]
    accepted_answers: [{value: "I'd like to return this blender. It stopped working after one use.", status: "correct"}]
    feedback: "*I'd like to return...* is een beleefde manier om een artikel terug te brengen."
  en.a2.unit34.lesson02.exercise03.order_refund_or_exchange_question:
    instruction: "Zet de woorden in de juiste volgorde voor «wilt u een terugbetaling of ruilen?»."
    accepted_answers: [{value: ["Would", "you", "like", "a", "refund", "or", "an", "exchange"], status: "correct"}]
    feedback: "de juiste volgorde is *Would you like a refund or an exchange*."
  en.a2.unit34.lesson02.exercise04.reply_refund_or_exchange:
    instruction: "De medewerker vraagt: wilt u een terugbetaling of ruilen? Kies een terugbetaling."
    accepted_answers:
      - {value: "I'd like a refund, please.", status: "correct"}
      - {value: "I'd like a refund, please", status: "correct"}
    feedback: "*I'd like a refund, please* betekent dat je een terugbetaling wilt."
  en.a2.unit34.lesson02.exercise05.write_complaint_message:
    instruction: "Schrijf dat je een blender wilt terugbrengen omdat hij stopte met werken na één keer gebruiken."
    accepted_answers:
      - {value: "I'd like to return this blender. It stopped working after one use.", status: "correct"}
      - {value: "I'd like to return this blender. It stopped working after one use", status: "correct"}
    feedback: "deze zin combineert het verzoek om terug te brengen met de reden."

  en.a2.unit34.lesson03.exercise01.read_return_window:
    instruction: "Hoe lang kun je een artikel retourneren, volgens de tekst?"
    correct_option: "within 30 days"
    distractors: ["within 7 days", "within 60 days", "within 14 days"]
    accepted_answers: [{value: "within 30 days", status: "correct"}]
    feedback: "de tekst zegt *within 30 days*."
  en.a2.unit34.lesson03.exercise02.read_return_requirement:
    instruction: "Wat heb je nodig om een artikel te retourneren?"
    correct_option: "a receipt"
    distractors: ["a confirmation number", "a photo ID", "an insurance card"]
    accepted_answers: [{value: "a receipt", status: "correct"}]
    feedback: "de tekst zegt *with a receipt*."
  en.a2.unit34.lesson03.exercise03.choose_defective_item_rule:
    instruction: "Wat gebeurt er volgens de tekst met een defect artikel?"
    correct_option: "exchanged or refunded at any time"
    distractors: ["it cannot be returned at all", "it can only be exchanged within 7 days", "it must be reported within 24 hours"]
    accepted_answers: [{value: "exchanged or refunded at any time", status: "correct"}]
    feedback: "de tekst zegt *defective items can be exchanged or refunded at any time*."
  en.a2.unit34.lesson03.exercise04.order_items_returned_sentence:
    instruction: "Zet de woorden in de juiste volgorde voor «artikelen kunnen binnen 30 dagen worden geretourneerd»."
    accepted_answers: [{value: ["Items", "can", "be", "returned", "within", "30", "days"], status: "correct"}]
    feedback: "de juiste volgorde is *Items can be returned within 30 days*."
  en.a2.unit34.lesson03.exercise05.write_have_receipt:
    instruction: "Schrijf dat je je bon van vorige week hebt."
    accepted_answers:
      - {value: "I have my receipt from last week.", status: "correct"}
      - {value: "I have my receipt from last week", status: "correct"}
    feedback: "*I have my receipt from last week* betekent dat je je bon van vorige week hebt."

  en.a2.unit34.lesson04.exercise01.listen_whats_wrong:
    instruction: "Luister naar het gesprek en kies wat er mis is met de blender."
    correct_option: "It stopped working after one use"
    distractors: ["It never worked at all", "It was the wrong color", "It was too small"]
    accepted_answers: [{value: "It stopped working after one use", status: "correct"}]
    feedback: "Leila zegt *It stopped working after one use*."
  en.a2.unit34.lesson04.exercise02.listen_refund_amount:
    instruction: "Luister en kies het bedrag van de terugbetaling."
    correct_option: "thirty-five dollars"
    distractors: ["twenty-five dollars", "forty-five dollars", "fifty dollars"]
    accepted_answers: [{value: "thirty-five dollars", status: "correct"}]
    feedback: "de medewerker zegt *thirty-five dollars*."
  en.a2.unit34.lesson04.exercise03.choose_clerk_offer:
    instruction: "Wat biedt de medewerker Leila aan?"
    correct_option: "a refund or an exchange"
    distractors: ["only a refund", "only store credit", "a discount on a new blender"]
    accepted_answers: [{value: "a refund or an exchange", status: "correct"}]
    feedback: "de medewerker zegt *a refund or an exchange*."
  en.a2.unit34.lesson04.exercise04.order_do_you_have_receipt_question:
    instruction: "Zet de woorden in de juiste volgorde voor «heeft u uw bon?»."
    accepted_answers: [{value: ["Do", "you", "have", "your", "receipt"], status: "correct"}]
    feedback: "de juiste volgorde is *Do you have your receipt*."
  en.a2.unit34.lesson04.exercise05.reply_as_leila:
    instruction: "De medewerker zegt: kan ik u helpen? Geef Leila's volledige antwoord: leg het probleem met de blender uit, bevestig de aankoop, en vraag om een terugbetaling."
    accepted_answers:
      - {value: "Hi, I'd like to return this blender. It stopped working after one use. Yes, here it is. I bought it last week. I'd like a refund, please.", status: "correct"}
    feedback: "dit volledige antwoord combineert het probleem, de aankoopbevestiging en het verzoek om een terugbetaling -- meerdere momenten uit het gesprek samen."
  en.a2.unit34.lesson04.exercise06.speak_complaint_dialogue:
    instruction: "Antwoord de medewerker hardop in de rol van Leila."
    accepted_answers:
      - {value: "Hi, I'd like to return this blender. It stopped working after one use. Yes, here it is. I bought it last week. I'd like a refund, please.", status: "correct"}
    feedback: "dit volledige antwoord dekt alle onderdelen van het gesprek: het probleem, de bon en de terugbetaling."
