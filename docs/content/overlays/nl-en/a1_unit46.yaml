teaching:
  en.a1.unit46.lesson01.teach.lost: {title: "lost", gloss: "kwijt / verloren", note: "*lost* betekent hier kwijt of verloren. Het Nederlands zegt vaak ik ben ... kwijt (een toestand), terwijl het Engels altijd de werkwoordsvorm I lost gebruikt.", example_gloss: "Ik ben mijn portemonnee kwijt."}
  en.a1.unit46.lesson01.teach.found: {title: "found", gloss: "gevonden", note: "*found* betekent gevonden, de voltooid deelwoordvorm van find.", example_gloss: "Ik heb je sleutels gevonden!"}
  en.a1.unit46.lesson01.teach.keys: {title: "keys", gloss: "sleutels", note: "*keys* betekent sleutels.", example_gloss: "Dit zijn mijn sleutels."}
  en.a1.unit46.lesson01.teach.wallet: {title: "wallet", gloss: "portemonnee", note: "*wallet* betekent portemonnee.", example_gloss: "Is dit jouw portemonnee?"}
  en.a1.unit46.lesson01.teach.backpack: {title: "backpack", gloss: "rugzak", note: "*backpack* betekent rugzak.", example_gloss: "Mijn rugzak is zwart."}

  en.a1.unit46.lesson02.teach.i_lost_my_wallet: {title: "I lost my wallet.", gloss: "Ik ben mijn portemonnee kwijt.", note: "Letterlijk ik verloor mijn portemonnee, maar in het Nederlands klinkt ik ben ... kwijt hier natuurlijker dan ik heb ... verloren."}
  en.a1.unit46.lesson02.teach.have_you_seen_my_keys: {title: "Have you seen my keys?", gloss: "Heb je mijn sleutels gezien?", note: "*Have you seen ...?* betekent heb je ... gezien? -- dezelfde volgorde als in het Nederlands, met have als hulpwerkwoord."}
  en.a1.unit46.lesson02.teach.has_anyone_found_a_backpack: {title: "Has anyone found a backpack?", gloss: "Heeft iemand een rugzak gevonden?", note: "*Has anyone found ...?* betekent heeft iemand ... gevonden?"}
  en.a1.unit46.lesson02.teach.its_black_with_a_red_strap: {title: "It's black with a red strap.", gloss: "Hij is zwart met een rode band.", note: "*It's black with a red strap.* betekent hij is zwart met een rode band."}
  en.a1.unit46.lesson02.teach.wheres_the_lost_and_found: {title: "Where's the lost and found?", gloss: "Waar is het gevonden-voorwerpenloket?", note: "*the lost and found* is de vaste Engelse benaming voor het gevonden-voorwerpenloket, letterlijk het verloren-en-gevonden."}
  en.a1.unit46.lesson02.teach.yes_we_found_it: {title: "Yes, we found it!", gloss: "Ja, we hebben het gevonden!", note: "*Yes, we found it!* betekent ja, we hebben het gevonden!"}

  en.a1.unit46.lesson03.teach.dialogue_line1: {title: "Daniels vraag", gloss: "Daniel vraagt: Mia, waar is je rugzak? Je had hem nog bij de fontein.", note: "*had* is de verleden tijd van have, net als het Nederlandse had."}
  en.a1.unit46.lesson03.teach.dialogue_line2: {title: "Mia's schrik", gloss: "Mia zegt: O nee, je hebt gelijk! Ik heb hem niet. Mijn camera zit erin!", note: "*My camera is inside!* betekent mijn camera zit erin!"}
  en.a1.unit46.lesson03.teach.dialogue_line3: {title: "Daniels voorstel", gloss: "Daniel zegt: Maak je geen zorgen, laten we het parkkantoor bellen.", note: "*Don't worry* betekent letterlijk zorg je niet, gebruikt als maak je geen zorgen."}
  en.a1.unit46.lesson03.teach.dialogue_line4: {title: "Daniel belt", gloss: "Daniel zegt: Hallo, we zijn een zwarte rugzak kwijtgeraakt bij de fontein. Heeft iemand er een gevonden?", note: "Hier gebruikt Daniel de werkwoordsvorm lost, hoewel Mia's eigen gevoel eerder kwijt is -- Engels gebruikt in beide gevallen dezelfde vorm."}
  en.a1.unit46.lesson03.teach.dialogue_line5: {title: "Mia's vraag", gloss: "Mia zegt: Wat zeiden ze?", note: "*did they say* gebruikt did als hulpwerkwoord in de verleden tijd."}
  en.a1.unit46.lesson03.teach.dialogue_line6: {title: "Daniels goede nieuws", gloss: "Daniel zegt: Ze hebben hem gevonden! Hij is zwart met een gele band, toch? Ze bewaren hem bij de balie.", note: "*right?* aan het einde van een zin is een korte controlevraag, vergelijkbaar met toch? in het Nederlands."}
  en.a1.unit46.lesson03.teach.dialogue_line7: {title: "Mia's opluchting", gloss: "Mia zegt: Ja, dat is hem! Laten we hem meteen ophalen. Goddank.", note: "*Let's go get it* betekent laten we hem gaan halen, met twee werkwoorden achter elkaar zonder to."}

  en.a1.unit46.lesson04.teach.reading_passage: {title: "Tekst over het gevonden-voorwerpenloket", gloss: "Het gevonden-voorwerpenloket: Als je iets kwijtraakt in het park, denk dan eerst na over waar je het voor het laatst had. Ga daarna naar het parkkantoor bij de hoofdingang en beschrijf het voorwerp -- vertel de kleur en eventuele bijzondere details. Geef je naam en telefoonnummer, zodat het personeel je later kan bellen als ze het vinden. Nadat Mia haar rugzak bij de fontein kwijtraakte, belden zij en Daniel meteen het parkkantoor. Het personeel had hem al gevonden en bewaarde hem bij de balie. Mia was heel opgelucht dat ze haar camera veilig terugkreeg. Later vertelde ze het hele verhaal aan Leila, en Leila zei dat ze Mia voortaan zou helpen beter op haar spullen te letten.", note: "*keep better track of your things* betekent beter op je spullen letten."}

exercises:
  en.a1.unit46.lesson01.exercise01.listen_word:
    instruction: "Luister en kies het genoemde woord."
    correct_option: "keys"
    distractors: ["lost", "found", "wallet"]
    accepted_answers: [{value: "keys", status: correct}]
    feedback: "*keys* betekent sleutels."
  en.a1.unit46.lesson01.exercise02.choose_wallet_meaning:
    instruction: "Welk woord betekent het kleine etui waarin je geld en pasjes bewaart?"
    correct_option: "wallet"
    distractors: ["keys", "backpack", "found"]
    accepted_answers: [{value: "wallet", status: correct}]
    feedback: "*wallet* betekent portemonnee."
  en.a1.unit46.lesson01.exercise03.match_lost_items_words:
    instruction: "Verbind elke omschrijving met het juiste woord."
    accepted_answers:
      - value:
          - {left: "not with you anymore; you don't know where it is", right: "lost"}
          - {left: "someone discovered it after it was missing", right: "found"}
          - {left: "what you use to open a door or start a car", right: "keys"}
          - {left: "a small case for money and cards", right: "wallet"}
          - {left: "a bag for books", right: "backpack"}
        status: "correct"
    feedback: "lost=kwijt/verloren, found=gevonden, keys=sleutels, wallet=portemonnee, backpack=rugzak."
  en.a1.unit46.lesson01.exercise04.order_lost_wallet_sentence:
    instruction: "Zet de woorden in de juiste volgorde voor 'Ik ben mijn portemonnee kwijt.'"
    accepted_answers: [{value: ["I", "lost", "my", "wallet."], status: correct}]
    feedback: "De juiste volgorde is I lost my wallet."
  en.a1.unit46.lesson01.exercise05.write_keys_word:
    instruction: "Schrijf het woord voor wat je gebruikt om een deur te openen of een auto te starten."
    accepted_answers:
      - {value: "keys", status: correct}
      - {value: "Keys", status: correct}
    feedback: "*keys* betekent sleutels."

  en.a1.unit46.lesson02.exercise01.listen_phrase:
    instruction: "Luister en kies de zin die gezegd wordt."
    correct_option: "Where's the lost and found?"
    distractors: ["I lost my wallet.", "This is your wallet.", "My backpack is black."]
    accepted_answers: [{value: "Where's the lost and found?", status: correct}]
    feedback: "Where's the lost and found? betekent waar is het gevonden-voorwerpenloket?"
  en.a1.unit46.lesson02.exercise02.choose_has_anyone_found_meaning:
    instruction: "Welke zin vraagt of iemand anders je tas heeft gevonden?"
    correct_option: "Has anyone found a backpack?"
    distractors: ["I lost my wallet.", "Have you seen my keys?", "It's black with a red strap."]
    accepted_answers: [{value: "Has anyone found a backpack?", status: correct}]
    feedback: "Has anyone found a backpack? betekent heeft iemand een rugzak gevonden?"
  en.a1.unit46.lesson02.exercise03.choose_its_black_meaning:
    instruction: "Welke zin beschrijft hoe een verloren voorwerp eruitziet?"
    correct_option: "It's black with a red strap."
    distractors: ["Where's the lost and found?", "Yes, we found it!", "Have you seen my keys?"]
    accepted_answers: [{value: "It's black with a red strap.", status: correct}]
    feedback: "It's black with a red strap. betekent hij is zwart met een rode band."
  en.a1.unit46.lesson02.exercise04.order_have_you_seen_sentence:
    instruction: "Zet de woorden in de juiste volgorde voor 'Heb je mijn sleutels gezien?'"
    accepted_answers: [{value: ["Have", "you", "seen", "my", "keys?"], status: correct}]
    feedback: "De juiste volgorde is Have you seen my keys?"
  en.a1.unit46.lesson02.exercise05.translate_i_lost_my_wallet:
    instruction: "Vertaal: 'Ik ben mijn portemonnee kwijt.'"
    accepted_answers:
      - {value: "I lost my wallet.", status: correct}
      - {value: "I lost my wallet", status: correct}
    feedback: "I lost my wallet. betekent ik ben mijn portemonnee kwijt."

  en.a1.unit46.lesson03.exercise01.comprehension_whats_inside:
