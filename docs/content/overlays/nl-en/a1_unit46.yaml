    CORRECTED 2026-07-23: review.status was "reviewed" but these notes are
    purely an authoring note (they describe the authoring work done and
    end with "Needs the mandatory fresh-context review before shipping")
    -- no fresh-context review ever actually ran, so status is now set to
    unreviewed to match. Original authoring note follows unchanged: Draft
    only. Overlay against the shared en/a1_unit46_lost_items.yaml
    realization (itself still unreviewed). This unit had NO overlay in any
    direction (nl-en/fa-en/prs-en) before this file -- it was an orphaned
    realization, authored but unreachable by any learner. Authored entirely
    independently from the target realization and universal spine; no
    sibling-direction overlay was opened or consulted (none existed for
    this unit at authoring time in any direction, confirmed via a fresh ls
    of docs/content/overlays/{nl-en,fa-en,prs-en}/ before starting). One
    main contrastive point, deliberately different from every point already
    used in this direction (see unit45's overlay notes for the running
    list through 911/112 and American "elevator"): Dutch has two distinct,
    equally common ways to say "I lost X" -- the stative "Ik ben mijn
    portemonnee kwijt" (literally "I am my wallet missing," describing the
    current state) and the action-verb "Ik heb mijn portemonnee verloren"
    (the direct cognate-shaped parallel to English "I lost my wallet") --
    while English essentially only uses the single verb-based pattern for
    this everyday phrasing. A Dutch speaker's first instinct is often the
    kwijt-construction, which has no word-for-word English equivalent, so
    this is flagged explicitly on the lost/i_lost_my_wallet teaching cards
    to make clear English collapses both ideas into lost. Needs the
    mandatory fresh-context review before shipping.

course:
  title: Engels A1
  description: >-
    Engels voor beginners, met heldere uitleg in het Nederlands en aandacht
    voor alledaagse gesprekken.

units:
