course:
  title: "Engels B1"
  description: >-
    Engels leren op B1-niveau voor alledaagse gesprekken over verplichtingen,
    mogelijkheden, hypothetische situaties en verhalen, met gedetailleerde
    uitleg in het Nederlands.

units:
  en.b1.unit02.abilities: {title: "Wat ik wel en niet kan"}

lessons:
  en.b1.unit02.lesson01.ability_vocabulary: {title: "Be able to en manage to"}
  en.b1.unit02.lesson02.present_and_past_ability: {title: "I am able to, I was able to"}
  en.b1.unit02.lesson03.reading_the_new_system: {title: "Lezen: het nieuwe systeem"}
  en.b1.unit02.lesson04.the_license_dialogue: {title: "Were you able to renew it?"}

teaching:
  en.b1.unit02.lesson01.teach.be_able_to: {title: "be able to", gloss: "in staat zijn om, kunnen", note: "*be able to* betekent dat je de mogelijkheid of gelegenheid hebt om iets te doen.", example_gloss: "Ik kan mijn rijbewijs online verlengen."}
  en.b1.unit02.lesson01.teach.manage_to: {title: "manage to", gloss: "erin slagen om", note: "*manage to* betekent dat je erin slaagt iets te doen, vaak met enige moeite.", example_gloss: "Ik slaagde erin het formulier in tien minuten af te maken."}
  en.b1.unit02.lesson01.teach.renew: {title: "renew", gloss: "verlengen", note: "*renew* betekent een document verlengen voordat het verloopt.", example_gloss: "Ik moet mijn rijbewijs verlengen."}
  en.b1.unit02.lesson01.teach.license: {title: "license", gloss: "rijbewijs", note: "*license* betekent een officieel document waarmee je mag rijden.", example_gloss: "Mijn rijbewijs verloopt deze maand."}
  en.b1.unit02.lesson01.teach.online: {title: "online", gloss: "online", note: "*online* betekent via internet, niet op een fysieke plek.", example_gloss: "Je kunt het nu online verlengen."}
  en.b1.unit02.lesson01.teach.in_person: {title: "in person", gloss: "persoonlijk, in eigen persoon", note: "*in person* betekent door zelf ergens naartoe te gaan, niet online.", example_gloss: "Vorig jaar moest ik er persoonlijk naartoe."}

  en.b1.unit02.lesson02.teach.am_able_to_renew_online: {title: "een huidige mogelijkheid uitdrukken", gloss: "Ik kan mijn rijbewijs nu online verlengen.", note: "*I am able to* drukt een huidige mogelijkheid uit."}
  en.b1.unit02.lesson02.teach.was_not_able_to_last_year: {title: "een mogelijkheid in het verleden ontkennen", gloss: "Vorig jaar kon ik het niet online doen.", note: "*was not able to* drukt een mogelijkheid in het verleden uit die er toen niet was."}
  en.b1.unit02.lesson02.teach.managed_to_finish: {title: "erin slagen iets te doen", gloss: "Ik slaagde erin het formulier in tien minuten af te maken.", note: "*managed to* benadrukt dat het lukte, vaak ondanks moeite."}
  en.b1.unit02.lesson02.teach.grammar_present_past: {title: "tegenwoordige en verleden tijd van 'be able to'", gloss: "Ik kan het verlengen. Ik kon het verlengen. Ik zou je kunnen helpen.", note: "*am able to* (nu), *was able to* (verleden), *would be able to* (hypothetisch/toekomstig aanbod) -- allemaal dezelfde constructie, andere tijd."}

  en.b1.unit02.lesson03.teach.friend: {title: "friend", gloss: "vriend(in)", note: "*friend* betekent een vriend of vriendin.", example_gloss: "Mijn vriendin verlengde vorige week haar rijbewijs."}
  en.b1.unit02.lesson03.teach.system: {title: "system", gloss: "systeem", note: "*system* betekent een georganiseerde manier om iets te doen.", example_gloss: "Het nieuwe systeem is veel sneller."}
  en.b1.unit02.lesson03.teach.reading_passage: {title: "leestekst: het nieuwe systeem", gloss: "Vorig jaar konden mensen hun rijbewijs niet online verlengen. Iedereen moest persoonlijk naar het kantoor. Dit jaar is het systeem veranderd. Nu kunnen mensen alles vanuit huis verlengen. Mijn vriendin Mia slaagde erin het hare in tien minuten af te maken.", note: "een korte leestekst over hoe het nieuwe systeem het verlengen makkelijker maakt -- B1-niveau."}

  en.b1.unit02.lesson04.teach.q_were_you_able: {title: "Leila vraagt naar het rijbewijs", gloss: "Leila zegt: kon je je rijbewijs online verlengen?", note: "*were you able to* vraagt naar een mogelijkheid in het verleden."}
  en.b1.unit02.lesson04.teach.a_wasnt_able_office: {title: "Daniels antwoord: het lukte niet online", gloss: "Daniel zegt: nee, dat lukte niet. Ik moest persoonlijk naar het kantoor.", note: "*wasn't able to* is de gesproken samentrekking van *was not able to*."}
  en.b1.unit02.lesson04.teach.q_really_managed: {title: "Leila vertelt over haar eigen ervaring", gloss: "Leila zegt: echt? Het lukte mij om het online in tien minuten te doen.", note: "*managed to* benadrukt dat het Leila lukte, snel en zonder problemen."}
  en.b1.unit02.lesson04.teach.a_next_time_save: {title: "Daniel denkt vooruit", gloss: "Daniel zegt: de volgende keer zou ik tijd kunnen besparen als ik het ook online zou doen.", note: "*would be able to* drukt hier een hypothetische mogelijkheid in de toekomst uit."}
  en.b1.unit02.lesson04.teach.q_would_help: {title: "Leila biedt hulp aan", gloss: "Leila zegt: ik zou je de volgende keer kunnen helpen, als je wilt.", note: "*would be able to* wordt hier gebruikt voor een beleefd aanbod."}
  en.b1.unit02.lesson04.teach.a_thanks: {title: "Daniel bedankt Leila", gloss: "Daniel zegt: bedankt, dat zou ik fijn vinden.", note: "*I'd like that* is een natuurlijke manier om een aanbod dankbaar te accepteren."}

exercises:
  en.b1.unit02.lesson01.exercise01.listen_word:
    instruction: "Luister en kies het woord dat gezegd wordt."
    correct_option: "license"
    distractors: ["renew", "online", "in person"]
    accepted_answers: [{value: "license", status: "correct"}]
    feedback: "*license* betekent rijbewijs."
  en.b1.unit02.lesson01.exercise02.choose_get_new_document_word:
    instruction: "Welk woord betekent een document laten verlengen voordat het verloopt?"
    correct_option: "renew"
    distractors: ["manage to", "license", "online"]
    accepted_answers: [{value: "renew", status: "correct"}]
    feedback: "*renew* betekent verlengen."
  en.b1.unit02.lesson01.exercise03.choose_by_going_yourself_phrase:
    instruction: "Welke uitdrukking betekent door er zelf naartoe te gaan, niet online?"
    correct_option: "in person"
    distractors: ["be able to", "renew", "online"]
    accepted_answers: [{value: "in person", status: "correct"}]
    feedback: "*in person* betekent persoonlijk, door er zelf naartoe te gaan."
  en.b1.unit02.lesson01.exercise04.match_ability_words:
    instruction: "Verbind elke betekenis met het juiste Engelse woord of de juiste uitdrukking."
    accepted_answers:
      - value:
          - {left: "to have the ability or opportunity to do something", right: "be able to"}
          - {left: "to succeed in doing something, often with some difficulty", right: "manage to"}
          - {left: "to get a document extended before it expires", right: "renew"}
          - {left: "an official document that lets you drive", right: "license"}
          - {left: "using the internet, not in a physical place", right: "online"}
          - {left: "by going somewhere yourself", right: "in person"}
        status: "correct"
    feedback: "*be able to*=kunnen, *manage to*=erin slagen om, *renew*=verlengen, *license*=rijbewijs, *online*=online, *in person*=persoonlijk."
  en.b1.unit02.lesson01.exercise05.write_renew:
    instruction: "Schrijf het woord voor een document laten verlengen voordat het verloopt."
    accepted_answers:
      - {value: "renew", status: "correct"}
      - {value: "Renew", status: "correct"}
    feedback: "*renew* betekent verlengen."

  en.b1.unit02.lesson02.exercise01.choose_present_ability:
    instruction: "Welke zin zegt dat je NU je rijbewijs online kunt verlengen, in het heden?"
    correct_option: "I am able to renew my license online now."
    distractors: ["Last year, I was not able to do it online.", "I managed to finish the form in ten minutes.", "I would be able to help you."]
    accepted_answers: [{value: "I am able to renew my license online now.", status: "correct"}]
    feedback: "*I am able to* drukt een huidige mogelijkheid uit."
  en.b1.unit02.lesson02.exercise02.choose_past_ability:
    instruction: "Welke zin gaat over vorig jaar, in het verleden?"
    correct_option: "Last year, I was not able to do it online."
    distractors: ["I am able to renew my license online now.", "I managed to finish the form in ten minutes.", "I would be able to help you."]
    accepted_answers: [{value: "Last year, I was not able to do it online.", status: "correct"}]
    feedback: "*was not able to* drukt een mogelijkheid in het verleden uit die er toen niet was."
  en.b1.unit02.lesson02.exercise03.order_managed_to_finish:
    instruction: "Zet de woorden in de juiste volgorde voor «het lukte mij om het formulier in tien minuten af te maken»."
    accepted_answers: [{value: ["I", "managed", "to", "finish", "the", "form", "in", "ten", "minutes"], status: "correct"}]
    feedback: "de juiste volgorde is *I managed to finish the form in ten minutes*."
  en.b1.unit02.lesson02.exercise04.reply_were_you_able_to_renew:
    instruction: "Iemand vraagt: kun je je rijbewijs nu online verlengen? Bevestig dat je dat nu kunt."
    accepted_answers:
      - {value: "I am able to renew my license online now.", status: "correct"}
      - {value: "I am able to renew my license online now", status: "correct"}
      - {value: "I'm able to renew my license online now.", status: "correct"}
      - {value: "I'm able to renew my license online now", status: "correct"}
    feedback: "*I am able to renew my license online now* betekent dat je dat nu kunt -- *I'm* is de gesproken samentrekking van *I am*."
  en.b1.unit02.lesson02.exercise05.write_managed_to_finish:
    instruction: "Schrijf dat het je lukte het formulier in tien minuten af te maken."
    accepted_answers:
      - {value: "I managed to finish the form in ten minutes.", status: "correct"}
      - {value: "I managed to finish the form in ten minutes", status: "correct"}
    feedback: "*I managed to finish the form in ten minutes* betekent dat het je lukte om het snel af te maken."

  en.b1.unit02.lesson03.exercise01.comprehend_last_year:
    instruction: "Wat moest iedereen vorig jaar doen om hun rijbewijs te verlengen?"
    correct_option: "go to the office in person"
    distractors: ["call the office by phone", "mail a form to the office", "ask a friend for help"]
    accepted_answers: [{value: "go to the office in person", status: "correct"}]
    feedback: "de tekst zegt *go to the office in person*."
  en.b1.unit02.lesson03.exercise02.comprehend_mia_time:
    instruction: "Hoelang duurde het voor Mia om het hare af te maken?"
    correct_option: "ten minutes"
    distractors: ["ten seconds", "one hour", "one week"]
    accepted_answers: [{value: "ten minutes", status: "correct"}]
    feedback: "de tekst zegt *ten minutes*."
  en.b1.unit02.lesson03.exercise03.recognize_system:
    instruction: "Welk woord betekent een georganiseerde manier om iets te doen?"
    correct_option: "system"
    distractors: ["friend", "license", "renew"]
    accepted_answers: [{value: "system", status: "correct"}]
    feedback: "*system* betekent systeem."
  en.b1.unit02.lesson03.exercise04.order_mia_was_able_to_finish:
    instruction: "Zet de woorden in de juiste volgorde voor «het lukte Mia om het hare in tien minuten af te maken»."
    accepted_answers: [{value: ["Mia", "was", "able", "to", "finish", "hers", "in", "ten", "minutes"], status: "correct"}]
    feedback: "de juiste volgorde is *Mia was able to finish hers in ten minutes*."
  en.b1.unit02.lesson03.exercise05.write_friend_renewed:
    instruction: "Schrijf dat je vriend(in) het online kon afmaken."
    accepted_answers:
      - {value: "My friend was able to finish it online.", status: "correct"}
      - {value: "My friend was able to finish it online", status: "correct"}
    feedback: "*My friend was able to finish it online* betekent dat het je vriend(in) online lukte."

  en.b1.unit02.lesson04.exercise01.listen_daniel_couldnt_online:
    instruction: "Luister naar het gesprek en kies wat Daniel moest doen omdat het online niet lukte."
    correct_option: "go to the office in person"
    distractors: ["call the office by phone", "wait until next year", "ask Leila to do it for him"]
    accepted_answers: [{value: "go to the office in person", status: "correct"}]
    feedback: "Daniel zegt *I had to go to the office in person*."
  en.b1.unit02.lesson04.exercise02.listen_leilas_time:
    instruction: "Luister en kies hoelang het Leila kostte om het online te doen."
    correct_option: "ten minutes"
    distractors: ["ten seconds", "one hour", "one week"]
    accepted_answers: [{value: "ten minutes", status: "correct"}]
    feedback: "Leila zegt *ten minutes*."
  en.b1.unit02.lesson04.exercise03.choose_leilas_offer:
    instruction: "Wat biedt Leila aan om de volgende keer te doen?"
    correct_option: "I would be able to help you next time, if you want."
    distractors: ["I would be able to renew it for you.", "I would be able to call the office for you.", "I would be able to finish your form today."]
    accepted_answers: [{value: "I would be able to help you next time, if you want.", status: "correct"}]
    feedback: "Leila zegt *I would be able to help you next time, if you want*."
  en.b1.unit02.lesson04.exercise04.order_i_wasnt_able_to:
    instruction: "Zet de woorden in de juiste volgorde voor «het lukte me niet om het online te doen»."
    accepted_answers: [{value: ["I", "wasn't", "able", "to", "do", "it", "online"], status: "correct"}]
    feedback: "de juiste volgorde is *I wasn't able to do it online*."
  en.b1.unit02.lesson04.exercise05.reply_as_daniel:
    instruction: "Leila vraagt: kon je je rijbewijs online verlengen? Geef Daniels antwoord: zeg dat het niet lukte en dat je persoonlijk naar het kantoor moest."
    accepted_answers:
      - {value: "No, I wasn't able to. I had to go to the office in person.", status: "correct"}
      - {value: "No, I was not able to. I had to go to the office in person.", status: "correct"}
    feedback: "*wasn't able to* is de gesproken samentrekking van *was not able to*."
  en.b1.unit02.lesson04.exercise06.speak_ability_dialogue:
    instruction: "Leila zegt: echt? Het lukte mij om het online in tien minuten te doen. Antwoord hardop als Daniel: zeg dat je de volgende keer tijd zou kunnen besparen als je het ook online zou doen."
    accepted_answers:
      - {value: "Next time, I would be able to save time if I did it online too.", status: "correct"}
    feedback: "dit antwoord gebruikt *would be able to* voor een hypothetische mogelijkheid in de toekomst."
