course:
  title: "Engels B1"
  description: >-
    Engels leren op B1-niveau voor alledaagse gesprekken over verplichtingen,
    mogelijkheden, hypothetische situaties en verhalen, met gedetailleerde
    uitleg in het Nederlands.

units:
  en.b1.unit08.sequencing: {title: "Before, after en as soon as"}

lessons:
  en.b1.unit08.lesson01.sequencing_vocabulary: {title: "Before, after en by the time"}
  en.b1.unit08.lesson02.present_and_future_sequences: {title: "When I get home, I will call"}
  en.b1.unit08.lesson03.reading_an_evening_routine: {title: "Lezen: het avondplan"}
  en.b1.unit08.lesson04.the_evening_plan_dialogue: {title: "As soon as I get home"}

teaching:
  en.b1.unit08.lesson01.teach.before: {title: "before", gloss: "voor(dat)", note: "*before* betekent eerder dan een andere gebeurtenis.", example_gloss: "Was je handen voordat je kookt."}
  en.b1.unit08.lesson01.teach.after: {title: "after", gloss: "na(dat)", note: "*after* betekent later dan een andere gebeurtenis.", example_gloss: "Bel me nadat je klaar bent met werken."}
  en.b1.unit08.lesson01.teach.as_soon_as: {title: "as soon as", gloss: "zodra", note: "*as soon as* betekent meteen wanneer iets gebeurt.", example_gloss: "Zodra ik aankom, stuur ik je een bericht."}
  en.b1.unit08.lesson01.teach.by_the_time: {title: "by the time", gloss: "tegen de tijd dat", note: "*by the time* betekent niet later dan het moment waarop iets gebeurt.", example_gloss: "Tegen de tijd dat Mia aankomt, is het eten klaar."}
  en.b1.unit08.lesson01.teach.check_in: {title: "check in", gloss: "laten weten dat je aangekomen of veilig bent", note: "*check in* betekent iemand kort laten weten dat je er bent of veilig bent.", example_gloss: "Laat even iets weten wanneer je het hotel bereikt."}
  en.b1.unit08.lesson01.teach.lock_up: {title: "lock up", gloss: "afsluiten", note: "*lock up* betekent een kamer of gebouw sluiten en beveiligen.", example_gloss: "Ik sluit af voordat ik het kantoor verlaat."}

  en.b1.unit08.lesson02.teach.as_soon_as_home: {title: "een onmiddellijke volgorde", gloss: "Zodra ik thuis ben, bel ik je.", note: "*as soon as* laat zien dat de tweede actie meteen na de eerste gebeurt."}
  en.b1.unit08.lesson02.teach.before_upstairs: {title: "eerst iets doen", gloss: "Controleer alsjeblieft de post voordat je naar boven gaat.", note: "*before* geeft aan welke actie eerst moet gebeuren."}
  en.b1.unit08.lesson02.teach.grammar_future_time_clause: {title: "tegenwoordige tijd in toekomstige tijdszinnen", gloss: "Als ik thuis ben, bel ik je.", note: "in Engelse tijdszinnen gebruik je de tegenwoordige tijd voor de toekomstige gebeurtenis: *when I get home*, niet *when I will get home*."}

  en.b1.unit08.lesson03.teach.front_door: {title: "front door", gloss: "voordeur", note: "*front door* betekent de hoofddeur aan de voorkant van een huis of gebouw.", example_gloss: "Daniel doet de voordeur op slot nadat hij de post controleert."}
  en.b1.unit08.lesson03.teach.ready: {title: "ready", gloss: "klaar", note: "*ready* betekent voorbereid of beschikbaar om te gebruiken.", example_gloss: "Tegen de tijd dat Mia aankomt, is het eten klaar."}
  en.b1.unit08.lesson03.teach.reading_passage: {title: "leestekst: het avondplan", gloss: "Daniel heeft een zorgvuldige avondroutine. Wanneer hij thuiskomt, controleert hij eerst de post. Nadat hij de post controleert, doet hij de voordeur op slot. Voordat hij met het eten begint, wast hij zijn handen en ruimt hij de tafel af. Tegen de tijd dat Mia aankomt, is de keuken klaar en is het eten warm.", note: "een korte leestekst met *when*, *after*, *before* en *by the time* -- B1-niveau."}

  en.b1.unit08.lesson04.teach.q_call_when_home: {title: "Leila vraagt om een telefoontje", gloss: "Leila zegt: Daniel, kun je me bellen wanneer je thuiskomt?", note: "een vraag met *when* om het moment van de actie aan te geven."}
  en.b1.unit08.lesson04.teach.a_as_soon_as_home: {title: "Daniel belooft meteen te bellen", gloss: "Daniel zegt: natuurlijk. Zodra ik thuis ben, bel ik je.", note: "*as soon as* maakt duidelijk dat hij meteen belt."}
  en.b1.unit08.lesson04.teach.q_check_mail: {title: "Leila geeft een eerste taak", gloss: "Leila zegt: controleer alsjeblieft de post voordat je naar boven gaat.", note: "*before* geeft aan dat de post eerst komt."}
  en.b1.unit08.lesson04.teach.a_after_mail_lock: {title: "Daniel noemt de volgende stap", gloss: "Daniel zegt: doe ik. Nadat ik de post controleer, doe ik de voordeur op slot.", note: "*after* geeft de volgorde tussen twee acties aan."}
  en.b1.unit08.lesson04.teach.q_by_the_time_mia: {title: "Leila noemt de deadline", gloss: "Leila zegt: mooi. Tegen de tijd dat Mia aankomt, moet alles klaar zijn.", note: "*by the time* betekent dat alles klaar moet zijn vóór of op dat moment."}
  en.b1.unit08.lesson04.teach.a_start_dinner: {title: "Daniel sluit het plan af", gloss: "Daniel zegt: dan kunnen we beginnen met eten wanneer ze hier is.", note: "*when she gets here* geeft het moment aan waarop ze kunnen beginnen."}

exercises:
  en.b1.unit08.lesson01.exercise01.listen_word:
    instruction: "Luister en kies de uitdrukking die gezegd wordt."
    correct_option: "as soon as"
    distractors: ["before", "after", "by the time"]
    accepted_answers: [{value: "as soon as", status: "correct"}]
    feedback: "*as soon as* betekent zodra."
  en.b1.unit08.lesson01.exercise02.choose_before_word:
    instruction: "Welk woord betekent eerder dan een andere gebeurtenis?"
    correct_option: "before"
    distractors: ["after", "as soon as", "by the time"]
    accepted_answers: [{value: "before", status: "correct"}]
    feedback: "*before* betekent voordat."
  en.b1.unit08.lesson01.exercise03.choose_lock_up_phrase:
    instruction: "Welke uitdrukking betekent een kamer of gebouw sluiten en beveiligen?"
    correct_option: "lock up"
    distractors: ["check in", "before", "after"]
    accepted_answers: [{value: "lock up", status: "correct"}]
    feedback: "*lock up* betekent afsluiten."
  en.b1.unit08.lesson01.exercise04.match_sequencing_words:
    instruction: "Verbind elke betekenis met het juiste Engelse woord of de juiste uitdrukking."
    accepted_answers:
      - value:
          - {left: "earlier than another event", right: "before"}
          - {left: "later than another event", right: "after"}
          - {left: "immediately when something happens", right: "as soon as"}
          - {left: "not later than the moment when something happens", right: "by the time"}
          - {left: "to tell someone you have arrived or are safe", right: "check in"}
          - {left: "to close and secure a room or building", right: "lock up"}
        status: "correct"
    feedback: "*before*=voordat, *after*=nadat, *as soon as*=zodra, *by the time*=tegen de tijd dat, *check in*=laten weten dat je veilig bent, *lock up*=afsluiten."
  en.b1.unit08.lesson01.exercise05.write_after:
    instruction: "Schrijf het woord dat later dan een andere gebeurtenis betekent."
    accepted_answers:
      - {value: "after", status: "correct"}
      - {value: "After", status: "correct"}
    feedback: "*after* betekent nadat."

  en.b1.unit08.lesson02.exercise01.choose_as_soon_as:
    instruction: "Welke zin zegt dat één actie meteen na een andere gebeurt?"
    correct_option: "As soon as I get home, I will call you."
    distractors: ["Before you go upstairs, please check the mail.", "I lock up before I leave the office.", "By the time Mia arrives, dinner will be ready."]
    accepted_answers: [{value: "As soon as I get home, I will call you.", status: "correct"}]
    feedback: "*As soon as I get home* betekent zodra ik thuis ben."
  en.b1.unit08.lesson02.exercise02.choose_before_sentence:
    instruction: "Welke zin vraagt iemand om eerst één ding te doen?"
    correct_option: "Before you go upstairs, please check the mail."
    distractors: ["As soon as I get home, I will call you.", "After I check the mail, I will lock the front door.", "By the time Mia arrives, dinner will be ready."]
    accepted_answers: [{value: "Before you go upstairs, please check the mail.", status: "correct"}]
    feedback: "*before you go upstairs* geeft aan dat de post eerst komt."
  en.b1.unit08.lesson02.exercise03.order_as_soon_as_home:
    instruction: "Zet de woorden in de juiste volgorde voor «zodra ik thuis ben, bel ik je»."
    accepted_answers: [{value: ["As", "soon", "as", "I", "get", "home", "I", "will", "call", "you"], status: "correct"}]
    feedback: "de juiste volgorde is *As soon as I get home, I will call you*."
  en.b1.unit08.lesson02.exercise04.reply_when_home:
    instruction: "Iemand vraagt of je kunt bellen wanneer je thuis bent. Zeg dat je belt zodra je thuis bent."
    accepted_answers:
      - {value: "As soon as I get home, I will call you.", status: "correct"}
      - {value: "As soon as I get home, I will call you", status: "correct"}
      - {value: "As soon as I get home, I'll call you.", status: "correct"}
      - {value: "As soon as I get home, I'll call you", status: "correct"}
    feedback: "*I'll* is de gesproken samentrekking van *I will*."
  en.b1.unit08.lesson02.exercise05.write_before_upstairs:
    instruction: "Schrijf dat iemand de post moet controleren voordat hij of zij naar boven gaat."
    accepted_answers:
      - {value: "Before you go upstairs, please check the mail.", status: "correct"}
      - {value: "Before you go upstairs, please check the mail", status: "correct"}
    feedback: "*Before you go upstairs* betekent voordat je naar boven gaat."

  en.b1.unit08.lesson03.exercise01.comprehend_first_action:
    instruction: "Wat doet Daniel wanneer hij thuiskomt?"
    correct_option: "he checks the mail first"
    distractors: ["he starts dinner first", "he calls Mia first", "he goes upstairs first"]
    accepted_answers: [{value: "he checks the mail first", status: "correct"}]
    feedback: "de tekst zegt *he checks the mail first*."
  en.b1.unit08.lesson03.exercise02.comprehend_after_mail:
    instruction: "Wat doet Daniel nadat hij de post controleert?"
    correct_option: "he locks the front door"
    distractors: ["he washes his hands", "he clears the table", "he starts dinner"]
    accepted_answers: [{value: "he locks the front door", status: "correct"}]
    feedback: "de tekst zegt *he locks the front door*."
  en.b1.unit08.lesson03.exercise03.recognize_ready:
    instruction: "Welk woord betekent voorbereid of beschikbaar om te gebruiken?"
    correct_option: "ready"
    distractors: ["front door", "check in", "lock up"]
    accepted_answers: [{value: "ready", status: "correct"}]
    feedback: "*ready* betekent klaar."
  en.b1.unit08.lesson03.exercise04.order_after_mail_lock_door:
    instruction: "Zet de woorden in de juiste volgorde voor «nadat hij de post controleert, doet hij de voordeur op slot»."
    accepted_answers: [{value: ["After", "he", "checks", "the", "mail", "he", "locks", "the", "front", "door"], status: "correct"}]
    feedback: "de juiste volgorde is *After he checks the mail, he locks the front door*."
  en.b1.unit08.lesson03.exercise05.write_by_the_time:
    instruction: "Schrijf dat tegen de tijd dat Mia aankomt, de keuken klaar is."
    accepted_answers:
      - {value: "By the time Mia arrives, the kitchen is ready.", status: "correct"}
      - {value: "By the time Mia arrives, the kitchen is ready", status: "correct"}
    feedback: "*By the time Mia arrives* betekent tegen de tijd dat Mia aankomt."

  en.b1.unit08.lesson04.exercise01.listen_when_daniel_will_call:
    instruction: "Luister naar het gesprek en kies wanneer Daniel gaat bellen."
    correct_option: "As soon as I get home"
    distractors: ["After dinner is ready", "Before Mia arrives", "When the mail comes"]
    accepted_answers: [{value: "As soon as I get home", status: "correct"}]
    feedback: "Daniel zegt *As soon as I get home*."
  en.b1.unit08.lesson04.exercise02.listen_before_upstairs:
    instruction: "Luister en kies wat Leila wil dat Daniel doet voordat hij naar boven gaat."
    correct_option: "check the mail"
    distractors: ["wash the dishes", "open the window", "call the neighbor"]
    accepted_answers: [{value: "check the mail", status: "correct"}]
    feedback: "Leila zegt *check the mail before you go upstairs*."
  en.b1.unit08.lesson04.exercise03.choose_after_mail:
    instruction: "Wat doet Daniel nadat hij de post controleert?"
    correct_option: "I will lock the front door"
    distractors: ["I will start dinner", "I will call Mia", "I will go upstairs"]
    accepted_answers: [{value: "I will lock the front door", status: "correct"}]
    feedback: "Daniel zegt *After I check the mail, I will lock the front door*."
  en.b1.unit08.lesson04.exercise04.order_when_she_gets_here:
    instruction: "Zet de woorden in de juiste volgorde voor «we kunnen beginnen met eten wanneer ze hier is»."
    accepted_answers: [{value: ["We", "can", "start", "dinner", "when", "she", "gets", "here"], status: "correct"}]
    feedback: "de juiste volgorde is *We can start dinner when she gets here*."
  en.b1.unit08.lesson04.exercise05.reply_as_daniel:
    instruction: "Leila vraagt: Daniel, kun je me bellen wanneer je thuiskomt? Geef Daniels antwoord: zeg dat je haar belt zodra je thuis bent."
    accepted_answers:
      - {value: "Sure. As soon as I get home, I will call you.", status: "correct"}
