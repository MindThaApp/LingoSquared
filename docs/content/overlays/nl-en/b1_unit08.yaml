      - {value: "As soon as I get home, I will call you.", status: "correct"}
      - {value: "As soon as I get home, I will call you", status: "correct"}
      - {value: "As soon as I get home, I'll call you.", status: "correct"}
      - {value: "As soon as I get home, I'll call you", status: "correct"}
    feedback: "*As soon as I get home* geeft aan dat Daniel meteen belt."
  en.b1.unit08.lesson04.exercise06.speak_sequencing_dialogue:
    instruction: "Leila zegt: controleer alsjeblieft de post voordat je naar boven gaat. Antwoord hardop als Daniel: zeg dat je dat doet, en dat je nadat je de post controleert de voordeur op slot doet."
    accepted_answers:
      - {value: "I will. After I check the mail, I will lock the front door.", status: "correct"}
      - {value: "I will. After I check the mail, I'll lock the front door.", status: "correct"}
