course:
  title: "Engels B2"
  description: >-
    Engels leren op B2-niveau voor genuanceerde gesprekken, argumenten,
    speculatie en professionele discussie, met uitleg in informeel Nederlands.

units:
  en.b2.unit07.negotiation: {title: "On condition that the scope is reduced"}

lessons:
  en.b2.unit07.lesson01_terms_and_concessions: {title: "Terms, refusals en concessions"}
  en.b2.unit07.lesson02_conditional_terms: {title: "I can agree on condition that..."}
  en.b2.unit07.lesson03.reading_revised_terms: {title: "Lezen: wat is afgesproken?"}
  en.b2.unit07.lesson04.the_negotiation_dialogue: {title: "Agreed, with a condition"}

teaching:
  en.b2.unit07.lesson01.teach.term: {title: "term", gloss: "voorwaarde, onderdeel van een afspraak", note: "*term* is een onderdeel van een afspraak. Het is hier niet een schooltermijn.", example_gloss: "Een term is een onderdeel van een overeenkomst."}
  en.b2.unit07.lesson01.teach.proposal: {title: "proposal", gloss: "voorstel", note: "*proposal* is een voorstel voor mogelijke voorwaarden.", example_gloss: "Een voorstel suggereert mogelijke voorwaarden."}
  en.b2.unit07.lesson01.teach.refusal: {title: "refusal", gloss: "weigering, afwijzing", note: "*refusal* zegt dat een voorwaarde niet acceptabel is. In Engels klinkt een duidelijke weigering vaak beter met reden erbij.", example_gloss: "Een weigering zegt dat een voorwaarde niet acceptabel is."}
  en.b2.unit07.lesson01.teach.concession: {title: "concession", gloss: "toegeving", note: "*concession* betekent dat je een deel van je positie opgeeft om akkoord mogelijk te maken.", example_gloss: "Een toegeving geeft een deel van een positie op."}
  en.b2.unit07.lesson01.teach.scope: {title: "scope", gloss: "omvang van het werk", note: "*scope* is hoeveel werk inbegrepen is. In onderhandelingen kun je deadline en scope tegen elkaar afwegen.", example_gloss: "De scope is de hoeveelheid werk die inbegrepen is."}
  en.b2.unit07.lesson01.teach.condition: {title: "condition", gloss: "voorwaarde", note: "*condition* is iets dat moet gelden voordat een afspraak werkt.", example_gloss: "Een voorwaarde moet worden gehaald voordat de afspraak werkt."}

  en.b2.unit07.lesson02.teach.condition_deadline: {title: "voorwaardelijke toegeving", gloss: "Ik kan akkoord gaan met de eerdere deadline op voorwaarde dat de scope wordt verminderd.", note: "*I can agree... on condition that...* is duidelijk maar professioneel. Het verzacht niet door vaag te worden."}
  en.b2.unit07.lesson02.teach.cannot_agree: {title: "duidelijk afwijzen", gloss: "Ik kan niet akkoord gaan met dinsdag als deadline bij de volledige scope.", note: "*I cannot agree to...* klinkt zakelijker dan een botte letterlijke Nederlandse afwijzing zoals *No, that is impossible*."}
  en.b2.unit07.lesson02.teach.accept_if: {title: "accepteren met if", gloss: "Ik kan dat accepteren als de volledige appendix volgende week volgt.", note: "*I can accept that if...* maakt de voorwaarde expliciet."}
  en.b2.unit07.lesson02.teach.grammar_concession: {title: "weigeren en toch onderhandelen", gloss: "Gebruik I cannot agree om duidelijk terug te duwen. Gebruik I can agree on condition that om een voorwaardelijke toegeving te bieden.", note: "Nederlandse directheid kan in Engels hard klinken. Geef de grens, de reden en de voorwaarde."}

  en.b2.unit07.lesson03.teach.executive_summary: {title: "executive summary", gloss: "managementsamenvatting", note: "*executive summary* is de korte samenvatting met de hoofdpunten van een rapport.", example_gloss: "Een managementsamenvatting geeft de hoofdpunten van een rapport."}
  en.b2.unit07.lesson03.teach.charts: {title: "charts", gloss: "grafieken, diagrammen", note: "*charts* tonen informatie visueel.", example_gloss: "Grafieken tonen informatie visueel."}
  en.b2.unit07.lesson03.teach.reading_passage: {title: "leestekst: herziene voorwaarden", gloss: "Priya stelde eerst donderdag voor voor het volledige rapport. Marcus gaf tegengas omdat de klant iets eerder nodig had. Priya weigerde dinsdag met de volledige scope omdat dat de kwaliteit in gevaar zou brengen. Daarna bood ze een voorwaardelijke toegeving: dinsdag was mogelijk als de scope werd verminderd tot de managementsamenvatting en de grafieken. Marcus accepteerde die voorwaarde, maar voegde een onderdeel toe: de volledige appendix moest volgende week volgen. De afgesproken uitkomst was dinsdag voor de samenvatting en grafieken, en volgende week voor de appendix.", note: "De onderhandeling is stevig maar professioneel: weigering, reden, voorwaarde en akkoord."}

  en.b2.unit07.lesson04.teach.q_thursday: {title: "Priya doet een voorstel", gloss: "Priya zegt: we kunnen het rapport donderdag leveren als de scope blijft zoals gepland.", note: "Ze koppelt de deadline meteen aan de scope."}
  en.b2.unit07.lesson04.teach.a_tuesday: {title: "Marcus geeft tegengas", gloss: "Marcus zegt: donderdag is te laat voor de klant. Kun je het dinsdag leveren?", note: "Hij vraagt om een eerdere deadline zonder meteen de scope te veranderen."}
  en.b2.unit07.lesson04.teach.q_cannot_tuesday: {title: "Priya weigert met reden", gloss: "Priya zegt: ik kan niet akkoord gaan met dinsdag als deadline bij de volledige scope. Dat zou de kwaliteit in gevaar brengen.", note: "De reden maakt de weigering professioneel en minder bot."}
  en.b2.unit07.lesson04.teach.a_what_possible: {title: "Marcus vraagt naar voorwaarden", gloss: "Marcus zegt: wat zou dinsdag mogelijk maken?", note: "Deze vraag opent de deur naar een voorwaardelijke toegeving."}
  en.b2.unit07.lesson04.teach.q_condition: {title: "Priya biedt een voorwaarde", gloss: "Priya zegt: ik kan akkoord gaan met de eerdere deadline op voorwaarde dat de scope wordt verminderd tot de managementsamenvatting en de grafieken.", note: "*on condition that* is expliciet en professioneel."}
  en.b2.unit07.lesson04.teach.a_accept_appendix: {title: "Marcus accepteert met extra term", gloss: "Marcus zegt: ik kan dat accepteren als de volledige appendix volgende week volgt.", note: "Hij accepteert, maar legt de resterende deliverable vast."}
  en.b2.unit07.lesson04.teach.q_agreed: {title: "Priya sluit het akkoord", gloss: "Priya zegt: afgesproken. Dinsdag voor de samenvatting en grafieken, en volgende week voor de appendix.", note: "*Agreed* rondt de onderhandeling kort en duidelijk af."}

exercises:
  en.b2.unit07.lesson01.exercise01_choose_concession:
    instruction: "Welk woord betekent dat je een deel van je positie opgeeft in een onderhandeling?"
    correct_option: "concession"
    distractors: ["refusal", "scope", "term"]
    accepted_answers: [{value: "concession", status: "correct"}]
    feedback: "*concession* betekent toegeving."
  en.b2.unit07.lesson01.exercise02_choose_scope:
    instruction: "Welk woord betekent de hoeveelheid werk die inbegrepen is?"
    correct_option: "scope"
    distractors: ["proposal", "condition", "refusal"]
    accepted_answers: [{value: "scope", status: "correct"}]
    feedback: "*scope* betekent omvang van het werk."
  en.b2.unit07.lesson01.exercise03_match_terms:
    instruction: "Verbind elk Engels woord of elke Engelse uitdrukking met de juiste Nederlandse omschrijving."
    pairs:
      - {left: "term", right: "voorwaarde, onderdeel van een afspraak"}
      - {left: "proposal", right: "voorstel"}
      - {left: "refusal", right: "weigering, afwijzing"}
      - {left: "concession", right: "toegeving"}
      - {left: "scope", right: "omvang van het werk"}
      - {left: "condition", right: "voorwaarde"}
    accepted_answers:
      - value:
          - {left: "term", right: "voorwaarde, onderdeel van een afspraak"}
          - {left: "proposal", right: "voorstel"}
          - {left: "refusal", right: "weigering, afwijzing"}
          - {left: "concession", right: "toegeving"}
          - {left: "scope", right: "omvang van het werk"}
          - {left: "condition", right: "voorwaarde"}
        status: "correct"
    feedback: "De links zijn duidelijk verschillend: afspraakdeel, voorstel, weigering, toegeving, scope en voorwaarde."
  en.b2.unit07.lesson01.exercise04_write_refusal:
    instruction: "Schrijf het Engelse woord dat betekent: zeggen dat een voorwaarde niet acceptabel is."
    accepted_answers:
      - {value: "refusal", status: "correct"}
      - {value: "Refusal", status: "correct"}
    feedback: "*refusal* betekent weigering of afwijzing."
  en.b2.unit07.lesson01.exercise05_write_proposal:
    instruction: "Schrijf het Engelse woord dat betekent: voorgestelde voorwaarden."
    accepted_answers:
      - {value: "proposal", status: "correct"}
      - {value: "Proposal", status: "correct"}
    feedback: "*proposal* betekent voorstel."

  en.b2.unit07.lesson02.exercise01_choose_refusal:
    instruction: "Welke zin weigert een onacceptabele voorwaarde duidelijk?"
    correct_option: "I cannot agree to Tuesday with the full scope."
    distractors: ["I can agree to the earlier deadline on condition that the scope is reduced.", "I can accept that if the full appendix follows next week.", "Tuesday is possible if the scope is reduced."]
    accepted_answers: [{value: "I cannot agree to Tuesday with the full scope.", status: "correct"}]
    feedback: "*I cannot agree to...* is de duidelijke weigering."
  en.b2.unit07.lesson02.exercise02_choose_condition:
    instruction: "Welke zin biedt een voorwaardelijke toegeving?"
    correct_option: "I can agree to the earlier deadline on condition that the scope is reduced."
    distractors: ["I cannot agree to Tuesday with the full scope.", "That would risk the quality.", "Thursday is too late for the client."]
    accepted_answers: [{value: "I can agree to the earlier deadline on condition that the scope is reduced.", status: "correct"}]
    feedback: "*on condition that* maakt de toegeving afhankelijk van een voorwaarde."
  en.b2.unit07.lesson02.exercise03_order_condition:
    instruction: "Zet de woorden in de juiste volgorde voor de voorwaardelijke toegeving."
    accepted_answers: [{value: ["I", "can", "agree", "to", "the", "earlier", "deadline", "on", "condition", "that", "the", "scope", "is", "reduced"], status: "correct"}]
    feedback: "De juiste vorm is *I can agree to the earlier deadline on condition that the scope is reduced*."
  en.b2.unit07.lesson02.exercise04_reply_refusal:
    instruction: "Weiger: zeg dat je niet akkoord kunt gaan met dinsdag bij de volledige scope."
    accepted_answers:
      - {value: "I cannot agree to Tuesday with the full scope.", status: "correct"}
      - {value: "I cannot agree to Tuesday with the full scope", status: "correct"}
      - {value: "I can't agree to Tuesday with the full scope.", status: "correct"}
      - {value: "I can't agree to Tuesday with the full scope", status: "correct"}
    feedback: "*cannot* of *can't* kan allebei; voeg in echte onderhandelingen vaak ook de reden toe."
  en.b2.unit07.lesson02.exercise05_write_conditional:
    instruction: "Doe een voorwaardelijke toegeving: je kunt akkoord gaan met de eerdere deadline, op voorwaarde dat de scope wordt verminderd."
    accepted_answers:
      - {value: "I can agree to the earlier deadline on condition that the scope is reduced.", status: "correct"}
      - {value: "I can agree to the earlier deadline on condition that the scope is reduced", status: "correct"}
      - {value: "I can agree to the earlier deadline provided that the scope is reduced.", status: "correct"}
      - {value: "I can agree to the earlier deadline as long as the scope is reduced.", status: "correct"}
      - {value: "I can agree to the earlier deadline if the scope is reduced.", status: "correct"}
    feedback: "Dit is stevig maar professioneel Engels."

  en.b2.unit07.lesson03.exercise01_choose_refused_term:
    instruction: "Welke voorwaarde weigerde Priya?"
    correct_option: "Tuesday with the full scope"
    distractors: ["Thursday for the full report", "Tuesday for the summary and charts", "next week for the appendix"]
    accepted_answers: [{value: "Tuesday with the full scope", status: "correct"}]
    feedback: "Ze weigert niet dinsdag op zich, maar dinsdag met volledige scope."
  en.b2.unit07.lesson03.exercise02_choose_agreed_outcome:
    instruction: "Welke uitkomst werd afgesproken?"
    correct_option: "Tuesday for the summary and charts, and next week for the appendix"
    distractors: ["Thursday for the full report", "Tuesday for the full report", "next week for the summary and charts"]
    accepted_answers: [{value: "Tuesday for the summary and charts, and next week for the appendix", status: "correct"}]
    feedback: "Het akkoord splitst de scope over dinsdag en volgende week."
  en.b2.unit07.lesson03.exercise03_match_negotiation_roles:
    instruction: "Verbind elk Engels woord of elke Engelse uitdrukking met de juiste Nederlandse omschrijving."
    pairs:
      - {left: "Priya's first proposal", right: "donderdag voor het volledige rapport"}
      - {left: "Marcus's requested deadline", right: "dinsdag"}
      - {left: "Priya's refusal", right: "niet dinsdag met de volledige omvang"}
      - {left: "Priya's condition", right: "de omvang beperkt tot de samenvatting en grafieken"}
      - {left: "Marcus's added term", right: "de bijlage volgt volgende week"}
      - {left: "final agreement", right: "dinsdag voor de samenvatting en grafieken"}
    accepted_answers:
      - value:
          - {left: "Priya's first proposal", right: "donderdag voor het volledige rapport"}
          - {left: "Marcus's requested deadline", right: "dinsdag"}
          - {left: "Priya's refusal", right: "niet dinsdag met de volledige omvang"}
          - {left: "Priya's condition", right: "de omvang beperkt tot de samenvatting en grafieken"}
          - {left: "Marcus's added term", right: "de bijlage volgt volgende week"}
          - {left: "final agreement", right: "dinsdag voor de samenvatting en grafieken"}
        status: "correct"
    feedback: "De matching onderscheidt voorstel, verzoek, weigering, voorwaarde, extra term en akkoord."
  en.b2.unit07.lesson03.exercise04_write_agreed_outcome:
    instruction: "Vat de uitkomst samen: het afgesproken resultaat was dinsdag voor de samenvatting en de grafieken, en volgende week voor de bijlage."
    accepted_answers:
      - {value: "The agreed outcome was Tuesday for the summary and charts, and next week for the appendix.", status: "correct"}
      - {value: "The agreed outcome was Tuesday for the summary and charts and next week for the appendix.", status: "correct"}
    feedback: "*agreed outcome* betekent de afgesproken uitkomst."
  en.b2.unit07.lesson03.exercise05_write_open_condition:
    instruction: "Schrijf onder welke voorwaarde dinsdag mogelijk is: als de scope wordt beperkt tot de managementsamenvatting en de grafieken."
    accepted_answers:
      - {value: "Tuesday is possible if the scope is reduced to the executive summary and the charts.", status: "correct"}
      - {value: "Tuesday is possible if the scope is reduced to the executive summary and the charts", status: "correct"}
      - {value: "Tuesday is possible on condition that the scope is reduced to the executive summary and the charts.", status: "correct"}
    feedback: "Deze zin maakt dinsdag mogelijk door de scope te beperken."

  en.b2.unit07.lesson04.exercise01_choose_refusal:
    instruction: "Luister naar het gesprek. Welke zin is Priya's weigering?"
    correct_option: "I cannot agree to Tuesday with the full scope."
    distractors: ["Tuesday would work with a smaller team.", "The client can wait until next month.", "The appendix is no longer needed."]
    accepted_answers: [{value: "I cannot agree to Tuesday with the full scope.", status: "correct"}]
    feedback: "Priya weigert dinsdag met volledige scope en geeft daarna de reden."
  en.b2.unit07.lesson04.exercise02_listen_condition:
    instruction: "Luister en kies Priya's voorwaarde voor de eerdere deadline."
    correct_option: "the scope is reduced to the executive summary and the charts"
    distractors: ["the client approves a new budget", "another analyst writes the appendix", "the meeting moves to Friday"]
    accepted_answers: [{value: "the scope is reduced to the executive summary and the charts", status: "correct"}]
    feedback: "De eerdere deadline kan alleen als de scope wordt verminderd."
  en.b2.unit07.lesson04.exercise03_order_agreed:
    instruction: "Zet de woorden in de juiste volgorde voor de afgesproken uitkomst."
    accepted_answers: [{value: ["Tuesday", "for", "the", "summary", "and", "charts", "and", "next", "week", "for", "the", "appendix"], status: "correct"}]
    feedback: "De juiste volgorde is *Tuesday for the summary and charts and next week for the appendix*."
  en.b2.unit07.lesson04.exercise04_reply_as_priya:
    instruction: "Antwoord als Priya op Marcus: weiger dinsdag bij de volledige scope en geef als reden dat dat de kwaliteit in gevaar zou brengen."
    accepted_answers:
      - {value: "I cannot agree to Tuesday with the full scope. That would risk the quality.", status: "correct"}
      - {value: "I can't agree to Tuesday with the full scope. That would risk the quality.", status: "correct"}
    feedback: "De reden *That would risk the quality* maakt de weigering verdedigbaar."
  en.b2.unit07.lesson04.exercise05_speak_negotiate:
    instruction: "Onderhandel hardop over de deadline met drie verplichte onderdelen: weiger dinsdag met volledige scope, bied een voorwaardelijke toegeving en sluit af met het akkoord."
    accepted_answers:
      - {value: "I cannot agree to Tuesday with the full scope. I can agree to the earlier deadline on condition that the scope is reduced to the executive summary and the charts. Agreed: Tuesday for the summary and charts, and next week for the appendix.", status: "correct"}
      - {value: "I can't agree to Tuesday with the full scope. I can agree to the earlier deadline on condition that the scope is reduced to the executive summary and the charts. Agreed: Tuesday for the summary and charts, and next week for the appendix.", status: "correct"}
    feedback: "De structuur voorkomt botte directheid: grens, voorwaarde, akkoord."
  en.b2.unit07.lesson04.exercise06_write_negotiation_reply:
    instruction: "Schrijf Priya's volledige onderhandelingsantwoord in drie zinnen: weiger dinsdag bij de volledige scope; ga akkoord met de eerdere deadline op voorwaarde dat de scope wordt beperkt tot de managementsamenvatting en de grafieken; bevestig het akkoord met 'Agreed:' dinsdag voor de samenvatting en de grafieken, volgende week voor de bijlage."
    accepted_answers:
      - {value: "I cannot agree to Tuesday with the full scope. I can agree to the earlier deadline on condition that the scope is reduced to the executive summary and the charts. Agreed: Tuesday for the summary and charts, and next week for the appendix.", status: "correct"}
      - {value: "I can't agree to Tuesday with the full scope. I can agree to the earlier deadline on condition that the scope is reduced to the executive summary and the charts. Agreed: Tuesday for the summary and charts, and next week for the appendix.", status: "correct"}
    feedback: "Dit levert het B2-doel: respectvol onderhandelen, terugduwen en akkoord bereiken."
