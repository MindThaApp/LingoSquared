    instruction: "Luister en kies het genoemde woord."
    correct_option: "party"
    distractors: ["birthday", "gift", "celebrate"]
    accepted_answers: [{value: "party", status: correct}]
    feedback: "*party* betekent feestje."
  en.a1.unit37.lesson01.exercise02.choose_gift_meaning:
    instruction: "Welk woord betekent iets dat je aan iemand geeft om een gelegenheid te vieren?"
    correct_option: "gift"
    distractors: ["invite", "celebrate", "congratulations"]
    accepted_answers: [{value: "gift", status: correct}]
    feedback: "*gift* betekent cadeau."
  en.a1.unit37.lesson01.exercise03.match_celebration_words:
    instruction: "Verbind elk woord met de juiste betekenis."
    accepted_answers: [{value: [{left: "de dag van het jaar waarop je geboren bent, elk jaar gevierd", right: "birthday"}, {left: "een bijeenkomst met vrienden of familie om iets te vieren", right: "party"}, {left: "iets dat je aan iemand geeft om een gelegenheid te vieren", right: "gift"}, {left: "iemand vragen om naar een evenement te komen", right: "invite"}, {left: "iets leuks doen om een speciale gelegenheid te markeren", right: "celebrate"}, {left: "woorden die je zegt om iemand te feliciteren met een fijne gebeurtenis of succes", right: "congratulations"}], status: correct}]
    feedback: "birthday=verjaardag, party=feestje, gift=cadeau, invite=uitnodigen, celebrate=vieren, congratulations=gefeliciteerd."
  en.a1.unit37.lesson01.exercise04.order_party_sentence:
    instruction: "Zet de woorden in de juiste volgorde voor 'We geven zaterdag een feestje.'"
    accepted_answers: [{value: ["We", "are", "having", "a", "party", "on", "Saturday."], status: correct}]
    feedback: "De juiste volgorde is We are having a party on Saturday."
  en.a1.unit37.lesson01.exercise05.write_gift_word:
    instruction: "Schrijf het woord voor iets dat je aan iemand geeft om een gelegenheid te vieren."
    accepted_answers:
      - {value: "gift", status: correct}
      - {value: "Gift", status: correct}
    feedback: "*gift* betekent cadeau."

