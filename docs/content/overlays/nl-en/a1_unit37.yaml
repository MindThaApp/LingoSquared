  en.a1.unit37.lesson02.teach.come_to_my_party_question: {title: "Do you want to come to my party?", gloss: "Wil je naar mijn feestje komen?", note: "Een vriendelijke, informele manier om iemand uit te nodigen."}

  en.a1.unit37.lesson03.teach.dialogue_line1: {title: "Leila's vraag", gloss: "Leila vraagt: Wist je dat Daniels verjaardag op 12 oktober is?", note: "Did you know ...? is een natuurlijke manier om een gesprek te beginnen met nieuwe informatie."}
  en.a1.unit37.lesson03.teach.dialogue_line2: {title: "Mia's reactie", gloss: "Mia zegt: Nee, dat wist ik niet! Dat is aanstaande vrijdag.", note: "I didn't (know) is de ontkennende verleden tijd van know -- gebruikt om te reageren op iets wat je niet wist."}
  en.a1.unit37.lesson03.teach.dialogue_line3: {title: "Leila's voorstel", gloss: "Leila zegt: Laten we een verrassingsfeestje voor hem geven op kantoor.", note: "Let's + werkwoord is een voorstel doen, net als 'laten we' in het Nederlands."}
  en.a1.unit37.lesson03.teach.dialogue_line4: {title: "Mia's reactie", gloss: "Mia zegt: Goed idee! Ik kan de rest van het team uitnodigen.", note: "the rest of the team betekent de rest van het team."}
  en.a1.unit37.lesson03.teach.dialogue_line5: {title: "Leila's plan", gloss: "Leila zegt: Perfect. Ik koop een cadeau voor hem -- misschien nieuwe hardloopschoenen, want hij houdt van hardlopen.", note: "since betekent hier omdat (reden), niet sinds (tijd)."}
  en.a1.unit37.lesson03.teach.dialogue_line6: {title: "Mia's voorstel", gloss: "Mia zegt: Dat is een goed idee. Zullen we ook een taart kopen?", note: "Should we ...? is een vraag om samen een beslissing te nemen."}
  en.a1.unit37.lesson03.teach.dialogue_line7: {title: "Leila's antwoord", gloss: "Leila zegt: Ja, zeker! We feliciteren hem allemaal samen.", note: "We'll all congratulate him betekent we zullen hem allemaal feliciteren."}

  en.a1.unit37.lesson04.teach.reading_passage: {title: "Tekst over het verrassingsfeestje", gloss: "Daniel wist niet dat Leila en Mia een verrassingsfeestje voor hem aan het plannen waren. Op 12 oktober, zijn verjaardag, kwam hij op zijn werk aan en vond ballonnen en een taart in de pauzeruimte. Iedereen zei 'Happy birthday!' en feliciteerde hem. Leila gaf hem een nieuw paar hardloopschoenen. Mia gaf hem een ingelijste foto van de drie collega's samen, die ze zelf had gemaakt. Daniel was erg blij en bedankte iedereen voor de geweldige verrassing.", note: "he arrived at work and found betekent hij kwam aan op zijn werk en vond -- verleden tijd van arrive en find."}

