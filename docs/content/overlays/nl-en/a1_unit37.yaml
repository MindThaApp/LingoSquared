    Draft only. Overlay against the shared en/a1_unit37_celebrations.yaml
    realization (itself still unreviewed). This unit had NO overlay in any
    direction (nl-en/fa-en/prs-en) before this file -- it was an orphaned
    realization, authored but unreachable by any learner. Authored entirely
    independently from the target realization and universal spine, per the
    standing rule -- no sibling-direction overlay exists for this unit in
    any language, confirmed via a fresh ls of docs/content/overlays/
    {nl-en,fa-en,prs-en}/ immediately before authoring. lesson03.exercise03's
    listen_select distractors ("a birthday card", "a work trip", "a group
    photo") were carried over unchanged from the realization's own
    generation_provenance notes, which already vetted them against the
    same-speaker-distractor rule (CLAUDE.md footgun, confirmed 2026-07-09) --
    re-verified independently that neither Leila nor Mia says any of those
    three phrases anywhere in this dialogue's audio. All other
    multiple_choice/listen_select distractors (comprehension_daniel_birthday,
    comprehension_leila_gift, reading_daniel_date, reading_leila_gift,
    reading_mia_gift) are freshly invented, plausible-but-wrong values never
    spoken or written anywhere in this unit's dialogue or reading text.
    Contrastive-grammar notes: (1) congratulate someone ON something takes a
    fixed preposition (on, not with/for as a Dutch speaker might expect from
    feliciteren met); (2) Dutch has no separate word for the English social
    routine "Happy birthday!" as a set exclamation the way English fixes it --
    Nederlands zegt vaak gefeliciteerd (which also covers general
    congratulations), so the overlay glosses distinguish the two English set
    phrases (Happy birthday! vs Congratulations!) even though Dutch often
    reaches for one word, gefeliciteerd, for both. Needs the mandatory
    fresh-context review before shipping.

course:
  title: Engels A1
  description: >-
    Engels voor beginners, met heldere uitleg in het Nederlands en aandacht
    voor alledaagse gesprekken.

units:
  en.a1.unit37.celebrations: {title: "Feesten en verjaardagen"}

