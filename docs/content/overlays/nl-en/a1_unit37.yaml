    feedback: "De tekst zegt: Mia gave him a framed photo."
  en.a1.unit37.lesson04.exercise04.write_own_celebration_sentence:
    instruction: "Schrijf één zin waarin je iemand uitnodigt voor een feest of feliciteert, met 'Do you want to come to', 'Happy birthday' of 'Congratulations on'."
