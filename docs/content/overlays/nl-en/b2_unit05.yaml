review: {status: "reviewed", required_next_reviewer: "fresh_context", notes: "Fifth nl-en B2 overlay, authored directly against reviewed English realization b2_unit05_register and universal_spine outcome universal.b2.register.adapt_formality_to_audience. Register pin: nl-en overlay lane: informal jij-register. Sibling-direction overlays for these B2 units were not opened or consulted. Dutch-specific notes target poor mapping from u/jij to English register: English formality is carried by phrasing, modal choices, indirectness, and fixed request frames rather than a pronoun switch."}

course:
  title: "Engels B2"
  description: >-
    Engels leren op B2-niveau voor genuanceerde gesprekken, argumenten,
    speculatie en professionele discussie, met uitleg in informeel Nederlands.

units:
  en.b2.unit05.register: {title: "Same message, different register"}

lessons:
  en.b2.unit05.lesson01.audience_and_formality: {title: "Casual, professional en formal"}
  en.b2.unit05.lesson02_same_request_three_ways: {title: "Can you, could we, I would be grateful"}
  en.b2.unit05.lesson03.reading_same_message: {title: "Lezen: drie doelgroepen"}
  en.b2.unit05.lesson04.the_register_dialogue: {title: "To a friend, yes. To the clinic, no."}

teaching:
  en.b2.unit05.lesson01.teach.register: {title: "register", gloss: "register, mate van formaliteit", note: "*register* is hoe formeel of informeel je klinkt. Engels heeft geen u/jij-switch zoals Nederlands; de toon zit vooral in de formulering.", example_gloss: "Het register verandert wanneer de doelgroep verandert."}
  en.b2.unit05.lesson01.teach.casual: {title: "casual", gloss: "informeel, los", note: "*casual* past bij een vriend of bekende. Het is directer, maar niet automatisch onbeleefd.", example_gloss: "Een informele boodschap past bij een vriend."}
  en.b2.unit05.lesson01.teach.professional: {title: "professional", gloss: "professioneel, zakelijk beleefd", note: "*professional* past bij een collega: beleefd en duidelijk, maar niet overdreven formeel.", example_gloss: "Een professionele boodschap past bij een collega."}
  en.b2.unit05.lesson01.teach.formal: {title: "formal", gloss: "formeel", note: "*formal* past bij een instelling. In Engels maak je dit vaak met langere, indirectere verzoeken.", example_gloss: "Een formele boodschap past bij een instelling."}
  en.b2.unit05.lesson01.teach.audience: {title: "audience", gloss: "doelgroep, ontvanger", note: "*audience* is de persoon of groep voor wie je schrijft of spreekt.", example_gloss: "Je doelgroep beinvloedt je woordkeuze."}
  en.b2.unit05.lesson01.teach.institution: {title: "institution", gloss: "instelling, organisatie", note: "*institution* is een organisatie zoals een kliniek, bank of universiteit.", example_gloss: "Een kliniek is een instelling."}

  en.b2.unit05.lesson02.teach.formal_request: {title: "formeel verzoek", gloss: "Ik zou het op prijs stellen als je zou kunnen bevestigen of mijn afspraak naar vrijdag verplaatst kan worden.", note: "*I would be grateful if you could...* is formeel. Het betekent niet dat Engels een ander woord voor *you* nodig heeft; de beleefdheid zit in de hele constructie."}
  en.b2.unit05.lesson02.teach.casual_request: {title: "informeel verzoek", gloss: "Kun je het naar vrijdag verplaatsen?", note: "*Can you...?* is prima voor een vriend, maar klinkt snel te direct voor een instelling."}
  en.b2.unit05.lesson02.teach.professional_request: {title: "professioneel verzoek", gloss: "Kunnen we de afspraak naar vrijdag verplaatsen als vrijdag jou nog steeds uitkomt?", note: "*Could we...?* klinkt samenwerkend en beleefd voor een collega."}
  en.b2.unit05.lesson02.teach.to_whom: {title: "Dear scheduling team,", gloss: "Beste planningsteam,", note: "*Dear...* is een normale formele aanhef. Het is minder stijf dan veel letterlijke Nederlandse briefopeningen."}
  en.b2.unit05.lesson02.teach.grammar_register_shift: {title: "register verschuiven", gloss: "Houd de inhoud hetzelfde wanneer je het register verandert. Informeel Engels kan directe vragen gebruiken. Professioneel Engels gebruikt vaak could. Formeel Engels gebruikt vaak I would be grateful if you could.", note: "Denk niet alleen aan Nederlands *u* versus *jij*: in Engels verandert de hele zin."}

  en.b2.unit05.lesson03.teach.stiff: {title: "stiff", gloss: "stijf, te formeel", note: "*stiff* betekent dat een boodschap onnodig formeel klinkt voor de situatie.", example_gloss: "Een stijve boodschap klinkt te formeel voor de situatie."}
  en.b2.unit05.lesson03.teach.appropriate: {title: "appropriate", gloss: "passend, geschikt", note: "*appropriate* betekent dat de formulering past bij de doelgroep en situatie.", example_gloss: "Een passende boodschap past bij de doelgroep."}
  en.b2.unit05.lesson03.teach.reading_passage: {title: "leestekst: dezelfde boodschap, drie doelgroepen", gloss: "Nina moet een afspraak naar vrijdag verplaatsen. Aan een vriend schrijft ze: Can you move it to Friday? De boodschap is direct en informeel. Aan een collega schrijft ze: Could we move the appointment to Friday if that still works for you? De boodschap is professioneel en beleefd. Aan de kliniek schrijft ze: I would be grateful if you could confirm whether my appointment can be moved to Friday. De inhoud is in alle drie teksten hetzelfde, maar het register verandert met de doelgroep.", note: "De les is contrastief: Engels register verandert via formulering, niet via een apart *u*."}

  en.b2.unit05.lesson04.teach.q_need_ask: {title: "Nina vraagt naar formulering", gloss: "Nina zegt: ik moet vragen of mijn afspraak verplaatst kan worden. Kan ik gewoon schrijven: 'Can you move it?'", note: "*just write* laat zien dat ze twijfelt of de directe vorm past."}
  en.b2.unit05.lesson04.teach.a_too_casual: {title: "Oscar wijst op register", gloss: "Oscar zegt: aan een vriend, ja. Aan de kliniek klinkt dat te informeel.", note: "In Engels is dezelfde *you* mogelijk, maar de zin zelf is te direct voor de kliniek."}
  en.b2.unit05.lesson04.teach.q_colleague: {title: "Nina vraagt naar collega-register", gloss: "Nina zegt: wat zou je aan een collega schrijven?", note: "Een collega vraagt om professioneel, niet maximaal formeel register."}
  en.b2.unit05.lesson04.teach.a_colleague_request: {title: "Oscar geeft de collega-versie", gloss: "Oscar zegt: ik zou schrijven: 'Could we move the appointment to Friday if that still works for you?'", note: "*Could we* en *if that still works for you* maken het verzoek zachter."}
  en.b2.unit05.lesson04.teach.q_clinic: {title: "Nina vraagt naar de kliniek", gloss: "Nina zegt: en aan de kliniek?", note: "Een instelling vraagt om een formelere verzoekstructuur."}
  en.b2.unit05.lesson04.teach.a_clinic_request: {title: "Oscar geeft de formele versie", gloss: "Oscar zegt: ik zou schrijven: 'I would be grateful if you could confirm whether my appointment can be moved to Friday.'", note: "Deze versie vraagt niet bot om actie, maar om bevestiging."}
  en.b2.unit05.lesson04.teach.q_same_message: {title: "Nina vat samen", gloss: "Nina zegt: dezelfde boodschap, ander register.", note: "De inhoud blijft hetzelfde: de afspraak naar vrijdag verplaatsen."}
  en.b2.unit05.lesson04.teach.a_content_stays: {title: "Oscar bevestigt", gloss: "Oscar zegt: precies. De inhoud blijft hetzelfde, maar de mate van formaliteit verandert.", note: "Dat is de kern van registercontrole op B2."}

exercises:
  en.b2.unit05.lesson01.exercise01.choose_register:
    instruction: "Welk woord betekent de mate van formaliteit die je kiest voor een doelgroep?"
    correct_option: "register"
    distractors: ["audience", "institution", "casual"]
    accepted_answers: [{value: "register", status: "correct"}]
    feedback: "*register* gaat over hoe formeel of informeel je formulering is."
  en.b2.unit05.lesson01.exercise02.choose_institution:
    instruction: "Welk woord noemt een organisatie zoals een kliniek, bank of universiteit?"
    correct_option: "institution"
    distractors: ["audience", "register", "professional"]
    accepted_answers: [{value: "institution", status: "correct"}]
    feedback: "*institution* betekent instelling of organisatie."
  en.b2.unit05.lesson01.exercise03.match_register_terms:
    instruction: "Verbind elk registerwoord met zijn betekenis."
    accepted_answers:
      - value:
          - {left: "casual, professional, or formal", right: "register"}
          - {left: "appropriate for a close friend", right: "casual"}
          - {left: "appropriate for a colleague", right: "professional"}
          - {left: "appropriate for an institution", right: "formal"}
          - {left: "the person or group receiving the message", right: "audience"}
          - {left: "an organization such as a clinic or university", right: "institution"}
        status: "correct"
    feedback: "Engels register draait om doelgroep en formulering, niet om *u* versus *jij*."
  en.b2.unit05.lesson01.exercise04.write_formal:
    instruction: "Schrijf het Engelse woord dat betekent: passend voor een instelling."
    accepted_answers:
      - {value: "formal", status: "correct"}
      - {value: "Formal", status: "correct"}
    feedback: "*formal* betekent formeel."
  en.b2.unit05.lesson01.exercise05.write_casual:
    instruction: "Schrijf het Engelse woord dat betekent: passend voor een goede vriend."
    accepted_answers:
      - {value: "casual", status: "correct"}
      - {value: "Casual", status: "correct"}
    feedback: "*casual* betekent informeel of los."

  en.b2.unit05.lesson02.exercise01_choose_formal:
    instruction: "Welke zin is de formele versie voor een instelling?"
    correct_option: "I would be grateful if you could confirm whether my appointment can be moved."
    distractors: ["Can you move it to Friday?", "Could we move the appointment to Friday if that still works for you?", "Move it to Friday for me."]
    accepted_answers: [{value: "I would be grateful if you could confirm whether my appointment can be moved.", status: "correct"}]
    feedback: "*I would be grateful if you could...* is de formele verzoekvorm."
  en.b2.unit05.lesson02.exercise02_choose_casual:
    instruction: "Welke zin is de informele versie voor een vriend?"
    correct_option: "Can you move it to Friday?"
    distractors: ["I would be grateful if you could confirm whether my appointment can be moved.", "Could we move the appointment to Friday if that still works for you?", "Dear scheduling team,"]
    accepted_answers: [{value: "Can you move it to Friday?", status: "correct"}]
    feedback: "*Can you...?* is direct en informeel genoeg voor een vriend."
  en.b2.unit05.lesson02.exercise03_order_formal_request:
    instruction: "Zet de woorden in de juiste volgorde voor het formele verzoek."
    accepted_answers: [{value: ["I", "would", "be", "grateful", "if", "you", "could", "confirm", "whether", "my", "appointment", "can", "be", "moved"], status: "correct"}]
    feedback: "De juiste vorm is *I would be grateful if you could confirm whether my appointment can be moved*."
  en.b2.unit05.lesson02.exercise04_reply_professional:
    instruction: "Schrijf de professionele collega-versie precies: 'Could we move the appointment to Friday if that still works for you?'"
    accepted_answers:
      - {value: "Could we move the appointment to Friday if that still works for you?", status: "correct"}
      - {value: "Could we move the appointment to Friday, if that still works for you?", status: "correct"}
    feedback: "*Could we* klinkt zakelijk beleefd zonder stijf te worden."
  en.b2.unit05.lesson02.exercise05_write_formal_request:
    instruction: "Schrijf de formele instellingsversie precies: 'I would be grateful if you could confirm whether my appointment can be moved to Friday.'"
    accepted_answers:
      - {value: "I would be grateful if you could confirm whether my appointment can be moved to Friday.", status: "correct"}
      - {value: "I would be grateful if you could confirm whether my appointment can be moved to Friday", status: "correct"}
    feedback: "De formele toon zit in *I would be grateful if you could confirm whether...*."

  en.b2.unit05.lesson03.exercise01_choose_friend_text:
    instruction: "Welke tekst is voor een vriend geschreven?"
    correct_option: "Can you move it to Friday?"
    distractors: ["Could we move the appointment to Friday if that still works for you?", "I would be grateful if you could confirm whether my appointment can be moved to Friday.", "Dear scheduling team,"]
    accepted_answers: [{value: "Can you move it to Friday?", status: "correct"}]
    feedback: "De directe vraag past bij een vriend."
  en.b2.unit05.lesson03.exercise02_choose_clinic_text:
    instruction: "Welke tekst is voor de kliniek geschreven?"
    correct_option: "I would be grateful if you could confirm whether my appointment can be moved to Friday."
    distractors: ["Can you move it to Friday?", "Could we move the appointment to Friday if that still works for you?", "Move it to Friday, please."]
    accepted_answers: [{value: "I would be grateful if you could confirm whether my appointment can be moved to Friday.", status: "correct"}]
    feedback: "Voor een instelling werkt een indirecter formeel verzoek beter."
  en.b2.unit05.lesson03.exercise03_match_audience:
    instruction: "Verbind elk tekstkenmerk met de juiste doelgroep of beoordeling."
    accepted_answers:
      - value:
          - {left: "friend version", right: "Can you move it to Friday?"}
          - {left: "colleague version", right: "Could we move the appointment to Friday if that still works for you?"}
          - {left: "clinic version", right: "I would be grateful if you could confirm whether my appointment can be moved to Friday."}
          - {left: "too formal for a close friend", right: "stiff"}
          - {left: "fits the audience", right: "appropriate"}
          - {left: "changes across the three texts", right: "register"}
        status: "correct"
    feedback: "De drie Engelse versies verschillen in register, niet in basisinhoud."
  en.b2.unit05.lesson03.exercise04_write_same_content:
    instruction: "Schrijf precies: 'The content is the same, but the register changes.'"
    accepted_answers:
      - {value: "The content is the same, but the register changes.", status: "correct"}
      - {value: "The content is the same but the register changes.", status: "correct"}
    feedback: "Dit is de kern: inhoud gelijk, register anders."
  en.b2.unit05.lesson03.exercise05_write_colleague_version:
    instruction: "Schrijf precies de collega-versie uit de leestekst: 'Could we move the appointment to Friday if that still works for you?'"
    accepted_answers:
      - {value: "Could we move the appointment to Friday if that still works for you?", status: "correct"}
      - {value: "Could we move the appointment to Friday, if that still works for you?", status: "correct"}
    feedback: "*if that still works for you* maakt het verzoek rekeninghoudend."

  en.b2.unit05.lesson04.exercise01_choose_too_casual:
    instruction: "Luister naar het gesprek. Welke formulering is te informeel voor de kliniek?"
    correct_option: "Can you move it?"
    distractors: ["Could you confirm the new time?", "Would Friday be possible for the clinic?", "I would appreciate confirmation."]
    accepted_answers: [{value: "Can you move it?", status: "correct"}]
    feedback: "Oscar zegt dat *Can you move it?* voor de kliniek te informeel klinkt."
  en.b2.unit05.lesson04.exercise02_listen_clinic:
    instruction: "Luister en kies de formele kliniekversie."
    correct_option: "I would be grateful if you could confirm whether my appointment can be moved to Friday."
    distractors: ["Please tell me if Friday is free.", "Could the clinic offer another time?", "I need Friday instead."]
    accepted_answers: [{value: "I would be grateful if you could confirm whether my appointment can be moved to Friday.", status: "correct"}]
    feedback: "Deze zin is de formele versie in het gesprek."
  en.b2.unit05.lesson04.exercise03_order_colleague:
    instruction: "Zet de woorden in de juiste volgorde voor de professionele collega-versie."
    accepted_answers: [{value: ["could", "we", "move", "the", "appointment", "to", "Friday", "if", "that", "still", "works", "for", "you"], status: "correct"}]
    feedback: "De juiste volgorde is *could we move the appointment to Friday if that still works for you*."
  en.b2.unit05.lesson04.exercise04_reply_as_oscar:
    instruction: "Antwoord precies op Nina's vraag over 'Can you move it?': 'To a friend, yes. To the clinic, that sounds too casual.'"
    accepted_answers:
      - {value: "To a friend, yes. To the clinic, that sounds too casual.", status: "correct"}
      - {value: "To a friend, yes; to the clinic, that sounds too casual.", status: "correct"}
    feedback: "Quote-style woorden blijven Engels: *yes* in de zin, niet Nederlands *ja*."
  en.b2.unit05.lesson04.exercise05_speak_shift_register:
    instruction: "Zeg hardop hetzelfde verzoek op drie manieren: aan een vriend, aan een collega en aan een instelling."
    accepted_answers:
      - {value: "Can you move it to Friday? Could we move the appointment to Friday if that still works for you? I would be grateful if you could confirm whether my appointment can be moved to Friday.", status: "correct"}
      - {value: "Can you move it to Friday? Could we move the appointment to Friday, if that still works for you? I would be grateful if you could confirm whether my appointment can be moved to Friday.", status: "correct"}
    feedback: "Drie registers: direct, professioneel verzacht en formeel indirect."
  en.b2.unit05.lesson04.exercise06_write_three_registers:
    instruction: "Schrijf hetzelfde verzoek in drie registers precies zo: 'Can you move it to Friday? Could we move the appointment to Friday if that still works for you? I would be grateful if you could confirm whether my appointment can be moved to Friday.'"
    accepted_answers:
      - {value: "Can you move it to Friday? Could we move the appointment to Friday if that still works for you? I would be grateful if you could confirm whether my appointment can be moved to Friday.", status: "correct"}
      - {value: "Can you move it to Friday? Could we move the appointment to Friday, if that still works for you? I would be grateful if you could confirm whether my appointment can be moved to Friday.", status: "correct"}
    feedback: "Dit levert het B2-doel: dezelfde inhoud aanpassen aan doelgroep en formaliteit."
