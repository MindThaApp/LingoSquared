  en.a1.unit05.lesson04.teach.q_close: {title: "Vragen naar de sluitingstijd", gloss: "Daniel: En hoe laat gaat het dicht?", note: "And what time does it close? is een natuurlijke vervolgvraag."}
  en.a1.unit05.lesson04.teach.a_close: {title: "Antwoord over de sluitingstijd", gloss: "Leila: Om zes uur 's avonds.", note: "It closes at six in the evening."}
