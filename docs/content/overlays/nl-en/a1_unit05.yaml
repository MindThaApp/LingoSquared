  en.a1.unit05.lesson01.teach.half_past: {title: "It's half past three.", gloss: "Het is half vier.", note: "Let op: half past three betekent half vier, niet half drie! Het Engels telt het HALVE UUR NA drie (half past three = 3:30), terwijl het Nederlandse half vier ook 3:30 betekent maar verwijst naar het volgende hele uur. De uitkomst is hetzelfde tijdstip, maar de manier van tellen is precies omgekeerd -- dit is de meest voorkomende fout bij Nederlandstalige leerders met Engelse klok-tijden."}
  en.a1.unit05.lesson01.teach.five_oclock: {title: "It's five o'clock.", gloss: "Het is vijf uur.", note: "five o'clock betekent een heel uur, vijf uur precies."}

  en.a1.unit05.lesson02.teach.quarter_past: {title: "It's a quarter past three.", gloss: "Het is kwart over drie.", note: "a quarter past three betekent 3:15; past werkt hetzelfde als het Nederlandse over."}
  en.a1.unit05.lesson02.teach.quarter_to: {title: "It's a quarter to four.", gloss: "Het is kwart voor vier.", note: "a quarter to four betekent 3:45; to werkt hetzelfde als het Nederlandse voor."}
  en.a1.unit05.lesson02.teach.ten_past: {title: "It's ten past four.", gloss: "Het is tien over vier.", note: "ten past four betekent 4:10."}
  en.a1.unit05.lesson02.teach.ten_to: {title: "It's ten to five.", gloss: "Het is tien voor vijf.", note: "ten to five betekent 4:50; met past tel je de minuten na het hele uur en met to de minuten tot het volgende hele uur."}

  en.a1.unit05.lesson03.teach.morning: {title: "Morning", gloss: "ochtend", note: "morning duurt meestal van ongeveer 6 uur tot 12 uur 's middags.", example_gloss: "Goedemorgen, Daniel!"}
  en.a1.unit05.lesson03.teach.afternoon: {title: "Afternoon", gloss: "middag", note: "afternoon duurt van 12 uur tot ongeveer 17 uur.", example_gloss: "Ik werk in de middag."}
  en.a1.unit05.lesson03.teach.evening: {title: "Evening", gloss: "avond", note: "evening verwijst meestal naar de periode van ongeveer 17 tot 21 uur; de precieze grens verschilt per situatie.", example_gloss: "Goedenavond, Leila!"}
  en.a1.unit05.lesson03.teach.night: {title: "Night", gloss: "nacht", note: "night verwijst naar de nacht en wordt vaak gebruikt vanaf ongeveer 21 uur; de precieze grens verschilt per situatie.", example_gloss: "Goedenacht, Daniel!"}
  en.a1.unit05.lesson03.teach.at_nine_am: {title: "The store opens at nine in the morning.", gloss: "De winkel gaat om negen uur 's ochtends open.", note: "at nine in the morning is preciezer dan alleen nine, omdat het duidelijk maakt dat het om ochtend gaat."}
  en.a1.unit05.lesson03.teach.at_six_pm: {title: "The store closes at six in the evening.", gloss: "De winkel gaat om zes uur 's avonds dicht.", note: "at six in the evening betekent zes uur 's avonds, niet 's ochtends."}

  en.a1.unit05.lesson04.teach.opens_at: {title: "Opens at", gloss: "gaat open om", note: "opens at komt vóór het tijdstip.", example_gloss: "De bibliotheek gaat om negen uur open."}
  en.a1.unit05.lesson04.teach.closes_at: {title: "Closes at", gloss: "gaat dicht om", note: "closes at komt vóór het tijdstip.", example_gloss: "De bibliotheek gaat om zes uur dicht."}
  en.a1.unit05.lesson04.teach.q_open: {title: "Daniel vraagt naar de openingstijd", gloss: "Daniel: Hoe laat gaat de bibliotheek open?", note: "What time does the library open? is de vraagvorm met does voor gewoontes/roosters."}
