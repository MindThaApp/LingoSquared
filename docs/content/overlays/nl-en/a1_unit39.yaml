  en.a1.unit39.lesson03.teach.dialogue_line6: {title: "Mia's antwoord", gloss: "Mia zegt: Heel vriendelijk! Mijn buurman meneer Lopez geeft mijn planten water als ik weg ben.", note: "*waters my plants* betekent geeft mijn planten water -- in het Engels is *water* hier een werkwoord."}
  en.a1.unit39.lesson03.teach.dialogue_line7: {title: "Leila's reactie", gloss: "Leila zegt: Wat lief. Ik denk dat ik graag bij jou in de buurt zou willen wonen!", note: "*I'd like to* + werkwoord betekent: ik zou graag willen + werkwoord."}

  en.a1.unit39.lesson04.teach.reading_passage: {title: "Tekst over drie buurten", gloss: "Daniel, Leila en Mia wonen alle drie in een andere buurt. Daniels buurt is druk, met restaurants en winkels dicht bij zijn appartementsgebouw. Hij kent verschillende van zijn buren en zegt in de gang vaak gedag tegen hen. Leila woont in een rustige buurt, dicht bij het zwembad waar ze zwemt. Haar buurvrouw aan de overkant van de straat heeft een grote hond die veel blaft. Mia's buurt is ook rustig, met een supermarkt op vijf minuten lopen van haar gebouw. Haar buurman meneer Lopez is erg vriendelijk en geeft haar planten water als ze weg is. Na het gesprek met Mia besloot Leila dat ze een appartement in de buurt van Mia wil zoeken.", note: "*decided she wants to look for* betekent: besloot dat ze een appartement wil zoeken."}

