  en.a1.unit39.lesson03.teach.dialogue_line2: {title: "Mia's antwoord", gloss: "Mia zegt: Ik vind het er echt fijn. Het is rustig, en er is een park in de buurt.", note: "*there's a park nearby* betekent er is een park in de buurt."}
  en.a1.unit39.lesson03.teach.dialogue_line3: {title: "Leila's vraag", gloss: "Leila zegt: Dat klinkt fijn. Is het dicht bij een supermarkt?", note: "*That sounds nice* is een natuurlijke reactie op goed nieuws."}
  en.a1.unit39.lesson03.teach.dialogue_line4: {title: "Mia's antwoord", gloss: "Mia zegt: Ja, er is er een op slechts vijf minuten lopen van mijn gebouw.", note: "*just* betekent hier maar / slechts -- het benadrukt hoe kort de afstand is."}
