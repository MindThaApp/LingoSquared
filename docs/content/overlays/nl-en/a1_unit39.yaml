teaching:
  en.a1.unit39.lesson01.teach.neighborhood: {title: "neighborhood", gloss: "buurt", note: "*neighborhood* betekent de buurt -- het gebied rond je huis, met de straten en gebouwen dichtbij.", example_gloss: "Ik hou van mijn buurt."}
  en.a1.unit39.lesson01.teach.neighbor: {title: "neighbor", gloss: "buur / buurman / buurvrouw", note: "*neighbor* betekent een buur -- iemand die naast je of dichtbij je woont.", example_gloss: "Mijn buurman is erg behulpzaam."}
  en.a1.unit39.lesson01.teach.nearby: {title: "nearby", gloss: "dichtbij / in de buurt", note: "*nearby* betekent dichtbij.", example_gloss: "Er is een park in de buurt."}
  en.a1.unit39.lesson01.teach.quiet: {title: "quiet", gloss: "rustig / stil", note: "*quiet* betekent rustig, zonder veel geluid.", example_gloss: "Mijn straat is 's nachts erg rustig."}
  en.a1.unit39.lesson01.teach.noisy: {title: "noisy", gloss: "lawaaierig", note: "*noisy* betekent vol harde geluiden.", example_gloss: "De straat naast de mijne is lawaaierig."}
  en.a1.unit39.lesson01.teach.friendly: {title: "friendly", gloss: "vriendelijk", note: "*friendly* betekent vriendelijk.", example_gloss: "Mijn buren zijn erg vriendelijk."}

  en.a1.unit39.lesson02.teach.live_in_a_neighborhood: {title: "live in a neighborhood", gloss: "in een buurt wonen", note: "*live in a neighborhood* betekent in een buurt wonen.", example_gloss: "Ik woon in een rustige buurt."}
  en.a1.unit39.lesson02.teach.get_along_with_your_neighbors: {title: "get along with your neighbors", gloss: "goed opschieten met je buren", note: "*get along with your neighbors* betekent een goede, vriendelijke relatie hebben met de mensen die dichtbij je wonen.", example_gloss: "Ik schiet goed op met mijn buren."}
  en.a1.unit39.lesson02.teach.close_to: {title: "close to", gloss: "dichtbij", note: "*close to* betekent dichtbij.", example_gloss: "Mijn appartement is dichtbij een supermarkt."}
  en.a1.unit39.lesson02.teach.a_five_minute_walk: {title: "a five-minute walk", gloss: "vijf minuten lopen", note: "*a five-minute walk* is een vast Engels patroon (getal + zelfstandig naamwoord, met koppelteken, enkelvoud vóór walk) -- het Nederlands zegt gewoon 'vijf minuten lopen', zonder deze constructie.", example_gloss: "Het park is vijf minuten lopen van mijn huis."}
  en.a1.unit39.lesson02.teach.say_hello_to: {title: "say hello to", gloss: "gedag zeggen tegen", note: "*say hello to* betekent gedag zeggen tegen iemand.", example_gloss: "Ik zeg 's ochtends altijd gedag tegen mijn buurman."}
  en.a1.unit39.lesson02.teach.whats_your_neighborhood_like_question: {title: "What's your neighborhood like?", gloss: "Hoe is jouw buurt?", note: "What's ... like? vraagt naar een beschrijving, niet naar een voorkeur."}

  en.a1.unit39.lesson03.teach.dialogue_line1: {title: "Leila's vraag", gloss: "Leila zegt: Ik ga misschien binnenkort verhuizen. Hoe is jouw buurt, Mia?", note: "might + werkwoord drukt een mogelijkheid uit -- misschien wel, misschien niet."}
  en.a1.unit39.lesson03.teach.dialogue_line2: {title: "Mia's antwoord", gloss: "Mia zegt: Ik vind het er echt fijn. Het is rustig, en er is een park in de buurt.", note: "there's a park nearby betekent er is een park in de buurt."}
  en.a1.unit39.lesson03.teach.dialogue_line3: {title: "Leila's vraag", gloss: "Leila zegt: Dat klinkt fijn. Is het dichtbij een supermarkt?", note: "That sounds nice is een natuurlijke reactie op goed nieuws."}
  en.a1.unit39.lesson03.teach.dialogue_line4: {title: "Mia's antwoord", gloss: "Mia zegt: Ja, er is er een op maar vijf minuten lopen van mijn gebouw.", note: "just betekent hier maar / slechts -- het benadrukt hoe kort de afstand is."}
  en.a1.unit39.lesson03.teach.dialogue_line5: {title: "Leila's vraag", gloss: "Leila vraagt: En je buren? Zijn ze vriendelijk?", note: "What about ...? is een natuurlijke manier om een nieuw onderwerp te introduceren."}
  en.a1.unit39.lesson03.teach.dialogue_line6: {title: "Mia's antwoord", gloss: "Mia zegt: Heel vriendelijk! Mijn buurman meneer Lopez geeft mijn planten water als ik weg ben.", note: "*waters my plants* betekent geeft mijn planten water -- in het Engels is *water* hier een werkwoord."}
  en.a1.unit39.lesson03.teach.dialogue_line7: {title: "Leila's reactie", gloss: "Leila zegt: Wat lief. Ik denk dat ik graag bij jou in de buurt zou willen wonen!", note: "I'd like to + werkwoord betekent ik zou graag willen + werkwoord."}

  en.a1.unit39.lesson04.teach.reading_passage: {title: "Tekst over drie buurten", gloss: "Daniel, Leila en Mia wonen alle drie in een andere buurt. Daniels buurt is druk, met restaurants en winkels dichtbij zijn appartementsgebouw. Hij kent verschillende van zijn buren en zegt in de gang vaak gedag tegen hen. Leila woont in een rustige buurt, dichtbij het zwembad waar ze zwemt. Haar buurvrouw aan de overkant heeft een grote hond die veel blaft. Mia's buurt is ook rustig, met een supermarkt op vijf minuten lopen van haar gebouw. Haar buurman meneer Lopez is erg vriendelijk en geeft haar planten water als ze weg is. Na het gesprek met Mia besloot Leila dat ze een appartement bij haar in de buurt wil zoeken.", note: "decided she wants to look for betekent besloot dat ze wil zoeken naar."}

