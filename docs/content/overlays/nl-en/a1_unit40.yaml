course:
  title: Engels A1
  description: >-
    Engels voor beginners, met heldere uitleg in het Nederlands en aandacht
    voor alledaagse gesprekken.

units:
  en.a1.unit40.post: {title: "Bij het postkantoor"}

lessons:
  en.a1.unit40.lesson01.post_office_vocabulary: {title: "Bij het postkantoor"}
  en.a1.unit40.lesson02.sending_mail: {title: "Post versturen"}
  en.a1.unit40.lesson03.dialogue_at_the_post_office: {title: "Gesprek: Bij het postkantoor"}
  en.a1.unit40.lesson04.three_trips_to_the_post_office: {title: "Lezen: Drie keer naar het postkantoor"}

teaching:
  en.a1.unit40.lesson01.teach.post_office: {title: "post office", gloss: "postkantoor", note: "*post office* betekent postkantoor.", example_gloss: "Ik ga naar het postkantoor om brieven te versturen."}
  en.a1.unit40.lesson01.teach.letter: {title: "letter", gloss: "brief", note: "*letter* betekent brief.", example_gloss: "Ik schrijf een brief aan mijn vriend."}
  en.a1.unit40.lesson01.teach.package: {title: "package", gloss: "pakketje / pakje", note: "*package* betekent pakketje.", example_gloss: "Ik stuur een pakketje naar mijn zus."}
  en.a1.unit40.lesson01.teach.stamp: {title: "stamp", gloss: "postzegel", note: "*stamp* betekent postzegel.", example_gloss: "Ik heb een postzegel nodig voor deze brief."}
  en.a1.unit40.lesson01.teach.envelope: {title: "envelope", gloss: "envelop", note: "*envelope* betekent envelop.", example_gloss: "Ik doe de brief in een envelop."}
  en.a1.unit40.lesson01.teach.mailbox: {title: "mailbox", gloss: "brievenbus / postbus", note: "*mailbox* betekent brievenbus of postbus.", example_gloss: "De brievenbus staat naast het postkantoor."}

  en.a1.unit40.lesson02.teach.send_a_letter: {title: "send a letter", gloss: "een brief versturen", note: "*send a letter* betekent een brief versturen.", example_gloss: "Ik wil een brief naar mijn ouders sturen."}
  en.a1.unit40.lesson02.teach.buy_a_stamp: {title: "buy a stamp", gloss: "een postzegel kopen", note: "*buy a stamp* betekent een postzegel kopen.", example_gloss: "Ik moet een postzegel kopen voor deze ansichtkaart."}
  en.a1.unit40.lesson02.teach.write_the_address: {title: "write the address", gloss: "het adres opschrijven", note: "*write the address* betekent het adres opschrijven.", example_gloss: "Schrijf alsjeblieft het adres op het pakketje."}
  en.a1.unit40.lesson02.teach.how_long_will_it_take: {title: "how long will it take", gloss: "hoe lang duurt het", note: "*how long will it take* betekent hoe lang duurt het.", example_gloss: "Hoe lang duurt het voordat het aankomt?"}
  en.a1.unit40.lesson02.teach.express_mail: {title: "express mail", gloss: "spoedpost / expresverzending", note: "*express mail* betekent spoedpost -- snellere, duurdere verzending.", example_gloss: "Spoedpost is sneller dan gewone post."}
  en.a1.unit40.lesson02.teach.how_much_does_it_cost_question: {title: "How much does it cost to send this?", gloss: "Hoeveel kost het om dit te versturen?", note: "How much does it cost to ...? vraagt naar de prijs van een handeling."}

  en.a1.unit40.lesson03.teach.dialogue_line1: {title: "Daniels verzoek", gloss: "Daniel zegt: Hallo, ik wil graag dit pakketje versturen, alstublieft.", note: "I'd like to + werkwoord is een beleefde, formele verzoekvorm -- veel beleefder dan gewoon 'I want', wat in het Engelse dienstverleningsregister nogal bot klinkt."}
  en.a1.unit40.lesson03.teach.dialogue_line2: {title: "De medewerker vraagt", gloss: "De medewerker zegt: Natuurlijk! Waar gaat het naartoe?", note: "Where is it going? vraagt naar de bestemming."}
  en.a1.unit40.lesson03.teach.dialogue_line3: {title: "Daniels antwoord", gloss: "Daniel zegt: Naar Chicago. Het is een verjaardagscadeau voor mijn zus.", note: "It's a birthday gift for my sister betekent het is een verjaardagscadeau voor mijn zus."}
  en.a1.unit40.lesson03.teach.dialogue_line4: {title: "De medewerker vraagt", gloss: "De medewerker zegt: Wilt u gewone post of spoedpost? Spoedpost duurt ongeveer twee dagen.", note: "regular or express mail betekent gewone post of spoedpost."}
  en.a1.unit40.lesson03.teach.dialogue_line5: {title: "Daniels keuze", gloss: "Daniel zegt: Ik neem spoedpost, alstublieft. Hoeveel kost dat?", note: "I'll take ... is een natuurlijke manier om een keuze te maken bij een dienstverlener."}
  en.a1.unit40.lesson03.teach.dialogue_line6: {title: "De medewerker antwoordt", gloss: "De medewerker zegt: Dat is twaalf dollar. Hier is uw kwitantie.", note: "Here's your receipt betekent hier is uw kwitantie/bon."}
  en.a1.unit40.lesson03.teach.dialogue_line7: {title: "Daniels dank", gloss: "Daniel zegt: Dank u! Nog een fijne dag.", note: "Have a good day is een beleefde afscheidsgroet."}

  en.a1.unit40.lesson04.teach.reading_passage: {title: "Tekst over drie bezoeken aan het postkantoor", gloss: "Daniel, Leila en Mia kennen allemaal de weg op het postkantoor. Vorige week stuurde Daniel een verjaardagspakketje naar zijn zus in Chicago. Hij betaalde voor spoedpost omdat hij wilde dat het snel aankwam, en het duurde maar twee dagen. Leila maakt zich klaar om bij Mia in de buurt te gaan wonen, dus ging ze naar het postkantoor om wat oude boeken naar haar ouders te sturen. De medewerker woog het pakketje en gaf haar een postzegel ervoor. Leila vroeg hoe lang het pakketje zou duren, en de medewerker zei ongeveer een week, omdat ze voor gewone post koos. Mia stuurt niet vaak pakketjes, maar ze koopt altijd een postzegel voor de brieven die ze aan haar oma schrijft. Ze zegt dat een brief met een postzegel persoonlijker aanvoelt dan een tekstbericht.", note: "getting ready to move betekent zich klaarmaken om te verhuizen."}

exercises:
  en.a1.unit40.lesson01.exercise01.listen_word:
    instruction: "Luister en kies het genoemde woord."
    correct_option: "stamp"
    distractors: ["letter", "package", "envelope"]
    accepted_answers: [{value: "stamp", status: correct}]
    feedback: "*stamp* betekent postzegel."
  en.a1.unit40.lesson01.exercise02.choose_envelope_meaning:
    instruction: "Welk woord betekent het papieren hoesje waar je een brief in doet voordat je hem verstuurt?"
    correct_option: "envelope"
    distractors: ["stamp", "package", "mailbox"]
    accepted_answers: [{value: "envelope", status: correct}]
    feedback: "*envelope* betekent envelop."
  en.a1.unit40.lesson01.exercise03.match_post_words:
    instruction: "Verbind elk woord met de juiste betekenis."
    accepted_answers: [{value: [{left: "de plaats waar je post verstuurt en postzegels koopt", right: "post office"}, {left: "een geschreven bericht dat je aan iemand stuurt", right: "letter"}, {left: "een doos die je met spullen erin verstuurt", right: "package"}, {left: "een kleine sticker die je op post plakt om de verzending te betalen", right: "stamp"}, {left: "het papieren hoesje waar je een brief in doet", right: "envelope"}, {left: "het kastje waar je uitgaande post in doet of post ontvangt", right: "mailbox"}], status: correct}]
    feedback: "post office=postkantoor, letter=brief, package=pakketje, stamp=postzegel, envelope=envelop, mailbox=brievenbus."
  en.a1.unit40.lesson01.exercise04.order_stamp_sentence:
    instruction: "Zet de woorden in de juiste volgorde voor 'Ik heb een postzegel nodig voor deze brief.'"
    accepted_answers: [{value: ["I", "need", "a", "stamp", "for", "this", "letter."], status: correct}]
    feedback: "De juiste volgorde is I need a stamp for this letter."
  en.a1.unit40.lesson01.exercise05.write_envelope_word:
    instruction: "Schrijf het woord voor het papieren hoesje waar je een brief in doet."
    accepted_answers:
      - {value: "envelope", status: correct}
      - {value: "Envelope", status: correct}
    feedback: "*envelope* betekent envelop."

  en.a1.unit40.lesson02.exercise01.listen_phrase:
    instruction: "Luister en kies de zin die gezegd wordt."
    correct_option: "express mail"
    distractors: ["send a letter", "buy a stamp", "write the address"]
    accepted_answers: [{value: "express mail", status: correct}]
    feedback: "*express mail* betekent spoedpost."
  en.a1.unit40.lesson02.exercise02.choose_how_long_meaning:
    instruction: "Welke uitdrukking vraagt naar de tijd die iets nodig heeft voordat het aankomt?"
    correct_option: "how long will it take"
    distractors: ["how much does it cost", "write the address", "buy a stamp"]
    accepted_answers: [{value: "how long will it take", status: correct}]
    feedback: "how long will it take betekent hoe lang duurt het."
  en.a1.unit40.lesson02.exercise03.choose_write_address_meaning:
    instruction: "Welke uitdrukking betekent de bestemming op een brief of pakketje zetten?"
    correct_option: "write the address"
    distractors: ["send a letter", "express mail", "buy a stamp"]
    accepted_answers: [{value: "write the address", status: correct}]
    feedback: "write the address betekent het adres opschrijven."
  en.a1.unit40.lesson02.exercise04.order_how_long_sentence:
    instruction: "Zet de woorden in de juiste volgorde voor 'Hoe lang duurt het voordat het aankomt?'"
    accepted_answers: [{value: ["How", "long", "will", "it", "take", "to", "arrive?"], status: correct}]
    feedback: "De juiste volgorde is How long will it take to arrive?"
  en.a1.unit40.lesson02.exercise05.translate_how_much_does_it_cost:
    instruction: "Vertaal: 'Hoeveel kost het om dit te versturen?'"
    accepted_answers:
      - {value: "How much does it cost to send this?", status: correct}
      - {value: "How much does it cost to send this", status: correct}
    feedback: "How much does it cost to send this? betekent hoeveel kost het om dit te versturen?"

  en.a1.unit40.lesson03.exercise01.comprehension_package_recipient:
    instruction: "Voor wie is Daniels pakketje volgens het gesprek?"
    correct_option: "sister"
    distractors: ["mother", "friend"]
    accepted_answers: [{value: "sister", status: correct}]
    feedback: "Daniel zegt: it's a birthday gift for my sister."
  en.a1.unit40.lesson03.exercise02.comprehension_shipping_cost:
    instruction: "Hoeveel betaalt Daniel om het pakketje te versturen volgens het gesprek?"
    correct_option: "twelve dollars"
    distractors: ["ten dollars", "twenty dollars"]
    accepted_answers: [{value: "twelve dollars", status: correct}]
    feedback: "De medewerker zegt: that's twelve dollars."
  en.a1.unit40.lesson03.exercise03.listen_dialogue_clerk_question:
    instruction: "Wat vraagt de medewerker Daniel als eerste volgens het gesprek?"
    correct_option: "where is it going"
    distractors: ["how much do you want to pay", "do you have a stamp already", "what is inside the package"]
    accepted_answers: [{value: "where is it going", status: correct}]
    feedback: "De medewerker vraagt: where is it going?"
  en.a1.unit40.lesson03.exercise04.respond_own_mail:
    instruction: "Zeg iets over post versturen, of vraag hoeveel het kost of hoe lang het duurt."
    accepted_answers: ["I need to buy a stamp", "I need to buy a stamp.", "I want to send a letter", "I want to send a letter.", "I want to send a package", "I want to send a package.", "How long will it take?", "How much does it cost?"]
    feedback: "Gebruik I need to buy a stamp, I want to send a letter/package, of How long will it take?"

  en.a1.unit40.lesson04.exercise01.reading_daniel_shipping_choice:
    instruction: "Waarvoor betaalde Daniel om ervoor te zorgen dat zijn pakketje snel aankwam volgens de tekst?"
    correct_option: "express mail"
    distractors: ["regular mail", "a bigger box"]
    accepted_answers: [{value: "express mail", status: correct}]
    feedback: "De tekst zegt: he paid for express mail."
  en.a1.unit40.lesson04.exercise02.reading_leila_book_recipient:
    instruction: "Naar wie stuurde Leila de oude boeken volgens de tekst?"
    correct_option: "parents"
    distractors: ["sister", "grandmother"]
    accepted_answers: [{value: "parents", status: correct}]
    feedback: "De tekst zegt: she went to send some old books to her parents."
  en.a1.unit40.lesson04.exercise03.reading_mia_stamp_habit:
    instruction: "Wat koopt Mia altijd voor de brieven die ze aan haar oma schrijft volgens de tekst?"
    correct_option: "stamp"
    distractors: ["envelope", "postcard"]
    accepted_answers: [{value: "stamp", status: correct}]
    feedback: "De tekst zegt: she always buys a stamp for the letters she writes to her grandmother."
  en.a1.unit40.lesson04.exercise04.write_own_mail_sentence:
    instruction: "Schrijf één zin over het versturen van een brief of pakketje, met 'I send/sent a ...' of 'I need a stamp for ...'."
    accepted_answers: ["I send a package", "I send a package.", "I sent a package", "I sent a package.", "I need a stamp for this letter", "I need a stamp for this letter.", "I need a stamp for this postcard", "I need a stamp for this postcard."]
    feedback: "Gebruik I send/sent a ... of I need a stamp for ..."
