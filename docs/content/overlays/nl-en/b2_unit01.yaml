course:
  title: "Engels B2"
  description: >-
    Engels leren op B2-niveau voor genuanceerde gesprekken, argumenten,
    speculatie en professionele discussie, met uitleg in informeel Nederlands.

units:
  en.b2.unit01.argumentation: {title: "The evidence still supports it"}

lessons:
  en.b2.unit01.lesson01.argument_structure: {title: "Claims, evidence en rebuttals"}
  en.b2.unit01.lesson02.building_an_argument: {title: "I agree there are risks, but..."}
  en.b2.unit01.lesson03.reading_an_argument: {title: "Lezen: een hybrid schedule verdedigen"}
  en.b2.unit01.lesson04.the_argument_dialogue: {title: "The benefits outweigh the risks"}

teaching:
  en.b2.unit01.lesson01.teach.claim: {title: "claim", gloss: "standpunt, bewering", note: "*claim* is het standpunt dat je verdedigt. Het is hier niet een klacht of schadeclaim.", example_gloss: "Haar standpunt is dat het plan moet doorgaan."}
  en.b2.unit01.lesson01.teach.evidence: {title: "evidence", gloss: "bewijs, onderbouwing", note: "*evidence* zijn feiten, cijfers of voorbeelden waarmee je je standpunt ondersteunt.", example_gloss: "Dit voorbeeld geeft Mia bewijs voor haar standpunt."}
  en.b2.unit01.lesson01.teach.counterargument: {title: "counterargument", gloss: "tegenargument", note: "*counterargument* is een punt dat tegen je standpunt ingaat. In het Engels schrijf je het als een woord.", example_gloss: "Daniel brengt een tegenargument naar voren."}
  en.b2.unit01.lesson01.teach.rebut: {title: "rebut", gloss: "weerleggen", note: "*rebut* betekent dat je een tegenargument beantwoordt zonder je eigen standpunt op te geven.", example_gloss: "Mia weerlegt de zorg met bewijs."}
  en.b2.unit01.lesson01.teach.concede: {title: "concede", gloss: "toegeven, erkennen", note: "*concede* betekent dat je erkent dat een deel van het andere punt redelijk is. Dat is niet hetzelfde als je hele standpunt opgeven.", example_gloss: "Je kunt een zorg erkennen zonder je hoofdstandpunt op te geven."}
  en.b2.unit01.lesson01.teach.outweigh: {title: "outweigh", gloss: "zwaarder wegen dan", note: "*outweigh* gebruik je wanneer een voordeel, risico of reden belangrijker is dan iets anders.", example_gloss: "Sterk bewijs kan zwaarder wegen dan een zorg."}

  en.b2.unit01.lesson02.teach.position_with_evidence: {title: "risico erkennen en je standpunt houden", gloss: "Ik ben het ermee eens dat het plan risico's heeft, maar het bewijs pleit er nog steeds voor om door te gaan.", note: "*I agree..., but...* erkent het andere punt eerst. Daarna laat *but the evidence still supports...* zien dat je standpunt blijft staan."}
  en.b2.unit01.lesson02.teach.strongest_reason: {title: "je sterkste reden noemen", gloss: "De sterkste reden is dat de enqueteresultaten consistent waren.", note: "*The strongest reason is that...* introduceert je belangrijkste onderbouwing. Let op de Engelse volgorde na *that*: onderwerp voor werkwoord."}
  en.b2.unit01.lesson02.teach.fair_concern: {title: "een redelijke zorg erkennen", gloss: "Dat is een terechte zorg; maar de data wijzen de andere kant op.", note: "*That is a fair concern; however,...* klinkt professioneel: je erkent de zorg, maar je weerlegt die met data."}
  en.b2.unit01.lesson02.teach.grammar_argument_shape: {title: "een standpunt verdedigen", gloss: "Noem je standpunt, geef bewijs, erken het sterkste tegenpunt en weerleg het. Zinnen als That is a fair concern en However laten je redelijk klinken zonder je standpunt op te geven.", note: "Gebruik geen Nederlandse bijzinvolgorde in Engelse zinnen: *the data points...*, niet *the data in the other direction points*."}

  en.b2.unit01.lesson03.teach.retention: {title: "retention", gloss: "behoud van medewerkers", note: "*retention* betekent hier dat medewerkers blijven in plaats van vertrekken.", example_gloss: "Betere retentie betekent dat minder medewerkers het team verlaten."}
  en.b2.unit01.lesson03.teach.collaboration: {title: "collaboration", gloss: "samenwerking", note: "*collaboration* is samenwerken aan een taak of project. Het is neutraler dan Nederlands 'collaboratie' in historische context.", example_gloss: "Goede samenwerking helpt een team werk af te maken."}
  en.b2.unit01.lesson03.teach.reading_passage: {title: "leestekst: een hybrid schedule verdedigen", gloss: "Mia betoogt dat het bedrijf het hybride rooster volgend kwartaal moet houden. Haar hoofdstandpunt is dat hybride werk de retentie verbetert zonder de prestaties te verlagen. Het sterkste bewijs is de personeelsenquete: medewerkers in hybride teams zeiden minder vaak dat ze naar een andere baan zochten. Het sterkste tegenargument is dat de samenwerking eronder kan lijden als mensen niet elke dag op kantoor zijn. Mia erkent die zorg, maar weerlegt die met projectdata: de hybride teams leverden op tijd, en hun beoordelingsscores waren iets hoger. Om die reden concludeert ze dat de voordelen zwaarder wegen dan de risico's.", note: "De tekst bouwt een volledig argument op: standpunt, bewijs, tegenargument, weerlegging en conclusie."}

  en.b2.unit01.lesson04.teach.q_keep_hybrid: {title: "Mia noemt haar standpunt", gloss: "Mia zegt: ik denk dat we het hybride rooster voor het volgende kwartaal moeten houden.", note: "Mia begint met een duidelijk verdedigbaar standpunt."}
  en.b2.unit01.lesson04.teach.a_strongest_reason: {title: "Daniel vraagt naar de reden", gloss: "Daniel zegt: wat is je sterkste reden?", note: "Daniel vraagt niet om een mening in het algemeen, maar om de belangrijkste onderbouwing."}
  en.b2.unit01.lesson04.teach.q_retention_survey: {title: "Mia geeft bewijs", gloss: "Mia zegt: de sterkste reden is retentie. In de personeelsenquete zeiden mensen die hybride werkten minder vaak dat ze naar een andere baan zochten.", note: "Mia gebruikt enqueteresultaten als bewijs, niet alleen een gevoel."}
  en.b2.unit01.lesson04.teach.a_collaboration_weaker: {title: "Daniel noemt het tegenargument", gloss: "Daniel zegt: sommige managers zeggen dat samenwerking zwakker is wanneer mensen niet elke dag op kantoor zijn.", note: "Dit is het tegenargument dat Mia straks moet beantwoorden."}
  en.b2.unit01.lesson04.teach.q_data_rebuttal: {title: "Mia weerlegt met data", gloss: "Mia zegt: dat is een terechte zorg. Maar de projectdata ondersteunen dat niet. De hybride teams leverden hun werk op tijd, en hun beoordelingsscores waren iets hoger.", note: "*does not support it* gebruikt hier *does* omdat Engels do-support nodig heeft in de ontkenning."}
  en.b2.unit01.lesson04.teach.a_benefits_outweigh: {title: "Daniel vat de positie samen", gloss: "Daniel zegt: dus jouw standpunt is dat de voordelen zwaarder wegen dan de risico's?", note: "*outweigh* geeft de afweging tussen voordelen en risico's."}
  en.b2.unit01.lesson04.teach.q_improve_routines: {title: "Mia sluit af met een oplossing", gloss: "Mia zegt: precies. We moeten vergaderroutines verbeteren, niet het rooster afschaffen.", note: "Mia verdedigt het plan, maar geeft ook een praktische verbetering."}

exercises:
  en.b2.unit01.lesson01.exercise01.choose_claim:
    instruction: "Welk woord betekent het standpunt dat iemand verdedigt?"
    correct_option: "claim"
    distractors: ["evidence", "counterargument", "outweigh"]
    accepted_answers: [{value: "claim", status: "correct"}]
    feedback: "*claim* betekent hier standpunt of bewering."
  en.b2.unit01.lesson01.exercise02.choose_rebut:
    instruction: "Welk woord betekent dat je een tegenpunt beantwoordt en laat zien dat je standpunt blijft staan?"
    correct_option: "rebut"
    distractors: ["concede", "claim", "evidence"]
    accepted_answers: [{value: "rebut", status: "correct"}]
    feedback: "*rebut* betekent weerleggen."
  en.b2.unit01.lesson01.exercise03.match_argument_terms:
    instruction: "Verbind elk Engels woord of elke Engelse uitdrukking met de juiste Nederlandse omschrijving."
    pairs:
      - {left: "claim", right: "standpunt, bewering"}
      - {left: "evidence", right: "bewijs, onderbouwing"}
      - {left: "counterargument", right: "tegenargument"}
      - {left: "rebut", right: "weerleggen"}
      - {left: "concede", right: "toegeven, erkennen"}
      - {left: "outweigh", right: "zwaarder wegen dan"}
    accepted_answers:
      - value:
          - {left: "claim", right: "standpunt, bewering"}
          - {left: "evidence", right: "bewijs, onderbouwing"}
          - {left: "counterargument", right: "tegenargument"}
          - {left: "rebut", right: "weerleggen"}
          - {left: "concede", right: "toegeven, erkennen"}
          - {left: "outweigh", right: "zwaarder wegen dan"}
        status: "correct"
    feedback: "*claim*=standpunt, *evidence*=bewijs, *counterargument*=tegenargument, *rebut*=weerleggen, *concede*=erkennen, *outweigh*=zwaarder wegen."
  en.b2.unit01.lesson01.exercise04.write_counterargument:
    instruction: "Schrijf het Engelse woord voor een tegenpunt dat een standpunt uitdaagt."
    accepted_answers:
      - {value: "counterargument", status: "correct"}
      - {value: "Counterargument", status: "correct"}
    feedback: "*counterargument* schrijf je in het Engels als een woord."
  en.b2.unit01.lesson01.exercise05.write_outweigh:
    instruction: "Schrijf het Engelse werkwoord dat betekent: zwaarder wegen dan een andere factor."
    accepted_answers:
      - {value: "outweigh", status: "correct"}
      - {value: "Outweigh", status: "correct"}
    feedback: "*outweigh* betekent zwaarder wegen dan."

  en.b2.unit01.lesson02.exercise01.choose_concede_rebut:
    instruction: "Welke zin gebruikt precies de vorm 'That is a fair concern; however,...' om eerst een tegenpunt te erkennen en het daarna te weerleggen?"
    correct_option: "That is a fair concern; however, the data points in the other direction."
    distractors: ["The strongest reason is that the survey results were consistent.", "I agree the plan has risks, but the evidence still supports moving forward.", "The evidence still supports moving forward."]
    accepted_answers: [{value: "That is a fair concern; however, the data points in the other direction.", status: "correct"}]
    feedback: "*That is a fair concern; however,...* erkent eerst de zorg en draait daarna naar de weerlegging."
  en.b2.unit01.lesson02.exercise02.choose_strongest_reason:
    instruction: "Welke zin introduceert duidelijk ondersteunend bewijs voor een standpunt?"
    correct_option: "The strongest reason is that the survey results were consistent."
    distractors: ["That is a fair concern; however, the data points in the other direction.", "I agree the plan has risks, but the evidence still supports moving forward.", "Some managers say collaboration is weaker."]
    accepted_answers: [{value: "The strongest reason is that the survey results were consistent.", status: "correct"}]
    feedback: "*The strongest reason is that...* introduceert je belangrijkste onderbouwing."
  en.b2.unit01.lesson02.exercise03.order_evidence_supports:
    instruction: "Zet de woorden in de juiste volgorde voor «het bewijs ondersteunt nog steeds doorgaan»."
    accepted_answers: [{value: ["The", "evidence", "still", "supports", "moving", "forward"], status: "correct"}]
