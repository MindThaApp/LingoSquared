  en.a1.unit63.lesson03.teach.dialogue_line7: {title: "Leila bedankt Daniel", gloss: "Leila zegt: Ja, graag. Dank je voor je hulp.", note: "*Thank you for your help* is een vaste bedankzin."}
  en.a1.unit63.lesson03.teach.dialogue_line8: {title: "Daniel reageert", gloss: "Daniel zegt: Geen probleem.", note: "*No problem* is een korte vriendelijke reactie."}

