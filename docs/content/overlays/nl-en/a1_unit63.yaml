  en.a1.unit63.lesson04.teach.reading_passage: {title: "Tekst: Een behulpzame buur", gloss: "Een behulpzame buur: Leila had een zware blauwe tas. Ze zag Daniel bij de deur en vroeg om hulp. Daniel droeg de tas naar binnen. Leila vroeg hem ook de deur te openen. Daarna legde Daniel de tas op de plank bij de deur. Leila bedankte Daniel voor zijn hulp. Daniel zei: Geen probleem. Later schreef Leila een kort briefje: De blauwe tas ligt op de plank.", note: "*carried* is de verleden tijd van *carry*."}

