    accepted_answers: [{value: [{left: "what you say after doing something wrong", right: "sorry"}, {left: "not on time", right: "late"}, {left: "a reason for a problem", right: "excuse"}, {left: "many cars on the road", right: "traffic"}, {left: "something done wrong", right: "mistake"}, {left: "something that is wrong or difficult", right: "problem"}], status: correct}]
    feedback: "sorry=sorry, late=te laat, excuse=reden, traffic=verkeer, mistake=fout, problem=probleem."
