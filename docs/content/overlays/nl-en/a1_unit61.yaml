  en.a1.unit61.lesson04.teach.reading_passage: {title: "Tekst: Een excuus voor de les", gloss: "Een excuus voor de les: Daniel was te laat voor de les omdat de bus te laat was. Hij ontmoette Mia buiten het klaslokaal. Daniel zei dat het hem speet. Hij zei ook dat hij een fout had gemaakt met de tijd. Mia zei dat het oké was omdat de les om 3.00 uur begon. Daniel stuurde een kort bericht naar de docent. In het bericht stond: Het spijt me dat ik te laat ben. De bus is te laat.", note: "*because* geeft de reden: omdat de bus te laat was."}

exercises:
