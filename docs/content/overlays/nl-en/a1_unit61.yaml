  en.a1.unit61.lesson03.teach.dialogue_line6: {title: "De les begint om drie uur", gloss: "Mia zegt: Het is oké. De les begint om drie uur.", note: "*at three* gebruikt *at* voor een kloktijd."}
  en.a1.unit61.lesson03.teach.dialogue_line7: {title: "Daniel bedankt Mia", gloss: "Daniel zegt: Dank je voor het wachten.", note: "*Thank you for waiting* gebruikt *for* plus de -ing-vorm."}

