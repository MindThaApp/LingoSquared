course:
  title: "Engels B1"
  description: >-
    Engels leren op B1-niveau voor alledaagse gesprekken over verplichtingen,
    mogelijkheden, hypothetische situaties en verhalen, met gedetailleerde
    uitleg in het Nederlands.

units:
  en.b1.unit01.necessity: {title: "Dingen die ik moet, moet van buitenaf en zou moeten doen"}

lessons:
  en.b1.unit01.lesson01.necessity_vocabulary: {title: "Must, have to en should"}
  en.b1.unit01.lesson02.saying_what_you_must_do: {title: "I must, I have to, she has to"}
  en.b1.unit01.lesson03.past_regret_and_prohibition: {title: "Should have, must not, don't have to"}
  en.b1.unit01.lesson04.the_gym_membership_dialogue: {title: "You must not forget again"}

teaching:
  en.b1.unit01.lesson01.teach.must: {title: "must", gloss: "moeten (sterke, persoonlijke verplichting)", note: "*must* drukt een sterke, persoonlijke verplichting uit -- iets dat jij zelf heel belangrijk vindt.", example_gloss: "Ik moet deze taak vandaag afmaken."}
  en.b1.unit01.lesson01.teach.have_to: {title: "have to", gloss: "moeten (verplichting van buitenaf)", note: "*have to* drukt een verplichting uit die van buitenaf komt, bijvoorbeeld een regel of afspraak.", example_gloss: "Ik moet voor vrijdag de huur betalen."}
  en.b1.unit01.lesson01.teach.should: {title: "should", gloss: "zou moeten (aanbeveling)", note: "*should* is een aanbeveling, geen strikte verplichting.", example_gloss: "Je zou snel de tandarts moeten bellen."}
  en.b1.unit01.lesson01.teach.task: {title: "task", gloss: "taak", note: "*task* betekent een taak of klusje dat je moet doen.", example_gloss: "Ik heb nog één taak die ik moet afmaken."}
  en.b1.unit01.lesson01.teach.rent: {title: "rent", gloss: "huur", note: "*rent* betekent het geld dat je betaalt om ergens te wonen.", example_gloss: "De huur moet voor vrijdag betaald zijn."}
  en.b1.unit01.lesson01.teach.appointment: {title: "appointment", gloss: "afspraak", note: "*appointment* betekent een vaste tijd om iemand te ontmoeten, zoals bij de dokter.", example_gloss: "Ik heb deze week een afspraak bij de tandarts."}

  en.b1.unit01.lesson02.teach.must_finish_task: {title: "een sterke verplichting uitdrukken", gloss: "Ik moet deze taak vandaag afmaken.", note: "*I must* drukt een sterke, persoonlijke verplichting uit."}
  en.b1.unit01.lesson02.teach.have_to_pay_rent: {title: "een verplichting van buitenaf uitdrukken", gloss: "Ik moet voor vrijdag de huur betalen.", note: "*I have to* drukt een verplichting uit die van buitenaf komt, zoals een betaaldatum."}
  en.b1.unit01.lesson02.teach.she_has_to_make: {title: "vervoeging bij 'she'", gloss: "Zij moet een afspraak maken.", note: "bij *he/she/it* wordt *have to* -> *has to*."}
  en.b1.unit01.lesson02.teach.you_should_call: {title: "een aanbeveling geven", gloss: "Je zou moeten bellen om de afspraak te bevestigen.", note: "*should* geeft een aanbeveling, geen strikte verplichting zoals *must* of *have to*."}
  en.b1.unit01.lesson02.teach.grammar_agreement: {title: "vervoeging van 'have to'", gloss: "Ik moet gaan. Zij moet gaan. Wij moeten gaan. Zij (meervoud) moeten gaan.", note: "alleen bij *he/she/it* wordt *have* -> *has*; bij alle andere personen blijft het *have to*."}

  en.b1.unit01.lesson03.teach.should_have_called: {title: "spijt over het verleden uitdrukken", gloss: "Ik had eerder moeten bellen.", note: "*should have* + voltooid deelwoord drukt spijt uit over iets dat je niet gedaan hebt.", example_gloss: "Ik had eerder moeten bellen."}
  en.b1.unit01.lesson03.teach.must_not: {title: "must not", gloss: "mag niet (verbod)", note: "*must not* betekent een verbod -- iets dat absoluut niet mag.", example_gloss: "Je mag het niet weer vergeten."}
  en.b1.unit01.lesson03.teach.dont_have_to: {title: "don't have to", gloss: "hoeft niet (geen verplichting)", note: "*don't have to* betekent dat iets niet verplicht is, in tegenstelling tot *must not* (verbod).", example_gloss: "Je hoeft niet te komen als je het druk hebt."}
  en.b1.unit01.lesson03.teach.grammar_past_regret: {title: "verbod versus geen verplichting", gloss: "Ik had moeten bellen. Ik ben het vergeten. Je mag het niet weer vergeten. Je hoeft niet te komen.", note: "*must not* (verbod, absoluut niet) is heel anders dan *don't have to* (geen verplichting, maar wel toegestaan)."}
  en.b1.unit01.lesson03.teach.reading_passage: {title: "leestekst: de sportschool", gloss: "Gisteren vergat Daniel zijn sportschoolabonnement te verlengen. Hij had een herinnering op zijn telefoon moeten instellen. Nu moet hij een boete voor te laat betalen. Hij mag het volgende maand niet weer vergeten.", note: "een korte leestekst over Daniels vergissing en de gevolgen daarvan -- B1-niveau."}

  en.b1.unit01.lesson04.teach.q_renew_gym: {title: "Leila vraagt naar het abonnement", gloss: "Leila zegt: Daniel, heb je je sportschoolabonnement verlengd?", note: "een directe vraag om te controleren of iets al gedaan is."}
  en.b1.unit01.lesson04.teach.a_forgot_should_have: {title: "Daniels antwoord: hij is het vergeten", gloss: "Daniel zegt: oh nee, ik ben het vergeten! Ik had dat vorige week moeten doen.", note: "*I should have done that* drukt spijt uit over iets dat niet gedaan is."}
  en.b1.unit01.lesson04.teach.q_call_today: {title: "Leila waarschuwt Daniel", gloss: "Leila zegt: je moet ze vandaag bellen, anders betaal je een boete voor te laat.", note: "*must* wordt hier gebruikt voor een dringende, persoonlijke waarschuwing."}
  en.b1.unit01.lesson04.teach.a_also_pay_rent: {title: "Daniel noemt meer verplichtingen", gloss: "Daniel zegt: je hebt gelijk. Ik moet ook voor vrijdag de huur betalen, en ik zou ook de tandarts moeten bellen.", note: "Daniel combineert *have to* (verplichting) met *should* (aanbeveling) in één antwoord."}
  en.b1.unit01.lesson04.teach.q_dont_have_to: {title: "Leila stelt Daniel gerust", gloss: "Leila zegt: je hoeft niet alles vandaag te doen. Maar je mag de sportschool niet weer vergeten.", note: "Leila contrasteert *don't have to* (geen verplichting) met *must not* (verbod)."}
  en.b1.unit01.lesson04.teach.a_more_organized: {title: "Daniel neemt zich iets voor", gloss: "Daniel zegt: ik weet het. Ik moet deze maand beter georganiseerd zijn.", note: "*I must be* drukt hier een persoonlijk voornemen uit."}

exercises:
  en.b1.unit01.lesson01.exercise01.listen_word:
    instruction: "Luister en kies het woord dat gezegd wordt."
    correct_option: "appointment"
    distractors: ["must", "have to", "task"]
    accepted_answers: [{value: "appointment", status: "correct"}]
    feedback: "*appointment* betekent afspraak."
  en.b1.unit01.lesson01.exercise02.choose_must_do_word:
    instruction: "Welk woord betekent iets dat je moet doen?"
    correct_option: "task"
    distractors: ["rent", "appointment", "should"]
    accepted_answers: [{value: "task", status: "correct"}]
    feedback: "*task* betekent taak."
  en.b1.unit01.lesson01.exercise03.choose_meeting_time_word:
    instruction: "Welk woord betekent een vaste tijd om iemand te ontmoeten, zoals bij de dokter?"
    correct_option: "appointment"
    distractors: ["task", "rent", "have to"]
    accepted_answers: [{value: "appointment", status: "correct"}]
    feedback: "*appointment* betekent afspraak."
  en.b1.unit01.lesson01.exercise04.match_necessity_words:
    instruction: "Verbind elke betekenis met het juiste Engelse woord."
    accepted_answers:
      - value:
          - {left: "a strong personal obligation", right: "must"}
          - {left: "an obligation, often from outside", right: "have to"}
          - {left: "a recommendation, not a strict obligation", right: "should"}
          - {left: "a job or thing you need to do", right: "task"}
          - {left: "money you pay to live somewhere", right: "rent"}
          - {left: "a fixed time to meet someone", right: "appointment"}
        status: "correct"
    feedback: "*must*=sterke verplichting, *have to*=verplichting van buitenaf, *should*=aanbeveling, *task*=taak, *rent*=huur, *appointment*=afspraak."
  en.b1.unit01.lesson01.exercise05.write_rent:
    instruction: "Schrijf het woord voor geld dat je betaalt om ergens te wonen."
    accepted_answers:
      - {value: "rent", status: "correct"}
      - {value: "Rent", status: "correct"}
    feedback: "*rent* betekent huur."

  en.b1.unit01.lesson02.exercise01.choose_daniels_task:
    instruction: "Daniel zegt dat hij vandaag iets moet afmaken. Wat zegt hij?"
    correct_option: "I must finish this task today."
    distractors: ["I have to pay the rent by Friday.", "She has to make an appointment.", "You should call and confirm the appointment."]
    accepted_answers: [{value: "I must finish this task today.", status: "correct"}]
    feedback: "*I must finish this task today* betekent dat je vandaag deze taak moet afmaken."
  en.b1.unit01.lesson02.exercise02.choose_correct_agreement:
    instruction: "Welke zin gebruikt de juiste werkwoordsvorm bij 'she'?"
    correct_option: "She has to make an appointment."
    distractors: ["She have to make an appointment.", "She must to make an appointment.", "She should to make an appointment."]
    accepted_answers: [{value: "She has to make an appointment.", status: "correct"}]
    feedback: "bij *he/she/it* wordt *have to* -> *has to*: *She has to make an appointment*."
  en.b1.unit01.lesson02.exercise03.order_have_to_pay_rent:
    instruction: "Zet de woorden in de juiste volgorde voor «ik moet voor vrijdag de huur betalen»."
    accepted_answers: [{value: ["I", "have", "to", "pay", "the", "rent", "by", "Friday"], status: "correct"}]
    feedback: "de juiste volgorde is *I have to pay the rent by Friday*."
  en.b1.unit01.lesson02.exercise04.reply_what_must_you_do:
    instruction: "Een vriend vraagt wat je deze week moet doen. Zeg dat je voor vrijdag de huur moet betalen."
    accepted_answers:
      - {value: "I have to pay the rent by Friday.", status: "correct"}
      - {value: "I have to pay the rent by Friday", status: "correct"}
    feedback: "*I have to pay the rent by Friday* betekent dat je voor vrijdag de huur moet betalen."
  en.b1.unit01.lesson02.exercise05.write_she_has_to:
    instruction: "Schrijf dat zij een afspraak moet maken."
    accepted_answers:
      - {value: "She has to make an appointment.", status: "correct"}
      - {value: "She has to make an appointment", status: "correct"}
    feedback: "*She has to make an appointment* betekent dat zij een afspraak moet maken."

  en.b1.unit01.lesson03.exercise01.comprehend_what_daniel_forgot:
    instruction: "Wat vergat Daniel te doen?"
    correct_option: "renew his gym membership"
    distractors: ["pay the rent", "call the dentist", "finish a task at work"]
    accepted_answers: [{value: "renew his gym membership", status: "correct"}]
    feedback: "de tekst zegt *renew his gym membership*."
  en.b1.unit01.lesson03.exercise02.comprehend_what_he_should_have_done:
    instruction: "Wat had Daniel moeten doen?"
    correct_option: "set a reminder on his phone"
    distractors: ["call the gym earlier", "pay a late fee", "ask Leila for help"]
    accepted_answers: [{value: "set a reminder on his phone", status: "correct"}]
    feedback: "de tekst zegt *he should have set a reminder on his phone*."
  en.b1.unit01.lesson03.exercise03.recognize_should_have:
    instruction: "Welke uitdrukking beschrijft een fout of spijt over het verleden?"
    correct_option: "should have called"
    distractors: ["must not", "don't have to", "have to"]
    accepted_answers: [{value: "should have called", status: "correct"}]
    feedback: "*should have* + voltooid deelwoord drukt spijt uit over iets dat niet gedaan is."
  en.b1.unit01.lesson03.exercise04.order_must_not_forget:
    instruction: "Zet de woorden in de juiste volgorde voor «hij mag het niet weer vergeten»."
    accepted_answers: [{value: ["He", "must", "not", "forget", "again"], status: "correct"}]
    feedback: "de juiste volgorde is *He must not forget again*."
  en.b1.unit01.lesson03.exercise05.write_should_have_called:
    instruction: "Schrijf dat je eerder had moeten bellen."
    accepted_answers:
      - {value: "I should have called earlier.", status: "correct"}
      - {value: "I should have called earlier", status: "correct"}
      - {value: "I should've called earlier.", status: "correct"}
      - {value: "I should've called earlier", status: "correct"}
    feedback: "*I should have called earlier* betekent dat je eerder had moeten bellen -- *should've* is de gesproken samentrekking van *should have*."

  en.b1.unit01.lesson04.exercise01.listen_what_daniel_forgot:
    instruction: "Luister naar het gesprek en kies wat Daniel vergat te doen."
    correct_option: "renew his gym membership"
    distractors: ["pay the rent", "call the dentist", "finish a task"]
    accepted_answers: [{value: "renew his gym membership", status: "correct"}]
    feedback: "Leila vraagt of Daniel *renew your gym membership* heeft gedaan."
  en.b1.unit01.lesson04.exercise02.listen_when_daniel_should_have_done_it:
    instruction: "Luister en kies wanneer Daniel dit had moeten doen."
    correct_option: "last week"
    distractors: ["yesterday", "this morning", "next week"]
    accepted_answers: [{value: "last week", status: "correct"}]
    feedback: "Daniel zegt dat hij het *last week* had moeten doen."
  en.b1.unit01.lesson04.exercise03.choose_leilas_warning:
    instruction: "Wat waarschuwt Leila Daniel om niet te doen, volgens het gesprek?"
    correct_option: "you must not forget the gym again"
    distractors: ["you must not pay the rent late", "you must not call the dentist", "you must not finish the task"]
    accepted_answers: [{value: "you must not forget the gym again", status: "correct"}]
    feedback: "Leila zegt *you must not forget the gym again*."
  en.b1.unit01.lesson04.exercise04.order_must_be_more_organized:
    instruction: "Zet de woorden in de juiste volgorde voor «ik moet deze maand beter georganiseerd zijn»."
    accepted_answers: [{value: ["I", "must", "be", "more", "organized", "this", "month"], status: "correct"}]
    feedback: "de juiste volgorde is *I must be more organized this month*."
  en.b1.unit01.lesson04.exercise05.reply_as_daniel:
    instruction: "Leila vraagt: Daniel, heb je je sportschoolabonnement verlengd? Geef Daniels antwoord: zeg dat je het bent vergeten en dat je dat vorige week had moeten doen."
    accepted_answers:
      - {value: "Oh no, I forgot! I should have done that last week.", status: "correct"}
      - {value: "Oh no, I forgot! I should've done that last week.", status: "correct"}
    feedback: "dit antwoord combineert erkennen dat je het vergat met spijt over het verleden -- *should've* is de gesproken samentrekking van *should have*."
  en.b1.unit01.lesson04.exercise06.speak_necessity_dialogue:
    instruction: "Leila zegt: je moet ze vandaag bellen, anders betaal je een boete voor te laat. Antwoord hardop als Daniel: zeg dat ze gelijk heeft, dat je ook voor vrijdag de huur moet betalen, en dat je ook de tandarts zou moeten bellen."
    accepted_answers:
      - {value: "You're right. I also have to pay the rent by Friday, and I should call the dentist too.", status: "correct"}
    feedback: "dit antwoord combineert *have to* (verplichting) en *should* (aanbeveling) in één zin, zoals Daniel dat doet."
