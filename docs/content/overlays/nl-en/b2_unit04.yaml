  en.b2.unit04.lesson04.exercise04.reply_as_simon:
    instruction: "Antwoord met een achtergrondactie en een eerdere gebeurtenis: 'When I arrived, the volunteers were setting up the chairs, but the coordinator had already moved the equipment inside.'"
