  en.b2.unit04.lesson03.exercise04.write_earliest_event:
    instruction: "Schrijf precies: 'The coordinator had moved the equipment inside before Simon arrived.'"
    accepted_answers:
      - {value: "The coordinator had moved the equipment inside before Simon arrived.", status: "correct"}
      - {value: "The coordinator had moved the equipment inside before Simon arrived", status: "correct"}
    feedback: "*had moved* hoort bij iets dat voor een ander verleden moment gebeurde."
  en.b2.unit04.lesson03.exercise05.write_interruption:
    instruction: "Schrijf precies: 'While Simon was checking the sound system, the power went out.'"
    accepted_answers:
      - {value: "While Simon was checking the sound system, the power went out.", status: "correct"}
      - {value: "While Simon was checking the sound system the power went out.", status: "correct"}
    feedback: "Niet *has gone out*: in een verhaal is de hoofdgebeurtenis simple past."

  en.b2.unit04.lesson04.exercise01.choose_prior_event:
    instruction: "Luister naar het gesprek. Welke gebeurtenis was al gebeurd voordat Simon aankwam?"
    correct_option: "the coordinator had already moved the equipment inside"
    distractors: ["the volunteers had already left the venue", "the guests had already entered the room", "the repair crew had already fixed the lights"]
    accepted_answers: [{value: "the coordinator had already moved the equipment inside", status: "correct"}]
