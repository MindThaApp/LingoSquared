  en.b2.unit04.lesson01.timeline_roles: {title: "Background, foreground en prior events"}
  en.b2.unit04.lesson02.shifting_time: {title: "While I was checking, the power went out"}
  en.b2.unit04.lesson03.reading_an_incident_account: {title: "Lezen: het probleem op de locatie"}
  en.b2.unit04.lesson04.the_narrative_dialogue: {title: "Walk me through what happened"}

teaching:
  en.b2.unit04.lesson01.teach.background: {title: "background", gloss: "achtergrond", note: "*background* is wat al bezig was of de context geeft. In Engelse verhalen zet je achtergrond vaak in de past continuous.", example_gloss: "Achtergrondinformatie vertelt wat er al aan de hand was."}
  en.b2.unit04.lesson01.teach.foreground: {title: "foreground", gloss: "hoofdgebeurtenis", note: "*foreground* is de gebeurtenis waar het verhaal naartoe beweegt. Gebruik in het Engels vaak de simple past, niet automatisch present perfect.", example_gloss: "De hoofdgebeurtenis is de belangrijkste gebeurtenis in het verhaal."}
  en.b2.unit04.lesson01.teach.prior: {title: "prior", gloss: "eerder, voorafgaand", note: "*prior* betekent eerder dan een ander moment in het verleden. Dat wordt vaak past perfect: *had moved*.", example_gloss: "Een eerdere gebeurtenis gebeurde voor een andere gebeurtenis in het verleden."}
  en.b2.unit04.lesson01.teach.interrupt: {title: "interrupt", gloss: "onderbreken", note: "*interrupt* gebruik je wanneer een korte gebeurtenis inbreekt in iets dat bezig was.", example_gloss: "Een plots probleem kan een handeling onderbreken."}
  en.b2.unit04.lesson01.teach.ongoing: {title: "ongoing", gloss: "aan de gang, bezig", note: "*ongoing* past goed bij Nederlands *was ... aan het*. In Engels wordt dat vaak *was/were + -ing*.", example_gloss: "Een handeling die aan de gang is, duurt een tijdje."}
  en.b2.unit04.lesson01.teach.chronology: {title: "chronology", gloss: "chronologie, echte volgorde", note: "*chronology* is de echte volgorde van gebeurtenissen, ook als het verhaal ze in een andere volgorde vertelt.", example_gloss: "De chronologie is de echte volgorde van de gebeurtenissen."}

  en.b2.unit04.lesson02.teach.by_the_time: {title: "iets was al eerder gebeurd", gloss: "Tegen de tijd dat ik aankwam, had de coordinator de apparatuur al naar binnen verplaatst.", note: "*had already moved* markeert dat dit voor *I arrived* gebeurde. Nederlands gebruikt hier vaak voltooid verleden of perfectum; Engels heeft past perfect nodig."}
  en.b2.unit04.lesson02.teach.while_checking: {title: "bezig zijn plus onderbreking", gloss: "Terwijl ik het geluidssysteem aan het controleren was, viel de stroom uit.", note: "*was checking* vertaalt het Nederlandse *was aan het controleren*. De onderbreking zelf is simple past: *went out*."}
  en.b2.unit04.lesson02.teach.when_arrived_setting: {title: "aankomen tijdens achtergrondactie", gloss: "Toen ik aankwam, waren de vrijwilligers de stoelen aan het klaarzetten.", note: "Gebruik *were setting up* voor wat bezig was toen de hoofdgebeurtenis gebeurde."}
  en.b2.unit04.lesson02.teach.grammar_shifted_time: {title: "tijdlagen in een verhaal", gloss: "Gebruik past continuous voor achtergrondactie, simple past voor hoofdgebeurtenissen en past perfect voor wat al eerder was gebeurd.", note: "Nederlandse sprekers gebruiken snel het perfectum, maar in verhalend Engels gebruik je vaak de simple past: *the power went out*, niet *has gone out*."}

  en.b2.unit04.lesson03.teach.venue: {title: "venue", gloss: "locatie, plek van een evenement", note: "*venue* is de plaats waar een evenement gebeurt.", example_gloss: "De locatie is de plek waar een evenement plaatsvindt."}
  en.b2.unit04.lesson03.teach.delayed: {title: "delayed", gloss: "vertraagd, uitgesteld", note: "*delayed* betekent dat iets later begint of gebeurt dan gepland.", example_gloss: "Het evenement begon twintig minuten later."}
  en.b2.unit04.lesson03.teach.reading_passage: {title: "leestekst: het locatieprobleem", gloss: "Simon vertelde het verhaal niet strikt chronologisch. Voordat hij bij de locatie aankwam, had de coordinator de apparatuur naar binnen verplaatst omdat er regen werd verwacht. Toen Simon aankwam, waren de vrijwilligers stoelen aan het klaarzetten. Terwijl hij het geluidssysteem aan het controleren was, viel de stroom uit. Hij belde de gebouwbeheerder, die uitlegde dat een reparatieploeg eerder die ochtend in de buurt had gewerkt. Het team stelde de start twintig minuten uit, maar tegen de tijd dat de gasten binnenkwamen, waren de lichten weer aangegaan.", note: "Let op de Engelse tijdlagen: *had moved* voor eerder, *were setting up* voor achtergrond en *went out* voor de hoofdgebeurtenis."}

  en.b2.unit04.lesson04.teach.q_walk_me_through: {title: "Harper vraagt om het verhaal", gloss: "Harper zegt: kun je me stap voor stap vertellen wat er op de locatie is gebeurd?", note: "*walk me through* betekent iemand stap voor stap door een gebeurtenis meenemen."}
  en.b2.unit04.lesson04.teach.a_arrived_volunteers: {title: "Simon combineert tijdlagen", gloss: "Simon zegt: toen ik aankwam, waren de vrijwilligers de stoelen aan het klaarzetten, maar de coordinator had de apparatuur al naar binnen verplaatst omdat er regen werd verwacht.", note: "Een goede B2-vertelling combineert achtergrondactie met een eerdere gebeurtenis."}
  en.b2.unit04.lesson04.teach.q_equipment_safe: {title: "Harper controleert de volgorde", gloss: "Harper zegt: dus de apparatuur was veilig voordat jij daar aankwam?", note: "De vraag gaat om de volgorde: de apparatuur was al veilig voor Simons aankomst."}
  en.b2.unit04.lesson04.teach.a_power_went_out: {title: "Simon noemt de onderbreking", gloss: "Simon zegt: precies. Daarna, terwijl ik het geluidssysteem aan het controleren was, viel de stroom uit.", note: "*while I was checking* is de lopende actie; *the power went out* is de onderbreking."}
  en.b2.unit04.lesson04.teach.q_after_that: {title: "Harper vraagt naar de volgende stap", gloss: "Harper zegt: wat deed je daarna?", note: "*What did you do...?* gebruikt simple past met *did* voor een vraag over een afgeronde stap."}
  en.b2.unit04.lesson04.teach.a_repair_crew: {title: "Simon meldt eerdere achtergrond", gloss: "Simon zegt: ik belde de gebouwbeheerder, en zij vertelde me dat een reparatieploeg eerder die ochtend in de buurt had gewerkt.", note: "*had been working* toont dat dit werk al eerder die ochtend bezig was geweest."}
  en.b2.unit04.lesson04.teach.q_event: {title: "Harper vraagt naar het evenement", gloss: "Harper zegt: en het evenement?", note: "De korte vraag vraagt om het gevolg voor het evenement."}
  en.b2.unit04.lesson04.teach.a_delayed_start: {title: "Simon sluit af", gloss: "Simon zegt: we stelden de start twintig minuten uit, maar tegen de tijd dat de gasten binnenkwamen, waren de lichten weer aangegaan.", note: "*had come back on* gebeurde voor het moment dat de gasten binnenkwamen."}

exercises:
  en.b2.unit04.lesson01.exercise01.choose_background:
    instruction: "Welk woord betekent informatie over wat al gebeurde rondom de hoofdgebeurtenis?"
    correct_option: "background"
    distractors: ["foreground", "prior", "interrupt"]
    accepted_answers: [{value: "background", status: "correct"}]
    feedback: "*background* is de context of lopende situatie rond de hoofdgebeurtenis."
  en.b2.unit04.lesson01.exercise02.choose_prior:
    instruction: "Welk woord betekent eerder dan een andere gebeurtenis in het verleden?"
    correct_option: "prior"
    distractors: ["ongoing", "foreground", "chronology"]
    accepted_answers: [{value: "prior", status: "correct"}]
    feedback: "*prior* betekent voorafgaand of eerder."
  en.b2.unit04.lesson01.exercise03.match_timeline_terms:
    instruction: "Verbind elk Engels woord of elke Engelse uitdrukking met de juiste Nederlandse omschrijving."
    pairs:
      - {left: "background", right: "achtergrond"}
      - {left: "foreground", right: "hoofdgebeurtenis"}
      - {left: "prior", right: "eerder, voorafgaand"}
      - {left: "interrupt", right: "onderbreken"}
      - {left: "ongoing", right: "aan de gang, bezig"}
      - {left: "chronology", right: "chronologie, echte volgorde"}
    accepted_answers:
      - value:
          - {left: "background", right: "achtergrond"}
          - {left: "foreground", right: "hoofdgebeurtenis"}
          - {left: "prior", right: "eerder, voorafgaand"}
          - {left: "interrupt", right: "onderbreken"}
          - {left: "ongoing", right: "aan de gang, bezig"}
          - {left: "chronology", right: "chronologie, echte volgorde"}
        status: "correct"
    feedback: "De rollen blijven duidelijk: achtergrond, hoofdgebeurtenis, eerdere gebeurtenis, onderbreking, lopende actie en echte volgorde."
  en.b2.unit04.lesson01.exercise04.write_chronology:
    instruction: "Schrijf het Engelse woord voor de echte volgorde van gebeurtenissen."
    accepted_answers:
      - {value: "chronology", status: "correct"}
      - {value: "Chronology", status: "correct"}
    feedback: "*chronology* betekent chronologie of echte volgorde."
  en.b2.unit04.lesson01.exercise05.write_foreground:
    instruction: "Schrijf het Engelse woord voor de hoofdgebeurtenis waar het verhaal naartoe beweegt."
    accepted_answers:
      - {value: "foreground", status: "correct"}
      - {value: "Foreground", status: "correct"}
    feedback: "*foreground* is de hoofdlaag van het verhaal."

  en.b2.unit04.lesson02.exercise01.choose_past_perfect:
    instruction: "Welke uitdrukking markeert dat iets al voor de aankomst was gebeurd?"
    correct_option: "the coordinator had already moved the equipment inside"
    distractors: ["the volunteers were setting up the chairs", "the power went out", "I was checking the sound system"]
    accepted_answers: [{value: "the coordinator had already moved the equipment inside", status: "correct"}]
    feedback: "*had already moved* is past perfect: eerder dan *I arrived*."
  en.b2.unit04.lesson02.exercise02.choose_interruption:
    instruction: "Welke zin toont een lopende handeling die door een hoofdgebeurtenis wordt onderbroken?"
    correct_option: "While I was checking the sound system, the power went out."
    distractors: ["By the time I arrived, the coordinator had already moved the equipment inside.", "When I arrived, the volunteers were setting up the chairs.", "The coordinator had already moved the equipment inside."]
    accepted_answers: [{value: "While I was checking the sound system, the power went out.", status: "correct"}]
    feedback: "*was checking* is wat bezig was; *went out* is de onderbreking."
  en.b2.unit04.lesson02.exercise03.order_by_the_time:
    instruction: "Zet de woorden in de juiste volgorde voor «tegen de tijd dat ik aankwam, had de coordinator de apparatuur al naar binnen verplaatst»."
    accepted_answers: [{value: ["By", "the", "time", "I", "arrived", "the", "coordinator", "had", "already", "moved", "the", "equipment", "inside"], status: "correct"}]
    feedback: "De juiste volgorde is *By the time I arrived, the coordinator had already moved the equipment inside*."
  en.b2.unit04.lesson02.exercise04.reply_while_checking:
    instruction: "Schrijf precies deze zin met een onderbroken handeling: 'While I was checking the sound system, the power went out.'"
    accepted_answers:
      - {value: "While I was checking the sound system, the power went out.", status: "correct"}
      - {value: "While I was checking the sound system the power went out.", status: "correct"}
    feedback: "Gebruik *was checking* voor *was aan het controleren* en simple past *went out* voor de gebeurtenis."
  en.b2.unit04.lesson02.exercise05.write_prior_event:
    instruction: "Schrijf precies deze eerdere gebeurtenis met past perfect: 'The coordinator had already moved the equipment inside.'"
    accepted_answers:
      - {value: "The coordinator had already moved the equipment inside.", status: "correct"}
      - {value: "The coordinator had already moved the equipment inside", status: "correct"}
    feedback: "*had already moved* is hier beter dan een Dutch-style perfectumvertaling met *has moved*."

  en.b2.unit04.lesson03.exercise01.choose_earliest_event:
    instruction: "Welke gebeurtenis gebeurde het vroegst in de leestekst?"
    correct_option: "the coordinator had moved the equipment inside"
