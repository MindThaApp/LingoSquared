  en.b2.unit04.lesson04.exercise05.speak_recount:
    instruction: "Vertel hardop het locatie-incident met vier onderdelen: achtergrond, een eerdere gebeurtenis, een onderbroken handeling en een opgelost einde."
    accepted_answers:
