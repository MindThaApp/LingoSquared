    correct_option: "the power went out"
    distractors: ["the rain started suddenly", "the chairs fell over", "the sound check finished early"]
    accepted_answers: [{value: "the power went out", status: "correct"}]
    feedback: "*the power went out* is de korte gebeurtenis die inbreekt in *I was checking*."
  en.b2.unit04.lesson04.exercise03.order_while_power:
    instruction: "Zet de woorden in de juiste volgorde voor «terwijl ik het geluidssysteem aan het controleren was, viel de stroom uit»."
    accepted_answers: [{value: ["while", "I", "was", "checking", "the", "sound", "system", "the", "power", "went", "out"], status: "correct"}]
