  en.b2.unit02.lesson04.exercise05.speak_speculate:
    instruction: "Daniel vraagt: 'So that is a deduction, not just a guess?' Antwoord hardop als Mia met de zin over beperkt bewijs en een systeemstoring."
    accepted_answers:
      - {value: "The evidence is limited, but it points to a system outage.", status: "correct"}
      - {value: "The evidence is limited but it points to a system outage.", status: "correct"}
    feedback: "De zin erkent beperkte zekerheid maar noemt de conclusie."
  en.b2.unit02.lesson04.exercise06.write_present_and_past_speculation:
    instruction: "Schrijf de vier speculatiezinnen met might, may have, must have en cannot have: het dashboard toont misschien oude gegevens; de rapporten zijn 's nachts misschien mislukt; de server is vast vannacht uitgevallen; het kan niet alleen een rapportprobleem zijn geweest."
    accepted_answers:
      - {value: "The dashboard might show old data. The reports may have failed during the night. The server must have gone down overnight. It cannot have been only a report problem.", status: "correct"}
      - {value: "The dashboard might show old data. The reports may have failed during the night. The server must have gone down overnight. It can't have been only a report problem.", status: "correct"}
    feedback: "Deze reeks levert het B2-doel: mogelijke gevolgen, mogelijke oorzaken, sterke conclusie en uitgesloten verklaring."
