course:
  title: "Engels B2"
  description: >-
    Engels leren op B2-niveau voor genuanceerde gesprekken, argumenten,
    speculatie en professionele discussie, met uitleg in informeel Nederlands.

units:
  en.b2.unit02.speculation: {title: "It must have gone down overnight"}

lessons:
  en.b2.unit02.lesson01.certainty_and_deduction: {title: "May, might, must en cannot"}
  en.b2.unit02.lesson02.present_and_past_speculation: {title: "It must have been a system problem"}
  en.b2.unit02.lesson03.reading_an_incident_note: {title: "Lezen: what probably happened?"}
  en.b2.unit02.lesson04.the_speculation_dialogue: {title: "A deduction, not just a guess"}

teaching:
  en.b2.unit02.lesson01.teach.may: {title: "may", gloss: "kan mogelijk, zou kunnen", note: "*may* drukt mogelijkheid uit. Hier betekent het niet toestemming zoals in *May I...?*.", example_gloss: "Dit kan waar zijn."}
  en.b2.unit02.lesson01.teach.might: {title: "might", gloss: "zou kunnen, misschien", note: "*might* drukt een voorzichtige mogelijkheid uit, vaak iets minder zeker dan *may*.", example_gloss: "Dit zou waar kunnen zijn."}
  en.b2.unit02.lesson01.teach.must: {title: "must", gloss: "moet wel, waarschijnlijk zeker", note: "*must* drukt hier een sterke conclusie uit op basis van bewijs, niet een verplichting.", example_gloss: "Dit moet wel waar zijn."}
  en.b2.unit02.lesson01.teach.cannot: {title: "cannot", gloss: "kan niet, kan onmogelijk", note: "*cannot* gebruik je wanneer het bewijs iets uitsluit. Bij verleden tijd wordt dat *cannot have been*.", example_gloss: "Dit kan niet waar zijn."}
  en.b2.unit02.lesson01.teach.deduction: {title: "deduction", gloss: "conclusie op basis van bewijs", note: "*deduction* is redeneren vanuit aanwijzingen, niet zomaar gokken.", example_gloss: "Mia's conclusie is gebaseerd op bewijs."}
  en.b2.unit02.lesson01.teach.guesswork: {title: "guesswork", gloss: "giswerk", note: "*guesswork* is een gok met weinig of geen bewijs.", example_gloss: "Zonder bewijs zou de verklaring giswerk zijn."}
  en.b2.unit02.lesson01.teach.may_might_contrast: {title: "may en might", gloss: "May en might overlappen vaak. Allebei geven ze een mogelijke verklaring; might klinkt vaak iets voorzichtiger.", note: "Vertaal Nederlands *misschien* niet steeds letterlijk met *maybe*. In een B2-zin zijn *may* en *might* vaak netter."}

  en.b2.unit02.lesson02.teach.must_have_gone_down: {title: "sterke conclusie over het verleden", gloss: "De server moet 's nachts zijn uitgevallen, want er zijn geen rapporten gegenereerd.", note: "Nederlands *moet ... zijn geweest* wordt in het Engels *must have* + voltooid deelwoord: *must have gone down*."}
  en.b2.unit02.lesson02.teach.may_have_failed: {title: "mogelijke oorzaak in het verleden", gloss: "De rapporten kunnen tijdens de nacht zijn mislukt.", note: "*may have failed* is een mogelijke oorzaak, geen zekere conclusie."}
  en.b2.unit02.lesson02.teach.might_have_permission: {title: "voorzichtige mogelijkheid", gloss: "Het kan in plaats daarvan een rechtenprobleem zijn geweest.", note: "*might have been* houdt de oorzaak open en klinkt voorzichtiger dan *must have been*."}
  en.b2.unit02.lesson02.teach.cannot_have_only_report: {title: "iets uitsluiten", gloss: "Het kan niet alleen een rapportprobleem zijn geweest.", note: "Nederlands *kan niet ... zijn geweest* wordt hier *cannot have been* of spreektaal *can't have been*."}
  en.b2.unit02.lesson02.teach.grammar_modal_deduction: {title: "modalen voor speculatie", gloss: "Gebruik must be voor een sterke conclusie over nu en must have been voor een sterke conclusie over het verleden. Gebruik may/might voor mogelijkheid nu, en may have/might have voor mogelijkheid in het verleden. Gebruik cannot/cannot have been wanneer bewijs een verklaring uitsluit.", note: "Let op: *must* betekent hier niet *moeten* als verplichting, maar *het moet wel zo zijn* als conclusie."}

  en.b2.unit02.lesson03.teach.outage: {title: "outage", gloss: "storing, uitval", note: "*outage* is een storing waarbij een systeem of dienst niet werkt.", example_gloss: "Een systeemstoring zorgde ervoor dat de rapporten niet draaiden."}
  en.b2.unit02.lesson03.teach.consequence: {title: "consequence", gloss: "gevolg", note: "*consequence* is een gevolg van een oorzaak of probleem.", example_gloss: "Een gevolg is dat het dashboard oude data kan tonen."}
  en.b2.unit02.lesson03.teach.reading_passage: {title: "leestekst: wat is er waarschijnlijk gebeurd?", gloss: "De nachtelijke rapporten draaiden niet, en de monitoringpagina is leeg. Mia zegt dat de server tijdens de nacht moet zijn uitgevallen. Daniel suggereert dat het een rechtenprobleem geweest kan zijn, maar dat kan de lege monitoringpagina niet verklaren. Het financeteam mist mogelijk de ochtendcijfers, en het klantdashboard kan oude data tonen totdat de rapporten opnieuw zijn opgebouwd. Mia is niet helemaal zeker, maar haar verklaring is een conclusie uit het beschikbare bewijs, geen puur giswerk.", note: "De tekst scheidt feiten, mogelijke oorzaken, sterke conclusies, uitgesloten verklaringen en mogelijke gevolgen."}

  en.b2.unit02.lesson04.teach.q_no_reports: {title: "Daniel noemt het feit", gloss: "Daniel zegt: geen van de nachtelijke rapporten is gegenereerd.", note: "Dit is het bekende feit, nog geen speculatie."}
  en.b2.unit02.lesson04.teach.a_server_down: {title: "Mia trekt een sterke conclusie", gloss: "Mia zegt: de server moet 's nachts zijn uitgevallen.", note: "*must have gone down* is een sterke conclusie over het verleden."}
  en.b2.unit02.lesson04.teach.q_permission_issue: {title: "Daniel noemt een mogelijke oorzaak", gloss: "Daniel zegt: het kan in plaats daarvan een rechtenprobleem zijn geweest.", note: "*might have been* houdt de optie open, maar maakt die niet zeker."}
  en.b2.unit02.lesson04.teach.a_cannot_only_report: {title: "Mia sluit een beperkte verklaring uit", gloss: "Mia zegt: misschien, maar de monitoringpagina is ook leeg, dus het kan niet alleen een rapportprobleem zijn geweest.", note: "*cannot have been only...* sluit de verklaring uit omdat het bewijs breder is."}
  en.b2.unit02.lesson04.teach.q_consequences: {title: "Daniel vraagt naar gevolgen", gloss: "Daniel zegt: welke gevolgen moeten we verwachten?", note: "Na de oorzaak komt de vraag naar mogelijke gevolgen."}
  en.b2.unit02.lesson04.teach.a_possible_consequences: {title: "Mia noemt mogelijke gevolgen", gloss: "Mia zegt: het financeteam mist mogelijk de ochtendcijfers, en het klantdashboard kan oude data tonen.", note: "*may be missing* en *might show* geven mogelijke gevolgen, niet zekere feiten."}
  en.b2.unit02.lesson04.teach.q_deduction_guess: {title: "Daniel controleert de zekerheid", gloss: "Daniel zegt: dus dat is een conclusie, niet zomaar een gok?", note: "Daniel vraagt of Mia's redenering op bewijs rust."}
  en.b2.unit02.lesson04.teach.a_evidence_limited: {title: "Mia nuanceert haar conclusie", gloss: "Mia zegt: ja. Het bewijs is beperkt, maar het wijst op een systeemstoring.", note: "B2-speculatie kan sterk zijn en toch de beperking van het bewijs erkennen."}

exercises:
  en.b2.unit02.lesson01.exercise01.choose_deduction:
    instruction: "Welk woord betekent een conclusie op basis van bewijs, niet een willekeurige gok?"
    correct_option: "deduction"
    distractors: ["guesswork", "may", "cannot"]
    accepted_answers: [{value: "deduction", status: "correct"}]
    feedback: "*deduction* betekent redeneren vanuit bewijs."
  en.b2.unit02.lesson01.exercise02.choose_cannot:
    instruction: "Welk modaal werkwoord laat zien dat de spreker iets onmogelijk of bijna onmogelijk vindt?"
    correct_option: "cannot"
    distractors: ["may", "might", "must"]
    accepted_answers: [{value: "cannot", status: "correct"}]
    feedback: "*cannot* sluit een verklaring uit."
  en.b2.unit02.lesson01.exercise03.match_certainty:
    instruction: "Verbind elk Engels woord of elke Engelse uitdrukking met de juiste Nederlandse omschrijving."
    pairs:
      - {left: "may", right: "kan mogelijk, zou kunnen"}
      - {left: "might", right: "zou kunnen, misschien"}
      - {left: "must", right: "moet wel, waarschijnlijk zeker"}
      - {left: "cannot", right: "kan niet, kan onmogelijk"}
      - {left: "deduction", right: "conclusie op basis van bewijs"}
      - {left: "guesswork", right: "giswerk"}
    accepted_answers:
      - value:
          - {left: "may", right: "kan mogelijk, zou kunnen"}
          - {left: "might", right: "zou kunnen, misschien"}
          - {left: "must", right: "moet wel, waarschijnlijk zeker"}
          - {left: "cannot", right: "kan niet, kan onmogelijk"}
          - {left: "deduction", right: "conclusie op basis van bewijs"}
          - {left: "guesswork", right: "giswerk"}
        status: "correct"
    feedback: "*must* is sterk, *may/might* zijn mogelijk, *cannot* sluit uit."
  en.b2.unit02.lesson01.exercise04.write_deduction:
    instruction: "Schrijf het Engelse woord dat betekent: redeneren vanuit bewijs."
    accepted_answers:
      - {value: "deduction", status: "correct"}
      - {value: "Deduction", status: "correct"}
    feedback: "*deduction* betekent conclusie op basis van bewijs."
  en.b2.unit02.lesson01.exercise05.write_guesswork:
    instruction: "Schrijf het Engelse woord voor een gok met weinig of geen bewijs."
    accepted_answers:
      - {value: "guesswork", status: "correct"}
      - {value: "Guesswork", status: "correct"}
    feedback: "*guesswork* betekent giswerk."

  en.b2.unit02.lesson02.exercise01.choose_past_deduction:
    instruction: "Welke zin trekt met *must have* een sterke positieve conclusie over het verleden op basis van bewijs?"
    correct_option: "The server must have gone down overnight because no reports were generated."
    distractors: ["The reports may have failed during the night.", "It might have been a permission issue instead.", "It cannot have been only a report problem."]
    accepted_answers: [{value: "The server must have gone down overnight because no reports were generated.", status: "correct"}]
    feedback: "*must have gone down* is een sterke conclusie over het verleden."
  en.b2.unit02.lesson02.exercise02.choose_weak_past_possibility:
    instruction: "Welke zin gebruikt *might have* voor een voorzichtige mogelijke oorzaak in het verleden?"
    correct_option: "It might have been a permission issue instead."
    distractors: ["The server must have gone down overnight because no reports were generated.", "It cannot have been only a report problem.", "This must be true."]
    accepted_answers: [{value: "It might have been a permission issue instead.", status: "correct"}]
    feedback: "*might have been* is voorzichtige mogelijkheid."
  en.b2.unit02.lesson02.exercise03.order_must_have_gone_down:
    instruction: "Zet de woorden in de juiste volgorde voor «de server moet 's nachts zijn uitgevallen»."
    accepted_answers: [{value: ["The", "server", "must", "have", "gone", "down", "overnight"], status: "correct"}]
    feedback: "De juiste vorm is *must have* + voltooid deelwoord: *The server must have gone down overnight*."
  en.b2.unit02.lesson02.exercise04.reply_must_have:
    instruction: "Er zijn vannacht geen rapporten gemaakt. Trek met 'must have' een sterke conclusie over het verleden: de server is vannacht vast uitgevallen."
    accepted_answers:
      - {value: "The server must have gone down overnight", status: "correct"}
      - {value: "The server must have gone down overnight.", status: "correct"}
    feedback: "*must have gone down* betekent hier: hij moet wel zijn uitgevallen."
  en.b2.unit02.lesson02.exercise05.write_cannot_have:
    instruction: "Schrijf een zin die een enkel rapportprobleem uitsluit, met 'cannot have been'."
    accepted_answers:
      - {value: "It cannot have been only a report problem.", status: "correct"}
      - {value: "It cannot have been only a report problem", status: "correct"}
      - {value: "It can't have been only a report problem.", status: "correct"}
      - {value: "It can't have been only a report problem", status: "correct"}
      - {value: "It cannot have just been a report problem.", status: "correct"}
      - {value: "It cannot have just been a report problem", status: "correct"}
      - {value: "It can't have just been a report problem.", status: "correct"}
      - {value: "It can't have just been a report problem", status: "correct"}
    feedback: "*cannot have been* of *can't have been* sluit een verklaring over het verleden uit."

  en.b2.unit02.lesson03.exercise01.choose_asserted_fact:
    instruction: "Welke uitspraak wordt als feit gepresenteerd, niet als speculatie?"
    correct_option: "The overnight reports did not run"
    distractors: ["the server must have gone down during the night", "it might have been a permission issue", "the dashboard might show old data"]
    accepted_answers: [{value: "The overnight reports did not run", status: "correct"}]
    feedback: "Dat de rapporten niet draaiden is het gegeven feit."
  en.b2.unit02.lesson03.exercise02.choose_speculated_cause:
    instruction: "Welke uitspraak is Mia's sterke conclusie over de oorzaak?"
    correct_option: "the server must have gone down during the night"
    distractors: ["The overnight reports did not run", "it might have been a permission issue", "the dashboard might show old data"]
    accepted_answers: [{value: "the server must have gone down during the night", status: "correct"}]
    feedback: "*must have gone down* markeert de sterke conclusie."
  en.b2.unit02.lesson03.exercise03.match_fact_speculation:
    instruction: "Verbind elk Engels woord of elke Engelse uitdrukking met de juiste Nederlandse omschrijving."
    pairs:
      - {left: "known event", right: "de rapporten zijn niet uitgevoerd"}
      - {left: "strong past deduction", right: "de server moet uitgevallen zijn"}
      - {left: "weaker possible cause", right: "mogelijk was er een probleem met toegangsrechten"}
      - {left: "explanation rejected by evidence", right: "dit verklaart de lege controlepagina niet"}
      - {left: "possible result", right: "het overzicht toont mogelijk oude gegevens"}
    accepted_answers:
      - value:
          - {left: "known event", right: "de rapporten zijn niet uitgevoerd"}
          - {left: "strong past deduction", right: "de server moet uitgevallen zijn"}
          - {left: "weaker possible cause", right: "mogelijk was er een probleem met toegangsrechten"}
          - {left: "explanation rejected by evidence", right: "dit verklaart de lege controlepagina niet"}
          - {left: "possible result", right: "het overzicht toont mogelijk oude gegevens"}
        status: "correct"
    feedback: "Let op het verschil tussen feit, sterke conclusie, mogelijkheid, uitgesloten verklaring en mogelijk gevolg."
  en.b2.unit02.lesson03.exercise04.write_possible_consequence:
    instruction: "Schrijf met 'might' een mogelijk gevolg: het dashboard van de klant laat misschien oude gegevens zien."
    accepted_answers:
      - {value: "The client dashboard might show old data.", status: "correct"}
      - {value: "The client dashboard might show old data", status: "correct"}
      - {value: "The dashboard might show old data.", status: "correct"}
      - {value: "The dashboard might show old data", status: "correct"}
    feedback: "*might show* geeft een mogelijk gevolg."
  en.b2.unit02.lesson03.exercise05.write_deduction_not_guesswork:
    instruction: "Schrijf dat haar uitleg een conclusie is uit het beschikbare bewijs, en geen pure gok."
    accepted_answers:
      - {value: "Her explanation is a deduction from the available evidence, not pure guesswork.", status: "correct"}
      - {value: "Her explanation is a deduction from the available evidence, not pure guesswork", status: "correct"}
      - {value: "Her explanation is a deduction from the available evidence and not pure guesswork.", status: "correct"}
      - {value: "Her explanation is a deduction from the available evidence and not pure guesswork", status: "correct"}
      - {value: "Her explanation is a deduction based on the available evidence, not pure guesswork.", status: "correct"}
      - {value: "Her explanation is a deduction from the available evidence, not just guesswork.", status: "correct"}
    feedback: "Deze zin contrasteert onderbouwde conclusie met giswerk."

  en.b2.unit02.lesson04.exercise01.choose_mia_deduction:
    instruction: "Luister naar het gesprek. Welke zin is Mia's sterke conclusie over de oorzaak?"
    correct_option: "The server must have gone down overnight"
    distractors: ["It might have been a permission issue instead", "The finance team may be missing the morning numbers", "The client dashboard might show old data"]
    accepted_answers: [{value: "The server must have gone down overnight", status: "correct"}]
    feedback: "Mia zegt *The server must have gone down overnight*."
  en.b2.unit02.lesson04.exercise02.listen_possible_consequence:
    instruction: "Luister en kies het mogelijke gevolg dat Mia noemt."
    correct_option: "the client dashboard might show old data"
    distractors: ["it might have been a permission issue", "none of the overnight reports were generated", "what consequences should we expect"]
    accepted_answers: [{value: "the client dashboard might show old data", status: "correct"}]
    feedback: "*might show old data* is een mogelijk gevolg."
  en.b2.unit02.lesson04.exercise03.order_cannot_have:
    instruction: "Zet de woorden in de juiste volgorde voor «het kan niet alleen een rapportprobleem zijn geweest»."
    accepted_answers: [{value: ["it", "cannot", "have", "been", "only", "a", "report", "problem"], status: "correct"}]
    feedback: "De juiste volgorde is *it cannot have been only a report problem*."
  en.b2.unit02.lesson04.exercise04.reply_as_mia:
    instruction: "Daniel zegt dat geen rapporten zijn gegenereerd. Antwoord als Mia met haar sterke conclusie."
    accepted_answers:
