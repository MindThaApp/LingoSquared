exercises:
  en.a2.unit31.lesson01.exercise01.listen_word:
    instruction: "Luister en kies het woord dat gezegd wordt."
    correct_option: "signal problem"
    distractors: ["delay", "cancelled", "alternative"]
    accepted_answers: [{value: "signal problem", status: "correct"}]
    feedback: "*signal problem* betekent seinstoring."
  en.a2.unit31.lesson01.exercise02.choose_no_longer_happening_word:
    instruction: "Welk woord betekent dat een trein of bus helemaal niet meer rijdt?"
    correct_option: "cancelled"
    distractors: ["delay", "alternative", "notice"]
    accepted_answers: [{value: "cancelled", status: "correct"}]
    feedback: "*cancelled* betekent geannuleerd."
  en.a2.unit31.lesson01.exercise03.choose_different_option_word:
    instruction: "Welk woord betekent een andere optie?"
    correct_option: "alternative"
    distractors: ["delay", "cancelled", "signal problem"]
    accepted_answers: [{value: "alternative", status: "correct"}]
    feedback: "*alternative* betekent alternatief."
  en.a2.unit31.lesson01.exercise04.match_disruption_words:
    instruction: "Verbind elke omschrijving met het juiste Engelse woord of de juiste uitdrukking."
    accepted_answers:
      - value:
          - {left: "delay", right: "a wait longer than planned"}
          - {left: "cancelled", right: "no longer happening at all"}
          - {left: "alternative", right: "a different option"}
          - {left: "notice", right: "a written announcement posted for passengers"}
          - {left: "signal problem", right: "a problem with the tracks that causes delays"}
        status: "correct"
    feedback: "Elke omschrijving hoort bij één Engels woord of één Engelse uitdrukking."
  en.a2.unit31.lesson01.exercise05.write_alternative:
    instruction: "Schrijf het woord voor een andere optie."
    accepted_answers:
      - {value: "alternative", status: "correct"}
      - {value: "Alternative", status: "correct"}
    feedback: "*alternative* betekent alternatief."

  en.a2.unit31.lesson02.exercise01.listen_reason_for_delay:
    instruction: "Luister en kies wat je hoort over de trein."
    correct_option: "delayed because of a signal problem"
    distractors: ["cancelled for the rest of the day", "delayed because of the weather", "leaving five minutes early"]
    accepted_answers: [{value: "delayed because of a signal problem", status: "correct"}]
    feedback: "de omroep zegt dat de trein *delayed because of a signal problem* is."
  en.a2.unit31.lesson02.exercise02.choose_polite_delay_question:
    instruction: "Je wilt een stationsmedewerker beleefd vragen waarom je trein vertraagd is. Wat zeg je?"
    correct_option: "I was wondering why the train is delayed."
    distractors: ["Is there another way to get home tonight?", "The new departure time is 6:00.", "Thank you. I'll take the bus instead."]
    accepted_answers: [{value: "I was wondering why the train is delayed.", status: "correct"}]
    feedback: "*I was wondering why...* is een beleefde, indirecte manier om naar een reden te vragen."
  en.a2.unit31.lesson02.exercise03.order_another_way_home:
    instruction: "Zet de woorden in de juiste volgorde voor «is er een andere manier om vanavond thuis te komen?»."
    accepted_answers: [{value: ["Is", "there", "another", "way", "to", "get", "home", "tonight"], status: "correct"}]
    feedback: "de juiste volgorde is *Is there another way to get home tonight*."
  en.a2.unit31.lesson02.exercise04.reply_why_delayed:
    instruction: "De medewerker vraagt waarom de trein vertraagd is. Antwoord dat het door een seinstoring komt."
    accepted_answers:
      - {value: "The train has been delayed because of a signal problem.", status: "correct"}
      - {value: "The train has been delayed because of a signal problem", status: "correct"}
    feedback: "*The train has been delayed because of a signal problem* betekent dat de trein vertraagd is vanwege een seinstoring."
  en.a2.unit31.lesson02.exercise05.write_delay_reason:
    instruction: "Schrijf dat de trein vertraagd is vanwege een seinstoring."
    accepted_answers:
      - {value: "The train has been delayed because of a signal problem.", status: "correct"}
      - {value: "The train has been delayed because of a signal problem", status: "correct"}
    feedback: "*The train has been delayed because of a signal problem* betekent dat de trein vertraagd is vanwege een seinstoring."

  en.a2.unit31.lesson03.exercise01.read_disruption_reason:
    instruction: "Waarom is de trein van 5:15 vertraagd?"
    correct_option: "a signal problem"
    distractors: ["a broken door", "bad weather", "a staff shortage"]
    accepted_answers: [{value: "a signal problem", status: "correct"}]
    feedback: "de tekst zegt *a signal problem*."
  en.a2.unit31.lesson03.exercise02.read_new_departure_time:
    instruction: "Wat is de nieuwe vertrektijd?"
    correct_option: "6:00"
    distractors: ["5:30", "5:15", "6:30"]
    accepted_answers: [{value: "6:00", status: "correct"}]
    feedback: "de tekst zegt *the new departure time is 6:00*."
  en.a2.unit31.lesson03.exercise03.choose_alternative_time:
    instruction: "Hoe laat vertrekt de alternatieve bus?"
    correct_option: "5:30"
    distractors: ["5:15", "6:00", "6:30"]
    accepted_answers: [{value: "5:30", status: "correct"}]
    feedback: "de tekst zegt *a bus is available at 5:30*."
  en.a2.unit31.lesson03.exercise04.order_new_departure_sentence:
    instruction: "Zet de woorden in de juiste volgorde voor «de nieuwe vertrektijd is 6:00»."
    accepted_answers: [{value: ["The", "new", "departure", "time", "is", "6:00"], status: "correct"}]
    feedback: "de juiste volgorde is *The new departure time is 6:00*."
  en.a2.unit31.lesson03.exercise05.write_take_bus_instead:
    instruction: "Schrijf dat je in plaats daarvan de bus neemt."
    accepted_answers:
      - {value: "I will take the bus instead.", status: "correct"}
      - {value: "I will take the bus instead", status: "correct"}
    feedback: "*I will take the bus instead* betekent dat je in plaats daarvan de bus neemt."

  en.a2.unit31.lesson04.exercise01.listen_reason_for_delay_dialogue:
    instruction: "Luister naar het gesprek en kies de reden van de vertraging."
    correct_option: "a signal problem on the tracks"
    distractors: ["a broken door on the train", "bad weather on the tracks", "a staff shortage at the station"]
    accepted_answers: [{value: "a signal problem on the tracks", status: "correct"}]
    feedback: "de medewerker zegt *a signal problem on the tracks*."
  en.a2.unit31.lesson04.exercise02.listen_bus_departure_time:
    instruction: "Luister en kies hoe laat de bus vertrekt."
    correct_option: "5:30"
    distractors: ["5:15", "6:00", "6:30"]
    accepted_answers: [{value: "5:30", status: "correct"}]
    feedback: "de medewerker zegt dat de bus *at 5:30* vertrekt."
  en.a2.unit31.lesson04.exercise03.choose_new_train_time:
    instruction: "Wat is de nieuwe vertrektijd voor de trein?"
    correct_option: "6:00"
    distractors: ["5:15", "5:30", "6:30"]
    accepted_answers: [{value: "6:00", status: "correct"}]
    feedback: "de medewerker zegt *the new departure time is 6:00*."
  en.a2.unit31.lesson04.exercise04.order_can_i_help_question:
    instruction: "Zet de woorden in de juiste volgorde voor «kan ik u helpen?»."
    accepted_answers: [{value: ["Can", "I", "help", "you"], status: "correct"}]
    feedback: "de juiste volgorde is *Can I help you*."
  en.a2.unit31.lesson04.exercise05.reply_as_daniel:
    instruction: "De medewerker zegt: kan ik u helpen? Geef Daniels volledige antwoord: vraag waarom de trein vertraagd is, vraag naar een alternatief, en bedank de medewerker voor de bus."
    accepted_answers:
      - {value: "I was wondering why the train is delayed. Is there another way to get home tonight? Thank you. I'll take the bus instead.", status: "correct"}
      - {value: "I was wondering why the train is delayed. Is there another way to get home tonight? Thank you. I will take the bus instead.", status: "correct"}
    feedback: "dit volledige antwoord combineert de vraag naar de reden, de vraag naar een alternatief en de bedanking -- meerdere momenten uit het gesprek samen."
  en.a2.unit31.lesson04.exercise06.speak_disruption_dialogue:
    instruction: "Antwoord de medewerker hardop in de rol van Daniel."
    accepted_answers:
      - {value: "I was wondering why the train is delayed. Is there another way to get home tonight? Thank you. I'll take the bus instead.", status: "correct"}
      - {value: "I was wondering why the train is delayed. Is there another way to get home tonight? Thank you. I will take the bus instead.", status: "correct"}
    feedback: "dit volledige antwoord dekt alle onderdelen van het gesprek: de reden vragen, een alternatief vragen, en bedanken."
