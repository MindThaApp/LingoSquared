teaching:
  en.a2.unit37.lesson01.teach.video_call: {title: "video call", gloss: "videogesprek", note: "*video call* is een gesprek waarin je elkaar ook ziet; het werkwoord is videobellen.", example_gloss: "Ik heb elke maandag een videogesprek met mijn team."}
  en.a2.unit37.lesson01.teach.camera: {title: "camera", gloss: "camera", note: "*camera* is het deel dat jouw beeld doorgeeft.", example_gloss: "Zet je camera aan voordat de vergadering begint."}
  en.a2.unit37.lesson01.teach.microphone: {title: "microphone", gloss: "microfoon", note: "*microphone* is het deel dat je stem doorgeeft.", example_gloss: "Mijn microfoon stond uit, dus niemand kon me horen."}
  en.a2.unit37.lesson01.teach.connection: {title: "connection", gloss: "verbinding", note: "*connection* is de verbinding tussen je computer en het internet.", example_gloss: "De verbinding was slecht, dus het beeld viel weg."}
  en.a2.unit37.lesson01.teach.mute: {title: "mute", gloss: "dempen", note: "*mute* betekent je geluid uitzetten, zodat de anderen je niet horen.", example_gloss: "Ik demp mijn microfoon als ik zelf niet praat."}
  en.a2.unit37.lesson01.teach.face_to_face: {title: "face to face", gloss: "in levenden lijve", note: "*face to face* betekent in dezelfde ruimte, dus niet via een scherm.", example_gloss: "Sommige vergaderingen zijn beter in levenden lijve dan online."}
  en.a2.unit37.lesson01.teach.grammar_comparison: {title: "vergelijken met faster than en less than", gloss: "Een videogesprek gaat sneller dan een bezoek. Een videogesprek is minder persoonlijk dan een ontmoeting in levenden lijve.", note: "bij korte bijvoeglijke naamwoorden krijg je *-er than* (*faster than*); bij langere gebruik je *less ... than* of *more ... than*."}

  en.a2.unit37.lesson02.teach.video_call_every_monday: {title: "vertellen hoe vaak je videobelt", gloss: "Ik heb elke maandag een videogesprek met mijn team.", note: "*every Monday* betekent elke maandag, dus een vaste gewoonte."}
  en.a2.unit37.lesson02.teach.turn_on_your_camera: {title: "vragen of iemand de camera aanzet", gloss: "Kun je je camera aanzetten?", note: "*turn on* betekent aanzetten; het tegenovergestelde is *turn off*."}
  en.a2.unit37.lesson02.teach.you_were_on_mute: {title: "zeggen dat iemand gedempt stond", gloss: "Sorry, je stond op mute.", note: "*you were on mute* is de vaste zin hiervoor -- ook in het Nederlands zeggen veel mensen gewoon: je stond op mute."}
  en.a2.unit37.lesson02.teach.useful_but_prefer_face_to_face: {title: "je mening geven met een voorkeur", gloss: "Ik vind videogesprekken handig, maar ik ontmoet mensen liever in levenden lijve.", note: "*I think... but I prefer...* geeft eerst je mening en daarna wat je liever hebt."}
  en.a2.unit37.lesson02.teach.grammar_prefer: {title: "prefer X to Y", gloss: "Ik heb liever videogesprekken dan telefoongesprekken. Ik heb liever ontmoetingen in levenden lijve dan videogesprekken.", note: "let op: na *prefer* komt *to*, niet *than* -- *I prefer video calls to phone calls*."}

  en.a2.unit37.lesson03.teach.headphones: {title: "headphones", gloss: "koptelefoon", note: "*headphones* is altijd meervoud in het Engels, ook als je er maar één hebt.", example_gloss: "Ik gebruik een koptelefoon, zodat mijn gezin de vergadering niet hoort."}
  en.a2.unit37.lesson03.teach.leilas_message: {title: "het bericht van Leila", gloss: "Mijn online lessen zijn nu allemaal videogesprekken. Ik zet mijn camera aan, maar ik demp mijn microfoon tot de docent een vraag stelt. Ik gebruik een koptelefoon, omdat mijn verbinding daarmee beter is. Ik vind dat videogesprekken veel tijd besparen, maar ik ontmoet mijn medestudenten toch liever in levenden lijve.", note: "een informeel berichtje van Leila over haar eigen online lessen -- A2-niveau."}
  en.a2.unit37.lesson03.teach.mute_until_question: {title: "vertellen wanneer je je microfoon dempt", gloss: "Ik demp mijn microfoon tot de docent een vraag stelt.", note: "*until* betekent tot op het moment dat iets gebeurt."}

  en.a2.unit37.lesson04.teach.q_lot_of_video_calls: {title: "Leila vraagt naar Daniels werk", gloss: "Leila vraagt: heb je veel videogesprekken op je werk?", note: "*a lot of* betekent veel; je gebruikt het bij zowel telbare als ontelbare woorden."}
  en.a2.unit37.lesson04.teach.a_call_every_monday: {title: "Daniel vertelt over zijn vaste gesprek", gloss: "Daniel zegt: ja, ik heb elke maandag een videogesprek met mijn team.", note: "dezelfde zin die we in les 2 hebben geleerd."}
  en.a2.unit37.lesson04.teach.q_turn_on_camera: {title: "Leila vraagt naar zijn camera", gloss: "Leila vraagt: zet je je camera aan?", note: "een korte vervolgvraag om meer detail te krijgen."}
  en.a2.unit37.lesson04.teach.a_always_but_mute: {title: "Daniels gewoonte tijdens gesprekken", gloss: "Daniel zegt: altijd, maar ik demp mijn microfoon als ik zelf niet praat.", note: "*when I am not speaking* betekent hier: op de momenten dat ik niet praat."}
  en.a2.unit37.lesson04.teach.q_classes_are_video_calls: {title: "Leila vertelt over haar lessen", gloss: "Leila zegt: mijn online lessen zijn nu allemaal videogesprekken.", note: "dit sluit aan op haar lessen op maandag en woensdag uit unit 33."}
  en.a2.unit37.lesson04.teach.a_what_do_you_think: {title: "Daniel vraagt naar haar mening", gloss: "Daniel vraagt: wat vind jij daarvan?", note: "*What do you think about them?* vraagt naar een mening over iets dat net genoemd is."}
  en.a2.unit37.lesson04.teach.q_useful_but_prefer: {title: "Leila geeft haar mening", gloss: "Leila zegt: ik vind videogesprekken handig, maar ik ontmoet mensen liever in levenden lijve.", note: "dezelfde meningszin die we in les 2 hebben geleerd."}
  en.a2.unit37.lesson04.teach.a_agree_faster_less_personal: {title: "Daniel is het met haar eens", gloss: "Daniel zegt: daar ben ik het mee eens. Een videogesprek gaat sneller dan een bezoek, maar het is minder persoonlijk.", note: "*I agree* zeg je om het eens te zijn; daarna geef je meestal je eigen reden."}
  en.a2.unit37.lesson04.teach.q_exactly: {title: "Leila bevestigt", gloss: "Leila zegt: precies.", note: "*Exactly* is een korte manier om te zeggen dat je het helemaal eens bent."}

