  notes: >-
    Draft only. Overlay against the shared en/a1_unit53_bike_rental.yaml
    realization (itself still unreviewed). This unit had NO overlay in any
    direction (nl-en/fa-en/prs-en) before this file -- it was an orphaned
    realization, authored but unreachable by any learner. Two contrastive
    points, deliberately different from the ones already used elsewhere in
    this direction: (1) English *rent* is the same verb for both directions
    (renting something FROM someone and renting something OUT to someone),
    while Dutch splits this into two distinct verbs, huren (to rent from)
    and verhuren (to rent out) -- flagged on the rent teaching card and
    reinforced in the lesson03 dialogue note, since it is the kind of
    interference error a Dutch speaker can make repeatedly (using huren-
    derived instinct in a context where the direction matters); (2) English
    uses the placeholder pronoun *one* after a size adjective to avoid
    repeating the noun ("I need a small one" instead of repeating "bike"),
    while Dutch normally handles this either by repeating the noun or with
    a diminutive suffix ("een kleintje") rather than a separate placeholder
    word -- flagged on the dialogue's two size-request lines (Leila/Mia),
    since both speakers use exactly this pattern back to back. Followed the
    realization's own explicit same-speaker-distractor guidance for
    lesson03.exercise03 (the deposit question): used invented distractors
    ("five dollars"/"thirty dollars"), never "ten dollars" (the Clerk's
    OTHER real fact from the very same dialogue line). No sibling-direction
    overlay exists for this unit in any language (confirmed via a fresh ls
    of docs/content/overlays/{nl-en,fa-en,prs-en}/ before authoring), so
    there was nothing to isolate from, but this file was still drafted
    entirely independently from the target realization and universal
    spine, per the standing rule. Every kind:vocabulary teaching card's
    example_gloss is a faithful Dutch translation of the realization's own
    example sentence; lesson02/03/04 cards carry no example_gloss since
    their realization counterparts declare no example (phrase/dialogue/
    reading cards are exempt per AUTHORING_GUIDE.md #19). Needs the
    mandatory fresh-context review before shipping.

course:
  title: Engels A1
  description: >-
    Engels voor beginners, met heldere uitleg in het Nederlands en aandacht
    voor alledaagse gesprekken.

units:
  en.a1.unit53.bike_rental: {title: "Een fiets huren"}

lessons:
  en.a1.unit53.lesson01.bike_rental_vocabulary: {title: "Woorden om een fiets te huren"}
  en.a1.unit53.lesson02.phrases_for_renting_a_bike: {title: "Zinnen om een fiets te huren"}
  en.a1.unit53.lesson03.dialogue_at_the_rental_shop: {title: "Gesprek: Bij de fietsenverhuur"}
  en.a1.unit53.lesson04.a_bike_ride_along_the_river: {title: "Lezen: Een fietstocht langs de rivier"}

teaching:
  en.a1.unit53.lesson01.teach.rent: {title: "rent", gloss: "huren", note: "*rent* betekent huren. Let op: het Engelse werkwoord *rent* wordt voor beide richtingen gebruikt (iets huren van iemand, en iets verhuren aan iemand) -- het Nederlands heeft twee aparte werkwoorden, huren en verhuren, dus let goed op de context om te weten welke kant op.", example_gloss: "Ik wil een fiets huren."}
  en.a1.unit53.lesson01.teach.deposit: {title: "deposit", gloss: "borg", note: "*deposit* betekent borg -- het geld dat je vooraf betaalt en dat je terugkrijgt als je de fiets ongeschonden terugbrengt.", example_gloss: "De borg is twintig dollar."}
  en.a1.unit53.lesson01.teach.return: {title: "return", gloss: "terugbrengen", note: "*return* betekent hier iets terugbrengen (niet terugkomen).", example_gloss: "Breng de fiets vandaag alstublieft terug."}
  en.a1.unit53.lesson01.teach.hour: {title: "hour", gloss: "uur", note: "*hour* betekent uur.", example_gloss: "Het kost tien dollar per uur."}
  en.a1.unit53.lesson01.teach.size: {title: "size", gloss: "maat", note: "*size* betekent maat.", example_gloss: "Welke maat heeft u nodig?"}
  en.a1.unit53.lesson01.teach.helmet: {title: "helmet", gloss: "helm", note: "*helmet* betekent helm.", example_gloss: "Heeft u een helm?"}

  en.a1.unit53.lesson02.teach.id_like_to_rent_a_bike: {title: "I'd like to rent a bike, please.", gloss: "Ik wil graag een fiets huren, alstublieft.", note: "I'd like to (samentrekking van I would like to) is de beleefde manier om iets te vragen -- vriendelijker dan het rechtstreekse I want."}
  en.a1.unit53.lesson02.teach.how_much_does_it_cost_per_hour: {title: "How much does it cost per hour?", gloss: "Hoeveel kost het per uur?", note: "does it cost gebruikt het hulpwerkwoord does omdat het hoofdwerkwoord cost is -- dezelfde do-support-structuur als bij andere Engelse vragen."}
  en.a1.unit53.lesson02.teach.i_need_a_small_bike: {title: "I need a small bike.", gloss: "Ik heb een kleine fiets nodig.", note: "need + a small bike -- het Engels gebruikt hier gewoon het werkwoord need plus het zelfstandig naamwoord, net als het Nederlandse nodig hebben."}
  en.a1.unit53.lesson02.teach.can_i_have_a_helmet: {title: "Can I have a helmet, please?", gloss: "Mag ik een helm, alstublieft?", note: "Can I have...? is een vaste beleefde manier om iets te vragen in een winkel -- letterlijk 'kan ik hebben', maar het klinkt in het Engels net zo beleefd als het Nederlandse mag ik."}
  en.a1.unit53.lesson02.teach.when_do_i_need_to_return_it: {title: "When do I need to return it?", gloss: "Wanneer moet ik hem terugbrengen?", note: "do I need to -- ook hier weer het hulpwerkwoord do voor de vraagvorm."}
  en.a1.unit53.lesson02.teach.its_ten_dollars_an_hour: {title: "It's ten dollars an hour.", gloss: "Het is tien dollar per uur.", note: "an hour betekent hier per uur -- het lidwoord an heeft de betekenis 'per', net als a bij andere tijdseenheden."}

  en.a1.unit53.lesson03.teach.dialogue_line1: {title: "De verhuurder begroet hen", gloss: "De Verhuurder zegt: Hoi! Waarmee kan ik u vandaag helpen?", note: "How can I help you today? is een vaste beleefde openingszin in winkels en diensten."}
  en.a1.unit53.lesson03.teach.dialogue_line2: {title: "Mia's verzoek", gloss: "Mia zegt: We willen graag twee fietsen huren. We willen langs de rivier fietsen.", note: "We'd like to rent -- opnieuw het werkwoord *rent*, hier voor huren VAN de winkel, niet verhuren."}
  en.a1.unit53.lesson03.teach.dialogue_line3: {title: "De verhuurder vraagt naar de maat", gloss: "De Verhuurder zegt: Natuurlijk. Welke maat heeft u nodig?", note: "What size do you need? gebruikt weer do-support voor de vraagvorm."}
  en.a1.unit53.lesson03.teach.dialogue_line4: {title: "Leila's maat", gloss: "Leila zegt: Ik heb een kleine nodig.", note: "*one* vervangt hier het woord bike, zodat je het niet hoeft te herhalen -- vergelijkbaar met het Nederlandse 'een kleintje', maar in het Engels is one een los woordje in plaats van een verkleiningsuitgang."}
  en.a1.unit53.lesson03.teach.dialogue_line5: {title: "Mia's maat", gloss: "Mia zegt: En ik heb een middelmaat nodig.", note: "Ook hier weer *one* in plaats van bike, net als bij Leila's zin ervoor."}
  en.a1.unit53.lesson03.teach.dialogue_line6: {title: "De prijs en de borg", gloss: "De Verhuurder zegt: Geweldig, hier zijn jullie fietsen. Het is tien dollar per uur, en de borg is twintig dollar.", note: "Deze zin bevat twee losse feiten (het uurtarief en de borg) -- let op dat je ze niet door elkaar haalt."}
  en.a1.unit53.lesson03.teach.dialogue_line7: {title: "Mia vraagt naar het terugbrengen", gloss: "Mia zegt: Wanneer moeten we ze terugbrengen?", note: "them verwijst hier terug naar de fietsen (meervoud)."}
  en.a1.unit53.lesson03.teach.dialogue_line8: {title: "De terugbrengtijd", gloss: "De Verhuurder zegt: Breng ze alstublieft voor vijf uur terug.", note: "by five o'clock betekent voor vijf uur (uiterlijk dat tijdstip, niet exact om vijf uur)."}
  en.a1.unit53.lesson03.teach.dialogue_line9: {title: "Leila bedankt de verhuurder", gloss: "Leila zegt: Geweldig, dank u wel!", note: "Great, thank you! is een korte, vaste manier om een gesprek beleefd af te sluiten."}

  en.a1.unit53.lesson04.teach.reading_passage: {title: "Tekst: Een fietstocht langs de rivier", gloss: "Op een warme middag nodigde Mia Leila uit om samen langs de rivier bij haar appartement te fietsen. Geen van beiden had een fiets, dus gingen ze samen naar een verhuurwinkel. De verhuurder vroeg welke maat ze nodig hadden, en Leila nam een kleine fiets terwijl Mia een middelmaat nam. De huur kostte tien dollar per uur, en de borg was twintig dollar voor beide fietsen. Ze moesten de fietsen voor vijf uur terugbrengen. De tocht langs de rivier was prachtig, en ze zagen mensen die hun hond uitlieten en van het zonnige weer genoten. Ze brachten de fietsen precies op tijd terug en kregen hun borg terug. Daarna vertelden ze Daniel over de tocht, en hij zei dat hij de volgende keer mee wilde.", note: "*owned* is de verleden tijd van own (bezitten) -- Neither of them owned a bike betekent geen van beiden had een fiets."}

exercises:
  en.a1.unit53.lesson01.exercise01.listen_word:
