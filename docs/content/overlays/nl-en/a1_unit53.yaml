      - {left: "deposit", right: "geld dat je vooraf betaalt en terugkrijgt als je iets onbeschadigd inlevert"}
      - {left: "return", right: "iets terugbrengen"}
      - {left: "hour", right: "een tijdseenheid van zestig minuten"}
      - {left: "size", right: "hoe groot of klein iets is"}
      - {left: "helmet", right: "een harde hoofdbeschermer voor tijdens het rijden"}
    accepted_answers:
      - value:
          - {left: "bike", right: "een voertuig met trappers dat je vaak voor korte tijd huurt"}
          - {left: "rent", right: "betalen om iets tijdelijk te gebruiken en het daarna teruggeven"}
          - {left: "deposit", right: "geld dat je vooraf betaalt en terugkrijgt als je iets onbeschadigd inlevert"}
          - {left: "return", right: "iets terugbrengen"}
          - {left: "hour", right: "een tijdseenheid van zestig minuten"}
          - {left: "size", right: "hoe groot of klein iets is"}
          - {left: "helmet", right: "een harde hoofdbeschermer voor tijdens het rijden"}
        status: "correct"
    feedback: "bike=fiets, rent=huren, deposit=borg, return=terugbrengen, hour=uur, size=maat, helmet=helm."
  en.a1.unit53.lesson01.exercise04.order_rent_sentence:
    instruction: "Zet de woorden in de juiste volgorde voor 'Ik wil een fiets huren.'"
    accepted_answers: [{value: ["I", "want", "to", "rent", "a", "bike."], status: correct}]
    feedback: "De juiste volgorde is I want to rent a bike."
  en.a1.unit53.lesson01.exercise05.write_deposit:
    instruction: "Schrijf het woord voor geld dat je vooraf betaalt voor een huur, en later terugkrijgt."
    accepted_answers: [{value: "deposit", status: correct}]
    feedback: "*deposit* betekent borg."

  en.a1.unit53.lesson02.exercise01.listen_phrase:
    instruction: "Luister en kies de genoemde zin."
    correct_option: "How much does it cost per hour?"
    distractors: ["I'd like to rent a bike, please.", "I need a small bike.", "It's ten dollars an hour."]
    accepted_answers: [{value: "How much does it cost per hour?", status: correct}]
    feedback: "How much does it cost per hour? betekent hoeveel kost het per uur?"
  en.a1.unit53.lesson02.exercise02.choose_request_meaning:
    instruction: "Welke zin zegt een klant om te vragen of hij een fiets kan huren?"
    correct_option: "I'd like to rent a bike, please."
    distractors: ["I need a small bike.", "Can I have a helmet, please?", "It's ten dollars an hour."]
    accepted_answers: [{value: "I'd like to rent a bike, please.", status: correct}]
    feedback: "I'd like to rent a bike, please. is de beleefde manier om een fiets te huren."
  en.a1.unit53.lesson02.exercise03.choose_return_question_meaning:
    instruction: "Welke zin vraagt wanneer je de fiets moet terugbrengen?"
    correct_option: "When do I need to return it?"
    distractors: ["How much does it cost per hour?", "I need a small bike.", "Can I have a helmet, please?"]
    accepted_answers: [{value: "When do I need to return it?", status: correct}]
    feedback: "When do I need to return it? vraagt naar het terugbrengmoment."
  en.a1.unit53.lesson02.exercise04.order_price_sentence:
    instruction: "Zet de woorden in de juiste volgorde voor 'Het is tien dollar per uur.'"
    accepted_answers: [{value: ["It's", "ten", "dollars", "an", "hour."], status: correct}]
    feedback: "De juiste volgorde is It's ten dollars an hour."
  en.a1.unit53.lesson02.exercise05.translate_helmet_request:
    instruction: "Vertaal: 'Mag ik een helm, alstublieft?'"
    accepted_answers:
      - {value: "Can I have a helmet, please?", status: correct}
      - {value: "Can I have a helmet, please", status: correct}
    feedback: "Can I have a helmet, please? gebruikt can voor een beleefd verzoek."

  en.a1.unit53.lesson03.exercise01.comprehension_reason:
    instruction: "Waarom willen Mia en Leila fietsen huren volgens het gesprek?"
    correct_option: "to ride along the river"
    distractors: ["to go to work", "to visit a friend"]
    accepted_answers: [{value: "to ride along the river", status: correct}]
    feedback: "Mia zegt: We want to ride along the river."
  en.a1.unit53.lesson03.exercise02.comprehension_leila_size:
    instruction: "Welke maat fiets heeft Leila nodig volgens het gesprek?"
    correct_option: "small"
    distractors: ["medium", "large"]
    accepted_answers: [{value: "small", status: correct}]
    feedback: "Leila zegt: I need a small one."
  en.a1.unit53.lesson03.exercise03.listen_dialogue_deposit:
    instruction: "Hoeveel is de borg volgens het gesprek?"
    correct_option: "twenty dollars"
    distractors: ["five dollars", "thirty dollars"]
    accepted_answers: [{value: "twenty dollars", status: correct}]
    feedback: "De Verhuurder zegt: the deposit is twenty dollars."
  en.a1.unit53.lesson03.exercise04.respond_own_bike_statement:
    instruction: "Zeg welke maat Leila of Mia nodig heeft, of zeg hoeveel de borg kost."
    accepted_answers: ["I need a small one", "I need a small one.", "I need a medium one", "I need a medium one.", "It's ten dollars an hour", "It's ten dollars an hour.", "The deposit is twenty dollars", "The deposit is twenty dollars.", "Please return them by five o'clock", "Please return them by five o'clock."]
    feedback: "Gebruik I need a small/medium one, It's ten dollars an hour, of The deposit is twenty dollars."

  en.a1.unit53.lesson04.exercise01.reading_rental_reason:
    instruction: "Waarom gingen Mia en Leila naar een verhuurwinkel volgens de tekst?"
    correct_option: "neither of them owned a bike"
    distractors: ["they wanted a new hobby", "their bikes were broken"]
    accepted_answers: [{value: "neither of them owned a bike", status: correct}]
    feedback: "De tekst zegt: Neither of them owned a bike."
  en.a1.unit53.lesson04.exercise02.reading_return_time:
    instruction: "Hoe laat moesten ze de fietsen volgens de tekst terugbrengen?"
    correct_option: "five o'clock"
    distractors: ["four o'clock", "six o'clock"]
    accepted_answers: [{value: "five o'clock", status: correct}]
    feedback: "De tekst zegt: they had to return the bikes by five o'clock."
  en.a1.unit53.lesson04.exercise03.reading_told_daniel:
    instruction: "Aan wie vertelden ze volgens de tekst over de fietstocht?"
    correct_option: "Daniel"
    distractors: ["Mr. Lopez", "the Rental Clerk"]
    accepted_answers: [{value: "Daniel", status: correct}]
    feedback: "De tekst zegt: they told Daniel about the ride."
  en.a1.unit53.lesson04.exercise04.write_own_bike_ride_message:
    instruction: "Schrijf een kort bericht: zeg welke maat fiets Leila nam, en zeg hoe laat ze de fietsen terugbrachten."
    accepted_answers: ["Leila took a small bike, and they returned the bikes by five o'clock.", "Leila took a small bike. They returned the bikes by five o'clock.", "Leila took a small bike and they returned the bikes by five o'clock."]
    feedback: "Gebruik Leila took a small bike, and they returned the bikes by five o'clock."
