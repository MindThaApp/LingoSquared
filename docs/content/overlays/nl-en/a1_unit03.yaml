  en.a1.unit03.lesson04.teach.opening: {title: "Daniel vraagt de prijs", gloss: "Daniel: Hoeveel kost dit?", note: "How much is this? vraagt naar de prijs van één ding."}
  en.a1.unit03.lesson04.teach.price_five: {title: "Vijf dollar", gloss: "Leila: Het is vijf dollar.", note: "It's five dollars. is het antwoord op de prijs van één ding."}
  en.a1.unit03.lesson04.teach.ask_apples: {title: "Vragen naar de prijs van de appels", gloss: "Daniel vraagt ook naar de prijs van de appels", note: "Omdat apples meervoud is, gebruik je are in plaats van is: how much are the apples?"}
  en.a1.unit03.lesson04.teach.price_two: {title: "Twee dollar", gloss: "Leila zegt: Ze kosten twee dollar.", note: "Omdat het over appels (meervoud) gaat, gebruik je They're, niet It's."}
  en.a1.unit03.lesson04.teach.ask_shop_age: {title: "Vragen naar de leeftijd van de winkel", gloss: "Daniel vraagt hoe oud de winkel is", note: "how old is this shop wordt, net als bij mensen, gebruikt om te vragen hoe lang iets al bestaat."}
  en.a1.unit03.lesson04.teach.shop_age: {title: "Twintig jaar oud", gloss: "Leila zegt dat de winkel twintig jaar bestaat", note: "It's twenty years old betekent hier dat de winkel al twintig jaar bestaat, niet de leeftijd van een persoon."}

