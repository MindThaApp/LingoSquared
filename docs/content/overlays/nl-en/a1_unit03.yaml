  en.a1.unit03.lesson02.teach.eleven: {title: "Eleven", gloss: "elf", note: "eleven betekent elf/11; heeft een eigen vorm, geen samenstelling van ten+one.", example_gloss: "Ik woon op huisnummer elf."}
  en.a1.unit03.lesson02.teach.twelve: {title: "Twelve", gloss: "twaalf", note: "twelve betekent twaalf/12; ook onregelmatig, net als het Nederlandse twaalf.", example_gloss: "Ik woon op huisnummer twaalf."}
  en.a1.unit03.lesson02.teach.thirteen: {title: "Thirteen", gloss: "dertien", note: "thirteen betekent dertien/13; vanaf hier krijgt het Engels het achtervoegsel -teen.", example_gloss: "Ik woon op huisnummer dertien."}
  en.a1.unit03.lesson02.teach.fifteen: {title: "Fifteen", gloss: "vijftien", note: "fifteen betekent vijftien/15; onregelmatig gevormd uit five: je zegt fif- (fifteen), niet fiveteen.", example_gloss: "Ik woon op huisnummer vijftien."}
  en.a1.unit03.lesson02.teach.twenty: {title: "Twenty", gloss: "twintig", note: "twenty betekent twintig/20.", example_gloss: "Ik woon op huisnummer twintig."}
  en.a1.unit03.lesson02.teach.twenty_one: {title: "Twenty-one", gloss: "eenentwintig", note: "Let op: het Engels zegt het tiental EERST en dan het eental (twenty-one = twintig-een), precies omgekeerd aan het Nederlands, waar je een-en-twintig zegt (eental eerst). Dit is de meest voorkomende fout van Nederlandstalige leerders bij Engelse getallen boven twintig."}
  en.a1.unit03.lesson02.teach.thirty: {title: "Thirty", gloss: "dertig", note: "thirty betekent dertig/30; onregelmatig gevormd uit three (thir- i.p.v. three-).", example_gloss: "Dat kost dertig dollar."}
  en.a1.unit03.lesson02.teach.forty: {title: "Forty", gloss: "veertig", note: "forty betekent veertig/40; let op de spelling zonder u (niet fourty), hoewel four wel een u heeft.", example_gloss: "Dat kost veertig dollar."}
  en.a1.unit03.lesson02.teach.fifty: {title: "Fifty", gloss: "vijftig", note: "fifty betekent vijftig/50.", example_gloss: "Dat kost vijftig dollar."}
  en.a1.unit03.lesson02.teach.hundred: {title: "One hundred", gloss: "honderd", note: "one hundred betekent honderd/100."}

  en.a1.unit03.lesson03.teach.how_old: {title: "How old are you?", gloss: "Hoe oud ben je/bent u?", note: "How old are you? is de gebruikelijke Engelse vraag naar iemands leeftijd."}
  en.a1.unit03.lesson03.teach.im_25: {title: "I'm twenty-five years old.", gloss: "Ik ben vijfentwintig jaar oud.", note: "Net als bij losse getallen staat het tiental eerst: twenty-five, niet five-and-twenty. In een volledig antwoord kun je years old toevoegen; het kortere I'm twenty-five is in spreektaal ook natuurlijk."}
  en.a1.unit03.lesson03.teach.how_much: {title: "How much is this?", gloss: "Hoeveel kost dit?", note: "How much is this? is de standaardvraag naar de prijs van iets."}
  en.a1.unit03.lesson03.teach.its_ten_dollars: {title: "It's ten dollars.", gloss: "Het is tien dollar.", note: "It's ten dollars. is het gewone antwoord op een prijsvraag."}
  en.a1.unit03.lesson03.teach.phone_question: {title: "What's your phone number?", gloss: "Wat is je/uw telefoonnummer?", note: "What's your phone number? vraagt naar een telefoonnummer."}
  en.a1.unit03.lesson03.teach.phone_answer: {title: "It's five-five-five, one-two-three-four.", gloss: "Het is vijf-vijf-vijf, een-twee-drie-vier.", note: "In het Engels wordt een telefoonnummer meestal cijfer voor cijfer genoemd, net als in het Nederlands vaak ook gebeurt, maar dan zonder de Nederlandse gewoonte om cijfers soms per twee te groeperen."}

  en.a1.unit03.lesson04.teach.market: {title: "Market", gloss: "markt", note: "market betekent markt.", example_gloss: "We zijn op de markt."}
