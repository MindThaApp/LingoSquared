  en.a1.unit32.lesson02.teach.name_is: {title: "Her name is Luna.", gloss: "Ze heet Luna.", note: "In het Engels gebruik je her/his (en she/he) voor een dier zodra het geslacht bekend is. Het Nederlands gebruikt voor huisdieren vaak het (onzijdig), vooral bij jonge dieren of als het geslacht er niet toe doet -- Her name is Luna verwijst dus specifiek naar een vrouwelijk dier."}
  en.a1.unit32.lesson02.teach.play: {title: "play", gloss: "spelen", note: "*play* betekent spelen.", example_gloss: "Mijn hond speelt graag."}
  en.a1.unit32.lesson02.teach.walk: {title: "walk", gloss: "wandelen / uitlaten", note: "*walk* betekent hier je huisdier uitlaten.", example_gloss: "Ik laat mijn hond elke dag uit."}
  en.a1.unit32.lesson02.teach.friendly: {title: "friendly", gloss: "vriendelijk", note: "*friendly* betekent vriendelijk.", example_gloss: "Haar kat is erg vriendelijk."}
  en.a1.unit32.lesson02.teach.small: {title: "small", gloss: "klein", note: "*small* betekent klein.", example_gloss: "De vis is klein."}

  en.a1.unit32.lesson03.teach.dialogue_line1: {title: "Daniels vraag", gloss: "Daniel vraagt: Mia, heb je huisdieren?", note: "any in de vraag heeft geen apart Nederlands woord, maar mag in het Engels niet weggelaten worden."}
  en.a1.unit32.lesson03.teach.dialogue_line2: {title: "Mia's antwoord", gloss: "Mia zegt: Ja, ik heb een kat. Ze heet Luna.", note: "She/her voor de kat, omdat het geslacht (vrouwelijk) bekend is -- anders dan het Nederlandse het."}
  en.a1.unit32.lesson03.teach.dialogue_line3: {title: "Daniels vervolgvraag", gloss: "Daniel zegt: Wat leuk! Speelt ze graag?", note: "Does is hier het hulpwerkwoord bij she (do-support), net als bij de vragen in unit 31."}
  en.a1.unit32.lesson03.teach.dialogue_line4: {title: "Mia's antwoord", gloss: "Mia zegt: Ja, ze speelt graag met een bal. En jij?", note: "What about you? is een korte, natuurlijke manier om dezelfde vraag aan de ander terug te stellen."}
  en.a1.unit32.lesson03.teach.dialogue_line5: {title: "Daniels antwoord", gloss: "Daniel zegt: Ik heb een kleine vis, maar ik wil een hond.", note: "but verbindt hier twee tegenovergestelde ideeën: hij heeft al een huisdier, maar wil een ander soort dier."}

  en.a1.unit32.lesson04.teach.reading_passage: {title: "Tekst over Leila en Daniel", gloss: "Leila heeft een hond die Max heet. Hij is groot en heel vriendelijk. Ze wandelt elke ochtend met hem. Daniel heeft geen hond, maar hij heeft een kleine vis. De vis hoeft niet uitgelaten te worden, maar Daniel kijkt toch graag hoe hij zwemt.", note: "He voor Max, omdat het een mannelijk dier is -- opnieuw she/he op basis van het echte geslacht, niet het Nederlandse het."}

