  en.a1.unit44.lesson02.teach.leaves_change_color: {title: "the leaves change color", gloss: "de bladeren verkleuren", note: "*the leaves change color* betekent de bladeren verkleuren.", example_gloss: "In de herfst verkleuren de bladeren."}
  en.a1.unit44.lesson02.teach.it_snows_a_lot: {title: "it snows a lot", gloss: "het sneeuwt veel", note: "*it snows a lot* betekent het sneeuwt veel.", example_gloss: "Het sneeuwt veel in de winter."}
  en.a1.unit44.lesson02.teach.flowers_bloom: {title: "flowers bloom", gloss: "bloemen bloeien", note: "*flowers bloom* betekent bloemen bloeien.", example_gloss: "Bloemen bloeien in de lente."}
  en.a1.unit44.lesson02.teach.whats_your_favorite_season: {title: "What's your favorite season?", gloss: "Wat is je lievelingsseizoen?", note: "Let op: Nederlands zegt altijd 'in de + seizoen', maar Engels is niet zo consistent -- in the summer/in the fall/in the winter, maar meestal gewoon 'in spring' zonder lidwoord."}
  en.a1.unit44.lesson02.teach.my_favorite_season_is: {title: "My favorite season is fall.", gloss: "Mijn lievelingsseizoen is de herfst.", note: "My favorite season is ... is de vaste manier om een voorkeur te noemen."}

  en.a1.unit44.lesson03.teach.dialogue_line1: {title: "Mia's vraag", gloss: "Mia vraagt: Wat is jouw lievelingsseizoen, Leila?", note: "What's your favorite ...? vraagt naar iemands voorkeur."}
  en.a1.unit44.lesson03.teach.dialogue_line2: {title: "Leila's antwoord", gloss: "Leila zegt: De herfst. De bladeren verkleuren, en het is heerlijk weer om buiten te schilderen.", note: "great weather for painting outside betekent heerlijk weer om buiten te schilderen."}
  en.a1.unit44.lesson03.teach.dialogue_line3: {title: "Mia's reactie", gloss: "Mia zegt: Dat klinkt fijn. Mijn lievelingsseizoen is de lente.", note: "My favorite season is spring betekent mijn lievelingsseizoen is de lente."}
  en.a1.unit44.lesson03.teach.dialogue_line4: {title: "Leila's vraag", gloss: "Leila vraagt: Waarom de lente?", note: "Why + seizoen? is een korte manier om naar de reden te vragen."}
  en.a1.unit44.lesson03.teach.dialogue_line5: {title: "Mia's antwoord", gloss: "Mia zegt: De bloemen bloeien, en ik hou ervan om er foto's van te maken voor mijn fotografieles.", note: "I love taking photos betekent ik hou ervan om foto's te maken."}
  en.a1.unit44.lesson03.teach.dialogue_line6: {title: "Leila's vraag", gloss: "Leila zegt: Dat is logisch! Is het warm of koud waar jij je foto's maakt in de lente?", note: "That makes sense! is een natuurlijke reactie op een goede verklaring."}
  en.a1.unit44.lesson03.teach.dialogue_line7: {title: "Mia's antwoord", gloss: "Mia zegt: Meestal warm, met een beetje regen. Perfect om buiten te wandelen.", note: "with a little rain betekent met een beetje regen."}

  en.a1.unit44.lesson04.teach.reading_passage: {title: "Tekst over drie lievelingsseizoenen", gloss: "Daniel, Leila en Mia hebben allemaal een ander lievelingsseizoen. Daniels lievelingsseizoen is de zomer. Hij houdt van voetballen en hardlopen als het weer warm en zonnig is. Leila's lievelingsseizoen is de herfst, omdat ze graag de bladeren schildert terwijl ze verkleuren. Mia's lievelingsseizoen is de lente. Ze maakt foto's van de bloemen voor haar fotografieles. Ook al houden ze alle drie van een ander seizoen, ze vinden altijd tijd om samen van de buitenlucht te genieten.", note: "even though betekent ook al / hoewel."}

exercises:
  en.a1.unit44.lesson01.exercise01.listen_word:
    instruction: "Luister en kies het genoemde seizoen."
    correct_option: "fall"
    distractors: ["spring", "summer", "winter"]
    accepted_answers: [{value: "fall", status: correct}]
    feedback: "*fall* betekent herfst."
  en.a1.unit44.lesson01.exercise02.choose_winter_meaning:
    instruction: "Welk seizoen is het koudst, met sneeuw?"
    correct_option: "winter"
    distractors: ["spring", "summer", "fall"]
    accepted_answers: [{value: "winter", status: correct}]
    feedback: "*winter* betekent winter."
  en.a1.unit44.lesson01.exercise03.match_season_words:
    instruction: "Verbind elke omschrijving met het juiste seizoen."
    accepted_answers: [{value: [{left: "flowers bloom", right: "spring"}, {left: "it's hot, and people go to the beach", right: "summer"}, {left: "the leaves change color", right: "fall"}, {left: "it often snows", right: "winter"}, {left: "a period of the year with its own typical weather", right: "season"}], status: correct}]
    feedback: "spring=lente, summer=zomer, fall=herfst, winter=winter, season=seizoen."
  en.a1.unit44.lesson01.exercise04.order_winter_sentence:
    instruction: "Zet de woorden in de juiste volgorde voor 'Het sneeuwt in de winter.'"
    accepted_answers: [{value: ["It", "snows", "in", "winter."], status: correct}]
    feedback: "De juiste volgorde is It snows in winter."
