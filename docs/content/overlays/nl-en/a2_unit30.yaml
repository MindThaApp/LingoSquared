course:
  title: "Engels A2"
  description: "Engels leren op A2-niveau voor formelere situaties, met gedetailleerde uitleg in het Nederlands."

units:
  en.a2.unit30.job_interview: {title: "Een sollicitatiegesprek voeren"}

lessons:
  en.a2.unit30.lesson01.interview_vocabulary: {title: "Ervaring, functie en sterke punten"}
  en.a2.unit30.lesson02.talking_about_experience_and_availability: {title: "Praten over je ervaring en beschikbaarheid"}
  en.a2.unit30.lesson03.reading_a_job_posting: {title: "Een vacature lezen"}
  en.a2.unit30.lesson04.interview_dialogue: {title: "Het sollicitatiegesprek"}

teaching:
  en.a2.unit30.lesson01.teach.experience: {title: "experience", gloss: "ervaring", note: "*experience* betekent ervaring.", example_gloss: "Ik heb twee jaar ervaring in marketing."}
  en.a2.unit30.lesson01.teach.position: {title: "position", gloss: "functie", note: "*position* betekent de functie of baan bij een bedrijf.", example_gloss: "Deze functie is voor een marketingcoördinator."}
  en.a2.unit30.lesson01.teach.availability: {title: "availability", gloss: "beschikbaarheid", note: "*availability* betekent de tijden waarop je beschikbaar bent.", example_gloss: "De interviewer vroeg naar mijn beschikbaarheid."}
  en.a2.unit30.lesson01.teach.strength: {title: "strength", gloss: "sterk punt", note: "*strength* betekent iets waar je goed in bent.", example_gloss: "Een van mijn sterke punten is dat ik georganiseerd ben."}
  en.a2.unit30.lesson01.teach.requirement: {title: "requirement", gloss: "vereiste", note: "*requirement* betekent iets dat verplicht is voor de functie.", example_gloss: "Twee jaar ervaring is een vereiste voor deze functie."}

  en.a2.unit30.lesson02.teach.two_years_experience: {title: "je ervaring beschrijven", gloss: "Ik heb twee jaar ervaring in social media marketing.", note: "deze zin gebruik je om je werkervaring te beschrijven tijdens een sollicitatiegesprek."}
  en.a2.unit30.lesson02.teach.one_strength_organized: {title: "een sterk punt noemen", gloss: "Een van mijn sterke punten is dat ik georganiseerd ben.", note: "*One of my strengths is...* is een standaardmanier om een sterk punt te noemen in een sollicitatiegesprek."}
  en.a2.unit30.lesson02.teach.available_next_monday: {title: "je beschikbaarheid noemen", gloss: "Ik ben beschikbaar om aanstaande maandag te beginnen.", note: "*I'm available to start...* gebruik je om te zeggen wanneer je kunt beginnen."}

  en.a2.unit30.lesson03.teach.resume: {title: "resume", gloss: "cv", note: "*resume* betekent cv (curriculum vitae).", example_gloss: "Breng alstublieft uw cv mee naar het gesprek."}
  en.a2.unit30.lesson03.teach.deadline: {title: "deadline", gloss: "deadline", note: "*deadline* betekent de uiterste datum waarop iets af moet zijn.", example_gloss: "Ik haal altijd mijn deadlines op mijn werk."}
  en.a2.unit30.lesson03.teach.posting_text: {title: "vacaturetekst", gloss: "Bright Path Marketing zoekt een marketingcoördinator. Vereisten: twee jaar ervaring, sterke schrijfvaardigheden, en beschikbaarheid om direct te beginnen. Breng alstublieft uw cv mee naar het gesprek.", note: "dit is een echte, formele vacaturetekst met vereisten en een instructie -- A2-niveau."}
  en.a2.unit30.lesson03.teach.i_meet_deadlines: {title: "over werkstijl vertellen", gloss: "Ik haal mijn deadlines, en ik werk goed in een team.", note: "*I meet deadlines* en *I work well in a team* zijn nuttige zinnen om je werkstijl te beschrijven."}

  en.a2.unit30.lesson04.teach.q_tell_me_experience: {title: "de interviewer vraagt naar ervaring", gloss: "de interviewer zegt: bedankt dat je vandaag gekomen bent. Kun je iets vertellen over je ervaring?", note: "*Thank you for coming in today* is een beleefde opening van een sollicitatiegesprek."}
  en.a2.unit30.lesson04.teach.a_two_years_managed_team: {title: "Mia's antwoord over ervaring", gloss: "Mia zegt: ik heb twee jaar ervaring in social media marketing. Ik heb ook een klein team aangestuurd.", note: "dezelfde ervaringszin die we in les 2 hebben geleerd, met een extra detail over teamleiding."}
  en.a2.unit30.lesson04.teach.q_what_strength: {title: "vragen naar een sterk punt", gloss: "de interviewer zegt: dat is geweldig. Wat is een van je sterke punten?", note: "de interviewer reageert positief voordat hij de volgende vraag stelt."}
  en.a2.unit30.lesson04.teach.a_organized_deadlines: {title: "Mia's antwoord over haar sterke punt", gloss: "Mia zegt: ik ben erg georganiseerd, en ik haal mijn deadlines.", note: "dit combineert het sterke punt (georganiseerd) met een concreet voorbeeld (deadlines halen)."}
  en.a2.unit30.lesson04.teach.q_have_questions: {title: "vragen of je nog vragen hebt", gloss: "de interviewer vraagt: heb je nog vragen over de functie?", note: "dit is een standaardvraag aan het eind van een sollicitatiegesprek."}
  en.a2.unit30.lesson04.teach.a_wondering_typical_week: {title: "Mia stelt een eigen vraag", gloss: "Mia zegt: ja, ik vroeg me af hoe een typische week eruitziet in deze functie.", note: "*I was wondering...* is een beleefde manier om zelf een vraag te stellen."}

exercises:
  en.a2.unit30.lesson01.exercise01.listen_word:
    instruction: "Luister en kies het woord dat gezegd wordt."
    correct_option: "availability"
    distractors: ["experience", "position", "strength"]
    accepted_answers: [{value: "availability", status: "correct"}]
    feedback: "*availability* betekent beschikbaarheid."
  en.a2.unit30.lesson01.exercise02.choose_role_at_company_word:
    instruction: "Welk woord betekent een baan of functie bij een bedrijf?"
    correct_option: "position"
    distractors: ["experience", "strength", "requirement"]
    accepted_answers: [{value: "position", status: "correct"}]
    feedback: "*position* betekent functie."
  en.a2.unit30.lesson01.exercise03.choose_free_to_start_word:
    instruction: "Welk woord betekent de tijden waarop je vrij bent om te beginnen of te werken?"
    correct_option: "availability"
    distractors: ["experience", "position", "requirement"]
    accepted_answers: [{value: "availability", status: "correct"}]
    feedback: "*availability* betekent beschikbaarheid."
  en.a2.unit30.lesson01.exercise04.match_interview_words:
    instruction: "Verbind elke omschrijving met het juiste Engelse woord of de juiste uitdrukking."
    accepted_answers:
      - value:
          - {left: "a time you have done a job or related activity", right: "experience"}
          - {left: "a job or role at a company", right: "position"}
          - {left: "the times you are free to start or work", right: "availability"}
          - {left: "something you are good at", right: "strength"}
          - {left: "something the employer needs you to have", right: "requirement"}
          - {left: "having the right skills or experience for a job", right: "qualified"}
          - {left: "a document listing your experience and education", right: "resume"}
          - {left: "a date or time something must be finished by", right: "deadline"}
        status: "correct"
    feedback: "*experience*=ervaring, *position*=functie, *availability*=beschikbaarheid, *strength*=sterk punt, *requirement*=vereiste, *qualified*=gekwalificeerd, *resume*=cv, *deadline*=deadline."
  en.a2.unit30.lesson01.exercise05.write_strength:
    instruction: "Schrijf het woord voor iets waar je goed in bent."
    accepted_answers:
      - {value: "strength", status: "correct"}
      - {value: "Strength", status: "correct"}
    feedback: "*strength* betekent sterk punt."

  en.a2.unit30.lesson02.exercise01.listen_experience:
    instruction: "Luister en kies de zin die gezegd wordt."
    correct_option: "I have two years of experience in social media marketing"
    distractors: ["One of my strengths is being organized.", "I'm available to start next Monday.", "Your appointment is confirmed for 3pm."]
    accepted_answers: [{value: "I have two years of experience in social media marketing", status: "correct"}]
    feedback: "dit betekent dat je twee jaar ervaring hebt in social-media-marketing."
  en.a2.unit30.lesson02.exercise02.choose_answer_about_experience:
    instruction: "De interviewer vraagt naar je ervaring. Wat zeg je?"
    correct_option: "I have two years of experience in social media marketing."
    distractors: ["I'm available to start next Monday.", "Thank you for coming in today.", "What is one of your strengths?"]
    accepted_answers: [{value: "I have two years of experience in social media marketing.", status: "correct"}]
    feedback: "*I have two years of experience in...* is een directe manier om je werkervaring te beschrijven."
  en.a2.unit30.lesson02.exercise03.order_one_strength:
    instruction: "Zet de woorden in de juiste volgorde voor «een van mijn sterke punten is dat ik georganiseerd ben»."
    accepted_answers: [{value: ["One", "of", "my", "strengths", "is", "being", "organized"], status: "correct"}]
    feedback: "de juiste volgorde is *One of my strengths is being organized*."
  en.a2.unit30.lesson02.exercise04.reply_when_available:
    instruction: "De interviewer vraagt wanneer je kunt beginnen. Zeg dat je aanstaande maandag beschikbaar bent."
    accepted_answers:
      - {value: "I'm available to start next Monday.", status: "correct"}
      - {value: "I'm available to start next Monday", status: "correct"}
    feedback: "*I'm available to start next Monday* betekent dat je aanstaande maandag kunt beginnen."
  en.a2.unit30.lesson02.exercise05.write_availability_note:
    instruction: "Schrijf dat je beschikbaar bent om aanstaande maandag te beginnen."
    accepted_answers:
      - {value: "I'm available to start next Monday.", status: "correct"}
      - {value: "I'm available to start next Monday", status: "correct"}
    feedback: "*I'm available to start next Monday* betekent dat je aanstaande maandag kunt beginnen."

  en.a2.unit30.lesson03.exercise01.read_required_experience:
    instruction: "Hoeveel ervaring vraagt de vacature?"
    correct_option: "two years of experience"
    distractors: ["one year of experience", "three years of experience", "no experience required"]
    accepted_answers: [{value: "two years of experience", status: "correct"}]
    feedback: "de tekst zegt *two years of experience*."
  en.a2.unit30.lesson03.exercise02.read_required_skill:
    instruction: "Welke vaardigheid vraagt de vacature?"
    correct_option: "strong writing skills"
    distractors: ["basic computer skills", "fluent French", "a valid driver's license"]
    accepted_answers: [{value: "strong writing skills", status: "correct"}]
    feedback: "de tekst zegt *strong writing skills*."
  en.a2.unit30.lesson03.exercise03.choose_what_to_bring:
    instruction: "Wat moet je meenemen naar het sollicitatiegesprek?"
    correct_option: "your resume"
    distractors: ["your insurance card", "a confirmation number", "a photo ID"]
    accepted_answers: [{value: "your resume", status: "correct"}]
    feedback: "de tekst zegt *please bring your resume*."
  en.a2.unit30.lesson03.exercise04.order_bring_resume:
    instruction: "Zet de woorden in de juiste volgorde voor «breng alstublieft uw cv mee naar het gesprek»."
    accepted_answers: [{value: ["Please", "bring", "your", "resume", "to", "the", "interview"], status: "correct"}]
    feedback: "de juiste volgorde is *Please bring your resume to the interview*."
  en.a2.unit30.lesson03.exercise05.write_meet_deadlines:
    instruction: "Schrijf dat je je deadlines haalt en goed in een team werkt."
    accepted_answers:
      - {value: "I meet deadlines, and I work well in a team.", status: "correct"}
      - {value: "I meet deadlines and I work well in a team.", status: "correct"}
      - {value: "I meet deadlines. I work well in a team.", status: "correct"}
    feedback: "deze zin combineert twee sterke punten over je werkstijl -- alle drie de vormen zijn correct."

  en.a2.unit30.lesson04.exercise01.listen_mias_experience:
    instruction: "Luister naar het gesprek en kies waar Mia ervaring in heeft."
    correct_option: "two years of experience in social media marketing"
    distractors: ["one year of experience in customer service", "three years of experience in accounting", "no experience in marketing"]
    accepted_answers: [{value: "two years of experience in social media marketing", status: "correct"}]
    feedback: "Mia zegt *two years of experience in social media marketing*."
  en.a2.unit30.lesson04.exercise02.listen_start_date:
    instruction: "Luister en kies wanneer Mia kan beginnen."
    correct_option: "next Monday"
    distractors: ["next Friday", "next week", "tomorrow morning"]
    accepted_answers: [{value: "next Monday", status: "correct"}]
    feedback: "Mia zegt dat ze *available to start next Monday* is."
  en.a2.unit30.lesson04.exercise03.choose_mias_question:
    instruction: "Wat vraagt Mia aan de interviewer?"
    correct_option: "what a typical week looks like in this position"
    distractors: ["what the salary is for this position", "when the interview will end", "who else is applying for this position"]
    accepted_answers: [{value: "what a typical week looks like in this position", status: "correct"}]
    feedback: "Mia vraagt *what a typical week looks like in this position*."
  en.a2.unit30.lesson04.exercise04.order_what_strength_question:
    instruction: "Zet de woorden in de juiste volgorde voor «wat is een van je sterke punten?»."
    accepted_answers: [{value: ["What", "is", "one", "of", "your", "strengths"], status: "correct"}]
    feedback: "de juiste volgorde is *What is one of your strengths*."
  en.a2.unit30.lesson04.exercise05.reply_as_mia:
    instruction: "De interviewer zegt: bedankt dat je vandaag gekomen bent. Kun je iets vertellen over je ervaring? Geef Mia's volledige antwoord over haar ervaring, sterke punt en beschikbaarheid."
    accepted_answers:
      - {value: "I have two years of experience in social media marketing. I also managed a small team. I'm very organized, and I meet deadlines. I'm available to start next Monday.", status: "correct"}
    feedback: "dit volledige antwoord combineert ervaring, teamleiding, een sterk punt en beschikbaarheid -- meerdere momenten uit het gesprek samen."
  en.a2.unit30.lesson04.exercise06.speak_interview_dialogue:
    instruction: "Antwoord de interviewer hardop in de rol van Mia."
    accepted_answers:
      - {value: "I have two years of experience in social media marketing. I also managed a small team. I'm very organized, and I meet deadlines. I'm available to start next Monday.", status: "correct"}
    feedback: "dit volledige antwoord dekt alle onderdelen van het gesprek: ervaring, teamleiding, sterk punt en beschikbaarheid."
