    distractors: ["qualify", "evaluate", "synthesize"]
    accepted_answers: [{value: "prioritize", status: "correct"}]
    feedback: "*prioritize* betekent voorrang geven aan."
  en.b2.unit06.lesson01.exercise03_match_values:
