  en.b2.unit06.lesson01.abstract_values: {title: "Values and qualifications"}
  en.b2.unit06.lesson02.qualified_opinions: {title: "In principle, but..."}
  en.b2.unit06.lesson03.reading_public_spaces: {title: "Lezen: rustige openbare ruimtes"}
  en.b2.unit06.lesson04.the_abstract_dialogue: {title: "The value you are prioritizing"}

teaching:
  en.b2.unit06.lesson01.teach.value: {title: "value", gloss: "waarde", note: "*value* betekent hier een principe dat mensen belangrijk vinden, niet alleen financiele waarde.", example_gloss: "Eerlijkheid is een waarde."}
  en.b2.unit06.lesson01.teach.fairness: {title: "fairness", gloss: "eerlijkheid, redelijkheid", note: "*fairness* gaat om redelijke behandeling van mensen. Het is sterker en abstracter dan alleen *nice*.", example_gloss: "Eerlijkheid betekent dat je mensen redelijk behandelt."}
  en.b2.unit06.lesson01.teach.convenience: {title: "convenience", gloss: "gemak, praktische bruikbaarheid", note: "*convenience* is gemak. Vertaal Nederlands *gemakkelijkheid* niet letterlijk als *easiness* in deze B2-context.", example_gloss: "Gemak maakt het dagelijks leven makkelijker."}
  en.b2.unit06.lesson01.teach.flexibility: {title: "flexibility", gloss: "flexibiliteit", note: "*flexibility* is het vermogen om mee te bewegen wanneer omstandigheden veranderen.", example_gloss: "Flexibiliteit maakt verandering mogelijk wanneer omstandigheden veranderen."}
  en.b2.unit06.lesson01.teach.qualify: {title: "qualify", gloss: "nuanceren, beperken", note: "*qualify* betekent hier je mening beperken of nuanceren. Het betekent niet een diploma halen.", example_gloss: "Je kunt een mening nuanceren door die te beperken."}
  en.b2.unit06.lesson01.teach.prioritize: {title: "prioritize", gloss: "voorrang geven aan", note: "*prioritize fairness* betekent dat je eerlijkheid belangrijker maakt dan een andere waarde.", example_gloss: "Eerlijkheid prioriteren betekent dat je het belangrijker behandelt."}

  en.b2.unit06.lesson02.teach.in_principle: {title: "waarden afwegen", gloss: "In principe doet gemak ertoe, maar eerlijkheid zou zwaarder moeten wegen.", note: "*In principle* betekent hier *in principe*. Gebruik niet *eventually* voor Nederlands *eventueel*; dat betekent uiteindelijk."}
  en.b2.unit06.lesson02.teach.not_arguing_everywhere: {title: "je standpunt beperken", gloss: "Ik pleit niet voor stilte overal.", note: "*I am not arguing for...* beperkt je stelling. Het is beter dan een vage calque met *a little*."}
  en.b2.unit06.lesson02.teach.respond_opposing: {title: "direct reageren op de andere kant", gloss: "Dat is redelijk, en ik ben het ermee eens dat bedrijven flexibiliteit nodig hebben.", note: "*That is fair* erkent het punt zonder je eigen waarde op te geven."}
  en.b2.unit06.lesson02.teach.grammar_abstract_response: {title: "abstracte mening opbouwen", gloss: "Een sterke abstracte mening noemt een waarde, nuanceert de stelling en reageert direct op de visie van de ander.", note: "Gebruik precieze B2-woorden zoals *in principle*, *fairness* en *carry more weight*, niet steeds *a bit* voor nuance."}

  en.b2.unit06.lesson03.teach.transparent: {title: "transparent", gloss: "transparant, duidelijk te begrijpen", note: "*transparent rules* zijn regels die makkelijk te begrijpen en te controleren zijn.", example_gloss: "Transparante regels zijn makkelijk te begrijpen."}
  en.b2.unit06.lesson03.teach.commercial: {title: "commercial", gloss: "commercieel, zakelijk", note: "*commercial activity* is activiteit die met bedrijven en winst te maken heeft.", example_gloss: "Commerciele activiteit heeft met bedrijven te maken."}
  en.b2.unit06.lesson03.teach.reading_passage: {title: "leestekst: rustige openbare ruimtes", gloss: "Amara betoogt dat rustige openbare ruimtes beschermd moeten worden, ook wanneer dat sommige commerciele activiteit beperkt. Haar visie is niet absoluut: ze pleit niet voor stilte overal, en ze accepteert dat bedrijven enige flexibiliteit nodig hebben. Leo's tegengestelde visie is dat regels het moeilijker kunnen maken voor bedrijven om te overleven. Amara reageert direct op dat punt door te zeggen dat gemak ertoe doet, maar dat eerlijkheid zwaarder moet wegen wanneer een ruimte van iedereen is. Haar standpunt is genuanceerd omdat ze beperkte en transparante regels steunt, geen onbeperkte beperkingen.", note: "Dit is abstract Engels: benoem waarden en beperk je stelling precies."}

  en.b2.unit06.lesson04.teach.q_protect_spaces: {title: "Amara noemt haar standpunt", gloss: "Amara zegt: ik vind dat een stad rustige openbare ruimtes moet beschermen, zelfs als dat sommige commerciele activiteit beperkt.", note: "*even if* maakt duidelijk dat ze een nadeel erkent."}
  en.b2.unit06.lesson04.teach.a_business_flexibility: {title: "Leo noemt de andere waarde", gloss: "Leo zegt: ik waardeer rust ook, maar bedrijven hebben flexibiliteit nodig om te overleven.", note: "Leo zet flexibiliteit tegenover Amara's nadruk op openbare ruimte."}
  en.b2.unit06.lesson04.teach.q_not_silence: {title: "Amara nuanceert", gloss: "Amara zegt: dat is redelijk, en ik pleit niet voor stilte overal. Mijn punt is dat gedeelde ruimtes niet alleen door winst gevormd moeten worden.", note: "*not arguing for silence everywhere* voorkomt dat haar standpunt absoluut klinkt."}
  en.b2.unit06.lesson04.teach.a_prioritizing: {title: "Leo benoemt de waarde", gloss: "Leo zegt: dus de waarde die je voorrang geeft is eerlijkheid, niet alleen comfort?", note: "*prioritizing* betekent hier: belangrijker maken in de afweging."}
  en.b2.unit06.lesson04.teach.q_fairness_weight: {title: "Amara weegt waarden", gloss: "Amara zegt: precies. In principe doet gemak ertoe, maar eerlijkheid zou zwaarder moeten wegen wanneer een ruimte van iedereen is.", note: "*carry more weight* is natuurlijk Engels voor *zwaarder wegen*."}
  en.b2.unit06.lesson04.teach.a_accept_rules: {title: "Leo accepteert met voorwaarde", gloss: "Leo zegt: ik kan dat accepteren als de regels beperkt en transparant zijn.", note: "De acceptatie hangt af van de beperking en duidelijkheid van de regels."}

exercises:
