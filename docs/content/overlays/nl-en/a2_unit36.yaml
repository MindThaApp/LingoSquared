review: {status: "unreviewed", required_next_reviewer: "fresh_context", notes: "Dutch overlay for the new a2_unit36_document_correction realization, authored 2026-07-22. Written independently of the fa-en and prs-en overlays of the same realization -- neither sibling file was opened while authoring this one (AUTHORING_GUIDE §8). Register is the informal jij-register pinned for this lane, except inside the Clerk's counter lines where Dutch would naturally use u. 'registration certificate' is glossed as 'bewijs van inschrijving' (what the gemeente actually issues after inschrijving in de BRP) rather than a literal 'registratiecertificaat'. Every listen_select/dialogue distractor was checked against the full audio text of its own media asset: none is spoken anywhere in that audio -- in particular 'today' was deliberately NOT used as a duration distractor, because the Clerk says it. PENDING a fresh-context review."}

course:
