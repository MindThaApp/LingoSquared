teaching:
  en.a2.unit36.lesson01.teach.certificate: {title: "certificate", gloss: "officieel bewijs", note: "*certificate* is het officiële papier dat een instantie je geeft; *registration certificate* is je bewijs van inschrijving.", example_gloss: "Mijn bewijs van inschrijving kwam twee weken na de afspraak."}
  en.a2.unit36.lesson01.teach.mistake: {title: "mistake", gloss: "fout", note: "*mistake* is iets wat verkeerd is opgeschreven of gedaan.", example_gloss: "Er staat een fout in mijn adres op dit formulier."}
  en.a2.unit36.lesson01.teach.spelled: {title: "spelled", gloss: "gespeld, geschreven", note: "*spelled* zegt met welke letters, in welke volgorde, een woord geschreven is.", example_gloss: "Mijn naam wordt met één l geschreven, niet met twee."}
  en.a2.unit36.lesson01.teach.correct: {title: "correct", gloss: "corrigeren, verbeteren", note: "*correct* is hier een werkwoord: iets wat fout is goed maken.", example_gloss: "De medewerker kan mijn achternaam vandaag corrigeren."}
  en.a2.unit36.lesson01.teach.copy: {title: "copy", gloss: "kopie", note: "*copy* is een tweede, identieke versie van een document.", example_gloss: "De gemeente bewaart van elk document een kopie."}
  en.a2.unit36.lesson01.teach.passport: {title: "passport", gloss: "paspoort", note: "*passport* is het reisdocument met je pasfoto erin.", example_gloss: "Ik neem altijd mijn paspoort mee naar een officiële afspraak."}
  en.a2.unit36.lesson01.teach.grammar_there_is_there_are: {title: "there is en there are", gloss: "Er staat een fout op mijn bewijs. Er staan twee fouten op mijn bewijs.", note: "*there is* gebruik je bij één ding, *there are* bij meer dan één -- net als er staat en er staan."}

  en.a2.unit36.lesson02.teach.there_is_a_mistake: {title: "zeggen dat er een fout in staat", gloss: "Er staat een fout op mijn bewijs van inschrijving.", note: "*There is a mistake on...* is de neutrale, formele manier om een fout te melden."}
  en.a2.unit36.lesson02.teach.name_spelled_wrong: {title: "zeggen wat er precies fout is", gloss: "Mijn achternaam is verkeerd gespeld.", note: "*last name* is je achternaam; *first name* is je voornaam."}
  en.a2.unit36.lesson02.teach.could_you_correct_it: {title: "vragen of het gecorrigeerd kan worden", gloss: "Kunt u het corrigeren, alstublieft?", note: "*Could you...?* is beleefder dan *Can you...?* en past bij een balie."}
  en.a2.unit36.lesson02.teach.how_long_correction: {title: "vragen hoe lang het duurt", gloss: "Hoe lang duurt de correctie?", note: "*How long...?* vraagt naar een tijdsduur, niet naar een lengte."}
  en.a2.unit36.lesson02.teach.grammar_polite_request: {title: "twee beleefde verzoekvormen", gloss: "Kunt u het corrigeren, alstublieft? Zou het mogelijk zijn om een nieuw bewijs te krijgen?", note: "*Could you...?* vraagt om een handeling; *Would it be possible to...?* is nog voorzichtiger en vraagt of iets überhaupt kan."}

  en.a2.unit36.lesson03.teach.working_days: {title: "working days", gloss: "werkdagen", note: "*working days* zijn de dagen van maandag tot en met vrijdag, dus zonder het weekend.", example_gloss: "De gemeente beantwoordt elke brief binnen vijf werkdagen."}
  en.a2.unit36.lesson03.teach.notice_text: {title: "het bericht over de correctie", gloss: "Correctieverzoek ontvangen. Uw bewijs van inschrijving wordt binnen vijf werkdagen gecorrigeerd. Neem uw paspoort en dit bericht mee naar het kantoor. Referentienummer 3092.", note: "een officieel bericht is kort en zakelijk: wat er gebeurd is, wat er gaat gebeuren, en wat jij moet doen."}
  en.a2.unit36.lesson03.teach.bring_passport_and_notice: {title: "wat je mee moet nemen", gloss: "Neem uw paspoort en dit bericht mee naar het kantoor.", note: "*bring ... to ...* betekent iets meenemen naar een plek."}

  en.a2.unit36.lesson04.teach.q_there_is_a_mistake: {title: "Leila meldt de fout", gloss: "Leila zegt: hallo, er staat een fout op mijn bewijs van inschrijving.", note: "*Hello* is neutraler dan *Hi* en past beter aan een officiële balie."}
  en.a2.unit36.lesson04.teach.a_what_is_wrong: {title: "de medewerker vraagt door", gloss: "De medewerker zegt: ik begrijp het. Wat klopt er niet?", note: "*I see* betekent hier: ik begrijp het, ik luister."}
  en.a2.unit36.lesson04.teach.q_name_spelled_wrong: {title: "Leila legt de fout uit en vraagt om correctie", gloss: "Leila zegt: mijn achternaam is verkeerd gespeld. Kunt u het corrigeren, alstublieft?", note: "dezelfde twee zinnen die we in les 2 hebben geleerd, nu achter elkaar."}
  en.a2.unit36.lesson04.teach.a_do_you_have_passport: {title: "de medewerker vraagt om het paspoort", gloss: "De medewerker zegt: natuurlijk. Hebt u uw paspoort bij u?", note: "*Do you have ... with you?* betekent: hebt u het nu bij u?"}
  en.a2.unit36.lesson04.teach.q_here_it_is: {title: "Leila geeft haar paspoort", gloss: "Leila zegt: ja, alstublieft.", note: "*Here it is* zeg je terwijl je iemand iets aanreikt."}
  en.a2.unit36.lesson04.teach.a_copy_and_send: {title: "de medewerker legt uit wat hij doet", gloss: "De medewerker zegt: dank u wel. Ik maak een kopie en stuur de correctie vandaag door.", note: "*make a copy* is een vaste combinatie: een kopie maken."}
  en.a2.unit36.lesson04.teach.q_how_long: {title: "Leila vraagt hoe lang het duurt", gloss: "Leila vraagt: hoe lang duurt de correctie?", note: "dezelfde vraag die we in les 2 hebben geleerd."}
  en.a2.unit36.lesson04.teach.a_within_five_working_days: {title: "het antwoord van de medewerker", gloss: "De medewerker zegt: binnen vijf werkdagen. Neem uw paspoort en dit bericht mee naar het kantoor.", note: "*within* betekent binnen een bepaalde termijn, dus uiterlijk na vijf werkdagen."}
  en.a2.unit36.lesson04.teach.q_thank_you: {title: "Leila bedankt de medewerker", gloss: "Leila zegt: hartelijk dank.", note: "*very much* maakt het bedanken wat nadrukkelijker."}

