    correct_option: "I check social media twice a day, in the morning and in the evening."
    distractors: ["I mostly use messaging apps to talk to my family.", "In my opinion, it's useful for staying in touch.", "Can you download that cooking app for me?"]
    accepted_answers: [{value: "I check social media twice a day, in the morning and in the evening.", status: "correct"}]
    feedback: "dit betekent dat je sociale media twee keer per dag checkt, 's ochtends en 's avonds."
