    distractors: ["social media", "screen time", "notification"]
    accepted_answers: [{value: "messaging app", status: "correct"}]
    feedback: "*messaging app* betekent berichten-app."
  en.a2.unit32.lesson01.exercise03.choose_time_on_screen_word:
    instruction: "Welke uitdrukking betekent de tijd die je naar een telefoon of computer kijkt?"
    correct_option: "screen time"
    distractors: ["social media", "messaging app", "notification"]
    accepted_answers: [{value: "screen time", status: "correct"}]
    feedback: "*screen time* betekent schermtijd."
  en.a2.unit32.lesson01.exercise04.match_online_habit_words:
    instruction: "Verbind elke omschrijving met het juiste Engelse woord of de juiste uitdrukking."
    accepted_answers:
      - value:
          - {left: "apps and sites for sharing photos and messages with others", right: "social media"}
          - {left: "the time you spend looking at a phone or computer", right: "screen time"}
          - {left: "an app you use to send messages", right: "messaging app"}
          - {left: "a small alert from an app on your phone", right: "notification"}
          - {left: "to add an app or file to your phone", right: "download"}
          - {left: "to say what you think about something", right: "give an opinion"}
          - {left: "to spend time without a good result", right: "waste time"}
          - {left: "to stay in contact with someone", right: "stay in touch"}
        status: "correct"
    feedback: "*social media*=sociale media, *screen time*=schermtijd, *messaging app*=berichten-app, *notification*=melding, *download*=downloaden, *give an opinion*=een mening geven, *waste time*=tijd verspillen, *stay in touch*=in contact blijven."
  en.a2.unit32.lesson01.exercise05.write_notification:
    instruction: "Schrijf het woord voor een kleine melding van een app op je telefoon."
    accepted_answers:
      - {value: "notification", status: "correct"}
      - {value: "Notification", status: "correct"}
    feedback: "*notification* betekent melding."

  en.a2.unit32.lesson02.exercise01.listen_check_frequency:
    instruction: "Luister en kies hoe vaak ze sociale media checkt."
