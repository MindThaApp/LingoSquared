course:
  title: "Engels B1"
  description: >-
    Engels leren op B1-niveau voor alledaagse gesprekken over verplichtingen,
    mogelijkheden, hypothetische situaties en verhalen, met gedetailleerde
    uitleg in het Nederlands.

units:
  en.b1.unit07.conditions: {title: "Als dit gebeurt, dan doen we dat"}

lessons:
  en.b1.unit07.lesson01.condition_vocabulary: {title: "If, unless, condition en result"}
  en.b1.unit07.lesson02.real_conditions: {title: "If it starts late, I will send a message"}
  en.b1.unit07.lesson03.reading_a_meeting_plan: {title: "Lezen: het reserveplan"}
  en.b1.unit07.lesson04.the_meeting_plan_dialogue: {title: "If the room is busy, we will meet online"}

teaching:
  en.b1.unit07.lesson01.teach.if: {title: "if", gloss: "als, indien", note: "*if* introduceert een mogelijke voorwaarde.", example_gloss: "Als de bus te laat is, bel ik je."}
  en.b1.unit07.lesson01.teach.unless: {title: "unless", gloss: "tenzij, als niet", note: "*unless* betekent ongeveer *if not*: iets gebeurt behalve als de voorwaarde toch waar wordt.", example_gloss: "Tenzij het plan verandert, spreken we om tien uur af."}
  en.b1.unit07.lesson01.teach.condition: {title: "condition", gloss: "voorwaarde", note: "*condition* betekent de situatie die eerst moet gelden.", example_gloss: "De voorwaarde is duidelijk: we beginnen als iedereen aankomt."}
  en.b1.unit07.lesson01.teach.result: {title: "result", gloss: "resultaat, gevolg", note: "*result* betekent wat er gebeurt door een voorwaarde.", example_gloss: "Het resultaat is dat we online afspreken."}
  en.b1.unit07.lesson01.teach.delay: {title: "delay", gloss: "vertraging", note: "*delay* betekent dat iets later gebeurt dan gepland.", example_gloss: "Een vertraging kan ervoor zorgen dat iedereen te laat komt."}
  en.b1.unit07.lesson01.teach.reschedule: {title: "reschedule", gloss: "verplaatsen naar een ander tijdstip", note: "*reschedule* betekent een nieuwe tijd kiezen voor een afspraak of vergadering.", example_gloss: "Als de dokter het druk heeft, verplaatsen we de afspraak."}

  en.b1.unit07.lesson02.teach.if_meeting_late: {title: "Een reële voorwaarde met resultaat", gloss: "Als de vergadering laat begint, stuur ik iedereen een bericht.", note: "In een reële toekomstige voorwaarde gebruik je na *if* de tegenwoordige tijd: *If the meeting starts late*, niet *will start*."}
  en.b1.unit07.lesson02.teach.if_not_ready: {title: "Een ontkende voorwaarde", gloss: "Als het rapport niet klaar is, verplaatsen we de bespreking.", note: "*if ... not* maakt de voorwaarde negatief."}
  en.b1.unit07.lesson02.teach.grammar_real_condition: {title: "Reële voorwaarden in de toekomst", gloss: "Als het laat begint, stuur ik een bericht. Als het rapport niet klaar is, verplaatsen we de bespreking.", note: "Na *if* staat de tegenwoordige tijd, en in het resultaat gebruik je vaak *will*."}

  en.b1.unit07.lesson03.teach.backup_plan: {title: "backup plan", gloss: "reserveplan", note: "*backup plan* betekent een extra plan voor als het eerste plan niet werkt.", example_gloss: "We hebben een reserveplan nodig als de kamer bezet is."}
  en.b1.unit07.lesson03.teach.move_update: {title: "move the update", gloss: "de update verplaatsen", note: "*move the update* betekent de update op een ander moment behandelen.", example_gloss: "Als Leila te laat is, verplaatsen we haar update naar morgen."}
  en.b1.unit07.lesson03.teach.reading_passage: {title: "Leestekst: het reserveplan", gloss: "Daniel schrijft een reserveplan voor de teamvergadering. Als de vergaderruimte vrij is, komt het team daar om tien uur samen. Als de kamer bezet is, spreken ze online af. Tenzij Leila vóór tien uur aansluit, verplaatst Daniel haar update naar morgen. Als het rapport niet klaar is, stuurt Mia in plaats daarvan een kortere update.", note: "Een korte leestekst met reële voorwaarden, resultaten en *unless*."}

  en.b1.unit07.lesson04.teach.q_if_meeting_late: {title: "Mia vraagt naar het plan", gloss: "Mia zegt: Daniel, wat moeten we doen als de vergadering laat begint?", note: "Een vraag naar het resultaat van een mogelijke voorwaarde."}
  en.b1.unit07.lesson04.teach.a_send_message: {title: "Daniel geeft het resultaat", gloss: "Daniel zegt: als het laat begint, stuur ik iedereen een bericht.", note: "*If it starts late, I will...* koppelt een echte mogelijkheid aan een concrete actie."}
  en.b1.unit07.lesson04.teach.q_if_leila_cannot_join: {title: "Mia vraagt naar Leila", gloss: "Mia zegt: en als Leila niet kan aansluiten?", note: "Een korte vervolgvraag met dezelfde voorwaardelijke structuur."}
  en.b1.unit07.lesson04.teach.a_unless_she_joins: {title: "Daniel gebruikt 'unless'", gloss: "Daniel zegt: tenzij ze vóór tien uur aansluit, verplaatsen we haar update naar morgen.", note: "*unless she joins by ten* betekent: als ze niet vóór tien uur aansluit."}
  en.b1.unit07.lesson04.teach.q_room_busy: {title: "Mia vraagt naar de kamer", gloss: "Mia zegt: dat klinkt redelijk. Als de kamer nog bezet is, moeten we dan online afspreken?", note: "Mia controleert het reserveplan voor een bezette kamer."}
  en.b1.unit07.lesson04.teach.a_meet_online: {title: "Daniel bevestigt het online plan", gloss: "Daniel zegt: ja, als de kamer bezet is, spreken we in plaats daarvan online af.", note: "*instead* betekent dat dit plan het andere plan vervangt."}

