review: {status: "unreviewed", required_next_reviewer: "fresh_context", notes: "Eighteenth nl-en B1 overlay, authored directly against the reviewed English realization b1_unit18_future_plans. Informal jij/je register in the Dutch instructions/glosses throughout (the taught English forms are present-continuous/going-to/will future-plan constructions, as required by the realization -- Dutch explanatory text stays informal per the lane pin). Pending fresh-context review. lesson02.exercise04/05, lesson03.exercise05, and lesson04.exercise05/06 name the required form/turn in the Dutch instruction to avoid the underdetermined-prompt bug class. Distractors on the two form-identification MCs (lesson02.exercise01/02) were checked against the exact literal wording of each question (specific fixed time already agreed vs. decision already made without a fixed time) rather than relying on the fuzzy present-continuous/going-to/will distinction generally. Dialogue exercises (lesson04) enumerate all 8 audio turns (Mia x4, Daniel x4) and never use a line the TESTED speaker says anywhere in the clip as a distractor. Character canon checked: Daniel, Leila, Mia are established colleagues from units 09-17 (Daniel's evening class, joined the team in March, two-project workload, Mia previously mentioned as a colleague who could help -- unit18 has her speaking directly for the first time, consistent with that established relationship, no conflicting facts introduced)."}

course:
  title: "Engels B1"
  description: >-
    Engels leren op B1-niveau voor alledaagse gesprekken over verplichtingen,
    mogelijkheden, hypothetische situaties, tegenstellingen, verhalen,
    beschrijvingen met bijzinnen, professionele communicatie, klachten,
    advies, spijt over het verleden en toekomstplannen, met gedetailleerde
    uitleg in het Nederlands.

units:
  en.b1.unit18.future_plans: {title: "I am going to start a new project"}

lessons:
  en.b1.unit18.lesson01.future_plans_vocabulary: {title: "Woorden voor de toekomst"}
  en.b1.unit18.lesson02.fixed_arrangements_and_intentions: {title: "I am meeting Leila on Friday"}
  en.b1.unit18.lesson03.reading_daniels_plans: {title: "Lezen: Daniels plannen voor volgende maand"}
  en.b1.unit18.lesson04.the_planning_dialogue: {title: "It will probably take two months"}

teaching:
  en.b1.unit18.lesson01.teach.arrangement: {title: "arrangement", gloss: "afspraak", note: "*arrangement* betekent een plan dat al vastligt met iemand anders, zoals een afgesproken tijd.", example_gloss: "Mia heeft een afspraak om Leila vrijdag te ontmoeten."}
  en.b1.unit18.lesson01.teach.intention: {title: "intention", gloss: "intentie", note: "*intention* betekent iets wat je hebt besloten te doen, maar waarvoor je nog geen tijd hebt vastgelegd met iemand anders.", example_gloss: "Daniels intentie is om het project vroeg af te ronden."}
  en.b1.unit18.lesson01.teach.prediction: {title: "prediction", gloss: "voorspelling", note: "*prediction* betekent een inschatting van wat er zal gebeuren, gebaseerd op aanwijzingen.", example_gloss: "Mijn voorspelling is dat het project op tijd klaar zal zijn."}
  en.b1.unit18.lesson01.teach.definitely: {title: "definitely", gloss: "absoluut zeker", note: "*definitely* laat zien dat je volledig zeker bent dat iets zal gebeuren.", example_gloss: "Daniel zal het rapport vandaag absoluut afmaken."}
  en.b1.unit18.lesson01.teach.probably: {title: "probably", gloss: "waarschijnlijk", note: "*probably* laat zien dat je redelijk zeker bent, maar niet volledig zeker.", example_gloss: "Het project zal waarschijnlijk twee maanden duren."}
  en.b1.unit18.lesson01.teach.might: {title: "might", gloss: "misschien", note: "*might* laat zien dat iets slechts een zwakke mogelijkheid is.", example_gloss: "Daniel zal misschien Leila vragen om bij het team te komen."}

  en.b1.unit18.lesson02.teach.meeting_leila_friday: {title: "I am + werkwoord-ing (vaste afspraak)", gloss: "Ik ontmoet Leila vrijdag voor de lunch.", note: "*I am meeting Leila for lunch on Friday* gebruikt de present continuous voor een vaste afspraak met een specifieke, al afgesproken tijd."}
  en.b1.unit18.lesson02.teach.going_to_start_project: {title: "I am going to + werkwoord (intentie)", gloss: "Ik ga een nieuw project starten met het designteam.", note: "*I am going to start a new project* gebruikt going to voor een beslissing die al genomen is, zonder een vaste tijd."}
  en.b1.unit18.lesson02.teach.grammar_arrangements_vs_intentions: {title: "vaste afspraken versus intenties", gloss: "Gebruik de present continuous (I am meeting Leila on Friday) voor een vaste afspraak -- een specifieke tijd die al met iemand anders is afgesproken. Gebruik going to (I am going to start a new project) voor een intentie of beslissing die je al hebt genomen, ook zonder vaste tijd.", note: "vorm: kies tussen present continuous voor een vaste afspraak of going to voor een intentie."}

  en.b1.unit18.lesson03.teach.on_time: {title: "on time", gloss: "op tijd", note: "*on time* betekent precies op de geplande tijd of datum.", example_gloss: "Daniel denkt dat het project op tijd klaar zal zijn."}
  en.b1.unit18.lesson03.teach.confident: {title: "confident", gloss: "zelfverzekerd", note: "*confident* betekent je zeker voelen dat iets goed zal gaan.", example_gloss: "Daniel voelt zich zelfverzekerd over het nieuwe project."}
  en.b1.unit18.lesson03.teach.reading_passage: {title: "leestekst: Daniels plannen voor volgende maand", gloss: "Daniel gaat volgende maand een nieuw project starten met het designteam. Hij ontmoet hen vrijdagochtend om de eerste stappen te plannen. Daniel voelt zich zelfverzekerd over het project, maar hij is niet helemaal zeker dat het op tijd klaar zal zijn. Hij voorspelt dat het waarschijnlijk ongeveer twee maanden zal duren. Hij zal misschien Leila vragen om bij het team te komen, omdat zij nuttige designervaring heeft. Als zij toestemt, zal het project absoluut sneller gaan.", note: "een korte leestekst op B1-niveau."}

  en.b1.unit18.lesson04.teach.q_plans_next_month: {title: "Mia vraagt naar Daniels plannen", gloss: "Mia zegt: Daniel, wat zijn je plannen voor volgende maand?", note: "een open vraag om het gesprek te openen."}
  en.b1.unit18.lesson04.teach.a_going_to_start: {title: "Daniel vertelt zijn intentie", gloss: "Daniel zegt: ik ga een nieuw project starten met het designteam.", note: "*going to* geeft een al genomen beslissing aan."}
  en.b1.unit18.lesson04.teach.q_meeting_this_week: {title: "Mia vraagt door", gloss: "Mia zegt: dat klinkt spannend. Ontmoet je hen deze week?", note: "een vervolgvraag over een vaste afspraak."}
  en.b1.unit18.lesson04.teach.a_meeting_friday_morning: {title: "Daniel bevestigt de vaste afspraak", gloss: "Daniel zegt: ja, ik ontmoet hen vrijdagochtend.", note: "*I am meeting... on Friday morning* is de present continuous voor een vaste afspraak."}
  en.b1.unit18.lesson04.teach.q_finish_on_time: {title: "Mia vraagt naar de deadline", gloss: "Mia zegt: denk je dat het project op tijd klaar zal zijn?", note: "een vraag naar een voorspelling."}
  en.b1.unit18.lesson04.teach.a_probably_two_months: {title: "Daniel geeft een voorspelling", gloss: "Daniel zegt: ik weet het niet zeker, maar het zal waarschijnlijk ongeveer twee maanden duren.", note: "*probably* laat een redelijke, maar niet volledige zekerheid zien."}
  en.b1.unit18.lesson04.teach.q_sure_it_will_go_well: {title: "Mia is optimistisch", gloss: "Mia zegt: nou, ik weet zeker dat het goed zal gaan.", note: "een bemoedigende opmerking."}
  en.b1.unit18.lesson04.teach.a_might_ask_leila: {title: "Daniel noemt een zwakke mogelijkheid", gloss: "Daniel zegt: bedankt. Ik zal misschien ook Leila vragen om bij het team te komen.", note: "*might* laat een zwakke mogelijkheid zien."}

exercises:
  en.b1.unit18.lesson01.exercise01.listen_probably:
    instruction: "Luister en kies het woord dat gezegd wordt."
    correct_option: "probably"
    distractors: ["arrangement", "intention", "definitely"]
    accepted_answers: [{value: "probably", status: "correct"}]
    feedback: "*probably* betekent waarschijnlijk."
  en.b1.unit18.lesson01.exercise02.choose_definitely:
    instruction: "Welk woord beschrijft de hoogste mate van zekerheid over een toekomstige gebeurtenis?"
    correct_option: "definitely"
    distractors: ["intention", "probably", "might"]
    accepted_answers: [{value: "definitely", status: "correct"}]
    feedback: "*definitely* betekent absoluut zeker."
  en.b1.unit18.lesson01.exercise03.choose_might:
    instruction: "Welk woord beschrijft een toekomstige mogelijkheid die helemaal niet zeker is?"
    correct_option: "might"
    distractors: ["definitely", "probably", "prediction"]
    accepted_answers: [{value: "might", status: "correct"}]
    feedback: "*might* betekent misschien."
  en.b1.unit18.lesson01.exercise04.match_future_words:
    instruction: "Verbind elk Engels woord of elke Engelse uitdrukking met de juiste Nederlandse omschrijving."
    pairs:
      - {left: "arrangement", right: "afspraak"}
      - {left: "intention", right: "intentie"}
      - {left: "prediction", right: "voorspelling"}
      - {left: "definitely", right: "absoluut zeker"}
      - {left: "probably", right: "waarschijnlijk"}
      - {left: "might", right: "misschien"}
    accepted_answers:
      - value:
          - {left: "arrangement", right: "afspraak"}
          - {left: "intention", right: "intentie"}
          - {left: "prediction", right: "voorspelling"}
          - {left: "definitely", right: "absoluut zeker"}
          - {left: "probably", right: "waarschijnlijk"}
          - {left: "might", right: "misschien"}
        status: "correct"
    feedback: "*arrangement*=afspraak, *intention*=intentie, *prediction*=voorspelling, *definitely*=absoluut zeker, *probably*=waarschijnlijk, *might*=misschien."
  en.b1.unit18.lesson01.exercise05.write_probably:
    instruction: "Schrijf het woord dat laat zien dat je redelijk zeker bent, maar niet volledig zeker."
    accepted_answers:
      - {value: "probably", status: "correct"}
      - {value: "Probably", status: "correct"}
    feedback: "*probably* betekent waarschijnlijk."

  en.b1.unit18.lesson02.exercise01.choose_meeting_leila:
    instruction: "Welke zin beschrijft een vaste afspraak met een specifieke tijd die al is afgesproken?"
    correct_option: "I am meeting Leila for lunch on Friday."
    distractors: ["I am going to start a new project with the design team.", "I have a prediction about the project.", "I might meet Leila for lunch."]
    accepted_answers: [{value: "I am meeting Leila for lunch on Friday.", status: "correct"}]
    feedback: "*I am meeting...* gebruikt de present continuous voor een vaste afspraak."
  en.b1.unit18.lesson02.exercise02.choose_going_to_start:
    instruction: "Welke zin beschrijft een beslissing die Daniel al heeft genomen, zonder een vaste tijd te noemen?"
