    distractors: ["I am meeting Leila for lunch on Friday.", "I have an arrangement to meet the design team.", "I might start a new project next year."]
    accepted_answers: [{value: "I am going to start a new project with the design team.", status: "correct"}]
    feedback: "*I am going to start...* gebruikt going to voor een al genomen beslissing."
  en.b1.unit18.lesson02.exercise03.order_meeting_leila:
    instruction: "Zet de woorden in de juiste volgorde voor «ik ontmoet Leila vrijdag voor de lunch»."
