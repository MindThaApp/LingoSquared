review: {status: "reviewed", required_next_reviewer: "ramin_native_pass", notes: "Eighteenth nl-en B1 overlay, authored directly against the reviewed English realization b1_unit18_future_plans. Informal jij/je register in the Dutch instructions/glosses throughout (the taught English forms are present-continuous/going-to/will future-plan constructions, as required by the realization -- Dutch explanatory text stays informal per the lane pin). Pending fresh-context review. lesson02.exercise04/05, lesson03.exercise05, and lesson04.exercise05/06 name the required form/turn in the Dutch instruction to avoid the underdetermined-prompt bug class. Distractors on the two form-identification MCs (lesson02.exercise01/02) were checked against the exact literal wording of each question (specific fixed time already agreed vs. decision already made without a fixed time) rather than relying on the fuzzy present-continuous/going-to/will distinction generally. Dialogue exercises (lesson04) enumerate all 8 audio turns (Mia x4, Daniel x4) and never use a line the TESTED speaker says anywhere in the clip as a distractor. Character canon checked: Daniel, Leila, Mia are established colleagues from units 09-17 (Daniel's evening class, joined the team in March, two-project workload, Mia previously mentioned as a colleague who could help -- unit18 has her speaking directly for the first time, consistent with that established relationship, no conflicting facts introduced). Fresh-context review 2026-10-10 (content-reviewer.md checklist): checked all 21 exercises and 19 teaching items for answer completeness, distractors, Dutch glosses/instructions, dialogue attribution vs the 8-turn audio and listen distractors vs everything Daniel says. Fixed (English answer variants only): lesson02.exercise03 word_order accepts the equally grammatical tile order ... on Friday for lunch; lesson02.exercise04 accepts I'm going to; lesson02.exercise05 accepts I'm meeting and ... on Friday for lunch; lesson04.exercise05 accepts I'm meeting and the audio's own Yes, I am/I'm meeting ... reply; lesson04.exercise06 accepts the audio's own Thanks. I might ... line and I might also ask Leila to join the team. Native flag: confident is glossed zelfverzekerd (self-assured) where the sense is vertrouwen hebben in het project; Ramin to judge. No Dutch text changed. Deferred: none. Review 2026-10-22 (shared-en r3): 8 fixes - listen items lesson04.exercise01/02 distractors no longer lines heard in the clip; lesson02.exercise02 and lesson03.exercise01 ambiguous distractors replaced; dash in the grammar-note gloss; accepted_answers completed. NATIVE FLAGS: none. Review 2026-10-22 (nl-en r2 overlay pass): 29 fixes - 11 notes/feedback capitalised, 4 guillemets to straight quotes, title capitalised, level label removed, calqued 'ontmoeten' for meeting replaced by natural 'afspreken/zien' (8 places), stilted 'zal misschien' / 'zal duren' / 'zal gaan' futures made natural (7 places), 'absoluut zeker' for definitely corrected to 'zeker, absoluut'. NATIVE FLAGS: none."}

course:
  title: "Engels B1"
  description: >-
    Engels leren op B1-niveau voor alledaagse gesprekken over verplichtingen,
    mogelijkheden, hypothetische situaties, tegenstellingen, verhalen,
    beschrijvingen met bijzinnen, professionele communicatie, klachten,
    advies, spijt over het verleden en toekomstplannen, met gedetailleerde
    uitleg in het Nederlands.

units:
  en.b1.unit18.future_plans: {title: "I am going to start a new project"}

lessons:
  en.b1.unit18.lesson01.future_plans_vocabulary: {title: "Woorden voor de toekomst"}
  en.b1.unit18.lesson02.fixed_arrangements_and_intentions: {title: "I am meeting Leila on Friday"}
  en.b1.unit18.lesson03.reading_daniels_plans: {title: "Lezen: Daniels plannen voor volgende maand"}
  en.b1.unit18.lesson04.the_planning_dialogue: {title: "It will probably take two months"}

teaching:
  en.b1.unit18.lesson01.teach.arrangement: {title: "arrangement", gloss: "afspraak", note: "*arrangement* betekent een plan dat al vastligt met iemand anders, zoals een afgesproken tijd.", example_gloss: "Mia heeft vrijdag een afspraak met Leila."}
  en.b1.unit18.lesson01.teach.intention: {title: "intention", gloss: "intentie", note: "*intention* betekent iets wat je hebt besloten te doen, maar waarvoor je nog geen tijd hebt vastgelegd met iemand anders.", example_gloss: "Daniels intentie is om het project vroeg af te ronden."}
  en.b1.unit18.lesson01.teach.prediction: {title: "prediction", gloss: "voorspelling", note: "*prediction* betekent een inschatting van wat er zal gebeuren, gebaseerd op aanwijzingen.", example_gloss: "Mijn voorspelling is dat het project op tijd klaar zal zijn."}
  en.b1.unit18.lesson01.teach.definitely: {title: "definitely", gloss: "zeker, absoluut", note: "*definitely* laat zien dat je volledig zeker bent dat iets zal gebeuren.", example_gloss: "Daniel maakt het rapport vandaag zeker af."}
  en.b1.unit18.lesson01.teach.probably: {title: "probably", gloss: "waarschijnlijk", note: "*probably* laat zien dat je redelijk zeker bent, maar niet volledig zeker.", example_gloss: "Het project duurt waarschijnlijk twee maanden."}
  en.b1.unit18.lesson01.teach.might: {title: "might", gloss: "misschien", note: "*might* laat zien dat iets slechts een zwakke mogelijkheid is.", example_gloss: "Daniel vraagt misschien Leila om bij het team te komen."}

  en.b1.unit18.lesson02.teach.meeting_leila_friday: {title: "I am + werkwoord-ing (vaste afspraak)", gloss: "Ik spreek vrijdag met Leila af voor de lunch.", note: "*I am meeting Leila for lunch on Friday* gebruikt de present continuous voor een vaste afspraak met een specifieke, al afgesproken tijd."}
  en.b1.unit18.lesson02.teach.going_to_start_project: {title: "I am going to + werkwoord (intentie)", gloss: "Ik ga een nieuw project starten met het designteam.", note: "*I am going to start a new project* gebruikt going to voor een beslissing die al genomen is, zonder een vaste tijd."}
  en.b1.unit18.lesson02.teach.grammar_arrangements_vs_intentions: {title: "Vaste afspraken versus intenties", gloss: "Gebruik de present continuous (I am meeting Leila on Friday) voor een vaste afspraak: een specifieke tijd die al met iemand anders is afgesproken. Gebruik going to (I am going to start a new project) voor een intentie of beslissing die je al hebt genomen, ook zonder vaste tijd.", note: "Vorm: kies tussen present continuous voor een vaste afspraak of going to voor een intentie."}

  en.b1.unit18.lesson03.teach.on_time: {title: "on time", gloss: "op tijd", note: "*on time* betekent precies op de geplande tijd of datum.", example_gloss: "Daniel denkt dat het project op tijd klaar zal zijn."}
  en.b1.unit18.lesson03.teach.confident: {title: "confident", gloss: "zelfverzekerd", note: "*confident* betekent je zeker voelen dat iets goed zal gaan.", example_gloss: "Daniel voelt zich zelfverzekerd over het nieuwe project."}
  en.b1.unit18.lesson03.teach.reading_passage: {title: "Leestekst: Daniels plannen voor volgende maand", gloss: "Daniel gaat volgende maand een nieuw project starten met het designteam. Hij ziet ze vrijdagochtend om de eerste stappen te plannen. Daniel voelt zich zelfverzekerd over het project, maar hij is niet helemaal zeker dat het op tijd klaar zal zijn. Hij voorspelt dat het waarschijnlijk ongeveer twee maanden zal duren. Hij vraagt misschien Leila om bij het team te komen, omdat zij nuttige designervaring heeft. Als zij toestemt, gaat het project zeker sneller.", note: "Een korte leestekst over plannen en voorspellingen."}

  en.b1.unit18.lesson04.teach.q_plans_next_month: {title: "Mia vraagt naar Daniels plannen", gloss: "Mia zegt: Daniel, wat zijn je plannen voor volgende maand?", note: "Een open vraag om het gesprek te openen."}
  en.b1.unit18.lesson04.teach.a_going_to_start: {title: "Daniel vertelt zijn intentie", gloss: "Daniel zegt: ik ga een nieuw project starten met het designteam.", note: "*going to* geeft een al genomen beslissing aan."}
  en.b1.unit18.lesson04.teach.q_meeting_this_week: {title: "Mia vraagt door", gloss: "Mia zegt: dat klinkt spannend. Zie je ze deze week?", note: "Een vervolgvraag over een vaste afspraak."}
  en.b1.unit18.lesson04.teach.a_meeting_friday_morning: {title: "Daniel bevestigt de vaste afspraak", gloss: "Daniel zegt: ja, ik zie ze vrijdagochtend.", note: "*I am meeting... on Friday morning* is de present continuous voor een vaste afspraak."}
  en.b1.unit18.lesson04.teach.q_finish_on_time: {title: "Mia vraagt naar de deadline", gloss: "Mia zegt: denk je dat het project op tijd klaar zal zijn?", note: "Een vraag naar een voorspelling."}
  en.b1.unit18.lesson04.teach.a_probably_two_months: {title: "Daniel geeft een voorspelling", gloss: "Daniel zegt: ik weet het niet zeker, maar het duurt waarschijnlijk ongeveer twee maanden.", note: "*probably* laat een redelijke, maar niet volledige zekerheid zien."}
  en.b1.unit18.lesson04.teach.q_sure_it_will_go_well: {title: "Mia is optimistisch", gloss: "Mia zegt: nou, ik weet zeker dat het goed komt.", note: "Een bemoedigende opmerking."}
  en.b1.unit18.lesson04.teach.a_might_ask_leila: {title: "Daniel noemt een zwakke mogelijkheid", gloss: "Daniel zegt: bedankt. Misschien vraag ik Leila ook om bij het team te komen.", note: "*might* laat een zwakke mogelijkheid zien."}

