course:
  title: "Engels B1"
  description: >-
    Engels leren op B1-niveau voor alledaagse gesprekken over verplichtingen,
    mogelijkheden, hypothetische situaties, tegenstellingen, verhalen,
    beschrijvingen met bijzinnen, professionele communicatie en klachten,
    met gedetailleerde uitleg in het Nederlands.

units:
  en.b1.unit15.complaints: {title: "I'm writing to complain about..."}

lessons:
  en.b1.unit15.lesson01.complaints_vocabulary: {title: "Woorden voor het indienen van een klacht"}
  en.b1.unit15.lesson02.complaint_sentences: {title: "I'm writing to complain about a damaged product"}
  en.b1.unit15.lesson03.reading_a_complaint_email: {title: "Lezen: een klacht over een bureaustoel"}
  en.b1.unit15.lesson04.the_complaint_call_dialogue: {title: "Would you like a refund or a replacement?"}

teaching:
  en.b1.unit15.lesson01.teach.complain: {title: "complain", gloss: "klagen", note: "*complain* betekent formeel zeggen dat iets niet goed of niet naar tevredenheid is.", example_gloss: "Mia besloot te klagen over de beschadigde stoel."}
  en.b1.unit15.lesson01.teach.damaged: {title: "damaged", gloss: "beschadigd", note: "*damaged* beschrijft een product dat kapot of beschadigd is.", example_gloss: "De stoel kwam beschadigd aan."}
  en.b1.unit15.lesson01.teach.refund: {title: "refund", gloss: "terugbetaling", note: "*refund* betekent geld dat wordt terugbetaald voor een geretourneerd of defect product.", example_gloss: "Mia vroeg om een terugbetaling."}
  en.b1.unit15.lesson01.teach.replacement: {title: "replacement", gloss: "vervanging", note: "*replacement* betekent een nieuw item in plaats van een defect item.", example_gloss: "Het bedrijf bood in plaats daarvan een vervanging aan."}
  en.b1.unit15.lesson01.teach.resolve: {title: "resolve", gloss: "oplossen", note: "*resolve* betekent een probleem volledig oplossen.", example_gloss: "De medewerker beloofde het probleem snel op te lossen."}
  en.b1.unit15.lesson01.teach.issue: {title: "issue", gloss: "probleem", note: "*issue* betekent een probleem dat aangepakt moet worden.", example_gloss: "Mia legde het probleem duidelijk uit."}

  en.b1.unit15.lesson02.teach.writing_to_complain: {title: "I'm writing to complain about + zelfstandig naamwoord", gloss: "Ik schrijf u om te klagen over een beschadigd product.", note: "*I'm writing to complain about* opent een beleefde schriftelijke klacht."}
  en.b1.unit15.lesson02.teach.would_like_refund: {title: "I would like + zelfstandig naamwoord", gloss: "Ik zou graag een terugbetaling willen voor dit artikel.", note: "*I would like a refund for* vraagt beleefd om geld terug."}
  en.b1.unit15.lesson02.teach.grammar_complaint_structure: {title: "de opbouw van een beleefde klacht", gloss: "Een beleefde schriftelijke klacht heeft meestal drie delen: benoem het probleem (I'm writing to complain about...), zeg wat er al is gebeurd (it arrived damaged / it stopped working), en vraag om een specifieke oplossing (I would like a refund / I would like a replacement).", note: "vorm: benoem het probleem, zeg wat er is gebeurd, vraag om een specifieke oplossing."}

  en.b1.unit15.lesson03.teach.desk_chair: {title: "desk chair", gloss: "bureaustoel", note: "*desk chair* betekent een stoel om aan een bureau te zitten.", example_gloss: "Mia bestelde een nieuwe bureaustoel voor haar thuiskantoor."}
  en.b1.unit15.lesson03.teach.as_soon_as_possible: {title: "as soon as possible", gloss: "zo snel mogelijk", note: "*as soon as possible* betekent zonder onnodige vertraging.", example_gloss: "Mia vroeg zo snel mogelijk om een vervanging."}
  en.b1.unit15.lesson03.teach.reading_passage: {title: "leestekst: een klacht over een bureaustoel", gloss: "Beste GreenDesk-team, ik schrijf u om te klagen over een beschadigd product. Ik bestelde vorige week een bureaustoel voor mijn thuiskantoor, maar hij kwam aan met een kapot wieltje. Ik zou graag zo snel mogelijk een vervanging willen. Laat me weten hoe ik verder moet gaan. Bedankt, Mia", note: "een korte, beleefde klachtenbrief op B1-niveau."}

  en.b1.unit15.lesson04.teach.q_calling_to_complain: {title: "Mia belt om te klagen over de bureaustoel", gloss: "Mia zegt: hallo, ik bel om te klagen over een bureaustoel die ik heb besteld.", note: "*I'm calling to complain about* opent een beleefde telefonische klacht."}
  en.b1.unit15.lesson04.teach.a_whats_the_issue: {title: "de medewerker vraagt naar het probleem", gloss: "Medewerker zegt: wat vervelend om te horen. Wat is het probleem ermee?", note: "*I'm sorry to hear that* is een beleefde, empathische reactie."}
  en.b1.unit15.lesson04.teach.q_broken_wheel_cant_use: {title: "Mia beschrijft het probleem", gloss: "Mia zegt: hij kwam aan met een kapot wieltje, dus ik kan hem niet gebruiken.", note: "*it arrived with a broken wheel* legt uit wat er al is gebeurd."}
  en.b1.unit15.lesson04.teach.a_refund_or_replacement: {title: "de medewerker biedt een oplossing aan", gloss: "Medewerker zegt: ik begrijp het. Wil je liever een terugbetaling of een vervanging?", note: "*would you like... or...* biedt de klant een keuze."}
  en.b1.unit15.lesson04.teach.q_prefer_replacement: {title: "Mia kiest een vervanging", gloss: "Mia zegt: ik zou liever een vervanging hebben, als dat mogelijk is.", note: "*I would prefer a replacement, if that's possible* geeft beleefd een voorkeur aan."}
  en.b1.unit15.lesson04.teach.a_resolve_send_friday: {title: "de medewerker bevestigt de oplossing", gloss: "Medewerker zegt: natuurlijk. We lossen dit op en sturen vrijdag een nieuwe stoel.", note: "*we'll resolve this and send... by Friday* geeft een concrete belofte met datum."}

exercises:
  en.b1.unit15.lesson01.exercise01.listen_word:
    instruction: "Luister en kies het woord dat gezegd wordt."
    correct_option: "damaged"
    distractors: ["complain", "refund", "resolve"]
    accepted_answers: [{value: "damaged", status: "correct"}]
    feedback: "*damaged* betekent beschadigd."
  en.b1.unit15.lesson01.exercise02.choose_complain:
    instruction: "Welk woord betekent formeel zeggen dat iets niet goed of niet naar tevredenheid is?"
    correct_option: "complain"
    distractors: ["issue", "resolve", "replacement"]
    accepted_answers: [{value: "complain", status: "correct"}]
    feedback: "*complain* betekent klagen."
  en.b1.unit15.lesson01.exercise03.choose_issue:
    instruction: "Welk woord betekent een probleem dat aangepakt moet worden?"
    correct_option: "issue"
    distractors: ["refund", "damaged", "complain"]
    accepted_answers: [{value: "issue", status: "correct"}]
    feedback: "*issue* betekent probleem."
  en.b1.unit15.lesson01.exercise04.match_complaint_words:
    instruction: "Verbind elke betekenis met het juiste Engelse woord."
    accepted_answers:
      - value:
          - {left: "complain", right: "to say formally that something is wrong or unsatisfactory"}
          - {left: "damaged", right: "reason for a replacement"}
          - {left: "replacement", right: "a new item given in place of a faulty one"}
          - {left: "resolve", right: "to fix or settle a problem completely"}
          - {left: "issue", right: "a problem that needs to be dealt with"}
        status: "correct"
    feedback: "Elke omschrijving hoort bij één Engels woord of één Engelse uitdrukking."
  en.b1.unit15.lesson01.exercise05.write_issue:
    instruction: "Schrijf het woord dat een probleem betekent dat aangepakt moet worden."
    accepted_answers:
      - {value: "issue", status: "correct"}
      - {value: "Issue", status: "correct"}
    feedback: "*issue* betekent probleem."

  en.b1.unit15.lesson02.exercise01.choose_writing_to_complain:
    instruction: "Welke zin opent beleefd een schriftelijke klacht over een beschadigd product?"
    correct_option: "I'm writing to complain about a damaged product."
    distractors: ["I would like a refund for this item.", "The product arrived on time.", "I ordered a new desk chair."]
    accepted_answers: [{value: "I'm writing to complain about a damaged product.", status: "correct"}]
    feedback: "*I'm writing to complain about...* is de beleefde openingszin."
  en.b1.unit15.lesson02.exercise02.choose_would_like_refund:
    instruction: "Welke zin vraagt beleefd om geld terug voor een artikel?"
    correct_option: "I would like a refund for this item."
    distractors: ["I'm writing to complain about a damaged product.", "This item was refunded already.", "I would like to buy this item."]
    accepted_answers: [{value: "I would like a refund for this item.", status: "correct"}]
    feedback: "*I would like a refund for...* is de beleefde manier om geld terug te vragen."
  en.b1.unit15.lesson02.exercise03.order_writing_to_complain:
    instruction: "Zet de woorden in de juiste volgorde voor «ik schrijf u om te klagen over een beschadigd product»."
    accepted_answers: [{value: ["I'm", "writing", "to", "complain", "about", "a", "damaged", "product"], status: "correct"}]
    feedback: "de juiste volgorde is *I'm writing to complain about a damaged product*."
  en.b1.unit15.lesson02.exercise04.reply_complain_desk_chair:
    instruction: "Open beleefd een schriftelijke klacht over een beschadigd product, beginnend met 'I'm writing to complain about'."
    accepted_answers:
      - {value: "I'm writing to complain about a damaged product.", status: "correct"}
      - {value: "I'm writing to complain about a damaged product", status: "correct"}
    feedback: "*I'm writing to complain about...* begint met de gevraagde vorm."
  en.b1.unit15.lesson02.exercise05.write_would_like_refund:
    instruction: "Schrijf een beleefd verzoek om een terugbetaling voor dit artikel, beginnend met 'I would like a refund for'."
    accepted_answers:
      - {value: "I would like a refund for this item.", status: "correct"}
      - {value: "I would like a refund for this item", status: "correct"}
    feedback: "*I would like a refund for...* begint met de gevraagde vorm."

  en.b1.unit15.lesson03.exercise01.comprehend_broken_wheel:
    instruction: "Wat is er mis met de bureaustoel die Mia bestelde?"
    correct_option: "it arrived with a broken wheel"
    distractors: ["it arrived the wrong color", "it never arrived at all", "it arrived without instructions"]
    accepted_answers: [{value: "it arrived with a broken wheel", status: "correct"}]
    feedback: "de tekst zegt *it arrived with a broken wheel*."
  en.b1.unit15.lesson03.exercise02.comprehend_wants_replacement:
    instruction: "Om welke oplossing vraagt Mia, en hoe snel?"
    correct_option: "a replacement as soon as possible"
    distractors: ["a refund within a month", "a repair next year", "a replacement in six months"]
    accepted_answers: [{value: "a replacement as soon as possible", status: "correct"}]
    feedback: "de tekst zegt *I would like a replacement as soon as possible*."
  en.b1.unit15.lesson03.exercise03.recognize_desk_chair:
    instruction: "Welke uitdrukking noemt het meubelstuk dat Mia bestelde?"
    correct_option: "desk chair"
    distractors: ["as soon as possible", "damaged", "refund"]
    accepted_answers: [{value: "desk chair", status: "correct"}]
    feedback: "*desk chair* betekent bureaustoel."
  en.b1.unit15.lesson03.exercise04.order_replacement_soon:
    instruction: "Zet de woorden in de juiste volgorde voor «ik zou graag zo snel mogelijk een vervanging willen»."
    accepted_answers: [{value: ["I", "would", "like", "a", "replacement", "as", "soon", "as", "possible"], status: "correct"}]
    feedback: "de juiste volgorde is *I would like a replacement as soon as possible*."
  en.b1.unit15.lesson03.exercise05.write_ordered_desk_chair:
    instruction: "Schrijf een zin waarin je zegt dat je een bureaustoel voor je thuiskantoor hebt besteld, beginnend met 'I ordered'."
    accepted_answers:
      - {value: "I ordered a desk chair for my home office.", status: "correct"}
      - {value: "I ordered a desk chair for my home office", status: "correct"}
    feedback: "*I ordered...* begint met de gevraagde vorm."

  en.b1.unit15.lesson04.exercise01.listen_calling_to_complain:
    instruction: "Luister naar het gesprek en kies waarom Mia belt."
    correct_option: "calling to complain about a desk chair I ordered"
    distractors: ["calling to order a new desk chair", "calling to complain about a late delivery", "calling to cancel her order"]
    accepted_answers: [{value: "calling to complain about a desk chair I ordered", status: "correct"}]
    feedback: "Mia zegt *I'm calling to complain about a desk chair I ordered*."
  en.b1.unit15.lesson04.exercise02.listen_broken_wheel:
    instruction: "Luister en kies wat er mis is met de stoel."
    correct_option: "It arrived with a broken wheel"
    distractors: ["It arrived the wrong color", "It arrived without a seat", "It arrived very late"]
    accepted_answers: [{value: "It arrived with a broken wheel", status: "correct"}]
    feedback: "Mia zegt *It arrived with a broken wheel*."
  en.b1.unit15.lesson04.exercise03.choose_agent_offer:
    instruction: "Wat biedt de medewerker Mia aan?"
    correct_option: "Would you like a refund or a replacement?"
    distractors: ["Would you like a discount or a coupon?", "Would you like to cancel or reorder?", "Would you like to speak to a manager?"]
    accepted_answers: [{value: "Would you like a refund or a replacement?", status: "correct"}]
    feedback: "de medewerker zegt *Would you like a refund or a replacement?*."
  en.b1.unit15.lesson04.exercise04.order_prefer_replacement:
    instruction: "Zet de woorden in de juiste volgorde voor «ik zou liever een vervanging hebben, als dat mogelijk is»."
    accepted_answers: [{value: ["I", "would", "prefer", "a", "replacement", "if", "that's", "possible"], status: "correct"}]
