teaching:
  en.a1.unit43.lesson01.teach.red: {title: "red", gloss: "rood", note: "*red* betekent rood.", example_gloss: "Mijn auto is rood."}
  en.a1.unit43.lesson01.teach.blue: {title: "blue", gloss: "blauw", note: "*blue* betekent blauw.", example_gloss: "De lucht is blauw."}
  en.a1.unit43.lesson01.teach.green: {title: "green", gloss: "groen", note: "*green* betekent groen.", example_gloss: "Het gras is groen."}
  en.a1.unit43.lesson01.teach.yellow: {title: "yellow", gloss: "geel", note: "*yellow* betekent geel.", example_gloss: "De zon is geel."}
  en.a1.unit43.lesson01.teach.black: {title: "black", gloss: "zwart", note: "*black* betekent zwart.", example_gloss: "Zijn schoenen zijn zwart."}
  en.a1.unit43.lesson01.teach.white: {title: "white", gloss: "wit", note: "*white* betekent wit.", example_gloss: "Haar overhemd is wit."}

  en.a1.unit43.lesson02.teach.dark_blue: {title: "dark blue", gloss: "donkerblauw", note: "*dark blue* wordt in het Engels als twee losse woorden geschreven -- niet als één samengesteld woord zoals het Nederlandse donkerblauw.", example_gloss: "Hij draagt een donkerblauw overhemd."}
  en.a1.unit43.lesson02.teach.light_green: {title: "light green", gloss: "lichtgroen", note: "*light green* wordt net als dark blue als twee losse woorden geschreven, niet als één samengesteld woord.", example_gloss: "Ze schilderde haar slaapkamer lichtgroen."}
  en.a1.unit43.lesson02.teach.goes_well_with: {title: "goes well with", gloss: "past goed bij", note: "*goes well with* betekent dat twee kleuren of kledingstukken goed bij elkaar passen.", example_gloss: "Dit blauwe overhemd past goed bij een zwarte broek."}
  en.a1.unit43.lesson02.teach.too_bright: {title: "too bright", gloss: "te fel", note: "*too bright* betekent te fel of te opvallend van kleur.", example_gloss: "Geel is een leuke kleur, maar te fel voor werk."}
  en.a1.unit43.lesson02.teach.whats_your_favorite_color: {title: "What's your favorite color?", gloss: "Wat is je lievelingskleur?", note: "What's your favorite ...? vraagt naar iemands voorkeur."}
  en.a1.unit43.lesson02.teach.my_favorite_color_is: {title: "My favorite color is blue.", gloss: "Mijn lievelingskleur is blauw.", note: "My favorite ... is ... is de vaste manier om een voorkeur te noemen."}

  en.a1.unit43.lesson03.teach.dialogue_line1: {title: "Daniels vraag", gloss: "Daniel vraagt: Ik heb een nieuw overhemd nodig voor onze presentatie volgende week. Kun je me helpen een kleur te kiezen?", note: "Can you help me + werkwoord? vraagt om hulp."}
  en.a1.unit43.lesson03.teach.dialogue_line2: {title: "Mia's vraag", gloss: "Mia zegt: Tuurlijk! Welke kleuren vind je mooi?", note: "What colors do you like? vraagt naar iemands voorkeur voor kleuren."}
  en.a1.unit43.lesson03.teach.dialogue_line3: {title: "Daniels antwoord", gloss: "Daniel zegt: Ik vind blauw en groen mooi, maar ik weet niet zeker wat professioneel oogt.", note: "I'm not sure what looks professional betekent ik weet niet zeker wat professioneel oogt."}
  en.a1.unit43.lesson03.teach.dialogue_line4: {title: "Mia's advies", gloss: "Mia zegt: Donkerblauw is een geweldige keuze. Het oogt professioneel, en het past goed bij een zwarte broek.", note: "It looks professional betekent het oogt professioneel."}
  en.a1.unit43.lesson03.teach.dialogue_line5: {title: "Daniels vraag", gloss: "Daniel vraagt: En dit gele exemplaar?", note: "What about ...? stelt een alternatief voor."}
  en.a1.unit43.lesson03.teach.dialogue_line6: {title: "Mia's advies", gloss: "Mia zegt: Geel is een leuke kleur, maar te fel voor een presentatie. Ik zou het donkerblauwe overhemd kiezen.", note: "I'd choose betekent ik zou kiezen."}
  en.a1.unit43.lesson03.teach.dialogue_line7: {title: "Daniels beslissing", gloss: "Daniel zegt: Bedankt, Mia. Donkerblauw wordt het dan!", note: "Dark blue it is! is een informele manier om een beslissing te bevestigen."}

  en.a1.unit43.lesson04.teach.reading_passage: {title: "Tekst over drie lievelingskleuren", gloss: "Daniel, Leila en Mia hebben allemaal een andere lievelingskleur. Daniels lievelingskleur is blauw. Hij zegt dat het een kalme kleur is, en dat het bij bijna alles past wat hij naar zijn werk draagt. Leila's lievelingskleur is groen, de kleur van de planten en tuinen die ze graag schildert. Ze vindt lichtgroen bijzonder mooi. Mia's lievelingskleur is geel, omdat het haar aan de zon doet denken en haar altijd blij maakt. Ook al houden ze alle drie van een andere kleur, ze zijn het erover eens dat kleuren alledaagse gesprekken leuker maken.", note: "reminds her of the sun betekent doet haar aan de zon denken."}

