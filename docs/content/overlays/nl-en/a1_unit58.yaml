course:
  title: Engels A1
  description: >-
    Engels voor beginners, met heldere uitleg in het Nederlands en aandacht
    voor alledaagse gesprekken.

units:
  en.a1.unit58.museum: {title: "Een bezoek aan het museum"}

lessons:
  en.a1.unit58.lesson01.museum_vocabulary: {title: "Woorden voor het museum"}
  en.a1.unit58.lesson02.phrases_for_the_museum: {title: "Zinnen voor het museum"}
  en.a1.unit58.lesson03.dialogue_at_the_museum: {title: "Gesprek: In het museum"}
  en.a1.unit58.lesson04.an_afternoon_at_the_museum: {title: "Lezen: Een middag in het museum"}

teaching:
  en.a1.unit58.lesson01.teach.museum: {title: "museum", gloss: "museum", note: "*museum* betekent museum -- in het Nederlands bijna hetzelfde woord.", example_gloss: "Dit museum is erg oud."}
  en.a1.unit58.lesson01.teach.ticket: {title: "ticket", gloss: "het kaartje", note: "*ticket* betekent een toegangsbewijs, in het Nederlands meestal *het kaartje* genoemd.", example_gloss: "Ik heb één kaartje nodig, alstublieft."}
  en.a1.unit58.lesson01.teach.exhibition: {title: "exhibition", gloss: "de tentoonstelling", note: "*exhibition* betekent een verzameling kunst of voorwerpen die te bekijken is.", example_gloss: "Er is een nieuwe tentoonstelling."}
  en.a1.unit58.lesson01.teach.painting: {title: "painting", gloss: "het schilderij", note: "*painting* betekent een kunstwerk gemaakt met verf.", example_gloss: "Ik vind dit schilderij heel mooi."}
  en.a1.unit58.lesson01.teach.sculpture: {title: "sculpture", gloss: "het beeld", note: "*sculpture* betekent een kunstwerk gemaakt van steen, hout of metaal -- in het Nederlands meestal *beeld* genoemd.", example_gloss: "Dit beeld is ook erg oud."}
  en.a1.unit58.lesson01.teach.guide: {title: "guide", gloss: "de gids", note: "*guide* betekent een persoon die bezoekers rondleidt en dingen uitlegt.", example_gloss: "Is er vandaag een gids?"}

  en.a1.unit58.lesson02.teach.what_time_does_the_museum_open: {title: "What time does the museum open?", gloss: "Hoe laat gaat het museum open?", note: "Deze vraag begint met *what time*, gevolgd door het hulpwerkwoord *does* omdat het hoofdwerkwoord *open* is."}
  en.a1.unit58.lesson02.teach.what_time_does_the_museum_close: {title: "What time does the museum close?", gloss: "Hoe laat gaat het museum dicht?", note: "Dezelfde vraagstructuur als *What time does the museum open?*, nu met *close* in plaats van *open*."}
  en.a1.unit58.lesson02.teach.two_tickets_please: {title: "Two tickets, please.", gloss: "Twee kaartjes, alstublieft.", note: "*please* aan het einde maakt de bestelling beleefd, net als bij eten bestellen in eerdere units."}
  en.a1.unit58.lesson02.teach.is_there_a_guide_for_the_exhibition: {title: "Is there a guide for the exhibition?", gloss: "Is er een gids voor de tentoonstelling?", note: "*Is there...?* wordt gebruikt om te vragen of iets aanwezig is -- hier een gids."}
  en.a1.unit58.lesson02.teach.the_museum_is_open_every_day: {title: "The museum is open every day.", gloss: "Het museum is elke dag open.", note: "*every day* betekent elke dag, en staat aan het einde van de zin."}
  en.a1.unit58.lesson02.teach.i_really_enjoyed_the_paintings: {title: "I really enjoyed the paintings!", gloss: "Ik heb echt genoten van de schilderijen!", note: "*enjoyed* is de verleden tijd van *enjoy* (genieten), gebruikt om terug te kijken op iets leuks."}

  en.a1.unit58.lesson03.teach.dialogue_line1: {title: "Daniels vraag", gloss: "Daniel zegt: hoi! Hoe laat gaat het museum dicht?", note: "*Hi!* is een informele begroeting."}
  en.a1.unit58.lesson03.teach.dialogue_line2: {title: "De medewerker antwoordt", gloss: "De medewerker zegt: we gaan om vijf uur dicht.", note: "*at* + tijdstip geeft aan wanneer iets gebeurt, zoals bij *at five o'clock*."}
  en.a1.unit58.lesson03.teach.dialogue_line3: {title: "Mia's verzoek", gloss: "Mia zegt: geweldig. Mogen we twee kaartjes, alstublieft?", note: "*Can we have...?* is een beleefde manier om iets te bestellen of te vragen."}
  en.a1.unit58.lesson03.teach.dialogue_line4: {title: "De prijs", gloss: "De medewerker zegt: natuurlijk. Dat is twaalf dollar.", note: "*That's* + bedrag wordt gebruikt om een prijs te noemen."}
  en.a1.unit58.lesson03.teach.dialogue_line5: {title: "Daniels vraag over de gids", gloss: "Daniel vraagt: is er een gids voor de tentoonstelling?", note: "Dezelfde *Is there...?*-structuur als eerder in les 2 geleerd."}
  en.a1.unit58.lesson03.teach.dialogue_line6: {title: "De medewerker over de gids", gloss: "De medewerker zegt: ja, er is een gids bij de ingang.", note: "*there's* is de samentrekking van *there is*."}
  en.a1.unit58.lesson03.teach.dialogue_line7: {title: "Mia vraagt naar de naam", gloss: "Mia vraagt: hoe heet de tentoonstelling?", note: "*What is ... called?* is de gebruikelijke manier om naar de naam van iets te vragen."}
  en.a1.unit58.lesson03.teach.dialogue_line8: {title: "De naam van de tentoonstelling", gloss: "De medewerker zegt: het heet Colors of the City.", note: "*It's called...* is het antwoord op de vraag *What is ... called?*."}
  en.a1.unit58.lesson03.teach.dialogue_line9: {title: "Daniels afsluiting", gloss: "Daniel zegt: dank u! Ik kan niet wachten om de schilderijen te zien.", note: "*can't wait to...* betekent erg enthousiast zijn om iets te doen."}

  en.a1.unit58.lesson04.teach.museum_notice: {title: "Museumbord", gloss: "Stadsmuseum: elke dag open, van 9.00 tot 17.00 uur. Volwassenenkaartje: 6 dollar. Huidige tentoonstelling: Colors of the City, Zaal 2.", note: "Dit is een echt museumbord met openingstijden, prijs en de naam van de tentoonstelling."}
  en.a1.unit58.lesson04.teach.reading_passage: {title: "Tekst over Daniel en Mia", gloss: "Een bezoek aan het museum: Op een zaterdagmiddag besloten Daniel en Mia samen het Stadsmuseum te bezoeken. Bij de ingang vertelde de medewerker hen dat het museum om vijf uur sluit. Ze kochten twee kaartjes voor twaalf dollar. Daniel vroeg naar een gids, en de medewerker zei dat er een gids bij de ingang was. Ze bezochten de tentoonstelling, Colors of the City, en zagen veel mooie schilderijen in zaal 2. Daniel vond een schilderij van het oude stadsplein mooi, en Mia vond een schilderij van de rivier bij zonsondergang mooi. Toen ze weggingen, zei Mia dat ze de volgende keer de beeldentoonstelling wil bezoeken.", note: "*decided to visit* gebruikt *to* + infinitief na *decided*, om aan te geven wat iemand besloot te doen."}

exercises:
  en.a1.unit58.lesson01.exercise01.listen_word:
    instruction: "Luister en kies het genoemde woord."
    correct_option: "ticket"
    distractors: ["museum", "exhibition", "painting"]
    accepted_answers: [{value: "ticket", status: correct}]
    feedback: "*ticket* betekent kaartje."
  en.a1.unit58.lesson01.exercise02.choose_sculpture_meaning:
    instruction: "Welk woord betekent een standbeeld gemaakt van steen, hout of metaal?"
    correct_option: "sculpture"
    distractors: ["painting", "exhibition", "guide"]
    accepted_answers: [{value: "sculpture", status: correct}]
    feedback: "*sculpture* betekent beeld."
  en.a1.unit58.lesson01.exercise03.match_museum_words:
    instruction: "Verbind elk Engels woord met de juiste omschrijving."
    pairs:
      - {left: "museum", right: "een gebouw waar je kunst en historische voorwerpen kunt bekijken"}
      - {left: "ticket", right: "een stukje papier of karton dat je koopt om naar binnen te mogen"}
      - {left: "exhibition", right: "een verzameling kunst of voorwerpen die wordt getoond"}
      - {left: "painting", right: "een afbeelding die met verf is gemaakt"}
      - {left: "sculpture", right: "een beeld van steen, hout of metaal"}
      - {left: "guide", right: "iemand die bezoekers rondleidt en uitleg geeft"}
    accepted_answers:
      - value:
          - {left: "museum", right: "een gebouw waar je kunst en historische voorwerpen kunt bekijken"}
          - {left: "ticket", right: "een stukje papier of karton dat je koopt om naar binnen te mogen"}
          - {left: "exhibition", right: "een verzameling kunst of voorwerpen die wordt getoond"}
          - {left: "painting", right: "een afbeelding die met verf is gemaakt"}
          - {left: "sculpture", right: "een beeld van steen, hout of metaal"}
          - {left: "guide", right: "iemand die bezoekers rondleidt en uitleg geeft"}
        status: "correct"
    feedback: "museum=museum, ticket=kaartje, exhibition=tentoonstelling, painting=schilderij, sculpture=beeld, guide=gids."
  en.a1.unit58.lesson01.exercise04.order_museum_sentence:
    instruction: "Zet de woorden in de juiste volgorde."
    accepted_answers: [{value: ["This", "museum", "is", "very", "old."], status: correct}]
    feedback: "De juiste volgorde is *This museum is very old.*"
  en.a1.unit58.lesson01.exercise05.write_guide:
    instruction: "Schrijf het woord voor een persoon die bezoekers door een museum rondleidt."
    accepted_answers:
      - {value: "guide", status: correct}
      - {value: "Guide", status: correct}
      - {value: "a guide", status: correct}
      - {value: "tour guide", status: correct}
    feedback: "*guide* betekent gids."

  en.a1.unit58.lesson02.exercise01.listen_phrase:
    instruction: "Luister en kies de genoemde zin."
    correct_option: "What time does the museum close?"
    distractors: ["What time does the museum open?", "Two tickets, please.", "I really enjoyed the paintings!"]
    accepted_answers: [{value: "What time does the museum close?", status: correct}]
    feedback: "*What time does the museum close?* betekent hoe laat het museum dichtgaat."
  en.a1.unit58.lesson02.exercise02.choose_opening_time_question:
    instruction: "Welke zin gebruikt een bezoeker om te vragen wanneer het museum opengaat?"
    correct_option: "What time does the museum open?"
    distractors: ["What time does the museum close?", "Is there a guide for the exhibition?", "Two tickets, please."]
    accepted_answers: [{value: "What time does the museum open?", status: correct}]
    feedback: "*What time does the museum open?* betekent hoe laat het museum opengaat."
  en.a1.unit58.lesson02.exercise03.choose_enjoyed_meaning:
    instruction: "Welke zin zegt iemand nadat hij of zij van de schilderijen heeft genoten?"
    correct_option: "I really enjoyed the paintings!"
    distractors: ["Two tickets, please.", "The museum is open every day.", "What time does the museum close?"]
    accepted_answers: [{value: "I really enjoyed the paintings!", status: correct}]
    feedback: "*I really enjoyed the paintings!* betekent ik heb echt genoten van de schilderijen."
  en.a1.unit58.lesson02.exercise04.order_open_every_day_sentence:
    instruction: "Zet de woorden in de juiste volgorde."
    accepted_answers: [{value: ["The", "museum", "is", "open", "every", "day."], status: correct}]
    feedback: "De juiste volgorde is *The museum is open every day.*"
  en.a1.unit58.lesson02.exercise05.translate_two_tickets_please:
    instruction: "Vertaal: \"Twee kaartjes, alstublieft.\""
    accepted_answers:
      - {value: "Two tickets, please.", status: correct}
      - {value: "Two tickets, please", status: correct}
    feedback: "*Two tickets, please.* betekent twee kaartjes, alstublieft."

  en.a1.unit58.lesson03.exercise01.comprehension_ticket_count:
    instruction: "Hoeveel kaartjes kochten Daniel en Mia volgens het gesprek?"
    correct_option: "two"
    distractors: ["one", "three", "four"]
    accepted_answers: [{value: "two", status: correct}]
    feedback: "Mia vraagt om twee kaartjes."
  en.a1.unit58.lesson03.exercise02.comprehension_closing_time:
