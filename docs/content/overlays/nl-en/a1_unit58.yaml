      - {value: "That's twelve dollars", status: correct}
      - {value: "That's twelve dollars.", status: correct}
      - {value: "There's a guide near the entrance", status: correct}
      - {value: "There's a guide near the entrance.", status: correct}
      - {value: "It's called Colors of the City", status: correct}
      - {value: "It's called Colors of the City.", status: correct}
      - {value: "The museum closes at five o'clock", status: correct}
      - {value: "It closes at five o'clock", status: correct}
      - {value: "We close at five", status: correct}
      - {value: "The tickets are twelve dollars", status: correct}
      - {value: "The tickets cost twelve dollars", status: correct}
      - {value: "It's twelve dollars", status: correct}
      - {value: "There is a guide near the entrance", status: correct}
      - {value: "The exhibition is called Colors of the City", status: correct}
