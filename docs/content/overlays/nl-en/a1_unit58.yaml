    correct_option: "Colors of the City"
    distractors: ["Faces of the City", "Voices of the City", "Shapes of the City"]
    accepted_answers: [{value: "Colors of the City", status: correct}]
    feedback: "De medewerker zegt dat de tentoonstelling *Colors of the City* heet."
