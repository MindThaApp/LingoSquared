  en.a1.unit58.lesson04.exercise04.reading_ticket_count:
    instruction: "Hoeveel kaartjes kochten Daniel en Mia volgens de tekst?"
    correct_option: "two"
    distractors: ["one", "three", "four"]
    accepted_answers: [{value: "two", status: correct}]
