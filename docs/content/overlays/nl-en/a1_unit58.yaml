  en.a1.unit58.lesson04.exercise01.notice_closing_time:
    instruction: "Hoe laat sluit het museum volgens het bord?"
    correct_option: "5:00"
    distractors: ["9:00", "4:00", "6:00"]
    accepted_answers: [{value: "5:00", status: correct}]
    feedback: "Het bord zegt *9:00 to 5:00* -- het museum sluit om 17.00 uur (5:00)."
  en.a1.unit58.lesson04.exercise02.notice_ticket_price:
    instruction: "Hoeveel kost een volwassenenkaartje volgens het bord?"
