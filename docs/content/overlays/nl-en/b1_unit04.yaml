course:
  title: "Engels B1"
  description: >-
    Engels leren op B1-niveau voor alledaagse gesprekken over verplichtingen,
    mogelijkheden, hypothetische situaties en verhalen, met gedetailleerde
    uitleg in het Nederlands.

units:
  en.b1.unit04.debate: {title: "I agree, I disagree, because"}

lessons:
  en.b1.unit04.lesson01.debate_vocabulary: {title: "Agree, disagree en opinion"}
  en.b1.unit04.lesson02.agreeing_and_disagreeing: {title: "I agree that, I disagree that"}
  en.b1.unit04.lesson03.reading_two_opinions: {title: "Lezen: twee verschillende meningen"}
  en.b1.unit04.lesson04.the_remote_work_dialogue: {title: "Everyone has a different opinion"}

teaching:
  en.b1.unit04.lesson01.teach.agree: {title: "agree", gloss: "het eens zijn", note: "*agree* betekent denken dat iemand anders gelijk heeft.", example_gloss: "Ik ben het met je eens."}
  en.b1.unit04.lesson01.teach.disagree: {title: "disagree", gloss: "het oneens zijn", note: "*disagree* betekent denken dat iemand anders ongelijk heeft.", example_gloss: "Ik ben het niet eens met die mening."}
  en.b1.unit04.lesson01.teach.opinion: {title: "opinion", gloss: "mening", note: "*opinion* betekent een persoonlijke mening over iets.", example_gloss: "Iedereen heeft een andere mening."}
  en.b1.unit04.lesson01.teach.believe: {title: "believe", gloss: "geloven, denken", note: "*believe* betekent denken dat iets waar is.", example_gloss: "Ik denk dat het een goed idee is."}
  en.b1.unit04.lesson01.teach.reason: {title: "reason", gloss: "reden", note: "*reason* betekent de verklaring achter een mening.", example_gloss: "Wat is je reden om dat te denken?"}
  en.b1.unit04.lesson01.teach.save_time: {title: "save time", gloss: "tijd besparen", note: "*save time* betekent geen tijd verspillen.", example_gloss: "Thuiswerken helpt me tijd te besparen."}

  en.b1.unit04.lesson02.teach.agree_that_saves_time: {title: "het eens zijn en een reden geven", gloss: "Ik ben het ermee eens dat thuiswerken beter is omdat je tijd bespaart.", note: "*I agree that... because...* combineert een mening met een reden."}
  en.b1.unit04.lesson02.teach.disagree_that_miss_coworkers: {title: "het oneens zijn en een reden geven", gloss: "Ik ben het er niet mee eens dat het beter is omdat je je collega's mist.", note: "*I disagree that... because...* combineert een tegengestelde mening met een reden."}
  en.b1.unit04.lesson02.teach.grammar_agree_disagree_that: {title: "agree that / disagree that", gloss: "Ik ben het ermee eens dat het beter is. Ik ben het er niet mee eens dat het beter is.", note: "na *agree*/*disagree* gebruik je *that* om naar de mening van de ander te verwijzen."}

  en.b1.unit04.lesson03.teach.focus: {title: "focus", gloss: "je concentreren", note: "*focus* betekent je aandacht ergens op richten.", example_gloss: "Zij kan zich thuis makkelijker concentreren."}
  en.b1.unit04.lesson03.teach.respect: {title: "respect", gloss: "respecteren", note: "*respect* betekent de mening van iemand anders waarderen, ook als je het er niet mee eens bent.", example_gloss: "Ze respecteren elkaars mening."}
  en.b1.unit04.lesson03.teach.reading_passage: {title: "leestekst: twee meningen", gloss: "Mia denkt dat thuiswerken beter is omdat ze zich dan makkelijker kan concentreren. Leila is het daar niet mee eens. Zij gelooft dat naar kantoor gaan beter is omdat ze het fijn vindt haar collega's elke dag te zien. Ze zijn het niet eens, maar ze respecteren elkaars mening.", note: "een korte leestekst met twee tegengestelde meningen -- B1-niveau."}

  en.b1.unit04.lesson04.teach.q_working_from_home: {title: "Daniel begint het debat", gloss: "Daniel zegt: denk je dat thuiswerken beter is dan naar kantoor gaan?", note: "een open vraag om een meningsverschil te starten."}
  en.b1.unit04.lesson04.teach.a_disagree_miss_coworkers: {title: "Leila is het oneens", gloss: "Leila zegt: ik ben het er niet mee eens dat het beter is. Ik denk dat je belangrijke gesprekken met collega's mist.", note: "Leila geeft haar mening en een reden."}
  en.b1.unit04.lesson04.teach.q_fair_point_saves_time: {title: "Daniel erkent Leila's punt, maar is het gedeeltelijk oneens", gloss: "Daniel zegt: dat is een goed punt, maar ik ben het ermee eens dat het veel tijd bespaart.", note: "*that's a fair point* erkent de mening van de ander voordat je je eigen mening geeft."}
  en.b1.unit04.lesson04.teach.a_agree_saves_time_prefer_office: {title: "Leila geeft toe, maar houdt vast aan haar voorkeur", gloss: "Leila zegt: ik ben het ermee eens dat het tijd bespaart, maar ik geef nog steeds de voorkeur aan kantoor.", note: "Leila geeft één punt toe zonder haar algehele mening te veranderen."}
  en.b1.unit04.lesson04.teach.q_everyone_different_opinion: {title: "Daniel sluit het gesprek af", gloss: "Daniel zegt: dat is logisch. Iedereen heeft een andere mening.", note: "een natuurlijke, vriendelijke manier om een meningsverschil af te sluiten."}

exercises:
  en.b1.unit04.lesson01.exercise01.listen_word:
    instruction: "Luister en kies het woord dat gezegd wordt."
    correct_option: "opinion"
    distractors: ["agree", "disagree", "believe"]
    accepted_answers: [{value: "opinion", status: "correct"}]
    feedback: "*opinion* betekent mening."
  en.b1.unit04.lesson01.exercise02.choose_disagree_word:
    instruction: "Welk woord betekent denken dat iemand ongelijk heeft?"
    correct_option: "disagree"
    distractors: ["agree", "believe", "reason"]
    accepted_answers: [{value: "disagree", status: "correct"}]
    feedback: "*disagree* betekent het oneens zijn."
  en.b1.unit04.lesson01.exercise03.choose_reason_word:
    instruction: "Welk woord betekent de verklaring achter je mening?"
    correct_option: "reason"
    distractors: ["opinion", "agree", "save time"]
    accepted_answers: [{value: "reason", status: "correct"}]
    feedback: "*reason* betekent reden."
  en.b1.unit04.lesson01.exercise04.match_debate_words:
    instruction: "Verbind elke betekenis met het juiste Engelse woord of de juiste uitdrukking."
    accepted_answers:
      - value:
          - {left: "to think someone else is right", right: "agree"}
          - {left: "to think someone else is wrong", right: "disagree"}
          - {left: "a personal view about something", right: "opinion"}
          - {left: "to think something is true", right: "believe"}
          - {left: "the explanation behind an opinion", right: "reason"}
          - {left: "to not waste time", right: "save time"}
        status: "correct"
    feedback: "*agree*=het eens zijn, *disagree*=het oneens zijn, *opinion*=mening, *believe*=geloven, *reason*=reden, *save time*=tijd besparen."
  en.b1.unit04.lesson01.exercise05.write_opinion:
    instruction: "Schrijf het woord voor een persoonlijke mening over iets."
    accepted_answers:
      - {value: "opinion", status: "correct"}
      - {value: "Opinion", status: "correct"}
    feedback: "*opinion* betekent mening."

  en.b1.unit04.lesson02.exercise01.choose_agree_sentence:
    instruction: "Welke zin is het eens met een mening en geeft een reden?"
    correct_option: "I agree that working from home is better because you save time."
    distractors: ["I disagree that it's better because you miss your coworkers.", "Everyone has a different opinion.", "What is your reason for thinking that?"]
    accepted_answers: [{value: "I agree that working from home is better because you save time.", status: "correct"}]
    feedback: "*I agree that... because...* is het eens met een mening en geeft de reden."
  en.b1.unit04.lesson02.exercise02.choose_disagree_sentence:
    instruction: "Welke zin is het oneens met een mening en geeft een reden?"
    correct_option: "I disagree that it's better because you miss your coworkers."
    distractors: ["I agree that working from home is better because you save time.", "Everyone has a different opinion.", "I believe that it's a good idea."]
    accepted_answers: [{value: "I disagree that it's better because you miss your coworkers.", status: "correct"}]
    feedback: "*I disagree that... because...* is het oneens met een mening en geeft de reden."
  en.b1.unit04.lesson02.exercise03.order_agree_that_saves_time:
    instruction: "Zet de woorden in de juiste volgorde voor «ik ben het ermee eens dat thuiswerken beter is»."
    accepted_answers: [{value: ["I", "agree", "that", "working", "from", "home", "is", "better"], status: "correct"}]
    feedback: "de juiste volgorde is *I agree that working from home is better*."
  en.b1.unit04.lesson02.exercise04.reply_do_you_agree:
    instruction: "Iemand vraagt of je het ermee eens bent dat thuiswerken beter is. Bevestig dat, en zeg dat het komt omdat je tijd bespaart."
    accepted_answers:
      - {value: "I agree that working from home is better because you save time.", status: "correct"}
      - {value: "I agree that working from home is better because you save time", status: "correct"}
    feedback: "*I agree that working from home is better because you save time* combineert je mening met de reden."
  en.b1.unit04.lesson02.exercise05.write_disagree_coworkers:
    instruction: "Schrijf dat je het er niet mee eens bent omdat je je collega's mist."
    accepted_answers:
      - {value: "I disagree that it's better because you miss your coworkers.", status: "correct"}
      - {value: "I disagree that it's better because you miss your coworkers", status: "correct"}
      - {value: "I disagree that it is better because you miss your coworkers.", status: "correct"}
      - {value: "I disagree that it is better because you miss your coworkers", status: "correct"}
    feedback: "*it's* is de gesproken samentrekking van *it is*."

  en.b1.unit04.lesson03.exercise01.comprehend_mias_opinion:
    instruction: "Wat denkt Mia dat beter is?"
    correct_option: "working from home is better"
    distractors: ["going to the office is better", "working part-time is better", "having no schedule is better"]
    accepted_answers: [{value: "working from home is better", status: "correct"}]
    feedback: "de tekst zegt dat Mia denkt dat *working from home is better*."
  en.b1.unit04.lesson03.exercise02.comprehend_leilas_reason:
    instruction: "Wat is Leila's reden om kantoor te verkiezen?"
    correct_option: "she likes seeing her coworkers every day"
    distractors: ["she doesn't have internet at home", "she likes the commute", "her manager requires it"]
    accepted_answers: [{value: "she likes seeing her coworkers every day", status: "correct"}]
    feedback: "de tekst zegt *she likes seeing her coworkers every day*."
  en.b1.unit04.lesson03.exercise03.recognize_focus:
    instruction: "Welk woord betekent je aandacht op je werk richten?"
    correct_option: "focus"
    distractors: ["respect", "opinion", "believe"]
    accepted_answers: [{value: "focus", status: "correct"}]
    feedback: "*focus* betekent je concentreren."
  en.b1.unit04.lesson03.exercise04.order_they_respect_each_others:
    instruction: "Zet de woorden in de juiste volgorde voor «ze respecteren elkaars mening»."
    accepted_answers: [{value: ["They", "respect", "each", "other's", "opinion"], status: "correct"}]
    feedback: "de juiste volgorde is *They respect each other's opinion*."
  en.b1.unit04.lesson03.exercise05.write_leila_disagrees:
    instruction: "Schrijf dat Leila het er niet mee eens is."
    accepted_answers:
      - {value: "Leila disagrees.", status: "correct"}
      - {value: "Leila disagrees", status: "correct"}
    feedback: "*Leila disagrees* betekent dat Leila het er niet mee eens is."

  en.b1.unit04.lesson04.exercise01.listen_what_leila_disagrees_with:
    instruction: "Luister naar het gesprek en kies waar Leila het niet mee eens is."
    correct_option: "working from home is better than the office"
    distractors: ["going to the office is better than working from home", "everyone should work from home", "the office is closed on Fridays"]
    accepted_answers: [{value: "working from home is better than the office", status: "correct"}]
    feedback: "Leila is het er niet mee eens dat *working from home is better than the office*."
  en.b1.unit04.lesson04.exercise02.listen_leilas_reason:
    instruction: "Luister en kies Leila's reden."
    correct_option: "you miss important conversations with coworkers"
    distractors: ["you have to buy your own equipment", "you can't ask questions quickly", "you don't get a lunch break"]
    accepted_answers: [{value: "you miss important conversations with coworkers", status: "correct"}]
    feedback: "Leila zegt *you miss important conversations with coworkers*."
  en.b1.unit04.lesson04.exercise03.choose_what_daniel_agrees_with:
    instruction: "Waar is Daniel het mee eens over thuiswerken?"
    correct_option: "it saves a lot of time"
    distractors: ["it's more comfortable", "it's better for coworkers", "it's easier to focus"]
    accepted_answers: [{value: "it saves a lot of time", status: "correct"}]
    feedback: "Daniel zegt *I agree that it saves a lot of time*."
  en.b1.unit04.lesson04.exercise04.order_everyone_has_different_opinion:
    instruction: "Zet de woorden in de juiste volgorde voor «iedereen heeft een andere mening»."
    accepted_answers: [{value: ["Everyone", "has", "a", "different", "opinion"], status: "correct"}]
    feedback: "de juiste volgorde is *Everyone has a different opinion*."
  en.b1.unit04.lesson04.exercise05.reply_as_leila:
    instruction: "Daniel vraagt: denk je dat thuiswerken beter is dan naar kantoor gaan? Geef Leila's antwoord: zeg dat je het er niet mee eens bent, en dat je denkt dat je belangrijke gesprekken met collega's mist."
    accepted_answers:
      - {value: "I disagree that it's better. I think you miss important conversations with coworkers.", status: "correct"}
      - {value: "I disagree that it is better. I think you miss important conversations with coworkers.", status: "correct"}
    feedback: "*it's* is de gesproken samentrekking van *it is*."
  en.b1.unit04.lesson04.exercise06.speak_debate_dialogue:
    instruction: "Daniel zegt: dat is een goed punt, maar ik ben het ermee eens dat het veel tijd bespaart. Antwoord hardop als Leila: zeg dat je het ermee eens bent dat het tijd bespaart, maar dat je nog steeds de voorkeur geeft aan kantoor."
    accepted_answers:
      - {value: "I agree that it saves time, but I still prefer the office.", status: "correct"}
    feedback: "dit antwoord geeft één punt toe zonder de algehele mening te veranderen."
