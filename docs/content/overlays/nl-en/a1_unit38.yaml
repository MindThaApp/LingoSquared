teaching:
  en.a1.unit38.lesson01.teach.chore: {title: "chore", gloss: "klusje / huishoudelijke taak", note: "*chore* betekent een klusje dat je regelmatig doet om je huis schoon en netjes te houden.", example_gloss: "De afwas doen is mijn minst favoriete klusje."}
  en.a1.unit38.lesson01.teach.dishes: {title: "dishes", gloss: "de afwas / vaat", note: "*dishes* betekent de afwas -- borden, kopjes en bestek die je afwast.", example_gloss: "Ik doe de afwas na het avondeten."}
  en.a1.unit38.lesson01.teach.laundry: {title: "laundry", gloss: "de was", note: "*laundry* betekent de was -- kleren die je wast, droogt en opvouwt.", example_gloss: "Zij doet de was op zondag."}
  en.a1.unit38.lesson01.teach.vacuum: {title: "vacuum", gloss: "stofzuigen", note: "*vacuum* betekent stofzuigen.", example_gloss: "Hij stofzuigt elke zaterdag de woonkamer."}
  en.a1.unit38.lesson01.teach.trash: {title: "trash", gloss: "vuilnis / afval", note: "*trash* betekent vuilnis.", example_gloss: "Kun je het vuilnis buiten zetten?"}
  en.a1.unit38.lesson01.teach.clean: {title: "clean", gloss: "schoonmaken", note: "*clean* betekent schoonmaken.", example_gloss: "We maken samen het appartement schoon."}

  en.a1.unit38.lesson02.teach.wash_the_dishes: {title: "wash the dishes", gloss: "de afwas doen", note: "*wash the dishes* gebruikt het werkwoord wash -- niet do, ook al gebruikt het Nederlands hier vaak 'doen' (de afwas doen).", example_gloss: "Ik doe elke avond de afwas."}
  en.a1.unit38.lesson02.teach.do_the_laundry: {title: "do the laundry", gloss: "de was doen", note: "*do the laundry* betekent de was doen.", example_gloss: "Zij doet op zondag de was."}
  en.a1.unit38.lesson02.teach.take_out_the_trash: {title: "take out the trash", gloss: "het vuilnis buiten zetten", note: "*take out the trash* gebruikt take out -- niet do, ook al zou je in het Nederlands misschien 'het vuilnis doen' verwachten.", example_gloss: "Kun je het vuilnis buiten zetten?"}
  en.a1.unit38.lesson02.teach.clean_the_bathroom: {title: "clean the bathroom", gloss: "de badkamer schoonmaken", note: "*clean the bathroom* betekent de badkamer schoonmaken.", example_gloss: "Hij maakt in het weekend de badkamer schoon."}
  en.a1.unit38.lesson02.teach.need_to: {title: "need to", gloss: "moeten / nodig hebben om", note: "*need to* betekent iets moeten doen.", example_gloss: "Ik moet dit weekend de woonkamer stofzuigen."}
  en.a1.unit38.lesson02.teach.can_you_help_me_with_question: {title: "Can you help me with the dishes?", gloss: "Kun je me helpen met de afwas?", note: "Een beleefde manier om om hulp te vragen bij een klusje."}

  en.a1.unit38.lesson03.teach.dialogue_line1: {title: "Mia's probleem", gloss: "Mia zegt: Mijn appartement is een puinhoop. Dit weekend krijg ik mensen op bezoek.", note: "a mess betekent een puinhoop of rommel."}
  en.a1.unit38.lesson03.teach.dialogue_line2: {title: "Daniels aanbod", gloss: "Daniel vraagt: Wil je hulp bij het schoonmaken?", note: "Do you want some help ...ing? is een natuurlijke manier om hulp aan te bieden."}
  en.a1.unit38.lesson03.teach.dialogue_line3: {title: "Mia's antwoord", gloss: "Mia zegt: Ja, graag! Ik moet de woonkamer stofzuigen en de afwas doen.", note: "I need to + werkwoord betekent ik moet + werkwoord."}
  en.a1.unit38.lesson03.teach.dialogue_line4: {title: "Daniels aanbod", gloss: "Daniel zegt: Ik kan voor jou stofzuigen. Jij kunt de afwas doen.", note: "for you betekent hier voor jou, in de zin van 'in jouw plaats'."}
  en.a1.unit38.lesson03.teach.dialogue_line5: {title: "Mia's toevoeging", gloss: "Mia zegt: Bedankt! Ik moet ook nog de was doen.", note: "still needs to betekent moet nog steeds."}
  en.a1.unit38.lesson03.teach.dialogue_line6: {title: "Daniels aanbod", gloss: "Daniel zegt: Daar heb ik vandaag geen tijd voor, maar ik kan wel het vuilnis buiten zetten voordat ik vertrek.", note: "before I leave betekent voordat ik vertrek."}
  en.a1.unit38.lesson03.teach.dialogue_line7: {title: "Mia's dank", gloss: "Mia zegt: Dat zou enorm helpen. Heel erg bedankt!", note: "That would help a lot betekent dat zou enorm helpen -- would drukt hier een hoffelijke, hypothetische toon uit."}

  en.a1.unit38.lesson04.teach.reading_passage: {title: "Tekst over klusjes thuis", gloss: "Daniel, Leila en Mia hebben allemaal hun eigen gewoontes rond klusjes. Daniel doet elke avond na het eten de afwas en stofzuigt zijn appartement op zaterdag. Leila vindt de was doen niet erg, maar ze haat het om de badkamer schoon te maken. Het haar van Mia's kat Luna ligt overal, dus Mia stofzuigt haar appartement bijna elke dag. Afgelopen weekend kreeg Mia bezoek, dus vroeg ze Daniel om hulp. Hij stofzuigde de woonkamer en zette voor haar het vuilnis buiten. Mia was hem heel dankbaar voor zijn hulp.", note: "doesn't mind betekent vindt het niet erg."}

exercises:
  en.a1.unit38.lesson01.exercise01.listen_word:
    instruction: "Luister en kies het genoemde woord."
    correct_option: "vacuum"
    distractors: ["dishes", "laundry", "trash"]
    accepted_answers: [{value: "vacuum", status: correct}]
    feedback: "*vacuum* betekent stofzuigen."
  en.a1.unit38.lesson01.exercise02.choose_chore_meaning:
    instruction: "Welk woord betekent een klusje dat je regelmatig doet om je huis schoon en netjes te houden?"
    correct_option: "chore"
    distractors: ["dishes", "laundry", "clean"]
    accepted_answers: [{value: "chore", status: correct}]
    feedback: "*chore* betekent klusje."
  en.a1.unit38.lesson01.exercise03.match_household_words:
    instruction: "Verbind elk woord met de juiste betekenis."
    accepted_answers: [{value: [{left: "a job you do regularly to keep your home clean and tidy", right: "chore"}, {left: "plates, cups, and utensils you wash after eating", right: "dishes"}, {left: "clothes you wash, dry, and fold", right: "laundry"}, {left: "to clean a floor or carpet using a machine that sucks up dirt", right: "vacuum"}, {left: "garbage that you throw away", right: "trash"}, {left: "to make something free of dirt", right: "clean"}], status: correct}]
    feedback: "chore=klusje, dishes=afwas, laundry=was, vacuum=stofzuigen, trash=vuilnis, clean=schoonmaken."
  en.a1.unit38.lesson01.exercise04.order_vacuum_sentence:
    instruction: "Zet de woorden in de juiste volgorde voor 'Hij stofzuigt elke zaterdag de woonkamer.'"
    accepted_answers: [{value: ["He", "vacuums", "the", "living", "room", "every", "Saturday."], status: correct}]
    feedback: "De juiste volgorde is He vacuums the living room every Saturday."
