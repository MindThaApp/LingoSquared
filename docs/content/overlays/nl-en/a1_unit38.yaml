    distractors: ["washed the dishes", "did the laundry"]
    accepted_answers: [{value: "vacuumed the living room", status: correct}]
    feedback: "De tekst zegt: he vacuumed the living room and took out the trash."
  en.a1.unit38.lesson04.exercise04.write_own_chore_sentence:
    instruction: "Schrijf één zin over een klusje dat je doet of moet doen, met 'I need to', 'I have to' of 'Can you help me with'."
