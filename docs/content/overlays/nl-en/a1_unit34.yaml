teaching:
  en.a1.unit34.lesson01.teach.soccer: {title: "soccer", gloss: "voetbal", note: "*soccer* betekent voetbal. Het werkwoord erbij is *play*: *play soccer*. In het Nederlands kun je van voetbal ook rechtstreeks een werkwoord maken (voetballen), maar in het Engels bestaat dat niet. Daarom moet je bij de sportnaam altijd het aparte werkwoord *play*, *go* of *do* onthouden.", example_gloss: "We voetballen op zaterdag."}
  en.a1.unit34.lesson01.teach.tennis: {title: "tennis", gloss: "tennis", note: "*tennis* betekent tennis. Net als bij *soccer* gebruik je hier *play*: *play tennis*. Het Nederlands heeft ook een eigen werkwoord (tennissen), maar in het Engels zeg je altijd *play tennis*.", example_gloss: "Zij tennist elk weekend."}
  en.a1.unit34.lesson01.teach.basketball: {title: "basketball", gloss: "basketbal", note: "*basketball* betekent basketbal. Ook hier gebruik je *play*: *play basketball*, net als bij *soccer* en *tennis*. Het Engels gebruikt bij balsporten altijd *play* + de sportnaam.", example_gloss: "Ze spelen basketbal in het park."}
  en.a1.unit34.lesson01.teach.swimming: {title: "swimming", gloss: "zwemmen", note: "*swimming* betekent zwemmen. Hier verandert het werkwoord: *go swimming* (niet *play swimming*). Het Engels gebruikt *go* + de *-ing*-vorm voor activiteiten als zwemmen en hardlopen. In het Nederlands heb je daar geen los werkwoord bij nodig: je zegt gewoon 'zwemmen'.", example_gloss: "Ik ga twee keer per week zwemmen."}
  en.a1.unit34.lesson01.teach.yoga: {title: "yoga", gloss: "yoga", note: "*yoga* betekent yoga. Het werkwoord is *do*: *do yoga*. Het Engels gebruikt *do* voor individuele activiteiten zoals yoga, niet *play* en niet *go*. In het Nederlands zeg je ook 'yoga doen', dus dit werkwoord komt overeen. Let wel op dat het Engels drie werkwoorden heeft (*play*, *go*, *do*) die je per soort sport moet onthouden.", example_gloss: "Hij doet 's ochtends yoga."}
  en.a1.unit34.lesson01.teach.exercise: {title: "exercise", gloss: "sporten / bewegen", note: "*exercise* betekent sporten of bewegen: een algemeen woord voor lichamelijke activiteit. Anders dan *soccer*, *swimming* en *yoga* kun je *exercise* ook zelf als werkwoord gebruiken, zonder *play*, *go* of *do*: *Do you exercise every day?*", example_gloss: "Sport je elke dag?"}

  en.a1.unit34.lesson02.teach.twice_a_week: {title: "twice a week", gloss: "twee keer per week", note: "*twice a week* betekent twee keer per week. Het woord *a* betekent hier niet 'een' maar 'per': getal + *a* + tijdseenheid geeft aan hoe vaak iets in die periode gebeurt. In het Nederlands gebruik je daarvoor 'per' (twee keer per week).", example_gloss: "Hij tennist twee keer per week."}
  en.a1.unit34.lesson02.teach.three_times_a_week: {title: "three times a week", gloss: "drie keer per week", note: "*three times a week* betekent drie keer per week. Net als bij *twice a week* betekent *a* hier 'per', niet 'een': *times* (keer) plus *a week* (per week) geeft aan hoe vaak per week.", example_gloss: "Zij zwemt drie keer per week."}
  en.a1.unit34.lesson02.teach.on_weekends: {title: "on weekends", gloss: "in het weekend", note: "*on weekends* betekent in het weekend. Het Engels gebruikt *on* bij dagen en weekenden, waar het Nederlands 'in' gebruikt (in het weekend).", example_gloss: "We spelen basketbal in het weekend."}
  en.a1.unit34.lesson02.teach.gym: {title: "gym", gloss: "sportschool", note: "gym betekent sportschool, een plek met apparaten en lessen om te sporten.", example_gloss: "Hij doet yoga in de sportschool."}
  en.a1.unit34.lesson02.teach.pool: {title: "pool", gloss: "zwembad", note: "pool betekent zwembad, een plek vol water om te zwemmen.", example_gloss: "Ik zwem in het zwembad."}
  en.a1.unit34.lesson02.teach.how_often_question: {title: "How often do you exercise?", gloss: "Hoe vaak sport je?", note: "Deze vraag begint met *how often* (hoe vaak). Daarna komt het hulpwerkwoord *do*, omdat het hoofdwerkwoord *exercise* is: dezelfde do-support als bij andere Engelse vragen."}

  en.a1.unit34.lesson03.teach.dialogue_line1: {title: "Daniels vraag", gloss: "Daniel vraagt: Wil je zaterdag met ons voetballen?", note: "Begin van het gesprek met een uitnodiging om te voetballen. Bij *soccer* gebruik je *play*."}
  en.a1.unit34.lesson03.teach.dialogue_line2: {title: "Leila's antwoord", gloss: "Leila zegt: Ik hou niet zo van voetbal. Ik zwem liever.", note: "*don't really like* betekent 'niet zo van ... houden': een zachtere manier om nee te zeggen."}
  en.a1.unit34.lesson03.teach.dialogue_line3: {title: "Daniels antwoord", gloss: "Daniel zegt: Dat is prima! Hoe vaak ga je zwemmen?", note: "*go swimming*: bij zwemmen gebruik je *go*, niet *play* of *do*."}
  en.a1.unit34.lesson03.teach.dialogue_line4: {title: "Leila's antwoord", gloss: "Leila zegt: Twee keer per week, meestal in het zwembad vlak bij mijn huis.", note: "*Twice a week*: ook hier betekent *a* 'per'."}
  en.a1.unit34.lesson03.teach.dialogue_line5: {title: "Daniels antwoord", gloss: "Daniel zegt: Leuk! Ik doe soms ook yoga, maar hardlopen blijft mijn favoriet.", note: "*do yoga*: bij yoga gebruik je *do*, apart van *play* en *go*."}

  en.a1.unit34.lesson04.teach.reading_passage: {title: "Tekst over Daniel, Leila en Mia", gloss: "Daniel, Leila en Mia blijven elk op hun eigen manier actief. Daniel gaat elke ochtend voor het werk hardlopen. Leila zwemt liever; ze gaat twee keer per week naar het zwembad. Mia is nieuw bij het team, maar ze tennist al elke zondag met haar buurvrouw. Op zaterdag voetballen ze soms samen in het park, maar voetbal is niemands favoriete sport.", note: "Deze tekst gebruikt alle drie de werkwoorden: *goes running* (*go*), *plays tennis* en *play soccer* (*play*). Elke sport heeft zijn eigen werkwoord."}

