teaching:
  en.a1.unit34.lesson01.teach.soccer: {title: "soccer", gloss: "voetbal", note: "soccer betekent voetbal. Het werkwoord erbij is play: play soccer. In het Nederlands kun je van voetbal ook rechtstreeks een werkwoord maken: voetballen (één woord, geen los werkwoord nodig) -- Engels doet dit nooit, dus moet je altijd het aparte werkwoord play/go/do bij de sportnaam onthouden.", example_gloss: "We voetballen op zaterdag."}
  en.a1.unit34.lesson01.teach.tennis: {title: "tennis", gloss: "tennis", note: "tennis betekent tennis. Net als bij soccer komt hier play bij: play tennis -- dezelfde categorie balsporten. Het Nederlands heeft ook hier zijn eigen werkwoord, tennissen, maar in het Engels zeg je altijd play + tennis.", example_gloss: "Zij tennist elk weekend."}
  en.a1.unit34.lesson01.teach.basketball: {title: "basketball", gloss: "basketbal", note: "basketball betekent basketbal. Ook hier weer play: play basketball -- dezelfde balsportcategorie als soccer en tennis. Het Nederlands heeft ook basketballen als eigen werkwoord, maar het Engels gebruikt altijd play + de sportnaam.", example_gloss: "Zij basketballen in het park."}
  en.a1.unit34.lesson01.teach.swimming: {title: "swimming", gloss: "zwemmen", note: "swimming betekent zwemmen. Hier verandert het werkwoord: go swimming (niet play swimming) -- Engels gebruikt go plus de -ing-vorm voor activiteiten als zwemmen en hardlopen. Het Nederlands heeft hiervoor gewoon het ene werkwoord zwemmen, zonder dat er een los werkwoord zoals go bij hoeft.", example_gloss: "Ik ga twee keer per week zwemmen."}
  en.a1.unit34.lesson01.teach.yoga: {title: "yoga", gloss: "yoga", note: "yoga betekent yoga. Het werkwoord is do: do yoga -- Engels gebruikt do voor individuele activiteiten zoals yoga, niet play en niet go. In het Nederlands zeg je ook yoga doen, dus dit werkwoord komt toevallig overeen -- maar let op dat Engels drie aparte werkwoorden (play/go/do) heeft die je per sportcategorie moet koppelen, terwijl het Nederlands vaker een eigen werkwoord per sport heeft (voetballen, tennissen, zwemmen).", example_gloss: "Hij doet 's ochtends yoga."}
  en.a1.unit34.lesson01.teach.exercise: {title: "exercise", gloss: "sporten / bewegen", note: "exercise betekent sporten of bewegen -- een algemeen woord voor lichamelijke activiteit. Anders dan soccer/swimming/yoga kan exercise ook direct als werkwoord gebruikt worden, zonder dat er een play/go/do voor hoeft: Do you exercise every day?", example_gloss: "Sport je elke dag?"}

  en.a1.unit34.lesson02.teach.twice_a_week: {title: "twice a week", gloss: "twee keer per week", note: "twice a week betekent twee keer per week. Het lidwoord a heeft hier niet de gewone betekenis 'één' -- het betekent hier 'per' of 'elke': getal + a + tijdseenheid geeft aan hoe vaak in die periode. Het Nederlands gebruikt hiervoor het eigen voorzetsel per (twee keer per week), geen lidwoord zoals het Engels.", example_gloss: "Hij tennist twee keer per week."}
  en.a1.unit34.lesson02.teach.three_times_a_week: {title: "three times a week", gloss: "drie keer per week", note: "three times a week betekent drie keer per week. Net als bij twice a week betekent a hier 'per', niet 'één' -- times (keer) plus a week (per week) samen betekenen 'hoe vaak per week'.", example_gloss: "Zij zwemt drie keer per week."}
  en.a1.unit34.lesson02.teach.on_weekends: {title: "on weekends", gloss: "in het weekend", note: "on weekends betekent in het weekend. Het voorzetsel on komt voor weekends omdat Engels on gebruikt voor dagen en specifieke tijdsperiodes; het Nederlands gebruikt hier in (in het weekend), geen woord dat op on lijkt.", example_gloss: "We basketballen in het weekend."}
  en.a1.unit34.lesson02.teach.gym: {title: "gym", gloss: "sportschool", note: "gym betekent sportschool, een plek met apparaten en lessen om te sporten.", example_gloss: "Hij doet yoga in de sportschool."}
  en.a1.unit34.lesson02.teach.pool: {title: "pool", gloss: "zwembad", note: "pool betekent zwembad, een plek vol water om te zwemmen.", example_gloss: "Ik zwem in het zwembad."}
  en.a1.unit34.lesson02.teach.how_often_question: {title: "How often do you exercise?", gloss: "Hoe vaak sport je?", note: "Deze vraag begint met how often (hoe vaak), en daarna komt het hulpwerkwoord do, omdat het hoofdwerkwoord exercise is -- dezelfde do-support-structuur als bij andere Engelse vragen."}

  en.a1.unit34.lesson03.teach.dialogue_line1: {title: "Daniels vraag", gloss: "Daniel vraagt of Leila zaterdag met de anderen wil voetballen.", note: "Begin van het gesprek met een uitnodiging om te voetballen -- werkwoord play voor soccer."}
  en.a1.unit34.lesson03.teach.dialogue_line2: {title: "Leila's antwoord", gloss: "Leila zegt dat ze niet echt van voetbal houdt en liever zwemt.", note: "don't really like betekent 'houd niet echt van' -- een zachtere manier om iets af te wijzen."}
  en.a1.unit34.lesson03.teach.dialogue_line3: {title: "Daniels antwoord", gloss: "Daniel zegt dat het prima is en vraagt hoe vaak Leila gaat zwemmen.", note: "go swimming -- werkwoord go voor zwemmen, niet play of do."}
  en.a1.unit34.lesson03.teach.dialogue_line4: {title: "Leila's antwoord", gloss: "Leila zegt twee keer per week, meestal in het zwembad bij haar huis.", note: "Twice a week -- opnieuw dezelfde betekenis van a als 'per'."}
  en.a1.unit34.lesson03.teach.dialogue_line5: {title: "Daniels antwoord", gloss: "Daniel zegt dat hij soms ook yoga doet, maar dat hardlopen nog steeds zijn favoriet is.", note: "do yoga -- werkwoord do voor yoga, apart van play en go."}

  en.a1.unit34.lesson04.teach.reading_passage: {title: "Tekst over Daniel, Leila en Mia", gloss: "Daniel, Leila en Mia blijven elk op hun eigen manier actief. Daniel gaat elke ochtend voor het werk hardlopen. Leila geeft de voorkeur aan zwemmen; ze gaat twee keer per week naar het zwembad. Mia is nieuw bij het team, maar ze tennist al elke zondag met haar buurvrouw. Op zaterdag voetballen ze soms samen in het park, ook al is voetbal niemands favoriete sport.", note: "Deze tekst gebruikt alle drie de werkwoorden samen: goes running (go), plays tennis (play), play soccer (play) -- let op dat elke sport zijn eigen werkwoord heeft, geen gedeeld werkwoord."}

