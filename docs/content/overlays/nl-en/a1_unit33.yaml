teaching:
  en.a1.unit33.lesson01.teach.bus: {title: "bus", gloss: "bus", note: "bus betekent bus. Het werkwoord erbij is take: take the bus. Let op: in het Nederlands gebruik je voor elk vervoermiddel dezelfde constructie (met de bus gaan), maar in het Engels heeft elk vervoermiddel zijn eigen werkwoord (take, drive, ride) -- die moet je apart leren.", example_gloss: "Ik neem de bus."}
  en.a1.unit33.lesson01.teach.train: {title: "train", gloss: "trein", note: "train betekent trein. Net als bus komt hier het werkwoord take bij: take the train.", example_gloss: "Zij neemt de trein."}
  en.a1.unit33.lesson01.teach.car: {title: "car", gloss: "auto", note: "car betekent auto. Bij auto gebruik je take niet, maar drive: drive my car -- een heel ander werkwoord dan bij bus of trein.", example_gloss: "Ik rijd met mijn auto naar mijn werk."}
  en.a1.unit33.lesson01.teach.bike: {title: "bike", gloss: "fiets", note: "bike betekent fiets. Ook hier weer een ander werkwoord: ride a bike (niet take en niet drive).", example_gloss: "Hij fietst elke dag naar zijn werk."}
  en.a1.unit33.lesson01.teach.walk: {title: "walk", gloss: "lopen", note: "walk betekent lopen. Hier is geen extra werkwoord zoals take/drive/ride nodig, want walk is zelf het werkwoord: walk to work, niet take a walk to work.", example_gloss: "Ik loop naar mijn werk."}

  en.a1.unit33.lesson02.teach.how_get_to: {title: "How do you get to work?", gloss: "Hoe kom je op je werk?", note: "Deze vraag begint met het hulpwerkwoord do omdat het echte werkwoord get is. In het Nederlands heb je hiervoor geen hulpwerkwoord nodig."}
  en.a1.unit33.lesson02.teach.usually: {title: "usually", gloss: "meestal", note: "usually betekent meestal. In het Engels komt dit bijwoord meestal tussen het onderwerp en het hoofdwerkwoord: I usually take the bus.", example_gloss: "Ik neem meestal de bus."}
  en.a1.unit33.lesson02.teach.minutes: {title: "minutes", gloss: "minuten", note: "minutes betekent minuten. De zin It takes twenty minutes heeft een bijzondere structuur: it is hier een schijnsubject zonder eigen betekenis, gewoon om de subjectplek te vullen. Het Nederlandse Het duurt twintig minuten gebruikt toevallig ook zo'n schijnsubject (het), dus deze specifieke zin voelt vertrouwd -- maar let op dat het niet in élke Engelse zin met een tijdsduur zo werkt.", example_gloss: "Het duurt twintig minuten."}
  en.a1.unit33.lesson02.teach.late: {title: "late", gloss: "laat", note: "late betekent laat (later aankomen dan verwacht). The bus is often late.", example_gloss: "De bus is vaak laat."}
  en.a1.unit33.lesson02.teach.faster: {title: "faster", gloss: "sneller", note: "faster betekent sneller, de vergrotende trap van fast met -er. Met than voor een vergelijking: faster than the bus.", example_gloss: "De trein is sneller dan de bus."}

  en.a1.unit33.lesson03.teach.dialogue_line1: {title: "Leila's vraag", gloss: "Leila vraagt hoe Daniel op zijn werk komt.", note: "Begin van het gesprek met How do you get to work?"}
  en.a1.unit33.lesson03.teach.dialogue_line2: {title: "Daniels antwoord", gloss: "Daniel zegt dat hij meestal de bus neemt. Het duurt ongeveer twintig minuten.", note: "Twee dingen tegelijk: het werkwoord take voor de bus, en het schijnsubject it in It takes about twenty minutes."}
  en.a1.unit33.lesson03.teach.dialogue_line3: {title: "Leila's vraag", gloss: "Leila vraagt of hij het fijn vindt.", note: "Ja/nee-vraag met Do."}
  en.a1.unit33.lesson03.teach.dialogue_line4: {title: "Daniels antwoord", gloss: "Daniel zegt dat het wel oké is, maar dat de bus vaak laat is. Hij vraagt het ook aan Leila.", note: "How about you? betekent En jij? -- een korte manier om de vraag terug te stellen."}
  en.a1.unit33.lesson03.teach.dialogue_line5: {title: "Leila's antwoord", gloss: "Leila zegt dat ze met de auto gaat. Het is sneller, maar parkeren is lastig.", note: "Hier wordt het werkwoord drive gebruikt voor de auto, niet take."}

  en.a1.unit33.lesson04.teach.reading_passage: {title: "Tekst over Leila en Daniel", gloss: "Leila rijdt elke dag met de auto naar haar werk. De rit duurt ongeveer vijftien minuten, maar parkeren bij haar kantoor is lastig. Daniel heeft geen auto, dus hij neemt de bus. Zijn busrit duurt twintig minuten en is soms laat, maar hij hoeft zich geen zorgen te maken over parkeren.", note: "Deze tekst gebruikt alle woorden van deze les in echte zinnen -- let op dat take alleen voor bus en trein wordt gebruikt, en drive alleen voor de auto."}

exercises:
  en.a1.unit33.lesson01.exercise01.listen_mode:
    instruction: "Luister en kies het genoemde vervoermiddel."
    correct_option: "train"
    distractors: ["bus", "car", "bike"]
    accepted_answers: [{value: "train", status: correct}]
    feedback: "train betekent trein."
  en.a1.unit33.lesson01.exercise02.choose_fastest:
    instruction: "Welk vervoermiddel is meestal het snelst voor een lange afstand in een stad?"
    correct_option: "car"
    distractors: ["bike", "walk", "bus"]
    accepted_answers: [{value: "car", status: correct}]
    feedback: "car (auto) is meestal het snelst voor een lange afstand in een stad."
  en.a1.unit33.lesson01.exercise03.match_modes:
    instruction: "Verbind elk woord met zijn betekenis."
    accepted_answers: [{value: [{left: "een groot voertuig met veel stoelen voor het openbaar vervoer", right: "bus"}, {left: "rijdt op rails", right: "train"}, {left: "je bestuurt het zelf", right: "car"}, {left: "je trapt erop", right: "bike"}, {left: "gewoon met je eigen benen, geen voertuig", right: "walk"}], status: correct}]
    feedback: "bus=bus, train=trein, car=auto, bike=fiets, walk=lopen."
  en.a1.unit33.lesson01.exercise04.order_car_sentence:
    instruction: "Zet de woorden in de juiste volgorde."
    accepted_answers: [{value: ["I", "drive", "my", "car", "to", "work."], status: correct}]
    feedback: "De juiste volgorde is I drive my car to work. Voor de auto gebruik je drive, niet take."
