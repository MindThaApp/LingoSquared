  required_next_reviewer: codex_fresh_context
  notes: >-
    Draft only. Overlay against the shared en/a1_unit33_transportation.yaml
    realization (itself still unreviewed). New contrastive-grammar point,
    deliberately different from the ones already used in this direction
    (unit16's frequency-adverb placement, unit25/unit30's V2 inversion
    after a fronted adverb, unit31's subject-verb inversion/do-support in
    questions): English lexicalizes a distinct verb per transport mode
    (take the bus/train, drive a car, ride a bike, walk with no object),
    while Dutch generalizes with met de/het + noun + gaan (go by/with the
    X) for any vehicle, plus the separate verb lopen for walking with no
    "met" at all -- so a Dutch speaker must memorize which English verb
    pairs with which mode instead of reusing one preposition-based
    pattern. This directly reinforces the lesson01 vocabulary set (bus,
    train, car, bike, walk), each paired with its own required English
    verb. Strong sibling-isolation rule applied -- fa-en/prs-en overlays
    for this same unit were not opened while authoring this file. Needs
    the mandatory fresh-context review before shipping.

course:
  title: Engels A1
  description: >-
    Engels voor beginners, met heldere uitleg in het Nederlands en aandacht
    voor alledaagse gesprekken.

units:
