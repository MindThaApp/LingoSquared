    Draft only. Overlay against the shared en/a1_unit48_library.yaml
    realization (itself still unreviewed). This unit had NO overlay in any
    direction (nl-en/fa-en/prs-en) before this file -- it was an orphaned
    realization, authored but unreachable by any learner. Authored entirely
    independently from the target realization and universal spine; no
    sibling-direction overlay was opened or consulted (none existed for
    this unit at authoring time in any direction, confirmed via a fresh ls
    of docs/content/overlays/{nl-en,fa-en,prs-en}/ before starting). One
    main contrastive point, deliberately different from every point already
    used in this direction (see unit45/46/47's overlay notes for the
    running list): English "due" (as in "this book is due Friday") has no
    single-word Dutch equivalent -- Dutch normally has to paraphrase it as
    a full clause like "moet terug zijn op" (must be back on) or "de
    inleverdatum is" (the return date is), never a one-word adjective the
    way English due works. Flagged explicitly on the due teaching card,
    since a Dutch speaker has no direct word to reach for and may be
    tempted to over-translate with a longer phrase where English needs
    only due.

