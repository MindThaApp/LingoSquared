  en.a1.unit48.lesson03.teach.dialogue_line1: {title: "Leila's voorstel", gloss: "Leila zegt: Ik moet dit boek terugbrengen naar de bibliotheek. Wil je meekomen?", note: "*Do you want to come with me?* betekent wil je meekomen?"}
  en.a1.unit48.lesson03.teach.dialogue_line2: {title: "Daniels reactie", gloss: "Daniel zegt: Tuurlijk! Ik denk niet dat ik ooit eerder een boek uit een bibliotheek heb geleend.", note: "*I don't think I've ever ...* betekent ik denk niet dat ik ooit ... heb, met de tegenwoordig-voltooide tijd have ever."}
  en.a1.unit48.lesson03.teach.dialogue_line3: {title: "Leila bij de balie", gloss: "Leila zegt: Hoi, ik wil dit boek graag terugbrengen, en ik wil ook graag een nieuw boek lenen.", note: "*and I'd like to ... too* betekent en ik wil ook graag ..."}
  en.a1.unit48.lesson03.teach.dialogue_line4: {title: "De bibliothecaris vraagt", gloss: "De bibliothecaris zegt: Geweldig, dank je. Heb je je bibliotheekpas bij je?", note: "*Do you have your library card?* betekent heb je je bibliotheekpas bij je?"}
  en.a1.unit48.lesson03.teach.dialogue_line5: {title: "Leila's antwoord", gloss: "Leila zegt: Ja, hier is hij.", note: "*here it is* betekent hier is hij/het."}
  en.a1.unit48.lesson03.teach.dialogue_line6: {title: "De bibliothecaris legt uit", gloss: "De bibliothecaris zegt: Perfect. Dit nieuwe boek moet over drie weken terug zijn.", note: "*due back in three weeks* betekent moet over drie weken terug zijn."}
  en.a1.unit48.lesson03.teach.dialogue_line7: {title: "Daniel wil ook lenen", gloss: "Daniel zegt: Kan ik ook een bibliotheekpas krijgen? Ik wil graag een kookboek lenen.", note: "*Can I get ... too?* betekent kan ik ook ... krijgen?"}
  en.a1.unit48.lesson03.teach.dialogue_line8: {title: "De bibliothecaris helpt Daniel", gloss: "De bibliothecaris zegt: Natuurlijk! Vul gewoon dit formulier in.", note: "*fill out this form* betekent dit formulier invullen, een scheidbaar werkwoord net als het Nederlandse invullen."}

  en.a1.unit48.lesson04.teach.reading_passage: {title: "Tekst over hoe een bibliotheek werkt", gloss: "Een bezoek aan de bibliotheek: De meeste bibliotheken laten je boeken lenen, en soms ook andere spullen, voor een paar weken tegelijk. Om iets te lenen heb je meestal een bibliotheekpas nodig. Als je een boek leent, vertelt de bibliothecaris je de inleverdatum -- de dag waarop je het moet terugbrengen. Als je nog niet klaar bent tegen die tijd, kun je vaak de bibliothecaris om meer tijd vragen. Sinds Leila naar haar nieuwe appartement verhuisde, heeft ze minder boeken dan vroeger, dus is ze boeken gaan lenen bij de bibliotheek in plaats van ze te kopen. Vorige week bracht ze een boek terug en haalde ze een nieuw boek op, en haar vriend Daniel ging mee. Hij had nog nooit eerder een bibliotheekboek geleend, dus kreeg hij zijn eigen bibliotheekpas en leende hij een kookboek om te oefenen met de recepten die Mia hem leert. De bibliothecaris herinnerde hen er beiden aan om hun boeken op tijd terug te brengen. Mia komt niet vaak in de bibliotheek, maar ze leende ooit een fotografieboek voor haar cursus.", note: "*checked out a cookbook* betekent een kookboek leende (checked out is de vaste Engelse uitdrukking voor lenen bij een bibliotheek)."}

