course:
  title: "Engels B1"
  description: >-
    Engels leren op B1-niveau voor alledaagse gesprekken over verplichtingen,
    mogelijkheden, hypothetische situaties, tegenstellingen, verhalen,
    beschrijvingen met bijzinnen en professionele communicatie, met
    gedetailleerde uitleg in het Nederlands.

units:
  en.b1.unit14.professional_communication: {title: "Would it be possible to..."}

lessons:
  en.b1.unit14.lesson01.professional_communication_vocabulary: {title: "Beleefde verzoeken op het werk"}
  en.b1.unit14.lesson02.softened_requests: {title: "Would it be possible to move the meeting?"}
  en.b1.unit14.lesson03.reading_a_message_before_the_meeting: {title: "Lezen: een bericht voor de vergadering"}
  en.b1.unit14.lesson04.the_meeting_dialogue: {title: "Could we possibly keep this short?"}

teaching:
  en.b1.unit14.lesson01.teach.would_it_be_possible_to: {title: "would it be possible to", gloss: "zou het mogelijk zijn om", note: "*would it be possible to* vraagt beleefd of iets in het algemeen mogelijk is.", example_gloss: "Zou het mogelijk zijn om de vergadering naar donderdag te verplaatsen?"}
  en.b1.unit14.lesson01.teach.i_was_wondering_if: {title: "I was wondering if", gloss: "ik vroeg me af of", note: "*I was wondering if* introduceert een verzoek indirect, alsof je erover hebt nagedacht.", example_gloss: "Ik vroeg me af of je mijn rapport vandaag kunt nakijken."}
  en.b1.unit14.lesson01.teach.could_we_possibly: {title: "could we possibly", gloss: "zouden we misschien kunnen", note: "*could we possibly* vraagt beleefd om iets dat jij en de ander samen zouden doen.", example_gloss: "Zouden we de vergadering misschien vijf minuten later kunnen beginnen?"}
  en.b1.unit14.lesson01.teach.i_would_appreciate_it_if: {title: "I would appreciate it if", gloss: "ik zou het waarderen als", note: "*I would appreciate it if* zegt dat je dankbaar zou zijn als iemand iets doet.", example_gloss: "Ik zou het waarderen als je de notulen snel zou sturen."}
  en.b1.unit14.lesson01.teach.agenda: {title: "agenda", gloss: "agenda", note: "*agenda* betekent een lijst met onderwerpen om te bespreken in een vergadering.", example_gloss: "Daniel voegde nog een punt toe aan de agenda."}
  en.b1.unit14.lesson01.teach.follow_up: {title: "follow up", gloss: "opvolgen, terugkomen op", note: "*follow up* betekent iemand opnieuw contacteren na een vergadering of taak.", example_gloss: "Mia volgt het op via e-mail na de vergadering."}

  en.b1.unit14.lesson02.teach.move_meeting_thursday: {title: "would it be possible to + werkwoord", gloss: "Zou het mogelijk zijn om de vergadering naar donderdag te verplaatsen?", note: "*would it be possible to* + basisvorm vraagt beleefd naar een verandering."}
  en.b1.unit14.lesson02.teach.review_report_today: {title: "I was wondering if + could", gloss: "Ik vroeg me af of je mijn rapport vandaag kunt nakijken.", note: "*I was wondering if you could* is een indirecte, beleefde manier om iets te vragen."}
  en.b1.unit14.lesson02.teach.grammar_softened_requests: {title: "verzachte verzoeken op het werk", gloss: "Gebruik in formele werkverzoeken een verzachte voorwaardelijke vorm zoals Would it be possible to... of I was wondering if... in plaats van een direct bevel. Deze vormen klinken beleefder dan Move the meeting of Review my report.", note: "vorm: gebruik een verzachte voorwaardelijke vorm in plaats van een direct bevel."}

  en.b1.unit14.lesson03.teach.budget_update: {title: "budget update", gloss: "budgetupdate", note: "*budget update* betekent een verslag over hoe geld wordt uitgegeven.", example_gloss: "Daniel bereidde de budgetupdate voor de vergadering voor."}
  en.b1.unit14.lesson03.teach.afterward: {title: "afterward", gloss: "daarna, achteraf", note: "*afterward* betekent na iets anders in de tijd.", example_gloss: "We kunnen de notulen daarna doornemen."}
  en.b1.unit14.lesson03.teach.reading_passage: {title: "leestekst: een bericht voor de vergadering", gloss: "Hoi Daniel, ik hoop dat het goed met je gaat. Zou het mogelijk zijn om de budgetupdate toe te voegen aan de agenda voor de vergadering van morgen? Ik zou het waarderen als je de laatste cijfers zou meenemen. Zouden we misschien tien minuten eerder kunnen beginnen, zodat we tijd hebben voor vragen achteraf? Bedankt, Mia", note: "een kort professioneel bericht met verzachte verzoeken op B1-niveau."}

  en.b1.unit14.lesson04.teach.q_start_budget_update: {title: "Manager opent de vergadering beleefd", gloss: "Manager zegt: goedemorgen, Mia. Zou het mogelijk zijn om vandaag met de budgetupdate te beginnen?", note: "*would it be possible to* vraagt beleefd naar de volgorde van de vergadering."}
  en.b1.unit14.lesson04.teach.a_add_new_client: {title: "Mia doet een aanvullend verzoek", gloss: "Mia zegt: natuurlijk. Ik vroeg me af of we ook de nieuwe klant aan de agenda konden toevoegen.", note: "*I was wondering if we could* is een indirecte, beleefde manier om iets voor te stellen."}
  en.b1.unit14.lesson04.teach.q_keep_thirty_minutes: {title: "Manager vraagt om een korte vergadering", gloss: "Manager zegt: goed idee. Zouden we deze vergadering misschien onder de dertig minuten kunnen houden?", note: "*could we possibly* vraagt beleefd om iets dat beiden samen doen."}
  en.b1.unit14.lesson04.teach.a_questions_in_advance: {title: "Mia stelt een verwachting voor de toekomst", gloss: "Mia zegt: ik doe mijn best. Ik zou het waarderen als iedereen vragen vooraf zou sturen, de volgende keer.", note: "*I would appreciate it if* zegt dat je dankbaar zou zijn."}
  en.b1.unit14.lesson04.teach.q_fair_request_followup: {title: "Manager stemt in en belooft op te volgen", gloss: "Manager zegt: dat is een redelijk verzoek. Ik zal een herinnering sturen voor de volgende vergadering.", note: "*follow up* betekent hier: er later op terugkomen."}
  en.b1.unit14.lesson04.teach.a_send_updated_agenda: {title: "Mia sluit af met een bevestiging", gloss: "Mia zegt: bedankt. Ik stuur de bijgewerkte agenda vanmiddag.", note: "een korte, beleefde afsluiting van het gesprek."}

