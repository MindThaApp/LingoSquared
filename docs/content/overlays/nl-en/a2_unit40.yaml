review: {status: "unreviewed", required_next_reviewer: "fresh_context", notes: "Dutch overlay for the new a2_unit40_online_order_problem realization, authored 2026-07-22. Written independently of the fa-en and prs-en overlays of the same realization -- neither sibling file was opened while authoring this one (AUTHORING_GUIDE §8). Register is the informal jij-register pinned for this lane, with u inside the customer-service lines where Dutch would use it. The damaged/broken distinction is glossed explicitly (beschadigd = de doos, kapot = de lamp) because Dutch does not split those two the same way English does. Every listen_select/dialogue distractor was checked against the full audio text of its own media asset: none is spoken anywhere in that audio. PENDING a fresh-context review."}

course:
