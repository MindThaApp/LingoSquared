teaching:
  en.a2.unit40.lesson01.teach.order: {title: "order", gloss: "bestelling", note: "*order* is de bestelling zelf; als werkwoord betekent *to order* bestellen.", example_gloss: "Mijn bestelling kwam twee dagen te laat."}
  en.a2.unit40.lesson01.teach.delivery: {title: "delivery", gloss: "bezorging", note: "*delivery* is het moment waarop je bestelling bij je thuis wordt gebracht.", example_gloss: "De bezorging kwam op dinsdagochtend."}
  en.a2.unit40.lesson01.teach.parcel: {title: "parcel", gloss: "pakket", note: "*parcel* is het ingepakte pakket dat bij je deur wordt afgeleverd.", example_gloss: "Het pakket is buiten bij mijn deur achtergelaten."}
  en.a2.unit40.lesson01.teach.damaged: {title: "damaged", gloss: "beschadigd", note: "*damaged* zegt dat iets onderweg beschadigd is, maar misschien nog werkt -- meestal zeg je het over de verpakking.", example_gloss: "De doos was beschadigd toen hij aankwam."}
  en.a2.unit40.lesson01.teach.broken: {title: "broken", gloss: "kapot", note: "*broken* is sterker dan *damaged*: het ding doet het niet meer.", example_gloss: "De lamp in het pakket was kapot."}
  en.a2.unit40.lesson01.teach.replacement: {title: "replacement", gloss: "vervangend exemplaar", note: "*replacement* is een nieuw exemplaar in plaats van het kapotte; *refund* is je geld terug.", example_gloss: "Ik heb om een vervangend exemplaar gevraagd in plaats van mijn geld terug."}
  en.a2.unit40.lesson01.teach.grammar_arrived: {title: "arrived en has not arrived yet", gloss: "Mijn bestelling is gisteren aangekomen. Mijn bestelling is nog niet aangekomen.", note: "*arrived* gebruik je met een tijdstip in het verleden; *has not arrived yet* zegt dat je er nu nog steeds op wacht."}

  en.a2.unit40.lesson02.teach.report_order_problem: {title: "zeggen waarvoor je belt", gloss: "Ik wil een probleem met mijn bestelling melden.", note: "*I'd like to report a problem with...* is dezelfde beleefde meldingsvorm als bij de lekkage in unit 29."}
  en.a2.unit40.lesson02.teach.lamp_arrived_broken: {title: "zeggen wat er mis is", gloss: "De lamp kwam kapot aan.", note: "*arrived broken* betekent: hij was al kapot toen hij aankwam."}
  en.a2.unit40.lesson02.teach.ask_for_replacement: {title: "kiezen tussen vervanging en geld terug", gloss: "Kan ik een vervangend exemplaar krijgen in plaats van mijn geld terug?", note: "*instead of* zet twee mogelijkheden tegenover elkaar: je kiest de eerste, niet de tweede."}
  en.a2.unit40.lesson02.teach.my_order_number: {title: "je bestelnummer geven", gloss: "Mijn bestelnummer is 8154.", note: "je bestelnummer noem je meteen als ernaar gevraagd wordt -- daarmee vindt de medewerker je bestelling terug."}
  en.a2.unit40.lesson02.teach.grammar_instead_of: {title: "instead of om te kiezen", gloss: "Kan ik een vervangend exemplaar krijgen in plaats van mijn geld terug? Ik wil liever mijn geld terug dan een ruil.", note: "na *instead of* komt altijd een zelfstandig naamwoord: *instead of a refund*, niet *instead of get a refund*."}

  en.a2.unit40.lesson03.teach.box: {title: "box", gloss: "doos", note: "*box* is de doos waar je bestelling in zit; *parcel* is het hele pakket zoals het bezorgd wordt.", example_gloss: "Bewaar de doos tot de nieuwe lamp aankomt."}
  en.a2.unit40.lesson03.teach.return_message: {title: "het antwoord van de winkel", gloss: "Bedankt voor uw bericht. Het spijt ons dat uw lamp kapot is aangekomen. Doe de lamp terug in de doos en breng hem naar het postkantoor. Er wordt binnen drie werkdagen een nieuwe lamp verstuurd. Bestelnummer 8154.", note: "een antwoord van de klantenservice noemt altijd: het probleem, wat jij moet doen, en wat zij gaan doen."}
  en.a2.unit40.lesson03.teach.put_it_back_in_the_box: {title: "wat je met de kapotte lamp moet doen", gloss: "Doe de lamp terug in de doos en breng hem naar het postkantoor.", note: "*put ... back in ...* betekent iets terugdoen op de plek waar het vandaan kwam."}

  en.a2.unit40.lesson04.teach.q_report_a_problem: {title: "Leila belt de webwinkel", gloss: "Leila zegt: hallo, ik wil een probleem met mijn bestelling melden.", note: "aan de telefoon zeg je meteen waarvoor je belt."}
  en.a2.unit40.lesson04.teach.a_what_is_the_problem: {title: "de medewerker vraagt door", gloss: "De medewerker zegt: wat vervelend om te horen. Wat is het probleem?", note: "*I'm sorry to hear that* is de vaste, beleefde reactie van een medewerker op slecht nieuws."}
  en.a2.unit40.lesson04.teach.q_lamp_broken_box_damaged: {title: "Leila legt het probleem uit", gloss: "Leila zegt: de lamp kwam kapot aan. De doos was beschadigd.", note: "let op het verschil: de doos is *damaged*, de lamp is *broken*."}
  en.a2.unit40.lesson04.teach.a_ask_order_number: {title: "de medewerker vraagt om het bestelnummer", gloss: "De medewerker zegt: ik begrijp het. Kunt u mij uw bestelnummer geven?", note: "dezelfde indirecte vraagvorm *Could you tell me...?* als in unit 39."}
  en.a2.unit40.lesson04.teach.q_order_number_8154: {title: "Leila geeft haar bestelnummer", gloss: "Leila zegt: mijn bestelnummer is 8154.", note: "dezelfde zin die we in les 2 hebben geleerd."}
  en.a2.unit40.lesson04.teach.a_refund_or_replacement: {title: "de medewerker biedt twee opties aan", gloss: "De medewerker zegt: dank u wel. Wilt u uw geld terug of een vervangend exemplaar?", note: "*or* zet hier twee mogelijkheden naast elkaar; jij kiest er één."}
  en.a2.unit40.lesson04.teach.q_replacement_please: {title: "Leila kiest de vervanging", gloss: "Leila zegt: kan ik een vervangend exemplaar krijgen in plaats van mijn geld terug?", note: "dezelfde vraag die we in les 2 hebben geleerd."}
  en.a2.unit40.lesson04.teach.a_new_lamp_three_days: {title: "de medewerker regelt het", gloss: "De medewerker zegt: natuurlijk. Er wordt binnen drie werkdagen een nieuwe lamp verstuurd.", note: "dezelfde toezegging als in het bericht in les 3."}
  en.a2.unit40.lesson04.teach.q_thank_you: {title: "Leila bedankt de medewerker", gloss: "Leila zegt: hartelijk dank.", note: "*very much* maakt het bedanken wat nadrukkelijker."}

exercises:
  en.a2.unit40.lesson01.exercise01.listen_word:
    instruction: "Luister en kies het woord dat gezegd wordt."
    correct_option: "delivery"
    distractors: ["parcel", "replacement", "box"]
    accepted_answers: [{value: "delivery", status: "correct"}]
    feedback: "*delivery* betekent bezorging."
  en.a2.unit40.lesson01.exercise02.choose_damaged_word:
    instruction: "Welk woord beschrijft een doos die onderweg beschadigd is, maar nog bruikbaar?"
    correct_option: "damaged"
    distractors: ["broken", "delivery", "replacement"]
    accepted_answers: [{value: "damaged", status: "correct"}]
    feedback: "*damaged* betekent beschadigd -- de doos was beschadigd, de lamp erin was *broken*."
  en.a2.unit40.lesson01.exercise03.choose_replacement_word:
    instruction: "Welk woord betekent een nieuw exemplaar dat je in plaats van een kapot exemplaar krijgt?"
    correct_option: "replacement"
    distractors: ["refund", "delivery", "parcel"]
    accepted_answers: [{value: "replacement", status: "correct"}]
    feedback: "*replacement* betekent vervangend exemplaar; *refund* is je geld terug."
  en.a2.unit40.lesson01.exercise04.match_online_order_words:
    instruction: "Verbind elke omschrijving met het juiste Engelse woord."
    accepted_answers:
      - value:
          - {left: "the things you asked a shop to send you", right: "order"}
          - {left: "the moment your things are brought to your home", right: "delivery"}
          - {left: "the wrapped box that is brought to your door", right: "parcel"}
          - {left: "hurt on the way, but perhaps still usable", right: "damaged"}
          - {left: "in pieces, and no longer working", right: "broken"}
          - {left: "a new item sent in place of a bad one", right: "replacement"}
          - {left: "your money given back to you", right: "refund"}
          - {left: "the same item swapped for a different size or color", right: "exchange"}
        status: "correct"
    feedback: "*order*=bestelling, *delivery*=bezorging, *parcel*=pakket, *damaged*=beschadigd, *broken*=kapot, *replacement*=vervangend exemplaar, *refund*=geld terug, *exchange*=ruil."
  en.a2.unit40.lesson01.exercise05.write_replacement:
    instruction: "Schrijf het Engelse woord voor een nieuw exemplaar dat je in plaats van een kapot exemplaar krijgt."
    accepted_answers:
      - {value: "replacement", status: "correct"}
      - {value: "Replacement", status: "correct"}
    feedback: "*replacement* betekent vervangend exemplaar."

  en.a2.unit40.lesson02.exercise01.listen_the_problem:
    instruction: "Luister en kies de zin die gezegd wordt."
    correct_option: "The lamp arrived broken"
    distractors: ["My order number is 8154.", "Could I have a replacement instead of a refund?", "I'd like to report a problem with my order."]
    accepted_answers: [{value: "The lamp arrived broken", status: "correct"}]
    feedback: "dit betekent: de lamp kwam kapot aan."
  en.a2.unit40.lesson02.exercise02.choose_opening_line:
    instruction: "Je belt een webwinkel over een slechte bezorging. Wat zeg je als eerste?"
    correct_option: "I'd like to report a problem with my order."
    distractors: ["The lamp arrived broken.", "My order number is 8154.", "Could I have a replacement instead of a refund?"]
    accepted_answers: [{value: "I'd like to report a problem with my order.", status: "correct"}]
    feedback: "eerst meld je dát er een probleem is; wat er precies mis is, leg je daarna uit."
  en.a2.unit40.lesson02.exercise03.choose_ask_replacement:
    instruction: "Je wilt een nieuwe lamp, niet je geld terug. Hoe vraag je dat beleefd?"
    correct_option: "Could I have a replacement instead of a refund?"
    distractors: ["I'd like to report a problem with my order.", "The lamp arrived broken.", "My order number is 8154."]
    accepted_answers: [{value: "Could I have a replacement instead of a refund?", status: "correct"}]
    feedback: "*instead of a refund* maakt duidelijk dat je juist géén geld terug wilt."
  en.a2.unit40.lesson02.exercise04.order_lamp_arrived_broken:
    instruction: "Zet de woorden in de juiste volgorde voor «de lamp kwam kapot aan»."
    accepted_answers: [{value: ["The", "lamp", "arrived", "broken"], status: "correct"}]
    feedback: "de juiste volgorde is *The lamp arrived broken*."
  en.a2.unit40.lesson02.exercise05.order_ask_replacement:
    instruction: "Zet de woorden in de juiste volgorde voor «kan ik een vervangend exemplaar krijgen in plaats van mijn geld terug?»."
    accepted_answers: [{value: ["Could", "I", "have", "a", "replacement", "instead", "of", "a", "refund"], status: "correct"}]
    feedback: "de juiste volgorde is *Could I have a replacement instead of a refund*."
  en.a2.unit40.lesson02.exercise06.reply_ask_replacement:
    instruction: "De medewerker vraagt of je je geld terug wilt of een vervangend exemplaar. Vraag beleefd om een vervangend exemplaar in plaats van je geld terug."
    accepted_answers:
      - {value: "Could I have a replacement instead of a refund?", status: "correct"}
      - {value: "Could I have a replacement instead of a refund", status: "correct"}
    feedback: "*Could I have a replacement instead of a refund?* is de vraag uit deze les."
  en.a2.unit40.lesson02.exercise07.write_order_problem:
    instruction: "Schrijf dat je een probleem met je bestelling wilt melden."
    accepted_answers:
      - {value: "I'd like to report a problem with my order.", status: "correct"}
      - {value: "I'd like to report a problem with my order", status: "correct"}
    feedback: "*I'd like to report a problem with my order* betekent: ik wil een probleem met mijn bestelling melden."

  en.a2.unit40.lesson03.exercise01.read_what_to_do:
    instruction: "Wat vraagt de winkel Leila met de kapotte lamp te doen?"
