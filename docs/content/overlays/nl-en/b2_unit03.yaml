teaching:
  en.b2.unit03.lesson01.teach.hedge: {title: "hedge", gloss: "voorzichtiger formuleren", note: "*hedge* betekent dat je een uitspraak minder absoluut maakt. Vertaal Nederlands *een beetje* niet automatisch met *a little*.", example_gloss: "Leila gebruikt seems om haar uitspraak over het beleid voorzichtiger te maken."}
  en.b2.unit03.lesson01.teach.qualify: {title: "qualify", gloss: "beperken of nuanceren", note: "*qualify* betekent dat je een uitspraak beperkt met een voorwaarde of uitzondering.", example_gloss: "De uitdrukking 'provided we agree' beperkt Leila's steun."}
  en.b2.unit03.lesson01.teach.emphasize: {title: "emphasize", gloss: "benadrukken", note: "*emphasize* betekent dat je een deel van je boodschap sterker maakt.", example_gloss: "Daniel benadrukt het probleem van de werkdruk."}
  en.b2.unit03.lesson01.teach.to_some_extent: {title: "to some extent", gloss: "tot op zekere hoogte", note: "*to some extent* is vaak beter B2-Engels dan overal *a little* gebruiken.", example_gloss: "Tot op zekere hoogte beantwoordt het beleid de zorgen van het team."}
  en.b2.unit03.lesson01.teach.broadly: {title: "broadly", gloss: "in grote lijnen, over het algemeen", note: "*broadly* geeft algemene steun of algemene waarheid, met ruimte voor uitzonderingen.", example_gloss: "Het voorstel is in grote lijnen nuttig, al is het niet perfect."}
  en.b2.unit03.lesson01.teach.provided: {title: "provided", gloss: "mits, op voorwaarde dat", note: "*provided* introduceert een voorwaarde. Het lijkt op Nederlands *mits*, maar klinkt in Engels vaak formeel en professioneel.", example_gloss: "We kunnen het beleid steunen, mits we het eens zijn."}

  en.b2.unit03.lesson02.teach.seems_but_does: {title: "voorzichtig plus nadruk", gloss: "Het beleid lijkt redelijk, maar het zorgt wel voor extra werk voor het team.", note: "*seems* maakt de positieve uitspraak voorzichtiger; *does create* benadrukt dat het extra werk echt ontstaat. Nederlands heeft geen los equivalent van dit nadrukkelijke *does*."}
  en.b2.unit03.lesson02.teach.what_worries_me: {title: "focus op een zorg", gloss: "Waar ik me zorgen over maak, is het extra werk voor het team.", note: "*What worries me is...* zet een punt vooraan om er focus op te leggen. Houd daarna de Engelse volgorde: *is the extra work*."}
  en.b2.unit03.lesson02.teach.broadly_provided: {title: "algemene steun met voorwaarde", gloss: "Het is in grote lijnen nuttig, mits de planning wordt aangepast.", note: "*broadly useful, provided...* geeft steun met een duidelijke voorwaarde."}
  en.b2.unit03.lesson02.teach.grammar_stance: {title: "nuance en nadruk", gloss: "Gebruik seems, broadly of to some extent om een uitspraak voorzichtiger of beperkter te maken. Gebruik do of does voor het hoofdwerkwoord om te benadrukken dat iets waar is. Gebruik What matters is... of What worries me is... om de aandacht op een punt te richten.", note: "Voor Nederlandse sprekers is vooral *does create* nieuw: het betekent niet *doet creeren*, maar geeft nadruk aan *create*."}

  en.b2.unit03.lesson03.teach.overall: {title: "overall", gloss: "over het geheel genomen", note: "*overall* kijkt naar het geheel, ook als er details of uitzonderingen zijn.", example_gloss: "Over het geheel genomen steunt Leila het beleid."}
  en.b2.unit03.lesson03.teach.condition: {title: "condition", gloss: "voorwaarde", note: "*condition* is iets waaraan voldaan moet worden voordat iets geldt.", example_gloss: "Haar voorwaarde is dat de planning moet worden aangepast."}
  en.b2.unit03.lesson03.teach.reading_passage: {title: "leestekst: steun met voorwaarden", gloss: "Leila's feedback is positief, maar zorgvuldig genuanceerd. Ze zegt dat het reviewbeleid over het geheel genomen redelijk lijkt, wat de uitspraak voorzichtiger maakt en voorkomt dat ze absoluut klinkt. Ze zegt ook dat het in grote lijnen nuttig is, mits de planning wordt aangepast. Die voorwaarde beperkt haar steun: ze accepteert het beleid niet precies zoals het geschreven is. Daniel benadrukt een ander punt met een focusconstructie: waar hij zich zorgen over maakt, is het extra werk voor het team. Beide sprekers steunen het beleid in principe, maar hun taal laat verschillende niveaus van stelligheid zien.", note: "De tekst laat zien hoe je dezelfde basisinhoud zachter, sterker of voorwaardelijker maakt."}

  en.b2.unit03.lesson04.teach.q_policy_seems: {title: "Leila formuleert voorzichtig", gloss: "Leila zegt: het nieuwe reviewbeleid lijkt over het geheel genomen redelijk.", note: "*seems reasonable overall* is positiever dan kritiek, maar niet absoluut."}
  en.b2.unit03.lesson04.teach.a_not_fully_ready: {title: "Daniel hoort de voorzichtigheid", gloss: "Daniel zegt: dat klinkt een beetje voorzichtig. Bedoel je dat het nog niet helemaal klaar is?", note: "Daniel merkt dat Leila niet simpelweg *it is ready* zegt."}
  en.b2.unit03.lesson04.teach.q_workable_deadlines: {title: "Leila nuanceert verder", gloss: "Leila zegt: precies. Het kan werkbaar zijn, maar het heeft duidelijkere deadlines nodig.", note: "*may be workable* houdt ruimte voor twijfel; *but* noemt de beperking."}
  en.b2.unit03.lesson04.teach.a_what_worries: {title: "Daniel legt focus", gloss: "Daniel zegt: ik ben het ermee eens. Waar ik me zorgen over maak, is het extra werk voor het team.", note: "*What worries me is...* legt de focus op een zorg."}
  en.b2.unit03.lesson04.teach.q_does_create_checks: {title: "Leila benadrukt met does", gloss: "Leila zegt: precies. Het beleid zorgt wel voor betere kwaliteitscontroles, maar het voegt ook nog een goedkeuringsstap toe.", note: "*does create* benadrukt dat dit voordeel echt bestaat, ondanks de latere beperking."}
  en.b2.unit03.lesson04.teach.a_support_conditions: {title: "Daniel vat de voorwaarde samen", gloss: "Daniel zegt: dus we moeten het steunen met voorwaarden?", note: "Hij vat Leila's genuanceerde steun samen."}
  en.b2.unit03.lesson04.teach.q_broadly_useful: {title: "Leila geeft voorwaardelijke steun", gloss: "Leila zegt: ja. Ik zou zeggen dat het in grote lijnen nuttig is, mits de planning wordt aangepast.", note: "*provided* betekent hier *mits*: de steun geldt alleen als de voorwaarde wordt gehaald."}
  en.b2.unit03.lesson04.teach.same_content_triad: {title: "dezelfde inhoud, drie sterktes", gloss: "Het beleid zorgt voor extra werk. Het beleid lijkt extra werk te veroorzaken. Het beleid zorgt wel voor extra werk.", note: "De drie zinnen oefenen neutraal, voorzichtiger met *seems to*, en nadrukkelijker met *does*."}

