    Draft only. Overlay against the shared en/a1_unit49_waste_disposal.yaml
    realization (itself still unreviewed). This unit had NO overlay in any
    direction (nl-en/fa-en/prs-en) before this file -- it was an orphaned
    realization, authored but unreachable by any learner. Authored entirely
    independently from the target realization and universal spine; no
    sibling-direction overlay was opened or consulted (none existed for
    this unit at authoring time in any direction, confirmed via a fresh ls
    of docs/content/overlays/{nl-en,fa-en,prs-en}/ before starting). One
    main contrastive point, deliberately different from every point already
    used in this direction (see unit45/46/47/48's overlay notes for the
    running list, including unit35's already-covered general stranded-
    preposition pattern, which this note deliberately does not repeat):
    English "take out" (as in "take out the trash") is a phrasal verb whose
    particle can move -- "take out the trash" and "take the trash out" are
    both correct -- while Dutch separable verbs like uitzetten/opruimen
    always split with the particle fixed at the very end of the clause
    (de vuilnis buitenzetten), never floating mid-sentence the way English
    allows. Flagged explicitly on the can_you_take_out_the_trash teaching
    card, since a Dutch speaker's separable-verb instinct is broadly
    similar but the placement rules genuinely differ. Also carried forward
    the realization's own explicit flag: lesson03.exercise03's listen_select
    distractors must never include "Fridays" (a real, different fact Mia
    states in the same line for the regular trash) -- used only invented
    weekday distractors instead, confirmed below. Needs the mandatory
    fresh-context review before shipping.

