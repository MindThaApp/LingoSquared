  en.a1.unit49.lesson03.teach.dialogue_line2: {title: "Daniels excuus", gloss: "Daniel zegt: O nee, sorry! In welke bak hoort het?", note: "*Which bin does it go in?* herhaalt de vraagvorm die net geleerd is."}
  en.a1.unit49.lesson03.teach.dialogue_line3: {title: "Mia legt uit", gloss: "Mia zegt: Het hoort in de groene bak. We recyclen hier glas.", note: "*We recycle glass here.* betekent we recyclen hier glas."}
  en.a1.unit49.lesson03.teach.dialogue_line4: {title: "Daniels vraag", gloss: "Daniel vraagt: En papier en gft-afval?", note: "Herhaling van de eerder geleerde vraag What about ...?"}
  en.a1.unit49.lesson03.teach.dialogue_line5: {title: "Mia's uitleg", gloss: "Mia zegt: Papier hoort in de blauwe bak, en gft-afval hoort in de bruine bak.", note: "*goes in ..., and ... goes in ...* herhaalt dezelfde structuur voor twee verschillende soorten afval."}
  en.a1.unit49.lesson03.teach.dialogue_line6: {title: "Daniels vraag over de ophaaldag", gloss: "Daniel zegt: Begrepen. Wanneer is de ophaaldag?", note: "*Got it.* is een informele manier om te zeggen begrepen."}
  en.a1.unit49.lesson03.teach.dialogue_line7: {title: "Mia's antwoord", gloss: "Mia zegt: De recyclingbakken gaan op dinsdag naar buiten, en het vuilnis gaat op vrijdag naar buiten.", note: "Let op: Mia noemt hier twee verschillende dagen voor twee verschillende soorten afval -- dinsdag voor recycling, vrijdag voor gewoon vuilnis."}
  en.a1.unit49.lesson03.teach.dialogue_line8: {title: "Daniels belofte", gloss: "Daniel zegt: Bedankt! Ik zal voortaan alles goed sorteren.", note: "*I'll sort everything correctly next time.* betekent ik zal voortaan alles goed sorteren."}

  en.a1.unit49.lesson04.teach.reading_passage: {title: "Tekst over hoe afval sorteren werkt", gloss: "Hoe je je afval sorteert: Veel appartementsgebouwen hebben verschillende bakken voor verschillende soorten afval. Glas hoort meestal in de groene bak, en papier hoort in de blauwe bak. Gft-afval hoort in de bruine bak, en al de rest hoort in de zwarte bak voor gewoon vuilnis. Het helpt om je ophaaldag te kennen, want de bakken worden maar één keer per week opgehaald. Daniel oefent recepten uit het kookboek dat hij bij de bibliotheek leende, en hij kookt vaak samen met Mia bij haar thuis. Gisteravond maakte hij een recept uit het kookboek, en daarna wilde hij bijna een glazen pot bij het gewone vuilnis gooien. Mia hield hem tegen en liet hem zien hoe haar gebouw het afval sorteert. Ze legde uit dat de recyclingbakken op dinsdag naar buiten gaan, en het gewone vuilnis op vrijdag. Daniel was dankbaar en zei dat hij voortaan alles goed zal sorteren.", note: "*almost put a glass jar in the regular trash* betekent bijna een glazen pot bij het gewone vuilnis gooide."}

