course:
  title: "Engels B1"
  description: >-
    Engels leren op B1-niveau voor alledaagse gesprekken over verplichtingen,
    mogelijkheden, hypothetische situaties, tegenstellingen, verhalen en
    beschrijvingen met bijzinnen, met gedetailleerde uitleg in het Nederlands.

units:
  en.b1.unit13.relative_clauses: {title: "The colleague who sits next to Mia"}

lessons:
  en.b1.unit13.lesson01.relative_clause_vocabulary: {title: "Who, which, that, whose en where"}
  en.b1.unit13.lesson02.defining_and_nondefining: {title: "Bepalende en niet-bepalende bijzinnen"}
  en.b1.unit13.lesson03.reading_the_new_office: {title: "Lezen: het nieuwe kantoor"}
  en.b1.unit13.lesson04.the_new_coworker_dialogue: {title: "The woman who just joined our team"}

teaching:
  en.b1.unit13.lesson01.teach.who: {title: "who", gloss: "die/dat (voor personen)", note: "*who* verwijst naar een persoon in een bijzin.", example_gloss: "Daniel, die in maart bij het team kwam, leidt nu al twee projecten."}
  en.b1.unit13.lesson01.teach.which: {title: "which", gloss: "die/dat (voor dingen)", note: "*which* verwijst naar een ding in een bijzin.", example_gloss: "De designcursus die Leila koos, begint in juni."}
  en.b1.unit13.lesson01.teach.that_relative: {title: "that", gloss: "die/dat (bepalend)", note: "*that* verwijst naar een persoon of ding in een bepalende bijzin.", example_gloss: "De klant die vanochtend belde, wil een afspraak."}
  en.b1.unit13.lesson01.teach.whose: {title: "whose", gloss: "wiens/wier", note: "*whose* geeft bezit aan binnen een bijzin.", example_gloss: "De klant wiens project ze afmaken, heeft het ontwerp al goedgekeurd."}
  en.b1.unit13.lesson01.teach.where: {title: "where", gloss: "waar", note: "*where* verwijst naar een plaats binnen een bijzin.", example_gloss: "Het kantoor waar Daniel werkt, ligt in het centrum."}
  en.b1.unit13.lesson01.teach.coworker: {title: "coworker", gloss: "collega", note: "*coworker* betekent iemand met wie je werkt.", example_gloss: "Mia heeft een collega die 's avonds Spaans studeert."}

  en.b1.unit13.lesson02.teach.colleague_organized: {title: "who in een bepalende bijzin", gloss: "De collega die naast Mia zit, is heel georganiseerd.", note: "*who* introduceert hier informatie die nodig is om te weten over wie het gaat."}
  en.b1.unit13.lesson02.teach.daniel_leads_projects: {title: "who in een niet-bepalende bijzin", gloss: "Daniel, die in maart bij het team kwam, leidt nu al twee projecten.", note: "de komma's tonen dat de bijzin extra informatie geeft, geen noodzakelijke identificatie."}
  en.b1.unit13.lesson02.teach.grammar_defining: {title: "bepalende en niet-bepalende bijzinnen", gloss: "Gebruik een bepalende bijzin zonder komma's om precies aan te geven over wie of wat je het hebt: The colleague who sits next to Mia is organized. Gebruik een niet-bepalende bijzin met komma's om extra informatie te geven over iemand die al bekend is: Daniel, who joined in March, already leads two projects.", note: "vorm: bepalend = geen komma's, identificeert wie/wat; niet-bepalend = komma's, voegt extra informatie toe."}

  en.b1.unit13.lesson03.teach.deadline: {title: "deadline", gloss: "deadline, uiterste termijn", note: "*deadline* betekent de datum of tijd waarop iets af moet zijn.", example_gloss: "De collega die naast Mia zit, haalt altijd haar deadlines."}
  en.b1.unit13.lesson03.teach.approve: {title: "approve", gloss: "goedkeuren", note: "*approve* betekent iets officieel accepteren.", example_gloss: "De klant heeft het eerste ontwerp al goedgekeurd."}
  en.b1.unit13.lesson03.teach.reading_passage: {title: "leestekst: het nieuwe kantoor", gloss: "Mia werkt met verschillende mensen die haar werk makkelijker maken. Daniel, die in maart bij het team kwam, leidt nu al twee projecten. De collega die naast Mia zit, is heel georganiseerd en haalt altijd haar deadlines. Hun kantoor, dat op de vijfde verdieping is, heeft een kleine keuken waar iedereen samen lunch eet. De klant wiens project ze afmaken, heeft het eerste ontwerp al goedgekeurd.", note: "een korte leestekst met bepalende en niet-bepalende bijzinnen op B1-niveau."}

  en.b1.unit13.lesson04.teach.q_met_the_woman: {title: "Mia stelt de nieuwe collega voor", gloss: "Mia zegt: Leila, heb je de vrouw ontmoet die net bij ons team kwam?", note: "*who* verwijst hier naar *the woman*."}
  en.b1.unit13.lesson04.teach.a_whose_desk: {title: "Leila vraagt naar de plek van de nieuwe collega", gloss: "Leila zegt: nog niet. Is zij de persoon wiens bureau bij het raam staat?", note: "*whose* geeft bezit aan: *whose desk*."}
  en.b1.unit13.lesson04.teach.q_the_designer_who: {title: "Mia beschrijft de nieuwe collega", gloss: "Mia zegt: ja, dat is haar. Zij is de ontwerper die het logoproject heeft afgemaakt.", note: "*who* verwijst naar *the designer*."}
  en.b1.unit13.lesson04.teach.a_which_won_award: {title: "Leila herinnert zich het project", gloss: "Leila zegt: oh, ik herinner het me. Is dat het project dat vorige maand de prijs won?", note: "*which* verwijst naar *the project*."}
  en.b1.unit13.lesson04.teach.q_office_smaller: {title: "Mia vertelt over haar vorige kantoor", gloss: "Mia zegt: precies. Het kantoor waar ze vroeger werkte, was veel kleiner dan het onze.", note: "*where* verwijst naar een plaats: *the office*."}
  en.b1.unit13.lesson04.teach.a_kitchen_where: {title: "Leila begrijpt waarom ze de keuken leuk vindt", gloss: "Leila zegt: dat verklaart waarom ze de keuken zo leuk vindt waar iedereen samen lunch eet.", note: "*where* verwijst naar *the kitchen*."}

exercises:
  en.b1.unit13.lesson01.exercise01.listen_word:
    instruction: "Luister en kies het woord dat gezegd wordt."
    correct_option: "coworker"
    distractors: ["whose", "where", "which"]
    accepted_answers: [{value: "coworker", status: "correct"}]
    feedback: "*coworker* betekent collega."
  en.b1.unit13.lesson01.exercise02.choose_whose:
    instruction: "Welk woord geeft bezit aan binnen een bijzin?"
    correct_option: "whose"
    distractors: ["who", "which", "where"]
    accepted_answers: [{value: "whose", status: "correct"}]
    feedback: "*whose* betekent wiens of wier."
  en.b1.unit13.lesson01.exercise03.choose_where:
    instruction: "Welk woord verwijst naar een plaats binnen een bijzin?"
    correct_option: "where"
    distractors: ["who", "which", "whose"]
    accepted_answers: [{value: "where", status: "correct"}]
    feedback: "*where* betekent waar."
  en.b1.unit13.lesson01.exercise04.match_relative_words:
    instruction: "Verbind elke betekenis met het juiste Engelse woord."
    accepted_answers:
      - value:
          - {left: "refers to a person in a relative clause", right: "who"}
          - {left: "shows possession inside a relative clause", right: "whose"}
          - {left: "refers to a place inside a relative clause", right: "where"}
          - {left: "someone you work with", right: "coworker"}
        status: "correct"
    feedback: "Elke omschrijving hoort bij één Engels woord of één Engelse uitdrukking."
  en.b1.unit13.lesson01.exercise05.write_coworker:
    instruction: "Schrijf het woord dat iemand met wie je werkt betekent."
    accepted_answers:
      - {value: "coworker", status: "correct"}
      - {value: "Coworker", status: "correct"}
    feedback: "*coworker* betekent collega."

  en.b1.unit13.lesson02.exercise01.choose_defining_clause:
    instruction: "Welke zin gebruikt een bepalende bijzin zonder komma's?"
    correct_option: "The colleague who sits next to Mia is very organized."
    distractors: ["Daniel, who joined the team in March, already leads two projects.", "Their office, which is on the fifth floor, has a small kitchen.", "The client, whose project they are finishing, approved the design."]
    accepted_answers: [{value: "The colleague who sits next to Mia is very organized.", status: "correct"}]
    feedback: "deze zin heeft geen komma's rond de bijzin."
  en.b1.unit13.lesson02.exercise02.choose_nondefining_clause:
    instruction: "Welke zin gebruikt een niet-bepalende bijzin met komma's om extra informatie te geven?"
    correct_option: "Daniel, who joined the team in March, already leads two projects."
    distractors: ["The colleague who sits next to Mia is very organized.", "The client whose project they are finishing has already approved the design.", "The office where Daniel works is downtown."]
    accepted_answers: [{value: "Daniel, who joined the team in March, already leads two projects.", status: "correct"}]
    feedback: "de komma's rond *who joined the team in March* geven extra informatie."
  en.b1.unit13.lesson02.exercise03.order_colleague_organized:
    instruction: "Zet de woorden in de juiste volgorde voor «de collega die naast Mia zit, is heel georganiseerd»."
    accepted_answers: [{value: ["The", "colleague", "who", "sits", "next", "to", "Mia", "is", "very", "organized"], status: "correct"}]
    feedback: "de juiste volgorde is *The colleague who sits next to Mia is very organized*."
  en.b1.unit13.lesson02.exercise04.reply_which_colleague:
    instruction: "Welke collega is heel georganiseerd?"
    accepted_answers:
      - {value: "The colleague who sits next to Mia is very organized.", status: "correct"}
      - {value: "The colleague who sits next to Mia is very organized", status: "correct"}
    feedback: "de tekst zegt *The colleague who sits next to Mia is very organized*."
  en.b1.unit13.lesson02.exercise05.write_daniel_leads:
    instruction: "Schrijf dat Daniel, die in maart bij het team kwam, nu al twee projecten leidt."
    accepted_answers:
      - {value: "Daniel, who joined the team in March, already leads two projects.", status: "correct"}
      - {value: "Daniel, who joined the team in March, already leads two projects", status: "correct"}
    feedback: "de komma's rond de bijzin geven extra informatie over Daniel."

  en.b1.unit13.lesson03.exercise01.comprehend_daniel_leads:
    instruction: "Wat heeft Daniel, die in maart bij het team kwam, al gedaan?"
    correct_option: "already leads two projects"
    distractors: ["already changed teams", "already approved the design", "already sat next to Mia"]
    accepted_answers: [{value: "already leads two projects", status: "correct"}]
    feedback: "de tekst zegt *already leads two projects*."
  en.b1.unit13.lesson03.exercise02.comprehend_client_approved:
    instruction: "Wat heeft de klant, wiens project ze afmaken, al gedaan?"
    correct_option: "has already approved the first design"
    distractors: ["has already changed the deadline", "has already met Daniel", "has already visited the office"]
    accepted_answers: [{value: "has already approved the first design", status: "correct"}]
    feedback: "de tekst zegt *has already approved the first design*."
  en.b1.unit13.lesson03.exercise03.recognize_deadline:
    instruction: "Welk woord betekent de datum of tijd waarop iets af moet zijn?"
    correct_option: "deadline"
    distractors: ["approve", "coworker", "opportunity"]
    accepted_answers: [{value: "deadline", status: "correct"}]
    feedback: "*deadline* betekent uiterste termijn."
  en.b1.unit13.lesson03.exercise04.order_office_kitchen:
    instruction: "Zet de woorden in de juiste volgorde voor «hun kantoor, dat op de vijfde verdieping is, heeft een kleine keuken»."
    accepted_answers: [{value: ["Their", "office", "which", "is", "on", "the", "fifth", "floor", "has", "a", "small", "kitchen"], status: "correct"}]
    feedback: "de juiste volgorde is *Their office, which is on the fifth floor, has a small kitchen*."
  en.b1.unit13.lesson03.exercise05.write_colleague_organized:
    instruction: "Schrijf dat de collega die naast Mia zit, heel georganiseerd is."
    accepted_answers:
      - {value: "The colleague who sits next to Mia is very organized.", status: "correct"}
      - {value: "The colleague who sits next to Mia is very organized", status: "correct"}
    feedback: "*who* verwijst naar *the colleague*."

  en.b1.unit13.lesson04.exercise01.listen_who_joined_team:
    instruction: "Luister naar het gesprek en kies wie er net bij het team kwam."
    correct_option: "the woman who just joined our team"
    distractors: ["the man who just joined our team", "the woman who used to work here", "the manager who just joined our team"]
    accepted_answers: [{value: "the woman who just joined our team", status: "correct"}]
    feedback: "Mia zegt *the woman who just joined our team*."
  en.b1.unit13.lesson04.exercise02.listen_desk_location:
    instruction: "Luister en kies waar het bureau van de nieuwe collega staat."
    correct_option: "whose desk is near the window"
    distractors: ["whose desk is near the door", "whose desk is next to Mia", "whose desk is on the fifth floor"]
    accepted_answers: [{value: "whose desk is near the window", status: "correct"}]
    feedback: "Leila zegt *whose desk is near the window*."
  en.b1.unit13.lesson04.exercise03.choose_who_the_new_coworker_is:
    instruction: "Wie is de nieuwe collega die Mia beschrijft?"
    correct_option: "the designer who finished the logo project"
    distractors: ["the manager who joined the team in March", "the client whose project they are finishing", "the coworker who studies Spanish in the evening"]
    accepted_answers: [{value: "the designer who finished the logo project", status: "correct"}]
    feedback: "Mia zegt *the designer who finished the logo project*."
  en.b1.unit13.lesson04.exercise04.order_office_smaller:
    instruction: "Zet de woorden in de juiste volgorde voor «het kantoor waar ze vroeger werkte, was veel kleiner dan het onze»."
    accepted_answers: [{value: ["The", "office", "where", "she", "used", "to", "work", "was", "much", "smaller", "than", "ours"], status: "correct"}]
    feedback: "de juiste volgorde is *The office where she used to work was much smaller than ours*."
  en.b1.unit13.lesson04.exercise05.reply_as_mia:
    instruction: "Leila zegt: nog niet. Is zij de persoon wiens bureau bij het raam staat? Geef Mia's antwoord: zeg dat het klopt en dat zij de ontwerper is die het logoproject heeft afgemaakt."
    accepted_answers:
      - {value: "Yes, that is her. She is the designer who finished the logo project.", status: "correct"}
      - {value: "Yes, that is her. She is the designer who finished the logo project", status: "correct"}
      - {value: "She is the designer who finished the logo project.", status: "correct"}
      - {value: "She is the designer who finished the logo project", status: "correct"}
    feedback: "*who* verwijst naar *the designer*."
  en.b1.unit13.lesson04.exercise06.speak_relative_clause_dialogue:
    instruction: "Mia zegt: precies. Het kantoor waar ze vroeger werkte, was veel kleiner dan het onze. Antwoord hardop als Leila: zeg dat dat verklaart waarom ze de keuken zo leuk vindt waar iedereen samen lunch eet."
    accepted_answers:
      - {value: "That explains why she loves the kitchen where everyone eats lunch together.", status: "correct"}
      - {value: "That explains why she loves the kitchen where everyone eats lunch together", status: "correct"}
    feedback: "*where* verwijst naar *the kitchen*."
