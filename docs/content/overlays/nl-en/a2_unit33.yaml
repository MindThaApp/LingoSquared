    instruction: "Iemand vraagt wat je doordeweeks doet. Wat zeg je?"
    correct_option: "On weekdays, I work at my company."
    distractors: ["On the weekend, I relax and see my friends.", "First, I check my email, then I go to meetings.", "My schedule is busy on weekdays."]
    accepted_answers: [{value: "On weekdays, I work at my company.", status: "correct"}]
    feedback: "*On weekdays,...* gebruik je om een doordeweekse gewoonte te beschrijven."
  en.a2.unit33.lesson02.exercise03.order_first_then_sentence:
    instruction: "Zet de woorden in de juiste volgorde voor «eerst check ik mijn e-mail, daarna ga ik naar vergaderingen»."
    accepted_answers: [{value: ["First", "I", "check", "my", "email", "then", "I", "go", "to", "meetings"], status: "correct"}]
