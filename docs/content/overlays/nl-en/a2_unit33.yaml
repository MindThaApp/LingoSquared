    accepted_answers: [{value: "weekday", status: "correct"}]
    feedback: "*weekday* betekent doordeweekse dag."
  en.a2.unit33.lesson01.exercise03.choose_saturday_sunday_word:
    instruction: "Welk woord beschrijft zaterdag en zondag?"
    correct_option: "weekend"
    distractors: ["weekday", "schedule", "after that"]
    accepted_answers: [{value: "weekend", status: "correct"}]
    feedback: "*weekend* betekent weekend."
  en.a2.unit33.lesson01.exercise04.match_schedule_words:
    instruction: "Verbind elke omschrijving met het juiste Engelse woord of de juiste uitdrukking."
    accepted_answers:
      - value:
          - {left: "weekday", right: "Monday through Friday"}
          - {left: "weekend", right: "Saturday and Sunday"}
          - {left: "schedule", right: "a plan of activities and their times"}
          - {left: "after that", right: "used to say what happens next"}
          - {left: "finally", right: "used to say what happens last"}
          - {left: "first", right: "used to say what happens first"}
          - {left: "then", right: "used to say what happens right after that"}
        status: "correct"
    feedback: "*weekday*=doordeweekse dag, *weekend*=weekend, *schedule*=schema, *after that*=daarna, *finally*=ten slotte, *first*=eerst, *then*=daarna/dan."
  en.a2.unit33.lesson01.exercise05.write_weekend:
