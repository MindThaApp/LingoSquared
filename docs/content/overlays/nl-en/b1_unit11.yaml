review: {status: "reviewed", required_next_reviewer: null, notes: "Eleventh nl-en B1 overlay, authored directly against the reviewed English realization b1_unit11_unreal_hypotheticals. 2026-07-12 fresh-context review (Claude Opus): Dutch natural and consistent jij/je register; glosses faithful; no anglicisms. matching_pairs accepted_answers mirror realization pairs exactly (6). listen_select/dialogue distractors verified absent from the tested speaker's audio lines (incl. Mia's 'evening class' not reused); one correct answer each. No YAML boolean/snake_case leaks. Compiler 0 errors. Zero defects. Review 2026-10-22 (shared-en r3): 2 fixes - accepted answers made consistent (I'd/I would, would've, it was/it were, I'd known); listen distractors that named the evening class (heard in the audio) replaced in fa/prs. NATIVE FLAGS: none. Review 2026-10-22 (nl-en r2 overlay pass): 28 fixes - 17 notes/feedback/titles capitalised, 3 guillemets to straight quotes, mixed lesson title translated, regret/sooner glosses smoothed, level label removed, 2 speak/reply instructions made natural, 2 accepted-answer sets extended (reverse clause order). NATIVE FLAGS: if I were gloss 'als ik was / als ik zou zijn' (second variant colloquial; matching pair text)."}

course:
  title: "Engels B1"
  description: >-
    Engels leren op B1-niveau voor alledaagse gesprekken over verplichtingen,
    mogelijkheden, hypothetische situaties en verhalen, met gedetailleerde
    uitleg in het Nederlands.

units:
  en.b1.unit11.unreal_hypotheticals: {title: "If it were cheaper, I would sign up"}

lessons:
  en.b1.unit11.lesson01.unreal_hypothetical_vocabulary: {title: "Ingebeelde situaties: would, if I were, regret"}
  en.b1.unit11.lesson02.unreal_present: {title: "If I had more time, I would"}
  en.b1.unit11.lesson03.reading_a_missed_opportunity: {title: "Lezen: een gemiste kans"}
  en.b1.unit11.lesson04.the_design_course_dialogue: {title: "Would you take the course?"}

teaching:
  en.b1.unit11.lesson01.teach.would: {title: "would", gloss: "zou", note: "*would* + basisvorm geeft een ingebeeld resultaat of een beleefde voorkeur aan.", example_gloss: "Ik zou meedoen als ik meer tijd had."}
  en.b1.unit11.lesson01.teach.would_rather: {title: "would rather", gloss: "liever willen", note: "*would rather* betekent dat je iets liever doet dan iets anders.", example_gloss: "Ik zou liever de weekendcursus volgen."}
  en.b1.unit11.lesson01.teach.if_i_were: {title: "if I were", gloss: "als ik was / als ik zou zijn", note: "*if I were* introduceert een onwerkelijke situatie over jezelf.", example_gloss: "Als ik vanavond vrij was, zou ik gaan."}
  en.b1.unit11.lesson01.teach.opportunity: {title: "opportunity", gloss: "kans, gelegenheid", note: "*opportunity* betekent een goede kans om iets te doen.", example_gloss: "Deze cursus is een goede kans voor Leila."}
  en.b1.unit11.lesson01.teach.regret: {title: "regret", gloss: "spijt", note: "*regret* betekent verdriet of spijt over een keuze in het verleden.", example_gloss: "Eén ding spijt haar: dat ze niet eerder geld heeft gespaard."}
  en.b1.unit11.lesson01.teach.take_a_chance: {title: "take a chance", gloss: "een kans wagen", note: "*take a chance* betekent iets proberen, ook als succes niet zeker is.", example_gloss: "Als de cursus goedkoper was, zou ze een kans wagen."}

  en.b1.unit11.lesson02.teach.more_time_course: {title: "Een onwerkelijke situatie in het heden", gloss: "Als ik meer tijd had, zou ik een designcursus volgen.", note: "Gebruik na *if* de verleden tijd voor een onwerkelijke situatie in het heden: *If I had more time*."}
  en.b1.unit11.lesson02.teach.cheaper_sign_up: {title: "if it were cheaper", gloss: "Als het goedkoper was, zou ik me vandaag inschrijven.", note: "*were* klinkt hier natuurlijk in een onwerkelijke voorwaarde, ook bij *it*."}
  en.b1.unit11.lesson02.teach.grammar_unreal_present: {title: "Onwerkelijke voorwaarden in het heden", gloss: "Als het goedkoper was, zou ik me inschrijven.", note: "Vorm: *if* + verleden tijd, daarna *would* + basisvorm."}

  en.b1.unit11.lesson03.teach.sooner: {title: "sooner", gloss: "eerder", note: "*sooner* betekent eerder dan het moment waarop het werkelijk gebeurde.", example_gloss: "Als ze het eerder had geweten, had ze meer geld gespaard."}
  en.b1.unit11.lesson03.teach.confident: {title: "confident", gloss: "zelfverzekerd", note: "*confident* betekent dat je voelt dat je iets goed kunt doen.", example_gloss: "Als Daniel meedeed, zou Leila zich zelfverzekerder voelen."}
  en.b1.unit11.lesson03.teach.reading_passage: {title: "Leestekst: een gemiste kans", gloss: "Leila vond een designcursus die ze heel graag wil volgen. Hij is nuttig, maar duur. Als hij goedkoper was, zou ze zich vandaag inschrijven. Als Daniel ook aan de cursus meedeed, zou ze zich zelfverzekerder voelen. Haar enige spijt is de timing: als ze eerder over de cursus had geweten, had ze meer geld gespaard.", note: "Een korte leestekst met onwerkelijke voorwaarden in het heden en verleden."}

  en.b1.unit11.lesson04.teach.q_take_if_cheaper: {title: "Mia vraagt een hypothetische vraag", gloss: "Mia zegt: Leila, zou je de designcursus volgen als hij goedkoper was?", note: "Een beleefde, hypothetische vraag met *would*."}
  en.b1.unit11.lesson04.teach.a_sign_up_today: {title: "Leila geeft het ingebeelde resultaat", gloss: "Leila zegt: zeker. Als hij goedkoper was, zou ik me vandaag inschrijven.", note: "*If it were cheaper, I would...* beschrijft wat ze zou doen in een andere situatie."}
  en.b1.unit11.lesson04.teach.q_daniel_joined: {title: "Mia stelt nog een scenario voor", gloss: "Mia zegt: wat als Daniel ook meedeed?", note: "*What if...* introduceert een ingebeelde mogelijkheid."}
  en.b1.unit11.lesson04.teach.a_more_confident: {title: "Leila beschrijft haar gevoel", gloss: "Leila zegt: als Daniel meedeed, zou ik me zelfverzekerder voelen.", note: "*joined* staat in de verleden tijd omdat de situatie ingebeeld is."}
  en.b1.unit11.lesson04.teach.q_would_rather_weekend: {title: "Mia geeft haar voorkeur", gloss: "Mia zegt: ik zou liever de weekendcursus volgen dan de avondcursus.", note: "*would rather ... than ...* vergelijkt twee voorkeuren."}
  en.b1.unit11.lesson04.teach.a_known_sooner: {title: "Leila noemt spijt over het verleden", gloss: "Leila zegt: ik ook. Als ik er eerder van had geweten, had ik meer geld gespaard.", note: "*if + past perfect, would have + voltooid deelwoord* beschrijft een onwerkelijke situatie in het verleden."}

exercises:
  en.b1.unit11.lesson01.exercise01.listen_word:
    instruction: "Luister en kies de uitdrukking die gezegd wordt."
    correct_option: "would rather"
    distractors: ["if I were", "regret", "opportunity"]
    accepted_answers: [{value: "would rather", status: "correct"}]
    feedback: "*would rather* betekent liever willen."
  en.b1.unit11.lesson01.exercise02.choose_opportunity:
    instruction: "Welk woord betekent een goede kans om iets te doen?"
    correct_option: "opportunity"
    distractors: ["regret", "would", "confident"]
    accepted_answers: [{value: "opportunity", status: "correct"}]
    feedback: "*opportunity* betekent kans of gelegenheid."
  en.b1.unit11.lesson01.exercise03.choose_regret:
    instruction: "Welk woord betekent spijt over een keuze in het verleden?"
    correct_option: "regret"
    distractors: ["opportunity", "take a chance", "would rather"]
    accepted_answers: [{value: "regret", status: "correct"}]
    feedback: "*regret* betekent spijt."
  en.b1.unit11.lesson01.exercise04.match_unreal_words:
    instruction: "Verbind elk Engels woord of elke Engelse uitdrukking met de juiste Nederlandse omschrijving."
    pairs:
      - {left: "would", right: "zou"}
      - {left: "would rather", right: "liever willen"}
      - {left: "if I were", right: "als ik was / als ik zou zijn"}
      - {left: "opportunity", right: "kans, gelegenheid"}
      - {left: "regret", right: "spijt"}
      - {left: "take a chance", right: "een kans wagen"}
    accepted_answers:
      - value:
          - {left: "would", right: "zou"}
          - {left: "would rather", right: "liever willen"}
          - {left: "if I were", right: "als ik was / als ik zou zijn"}
          - {left: "opportunity", right: "kans, gelegenheid"}
          - {left: "regret", right: "spijt"}
          - {left: "take a chance", right: "een kans wagen"}
        status: "correct"
    feedback: "*would*=zou, *would rather*=liever willen, *if I were*=als ik was, *opportunity*=kans, *regret*=spijt, *take a chance*=een kans wagen."
  en.b1.unit11.lesson01.exercise05.write_would_rather:
    instruction: "Schrijf de uitdrukking die \"would prefer to\" betekent."
    accepted_answers:
      - {value: "would rather", status: "correct"}
      - {value: "Would rather", status: "correct"}
    feedback: "*would rather* betekent liever willen."

  en.b1.unit11.lesson02.exercise01.choose_more_time:
    instruction: "Welke zin stelt zich een andere situatie in het heden voor?"
    correct_option: "If I had more time, I would take a design course."
    distractors: ["I take a design course every year.", "I took a design course last year.", "I will take a design course tomorrow."]
    accepted_answers: [{value: "If I had more time, I would take a design course.", status: "correct"}]
    feedback: "*If I had more time* is een onwerkelijke voorwaarde in het heden."
