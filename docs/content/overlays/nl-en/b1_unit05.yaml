  en.b1.unit05.lesson01.teach.update: {title: "update", gloss: "update, bijgewerkte informatie", note: "*update* betekent nieuwe informatie over hoe iets gaat.", example_gloss: "Ik geef mijn team elke week een update."}
  en.b1.unit05.lesson01.teach.deadline: {title: "deadline", gloss: "deadline", note: "*deadline* betekent de datum waarop iets af moet zijn.", example_gloss: "De deadline voor het rapport is vrijdag."}
  en.b1.unit05.lesson01.teach.report: {title: "report", gloss: "rapport", note: "*report* betekent een geschreven document over werk of resultaten.", example_gloss: "Ik schrijf elke maand een verkooprapport."}
