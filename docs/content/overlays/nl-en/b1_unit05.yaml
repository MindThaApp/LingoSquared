  en.b1.unit05.lesson02.teach.grammar_status_update: {title: "statusupdates geven", gloss: "Ik ben verantwoordelijk voor het rapport. Het project ligt op schema. Ik loop achter op schema.", note: "deze drie zinnen zijn standaardmanieren om verantwoordelijkheden en voortgang te bespreken op het werk."}

  en.b1.unit05.lesson03.teach.team: {title: "team", gloss: "team", note: "*team* betekent een groep mensen die samenwerkt.", example_gloss: "Hij geeft zijn team elke week een korte update."}
  en.b1.unit05.lesson03.teach.technical_problem: {title: "technical problem", gloss: "technisch probleem", note: "*technical problem* betekent een probleem met apparatuur of software.", example_gloss: "Hij loopt achter op schema vanwege een technisch probleem."}
  en.b1.unit05.lesson03.teach.reading_passage: {title: "leestekst: Daniels wekelijkse update", gloss: "Daniel is verantwoordelijk voor het maandelijkse verkooprapport. Elke week geeft hij zijn team een korte update. Deze week loopt hij een beetje achter op schema vanwege een technisch probleem, maar hij verwacht vrijdag klaar te zijn. Hij vertelt zijn team altijd de waarheid over vertragingen.", note: "een korte leestekst over hoe Daniel eerlijk communiceert over een vertraging -- B1-niveau."}

