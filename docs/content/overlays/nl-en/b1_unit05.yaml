exercises:
  en.b1.unit05.lesson01.exercise01.listen_word:
    instruction: "Luister en kies het woord dat gezegd wordt."
    correct_option: "deadline"
    distractors: ["update", "report", "on schedule"]
    accepted_answers: [{value: "deadline", status: "correct"}]
    feedback: "*deadline* betekent deadline."
  en.b1.unit05.lesson01.exercise02.choose_in_charge_of_phrase:
    instruction: "Welke uitdrukking betekent dat het jouw taak is om voor iets te zorgen?"
    correct_option: "responsible for"
    distractors: ["behind schedule", "update", "deadline"]
    accepted_answers: [{value: "responsible for", status: "correct"}]
    feedback: "*responsible for* betekent verantwoordelijk voor."
  en.b1.unit05.lesson01.exercise03.choose_late_phrase:
    instruction: "Welke uitdrukking betekent dat een taak langzamer gaat dan gepland?"
    correct_option: "behind schedule"
    distractors: ["on schedule", "responsible for", "update"]
    accepted_answers: [{value: "behind schedule", status: "correct"}]
    feedback: "*behind schedule* betekent achter op schema."
  en.b1.unit05.lesson01.exercise04.match_workplace_words:
    instruction: "Verbind elke betekenis met het juiste Engelse woord of de juiste uitdrukking."
    accepted_answers:
      - value:
          - {left: "it is your job to take care of this", right: "responsible for"}
          - {left: "new information about how something is going", right: "update"}
          - {left: "the date something must be finished by", right: "deadline"}
          - {left: "a written document describing work or results", right: "report"}
          - {left: "going as planned, not late", right: "on schedule"}
          - {left: "going slower than planned", right: "behind schedule"}
        status: "correct"
    feedback: "*responsible for*=verantwoordelijk voor, *update*=update, *deadline*=deadline, *report*=rapport, *on schedule*=volgens planning, *behind schedule*=achter op schema."
  en.b1.unit05.lesson01.exercise05.write_deadline:
    instruction: "Schrijf het woord voor de datum waarop iets af moet zijn."
    accepted_answers:
      - {value: "deadline", status: "correct"}
      - {value: "Deadline", status: "correct"}
    feedback: "*deadline* betekent deadline."

  en.b1.unit05.lesson02.exercise01.choose_daniels_responsibility:
    instruction: "Welke zin beschrijft een verantwoordelijkheid op het werk?"
    correct_option: "I'm responsible for the monthly report."
    distractors: ["The project is on schedule.", "I'm a little behind schedule, but I'll finish by Friday.", "I give my team a weekly update."]
    accepted_answers: [{value: "I'm responsible for the monthly report.", status: "correct"}]
    feedback: "*I'm responsible for the monthly report* beschrijft een verantwoordelijkheid."
  en.b1.unit05.lesson02.exercise02.choose_status_update:
    instruction: "Welke zin geeft een statusupdate over iets dat een beetje laat is?"
    correct_option: "I'm a little behind schedule, but I'll finish by Friday."
    distractors: ["I'm responsible for the monthly report.", "The project is on schedule.", "The deadline is Friday."]
    accepted_answers: [{value: "I'm a little behind schedule, but I'll finish by Friday.", status: "correct"}]
    feedback: "*I'm a little behind schedule, but I'll finish by Friday* geeft een statusupdate over een kleine vertraging."
  en.b1.unit05.lesson02.exercise03.order_project_on_schedule:
    instruction: "Zet de woorden in de juiste volgorde voor «het project ligt op schema»."
    accepted_answers: [{value: ["The", "project", "is", "on", "schedule"], status: "correct"}]
    feedback: "de juiste volgorde is *The project is on schedule*."
  en.b1.unit05.lesson02.exercise04.reply_what_are_you_responsible_for:
    instruction: "Iemand vraagt waar je verantwoordelijk voor bent op je werk. Zeg dat je verantwoordelijk bent voor het maandelijkse rapport."
    accepted_answers:
      - {value: "I'm responsible for the monthly report.", status: "correct"}
      - {value: "I'm responsible for the monthly report", status: "correct"}
      - {value: "I am responsible for the monthly report.", status: "correct"}
      - {value: "I am responsible for the monthly report", status: "correct"}
    feedback: "*I'm* is de gesproken samentrekking van *I am*."
  en.b1.unit05.lesson02.exercise05.write_behind_schedule:
    instruction: "Schrijf dat je een beetje achter op schema loopt maar vrijdag klaar bent."
    accepted_answers:
      - {value: "I'm a little behind schedule, but I'll finish by Friday.", status: "correct"}
      - {value: "I'm a little behind schedule, but I'll finish by Friday", status: "correct"}
      - {value: "I am a little behind schedule, but I will finish by Friday.", status: "correct"}
      - {value: "I am a little behind schedule, but I will finish by Friday", status: "correct"}
    feedback: "*I'm*/*I'll* zijn de gesproken samentrekkingen van *I am*/*I will*."

  en.b1.unit05.lesson03.exercise01.comprehend_daniels_responsibility:
    instruction: "Waar is Daniel verantwoordelijk voor?"
    correct_option: "the monthly sales report"
    distractors: ["the weekly team meeting", "the yearly budget", "the company website"]
    accepted_answers: [{value: "the monthly sales report", status: "correct"}]
    feedback: "de tekst zegt *the monthly sales report*."
  en.b1.unit05.lesson03.exercise02.comprehend_why_hes_behind:
    instruction: "Waarom loopt Daniel deze week een beetje achter op schema?"
    correct_option: "a technical problem"
    distractors: ["a family emergency", "a scheduling conflict", "a missing report"]
    accepted_answers: [{value: "a technical problem", status: "correct"}]
    feedback: "de tekst zegt *a technical problem*."
  en.b1.unit05.lesson03.exercise03.recognize_team:
    instruction: "Welk woord betekent een groep mensen die samenwerkt?"
    correct_option: "team"
    distractors: ["report", "deadline", "update"]
    accepted_answers: [{value: "team", status: "correct"}]
    feedback: "*team* betekent team."
  en.b1.unit05.lesson03.exercise04.order_he_gives_his_team_update:
    instruction: "Zet de woorden in de juiste volgorde voor «hij geeft zijn team een korte update»."
    accepted_answers: [{value: ["He", "gives", "his", "team", "a", "short", "update"], status: "correct"}]
    feedback: "de juiste volgorde is *He gives his team a short update*."
  en.b1.unit05.lesson03.exercise05.write_daniel_always_tells_truth:
    instruction: "Schrijf dat hij zijn team altijd de waarheid over vertragingen vertelt."
    accepted_answers:
      - {value: "He always tells his team the truth about delays.", status: "correct"}
      - {value: "He always tells his team the truth about delays", status: "correct"}
    feedback: "*He always tells his team the truth about delays* betekent dat hij eerlijk is over vertragingen."

  en.b1.unit05.lesson04.exercise01.listen_what_daniel_asks_for:
    instruction: "Luister naar het gesprek en kies waar Daniel om vraagt."
    correct_option: "help me review this report"
    distractors: ["help me write a new report", "help me plan a meeting", "help me call a client"]
    accepted_answers: [{value: "help me review this report", status: "correct"}]
    feedback: "Daniel vraagt *could you help me review this report*."
  en.b1.unit05.lesson04.exercise02.listen_when_mia_will_check:
    instruction: "Luister en kies wanneer Mia het gaat nakijken."
    correct_option: "this afternoon"
    distractors: ["tomorrow morning", "next week", "right now"]
    accepted_answers: [{value: "this afternoon", status: "correct"}]
    feedback: "Mia zegt *this afternoon*."
  en.b1.unit05.lesson04.exercise03.choose_what_daniel_wants_checked:
    instruction: "Wat wil Daniel dat Mia controleert?"
    correct_option: "the numbers are correct"
    distractors: ["the deadline is correct", "the formatting is correct", "the team is informed"]
    accepted_answers: [{value: "the numbers are correct", status: "correct"}]
    feedback: "Daniel zegt *I want to make sure the numbers are correct*."
  en.b1.unit05.lesson04.exercise04.order_could_you_help_me_review:
    instruction: "Zet de woorden in de juiste volgorde voor «zou je me kunnen helpen dit rapport na te kijken?»."
    accepted_answers: [{value: ["Could", "you", "help", "me", "review", "this", "report"], status: "correct"}]
    feedback: "de juiste volgorde is *Could you help me review this report*."
  en.b1.unit05.lesson04.exercise05.reply_as_mia:
    instruction: "Daniel vraagt: Mia, zou je me kunnen helpen dit rapport na te kijken voordat ik het verstuur? Geef Mia's antwoord: stem toe en vraag waar hij hulp bij nodig heeft."
    accepted_answers:
      - {value: "Of course. What do you need help with?", status: "correct"}
      - {value: "Of course, what do you need help with?", status: "correct"}
    feedback: "*Of course. What do you need help with?* stemt toe en vraagt om verduidelijking."
  en.b1.unit05.lesson04.exercise06.speak_workplace_dialogue:
    instruction: "Daniel zegt: ik wil zeker weten dat de cijfers kloppen. Antwoord hardop als Mia: zeg dat het geen probleem is, dat je het vanmiddag nakijkt, en dat je hem je notities stuurt."
    accepted_answers:
      - {value: "No problem. I'll check it this afternoon and send you my notes.", status: "correct"}
      - {value: "No problem. I will check it this afternoon and send you my notes.", status: "correct"}
    feedback: "*I'll* is de gesproken samentrekking van *I will*."
