  en.a1.unit50.lesson03.teach.dialogue_line2: {title: "De receptionist verwelkomt hen", gloss: "De receptionist zegt: Welkom! Op welke naam staat de reservering?", note: "*What's the name on the reservation?* betekent op welke naam staat de reservering?"}
  en.a1.unit50.lesson03.teach.dialogue_line3: {title: "Leila's antwoord", gloss: "Leila zegt: Hij staat op mijn naam, Leila.", note: "Het Engels zegt it's under my name met be, terwijl het Nederlands staan gebruikt -- het staat op mijn naam, niet is op mijn naam."}
  en.a1.unit50.lesson03.teach.dialogue_line4: {title: "De receptionist geeft de sleutel", gloss: "De receptionist zegt: Perfect. Hier is je sleutel. Jullie kamer heeft twee bedden.", note: "*Your room has two beds.* betekent jullie kamer heeft twee bedden."}
  en.a1.unit50.lesson03.teach.dialogue_line5: {title: "Mia's vraag over wifi", gloss: "Mia vraagt: Heeft de kamer wifi?", note: "Herhaling van de eerder geleerde vraag."}
  en.a1.unit50.lesson03.teach.dialogue_line6: {title: "De receptionist over het ontbijt", gloss: "De receptionist zegt: Ja, en het ontbijt is beneden van zeven tot tien uur.", note: "*from seven to ten* betekent van zeven tot tien uur."}
  en.a1.unit50.lesson03.teach.dialogue_line7: {title: "Leila's vraag over uitchecken", gloss: "Leila zegt: Dank je! Hoe laat is uitchecken?", note: "Herhaling van de eerder geleerde vraag What time is check-out?"}
  en.a1.unit50.lesson03.teach.dialogue_line8: {title: "De receptionist over uitchecken", gloss: "De receptionist zegt: Uitchecken is om elf uur.", note: "*Check-out is at eleven o'clock.* betekent uitchecken is om elf uur."}

  en.a1.unit50.lesson04.teach.reading_passage: {title: "Tekst over een weekend in het gastenhuis", gloss: "Een weekend in het gastenhuis: Mia en Leila maakten een kort reisje naar de bergen voor het weekend. Mia houdt van foto's maken, en Leila houdt van schilderen, dus het was de perfecte plek om te ontspannen. Toen ze bij het gastenhuis aankwamen, vertelden ze de receptionist dat ze een reservering hadden voor twee nachten, van 14 tot 16 november. De receptionist vroeg op welke naam de reservering stond, en Leila zei dat hij op haar naam stond. Hun kamer had twee bedden en wifi, en het ontbijt was elke ochtend inbegrepen van zeven tot tien uur. Uitchecken was om elf uur. Mia maakte veel foto's van de bergen, en Leila schilderde een klein schilderij van het uitzicht vanuit hun raam. Daniel bleef die het weekend thuis en kookte voor zichzelf, met een recept uit het kookboek dat hij bij de bibliotheek leende. Toen Mia en Leila terugkwamen, lieten ze hem hun foto's en het schilderij zien, en hij vond ze prachtig.", note: "*Their room had two beds and wifi* betekent hun kamer had twee bedden en wifi."}

