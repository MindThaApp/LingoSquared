teaching:
  en.b1.unit19.lesson01.teach.main_point: {title: "main point", gloss: "hoofdpunt", note: "*main point* betekent het enige belangrijkste idee in een tekst of gesprek.", example_gloss: "Het hoofdpunt van de vergadering was het budget."}
  en.b1.unit19.lesson01.teach.detail: {title: "detail", gloss: "detail", note: "*detail* betekent een klein stukje extra informatie dat het hoofdpunt ondersteunt.", example_gloss: "Mia voegde één klein detail toe over het schema."}
  en.b1.unit19.lesson01.teach.in_summary: {title: "in summary", gloss: "samenvattend", note: "*in summary* introduceert een verkorte samenvatting aan het einde van een langere uitleg.", example_gloss: "Samenvattend, het project zal volgende maand klaar zijn."}
  en.b1.unit19.lesson01.teach.in_short: {title: "in short", gloss: "kortom", note: "*in short* is een snelle, informele manier om meteen ter zake te komen in een gesprek.", example_gloss: "Kortom, het team was het eens over het plan."}
  en.b1.unit19.lesson01.teach.in_your_own_words: {title: "in your own words", gloss: "in je eigen woorden", note: "*in your own words* vraagt om een uitleg die de oorspronkelijke tekst niet gewoon overneemt.", example_gloss: "Leg het plan uit in je eigen woorden."}

  en.b1.unit19.lesson02.teach.in_summary_budget_client: {title: "In summary, ... (samenvatting geven)", gloss: "Samenvattend, de vergadering behandelde het budget en de nieuwe klant.", note: "*In summary, the meeting covered...* opent een korte, verkorte samenvatting van wat er is besproken."}
  en.b1.unit19.lesson02.teach.main_point_under_budget: {title: "The main point was that ... (hoofdpunt geven)", gloss: "Het hoofdpunt was dat we deze maand onder het budget zitten.", note: "*The main point was that...* geeft het enige belangrijkste idee, apart van kleinere details."}
  en.b1.unit19.lesson02.teach.grammar_summary_structure: {title: "de structuur van een samenvatting", gloss: "Begin een samenvatting met een uitdrukking zoals In summary of In short, en geef daarna alleen de hoofdpunten in volgorde, in een korte zin. Gebruik The main point was that... om het enige belangrijkste idee te benadrukken, apart van kleinere details.", note: "vorm: begin met In summary/In short, en gebruik The main point was that... voor het hoofdpunt."}

  en.b1.unit19.lesson03.teach.condensed: {title: "condensed", gloss: "verkort", note: "*condensed* beschrijft een samenvatting die korter is gemaakt, maar de hoofdpunten behoudt.", example_gloss: "Mia gaf Daniel een verkorte samenvatting van de vergadering."}
  en.b1.unit19.lesson03.teach.original_article: {title: "original article", gloss: "oorspronkelijke artikel", note: "*original article* betekent de volledige, oorspronkelijke tekst voordat deze werd samengevat.", example_gloss: "Leila's samenvatting kwam goed overeen met het oorspronkelijke artikel."}
  en.b1.unit19.lesson03.teach.reading_passage: {title: "leestekst: een kort artikel samenvatten", gloss: "Leila las een lang artikel over communicatie op de werkvloer voor haar designcursus. Het oorspronkelijke artikel had veel voorbeelden en achtergrondinformatie, maar Leila had alleen de hoofdpunten nodig. In haar eigen woorden schreef ze een verkorte samenvatting: communicatie op de werkvloer werkt het beste wanneer berichten duidelijk en kort zijn, en wanneer mensen vragen stellen in plaats van te gokken. Ze liet de meeste voorbeelden weg, omdat het details waren, geen hoofdpunten. Haar docent zei dat de samenvatting de belangrijke ideeën in de juiste volgorde hield.", note: "een korte leestekst op B1-niveau."}

  en.b1.unit19.lesson04.teach.q_missed_meeting: {title: "Daniel vraagt om uitleg", gloss: "Daniel zegt: ik heb de vergadering gemist. Kun je me vertellen wat er is gebeurd?", note: "een open vraag om een samenvatting te vragen."}
  en.b1.unit19.lesson04.teach.a_in_short_budget_client: {title: "Mia geeft een korte samenvatting", gloss: "Mia zegt: natuurlijk. Kortom, we hebben het gehad over het budget en de nieuwe klant.", note: "*in short* opent een snelle, informele samenvatting."}
  en.b1.unit19.lesson04.teach.q_main_point_budget: {title: "Daniel vraagt naar het hoofdpunt", gloss: "Daniel zegt: wat was het hoofdpunt over het budget?", note: "een gerichte vraag naar het hoofdpunt."}
  en.b1.unit19.lesson04.teach.a_under_budget_this_month: {title: "Mia geeft het hoofdpunt", gloss: "Mia zegt: het hoofdpunt was dat we deze maand onder het budget zitten.", note: "*the main point was that...* benadrukt het belangrijkste idee."}
  en.b1.unit19.lesson04.teach.q_other_details: {title: "Daniel vraagt naar details", gloss: "Daniel zegt: goed. Waren er nog andere details?", note: "een vervolgvraag naar kleinere details."}
  en.b1.unit19.lesson04.teach.a_client_meeting_moved: {title: "Mia noemt een klein detail", gloss: "Mia zegt: nog één klein detail -- de klantafspraak is verplaatst naar volgende week.", note: "*just one small detail* introduceert een klein, ondersteunend feit."}
  en.b1.unit19.lesson04.teach.q_thanks_for_summary: {title: "Daniel bedankt Mia", gloss: "Daniel zegt: bedankt voor de samenvatting. Dat is erg nuttig.", note: "een korte, waarderende afsluiting van het gesprek."}

