course:
  title: "Engels B1"
  description: >-
    Engels leren op B1-niveau voor alledaagse gesprekken over verplichtingen,
    mogelijkheden, hypothetische situaties en verhalen, met gedetailleerde
    uitleg in het Nederlands.

units:
  en.b1.unit06.narrative: {title: "Het verhaal van de lekke band"}

lessons:
  en.b1.unit06.lesson01.narrative_vocabulary: {title: "While, flat tire en stranger"}
  en.b1.unit06.lesson02.sequencing_with_while_and_when: {title: "While I was driving, when I pulled over"}
  en.b1.unit06.lesson03.reading_the_flat_tire_story: {title: "Lezen: het verhaal van de lekke band"}
  en.b1.unit06.lesson04.telling_daniel_the_story: {title: "You're late! What happened?"}

teaching:
  en.b1.unit06.lesson01.teach.while: {title: "while", gloss: "terwijl", note: "*while* betekent op hetzelfde moment dat iets anders gebeurt.", example_gloss: "Terwijl ik reed, begon het te regenen."}
  en.b1.unit06.lesson01.teach.flat_tire: {title: "flat tire", gloss: "lekke band", note: "*flat tire* betekent een band zonder lucht, die niet meer werkt.", example_gloss: "Mijn band was lek op de snelweg."}
  en.b1.unit06.lesson01.teach.pull_over: {title: "pull over", gloss: "aan de kant gaan staan", note: "*pull over* betekent je auto aan de kant van de weg stilzetten.", example_gloss: "Ik moest meteen aan de kant gaan staan."}
  en.b1.unit06.lesson01.teach.stranger: {title: "stranger", gloss: "vreemdeling, onbekende", note: "*stranger* betekent iemand die je niet kent.", example_gloss: "Een vreemdeling stopte om me te helpen."}
  en.b1.unit06.lesson01.teach.mechanic: {title: "mechanic", gloss: "monteur", note: "*mechanic* betekent iemand die auto's repareert.", example_gloss: "De monteur repareerde mijn band snel."}
  en.b1.unit06.lesson01.teach.said_that: {title: "said that", gloss: "zei dat", note: "*said that* gebruik je om te vertellen wat iemand anders zei.", example_gloss: "Hij zei dat hij kon helpen."}

  en.b1.unit06.lesson02.teach.while_driving_tire_went_flat: {title: "achtergrondgebeurtenis met 'while'", gloss: "Terwijl ik naar mijn werk reed, werd mijn band lek.", note: "*while + verleden tijd met -ing* geeft de achtergrondgebeurtenis aan die door iets anders onderbroken wordt."}
  en.b1.unit06.lesson02.teach.when_pulled_over_stranger_helped: {title: "volgende gebeurtenis met 'when'", gloss: "Toen ik aan de kant ging staan, stopte een vreemdeling om te helpen.", note: "*when* introduceert de volgende gebeurtenis in het verhaal."}
  en.b1.unit06.lesson02.teach.grammar_while_when_sequencing: {title: "while versus when in een verhaal", gloss: "Terwijl ik reed, werd mijn band lek. Toen ik aan de kant ging staan, hielp een vreemdeling me.", note: "*while* markeert de achtergrond (een lopende actie); *when* markeert het volgende, kortere moment dat daarin gebeurt."}

  en.b1.unit06.lesson03.teach.had_already_called: {title: "had already called", gloss: "had al gebeld", note: "*had already* + voltooid deelwoord beschrijft iets dat al gebeurd was vóór een ander moment in het verleden.", example_gloss: "Tegen de tijd dat hij aankwam, had ik Daniel al gebeld."}
  en.b1.unit06.lesson03.teach.kept_his_word: {title: "kept his word", gloss: "hield zich aan zijn woord", note: "*kept his word* betekent dat iemand deed wat hij beloofd had.", example_gloss: "Hij hield zich aan zijn woord en repareerde het in tien minuten."}
  en.b1.unit06.lesson03.teach.reading_passage: {title: "leestekst: het verhaal van de lekke band", gloss: "Gisterochtend, terwijl Leila naar haar werk reed, werd haar band plotseling lek. Ze ging aan de kant staan op een rustige straat. Een vreemdeling stopte zijn auto en bood aan te helpen. Tegen de tijd dat de monteur aankwam, had Leila Daniel al gebeld om te zeggen dat ze laat zou zijn. De monteur zei dat hij de band in tien minuten kon repareren. Hij hield zich aan zijn woord, en Leila kwam maar twintig minuten te laat op haar werk aan.", note: "een verhaal in de verleden tijd met achtergrondgebeurtenis (*while*), volgorde (*when*), en iets dat al eerder gebeurd was (*had already*) -- B1-niveau."}

  en.b1.unit06.lesson04.teach.q_youre_late_what_happened: {title: "Daniel merkt op dat Leila laat is", gloss: "Daniel zegt: je bent laat! Wat is er gebeurd?", note: "een directe, bezorgde vraag om het verhaal te starten."}
  en.b1.unit06.lesson04.teach.a_tire_went_flat_suddenly: {title: "Leila begint haar verhaal", gloss: "Leila zegt: terwijl ik naar mijn werk reed, werd mijn band plotseling lek.", note: "*while* markeert de achtergrondgebeurtenis waarin iets anders gebeurde."}
  en.b1.unit06.lesson04.teach.q_oh_no_what_did_you_do: {title: "Daniel vraagt door", gloss: "Daniel zegt: oh nee! Wat heb je gedaan?", note: "een korte vervolgvraag om het verhaal verder te horen."}
  en.b1.unit06.lesson04.teach.a_pulled_over_stranger_helped: {title: "Leila vervolgt het verhaal", gloss: "Leila zegt: ik ging aan de kant staan, en een vreemdeling stopte om me te helpen.", note: "het volgende moment in het verhaal, na de achtergrondgebeurtenis."}
  en.b1.unit06.lesson04.teach.q_kind_of_him_call_mechanic: {title: "Daniel reageert en vraagt door", gloss: "Daniel zegt: dat was aardig van hem. Heb je een monteur gebeld?", note: "*that was kind of him* is een natuurlijke reactie op iemands vriendelijkheid."}
  en.b1.unit06.lesson04.teach.a_had_already_called_mechanic_said: {title: "Leila sluit het verhaal af", gloss: "Leila zegt: ja, ik had er al een gebeld voordat hij aankwam. De monteur zei dat hij het in tien minuten kon repareren, en dat deed hij!", note: "*had already called* laat zien wat er al gebeurd was vóórdat de vreemdeling aankwam."}

exercises:
  en.b1.unit06.lesson01.exercise01.listen_word:
    instruction: "Luister en kies het woord dat gezegd wordt."
    correct_option: "stranger"
    distractors: ["mechanic", "flat tire", "pull over"]
    accepted_answers: [{value: "stranger", status: "correct"}]
    feedback: "*stranger* betekent vreemdeling."
  en.b1.unit06.lesson01.exercise02.choose_stop_car_phrase:
    instruction: "Welke uitdrukking betekent je auto aan de kant van de weg stilzetten?"
    correct_option: "pull over"
    distractors: ["flat tire", "stranger", "said that"]
    accepted_answers: [{value: "pull over", status: "correct"}]
    feedback: "*pull over* betekent aan de kant gaan staan."
  en.b1.unit06.lesson01.exercise03.choose_someone_you_dont_know_word:
    instruction: "Welk woord betekent iemand die je niet kent?"
    correct_option: "stranger"
    distractors: ["mechanic", "pull over", "while"]
    accepted_answers: [{value: "stranger", status: "correct"}]
    feedback: "*stranger* betekent vreemdeling."
  en.b1.unit06.lesson01.exercise04.match_narrative_words:
    instruction: "Verbind elk Engels woord of elke Engelse uitdrukking met de juiste Nederlandse omschrijving."
    pairs:
      - {left: "while", right: "terwijl"}
      - {left: "flat tire", right: "lekke band"}
      - {left: "pull over", right: "aan de kant gaan staan"}
      - {left: "stranger", right: "vreemdeling, onbekende"}
      - {left: "mechanic", right: "monteur"}
      - {left: "said that", right: "zei dat"}
    accepted_answers:
      - value:
          - {left: "while", right: "terwijl"}
          - {left: "flat tire", right: "lekke band"}
          - {left: "pull over", right: "aan de kant gaan staan"}
          - {left: "stranger", right: "vreemdeling, onbekende"}
          - {left: "mechanic", right: "monteur"}
          - {left: "said that", right: "zei dat"}
        status: "correct"
    feedback: "*while*=terwijl, *flat tire*=lekke band, *pull over*=aan de kant gaan staan, *stranger*=vreemdeling, *mechanic*=monteur, *said that*=zei dat."
  en.b1.unit06.lesson01.exercise05.write_mechanic:
    instruction: "Schrijf het woord voor iemand die auto's repareert."
    accepted_answers:
      - {value: "mechanic", status: "correct"}
      - {value: "Mechanic", status: "correct"}
    feedback: "*mechanic* betekent monteur."

  en.b1.unit06.lesson02.exercise01.choose_background_action:
    instruction: "Welke zin gebruikt \"while\" om een achtergrondgebeurtenis aan te geven die door iets anders onderbroken wordt?"
    correct_option: "While I was driving to work, my tire went flat."
    distractors: ["When I pulled over, a stranger stopped to help.", "The mechanic fixed my tire quickly.", "I had to pull over immediately."]
    accepted_answers: [{value: "While I was driving to work, my tire went flat.", status: "correct"}]
    feedback: "*while + verleden tijd met -ing* geeft de achtergrondgebeurtenis aan."
  en.b1.unit06.lesson02.exercise02.choose_when_sentence:
    instruction: "Welke zin gebruikt \"when\" om het volgende moment in het verhaal te introduceren?"
    correct_option: "When I pulled over, a stranger stopped to help."
    distractors: ["While I was driving to work, my tire went flat.", "A stranger stopped to help me.", "I pulled over on a quiet street."]
    accepted_answers: [{value: "When I pulled over, a stranger stopped to help.", status: "correct"}]
    feedback: "*when* introduceert het volgende moment in het verhaal."
  en.b1.unit06.lesson02.exercise03.order_while_driving_tire_went_flat:
    instruction: "Zet de woorden in de juiste volgorde voor «terwijl ik naar mijn werk reed, werd mijn band lek»."
    accepted_answers: [{value: ["While", "I", "was", "driving", "to", "work", "my", "tire", "went", "flat"], status: "correct"}]
    feedback: "de juiste volgorde is *While I was driving to work, my tire went flat*."
  en.b1.unit06.lesson02.exercise04.reply_what_happened:
    instruction: "Iemand vraagt wat er onderweg naar je werk gebeurde. Zeg dat je band lek werd terwijl je naar je werk reed."
    accepted_answers:
      - {value: "While I was driving to work, my tire went flat.", status: "correct"}
      - {value: "While I was driving to work, my tire went flat", status: "correct"}
    feedback: "*While I was driving to work, my tire went flat* betekent dat je band lek werd terwijl je reed."
  en.b1.unit06.lesson02.exercise05.write_when_pulled_over:
    instruction: "Schrijf dat toen je aan de kant ging staan, een vreemdeling stopte om te helpen."
    accepted_answers:
      - {value: "When I pulled over, a stranger stopped to help.", status: "correct"}
      - {value: "When I pulled over, a stranger stopped to help", status: "correct"}
    feedback: "*When I pulled over, a stranger stopped to help* betekent dat een vreemdeling stopte om te helpen."

  en.b1.unit06.lesson03.exercise01.comprehend_what_happened_first:
    instruction: "Wat gebeurde terwijl Leila naar haar werk reed?"
    correct_option: "her tire suddenly went flat"
    distractors: ["she ran out of gas", "her car broke down completely", "she got lost"]
    accepted_answers: [{value: "her tire suddenly went flat", status: "correct"}]
    feedback: "de tekst zegt *her tire suddenly went flat*."
  en.b1.unit06.lesson03.exercise02.comprehend_what_mechanic_said:
    instruction: "Wat zei de monteur?"
    correct_option: "he could fix the tire in ten minutes"
    distractors: ["he could not fix the tire today", "he needed a new tire", "he would arrive in an hour"]
    accepted_answers: [{value: "he could fix the tire in ten minutes", status: "correct"}]
    feedback: "de tekst zegt *he could fix the tire in ten minutes*."
  en.b1.unit06.lesson03.exercise03.recognize_had_already:
    instruction: "Welke uitdrukking beschrijft iets dat al gebeurd was vóór een ander moment in het verleden?"
    correct_option: "had already called"
    distractors: ["pull over", "kept his word", "flat tire"]
    accepted_answers: [{value: "had already called", status: "correct"}]
    feedback: "*had already* + voltooid deelwoord beschrijft iets dat al eerder gebeurd was."
  en.b1.unit06.lesson03.exercise04.order_stranger_offered_to_help:
    instruction: "Zet de woorden in de juiste volgorde voor «een vreemdeling stopte zijn auto en bood aan te helpen»."
    accepted_answers: [{value: ["A", "stranger", "stopped", "his", "car", "and", "offered", "to", "help"], status: "correct"}]
    feedback: "de juiste volgorde is *A stranger stopped his car and offered to help*."
  en.b1.unit06.lesson03.exercise05.write_he_kept_his_word:
    instruction: "Schrijf dat hij zich aan zijn woord hield."
    accepted_answers:
      - {value: "He kept his word.", status: "correct"}
      - {value: "He kept his word", status: "correct"}
    feedback: "*He kept his word* betekent dat hij deed wat hij beloofd had."

  en.b1.unit06.lesson04.exercise01.listen_what_happened_to_leila:
    instruction: "Luister naar het gesprek en kies wat er met Leila gebeurde."
    correct_option: "my tire suddenly went flat"
    distractors: ["my car ran out of gas", "my car wouldn't start", "I got lost on the way"]
    accepted_answers: [{value: "my tire suddenly went flat", status: "correct"}]
    feedback: "Leila zegt *my tire suddenly went flat*."
  en.b1.unit06.lesson04.exercise02.listen_who_helped_leila:
    instruction: "Luister en kies wie Leila hielp."
    correct_option: "a stranger stopped to help me"
    distractors: ["Daniel came to help me", "a mechanic happened to be driving by", "no one stopped to help me"]
    accepted_answers: [{value: "a stranger stopped to help me", status: "correct"}]
    feedback: "Leila zegt *a stranger stopped to help me*."
  en.b1.unit06.lesson04.exercise03.choose_what_mechanic_said:
    instruction: "Wat zei de monteur dat hij kon doen?"
    correct_option: "he could fix it in ten minutes"
    distractors: ["he could not fix it today", "he could tow the car instead", "he could come back tomorrow"]
    accepted_answers: [{value: "he could fix it in ten minutes", status: "correct"}]
    feedback: "de monteur zei *he could fix it in ten minutes*."
  en.b1.unit06.lesson04.exercise04.order_youre_late_what_happened:
    instruction: "Zet de woorden in de juiste volgorde voor «je bent laat! wat is er gebeurd?»."
    accepted_answers: [{value: ["You're", "late", "What", "happened"], status: "correct"}]
    feedback: "de juiste volgorde is *You're late! What happened?*."
  en.b1.unit06.lesson04.exercise05.reply_as_leila:
    instruction: "Daniel zegt: je bent laat! Wat is er gebeurd? Geef Leila's antwoord: zeg dat je band plotseling lek werd terwijl je naar je werk reed."
    accepted_answers:
      - {value: "While I was driving to work, my tire suddenly went flat.", status: "correct"}
      - {value: "While I was driving to work, my tire suddenly went flat", status: "correct"}
    feedback: "*While I was driving to work, my tire suddenly went flat* legt de achtergrondgebeurtenis uit."
  en.b1.unit06.lesson04.exercise06.speak_narrative_dialogue:
    instruction: "Daniel zegt: dat was aardig van hem. Heb je een monteur gebeld? Antwoord hardop als Leila: zeg dat je er al een had gebeld voordat hij aankwam, dat de monteur zei dat hij het in tien minuten kon repareren, en dat hij dat ook deed."
    accepted_answers:
      - {value: "Yes, I had already called one before he arrived. The mechanic said that he could fix it in ten minutes, and he did!", status: "correct"}
      - {value: "Yes, I'd already called one before he arrived. The mechanic said that he could fix it in ten minutes, and he did!", status: "correct"}
    feedback: "dit antwoord combineert *had already called* (al eerder gebeurd) met wat de monteur zei en beloofde te doen -- *I'd* is de gesproken samentrekking van *I had*."
