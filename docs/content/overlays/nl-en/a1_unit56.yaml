  en.a1.unit56.lesson02.teach.is_this_table_free: {title: "Is this table free?", gloss: "Is deze tafel vrij?", note: "free betekent hier vrij/onbezet -- hetzelfde woord als het Nederlandse vrij."}
  en.a1.unit56.lesson02.teach.can_i_order_now: {title: "Can I order now?", gloss: "Kan ik nu bestellen?", note: "Can I...? is een directe manier om iets te vragen -- minder formeel dan could."}
  en.a1.unit56.lesson02.teach.id_like_the_salad: {title: "I'd like the salad, please.", gloss: "Ik wil graag de salade, alstublieft.", note: "I'd like (samentrekking van I would like) is de beleefde manier om te bestellen."}
  en.a1.unit56.lesson02.teach.how_much_is_the_salad: {title: "How much is the salad?", gloss: "Hoeveel kost de salade?", note: "How much is...? vraagt naar de prijs."}
  en.a1.unit56.lesson02.teach.could_we_have_the_bill: {title: "Could we have the bill, please?", gloss: "Mogen we de rekening, alstublieft?", note: "Could we have...? gebruikt het beleefde could -- een Nederlandse spreker kiest hiervoor vaak mogen (Mogen we de rekening?) in plaats van een voorwaardelijke vorm van kunnen; could is hier het natuurlijke, beleefde Engelse equivalent."}
  en.a1.unit56.lesson02.teach.enjoy_your_meal: {title: "Enjoy your meal!", gloss: "Eet smakelijk!", note: "Enjoy your meal! is een vaste uitdrukking die een ober zegt voordat je begint te eten -- letterlijk 'geniet van uw maaltijd', maar het Nederlandse equivalent Eet smakelijk! is helemaal anders opgebouwd (een gebiedende wijs plus het bijwoord smakelijk, zonder bezittelijk voornaamwoord). Leer deze zin als één geheel, niet woord voor woord."}

  en.a1.unit56.lesson03.teach.dialogue_line1: {title: "Leila vraagt naar de tafel", gloss: "Leila zegt: Hoi! Is deze tafel vrij?", note: "Is this table free? gebruikt free voor vrij/onbezet."}
  en.a1.unit56.lesson03.teach.dialogue_line2: {title: "De ober wijst een tafel aan", gloss: "De Ober zegt: Ja, gaat u hier maar zitten.", note: "please sit here is een korte, beleefde uitnodiging."}
  en.a1.unit56.lesson03.teach.dialogue_line3: {title: "Mia vraagt naar de menukaart", gloss: "Mia zegt: Mag ik de menukaart zien, alstublieft?", note: "Could I see...? -- opnieuw het beleefde could, net als bij could we have the bill."}
  en.a1.unit56.lesson03.teach.dialogue_line4: {title: "De ober geeft de menukaart", gloss: "De Ober zegt: Natuurlijk, alstublieft.", note: "Of course, here you are is een vaste manier om iets aan te reiken."}
  en.a1.unit56.lesson03.teach.dialogue_line5: {title: "Leila's bestelling", gloss: "Leila zegt: Ik wil graag de kip, alstublieft.", note: "Eén apart feit: Leila's bestelling is kip."}
  en.a1.unit56.lesson03.teach.dialogue_line6: {title: "Mia's bestelling", gloss: "Mia zegt: Ik wil graag de salade, alstublieft.", note: "Eén apart feit: Mia's bestelling is salade."}
  en.a1.unit56.lesson03.teach.dialogue_line7: {title: "De ober wenst smakelijk eten", gloss: "De Ober zegt: Goede keuze! Eet smakelijk!", note: "Enjoy your meal! -- de vaste afsluitende zin voordat de gasten beginnen te eten."}
  en.a1.unit56.lesson03.teach.dialogue_line8: {title: "Leila vraagt naar de prijs van de kip", gloss: "Leila zegt: Hoeveel kost de kip?", note: "How much is...? vraagt naar de prijs."}
  en.a1.unit56.lesson03.teach.dialogue_line9: {title: "De prijs van de kip", gloss: "De Ober zegt: De kip is twaalf dollar.", note: "Eén apart feit: de prijs van de kip, los van de salade en de totale rekening."}
  en.a1.unit56.lesson03.teach.dialogue_line10: {title: "Mia vraagt naar de prijs van de salade", gloss: "Mia zegt: Hoeveel kost de salade?", note: "How much is...? -- dezelfde vraagvorm als bij de kip."}
  en.a1.unit56.lesson03.teach.dialogue_line11: {title: "De prijs van de salade", gloss: "De Ober zegt: De salade is zeven dollar.", note: "Een tweede apart feit: de prijs van de salade."}
  en.a1.unit56.lesson03.teach.dialogue_line12: {title: "Leila vraagt om de rekening", gloss: "Leila zegt: Mogen we de rekening, alstublieft?", note: "Could we have...? -- het beleefde could opnieuw."}
  en.a1.unit56.lesson03.teach.dialogue_line13: {title: "De totale rekening", gloss: "De Ober zegt: Dat is negentien dollar, alstublieft.", note: "Een derde apart feit: de totale rekening, anders dan de losse prijzen van kip en salade."}

  en.a1.unit56.lesson04.teach.restaurant_menu: {title: "Menukaart", gloss: "Restaurantmenu: Kip - $12. Salade - $7. Pizza - $10. Sap - $3.", note: "De menukaart toont vier gerechten met hun prijzen."}
  en.a1.unit56.lesson04.teach.reading_passage: {title: "Tekst: Een maaltijd in het restaurant", gloss: "Op een avond besloten Leila en Mia een nieuw restaurant in het centrum te proberen. Een ober bracht hen naar een tafel bij het raam. Hij bracht hen een menukaart met kip, salade, pizza en sap. Leila bestelde de kip, en Mia bestelde de salade. De kip was twaalf dollar, en de salade was zeven dollar. Terwijl ze aten, praatten ze over Mia's fotografieles. Toen ze klaar waren, bracht de ober de rekening. Het was negentien dollar voor hen beiden. Leila zei dat het restaurant uitstekend was, en Mia zei dat ze Daniel de volgende keer mee wil nemen.", note: "*ordered* is de verleden tijd van order (bestellen)."}

exercises:
