  notes: >-
    Draft only. Overlay against the shared en/a1_unit56_restaurant.yaml
    realization (itself still unreviewed). This unit had NO overlay in any
    direction (nl-en/fa-en/prs-en) before this file -- it was an orphaned
    realization, authored but unreachable by any learner. Two contrastive
    points, deliberately different from the ones already used elsewhere in
    this direction: (1) English "Could I see the menu, please?" uses the
    conditional modal could for a polite request, while Dutch typically
    reaches for mogen (Mag ik de menukaart zien?) rather than a conditional
    form of kunnen -- a Dutch speaker's likely instinct is to overuse the
    more direct "Can I..." in English where native speakers in a
    restaurant setting would more naturally soften it with could, so this
    is flagged on both menu-request teaching cards and the dialogue's own
    menu-request line; (2) "Enjoy your meal!" is a fixed social formula
    the waiter says before the guests eat, structurally unlike its closest
    Dutch equivalent, Eet smakelijk! (literally "eat tastily," an
    imperative + adverb, with no possessive object at all) -- English
    instead uses a transitive verb (enjoy) plus a possessive object (your
    meal), so a word-for-word translation attempt in either direction
    breaks down; flagged as a whole-phrase formula to memorize, not to
    build word by word. No sibling-direction overlay exists for this unit
    in any language (confirmed via a fresh ls of docs/content/overlays/
    {nl-en,fa-en,prs-en}/ before authoring), so there was nothing to
    isolate from, but this file was still drafted entirely independently
    from the target realization and universal spine, per the standing
    rule. Followed the realization's own explicit same-speaker-distractor
    guidance for lesson03's chicken/salad/total-bill questions -- each is
    its own single-fact Waiter turn, so cross-distracting between them is
    safe per the realization's own analysis, and was used that way here.
    Every kind:vocabulary teaching card's example_gloss is a faithful
    Dutch translation of the realization's own example sentence;
    lesson02/03/04 cards carry no example_gloss since their realization
    counterparts declare no example (phrase/dialogue/reading cards are
    exempt per AUTHORING_GUIDE.md #19). Needs the mandatory fresh-context
    review before shipping.

