course:
  title: "Engels B1"
  description: >-
    Engels leren op B1-niveau voor alledaagse gesprekken over verplichtingen,
    mogelijkheden, hypothetische situaties en verhalen, met gedetailleerde
    uitleg in het Nederlands.

units:
  en.b1.unit03.hypotheticals: {title: "Als het regent, als ik tijd had gehad"}

lessons:
  en.b1.unit03.lesson01.conditional_vocabulary: {title: "If, rain en free time"}
  en.b1.unit03.lesson02.real_conditions: {title: "If it rains, we will stay home"}
  en.b1.unit03.lesson03.reading_more_free_time: {title: "Lezen: if she had more free time"}
  en.b1.unit03.lesson04.the_weekend_plans_dialogue: {title: "If there's another one, you should join"}

teaching:
  en.b1.unit03.lesson01.teach.if: {title: "if", gloss: "als", note: "*if* introduceert een voorwaarde.", example_gloss: "Als het regent, blijven we thuis."}
  en.b1.unit03.lesson01.teach.rain: {title: "rain", gloss: "regen(en)", note: "*rain* betekent water dat uit de lucht valt.", example_gloss: "Het gaat dit weekend misschien regenen."}
  en.b1.unit03.lesson01.teach.stay_home: {title: "stay home", gloss: "thuisblijven", note: "*stay home* betekent niet naar buiten gaan, in huis blijven.", example_gloss: "Als het regent, blijven we thuis."}
  en.b1.unit03.lesson01.teach.weekend: {title: "weekend", gloss: "weekend", note: "*weekend* betekent zaterdag en zondag.", example_gloss: "Wat zijn je plannen voor het weekend?"}
  en.b1.unit03.lesson01.teach.free_time: {title: "free time", gloss: "vrije tijd", note: "*free time* betekent uren waarin je niet werkt of het druk hebt.", example_gloss: "Ik heb tegenwoordig niet veel vrije tijd."}
  en.b1.unit03.lesson01.teach.paint: {title: "paint", gloss: "schilderen", note: "*paint* betekent een tekening met kleur maken.", example_gloss: "Leila schildert graag in het weekend."}

  en.b1.unit03.lesson02.teach.if_rains_stay_home: {title: "een reële voorwaarde in de toekomst", gloss: "Als het morgen regent, blijven we thuis.", note: "*if + present, will + basisvorm* drukt een reële, mogelijke voorwaarde in de toekomst uit."}
  en.b1.unit03.lesson02.teach.if_have_free_time_paint: {title: "nog een reële voorwaarde", gloss: "Als ik dit weekend vrije tijd heb, ga ik schilderen.", note: "dezelfde constructie: *if + present, will + basisvorm*."}
  en.b1.unit03.lesson02.teach.grammar_real_condition: {title: "reële voorwaarden", gloss: "Als het regent, blijven we thuis. Als ik tijd heb, ga ik schilderen.", note: "in het Engels gebruik je de tegenwoordige tijd na *if*, ook al gaat het over de toekomst -- niet *will rain*."}

  en.b1.unit03.lesson03.teach.would: {title: "would", gloss: "zou", note: "*would* + basisvorm drukt een onwerkelijke of hypothetische situatie in het heden uit.", example_gloss: "Als ik meer tijd had, zou ik elke dag schilderen."}
  en.b1.unit03.lesson03.teach.class: {title: "class", gloss: "les, cursus", note: "*class* betekent een georganiseerde les met een docent.", example_gloss: "Er was een schilderles bij haar in de buurt."}
  en.b1.unit03.lesson03.teach.reading_passage: {title: "leestekst: als ze meer vrije tijd had", gloss: "Leila schildert graag, maar ze heeft niet veel vrije tijd. Als ze meer vrije tijd had, zou ze elke dag schilderen. Vorige maand was er een schilderles bij haar in de buurt. Als ze dat eerder had geweten, had ze zich ingeschreven. Nu kijkt ze elke week naar nieuwe lessen.", note: "een korte leestekst met zowel een onwerkelijke situatie in het heden als een onwerkelijke situatie in het verleden -- B1-niveau."}

  en.b1.unit03.lesson04.teach.q_weekend_plans: {title: "Daniel vraagt naar het weekend", gloss: "Daniel zegt: wat zijn je plannen voor het weekend?", note: "een gewone, open vraag om een gesprek te beginnen."}
  en.b1.unit03.lesson04.teach.a_walk_or_stay_home: {title: "Leila's plannen, afhankelijk van het weer", gloss: "Leila zegt: als het niet regent, ga ik wandelen. Als het regent, blijf ik thuis en ga ik schilderen.", note: "twee reële voorwaarden na elkaar, afhankelijk van het weer."}
  en.b1.unit03.lesson04.teach.q_take_class: {title: "Daniel vraagt naar de schilderles", gloss: "Daniel zegt: dat klinkt leuk. Heb je die schilderles vorige maand gevolgd?", note: "een vervolgvraag over iets uit het verleden."}
  en.b1.unit03.lesson04.teach.a_would_have_signed_up: {title: "Leila's spijt over het verleden", gloss: "Leila zegt: nee, niet gedaan. Als ik dat eerder had geweten, had ik me ingeschreven.", note: "*if + past perfect, would have + voltooid deelwoord* drukt spijt uit over het verleden."}
  en.b1.unit03.lesson04.teach.q_should_join: {title: "Daniel geeft een aanbeveling", gloss: "Daniel zegt: dat is jammer. Als er nog een keer is, moet je meedoen.", note: "Daniel gebruikt *should* om Leila aan te moedigen een nieuwe kans te grijpen."}
  en.b1.unit03.lesson04.teach.a_will_sign_up: {title: "Leila neemt zich iets voor", gloss: "Leila zegt: je hebt gelijk. Als ik er een zie, schrijf ik me meteen in.", note: "een nieuwe reële voorwaarde over de toekomst, geen hypothetische meer."}

exercises:
  en.b1.unit03.lesson01.exercise01.listen_word:
    instruction: "Luister en kies het woord dat gezegd wordt."
    correct_option: "weekend"
    distractors: ["rain", "paint", "free time"]
    accepted_answers: [{value: "weekend", status: "correct"}]
    feedback: "*weekend* betekent weekend."
  en.b1.unit03.lesson01.exercise02.choose_water_from_sky_word:
    instruction: "Welk woord betekent water dat uit de lucht valt?"
    correct_option: "rain"
    distractors: ["weekend", "stay home", "paint"]
    accepted_answers: [{value: "rain", status: "correct"}]
    feedback: "*rain* betekent regen."
  en.b1.unit03.lesson01.exercise03.choose_hours_not_working_phrase:
    instruction: "Welke uitdrukking betekent uren waarin je niet werkt of het druk hebt?"
    correct_option: "free time"
    distractors: ["weekend", "stay home", "if"]
    accepted_answers: [{value: "free time", status: "correct"}]
    feedback: "*free time* betekent vrije tijd."
  en.b1.unit03.lesson01.exercise04.match_conditional_words:
    instruction: "Verbind elke betekenis met het juiste Engelse woord of de juiste uitdrukking."
    accepted_answers:
      - value:
          - {left: "introduces a condition", right: "if"}
          - {left: "water falling from the sky", right: "rain"}
          - {left: "to not go out, to remain in your house", right: "stay home"}
          - {left: "Saturday and Sunday", right: "weekend"}
          - {left: "hours when you are not working or busy", right: "free time"}
          - {left: "to make a picture with color", right: "paint"}
        status: "correct"
    feedback: "*if*=als, *rain*=regen(en), *stay home*=thuisblijven, *weekend*=weekend, *free time*=vrije tijd, *paint*=schilderen."
  en.b1.unit03.lesson01.exercise05.write_weekend:
    instruction: "Schrijf het woord voor zaterdag en zondag."
    accepted_answers:
      - {value: "weekend", status: "correct"}
      - {value: "Weekend", status: "correct"}
    feedback: "*weekend* betekent weekend."

  en.b1.unit03.lesson02.exercise01.choose_rain_result:
    instruction: "Welke zin zegt wat er gebeurt als het morgen regent?"
    correct_option: "If it rains tomorrow, we will stay home."
    distractors: ["If I have free time this weekend, I will paint.", "It rains a lot in the fall.", "We stayed home yesterday."]
    accepted_answers: [{value: "If it rains tomorrow, we will stay home.", status: "correct"}]
    feedback: "*If it rains tomorrow, we will stay home* zegt wat er gebeurt als het regent."
  en.b1.unit03.lesson02.exercise02.choose_free_time_result:
    instruction: "Welke zin zegt wat er gebeurt als je dit weekend vrije tijd hebt?"
    correct_option: "If I have free time this weekend, I will paint."
    distractors: ["If it rains tomorrow, we will stay home.", "I painted last weekend.", "I don't have much free time."]
    accepted_answers: [{value: "If I have free time this weekend, I will paint.", status: "correct"}]
    feedback: "*If I have free time this weekend, I will paint* zegt wat er gebeurt als je vrije tijd hebt."
  en.b1.unit03.lesson02.exercise03.order_if_rains_stay_home:
    instruction: "Zet de woorden in de juiste volgorde voor «als het morgen regent, blijven we thuis»."
    accepted_answers: [{value: ["If", "it", "rains", "tomorrow", "we", "will", "stay", "home"], status: "correct"}]
    feedback: "de juiste volgorde is *If it rains tomorrow, we will stay home*."
  en.b1.unit03.lesson02.exercise04.reply_weekend_plans:
    instruction: "Iemand vraagt wat je gaat doen als je dit weekend vrije tijd hebt. Zeg dat je dan gaat schilderen."
    accepted_answers:
      - {value: "If I have free time this weekend, I will paint.", status: "correct"}
      - {value: "If I have free time this weekend, I will paint", status: "correct"}
      - {value: "If I have free time this weekend, I'll paint.", status: "correct"}
      - {value: "If I have free time this weekend, I'll paint", status: "correct"}
    feedback: "*I'll* is de gesproken samentrekking van *I will*."
  en.b1.unit03.lesson02.exercise05.write_if_rains:
    instruction: "Schrijf dat als het morgen regent, jullie thuis blijven."
    accepted_answers:
      - {value: "If it rains tomorrow, we will stay home.", status: "correct"}
      - {value: "If it rains tomorrow, we will stay home", status: "correct"}
      - {value: "If it rains tomorrow, we'll stay home.", status: "correct"}
      - {value: "If it rains tomorrow, we'll stay home", status: "correct"}
    feedback: "*we'll* is de gesproken samentrekking van *we will*."

  en.b1.unit03.lesson03.exercise01.comprehend_if_more_time:
    instruction: "Wat zou Leila doen als ze meer vrije tijd had?"
    correct_option: "she would paint every day"
    distractors: ["she would take more classes", "she would go for a walk", "she would visit her friends"]
    accepted_answers: [{value: "she would paint every day", status: "correct"}]
    feedback: "de tekst zegt *she would paint every day*."
  en.b1.unit03.lesson03.exercise02.comprehend_if_known_earlier:
    instruction: "Wat zou Leila gedaan hebben als ze de les eerder had geweten?"
    correct_option: "she would have signed up"
    distractors: ["she would have canceled it", "she would have asked a friend", "she would have painted at home"]
    accepted_answers: [{value: "she would have signed up", status: "correct"}]
    feedback: "de tekst zegt *she would have signed up*."
  en.b1.unit03.lesson03.exercise03.recognize_class:
    instruction: "Welk woord betekent een georganiseerde les met een docent?"
    correct_option: "class"
    distractors: ["would", "friend", "weekend"]
    accepted_answers: [{value: "class", status: "correct"}]
    feedback: "*class* betekent les."
  en.b1.unit03.lesson03.exercise04.order_would_paint_every_day:
    instruction: "Zet de woorden in de juiste volgorde voor «zij zou elke dag schilderen»."
    accepted_answers: [{value: ["She", "would", "paint", "every", "day"], status: "correct"}]
    feedback: "de juiste volgorde is *She would paint every day*."
  en.b1.unit03.lesson03.exercise05.write_if_had_known:
    instruction: "Schrijf dat als je dat eerder had geweten, je je zou hebben ingeschreven."
    accepted_answers:
      - {value: "If I had known about it earlier, I would have signed up.", status: "correct"}
      - {value: "If I had known about it earlier, I would have signed up", status: "correct"}
      - {value: "If I had known about it earlier, I would've signed up.", status: "correct"}
      - {value: "If I had known about it earlier, I would've signed up", status: "correct"}
    feedback: "*would've* is de gesproken samentrekking van *would have*."

  en.b1.unit03.lesson04.exercise01.listen_leilas_rain_plan:
    instruction: "Luister naar het gesprek en kies wat Leila doet als het regent."
    correct_option: "stay home and paint"
    distractors: ["go for a walk", "visit a friend", "clean the house"]
    accepted_answers: [{value: "stay home and paint", status: "correct"}]
    feedback: "Leila zegt dat ze *stay home and paint* als het regent."
  en.b1.unit03.lesson04.exercise02.listen_when_class_was:
    instruction: "Luister en kies wanneer de schilderles was."
    correct_option: "last month"
    distractors: ["last week", "next month", "yesterday"]
    accepted_answers: [{value: "last month", status: "correct"}]
    feedback: "Daniel vraagt naar de les van *last month*."
  en.b1.unit03.lesson04.exercise03.choose_leilas_regret:
    instruction: "Wat zegt Leila dat ze gedaan zou hebben als ze de les eerder had geweten?"
    correct_option: "If I had known about it earlier, I would have signed up."
    distractors: ["If I had known about it earlier, I would have canceled it.", "If I had known about it earlier, I would have asked Daniel.", "If I had known about it earlier, I would have painted at home."]
    accepted_answers: [{value: "If I had known about it earlier, I would have signed up.", status: "correct"}]
    feedback: "Leila zegt *If I had known about it earlier, I would have signed up*."
  en.b1.unit03.lesson04.exercise04.order_if_there_is_another:
    instruction: "Zet de woorden in de juiste volgorde voor «als er nog een keer is, moet je meedoen»."
    accepted_answers: [{value: ["If", "there's", "another", "one", "you", "should", "join"], status: "correct"}]
    feedback: "de juiste volgorde is *If there's another one, you should join*."
  en.b1.unit03.lesson04.exercise05.reply_as_leila:
    instruction: "Daniel vraagt: wat zijn je plannen voor het weekend? Geef Leila's antwoord: zeg dat je gaat wandelen als het niet regent, en dat je thuisblijft en gaat schilderen als het wel regent."
    accepted_answers:
      - {value: "If it doesn't rain, I will go for a walk. If it rains, I will stay home and paint.", status: "correct"}
      - {value: "If it doesn't rain, I'll go for a walk. If it rains, I'll stay home and paint.", status: "correct"}
    feedback: "*I'll* is de gesproken samentrekking van *I will*, gebruikt in beide zinnen."
  en.b1.unit03.lesson04.exercise06.speak_hypotheticals_dialogue:
    instruction: "Daniel zegt: dat klinkt leuk. Heb je die schilderles vorige maand gevolgd? Antwoord hardop als Leila: zeg dat je die niet gevolgd hebt, en dat je je zou hebben ingeschreven als je dat eerder had geweten."
    accepted_answers:
      - {value: "No, I didn't. If I had known about it earlier, I would have signed up.", status: "correct"}
      - {value: "No, I didn't. If I had known about it earlier, I would've signed up.", status: "correct"}
    feedback: "*would've* is de gesproken samentrekking van *would have*."
