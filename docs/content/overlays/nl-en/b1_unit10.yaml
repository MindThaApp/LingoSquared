teaching:
  en.b1.unit10.lesson01.teach.in_order_to: {title: "in order to", gloss: "om, met als doel om", note: "*in order to* gebruik je vóór een werkwoord om het doel van een actie te geven.", example_gloss: "Ik studeer om mijn Engels te verbeteren."}
  en.b1.unit10.lesson01.teach.so_that: {title: "so that", gloss: "zodat", note: "*so that* gebruik je vóór een volledige bijzin: onderwerp + werkwoord.", example_gloss: "Ik schrijf notities zodat ik nieuwe woorden kan onthouden."}
  en.b1.unit10.lesson01.teach.goal: {title: "goal", gloss: "doel", note: "*goal* betekent iets dat je wilt bereiken.", example_gloss: "Haar doel is een designcursus volgen."}
  en.b1.unit10.lesson01.teach.improve: {title: "improve", gloss: "verbeteren", note: "*improve* betekent iets beter maken.", example_gloss: "Daniel wil zijn schrijfvaardigheid op het werk verbeteren."}
  en.b1.unit10.lesson01.teach.save_money: {title: "save money", gloss: "geld sparen", note: "*save money* betekent geld bewaren voor later in plaats van het uit te geven.", example_gloss: "Leila spaart geld voor haar volgende cursus."}
  en.b1.unit10.lesson01.teach.prepare: {title: "prepare", gloss: "voorbereiden", note: "*prepare* betekent je klaar maken voor iets.", example_gloss: "Ik bereid vóór elke vergadering vragen voor."}

  en.b1.unit10.lesson02.teach.evening_class: {title: "doel met 'in order to'", gloss: "Ik volg een avondcursus om mijn Engels te verbeteren.", note: "*in order to improve* geeft het doel van de avondcursus."}
  en.b1.unit10.lesson02.teach.study_so_that: {title: "doel met 'so that'", gloss: "Ik studeer elke avond zodat ik meer woordenschat kan onthouden.", note: "na *so that* staat een volledige zin: *I can remember more vocabulary*."}
  en.b1.unit10.lesson02.teach.grammar_purpose: {title: "in order to versus so that", gloss: "Ik studeer om te verbeteren. Ik studeer zodat ik meer kan onthouden.", note: "gebruik *in order to* vóór een werkwoord; gebruik *so that* vóór een volledige bijzin."}

  en.b1.unit10.lesson03.teach.design_course: {title: "design course", gloss: "designcursus, ontwerpcursus", note: "*design course* betekent een cursus over hoe dingen eruitzien en werken.", example_gloss: "Leila spaart geld voor een designcursus."}
  en.b1.unit10.lesson03.teach.clear_goal: {title: "clear goal", gloss: "duidelijk doel", note: "*clear goal* betekent een doel dat concreet en makkelijk te begrijpen is.", example_gloss: "Een duidelijk doel helpt je kiezen wat je daarna moet doen."}
  en.b1.unit10.lesson03.teach.reading_passage: {title: "leestekst: duidelijke doelen", gloss: "Daniel en Leila hebben allebei duidelijke doelen. Daniel volgt een avondcursus om zijn Engels voor het werk te verbeteren. Hij oefent met het schrijven van korte updates zodat hij professioneler kan klinken. Leila spaart geld zodat ze volgend jaar een designcursus kan volgen. Ze leest cursusbeschrijvingen om het juiste programma te kiezen.", note: "een korte leestekst over doelen met *in order to* en *so that* -- B1-niveau."}

  en.b1.unit10.lesson04.teach.q_why_evening_class: {title: "Leila vraagt naar Daniels doel", gloss: "Leila zegt: Daniel, waarom volg je een avondcursus?", note: "een directe vraag naar het doel van een actie."}
  en.b1.unit10.lesson04.teach.a_improve_english: {title: "Daniel legt zijn doel uit", gloss: "Daniel zegt: ik volg hem om mijn Engels voor het werk te verbeteren.", note: "*in order to improve* geeft Daniels doel."}
  en.b1.unit10.lesson04.teach.q_studying_every_night: {title: "Leila vraagt naar zijn studiegewoonte", gloss: "Leila zegt: dat is logisch. Studeer je elke avond?", note: "een vervolgvraag over hoe Daniel zijn doel probeert te bereiken."}
  en.b1.unit10.lesson04.teach.a_remember_vocabulary: {title: "Daniel gebruikt 'so that'", gloss: "Daniel zegt: ik studeer dertig minuten zodat ik meer woordenschat kan onthouden.", note: "*so that I can remember...* geeft het gewenste resultaat."}
  en.b1.unit10.lesson04.teach.q_saving_money: {title: "Leila noemt haar eigen doel", gloss: "Leila zegt: goed plan. Ik spaar geld zodat ik volgend jaar een designcursus kan volgen.", note: "Leila gebruikt ook *so that* om haar doel uit te leggen."}
  en.b1.unit10.lesson04.teach.a_clear_goals: {title: "Daniel vat het samen", gloss: "Daniel zegt: dan hebben we allebei duidelijke doelen.", note: "*clear goals* zijn doelen die concreet zijn."}

