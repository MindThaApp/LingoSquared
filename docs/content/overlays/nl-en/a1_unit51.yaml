  en.a1.unit51.lesson03.teach.dialogue_line2: {title: "Leila's klachten", gloss: "Leila zegt: Ja, ik heb een erge hoest en een loopneus.", note: "Herhaling van de eerder geleerde zin."}
  en.a1.unit51.lesson03.teach.dialogue_line3: {title: "De apotheker adviseert siroop", gloss: "De apotheker zegt: Ik heb wat hoestsiroop die zou moeten helpen. Neem het voor het slapengaan in.", note: "*before bed* betekent voor het slapengaan -- dit hoort bij de hoestsiroop, niet bij de tabletten."}
  en.a1.unit51.lesson03.teach.dialogue_line4: {title: "Daniels vraag", gloss: "Daniel vraagt: Heeft u ook iets tegen keelpijn?", note: "*too* aan het einde betekent ook."}
  en.a1.unit51.lesson03.teach.dialogue_line5: {title: "De apotheker adviseert tabletten", gloss: "De apotheker zegt: Ja, deze tabletten zijn goed tegen keelpijn. Neem er een om de vier uur.", note: "Dit is de tabletten-dosering: om de vier uur, anders dan de siroop-instructie voor het slapengaan."}
  en.a1.unit51.lesson03.teach.dialogue_line6: {title: "Leila's beslissing", gloss: "Leila zegt: Geweldig, ik neem beide. Hoeveel kost dat?", note: "*I'll take both.* betekent ik neem beide."}
  en.a1.unit51.lesson03.teach.dialogue_line7: {title: "De prijs", gloss: "De apotheker zegt: Dat is negen dollar.", note: "Herhaling van de eerder geleerde zin."}
  en.a1.unit51.lesson03.teach.dialogue_line8: {title: "Daniel betaalt", gloss: "Daniel zegt: Alstublieft. Dank u wel!", note: "*Here you go.* betekent alstublieft, gebruikt als je iets aangeeft."}

  en.a1.unit51.lesson04.teach.reading_passage: {title: "Tekst over een bezoek aan de apotheek", gloss: "Een bezoek aan de apotheek: Een paar dagen na hun reisje naar de bergen werd Leila verkouden. Ze had een erge hoest en een loopneus, en ook haar keel voelde pijnlijk aan. Daniel liep met haar mee naar de apotheek bij haar appartement. De apotheker luisterde naar Leila's klachten en raadde hoestsiroop en tabletten aan. Ze zei dat ze de hoestsiroop voor het slapengaan moest innemen en één tablet om de vier uur. Leila betaalde negen dollar voor beide. Op de terugweg kocht Daniel ook een doos tissues voor haar. Leila nam die avond de medicijnen in, en tegen het weekend was haar hoest al veel beter.", note: "*by the weekend* betekent tegen het weekend."}

