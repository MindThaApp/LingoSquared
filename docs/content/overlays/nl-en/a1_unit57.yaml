  notes: >-
    Draft only. Overlay against the shared en/a1_unit57_cinema.yaml
    realization (itself still unreviewed). This unit had NO overlay in any
    direction (nl-en/fa-en/prs-en) before this file -- it was an orphaned
    realization, authored but unreachable by any learner. Two contrastive
    points, deliberately different from the ones already used elsewhere in
    this direction: (1) English expresses enjoyment of a film with the
    transitive verb like plus a direct object ("I really liked it!"),
    while Dutch typically expresses the same opinion with vinden plus an
    adjective ("Ik vond het echt leuk!") rather than a direct equivalent
    of "liking" something as a verb-object pair -- a Dutch speaker's
    instinct to build the sentence around vinden has no matching English
    slot, so this is flagged explicitly on the liked-it phrase card and
    Leila's closing dialogue line; (2) English uses the preposition at for
    a clock time ("at seven o'clock"), while Dutch uses om ("om zeven
    uur") -- a genuinely different preposition, not a cognate, so a direct
    word-for-word carryover from Dutch produces a wrong preposition in
    English; flagged on the showtime vocabulary card and reinforced in the
    dialogue where the Cashier states the showtime. No sibling-direction
    overlay exists for this unit in any language (confirmed via a fresh ls
    of docs/content/overlays/{nl-en,fa-en,prs-en}/ before authoring), so
    there was nothing to isolate from, but this file was still drafted
    entirely independently from the target realization and universal
    spine, per the standing rule. Followed the realization's own explicit
    same-speaker-distractor guidance for lesson03's ticket/popcorn/total
    questions -- each is its own single-fact Cashier turn, so
    cross-distracting between them is safe per the realization's own
    analysis, and was used that way here. Every kind:vocabulary teaching
    card's example_gloss is a faithful Dutch translation of the
    realization's own example sentence; lesson02/03/04 cards carry no
    example_gloss since their realization counterparts declare no example
    (phrase/dialogue/reading cards are exempt per AUTHORING_GUIDE.md #19).
    Needs the mandatory fresh-context review before shipping.

    2026-10-11: accepted answers widened for
    lesson03.exercise04.respond_own_cinema_statement (off-prompt popcorn
    answer removed) (en realization review).

    Shared-en r2 review 2026-10-22: speak_response and writing_prompt accepted_answers widened (show starts / is at / It's amounts, saw vs watched, it was twenty dollars in total); translation alternates (Could I / Can I get / May I) added in the overlays; nl ticket description no longer contains the answer word kaartje; prs filler distractor none of them removed.

    Review 2026-10-22 (nl-en r2 overlay pass): 30 fixes - English spans marked with asterisks, speaker labels lowercased, like-note and at-seven note simplified, instructions, accepted answers widened. NATIVE FLAGS: none.

