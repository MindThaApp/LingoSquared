  en.a1.unit57.lesson02.teach.what_time_does_the_film_start: {title: "What time does the film start?", gloss: "Hoe laat begint de film?", note: "*does the film start* gebruikt do-support (*does*) voor de vraagvorm, omdat het hoofdwerkwoord *start* is."}
  en.a1.unit57.lesson02.teach.two_tickets_for_the_seven_oclock_show: {title: "Two tickets for the seven o'clock show, please.", gloss: "Twee kaartjes voor de voorstelling van zeven uur, alstublieft.", note: "*for the seven o'clock show* koppelt de kaartjes aan een specifieke voorstelling."}
  en.a1.unit57.lesson02.teach.can_i_have_some_popcorn: {title: "Can I have some popcorn, please?", gloss: "Mag ik wat popcorn, alstublieft?", note: "*Can I have...?* is een directe, veelgebruikte manier om iets te bestellen."}
  en.a1.unit57.lesson02.teach.how_much_is_that_in_total: {title: "How much is that in total?", gloss: "Hoeveel is dat in totaal?", note: "*in total* betekent in totaal, gebruikt om naar de eindprijs te vragen."}
  en.a1.unit57.lesson02.teach.thats_twenty_dollars: {title: "That's twenty dollars, please.", gloss: "Dat is twintig dollar, alstublieft.", note: "*That's* + prijs is een vaste manier om een bedrag te noemen."}
  en.a1.unit57.lesson02.teach.i_really_liked_it: {title: "I really liked it!", gloss: "Ik vond het echt leuk!", note: "Het Engels gebruikt hier het werkwoord *like* met het lijdend voorwerp *it*. Het Nederlands bouwt de zin anders op: vinden plus een bijvoeglijk naamwoord (Ik vond het leuk). Leer deze zin als geheel, niet woord voor woord."}

  en.a1.unit57.lesson03.teach.dialogue_line1: {title: "Daniel vraagt naar de aanvangstijd", gloss: "Daniel zegt: Hoi! Hoe laat begint de film?", note: "*does the film start* gebruikt do-support voor de vraagvorm."}
  en.a1.unit57.lesson03.teach.dialogue_line2: {title: "De aanvangstijd", gloss: "De kassamedewerker zegt: De volgende voorstelling is om zeven uur.", note: "*at seven o'clock* gebruikt het voorzetsel *at* voor een tijdstip -- het Nederlands gebruikt hier om (om zeven uur)."}
  en.a1.unit57.lesson03.teach.dialogue_line3: {title: "Daniel bestelt kaartjes", gloss: "Daniel zegt: Geweldig. Kunnen we twee kaartjes krijgen, alstublieft?", note: "Eén apart feit: het aantal kaartjes (twee)."}
  en.a1.unit57.lesson03.teach.dialogue_line4: {title: "De prijs van de kaartjes", gloss: "De kassamedewerker zegt: Natuurlijk. Dat is zestien dollar.", note: "Eén apart feit: de prijs van de twee kaartjes samen."}
  en.a1.unit57.lesson03.teach.dialogue_line5: {title: "Leila bestelt popcorn", gloss: "Leila zegt: Kunnen we wat popcorn krijgen, alstublieft?", note: "Een verzoek, geen nieuw prijsfeit."}
  en.a1.unit57.lesson03.teach.dialogue_line6: {title: "De prijs van de popcorn", gloss: "De kassamedewerker zegt: Natuurlijk. De popcorn is vier dollar.", note: "Een tweede apart feit: de prijs van de popcorn, los van de kaartjes."}
  en.a1.unit57.lesson03.teach.dialogue_line7: {title: "Daniel vraagt naar het totaal", gloss: "Daniel zegt: Hoeveel is dat in totaal?", note: "*in total* vraagt naar de som van alle prijzen."}
  en.a1.unit57.lesson03.teach.dialogue_line8: {title: "Het totaalbedrag", gloss: "De kassamedewerker zegt: Dat is twintig dollar, alstublieft.", note: "Een derde apart feit: het totaalbedrag, anders dan de losse prijzen van kaartjes en popcorn."}
  en.a1.unit57.lesson03.teach.dialogue_line9: {title: "Leila kan niet wachten", gloss: "Leila zegt: Dank je! Ik kan niet wachten om hem te zien.", note: "*I can't wait to...* is een vaste uitdrukking voor enthousiasme."}

  en.a1.unit57.lesson04.teach.cinema_schedule: {title: "Bioscoopschema", gloss: "Bioscoopschema: Star Journey - 7:00, $8. The Great Race - 5:00, $10. Funny Family - 9:00, $6.", note: "Het schema toont drie films met hun aanvangstijd en prijs."}
  en.a1.unit57.lesson04.teach.reading_passage: {title: "Tekst: Een avond in de bioscoop", gloss: "Op een avond besloten Daniel en Leila samen een film te gaan kijken in de bioscoop. Ze vroegen hoe laat de film begon, en de kassamedewerker zei dat de volgende voorstelling, Star Journey, om zeven uur was. Ze kochten twee kaartjes voor zestien dollar en een zak popcorn voor vier dollar. Dat was in totaal twintig dollar. Ze keken samen naar de film, en die ging over ruimtevaarders. Hij was heel grappig. Toen de film afgelopen was, zei Leila dat ze hem echt leuk vond, en Daniel zei dat hij ook de volgende wil zien.", note: "*watched* is de verleden tijd van *watch* (kijken naar)."}

