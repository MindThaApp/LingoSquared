    correct_option: "Leila told me that the office was busy."
    distractors: ["Mia said that she was available after lunch.", "Leila asked if the office was busy.", "The office is busy now."]
    accepted_answers: [{value: "Leila told me that the office was busy.", status: "correct"}]
    feedback: "*told me that* gebruik je wanneer Leila de informatie aan jou gaf."
  en.b1.unit09.lesson02.exercise03.order_mia_said_available:
