    correct_option: "available"
    distractors: ["confirm", "message", "full report"]
    accepted_answers: [{value: "available", status: "correct"}]
    feedback: "*available* betekent beschikbaar."
  en.b1.unit09.lesson01.exercise04.match_reported_speech_words:
    instruction: "Verbind elk Engels woord of elke Engelse uitdrukking met de juiste Nederlandse omschrijving."
    pairs:
      - {left: "said that", right: "zei dat"}
      - {left: "told me that", right: "vertelde me dat"}
      - {left: "asked whether", right: "leidt een vroeg of (iets formeler)"}
      - {left: "asked if", right: "leidt een vroeg of (alledaagser)"}
      - {left: "message", right: "bericht"}
      - {left: "confirm", right: "bevestigen"}
      - {left: "available", right: "beschikbaar"}
    accepted_answers:
      - value:
          - {left: "said that", right: "zei dat"}
          - {left: "told me that", right: "vertelde me dat"}
          - {left: "asked whether", right: "leidt een vroeg of (iets formeler)"}
          - {left: "asked if", right: "leidt een vroeg of (alledaagser)"}
          - {left: "message", right: "bericht"}
          - {left: "confirm", right: "bevestigen"}
          - {left: "available", right: "beschikbaar"}
        status: "correct"
    feedback: "*said that*=zei dat, *told me that*=vertelde me dat, *asked whether*/*asked if*=vroeg of, *message*=bericht, *confirm*=bevestigen, *available*=beschikbaar."
  en.b1.unit09.lesson01.exercise05.write_confirm:
    instruction: "Schrijf het woord dat betekent dat je zegt dat iets zeker of juist is."
    accepted_answers:
      - {value: "confirm", status: "correct"}
      - {value: "Confirm", status: "correct"}
    feedback: "*confirm* betekent bevestigen."

  en.b1.unit09.lesson02.exercise01.choose_mia_available:
    instruction: "Welke zin rapporteert wat Mia zei?"
    correct_option: "Mia said that she was available after lunch."
    distractors: ["Mia is available after lunch.", "Mia asked whether we needed help.", "Leila sent a message after lunch."]
    accepted_answers: [{value: "Mia said that she was available after lunch.", status: "correct"}]
    feedback: "*Mia said that she was available after lunch* rapporteert Mia's uitspraak."
  en.b1.unit09.lesson02.exercise02.choose_room_busy:
