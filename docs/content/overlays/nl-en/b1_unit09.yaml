course:
  title: "Engels B1"
  description: >-
    Engels leren op B1-niveau voor alledaagse gesprekken over verplichtingen,
    mogelijkheden, hypothetische situaties en verhalen, met gedetailleerde
    uitleg in het Nederlands.

units:
  en.b1.unit09.reported_speech: {title: "She said that she was available"}

lessons:
  en.b1.unit09.lesson01.reported_speech_vocabulary: {title: "Said that, asked if en message"}
  en.b1.unit09.lesson02.reporting_statements: {title: "Mia said that she was available"}
  en.b1.unit09.lesson03.reading_the_message_chain: {title: "Lezen: de berichtenketen"}
  en.b1.unit09.lesson04.the_reported_message_dialogue: {title: "She asked whether we needed the full report"}

teaching:
  en.b1.unit09.lesson01.teach.said_that: {title: "said that", gloss: "zei dat", note: "*said that* gebruik je om een uitspraak van iemand anders door te geven.", example_gloss: "Ze zei dat ze het druk had."}
  en.b1.unit09.lesson01.teach.told_me_that: {title: "told me that", gloss: "vertelde me dat", note: "*told me that* gebruik je wanneer iemand informatie aan jou gaf.", example_gloss: "Hij vertelde me dat de vergadering was afgelast."}
  en.b1.unit09.lesson01.teach.asked_whether: {title: "asked whether", gloss: "vroeg of", note: "*asked whether* rapporteert een ja/nee-vraag en klinkt iets formeler dan *asked if*.", example_gloss: "Mia vroeg of we hulp nodig hadden."}
  en.b1.unit09.lesson01.teach.asked_if: {title: "asked if", gloss: "vroeg of", note: "*asked if* rapporteert een ja/nee-vraag in alledaagse spreektaal.", example_gloss: "Mia vroeg of we hulp nodig hadden."}
  en.b1.unit09.lesson01.teach.message: {title: "message", gloss: "bericht", note: "*message* betekent een kort geschreven of gesproken bericht.", example_gloss: "Leila stuurde na de lunch een bericht."}
  en.b1.unit09.lesson01.teach.confirm: {title: "confirm", gloss: "bevestigen", note: "*confirm* betekent zeggen dat iets zeker of juist is.", example_gloss: "Bevestig alsjeblieft de tijd voordat je vertrekt."}
  en.b1.unit09.lesson01.teach.available: {title: "available", gloss: "beschikbaar", note: "*available* betekent vrij of in staat om af te spreken.", example_gloss: "Mia is na de lunch beschikbaar."}

  en.b1.unit09.lesson02.teach.mia_available: {title: "Een uitspraak rapporteren", gloss: "Mia zei dat ze na de lunch beschikbaar was.", note: "In gerapporteerde spraak verschuift *is* vaak naar *was*: *Mia said that she was available*."}
  en.b1.unit09.lesson02.teach.leila_told_me: {title: "Informatie aan jou rapporteren", gloss: "Leila vertelde me dat het kantoor druk was.", note: "*told me that* gebruik je wanneer iemand de informatie direct aan jou gaf."}
  en.b1.unit09.lesson02.teach.grammar_backshift: {title: "Directe en gerapporteerde spraak", gloss: "Direct: Mia is beschikbaar. Gerapporteerd: Mia zei dat ze beschikbaar was.", note: "Bij gerapporteerde spraak zet je de oorspronkelijke uitspraak vaak één stap terug in de tijd."}

  en.b1.unit09.lesson03.teach.short_summary: {title: "short summary", gloss: "korte samenvatting", note: "*short summary* betekent een korte versie met alleen de hoofdpunten.", example_gloss: "Een korte samenvatting is genoeg voor de vergadering van vandaag."}
  en.b1.unit09.lesson03.teach.full_report: {title: "full report", gloss: "volledig rapport", note: "*full report* betekent het hele rapport, niet alleen de korte versie.", example_gloss: "Mia vroeg of we het volledige rapport nodig hadden."}
  en.b1.unit09.lesson03.teach.reading_passage: {title: "Leestekst: de berichtenketen", gloss: "Leila las Mia's bericht en belde Daniel. Ze zei dat Mia na de lunch beschikbaar was. Ze zei ook dat Mia de cijfers had afgemaakt. Mia vroeg of het team vandaag het volledige rapport nodig had. Daniel vertelde Leila dat een korte samenvatting genoeg was, omdat de vergadering maar vijftien minuten duurde.", note: "Een korte leestekst over uitspraken en vragen doorgeven."}

  en.b1.unit09.lesson04.teach.q_mia_reply: {title: "Daniel vraagt naar Mia's antwoord", gloss: "Daniel zegt: heeft Mia iets laten weten over de bespreking?", note: "Een ja/nee-vraag over een eerder bericht."}
  en.b1.unit09.lesson04.teach.a_she_said_available: {title: "Leila rapporteert Mia's uitspraak", gloss: "Leila zegt: ja, ze zei dat ze na de lunch beschikbaar was.", note: "*she said that she was available* geeft Mia's uitspraak door."}
  en.b1.unit09.lesson04.teach.q_anything_else: {title: "Daniel vraagt verder", gloss: "Daniel zegt: mooi. Vroeg ze nog iets anders?", note: "Een vervolgvraag om te horen of er nog een vraag in het bericht stond."}
  en.b1.unit09.lesson04.teach.a_asked_if_report: {title: "Leila rapporteert Mia's vraag", gloss: "Leila zegt: ze vroeg of we vandaag het volledige rapport nodig hadden.", note: "*asked if* verandert een directe ja/nee-vraag in gerapporteerde spraak."}
  en.b1.unit09.lesson04.teach.q_what_tell_her: {title: "Daniel vraagt naar Leila's antwoord", gloss: "Daniel zegt: wat heb je haar verteld?", note: "Een vraag naar de informatie die Leila teruggaf."}
  en.b1.unit09.lesson04.teach.a_short_summary_enough: {title: "Leila rapporteert haar antwoord", gloss: "Leila zegt: ik vertelde haar dat een korte samenvatting genoeg was.", note: "*I told her that...* geeft informatie door die jij aan iemand anders gaf."}
  en.b1.unit09.lesson04.teach.q_tell_team: {title: "Daniel sluit de berichtenketen af", gloss: "Daniel zegt: perfect. Ik vertel het team dat we om twee uur kunnen afspreken.", note: "Daniel gebruikt opnieuw *tell ... that* om informatie door te geven."}

exercises:
  en.b1.unit09.lesson01.exercise01.listen_word:
    instruction: "Luister en kies het woord dat gezegd wordt."
    correct_option: "available"
    distractors: ["confirm", "message", "said that"]
    accepted_answers: [{value: "available", status: "correct"}]
    feedback: "*available* betekent beschikbaar."
  en.b1.unit09.lesson01.exercise02.choose_said_that:
    instruction: "Welke uitdrukking rapporteert een uitspraak die iemand deed?"
    correct_option: "said that"
    distractors: ["asked whether", "asked if", "message"]
    accepted_answers: [{value: "said that", status: "correct"}]
    feedback: "*said that* betekent zei dat."
  en.b1.unit09.lesson01.exercise03.choose_available:
