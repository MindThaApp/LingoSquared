    note: سلام का अर्थ है नमस्ते।
    example_gloss: नमस्ते। मैं बीमार हूँ।
  prs.a1.unit17.lesson05.teach.and_word:
    title: और
    gloss: और
    note: و का अर्थ है "और", जो दो चीज़ों या वाक्यांशों को जोड़ता है।
