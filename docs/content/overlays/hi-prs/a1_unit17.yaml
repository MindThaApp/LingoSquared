teaching:
  prs.a1.unit17.lesson01.teach.headache_word:
    title: सिरदर्द
    gloss: सिरदर्द
    note: سردرد सر (सिर) और درد (दर्द) से बना संयुक्त शब्द है।
    example_gloss: मेरे सिर में दर्द है।
  prs.a1.unit17.lesson01.teach.fever_word:
    title: बुखार
    gloss: बुखार
    note: تب का अर्थ है बुखार।
    example_gloss: मुझे बुखार है।
  prs.a1.unit17.lesson01.teach.stomachache_word:
    title: पेट दर्द
    gloss: पेटदर्द
    note: دل‌درد دل (बोलचाल में पेट) और درد (दर्द) से बना संयुक्त शब्द है।
    example_gloss: मेरे पेट में दर्द है।
  prs.a1.unit17.lesson01.teach.have_word:
    title: मेरे पास है
    gloss: मेरे पास है
    note: دارم داشتن (होना/पास होना) का उत्तम पुरुष वर्तमान रूप है, यानी "मेरे पास है"।
    target_text: دارم (मेरे पास है)
  prs.a1.unit17.lesson02.teach.sick_word:
    title: बीमार
    gloss: बीमार
    note: مریض का अर्थ है बीमार।
    example_gloss: मैं बीमार हूँ।
  prs.a1.unit17.lesson02.teach.am_word:
    title: मैं हूँ
    gloss: मैं हूँ
    note: استم "मैं हूँ" का विनम्र उत्तम पुरुष रूप है, जो इस कोर्स के استم/استین रूप-शैली के अनुरूप है।
    target_text: استم (मैं हूँ)
  prs.a1.unit17.lesson02.teach.my_condition_word:
    title: मैं कैसा/कैसी महसूस करता/करती हूँ
    gloss: मेरी तबीयत / मेरा हाल
    note: حالم (حال + م) का शाब्दिक अर्थ है "मेरा हाल" -- حالم خوب نیست का अर्थ है "मेरी तबीयत ठीक नहीं है"।
    target_text: حالم (मेरा हाल / मेरी तबीयत)
  prs.a1.unit17.lesson02.teach.good_word:
    title: अच्छा
    gloss: अच्छा
    note: خوب का अर्थ है अच्छा या ठीक।
    example_gloss: मेरी तबीयत ठीक नहीं है।
  prs.a1.unit17.lesson02.teach.not_word:
    title: नहीं है
    gloss: नहीं है
    note: نیست निषेधात्मक सहायक क्रिया है -- خوب نیست का अर्थ है "अच्छा/ठीक नहीं है"।
    target_text: نیست (नहीं है)
  prs.a1.unit17.lesson03.teach.doctor_word:
    title: डॉक्टर
    gloss: डॉक्टर
    note: داکتر अफ़ग़ान दरी में डॉक्टर के लिए मानक वर्तनी और उच्चारण है (ईरानी फ़ारसी के دکتر से अलग)।
    example_gloss: मुझे डॉक्टर चाहिए।
  prs.a1.unit17.lesson03.teach.medicine_word:
    title: दवा
    gloss: दवा
    note: دوا का अर्थ है दवा।
    example_gloss: मुझे दवा चाहिए।
  prs.a1.unit17.lesson03.teach.want_word:
    title: मैं चाहता/चाहती हूँ
    gloss: मुझे चाहिए
    note: می‌خواهم का अर्थ है "मैं चाहता/चाहती हूँ"।
    target_text: می‌خواهم (मैं चाहता/चाहती हूँ)
  prs.a1.unit17.lesson04.teach.rest_word:
    title: आराम
    gloss: आराम कीजिए
    note: 'استراحت संज्ञा है, यानी आराम -- کنین के साथ मिलकर यह आज्ञार्थक रूप बनाता है: "आराम कीजिए!"'
    example_gloss: आराम कीजिए।
  prs.a1.unit17.lesson04.teach.do_word:
    title: कीजिए (आदरपूर्वक)
    gloss: कीजिए (विनम्र आज्ञार्थ)
    note: کنین کردن (करना) का विनम्र आज्ञार्थक रूप है -- استراحت کنین का शाब्दिक अर्थ है "आराम कीजिए"।
    target_text: کنین (कीजिए -- आदरपूर्वक आदेश)
  prs.a1.unit17.lesson04.teach.water_word:
