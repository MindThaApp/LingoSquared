    example_gloss: धन्यवाद, डॉक्टर साहब।
  prs.a1.unit17.lesson06.teach.dialogue_line1:
    title: डॉक्टर बशीर का अभिवादन करते हैं
    gloss: नमस्ते। आप कैसे हैं?
  prs.a1.unit17.lesson06.teach.dialogue_line2:
    title: बशीर जवाब देता है
    gloss: नमस्ते। मैं बीमार हूँ। मुझे सिरदर्द और बुखार है।
  prs.a1.unit17.lesson06.teach.dialogue_line3:
    title: डॉक्टर सलाह देते हैं
    gloss: आराम कीजिए। खूब पानी पीजिए।
  prs.a1.unit17.lesson06.teach.dialogue_line4:
    title: बशीर डॉक्टर को धन्यवाद देता है
    gloss: धन्यवाद, डॉक्टर साहब।
