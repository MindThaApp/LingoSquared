    gloss: ज़रमीना मुद्रा-विनिमय की दुकान पर गई। उसके पास सौ डॉलर थे और वह डॉलर को अफ़ग़ानी में बदलना चाहती थी। आज का भाव सत्तर अफ़ग़ानी था। ज़रमीना को सात हज़ार अफ़ग़ानी मिले और उसने रसीद ली।
