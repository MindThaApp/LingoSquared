    note: هفت दोहराव की संख्या है। گرفت और گرفتم گرفتن (लेना/प्राप्त करना) के क्रमशः अन्य पुरुष और उत्तम पुरुष भूतकाल रूप हैं। यहाँ इनका प्रयोग ज़रमीना को मिली रक़म के लिए हुआ है।
    example_gloss: ज़रमीना को सात हज़ार अफ़ग़ानी मिले।
  prs.a1.unit23.lesson06.teach.review_summary:
    title: समापन सारांश
    gloss: 'मेरे पास पैसे हैं: नक़द और कार्ड। मैं मुद्रा-विनिमय की दुकान पर डॉलर को अफ़ग़ानी में बदल सकता/सकती हूँ। आज एक डॉलर का भाव सत्तर अफ़ग़ानी है।'
  prs.a1.unit23.lesson06.teach.review_bara:
