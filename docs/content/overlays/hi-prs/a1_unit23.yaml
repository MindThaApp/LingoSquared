    example_gloss: ज़रमीना ने सौ डॉलर अफ़ग़ानी में बदले।
  prs.a1.unit23.lesson04.teach.turn01:
    title: 'ज़रमीना: नमस्ते, मैं डॉलर को अफ़ग़ानी में बदलना चाहती हूँ।'
