    gloss: को/में / कर्म-चिह्न / मैं करता/करती हूँ / करूँ / मैं चाहता/चाहती हूँ
    note: به, را, می‌کنم, کنم और می‌خواهم दोहराव के शब्द हैं (ये कोर्स में पहले आ चुके हैं)। इस पाठ के विनिमय वाले वाक्यों में ये एक साथ आते हैं।
    example_gloss: मैं डॉलर को अफ़ग़ानी में बदलना चाहता/चाहती हूँ।
  prs.a1.unit23.lesson04.teach.review_mikhaham:
