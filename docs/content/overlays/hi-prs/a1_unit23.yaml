    gloss: आपके पास कितने डॉलर हैं?
  prs.a1.unit23.lesson04.teach.turn03:
    title: 'ज़रमीना: मेरे पास सौ डॉलर हैं। आज का भाव क्या है?'
    gloss: मेरे पास सौ डॉलर हैं। आज का भाव क्या है?
  prs.a1.unit23.lesson04.teach.turn04:
    title: 'सराफ़: आज एक डॉलर सत्तर अफ़ग़ानी का है।'
