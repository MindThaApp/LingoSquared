  prs.a1.unit31.lesson04.teach.dialogue_line4:
    title: 'परवीन: हाँ, कठिन है, लेकिन दिलचस्प है। और तुम?'
    gloss: हाँ, कठिन है, लेकिन दिलचस्प है। और तुम?
  prs.a1.unit31.lesson04.teach.dialogue_line5:
    title: 'करीम: मैं स्कूल में पढ़ता हूँ।'
    gloss: मैं स्कूल में पढ़ता हूँ।
  prs.a1.unit31.lesson04.teach.dialogue_line6:
    title: 'परवीन: बहुत बढ़िया!'
