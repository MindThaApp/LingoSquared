    title: मुझे पसंद है / समय / मेरे पास नहीं है
    gloss: मुझे पसंद है / समय / मेरे पास नहीं है
    note: دوست دارم (मुझे पसंद है), وقت (समय) और ندارم (मेरे पास नहीं है) सब इकाई 11, 14, 26, 29 और 30 से दोहराए जा रहे हैं।
    target_text: دوست دارم (मुझे पसंद है) / وقت (समय) / ندارم (मेरे पास नहीं है)
  prs.a1.unit31.lesson06.teach.wrap_summary:
    title: मुझे पढ़ाई पसंद है, लेकिन मेरे पास समय नहीं है
    gloss: मुझे पढ़ाई पसंद है, लेकिन मेरे पास समय नहीं है।
