teaching:
  prs.a1.unit31.lesson01.teach.education_word:
    title: शिक्षा
    gloss: शिक्षा / पढ़ाई
    note: تحصیل का अर्थ है शिक्षा या सामान्य रूप से पढ़ाई; यह इस इकाई का मुख्य विषय-शब्द है।
    example_gloss: शिक्षा अच्छी है।
  prs.a1.unit31.lesson01.teach.university_word:
    title: विश्वविद्यालय
    gloss: विश्वविद्यालय
    note: پوهنتون का अर्थ है विश्वविद्यालय। यह अफ़ग़ानिस्तान का मानक शब्द है (जैसे काबुल विश्वविद्यालय के नाम में), जो ईरानी دانشگاه से अलग है।
    example_gloss: विश्वविद्यालय काबुल में है।
  prs.a1.unit31.lesson01.teach.school_word:
    title: स्कूल
    gloss: स्कूल
    note: مکتب का अर्थ है स्कूल।
    example_gloss: यह स्कूल अच्छा है।
  prs.a1.unit31.lesson01.teach.field_word:
    title: पढ़ाई का विषय
    gloss: पढ़ाई का विषय / मेजर
    note: رشته का अर्थ है पढ़ाई का विषय या विश्वविद्यालय का मेजर; यह फ़ारसी और दरी दोनों में प्रचलित मानक शब्द है।
    example_gloss: मेरा विषय चिकित्सा है।
  prs.a1.unit31.lesson01.teach.student_word:
    title: छात्र
    gloss: छात्र
    note: محصل का अर्थ है विश्वविद्यालय का छात्र। यह अफ़ग़ान दरी का मानक शब्द है, जो ईरानी دانشجو से अलग है।
    example_gloss: वह छात्र है।
  prs.a1.unit31.lesson01.teach.lesson_word:
    title: पाठ
    gloss: पाठ
    note: درس का अर्थ है पाठ। خواندن (पढ़ना) के साथ मिलकर यह "पढ़ाई करना" का संयुक्त क्रिया-रूप बनाता है।
    example_gloss: मैं हर दिन पढ़ाई करता हूँ।
  prs.a1.unit31.lesson01.teach.review_khandan:
    title: पढ़ना
    gloss: पाठ + पढ़ना → मैं पढ़ाई करता/करती हूँ
    note: درس (पाठ) और خواندن (पढ़ना) मिलकर درس می‌خوانم (मैं पढ़ाई करता/करती हूँ) बनाते हैं। इसका शाब्दिक अर्थ है "मैं पाठ पढ़ता हूँ"; यह इस कोर्स में संयुक्त क्रिया का एक बिल्कुल नया पैटर्न है।
    target_text: درس (पाठ) + خواندن (पढ़ना) = درس می‌خوانم (मैं पढ़ाई करता/करती हूँ)
  prs.a1.unit31.lesson01.teach.combined_sentence:
    title: मैं विश्वविद्यालय में पढ़ता/पढ़ती हूँ
    gloss: मैं विश्वविद्यालय में पढ़ता/पढ़ती हूँ।
    note: इसमें من (मैं, दोहराव), در (में, दोहराव), پوهنتون और درس می‌خوانم एक साथ आए हैं।
  prs.a1.unit31.lesson02.teach.medicine_word:
    title: दवा
    gloss: दवा
    note: طب का अर्थ है पढ़ाई के विषय के रूप में चिकित्सा; यह फ़ारसी और दरी दोनों में प्रचलित मानक शब्द है।
    example_gloss: चिकित्सा कठिन है।
  prs.a1.unit31.lesson02.teach.law_word:
    title: कानून
    gloss: कानून
    note: حقوق का अर्थ है पढ़ाई के विषय के रूप में कानून; यह फ़ारसी और दरी दोनों में प्रचलित मानक शब्द है।
    example_gloss: कानून दिलचस्प है।
  prs.a1.unit31.lesson02.teach.economics_word:
    title: अर्थशास्त्र
    gloss: अर्थशास्त्र
    note: اقتصاد का अर्थ है पढ़ाई के विषय के रूप में अर्थशास्त्र; यह फ़ारसी और दरी दोनों में प्रचलित मानक शब्द है।
    example_gloss: अर्थशास्त्र भी कठिन है।
  prs.a1.unit31.lesson02.teach.literature_word:
    title: साहित्य
    gloss: साहित्य
    note: ادبیات का अर्थ है पढ़ाई के विषय के रूप में साहित्य; यह फ़ारसी और दरी दोनों में प्रचलित मानक शब्द है।
    example_gloss: मुझे साहित्य पसंद है।
  prs.a1.unit31.lesson02.teach.reshte_ast_phrase:
