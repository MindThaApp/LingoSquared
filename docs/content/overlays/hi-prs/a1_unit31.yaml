    title: 'परवीन: मैं काबुल विश्वविद्यालय में पढ़ती हूँ। मेरा विषय चिकित्सा है।'
    gloss: मैं काबुल विश्वविद्यालय में पढ़ती हूँ। मेरा विषय चिकित्सा है।
