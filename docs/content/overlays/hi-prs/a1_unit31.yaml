    title: शिक्षा के बारे में पढ़ें
    gloss: परवीन काबुल विश्वविद्यालय में पढ़ती है। उसका विषय चिकित्सा है। चिकित्सा कठिन है, लेकिन दिलचस्प है। करीम स्कूल में पढ़ता है।
