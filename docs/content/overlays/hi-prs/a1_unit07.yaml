    - الو؟
    accepted_answers:
    - value: ببخشین، کی صحبت می‌کند؟
      status: correct
    feedback: کی صحبت می‌کند؟ का शाब्दिक अर्थ है "कौन बोल रहा है"।
  prs.a1.unit07.lesson02.exercise02.recognize_this_is:
    instruction: कौन-सा वाक्यांश बताता है कि बोलने वाला फ़रीद है?
    correct_option: من فرید استم
    distractors:
    - ببخشین، کی صحبت می‌کند؟
    - همکار همایون استم
    - بلی، بفرمایین
    accepted_answers:
    - value: من فرید استم
      status: correct
    feedback: من فرید استم सीधे बोलने वाले का नाम बताता है।
  prs.a1.unit07.lesson02.exercise03.recognize_who_speaking_reading:
    instruction: यह प्रश्न क्या पूछता है?
    correct_option: माफ़ कीजिए, कौन बोल रहा है?
    distractors:
