      status: correct
    feedback: بلی، بفرمایین का अर्थ है "हाँ, बताइए"।
  prs.a1.unit07.lesson01.exercise07.speak_answer_phone:
    instruction: आपका फ़ोन बज रहा है। उसे उठाइए और फ़ोन करने वाले को बात आगे बढ़ाने के लिए कहिए।
