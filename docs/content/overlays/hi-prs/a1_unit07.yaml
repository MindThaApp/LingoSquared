teaching:
  prs.a1.unit07.lesson01.teach.alo:
    title: हैलो (फ़ोन पर)
    gloss: हैलो (फ़ोन पर)
    note: الو विशेष रूप से फ़ोन उठाने या कॉल शुरू करने के लिए बोला जाता है; आमने-सामने के लिए سلام बोला जाता है।
    example_gloss: हैलो, मैं करीम बोल रहा हूँ।
  prs.a1.unit07.lesson01.teach.goosh_astam:
    title: फ़ोन करने वाले को बात जारी रखने को कहिए
    gloss: हाँ, ज़रूर।
    note: फ़ोन उठाने के बाद जवाब देने का स्वाभाविक तरीका بلی، بفرمایین है। इसमें वही विनम्र بفرمایین ('कृपया'/'कहिए') है जो इस कोर्स में पहले भी आया है — यह 'मैं सुन रहा हूँ' का शब्दशः अनुवाद नहीं है।
  prs.a1.unit07.lesson01.teach.telephone_review:
    title: टेलीफ़ोन (दोहराव)
    gloss: टेलीफ़ोन
    note: تلفن शब्द संख्याओं वाली इकाई में आया था; यहाँ यह पूरी इकाई की पृष्ठभूमि है।
    example_gloss: मेरा फ़ोन ख़राब है।
  prs.a1.unit07.lesson02.teach.who_speaking:
    title: पूछिए कि कौन फ़ोन कर रहा है
    gloss: माफ़ कीजिए, कौन बोल रहा है?
    note: ببخشین، کی صحبت می‌کند؟ विनम्रता से फ़ोन करने वाले की पहचान पूछता है।
  prs.a1.unit07.lesson02.teach.this_is_speaking:
    title: अपना परिचय दीजिए
    gloss: मैं फ़रीद बोल रहा हूँ।
    note: من فرید استم सीधे बताता है कि कौन फ़ोन कर रहा है; इसमें पिछली इकाइयों वाला استم का ढाँचा है।
  prs.a1.unit07.lesson02.teach.colleague_context:
    title: जिसे फ़ोन किया है उससे अपना संबंध बताइए
    gloss: मैं हुमायूँ का सहकर्मी हूँ।
    note: همکار همایون استم बताता है कि आप क्यों फ़ोन कर रहे हैं; यह तब काम आता है जब फ़ोन उठाने वाला आपको नहीं जानता।
  prs.a1.unit07.lesson03.teach.speak_slowly:
    title: किसी से धीरे बोलने को कहिए
    gloss: कृपया धीरे बोलिए।
    note: لطفاً آهسته صحبت کنین फ़ोन पर आवाज़ साफ़ न आने पर, या नई भाषा सीखने वाले के लिए, एक स्वाभाविक और विनम्र अनुरोध है।
  prs.a1.unit07.lesson03.teach.repeat_review:
    title: किसी से दोहराने को कहिए (दोहराव)
    gloss: क्या आप दोबारा कह सकते हैं?
    note: می‌توانین دوباره بگویین؟ परिचय वाली इकाई में आया था; यह फ़ोन कॉल पर भी उतना ही स्वाभाविक है।
  prs.a1.unit07.lesson03.teach.combined_request:
    title: दोनों अनुरोध मिलाइए
    gloss: कृपया धीरे बोलिए और दोबारा कहिए।
    note: و दोनों अनुरोधों को जोड़कर एक स्वाभाविक वाक्यांश बना देता है।
  prs.a1.unit07.lesson04.teach.payam_word:
    title: संदेश
    gloss: संदेश
    note: پیام संदेश के लिए सामान्य शब्द है, चाहे वह बोला हुआ हो या लिखा हुआ।
    example_gloss: मेरे पास आपके लिए एक संदेश है।
  prs.a1.unit07.lesson04.teach.want_to_leave_message:
    title: कहिए कि आप संदेश छोड़ना चाहते हैं
    gloss: मैं एक संदेश छोड़ना चाहता हूँ।
    note: می‌خواهم یک پیام بگذارم वह वाक्य है जो आप तब बोलते हैं जब जिसे आप फ़ोन कर रहे हैं वह उपलब्ध नहीं होता।
  prs.a1.unit07.lesson04.teach.will_call_later:
    title: कहिए कि आप बाद में फ़ोन करेंगे
    gloss: मैं बाद में फ़ोन करूँगा।
    note: بعد زنگ می‌زنم संदेश छोड़ने का एक सरल विकल्प है।
  prs.a1.unit07.lesson05.teach.short_message:
    title: टेक्स्ट मैसेज
    gloss: टेक्स्ट संदेश (छोटा संदेश)
    note: پیام کوتاه का शाब्दिक अर्थ 'छोटा संदेश' है; टेक्स्ट संदेश के लिए यही रोज़मर्रा का शब्द है।
  prs.a1.unit07.lesson05.teach.meeting_tomorrow:
    title: एक नमूना संदेश
    gloss: कल बैठक नौ बजे है।
    note: فردا جلسه ساعت نه است संदेश में पहुँचाने के लिए एक स्वाभाविक और पूरी जानकारी है।
  prs.a1.unit07.lesson05.teach.will_deliver:
    title: पक्का कीजिए कि आप संदेश पहुँचा देंगे
    gloss: मैं पहुँचा दूँगा।
    note: می‌رسانم पक्का करता है कि संदेश सही व्यक्ति तक पहुँचेगा।
  prs.a1.unit07.lesson06.teach.turn01:
    title: लीमा फ़ोन उठाती है
    gloss: लीमा फ़ोन के अभिवादन से जवाब देती है।
    note: الو؟ आने वाली कॉल का जवाब देने का मानक तरीका है।
  prs.a1.unit07.lesson06.teach.turn02:
    title: फ़रीद उसका अभिवादन करता है और पुष्टि करता है कि वह कौन है
    gloss: फ़रीद उसका अभिवादन करता है और पूछता है कि क्या वह लीमा है।
    note: الو، سلام फ़ोन के अभिवादन को रोज़मर्रा के अभिवादन के साथ जोड़ता है।
  prs.a1.unit07.lesson06.teach.turn03:
    title: लीमा उसे बात जारी रखने को कहती है और पूछती है कि कौन बोल रहा है
    gloss: लीमा उसे बात जारी रखने को कहती है और पूछती है कि कौन बोल रहा है।
    note: بلی، بفرمایین और کی صحبت می‌کند؟ दोनों पिछले पाठों में आ चुके हैं।
  prs.a1.unit07.lesson06.teach.turn04:
    title: फ़रीद अपना परिचय देता है
    gloss: फ़रीद कहता है कि वह हुमायूँ का सहकर्मी है।
    note: यहाँ पिछले पाठ वाला सहकर्मी के संदर्भ का ढाँचा दोहराया गया है, जिससे लीमा के पास कॉल पर भरोसा करने का कारण होता है।
  prs.a1.unit07.lesson06.teach.turn05:
    title: लीमा उससे धीरे बोलने को कहती है
    gloss: लीमा उसका अभिवादन करती है और उससे धीरे बोलने को कहती है।
    note: آهسته صحبت کنین، لطفاً में पिछले पाठ वाला अनुरोध दोहराया गया है।
  prs.a1.unit07.lesson06.teach.turn06:
    title: फ़रीद मान जाता है और संदेश छोड़ने को कहता है
    gloss: फ़रीद मान जाता है और कहता है कि वह हुमायूँ के लिए संदेश छोड़ना चाहता है।
    note: यह पिछले पाठ के پیام वाले ढाँचे को आगे बढ़ाकर एक ख़ास प्राप्तकर्ता (برای همایون, 'हुमायूँ के लिए') बताता है।
  prs.a1.unit07.lesson06.teach.turn07:
    title: लीमा लिख लेने को तैयार होती है
    gloss: लीमा उसे बोलने को कहती है और कहती है कि वह लिख रही है।
    note: यहाँ بفرمایین फ़रीद को बात जारी रखने का निमंत्रण देता है।
  prs.a1.unit07.lesson06.teach.turn08:
    title: फ़रीद संदेश की बात बताता है
    gloss: फ़रीद उससे कहता है कि बता दे कि बैठक कल नौ बजे है।
    note: यह सीधे पाँचवें पाठ के नमूना संदेश की सामग्री को दोहराता है।
  prs.a1.unit07.lesson06.teach.turn09:
    title: लीमा पुष्टि करती है और पहुँचाने का वादा करती है
    gloss: लीमा ब्योरे की पुष्टि करती है और कहती है कि वह संदेश पहुँचा देगी।
    note: می‌رسانم फ़ोन कॉल में संदेश लेने वाले हिस्से को समाप्त करता है, जैसा पाठ 05 में सिखाया गया था।
  prs.a1.unit07.lesson06.teach.turn10:
    title: फ़रीद धन्यवाद देता है और अलविदा कहता है
    gloss: फ़रीद उसे बहुत धन्यवाद देता है और अलविदा कहता है।
    note: تشکر زیاد और خدا حافظ दोनों में पिछली इकाइयों की शब्दावली दोहराई गई है।
  prs.a1.unit07.lesson06.teach.turn11:
    title: लीमा अलविदा कहती है
    gloss: लीमा अलविदा कहती है।
    note: خدا حافظ कॉल को समाप्त करता है।
  prs.a1.unit07.lesson06.teach.past_tense_left:
    title: कहें कि किसी ने संदेश छोड़ा (भूतकाल)
    gloss: फ़रीद ने संदेश छोड़ा।
    note: گذاشت सरल भूतकाल (छोड़ा) है, उसी क्रिया का जो पाठ 04 के می‌خواهم یک پیام بگذارم में आई थी, जहाँ بگذارم का अर्थ है "मैं छोड़ूँ"। कॉल के बाद क्या हुआ, यह बताने के लिए इसका उपयोग करें।
    target_text: فرید پیام گذاشت (फ़रीद ने संदेश छोड़ा)
