teaching:
  prs.a1.unit05.lesson01.teach.bazaar:
    title: बाज़ार
    gloss: बाज़ार
    note: بازار दुकानों वाले इलाके के लिए रोज़मर्रा का शब्द है, अक्सर पूरी गली या पूरा मोहल्ला।
    example_gloss: बाज़ार पास है।
  prs.a1.unit05.lesson01.teach.bank:
    title: बैंक
    gloss: बैंक
    note: بانک सीधे उधार लिया गया शब्द है, जिसका प्रयोग हिंदी के "बैंक" की तरह ही होता है।
    example_gloss: बैंक कहाँ है?
  prs.a1.unit05.lesson01.teach.mosque:
    title: मस्जिद
    gloss: मस्जिद
    note: مسجد मस्जिद के लिए मानक शब्द है।
    example_gloss: मस्जिद बड़ी है।
  prs.a1.unit05.lesson01.teach.hospital:
    title: अस्पताल
    gloss: अस्पताल
    note: شفاخانه अस्पताल के लिए रोज़मर्रा का अफ़ग़ान दरी शब्द है -- यह ईरानी फ़ारसी के بیمارستان से अलग है, जिसे दरी बोलने वाले समझ तो सकते हैं पर खुद आम तौर पर इस्तेमाल नहीं करते।
    example_gloss: अस्पताल दूर है।
  prs.a1.unit05.lesson01.teach.school:
    title: स्कूल
    gloss: स्कूल
    note: مکتب स्कूल के लिए रोज़मर्रा का अफ़ग़ान दरी शब्द है -- यह ईरानी फ़ारसी के مدرسه से अलग है, जो दरी में आम तौर पर विशेष रूप से धार्मिक विद्यालय का अर्थ देता है।
    example_gloss: स्कूल घर के पास है।
  prs.a1.unit05.lesson01.teach.pharmacy:
    title: दवा की दुकान
    gloss: दवाखाना
    note: دواخانه दवाख़ाने के लिए रोज़मर्रा का अफ़ग़ान दरी शब्द है (دوا यानी दवा से बना) -- यह ईरानी फ़ारसी के داروخانه से अलग है।
    example_gloss: दवा की दुकान कहाँ है?
  prs.a1.unit05.lesson01.teach.va_word:
    title: और
    gloss: और
    note: و जगहों की सूची को जोड़ने वाला आम शब्द है।
    target_text: و (और)
  prs.a1.unit05.lesson02.teach.post_office:
    title: डाकघर
    gloss: डाकघर
    note: پوسته خانه में پوسته (डाक) और خانه (घर/इमारत) मिले हैं।
    example_gloss: डाकघर बंद है।
  prs.a1.unit05.lesson02.teach.embassy:
    title: दूतावास
    gloss: दूतावास
    note: سفارت दूतावास के लिए मानक शब्द है।
    example_gloss: दूतावास काबुल में है।
  prs.a1.unit05.lesson02.teach.airport:
    title: हवाई अड्डा
    gloss: हवाई अड्डा
    note: 'میدان هوایی हवाई अड्डे के लिए अफ़ग़ान दरी का रोज़मर्रा का शब्द है (शाब्दिक अर्थ: ''हवाई मैदान'')। यह ईरानी फ़ारसी के فرودگاه से अलग है।'
    example_gloss: हवाई अड्डा दूर है।
  prs.a1.unit05.lesson02.teach.office_review:
    title: दफ़्तर (दोहराव)
    gloss: दफ़्तर
    note: دفتر पहले की एक इकाई में आ चुका है; यहाँ इसे अन्य सार्वजनिक स्थानों के साथ रखा गया है।
    example_gloss: मेरा दफ़्तर पास है।
  prs.a1.unit05.lesson03.teach.kojast_bazaar:
    title: पूछें कि बाज़ार कहाँ है
    gloss: बाज़ार कहाँ है?
    note: بازار کجاست؟ किसी भी जगह के बारे में पूछने का बुनियादी ढाँचा है।
  prs.a1.unit05.lesson03.teach.kojast_hospital:
    title: पूछें कि अस्पताल कहाँ है
    gloss: अस्पताल कहाँ है?
    note: यही کجاست वाला ढाँचा किसी भी स्थान-संज्ञा के साथ चलता है।
  prs.a1.unit05.lesson03.teach.bebakhshid:
    title: विनम्रता से किसी का ध्यान खींचें
    gloss: माफ़ कीजिए, दवाखाना कहाँ है?
    note: ببخشین अजनबी से सवाल विनम्रता से शुरू करता है, जैसे हिंदी में "माफ़ कीजिए"।
  prs.a1.unit05.lesson03.teach.kojast_grammar:
    title: کجاست कैसे बनता है
    gloss: کجاست में کجا (कहाँ) और است (है) जुड़कर एक हो गए हैं।
    note: यह बनावट समझ लेने से आप کجاست को एक अनजाने टुकड़े की तरह रटने के बजाय उसका ढाँचा पहचान पाते हैं।
  prs.a1.unit05.lesson04.teach.near:
    title: पास
    gloss: के पास
    note: نزدیک किसी पास की चीज़ के लिए आता है।
    example_gloss: बैंक पास है।
  prs.a1.unit05.lesson04.teach.far:
    title: दूर
    gloss: दूर
    note: دور किसी दूरी पर स्थित चीज़ के लिए आता है।
    example_gloss: अस्पताल दूर है।
  prs.a1.unit05.lesson04.teach.here:
    title: यहाँ
    gloss: यहाँ
    note: این‌جا बोलने वाले की मौजूदा जगह को बताता है।
    example_gloss: बैंक यहाँ है।
  prs.a1.unit05.lesson04.teach.there:
    title: वहाँ
    gloss: वहाँ
    note: آن‌جا बोलने वाले से दूर की जगह को बताता है।
    example_gloss: दवाख़ाना वहाँ है।
  prs.a1.unit05.lesson04.teach.bazaar_near:
    title: कहें कि बाज़ार पास है
    gloss: बाज़ार पास है।
    note: بازار نزدیک است में वही است (है) आया है जो इस पाठ्यक्रम में बार-बार दिखा है।
  prs.a1.unit05.lesson04.teach.airport_far:
    title: कहें कि हवाई अड्डा दूर है
    gloss: हवाई अड्डा दूर है।
    note: میدان هوایی دور است में वही ढाँचा है, बस نزدیک की जगह دور है।
  prs.a1.unit05.lesson05.teach.next_to:
    title: के बगल में
    gloss: के बगल में
    note: در کنار का शाब्दिक अर्थ है 'के बगल में'।
  prs.a1.unit05.lesson05.teach.behind:
    title: पीछे
    gloss: पीछे
    note: پشت बताता है कि कोई जगह किसी दूसरी जगह के पीछे है।
    example_gloss: दवाख़ाना स्कूल के पीछे है।
  prs.a1.unit05.lesson05.teach.opposite:
    title: सामने / ठीक सामने
    gloss: सामने / ठीक सामने
    note: مقابل बताता है कि कोई जगह किसी दूसरी जगह के ठीक सामने है।
    example_gloss: बैंक मस्जिद के सामने है।
  prs.a1.unit05.lesson05.teach.hospital_next_to_mosque:
    title: अस्पताल की जगह मस्जिद के संदर्भ में बताएँ
    gloss: अस्पताल मस्जिद के बगल में है।
    note: شفاخانه در کنار مسجد است में एक स्थान, در کنار और است एक साथ आए हैं।
  prs.a1.unit05.lesson06.teach.tashakor_ziad:
    title: बहुत-बहुत धन्यवाद
    gloss: बहुत-बहुत धन्यवाद।
    note: تشکر زیاد पहले सीखे रोज़मर्रा के تشکر को और ज़ोरदार बना देता है।
  prs.a1.unit05.lesson06.teach.turn01:
    title: ज़र्मिना दवाख़ाना पूछती है
    gloss: ज़र्मिना एक राहगीर से विनम्रता से पूछती है कि दवाख़ाना कहाँ है।
    note: ببخشین सवाल को आदर के साथ शुरू करता है, जो अजनबी के लिए उचित है।
  prs.a1.unit05.lesson06.teach.turn02:
    title: राहगीर रास्ता बताता है
    gloss: राहगीर कहता है कि दवाख़ाना दूर नहीं है, सीधे जाइए, और वह स्कूल के बगल में है।
    note: 'इसमें इस इकाई के कई ढाँचे साथ आए हैं: دور نیست (دور का निषेध), مستقیم بروین और در کنار।'
  prs.a1.unit05.lesson06.teach.turn03:
    title: ज़र्मिना राहगीर को धन्यवाद देती है
    gloss: ज़र्मिना उसे बहुत-बहुत धन्यवाद देती है।
    note: تشکر زیاد बातचीत को विनम्रता से समाप्त करता है।
  prs.a1.unit05.lesson06.teach.turn04:
    title: राहगीर का विनम्र जवाब
    gloss: कोई बात नहीं / इसमें क्या है।
    note: قابلی نداره अफ़ग़ान दरी में धन्यवाद को विनम्रता से टालने का आम तरीक़ा है; काम में यह خواهش می‌کنم जैसा है, पर ज़्यादा बोलचाल का। نداره ندارد का बोलचाल रूप है; बोलने में نداره सुनाई देगा, जबकि सावधानी से लिखने में ندارد आता है।
