  prs.a1.unit06.lesson02.teach.turn_right:
    title: किसी को दाएँ मुड़ने को कहिए
    gloss: दाएँ मुड़ो।
    note: به راست بپیچین वही ढाँचा है, बस چپ की जगह راست है।
  prs.a1.unit06.lesson03.teach.first_word:
    title: पहले
    gloss: पहले
    note: اول रास्ते के निर्देशों में पहला चरण बताता है।
    example_gloss: पहले सीधे जाइए।
  prs.a1.unit06.lesson03.teach.then_word:
