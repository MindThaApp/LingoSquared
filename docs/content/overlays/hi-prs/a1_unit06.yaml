    title: सोहैला रास्ता पूछती है
    gloss: सोहैला एक दुकानदार से विनम्रता से पूछती है कि दवाख़ाने तक कैसे पहुँचे।
    note: ببخشین सवाल को आदर के साथ शुरू करता है, और می‌توانین بگویین؟ पाठ 4 का रास्ता पूछने का विनम्र वाक्यांश है।
  prs.a1.unit06.lesson06.teach.turn02:
    title: दुकानदार पहला क़दम बताता है
    gloss: दुकानदार हामी भरता है और कहता है कि पहले सीधे जाइए।
    note: اول مستقیم بروین रास्ता बताने के क्रम की शुरुआत करता है।
  prs.a1.unit06.lesson06.teach.turn03:
    title: सोहैला पुष्टि करती है और पूछती है कि आगे क्या
    gloss: सोहैला पुष्टि के लिए 'सीधे' दोहराती है, फिर पूछती है कि इसके बाद क्या करना है।
    note: بعد چطور؟ अगला क़दम पूछने का स्वाभाविक और संक्षिप्त तरीक़ा है।
  prs.a1.unit06.lesson06.teach.turn04:
    title: दुकानदार दूसरा क़दम और पहचान की जगह बताता है
    gloss: दुकानदार बाईं ओर मुड़ने को कहता है, फिर मस्जिद और बैंक को निशानी बनाकर दवाख़ाने की जगह बताता है।
    note: इसमें पाठ 2 का मुड़ने का निर्देश और पाठ 5 का निशानी बताने वाला ढाँचा एक साथ आए हैं।
  prs.a1.unit06.lesson06.teach.turn05:
    title: सोहैला धन्यवाद देती है और बताती है कि वह समझ गई
    gloss: सोहैला बहुत धन्यवाद कहती है और बताती है कि वह समझ गई।
    note: تشکر زیاد، فهمیدم बातचीत को सलीक़े से समाप्त करता है, जैसा पाठ 4 में सिखाया गया था।
  prs.a1.unit06.lesson06.teach.turn06:
    title: दुकानदार का विनम्र जवाब और विदाई
    gloss: दुकानदार धन्यवाद को टालते हुए उसे शुभ यात्रा की कामना देता है।
    note: قابلی نداره स्थानों वाली इकाई में आया था; سفر خوش (शुभ यात्रा) किसी ऐसे व्यक्ति के लिए स्वाभाविक विदाई है जो पैदल कहीं जाने वाला हो।
