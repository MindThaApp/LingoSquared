    gloss: मस्जिद के बाद बैंक आपके सामने है।
    note: بعد از مسجد، بانک روبه‌روی شماست में पहचान-स्थल (بعد از مسجد) और सापेक्ष स्थान (روبه‌روی شماست) जुड़े हैं।
  prs.a1.unit06.lesson05.teach.maktab_review:
    title: स्कूल (दोहराव)
    gloss: स्कूल
    note: مکتب जगहों वाली इकाई में आया था; यहाँ अभ्यास-वाक्य में इसे पहचान-स्थल के रूप में इस्तेमाल किया गया है।
    example_gloss: स्कूल पास है।
