    gloss: तब
    note: بعد पहले चरण के बाद का अगला चरण बताता है।
    example_gloss: फिर बाएँ मुड़िए।
  prs.a1.unit06.lesson03.teach.sequenced_example:
    title: दो चरणों को जोड़िए
    gloss: पहले सीधे जाइए, फिर दाएँ मुड़िए।
    note: اول और بعد से आप एक ही निर्देश में कई चरण क्रम से बता सकते हैं।
  prs.a1.unit06.lesson04.teach.polite_ask:
    title: विनम्रता से पूछिए कि कहीं कैसे पहुँचें
    gloss: क्या आप बता सकते हैं कि बाज़ार कैसे जाऊँ?
    note: می‌توانین بگویین...؟ 'क्या आप बता सकते हैं...?' पूछने का विनम्र तरीका है और अजनबी से रास्ता पूछने के लिए ठीक है। بروم का मतलब 'मैं जाऊँ' है, यानी पूरा वाक्य पूछता है कि मैं वहाँ कैसे पहुँचूँ।
  prs.a1.unit06.lesson04.teach.bebakhshid_review:
    title: पूछिए कि जगह कहाँ है (दोहराव)
    gloss: माफ़ कीजिए, दवाखाना कहाँ है?
    note: ببخشین، [जगह] کجاست؟ जगहों वाली इकाई में आया था; रास्ता पूछने से पहले यह स्वाभाविक शुरुआत है।
  prs.a1.unit06.lesson04.teach.fahmidam:
    title: बताइए कि आप समझ गए
    gloss: बहुत धन्यवाद, मैं समझ गया।
    note: تشکر زیاد، فهمیدم बातचीत को विनम्रता से समाप्त करता है और बताता है कि रास्ता साफ़ समझ आ गया।
  prs.a1.unit06.lesson04.teach.daftar_review:
    title: दफ़्तर (दोहराव)
    gloss: दफ़्तर
    note: دفتر पहले की इकाई में आ चुका है; यहाँ इसे गंतव्य के रूप में विनम्रता से रास्ता पूछने के अभ्यास में इस्तेमाल किया गया है।
    example_gloss: दफ़्तर पास है।
  prs.a1.unit06.lesson05.teach.after_word:
