    gloss: के बाद
    note: بعد از उस पहचान-स्थल को बताता है जो मंज़िल से पहले आता है।
    example_gloss: मस्जिद के बाद बैंक है।
  prs.a1.unit06.lesson05.teach.opposite_review:
    title: के सामने
    gloss: के सामने
    note: روبه‌رو शब्द مقابل (सामने) का नया पर्याय है, जो जगहों वाली इकाई में आया था; रोज़मर्रा की दरी में दोनों 'सामने' के लिए चलते हैं।
    example_gloss: बैंक मस्जिद के सामने है।
  prs.a1.unit06.lesson05.teach.landmark_example:
