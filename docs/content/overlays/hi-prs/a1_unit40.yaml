    note: می‌توانین, کنین, به और زود (पिछली इकाइयों से) दूसरे शब्दों के साथ मिलकर विनम्र अनुरोध और आज्ञाएँ बनाते हैं।
    target_text: می‌توانین (क्या आप सकते हैं) / کنین (कीजिए) / به (को/के लिए) / زود (जल्दी)
