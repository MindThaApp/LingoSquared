    gloss: दुकानदार ग्राहक का स्वागत करता है और पूछता है कि वे क्या लेंगे।
    note: چی میل دارین؟ बातचीत शुरू करने वाला विनम्र प्रश्न है। यह काम में چی دارین؟ जैसा है, पर इसमें ग्राहक की पसंद पूछी जाती है।
  prs.a1.unit08.lesson06.teach.turn02:
    title: ग्राहक पूछता है कि क्या उपलब्ध है
    gloss: ग्राहक दुकानदार को सलाम करता है और पूछता है कि क्या उपलब्ध है।
    note: چی دارین؟ से ऑर्डर की बातचीत शुरू होती है, जो पाठ 3 में आया था।
  prs.a1.unit08.lesson06.teach.turn03:
    title: दुकानदार बताता है कि क्या उपलब्ध है
    gloss: दुकानदार कहता है कि उनके पास पुलाव और क़ोरमा है, दोनों ताज़ा।
