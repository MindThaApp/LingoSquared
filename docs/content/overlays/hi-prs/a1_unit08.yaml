    title: ग्राहक पूरा ऑर्डर देता है
    gloss: ग्राहक मान जाता है और क़ोरमा के साथ एक प्लेट पुलाव और एक चाय का ऑर्डर देता है।
    note: इसमें पाठ 4 का मात्रा वाला ढाँचा और पाठ 1 के खाने के शब्द एक साथ आए हैं।
  prs.a1.unit08.lesson06.teach.turn05:
    title: दुकानदार ऑर्डर स्वीकार करता है
    gloss: दुकानदार कहता है कि वह अभी लाता है।
    note: چشم का शाब्दिक अर्थ 'मेरी आँख पर' है; यह 'ज़रूर' कहने का आदरपूर्ण तरीक़ा है। می‌آرم، می‌آورم (मैं लाता हूँ) का बोलचाल रूप है, और همین حالا का अर्थ है 'अभी इसी वक़्त'।
  prs.a1.unit08.lesson06.teach.turn06:
    title: ग्राहक खाने की तारीफ़ करता है और बिल माँगता है
    gloss: ग्राहक कहता है कि बहुत स्वादिष्ट था और बिल माँगता है।
    note: दोनों वाक्यांश सीधे पाठ 05 की शब्दावली का दोबारा प्रयोग करते हैं।
  prs.a1.unit08.lesson06.teach.turn07:
    title: दुकानदार कुल रक़म बताता है
    gloss: दुकानदार धन्यवाद कहता है और बताता है कि कुल दो सौ अफ़ग़ानी हुए।
    note: افغانی अफ़ग़ानिस्तान की मुद्रा है; दाम बताने के लिए دوصد (दो सौ) मुद्रा के नाम के साथ आता है।
