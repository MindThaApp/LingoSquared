teaching:
  prs.a1.unit02.lesson01.teach.name_question_polite:
    title: किसी का नाम शिष्टता से पूछना
    gloss: आपका नाम क्या है?
    note: نام‌تان چیست؟ किसी नए वयस्क परिचित के लिए सम्मानजनक रूप है, जो इकाई 1 की شما/استین शैली को आगे बढ़ाता है।
  prs.a1.unit02.lesson01.teach.name_answer:
    title: است के साथ अपना नाम बताना
    gloss: मेरा नाम फ़रीदून है।
    note: نام من ... است नाम बताने का लिखित रूप है। बोलचाल में लोग प्रायः نامم ... است कहते हैं (نامم = نام + -م, मेरा नाम)। दोनों सही हैं।
  prs.a1.unit02.lesson01.teach.i_am_name:
    title: استم के साथ अपना नाम बताना
    gloss: मैं फ़रीदून हूँ।
    note: استم नाम के ठीक बाद आता है; यह इकाई 1 की तरह उत्तम पुरुष की वही दरी क्रिया है।
  prs.a1.unit02.lesson01.teach.name_question_informal:
    title: किसी करीबी दोस्त का नाम पूछना
    gloss: तुम्हारा नाम क्या है?
    note: نامت چیست؟ में अनौपचारिक स्वामित्व-प्रत्यय -ت है। इसे केवल बराबरी के साथी या करीबी दोस्त के लिए रखें, ठीक वैसे ही जैसे इकाई 1 में تو/استی।
  prs.a1.unit02.lesson01.teach.what_is_your_name_word:
    title: '"नाम" के लिए शब्द'
    gloss: नाम
    note: نام एक स्वतंत्र संज्ञा है, जो ऊपर के आदरपूर्ण और अनौपचारिक दोनों प्रश्नों में आया है।
    example_gloss: आपका नाम क्या है?
  prs.a1.unit02.lesson01.teach.register_note:
    title: आदरपूर्ण बनाम करीबी दोस्त वाला अधिकारबोधक रूप
    gloss: -تان उस व्यक्ति के लिए जिससे आप आदर से बात करते हैं; -ت करीबी दोस्त के लिए।
    note: इकाई 1 वाला शिष्टता-भेद (شما/تو) نام के साथ लगने वाले अधिकारबोधक प्रत्ययों में भी वैसा ही रहता है।
  prs.a1.unit02.lesson02.teach.where_from_polite:
    title: पूछें कि कोई कहाँ से है
    gloss: आप कहाँ से हैं?
    note: شما از کجا استین؟ में आदरसूचक شما और استین की जोड़ी बनी रहती है।
  prs.a1.unit02.lesson02.teach.from_kabul:
    title: कहिए कि आप काबुल से हैं
    gloss: मैं काबुल से हूँ।
    note: من از کابل استم उसी من از [जगह] استم ढाँचे पर बना है, जो किसी भी शहर के लिए चलता है।
  prs.a1.unit02.lesson02.teach.from_herat:
    title: कहिए कि आप हेरात से हैं
    gloss: मैं हेरात से हूँ।
    note: هرات अफ़ग़ानिस्तान के पश्चिम का एक प्रमुख शहर है।
  prs.a1.unit02.lesson02.teach.from_mazar:
    title: कहिए कि आप मज़ार-ए-शरीफ़ से हैं
    gloss: मैं मज़ार-ए-शरीफ़ से हूँ।
    note: مزار شریف दो शब्दों में लिखा जाता है और यह अफ़ग़ानिस्तान के उत्तर का एक प्रमुख शहर है।
  prs.a1.unit02.lesson02.teach.country:
    title: अफ़ग़ानिस्तान
    gloss: अफ़ग़ानिस्तान
    note: افغانستان का प्रयोग از के बाद वैसे ही होता है जैसे किसी शहर के नाम का।
    example_gloss: मैं अफ़ग़ानिस्तान से हूँ।
  prs.a1.unit02.lesson02.teach.city_word:
    title: '"शहर" के लिए शब्द'
    gloss: शहर
    note: شهر सामान्य रूप से शहर को कहते हैं; यह किसी खास शहर के नाम से अलग है।
    example_gloss: काबुल एक बड़ा शहर है।
  prs.a1.unit02.lesson03.teach.occupation_question:
    title: पूछिए कि कोई क्या काम करता है
    gloss: आप क्या काम करते हैं?
    note: کار شما چیست؟ का शाब्दिक अर्थ है "आपका काम क्या है"; पेशा पूछने का यही सामान्य तरीका है।
  prs.a1.unit02.lesson03.teach.doctor:
    title: डॉक्टर
    gloss: डॉक्टर
    note: داکتر पेशे के लिए प्रचलित दरी शब्द है; यह चिकित्सक के लिए और अनौपचारिक रूप से डॉक्टरेट वाले व्यक्ति के लिए भी प्रयोग होता है।
    example_gloss: वह डॉक्टर है।
  prs.a1.unit02.lesson03.teach.teacher:
    title: शिक्षक
    gloss: शिक्षक / शिक्षिका
    note: معلم किसी भी स्तर के स्कूल के शिक्षक के लिए सामान्य शब्द है।
    example_gloss: वह शिक्षक है।
  prs.a1.unit02.lesson03.teach.engineer:
    title: इंजीनियर
    gloss: इंजीनियर
    note: مهندس सामान्य रूप से इंजीनियरों के लिए है, किसी एक खास शाखा के लिए नहीं।
    example_gloss: वह इंजीनियर है।
  prs.a1.unit02.lesson03.teach.shopkeeper:
    title: दुकानदार
    gloss: दुकानदार
    note: دوکاندار (دوکان, यानी दुकान, से बना) काबुल में रोज़मर्रा का शब्द है; इस कोर्स में ईरानी फ़ारसी مغازه की जगह दरी वर्तनी دوکان इस्तेमाल होती है।
    example_gloss: वह दुकानदार है।
  prs.a1.unit02.lesson03.teach.i_am_teacher:
    title: अपना पेशा बताइए
    gloss: मैं शिक्षिका हूँ।
    note: من [पेशा] استم इस पाठ में सिखाए गए किसी भी पेशे के लिए चलने वाला ढाँचा है।
  prs.a1.unit02.lesson04.teach.introduce_formal:
    title: औपचारिक रूप से किसी का परिचय कराएँ
    gloss: मुझे अपने सहकर्मी का परिचय कराने की अनुमति दीजिए।
    note: اجازه بدهین همکارم را معرفی کنم तीसरे व्यक्ति को बातचीत में शामिल करने का आदरपूर्ण तरीका है।
  prs.a1.unit02.lesson04.teach.this_is:
    title: जिसका परिचय करा रहे हैं, उसका नाम बताइए
    gloss: ये मेरी सहकर्मी आरज़ू हैं।
    note: این [व्यक्ति] است सीधे बताता है कि किसका परिचय कराया जा रहा है।
  prs.a1.unit02.lesson04.teach.pleased_after_intro:
    title: कहिए कि आपको मिलकर खुशी हुई
    gloss: आपसे मिलकर खुशी हुई।
    note: از آشنایی با شما خوش شدم वही पहली मुलाक़ात वाला वाक्यांश है जो इकाई 1 में आया था; यहाँ तीसरे व्यक्ति के परिचय के बाद फिर प्रयोग हुआ है।
  prs.a1.unit02.lesson04.teach.pleased_reply:
    title: उत्तर दीजिए कि आपको भी खुशी हुई
    gloss: मुझे भी खुशी हुई।
    note: من هم خوش شدم स्वाभाविक छोटा उत्तर है।
  prs.a1.unit02.lesson04.teach.friend_word:
    title: दोस्त
    gloss: दोस्त
    note: دوست दोस्त के लिए सामान्य शब्द है; इसमें निकटता का कोई संकेत नहीं होता।
    example_gloss: वह मेरा दोस्त है।
  prs.a1.unit02.lesson04.teach.colleague_word:
    title: सहकर्मी
    gloss: सहकर्मी
    note: همکار साथ काम करने वाले को कहते हैं; यह इकाई 1 के कार्यस्थल वाले संवाद में आ चुका है।
    example_gloss: वह मेरा सहकर्मी है।
  prs.a1.unit02.lesson05.teach.title_jenab:
    title: श्री / जनाब
    gloss: श्री / जनाब
    note: جناب आदरसूचक संबोधन के रूप में पुरुष के नाम या पदवी से पहले आता है और अफ़ग़ानिस्तान के शहरी रोज़मर्रा के प्रयोग में आम है।
    example_gloss: जनाब, कृपया आगे बढ़िए।
  prs.a1.unit02.lesson05.teach.title_khanom:
    title: श्रीमती / सुश्री
    gloss: श्रीमती / सुश्री
    note: خانم महिला के नाम से पहले आता है और वैवाहिक स्थिति की परवाह किए बिना प्रयोग होता है।
    example_gloss: मोहतरमा, कृपया आगे बढ़िए।
  prs.a1.unit02.lesson05.teach.title_with_name:
    title: किसी पुरुष को आदर से संबोधित करें
    gloss: श्री फ़रीदून
    note: جناب के साथ पहला नाम लगाना एक आम आदरपूर्ण संबोधन है; उपनाम ज़रूरी नहीं।
  prs.a1.unit02.lesson05.teach.title_with_name_female:
    title: किसी महिला को आदर से संबोधित करें
    gloss: सुश्री आरज़ू
    note: خانم के साथ पहला नाम पुरुष के लिए جناب की तरह ही चलता है।
  prs.a1.unit02.lesson05.teach.register_reminder:
    title: कब कौन-सा रूप प्रयोग करें
    gloss: अभी-अभी मिले व्यक्ति के साथ شما और استین का प्रयोग करें; تو और استی केवल करीबी दोस्त के साथ।
    note: यह इकाई 1 का शिष्टता-नियम है, जिसे यहाँ परिचय के संदर्भ में सीधे दोहराया गया है।
  prs.a1.unit02.lesson05.teach.polite_could_you:
    title: विनम्रता से किसी से नाम दोबारा बताने को कहें
    gloss: क्या आप अपना नाम फिर से बता सकते हैं?
    note: می‌توانین نام‌تان را دوباره بگویین؟ बिना असहजता पैदा किए दोहराने को कहने का स्वाभाविक और विनम्र तरीका है।
  prs.a1.unit02.lesson06.teach.gathering_word:
    title: सभा / पार्टी
    gloss: सभा
    note: مهمانی एक अनौपचारिक सामाजिक जमावड़े को कहते हैं, जो इस पाठ के संवाद की पृष्ठभूमि है।
    example_gloss: सभा अच्छी है।
  prs.a1.unit02.lesson06.teach.turn01:
    title: लैला परिचय की शुरुआत करती है
    gloss: लैला फ़रीदून का अभिवादन करती है और आदर से جناب कहकर उसका नाम पूछती है।
    note: लैला और फ़रीदून पहले कभी नहीं मिले, इसलिए वह शुरू से ही आदरपूर्ण शैली अपनाती है।
  prs.a1.unit02.lesson06.teach.turn02:
    title: फ़रीदून अपना नाम बताता है
    gloss: फ़रीदून अभिवादन का उत्तर देता है और अपना नाम बताता है।
    note: سلام علیکم इकाई 1 का पूरा अभिवादन है, जो पहली मुलाक़ात में उपयुक्त है। बातचीत में फ़रीदून نامم فریدون است कहता है (نامم = نام من, मेरा नाम), जो रोज़मर्रा का बोलचाल का रूप है।
  prs.a1.unit02.lesson06.teach.turn03:
    title: लैला पूछती है कि वह कहाँ से है
    gloss: लैला कहती है कि उसे मिलकर खुशी हुई और पूछती है कि वह कहाँ से है।
    note: वही از آشنایی با شما خوش شدم वाक्यांश इकाई 1 के कार्यस्थल वाले संवाद से यहाँ आया है।
  prs.a1.unit02.lesson06.teach.turn04:
    title: फ़रीदून उत्तर देता है और वही प्रश्न लौटाता है
    gloss: फ़रीदून कहता है कि वह हेरात से है और लैला से वही प्रश्न पूछता है।
    note: و شما؟ संक्षेप में वही प्रश्न लौटा देता है, जैसा इकाई 1 में देखा था।
  prs.a1.unit02.lesson06.teach.turn05:
    title: लैला उत्तर देती है और काम के बारे में पूछती है
    gloss: लैला कहती है कि वह काबुल से है और फ़रीदून से उसका पेशा पूछती है।
    note: बातचीत स्वाभाविक रूप से मूल स्थान से पेशे की ओर बढ़ती है।
  prs.a1.unit02.lesson06.teach.turn06:
    title: फ़रीदून उत्तर देता है और प्रश्न लौटाता है
    gloss: फ़रीदून कहता है कि वह इंजीनियर है और लैला से वही प्रश्न पूछता है।
    note: شما چطور؟ संदर्भ से समझे जा चुके प्रश्न को लौटाने का छोटा तरीका है।
  prs.a1.unit02.lesson06.teach.turn07:
    title: लैला अपना पेशा बताती है
    gloss: लैला कहती है कि वह शिक्षिका है।
    note: यह इकाई में पहले सिखाए गए ढाँचे से पेशे वाला आदान-प्रदान पूरा करता है।
  prs.a1.unit02.lesson06.teach.turn08:
    title: फ़रीदून तीसरे व्यक्ति का परिचय कराता है
    gloss: फ़रीदून अपनी सहकर्मी आरज़ू का परिचय कराता है।
    note: इससे बातचीत में तीसरा व्यक्ति शामिल होता है, और इसमें पाठ 4 का औपचारिक परिचय वाला वाक्यांश प्रयोग हुआ है।
  prs.a1.unit02.lesson06.teach.turn09:
    title: लैला आरज़ू का स्वागत करती है
    gloss: लैला आरज़ू का स्वागत करती है और आदर से उसे خانم कहकर संबोधित करती है।
