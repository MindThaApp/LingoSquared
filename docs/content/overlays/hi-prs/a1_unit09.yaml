teaching:
  prs.a1.unit09.lesson01.teach.shanbe_yakshanbe:
    title: शनिवार और रविवार
    gloss: शनिवार, रविवार
    note: شنبه (शनिवार) अफ़ग़ानिस्तान में सप्ताह का पहला दिन है; उसके बाद یکشنبه (रविवार) आता है।
    example_gloss:
    - आज शनिवार है।
    - कल रविवार है।
  prs.a1.unit09.lesson01.teach.doshanbe_seshanbe:
    title: सोमवार और मंगलवार
    gloss: सोमवार, मंगलवार
    note: دوشنبه और سه‌شنبه का शाब्दिक अर्थ شنبه के बाद का 'दूसरा दिन' और 'तीसरा दिन' है।
    example_gloss:
    - सोमवार को मेरी कक्षा है।
    - मंगलवार को मेरी मुलाक़ात तय है।
  prs.a1.unit09.lesson01.teach.chaharshanbe_panjshanbe:
    title: बुधवार और गुरुवार
    gloss: बुधवार, गुरुवार
    note: چهارشنبه और پنجشنبه में वही 'चौथा दिन'/'पाँचवाँ दिन' वाला क्रम चलता है।
    example_gloss:
    - मैं बुधवार को काम करता हूँ।
    - गुरुवार को मिलते हैं।
  prs.a1.unit09.lesson01.teach.jomeh:
    title: शुक्रवार
    gloss: शुक्रवार
    note: جمعه अफ़ग़ानिस्तान में साप्ताहिक छुट्टी का दिन है, जैसे हमारे यहाँ रविवार की छुट्टी होती है।
    example_gloss: शुक्रवार की छुट्टी है।
  prs.a1.unit09.lesson01.teach.tarikh_word:
    title: तारीख़
    gloss: तारीख़
    note: تاریخ कैलेंडर की तारीख़ के लिए सामान्य शब्द है।
    example_gloss: आज की तारीख़ क्या है?
  prs.a1.unit09.lesson01.teach.va_word:
    title: और
    gloss: और
    note: و इस इकाई में हर जगह इस्तेमाल होने वाला जोड़ने वाला शब्द है।
    target_text: و (और)
  prs.a1.unit09.lesson01.teach.weekend_note:
    title: साप्ताहिक छुट्टी
    gloss: शुक्रवार साप्ताहिक छुट्टी का दिन है।
    note: शनिवार-रविवार के सप्ताहांत से अलग, अफ़ग़ानिस्तान में मुख्य साप्ताहिक छुट्टी *جمعه* (शुक्रवार) को होती है; गुरुवार को अक्सर आधा दिन काम होता है।
  prs.a1.unit09.lesson02.teach.hamal:
    title: हमल (पहला महीना)
    gloss: हमल, हिजरी शमसी कैलेंडर का पहला महीना (लगभग मार्च के अंत से अप्रैल)
    note: حمل से अफ़ग़ान सौर वर्ष शुरू होता है, जो नवरोज़ के नए साल के साथ पड़ता है।
    example_gloss: हमल साल का पहला महीना है।
  prs.a1.unit09.lesson02.teach.sawr:
    title: सौर (दूसरा महीना)
    gloss: सौर, दूसरा महीना (लगभग अप्रैल-मई)
    note: ثور حمل के बाद आता है।
    example_gloss: सौर में मौसम अच्छा रहता है।
  prs.a1.unit09.lesson02.teach.jawza:
    title: जौज़ा (तीसरा महीना)
    gloss: जौज़ा, तीसरा महीना (लगभग मई-जून)
    note: جوزا ثور के बाद आता है।
    example_gloss: मेरा जन्म जौज़ा में हुआ था।
  prs.a1.unit09.lesson02.teach.calendar_note:
    title: अफ़ग़ानिस्तान का कैलेंडर
    gloss: अफ़ग़ानिस्तान हिजरी शमसी (सौर हिजरी) कैलेंडर का उपयोग करता है।
    note: यह वही सौर कैलेंडर प्रणाली है जो ईरान में उपयोग होती है; यह ग्रेगोरियन और चंद्र हिजरी कैलेंडर दोनों से अलग है।
  prs.a1.unit09.lesson03.teach.what_day_today:
    title: पूछें कि आज कौन सा दिन है
    gloss: आज कौन-सा दिन है?
    note: امروز چند شنبه است؟ का शाब्दिक अर्थ है «आज कौन सा -शन्बे है», और सप्ताह का दिन पूछने का यही स्वाभाविक तरीका है।
  prs.a1.unit09.lesson03.teach.today_word:
    title: आज
    gloss: आज
    note: امروز वर्तमान दिन को बताता है।
    example_gloss: आज की तारीख़ क्या है?
  prs.a1.unit09.lesson04.teach.give_full_date:
    title: पूरी तारीख़ बताएँ
    gloss: आज गुरुवार है, हमल की 15 तारीख।
    note: امروز پنجشنبه، پانزدهم حمل است में सप्ताह का दिन, क्रमसूचक तारीख और महीने का नाम एक साथ आते हैं।
  prs.a1.unit09.lesson05.teach.which_day_meeting:
    title: पूछें कि कोई कार्यक्रम किस दिन है
    gloss: बैठक किस दिन है?
    note: جلسه کدام روز است؟ में किसी कार्यक्रम का दिन पूछने के लिए کدام (कौन सा) का प्रयोग होता है।
  prs.a1.unit09.lesson05.teach.which_date:
    title: कोई खास तारीख पूछें
    gloss: सोमवार हमल की कौन सी तारीख को है?
    note: دوشنبه چندم حمل است؟ पूछता है कि सोमवार महीने की कौन सी तारीख को पड़ता है।
  prs.a1.unit09.lesson06.teach.nozdahom:
    title: 19वाँ
    gloss: 19वाँ
    note: '*نوزدهم* उन्नीस का क्रमसूचक रूप है और यह *پانزدهم* (15वाँ) जैसा ही क्रमसूचक नियम अपनाता है।'
    example_gloss: आज 19 तारीख है।
  prs.a1.unit09.lesson06.teach.turn01:
    title: हुमायूँ बैठक के दिन के बारे में पूछता है
    gloss: हुमायूँ बशीर से पूछता है कि बैठक किस दिन है।
    note: جلسه کدام روز است؟ पाठ 5 से।
  prs.a1.unit09.lesson06.teach.turn02:
    title: बशीर जवाब देता है
    gloss: बशीर कहता है कि उसे लगता है सोमवार है।
    note: فکر می‌کنم (मुझे लगता है) जवाब को नरम बनाता है, क्योंकि बशीर को पूरा यकीन नहीं है।
  prs.a1.unit09.lesson06.teach.turn03:
    title: हुमायूँ सही तारीख पूछता है
    gloss: हुमायूँ पूछता है कि सोमवार हमल की कौन सी तारीख को है।
    note: دوشنبه چندم حمل است؟ पाठ 5 से।
  prs.a1.unit09.lesson06.teach.turn04:
    title: बशीर सही तारीख बताता है
    gloss: बशीर कहता है कि सोमवार हमल की 19 तारीख को है।
    note: '*دوشنبه نوزدهم حمل است* में दिन, क्रमसूचक तारीख और महीना एक साथ आते हैं, जैसा पाठ 4 के ढाँचे में सिखाया गया था।'
  prs.a1.unit09.lesson06.teach.turn05:
    title: हुमायूँ शुक्रवार के बारे में पूछता है
    gloss: हुमायूँ सहमत होता है और पूछता है कि क्या बशीर शुक्रवार को खाली है।
    note: وقت داری؟ (क्या तुम्हारे पास समय है?) खाली होने के बारे में पूछने का स्वाभाविक तरीका है।
  prs.a1.unit09.lesson06.teach.turn06:
    title: बशीर कहता है कि वह व्यस्त है
    gloss: बशीर मना करता है; वह शुक्रवार को व्यस्त है।
    note: مصروف استم (मैं व्यस्त हूँ) बताता है कि शुक्रवार क्यों संभव नहीं है।
  prs.a1.unit09.lesson06.teach.turn07:
    title: हुमायूँ सोमवार पक्का करता है
    gloss: हुमायूँ कहता है कि कोई बात नहीं, वह बशीर से सोमवार को मिलेगा।
    note: مشکل نیست (कोई बात नहीं) समय के टकराव को सहज करता है, फिर सोमवार की पहली योजना पक्की की जाती है।
