teaching:
  prs.a1.unit01.lesson01.teach.alef_be_te_dal:
    title: अक्षर ا، ب، ت और د
    gloss: अ/आ, ब, त और द
    note: दरी दाएँ से बाएँ लिखी जाती है। د आगे बाईं ओर के अक्षर से नहीं जुड़ता।
  prs.a1.unit01.lesson01.teach.re_ze:
    title: अक्षर ر और ز
    gloss: र और ज़
    note: इनमें से कोई भी अक्षर अगले अक्षर से नहीं जुड़ता।
  prs.a1.unit01.lesson01.teach.sin_shin_sad:
    title: अक्षर س، ش और ص
    gloss: स, श और स
    note: सामान्य दरी में س और ص दोनों स की ध्वनि देते हैं; ش श की ध्वनि देता है।
  prs.a1.unit01.lesson01.teach.jim_che_he_khe:
    title: अक्षर ج، چ، ح और خ
    gloss: ज, च, ह और ख़
    note: چ च है। خ वह ध्वनि है जिसे आम तौर पर ख़ (kh) लिखा जाता है।
  prs.a1.unit01.lesson01.teach.ayn_ghayn_fe_qaf:
    title: अक्षर ع، غ، ف और ق
    gloss: ʿ (ऐन), ग़, फ़ और क़
    note: غ और ق का सटीक उच्चारण दरी बोलने वालों में अलग-अलग होता है; वर्तनी में इन्हें अलग रखें।
  prs.a1.unit01.lesson01.teach.ke_gaf_lam_mim:
    title: अक्षर ک، گ، ل और م
    gloss: क, ग, ल और म
    note: ک फ़ारसी काफ़ है; दरी में क के लिए यही रूप इस्तेमाल होता है। ل और م दोनों ओर के अक्षरों से जुड़ते हैं।
  prs.a1.unit01.lesson01.teach.nun_vav_he_ye:
    title: अक्षर ن، و، ه और ی
    gloss: न, व/ओ/ऊ, ह और य/दीर्घ ई
    note: ی फ़ारसी ये है, जो य और दीर्घ स्वर ई के लिए आता है। و व्यंजन (व) या दीर्घ स्वर (ओ/ऊ) हो सकता है।
  prs.a1.unit01.lesson01.teach.connected_salam:
    title: जुड़ा हुआ शब्द पढ़ें
    gloss: नमस्ते
    note: अक्षर जुड़कर سلام बनाते हैं। छोटे स्वर आम तौर पर नहीं लिखे जाते।
    example_gloss: नमस्ते! मैं करीम हूँ।
  prs.a1.unit01.lesson02.teach.salam_alaikum:
    title: आदरपूर्ण रोज़मर्रा का अभिवादन
    gloss: आप पर सलामती हो / नमस्ते
    note: سلام علیکم अफ़ग़ानिस्तान में बहुत प्रचलित है और जान-पहचान वालों तथा सम्मान वाली मुलाक़ातों, दोनों में चलता है।
  prs.a1.unit01.lesson02.teach.wa_alaikum_salam:
    title: अभिवादन का उत्तर दें
    gloss: और आप पर भी सलामती हो
    note: وعلیکم سلام परंपरागत रूप से سلام علیکم का उत्तर है। السلام वाले रूप भी स्वीकार किए जाते हैं।
  prs.a1.unit01.lesson02.teach.salam:
    title: एक छोटा अभिवादन
    gloss: नमस्ते
    note: سلام एक लचीला, छोटा अभिवादन है।
    example_gloss: नमस्ते, आप कैसे हैं?
  prs.a1.unit01.lesson02.teach.khosh_amadeed:
    title: स्वागत है
    gloss: स्वागत है
    note: خوش آمدین आदरपूर्ण बोलचाल का स्वागत-वाक्य है, जो एक व्यक्ति या कई लोगों, दोनों के लिए इस्तेमाल होता है।
  prs.a1.unit01.lesson02.teach.tashakor:
    title: धन्यवाद
    gloss: धन्यवाद
    note: इस कोर्स में धन्यवाद के लिए تشکر को प्राथमिकता दी गई है। ممنون और ممنونم भी समझे जाते हैं, पर ये गौण रूप हैं।
    example_gloss: बहुत-बहुत धन्यवाद।
  prs.a1.unit01.lesson02.teach.khahesh:
    title: धन्यवाद का औपचारिक उत्तर
    gloss: आपका स्वागत है
    note: خواهش می‌کنم एक शिष्ट उत्तर है जो फ़ारसी बोलने वाले कई क्षेत्रों में चलता है। इसे केवल अफ़ग़ानी बोलचाल का प्रयोग नहीं माना गया है।
  prs.a1.unit01.lesson02.teach.khoda_hafez:
    title: अलविदा
    gloss: अलविदा
    note: خدا حافظ दरी में विदा कहने का प्रचलित रूप है और अक्सर दो शब्दों में लिखा जाता है।
  prs.a1.unit01.lesson03.teach.sobh_bekheyr:
    title: सुबह का अभिवादन
    gloss: सुप्रभात
    note: صبح بخیر सुबह के समय कहा जाता है।
  prs.a1.unit01.lesson03.teach.rooz_bekheyr:
    title: दिन का अभिवादन
    gloss: शुभ दिन
    note: روز بخیر दिन के समय का शिष्ट अभिवादन है।
  prs.a1.unit01.lesson03.teach.asr_bekheyr:
    title: दिन ढलने के समय का अभिवादन
    gloss: शुभ अपराह्न / शुभ संध्या
    note: عصر بخیر दिन के बाद वाले हिस्से के लिए उपयुक्त है।
  prs.a1.unit01.lesson03.teach.shab_bekheyr:
    title: रात की अभिव्यक्ति
    gloss: शुभ रात्रि
    note: شب بخیر आम तौर पर शाम को विदा लेते समय कहा जाता है, दिन की सामान्य मुलाक़ात शुरू करने के लिए नहीं।
  prs.a1.unit01.lesson03.teach.rooz_khosh:
    title: दिन में विदा लेने का शिष्ट वाक्य
    gloss: आपका दिन शुभ हो
    note: روز خوش विदा लेने का शिष्ट, कुछ औपचारिक वाक्य है जो कई क्षेत्रों में चलता है; यह विशेष रूप से अफ़ग़ानी बोलचाल का वाक्य नहीं है।
  prs.a1.unit01.lesson03.teach.be_omide_didar:
    title: अगली मुलाक़ात तक
    gloss: फिर मिलने की आशा है
    note: به امید دیدار विदा लेने का आत्मीय किंतु आदरपूर्ण तरीका है।
  prs.a1.unit01.lesson04.teach.polite_question:
    title: शिष्टता से किसी का हालचाल पूछें
    gloss: आप कैसे हैं?
    note: استین شما के साथ इस्तेमाल होने वाला प्रचलित, शिष्ट अफ़ग़ानी बोलचाल का रूप है।
  prs.a1.unit01.lesson04.teach.informal_question:
    title: हमउम्र या क़रीबी दोस्त का हालचाल पूछें
    gloss: आप कैसे हैं?
    note: تو और استی अनौपचारिक एकवचन हैं; इस जोड़ी को बड़ों या नए परिचितों के साथ अपने आप इस्तेमाल न करें।
  prs.a1.unit01.lesson04.teach.good_answer:
    title: बताएँ कि आप ठीक हैं
    gloss: मैं ठीक हूँ, धन्यवाद।
    note: استم का अर्थ है “मैं हूँ”। यह इस कोर्स में हर जगह इस्तेमाल होने वाला अफ़ग़ानी बोलचाल का रूप है।
  prs.a1.unit01.lesson04.teach.jor_answer:
    title: बताएँ कि आप स्वस्थ या ठीक हैं
    gloss: मैं ठीक हूँ।
    note: جور में अच्छे या स्वस्थ होने का भाव है और यह अफ़ग़ानी अभिवादनों में अक्सर आता है।
  prs.a1.unit01.lesson04.teach.not_bad:
    title: संयमित उत्तर
    gloss: मैं बुरा नहीं हूँ।
    note: بد نیستم एक तटस्थ उत्तर है।
  prs.a1.unit01.lesson04.teach.and_you:
    title: वही सवाल लौटाएँ
    gloss: और आप?
    note: و شما؟ बातचीत को शिष्ट और संक्षिप्त बनाए रखता है।
  prs.a1.unit01.lesson04.teach.everyone_well:
    title: अभिवादन को आगे बढ़ाएँ
    gloss: क्या सब ठीक हैं?
    note: अफ़ग़ानी अभिवादन में काम की बात शुरू होने से पहले घर-परिवार का हालचाल पूछने का सिलसिला भी चल सकता है।
  prs.a1.unit01.lesson05.teach.family_well:
    title: किसी के परिवार का हाल पूछें
    gloss: क्या आपका परिवार ठीक है?
    note: परिवार का हाल पूछना अफ़ग़ानी विस्तृत अभिवादन का आम हिस्सा है। यह कोर्स स्वामित्व वाला रूप فامیل‌تان लिखता है।
  prs.a1.unit01.lesson05.teach.household_well:
    title: घर के लोगों का हाल पूछें
    gloss: क्या घर में सब ठीक हैं?
    note: اهل خانه घर के सभी सदस्यों के लिए सामूहिक रूप से इस्तेमाल होता है।
  prs.a1.unit01.lesson05.teach.everyone_well:
    title: परिवार के हालचाल का उत्तर दें
    gloss: ईश्वर का शुक्र है, सब ठीक हैं।
    note: यहाँ شکر आभार व्यक्त करने वाला संक्षिप्त वाक्यांश है, भोजन वाली “चीनी” नहीं।
  prs.a1.unit01.lesson05.teach.zenda_bashin:
    title: स्नेहपूर्ण शिष्ट उत्तर दें
    gloss: आप जीते रहें / धन्यवाद।
    note: زنده باشین अफ़ग़ानी शिष्टाचार का प्रचलित वाक्य है, जो अक्सर धन्यवाद या अच्छी बातों के उत्तर में कहा जाता है। باشین “आप” के लिए आदरपूर्ण बोलचाल का रूप है।
  prs.a1.unit01.lesson05.teach.own_home:
    title: मेहमान का आत्मीय स्वागत करें
    gloss: यह आपका अपना ही घर है।
    note: خانهٔ خودتان است मेहमान को भरोसा दिलाता है कि उसका स्वागत है।
  prs.a1.unit01.lesson05.teach.seat_of_honor:
    title: सम्मानित स्थान की ओर बुलाएँ
    gloss: कृपया सम्मान के स्थान पर बैठिए।
    note: मेहमानों के कमरे में بالا بفرمایین मेहमान को प्रवेश-द्वार से दूर, अधिक सम्मानित स्थान की ओर बुलाता है। इसका अर्थ ज़रूरी नहीं कि ऊपर की मंज़िल हो।
  prs.a1.unit01.lesson05.teach.elders_first:
    title: पहले बड़ों को नमस्ते करें
    gloss: हम पहले बड़ों को नमस्ते करते हैं।
    note: पहले बड़ों को नमस्ते करना सम्मान दर्शाता है। शारीरिक अभिवादन रिश्ते, लिंग और व्यक्ति के संकेतों पर निर्भर करता है; यह मानकर न चलें कि हाथ मिलाना उचित होगा।
  prs.a1.unit01.lesson06.teach.daftar:
    title: दफ़्तर
    gloss: दफ़्तर
    note: دفتر का अर्थ दफ़्तर या कार्यस्थल है।
    example_gloss: मेरा दफ़्तर काबुल में है।
  prs.a1.unit01.lesson06.teach.kabul:
    title: काबुल
    gloss: काबुल
    note: کابل अफ़ग़ानिस्तान की राजधानी है और इस संवाद की पृष्ठभूमि है।
    example_gloss: मैं काबुल में रहता हूँ।
  prs.a1.unit01.lesson06.teach.line01:
    title: हामिद नए सहकर्मी के रूप में अपना परिचय देता है
    gloss: हामिद कहता है कि वह नया सहकर्मी है।
    note: दोनों वक्ता वयस्क पुरुष सहकर्मी हैं, जो काबुल के एक दफ़्तर में मिल रहे हैं।
  prs.a1.unit01.lesson06.teach.line02:
    title: नजीब उसका स्वागत करता है और नाम पूछता है
    gloss: नजीब उसका स्वागत करता है और उसका नाम पूछता है।
    note: خوش آمدین दari में स्वागत का आदरपूर्ण बोलचाल का रूप है, जो एक व्यक्ति या कई लोगों, दोनों के लिए चलता है।
  prs.a1.unit01.lesson06.teach.line03:
    title: हामिद अपना नाम बताता है
    gloss: हामिद अपना नाम बताता है।
    note: نامم حامد است (मेरा नाम हामिद है) रोज़मर्रा की बोलचाल का रूप है; نامم यानी نام + -م (मेरा)। लिखित में आपको نام من حامد است भी दिखेगा। दोनों सही हैं।
  prs.a1.unit01.lesson06.teach.line04:
    title: नजीब अपना परिचय देता है और कहता है कि उससे मिलकर खुशी हुई
    gloss: नजीब अपना परिचय देता है और कहता है कि उससे मिलकर खुशी हुई।
    note: از آشنایی با شما خوش شدم सीधे परिचय होने की बात कहता है, इसलिए यह पहली मुलाक़ात में ठीक बैठता है।
  prs.a1.unit01.lesson06.teach.line05:
    title: हामिद भी खुशी जताता है और पूछता है कि नजीब कैसा है
    gloss: हामिद भी खुशी जताता है और पूछता है कि नजीब कैसा है।
    note: नए सहकर्मियों के बीच यह बातचीत आदरसूचक شما और استین बनाए रखती है।
  prs.a1.unit01.lesson06.teach.line06:
    title: नजीब जवाब देता है
    gloss: नजीब कहता है कि वह ठीक है, धन्यवाद।
    note: جور استم، تشکر हाल पूछने का जवाब है, जैसा इसी यूनिट में पहले सिखाया गया।
  prs.a1.unit01.lesson06.teach.line07:
    title: नजीब हामिद के परिवार का हाल पूछता है
    gloss: नजीब हामिद के परिवार का हाल पूछता है।
    note: घर-परिवार का हाल पूछना काम की बात शुरू होने से पहले अभिवादन को आगे बढ़ाता है।
  prs.a1.unit01.lesson06.teach.line08:
    title: हामिद कहता है कि सब ठीक हैं
    gloss: हामिद कहता है कि सब ठीक हैं।
    note: شکر، همه جور استند परिवार का हाल पूछने का जवाब है, जैसा इसी यूनिट में पहले सिखाया गया।
  prs.a1.unit01.lesson06.teach.line09:
    title: नजीब बाक़ी सहकर्मियों से मिलवाने की पेशकश करता है
    gloss: नजीब बाक़ी सहकर्मियों से मिलवाने की पेशकश करता है।
    note: यहाँ بفرمایین हामिद को साथ चलने के लिए कहता है, बैठने या कुछ लेने के लिए नहीं।
  prs.a1.unit01.lesson06.teach.line10:
    title: हामिद धन्यवाद के साथ हामी भरता है
    gloss: हामिद धन्यवाद के साथ हामी भरता है।
    note: بسیار خوب यहाँ स्पष्ट सहमति के जवाब के रूप में पहली बार आया है।
  prs.a1.unit01.lesson06.teach.line11:
    title: नजीब गर्मजोशी से जवाब देता है और हामिद की मेज़ दिखाता है
    gloss: नजीब गर्मजोशी से जवाब देता है और हामिद की मेज़ दिखाता है।
    note: बातचीत घर आने-जाने की विदाई दोहराने के बजाय कामकाजी दिन की शुरुआत पर ख़त्म होती है।
  prs.a1.unit01.lesson06.teach.line12:
    title: हामिद उसे धन्यवाद देता है
    gloss: हामिद उसे धन्यवाद देता है।
    note: تشکر बातचीत को सादगी से समाप्त करता है।
exercises:
  prs.a1.unit01.lesson01.exercise01.recognize_sin:
    instruction: سلام किस अक्षर से शुरू होता है?
    correct_option: س
    distractors:
    - ش
    - ص
    - چ
    accepted_answers:
    - value: س
      status: correct
    feedback: سلام की शुरुआत س से होती है। यह सवाल सिखाए गए शब्द की वर्तनी परखता है, यह नहीं कि 'स' की ध्वनि किन अक्षरों से लिखी जा सकती है।
  prs.a1.unit01.lesson01.exercise02.recognize_che:
