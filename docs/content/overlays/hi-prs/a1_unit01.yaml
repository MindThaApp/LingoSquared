      status: correct
    feedback: सही वर्तनी سلام है।
  prs.a1.unit01.lesson02.exercise01.recognize_greeting_reading:
    instruction: इस वाक्यांश का क्या अर्थ है?
    correct_option: नमस्ते (आप पर शांति हो)
    distractors:
    - अलविदा
    - स्वागत है
    - धन्यवाद
    accepted_answers:
    - value: नमस्ते (आप पर शांति हो)
      status: correct
    feedback: 'سلام علیکم का अर्थ नमस्ते है (शाब्दिक अर्थ: ''आप पर शांति हो'')।'
  prs.a1.unit01.lesson02.exercise02.translate_response:
    instruction: 'दरी में अनुवाद कीजिए: ''और आप पर भी शांति हो'' (سلام علیکم का रिवाजी जवाब)।'
    accepted_answers:
    - value: وعلیکم سلام
      status: correct
    - value: و علیکم سلام
      status: acceptable_with_note
      note: स्वीकार्य, बीच में जगह वाला रूप।
    - value: وعلیکم السلام
      status: acceptable_with_note
      note: पूरे जवाब का प्रचलित रूप।
    - value: و علیکم السلام
      status: acceptable_with_note
      note: जगह के साथ 'और' लगे पूरे जवाब का प्रचलित रूप।
    feedback: وعلیکم سلام रिवाजी जवाब है; السلام वाले प्रचलित पूरे रूप भी सही हैं।
