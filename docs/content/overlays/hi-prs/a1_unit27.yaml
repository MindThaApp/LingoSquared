teaching:
  prs.a1.unit27.lesson01.teach.tall_phrase:
    title: लंबा
    gloss: लंबा
    note: قد بلند का शाब्दिक अर्थ है "ऊँचा कद" -- قد (कद) + بلند (ऊँचा/लंबा)।
