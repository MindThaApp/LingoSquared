  prs.a1.unit27.lesson01.teach.short_phrase:
    title: छोटा
    gloss: छोटा
    note: قد کوتاه का शाब्दिक अर्थ है "छोटा कद" -- قد (कद, दोहराव) + کوتاه (छोटा)।
