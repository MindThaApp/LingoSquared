  prs.a1.unit27.lesson03.teach.hair_color_phrase:
    title: बालों का रंग
    gloss: बालों का रंग
    note: رنگ مو का शाब्दिक अर्थ है "बाल का रंग" -- رنگ (रंग) + مو (बाल)।
  prs.a1.unit27.lesson03.teach.eye_blue_sentence:
    title: उसकी आँखें नीली हैं
    gloss: उसकी आँखें नीली हैं।
    note: इस पाठ के آبی (नीला) शब्द को چشم (आँख) के साथ इस्तेमाल करता है।
  prs.a1.unit27.lesson03.teach.hair_brown_sentence:
    title: उसके बाल भूरे हैं
    gloss: उसके बाल भूरे हैं।
    note: इस पाठ के قهوه‌ای (भूरा) शब्द को موی (बाल) के साथ इस्तेमाल करता है।
  prs.a1.unit27.lesson04.teach.review_baradar:
    title: भाई / आपका भाई
