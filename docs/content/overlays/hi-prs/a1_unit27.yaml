  prs.a1.unit27.lesson04.teach.dialogue_line4:
    title: 'ज़रमीना: हाँ, उसकी दाढ़ी है और चश्मा भी है'
    gloss: 'ज़रमीना: हाँ, उसकी दाढ़ी है और चश्मा भी है।'
    note: दूसरी विशेषता पर هم (भी) का प्रयोग।
  prs.a1.unit27.lesson04.teach.dialogue_line5:
    title: 'हुमायूँ: ठीक है, धन्यवाद'
    gloss: 'हुमायूँ: ठीक है, धन्यवाद।'
    note: خوب (अच्छा/ठीक) बात खत्म करने का एक नया, सरल शब्द है; تشکر (धन्यवाद) दोहराया जा रहा है।
  prs.a1.unit27.lesson05.teach.reading_passage:
    title: रूप-रंग के बारे में पाठ
    gloss: करीम लंबा है। उसके बाल काले और आँखें भूरी हैं। उसकी दाढ़ी नहीं है, लेकिन चश्मा है।
    note: एक छोटा पाठ जो इकाई के रूप-रंग वाले शब्दों को दोहराता है। इसमें पात्र का नाम کریم (करीम, तुलना वाली इकाई का जाना-पहचाना पात्र) और ندارد (नहीं है, دارد का तीसरे पुरुष का निषेध रूप) आता है।
  prs.a1.unit27.lesson06.teach.review_ama:
    title: लेकिन
    gloss: लेकिन
    note: اما का अर्थ "लेकिन" है (इस इकाई में पाठ 5 के पाठ में आया था; पहले की इकाइयों से भी दोहराव है)।
    target_text: اما (लेकिन)
  prs.a1.unit27.lesson06.teach.review_astam:
    title: मैं हूँ / मेरे पास है
    gloss: मैं हूँ / मेरे पास है
    note: استم (मैं हूँ) और دارم (मेरे पास है) पहले आ चुके हैं; यहाँ अपने रूप-रंग के वर्णन के लिए इस्तेमाल हुए हैं।
    target_text: استم (मैं हूँ) / دارم (मेरे पास है)
  prs.a1.unit27.lesson06.teach.wrap_summary:
    title: मैं नाटा हूँ, लेकिन मेरे बाल काले हैं
    gloss: मैं नाटा हूँ, लेकिन मेरे बाल काले हैं।
    note: اما की मदद से रूप-रंग की दो बातें जोड़ी गई हैं।
