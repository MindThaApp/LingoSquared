    note: ریش का अर्थ है दाढ़ी।
    example_gloss: उसकी दाढ़ी है।
  prs.a1.unit27.lesson01.teach.glasses_word:
    title: चश्मा
    gloss: चश्मा
    note: عینک का अर्थ है चश्मा।
    example_gloss: उसके पास चश्मा है।
  prs.a1.unit27.lesson01.teach.review_ast_dast:
    title: है / के पास है (अन्य पुरुष)
    gloss: है / उसके पास है (तृतीय पुरुष)
    note: است (है) और دارد (उसके पास है) दोनों पहले पढ़े जा चुके हैं और इस यूनिट में किसी के रूप-रंग का वर्णन करने के लिए बार-बार आते हैं।
    target_text: است (है) / دارد (उसके पास है)
  prs.a1.unit27.lesson02.teach.qiyafa_word:
    title: रूप-रंग / शक्ल-सूरत
    gloss: रूप-रंग / शक्ल-सूरत
    note: قیافه का अर्थ है किसी व्यक्ति की शक्ल-सूरत या रूप-रंग (जैसे خوش قیافه, "सुंदर/आकर्षक")।
    example_gloss: उसका रूप-रंग अच्छा है।
  prs.a1.unit27.lesson02.teach.review_chetor:
    title: कैसे
    gloss: कैसे
    note: چطور का अर्थ है "कैसे" (यह पहले ही अभिवादन जैसे چطور استین؟ में आ चुका है)।
    target_text: چطور (कैसे)
  prs.a1.unit27.lesson02.teach.qiyafash_word:
    title: उसका रूप-रंग
    gloss: उसका रूप-रंग
    note: قیافه‌اش में قیافه (रूप-रंग) के साथ स्वामित्व-प्रत्यय ‌اش ("उसका") जुड़ा है।
  prs.a1.unit27.lesson02.teach.question_appearance:
    title: वह कैसा/कैसी दिखता/दिखती है?
    gloss: वह कैसा दिखता है?
    note: قیافه‌اش چطور است؟ किसी के दिखने के बारे में पूछने का स्वाभाविक तरीक़ा है -- अकेला چطور است؟ नहीं, क्योंकि वह अपने आप में "वह कैसा है?" (हालचाल पूछना) जैसा लगता है।
  prs.a1.unit27.lesson02.teach.answer_tall:
    title: वह लंबा है
    gloss: वह लंबा है।
    note: او (वह, दोहराव) को इस यूनिट के قد بلند است के साथ जोड़ता है।
  prs.a1.unit27.lesson02.teach.answer_black_hair:
    title: उसके बाल काले हैं
    gloss: उसके बाल काले हैं।
    note: موی (बाल), سیاه (काला) और دارد (उसके पास है) को जोड़ता है।
  prs.a1.unit27.lesson02.teach.answer_beard:
    title: उसकी दाढ़ी है
    gloss: उसकी दाढ़ी है।
    note: ریش دارد में वही "है" वाला ढाँचा है जो ऊपर काले बालों में था।
  prs.a1.unit27.lesson03.teach.review_rang:
    title: रंग
    gloss: रंग
    note: رنگ का अर्थ है रंग (यह पहले ही यूनिट 21 में कपड़ों के पाठ में आ चुका है)।
    target_text: رنگ (रंग)
  prs.a1.unit27.lesson03.teach.blue_word:
    title: नीला
    gloss: नीला
    note: آبی का अर्थ है नीला।
    example_gloss: उसकी आँखें नीली हैं।
  prs.a1.unit27.lesson03.teach.brown_word:
