    gloss: हाँ / धन्यवाद / भी
    note: بلی (हाँ), تشکر (धन्यवाद) और هم (भी) पाठ्यक्रम में पहले आ चुके हैं, यहाँ दोहराए जा रहे हैं।
    target_text: بلی (हाँ) / تشکر (धन्यवाद) / هم (भी)
  prs.a1.unit27.lesson04.teach.dialogue_line1:
    title: 'हुमायूँ: ज़रमीना, तुम्हारा भाई देखने में कैसा है?'
    gloss: 'हुमायूँ: ज़रमीना, तुम्हारा भाई देखने में कैसा है?'
    note: दोस्तों के बीच एक अनौपचारिक सवाल, जिसमें برادر पर ‌-ت प्रत्यय लगा है।
  prs.a1.unit27.lesson04.teach.dialogue_line2:
    title: 'ज़रमीना: वह लंबा है और उसके बाल काले हैं'
