  prs.a1.unit27.lesson01.teach.hair_word:
    title: बाल
    gloss: बाल
    note: مو का अर्थ है बाल; موی इसी शब्द का संबंध-रूप है, जो किसी दूसरे शब्द से पहले आता है (जैसे موی سیاه, "काले बाल")।
    example_gloss: उसके बाल काले हैं।
  prs.a1.unit27.lesson01.teach.eye_word:
    title: आँख
    gloss: आँख
    note: چشم का अर्थ है आँख (आँखों का रंग बताने के लिए एकवचन में ही बोला जाता है, यही रोज़मर्रा का सामान्य प्रयोग है)।
