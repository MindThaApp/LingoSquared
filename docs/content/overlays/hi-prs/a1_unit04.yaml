    gloss: शून्य
    note: अफ़ग़ानिस्तान के ज़्यादातर फ़ोन नंबर बोलने के लिए صفر ज़रूरी है।
    example_gloss: शून्य एक संख्या है।
  prs.a1.unit04.lesson05.teach.phone_answer:
