    gloss: मेरा फ़ोन नंबर 079-345-678 है।
    note: अफ़ग़ान फ़ोन नंबर आम तौर पर एक-एक अंक के बजाय छोटे-छोटे समूहों में बोले जाते हैं, जैसा यहाँ दिखाया गया है।
  prs.a1.unit04.lesson06.teach.turn01:
    title: हुमायूँ बशीर को नमस्ते कहता है
    gloss: हुमायूँ बशीर से हालचाल पूछता है; करीबी दोस्त के लिए अनौपचारिक रूप इस्तेमाल हुआ है।
    note: جور استی؟ से पता चलता है कि दोनों करीबी दोस्त हैं, इसलिए पूरी बातचीत में अनौपचारिक रूप उचित है।
  prs.a1.unit04.lesson06.teach.turn02:
    title: बशीर जवाब देता है और हुमायूँ की उम्र पूछता है
    gloss: बशीर कहता है कि वह ठीक है और पूछता है कि हुमायूँ की उम्र कितनी है।
    note: چند ساله استی؟ में दोस्ती के अनुरूप अनौपचारिक रूप है।
  prs.a1.unit04.lesson06.teach.turn03:
    title: हुमायूँ जवाब देता है और वही सवाल लौटाता है
    gloss: हुमायूँ कहता है कि वह 28 साल का है और बशीर से वही सवाल पूछता है।
    note: पाठ 04 का उम्र बताने वाला ढाँचा यहाँ सीधे दोहराया गया है।
  prs.a1.unit04.lesson06.teach.turn04:
    title: बशीर जवाब देता है
    gloss: बशीर कहता है कि वह 26 साल का है।
    note: उम्र की बातचीत पूरी होती है।
  prs.a1.unit04.lesson06.teach.turn05:
    title: हुमायूँ बशीर का फ़ोन नंबर पूछता है
    gloss: हुमायूँ बशीर का फ़ोन नंबर पूछता है।
    note: تلفنت में अनौपचारिक स्वामित्व-प्रत्यय है, जो इस बातचीत के बाकी हिस्से के अनुरूप है।
  prs.a1.unit04.lesson06.teach.turn06:
    title: बशीर अपना फ़ोन नंबर बताता है
    gloss: बशीर अपना फ़ोन नंबर समूहों में बोलकर बताता है।
    note: नंबर उसी स्वाभाविक समूहबद्ध ढंग से बोला गया है जैसा पाठ 05 के उदाहरण में था।
  prs.a1.unit04.lesson06.teach.turn07:
    title: हुमायूँ पुष्टि करता है कि उसने नंबर सेव कर लिया
    gloss: हुमायूँ धन्यवाद देता है और कहता है कि वह अभी सेव कर लेगा।
    note: سیف می‌کنم (अंग्रेज़ी '«save»' से लिया गया) तकनीक से जुड़ा अफ़ग़ान बोलचाल का आम उधार शब्द है, जो दोस्तों की इस अनौपचारिक बातचीत में ठीक बैठता है।
