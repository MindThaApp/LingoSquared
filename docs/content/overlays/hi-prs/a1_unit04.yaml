    example_gloss:
    - मैं चौदह दिन बाद आऊँगा/आऊँगी।
    - उसके पास पंद्रह किताबें हैं।
    - वह सोलह साल का/की है।
  prs.a1.unit04.lesson02.teach.seventeen_nineteen:
    title: सत्रह, अठारह, उन्नीस
    gloss: 17, 18, 19
