    - इस किताब में सत्तर पन्ने हैं।
    - उसके पास अस्सी किताबें हैं।
  prs.a1.unit04.lesson03.teach.ninety_hundred:
    title: नब्बे, सौ
    gloss: 90, 100
    note: نود، صد सौ तक का क्रम पूरा करते हैं।
    example_gloss:
    - वह नब्बे साल का/की है।
    - उसके पास सौ किताबें हैं।
  prs.a1.unit04.lesson03.teach.combining_tens:
    title: दहाई और इकाई को जोड़ना
    gloss: 25 का शाब्दिक अर्थ है 'बीस और पाँच'।
    note: दहाई वाले शब्द और इकाई वाले शब्द को و (और) से जोड़ा जाता है, जैसे بیست و پنج (25)। इस कोर्स में और जगह भी यही जोड़ने वाला शब्द आता है।
  prs.a1.unit04.lesson04.teach.chand:
    title: कितना / कितने
    gloss: कितना / कितने
    note: چند मात्रा के बारे में सवाल शुरू करता है, उम्र पूछने में भी इसका इस्तेमाल होता है।
    example_gloss: आपकी उम्र कितनी है?
  prs.a1.unit04.lesson04.teach.sal_word:
    title: साल
    gloss: साल
    note: उम्र बताते समय سال का इस्तेमाल होता है, जिसका शाब्दिक अर्थ 'साल' है।
    example_gloss: मेरी उम्र बीस साल है।
  prs.a1.unit04.lesson04.teach.age_question_polite:
    title: किसी की उम्र आदर से पूछना
    gloss: तुम्हारी उम्र कितनी है?
    note: چند ساله استین؟ का शाब्दिक अर्थ है 'आप कितने साल के हैं'; यह استین रूप उन लोगों के लिए है जिन्हें आप अच्छी तरह नहीं जानते।
  prs.a1.unit04.lesson04.teach.age_question_informal:
    title: करीबी दोस्त की उम्र पूछना
    gloss: तुम्हारी उम्र कितनी है?
    note: چند ساله استی؟ में अनौपचारिक استی है; इसे केवल करीबी दोस्त या हमउम्र के लिए रखिए, जैसा इस कोर्स में पहले भी बताया गया है।
  prs.a1.unit04.lesson04.teach.age_answer:
    title: अपनी उम्र बताना
    gloss: मैं 25 साल का/की हूँ।
    note: بیست و پنج ساله استم में संख्या, ساله (साल का) और استم एक साथ आते हैं।
  prs.a1.unit04.lesson05.teach.number_word:
    title: संख्या
    gloss: संख्या
    note: نمبر रोज़मर्रा में खूब इस्तेमाल होने वाला अफ़ग़ान शब्द है, जिसका अर्थ 'नंबर' है, खासकर फ़ोन नंबर के लिए।
    example_gloss: यह मेरा फ़ोन नंबर है।
  prs.a1.unit04.lesson05.teach.telephone_word:
    title: टेलीफ़ोन
    gloss: टेलीफ़ोन
