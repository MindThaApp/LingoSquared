    example_gloss:
    - उसके पास सत्रह किताबें हैं।
    - वह अठारह साल का/की है।
    - उन्नीस दिन बचे हैं।
  prs.a1.unit04.lesson02.teach.twenty:
    title: बीस
    gloss: '20'
    note: بیست दहाइयों की शुरुआत है; इसे अगले पाठ में विस्तार से पढ़ेंगे।
    example_gloss: मेरे पास बीस किताबें हैं।
  prs.a1.unit04.lesson03.teach.twenty_thirty_forty:
    title: बीस, तीस, चालीस
    gloss: 20, 30, 40
    note: بیست، سی، چهل दहाइयों के शब्द हैं; हर एक अलग रूप है, किसी तय पैटर्न से नहीं बनता।
    example_gloss:
    - मेरी उम्र बीस साल है।
    - इस महीने में तीस दिन हैं।
    - वह चालीस साल का/की है।
  prs.a1.unit04.lesson03.teach.fifty_sixty:
    title: पचास, साठ
    gloss: 50, 60
    note: پنجاه، شصت दहाइयों को आगे बढ़ाते हैं।
    example_gloss:
    - उसके पास पचास किताबें हैं।
    - साठ मिनट एक घंटा होता है।
  prs.a1.unit04.lesson03.teach.seventy_eighty:
