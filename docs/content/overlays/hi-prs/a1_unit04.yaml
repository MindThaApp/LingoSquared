    gloss: तुम्हारा फ़ोन नंबर क्या है?
    note: نمبر تلفن‌تان چند است؟ में वही چند वाला ढाँचा है जो उम्र के सवाल में था, यहाँ फ़ोन नंबर के लिए।
  prs.a1.unit04.lesson05.teach.zero_word:
