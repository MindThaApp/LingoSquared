    example_gloss:
    - मेरी ग्यारह बजे कक्षा है।
    - एक साल में बारह महीने होते हैं।
    - वह तेरह साल का/की है।
  prs.a1.unit04.lesson02.teach.fourteen_sixteen:
    title: चौदह, पंद्रह, सोलह
    gloss: 14, 15, 16
