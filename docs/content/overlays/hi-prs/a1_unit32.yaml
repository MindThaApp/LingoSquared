    note: تولدت में تولد (जन्मदिन) के साथ अनौपचारिक "तुम्हारा" वाला प्रत्यय -ت जुड़ा है; مبارک का अर्थ है मुबारक/शुभ। दोनों मिलकर تولدت مبارک बनता है, जो दरी और फ़ारसी में जन्मदिन की सामान्य शुभकामना है।
    target_text: تولدت (तुम्हारा जन्मदिन, अनौपचारिक) + مبارک (मुबारक) = تولدت مبارک (जन्मदिन मुबारक)
  prs.a1.unit32.lesson01.teach.happy_birthday_phrase:
    title: जन्मदिन मुबारक!
    gloss: जन्मदिन मुबारक!
