  pl.a1.unit48.lesson04.exercise02.comprehend_nowy_film:
    instruction: Luister naar de dialoog en kies welke film Nina wil zien.
    correct_option: De nieuwe film.
    distractors:
    - De kindervoorstelling.
    - Elke film is goed.
    - Dat zegt ze niet.
    accepted_answers:
    - value: De nieuwe film.
      status: correct
    feedback: Nina wil *nowy film*. Het bijvoeglijk naamwoord *nowy* komt overeen met het mannelijke *film*; als levenloos voorwerp blijft het in de accusatief hetzelfde.
    prompt_blocks:
    - Welke film wil Nina zien?
  pl.a1.unit48.lesson04.exercise03.comprehend_a_na_ktora:
    instruction: Luister naar de dialoog en kies waar Iga Nina daarna naar vraagt.
    correct_option: Hoe laat ze de voorstelling wil.
    distractors:
    - Of ze popcorn wil.
    - Of ze een kassabon wil.
    - Ze vraagt niets.
    accepted_answers:
    - value: Hoe laat ze de voorstelling wil.
      status: correct
    feedback: Iga vraagt *a na którą godzinę?* *Na* met de accusatief gebruik je voor het tijdstip waarvoor een voorstelling wordt geboekt, en *którą* komt overeen met het vrouwelijke *godzina*.
    prompt_blocks:
    - Waar vraagt Iga Nina daarna naar?
  pl.a1.unit48.lesson04.exercise04.comprehend_na_osma:
    instruction: Luister naar de dialoog en kies hoe laat Nina de voorstelling wil.
    correct_option: Acht uur.
    distractors:
    - Zeven uur.
    - Zes uur.
    - Dat staat niet in de dialoog.
    accepted_answers:
    - value: Acht uur.
      status: correct
    feedback: Nina zegt *na ósmą* ('voor acht uur'). Het rangtelwoord *ósma* komt overeen met het vrouwelijke *godzina* en staat na *na* in de accusatief.
    prompt_blocks:
    - Hoe laat wil Nina de voorstelling?
