teaching:
  pl.a1.unit19.lesson01.teach.recap_jaka_jest_dzis_nie:
    title: Hoe, is, vandaag, niet -- nog eens
    gloss: Jaka, jest, Dziś, nie -- deze woorden ken je al uit eerdere lessen.
    note: Een korte herinnering voordat je ze in deze les gebruikt om over het weer te praten.
  pl.a1.unit19.lesson01.teach.pogoda:
    title: Weer
    gloss: het weer
    note: Het algemene woord voor weer of weersomstandigheden.
    example_gloss: Wat voor weer is het?
  pl.a1.unit19.lesson01.teach.zimno:
    title: Koud
    gloss: koud
    note: Beschrijft de temperatuur -- het woord verandert niet met het geslacht.
    example_gloss: Het is koud.
  pl.a1.unit19.lesson01.teach.goraco:
    title: Heet
    gloss: heet
    note: Het tegenovergestelde van '*zimno*' -- ook dit woord verandert niet met het geslacht.
    example_gloss: Het is heet.
  pl.a1.unit19.lesson01.teach.jest_pogoda_note:
    title: Het is koud, het is heet
    gloss: 'Jest zimno. Jest gorąco. -- zo beschrijf je in het Pools het weer: ''*jest*'' plus een weerwoord, zonder overeenkomst in geslacht.'
    note: Hetzelfde eenvoudige patroon werkt voor alle weerwoorden in deze unit.
  pl.a1.unit19.lesson01.teach.jaka_jest_pogoda_phrase:
    title: Wat voor weer is het?
    gloss: Wat voor weer is het?
    note: Een natuurlijke manier om naar het weer van nu te vragen.
  pl.a1.unit19.lesson01.teach.dzis_jest_zimno_phrase:
    title: Het is vandaag koud
    gloss: Het is vandaag koud.
    note: De zin waar deze hele unit op voortbouwt als je over het weer van vandaag praat.
  pl.a1.unit19.lesson02.teach.pada:
    title: Het regent
    gloss: het regent
    note: Wordt zonder onderwerp gebruikt -- zo zeg je in het Pools normaal dat het regent.
    example_gloss: Vandaag regent het.
  pl.a1.unit19.lesson02.teach.snieg:
    title: Sneeuw
    gloss: sneeuw
    note: Het woord voor sneeuw -- samen met '*pada*' betekent het 'het sneeuwt'.
    example_gloss: Het sneeuwt.
  pl.a1.unit19.lesson02.teach.mgla:
    title: Mist
    gloss: mist
    note: Nog een veelvoorkomende weersomstandigheid.
    example_gloss: Het is mistig.
  pl.a1.unit19.lesson02.teach.dobra_note:
    title: Goed
    gloss: Pogoda jest dobra. -- '*dobra*' past bij vrouwelijke woorden, zoals '*pogoda*'.
    note: De vrouwelijke vorm van '*dobry*' (zoals in '*Dzień dobry*') -- hetzelfde -y/-a-patroon als bij *chory/chora*.
  pl.a1.unit19.lesson02.teach.straszna_note:
    title: Vreselijk
    gloss: Jaka straszna pogoda! -- '*straszna*' past ook bij '*pogoda*', net als '*dobra*'.
    note: Een sterk woord -- gebruik het voor echt slecht weer.
  pl.a1.unit19.lesson02.teach.jaka_straszna_pogoda_phrase:
    title: Wat een vreselijk weer!
    gloss: Wat een vreselijk weer!
    note: Een natuurlijke uitroep bij slecht weer.
  pl.a1.unit19.lesson02.teach.pogoda_dobra_phrase:
    title: Het weer is goed
    gloss: Het weer is goed.
    note: Hier komt het weerwoord uit het begin van deze les weer terug.
  pl.a1.unit19.lesson03.teach.recap_words:
    title: Ja, en, ik, ook -- nog eens
    gloss: Tak, A, ja, też, chcę, iść, idę, do, parku, tam, bardzo -- deze woorden ken je al uit eerdere lessen.
    note: Een korte herinnering voor het dialoog in deze les.
  pl.a1.unit19.lesson03.teach.bo:
    title: Omdat
    gloss: omdat
    note: Verbindt een plan met de weersreden erachter.
    example_gloss: Ik ga niet naar het park, omdat het regent.
  pl.a1.unit19.lesson03.teach.nie_chce_isc_bo_pada_phrase:
    title: Ik wil niet gaan, omdat het regent
    gloss: Ik wil niet naar het park, omdat het regent.
    note: Een weersbeschrijving gecombineerd met een echt plan -- precies waar deze unit naartoe werkt.
  pl.a1.unit19.lesson03.teach.w_krakowie_recap:
    title: In Kraków -- nog eens
    gloss: W Krakowie -- dit ken je al uit eerdere lessen, bijvoorbeeld 'Ona mieszka w Krakowie' (Zij woont in Kraków).
    note: Een korte herinnering voordat het dialoog in deze les het weer op twee plekken vergelijkt.
  pl.a1.unit19.lesson03.teach.dialogue.line01:
    title: Marek vraagt naar het weer
    gloss: Wat voor weer is het vandaag?
    note: Marek opent het gesprek met een vraag over het weer van vandaag.
  pl.a1.unit19.lesson03.teach.dialogue.line02:
    title: Ewa antwoordt
    gloss: Het regent. Het is koud.
    note: Ewa beschrijft het weer van vandaag.
  pl.a1.unit19.lesson03.teach.dialogue.line03:
    title: Marek reageert en maakt een plan
    gloss: Wat een vreselijk weer! Ik wil niet naar het park, omdat het regent.
    note: Marek reageert op het weer en zegt wat hij daardoor van plan is.
  pl.a1.unit19.lesson03.teach.dialogue.line04:
    title: Ewa is het met hem eens
    gloss: Ik ga ook niet naar het park.
    note: Ewa maakt hetzelfde plan als Marek.
  pl.a1.unit19.lesson03.teach.dialogue.line05:
    title: Marek vraagt naar Kraków
    gloss: En in Kraków? Hoe is het weer daar?
    note: Marek brengt het gesprek op het weer in een andere stad.
  pl.a1.unit19.lesson03.teach.dialogue.line06:
    title: Ewa antwoordt
    gloss: In Kraków sneeuwt het. Het is daar heel koud.
    note: Ewa beschrijft ander, kouder weer in Kraków.
