teaching:
  pl.a1.unit22.lesson01.teach.dzwonic:
    title: Bellen
    gloss: bellen
    note: De infinitief van het werkwoord voor telefoneren.
    example_gloss: Ik moet je bellen.
  pl.a1.unit22.lesson01.teach.zadzwonie_do_ciebie:
    title: Zeggen dat je belt
    gloss: Ik bel je.
    note: '*Zadzwonię* is de perfectieve toekomende tijd van *zadzwonić* (bellen, eenmalig). In het Pools gebruik je die voor een belofte, zoals in het Nederlands ''ik bel je wel''.'
  pl.a1.unit22.lesson01.teach.halo_tu_ewa:
    title: De telefoon opnemen
    gloss: Hallo, met Ewa.
    note: '*Tu* + naam (letterlijk ''hier ...'') is de standaardmanier om jezelf aan de telefoon te noemen; in het Nederlands zeg je ''met ...''.'
  pl.a1.unit22.lesson01.teach.halo_tu_marek:
    title: Marek antwoordt op dezelfde manier
    gloss: Hallo, met Marek.
    note: Hetzelfde patroon *tu* + naam als in *Halo, tu Ewa*.
  pl.a1.unit22.lesson02.teach.z_kim_rozmawiam:
    title: Vragen wie er belt
    gloss: Met wie spreek ik?
    note: '*Z kim rozmawiam?* (letterlijk ''met wie praat ik?'') is de standaardvraag voor een onbekende beller; *kim* is de instrumentaal na *z*.'
  pl.a1.unit22.lesson02.teach.rozmawia_pan_z:
    title: Jezelf formeel voorstellen
    gloss: U spreekt met Ewa.
    note: '*Rozmawia pan z Ewą* is de formele versie: *pan* (tegen een man) of *pani* (tegen een vrouw) met het werkwoord in de derde persoon, en *z* + instrumentaal.'
  pl.a1.unit22.lesson03.teach.mozesz_to_powtorzyc:
    title: Vragen om herhaling
    gloss: Kun je dat herhalen?
    note: '*Możesz* (kun je, van *móc*) + de infinitief *powtórzyć* (herhalen) + *to* (dat).'
  pl.a1.unit22.lesson03.teach.nie_mow_tak:
    title: Vragen om langzamer te praten
    gloss: Praat niet zo snel, alsjeblieft.
    note: '*Nie mów* is de ontkennende gebiedende wijs (praat niet); *tak szybko* betekent ''zo snel''.'
  pl.a1.unit22.lesson03.teach.nie_slysze_cie:
    title: Zeggen dat je niet goed hoort
    gloss: Ik hoor je niet goed.
    note: '*Nie słyszę cię dobrze* geeft een gehoorprobleem aan; *cię* is de accusatief van *ty* en *dobrze* betekent ''goed''.'
  pl.a1.unit22.lesson04.teach.sms:
    title: Appje
    gloss: het berichtje
    note: '*SMS* is een mannelijk zelfstandig naamwoord, ontleend aan het Engels: *ten SMS*.'
    example_gloss: Het sms'je is van Ewa.
  pl.a1.unit22.lesson04.teach.wysle_ci_sms:
    title: Zeggen dat je iets stuurt
    gloss: Ik stuur je een berichtje.
    note: '*Wysłać* (sturen) neemt de datief *ci* (aan jou) voor de persoon en de accusatief voor het verzonden ding: *Wyślę ci SMS*.'
  pl.a1.unit22.lesson04.teach.oddzwonie_pozniej:
    title: Zeggen dat je terugbelt
    gloss: Ik bel je straks terug.
    note: '*Oddzwonić* (terugbellen) is in het Pools één werkwoord: *oddzwonię później*.'
  pl.a1.unit22.lesson05.teach.marek_czesc_ewo:
    title: Lees een appgesprek
    gloss: 'Marek: Hoi Ewa, kun je me bellen? Ik moet je iets vertellen. Ewa: Ja, natuurlijk, ik bel over vijf minuten terug.'
    note: Let op wat Marek vraagt, waarom, en wanneer Ewa zegt terug te bellen.
    glosses:
      Cześć: hoi
      możesz: kunnen
      zadzwonić: bellen
      Muszę: moeten
      coś: iets
      powiedzieć: vertellen
      oczywiście: natuurlijk
      oddzwonię: bellen
      pięć: vijf
      minut: minuten
      za: terug
  pl.a1.unit22.lesson06.teach.marek_halo_tu:
    title: Marek neemt de telefoon op
    gloss: 'Marek: Hallo, met Marek.'
    note: 'Hetzelfde patroon *tu* + naam uit les 1, nu in een echt telefoongesprek: wie opneemt, spreekt eerst en noemt zijn naam.'
  pl.a1.unit22.lesson06.teach.ewa_czesc_marku:
    title: Ewa zegt wie ze is
    gloss: 'Ewa: Hoi Marek, met Ewa. Marek: Fijn dat je belt!'
    note: '*Fajnie, że* ... (fijn dat ...) drukt een positieve reactie op een gebeurtenis uit; *że* leidt de bijzin in.'
  pl.a1.unit22.lesson06.teach.ewa_jak_ci:
    title: Ewa vraagt naar de dienst
    gloss: 'Ewa: Hoe was je eerste dienst?'
    note: '*Jak ci poszła ...?* (letterlijk ''hoe is ... je gegaan?'') vraagt naar iets wat al gebeurd is. *Ci* is de datief van *ty*, en *poszła* congrueert met het vrouwelijke zelfstandig naamwoord *zmiana*.'
  pl.a1.unit22.lesson06.teach.marek_poszlo_bardzo:
    title: Marek vertelt goed nieuws
    gloss: 'Marek: Het ging heel goed, beter dan ik dacht.'
    note: '*Poszło* is de verleden tijd van *iść* met de uitgang *-o* (''het''; hier ''aflopen''); *myślałem* is de verleden tijd van *myśleć* (denken), met de uitgang voor een mannelijke spreker.'
  pl.a1.unit22.lesson06.teach.czas_przeszly_bylo:
    title: 'Verleden tijd: było, poszło, myślałem'
    gloss: 'Verleden tijd: *było* (was) van *być* (zijn), *poszło* (ging) van *iść* (gaan), *myślałem* (ik dacht) van *myśleć* (denken).'
    note: 'De Poolse verleden tijd wordt gevormd met *-ł-* plus een uitgang voor het geslacht: *myślał* (hij), *myślała* (zij), *było* (het). Leer *było*, *poszło* en *myślałem* voorlopig als vaste vormen in de contexten van deze les.'
  pl.a1.unit22.lesson06.teach.ewa_jak_milo:
    title: Ewa is trots
    gloss: 'Ewa: Wat fijn om te horen! Ik ben trots op je.'
    note: '*Dumny z* (trots op) is een vaste combinatie: *z* + genitief, dus *z ciebie*. Ewa is een vrouw, dus zegt ze *dumna*.'
  pl.a1.unit22.lesson06.teach.marek_dziekuje_ci:
    title: Marek is ontroerd
    gloss: 'Marek: Dank je wel, dat betekent veel voor me.'
    note: '*Znaczy* is de *on/ona/ono*-vorm van *znaczyć* (betekenen); *dla mnie* (voor mij) zegt voor wie het telt.'
  pl.a1.unit22.lesson06.teach.jego_pierwsza_zmiana:
    title: Zijn
    gloss: Zijn eerste dienst is heel goed gegaan.
    note: '*Jego* (zijn) verandert nooit en staat voor het zelfstandig naamwoord: *jego pierwsza zmiana*; het vrouwelijke zelfstandig naamwoord heeft er geen invloed op.'
