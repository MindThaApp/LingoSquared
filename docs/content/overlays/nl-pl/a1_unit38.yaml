  pl.a1.unit38.lesson05.teach.teraz_jest_wiosna:
    title: Een gesprek over jaargetijden
    gloss: 'Het is nu lente. De tulpen zijn mooi. Nina vraagt: Welk seizoen vind jij mooi? Marek zegt: Ik hou van de zomer. In de zomer gaan we zwemmen. Ewa zegt: Ik hou van de winter. In de winter gaan we schaatsen.'
    note: Herhaalt het gesprek in het taalcafé, weergegeven in directe rede.
    glosses:
      wiosna: lente
      Tulipany: tulpen
      ładne: mooi
      pyta: vraagt
      porę: jaargetijde
      uważasz: vinden / denken
      mówi: zegt
      lato: zomer
      Lubię: leuk / geweldig
      pływamy: zwemmen
      zimę: winter
      łyżwach: schaatsen
