  pl.a1.unit38.lesson03.teach.lubie_pora_roku:
    title: De constructie met Lubię
    gloss: '*Lubię* + seizoen zegt welk seizoen je leuk vindt: *Lubię lato.* Het seizoen staat in de accusatief: *wiosnę*, *zimę*.'
    note: '*Lubię* (''ik hou van / ik vind leuk'') krijgt de accusatief: vrouwelijke woorden op *-a* krijgen *-ę* (*zima* -> *zimę*, *wiosna* -> *wiosnę*), terwijl *jesień* en *lato* (een woord op *-o*) er hetzelfde uitzien. Om te zeggen wat je van een seizoen vindt, gebruik je *Uważam* + accusatief + *za* + bijvoeglijk naamwoord: *Uważam jesień za ładną*.'
