teaching:
  pl.a1.unit08.lesson01.teach.bank_poczta:
    title: Bank, postkantoor
    gloss: bank; postkantoor
    note: 'Twee gewone dagelijkse boodschappen: bank lijkt sterk op het Nederlandse woord; poczta is waar je naartoe gaat om een brief of pakket te versturen.'
    example_gloss:
    - Dit is een bank.
    - Dit is een postkantoor.
  pl.a1.unit08.lesson01.teach.apteka_restauracja:
    title: Apotheek, restaurant
    gloss: apotheek; restaurant
    note: Apteka is waar je medicijnen koopt (dus geen gewone winkel); restauracja lijkt sterk op het Nederlandse 'restaurant'.
    example_gloss:
    - Dit is een apotheek.
    - Dit is een restaurant.
  pl.a1.unit08.lesson01.teach.hotel_park:
    title: Hotel, park
    gloss: hotel; park
    note: Beide woorden lijken precies op het Nederlands, dus je herkent ze makkelijk in schrift en spraak.
    example_gloss:
    - Dit is een hotel.
    - Dit is een park.
  pl.a1.unit08.lesson01.teach.gdzie_jest_note:
    title: Gdzie jest + [plaats]?
    gloss: 'Waar is + [plaats]? – Gdzie (waar) plus jest (is) vraagt naar een locatie: Waar is de bank? Waar is de apotheek?'
    note: '*Gdzie* betekent "waar" en *jest* betekent "is". Samen vormen ze met *Gdzie jest...?* de gewone vraag om te vragen waar een plek is. Gebruik dit zo als je naar één plek vraagt; bij meer plekken gebruikt het Pools *są* ("zijn") in plaats van jest.'
  pl.a1.unit08.lesson01.teach.gdzie_jest_bank:
    title: Waar is de bank?
    gloss: Waar is de bank?
    note: Het patroon uit de grammaticanotitie in de praktijk, met het eerste plaatswoord van deze les.
  pl.a1.unit08.lesson02.teach.blisko_daleko:
    title: Dichtbij, ver
    gloss: dichtbij; ver
    note: Een eenvoudig tegenovergesteld paar, direct na jest gebruikt om te zeggen hoe dichtbij of ver iets is.
    example_gloss:
    - Het park is dichtbij.
    - Het hotel is ver weg.
  pl.a1.unit08.lesson02.teach.niedaleko:
    title: Niet ver
    gloss: niet ver
    note: Letterlijk *nie* (niet) plus *daleko* (ver) samengevoegd tot één woord. Het is een zachtere, heel gebruikelijke manier om iemand gerust te stellen dat iets makkelijk te bereiken is.
    example_gloss: De apotheek is niet ver.
  pl.a1.unit08.lesson02.teach.obok_naprzeciwko:
    title: Naast, tegenover
    gloss: naast; tegenover
    note: Beide woorden beschrijven de positie van een plek ten opzichte van een herkenningspunt, niet alleen hoe dichtbij die is. Na beide komt het volgende zelfstandig naamwoord in de genitief, zie de grammaticanotitie van deze les.
    example_gloss:
    - De apotheek is naast de bank.
    - Het restaurant is tegenover het hotel.
  pl.a1.unit08.lesson02.teach.genitive_note:
    title: 'Na ''obok''/''naprzeciwko''/''blisko + zelfstandig naamwoord'': de genitief'
    gloss: 'Na ''naast''/''tegenover''/''dichtbij + een plek'': genitief – bank -> banku, hotel -> hotelu, park -> parku. De apotheek is naast de bank. Het restaurant is tegenover het hotel. Het restaurant is dichtbij het park.'
    note: '*Obok*, *naprzeciwko* en *blisko* (als er een plaats op volgt en het niet alleen staat) vragen allemaal de genitief, dus het zelfstandig naamwoord erachter krijgt een andere uitgang. Bij deze drie regelmatige mannelijke woorden voeg je *-u* toe: *bank* wordt *banku*, *hotel* wordt *hotelu*, *park* wordt *parku*. Los gebruikt heeft *blisko* helemaal geen genitief nodig: *To jest blisko* ("Dat is dichtbij") is net zo correct als *blisko parku* ("dicht bij het park").'
  pl.a1.unit08.lesson02.teach.apteka_obok_banku:
    title: De apotheek is naast de bank
    gloss: De apotheek ligt naast de bank.
    note: 'Het -u-patroon uit de grammaticanotitie in een echte zin: bank wordt banku na obok.'
  pl.a1.unit08.lesson03.teach.przepraszam:
    title: Pardon
    gloss: pardon / sorry
    note: De gewone manier om de aandacht van een vreemde te trekken voordat je een vraag stelt. Je zegt het vóór de vraag, niet erna.
    example_gloss: Pardon, waar is de bank?
  pl.a1.unit08.lesson03.teach.dialogue.line01:
    title: Ewa vraagt naar de apotheek
    gloss: Ewa zegt pardon en vraagt waar de apotheek is.
    note: Przepraszam opent de vraag, zoals in de woordenschatnotitie van deze les staat. Ook bij iemand die ze kent, zoals Marek, is het de beleefde manier om iemand te onderbreken voordat je iets vraagt.
  pl.a1.unit08.lesson03.teach.dialogue.line02:
    title: Marek zegt waar de apotheek is
    gloss: Marek zegt dat de apotheek niet ver is, naast de bank.
    note: Combineert niedaleko en obok + banku, allebei uit de grammaticanotitie van les 2.
  pl.a1.unit08.lesson03.teach.dialogue.line03:
    title: Ewa bedankt Marek en vraagt naar het restaurant
    gloss: Ewa zegt dank je wel en vraagt waar het restaurant is.
    note: Dziękuję kwam al eerder voor; A (en) verbindt de nieuwe vraag met de vorige.
  pl.a1.unit08.lesson03.teach.dialogue.line04:
    title: Marek zegt waar het restaurant is
    gloss: Marek zegt dat het restaurant tegenover het hotel is, dichtbij het park.
    note: Naprzeciwko + hotelu (genitief, hetzelfde patroon als banku) plus blisko voor een tweede oriëntatiepunt.
  pl.a1.unit08.lesson03.teach.dialogue.line05:
    title: Ewa bedankt Marek nog een keer
    gloss: Ewa zegt heel erg bedankt.
    note: Bardzo (heel erg) versterkt dziękuję, net zoals in proszę bardzo.
  pl.a1.unit08.lesson03.teach.dialogue.line06:
    title: Marek antwoordt
    gloss: Marek zegt dat het graag gedaan is.
    note: Proszę bardzo, het standaardantwoord op een bedankje, dat je al kent uit de les over winkelen.
