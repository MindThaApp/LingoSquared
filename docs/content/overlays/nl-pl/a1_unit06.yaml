teaching:
  pl.a1.unit06.lesson01.teach.chleb:
    title: Brood
    gloss: brood
    note: Een basiswoord voor voedsel – je hoort het bij elke maaltijd.
    example_gloss: Dit is brood.
  pl.a1.unit06.lesson01.teach.maslo_ser:
    title: Boter, kaas
    gloss: boter; kaas
    note: Het eerste woord is onzijdig, het tweede mannelijk (levenloos). Geen van beide verandert van uitgang na proszę o, zoals de grammaticanotitie van deze les uitlegt.
    example_gloss:
    - Dit is boter.
    - Dit is kaas.
  pl.a1.unit06.lesson01.teach.woda_mleko:
    title: Water, melk
    gloss: water; melk
    note: Woda is vrouwelijk (de vorm van de accusatief, wodę, staat in de grammaticanotitie van deze les); mleko is onzijdig en verandert nooit.
    example_gloss:
    - Dit is water.
    - Dit is melk.
  pl.a1.unit06.lesson01.teach.kawa_herbata:
    title: Koffie, thee
    gloss: koffie; thee
    note: Beide zijn vrouwelijk. De accusatiefvormen kawę en herbatę gebruik je echt bij het bestellen; die komen aan bod in de grammaticanotitie van deze les.
    example_gloss:
    - Dit is koffie.
    - Dit is thee.
  pl.a1.unit06.lesson01.teach.prosze_o_note:
    title: 'Bestellen: proszę o + accusatief'
    gloss: 'Mag ik ... + accusatief: koffie -> kawę, thee -> herbatę, water -> wodę. Brood, kaas en melk veranderen niet.'
    note: Na *Proszę o* ("mag ik ...", letterlijk "ik vraag om") volgt de accusatief. Vrouwelijke woorden zoals *kawa*, *herbata* en *woda* krijgen *-ę* in plaats van *-a*. Mannelijke levenloze woorden zoals *chleb* en *ser* en onzijdige woorden zoals *mleko* houden precies dezelfde vorm als in het woordenboek.
  pl.a1.unit06.lesson01.teach.prosze_o_kawe:
    title: Een koffie, alstublieft
    gloss: Een koffie, alstublieft.
    note: Zo bestel je op een beleefde, gewone manier iets. Je past hier het patroon uit de grammaticanotitie toe in een volledige vraag.
  pl.a1.unit06.lesson02.teach.zupa:
    title: Soep
    gloss: soep
    note: Een veelvoorkomend gerecht voor lunch of diner, vaak ook het daggerecht, zoals in de restaurantscène van deze unit.
    example_gloss: Dit is soep.
  pl.a1.unit06.lesson02.teach.sok:
    title: Sap
    gloss: sap
    note: Mannelijk (levenloos), net als chleb en ser – de uitgang verandert niet als je het bestelt.
    example_gloss: Dit is sap.
  pl.a1.unit06.lesson02.teach.cukier:
    title: Suiker
    gloss: suiker
    note: Handig bij koffie of thee. Ook mannelijk (levenloos), dus geen verandering van uitgang.
    example_gloss: Dit is suiker.
  pl.a1.unit06.lesson02.teach.rachunek:
    title: De rekening
    gloss: de rekening
    note: Dit vraag je aan het einde van een maaltijd. Proszę o rachunek is de standaard, beleefde manier om erom te vragen.
    example_gloss: De rekening, alstublieft.
  pl.a1.unit06.lesson02.teach.lubic_note:
    title: 'Houden van / lekker vinden: lubię, lubi'
    gloss: 'graag mogen: ik hou van / ik vind lekker, hij/zij houdt van – Ik hou van koffie. Hij houdt van soep.'
    note: '*Lubić* betekent "graag mogen" of "houden van". Hier leer je alleen de vorm voor de eerste persoon (*lubię*) en de derde persoon (*lubi*). *Lubić* heeft ook de accusatief bij zich, hetzelfde patroon als bij *proszę o*: *lubię kawę*, niet *lubię kawa*.'
  pl.a1.unit06.lesson02.teach.lubie_zupe:
    title: Ik hou van soep
    gloss: Ik hou van soep.
    note: 'Zupa wordt zupę in de accusatief: dezelfde verschuiving van vrouwelijk -a naar -ę als in de grammaticanotitie van les 1.'
  pl.a1.unit06.lesson03.teach.danie_dnia:
    title: Het daggerecht
    gloss: Het daggerecht is soep.
    note: '*Dnia* is de genitief van *dzień* (dag). *Danie dnia* is letterlijk "gerecht van de dag", precies zoals je het op een menukaart zou lezen.'
  pl.a1.unit06.lesson03.teach.polecac_note:
    title: 'Aanbevelen: polecam, poleca'
    gloss: 'aanbevelen: ik beveel aan, hij/zij beveelt aan – Ik beveel koffie aan. Hij beveelt soep aan.'
    note: '*Polecać* betekent "aanbevelen". Een ober gebruikt het om een gerecht voor te stellen, en een gast gebruikt hetzelfde werkwoord om om een suggestie te vragen. Ook dit werkwoord heeft de accusatief bij zich, net als *proszę o* en *lubić*.'
  pl.a1.unit06.lesson03.teach.co_pan_poleca:
    title: Wat raadt u aan?
    gloss: Wat raadt u aan?
    note: '*Co* (wat) plus het beleefde *pan*. Dit is de natuurlijke vraag aan een ober, met dezelfde beleefde aanspreekvorm als in unit 1.'
  pl.a1.unit06.lesson03.teach.prosze_bardzo:
    title: Alstublieft / graag gedaan
    gloss: Alstublieft.
    note: Een flexibele, alledaagse uitdrukking. Je zegt het als je iets serveert of overhandigt, en het is ook een natuurlijk antwoord op dziękuję (dank je).
  pl.a1.unit06.lesson03.teach.juz_podaje:
    title: Komt eraan
    gloss: Komt eraan.
    note: Letterlijk "ik serveer het al". Dit is het standaardantwoord van een ober om te laten weten dat de bestelling is gehoord.
  pl.a1.unit06.lesson03.teach.dialogue.line01:
    title: De ober kondigt het daggerecht aan
    gloss: De ober zegt goedendag en kondigt aan dat het daggerecht vandaag soep is.
    note: Dzień dobry, al bekend van de begroetingen in unit 1.
  pl.a1.unit06.lesson03.teach.dialogue.line02:
    title: Ewa vraagt om een aanbeveling
    gloss: Ewa vraagt de ober wat hij aanraadt.
    note: Een beleefde, formele vraag. Met pan spreek je de ober respectvol aan.
  pl.a1.unit06.lesson03.teach.dialogue.line03:
    title: De ober raadt koffie aan
    gloss: De ober raadt de koffie aan.
    note: 'Polecam: de vorm voor de eerste persoon uit de grammaticanotitie van deze les.'
  pl.a1.unit06.lesson03.teach.dialogue.line04:
    title: Ewa doet haar bestelling
    gloss: Ewa zegt dat het goed is en bestelt koffie en soep.
    note: Combineert proszę o met het voegwoord i (en) uit de familie-unit, en gebruikt dus zowel het bestelpatroon uit les 1 als de soepwoordenschat uit les 2.
  pl.a1.unit06.lesson03.teach.dialogue.line05:
    title: De ober bevestigt
    gloss: De ober zegt dat de bestelling eraan komt.
    note: Een korte, natuurlijke bevestiging voordat het eten komt.
  pl.a1.unit06.lesson03.teach.dialogue.line06:
    title: Ewa vraagt om de rekening
    gloss: Ewa bedankt de ober en vraagt om de rekening.
    note: Gebruikt dziękuję uit unit 1 en proszę o + rachunek uit les 2.
  pl.a1.unit06.lesson03.teach.dialogue.line07:
    title: De ober overhandigt de rekening
    gloss: 'De ober zegt: alstublieft.'
    note: Dezelfde proszę bardzo als eerder in deze les, nu als zin bij het overhandigen van de rekening.
