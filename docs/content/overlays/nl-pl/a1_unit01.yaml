answer_policy:
  diacritics: Display and teach all Polish diacritics (ą ć ę ł ń ó ś ź ż). In typed A1 answers, accept a variant with the diacritic dropped or swapped for its plain-letter equivalent (a/c/e/l/n/o/s/z/z) when every other letter and word is correct -- these are genuinely hard to type on a non-Polish keyboard and this is a beginner course, not a spelling test. Do not extend this tolerance to ł vs l at the START of a word where it changes which real word is meant (not a relevant case in this unit's vocabulary, but noted for future units). Punctuation marks (?, !) may be omitted in typed answers, but the fully punctuated form remains the model answer.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names (Anna, Marek, Kowalska, Wójcik) and in the place name Warszawie.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register (pan/pani vs ty) rather than written punctuation or diacritics.
course:
  title: Pools A1
  description: Leer groeten, vragen hoe het met iemand gaat, jezelf voorstellen en basisgegevens uitwisselen in het Pools. Je krijgt extra uitleg over het formaliteitssysteem pan/pani/ty (een echt grammaticaal onderscheid in het Pools, anders dan in het Nederlands), de overeenkomst van werkwoordsuitgangen en natuurlijke registerkeuzes.
units:
  pl.a1.unit01.greetings:
    title: Begroetingen en eerste ontmoetingen
lessons:
  pl.a1.unit01.lesson01.address_and_wellbeing:
    title: 'Pan, pani en ty: vragen hoe het gaat'
  pl.a1.unit01.lesson02.greetings_by_time:
    title: Begroetingen en afscheid op verschillende momenten van de dag
  pl.a1.unit01.lesson03.names_origin_and_smalltalk:
    title: Voornaam, achternaam en waar je vandaan komt
teaching:
  pl.a1.unit01.lesson01.teach.pan:
    title: Formele aanspreekvorm voor een man
    gloss: meneer (formele aanspreekvorm voor een man)
    note: 'Het Nederlands kent naast "jij" ook "u", maar het Pools maakt de keuze op een andere manier: *pan* gebruik je voor een onbekende of professioneel gerespecteerde man. Grammaticaal gedraagt *pan* zich als een onderwerp in de derde persoon: "pan jest" betekent letterlijk "de heer is" en is dus geen echte tweede persoon, ook al gebruik je het voor "u".'
  pl.a1.unit01.lesson01.teach.pani:
    title: Formele aanspreekvorm voor een vrouw
    gloss: mevrouw (formele aanspreekvorm voor een vrouw)
    note: De vrouwelijke tegenhanger van *pan*. Gebruik *pani* voor een onbekende of professioneel gerespecteerde vrouw. Elke volwassen vrouw spreek je met *pani* aan, ongeacht of ze getrouwd is. Het Pools kent in het dagelijks taalgebruik geen onderscheid als mevrouw/juffrouw.
  pl.a1.unit01.lesson01.teach.ty:
    title: Informeel 'je'
    gloss: jij (informeel, enkelvoud)
    note: '*Ty* gebruik je voor een vriend, leeftijdsgenoot, familielid, kind of iedereen met wie je een informele relatie hebt. Anders dan bij *pan*/*pani* krijgt *ty* echte werkwoordsuitgangen van de tweede persoon, bijvoorbeeld *masz* ("jij hebt"), niet die van de derde persoon.'
  pl.a1.unit01.lesson01.teach.jak_sie_pan_ma:
    title: Formele vraag hoe het gaat, aan een man
    gloss: Hoe gaat het met u? (tegen een man, formeel)
    note: Letterlijk "hoe voelt de heer zich". *Ma* is de derde persoon van het werkwoord (het congrueert met *pan* als grammaticaal onderwerp), dezelfde uitgang als bij *on* ("hij").
  pl.a1.unit01.lesson01.teach.jak_sie_pani_ma:
    title: Formele vraag hoe het gaat, aan een vrouw
    gloss: Hoe gaat het met u? (tegen een vrouw, formeel)
    note: 'Hetzelfde patroon als *Jak się pan ma?*, met *pani* in plaats van *pan*. De werkwoordsvorm *ma* verandert niet: het is dezelfde uitgang van de derde persoon, ongeacht het geslacht van de aangesprokene.'
  pl.a1.unit01.lesson01.teach.jak_sie_masz:
    title: Informele vraag naar iemands welzijn
    gloss: Hoe gaat het? (informeel)
    note: 'Bij *ty* krijgt het werkwoord de echte uitgang van de tweede persoon, *masz*, en niet *ma*. Vergelijk formeel *Jak się pan/pani ma?* met informeel *Jak się masz?*: dit is het handigste minimale paar om het verschil tussen pan/pani en ty in het werkwoord zelf te horen.'
  pl.a1.unit01.lesson01.teach.dobrze_dziekuje:
    title: Een standaardantwoord
    gloss: Goed, dank je.
    note: '*Dziękuję* ("dank je") verandert niet met het register: het is hetzelfde woord, of je nu antwoordt aan *pan*, *pani* of *ty*. Alleen de vraag zelf laat de formaliteit zien.'
  pl.a1.unit01.lesson01.teach.a_pan:
    title: De formele vraag teruggeven
    gloss: En met u? (tegen een man, formeel)
    note: Een korte manier om de vraag terug te geven aan een man die je formeel aanspreekt. Vervang *pan* door *pani* ("A pani?") als je de vraag aan een vrouw terugstelt.
  pl.a1.unit01.lesson01.teach.a_ty:
    title: De informele vraag teruggeven
    gloss: En met jou?
    note: Gebruik *ty* om de vraag terug te geven aan een vriend of leeftijdsgenoot.
  pl.a1.unit01.lesson02.teach.czesc:
    title: Informeel hallo en tot ziens
    gloss: hoi; doei (informeel, voor begroeten en afscheid)
    note: '*Cześć* is bijzonder onder de Poolse groeten: het betekent in hetzelfde informele register zowel "hoi" als "doei", net zoals Nederlands "hoi" of "dag" beide kan. Je gebruikt het alleen in *ty*-relaties, nooit met *pan*/*pani*.'
    example_gloss: Hoi, hoe gaat het?
  pl.a1.unit01.lesson02.teach.dzien_dobry:
    title: Groet voor de hele dag
    gloss: goedemorgen; goedendag
    note: '*Dzień dobry* gebruik je op elk moment vóór de avond en is, anders dan *cześć*, neutraal qua register: je kunt het gebruiken met *pan*, *pani* en *ty*. Het is de veiligste standaardgroet voor iemand die je niet goed kent.'
  pl.a1.unit01.lesson02.teach.dobry_wieczor:
    title: Avondgroet
    gloss: goedenavond
    note: Neemt de plaats van *dzień dobry* in zodra het avond is. Ook neutraal qua register.
  pl.a1.unit01.lesson02.teach.dobranoc:
    title: Afscheid voor de nacht
    gloss: goedenacht
    note: 'Anders dan *dzień dobry*/*dobry wieczór* is *dobranoc* een afscheidsgroet en geen begroeting: je zegt het als iemand voor de nacht weggaat of naar bed gaat, nooit om een gesprek te beginnen.'
    example_gloss: Welterusten, Piotr!
  pl.a1.unit01.lesson02.teach.do_widzenia:
    title: Standaardafscheid
    gloss: tot ziens
    note: 'De neutrale, in elk register veilige manier om gedag te zeggen: het kan met *pan*, *pani* en *ty*. Klinkt definitiever dan *do zobaczenia*.'
  pl.a1.unit01.lesson02.teach.do_zobaczenia:
    title: Afscheid met "tot ziens"
    gloss: tot snel
    note: Letterlijk "tot [we] elkaar zien". Het geeft aan dat je verwacht elkaar weer te zien, anders dan het neutralere *do widzenia*.
  pl.a1.unit01.lesson02.teach.milego_dnia:
    title: Beleefde afscheidswens
    gloss: Fijne dag!
    note: '*Miłego dnia* gebruikt de genitief in een wens, hetzelfde patroon als *smacznego* ("smakelijk eten"): een vaste constructie die je beter als geheel leert dan dat je hem nu per naamval analyseert.'
  pl.a1.unit01.lesson03.teach.jak_sie_pan_nazywa:
    title: Formeel naar een naam vragen
    gloss: Hoe heet u? (tegen een man, formeel)
    note: 'Letterlijk "hoe noemt de heer zichzelf": *nazywać się* is een wederkerend werkwoord met de betekenis "heten". Vervang *pan* door *pani* als je formeel een vrouw aanspreekt.'
  pl.a1.unit01.lesson03.teach.jak_masz_na_imie:
    title: Informeel naar een voornaam vragen
    gloss: Hoe heet je? (voornaam)
    note: Gebruikt een ander idioom, *mieć na imię* ("als voornaam hebben"), en vraagt specifiek naar een voornaam, niet naar een volledige naam of achternaam. Zo vraag je op een natuurlijke, informele manier naar de naam van een leeftijdsgenoot.
  pl.a1.unit01.lesson03.teach.nazywam_sie:
    title: Je volledige naam zeggen
    gloss: Mijn naam is Anna Kowalska.
    note: 'De eerste persoon van *nazywać się*, die vanzelfsprekend gevolgd wordt door voor- en achternaam samen: de formelere of completere manier om jezelf voor te stellen.'
  pl.a1.unit01.lesson03.teach.mam_na_imie:
    title: Je voornaam zeggen
    gloss: Ik heet Anna.
    note: 'De eerste persoon van *mieć na imię*, die vanzelfsprekend alleen door een voornaam wordt gevolgd: de losse tegenhanger van *Nazywam się...*.'
  pl.a1.unit01.lesson03.teach.bardzo_mi_milo:
    title: Blij zijn iemand te ontmoeten
    gloss: Aangenaam kennis te maken.
    note: Een vaste, veelgebruikte uitdrukking bij een eerste ontmoeting, geschikt in zowel formele als informele situaties.
  pl.a1.unit01.lesson03.teach.skad_jestes:
    title: Informeel vragen waar iemand vandaan komt
    gloss: Waar komt u vandaan?
    note: '*Skąd* betekent "waarvandaan". Hier zie je de informele *ty*-vorm; de formele tegenhanger *Skąd pan/pani jest?* komt voor in de slotdialoog van deze les.'
  pl.a1.unit01.lesson03.teach.jestem_z:
    title: Je herkomst noemen
    gloss: Ik kom uit Canada.
    note: '*Z* ("uit") vraagt de genitief, dus *Kanada* wordt *Kanady*. De meeste landnamen volgen na *z* ditzelfde patroon.'
  pl.a1.unit01.lesson03.teach.mieszkam_w:
    title: Zeggen waar je woont
    gloss: Ik woon in Warschau.
    note: '*W* ("in") vraagt hier de locatief, dus *Warszawa* wordt *Warszawie*. Herkomst (met *z*) en huidige woonplaats (met *w*) gebruiken verschillende naamvallen bij de plaatsnaam: let op dit patroon, het is geen uitzondering die je uit het hoofd moet leren.'
  pl.a1.unit01.lesson03.teach.dialogue.line01:
    title: De ontmoeting openen
    gloss: Ewa begroet Marek en vraagt formeel naar zijn naam.
    note: Ewa gebruikt het formele *pan*-register bij iemand die ze net ontmoet, de veilige standaard bij een eerste zakelijke of onbekende ontmoeting.
  pl.a1.unit01.lesson03.teach.dialogue.line02:
    title: De ontmoeting openen, antwoord
    gloss: Marek noemt zijn volledige naam en zegt dat hij het aangenaam vindt kennis te maken.
    note: '*Nazywam się* met een volledige naam is het natuurlijke, complete antwoord op een formele vraag naar je naam.'
  pl.a1.unit01.lesson03.teach.dialogue.line03:
    title: Naar herkomst vragen
    gloss: Ewa beantwoordt de beleefdheid en vraagt formeel waar Marek vandaan komt.
    note: '*Skąd pan jest?*, de formele tegenhanger van *Skąd jesteś?* uit deze les, gebruikt *jest*, hetzelfde werkwoordspatroon van de derde persoon dat je al zag bij *pan jest*/*pan ma*.'
  pl.a1.unit01.lesson03.teach.dialogue.line04:
    title: Naar herkomst vragen, antwoord
    gloss: Marek zegt dat hij uit Canada komt, maar in Warschau woont.
    note: '*Ale* ("maar") verbindt het contrast tussen waar Marek oorspronkelijk vandaan komt en waar hij nu woont, hetzelfde onderscheid dat *jestem z*/*mieszkam w* maakt.'
  pl.a1.unit01.lesson03.teach.dialogue.line05:
    title: Vragen naar taalvaardigheid
    gloss: Ewa vraagt formeel of Marek Pools spreekt.
    note: '*Czy* opent een ja/nee-vraag. Het Pools heeft hier geen omkering van onderwerp en werkwoord zoals het Nederlands; *czy* alleen kondigt al aan dat er een vraag komt.'
  pl.a1.unit01.lesson03.teach.dialogue.line06:
    title: Vragen naar taalvaardigheid, antwoorden en afsluiten
    gloss: Marek zegt dat hij een beetje spreekt en nog aan het leren is, en neemt dan afscheid.
    note: '*Jeszcze się uczę* ("ik ben nog aan het leren") is een natuurlijke, bescheiden manier om een voortdurende inspanning te beschrijven. Ook voor jou als echte leerling handig om over jezelf te zeggen.'
