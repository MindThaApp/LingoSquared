teaching:
  pl.a1.unit15.lesson01.teach.dworzec:
    title: Station
    gloss: station
    note: De plek waar treinen en bussen aankomen en vertrekken -- het beginpunt van deze hele unit.
    example_gloss: Het station ligt vlak bij het hotel.
  pl.a1.unit15.lesson01.teach.bilet:
    title: Kaartje
    gloss: kaartje
    note: Dit heb je nodig voordat je in een trein of bus stapt.
    example_gloss: Het kaartje kost twintig zloty.
  pl.a1.unit15.lesson01.teach.peron:
    title: Perron
    gloss: perron
    note: Waar je daadwerkelijk staat te wachten op je trein.
    example_gloss: Perron nummer één is daar.
  pl.a1.unit15.lesson01.teach.peron_numer_note:
    title: Perron nummer één, twee...
    gloss: 'Om een perronnummer te noemen, kun je zeggen Peron numer + getal: Peron numer jeden, Peron numer dwa.'
    note: 'Eenvoudiger dan het lijkt: gewoon *peron* + *numer* + een gewoon getal dat je al kent. (In stationsomroepen worden vaak rangtelwoorden gebruikt, zoals *peron pierwszy* -- "perron één" -- maar *peron numer jeden* wordt altijd begrepen.)'
  pl.a1.unit15.lesson01.teach.pociag_recap:
    title: De trein, nog eens
    gloss: Pociąg odjeżdża o czwartej po południu -- deze zin ken je al van de les over tijd.
    note: Precies hetzelfde gegeven uit de tijdsunit, nu gebruikt in een reissituatie.
  pl.a1.unit15.lesson01.teach.krakow:
    title: Krakau
    gloss: Krakau
    note: Een echte Poolse stad -- de eerste bestemming van deze unit.
    example_gloss: Krakau ligt ver weg.
  pl.a1.unit15.lesson01.teach.do_krakowa_note:
    title: Naar Krakau
    gloss: 'Als je ergens naartoe gaat, zeg je do + een andere vorm van de stadsnaam: do Krakowa (niet do Kraków). Onthoud deze vorm als geheel.'
    note: Probeer *Krakowa* niet af te leiden uit een regel -- leer *do Krakowa* voorlopig gewoon als één vaste uitdrukking.
  pl.a1.unit15.lesson01.teach.bilet_do_krakowa:
    title: Een kaartje naar Krakau, alstublieft
    gloss: Een kaartje naar Krakau, alsjeblieft.
    note: Precies de zin die je bij het loket zegt.
  pl.a1.unit15.lesson01.teach.jechac_note:
    title: To go (by vehicle)
    gloss: 'Jechać (met een voertuig gaan): jadę (ik ga), jedzie (hij/zij gaat). Morgen ga ik naar Krakau. Marek gaat naar Krakau.'
    note: Voorlopig maar twee vormen -- *jadę* voor jezelf, *jedzie* voor iemand anders.
  pl.a1.unit15.lesson01.teach.marek_jedzie:
    title: Marek gaat naar Krakau
    gloss: Marek gaat morgen naar Krakau.
    note: Mareks eigen reis -- zijn verhaal gaat verder in de dialoog van deze unit.
  pl.a1.unit15.lesson02.teach.autobus:
    title: Bus
    gloss: bus
    note: De andere gebruikelijke manier om tussen steden te reizen.
    example_gloss: De bus staat bij het station.
  pl.a1.unit15.lesson02.teach.warszawa:
    title: Warschau
    gloss: Warschau
    note: De hoofdstad van Polen -- de tweede bestemming in deze unit.
    example_gloss: Warschau ligt ver weg.
  pl.a1.unit15.lesson02.teach.do_warszawy_note:
    title: Naar Warschau
    gloss: 'Warszawa verandert anders dan Kraków: do Warszawy (niet do Warszawa). Elke stad heeft een eigen vorm -- leer beide apart.'
    note: '*Krakowa* en *Warszawy* volgen niet hetzelfde patroon -- precies daarom leer je elke vorm apart, niet als één gedeelde regel.'
  pl.a1.unit15.lesson02.teach.dokad:
    title: Waarheen
    gloss: waarheen
    note: Vraagt naar een bestemming, niet naar een plek -- anders dan vragen 'waar' iets al is.
    example_gloss: Waar gaat de bus naartoe?
  pl.a1.unit15.lesson02.teach.godzina_recap:
    title: Om zeven uur, nog eens
    gloss: Siódmej -- deze uurvorm ken je al uit de les over tijd (o siódmej = om zeven uur).
    note: Hetzelfde patroon voor het uur, nu gebruikt voor een vertrektijd.
  pl.a1.unit15.lesson02.teach.autobus_odjezdza:
    title: De bus naar Warschau vertrekt om zeven uur
    gloss: De bus naar Warschau vertrekt om zeven uur.
    note: Brengt de bestemming en de tijd van deze les samen in één echte zin.
  pl.a1.unit15.lesson02.teach.kiedy_recap:
    title: Wanneer, nog eens
    gloss: Kiedy -- dit woord ken je al uit de les over datums. Wanneer vertrekt de bus?
    note: De vanzelfsprekende vraag vóór een reis.
  pl.a1.unit15.lesson02.teach.ewa_jedzie:
    title: Ewa gaat naar Warschau
    gloss: Ewa gaat morgen naar Warschau.
    note: Ewa's eigen reis -- haar verhaal gaat verder in de dialoog van deze unit, naast dat van Marek.
  pl.a1.unit15.lesson03.teach.ja_recap:
    title: Ik, nog eens
    gloss: Ja -- dit woord ken je al uit eerdere lessen.
    note: Een korte herinnering vóór de dialoog van deze les.
  pl.a1.unit15.lesson03.teach.moj_recap:
    title: Mijn, nog eens
    gloss: Mój -- dit woord ken je al uit de les over familie.
    note: Een korte herinnering vóór de dialoog van deze les.
  pl.a1.unit15.lesson03.teach.dziesiatej_rano_note:
    title: Om tien uur 's ochtends, nog eens
    gloss: Dziesiątej en rano -- beide vormen ken je al uit de les over tijd (o dziesiątej rano = om tien uur 's ochtends).
    note: Een korte herinnering vóór de dialoog van deze les.
  pl.a1.unit15.lesson03.teach.dziekuje_recap:
    title: Dank je en tot ziens
    gloss: Dziękuję en Do zobaczenia -- deze ken je al uit eerdere lessen.
    note: Een korte herinnering vóór de dialoog van deze les.
  pl.a1.unit15.lesson03.teach.mila_podrozy_note:
    title: Fijne reis!
    gloss: Miłej podróży! zeg je om iemand een goede reis te wensen -- je gebruikt het als één geheel, niet woord voor woord vertaald.
    note: Een vaste groet bij het afscheid -- leer hem als één blok, net zoals je *Dzień dobry* al leerde.
  pl.a1.unit15.lesson03.teach.dialogue.line01:
    title: Marek gaat morgen naar Krakau
    gloss: Morgen ga ik naar Krakau. Mijn trein vertrekt om vier uur 's middags.
    note: Marek begint met zijn eigen reisplan -- hetzelfde feit dat we in les 1 al over hem hoorden.
  pl.a1.unit15.lesson03.teach.dialogue.line02:
    title: Ewa gaat morgen naar Warschau
    gloss: Ik ga naar Warschau. Mijn bus vertrekt om tien uur 's ochtends.
    note: Ewa vertelt over haar eigen plan -- hetzelfde feit dat we in les 2 al over haar hoorden.
  pl.a1.unit15.lesson03.teach.dialogue.line03:
    title: Marek wenst Ewa een goede reis
    gloss: Fijne reis!
    note: Marek gebruikt de nieuwe uitdrukking van deze les om Ewa het beste te wensen.
  pl.a1.unit15.lesson03.teach.dialogue.line04:
    title: Ewa bedankt Marek en zegt gedag
    gloss: Dank je wel! Tot ziens!
    note: Een eenvoudig, vertrouwd slot van het gesprek.
