teaching:
  pl.a1.unit12.lesson01.teach.wczoraj:
    title: Gisteren
    gloss: gisteren
    note: Het basiswoord om over een recente, afgelopen dag te praten. Het past vanzelf bij de verleden tijd die je in deze unit leert.
    example_gloss: Ik was gisteren in de bioscoop.
  pl.a1.unit12.lesson01.teach.co_bylo_wczoraj:
    title: Wat gebeurde er gisteren?
    gloss: Wat gebeurde er gisteren?
    note: De natuurlijke manier om iemand te vragen wat er recent gebeurd is. Było verandert niet, wie je het ook vraagt, dus deze vraag werkt altijd.
  pl.a1.unit12.lesson01.teach.bylo_note:
    title: Było
    gloss: 'Było is de verleden tijd van być (zijn) in het onzijdige ''het''. Het hoort bij co (wat) en wordt dus gebruikt als je in het algemeen vraagt wat er gebeurd is: Co było wczoraj? Altijd hetzelfde woord, wie er ook antwoordt.'
    note: '*Było* is de onzijdige vorm ''het was''. Het hoort bij *co* (wat) en niet bij de persoon die je iets vraagt. Daarom betekent het in een open vraag als *Co było wczoraj?* ''er was'' of ''wat gebeurde er''.'
  pl.a1.unit12.lesson01.teach.bylem_bylam:
    title: Ik was (man / vrouw)
    gloss: ik was (door een man gezegd) / ik was (door een vrouw gezegd)
    note: 'In de Poolse verleden tijd hoor je het geslacht van de spreker: byłem als een man spreekt, byłam als een vrouw spreekt. Beide betekenen precies ''ik was''.'
    example_gloss:
    - Ik was gisteren in de bioscoop.
    - Ik was gisteren in de bioscoop.
  pl.a1.unit12.lesson01.teach.gender_past_note:
    title: 'Verleden tijd: -em of -am'
    gloss: 'Werkwoorden in de verleden tijd eindigen anders, afhankelijk van het geslacht van de spreker: -em als een man spreekt (byłem), -am als een vrouw spreekt (byłam). Dit geldt voor elk werkwoord in de verleden tijd, niet alleen voor być.'
    note: 'Let op de laatste letters: *-em* geeft aan dat een man spreekt, *-am* dat een vrouw spreekt. Dit patroon zie je bij elk werkwoord in de verleden tijd in deze unit.'
  pl.a1.unit12.lesson01.teach.w_kinie_locative_note:
    title: In de bioscoop
    gloss: 'Kino verandert van uitgang na w: idę do kina (waarheen?) gebruikt een andere vorm dan jestem w kinie (waar?). W kinie is de locatief: die zegt WAAR iets gebeurt, niet waarheen iemand gaat.'
    note: 'Twee verschillende uitgangen, twee verschillende vragen: *do kina* antwoordt op ''waarheen?'' (dat heb je in de unit over plannen geleerd), terwijl *w kinie* antwoordt op ''waar?''. Haal ze niet door elkaar.'
  pl.a1.unit12.lesson01.teach.bylem_w_kinie:
    title: Ik was gisteren in de bioscoop (man)
    gloss: Ik was gisteren in de bioscoop.
    note: 'Hier komen byłem, wczoraj en w kinie samen: zo vertelt een man waar hij was.'
  pl.a1.unit12.lesson01.teach.bylam_w_kinie:
    title: Ik was gisteren in de bioscoop (vrouw)
    gloss: Ik was gisteren in de bioscoop.
    note: 'Dezelfde zin met byłam: zo vertelt een vrouw waar ze was.'
  pl.a1.unit12.lesson02.teach.film:
    title: Film
    gloss: film
    note: Een alledaags woord om te vertellen wat je gekeken hebt. Je hoort het vaak als iemand over een bioscoopbezoek vertelt.
    example_gloss: Ik zag een goede film.
  pl.a1.unit12.lesson02.teach.dobry:
    title: Goed
    gloss: goed
    note: 'Je kent dobry al uit dzień dobry (goedendag). Hier staat het los als gewoon bijvoeglijk naamwoord: ''goed''.'
    example_gloss: Een heel goede film!
  pl.a1.unit12.lesson02.teach.zobaczylem_zobaczylam:
    title: Ik zag (man / vrouw)
    gloss: ik zag (door een man gezegd) / ik zag (door een vrouw gezegd)
    note: 'Zobaczyć beschrijft één afgeronde handeling van zien (tegenover widzieć, dat een voortdurend zien is). Zobaczyłem als een man spreekt, zobaczyłam als een vrouw spreekt: hetzelfde -em/-am-patroon als bij byłem/byłam.'
    example_gloss:
    - Ik zag een goede film.
    - Ik zag een goede film.
  pl.a1.unit12.lesson02.teach.zobaczyc_pattern_note:
    title: Hetzelfde patroon als byłem/byłam
    gloss: 'Hetzelfde patroon als byłem/byłam: zobaczyłem wordt door een man gezegd, zobaczyłam door een vrouw. Zobaczyć is een perfectief werkwoord: het beschrijft één afgeronde gebeurtenis.'
    note: 'Dezelfde uitgang, een nieuw werkwoord: *zobaczyłem/zobaczyłam* volgt precies het patroon dat je net bij *byłem/byłam* hebt geleerd.'
  pl.a1.unit12.lesson02.teach.zrobilem_zrobilam:
    title: Ik maakte / deed (man / vrouw)
    gloss: ik maakte / deed (door een man gezegd) / ik maakte / deed (door een vrouw gezegd)
    note: 'Zrobić betekent zowel ''maken'' als ''doen'' bij één afgeronde handeling: zrobiłem voor een man, zrobiłam voor een vrouw, weer hetzelfde patroon.'
    example_gloss:
    - Ik maakte de lunch.
    - Ik maakte de lunch.
  pl.a1.unit12.lesson02.teach.obiad:
    title: Lunch
    gloss: lunch / middagmaal
    note: Misschien herinner je je obiad nog uit de unit over dagelijkse routines. Hier is het de hoofdmaaltijd van de dag die Marek maakt.
    example_gloss: Dit is een heerlijke lunch.
  pl.a1.unit12.lesson02.teach.pyszny:
    title: Lekker
    gloss: lekker / heerlijk
    note: Een warme, alledaagse manier om eten te prijzen. Het komt vanzelf na obiad.
    example_gloss: Dit is een heerlijke lunch.
  pl.a1.unit12.lesson03.teach.jaki:
    title: Wat voor / welke
    gloss: wat voor / welke
    note: 'Je kent jaki al van vragen naar telefoonnummers en dagen van de week. Hier gebruik je het op dezelfde manier om naar een bepaald detail te vragen: welke film?'
    example_gloss: Wat voor film is dit?
  pl.a1.unit12.lesson03.teach.elliptical_note:
    title: Korte vragen van één woord
    gloss: In een gesprek kun je een korte vraag met één woord stellen, bijvoorbeeld Pyszny? in plaats van de volledige vraag Czy obiad był pyszny? Het klinkt natuurlijk en vlot, net als in een alledaags gesprek.
    note: 'In een echt gesprek laat je de volledige zin weg als de context het al duidelijk maakt. *Pyszny?* betekent op zichzelf: "Was het lekker?"'
  pl.a1.unit12.lesson03.teach.dialogue.line01:
    title: Marek vraagt wat er gebeurd is
    gloss: Hoi Ewa! Wat gebeurde er gisteren?
    note: Hier komt de allereerste vraag van deze unit terug, nu als opening van een echt gesprek.
  pl.a1.unit12.lesson03.teach.dialogue.line02:
    title: Ewa was in de bioscoop
    gloss: Ik was in de bioscoop! Ik zag een goede film.
    note: Byłam (vrouwelijk) en zobaczyłam (vrouwelijk) laten allebei zien dat Ewa spreekt.
  pl.a1.unit12.lesson03.teach.dialogue.line03:
    title: Marek vraagt welke film
    gloss: Wat voor film?
    note: Een korte, natuurlijke vervolgvraag met jaki.
  pl.a1.unit12.lesson03.teach.dialogue.line04:
    title: Ewa antwoordt en vraagt terug
    gloss: Heel goed! En jij?
    note: A ty? (en jij?) geeft het gesprek terug aan Marek, zonder dat je nieuwe grammatica nodig hebt.
  pl.a1.unit12.lesson03.teach.dialogue.line05:
    title: Marek maakte de lunch
    gloss: Ik heb de lunch gemaakt!
    note: Zrobiłem (mannelijk) laat zien dat Marek spreekt. Het is zijn eigen afgeronde gebeurtenis van de dag.
  pl.a1.unit12.lesson03.teach.dialogue.line06:
    title: Ewa vraagt of het lekker was
    gloss: Lekker?
    note: Een vraag van één woord, precies het patroon uit de grammaticanotitie van deze les.
