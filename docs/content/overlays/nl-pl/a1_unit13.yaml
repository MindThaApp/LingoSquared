teaching:
  pl.a1.unit13.lesson01.teach.muzyka:
    title: Muziek
    gloss: muziek
    note: Een veelgebruikt onderwerp om te praten over wat je wel en niet leuk vindt -- een makkelijk te herkennen woord, want het lijkt sterk op het Nederlandse 'muziek'.
    example_gloss: Ik hou van muziek.
  pl.a1.unit13.lesson01.teach.muzyke_accusative_note:
    title: Muzyka -> muzykę
    gloss: 'Na lubić (houden van, leuk vinden) + object verandert muzyka in muzykę, net zoals kawa in kawę verandert. Lubię muzykę, niet: Lubię muzyka.'
    note: 'Hetzelfde patroon dat je al kent: *muzyka* wordt *muzykę* als lijdend voorwerp van *lubię*, net zoals *kawa* *kawę* wordt.'
  pl.a1.unit13.lesson01.teach.lubisz:
    title: Jij houdt van
    gloss: jij houdt van / jij vindt leuk (informeel, ty)
    note: De 'ty'-vorm van lubić -- wat je nodig hebt om een vriend(in) rechtstreeks te vragen of hij of zij iets leuk vindt.
    example_gloss: Hou jij van muziek?
  pl.a1.unit13.lesson01.teach.lubic_paradigm_note:
    title: 'Lubić: lubię, lubisz, lubi'
    gloss: 'Lubić (houden van, leuk vinden): lubię (ik), lubisz (jij), lubi (hij/zij). Lubię en lubi ken je al -- lubisz is de nieuwe vorm, voor de persoon met wie je praat.'
    note: '*Lubię* en *lubi* ken je inmiddels goed -- *lubisz* is de ontbrekende ''jij''-vorm van hetzelfde werkwoord.'
  pl.a1.unit13.lesson01.teach.czy_lubisz_muzyke:
    title: Hou jij van muziek?
    gloss: Hou jij van muziek?
    note: Czy opent een ja/nee-vraag -- de natuurlijke manier om een vriend(in) naar een voorkeur te vragen.
  pl.a1.unit13.lesson01.teach.tak_lubie:
    title: Ja, dat vind ik leuk.
    gloss: Ja, dat vind ik leuk.
    note: Een kort, natuurlijk antwoord -- je hoeft het woord muzykę niet te herhalen.
  pl.a1.unit13.lesson01.teach.nie_nie_lubie:
    title: Nee, dat niet.
    gloss: Nee, dat vind ik niet leuk.
    note: Nie nie lubię lijkt dubbel, maar is geen fout -- de eerste nie is het antwoord op de vraag, de tweede nie ontkent lubię.
  pl.a1.unit13.lesson01.teach.ellipsis_note:
    title: Korte antwoorden
    gloss: 'Kort antwoord: Tak, lubię. / Nie, nie lubię. -- je hoeft het woord muzykę niet te herhalen, want uit de vraag is al duidelijk waarover het gaat.'
    note: Net zoals *Pyszny?* op zichzelf kon staan, hoeft *Tak, lubię.* niet te herhalen waarover je praat -- de context maakt het al duidelijk.
  pl.a1.unit13.lesson01.teach.bardzo_lubie_muzyke:
    title: Ik hou veel van muziek
    gloss: Ik hou erg van muziek.
    note: Bardzo (erg / heel) maakt een gewone voorkeur sterker -- bardzo ken je al sinds de allereerste unit.
  pl.a1.unit13.lesson02.teach.wole:
    title: ik geef de voorkeur aan
    gloss: ik geef de voorkeur aan
    note: Een gloednieuw werkwoord in deze unit, woleć (liever willen, de voorkeur geven aan) -- hier leer je alleen de 'ik'-vorm, net als bij lubię.
    example_gloss: Ik heb liever thee.
  pl.a1.unit13.lesson02.teach.wolec_scope_note:
    title: 'Woleć: in deze unit alleen wolę'
    gloss: 'Woleć (liever willen): wolę (ik) -- in deze les leer je alleen de ''ik''-vorm, net als bij lubię. Wolę kawę. = Ik heb liever koffie.'
    note: Voorlopig alleen de *ja*-vorm (ik) van *woleć*, precies dezelfde beperking als bij *lubię* toen dat werd geïntroduceerd.
  pl.a1.unit13.lesson02.teach.kawa_herbata_recap:
    title: Koffie en thee, nog eens
    gloss: 'Wolę + object: kawa wordt kawę, herbata wordt herbatę -- hetzelfde patroon dat je al kent.'
    note: 'Hetzelfde patroon van de vierde naamval als eerder, alleen met een nieuw werkwoord: *wolę kawę*, *wolę herbatę*.'
  pl.a1.unit13.lesson02.teach.wole_kawe:
    title: Ik geef de voorkeur aan koffie
    gloss: Ik heb liever koffie.
    note: Een eenvoudige uitspraak over een voorkeur met wolę.
  pl.a1.unit13.lesson02.teach.wole_herbate:
    title: Ik heb liever thee
    gloss: Ik heb liever thee.
    note: Hetzelfde patroon, met herbatę in plaats van kawę.
  pl.a1.unit13.lesson02.teach.czy_or_note:
    title: Czy als 'of'
    gloss: De czy in Kawa czy herbata? is niet dezelfde czy als die waarmee een ja/nee-vraag begint -- hier verbindt het twee keuzes, zoals Nederlands 'of'. Kawa czy herbata? = Koffie of thee?
    note: 'Let op: *czy* opent meestal een ja/nee-vraag, maar tussen twee zelfstandige naamwoorden zoals hier betekent het gewoon ''of''.'
  pl.a1.unit13.lesson02.teach.kawa_czy_herbata:
    title: Koffie of thee?
    gloss: Koffie of thee?
    note: Een korte, natuurlijke manier om iemand een keuze aan te bieden.
  pl.a1.unit13.lesson03.teach.ja_tez:
    title: Ik ook
    gloss: ik ook
    note: Een korte manier om het eens te zijn met wat iemand net zei.
  pl.a1.unit13.lesson03.teach.ja_tez_note:
    title: Ja też, nog eens
    gloss: Ja też betekent 'ik ook' -- je kent het al uit de les over dagelijkse routine (Ja też wstaję o siódmej, 'ik sta ook om zeven uur op').
    note: Een korte herinnering dat deze uitdrukking al eerder is voorgekomen.
  pl.a1.unit13.lesson03.teach.elliptical_reminder_note:
    title: Kawa czy herbata? heeft geen werkwoord nodig
    gloss: Net als Pyszny? uit de vorige unit heeft de korte vraag Kawa czy herbata? geen werkwoord nodig -- de context is genoeg.
    note: Hetzelfde patroon als *Pyszny?* -- een korte vraag zonder werkwoord die door de context volkomen duidelijk is.
  pl.a1.unit13.lesson03.teach.dialogue.line01:
    title: Marek vraagt Ewa of ze van muziek houdt
    gloss: Hou jij van muziek?
    note: Marek opent het gesprek met de vraag die je in deze unit net hebt geleerd.
  pl.a1.unit13.lesson03.teach.dialogue.line02:
    title: Ewa houdt ervan en vraagt terug
    gloss: Ja, ik hou er erg van! En jij?
    note: A ty? (en jij?) geeft de vraag terug aan Marek, hetzelfde patroon als in eerdere units.
  pl.a1.unit13.lesson03.teach.dialogue.line03:
    title: Marek is het met haar eens en vraagt naar drankjes
    gloss: Ik ook. Koffie of thee?
    note: Ja też lubię bevestigt Mareks eigen antwoord, voordat hij met een nieuwe 'of'-vraag van onderwerp verandert.
  pl.a1.unit13.lesson03.teach.dialogue.line04:
    title: Ewa heeft liever koffie
    gloss: Ik heb liever koffie.
    note: Ewa zegt zelf wat ze liever heeft, met wolę – dezelfde koffiedrinkster die we in de eenheid over routines hebben ontmoet.
  pl.a1.unit13.lesson03.teach.dialogue.line05:
    title: Marek drinkt liever thee
    gloss: Ik drink liever thee.
    note: Mareks eigen voorkeur – precies de tegenovergestelde keuze van Ewa.
