teaching:
  pl.a1.unit17.lesson01.teach.jestem_zawod_note:
    title: Ik ben ingenieur / lerares
    gloss: Ik ben ingenieur. Ik ben lerares. -- 'inżynier' en 'nauczycielka' veranderen van uitgang na 'Jestem.'
    note: Dit is de eerste keer in deze cursus dat de uitgang van een woord verandert om je beroep aan te geven -- voorlopig geldt dat alleen voor deze twee beroepswoorden.
  pl.a1.unit17.lesson01.teach.inzynier:
    title: Ingenieur
    gloss: ingenieur
    note: In het alledaagse Pools blijft dit woord meestal *inżynier*, ook voor een vrouw.
    example_gloss: Marek is ingenieur.
  pl.a1.unit17.lesson01.teach.nauczyciel_nauczycielka:
    title: Lerares
    gloss: leraar / lerares
    note: Anders dan *inżynier* verandert dit beroepswoord wél naar geslacht -- *nauczyciel* voor een man, *nauczycielka* voor een vrouw.
    example_gloss:
    - Hij is leraar.
    - Ewa is lerares.
  pl.a1.unit17.lesson01.teach.marek_ewa_recap:
    title: Marek en Ewa, opnieuw
    gloss: Marek, Ewa -- deze namen ken je al van eerdere lessen.
    note: Een korte herinnering voordat deze les beide namen gebruikt.
  pl.a1.unit17.lesson01.teach.jest_recap:
    title: Is -- opnieuw
    gloss: Jest -- dit woord ken je al van eerdere lessen, bijvoorbeeld 'Dom jest tam' (het huis is daar).
    note: Een korte herinnering voordat deze les het gebruikt om over iemands beroep te praten.
  pl.a1.unit17.lesson01.teach.marek_jest_inzynierem:
    title: Mareks beroep
    gloss: Marek is ingenieur.
    note: Het gegeven over Marek waarop deze hele unit voortbouwt.
  pl.a1.unit17.lesson01.teach.ewa_jest_nauczycielka:
    title: Ewa's beroep
    gloss: Ewa is lerares.
    note: Het gegeven over Ewa waarop deze hele unit voortbouwt.
  pl.a1.unit17.lesson02.teach.pracowac_recap_pracujesz:
    title: Werken -- jij werkt
    gloss: 'Pracować (pracuję ken je al van eerdere lessen): pracuję (ik), pracujesz (jij). Waar werk je?'
    note: Voorlopig maar twee vormen -- *pracuję* voor jezelf, *pracujesz* om het aan iemand anders te vragen, hetzelfde patroon als bij *czuć się* in de vorige unit.
  pl.a1.unit17.lesson02.teach.szkola:
    title: School
    gloss: school
    note: Waar een lerares zoals Ewa werkt.
    example_gloss: Ik werk op een school.
  pl.a1.unit17.lesson02.teach.biuro:
    title: Kantoor
    gloss: kantoor
    note: Waar een ingenieur zoals Marek werkt.
    example_gloss: Ik werk op een kantoor.
  pl.a1.unit17.lesson02.teach.w_miejsce_pracy_note:
    title: Op school, op kantoor
    gloss: 'W + werkplek: w szkole, w biurze -- hetzelfde patroon als w Warszawie of w Krakowie.'
    note: Hetzelfde idee als bij de stadsnamen die je al hebt geleerd (*w Warszawie*, *w Krakowie*) -- de uitgang verandert een beetje om *in/op* die plaats aan te geven.
  pl.a1.unit17.lesson02.teach.gdzie_pracujesz_phrase:
    title: Waar werk jij?
    gloss: Waar werk je?
    note: De natuurlijke vraag om naar iemands werk te vragen.
  pl.a1.unit17.lesson03.teach.a_ty_recap:
    title: En jij -- opnieuw
    gloss: A ty -- deze uitdrukking ken je al van eerdere lessen.
    note: Een korte herinnering voor de dialoog van deze les.
  pl.a1.unit17.lesson03.teach.dialogue.line01:
    title: Marek vraagt Ewa naar haar werk
    gloss: Waar werk je, Ewa?
    note: Marek opent het gesprek met een directe vraag.
  pl.a1.unit17.lesson03.teach.dialogue.line02:
    title: Ewa antwoordt
    gloss: Ik werk op een school. Ik ben lerares.
    note: Ewa noemt zowel haar werkplek als haar beroep -- dezelfde gegevens als eerder in deze unit.
  pl.a1.unit17.lesson03.teach.dialogue.line03:
    title: Ewa vraagt het terug aan Marek
    gloss: En jij, Marek? Waar werk jij?
    note: Ewa geeft de vraag terug aan Marek.
  pl.a1.unit17.lesson03.teach.dialogue.line04:
    title: Marek antwoordt
    gloss: Ik werk op een kantoor. Ik ben ingenieur.
    note: Marek noemt zowel zijn werkplek als zijn beroep -- dezelfde gegevens als eerder in deze unit.
