teaching:
  pl.a1.unit07.lesson01.teach.banan:
    title: Banaan
    gloss: banaan
    note: Een veelvoorkomend fruit, op elke markt of in elke winkel per stuk of per gewicht te koop.
    example_gloss: Dit is een banaan.
  pl.a1.unit07.lesson01.teach.pomidor_ogorek:
    title: Tomaat, komkommer
    gloss: tomaat; komkommer
    note: Beide zijn mannelijk en levenloos – hun genitief meervoud (pomidorów, ogórków) heb je nodig zodra je ze per kilo koopt, verderop in deze les.
    example_gloss:
    - Dit is een tomaat.
    - Dit is een komkommer.
  pl.a1.unit07.lesson01.teach.ziemniak_cebula:
    title: Aardappel, ui
    gloss: aardappel; ui
    note: Ziemniak is mannelijk en levenloos (dezelfde genitief meervoud op -ów als banan en pomidor); cebula is vrouwelijk.
    example_gloss:
    - Dit is een aardappel.
    - Dit is een ui.
  pl.a1.unit07.lesson01.teach.tanio_drogo:
    title: Goedkoop, duur
    gloss: goedkoop; duur
    note: '*Tanio* en *drogo* zijn bijwoorden, en het Pools combineert ze rechtstreeks met *kosztować* ("kosten"): *To kosztuje drogo* betekent letterlijk "dat kost duur", dus "dat is duur".'
    example_gloss:
    - Heel goedkoop!
    - Heel duur!
  pl.a1.unit07.lesson01.teach.kosztuje_kosztuja_note:
    title: 'Kosten: kosztuje, kosztują'
    gloss: 'kosten: het kost (één ding), ze kosten (meer dan één) -- Een banaan is goedkoop. Bananen zijn goedkoop.'
    note: '*Kosztować* is het werkwoord "kosten". Gebruik *kosztuje* voor één ding en *kosztują* voor meer dan één – net als *jest*/*są* ("is"/"zijn"), maar dan voor prijzen. Dit goed doen is belangrijk: een marktkoopman begrijpt je hoe dan ook, maar *banany kosztują* is wat een moedertaalspreker echt zegt.'
  pl.a1.unit07.lesson01.teach.ile_kosztuje_banan:
    title: Hoeveel kost een banaan?
    gloss: Hoeveel kost een banaan?
    note: De alledaagse vraag om een prijsonderhandeling te openen – *Ile* (hoeveel) plus het enkelvoud *kosztuje*, omdat er naar één banaan wordt gevraagd.
  pl.a1.unit07.lesson02.teach.grejpfrut:
    title: Grapefruit
    gloss: grapefruit
    note: Mannelijk en levenloos, net als pomidor en ziemniak – geen verandering van uitgang na proszę o.
    example_gloss: Dit is een grapefruit.
  pl.a1.unit07.lesson02.teach.mandarynka_pomarancza:
    title: Mandarijn, sinaasappel
    gloss: mandarijn; sinaasappel
    note: Beide vrouwelijk, net als kawa en herbata in de eenheid over eten – in de accusatief wisselen ze -a voor -ę, maar in deze les heb je alleen de gewone woordenboekvorm nodig.
    example_gloss:
    - Dit is een mandarijn.
    - Dit is een sinaasappel.
  pl.a1.unit07.lesson02.teach.kilo_pol_kilo:
    title: Een kilo, een halve kilo
    gloss: een kilo; een halve kilo
    note: '*Kilo* verandert zelf nooit van uitgang, wat je ook weegt en hoeveel je ook vraagt – het is het zelfstandig naamwoord na *kilo* dat verandert, zoals de grammaticanotitie van deze les uitlegt.'
    example_gloss:
    - Een kilo tomaten, alstublieft.
    - Een halve kilo bananen, alstublieft.
  pl.a1.unit07.lesson02.teach.poprosze:
    title: Ik wil graag (alstublieft)
    gloss: ik wil graag / geef mij alstublieft
    note: '*Poproszę* is een iets beleefder, alledaags alternatief voor *proszę o* uit de eenheid over eten – beide betekenen ongeveer "ik wil graag", en Polen wisselen vrij tussen de twee. Na *Poproszę* volgt direct wat je wilt, zonder *o*.'
    example_gloss: Een grapefruit, alstublieft.
  pl.a1.unit07.lesson02.teach.genitive_ow_note:
    title: 'Na ''kilo'': de uitgang -ów'
    gloss: 'Genitief meervoud na ''kilo'': banaan -> bananen, tomaat -> tomaten, aardappel -> aardappelen.'
    note: 'Als je een hoeveelheid naar gewicht noemt – *kilo*, *pół kilo* – komt het zelfstandig naamwoord erachter in een andere vorm te staan: de genitief meervoud. Bij deze drie regelmatige mannelijke woorden voeg je gewoon *-ów* toe: *banan* wordt *bananów*, *pomidor* wordt *pomidorów*, *ziemniak* wordt *ziemniaków*.'
  pl.a1.unit07.lesson02.teach.poprosze_kilo_pomidorow:
    title: Een kilo tomaten, alstublieft
    gloss: Een kilo tomaten, alsjeblieft.
    note: Het -ów-patroon uit de grammaticanotitie in een echt verzoek – pomidor wordt pomidorów na kilo.
  pl.a1.unit07.lesson03.teach.dla:
    title: Voor
    gloss: voor
    note: Een eenvoudig voorzetsel dat 'voor' betekent – een verkoper gebruikt het in *Co dla pani?* (letterlijk "wat voor u?") om een klant formeel te vragen wat ze wil.
    example_gloss: Dit is voor u.
  pl.a1.unit07.lesson03.teach.swieze_bardzo:
    title: Vers, heel
    gloss: vers; heel
    note: Twee alledaagse woorden die een marktkoopman voortdurend gebruikt – om te roemen hoe vers iets is, of hoe goedkoop of duur.
    example_gloss:
    - De tomaten zijn vers.
    - Heel goedkoop!
  pl.a1.unit07.lesson03.teach.trochę:
    title: Een beetje
    gloss: een beetje
    note: Maakt een klacht beleefder – trochę drogo ("een beetje duur") klinkt in een vriendelijk geprakkezeer om de prijs veel natuurlijker dan alleen drogo.
    example_gloss: Een beetje duur.
  pl.a1.unit07.lesson03.teach.razem:
    title: Totaal / samen
    gloss: totaal / samen
    note: Wat een verkoper zegt vlak voordat hij het eindbedrag noemt.
    example_gloss: Samen tien zloty.
  pl.a1.unit07.lesson03.teach.co_dla_pani:
    title: Wat wilt u?
    gloss: Wat wilt u?
    note: Letterlijk "wat voor u (formeel)" – de natuurlijke openingsvraag van een verkoper aan een klant.
  pl.a1.unit07.lesson03.teach.dialogue.line01:
    title: De verkoper begroet Ewa
    gloss: De verkoper zegt gedag en vraagt Ewa wat ze wil.
    note: Dzień dobry, hergebruikt uit de begroetingen van eenheid 1.
  pl.a1.unit07.lesson03.teach.dialogue.line02:
    title: Ewa vraagt naar bananen
    gloss: Ewa vraagt hoeveel de bananen kosten.
    note: Kosztują – de meervoudsvorm uit de grammaticanotitie van deze eenheid, want er wordt naar bananen als groep gevraagd.
  pl.a1.unit07.lesson03.teach.dialogue.line03:
    title: De verkoper noemt de prijs
    gloss: De verkoper zegt dat het vijf zloty per kilo is en dat de bananen heel vers zijn.
    note: Een natuurlijke verkorte prijszin – "[prijs] kilo" is hoe een Poolse verkoper een prijs per kilo noemt, zonder extra woord voor "per".
  pl.a1.unit07.lesson03.teach.dialogue.line04:
    title: Ewa bestelt bananen
    gloss: Ewa zegt dat het goed is en vraagt om een kilo bananen.
    note: Combineert poproszę met kilo + bananów, precies het patroon uit de grammaticanotitie van les 2.
  pl.a1.unit07.lesson03.teach.dialogue.line05:
    title: De verkoper brengt tomaten ter sprake
    gloss: De verkoper vraagt ook naar tomaten en zegt dat die acht zloty per kilo kosten.
    note: Hetzelfde verkorte prijspatroon als in regel 3, nu voor een ander product.
  pl.a1.unit07.lesson03.teach.dialogue.line06:
    title: Ewa onderhandelt voorzichtig en bestelt
    gloss: Ewa zegt dat het een beetje duur is, maar neemt toch een halve kilo.
    note: Trochę drogo maakt de klacht zachter – Ewa koopt nog steeds, alleen een kleinere hoeveelheid.
  pl.a1.unit07.lesson03.teach.dialogue.line07:
    title: De verkoper noemt het totaalbedrag
    gloss: De verkoper zegt alstublieft en dat het totaal negen zloty is.
    note: '5 złotych voor de bananen plus 4 złotych voor een halve kilo tomaten: samen negen złotych, precies zoals alle eerder genoemde prijzen in de scène.'
