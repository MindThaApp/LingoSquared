teaching:
  pl.a1.unit16.lesson01.teach.boli_note:
    title: Het doet pijn
    gloss: 'Boleć (pijn doen), tegenwoordige tijd: boli (hij/zij/het) en bolą (zij, meervoud). Głowa mnie boli betekent ''mijn hoofd doet pijn'' – letterlijk ''het hoofd doet mij pijn''.'
    note: Voor pijntjes gebruik je de tegenwoordige tijd van *boleć* in precies deze twee vormen. Het lichaamsdeel is het onderwerp en *mnie* geeft aan van wie het is, dus je hoeft hier geen 'ik'-vorm te leren.
  pl.a1.unit16.lesson01.teach.glowa:
    title: Hoofd
    gloss: hoofd
    note: Het meest gebruikte lichaamsdeel om pijn aan te geven.
    example_gloss: Mijn hoofd doet pijn.
  pl.a1.unit16.lesson01.teach.gardlo:
    title: Keel
    gloss: keel
    note: Handig om een verkoudheid of keelpijn te beschrijven.
    example_gloss: Mijn keel doet pijn.
  pl.a1.unit16.lesson01.teach.brzuch:
    title: Maag
    gloss: buik
    note: Handig na een grote maaltijd, of als je iets niet goed bekomt.
    example_gloss: Mijn buik doet pijn.
  pl.a1.unit16.lesson01.teach.zeby:
    title: Tanden
    gloss: tanden
    note: Hier altijd in het meervoud, net zoals een Pool het zegt. Daarom staat er *bolą* (en niet *boli*) bij.
    example_gloss: Mijn tanden doen pijn.
  pl.a1.unit16.lesson01.teach.co_cie_boli:
    title: Waar heeft u pijn?
    gloss: Wat doet je pijn?
    note: De natuurlijke vraag aan iemand die zich niet goed voelt.
  pl.a1.unit16.lesson02.teach.czuc_sie_note:
    title: Hoe voel je je?
    gloss: 'Czuć się (zich voelen): czuję się (ik), czujesz się (jij). Hoe voel je je?'
    note: 'Voorlopig maar twee vormen: *czuję* voor jezelf, *czujesz* om het aan iemand anders te vragen.'
  pl.a1.unit16.lesson02.teach.dobrze_zle_contrast:
    title: Goed en slecht
    gloss: Ik voel me goed. Ik voel me slecht. – dobrze ken je al; źle is het tegenovergestelde.
    note: Hetzelfde *dobrze* dat je sinds je allereerste les gebruikt, nu met zijn tegenovergestelde erbij.
  pl.a1.unit16.lesson02.teach.zle:
    title: Slecht
    gloss: slecht
    note: Het woord dat je nodig hebt om te zeggen dat je je niet goed voelt.
    example_gloss: Ik voel me slecht.
  pl.a1.unit16.lesson02.teach.goraczka:
    title: Koorts
    gloss: koorts
    note: Een veelvoorkomend, basaal symptoom om te noemen.
    example_gloss: Ik heb koorts.
  pl.a1.unit16.lesson02.teach.ewa_ma_recap:
    title: Ewa, heeft – opnieuw
    gloss: Ewa, ma – deze naam en deze vorm van het werkwoord mieć (hebben) ken je al uit eerdere lessen (Mam, masz, ma).
    note: Een korte herinnering voordat deze les beide gebruikt.
  pl.a1.unit16.lesson02.teach.chory_chora:
    title: Ziek
    gloss: ziek (mannelijk) / ziek (vrouwelijk)
    note: 'Hetzelfde -y/-a-patroon als bij *młodszy/starsza*: *chory* voor een man, *chora* voor een vrouw.'
    example_gloss:
    - Hij is ziek.
    - Zij is ziek.
  pl.a1.unit16.lesson02.teach.ewa_line_preview:
    title: Ewa voelt zich niet goed
    gloss: Ik voel me slecht. Ik heb koorts.
    note: Ewa beschrijft haar eigen klachten – hetzelfde zegt ze straks weer in het gesprek van deze unit.
  pl.a1.unit16.lesson03.teach.marek_recap:
    title: Marek, opnieuw
    gloss: Marek – deze naam ken je al uit eerdere lessen.
    note: Een korte herinnering voor het gesprek in deze les.
  pl.a1.unit16.lesson03.teach.i_recap:
    title: En, opnieuw
    gloss: I – dit woord ken je al uit eerdere lessen.
    note: Een korte herinnering voor het gesprek in deze les.
  pl.a1.unit16.lesson03.teach.prosze_wode_recap:
    title: Alsjeblieft en water, opnieuw
    gloss: Proszę en wodę – beide woorden ken je al uit eerdere lessen.
    note: Een korte herinnering voor het gesprek in deze les.
  pl.a1.unit16.lesson03.teach.dziekuje_recap:
    title: Dank je, opnieuw
    gloss: Dziękuję – dit woord ken je al uit eerdere lessen.
    note: Een korte herinnering voor het gesprek in deze les.
  pl.a1.unit16.lesson03.teach.odpoczac:
    title: Uitrusten
    gloss: uitrusten
    note: 'Wordt gebruikt met *Proszę*, net zoals je al iemand vroeg rechtdoor te gaan of een bepaalde kant op te slaan: *Proszę* + infinitief, een gebiedende wijs is niet nodig.'
    example_gloss: Rust alstublieft uit.
  pl.a1.unit16.lesson03.teach.pic:
    title: Drinken
    gloss: drinken
    note: Nog een infinitief die op dezelfde manier op *Proszę* volgt.
    example_gloss: Drink alstublieft water.
  pl.a1.unit16.lesson03.teach.dialogue.line01:
    title: Marek vraagt hoe Ewa zich voelt
    gloss: Ewa, hoe voel je je?
    note: Marek merkt dat er iets mis is en vraagt het rechtstreeks.
  pl.a1.unit16.lesson03.teach.dialogue.line02:
    title: Ewa beschrijft haar klachten
    gloss: Ik voel me slecht. Mijn keel doet pijn en ik heb koorts.
    note: Ewa noemt duidelijk twee klachten – dezelfde als die ze eerder in deze unit noemde.
  pl.a1.unit16.lesson03.teach.dialogue.line03:
    title: Marek geeft een eenvoudig advies
    gloss: Rust alstublieft uit en drink water.
    note: Eenvoudig advies zonder diagnose – geen medische instructie, gewoon gezond verstand.
  pl.a1.unit16.lesson03.teach.dialogue.line04:
    title: Ewa bedankt Marek
    gloss: Goed, dank je, Marek.
    note: Een eenvoudige, vertrouwde afsluiting van het gesprek.
