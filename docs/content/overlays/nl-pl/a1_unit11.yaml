teaching:
  pl.a1.unit11.lesson01.teach.chciec_chce:
    title: Willen, ik wil
    gloss: willen; ik wil
    note: Chcieć is de infinitief; chcę is de alledaagse vorm voor de eerste persoon, die je gebruikt om te zeggen wat je wilt.
    example_gloss: Ik wil naar de bioscoop gaan.
  pl.a1.unit11.lesson01.teach.chcesz:
    title: Jij wilt
    gloss: jij wilt / wil je (informeel)
    note: Chcesz is de informele 'jij'-vorm, op dezelfde manier gebruikt als masz en jesteś -- precies wat je gebruikt om een vriend te vragen wat hij of zij wil.
    example_gloss: Wil je koffie?
  pl.a1.unit11.lesson01.teach.chciec_osoba_note:
    title: Ik wil, jij wilt
    gloss: 'Chcę, chcesz -- hetzelfde patroon als masz (mieć) en jesteś (być): chcesz is de ''jij''-vorm (tweede persoon), die je gebruikt als je iemand anders vraagt wat hij of zij wil.'
    note: In deze les heb je iets meer nodig dan 'ik' -- *chcę* (ik wil) en *chcesz* (jij wilt) volgen precies hetzelfde persoonspatroon als *masz* en *jesteś*, alleen nu bij een nieuw werkwoord.
  pl.a1.unit11.lesson01.teach.kino:
    title: Bioscoop
    gloss: bioscoop
    note: Het alledaagse woord voor de bioscoop -- je hoort het voortdurend als je plannen maakt.
    example_gloss: Dit is de bioscoop.
  pl.a1.unit11.lesson01.teach.razem:
    title: Samen
    gloss: samen
    note: 'Razem betekent ook ''totaal'' in een winkelcontext (misschien herinner je het je uit de winkelles) -- hier gebruik je het in de andere alledaagse betekenis: ''samen''.'
    example_gloss: Wil je samen gaan?
  pl.a1.unit11.lesson01.teach.czy_chcesz_isc_do_kina:
    title: Wil je naar de bioscoop gaan?
    gloss: Wil je naar de bioscoop gaan?
    note: Czy opent een ja/nee-vraag; chcesz iść do kina vraagt wat de ander wil doen -- de basismanier om een plan voor te stellen.
  pl.a1.unit11.lesson01.teach.czy_chcesz_isc_razem_do_kina_w_piatek:
    title: Wil je vrijdag samen naar de bioscoop gaan?
    gloss: Wil je vrijdag samen naar de bioscoop gaan?
    note: 'Het volledige voorstel: razem (samen) en w piątek (op vrijdag) toegevoegd aan de vraag die je net hebt geleerd.'
  pl.a1.unit11.lesson02.teach.moc_moge:
    title: Kunnen, ik kan
    gloss: kunnen; ik kan
    note: 'Móc is de infinitief; mogę is de eerste persoon -- misschien herinner je je możemy (''wij kunnen'') uit de eerdere lessen over datum en tijd: dit is hetzelfde werkwoord, in het enkelvoud.'
    example_gloss: Ik kan vrijdag komen.
  pl.a1.unit11.lesson02.teach.mozesz:
    title: Jij kunt
    gloss: jij kunt / kun je (informeel)
    note: Możesz is de informele 'jij'-vorm, hetzelfde tweede-persoonspatroon als chcesz -- je gebruikt het om te vragen of iemand anders iets kan.
    example_gloss: Kun je zaterdag?
  pl.a1.unit11.lesson02.teach.przyjsc:
    title: Komen
    gloss: komen
    note: Het werkwoord voor komen om iemand te ontmoeten -- past mooi bij mogę/możesz om te zeggen wie wel of niet kan komen.
    example_gloss: Ik wil vrijdag komen.
  pl.a1.unit11.lesson02.teach.moc_note:
    title: Ik kan, jij kunt
    gloss: 'Móc: mogę, możesz -- dezelfde tweede persoon (jij) als bij chcesz. Mogę plus een infinitief zegt wat je kunt doen: mogę przyjść (ik kan komen), mogę iść (ik kan gaan).'
    note: '*Mogę* + een gewone infinitief zegt wat je kunt doen -- *mogę przyjść* ("ik kan komen") en *mogę iść* ("ik kan gaan") volgen allebei dit eenvoudige patroon.'
  pl.a1.unit11.lesson02.teach.chetnie:
    title: Graag
    gloss: graag
    note: Een warme, enthousiaste manier om een plan aan te nemen -- vaak gecombineerd met tak (ja) of bardzo (heel) voor extra warmte.
    example_gloss: Ja, heel graag!
  pl.a1.unit11.lesson02.teach.niestety:
    title: Helaas
    gloss: helaas
    note: Het natuurlijke zachte woord om beleefd een plan af te slaan -- bijna altijd gevolgd door nie mogę (ik kan niet).
    example_gloss: Helaas, ik kan niet.
  pl.a1.unit11.lesson02.teach.w_sobote_note:
    title: Op zaterdag
    gloss: 'W + dag van de week: mannelijke dagen (piątek, poniedziałek, czwartek) veranderen niet van uitgang -- w piątek. Vrouwelijke dagen (sobota, środa, niedziela) krijgen de uitgang -ę van de biernik (4e naamval), net als kawa -> kawę -- w sobotę.'
    note: Niet elke dag werkt hetzelfde na *w* -- vrouwelijke dagnamen zoals *sobota* worden *sobotę*, precies dezelfde uitgang *-a* -> *-ę* die je al kent van *kawa* -> *kawę* en *herbata* -> *herbatę*. Mannelijke dagen zoals *piątek* blijven precies hetzelfde.
  pl.a1.unit11.lesson02.teach.czy_mozesz_przyjsc_w_sobote:
    title: Kun je zaterdag komen?
    gloss: Kun je zaterdag komen?
    note: Combineert możesz, przyjść en de nieuwe vorm w sobotę -- een complete manier om naar een alternatieve dag te vragen.
  pl.a1.unit11.lesson03.teach.moze:
    title: Misschien, wat dacht je van
    gloss: misschien / wat dacht je van
    note: Het woord om een alternatief voor te stellen -- je hoort het steeds als een eerste plan niet lukt en je iets anders wilt voorstellen.
    example_gloss: Wat dacht je van zaterdag?
  pl.a1.unit11.lesson03.teach.moze_vs_moge_note:
    title: Może vs. mogę
    gloss: 'Może en mogę lijken op elkaar, maar betekenen iets anders: może (''misschien'') stelt iets nieuws voor; mogę (de ''ik''-vorm van het werkwoord, ''ik kan'') zegt wat je kunt doen.'
    note: 'Op papier makkelijk te verwarren: *może* ("misschien", hier gebruikt om iets voor te stellen) en *mogę* ("ik kan", de werkwoordsvorm van de eerste persoon) doen verschillend werk in een zin, ook al hebben ze dezelfde stam -- let op de laatste letter.'
  pl.a1.unit11.lesson03.teach.o_ktorej_godzinie:
    title: Hoe laat?
    gloss: Hoe laat?
    note: De standaardmanier om naar een precieze tijd te vragen als de dag al is afgesproken -- misschien herinner je je o której uit de eerdere tijdles.
  pl.a1.unit11.lesson03.teach.dialogue.line01:
    title: Ewa stelt de bioscoop voor
    gloss: Ewa vraagt of Marek vrijdag naar de bioscoop wil gaan.
    note: Hergebruikt de allereerste vraag uit deze les, nu in een echt gesprek.
  pl.a1.unit11.lesson03.teach.dialogue.line02:
    title: Marek kan niet op vrijdag
    gloss: Marek zegt dat hij helaas vrijdag niet kan.
    note: Niestety verzacht de afwijzing voordat nie mogę het eenvoudig zegt.
  pl.a1.unit11.lesson03.teach.dialogue.line03:
    title: Marek stelt zaterdag voor
    gloss: 'Marek vraagt: wat dacht je van zaterdag?'
    note: Może biedt een alternatief aan in plaats van het gesprek simpelweg met een afwijzing te beëindigen.
  pl.a1.unit11.lesson03.teach.dialogue.line04:
    title: Ewa zegt graag ja
    gloss: 'Ewa zegt: Zaterdag? Heel graag!'
    note: Herhaalt de voorgestelde dag (met de vorm w sobotę) voordat ze met chętnie accepteert.
  pl.a1.unit11.lesson03.teach.dialogue.line05:
    title: Ewa vraagt naar de tijd
    gloss: 'Ewa vraagt: Hoe laat?'
    note: Nu de dag vaststaat, moet alleen nog de tijd worden afgesproken.
  pl.a1.unit11.lesson03.teach.dialogue.line06:
    title: Marek bevestigt de tijd
    gloss: 'Marek zegt: Om vier uur ''s middags.'
    note: Sluit het overleg af met een vaste, afgesproken tijd, met het uurpatroon uit de eerdere lessen over tijd en dagelijkse routines.
