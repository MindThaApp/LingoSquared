teaching:
  pl.a1.unit10.lesson01.teach.wstawac_wstaje:
    title: Opstaan, ik sta op
    gloss: opstaan; ik sta op
    note: Wstawać is de infinitief; wstaję is de alledaagse ik-vorm die je gebruikt om over je eigen dagritme te praten.
    example_gloss: Ik sta om zeven uur 's ochtends op.
  pl.a1.unit10.lesson01.teach.jesc_jem:
    title: Eten, ik eet
    gloss: eten; ik eet
    note: Jeść is een beetje onregelmatig, maar jem ('ik eet') is de vorm die je het vaakst gebruikt -- zo zegt een Pool 'ik eet' bij elke maaltijd.
    example_gloss: Ik eet 's ochtends ontbijt.
  pl.a1.unit10.lesson01.teach.sniadanie:
    title: Ontbijt
    gloss: het ontbijt
    note: Śniadanie verandert niet na jem -- 'ik eet ontbijt' is gewoon jem śniadanie, zonder extra uitgang om te leren.
    example_gloss: '''s Ochtends eet ik ontbijt.'
  pl.a1.unit10.lesson01.teach.pic_pije:
    title: Drinken, ik drink
    gloss: drinken; ik drink
    note: Pić is de infinitief; piję is de ik-vorm, die je op dezelfde manier gebruikt als jem en wstaję.
    example_gloss: Ik drink 's ochtends koffie.
  pl.a1.unit10.lesson01.teach.pierwsza_osoba_note:
    title: Over jezelf praten
    gloss: Wstaję, jem, piję -- in deze unit praten we alleen over onszelf, in de eerste persoon (ik), zoals wanneer je je eigen dag beschrijft.
    note: Deze hele unit blijft bewust bij de ik-vorm van elk werkwoord -- *wstaję* (ik sta op), *jem* (ik eet), *piję* (ik drink) -- zodat je je kunt richten op het beschrijven van je eigen dagritme, zonder tegelijk te leren hoe elk werkwoord verandert voor 'jij', 'hij' of 'zij'.
  pl.a1.unit10.lesson01.teach.o_siodmej_rano:
    title: Ik sta om zeven uur 's ochtends op
    gloss: Ik sta om zeven uur 's ochtends op.
    note: 'Het patroon uit de grammaticanotitie in de praktijk: o + de locatief van het uur (siódmej) betekent ''om'' dat uur, precies zoals in de eerdere unit over tijd.'
  pl.a1.unit10.lesson01.teach.sniadanie_kawa:
    title: Ik eet ontbijt en drink koffie
    gloss: Ik eet ontbijt en drink koffie.
    note: Twee werkwoorden in de ik-vorm, verbonden met i (en) -- een natuurlijke manier om je ochtendactiviteiten op te sommen.
  pl.a1.unit10.lesson02.teach.obiad:
    title: Lunch
    gloss: lunch / middagmaal
    note: Net als śniadanie verandert obiad niet na jem -- jem obiad betekent gewoon 'ik eet lunch'.
    example_gloss: Ik eet om twaalf uur 's middags lunch.
  pl.a1.unit10.lesson02.teach.pracowac_pracuje:
    title: Werken, ik werk
    gloss: werken; ik werk
    note: Pracować volgt hetzelfde patroon -ować -> -uję als kosztować -> kosztuje uit de unit over winkelen, nu alleen in de ik-vorm.
    example_gloss: Ik werk in de namiddag.
  pl.a1.unit10.lesson02.teach.dom:
    title: Wonen
    gloss: thuis / huis
    note: Het alledaagse woord voor thuis -- komt voortdurend voor in de uitdrukking 'naar huis gaan/komen'.
    example_gloss: Het huis is daar.
  pl.a1.unit10.lesson02.teach.do_domu_note:
    title: Naar huis
    gloss: 'naar huis -- do vraagt de genitief, en de genitief van dom eindigt op -u: domu, precies zoals bank -> banku, park -> parku, hotel -> hotelu.'
    note: '*Do domu* ("naar huis", bijvoorbeeld in "ik ga naar huis") heeft dezelfde genitiefuitgang *-u* die je al kent na *do* bij bank, hotel en park -- weer een zelfstandig naamwoord met hetzelfde patroon.'
  pl.a1.unit10.lesson02.teach.wracac_wracam:
    title: Terugkeren, ik keer terug
    gloss: terugkeren / teruggaan; ik keer terug / ga terug
    note: Wordt gebruikt met do domu voor 'ik ga naar huis' of 'ik kom thuis' -- een van de meest gebruikte alledaagse zinnen in het Pools.
    example_gloss: Ik ga 's avonds naar huis.
  pl.a1.unit10.lesson02.teach.pory_dnia:
    title: Om twaalf uur 's middags, in de middag, 's avonds
    gloss: om twaalf uur 's middags; in de middag; 's avonds
    note: 'Herhaling uit de vorige les over tijd: samen met rano en w nocy beslaan deze uitdrukkingen de hele dag.'
    example_gloss:
    - Ik eet 's middags om twaalf uur lunch.
    - Ik werk in de namiddag.
    - Ik ga 's avonds naar huis.
  pl.a1.unit10.lesson02.teach.praca_dom_phrase:
    title: Ik werk in de middag, daarna ga ik naar huis
    gloss: Ik werk in de middag, daarna ga ik naar huis.
    note: Hetzelfde patroon met komma + potem uit de les over de weg wijzen, nu om twee delen van een dagindeling te verbinden.
  pl.a1.unit10.lesson03.teach.spac_spie:
    title: Slapen, ik slaap
    gloss: slapen; ik slaap
    note: Śpię heeft een onregelmatig lijkende klinkerwisseling ten opzichte van de infinitief spać, maar het is een zeer frequent werkwoord dat je gewoon uit het hoofd moet leren.
    example_gloss: Ik slaap 's nachts.
  pl.a1.unit10.lesson03.teach.a_ty_ja_tez:
    title: En jij? Ik ook.
    gloss: En jij? / Ik ook.
    note: A ty? is de simpele manier om het gesprek terug te geven aan de ander; ja też betekent 'ik ook' -- beide hoor je voortdurend in alledaagse praatjes.
    example_gloss: Ik eet 's ochtends ook ontbijt.
  pl.a1.unit10.lesson03.teach.ale_nie_herbata:
    title: Maar, thee, niet
    gloss: maar; thee (als lijdend voorwerp); niet
    note: Ale introduceert een tegenstelling; nie vlak voor een woord (in plaats van voor een werkwoord) betekent 'niet [dat ding]' -- piję herbatę, nie kawę betekent 'ik drink thee, geen koffie.'
    example_gloss: Ik drink thee, maar geen koffie.
  pl.a1.unit10.lesson03.teach.dziesiatej_wczesnie_note:
    title: Vroeg, om tien uur
    gloss: vroeg; om tien uur -- dezelfde uitgang -ej bij uren na 'o' als czwartej, siódmej uit de vorige les.
    note: '*O dziesiątej* ("om tien uur") gebruikt precies hetzelfde patroon voor uren dat je al kent -- *dziesiąta* wordt *dziesiątej* na *o*, net als *czwarta* -> *czwartej* en *siódma* -> *siódmej*.'
  pl.a1.unit10.lesson03.teach.dialogue.line01:
    title: Ewa vertelt over haar ochtend
    gloss: Ewa zegt dat ze om zeven uur 's ochtends opstaat en koffie drinkt.
    note: Hier komt het allereerste zinspatroon van deze unit terug, nu in een echt gesprek.
  pl.a1.unit10.lesson03.teach.dialogue.line02:
    title: Ewa vertelt verder over haar dag
    gloss: Ewa zegt dat ze ontbijt eet en daarna in de middag werkt.
    note: Verbindt twee activiteiten in de ik-vorm met potem, hetzelfde patroon als in Les 2.
  pl.a1.unit10.lesson03.teach.dialogue.line03:
    title: Ewa sluit af en vraagt het aan Marek
    gloss: Ewa zegt dat ze 's avonds naar huis gaat. En jij?
    note: A ty? geeft het gesprek door aan Marek, zonder dat je nieuwe vraaggrammatica nodig hebt.
  pl.a1.unit10.lesson03.teach.dialogue.line04:
    title: Marek vertelt over zijn ochtend
    gloss: Marek zegt dat hij ook om zeven uur opstaat! Maar hij drinkt thee, geen koffie.
    note: Ja też bevestigt een gedeeld detail (het opstaantijdstip) voordat ale...nie de tegenstelling bij de drank maakt.
  pl.a1.unit10.lesson03.teach.dialogue.line05:
    title: Marek beschrijft zijn dag
    gloss: Marek zegt dat hij 's ochtends werkt en daarna om twaalf uur lunch eet.
    note: Een andere dagindeling dan die van Ewa -- eerst werken, dan een maaltijd rond de middag.
  pl.a1.unit10.lesson03.teach.dialogue.line06:
    title: Marek praat over slapen
    gloss: Marek zegt dat hij vroeg gaat slapen, om tien uur 's avonds.
    note: Sluit het gesprek af met het nieuwe werkwoord spać/śpię en het uurpatroon dat in deze les terugkomt.
