teaching:
  pl.a1.unit04.lesson01.teach.pierwsza_druga_trzecia:
    title: Één, twee, drie uur
    gloss: één uur; twee uur; drie uur
    note: In het Pools geef je de tijd aan met vrouwelijke rangtelwoorden, die congrueren met het weggelaten vrouwelijke zelfstandig naamwoord *godzina* (uur) -- *pierwsza* betekent letterlijk "het eerste (uur)".
    example_gloss:
    - Het is één uur.
    - Het is twee uur.
    - Het is drie uur.
  pl.a1.unit04.lesson01.teach.czwarta_piata_szosta:
    title: Vier, vijf, zes uur
    gloss: vier uur; vijf uur; zes uur
    note: Hetzelfde vrouwelijke rangtelwoordpatroon als *pierwsza*, *druga*, *trzecia*.
    example_gloss:
    - Het is vier uur.
    - Het is vijf uur.
    - Het is zes uur.
  pl.a1.unit04.lesson01.teach.siodma_osma_dziewiata:
    title: Zeven, acht, negen uur
    gloss: zeven uur; acht uur; negen uur
    note: De middelste drie van de twaalf uren, hetzelfde patroon.
    example_gloss:
    - Het is zeven uur.
    - Het is acht uur.
    - Het is negen uur.
  pl.a1.unit04.lesson01.teach.dziesiata_jedenasta_dwunasta:
    title: Tien, elf, twaalf uur
    gloss: tien uur; elf uur; twaalf uur
    note: De laatste drie uren, waarmee de hele reeks van 1 tot 12 compleet is.
    example_gloss:
    - Het is tien uur.
    - Het is elf uur.
    - Het is twaalf uur.
  pl.a1.unit04.lesson01.teach.ktora_jest_godzina:
    title: Naar de tijd vragen
    gloss: Hoe laat is het?
    note: Letterlijk "welke is het uur?" -- *która* congrueert met het vrouwelijke *godzina*, hetzelfde patroon dat je in deze unit steeds tegenkomt.
  pl.a1.unit04.lesson01.teach.godzina_note:
    title: Godzina is vrouwelijk
    gloss: We zeggen pierwsza, druga, trzecia -- niet pierwszy, drugi, trzeci.
    note: '*Pierwszy*, *drugi*, *trzeci* zijn de mannelijke vormen van dezelfde rangtelwoorden, die elders in het Pools bij mannelijke zelfstandige naamwoorden worden gebruikt -- maar nooit om de tijd aan te geven, omdat *godzina* vrouwelijk is.'
  pl.a1.unit04.lesson02.teach.rano_poludnie_popoludniu:
    title: '''s Ochtends, ''s middags, overdag'
    gloss: '''s ochtends; om twaalf uur ''s middags; ''s middags'
    note: '*Rano* staat los (zonder voorzetsel); *w południe* en *po południu* hebben elk hun eigen vaste voorzetsel. Leer deze drie als vaste uitdrukkingen uit je hoofd in plaats van ze met een algemene regel af te leiden.'
    example_gloss:
    - '''s Ochtends drink ik koffie.'
    - Ik eet 's middags om twaalf uur.
    - Ik werk in de namiddag.
  pl.a1.unit04.lesson02.teach.wieczorem_w_nocy:
    title: Avond, nacht
    gloss: '''s avonds; ''s nachts'
    note: '*Wieczorem* is een vaste bijwoordelijke vorm (zonder voorzetsel); *w nocy* combineert *w* met de locatief van *noc* (nacht).'
    example_gloss:
    - '''s Avonds kijk ik tv.'
    - '''s Nachts slaap ik.'
  pl.a1.unit04.lesson02.teach.o_ktorej_godzinie:
    title: Vragen hoe laat
    gloss: Hoe laat?
    note: Gebruik dit in plaats van *Która jest godzina?* als je vraagt wanneer iets gebeurt, en niet hoe laat het nu is.
  pl.a1.unit04.lesson02.teach.locative_hour_note:
    title: '''Om'' een uur zeggen'
    gloss: Vier, zeven, tien uur -- maar om vier, om zeven, om tien uur.
    note: 'Na *o* (''om'') wordt de eindklank *-a* van het uurwoord *-ej*: *czwarta* → *o czwartej*, *siódma* → *o siódmej*, *dziesiąta* → *o dziesiątej*. Elk uur volgt dit patroon; alleen de spelling van *druga* → *o drugiej* wijkt af: daar komt een *i* na de *g*.'
  pl.a1.unit04.lesson02.teach.ewa_wstaje:
    title: Ewa staat vroeg op
    gloss: Ewa staat om 7 uur 's ochtends op.
    note: '*Wstaje* is de derde persoon enkelvoud van *wstawać* (opstaan).'
  pl.a1.unit04.lesson02.teach.pociag_odjezdza:
    title: Het vertrektijdstip van de trein
    gloss: De trein vertrekt om 4 uur 's middags.
    note: '*Odjeżdża* is de derde persoon enkelvoud van *odjeżdżać* (vertrekken).'
  pl.a1.unit04.lesson03.teach.spotkanie:
    title: Afspraak
    gloss: afspraak
    note: Hetzelfde woord als in les 3 (*Kiedy jest spotkanie?*), toen Ewa en Marek een dag en datum afspraken om elkaar weer te zien.
    example_gloss: De afspraak is op vrijdag.
  pl.a1.unit04.lesson03.teach.o_ktorej_mozemy_sie_spotkac:
    title: Vragen hoe laat jullie afspreken
    gloss: Hoe laat kunnen we afspreken op vrijdag 15 mei?
    note: Combineert *o której godzinie* uit deze les met de dag en datum uit les 3. Ewa en Marek hebben vrijdag 15 mei al afgesproken en moeten nu nog een exact tijdstip kiezen.
  pl.a1.unit04.lesson03.teach.moze_o_czwartej:
    title: Een tijdstip voorstellen
    gloss: Misschien om 4 uur 's middags?
    note: '*Może* betekent op zichzelf ''misschien''. Het is een natuurlijke, zachte manier om een tijdstip voor te stellen.'
  pl.a1.unit04.lesson03.teach.czwarta_mi_odpowiada:
    title: Bevestigen dat een tijdstip past
    gloss: 4 uur 's middags schikt mij.
    note: 'Hetzelfde patroon *[time] + mi + odpowiada* als in *Piątek mi odpowiada* uit les 3: de tijdsaanduiding zelf is het onderwerp van de zin, en *odpowiadać* krijgt de persoon altijd in de derde naamval (datief): *mi*, "voor mij".'
  pl.a1.unit04.lesson03.teach.do_zobaczenia_o_czwartej:
    title: Het hele plan bevestigen
    gloss: Tot 15 mei om 4 uur!
    note: Hergebruikt het afscheid *Do zobaczenia* uit les 1, nu met zowel een datum als een tijdstip.
  pl.a1.unit04.lesson03.teach.dialogue.line01:
    title: Ewa vraagt naar een tijdstip
    gloss: Ewa vraagt Marek hoe laat ze kunnen afspreken op vrijdag 15 mei.
    note: Precies dezelfde openingsvraag als aan het begin van deze les.
  pl.a1.unit04.lesson03.teach.dialogue.line02:
    title: Marek stelt 4 uur 's middags voor
    gloss: Marek stelt 4 uur 's middags voor.
    note: Een zachte suggestie, geen vaste mededeling. Dat is wat *może* aangeeft.
  pl.a1.unit04.lesson03.teach.dialogue.line03:
    title: Ewa stemt in
    gloss: Ewa zegt dat 4 uur 's middags haar schikt.
    note: Dezelfde datiefconstructie als in het gesprek in les 3 waarin vrijdag goed uitkwam.
  pl.a1.unit04.lesson03.teach.dialogue.line04:
    title: Marek rondt het plan af
    gloss: 'Marek zegt dat het top is en: tot 15 mei om 4 uur!'
    note: '*Świetnie* is de uitroep van enthousiasme uit les 3.'
  pl.a1.unit04.lesson03.teach.dialogue.line05:
    title: Ewa neemt afscheid
    gloss: Ewa zegt ook gedag.
    note: 'De kortst mogelijke afsluiting: alleen het afscheid zelf.'
