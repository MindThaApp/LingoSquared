    gloss: 'Ewa: Zullen we zaterdag om tien uur sporten?'
  pl.a1.unit29.lesson04.teach.marek_dobry_pomysl:
    title: Marek gaat akkoord
    gloss: 'Marek: Goed idee! Ik zoek de weersverwachting even op.'
    note: '*Dobry pomysł!* is een kort antwoord op een voorstel; het bijvoeglijk naamwoord *dobry* past zich aan het mannelijke *pomysł* aan.'
