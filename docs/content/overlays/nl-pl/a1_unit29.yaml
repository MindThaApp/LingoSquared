  pl.a1.unit29.lesson03.teach.po_sprawdzam_stoi:
    title: Twee werkwoorden, twee naamvallen
    gloss: '*Sprawdzam* wordt gevolgd door de accusatief: *prognozę pogody*. *Używam* wordt gevolgd door de genitief: *telefonu*.'
    note: De meeste werkwoorden nemen de accusatief, maar *używać* is een uitzondering en vraagt de genitief.
