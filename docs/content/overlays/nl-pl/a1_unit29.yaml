    title: Marek checkt het weer
    gloss: 'Marek: Zaterdag is het zonnig!'
    note: '*Słonecznie* is een bijwoord: *jest słonecznie* betekent het is zonnig, en je hebt geen onderwerp nodig.'
  pl.a1.unit29.lesson04.teach.tomek_widze_wiadomosc:
