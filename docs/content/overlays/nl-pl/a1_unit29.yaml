  pl.a1.unit29.lesson02.teach.znasz_juz_prognoze:
    title: 'Werkwoorden bij een bericht: sturen en lezen'
    gloss: Je kent al *prognoza pogody* (de weersverwachting). Een *wiadomość* (bericht) kun je sturen (*wysyłam*, *wysyłasz*) of lezen (*czytam*, *czytasz*).
    note: Koppelt het nieuwe woord aan het samengestelde zelfstandig naamwoord uit de weerles.
