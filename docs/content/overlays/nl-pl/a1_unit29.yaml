    gloss: 'Tomek: Ik zie het bericht. Tot zaterdag!'
  pl.a1.unit29.lesson04.teach.znasz_juz_do:
    title: Do widzenia en do + een dag
    gloss: 'Je kent al *Do widzenia!* Je kunt ook een dag noemen: *Do soboty!*, *Do jutra!* (na *do* volgt de genitief).'
    note: Breidt het afscheidspatroon uit de begroetingsles uit naar een bepaalde dag.
  pl.a1.unit29.lesson05.teach.ewa_dzwoni_do:
    title: Wie gebruikt wat?
    gloss: Ewa belt Marek elke dag. Ze gebruikt haar telefoon, niet een app. Marek heeft thuis geen computer, maar hij gebruikt internet op zijn telefoon. Tomek zoekt elke ochtend de weersverwachting op. Daarna gaat hij hardlopen. Kasia stuurt Ewa vaak een bericht. Gebruik jij ook elke dag je telefoon?
    note: Vergelijkt hoe alle vier de personages hun apparaten gebruiken, net als de vergelijkende leestekst in de sportles.
