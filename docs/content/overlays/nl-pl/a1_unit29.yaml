    title: Het plan van Tomek
    gloss: 'Tomek: Dan ga ik hardlopen. Daarna ga ik ook voetballen.'
    note: '*Wtedy* (dan) en *potem* (daarna) geven de volgorde van de gebeurtenissen aan; *pobiegam* en *zagram* zijn perfectief, dus ze klinken als plannen.'
