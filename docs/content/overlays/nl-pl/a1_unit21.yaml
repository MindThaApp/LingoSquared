teaching:
  pl.a1.unit21.lesson01.teach.szczesliwy_smutny_zly:
    title: Blij, verdrietig en boos
    gloss: blij, verdrietig, boos
    note: Drie basiswoorden voor gevoelens met *jestem* (ik ben). Dit zijn mannelijke vormen; een vrouw zegt *szczęśliwa, smutna, zła*.
    example_gloss:
    - Ik ben blij.
    - Ik ben verdrietig.
    - Ik ben boos.
  pl.a1.unit21.lesson01.teach.jestem_szczesliwy:
    title: Zeggen dat je blij bent
    gloss: Ik ben blij.
    note: '*Jestem* (ik ben, van *być*) + bijvoeglijk naamwoord is het basispatroon, net als ''ik ben ...'' in het Nederlands. Het bijvoeglijk naamwoord past zich aan de spreker aan: *szczęśliwy* (man), *szczęśliwa* (vrouw).'
  pl.a1.unit21.lesson01.teach.nie_jestem_zly:
    title: Gevoelens tegenover elkaar zetten
    gloss: Ik ben niet boos, ik ben verdrietig.
    note: '*Nie* staat direct voor het werkwoord: *Nie jestem zły*. De tweede zin noemt dan het echte gevoel.'
  pl.a1.unit21.lesson02.teach.dlaczego_jestes_szczesliwy:
    title: Vragen waarom
    gloss: Waarom ben je blij?
    note: '*Dlaczego* (waarom) is het standaardvraagwoord voor een reden.'
  pl.a1.unit21.lesson02.teach.jestem_szczesliwy_bo:
    title: Een reden geven
    gloss: Ik ben blij omdat ik een nieuw appartement heb.
    note: '*Bo* (omdat) leidt de reden in; na *mam* (ik heb) staat het zelfstandig naamwoord in de accusatief: *nowe mieszkanie*.'
  pl.a1.unit21.lesson02.teach.jestem_smutny_bo:
    title: Een negatieve reden
    gloss: Ik ben verdrietig omdat het regent.
    note: '*Pada deszcz* (het regent, letterlijk ''regen valt'') is de gebruikelijke uitdrukking voor regen, hier gebruikt als reden.'
  pl.a1.unit21.lesson03.teach.zdenerwowany:
    title: Nerveus
    gloss: nerveus
    note: Het standaardwoord voor zenuwachtigheid.
    example_gloss: Ik ben zenuwachtig voor mijn eerste dienst.
  pl.a1.unit21.lesson03.teach.jestem_zdenerwowany_przed:
    title: Zeggen waarvoor je zenuwachtig bent
    gloss: Ik ben zenuwachtig voor mijn eerste dienst.
    note: '*Przed* (letterlijk ''voor'') + instrumentalis geeft aan waar de zenuwen mee te maken hebben, waar je in het Nederlands ''voor'' of ''over'' zegt: *przed pierwszą zmianą*.'
  pl.a1.unit21.lesson03.teach.nie_martw_sie:
    title: Iemand geruststellen
    gloss: Maak je geen zorgen.
    note: '*Nie martw się* (letterlijk ''maak jezelf geen zorgen'') is de standaarduitdrukking om iemand gerust te stellen; *się* is het wederkerend voornaamwoord.'
  pl.a1.unit21.lesson04.teach.jak_czuje_sie:
    title: Vragen hoe iemand zich voelt
    gloss: Hoe voelt Marek zich?
    note: '*Czuć się* (zich voelen, wederkerend) is de standaardmanier om naar een gemoedstoestand te vragen of die te beschrijven: *Jak czuje się Marek?*'
  pl.a1.unit21.lesson04.teach.on_czuje_sie:
    title: Beschrijven hoe iemand zich voelt
    gloss: Hij voelt zich zenuwachtig.
    note: '*Się* blijft bij het werkwoord: *on czuje się*. Het bijvoeglijk naamwoord is mannelijk, passend bij *on*: *zdenerwowany*.'
  pl.a1.unit21.lesson04.teach.dlaczego_on_czuje:
    title: Vragen waarom iemand zich zo voelt
    gloss: Waarom voelt hij zich zenuwachtig?
    note: Combineert *dlaczego* (waarom) met het patroon *czuje się* uit *On czuje się zdenerwowany*.
  pl.a1.unit21.lesson05.teach.czesc_ewo_jestem:
    title: Lees een bericht over gevoelens
    gloss: Hoi Ewa, ik ben een beetje nerveus voor mijn eerste zelfstandige dienst. Maar ik ben ook blij, want ik heb een nieuwe baan en een nieuw appartement. Ik denk dat het goed komt.
    note: Let op waarvoor de schrijver zenuwachtig is, wat hem blij maakt en hoe hij er in het algemeen over denkt.
    glosses:
      trochę: een beetje
      zdenerwowany: nerveus
      pierwszą: eerste
      zmianą: dienst
      samodzielną: alleen
      szczęśliwy: blij
      bo: want, omdat
      nową: nieuwe
      pracę: werk
      nowe: nieuwe
      mieszkanie: appartement
      myślę: denken
      będzie: 'gaan (hier: goed komen)'
  pl.a1.unit21.lesson06.teach.ewa_czesc_marku:
    title: Ewa vraagt hoe Marek zich voelt
    gloss: 'Ewa: Hoi Marek, hoe voel je je voor je eerste dienst?'
    note: '*Przed pierwszą zmianą* (voor je eerste dienst) gebruikt opnieuw het patroon *przed* + instrumentalis uit les 3. *Czujesz się* is de *ty*-vorm.'
  pl.a1.unit21.lesson06.teach.marek_szczerze_mowiac:
    title: Marek geeft toe dat hij nerveus is
    gloss: 'Marek: Eerlijk gezegd ben ik een beetje nerveus.'
    note: '*Szczerze mówiąc* (eerlijk gezegd, letterlijk ''oprecht sprekend'') maakt het toegeven zachter.'
  pl.a1.unit21.lesson06.teach.ewa_nie_martw:
    title: Ewa stelt hem gerust
    gloss: 'Ewa: Maak je geen zorgen, je redt het wel!'
    note: '*Dobrze sobie poradzisz* (letterlijk ''je zult je goed redden'') is een bemoedigende vaste uitdrukking; *poradzisz* is de toekomende tijd van *poradzić sobie* voor *ty*.'
  pl.a1.unit21.lesson06.teach.marek_dzieki_to:
    title: Marek bedankt haar
    gloss: 'Marek: Dank je, dat helpt echt.'
    note: '*Pomaga* is de *on/ona/ono*-vorm van *pomagać* (helpen); *dzięki* is informeel ''bedankt''.'
  pl.a1.unit21.lesson06.teach.ewa_a_potem:
    title: Ewa voorspelt de afloop
    gloss: 'Ewa: En daarna ben je vast heel blij en trots.'
    note: '*Na pewno* (zeker) drukt een stellige voorspelling uit; *dumny* (trots) is een nieuw, nuttig bijvoeglijk naamwoord. *Będziesz* is de toekomende tijd van *być*.'
  pl.a1.unit21.lesson06.teach.marek_tak_ja:
    title: Marek is het ermee eens
    gloss: 'Marek: Ja, dat denk ik ook.'
    note: '*Ja też tak myślę* (letterlijk ''ik ook zo denk ik'') is de natuurlijke manier om het eens te zijn; *ja* wordt hier toegevoegd voor nadruk.'
  pl.a1.unit21.lesson06.teach.marek_jest_zdenerwowany:
    title: Samenvatten met jest en mu
    gloss: Marek is nerveus voor zijn eerste dienst. Ewa helpt hem.
    note: '*Jest* is de *on/ona*-vorm van *być* (zijn); *mu* betekent ''hem'' (datief, omdat *pomagać* de datief vraagt). Kleine woorden, maar onmisbaar om over iemand anders te praten.'
