teaching:
  pl.a1.unit20.lesson01.teach.recap_jest_sa_to_poprosze:
    title: Is, zijn, dit, ik wil graag -- nog eens
    gloss: Jest, są, To, Poproszę, Ile, kosztuje, złotych, chcę, do -- deze woorden ken je al uit eerdere lessen.
    note: Een korte herhaling voordat deze les ze gebruikt om over kleren kopen te praten.
  pl.a1.unit20.lesson01.teach.sklep:
    title: Winkel
    gloss: winkel
    note: Het algemene woord voor een winkel.
    example_gloss: Ik ga naar de winkel.
  pl.a1.unit20.lesson01.teach.koszula:
    title: Overhemd
    gloss: overhemd
    note: Een vrouwelijk zelfstandig naamwoord -- het krijgt vrouwelijke vormen van het bijvoeglijk naamwoord.
    example_gloss: Dit is een overhemd.
  pl.a1.unit20.lesson01.teach.spodnie:
    title: Broek
    gloss: broek
    note: In het Pools altijd meervoud, ook voor één broek -- er is geen enkelvoud.
    example_gloss: Dit zijn broeken.
  pl.a1.unit20.lesson01.teach.kupic:
    title: Kopen
    gloss: kopen
    note: 'Wordt gebruikt na ''*chcę*'' (ik wil), net als ''*iść*'' (gaan) in een eerdere les: ''*chcę kupić*'' -- ik wil kopen.'
    example_gloss: Ik wil een overhemd kopen.
  pl.a1.unit20.lesson01.teach.chce_kupic_spodnie_phrase:
    title: Ik wil een broek kopen
    gloss: Ik wil een broek kopen.
    note: Hetzelfde patroon chcę + infinitief, nu met een broek.
  pl.a1.unit20.lesson01.teach.ile_kosztuje_koszula_phrase:
    title: Hoeveel kost het overhemd?
    gloss: Hoeveel kost het overhemd?
    note: Een natuurlijke manier om naar de prijs van een bepaald artikel te vragen, met '*Ile kosztuje*' uit de les over winkelen.
  pl.a1.unit20.lesson02.teach.jaki_note:
    title: Wat voor -- mannelijke vorm
    gloss: Jaki, Jaka -- '*Jaki*' vraagt naar mannelijke zelfstandige naamwoorden, '*Jaka*' naar vrouwelijke (je kent '*Jaka*' al uit de les over het weer).
    note: '''*Kolor*'' (kleur) is mannelijk, dus het hoort bij ''*Jaki*'', niet bij ''*Jaka*''.'
  pl.a1.unit20.lesson02.teach.kolor:
    title: Kleur
    gloss: kleur
    note: Een mannelijk zelfstandig naamwoord.
    example_gloss: Welke kleur?
  pl.a1.unit20.lesson02.teach.sukienka:
    title: Jurk
    gloss: jurk
    note: Nog een vrouwelijk zelfstandig naamwoord, net als '*koszula*'.
    example_gloss: Dit is een jurk.
  pl.a1.unit20.lesson02.teach.niebieska_note:
    title: Blauw
    gloss: Koszula jest niebieska. -- '*niebieska*' past bij vrouwelijke zelfstandige naamwoorden, zoals '*koszula*'.
    note: Alleen deze vorm -- in deze cursus hoort hij tot nu toe bij '*koszula*'.
  pl.a1.unit20.lesson02.teach.czerwona_note:
    title: Rood
    gloss: Sukienka jest czerwona. -- '*czerwona*' past ook bij vrouwelijke zelfstandige naamwoorden, net als '*niebieska*'.
    note: Deze vorm hoort hier bij '*sukienka*', zoals '*niebieska*' bij '*koszula*' hoort.
  pl.a1.unit20.lesson02.teach.koszula_niebieska_phrase:
    title: Het overhemd is blauw
    gloss: Het overhemd is blauw.
    note: Dit gegeven komt later in de les terug, wanneer Marek een overhemd koopt.
  pl.a1.unit20.lesson02.teach.sukienka_czerwona_phrase:
    title: De jurk is rood
    gloss: De jurk is rood.
    note: Hetzelfde patroon jest + kleur, nu voor een ander kledingstuk.
  pl.a1.unit20.lesson03.teach.recap_words:
    title: Goedendag, alstublieft, zeer -- nog eens
    gloss: Dzień, dobry, Proszę, bardzo, i, Dobrze, Co -- deze woorden ken je al uit eerdere lessen.
    note: Een korte herhaling voor de winkeldialoog van deze les.
  pl.a1.unit20.lesson03.teach.rozmiar:
    title: Maat
    gloss: maat
    note: Poolse kledingmaten zijn meestal gewoon de letters S, M en L, net als in het Nederlands.
    example_gloss: Welke maat?
  pl.a1.unit20.lesson03.teach.pan_chce_note:
    title: Meneer, wil
    gloss: Co pan chce kupić? -- '*pan*' is de beleefde aanspreekvorm voor een man, net als '*pani*' voor een vrouw (je kent '*pani*' al uit de les over winkelen).
    note: '''*chce*'' is de hij/zij-vorm van ''*chcieć*'' -- je kent al ''*chcę*'' (ik wil) en ''*chcesz*'' (jij wilt).'
  pl.a1.unit20.lesson03.teach.co_pan_chce_kupic_phrase:
    title: Wat wilt u kopen, meneer?
    gloss: Wat wilt u kopen, meneer?
    note: Zo opent een verkoper beleefd het gesprek met een mannelijke klant.
  pl.a1.unit20.lesson03.teach.dialogue.line01:
    title: De verkoper begroet Marek
    gloss: Goedendag! Wat wilt u kopen, meneer?
    note: Sprzedawca (de verkoper) begint met dezelfde beleefde toon als de marktkoopman in de eerdere les over winkelen.
  pl.a1.unit20.lesson03.teach.dialogue.line02:
    title: Marek zegt wat hij wil
    gloss: Ik wil een overhemd en een broek kopen.
    note: Marek noemt beide artikelen die hij wil kopen.
  pl.a1.unit20.lesson03.teach.dialogue.line03:
    title: De verkoper vraagt naar de maat
    gloss: Welke maat?
    note: Een korte, natuurlijke vervolgvraag.
  pl.a1.unit20.lesson03.teach.dialogue.line04:
    title: Marek geeft zijn maat
    gloss: Maat M.
    note: Marek antwoordt alleen met de maatletter, zoals je dat in het echt ook zou doen.
  pl.a1.unit20.lesson03.teach.dialogue.line05:
    title: De verkoopster bevestigt de voorraad en de prijs
    gloss: We hebben een blauw overhemd en een broek. Samen honderd zloty.
    note: '''*Mamy*'' betekent ''wij hebben'' (zoals ''*mam*''/''*masz*''). Daarna wordt ''*koszula*'' ''*koszulę*'' en ''*niebieska*'' wordt ''*niebieską*'' -- dezelfde verandering als in ''*Chcę kupić koszulę*''. De kleur past bij het blauwe overhemd uit les 2.'
  pl.a1.unit20.lesson03.teach.dialogue.line06:
    title: Marek gaat akkoord
    gloss: Goed, ik neem het.
    note: Marek bevestigt de aankoop en rondt het gesprek af.
