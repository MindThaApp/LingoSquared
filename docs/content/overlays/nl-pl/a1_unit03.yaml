    title: We spreken af
teaching:
  pl.a1.unit03.lesson01.teach.poniedzialek:
    title: Maandag
    gloss: maandag
    note: De eerste dag van de week in het Pools, net als in Nederland en België, waar de week ook op maandag begint.
    example_gloss: Vandaag is het maandag.
  pl.a1.unit03.lesson01.teach.wtorek:
    title: dinsdag
    gloss: dinsdag
    note: 'Let op: bij *wtorek* gebruik je het voorzetsel *we*, niet *w*, als je ''op dinsdag'' zegt. Daar kom je later in deze les nog op terug.'
    example_gloss: Vandaag is het dinsdag.
  pl.a1.unit03.lesson01.teach.sroda:
    title: woensdag
    gloss: woensdag
    note: Een vrouwelijk zelfstandig naamwoord, anders dan de meeste andere dagen van de week.
    example_gloss: Vandaag is het woensdag.
  pl.a1.unit03.lesson01.teach.czwartek:
    title: donderdag
    gloss: donderdag
    note: Hetzelfde mannelijke patroon als *poniedziałek*, *wtorek* en *piątek*.
    example_gloss: Vandaag is het donderdag.
  pl.a1.unit03.lesson01.teach.piatek:
    title: vrijdag
    gloss: vrijdag
    note: 'Je ziet deze dag later in de unit nog terug: het is de dag waarop Ewa en Marek weer afspreken.'
    example_gloss: Vandaag is het vrijdag.
  pl.a1.unit03.lesson01.teach.sobota:
    title: Zaterdag
    gloss: zaterdag
    note: Hoort bij het weekend, *weekend* (een leenwoord dat veel Polen ook gebruiken).
    example_gloss: Vandaag is het zaterdag.
  pl.a1.unit03.lesson01.teach.niedziela:
    title: Zondag
    gloss: zondag
    note: De laatste van de zeven dagen van de week die in deze les aan bod komen.
    example_gloss: Vandaag is het zondag.
  pl.a1.unit03.lesson01.teach.jaki_dzien:
    title: Naar de dag vragen
    gloss: Welke dag van de week is het vandaag?
    note: Een directe vraagvorm – *dzień tygodnia* betekent letterlijk 'dag van de week'.
  pl.a1.unit03.lesson01.teach.we_wtorek_note:
    title: De uitzondering w/we
    gloss: Op maandag, op donderdag, op vrijdag – maar op dinsdag (voor een makkelijkere uitspraak).
    note: 'Bij de meeste weekdagen gebruik je "*w* + [dag]" voor ''op [dag]''. *Wtorek* is de enige echte uitzondering: Polen zeggen *we wtorek*, niet *w wtorek*, gewoon omdat het makkelijker uit te spreken is – een echte onregelmatigheid, geen tikfout.'
  pl.a1.unit03.lesson01.teach.w_piatek_kino:
    title: Op vrijdag ga ik naar de bioscoop
    gloss: Op vrijdag ga ik naar de bioscoop.
    note: '*Piątek* verandert niet na *w* – alleen *środa*, *sobota* en *niedziela* zouden veranderen (dat komt in deze les niet aan bod, om het op A1-niveau simpel te houden).'
  pl.a1.unit03.lesson02.teach.styczen_luty_marzec:
    title: Januari, februari, maart
    gloss: januari; februari; maart
    note: '*Luty* is grammaticaal de buitenbeet – het gedraagt zich als een bijvoeglijk naamwoord en niet als een gewoon zelfstandig naamwoord (je ziet dat later in de unit terug in de vorm voor ''in februari'').'
    example_gloss:
    - Ik ben jarig in januari.
    - In februari ga ik naar Warschau.
    - Ik ben jarig in maart.
  pl.a1.unit03.lesson02.teach.kwiecien_maj_czerwiec:
    title: April, mei, juni
    gloss: april; mei; juni
    note: '*Maj* is de maand die in het verhaal van deze unit voor beide data wordt gebruikt.'
    example_gloss:
    - In april ga ik naar Warschau.
    - Ik ben jarig in mei.
    - In juni ga ik naar Warschau.
  pl.a1.unit03.lesson02.teach.lipiec_sierpien_wrzesien:
    title: Juli, augustus, september
    gloss: juli; augustus; september
    note: 'Hier is nog een echte onregelmatigheid: "in september" is *we wrześniu*, niet *w wrześniu* – dezelfde *we*-wissel voor een makkelijkere uitspraak die je al zag bij *wtorek*.'
    example_gloss:
    - In juli heb ik vakantie.
    - In augustus ga ik naar Warschau.
    - Ik ben jarig in september.
  pl.a1.unit03.lesson02.teach.pazdziernik_listopad_grudzien:
    title: Oktober, november, december
    gloss: oktober; november; december
    note: De laatste drie maanden van het jaar, waarmee de twaalf maanden compleet zijn.
    example_gloss:
    - In oktober ga ik naar Warschau.
    - Ik ben jarig in november.
    - In december heb ik vakantie.
  pl.a1.unit03.lesson02.teach.urodziny:
    title: Verjaardag
    gloss: verjaardag
    note: '*Urodziny* is in het Pools altijd meervoud, ook voor de verjaardag van één persoon – het combineert met *są* (''zijn''), nooit met *jest* (''is''). Dit punt oefen je later in deze les in een oefening.'
    example_gloss: Ik ben jarig in mei.
  pl.a1.unit03.lesson02.teach.kiedy:
    title: Wanneer
    gloss: wanneer
    note: Het vraagwoord om naar een tijdstip te vragen.
    example_gloss: Wanneer is de vergadering?
  pl.a1.unit03.lesson02.teach.kiedy_sa_twoje_urodziny:
    title: Vragen wanneer iemand jarig is
    gloss: Wanneer ben je jarig?
    note: '*Są*, niet *jest*, in overeenstemming met het meervoudige *urodziny* – het patroon dat op de kaart van *urodziny* al werd genoemd.'
  pl.a1.unit03.lesson02.teach.moje_urodziny_sa_dziesiatego_maja:
    title: Zeggen wanneer je jarig bent
    gloss: Ik ben jarig op 10 mei.
    note: '*Dziesiątego maja* – de dag eindigt op *-ego* en de maand op *-a*, zonder enig voorzetsel. Zo geef je in het Pools een bepaalde datum aan; zie de grammaticanotitie verderop in deze les voor het hele patroon.'
  pl.a1.unit03.lesson02.teach.kiedy_jest_spotkanie:
    title: Vragen wanneer de bijeenkomst is
    gloss: Wanneer is de vergadering?
    note: '*Spotkanie* (bijeenkomst, afspraak) – een woord dat je terugziet in de dialoog van les 3.'
  pl.a1.unit03.lesson02.teach.spotkanie_jest_pietnastego_maja:
    title: De datum van de bijeenkomst noemen
    gloss: De bijeenkomst is op 15 mei.
    note: Hetzelfde datumpatroon met *-ego* + *-a* als bij *dziesiątego maja*, alleen met een andere dag.
  pl.a1.unit03.lesson02.teach.date_pattern_note:
    title: Hoe je in het Pools een datum zegt
    gloss: 'Een datum: de dag eindigt op -ego, de maand op -a (maar februari is lutego), zonder voorzetsel – 10 mei, 15 mei.'
    note: Vergelijk dit met "op vrijdag" (*w piątek*, met het voorzetsel *w*) – bij een bepaalde kalenderdatum werkt het anders en staat er nooit een voorzetsel.
  pl.a1.unit03.lesson03.teach.kiedy_mozemy_sie_spotkac:
    title: Voorstellen om opnieuw af te spreken
    gloss: Wanneer kunnen we weer afspreken?
    note: '*Znowu* betekent ''weer'' – een natuurlijke manier om een gesprek te beginnen over een nieuwe afspraak.'
  pl.a1.unit03.lesson03.teach.czy_piatek_panu:
    title: Aan een man vragen of vrijdag uitkomt, formeel
    gloss: Komt vrijdag u uit? (tegen een man, formeel)
    note: '*Panu* is de datiefvorm van *pan*. Het werkwoord *odpowiadać* ("schikken, uitkomen") krijgt de persoon voor wie iets uitkomt altijd in de datief, net zoals je in het Nederlands zegt: "vrijdag komt *mij* goed uit".'
  pl.a1.unit03.lesson03.teach.czy_piatek_pani:
    title: Aan een vrouw vragen of vrijdag uitkomt, formeel
    gloss: Komt vrijdag u uit? (tegen een vrouw, formeel)
    note: Vervang *panu* door *pani* om een vrouw formeel aan te spreken – *pani* blijft hier hetzelfde in nominatief en datief, anders dan *pan*/*panu*.
  pl.a1.unit03.lesson03.teach.czy_piatek_ci:
    title: Aan een vriend(in) vragen of vrijdag uitkomt, informeel
    gloss: Komt vrijdag jou uit? (informeel)
    note: '*Ci* komt in de plaats van *panu*/*pani* als je met een vriend(in) of leeftijdsgenoot praat – het informele ''jou'' in de datief.'
  pl.a1.unit03.lesson03.teach.piatek_mi_odpowiada:
    title: Zeggen dat vrijdag jou uitkomt
    gloss: Vrijdag komt mij goed uit.
    note: '*Mi* is de datief van de eerste persoon -- hetzelfde naamvalpatroon als *panu*/*pani*/*ci*, maar dan voor "mij" in plaats van "jou".'
  pl.a1.unit03.lesson03.teach.data:
    title: Datum
    gloss: datum (kalenderdatum)
    note: Lijkt sterk op het Nederlandse woord "datum" -- makkelijk te herkennen.
    example_gloss: Welke datum wordt dat?
  pl.a1.unit03.lesson03.teach.jaka_to_bedzie_data:
    title: Vragen welke datum het wordt
    gloss: Welke datum wordt dat?
    note: Een natuurlijke vervolgvraag als twee mensen een dag van de week hebben afgesproken, maar nog niet de precieze datum.
  pl.a1.unit03.lesson03.teach.dialogue.line01:
    title: Ewa stelt voor om nog eens af te spreken
    gloss: Ewa vraagt Marek wanneer ze elkaar weer kunnen zien.
    note: Herhaalt precies de openingsvraag van deze les.
  pl.a1.unit03.lesson03.teach.dialogue.line02:
    title: Marek stelt formeel vrijdag voor
    gloss: Marek vraagt Ewa formeel of vrijdag haar uitkomt.
    note: Marek spreekt Ewa aan met *pani*, in het formele register dat sinds de eerste unit wordt gebruikt.
  pl.a1.unit03.lesson03.teach.dialogue.line03:
    title: Ewa stemt in en vraagt naar de datum
    gloss: Ewa zegt dat vrijdag haar uitkomt en vraagt dan welke datum het precies wordt.
    note: '*Tak* ("ja"), uit unit 1, opent Ewa''s instemming voordat ze naar de precieze datum vraagt.'
  pl.a1.unit03.lesson03.teach.dialogue.line04:
    title: Marek noemt de datum
    gloss: 'Marek zegt: 15 mei.'
    note: Beide woorden zijn al in les 2 van deze unit aan bod gekomen.
  pl.a1.unit03.lesson03.teach.dialogue.line05:
    title: Ewa bevestigt en neemt afscheid
    gloss: Ewa zegt dat het geweldig is en tot 15 mei.
    note: '*Do zobaczenia* hergebruikt het afscheid uit de eerste unit, nu gecombineerd met een concrete datum.'
  pl.a1.unit03.lesson03.teach.dialogue.line06:
    title: Marek sluit het gesprek af
    gloss: Marek zegt ook gedag.
    note: De kortst mogelijke afsluiting -- alleen het afscheid zelf.
