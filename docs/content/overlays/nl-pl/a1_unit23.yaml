    title: Ewa en Marek betalen de rekening
teaching:
  pl.a1.unit23.lesson01.teach.ile_to_kosztuje:
    title: Naar de totaalprijs vragen
    gloss: Hoeveel kost het in totaal?
    note: '*W sumie* (in totaal) maakt duidelijk dat je de volledige prijs wilt weten, niet de prijs van één product.'
  pl.a1.unit23.lesson01.teach.w_sumie_to:
    title: Een totaalprijs noemen
    gloss: Het kost in totaal honderd zloty.
    note: '*Kosztuje* is de *on/ona/ono*-vorm van *kosztować* (kosten). Getallen vanaf 5 vragen de genitief meervoud: *sto złotych*.'
  pl.a1.unit23.lesson02.teach.placic_karta_placic:
    title: Met pinpas of contant betalen
    gloss: met pinpas betalen, contant betalen
    note: '*Płacić kartą* (met de pinpas betalen) en *płacić gotówką* (contant betalen) gebruiken allebei de instrumentalis na *płacić*: *kartą*, *gotówką*.'
    example_gloss:
    - Kan ik hier met pinpas betalen?
    - Ik betaal contant.
  pl.a1.unit23.lesson02.teach.czy_moge_tu:
    title: Vragen of pinbetaling mogelijk is
    gloss: Kan ik hier met pinpas betalen?
    note: '*Tu* (hier) plaatst de vraag op de huidige plek; *czy* leidt een ja/nee-vraag in en *mogę* betekent ''ik kan'' of ''ik mag''.'
  pl.a1.unit23.lesson02.teach.czy_chce_pan:
    title: Vragen naar de betaalvoorkeur
    gloss: Wilt u contant of met pinpas betalen?
    note: '*Czy chce pan ...?* is de formele vorm van *Czy chcesz ...?*, hier gebruikt door een kassamedewerker die je niet kent (*pan* voor een man, *pani* voor een vrouw).'
  pl.a1.unit23.lesson03.teach.rachunek:
    title: De rekening
    gloss: de rekening
    note: 'Een mannelijk zelfstandig naamwoord: *rachunek* (genitief *rachunku*).'
    example_gloss: Zullen we de rekening delen?
  pl.a1.unit23.lesson03.teach.moze_podzielimy_rachunek:
    title: Voorstellen de rekening te delen
    gloss: Zullen we de rekening delen?
    note: '*Może podzielimy ...?* is een beleefde manier om samen iets voor te stellen; *podzielimy* is de *my*-vorm van *podzielić*.'
  pl.a1.unit23.lesson03.teach.czy_moge_zaplacic:
    title: Vragen om apart te betalen
    gloss: Mag ik apart betalen?
    note: '*Osobno* (apart) hoort bij *zapłacić* (betalen, perfectief: één afgeronde betaling).'
  pl.a1.unit23.lesson04.teach.reszta:
    title: Het wisselgeld
    gloss: het wisselgeld
    note: 'Een vrouwelijk zelfstandig naamwoord: *reszta* (genitief *reszty*, zoals in *nie potrzebuję reszty*).'
    example_gloss: Hier is uw wisselgeld.
  pl.a1.unit23.lesson04.teach.oto_pana_reszta:
    title: Wisselgeld teruggeven
    gloss: Hier is uw wisselgeld.
    note: '*Pana* is het formele ''uw'' (tegen een man; *pani* voor een vrouw), passend bij het formele register aan de kassa.'
  pl.a1.unit23.lesson04.teach.nie_potrzebuje_reszty:
    title: Wisselgeld weigeren
    gloss: Ik heb geen wisselgeld nodig.
    note: '*Nie potrzebuję* + genitief: bij ontkenning staat het voorwerp in de genitief, dus *reszty*.'
  pl.a1.unit23.lesson05.teach.trzydziesci_piec:
    title: Vijfendertig
    gloss: vijfendertig
    note: '*Trzydzieści pięć* schrijf je als twee woorden: eerst de tientallen, dan de eenheden (30 + 5).'
    example_gloss: Het kost honderdveertig zloty.
  pl.a1.unit23.lesson05.teach.rachunek_dwa_dania:
    title: Een restaurantrekening lezen
    gloss: 'Rekening: twee hoofdgerechten en twee koffies. Totaal: honderdveertig zloty. Betaald met pin.'
    note: Let op wat er besteld is, wat het totaal is en hoe er is betaald.
    glosses:
      Rachunek: rekening
      dwa: twee
      dania: hoofdgerechten (dania główne)
      kawy: koffies
      Razem: totaal
      złotych: zloty
      Zapłacono: betaald
      kartą: pinpas
      sto: honderd
      czterdzieści: veertig
  pl.a1.unit23.lesson06.teach.ewa_moze_poprosimy:
    title: Ewa vraagt om de rekening
    gloss: 'Ewa: Zullen we om de rekening vragen?'
    note: '*Poprosić o* (vragen om) wordt gevolgd door de accusatief: *o rachunek*. *Poprosimy* is de perfectieve toekomende tijd.'
  pl.a1.unit23.lesson06.teach.marek_tak_dobry:
    title: Marek vraagt naar het totaal
    gloss: 'Marek: Ja, goed idee. Hoeveel is het in totaal?'
    note: Hier komt de vraag *Ile to kosztuje w sumie?* uit les 1 terug.
  pl.a1.unit23.lesson06.teach.ewa_to_trzydziesci:
    title: Ewa noemt het totaal
    gloss: 'Ewa: Het is honderdveertig zloty. Zullen we het delen?'
    note: '*Podzielimy się?* (letterlijk ''zullen we ons delen?'') gebruikt het wederkerende *się* in de betekenis van de rekening delen.'
  pl.a1.unit23.lesson06.teach.marek_nie_dzisiaj:
    title: Marek staat erop te betalen
    gloss: 'Marek: Nee, vandaag betaal ik. Je hebt me zo geholpen!'
    note: '*Dzisiaj ja płacę* (letterlijk ''vandaag betaal ik'') is de gebruikelijke manier om aan te bieden te betalen; *pomogłaś* is de vrouwelijke verleden tijd van *pomóc* (helpen), omdat Marek tegen Ewa praat.'
  pl.a1.unit23.lesson06.teach.ewa_jak_milo:
    title: Ewa is ontroerd
    gloss: 'Ewa: Wat lief van je! Dank je wel.'
    note: '*Miło z twojej strony* (aardig van je) is een warm, veelgebruikt compliment voor een vrijgevig gebaar; *z* + genitief: *z twojej strony*.'
  pl.a1.unit23.lesson06.teach.marek_czy_moge:
    title: Marek vraagt of hij met pin kan betalen
    gloss: 'Marek: Kan ik hier met pin betalen?'
    note: Hier komt de vraag *Czy mogę tu zapłacić kartą?* uit les 2 terug, nu in het echte restaurant.
  pl.a1.unit23.lesson06.teach.marek_placi_rachunek:
    title: 'Płaci: de hij/zij-vorm'
    gloss: Marek betaalt de rekening.
    note: '*Płaci* is de *on/ona/ono*-vorm van *płacić* (betalen).'
