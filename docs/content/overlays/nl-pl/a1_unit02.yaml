answer_policy:
  diacritics: 'Same standing policy as unit01: display and teach all Polish diacritics (ą ć ę ł ń ó ś ź ż). In typed A1 answers, accept a variant with the diacritic dropped or swapped for its plain-letter equivalent when every other letter and word is correct. Punctuation marks (?, !) may be omitted in typed answers, but the fully punctuated form remains the model answer.'
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names (Ewa, Marek).
  spoken_answers: Judge spoken responses by intelligibility and appropriate register (pan/pani vs ty) rather than written punctuation or diacritics.
course:
  title: Pools A1
units:
  pl.a1.unit02.numbers:
    title: Getallen
lessons:
  pl.a1.unit02.lesson01.numbers_zero_to_ten:
    title: Getallen van nul tot tien
  pl.a1.unit02.lesson02.numbers_and_prices:
    title: Getallen van elf tot honderd en prijzen
  pl.a1.unit02.lesson03.phone_and_age:
    title: Telefoonnummer en leeftijd
teaching:
  pl.a1.unit02.lesson01.teach.zero:
    title: Zero
    gloss: nul
    note: Het beginpunt voor elk getal dat in deze les volgt.
    example_gloss: Vandaag is het nul graden.
  pl.a1.unit02.lesson01.teach.jeden:
    title: Een
    gloss: een
    note: Na *jeden* volgt een gewoon zelfstandig naamwoord in het enkelvoud, anders dan bij alle andere getallen in deze les.
    example_gloss: Ik heb één telefoon.
  pl.a1.unit02.lesson01.teach.dwa:
    title: Twee
    gloss: twee
    note: Na *dwa*, *trzy* en *cztery* krijgt het zelfstandig naamwoord een bijzondere meervoudsvorm (zoals *psy*, "honden") -- anders dan de meervoudsvorm na *pięć* en hoger.
    example_gloss: Ik heb twee honden.
  pl.a1.unit02.lesson01.teach.trzy:
    title: Drie
    gloss: drie
    note: 'Zelfde meervoudspatroon als bij *dwa*: *trzy złote* (drie zloty), niet *trzy złotych*.'
    example_gloss: Koffie kost drie zloty.
  pl.a1.unit02.lesson01.teach.cztery:
    title: Vier
    gloss: vier
    note: Het laatste van de drie getallen (*dwa*, *trzy*, *cztery*) met dit meervoudspatroon.
    example_gloss: Ik heb vier boeken.
  pl.a1.unit02.lesson01.teach.piec:
    title: Vijf
    gloss: vijf
    note: Vanaf *pięć* krijgen zelfstandige naamwoorden een andere meervoudsvorm (de genitief meervoud, bijv. *minut* in plaats van *minuty*) -- dit patroon zie je in de rest van deze unit terug.
    example_gloss: Ik heb vijf minuten.
  pl.a1.unit02.lesson01.teach.szesc:
    title: Zes
    gloss: zes
    note: 'Zelfde patroon met genitief meervoud als bij *pięć*: *sześć jabłek* (zes appels).'
    example_gloss: Ik heb zes appels.
  pl.a1.unit02.lesson01.teach.siedem:
    title: Zeven
    gloss: zeven
    note: Een handig getal om over de dagen van de week te praten.
    example_gloss: Een week heeft zeven dagen.
  pl.a1.unit02.lesson01.teach.osiem:
    title: Acht
    gloss: acht
    note: '*Mam osiem lat* betekent letterlijk "ik heb acht jaren" -- in het Pools geef je je leeftijd aan met *mieć* ("hebben"), net als in het Nederlands. Dit patroon oefen je uitgebreid in les 3.'
    example_gloss: Ik ben acht jaar oud.
  pl.a1.unit02.lesson01.teach.dziewiec:
    title: Negen
    gloss: negen
    note: 'Opnieuw genitief meervoud: *dziewięć osób* (negen mensen).'
    example_gloss: Negen mensen wachten in de rij.
  pl.a1.unit02.lesson01.teach.dziesiec:
    title: Tien
    gloss: tien
    note: Het laatste van de eencijferige getallen -- les 2 gaat verder met de tieners en de tientallen.
    example_gloss: Ik heb tien vingers.
  pl.a1.unit02.lesson02.teach.jedenascie:
    title: Elf
    gloss: elf
    note: 'De getallen 11-19 eindigen op *-naście*, vergelijkbaar met "-tien" in het Nederlands (13-19). Net als *pięć* en hoger nemen ze de genitief meervoud: *jedenaście osób*.'
    example_gloss: De klas heeft elf leerlingen.
  pl.a1.unit02.lesson02.teach.dwanascie:
    title: Twaalf
    gloss: twaalf
    note: Zelfde *-naście*-patroon als bij *jedenaście*.
    example_gloss: Een jaar heeft twaalf maanden.
  pl.a1.unit02.lesson02.teach.pietnascie:
    title: Vijftien
    gloss: vijftien
    note: 'Nog steeds het *-naście*-patroon: *piętnaście minut* (vijftien minuten).'
    example_gloss: Ik heb een pauze van vijftien minuten.
  pl.a1.unit02.lesson02.teach.dwadziescia:
    title: Twintig
    gloss: twintig
    note: De getallen 20-40 eindigen op *-dzieści* -- een ander patroon dan de *-naście*-getallen. *Dwadzieścia* zelf neemt nog de genitief meervoud (*dwadzieścia lat*), maar let in les 3 op wat er gebeurt als je er een eenheid bij optelt.
    example_gloss: Ik ben twintig jaar oud.
  pl.a1.unit02.lesson02.teach.dwadziescia_jeden:
    title: Eenentwintig
    gloss: eenentwintig
    note: 'Samengestelde getallen worden in het Pools anders gevormd dan in het Nederlands: eerst het tiental, dan de eenheid, zonder verbindingswoord (dus niet "eenentwintig", maar letterlijk "twintig een").'
  pl.a1.unit02.lesson02.teach.trzydziesci:
    title: Dertig
    gloss: dertig
    note: Nog steeds het *-dzieści*-patroon dat je bij *dwadzieścia* zag.
    example_gloss: Het kaartje kost dertig zloty.
  pl.a1.unit02.lesson02.teach.piecdziesiat:
    title: Vijftig
    gloss: vijftig
    note: De getallen 50-90 hebben een derde patroon, *-dziesiąt*, in plaats van *-dzieści*.
    example_gloss: Ik heb vijftig zloty.
  pl.a1.unit02.lesson02.teach.sto:
    title: Honderd
    gloss: honderd
    note: Een mooi rond getal zonder samengestelde uitgang om je zorgen over te maken.
    example_gloss: Dat kost honderd zloty.
  pl.a1.unit02.lesson02.teach.ile:
    title: Hoeveel
    gloss: hoeveel
    note: Het vraagwoord om naar elke hoeveelheid of prijs te vragen.
    example_gloss: Hoeveel kost dit?
  pl.a1.unit02.lesson02.teach.ile_to_kosztuje:
    title: Naar een prijs vragen
    gloss: Hoeveel kost dit?
    note: '*Kosztować* ("kosten") is het werkwoord; *to* ("dit/het") is het onderwerp. De hele vraag is een vaste, heel gebruikelijke zin.'
  pl.a1.unit02.lesson02.teach.to_kosztuje_dwadziescia:
    title: Een prijs noemen
    gloss: Dit kost twintig zloty.
    note: '*Złotych* is de genitief meervoud van *złoty* (de Poolse munteenheid) -- hetzelfde meervoud dat *dwadzieścia* zelf al vraagt.'
  pl.a1.unit02.lesson03.teach.jaki_jest_pana_numer:
    title: Een man naar zijn telefoonnummer vragen
    gloss: Wat is uw telefoonnummer? (tegen een man, beleefd)
    note: Letterlijk "wat is het telefoonnummer van de heer". *Pana* is de bezitsvorm (genitief) van *pan* -- "van de heer", dus "uw".
  pl.a1.unit02.lesson03.teach.jaki_jest_pani_numer:
    title: Een vrouw naar haar telefoonnummer vragen
    gloss: Wat is uw telefoonnummer? (tegen een vrouw, beleefd)
    note: Vervang *pana* door *pani* om een vrouw beleefd aan te spreken, net als het patroon uit unit 1.
  pl.a1.unit02.lesson03.teach.jaki_jest_twoj_numer:
    title: Informeel naar een telefoonnummer vragen
    gloss: Wat is je telefoonnummer? (informeel)
    note: '*Twój* (je, informeel) komt in de plaats van *pana*/*pani* als je met een vriend of leeftijdsgenoot praat.'
  pl.a1.unit02.lesson03.teach.numer_to:
    title: Een nummer geven, inleiding
    gloss: Het nummer is...
    note: Een korte, natuurlijke inleiding voordat je de cijfers één voor één voorleest -- zo geven Polen hun telefoonnummer meestal door.
  pl.a1.unit02.lesson03.teach.przykladowy_numer:
    title: Een voorbeeld van een telefoonnummer
    gloss: Zes, een, vijf, nul, twee.
    note: Poolse telefoonnummers worden cijfer voor cijfer voorgelezen, net als vaak in het Nederlands -- elk cijfer hier hoorde bij de getallen die je in deze unit al hebt geleerd.
  pl.a1.unit02.lesson03.teach.ile_masz_lat:
    title: Informeel naar iemands leeftijd vragen
    gloss: Hoe oud ben jij? (informeel)
    note: Letterlijk "hoeveel jaren heb je" -- in het Pools geef je je leeftijd aan met *mieć* ("hebben"), hetzelfde patroon als op de *osiem*-kaart in les 1.
  pl.a1.unit02.lesson03.teach.ile_pan_ma_lat:
    title: Beleefd naar iemands leeftijd vragen
    gloss: Hoe oud bent u? (tegen een man, beleefd)
    note: '*Ma* is dezelfde vorm van de derde persoon die je al zag bij *pan jest*/*pan ma* in unit 1 -- *pan* gedraagt zich grammaticaal als "de heer", een onderwerp in de derde persoon.'
  pl.a1.unit02.lesson03.teach.mam_dwadziescia_osiem_lat:
    title: Je leeftijd zeggen
    gloss: Ik ben achtentwintig jaar oud.
    note: '*Mam* is de eerste persoon van *mieć* ("hebben"). *Dwadzieścia osiem* eindigt op *osiem* (acht), dus net als elk getal dat op 5-9 eindigt neemt het *lat* -- let in het dialoog van les 3 op een getal dat anders eindigt.'
  pl.a1.unit02.lesson03.teach.dialogue.line01:
    title: Ewa vraagt om het nummer van Marek
    gloss: Ewa vraagt Marek beleefd naar zijn telefoonnummer.
    note: Hergebruikt precies de beleefde vraag naar een telefoonnummer uit deze les.
  pl.a1.unit02.lesson03.teach.dialogue.line02:
    title: Marek geeft zijn nummer
    gloss: Marek leest zijn telefoonnummer cijfer voor cijfer voor.
    note: Elk cijfer hier heb je al geleerd in les 1-2 van deze unit.
  pl.a1.unit02.lesson03.teach.dialogue.line03:
    title: Ewa vraagt naar Mareks leeftijd
    gloss: Ewa bedankt hem en vraagt beleefd naar zijn leeftijd.
    note: '*Dziękuję* ("dank je") en *A* ("en") veranderen niet met het register, net als de kaart *dziękuję* uit unit 1.'
  pl.a1.unit02.lesson03.teach.dialogue.line04:
    title: Marek zegt zijn leeftijd en stelt de vraag terug
    gloss: Marek zegt dat hij achtentwintig is en vraagt beleefd naar de leeftijd van Ewa.
    note: '*A pani?* geeft de vraag beleefd terug aan een vrouw, hetzelfde korte patroon als *A pan?* in unit 1.'
  pl.a1.unit02.lesson03.teach.dialogue.line05:
    title: Ewa zegt haar leeftijd
    gloss: Ewa zegt dat ze tweeëndertig is.
    note: '*Trzydzieści dwa* eindigt op *dwa* (twee), dus anders dan *dwadzieścia osiem* (dat op acht eindigt en *lat* neemt) neemt dit getal *lata* -- getallen die op 2, 3 of 4 eindigen (behalve de tieners) gebruiken deze andere meervoudsvorm. Een echt grammaticaal verschil: *lat* en *lata* zijn niet uitwisselbaar, en welke juist is hangt af van het laatste cijfer van het getal.'
  pl.a1.unit02.lesson03.teach.dialogue.line06:
    title: Marek sluit het gesprek af
    gloss: Marek zegt dat het fijn was om te praten, en neemt afscheid.
    note: '*Do zobaczenia* hergebruikt het afscheid uit unit 1.'
