answer_policy:
  diacritics: Display and teach all Polish diacritics (ą ć ę ł ń ó ś ź ż). In typed A1 answers, accept a variant with the diacritic dropped or swapped for its plain-letter equivalent (a/c/e/l/n/o/s/z/z) when every other letter and word is correct -- these are genuinely hard to type on a non-Polish keyboard and this is a beginner course, not a spelling test. Do not extend this tolerance to ł vs l at the START of a word where it changes which real word is meant (not a relevant case in this unit's vocabulary, but noted for future units). Punctuation marks (?, !) may be omitted in typed answers, but the fully punctuated form remains the model answer.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names (Anna, Marek, Kowalska, Wójcik) and in the place name Warszawie.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register (pan/pani vs ty) rather than written punctuation or diacritics.
course:
  title: Pools A1
  description: 'Pools voor beginners om het uiterlijk van een persoon te beschrijven: lengte en indruk van leeftijd, haar- en oogkleur, de basisvraag Jak wygląda ...? en het vergelijken van het uiterlijk van twee personen.'
units:
  pl.a1.unit25.wyglad:
    title: Uiterlijk beschrijven
lessons:
  pl.a1.unit25.lesson01.wysoki_niski_stary_i:
    title: Lang, klein, oud en jong
  pl.a1.unit25.lesson02.opisywanie_wlosow:
    title: Haar beschrijven
  pl.a1.unit25.lesson03.oczy_i_jak_ktos:
    title: Ogen en hoe ziet iemand eruit?
  pl.a1.unit25.lesson04.ewa_opisuje_nine:
    title: Ewa beschrijft Nina
  pl.a1.unit25.lesson05.porownanie_tomka_i_kasi:
    title: Tomek en Kasia vergelijken
  pl.a1.unit25.lesson06.marek_rozpoznaje_nine:
    title: Marek herkent Nina
teaching:
  pl.a1.unit25.lesson01.teach.wysoki_niski:
    title: Lang en klein
    gloss: lang / klein
    note: '*Wysoki* beschrijft een lange persoon en *niski* een kleine. Bij een vrouw is het *wysoka* of *niska*.'
    example_gloss:
    - Kasia is lang.
    - Tomek is klein.
  pl.a1.unit25.lesson01.teach.stary_mlody:
    title: Oud en jong
    gloss: oud / jong
    note: '*Stary* en *młody* beschrijven hier een algemene indruk, geen exact aantal jaren.'
    example_gloss:
    - Opa is oud.
    - Marek is jong.
  pl.a1.unit25.lesson01.teach.dziadek_jest_stary:
    title: 'Stary: indruk of leeftijd'
    gloss: '*Stary* beschrijft een algemene indruk, zoals in *Dziadek jest stary*. Voor een exacte leeftijd gebruikt het Pools een andere constructie: *Ile masz lat?*'
    note: Hoe oud iemand eruitziet beschrijf je met *stary* of *młody*; voor een exacte leeftijd vraag je *Ile masz lat?* en antwoord je met *mam ... lat* (ik ben ... jaar oud).
  pl.a1.unit25.lesson01.teach.kasia_jest_wysoka:
    title: Kasia is lang en Tomek is klein
    gloss: Kasia is lang en Tomek is klein.
    note: Een eenvoudige samengestelde zin met *a* (en, in tegenstelling). *Wysoka* en *niski* congrueren met een vrouwelijk en een mannelijk onderwerp, als voorbereiding op de vergelijking in les 5.
  pl.a1.unit25.lesson02.teach.wlosy:
    title: Haar
    gloss: het haar
    note: '*Włosy* is in het Pools altijd meervoud: *długie włosy* (lang haar).'
    example_gloss: Marek heeft kort zwart haar.
  pl.a1.unit25.lesson02.teach.blond_brazowe_siwe:
    title: Blond, bruin en grijs
    gloss: blond / bruin / grijs
    note: Drie haarkleuren. *Blond* verandert nooit; *brązowe* en *siwe* zijn meervoudsvormen die bij *włosy* passen.
    example_gloss:
    - Ewa heeft blond haar.
    - Tomek heeft bruin haar.
    - Opa heeft grijs haar.
  pl.a1.unit25.lesson02.teach.dlugie_krotkie:
    title: Lang en kort (haar)
    gloss: lang / kort (haar)
    note: '*Długie* (lang) en *krótkie* (kort) zijn meervoudsvormen die bij *włosy* passen.'
    example_gloss:
    - Kasia heeft lang haar.
    - Tomek heeft kort haar.
  pl.a1.unit25.lesson02.teach.wlosy_sa_w:
    title: Włosy krijgt een meervoudig bijvoeglijk naamwoord
    gloss: '*Włosy* is meervoud, dus het bijvoeglijk naamwoord staat ook in het meervoud: lang haar, kort haar, bruin haar, zwart haar.'
    note: 'Meervoudige zelfstandige naamwoorden die geen mannelijke personen zijn, krijgen bijvoeglijke naamwoorden op *-e*: *długie włosy*. *Blond* is de uitzondering: dit woord verandert nooit (*blond włosy*).'
  pl.a1.unit25.lesson02.teach.wlosy_maja_tylko:
    title: 'Włosy: altijd meervoud'
    gloss: '*Włosy* (haar) is altijd meervoud: *jej włosy są długie* (haar haar is lang, letterlijk ''haar haren zijn lang''). *Jej* betekent ''haar''.'
    note: Haar is in het Pools een meervoudig zelfstandig naamwoord, dus werkwoorden en bijvoeglijke naamwoorden staan ook in het meervoud. *Jej* ('haar') verandert nooit, hoeveel dingen ze ook bezit.
  pl.a1.unit25.lesson02.teach.marek_ma_krotkie:
    title: Marek heeft kort zwart haar
    gloss: Marek heeft kort zwart haar.
    note: '*Czarne* (zwart) is de meervoudsvorm die bij *włosy* past.'
  pl.a1.unit25.lesson02.teach.ewa_ma_dlugie:
    title: Ewa heeft lang blond haar
    gloss: Ewa heeft lang blond haar.
    note: Combineert de woorden voor lengte en kleur uit deze les in één natuurlijke zin.
  pl.a1.unit25.lesson03.teach.oczy:
    title: Ogen
    gloss: de ogen
    note: '*Oczy* is het meervoud van *oko*; in het Pools praat je over beide ogen meestal in het meervoud.'
    example_gloss: Marek heeft bruine ogen.
  pl.a1.unit25.lesson03.teach.niebieski_brazowy_zielony:
    title: Blauw, bruin en groen
    gloss: blauw / bruin / groen
    note: 'Drie oogkleuren, in het meervoud passend bij *oczy*: *niebieskie*, *brązowe*, *zielone*.'
    example_gloss:
    - Ewa heeft blauwe ogen.
    - Tomek heeft bruine ogen.
    - Kasia heeft groene ogen.
  pl.a1.unit25.lesson03.teach.oczy_sa_w:
    title: Oczy krijgt -e
    gloss: '*Oczy* is meervoud, dus het bijvoeglijk naamwoord eindigt op *-e*: blauwe ogen, bruine ogen, groene ogen.'
    note: 'Dezelfde meervoudsuitgang als bij *włosy* in les 2: *niebieskie oczy*, *brązowe oczy*, *zielone oczy*.'
  pl.a1.unit25.lesson03.teach.jak_wyglada_ewa:
    title: Hoe ziet Ewa eruit?
    gloss: Hoe ziet Ewa eruit?
    note: '*Jak wygląda ...?* is de kernvraag van dit hoofdstuk; gebruik hem om naar het uiterlijk van iedereen te vragen.'
  pl.a1.unit25.lesson03.teach.ewa_ma_dlugie:
    title: Ewa heeft lang blond haar en blauwe ogen
    gloss: Ewa heeft lang blond haar en blauwe ogen.
    note: Een voorbeeldantwoord dat haar en ogen met *i* (en) in één zin combineert.
  pl.a1.unit25.lesson04.teach.ewa_do_kawiarni:
    title: Ewa stelt Nina voor
    gloss: 'Ewa: Er komt een nieuw meisje naar het taalcafé. Ze heet Nina.'
    note: '*Przychodzi* (komt) introduceert iemand nieuws in het verhaal; *do kawiarni językowej* gebruikt *do* + genitief.'
  pl.a1.unit25.lesson04.teach.marek_okej_jak:
    title: Marek vraagt hoe ze eruitziet
    gloss: 'Marek: Oké! Hoe ziet ze eruit?'
    note: Hier komt de kernvraag van dit hoofdstuk terug, nu met *ona* (zij) in plaats van een naam.
  pl.a1.unit25.lesson04.teach.ewa_jest_niska:
    title: Ewa beschrijft Nina's lengte en haar
    gloss: 'Ewa: Ze is klein en heeft kort blond haar.'
    note: Combineert *niska* (de vrouwelijke vorm van *niski*) uit les 1 met de haarwoorden uit les 2.
  pl.a1.unit25.lesson04.teach.marek_a_jej:
    title: Marek vraagt naar haar ogen
    gloss: 'Marek: En haar ogen?'
    note: '*Jej* is hier het bezittelijk voornaamwoord ''haar'', dus *jej oczy* betekent ''haar ogen''; *jej* verandert nooit.'
  pl.a1.unit25.lesson04.teach.ewa_ma_zielone:
    title: Ewa beschrijft Nina's ogen
    gloss: 'Ewa: Ze heeft groene ogen.'
    note: '*Zielone oczy* komt uit les 3.'
  pl.a1.unit25.lesson04.teach.marek_dzieki_wtedy:
    title: Marek zal haar herkennen
    gloss: 'Marek: Bedankt! Dan herken ik haar.'
    note: '*Rozpoznam* is de voltooide toekomende tijd (''ik zal herkennen''); *ją* is de accusatief van *ona* (haar).'
  pl.a1.unit25.lesson05.teach.tomek_i_kasia:
    title: Tomek en Kasia vergeleken
    gloss: Tomek en Kasia zijn broer en zus, maar ze zien er verschillend uit. Tomek is klein en heeft kort bruin haar en bruine ogen. Kasia is groter dan Tomek en heeft lang bruin haar en groene ogen. Hoe zie jij eruit?
    note: Een korte vergelijking met alle kleur- en lengtewoorden die tot nu toe zijn geleerd, met als slot de kernvraag van de unit aan de lezer.
    glosses:
      brat: broer
      siostra: zus
      wyglądają: eruitzien
      inaczej: verschillend
      niski: kort
      krótkie: kort
      brązowe: bruin
      włosy: haar
      oczy: ogen
      wyższa: groter
      długie: lang
      zielone: groen
      wyglądasz: jij ziet eruit (informeel), over iemands uiterlijk
  pl.a1.unit25.lesson05.teach.stopien_wyzszy_wysoki:
    title: De vergrotende trap opnieuw gebruiken
    gloss: 'Vergrotende trap: *wysoki* (lang) wordt *wyższy* (langer), en de ander volgt na *niż* (dan): Kasia is groter dan Tomek.'
    note: 'In het Pools vorm je de vergrotende trap door de uitgang van het bijvoeglijk naamwoord te veranderen, en het woord komt nog steeds overeen met het geslacht: *wyższa* voor Kasia (vrouwelijk).'
  pl.a1.unit25.lesson05.teach.kasia_ma_dluzsze:
    title: Kasia heeft langer haar dan Tomek
    gloss: Kasia heeft langer haar dan Tomek.
    note: '*Dłuższe* (langer) staat in het meervoud passend bij *włosy*, en *niż* (dan) leidt de vergelijking in.'
  pl.a1.unit25.lesson05.teach.mam_krotkie_brazowe:
    title: Ik heb kort bruin haar
    gloss: Ik heb kort bruin haar.
    note: Een voorbeeldzin in de eerste persoon met *Mam ...*, handig om je eigen uiterlijk te beschrijven.
  pl.a1.unit25.lesson06.teach.marek_patrz_czy:
    title: Marek ziet Nina
    gloss: 'Marek: Kijk, is dat Nina? Ze heeft kort blond haar en groene ogen.'
    note: '*Patrz* (kijk) is de gebiedende wijs van *patrzeć*. *Czy to Nina?* betekent ''is dat Nina?'''
  pl.a1.unit25.lesson06.teach.ewa_tak_to:
    title: Ewa bevestigt het
    gloss: 'Ewa: Ja, dat is Nina!'
    note: Een korte, natuurlijke bevestiging.
  pl.a1.unit25.lesson06.teach.nina_czesc_jestes:
    title: Nina begroet Marek
    gloss: 'Nina: Hoi, ben jij Marek?'
    note: 'Een eenvoudige informele begroetingsvraag. Na *być* staat een naam in de instrumentalis: *jesteś Markiem?*'
  pl.a1.unit25.lesson06.teach.marek_tak_milo:
    title: Marek begroet Nina terug
    gloss: 'Marek: Ja! Leuk je te ontmoeten, Nina.'
    note: '*Miło cię poznać* is de standaardzin bij een eerste ontmoeting (''leuk je te ontmoeten''; *poznać* betekent ''leren kennen''). Nina wordt aangesproken in de vocatief: *Nino*.'
  pl.a1.unit25.lesson06.teach.nina_ciebie_tez:
    title: Nina beantwoordt de begroeting
    gloss: 'Nina: Aangenaam!'
    note: 'Sluit de dialoog af: Marek heeft Nina herkend aan Ewa''s beschrijving van eerder.'
