teaching:
  pl.a1.unit09.lesson01.teach.isc_dojsc:
    title: Gaan, ergens komen
    gloss: gaan; ergens komen / aankomen bij
    note: Twee nauw verwante bewegingswerkwoorden -- iść is algemeen 'gaan/lopen', dojść is specifiek 'ergens komen' of 'een bestemming bereiken', en komt voor in het vraagpatroon van deze les.
    example_gloss:
    - Gaat u rechtdoor.
    - Hoe kom ik bij de bank?
  pl.a1.unit09.lesson01.teach.prosto:
    title: Rechtdoor
    gloss: rechtdoor
    note: Het meest basale richtingwoord -- direct na iść gebruikt om 'rechtdoor gaan' te zeggen.
    example_gloss: Gaat u rechtdoor naar het park.
  pl.a1.unit09.lesson01.teach.tam_potem:
    title: Daar, dan
    gloss: daar; dan
    note: Tam wijst een plaats aan; potem geeft de volgorde van stappen aan ('eerst dit, dan dat') -- allebei onmisbaar om een routebeschrijving aan elkaar te knopen.
    example_gloss:
    - De bank is daar.
    - Daarna gaat u rechtdoor.
  pl.a1.unit09.lesson01.teach.prosze_bezokolicznik:
    title: Please + infinitive
    gloss: 'Proszę + infinitief -- Proszę (alstublieft) plus een werkwoord in de infinitief (de woordenboekvorm) is de gewone beleefde manier om de weg te wijzen, zonder aparte gebiedende wijs: Gaat u rechtdoor.'
    note: '*Proszę* plus een werkwoord in de infinitief is hoe je in het Pools beleefd zegt dat iemand iets moet doen -- *Proszę iść prosto* ("Gaat u rechtdoor"). Het is de veilige, beleefde keuze tegenover een vreemde, dus je hebt geen aparte gebiedende wijs nodig om de weg te geven of te begrijpen. (Tussen vrienden gebruiken Poolse sprekers meestal wel die gebiedende wijs -- die leer je later kennen.)'
  pl.a1.unit09.lesson01.teach.jak_dojsc_note:
    title: Hoe kom ik bij + [plaats]?
    gloss: 'Hoe kom ik bij + [plaats]? -- Jak (hoe) plus dojść (ergens komen) vraagt de weg naar een plek: Hoe kom ik bij de bank? Hoe kom ik bij het hotel? Hoe kom ik bij het park? Het zelfstandig naamwoord na ''do'' krijgt dezelfde genitiefuitgang -u als na ''naast''/''tegenover'' in de vorige les: bank -> banku, hotel -> hotelu, park -> parku.'
    note: '*Jak dojść do...?* is de gewone vraag om te vragen hoe je ergens komt. De plaatsnaam na *do* krijgt dezelfde genitiefuitgang *-u* die je al kent na *obok*/*naprzeciwko* -- *bank* wordt *banku*, *hotel* wordt *hotelu*, *park* wordt *parku*: precies hetzelfde patroon, alleen na een nieuw voorzetsel.'
  pl.a1.unit09.lesson01.teach.jak_dojsc_do_banku:
    title: Hoe kom ik bij de bank?
    gloss: Hoe kom ik bij de bank?
    note: Het patroon uit de grammaticanotitie in actie met de eerste bestemming van deze les.
  pl.a1.unit09.lesson02.teach.prawo_lewo:
    title: Rechts, links
    gloss: rechts; links
    note: Gebruikt na na om aan te geven waar iets is of welke kant je op moet -- na prawo (naar rechts / rechts), na lewo (naar links / links).
    example_gloss:
    - De bank is aan de rechterkant.
    - Het park is aan de linkerkant.
  pl.a1.unit09.lesson02.teach.skrecic:
    title: Afslaan
    gloss: afslaan
    note: Het werkwoord voor van richting veranderen -- samen met na prawo/na lewo betekent het 'rechtsaf'/'linksaf slaan'.
    example_gloss: Slaat u rechtsaf.
  pl.a1.unit09.lesson02.teach.skrecic_na_lewo:
    title: Slaat u linksaf
    gloss: Slaat u linksaf.
    note: Hetzelfde patroon Proszę + infinitief, nu met skręcić en na lewo.
  pl.a1.unit09.lesson02.teach.ulica:
    title: Straat
    gloss: straat
    note: Een gewoon woord voor elke straat -- handig wanneer een routebeschrijving een bepaalde straat bij naam noemt.
    example_gloss: De straat is daar.
  pl.a1.unit09.lesson02.teach.multi_step_note:
    title: Aanwijzingen aan elkaar knopen met potem
    gloss: 'Gaat u rechtdoor, daarna slaat u rechtsaf. -- Meerdere aanwijzingen kun je verbinden met een komma en het woord potem (dan): eerst het ene, dan het volgende.'
    note: 'Wil je meer dan één aanwijzing na elkaar geven, verbind ze dan gewoon met een komma en *potem*: *Proszę iść prosto, potem skręcić na prawo* ("Gaat u rechtdoor, daarna slaat u rechtsaf"). Zo zijn echte routebeschrijvingen met meerdere stappen opgebouwd.'
  pl.a1.unit09.lesson03.teach.rozumiem:
    title: Ik begrijp het
    gloss: ik begrijp het
    note: Handig om te laten merken dat je de route hebt begrepen, voordat je een vervolgvraag stelt.
    example_gloss: Ik begrijp het, dank je.
  pl.a1.unit09.lesson03.teach.dialogue.line01:
    title: Ewa vraagt hoe ze bij het park komt
    gloss: Ewa zegt pardon en vraagt hoe ze bij het park komt.
    note: Przepraszam opent de vraag, dezelfde beleefde gewoonte als in de dialoog over plaatsen in de vorige unit.
  pl.a1.unit09.lesson03.teach.dialogue.line02:
    title: Een voorbijganger legt uit hoe je bij het park komt
    gloss: 'De voorbijganger zegt: ga rechtdoor en sla dan linksaf. Het park is daar.'
    note: Twee aaneengeschakelde aanwijzingen met potem, precies zoals de grammaticanotitie van deze les beschrijft.
  pl.a1.unit09.lesson03.teach.dialogue.line03:
    title: Ewa bevestigt en vraagt naar de bank
    gloss: Ewa zegt dat ze het begrijpt en vraagt hoe ze bij de bank komt.
    note: Rozumiem bevestigt dat ze de eerste route heeft gevolgd, voordat ze een nieuwe vraag stelt.
  pl.a1.unit09.lesson03.teach.dialogue.line04:
    title: De voorbijganger legt uit hoe je bij de bank komt
    gloss: 'De voorbijganger zegt: sla rechtsaf en ga dan rechtdoor. De bank is aan de rechterkant.'
    note: Een andere route in twee stappen dan die naar het park, met hetzelfde patroon Proszę + infinitief.
  pl.a1.unit09.lesson03.teach.dialogue.line05:
    title: Ewa bedankt
    gloss: 'Ewa zegt: hartelijk dank.'
    note: Dziękuję bardzo, al bekend uit de units over winkelen en plaatsen.
  pl.a1.unit09.lesson03.teach.dialogue.line06:
    title: De voorbijganger reageert
    gloss: 'De voorbijganger zegt: graag gedaan.'
    note: Proszę bardzo, het standaardantwoord op een bedankje, al bekend uit eerdere units.
