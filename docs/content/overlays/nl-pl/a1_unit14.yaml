teaching:
  pl.a1.unit14.lesson01.teach.mlody:
    title: Jong
    gloss: jong
    note: Een basisbijvoeglijk naamwoord – het startpunt voor de vergrotende trappen in deze eenheid.
    example_gloss: Marek is jong.
  pl.a1.unit14.lesson01.teach.stary:
    title: Oud
    gloss: oud
    note: Het tegenovergestelde van młody – nog een bijvoeglijk naamwoord dat we in deze eenheid in een vergrotende trap zetten.
    example_gloss: Opa is oud.
  pl.a1.unit14.lesson01.teach.comparative_formation_note:
    title: 'Een vergelijking maken: voeg -szy toe'
    gloss: 'Bij korte bijvoeglijke naamwoorden zoals stary en młody verander je de uitgang -y in -szy: stary wordt starszy, młody wordt młodszy. Niet elk bijvoeglijk naamwoord werkt zo.'
    note: 'Een eenvoudig patroon voor deze twee woorden: laat de laatste *-y* vallen en voeg *-szy* toe voor de vergrotende trap. Veel andere bijvoeglijke naamwoorden gebruiken een andere uitgang, dus pas het niet overal toe.'
  pl.a1.unit14.lesson01.teach.starszy_starsza:
    title: Ouder
    gloss: ouder
    note: Starszy gebruik je voor een man (of on); starsza voor een vrouw (of ona) – de vergrotende trap van stary.
    example_gloss:
    - Opa is ouder dan vader.
    - Oma is ouder dan moeder.
  pl.a1.unit14.lesson01.teach.mlodszy_mlodsza:
    title: Jonger
    gloss: jonger
    note: Młodszy voor een man, młodsza voor een vrouw – de vergrotende trap van młody.
    example_gloss:
    - Vader is jonger dan opa.
    - Moeder is jonger dan oma.
  pl.a1.unit14.lesson01.teach.niz:
    title: Dan
    gloss: dan
    note: Niż verbindt de twee dingen die je vergelijkt – het woord na niż blijft in zijn gewone basisvorm.
    example_gloss: De zoon is jonger dan de vader.
  pl.a1.unit14.lesson01.teach.gender_agreement_note:
    title: De vergrotende trap past zich aan het geslacht aan
    gloss: Starszy/starsza en młodszy/młodsza veranderen mee met het geslacht, net als byłem/byłam. Starszy, młodszy voor een man (on); starsza, młodsza voor een vrouw (ona).
    note: Hetzelfde patroon als *byłem*/*byłam* – de uitgang verandert naargelang je over een man of een vrouw praat.
  pl.a1.unit14.lesson01.teach.ewa_starsza:
    title: Ewa is ouder dan Marek
    gloss: Ewa is ouder dan Marek.
    note: Een echt feit over onze twee personages – Ewa is 32, Marek is 28.
  pl.a1.unit14.lesson01.teach.marek_mlodszy:
    title: Marek is jonger dan Ewa
    gloss: Marek is jonger dan Ewa.
    note: Hetzelfde feit, maar andersom gezegd.
  pl.a1.unit14.lesson02.teach.dobry_recap:
    title: Opnieuw 'goed'
    gloss: Dobry (goed) – dit ken je al van Dzień dobry.
    note: Hetzelfde bijvoeglijk naamwoord dat je al sinds de allereerste eenheid ziet, nu gebruikt om een vergrotende trap te vormen.
  pl.a1.unit14.lesson02.teach.zly:
    title: Slecht
    gloss: slecht
    note: Het tegenovergestelde van dobry – een gloednieuw woord in deze eenheid.
    example_gloss: Dit is een slechte dag.
  pl.a1.unit14.lesson02.teach.irregular_comparative_note:
    title: Dobry en zły zijn onregelmatig
    gloss: 'Dobry en zły zijn onregelmatig: dobry wordt lepszy, zły wordt gorszy – je voegt geen -szy toe.'
    note: Anders dan *stary*/*młody* volgen deze twee niet het regelmatige *-szy*-patroon – hun vergrotende trappen moet je gewoon leren.
  pl.a1.unit14.lesson02.teach.lepszy_lepsza:
    title: Beter
    gloss: beter
    note: Lepszy voor een man, lepsza voor een vrouw (of voor een vrouwelijk woord zoals kawa) – de onregelmatige vergrotende trap van dobry.
    example_gloss:
    - Hij is beter dan ik.
    - Koffie is beter dan thee.
  pl.a1.unit14.lesson02.teach.gorszy_gorsza:
    title: Slechter
    gloss: slechter
    note: Gorszy/gorsza -- de onregelmatige vergrotende trap van zły.
    example_gloss:
    - Hij is slechter dan ik.
    - Thee is slechter dan koffie.
  pl.a1.unit14.lesson02.teach.kawa_herbata_recap:
    title: Koffie en thee, nog eens
    gloss: Kawa en herbata -- deze woorden ken je al van de eerdere les over drinken.
    note: Een korte herhaling voordat je ze in deze les in een vergelijking gebruikt.
  pl.a1.unit14.lesson02.teach.gender_note_recap:
    title: Hetzelfde patroon als eerder
    gloss: Lepszy/lepsza en gorszy/gorsza veranderen mee met het geslacht, net zoals starszy/starsza in de vorige les.
    note: Dezelfde splitsing mannelijk/vrouwelijk die je net hebt geleerd, nu toegepast op een nieuw woordenpaar.
  pl.a1.unit14.lesson03.teach.pronouns_recap:
    title: Ik, ik ben, jij
    gloss: Ja, jestem, ty -- deze woorden ken je al van eerdere lessen.
    note: Een korte herhaling voor de dialoog van deze les.
  pl.a1.unit14.lesson03.teach.tak_nie_dobrze_recap:
    title: Ja, nee, goed
    gloss: Tak, nie en dobrze -- ook al bekend.
    note: Nog een korte herhaling voor de dialoog.
  pl.a1.unit14.lesson03.teach.ale_recap:
    title: Maar, nog eens
    gloss: Ale (maar) -- dit ken je al van eerdere lessen. Het verbindt twee tegengestelde zinnen.
    note: Een kort verbindingswoord dat een tegenstelling inleidt, net als "maar" in het Nederlands.
  pl.a1.unit14.lesson03.teach.dialogue.line01:
    title: Marek zegt dat thee beter is
    gloss: Thee is beter dan koffie!
    note: Marek begint met zijn eigen mening, die past bij wat hij al vertelde in de les over voorkeuren.
  pl.a1.unit14.lesson03.teach.dialogue.line02:
    title: Ewa is het er niet mee eens
    gloss: Nee, nee! Koffie is beter dan thee!
    note: Ewa zegt er met haar eigen mening tegenin -- ook dit past bij wat ze eerder zei.
  pl.a1.unit14.lesson03.teach.dialogue.line03:
    title: Marek gaat over op leeftijd
    gloss: Goed, goed. Maar ik ben jonger dan jij!
    note: Marek geeft de discussie over drinken op en begint over iets waar hij zeker van is.
  pl.a1.unit14.lesson03.teach.dialogue.line04:
    title: Ewa geeft hem gelijk en herhaalt haar mening
    gloss: Ja, ik ben ouder. Maar koffie is beter!
    note: Ewa bevestigt het leeftijdsverschil en komt dan terug op haar mening over koffie.
