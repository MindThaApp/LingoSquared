teaching:
  pl.a1.unit18.lesson01.teach.dom_jest_ma_recap:
    title: Huis, is, heeft -- opnieuw
    gloss: Dom, jest, ma, Marek, Ewa -- je kent deze woorden al uit eerdere lessen, bijv. 'Dom jest tam' (het huis is daar).
    note: Een korte herinnering voordat deze les ze gebruikt om over jouw woning te praten.
  pl.a1.unit18.lesson01.teach.mieszkanie:
    title: Appartement
    gloss: appartement
    note: Een woning in een gebouw, geen heel huis.
    example_gloss: Ewa heeft een appartement.
  pl.a1.unit18.lesson01.teach.duzy_note:
    title: Groot
    gloss: Het huis is groot. -- '*duży*' past bij mannelijke zelfstandige naamwoorden, zoals '*dom*.'
    note: Dit is de eerste keer in deze cursus dat een woord de grootte beschrijft -- voor nu geldt het alleen voor '*dom*.'
  pl.a1.unit18.lesson01.teach.marek_ma_dom_duzy:
    title: Mareks woning
    gloss: Marek heeft een huis. Het huis is groot.
    note: Het gegeven waarop deze hele unit voor Marek voortbouwt.
  pl.a1.unit18.lesson01.teach.ewa_ma_mieszkanie:
    title: Ewa's woning
    gloss: Ewa heeft een appartement.
    note: Het gegeven waarop deze hele unit voor Ewa voortbouwt.
  pl.a1.unit18.lesson01.teach.pokoj:
    title: Kamer
    gloss: kamer
    note: Een algemeen woord voor elke kamer in een woning.
    example_gloss: Waar is de kamer?
  pl.a1.unit18.lesson01.teach.ile_pokoi_note:
    title: Hoeveel kamers?
    gloss: Hoeveel kamers heb je? Ik heb twee kamers. -- je kent 'Ile', getallen en 'mam'/'masz' al uit eerdere lessen; '*pokoi*' en '*pokoje*' zijn vormen van het woord '*pokój*.'
    note: '''*Pokoi*'' gebruik je direct na ''*Ile*''; ''*pokoje*'' gebruik je direct na ''*dwa*'', ''*trzy*'' of ''*cztery*'' (twee, drie, vier).'
  pl.a1.unit18.lesson01.teach.ile_pokoi_masz_phrase:
    title: Hoeveel kamers heb je?
    gloss: Hoeveel kamers heb jij?
    note: Een natuurlijke vraag over iemands woning.
  pl.a1.unit18.lesson01.teach.mam_dwa_pokoje_phrase:
    title: Ik heb twee kamers
    gloss: Ik heb twee kamers.
    note: Een natuurlijk antwoord op de vraag hierboven.
  pl.a1.unit18.lesson02.teach.kuchnia:
    title: Keuken
    gloss: keuken
    note: Een van de meest voorkomende kamers in een woning.
    example_gloss: De keuken is klein.
  pl.a1.unit18.lesson02.teach.mala_note:
    title: Klein
    gloss: De keuken is klein. -- '*mała*' past bij vrouwelijke zelfstandige naamwoorden, zoals '*kuchnia*.'
    note: Dit is een ander woord dan '*duży*' (groot) -- voor nu geldt het alleen voor '*kuchnia*.'
  pl.a1.unit18.lesson02.teach.sypialnia:
    title: Slaapkamer
    gloss: slaapkamer
    note: De kamer waar je slaapt.
    example_gloss: Waar is de slaapkamer?
  pl.a1.unit18.lesson02.teach.lazienka:
    title: Badkamer
    gloss: badkamer
    note: De kamer met de douche en het toilet.
    example_gloss: Waar is de badkamer?
  pl.a1.unit18.lesson02.teach.gdzie_tam_recap:
    title: Waar, daar -- opnieuw
    gloss: Gdzie, tam -- je kent deze woorden al uit eerdere lessen, bijv. 'Bank jest tam' (de bank is daar).
    note: Een korte herinnering voordat deze les ze gebruikt om over kamers te praten.
  pl.a1.unit18.lesson02.teach.w_pokoje_locative_note:
    title: In de kamer, in de keuken...
    gloss: 'W + kamer, keuken, slaapkamer, badkamer: w pokoju, w kuchni, w sypialni, w łazience -- hetzelfde patroon als w szkole (op school) of w biurze (op kantoor).'
    note: Hetzelfde principe als bij de woorden voor werkplekken die je al kent -- de uitgang verandert een beetje om 'in' die kamer te zeggen.
  pl.a1.unit18.lesson02.teach.gdzie_jest_lazienka_phrase:
    title: Waar is de badkamer?
    gloss: Waar is de badkamer? De badkamer is daar.
    note: Een natuurlijke woordenwisseling om een kamer in iemands woning te vinden.
  pl.a1.unit18.lesson02.teach.kuchnia_jest_mala_phrase:
    title: De keuken is klein
    gloss: De keuken is klein.
    note: Hier gebruik je het woord voor grootte van eerder in deze les opnieuw.
  pl.a1.unit18.lesson03.teach.recap_words:
    title: Ja, en, zijn -- opnieuw
    gloss: Tak, i, są, A, ja, jeden -- je kent deze woorden al uit eerdere lessen.
    note: Een korte herinnering voor de dialoog van deze les.
  pl.a1.unit18.lesson03.teach.lodowka:
    title: Koelkast
    gloss: koelkast
    note: Een veelvoorkomend keukenapparaat.
    example_gloss: In de keuken staat een koelkast.
  pl.a1.unit18.lesson03.teach.piekarnik:
    title: Oven
    gloss: oven
    note: Nog een veelvoorkomend keukenapparaat.
    example_gloss: In de keuken staat een oven.
  pl.a1.unit18.lesson03.teach.dialogue.line01:
    title: Marek beschrijft zijn huis
    gloss: Ik heb een huis. Het huis is groot.
    note: Marek opent het gesprek met een beschrijving van zijn woning.
  pl.a1.unit18.lesson03.teach.dialogue.line02:
    title: Ewa vraagt naar de kamers
    gloss: Hoeveel kamers heb jij?
    note: Ewa stelt een logische vervolgvraag.
  pl.a1.unit18.lesson03.teach.dialogue.line03:
    title: Marek antwoordt
    gloss: Ik heb twee kamers. In het huis zijn een keuken, een slaapkamer en een badkamer.
    note: Marek noemt het aantal kamers en somt de kamers in zijn huis op.
  pl.a1.unit18.lesson03.teach.dialogue.line04:
    title: Ewa beschrijft haar woning
    gloss: En ik heb een appartement. Ik heb één kamer.
    note: Ewa gaat over op haar eigen, kleinere woning.
  pl.a1.unit18.lesson03.teach.dialogue.line05:
    title: Ewa vraagt naar de keuken
    gloss: Is de keuken klein?
    note: Ewa stelt Marek een vervolgvraag over zijn keuken.
  pl.a1.unit18.lesson03.teach.dialogue.line06:
    title: Marek antwoordt
    gloss: Ja, de keuken is klein. In de keuken staan een koelkast en een oven.
    note: Marek bevestigt dat de keuken klein is en noemt twee voorwerpen daarin.
