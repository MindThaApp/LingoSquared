answer_policy:
  diacritics: Display and teach all Polish diacritics (ą ć ę ł ń ó ś ź ż). In typed A1 answers, accept a variant with the diacritic dropped or swapped for its plain-letter equivalent (a/c/e/l/n/o/s/z/z) when every other letter and word is correct -- these are genuinely hard to type on a non-Polish keyboard and this is a beginner course, not a spelling test. Do not extend this tolerance to ł vs l at the START of a word where it changes which real word is meant (not a relevant case in this unit's vocabulary, but noted for future units). Punctuation marks (?, !) may be omitted in typed answers, but the fully punctuated form remains the model answer.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names (Anna, Marek, Kowalska, Wójcik) and in the place name Warszawie.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register (pan/pani vs ty) rather than written punctuation or diacritics.
course:
  title: Pools A1
  description: 'Pools voor beginners om vrijetijdsbesteding te beschrijven: woordenschat over hobby''s, frequentie-uitdrukkingen, vragen en antwoorden wat iemand in zijn vrije tijd doet en de hobby''s van twee mensen vergelijken.'
units:
  pl.a1.unit24.hobby:
    title: Hobby's en vrije tijd
lessons:
  pl.a1.unit24.lesson01.czytanie_sport_i_gotowanie:
    title: Lezen, sporten en koken
  pl.a1.unit24.lesson02.muzyka_rysowanie_i_gry:
    title: Muziek, tekenen en gamen
  pl.a1.unit24.lesson03.co_robisz_w_wolnym:
    title: Wat doe je in je vrije tijd?
  pl.a1.unit24.lesson04.ewa_i_marek_rozmawiaja:
    title: Ewa en Marek praten over hobby's
  pl.a1.unit24.lesson05.marek_i_ewa_porownuja:
    title: Marek en Ewa vergelijken hun hobby's
  pl.a1.unit24.lesson06.wspolne_planowanie_weekendu:
    title: Samen een weekend plannen
teaching:
  pl.a1.unit24.lesson01.teach.czytac_uprawiac_sport:
    title: Lezen, sporten, koken
    gloss: lezen, sporten, koken
    note: 'Drie veelvoorkomende hobbywerkwoorden: *czytać* (lezen), *uprawiać sport* (sporten) en *gotować* (koken).'
    example_gloss:
    - Ik lees graag een boek.
    - Ik sport op zaterdag.
    - Ik kook graag voor vrienden.
  pl.a1.unit24.lesson01.teach.wolny_czas:
    title: Vrije tijd
    gloss: vrije tijd
    note: '*Wolny czas* is de kernuitdrukking om over hobby''s te praten. Het bijvoeglijk naamwoord *wolny* (vrij) komt overeen met het mannelijke zelfstandig naamwoord *czas*; in *w wolnym czasie* staan beide in de locatief.'
    example_gloss: In mijn vrije tijd lees ik graag.
  pl.a1.unit24.lesson01.teach.w_wolnym_czasie:
    title: Zeggen wat je in je vrije tijd doet
    gloss: In mijn vrije tijd lees ik graag.
    note: 'Na *lubię* (ik hou van) volgt een infinitief: *lubię czytać*. *W wolnym czasie* gebruikt *w* + locatief.'
  pl.a1.unit24.lesson02.teach.sluchac_muzyki_rysowac:
    title: Muziek, tekenen, gamen
    gloss: naar muziek luisteren, tekenen, gamen
    note: 'Nog drie hobby''s: *słuchać muzyki* (naar muziek luisteren), *rysować* (tekenen) en *grać w gry* (games spelen).'
    example_gloss:
    - Ik luister graag naar muziek.
    - Ik teken vaak.
    - Ik game graag met vrienden.
  pl.a1.unit24.lesson02.teach.lubie_sluchac_muzyki:
    title: Zeggen dat je graag naar muziek luistert
    gloss: Ik luister graag naar muziek.
    note: '*Słuchać* neemt altijd de genitief: *słucham muzyki*, niet *muzyka*.'
  pl.a1.unit24.lesson02.teach.lubie_grac_w:
    title: Zeggen dat je graag met vrienden gamet
    gloss: Ik game graag met vrienden.
    note: '*Z przyjaciółmi* (met vrienden) gebruikt *z* + instrumentalis meervoud.'
  pl.a1.unit24.lesson03.teach.zawsze_czesto_czasami:
    title: Altijd, vaak, soms, nooit
    gloss: altijd, vaak, soms, nooit
    note: 'De vier belangrijkste frequentiebijwoorden: *zawsze*, *często*, *czasami*, *nigdy*. Ze veranderen nooit van vorm, en *nigdy* heeft *nie* voor het werkwoord nodig: *Nigdy nie gram.*'
    example_gloss:
    - Ik sport altijd op zaterdag.
    - Ik lees vaak een boek.
    - Ik teken soms.
    - Ik game nooit.
  pl.a1.unit24.lesson03.teach.co_tydzien_co:
    title: Elke week, elk weekend
    gloss: elke week, elk weekend
    note: '*Co tydzień* en *co weekend* betekenen allebei ''elke ...''; na *co* volgt de accusatief en het verandert nooit van vorm - zie de volgende kaart.'
    example_gloss:
    - Ik kook elke week voor vrienden.
    - Ik sport elk weekend.
  pl.a1.unit24.lesson03.teach.co_biernik_co:
    title: Co + accusatief
    gloss: '*Co* + accusatief betekent ''elke'': elke week, elk weekend, elke maand.'
    note: '*Co* is één vast woord voor ''elke'', ongeacht het zelfstandig naamwoord. Mannelijke levenloze woorden zoals *tydzień*, *weekend* en *miesiąc* zien er in de nominatief en de accusatief hetzelfde uit.'
  pl.a1.unit24.lesson03.teach.co_robisz_w:
    title: Vragen naar vrije tijd
    gloss: Wat doe je in je vrije tijd?
    note: 'Dit is de kernvraag van deze unit: gebruik hem om iedereen naar zijn of haar hobby''s te vragen.'
  pl.a1.unit24.lesson04.teach.ewa_czesto_razem:
    title: Ewa begint over hobby's
    gloss: 'Ewa: We wandelen vaak samen. Maar wat doe jij nog meer in je vrije tijd, Marek?'
    note: '*Spacerujemy* is de *my*-vorm (wij) van *spacerować*; *Marku* is de vocatief, die je gebruikt als je iemand rechtstreeks aanspreekt.'
  pl.a1.unit24.lesson04.teach.marek_lubie_gotowac:
    title: Mareks hobby's
    gloss: 'Marek: Ik kook graag, ook thuis. En ik sport vaak.'
    note: '*Także w domu* (ook thuis) laat zien dat Marek voor zijn plezier kookt, niet alleen in zijn baan in het restaurant; *w domu* is de locatief.'
  pl.a1.unit24.lesson04.teach.ewa_gotujesz_tez:
    title: Ewa is verrast
    gloss: 'Ewa: Kook je ook thuis? Je kookt toch al de hele dag op je werk!'
    note: '*Cały dzień* (de hele dag) benadrukt hoeveel Marek al op zijn werk kookt; *przecież* voegt ''maar je kookt toch al'' toe.'
  pl.a1.unit24.lesson04.teach.marek_tak_ale:
    title: Marek legt uit
    gloss: 'Marek: Ja, maar koken ontspant me. En jij, wat doe jij graag?'
    note: '*Gotowanie mnie odpręża* is letterlijk ''koken ontspant mij'': in het Pools wordt de activiteit vaak het onderwerp en staat *mnie* (mij) in de accusatief.'
  pl.a1.unit24.lesson04.teach.ewa_lubie_czytac:
    title: Ewa's hobby's
    gloss: 'Ewa: Ik lees graag en luister vaak naar muziek.'
    note: Twee hobbywerkwoorden uit les 1 en 2 gecombineerd in één zin met *i* (en).
  pl.a1.unit24.lesson04.teach.marek_grasz_tez:
    title: Marek vraagt naar gamen
    gloss: 'Marek: Game jij ook?'
    note: Een korte ja/nee-vraag met *grać w gry* uit les 2; *też* betekent 'ook'.
  pl.a1.unit24.lesson04.teach.ewa_nie_nigdy:
    title: Ewa antwoordt
    gloss: 'Ewa: Nee, ik game nooit. Maar soms teken ik!'
    note: '*Nigdy* (nooit) en *czasami* (soms) uit les 3, tegenover elkaar gezet in één antwoord. Let op de dubbele ontkenning: *nigdy nie gram*.'
  pl.a1.unit24.lesson05.teach.marek_i_ja:
    title: Hobby's vergelijken
    gloss: Marek en ik wandelen vaak samen. Maar we hebben ook andere hobby's. Marek kookt graag, ook thuis, en sport vaak. Ik lees graag en luister vaak naar muziek. Soms teken ik, maar ik game nooit. Wat doe jij graag in je vrije tijd?
    note: Ewa's bericht vat de feiten uit les 4 samen en eindigt met de kernvraag van deze eenheid aan de lezer.
    glosses:
      spacerujemy: wandelen
      często: vaak
      razem: samen
      inne: andere
      gotować: kookt
      lubi: graag
      domu: thuis
      uprawia: sport
      czytać: lees
      słucham: luister
      muzyki: muziek
      rysuję: teken
      czasami: soms
      gram: videogames spelen
      nigdy: nooit
      wolnym: vrij
      czasie: tijd
  pl.a1.unit24.lesson06.teach.marek_co_robisz:
    title: Marek vraagt naar het weekend
    gloss: 'Marek: Wat ga jij dit weekend doen?'
    note: '*W ten weekend* (dit weekend) gebruikt *w* + accusatief voor een tijdsaanduiding.'
  pl.a1.unit24.lesson06.teach.ewa_jeszcze_nie:
    title: Ewa weet het nog niet
    gloss: 'Ewa: Ik weet het nog niet. Ik lees graag, maar ik wil ook naar buiten.'
    note: '*Wyjść na dwór* (naar buiten gaan) is een gebruikelijke manier om te zeggen dat je het huis uit wilt; *chcę* + infinitief betekent ''ik wil''.'
  pl.a1.unit24.lesson06.teach.marek_pojdziemy_razem:
    title: Marek doet een voorstel
    gloss: 'Marek: Zullen we samen gaan wandelen? Daarna kook ik iets voor ons.'
    note: '*Potem* (daarna) is het volgordewoord; *ugotuję* is voltooid, omdat het koken een afgerond resultaat is.'
  pl.a1.unit24.lesson06.teach.ewa_dobry_pomysl:
    title: Ewa gaat akkoord
    gloss: 'Ewa: Goed idee! Ik vind wandelen én koken leuk.'
    note: '*Lubię i ..., i ...* (''zowel ... als ...'') laat zien dat Ewa twee dingen even leuk vindt, niet het één meer dan het ander.'
  pl.a1.unit24.lesson06.teach.marek_swietnie_to:
    title: Marek bevestigt
    gloss: 'Marek: Top. Dan zien we elkaar zaterdag!'
    note: Een vriendelijke slotzin die het plan voor zaterdag bevestigt; *w sobotę* is *w* + accusatief bij een dag van de week.
