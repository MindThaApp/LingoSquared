teaching:
  pl.a1.unit26.lesson01.teach.zwierze_zwierzak:
    title: Dier, een huisdier
    gloss: het dier / een huisdier
    note: '*Zwierzę* is het algemene woord voor dier; *zwierzak* is het alledaagse woord voor een huisdier.'
    example_gloss:
    - Een hond is een dier.
    - Een hond is ook een huisdier.
  pl.a1.unit26.lesson01.teach.pies_kot:
    title: Hond en kat
    gloss: de hond / de kat
    example_gloss:
    - Ewa heeft een hond.
    - Tomek heeft een kat.
  pl.a1.unit26.lesson01.teach.ryba_ptak:
    title: Vis en vogel
    gloss: de vis / de vogel
    example_gloss:
    - Opa heeft een vis.
    - Nina heeft een vogel.
  pl.a1.unit26.lesson01.teach.masz_zwierzaka:
    title: Heb jij een huisdier?
    gloss: Heb jij een huisdier?
    note: Hetzelfde vraagpatroon *Masz ...?* dat je al uit eerdere units kent; *masz* is de *ty*-vorm van *mieć*.
  pl.a1.unit26.lesson01.teach.tak_mam_psa:
    title: Ja, ik heb een hond
    gloss: Ja, ik heb een hond.
    note: Een eenvoudig bevestigend antwoord met de nieuwe woorden uit deze les.
  pl.a1.unit26.lesson01.teach.nie_nie_mam:
    title: Nee, ik heb geen huisdier
    gloss: Nee, ik heb geen huisdier.
    note: '*Nie mam* + genitief ontkent datgene wat je niet hebt: *zwierzaka*. Zie de grammaticanotitie.'
  pl.a1.unit26.lesson01.teach.nie_mam_czasu:
    title: Nie mam + genitief
    gloss: 'Na *nie mam* staat het object in de genitief: *Nie mam czasu* (ik heb geen tijd) en hier *Nie mam zwierzaka* (ik heb geen huisdier).'
    note: Dit hergebruikt het patroon van *Nie mam czasu*; alleen het zelfstandig naamwoord is nieuw. Mannelijke levende zelfstandige naamwoorden zoals *zwierzak* zien er in de accusatief en de genitief hetzelfde uit, terwijl vrouwelijke woorden wel veranderen (*Mam rybę* wordt *Nie mam ryby*).
  pl.a1.unit26.lesson02.teach.wyprowadzac_na_spacer:
    title: Een dier uitlaten
    gloss: uitlaten (een dier)
    note: '*Wyprowadzać na spacer* is de vaste uitdrukking voor een dier uitlaten; het werkwoord is imperfectief, omdat het een gewoonte is. Zie de grammaticanotitie.'
    example_gloss: Ik laat de hond elke dag uit.
  pl.a1.unit26.lesson02.teach.codziennie_wyprowadzam_psa:
    title: Imperfectief voor gewoonten
    gloss: '*Wyprowadzać* (imperfectief) beschrijft een gewoonte: *Codziennie wyprowadzam psa.* Het perfectieve *wyprowadzić* gebruik je voor één afgeronde wandeling.'
    note: 'Aspectparen: het imperfectieve werkwoord (*wyprowadzać*) gebruik je voor iets wat zich herhaalt, het perfectieve (*wyprowadzić*) voor één afgeronde handeling.'
  pl.a1.unit26.lesson02.teach.karmic:
    title: Voeren
    gloss: voeren
    example_gloss: Ik geef de kat elke dag te eten.
  pl.a1.unit26.lesson02.teach.bawic_sie_z:
    title: Spelen met
    gloss: spelen met
    example_gloss: Tomek speelt met zijn kat.
  pl.a1.unit26.lesson02.teach.codziennie_wyprowadzam_psa_2:
    title: Ik laat de hond elke dag uit
    gloss: Ik laat de hond elke dag uit.
    note: Combineert *wyprowadzać na spacer* met *codziennie* (elke dag); het object *psa* staat in de accusatief.
  pl.a1.unit26.lesson02.teach.codziennie_karmie_kota:
    title: Ik geef de kat elke dag te eten
    gloss: Ik geef de kat elke dag te eten.
    note: '*Karmić* (voeren) krijgt de accusatief van het dier: *karmię kota*. Hier gecombineerd met *codziennie*.'
  pl.a1.unit26.lesson03.teach.liczba_mnoga_pies:
    title: 'Meervoud: pies, psy'
    gloss: 'Meervoud: *pies* wordt *psy*, *kot* wordt *koty*, *ryba* wordt *ryby*, *ptak* wordt *ptaki*. De meeste meervouden eindigen op *-y*, of op *-i* na k en g.'
    note: Het regelmatige Poolse meervoudspatroon, hier voor het eerst geïntroduceerd met dierennamen als voorbeeld.
  pl.a1.unit26.lesson03.teach.psy_koty:
    title: Honden en katten
    gloss: honden / katten
    example_gloss:
    - Marek houdt van honden.
    - Kasia houdt van katten.
  pl.a1.unit26.lesson03.teach.ryby_ptaki:
    title: Vissen en vogels (meervoud)
    gloss: vissen / vogels
    example_gloss:
    - Ik hou van vissen.
    - Opa houdt van vogels.
  pl.a1.unit26.lesson03.teach.kocham_zwierzeta:
    title: Ik hou van dieren
    gloss: Ik hou van dieren.
    note: '*Kocham* is de *ja*-vorm van *kochać*; het object *zwierzęta* staat in de accusatief meervoud.'
  pl.a1.unit26.lesson03.teach.kasia_kocha_koty:
    title: Kasia houdt van katten, maar heeft geen huisdier
    gloss: Kasia houdt van katten, maar ze heeft geen huisdier.
    note: Bereidt het contrast voor waar de leestekst van deze les om draait.
  pl.a1.unit26.lesson04.teach.marek_masz_zwierzaka:
    title: Marek vraagt naar een huisdier
    gloss: 'Marek: Heb je een huisdier, Ewa?'
  pl.a1.unit26.lesson04.teach.ewa_tak_mam:
    title: Ewa heeft een hond
    gloss: 'Ewa: Ja, ik heb een hond.'
  pl.a1.unit26.lesson04.teach.marek_jak_on:
    title: Marek vraagt hoe hij eruitziet
    gloss: 'Marek: Hoe ziet hij eruit?'
    note: Hergebruikt de vraag *Jak wygląda ...?* uit een eerdere les, nu gesteld over een dier; *on* kan naar een hond verwijzen.
  pl.a1.unit26.lesson04.teach.ewa_ma_brazowa:
    title: Ewa beschrijft haar hond
    gloss: 'Ewa: Hij heeft een bruine vacht en is klein.'
    note: Hier komen de woorden voor haarkleur en grootte uit de les over uiterlijk terug, nu om de vacht van een dier te beschrijven in plaats van het haar van een persoon.
  pl.a1.unit26.lesson04.teach.zwierzeta_maja_rodzaj:
    title: On en ona voor dieren
    gloss: 'Dieren hebben een grammaticaal geslacht: *on* (hij) voor *pies* en *kot*, *ona* (zij) voor *ryba*. Deze voornaamwoorden kunnen naar een dier verwijzen, niet alleen naar een persoon.'
    note: 'Het voornaamwoord volgt het geslacht van het zelfstandig naamwoord: *pies* en *ptak* krijgen *on*, *ryba* krijgt *ona* en *zwierzę* krijgt *ono*.'
  pl.a1.unit26.lesson04.teach.marek_codziennie_wyprowadzasz:
    title: Marek vraagt naar de wandelingen
    gloss: 'Marek: Ga je elke dag met hem wandelen?'
  pl.a1.unit26.lesson04.teach.ewa_tak_codziennie:
    title: Ewa vertelt over haar routine
    gloss: 'Ewa: Ja, ik ga elke dag met hem wandelen en ik geef hem te eten.'
  pl.a1.unit26.lesson05.teach.marek_i_kasia:
    title: Marek, Kasia en Tomek over dieren
    gloss: 'Marek en Kasia houden allebei van dieren, maar geen van beiden heeft een huisdier. Marek houdt van honden en Kasia houdt van katten. Tomek heeft wel een huisdier: een kat. Hij speelt vaak met zijn kat en geeft hem elke dag te eten. Heb jij een huisdier?'
    note: 'Zet van dieren houden tegenover er echt een hebben: dat is het communicatieve doel van deze les.'
    glosses:
      kochają: houden van
      oboje: beide
      zwierzęta: dieren
      zwierzaka: huisdier
      psy: honden
      koty: katten
      kota: kat
      bawi: speelt
      daje: geeft
      co: elke
      jeść: voer
  pl.a1.unit26.lesson05.teach.tomek_czesto_bawi:
    title: Tomek speelt vaak met zijn kat
    gloss: Tomek speelt vaak met zijn kat.
    note: '*Bawić się z* (spelen met) krijgt de instrumentalis: *z kotem*. *Często* is het frequentiebijwoord voor ''vaak''.'
  pl.a1.unit26.lesson05.teach.kocham_psy_nie:
    title: Ik hou van honden. Ik heb geen huisdier.
    gloss: Ik hou van honden. Ik heb geen huisdier.
    note: Een voorbeeldantwoord van twee zinnen, dat je kunt hergebruiken voor de schrijfopdracht van deze les.
  pl.a1.unit26.lesson06.teach.ewa_nino_ty:
    title: Ewa vraagt het aan Nina
    gloss: 'Ewa: Nina, heb jij ook een huisdier?'
  pl.a1.unit26.lesson06.teach.nina_tak_mam:
    title: Nina heeft een vogel die Pico heet
    gloss: 'Nina: Ja, ik heb een vogel. Hij heet Pico.'
    note: '*Ma na imię* (heet) is dezelfde uitdrukking die je eerder gebruikte om een naam te noemen.'
  pl.a1.unit26.lesson06.teach.marek_jak_milo:
    title: Marek reageert
    gloss: 'Marek: Wat leuk! Wat doe je elke dag met hem?'
  pl.a1.unit26.lesson06.teach.nina_codziennie_go:
    title: Nina geeft hem elke dag te eten
    gloss: 'Nina: Ik geef hem elke dag te eten.'
  pl.a1.unit26.lesson06.teach.marek_ja_tez:
    title: Marek houdt ook van vogels
    gloss: 'Marek: Ik ben ook dol op vogels.'
  pl.a1.unit26.lesson06.teach.ewa_fajnie_ze:
    title: Ewa rondt het gesprek af
    gloss: 'Ewa: Fijn dat we alle drie van dieren houden!'
    note: Rondt het gesprek af met wat alle drie de personages in deze les over dieren hebben verteld.
