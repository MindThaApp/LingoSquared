teaching:
  pl.a1.unit05.lesson01.teach.rodzina:
    title: Familie
    gloss: familie
    note: 'Het algemene woord voor familie: je gebruikt het voor het hele gezin, niet voor één enkele verwantschap.'
    example_gloss: Dit is mijn familie.
  pl.a1.unit05.lesson01.teach.matka_ojciec:
    title: Moeder, vader
    gloss: moeder; vader
    note: De twee belangrijkste woorden voor ouders. In de spreektaal hoor je ook de koosvormen mama en tata, maar matka en ojciec zijn de neutrale standaardvormen die je hier leert.
    example_gloss:
    - Dit is mijn moeder.
    - Dit is mijn vader.
  pl.a1.unit05.lesson01.teach.brat_siostra:
    title: Broer, zus
    gloss: broer; zus
    note: Beide zijn gewone zelfstandige naamwoorden. Brat is mannelijk en siostra is vrouwelijk, en dat is belangrijk voor de overeenkomst van mój/moja in de grammaticanotitie van deze les.
    example_gloss:
    - Dit is mijn broer.
    - Dit is mijn zus.
  pl.a1.unit05.lesson01.teach.rodzice:
    title: Ouders
    gloss: ouders
    note: Rodzice is een mannelijk-persoonlijk meervoud. Het heeft een eigen bezittelijke vorm, moi (niet mój/moja), die je in het voorbeeld en de grammaticanotitie van deze les ziet.
    example_gloss: Mijn ouders wonen in Warschau.
  pl.a1.unit05.lesson01.teach.moj_moja_note:
    title: 'Mijn: mój, moja of moi'
    gloss: mijn vader, mijn broer -- mijn moeder, mijn zus -- mijn ouders.
    note: 'Poolse bezittelijke voornaamwoorden passen zich aan het geslacht van het zelfstandig naamwoord aan: *mój* voor een mannelijk woord (*mój ojciec*, *mój brat*), *moja* voor een vrouwelijk woord (*moja matka*, *moja siostra*) en de aparte onregelmatige vorm *moi* specifiek voor het mannelijk-persoonlijke meervoud *rodzice*.'
  pl.a1.unit05.lesson01.teach.to_jest_moj_ojciec:
    title: Dit is mijn vader
    gloss: Dit is mijn vader.
    note: '*To jest* (dit is) blijft hetzelfde, ongeacht het geslacht van het zelfstandig naamwoord. Alleen het bezittelijk voornaamwoord mój/moja verandert.'
  pl.a1.unit05.lesson02.teach.dziadek_babcia:
    title: Opa, oma
    gloss: opa; oma
    note: De gewone, alledaagse woorden voor opa en oma, gebruikt door kinderen en volwassenen.
    example_gloss:
    - Dit is mijn opa.
    - Dit is mijn oma.
  pl.a1.unit05.lesson02.teach.wujek_ciotka:
    title: Oom, tante
    gloss: oom; tante
    note: Wordt gebruikt voor de broer of zus van een ouder, maar ook voor de partner van een oom of tante, net als in het Nederlands bij "oom" en "tante".
    example_gloss:
    - Dit is mijn oom.
    - Dit is mijn tante.
  pl.a1.unit05.lesson02.teach.syn_corka:
    title: Zoon, dochter
    gloss: zoon; dochter
    note: 'De voorbeelden tonen de accusatief die je na *mieć* (hebben) nodig hebt: *syn* wordt *syna*, *córka* wordt *córkę*. De grammaticanotities hierna leggen uit waarom de uitgang verandert.'
    example_gloss:
    - Ik heb een zoon.
    - Ik heb een dochter.
  pl.a1.unit05.lesson02.teach.miec_note:
    title: 'Hebben: mam, masz, ma'
    gloss: 'hebben: ik heb, jij hebt, hij/zij heeft -- ik heb een broer, jij hebt een zus, hij/zij heeft een zoon.'
    note: '*Mieć* is het werkwoord "hebben". *Mam* (ik heb) en *ma* (hij/zij heeft) zijn de belangrijkste nieuwe vormen van deze les. *Masz* (jij hebt) ken je al van het vragen naar iemands leeftijd in unit 2.'
  pl.a1.unit05.lesson02.teach.accusative_note:
    title: Zeggen wat je hebt
    gloss: 'Na ''hebben'' verandert de uitgang van het zelfstandig naamwoord: brat -> brata, siostra -> siostrę, syn -> syna, córka -> córkę.'
    note: 'Dit is de accusatief: de vorm van een zelfstandig naamwoord als direct object van een werkwoord als *mieć*. Mannelijke woorden voor personen (en dieren), zoals *brat* en *syn*, krijgen *-a*; vrouwelijke woorden zoals *siostra* en *córka* krijgen *-ę* in plaats van de slot-*a*.'
  pl.a1.unit05.lesson02.teach.mam_brata_siostre:
    title: Ik heb een broer en een zus
    gloss: Ik heb een broer en een zus.
    note: Hier pas je de accusatiefuitgangen uit de grammaticanotitie toe in een volledige zin, plus het nieuwe verbindingswoord *i* (en).
  pl.a1.unit05.lesson03.teach.lub:
    title: Of
    gloss: of
    note: Wordt net als Nederlands "of" gebruikt in een ja/nee-vraag met twee keuzes.
    example_gloss: Heb jij een broer of een zus?
  pl.a1.unit05.lesson03.teach.tylko:
    title: Alleen
    gloss: alleen
    note: Staat vlak voor het woord dat het beperkt, net als "alleen" of "maar" in het Nederlands.
    example_gloss: Ik heb alleen een zus.
  pl.a1.unit05.lesson03.teach.gdzie:
    title: Waar
    gloss: waar
    note: Een basisvraagwoord. Het past mooi bij mieszkać (wonen), zoals in de dialoog van deze les.
    example_gloss: Waar woont jouw broer?
  pl.a1.unit05.lesson03.teach.on_ona_mieszka_note:
    title: Hij, zij -- en 'wonen'
    gloss: 'hij, zij = hij, zij -- wonen: ik woon, hij/zij woont. Hij woont in Gdańsk. Zij woont in Kraków.'
    note: '*On* (hij) en *ona* (zij) zijn persoonlijke voornaamwoorden van de derde persoon. *Mieszkać* (wonen) volgt hetzelfde patroon voor de 1e en 3e persoon als *mieć*: *mieszkam* (ik woon, uit *Mieszkam w Warszawie* in unit 1) en *mieszka* (hij/zij woont). Na *w* krijgen plaatsnamen de locatief: *Gdańsk* wordt *w Gdańsku*, *Kraków* wordt *w Krakowie*, hetzelfde patroon als *Mieszkam w Warszawie* in unit 1.'
  pl.a1.unit05.lesson03.teach.dialogue.line01:
    title: Marek vraagt naar broers en zussen
    gloss: Marek vraagt Ewa of ze een broer of een zus heeft.
    note: Een ja/nee-vraag met *Czy*, hetzelfde vraagwoord als in unit 1. Ewa en Marek kennen elkaar nu goed, dus ze zijn van de formele *pan*/*pani* overgestapt op het informele *ty* (*masz*, *A ty?*, *twój*).
  pl.a1.unit05.lesson03.teach.dialogue.line02:
    title: Ewa antwoordt en vraagt terug
    gloss: Ewa zegt dat ze een broer en een zus heeft en stelt Marek dan dezelfde vraag terug.
    note: '*A ty?* ("En jij?") is een beknopte, natuurlijke manier om een vraag terug te kaatsen naar degene die hem stelde.'
  pl.a1.unit05.lesson03.teach.dialogue.line03:
    title: Marek antwoordt
    gloss: Marek zegt dat hij alleen een zus heeft, die in Kraków woont, en vraagt dan naar Ewa's broer.
    note: Marek heeft geen broer, alleen *tylko siostrę* (alleen een zus). Hij kan gerust naar Ewa's broer vragen, want Ewa heeft al gezegd dat ze er een heeft.
  pl.a1.unit05.lesson03.teach.dialogue.line04:
    title: Ewa antwoordt
    gloss: Ewa zegt dat haar broer in Gdańsk woont en een zoon en een dochter heeft.
    note: Hergebruikt het accusatiefpatroon van syn/córka uit les 2 van deze unit.
  pl.a1.unit05.lesson03.teach.dialogue.line05:
    title: Marek reageert
    gloss: 'Marek zegt: wat een leuke familie!'
    note: '*Fajna* is een informeel, alledaags woord voor "leuk"/"gaaf". Het is een natuurlijke afsluitende reactie, in hetzelfde register als *Świetnie!* uit unit 4.'
