    title: De constructie Poproszę
    gloss: '*Poproszę* + kleur zegt welke kleur je kiest: *Poproszę różowe.* De kleur eindigt op *-e*, omdat tulpen meervoud zijn.'
    note: '*Poproszę* (''ik wil graag'') is een handige manier om iets te bestellen of te kiezen. Kleuren zijn bijvoeglijke naamwoorden en congrueren met het zelfstandig naamwoord: *tulipany* is meervoud, dus de uitgang is *-e* (*różowe*, *czerwone*). Op zichzelf staat de kleurnaam in het mannelijk enkelvoud (*różowy*), omdat hij congrueert met *kolor*.'
