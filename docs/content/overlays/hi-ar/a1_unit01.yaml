  ar.a1.unit01.lesson01.teach.marhaba_shape:
    title: مرحبا बनाइए
    gloss: नमस्ते
    note: مرحبا को marḥaban पढ़ा जाता है। अरबी लेखन में छोटे स्वर सामान्यतः नहीं लिखे जाते।
    example_gloss: नमस्ते! मैं सारा हूँ।
  ar.a1.unit01.lesson02.teach.marhaba:
    title: नमस्ते
    gloss: नमस्ते
    note: مرحبا एक आत्मीय, हर मौके का अभिवादन है, जो लगभग किसी भी स्थिति में उपयुक्त है।
    example_gloss: हेलो, तुम कैसे हो?
  ar.a1.unit01.lesson02.teach.sabah_alkhayr:
    title: सुप्रभात
    gloss: सुप्रभात
    note: صباح الخير को ṣabāḥ al-khayr पढ़ा जाता है; शाब्दिक अर्थ है 'भलाई की सुबह'।
  ar.a1.unit01.lesson02.teach.masaa_alkhayr:
    title: शुभ दोपहर या शुभ संध्या
    gloss: शुभ अपराह्न / शुभ संध्या
    note: مساء الخير को masāʾ al-khayr पढ़ा जाता है और इसका प्रयोग देर दोपहर से शाम तक होता है।
  ar.a1.unit01.lesson02.teach.maa_alsalama:
    title: अलविदा
    gloss: अलविदा
    note: مع السلامة को maʿa as-salāma पढ़ा जाता है; शाब्दिक अर्थ 'सलामती के साथ' है। यह विदा लेने का आम, मानक तरीका है।
    example_gloss: शुक्रिया, अलविदा!
  ar.a1.unit01.lesson02.teach.shukran:
    title: धन्यवाद
    gloss: धन्यवाद
    note: شكرا को shukran पढ़ा जाता है और यह हर तरह की बातचीत में चलता है।
    example_gloss: बहुत-बहुत धन्यवाद।
  ar.a1.unit01.lesson02.teach.afwan:
    title: आपका स्वागत है
    gloss: आपका स्वागत है
    note: عفوا (ʿafwan) شكرا का प्रचलित उत्तर है; दूसरे संदर्भ में इसका अर्थ 'माफ़ कीजिए' भी हो सकता है।
  ar.a1.unit01.lesson03.teach.tusbih_ala_khayr:
    title: शुभ रात्रि
    gloss: शुभ रात्रि
    note: تصبح على خير (tuṣbiḥ ʿalā khayr) रात को विदा लेते समय या सोने जाते समय कहा जाता है, मुलाक़ात की शुरुआत में नहीं। تصبح पुरुष से कहा जाने वाला रूप है; महिला से تصبحين على خير (tuṣbiḥīna ʿalā khayr) कहा जाता है।
  ar.a1.unit01.lesson03.teach.ahlan_wa_sahlan:
    title: स्वागत है
    gloss: स्वागत है
    note: أهلا وسهلا (ahlan wa sahlan) से मेहमान का स्वागत किया जाता है या आने पर किसी का गर्मजोशी से अभिवादन किया जाता है।
    example_gloss: स्वागत है! आपका स्वागत है।
  ar.a1.unit01.lesson03.teach.ila_alliqaa:
    title: फिर मिलेंगे
    gloss: फिर मिलेंगे / मिलने तक
    note: إلى اللقاء (ilā al-liqāʾ) विदा लेने का शिष्ट और सामान्य तरीका है।
  ar.a1.unit01.lesson03.teach.sabah_alnoor:
    title: सुप्रभात का उत्तर
    gloss: सुप्रभात [उत्तर]
    note: صباح النور (ṣabāḥ an-nūr, 'रोशनी की सुबह') صباح الخير का प्रचलित उत्तर है।
  ar.a1.unit01.lesson03.teach.masaa_alnoor:
    title: शुभ संध्या का उत्तर
    gloss: शुभ संध्या [उत्तर]
    note: مساء النور (masāʾ an-nūr) مساء الخير का प्रचलित उत्तर है।
  ar.a1.unit01.lesson03.teach.yawman_saeedan:
    title: आपका दिन शुभ हो
    gloss: आपका दिन शुभ हो
    note: يوما سعيدا (yawman saʿīdan) विदा के समय कही जाने वाली आत्मीय शुभकामना है।
  ar.a1.unit01.lesson04.teach.kayfa_haluk:
    title: आप कैसे हैं?
    gloss: आप कैसे हैं?
    note: كيف حالك؟ (kayfa ḥāluk) किसी का हालचाल पूछने का मानक तरीका है; बिना स्वर-चिह्नों के यह लिखित रूप किसी भी श्रोता के लिए चलता है।
  ar.a1.unit01.lesson04.teach.gender_note:
    title: पुल्लिंग और स्त्रीलिंग 'आप'
    gloss: आप (पु.) / आप (स्त्री.)
    note: बोली जाने वाली अरबी में أنتَ (anta, पुरुष से) और أنتِ (anti, महिला से) में फ़र्क़ किया जाता है; इसी तरह حالَك और حالِك में भी। यहाँ दिखाए गए स्वर-चिह्नों के बिना, इस कोर्स में प्रयुक्त लिखित रूप दोनों के लिए एक जैसे हैं।
  ar.a1.unit01.lesson04.teach.bikhayr:
    title: ठीक / अच्छा
    gloss: ठीक / अच्छा
    note: بخير (bikhayr) كيف حالك؟ का मानक सकारात्मक उत्तर है।
    example_gloss: मैं आज ठीक हूँ।
  ar.a1.unit01.lesson04.teach.alhamdulillah:
    title: ईश्वर का शुक्र है
    gloss: शुक्र है ईश्वर का / अल्लाह का शुक्र है
    note: الحمد لله (al-ḥamdu lillāh) उत्तर में अक्सर بخير के बाद आता है, चाहे बोलने वाला धार्मिक हो या न हो; यह बातचीत के सामान्य समापन की तरह काम करता है, कुछ-कुछ हिंदी के 'शुक्र है' की तरह।
    example_gloss: ठीक हूँ, शुक्र है।
  ar.a1.unit01.lesson04.teach.wa_anta:
    title: और आप?
    gloss: और आप?
    note: وأنت؟ (पुरुष से wa anta, महिला से wa anti) वही सवाल लौटाता है; बिना स्वर-चिह्नों की वर्तनी दोनों के लिए एक ही है।
  ar.a1.unit01.lesson04.teach.mumtaz:
    title: बहुत बढ़िया
    gloss: बहुत बढ़िया / शानदार
    note: ممتاز (mumtāz) بخير से ज़्यादा उत्साह भरा उत्तर है।
    example_gloss: मैं आज बहुत बढ़िया हूँ!
  ar.a1.unit01.lesson04.teach.la_bas:
    title: बुरा नहीं
    gloss: बुरा नहीं
    note: لا بأس (lā baʾs) एक स्वाभाविक, मध्यम उत्तर है, शिकायत नहीं।
