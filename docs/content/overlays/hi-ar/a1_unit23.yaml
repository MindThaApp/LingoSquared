    note: من فضلك अनुरोध को विनम्र बनाता है; लैला تكلم कहती है क्योंकि वह एक पुरुष से बात कर रही है।
    example_gloss: 'लैला ने कहा: कृपया धीरे बोलो।'
  ar.a1.unit23.lesson02.teach.line04:
