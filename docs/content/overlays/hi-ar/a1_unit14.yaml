    gloss: मैं ज़्यादा पसंद करता/करती हूँ
    note: 'أفضل (ufaḍḍilu) का अर्थ है "मुझे ज़्यादा पसंद है": आप एक विकल्प को दूसरे से ऊपर चुनते हैं।'
    example_gloss: मुझे कॉफ़ी ज़्यादा पसंद है।
  ar.a1.unit14.lesson02.teach.what_prefer:
    title: आपको क्या ज़्यादा पसंद है?
    gloss: तुम्हें क्या ज़्यादा पसंद है?
    note: यहाँ تفضل का रूप tufaḍḍil है, यानी "तुम्हें ज़्यादा पसंद है", जो पुरुष से कहा जाता है; स्त्री से कहने पर यह تفضلين (tufaḍḍilīn) होता है। यह भोजन वाली इकाई के تفضل (tafaḍḍal, "लीजिए") से अलग शब्द है, हालाँकि लिखने में एक जैसा है।
    example_gloss: 'नूर ने कहा: यूसुफ़, तुम्हें क्या ज़्यादा पसंद है?'
  ar.a1.unit14.lesson02.teach.line01:
    title: नूर पूछती है
    gloss: नूर यूसुफ़ से पूछती है कि उसे क्या ज़्यादा पसंद है।
    note: 'नूर यूसुफ़ की बहन है। वह تفضل कहती है क्योंकि वह एक पुरुष से पूछ रही है; स्त्री से पूछना हो तो: ماذا تفضلين؟'
    example_gloss: 'नूर ने कहा: यूसुफ़, तुम्हें क्या ज़्यादा पसंद है?'
  ar.a1.unit14.lesson02.teach.line02:
    title: यूसुफ़ को कॉफ़ी ज़्यादा पसंद है
    gloss: यूसुफ़ कहता है कि उसे कॉफ़ी ज़्यादा पसंद है।
    note: أفضل एक विकल्प को दूसरों से ऊपर चुनता है; أحب बस इतना कहता है कि आपको कोई चीज़ पसंद है।
    example_gloss: 'यूसुफ़ ने कहा: मुझे कॉफ़ी ज़्यादा पसंद है।'
  ar.a1.unit14.lesson02.teach.line03:
    title: यूसुफ़ को चाय पसंद नहीं
    gloss: यूसुफ़ कहता है कि उसे चाय पसंद नहीं है।
    note: لا أحب सीधे-सीधे नापसंद ज़ाहिर करता है।
    example_gloss: 'यूसुफ़ ने कहा: मुझे चाय पसंद नहीं है।'
  ar.a1.unit14.lesson02.teach.line04:
    title: नूर को पानी पसंद है
    gloss: नूर कहती है कि उसे पानी पसंद है।
    note: ज़ोर देने के लिए أنا जोड़ा जा सकता है।
