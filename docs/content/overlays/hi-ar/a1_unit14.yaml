teaching:
  ar.a1.unit14.lesson01.teach.like:
    title: मुझे पसंद है
    gloss: मुझे पसंद है
    note: أحب (uḥibbu) का अर्थ है "मुझे पसंद है"। अरबी में सामान्य रूप से किसी चीज़ के लिए ال («the») लगता है, इसलिए "मुझे कॉफ़ी पसंद है" है أحب القهوة, शाब्दिक रूप से "मुझे वह कॉफ़ी पसंद है"।
    example_gloss: मुझे कॉफ़ी पसंद है।
  ar.a1.unit14.lesson01.teach.tea:
    title: चाय
    gloss: चाय
    note: شاي (shāy) का अर्थ है "चाय"; الشاي (ash-shāy) में ال जुड़ा है, जैसा अरबी में चाय के बारे में सामान्य रूप से बात करते समय होता है।
    example_gloss: मुझे चाय पसंद नहीं है।
  ar.a1.unit14.lesson01.teach.dislike:
    title: मुझे पसंद नहीं है
    gloss: मुझे पसंद नहीं है
    note: हिंदी में "नहीं" क्रिया के बाद आता है ("पसंद नहीं है"), जबकि अरबी में निषेध का لا क्रिया أحب से पहले आता है।
    example_gloss: मुझे चाय पसंद नहीं है।
  ar.a1.unit14.lesson01.teach.water:
    title: पानी
    gloss: पानी
    note: الماء (al-māʾ) वही ماء (पानी, भोजन वाली इकाई से) है, जिसमें ال लगा है; यह सामान्य रूप से पानी के लिए प्रयोग होता है।
    example_gloss: मुझे पानी पसंद है।
  ar.a1.unit14.lesson01.teach.and_not:
    title: और नहीं
    gloss: और नहीं
    note: 'ولا (wa-lā) में و (और) और لا (नहीं) जुड़े हैं: यह किसी पसंद के बाद नापसंद जोड़ता है।'
    example_gloss: मुझे कॉफ़ी पसंद है और चाय पसंद नहीं है।
  ar.a1.unit14.lesson02.teach.prefer:
