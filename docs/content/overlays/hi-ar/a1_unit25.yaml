teaching:
  ar.a1.unit25.lesson01.teach.alqraaa_mmarsa_alryada:
    title: पढ़ना, कसरत करना, खाना बनाना
    gloss: पढ़ना, कसरत/खेलकूद करना, खाना पकाना
    note: القراءة (al-qirāʾa) यानी पढ़ना, ممارسة الرياضة (mumārasat ar-riyāḍa) यानी खेल-कसरत करना और الطبخ (aṭ-ṭabkh) यानी खाना बनाना। ये सब संज्ञाएँ हैं, इसलिए इनमें ال जुड़ा है।
    example_gloss:
    - मुझे किताब पढ़ना पसंद है।
    - मैं शनिवार को कसरत करता हूँ।
    - मुझे दोस्तों के लिए खाना बनाना पसंद है।
  ar.a1.unit25.lesson01.teach.wqt_alfragh:
    title: ख़ाली समय
    gloss: ख़ाली समय
    note: وقت الفراغ (waqt al-farāgh) का शाब्दिक अर्थ है "खाली जगह का समय"। पहले शब्द में ال नहीं लगता; केवल दूसरे शब्द में लगता है।
    example_gloss: ख़ाली समय में मुझे पढ़ना पसंद है।
  ar.a1.unit25.lesson01.teach.fy_wqt_fraghy:
    title: ख़ाली समय में क्या करते हैं, यह बताना
    gloss: ख़ाली समय में मुझे पढ़ना पसंद है।
    note: أحب (uḥibb) यानी "मुझे पसंद है"; यह पुरुष और स्त्री दोनों के लिए एक ही रहता है। فراغي (farāghī) के अंत का ي "मेरा" का अर्थ देता है।
  ar.a1.unit25.lesson02.teach.alastmaa_ila_almwsyqa:
    title: संगीत, चित्रकारी, वीडियो गेम
    gloss: संगीत सुनना, चित्र बनाना, वीडियो गेम खेलना
    note: الاستماع إلى الموسيقى (al-istimāʿ ilā al-mūsīqā) यानी संगीत सुनना, الرسم (ar-rasm) यानी चित्र बनाना और لعب ألعاب الفيديو (laʿb alʿāb al-fīdiyū) यानी वीडियो गेम खेलना।
    example_gloss:
    - मुझे संगीत सुनना पसंद है।
    - मैं अक्सर चित्र बनाता/बनाती हूँ।
    - मुझे दोस्तों के साथ वीडियो गेम खेलना पसंद है।
  ar.a1.unit25.lesson02.teach.ahb_alastmaa_ila:
    title: कहना कि आपको संगीत सुनना पसंद है
    gloss: मुझे संगीत सुनना पसंद है।
    note: 'الاستماع (al-istimāʿ) के बाद जिसे सुना जाए, उससे पहले إلى (ilā, "को") आता है: الاستماع إلى الموسيقى।'
  ar.a1.unit25.lesson02.teach.ahb_lab_alaab:
    title: कहना कि आपको दोस्तों के साथ वीडियो गेम खेलना पसंद है
    gloss: मुझे दोस्तों के साथ वीडियो गेम खेलना पसंद है।
    note: 'مع (maʿa) यानी "के साथ": مع الأصدقاء (maʿa al-aṣdiqāʾ)। ال الأصدقاء से जुड़ा रहता है।'
  ar.a1.unit25.lesson03.teach.daima_kthyra_ahyana:
    title: हमेशा, अक्सर, कभी-कभी, कभी नहीं
    gloss: हमेशा, अक्सर, कभी-कभी, कभी नहीं
    note: دائما (dāʾiman), كثيرا (kathīran), أحيانا (aḥyānan) और أبدا (abadan) क्रियाविशेषण हैं, इसलिए ये लिंग के अनुसार कभी नहीं बदलते। अंत का ا (alif) बिना किसी चिह्न के लिखा जाता है।
    example_gloss:
    - मैं हर शनिवार हमेशा कसरत करता/करती हूँ।
    - मैं अक्सर कोई किताब पढ़ता/पढ़ती हूँ।
    - मैं कभी-कभी चित्र बनाता/बनाती हूँ।
    - मैं कभी वीडियो गेम नहीं खेलता/खेलती।
  ar.a1.unit25.lesson03.teach.kl_asbwa_kl:
    title: हर हफ़्ते, हर सप्ताहांत
    gloss: हर हफ़्ते, हर सप्ताहांत
    note: كل أسبوع (kull usbūʿ) और كل عطلة نهاية أسبوع (kull ʿuṭlat nihāyat usbūʿ) दोनों में كل (kull, "हर") आता है; अगला कार्ड देखिए।
    example_gloss:
    - मैं हर हफ़्ते दोस्तों के लिए खाना बनाता/बनाती हूँ।
    - मैं हर सप्ताहांत कसरत करता/करती हूँ।
  ar.a1.unit25.lesson03.teach.bad_kl_yaty:
    title: 'हर: كل'
    gloss: 'كل (kull, "हर") के बाद संज्ञा एकवचन में होती है और उसमें ال नहीं लगता: كل أسبوع (kull usbūʿ), كل عطلة نهاية أسبوع (kull ʿuṭlat nihāyat usbūʿ)।'
    note: 'كل (kull) कभी नहीं बदलता: पुल्लिंग संज्ञा أسبوع से पहले भी यही शब्द आता है और स्त्रीलिंग संज्ञा عطلة से पहले भी।'
  ar.a1.unit25.lesson03.teach.madha_tfal_fy:
    title: खाली समय के बारे में पूछना
    gloss: आप अपने खाली समय में क्या करते हैं?
    note: यह इस इकाई का मुख्य प्रश्न है -- किसी से भी उसके शौक़ पूछने के लिए इसका इस्तेमाल कीजिए।
  ar.a1.unit25.lesson04.teach.lyla_ntmsha_maa:
    title: लैला शौक़ों की बात छेड़ती है
    gloss: 'लैला: हम अक्सर साथ टहलते हैं। लेकिन यूसुफ़, तुम खाली समय में और क्या करते हो?'
    note: نتمشى (natamashshā) के शुरू का अक्षर ن (na-) "हम" का अर्थ देता है, इसलिए अरबी में "हम" के लिए अलग शब्द नहीं चाहिए। معا (maʿan) यानी "साथ"।
  ar.a1.unit25.lesson04.teach.ywsf_ahb_altbkh:
    title: यूसुफ़ के शौक़
    gloss: 'यूसुफ़: मुझे खाना बनाना पसंद है, घर पर भी। और मैं अक्सर कसरत करता हूँ।'
    note: في البيت أيضا (fī al-bayt ayḍan) का अर्थ है "घर पर भी"। وأمارس (wa-umāris) में و ("और") क्रिया से जुड़ा है और पूरा एक शब्द लिखा जाता है।
  ar.a1.unit25.lesson04.teach.lyla_hl_ttbkh:
    title: लैला हैरान होती है
    gloss: 'लैला: तुम घर पर भी खाना बनाते हो? तुम तो पहले ही दिन भर काम पर खाना बनाते हो!'
    note: تطبخ (taṭbukh) पुरुष के लिए "तुम" वाली क्रिया है; स्त्री से बात करें तो تطبخين (taṭbukhīn) कहते हैं। طوال اليوم (ṭawāl al-yawm) यानी "पूरे दिन"।
  ar.a1.unit25.lesson04.teach.ywsf_nam_lknny:
    title: यूसुफ़ समझाता है
    gloss: 'यूसुफ़: हाँ, लेकिन मुझे खाना बनाना आरामदेह लगता है। और तुम्हें क्या करना पसंद है?'
    note: 'أجد (ajid) यानी "मैं पाता हूँ" और مريحا (murīḥan) यानी "आरामदेह"। وأنت (wa-anta) में و أنت से जुड़ा है: "और तुम"।'
  ar.a1.unit25.lesson04.teach.lyla_ahb_alqraaa:
    title: लैला के शौक़
    gloss: 'लैला: मुझे पढ़ना पसंद है और मैं अक्सर संगीत सुनती हूँ।'
    note: 'و दोनों शौक़ों को जोड़ता है: أحب القراءة (uḥibb al-qirāʾa) और وأستمع (wa-astamiʿ, "और मैं सुनती हूँ")। यह अगले शब्द से जुड़ा हुआ लिखा जाता है।'
  ar.a1.unit25.lesson04.teach.ywsf_hl_tlabyn:
    title: यूसुफ़ गेमिंग के बारे में पूछता है
    gloss: 'यूसुफ़: क्या तुम वीडियो गेम भी खेलती हो?'
    note: تلعبين (talʿabīn) स्त्री के लिए "तुम" वाली क्रिया है, क्योंकि यूसुफ़ लैला से पूछ रहा है; पुरुष के लिए تلعب (talʿab) होता है। هل (hal) हाँ/नहीं वाले प्रश्न की शुरुआत करता है।
  ar.a1.unit25.lesson04.teach.lyla_la_la:
    title: लैला जवाब देती है
    gloss: 'लैला: नहीं, मैं कभी वीडियो गेम नहीं खेलती। लेकिन कभी-कभी चित्र बनाती हूँ!'
    note: 'أبدا (abadan) यानी "कभी नहीं" और أحيانا (aḥyānan) यानी "कभी-कभी"। क्रिया को لا (lā) से नकारा जाता है: لا ألعب (lā alʿab) यानी "मैं नहीं खेलता/खेलती"।'
  ar.a1.unit25.lesson05.teach.ana_wywsf_ntmsha:
    title: शौक़ों की तुलना
    gloss: यूसुफ़ और मैं अक्सर साथ टहलते हैं। लेकिन हमारे और भी शौक़ हैं। यूसुफ़ को खाना बनाना पसंद है, घर पर भी, और वह अक्सर कसरत करता है। मुझे पढ़ना पसंद है और मैं अक्सर संगीत सुनती हूँ। मैं कभी-कभी चित्र बनाती हूँ, लेकिन कभी वीडियो गेम नहीं खेलती। आपको खाली समय में क्या करना पसंद है?
    note: लैला का संदेश पिछले पाठ की बातें दोहराता है और पाठक से इस इकाई का मुख्य सवाल पूछकर समाप्त होता है।
    glosses:
      نتمشى: टहलना
      كثيرا: अक्सर
      معا: साथ में
      أخرى: दूसरे
      يطبخ: खाना बनाता है
      يحب: पसंद है
      البيت: घर (घर पर)
      ويمارس: कसरत करता है
      أقرأ: पढ़ना
      وأستمع: सुनना
      الموسيقى: संगीत
      أرسم: चित्र बनाती हूँ
      أحيانا: कभी-कभी
      ألعب: खेलना (वीडियो गेम)
      أبدا: कभी नहीं
      فراغك: आपका खाली (समय)
      وقت: समय
  ar.a1.unit25.lesson06.teach.ywsf_madha_stfalyn:
    title: यूसुफ़ सप्ताहांत के बारे में पूछता है
    gloss: 'यूसुफ़: तुम इस सप्ताहांत क्या करोगी?'
    note: 'ستفعلين (sa-tafʿalīn) भविष्य काल में है: शुरू का अक्षर س (sa-) इसे दर्शाता है, और अंत का ين स्त्री के लिए है। عطلة نهاية الأسبوع (ʿuṭlat nihāyat al-usbūʿ) यानी "सप्ताहांत"।'
  ar.a1.unit25.lesson06.teach.lyla_la_aarf:
    title: लैला असमंजस में है
    gloss: 'लैला: अभी पता नहीं। मुझे पढ़ना पसंद है, लेकिन मैं बाहर भी जाना चाहती हूँ।'
    note: لا أعرف بعد (lā aʿrif baʿd) यानी "मुझे अभी पता नहीं"। أن أخرج (an akhruj) यानी "बाहर जाना"।
  ar.a1.unit25.lesson06.teach.ywsf_hl_ntmsha:
    title: यूसुफ़ योजना सुझाता है
    gloss: 'यूसुफ़: साथ टहलें? उसके बाद मैं हमारे लिए खाना बनाऊँगा।'
    note: 'هل نتمشى (hal natamashshā) साथ मिलकर कुछ करने का सुझाव देने का आम तरीका है: هل + "हम" वाली क्रिया। لنا (lanā) में ل ("के लिए") + نا ("हमारे") है, जो एक शब्द में लिखा जाता है।'
  ar.a1.unit25.lesson06.teach.lyla_fkra_jyda:
    title: लैला सहमत होती है
    gloss: 'लैला: अच्छा विचार है! मुझे टहलना और खाना बनाना, दोनों पसंद हैं।'
    note: 'كليهما (kilayhimā) यानी "दोनों"; यह अंत में आता है और दोनों चीज़ों की ओर संकेत करता है: المشي والطبخ (al-mashy wa-aṭ-ṭabkh)।'
  ar.a1.unit25.lesson06.teach.ywsf_mmtaz_idhn:
    title: यूसुफ़ पक्का करता है
    gloss: 'यूसुफ़: बढ़िया। तो फिर शनिवार को मिलते हैं!'
    note: يوم السبت (yawm as-sabt) यानी "शनिवार को"। ال का ل सौर अक्षर س से पहले उच्चारित नहीं होता, इसलिए हम as-sabt लिखते हैं।
