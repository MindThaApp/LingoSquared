    example_gloss: 'लैला ने कहा: क्या तुम्हारे पास मेज़ है?'
  ar.a1.unit19.lesson02.teach.line05:
    title: चीज़ की जगह
    gloss: यूसुफ़ कहता है कि उसके पास कमरे में एक मेज़ है।
    note: عندي से स्वामित्व बताया जाता है।
    example_gloss: 'यूसुफ़ ने कहा: हाँ, मेरे पास कमरे में एक मेज़ है।'
