  ar.a1.unit19.lesson02.teach.line03:
    title: कमरे
    gloss: यूसुफ़ कहता है कि उसके घर में एक कमरा और एक रसोई है।
    note: 'و (wa, और) घर की दोनों चीज़ों को जोड़ता है और अगले शब्द से जुड़कर लिखा जाता है: ومطبخ।'
