teaching:
  ar.a1.unit26.lesson01.teach.twyl_qsyr:
    title: लंबा और नाटा
    gloss: लंबा / नाटा
    note: 'طويل (ṭawīl) का अर्थ है "लंबा" और قصير (qaṣīr) का "छोटा (क़द का)"। स्त्री के लिए इनमें ة जुड़ता है: طويلة (ṭawīla), قصيرة (qaṣīra)।'
    example_gloss:
    - सारा लंबी है।
    - करीम छोटे क़द का है।
  ar.a1.unit26.lesson01.teach.kbyr_fy_alsn:
    title: बुज़ुर्ग और जवान
    gloss: बुज़ुर्ग / जवान
    note: كبير في السن (kabīr fī as-sinn) और صغير في السن (ṣaghīr fī as-sinn) उम्र का एक सामान्य अंदाज़ा देते हैं, सालों की ठीक संख्या नहीं।
    example_gloss:
    - दादाजी बुज़ुर्ग हैं।
    - यूसुफ़ कम उम्र का है।
  ar.a1.unit26.lesson01.teach.km_amrk_sual:
    title: 'उम्र: संख्या या अंदाज़ा'
    gloss: كم عمرك؟ (kam ʿumruka?) सालों की संख्या पूछता है, जबकि كبير في السن (kabīr fī as-sinn) बिना किसी संख्या के सामान्य अंदाज़ा देता है, जैसे الجد كبير في السن (al-jadd kabīr fī as-sinn)।
    note: किसी की ठीक उम्र पूछने के लिए كم عمرك؟ का प्रयोग कीजिए। यहाँ كبير في السن केवल यह बताता है कि कोई उम्र में कितना बड़ा दिखता है।
  ar.a1.unit26.lesson01.teach.sara_twyla_wkrym:
    title: सारा लंबी है और करीम छोटे क़द का है
    gloss: सारा लंबी है और करीम छोटे क़द का है।
    note: 'و (wa-) दोनों वाक्यों को जोड़ता है और अगले शब्द से जुड़ा हुआ लिखा जाता है: وكريم (wa-karīm)। विशेषण संज्ञा के अनुसार चलते हैं: سارة طويلة स्त्रीलिंग है और كريم قصير पुल्लिंग।'
  ar.a1.unit26.lesson02.teach.alshar:
    title: बाल
    gloss: बाल
    note: 'الشعر (ash-shaʿr) का अर्थ है "बाल"। ش सूर्य अक्षर है, इसलिए ال का ل उच्चारित नहीं होता: ash-shaʿr।'
    example_gloss: यूसुफ़ के छोटे काले बाल हैं।
  ar.a1.unit26.lesson02.teach.ashqr_bny_rmady:
    title: सुनहरा, भूरा और स्लेटी
    gloss: सुनहरा / भूरा / स्लेटी
    note: 'أشقر (ashqar), بني (bunnī) और رمادي (ramādī) बालों का वर्णन करते हैं और संज्ञा के बाद आते हैं: شعر أشقر (shaʿr ashqar)।'
    example_gloss:
    - लैला के सुनहरे बाल हैं।
    - करीम के भूरे बाल हैं।
    - दादाजी के बाल स्लेटी हैं।
  ar.a1.unit26.lesson02.teach.shar_twyl_shar:
    title: लंबे और छोटे (बाल)
    gloss: लंबे / छोटे (बाल)
    note: 'طويل (ṭawīl) और قصير (qaṣīr) बालों के लिए भी आते हैं: شعر طويل (shaʿr ṭawīl), شعر قصير (shaʿr qaṣīr)। ये شعر के बाद आते हैं, जो पुल्लिंग है।'
    example_gloss:
    - सारा के लंबे बाल हैं।
    - करीम के छोटे बाल हैं।
  ar.a1.unit26.lesson02.teach.alsfa_taty_bad:
    title: विशेषण संज्ञा के बाद आता है
    gloss: 'अरबी में विशेषण संज्ञा के बाद आता है और उसके अनुसार चलता है: شعر قصير (shaʿr qaṣīr), شعر طويل (shaʿr ṭawīl), شعر أشقر (shaʿr ashqar), شعر بني (shaʿr bunnī), شعر رمادي (shaʿr ramādī), شعر أسود (shaʿr aswad)।'
    note: شعر (shaʿr) पुल्लिंग है, इसलिए उसके विशेषण भी पुल्लिंग होते हैं। अनिश्चित संज्ञा के साथ किसी भी शब्द में ال नहीं लगता।
  ar.a1.unit26.lesson02.teach.ndyf_aldmyr_ha:
    title: बाल और उसके बाल
    gloss: شعر (shaʿr) का अर्थ है "बाल"। इसमें सर्वनाम ها (hā, उसका/उसकी) जोड़ने पर شعرها (shaʿruhā, उसके बाल) बनता है।
    note: 'अंत में ها स्वामी को बताता है: شعرها (उसके बाल), اسمها (उसका नाम), عيناها (उसकी आँखें)। यह शब्द से जुड़ा हुआ लिखा जाता है।'
  ar.a1.unit26.lesson02.teach.lywsf_shar_qsyr:
    title: यूसुफ़ के छोटे काले बाल हैं
    gloss: यूसुफ़ के छोटे काले बाल हैं।
    note: 'ليوسف شعر قصير أسود (li-yūsuf shaʿr qaṣīr aswad): नाम से पहले ل (li-) का अर्थ है "के पास है / का", और यह नाम से जुड़ा हुआ लिखा जाता है।'
  ar.a1.unit26.lesson02.teach.llyla_shar_twyl:
    title: लैला के लंबे सुनहरे बाल हैं
    gloss: लैला के लंबे सुनहरे बाल हैं।
    note: इस पाठ की लंबाई और रंग की शब्दावली एक स्वाभाविक वाक्य में एक साथ आई है।
  ar.a1.unit26.lesson03.teach.alaynan:
    title: आँखें
    gloss: आँखें
    note: 'العينان (al-ʿaynān) का अर्थ है "दोनों आँखें"। यह द्विवचन संज्ञा है: अरबी में ठीक दो के लिए अंत में ان लगता है।'
    example_gloss: यूसुफ़ की आँखें भूरी हैं।
  ar.a1.unit26.lesson03.teach.azrq_bny_akhdr:
    title: नीला, भूरा और हरा
    gloss: नीला / भूरा / हरा
    note: 'أزرق (azraq) नीला, بني (bunnī) भूरा और أخضر (akhḍar) हरा – ये पुल्लिंग रूप हैं। عينان के साथ द्वित्व रूप आते हैं: زرقاوان (zarqāwān), بنيتان (bunnīyatān), خضراوان (khaḍrāwān)।'
    example_gloss:
    - लैला की आँखें नीली हैं।
    - करीम की आँखें भूरी हैं।
    - सारा की आँखें हरी हैं।
  ar.a1.unit26.lesson03.teach.aynan_mthna_ldhlk:
    title: द्वित्व आँखें, द्वित्व विशेषण
    gloss: 'عينان (ʿaynān) द्वित्व है, इसलिए इसका विशेषण भी द्वित्व होता है: عينان زرقاوان (ʿaynān zarqāwān), عينان بنيتان (ʿaynān bunnīyatān), عينان خضراوان (ʿaynān khaḍrāwān)।'
    note: द्वित्व में संज्ञा और विशेषण, दोनों में ان जुड़ता है। विशेषण स्त्रीलिंग भी होता है, क्योंकि عين स्त्रीलिंग संज्ञा है।
  ar.a1.unit26.lesson03.teach.kyf_tbdw_lyla:
    title: लैला कैसी दिखती है?
    gloss: लैला कैसी दिखती है?
    note: كيف تبدو ليلى؟ (kayfa tabdū laylā?) पूछता है कि लैला कैसी दिखती है। تبدو (tabdū) स्त्रीलिंग है, क्योंकि लैला एक स्त्री है; पुरुष के लिए يبدو (yabdū) आता है।
  ar.a1.unit26.lesson03.teach.llyla_shar_twyl:
    title: लैला के लंबे सुनहरे बाल और नीली आँखें हैं
    gloss: लैला के लंबे सुनहरे बाल और नीली आँखें हैं।
    note: 'لليلى شعر طويل أشقر وعينان زرقاوان (li-laylā shaʿr ṭawīl ashqar wa-ʿaynān zarqāwān): ل + नाम का अर्थ है "के पास है", और و बालों और आँखों को जोड़ता है।'
  ar.a1.unit26.lesson04.teach.lyla_staty_ftaa:
    title: लैला नूर के बारे में बताती है
    gloss: 'लैला: भाषा-कैफ़े में एक नई लड़की आने वाली है। उसका नाम नूर है।'
    note: 'ستأتي (sa-taʾtī) का अर्थ है "वह आएगी": س (sa-) भविष्य बताता है और ت (ta-) का अर्थ है "वह (स्त्री)"। اسمها (ismuhā) का अर्थ है "उसका नाम"।'
  ar.a1.unit26.lesson04.teach.ywsf_hsna_kyf:
    title: यूसुफ़ पूछता है कि वह कैसी दिखती है
    gloss: 'यूसुफ़: ठीक है! वह कैसी दिखती है?'
    note: 'كيف تبدو؟ (kayfa tabdū?) में इस बार कोई नाम नहीं है: क्रिया تبدو में ही "वह (स्त्री) दिखती है" का अर्थ है।'
  ar.a1.unit26.lesson04.teach.lyla_hy_qsyra:
    title: लैला नूर का कद और बाल बताती है
    gloss: 'लैला: वह नाटी है और उसके छोटे सुनहरे बाल हैं।'
    note: قصيرة (qaṣīra) स्त्रीलिंग है, क्योंकि नूर एक स्त्री है, लेकिन شعر قصير أشقر पुल्लिंग ही रहता है, क्योंकि شعر पुल्लिंग संज्ञा है।
  ar.a1.unit26.lesson04.teach.ywsf_waynaha:
    title: यूसुफ़ उसकी आँखों के बारे में पूछता है
    gloss: 'यूसुफ़: और उसकी आँखें?'
    note: 'وعيناها (wa-ʿaynāhā) का अर्थ है "और उसकी आँखें": و (wa-) संज्ञा से जुड़ा है, और अंत का ها (hā) "उसकी" बताता है।'
  ar.a1.unit26.lesson04.teach.lyla_lha_aynan:
    title: लैला नूर की आँखें बताती है
    gloss: 'लैला: उसकी आँखें हरी हैं।'
    note: 'لها (lahā) का अर्थ है "उसके पास है": ل (la-) + ها (hā)। عينان خضراوان (ʿaynān khaḍrāwān) द्वित्व संज्ञा और द्वित्व विशेषण है।'
  ar.a1.unit26.lesson04.teach.ywsf_shkra_idhn:
    title: यूसुफ़ उसे पहचान लेगा
    gloss: 'यूसुफ़: शुक्रिया! तो मैं उसे पहचान लूँगा।'
    note: 'سأتعرف عليها (sa-ataʿarraf ʿalayhā) का अर्थ है "मैं उसे पहचान लूँगा": س (sa-) भविष्य बताता है और عليها में ها का अर्थ है "उसे"।'
  ar.a1.unit26.lesson05.teach.sara_akht_krym:
    title: करीम और सारा की तुलना
    gloss: करीम और सारा भाई-बहन हैं, लेकिन वे दिखने में अलग हैं। करीम का कद छोटा है और उसके छोटे भूरे बाल और भूरी आँखें हैं। सारा करीम से लंबी है और उसके लंबे भूरे बाल और हरी आँखें हैं। आप कैसे दिखते हैं?
    note: अब तक सिखाए गए हर रंग और लंबाई के शब्द इस्तेमाल करने वाली छोटी तुलना, जो अंत में पाठक से इकाई का मुख्य सवाल पूछती है।
    glosses:
      أخ: भाई
      أخت: बहन
      تبدو: दिखना
      مختلفان: अलग
      القامة: नाटा (कद में छोटा)
      قصير: छोटा
      بني: भूरा
      شعر: बाल
      بنيتان: भूरा
      وعينان: आँखें
      أطول: ज़्यादा लंबा
      طويل: लंबा
      خضراوان: हरा
      المظهر: रूप-रंग (कोई कैसा दिखता है)
  ar.a1.unit26.lesson05.teach.llmqarna_nstkhdm_afal:
    title: أفعل से तुलना
    gloss: 'तुलना करने के लिए أفعل (afʿal) रूप + من (min) का प्रयोग करें: سارة أطول من كريم (sāra aṭwal min karīm), सारा करीम से लंबी है।'
    note: तुलनात्मक रूप में طويل (ṭawīl) बदलकर أطول (aṭwal) हो जाता है, और من (min) का अर्थ है "से" (तुलना में)। स्त्री के लिए यह रूप नहीं बदलता।
  ar.a1.unit26.lesson05.teach.lsara_shar_atwl:
    title: सारा के बाल करीम के बालों से लंबे हैं
    gloss: सारा के बाल करीम के बालों से लंबे हैं।
    note: 'لسارة شعر أطول من شعر كريم (li-sāra shaʿr aṭwal min shaʿr karīm): أطول पुल्लिंग ही रहता है, क्योंकि شعر पुल्लिंग संज्ञा है।'
  ar.a1.unit26.lesson05.teach.ldy_shar_qsyr:
    title: मेरे बाल छोटे और भूरे हैं
    gloss: मेरे बाल छोटे और भूरे हैं।
    note: 'لدي (ladayya) का अर्थ है "मेरे पास है"; अरबी में "रखना" जैसी कोई क्रिया नहीं होती। विशेषण संज्ञा के बाद आते हैं: شعر قصير بني (shaʿr qaṣīr bunnī)।'
  ar.a1.unit26.lesson06.teach.ywsf_anzry_hl:
    title: यूसुफ़ को नूर दिखती है
    gloss: 'यूसुफ़: देखो, क्या वह नूर है? उसके छोटे सुनहरे बाल और हरी आँखें हैं।'
    note: انظري (unẓurī) स्त्री को दिया गया आदेश है, क्योंकि यूसुफ़ लैला से बात कर रहा है; पुरुष के लिए انظر (unẓur) आता है। هذه (hādhihi) का अर्थ है "यह", स्त्रीलिंग संज्ञा के लिए।
  ar.a1.unit26.lesson06.teach.lyla_nam_hdhh:
    title: लैला पुष्टि करती है
    gloss: 'लैला: हाँ, यह नूर है!'
    note: एक छोटी, स्वाभाविक पुष्टि।
  ar.a1.unit26.lesson06.teach.nwr_mrhba_hl:
    title: नूर यूसुफ़ का अभिवादन करती है
    gloss: 'नूर: नमस्ते, क्या आप यूसुफ़ हैं?'
