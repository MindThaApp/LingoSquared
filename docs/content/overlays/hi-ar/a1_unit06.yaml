    example_gloss: मेरी एक बहन है।
  ar.a1.unit06.lesson02.teach.in_family:
    title: आपके परिवार में
    gloss: आपके परिवार में
    note: 'यहाँ من का अर्थ «man» ''कौन'' है, min ''से'' नहीं, जैसा من أين أنت؟ में है; दोनों एक ही तरह लिखे जाते हैं। عائلتك का अर्थ ''आपका परिवार'' है: पुरुष से बात करते समय ʿāʾilatuka, स्त्री से बात करते समय ʿāʾilatuki।'
    example_gloss: आपके परिवार में कौन-कौन है?
  ar.a1.unit06.lesson02.teach.sister_name:
    title: उसका नाम नूर है
    gloss: उसका नाम नूर है
    note: اسمها का अर्थ 'उसका नाम' है।
    example_gloss: 'यूसुफ़ ने कहा: उसका नाम नूर है।'
  ar.a1.unit06.lesson02.teach.line01:
    title: परिवार के बारे में पूछना
    gloss: लैला पूछती है कि यूसुफ़ के परिवार में कौन है।
    note: यहाँ من («man») का अर्थ 'कौन' है। يا يوسف यूसुफ़ को नाम लेकर पुकारता है।
    example_gloss: 'लैला ने कहा: यूसुफ़, आपके परिवार में कौन-कौन है?'
  ar.a1.unit06.lesson02.teach.line02:
    title: परिवार का वर्णन करना
    gloss: यूसुफ़ कहता है कि उसके पिता, माँ और एक बहन हैं।
    note: و परिवार के सदस्यों को जोड़ता है।
    example_gloss: 'यूसुफ़ ने कहा: मेरे पिता, माँ और एक बहन हैं।'
  ar.a1.unit06.lesson02.teach.line03:
    title: बहन का नाम पूछना
    gloss: लैला उसकी बहन का नाम पूछती है।
    note: 'أختك का अर्थ ''आपकी बहन'' है: पुरुष से बात करते समय ukhtuka, स्त्री से बात करते समय ukhtuki। यहाँ लैला यूसुफ़ से पूछ रही है, इसलिए ukhtuka।'
    example_gloss: 'लैला ने कहा: आपकी बहन का नाम क्या है?'
  ar.a1.unit06.lesson02.teach.line04:
    title: उसका नाम बताना
    gloss: यूसुफ़ कहता है कि उसका नाम नूर है।
    note: 'अंत में ـها का अर्थ ''उसका'' है: اسمها (ismuhā), ''उसका नाम''।'
    example_gloss: 'यूसुफ़ ने कहा: उसका नाम नूर है।'
