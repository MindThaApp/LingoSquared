  ar.a1.unit13.lesson01.teach.yesterday:
    title: कल (बीता हुआ)
    gloss: बीता हुआ कल
    note: أمس (ams) का अर्थ है बीता हुआ कल। यह ذهبت जैसी भूतकाल की क्रिया के साथ आता है और वाक्य के अंत या शुरू में आ सकता है।
    example_gloss: मैं कल बाज़ार गया था।
  ar.a1.unit13.lesson01.teach.went:
    title: मैं गया
    gloss: मैं गया
    note: 'ذهبت (dhahabtu) का अर्थ है मैं गया: भूतकाल का अंत -tu "मैं" को दर्शाता है। स्वर-चिह्नों के बिना यही अक्षर dhahabta / dhahabti (तुम गए, पुरुष / स्त्री से) या dhahabat (वह गई) भी पढ़े जा सकते हैं; संदर्भ से पता चलता है कि कौन-सा है।'
    example_gloss: मैं बाज़ार गया।
  ar.a1.unit13.lesson01.teach.bought:
    title: मैंने ख़रीदा
    gloss: मैंने ख़रीदा
    note: اشتريت (ishtaraytu) का अर्थ है मैंने खरीदा; ذهبت की तरह यह भी "मैं" के लिए -tu पर समाप्त होता है।
    example_gloss: मैंने सेब खरीदे।
  ar.a1.unit13.lesson01.teach.apples_object:
    title: सेब
    gloss: सेब
    note: تفاحا (tuffāḥan) क्रिया की कर्म-स्थिति में تفاح (सेब, खरीदारी वाली इकाई से) है; अतिरिक्त ا -an अंत को लिखता है।
    example_gloss: मैंने सेब खरीदे।
  ar.a1.unit13.lesson02.teach.what_did:
    title: आपने कल क्या किया?
    gloss: आपने कल क्या किया?
    note: 'ماذا (mādhā) का अर्थ है क्या; فعلت यहाँ "तुमने किया" है: पुरुष से faʿalta, स्त्री से faʿalti (लिखने में शब्द एक ही है)। यूसुफ़ लैला से पूछ रहा है, इसलिए वह faʿalti कहता है।'
    example_gloss: 'यूसुफ़ ने कहा: तुमने कल क्या किया?'
  ar.a1.unit13.lesson02.teach.drank:
    title: मैंने पिया
    gloss: मैंने पिया
    note: شربت (sharibtu) का अर्थ है मैंने पिया; इसमें ذهبت और اشتريت जैसा ही -tu (मैं) वाला अंत है।
    example_gloss: मैंने कॉफ़ी पी।
  ar.a1.unit13.lesson02.teach.event_sequence:
    title: हाल की घटनाओं का क्रम
    gloss: मैं बाज़ार गया। मैंने सेब खरीदे। मैंने कॉफ़ी पी।
    note: भूतकाल के कुछ छोटे वाक्य एक के बाद एक बताते हैं कि आपने क्या किया। हर क्रिया "मैं" के लिए -tu पर समाप्त होती है।
    example_gloss: कल मैं बाज़ार गया। मैंने सेब खरीदे। मैंने कॉफ़ी पी।
  ar.a1.unit13.lesson02.teach.line01:
    title: बीते कल के बारे में पूछना
    gloss: यूसुफ़ पूछता है कि लैला ने कल क्या किया।
    note: यूसुफ़ लैला से, यानी एक स्त्री से पूछ रहा है, इसलिए यहाँ فعلت faʿalti पढ़ा जाता है; पुरुष से यह faʿalta होता है।
    example_gloss: 'यूसुफ़ ने कहा: तुमने कल क्या किया?'
  ar.a1.unit13.lesson02.teach.line02:
    title: बाज़ार गई
    gloss: लैला कहती है कि वह बाज़ार गई।
    note: ذهبت पूरी हो चुकी गति को दर्शाता है।
    example_gloss: 'लैला ने कहा: मैं बाज़ार गई।'
  ar.a1.unit13.lesson02.teach.line03:
    title: सेब खरीदे
    gloss: लैला कहती है कि उसने सेब खरीदे।
    note: इससे एक और पूरा हुआ काम जुड़ जाता है।
    example_gloss: 'लैला ने कहा: मैंने सेब खरीदे।'
  ar.a1.unit13.lesson02.teach.line04:
    title: कॉफ़ी पी
    gloss: लैला कहती है कि उसने कॉफ़ी पी।
    note: इससे घटना का छोटा-सा वृत्तांत पूरा होता है।
    example_gloss: 'लैला ने कहा: मैंने कॉफ़ी पी।'
