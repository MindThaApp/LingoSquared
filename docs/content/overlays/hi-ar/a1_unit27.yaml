  ar.a1.unit27.lesson01.teach.hl_ldyk_hywan:
    title: क्या आपके पास कोई पालतू जानवर है?
    gloss: क्या आपके पास कोई पालतू जानवर है?
    note: 'هل لديك (hal ladayka) का अर्थ है “क्या आपके पास है?”। स्त्री से पूछने पर यह लिखने में वैसा ही रहता है, पर अंतिम स्वर i होता है: ladayki। هل (hal) हाँ/नहीं वाला प्रश्न शुरू करता है।'
  ar.a1.unit27.lesson01.teach.nam_ldy_klb:
    title: हाँ, मेरे पास एक कुत्ता है
    gloss: हाँ, मेरे पास एक कुत्ता है।
    note: इस यूनिट की नई शब्दावली के साथ एक सरल सकारात्मक उत्तर।
  ar.a1.unit27.lesson01.teach.la_lys_ldy:
    title: नहीं, मेरे पास कोई पालतू जानवर नहीं है
    gloss: नहीं, मेरे पास कोई पालतू जानवर नहीं है।
    note: 'ليس لدي (laysa ladayya) का अर्थ है “मेरे पास नहीं है”: ليس (laysa) निषेध करता है और لدي (ladayya) का अर्थ है “मेरे पास है”।'
  ar.a1.unit27.lesson01.teach.nnfy_almlkya_babara:
    title: 'न होना: ليس لدي'
    gloss: 'यह कहने के लिए कि आपके पास कुछ नहीं है, ليس لدي (laysa ladayya) का प्रयोग कीजिए: ليس لدي وقت (मेरे पास समय नहीं है), ليس لدي حيوان أليف (मेरे पास कोई पालतू जानवर नहीं है)।'
    note: ليس لدي किसी भी संज्ञा के साथ चलता है और लिंग के अनुसार नहीं बदलता। “उसके” के लिए (पुरुष) ليس لديه (laysa ladayhi) और (स्त्री) ليس لديها (laysa ladayhā) कहिए।
  ar.a1.unit27.lesson02.teach.akhdh_alhywan_fy:
    title: (जानवर को) टहलाने ले जाना
    gloss: (जानवर को) टहलाने ले जाना
    note: أخذ الحيوان في نزهة (akhdh al-ḥayawān fī nuzha) का शाब्दिक अर्थ है जानवर को सैर पर ले जाना। क्रिया أخذ है, यानी लेना।
    example_gloss: मैं रोज़ कुत्ते को टहलाने ले जाता हूँ।
  ar.a1.unit27.lesson02.teach.ytghyr_alfal_ma:
    title: क्रिया व्यक्ति के अनुसार बदलती है
    gloss: 'क्रिया कर्ता के अनुसार बदलती है: آخذ الكلب في نزهة (ākhudh al-kalb fī nuzha), मैं कुत्ते को सैर पर ले जाता/जाती हूँ; كريم يأخذ كلبه في نزهة (karīm yākhudh kalbahu fī nuzha), करीम अपने कुत्ते को सैर पर ले जाता है।'
    note: शुरू का अक्षर أ (a-) “मैं” को और ي (ya-) “वह” को दर्शाता है। نزهة (nuzha) का अर्थ है सैर या छोटी सैर-सपाटा।
  ar.a1.unit27.lesson02.teach.itaam_alhywan:
    title: खाना खिलाना
    gloss: खाना खिलाना
    example_gloss: मैं रोज़ बिल्ली को खाना खिलाता हूँ।
  ar.a1.unit27.lesson02.teach.allab_ma_alhywan:
    title: के साथ खेलना
    gloss: के साथ खेलना
    example_gloss: करीम अपनी बिल्ली के साथ खेलता है।
  ar.a1.unit27.lesson02.teach.akhdh_alklb_fy:
    title: मैं रोज़ कुत्ते को टहलाने ले जाता हूँ
    gloss: मैं रोज़ कुत्ते को टहलाने ले जाता हूँ।
    note: 'كل يوم (kull yawm) का अर्थ है हर दिन: كل + ال के बिना एकवचन संज्ञा।'
  ar.a1.unit27.lesson02.teach.atam_alqta_kl:
    title: मैं रोज़ बिल्ली को खाना खिलाता हूँ
    gloss: मैं रोज़ बिल्ली को खाना खिलाता हूँ।
    note: أطعم (uṭʿim) का अर्थ है “मैं खिलाता/खिलाती हूँ”। القطة (al-qiṭṭa) स्त्रीलिंग है और ال संज्ञा से जुड़ा होता है।
  ar.a1.unit27.lesson03.teach.jma_klb_hw:
    title: 'बहुवचन: كلب → كلاب'
    gloss: 'कई बहुवचन अनियमित होते हैं, इसलिए उन्हें संज्ञा के साथ ही सीखिए: كلب (kalb) का बहुवचन كلاب (kilāb) है, قطة (qiṭṭa) का قطط (qiṭaṭ) और طائر (ṭāʾir) का طيور (ṭuyūr)।'
    note: अरबी के अधिकतर बहुवचन “टूटे बहुवचन” होते हैं, इसलिए हर बहुवचन को उसकी संज्ञा के साथ सीखा जाता है; जानवरों के बहुवचन के साथ स्त्रीलिंग एकवचन विशेषण आता है।
  ar.a1.unit27.lesson03.teach.klab_qtt:
    title: कुत्ते और बिल्लियाँ
    gloss: कुत्ते / बिल्लियाँ
    example_gloss:
    - यूसुफ़ को कुत्ते पसंद हैं।
    - सारा को बिल्लियाँ पसंद हैं।
  ar.a1.unit27.lesson03.teach.asmak_tywr:
    title: मछलियाँ और पक्षी (बहुवचन)
    gloss: मछलियाँ / पक्षी
    example_gloss:
    - मुझे मछलियाँ बहुत पसंद हैं।
    - दादाजी को पक्षी बहुत पसंद हैं।
  ar.a1.unit27.lesson03.teach.ahb_alhywanat:
    title: मुझे जानवर बहुत पसंद हैं
    gloss: मुझे जानवर बहुत पसंद हैं।
    note: أحب الحيوانات (uḥibb al-ḥayawānāt) का अर्थ है “मुझे जानवर पसंद हैं”। बहुवचन ات पर समाप्त होता है और उसके साथ उपसर्ग ال जुड़ा होता है।
  ar.a1.unit27.lesson03.teach.sara_thb_alqtt:
    title: सारा को बिल्लियाँ पसंद हैं, पर उसके पास कोई पालतू जानवर नहीं है
    gloss: सारा को बिल्लियाँ पसंद हैं, लेकिन उसके पास कोई पालतू जानवर नहीं है।
    note: यह उस विरोधाभास की भूमिका बनाता है जिस पर इस यूनिट का पठन-अंश आधारित है।
  ar.a1.unit27.lesson04.teach.ywsf_hl_ldyk:
    title: यूसुफ़ पालतू जानवर के बारे में पूछता है
    gloss: 'यूसुफ़: लैला, क्या तुम्हारे पास कोई पालतू जानवर है?'
  ar.a1.unit27.lesson04.teach.lyla_nam_ldy:
    title: लैला के पास एक कुत्ता है
    gloss: 'लैला: हाँ, मेरे पास एक कुत्ता है।'
  ar.a1.unit27.lesson04.teach.ywsf_kyf_ybdw:
    title: यूसुफ़ पूछता है कि वह कैसा दिखता है
    gloss: 'यूसुफ़: वह कैसा दिखता है?'
    note: كيف يبدو؟ (kayfa yabdū?) का अर्थ है “वह कैसा दिखता है?”। يبدو (yabdū) पुल्लिंग है क्योंकि كلب, यानी कुत्ता, पुल्लिंग संज्ञा है।
  ar.a1.unit27.lesson04.teach.lyla_lh_shar:
    title: लैला अपने कुत्ते का वर्णन करती है
    gloss: 'लैला: उसके बाल भूरे हैं और वह छोटा है।'
    note: बालों के रंग और आकार की शब्दावली रूप-रंग वाली यूनिट से दोहराई गई है, अब किसी व्यक्ति के बालों की जगह जानवर के रोएँ के लिए।
  ar.a1.unit27.lesson04.teach.nqwl_hw_llklb:
    title: जानवरों के लिए सर्वनाम
    gloss: 'जानवर का हर शब्द पुल्लिंग या स्त्रीलिंग होता है: कुत्ता هو (huwa, वह, पुल्लिंग) है और बिल्ली هي (hiya, वह, स्त्रीलिंग) है। أطعمه (uṭʿimuhu) में अंत का ه का अर्थ है “उसे”।'
    note: كلب जैसे पुल्लिंग जानवर-शब्द के साथ पुल्लिंग सर्वनाम और विशेषण आते हैं; قطة जैसे स्त्रीलिंग शब्द के साथ स्त्रीलिंग आते हैं।
  ar.a1.unit27.lesson04.teach.ywsf_hl_takhdhynh:
    title: यूसुफ़ सैर के बारे में पूछता है
    gloss: 'यूसुफ़: क्या तुम उसे हर दिन सैर पर ले जाती हो?'
  ar.a1.unit27.lesson04.teach.lyla_nam_akhdhh:
    title: लैला अपनी दिनचर्या बताती है
    gloss: 'लैला: हाँ, मैं उसे हर दिन सैर पर ले जाती हूँ और उसे खाना खिलाती हूँ।'
  ar.a1.unit27.lesson05.teach.ywsf_wsara_yhban:
    title: जानवरों के बारे में यूसुफ़, सारा और करीम
    gloss: 'यूसुफ़ और सारा दोनों को जानवर पसंद हैं, लेकिन दोनों में से किसी के पास पालतू जानवर नहीं है। यूसुफ़ को कुत्ते पसंद हैं और सारा को बिल्लियाँ। करीम के पास तो एक पालतू जानवर है: एक बिल्ली। वह अपनी बिल्ली के साथ बहुत खेलता है और हर दिन उसे खाना देता है। क्या आपके पास कोई पालतू जानवर है?'
    note: किसी जानवर को पसंद करने और सच में उसे पालने का फ़र्क़ दिखाता है -- यही इस यूनिट के संवाद-लक्ष्य की मूल बात है।
    glosses:
      يحبان: बहुत पसंद है
      كلاهما: दोनों
      الحيوانات: जानवर
      منهما: उनमें से (कोई भी नहीं)
      أليف: पालतू जानवर (शा. सधा हुआ)
      الكلاب: कुत्ते
      القطط: बिल्लियाँ
      قطة: बिल्ली
      يلعب: खेलता है
      ويعطي: देता है
      كل: हर
      طعاما: खाना
  ar.a1.unit27.lesson05.teach.krym_ylab_ma:
    title: करीम अपनी बिल्ली के साथ बहुत खेलता है
    gloss: करीम अपनी बिल्ली के साथ बहुत खेलता है।
    note: 'قطته (qiṭṭatuhu) का अर्थ है “उसकी बिल्ली”: अंत का ه (hu) “उसका/उसकी” दर्शाता है और قطة का ة उसके पहले ت बन जाता है।'
  ar.a1.unit27.lesson05.teach.ahb_alklab_lys:
    title: मुझे कुत्ते बहुत पसंद हैं। मेरे पास कोई पालतू जानवर नहीं है।
    gloss: मुझे कुत्ते बहुत पसंद हैं। मेरे पास कोई पालतू जानवर नहीं है।
    note: दो वाक्यों का एक आदर्श उत्तर, जिसे इस यूनिट के लेखन-अभ्यास में दोहराया जा सकता है।
  ar.a1.unit27.lesson06.teach.lyla_ya_nwr:
    title: लैला नूर से पूछती है
    gloss: 'लैला: नूर, क्या तुम्हारे पास भी कोई पालतू जानवर है?'
  ar.a1.unit27.lesson06.teach.nwr_nam_ldy:
    title: नूर के पास पीको नाम का पक्षी है
    gloss: 'नूर: हाँ, मेरे पास एक पक्षी है। उसका नाम पीको है।'
    note: اسمه (ismuhu) का अर्थ है 'उसका नाम'; अंत का ه 'उसका' दर्शाता है। بيكو (bīkū) पक्षी का नाम है।
  ar.a1.unit27.lesson06.teach.ywsf_ma_ajml:
    title: यूसुफ़ की प्रतिक्रिया
    gloss: 'यूसुफ़: कितना प्यारा! तुम उसके साथ हर दिन क्या करती हो?'
  ar.a1.unit27.lesson06.teach.nwr_atamh_kl:
