    gloss: 'नूर: मैं उसे हर दिन खाना खिलाती हूँ।'
  ar.a1.unit27.lesson06.teach.ywsf_wana_ayda:
    title: यूसुफ़ को भी पक्षी पसंद हैं
    gloss: 'यूसुफ़: मुझे भी पक्षी पसंद हैं।'
  ar.a1.unit27.lesson06.teach.lyla_ma_ajml:
    title: लैला बातचीत समाप्त करती है
    gloss: 'लैला: कितना अच्छा है कि हम तीनों को जानवर पसंद हैं!'
    note: इस यूनिट में तीनों पात्रों के जानवरों से जुड़े तथ्यों को एक साथ समेटता है।
