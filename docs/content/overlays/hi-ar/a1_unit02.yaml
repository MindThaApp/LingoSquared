teaching:
  ar.a1.unit02.lesson01.teach.ma_ismuka:
    title: आपका नाम क्या है?
    gloss: आपका नाम क्या है?
    note: ما اسمك؟ (mā ismuk) नाम पूछने का मानक तरीक़ा है; बिना स्वर-चिह्नों के लिखा रूप किसी भी श्रोता के लिए चलता है।
  ar.a1.unit02.lesson01.teach.ismee:
    title: मेरा नाम है
    gloss: मेरा नाम [है]
    note: اسمي (ismī) में اسم (नाम) और स्वामित्व-सूचक अंत ـي (मेरा) जुड़े हैं।
    example_gloss: मेरा नाम करीम है।
  ar.a1.unit02.lesson01.teach.ana:
    title: मैं
    gloss: मैं
    note: أنا (anā) "मैं" के लिए स्वतंत्र सर्वनाम है; अरबी क्रियाएँ स्वयं भी पुरुष दर्शाती हैं, पर أنا पर ज़ोर देने के लिए और इस जैसे सरल वाक्यों में प्रयोग होता है।
    example_gloss: मैं सारा हूँ।
  ar.a1.unit02.lesson01.teach.tasharrafna:
    title: आपसे मिलकर अच्छा लगा
    gloss: आपसे मिलकर खुशी हुई
    note: تشرفنا (tasharrafnā), शाब्दिक अर्थ "हम सम्मानित हुए", किसी से मिलने पर दोनों ओर से कहा जाने वाला मानक उत्तर है; कोई भी पहले कह सकता है।
  ar.a1.unit02.lesson02.teach.min_ayna:
    title: आप कहाँ से हैं?
    gloss: आप कहाँ से हैं?
    note: من أين أنت؟ (पुरुष से min ayna anta, महिला से min ayna anti) किसी के मूल स्थान के बारे में पूछता है; बिना स्वर-चिह्नों की वर्तनी दोनों के लिए एक ही है।
  ar.a1.unit02.lesson02.teach.ana_min:
    title: मैं ... से हूँ
    gloss: मैं ... से हूँ
    note: أنا من (anā min) के ठीक बाद किसी देश या शहर का नाम आता है।
  ar.a1.unit02.lesson02.teach.lubnan:
    title: लेबनान
    gloss: लेबनान
    note: لبنان (lubnān) के साथ निश्चयवाचक उपसर्ग नहीं लगता, जबकि इस पाठ के अधिकतर अन्य देशों के साथ लगता है।
    example_gloss: मैं लेबनान से हूँ।
  ar.a1.unit02.lesson02.teach.misr:
    title: मिस्र
    gloss: मिस्र
    note: مصر (miṣr) के साथ भी निश्चयवाचक उपसर्ग नहीं लगता।
    example_gloss: मैं मिस्र से हूँ।
  ar.a1.unit02.lesson02.teach.urdun:
    title: जॉर्डन
    gloss: जॉर्डन
    note: الأردن (al-ʾurdun) के नाम का हिस्सा ही निश्चयवाचक उपसर्ग الـ है, जैसे इस पाठ में المغرب और العراق में।
    example_gloss: मैं जॉर्डन से हूँ।
  ar.a1.unit02.lesson02.teach.maghrib:
    title: मोरक्को
    gloss: मोरक्को
    note: المغرب (al-maghrib) का शाब्दिक अर्थ है 'पश्चिम' — यही मूल धातु सूर्यास्त/शाम की नमाज़ के समय के लिए भी इस्तेमाल होती है।
    example_gloss: मैं मोरक्को से हूँ।
  ar.a1.unit02.lesson02.teach.soorya:
    title: सीरिया
    gloss: सीरिया
    note: سوريا (sūryā) के साथ定冠词 "अल" नहीं लगता।
    example_gloss: मैं सीरिया से हूँ।
  ar.a1.unit02.lesson02.teach.iraq:
    title: इराक़
    gloss: इराक़
    note: العراق (al-ʿirāq) के साथ निश्चित उपसर्ग "अल" (ال) लगता है।
    example_gloss: मैं इराक़ से हूँ।
  ar.a1.unit02.lesson03.teach.hal_anta_min:
    title: क्या आप ... से हैं?
    gloss: क्या आप मिस्र से हैं?
    note: هل (hal) हाँ/नहीं वाले प्रश्नों का सूचक शब्द है, जो वाक्य की शुरुआत में आता है; इसका अपना कोई अलग अर्थ नहीं होता।
  ar.a1.unit02.lesson03.teach.naam:
    title: हाँ
    gloss: हाँ
    note: نعم (naʿam) सहमति में दिया जाने वाला सामान्य उत्तर है।
    example_gloss: हाँ, मैं मिस्र से हूँ।
  ar.a1.unit02.lesson03.teach.laa:
    title: नहीं
    gloss: नहीं
    note: لا (lā) मना करने का सामान्य उत्तर है।
    example_gloss: नहीं, मैं लेबनान से हूँ।
  ar.a1.unit02.lesson03.teach.saidtu_biliqaaik:
    title: आपसे मिलकर खुशी हुई
    gloss: आपसे मिलकर खुशी हुई
    note: سعدت بلقائك (saʿidtu bi-liqāʾik) تشرفنا की तुलना में अधिक आत्मीय विदाई-वाक्य है, जो अक्सर बिछड़ने से ठीक पहले कहा जाता है।
  ar.a1.unit02.lesson03.teach.marhaban_bik:
    title: आपका स्वागत है
    gloss: आपका स्वागत है / यहाँ आपका स्वागत है
    note: 'مرحبا بك (marḥaban bik) में بك जुड़ा है, यानी ''आपको'': उपसर्ग بـ के साथ सर्वनाम-प्रत्यय ـك (आप) जुड़ा है — यह वही بك है जो أهلا بك में है।'
  ar.a1.unit02.lesson04.teach.line01:
    title: शुरुआती अभिवादन
    gloss: यूसुफ़ लैला को नमस्ते कहता है।
    note: नाम पूछने-बताने से पहले बातचीत एक सरल مرحبا से शुरू होती है।
  ar.a1.unit02.lesson04.teach.line02:
    title: शुरुआती अभिवादन, उत्तर
    gloss: लैला भी उसे नमस्ते कहती है।
    note: अभिवादन में दोनों पक्ष एक ही शब्द مرحبا कह सकते हैं।
  ar.a1.unit02.lesson04.teach.line03:
    title: नाम पूछना
    gloss: यूसुफ़ उसका नाम पूछता है।
    note: ما اسمك؟ से परिचय शुरू होता है।
  ar.a1.unit02.lesson04.teach.line04:
    title: नाम पूछना, उत्तर
    gloss: लैला उत्तर देती है और उससे भी पूछती है।
    note: وأنت؟ पूरा प्रश्न दोहराने के बजाय उसी प्रश्न को आगे बढ़ा देता है; यह एक आम संक्षिप्त तरीका है।
  ar.a1.unit02.lesson04.teach.line05:
    title: उत्तर और आपसी खुशी
    gloss: यूसुफ़ अपना नाम बताता है और कहता है कि उसे मिलकर खुशी हुई।
    note: تشرفنا से नामों का आदान-प्रदान पूरा होता है।
  ar.a1.unit02.lesson04.teach.line06:
    title: आपसी खुशी, उत्तर
    gloss: लैला वही वाक्य लौटाती है।
    note: تشرفنا स्वाभाविक रूप से दोनों लोग कहते हैं, सिर्फ़ एक नहीं।
  ar.a1.unit02.lesson04.teach.line07:
    title: मूल स्थान पूछना
    gloss: यूसुफ़ पूछता है कि वह कहाँ से है।
    note: من أين أنت؟ बातचीत को मूल स्थान की ओर ले जाता है।
  ar.a1.unit02.lesson04.teach.line08:
    title: मूल स्थान पूछना, उत्तर
    gloss: लैला उत्तर देती है और उससे भी पूछती है।
    note: वह फिर से وأنت؟ का प्रयोग करती है, वही संक्षिप्त तरीका जो पिछली पंक्ति में था।
  ar.a1.unit02.lesson04.teach.line09:
    title: मूल स्थान बताना
    gloss: यूसुफ़ कहता है कि वह लेबनान से है।
    note: أنا من لبنان उसी ढाँचे में है जो पाठ 2 में सिखाया गया था।
  ar.a1.unit02.lesson04.teach.line10:
    title: बातचीत समाप्त करना
    gloss: लैला कहती है कि उसे उससे मिलकर खुशी हुई।
    note: سعدت بلقائك से संकेत मिलता है कि बातचीत स्वाभाविक रूप से समाप्ति की ओर है।
  ar.a1.unit02.lesson04.teach.line11:
    title: विदाई
    gloss: यूसुफ़ कहता है कि उसका जब चाहे स्वागत है, और फिर अलविदा कहता है।
    note: دائما (हमेशा/कभी भी) مرحبا بك को विदाई مع السلامة से पहले एक खुले निमंत्रण जैसा बना देता है।
  ar.a1.unit02.lesson04.teach.line12:
    title: विदाई, उत्तर
    gloss: लैला अलविदा कहती है।
    note: مع السلامة से बातचीत समाप्त होती है; यह a1_unit01 में सिखाया गया था।
