    example_gloss: आज आराम करो।
  ar.a1.unit17.lesson02.teach.need_help:
    title: मुझे मदद चाहिए
    gloss: मुझे मदद चाहिए
    note: أحتاج (aḥtāj) का अर्थ है "मुझे ज़रूरत है" और مساعدة (musāʿada) का अर्थ है "मदद"। आपको أحتاج إلى مساعدة भी मिलेगा, जिसमें إلى है; दोनों सही हैं।
    example_gloss: मुझे दर्द है। मुझे मदद चाहिए।
  ar.a1.unit17.lesson02.teach.line01:
    title: समस्या पूछिए
    gloss: यूसुफ़ लैला से पूछता है कि समस्या क्या है।
    note: يا ليلى लैला को नाम लेकर पुकारता है।
    example_gloss: 'यूसुफ़ ने कहा: क्या समस्या है, लैला?'
  ar.a1.unit17.lesson02.teach.line02:
    title: लक्षण बताइए
    gloss: लैला कहती है कि उसके सिर में दर्द है।
    note: लक्षण सीधे शब्दों में बताया गया है।
    example_gloss: 'लैला ने कहा: मेरे सिर में दर्द है।'
  ar.a1.unit17.lesson02.teach.line03:
    title: सरल सलाह
    gloss: यूसुफ़ लैला से पानी पीने और आराम करने को कहता है।
    note: 'दोनों आदेश स्त्रीलिंग हैं क्योंकि यूसुफ़ लैला से बात कर रहा है; و (wa, और) अगले शब्द से जुड़कर लिखा जाता है: واستريحي।'
    example_gloss: 'यूसुफ़ ने कहा: पानी पियो और आराम करो।'
  ar.a1.unit17.lesson02.teach.line04:
    title: धन्यवाद
    gloss: लैला धन्यवाद कहती है।
    note: شكرا इस छोटी बातचीत को समाप्त करता है।
    example_gloss: 'लैला ने कहा: धन्यवाद।'
