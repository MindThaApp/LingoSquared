  ar.a1.unit17.lesson02.teach.drink:
    title: पानी पीजिए
    gloss: पानी पीजिए
    note: اشربي (ishrabī) "पीओ!" का आदेश है, जो किसी स्त्री से कहा जाता है, यहाँ लैला से; पुरुष से कहना हो तो اشرب (ishrab) होता है।
    example_gloss: 'यूसुफ़ ने कहा: पानी पीओ।'
