  ar.a1.unit17.lesson01.teach.problem_sentence:
    title: सिर में दर्द
    gloss: मेरे सिर में दर्द है
    note: عندي ألم, शाब्दिक अर्थ "मेरे पास दर्द (है)", अरबी में "मुझे दर्द है" कहने का तरीका है; في + शरीर का अंग बताता है कि दर्द कहाँ है।
