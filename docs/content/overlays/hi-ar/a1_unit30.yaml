    example_gloss: मैं मौसम का पूर्वानुमान खोजता/खोजती हूँ।
  ar.a1.unit30.lesson03.teach.alfal_abhth_yaty:
    title: عن के साथ आने वाली क्रिया
    gloss: 'क्रिया أبحث (abḥath) के बाद عن (ʿan) आता है: أبحث عن توقعات الطقس (abḥath ʿan tawaqquʿāt aṭ-ṭaqs)। लेकिन أستخدم (astakhdim) अपनी वस्तु को सीधे लेता है: أستخدم هاتفي.'
    note: عن (ʿan) का अर्थ है "के बारे में" या "की (खोज में)"। हर अरबी क्रिया का अपना पूर्वसर्ग होता है, इसलिए उन्हें साथ-साथ सीखिए।
  ar.a1.unit30.lesson03.teach.krym_ybhth_an:
    title: करीम मौसम का पूर्वानुमान देखता है
    gloss: करीम मौसम का पूर्वानुमान देखता है।
  ar.a1.unit30.lesson03.teach.thm_ydhhb_llrkd:
    title: फिर वह दौड़ने जाता है
    gloss: फिर वह दौड़ने जाता है।
    note: 'ثم (thumma) का अर्थ है "फिर" और यह एक अलग शब्द है, و की तरह अगले शब्द से जुड़ता नहीं। يذهب للركض (yadhhab li-r-rakḍ) का अर्थ है "वह दौड़ने जाता है": ل + الركض मिलकर للركض बन जाता है।'
  ar.a1.unit30.lesson04.teach.lyla_hl_nmars:
    title: लैला प्रस्ताव रखती है
    gloss: 'लैला: क्या हम शनिवार को दस बजे कसरत करें?'
  ar.a1.unit30.lesson04.teach.ywsf_fkra_jyda:
    title: यूसुफ़ सहमत होता है
    gloss: 'यूसुफ़: अच्छा विचार है! मैं मौसम का पूर्वानुमान देखता हूँ।'
    note: 'فكرة جيدة (fikra jayyida): विशेषण جيدة भी संज्ञा की तरह ة पर समाप्त होता है, क्योंकि दोनों स्त्रीलिंग हैं। سأبحث (sa-abḥath) भविष्यकाल है: س + أبحث।'
  ar.a1.unit30.lesson04.teach.ywsf_aljw_mshms:
    title: यूसुफ़ मौसम देखता है
    gloss: 'यूसुफ़: शनिवार को धूप खिली रहेगी!'
    note: الجو مشمس (al-jaww mushmis) का अर्थ है "मौसम धूप वाला है"; इसमें "है" के लिए कोई शब्द नहीं आता। مشمس पुल्लिंग है, क्योंकि यह الجو के अनुरूप है।
  ar.a1.unit30.lesson04.teach.krym_ara_alrsala:
    title: करीम संदेश देखता है
    gloss: 'करीम: मैंने संदेश देख लिया। शनिवार को मिलते हैं!'
  ar.a1.unit30.lesson04.teach.ila_allqaa_abara:
    title: إلى اللقاء + दिन
    gloss: 'आप إلى اللقاء (ilā al-liqāʾ, फिर मिलेंगे) जानते हैं। इसके साथ दिन भी जोड़ सकते हैं: إلى اللقاء يوم السبت (ilā al-liqāʾ yawm as-sabt), إلى اللقاء غدا (ilā al-liqāʾ ghadan)।'
    note: अभिवादन वाली इकाई के विदा लेने के ढंग को किसी ख़ास दिन तक बढ़ाता है।
  ar.a1.unit30.lesson05.teach.lyla_ttsl_bywsf:
    title: कौन क्या इस्तेमाल करता है?
    gloss: लैला हर दिन यूसुफ़ को फ़ोन करती है। वह अपना फ़ोन इस्तेमाल करती है, ऐप नहीं। यूसुफ़ के पास घर में कंप्यूटर नहीं है, लेकिन वह अपने फ़ोन पर इंटरनेट इस्तेमाल करता है। करीम हर सुबह मौसम का पूर्वानुमान देखता है। फिर वह दौड़ने जाता है। सारा अक्सर लैला को संदेश भेजती है। क्या आप भी हर दिन अपना फ़ोन इस्तेमाल करते हैं?
    note: चारों पात्रों की उपकरण-आदतों की तुलना करता है, जैसा खेल वाली इकाई का तुलनात्मक पाठ था।
    glosses:
      تتصل: फ़ोन करती है
      كل: हर
      يوم: दिन
      تستخدم: इस्तेमाल करती है
      هاتفها: फ़ोन
      تطبيقا: ऐप
      حاسوب: कंप्यूटर
      البيت: घर पर
      الإنترنت: इंटरनेट
      يبحث: खोजता है
      صباح: सुबह
      توقعات: पूर्वानुमान (मौसम का पूर्वानुमान)
      يذهب: जाता है
      للركض: दौड़ने के लिए
      ترسل: भेजती है
      كثيرا: अक्सर
      رسالة: संदेश
      تستعمل: इस्तेमाल करते हैं
  ar.a1.unit30.lesson05.teach.krym_ybhth_kl:
    title: करीम हर सुबह पूर्वानुमान देखता है
    gloss: करीम हर सुबह मौसम का पूर्वानुमान देखता है।
  ar.a1.unit30.lesson05.teach.sara_trsl_rsala:
    title: सारा अक्सर लैला को संदेश भेजती है
    gloss: सारा अक्सर लैला को संदेश भेजती है।
  ar.a1.unit30.lesson06.teach.lyla_ara_alrsala:
    title: लैला योजना पक्की करती है
    gloss: 'लैला: मैंने संदेश देख लिया। क्या हम शनिवार को दस बजे पार्क में कसरत करें?'
  ar.a1.unit30.lesson06.teach.ywsf_nam_waljw:
    title: यूसुफ़ मौसम के बारे में हामी भरता है
    gloss: 'यूसुफ़: हाँ, और शनिवार को धूप खिली रहेगी!'
  ar.a1.unit30.lesson06.teach.krym_sarkd_idhn:
    title: करीम की योजना
    gloss: 'करीम: तो मैं दौड़ूँगा। उसके बाद मैं फ़ुटबॉल भी खेलूँगा।'
    note: 'سأركض (sa-arkuḍ) का अर्थ है "मैं दौड़ूँगा": س भविष्य को दर्शाता है। بعد ذلك (baʿda dhālik) का अर्थ है "उसके बाद"।'
  ar.a1.unit30.lesson06.teach.sara_afdl_alsbaha:
    title: सारा की योजना
    gloss: 'सारा: मुझे तैरना ज़्यादा पसंद है, लेकिन मैं भी पार्क आऊँगी।'
    note: أفضل (ufaḍḍil) का अर्थ है "मैं ज़्यादा पसंद करता/करती हूँ"। لكنني (lākinnanī) का अर्थ है "लेकिन मैं", और سآتي (sa-ātī) का अर्थ है "मैं आऊँगा/आऊँगी"।
  ar.a1.unit30.lesson06.teach.lyla_jmyl_ila:
    title: लैला बातचीत समाप्त करती है
    gloss: 'लैला: बहुत बढ़िया! शनिवार को पार्क में मिलते हैं!'
    note: एक ही पंक्ति में इस इकाई की संदेश-बातचीत और खेल वाली इकाई की योजना, दोनों को पूरा करता है।
