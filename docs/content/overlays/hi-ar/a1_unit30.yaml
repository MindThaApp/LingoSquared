    note: 'ترسل (tursil) का अर्थ है "वह (स्त्री) भेजती है": शुरू का अक्षर ت (ta-) "वह (स्त्री)" को दर्शाता है। عبر (ʿabra) का अर्थ है "के ज़रिए" या "द्वारा"।'
