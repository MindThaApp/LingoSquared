  ar.a1.unit30.lesson02.teach.rsala_tany_nsa:
    title: 'संदेश: भेजना और पढ़ना'
    gloss: رسالة (risāla) उस संदेश को कहते हैं जिसे आप भेजते हैं (أرسل رسالة, ursil risāla) या पढ़ते हैं (أقرأ رسالة, aqraʾ risāla)।
    note: नए शब्द को मौसम के पूर्वानुमान वाले पाठ और लोगों के भेजे व पढ़े जाने वाले संदेशों से जोड़ता है।
