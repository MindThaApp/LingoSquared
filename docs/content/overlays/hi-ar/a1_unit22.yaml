  ar.a1.unit22.lesson02.teach.line04:
    title: ठीक होना पूछना
    gloss: यूसुफ़ पूछता है कि लैला ठीक है या नहीं।
    note: 'هل (hal) हाँ-या-नहीं वाले प्रश्न की शुरुआत करता है। यूसुफ़ लैला से पूछ रहा है, इसलिए أنت को anti (पुरुष के लिए: anta) पढ़ा जाता है।'
    example_gloss: 'यूसुफ़ ने कहा: क्या तुम ठीक हो?'
  ar.a1.unit22.lesson02.teach.line05:
    title: हाँ कहना
    gloss: लैला हाँ कहती है और उसे धन्यवाद देती है।
    note: نعم "हाँ" का उत्तर है।
    example_gloss: 'लैला ने कहा: हाँ, धन्यवाद।'
