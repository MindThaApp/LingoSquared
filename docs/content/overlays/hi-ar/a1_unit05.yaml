teaching:
  ar.a1.unit05.lesson01.teach.saa_a:
    title: समय
    gloss: समय / घंटा
    note: الساعة (as-sāʿa) का शाब्दिक अर्थ है "घंटा" (और घड़ी भी); घड़ी के समय वाले उत्तर इसी से शुरू होते हैं।
    example_gloss: तीन बजे हैं।
  ar.a1.unit05.lesson01.teach.kam_saa_a:
    title: कितने बजे हैं?
    gloss: समय क्या हुआ है?
    note: كم الساعة؟ का शाब्दिक अर्थ है "घंटा कितना है?"
    example_gloss: 'लैला ने कहा: क्या समय हुआ है?'
  ar.a1.unit05.lesson01.teach.three_oclock:
    title: तीन बजे
    gloss: तीन बजे हैं।
    note: 'الثالثة (ath-thālitha) स्त्रीलिंग क्रमसूचक "तीसरी" है, जो स्त्रीलिंग الساعة के अनुसार आती है: शाब्दिक अर्थ "तीसरा घंटा"।'
    example_gloss: 'लैला ने कहा: तीन बजे हैं।'
  ar.a1.unit05.lesson01.teach.five_oclock:
    title: पाँच बजे
    gloss: पाँच बजे हैं।
    note: الخامسة (al-khāmisa) यानी "पाँचवाँ (घंटा)"। A1 की इस इकाई में केवल पूरे घंटे आते हैं।
    example_gloss: 'लैला ने कहा: पाँच बजे हैं।'
  ar.a1.unit05.lesson01.teach.sabah:
    title: सुबह
    gloss: सुबह
    note: صباحا (ṣabāḥan) समय को सुबह का स्पष्ट करने के लिए आ सकता है; في الصباح भी यही बात कहता है।
    example_gloss: सुबह के पाँच बजे हैं।
  ar.a1.unit05.lesson01.teach.masaa:
    title: शाम को
    gloss: शाम को
    note: مساء (masāʾan) समय को शाम का स्पष्ट करने के लिए आ सकता है; في المساء भी यही बात कहता है।
    example_gloss: शाम के पाँच बजे हैं।
  ar.a1.unit05.lesson02.teach.mata:
    title: कब
    gloss: कब
    note: متى (matā) से पूछा जाता है कि कोई बात कब होती है।
    example_gloss: पाठ कब है?
  ar.a1.unit05.lesson02.teach.mata_lesson:
    title: पाठ कब है?
    gloss: पाठ कब है?
    note: इस सरल प्रश्न में अरबी में "है" के लिए कोई शब्द नहीं लगता।
    example_gloss: 'यूसुफ़ ने कहा: पाठ कब है?'
  ar.a1.unit05.lesson02.teach.lesson_at_five:
    title: पाठ पाँच बजे है
    gloss: पाठ पाँच बजे है।
    note: الساعة निर्धारित समय बताने के लिए भी आ सकता है।
    example_gloss: 'लैला ने कहा: पाठ पाँच बजे है।'
  ar.a1.unit05.lesson02.teach.line01:
    title: समय पूछना
    gloss: यूसुफ़ समय पूछता है।
    note: كم الساعة؟ से अभी का समय पूछा जाता है।
    example_gloss: 'यूसुफ़ ने कहा: क्या समय हुआ है?'
  ar.a1.unit05.lesson02.teach.line02:
    title: समय बताइए
    gloss: लैला कहती है कि तीन बजे हैं।
    note: उत्तर الساعة से शुरू होता है।
    example_gloss: 'लैला ने कहा: तीन बजे हैं।'
  ar.a1.unit05.lesson02.teach.line03:
    title: '"कब" पूछना'
    gloss: यूसुफ़ पूछता है कि पाठ कब है।
    note: و इस प्रश्न को पिछली बातचीत से जोड़ता है।
    example_gloss: 'यूसुफ़ ने कहा: और पाठ कब है?'
  ar.a1.unit05.lesson02.teach.line04:
    title: निर्धारित समय बताना
    gloss: लैला कहती है कि पाठ पाँच बजे है।
    note: यह निर्धारित समय वाला उत्तर है।
    example_gloss: 'लैला ने कहा: पाठ पाँच बजे है।'
