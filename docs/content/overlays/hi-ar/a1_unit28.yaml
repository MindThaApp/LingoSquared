    gloss: लैला हफ़्ते में दो बार योग करती है। उसे शांति से हिलना-डुलना पसंद है। सारा योग नहीं करती, पर उसे तैराकी पसंद है। सारा अक्सर तैरती है, लगभग हर हफ़्ते। आप कौन-सा खेल करते हैं?
    note: ليلى تمارس اليوغا (laylā tumāris al-yūghā) और سارة تسبح (sāra tasbaḥ) में क्रियाएँ ت (ta-) से शुरू होती हैं क्योंकि दोनों स्त्रियाँ हैं। क्रिया से पहले لا लगाने से वाक्य नकारात्मक बन जाता है।
    glosses:
      تمارس: करती है
      مرتين: दो बार
      الأسبوع: हफ़्ता
      اليوغا: योग
      تحب: बहुत पसंद करती है
