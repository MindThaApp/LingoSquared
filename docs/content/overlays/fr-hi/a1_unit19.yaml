teaching:
  hi.a1.unit19.lesson01.teach.aaj_review:
    title: 'Révision : aujourd’hui'
    gloss: aujourd’hui
    note: Vu à l’unité 3 -- le mot de temps récurrent de cette unité, avec *kal* (demain) dans la leçon 3.
    example_gloss: Nous sommes le trois.
  hi.a1.unit19.lesson01.teach.mausam:
    title: Le temps
    gloss: le temps (météo)
    note: Nouveau nom, mot-thème de cette unité. Il est masculin -- voir les notes de grammaire de cette unité sur l’accord.
    example_gloss: Quel temps fait-il aujourd’hui ?
  hi.a1.unit19.lesson01.teach.kaisa_review:
    title: 'Révision : comment / de quel genre'
    gloss: comment / de quel genre
    note: Vu à l’unité 12 -- repris ici pour demander quel temps il fait.
    example_gloss: Comment est ta maison ?
  hi.a1.unit19.lesson01.teach.hai_hain_review:
    title: 'Révision : est, sont'
    gloss: est (singulier), sont (pluriel)
    note: Le couple singulier/pluriel du verbe « être » sur lequel repose tout le schéma « il y a » de la météo dans cette unité.
    example_gloss:
    - Il fait beau aujourd’hui.
    - Il y a trois pièces dans la maison.
  hi.a1.unit19.lesson01.teach.dhoop:
    title: Soleil
    gloss: soleil
    note: 'Nouveau nom. Énoncé comme une simple existence : *aaj dhoop hai* = « il y a du soleil aujourd’hui » (littéralement « aujourd’hui il y a du soleil »).'
    example_gloss: Il y a du soleil aujourd’hui.
  hi.a1.unit19.lesson01.teach.baarish:
    title: Pluie
    gloss: pluie
    note: 'Nouveau nom. Énoncé comme une simple existence : *aaj baarish hai* = « il pleut aujourd’hui ».'
    example_gloss: Il pleut aujourd’hui.
  hi.a1.unit19.lesson01.teach.hawa:
    title: Vent
    gloss: vent
    note: 'Nouveau nom. Énoncé comme une simple existence : *aaj hawa hai* = « il y a du vent aujourd’hui ».'
    example_gloss: Il y a du vent aujourd’hui.
  hi.a1.unit19.lesson01.teach.grammar_mausam_existential:
    title: Le schéma de phrase de la météo
    gloss: Pour parler du temps qu’il fait, on dit « aaj/kal + [mot de météo] + hai » -- par ex. « aaj dhoop hai », « aaj baarish hai », « aaj hawa hai ». C’est le même schéma hai/hain que celui appris pour la maison (unité 18), mais ici sans nombre, directement avec le sujet.
    note: 'Première note de grammaire de cette unité : elle relie le nouveau vocabulaire à un schéma de phrase déjà connu.'
  hi.a1.unit19.lesson02.teach.mausam_review:
    title: 'Révision : météo'
    gloss: le temps (météo)
    note: Repris de la leçon 1 de cette unité.
    example_gloss: Quel temps fait-il aujourd’hui ?
  hi.a1.unit19.lesson02.teach.garam:
    title: Chaud
    gloss: chaud
    note: Nouvel adjectif. Il ne change pas selon le genre -- voir la note de grammaire de cette leçon.
    example_gloss: Il fait chaud aujourd’hui.
  hi.a1.unit19.lesson02.teach.thanda_thandi:
    title: Froid (masc. / fém.)
    gloss: froid (masculin), froide (féminin)
    note: Nouvel adjectif. Il change bien selon le genre, contrairement à *garm* -- *mausam* (masculin) prend *thanda*, les noms féminins (comme *rasoi*, unité 18) prennent *thandi* -- voir la note de grammaire de cette leçon.
    example_gloss:
    - Il fait froid aujourd’hui.
    - Il fait froid dans la cuisine aujourd’hui.
  hi.a1.unit19.lesson02.teach.grammar_garam_thanda:
    title: Adjectifs invariables et adjectifs qui s’accordent selon le genre
    gloss: « Garm » est un adjectif terminé par une consonne et il ne change pas selon le genre -- « mausam garm hai » garde toujours « garm ». Mais « thanda »/« thandi » est un adjectif terminé par « -a » qui change selon le genre, exactement comme « bada »/« badi » (unité 14) -- « mausam », masculin, prend « thanda » ; un nom féminin prend « thandi ».
    note: 'Point de grammaire central de cette unité : un nouveau couple d’adjectifs rattaché à la règle déjà vue à l’unité 14.'
  hi.a1.unit19.lesson02.teach.baadal:
    title: Nuage(s)
    gloss: nuage(s)
    note: 'Nouveau nom, employé dans cette unité uniquement au pluriel, dans sa forme d’existence naturelle : *aaj baadal hain* = « il y a des nuages aujourd’hui » / « le ciel est nuageux aujourd’hui ».'
    example_gloss: Il y a des nuages aujourd’hui.
  hi.a1.unit19.lesson02.teach.accha_review:
    title: 'Révision : bon'
    gloss: bon
    note: Vu à l’unité 9 -- repris ici pour décrire le temps.
    example_gloss: Il fait beau aujourd’hui.
  hi.a1.unit19.lesson02.teach.bura:
    title: Mauvais
    gloss: mauvais
    note: Nouvel adjectif, opposé à *accha* (bon), déjà vu. Employé dans cette unité uniquement au masculin, comme *mausam*.
    example_gloss: Il fait mauvais aujourd’hui.
  hi.a1.unit19.lesson02.teach.bahut_review:
    title: 'Révision : très'
    gloss: très
    note: Vu à l’unité 6 -- repris ici pour renforcer une description du temps.
    example_gloss: Il fait très froid aujourd’hui.
  hi.a1.unit19.lesson03.teach.kal_review:
    title: 'Révision : demain (aussi : hier)'
    gloss: demain (signifie aussi « hier » selon le contexte)
    note: 'Vu à l’unité 4, repris pour « hier » à l’unité 12 -- en hindi courant, le mot est vraiment ambigu et seul le contexte tranche. Toutes les phrases de cette unité parlent du futur et de projets : kal veut donc dire « demain » ici.'
    example_gloss: Il pleuvra demain.
  hi.a1.unit19.lesson03.teach.ghar_review:
    title: 'Révision : maison / chez soi'
    gloss: maison / chez soi
    note: Vu à l’unité 8 -- repris ici pour le projet qui en découle (rester à la maison).
    example_gloss: C’est une maison.
  hi.a1.unit19.lesson03.teach.mein_review:
    title: 'Révision : dans / à'
    gloss: dans / à
    note: Vu à l’unité 1 -- repris ici dans « ghar mein » (à la maison).
    example_gloss: Il y a trois pièces dans la maison.
  hi.a1.unit19.lesson03.teach.hum_review:
    title: 'Révision : nous'
    gloss: nous
    note: Vu à l’unité 11 -- repris ici comme sujet des projets de cette leçon.
    example_gloss: Nous regardons un film.
  hi.a1.unit19.lesson03.teach.rehte_hain_review:
    title: 'Révision : [ils/nous] restent / habitent'
    gloss: '[ils/nous] restent / habitent'
    note: 'Vu à l’unité 5 (avec un grand-père au singulier, par l’accord du masculin pluriel de politesse) -- cette unité est la première à l’employer avec un vrai sujet pluriel, « hum » (nous) : c’est la même forme verbale, appliquée plus simplement.'
    example_gloss: Mon grand-père habite à Delhi.
  hi.a1.unit19.lesson03.teach.chalo_review:
    title: 'Révision : allons / viens'
    gloss: allons / viens
    note: Vu à l’unité 1, repris aux unités 6/7/11 avec un verbe au pluriel habituel pour dire « Faisons… » -- employé ici de la même façon.
    example_gloss: Mangeons quelque chose !
  hi.a1.unit19.lesson03.teach.jaana_review:
    title: 'Révision : aller'
    gloss: aller
    note: Introduit à l’unité 15 comme infinitif simple ; cette leçon l’étend à la forme du pluriel habituel « jaate hain » (nous allons), formée comme « dekhte hain »/« peete hain » à l’unité 11.
    example_gloss: Je dois aller à la gare.
  hi.a1.unit19.lesson03.teach.aur_review:
    title: 'Révision : et'
    gloss: et
    note: Introduit à l’unité 1 ; réutilisé ici pour relier le temps et la température de demain.
    example_gloss: Demain, il pleuvra et il fera froid.
  hi.a1.unit19.lesson03.teach.bahar:
    title: Dehors
    gloss: dehors
    note: Mot nouveau, propre au vocabulaire du projet de cette leçon.
    example_gloss: Allons dehors !
  hi.a1.unit19.lesson03.teach.jaate_hain_phrase:
    title: Allons dehors !
    gloss: Allons dehors !
    note: '« Chalo » + le pluriel habituel « jaate hain » (de « jaana », aller) : le même schéma « Allons… » déjà vu aux unités 1, 6, 7 et 11.'
  hi.a1.unit19.lesson03.teach.dialogue.line01:
    title: Arjun demande à Priya quel temps il fait aujourd’hui
    gloss: Priya, quel temps fait-il aujourd’hui ?
  hi.a1.unit19.lesson03.teach.dialogue.line02:
    title: Priya décrit le temps d’aujourd’hui
    gloss: Il y a du soleil aujourd’hui et il fait chaud.
  hi.a1.unit19.lesson03.teach.dialogue.line03:
    title: Arjun propose de sortir
    gloss: Super ! Allons dehors.
  hi.a1.unit19.lesson03.teach.dialogue.line04:
    title: Priya demande quel temps il fera demain
    gloss: D’accord ! Et quel temps fera-t-il demain ?
  hi.a1.unit19.lesson03.teach.dialogue.line05:
    title: Arjun décrit le temps de demain
    gloss: Demain, il pleuvra et il fera froid.
  hi.a1.unit19.lesson03.teach.dialogue.line06:
    title: Priya propose de rester à la maison
    gloss: Alors demain, on reste à la maison ?
  hi.a1.unit19.lesson03.teach.dialogue.line07:
    title: Arjun est d’accord
    gloss: Oui, demain, on reste à la maison.
  hi.a1.unit19.lesson03.teach.dialogue.line08:
    title: Priya est d’accord
    gloss: D’accord !
  hi.a1.unit19.lesson03.teach.grammar_summary:
    title: Trois règles principales
    gloss: 'Les trois règles principales de cette unité : (1) « aaj/kal + [mot de météo] + hai/hain » décrit le temps ; (2) « garm » ne change pas selon le genre, mais « thanda »/« thandi » si, comme « bada »/« badi » ; (3) « chalo » + un verbe au pluriel habituel (comme « jaate hain ») exprime une suggestion : « chalo, bahar jaate hain ! ».'
    note: Un résumé final qui réunit toute la grammaire de l’unité, à l’image des notes de grammaire des unités 15 à 18.
  hi.a1.unit19.lesson03.teach.weather_reading:
    title: 'Lecture : aujourd’hui et demain'
    gloss: Il fait chaud aujourd’hui et il y a du soleil. Allons dehors ! Demain, il pleuvra et il fera froid. Demain, nous restons à la maison.
    note: 'Un court texte direct, sans nouveau cadre narratif, qui reprend exactement les faits du dialogue, sans rien ajouter : il répond à l’objectif « lire de courtes prévisions météo ».'
    glosses:
      आज: aujourd’hui
      मौसम: temps (météo)
      गर्म: chaud
      धूप: soleil
      चलो: allons
      बाहर: dehors
      जाते: aller (de जाना)
      कल: demain
      बारिश: pluie
      ठंडा: froid
      रहते: rester / habiter (de रहना)
