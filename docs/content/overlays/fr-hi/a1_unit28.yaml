teaching:
  hi.a1.unit28.lesson01.teach.fon_karna:
    title: Appeler
    gloss: appeler
    note: L’infinitif du verbe qui signifie passer un appel téléphonique.
    example_gloss: Je dois t’appeler.
  hi.a1.unit28.lesson01.teach.main_tumhen_fon:
    title: Dire que tu appelleras
    gloss: Je t’appellerai.
    note: '*करूँगा* est le futur de *करना* ; le hindi l’emploie là où le français dit « je vais » ou « je ». La personne appelée prend *तुम्हें* (« à toi »).'
  hi.a1.unit28.lesson01.teach.hailo_main_priya:
    title: Répondre au téléphone
    gloss: Allô, c’est Priya.
    note: Au téléphone, on dit *मैं ... बोल रही हूँ* (« je parle ») ; *रही* est féminin parce que Priya est une femme.
  hi.a1.unit28.lesson01.teach.hailo_main_arjun:
    title: Arjun répond de la même façon
    gloss: Allô, c’est Arjun.
    note: 'Même structure avec le masculin *रहा* : *मैं अर्जुन बोल रहा हूँ*, car Arjun est un homme.'
  hi.a1.unit28.lesson02.teach.main_kisse_bat:
    title: Demander qui appelle
    gloss: À qui ai-je l’honneur ?
    note: '*किससे* (« avec qui ») est formé de *कौन* (« qui ») et de *से*, et *से* marque la personne avec qui l’on parle.'
  hi.a1.unit28.lesson02.teach.ap_priya_se:
    title: Se présenter de manière formelle
    gloss: Vous parlez à Priya.
    note: '*आप* est le « vous » de politesse, pour une personne qu’on ne connaît pas. *प्रिया से बात कर रहे हैं* place *से* après le nom, et *हैं* accompagne *आप*.'
  hi.a1.unit28.lesson03.teach.kya_tum_yah:
    title: Demander de répéter
    gloss: Peux-tu répéter cela ?
    note: '*सकते हो* signifie « pouvoir » et suit le verbe principal : *कह सकते हो*. *क्या* au début en fait une question.'
  hi.a1.unit28.lesson03.teach.itna_tez_mat:
    title: Demander à quelqu’un de parler moins vite
    gloss: Ne parle pas si vite, s’il te plaît.
    note: '*मत बोलो* est le « ne parle pas » amical avec *तुम*, et *इतना तेज़* signifie « si vite ».'
  hi.a1.unit28.lesson03.teach.mujhe_tumharee_avaz:
    title: Dire que tu entends mal
    gloss: Je ne t’entends pas bien.
    note: 'Le hindi dit « ta voix ne vient pas » : *मुझे तुम्हारी आवाज़ नहीं आ रही है*. Celui qui parle prend *मुझे*, et la voix est le sujet.'
  hi.a1.unit28.lesson04.teach.maisej:
    title: SMS
    gloss: le SMS
    note: '*मैसेज* est un emprunt courant, de genre masculin : *एक मैसेज*, *यह मैसेज ... का है*.'
    example_gloss: Le SMS est de Priya.
  hi.a1.unit28.lesson04.teach.main_tumhen_ek:
    title: Dire que tu enverras un SMS
    gloss: Je t’enverrai un message.
    note: 'L’ordre est : personne, puis chose, puis verbe : *तुम्हें एक मैसेज भेजूँगा*. *भेजना* signifie « envoyer ».'
  hi.a1.unit28.lesson04.teach.main_tumhen_bad:
    title: Dire que tu rappelleras
    gloss: Je te rappellerai plus tard.
    note: '*वापस फ़ोन करना* signifie « rappeler », avec *वापस* avant *फ़ोन करना* ; *बाद में* signifie « plus tard ».'
  hi.a1.unit28.lesson05.teach.arjun_hay_priya:
    title: Lis un échange de SMS
    gloss: 'Arjun : Salut Priya, tu peux m’appeler ? J’ai quelque chose d’important à te dire. Priya : Oui, bien sûr, je te rappelle dans cinq minutes.'
    note: Repère ce qu’Arjun demande, pourquoi, et quand Priya dit qu’elle rappellera.
    glosses:
      हाय: salut
      सकती: pouvoir
      फ़ोन: appeler
      ज़रूरी: 'important (comme dans : quelque chose d’important à dire)'
      कुछ: quelque chose
      बतानी: dire
      ज़रूर: bien sûr
      करूँगी: appellera
      पाँच: cinq
      मिनट: minutes
      वापस: rappeler
  hi.a1.unit28.lesson06.teach.arjun_hailo_main:
    title: Arjun répond à l’appel
    gloss: 'Arjun : Allô, c’est Arjun.'
    note: Celui qui décroche donne d’abord son nom avec *मैं ... बोल रहा हूँ*, ici avec le masculin *रहा*.
  hi.a1.unit28.lesson06.teach.priya_hay_arjun:
    title: Priya se présente
    gloss: 'Priya : Salut Arjun, c’est Priya. Arjun : Tu as bien fait d’appeler !'
    note: '*अच्छा हुआ तुमने फ़ोन किया* signifie « c’est bien que tu aies appelé » ; *तुमने ... किया* est le passé avec *ने*.'
  hi.a1.unit28.lesson06.teach.priya_tumharee_pahlee:
    title: Priya demande comment s’est passé le service
    gloss: 'Priya : Comment s’est passé ton premier service ?'
    note: '*कैसी रही* demande « comment ça s’est passé » ; *कैसी* est féminin parce que *शिफ़्ट* est féminin.'
  hi.a1.unit28.lesson06.teach.arjun_bahut_achchhee:
    title: Arjun annonce une bonne nouvelle
    gloss: 'Arjun : Très bien, mieux que je ne le pensais.'
    note: '*अच्छी रही* (« s’est bien passé ») s’accorde avec le féminin *शिफ़्ट*, et *जितना मैंने सोचा था उससे भी बेहतर* signifie « encore mieux que je ne le pensais ».'
  hi.a1.unit28.lesson06.teach.vah_narvas_tha:
    title: 'था et थी : était'
    gloss: Il était nerveux, elle était contente.
    note: '*था* correspond à « était » pour un sujet masculin et *थी* pour un sujet féminin ; la terminaison s’accorde avec la personne ou la chose décrite.'
  hi.a1.unit28.lesson06.teach.priya_yah_sunkar:
    title: Priya est fière
    gloss: 'Priya : Ça fait plaisir à entendre ! Je suis fière de toi.'
    note: '*तुम पर गर्व है* (« la fierté est sur toi ») emploie *पर*, et la personne fière prend *मुझे*.'
  hi.a1.unit28.lesson06.teach.arjun_bahut_shukriya:
    title: Arjun est touché
    gloss: 'Arjun : Merci beaucoup, ça compte énormément pour moi.'
    note: '*मेरे लिए* signifie « pour moi », et *इसका बहुत मतलब है* veut dire « ça compte beaucoup ».'
  hi.a1.unit28.lesson06.teach.uskee_pahlee_shift:
    title: Son
    gloss: Son premier service s’est très bien passé.
    note: '*उसकी* signifie « son/sa » (même mot pour lui et pour elle) et s’accorde avec le féminin *शिफ़्ट*.'
