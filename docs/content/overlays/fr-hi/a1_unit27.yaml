teaching:
  hi.a1.unit27.lesson01.teach.khush_udas_naraz:
    title: Content, triste et en colère
    gloss: content, triste, en colère
    note: '*खुश*, *उदास* et *नाराज़* sont des mots de base pour les sentiments ; ils s’emploient avec *हूँ* ou *है* (« suis », « est ») et ne changent pas selon le genre.'
    example_gloss:
    - Je suis heureux.
    - Je suis triste.
    - Je suis en colère.
  hi.a1.unit27.lesson01.teach.main_khush_hoon:
    title: Dire que tu es content
    gloss: Je suis heureux.
    note: '*मैं खुश हूँ* suit le schéma *मैं* + sentiment + *हूँ*, comme « je suis ... ».'
  hi.a1.unit27.lesson01.teach.main_naraz_naheen:
    title: Opposer des sentiments
    gloss: Je ne suis pas en colère, je suis triste.
    note: '*नहीं* se place juste avant *हूँ* : *नाराज़ नहीं हूँ*. La seconde partie donne ensuite le vrai sentiment.'
  hi.a1.unit27.lesson02.teach.tum_khush_kyon:
    title: Demander pourquoi
    gloss: Pourquoi es-tu content ?
    note: '*क्यों* (« pourquoi ») se place avant le mot principal : *तुम खुश क्यों हो?*. *तुम* est le « tu » familier.'
  hi.a1.unit27.lesson02.teach.main_khush_hoon:
    title: Donner une raison
    gloss: Je suis content parce que j’ai un nouvel appartement.
    note: '*क्योंकि* introduit la raison. *मेरे पास ... है* signifie « j’ai », et le verbe *है* vient en dernier.'
  hi.a1.unit27.lesson02.teach.main_udas_hoon:
    title: Une raison négative
    gloss: Je suis triste parce qu’il pleut.
    note: '*बारिश हो रही है* signifie « il pleut » (littéralement « la pluie est en train d’avoir lieu »).'
  hi.a1.unit27.lesson03.teach.narvas:
    title: Nerveux
    gloss: nerveux
    note: Le mot habituel pour dire qu’on est nerveux.
    example_gloss: Je suis nerveux pour mon premier service.
  hi.a1.unit27.lesson03.teach.main_apnee_pahlee:
    title: Dire pourquoi tu es nerveux
    gloss: Je suis nerveux pour mon premier service.
    note: '*को लेकर* signifie « à propos de » et se place après le nom : *शिफ़्ट को लेकर*. *अपनी* (« ma propre ») s’accorde avec le féminin *शिफ़्ट*.'
  hi.a1.unit27.lesson03.teach.chinta_mat_karo:
    title: Rassurer quelqu’un
    gloss: Ne t’inquiète pas.
    note: '*चिंता मत करो* est le « ne t’inquiète pas » amical : *मत* + *करो* est l’impératif de *तुम* à la forme négative.'
  hi.a1.unit27.lesson04.teach.arjun_kaisa_mahsoos:
    title: Demander comment quelqu’un se sent
    gloss: Comment Arjun se sent-il ?
    note: '*कैसा महसूस कर रहा है* demande « comment se sent-il ». *कैसा* s’accorde avec la personne : pour une femme, on dit *कैसी*.'
  hi.a1.unit27.lesson04.teach.vah_narvas_mahsoos:
    title: Décrire comment quelqu’un se sent
    gloss: Il se sent nerveux.
    note: 'Le hindi n’a pas de pronom réfléchi séparé ici : *वह नर्वस महसूस कर रहा है* emploie simplement *वह* et *रहा है*.'
  hi.a1.unit27.lesson04.teach.vah_narvas_kyon:
    title: Demander pourquoi quelqu’un se sent ainsi
    gloss: Pourquoi se sent-il nerveux ?
    note: '*क्यों* se place juste avant le groupe verbal : *वह नर्वस क्यों महसूस कर रहा है?*'
  hi.a1.unit27.lesson05.teach.hay_priya_main:
    title: Lire un message sur les sentiments
    gloss: Salut Priya, je suis un peu nerveux à l’idée de ma première garde en solo. Mais je suis aussi content, parce que j’ai un nouveau travail et un nouvel appartement. Je pense que tout ira bien.
    note: Repère ce qui rend l’auteur nerveux, ce qui le rend heureux et sa perspective générale.
    glosses:
      थोड़ा: un peu
      नर्वस: nerveux
      पहली: premier
      शिफ़्ट: service
      अकेले: seul
      खुश: content
      क्योंकि: parce que
      नई: nouveau
      नौकरी: travail
      नया: nouveau
      फ़्लैट: appartement
      लगता: penser
      होगा: 's’arranger (ici : ça va aller)'
  hi.a1.unit27.lesson06.teach.priya_hay_arjun:
    title: Priya demande à Arjun comment il se sent
    gloss: 'Priya : Salut Arjun, comment te sens-tu par rapport à ta première garde ?'
    note: '*को लेकर* est employé de nouveau : *अपनी पहली शिफ़्ट को लेकर* (« à propos de ta première garde »). *तुम* est familier.'
  hi.a1.unit27.lesson06.teach.arjun_sach_kahoon:
    title: Arjun avoue qu’il est nerveux
    gloss: 'Arjun : Pour être honnête, je suis un peu nerveux.'
    note: '*सच कहूँ तो* (« si je dis la vérité ») adoucit un aveu.'
  hi.a1.unit27.lesson06.teach.priya_chinta_mat:
    title: Priya le rassure
    gloss: 'Priya : Ne t’inquiète pas, tu peux bien le faire !'
    note: '*तुम यह अच्छे से कर सकते हो* signifie « tu peux bien faire cela », et *अच्छे से* veut dire « bien ».'
  hi.a1.unit27.lesson06.teach.arjun_shukriya_isse:
    title: Arjun la remercie
    gloss: 'Arjun : Merci, ça aide vraiment.'
    note: '*इससे मदद मिलती है* est littéralement « de ceci, de l’aide est reçue » : ce qui aide est marqué par *से*.'
  hi.a1.unit27.lesson06.teach.priya_aur_bad:
    title: Priya prédit la suite
    gloss: 'Priya : Et après, tu seras sûrement très content et fier.'
    note: '*ज़रूर* (« sûrement ») rend la prédiction confiante, et *तुम्हें गर्व होगा* signifie « tu ressentiras de la fierté ».'
  hi.a1.unit27.lesson06.teach.arjun_han_mujhe:
    title: Arjun est d’accord
    gloss: 'Arjun : Oui, je pense aussi.'
    note: '*मुझे भी ऐसा ही लगता है* (« à moi aussi il semble ainsi ») est la façon naturelle d’approuver, et *मुझे* indique qui ressent.'
  hi.a1.unit27.lesson06.teach.arjun_narvas_hai:
    title: 'Pronoms : उसकी'
    gloss: Arjun est nerveux. Priya l’aide.
    note: '*उसकी* signifie « son » ou « sa » (de lui ou d’elle) et s’accorde avec le féminin *मदद*, donc *उसकी मदद करना* signifie « l’aider » ; *है* et *करती है* sont les verbes de la troisième personne.'
