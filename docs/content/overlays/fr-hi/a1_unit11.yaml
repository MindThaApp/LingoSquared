teaching:
  hi.a1.unit11.lesson01.teach.review_chai_kaafi:
    title: 'Révision : thé, café'
    gloss: thé, café
    note: Un petit rappel des mots de boissons de l’unité 6 -- cette unité les réutilise pour proposer des projets.
    example_gloss:
    - Je voudrais du thé.
    - Je voudrais du café.
  hi.a1.unit11.lesson01.teach.filma:
    title: Film
    gloss: film
    note: 'Un nouveau nom pour le thème de cette unité : faire des projets.'
    example_gloss: Ce film est bien.
  hi.a1.unit11.lesson01.teach.dekhna:
    title: Nous regardons / regardons
    gloss: (nous) regardons / regardons
    note: La forme d’habitude au pluriel de « dekhna » (regarder), employée ici pour proposer une activité ensemble.
    example_gloss: Nous regardons un film.
  hi.a1.unit11.lesson01.teach.chalo_film_phrase:
    title: Allons voir un film !
    gloss: Allons voir un film !
    note: « Chalo » + un verbe à la forme de l’habituel pluriel est la manière courante de proposer de faire quelque chose ensemble. On l’a déjà croisé au passage dans les unités 1, 6 et 7 (« chalo shuru karte hain », « chalo, kuch khaate hain », « chalo, kuch khareedte hain ») ; cette unité formalise et élargit ce schéma.
  hi.a1.unit11.lesson01.teach.saath:
    title: Ensemble
    gloss: ensemble
    note: Sert à proposer de faire une activité ensemble.
    example_gloss: Allons voir un film ensemble !
  hi.a1.unit11.lesson01.teach.peena:
    title: Nous buvons / buvons
    gloss: (nous) buvons / buvons
    note: La forme de l’habituel pluriel de « peena » (boire), construite comme « dekhte hain ».
    example_gloss: Nous buvons du thé.
  hi.a1.unit11.lesson01.teach.chalo_chai_phrase:
    title: Buvons un thé ensemble !
    gloss: Buvons un thé ensemble !
    note: Combine « saath » et « peete hain » de cette leçon en une deuxième proposition, avec le même schéma en « chalo » que pour le film.
  hi.a1.unit11.lesson01.teach.chalo_grammar_note:
    title: Chalo + verbe-te + hain = Allons ___
    gloss: 'Pour proposer de faire quelque chose ensemble, on dit « chalo » + verbe-te + hain : Allons voir un film ! Buvons un thé ensemble !'
    note: Énonce le schéma complet de façon explicite, en formalisant ce qui est déjà apparu incidemment trois fois dans les unités précédentes.
  hi.a1.unit11.lesson01.teach.achha_vichar:
    title: Bonne idée !
    gloss: Bonne idée !
    note: Une façon toute prête d’accepter une proposition avec enthousiasme.
  hi.a1.unit11.lesson02.teach.vyast:
    title: Occupé
    gloss: occupé(e)
    note: Un nouvel adjectif, utilisé avec la copule déjà connue (hoon/ho/hai) pour dire qu’on n’est pas disponible.
    example_gloss: Je suis occupé(e) aujourd’hui.
  hi.a1.unit11.lesson02.teach.maaf_karna:
    title: Désolé(e) / excusez-moi
    gloss: désolé(e) / excuse-moi
    note: Une expression de politesse figée, utilisée pour adoucir un refus.
    example_gloss: Désolé(e), je suis occupé(e).
  hi.a1.unit11.lesson02.teach.maaf_vyast_phrase:
    title: Désolé(e), je suis occupé(e).
    gloss: Désolé(e), je suis occupé(e).
    note: La phrase de base pour refuser, qui combine les deux nouvelles expressions de cette leçon.
  hi.a1.unit11.lesson02.teach.mujhe_kaam_hai:
    title: J’ai du travail.
    gloss: J’ai du travail.
    note: Réutilise le schéma « mujhe… hai » (j’ai…), vu plus tôt avec « mujhe… chahiye » (je veux / il me faut), ici pour donner une raison de refuser.
  hi.a1.unit11.lesson02.teach.decline_grammar_note:
    title: Comment refuser poliment
    gloss: Pour refuser poliment un projet, dis « maaf karna » (désolé) suivi de ta situation (par ex. « je suis occupé ») ou d’une raison (par ex. « j’ai du travail »).
    note: Réutilise volontairement une grammaire déjà vue (la copule et la construction du datif pour la possession) au lieu d’introduire une nouvelle construction pour « pouvoir ».
  hi.a1.unit11.lesson02.teach.hum_pronoun:
    title: Nous
    gloss: nous
    note: 'Premier pronom officiel de la première personne du pluriel dans ce cours. Sa forme verbale de l’habituel présent (-te + hain) est la même que celle déjà vue pour ve (ils) : pas de nouvelle conjugaison, juste un nouveau pronom. (Tum prend aussi -te, mais avec « ho » : tum milte ho.)'
    example_gloss: Nous nous voyons tous les jours.
  hi.a1.unit11.lesson02.teach.kab_milte_phrase:
    title: Quand est-ce qu’on se voit ?
    gloss: Quand est-ce qu’on se voit ?
    note: Combine « hum » avec « kab » (unité 10) et « milte hain » (présent dans les formules de départ depuis l’unité 1, où le sujet était souvent omis).
  hi.a1.unit11.lesson02.teach.din_review:
    title: 'Révision : samedi, dimanche'
    gloss: Samedi, dimanche
    note: Une courte révision de deux jours de la semaine vus à l’unité 3, utiles pour fixer un rendez-vous.
    example_gloss:
    - Aujourd'hui, c'est samedi.
    - Demain, c’est dimanche.
  hi.a1.unit11.lesson02.teach.samay_review:
    title: 'Révision : 4 heures, quelle heure'
    gloss: 4 heures, quelle heure
    note: Une courte révision des mots de l’heure vus à l’unité 4, utiles pour fixer un rendez-vous.
    example_gloss:
    - Il est 4 heures maintenant.
    - Quelle heure est-il maintenant ?
  hi.a1.unit11.lesson02.teach.kya_ravivar_thik_phrase:
    title: Dimanche, ça te va ?
    gloss: Dimanche, ça te va ?
    note: Réutilise « kya » comme marqueur de question fermée, déjà établi depuis l’unité 1 (« kya yeh tumhari pahli baar hai? », « kya tum yoga karti ho? »), plutôt qu’un nouvel interrogatif pour « quel jour ».
  hi.a1.unit11.lesson03.teach.sandesh:
    title: Message
    gloss: message
    note: Un nouveau nom, utilisé pour la partie de cette leçon consacrée à l’invitation écrite.
    example_gloss: C’est le message d’Arjun.
  hi.a1.unit11.lesson03.teach.dialogue.line01:
    title: Arjun propose un film samedi
    gloss: Priya, si on allait voir un film samedi ?
  hi.a1.unit11.lesson03.teach.dialogue.line02:
    title: Priya refuse en donnant une raison
    gloss: Désolée, samedi je suis occupée. J’ai du travail.
  hi.a1.unit11.lesson03.teach.dialogue.line03:
    title: Arjun demande quand ils peuvent se voir
    gloss: D’accord. Quand est-ce qu’on se voit ?
  hi.a1.unit11.lesson03.teach.dialogue.line04:
    title: Priya propose plutôt dimanche
    gloss: Dimanche, ça te va ? Buvons un thé ensemble !
  hi.a1.unit11.lesson03.teach.dialogue.line05:
    title: Arjun accepte et demande l’heure
    gloss: Bonne idée ! À quelle heure dimanche ?
  hi.a1.unit11.lesson03.teach.dialogue.line06:
    title: Priya propose une heure
    gloss: 4 heures, ça te va ?
  hi.a1.unit11.lesson03.teach.dialogue.line07:
    title: Arjun confirme
    gloss: Oui, 4 heures, ça me va. À bientôt !
  hi.a1.unit11.lesson03.teach.dialogue.line08:
    title: Priya conclut
    gloss: D’accord, à dimanche !
  hi.a1.unit11.lesson03.teach.invitation_message:
    title: Le message de Priya
    gloss: Salut Arjun, retrouvons-nous dimanche à 4 heures et buvons un thé. D’accord ? - Priya
    note: Une courte invitation écrite, qui reprend le projet que le dialogue vient de confirmer.
    glosses:
      चलो: allons / faisons
      रविवार: dimanche
      मिलते: se voir, se retrouver (de मिलना)
      चाय: thé
      पीते: boire (de पीना)
      ठीक: d’accord / bien
