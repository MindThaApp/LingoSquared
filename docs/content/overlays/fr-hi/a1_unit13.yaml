teaching:
  hi.a1.unit13.lesson01.teach.chai_coffee_review:
    title: 'Révision : thé, café'
    gloss: thé, café
    note: Une petite révision du vocabulaire de l’unité 6, utile pour parler de ce qu’on aime et n’aime pas dans cette unité.
    example_gloss:
    - Je voudrais du thé.
    - Je voudrais du café.
  hi.a1.unit13.lesson01.teach.mujhe_review:
    title: 'Révision : à moi'
    gloss: à moi
    note: Le pronom au datif vu plus tôt et utilisé dans les unités 6, 7 et 11 ; cette unité lui associe un nouveau prédicat.
    example_gloss: Je voudrais du thé.
  hi.a1.unit13.lesson01.teach.pasand:
    title: Goût / aimé
    gloss: goût / aimé
    note: Un nom qui signifie « goût, fait d’aimer » (et non « préféré »). Avec un sujet au datif (mujhe/tumhein) et hai/hain, il forme l’expression « j’aime… ».
    example_gloss: J’aime le thé.
  hi.a1.unit13.lesson01.teach.pasand_hai_grammar:
    title: Pasand hai = j’aime
    gloss: « Pasand hai » signifie « X me plaît », c’est-à-dire « j’aime X ». La phrase commence par mujhe/tumhein, comme « mujhe…chahiye » (unité 6), mais « chahiye » n’est pas suivi de « hai », alors que « pasand » est toujours suivi de « hai » ou « hain ».
    note: Cette note distingue clairement chahiye (vouloir/avoir besoin) et pasand hai (aimer), pour que les deux constructions ne soient pas confondues.
  hi.a1.unit13.lesson01.teach.sangeet:
    title: La musique
    gloss: musique
    note: Un nouveau nom, pour s’entraîner à la construction pasand hai avec un sujet singulier et non dénombrable.
    example_gloss: J’aime la musique.
  hi.a1.unit13.lesson01.teach.haan_nahi_review:
    title: 'Révision : oui, non'
    gloss: oui, non
    note: Une courte révision de deux mots simples, utiles pour répondre aux questions de goût et les nier dans cette unité.
    example_gloss:
    - Oui, j’aime la musique.
    - Non, je n’aime pas le café.
  hi.a1.unit13.lesson01.teach.pasand_nahi_hai_phrase:
    title: Je n’aime pas le café.
    gloss: Je n'aime pas le café.
    note: 'La négation fonctionne comme dans les autres phrases avec hai déjà vues (par ex. « yoga class nahin hai » de l’unité 3) : nahin se place juste avant hai.'
  hi.a1.unit13.lesson01.teach.kitab_kitaben:
    title: Livre / livres
    gloss: livre / livres
    note: Une nouvelle paire de noms, singulier et pluriel, pour montrer que « hai »/« hain » après pasand s’accorde avec le nombre de ce qui est aimé.
    example_gloss:
    - J’aime ce livre.
    - J’aime les livres.
  hi.a1.unit13.lesson01.teach.number_agreement_grammar:
    title: Hai ou hain après pasand
    gloss: '« Hai » ou « hain » après « pasand » s’accorde avec le NOMBRE de ce qui est aimé, exactement comme dans « mere paas…hai/hain » (unité 2) : chai/sangeet pasand hai (singulier), kitaaben pasand hain (pluriel).'
    note: Cette note étend directement aux nouveaux contextes la règle d’accord en nombre hai/hain vue à l’unité 2, sans introduire de nouveau point de grammaire.
  hi.a1.unit13.lesson02.teach.tumhein_review:
    title: 'Révision : à toi (informel)'
    gloss: à toi (informel)
    note: Vu pour la première fois à l’unité 6 avec chahiye (« tumhein…chahiye ? ») ; cette unité reprend le même pronom au datif avec pasand hai.
    example_gloss: Tu aimes la musique ?
  hi.a1.unit13.lesson02.teach.kya_tumhein_pasand_hai_grammar:
    title: Kya tumhein…pasand hai ?
    gloss: '« Kya » en début de phrase marque une question fermée (oui/non) (unité 1) ; « tumhein » reprend la structure déjà vue avec « tumhein…chahiye ? » (unité 6) : ici, « pasand hai » remplace « chahiye ».'
    note: Il s’agit de la réutilisation d’une structure de question déjà connue, et non d’un nouveau point de grammaire.
  hi.a1.unit13.lesson02.teach.khel:
    title: Sport / jeu
    gloss: sport / jeu
    note: Un nouveau nom. Dans les exemples, il est employé avec « yah » (ce) pour que le nombre reste clair, car « khel » ne change pas de forme entre le singulier et le pluriel.
    example_gloss: J’aime ce sport.
  hi.a1.unit13.lesson02.teach.yah_review:
    title: 'Révision : ce / cette'
    gloss: ce / cette
    note: Vu pour la première fois à l’unité 7 (« mujhe yah chahiye ») ; repris ici pour que la référence au singulier de « khel » soit claire.
    example_gloss: Ce livre est bien.
  hi.a1.unit13.lesson02.teach.ya_review:
    title: 'Révision : ou'
    gloss: ou
    note: Vu pour la première fois aux unités 6 et 7 pour commander de la nourriture et des produits ; repris ici pour poser une question de choix sur les goûts.
    example_gloss: Du thé ou du café ?
  hi.a1.unit13.lesson02.teach.chai_ya_coffee_phrase:
    title: Tu préfères le thé ou le café ?
    gloss: Tu aimes le thé ou le café ?
    note: Associe la structure de question en tumhein de cette leçon au mot ya (ou), déjà vu, pour demander à l’apprenant de choisir.
  hi.a1.unit13.lesson02.teach.zyada:
    title: Plus
    gloss: plus
    note: Un nouveau mot placé juste avant « pasand hai » pour exprimer une préférence entre deux choses déjà nommées.
    example_gloss: J’aime plus le thé.
  hi.a1.unit13.lesson02.teach.zyada_pasand_grammar:
    title: Zyada pasand hai = préférer
    gloss: '« X zyada pasand hai » signifie préférer l’une de deux choses : « mujhe chai zyada pasand hai » veut dire « j’aime plus le thé » / « je préfère le thé ».'
    note: 'Simple extension de vocabulaire, sans nouvelle grammaire : « zyada » complète simplement « pasand hai », déjà vu.'
    target_text: '''X ज़्यादा पसंद है'' का मतलब है दो चीज़ों में से एक को तरजीह देना (préférer) -- ''मुझे चाय ज़्यादा पसंद है'' का मतलब है « J’aime davantage le thé » / « Je préfère le thé »।'
  hi.a1.unit13.lesson03.teach.review_words:
    title: 'Révision : musique, sport, livres'
    gloss: musique, sport/jeu, livres
    note: Une courte révision des noms clés de cette unité, utiles pour le dialogue et la note de lecture.
    example_gloss:
    - J’aime la musique.
    - Je n’aime pas ce sport.
    - J’aime les livres.
  hi.a1.unit13.lesson03.teach.dialogue.line01:
    title: Arjun interroge Priya sur la musique
    gloss: Priya, tu aimes la musique ?
  hi.a1.unit13.lesson03.teach.dialogue.line02:
    title: Priya dit qu’elle aime beaucoup ça
    gloss: Oui, j’aime beaucoup la musique. Et toi ?
  hi.a1.unit13.lesson03.teach.dialogue.line03:
    title: Arjun est d’accord et ajoute le sport
    gloss: Moi aussi ! Et j’aime aussi le sport.
  hi.a1.unit13.lesson03.teach.dialogue.line04:
    title: Priya préfère les livres à ce jeu
    gloss: Ah bon ! Je n’aime pas ce jeu. J’aime les livres.
  hi.a1.unit13.lesson03.teach.dialogue.line05:
    title: 'Arjun demande : thé ou café ?'
    gloss: D’accord. Tu aimes le thé ou le café ?
  hi.a1.unit13.lesson03.teach.dialogue.line06:
    title: Priya préfère le thé
    gloss: J’aime plus le thé.
  hi.a1.unit13.lesson03.teach.dialogue.line07:
    title: Arjun est d’accord
    gloss: Très bien ! J’aime le thé aussi.
  hi.a1.unit13.lesson03.teach.dialogue.line08:
    title: Priya conclut
    gloss: D’accord ! On se revoit demain ?
  hi.a1.unit13.lesson03.teach.chahiye_pasand_zyada_grammar:
    title: Trois structures liées
    gloss: 'Les trois structures de cette unité : ''chahiye'' (vouloir/avoir besoin, unité 6) n’est pas suivi de ''hai'' ; ''pasand hai/hain'' (cette unité) change selon le nombre de la chose aimée ; ''zyada pasand hai'' signifie préférer l’une de deux choses.'
    note: Un récapitulatif qui relie toute la grammaire de l’unité, comme la note de grammaire de l’unité 12 qui rassemble son paradigme.
    target_text: 'इस यूनिट के तीन तरीके: ''चाहिए'' (चाहना/ज़रूरत, यूनिट 6) के बाद ''है'' नहीं आता; ''पसंद है/हैं'' (यह यूनिट) चीज़ की संख्या से बदलता है; ''ज़्यादा पसंद है'' का मतलब है दो में से एक को तरजीह देना (préférer)।'
  hi.a1.unit13.lesson03.teach.priya_note:
    title: Le mot de Priya
    gloss: Arjun, j’aime beaucoup la musique. J’aime aussi les livres. Je n’aime pas ce jeu. Je préfère le thé. – Priya
    note: Un court mot écrit qui reprend exactement les faits déjà établis dans le dialogue, sans rien de nouveau.
    glosses:
      संगीत: musique
      बहुत: beaucoup
      पसंद: aimé / plaisant
      किताबें: livres
      खेल: jeu
      नहीं: ne… pas
      चाय: thé
      ज़्यादा: plus / de préférence
