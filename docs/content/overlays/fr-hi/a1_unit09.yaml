teaching:
  hi.a1.unit09.lesson01.teach.review_places:
    title: 'Rappel : les lieux'
    gloss: banque, école, hôpital, parc, gare, poste
    note: 'Un petit rappel des mots de lieu de l’unité précédente : cette unité les réutilise beaucoup.'
    example_gloss:
    - La banque est ici.
    - La poste est près de la banque.
  hi.a1.unit09.lesson01.teach.review_function_words:
    title: 'Rappel : est, où, ici, là-bas, depuis, de, d’accord'
    gloss: est, où, ici, là-bas, depuis/de, de (appartenance), d’accord
    note: Un petit rappel de petits mots outils vus dans les unités précédentes et réutilisés dans les exercices de cette unité.
    example_gloss:
    - Où est la banque ?
    - Le parc est là-bas.
  hi.a1.unit09.lesson01.teach.seedhe_baaen_daaen:
    title: Tout droit, à gauche, à droite
    gloss: tout droit, à gauche, à droite
    note: Les trois mots de direction essentiels de cette unité.
    example_gloss:
    - Va tout droit.
    - Tourne à gauche.
  hi.a1.unit09.lesson01.teach.jao_muro:
    title: Va !, tourne !
    gloss: va !, tourne ! (impératif familier)
    note: 'Impératifs à la forme tum : le registre naturel entre deux amis qui s’indiquent le chemin.'
    example_gloss:
    - Va tout droit.
    - Tourne à droite.
  hi.a1.unit09.lesson01.teach.yahan_se_seedhe_jao:
    title: Va tout droit à partir d’ici
    gloss: Va tout droit à partir d’ici.
    note: Combine les nouveaux mots de cette leçon avec « yahaan se » (à partir d’ici).
  hi.a1.unit09.lesson01.teach.baaen_muro_phrase:
    title: Tourner à gauche
    gloss: Tourne à gauche.
    note: Un ordre autonome, utilisable tel quel.
  hi.a1.unit09.lesson01.teach.daaen_muro_phrase:
    title: Tourner à droite
    gloss: Tourne à droite.
    note: L’ordre symétrique de « baaen muro ».
  hi.a1.unit09.lesson01.teach.imperative_note:
    title: La terminaison -o de l’impératif
    gloss: '« Jaao » et « muro » sont des impératifs à la forme tum, comme « bataao » et « gino » : tous se terminent en « -o ».'
    note: Signale le modèle commun de l’impératif familier, déjà vu avec deux mots appris plus tôt (bataao à l’unité 7, gino à l’unité 2).
  hi.a1.unit09.lesson02.teach.bank_kaise_jaun:
    title: Comment aller à la banque ?
    gloss: Comment aller à la banque ?
    note: 'La question de base pour demander son chemin, à la première personne : « dois-je aller ».'
  hi.a1.unit09.lesson02.teach.tak:
    title: Jusqu’à
    gloss: jusqu’à
    note: Déjà vu à l’unité 2 pour compter (« zero se das tak ») ; réutilisé ici dans son sens spatial, tout aussi courant.
    example_gloss: Va tout droit jusqu’à la banque.
  hi.a1.unit09.lesson02.teach.bank_tak_seedhe_jao:
    title: Va tout droit jusqu’à la banque
    gloss: Va tout droit jusqu’à la banque.
    note: Une phrase d’exemple avec « tak » employé pour un lieu.
  hi.a1.unit09.lesson02.teach.pahle_phir:
    title: D’abord, puis
    gloss: d’abord, puis
    note: Un couple de mots pour enchaîner deux étapes d’un itinéraire.
    example_gloss:
    - Va d’abord tout droit.
    - Puis tourne à gauche.
  hi.a1.unit09.lesson02.teach.pahle_seedhe_phir_baaen:
    title: D’abord tout droit, puis à gauche
    gloss: Va d’abord tout droit, puis tourne à gauche.
    note: Réunit « pahle » et « phir » dans une consigne en deux étapes.
  hi.a1.unit09.lesson02.teach.pahle_phir_note:
    title: Pahle et phir
    gloss: '« Pahle » et « phir » relient deux étapes : la première action va avec « pahle », la seconde avec « phir », comme dans « pahle seedhe jaao, phir baaen muro ».'
    note: Un point de grammaire utile pour enchaîner les étapes d’un itinéraire.
  hi.a1.unit09.lesson03.teach.nukkad:
    title: Coin de rue
    gloss: coin de rue
    note: Un nouveau mot de lieu pour le dialogue final de la leçon, employé avec « par » (à, sur).
    example_gloss:
    - La banque est au coin de la rue.
    - Le parc est derrière l’école.
  hi.a1.unit09.lesson03.teach.bas:
    title: Juste / seulement
    gloss: juste / seulement
    note: 'Ce mot est aussi un emprunt courant pour désigner le bus (le véhicule), mais ce sens n’est pas enseigné dans ce cours : il n’y a donc pas d’ambiguïté ici.'
    example_gloss: Va juste un peu plus loin.
  hi.a1.unit09.lesson03.teach.samajh_gaya:
    title: Compris / c’est noté
    gloss: compris / c’est noté
    note: 'Expression courante en deux mots : « samajh » (le radical de « samajhna », comprendre) plus « gaya » (est allé), qui marque l’action comme accomplie. C’est la forme masculine : Priya dirait « samajh gayi ».'
    example_gloss: J’ai compris. / C’est noté.
  hi.a1.unit09.lesson03.teach.accha_bahut_shukriya:
    title: D’accord ! Merci beaucoup !
    gloss: D’accord ! Merci beaucoup !
    note: Reprend « accha », « bahut » et « shukriya » vus dans les unités précédentes.
  hi.a1.unit09.lesson03.teach.koi_baat_nahin_phir_milenge:
    title: Pas de souci ! À bientôt.
    gloss: Pas de souci ! À bientôt.
    note: La formule de clôture habituelle de ce cours, reprise telle quelle de l’unité 8.
  hi.a1.unit09.lesson03.teach.dialogue.line01:
    title: Arjun demande le chemin de la poste
    gloss: Arjun demande à Priya comment aller à la poste.
    note: Reprend la structure de la question d’ouverture de la leçon 2.
  hi.a1.unit09.lesson03.teach.dialogue.line02:
    title: Priya commence à indiquer le chemin
    gloss: 'Priya dit : d’ici, va d’abord tout droit.'
    note: Reprend « yahaan se » et « pahle » vus plus tôt dans cette unité.
  hi.a1.unit09.lesson03.teach.dialogue.line03:
    title: Arjun demande la suite
    gloss: Arjun dit d’accord et demande ce qu’il faut faire ensuite.
  hi.a1.unit09.lesson03.teach.dialogue.line04:
    title: Priya poursuit
    gloss: 'Priya dit : ensuite, tourne à gauche au coin de la banque.'
    note: Introduit « nukkad » (coin de rue) en contexte.
  hi.a1.unit09.lesson03.teach.dialogue.line05:
    title: Arjun confirme et redemande
    gloss: Arjun répète « à gauche », confirme que c’est bon et demande la suite.
  hi.a1.unit09.lesson03.teach.dialogue.line06:
    title: Priya termine le premier itinéraire
    gloss: 'Priya dit : continue juste un peu plus loin -- la poste est là, près de la banque.'
    note: 'Introduit « bas » (juste, seulement) et reste cohérent avec ce qu’établit l’unité 8 : la poste est près de la banque.'
  hi.a1.unit09.lesson03.teach.dialogue.line07:
    title: Arjun a compris et demande le chemin du parc
    gloss: Arjun dit qu’il a compris et demande comment aller au parc.
    note: Introduit l’expression « samajh gaya ».
  hi.a1.unit09.lesson03.teach.dialogue.line08:
    title: Priya donne le deuxième itinéraire
    gloss: 'Priya dit : le parc ? Va d’abord tout droit, puis tourne à droite -- le parc est derrière l’école.'
    note: 'Reste cohérent avec ce qu’établit l’unité 8 : le parc est derrière l’école.'
  hi.a1.unit09.lesson03.teach.dialogue.line09:
    title: Arjun remercie Priya
    gloss: Arjun dit qu’il a compris et remercie beaucoup Priya.
  hi.a1.unit09.lesson03.teach.dialogue.line10:
    title: Priya conclut
    gloss: Priya dit pas de souci, à bientôt.
    note: La même formule de clôture que dans le dialogue de l’unité 8, reprise telle quelle.
