  hi.a1.unit35.lesson06.teach.priya_mujhe_maisej:
    title: Priya confirme le projet
    gloss: 'Priya : Je vois le message. On fait du sport samedi à dix heures au parc ?'
  hi.a1.unit35.lesson06.teach.arjun_han_aur:
    title: Arjun confirme la météo
    gloss: 'Arjun : Oui, et samedi, il y a du soleil !'
  hi.a1.unit35.lesson06.teach.vikram_tab_main:
    title: Le programme de Vikram
    gloss: 'Vikram : Alors j’irai courir. Après, je jouerai aussi au football.'
    note: '*उसके बाद* (« après cela ») introduit la deuxième étape, et *भी* signifie « aussi ».'
  hi.a1.unit35.lesson06.teach.neha_mujhe_tairna:
    title: Le programme de Neha
    gloss: 'Neha : Je préfère nager, mais je viendrai aussi au parc.'
    note: Pour dire qu’on préfère, on utilise la tournure *मुझे ... पसंद है*, et *ज़्यादा* ajoute l’idée de « plus ».
  hi.a1.unit35.lesson06.teach.priya_barhiya_shanivar:
    title: Priya conclut la conversation
    gloss: 'Priya : Super ! On se retrouve samedi au parc !'
    note: Conclut en une phrase l’échange de messages de cette unité et le programme de l’unité sur le sport.
