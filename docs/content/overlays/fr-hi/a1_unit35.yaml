    title: J’utilise mon téléphone tous les jours
    gloss: J’utilise mon téléphone tous les jours.
    note: '*हर दिन* (« tous les jours ») est une expression de temps qui se place avant le verbe.'
  hi.a1.unit35.lesson02.teach.aip:
    title: L’application
    gloss: l’application
    example_gloss: J’ai une application pour les prévisions météo.
  hi.a1.unit35.lesson02.teach.maisej:
    title: Le message
    gloss: le message
    example_gloss: Je vais envoyer un message via l’application.
  hi.a1.unit35.lesson02.teach.maisej_bhejte_bhee:
    title: Le verbe suit la personne
    gloss: 'Un *मैसेज* peut être envoyé ou lu, et la terminaison du verbe suit la personne : *मैं भेजता हूँ*, *तुम पढ़ते हो*, *वह पढ़ता है*.'
    note: Associe le nouveau mot au nom composé déjà appris dans l’unité sur la météo.
  hi.a1.unit35.lesson02.teach.priya_aip_se:
    title: Priya envoie un message par l’appli
    gloss: Priya envoie un message par l’appli.
    note: '*ऐप से* signifie « via l’appli » : *से* marque l’outil que l’on utilise.'
  hi.a1.unit35.lesson02.teach.arjun_maisej_parhta:
    title: Arjun lit le message
    gloss: Arjun lit le message.
  hi.a1.unit35.lesson03.teach.chek_karna:
    title: Chercher
    gloss: chercher
    example_gloss: Je consulte les prévisions météo.
  hi.a1.unit35.lesson03.teach.chek_karna_men:
    title: Seul करना change
    gloss: 'Dans *चेक करना*, le mot *चेक* ne change pas ; seul *करना* varie selon la personne : *मैं चेक करता हूँ*, *तुम चेक करते हो*. Il en va de même pour *इस्तेमाल करना*.'
    note: 'Beaucoup de verbes hindis sont formés d’un nom ou d’un mot emprunté suivi de *करना* : apprends le premier mot une fois pour toutes et ne fais varier que *करना*.'
  hi.a1.unit35.lesson03.teach.vikram_mausam_ka:
    title: Vikram consulte la météo
    gloss: Vikram consulte la météo.
  hi.a1.unit35.lesson03.teach.phir_vah_daurne:
    title: Ensuite, il va courir
    gloss: Ensuite, il va courir.
    note: '*दौड़ने जाना* (« aller courir ») place le verbe à la forme en *-ने* devant *जाना*.'
  hi.a1.unit35.lesson04.teach.priya_chalo_shanivar:
    title: Priya fait une proposition
    gloss: 'Priya : On fait du sport samedi à dix heures ?'
  hi.a1.unit35.lesson04.teach.arjun_achchha_aidiya:
    title: Arjun est d’accord
    gloss: 'Arjun : Bonne idée ! Je consulte la météo.'
    note: '*अच्छा आइडिया!* est une façon rapide et sympathique de dire « bonne idée ».'
  hi.a1.unit35.lesson04.teach.arjun_shanivar_ko:
    title: Arjun vérifie la météo
    gloss: 'Arjun : Samedi, il y a du soleil !'
    note: 'Il n’y a pas de sujet « il » : en hindi, on dit *शनिवार को धूप है* (« samedi soleil est »).'
  hi.a1.unit35.lesson04.teach.vikram_mujhe_maisej:
    title: Vikram voit le message
    gloss: 'Vikram : Je vois le message. On se retrouve samedi !'
  hi.a1.unit35.lesson04.teach.phir_milenge_yah:
    title: फिर मिलेंगे vs jour + को
    gloss: 'Tu connais *फिर मिलेंगे!* (« à bientôt »). Pour indiquer un jour, place *को* après lui : *शनिवार को मिलते हैं!*, *सोमवार को मिलते हैं!*'
    note: Étend la formule d’au revoir de l’unité sur les salutations à un jour précis.
  hi.a1.unit35.lesson05.teach.priya_har_din:
    title: Qui utilise quoi ?
    gloss: Priya appelle Arjun tous les jours. Elle utilise son téléphone, pas une appli. Arjun n’a pas d’ordinateur à la maison, mais il utilise Internet sur son téléphone. Vikram consulte la météo chaque matin. Ensuite, il va courir. Neha envoie souvent un message à Priya. Et toi, est-ce que tu utilises aussi ton téléphone tous les jours ?
    note: Compare les habitudes des quatre personnages en matière d’appareils, sur le modèle du texte comparatif de l’unité sur le sport.
    glosses:
      कॉल: appelle
      हर: tous les
      दिन: jour
      इस्तेमाल: utilise
      फ़ोन: téléphone
      ऐप: application
      कंप्यूटर: ordinateur
      घर: à la maison
      इंटरनेट: Internet
      चेक: consulte
      सुबह: matin
      अनुमान: prévisions météo
      जाता: va
      दौड़ने: courir
      भेजती: envoie
      अक्सर: souvent
      मैसेज: message
      करते: utilises
