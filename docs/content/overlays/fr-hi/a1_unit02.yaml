teaching:
  hi.a1.unit02.lesson01.teach.shoonya:
    title: Zéro
    gloss: zéro
    note: Le point de départ de tous les nombres de cette unité.
    example_gloss: Aujourd’hui, la température est de zéro degré.
  hi.a1.unit02.lesson01.teach.ek:
    title: Un
    gloss: un
    note: En hindi, chaque nombre de 11 à 99 est un mot à part, et non construit sur un schéma « dix + un » ; tu le verras dans la leçon 2, où बीस (20) et तीस (30) n’ont aucun élément visible en commun avec एक (1) ou दो (2).
    example_gloss: J’ai un livre.
  hi.a1.unit02.lesson01.teach.do:
    title: Deux
    gloss: deux
    note: Un nombre simple et très fréquent – c’est aussi l’impératif familier du verbe « donner », mais le contexte rend toujours le sens clair.
    example_gloss: J’ai deux frères.
  hi.a1.unit02.lesson01.teach.teen:
    title: Trois
    gloss: trois
    note: '*Chahiye* (« est nécessaire ») est une construction impersonnelle courante : *mujhe teen seb chahiye* signifie littéralement « à moi trois pommes [sont] nécessaires » – une façon très naturelle de dire « il me faut ».'
    example_gloss: Il me faut trois pommes.
  hi.a1.unit02.lesson01.teach.chaar:
    title: Quatre
    gloss: quatre
    note: Aucune irrégularité ici – chaar se comporte comme tous les autres petits nombres.
    example_gloss: J’ai quatre amis.
  hi.a1.unit02.lesson01.teach.paanch:
    title: Cinq
    gloss: cinq
    note: Il s’écrit avec un chandrabindu (पाँच) et non avec un anusvara – le signe vocalique aa (ा) ne dépasse pas au-dessus de la lettre, ce qui appelle un chandrabindu plutôt qu’un simple point, comme dans हाँ/कहाँ vus dans l’unité 1.
    example_gloss: J’ai cinq roupies.
  hi.a1.unit02.lesson01.teach.chhah:
    title: Six
    gloss: six
    note: On trouve parfois l’orthographe छः dans les textes anciens ; छह est l’orthographe moderne standard.
    example_gloss: J’ai six livres.
  hi.a1.unit02.lesson01.teach.saat:
    title: Sept
    gloss: sept
    note: Un nombre utile pour parler des jours de la semaine.
    example_gloss: Il y a sept jours dans une semaine.
  hi.a1.unit02.lesson01.teach.aath:
    title: Huit
    gloss: huit
    note: Aucune irrégularité – aath se comporte comme tous les autres petits nombres.
    example_gloss: Il y a huit chaises dans cette pièce.
  hi.a1.unit02.lesson01.teach.nau:
    title: Neuf
    gloss: neuf
    note: Pas de nasalisation à marquer ici, contrairement à certains nombres voisins.
    example_gloss: Le cours de yoga commence à neuf heures du matin.
  hi.a1.unit02.lesson01.teach.das:
    title: Dix
    gloss: dix
    note: Le dernier nombre de ce premier groupe – la leçon 2 continue avec les nombres à partir de onze et les dizaines, qui cessent d’être prévisibles.
    example_gloss: J’ai dix doigts aux mains.
  hi.a1.unit02.lesson02.teach.gyaarah:
    title: Onze
    gloss: onze
    note: 'À partir d’ici, chaque nombre hindi est un mot irrégulier à part entière – gyaarah ne contient visiblement ni das (10) ni ek (1). Il n’y a pas de raccourci : il faut apprendre chacun individuellement.'
    example_gloss: Il y a onze élèves dans cette classe.
  hi.a1.unit02.lesson02.teach.baarah:
    title: Douze
    gloss: douze
    note: Encore un à mémoriser tout simplement – aucun schéma prévisible ne le relie à do (2).
    example_gloss: Il y a douze mois dans une année.
  hi.a1.unit02.lesson02.teach.pandrah:
    title: Quinze
    gloss: quinze
    note: Très courant pour parler de courtes durées, comme une pause de quinze minutes.
    example_gloss: Il me faut quinze minutes.
  hi.a1.unit02.lesson02.teach.bees:
    title: Vingt
    gloss: vingt
    note: Un mot vraiment nouveau, qui n’est pas une combinaison de das (10) et do (2) – ce schéma se poursuit pour toutes les dizaines suivantes.
    example_gloss: Ma sœur a vingt ans.
  hi.a1.unit02.lesson02.teach.tees:
    title: Trente
    gloss: trente
    note: De nouveau un mot à part – il ressemble un peu à teen (3), mais on ne peut pas le former avec teen plus das ; apprends-le comme un mot distinct.
    example_gloss: Le ticket coûte trente roupies.
  hi.a1.unit02.lesson02.teach.pachaas:
    title: Cinquante
    gloss: cinquante
    note: Un nombre rond très utilisé, surtout pour les prix.
    example_gloss: J’ai cinquante roupies.
  hi.a1.unit02.lesson02.teach.sau:
    title: Cent
    gloss: cent
    note: Un nombre rond bien net, extrêmement courant dans les prix de tous les jours.
    example_gloss: Ce livre coûte cent roupies.
  hi.a1.unit02.lesson02.teach.keemat:
    title: Le prix
    gloss: prix ; coût
    note: '*Keemat* est un nom féminin – son possessif prend toujours la forme féminine (*iski keemat*, « son prix »), quel que soit l’objet dont on parle.'
    example_gloss: Quel est le prix de ce ticket ?
  hi.a1.unit02.lesson02.teach.rupaye:
    title: Roupies
    gloss: roupies
    note: '*Rupaya* est le singulier (pour une seule roupie) ; *rupaye* s’emploie pour tout montant supérieur.'
    example_gloss: Cela coûte cinquante roupies.
  hi.a1.unit02.lesson02.teach.iski_keemat_kya_hai:
    title: Demander un prix
    gloss: Quel est son prix ?
    note: '*Iski* (« son/sa ») s’accorde avec le nom féminin *keemat* (« prix »), et non avec l’objet dont on demande le prix – c’est le même accord du possessif que celui vu dans l’unité 1 avec *mera naam*.'
  hi.a1.unit02.lesson02.teach.iski_keemat_pachaas_rupaye_hai:
    title: Indiquer un prix
    gloss: Son prix est de cinquante roupies.
    note: La réponse naturelle, en phrase complète, à Iski keemat kya hai ?
  hi.a1.unit02.lesson03.teach.aapka_phone_number_kya_hai:
    title: Demander un numéro de téléphone, avec politesse
    gloss: Quel est votre numéro de téléphone ? (formel)
    note: '*Number* (नंबर) est un emprunt à l’anglais, utilisé constamment dans le hindi de tous les jours. *Aapka* s’accorde avec le nom masculin *number*.'
  hi.a1.unit02.lesson03.teach.tumhara_phone_number_kya_hai:
    title: Demander un numéro de téléphone en tutoyant
    gloss: Quel est ton numéro de téléphone ? (informel)
    note: Tumhara remplace aapka quand on parle à un ami ou à un pair, comme dans l’unité 1.
  hi.a1.unit02.lesson03.teach.mera_number:
    title: 'Donner un numéro : l’introduction'
    gloss: Mon numéro est...
    note: Une façon naturelle d’introduire les chiffres avant de les énoncer un à un.
  hi.a1.unit02.lesson03.teach.sample_number:
    title: Un exemple de numéro de téléphone
    gloss: Six, deux, huit, trois, cinq.
    note: Les numéros de téléphone hindi se lisent chiffre par chiffre – chacun des chiffres ici a déjà été appris dans la leçon 1.
  hi.a1.unit02.lesson03.teach.aapki_umra_kya_hai:
    title: Demander son âge à quelqu’un en le vouvoyant
    gloss: Quel âge avez-vous ? (formel)
    note: '*Umra* (« âge ») est un nom féminin, donc *aapki* prend ici la forme féminine – c’est le même accord que dans *iski keemat*, appliqué cette fois à l’âge d’une personne et non à un prix.'
  hi.a1.unit02.lesson03.teach.tumhari_umra_kya_hai:
    title: Demander son âge à quelqu’un en le tutoyant
    gloss: Quel âge as-tu ? (informel)
    note: Tumhari remplace aapki quand on parle à un ami ou à un pair.
  hi.a1.unit02.lesson03.teach.meri_umra_tees_saal_hai:
    title: Dire son âge
    gloss: J’ai trente ans.
    note: '*Meri* s’accorde avec *umra* (féminin), jamais avec le genre de la personne qui parle – contrairement aux formes verbales *chahta/chahti* vues dans l’unité 1, ce possessif ne change pas, quel que soit le locuteur.'
  hi.a1.unit02.lesson03.teach.dialogue.line01:
    title: Arjun demande son numéro à Priya
    gloss: Arjun demande à Priya son numéro de téléphone, de façon informelle.
    note: Reprend exactement la question informelle sur le numéro de téléphone de cette leçon.
  hi.a1.unit02.lesson03.teach.dialogue.line02:
    title: Priya donne son numéro et pose la question en retour
    gloss: Priya énonce son numéro de téléphone chiffre par chiffre, puis demande celui d’Arjun.
    note: Chaque chiffre ici a déjà été appris dans la leçon 1 de cette unité.
  hi.a1.unit02.lesson03.teach.dialogue.line03:
    title: Arjun donne son numéro
    gloss: Arjun énonce son propre numéro de téléphone.
    note: Là encore, tous les chiffres reprennent le vocabulaire de la leçon 1.
  hi.a1.unit02.lesson03.teach.dialogue.line04:
    title: Priya demande l’âge d’Arjun
    gloss: Priya le remercie et lui demande son âge, de façon informelle.
    note: Shukriya (« merci ») ne change pas selon le registre, comme la carte shukriya de l’unité 1.
  hi.a1.unit02.lesson03.teach.dialogue.line05:
    title: Arjun donne son âge et le demande en retour
    gloss: Arjun dit qu’il a vingt ans, puis demande à son tour l’âge de Priya.
    note: Tumhari ? tout seul est une façon courte et naturelle de renvoyer la question.
  hi.a1.unit02.lesson03.teach.dialogue.line06:
    title: Priya donne son âge
    gloss: Priya dit qu’elle a trente ans.
    note: Meri umra tees saal hai reprend exactement la structure de phrase vue plus tôt dans cette leçon.
  hi.a1.unit02.lesson03.teach.dialogue.line07:
    title: Arjun conclut la conversation
    gloss: Arjun réagit positivement et dit qu’ils se reverront.
    note: Accha et phir milenge reprennent le vocabulaire d’adieu de l’unité 1.
  hi.a1.unit02.lesson03.teach.dialogue.line08:
    title: Priya conclut la conversation
    gloss: Priya est d’accord et dit un « à bientôt » décontracté.
    note: Theek hai et phir milte hain reprennent le vocabulaire d’adieu de l’unité 1.
