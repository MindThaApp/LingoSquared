    title: Une conversation sur les saisons
    gloss: 'C’est maintenant le printemps. Les fleurs sont belles. Nina demande : Quelle saison trouves-tu belle ? Arjun dit : J’aime l’été. En été, nous nageons. Priya dit : J’aime l’hiver. En hiver, nous faisons du patin.'
