teaching:
  hi.a1.unit29.lesson01.teach.kul_kitna_hua:
    title: Demander le prix total
    gloss: Combien cela coûte-t-il au total ?
    note: '*कुल* signifie « total », et *कितना हुआ?* (« ça fait combien ? ») est la façon courante de demander le total.'
  hi.a1.unit29.lesson01.teach.kul_pachchees_rupye:
    title: Indiquer un prix total
    gloss: Ça fait deux cent cinquante roupies au total.
    note: '*हुए* s’accorde avec le pluriel *रुपये* : *कुल दो सौ पचास रुपये हुए* signifie littéralement « en tout, deux cent cinquante roupies sont venues ».'
  hi.a1.unit29.lesson02.teach.kard_se_pement:
    title: Payer par carte ou en espèces
    gloss: payer par carte, payer en espèces
    note: Le hindi dit *कार्ड से पेमेंट करना* (« faire le paiement par carte ») et *नकद पेमेंट करना* ; *से* marque le moyen de paiement.
    example_gloss:
    - Puis-je payer par carte ici ?
    - Je paie en espèces.
  hi.a1.unit29.lesson02.teach.kya_main_yahan:
    title: Demander s’il est possible de payer par carte
    gloss: Puis-je payer par carte ici ?
    note: '*यहाँ* (« ici ») indique le lieu, et *सकता हूँ* (« je peux ») vient après le groupe principal ; une femme dit *सकती हूँ*.'
  hi.a1.unit29.lesson02.teach.ap_nakad_pement:
    title: Demander le moyen de paiement souhaité
    gloss: Souhaitez-vous payer en espèces ou par carte ?
    note: '*आप ... करेंगे* est la question polie au futur qu’emploie un caissier, et *आप* prend le verbe au pluriel *करेंगे*.'
  hi.a1.unit29.lesson03.teach.bil:
    title: L’addition
    gloss: l’addition
    note: '*बिल* est un nom masculin : *एक बिल*, *बिल का*.'
    example_gloss: On partage l’addition ?
  hi.a1.unit29.lesson03.teach.bil_bant_len:
    title: Proposer de partager l’addition
    gloss: On partage l’addition ?
    note: '*बाँट लें?* (« on partage ? ») propose un projet commun sans dire *हम* ; *लें* est la forme « allons-y » de *लेना*.'
  hi.a1.unit29.lesson03.teach.kya_main_alag:
    title: Demander à payer séparément
    gloss: Puis-je payer séparément ?
    note: '*अलग से* signifie « séparément » et se place avant *पेमेंट कर सकता हूँ*.'
  hi.a1.unit29.lesson04.teach.bakee_paise:
    title: La monnaie
    gloss: la monnaie
    note: '*बाकी पैसे* (« l’argent restant ») est pluriel et désigne la monnaie qu’on vous rend.'
    example_gloss: Voici votre monnaie.
  hi.a1.unit29.lesson04.teach.ye_rahe_apke:
    title: Rendre la monnaie
    gloss: Voici votre monnaie.
    note: '*आपके* est le « votre » poli (*आप* + *के*), qui s’accorde avec le pluriel *पैसे*.'
  hi.a1.unit29.lesson04.teach.mujhe_bakee_paise:
    title: Refuser la monnaie
    gloss: Je n’ai pas besoin de monnaie.
    note: '*मुझे ... नहीं चाहिए* (« à moi ... n’est pas nécessaire ») est la façon de dire « je n’ai pas besoin de » ; *नहीं* se place avant *चाहिए*.'
  hi.a1.unit29.lesson05.teach.paintees:
    title: Trois cent cinquante
    gloss: trois cent cinquante
    note: '*तीन सौ पचास* est 350 : on dit d’abord les centaines, puis les dizaines.'
    example_gloss: Ça coûte trois cent cinquante roupies.
  hi.a1.unit29.lesson05.teach.bil_do_thalee:
    title: Lire une addition de restaurant
    gloss: 'Addition : deux thalis et deux thés. Total : trois cent cinquante roupies. Paiement : par carte.'
    note: Repère ce qui a été commandé, le total et le moyen de paiement.
    glosses:
      बिल: addition
      दो: deux
      थाली: thalis
      चाय: thés
      कुल: total
      तीन: trois
      सौ: cent
      पचास: cinquante
      रुपये: roupies
      पेमेंट: paiement
      कार्ड: carte
  hi.a1.unit29.lesson06.teach.priya_bil_mang:
    title: Priya demande l’addition
    gloss: 'Priya : On demande l’addition ?'
    note: '*माँग लें?* (« on la demande ? ») emploie de nouveau la forme « allons-y » de *लेना*, et *माँगना* signifie « demander ».'
  hi.a1.unit29.lesson06.teach.arjun_han_achchha:
    title: Arjun demande le total
    gloss: 'Arjun : Oui, bonne idée. Ça fait combien en tout ?'
    note: '*कुल कितना हुआ?* est la question du total vue plus haut, posée maintenant à table.'
  hi.a1.unit29.lesson06.teach.priya_paintees_rupye:
    title: Priya annonce le total
    gloss: 'Priya : Ça fait trois cent cinquante roupies. On partage ?'
    note: '*तीन सौ पचास रुपये हुए* annonce le total, et *बाँट लें?* demande « on partage ? ».'
  hi.a1.unit29.lesson06.teach.arjun_naheen_aj:
    title: Arjun insiste pour payer
    gloss: 'Arjun : Non, laisse-moi payer aujourd’hui. Tu m’as beaucoup aidé.'
    note: '*मुझे पेमेंट करने दो* signifie « laisse-moi payer », et *तुमने मेरी बहुत मदद की है* emploie *ने* parce que le verbe est au passé.'
  hi.a1.unit29.lesson06.teach.priya_tum_kitne:
    title: Priya est touchée
    gloss: 'Priya : C’est gentil de ta part ! Merci beaucoup.'
    note: '*तुम कितने अच्छे हो!* (« comme tu es gentil ! ») est un compliment chaleureux, et *शुक्रिया* signifie « merci ».'
  hi.a1.unit29.lesson06.teach.arjun_kya_main:
    title: Arjun demande s’il peut payer par carte
    gloss: 'Arjun : Je peux payer par carte ici ?'
    note: La question *क्या मैं यहाँ कार्ड से पेमेंट कर सकता हूँ?* revient, cette fois dans un vrai restaurant.
  hi.a1.unit29.lesson06.teach.arjun_bil_deta:
    title: 'देता है : il paie'
    gloss: Arjun règle l’addition.
    note: '*देता है* est la forme de *वह* de *देना* (« donner ») ; le hindi dit « donne l’addition » pour « règle l’addition ».'
