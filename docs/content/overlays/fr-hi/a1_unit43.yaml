  hi.a1.unit43.lesson05.teach.neena_aur_priya:
    title: Nina et Priya achètent des fleurs
    gloss: Nina et Priya vont au marché aux fleurs samedi. Quelle couleur Priya veut-elle ? Priya voudrait du rouge. Quelle couleur Nina veut-elle ? Nina voudrait du jaune. Elles achètent cinq fleurs. Ça coûte cent roupies. Les fleurs sont très belles !
    note: Ce texte récapitule la sortie du samedi au marché aux fleurs en reprenant la structure des textes comparatifs des unités sur la maison, le quartier, la poste, la cuisine et la personnalité.
    glosses:
      जाती: aller (féminin pluriel)
      शनिवार: samedi
      फूल-मंडी: marché aux fleurs
      रंग: couleur
      चाहिए: nécessaire / voulu
      को: indique qui veut
      लाल: rouge
      पीला: jaune
      ख़रीदती: acheter
      पाँच: cinq
      फूल: fleurs
      दाम: prix
      सौ: cent
      रुपये: roupies
      सुंदर: beau
