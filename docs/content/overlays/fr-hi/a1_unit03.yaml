teaching:
  hi.a1.unit03.lesson01.teach.aaj:
    title: Aujourd’hui
    gloss: aujourd’hui
    note: Le mot que tu réutiliseras dans presque chaque phrase de cette leçon.
    example_gloss: Il fait beau aujourd’hui.
  hi.a1.unit03.lesson01.teach.somvar:
    title: lundi
    gloss: lundi
    note: 'Nom tiré de सोम (la Lune) : comme en français, « lundi » est le jour de la Lune.'
    example_gloss: Le cours de yoga a lieu lundi.
  hi.a1.unit03.lesson01.teach.mangalvar:
    title: mardi
    gloss: mardi
    note: Nom tiré de मंगल (Mars), selon le même principe que la plupart des noms de jours en hindi.
    example_gloss: Aujourd'hui, c'est mardi.
  hi.a1.unit03.lesson01.teach.budhvar:
    title: mercredi
    gloss: mercredi
    note: Nom tiré de बुध (Mercure).
    example_gloss: Aujourd'hui, c'est mercredi.
  hi.a1.unit03.lesson01.teach.guruvar:
    title: jeudi
    gloss: jeudi
    note: Nom tiré de गुरु (Jupiter).
    example_gloss: Aujourd'hui, c'est jeudi.
  hi.a1.unit03.lesson01.teach.shukravar:
    title: vendredi
    gloss: vendredi
    note: Nom tiré de शुक्र (Vénus).
    example_gloss: Il n’y a pas de cours de yoga vendredi.
  hi.a1.unit03.lesson01.teach.shanivar:
    title: samedi
    gloss: samedi
    note: Nom tiré de शनि (Saturne).
    example_gloss: Aujourd'hui, c'est samedi.
  hi.a1.unit03.lesson01.teach.ravivar:
    title: Dimanche
    gloss: dimanche
    note: 'Nom tiré de रवि, un nom sanskrit du soleil : c’est le jour du Soleil.'
    example_gloss: Aujourd'hui, c'est dimanche.
  hi.a1.unit03.lesson01.teach.kaun_sa_din_hai:
    title: Demander quel jour on est
    gloss: Quel jour sommes-nous aujourd’hui ?
    note: '*Kaun sa* (« quel ») s’accorde avec le nom masculin *din* (« jour ») ; tu verras plus tard la forme féminine, *kaun si*, avec les noms féminins.'
  hi.a1.unit03.lesson01.teach.yoga_class_monday:
    title: Dire qu’un événement a lieu un certain jour
    gloss: Le cours de yoga a lieu lundi.
    note: '*Ko* après un nom de jour indique le jour où quelque chose a lieu : *somvar ko* signifie « lundi » (« le lundi »), sur le même modèle pour tous les jours de la semaine.'
  hi.a1.unit03.lesson01.teach.no_class_friday:
    title: Dire qu’un événement n’a pas lieu un certain jour
    gloss: Il n’y a pas de cours de yoga vendredi.
    note: Nahin rend la phrase négative ; ko marque toujours le jour, ici placé en tête de phrase pour l’insistance.
  hi.a1.unit03.lesson02.teach.jan_feb_mar:
    title: Janvier, février, mars
    gloss: janvier, février, mars
    note: 'Les noms des mois en hindi sont pour la plupart empruntés et se reconnaissent tout de suite une fois le principe compris : pas de nouvelle grammaire ici, seulement du vocabulaire.'
    example_gloss:
    - Mon anniversaire est en janvier.
    - Le prochain jour férié est en février.
    - Mon anniversaire est en mars.
  hi.a1.unit03.lesson02.teach.apr_may_jun:
    title: Avril, mai, juin
    gloss: avril, mai, juin
    note: Même principe, facile à reconnaître, que pour les trois premiers mois.
    example_gloss:
    - Le prochain jour férié est en avril.
    - Mon anniversaire est en mai.
    - Le prochain jour férié est en juin.
  hi.a1.unit03.lesson02.teach.jul_aug_sep:
    title: Juillet, août, septembre
    gloss: juillet, août, septembre
    note: Sitambar est écrit ici avec un anusvara (सितंबर) ; l’écriture avec un m demi-lettre (सितम्बर) est aussi courante et tout aussi correcte.
    example_gloss:
    - Mon anniversaire est en juillet.
    - Le prochain jour férié est en août.
    - Mon anniversaire est en septembre.
  hi.a1.unit03.lesson02.teach.oct_nov_dec:
    title: Octobre, novembre, décembre
    gloss: octobre, novembre, décembre
    note: Navambar et disambar utilisent le même anusvara que sitambar ; नवम्बर et दिसम्बर (avec un m demi-lettre) sont aussi courants et tout aussi corrects.
    example_gloss:
    - Le prochain jour férié est en octobre.
    - Mon anniversaire est en novembre.
    - Le prochain jour férié est en décembre.
  hi.a1.unit03.lesson02.teach.tareekh:
    title: Date
    gloss: date
    note: '*Tareekh* est un nom féminin : son mot interrogatif prend la forme féminine (*kitni tareekh*, jamais *kitna tareekh*), le même accord que celui vu à l’unité 2 avec *keemat* et *umra*.'
    example_gloss: Nous sommes le trois.
  hi.a1.unit03.lesson02.teach.mein_postposition:
    title: En / dans (avec un mois)
    gloss: 'en : s’emploie avec un nom de mois'
    note: '*Mein* marque un mois comme *ko* marque un jour : *janvari mein* signifie « en janvier », jamais *janvari ko*.'
  hi.a1.unit03.lesson02.teach.aaj_kitni_tareekh_hai:
    title: Demander la date
    gloss: Quelle est la date aujourd'hui ?
    note: Littéralement « combien est la date d’aujourd’hui » ; kitni s’accorde avec le féminin tareekh.
  hi.a1.unit03.lesson02.teach.aaj_teen_tareekh_hai:
    title: Donner la date avec un simple nombre
    gloss: Nous sommes le trois.
    note: 'Le hindi donne la date avec un simple nombre cardinal (*teen*, « trois »), un peu comme le français (« le trois janvier ») : il n’y a pas de mot spécial pour la date, seulement les nombres que tu connais déjà.'
  hi.a1.unit03.lesson02.teach.aaj_teen_january_hai:
    title: Donner la date avec le mois
    gloss: Nous sommes le trois janvier.
    note: Le même principe du nombre cardinal, avec en plus le nom du mois placé après.
  hi.a1.unit03.lesson03.teach.kab:
    title: Quand
    gloss: quand
    note: Un mot interrogatif simple et très fréquent.
    example_gloss: Quand a lieu le prochain cours ?
  hi.a1.unit03.lesson03.teach.agli:
    title: Prochain
    gloss: prochain
    note: '*Agli* est la forme féminine : *class* (क्लास) est traité comme un nom féminin dans le hindi courant, on dit donc *agli* et non le masculin *agla*.'
    example_gloss: Le prochain cours a lieu mardi.
  hi.a1.unit03.lesson03.teach.das_reprise:
    title: Dix
    gloss: dix
    note: Déjà vu à l’unité 2 ; nécessaire ici pour une vraie date.
    example_gloss: Le prochain cours a lieu le dix.
  hi.a1.unit03.lesson03.teach.janmadin:
    title: Anniversaire
    gloss: anniversaire
    note: 'Nom masculin : mera janmadin, jamais meri janmadin.'
    example_gloss: Mon anniversaire est en décembre.
  hi.a1.unit03.lesson03.teach.tumhara_janmadin_kab_hai:
    title: Demander à quelqu’un sa date d’anniversaire, de façon informelle
    gloss: Quand est ton anniversaire ? (informel)
    note: Tumhara s’accorde avec le masculin janmadin.
  hi.a1.unit03.lesson03.teach.mera_janmadin_january_mein_hai:
    title: Dire la date de son anniversaire
    gloss: Mon anniversaire est en janvier.
    note: La réponse complète naturelle à Tumhara janmadin kab hai ?
  hi.a1.unit03.lesson03.teach.agli_class_kab_hai:
    title: Demander quand a lieu le prochain cours
    gloss: Quand a lieu le prochain cours ?
    note: Associe agli (féminin, accordé avec class) et kab.
  hi.a1.unit03.lesson03.teach.agli_class_mangalvar_das_march:
    title: Donner le jour et la date complets
    gloss: Le prochain cours a lieu mardi 10 mars.
    note: 'Le jour de la semaine et la date se combinent comme en français : d’abord le jour, puis le numéro de la date et le mois.'
  hi.a1.unit03.lesson03.teach.dialogue.line01:
    title: Arjun demande quand a lieu le prochain cours
    gloss: Arjun demande quand a lieu le prochain cours de yoga.
    note: Reprend exactement la question de cette leçon, avec yog ajouté pour plus de clarté.
  hi.a1.unit03.lesson03.teach.dialogue.line02:
    title: Priya donne le jour et la date
    gloss: Priya dit que le prochain cours a lieu mardi 10 mars.
    note: Reprend exactement la phrase de cette leçon qui donne le jour et la date.
  hi.a1.unit03.lesson03.teach.dialogue.line03:
    title: Arjun la remercie
    gloss: Arjun dit d’accord, merci.
    note: Theek hai et shukriya reprennent tous deux du vocabulaire de l’unité 1.
  hi.a1.unit03.lesson03.teach.dialogue.line04:
    title: Priya répond
    gloss: Priya dit que ce n’est pas un problème.
    note: Koi baat nahin est une façon très courante et naturelle de dire « de rien » ou « pas de problème ».
  hi.a1.unit03.lesson03.teach.dialogue.line05:
    title: Arjun demande à Priya la date de son anniversaire
    gloss: Arjun demande à Priya quand est son anniversaire.
    note: Reprend exactement la question informelle de cette leçon sur l’anniversaire.
  hi.a1.unit03.lesson03.teach.dialogue.line06:
    title: Priya répond
    gloss: Priya dit que son anniversaire est en janvier.
    note: Reprend exactement la phrase de réponse de cette leçon.
  hi.a1.unit03.lesson03.teach.dialogue.line07:
    title: Arjun réagit et donne la date du sien
    gloss: Arjun réagit positivement, puis dit que son anniversaire est en décembre.
    note: Accha reprend le vocabulaire de l’unité 1 ; décembre a déjà été vu dans la leçon 2 de cette unité.
  hi.a1.unit03.lesson03.teach.dialogue.line08:
    title: Priya conclut la conversation
    gloss: Priya acquiesce et dit un au revoir décontracté.
    note: Theek hai et phir milte hain reprennent tous deux le vocabulaire d’adieu de l’unité 1.
