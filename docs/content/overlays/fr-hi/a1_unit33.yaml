    gloss: Je fais de l’exercice. Je joue au football.
    note: '*कसरत करना* désigne l’exercice en général, alors que *फ़ुटबॉल खेलना* nomme un sport précis.'
  hi.a1.unit33.lesson03.teach.kasrat_karna:
