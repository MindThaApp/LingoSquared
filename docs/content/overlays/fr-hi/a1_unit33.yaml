  hi.a1.unit33.lesson01.teach.main_futbol_khelta:
    title: Je joue au football
    gloss: Je joue au football.
    note: 'Le hindi emploie le verbe qui convient au sport : *खेलना* (« jouer ») pour le football, d’où *मैं फ़ुटबॉल खेलता हूँ*.'
  hi.a1.unit33.lesson01.teach.futbol_khelna_yog:
    title: खेलना ou करना
    gloss: 'Jouer au football, faire du yoga. Le hindi choisit le verbe selon le sport : *खेलना* pour les jeux comme le football et *करना* pour des activités comme le yoga, et le sport se place avant le verbe.'
    note: 'Une seule construction couvre tous les sports : inutile d’apprendre un verbe différent pour chaque sport à ce niveau.'
  hi.a1.unit33.lesson02.teach.hafte_men_do:
    title: Fois par semaine
    gloss: fois par semaine
    example_gloss: Je fais du yoga deux fois par semaine.
  hi.a1.unit33.lesson02.teach.main_hafte_men:
    title: हफ़्ते में दो बार
    gloss: Je cours deux fois par semaine. *हफ़्ते में दो बार* (« en une semaine, deux fois ») est une manière plus précise d’indiquer la fréquence que *रोज़* ou *अक्सर*, et cette expression se place avant le verbe.
    note: Cette expression enrichit le vocabulaire de la fréquence déjà vu dans l’unité sur les loisirs.
  hi.a1.unit33.lesson02.teach.main_hafte_men_2:
    title: Je fais du yoga deux fois par semaine
    gloss: Je fais du yoga deux fois par semaine.
  hi.a1.unit33.lesson02.teach.arjun_aksar_futbol:
    title: Arjun joue souvent au football
    gloss: Arjun joue souvent au football.
    note: '*अक्सर* (« souvent ») se place avant le verbe : *अर्जुन अक्सर फ़ुटबॉल खेलता है*.'
  hi.a1.unit33.lesson03.teach.main_kasrat_karta:
