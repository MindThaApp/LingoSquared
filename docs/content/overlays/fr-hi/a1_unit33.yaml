  hi.a1.unit33.lesson06.teach.priya_chalo_sath:
    title: Priya fait une proposition
    gloss: 'Priya : On fait de l’exercice ensemble ?'
  hi.a1.unit33.lesson06.teach.chalo_sath_men:
    title: चलो + खेलें
    gloss: Allez, jouons ensemble. *चलो* suivi de la forme en *-एँ* (*खेलें*) propose de faire quelque chose ensemble, c’est ainsi que le hindi dit « et si on… ».
    note: Cette phrase reprend exactement la construction servant à proposer une activité, vue dans l’unité sur les projets.
  hi.a1.unit33.lesson06.teach.neha_han_maza:
    title: Neha accepte
    gloss: 'Neha : Oui, ce sera sympa ! J’adore nager.'
  hi.a1.unit33.lesson06.teach.arjun_main_futbol:
    title: Arjun préfère le football
