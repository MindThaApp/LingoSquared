    title: दौड़ने जाना
    gloss: Il va courir tous les jours.
    note: '*दौड़ने जाना* (« aller courir ») place *दौड़ने* avant *जाना*, et *जाता है* s’accorde avec le sujet.'
  hi.a1.unit33.lesson04.teach.arjun_vah_main:
    title: Arjun réagit
    gloss: 'Arjun : Super, j’y joue souvent au football.'
  hi.a1.unit33.lesson05.teach.priya_hafte_men:
    title: Priya et Neha parlent de sport
    gloss: Priya fait du yoga deux fois par semaine. Elle aime faire de l’exercice tranquillement. Neha ne fait pas de yoga, mais elle adore nager. Neha nage souvent, presque toutes les semaines. Et toi, quel sport pratiques-tu ?
    note: 'Ce texte oppose deux sports et deux manières d’indiquer la fréquence : *हफ़्ते में दो बार* et *अक्सर, लगभग हर हफ़्ते* ; les verbes *करती है* et *तैरती है* sont au féminin.'
    glosses:
      करती: fait
      दो: deux
      बार: fois
      हफ़्ते: semaine
      योग: yoga
      पसंद: adore
      आराम: tranquillement
      कसरत: exercice
      तैरना: la natation
      तैरती: nage
      अक्सर: souvent
      लगभग: presque
      कौन: quel
      खेल: sport
