answer_policy:
  nasalization_marks: 'Display and teach the correct chandrabindu/anusvara distinction. This unit''s own new vocabulary needs one new, explicitly disclosed spelling decision: महंगा/महंगी ("expensive") uses अनुस्वार (ं), not चंद्रबिंदु -- this is a class-nasal-before-a-stop-consonant case (the same pattern as गंगा/मंगल), not an application of the existing word-final vowel-height convention that governs हूँ/हाँ/मैं/हैं/में. In typed A1 answers, accept a variant that drops a nasalization mark entirely or substitutes anusvara for chandrabindu (or vice versa) when every other character is correct. Do not extend this tolerance to a wrong vowel or consonant, which changes the actual word.'
  punctuation: Hindi text is shown with the traditional danda (।) as the sentence-final mark. In typed answers, accept the danda, a plain period (.), or the mark omitted entirely as equivalent. Question marks (?), exclamation marks, and commas may likewise be omitted, but the fully punctuated form remains the model answer.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register (aap vs. tum) rather than written punctuation or nasalization marks.
course:
  title: Hindi A1
units:
  hi.a1.unit07.shopping:
    title: Les achats
lessons:
  hi.a1.unit07.lesson01.dukaan_mein:
    title: Au magasin
  hi.a1.unit07.lesson02.keemat_aur_matra:
    title: Prix et quantité
  hi.a1.unit07.lesson03.priya_aur_arjun_ki_khareedari:
    title: Priya et Arjun font des achats
teaching:
  hi.a1.unit07.lesson01.teach.dukaan_bazaar:
    title: Boutique, marché
    gloss: boutique, marché
    note: Deux lieux courants pour faire des achats, utilisés tout au long de cette unité.
    example_gloss:
    - C’est une boutique.
    - C’est un marché.
  hi.a1.unit07.lesson01.teach.dukaandaar:
    title: Commerçant
    gloss: commerçant
    note: 'Un nouveau personnage dans cette unité : la personne qui tient une boutique, à qui l’on s’adresse avec aap, car c’est un inconnu.'
    example_gloss: C’est le commerçant.
  hi.a1.unit07.lesson01.teach.kameez_bag_topi:
    title: Chemise, sac, chapeau
    gloss: chemise, sac, chapeau
    note: Trois articles courants, utilisés tout au long de cette unité pour s’exercer avec la structure *mujhe ... chahiye* vue dans l’unité sur la nourriture.
    example_gloss:
    - Je voudrais une chemise.
    - Je voudrais un sac.
    - Je voudrais un chapeau.
  hi.a1.unit07.lesson01.teach.mujhe_yah_chahiye:
    title: Je voudrais ceci
    gloss: Je voudrais ceci.
    note: Une phrase universelle pour dire qu’on veut un article, qui réutilise *mujhe ... chahiye* de l’unité sur la nourriture avec *yah* (ceci).
  hi.a1.unit07.lesson01.teach.ji:
    title: Ji (titre de politesse)
    gloss: particule de politesse et de respect, comme ajouter « monsieur » ou « madame »
    note: S’ajoute après un nom ou un titre pour être plus poli ; courant quand on s’adresse à un inconnu, comme un commerçant.
    example_gloss: Bonjour, monsieur.
  hi.a1.unit07.lesson01.teach.sirf:
    title: Seulement
    gloss: seulement, juste
    note: S’emploie pour dire qu’on ne veut qu’une seule chose, et pas plusieurs.
    example_gloss: Je voudrais seulement une chemise.
  hi.a1.unit07.lesson01.teach.aapko_aur_kuch_chahiye:
    title: Désirez-vous autre chose ? (formel)
    gloss: Désirez-vous autre chose ?
    note: La question de suivi formelle et naturelle que pose un commerçant après avoir pris une partie de la commande ; elle reprend *aapko* et *chahiye*.
  hi.a1.unit07.lesson01.teach.ji_nahin_sirf_yah:
    title: Non, juste ça
    gloss: Non, juste ça.
    note: Une façon naturelle et polie de refuser d’autres articles ; elle reprend *ji* et *sirf* de cette leçon.
  hi.a1.unit07.lesson01.teach.tumhein_kya_chahiye_bataao:
    title: Dis-moi ce que tu voudrais
    gloss: Dis-moi ce que tu voudrais.
    note: La consigne informelle que ce cours utilise pour demander une réponse orale, comme dans l’unité sur la nourriture.
  hi.a1.unit07.lesson02.teach.keemat:
    title: Le prix
    gloss: le prix
    note: Repris de l’unité 2 (nombres et prix), revu ici dans le contexte des achats de cette unité.
    example_gloss: Quel en est le prix ?
  hi.a1.unit07.lesson02.teach.rupaye:
    title: Roupies
    gloss: roupies
    note: Le mot de la monnaie, repris de l’unité 2 et pratiqué ici avec deux prix différents.
    example_gloss:
    - Son prix est de deux cents roupies.
    - Son prix est de cinq cents roupies.
  hi.a1.unit07.lesson02.teach.iski_keemat_kya_hai:
    title: Quel en est le prix ?
    gloss: Quel en est le prix ?
    note: La façon courante de demander un prix, reprise directement de l’unité 2.
  hi.a1.unit07.lesson02.teach.iski_keemat_bees_rupaye_hai:
    title: Son prix est de deux cents roupies
    gloss: Son prix est de deux cents roupies.
    note: Un exemple de réponse à la question sur le prix ci-dessus.
  hi.a1.unit07.lesson02.teach.kitne_ka_ki_note:
    title: Kitne ka / kitne ki
    gloss: '''Yah kitne ka hai?'' s’emploie pour les objets masculins, et ''Yah kitne ki hai?'' pour les objets féminins -- *kitne* ne change jamais -- seul *ka/ki* change, selon la même alternance -a/-i que tu connais déjà avec *mera/meri* et *tumhara/tumhari*.'
    note: 'Une deuxième façon, très courante, de demander un prix, construite sur l’accord en genre déjà vu avec les possessifs : seule la particule ka/ki change, pas kitne.'
  hi.a1.unit07.lesson02.teach.yeh_kitne_ka_hai:
    title: Combien coûte ceci ? (masculin)
    gloss: Combien ça coûte ?
    note: S’emploie pour un objet masculin, par exemple un sac.
  hi.a1.unit07.lesson02.teach.yeh_kitne_ki_hai:
    title: Combien coûte ceci ? (féminin)
    gloss: Combien ça coûte ?
    note: S’emploie pour un objet féminin, par exemple un chapeau.
  hi.a1.unit07.lesson02.teach.sasta_mehenga:
    title: Bon marché, cher
    gloss: bon marché, cher
    note: Une paire d’adjectifs courante pour réagir à un prix ; les formes du masculin sont données ici.
    example_gloss:
    - Ce sac est bon marché.
    - Ce sac est cher.
  hi.a1.unit07.lesson02.teach.sasti_mehengi_note:
    title: Sasti et mehengi
    gloss: '''Sasta'' et ''mehenga'' changent eux aussi selon le masculin et le féminin, comme ''mera/meri'' -- avec les mots féminins, on dit ''sasti'' et ''mehengi'', par exemple ''yah topi sasti hai'' (ce chapeau est bon marché) ou ''yah kameez mehengi hai'' (cette chemise est chère).'
    note: Un deuxième exemple réel du même accord en genre, que ce cours signale régulièrement.
  hi.a1.unit07.lesson03.teach.khareedna:
    title: Acheter
    gloss: acheter
    note: Reprend la construction 'V + na chahta/chahti hun' (je veux...) vue dans l’unité 1 pour apprendre le yoga, appliquée ici à l’achat.
    example_gloss:
    - Je veux acheter cette chemise.
    - Je veux acheter ce chapeau.
  hi.a1.unit07.lesson03.teach.chalo_kuch_khareedte_hain:
    title: Allons acheter quelque chose !
    gloss: Allons acheter quelque chose !
    note: Une façon amicale et figée de proposer de faire les magasins ensemble ; elle ouvre le dialogue final de l’unité, sur le modèle du 'chalo, kuch khate hain!' de l’unité sur la nourriture.
  hi.a1.unit07.lesson03.teach.dialogue.line01:
    title: Arjun propose d’aller faire des achats
    gloss: Arjun propose d’aller acheter quelque chose.
    note: Reprend l’expression d’ouverture de cette unité.
  hi.a1.unit07.lesson03.teach.dialogue.line02:
    title: Priya est d’accord
    gloss: 'Priya est d’accord et se demande : une chemise ou un chapeau ?'
    note: Introduit *ya* (ou) pour proposer un choix entre deux articles.
  hi.a1.unit07.lesson03.teach.dialogue.line03:
    title: Le commerçant les accueille
    gloss: Le commerçant les salue et leur demande ce qu’ils désirent.
    note: La salutation formelle au registre aap, qui reprend *aapko kya chahiye* de la leçon 1.
  hi.a1.unit07.lesson03.teach.dialogue.line04:
    title: Priya s’informe sur une chemise
    gloss: Priya salue poliment le commerçant, demande une chemise, puis s’enquiert de son prix.
    note: Combine *ji*, *mujhe ... chahiye* et *iski keemat kya hai*.
  hi.a1.unit07.lesson03.teach.dialogue.line05:
    title: Le commerçant donne le prix
    gloss: Le commerçant dit que son prix est de trois cents roupies.
    note: Reprend la structure *iski keemat ... rupaye hai* avec un nouveau nombre.
  hi.a1.unit07.lesson03.teach.dialogue.line06:
    title: Priya réagit et se décide
    gloss: 'Priya dit : trois cents roupies ? C’est bon marché ! Je voudrais cette chemise.'
    note: Reprend *sasti* de la note de grammaire de la leçon 2.
  hi.a1.unit07.lesson03.teach.dialogue.line07:
    title: Arjun s’informe sur un chapeau
    gloss: Arjun dit qu’il voudrait un chapeau et demande combien il coûte.
    note: Reprend la forme féminine *kitne ki hai* de la leçon 2.
  hi.a1.unit07.lesson03.teach.dialogue.line08:
    title: Le commerçant répond
    gloss: Le commerçant dit que le chapeau coûte cinq cents roupies.
    note: Reprend *paanch sau* (cinq cents) de la leçon 2.
  hi.a1.unit07.lesson03.teach.dialogue.line09:
    title: Arjun réagit et se décide quand même
    gloss: 'Arjun dit : cinq cents roupies ? C’est cher ! D’accord, je voudrais ce chapeau.'
    note: Reprend *mehengi* de la note de grammaire de la leçon 2, puis il décide de l’acheter quand même.
  hi.a1.unit07.lesson03.teach.dialogue.line10:
    title: Le commerçant demande si c’est tout
    gloss: 'Le commerçant dit : d’accord, désirez-vous autre chose ?'
    note: Reprend *aapko aur kuch chahiye* de la leçon 1.
  hi.a1.unit07.lesson03.teach.dialogue.line11:
    title: Priya conclut la commande
    gloss: Priya dit non, juste ça, merci !
    note: Reprend *ji nahin, sirf yah* de la leçon 1, ainsi que *shukriya*.
  hi.a1.unit07.lesson03.teach.dialogue.line12:
    title: Le commerçant dit au revoir
    gloss: Le commerçant dit merci et à bientôt.
    note: Reprend la formule de clôture habituelle de ce cours.
