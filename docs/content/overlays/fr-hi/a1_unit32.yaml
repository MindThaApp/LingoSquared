teaching:
  hi.a1.unit32.lesson01.teach.janvar_paltoo_janvar:
    title: Un animal, un animal de compagnie
    gloss: l’animal / un animal de compagnie
    note: '*जानवर* est le mot général pour « animal », et *पालतू जानवर* (littéralement « animal apprivoisé ») signifie « animal de compagnie ».'
    example_gloss:
    - Un chien est un animal.
    - Un chien est aussi un animal de compagnie.
  hi.a1.unit32.lesson01.teach.kutta_billee:
    title: Le chien et le chat
    gloss: le chien / le chat
    example_gloss:
    - Priya a un chien.
    - Vikram a un chat.
  hi.a1.unit32.lesson01.teach.machhlee_chiriya:
    title: Le poisson et l’oiseau
    gloss: le poisson / l’oiseau
    example_gloss:
    - Grand-père a un poisson.
    - Nina a un oiseau.
  hi.a1.unit32.lesson01.teach.kya_tumhare_pas:
    title: As-tu un animal de compagnie ?
    gloss: As-tu un animal de compagnie ?
    note: '*तुम्हारे पास ... है?* (littéralement « près de toi ... est ? ») signifie « as-tu ... ? », et *कोई* (« un, quelque ») laisse la question ouverte.'
  hi.a1.unit32.lesson01.teach.han_mere_pas:
    title: Oui, j’ai un chien
    gloss: Oui, j’ai un chien.
    note: Une réponse affirmative simple qui utilise le nouveau vocabulaire de cette unité.
  hi.a1.unit32.lesson01.teach.naheen_mere_pas:
    title: Non, je n’ai pas d’animal de compagnie
    gloss: Non, je n’ai pas d’animal de compagnie.
    note: '*कोई ... नहीं है* (« il n’y a aucun ... ») signifie qu’on n’en a pas.'
  hi.a1.unit32.lesson01.teach.mere_pas_koee:
    title: कोई ... नहीं
    gloss: Je n’ai pas d’animal de compagnie.
    note: '*कोई* (« aucun ») suivi de *नहीं है* nie la possession : *मेरे पास कोई पालतू जानवर नहीं है*.'
  hi.a1.unit32.lesson02.teach.ghumane_le_jana:
    title: Promener un animal
    gloss: promener un animal
    note: '*घुमाने ले जाना* (« emmener se promener ») est la façon de dire « promener un animal » en hindi ; *घुमाने* est suivi de *ले जाना*.'
    example_gloss: Je promène le chien tous les jours.
  hi.a1.unit32.lesson02.teach.vah_kutte_ko:
    title: घुमाने ले जाना
    gloss: Elle promène le chien.
    note: L’animal est suivi de *को* (*कुत्ते को*), et *घुमाने ले जाती है* vient en dernier ; *ले जाना* (« emmener ») reste en deux mots.
  hi.a1.unit32.lesson02.teach.khana_dena:
    title: Donner à manger
    gloss: donner à manger
    example_gloss: Je donne à manger au chat tous les jours.
  hi.a1.unit32.lesson02.teach.ke_sath_khelna:
    title: Jouer avec
    gloss: jouer avec
    example_gloss: Vikram joue avec son chat.
  hi.a1.unit32.lesson02.teach.main_roz_kutte:
    title: Je promène le chien tous les jours
    gloss: Je promène le chien tous les jours.
    note: '*रोज़* (« chaque jour ») se place avant l’objet : *रोज़ कुत्ते को घुमाने ले जाता हूँ*.'
  hi.a1.unit32.lesson02.teach.main_roz_billee:
    title: Je donne à manger au chat tous les jours
    gloss: Je donne à manger au chat tous les jours.
    note: '*खाना देना* (« donner à manger ») marque celui qui reçoit la nourriture avec *को* : *बिल्ली को खाना देता हूँ*.'
  hi.a1.unit32.lesson03.teach.ek_kutta_do:
    title: Les formes du pluriel
    gloss: Un chien, deux chiens ; un chat, deux chats. Un nom masculin en *-आ* prend *-ए* au pluriel (*कुत्ता* devient *कुत्ते*), tandis qu’un nom féminin en *-ई* prend *-याँ* (*बिल्ली* devient *बिल्लियाँ*).
    note: Le schéma régulier du pluriel en hindi, présenté ici pour la première fois avec des noms d’animaux comme exemples.
  hi.a1.unit32.lesson03.teach.kutte_billiyan:
    title: Les chiens et les chats
    gloss: chiens / chats
    example_gloss:
    - Arjun adore les chiens.
    - Neha adore les chats.
  hi.a1.unit32.lesson03.teach.machhliyan_chiriyan:
    title: Les poissons et les oiseaux
    gloss: poissons / oiseaux
    example_gloss:
    - J’adore les poissons.
    - Grand-père adore les oiseaux.
  hi.a1.unit32.lesson03.teach.mujhe_janvar_bahut:
    title: J’adore les animaux
    gloss: J’adore les animaux.
    note: '*मुझे जानवर बहुत पसंद हैं* (littéralement « à moi, les animaux sont très plaisants ») signifie « j’adore les animaux » ; *हैं* est au pluriel parce que *जानवर* est au pluriel.'
  hi.a1.unit32.lesson03.teach.neha_ko_billiyan:
    title: Neha adore les chats, mais n’a pas d’animal
    gloss: Neha adore les chats, mais elle n’a pas d’animal de compagnie.
    note: Cette phrase souligne la différence entre adorer un animal et en avoir un.
  hi.a1.unit32.lesson04.teach.arjun_kya_tumhare:
    title: Arjun demande si elle a un animal
    gloss: 'Arjun : Tu as un animal de compagnie, Priya ?'
  hi.a1.unit32.lesson04.teach.priya_han_mere:
    title: Priya a un chien
    gloss: 'Priya : Oui, j’ai un chien.'
  hi.a1.unit32.lesson04.teach.arjun_vah_kaisa:
    title: Arjun demande à quoi il ressemble
    gloss: 'Arjun : Il est comment ?'
    note: '*वह कैसा दिखता है?* s’emploie aussi pour les animaux, et *कैसा* est au masculin parce que le chien est un mâle.'
  hi.a1.unit32.lesson04.teach.priya_uske_bal:
    title: Priya décrit son chien
    gloss: 'Priya : Il a le poil brun et il est petit.'
    note: On réutilise le vocabulaire de la couleur des cheveux et de la taille, étudié pour décrire l’apparence, mais cette fois pour parler du pelage d’un animal.
  hi.a1.unit32.lesson04.teach.vah_mera_kutta:
    title: वह pour les animaux
    gloss: C’est mon chien. je l’aime beaucoup.
    note: '*वह* et *उसे* s’emploient aussi bien pour les animaux que pour les personnes ; l’hindi n’a pas de mot distinct pour « il/elle » au sens de « cela » ici.'
  hi.a1.unit32.lesson04.teach.arjun_kya_tum:
    title: Arjun demande si elle le promène
    gloss: 'Arjun : Tu le promènes tous les jours ?'
  hi.a1.unit32.lesson04.teach.priya_han_main:
    title: Priya décrit sa routine
    gloss: 'Priya : Oui, je le promène tous les jours et je lui donne à manger.'
  hi.a1.unit32.lesson05.teach.arjun_aur_neha:
    title: Arjun, Neha et Vikram parlent des animaux
    gloss: 'Arjun et Neha adorent tous les deux les animaux, mais aucun des deux n’a d’animal de compagnie. Arjun adore les chiens et Neha adore les chats. Vikram, lui, a un animal de compagnie : un chat. Il joue souvent avec son chat et lui donne à manger tous les jours. Et toi, as-tu un animal de compagnie ?'
    note: Ce texte met en contraste le fait d’adorer un animal et celui d’en avoir réellement un.
    glosses:
      पसंद: adorer
      दोनों: tous les deux
      जानवर: animaux
      किसी: l’un d’eux
      पालतू: animal de compagnie
      कुत्ते: chiens
      बिल्लियाँ: chats
      बिल्ली: chat
      खेलता: joue
      देता: donne
      रोज़: tous les
      खाना: nourriture
  hi.a1.unit32.lesson05.teach.vikram_aksar_apnee:
    title: Vikram joue souvent avec son chat
    gloss: Vikram joue souvent avec son chat.
    note: '*अक्सर* (« souvent ») se place avant le verbe, et *अपनी* s’accorde avec le féminin *बिल्ली*.'
  hi.a1.unit32.lesson05.teach.mujhe_kutte_bahut:
    title: J’adore les chiens. Je n’ai pas d’animal de compagnie.
    gloss: J’adore les chiens. Je n’ai pas d’animal de compagnie.
    note: Un modèle de réponse en deux phrases, prêt à être réutilisé pour l’exercice d’expression écrite de cette unité.
  hi.a1.unit32.lesson06.teach.priya_neena_kya:
    title: Priya interroge Nina
    gloss: 'Priya : Nina, toi aussi, tu as un animal de compagnie ?'
  hi.a1.unit32.lesson06.teach.neena_han_mere:
    title: Nina a un oiseau qui s’appelle Pico
    gloss: 'Nina : Oui, j’ai un oiseau. Il s’appelle Pico.'
    note: '*उसका नाम पीको है* (« son nom est Pico ») emploie *का* parce que *नाम* est masculin.'
  hi.a1.unit32.lesson06.teach.arjun_vah_kitna:
    title: Arjun réagit
    gloss: 'Arjun : Oh, c’est super ! Qu’est-ce que tu fais avec lui tous les jours ?'
  hi.a1.unit32.lesson06.teach.neena_main_use:
    title: Nina le nourrit tous les jours
    gloss: 'Nina : Je le nourris tous les jours.'
  hi.a1.unit32.lesson06.teach.arjun_mujhe_bhee:
    title: Arjun aime aussi les oiseaux
    gloss: 'Arjun : Moi aussi, j’adore les oiseaux.'
  hi.a1.unit32.lesson06.teach.priya_kitna_achchha:
    title: Priya conclut la conversation
    gloss: 'Priya : C’est chouette que nous trois, nous adorions les animaux !'
    note: Cette phrase réunit ce que les trois personnages ont dit sur les animaux dans cette unité.
