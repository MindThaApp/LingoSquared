    title: Nina découvre la personnalité de chacun
    gloss: Nina est nouvelle au café des langues. Elle demande à Arjun comment sont les autres. Arjun lui répond. Priya est gentille et patiente ; elle travaille comme infirmière. Vikram est drôle et suit un cours d’espagnol. Neha est curieuse ; elle aime apprendre des choses nouvelles. Arjun lui-même est calme.
    note: Ce texte récapitule les traits de caractère des membres du groupe en les comparant.
