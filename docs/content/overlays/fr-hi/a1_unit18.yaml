    - Combien y a-t-il de pièces dans la maison ?
  hi.a1.unit18.lesson01.teach.kamra_kamre:
    title: Pièce (singulier / pluriel)
    gloss: pièce, pièces
    note: 'Un nouveau nom. Fais attention au pluriel : *kamra* (une) devient *kamre* (plusieurs) ; voir la note de grammaire de cette leçon.'
    example_gloss:
    - Il y a une pièce dans la maison.
    - Il y a trois pièces dans la maison.
  hi.a1.unit18.lesson01.teach.grammar_room_plural:
    title: Pluriel masculin -a → -e
    gloss: 'Les noms masculins qui se terminent en « -a » prennent « -e » au pluriel : « kamra » (un) devient « kamre » (plusieurs). Le verbe change aussi selon le nombre : « hai » pour un, « hain » pour plusieurs, par exemple « ghar mein ek kamra hai » mais « ghar mein teen kamre hain ».'
    note: Première règle de pluriel des noms enseignée formellement dans ce cours, présentée avant tout exercice qui s’en sert.
  hi.a1.unit18.lesson01.teach.rasoi:
