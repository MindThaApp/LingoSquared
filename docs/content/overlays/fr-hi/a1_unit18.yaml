  hi.a1.unit18.lesson03.teach.grammar_summary:
    title: Trois règles principales
    gloss: 'Les trois règles principales de cette unité : (1) « [lieu] + mein + [nombre] + [nom] + hai/hain » indique ce qu’il y a dans une maison et en quelle quantité ; (2) les noms masculins en « -a » font leur pluriel en « -e » (kamra -> kamre) ; (3) les noms féminins en « -i » font leur pluriel en « -iyan » (kursi -> kursiyan, khidki -> khidkiyan).'
    note: Un récapitulatif qui rassemble toute la grammaire de l’unité, comme les notes de synthèse des unités 15 à 17.
  hi.a1.unit18.lesson03.teach.home_reading:
    title: 'Lecture : deux maisons'
    gloss: 'La maison de Priya est petite. Il y a deux pièces dans la maison : une cuisine et une salle de bains. La maison d’Arjun est grande. Il y a trois chambres dans la maison et une grande cuisine.'
    note: Un court portrait, sans nouveau récit, qui reprend exactement les faits du dialogue, sans rien ajouter – il répond directement à l’objectif « lire une courte description de logement ».
    glosses:
      घर: maison
      छोटा: petit
      कमरे: pièces
      रसोई: cuisine
      बाथरूम: salle de bains
      बड़ा: grand
      बेडरूम: chambres
      बड़ी: grande (féminin)
