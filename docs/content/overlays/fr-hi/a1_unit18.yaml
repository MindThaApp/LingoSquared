  hi.a1.unit18.lesson01.teach.ghar_review:
    title: 'Révision : maison'
    gloss: maison
    note: Vu pour la première fois dans l’unité 8 ; c’est le mot-clé de toute cette unité.
    example_gloss: C’est une maison.
  hi.a1.unit18.lesson01.teach.mein_review:
    title: 'Révision : dans / à'
    gloss: dans / à
    note: Vu pour la première fois dans l’unité 1 ; employé dans toute cette unité pour situer les pièces et les objets.
    example_gloss: Je travaille au bureau.
  hi.a1.unit18.lesson01.teach.hai_hain_review:
    title: 'Révision : est, sont'
    gloss: est (singulier), sont (pluriel)
    note: Le couple de copules singulier/pluriel dont dépend tout le schéma de quantité de cette unité.
    example_gloss:
    - C’est une maison.
    - Mon grand-père habite à Delhi.
  hi.a1.unit18.lesson01.teach.numbers_review:
    title: 'Révision : combien, un, deux, trois'
    gloss: combien, un, deux, trois
    note: Vus pour la première fois dans les unités 2 et 7 ; repris ici pour compter les pièces.
