  hi.a1.unit18.lesson02.teach.grammar_feminine_plural:
    title: Pluriel féminin -i → -iyan
    gloss: 'Les noms féminins qui se terminent en « -i » prennent « -iyan » au pluriel : « kursi » (une) devient « kursiyan » (plusieurs), comme « kamra » est devenu « kamre » plus haut dans cette unité avec la règle du masculin ; mais la règle est ici différente, car ce mot est féminin et se termine en « -i ».'
    note: Deuxième règle de pluriel de cette unité, enseignée volontairement juste après la première pour que le contraste soit facile à voir.
  hi.a1.unit18.lesson02.teach.bistar:
