  hi.a1.unit14.lesson03.arjun_priya_tulna:
    title: 'Arjun et Priya : les comparaisons'
teaching:
  hi.a1.unit14.lesson01.teach.arjun_priya_review:
    title: 'Révision : Arjun, Priya, est'
    gloss: Arjun, Priya, est
    note: Petit rappel des prénoms des deux personnages et de la copule 'hai', utiles pour construire les phrases comparatives de cette unité.
    example_gloss:
    - Arjun va bien.
    - Priya va bien.
  hi.a1.unit14.lesson01.teach.bada_badi_review:
    title: 'Révision : grand / plus âgé'
    gloss: grand / plus âgé (masculin / féminin)
    note: Vu à l’unité 5 pour l’âge des frères et sœurs ; ici, on l’étend à la comparaison directe de deux personnes ou de deux objets.
    example_gloss:
    - Mon grand frère habite à Delhi.
    - Ma grande sœur habite à Delhi.
  hi.a1.unit14.lesson01.teach.chota_choti_review:
    title: 'Révision : petit / plus jeune'
    gloss: petit / plus jeune (masculin / féminin)
    note: Vu à l’unité 5 pour l’âge des frères et sœurs ; il s’emploie ici de la même façon que bada/badi.
    example_gloss:
    - Mon petit frère est étudiant maintenant.
    - Ma petite sœur est étudiante maintenant.
  hi.a1.unit14.lesson01.teach.se_comparative_grammar:
    title: Se = que (comparatif)
    gloss: '''Se'' a déjà été vu au sens de « à partir de » (unité 9, ''yahan se seedhe jao'') et de « avec » (unité 12, ''Priya se mila''). Il sert maintenant aussi à comparer : ''X, Y se ADJ hai'' signifie « X est plus ADJ que Y », comme dans ''Priya Arjun se badi hai''.'
    note: Présente un troisième sens d’un mot déjà vu, en rappelant les deux premiers par leur numéro d’unité avant d’introduire le nouveau.
  hi.a1.unit14.lesson01.teach.arjun_bada_phrase:
    title: Priya est plus âgée qu’Arjun.
    gloss: Priya est plus âgée qu’Arjun.
    note: Premier exemple complet de la structure comparative avec se.
  hi.a1.unit14.lesson01.teach.lamba_lambi:
    title: Grand / long
    gloss: grand / long (masculin / féminin)
    note: Nouvelle paire d’adjectifs, qui suit l’accord -a/-i entre masculin et féminin déjà vu (bada/badi, chota/choti).
    example_gloss:
    - Mon frère est grand.
    - Ma sœur est grande.
  hi.a1.unit14.lesson01.teach.agreement_grammar:
    title: L’adjectif s’accorde avec le sujet
    gloss: 'Dans une phrase comparative, l’adjectif (comme bada/badi, chota/choti) s’accorde toujours avec le genre du SUJET, et non avec le mot placé après ''se'' : dans ''Arjun Priya se chota hai'', ''chota'' s’accorde avec Arjun (le sujet masculin), pas avec Priya.'
    note: Prolongement direct de l’accord des adjectifs en -a/-i déjà vu, appliqué ici aux phrases comparatives.
  hi.a1.unit14.lesson01.teach.priya_chota_phrase:
    title: Arjun est plus jeune que Priya.
    gloss: Arjun est plus jeune que Priya.
    note: Le même fait énoncé dans l’autre sens ; on voit l’accord avec un sujet masculin.
  hi.a1.unit14.lesson01.teach.kaun_ya_review:
    title: 'Révision : qui, ou'
    gloss: qui, ou
    note: Deux mots déjà vus (unité 5 et unités 6/13), réutilisés ici pour poser une question de comparaison.
    example_gloss: Qui est le plus âgé, Arjun ou Priya ?
  hi.a1.unit14.lesson02.teach.topi_bag_review:
    title: 'Révision : chapeau, sac'
    gloss: chapeau, sac
    note: Deux noms vus à l’unité 7, consacrée aux achats ; ils servent ici de termes de comparaison.
    example_gloss:
    - Ce chapeau est joli.
    - Ce sac est joli.
  hi.a1.unit14.lesson02.teach.sasta_mehnga_review:
    title: 'Révision : bon marché, cher'
    gloss: bon marché, cher
    note: Vus à l’unité 7 ; réutilisés ici pour comparer des objets.
    example_gloss:
    - Le sac est bon marché.
    - Le sac est cher.
  hi.a1.unit14.lesson02.teach.sasti_mehngi_note:
    title: 'Formes féminines : sasti, mehngi'
    gloss: '''Sasta'' et ''mehnga'' deviennent ''sasti'' et ''mehngi'' avec les mots féminins, comme dans ''topi sasti hai'' (le chapeau est bon marché).'
    note: Rappel de la règle d’accord de l’unité 7, utile car 'topi' (chapeau) est féminin.
  hi.a1.unit14.lesson02.teach.se_object_phrase:
    title: Le chapeau est moins cher que le sac.
    gloss: Le chapeau est moins cher que le sac.
    note: La structure comparative avec se, appliquée à deux objets plutôt qu’à deux personnes.
  hi.a1.unit14.lesson02.teach.zyada_review:
    title: 'Révision : plus'
    gloss: plus
    note: Vu à l’unité 13 uniquement avec 'pasand hai' (pour exprimer une préférence) ; cette leçon en généralise l’emploi.
    example_gloss: Je préfère le thé.
  hi.a1.unit14.lesson02.teach.zyada_mehnga_grammar:
    title: Zyada dans toute comparaison
    gloss: '''Zyada'' n’a été vu qu’avec ''pasand hai'' (unité 13). Il peut aussi se placer devant N’IMPORTE QUEL adjectif dans une comparaison : ''bag topi se zyada mehnga hai'' signifie « le sac est plus cher que le chapeau », exactement comme ''bag topi se mehnga hai''. ''Zyada'' est facultatif ; il ne fait que dire « plus » explicitement.'
    note: Généralisation annoncée de la place d’un mot déjà vu ; ce n’est pas un nouveau point de grammaire.
  hi.a1.unit14.lesson02.teach.zyada_mehnga_phrase:
    title: Le sac est plus cher que le chapeau.
    gloss: Le sac est plus cher que le chapeau.
    note: La même structure comparative avec zyada (plus), facultatif, exprimé explicitement.
  hi.a1.unit14.lesson02.teach.naya_nai:
    title: Nouveau
    gloss: nouveau / nouvelle (masculin / féminin)
    note: Nouvelle paire d’adjectifs, qui suit le même accord -a/-i que tous les autres adjectifs de cette unité.
    example_gloss:
    - Le sac est neuf.
    - Le chapeau est neuf.
  hi.a1.unit14.lesson02.teach.topi_nai_phrase:
    title: Le chapeau est plus récent que le sac.
    gloss: Le chapeau est plus récent que le sac.
    note: Une seconde comparaison (la nouveauté) entre les deux mêmes objets, dans la continuité de la comparaison des prix.
  hi.a1.unit14.lesson03.teach.review_words:
    title: 'Révision : grand, petit, long, nouveau'
    gloss: grand/plus âgé, petit/plus jeune, grand/long, nouveau
    note: Révision rapide des adjectifs clés de l’unité, utile pour le dialogue et le texte à lire.
    example_gloss:
    - Priya est plus âgée.
    - Arjun est plus jeune.
    - Arjun est grand.
    - Le sac est neuf.
  hi.a1.unit14.lesson03.teach.main_hun_review:
    title: 'Révision : je, suis'
    gloss: je, suis
    note: Vu à l’unité 1 ('main theek hun') ; utile pour qu’Arjun parle de lui-même dans le dialogue.
    example_gloss: Je vais bien.
  hi.a1.unit14.lesson03.teach.aur_bhi_review:
    title: 'Révision : et, aussi'
    gloss: et, aussi
    note: Ces deux mots sont déjà apparus dans des dialogues, mais sont présentés ici pour la première fois comme vocabulaire à retenir.
    example_gloss:
    - J’aime le thé et le café.
    - Moi aussi, j’aime ça.
  hi.a1.unit14.lesson03.teach.ka_review:
    title: 'Révision : « de » (possessif)'
    gloss: de (marque du possessif)
    note: La marque du possessif, déjà employée tout au long du cours (par ex. unités 5 à 11) ; ici, elle sert à dire à qui appartient le sac comparé.
    example_gloss: Le sac d’Arjun est neuf.
  hi.a1.unit14.lesson03.teach.dialogue.line01:
    title: Arjun montre son nouveau sac
    gloss: Priya, voici mon nouveau sac.
  hi.a1.unit14.lesson03.teach.dialogue.line02:
    title: Priya dit que le chapeau est moins cher
    gloss: Joli sac ! Mais le chapeau est moins cher qu’un sac.
  hi.a1.unit14.lesson03.teach.dialogue.line03:
    title: Arjun reconnaît que son sac est cher
    gloss: 'Oui. Mon sac est cher : il est plus cher qu’un chapeau.'
  hi.a1.unit14.lesson03.teach.dialogue.line04:
    title: Priya demande qui est le plus âgé
    gloss: D’accord, d’accord ! Arjun, qui est le plus âgé, toi ou moi ?
  hi.a1.unit14.lesson03.teach.dialogue.line05:
    title: Arjun répond
    gloss: Tu es plus âgée, mais moi, je suis grand !
  hi.a1.unit14.lesson03.teach.dialogue.line06:
    title: Priya dit que le chapeau est aussi plus récent
    gloss: D’accord, d’accord ! Mais le chapeau est aussi plus récent que le sac.
  hi.a1.unit14.lesson03.teach.dialogue.line07:
    title: Arjun est d’accord et conclut
    gloss: Oui, c’est vrai. On se revoit demain ?
  hi.a1.unit14.lesson03.teach.dialogue.line08:
    title: Priya conclut
    gloss: D’accord ! À demain.
  hi.a1.unit14.lesson03.teach.grammar_summary:
    title: Trois règles principales
    gloss: 'Les trois règles principales de cette unité : (1) ''X, Y se ADJ hai'' signifie « X est plus ADJ que Y » ; (2) l’ADJ s’accorde toujours avec le genre du sujet (X), et non avec Y ; (3) on peut aussi placer ''zyada'' devant l’ADJ, comme dans ''X, Y se zyada ADJ hai'' : le sens reste le même (« plus ADJ que »).'
    note: Récapitulatif final qui réunit toute la grammaire de l’unité, à l’image de la note de grammaire de l’unité 13 qui rassemblait le paradigme.
  hi.a1.unit14.lesson03.teach.priya_note:
    title: Le mot de Priya
    gloss: 'Je suis plus âgée qu’Arjun, mais Arjun est grand. Et mon chapeau est joli : le chapeau est moins cher que le sac, et il est aussi plus récent que le sac. – Priya'
    note: Court mot écrit qui reprend exactement les faits déjà établis dans le dialogue, sans rien ajouter.
    glosses:
      बड़ी: plus âgée
      लंबा: grand
      टोपी: chapeau
      अच्छी: bonne
      बैग: sac
      सस्ती: moins chère / bon marché
      नई: plus récente / nouvelle
