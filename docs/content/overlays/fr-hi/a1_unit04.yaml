units:
  hi.a1.unit04.time:
    title: L’heure
lessons:
  hi.a1.unit04.lesson01.kitne_baje_hain:
    title: Quelle heure est-il ?
  hi.a1.unit04.lesson02.din_ka_samay:
    title: Les moments de la journée
  hi.a1.unit04.lesson03.agli_class_ka_samay:
    title: L’heure du prochain cours
teaching:
  hi.a1.unit04.lesson01.teach.baje:
    title: Heures pile
    gloss: heures (deux ou plus)
    note: S’emploie avec toutes les heures sauf une heure — voir plus loin dans cette leçon la forme spéciale pour *une heure*.
    example_gloss: Il est cinq heures maintenant.
  hi.a1.unit04.lesson01.teach.abhi:
    title: Maintenant
    gloss: maintenant
    note: Un mot de temps simple que tu utiliseras sans cesse pour dire l’heure qu’il est.
    example_gloss: Il est dix heures maintenant.
  hi.a1.unit04.lesson01.teach.ek_do_teen:
    title: Un, deux, trois
    gloss: un, deux, trois
    note: Repris de l’unité 2 et nécessaire ici pour dire l’heure — remarque que *ek* prend la forme spéciale *baja*, alors que *do* et *teen* prennent la forme habituelle *baje*.
    example_gloss:
    - Il est une heure maintenant.
    - Il est deux heures maintenant.
    - Il est trois heures maintenant.
  hi.a1.unit04.lesson01.teach.chaar_paanch_chhah:
    title: Quatre, cinq, six
    gloss: quatre, cinq, six
    note: Repris de l’unité 2 — les trois prennent la forme habituelle *baje*.
    example_gloss:
    - Il est quatre heures maintenant.
    - Il est cinq heures maintenant.
    - Il est six heures maintenant.
  hi.a1.unit04.lesson01.teach.saat_aath_nau:
    title: Sept, huit, neuf
    gloss: sept, huit, neuf
    note: Repris de l’unité 2.
    example_gloss:
    - Il est sept heures maintenant.
    - Il est huit heures maintenant.
    - Il est neuf heures maintenant.
  hi.a1.unit04.lesson01.teach.das_gyaarah_baarah:
    title: Dix, onze, douze
    gloss: dix, onze, douze
    note: Repris de l’unité 2 — les derniers nombres d’heures dont tu auras besoin.
    example_gloss:
    - Il est dix heures maintenant.
    - Il est onze heures maintenant.
    - Il est douze heures maintenant.
  hi.a1.unit04.lesson01.teach.baja_grammar_note:
    title: Baja ou baje
    gloss: '*Baja* s’emploie avec *un*, *baje* avec tous les autres nombres : *ek baja hai*, *do baje hain*.'
    note: Une vraie exception d’accord, et non une simplification — *ek baja hai* est la seule heure qui utilise la forme du singulier.
  hi.a1.unit04.lesson01.teach.kitne_baje_hain:
    title: Demander l’heure
    gloss: Quelle heure est-il ?
    note: Littéralement « combien d’heures y a-t-il » — la façon habituelle de demander l’heure.
  hi.a1.unit04.lesson01.teach.abhi_paanch_baje_hain:
    title: Dire l’heure
    gloss: Il est cinq heures maintenant.
    note: La réponse naturelle, en phrase complète, à *Kitne baje hain?*
  hi.a1.unit04.lesson02.teach.yoga_class_reprise:
    title: Cours de yoga
    gloss: cours de yoga
    note: Repris de l’unité 1 — l’exemple récurrent de cette leçon pour parler d’horaires.
    example_gloss: Le cours de yoga a lieu aujourd’hui.
  hi.a1.unit04.lesson02.teach.subah:
    title: Matin
    gloss: matin
    note: L’un des quatre mots de moments de la journée de cette leçon.
    example_gloss: Le cours de yoga a lieu le matin.
  hi.a1.unit04.lesson02.teach.dopahar:
    title: Après-midi / midi
    gloss: après-midi, midi
    note: Couvre à la fois le milieu de la journée (midi) et le début de l’après-midi.
    example_gloss: Il n’y a pas de cours l’après-midi.
  hi.a1.unit04.lesson02.teach.shaam:
    title: Soir
    gloss: soir
    note: La période de la journée après *dopahar* et avant *raat*.
    example_gloss: Le prochain cours est à cinq heures du soir.
  hi.a1.unit04.lesson02.teach.raat:
    title: Nuit
    gloss: nuit
    note: Le dernier des quatre mots de moments de la journée.
    example_gloss: Il n’y a pas de cours la nuit.
  hi.a1.unit04.lesson02.teach.ko_reprise:
    title: Ko avec un moment général
    gloss: '*Ko* accompagne un mot de moment de la journée quand aucune heure précise n’est donnée : *dopahar ko*, *raat ko*.'
    note: Le même *ko* qui marque un jour de la semaine (unité 3) marque ici une période générale — une construction réelle et naturelle, mais pas la seule de cette unité (voir la note suivante pour la forme avec une heure précise).
  hi.a1.unit04.lesson02.teach.time_of_day_baje_note:
    title: Un mot de moment de la journée directement avant baje
    gloss: 'Pour une heure précise, le mot de moment de la journée se place directement avant *baje*, sans rien entre les deux : *subah saat baje*, *shaam paanch baje*.'
    note: Pas de *ko* ici — il est réservé à une période générale sans heure précise, comme l’explique la note précédente.
  hi.a1.unit04.lesson02.teach.class_kitne_baje_hai:
    title: Demander l’heure d’un cours
    gloss: À quelle heure est le cours ?
    note: Le même schéma *kitne baje* que dans la leçon 1, utilisé ici pour parler d’un événement et non de l’heure qu’il est.
  hi.a1.unit04.lesson02.teach.class_subah_saat_baje_hai:
    title: Dire l’heure d’un événement
    gloss: Le cours est à sept heures du matin.
    note: Associe *subah* directement à *saat baje*, selon la note de grammaire ci-dessus.
  hi.a1.unit04.lesson03.teach.kal:
    title: Demain / hier
    gloss: demain, hier
    note: 'Le hindi utilise un seul mot pour les deux : c’est le contexte (et le temps du verbe) qui indique le sens. Dans cette leçon, il signifie toujours « demain ».'
    example_gloss: Le cours est demain à cinq heures du soir.
  hi.a1.unit04.lesson03.teach.agli_reprise:
    title: Prochain
    gloss: prochain
    note: 'Repris de l’unité 3 : forme féminine, accordée avec *class*, qui est féminin.'
    example_gloss: Le prochain cours est demain.
  hi.a1.unit04.lesson03.teach.theek_hai_shukriya_reprise:
    title: D’accord, merci
    gloss: D’accord, merci !
    note: Les deux mots sont repris du vocabulaire des adieux de l’unité 1.
  hi.a1.unit04.lesson03.teach.milte_hain_reprise:
    title: On se voit / à bientôt
    gloss: on se voit / à bientôt
    note: Repris des adieux de l’unité 3, ici associé à *kal* pour dire « à demain ».
  hi.a1.unit04.lesson03.teach.agli_class_kitne_baje_hai:
    title: Demander l’heure du prochain cours
    gloss: À quelle heure est le prochain cours ?
    note: Associe *agli* (féminin, accordé avec « class ») et le modèle *kitne baje* de cette unité.
  hi.a1.unit04.lesson03.teach.agli_class_shaam_paanch_baje_hai:
    title: Indiquer l’heure du prochain cours
    gloss: Le prochain cours est à cinq heures du soir.
    note: La réponse complète naturelle à la question précédente.
  hi.a1.unit04.lesson03.teach.kal_milte_hain:
    title: Conclure en prévoyant de se revoir demain
    gloss: D’accord, à demain !
    note: La façon naturelle de terminer une conversation une fois l’heure convenue.
  hi.a1.unit04.lesson03.teach.dialogue.line01:
    title: Arjun s’informe sur le prochain cours
    gloss: Arjun demande à quelle heure est le prochain cours.
    note: Reprend exactement la question de cette leçon.
  hi.a1.unit04.lesson03.teach.dialogue.line02:
    title: Priya donne l’heure
    gloss: Priya dit que le prochain cours est à cinq heures du soir.
    note: Reprend exactement la phrase de réponse de cette leçon.
  hi.a1.unit04.lesson03.teach.dialogue.line03:
    title: Arjun la remercie
    gloss: Arjun dit d’accord, merci.
    note: Repris du vocabulaire de l’unité 1.
  hi.a1.unit04.lesson03.teach.dialogue.line04:
    title: Priya conclut la conversation
    gloss: Priya est d’accord et dit à demain.
    note: Reprend exactement la phrase de clôture de cette leçon.
