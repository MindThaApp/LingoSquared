answer_policy:
  nasalization_marks: Display and teach the correct chandrabindu/anusvara distinction. This unit's own new vocabulary needs no new nasalization-mark decisions -- it only reuses already-settled spellings (हाँ's chandrabindu, तुम्हें/मिलेंगे/हैं/नहीं's anusvara). In typed A1 answers, accept a variant that drops a nasalization mark entirely or substitutes anusvara for chandrabindu when every other character is correct. Do not extend this tolerance to a wrong vowel or consonant, which changes the actual word.
  punctuation: Hindi text is shown with the traditional danda (।) as the sentence-final mark. In typed answers, accept the danda, a plain period (.), or the mark omitted entirely as equivalent. Question marks (?), exclamation marks, and commas may likewise be omitted, but the fully punctuated form remains the model answer.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register (aap vs. tum) rather than written punctuation or nasalization marks.
course:
  title: Hindi A1
units:
  hi.a1.unit06.food:
    title: Nourriture et boissons
lessons:
  hi.a1.unit06.lesson01.mujhe_chahiye:
    title: Je voudrais…
  hi.a1.unit06.lesson02.khana_aur_matra:
    title: La nourriture et les quantités
  hi.a1.unit06.lesson03.priya_aur_arjun_ka_khana:
    title: Le repas de Priya et Arjun
teaching:
  hi.a1.unit06.lesson01.teach.khana:
    title: Nourriture
    gloss: nourriture, repas
    note: Le mot général pour la nourriture, utilisé tout au long de cette unité.
    example_gloss: Mon repas est prêt maintenant.
  hi.a1.unit06.lesson01.teach.chai_coffee:
    title: Thé, café
    gloss: thé, café
    note: Deux boissons courantes, utilisées dans toute cette unité pour s’entraîner à la structure *mujhe ... chahiye*.
    example_gloss:
    - Je voudrais du thé.
    - Je voudrais du café.
  hi.a1.unit06.lesson01.teach.pani_juice:
    title: Eau, jus
    gloss: eau, jus
    note: Deux autres boissons courantes ; aucun accord en genre n’est nécessaire, car *chahiye* est invariable.
    example_gloss:
    - Je voudrais de l’eau.
    - Je voudrais du jus.
  hi.a1.unit06.lesson01.teach.chahiye_note:
    title: Mujhe ... chahiye
    gloss: '*Mujhe ... chahiye* signifie « je voudrais... ». Cette tournure ne change pas selon le genre de la personne qui parle (contrairement à *chahta/chahti*), et elle n’est jamais suivie de *hai*.'
    note: 'Le point de grammaire central de cette unité : ajouter *hai* après *chahiye* est une erreur très fréquente chez les apprenants, car presque toutes les autres phrases vues jusqu’ici se terminent ainsi. *Chahiye* forme à lui seul un prédicat complet.'
  hi.a1.unit06.lesson01.teach.aapko_kya_chahiye:
    title: Que désirez-vous ? (formel)
    gloss: Que désirez-vous ?
    note: La question au registre de politesse *aap*, utilisée par un serveur ou un hôte qui s’adresse poliment à quelqu’un.
  hi.a1.unit06.lesson01.teach.tumhein_kya_chahiye:
    title: Que veux-tu ? (informel)
    gloss: Que désirez-vous ?
    note: Le pronom au datif du registre familier *tum*, parallèle à *mujhe* et à *tumhara/tumhari* de l’unité 5.
  hi.a1.unit06.lesson01.teach.chai_chahiye_shukriya:
    title: Je voudrais du thé, merci
    gloss: Je voudrais du thé, merci.
    note: Une réponse naturelle et polie pour commander, qui reprend *shukriya* vu dans les unités précédentes.
  hi.a1.unit06.lesson01.teach.bahut:
    title: Très
    gloss: très, beaucoup
    note: Un intensif courant, utilisé dans toute cette unité pour décrire la nourriture et les boissons.
    example_gloss: Ce thé est très bon.
  hi.a1.unit06.lesson01.teach.swadisht:
    title: Délicieux
    gloss: délicieux, savoureux
    note: Un mot utile pour réagir à un plat ; voir la note de grammaire de la leçon 3 de cette unité sur la raison pour laquelle il ne change jamais selon le genre.
    example_gloss: Ce repas est très délicieux.
  hi.a1.unit06.lesson02.teach.roti_chawal:
    title: Pain, riz
    gloss: galette de pain, riz
    note: Deux aliments de base d’un repas indien ordinaire.
    example_gloss:
    - Je voudrais du pain.
    - Je voudrais du riz.
  hi.a1.unit06.lesson02.teach.sabzi_daal:
    title: Plat de légumes, lentilles
    gloss: plat de légumes, lentilles (dal)
    note: Deux autres plats de base, qu’on mange souvent avec la roti et le riz.
    example_gloss:
    - Je voudrais le plat de légumes.
    - Je voudrais des lentilles.
  hi.a1.unit06.lesson02.teach.kap_gilas_plate:
    title: Tasse, verre, assiette
    gloss: tasse, verre, assiette
    note: Des contenants courants, utilisés avec *ek* (« un/une ») pour préciser une quantité en commandant.
    example_gloss:
    - Je voudrais une tasse de thé.
    - Je voudrais un verre d’eau.
    - Je voudrais une assiette de riz.
  hi.a1.unit06.lesson02.teach.kripya:
    title: S’il vous plaît
    gloss: s’il vous plaît
    note: Un simple mot de politesse pour formuler une demande. Il se place le plus souvent au début (*kripya mujhe ...*), mais on l’entend aussi ajouté à la fin.
    example_gloss: Je voudrais une tasse de thé, s’il vous plaît.
  hi.a1.unit06.lesson02.teach.kuch_aur_chahiye:
    title: Et avec ça ?
    gloss: Autre chose ? / Voulez-vous autre chose ?
    note: La question habituelle qu’un serveur pose après avoir pris une partie de la commande.
  hi.a1.unit06.lesson02.teach.nahin_bas_shukriya:
    title: Non, ce sera tout, merci
    gloss: Non, ce sera tout, merci.
    note: Une façon naturelle et polie de terminer une commande, qui reprend *nahin* et *shukriya* vus dans les unités précédentes.
  hi.a1.unit06.lesson02.teach.sabzi_swadisht_phrase:
    title: Ce plat de légumes est très délicieux
    gloss: Ce plat de légumes est très délicieux.
    note: Reprend *bahut* et *swadisht* de cette unité avec un nouveau nom de plat, en préparation de la note de grammaire de la leçon 3 sur *swadisht*, qui ne change jamais selon le genre.
  hi.a1.unit06.lesson03.teach.chalo_khate_hain:
    title: Allons manger quelque chose !
    gloss: Allons manger quelque chose !
    note: Une façon amicale et figée de proposer de manger ensemble, qui ouvre le dialogue final de cette unité.
  hi.a1.unit06.lesson03.teach.ya:
    title: Ou
    gloss: ou
    note: Un simple mot de liaison, utilisé pour proposer un choix entre deux choses.
    example_gloss: Tu veux du thé ou du café ?
  hi.a1.unit06.lesson03.teach.haan:
    title: Oui
    gloss: oui
    note: Un simple « oui », réutilisé dans tout le dialogue final de cette unité.
    example_gloss: Oui, je voudrais du thé.
  hi.a1.unit06.lesson03.teach.swadisht_invariant_note:
    title: Swadisht ne change jamais
    gloss: '*Swadisht* reste identique avec les mots masculins et féminins : il ne change pas comme *achha/achhi*.'
    note: 'Une vraie exception importante : contrairement aux adjectifs variables déjà vus (achha/achhi, bada/badi, mera/meri), les adjectifs terminés par une consonne, comme *swadisht*, ne s’accordent jamais en genre.'
  hi.a1.unit06.lesson03.teach.accha_phir_milenge:
    title: D’accord, à bientôt
    gloss: D’accord ! À bientôt.
    note: Une formule d’adieu amicale, reprise du vocabulaire d’au revoir des unités précédentes.
  hi.a1.unit06.lesson03.teach.theek_hai_phir_milte_hain:
    title: Très bien, à bientôt
    gloss: Très bien, à bientôt !
    note: La réponse familière à la formule d’adieu ci-dessus, comme dans les échanges de clôture des unités précédentes.
  hi.a1.unit06.lesson03.teach.dialogue.line01:
    title: Arjun propose de manger
    gloss: Arjun propose d’aller manger quelque chose.
    note: Reprend la phrase d’ouverture de cette unité.
  hi.a1.unit06.lesson03.teach.dialogue.line02:
    title: Priya lui demande ce qu’il veut
    gloss: Priya est d’accord et demande à Arjun ce qu’il voudrait.
    note: Reprend la question familière *tumhein kya chahiye* de la leçon 1.
  hi.a1.unit06.lesson03.teach.dialogue.line03:
    title: Arjun commande à manger
    gloss: Arjun dit qu’il voudrait une assiette de roti et de plat de légumes.
    note: Combine les noms de plats de cette unité, la structure du contenant *ek plate* et *chahiye*.
  hi.a1.unit06.lesson03.teach.dialogue.line04:
    title: Priya propose un choix de boisson
    gloss: Priya dit « très bien » et demande à Arjun s’il voudrait du thé ou du café.
    note: Utilise le *ya* propre à cette unité pour proposer un choix entre deux boissons.
  hi.a1.unit06.lesson03.teach.dialogue.line05:
    title: Arjun choisit un café
    gloss: Arjun dit qu’il voudrait un café, s’il vous plaît.
    note: Réutilise *kripya* de la leçon 2.
  hi.a1.unit06.lesson03.teach.dialogue.line06:
    title: Priya fait un commentaire sur le repas
    gloss: Priya dit d’accord, et que ce plat est délicieux.
    note: Réutilise *bahut swadisht* de la leçon 1.
  hi.a1.unit06.lesson03.teach.dialogue.line07:
    title: Arjun est d’accord
    gloss: Arjun dit oui, merci beaucoup.
    note: Réutilise *haan* et *shukriya*.
  hi.a1.unit06.lesson03.teach.dialogue.line08:
    title: Priya conclut la conversation
    gloss: Priya dit super, à la prochaine.
    note: Réutilise la formule de clôture propre à cette leçon.
  hi.a1.unit06.lesson03.teach.dialogue.line09:
    title: Arjun répond
    gloss: Arjun acquiesce et dit à bientôt.
    note: Réutilise la formule de réponse propre à cette leçon.
