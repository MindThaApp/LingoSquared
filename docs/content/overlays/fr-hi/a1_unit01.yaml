answer_policy:
  nasalization_marks: Display and teach the correct chandrabindu/anusvara distinction (हूँ, हाँ, कहाँ vs. मैं, हैं, में, मिलेंगे). In typed A1 answers, accept a variant that drops the nasalization mark entirely or substitutes anusvara for chandrabindu (हूं for हूँ, हां for हाँ) when every other character is correct -- these marks are small, easy to miss on a virtual keyboard, and near-homophonous in casual speech; this is a beginner course, not a spelling test. Do not extend this tolerance to a wrong vowel or consonant, which changes the actual word.
  punctuation: Hindi text is shown with the traditional danda (।) as the sentence-final mark, matching how it is actually printed and taught. In typed answers, accept the danda, a plain period (.), or the mark omitted entirely as equivalent -- most everyday Hindi typed on phones/keyboards uses a plain period, and this distinction carries no meaning difference. Question marks (?) and exclamation marks may likewise be omitted, but the fully punctuated form remains the model answer.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register (aap vs. tum) rather than written punctuation or nasalization marks.
course:
  title: Hindi A1
  description: Apprends à saluer, à demander comment va quelqu’un, à te présenter et à échanger des informations personnelles de base en hindi. Le cours met l’accent sur la distinction aap/tum (proche du vouvoiement et du tutoiement français) ainsi que sur les adjectifs et les formes verbales qui s’accordent en genre.
units:
  hi.a1.unit01.greetings:
    title: Namaste et premières rencontres
lessons:
  hi.a1.unit01.lesson01.aap_and_tum:
    title: 'Aap et tum : demander comment va quelqu’un'
  hi.a1.unit01.lesson02.greetings_and_farewells:
    title: Salutations et adieux
  hi.a1.unit01.lesson03.names_origin_and_dialogue:
    title: Prénoms, origines et première rencontre à un cours de yoga
teaching:
  hi.a1.unit01.lesson01.teach.aap:
    title: Le « vous » de politesse
    gloss: vous (politesse, respect)
    note: 'Comme le français avec tu et vous, l’hindi impose un vrai choix social. *aap* s’emploie avec une personne plus âgée, inconnue, ou dans une relation professionnelle respectueuse. Grammaticalement, il est traité comme un pluriel, même pour une seule personne (comme « vous » en français) : les verbes qui s’accordent avec *aap* prennent les terminaisons de type -en/hain du pluriel.'
  hi.a1.unit01.lesson01.teach.tum:
    title: Le « tu » informel
    gloss: tu (informel, familier)
    note: '*Tum* s’emploie avec un ami, une personne du même âge, une personne plus jeune ou un membre de la famille : une relation vraiment informelle, mais toujours respectueuse (ce n’est pas le *tu*, encore plus intime, que ce cours n’enseigne pas). *Tum* a ses propres terminaisons verbales, différentes de celles de *aap* et de *tu*.'
  hi.a1.unit01.lesson01.teach.aap_kaise_hain:
    title: Demander des nouvelles à un homme (forme de politesse)
    gloss: Comment allez-vous ? (à un homme)
    note: '*Kaise* s’accorde avec le GENRE DE LA PERSONNE À QUI L’ON PARLE, et non avec celui de la personne qui parle : cette forme s’emploie pour s’adresser à un homme. En français, « comment allez-vous ? » ne change jamais ainsi.'
  hi.a1.unit01.lesson01.teach.aap_kaisi_hain:
    title: Demander des nouvelles à une femme (forme de politesse)
    gloss: Comment allez-vous ? (à une femme)
    note: 'Même question, même registre *aap* : seul *kaisi* remplace *kaise*, pour s’accorder avec une interlocutrice. Le verbe *hain* lui-même ne change jamais ; seule la forme de l’adjectif change.'
  hi.a1.unit01.lesson01.teach.tum_kaise_ho:
    title: Demander familièrement comment va quelqu’un
    gloss: Comment ça va ? (informel)
    note: 'Avec *tum*, le verbe est *ho* et non *hain* : compare le *Aap kaise/kaisi hain?* de politesse et le *Tum kaise ho?* informel. C’est la meilleure paire minimale pour entendre la différence entre aap et tum dans le verbe lui-même.'
  hi.a1.unit01.lesson01.teach.main_theek_hoon:
    title: Une réponse standard
    gloss: Je vais bien, merci.
    note: '*Theek* (« bien / correct ») ne change ni selon le genre ni selon le registre : contrairement à *kaise/kaisi*, il reste identique quel que soit celui qui parle ou celui à qui l’on parle.'
  hi.a1.unit01.lesson01.teach.aur_aap:
    title: Retourner la question avec politesse
    gloss: Et vous ? (formel)
    note: Une façon brève de retourner la question au registre de politesse aap.
  hi.a1.unit01.lesson01.teach.aur_tum:
    title: Retourner la question de manière informelle
    gloss: Et toi ? (informel)
    note: Utilise tum pour retourner la question à un ami ou à une personne de ton âge.
  hi.a1.unit01.lesson02.teach.namaste:
    title: Une salutation passe-partout
    gloss: bonjour ; salut (sert aussi à dire au revoir)
    note: '*Namaste* convient à toute heure du jour, en contexte formel comme informel, aussi bien pour commencer que pour terminer un échange : un mot vraiment polyvalent, alors que le français sépare les salutations (« bonjour ») et les adieux (« au revoir »).'
    example_gloss: Bonjour ! Comment allez-vous ?
  hi.a1.unit01.lesson02.teach.namaskar:
    title: Salutation respectueuse
    gloss: bonjour (plus formel et respectueux que namaste)
    note: '*Namaskar* signifie à peu près la même chose que *namaste*, mais avec un ton plus formel et respectueux : il convient face à une personne âgée, devant un large public ou dans un cadre professionnel.'
    example_gloss: Namaskar ! Et vous ?
  hi.a1.unit01.lesson02.teach.phir_milenge:
    title: À bientôt (futur)
    gloss: à bientôt ; à plus tard
    note: 'Littéralement « [nous] nous reverrons » : une façon courante et neutre de dire au revoir quand on pense revoir la personne.'
  hi.a1.unit01.lesson02.teach.alvida:
    title: Adieu formel
    gloss: au revoir ; adieu
    note: '*Alvida* est un mot hindi bien réel et correct pour dire au revoir, mais dans l’usage courant il a un ton plus définitif, plus formel, voire un peu dramatique, que *namaste* ou *phir milenge* : plus proche de « adieu » que d’un simple « salut ».'
    example_gloss: Au revoir ! À bientôt.
  hi.a1.unit01.lesson02.teach.phir_milte_hain:
    title: À plus (décontracté, habituel)
    gloss: à plus ; à la prochaine
    note: 'Littéralement « [nous] nous retrouvons », avec la forme verbale du présent habituel au lieu du futur : un équivalent un peu plus décontracté et quotidien de *phir milenge*.'
  hi.a1.unit01.lesson02.teach.shubh_ratri:
    title: Bonne nuit
    gloss: bonne nuit
    note: 'On le dit quand quelqu’un s’en va pour la nuit ou va se coucher : comme « bonne nuit » en français, c’est une formule d’adieu, jamais une salutation d’accueil, contrairement à *namaste*.'
  hi.a1.unit01.lesson02.teach.shubh_din:
    title: Un souhait poli pour prendre congé
    gloss: Bonne journée.
    note: 'Littéralement « que votre journée reste bonne » : un vœu de politesse pour prendre congé de quelqu’un avec respect, que la relation soit formelle ou informelle.'
  hi.a1.unit01.lesson03.teach.aapka_naam_kya_hai:
    title: Demander un nom, poliment
    gloss: Comment vous appelez-vous ? (forme de politesse)
    note: '*Aapka* (« votre ») s’accorde avec le nom masculin *naam* (« nom ») : comme en français (ton nom, ta maison), le possessif hindi change de forme selon la chose possédée, et non selon le possesseur.'
  hi.a1.unit01.lesson03.teach.tumhara_naam_kya_hai:
    title: Demander un prénom, de façon informelle
    gloss: Comment t’appelles-tu ? (forme familière)
    note: Même structure avec *tumhara* (« ton », informel) à la place de *aapka*. Compare le *Aapka naam kya hai?* de politesse et le *Tumhara naam kya hai?* informel.
  hi.a1.unit01.lesson03.teach.mera_naam_priya_hai:
    title: Donner son nom
    gloss: Je m’appelle Priya.
    note: '*Mera* (« mon ») s’accorde aussi avec *naam*, qui est masculin : tu remarques la même terminaison masculine que dans *aapka*/*tumhara* ci-dessus, car les trois déterminent le même nom.'
  hi.a1.unit01.lesson03.teach.aapse_milkar_khushi_hui:
    title: Exprimer sa joie de rencontrer quelqu’un, avec politesse
    gloss: Enchanté(e). (formel)
    note: 'Littéralement « vous ayant rencontré, la joie est arrivée » : une expression figée et très courante pour une première rencontre respectueuse.'
  hi.a1.unit01.lesson03.teach.mujhe_bhi:
    title: Répondre de même
    gloss: Moi aussi.
    note: Une réponse courte et naturelle à Aapse milkar khushi hui ou Tumse milkar accha laga.
  hi.a1.unit01.lesson03.teach.aap_kahan_se_hain:
    title: Demander l’origine, avec politesse
    gloss: D’où venez-vous ? (forme de politesse)
    note: Kahan signifie « où » ; se signifie « de ».
  hi.a1.unit01.lesson03.teach.main_bharat_se_hoon:
    title: Indiquer son origine
    gloss: Je viens d’Inde.
    note: Bharat est le nom hindi de l’Inde, utilisé constamment dans la langue de tous les jours.
  hi.a1.unit01.lesson03.teach.tum_kahan_se_ho:
    title: Demander l'origine, familièrement
    gloss: D’où viens-tu ? (forme familière)
    note: 'Même question avec *tum* et *ho* à la place de *aap* et *hain* : c’est le même schéma de terminaisons verbales de politesse/informel que dans toute cette unité.'
  hi.a1.unit01.lesson03.teach.dialogue.line01:
    title: Engager la conversation
    gloss: Priya salue Arjun et lui demande si c’est la première fois qu’il vient ici.
    note: 'Les deux personnes emploient d’emblée le registre informel *tum* : c’est naturel pour deux personnes du même âge qui se rencontrent à un cours de quartier. *Tumhari* (« ta ») s’accorde avec le nom féminin *baar* (« fois »), et non avec le genre de l’un ou de l’autre des interlocuteurs.'
  hi.a1.unit01.lesson03.teach.dialogue.line02:
    title: 'Engager la conversation : la réponse'
    gloss: Arjun répond oui, c’est la première fois, et il dit qu’il veut apprendre le yoga.
    note: '*Chahta hoon* (« je veux ») est au masculin ici parce que Arjun, qui parle, est un homme : ce verbe s’accorde avec le genre de CELUI QUI PARLE, contrairement à *kaisi*/*kaise* plus haut, qui s’accordaient avec la personne À QUI L’ON PARLE.'
  hi.a1.unit01.lesson03.teach.dialogue.line03:
    title: Échanger les prénoms
    gloss: Priya dit « moi aussi ! », donne son prénom et demande celui d’Arjun.
    note: '*Main bhi!* (« moi aussi ! ») répond à *main ... chahta hoon* d’Arjun : quand la phrase de l’autre a *main* pour sujet, « moi aussi » se dit *main bhi*. *Mujhe bhi* répond à une phrase de type *mujhe*, comme *Tumse milkar accha laga*. *Mera naam...hai* est la façon simple et naturelle de donner son prénom.'
  hi.a1.unit01.lesson03.teach.dialogue.line04:
    title: 'Échanger les prénoms : la réponse'
    gloss: Arjun donne son prénom et dit, de façon informelle, qu’il est content de la rencontrer.
    note: '*Tumse milkar accha laga* est l’équivalent informel du *Aapse milkar khushi hui* de politesse vu dans cette leçon : les deux signifient à peu près « enchanté(e) », selon le registre.'
  hi.a1.unit01.lesson03.teach.dialogue.line05:
    title: Demander l’origine
    gloss: Priya lui répond la même chose et lui demande d’où il vient.
    note: Tum kahan se ho demande l’origine avec le registre informel déjà appris.
  hi.a1.unit01.lesson03.teach.dialogue.line06:
    title: 'Demander l’origine : la réponse'
    gloss: Arjun vient d’Inde mais habite actuellement à Londres, puis il retourne la question.
    note: '*Rahta hoon* (« j’habite ») est au masculin, car il s’accorde avec Arjun qui parle : c’est le même accord avec le sujet que *chahta hoon* à la line02. *Lekin* (« mais ») relie le contraste entre l’origine et le lieu de résidence actuel.'
  hi.a1.unit01.lesson03.teach.dialogue.line07:
    title: Parler de son origine et d’un centre d’intérêt
    gloss: Priya dit qu’elle vient d’Amérique et qu’elle veut aussi apprendre le yoga.
    note: '*Chahti hoon* est la forme féminine du verbe qu’Arjun a employé à la line02 (*chahta hoon*) : chacun s’accorde avec le genre de la personne qui parle, ce qui donne une paire minimale directe à comparer.'
  hi.a1.unit01.lesson03.teach.dialogue.line08:
    title: Poser une question sur l’activité commune
    gloss: Arjun réagit avec enthousiasme et demande à Priya si elle fait du yoga.
    note: '*Karti ho* (« tu fais ») est au féminin, car il s’accorde avec Priya, la personne à qui l’on parle : comme *kaisi* plus haut, cette forme verbale suit le genre de la personne INTERROGÉE, et non celui de celui qui parle.'
  hi.a1.unit01.lesson03.teach.dialogue.line09:
    title: Poser une question sur l’activité commune, réponse
    gloss: Priya répond non, c’est sa première fois et elle est en train d’apprendre.
    note: '*Seekh rahi hoon* (« je suis en train d’apprendre ») emploie la forme continue au féminin, qui s’accorde avec Priya qui parle : c’est le pendant au présent continu de *chahti hoon*.'
  hi.a1.unit01.lesson03.teach.dialogue.line10:
    title: Terminer l’échange
    gloss: Arjun accepte de commencer, puis dit à plus tard.
    note: '*Chalo shuru karte hain* (« commençons ») est une façon figée et naturelle de proposer de commencer quelque chose ensemble. *Phir milte hain* clôt l’échange avec la formule d’au revoir décontractée vue à la leçon 2.'
