teaching:
  hi.a1.unit12.lesson01.teach.vyast_review:
    title: 'Révision : occupé'
    gloss: occupé
    note: Petit rappel de l’adjectif de l’unité 11 -- cette unité le réutilise pour s’exercer au nouveau passé de la copule.
    example_gloss: Arjun est occupé.
  hi.a1.unit12.lesson01.teach.tha_thi:
    title: Était (masculin / féminin)
    gloss: était
    note: Le passé de la copule (être), équivalent passé direct de hai/hoon/hain. « Tha » s’accorde avec un sujet masculin, « thi » avec un sujet féminin.
    example_gloss:
    - Arjun était occupé hier.
    - Priya était occupée hier.
  hi.a1.unit12.lesson01.teach.tha_thi_grammar:
    title: Tha ou thi
    gloss: '« Tha » s’emploie avec un sujet masculin, « thi » avec un sujet féminin -- ils se placent là où se place « hai », mais contrairement à « hai » ils changent selon le genre : Arjun est occupé, Arjun était occupé, Priya était occupée.'
    note: Énonce explicitement la règle d’accord en genre, en prolongeant au passé le paradigme de la copule déjà connu.
  hi.a1.unit12.lesson01.teach.kal_review:
    title: 'Révision : hier'
    gloss: hier
    note: Vu pour la première fois à l’unité 4, où « kal » signifiait à la fois « demain » et « hier », distingués uniquement par le temps du verbe. C’est la première unité du cours à utiliser son sens passé (« hier »).
    example_gloss: Hier, c’était samedi.
  hi.a1.unit12.lesson01.teach.kaisa:
    title: Comment (masculin)
    gloss: comment
    note: Complète un paradigme dont le cours possède déjà deux tiers -- « kaise » et « kaisi » (de « comment vas-tu » de l’unité 1) étaient déjà vus ; voici simplement la forme manquante du masculin singulier, employée avec des sujets comme « din » (jour).
    example_gloss: Comment était la journée ?
  hi.a1.unit12.lesson01.teach.kal_kaisa_tha_phrase:
    title: Comment c’était hier ?
    gloss: Comment c’était hier ?
    note: La question centrale et récurrente de cette unité, qui réunit tous les mots vus jusqu’ici dans la leçon.
  hi.a1.unit12.lesson01.teach.din_achha_tha_phrase:
    title: La journée était bonne.
    gloss: La journée était bonne.
    note: Une réponse toute prête à « Comment c’était hier ? », au masculin (din est masculin).
  hi.a1.unit12.lesson01.teach.filma_achi_thi:
    title: Le film était bon.
    gloss: Le film était bon.
    note: Même structure avec un sujet féminin (film est féminin), rappel du vocabulaire de l’unité 11.
  hi.a1.unit12.lesson01.teach.kaisa_kaisi_grammar:
    title: Kaisa, kaisi, kaise
    gloss: '« Kaisa » s’emploie avec un sujet masculin singulier (Comment était la journée ?), « kaisi » avec un féminin (Comment était le thé ?), et « kaise » avec aap/tum quand on s’adresse à un homme (Comment vas-tu ? ; à une femme : « aap kaisi hain ? ») -- les trois sont le même mot.'
    note: Réunit pour la première fois le paradigme complet -- kaise/kaisi étaient déjà connus de l’unité 1, kaisa est l’ajout de cette leçon.
  hi.a1.unit12.lesson02.teach.names_mai_review:
    title: 'Révision : je, Arjun, Priya'
    gloss: je, Arjun, Priya
    note: Petit rappel avant les exemples de cette leçon au passé à la première personne.
    example_gloss:
    - Je suis Arjun.
    - Je suis Priya.
  hi.a1.unit12.lesson02.teach.jaana_gaya_gai:
    title: Allé (masculin / féminin)
    gloss: est allé
    note: Le passé de « jaana » (aller), la même racine que l’impératif « jao » (va !) vu à l’unité 9. S’accorde avec le genre du sujet, comme « tha »/« thi ».
    example_gloss:
    - Arjun est allé au marché.
    - Priya est rentrée chez elle.
  hi.a1.unit12.lesson02.teach.jaana_grammar:
    title: Gaya/gai = passé de jaana
    gloss: « Gaya »/« gai » est le passé de « jaana » (aller, jao à l’unité 9) et change selon le genre du sujet -- comme « tha »/« thi ».
    note: Relie explicitement ce nouveau passé à la racine d’impératif déjà connue.
  hi.a1.unit12.lesson02.teach.bazaar_ghar_review:
    title: 'Révision : marché, maison'
    gloss: marché, maison
    note: Petit rappel de deux mots de lieu des unités 7/8, nécessaires pour dire où quelqu’un est allé.
    example_gloss:
    - Voici le marché.
    - Voici la maison.
  hi.a1.unit12.lesson02.teach.milna_mila_mili:
    title: Rencontré (masculin / féminin)
    gloss: a rencontré
    note: Le passé de « milna » (rencontrer), la même racine que l’habituel « milte hain » vu dans les fins des unités 1/4/10/11. Il s’accorde avec le genre du sujet.
    example_gloss:
    - Arjun a rencontré Priya.
    - Priya a rencontré Arjun.
  hi.a1.unit12.lesson02.teach.milna_se_grammar:
    title: Se = « avec » ici, pas « de »
    gloss: 'Ici, « se » ne signifie pas « de (provenance) » : « X se milna » veut dire « rencontrer X », alors que dans « main Bharat se hoon », le même mot « se » signifiait « de (provenance) ».'
    note: Un double emploi réel d’un mot déjà appris, signalé explicitement.
  hi.a1.unit12.lesson02.teach.wahan_review:
    title: 'Révision : là-bas'
    gloss: là-bas
    note: Petite révision des unités 8/9, utilisée ici pour dire où une rencontre a eu lieu.
    example_gloss: L’école est là-bas.
  hi.a1.unit12.lesson02.teach.kal_bazaar_gaya_phrase:
    title: Hier, je suis allé au marché.
    gloss: Hier, je suis allé au marché.
    note: Associe le nouveau passé de cette leçon à « kal » de la leçon 1.
  hi.a1.unit12.lesson02.teach.wahan_priya_se_mila_phrase:
    title: Je y ai rencontré Priya.
    gloss: Je l’ai rencontrée là-bas, Priya.
    note: Associe le « mila » de cette leçon avec « se » (« avec ») et « wahan » (là-bas).
  hi.a1.unit12.lesson02.teach.saath_review:
    title: 'Révision : ensemble'
    gloss: ensemble
    note: Petite révision de l’unité 11.
    example_gloss: Nous buvons du thé ensemble.
  hi.a1.unit12.lesson03.teach.chai_dukaan_khana_review:
    title: 'Révision : thé, boutique, nourriture'
    gloss: thé, boutique, nourriture
    note: Petite révision de trois noms des unités 6/7, utiles pour le dialogue et la lecture de cette leçon.
    example_gloss:
    - Le thé est bon.
    - La boutique est bonne.
    - La nourriture est bonne.
  hi.a1.unit12.lesson03.teach.ka_kaisi_review:
    title: 'Révision : « de » (ka), comment (féminin)'
    gloss: de (ka), comment (féminin, kaisi)
    note: '« Ka » (vu dans « kitne ka » et dans « raat ka khana » de l’unité 10) et « kaisi » (déjà vu) sont réutilisés ici : ce n’est pas une nouvelle notion de grammaire.'
    example_gloss:
    - La journée d’hier était bonne.
    - Comment était le salon de thé ?
  hi.a1.unit12.lesson03.teach.dialogue.line01:
    title: Arjun demande comment s’est passée la journée d’hier
    gloss: Priya, comment était la journée d’hier ?
  hi.a1.unit12.lesson03.teach.dialogue.line02:
    title: Priya dit que c’était bien
    gloss: Très bien ! Nous nous sommes vus.
  hi.a1.unit12.lesson03.teach.dialogue.line03:
    title: Arjun parle du marché
    gloss: Oui ! Je suis d’abord aussi allé au marché.
  hi.a1.unit12.lesson03.teach.dialogue.line04:
    title: Priya interroge sur le marché
    gloss: Ah bon ! Qu’y avait-il au marché ?
  hi.a1.unit12.lesson03.teach.dialogue.line05:
    title: Arjun répond
    gloss: La nourriture était bonne.
  hi.a1.unit12.lesson03.teach.dialogue.line06:
    title: Priya interroge sur le salon de thé
    gloss: Ah bon ! Et comment était le salon de thé ?
  hi.a1.unit12.lesson03.teach.dialogue.line07:
    title: Arjun répond
    gloss: Le salon de thé était très bien.
  hi.a1.unit12.lesson03.teach.dialogue.line08:
    title: Priya conclut
    gloss: Bien ! Alors, on se revoit demain ?
  hi.a1.unit12.lesson03.teach.mile_grammar:
    title: Tum/hum/ve prennent la forme de passé en -e
    gloss: 'Avec « tum », « hum » et « ve », le passé prend la même forme que le présent en « -te » : « the » (au lieu de « tha »), « gaye » (au lieu de « gaya »), « mile » (au lieu de « mila ») ; comme « hum milte hain » donne « hum mile ».'
    note: 'Présente le paradigme complet pour la compréhension ; seul « mile » est travaillé activement dans les exercices de cette unité : « the » et « gaye » sont à reconnaître seulement, dans cette note.'
  hi.a1.unit12.lesson03.teach.priya_note:
    title: Le mot de Priya
    gloss: Arjun, la journée d’hier était très bien. La nourriture était bonne et le salon de thé aussi. - Priya
    note: Un court mot écrit qui reprend les faits établis dans le dialogue, sans nouveau vocabulaire.
    glosses:
      कल: hier
      दिन: jour
      अच्छा: bon (masculin)
      था: était (masculin)
      खाना: nourriture
      दुकान: magasin
      अच्छी: bonne (féminin)
      थी: était (féminin)
