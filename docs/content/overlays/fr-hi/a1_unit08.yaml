answer_policy:
  nasalization_marks: Display and teach the correct chandrabindu/anusvara distinction. No new spelling decision is needed for this unit's own new vocabulary -- यहाँ/वहाँ reuse the already-established spelling from units 01-07 (चंद्रबिंदु after the non-ascending ा matra), and बैंक's अनुस्वार follows the already-established ascending-vowel-sign rule. In typed A1 answers, accept a variant that drops a nasalization mark entirely or substitutes anusvara for chandrabindu (or vice versa) when every other character is correct. Do not extend this tolerance to a wrong vowel or consonant, which changes the actual word.
  punctuation: Hindi text is shown with the traditional danda (।) as the sentence-final mark. In typed answers, accept the danda, a plain period (.), or the mark omitted entirely as equivalent. Question marks (?), exclamation marks, and commas may likewise be omitted, but the fully punctuated form remains the model answer.
  spoken_answers: Judge spoken responses by intelligibility rather than written punctuation or nasalization marks.
