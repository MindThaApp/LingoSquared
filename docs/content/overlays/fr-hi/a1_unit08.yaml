teaching:
  hi.a1.unit08.lesson01.teach.ghar_school:
    title: Maison, école
    gloss: maison, école
    note: Deux lieux courants, utilisés tout au long de cette unité.
    example_gloss:
    - C’est une maison.
    - C’est une école.
  hi.a1.unit08.lesson01.teach.aspatal_bank:
    title: Hôpital, banque
    gloss: hôpital, banque
    note: Deux autres lieux courants que tu peux avoir besoin de trouver dans un quartier.
    example_gloss:
    - C’est un hôpital.
    - C'est une banque.
  hi.a1.unit08.lesson01.teach.park_station:
    title: Parc, gare
    gloss: parc, gare
    note: Les deux derniers lieux courants de cette unité.
    example_gloss:
    - C'est un parc.
    - C’est une gare.
  hi.a1.unit08.lesson01.teach.yahan_wahan:
    title: Ici, là-bas
    gloss: ici, là-bas
    note: Un couple de base pour indiquer où se trouve quelque chose.
    example_gloss:
    - L’école est ici.
    - La banque est là-bas.
  hi.a1.unit08.lesson01.teach.school_kahan_hai:
    title: Où est l’école ?
    gloss: Où est l’école ?
    note: Reprend *kahaan* (où), appris dès l’unité 1, mais ici pour demander où se trouve un lieu et non d’où vient une personne.
  hi.a1.unit08.lesson01.teach.school_yahan_hai:
    title: L’école est ici
    gloss: L’école est ici.
    note: Un exemple de réponse avec *yahaan*.
  hi.a1.unit08.lesson01.teach.bank_kahan_hai:
    title: Où est la banque ?
    gloss: Où se trouve la banque ?
    note: La même structure de question, avec un autre lieu.
  hi.a1.unit08.lesson01.teach.bank_wahan_hai:
    title: La banque est là-bas
    gloss: La banque est là-bas.
    note: Un exemple de réponse avec *wahaan*.
  hi.a1.unit08.lesson02.teach.paas:
    title: Près de
    gloss: près de
    note: 'Présenté ici officiellement pour la première fois : il n’apparaissait que dans les phrases d’exemple de l’unité 2 (*mere paas*, « j’ai », littéralement « près de moi ») sans jamais être enseigné comme un mot à part entière.'
    example_gloss: La banque est proche.
  hi.a1.unit08.lesson02.teach.door:
    title: Loin
    gloss: loin
    note: Le contraire de *paas*.
    example_gloss: La gare est loin.
  hi.a1.unit08.lesson02.teach.ke_paas_note:
    title: Ke paas
    gloss: '« Ke paas » signifie près d’un lieu, comme dans « school bank ke paas hai » (l’école est près de la banque). C’est le même « paas » que dans « mere paas » (j’ai), mais là il exprimait « en ma possession », et ici il signifie « à proximité » : un seul mot, deux emplois différents.'
    note: Une nouvelle postposition construite sur un mot déjà vu, avec son sens précédent rappelé explicitement pour éviter de confondre les deux emplois.
  hi.a1.unit08.lesson02.teach.school_bank_ke_paas_hai:
    title: L’école est près de la banque
    gloss: L’école est près de la banque.
    note: Une phrase d’exemple avec *ke paas*.
  hi.a1.unit08.lesson02.teach.samne_peeche:
    title: Devant, derrière
    gloss: en face de, derrière
    note: Un deuxième couple de mots de localisation, eux aussi employés avec *ke*.
    example_gloss:
    - L’hôpital est en face de la gare.
    - Le parc est derrière l’école.
  hi.a1.unit08.lesson02.teach.samne_peeche_note:
    title: Samne et peeche
    gloss: '« Samne » et « peeche » s’emploient aussi avec « ke », comme « paas », et ils sont opposés : « paark school ke peeche hai » et « school paark ke samne hai » décrivent exactement la même situation, simplement vue de deux côtés différents.'
    note: 'Un même fait énoncé de deux façons : un point de grammaire réel et utile sur la relation entre ces deux mots.'
  hi.a1.unit08.lesson02.teach.school_park_ke_samne_hai:
    title: L’école est en face du parc
    gloss: L’école est en face du parc.
    note: L’autre versant du même fait que *paark school ke peeche hai* vu plus haut.
  hi.a1.unit08.lesson03.teach.dakghar:
    title: Bureau de poste
    gloss: bureau de poste
    note: Un nouveau lieu courant pour le dialogue final de cette unité.
    example_gloss: Le bureau de poste est près de la banque.
  hi.a1.unit08.lesson03.teach.dakghar_kahan_hai:
    title: Où est la poste ?
    gloss: Où est la poste ?
    note: Ouvre le dialogue final de cette unité.
  hi.a1.unit08.lesson03.teach.dialogue.line01:
    title: Arjun demande où est le bureau de poste
    gloss: Arjun demande à Priya où est le bureau de poste.
    note: Reprend la phrase d’ouverture de cette leçon.
  hi.a1.unit08.lesson03.teach.dialogue.line02:
    title: Priya répond
    gloss: Priya dit qu’il est près de la banque.
    note: Reprend *ke paas* de la leçon 2.
  hi.a1.unit08.lesson03.teach.dialogue.line03:
    title: Arjun demande où est l’hôpital
    gloss: Arjun dit « d’accord » et demande où est l’hôpital.
    note: Reprend *achchha* (d’accord / je vois) des unités précédentes.
  hi.a1.unit08.lesson03.teach.dialogue.line04:
    title: Priya répond
    gloss: Priya dit que l’hôpital est en face de la gare.
    note: Reprend *ke samne* de la leçon 2.
  hi.a1.unit08.lesson03.teach.dialogue.line05:
    title: Arjun demande si c’est loin
    gloss: 'Arjun demande : la gare est-elle loin ?'
    note: Reprend *door* de la leçon 2.
  hi.a1.unit08.lesson03.teach.dialogue.line06:
    title: Priya confirme et nuance
    gloss: Priya dit oui, un peu loin -- la banque est proche.
    note: 'Introduit *thoda* (un peu), et reste cohérent : la gare est loin tandis que la banque reste proche.'
  hi.a1.unit08.lesson03.teach.dialogue.line07:
    title: Arjun demande où est le parc
    gloss: Arjun dit « d’accord » et demande où est le parc.
  hi.a1.unit08.lesson03.teach.dialogue.line08:
    title: Priya répond
    gloss: Priya dit que le parc est derrière l’école.
    note: Reprend *ke peeche* de la leçon 2.
  hi.a1.unit08.lesson03.teach.dialogue.line09:
    title: Arjun en déduit quelque chose
    gloss: 'Arjun dit : donc l’école est en face du parc !'
    note: Introduit *to* (donc / alors) et relie ce fait à la note de grammaire sur *samne*/*peeche* de la leçon 2.
  hi.a1.unit08.lesson03.teach.dialogue.line10:
    title: Priya confirme
    gloss: Priya dit oui, c’est exact !
    note: Présente *sahi* (juste, correct).
  hi.a1.unit08.lesson03.teach.dialogue.line11:
    title: Arjun remercie Priya
    gloss: Arjun dit merci beaucoup, Priya !
    note: Réutilise *bahut* (très, beaucoup) et *shukriya* vus dans les unités précédentes.
  hi.a1.unit08.lesson03.teach.dialogue.line12:
    title: Priya conclut
    gloss: 'Priya dit : pas de problème ! À bientôt.'
    note: Reprend les formules de clôture habituelles de ce cours, vues dans les unités précédentes.
