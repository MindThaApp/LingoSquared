teaching:
  hi.a1.unit05.lesson01.teach.parivar:
    title: La famille
    gloss: famille
    note: Le mot général pour « famille », utilisé tout au long de cette unité.
    example_gloss: Ma famille est en Inde.
  hi.a1.unit05.lesson01.teach.pita_maa:
    title: Père, mère
    gloss: père, mère
    note: Pour les présenter, les deux mots prennent la forme plurielle de respect *hain* au lieu de *hai*, et *pita* prend *mere* au lieu de *mera* ; voir la note sur le respect plus loin dans cette leçon.
    example_gloss:
    - C’est mon père.
    - C’est ma mère.
  hi.a1.unit05.lesson01.teach.bhai_behan:
    title: Frère, sœur
    gloss: frère, sœur
    note: 'Le couple central de cette unité pour l’accord mera/meri : *mera bhai*, *meri behan*.'
    example_gloss:
    - J’ai un frère.
    - J’ai une sœur.
  hi.a1.unit05.lesson01.teach.ek_as_article:
    title: Ek pour « un / une »
    gloss: '*Ek* signifie « un » quand on compte et sert aussi d’article indéfini (« un / une ») : *mera ek bhai hai*.'
    note: 'C’est le mot déjà vu pour le nombre 1 : le hindi n’a pas d’article indéfini distinct.'
  hi.a1.unit05.lesson01.teach.mata_pita:
    title: Parents
    gloss: parents
    note: 'Composé de *mata* (mère, formel) et de *pita* (père) : c’est le mot courant pour « parents ».'
    example_gloss: Mes parents habitent à Delhi.
  hi.a1.unit05.lesson01.teach.mera_meri_note:
    title: Mera ou meri
    gloss: '*Mera* s’emploie avec les mots masculins, *meri* avec les mots féminins : *mera bhai*, *meri behan*.'
    note: 'Le point de grammaire central de cette unité : le possessif s’accorde avec la personne ou la chose possédée, et non avec celui qui parle.'
  hi.a1.unit05.lesson01.teach.mere_honorific_note:
    title: Mere pour les aînés respectés
    gloss: 'Par respect pour les aînés, *mera* devient *mere* et *hai* devient *hain*, même pour une seule personne : *yeh mere pita hain* (C’est mon père).'
    note: 'C’est une convention réelle et authentique, pas une erreur : les aînés respectés de la famille (père, grand-père) prennent cette forme qui ressemble à un pluriel. Les mères et les grands-mères gardent *meri*, mais le verbe se met quand même au pluriel (*hain*) pour la même raison.'
  hi.a1.unit05.lesson01.teach.yah_mera_bhai_hai:
    title: Voici mon frère
    gloss: C’est mon frère.
    note: 'La forme masculine simple : aucune marque de respect n’est nécessaire pour un frère.'
  hi.a1.unit05.lesson01.teach.yah_meri_behan_hai:
    title: Voici ma sœur
    gloss: Voici ma sœur.
    note: La forme féminine simple, qui s’accorde avec *behan*.
  hi.a1.unit05.lesson01.teach.yah_kaun_hai:
    title: Qui est-ce ?
    gloss: Qui est-ce ?
    note: Une question simple et utile pour présenter les membres de la famille.
  hi.a1.unit05.lesson02.teach.dada_dadi:
    title: Grand-père, grand-mère (côté paternel)
    gloss: grand-père paternel, grand-mère paternelle
    note: 'Les parents de ton père, précisément : voir la note plus loin dans cette leçon qui les oppose aux parents de ta mère.'
    example_gloss:
    - Mon grand-père habite à Delhi.
    - Ma grand-mère habite à Delhi.
  hi.a1.unit05.lesson02.teach.nana_nani:
    title: Grand-père, grand-mère (côté maternel)
    gloss: grand-père maternel, grand-mère maternelle
    note: 'Les parents de ta mère : le hindi utilise une paire de mots entièrement différente de celle des parents de ton père.'
    example_gloss:
    - Mon grand-père (côté maternel) habite à Bombay.
    - Ma grand-mère (côté maternel) habite à Bombay.
  hi.a1.unit05.lesson02.teach.dilli_mumbai:
    title: Delhi, Bombay
    gloss: Delhi, Bombay
    note: Deux grandes villes indiennes, utilisées dans les exemples de cette leçon pour dire où habitent les membres de la famille.
    example_gloss:
    - Ma famille habite à Delhi.
    - Mon frère habite à Bombay.
  hi.a1.unit05.lesson02.teach.dada_nana_note:
    title: Deux paires de grands-parents
    gloss: 'Parents du père : *dada-dadi*. Parents de la mère : *nana-nani*.'
    note: Contrairement au français, qui n’a que « grand-père » et « grand-mère » pour les deux côtés, le hindi utilise des mots entièrement distincts selon le côté de la famille.
  hi.a1.unit05.lesson02.teach.rehna_verb:
    title: Habite (rehna)
    gloss: habite (masculin / féminin / pluriel de respect)
    note: 'Le verbe « habiter, résider » : *rehta hai* pour un homme, *rehti hai* pour une femme, *rehte hain* pour plusieurs personnes ou un aîné respecté.'
    example_gloss:
    - Mon frère habite à Delhi.
    - Ma sœur habite à Bombay.
    - Mes grands-parents habitent à Delhi.
  hi.a1.unit05.lesson02.teach.tumhara_tumhari:
    title: Ton / ta (informel)
    gloss: ton, ta (informel, masculin / féminin)
    note: Le possessif du registre informel en *tum*, qui s’accorde avec le nom possédé exactement comme *mera/meri*.
    example_gloss:
    - Où habite ton frère ?
    - Où habite ta sœur ?
  hi.a1.unit05.lesson02.teach.mera_tumhara_note:
    title: Mera et tumhara ensemble
    gloss: '*Mera* et *tumhara* vont tous deux avec des mots masculins ; *meri* et *tumhari* vont tous deux avec des mots féminins : *mera bhai*/*tumhara bhai*, *meri behan*/*tumhari behan*.'
    note: Le même schéma d’accord que dans la leçon 1, qui s’applique aussi à *tumhara*.
  hi.a1.unit05.lesson03.teach.bada_badi:
    title: Aîné / grand
    gloss: aîné, grand (masculin / féminin)
    note: Le hindi marque l’aîné d’une fratrie avec cet adjectif qui s’accorde, et non avec un mot distinct ; le français, lui, passe par « aîné » ou « grand ».
    example_gloss:
    - Mon grand frère habite à Delhi.
    - Ma grande sœur habite à Bombay.
  hi.a1.unit05.lesson03.teach.chota_choti:
    title: Cadet / petit
    gloss: cadet, petit (masculin / féminin)
    note: Le pendant de *bada/badi*, pour un frère ou une sœur plus jeune.
    example_gloss:
    - Mon petit frère est étudiant en ce moment.
    - Ma petite sœur est étudiante en ce moment.
  hi.a1.unit05.lesson03.teach.bada_chota_note:
    title: Accord de bada/chota
    gloss: '*Bada* et *chota* vont avec des mots masculins, *badi* et *choti* avec des mots féminins : *bada bhai*, *badi behan*.'
    note: Le même accord masculin/féminin des adjectifs déjà vu avec *mera/meri*, appliqué ici aux mots qui indiquent l’âge.
  hi.a1.unit05.lesson03.teach.aur_lekin_bhi:
    title: Et, mais, aussi
    gloss: et, mais, aussi
    note: Trois mots de liaison de base, réutilisés dans le dialogue final de cette leçon.
    example_gloss:
    - Mon frère et ma sœur habitent à Delhi.
    - Mon frère habite à Delhi, mais ma sœur habite à Bombay.
    - J’ai aussi une sœur.
  hi.a1.unit05.lesson03.teach.accha_phir_milenge:
    title: D’accord, à bientôt
    gloss: D’accord ! À bientôt.
    note: Une formule de clôture amicale, reprise du vocabulaire d’adieu de l’unité 2.
  hi.a1.unit05.lesson03.teach.theek_hai_phir_milte_hain:
    title: Très bien, à bientôt
    gloss: Très bien, à bientôt !
    note: La réponse informelle à la formule de clôture précédente, comme dans les échanges de clôture des unités antérieures.
  hi.a1.unit05.lesson03.teach.dialogue.line01:
    title: Arjun interroge Priya sur sa famille
    gloss: Arjun demande où habite la famille de Priya.
    note: Reprend le schéma *parivar kahan rehta hai* de cette unité.
  hi.a1.unit05.lesson03.teach.dialogue.line02:
    title: Priya parle de ses parents et de son frère
    gloss: Priya dit que ses parents habitent à Delhi et qu’elle a aussi un grand frère.
    note: Combine *mata-pita*, *rehte hain* et *bada bhai bhi hai*.
  hi.a1.unit05.lesson03.teach.dialogue.line03:
    title: Arjun l’interroge sur ses grands-parents
    gloss: 'Arjun dit « Ah, d’accord ! » et demande : et tes grands-parents ?'
    note: '*Tumhare* est la forme de respect de *tumhara* employée pour les aînés, exactement comme *mere* pour *mera* (note sur le pluriel de respect de la leçon 1).'
  hi.a1.unit05.lesson03.teach.dialogue.line04:
    title: Priya parle de ses deux paires de grands-parents
    gloss: Priya dit que ses grands-parents paternels habitent à Delhi, mais que ses grands-parents maternels habitent à Bombay.
    note: Emploie *lekin* pour opposer les villes des deux paires de grands-parents, ce qui renforce la distinction dada-dadi/nana-nani de la leçon 2.
  hi.a1.unit05.lesson03.teach.dialogue.line05:
    title: Arjun parle de sa propre sœur
    gloss: Arjun dit qu’il a aussi une petite sœur.
    note: Reprend *bhi* et *choti behan*.
  hi.a1.unit05.lesson03.teach.dialogue.line06:
    title: Priya conclut la conversation
    gloss: Priya dit que c’est bien et qu’elle le reverra bientôt.
    note: Reprend la formule de clôture de cette leçon.
  hi.a1.unit05.lesson03.teach.dialogue.line07:
    title: Arjun répond
    gloss: Arjun est d’accord et dit à bientôt.
    note: Reprend la formule de réponse de cette leçon.
