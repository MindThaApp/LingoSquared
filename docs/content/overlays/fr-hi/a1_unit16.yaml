teaching:
  hi.a1.unit16.lesson01.teach.tum_ho_review:
    title: 'Révision : tu, bien, es'
    gloss: tu (informel), bien, es
    note: Une révision rapide des mots nécessaires pour demander à un ami comment il se sent.
    example_gloss: Comment vas-tu ?
  hi.a1.unit16.lesson01.teach.mujhe_hai_review:
    title: 'Révision : à moi, est'
    gloss: à moi / pour moi, est
    note: Le verbe « être » nécessaire pour construire la structure des symptômes de cette leçon.
    example_gloss: J’ai du travail.
  hi.a1.unit16.lesson01.teach.tum_theek_ho_phrase:
    title: Tu vas bien ?
    gloss: Tu vas bien ?
    note: La question d’ouverture de l’unité, pour prendre des nouvelles d’un ami.
  hi.a1.unit16.lesson01.teach.main_hoon_nahin_review:
    title: 'Révision : je, suis, non / ne… pas'
    gloss: je, suis, non / ne… pas
    note: Nécessaire pour répondre par la négative à « Tu vas bien ? ».
    example_gloss: Je vais bien.
  hi.a1.unit16.lesson01.teach.sir:
    title: Tête
    gloss: tête
    note: Un nouveau nom, nécessaire pour le premier symptôme de l’unité.
    example_gloss: Ma tête est grosse.
  hi.a1.unit16.lesson01.teach.dard:
    title: Douleur
    gloss: douleur / mal
    note: 'Un nouveau nom. Associé à une partie du corps, il désigne une douleur précise : voir la note de grammaire de cette unité.'
    example_gloss: J’ai mal.
  hi.a1.unit16.lesson01.teach.mujhe_sir_dard_hai_phrase:
    title: J’ai mal à la tête.
    gloss: J’ai mal à la tête.
    note: La première phrase complète de l’unité pour décrire un symptôme.
  hi.a1.unit16.lesson01.teach.grammar_symptom_hai:
    title: Mujhe + symptôme + hai
    gloss: '« Mujhe + nom + hai » a déjà été appris à l’unité 11 (« mujhe kaam hai » = j’ai du travail). Il sert maintenant aussi à dire les symptômes : « mujhe sir dard hai » signifie « j’ai mal à la tête » -- « sir dard » (sir = tête, dard = douleur) forment ensemble « mal de tête ». Ce n’est pas une nouvelle grammaire, c’est le même schéma qu’avant.'
    note: Présente un second emploi d’un schéma datif + nom + hai déjà étudié, en citant l’unité précédente avant de l’appliquer aux symptômes.
    target_text: '''मुझे + संज्ञा + है'' पहले यूनिट 11 में सीखा था (''मुझे काम है'' = j’ai du travail)। अब यह लक्षण बताने के लिए भी इस्तेमाल होता है: ''मुझे सिर दर्द है'' का मतलब है « j’ai mal à la tête » -- ''सिर दर्द'' (सिर = tête, दर्द = douleur) एक साथ मिलकर « mal de tête » बनाते हैं। यह कोई नया व्याकरण नहीं है, वही पुराना पैटर्न है।'
  hi.a1.unit16.lesson01.teach.bukhar:
    title: Fièvre
    gloss: fièvre
    note: Un nouveau nom, le deuxième symptôme de l’unité.
    example_gloss: Tu as de la fièvre ?
  hi.a1.unit16.lesson01.teach.mujhe_bukhar_hai_phrase:
    title: J’ai de la fièvre.
    gloss: J’ai de la fièvre.
    note: Le même schéma datif + nom + hai appliqué au deuxième symptôme de la leçon.
  hi.a1.unit16.lesson02.teach.tumhein_jaana_review:
    title: 'Révision : à toi, aller'
    gloss: à toi / pour toi, aller
    note: Déjà vus (unité 6 et unité 15) -- repris ici pour parler d’aller chez le médecin.
    example_gloss:
    - Que voudrais-tu ?
    - Je dois aller à la gare.
  hi.a1.unit16.lesson02.teach.ke_paas_review:
    title: 'Révision : près de / chez'
    gloss: près de / auprès de
    note: Vu à l’unité 8 -- repris ici, avec un troisième sens présenté dans la note de grammaire de cette leçon.
    example_gloss: La banque est près de l’école.
  hi.a1.unit16.lesson02.teach.doctor:
    title: Médecin
    gloss: médecin
    note: Un nouveau nom, le sujet principal de cette leçon.
    example_gloss: Le médecin est bon.
  hi.a1.unit16.lesson02.teach.mujhe_doctor_ke_paas_jana_hai_phrase:
    title: Je dois aller chez le médecin.
    gloss: Je dois aller chez le médecin.
    note: Associe *ke paas* à la construction d’obligation *mujhe...jana hai* de l’unité 15.
  hi.a1.unit16.lesson02.teach.grammar_ke_paas_third_sense:
    title: 'Ke paas : un troisième sens'
    gloss: 'Les deux premiers sens de « ke paas » ont été appris plus tôt : près de (unité 8 : « bank school ke paas hai ») et la possession (unité 2 : « mere paas ek kitab hai »). Voici un troisième emploi : aller auprès d’une PERSONNE, c’est-à-dire aller la voir -- « doctor ke paas jana hai » signifie « je dois aller chez le médecin ». Le schéma « mujhe...jana hai » de l’unité 15 est lui aussi repris.'
    note: Cite les deux sens précédents par numéro d’unité avant d’introduire le troisième, et signale aussi la reprise de la construction d’obligation.
  hi.a1.unit16.lesson02.teach.aaraam:
    title: Repos
    gloss: repose-toi
    note: Un nouveau nom, le premier conseil de l’unité.
    example_gloss: J’ai besoin de repos.
  hi.a1.unit16.lesson02.teach.chahiye_review:
    title: 'Révision : vouloir / avoir besoin'
    gloss: vouloir / avoir besoin de
    note: Vu à l’unité 6, repris ici pour dire ce dont quelqu’un a besoin.
    example_gloss: Je voudrais du thé.
  hi.a1.unit16.lesson02.teach.tumhein_aaraam_chahiye_phrase:
    title: Tu as besoin de repos.
    gloss: Tu as besoin de repos.
    note: Le schéma *tumhein...chahiye*, déjà établi, appliqué au nouveau nom de cette leçon.
  hi.a1.unit16.lesson02.teach.dawa:
    title: Médicament
    gloss: médicament
    note: Un nouveau nom, le deuxième conseil de l’unité.
    example_gloss: J’ai besoin de médicaments.
  hi.a1.unit16.lesson02.teach.tumhein_dawa_chahiye_phrase:
    title: Tu as besoin de médicaments.
    gloss: Tu as besoin de médicaments.
    note: Le même schéma *chahiye* appliqué au médicament.
  hi.a1.unit16.lesson02.teach.jaao_aur_review:
    title: 'Révision : va !, et'
    gloss: va !, et
    note: Déjà vus (unité 9 et unité 1/2) -- repris ici pour relier deux conseils.
    example_gloss:
    - Allez tout droit.
    - Je voudrais du thé et du café.
  hi.a1.unit16.lesson02.teach.karo_grammar:
    title: 'Karo : la règle de l’impératif en -o, réutilisée'
    gloss: '« Karo » suit la même règle de l’impératif en tum, vue plus tôt (« jao », « muro », « batao », « gino » -- tous en « -o »). Ici, il se forme à partir de « karna » (le « maaf karna » de l’unité 11) : le radical « kar » plus « -o » donne « karo », c’est-à-dire « fais ! ». « Aaraam karo » signifie « Repose-toi ! »'
    note: Extension directe et explicite de la règle de l’impératif déjà établie, appliquée à un verbe que l’apprenant connaît déjà à l’infinitif.
  hi.a1.unit16.lesson02.teach.aaraam_karo_phrase:
    title: Repose-toi !
    gloss: Repose-toi !
    note: Le nouvel impératif appliqué au premier conseil de l’unité.
  hi.a1.unit16.lesson02.teach.aaraam_karo_aur_doctor_ke_paas_jaao_phrase:
    title: Repose-toi et va chez le médecin.
    gloss: Repose-toi et va chez le médecin.
    note: Réunit les deux conseils de la leçon en une seule consigne naturelle, en préparation de la carte de lecture de la leçon 3.
  hi.a1.unit16.lesson03.teach.dialogue.line01:
    title: Priya demande à Arjun s’il va bien
    gloss: Arjun, tu vas bien ?
  hi.a1.unit16.lesson03.teach.dialogue.line02:
    title: Arjun dit qu’il a mal à la tête et de la fièvre
    gloss: Non, j’ai mal à la tête et de la fièvre.
  hi.a1.unit16.lesson03.teach.dialogue.line03:
    title: Priya dit qu’il a besoin de repos
    gloss: Ce n’est pas bien. Tu as besoin de repos.
  hi.a1.unit16.lesson03.teach.dialogue.line04:
    title: Arjun a aussi besoin de médicaments
    gloss: Oui, mais j’ai aussi besoin de médicaments.
  hi.a1.unit16.lesson03.teach.dialogue.line05:
    title: Priya dit qu’il doit aller chez le médecin
    gloss: D’accord. Tu dois aller chez le médecin.
  hi.a1.unit16.lesson03.teach.dialogue.line06:
    title: Arjun remercie Priya
    gloss: D’accord, merci.
  hi.a1.unit16.lesson03.teach.dialogue.line07:
    title: Priya lui dit de se reposer
    gloss: Repose-toi !
  hi.a1.unit16.lesson03.teach.dialogue.line08:
    title: Arjun est d’accord
    gloss: D’accord.
  hi.a1.unit16.lesson03.teach.grammar_summary:
    title: Trois règles principales
    gloss: 'Les trois règles principales de cette unité : (1) « mujhe/tumhein + symptôme + hai » dit un problème de santé (par ex. « mujhe bukhar hai ») ; (2) « tumhein/mujhe + chose + chahiye » dit un besoin (par ex. « tumhein aaraam chahiye ») ; (3) « X ke paas jana hai » dit chez qui il faut aller (par ex. « doctor ke paas jana hai »).'
    note: Résumé final qui relie toute la grammaire de l’unité, à l’image de la note de grammaire de l’unité 15 qui récapitule le paradigme.
  hi.a1.unit16.lesson03.teach.advice_reading:
    title: Lecture de quelques conseils
    gloss: Repose-toi. Va chez le médecin.
    note: Une consigne courte et directe (sans cadre narratif, comme les vrais conseils à l’oral) qui reprend exactement les faits déjà établis dans le dialogue, sans rien ajouter de nouveau.
    glosses:
      आराम: se reposer
      करो: faire (impératif, de करना)
      डॉक्टर: médecin
      जाओ: va (impératif, de जाना)
