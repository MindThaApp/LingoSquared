teaching:
  hi.a1.unit10.lesson01.teach.review_time:
    title: 'Révision : heure pile, matin, après-midi, soir, nuit, à'
    gloss: heures (o’clock), matin, après-midi, soir, nuit, à (moment général)
    note: 'Petite révision des mots de temps de l’unité 4 : cette unité les réutilise beaucoup.'
    example_gloss:
    - Il est 8 heures du matin maintenant.
    - Il n’y a pas de cours la nuit.
  hi.a1.unit10.lesson01.teach.uthna:
    title: Je me lève
    gloss: je me lève (locuteur masculin / féminin)
    note: 'Premier verbe au présent habituel de cette unité : il étend le schéma -ta/-tee vu à l’unité 5 (rahta hai/rahtee hai) à la première personne, avec hoon.'
    example_gloss:
    - Je me lève à 7 heures du matin.
    - Je me lève à 6 heures du matin.
  hi.a1.unit10.lesson01.teach.roz:
    title: Chaque jour
    gloss: chaque jour
    note: Un nouvel adverbe pour décrire ses habitudes.
    example_gloss: Je me lève tous les matins.
  hi.a1.unit10.lesson01.teach.nashta_karna:
    title: Je prends le petit-déjeuner
    gloss: je prends le petit-déjeuner (locuteur masculin / féminin)
    note: « Nashta » (petit-déjeuner) se combine avec « karta/kartee hoon » (je fais).
    example_gloss:
    - Le matin, je prends le petit-déjeuner.
    - Le matin, je prends le petit-déjeuner.
  hi.a1.unit10.lesson01.teach.kaam_par_jaana:
    title: Je vais au travail
    gloss: je vais au travail (locuteur masculin / féminin)
    note: '« Kaam par jaana » (aller au travail) exige le mot « par » (sur/à) : c’est une expression figée, contrairement à « school jaana » plus loin dans cette unité, qui n’a besoin d’aucun mot supplémentaire.'
    example_gloss:
    - Ensuite, je vais au travail.
    - Ensuite, je vais au travail.
  hi.a1.unit10.lesson01.teach.habitual_paradigm_note:
    title: Le schéma du présent habituel
    gloss: 'Pour décrire une habitude quotidienne, le verbe prend -ta/-tee/-te, puis on ajoute hoon/ho/hai/hain selon le sujet : je me lève (masc./fém.) « hoon », tu te lèves « ho », il/elle se lève « hai », ils se lèvent « hain ».'
    note: Cette note présente d’emblée tout le schéma (déjà entrevu dans le dialogue de l’unité 1 et formalisé pour la troisième personne à l’unité 5), afin que les exercices de cette leçon ne demandent pas de deviner une forme non enseignée.
  hi.a1.unit10.lesson01.teach.full_routine_phrase:
    title: Mon matin, étape par étape
    gloss: Je me lève à 7 heures tous les matins, puis je prends le petit-déjeuner, puis je vais au travail.
    note: Réunit les trois verbes de routine de cette leçon dans une phrase naturelle qui enchaîne les étapes.
  hi.a1.unit10.lesson02.teach.sona:
    title: Je dors
    gloss: je dors (locuteur masculin / féminin)
    note: Le même schéma -ta/-tee + hoon appliqué à un nouveau verbe.
    example_gloss:
    - Je dors à 11 heures du soir.
    - Je dors à 10 heures du soir.
  hi.a1.unit10.lesson02.teach.school_jaana:
    title: Je vais à l’école
    gloss: je vais à l’école (locuteur masculin / féminin)
    note: Contrairement à « kaam par jaana », « school jaana » n’a besoin d’aucun mot supplémentaire avant « jaana ».
    example_gloss:
    - Je vais à l’école à 8 heures tous les matins.
    - Je vais à l’école à 8 heures tous les matins.
  hi.a1.unit10.lesson02.teach.tum_form_note:
    title: 'La forme tum : -te/-tee + ho'
    gloss: 'Avec « tum » (tu, familier), le verbe prend -te/-tee et « ho » : tu te lèves (à un homme) / tu te lèves (à une femme), tu dors (à un homme) / tu dors (à une femme).'
    note: La deuxième personne du même paradigme présenté à la leçon 1.
  hi.a1.unit10.lesson02.teach.addressee_gender_note:
    title: Avec le genre de qui s’accorde la forme tum ?
    gloss: 'Le verbe à la forme tum s’accorde avec le genre de la personne à qui l’on parle, et non de celui qui parle : à Priya, « Quand te lèves-tu ? » (forme féminine) ; à Arjun, « Quand te lèves-tu ? » (forme masculine).'
    note: Un point très facile à manquer, vérifié sur chaque phrase à la forme tum du dialogue de la leçon 3.
  hi.a1.unit10.lesson02.teach.kab_uthte_ho_phrase:
    title: Quand te lèves-tu ?
    gloss: Quand te lèves-tu ? (à un homme)
    note: Une question toute prête qui utilise la nouvelle forme tum de cette leçon.
  hi.a1.unit10.lesson02.teach.pahle_phir_routine:
    title: D’abord je me lève, ensuite je prends le petit-déjeuner
    gloss: D’abord je me lève, ensuite je prends le petit-déjeuner.
    note: Réutilise « pahle »/« phir » (d’abord/ensuite) de l’unité 9, où ils servaient à enchaîner des directions, pour enchaîner ici les étapes d’une routine.
  hi.a1.unit10.lesson02.teach.kaam_idiom_note:
    title: Kaam par ou école
    gloss: '« Kaam par jaana » (aller au travail) exige « par », mais « school jaana » (aller à l’école) n’a besoin d’aucun mot supplémentaire : les deux sont corrects et courants.'
    note: Une vraie différence idiomatique, et non une règle générale avec une exception.
  hi.a1.unit10.lesson03.teach.vaapas:
    title: De retour
    gloss: de retour
    note: S’emploie avec « aana » (venir) pour dire « revenir ».
    example_gloss: Je rentre.
  hi.a1.unit10.lesson03.teach.aana:
    title: Je viens
    gloss: je viens (locuteur masculin / féminin)
    note: Un nouveau verbe, qui suit le même schéma du présent habituel déjà établi.
    example_gloss:
    - Je rentre le soir.
    - Je rentre le soir.
  hi.a1.unit10.lesson03.teach.khana_verb:
    title: Je mange (un repas)
    gloss: je mange (locuteur masculin / féminin)
    note: '« Khana » le nom (nourriture, unité 6) et « khana » le verbe (manger) : un redoublement naturel en hindi, et non une faute de frappe.'
    example_gloss:
    - Je mange la nuit.
    - Je mange la nuit.
  hi.a1.unit10.lesson03.teach.raat_ka_khana:
    title: Le dîner
    gloss: 'dîner (littéralement : « le repas de la nuit »)'
    note: Réutilise « raat » (nuit), « ka » (possessif) et « khana » (nourriture), tous déjà enseignés.
    example_gloss: Le dîner est très délicieux.
  hi.a1.unit10.lesson03.teach.dialogue.line01:
    title: Arjun demande à Priya quand elle se lève
    gloss: Arjun demande à Priya à quelle heure elle se lève tous les jours.
    note: Utilise la forme tum féminine, qui s’adresse correctement à Priya.
  hi.a1.unit10.lesson03.teach.dialogue.line02:
    title: Priya répond
    gloss: 'Priya dit : je me lève à 6 heures tous les matins. Ensuite je prends le petit-déjeuner.'
  hi.a1.unit10.lesson03.teach.dialogue.line03:
    title: Arjun parle de sa propre routine
    gloss: 'Arjun dit : super ! Moi, je me lève à 7 heures. Je prends aussi le petit-déjeuner, puis je vais au travail.'
  hi.a1.unit10.lesson03.teach.dialogue.line04:
    title: Priya demande à Arjun quand il rentre
    gloss: Priya demande à Arjun quand il rentre.
    note: Utilise la forme tum masculine, qui s’adresse correctement à Arjun. Introduit « vaapas aana » en contexte.
  hi.a1.unit10.lesson03.teach.dialogue.line05:
    title: Arjun décrit sa soirée
    gloss: 'Arjun dit : je rentre à 6 heures du soir. Ensuite je dîne, puis je dors.'
  hi.a1.unit10.lesson03.teach.dialogue.line06:
    title: Priya décrit sa soirée
    gloss: 'Priya dit : moi aussi, je rentre le soir, puis je mange.'
  hi.a1.unit10.lesson03.teach.dialogue.line07:
    title: Arjun demande à Priya quand elle dort
    gloss: Arjun demande à quelle heure Priya se couche.
    note: Encore une fois la forme féminine de tum, adressée correctement à Priya.
  hi.a1.unit10.lesson03.teach.dialogue.line08:
    title: Priya répond et conclut
    gloss: 'Priya dit : Je me couche à 11 heures du soir. D’accord, à demain !'
  hi.a1.unit10.lesson03.teach.dialogue.line09:
    title: Arjun conclut
    gloss: 'Arjun dit : D’accord, à bientôt !'
