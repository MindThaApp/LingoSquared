teaching:
  hi.a1.unit30.lesson01.teach.parhna_kasrat_karna:
    title: Lire, faire du sport, cuisiner
    gloss: lire, faire de l’exercice / du sport, cuisiner
    note: 'En hindi, on nomme les loisirs par un verbe en *-ना* : *पढ़ना*, *कसरत करना* et *खाना बनाना* (« lire », « faire de l’exercice », « cuisiner »).'
    example_gloss:
    - J’aime lire un livre.
    - Je fais du sport le samedi.
    - J’aime cuisiner pour des amis.
  hi.a1.unit30.lesson01.teach.khalee_samay:
    title: Le temps libre
    gloss: temps libre
    note: '*खाली समय* (« temps vide ») est l’expression clé pour parler des loisirs, et *में* donne « dans / pendant » : *खाली समय में*.'
    example_gloss: Pendant mon temps libre, j’aime lire.
  hi.a1.unit30.lesson01.teach.mujhe_khalee_samay:
    title: Dire ce que tu fais pendant ton temps libre
    gloss: Pendant mon temps libre, j’aime lire.
    note: '*मुझे ... पढ़ना पसंद है* (« à moi, lire est plaisant ») est la façon de dire « j’aime lire » en hindi ; *मुझे* indique la personne qui aime.'
  hi.a1.unit30.lesson02.teach.sangeet_sunna_chitr:
    title: Musique, dessin, jeux vidéo
    gloss: écouter de la musique, dessiner, jouer aux jeux vidéo
    note: 'Trois autres loisirs : *संगीत सुनना*, *चित्र बनाना* et *गेम खेलना* ; *गेम* est un mot emprunté à l’anglais.'
    example_gloss:
    - J’aime écouter de la musique.
    - Je dessine souvent.
    - J’aime jouer aux jeux vidéo avec des amis.
  hi.a1.unit30.lesson02.teach.mujhe_sangeet_sunna:
    title: Dire que tu aimes écouter de la musique
    gloss: J’aime écouter de la musique.
    note: '*संगीत सुनना* (« écouter de la musique ») n’a besoin d’aucun mot supplémentaire : l’objet se place directement devant le verbe.'
  hi.a1.unit30.lesson02.teach.mujhe_doston_ke:
    title: Dire que tu aimes jouer aux jeux vidéo avec des amis
    gloss: J’aime jouer aux jeux vidéo avec des amis.
    note: Dans *दोस्तों के साथ* (« avec des amis »), *दोस्त* est à l’oblique pluriel (*दोस्तों*) parce qu’il précède *के साथ*.
  hi.a1.unit30.lesson03.teach.hamesha_aksar_kabheekbhee:
    title: Toujours, souvent, parfois, jamais
    gloss: toujours, souvent, parfois, jamais
    note: Les mots de fréquence comme *हमेशा*, *अक्सर*, *कभी-कभी* et *कभी नहीं* se placent en général avant le verbe, et *कभी नहीं* signifie « jamais ».
    example_gloss:
    - Je fais toujours du sport le samedi.
    - Je lis souvent un livre.
    - Je dessine parfois.
    - Je ne joue jamais aux jeux vidéo.
  hi.a1.unit30.lesson03.teach.har_hafte_har:
    title: Chaque semaine, chaque week-end
    gloss: chaque semaine, chaque week-end
    note: '*हर* (« chaque ») ne change jamais, et le mot de temps qui suit reste à la forme simple : *हर हफ़्ते*, *हर वीकेंड*.'
    example_gloss:
    - Je cuisine pour des amis chaque semaine.
    - Je fais du sport chaque week-end.
  hi.a1.unit30.lesson03.teach.har_hafte_har_2:
    title: हर reste invariable
    gloss: Chaque semaine, chaque week-end.
    note: '*हर* reste invariable quel que soit le nom qui le suit : il n’y a donc aucune forme à choisir : *हर हफ़्ते*, *हर वीकेंड*.'
  hi.a1.unit30.lesson03.teach.tum_khalee_samay:
    title: Poser une question sur le temps libre
    gloss: Que fais-tu pendant ton temps libre ?
    note: 'C’est la question centrale de cette unité : réutilise-la pour interroger quelqu’un sur ses loisirs.'
  hi.a1.unit30.lesson04.teach.priya_ham_aksar:
    title: Priya aborde les loisirs
    gloss: 'Priya : Nous nous promenons souvent ensemble. Mais toi, Arjun, que fais-tu d’autre pendant ton temps libre ?'
    note: '*टहलते हैं* est au pluriel parce que le sujet est *हम* (« nous »), et *अक्सर* se place avant le verbe.'
  hi.a1.unit30.lesson04.teach.arjun_mujhe_khana:
    title: Les loisirs d’Arjun
    gloss: 'Arjun : J’aime cuisiner, même à la maison. Et je fais souvent de l’exercice.'
    note: '*घर पर भी* (« aussi à la maison ») montre qu’Arjun cuisine pour le plaisir, pas seulement au travail.'
  hi.a1.unit30.lesson04.teach.priya_tum_ghar:
    title: Priya est surprise
    gloss: 'Priya : Tu cuisines aussi à la maison ? Tu cuisines déjà toute la journée au travail !'
    note: '*पूरा दिन* (« toute la journée ») souligne combien il cuisine déjà au travail, et *तो* ajoute de l’insistance.'
  hi.a1.unit30.lesson04.teach.arjun_han_lekin:
    title: Arjun s’explique
    gloss: 'Arjun : Oui, mais cuisiner me détend. Et toi, qu’est-ce que tu aimes faire ?'
    note: '*खाना बनाने से सुकून मिलता है* signifie « cuisiner me détend » (littéralement : « de la cuisine, on reçoit du calme ») ; *बनाना* devient *बनाने* devant *से*.'
  hi.a1.unit30.lesson04.teach.priya_mujhe_parhna:
    title: Les loisirs de Priya
    gloss: 'Priya : J’aime lire et j’écoute souvent de la musique.'
    note: '*और* (« et ») relie deux loisirs, et *सुनती हूँ* est au féminin parce que c’est Priya qui parle.'
  hi.a1.unit30.lesson04.teach.arjun_kya_tum:
    title: Arjun interroge Priya sur les jeux vidéo
    gloss: 'Arjun : Tu joues aussi aux jeux vidéo ?'
    note: 'Une courte question fermée : *क्या* l’ouvre, et *खेलती हो* est au féminin parce qu’Arjun s’adresse à Priya.'
  hi.a1.unit30.lesson04.teach.priya_naheen_main:
    title: Priya répond
    gloss: 'Priya : Non, je ne joue jamais aux jeux vidéo. Mais je dessine parfois !'
    note: '*कभी ... नहीं* (« jamais ») et *कभी-कभी* (« parfois ») s’opposent dans une même réponse.'
  hi.a1.unit30.lesson05.teach.arjun_aur_main:
    title: Comparer des loisirs
    gloss: Arjun et moi, nous nous promenons souvent ensemble. Mais nous avons aussi d’autres loisirs. Arjun aime cuisiner, même à la maison, et il fait souvent de l’exercice. J’aime lire et j’écoute souvent de la musique. Je dessine parfois, mais je ne joue jamais aux jeux vidéo. Et toi, qu’est-ce que tu aimes faire pendant ton temps libre ?
    note: Le message de Priya reprend des éléments vus plus tôt et se termine en posant au lecteur la question centrale de l’unité.
    glosses:
      टहलते: se promener
      अक्सर: souvent
      साथ: ensemble
      और: autre
      बनाना: faire (cuisiner)
      पसंद: aime
      घर: à la maison
      कसरत: fait du sport
      पढ़ना: lire
      सुनती: écouter
      संगीत: musique
      चित्र: image (dessin)
      कभी-कभी: parfois
      गेम: jouer aux jeux vidéo
      कभी: jamais (avec नहीं)
      खाली: libre
      समय: temps
  hi.a1.unit30.lesson06.teach.arjun_tum_is:
    title: Arjun interroge Priya sur le week-end
    gloss: 'Arjun : Qu’est-ce que tu fais ce week-end ?'
    note: Dans *इस वीकेंड* (« ce week-end »), *इस* se place devant le nom, et *कर रही हो* est le présent en cours (« tu fais »), au féminin parce qu’on s’adresse à Priya.
  hi.a1.unit30.lesson06.teach.priya_abhee_pata:
    title: Priya hésite
    gloss: 'Priya : Je ne sais pas encore. J’aime lire, mais je veux aussi sortir.'
    note: '*बाहर जाना चाहती हूँ* signifie « je veux sortir » ; *चाहती* est au féminin et se place après *जाना*.'
  hi.a1.unit30.lesson06.teach.arjun_chalo_sath:
    title: Arjun propose un programme
    gloss: 'Arjun : Si on se promenait ensemble ? Après, je cuisinerai pour nous.'
    note: '*उसके बाद* (« après cela ») met les deux projets dans l’ordre, et *चलो ... टहलें* propose le premier.'
  hi.a1.unit30.lesson06.teach.priya_achchha_aidiya:
    title: Priya est d’accord
    gloss: 'Priya : Bonne idée ! J’aime autant me promener que cuisiner.'
    note: '*दोनों पसंद हैं* montre que Priya aime les deux de la même façon, et le verbe est au pluriel : *हैं*.'
  hi.a1.unit30.lesson06.teach.arjun_barhiya_to:
    title: Arjun confirme
    gloss: 'Arjun : Parfait. Alors à samedi !'
    note: '*शनिवार को मिलते हैं* (« on se voit samedi ») emploie le présent pour un projet fixé, et *को* marque le jour.'
