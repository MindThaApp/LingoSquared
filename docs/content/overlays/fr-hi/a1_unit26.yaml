teaching:
  hi.a1.unit26.lesson01.teach.jaiket_svetar:
    title: Manteau, pull
    gloss: le manteau, le pull
    note: '*जैकेट* est féminin et *स्वेटर* est masculin, ce que l’on voit dans les mots qui les accompagnent : *मेरी जैकेट*, *मेरा स्वेटर*.'
    example_gloss:
    - Je cherche un manteau.
    - J’ai un pull.
  hi.a1.unit26.lesson01.teach.paint_joote:
    title: Pantalon, chaussures
    gloss: le pantalon, les chaussures
    note: '*पैंट* est un seul mot pour un pantalon (*मेरी पैंट*), et *जूते* est le pluriel de *जूता* : un nom masculin en *-आ* passe à *-ए* au pluriel.'
    example_gloss:
    - Je cherche un pantalon.
    - Je cherche des chaussures.
  hi.a1.unit26.lesson01.teach.main_ek_jaiket:
    title: Dire ce que l’on cherche
    gloss: Je cherche un manteau.
    note: 'Le verbe vient en dernier : *मैं एक जैकेट ढूँढ़ रहा हूँ*. *रहा हूँ* exprime l’action en cours (« je suis en train de chercher »), et *रहा* est la forme masculine (une femme dit *रही*).'
  hi.a1.unit26.lesson02.teach.saiz:
    title: Taille
    gloss: la taille
    note: '*साइज़* est un nom masculin ; les mots qui l’accompagnent sont donc aussi au masculin : *मेरा साइज़*.'
    example_gloss: Quelle taille portes-tu ?
  hi.a1.unit26.lesson02.teach.apka_saiz_kya:
    title: Demander la taille
    gloss: Quelle taille portes-tu ?
    note: '*कौन सा* (« quel ») interroge sur un choix parmi plusieurs, et *सा* s’accorde avec le nom : *कौन सा साइज़*, mais *कौन सी जैकेट*. *आप* est le « vous » de politesse pour un vendeur.'
  hi.a1.unit26.lesson02.teach.mera_saiz_em:
    title: Indiquer sa taille
    gloss: Je fais du M.
    note: 'Ici, l’hindi n’utilise pas de verbe pour « avoir » : *मेरा साइज़ एम है* signifie littéralement « ma taille est M », et *मेरा* s’accorde avec le masculin *साइज़*.'
  hi.a1.unit26.lesson03.teach.kala_neela:
    title: Noir, bleu
    gloss: noir, bleu
    note: Les deux adjectifs de couleur de base de cette leçon.
    example_gloss:
    - Je voudrais le manteau en noir.
    - Vous avez aussi celui-ci en bleu ?
  hi.a1.unit26.lesson03.teach.mujhe_vah_jaiket:
    title: Demander une couleur
    gloss: Je voudrais le manteau en noir.
    note: '*मुझे ... चाहिए* est la façon de dire « je veux » en hindi : le souhait arrive « à moi » (*मुझे*), et la chose voulue se place juste avant *चाहिए*.'
  hi.a1.unit26.lesson03.teach.kya_apke_pas:
    title: Demander une autre couleur
    gloss: Vous avez aussi celui-ci en bleu ?
    note: '*आपके पास ... है?* (littéralement « chez vous ... est ? ») est la façon polie de demander « avez-vous ... ? », et *भी* (« aussi ») se place après le mot qu’il ajoute.'
  hi.a1.unit26.lesson04.teach.kya_yah_jaiket:
    title: Demander si ça va
    gloss: Ce manteau me va-t-il ?
    note: 'L’hindi dit que les vêtements « viennent bien » : *ठीक आती है*. Le verbe s’accorde avec la chose : le féminin *जैकेट* donne *आती*, et le masculin *स्वेटर* donnerait *आता*.'
  hi.a1.unit26.lesson04.teach.yah_ekdam_theek:
    title: Confirmer que ça va bien
    gloss: Ça va bien.
    note: '*एकदम* (« tout à fait ») donne « il me va parfaitement » ; *आती है* s’accorde avec le féminin *जैकेट*.'
  hi.a1.unit26.lesson04.teach.yah_bahut_chhotee:
    title: Trop petit
    gloss: C’est trop petit.
    note: '*बहुत* se place avant l’adjectif et donne ici le sens de « trop » : *बहुत छोटी*. L’adjectif s’accorde avec le féminin *जैकेट*.'
  hi.a1.unit26.lesson04.teach.yah_bahut_baree:
    title: Trop grand
    gloss: C’est trop grand.
    note: 'Même schéma avec *बड़ी* : *बड़ा* devient *बड़ी* pour un nom féminin, donc *बहुत बड़ी*.'
  hi.a1.unit26.lesson05.teach.nabbe:
    title: Neuf cents
    gloss: neuf cents
    note: '*नौ सौ* est le nombre 900, utilisé ici dans le prix de la veste.'
    example_gloss: Le manteau coûte neuf cents roupies.
  hi.a1.unit26.lesson05.teach.jaiket_kee_keemat:
    title: Indiquer un prix
    gloss: Le manteau coûte neuf cents roupies.
    note: 'L’hindi dit « le prix de la veste est ... » : *जैकेट की कीमत नौ सौ रुपये है*. *की* s’accorde avec le féminin *कीमत*, et non avec *जैकेट*.'
  hi.a1.unit26.lesson05.teach.sardee_kee_jaiket:
    title: Lire un ticket de magasin
    gloss: 'Manteau d’hiver : taille M, couleur noire. Prix : neuf cents roupies. Ce manteau va très bien et il est chaud.'
    note: Repère la taille, la couleur, le prix et les deux qualités mentionnées pour le manteau.
    glosses:
      सर्दी: d’hiver
      साइज़: taille
      रंग: couleur
      काला: noir
      कीमत: prix
      नौ: neuf
      सौ: cent
      रुपये: roupies
      जैकेट: manteau
      आती: va (bien)
      गर्म: chaud
  hi.a1.unit26.lesson06.teach.priya_yah_jaiket:
    title: Priya remarque le manteau
    gloss: 'Priya : Ce manteau est super ! Tu fais quelle taille ?'
    note: '*अच्छी* s’accorde avec le féminin *जैकेट*. *तुम्हारा* est le « ton/ta » informel, utilisé entre amis.'
  hi.a1.unit26.lesson06.teach.arjun_mera_saiz:
    title: Arjun demande à l’essayer
    gloss: 'Arjun : Je fais du M. Je peux l’essayer ?'
    note: '*पहनकर देखना* (« porter et voir ») est la façon de dire « essayer » en hindi. *सकता हूँ* signifie « je peux », et une femme dit *सकती हूँ*.'
  hi.a1.unit26.lesson06.teach.priya_zaroor_kya:
    title: Priya demande si ça va bien
    gloss: 'Priya : Bien sûr. Il te va bien ?'
    note: '*यह* signifie « il/elle » ou « ceci », et *आती* s’accorde avec le féminin *जैकेट*.'
  hi.a1.unit26.lesson06.teach.arjun_han_yah:
    title: Arjun confirme
    gloss: 'Arjun : Oui, il me va parfaitement et il est chaud aussi.'
    note: 'Correspond exactement au ticket lu dans la leçon 5 : c’est le même manteau.'
  hi.a1.unit26.lesson06.teach.priya_barhiya_tum:
    title: Priya demande la couleur
    gloss: 'Priya : Super ! Tu le prends en noir ou en bleu ?'
    note: '*या* (« ou ») propose un choix. Le second *रंग* peut être omis : *काले रंग में ... या नीले में*. *तुम* est informel.'
  hi.a1.unit26.lesson06.teach.arjun_main_ise:
    title: Arjun se décide
    gloss: 'Arjun : Je le prends en noir.'
    note: '*लूँगा* est le futur de *लेना* (« prendre »), le verbe habituel pour annoncer sa décision dans un magasin. Une femme dit *लूँगी*.'
  hi.a1.unit26.lesson06.teach.main_leta_hoon:
    title: लेता हूँ et लेता है
    gloss: Je prends, il prend.
    note: '*-ता* est la terminaison de l’habituel et s’accorde avec le sujet, tandis que *हूँ* accompagne *मैं* et *है* accompagne *वह*.'
