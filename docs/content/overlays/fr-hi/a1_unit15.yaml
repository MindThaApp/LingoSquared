answer_policy:
  mujhe_verb_hai: This unit's central grammar point is the दात-subject obligation construction "X + verb-infinitive + है" (मुझे/तुम्हें/हमें/आपको + infinitive + है = "X needs/has to ___"). A typed answer that drops है entirely, or that appends हैं instead of है (है is invariant here -- it agrees with the infinitive verb, not the दात subject), should be marked incorrect -- this is the exact point being tested.
  kitne_ka_gender: '"टिकट कितने का है?" (how much is the ticket) is taught with का, treating टिकट as masculine -- the same कितने का/की gender-agreement rule unit07 already established. Many native speakers also use टिकट as feminine (टिकट कितने की है?), so की with टिकट is ACCEPTED as a valid alternative wherever typed; plural के with one ticket is the error the grammar_check targets.'
  train_gender: ट्रेन is grammatically feminine, so every habitual-present verb form describing it in this unit uses जाती है, never जाता है. A typed answer using जाता है for the train should be marked incorrect as a real agreement error.
  nasalization_marks: Display and teach the correct chandrabindu/anusvara distinction. This unit's one new nasalized word, हमें, uses anusvara, verified against a direct codepoint check -- consistent with the already-established तुम्हें convention. In typed A1 answers, accept a variant that drops a nasalization mark entirely or substitutes anusvara for chandrabindu (or vice versa) when every other character is correct. Do not extend this tolerance to a wrong vowel or consonant, which changes the actual word.
  punctuation: Hindi text is shown with the traditional danda (।) as the sentence-final mark. In typed answers, accept the danda, a plain period (.), or the mark omitted entirely as equivalent. Question marks (?) may likewise be omitted, but the fully punctuated form remains the model answer.
  spoken_answers: Judge spoken responses by intelligibility rather than written punctuation or nasalization marks. For any exercise asking the learner to state their own travel request, accept any of this unit's taught phrasings that fit the prompt, not only the single model sentence given in `accepted_answers`.
course:
  title: Hindi A1
units:
  hi.a1.unit15.travel:
    title: Voyage
lessons:
  hi.a1.unit15.lesson01.station_jana:
    title: Je dois aller à la gare
  hi.a1.unit15.lesson02.platform_samay:
    title: Numéro de quai et horaire
  hi.a1.unit15.lesson03.priya_arjun_station:
    title: 'Priya et Arjun : à la gare'
teaching:
  hi.a1.unit15.lesson01.teach.station_mujhe_hai_review:
    title: 'Révision : gare, à moi, est'
    gloss: gare, à moi / pour moi, est
    note: Petit rappel du nom de lieu et de la copule nécessaires pour construire l’expression de l’obligation de cette leçon.
    example_gloss:
    - La gare est ici.
    - J’ai du travail.
  hi.a1.unit15.lesson01.teach.jaana:
    title: Aller
    gloss: aller (infinitif)
    note: 'C’est l’infinitif du verbe déjà connu à l’impératif en तुम, *jao* (unité 9) : cette leçon présente l’infinitif lui-même.'
    example_gloss: Je dois aller quelque part.
  hi.a1.unit15.lesson01.teach.grammar_mujhe_verb_hai:
    title: Mujhe + verbe + hai = devoir
    gloss: '« Mujhe » a déjà été vu avec « chahiye » (unité 6, avec un nom) et avec « hai » (unité 11, comme dans « mujhe kaam hai », j’ai du travail). Il s’emploie maintenant aussi avec un verbe : « mujhe jana hai » signifie « je dois y aller ». Attention : avec « jana », « hai » ne change pas et ne devient jamais « hain » : il ne s’accorde pas avec la personne qui parle.'
    note: Présente le troisième emploi d’un schéma pronom + copule déjà vu, en rappelant les deux emplois précédents avec leur numéro d’unité avant d’introduire le verbe.
  hi.a1.unit15.lesson01.teach.mujhe_station_jana_hai_phrase:
    title: Je dois aller à la gare.
    gloss: Je dois aller à la gare.
    note: Le premier exemple complet de la construction de l’obligation dans cette unité.
  hi.a1.unit15.lesson01.teach.tiket:
    title: Billet
    gloss: billet
    note: Un nouveau nom, utile tout au long de cette unité sur le voyage.
    example_gloss: Où est mon billet ?
  hi.a1.unit15.lesson01.teach.chahiye_review:
    title: 'Révision : vouloir / avoir besoin de'
    gloss: vouloir / avoir besoin de
    note: Vu à l’unité 6 avec des boissons, réutilisé ici avec un billet.
    example_gloss: Je voudrais du thé.
  hi.a1.unit15.lesson01.teach.mujhe_tiket_chahiye_phrase:
    title: Il me faut un billet.
    gloss: Il me faut un billet.
    note: Le schéma déjà connu *mujhe...chahiye* appliqué au nouveau nom de cette unité.
  hi.a1.unit15.lesson01.teach.train:
    title: Train
    gloss: train
    note: Un nouveau nom.
    example_gloss: Le train est grand.
  hi.a1.unit15.lesson01.teach.delhi_ka_review:
    title: 'Révision : Delhi, de'
    gloss: Delhi, de (marqueur possessif)
    note: 'Delhi a été vu à l’unité 5 ; le marqueur possessif *ka* est déjà employé tout au long du cours (par ex. unités 5 à 14) : ici, il sert à indiquer la destination d’un billet.'
    example_gloss:
    - Mon frère habite à Delhi.
    - C’est le sac d’Arjun.
  hi.a1.unit15.lesson01.teach.mujhe_delhi_ka_tiket_chahiye_phrase:
    title: Il me faut un billet pour Delhi.
    gloss: Il me faut un billet pour Delhi.
    note: Associe le nom de cette leçon au marqueur possessif pour indiquer une destination précise.
  hi.a1.unit15.lesson01.teach.kahan_tumhein_review:
    title: 'Révision : où, à toi'
    gloss: où, à toi / pour toi
    note: Deux mots déjà vus (unités 8 et 6), réutilisés ici pour demander où quelqu’un doit aller.
    example_gloss:
    - Où est la banque ?
    - Qu’est-ce qu’il te faut ?
  hi.a1.unit15.lesson02.teach.number_review:
    title: 'Révision : numéro'
    gloss: numéro
    note: Vu à l’unité 2 pour les numéros de téléphone, réutilisé ici pour un numéro de quai.
    example_gloss: Quel est ton numéro de téléphone ?
  hi.a1.unit15.lesson02.teach.platform:
    title: Quai
    gloss: quai
    note: 'Un nouveau nom : le mot hindi courant pour le quai de gare, un emprunt à l’anglais, comme *phone* à l’unité 2.'
    example_gloss: Le quai est grand.
  hi.a1.unit15.lesson02.teach.platform_number_kya_hai_phrase:
    title: Quel est le numéro du quai ?
    gloss: Quel est le numéro du quai ?
    note: Reprend la question *kya hai*, déjà connue (numéro de téléphone, prix, âge), pour un nouveau sujet.
  hi.a1.unit15.lesson02.teach.platform_number_teen_hai_phrase:
    title: Le quai numéro 3.
    gloss: Le numéro du quai est 3.
    note: La réponse naturelle, en phrase complète, à la question précédente.
  hi.a1.unit15.lesson02.teach.jaana_habitual_grammar:
    title: Jaati hai (accord au féminin)
    gloss: '« Jaati hai » applique la règle de l’unité 10 (-ta/-ti/-te + hai/hain) avec le nouveau verbe « jana ». Le mot « train » est féminin en hindi : on dit donc « jaati hai » et non « jaata hai ».'
    note: Prolongement direct de l’accord du présent habituel déjà vu, appliqué à un nouveau verbe et à un nouveau nom féminin.
  hi.a1.unit15.lesson02.teach.se_review:
    title: 'Révision : de, depuis'
    gloss: de, depuis
    note: Vu à l’unité 9 pour les directions, réutilisé ici pour le quai de départ du train.
    example_gloss: Allez tout droit à partir d’ici.
  hi.a1.unit15.lesson02.teach.train_platform_se_jaati_hai_phrase:
    title: Le train part du quai numéro 3.
    gloss: Le train part du quai numéro 3.
    note: Associe la forme du présent habituel de cette leçon à la postposition « de, depuis » déjà connue.
  hi.a1.unit15.lesson02.teach.kitne_baje_review:
    title: 'Révision : à quelle heure'
    gloss: à quelle heure
    note: Vu à l’unité 4 pour dire l’heure, réutilisé ici pour demander une heure de départ.
    example_gloss: Quelle heure est-il ?
  hi.a1.unit15.lesson02.teach.train_kitne_baje_jaati_hai_phrase:
    title: À quelle heure part le train ?
    gloss: À quelle heure part le train ?
    note: La question « à quelle heure » appliquée à un départ prévu, et non à l’heure actuelle.
  hi.a1.unit15.lesson02.teach.train_chhah_baje_jaati_hai_phrase:
    title: Le train part à 6 h.
    gloss: Le train part à 6 h.
    note: La réponse naturelle, en phrase complète, avec la forme du pluriel *baje* de l’unité 4 (six n’est pas l’exception *baja*, qui ne concerne que une heure).
  hi.a1.unit15.lesson02.teach.tiket_kitne_ka_hai_phrase:
    title: Combien coûte le billet ?
    gloss: Combien coûte le billet ?
    note: Reprend la question de prix *kitne ka/ki* de l’unité 7. *Tikat* est le plus souvent traité comme masculin (*ka*) ; beaucoup de locuteurs l’emploient aussi au féminin (*kitne ki*), ce qui est également correct.
  hi.a1.unit15.lesson02.teach.rupaye_review:
    title: 'Révision : roupies, cinquante'
    gloss: roupies, cinquante
    note: Deux mots vus à l’unité 2 pour les prix et les quantités, réutilisés ici pour le prix d’un billet.
    example_gloss: J’ai cinquante roupies.
  hi.a1.unit15.lesson02.teach.tiket_pachaas_rupaye_ka_hai_phrase:
    title: Le billet coûte 50 roupies.
    gloss: Le billet coûte 50 roupies.
    note: La réponse naturelle, en phrase complète, à la question sur le prix ci-dessus.
  hi.a1.unit15.lesson03.teach.hum_hamein:
    title: Nous, à nous
    gloss: nous, à nous / pour nous
    note: « Hum » (nous) a été présenté à l’unité 11 comme le premier pronom de première personne du pluriel du cours ; « hamein » en est la forme au datif, utile ici pour le dialogue sur un voyage à plusieurs.
    example_gloss:
    - Nous allons bien.
    - Nous devons aller à la gare.
  hi.a1.unit15.lesson03.teach.hamein_grammar:
    title: 'Hamein : le quatrième pronom au datif'
    gloss: '« Hamein » est la forme au datif de « hum » (unité 11), comme « mujhe » (main) et « tumhein » (tum). Ici aussi, avec « jana », « hai » ne change pas et ne devient jamais « hain » : il ne s’accorde pas avec « hum » / « hamein ».'
    note: Rappelle les trois pronoms au datif déjà vus, avec leur numéro d’unité, avant d’ajouter le quatrième, et reprend le point sur l’invariabilité de « hai » signalé dans la note de grammaire de la première leçon.
  hi.a1.unit15.lesson03.teach.hamein_station_jana_hai_phrase:
    title: Nous devons aller à la gare.
    gloss: Nous devons aller à la gare.
    note: La construction de l’obligation avec le nouveau pronom au datif pluriel.
  hi.a1.unit15.lesson03.teach.ki_review:
    title: 'Révision : de (féminin)'
    gloss: de (marqueur possessif, féminin)
    note: 'Vu à l’unité 7 avec *ka* / *kitne*, réutilisé ici parce que « train » est féminin : sa forme possessive est donc « ki » et non « ka ».'
    example_gloss: C’est le train de Delhi.
  hi.a1.unit15.lesson03.teach.dialogue.line01:
    title: Arjun dit qu’ils doivent y aller
    gloss: Priya, nous devons aller à la gare.
  hi.a1.unit15.lesson03.teach.dialogue.line02:
    title: Priya a besoin d’un billet pour Delhi
    gloss: D’accord. Il me faut un billet pour Delhi.
  hi.a1.unit15.lesson03.teach.dialogue.line03:
    title: Arjun demande le prix
    gloss: Moi aussi. Combien coûte le billet ?
  hi.a1.unit15.lesson03.teach.dialogue.line04:
    title: Priya donne le prix
    gloss: Le billet coûte 50 roupies.
  hi.a1.unit15.lesson03.teach.dialogue.line05:
    title: Arjun demande l’heure de départ
    gloss: Bien. À quelle heure part le train ?
  hi.a1.unit15.lesson03.teach.dialogue.line06:
    title: Priya donne l’heure et le quai
    gloss: Le train part à 6 h, du quai numéro 3.
  hi.a1.unit15.lesson03.teach.dialogue.line07:
    title: Arjun comprend et dit d’y aller
    gloss: Compris. On y va !
  hi.a1.unit15.lesson03.teach.dialogue.line08:
    title: Priya est d’accord
    gloss: On y va !
  hi.a1.unit15.lesson03.teach.grammar_summary:
    title: Trois règles principales
    gloss: 'Les trois règles principales de cette unité : (1) « mujhe/tumhein/hamein + verbe + hai » signifie « devoir / avoir à ___ » ; (2) « X kitne ka/ki hai ? » sert à demander le prix ; (3) « X [heure] baje [lieu] se jaati hai » indique l’heure et le lieu de départ d’un trajet.'
    note: Un récapitulatif qui rassemble toute la grammaire de l’unité.
  hi.a1.unit15.lesson03.teach.tiket_reading:
    title: Lire un billet
    gloss: 'Billet : Delhi. Quai numéro 3. 6 heures.'
    note: Un court texte de billet, par fragments (sans phrases complètes), comme sur un vrai billet. Il reprend exactement les informations du dialogue.
    glosses:
      टिकट: billet
      प्लेटफ़ॉर्म: quai
      नंबर: numéro
      बजे: heures
