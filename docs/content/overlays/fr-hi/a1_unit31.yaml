    title: Arjun reconnaît Nina
teaching:
  hi.a1.unit31.lesson01.teach.lanba_chhota:
    title: Grand et petit
    gloss: grand / petit
    note: '*लंबा* et *छोटा* décrivent la taille et vont généralement avec *कद* (« taille ») : *नेहा का कद लंबा है*. Ils se terminent en *-ा* pour un nom masculin et en *-ी* pour un nom féminin.'
    example_gloss:
    - Neha est grande.
    - Vikram est petit.
  hi.a1.unit31.lesson01.teach.boorha_javan:
    title: Âgé et jeune
    gloss: âgé / jeune
    note: '*बूढ़ा* et *जवान* décrivent l’âge que quelqu’un paraît avoir, sans donner de chiffre.'
    example_gloss:
    - Grand-père est âgé.
    - Arjun est jeune.
  hi.a1.unit31.lesson01.teach.tumharee_umr_kitnee:
    title: उम्र et बूढ़ा
    gloss: Quel âge as-tu ? Grand-père est vieux.
    note: Pour demander un âge précis, l’hindi utilise *उम्र* (« âge »), alors que *बूढ़ा* décrit une personne âgée sans donner de chiffre.
  hi.a1.unit31.lesson01.teach.neha_ka_kad:
    title: Neha est grande et Vikram est petit
    gloss: Neha est grande et Vikram est petit.
    note: '*और* (« et ») relie les deux descriptions, et chaque *का कद* s’accorde avec le masculin *कद*.'
  hi.a1.unit31.lesson02.teach.bal:
    title: Les cheveux
    gloss: les cheveux
    note: '*बाल* (« cheveux ») est masculin pluriel en hindi, donc les mots qui le décrivent se terminent en *-े* : *लंबे बाल*.'
    example_gloss: Arjun a les cheveux courts et noirs.
  hi.a1.unit31.lesson02.teach.sunahre_bhoore_safed:
    title: Blond, brun et blanc
    gloss: blond / brun / blanc
    note: 'Trois couleurs de cheveux : *सुनहरे*, *भूरे* et *सफ़ेद* ; devant *बाल*, elles se terminent en *-े*.'
    example_gloss:
    - Priya a les cheveux blonds.
    - Vikram a les cheveux bruns.
    - Grand-père a les cheveux blancs.
  hi.a1.unit31.lesson02.teach.lanbe_chhote:
    title: Cheveux longs et courts
    gloss: long / court (cheveux)
    note: '*लंबे* (« longs ») et *छोटे* (« courts ») décrivent les cheveux, et ils se terminent en *-े* parce que *बाल* est pluriel.'
    example_gloss:
    - Neha a les cheveux longs.
    - Vikram a les cheveux courts.
  hi.a1.unit31.lesson02.teach.lanbe_bal_chhote:
    title: Les adjectifs devant बाल
    gloss: Cheveux longs, cheveux courts, cheveux blonds, cheveux bruns, cheveux blancs, cheveux noirs.
    note: '*बाल* est masculin pluriel, donc l’adjectif qui le précède se termine en *-े* : *लंबे बाल*, *भूरे बाल*.'
  hi.a1.unit31.lesson02.teach.uske_bal_lanbe:
    title: 'उसके : son, sa, ses'
    gloss: Ses cheveux sont longs.
    note: '*उसके* signifie à la fois « son/ses » d’un homme et d’une femme : seul le contexte indique lequel ; ici, il s’accorde avec le pluriel *बाल*.'
  hi.a1.unit31.lesson02.teach.arjun_ke_bal:
    title: Arjun a les cheveux courts et noirs
    gloss: Arjun a les cheveux courts et noirs.
    note: '*काले* est employé à nouveau, cette fois pour les cheveux, et il se termine en *-े* parce que *बाल* est pluriel.'
  hi.a1.unit31.lesson02.teach.priya_ke_bal:
    title: Priya a de longs cheveux blonds
    gloss: Priya a de longs cheveux blonds.
    note: Combine le vocabulaire de la longueur et de la couleur de cette leçon dans une phrase naturelle.
  hi.a1.unit31.lesson03.teach.ankhen:
    title: Les yeux
    gloss: les yeux
    note: '*आँखें* (« yeux ») est un nom féminin pluriel ; le singulier est *आँख*.'
    example_gloss: Arjun a les yeux marron.
  hi.a1.unit31.lesson03.teach.neela_bhoora_hara:
    title: Bleu, marron et vert
    gloss: bleu / marron / vert
    note: 'Trois couleurs d’yeux : *नीला*, *भूरा* et *हरा* ; devant le féminin *आँखें*, ils deviennent *नीली*, *भूरी* et *हरी*.'
    example_gloss:
    - Priya a les yeux bleus.
    - Vikram a les yeux marron.
    - Neha a les yeux verts.
  hi.a1.unit31.lesson03.teach.neelee_ankhen_bhooree:
    title: Les adjectifs devant आँखें
    gloss: Yeux bleus, yeux marron, yeux verts.
    note: '*आँखें* est féminin, donc l’adjectif qui le précède se termine en *-ी* : *नीली आँखें*.'
  hi.a1.unit31.lesson03.teach.priya_kaisee_dikhtee:
    title: À quoi ressemble Priya ?
    gloss: À quoi ressemble Priya ?
    note: '*कैसी दिखती है?* (« à quoi ressemble-t-elle ? ») est la question essentielle : *कैसी* et *दिखती* sont au féminin pour une femme, *कैसा* et *दिखता* au masculin pour un homme.'
  hi.a1.unit31.lesson03.teach.priya_ke_bal:
    title: Priya a de longs cheveux blonds et les yeux bleus
    gloss: Priya a de longs cheveux blonds et les yeux bleus.
    note: 'Une réponse modèle : cheveux et yeux reliés par *और*. Le possesseur prend *के* avec le pluriel *बाल* et *की* avec le féminin *आँखें*.'
  hi.a1.unit31.lesson04.teach.priya_bhasha_kaife:
    title: Priya présente Nina
    gloss: 'Priya : Une nouvelle fille arrive au café des langues. Elle s’appelle Nina.'
    note: '*आ रही है* (« est en train d’arriver ») introduit une nouvelle personne, et *उसका नाम ... है* donne le prénom.'
  hi.a1.unit31.lesson04.teach.arjun_oke_vah:
    title: Arjun demande à quoi elle ressemble
    gloss: 'Arjun : D’accord ! Elle ressemble à quoi ?'
    note: '*वह देखने में कैसी है?* demande « comment est-elle à voir ? » ; *वह* signifie à la fois « il » et « elle ».'
  hi.a1.unit31.lesson04.teach.priya_uska_kad:
    title: Priya décrit la taille et les cheveux de Nina
    gloss: 'Priya : Elle est petite et elle a les cheveux courts et blonds.'
    note: 'Cette phrase relie la taille et les cheveux : *उसका कद छोटा है और उसके बाल छोटे और सुनहरे हैं*.'
  hi.a1.unit31.lesson04.teach.arjun_aur_uskee:
    title: Arjun demande pour ses yeux
    gloss: 'Arjun : Et ses yeux ?'
    note: '*उसकी आँखें* signifie « ses yeux » ; *उसकी* est au féminin pour s’accorder avec *आँखें*.'
  hi.a1.unit31.lesson04.teach.priya_uskee_ankhen:
    title: Priya décrit les yeux de Nina
    gloss: 'Priya : Elle a les yeux verts.'
    note: '*हरी* se termine en *-ी* parce que *आँखें* est féminin.'
  hi.a1.unit31.lesson04.teach.arjun_shukriya_tab:
    title: Arjun la reconnaîtra
    gloss: 'Arjun : Merci ! Alors je la reconnaîtrai.'
    note: '*पहचान लूँगा* (« je reconnaîtrai ») est le futur de *पहचानना*, et *उसे* signifie « la ».'
  hi.a1.unit31.lesson05.teach.vikram_aur_neha:
    title: Comparer Vikram et Neha
    gloss: Vikram et Neha sont frère et sœur, mais ils ne se ressemblent pas. Vikram est petit et a les cheveux courts et bruns et les yeux marron. Neha est plus grande que Vikram et a les cheveux longs et bruns et les yeux verts. Et toi, tu ressembles à quoi ?
    note: Une courte comparaison qui réutilise tous les mots de couleur et de longueur appris jusqu’ici et se termine par la question essentielle de l’unité, adressée au lecteur.
    glosses:
      भाई: frère
      बहन: sœur
      दिखते: apparence
      अलग: différent
      छोटा: petit
      छोटे: petit
      भूरे: châtain
      बाल: cheveux
      भूरी: châtain
      आँखें: yeux
      लंबी: plus grand
      लंबे: long
      हरी: vert
      कैसे: comment (comme dans « tu ressembles à quoi ? »)
  hi.a1.unit31.lesson05.teach.vikram_neha_se:
    title: Comparer avec से
    gloss: Vikram est plus petit que Neha.
    note: 'Ici, *से* signifie « que » et se place après la personne à laquelle on compare : *नेहा से छोटा* ; l’adjectif vient juste avant le verbe.'
  hi.a1.unit31.lesson05.teach.neha_ke_bal:
    title: Neha a les cheveux plus longs que Vikram
    gloss: Neha a les cheveux plus longs que Vikram.
    note: '*लंबे* s’accorde avec le pluriel *बाल*, et *विक्रम से* exprime la comparaison.'
  hi.a1.unit31.lesson05.teach.mere_bal_chhote:
    title: J’ai les cheveux courts et châtains
    gloss: J’ai les cheveux courts et châtains.
    note: '*मेरे बाल छोटे और भूरे हैं* (« j’ai les cheveux courts et bruns ») est une phrase modèle pour se décrire ; *मेरे* s’accorde avec le pluriel *बाल*.'
  hi.a1.unit31.lesson06.teach.arjun_dekho_kya:
    title: Arjun repère Nina
    gloss: 'Arjun : Regarde, c’est Nina ? Elle a les cheveux courts et blonds et les yeux verts.'
    note: '*देखो* (« regarde ») est l’impératif familier adressé à un ami.'
  hi.a1.unit31.lesson06.teach.priya_han_vahee:
    title: Priya confirme
    gloss: 'Priya : Oui, c’est bien Nina !'
    note: Une confirmation courte et naturelle.
  hi.a1.unit31.lesson06.teach.neena_hay_kya:
    title: Nina salue Arjun
    gloss: 'Nina : Salut, tu es Arjun ?'
    note: '*क्या तुम अर्जुन हो?* est une question simple et informelle, adressée à quelqu’un de ton âge.'
  hi.a1.unit31.lesson06.teach.arjun_han_tumse:
    title: Arjun répond à Nina
    gloss: 'Arjun : Oui ! Enchanté de te rencontrer, Nina.'
    note: '*तुमसे मिलकर अच्छा लगा* est l’expression habituelle quand on rencontre quelqu’un pour la première fois ; en hindi, le sentiment se produit « pour » toi, donc il n’y a pas de mot pour « je ».'
  hi.a1.unit31.lesson06.teach.neena_mujhe_bhee:
    title: Nina lui répond
    gloss: 'Nina : Enchantée de faire ta connaissance, moi aussi !'
    note: 'Fin du dialogue : Arjun a bien reconnu Nina grâce à la description que Priya lui avait donnée plus tôt.'
