teaching:
  hi.a1.unit17.lesson01.teach.tum_tumhara_kya_review:
    title: 'Révision : tu, ton/ta, quoi'
    gloss: tu (informel), ton/ta/tes (informel), quoi
    note: Un rapide rappel des mots nécessaires pour demander à un ami ce qu’il fait comme travail.
    example_gloss: Comment tu t’appelles ?
  hi.a1.unit17.lesson01.teach.arjun_priya_review:
    title: 'Révision : Arjun, Priya'
    gloss: Arjun, Priya
    note: Un rappel des prénoms des deux personnages avant que cette leçon s’en serve pour poser des questions accordées au genre.
    example_gloss:
    - Je m’appelle Arjun.
    - Je m’appelle Priya.
  hi.a1.unit17.lesson01.teach.copula_review:
    title: 'Révision : je, suis, est, es'
    gloss: je, suis, est, es (tu, informel)
    note: Le petit ensemble complet du verbe « être » nécessaire pour les phrases d’identité de cette unité.
    example_gloss:
    - Tu vas bien ?
    - Je vais bien.
  hi.a1.unit17.lesson01.teach.kaam_review:
    title: 'Révision : travail'
    gloss: travail
    note: Vu pour la première fois aux unités 10 et 11 -- repris ici comme mot central de toute l’unité.
    example_gloss: J’ai du travail.
  hi.a1.unit17.lesson01.teach.karte_karti_karta_verb:
    title: Faire (tu, homme / tu, femme / je, homme)
    gloss: tu fais (à un homme, informel), tu fais (à une femme, informel), je fais (homme)
    note: Étend au verbe *karna* (faire) la règle d’accord en -ta/-ti/-te déjà vue à l’unité 10 (et aussi dans *kya tum yog karti ho?* à l’unité 1).
    example_gloss:
    - Que fais-tu ?
    - Je prends mon petit-déjeuner.
  hi.a1.unit17.lesson01.teach.tum_kya_kaam_karte_ho_phrase:
    title: Quel travail fais-tu ? (à un homme)
    gloss: Quel travail fais-tu ?
    note: La question d’ouverture de cette leçon, adressée à un ami.
  hi.a1.unit17.lesson01.teach.tum_kya_kaam_karti_ho_phrase:
    title: Quel travail fais-tu ? (à une femme)
    gloss: Quel travail fais-tu ?
    note: La même question, adressée à une amie -- seule la terminaison du verbe change.
  hi.a1.unit17.lesson01.teach.shikshak_shikshika:
    title: Enseignant / enseignante
    gloss: enseignant, enseignante
    note: Une nouvelle paire de noms de métiers. Contrairement à la plupart des noms vus jusqu’ici, celle-ci change selon le genre de la personne qui parle -- voir la note de grammaire de cette leçon.
    example_gloss:
    - Je suis enseignant.
    - Je suis enseignante.
  hi.a1.unit17.lesson01.teach.grammar_occupation_gender:
    title: Mein + métier + hoon
    gloss: « Mein + métier + hoon » sert à dire son métier, c’est le même schéma « mein...hoon » que dans l’unité 1. Certains métiers changent selon le genre de la personne qui parle -- « shikshak » (homme), « shikshika » (femme), comme la terminaison verbale -ta/-ti changeait à l’unité 10. « Doctor » et « engineer » ne changent pas -- le même mot pour les deux genres.
    note: Présente clairement la distinction entre les noms qui s’accordent au genre et les mots empruntés invariables avant que les exercices ne s’y appuient.
  hi.a1.unit17.lesson01.teach.doctor_review:
    title: 'Révision : médecin'
    gloss: médecin
    note: Déjà vu à l’unité 16 ; ici, c’est un nom de métier identique au masculin et au féminin.
    example_gloss: Il/Elle est médecin.
  hi.a1.unit17.lesson01.teach.mein_doctor_hoon_phrase:
    title: Je suis médecin.
    gloss: Je suis médecin.
    note: Le schéma d’identité appliqué à un mot de révision.
  hi.a1.unit17.lesson01.teach.engineer:
    title: Ingénieur
    gloss: ingénieur
    note: Un nouveau nom de métier, identique au masculin et au féminin, comme *डॉक्टर*.
    example_gloss: Il/Elle est ingénieur(e).
  hi.a1.unit17.lesson01.teach.mein_engineer_hoon_phrase:
    title: Je suis ingénieur(e).
    gloss: Je suis ingénieur(e).
    note: Le schéma d’identité appliqué au second nouveau métier de la leçon.
  hi.a1.unit17.lesson02.teach.kahan_review:
    title: 'Révision : où'
    gloss: où
    note: Déjà vu à l’unité 1 ; ici, on l’utilise pour demander où se trouve un lieu de travail.
    example_gloss: Où est l’hôpital ?
  hi.a1.unit17.lesson02.teach.mein_review:
    title: 'Révision : dans / à'
    gloss: dans / à
    note: Déjà vu à l’unité 1 ; ici, on l’utilise pour indiquer un lieu de travail.
    example_gloss: J’habite à Londres.
  hi.a1.unit17.lesson02.teach.tum_kahan_kaam_karte_ho_phrase:
    title: Où travailles-tu ? (à un homme)
    gloss: Où travailles-tu ?
    note: La question d’ouverture de la leçon, adressée à un ami.
  hi.a1.unit17.lesson02.teach.tum_kahan_kaam_karti_ho_phrase:
    title: Où travailles-tu ? (à une femme)
    gloss: Où travailles-tu ?
    note: La même question, adressée à une amie.
  hi.a1.unit17.lesson02.teach.school_review:
    title: 'Révision : école'
    gloss: école
    note: Déjà vu à l’unité 8 ; c’est le premier lieu de travail de la leçon.
    example_gloss: Je travaille à l’école (locutrice).
  hi.a1.unit17.lesson02.teach.mein_school_mein_kaam_karti_hoon_phrase:
    title: Je travaille à l’école.
    gloss: Je travaille à l’école.
    note: Le schéma du lieu de travail appliqué à l’école, à la forme féminine.
  hi.a1.unit17.lesson02.teach.hospital_review:
    title: 'Révision : hôpital'
    gloss: hôpital
    note: Déjà vu à l’unité 8 ; c’est le deuxième lieu de travail de la leçon, associé au métier de médecin.
    example_gloss: Le médecin travaille à l’hôpital.
  hi.a1.unit17.lesson02.teach.daftar:
    title: Bureau
    gloss: bureau
    note: Un nouveau nom, troisième lieu de travail de la leçon, associé au métier d’ingénieur.
    example_gloss: Je travaille au bureau (locuteur).
  hi.a1.unit17.lesson02.teach.mein_daftar_mein_kaam_karta_hoon_phrase:
    title: Je travaille au bureau.
    gloss: Je travaille au bureau.
    note: Le schéma du lieu de travail appliqué au bureau, à la forme masculine.
  hi.a1.unit17.lesson02.teach.grammar_workplace:
    title: Lieu + में + काम करता/करती हूँ
    gloss: '''[Lieu] + में + काम करता/करती हूँ'' réunit trois éléments déjà connus : ''में'' (unité 1, ''लंदन में रहता हूँ''), ''काम'' (unités 10/11) et la forme en -ता/-ती/-ते de ''करना'' (unité 10, ''नाश्ता करता हूँ'', et unité 1, ''क्या तुम योग करती हो?''). Ce n’est pas une nouvelle règle de grammaire : ces trois éléments sont simplement réunis pour la première fois dans une même phrase.'
    note: Chaque élément déjà vu est rappelé avec son numéro d’unité avant d’être combiné, comme dans les notes de grammaire précédentes.
  hi.a1.unit17.lesson03.teach.roz_review:
    title: 'Révision : chaque jour'
    gloss: chaque jour
    note: Déjà vu à l’unité 10 ; ici, on l’utilise pour décrire une routine de travail quotidienne.
    example_gloss: Je travaille tous les jours.
  hi.a1.unit17.lesson03.teach.jaana_forms_review:
    title: 'Révision : aller (tu, féminin / tu, masculin / je, masculin)'
    gloss: tu vas (féminin), tu vas (masculin), je vais (masculin)
    note: Les formes en -ta/-ti/-te de *jana* (aller), déjà vues à l’unité 10, sont réutilisées ici pour le trajet quotidien vers le travail.
    example_gloss:
    - Je vais à l’école tous les jours (locutrice).
    - Tu vas au bureau tous les jours ? (à un homme)
  hi.a1.unit17.lesson03.teach.bhi_haan_review:
    title: 'Révision : aussi, oui'
    gloss: aussi, oui
    note: Deux mots déjà vus (unité 1 et unités 1/6/13), réutilisés dans le dialogue de cette leçon.
    example_gloss: Oui, moi aussi, j’ai aimé.
  hi.a1.unit17.lesson03.teach.dialogue.line01:
    title: Arjun interroge Priya sur son travail
    gloss: Priya, quel est ton travail ?
  hi.a1.unit17.lesson03.teach.dialogue.line02:
    title: Priya dit qu’elle est enseignante dans une école
    gloss: Je suis enseignante. Je travaille dans une école.
  hi.a1.unit17.lesson03.teach.dialogue.line03:
    title: Arjun demande si elle va à l’école tous les jours
    gloss: Super ! Tu vas à l’école tous les jours ?
  hi.a1.unit17.lesson03.teach.dialogue.line04:
    title: Priya confirme et pose la même question à Arjun
    gloss: Oui, je vais à l’école tous les jours. Et toi, que fais-tu comme travail ?
  hi.a1.unit17.lesson03.teach.dialogue.line05:
    title: Arjun dit qu’il est ingénieur et travaille dans un bureau
    gloss: Je suis ingénieur. Je travaille dans un bureau.
  hi.a1.unit17.lesson03.teach.dialogue.line06:
    title: Priya demande s’il va aussi au bureau tous les jours
    gloss: Très bien ! Toi aussi, tu vas au bureau tous les jours ?
  hi.a1.unit17.lesson03.teach.dialogue.line07:
    title: Arjun confirme
    gloss: Oui, je vais au bureau tous les jours.
  hi.a1.unit17.lesson03.teach.dialogue.line08:
    title: Priya le remercie
    gloss: D’accord, merci.
  hi.a1.unit17.lesson03.teach.grammar_summary:
    title: Trois règles principales
    gloss: 'Les trois règles principales de cette unité : (1) ''मैं + métier + हूँ'' indique un métier (par ex. ''मैं शिक्षिका हूँ''), et certains métiers changent selon le genre de la personne qui parle ; (2) ''[lieu] + में + काम करता/करती हूँ'' indique le lieu de travail (par ex. ''मैं दफ़्तर में काम करता हूँ'') ; (3) ''रोज़ [lieu] जाता/जाती हूँ'' indique une habitude quotidienne, avec la même règle en -ता/-ती que dans l’unité 10.'
    note: Un résumé de clôture qui rassemble la grammaire de toute l’unité, comme la note de grammaire des unités 15 et 16.
  hi.a1.unit17.lesson03.teach.work_profile_reading:
    title: Lire un court portrait
    gloss: Priya est enseignante. Elle travaille dans une école. Arjun est ingénieur. Il travaille dans un bureau.
    note: 'Un portrait court et direct, qui reprend exactement les faits du dialogue, sans rien ajouter : il répond à l’objectif « lire un court portrait professionnel ».'
    glosses:
      शिक्षिका: enseignante
      स्कूल: école
      काम: travailler
      करती: fait / travaille (féminin, de करना)
      इंजीनियर: ingénieur
      दफ़्तर: bureau
      करता: fait / travaille (masculin, de करना)
