teaching:
  de.a1.unit09.lesson01.teach.bank:
    title: Bank
    gloss: 銀行
    note: '*Bank* は「銀行」という意味の女性名詞で、*die Bank* といいます。'
    example_gloss: 銀行へ行かなければなりません。
  de.a1.unit09.lesson01.teach.krankenhaus:
    title: Krankenhaus
    gloss: 病院
    note: '*Krankenhaus* は文字どおりには「病人の家」という意味で、中性名詞の *das Krankenhaus* です。'
    example_gloss: 私の友人は入院しています。
  de.a1.unit09.lesson01.teach.apotheke:
    title: Apotheke
    gloss: 薬局
    note: '*Apotheke* は「薬局」という意味の女性名詞で、*die Apotheke* といいます。'
    example_gloss: その薬局は今日、営業しています。
  de.a1.unit09.lesson01.teach.park:
    title: Park
    gloss: 公園
    note: '*Park* は「公園」という意味の男性名詞で、*der Park* といいます。'
    example_gloss: 私たちは公園を散歩するのが好きです。
  de.a1.unit09.lesson01.teach.restaurant:
    title: Restaurant
    gloss: レストラン
    note: '*Restaurant* は「レストラン」という意味の中性名詞で、*das Restaurant* といいます。'
    example_gloss: このレストランの料理はおいしいです。
  de.a1.unit09.lesson02.teach.neben:
    title: Die Apotheke ist neben dem Park.
    gloss: 薬局は公園の隣にあります。
    note: '*neben* は「〜の隣に」という意味です。位置と方向の両方を表せる前置詞で、ここでのように固定された位置を表す場合は与格を取ります。そのため、男性名詞の *der Park* は *dem Park* になります。'
  de.a1.unit09.lesson02.teach.gegenueber_von:
    title: Die Apotheke ist gegenüber vom Krankenhaus.
    gloss: 薬局は病院の向かいにあります。
    note: '*gegenüber von* は「〜の向かいに」という意味です。*vom* は *von dem* を縮めた標準的な形で、会話でも文章でも使われます。ここでは中性名詞の与格である *das Krankenhaus* を指します。'
  de.a1.unit09.lesson02.teach.zwischen:
    title: Die Apotheke ist zwischen der Bank und dem Park.
    gloss: 薬局は銀行と公園の間にあります。
    note: '*zwischen* は「〜の間に」という意味です。どちらも与格になっている点に注目しましょう：女性名詞は *der Bank*、男性名詞は *dem Park* です。'
  de.a1.unit09.lesson02.teach.hinter:
    title: Das Restaurant ist hinter der Bank.
    gloss: レストランは銀行の後ろにあります。
    note: '*hinter* は「〜の後ろに」という意味で、*der Bank* は女性名詞の与格です。'
  de.a1.unit09.lesson02.teach.vor:
    title: Der Park ist vor dem Krankenhaus.
    gloss: 公園は病院の前にあります。
    note: '*vor* は「〜の前に」という意味で、*dem Krankenhaus* は中性名詞の与格です。'
  de.a1.unit09.lesson03.teach.wo_ist_die_bank:
    title: Wo ist die Bank?
    gloss: 銀行はどこですか？
    note: '*Wo ist...?* は、ものや場所がどこにあるかを尋ねる標準的な表現です。'
  de.a1.unit09.lesson03.teach.sie_ist_neben:
    title: Sie ist neben dem Park.
    gloss: それは公園の隣にあります。
    note: ここでの *Sie* は、女性名詞の *die Bank* を指す「それ」という意味です。文頭にあるため大文字で始まっています。動詞が *ist* なので、敬称の「あなた」ではありません。敬称の場合は *Sie sind* となります。
  de.a1.unit09.lesson03.teach.ist_es_weit:
    title: Ist es weit von hier?
    gloss: ここから遠いですか？
    note: '*weit* は「遠い」という意味です。ここでの *es* は特定の名詞の性に対応するものではなく、状況を漠然と指します。'
  de.a1.unit09.lesson03.teach.nicht_weit:
    title: Nein, es ist nicht weit.
    gloss: いいえ、遠くありません。
    note: '*nicht* は形容詞の *weit* を否定しています。'
  de.a1.unit09.lesson04.teach.entschuldigung_wo:
    title: Entschuldigung, wo ist die Apotheke?
    gloss: すみません、薬局はどこですか？
    note: '*Entschuldigung* は、すでに学んだ「すみません／ごめんなさい」という表現です。ここでは丁寧に質問を切り出すために使われています。'
  de.a1.unit09.lesson04.teach.line01:
    title: Felixが道を尋ねます
    gloss: Felix：「すみません、薬局はどこですか？」
    note: 先ほど単独で学んだものと同じ丁寧な切り出し表現を、ここでは実際の会話で使っています。
  de.a1.unit09.lesson04.teach.line02:
    title: Annaが場所を教えます
    gloss: Anna：「病院の向かいにあります。」
    note: よく知られた目印との位置関係を示すことで、薬局の場所をはっきり伝えています。
  de.a1.unit09.lesson04.teach.line03:
    title: Felixが距離を尋ねます
    gloss: Felix：「ここから遠いですか？」
    note: おおよその方向が分かった後に続ける、自然な質問です。
  de.a1.unit09.lesson04.teach.line04:
    title: Annaが距離について答えます
    gloss: Anna：「いいえ、遠くありません。銀行と公園の間にあります。」
    note: 遠くないと伝えて安心させてから、別の目印を使って場所をさらに詳しく説明しています。
