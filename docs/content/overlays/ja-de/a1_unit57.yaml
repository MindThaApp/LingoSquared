  de.a1.unit57.lesson03.teach.du_kennst_sport:
    title: Sport treiben と spielen／machen
    gloss: 趣味のレッスンですでに Sport treiben（Ich treibe samstags Sport）を学びました。具体的なスポーツを挙げるときは、spielen や machen を使います：Ich spiele Fußball. どちらも正しいドイツ語です。
    note: '*Sport treiben* は趣味の単元ですでに学んだ表現で、新出ではありません。運動全般について話す表現で、spielen、machen、gehen は具体的なスポーツを表します。'
