    gloss: Joggen は規則動詞です：ich jogge、du joggst、er joggt.
    note: 規則動詞では、語幹の後ろに -e、-st、-t の語尾を付けます：ich jogge、du joggst、er joggt. また、動詞は常に文の2番目の位置に置きます。
