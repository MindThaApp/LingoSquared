course:
  title: ドイツ語 A1
  description: スポーツや運動について話すための初級ドイツ語です。一般的なスポーツの名前、行う頻度、スポーツごとの動詞（spielen、machen、gehen）の使い分け、一緒に運動する予定の立て方を学びます。
