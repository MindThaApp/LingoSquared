  de.a1.unit57.lesson05.teach.anna_macht_zwei:
    title: AnnaとLenaのスポーツの話
    gloss: Annaは週に2回ヨガをします。穏やかに体を動かすのが大好きです。Lenaはヨガをしませんが、泳ぐことが大好きです。Lenaはよく泳ぎ、ほぼ毎週泳ぎます。あなたはどんなスポーツをしますか？
    note: 動物の単元と同じ形式の文章で、2つの異なるスポーツと、頻度を表す2つの異なる言い方を対比します。
