    example_gloss: 私は週に2回ヨガをします。
  de.a1.unit57.lesson02.teach.du_kennst_schon:
    title: Mal pro Woche と jeden Tag／oft
    gloss: すでに学んだ jeden Tag（毎日）と oft（よく）に加えて、Zwei Mal pro Woche（週に2回）を使うと、頻度をより具体的に表せます。
    note: 趣味の単元ですでに学んだ頻度の表現をさらに広げます。
