  de.a1.unit57.lesson01.teach.welches_verb_passt:
    title: スポーツごとに使う動詞
    gloss: 動詞はスポーツによって異なります。サッカーには spielen、ヨガには machen、水泳とランニングには gehen と不定詞を使います。
    note: この段階では、すべてのスポーツに使える表現が1つあるので、スポーツごとに別の動詞を覚える必要はありません。
