teaching:
  de.a1.unit02.lesson01.teach.wie_heissen_sie:
    title: Wie heißen Sie?
    gloss: お名前は何ですか？（丁寧）
    note: '*Wie heißen Sie?* は直訳すると「あなたは何と呼ばれていますか」と尋ねる表現で、ユニット1で学んだ丁寧な *Sie* を使っています。'
  de.a1.unit02.lesson01.teach.ich_heisse_anna:
    title: Ich heiße Anna.
    gloss: 私の名前はAnnaです。
    note: '*heißen* は「～という名前である」という意味で、自分の名前を伝える一般的な表現です。'
  de.a1.unit02.lesson01.teach.wie_heisst_du:
    title: Wie heißt du?
    gloss: 名前は何？（くだけた表現）
    note: ユニット1で学んだ *du* を使う、くだけた言い方です。
  de.a1.unit02.lesson01.teach.ich_heisse_felix:
    title: Ich heiße Felix.
    gloss: 私の名前はFelixです。
    note: '*Ich heiße Anna* と同じ文の形で、名前だけが異なります。'
  de.a1.unit02.lesson01.teach.freut_mich:
    title: Freut mich.
    gloss: お会いできてうれしいです。
    note: 相手に会えてうれしいと伝える、短く一般的な表現です。丁寧な会話でもくだけた会話でも使えます。
  de.a1.unit02.lesson01.teach.ganz_meinerseits:
    title: Ganz meinerseits.
    gloss: こちらこそ。
    note: '*Freut mich* に対する自然な返答で、直訳すると「まったく私の側でも」です。'
  de.a1.unit02.lesson02.teach.ich:
    title: ich
    gloss: 私
    note: ドイツ語の *ich* は、文頭以外では小文字で書きます。文頭では *Ich bin Anna.* のように大文字で始めます。
  de.a1.unit02.lesson02.teach.du:
    title: du
    gloss: 君、あなた（くだけた表現）
    note: ユニット1ですでに学びましたが、ここでは文全体の主語として復習します。
  de.a1.unit02.lesson02.teach.ich_bin_anna:
    title: Ich bin Anna.
    gloss: 私はAnnaです。
    note: '*bin* は *sein*（～である）の *ich* に対応する形です。'
  de.a1.unit02.lesson02.teach.du_bist_felix:
    title: Du bist Felix.
    gloss: 君はFelixです。
    note: '*bist* は *sein* の *du* に対応する形です。'
  de.a1.unit02.lesson03.teach.deutschland:
    title: Deutschland
    gloss: ドイツ
    note: ドイツ語の国名には通常、冠詞を付けません。*das Deutschland* ではなく、単に *Deutschland* とします。
    example_gloss: 私はドイツ出身です。
  de.a1.unit02.lesson03.teach.england:
    title: England
    gloss: イングランド
    note: England はドイツ語の発音で読みます。
    example_gloss: 私はイングランド出身です。
  de.a1.unit02.lesson03.teach.frankreich:
    title: Frankreich
    gloss: フランス
    note: ドイツ語ではフランスを *France* とは異なるつづりで表します。
    example_gloss: 私はフランス出身です。
  de.a1.unit02.lesson03.teach.italien:
    title: Italien
    gloss: イタリア
    note: 発音はおおよそ「イターリエン」です。
    example_gloss: 私はイタリア出身です。
  de.a1.unit02.lesson03.teach.spanien:
    title: Spanien
    gloss: スペイン
    note: 発音はおおよそ「シュパーニエン」です。
    example_gloss: 私はスペイン出身です。
  de.a1.unit02.lesson03.teach.russland:
    title: Russland
    gloss: ロシア
    note: '*Deutschland* と同じように、*Russ-* と *-land* を組み合わせた語です。'
    example_gloss: 私はロシア出身です。
  de.a1.unit02.lesson04.teach.woher_kommen_sie:
    title: Woher kommen Sie?
    gloss: ご出身はどちらですか？（丁寧）
    note: '*Woher* は「どこから」という意味で、それ自体に起点を表す意味が含まれています。'
  de.a1.unit02.lesson04.teach.ich_komme_aus_deutschland:
    title: Ich komme aus Deutschland.
    gloss: 私はドイツ出身です。
    note: '*aus* と国名を組み合わせると出身を表せます。この段階では、性別によって形が変わる国籍の語を使う必要はありません。'
  de.a1.unit02.lesson04.teach.woher_kommst_du:
    title: Woher kommst du?
    gloss: どこの出身？（くだけた表現）
    note: '*du* を使う、くだけた言い方です。'
  de.a1.unit02.lesson04.teach.ich_komme_aus_england:
    title: Ich komme aus England.
    gloss: 私はイングランド出身です。
    note: '*Ich komme aus Deutschland* と同じ文の形で、国名だけが異なります。'
  de.a1.unit02.lesson04.teach.und_sie:
    title: Und Sie?
    gloss: あなたは？（丁寧）
    note: '*Sie* を使う丁寧さに合わせて、相手にも短く尋ね返す表現です。'
  de.a1.unit02.lesson05.teach.line01:
    title: FelixがAnnaに挨拶する
    gloss: フェリックス：こんにちは！
    note: フェリックスとアンナは近所同士で、第1ユニットで一度会っていますが、まだ名乗り合っていません。今回はバス停で再会しました。
  de.a1.unit02.lesson05.teach.line02:
    title: アンナも挨拶し、名前を尋ねます
    gloss: アンナ：こんにちは！お名前は何ですか？
    note: アンナは、第1ユニットで初対面の相手に使った丁寧な呼び方の *Sie* を引き続き使っています。
  de.a1.unit02.lesson05.teach.line03:
    title: フェリックスが名乗り、相手の名前も尋ねます
    gloss: フェリックス：フェリックスといいます。あなたは？
    note: フェリックスは名乗ったあと、丁寧な言い方で相手にも同じ質問をしています。
  de.a1.unit02.lesson05.teach.line04:
    title: アンナが名乗ります
    gloss: アンナ：アンナといいます。お会いできてうれしいです。
    note: アンナも同じように名乗り、出会いの挨拶を付け加えています。
  de.a1.unit02.lesson05.teach.line05:
    title: フェリックスが挨拶を返し、出身地を尋ねます
    gloss: フェリックス：こちらこそ。ご出身はどちらですか？
    note: フェリックスは挨拶を返し、話題を出身地へ移しています。
  de.a1.unit02.lesson05.teach.line06:
    title: アンナが答え、相手にも尋ねます
    gloss: アンナ：ドイツ出身です。あなたは？
    note: ここでアンナがドイツ出身だと分かります。ドイツ語圏の都市で二人が近所に住んでいるという設定とも一致します。
  de.a1.unit02.lesson05.teach.line07:
    title: フェリックスが答えます
    gloss: フェリックス：イングランド出身です。
    note: ここで、フェリックスはイングランド出身で、ドイツに住むアンナの近所の人だと分かります。
  de.a1.unit02.lesson05.teach.line08:
    title: アンナが別れの挨拶をします
    gloss: アンナ：さようなら！
    note: 第1ユニットで学んだ改まった別れの挨拶で、引き続き *Sie* を使う二人の話し方に合っています。
  de.a1.unit02.lesson05.teach.line09:
    title: フェリックスが別れの挨拶をします
    gloss: フェリックス：さようなら！
    note: フェリックスも同じ挨拶で会話を締めくくり、最後まで同じ丁寧さを保っています。
  de.a1.unit02.lesson05.teach.steckbrief:
    title: 短いプロフィール
    gloss: 名前：フェリックス。国：イングランド。
    note: 名前と出身国を記した簡単なプロフィールカードです。会話の中でフェリックスが口頭で伝えた情報と同じです。
