course:
  title: ドイツ語 A1
  description: 人の基本的な外見について説明するための初級ドイツ語です。身長や年齢の印象、髪と目の色、基本疑問文のWie sieht ... aus?、2人の外見の比較を学びます。
units:
  de.a1.unit55.aussehen:
    title: 外見を説明する
lessons:
  de.a1.unit55.lesson01.gross_klein_alt_und:
    title: 背が高い、背が低い、年を取った、若い
  de.a1.unit55.lesson02.haare_beschreiben:
    title: 髪について説明する
  de.a1.unit55.lesson03.augen_und_wie_jemand:
    title: 目と人の外見の尋ね方
  de.a1.unit55.lesson04.anna_beschreibt_nina:
    title: AnnaがNinaについて説明する
  de.a1.unit55.lesson05.jonas_und_lena_im:
    title: JonasとLenaを比べる
  de.a1.unit55.lesson06.felix_erkennt_nina:
    title: FelixがNinaを見分ける
teaching:
  de.a1.unit55.lesson01.teach.gross_klein:
    title: 背が高い、背が低い
    gloss: 背が高い／背が低い
    note: 人について、*Groß*は背が高いこと、*klein*は背が低いことを表します。ドイツ語では背が高い人をlang（長い）ではなく、groß（大きい）と表現します。
    example_gloss:
    - Lenaは背が高いです。
    - Jonasは背が低いです。
  de.a1.unit55.lesson01.teach.alt_jung:
    title: 年を取った、若い
    gloss: 年を取った／若い
    note: ここでの*Alt*と*jung*は、正確な年齢ではなく、年齢についての全体的な印象を表します。
    example_gloss:
    - おじいさんは年を取っています。
    - Felixは若いです。
  de.a1.unit55.lesson01.teach.alt_kann_eine:
    title: Alt：年数と印象
    gloss: Altは、Ich bin dreißig Jahre altのように年数と一緒に使うことも、Opa ist altのように全体的な印象を表すこともできます。
    note: 相手の正確な年齢は*Wie alt bist du?*と尋ねられます。ここでの*alt*は、数字を伴わず、その人がどのくらいの年齢に見えるかを表します。
  de.a1.unit55.lesson01.teach.lena_ist_gross:
    title: Lenaは背が高く、Jonasは背が低い
    gloss: Lenaは背が高く、Jonasは背が低いです。
    note: '*und*（そして）を使って2つの内容をつないだ簡単な文で、レッスン05の直接的な比較につながります。'
  de.a1.unit55.lesson02.teach.die_haare:
    title: 髪
    gloss: 髪
    note: '*Haare*は複数名詞で、*die Haare*となります。ドイツ語には単数形のdas Haarもありますが、頭髪については通常Haareを使います。'
    example_gloss: Felixは短い黒髪をしています。
  de.a1.unit55.lesson02.teach.blond_braun_grau:
    title: 金色、茶色、灰色
    gloss: 金色の／茶色の／灰色の
    note: 髪の3つの色はblond、braun、grauです。冠詞のない複数名詞の前では語尾に-eが付き、blonde、braune、graue Haareとなります。
    example_gloss:
    - Annaは金髪です。
    - Jonasは茶色の髪をしています。
    - おじいさんは白髪です。
  de.a1.unit55.lesson02.teach.lang_kurz:
    title: 長い髪と短い髪
    gloss: 長い／短い（髪）
    note: '*Kurz*（短い）と*lang*（長い）は髪の長さを表します。ここでも語尾に-eが付き、kurze Haare、lange Haareとなります。'
    example_gloss:
    - Lenaは長い髪をしています。
    - Jonasは短い髪をしています。
  de.a1.unit55.lesson02.teach.haare_ist_plural:
    title: Haareに付く語尾-e
    gloss: Haareは複数形で冠詞がないため、形容詞は-eで終わります：kurze Haare、lange Haare、blonde Haare、braune Haare、graue Haare、schwarze Haare。
    note: 冠詞のない複数名詞の前に置く形容詞には、語尾-eが付きます。レッスン03の*Augen*と同じ型です。
  de.a1.unit55.lesson02.teach.anna_hat_lange:
    title: Ihre：彼女の
    gloss: ここでIhreは「彼女の」という意味です。ihre Haareは「彼女の髪」です。Annaは長い髪をしていて、その髪は金色です。
    note: '*Ihre*（小文字のi）は「彼女の」を表す所有詞で、複数名詞Haareに合わせた形です。大文字のIで始まる*Ihre*は、敬称の「あなたの」を意味します。'
  de.a1.unit55.lesson02.teach.felix_hat_kurze:
    title: Felixは短い黒髪をしている
    gloss: Felixは短い黒髪をしています。
    note: '*schwarz*（黒い）を、今度は髪について使っています：schwarze Haare。'
  de.a1.unit55.lesson02.teach.anna_hat_lange_2:
    title: Annaは長い金髪をしている
    gloss: Annaは長い金髪をしています。
    note: このレッスンで学ぶ長さと色の語彙を、自然な1つの文に組み合わせています。
  de.a1.unit55.lesson03.teach.die_augen:
    title: 目
    gloss: 目
    note: '*Augen*は*das Auge*の複数形です。目は2つあるため、ドイツ語では通常、複数形を使います。'
    example_gloss: Felixは茶色い目をしています。
  de.a1.unit55.lesson03.teach.blau_braun_gruen:
    title: 青、茶色、緑
    gloss: 青い／茶色い／緑色の
    note: 色を表す語には、blau（青い）、braun（茶色い）、grün（緑色の）があります。
    example_gloss:
    - Annaは青い目をしています。
    - Jonasは茶色い目をしています。
    - Lenaは緑色の目をしています。
  de.a1.unit55.lesson03.teach.augen_ist_plural:
    title: Augenに付く-e
    gloss: Augenは複数形なので、形容詞は-eで終わります：blaue Augen、braune Augen、grüne Augen。
    note: Haareと同じ規則です。冠詞のない複数名詞では、形容詞の語尾が-eになります。
  de.a1.unit55.lesson03.teach.wie_sieht_anna:
    title: Annaはどのような外見ですか。
    gloss: Annaはどのような外見ですか。
    note: '*Wie sieht ... aus?*はこの単元の基本的な疑問文です。*Aussehen*は分離動詞なので、sieht ... ausのように分かれます。'
  de.a1.unit55.lesson03.teach.anna_hat_lange:
    title: Annaは長い金髪と青い目をしている
    gloss: Annaは長い金髪と青い目をしています。
    note: 髪と目の特徴を*und*でつなぎ、1つの文にまとめた模範的な答えです。
  de.a1.unit55.lesson04.teach.anna_ein_neues:
    title: AnnaがNinaを紹介する
    gloss: Anna：新しい女の子が語学カフェに来ます。名前はNinaです。
    note: '*Ein neues Mädchen kommt*は、新しい人物を登場させる表現です。*kommt*の後に方向を表す*ins*（in das）Sprachcaféが続き、4格になります。'
  de.a1.unit55.lesson04.teach.felix_okay_wie:
    title: Felixが彼女の外見を尋ねる
    gloss: Felix：分かりました！彼女はどのような外見ですか。
    note: この単元の基本的な疑問文を、名前の代わりに*Sie*（彼女）を使って表しています：wie sieht sie aus?
  de.a1.unit55.lesson04.teach.anna_sie_ist:
    title: AnnaがNinaの身長と髪について説明する
    gloss: Anna：彼女は背が低く、短い金髪をしています。
    note: '*klein*とレッスン02の髪に関する語彙を組み合わせています。2つ目の*sie*は省略され、sie ist klein und hat ...となっています。'
  de.a1.unit55.lesson04.teach.felix_und_ihre:
    title: Felixが彼女の目について尋ねる
    gloss: Felix：それで、彼女の目は？
    note: ここでの*Ihre*は、「あなた」の形ではなく「彼女の」を表す所有詞です。複数形のAugenに合わせた形になっています。
  de.a1.unit55.lesson04.teach.anna_sie_hat:
    title: AnnaがNinaの目について説明する
    gloss: Anna：彼女は緑色の目をしています。
    note: レッスン03で学んだ*grüne Augen*を再び使っています。
  de.a1.unit55.lesson04.teach.felix_danke_dann:
    title: Felixは彼女を見分けられる
    gloss: Felix：ありがとう！それなら、きっと彼女だと分かります。
    note: '*Dann erkenne ich sie bestimmt*は「それなら、きっと彼女だと分かります」という意味です。*dann*の後では動詞が2番目に来て、dann erkenne ich sieとなります。'
  de.a1.unit55.lesson05.teach.jonas_und_lena:
    title: JonasとLenaを比べる
    gloss: JonasとLenaは兄妹ですが、見た目は違います。Jonasは背が低く、短い茶色の髪と茶色の目をしています。LenaはJonasより背が高く、長い茶色の髪と緑色の目をしています。あなたはどんな見た目ですか？
    note: これまでに学んだ色や長さを表す語を使って人の見た目を比べ、最後に自分の見た目について答えます。
    glosses:
      Bruder: 兄弟
      Schwester: 姉妹
      sehen: ～に見える
      unterschiedlich: 異なる
      klein: 背が低い
      kurze: 背が低い
      braune: 茶色の
      Haare: 髪
      Augen: 目
      größer: より背が高い
      lange: 長い
      grüne: 緑色の
      aus: 「～に見える」という意味の aussehen の一部
  de.a1.unit55.lesson05.teach.das_muster_kennst:
    title: 比較級をもう一度
    gloss: 「形容詞 + -er + als（～より）」という形はすでに学びました。ここでは人を比べるときに使います。Lena ist größer als Jonas.
    note: 比較にも、同じ *-er + als* の形を使います。Groß は größer となり、母音にウムラウトが付きます。
  de.a1.unit55.lesson05.teach.lena_hat_laengere:
    title: Lenaの髪はJonasより長いです
    gloss: Lenaの髪はJonasより長いです。
    note: '*Längere Haare*：länger は、冠詞のない複数名詞の前では語尾に -e が付きます。また、lang は比較級になると母音にウムラウトが付きます。'
  de.a1.unit55.lesson05.teach.ich_habe_kurze:
    title: 私は短い茶色の髪をしています
    gloss: 私は短い茶色の髪をしています。
    note: 自分の見た目を説明するときに応用できる、*Ich habe ...* を使った一人称の基本文です。
  de.a1.unit55.lesson06.teach.felix_schau_mal:
    title: FelixがNinaを見つけます
    gloss: Felix：ほら、あれはNinaかな？短い金髪で、緑色の目をしているよ。
    note: '*Schau mal*（ちょっと見て）は、何かに親しみを込めて注意を向けてもらう表現です。du に対する命令形です。'
  de.a1.unit55.lesson06.teach.anna_ja_das:
    title: Annaがそうだと答えます
    gloss: Anna：うん、あれがNinaだよ！
    note: 短く自然に、そうだと伝える表現です。
  de.a1.unit55.lesson06.teach.nina_hallo_bist:
    title: NinaがFelixにあいさつします
    gloss: Nina：こんにちは、Felixですか？
    note: '*bist du ...?*（あなたは～ですか？）は、親しい相手に使う簡単な疑問文です。Bist は sein の du に対する形です。'
  de.a1.unit55.lesson06.teach.felix_ja_freut:
    title: FelixもNinaにあいさつします
    gloss: Felix：はい！はじめまして、Nina。
    note: '*Freut mich* は、初対面で使う定番の表現です。すでに知っている人には *Schön, dich zu sehen* と言います。'
  de.a1.unit55.lesson06.teach.nina_freut_mich:
    title: Ninaもあいさつを返します
    gloss: Nina：こちらこそ、はじめまして！
    note: これで会話は終わります。Felixは、Annaが前にした説明を手がかりにNinaだと分かりました。
