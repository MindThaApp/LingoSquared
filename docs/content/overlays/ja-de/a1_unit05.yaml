    title: Wie spät ist es?
    gloss: 何時ですか？
    note: 直訳すると「どのくらい遅いですか？」で、時刻を尋ねる一般的な表現です。
  de.a1.unit05.lesson01.teach.drei_uhr:
    title: Es ist drei Uhr.
    gloss: 3時です。
    note: '*Uhr* は「時」という意味です。正時は数字 + *Uhr* で表します。'
  de.a1.unit05.lesson01.teach.halb_vier:
    title: halb vier = 3:30
    gloss: 3時半です（3:30）。
    note: ドイツ語では、30分後に向かう次の時刻を使います。*halb vier* は「4時までの半分」、つまり3:30で、4:30ではありません。
  de.a1.unit05.lesson01.teach.fuenf_uhr:
    title: Es ist fünf Uhr.
    gloss: 5時です。
  de.a1.unit05.lesson02.teach.viertel_nach:
    title: Es ist Viertel nach drei.
    gloss: 3時15分です（3:15）。
    note: '*Viertel* は「4分の1」、*nach* は「～を過ぎて」という意味です。'
  de.a1.unit05.lesson02.teach.viertel_vor:
    title: Es ist Viertel vor vier.
    gloss: 4時15分前です（3:45）。
    note: '*vor* は「～の前」という意味です。'
  de.a1.unit05.lesson02.teach.zehn_nach:
    title: Es ist zehn nach vier.
    gloss: 4時10分です（4:10）。
    note: 「分 + *nach* + 時」の形で、指定した時刻を何分過ぎたかを表します。
  de.a1.unit05.lesson02.teach.zehn_vor:
    title: Es ist zehn vor fünf.
    gloss: 5時10分前です（4:50）。
    note: 「分 + *vor* + 次の時」の形で、次の時刻まであと何分かを表します。
  de.a1.unit05.lesson03.teach.morgen:
    title: Morgen
    gloss: 朝
    note: '*Morgen* は朝を表す名詞で、およそ午前6時から正午までを指します。'
    example_gloss: おはようございます、フェリックス！
  de.a1.unit05.lesson03.teach.mittag:
    title: Mittag
    gloss: 正午
    note: '*Mittag* は正午そのものを指し、Morgen と Nachmittag の間に当たります。'
    example_gloss: 正午です。
  de.a1.unit05.lesson03.teach.nachmittag:
    title: Nachmittag
    gloss: 午後
    note: '*Nachmittag* はおよそ正午から午後6時までを指します。'
    example_gloss: 私は午後に働きます。
  de.a1.unit05.lesson03.teach.abend:
    title: Abend
    gloss: 夕方
    note: '*Abend* はおよそ午後6時から午後10時までを指します。'
    example_gloss: こんばんは、アンナ！
  de.a1.unit05.lesson03.teach.nacht:
    title: Nacht
    gloss: 夜
    note: '*Nacht* はおよそ午後10時から午前6時までを指します。'
    example_gloss: おやすみなさい、フェリックス！
  de.a1.unit05.lesson03.teach.mitternacht:
    title: Mitternacht
    gloss: 真夜中
    note: '*Mitternacht* は午前0時ちょうど、つまり 0 Uhr です。'
    example_gloss: パーティーは真夜中に終わります。
  de.a1.unit05.lesson03.teach.achtzehn:
    title: achtzehn
    gloss: 十八
    note: '*achtzehn* は18という意味です。ここでは公式な時刻を表す24時間制で使われています（achtzehn Uhr = 午後6時）。'
    example_gloss: 店は18時（午後6時）に閉まります。
  de.a1.unit05.lesson03.teach.laden_oeffnet:
    title: Der Laden öffnet um neun Uhr morgens.
    gloss: 店は朝9時に開きます。
    note: '*um* + 時刻で「～時に」、*morgens* で「朝に」という意味です。'
  de.a1.unit05.lesson03.teach.laden_schliesst:
    title: Der Laden schließt um achtzehn Uhr.
    gloss: 店は18時（午後6時）に閉まります。
    note: '*schließt* は「閉まる」という意味です。公式な営業時間には24時間制を使います。'
  de.a1.unit05.lesson04.teach.wann:
    title: Wann
    gloss: いつ
    note: '*Wann* は時刻について尋ねる疑問文の最初に使います。'
    example_gloss: いつ来ますか？
