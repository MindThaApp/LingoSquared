    gloss: 〜を開けます
    note: '*öffnet* は *öffnen*（開ける）の三人称単数形です。*die* は女性名詞・複数名詞に付く定冠詞で、ここでは *die Bibliothek* に対応しています。'
    example_gloss: 図書館は何時に開きますか？
  de.a1.unit05.lesson04.teach.bibliothek:
    title: Bibliothek
    gloss: 図書館
    note: '*Bibliothek* は女性名詞（*die Bibliothek*）で、第4ユニットで登場したのと同じ場所です。'
    example_gloss: 図書館へ行きます。
  de.a1.unit05.lesson04.teach.sie_pronomen:
    title: sie
    gloss: それ／彼女／彼ら・彼女ら
    note: ここでの *sie* は女性名詞 *die Bibliothek* を受ける三人称代名詞で、「それ」という意味です。Anna と Felix が互いに使う、頭文字が大文字の敬称の *Sie*（あなた）と混同しないようにしましょう。
    example_gloss: 図書館が好きです。よくそこへ行きます。
  de.a1.unit05.lesson04.teach.dann:
    title: dann
    gloss: そのとき／それから
    note: ここでは *dann* が別れの挨拶 *Bis dann!*（では、またそのときに！）で使われています。
    example_gloss: では、またそのときに！
  de.a1.unit05.lesson04.teach.line01:
    title: Felix が図書館について尋ねます
    gloss: Felix：「図書館は何時に開きますか？」
  de.a1.unit05.lesson04.teach.line02:
    title: Anna が答えます
    gloss: Anna：「朝9時に開きます。」
    note: ここでの *Sie* は *die Bibliothek* を指す「それ」という意味です。文頭にあるため、頭文字だけが大文字になっています。
  de.a1.unit05.lesson04.teach.line03:
    title: Felix が続けて尋ねます
    gloss: Felix：「では、何時に閉まりますか？」
  de.a1.unit05.lesson04.teach.line04:
    title: Anna がもう一度答えます
    gloss: Anna：「18:00（午後6時）に閉まります。」
  de.a1.unit05.lesson04.teach.line05:
    title: Felix が別れを告げます
    gloss: Felix：「分かりました。では、またそのときに！」
  de.a1.unit05.lesson04.teach.schild:
    title: ドアにある案内表示
    gloss: 開館時間：9:00～18:00。
    note: '*Öffnungszeiten* は「開館時間・営業時間」、*bis* は「～まで」という意味です。'
