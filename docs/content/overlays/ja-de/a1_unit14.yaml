    title: 好み
teaching:
  de.a1.unit14.lesson01.teach.moegen_sie:
    title: Mögen Sie Kaffee?
    gloss: コーヒーはお好きですか？
    note: 敬称を使う疑問文の形は *Mögen Sie...?* です。
  de.a1.unit14.lesson01.teach.ich_mag:
    title: Ich mag Tee.
    gloss: 私は紅茶が好きです。
    note: '*ich mag* は「私は〜が好きです」という意味です。'
    example_gloss: 文脈では「はい、私はコーヒーが好きです」という意味です。
  de.a1.unit14.lesson01.teach.nicht_moegen:
    title: Ich mag Kaffee nicht.
    gloss: 私はコーヒーが好きではありません。
    note: ドイツ語ではこの場合、*nicht* は好まないものの後に置き、*ich* の直後には置きません。
    example_gloss: 文脈では「私は紅茶が好きではありません」という意味です。
  de.a1.unit14.lesson01.teach.lieber:
    title: lieber
    gloss: 〜のほうを好んで
    note: '*lieber* は、選択肢の中でどちらをより好むかを表します。'
    example_gloss: 文脈では「私は紅茶を飲むほうが好きです」という意味です。
  de.a1.unit14.lesson01.teach.nehmen:
    title: Ich nehme Wasser.
    gloss: 私は水にします。
    note: 品物を選ぶときは、*nehmen* を使うのが自然です。
  de.a1.unit14.lesson01.teach.was_nehmen_sie:
    title: Was nehmen Sie?
    gloss: 何になさいますか？
    note: 敬称の *Sie* を使って相手の希望を尋ねる疑問文で、答えには *ich nehme* を使います。
    example_gloss: 何になさいますか？ 私は水にします。
  de.a1.unit14.lesson02.teach.aber:
    title: aber
    gloss: しかし
    note: '*aber* は対照的な内容をつなぎます。'
    example_gloss: 文脈では「私はコーヒーが好きですが、紅茶を飲むほうが好きです」という意味です。
  de.a1.unit14.lesson02.teach.preference_text:
    title: Vorlieben im Cafe
    gloss: カフェでの好み
    note: この短い文章では、Anna と Felix の選択を対比しています。
    example_gloss: 彼は水にします。
  de.a1.unit14.lesson02.teach.line01:
    title: Felix がコーヒーについて尋ねる
    gloss: Felix：コーヒーはお好きですか？
    note: 好みを直接尋ねる質問です。
  de.a1.unit14.lesson02.teach.line02:
    title: Anna が自分の好みを述べる
    gloss: Anna：はい、コーヒーは好きですが、紅茶のほうが好きです。
    note: Anna はコーヒーが好きですが、紅茶のほうを好みます。
    example_gloss: 文脈では「私は紅茶を飲むほうが好きです」という意味です。
  de.a1.unit14.lesson02.teach.line03:
    title: Felix が水を選ぶ
    gloss: Felix：私は紅茶が好きではありません。水にします。
    note: Felix は好きではないものを述べてから、選ぶものを伝えています。
    example_gloss: 文脈では「私は水にします」という意味です。
  de.a1.unit14.lesson02.teach.line04:
    title: Anna が紅茶を選ぶ
    gloss: Anna：では、私は紅茶にします。
    note: Anna は自分の選択を確定しています。
    example_gloss: 文脈では「私は紅茶にします」という意味です。
