course:
  title: ドイツ語 A1
  description: 日常のやり取りで使うA1レベルのドイツ語を、日本語の解説つきで学びます。
units:
  de.a1.unit21.kleidung:
    title: 衣類
teaching:
  de.a1.unit21.lesson01.teach.kleidung:
    title: Kleidung
    gloss: 衣類
    note: '*Kleidung* は衣類全般を表す語です。'
    example_gloss: 私は衣類を買います。
  de.a1.unit21.lesson01.teach.hemd:
    title: Hemd
    gloss: シャツ
    note: '*Hemd* はシャツのことで、多くの場合はボタン付きのシャツを指します。'
    example_gloss: 私はシャツを探しています。
  de.a1.unit21.lesson01.teach.hose:
    title: Hose
    gloss: ズボン
    note: '*Hose* はズボン1本を表す場合も、ドイツ語では単数形です。'
    example_gloss: 私はズボンを探しています。
  de.a1.unit21.lesson01.teach.jacke:
    title: Jacke
    gloss: ジャケット
    note: '*Jacke* は上着やジャケットを表します。'
    example_gloss: そのジャケットは暖かいです。
  de.a1.unit21.lesson01.teach.suche:
    title: Ich suche ein Hemd.
    gloss: 私はシャツを探しています。
    note: '*suche* は店で「探しています」と伝える際に便利です。'
    example_gloss: 私はジャケットを探しています。
  de.a1.unit21.lesson02.teach.groesse:
    title: Größe
    gloss: サイズ
    note: '*Größe* は衣類のサイズを表します。'
    example_gloss: Mサイズをお願いします。
  de.a1.unit21.lesson02.teach.blau:
    title: blau
    gloss: 青い
    note: 色を指定するとき、ドイツ語では *in Blau* と言えます。
    example_gloss: 私は青いシャツを探しています。
  de.a1.unit21.lesson02.teach.rot:
    title: rot
    gloss: 赤い
    note: '*rot* は「赤い」という意味です。'
    example_gloss: そのジャケットは赤いです。
  de.a1.unit21.lesson02.teach.passt:
    title: Das Hemd passt.
    gloss: そのシャツはサイズが合います。
    note: 衣類について使う *passt* は「サイズが合う」という意味です。
    example_gloss: この文脈では「はい、そのシャツはサイズが合います」です。
  de.a1.unit21.lesson02.teach.request:
    title: Ich suche ein Hemd in Blau, Größe M.
    gloss: 青いシャツのMサイズを探しています。
    note: この依頼では、品物、色、サイズを伝えています。
  de.a1.unit21.lesson02.teach.label:
    title: 衣類のラベル
    gloss: 衣類のラベル
    note: ラベルには色、サイズ、価格が表示されることがあります。
    example_gloss: 色：青。サイズ：M。
  de.a1.unit21.lesson02.teach.line01:
    title: 店員が尋ねます
    gloss: 店員：こんにちは。何をお探しですか？
    note: 店員は、客が何を探しているのか尋ねています。
    example_gloss: 何をお探しですか？
  de.a1.unit21.lesson02.teach.line02:
    title: Felixが品物、色、サイズを伝えます
    gloss: Felix：青いシャツのMサイズを探しています。
    note: Felixは求められた3つの情報をすべて伝えています。
  de.a1.unit21.lesson02.teach.line03:
    title: 店員が商品を差し出します
    gloss: 店員：どうぞ。こちらをお買いになりますか？
    note: 敬称の *Sie* を使うことで、店でのやり取りが丁寧になります。
    example_gloss: こちらをお買いになりますか？
  de.a1.unit21.lesson02.teach.line04:
    title: Felixがサイズを確認し、価格を尋ねます
    gloss: Felix：はい、そのシャツはサイズが合います。いくらですか？
    note: Felixはサイズが合うと伝え、価格を尋ねています。
    example_gloss: この文脈では「はい、そのシャツはサイズが合います」です。
