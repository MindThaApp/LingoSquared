    title: 天気
teaching:
  de.a1.unit20.lesson01.teach.wetter:
    title: Wetter
    gloss: 天気
    note: '*Wetter* は中性名詞です：*das Wetter*。'
    example_gloss: 天気はどうですか？
  de.a1.unit20.lesson01.teach.sonnig:
    title: sonnig
    gloss: 晴れた
    note: 「晴れています」は *Es ist sonnig* と言います。
    example_gloss: 晴れています。
  de.a1.unit20.lesson01.teach.kalt:
    title: kalt
    gloss: 寒い
    note: '*kalt* は気温が低いことを表します。'
    example_gloss: 寒いです。
  de.a1.unit20.lesson01.teach.warm:
    title: warm
    gloss: 暖かい
    note: '*warm* は気温が心地よく高いことを表します。ドイツ語の発音に注意しましょう。'
    example_gloss: 暖かいです。
  de.a1.unit20.lesson01.teach.regnet:
    title: Es regnet.
    gloss: 雨が降っています。
    note: ドイツ語ではここで *Es* が必要です。主語を省略しません。
  de.a1.unit20.lesson02.teach.dann:
    title: dann
    gloss: それから
    note: '*dann* は天気の話と予定をつなぎます。'
    example_gloss: それから私たちはカフェへ行きます。
  de.a1.unit20.lesson02.teach.ins_cafe:
    title: Wir gehen ins Cafe.
    gloss: 私たちはカフェへ行きます。
    note: '*ins* は、*das Cafe* のような中性名詞の場所へ入ることを表す「～へ」という意味です。'
    example_gloss: この文脈では「それならカフェへ行きましょう」という意味です。
  de.a1.unit20.lesson02.teach.morgen:
    title: morgen
    gloss: 明日
    note: 小文字で始まる *morgen* は「明日」という意味です。
    example_gloss: 明日は晴れです。
  de.a1.unit20.lesson02.teach.forecast:
    title: 天気予報
    gloss: 天気予報
    note: この天気予報では、今日と明日の天気を対比しています。
    example_gloss: 明日は晴れです。
  de.a1.unit20.lesson02.teach.line01:
    title: アンナが天気について尋ねます
    gloss: アンナ：今日の天気はどうですか？
    note: 天気を直接尋ねる質問です。
  de.a1.unit20.lesson02.teach.line02:
    title: フェリックスが今日の天気を説明します
    gloss: フェリックス：寒くて、雨が降っています。
    note: 気温と雨の両方を伝える答えです。
  de.a1.unit20.lesson02.teach.line03:
    title: アンナが予定を提案します
    gloss: アンナ：それならカフェへ行きましょう。
    note: 雨なので、この予定を提案しています。
  de.a1.unit20.lesson02.teach.line04:
    title: フェリックスが明日のことを話します
    gloss: フェリックス：いい考えです。明日は晴れるでしょう。
    note: フェリックスは明日の天気も付け加えています。
