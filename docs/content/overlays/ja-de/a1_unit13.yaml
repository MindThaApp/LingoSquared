teaching:
  de.a1.unit13.lesson01.teach.gestern:
    title: gestern
    gloss: 昨日
    note: '*gestern* は、その出来事が最近の過去に起きたことを示します。'
    example_gloss: 昨日、私は公園にいました。
  de.a1.unit13.lesson01.teach.gemacht:
    title: Was haben Sie gestern gemacht?
    gloss: 昨日は何をしましたか？
    note: ドイツ語では、最近完了した出来事を表す際に、*haben* と過去分詞を組み合わせた現在完了形をよく使います。
  de.a1.unit13.lesson01.teach.gekauft:
    title: Ich habe Brot gekauft.
    gloss: パンを買いました。
    note: 過去分詞 *gekauft* は文末に置きます。
  de.a1.unit13.lesson01.teach.gegessen:
    title: Ich habe Suppe gegessen.
    gloss: スープを食べました。
    note: '*gegessen* は *essen* の過去分詞です。'
    example_gloss: 文脈では「パンを買って、スープを食べました」です。
  de.a1.unit13.lesson01.teach.gegangen:
    title: Ich bin zum Markt gegangen.
    gloss: 市場へ行きました。
    note: ある場所への移動には、*habe ... gegangen* ではなく *bin ... gegangen* を使います。
  de.a1.unit13.lesson02.teach.war:
    title: Es war sehr gut.
    gloss: とてもよかったです。
    note: '*war* は *sein*（～である）の単純過去形です。*es ist*（今は～です）が *es war*（～でした）になります。'
  de.a1.unit13.lesson02.teach.bericht_text:
    title: Kurzer Bericht
    gloss: 短い報告
    note: この報告では、完了した複数の行動を順に述べています。
    example_gloss: 昨日、市場へ行きました。
  de.a1.unit13.lesson02.teach.line01:
    title: Felixが昨日のことを尋ねる
    gloss: Felix：昨日は何をしましたか？
    note: 昨日のことを尋ねる一般的な表現です。
  de.a1.unit13.lesson02.teach.line02:
    title: Annaが一日の出来事を話す
    gloss: Anna：市場へ行きました。パンを買って、スープを食べました。
    note: Annaは「行った」には *bin* を、「買った」「食べた」には *habe* を使っています。
    example_gloss: 文脈では「パンを買いました」です。
  de.a1.unit13.lesson02.teach.line03:
    title: Felixがどうだったか尋ねる
    gloss: Felix：よかったですか？
    note: '*War es gut?* は、その出来事がどうだったかを尋ねる表現です。'
  de.a1.unit13.lesson02.teach.line04:
    title: Annaがよかったと答える
    gloss: Anna：はい、とてもよかったです。
    note: 最後に簡潔な感想を述べています。
