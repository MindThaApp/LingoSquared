    gloss: 電話／電話機
    note: '*Telefon* は電話機、または電話に関する場面を表します。'
    example_gloss: 電話はここにあります。
  de.a1.unit23.lesson01.teach.hier_ist:
    title: Hier ist Anna.
    gloss: Annaです。
    note: 電話では、*Hier ist...* を使って名乗ります。
  de.a1.unit23.lesson01.teach.anrufen:
    title: anrufen
    gloss: 電話をかける
    note: '*Ich rufe ... an* は「私は…に電話をかけています」という意味です。'
    example_gloss: 私はFelixに電話をかけています。
  de.a1.unit23.lesson01.teach.wiederholen:
    title: Können Sie das bitte wiederholen?
    gloss: もう一度言っていただけますか？
    note: 聞き取れなかったときに、この丁寧な依頼表現を使います。
  de.a1.unit23.lesson01.teach.langsam:
    title: Sprechen Sie bitte langsam.
    gloss: ゆっくり話してください。
    note: 敬称の *Sie* を使うことで、丁寧な依頼になります。
  de.a1.unit23.lesson02.teach.nachricht:
    title: Nachricht
    gloss: メッセージ
    note: '*Nachricht* は、携帯電話などのメッセージや書き置きを指すことがあります。'
    example_gloss: 私はメッセージを書いています。
  de.a1.unit23.lesson02.teach.wegen:
    title: Ich rufe wegen des Treffens an.
    gloss: 会議の件でお電話しています。
    note: 電話をかけた理由を伝える簡単な表現として、フレーズ全体を覚えましょう。
  de.a1.unit23.lesson02.teach.ihnen:
    title: Ich schreibe Ihnen eine Nachricht.
    gloss: あなたにメッセージを書いています。
    note: '*Ihnen* は、丁寧な「あなたに」に当たる形です。'
  de.a1.unit23.lesson02.teach.text_message:
    title: 短いメッセージ
    gloss: 短いメッセージ
    note: このメッセージでは、時刻と場所を確認しています。
    example_gloss: 私たちは9時に会います。
  de.a1.unit23.lesson02.teach.line01:
    title: アンナが電話に出る
    gloss: アンナ：もしもし、アンナです。
    note: アンナは電話に出て、自分の名前を伝えています。
    example_gloss: もしもし、アンナです。
  de.a1.unit23.lesson02.teach.line02:
    title: フェリックスが電話の用件を伝える
    gloss: フェリックス：こんにちは、アンナ。会議の件で電話しています。9時にカフェの前で会いましょう。
    note: フェリックスは電話をかけた理由と、時刻、場所を伝えています。
    example_gloss: 会議の件でお電話しています。
  de.a1.unit23.lesson02.teach.line03:
    title: アンナがフェリックスに聞き返す
    gloss: アンナ：すみません、もう一度言っていただけますか？
    note: アンナはフェリックスに、情報をもう一度言うよう頼んでいます。
    example_gloss: すみません、もう一度言っていただけますか？
  de.a1.unit23.lesson02.teach.line04:
    title: フェリックスが詳細を繰り返す
    gloss: フェリックス：はい。9時にカフェの前で会いましょう。
    note: フェリックスは時刻と場所をもう一度伝えています。
    example_gloss: 私たちは9時に会います。
  de.a1.unit23.lesson02.teach.line05:
    title: アンナがメッセージを送ると約束する
    gloss: アンナ：ありがとうございます。メッセージをお送りします。
    note: アンナはメッセージを書くと伝えています。
    example_gloss: あなたにメッセージを書いています。
