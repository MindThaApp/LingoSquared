course:
  title: ドイツ語 A1
  description: あいさつや短い会話など、日常で使うA1レベルのドイツ語を、日本語の詳しい解説つきで学びます。
units:
  de.a1.unit08.einkaufen:
    title: 買い物：値段と数量
teaching:
  de.a1.unit08.lesson01.teach.ein_pfund:
    title: ein Pfund Äpfel
    gloss: リンゴ1ポンド
    note: ドイツでは今でも日常的に*Pfund*がよく使われます。ドイツの*Pfund*は正確に500 g（半キロ）で、ヤード・ポンド法の1ポンドより少し重い単位です。ただし、ドイツでは公式にはメートル法が採用されています。
  de.a1.unit08.lesson01.teach.ein_dutzend:
    title: ein Dutzend Eier
    gloss: 卵1ダース
    note: '*Dutzend*は1ダース（12個）という意味です。'
  de.a1.unit08.lesson01.teach.eine_flasche:
    title: eine Flasche Wasser
    gloss: 水1本
    note: '*Flasche*はボトルという意味です。'
  de.a1.unit08.lesson01.teach.eine_tuete:
    title: eine Tüte Reis
    gloss: 米1袋
    note: '*Tüte*は袋という意味です。'
  de.a1.unit08.lesson01.teach.ein_kilo:
    title: ein Kilo Tomaten
    gloss: トマト1キロ
    note: '*Kilo*は標準的なメートル法の重さの単位で、普段のちょっとした量以外では*Pfund*よりはるかによく使われます。'
  de.a1.unit08.lesson02.teach.was_kosten_die_aepfel:
    title: Was kosten die Äpfel?
    gloss: リンゴはいくらですか？
    note: '*kosten*は「値段が〜である」という意味です。直訳すると「リンゴはいくらかかりますか？」となります。'
  de.a1.unit08.lesson02.teach.sie_kosten_zwei_euro:
    title: Sie kosten zwei Euro das Pfund.
    gloss: 1ポンド2ユーロです。
    note: ここでの*Sie*はリンゴを指す「それら」という意味で、敬称の「あなた」ではありません。敬称の*Sie*と複数の*sie*（それら）は、まったく同じ動詞の形（*kosten*）を取ります。また、文頭ではどちらも大文字になるため、ここでは人ではなくリンゴが話題の主語だということを文脈から判断します。
  de.a1.unit08.lesson02.teach.kann_ich_zwei_pfund:
    title: Kann ich zwei Pfund haben, bitte?
    gloss: 2ポンドいただけますか？
    note: 第7ユニットで学んだ*Ich möchte..., bitte*と同様の丁寧な依頼表現です。
  de.a1.unit08.lesson02.teach.ist_es_frisch:
    title: Ist es frisch?
    gloss: 新鮮ですか？
    note: '*frisch*は新鮮という意味です。ここでの*es*は中性名詞（das Brotなど）に対応します。男性名詞について尋ねる場合は*Ist er frisch?*（der Reis）、女性名詞の場合は*Ist sie frisch?*（die Milch）と言います。代名詞は常に*es*になるのではなく、名詞の性に応じて変わります。'
  de.a1.unit08.lesson03.teach.pro_pfund:
    title: pro Pfund
    gloss: 1ポンド当たり
    note: '*pro*は「〜当たり」という意味で、値札でも口頭で値段を伝えるときでも使われます。'
    example_gloss: リンゴは1ポンド当たり2ユーロです。
  de.a1.unit08.lesson03.teach.preisschild_text:
    title: Markt-Preisschild
    gloss: 市場の値札
    note: 3つの品物と、それぞれの単位当たりの値段を示す簡単な値札です。
  de.a1.unit08.lesson04.teach.das_macht_acht_euro:
    title: Das macht acht Euro.
    gloss: 合計8ユーロです。
    note: '*Das macht...*は合計金額を伝える標準的な表現で、第7ユニットでも学びました。'
  de.a1.unit08.lesson04.teach.line01:
    title: Felixが値段を尋ねます
    gloss: Felixは「リンゴはいくらですか？」と言います。
    note: 第2課と同じ質問を、今度は実際の会話で使います。
  de.a1.unit08.lesson04.teach.line02:
    title: Annaが値段を伝えます
    gloss: Annaは「1ポンド2ユーロです」と言います。
    note: 完全な答えでは、単位当たりの値段を伝えます。
  de.a1.unit08.lesson04.teach.line03:
    title: Felixが注文します
    gloss: Felixは「では、2ポンドいただけますか？」と言います。
    note: ここでの*Gut*は「分かりました／いいですね」という意味で、値段に納得してから注文しています。
  de.a1.unit08.lesson04.teach.line04:
    title: Annaがほかにも必要か尋ねます
    gloss: Annaは「もちろんです。ほかに何かありますか？」と言います。
    note: '*Natürlich*は「もちろん／当然」という意味です。'
  de.a1.unit08.lesson04.teach.line05:
    title: Felixが追加で注文します
    gloss: Felixは「はい、卵も1ダースお願いします」と言います。
    note: '*auch*は「〜も」という意味です。'
  de.a1.unit08.lesson04.teach.line06:
    title: Annaが合計金額を伝えます
    gloss: Annaは「合計8ユーロです」と言います。
    note: リンゴ2ポンド（4€）と卵1ダース（4€）で、合計8ユーロです。
