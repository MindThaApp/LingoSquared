units:
  de.a1.unit22.gefuehle:
    title: 感情
teaching:
  de.a1.unit22.lesson01.teach.gefuehl:
    title: Gefühl
    gloss: 気持ち・感情
    note: '*Gefühl* は、気持ち全般を表す言葉です。'
    example_gloss: うれしいというのは感情の一つです。
  de.a1.unit22.lesson01.teach.froh:
    title: froh
    gloss: うれしい
    note: '*froh* は、A1レベルで使いやすい、気持ちを表す基本的な言葉です。'
    example_gloss: 私はうれしいです。
  de.a1.unit22.lesson01.teach.muede:
    title: müde
    gloss: 疲れた
    note: '*müde* は「疲れた」という意味です。'
    example_gloss: 私は疲れています。
  de.a1.unit22.lesson01.teach.traurig:
    title: traurig
    gloss: 悲しい
    note: '*traurig* は「悲しい」という意味です。'
    example_gloss: 私は悲しいです。
  de.a1.unit22.lesson01.teach.wie_fuehlen:
    title: Wie fühlen Sie sich?
    gloss: ご気分はいかがですか？
    note: ドイツ語では、この質問に再帰代名詞の *sich* が必要です。
    example_gloss: 文脈では「今日はご気分はいかがですか？」という意味です。
  de.a1.unit22.lesson02.teach.weil:
    title: weil
    gloss: なぜなら／～なので
    note: '*weil* は理由を示します。'
    example_gloss: 今日は休みなので、うれしいです。
  de.a1.unit22.lesson02.teach.frei:
    title: frei
    gloss: 自由な／休みの
    note: '*frei haben* は「休みである」という意味です。'
    example_gloss: 私は今日、休みです。
  de.a1.unit22.lesson02.teach.viel:
    title: viel
    gloss: たくさん／多く
    note: '*viel* は量が多いことを表します。'
    example_gloss: 私はたくさん働きます。
  de.a1.unit22.lesson02.teach.reason_happy:
    title: Ich bin froh, weil ich frei habe.
    gloss: 今日は休みなので、うれしいです。
    note: この文では、気持ちとその理由を述べています。
  de.a1.unit22.lesson02.teach.reason_tired:
    title: Ich bin müde, weil ich viel arbeite.
    gloss: たくさん働いているので、疲れています。
    note: このレベルでは、理由を述べる便利な表現として文全体を覚えましょう。
  de.a1.unit22.lesson02.teach.feeling_text:
    title: Gefühle und Gründe
    gloss: 気持ちと理由
    note: この短い文章では、それぞれの気持ちと簡単な原因が結び付けられています。
    example_gloss: Annaはうれしいです。
  de.a1.unit22.lesson02.teach.line01:
    title: FelixがAnnaの気持ちを尋ねます
    gloss: Felix：今日はご気分はいかがですか？
    note: 敬称の *Sie* を使うことで、丁寧な質問になります。
  de.a1.unit22.lesson02.teach.line02:
    title: Annaが気持ちと理由を伝えます
    gloss: Anna：休みなので、うれしいです。あなたは？
    note: Annaは自分の気持ちを述べ、相手にも尋ねています。
    example_gloss: 文脈では「休みなので、うれしいです」という意味です。
  de.a1.unit22.lesson02.teach.line03:
    title: Felixが理由を伝えます
    gloss: Felix：たくさん働いているので、疲れています。
    note: Felixは疲れていることと、その理由を述べています。
  de.a1.unit22.lesson02.teach.line04:
    title: Annaがコーヒーを提案します
    gloss: Anna：では、コーヒーを飲みましょう。
    note: Annaは、すぐにできる簡単な予定を提案しています。
