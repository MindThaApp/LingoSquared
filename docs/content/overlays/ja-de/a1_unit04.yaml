teaching:
  de.a1.unit04.lesson01.teach.montag:
    title: Montag
    gloss: 月曜日
    note: ドイツ語圏では、*Montag*が週の最初の日です。日本でも一般に、カレンダーなどで月曜日始まりの表記が使われます。
    example_gloss: 月曜日は時間があります。
  de.a1.unit04.lesson01.teach.dienstag:
    title: Dienstag
    gloss: 火曜日
    note: '*Dienstag*は週の2日目です。'
    example_gloss: 火曜日は時間があります。
  de.a1.unit04.lesson01.teach.mittwoch:
    title: Mittwoch
    gloss: 水曜日
    note: '*Mittwoch*は文字どおりには「週の真ん中」という意味で、ドイツの平日のちょうど中日に当たります。'
    example_gloss: 水曜日は時間があります。
  de.a1.unit04.lesson01.teach.donnerstag:
    title: Donnerstag
    gloss: 木曜日
    note: '*Donnerstag*はゲルマン神話の神Donar（Thor）にちなんだ名称です。'
    example_gloss: 木曜日は時間があります。
  de.a1.unit04.lesson01.teach.freitag:
    title: Freitag
    gloss: 金曜日
    note: '*Freitag*はゲルマン神話の女神Friggにちなんだ名称です。'
    example_gloss: 金曜日は時間があります。
  de.a1.unit04.lesson01.teach.samstag:
    title: Samstag
    gloss: 土曜日
    note: '*Samstag*はドイツの大部分で土曜日を表す標準的な語です。*Sonnabend*はドイツ北部・東部で使われる地域的な別表現です。'
    example_gloss: 土曜日は時間があります。
  de.a1.unit04.lesson01.teach.sonntag:
    title: Sonntag
    gloss: 日曜日
    note: '*Sonntag*は文字どおりには「太陽の日」という意味です。'
    example_gloss: 日曜日は時間があります。
  de.a1.unit04.lesson01.teach.welcher_tag:
    title: Welcher Tag ist heute?
    gloss: 今日は何曜日ですか？
    note: '*heute*は「今日」、*Welcher Tag*は「何曜日」という意味です。'
  de.a1.unit04.lesson02.teach.januar:
    title: Januar
    gloss: 1月
    note: '*Januar*は1年の最初の月です。'
    example_gloss: 私の誕生日は1月です。
  de.a1.unit04.lesson02.teach.maerz:
    title: März
    gloss: 3月
    note: '*März*は1年の3番目の月です。'
    example_gloss: 私の誕生日は3月です。
  de.a1.unit04.lesson02.teach.mai:
    title: Mai
    gloss: 5月
    note: '*Mai*は短く、覚えやすい語です。'
    example_gloss: 私の誕生日は5月です。
  de.a1.unit04.lesson02.teach.juli:
    title: Juli
    gloss: 7月
    note: '*Juli*は1年の7番目の月です。'
    example_gloss: 私の誕生日は7月です。
  de.a1.unit04.lesson02.teach.september:
    title: September
    gloss: 9月
    note: '*September*はドイツ語で9月を表します。'
    example_gloss: 私の誕生日は9月です。
  de.a1.unit04.lesson02.teach.dezember:
    title: Dezember
    gloss: 12月
    note: '*Dezember*は1年の最後の月です。'
    example_gloss: 私の誕生日は12月です。
  de.a1.unit04.lesson02.teach.welcher_monat:
    title: Welcher Monat ist es?
    gloss: 何月ですか？
    note: '*Monat*は「月」、*es*は「それ」という意味です。'
  de.a1.unit04.lesson03.teach.wievielte:
    title: Der Wievielte ist heute?
    gloss: 今日は何日ですか？
    note: 文字どおりには「今日は第何番目ですか？」という意味で、ドイツ語で日付を尋ねる標準的な表現です。
  de.a1.unit04.lesson03.teach.siebte_juli:
    title: Heute ist der siebte Juli.
    gloss: 今日は7月7日です。
    note: ドイツ語では日を先に、月を後に言います。*der siebte Juli*は「7月7日」という意味です。*der siebte Juli*をひとまとまりの表現として覚えましょう。
  de.a1.unit04.lesson03.teach.dienstag_siebte_juli:
    title: Heute ist Dienstag, der siebte Juli.
    gloss: 今日は7月7日、火曜日です。
    note: 日付の前に曜日を置き、コンマで区切ります。
  de.a1.unit04.lesson03.teach.numerische_form:
    title: Man kann es auch als 7.7. schreiben.
    gloss: 7.7.と書くこともできます。
    note: ドイツ語の数字による日付表記では、日、月の順に置き、それぞれの後にピリオドを付けます。7.7.は7月7日を表します。
  de.a1.unit04.lesson03.teach.geburtstag_frage:
    title: Wann haben Sie Geburtstag?
    gloss: お誕生日はいつですか？（丁寧）
    note: 直訳すると「誕生日をいつ持っていますか？」となります。ドイツ語では、誕生日があることを *haben* を使って表します。
  de.a1.unit04.lesson03.teach.geburtstag_antwort:
    title: Mein Geburtstag ist der dritte März.
    gloss: 私の誕生日は3月3日です。
    note: '*Mein Geburtstag*は「私の誕生日」、*der dritte März*は「3月3日」という意味です。日を先に、月を後に置きます。'
  de.a1.unit04.lesson04.teach.oeffnet:
    title: öffnet
    gloss: 開く
    note: '*öffnet*は*öffnen*（開く）の三人称単数形で、店や図書館などについて「開く」と言うときに使います。'
    example_gloss: その店は月曜日に開きます。
  de.a1.unit04.lesson04.teach.wieder:
    title: wieder
    gloss: 再び
    note: '*wieder*は「再び」という意味で、ここでは何かがいつ再開するかを尋ねる際に使われています。'
    example_gloss: 図書館は月曜日に再び開きます。
  de.a1.unit04.lesson04.teach.die:
    title: die
    gloss: その（女性単数・複数）
    note: '*die*は女性単数名詞およびすべての複数名詞に用いる定冠詞です。ここでは女性名詞の*Bibliothek*とともに使われています。'
    example_gloss: その図書館は大きいです。
  de.a1.unit04.lesson04.teach.bibliothek:
    title: Bibliothek
    gloss: 図書館
    note: '*Bibliothek*は女性名詞です（*die Bibliothek*）。'
    example_gloss: 図書館へ行きます。
  de.a1.unit04.lesson04.teach.am:
    title: am
    gloss: ～に／～で
    note: '*am*は*an dem*の縮約形で、曜日や日付の前に使います（*am Montag*＝「月曜日に」）。'
    example_gloss: 月曜日は仕事をします。
  de.a1.unit04.lesson04.teach.den:
    title: den
    gloss: その（男性対格）
    note: '*den*は*der*の男性対格形です。*am Donnerstag, den neunten Juli*のように、曜日の後に完全な日付を続ける場合に現れます。この段階では格を分析せず、定型表現として覚えましょう。なお、*am*の後には*dem*も現れますが、こちらも正しい形です。'
    example_gloss: 私たちは7月9日、木曜日に会います。
  de.a1.unit04.lesson04.teach.neunten:
    title: neunten
    gloss: 9番目の
    note: '*neunten*は*neun*（9）から作られた、語尾変化した序数の形で、日付に使われます。*der neunte Juli*（主格）は、この完全な日付の構文では*den neunten Juli*となります。'
    example_gloss: 私の誕生日は7月9日です。
  de.a1.unit04.lesson04.teach.line01:
    title: Felixが日付を尋ねます
    gloss: Felixは「今日は何日ですか？」と言っています。
  de.a1.unit04.lesson04.teach.line02:
    title: Annaが日付を答えます
    gloss: Annaは「今日は7月7日、火曜日です」と言っています。
  de.a1.unit04.lesson04.teach.line03:
    title: Felixが図書館について尋ねます
    gloss: フェリックス：図書館はいつまた開きますか？
  de.a1.unit04.lesson04.teach.line04:
    title: アンナの答え
    gloss: アンナ：7月9日木曜日にまた開きます。
    note: ここでの *Sie* は「それ」という意味で、前に出た女性名詞の *die Bibliothek* を指します。
  de.a1.unit04.lesson04.teach.line05:
    title: フェリックスの別れの言葉
    gloss: フェリックス：わかりました。では木曜日に。
    note: '*bis Donnerstag* は「木曜日まで」という意味で、「では木曜日に」という一般的な別れの表現です。'
  de.a1.unit04.lesson04.teach.notiz:
    title: ドアの貼り紙
    gloss: 7月9日木曜日まで休館。
    note: '*Geschlossen* は「閉まっている」という意味です。'
