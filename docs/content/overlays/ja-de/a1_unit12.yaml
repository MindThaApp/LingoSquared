  de.a1.unit12.lesson02.teach.line01:
    title: AnnaがFelixの都合を尋ねる
    gloss: Anna：明日は時間がありますか？
    note: まず相手の都合を確認して、予定を立て始めます。
  de.a1.unit12.lesson02.teach.line02:
    title: Felixが空いている時間帯を伝える
    gloss: Felix：はい、夕方なら。
    note: 短い答えでは、空いている時間帯だけを伝えることもできます。
  de.a1.unit12.lesson02.teach.line03:
    title: Annaが博物館を提案する
    gloss: Anna：博物館へ行きませんか？
    note: ここでは、何をするかを提案しています。
  de.a1.unit12.lesson02.teach.line04:
    title: Felixが誘いを受ける
    gloss: Felix：はい、ぜひ。何時に？
    note: Felixは誘いを受け、時刻を尋ねています。
    example_gloss: 文脈では「何時に？」です。
  de.a1.unit12.lesson02.teach.line05:
    title: Annaが時刻と場所を伝える
    gloss: Anna：18時に博物館の前で。
    note: この答えでは、時刻と待ち合わせ場所の両方を伝えています。
  de.a1.unit12.lesson02.teach.line06:
    title: Felixが確認する
    gloss: Felix：分かりました。では、また明日。
    note: 予定が決まった後の自然な締めくくりです。
