    title: 誰が何を使いますか？
    gloss: Annaは毎日Felixに電話をします。アプリではなく、携帯電話を使います。Felixの家にはパソコンがありませんが、携帯電話でインターネットを使います。Jonasは毎朝、天気予報を調べます。それからジョギングをします。LenaはAnnaによくメッセージを送ります。あなたも毎日携帯電話を使いますか？
    note: 4人の機器の使い方を比較する、スポーツの単元と同じ形式の読解です。
