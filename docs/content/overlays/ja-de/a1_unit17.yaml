teaching:
  de.a1.unit17.lesson01.teach.kopfschmerzen:
    title: Kopfschmerzen
    gloss: 頭痛
    note: '*Kopfschmerzen* は形としては複数形ですが、頭痛が一つの場合にも使います。'
    example_gloss: 頭が痛いです。
  de.a1.unit17.lesson01.teach.bauchschmerzen:
    title: Bauchschmerzen
    gloss: 腹痛
    note: '*Bauch* はおなか、*Schmerzen* は痛みという意味です。'
    example_gloss: おなかが痛いです。
  de.a1.unit17.lesson01.teach.hals:
    title: Hals
    gloss: 喉／首
    note: '*Hals* は文脈によって喉または首を指します。'
    example_gloss: 喉が痛いです。
  de.a1.unit17.lesson01.teach.weh:
    title: Mein Kopf tut weh.
    gloss: 頭が痛いです。
    note: ドイツ語では、体の部位を主語にして「痛む」と表現します：*tut weh*。
    example_gloss: おなかが痛いです。
  de.a1.unit17.lesson01.teach.mir_ist_schlecht:
    title: Mir ist schlecht.
    gloss: 気分が悪いです。
    note: '*Mir ist schlecht* は、気分が悪いことを表す自然な言い方です。単語どおりに直訳しないようにしましょう。'
    example_gloss: 気分が悪くて、おなかが痛いです。
  de.a1.unit17.lesson02.teach.brauchen_sie_hilfe:
    title: Brauchen Sie Hilfe?
    gloss: 助けが必要ですか？
    note: 敬称の *Sie* を使うことで、丁寧な質問になります。
  de.a1.unit17.lesson02.teach.ich_brauche:
    title: Ich brauche Wasser.
    gloss: 水が必要です。
    note: '*brauche* は「必要とする」という意味で、「使う」ではありません。'
    example_gloss: 文脈で：水と休憩が必要です。
  de.a1.unit17.lesson02.teach.pause:
    title: Pause
    gloss: 休憩
    note: '*eine Pause* は、短い休息や休憩を表します。'
    example_gloss: 休憩が必要です。
  de.a1.unit17.lesson02.teach.health_instruction:
    title: Trinken Sie Wasser.
    gloss: 水を飲んでください。休憩してください。
    note: フォーマルな *Sie* を使うことで、丁寧な指示になります。
    example_gloss: 休憩してください。
  de.a1.unit17.lesson02.teach.gesundheit_text:
    title: Annaの困りごと
    gloss: アンナの症状
    note: この短い文章では、症状と今すぐ必要なものが述べられています。
    example_gloss: 彼女は水を必要としています。
  de.a1.unit17.lesson02.teach.line01:
    title: FelixがAnnaの具合を尋ねます
    gloss: Felix：Anna、具合は大丈夫ですか？
    note: FelixはAnnaに対して、フォーマルな *Ihnen* を使い続けています。
  de.a1.unit17.lesson02.teach.line02:
    title: Annaが症状を伝えます
    gloss: Anna：いいえ、頭が痛いです。
    note: この返答では、症状を簡潔に伝えています。
  de.a1.unit17.lesson02.teach.line03:
    title: Felixが助けを申し出ます
    gloss: Felix：助けが必要ですか？
    note: 簡潔に助けを申し出る表現です。
  de.a1.unit17.lesson02.teach.line04:
    title: Annaが必要なものを伝えます
    gloss: Anna：はい、お願いします。水と休憩が必要です。
    note: この返答では *Ja, bitte* と答え、今すぐ必要なものを伝えています。
    example_gloss: 文脈で：水と休憩が必要です。
