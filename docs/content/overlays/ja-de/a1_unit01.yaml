teaching:
  de.a1.unit01.lesson01.teach.hallo:
    title: Hallo
    gloss: こんにちは
    note: '*Hallo*は、一日中いつでも使える、くだけた一般的なあいさつです。日本語の「こんにちは」より幅広い時間帯で使えます。'
    example_gloss: こんにちは、Felix！
  de.a1.unit01.lesson01.teach.guten_morgen:
    title: Guten Morgen
    gloss: おはようございます
    note: '*Guten Morgen*は、朝から午前の遅い時間ごろまで使います。'
  de.a1.unit01.lesson01.teach.guten_tag:
    title: Guten Tag
    gloss: こんにちは
    note: '*Guten Tag*は、午前の遅い時間から午後まで使える、標準的でやや改まった日中のあいさつです。'
  de.a1.unit01.lesson01.teach.guten_abend:
    title: Guten Abend
    gloss: こんばんは
    note: '*Guten Abend*は、夕方や夜にどこかへ着いたときに使います。別れの言葉ではなく、出会ったときのあいさつです。'
  de.a1.unit01.lesson02.teach.tschuss:
    title: Tschüss
    gloss: じゃあね
    note: '*Tschüss*は、友人や知人同士で別れるときによく使う、くだけた表現です。'
    example_gloss: じゃあね、また近いうちに！
  de.a1.unit01.lesson02.teach.auf_wiedersehen:
    title: Auf Wiedersehen
    gloss: さようなら（丁寧）
    note: '*Auf Wiedersehen*は、直訳すると「再び会うときまで」という意味です。知らない人や仕事上の相手にも使える、標準的で改まった別れのあいさつです。'
  de.a1.unit01.lesson02.teach.bis_bald:
    title: Bis bald
    gloss: また近いうちに
    note: '*Bis bald*は、近いうちにまた会う予定の相手に使う、親しみのある別れの言葉です。'
  de.a1.unit01.lesson02.teach.bis_spater:
    title: Bis später
    gloss: またあとで
    note: '*Bis später*は、その日のうちにあとでもう一度会う相手に使います。'
  de.a1.unit01.lesson02.teach.gute_nacht:
    title: Gute Nacht
    gloss: おやすみなさい
    note: '*Gute Nacht*は、寝るときや一日を終えるときに言います。*Guten Abend*とは異なり、出会ったときではなく別れのあいさつです。'
  de.a1.unit01.lesson03.teach.sie:
    title: Sie
    gloss: あなた（丁寧）
    note: '*Sie*は丁寧な「あなた」で、文の途中でも大文字で書きます。知らない人や目上の人、改まった場面や仕事上の場面で使います。日本語の敬語とは仕組みが異なり、相手との関係に応じて代名詞そのものを使い分けます。'
  de.a1.unit01.lesson03.teach.du:
    title: du
    gloss: 君（くだけた表現）
    note: '*du*は、友人や家族、子どもに使う、くだけた「あなた」です。知らない人に*du*を使うと、なれなれしく、場合によっては失礼に聞こえることがあります。'
  de.a1.unit01.lesson03.teach.wie_geht_es_ihnen:
    title: Wie geht es Ihnen?
    gloss: お元気ですか？（丁寧）
    note: 相手の調子を尋ねる丁寧な言い方です。*Ihnen*は、*Sie*と同じ丁寧さに対応する「あなた」の与格です。
  de.a1.unit01.lesson03.teach.wie_gehts:
    title: Wie geht's?
    gloss: 元気？（くだけた表現）
    note: '*Wie geht''s*は*Wie geht es*の短縮形で、相手の調子を尋ねる日常的でくだけた言い方です。'
  de.a1.unit01.lesson03.teach.gut_danke:
    title: Gut, danke.
    gloss: 元気です、ありがとう。
    note: 丁寧な会話にもくだけた会話にも使える、簡潔で自然な返事です。
  de.a1.unit01.lesson03.teach.sehr_gut_danke:
    title: Sehr gut, danke.
    gloss: とても元気です、ありがとう。
    note: '*Gut, danke.*よりも、元気であることを少し強く伝える返事です。'
  de.a1.unit01.lesson03.teach.und_ihnen:
    title: Und Ihnen?
    gloss: あなたは？（丁寧）
    note: 相手にも同じ質問を返す丁寧な言い方で、*Sie*を使う話し方に対応しています。
  de.a1.unit01.lesson03.teach.und_dir:
    title: Und dir?
    gloss: 君は？（くだけた表現）
    note: 相手にも同じ質問を返すくだけた言い方です。*dir*は、*du*と同じくだけた話し方に対応する「あなた」の与格です。
  de.a1.unit01.lesson04.teach.danke:
    title: Danke
    gloss: ありがとう
    note: '*Danke*は前の返答にも出てきましたが、ここでは単独で使う言葉として学びます。'
    example_gloss: どうもありがとうございます！
  de.a1.unit01.lesson04.teach.bitte:
    title: Bitte
    gloss: お願いします／どういたしまして
    note: '*Bitte*には、文脈に応じて二つの一般的な意味があります。何かを頼むときは「お願いします」、お礼への返事では「どういたしまして」という意味です。どちらの意味かは文脈で判断します。どちらもごく標準的な用法です。'
    example_gloss:
    - コーヒーを一つ、お願いします。
    - どういたしまして！
  de.a1.unit01.lesson04.teach.entschuldigung:
    title: Entschuldigung
    gloss: すみません／ごめんなさい
    note: '*Entschuldigung*は、丁寧に人へ声をかけるときにも、軽く謝るときにも使います。'
    example_gloss: すみません、トイレはどこですか？
  de.a1.unit01.lesson04.teach.kein_problem:
    title: Kein Problem
    gloss: 大丈夫です
    note: 気軽で親しみのある返事で、日本語の「大丈夫です」に近い調子です。
  de.a1.unit01.lesson04.teach.gern_geschehen:
    title: Gern geschehen
    gloss: どういたしまして
    note: 短い*Bitte*よりも意味が明確で、より完全な「どういたしまして」の言い方です。
  de.a1.unit01.lesson05.teach.line01:
    title: AnnaがFelixにあいさつします
    gloss: Anna：「こんにちは！」
    note: AnnaとFelixは、住んでいる集合住宅の隣人として初めて会います。
  de.a1.unit01.lesson05.teach.line02:
    title: Felixがあいさつを返し、Annaの調子を尋ねます
    gloss: Felix：「こんにちは！お元気ですか？」
    note: 二人は会ったばかりなので、Felixは丁寧な*Sie*を使っています。
  de.a1.unit01.lesson05.teach.line03:
    title: Annaが答え、Felixにも尋ね返します
    gloss: Anna：「ありがとう、元気です。あなたは？」
    note: AnnaはFelixに合わせ、丁寧な言い方で答えて同じ質問を返しています。
  de.a1.unit01.lesson05.teach.line04:
    title: Felixが答えます
    gloss: Felix：「とても元気です、ありがとう。」
    note: 単なる*Gut, danke.*よりも、元気であることを少し強く伝える返事です。
  de.a1.unit01.lesson05.teach.line05:
    title: Annaが別れのあいさつをします
    gloss: Anna：「さようなら！」
    note: 二人が使い続けている*Sie*に合わせて、Annaはより改まった別れのあいさつを使っています。
  de.a1.unit01.lesson05.teach.line06:
    title: Felixが別れを告げ、また近いうちにと言います
    gloss: Felix：「さようなら、また近いうちに！」
    note: Felixは改まった別れのあいさつに「また近いうちに」を組み合わせています。初対面の会話で二人が使い続けている*Sie*の話し方にも合っています。
