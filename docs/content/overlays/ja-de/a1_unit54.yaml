  de.a1.unit54.lesson04.anna_und_felix_sprechen:
    title: AnnaとFelixが趣味について話す
  de.a1.unit54.lesson05.felix_und_anna_vergleichen:
    title: FelixとAnnaが趣味を比べる
  de.a1.unit54.lesson06.ein_wochenende_zusammen_planen:
    title: 一緒に週末の予定を立てる
teaching:
  de.a1.unit54.lesson01.teach.lesen_sport_treiben:
    title: 読書、運動、料理
    gloss: 読む、運動する／スポーツをする、料理する
    note: よく使う趣味の動詞と表現は、*lesen*（読む）、*Sport treiben*（運動する、スポーツをする）、*kochen*（料理する）の3つです。Sport は名詞なので、頭文字を大文字で書きます。
    example_gloss:
    - 私は本を読むのが好きです。
    - 私は土曜日に運動します。
    - 私は友達のために料理するのが好きです。
  de.a1.unit54.lesson01.teach.die_freizeit:
    title: 自由時間
    gloss: 自由時間
    note: '*Die Freizeit* は女性名詞です。必ず冠詞 die と一緒に覚えましょう。趣味について話すときの重要な単語です。'
    example_gloss: 私は自由時間に読書をするのが好きです。
  de.a1.unit54.lesson01.teach.in_meiner_freizeit:
    title: 自由時間にすることを伝える
    gloss: 私は自由時間に読書をするのが好きです。
    note: '*Lese* は *lesen*（読む）の ich に対応する形です。この文は時を表す句で始まりますが、動詞は変わらず2番目に置きます：in meiner Freizeit lese ich gern。'
  de.a1.unit54.lesson02.teach.musik_hoeren_zeichnen:
    title: 音楽、絵、ゲーム
    gloss: 音楽を聴く、絵を描く、ゲームをする
    note: 趣味を表すほかの表現には、*Musik hören*（音楽を聴く）、*zeichnen*（絵を描く）、*Videospiele spielen*（テレビゲームをする）があります。Musik と Videospiele は名詞なので、頭文字を大文字で書きます。
    example_gloss:
    - 私は音楽を聴くのが好きです。
    - 私はよく絵を描きます。
    - 私は友達とゲームをするのが好きです。
  de.a1.unit54.lesson02.teach.ich_hoere_gern:
    title: 音楽を聴くのが好きだと伝える
    gloss: 私は音楽を聴くのが好きです。
    note: ドイツ語では、前置詞を使わずに *Musik hören* と言います。
  de.a1.unit54.lesson02.teach.ich_spiele_gern:
    title: 友達とゲームをするのが好きだと伝える
    gloss: 私は友達とゲームをするのが好きです。
    note: '*Mit Freunden*（友達と）：mit の後には必ず与格が続くため、Freunde は Freunden になります。'
  de.a1.unit54.lesson03.teach.immer_oft_manchmal:
    title: いつも、よく、ときどき、決して～ない
    gloss: いつも、よく、ときどき、決して～ない
    note: 基本的な4つの頻度を表す副詞は、immer、oft、manchmal、nie です。通常は動詞のすぐ後ろに置きます：ich spiele nie。
    example_gloss:
    - 私は毎週土曜日に運動します。
    - 私はよく本を読みます。
    - 私はときどき絵を描きます。
    - 私はゲームをまったくしません。
  de.a1.unit54.lesson03.teach.jede_woche_jedes:
    title: 毎週、毎週末
    gloss: 毎週、毎週末
    note: '*Jede Woche* と *jedes Wochenende* はどちらも「毎～」という意味ですが、名詞の性によって語尾が変わります。次のカードで確認しましょう。'
    example_gloss:
    - 私は毎週、友達のために料理をします。
    - 私は毎週末、運動します。
  de.a1.unit54.lesson03.teach.die_woche_jede:
    title: Jede と jedes の違い
    gloss: Die Woche は女性名詞なので、jede Woche となります。Das Wochenende は中性名詞なので、jedes Wochenende となります。
    note: '*Woche* は女性名詞（*die Woche*）なので *jede* を使い、*Wochenende* は中性名詞（*das Wochenende*）なので *jedes* を使います。それぞれの名詞を冠詞と一緒に覚えれば、どの語尾になるか分かります。'
  de.a1.unit54.lesson03.teach.was_machst_du:
    title: 余暇の過ごし方を尋ねる
    gloss: 自由時間には何をしますか？
    note: これはこのユニットの中心となる質問です。相手の趣味を尋ねるときに使ってみましょう。
  de.a1.unit54.lesson04.teach.anna_wir_gehen:
    title: Annaが趣味の話を切り出す
    gloss: Anna：私たちはよく一緒に散歩します。でもFelix、ほかに暇なときは何をしますか？
    note: '*Wir gehen oft zusammen spazieren* では、gehen ともう一つの動詞を使います。活用した動詞 gehen は2番目に置き、不定詞 spazieren は文末に置きます。'
  de.a1.unit54.lesson04.teach.felix_ich_koche:
    title: Felixの趣味
    gloss: Felix：料理をするのが好きで、家でも料理します。それから、よく運動します。
    note: '*Auch zu Hause*（家でも）から、Felixがレストランの仕事だけでなく、楽しみとしても料理をしていることが分かります。'
  de.a1.unit54.lesson04.teach.anna_kochst_du:
    title: Annaが驚く
    gloss: Anna：家でも料理するのですか？ 仕事で一日中ずっと料理しているのに！
    note: '*Den ganzen Tag*（一日中）は対格なので、der Tag が den Tag になります。このように時間の長さを表す語句には対格を使います。'
  de.a1.unit54.lesson04.teach.felix_ja_aber:
    title: Felixが説明する
    gloss: Felix：はい、でも料理をするとリラックスできます。あなたは何をするのが好きですか？
    note: '*Kochen finde ich entspannend* では、強調するために Kochen を文頭に置いています。それでも動詞は2番目に置くため、ich はその後ろに移ります。'
  de.a1.unit54.lesson04.teach.anna_ich_lese:
    title: Annaの趣味
    gloss: Anna：読書が好きで、音楽もよく聴きます。
    note: レッスン01～02で学んだ趣味を表す2つの動詞を、*und*（そして）で一つの文につないでいます。
  de.a1.unit54.lesson04.teach.felix_spielst_du:
    title: Felixがゲームについて尋ねる
    gloss: Felix：あなたもビデオゲームをしますか？
    note: 短いはい・いいえ疑問文です。動詞を文頭に置いて、spielst du ...? とします。
  de.a1.unit54.lesson04.teach.anna_nein_ich:
    title: Annaが答える
    gloss: Anna：いいえ、ビデオゲームはまったくしません。でも、ときどき絵を描きます！
    note: レッスン03で学んだ *Nie*（決して～ない）と *manchmal*（ときどき）を、一つの答えの中で対比しています。どちらも動詞のすぐ後ろに置きます。
  de.a1.unit54.lesson05.teach.felix_und_ich:
    title: 趣味を比べる
    gloss: Felixと私はよく一緒に散歩します。でも、私たちにはほかの趣味もあります。Felixは料理が好きで、家でも料理をし、よく運動もします。私は読書が好きで、音楽もよく聴きます。ときどき絵を描きますが、ビデオゲームはまったくしません。あなたは暇なとき、何をするのが好きですか？
    note: Annaのメッセージではレッスン04で出てきた内容を振り返り、最後にこのユニットの中心となる質問を読者に投げかけています。
    glosses:
      spazieren: 散歩する
      oft: よく
      zusammen: 一緒に
      andere: ほかの
      kocht: 料理する
      gern: ～するのが好き
      Hause: 家で
      Sport: 運動する
      lese: 読む
      höre: 聴く
      Musik: 音楽
      zeichne: 絵を描く
      manchmal: 時々
      spiele: ビデオゲームをする
      nie: 決して〜ない
      freien: 自由な
      Zeit: 時間
  de.a1.unit54.lesson06.teach.felix_was_machst:
    title: Felixが週末の予定を尋ねる
    gloss: Felix：今週末は何をしますか？
    note: '*Dieses Wochenende*（今週末）の語尾が -es なのは、das Wochenende が中性名詞だからです。'
  de.a1.unit54.lesson06.teach.anna_ich_weiss:
    title: Annaはまだ決めていない
    gloss: Anna：まだ分かりません。読書は好きですが、外にも出たいです。
    note: '*Nach draußen*（外へ、直訳すると「外の方へ」）は、家から外に出たいと伝える一般的な表現です。'
  de.a1.unit54.lesson06.teach.felix_gehen_wir:
    title: Felixが計画を提案する
    gloss: Felix：一緒に散歩しませんか？ その後、私が二人分の料理を作ります。
    note: '*Danach*（その後）が文頭に来るため、その次に動詞、その後ろに主語を置いて、danach koche ich となります。'
  de.a1.unit54.lesson06.teach.anna_gute_idee:
    title: Annaが賛成する
    gloss: Anna：いい考えですね！ 散歩も料理も好きです。
    note: 動詞の後ろに *Gern* を置くと、その行為が好きだと表せます：ich gehe gern spazieren、ich koche gern。ほとんどどの動詞にも使えます。
  de.a1.unit54.lesson06.teach.felix_perfekt_dann:
    title: Felixが予定を確認する
    gloss: Felix：完璧です。では、土曜日に会いましょう！
    note: '*Samstag*（土曜日）の予定を確認する親しみのある締めくくりの言葉です。曜日には *am* を使い、am Samstag と言います。'
