course:
  title: ドイツ語 A1
  description: 自由時間の活動について表現するための初級ドイツ語です。趣味の語彙、頻度を表す言葉、自由時間に何をするかを尋ねたり答えたりする表現、2人の趣味を比べる表現を学びます。
