    note: '*lernen*は、ドイツ語などの科目が目的語の場合、「勉強する」という意味になります。'
    example_gloss: 文脈では「私は夕方にドイツ語を勉強します」という意味です。
  de.a1.unit11.lesson01.teach.schlafen:
    title: schlafen gehen
    gloss: 眠りに行く／寝る
    note: '*schlafen gehen*は、夜になって寝ることを表します。'
    example_gloss: 文脈では「私は10時に寝ます」という意味です。
  de.a1.unit11.lesson01.teach.dann:
    title: Dann frühstücke ich.
    gloss: それから私は朝食を取ります。
    note: '*dann*の後では、通常、動詞がすぐ後に置かれます。*Dann ich frühstücke*ではなく、*Dann frühstücke ich*となります。'
  de.a1.unit11.lesson02.teach.wann_stehen_sie_auf:
    title: Wann stehen Sie auf?
    gloss: 何時に起きますか？
    note: 敬称の*Sie*を使った疑問文です。分離する*auf*は文末に置かれます。
