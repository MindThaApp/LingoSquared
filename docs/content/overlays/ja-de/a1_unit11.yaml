    example_gloss: 何時に朝食を取りますか？
  de.a1.unit11.lesson01.teach.arbeiten:
    title: arbeiten
    gloss: 働く
    note: '*arbeiten*の*ich*に対応する語尾は通常どおりです：*ich arbeite*。'
    example_gloss: 文脈では「私は午後に働きます」という意味です。
  de.a1.unit11.lesson01.teach.lernen:
    title: lernen
