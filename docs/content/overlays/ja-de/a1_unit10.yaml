teaching:
  de.a1.unit10.lesson01.teach.links_abbiegen:
    title: Biegen Sie links ab.
    gloss: 左に曲がってください。
    note: '*abbiegen*（曲がる）は分離動詞です。接頭辞の *ab* は節の最後に移動します：*Biegen Sie... ab* であり、*Sie biegen ab* や *Abbiegen Sie* ではありません。'
  de.a1.unit10.lesson01.teach.rechts_abbiegen:
    title: Biegen Sie rechts ab.
    gloss: 右に曲がってください。
    note: '*links abbiegen* と同じ分離動詞の形で、links（左）が *rechts*（右）に変わっただけです。'
  de.a1.unit10.lesson01.teach.geradeaus_gehen:
    title: Gehen Sie geradeaus.
    gloss: まっすぐ進んでください。
    note: '*geradeaus* は「まっすぐ前へ」という意味です。ここには分離する接頭辞がなく、より単純な敬称の命令形です。'
  de.a1.unit10.lesson01.teach.hier_anhalten:
    title: Halten Sie hier an.
    gloss: ここで止まってください。
    note: '*anhalten*（止まる）も分離動詞です。*abbiegen* と同じように、*an* が最後に移動します。'
  de.a1.unit10.lesson01.teach.ecke:
    title: Ecke
    gloss: 角
    note: '*Ecke* は「角」という意味の女性名詞で、*die Ecke* となります。'
    example_gloss: 角で左に曲がってください。
  de.a1.unit10.lesson02.teach.wie_komme_ich_zur_bank:
    title: Wie komme ich zur Bank?
    gloss: 銀行へはどう行けばよいですか？
    note: '*zur* は *zu der* を縮約した形です（女性名詞 die Bank の3格）。第9ユニットで学んだ *vom*（von + dem）と同じ縮約の仕組みです。'
  de.a1.unit10.lesson02.teach.geradeaus_dann_links:
    title: Gehen Sie geradeaus, dann biegen Sie an der Ecke links ab.
    gloss: まっすぐ進み、それから角で左に曲がってください。
    note: '*dann*（それから）は2つの道順をつなぎます。*an der Ecke*（角で）では、第9ユニットで学んだ場所を表す前置詞の形に合わせ、女性名詞の3格の冠詞を使います。'
  de.a1.unit10.lesson02.teach.ist_es_weit:
    title: Ist es weit?
    gloss: 遠いですか？
    note: '*weit* は「遠い」という意味です。'
  de.a1.unit10.lesson02.teach.zwei_minuten:
    title: Es ist nur zwei Minuten von hier.
    gloss: ここからほんの2分です。
    note: '*nur* は「ほんの／たった」という意味です。'
  de.a1.unit10.lesson02.teach.nicht_verfehlen:
    title: Das können Sie nicht verfehlen.
    gloss: 見逃すことはありません。
    note: '*verfehlen* は「見つけ損なう」という意味の「見逃す」です。直訳すると「それをあなたが見逃すことはありえません」となります。'
  de.a1.unit10.lesson03.teach.erste_strasse:
    title: Nehmen Sie die erste Straße links.
    gloss: 左側の最初の通りに入ってください。
    note: '*erste* は「最初の」という意味の序数です。日本語の「第1の」に相当します。'
  de.a1.unit10.lesson03.teach.zweite_strasse:
    title: Nehmen Sie die zweite Straße rechts.
    gloss: 右側の2つ目の通りに入ってください。
    note: '*zweite* は「2番目の」という意味です。'
  de.a1.unit10.lesson03.teach.route_text:
    title: Wegbeschreibung zur Apotheke
    gloss: 薬局への道順
    note: すでに学んだ複数の表現を組み合わせた短い道案内です。
  de.a1.unit10.lesson04.teach.line01:
    title: Felixが道を尋ねます
    gloss: Felix：すみません、銀行へはどう行けばよいですか？
    note: 第9ユニットと同じ丁寧な切り出し方ですが、ここでは場所だけでなく、そこまでの道順を尋ねています。
  de.a1.unit10.lesson04.teach.line02:
    title: Annaが道順を教えます
    gloss: Anna：まっすぐ進み、それから角で左に曲がってください。
    note: 完全な答えでは、*dann* を使って2つの道順をつなぎます。
  de.a1.unit10.lesson04.teach.line03:
    title: Felixが確認し、さらに尋ねます
    gloss: Felix：角で左に曲がる、分かりました。遠いですか？
    note: Felixは理解できたか確かめるために道順を繰り返し、その後、自然な流れで追加の質問をしています。
  de.a1.unit10.lesson04.teach.line04:
    title: Annaが距離について答えます
    gloss: Anna：いいえ、ここからほんの2分です。見逃すことはありません。
    note: 十分な情報を含む、安心させる答えです。
