  de.a1.unit56.lesson01.teach.ja_ich_habe:
    title: はい、犬を飼っています
    gloss: はい、犬を飼っています。
    note: このユニットの新しい語彙を使った、簡単な肯定の答えです。
  de.a1.unit56.lesson01.teach.nein_ich_habe:
    title: いいえ、ペットは飼っていません
    gloss: いいえ、ペットは飼っていません。
    note: '*Kein* は名詞句 *ein Haustier* を否定します。文法メモを確認しましょう。'
  de.a1.unit56.lesson01.teach.kein_sagt_nein:
    title: Kein：名詞の否定
    gloss: Kein は、肯定文で ein- が付く名詞を否定します。Ich habe einen Hund に対して、Ich habe kein Haustier となります。
    note: 否定文では *Kein* が *ein* に代わり、同じ語尾変化をします。ein Haustier は kein Haustier に、einen Hund は keinen Hund になります。動詞や形容詞の否定には *nicht* を使います。
