    gloss: ドイツ語の複数形にはさまざまな形があります：der Hund -> die Hunde、die Katze -> die Katzen、der Vogel -> die Vögel。名詞ごとに複数形も一緒に覚えましょう。
    note: ここでは動物を表す名詞を例に、ドイツ語の基本的な複数形を初めて学びます。
