    example_gloss: 私は毎日犬を散歩させます。
  de.a1.unit56.lesson02.teach.ausfuehren_ist_trennbar:
    title: Ausführen は分離動詞
    gloss: Ausführen は、aufstehen と同じく分離動詞です：ich führe den Hund aus.
    note: 日課を表す動詞で学んだ分離動詞の形「語幹＋…＋文末の前つづり」を、そのまま使います。
  de.a1.unit56.lesson02.teach.futter_geben:
