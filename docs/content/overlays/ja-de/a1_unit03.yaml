teaching:
  de.a1.unit03.lesson01.teach.null_bis_vier:
    title: null, eins, zwei, drei, vier
    gloss: ゼロ、1、2、3、4
    note: ドイツ語の0から4までの数字です。
    example_gloss:
    - リンゴを0個持っています。
    - 私は1番です！
    - リンゴを2個持っています。
    - リンゴを3個持っています。
    - リンゴを4個持っています。
  de.a1.unit03.lesson01.teach.fuenf_bis_zehn:
    title: fünf, sechs, sieben, acht, neun, zehn
    gloss: 5、6、7、8、9、10
    note: ドイツ語の5から10までの数字です。
    example_gloss:
    - リンゴを5個持っています。
    - リンゴを6個持っています。
    - リンゴを7個持っています。
    - リンゴを8個持っています。
    - リンゴを9個持っています。
    - リンゴを10個持っています。
  de.a1.unit03.lesson02.teach.elf_zwoelf:
    title: elf, zwölf
    gloss: 11、12
    note: '*elf*と*zwölf*は不規則な形で、13以降で使われる「1の位＋zehn」というパターンには従いません。'
    example_gloss:
    - 私の家の番地は11です。
    - 私の家の番地は12です。
  de.a1.unit03.lesson02.teach.dreizehn_bis_sechzehn:
    title: dreizehn, vierzehn, fünfzehn, sechzehn
    gloss: 13、14、15、16
    note: 13以降のドイツ語の数詞は、基本となる数字に *-zehn* を付けて作ります（英語の *-teen* に似ています）。ただし、*sechzehn* は *sechszehn* ではなく、*s* が脱落することに注意してください。
    example_gloss:
    - 私の家の番地は13です。
    - 私の家の番地は14です。
    - 私の家の番地は15です。
    - 私の家の番地は16です。
  de.a1.unit03.lesson02.teach.siebzehn_bis_zwanzig:
    title: siebzehn, achtzehn, neunzehn, zwanzig
    gloss: 17、18、19、20
    note: '*siebenzehn*ではなく*siebzehn*です。*sieben*の*-en*は*-zehn*の前で落ちることに注意してください。'
    example_gloss:
    - 私の家の番地は17です。
    - 私の家の番地は18です。
    - 私の家の番地は19です。
    - 私の家の番地は20です。
  de.a1.unit03.lesson03.teach.dreissig_bis_fuenfzig:
    title: dreißig, vierzig, fünfzig
    gloss: 30、40、50
    note: '*dreizig*ではなく*dreißig*です。30は*-zig*ではなく*-ßig*で終わります（20を表す*zwanzig*も不規則です）。'
    example_gloss:
    - それは30ユーロです。
    - それは40ユーロです。
    - それは50ユーロです。
  de.a1.unit03.lesson03.teach.sechzig_bis_neunzig:
    title: sechzig, siebzig, achtzig, neunzig
    gloss: 60、70、80、90
    note: 40以降は規則的で、1の位を表す語に*-zig*を付けます（13から19までと同様に、*sech-*と*sieb-*では語尾が短くなります）。
    example_gloss:
    - それは60ユーロです。
    - それは70ユーロです。
    - それは80ユーロです。
    - それは90ユーロです。
  de.a1.unit03.lesson03.teach.hundert:
    title: hundert
    gloss: '100'
    note: '*hundert*だけで「100」という意味になり、前に*ein*を付ける必要はありません（*einhundert*も使えますが、日常会話ではあまり一般的ではありません）。'
    example_gloss: それは100ユーロです。
  de.a1.unit03.lesson03.teach.einundzwanzig:
    title: einundzwanzig
    gloss: '21'
    note: ドイツ語の21から99までの合成数は、1の位＋*und*（「と」）＋10の位の順に並べ、すべてを1語で書きます。*einundzwanzig*＝*ein*（1）＋*und*（と）＋*zwanzig*（20）で、直訳すると「1と20」です。
  de.a1.unit03.lesson03.teach.zweiunddreissig:
    title: zweiunddreißig
    gloss: '32'
    note: 同じパターンです。*zwei*（2）＋*und*＋*dreißig*（30）＝「2と30」＝32です。
  de.a1.unit03.lesson04.teach.wie_alt_sind_sie:
    title: Wie alt sind Sie?
    gloss: おいくつですか？（敬称）
    note: '*alt*は「年を取った」という意味で、直訳すると「あなたはどのくらい年を取っていますか」です。'
  de.a1.unit03.lesson04.teach.wie_alt_bist_du:
    title: Wie alt bist du?
    gloss: 何歳？（親称）
    note: '*du*を使う親しい相手向けの表現です。'
  de.a1.unit03.lesson04.teach.ich_bin_jahre_alt:
    title: Ich bin achtundzwanzig Jahre alt.
    gloss: 私は28歳です。
    note: '*Jahre alt*（〜歳）は必ず数の後に置きます。ドイツ語では「私は［数］歳です」という形で年齢を表します。'
  de.a1.unit03.lesson05.teach.line01:
    title: FelixがAnnaの年齢を尋ねる
    gloss: Felix：差し支えなければ、おいくつですか？
    note: '*wenn ich fragen darf*（「差し支えなければ」）を添えると、やや直接的に感じられる質問を和らげられます。引き続き敬称の*Sie*を使う二人にふさわしい丁寧な言い方です。'
  de.a1.unit03.lesson05.teach.line02:
    title: Annaが答えて聞き返す
    gloss: Anna：私は28歳です。あなたは？
    note: Annaは自分の年齢を答え、ユニット2で学んだパターンを使って相手にも同じ質問を返しています。
  de.a1.unit03.lesson05.teach.line03:
    title: Felixが答える
    gloss: Felix：私は31歳です。
    note: これで、FelixがAnnaより3歳年上だと分かります。
