course:
  title: Engleză A2
  description: Învață engleza la nivel A2 pentru situații de zi cu zi ceva mai formale, cu explicații detaliate în română.
units:
  en.a2.unit39.after_the_interview:
    title: După interviu
lessons:
  en.a2.unit39.lesson01.offer_vocabulary:
    title: Ofertă, contract și dată de începere
  en.a2.unit39.lesson02.following_up:
    title: Reluarea contactului și acceptarea ofertei
  en.a2.unit39.lesson03.reading_an_offer_message:
    title: Citirea unei oferte de angajare
  en.a2.unit39.lesson04.offer_call_dialogue:
    title: Telefonul cu oferta de angajare
teaching:
  en.a2.unit39.lesson01.teach.offer:
    title: offer
    gloss: ofertă
    note: '*offer* este aici oferta pentru un post. Ca verb, *to offer* înseamnă a oferi.'
    example_gloss: Am primit o ofertă de angajare de la Bright Path Marketing.
  en.a2.unit39.lesson01.teach.contract:
    title: contract
    gloss: contract de muncă, contract
    note: '*contract* este înțelegerea scrisă dintre tine și firmă.'
    example_gloss: Contractul este pe un an.
  en.a2.unit39.lesson01.teach.salary:
    title: salary
    gloss: salariu
    note: '*salary* este suma pe care o câștigi pe lună sau pe an.'
    example_gloss: Despre salariu putem discuta săptămâna viitoare.
  en.a2.unit39.lesson01.teach.accept:
    title: accept
    gloss: a accepta
    note: '*accept* înseamnă a spune da la ceva ce ți se oferă.'
    example_gloss: Aș dori să accept postul.
  en.a2.unit39.lesson01.teach.start_date:
    title: start date
    gloss: data începerii
    note: '*start date* este prima zi la noul tău loc de muncă.'
    example_gloss: Data începerii este prima zi de luni din lună.
  en.a2.unit39.lesson01.teach.reply:
    title: reply
    gloss: răspuns
    note: '*reply* este atât răspunsul la un mesaj, cât și verbul a răspunde.'
    example_gloss: Am trimis un răspuns chiar în aceeași zi.
  en.a2.unit39.lesson01.teach.grammar_would_like_to:
    title: would like to pentru o dorință politicoasă
    gloss: Aș dori să accept oferta. Aș dori să încep luni.
    note: '*I would like to ...* este mai politicos decât *I want to ...* și se potrivește în contactele de afaceri.'
  en.a2.unit39.lesson02.teach.thank_you_for_the_interview:
    title: Începerea mesajului
    gloss: Vă mulțumesc pentru interviul de ieri.
    note: '*Thank you for ...* este începutul obișnuit al unui scurt mesaj de mulțumire în mediul profesional.'
  en.a2.unit39.lesson02.teach.still_interested:
    title: Cum spui că ești în continuare interesat
    gloss: Sunt în continuare foarte interesată de post.
    note: '*still* înseamnă „încă” sau „în continuare” și stă înaintea adjectivului.'
  en.a2.unit39.lesson02.teach.could_you_tell_me_start_date:
    title: Cum întrebi politicos data de început
    gloss: Ați putea să-mi spuneți data începerii?
    note: '*Could you tell me ...?* este o întrebare indirectă și mai politicoasă decât *When is the start date?*'
  en.a2.unit39.lesson02.teach.would_like_to_accept:
    title: Acceptarea ofertei
    gloss: Aș dori să accept oferta.
    note: Aceasta este propoziția standard prin care accepți un post.
  en.a2.unit39.lesson02.teach.grammar_indirect_questions:
    title: Întrebări indirecte cu Could you tell me
    gloss: Ați putea să-mi spuneți data începerii? Ați putea să-mi spuneți despre programul de lucru?
    note: 'După *Could you tell me* nu mai urmează ordinea cuvintelor din întrebare: se spune *the start date*, nu *what is the start date*.'
  en.a2.unit39.lesson03.teach.full_time:
    title: full time
    gloss: normă întreagă
    note: '*full time* înseamnă o săptămână de lucru completă; opusul este *part time* (jumătate de normă).'
    example_gloss: Postul este cu normă întreagă, nu doar două zile pe săptămână.
  en.a2.unit39.lesson03.teach.offer_message:
    title: Mesajul cu oferta
    gloss: Dragă Mia, îți mulțumim că ai venit marți la noi. Ne-ar face plăcere să îți oferim postul de coordonator de marketing. Contractul este cu normă întreagă, iar data începerii este luni. Te rugăm să răspunzi până vineri. Bright Path Marketing.
    note: 'Un mesaj cu o ofertă de angajare spune întotdeauna patru lucruri: postul, tipul contractului, data începerii și termenul pentru răspunsul tău.'
  en.a2.unit39.lesson03.teach.please_reply_by_friday:
    title: Termenul de răspuns
    gloss: Vă rugăm să răspundeți până vineri.
    note: '*by Friday* înseamnă cel târziu vineri, deci și vinerea însăși este încă permisă.'
  en.a2.unit39.lesson04.teach.q_calling_about_interview:
    title: Intervievatoarea o sună pe Mia
    gloss: 'Intervievatoarea spune: Bună ziua, Mia, vă sun în legătură cu interviul de marți.'
    note: '*I am calling about ...* este începutul obișnuit al unei convorbiri telefonice de afaceri.'
  en.a2.unit39.lesson04.teach.a_still_interested:
    title: Mia spune că e în continuare interesată
    gloss: 'Mia spune: Vă mulțumesc că ați sunat. Sunt în continuare foarte interesată de post.'
    note: Aceeași propoziție ca în lecția 2.
  en.a2.unit39.lesson04.teach.q_offer_you_the_job:
    title: Intervievatoarea oferă postul
    gloss: 'Intervievatoarea spune: Mă bucur, pentru că am dori să vă oferim postul.'
    note: '*because* leagă aici răspunsul Miei de vestea bună care urmează.'
  en.a2.unit39.lesson04.teach.a_great_news_ask_start_date:
    title: Mia reacționează și întreabă data de început
    gloss: 'Mia spune: Sunt vești minunate. Ați putea să-mi spuneți data începerii?'
    note: Mai întâi reacționezi pe scurt la veste, abia apoi pui întrebarea.
  en.a2.unit39.lesson04.teach.q_start_date_and_contract:
    title: Intervievatoarea spune data și contractul
    gloss: 'Intervievatoarea spune: Data începerii este luni, iar contractul este cu normă întreagă.'
    note: Aceleași două fapte ca în mesajul din lecția 3.
  en.a2.unit39.lesson04.teach.a_ask_working_hours:
    title: Mia întreabă despre programul de lucru
    gloss: 'Mia întreabă: Ați putea să-mi spuneți despre programul de lucru?'
    note: Aceeași formă de întrebare indirectă ca la data începerii.
  en.a2.unit39.lesson04.teach.q_nine_to_five:
    title: Intervievatoarea spune programul de lucru
    gloss: 'Intervievatoarea spune: De la nouă la cinci, cu o oră pentru prânz.'
    note: '*from nine to five* este expresia fixă pentru a descrie o zi de lucru.'
  en.a2.unit39.lesson04.teach.a_accept_the_offer:
    title: Mia acceptă oferta
    gloss: 'Mia spune: Vă mulțumesc. Aș dori să accept oferta.'
    note: Aceeași propoziție ca în lecția 2.
  en.a2.unit39.lesson04.teach.q_send_the_contract:
    title: Intervievatoarea încheie conversația
    gloss: 'Intervievatoarea spune: Minunat. Vă trimitem contractul chiar astăzi.'
    note: '*Wonderful* este o reacție caldă și pozitivă, cât se poate de obișnuită și în engleza de afaceri.'
