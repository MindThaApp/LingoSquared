  en.a1.unit41.lesson03.teach.dialogue_line1:
    title: Invitația Miei
    gloss: 'Mia întreabă: În seara asta fac paste. Vrei să mă ajuți să gătesc?'
    note: '*Do you want to help me* + verb*?* este o modalitate firească de a invita pe cineva să ajute.'
  en.a1.unit41.lesson03.teach.dialogue_line2:
    title: Răspunsul lui Daniel
    gloss: 'Daniel spune: Sigur! Doar că nu prea mă pricep la gătit.'
    note: '*though* la sfârșitul propoziției arată o ușoară opoziție, cam ca „totuși” sau „doar că” în română.'
  en.a1.unit41.lesson03.teach.dialogue_line3:
    title: Încurajarea Miei
    gloss: 'Mia spune: Nicio problemă, îți arăt eu. Poți să tocești ceapa asta?'
    note: '*I''ll show you* înseamnă: îți arăt eu.'
  en.a1.unit41.lesson03.teach.dialogue_line4:
    title: Întrebarea lui Daniel
    gloss: 'Daniel spune: Nicio problemă. Cât de mărunt s-o tai?'
    note: '*should* cere un sfat.'
  en.a1.unit41.lesson03.teach.dialogue_line5:
    title: Explicația Miei
    gloss: 'Mia spune: În bucăți mici, așa. Acum să fierbem pastele.'
    note: '*like this* înseamnă: așa, în felul acesta.'
  en.a1.unit41.lesson03.teach.dialogue_line6:
    title: Răspunsul lui Daniel
    gloss: 'Daniel spune: Pot să gust sosul? E delicios!'
    note: '*Can I* + verb*?* cere permisiunea.'
  en.a1.unit41.lesson03.teach.dialogue_line7:
    title: Încheierea Miei
    gloss: 'Mia spune: Super! Cina e aproape gata.'
    note: '*almost ready* înseamnă aproape gata.'
  en.a1.unit41.lesson04.teach.reading_passage:
    title: Text despre gătitul împreună
    gloss: Daniel, Leila și Mia gătesc la niveluri diferite. De când Leila s-a mutat într-un apartament nou, aproape de Mia, cei trei prieteni gătesc des împreună. Leila gătește bine. Face adesea paste după vechea rețetă a mamei ei. Și Mia iubește gătitul și l-a învățat pe Daniel să toace ceapa fără să-și taie degetele. Daniel nu este încă un bucătar grozav, dar învață repede. Aseară, Mia l-a rugat pe Daniel s-o ajute să facă paste. El a tocat ceapa, iar Mia a fiert pastele și a făcut sosul. Daniel a gustat sosul și a spus că este delicios. Leila a ajuns chiar când mâncarea era gata și toți trei au mâncat împreună în bucătăria Miei.
    note: '*arrived just as dinner was ready* înseamnă: a ajuns chiar când cina era gata.'
