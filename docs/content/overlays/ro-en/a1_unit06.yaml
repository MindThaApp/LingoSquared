    title: cousin
    gloss: văr / verișoară
    note: Engleza are un singur cuvânt, *cousin*, pentru ambele genuri – româna deosebește „văr” (băiat) de „verișoară” (fată).
    example_gloss: Acesta este vărul meu / Aceasta este verișoara mea.
  en.a1.unit06.lesson02.teach.my_mother:
    title: my mother
    gloss: mama mea
    note: '*my* corespunde lui „meu/mea” – aici „mea”, pentru că „mamă” este feminin.'
  en.a1.unit06.lesson02.teach.your_father:
    title: your father
    gloss: tatăl tău / tatăl dumneavoastră
    note: '*your* corespunde în română lui „tău/ta” (informal) sau „dumneavoastră” (formal) – alegerea depinde de interlocutor, nu de gen. Separat de asta, forma românească „tău/ta/tăi/tale” se acordă cu substantivul care urmează („tatăl tău”, „mama ta”), pe când englezescul *your* rămâne mereu la fel.'
  en.a1.unit06.lesson02.teach.his_sister:
    title: his sister
    gloss: sora lui
    note: '*his* corespunde lui „lui” – se potrivește posesorului (un bărbat) și rămâne la fel, indiferent de substantivul care urmează.'
  en.a1.unit06.lesson02.teach.her_brother:
    title: her brother
    gloss: fratele ei
    note: '*her* corespunde lui „ei” – se potrivește posesoarei (o femeie) și rămâne la fel, indiferent de substantiv.'
