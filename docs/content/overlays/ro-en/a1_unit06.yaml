    title: She's twenty years old.
    gloss: Ea are douăzeci de ani.
    note: '*She''s twenty years old.* spune vârsta.'
  en.a1.unit06.lesson03.teach.i_have_two_brothers:
    title: I have two brothers.
    gloss: Am doi frați.
    note: '*brothers* este pluralul lui *brother*.'
  en.a1.unit06.lesson03.teach.do_you_have_siblings:
    title: Do you have any siblings?
    gloss: Ai frați sau surori?
    note: '*Do you have any siblings?* întreabă în general despre frați și surori.'
  en.a1.unit06.lesson03.teach.no_i_dont:
    title: No, I don't. I'm an only child.
    gloss: Nu, nu am. Sunt copil unic.
    note: '*an only child* înseamnă copil unic.'
