    gloss: fotografie
    note: '*photo* înseamnă fotografie.'
    example_gloss: Am o fotografie.
  en.a1.unit06.lesson04.teach.q_family:
    title: Leila întreabă despre familie
    gloss: 'Leila: Aceasta este familia dumneavoastră?'
    note: '*Is this your family?* întreabă dacă fotografia arată propria familie.'
  en.a1.unit06.lesson04.teach.a_parents:
    title: Răspunsul despre părinți
    gloss: 'Daniel: Da. Aceasta este mama mea și acesta este tatăl meu.'
    note: Un răspuns complet îi numește pe cei doi părinți separat.
  en.a1.unit06.lesson04.teach.q_who:
    title: Întrebarea despre o persoană
    gloss: 'Leila: Cine este aceasta?'
    note: '*Who is this?* întreabă cine este persoana arătată.'
  en.a1.unit06.lesson04.teach.a_sister_teacher:
    title: Răspunsul despre soră
    gloss: 'Daniel: Aceasta este sora mea. Este profesoară.'
    note: '*She''s a teacher.* spune profesia.'
  en.a1.unit06.lesson04.teach.q_brothers:
    title: Întrebarea despre frați
    gloss: 'Leila: Aveți frați?'
    note: '*Do you have any brothers?* întreabă anume despre frați, nu în general despre frați și surori.'
  en.a1.unit06.lesson04.teach.a_no_one_sister:
    title: Răspunsul despre frați și surori
    gloss: 'Daniel: Nu, nu am. Am doar o soră.'
    note: '*I just have one sister.* restrânge răspunsul anterior.'
