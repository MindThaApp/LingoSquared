teaching:
  en.b2.unit02.lesson01.teach.may:
    title: may
    gloss: e posibil să, se poate să
    note: '*may* exprimă posibilitatea. Aici nu înseamnă permisiune, ca în *May I...?*.'
    example_gloss: Se poate să fie adevărat.
  en.b2.unit02.lesson01.teach.might:
    title: might
    gloss: ar putea, poate
    note: '*might* exprimă o posibilitate prudentă, adesea ceva mai nesigură decât *may*.'
    example_gloss: Ar putea fi adevărat.
  en.b2.unit02.lesson01.teach.must:
    title: must
    gloss: trebuie să fie, sigur
    note: '*must* exprimă aici o concluzie puternică, bazată pe dovezi, nu o obligație.'
    example_gloss: Trebuie să fie adevărat.
  en.b2.unit02.lesson01.teach.cannot:
    title: cannot
    gloss: nu are cum să fie, e imposibil să
    note: '*cannot* folosești când dovezile exclud ceva. Pentru trecut devine *cannot have been*.'
    example_gloss: Nu are cum să fie adevărat.
  en.b2.unit02.lesson01.teach.deduction:
    title: deduction
    gloss: concluzie bazată pe dovezi
    note: '*deduction* înseamnă a raționa pornind de la indicii, nu a ghici la întâmplare.'
    example_gloss: Concluzia Miei se bazează pe dovezi.
  en.b2.unit02.lesson01.teach.guesswork:
    title: guesswork
    gloss: presupunere fără temei
    note: '*guesswork* este o presupunere cu puține dovezi sau fără nicio dovadă.'
    example_gloss: Fără dovezi, explicația ar fi doar o presupunere fără temei.
  en.b2.unit02.lesson01.teach.may_might_contrast:
    title: may en might
    gloss: May și might se suprapun adesea. Ambele indică o explicație posibilă; might sună de obicei ceva mai prudent.
    note: Nu traduce mereu românescul „poate” prin *maybe*. Într-o formulare îngrijită, *may* și *might* sună adesea mai bine.
  en.b2.unit02.lesson02.teach.must_have_gone_down:
    title: Concluzie puternică despre trecut
    gloss: Serverul trebuie să fi căzut peste noapte, pentru că nu s-a generat niciun raport.
    note: 'Românescul „trebuie să fi căzut” corespunde în engleză lui *must have* + participiu: *must have gone down*.'
  en.b2.unit02.lesson02.teach.may_have_failed:
    title: Cauză posibilă în trecut
    gloss: Se poate ca rapoartele să fi eșuat în cursul nopții.
    note: '*may have failed* este o cauză posibilă, nu o concluzie sigură.'
  en.b2.unit02.lesson02.teach.might_have_permission:
    title: Posibilitate exprimată prudent
    gloss: Ar fi putut fi, în schimb, o problemă de permisiuni.
    note: '*might have been* lasă cauza deschisă și sună mai prudent decât *must have been*.'
  en.b2.unit02.lesson02.teach.cannot_have_only_report:
    title: A exclude ceva
    gloss: Nu are cum să fi fost doar o problemă de rapoarte.
    note: Românescul „nu are cum să fi fost” corespunde aici lui *cannot have been* sau, în vorbire, *can't have been*.
  en.b2.unit02.lesson02.teach.grammar_modal_deduction:
    title: Verbe modale pentru presupuneri
    gloss: Folosește must be pentru o concluzie puternică despre prezent și must have been pentru o concluzie puternică despre trecut. Folosește may/might pentru posibilitate în prezent și may have/might have pentru posibilitate în trecut. Folosește cannot/cannot have been când dovezile exclud o explicație.
    note: 'Atenție: *must* nu înseamnă aici obligație, ci „trebuie să fie așa”: o concluzie.'
  en.b2.unit02.lesson03.teach.outage:
    title: outage
    gloss: pană de sistem, cădere (a unui serviciu)
    note: '*outage* este o defecțiune în care un sistem sau un serviciu nu funcționează.'
    example_gloss: O pană de sistem a împiedicat rularea rapoartelor.
  en.b2.unit02.lesson03.teach.consequence:
    title: consequence
    gloss: consecință
    note: '*consequence* este rezultatul unei cauze sau al unei probleme.'
    example_gloss: O consecință este că panoul de control poate afișa date vechi.
  en.b2.unit02.lesson03.teach.reading_passage:
    title: 'Lectură: ce s-a întâmplat probabil?'
    gloss: Rapoartele de peste noapte nu au rulat, iar pagina de monitorizare este goală. Mia spune că serverul trebuie să fi căzut în timpul nopții. Daniel sugerează că ar fi putut fi o problemă de permisiuni, dar aceasta nu poate explica pagina de monitorizare goală. Echipa financiară poate că nu are cifrele de dimineață, iar panoul clientului ar putea afișa date vechi până când rapoartele sunt refăcute. Mia nu este complet sigură, dar explicația ei este o concluzie trasă din dovezile disponibile, nu o simplă presupunere.
    note: Textul separă faptele, cauzele posibile, concluziile puternice, explicațiile excluse și consecințele posibile.
  en.b2.unit02.lesson04.teach.q_no_reports:
    title: Daniel prezintă faptul
    gloss: 'Daniel spune: Niciunul dintre rapoartele de peste noapte nu a fost generat.'
    note: Acesta este faptul cunoscut, încă fără speculații.
  en.b2.unit02.lesson04.teach.a_server_down:
    title: Mia trage o concluzie puternică
    gloss: 'Mia spune: Serverul trebuie să fi căzut peste noapte.'
    note: '*must have gone down* este o concluzie puternică despre trecut.'
  en.b2.unit02.lesson04.teach.q_permission_issue:
    title: Daniel propune o cauză posibilă
    gloss: 'Daniel spune: Ar fi putut fi, în schimb, o problemă de permisiuni.'
    note: '*might have been* lasă varianta deschisă, dar nu o face sigură.'
  en.b2.unit02.lesson04.teach.a_cannot_only_report:
    title: Mia exclude o explicație prea îngustă
    gloss: 'Mia spune: Poate, dar și pagina de monitorizare este goală, deci nu are cum să fi fost doar o problemă de rapoarte.'
    note: '*cannot have been only...* exclude explicația pentru că dovezile sunt mai ample.'
  en.b2.unit02.lesson04.teach.q_consequences:
    title: Daniel întreabă despre consecințe
    gloss: 'Daniel întreabă: La ce consecințe ar trebui să ne așteptăm?'
    note: După cauză vine întrebarea despre posibilele consecințe.
  en.b2.unit02.lesson04.teach.a_possible_consequences:
    title: Mia menționează posibile consecințe
    gloss: 'Mia spune: Echipa financiară poate că nu are cifrele de dimineață, iar panoul clientului ar putea afișa date vechi.'
    note: '*may be missing* și *might show* indică consecințe posibile, nu fapte sigure.'
  en.b2.unit02.lesson04.teach.q_deduction_guess:
    title: Daniel verifică gradul de certitudine
    gloss: 'Daniel spune: Deci este o concluzie, nu doar o presupunere?'
    note: Daniel întreabă dacă raționamentul Miei se bazează pe dovezi.
  en.b2.unit02.lesson04.teach.a_evidence_limited:
    title: Mia nuanțează concluzia
    gloss: 'Mia spune: Da. Dovezile sunt limitate, dar indică o pană de sistem.'
    note: O concluzie puternică poate totuși recunoaște limitele dovezilor.
