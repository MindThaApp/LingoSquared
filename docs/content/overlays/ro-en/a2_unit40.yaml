teaching:
  en.a2.unit40.lesson01.teach.order:
    title: order
    gloss: comandă
    note: '*order* este comanda în sine. Ca verb, *to order* înseamnă a comanda.'
    example_gloss: Comanda mea a sosit cu două zile întârziere.
  en.a2.unit40.lesson01.teach.delivery:
    title: delivery
    gloss: livrare
    note: '*delivery* este momentul în care comanda ta este adusă acasă la tine.'
    example_gloss: Livrarea a venit marți dimineața.
  en.a2.unit40.lesson01.teach.parcel:
    title: parcel
    gloss: colet
    note: '*parcel* este pachetul ambalat care îți este lăsat la ușă.'
    example_gloss: Coletul a fost lăsat afară, în fața ușii mele.
  en.a2.unit40.lesson01.teach.damaged:
    title: damaged
    gloss: deteriorat
    note: '*damaged* arată că ceva s-a deteriorat pe drum, dar poate încă funcționează. Se spune mai ales despre ambalaj.'
    example_gloss: Cutia era deteriorată când a ajuns.
  en.a2.unit40.lesson01.teach.broken:
    title: broken
    gloss: stricat
    note: '*broken* este mai puternic decât *damaged*: lucrul nu mai funcționează.'
    example_gloss: Lampa din colet era stricată.
  en.a2.unit40.lesson01.teach.replacement:
    title: replacement
    gloss: înlocuitor, înlocuire
    note: '*replacement* este un exemplar nou în locul celui stricat. *refund* este rambursarea banilor.'
    example_gloss: Am cerut un înlocuitor, nu banii înapoi.
  en.a2.unit40.lesson01.teach.grammar_arrived:
    title: arrived und has not arrived yet
    gloss: Comanda mea a sosit ieri. Comanda mea nu a sosit încă.
    note: '*arrived* se folosește cu un moment din trecut. *has not arrived yet* spune că încă o aștepți.'
  en.a2.unit40.lesson02.teach.report_order_problem:
    title: Sagen, wofür Sie anrufen
    gloss: Aș vrea să semnalez o problemă cu comanda mea.
    note: '*I''d like to report a problem with ...* este aceeași formulă politicoasă ca la scurgerea din unitatea 29.'
  en.a2.unit40.lesson02.teach.lamp_arrived_broken:
    title: Sagen, was nicht stimmt
    gloss: Lampa a ajuns stricată.
    note: '*arrived broken* înseamnă: era deja stricată când a ajuns.'
  en.a2.unit40.lesson02.teach.ask_for_replacement:
    title: Zwischen Ersatz und Rückerstattung wählen
    gloss: Aș putea primi un înlocuitor în loc de rambursare?
    note: '*instead of* pune față în față două posibilități: o alegi pe prima, nu pe a doua.'
  en.a2.unit40.lesson02.teach.my_order_number:
    title: Ihre Bestellnummer nennen
    gloss: Numărul comenzii mele este 8154.
    note: Spune-ți numărul comenzii imediat ce ți se cere; cu el, angajatul îți găsește comanda.
  en.a2.unit40.lesson02.teach.grammar_instead_of:
    title: instead of zum Auswählen
    gloss: Aș putea primi un înlocuitor în loc de rambursare? Aș vrea banii înapoi în loc de schimb.
    note: 'După *instead of* urmează un substantiv sau o formă în -ing (*instead of a refund*, *instead of getting a refund*), niciodată forma de bază a verbului: nu *instead of get a refund*.'
  en.a2.unit40.lesson03.teach.box:
    title: box
    gloss: cutie
    note: '*box* este cutia în care se află comanda ta. *parcel* este întregul colet, așa cum este livrat.'
    example_gloss: Lampa era într-o cutie mare.
  en.a2.unit40.lesson03.teach.return_message:
    title: Die Antwort des Shops
    gloss: Vă mulțumim pentru mesaj. Ne pare rău că lampa dumneavoastră a ajuns stricată. Vă rugăm să puneți lampa la loc în cutie și să o duceți la poștă. O lampă nouă va fi trimisă în termen de trei zile lucrătoare. Număr comandă 8154.
    note: 'Un răspuns de la serviciul clienți spune întotdeauna: care este problema, ce trebuie să faci tu și ce va face magazinul.'
  en.a2.unit40.lesson03.teach.put_it_back_in_the_box:
    title: Was Sie mit der kaputten Lampe tun sollen
    gloss: Vă rugăm să puneți lampa la loc în cutie și să o duceți la poștă.
    note: '*put ... back in ...* înseamnă a pune ceva înapoi de unde a fost luat.'
  en.a2.unit40.lesson04.teach.q_report_a_problem:
    title: Leila ruft den Online-Shop an
    gloss: 'Leila spune: Bună ziua, aș vrea să semnalez o problemă cu comanda mea.'
    note: La telefon spui imediat de ce suni.
  en.a2.unit40.lesson04.teach.a_what_is_the_problem:
    title: Der Mitarbeiter fragt nach
    gloss: 'Angajatul spune: Îmi pare rău să aud asta. Care este problema?'
    note: '*I''m sorry to hear that* este reacția fixă și politicoasă a unui angajat la o veste proastă.'
  en.a2.unit40.lesson04.teach.q_lamp_broken_box_damaged:
    title: Leila erklärt das Problem
    gloss: 'Leila spune: Lampa a ajuns stricată. Cutia era deteriorată.'
    note: 'Observă diferența: cutia este *damaged*, lampa este *broken*.'
  en.a2.unit40.lesson04.teach.a_ask_order_number:
    title: Der Mitarbeiter fragt nach der Bestellnummer
    gloss: 'Angajatul spune: Înțeleg. Ați putea să-mi spuneți numărul comenzii?'
    note: Aceeași formă de întrebare indirectă *Could you tell me ...?* ca în unitatea 39.
  en.a2.unit40.lesson04.teach.q_order_number_8154:
    title: Leila nennt ihre Bestellnummer
    gloss: 'Leila spune: Numărul comenzii mele este 8154.'
    note: Aceeași propoziție ca în lecția 2.
  en.a2.unit40.lesson04.teach.a_refund_or_replacement:
    title: Der Mitarbeiter bietet zwei Möglichkeiten an
    gloss: 'Angajatul spune: Vă mulțumesc. Doriți banii înapoi sau un înlocuitor?'
    note: '*or* pune aici două posibilități una lângă alta; alegi una dintre ele.'
  en.a2.unit40.lesson04.teach.q_replacement_please:
    title: Leila wählt den Ersatz
    gloss: 'Leila spune: Aș putea primi un înlocuitor în loc de rambursare?'
    note: Aceeași întrebare ca în lecția 2.
  en.a2.unit40.lesson04.teach.a_new_lamp_three_days:
    title: Der Mitarbeiter regelt es
    gloss: 'Angajatul spune: Desigur. O lampă nouă va fi trimisă în termen de trei zile lucrătoare.'
    note: Aceeași asigurare ca în mesajul din lecția 3.
  en.a2.unit40.lesson04.teach.q_thank_you:
    title: Leila bedankt sich beim Mitarbeiter
    gloss: 'Leila spune: Vă mulțumesc foarte mult.'
    note: '*very much* face mulțumirea ceva mai apăsată.'
