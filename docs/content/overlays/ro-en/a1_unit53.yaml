teaching:
  en.a1.unit53.lesson01.teach.rent:
    title: rent
    gloss: a închiria
    note: '*rent* înseamnă „a închiria”. Atenție: în engleză, verbul *rent* se folosește în ambele sensuri (a lua ceva cu chirie de la cineva și a da ceva cu chirie cuiva), la fel ca „a închiria” în română, așa că contextul îți arată despre ce este vorba.'
    example_gloss: Vreau să închiriez o bicicletă.
  en.a1.unit53.lesson01.teach.deposit:
    title: deposit
    gloss: garanție
    note: '*deposit* înseamnă „garanție” – banii pe care îi plătești în avans și îi primești înapoi când aduci bicicleta nevătămată.'
    example_gloss: Garanția este de douăzeci de dolari.
  en.a1.unit53.lesson01.teach.return:
    title: return
    gloss: a returna
    note: '*return* înseamnă aici „a returna”, „a aduce înapoi” (nu „a te întoarce”).'
    example_gloss: Vă rog să returnați bicicleta astăzi.
  en.a1.unit53.lesson01.teach.hour:
    title: hour
    gloss: oră
    note: '*hour* înseamnă „oră”.'
    example_gloss: Costă zece dolari pe oră.
  en.a1.unit53.lesson01.teach.size:
    title: size
    gloss: mărime
    note: '*size* înseamnă „mărime”.'
    example_gloss: Ce mărime vă trebuie?
  en.a1.unit53.lesson01.teach.helmet:
    title: helmet
    gloss: cască
    note: '*helmet* înseamnă „cască”.'
    example_gloss: Aveți o cască?
  en.a1.unit53.lesson02.teach.id_like_to_rent_a_bike:
    title: I'd like to rent a bike, please.
    gloss: Aș dori să închiriez o bicicletă, vă rog.
    note: '*I''d like to* (forma scurtă de la *I would like to*) este modul politicos de a cere ceva – mai amabil decât *I want*, care sună direct.'
  en.a1.unit53.lesson02.teach.how_much_does_it_cost_per_hour:
    title: How much does it cost per hour?
    gloss: Cât costă pe oră?
    note: '*does it cost* folosește auxiliarul *does*, pentru că verbul principal este *cost* – aceeași structură cu *do* ca la alte întrebări în engleză.'
  en.a1.unit53.lesson02.teach.i_need_a_small_bike:
    title: I need a small bike.
    gloss: Am nevoie de o bicicletă mică.
    note: '*need a small bike* – engleza folosește aici pur și simplu verbul *need* urmat de substantiv, ca în română „am nevoie de”.'
  en.a1.unit53.lesson02.teach.can_i_have_a_helmet:
    title: Can I have a helmet, please?
    gloss: Pot primi o cască, vă rog?
    note: '*Can I have ...?* este o formulă politicoasă obișnuită când ceri ceva într-un magazin – literal „pot avea”, dar în engleză sună la fel de politicos ca „pot primi ...?” în română.'
  en.a1.unit53.lesson02.teach.when_do_i_need_to_return_it:
    title: When do I need to return it?
    gloss: Până când trebuie să o returnez?
    note: '*do I need to* – și aici se folosește auxiliarul *do* pentru forma de întrebare.'
  en.a1.unit53.lesson02.teach.its_ten_dollars_an_hour:
    title: It's ten dollars an hour.
    gloss: Costă zece dolari pe oră.
    note: '*an hour* înseamnă aici „pe oră” – articolul *an* are sensul „pe”, ca *a* la alte unități de timp.'
  en.a1.unit53.lesson03.teach.dialogue_line1:
    title: Angajatul salută
    gloss: 'Angajatul spune: Bună ziua! Cu ce vă pot ajuta astăzi?'
    note: '*How can I help you today?* este o formulă politicoasă de început, obișnuită în magazine și la servicii.'
  en.a1.unit53.lesson03.teach.dialogue_line2:
    title: Cererea Miei
    gloss: 'Mia spune: Am dori să închiriem două biciclete. Vrem să ne plimbăm pe malul râului.'
    note: '*We''d like to rent* – din nou verbul *rent*, folosit aici pentru a lua cu chirie de la magazin, nu pentru a da cu chirie.'
  en.a1.unit53.lesson03.teach.dialogue_line3:
    title: Angajatul întreabă despre mărime
    gloss: 'Angajatul spune: Desigur. Ce mărime vă trebuie?'
    note: '*What size do you need?* folosește din nou auxiliarul *do* pentru forma de întrebare.'
  en.a1.unit53.lesson03.teach.dialogue_line4:
    title: Mărimea Leilei
    gloss: 'Leila spune: Am nevoie de una mică.'
    note: '*one* înlocuiește aici cuvântul *bike*, ca să nu-l repeți – ca în română „una mică”, dar în engleză *one* este un cuvânt separat.'
  en.a1.unit53.lesson03.teach.dialogue_line5:
    title: Mărimea Miei
    gloss: 'Mia spune: Iar eu am nevoie de una mijlocie.'
    note: Și aici *one* ține locul lui *bike*, ca în propoziția anterioară a Leilei.
  en.a1.unit53.lesson03.teach.dialogue_line6:
    title: Prețul și garanția
    gloss: 'Angajatul spune: Perfect, iată bicicletele dumneavoastră. Costă zece dolari pe oră, iar garanția este de douăzeci de dolari.'
    note: Această propoziție conține două informații distincte (tariful pe oră și garanția) – ai grijă să nu le încurci.
  en.a1.unit53.lesson03.teach.dialogue_line7:
    title: Mia întreabă despre returnare
    gloss: 'Mia spune: Până când trebuie să le returnăm?'
    note: '*them* se referă aici la biciclete (plural).'
  en.a1.unit53.lesson03.teach.dialogue_line8:
    title: Ora returnării
    gloss: 'Angajatul spune: Vă rog să le returnați până la ora cinci.'
    note: '*by five o''clock* înseamnă „până la ora cinci”, adică nu mai târziu.'
  en.a1.unit53.lesson03.teach.dialogue_line9:
    title: Leila îi mulțumește angajatului
    gloss: 'Leila spune: Perfect, mulțumesc!'
    note: '*Great, thank you!* este o formulă scurtă și obișnuită pentru a încheia politicos o conversație.'
  en.a1.unit53.lesson04.teach.reading_passage:
    title: Text despre o plimbare cu bicicleta pe malul râului
    gloss: Într-o după-amiază călduroasă, Mia a invitat-o pe Leila la o plimbare cu bicicleta pe malul râului de lângă apartamentul ei. Niciuna dintre ele nu avea bicicletă, așa că au mers împreună la un magazin de închirieri. Angajatul a întrebat ce mărime le trebuie, iar Leila a luat o bicicletă mică, în timp ce Mia a luat una mijlocie. Închirierea costa zece dolari pe oră, iar garanția era de douăzeci de dolari pentru ambele biciclete. Trebuiau să returneze bicicletele până la ora cinci. Plimbarea pe malul râului a fost frumoasă și au văzut oameni care își plimbau câinii și se bucurau de vremea însorită. Au returnat bicicletele exact la timp și și-au primit garanția înapoi. După aceea, i-au povestit lui Daniel despre plimbare, iar el a spus că vrea să li se alăture data viitoare.
    note: '*owned* este trecutul lui *own* („a deține”, „a avea”) – *Neither of them owned a bike* înseamnă „Niciuna dintre ele nu avea bicicletă”.'
