teaching:
  en.b1.unit19.lesson01.teach.main_point:
    title: main point
    gloss: punct principal, idee principală
    note: '*main point* înseamnă cea mai importantă idee dintr-un text sau dintr-o conversație.'
    example_gloss: Punctul principal al ședinței a fost bugetul.
  en.b1.unit19.lesson01.teach.detail:
    title: detail
    gloss: detaliu
    note: '*detail* înseamnă o informație suplimentară mică, care susține ideea principală.'
    example_gloss: Mia a adăugat un mic detaliu despre program.
  en.b1.unit19.lesson01.teach.in_summary:
    title: in summary
    gloss: în rezumat
    note: '*in summary* introduce, la sfârșitul unei explicații mai lungi, un rezumat scurt.'
    example_gloss: În rezumat, proiectul se va încheia luna viitoare.
  en.b1.unit19.lesson01.teach.in_short:
    title: in short
    gloss: pe scurt
    note: '*in short* este un mod rapid și informal de a ajunge la miez într-o conversație.'
    example_gloss: Pe scurt, echipa a căzut de acord asupra planului.
  en.b1.unit19.lesson01.teach.in_your_own_words:
    title: in your own words
    gloss: cu cuvintele tale
    note: '*in your own words* cere o explicație care nu repetă pur și simplu textul original.'
    example_gloss: Explică planul cu cuvintele tale.
  en.b1.unit19.lesson02.teach.in_summary_budget_client:
    title: In summary, ... (eine Zusammenfassung geben)
    gloss: În rezumat, în ședință s-a discutat despre buget și despre noul client.
    note: '*In summary, the meeting covered...* deschide un rezumat scurt al celor discutate.'
  en.b1.unit19.lesson02.teach.main_point_under_budget:
    title: The main point was that ... (den Hauptpunkt nennen)
    gloss: Ideea principală a fost că luna aceasta ne aflăm sub buget.
    note: '*The main point was that...* numește cea mai importantă idee, separat de detaliile mai mici.'
  en.b1.unit19.lesson02.teach.grammar_summary_structure:
    title: Der Aufbau einer Zusammenfassung
    gloss: Începe un rezumat cu o expresie precum In summary sau In short, apoi enumeră doar punctele principale, în ordine, în propoziții scurte. Folosește The main point was that... ca să evidențiezi singura idee cea mai importantă, separat de detaliile mai mici.
    note: 'Formă: începe cu In summary/In short și folosește The main point was that... pentru ideea principală.'
  en.b1.unit19.lesson03.teach.condensed:
    title: condensed
    gloss: condensat, scurtat
    note: '*condensed* descrie un rezumat care a fost făcut mai scurt, dar păstrează punctele principale.'
    example_gloss: Mia i-a dat lui Daniel un rezumat condensat al ședinței.
  en.b1.unit19.lesson03.teach.original_article:
    title: original article
    gloss: articolul original
    note: '*original article* înseamnă textul complet inițial, înainte de a fi rezumat.'
    example_gloss: Rezumatul Leilei se potrivea bine cu articolul original.
  en.b1.unit19.lesson03.teach.reading_passage:
    title: 'Lesetext: einen kurzen Artikel zusammenfassen'
    gloss: 'Leila a citit, pentru cursul ei de design, un articol lung despre comunicarea la locul de muncă. Articolul original avea multe exemple și informații de context, dar Leila avea nevoie doar de punctele principale. Cu cuvintele ei, a scris un rezumat condensat: comunicarea la locul de muncă funcționează cel mai bine când mesajele sunt clare și scurte și când oamenii pun întrebări în loc să ghicească. A lăsat deoparte majoritatea exemplelor, pentru că erau detalii, nu puncte principale. Profesorul ei a spus că rezumatul a păstrat ideile importante în ordinea corectă.'
    note: Un text scurt.
  en.b1.unit19.lesson04.teach.q_missed_meeting:
    title: Daniel bittet um eine Erklärung
    gloss: 'Daniel spune: Am pierdut ședința. Poți să-mi spui ce s-a întâmplat?'
    note: O întrebare deschisă prin care ceri un rezumat.
  en.b1.unit19.lesson04.teach.a_in_short_budget_client:
    title: Mia gibt eine kurze Zusammenfassung
    gloss: 'Mia spune: Sigur. Pe scurt, am vorbit despre buget și despre noul client.'
    note: '*in short* deschide un rezumat rapid, informal.'
  en.b1.unit19.lesson04.teach.q_main_point_budget:
    title: Daniel fragt nach dem Hauptpunkt
    gloss: 'Daniel spune: Care a fost ideea principală despre buget?'
    note: O întrebare precisă despre ideea principală.
  en.b1.unit19.lesson04.teach.a_under_budget_this_month:
    title: Mia nennt den Hauptpunkt
    gloss: 'Mia spune: Ideea principală a fost că luna aceasta ne aflăm sub buget.'
    note: '*the main point was that...* evidențiază cea mai importantă idee.'
  en.b1.unit19.lesson04.teach.q_other_details:
    title: Daniel fragt nach Details
    gloss: 'Daniel spune: Bine. Au mai fost și alte detalii?'
    note: O întrebare despre detaliile mai mici.
  en.b1.unit19.lesson04.teach.a_client_meeting_moved:
    title: Mia nennt ein kleines Detail
    gloss: 'Mia spune: Doar un mic detaliu: ședința cu clientul a fost mutată pe săptămâna viitoare.'
    note: '*just one small detail* introduce un fapt mărunt, suplimentar.'
  en.b1.unit19.lesson04.teach.q_thanks_for_summary:
    title: Daniel bedankt sich bei Mia
    gloss: 'Daniel spune: Mulțumesc pentru rezumat. Ne ajută foarte mult.'
    note: O încheiere scurtă și recunoscătoare a conversației.
