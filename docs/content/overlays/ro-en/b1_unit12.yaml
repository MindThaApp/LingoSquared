teaching:
  en.b1.unit12.lesson01.teach.although:
    title: although
    gloss: deși
    note: '*although* introduce un contrast în aceeași frază, printr-o propoziție completă.'
    example_gloss: Deși biroul este liniștit, Mia preferă să lucreze de acasă.
  en.b1.unit12.lesson01.teach.even_though:
    title: even though
    gloss: deși, chiar dacă
    note: '*even though* accentuează contrastul mai puternic decât *although*.'
    example_gloss: Leila rămâne concentrată, deși apartamentul ei este mic.
  en.b1.unit12.lesson01.teach.despite:
    title: despite
    gloss: în ciuda
    note: După *despite* urmează un substantiv sau o formă în -ing, nu o propoziție completă.
    example_gloss: În ciuda factorilor de distragere, Daniel își termină raportul la timp.
  en.b1.unit12.lesson01.teach.however:
    title: however
    gloss: totuși, cu toate acestea
    note: '*however* începe o frază nouă, după punct sau punct și virgulă.'
    example_gloss: Biroul este liniștit. Totuși, Mia preferă să lucreze de acasă.
  en.b1.unit12.lesson01.teach.valid_point:
    title: valid point
    gloss: argument întemeiat, observație justă
    note: '*valid point* înseamnă un argument rezonabil sau convingător.'
    example_gloss: Este o observație justă în privința concentrării.
  en.b1.unit12.lesson01.teach.convince:
    title: convince
    gloss: a convinge
    note: '*convince* înseamnă a face pe cineva să creadă sau să accepte ceva.'
    example_gloss: Leila a încercat s-o convingă pe Mia să se întoarcă la birou.
  en.b1.unit12.lesson02.teach.office_quiet_home:
    title: although + vollständiger Nebensatz
    gloss: Deși biroul este liniștit, Mia preferă să lucreze de acasă.
    note: '*although* + subiect + verb formează o propoziție completă de contrast.'
  en.b1.unit12.lesson02.teach.distractions_report:
    title: despite + Nomen
    gloss: În ciuda factorilor de distragere, Daniel își termină raportul la timp.
    note: După *despite* urmează un substantiv, nu o propoziție completă.
  en.b1.unit12.lesson02.teach.grammar_concession:
    title: although, despite und however
    gloss: 'Although și even though încep o propoziție completă: Although the office is quiet, Mia prefers home. Despite este urmat de un substantiv sau de o formă în -ing, nu de o propoziție: Despite the distractions, Daniel finishes his report. However începe o frază nouă, după punct sau punct și virgulă: The office is quiet. However, Mia prefers home.'
    note: 'Formă: *although/even though* + propoziție; *despite* + substantiv/formă în -ing; *however* ca adverb de legătură după un punct.'
  en.b1.unit12.lesson03.teach.flexibility:
    title: flexibility
    gloss: flexibilitate
    note: '*flexibility* înseamnă capacitatea de a-ți schimba ușor planurile sau modul de lucru.'
    example_gloss: Mia și Leila sunt amândouă de acord că flexibilitatea este importantă.
  en.b1.unit12.lesson03.teach.teamwork:
    title: teamwork
    gloss: muncă în echipă
    note: '*teamwork* înseamnă a lucra împreună, ca o echipă.'
    example_gloss: Leila crede că biroul favorizează o mai bună colaborare în echipă.
  en.b1.unit12.lesson03.teach.reading_passage:
    title: 'Lesetext: wo man arbeitet'
    gloss: Mia și Leila au păreri diferite despre locul unde să lucreze. Mia lucrează de acasă pentru că e confortabil. Deși îi lipsește să-și vadă colegii, face mai multe lucruri acasă. Leila preferă biroul. În ciuda zgomotului, îi place să vorbească cu colegii în pauze. Chiar dacă Mia are dreptate în privința concentrării, Leila crede în continuare că biroul favorizează o mai bună colaborare în echipă. Totuși, amândouă sunt de acord că flexibilitatea este importantă.
    note: Un text scurt despre contraste.
  en.b1.unit12.lesson04.teach.q_although_nice_home:
    title: Mia führt den Gegensatz ein
    gloss: 'Mia spune: Leila, deși biroul e frumos, eu fac mai multe lucruri acasă.'
    note: '*although* + propoziție completă la începutul frazei.'
  en.b1.unit12.lesson04.teach.a_despite_noise_breaks:
    title: Leila nennt ihre Sicht
    gloss: 'Leila spune: Înțeleg, dar în ciuda zgomotului, chiar îmi place să vorbesc cu oamenii în pauze.'
    note: '*despite* + substantiv (*the noise*).'
  en.b1.unit12.lesson04.teach.q_valid_point_however:
    title: Mia erkennt den Punkt an, bleibt aber bei ihrer Meinung
    gloss: 'Mia spune: Ai dreptate. Totuși, tot cred că mă concentrez mai bine singură.'
    note: '*however* începe aici o frază nouă, după punct.'
  en.b1.unit12.lesson04.teach.a_even_though_convince:
    title: Leila zieht Mia auf
    gloss: 'Leila spune: Chiar dacă prefer biroul, nu pot să te conving să-ți schimbi părerea, nu-i așa?'
    note: '*even though* accentuează contrastul.'
  en.b1.unit12.lesson04.teach.q_however_flexibility:
    title: Mia findet einen Kompromiss
    gloss: 'Mia spune: Probabil că nu! Totuși, putem fi de acord că flexibilitatea contează cel mai mult.'
    note: '*however* leagă două idei opuse printr-o frază nouă.'
  en.b1.unit12.lesson04.teach.a_despite_preferences_time:
    title: Leila beendet das Gespräch positiv
    gloss: 'Leila spune: În ciuda preferințelor noastre diferite, terminăm tot la timp.'
    note: '*despite* + substantiv (*our different preferences*).'
