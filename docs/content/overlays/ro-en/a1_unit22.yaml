teaching:
  en.a1.unit22.lesson01.teach.headache:
    title: headache
    gloss: durere de cap
    note: '*headache* înseamnă durere de cap. În română spui „Mă doare capul”, cu verbul „a durea”; în engleză spui *I have a headache*, adică „am o durere de cap”, cu *a* înainte.'
    example_gloss: Mă doare capul.
  en.a1.unit22.lesson01.teach.stomachache:
    title: stomachache
    gloss: durere de burtă
    note: '*stomachache* înseamnă durere de burtă sau de stomac. Și aici se folosește singularul cu articol (*a stomachache*).'
    example_gloss: Mă doare burta.
  en.a1.unit22.lesson01.teach.fever:
    title: fever
    gloss: febră
    note: '*fever* înseamnă febră. Spui *have a fever*, nu *have fever*.'
    example_gloss: Cred că am febră.
  en.a1.unit22.lesson01.teach.cough:
    title: cough
    gloss: tuse
    note: '*cough* înseamnă tuse. Cuvântul este substantiv și verb: *a cough* (tusea), *to cough* (a tuși).'
    example_gloss: Daniel are o tuse puternică.
  en.a1.unit22.lesson01.teach.sore_throat:
    title: sore throat
    gloss: durere în gât
    note: '*sore throat* înseamnă durere în gât. *sore* înseamnă „dureros, iritat”; și aici există articol: *a sore throat*.'
    example_gloss: Mă doare gâtul.
  en.a1.unit22.lesson02.teach.whats_wrong:
    title: What's wrong?
    gloss: Ce s-a întâmplat?
    note: Cu *What's wrong?* întrebi despre o problemă. *What's* este forma scurtă de la *What is*.
  en.a1.unit22.lesson02.teach.i_have_a_headache:
    title: I have a headache.
    gloss: Mă doare capul.
    note: Cu *I have a...* spui ce suferință ai. Literal înseamnă „am o ...”; în română folosim de obicei „mă doare ...”, deci construcția este diferită.
  en.a1.unit22.lesson02.teach.i_feel_hot:
    title: I feel hot.
    gloss: Mi-e cald.
    note: Cu *I feel...* spui cum te simți fizic. *I feel hot* înseamnă literal „mă simt fierbinte”, dar sensul este „mi-e cald”. În engleză subiectul este *I*, nu „mie” ca în română.
  en.a1.unit22.lesson03.teach.rest:
    title: rest
    gloss: a se odihni
    note: '*rest* înseamnă a se odihni.'
    example_gloss: Trebuie să mă odihnesc.
  en.a1.unit22.lesson03.teach.symptom_text:
    title: Text despre simptome
    gloss: Mă doare capul și gâtul. Cred că am și febră. Trebuie să mă odihnesc.
    note: În acest text scurt, cineva descrie mai multe suferințe deodată.
  en.a1.unit22.lesson04.teach.see_a_doctor:
    title: You should see a doctor.
    gloss: Ar trebui să mergi la medic.
    note: 'Cu *You should...* dai un sfat simplu: „ar trebui să ...”. După *should* verbul urmează fără *to*.'
  en.a1.unit22.lesson04.teach.q_dont_look_well:
    title: Întrebare despre starea cuiva
    gloss: 'Leila spune: Nu arăți bine. Ce s-a întâmplat?'
    note: '*You don''t look well* înseamnă: Nu arăți bine.'
  en.a1.unit22.lesson04.teach.a_headache_sore_throat:
    title: Răspunsul lui Daniel
    gloss: 'Daniel spune: Mă doare capul și gâtul.'
    note: Daniel menționează două suferințe împreună.
  en.a1.unit22.lesson04.teach.q_do_you_have_fever:
    title: Întrebare despre febră
    gloss: 'Leila întreabă: Ai febră?'
    note: Cu *Do you have a fever?* întrebi despre o suferință anume.
  en.a1.unit22.lesson04.teach.a_not_sure_feel_hot:
    title: Răspunsul lui Daniel
    gloss: 'Daniel spune: Nu sunt sigur, dar mi-e cald.'
    note: Daniel nu este sigur, dar spune cum se simte.
  en.a1.unit22.lesson04.teach.a_rest_water_doctor:
    title: Sfatul Leilei
    gloss: 'Leila spune: Ar trebui să te odihnești și să bei apă. Dacă nu se îmbunătățește, ar trebui să mergi la medic.'
    note: Leila dă mai întâi un sfat simplu și apoi spune când ar trebui să meargă Daniel la medic.
  en.a1.unit22.lesson04.teach.a_okay_rest_today:
    title: Ultimul răspuns al lui Daniel
    gloss: 'Daniel spune: Bine, mulțumesc. Mă odihnesc azi.'
    note: Daniel acceptă sfatul și spune ce va face azi.
