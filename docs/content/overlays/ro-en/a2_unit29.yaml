    title: plumber
    gloss: instalatorul
    note: '*plumber* înseamnă persoana care repară problemele de la conductele de apă.'
    example_gloss: Administratorul a trimis un instalator să repare.
  en.a2.unit29.lesson01.teach.repair:
    title: repair
    gloss: reparația
    note: '*repair* înseamnă să pui din nou în ordine ceva stricat.'
    example_gloss: Reparația va avea loc mâine după-amiază.
  en.a2.unit29.lesson01.teach.reused_home_words:
    title: Cuvinte despre locuință
    gloss: bucătărie, apartament, baie
    note: Aceste cuvinte le știi deja din unitatea 24; aici le repetăm.
    example_gloss:
    - Scurgerea este în bucătărie.
    - Apartamentul meu are două dormitoare.
    - Baia este chiar lângă bucătărie.
  en.a2.unit29.lesson02.teach.report_problem:
    title: Anunțarea unei probleme
    gloss: Aș dori să semnalez o problemă la chiuveta din bucătărie.
    note: Cu *I'd like to report...* semnalezi politicos o problemă.
  en.a2.unit29.lesson02.teach.leaking_since_morning:
    title: Explicarea de cât timp există problema
    gloss: Curge de azi-dimineață.
    note: 'Pentru ceva care durează de o vreme, engleza folosește *It''s been leaking since...*, ca la *I''ve had ... for* în unitatea 28. În română este suficient prezentul: Curge de azi-dimineață.'
  en.a2.unit29.lesson02.teach.ask_repair_timing:
    title: Întrebarea când se face reparația
    gloss: Când poate veni cineva să o repare?
    note: Cu *When can someone come to fix it?* întrebi politicos când se poate face reparația.
  en.a2.unit29.lesson03.teach.between_2_4:
    title: between 2pm and 4pm
    gloss: între 14:00 și 16:00
    note: '*between 2pm and 4pm* înseamnă între 14:00 și 16:00. În engleză ora se scrie cu *pm*, nu în sistemul de 24 de ore.'
    example_gloss: Instalatorul vine între 14:00 și 16:00.
  en.a2.unit29.lesson03.teach.confirmation_text:
    title: Textul anunțului despre reparație
    gloss: Sesizarea dumneavoastră privind chiuveta defectă din bucătărie a fost primită. Mâine, între 14:00 și 16:00, va veni un instalator. Numărul reparației este 6180.
    note: 'O confirmare oficială: sesizarea a fost primită, la care se adaugă o oră și un număr.'
  en.a2.unit29.lesson04.teach.q_report_problem:
    title: Anunțarea problemei către îngrijitor
    gloss: 'Daniel spune: Aș dori să semnalez o problemă la chiuveta din bucătărie.'
    note: Aceeași propoziție ca în lecția 2.
  en.a2.unit29.lesson04.teach.q_whats_wrong_sink:
    title: Întrebarea despre problema cu chiuveta
    gloss: 'Administratorul întreabă: Ce are chiuveta?'
    note: Aceeași formă de întrebare pe care a folosit-o medicul în unitatea 28 (*What's wrong?*), dar acum pentru chiuvetă, nu pentru sănătate.
  en.a2.unit29.lesson04.teach.a_leaking_since_morning_and_ask_timing:
    title: Răspunsul lui Daniel despre durată și întrebarea despre data reparației
    gloss: 'Daniel spune: Curge de azi-dimineață. Când poate veni cineva să o repare?'
    note: Cele două propoziții din lecția 2, acum una după alta.
  en.a2.unit29.lesson04.teach.a_send_plumber:
    title: Răspunsul îngrijitorului despre instalator
    gloss: 'Administratorul spune: Înțeleg. Trimit mâine un instalator, între 14:00 și 16:00.'
    note: Administratorul spune când va fi reparația, după ce a aflat problema.
  en.a2.unit29.lesson04.teach.q_need_to_be_home:
    title: Întrebarea dacă trebuie să fii acasă
    gloss: 'Daniel întreabă: Trebuie să fiu acasă?'
    note: Daniel întreabă asta după ce a aflat când are loc reparația.
  en.a2.unit29.lesson04.teach.a_confirm_window_number:
    title: Ultima confirmare a îngrijitorului
    gloss: 'Administratorul spune: Da, vă rog să fiți acasă între 14:00 și 16:00. Aici aveți numărul reparației: 6180.'
    note: Administratorul spune ora exactă și numărul reparației.
  en.a2.unit29.lesson04.teach.a_thank_you:
    title: Mulțumirea de încheiere
    gloss: 'Daniel spune: Vă mulțumesc foarte mult.'
    note: '*Thank you very much* este o formă politicoasă și oficială de a mulțumi, ca la sfârșitul conversației din unitatea 25.'
