course:
  title: Engleză A2
  description: Învață engleza la nivel A2 pentru situații de zi cu zi ceva mai formale, cu explicații detaliate în română.
units:
  en.a2.unit37.video_calls:
    title: Despre apelurile video
lessons:
  en.a2.unit37.lesson01.video_call_vocabulary:
    title: Cameră, microfon și conexiune
  en.a2.unit37.lesson02.describing_your_video_calls:
    title: Povestește despre apelurile tale video și spune ce preferi
  en.a2.unit37.lesson03.reading_about_video_calls:
    title: Citim cum folosește altcineva apelurile video
  en.a2.unit37.lesson04.video_calls_dialogue:
    title: Vorbim cu un prieten despre apelurile video
teaching:
  en.a2.unit37.lesson01.teach.video_call:
    title: video call
    gloss: apel video
    note: '*video call* este o conversație în care vă și vedeți. În română se spune și „videoconferință”.'
    example_gloss: Am în fiecare luni un apel video cu echipa mea.
  en.a2.unit37.lesson01.teach.camera:
    title: camera
    gloss: cameră
    note: '*camera* este aparatul care transmite imaginea ta.'
    example_gloss: Te rog să-ți pornești camera înainte să înceapă ședința.
  en.a2.unit37.lesson01.teach.microphone:
    title: microphone
    gloss: microfon
    note: '*microphone* este aparatul care transmite vocea ta.'
    example_gloss: Microfonul meu era oprit, de aceea ceilalți nu m-au auzit.
  en.a2.unit37.lesson01.teach.connection:
    title: connection
    gloss: conexiune
    note: '*connection* este legătura dintre calculatorul tău și internet.'
    example_gloss: Conexiunea era slabă, de aceea imaginea s-a blocat.
  en.a2.unit37.lesson01.teach.mute:
    title: mute
    gloss: a dezactiva sunetul
    note: '*mute* înseamnă a-ți opri sunetul, ca ceilalți să nu te audă.'
    example_gloss: Îmi dezactivez microfonul când nu vorbesc.
  en.a2.unit37.lesson01.teach.face_to_face:
    title: face to face
    gloss: față în față
    note: '*face to face* înseamnă că sunteți în aceeași cameră și nu vorbiți printr-un ecran.'
    example_gloss: Unele ședințe sunt mai bune față în față decât online.
  en.a2.unit37.lesson01.teach.grammar_comparison:
    title: Comparații cu faster than și less ... than
    gloss: Un apel video este mai rapid decât o vizită. Un apel video este mai puțin personal decât o întâlnire față în față.
    note: La adjectivele scurte adaugi *-er* și pui *than* după ele (*faster than*). La adjectivele mai lungi folosești *less ... than* sau *more ... than*.
  en.a2.unit37.lesson02.teach.video_call_every_monday:
    title: Cum spui cât de des ai apeluri video
    gloss: Am în fiecare luni un apel video cu echipa mea.
    note: '*every Monday* înseamnă „în fiecare luni” și descrie un obicei fix.'
  en.a2.unit37.lesson02.teach.turn_on_your_camera:
    title: Cum ceri cuiva să pornească camera
    gloss: Poți să-ți pornești camera?
    note: '*turn on* înseamnă a porni; opusul este *turn off* (a opri).'
  en.a2.unit37.lesson02.teach.you_were_on_mute:
    title: Cum spui că cineva a fost pe mut
    gloss: Scuze, aveai microfonul dezactivat.
    note: '*you were on mute* este expresia fixă pe care o spui când cineva nu s-a auzit pentru că avea microfonul dezactivat.'
  en.a2.unit37.lesson02.teach.useful_but_prefer_face_to_face:
    title: Exprimarea opiniei împreună cu o preferință
    gloss: Cred că apelurile video sunt utile, dar prefer să întâlnesc oamenii față în față.
    note: Cu *I think ... but I prefer ...* spui mai întâi părerea ta, apoi ce preferi.
  en.a2.unit37.lesson02.teach.grammar_prefer:
    title: prefer X to Y
    gloss: Prefer apelurile video apelurilor telefonice. Prefer întâlnirile față în față apelurilor video.
    note: 'Atenție: după *prefer* urmează *to*, nu *than*: *I prefer video calls to phone calls*.'
  en.a2.unit37.lesson03.teach.headphones:
    title: headphones
    gloss: căști
    note: '*headphones* este în engleză mereu la plural, chiar dacă folosești o singură pereche.'
    example_gloss: Folosesc căști ca familia mea să nu audă ședința.
  en.a2.unit37.lesson03.teach.leilas_message:
    title: Mesajul lui Leila
    gloss: Cursurile mele online sunt acum toate apeluri video. Îmi pornesc camera, dar îmi țin microfonul dezactivat până când profesoara pune o întrebare. Folosesc căști, pentru că am o conexiune mai bună cu ele. Cred că apelurile video economisesc mult timp, dar tot prefer să-mi întâlnesc colegii față în față.
    note: Un mesaj relaxat de la Leila despre propriile ei cursuri online.
  en.a2.unit37.lesson03.teach.mute_until_question:
    title: Cum spui când îți pui microfonul pe mut
    gloss: Îmi țin microfonul dezactivat până când profesoara pune o întrebare.
    note: '*until* înseamnă „până când”: ceva durează până la un anumit moment.'
  en.a2.unit37.lesson04.teach.q_lot_of_video_calls:
    title: Leila întreabă despre munca lui Daniel
    gloss: 'Leila întreabă: Ai multe apeluri video la serviciu?'
    note: '*a lot of* înseamnă „mult/multe” și se potrivește atât cu cuvinte numărabile, cât și cu cele nenumărabile.'
  en.a2.unit37.lesson04.teach.a_call_every_monday:
    title: Daniel povestește despre programarea lui fixă
    gloss: 'Daniel spune: Da, am în fiecare luni un apel video cu echipa mea.'
    note: Aceeași propoziție ca în lecția 2.
  en.a2.unit37.lesson04.teach.q_turn_on_camera:
    title: Leila întreabă despre cameră
    gloss: 'Leila întreabă: Îți pornești camera?'
    note: O întrebare scurtă pentru a afla mai multe.
  en.a2.unit37.lesson04.teach.a_always_but_mute:
    title: Obiceiul lui Daniel în apelul video
    gloss: 'Daniel spune: Întotdeauna, dar îmi dezactivez microfonul când nu vorbesc.'
    note: '*when I am not speaking* înseamnă aici: în momentele în care nu vorbesc.'
  en.a2.unit37.lesson04.teach.q_classes_are_video_calls:
    title: Leila povestește despre cursurile ei
    gloss: 'Leila spune: Cursurile mele online sunt acum toate apeluri video.'
    note: Se leagă de cursurile ei de luni și miercuri din unitatea 33.
  en.a2.unit37.lesson04.teach.a_what_do_you_think:
    title: Daniel îi cere părerea
    gloss: 'Daniel întreabă: Ce crezi despre ele?'
    note: '*What do you think about them?* întreabă părerea ta despre ceva ce tocmai a fost menționat.'
  en.a2.unit37.lesson04.teach.q_useful_but_prefer:
    title: Leila își spune părerea
    gloss: 'Leila spune: Cred că apelurile video sunt utile, dar prefer să întâlnesc oamenii față în față.'
    note: Aceeași părere ca în lecția 2.
  en.a2.unit37.lesson04.teach.a_agree_faster_less_personal:
    title: Daniel e de acord cu ea
    gloss: 'Daniel spune: Sunt de acord. Un apel video este mai rapid decât o vizită, dar este mai puțin personal.'
    note: Cu *I agree* exprimi acordul. După aceea se dă de obicei propriul motiv.
  en.a2.unit37.lesson04.teach.q_exactly:
    title: Leila confirmă
    gloss: 'Leila spune: Exact.'
    note: '*Exactly* este un mod scurt de a spune că ești complet de acord.'
