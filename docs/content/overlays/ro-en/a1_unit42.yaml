teaching:
  en.a1.unit42.lesson01.teach.friendly:
    title: friendly
    gloss: prietenos
    note: '*friendly* înseamnă prietenos și ușor de abordat.'
    example_gloss: Vecinul meu este foarte prietenos.
  en.a1.unit42.lesson01.teach.funny:
    title: funny
    gloss: amuzant
    note: '*funny* înseamnă amuzant: cineva care îi face pe ceilalți să râdă.'
    example_gloss: Fratele meu este foarte amuzant.
  en.a1.unit42.lesson01.teach.hardworking:
    title: hardworking
    gloss: muncitor / harnic
    note: '*hardworking* înseamnă muncitor, harnic: cineva care nu renunță ușor.'
    example_gloss: Ea este o angajată harnică.
  en.a1.unit42.lesson01.teach.shy:
    title: shy
    gloss: timid
    note: '*shy* înseamnă timid sau emotiv în fața unor oameni noi.'
    example_gloss: La început, el este puțin timid.
  en.a1.unit42.lesson01.teach.calm:
    title: calm
    gloss: calm / liniștit
    note: '*calm* înseamnă calm: cineva care nu se supără și nu se agită ușor.'
    example_gloss: Mama mea este foarte calmă.
  en.a1.unit42.lesson01.teach.talkative:
    title: talkative
    gloss: vorbăreț
    note: '*talkative* înseamnă vorbăreț: cineva care vorbește mult.'
    example_gloss: Sora mea este foarte vorbăreață.
  en.a1.unit42.lesson02.teach.a_little_shy:
    title: a little shy
    gloss: puțin timid
    note: '*a little* înseamnă aici „puțin”, ca grad, nu „mic”, ca mărime. În română, pur și simplu spunem „puțin timid”.'
    example_gloss: La început, el este puțin timid, dar se deschide repede.
  en.a1.unit42.lesson02.teach.very_hardworking:
    title: very hardworking
    gloss: foarte muncitor
    note: '*very hardworking* înseamnă foarte muncitor.'
    example_gloss: Colegul meu este foarte muncitor.
  en.a1.unit42.lesson02.teach.have_a_great_sense_of_humor:
    title: have a great sense of humor
    gloss: a avea un simț al umorului excelent
    note: '*have a great sense of humor* înseamnă a avea un simț al umorului excelent.'
    example_gloss: Daniel are un simț al umorului excelent.
  en.a1.unit42.lesson02.teach.get_along_with_everyone:
    title: get along with everyone
    gloss: a se înțelege bine cu toată lumea
    note: '*get along with everyone* înseamnă a se înțelege bine cu toată lumea.'
    example_gloss: La serviciu, Mia se înțelege bine cu toată lumea.
  en.a1.unit42.lesson02.teach.warm_up_quickly:
    title: warm up quickly
    gloss: a se deschide repede
    note: '*warm up quickly* înseamnă a se simți repede în largul tău printre oameni noi.'
    example_gloss: El este timid, dar se deschide repede când te cunoaște.
  en.a1.unit42.lesson02.teach.whats_he_like_question:
    title: What's he like?
    gloss: Cum este el?
    note: '*What''s he like?* întreabă despre caracterul cuiva, nu despre înfățișarea lui.'
  en.a1.unit42.lesson03.teach.dialogue_line1:
    title: Întrebarea Miei
    gloss: 'Mia întreabă: Săptămâna viitoare încep un proiect nou cu Daniel. Cum este el?'
    note: '*What''s he like?* întreabă despre caracterul cuiva.'
  en.a1.unit42.lesson03.teach.dialogue_line2:
    title: "Răspunsul Leilei"
    gloss: 'Leila spune: Este foarte prietenos și, în plus, chiar amuzant.'
    note: '*and he''s really funny too* înseamnă: și, în plus, este chiar amuzant.'
  en.a1.unit42.lesson03.teach.dialogue_line3:
    title: Întrebarea Miei
    gloss: 'Mia spune: Mă bucur să aud! Este ușor să lucrezi cu el?'
    note: '*Is he easy to work with?* întreabă dacă este plăcut să lucrezi cu cineva.'
  en.a1.unit42.lesson03.teach.dialogue_line4:
    title: "Răspunsul Leilei"
    gloss: 'Leila spune: Da, este și foarte muncitor. Își termină mereu sarcinile la timp.'
    note: '*finishes his tasks on time* înseamnă: își termină sarcinile la timp.'
  en.a1.unit42.lesson03.teach.dialogue_line5:
    title: Întrebarea Miei
    gloss: 'Mia întreabă: Se întâmplă să fie timid la ședințe?'
    note: Aici, *ever* înseamnă „vreodată, cumva”.
  en.a1.unit42.lesson03.teach.dialogue_line6:
    title: "Răspunsul Leilei"
    gloss: 'Leila spune: Puțin, dar se simte tot mai în largul lui după ce te cunoaște.'
    note: '*once he knows you* înseamnă: după ce te cunoaște.'
  en.a1.unit42.lesson03.teach.dialogue_line7:
    title: Mulțumirea Miei
    gloss: 'Mia spune: Mulțumesc, Leila. Acum mă simt mult mai liniștită în privința proiectului.'
    note: '*I feel more relaxed* înseamnă: mă simt mai liniștită, mai relaxată.'
  en.a1.unit42.lesson04.teach.reading_passage:
    title: Text despre trei personalități
    gloss: 'Daniel, Leila și Mia sunt prieteni apropiați, dar au personalități foarte diferite. Daniel este prietenos și amuzant: își face mereu prietenii să râdă. Este puțin timid când cunoaște oameni noi, dar se deschide repede. Leila este calmă și creativă. Îi place să picteze pentru că o ajută să se relaxeze și rareori se supără din ceva. Mia este extrovertită și organizată. Îi place să facă planuri pentru grup și este foarte răbdătoare când își învață prietenii ceva nou: l-a învățat pe Daniel să gătească. Chiar dacă sunt diferiți, se înțeleg bine și se bucură de timpul petrecut împreună.'
    note: '*even though* înseamnă: chiar dacă, deși.'
