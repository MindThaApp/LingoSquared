teaching:
  en.a1.unit46.lesson01.teach.lost:
    title: lost
    gloss: pierdut
    note: '*lost* înseamnă aici „pierdut”. Este forma de trecut a verbului *lose* („a pierde”): *I lost* înseamnă „am pierdut”.'
    example_gloss: Mi-am pierdut portofelul.
  en.a1.unit46.lesson01.teach.found:
    title: found
    gloss: găsit
    note: '*found* este trecutul și participiul verbului *find*: *I found your keys* înseamnă „Ți-am găsit cheile” / „Am găsit cheile tale”.'
    example_gloss: Ți-am găsit cheile!
  en.a1.unit46.lesson01.teach.keys:
    title: keys
    gloss: chei
    note: '*keys* înseamnă chei.'
    example_gloss: Acestea sunt cheile mele.
  en.a1.unit46.lesson01.teach.wallet:
    title: wallet
    gloss: portofel
    note: '*wallet* înseamnă portofel.'
    example_gloss: Acesta este portofelul tău?
  en.a1.unit46.lesson01.teach.backpack:
    title: backpack
    gloss: rucsac
    note: '*backpack* înseamnă rucsac.'
    example_gloss: Rucsacul meu este negru.
  en.a1.unit46.lesson02.teach.i_lost_my_wallet:
    title: I lost my wallet.
    gloss: Mi-am pierdut portofelul.
    note: 'Engleza folosește trecutul simplu: *I lost my wallet.* În română se spune „Mi-am pierdut portofelul” sau „Am pierdut portofelul”; ambele variante sunt firești.'
  en.a1.unit46.lesson02.teach.have_you_seen_my_keys:
    title: Have you seen my keys?
    gloss: Mi-ai văzut cheile?
    note: '*Have you seen ...?* înseamnă „Ai văzut ...?” -- *have* este verbul auxiliar și vine înaintea subiectului în întrebare.'
  en.a1.unit46.lesson02.teach.has_anyone_found_a_backpack:
    title: Has anyone found a backpack?
    gloss: A găsit cineva un rucsac?
    note: '*Has anyone found ...?* înseamnă „A găsit cineva ...?”'
  en.a1.unit46.lesson02.teach.its_black_with_a_red_strap:
    title: It's black with a red strap.
    gloss: Este negru, cu o curea roșie.
    note: '*It''s black with a red strap.* înseamnă „Este negru, cu o curea roșie.”'
  en.a1.unit46.lesson02.teach.wheres_the_lost_and_found:
    title: Where's the lost and found?
    gloss: Unde este biroul de obiecte pierdute?
    note: '*the lost and found* este denumirea fixă din engleză pentru biroul de obiecte pierdute, literal „pierdutul și găsitul”.'
  en.a1.unit46.lesson02.teach.yes_we_found_it:
    title: Yes, we found it!
    gloss: Da, l-am găsit!
    note: '*Yes, we found it!* înseamnă „Da, l-am găsit!”'
  en.a1.unit46.lesson03.teach.dialogue_line1:
    title: Întrebarea lui Daniel
    gloss: 'Daniel întreabă: Mia, unde îți este rucsacul? Îl aveai lângă fântână.'
    note: '*had* este trecutul verbului *have* („a avea”): „aveai”.'
  en.a1.unit46.lesson03.teach.dialogue_line2:
    title: Spaima Miei
    gloss: 'Mia spune: O, nu, ai dreptate! Nu-l am. Aparatul meu foto este în el!'
    note: '*My camera is inside!* înseamnă „Aparatul meu foto este înăuntru!”'
  en.a1.unit46.lesson03.teach.dialogue_line3:
    title: Propunerea lui Daniel
    gloss: 'Daniel spune: Nu-ți face griji, hai să sunăm la biroul parcului și să întrebăm.'
    note: '*Don''t worry* înseamnă „Nu-ți face griji”.'
  en.a1.unit46.lesson03.teach.dialogue_line4:
    title: Daniel sună
    gloss: 'Daniel spune: Bună ziua, am pierdut un rucsac negru lângă fântână. L-a găsit cineva?'
    note: '*we lost a black backpack* înseamnă „am pierdut un rucsac negru” -- engleza folosește aici trecutul simplu *lost*.'
  en.a1.unit46.lesson03.teach.dialogue_line5:
    title: Întrebarea Miei
    gloss: 'Mia spune: Ce au spus?'
    note: '*did they say* folosește *did* ca verb auxiliar la trecut.'
  en.a1.unit46.lesson03.teach.dialogue_line6:
    title: Vestea bună a lui Daniel
    gloss: 'Daniel spune: L-au găsit! Este negru, cu o curea galbenă, nu-i așa? Îl păstrează la recepție.'
    note: '*right?* la sfârșitul propoziției este o întrebare scurtă de confirmare, ca „nu-i așa?” în română.'
  en.a1.unit46.lesson03.teach.dialogue_line7:
    title: Ușurarea Miei
    gloss: 'Mia spune: Da, este chiar el! Hai să mergem să-l luăm chiar acum. Slavă Domnului.'
    note: '*Let''s go get it* înseamnă „Hai să mergem să-l luăm”, cu două verbe unul după altul, fără *to*.'
  en.a1.unit46.lesson04.teach.reading_passage:
    title: Text despre biroul de obiecte pierdute
    gloss: 'Biroul de obiecte pierdute: Dacă pierzi un obiect în parc, gândește-te mai întâi unde l-ai avut ultima dată. Apoi mergi la biroul parcului de lângă poarta principală și descrie obiectul -- spune culoarea și orice detalii speciale. Dă-ți numele și numărul de telefon, ca personalul să te poată suna dacă îl găsește mai târziu. După ce Mia și-a pierdut rucsacul lângă fântână, ea și Daniel au sunat imediat la biroul parcului. Personalul îl găsise deja și îl păstra la recepție. Mia a fost foarte ușurată că și-a primit aparatul foto înapoi în siguranță. Mai târziu, i-a povestit Leilei toată întâmplarea, iar Leila a spus că o va ajuta pe Mia să fie mai atentă la lucrurile ei data viitoare.'
    note: '*keep better track of your things* înseamnă „a fi mai atent la lucrurile tale”.'
