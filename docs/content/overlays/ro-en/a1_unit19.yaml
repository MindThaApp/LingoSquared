    note: '*hate* este opusul lui *love*.'
    example_gloss: Urăsc să întârzii.
  en.a1.unit19.lesson02.teach.do_you_like_or:
    title: Do you like coffee or tea?
    gloss: Îți place cafeaua sau ceaiul?
    note: Această propoziție o folosești ca să întrebi pe cineva să aleagă între două variante.
  en.a1.unit19.lesson02.teach.i_prefer_tea:
    title: I prefer tea.
    gloss: Prefer ceaiul.
    note: Cu *I prefer...* spui ce preferi.
  en.a1.unit19.lesson02.teach.because_reason:
    title: I like tea because it's milder.
    gloss: Îmi place ceaiul pentru că e mai blând.
    note: Cu *because* dai motivul unei preferințe.
  en.a1.unit19.lesson03.teach.very_much:
    title: very much
    gloss: foarte mult
    note: '*very much* înseamnă foarte mult.'
