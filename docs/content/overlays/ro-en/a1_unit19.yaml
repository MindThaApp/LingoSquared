    title: Text despre preferințe
    gloss: Îmi place ceaiul, dar nu-mi place cafeaua. Prefer ceaiul pentru că e mai blând.
    note: În acest text scurt, cineva spune ce îi place și de ce.
  en.a1.unit19.lesson04.teach.too_strong:
    title: It's too strong.
    gloss: E prea tare.
    note: '*too strong* înseamnă prea tare, prea puternic.'
