  en.a1.unit19.lesson04.teach.a_prefer_tea_not_much:
    title: "Răspunsul lui Daniel"
    gloss: 'Daniel spune: Prefer ceaiul. Nu prea îmi place cafeaua.'
    note: Daniel spune ce preferă și apoi adaugă un detaliu.
  en.a1.unit19.lesson04.teach.q_why_not:
    title: Why not?
    gloss: De ce nu?
    note: Cu *Why not?* întrebi de ce cuiva nu-i place ceva.
  en.a1.unit19.lesson04.teach.a_too_strong_calmer:
    title: Răspunsul complet al lui Daniel
    gloss: 'Daniel spune: Cred că e prea tare. Îmi place ceaiul pentru că e mai blând.'
    note: Daniel spune de ce nu-i place cafeaua și de ce preferă ceaiul.
  en.a1.unit19.lesson04.teach.he_prefers_thinks:
    title: He prefers tea. He thinks it's too strong.
    gloss: El preferă ceaiul. Crede că e prea tare.
    note: '*prefers* și *thinks* sunt forme de persoana a treia singular (*he*/*she*), cu un *-s* la sfârșit.'
