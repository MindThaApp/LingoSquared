    gloss: Poftiți cheia dumneavoastră.
    note: '*Here''s* este forma scurtă de la *here is*.'
  en.a1.unit50.lesson03.teach.dialogue_line1:
    title: Mia la recepție
    gloss: 'Mia spune: Bună ziua, avem o rezervare pentru două nopți.'
    note: '*we have a reservation* înseamnă „avem o rezervare”.'
  en.a1.unit50.lesson03.teach.dialogue_line2:
    title: Recepționerul îi întâmpină
    gloss: 'Recepționerul spune: Bun venit! Pe ce nume este rezervarea?'
    note: '*What''s the name on the reservation?* înseamnă „Pe ce nume este rezervarea?”'
  en.a1.unit50.lesson03.teach.dialogue_line3:
    title: "Răspunsul lui Leila"
    gloss: 'Leila spune: Este pe numele meu, Leila.'
    note: '*it''s under my name* înseamnă „este pe numele meu”; în engleză se folosește prepoziția *under* („sub”), nu „pe”.'
  en.a1.unit50.lesson03.teach.dialogue_line4:
    title: Recepționerul dă cheia
    gloss: 'Recepționerul spune: Perfect. Poftiți cheia. Camera dumneavoastră are două paturi.'
    note: '*Your room has two beds.* înseamnă „Camera dumneavoastră are două paturi.”'
  en.a1.unit50.lesson03.teach.dialogue_line5:
    title: Întrebarea Miei despre wifi
    gloss: 'Mia întreabă: Camera are wifi?'
    note: Repetarea întrebării învățate mai devreme.
  en.a1.unit50.lesson03.teach.dialogue_line6:
    title: Recepționerul despre micul dejun
    gloss: 'Recepționerul spune: Da, iar micul dejun se servește jos, de la șapte la zece.'
    note: '*from seven to ten* înseamnă „de la șapte la zece”.'
  en.a1.unit50.lesson03.teach.dialogue_line7:
    title: Întrebarea Leilei despre eliberarea camerei
    gloss: 'Leila spune: Mulțumesc! La ce oră se eliberează camera?'
    note: Repetarea întrebării *What time is check-out?*, învățată mai devreme.
  en.a1.unit50.lesson03.teach.dialogue_line8:
    title: Recepționerul despre eliberarea camerei
    gloss: 'Recepționerul spune: Camera se eliberează la ora unsprezece.'
    note: '*Check-out is at eleven o''clock.* înseamnă „Camera se eliberează la ora unsprezece.”'
  en.a1.unit50.lesson04.teach.reading_passage:
    title: Text despre un weekend la pensiune
    gloss: 'Un weekend la pensiune: Mia și Leila au făcut o scurtă excursie la munte, pentru weekend. Mia iubește fotografia, iar Leila iubește pictura, așa că a fost locul perfect pentru relaxare. Când au ajuns la pensiune, i-au spus recepționerului că au o rezervare pentru două nopți, între 14 și 16 noiembrie. Recepționerul a întrebat pe ce nume este rezervarea, iar Leila a spus că este pe numele ei. Camera lor avea două paturi și wifi, iar micul dejun era inclus în fiecare dimineață, de la șapte la zece. Camera trebuia eliberată la ora unsprezece. Mia a făcut multe fotografii cu munții, iar Leila a pictat un mic tablou cu priveliștea de la fereastra lor. Daniel a rămas acasă în weekendul acela și și-a gătit singur cina, după o rețetă din cartea de bucate pe care a împrumutat-o de la bibliotecă. Când Mia și Leila s-au întors, le-au arătat fotografiile și tabloul, iar lui i-au plăcut foarte mult.'
    note: '*Their room had two beds and wifi* înseamnă „Camera lor avea două paturi și wifi”.'
