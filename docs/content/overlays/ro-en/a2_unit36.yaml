teaching:
  en.a2.unit36.lesson01.teach.certificate:
    title: certificate
    gloss: certificat
    note: '*certificate* este actul oficial pe care ți-l eliberează o autoritate; *registration certificate* este certificatul de înregistrare.'
    example_gloss: Certificatul meu de înregistrare a sosit la două săptămâni după programare.
  en.a2.unit36.lesson01.teach.mistake:
    title: mistake
    gloss: greșeală
    note: '*mistake* este ceva scris sau făcut greșit.'
    example_gloss: În adresa mea de pe acest formular este o greșeală.
  en.a2.unit36.lesson01.teach.spelled:
    title: spelled
    gloss: scris, silabisit
    note: '*spelled* arată cu ce litere, în ce ordine, se scrie un cuvânt.'
    example_gloss: Numele meu se scrie cu un singur L, nu cu doi.
  en.a2.unit36.lesson01.teach.correct:
    title: correct
    gloss: a corecta, a rectifica
    note: '*correct* este aici un verb: a face corect ceva ce era greșit.'
    example_gloss: Funcționarul îmi poate corecta numele de familie astăzi.
  en.a2.unit36.lesson01.teach.copy:
    title: copy
    gloss: copie
    note: '*copy* este o a doua versiune identică a unui document.'
    example_gloss: Instituția păstrează o copie a fiecărui document.
  en.a2.unit36.lesson01.teach.passport:
    title: passport
    gloss: pașaport
    note: '*passport* este documentul de călătorie cu fotografia ta.'
    example_gloss: La o programare la instituție, îmi aduc întotdeauna pașaportul.
  en.a2.unit36.lesson01.teach.grammar_there_is_there_are:
    title: there is și there are
    gloss: Pe certificatul meu este o greșeală. Pe certificatul meu sunt două greșeli.
    note: '*there is* se folosește pentru un singur lucru, *there are* pentru mai multe, ca „este” și „sunt” în română.'
  en.a2.unit36.lesson02.teach.there_is_a_mistake:
    title: Cum spui că e o greșeală
    gloss: Pe certificatul meu de înregistrare este o greșeală.
    note: '*There is a mistake on...* este modul formal și obiectiv de a semnala o greșeală.'
  en.a2.unit36.lesson02.teach.name_spelled_wrong:
    title: Cum spui ce anume e greșit
    gloss: Numele meu de familie este scris greșit.
    note: '*last name* este numele de familie; *first name* este prenumele.'
  en.a2.unit36.lesson02.teach.could_you_correct_it:
    title: Întrebarea dacă se poate rectifica
    gloss: Ați putea să-l corectați, vă rog?
    note: '*Could you...?* este mai politicos decât *Can you...?* și se potrivește la un ghișeu al unei instituții.'
  en.a2.unit36.lesson02.teach.how_long_correction:
    title: Întrebarea cât durează
    gloss: Cât durează corectarea?
    note: '*How long...?* întreabă despre durată, nu despre lungime.'
  en.a2.unit36.lesson02.teach.grammar_polite_request:
    title: două cereri politicoase
    gloss: Ați putea să-l corectați, vă rog? Ar fi posibil să primesc un certificat nou?
    note: '*Could you...?* cere să se facă ceva; *Would it be possible to...?* este și mai prudent și întreabă dacă ceva este posibil în general.'
  en.a2.unit36.lesson03.teach.working_days:
    title: working days
    gloss: zile lucrătoare
    note: '*working days* sunt zilele de luni până vineri, deci fără weekend.'
    example_gloss: Instituția răspunde la fiecare scrisoare în cel mult cinci zile lucrătoare.
  en.a2.unit36.lesson03.teach.notice_text:
    title: Scrisoarea de rectificare
    gloss: Cerere de corectare primită. Certificatul dumneavoastră de înregistrare va fi corectat în termen de cinci zile lucrătoare. Vă rugăm să aduceți pașaportul și această adresă la birou. Număr de dosar 3092.
    note: 'O adresă oficială este scurtă și la obiect: ce s-a întâmplat, ce se va întâmpla și ce trebuie să faci.'
  en.a2.unit36.lesson03.teach.bring_passport_and_notice:
    title: ce trebuie să aduci
    gloss: Vă rugăm să aduceți pașaportul și această adresă la birou.
    note: '*bring ... to ...* înseamnă a duce ceva într-un loc.'
  en.a2.unit36.lesson04.teach.q_there_is_a_mistake:
    title: Leila anunță eroarea
    gloss: 'Leila spune: Bună ziua, pe certificatul meu de înregistrare este o greșeală.'
    note: '*Hello* este mai neutru decât *Hi* și se potrivește mai bine la un ghișeu.'
  en.a2.unit36.lesson04.teach.a_what_is_wrong:
    title: Funcționarul pune o întrebare suplimentară
    gloss: 'Funcționarul spune: Înțeleg. Ce nu este în regulă?'
    note: '*I see* înseamnă aici: înțeleg, vă ascult.'
  en.a2.unit36.lesson04.teach.q_name_spelled_wrong:
    title: Leila explică greșeala și cere rectificarea
    gloss: 'Leila spune: Numele meu de familie este scris greșit. Ați putea să-l corectați, vă rog?'
    note: Aceleași două propoziții ca în lecția 2, acum una după alta.
  en.a2.unit36.lesson04.teach.a_do_you_have_passport:
    title: Funcționarul cere pașaportul
    gloss: 'Funcționarul spune: Desigur. Aveți pașaportul la dumneavoastră?'
    note: '*Do you have ... with you?* înseamnă: Îl aveți acum la dumneavoastră?'
  en.a2.unit36.lesson04.teach.q_here_it_is:
    title: Leila întinde pașaportul
    gloss: 'Leila spune: Da, poftiți.'
    note: '*Here it is* se spune în timp ce îi întinzi cuiva ceva.'
  en.a2.unit36.lesson04.teach.a_copy_and_send:
    title: Funcționarul explică ce face
    gloss: 'Funcționarul spune: Mulțumesc. Fac o copie și trimit corectarea chiar astăzi.'
    note: '*make a copy* este o îmbinare fixă: a face o copie.'
  en.a2.unit36.lesson04.teach.q_how_long:
    title: Leila întreabă cât durează
    gloss: 'Leila întreabă: Cât durează corectarea?'
    note: Aceeași întrebare ca în lecția 2.
  en.a2.unit36.lesson04.teach.a_within_five_working_days:
    title: Răspunsul funcționarului
    gloss: 'Funcționarul spune: În termen de cinci zile lucrătoare.'
    note: '*within* înseamnă într-un interval de timp, deci durează cel mult cinci zile lucrătoare.'
  en.a2.unit36.lesson04.teach.q_thank_you:
    title: Leila îi mulțumește funcționarului
    gloss: 'Leila spune: Vă mulțumesc mult.'
    note: '*very much* face mulțumirea mai apăsată.'
