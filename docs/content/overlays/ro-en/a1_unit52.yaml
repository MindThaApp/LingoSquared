  en.a1.unit52.lesson03.teach.dialogue_line1:
    title: Frizerul salută
    gloss: 'Frizerul spune: Bună ziua, cu ce vă pot ajuta astăzi?'
    note: '*How can I help you today?* înseamnă „Cu ce vă pot ajuta astăzi?”.'
  en.a1.unit52.lesson03.teach.dialogue_line2:
    title: Cererea lui Daniel
    gloss: 'Daniel spune: Aș vrea o tunsoare, vă rog. Sora mea vine în vizită săptămâna viitoare.'
    note: În engleză, *I'd like a haircut* folosește substantivul *haircut* („tunsoare”), ca în română „aș vrea o tunsoare”.
  en.a1.unit52.lesson03.teach.dialogue_line3:
    title: "Frizerul întreabă"
    gloss: 'Frizerul întreabă: Sigur, ce coafură doriți?'
    note: '*what style do you want* înseamnă „ce coafură doriți”.'
  en.a1.unit52.lesson03.teach.dialogue_line4:
    title: Dorința lui Daniel
    gloss: 'Daniel spune: Aceeași coafură, doar puțin mai scurtă.'
    note: '*just a little shorter* înseamnă „doar puțin mai scurt”.'
  en.a1.unit52.lesson03.teach.dialogue_line5:
    title: Întrebarea Miei
    gloss: 'Mia întreabă: Puteți să-i spălați mai întâi părul?'
    note: '*Can you wash his hair first?* înseamnă „Puteți să-i spălați mai întâi părul?”.'
  en.a1.unit52.lesson03.teach.dialogue_line6:
    title: Frizerul confirmă
    gloss: 'Frizerul spune: Desigur, iar spălatul este inclus în prețul tunsorii.'
    note: '*included with* înseamnă „inclus în”.'
  en.a1.unit52.lesson03.teach.dialogue_line7:
    title: Întrebarea lui Daniel despre preț
    gloss: 'Daniel întreabă: Excelent. Cât costă?'
    note: '*Great.* înseamnă aici „Excelent.” sau „Foarte bine.”, folosit ca reacție scurtă.'
  en.a1.unit52.lesson03.teach.dialogue_line8:
    title: Prețul
    gloss: 'Frizerul spune: Costă douăzeci de dolari.'
    note: Repetarea unei fraze învățate mai devreme.
  en.a1.unit52.lesson04.teach.reading_passage:
    title: Text despre o vizită la frizerie
    gloss: 'O vizită la frizerie: Sora lui Daniel venea în vizită din Chicago săptămâna viitoare, așa că el s-a hotărât să se tundă. Mia i-a recomandat frizeria ei preferată, un salon mic de lângă apartamentul ei, și a mers cu el. Frizera l-a întrebat ce coafură dorește, iar el a spus aceeași coafură, doar puțin mai scurtă. Ea i-a spălat mai întâi părul, iar spălatul era inclus în prețul tunsorii. Tunsoarea a costat douăzeci de dolari. Când au terminat, Mia a spus că părul lui arată excelent. Pe drum spre casă, s-au întâlnit cu Leila la o cafea. Ea se simțea mult mai bine după răceală și i-a plăcut foarte mult și noua tunsoare a lui Daniel.'
    note: '*looked great* înseamnă „arăta excelent”.'
