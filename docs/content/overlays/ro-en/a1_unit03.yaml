  en.a1.unit03.lesson02.teach.eleven:
    title: eleven
    gloss: unsprezece
    note: '*eleven* este neregulat în engleză, spre deosebire de „unsprezece” din română, care se formează regulat din „unu” și „zece”.'
    example_gloss: Numărul casei mele este unsprezece.
  en.a1.unit03.lesson02.teach.twelve:
    title: twelve
    gloss: doisprezece
    note: '*twelve* este și el neregulat, spre deosebire de „doisprezece” din română.'
    example_gloss: Numărul casei mele este doisprezece.
  en.a1.unit03.lesson02.teach.thirteen:
    title: thirteen
    gloss: treisprezece
    note: 'De la 13 la 19, engleza adaugă *-teen* la numărul de bază, asemănător cu „-sprezece” din română. La *thirteen* însă se schimbă tulpina: *thir-* în loc de *three*.'
    example_gloss: Numărul casei mele este treisprezece.
  en.a1.unit03.lesson02.teach.fifteen:
    title: fifteen
    gloss: cincisprezece
    note: '*fifteen*, nu *fiveteen* – o mică neregularitate a englezei.'
    example_gloss: Numărul casei mele este cincisprezece.
  en.a1.unit03.lesson02.teach.twenty:
    title: twenty
    gloss: douăzeci
    note: '*twenty* este numărul englezesc 20.'
    example_gloss: Numărul casei mele este douăzeci.
  en.a1.unit03.lesson02.teach.twenty_one:
    title: twenty-one
    gloss: douăzeci și unu
    note: 'Ca în română („douăzeci și unu”), în engleză spui mai întâi zecile: *twenty-one*, cu cratimă.'
  en.a1.unit03.lesson02.teach.thirty:
    title: thirty
    gloss: treizeci
    note: '*thirty* este numărul englezesc 30.'
    example_gloss: Costă treizeci de dolari.
  en.a1.unit03.lesson02.teach.forty:
    title: forty
    gloss: patruzeci
    note: 'Atenție: *forty*, nu *fourty* – *u* din *four* dispare.'
    example_gloss: Costă patruzeci de dolari.
  en.a1.unit03.lesson02.teach.fifty:
    title: fifty
    gloss: cincizeci
    note: '*fifty* este numărul englezesc 50.'
    example_gloss: Costă cincizeci de dolari.
  en.a1.unit03.lesson02.teach.hundred:
    title: one hundred
    gloss: o sută
    note: În engleză, înaintea lui *hundred* stă întotdeauna *one* sau *a* (*one hundred*, *a hundred*), la fel cum româna spune „o sută”.
  en.a1.unit03.lesson03.teach.how_old:
    title: How old are you?
    gloss: Câți ani ai? / Câți ani aveți?
    note: '*How old are you?* merge în orice registru – în engleză nu există deosebirea tu/dumneavoastră.'
  en.a1.unit03.lesson03.teach.im_25:
    title: I'm twenty-five years old.
    gloss: Am douăzeci și cinci de ani.
    note: În engleză spui „sunt” (*I'm*) + număr + *years old*, nu „am … ani” ca în română.
  en.a1.unit03.lesson03.teach.how_much:
    title: How much is this?
    gloss: Cât costă asta?
    note: Întreabă cât costă ceva.
  en.a1.unit03.lesson03.teach.its_ten_dollars:
    title: It's ten dollars.
    gloss: Costă zece dolari.
    note: Răspunsul standard la o întrebare despre preț.
  en.a1.unit03.lesson03.teach.phone_question:
    title: What's your phone number?
    gloss: Care este numărul tău de telefon?
    note: Întreabă numărul de telefon.
  en.a1.unit03.lesson03.teach.phone_answer:
    title: It's five-five-five, one-two-three-four.
    gloss: Este cinci-cinci-cinci, unu-doi-trei-patru.
    note: În engleză, numerele de telefon se spun cifră cu cifră, cu pauze între grupuri.
  en.a1.unit03.lesson04.teach.market:
    title: market
    gloss: piața
    note: Un loc unde cumperi alimente și alte mărfuri.
    example_gloss: Suntem în piață.
  en.a1.unit03.lesson04.teach.apples:
    title: apples
    gloss: mere
    note: Pluralul lui *apple*.
    example_gloss: Merele sunt proaspete.
  en.a1.unit03.lesson04.teach.opening:
    title: Daniel eröffnet das Gespräch
    gloss: 'Daniel întreabă: Cât costă asta?'
    note: O întrebare simplă despre preț.
  en.a1.unit03.lesson04.teach.price_five:
    title: Leila antwortet
    gloss: 'Leila spune: Costă cinci dolari.'
    note: Răspunsul la întrebarea lui Daniel despre preț.
  en.a1.unit03.lesson04.teach.ask_apples:
    title: Daniel fragt nach den Äpfeln
    gloss: 'Daniel întreabă: Și cât costă merele?'
    note: '*And* leagă această întrebare de cea de dinainte.'
  en.a1.unit03.lesson04.teach.price_two:
    title: Leila antwortet
    gloss: 'Leila spune: Costă doi dolari.'
    note: '*They''re* se folosește pentru că *apples* este la plural.'
  en.a1.unit03.lesson04.teach.ask_shop_age:
    title: Daniel fragt nach dem Alter des Ladens
    gloss: 'Daniel spune: OK, ce vechime are magazinul ăsta?'
    note: '*How old* se poate referi și la lucruri, nu doar la persoane.'
  en.a1.unit03.lesson04.teach.shop_age:
    title: Leila antwortet
    gloss: 'Leila spune: Are douăzeci de ani!'
    note: Aceeași construcție ca la persoane – *years old* merge și pentru lucruri.
