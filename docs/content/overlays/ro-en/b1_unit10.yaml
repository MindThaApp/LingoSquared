    gloss: curs de design
    note: '*design course* înseamnă un curs despre cum sunt gândite aspectul și funcționarea lucrurilor.'
    example_gloss: Leila economisește bani pentru un curs de design.
  en.b1.unit10.lesson03.teach.clear_goal:
    title: clear goal
    gloss: obiectiv clar
    note: '*clear goal* înseamnă un obiectiv concret și ușor de înțeles.'
    example_gloss: Un obiectiv clar te ajută să alegi ce faci mai departe.
  en.b1.unit10.lesson03.teach.reading_passage:
    title: 'Text de citit: obiective clare'
    gloss: Daniel și Leila au amândoi obiective clare. Daniel urmează un curs de seară ca să-și îmbunătățească engleza pentru serviciu. Exersează să scrie mesaje scurte de actualizare ca să sune mai profesionist. Leila economisește bani ca să poată urma anul viitor un curs de design. Citește descrierile cursurilor ca să aleagă programul potrivit.
    note: Un text scurt despre obiective, cu *in order to* și *so that*.
