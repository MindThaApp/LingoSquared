    title: Scopul cu 'in order to'
    gloss: Urmez un curs de seară ca să-mi îmbunătățesc engleza.
    note: '*in order to improve* arată scopul cursului de seară.'
  en.b1.unit10.lesson02.teach.study_so_that:
    title: Scopul cu 'so that'
    gloss: Învăț în fiecare seară ca să pot ține minte mai multe cuvinte.
    note: 'După *so that* urmează o propoziție completă: *I can remember more vocabulary*.'
  en.b1.unit10.lesson02.teach.grammar_purpose:
    title: '''in order to'' și ''so that'''
    gloss: Învăț ca să-mi îmbunătățesc engleza. Învăț ca să pot ține minte mai mult.
    note: '*in order to* stă înaintea unui verb; *so that* stă înaintea unei propoziții complete. În română, „pentru a” + infinitiv se potrivește cu *in order to*, iar „ca să” + verb la conjunctiv, cu subiect propriu, se potrivește cu *so that*.'
