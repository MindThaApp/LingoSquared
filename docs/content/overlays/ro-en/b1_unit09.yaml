teaching:
  en.b1.unit09.lesson01.teach.said_that:
    title: said that
    gloss: a spus că
    note: '*said that* se folosește pentru a relata ce a spus altcineva.'
    example_gloss: A spus că e ocupată.
  en.b1.unit09.lesson01.teach.told_me_that:
    title: told me that
    gloss: mi-a spus că
    note: '*told me that* se folosește când cineva ți-a dat ție o informație.'
    example_gloss: Mi-a spus că ședința a fost anulată.
  en.b1.unit09.lesson01.teach.asked_whether:
    title: asked whether
    gloss: a întrebat dacă
    note: '*asked whether* relatează o întrebare cu răspuns da/nu și sună puțin mai oficial decât *asked if*.'
    example_gloss: Mia a întrebat dacă avem nevoie de ajutor.
  en.b1.unit09.lesson01.teach.asked_if:
    title: asked if
    gloss: a întrebat dacă
    note: '*asked if* relatează o întrebare cu răspuns da/nu în limbajul de zi cu zi.'
    example_gloss: Mia a întrebat dacă avem nevoie de ajutor.
  en.b1.unit09.lesson01.teach.message:
    title: message
    gloss: mesaj
    note: '*message* înseamnă o comunicare scurtă, scrisă sau vorbită.'
    example_gloss: Leila a trimis un mesaj după prânz.
  en.b1.unit09.lesson01.teach.confirm:
    title: confirm
    gloss: a confirma
    note: '*confirm* înseamnă a spune că ceva este sigur sau corect.'
    example_gloss: Te rog să confirmi ora înainte să pleci.
  en.b1.unit09.lesson01.teach.available:
    title: available
    gloss: disponibil, liber
    note: '*available* înseamnă liber sau în stare să se întâlnească.'
    example_gloss: Mia e liberă după prânz.
  en.b1.unit09.lesson02.teach.mia_available:
    title: Eine Aussage wiedergeben
    gloss: Mia a spus că e liberă după prânz.
    note: 'În vorbirea indirectă, *is* devine de obicei *was*: *Mia said that she was available*. În română putem păstra prezentul („a spus că este liberă”), dar în engleză verbul trece de regulă la trecut.'
  en.b1.unit09.lesson02.teach.leila_told_me:
    title: Informationen an Sie wiedergeben
    gloss: Leila mi-a spus că la birou e aglomerat.
    note: '*told me that* se folosește când cineva ți-a transmis informația direct ție.'
  en.b1.unit09.lesson02.teach.grammar_backshift:
    title: Direkte und indirekte Rede
    gloss: 'Mia spune: „Sunt liberă.” Mia a spus că e liberă.'
    note: 'Direct: *I am available*. Indirect: *Mia said that she was available*. În vorbirea indirectă, enunțul inițial trece de obicei cu un timp înapoi.'
  en.b1.unit09.lesson03.teach.short_summary:
    title: short summary
    gloss: rezumat scurt
    note: '*short summary* înseamnă o variantă scurtă, doar cu punctele esențiale.'
    example_gloss: Un rezumat scurt ajunge pentru ședința de azi.
  en.b1.unit09.lesson03.teach.full_report:
    title: full report
    gloss: raport complet
    note: '*full report* înseamnă tot raportul, nu doar varianta scurtă.'
    example_gloss: Mia a întrebat dacă avem nevoie de raportul complet.
  en.b1.unit09.lesson03.teach.reading_passage:
    title: 'Lesetext: der Nachrichtenverlauf'
    gloss: Leila a citit mesajul Miei și l-a sunat pe Daniel. I-a spus că Mia e liberă după prânz. A mai spus că Mia a terminat cifrele. Mia a întrebat dacă echipa are nevoie azi de raportul complet. Daniel i-a spus Leilei că un rezumat scurt e de ajuns, pentru că ședința durează doar cincisprezece minute.
    note: Un text scurt despre cum relatăm afirmații și întrebări.
  en.b1.unit09.lesson04.teach.q_mia_reply:
    title: Daniel fragt nach Mias Antwort
    gloss: 'Daniel spune: A răspuns Mia în legătură cu analiza?'
    note: O întrebare cu răspuns da/nu despre un mesaj anterior.
  en.b1.unit09.lesson04.teach.a_she_said_available:
    title: Leila gibt Mias Aussage wieder
    gloss: 'Leila spune: Da, a spus că e liberă după prânz.'
    note: '*she said that she was available* relatează afirmația Miei.'
  en.b1.unit09.lesson04.teach.q_anything_else:
    title: Daniel fragt weiter
    gloss: 'Daniel spune: Bine. A mai întrebat ceva?'
    note: O întrebare pentru a afla dacă mesajul mai conținea o întrebare.
  en.b1.unit09.lesson04.teach.a_asked_if_report:
    title: Leila gibt Mias Frage wieder
    gloss: 'Leila spune: A întrebat dacă avem nevoie azi de raportul complet.'
    note: '*asked if* transformă o întrebare directă cu răspuns da/nu în vorbire indirectă.'
  en.b1.unit09.lesson04.teach.q_what_tell_her:
    title: Daniel fragt nach Leilas Antwort
    gloss: 'Daniel spune: Ce i-ai spus?'
    note: O întrebare despre informația pe care a transmis-o Leila.
  en.b1.unit09.lesson04.teach.a_short_summary_enough:
    title: Leila gibt ihre Antwort wieder
    gloss: 'Leila spune: I-am spus că un rezumat scurt e de ajuns.'
    note: '*I told her that...* relatează informații pe care le-ai dat altcuiva.'
  en.b1.unit09.lesson04.teach.q_tell_team:
    title: Daniel beendet den Nachrichtenverlauf
    gloss: 'Daniel spune: Perfect. Le spun celor din echipă că ne putem întâlni la două.'
    note: Daniel folosește din nou *tell ... that* pentru a transmite informații.
