teaching:
  en.a1.unit40.lesson01.teach.post_office:
    title: post office
    gloss: poștă / oficiu poștal
    note: '*post office* înseamnă poștă, oficiul poștal.'
    example_gloss: Merg la poștă să trimit scrisori.
  en.a1.unit40.lesson01.teach.letter:
    title: letter
    gloss: scrisoare
    note: '*letter* înseamnă scrisoare.'
    example_gloss: Îi scriu o scrisoare prietenului meu.
  en.a1.unit40.lesson01.teach.package:
    title: package
    gloss: pachet
    note: '*package* înseamnă pachet.'
    example_gloss: Îi trimit un pachet surorii mele.
  en.a1.unit40.lesson01.teach.stamp:
    title: stamp
    gloss: timbru
    note: '*stamp* înseamnă timbru.'
    example_gloss: Am nevoie de un timbru pentru această scrisoare.
  en.a1.unit40.lesson01.teach.envelope:
    title: envelope
    gloss: plic
    note: '*envelope* înseamnă plic.'
    example_gloss: Pun scrisoarea într-un plic.
  en.a1.unit40.lesson01.teach.mailbox:
    title: mailbox
    gloss: cutie poștală
    note: '*mailbox* înseamnă cutie poștală.'
    example_gloss: Cutia poștală este lângă oficiul poștal.
  en.a1.unit40.lesson02.teach.send_a_letter:
    title: send a letter
    gloss: a trimite o scrisoare
    note: '*send a letter* înseamnă a trimite o scrisoare.'
    example_gloss: Vreau să trimit o scrisoare părinților mei.
  en.a1.unit40.lesson02.teach.buy_a_stamp:
    title: buy a stamp
    gloss: a cumpăra un timbru
    note: '*buy a stamp* înseamnă a cumpăra un timbru.'
    example_gloss: Trebuie să cumpăr un timbru pentru această carte poștală.
  en.a1.unit40.lesson02.teach.write_the_address:
    title: write the address
    gloss: a scrie adresa
    note: '*write the address* înseamnă a scrie adresa.'
    example_gloss: Te rog să scrii adresa pe pachet.
  en.a1.unit40.lesson02.teach.how_long_will_it_take:
    title: how long will it take
    gloss: cât durează
    note: '*how long will it take* înseamnă cât durează.'
    example_gloss: Cât durează până ajunge?
  en.a1.unit40.lesson02.teach.express_mail:
    title: express mail
    gloss: poștă expres / trimitere rapidă
    note: '*express mail* înseamnă poștă expres: o trimitere mai rapidă și mai scumpă.'
    example_gloss: Poșta expres este mai rapidă decât poșta obișnuită.
  en.a1.unit40.lesson02.teach.how_much_does_it_cost_question:
    title: How much does it cost to send this?
    gloss: Cât costă să trimit asta?
    note: '*How much does it cost to ...?* întreabă prețul unei acțiuni.'
  en.a1.unit40.lesson03.teach.dialogue_line1:
    title: Cererea lui Daniel
    gloss: 'Daniel spune: Bună ziua, aș vrea să trimit acest pachet, vă rog.'
    note: '*I''d like to* + verb este o formă politicoasă de a cere ceva. Este mult mai politicoasă decât *I want*, care sună destul de direct la ghișeu.'
  en.a1.unit40.lesson03.teach.dialogue_line2:
    title: Funcționara întreabă
    gloss: 'Funcționara spune: Desigur! Încotro merge?'
    note: '*Where is it going?* întreabă despre destinație.'
  en.a1.unit40.lesson03.teach.dialogue_line3:
    title: "Răspunsul lui Daniel"
    gloss: 'Daniel spune: La Chicago. Este un cadou de ziua surorii mele.'
    note: '*It''s a birthday gift for my sister* înseamnă: este un cadou de ziua surorii mele.'
  en.a1.unit40.lesson03.teach.dialogue_line4:
    title: Funcționara întreabă
    gloss: 'Funcționara spune: Doriți poștă obișnuită sau expres? Cea expres durează aproximativ două zile.'
    note: '*regular or express mail* înseamnă poștă obișnuită sau poștă expres.'
  en.a1.unit40.lesson03.teach.dialogue_line5:
    title: Alegerea lui Daniel
    gloss: 'Daniel spune: O iau pe cea expres, vă rog. Cât costă?'
    note: '*I''ll take ...* este o modalitate firească de a alege atunci când ești client.'
  en.a1.unit40.lesson03.teach.dialogue_line6:
    title: Funcționara răspunde
    gloss: 'Funcționara spune: Face douăsprezece dolari. Poftiți chitanța.'
    note: '*Here''s your receipt* înseamnă: poftiți chitanța.'
  en.a1.unit40.lesson03.teach.dialogue_line7:
    title: Mulțumirea lui Daniel
    gloss: 'Daniel spune: Vă mulțumesc! O zi bună.'
    note: '*Have a good day* este o urare politicoasă de rămas-bun.'
  en.a1.unit40.lesson04.teach.reading_passage:
    title: Text despre trei vizite la poștă
    gloss: Daniel, Leila și Mia se descurcă bine la poștă. Săptămâna trecută, Daniel a trimis un pachet de ziua surorii lui, la Chicago. A plătit pentru poșta expres, pentru că voia să ajungă repede, iar pachetul a ajuns în doar două zile. Leila se pregătește să se mute într-un loc aproape de Mia, așa că a mers la poștă să trimită niște cărți vechi părinților ei. Funcționara a cântărit pachetul și i-a dat un timbru pentru el. Leila a întrebat cât va dura, iar funcționara a spus că aproximativ o săptămână, pentru că ea a ales poșta obișnuită. Mia nu trimite des pachete, dar cumpără mereu un timbru pentru scrisorile pe care i le scrie bunicii ei. Ea spune că o scrisoare cu timbru pare mai personală decât un mesaj text.
    note: '*getting ready to move* înseamnă: a se pregăti de mutare.'
