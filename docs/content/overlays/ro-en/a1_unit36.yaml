teaching:
  en.a1.unit36.lesson01.teach.class:
    title: class
    gloss: oră de curs
    note: '*class* înseamnă oră de curs sau curs (o întâlnire în care înveți ceva).'
    example_gloss: Am curs în fiecare marți seara.
  en.a1.unit36.lesson01.teach.course:
    title: course
    gloss: curs
    note: '*course* înseamnă curs (o serie de lecții despre un singur subiect).'
    example_gloss: El urmează anul acesta un curs de informatică.
  en.a1.unit36.lesson01.teach.student:
    title: student
    gloss: student / cursant
    note: '*student* înseamnă student sau cursant: cineva care învață la școală sau la un curs.'
    example_gloss: Ea este studentă la un colegiu comunitar.
  en.a1.unit36.lesson01.teach.homework:
    title: homework
    gloss: temă pentru acasă
    note: '*homework* înseamnă temă pentru acasă.'
    example_gloss: Îmi fac tema după cină.
  en.a1.unit36.lesson01.teach.subject:
    title: subject
    gloss: materie
    note: '*subject* înseamnă materie (un subiect pe care îl studiezi).'
    example_gloss: Matematica este materia mea preferată.
  en.a1.unit36.lesson01.teach.test:
    title: test
    gloss: test
    note: '*test* înseamnă test sau lucrare de control.'
    example_gloss: Avem un test vineri.
  en.a1.unit36.lesson02.teach.take_a_class:
    title: take a class
    gloss: a urma un curs
    note: '*take a class* este combinația fixă din engleză pentru „a urma un curs”. Nu traduce cuvânt cu cuvânt „a urma” prin *follow a class* (sună ciudat în engleză); folosești întotdeauna *take*.'
    example_gloss: Urmez un curs în fiecare marți seara.
  en.a1.unit36.lesson02.teach.do_homework:
    title: do homework
    gloss: a-ți face tema
    note: '*do homework*: verbul este *do*, nu *make*. În română spui „a-ți face tema”, cu verbul „a face”, dar în engleză *make homework* este greșit; folosești *do*.'
    example_gloss: El își face tema după cină.
  en.a1.unit36.lesson02.teach.study_for_a_test:
    title: study for a test
    gloss: a învăța pentru un test
    note: '*study for a test* înseamnă a învăța pentru un test. *For* arată aici scopul (pentru ce înveți).'
    example_gloss: Învăț pentru un test în fiecare vineri.
  en.a1.unit36.lesson02.teach.community_college:
    title: community college
    gloss: colegiu comunitar (instituție locală de învățământ pentru adulți)
    note: '*community college* este o instituție americană în care adulții urmează cursuri, mai ales pe lângă serviciu. În română nu există un echivalent exact, de aceea se păstrează de obicei denumirea engleză.'
    example_gloss: Ea studiază la un colegiu comunitar.
  en.a1.unit36.lesson02.teach.in_the_evening:
    title: in the evening
    gloss: seara
    note: '*in the evening* înseamnă seara.'
    example_gloss: Cursul meu este seara.
  en.a1.unit36.lesson02.teach.what_are_you_studying_question:
    title: What are you studying?
    gloss: Ce studiezi?
    note: Această întrebare folosește present continuous (*are you studying*) pentru ceva cu care ești ocupat în această perioadă a vieții, nu timpul prezent simplu.
  en.a1.unit36.lesson03.teach.dialogue_line1:
    title: Întrebarea lui Daniel
    gloss: 'Daniel întreabă: Faci ceva după serviciu azi?'
    note: '*anything* înseamnă aici „ceva” și apare într-o întrebare.'
  en.a1.unit36.lesson03.teach.dialogue_line2:
    title: "Răspunsul Miei"
    gloss: 'Mia spune: Da, am diseară un curs de fotografie.'
    note: '*tonight* înseamnă diseară.'
  en.a1.unit36.lesson03.teach.dialogue_line3:
    title: Reacția lui Daniel
    gloss: 'Daniel spune: A, frumos! Unde îl urmezi?'
    note: '*Where do you take it?*: și aici *take* se potrivește cu urmarea unui curs, ca la *take a class*.'
  en.a1.unit36.lesson03.teach.dialogue_line4:
    title: "Răspunsul Miei"
    gloss: 'Mia spune: La colegiul comunitar din centru. Este de două ori pe săptămână.'
    note: '*twice a week*: și aici *a* înseamnă „pe”.'
  en.a1.unit36.lesson03.teach.dialogue_line5:
    title: Întrebarea lui Daniel
    gloss: 'Daniel spune: Cum merge până acum?'
    note: '*so far* înseamnă până acum.'
  en.a1.unit36.lesson03.teach.dialogue_line6:
    title: "Răspunsul Miei"
    gloss: 'Mia spune: Îmi place foarte mult. Învăț să-mi folosesc mai bine aparatul foto.'
    note: '*I''m learning how to ...*: present continuous pentru o abilitate pe care o dezvolți în prezent.'
  en.a1.unit36.lesson03.teach.dialogue_line7:
    title: Ultima replică a lui Daniel
    gloss: 'Daniel spune: Super! Poate mă înveți și pe mine cândva.'
    note: '*sometime* înseamnă „cândva”: o indicație vagă de timp în viitor.'
  en.a1.unit36.lesson04.teach.reading_passage:
    title: Text despre Daniel, Leila și Mia
    gloss: Daniel, Leila și Mia învață toți ceva nou în afara serviciului. Daniel urmează un curs de informatică luni seara, ca să-și dezvolte abilități pentru slujba lui. Leila învață spaniola pentru că vrea să călătorească în Mexic într-o zi. Mia are un curs de fotografie de două ori pe săptămână la colegiul comunitar și face deja poze mult mai bune. Uneori vorbesc împreună despre cursurile lor la prânz.
    note: '*takes a computer course*: folosești *take*, nu *follow*; aceeași capcană ca la *take a class*.'
