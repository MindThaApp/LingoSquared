teaching:
  en.a1.unit23.lesson01.teach.teacher:
    title: teacher
    gloss: profesor, profesoară
    note: '*teacher* înseamnă profesor sau profesoară. Engleza nu face diferența de gen aici: *teacher* se folosește pentru amândoi.'
    example_gloss: Leila este profesoară.
  en.a1.unit23.lesson01.teach.nurse:
    title: nurse
    gloss: asistent medical
    note: '*nurse* înseamnă asistent medical sau asistentă medicală. Cuvântul este același pentru femei și bărbați.'
    example_gloss: Sunt asistent medical.
  en.a1.unit23.lesson01.teach.engineer:
    title: engineer
    gloss: inginer
    note: '*engineer* înseamnă inginer sau ingineră. Înaintea unei vocale se folosește *an*: *an engineer*.'
    example_gloss: Daniel este inginer.
  en.a1.unit23.lesson01.teach.cook:
    title: cook
    gloss: bucătar
    note: '*cook* înseamnă bucătar sau bucătăreasă; cuvântul este și verb („a găti”).'
    example_gloss: Fratele meu este bucătar.
  en.a1.unit23.lesson01.teach.driver:
    title: driver
    gloss: șofer
    note: '*driver* înseamnă șofer. În *bus driver* este numit împreună cu vehiculul, care în engleză se pune înainte.'
    example_gloss: El este șofer de autobuz.
  en.a1.unit23.lesson02.teach.what_do_you_do:
    title: What do you do?
    gloss: Cu ce te ocupi?
    note: Cu *What do you do?* întrebi despre profesie. Literal înseamnă „Ce faci?”, dar sensul este „Cu ce te ocupi?”.
  en.a1.unit23.lesson02.teach.im_a_nurse:
    title: I'm a nurse.
    gloss: Sunt asistent medical.
    note: 'Cu *I''m a...* spui profesia. Atenție: în română spunem „Sunt profesor” fără articol; în engleză, înaintea profesiei se pune *a* sau *an*.'
  en.a1.unit23.lesson02.teach.where_do_you_work:
    title: Where do you work?
    gloss: Unde lucrezi?
    note: Cu *Where do you work?* întrebi despre locul de muncă.
  en.a1.unit23.lesson03.teach.patients:
    title: patients
    gloss: pacienți
    note: '*patients* înseamnă pacienți (la plural). Cuvântul se pronunță *PAY-shents*.'
    example_gloss: Ajut pacienți în fiecare zi.
  en.a1.unit23.lesson03.teach.profile_text:
    title: Text despre un profil profesional
    gloss: Sunt asistent medical. Lucrez la un spital. Ajut pacienți și scriu rapoarte în fiecare zi.
    note: În acest profil scurt, cineva povestește despre profesia și munca lui de zi cu zi.
  en.a1.unit23.lesson04.teach.interesting_work:
    title: It's interesting work.
    gloss: Este o muncă interesantă.
    note: '*interesting* înseamnă interesant.'
  en.a1.unit23.lesson04.teach.q_what_do_you_do_daniel:
    title: Întrebare despre profesia lui Daniel
    gloss: 'Leila întreabă: Daniel, cu ce te ocupi?'
    note: Aceeași întrebare ca în a doua lecție, de data aceasta cu nume.
  en.a1.unit23.lesson04.teach.a_engineer_small_company:
    title: Răspunsul lui Daniel
    gloss: 'Daniel spune: Sunt inginer. Lucrez la o companie mică în centrul orașului.'
    note: Daniel spune ce profesie are și unde lucrează.
  en.a1.unit23.lesson04.teach.q_what_every_day:
    title: Întrebare despre sarcinile zilnice
    gloss: 'Leila întreabă: Ce faci în fiecare zi?'
    note: Această întrebare se referă la sarcinile zilnice.
  en.a1.unit23.lesson04.teach.a_reports_emails_clients:
    title: Răspunsul lui Daniel
    gloss: 'Daniel spune: Scriu rapoarte și răspund la e-mailuri. Uneori mă întâlnesc cu clienți.'
    note: Daniel menționează câteva lucruri pe care le face în fiecare zi.
  en.a1.unit23.lesson04.teach.q_like_your_job:
    title: Întrebare dacă îi place lui Daniel slujba
    gloss: 'Leila întreabă: Îți place slujba?'
    note: Cu *Do you like your job?* întrebi dacă cuiva îi place munca lui.
  en.a1.unit23.lesson04.teach.a_yes_interesting:
    title: Răspunsul lui Daniel
    gloss: 'Daniel spune: Da, îmi place. Este o muncă interesantă.'
    note: Daniel spune da și dă și motivul.
