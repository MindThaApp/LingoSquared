  en.a1.unit05.lesson03.teach.at_nine_am:
    title: The store opens at nine in the morning.
    gloss: Magazinul se deschide la nouă dimineața.
    note: 'Înaintea orei, engleza folosește *at*, ca româna „la”: *at nine* (la nouă).'
  en.a1.unit05.lesson03.teach.at_six_pm:
    title: The store closes at six in the evening.
    gloss: Magazinul se închide la șase seara (ora 18).
    note: În engleză, ora de zi cu zi se spune adesea în formatul de 12 ore, cu momentul zilei (*six in the evening*), pe când româna folosește pentru programul oficial adesea formatul de 24 de ore (ora 18).
