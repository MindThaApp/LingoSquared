    gloss: se închide la
    note: '*closes at* + oră înseamnă se închide la + oră.'
    example_gloss: Biblioteca se închide la șase.
  en.a1.unit05.lesson04.teach.q_open:
    title: Daniel întreabă programul
    gloss: 'Daniel: La ce oră se deschide biblioteca?'
    note: '*What time does ...?* întreabă o oră exactă. În întrebare apare *does*, de aceea se spune *open*, fără -s.'
  en.a1.unit05.lesson04.teach.a_open:
    title: Răspunsul despre ora de deschidere
    gloss: 'Leila: Se deschide la nouă dimineața.'
    note: Un răspuns complet spune ora exactă și momentul zilei.
  en.a1.unit05.lesson04.teach.q_close:
    title: Întrebarea despre ora de închidere
    gloss: 'Daniel: Și la ce oră se închide?'
    note: '*And* introduce a doua întrebare din aceeași conversație.'
  en.a1.unit05.lesson04.teach.a_close:
    title: Răspunsul despre ora de închidere
    gloss: 'Leila: Se închide la șase seara (ora 18).'
    note: Un răspuns complet spune și aici ora exactă.
  en.a1.unit05.lesson04.teach.closing:
    title: Încheierea conversației
    gloss: 'Daniel: Grozav, ne vedem la nouă!'
    note: '*See you at nine!* înseamnă că vă revedeți la ora nouă.'
