    title: It's half past three.
    gloss: Este trei și jumătate.
    note: 'Atenție: în engleză, *half past three* numără jumătatea de oră DUPĂ trei, adică 3:30 – la fel ca în română, „trei și jumătate”. Tradus cuvânt cu cuvânt, *half past three* sună „jumătate trecută de trei”, dar înseamnă exact 3:30.'
  en.a1.unit05.lesson01.teach.five_oclock:
