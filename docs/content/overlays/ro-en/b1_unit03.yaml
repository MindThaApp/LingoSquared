course:
  title: Engleză B1
  description: Învață engleza la nivel B1, pentru obligații, posibilități, situații ipotetice și povestiri de zi cu zi, cu explicații detaliate în română.
units:
  en.b1.unit03.hypotheticals:
    title: Dacă plouă, dacă aș avea timp
lessons:
  en.b1.unit03.lesson01.conditional_vocabulary:
    title: If, rain și free time
  en.b1.unit03.lesson02.real_conditions:
    title: If it rains, we will stay home
  en.b1.unit03.lesson03.reading_more_free_time:
    title: 'Lectură: if she had more free time'
  en.b1.unit03.lesson04.the_weekend_plans_dialogue:
    title: If there's another one, you should join
teaching:
  en.b1.unit03.lesson01.teach.if:
    title: if
    gloss: dacă
    note: '*if* introduce o condiție, ca „dacă” în română. Pentru timp, în sensul de „când” sau „ori de câte ori”, engleza folosește *when*, nu *if*.'
    example_gloss: Dacă plouă, rămânem acasă.
  en.b1.unit03.lesson01.teach.rain:
    title: rain
    gloss: ploaie / a ploua
    note: '*rain* înseamnă apa care cade din cer sau verbul „a ploua”.'
    example_gloss: Ar putea ploua în weekendul acesta.
  en.b1.unit03.lesson01.teach.stay_home:
    title: stay home
    gloss: a rămâne acasă
    note: '*stay home* înseamnă să nu ieși și să rămâi acasă.'
    example_gloss: Dacă plouă, rămânem acasă.
  en.b1.unit03.lesson01.teach.weekend:
    title: weekend
    gloss: weekend / sfârșit de săptămână
    note: '*weekend* înseamnă sâmbăta și duminica.'
    example_gloss: Ce planuri ai pentru weekend?
  en.b1.unit03.lesson01.teach.free_time:
    title: free time
    gloss: timp liber
    note: '*free time* înseamnă timpul în care nu lucrezi și nu ești ocupat.'
    example_gloss: În ultima vreme nu prea am timp liber.
  en.b1.unit03.lesson01.teach.paint:
    title: paint
    gloss: a picta
    note: '*paint* înseamnă a face un tablou cu vopsea.'
    example_gloss: Leilei îi place să picteze în weekend.
  en.b1.unit03.lesson02.teach.if_rains_stay_home:
    title: o condiție reală în viitor
    gloss: Dacă plouă mâine, rămânem acasă.
    note: '*if + present, will + verbul la infinitiv* exprimă o condiție reală, posibilă, în viitor.'
  en.b1.unit03.lesson02.teach.if_have_free_time_paint:
    title: încă o condiție reală
    gloss: Dacă am timp liber în weekendul acesta, voi picta.
    note: 'Aceeași construcție: *if + present, will + verbul la infinitiv*.'
  en.b1.unit03.lesson02.teach.grammar_real_condition:
    title: condiții reale
    gloss: Dacă plouă, rămânem acasă. Dacă am timp, voi picta.
    note: După *if*, engleza folosește aici prezentul, chiar dacă vorbești despre viitor; nu se spune *will rain*.
  en.b1.unit03.lesson03.teach.would:
    title: would
    gloss: ar (conjunctiv-condițional)
    note: '*would* + verbul la infinitiv exprimă o situație ireală sau ipotetică în prezent.'
    example_gloss: Dacă aș avea mai mult timp, aș picta în fiecare zi.
  en.b1.unit03.lesson03.teach.class:
    title: class
    gloss: curs / oră
    note: '*class* înseamnă un curs organizat sau o oră de predare cu un profesor.'
    example_gloss: Era un curs de pictură lângă casa ei.
  en.b1.unit03.lesson03.teach.reading_passage:
    title: 'Text de citit: dacă ar avea mai mult timp liber'
    gloss: Leilei îi place să picteze, dar nu prea are timp liber. Dacă ar avea mai mult timp liber, ar picta în fiecare zi. Luna trecută a fost un curs de pictură lângă casa ei. Dacă ar fi aflat mai devreme de el, s-ar fi înscris. Acum caută în fiecare săptămână cursuri noi.
    note: Un text scurt cu o situație ireală în prezent și o situație ireală în trecut.
  en.b1.unit03.lesson04.teach.q_weekend_plans:
    title: Daniel întreabă despre weekend
    gloss: 'Daniel spune: Ce planuri ai pentru weekend?'
    note: O întrebare deschisă simplă, pentru a începe o conversație.
  en.b1.unit03.lesson04.teach.a_walk_or_stay_home:
    title: Planurile lui Leila, în funcție de vreme
    gloss: 'Leila spune: Dacă nu plouă, mă duc la plimbare. Dacă plouă, rămân acasă și pictez.'
    note: Două condiții reale, una după alta, în funcție de vreme.
  en.b1.unit03.lesson04.teach.q_take_class:
    title: Daniel întreabă despre cursul de pictură
    gloss: 'Daniel spune: Sună bine. Ai făcut cursul de pictură luna trecută?'
    note: O întrebare de continuare despre ceva din trecut.
  en.b1.unit03.lesson04.teach.a_would_have_signed_up:
    title: Regretul lui Leila față de trecut
    gloss: 'Leila spune: Nu. Dacă aș fi știut mai devreme de el, m-aș fi înscris.'
    note: '*if + past perfect, would have + participiul trecut* exprimă o situație ireală în trecut sau un regret.'
  en.b1.unit03.lesson04.teach.q_should_join:
    title: Daniel face o recomandare
    gloss: 'Daniel spune: Păcat. Dacă mai este unul, ar trebui să te înscrii.'
    note: Daniel folosește *should* ca s-o încurajeze pe Leila să profite de următoarea ocazie.
  en.b1.unit03.lesson04.teach.a_will_sign_up:
    title: Leila își propune ceva
    gloss: 'Leila spune: Ai dreptate. Dacă văd unul, mă înscriu imediat.'
    note: O nouă condiție reală despre viitor, nu mai este ipotetică.
