teaching:
  en.a1.unit11.lesson01.teach.sunny:
    title: sunny
    gloss: însorit
    note: '*sunny* înseamnă însorit.'
    example_gloss: Astăzi este însorit.
  en.a1.unit11.lesson01.teach.rainy:
    title: rainy
    gloss: ploios
    note: '*rainy* înseamnă ploios.'
    example_gloss: Nu-mi plac zilele ploioase.
  en.a1.unit11.lesson01.teach.cloudy:
    title: cloudy
    gloss: înnorat
    note: '*cloudy* înseamnă înnorat.'
    example_gloss: Cerul este înnorat.
  en.a1.unit11.lesson01.teach.cold:
    title: cold
    gloss: rece
    note: '*cold* înseamnă rece, frig.'
    example_gloss: Afară este foarte frig.
  en.a1.unit11.lesson01.teach.hot:
    title: hot
    gloss: foarte cald
    note: '*hot* înseamnă foarte cald, fierbinte.'
    example_gloss: Vara este foarte cald.
  en.a1.unit11.lesson01.teach.windy:
    title: windy
    gloss: cu vânt
    note: '*windy* înseamnă cu vânt.'
    example_gloss: Astăzi bate vântul.
  en.a1.unit11.lesson02.teach.whats_weather_like:
    title: What's the weather like today?
    gloss: Cum este vremea astăzi?
    note: '*What''s the weather like?* este întrebarea obișnuită despre vreme.'
  en.a1.unit11.lesson02.teach.its_sunny:
    title: It's sunny and warm.
    gloss: Este însorit și cald.
    note: '*It''s* + adjectiv descrie vremea de acum.'
  en.a1.unit11.lesson02.teach.its_raining:
    title: It's raining.
    gloss: Plouă.
    note: '*It''s raining* este la Present Continuous; în română spunem pur și simplu „Plouă.”'
  en.a1.unit11.lesson02.teach.take_umbrella:
    title: You should take an umbrella.
    gloss: Ar trebui să iei o umbrelă.
    note: '*should* exprimă o recomandare, asemănătoare cu „ar trebui să” din română.'
  en.a1.unit11.lesson03.teach.tomorrow:
    title: tomorrow
    gloss: mâine
    note: '*tomorrow* înseamnă mâine (ziua următoare).'
    example_gloss: Ne vedem mâine.
  en.a1.unit11.lesson03.teach.forecast_text:
    title: Prognoza meteo
    gloss: Mâine va fi însorit și cald. Sâmbătă va ploua.
    note: '*will* + verb formează viitorul englezesc, asemănător cu „va” + infinitiv din română („va ploua”).'
  en.a1.unit11.lesson04.teach.lets_go:
    title: Let's go to the park.
    gloss: Hai să mergem în parc.
    note: '*Let''s* + verb înseamnă „Hai să...”, adică o propunere.'
  en.a1.unit11.lesson04.teach.q_weather:
    title: Întrebarea lui Leila
    gloss: 'Leila: Cum este vremea astăzi?'
    note: Leila începe conversația cu o întrebare despre vreme.
  en.a1.unit11.lesson04.teach.a_sunny_warm:
    title: Răspunsul lui Daniel
    gloss: 'Daniel: Este însorit și cald.'
    note: Daniel descrie vremea de acum.
  en.a1.unit11.lesson04.teach.suggest_park:
    title: Propunerea lui Leila
    gloss: 'Leila: Super, hai să mergem în parc.'
    note: '*Great* exprimă entuziasm pentru vremea frumoasă.'
  en.a1.unit11.lesson04.teach.agree_rain_tomorrow:
    title: Răspunsul lui Daniel
    gloss: 'Daniel: Bună idee. Dar sâmbătă va ploua, așa că hai să mergem astăzi.'
    note: '*so* leagă motivul (ploaia de sâmbătă) de consecință (mergem astăzi).'
