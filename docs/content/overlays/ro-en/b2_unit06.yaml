teaching:
  en.b2.unit06.lesson01.teach.value:
    title: value
    gloss: valoare
    note: '*value* înseamnă aici un principiu pe care oamenii îl consideră important, nu doar valoare financiară.'
    example_gloss: Corectitudinea este o valoare.
  en.b2.unit06.lesson01.teach.fairness:
    title: fairness
    gloss: corectitudine, echitate
    note: '*fairness* se referă la tratarea rezonabilă a oamenilor. Este mai puternic și mai abstract decât simplul *nice*.'
    example_gloss: Corectitudinea înseamnă să tratezi oamenii în mod rezonabil.
  en.b2.unit06.lesson01.teach.convenience:
    title: convenience
    gloss: comoditate, utilitate practică
    note: '*convenience* înseamnă comoditate, avantajul practic al unui lucru. Nu o traduce prin *easiness* (ușurință, simplitate) în acest context B2.'
    example_gloss: Comoditatea face viața de zi cu zi mai ușoară.
  en.b2.unit06.lesson01.teach.flexibility:
    title: flexibility
    gloss: flexibilitate
    note: '*flexibility* este capacitatea de a te adapta atunci când condițiile se schimbă.'
    example_gloss: Flexibilitatea permite schimbarea atunci când condițiile se schimbă.
  en.b2.unit06.lesson01.teach.qualify:
    title: qualify
    gloss: nuanța, limita
    note: '*qualify* înseamnă aici a-ți limita sau a-ți nuanța opinia. Nu înseamnă a obține o diplomă.'
    example_gloss: Poți nuanța o opinie limitând-o.
  en.b2.unit06.lesson01.teach.prioritize:
    title: prioritize
    gloss: a acorda prioritate
    note: '*prioritize fairness* înseamnă că pui corectitudinea mai presus de o altă valoare.'
    example_gloss: A acorda prioritate corectitudinii înseamnă a o considera mai importantă decât altceva.
  en.b2.unit06.lesson02.teach.in_principle:
    title: Cântărirea valorilor
    gloss: În principiu, comoditatea contează, dar corectitudinea ar trebui să cântărească mai mult.
    note: '*In principle* înseamnă „în principiu”. Nu folosi *eventually* pentru românescul „eventual”; *eventually* înseamnă „în cele din urmă”.'
  en.b2.unit06.lesson02.teach.not_arguing_everywhere:
    title: Limitarea punctului tău de vedere
    gloss: Nu pledez pentru liniște peste tot.
    note: '*I am not arguing for...* îți limitează afirmația. Este mai bine decât o formulare vagă cu *a little*.'
  en.b2.unit06.lesson02.teach.respond_opposing:
    title: Reacția directă la cealaltă parte
    gloss: Ai dreptate, și sunt de acord că firmele au nevoie de flexibilitate.
    note: '*That is fair* recunoaște argumentul celuilalt fără să renunți la propria valoare.'
  en.b2.unit06.lesson02.teach.grammar_abstract_response:
    title: Construirea unei opinii abstracte
    gloss: O opinie abstractă puternică numește o valoare, nuanțează afirmația și răspunde direct la punctul de vedere al celeilalte persoane.
    note: Folosește cuvinte precise de nivel B2, cum ar fi *in principle*, *fairness* și *carry more weight*, nu mereu *a bit* pentru nuanțare.
  en.b2.unit06.lesson03.teach.transparent:
    title: transparent
    gloss: limpede, ușor de înțeles și de verificat
    note: '*transparent rules* sunt reguli ușor de înțeles și de verificat.'
    example_gloss: Regulile clare sunt ușor de înțeles.
  en.b2.unit06.lesson03.teach.commercial:
    title: commercial
    gloss: comercial, de afaceri
    note: '*commercial activity* este activitatea legată de firme și de profit.'
    example_gloss: Activitatea comercială are legătură cu firmele.
  en.b2.unit06.lesson03.teach.reading_passage:
    title: 'Lectură: spații publice liniștite'
    gloss: 'Amara susține că spațiile publice liniștite trebuie protejate, chiar dacă asta limitează o parte din activitatea comercială. Punctul ei de vedere nu este absolut: ea nu pledează pentru liniște peste tot și acceptă că firmele au nevoie de o anumită flexibilitate. Punctul de vedere opus al lui Leo este că regulile pot îngreuna supraviețuirea firmelor. Amara răspunde direct la acest argument spunând că comoditatea contează, dar corectitudinea ar trebui să cântărească mai mult atunci când un spațiu aparține tuturor. Poziția ei este nuanțată, pentru că sprijină reguli limitate și clare, nu restricții nelimitate.'
    note: 'Aceasta este engleză abstractă: numește valorile și limitează-ți afirmația cu precizie.'
  en.b2.unit06.lesson04.teach.q_protect_spaces:
    title: Amara își spune poziția
    gloss: 'Amara spune: Cred că un oraș ar trebui să protejeze spațiile publice liniștite, chiar dacă asta limitează o parte din activitatea comercială.'
    note: '*even if* arată că ea recunoaște un dezavantaj.'
  en.b2.unit06.lesson04.teach.a_business_flexibility:
    title: Leo numește cealaltă valoare
    gloss: 'Leo spune: Și eu prețuiesc liniștea, dar firmele au nevoie de flexibilitate ca să supraviețuiască.'
    note: Leo contrapune flexibilitatea accentului pus de Amara pe spațiul public.
  en.b2.unit06.lesson04.teach.q_not_silence:
    title: Amara nuanțează
    gloss: 'Amara spune: Ai dreptate, și nu pledez pentru liniște peste tot. Ideea mea este că spațiile comune nu ar trebui modelate doar de profit.'
    note: '*not arguing for silence everywhere* împiedică poziția ei să sune absolută.'
  en.b2.unit06.lesson04.teach.a_prioritizing:
    title: Leo numește valoarea
    gloss: 'Leo spune: Deci valoarea căreia îi acorzi prioritate este corectitudinea, nu doar confortul?'
    note: '*prioritizing* înseamnă aici: a pune mai presus în balanță.'
  en.b2.unit06.lesson04.teach.q_fairness_weight:
    title: Amara cântărește valorile
    gloss: 'Amara spune: Exact. În principiu, comoditatea contează, dar corectitudinea ar trebui să cântărească mai mult atunci când un spațiu aparține tuturor.'
    note: '*carry more weight* este expresia englezească naturală pentru „a cântări mai mult”.'
  en.b2.unit06.lesson04.teach.a_accept_rules:
    title: Leo acceptă cu o condiție
    gloss: 'Leo spune: Pot accepta asta dacă regulile sunt limitate și clare.'
    note: Acceptarea depinde de caracterul limitat și de claritatea regulilor.
