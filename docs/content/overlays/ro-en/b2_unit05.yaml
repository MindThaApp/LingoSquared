course:
  title: Engleză B2
  description: Învață engleza la nivel B2 pentru conversații nuanțate, argumentare, ipoteze și discuții profesionale, cu explicații în română.
units:
  en.b2.unit05.register:
    title: Same message, different register
lessons:
  en.b2.unit05.lesson01.audience_and_formality:
    title: Informal, profesional și formal
  en.b2.unit05.lesson02_same_request_three_ways:
    title: Can you, could we, I would be grateful
  en.b2.unit05.lesson03.reading_same_message:
    title: 'Lectură: trei categorii de destinatari'
  en.b2.unit05.lesson04.the_register_dialogue:
    title: To a friend, yes. To the clinic, no.
teaching:
  en.b2.unit05.lesson01.teach.register:
    title: Register
    gloss: registru (de limbă), grad de formalitate
    note: '*register* arată cât de formal sau informal vorbești. Româna face diferența între tu și dumneavoastră, dar engleza nu: tonul se schimbă mai ales prin formulare.'
    example_gloss: Registrul se schimbă atunci când se schimbă destinatarul.
  en.b2.unit05.lesson01.teach.casual:
    title: casual
    gloss: informal, lejer
    note: '*casual* se potrivește pentru un prieten sau o cunoștință. Este mai direct, dar nu e automat nepoliticos.'
    example_gloss: Un mesaj informal se potrivește pentru un prieten.
  en.b2.unit05.lesson01.teach.professional:
    title: professional
    gloss: profesionist, politicos în context de serviciu
    note: '*professional* se potrivește pentru un coleg: politicos și clar, dar nu exagerat de formal.'
    example_gloss: Un mesaj profesional se potrivește pentru un coleg.
  en.b2.unit05.lesson01.teach.formal:
    title: formal
    gloss: oficial, protocolar
    note: '*formal* se potrivește pentru o instituție. În engleză, acest lucru se face adesea prin cereri mai lungi și mai indirecte.'
    example_gloss: Un mesaj oficial se potrivește pentru o instituție.
  en.b2.unit05.lesson01.teach.audience:
    title: audience
    gloss: public, destinatar
    note: '*audience* este persoana sau grupul căruia îi scrii sau cu care vorbești.'
    example_gloss: Publicul tău îți influențează alegerea cuvintelor.
  en.b2.unit05.lesson01.teach.institution:
    title: institution
    gloss: instituție, organizație
    note: '*institution* este o organizație precum o clinică, o bancă sau o universitate.'
    example_gloss: O clinică este o instituție.
  en.b2.unit05.lesson02.teach.formal_request:
    title: Cerere oficială
    gloss: Aș fi recunoscător(oare) dacă ați putea confirma dacă programarea mea poate fi mutată vineri.
    note: '*I would be grateful if you could...* este formal. Engleza nu are alt cuvânt pentru *you* ca în română (tu/dumneavoastră); politețea vine din întreaga construcție.'
  en.b2.unit05.lesson02.teach.casual_request:
    title: Cerere informală
    gloss: Poți s-o muți vineri?
    note: '*Can you...?* este bine pentru un prieten, dar sună repede prea direct pentru o instituție.'
  en.b2.unit05.lesson02.teach.professional_request:
    title: Cerere profesională
    gloss: Putem muta programarea vineri, dacă vineri încă ți se potrivește?
    note: '*Could we...?* sună colaborativ și politicos pentru un coleg.'
  en.b2.unit05.lesson02.teach.to_whom:
    title: Dear scheduling team,
    gloss: Stimată echipă de programări,
    note: '*Dear...* este o formulă de adresare formală obișnuită. Este mai puțin rigidă decât multe formule românești de început de scrisoare.'
  en.b2.unit05.lesson02.teach.grammar_register_shift:
    title: Schimbarea registrului
    gloss: Păstrează conținutul la fel când schimbi registrul. Engleza informală poate folosi întrebări directe. Engleza profesională folosește adesea could. Engleza formală folosește adesea I would be grateful if you could.
    note: 'Nu te gândi doar la tu față de dumneavoastră: în engleză se schimbă toată propoziția.'
  en.b2.unit05.lesson03.teach.stiff:
    title: stiff
    gloss: rigid, prea formal
    note: '*stiff* înseamnă că un mesaj sună inutil de formal pentru situația respectivă.'
    example_gloss: Un mesaj rigid sună prea formal pentru situație.
  en.b2.unit05.lesson03.teach.appropriate:
    title: appropriate
    gloss: potrivit, adecvat
    note: '*appropriate* înseamnă că formularea se potrivește cu destinatarul și cu situația.'
    example_gloss: Un mesaj adecvat se potrivește cu publicul.
  en.b2.unit05.lesson03.teach.reading_passage:
    title: 'Text de citit: același mesaj, trei destinatari'
    gloss: 'Nina trebuie să mute o programare vineri. Unui prieten îi scrie: Can you move it to Friday? Mesajul este direct și informal. Unui coleg îi scrie: Could we move the appointment to Friday if that still works for you? Mesajul este profesional și politicos. Clinicii îi scrie: I would be grateful if you could confirm whether my appointment can be moved to Friday. Conținutul este același în toate cele trei texte, dar registrul se schimbă în funcție de destinatar.'
    note: În engleză, registrul se schimbă prin formulare, nu printr-un cuvânt separat pentru dumneavoastră.
  en.b2.unit05.lesson04.teach.q_need_ask:
    title: Nina întreabă despre formulare
    gloss: 'Nina spune: Trebuie să întreb dacă programarea mea poate fi mutată. Pot să scriu pur și simplu: „Can you move it?”'
    note: '*just write* arată că ea se îndoiește dacă forma directă se potrivește.'
  en.b2.unit05.lesson04.teach.a_too_casual:
    title: Oscar atrage atenția asupra registrului
    gloss: 'Oscar spune: Unui prieten, da. Clinicii, asta îi sună prea informal.'
    note: Și aici, în engleză folosești pur și simplu *you*, dar propoziția în sine este prea directă pentru clinică.
  en.b2.unit05.lesson04.teach.q_colleague:
    title: Nina întreabă despre registrul pentru coleg
    gloss: 'Nina întreabă: Ce ai scrie unui coleg?'
    note: Un coleg cere un registru profesional, nu maxim de formal.
  en.b2.unit05.lesson04.teach.a_colleague_request:
    title: Oscar dă varianta pentru coleg
    gloss: 'Oscar spune: Aș scrie: „Could we move the appointment to Friday if that still works for you?”'
    note: '*Could we* și *if that still works for you* fac cererea mai blândă.'
  en.b2.unit05.lesson04.teach.q_clinic:
    title: Nina întreabă despre clinică
    gloss: 'Nina întreabă: Și clinicii?'
    note: O instituție cere o structură de cerere mai formală.
  en.b2.unit05.lesson04.teach.a_clinic_request:
    title: Oscar dă varianta formală
    gloss: 'Oscar spune: Aș scrie: „I would be grateful if you could confirm whether my appointment can be moved to Friday.”'
    note: Această variantă nu cere brusc o acțiune, ci o confirmare.
  en.b2.unit05.lesson04.teach.q_same_message:
    title: Nina rezumă
    gloss: 'Nina spune: Același mesaj, alt registru.'
    note: 'Conținutul rămâne același: mutarea programării vineri.'
  en.b2.unit05.lesson04.teach.a_content_stays:
    title: Oscar confirmă
    gloss: 'Oscar spune: Exact. Conținutul rămâne același, dar gradul de formalitate se schimbă.'
    note: Aceasta este esența controlului registrului la nivel B2.
