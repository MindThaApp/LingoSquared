teaching:
  en.a2.unit31.lesson01.teach.delay:
    title: delay
    gloss: întârziere
    note: '*delay* înseamnă întârziere.'
    example_gloss: Trenul de 5:15 are 45 de minute întârziere.
  en.a2.unit31.lesson01.teach.cancelled:
    title: cancelled
    gloss: anulat
    note: '*cancelled* înseamnă că ceva nu mai are loc. La trenuri, în română se spune de obicei: trenul este anulat.'
    example_gloss: Trenul de 5:15 nu a fost anulat, are doar întârziere.
  en.a2.unit31.lesson01.teach.alternative:
    title: alternative
    gloss: alternativă
    note: '*alternative* înseamnă o altă posibilitate.'
    example_gloss: 'Angajatul a propus o alternativă: un autobuz la 5:30.'
  en.a2.unit31.lesson01.teach.notice:
    title: notice
    gloss: anunț
    note: '*notice* înseamnă un anunț scris pentru călători, de exemplu un afiș în gară.'
    example_gloss: Am citit în gară un anunț despre întârziere.
  en.a2.unit31.lesson01.teach.signal_problem:
    title: signal problem
    gloss: defecțiune la semnalizare
    note: '*signal problem* înseamnă o defecțiune la semnalele de pe linia ferată.'
    example_gloss: Întârzierea se datorează unei defecțiuni la semnalizare pe traseu.
  en.a2.unit31.lesson02.teach.wondering_why_delayed:
    title: Höflich nach dem Grund fragen
    gloss: Voiam să întreb de ce întârzie trenul.
    note: '*I was wondering why...* este o formă politicoasă, indirectă, de a întreba un motiv.'
  en.a2.unit31.lesson02.teach.another_way_home:
    title: Nach einer Alternative fragen
    gloss: Există o altă variantă ca să ajung acasă în seara asta?
    note: Cu *Is there another way to...?* întrebi despre alternative.
  en.a2.unit31.lesson02.teach.delayed_because_signal:
    title: Den Grund für die Verspätung nennen
    gloss: Trenul întârzie din cauza unei defecțiuni la semnalizare.
    note: Cu *has been delayed because of...* spui motivul unei întârzieri.
  en.a2.unit31.lesson03.teach.departure_time:
    title: departure time
    gloss: ora plecării
    note: '*departure time* înseamnă ora plecării.'
    example_gloss: Noua oră de plecare este 6:00.
  en.a2.unit31.lesson03.teach.notice_text:
    title: Text der Mitteilung
    gloss: 'Anunț: Trenul de 5:15 întârzie din cauza unei defecțiuni la semnalizare. Noua oră de plecare este 6:00. La 5:30 pleacă un autobuz din fața gării.'
    note: Un anunț oficial cu motivul, noua oră și o alternativă.
  en.a2.unit31.lesson03.teach.i_will_take_the_bus:
    title: Die eigene Entscheidung mitteilen
    gloss: Iau autobuzul în schimb.
    note: '*instead* înseamnă în schimb, în loc.'
  en.a2.unit31.lesson04.teach.q_can_i_help:
    title: Der Mitarbeiter bietet Hilfe an
    gloss: 'Angajatul întreabă: Vă pot ajuta?'
    note: '*Can I help you?* este o întrebare standard a personalului din gară.'
  en.a2.unit31.lesson04.teach.a_wondering_why_delayed:
    title: Daniel fragt nach dem Grund
    gloss: 'Daniel spune: Da, voiam să întreb de ce întârzie trenul.'
    note: Aceeași întrebare politicoasă ca în lecția 2.
  en.a2.unit31.lesson04.teach.q_signal_problem_new_time:
    title: Der Mitarbeiter erklärt die Verspätung
    gloss: 'Angajatul spune: Este o defecțiune la semnalizare pe traseu. Noua oră de plecare este 6:00.'
    note: Angajatul spune motivul și noua oră de plecare.
  en.a2.unit31.lesson04.teach.a_another_way_home_tonight:
    title: Daniel fragt nach einer Alternative
    gloss: 'Daniel spune: Există o altă variantă ca să ajung acasă în seara asta?'
    note: Aceeași întrebare ca în lecția 2.
  en.a2.unit31.lesson04.teach.q_bus_at_530:
    title: Der Mitarbeiter nennt die Alternative
    gloss: 'Angajatul spune: La 5:30 pleacă un autobuz din fața gării.'
    note: Angajatul propune o alternativă concretă, cu oră și loc.
  en.a2.unit31.lesson04.teach.a_thank_you_take_bus:
    title: Daniels abschließende Entscheidung
    gloss: 'Daniel spune: Mulțumesc. Atunci iau autobuzul.'
    note: Daniel îi mulțumește angajatului și își spune decizia.
