  en.a1.unit04.lesson03.teach.numeric_form:
    title: You can also write it as 7/7.
    gloss: Poți să o scrii și 7/7.
    note: 'Atenție: în scrierea americană cu cifre formatul este lună/zi (*7/7* = 7 iulie), nu zi/lună ca în română (7.07). Deosebirea provoacă confuzii reale: *7/9* înseamnă 9 iulie, nu 7 septembrie.'
