      status: correct
    - value: The coordinator had already moved the equipment inside
      status: correct
    feedback: '*had already moved* este mai potrivit aici decât o traducere directă a perfectului compus românesc cu *has moved*.'
  en.b2.unit04.lesson03.exercise01.choose_earliest_event:
