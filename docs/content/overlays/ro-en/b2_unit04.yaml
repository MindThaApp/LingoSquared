course:
  title: Engleză B2
  description: Învață engleza la nivel B2 pentru conversații nuanțate, argumentare, ipoteze și discuții profesionale, cu explicații în română.
units:
  en.b2.unit04.narrative_time:
    title: By the time I arrived
lessons:
  en.b2.unit04.lesson01.timeline_roles:
    title: Fundal, evenimentul principal și ce s-a întâmplat înainte
  en.b2.unit04.lesson02.shifting_time:
    title: While I was checking, the power went out
  en.b2.unit04.lesson03.reading_an_incident_account:
    title: 'Lectură: problema de la locație'
  en.b2.unit04.lesson04.the_narrative_dialogue:
    title: Walk me through what happened
teaching:
  en.b2.unit04.lesson01.teach.background:
    title: background
    gloss: fundal, context
    note: '*background* este ceea ce se petrecea deja sau oferă contextul. În povestirile englezești, fundalul se pune adesea la past continuous.'
    example_gloss: Informațiile de fundal spun ce se petrecea deja.
  en.b2.unit04.lesson01.teach.foreground:
    title: foreground
    gloss: evenimentul principal
    note: '*foreground* este evenimentul spre care se îndreaptă povestea. În engleză se folosește de obicei simple past, nu automat present perfect.'
    example_gloss: Evenimentul principal este cel mai important eveniment din poveste.
  en.b2.unit04.lesson01.teach.prior:
    title: prior
    gloss: anterior, mai devreme
    note: '*prior* înseamnă mai devreme decât un alt moment din trecut. Se exprimă adesea cu past perfect: *had moved*.'
    example_gloss: Un eveniment anterior s-a petrecut înaintea altui eveniment din trecut.
  en.b2.unit04.lesson01.teach.interrupt:
    title: interrupt
    gloss: a întrerupe
    note: '*interrupt* folosești când un eveniment scurt intervine în ceva ce era în desfășurare.'
    example_gloss: O problemă bruscă poate întrerupe o acțiune.
  en.b2.unit04.lesson01.teach.ongoing:
    title: ongoing
    gloss: în desfășurare
    note: '*ongoing* se potrivește cu imperfectul românesc („verificam”). În engleză se exprimă adesea prin *was/were + -ing*.'
    example_gloss: O acțiune în desfășurare durează o vreme.
  en.b2.unit04.lesson01.teach.chronology:
    title: chronology
    gloss: cronologie, ordinea reală
    note: '*chronology* este ordinea reală a evenimentelor, chiar dacă povestea le relatează în altă ordine.'
    example_gloss: Cronologia este ordinea reală a evenimentelor.
  en.b2.unit04.lesson02.teach.by_the_time:
    title: Ceva se întâmplase deja
    gloss: Până să ajung eu, coordonatorul mutase deja echipamentul înăuntru.
    note: '*had already moved* arată că acest lucru s-a întâmplat înainte de *I arrived*. Ca mai-mult-ca-perfectul românesc („mutase”), past perfect-ul marchează anterioritatea; deci nu spune *has moved*, ci *had moved*.'
  en.b2.unit04.lesson02.teach.while_checking:
    title: Acțiune în desfășurare plus întrerupere
    gloss: În timp ce verificam sistemul de sunet, a căzut curentul.
    note: '*was checking* corespunde imperfectului românesc („verificam”). Întreruperea în sine este la simple past: *went out*.'
  en.b2.unit04.lesson02.teach.when_arrived_setting:
    title: Sosirea în timpul unei acțiuni de fundal
    gloss: Când am ajuns, voluntarii pregăteau scaunele.
    note: Folosește *were setting up* pentru ce se desfășura când s-a petrecut evenimentul principal.
  en.b2.unit04.lesson02.teach.grammar_shifted_time:
    title: Planurile temporale ale unei povestiri
    gloss: Folosește past continuous pentru acțiunea de fundal, simple past pentru evenimentele principale și past perfect pentru ce se petrecuse deja mai devreme.
    note: 'În română povestești des la perfectul compus („a căzut curentul”), iar în engleză, în narațiune, folosești de obicei simple past: *the power went out*, nu *has gone out*.'
  en.b2.unit04.lesson03.teach.venue:
    title: venue
    gloss: locație, locul unui eveniment
    note: '*venue* este locul în care are loc un eveniment.'
    example_gloss: Locația este locul unde se desfășoară un eveniment.
  en.b2.unit04.lesson03.teach.delayed:
    title: delayed
    gloss: amânat, întârziat
    note: '*delayed* înseamnă că ceva începe sau se întâmplă mai târziu decât era planificat.'
    example_gloss: Evenimentul a început cu douăzeci de minute mai târziu.
  en.b2.unit04.lesson03.teach.reading_passage:
    title: 'Text de citit: problema de la locație'
    gloss: Simon nu a povestit întâmplarea în ordine strict cronologică. Înainte să ajungă la locație, coordonatorul mutase echipamentul înăuntru pentru că se anunța ploaie. Când a ajuns Simon, voluntarii pregăteau scaunele. În timp ce verifica sistemul de sunet, a căzut curentul. L-a sunat pe administratorul clădirii, care i-a explicat că o echipă de reparații lucrase prin apropiere mai devreme în acea dimineață. Echipa a amânat începerea cu douăzeci de minute, dar până să intre invitații, luminile reveniseră.
    note: 'Observă planurile temporale din engleză: *had moved* pentru ce a fost mai devreme, *were setting up* pentru fundal și *went out* pentru evenimentul principal.'
  en.b2.unit04.lesson04.teach.q_walk_me_through:
    title: Harper cere povestea
    gloss: 'Harper întreabă: Poți să-mi povestești pas cu pas ce s-a întâmplat la locație?'
    note: '*walk me through* înseamnă a duce pe cineva pas cu pas prin desfășurarea unui eveniment.'
  en.b2.unit04.lesson04.teach.a_arrived_volunteers:
    title: Simon îmbină planurile temporale
    gloss: 'Simon spune: Sigur. Când am ajuns, voluntarii pregăteau scaunele, dar coordonatorul mutase deja echipamentul înăuntru pentru că se anunța ploaie.'
    note: O poveste bună îmbină acțiunea de fundal cu un eveniment mai vechi.
  en.b2.unit04.lesson04.teach.q_equipment_safe:
    title: Harper verifică ordinea
    gloss: 'Harper întreabă: Deci echipamentul era în siguranță înainte să ajungi tu acolo?'
    note: 'Întrebarea privește ordinea: echipamentul era deja în siguranță înaintea sosirii lui Simon.'
  en.b2.unit04.lesson04.teach.a_power_went_out:
    title: Simon relatează întreruperea
    gloss: 'Simon spune: Exact. Apoi, în timp ce verificam sistemul de sunet, a căzut curentul.'
    note: '*while I was checking* este acțiunea în desfășurare; *the power went out* este întreruperea.'
  en.b2.unit04.lesson04.teach.q_after_that:
    title: Harper întreabă despre pasul următor
    gloss: 'Harper întreabă: Ce ai făcut după aceea?'
    note: '*What did you do...?* folosește simple past cu *did* într-o întrebare despre un pas încheiat.'
  en.b2.unit04.lesson04.teach.a_repair_crew:
    title: Simon relatează o situație anterioară
    gloss: 'Simon spune: L-am sunat pe administratorul clădirii, iar acesta mi-a spus că o echipă de reparații lucrase prin apropiere mai devreme în acea dimineață.'
    note: '*had been working* arată că această muncă se desfășurase deja mai devreme în acea dimineață.'
  en.b2.unit04.lesson04.teach.q_event:
    title: Harper întreabă despre eveniment
    gloss: 'Harper întreabă: Și evenimentul?'
    note: Întrebarea scurtă cere consecința pentru eveniment.
  en.b2.unit04.lesson04.teach.a_delayed_start:
    title: Simon încheie povestea
    gloss: 'Simon spune: Am amânat începutul cu douăzeci de minute, dar până să intre invitații, luminile reveniseră.'
    note: '*had come back on* s-a petrecut înainte de momentul în care au intrat invitații.'
