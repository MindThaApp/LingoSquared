  en.b2.unit04.lesson02.exercise04.reply_while_checking:
    instruction: Cineva întreabă ce s-a întâmplat. Povestește ca Simon că a căzut curentul în timp ce verificai sistemul de sunet. Începe cu 'While'.
    accepted_answers:
