teaching:
  en.a2.unit25.lesson01.teach.appointment:
    title: appointment
    gloss: programare
    note: '*appointment* înseamnă o programare fixă, de exemplu la o instituție publică.'
    example_gloss: Am o programare vineri la DMV (serviciul pentru permise și înmatriculări).
  en.a2.unit25.lesson01.teach.document:
    title: document
    gloss: document
    note: '*document* înseamnă un act oficial sau un înscris.'
    example_gloss: Adu, te rog, un document ca dovadă a domiciliului.
  en.a2.unit25.lesson01.teach.proof_of_residency:
    title: proof of residency
    gloss: dovadă a domiciliului
    note: '*proof of residency* înseamnă un document care arată unde locuiești.'
    example_gloss: O factură la curent poate servi drept dovadă a domiciliului.
  en.a2.unit25.lesson01.teach.form:
    title: form
    gloss: formular
    note: '*form* înseamnă un formular pe care îl completezi.'
    example_gloss: Completează, te rog, acest formular înainte de programare.
  en.a2.unit25.lesson01.teach.confirmation_number:
    title: confirmation number
    gloss: număr de confirmare
    note: '*confirmation number* înseamnă numărul care confirmă programarea ta.'
    example_gloss: Numărul tău de confirmare este 4471.
  en.a2.unit25.lesson02.teach.i_was_wondering_whether:
    title: I was wondering whether I could make an appointment.
    gloss: Voiam să întreb dacă aș putea face o programare.
    note: '*I was wondering whether...* este o formulă politicoasă și formală de a cere ceva.'
  en.a2.unit25.lesson02.teach.would_it_be_possible:
    title: Would it be possible to come this Friday?
    gloss: Ar fi posibil să veniți vinerea aceasta?
    note: '*Would it be possible...?* este o rugăminte foarte politicoasă.'
  en.a2.unit25.lesson02.teach.because_i_moved:
    title: I need to update my address because I moved last month.
    gloss: Trebuie să îmi actualizez adresa, pentru că m-am mutat luna trecută.
    note: Cu *because* se introduce o propoziție care arată motivul.
  en.a2.unit25.lesson03.teach.photo_id:
    title: photo ID
    gloss: act de identitate cu fotografie
    note: '*photo ID* înseamnă un act de identitate cu fotografie, de exemplu o carte de identitate sau un permis de conducere.'
    example_gloss: Aveți nevoie de un act de identitate cu fotografie și de o dovadă a domiciliului.
  en.a2.unit25.lesson03.teach.utility_bill:
    title: utility bill
    gloss: factură de utilități
    note: '*utility bill* înseamnă factura la curent, gaze sau apă.'
    example_gloss: O factură de utilități este un exemplu frecvent de dovadă a domiciliului.
  en.a2.unit25.lesson03.teach.notice_text:
    title: Text des Hinweises
    gloss: Pentru a vă actualiza adresa, vă rugăm să aduceți un act de identitate cu fotografie și o dovadă a domiciliului, de exemplu o factură de utilități. Dacă nu aveți o factură de utilități, puteți aduce contractul de închiriere.
    note: 'Este un anunț formal: spune ce trebuie să aduceți și ce puteți aduce în schimb.'
  en.a2.unit25.lesson03.teach.i_will_bring:
    title: I will bring a photo ID.
    gloss: Voi aduce un act de identitate cu fotografie.
    note: Cu *will* spui ce vei face (viitor).
  en.a2.unit25.lesson04.teach.could_you_tell_me:
    title: Could you tell me what I need to bring?
    gloss: Mi-ați putea spune ce trebuie să aduc?
    note: '*Could you tell me...?* este o întrebare indirectă politicoasă. După *what* ordinea cuvintelor este cea obișnuită: *what I need to bring*.'
  en.a2.unit25.lesson04.teach.q_since_when:
    title: Fragen, wie lange
    gloss: 'Funcționarul întreabă: De cât timp locuiți la noua adresă?'
    note: '*How long have you lived...?* întreabă de cât timp durează ceva. În engleză se folosește Present Perfect (*have lived*); în română se folosește prezentul („locuiți de...”). Răspunsul poate începe cu *since*: *Since last month.*'
  en.a2.unit25.lesson04.teach.a_since_last_month:
    title: Daniels Antwort
    gloss: 'Daniel spune: Din luna trecută.'
    note: '*Since last month* înseamnă „din luna trecută”. Aici este suficient un răspuns scurt.'
  en.a2.unit25.lesson04.teach.q_would_it_be_possible:
    title: Nach einem Termin fragen
    gloss: 'Daniel întreabă: Ar fi posibil să vin vinerea aceasta?'
    note: Aceeași întrebare ca în a doua lecție.
  en.a2.unit25.lesson04.teach.a_friday_works_confirmation:
    title: Antwort des Sachbearbeiters
    gloss: 'Funcționarul spune: Da, vineri la ora 10 se poate. Numărul dumneavoastră de confirmare este 4471.'
    note: Funcționarul confirmă ora și spune numărul de confirmare.
