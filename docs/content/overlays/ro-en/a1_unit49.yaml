  en.a1.unit49.lesson02.teach.what_about_paper_and_food_waste:
    title: What about paper and food waste?
    gloss: Dar hârtia și resturile alimentare?
    note: '*What about ...?* înseamnă „Dar ...?” și se folosește pentru a întreba despre altceva.'
  en.a1.unit49.lesson03.teach.dialogue_line1:
    title: Avertismentul Miei
    gloss: 'Mia spune: Stai, borcanul acela de sticlă nu se aruncă la gunoi!'
    note: '*doesn''t go in the trash* înseamnă „nu se aruncă la gunoi”.'
  en.a1.unit49.lesson03.teach.dialogue_line2:
    title: Scuzele lui Daniel
    gloss: 'Daniel spune: O, nu, scuze! În ce pubelă merge?'
    note: '*Which bin does it go in?* repetă forma de întrebare învățată adineauri.'
  en.a1.unit49.lesson03.teach.dialogue_line3:
    title: Mia explică
    gloss: 'Mia spune: Merge în pubela verde. Aici reciclăm sticla.'
    note: '*We recycle glass here.* înseamnă „Aici reciclăm sticla.”'
  en.a1.unit49.lesson03.teach.dialogue_line4:
    title: Întrebarea lui Daniel
    gloss: 'Daniel întreabă: Dar hârtia și resturile alimentare?'
    note: Repetarea întrebării *What about ...?*, învățată mai devreme.
  en.a1.unit49.lesson03.teach.dialogue_line5:
    title: Explicația Miei
    gloss: 'Mia spune: Hârtia merge în pubela albastră, iar resturile alimentare merg în pubela maro.'
    note: '*goes in ..., and ... goes in ...* repetă aceeași structură pentru două feluri diferite de deșeuri.'
  en.a1.unit49.lesson03.teach.dialogue_line6:
    title: Întrebarea lui Daniel despre ziua de colectare
    gloss: 'Daniel spune: Am înțeles. Când este ziua de colectare?'
    note: '*Got it.* este o formulă informală pentru „Am înțeles.”'
  en.a1.unit49.lesson03.teach.dialogue_line7:
    title: "Răspunsul lui Mia"
    gloss: 'Mia spune: Pubelele de reciclare se scot marțea, iar gunoiul se scoate vinerea.'
    note: 'Atenție: Mia numește două zile diferite pentru două feluri diferite de deșeuri -- marți pentru reciclare, vineri pentru gunoiul obișnuit.'
  en.a1.unit49.lesson03.teach.dialogue_line8:
    title: Promisiunea lui Daniel
    gloss: 'Daniel spune: Mulțumesc! Data viitoare voi sorta totul corect.'
    note: '*I''ll sort everything correctly next time.* înseamnă „Data viitoare voi sorta totul corect.”'
  en.a1.unit49.lesson04.teach.reading_passage:
    title: Text despre cum funcționează sortarea deșeurilor
    gloss: 'Cum îți sortezi deșeurile: Multe blocuri de apartamente au pubele diferite pentru feluri diferite de deșeuri. Sticla merge de obicei în pubela verde, iar hârtia în pubela albastră. Resturile alimentare merg în pubela maro, iar tot restul în pubela neagră pentru gunoiul obișnuit. Ajută să știi ziua de colectare, pentru că pubelele sunt golite o singură dată pe săptămână. Daniel exersează rețete din cartea de bucate pe care a împrumutat-o de la bibliotecă și gătește des cu Mia în apartamentul ei. Aseară a făcut o rețetă din carte, iar după aceea era cât pe ce să arunce un borcan de sticlă la gunoiul obișnuit. Mia l-a oprit și i-a arătat cum își sortează deșeurile blocul ei. I-a explicat că pubelele de reciclare se scot marțea, iar gunoiul obișnuit vinerea. Daniel i-a fost recunoscător și a spus că de acum încolo va sorta totul corect.'
    note: '*almost put a glass jar in the regular trash* înseamnă „era cât pe ce să arunce un borcan de sticlă la gunoiul obișnuit”.'
