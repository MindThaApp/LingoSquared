  en.a1.unit49.lesson02.teach.the_green_bin_is_for_glass:
    title: The green bin is for glass.
    gloss: Pubela verde este pentru sticlă.
    note: '*is for ...* înseamnă „este pentru ...” și arată la ce este destinat ceva.'
  en.a1.unit49.lesson02.teach.can_you_take_out_the_trash:
    title: Can you take out the trash?
    gloss: Poți scoate gunoiul afară?
    note: '*take out* este un verb cu particulă: *take out the trash* și *take the trash out* sunt ambele corecte. Particula *out* poate sta după obiect.'
