course:
  title: Engleză B2
  description: Învață engleza la nivel B2 pentru conversații nuanțate, argumentare, ipoteze și discuții profesionale, cu explicații în română.
units:
  en.b2.unit07.negotiation:
    title: On condition that the scope is reduced
lessons:
  en.b2.unit07.lesson01_terms_and_concessions:
    title: Condiții, refuzuri și concesii
  en.b2.unit07.lesson02_conditional_terms:
    title: I can agree on condition that...
  en.b2.unit07.lesson03.reading_revised_terms:
    title: 'Lectură: ce s-a convenit?'
  en.b2.unit07.lesson04.the_negotiation_dialogue:
    title: Agreed, with a condition
teaching:
  en.b2.unit07.lesson01.teach.term:
    title: term
    gloss: clauză, element al unui acord
    note: '*term* este un element al unui acord. Aici nu înseamnă termen de școală sau trimestru.'
    example_gloss: O clauză este un element al unui acord.
  en.b2.unit07.lesson01.teach.proposal:
    title: proposal
    gloss: propunere
    note: '*proposal* este o propunere de clauze posibile.'
    example_gloss: O propunere sugerează clauze posibile.
  en.b2.unit07.lesson01.teach.refusal:
    title: refusal
    gloss: refuz, respingere
    note: '*refusal* spune că o clauză nu este acceptabilă. În engleză, un refuz clar sună adesea mai bine dacă adaugi și un motiv.'
    example_gloss: Un refuz spune că o clauză nu este acceptabilă.
  en.b2.unit07.lesson01.teach.concession:
    title: concession
    gloss: concesie
    note: '*concession* înseamnă că renunți la o parte din poziția ta pentru a face posibil un acord.'
    example_gloss: O concesie înseamnă renunțarea la o parte dintr-o poziție.
  en.b2.unit07.lesson01.teach.scope:
    title: scope
    gloss: amploarea lucrării
    note: '*scope* este cât de multă muncă este inclusă. În negocieri poți cântări termenul-limită și *scope* unul față de celălalt.'
    example_gloss: Amploarea lucrării este cantitatea de muncă inclusă.
  en.b2.unit07.lesson01.teach.condition:
    title: condition
    gloss: condiție
    note: '*condition* este ceva care trebuie îndeplinit înainte ca un acord să funcționeze.'
    example_gloss: O condiție trebuie îndeplinită înainte ca acordul să funcționeze.
  en.b2.unit07.lesson02.teach.condition_deadline:
    title: Concesie condiționată
    gloss: Pot fi de acord cu termenul-limită mai devreme, cu condiția ca amploarea lucrării să fie redusă.
    note: '*I can agree... on condition that...* este clar, dar profesionist. Nu atenuează devenind vag.'
  en.b2.unit07.lesson02.teach.cannot_agree:
    title: Refuz clar
    gloss: Nu pot fi de acord cu marți ca termen-limită pentru lucrarea în întregime.
    note: '*I cannot agree to...* sună mai profesionist decât un refuz brusc de tipul *No, that is impossible*.'
  en.b2.unit07.lesson02.teach.accept_if:
    title: Acceptare cu if
    gloss: Pot accepta asta dacă anexa completă vine săptămâna viitoare.
    note: '*I can accept that if...* face condiția explicită.'
  en.b2.unit07.lesson02.teach.grammar_concession:
    title: Refuzul care continuă negocierea
    gloss: Folosește I cannot agree pentru a trasa clar o limită. Folosește I can agree on condition that pentru a oferi o concesie condiționată.
    note: Directețea poate suna dură în engleză. Dă limita, motivul și condiția.
  en.b2.unit07.lesson03.teach.executive_summary:
    title: executive summary
    gloss: rezumat executiv
    note: '*executive summary* este rezumatul scurt cu punctele principale ale unui raport.'
    example_gloss: Un rezumat executiv prezintă punctele principale ale unui raport.
  en.b2.unit07.lesson03.teach.charts:
    title: charts
    gloss: grafice, diagrame
    note: '*charts* arată informațiile în mod vizual.'
    example_gloss: Graficele arată informațiile în mod vizual.
  en.b2.unit07.lesson03.teach.reading_passage:
    title: 'Lectură: condiții revizuite'
    gloss: 'Priya a propus mai întâi joi ca termen-limită pentru raportul complet. Marcus s-a opus, pentru că clientul avea nevoie de ceva mai devreme. Priya a refuzat marți pentru lucrarea în întregime, pentru că ar fi pus calitatea în pericol. Apoi a oferit o concesie condiționată: marți era posibil dacă amploarea lucrării era redusă la rezumatul executiv și la grafice. Marcus a acceptat această condiție, dar a adăugat o clauză: anexa completă trebuia să vină săptămâna următoare. Rezultatul convenit a fost marți pentru rezumat și grafice și săptămâna următoare pentru anexă.'
    note: 'Negocierea este fermă, dar profesionistă: refuz, motiv, condiție și acord.'
  en.b2.unit07.lesson04.teach.q_thursday:
    title: Priya face o propunere
    gloss: 'Priya spune: Putem livra raportul până joi dacă amploarea lucrării rămâne cea planificată.'
    note: Ea leagă imediat termenul-limită de amploarea lucrării.
  en.b2.unit07.lesson04.teach.a_tuesday:
    title: Marcus se opune
    gloss: 'Marcus spune: Joi e prea târziu pentru client. Poți să-l livrezi până marți?'
    note: El cere un termen-limită mai devreme, fără să schimbe imediat amploarea lucrării.
  en.b2.unit07.lesson04.teach.q_cannot_tuesday:
    title: Priya refuză, cu motiv
    gloss: 'Priya spune: Nu pot fi de acord cu marți pentru lucrarea în întregime. Ar pune calitatea în pericol.'
    note: Motivul face refuzul profesionist și mai puțin brusc.
  en.b2.unit07.lesson04.teach.a_what_possible:
    title: Marcus întreabă despre condiții
    gloss: 'Marcus spune: Ce ar face marțea posibilă?'
    note: Această întrebare deschide ușa către o concesie condiționată.
  en.b2.unit07.lesson04.teach.q_condition:
    title: Priya oferă o condiție
    gloss: 'Priya spune: Pot fi de acord cu termenul-limită mai devreme, cu condiția ca amploarea lucrării să fie redusă la rezumatul executiv și la grafice.'
    note: '*on condition that* este explicit și profesionist.'
  en.b2.unit07.lesson04.teach.a_accept_appendix:
    title: Marcus acceptă cu o condiție suplimentară
    gloss: 'Marcus spune: Pot accepta asta dacă anexa completă vine săptămâna viitoare.'
    note: El acceptă, dar stabilește când se livrează restul.
  en.b2.unit07.lesson04.teach.q_agreed:
    title: Priya încheie acordul
    gloss: 'Priya spune: De acord. Marți pentru rezumat și grafice, iar săptămâna viitoare pentru anexă.'
    note: '*Agreed* încheie negocierea scurt și clar.'
