course:
  title: Engleză B2
  description: Învață engleza la nivel B2 pentru conversații nuanțate, argumentare, ipoteze și discuții profesionale, cu explicații în română.
units:
  en.b2.unit08.synthesis:
    title: Where the sources agree and conflict
lessons:
  en.b2.unit08.lesson01_source_relationships:
    title: Concordanță, contradicție și argumentare
  en.b2.unit08.lesson02_linking_sources:
    title: Both sources agree, but...
  en.b2.unit08.lesson03.reading_two_sources:
    title: 'Lectură: un sondaj și un raport al operatorului'
  en.b2.unit08.lesson04.the_synthesis_dialogue:
    title: Which account is better supported?
teaching:
  en.b2.unit08.lesson01.teach.source:
    title: source
    gloss: sursă
    note: '*source* este o sursă care oferă informații. Nu folosi *according to* peste tot; uneori este vorba de concordanță sau de contradicție între surse.'
    example_gloss: O sursă oferă informații.
  en.b2.unit08.lesson01.teach.synthesize:
    title: synthesize
    gloss: a reuni, a sintetiza
    note: '*synthesize* înseamnă a combina informații din mai multe surse într-un răspuns coerent.'
    example_gloss: A sintetiza înseamnă a combina informații din surse.
  en.b2.unit08.lesson01.teach.evaluate:
    title: evaluate
    gloss: a evalua, a aprecia
    note: '*evaluate* înseamnă a aprecia cât de solid este ceva.'
    example_gloss: A evalua înseamnă a estima cât de solid este ceva.
  en.b2.unit08.lesson01.teach.agreement:
    title: agreement
    gloss: concordanță, acord
    note: '*agreement* înseamnă că sursele spun același lucru despre un aspect.'
    example_gloss: Concordanța înseamnă că sursele spun același lucru.
  en.b2.unit08.lesson01.teach.conflict:
    title: conflict
    gloss: contradicție, divergență
    note: '*conflict* înseamnă că sursele se contrazic sau diferă asupra unui aspect.'
    example_gloss: Contradicția înseamnă că sursele nu sunt de acord.
  en.b2.unit08.lesson01.teach.judgement:
    title: judgment
    gloss: judecată, apreciere argumentată
    note: '*judgment* este o apreciere argumentată despre care sursă este mai solidă. În engleza americană se scrie *judgment*; în engleza britanică apare și *judgement*.'
    example_gloss: O apreciere argumentată explică care sursă este mai solidă.
  en.b2.unit08.lesson02.teach_agree_conflict:
    title: Concordanță plus contradicție
    gloss: Ambele surse sunt de acord că cererea a crescut, dar nu sunt de acord asupra cauzei.
    note: '*Both sources agree... but they disagree...* este mai bun decât două propoziții separate cu *according to* repetat.'
  en.b2.unit08.lesson02.teach_by_contrast:
    title: by contrast
    gloss: în schimb, prin contrast
    note: Folosește *By contrast* când contrastezi cu adevărat două surse sau două idei. Nu-l folosi ca simplu cuvânt de umplutură pentru orice „în schimb”.
  en.b2.unit08.lesson02.teach_better_supported:
    title: better supported
    gloss: mai bine susținut
    note: '*better supported on the cause* înseamnă că dovezile pentru cauză sunt mai solide.'
  en.b2.unit08.lesson02.teach_grammar_synthesis:
    title: Construirea unei sinteze
    gloss: O sinteză trebuie să spună unde concordă sursele, unde se contrazic și care relatare este mai bine susținută.
    note: Folosește *agree*, *conflict* și *better supported* pentru a preciza relațiile dintre surse.
  en.b2.unit08.lesson03.teach_survey:
    title: survey
    gloss: sondaj, anchetă
    note: '*survey* adună răspunsuri sau observații de la mai multe persoane.'
    example_gloss: Un sondaj poate aduna multe observații.
  en.b2.unit08.lesson03.teach_account:
    title: account
    gloss: relatare, prezentare
    note: '*account* este o relatare sau o explicație a ceea ce s-a întâmplat.'
    example_gloss: O relatare explică ce s-a întâmplat.
  en.b2.unit08.lesson03.teach.source_a:
    title: Source A
    gloss: 'Sursa A: Sondajul printre pasageri spune că autobuzele întârziate au devenit mai frecvente după deschiderea noului spital. Mulți pasageri spun că traseul este acum aglomerat, mai ales dimineața. Sondajul susține că principala cauză este cererea mai mare.'
    note: Sursa A conține multe observații ale pasagerilor, dar asta nu este automat cea mai solidă dovadă pentru cauză.
  en.b2.unit08.lesson03.teach.source_b:
    title: Source B
    gloss: 'Sursa B: Raportul operatorului este de acord că cererea a crescut după deschiderea spitalului, dar indică lipsa de șoferi drept principala cauză a serviciului întârziat. Raportul include evidența personalului pentru aceeași perioadă.'
    note: '*staffing records* oferă dovezi mai solide pentru cauză decât simpla experiență a pasagerilor.'
  en.b2.unit08.lesson04.teach.q_survey:
    title: Tessa menționează sursa A
    gloss: 'Tessa spune: Am citit două relatări despre serviciul de autobuz întârziat. Sondajul printre pasageri spune că cererea a crescut după deschiderea noului spital.'
    note: Aceasta introduce o sursă și o idee despre cererea mai mare.
  en.b2.unit08.lesson04.teach.a_operator:
    title: Rowan menționează sursa B
    gloss: 'Rowan spune: Raportul operatorului este de acord că cererea a crescut, dar spune că principala problemă a fost lipsa de șoferi.'
    note: Sursa B confirmă o idee, dar diferă în privința cauzei.
  en.b2.unit08.lesson04.teach.q_agree_conflict:
    title: Tessa face sinteza
    gloss: 'Tessa spune: Deci sursele concordă asupra cererii mai mari, dar se contrazic în privința cauzei.'
    note: '*agree on* și *conflict about* rezumă relația dintre surse.'
  en.b2.unit08.lesson04.teach.a_better_supported:
    title: Rowan întreabă despre dovezi
    gloss: 'Rowan întreabă: Care relatare este mai bine susținută?'
    note: El cere o apreciere, nu doar un rezumat.
  en.b2.unit08.lesson04.teach.q_evidence_compare:
    title: Tessa compară dovezile
    gloss: 'Tessa spune: Sondajul are multe observații ale pasagerilor, dar raportul operatorului include evidența personalului.'
    note: 'Aceasta este o întrebare despre dovezi: observații față de date.'
  en.b2.unit08.lesson04.teach.a_judgement_question:
    title: Rowan cere o apreciere
    gloss: 'Rowan întreabă: Și atunci, ce părere ai?'
    note: '*judgment* cere o concluzie argumentată.'
  en.b2.unit08.lesson04.teach.q_final_judgement:
    title: Tessa își spune părerea
    gloss: 'Tessa spune: Raportul operatorului este mai bine susținut în privința cauzei, deși sondajul este util pentru a arăta experiența pasagerilor.'
    note: '*although* păstrează ambele surse în vedere, chiar dacă tragi o concluzie.'
