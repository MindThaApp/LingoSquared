course:
  title: Engleză B1
  description: Învață engleza la nivel B1, pentru obligații, posibilități, situații ipotetice și povestiri de zi cu zi, cu explicații detaliate în română.
units:
  en.b1.unit01.necessity:
    title: Lucruri pe care trebuie sau ar trebui să le fac
lessons:
  en.b1.unit01.lesson01.necessity_vocabulary:
    title: Must, have to și should
  en.b1.unit01.lesson02.saying_what_you_must_do:
    title: I must, I have to, she has to
  en.b1.unit01.lesson03.past_regret_and_prohibition:
    title: Should have, must not, don't have to
  en.b1.unit01.lesson04.the_gym_membership_dialogue:
    title: You must not forget again
teaching:
  en.b1.unit01.lesson01.teach.must:
    title: must
    gloss: a trebui (obligație personală puternică)
    note: '*must* exprimă o obligație personală puternică: ceva ce tu însuți consideri foarte important.'
    example_gloss: Trebuie să termin sarcina asta astăzi.
  en.b1.unit01.lesson01.teach.have_to:
    title: have to
    gloss: a trebui (obligație venită din exterior)
    note: '*have to* exprimă o obligație venită din exterior, de exemplu dintr-o regulă sau dintr-un termen-limită.'
    example_gloss: Trebuie să plătesc chiria până vineri.
  en.b1.unit01.lesson01.teach.should:
    title: should
    gloss: ar trebui / ar fi bine să
    note: '*should* este o recomandare, nu o obligație strictă.'
    example_gloss: Ar trebui să suni la dentist în curând.
  en.b1.unit01.lesson01.teach.task:
    title: task
    gloss: sarcină
    note: '*task* înseamnă o sarcină sau o muncă ce trebuie făcută.'
    example_gloss: Mai am o sarcină de terminat.
  en.b1.unit01.lesson01.teach.rent:
    title: rent
    gloss: chirie
    note: '*rent* înseamnă banii pe care îi plătești pentru locuință.'
    example_gloss: Chiria se plătește vineri.
  en.b1.unit01.lesson01.teach.appointment:
    title: appointment
    gloss: programare
    note: '*appointment* înseamnă o întâlnire stabilită cu cineva, de exemplu la medic.'
    example_gloss: Săptămâna asta am programare la dentist.
  en.b1.unit01.lesson02.teach.must_finish_task:
    title: a exprima o obligație puternică
    gloss: Trebuie să termin sarcina asta astăzi.
    note: '*I must* exprimă o obligație personală puternică.'
  en.b1.unit01.lesson02.teach.have_to_pay_rent:
    title: a exprima o obligație externă
    gloss: Trebuie să plătesc chiria până vineri.
    note: '*I have to* exprimă o obligație venită din exterior, cum este un termen de plată.'
  en.b1.unit01.lesson02.teach.she_has_to_make:
    title: Forma la 'she'
    gloss: Ea trebuie să facă o programare.
    note: La *he/she/it*, *have to* devine *has to*.
  en.b1.unit01.lesson02.teach.you_should_call:
    title: a face o recomandare
    gloss: Ar trebui să suni și să confirmi programarea.
    note: '*should* dă o recomandare, nu o obligație strictă ca *must* sau *have to*.'
  en.b1.unit01.lesson02.teach.grammar_agreement:
    title: Formele lui 'have to'
    gloss: Trebuie să plec. Ea trebuie să plece. Noi trebuie să plecăm. Ei trebuie să plece.
    note: Doar la *he/she/it*, *have* devine *has*; la toate celelalte persoane rămâne *have to*.
  en.b1.unit01.lesson03.teach.should_have_called:
    title: Exprimarea regretului față de trecut
    gloss: Ar fi trebuit să sun mai devreme.
    note: '*should have* + participiul trecut exprimă regretul pentru ceva ce nu ai făcut.'
    example_gloss: Ar fi trebuit să sun mai devreme.
  en.b1.unit01.lesson03.teach.must_not:
    title: must not
    gloss: nu ai voie / este interzis
    note: '*must not* exprimă o interdicție: ceva nu este permis în niciun caz. Atenție: *must not* nu înseamnă „nu trebuie” în sensul de „nu e nevoie”, ci „nu ai voie”; „nu e nevoie” se spune *don''t have to*.'
    example_gloss: Să nu mai uiți încă o dată.
  en.b1.unit01.lesson03.teach.dont_have_to:
    title: don't have to
    gloss: nu trebuie / nu e nevoie
    note: '*don''t have to* înseamnă că ceva nu este obligatoriu; este diferit de *must not* (interdicție).'
    example_gloss: Nu trebuie să vii dacă ești ocupat.
  en.b1.unit01.lesson03.teach.grammar_past_regret:
    title: Regret, interdicție și lipsa obligației
    gloss: Ar fi trebuit să sun. Am uitat. Să nu mai uiți încă o dată. Nu trebuie să vii.
    note: '*should have* + participiul trecut exprimă regret pentru trecut. *must not* este o interdicție; *don''t have to* înseamnă că nu e obligatoriu, dar este permis.'
  en.b1.unit01.lesson03.teach.reading_passage:
    title: 'Text de citit: sala de fitness'
    gloss: Ieri, Daniel a uitat să-și reînnoiască abonamentul la sala de sport. Ar fi trebuit să-și pună un memento pe telefon. Acum trebuie să plătească o taxă de întârziere. Luna viitoare nu are voie să uite din nou.
    note: Un text scurt despre greșeala lui Daniel și consecințele ei.
  en.b1.unit01.lesson04.teach.q_renew_gym:
    title: Leila întreabă despre abonament
    gloss: 'Leila spune: Daniel, ți-ai reînnoit abonamentul la sala de sport?'
    note: O întrebare directă, pentru a verifica dacă ceva a fost deja făcut.
  en.b1.unit01.lesson04.teach.a_forgot_should_have:
    title: 'Răspunsul lui Daniel: a uitat'
    gloss: 'Daniel spune: Vai, am uitat! Ar fi trebuit să fac asta săptămâna trecută.'
    note: '*I should have done that* exprimă regretul pentru ceva ce nu s-a făcut.'
  en.b1.unit01.lesson04.teach.q_call_today:
    title: Leila îl avertizează pe Daniel
    gloss: 'Leila spune: Trebuie să-i suni astăzi, altfel plătești o taxă de întârziere.'
    note: '*must* exprimă aici un avertisment personal urgent.'
  en.b1.unit01.lesson04.teach.a_also_pay_rent:
    title: Daniel menționează alte obligații
    gloss: 'Daniel spune: Ai dreptate. Trebuie să plătesc și chiria până vineri și ar trebui să sun și la dentist.'
    note: Daniel îmbină *have to* (obligație) cu *should* (recomandare) într-un singur răspuns.
  en.b1.unit01.lesson04.teach.q_dont_have_to:
    title: Leila îl liniștește pe Daniel
    gloss: 'Leila spune: Nu trebuie să faci totul astăzi. Dar să nu uiți din nou de sala de sport.'
    note: Leila pune în contrast *don't have to* (nu e obligatoriu) cu *must not* (interdicție).
  en.b1.unit01.lesson04.teach.a_more_organized:
    title: Daniel ia o hotărâre
    gloss: 'Daniel spune: Știu. Luna asta trebuie să fiu mai organizat.'
    note: '*I must be* exprimă aici o hotărâre personală.'
