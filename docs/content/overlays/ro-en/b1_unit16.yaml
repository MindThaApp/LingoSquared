teaching:
  en.b1.unit16.lesson01.teach.advice:
    title: advice
    gloss: sfat
    note: '*advice* înseamnă o părere despre ce ar trebui să facă cineva.'
    example_gloss: Leila i-a dat lui Daniel un sfat util.
  en.b1.unit16.lesson01.teach.suggest:
    title: suggest
    gloss: a propune, a sugera
    note: '*suggest* înseamnă a propune o idee spre analiză.'
    example_gloss: Leila a sugerat o modalitate de a-și gestiona volumul de muncă.
  en.b1.unit16.lesson01.teach.overwhelmed:
    title: overwhelmed
    gloss: copleșit
    note: '*overwhelmed* înseamnă că simți că ai de făcut mai mult decât poți.'
    example_gloss: Daniel s-a simțit copleșit de cele două proiecte ale sale.
  en.b1.unit16.lesson01.teach.prioritize:
    title: prioritize
    gloss: a stabili prioritățile, a prioritiza
    note: '*prioritize* înseamnă a face mai întâi sarcina cea mai importantă.'
    example_gloss: Daniel a hotărât să prioritizeze proiectul cu termenul cel mai apropiat.
  en.b1.unit16.lesson01.teach.workload:
    title: workload
    gloss: volum de muncă
    note: '*workload* înseamnă cantitatea totală de muncă pe care trebuie s-o facă cineva.'
    example_gloss: Volumul de muncă al lui Daniel a crescut după ce s-a alăturat echipei în martie.
  en.b1.unit16.lesson01.teach.decline:
    title: decline
    gloss: a refuza
    note: '*decline* înseamnă a refuza politicos o propunere sau o ofertă.'
    example_gloss: Daniel putea fie să urmeze sfatul, fie să-l refuze politicos.
  en.b1.unit16.lesson02.teach.if_i_were_you:
    title: if I were you, I would + Grundform
    gloss: Dacă aș fi în locul tău, aș vorbi cu șeful tău.
    note: '*if I were you, I would* este forma de condiție ireală folosită pentru a da un sfat.'
  en.b1.unit16.lesson02.teach.you_should_prioritize:
    title: you should + Grundform
    gloss: Ar trebui să prioritizezi proiectul cu termenul cel mai apropiat.
    note: '*you should* este o recomandare directă.'
  en.b1.unit16.lesson02.teach.how_about:
    title: how about + -ing
    gloss: Ce-ar fi să rogi un coleg sau o colegă să te ajute?
    note: '*how about + -ing* este un mod mai blând de a propune ceva.'
  en.b1.unit16.lesson02.teach.grammar_advice_forms:
    title: Formen, um Rat zu geben
    gloss: 'Sfaturile și propunerile folosesc forme diferite: If I were you, I would... (o ipoteză ireală), You should... (o recomandare directă) și How about + -ing...? (o propunere mai blândă). Alege o formă mai puternică sau mai blândă, în funcție de cât de ferm vrei să sune.'
    note: 'Formă: alege între o ipoteză ireală, o recomandare directă sau o propunere blândă.'
  en.b1.unit16.lesson03.teach.deadline:
    title: deadline
    gloss: termen limită
    note: '*deadline* înseamnă data până la care trebuie terminat ceva.'
    example_gloss: Următorul termen limită al lui Daniel este vinerea viitoare.
  en.b1.unit16.lesson03.teach.that_makes_sense:
    title: that makes sense. I'll try it.
    gloss: Are sens. O să încerc.
    note: '*that makes sense* arată că înțelegi sfatul și îl accepți.'
    example_gloss: Are sens. O să încerc săptămâna asta.
  en.b1.unit16.lesson03.teach.reading_passage:
    title: 'Lesetext: Rat bei zu viel Arbeit'
    gloss: Salut, Leila, mă simt copleșit săptămâna asta. Conduc două proiecte și, pe lângă asta, mai am și cursul de seară. Ai vreun sfat? Salut, Daniel, dacă aș fi în locul tău, aș vorbi cu șeful tău despre volumul de muncă. Ar trebui să prioritizezi și proiectul cu termenul cel mai apropiat. Ce-ar fi să-i ceri Miei să te ajute la celălalt proiect? Mulțumesc, are sens. O să încerc și o să-ți spun cum merge.
    note: Un sfat scurt și prietenos între colegi.
  en.b1.unit16.lesson04.teach.q_overwhelmed_two_projects:
    title: Daniel erklärt sein Problem
    gloss: 'Daniel spune: Mă simt puțin copleșit. Conduc două proiecte și, în plus, am cursul de seară de trei ori pe săptămână.'
    note: '*a little overwhelmed* descrie sentimentul că ai puțin prea multă muncă.'
  en.b1.unit16.lesson04.teach.a_talk_to_manager:
    title: Leila gibt ihren ersten Rat
    gloss: 'Leila spune: Dacă aș fi în locul tău, aș vorbi cu șeful tău despre volumul de muncă.'
    note: '*if I were you, I would* este forma ipotetică ireală.'
  en.b1.unit16.lesson04.teach.q_dont_want_to_seem:
    title: Daniel zögert
    gloss: 'Daniel spune: E o idee bună, dar nu vreau să par că nu mă descurc.'
    note: '*I don''t want to seem like* exprimă îngrijorarea legată de impresia pe care o lași.'
  en.b1.unit16.lesson04.teach.a_prioritize_and_how_about:
    title: Leila macht zwei konkrete Vorschläge
    gloss: 'Leila spune: Ar trebui să prioritizezi mai întâi proiectul cu termenul cel mai apropiat. Ce-ar fi să rogi un coleg sau o colegă să te ajute la celălalt?'
    note: '*you should* și *how about* îmbină o propunere directă cu una blândă.'
  en.b1.unit16.lesson04.teach.q_ask_mia_this_week:
    title: Daniel nimmt den Rat an
    gloss: 'Daniel spune: Îmi place. O s-o întreb pe Mia dacă are timp săptămâna asta.'
    note: '*I like that* arată că accepți sfatul.'
  en.b1.unit16.lesson04.teach.a_sounds_like_solid_plan:
    title: Leila bestätigt den Plan
    gloss: 'Leila spune: Sună a plan solid.'
    note: O încheiere scurtă și încurajatoare a conversației.
