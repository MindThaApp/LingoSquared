    title: Textul unei politici de returnare
    gloss: 'Politica de retur: Articolele pot fi returnate în termen de 30 de zile, cu bon fiscal. Articolele defecte pot fi schimbate sau rambursate oricând.'
    note: O politică de retur oficială, cu un termen și o excepție pentru articolele defecte.
