teaching:
  en.b1.unit08.lesson01.teach.before:
    title: before
    gloss: înainte de, înainte să
    note: '*before* înseamnă mai devreme decât un alt eveniment.'
    example_gloss: Spală-te pe mâini înainte să gătești.
  en.b1.unit08.lesson01.teach.after:
    title: after
    gloss: după, după ce
    note: '*after* înseamnă mai târziu decât un alt eveniment.'
    example_gloss: Sună-mă după ce termini munca.
  en.b1.unit08.lesson01.teach.as_soon_as:
    title: as soon as
    gloss: imediat ce
    note: '*as soon as* înseamnă chiar în momentul în care se întâmplă ceva.'
    example_gloss: Imediat ce ajung, îți scriu.
  en.b1.unit08.lesson01.teach.by_the_time:
    title: by the time
    gloss: până când (cel târziu atunci)
    note: '*by the time* înseamnă cel târziu până în momentul în care se întâmplă ceva.'
    example_gloss: Până ajunge Mia, cina e gata.
  en.b1.unit08.lesson01.teach.check_in:
    title: check in
    gloss: a da de știre că ai ajuns cu bine
    note: '*check in* înseamnă a anunța pe cineva, pe scurt, că ai ajuns sau că ești în siguranță.'
    example_gloss: Dă-mi un semn când ajungi la hotel.
  en.b1.unit08.lesson01.teach.lock_up:
    title: lock up
    gloss: a încuia (clădirea, la plecare)
    note: '*lock up* înseamnă a închide și a asigura o încăpere sau o clădire.'
    example_gloss: Încui biroul înainte să plec.
  en.b1.unit08.lesson02.teach.as_soon_as_home:
    title: A face ceva imediat după
    gloss: Imediat ce ajung acasă, te sun.
    note: '*as soon as* arată că a doua acțiune are loc imediat după prima.'
  en.b1.unit08.lesson02.teach.before_upstairs:
    title: A face ceva mai întâi
    gloss: Te rog să te uiți la poștă înainte să urci.
    note: '*before* arată care acțiune trebuie să aibă loc prima.'
  en.b1.unit08.lesson02.teach.grammar_future_time_clause:
    title: Prezentul în propozițiile temporale
    gloss: Când ajung acasă, te sun. Te rog să te uiți la poștă înainte să urci.
    note: 'În propozițiile temporale din engleză se folosește prezentul pentru evenimentul viitor: *when I get home*, nu *when I will get home*.'
  en.b1.unit08.lesson03.teach.front_door:
    title: front door
    gloss: ușa de la intrare
    note: '*front door* este ușa principală din fața unei case sau a unei clădiri.'
    example_gloss: Daniel încuie ușa de la intrare după ce se uită la poștă.
  en.b1.unit08.lesson03.teach.ready:
    title: ready
    gloss: gata, pregătit
    note: '*ready* înseamnă pregătit sau gata de folosit.'
    example_gloss: Până ajunge Mia, cina e gata.
  en.b1.unit08.lesson03.teach.reading_passage:
    title: 'Text de citit: planul de seară'
    gloss: Daniel are o rutină de seară atentă. Când ajunge acasă, se uită mai întâi la poștă. După ce se uită la poștă, încuie ușa de la intrare. Înainte să înceapă cina, se spală pe mâini și strânge masa. Până ajunge Mia, bucătăria e pregătită, iar mâncarea e caldă.
    note: Un text scurt cu *when*, *after*, *before* și *by the time*.
  en.b1.unit08.lesson04.teach.q_call_when_home:
    title: Leila cere să fie sunată
    gloss: 'Leila spune: Daniel, mă poți suna când ajungi acasă?'
    note: O întrebare cu *when*, care spune momentul acțiunii.
  en.b1.unit08.lesson04.teach.a_as_soon_as_home:
    title: Daniel promite că sună imediat
    gloss: 'Daniel spune: Sigur. Imediat ce ajung acasă, te sun.'
    note: '*as soon as* arată că sună imediat.'
  en.b1.unit08.lesson04.teach.q_check_mail:
    title: Leila dă o primă sarcină
    gloss: 'Leila spune: Te rog să te uiți la poștă înainte să urci.'
    note: '*before* arată că poșta vine prima.'
  en.b1.unit08.lesson04.teach.a_after_mail_lock:
    title: Daniel spune următorul pas
    gloss: 'Daniel spune: Bine. După ce mă uit la poștă, încui ușa de la intrare.'
    note: '*after* arată ordinea dintre două acțiuni.'
  en.b1.unit08.lesson04.teach.q_by_the_time_mia:
    title: Leila spune momentul
    gloss: 'Leila spune: Bun. Până ajunge Mia, ar trebui să fie totul gata.'
    note: '*by the time* înseamnă că totul trebuie să fie gata cel târziu în acel moment.'
  en.b1.unit08.lesson04.teach.a_start_dinner:
    title: Daniel finalizează planul
    gloss: 'Daniel spune: Atunci putem începe cina când ajunge ea.'
    note: '*when she arrives* spune momentul în care pot începe.'
