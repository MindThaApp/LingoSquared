teaching:
  en.a1.unit35.lesson01.teach.phone:
    title: phone
    gloss: telefon
    note: '*phone* înseamnă telefon.'
    example_gloss: O sun pe mama de pe telefonul meu.
  en.a1.unit35.lesson01.teach.laptop:
    title: laptop
    gloss: calculator portabil
    note: '*laptop* înseamnă calculator portabil.'
    example_gloss: Ea folosește calculatorul ei portabil pentru muncă.
  en.a1.unit35.lesson01.teach.tablet:
    title: tablet
    gloss: tabletă
    note: '*tablet* înseamnă tabletă.'
    example_gloss: El citește cărți pe tableta lui.
  en.a1.unit35.lesson01.teach.computer:
    title: computer
    gloss: calculator
    note: '*computer* înseamnă calculator.'
    example_gloss: Avem un calculator acasă.
  en.a1.unit35.lesson01.teach.app:
    title: app
    gloss: aplicație
    note: '*app* înseamnă aplicație.'
    example_gloss: Am o aplicație nouă pe telefon.
  en.a1.unit35.lesson01.teach.camera:
    title: camera
    gloss: aparat foto
    note: '*camera* înseamnă aparat foto sau cameră foto.'
    example_gloss: Acest aparat foto face poze minunate.
  en.a1.unit35.lesson02.teach.make_a_call:
    title: make a call
    gloss: a suna
    note: '*make a call* este o combinație fixă de verb + substantiv, pe care trebuie s-o înveți împreună. În română ai un singur verb, „a suna”, fără un cuvânt separat pentru *call*, dar în engleză spui *make a call*.'
    example_gloss: Îmi sun fratele în fiecare duminică.
  en.a1.unit35.lesson02.teach.send_a_text:
    title: send a text
    gloss: a trimite un mesaj
    note: '*send a text* este, ca *make a call*, o combinație fixă de verb + substantiv. În română poți spune „a trimite un mesaj” sau „a da un mesaj”; în engleză expresia obișnuită este *send a text*.'
    example_gloss: Ea trimite un mesaj prietenei ei în fiecare dimineață.
  en.a1.unit35.lesson02.teach.download_an_app:
    title: download an app
    gloss: a descărca o aplicație
    note: '*download an app*: *download* este un verb obișnuit, care corespunde direct lui „a descărca”, așa că aceasta este cea mai ușoară dintre cele trei combinații fixe.'
    example_gloss: El descarcă o aplicație nouă în fiecare săptămână.
  en.a1.unit35.lesson02.teach.wifi:
    title: wifi
    gloss: internet fără fir
    note: '*wifi* înseamnă internet fără fir, o conexiune la internet fără cablu.'
    example_gloss: Internetul fără fir de la mine de acasă este rapid.
  en.a1.unit35.lesson02.teach.battery:
    title: battery
    gloss: baterie
    note: '*battery* înseamnă baterie.'
    example_gloss: Bateria telefonului meu este aproape descărcată.
  en.a1.unit35.lesson02.teach.how_use_phone_question:
    title: How do you use your phone?
    gloss: Cum îți folosești telefonul?
    note: '*Do you use ...?* folosește același *do* ca în alte întrebări din engleză.'
  en.a1.unit35.lesson03.teach.dialogue_line1:
    title: Plângerea Miei
    gloss: 'Mia spune: Telefonul meu e foarte vechi. E chiar lent.'
    note: '*so* + adjectiv (*so old*) întărește sensul, ca „foarte” sau „atât de” în română.'
  en.a1.unit35.lesson03.teach.dialogue_line2:
    title: Sfatul Leilei
    gloss: 'Leila spune: Ar trebui să-ți iei unul nou. Pentru ce îl folosești cel mai mult?'
    note: '*What do you use it for most?* se termină cu prepoziția *for*. În română prepoziția stă la început („Pentru ce îl folosești?”), dar în engleză începi cu *what*, iar *for* rămâne la sfârșit.'
  en.a1.unit35.lesson03.teach.dialogue_line3:
    title: "Răspunsul Miei"
    gloss: 'Mia spune: Mai ales le scriu mesaje surorii mele și fac poze.'
    note: '*text* poți folosi și ca verb (*I text my sister*). Este mai obișnuit decât *send a text*; ambele sunt engleză corectă.'
  en.a1.unit35.lesson03.teach.dialogue_line4:
    title: Cum folosește Leila telefonul
    gloss: 'Leila spune: Îmi sun părinții în fiecare weekend de pe telefon. Folosesc și multe aplicații.'
    note: '*call* ca verb (*I call my parents*) este varianta obișnuită, informală. *Make a call* este combinația fixă din lecția 2.'
  en.a1.unit35.lesson03.teach.dialogue_line5:
    title: Întrebarea Miei
    gloss: 'Mia întreabă: Ce aplicații folosești?'
    note: '*Which apps do you use?*: *which* întreabă despre o alegere dintr-un grup (aplicații), ca „care” în română.'
  en.a1.unit35.lesson03.teach.dialogue_line6:
    title: Aplicațiile Leilei
    gloss: 'Leila spune: Folosesc o aplicație de gătit și una de hărți. Vrei să le descarci?'
    note: '*Do you want to ...?* folosește auxiliarul *do*, deși *want* este un verb obișnuit.'
  en.a1.unit35.lesson03.teach.dialogue_line7:
    title: "Răspunsul Miei"
    gloss: 'Mia spune: Da, te rog, trimite-mi numele lor!'
    note: '*please* stă aici înaintea verbului (*please send ...*) și face cererea mai politicoasă.'
  en.a1.unit35.lesson04.teach.reading_passage:
    title: Text despre Daniel, Leila și Mia
    gloss: Daniel, Leila și Mia își folosesc telefoanele diferit. Lui Daniel nu îi place să trimită mesaje; preferă să sune oamenii. Leila folosește telefonul pentru hărți. Folosește și o aplicație de gătit când încearcă rețete noi. Mia face multe poze și le trimite familiei. Toți folosesc calculatoare portabile pentru muncă și fac apeluri video cu prietenii în weekend.
    note: '*He prefers to call people instead*: *instead* la sfârșitul propoziției înseamnă „în schimb” (adică în loc să trimită mesaje).'
