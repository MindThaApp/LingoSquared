    note: '*I''d like to...* înseamnă „Aș vrea să...”, aceeași formulare politicoasă ca în unitatea 47.'
  en.a1.unit48.lesson02.teach.when_is_this_book_due:
    title: When is this book due?
    gloss: Până când trebuie returnată această carte?
    note: Din nou cuvântul *due*, fără echivalent de un singur cuvânt în română.
  en.a1.unit48.lesson02.teach.can_i_return_this_book:
    title: Can I return this book?
    gloss: Pot returna această carte?
    note: '*Can I return this book?* înseamnă „Pot returna această carte?”'
  en.a1.unit48.lesson02.teach.your_book_is_due_on_friday:
    title: Your book is due on Friday.
    gloss: Cartea ta trebuie returnată vineri.
    note: '*due on Friday* folosește *on* pentru o zi anume.'
  en.a1.unit48.lesson03.teach.dialogue_line1:
    title: Propunerea Leilei
    gloss: 'Leila spune: Trebuie să returnez cartea aceasta la bibliotecă. Vrei să vii cu mine?'
    note: '*Do you want to come with me?* înseamnă „Vrei să vii cu mine?”'
  en.a1.unit48.lesson03.teach.dialogue_line2:
    title: Reacția lui Daniel
    gloss: 'Daniel spune: Sigur! Nu cred că am mai împrumutat vreodată o carte de la o bibliotecă.'
    note: '*I don''t think I''ve ever ...* înseamnă „Nu cred că am ... vreodată”, cu prezentul perfect (*have ever*).'
  en.a1.unit48.lesson03.teach.dialogue_line3:
    title: Leila la ghișeu
    gloss: 'Leila spune: Bună ziua, aș dori să returnez această carte și aș dori să împrumut și una nouă.'
    note: '*and I''d like to ... too* înseamnă „și aș dori să ... și eu”.'
  en.a1.unit48.lesson03.teach.dialogue_line4:
    title: Bibliotecara întreabă
    gloss: 'Bibliotecara spune: Perfect, mulțumesc. Ai permisul de bibliotecă la tine?'
    note: '*Do you have your library card?* înseamnă „Ai permisul de bibliotecă la tine?”'
  en.a1.unit48.lesson03.teach.dialogue_line5:
    title: "Răspunsul lui Leila"
    gloss: 'Leila spune: Da, poftim.'
    note: '*here it is* înseamnă „poftim” sau „iată-l”.'
  en.a1.unit48.lesson03.teach.dialogue_line6:
    title: Bibliotecara explică
    gloss: 'Bibliotecara spune: Perfect. Această carte nouă trebuie returnată în trei săptămâni.'
    note: '*due back in three weeks* înseamnă „de returnat în trei săptămâni”.'
  en.a1.unit48.lesson03.teach.dialogue_line7:
    title: Daniel vrea să împrumute și el
    gloss: 'Daniel spune: Pot primi și eu un permis de bibliotecă? Aș vrea să împrumut o carte de bucate.'
    note: '*Can I get ... too?* înseamnă „Pot primi și eu ...?”'
  en.a1.unit48.lesson03.teach.dialogue_line8:
    title: Bibliotecara îl ajută pe Daniel
    gloss: 'Bibliotecara spune: Desigur! Completează doar acest formular.'
    note: '*fill out this form* înseamnă „completează acest formular”; verbul *fill out* are două cuvinte, iar obiectul poate sta între ele (*fill it out*).'
  en.a1.unit48.lesson04.teach.reading_passage:
    title: Text despre cum funcționează o bibliotecă
    gloss: 'O vizită la bibliotecă: Majoritatea bibliotecilor te lasă să împrumuți cărți, uneori și alte obiecte, pentru câteva săptămâni. Pentru a împrumuta ceva, de obicei ai nevoie de un permis de bibliotecă. Când împrumuți o carte, bibliotecara îți spune termenul de returnare -- ziua în care trebuie s-o aduci înapoi. Dacă nu ai terminat-o până atunci, poți adesea să ceri bibliotecarei mai mult timp. De când s-a mutat în noul apartament, Leila nu mai are la fel de multe cărți ca înainte, așa că a început să le împrumute de la bibliotecă. Săptămâna trecută a returnat o carte și a luat una nouă, iar prietenul ei Daniel a mers cu ea. El nu mai împrumutase niciodată o carte de la bibliotecă, așa că și-a făcut propriul permis și a luat o carte de bucate, ca să exerseze rețetele pe care i le arată Mia. Bibliotecara le-a reamintit amândurora să-și aducă cărțile înapoi înainte de termen. Mia nu merge des la bibliotecă, dar odată a împrumutat o carte de fotografie pentru cursul ei.'
    note: '*checked out a cookbook* înseamnă „a împrumutat o carte de bucate” (*check out* este expresia fixă din engleză pentru a împrumuta de la bibliotecă).'
