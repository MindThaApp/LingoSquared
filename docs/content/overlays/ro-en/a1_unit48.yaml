    example_gloss: Pot returna această carte?
  en.a1.unit48.lesson01.teach.due:
    title: due
    gloss: de returnat până la / termen de returnare
    note: '*due* nu are un echivalent de un singur cuvânt în română; se spune de obicei „de returnat până la ...” sau „termenul de returnare este ...”, dar engleza o spune într-un singur cuvânt.'
    example_gloss: Până când trebuie returnată?
