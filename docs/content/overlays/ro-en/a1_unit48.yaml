  en.a1.unit48.lesson01.teach.borrow:
    title: borrow
    gloss: a împrumuta
    note: '*borrow* înseamnă a lua ceva de la altcineva (sau de la bibliotecă) ca să-l returnezi.'
    example_gloss: Aș vrea să împrumut această carte.
  en.a1.unit48.lesson01.teach.return:
