teaching:
  en.a2.unit38.lesson01.teach.reschedule:
    title: reschedule
    gloss: a reprograma
    note: '*reschedule* înseamnă a muta o programare la altă dată sau oră.'
    example_gloss: Trebuie să reprogramez reparația, pentru că atunci voi fi la serviciu.
  en.a2.unit38.lesson01.teach.neighbor:
    title: neighbor
    gloss: vecin, vecină
    note: '*neighbor* este persoana care locuiește lângă tine. Cuvântul englezesc nu arată dacă este bărbat sau femeie, spre deosebire de „vecin” și „vecină”.'
    example_gloss: Vecina mea poate să-i deschidă ușa instalatorului.
  en.a2.unit38.lesson01.teach.key:
    title: key
    gloss: cheie
    note: '*key* este obiectul mic din metal cu care deschizi ușa.'
    example_gloss: Las cheia la vecina mea.
  en.a2.unit38.lesson01.teach.leak:
    title: leak
    gloss: scurgere, pierdere de apă
    note: '*leak* este aici un substantiv: locul prin care iese apa. Verbul *to leak* înseamnă a curge sau a picura.'
    example_gloss: Scurgerea de sub chiuveta mea din bucătărie se agravează.
  en.a2.unit38.lesson01.teach.fixed:
    title: fixed
    gloss: reparat
    note: '*fixed* este participiul lui *to fix* (a repara) și înseamnă că ceva nu mai este stricat.'
    example_gloss: Chiuveta este acum reparată și apa nu mai curge.
  en.a2.unit38.lesson01.teach.afternoon:
    title: afternoon
    gloss: după-amiază
    note: '*afternoon* este partea zilei de după prânz; dimineața se spune *morning*.'
    example_gloss: Instalatorul a venit după-amiaza, nu dimineața.
  en.a2.unit38.lesson01.teach.grammar_cant_wont:
    title: can't și won't, când ceva nu merge
    gloss: Nu pot fi acasă între 14:00 și 16:00. După-amiaza nu voi fi acasă.
    note: '*can''t* spune că ceva nu este posibil. *won''t* spune că în viitor pur și simplu nu va fi așa.'
  en.a2.unit38.lesson02.teach.need_to_reschedule:
    title: Cum spui că vrei să muți programarea
    gloss: Trebuie să reprogramez reparația.
    note: '*I need to ...* este obiectiv și neutru: arată că e nevoie, dar nu sună nepoliticos.'
  en.a2.unit38.lesson02.teach.possible_in_the_morning:
    title: Cererea unei alte ore
    gloss: Ar fi posibil să veniți în schimb dimineața?
    note: '*Would it be possible to ...?* este cel mai prudent mod de a cere ceva. *instead* înseamnă „în schimb”.'
  en.a2.unit38.lesson02.teach.leave_key_with_neighbor:
    title: Cum spui unde e cheia
    gloss: Las cheia la vecina mea.
    note: '*leave something with someone* înseamnă a lăsa sau a da ceva în grija cuiva.'
  en.a2.unit38.lesson02.teach.is_the_leak_fixed:
    title: Întrebarea dacă problema a fost rezolvată
    gloss: Este scurgerea reparată acum?
    note: '*Is ... fixed?* întreabă despre rezultat, nu despre munca în sine.'
  en.a2.unit38.lesson02.teach.grammar_because_reason:
    title: Spunerea unui motiv cu because
    gloss: Nu pot fi acasă între 14:00 și 16:00, pentru că sunt la serviciu.
    note: '*because* leagă problema de motiv. Ca în română, ordinea cuvintelor nu se schimbă după el: verbul rămâne la locul lui obișnuit.'
  en.a2.unit38.lesson03.teach.message:
    title: message
    gloss: mesaj
    note: '*message* este orice mesaj scurt scris: un SMS, un mesaj de chat sau un e-mail scurt.'
    example_gloss: Am primit un mesaj despre noua oră a reparației.
  en.a2.unit38.lesson03.teach.rescheduling_text:
    title: Mesajul despre noua programare
    gloss: Reparația 6180 a fost reprogramată. Instalatorul vine mâine între 9:00 și 11:00. Vecina dumneavoastră va deschide ușa. Vă rugăm să confirmați astăzi, prin mesaj, această nouă oră.
    note: 'Un mesaj de la administrația blocului este scurt și la obiect: ce s-a schimbat, când și ce mai trebuie să faci.'
  en.a2.unit38.lesson03.teach.confirm_by_message:
    title: Cum ți se cere o confirmare
    gloss: Vă rugăm să confirmați astăzi, prin mesaj, această nouă oră.
    note: '*confirm* înseamnă a confirma; *by message* înseamnă prin mesaj.'
  en.a2.unit38.lesson04.teach.q_need_to_reschedule:
    title: Daniel sună la administrația clădirii
    gloss: 'Daniel spune: Bună ziua, trebuie să reprogramez reparația.'
    note: La telefon începi cu *Hello* și spui apoi imediat motivul apelului.
  en.a2.unit38.lesson04.teach.a_which_repair:
    title: Administrația clădirii întreabă ce reparație
    gloss: 'Administrația spune: Nicio problemă. Despre ce reparație este vorba?'
    note: '*Which repair is it?* întreabă despre un singur lucru dintr-un grup cunoscut.'
  en.a2.unit38.lesson04.teach.q_repair_6180:
    title: Daniel spune numărul reparației
    gloss: 'Daniel spune: Reparația 6180, scurgerea de sub chiuveta mea din bucătărie.'
    note: 'Același număr de reparație ca în unitatea 29: aceeași chiuvetă care curge.'
  en.a2.unit38.lesson04.teach.a_why_cant_you_be_home:
    title: Administrația clădirii întreabă motivul
    gloss: 'Administrația spune: Înțeleg. De ce nu puteți fi acasă?'
    note: '*Why can''t you ...?* întreabă care este motivul pentru care ceva nu merge.'
  en.a2.unit38.lesson04.teach.q_at_work_ask_morning:
    title: Daniel spune motivul și cere dimineața
    gloss: 'Daniel spune: Nu pot fi acasă între 14:00 și 16:00, pentru că sunt la serviciu. Ar fi posibil să veniți în schimb dimineața?'
    note: 'Mai întâi motivul, apoi cererea: sună mai politicos decât dacă ai cere imediat ceva.'
  en.a2.unit38.lesson04.teach.a_plumber_can_come_morning:
    title: Administrația clădirii propune un nou interval
    gloss: 'Administrația spune: Da, instalatorul poate veni între 9:00 și 11:00.'
    note: '*between 9am and 11am* este noul interval.'
  en.a2.unit38.lesson04.teach.q_leave_key:
    title: Daniel rezolvă problema cheii
    gloss: 'Daniel spune: Vă mulțumesc. Las cheia la vecina mea.'
    note: Aceeași propoziție ca în lecția 2.
  en.a2.unit38.lesson04.teach.a_please_confirm:
    title: Administrația clădirii cere confirmare
    gloss: 'Administrația spune: Bine. Vă rugăm să confirmați astăzi, prin mesaj, această nouă oră.'
    note: Aceeași rugăminte ca în mesajul din lecția 3.
  en.a2.unit38.lesson04.teach.q_will_confirm_this_afternoon:
    title: Daniel spune când confirmă
    gloss: 'Daniel spune: O voi confirma în după-amiaza aceasta.'
    note: '*this afternoon* înseamnă „în după-amiaza aceasta”, adică astăzi după ora 12.'
