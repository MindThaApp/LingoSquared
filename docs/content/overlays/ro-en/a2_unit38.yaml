  en.a2.unit38.lesson01.repair_visit_vocabulary:
    title: A reprograma, cheia și vecinii
  en.a2.unit38.lesson02.moving_the_appointment:
    title: Mutarea programării la altă oră
  en.a2.unit38.lesson03.reading_a_rescheduling_message:
