teaching:
  en.a1.unit47.lesson01.teach.appointment:
    title: appointment
    gloss: programare
    note: '*appointment* înseamnă programare (o întâlnire stabilită la o anumită oră).'
    example_gloss: Joi am o programare.
  en.a1.unit47.lesson01.teach.available:
    title: available
    gloss: disponibil / liber
    note: '*available* înseamnă disponibil sau liber.'
    example_gloss: Ești liber joi?
  en.a1.unit47.lesson01.teach.book:
    title: book
    gloss: a rezerva / a programa
    note: '*book* înseamnă aici „a rezerva” sau „a programa”, nu substantivul „carte”.'
    example_gloss: Aș vrea să fac o programare.
  en.a1.unit47.lesson01.teach.confirm:
    title: confirm
    gloss: a confirma
    note: '*confirm* înseamnă a confirma.'
    example_gloss: Poți confirma ora?
  en.a1.unit47.lesson01.teach.reschedule:
    title: reschedule
    gloss: a reprograma
    note: '*reschedule* înseamnă a muta o programare la altă dată sau oră.'
    example_gloss: Putem reprograma pentru vineri?
  en.a1.unit47.lesson02.teach.id_like_to_make_an_appointment:
    title: I'd like to make an appointment.
    gloss: Aș dori să fac o programare.
    note: '*I''d* este forma scurtă de la *I would*; *I''d like to ...* este o formulare politicoasă, ca „Aș dori să ...” în română.'
  en.a1.unit47.lesson02.teach.are_you_available_on_friday:
    title: Are you available on Friday?
    gloss: Ești liber vineri?
    note: '*on Friday* folosește mereu prepoziția *on* înaintea unei zile a săptămânii, deși în română nu se pune nicio prepoziție (sau se spune „în ziua de vineri”).'
  en.a1.unit47.lesson02.teach.what_time_works_for_you:
    title: What time works for you?
    gloss: La ce oră îți convine?
    note: '*works for you* înseamnă aici „îți convine” -- o expresie fixă, nu înseamnă literal „funcționează”.'
  en.a1.unit47.lesson02.teach.that_time_works_for_me:
    title: That time works for me.
    gloss: Ora aceea îmi convine.
    note: '*That time works for me.* înseamnă „Ora aceea îmi convine.”'
  en.a1.unit47.lesson02.teach.can_we_reschedule_for_monday:
    title: Can we reschedule for Monday?
    gloss: Putem reprograma pentru luni?
    note: '*reschedule for ...* folosește *for*, nu *to*, pentru a indica noua dată.'
  en.a1.unit47.lesson02.teach.your_appointment_is_confirmed:
    title: Your appointment is confirmed.
    gloss: Programarea ta este confirmată.
    note: '*Your appointment is confirmed.* înseamnă „Programarea ta este confirmată.”'
  en.a1.unit47.lesson03.teach.dialogue_line1:
    title: Întrebarea Miei
    gloss: 'Mia întreabă: Leila, Max este bine? Pare cam obosit în ultima vreme.'
    note: '*He seems a little tired lately.* înseamnă „Pare puțin obosit în ultima vreme.”'
  en.a1.unit47.lesson03.teach.dialogue_line2:
    title: Explicația Leilei
    gloss: 'Leila spune: Este bine, nu-ți face griji. Doar că i se apropie controlul anual. Ar trebui să sun la veterinar.'
    note: '*due for* înseamnă „a-i veni rândul la ceva”, folosit pentru ceva ce trebuie făcut la timp.'
  en.a1.unit47.lesson03.teach.dialogue_line3:
    title: Leila sună la veterinar
    gloss: 'Leila spune: Bună ziua, aș dori să fac o programare pentru controlul câinelui meu.'
    note: '*I''d like to* este mai politicos decât *I want to*, ca „aș dori” față de „vreau”.'
  en.a1.unit47.lesson03.teach.dialogue_line4:
    title: Întrebarea Miei
    gloss: 'Mia întreabă: Ce au spus?'
    note: '*did they say* folosește *did* ca verb auxiliar la trecut.'
  en.a1.unit47.lesson03.teach.dialogue_line5:
    title: Răspunsul Leilei
    gloss: 'Leila spune: Sunt disponibili joi la ora trei după-amiaza.'
    note: '*at 3pm* folosește *at* pentru o oră precisă.'
  en.a1.unit47.lesson03.teach.dialogue_line6:
    title: Întrebarea de verificare a Miei
    gloss: 'Mia întreabă: Îți convine ora aceea?'
    note: '*Does that time work for you?* este forma interogativă a lui *that time works for you*, cu *does*, ca la întrebările anterioare.'
  en.a1.unit47.lesson03.teach.dialogue_line7:
    title: Confirmarea Leilei
    gloss: 'Leila spune: Da, îmi convine. Joi la trei după-amiaza -- mulțumesc! Programarea lui Max este confirmată.'
    note: '*Max''s appointment* folosește genitivul cu *''s*: în română se spune „programarea lui Max”, cu „lui”.'
  en.a1.unit47.lesson04.teach.reading_passage:
    title: Text despre cum faci o programare
    gloss: 'Cum faci o programare: Dacă trebuie să mergi la un medic, la un dentist sau la alt serviciu, de obicei trebuie să faci mai întâi o programare. Sună și spune că ai dori să faci o programare. Recepționera îți va spune în ce zile și la ce ore există locuri disponibile. Alege o oră care ți se potrivește și îți vor confirma programarea. Dacă se schimbă ceva, sună din nou și cere să reprogramezi. Săptămâna trecută, Leila a sunat la veterinar ca să facă o programare pentru controlul anual al câinelui ei, Max. Erau disponibili joi la ora trei după-amiaza, iar Leila a confirmat ora. Și Daniel are o programare -- luni dimineață merge la dentist pentru un control. A spus că nu este emoționat, doar puțin ocupat săptămâna aceasta.'
    note: '*a little busy this week* înseamnă „puțin ocupat săptămâna aceasta”.'
