teaching:
  en.a1.unit17.lesson01.teach.do_you_want_to:
    title: Do you want to see a movie this weekend?
    gloss: Vrei să vedem un film în weekendul acesta?
    note: Cu *Do you want to...?* propui o activitate. După *to* urmează verbul la infinitiv, fără nicio terminație.
  en.a1.unit17.lesson01.teach.would_you_like_to:
    title: Would you like to go for a walk?
    gloss: Ți-ar plăcea să mergem la o plimbare?
    note: '*Would you like to...?* este o variantă puțin mai politicoasă decât *Do you want to...?* Corespunde expresiei românești „Ți-ar plăcea să ...?”.'
  en.a1.unit17.lesson02.teach.sure_id_love_to:
    title: Sure, I'd love to!
    gloss: Sigur, cu mare plăcere!
    note: Cu *I'd love to* accepți cu entuziasm. *I'd* este forma scurtă de la *I would*; după *to* verbul se omite, pentru că a fost deja spus în întrebare.
  en.a1.unit17.lesson02.teach.sorry_cant_busy:
    title: Sorry, I can't. I'm busy on Saturday.
    gloss: Îmi pare rău, nu pot. Sâmbătă sunt ocupat.
    note: Cu această propoziție refuzi și dai motivul. *can't* este forma scurtă de la *cannot*.
  en.a1.unit17.lesson02.teach.maybe_another_time:
    title: Maybe another time?
    gloss: Poate altă dată?
    note: Arăți astfel că ai veni cu plăcere cu altă ocazie.
  en.a1.unit17.lesson03.teach.have_lunch:
    title: have lunch
    gloss: a lua prânzul
    note: '*have lunch* înseamnă a lua prânzul. Ca la celelalte mese, nu există articol.'
  en.a1.unit17.lesson03.teach.invitation_text:
    title: Textul invitației
    gloss: Salut! Vrei să luăm prânzul vineri? Ce zici de ora 13:00 la cafenea?
    note: Aceasta este o invitație la prânz.
  en.a1.unit17.lesson04.teach.works_for_me:
    title: Sunday works for me.
    gloss: Duminica mi se potrivește.
    note: '*works for me* înseamnă că ceva se potrivește bine.'
  en.a1.unit17.lesson04.teach.q_movie_weekend:
    title: Întrebarea despre film
    gloss: Daniel întreabă dacă văd un film în weekendul acesta
    note: Aceeași întrebare ca în prima lecție.
  en.a1.unit17.lesson04.teach.a_love_to_what_day:
    title: Acceptare și întrebare despre zi
    gloss: 'Leila spune: Sigur, cu mare plăcere! În ce zi?'
    note: Leila acceptă mai întâi și apoi întreabă în ce zi.
  en.a1.unit17.lesson04.teach.q_saturday:
    title: Propunerea zilei de sâmbătă
    gloss: 'Daniel spune: Ce zici de sâmbătă?'
    note: Cu *How about...?* propui un moment anume.
  en.a1.unit17.lesson04.teach.a_busy_sunday:
    title: Refuz și propunerea zilei de duminică
    gloss: 'Leila spune: Îmi pare rău, nu pot. Sâmbătă sunt ocupată. Ce zici de duminică?'
    note: Leila refuză sâmbăta și propune duminica.
  en.a1.unit17.lesson04.teach.a_sunday_works:
    title: Acord pentru duminică
    gloss: 'Daniel spune: Duminica mi se potrivește.'
    note: Daniel este de acord cu duminica, deci planul este stabilit.
