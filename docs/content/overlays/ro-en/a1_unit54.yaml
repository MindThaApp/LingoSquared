teaching:
  en.a1.unit54.lesson01.teach.laundromat:
    title: laundromat
    gloss: spălătorie self-service
    note: '*laundromat* înseamnă „spălătorie self-service” – un loc cu mașini de spălat pe care le folosești contra cost.'
    example_gloss: Azi merg la spălătorie.
  en.a1.unit54.lesson01.teach.washing_machine:
    title: washing machine
    gloss: mașină de spălat
    note: '*washing machine* înseamnă „mașină de spălat”.'
    example_gloss: Mașina de spălat este stricată.
  en.a1.unit54.lesson01.teach.dryer:
    title: dryer
    gloss: uscător
    note: '*dryer* înseamnă „uscător”.'
    example_gloss: Pune hainele în uscător.
  en.a1.unit54.lesson01.teach.quarters:
    title: quarters
    gloss: monede de 25 de cenți (americane)
    note: '*quarters* sunt monede americane de douăzeci și cinci de cenți – adesea necesare pentru mașinile de spălat dintr-o spălătorie. Nu există un echivalent românesc exact, de aceea *quarters* rămâne de obicei cuvânt englezesc.'
    example_gloss: Mașinile primesc monede de 25 de cenți.
  en.a1.unit54.lesson01.teach.detergent:
    title: detergent
    gloss: detergent
    note: '*detergent* înseamnă „detergent”.'
    example_gloss: Ai nevoie de detergent ca să speli hainele.
  en.a1.unit54.lesson01.teach.load:
    title: load
    gloss: o spălare / un ciclu
    note: '*load* înseamnă aici „o spălare” – cantitatea de rufe pe care o speli odată.'
    example_gloss: Am o mulțime de rufe de spălat.
  en.a1.unit54.lesson02.teach.id_like_to_wash_a_few_things:
    title: I'd like to wash a few things, please.
    gloss: Aș dori să spăl câteva lucruri, vă rog.
    note: '*I''d like to* (forma scurtă de la *I would like to*) este modul politicos de a cere ceva.'
  en.a1.unit54.lesson02.teach.do_you_have_change:
    title: Do you have change for the machines?
    gloss: Aveți mărunțiș pentru mașini?
    note: '*change* înseamnă aici „mărunțiș” (monede mici), nu „schimbare”.'
  en.a1.unit54.lesson02.teach.how_long_does_the_cycle_take:
    title: How long does the wash cycle take?
    gloss: Cât durează ciclul de spălare?
    note: '*take* înseamnă aici „a dura” (a avea nevoie de un anumit timp) – o folosire diferită de cea din *the machines take quarters*, unde *take* înseamnă „a accepta”.'
  en.a1.unit54.lesson02.teach.its_three_dollars_for_one_load:
    title: It's three dollars for one load.
    gloss: Costă trei dolari pentru o spălare.
    note: '*for one load* înseamnă „pentru o spălare”.'
  en.a1.unit54.lesson02.teach.what_time_do_you_close:
    title: What time do you close?
    gloss: La ce oră închideți?
    note: '*do you close* folosește auxiliarul *do* pentru forma de întrebare.'
  en.a1.unit54.lesson02.teach.please_pick_up_by_nine:
    title: Please pick up your laundry by nine o'clock.
    gloss: Vă rog să vă luați rufele până la ora nouă.
    note: '*pick up* înseamnă „a ridica, a lua” – *by nine o''clock* înseamnă „până la ora nouă” (cel târziu la acea oră).'
  en.a1.unit54.lesson03.teach.dialogue_line1:
    title: Angajatul salută
    gloss: 'Angajatul spune: Bună ziua! Aveți nevoie de o mașină de spălat?'
    note: '*Do you need...?* folosește auxiliarul *do* pentru forma de întrebare.'
  en.a1.unit54.lesson03.teach.dialogue_line2:
    title: Motivul Leilei
    gloss: 'Leila spune: Da, vă rog. Mașina mea de spălat de acasă este stricată.'
    note: '*at home* înseamnă „acasă”.'
  en.a1.unit54.lesson03.teach.dialogue_line3:
    title: Cererea lui Daniel
    gloss: 'Daniel spune: Am și eu o spălare mică. Pot folosi și eu o mașină?'
    note: '*too* înseamnă aici „și”, la sfârșitul propoziției – *as well* are același sens și apare în a doua propoziție.'
  en.a1.unit54.lesson03.teach.dialogue_line4:
    title: Angajatul vorbește despre monede
    gloss: 'Angajatul spune: Sigur! Mașinile primesc monede de 25 de cenți.'
    note: '*take* înseamnă aici „a accepta” (ca plată) – observă diferența față de *take* din *The wash cycle takes thirty minutes*, mai jos, unde *take* înseamnă „a dura”.'
  en.a1.unit54.lesson03.teach.dialogue_line5:
    title: Leila are monede
    gloss: 'Leila spune: Da, am monede de 25 de cenți.'
    note: O confirmare scurtă, nu o informație nouă.
  en.a1.unit54.lesson03.teach.dialogue_line6:
    title: Durata ciclului de spălare
    gloss: 'Angajatul spune: Ciclul de spălare durează treizeci de minute.'
    note: '*take* înseamnă aici „a dura” – alt sens decât *take* din *take quarters*, de mai sus.'
  en.a1.unit54.lesson03.teach.dialogue_line7:
    title: Daniel întreabă despre preț
    gloss: 'Daniel spune: Și cât costă?'
    note: '*How much does it cost?* – din nou auxiliarul *does* pentru forma de întrebare.'
  en.a1.unit54.lesson03.teach.dialogue_line8:
    title: Prețul
    gloss: 'Angajatul spune: Costă trei dolari pentru o spălare.'
    note: O informație separată, diferită de numărul de monede și de durată.
  en.a1.unit54.lesson03.teach.dialogue_line9:
    title: Ora de închidere
    gloss: 'Angajatul spune: Spălătoria se închide la ora nouă, așa că vă rog să vă luați rufele înainte de atunci.'
    note: '*so* înseamnă aici „așa că” – leagă ora de închidere de îndemnul de a veni la timp.'
  en.a1.unit54.lesson04.teach.reading_passage:
    title: 'Text: O vizită la spălătorie'
    gloss: Într-o după-amiază, mașina de spălat a Leilei de acasă s-a stricat. Ea s-a hotărât să meargă la spălătoria de pe strada ei. Daniel a mers cu ea, pentru că și el avea o spălare mică. La spălătorie, angajatul le-a explicat că mașinile primesc monede de 25 de cenți și că ciclul de spălare durează treizeci de minute. O spălare costa trei dolari. Cât timp li se spălau hainele, Daniel și Leila au stat de vorbă și au băut o cafea la o cafenea alăturată. Spălătoria se închide la ora nouă, așa că au avut grijă să-și ia rufele înainte de atunci. Leila i-a fost recunoscătoare lui Daniel pentru companie și a spus că mașina de acasă va fi probabil reparată până la sfârșitul săptămânii.
    note: '*would be fixed* înseamnă „va fi reparată (probabil)” – Leila se așteaptă ca mașina să fie reparată, dar nu este încă sigur.'
