teaching:
  en.a1.unit38.lesson01.teach.chore:
    title: chore
    gloss: treabă casnică
    note: '*chore* înseamnă treabă casnică: ceva ce faci regulat ca să-ți ții casa curată și ordonată.'
    example_gloss: Spălatul vaselor este treaba casnică care îmi place cel mai puțin.
  en.a1.unit38.lesson01.teach.dishes:
    title: dishes
    gloss: vase
    note: '*dishes* înseamnă vase: farfurii, cești și tacâmuri pe care le speli.'
    example_gloss: Spăl vasele după cină.
  en.a1.unit38.lesson01.teach.laundry:
    title: laundry
    gloss: rufe
    note: '*laundry* înseamnă rufe: haine pe care le speli, le usuci și le împăturești.'
    example_gloss: Ea spală rufele duminica.
  en.a1.unit38.lesson01.teach.vacuum:
    title: vacuum
    gloss: a da cu aspiratorul
    note: '*vacuum* înseamnă a da cu aspiratorul.'
    example_gloss: El dă cu aspiratorul în sufragerie în fiecare sâmbătă.
  en.a1.unit38.lesson01.teach.trash:
    title: trash
    gloss: gunoi
    note: '*trash* înseamnă gunoi.'
    example_gloss: Poți să scoți gunoiul?
  en.a1.unit38.lesson01.teach.clean:
    title: clean
    gloss: a face curat
    note: '*clean* înseamnă a face curat.'
    example_gloss: Facem curat în apartament împreună.
  en.a1.unit38.lesson02.teach.wash_the_dishes:
    title: wash the dishes
    gloss: a spăla vasele
    note: '*wash the dishes* înseamnă a spăla vasele. *Do the dishes* este la fel de folosit și înseamnă același lucru.'
    example_gloss: Spăl vasele în fiecare seară.
  en.a1.unit38.lesson02.teach.do_the_laundry:
    title: do the laundry
    gloss: a spăla rufele
    note: '*do the laundry* înseamnă a spăla rufele.'
    example_gloss: Ea spală rufele duminica.
  en.a1.unit38.lesson02.teach.take_out_the_trash:
    title: take out the trash
    gloss: a scoate gunoiul
    note: '*take out the trash* folosește *take out*, nu *do*. Spre deosebire de *do the laundry* sau *do the dishes*, aici nu poți folosi *do*.'
    example_gloss: Poți să scoți gunoiul?
  en.a1.unit38.lesson02.teach.clean_the_bathroom:
    title: clean the bathroom
    gloss: a face curat în baie
    note: '*clean the bathroom* înseamnă a face curat în baie.'
    example_gloss: El face curat în baie în weekend.
  en.a1.unit38.lesson02.teach.need_to:
    title: need to
    gloss: a trebui să
    note: '*need to* înseamnă a trebui să faci ceva.'
    example_gloss: Trebuie să dau cu aspiratorul în sufragerie în weekendul acesta.
  en.a1.unit38.lesson02.teach.can_you_help_me_with_question:
    title: Can you help me with the dishes?
    gloss: Mă poți ajuta cu vasele?
    note: O modalitate politicoasă de a cere ajutor la o treabă.
  en.a1.unit38.lesson03.teach.dialogue_line1:
    title: Mia's probleem
    gloss: 'Mia spune: Apartamentul meu e un dezastru. Vin oameni la mine în weekendul acesta.'
    note: '*a mess* înseamnă dezordine sau dezastru.'
  en.a1.unit38.lesson03.teach.dialogue_line2:
    title: Oferta lui Daniel
    gloss: 'Daniel întreabă: Vrei ajutor la curățenie?'
    note: '*Do you want some help ...ing?* este o modalitate firească de a oferi ajutor.'
  en.a1.unit38.lesson03.teach.dialogue_line3:
    title: "Răspunsul lui Mia"
    gloss: 'Mia spune: Da, te rog! Trebuie să dau cu aspiratorul în sufragerie și să spăl vasele.'
    note: '*I need to* + verb înseamnă „trebuie să” + verb.'
  en.a1.unit38.lesson03.teach.dialogue_line4:
    title: Oferta lui Daniel
    gloss: 'Daniel spune: Pot să dau eu cu aspiratorul pentru tine. Tu poți să speli vasele.'
    note: '*for you* înseamnă aici „pentru tine”, în sensul „în locul tău”.'
  en.a1.unit38.lesson03.teach.dialogue_line5:
    title: Completarea Miei
    gloss: 'Mia spune: Mulțumesc! Mai trebuie să spăl și rufele.'
    note: '*still need to* înseamnă „mai trebuie să”.'
  en.a1.unit38.lesson03.teach.dialogue_line6:
    title: Oferta lui Daniel
    gloss: 'Daniel spune: Nu am timp pentru asta azi, dar pot să scot gunoiul înainte să plec.'
    note: '*before I leave* înseamnă „înainte să plec”.'
  en.a1.unit38.lesson03.teach.dialogue_line7:
    title: Mulțumirea Miei
    gloss: 'Mia spune: Ar ajuta foarte mult. Îți mulțumesc enorm!'
    note: '*That would help a lot* înseamnă „ar ajuta foarte mult”. *Would* face fraza mai politicoasă aici.'
  en.a1.unit38.lesson04.teach.reading_passage:
    title: Text despre treburile de acasă
    gloss: Daniel, Leila și Mia au fiecare obiceiurile lor legate de treburi. Daniel spală vasele în fiecare seară după cină și dă cu aspiratorul în apartament sâmbăta. Leila nu se deranjează să spele rufele, dar urăște să facă curat în baie. Pisica Luna a Miei lasă păr peste tot, așa că Mia dă cu aspiratorul aproape în fiecare zi. Weekendul trecut, Mia a avut oaspeți, așa că Daniel s-a oferit s-o ajute. A dat cu aspiratorul în sufragerie și a scos gunoiul în locul ei. Mia i-a fost foarte recunoscătoare pentru ajutor.
    note: '*doesn''t mind* înseamnă „nu o deranjează”.'
