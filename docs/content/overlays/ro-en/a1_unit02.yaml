teaching:
  en.a1.unit02.lesson01.teach.whats_your_name:
    title: What's your name?
    gloss: Cum te cheamă? / Cum vă cheamă?
    note: '*What''s your name?* se potrivește în engleză și în situații formale, și în cele informale – în română alegi între „te cheamă” și „vă cheamă”, dar în engleză *your* rămâne același.'
  en.a1.unit02.lesson01.teach.my_name_is:
    title: My name is Leila.
    gloss: Mă numesc Leila.
    note: Forma standard pentru a-ți spune numele.
  en.a1.unit02.lesson01.teach.im_leila:
    title: I'm Leila.
    gloss: Sunt Leila. / Mă numesc Leila.
    note: O alternativă mai scurtă, la fel de frecventă, la *My name is Leila*.
  en.a1.unit02.lesson01.teach.nice_to_meet_you:
    title: Nice to meet you.
    gloss: Îmi pare bine.
    note: Se spune când cunoști pe cineva pentru prima dată.
  en.a1.unit02.lesson02.teach.i_am_student:
    title: I am a student.
    gloss: Sunt student / studentă.
    note: '*a* se folosește înaintea numelor de profesii sau roluri la singular – în română articolul lipsește aici (*Sunt student*, nu *un student*).'
  en.a1.unit02.lesson02.teach.are_you_teacher:
    title: Are you a teacher?
    gloss: Ești profesor(oară)? / Sunteți profesor(oară)?
    note: Forma de întrebare cu *Are you...?* merge în orice registru.
  en.a1.unit02.lesson02.teach.yes_i_am:
    title: Yes, I am.
    gloss: Da, sunt.
    note: Un răspuns scurt, complet, la întrebări precum *Are you a teacher?*
  en.a1.unit02.lesson02.teach.no_im_student:
    title: No, I'm a student.
    gloss: Nu, sunt student(ă).
    note: Un răspuns negativ cu corectarea propriului rol.
  en.a1.unit02.lesson02.teach.are_you_member:
    title: Are you a new member?
    gloss: Sunteți membru nou?
    note: Întreabă despre calitatea de membru, de exemplu la o bibliotecă sau la o asociație.
  en.a1.unit02.lesson02.teach.he_is_teacher:
    title: He is a teacher.
    gloss: El este profesor.
    note: Persoana a treia singular, masculin.
  en.a1.unit02.lesson02.teach.she_is_engineer:
    title: She is an engineer.
    gloss: Ea este inginer.
    note: Persoana a treia singular, feminin – *an* în loc de *a*, pentru că *engineer* începe cu o vocală.
  en.a1.unit02.lesson03.teach.library:
    title: library
    gloss: bibliotecă
    note: Un loc de unde poți împrumuta cărți.
    example_gloss: Sunt la bibliotecă.
  en.a1.unit02.lesson03.teach.library_assistant:
    title: library assistant
    gloss: asistent(ă) de bibliotecă
    note: O persoană care lucrează la o bibliotecă.
  en.a1.unit02.lesson03.teach.opening:
    title: Daniel începe conversația
    gloss: 'Daniel spune: Bună ziua. Sunt Daniel.'
    note: O deschidere formală, prietenoasă.
  en.a1.unit02.lesson03.teach.request:
    title: Daniel întreabă numele
    gloss: 'Daniel spune: Cum vă cheamă?'
    note: Vine imediat după prezentare – Daniel și Leila nu se cunosc încă, de aceea conversația rămâne în registrul formal, cu „dumneavoastră”.
  en.a1.unit02.lesson03.teach.names:
    title: Leila răspunde
    gloss: 'Leila spune: Salut. Sunt Leila. Sunt studentă. Îmi pare bine.'
    note: Leila își spune numele, rolul și formula obișnuită de politețe.
  en.a1.unit02.lesson03.teach.room_and_member:
    title: Daniel întreabă despre abonament
    gloss: 'Daniel spune: Și mie îmi pare bine. Sunteți membră nouă? Leila spune: Da, sunt.'
    note: Daniel răspunde la formula de politețe și întreabă despre calitatea de membru, tot în registrul formal.
  en.a1.unit02.lesson03.teach.role:
    title: Daniel spune ce meserie are
    gloss: 'Daniel spune: Sunt inginer.'
    note: Înaintea unei profesii, engleza cere *a* sau *an* (*I'm an engineer*); în română articolul lipsește.
  en.a1.unit02.lesson03.teach.closing:
    title: Daniel și Leila încheie conversația
    gloss: 'Daniel spune: Bun venit la bibliotecă. Leila spune: Mulțumesc.'
    note: O încheiere prietenoasă, politicoasă.
