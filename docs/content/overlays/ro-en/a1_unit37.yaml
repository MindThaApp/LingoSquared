  en.a1.unit37.lesson03.teach.dialogue_line1:
    title: Întrebarea Leilei
    gloss: 'Leila întreabă: Știai că ziua lui Daniel este pe 12 octombrie?'
    note: '*Did you know ...?* este o modalitate firească de a începe o conversație cu o informație nouă.'
  en.a1.unit37.lesson03.teach.dialogue_line2:
    title: Reacția Miei
    gloss: 'Mia spune: Nu, nu știam! E vinerea viitoare.'
    note: '*No, I didn''t!* este un răspuns scurt negativ la o întrebare cu *Did you know ...?*: „Nu, nu știam.”'
  en.a1.unit37.lesson03.teach.dialogue_line3:
    title: Propunerea Leilei
    gloss: 'Leila spune: Hai să-i facem o petrecere-surpriză la birou.'
    note: '*Let''s* + verb folosești ca să faci o propunere, ca „hai să” în română.'
  en.a1.unit37.lesson03.teach.dialogue_line4:
    title: Reacția Miei
    gloss: 'Mia spune: Idee bună! Pot să invit restul echipei.'
    note: '*the rest of the team* înseamnă restul echipei.'
  en.a1.unit37.lesson03.teach.dialogue_line5:
    title: Planul Leilei
    gloss: 'Leila spune: Perfect. Îi cumpăr un cadou, poate pantofi de alergat noi, fiindcă îi place foarte mult să alerge.'
    note: '*since* înseamnă aici „fiindcă” (motiv), nu „de când” (timp).'
  en.a1.unit37.lesson03.teach.dialogue_line6:
    title: Propunerea Miei
    gloss: 'Mia spune: E o idee bună. Să luăm și un tort?'
    note: '*Should we ...?* folosești ca să iei o decizie împreună.'
  en.a1.unit37.lesson03.teach.dialogue_line7:
    title: "Răspunsul Leilei"
    gloss: 'Leila spune: Da, sigur! Îi vom ura cu toții la mulți ani, împreună.'
    note: '*We''ll all wish him a happy birthday* înseamnă: cu toții îi vom ura la mulți ani.'
  en.a1.unit37.lesson04.teach.reading_passage:
    title: Text despre petrecerea-surpriză
    gloss: Daniel nu știa că Leila și Mia îi pregăteau o petrecere-surpriză. Pe 12 octombrie, ziua lui, a ajuns la serviciu și a găsit baloane și un tort în sala de pauză. Toți i-au urat „La mulți ani!”. Leila i-a dat o pereche nouă de pantofi de alergat. Mia i-a dat o fotografie înrămată cu cei trei colegi împreună, pe care a făcut-o chiar ea. Daniel a fost foarte fericit și le-a mulțumit tuturor pentru minunata surpriză.
    note: '*he arrived at work and found*: trecutul verbelor *arrive* și *find* (a ajuns la serviciu și a găsit ...).'
