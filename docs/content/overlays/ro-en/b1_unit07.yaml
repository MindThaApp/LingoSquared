teaching:
  en.b1.unit07.lesson01.teach.if:
    title: if
    gloss: dacă
    note: '*if* introduce o condiție posibilă.'
    example_gloss: Dacă autobuzul întârzie, te sun.
  en.b1.unit07.lesson01.teach.unless:
    title: unless
    gloss: dacă nu, doar dacă nu
    note: '*unless* înseamnă aproximativ *if not*: ceva se întâmplă, în afară de cazul în care condiția se îndeplinește.'
    example_gloss: Dacă planul nu se schimbă, ne întâlnim la zece.
  en.b1.unit07.lesson01.teach.condition:
    title: condition
    gloss: condiție
    note: '*condition* este situația care trebuie să existe mai întâi.'
    example_gloss: 'Condiția e clară: începem dacă vin toți.'
  en.b1.unit07.lesson01.teach.result:
    title: result
    gloss: rezultat, consecință
    note: '*result* este ceea ce se întâmplă din cauza unei condiții.'
    example_gloss: Rezultatul este că ne întâlnim online.
  en.b1.unit07.lesson01.teach.delay:
    title: delay
    gloss: întârziere
    note: '*delay* înseamnă că ceva se întâmplă mai târziu decât era planificat.'
    example_gloss: O întârziere îi poate face pe toți să ajungă târziu.
  en.b1.unit07.lesson01.teach.reschedule:
    title: reschedule
    gloss: a muta pe altă dată (o programare)
    note: '*reschedule* înseamnă a alege o nouă oră pentru o programare sau o ședință.'
    example_gloss: Dacă doctorița e ocupată, mutăm programarea pe altă dată.
  en.b1.unit07.lesson02.teach.if_meeting_late:
    title: O condiție reală cu rezultat
    gloss: Dacă ședința începe târziu, le trimit tuturor un mesaj.
    note: 'La o condiție reală din viitor, după *if* se folosește prezentul: *If the meeting starts late*, nu *will start*.'
  en.b1.unit07.lesson02.teach.if_not_ready:
    title: O condiție negativă
    gloss: Dacă raportul nu e gata, mutăm analiza pe altă dată.
    note: '*if ... not* face condiția negativă.'
  en.b1.unit07.lesson02.teach.grammar_real_condition:
    title: Condiții reale în viitor
    gloss: Dacă începe târziu, trimit un mesaj. Dacă raportul nu e gata, mutăm analiza pe altă dată.
    note: După *if* se folosește prezentul, iar în rezultat apare adesea *will*.
  en.b1.unit07.lesson03.teach.backup_plan:
    title: backup plan
    gloss: plan de rezervă, plan B
    note: '*backup plan* este un plan suplimentar pentru cazul în care primul nu merge.'
    example_gloss: Avem nevoie de un plan de rezervă, în caz că sala e ocupată.
  en.b1.unit07.lesson03.teach.move_update:
    title: move the update
    gloss: a muta actualizarea
    note: '*move the update* înseamnă a discuta actualizarea la un alt moment.'
    example_gloss: Dacă Leila întârzie, mutăm actualizarea ei pe mâine.
  en.b1.unit07.lesson03.teach.reading_passage:
    title: 'Text de citit: planul de rezervă'
    gloss: Daniel scrie un plan de rezervă pentru ședința echipei. Dacă sala de conferințe e liberă, echipa se întâlnește acolo la zece. Dacă sala e ocupată, se întâlnesc online. Dacă Leila nu se alătură până la zece, Daniel îi mută actualizarea pe mâine. Dacă raportul nu e gata, Mia trimite în schimb o actualizare mai scurtă.
    note: Un text scurt cu condiții reale, rezultate și *unless*.
  en.b1.unit07.lesson04.teach.q_if_meeting_late:
    title: Mia întreabă despre plan
    gloss: 'Mia spune: Daniel, ce facem dacă ședința începe târziu?'
    note: O întrebare despre rezultatul unei condiții posibile.
  en.b1.unit07.lesson04.teach.a_send_message:
    title: Daniel spune rezultatul
    gloss: 'Daniel spune: Dacă începe târziu, le trimit tuturor un mesaj.'
    note: '*If it starts late, I will...* leagă o posibilitate reală de o acțiune concretă.'
  en.b1.unit07.lesson04.teach.q_if_leila_cannot_join:
    title: Mia întreabă despre Leila
    gloss: 'Mia spune: Și dacă Leila nu se poate alătura?'
    note: O întrebare scurtă de continuare, cu aceeași structură condițională.
  en.b1.unit07.lesson04.teach.a_unless_she_joins:
    title: Daniel folosește 'unless'
    gloss: 'Daniel spune: Dacă nu se alătură până la zece, îi mutăm actualizarea pe mâine.'
    note: '*unless she joins by ten* înseamnă: dacă nu se alătură până la zece.'
  en.b1.unit07.lesson04.teach.q_room_busy:
    title: Mia întreabă despre cameră
    gloss: 'Mia spune: Pare corect. Și dacă sala e tot ocupată, ne întâlnim online?'
    note: Mia verifică planul de rezervă pentru o sală ocupată.
  en.b1.unit07.lesson04.teach.a_meet_online:
    title: Daniel confirmă planul online
    gloss: 'Daniel spune: Da, dacă sala e ocupată, ne întâlnim în schimb online.'
    note: '*instead* înseamnă că acest plan îl înlocuiește pe celălalt.'
