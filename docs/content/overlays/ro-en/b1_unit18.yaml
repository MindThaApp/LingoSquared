teaching:
  en.b1.unit18.lesson01.teach.arrangement:
    title: arrangement
    gloss: plan stabilit, întâlnire stabilită
    note: '*arrangement* înseamnă un plan deja stabilit cu altcineva, de exemplu o oră convenită.'
    example_gloss: Mia are vineri o întâlnire stabilită cu Leila.
  en.b1.unit18.lesson01.teach.intention:
    title: intention
    gloss: intenție, plan
    note: '*intention* înseamnă ceva ce ai hotărât să faci, dar pentru care nu ai stabilit încă o oră cu altcineva.'
    example_gloss: Intenția lui Daniel este să termine proiectul din timp.
  en.b1.unit18.lesson01.teach.prediction:
    title: prediction
    gloss: previziune, estimare
    note: '*prediction* înseamnă o părere despre ce se va întâmpla, bazată pe semne.'
    example_gloss: Previziunea mea este că proiectul se va încheia la timp.
  en.b1.unit18.lesson01.teach.definitely:
    title: definitely
    gloss: cu siguranță, categoric
    note: '*definitely* arată că ești complet sigur că ceva se va întâmpla.'
    example_gloss: Daniel va termina raportul azi, fără îndoială.
  en.b1.unit18.lesson01.teach.probably:
    title: probably
    gloss: probabil
    note: '*probably* arată că ești destul de sigur, dar nu complet.'
    example_gloss: Proiectul va dura probabil două luni.
  en.b1.unit18.lesson01.teach.might:
    title: might
    gloss: poate, ar putea
    note: '*might* arată că ceva este doar o posibilitate slabă.'
    example_gloss: Daniel ar putea să-i ceară Leilei să se alăture echipei.
  en.b1.unit18.lesson02.teach.meeting_leila_friday:
    title: I am + Verb-ing (înțelegere fermă)
    gloss: Mă întâlnesc cu Leila vineri, la prânz.
    note: '*I am meeting Leila for lunch on Friday* folosește present continuous pentru o înțelegere fermă, cu o oră anume, deja stabilită.'
  en.b1.unit18.lesson02.teach.going_to_start_project:
    title: I am going to + Verb (intenție)
    gloss: Am de gând să încep un proiect nou cu echipa de design.
    note: '*I am going to start a new project* folosește going to pentru o decizie deja luată, fără oră stabilită.'
  en.b1.unit18.lesson02.teach.grammar_arrangements_vs_intentions:
    title: Înțelegeri ferme și intenții
    gloss: 'Folosește present continuous (I am meeting Leila on Friday) pentru o înțelegere fermă: un moment anume, deja convenit cu altcineva. Folosește going to (I am going to start a new project) pentru o intenție sau o decizie pe care ai luat-o deja, chiar dacă nu are o oră stabilită. În română poți folosi aceeași formă de prezent pentru ambele („mă întâlnesc vineri”, „încep un proiect nou”), dar în engleză trebuie să alegi.'
    note: 'Formă: alege între present continuous pentru o înțelegere fermă și going to pentru o intenție.'
  en.b1.unit18.lesson03.teach.on_time:
    title: on time
    gloss: la timp
    note: '*on time* înseamnă exact la ora sau la data planificată.'
    example_gloss: Daniel crede că proiectul se va încheia la timp.
  en.b1.unit18.lesson03.teach.confident:
    title: confident
    gloss: încrezător
    note: '*confident* înseamnă că ești sigur că lucrurile vor merge bine.'
    example_gloss: Daniel este încrezător în privința noului proiect.
  en.b1.unit18.lesson03.teach.reading_passage:
    title: 'Text de citit: planurile lui Daniel pentru luna viitoare'
    gloss: Daniel are de gând să înceapă luna viitoare un proiect nou cu echipa de design. Se întâlnește cu ei vineri dimineața ca să planifice primii pași. Daniel este încrezător în privința proiectului, dar nu este complet sigur că se va încheia la timp. Estimează că va dura probabil cam două luni. Poate că o va ruga pe Leila să se alăture echipei, pentru că are experiență utilă în design. Dacă ea acceptă, proiectul va merge cu siguranță mai repede.
    note: Un text scurt despre planuri și previziuni.
  en.b1.unit18.lesson04.teach.q_plans_next_month:
    title: Mia întreabă despre planurile lui Daniel
    gloss: 'Mia spune: Daniel, ce planuri ai pentru luna viitoare?'
    note: O întrebare deschisă, pentru a începe conversația.
  en.b1.unit18.lesson04.teach.a_going_to_start:
    title: Daniel spune ce intenționează
    gloss: 'Daniel spune: Am de gând să încep un proiect nou cu echipa de design.'
    note: '*going to* arată o decizie deja luată.'
  en.b1.unit18.lesson04.teach.q_meeting_this_week:
    title: Mia continuă să întrebe
    gloss: 'Mia spune: Sună captivant. Te întâlnești cu ei săptămâna asta?'
    note: O întrebare despre o înțelegere fermă.
  en.b1.unit18.lesson04.teach.a_meeting_friday_morning:
    title: Daniel confirmă înțelegerea fermă
    gloss: 'Daniel spune: Da, mă întâlnesc cu ei vineri dimineața.'
    note: '*I am meeting... on Friday morning* este present continuous pentru o înțelegere fermă.'
  en.b1.unit18.lesson04.teach.q_finish_on_time:
    title: Mia întreabă despre programare
    gloss: 'Mia spune: Crezi că proiectul se va încheia la timp?'
    note: O întrebare despre o previziune.
  en.b1.unit18.lesson04.teach.a_probably_two_months:
    title: Daniel face o previziune
    gloss: 'Daniel spune: Nu sunt sigur, dar va dura probabil cam două luni.'
    note: '*probably* arată o siguranță destul de mare, dar nu completă.'
  en.b1.unit18.lesson04.teach.q_sure_it_will_go_well:
    title: Mia e optimistă
    gloss: 'Mia spune: Ei bine, sunt sigură că va merge bine.'
    note: O remarcă încurajatoare.
  en.b1.unit18.lesson04.teach.a_might_ask_leila:
    title: Daniel menționează o posibilitate slabă
    gloss: 'Daniel spune: Mulțumesc. S-ar putea să o rog și pe Leila să se alăture echipei.'
    note: '*might* arată o posibilitate slabă.'
