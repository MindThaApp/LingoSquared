  en.a1.unit14.lesson01.teach.hello_this_is:
    title: Hello, this is Daniel.
    gloss: Bună, sunt Daniel.
    note: '*this is [Name]* este felul în care te prezinți la telefon, spre deosebire de prezentarea față în față cu *I''m.*'
  en.a1.unit14.lesson01.teach.hi_its:
    title: Hi, it's Leila.
    gloss: Bună, sunt Leila.
    note: '*it''s [Name]* este o variantă mai scurtă și mai informală decât *this is [Name].*'
  en.a1.unit14.lesson01.teach.are_you_free:
    title: Are you free tonight?
    gloss: Ai timp diseară?
    note: '*free* înseamnă aici „disponibil”, nu „gratuit”.'
  en.a1.unit14.lesson02.teach.can_you_repeat:
    title: Sorry, can you repeat that?
    gloss: Scuze, poți repeta?
    note: '*Sorry* introduce politicos o rugăminte de a repeta.'
  en.a1.unit14.lesson02.teach.speak_slowly:
    title: Can you speak more slowly, please?
    gloss: Poți vorbi mai rar, te rog?
    note: '*more slowly* înseamnă „mai rar” — forma de comparativ a lui *slowly.*'
  en.a1.unit14.lesson02.teach.i_cant_hear:
    title: I can't hear you well.
    gloss: Nu te aud bine.
    note: '*can''t hear* înseamnă „nu pot auzi”, de multe ori din cauza unei conexiuni proaste.'
  en.a1.unit14.lesson03.teach.are_you_free_at:
    title: Are you free at 6pm?
    gloss: Ai timp la ora 18?
    note: '*at 6pm* indică ora exactă.'
  en.a1.unit14.lesson03.teach.text_message_text:
    title: Eine Textnachricht
    gloss: Bună, Leila, ai timp la ora 18? Hai să ne întâlnim la cafenea.
    note: Un mesaj text scurt combină o întrebare despre oră cu o propunere concretă.
  en.a1.unit14.lesson03.teach.purpose_summary:
    title: This message is to suggest a meeting time and place.
    gloss: Mesajul propune o oră și un loc pentru o întâlnire.
    note: '*to suggest* înseamnă „a propune” — scopul mesajului.'
  en.a1.unit14.lesson04.teach.how_about:
    title: How about 6pm at the cafe?
    gloss: Ce-ar fi la ora 18, la cafenea?
    note: '*How about...?* propune politicos o oră sau un loc.'
