teaching:
  en.a2.unit28.lesson01.teach.medicine:
    title: medicine
    gloss: medicament
    note: '*medicine* înseamnă medicament sau leac.'
    example_gloss: Medicul mi-a dat un medicament pentru durerea de cap.
  en.a2.unit28.lesson01.teach.prescription:
    title: prescription
    gloss: rețetă
    note: '*prescription* înseamnă rețeta pe care o scrie medicul.'
    example_gloss: Medicul mi-a scris o rețetă pentru medicament.
  en.a2.unit28.lesson01.teach.follow_up_appointment:
    title: follow-up appointment
    gloss: programare de control
    note: '*follow-up appointment* înseamnă o altă programare, la care medicul verifică cum te simți.'
    example_gloss: Dacă nu se ameliorează, ai nevoie de o programare de control.
  en.a2.unit28.lesson01.teach.getting_worse:
    title: getting worse
    gloss: a se agrava
    note: '*getting worse* înseamnă că simptomele se agravează.'
    example_gloss: Durerea mea de cap se agravează, nu se ameliorează.
  en.a2.unit28.lesson01.teach.insurance_card:
    title: insurance card
    gloss: card de asigurări de sănătate
    note: '*insurance card* este cardul asigurării tale de sănătate; în România este cardul național de sănătate.'
    example_gloss: Adu cardul de asigurări la programare.
  en.a2.unit28.lesson01.teach.reused_symptoms:
    title: Reclamații anterioare
    gloss: durere de cap, durere în gât, febră
    note: Aceste cuvinte le-ai învățat deja în unitatea 22; aici le repetăm.
    example_gloss:
    - Am dureri de cap.
    - Mă doare gâtul.
    - Am febră.
  en.a2.unit28.lesson02.teach.appointment_request:
    title: Cererea unei programări
    gloss: Aș dori o programare la medic.
    note: Cu *I'd like to...* ceri politicos o programare.
  en.a2.unit28.lesson02.teach.symptom_duration:
    title: Cum spui de cât timp ai simptome
    gloss: De trei zile am dureri de cap și mă doare gâtul, iar starea se agravează.
    note: 'Pentru ceva care durează de o vreme, engleza folosește *Present Perfect* (*I''ve had ... for three days*). În română se folosește prezentul cu „de”: Am ... de trei zile.'
  en.a2.unit28.lesson03.teach.arrive_early:
    title: arrive ten minutes early
    gloss: să ajungi cu zece minute mai devreme
    note: '*arrive ten minutes early* înseamnă să ajungi cu zece minute înainte de programare.'
    example_gloss: Vă rugăm să ajungeți cu zece minute înainte de programare.
  en.a2.unit28.lesson03.teach.confirmation_text:
    title: Textul confirmării
    gloss: Programarea dumneavoastră este confirmată pentru astăzi, la ora 15:00. Vă rugăm să aduceți cardul de asigurări și să ajungeți cu zece minute mai devreme. Numărul de confirmare este 7724.
    note: O confirmare oficială, cu ora, cu ce trebuie să faci și cu un număr.
  en.a2.unit28.lesson04.teach.i_see:
    title: I see.
    gloss: Am înțeles.
    note: Cu *I see* arăți că ai înțeles ceva.
  en.a2.unit28.lesson04.teach.q_whats_wrong:
    title: Întrebarea ce s-a întâmplat
    gloss: 'Medicul întreabă: Ce probleme aveți?'
    note: Aceeași întrebare pe care a pus-o Leila în unitatea 22, acum din partea medicului.
  en.a2.unit28.lesson04.teach.a_symptoms_duration:
    title: Răspunsul lui Daniel despre simptome
    gloss: 'Daniel spune: De trei zile am dureri de cap și mă doare gâtul, iar starea se agravează.'
    note: Aceeași propoziție ca în lecția 2.
  en.a2.unit28.lesson04.teach.a_bad_cold:
    title: Diagnosticul medicului
    gloss: 'Medicul spune: Înțeleg. Aveți o răceală puternică.'
    note: Un diagnostic simplu, obișnuit, nimic grav.
  en.a2.unit28.lesson04.teach.q_medicine:
    title: Întrebarea despre medicamente
    gloss: 'Daniel întreabă: Să iau vreun medicament?'
    note: Daniel întreabă despre tratament, după ce a aflat diagnosticul.
  en.a2.unit28.lesson04.teach.a_medicine_instructions:
    title: Instrucțiuni despre medicament
    gloss: 'Medicul spune: Da, luați acest medicament de două ori pe zi, timp de cinci zile, și beți multă apă.'
    note: 'O indicație precisă: de două ori pe zi, timp de cinci zile.'
  en.a2.unit28.lesson04.teach.q_follow_up:
    title: Cererea unei programări de control
    gloss: 'Daniel întreabă: Să revin dacă nu se ameliorează?'
    note: Daniel folosește aceeași condiție (*if it doesn't get better*) pe care a folosit-o Leila în unitatea 22.
  en.a2.unit28.lesson04.teach.a_followup_appointment:
    title: Răspunsul medicului despre consultul de control
    gloss: 'Medicul spune: Da, dacă nu se ameliorează în decurs de o săptămână, reveniți la o programare de control.'
    note: 'Medicul spune exact când trebuie să revină Daniel: dacă nu se ameliorează într-o săptămână.'
