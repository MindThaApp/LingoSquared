    note: '*fish* înseamnă pește.'
    example_gloss: El are un pește.
  en.a1.unit32.lesson01.teach.bird:
    title: bird
    gloss: pasăre
    note: '*bird* înseamnă pasăre.'
    example_gloss: Noi avem o pasăre.
  en.a1.unit32.lesson01.teach.pet:
    title: pet
    gloss: animal de companie
    note: '*pet* înseamnă animal de companie; *pets* este pluralul. Observă *any* în întrebarea *Do you have any pets?* În engleză folosești *any* în întrebări și în propoziții negative, cu substantive la plural sau fără plural. În română nu există un cuvânt corespunzător (*Ai animale de companie?* nu conține nimic asemănător), dar în engleză nu îl poți omite.'
    example_gloss: Ai animale de companie?
  en.a1.unit32.lesson02.teach.name_is:
    title: Her name is Luna.
    gloss: O cheamă Luna.
    note: În engleză folosești *her*/*his* (și *she*/*he*) pentru un animal al cărui sex îl cunoști, nu *it*. *Her name is Luna* vorbește deci despre un animal de sex feminin.
  en.a1.unit32.lesson02.teach.play:
    title: play
    gloss: a se juca
    note: '*play* înseamnă a se juca.'
    example_gloss: Câinelui meu îi place să se joace.
  en.a1.unit32.lesson02.teach.walk:
    title: walk
    gloss: a plimba
    note: '*walk* înseamnă aici a-ți scoate animalul la plimbare.'
    example_gloss: Îmi plimb câinele în fiecare zi.
  en.a1.unit32.lesson02.teach.friendly:
    title: friendly
    gloss: prietenos
    note: '*friendly* înseamnă prietenos.'
    example_gloss: Pisica ei este foarte prietenoasă.
  en.a1.unit32.lesson02.teach.small:
    title: small
    gloss: mic
    note: '*small* înseamnă mic.'
    example_gloss: Peștele este mic.
  en.a1.unit32.lesson03.teach.dialogue_line1:
    title: Întrebarea lui Daniel
    gloss: 'Daniel întreabă: Mia, ai animale de companie?'
    note: În română nu există un cuvânt corespunzător pentru *any* din întrebare, dar în engleză nu îl poți omite.
  en.a1.unit32.lesson03.teach.dialogue_line2:
    title: "Răspunsul lui Mia"
    gloss: 'Mia spune: Da, am o pisică. O cheamă Luna.'
    note: '*She* și *her* pentru pisică, pentru că sexul ei (feminin) este cunoscut. În engleză nu folosești *it* pentru un animal al cărui sex îl știi.'
  en.a1.unit32.lesson03.teach.dialogue_line3:
    title: Următoarea întrebare a lui Daniel
    gloss: 'Daniel spune: Ce frumos! Îi place să se joace?'
    note: '*Does* este aici verbul auxiliar pentru *she* (construcția cu *do*), ca în întrebările despre aspect.'
  en.a1.unit32.lesson03.teach.dialogue_line4:
    title: "Răspunsul lui Mia"
    gloss: 'Mia spune: Da, îi place enorm să se joace cu o minge. Dar ție?'
    note: '*What about you?* este un mod scurt și firesc de a pune aceeași întrebare celuilalt.'
  en.a1.unit32.lesson03.teach.dialogue_line5:
    title: "Răspunsul lui Daniel"
    gloss: 'Daniel spune: Am un pește mic, dar îmi doresc un câine.'
    note: '*but* leagă aici două idei opuse: are deja un animal, dar își dorește altul.'
  en.a1.unit32.lesson04.teach.reading_passage:
    title: Text despre Leila și Daniel
    gloss: Leila are un câine pe nume Max. Este mare și foarte prietenos. Ea îl scoate la plimbare în fiecare dimineață. Daniel nu are câine, dar are un pește mic. Peștele nu trebuie scos la plimbare, dar lui Daniel tot îi place să-l privească înotând.
    note: '*He* pentru Max, pentru că este un animal de sex masculin. Și aici alegi *she* sau *he* după sexul real al animalului, nu *it*.'
