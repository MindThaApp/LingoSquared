teaching:
  en.b1.unit17.lesson01.teach.regret:
    title: regret
    gloss: regret
    note: '*regret* înseamnă o stare de tristețe pentru ceva ce ai făcut sau n-ai făcut.'
    example_gloss: Daniel a regretat că a ratat termenul limită.
  en.b1.unit17.lesson01.teach.wish:
    title: wish
    gloss: dorință
    note: '*wish* înseamnă a-ți dori ca ceva să fi decurs altfel decât a decurs în realitate.'
    example_gloss: Daniel a avut o dorință legată de săptămâna trecută.
  en.b1.unit17.lesson01.teach.mistake:
    title: mistake
    gloss: greșeală
    note: '*mistake* înseamnă ceva ce ai făcut greșit din cauza unei judecăți proaste.'
    example_gloss: A aștepta atât de mult înainte să ceri ajutor a fost o greșeală.
  en.b1.unit17.lesson01.teach.hindsight:
    title: hindsight
    gloss: privind în urmă, retrospectiv
    note: '*hindsight* înseamnă înțelegerea unui eveniment pe care o ai abia după ce s-a întâmplat.'
    example_gloss: Privind în urmă, Daniel ar fi trebuit să vorbească mai devreme.
  en.b1.unit17.lesson01.teach.procrastinate:
    title: procrastinate
    gloss: a amâna
    note: '*procrastinate* înseamnă a amâna ceva ce ar trebui să faci.'
    example_gloss: Daniel tinde să amâne sarcinile atunci când i se par dificile.
  en.b1.unit17.lesson01.teach.delay:
    title: delay
    gloss: întârziere
    note: '*delay* înseamnă o perioadă cu care ceva vine mai târziu decât era planificat.'
    example_gloss: Întârzierea a făcut ca Daniel să rateze primul termen limită.
  en.b1.unit17.lesson02.teach.wish_had_asked:
    title: I wish I had + participiu
    gloss: Aș fi vrut să fi cerut ajutor mai devreme.
    note: '*I wish I had asked* exprimă o dorință legată de ceva ce nu s-a întâmplat în trecut.'
  en.b1.unit17.lesson02.teach.should_have_talked:
    title: I should have + participiu
    gloss: Ar fi trebuit să vorbesc mai devreme cu șeful meu.
    note: '*I should have talked* spune ce ar fi fost fapta potrivită, privind în urmă.'
  en.b1.unit17.lesson02.teach.if_i_had_asked_would_have_finished:
    title: if I had + participiu, I would have + participiu
    gloss: Dacă i-aș fi cerut ajutor Miei în prima săptămână, aș fi terminat la timp.
    note: '*if I had asked..., I would have finished...* descrie o consecință ireală în trecut.'
  en.b1.unit17.lesson02.teach.grammar_past_hypothetical:
    title: Forme pentru a exprima regretul față de trecut
    gloss: Ca să exprimi un regret legat de trecut, folosește wish + past perfect (I wish I had asked...), should have + participiu (I should have talked...) sau if + past perfect cu would have + participiu (If I had asked..., I would have finished...). Toate trei descriu ceva ce de fapt nu s-a întâmplat.
    note: 'Formă: alege între wish + had, should have sau if + had ... would have.'
  en.b1.unit17.lesson03.teach.looking_back:
    title: looking back
    gloss: privind în urmă
    note: '*looking back* introduce o reflecție despre trecut.'
    example_gloss: Privind în urmă, Daniel regretă că nu a cerut ajutor mai devreme.
  en.b1.unit17.lesson03.teach.missed_deadline:
    title: missed deadline
    gloss: termen limită ratat
    note: '*missed deadline* înseamnă o dată-limită care nu a fost respectată.'
    example_gloss: Daniel a ratat un termen limită înainte să ceară ajutor.
  en.b1.unit17.lesson03.teach.reading_passage:
    title: 'Text de citit: privire înapoi asupra unei luni obositoare'
    gloss: Salut, Leila, privind în urmă, aș fi vrut să fi cerut ajutor mai devreme. Ar fi trebuit să vorbesc mai devreme cu șeful meu despre volumul de muncă. Până când am făcut-o, ratasem deja un termen limită. Dacă i-aș fi cerut ajutor Miei în prima săptămână, aș fi terminat ambele proiecte la timp. A fost o greșeală să aștept atât de mult. Daniel
    note: Un mesaj scurt, plin de reflecție.
  en.b1.unit17.lesson04.teach.q_wish_asked_sooner:
    title: Daniel începe cu o reflecție
    gloss: 'Daniel spune: Privind în urmă, aș fi vrut să fi cerut ajutor mai devreme.'
    note: '*looking back* deschide o conversație reflexivă.'
  en.b1.unit17.lesson04.teach.a_what_happened:
    title: Leila întreabă mai departe
    gloss: 'Leila spune: Ce s-a întâmplat?'
    note: O întrebare scurtă și deschisă, ca să afli mai multe.
  en.b1.unit17.lesson04.teach.q_should_have_talked_missed:
    title: Daniel explică ce ar fi trebuit să facă
    gloss: 'Daniel spune: Ar fi trebuit să vorbesc mai devreme cu șeful meu despre volumul de muncă. Până când am făcut-o, ratasem deja un termen limită.'
    note: '*should have talked* și *had already missed* leagă regretul de o consecință concretă.'
  en.b1.unit17.lesson04.teach.a_fair_regret_fixed:
    title: Leila îl liniștește pe Daniel
    gloss: 'Leila spune: Nu-ți face griji, până la urmă ai rezolvat.'
    note: '*Don''t worry* liniștește pe cineva care se simte vinovat.'
  en.b1.unit17.lesson04.teach.q_true_if_had_asked:
    title: Daniel descrie ce ar fi putut fi altfel
    gloss: 'Daniel spune: Adevărat. Dacă i-aș fi cerut ajutor Miei în prima săptămână, aș fi terminat ambele proiecte la timp.'
    note: '*if I had asked..., I would have finished...* descrie o consecință ireală în trecut.'
  en.b1.unit17.lesson04.teach.a_now_you_know:
    title: Leila încheie încurajator
    gloss: 'Leila spune: Ei bine, acum știi pentru data viitoare.'
    note: O încheiere scurtă și pozitivă a conversației.
