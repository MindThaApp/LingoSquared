teaching:
  en.b1.unit04.lesson01.teach.agree:
    title: agree
    gloss: a fi de acord
    note: '*agree* înseamnă că gândești că altcineva are dreptate.'
    example_gloss: Sunt de acord cu tine.
  en.b1.unit04.lesson01.teach.disagree:
    title: disagree
    gloss: a nu fi de acord
    note: '*disagree* înseamnă că gândești că altcineva nu are dreptate.'
    example_gloss: Nu sunt de acord cu această părere.
  en.b1.unit04.lesson01.teach.opinion:
    title: opinion
    gloss: părere
    note: '*opinion* înseamnă o părere personală despre ceva.'
    example_gloss: Fiecare are altă părere.
  en.b1.unit04.lesson01.teach.believe:
    title: believe
    gloss: a crede
    note: '*believe* înseamnă că gândești că ceva este adevărat.'
    example_gloss: Cred că e o idee bună.
  en.b1.unit04.lesson01.teach.reason:
    title: reason
    gloss: motiv
    note: '*reason* înseamnă explicația din spatele unei păreri.'
    example_gloss: Care este motivul pentru care gândești așa?
  en.b1.unit04.lesson01.teach.save_time:
    title: save time
    gloss: a economisi timp
    note: '*save time* înseamnă că ai nevoie de mai puțin timp pentru ceva.'
    example_gloss: Munca de acasă mă ajută să economisesc timp.
  en.b1.unit04.lesson02.teach.agree_that_saves_time:
    title: Zustimmen und einen Grund nennen
    gloss: Sunt de acord că munca de acasă este mai bună, pentru că economisești timp.
    note: '*I agree that... because...* leagă o părere de un motiv.'
  en.b1.unit04.lesson02.teach.disagree_that_miss_coworkers:
    title: Widersprechen und einen Grund nennen
    gloss: Nu sunt de acord că e mai bine, pentru că le duci dorul colegilor.
    note: '*I disagree that... because...* leagă o părere contrară de un motiv.'
  en.b1.unit04.lesson02.teach.grammar_agree_disagree_that:
    title: agree that / disagree that
    gloss: Sunt de acord că e mai bine. Nu sunt de acord că e mai bine.
    note: După *agree*/*disagree*, *that* introduce propoziția care spune părerea cu care ești sau nu de acord. În engleză nu se pune virgulă înaintea lui *that*.
  en.b1.unit04.lesson03.teach.focus:
    title: focus
    gloss: a se concentra
    note: '*focus* înseamnă a-ți îndrepta atenția spre ceva.'
    example_gloss: Acasă se poate concentra mai ușor.
  en.b1.unit04.lesson03.teach.respect:
    title: respect
    gloss: a respecta
    note: '*respect* înseamnă a ține seama de părerea altcuiva, chiar dacă nu ești de acord.'
    example_gloss: Ei respectă părerea celuilalt.
  en.b1.unit04.lesson03.teach.reading_passage:
    title: 'Lesetext: zwei Meinungen'
    gloss: Mia crede că munca de acasă este mai bună, pentru că se poate concentra mai ușor. Leila nu este de acord. Ea crede că este mai bine să mergi la birou, pentru că îi place să-și vadă colegii în fiecare zi. Nu sunt de acord unul cu altul, dar își respectă părerile.
    note: Un text scurt cu două păreri opuse.
  en.b1.unit04.lesson04.teach.q_working_from_home:
    title: Daniel eröffnet die Debatte
    gloss: 'Daniel spune: Crezi că munca de acasă este mai bună decât munca la birou?'
    note: O întrebare deschisă, pentru a stârni o dezbatere.
  en.b1.unit04.lesson04.teach.a_disagree_miss_coworkers:
    title: Leila sieht das anders
    gloss: 'Leila spune: Nu sunt de acord că e mai bine. Cred că pierzi conversații importante cu colegii.'
    note: Leila își spune părerea și un motiv.
  en.b1.unit04.lesson04.teach.q_fair_point_saves_time:
    title: Daniel erkennt Leilas Argument an, bleibt aber bei seiner Meinung
    gloss: 'Daniel spune: Ai un punct de vedere valid, dar sunt de acord că economisești mult timp.'
    note: '*that''s a fair point* recunoaște părerea celuilalt înainte să o spui pe a ta.'
  en.b1.unit04.lesson04.teach.a_agree_saves_time_prefer_office:
    title: Leila gibt etwas zu, bleibt aber bei ihrer Vorliebe
    gloss: 'Leila spune: Sunt de acord că economisești timp, dar tot prefer biroul.'
    note: Leila recunoaște un argument fără să-și schimbe părerea de ansamblu.
  en.b1.unit04.lesson04.teach.q_everyone_different_opinion:
    title: Daniel beendet das Gespräch
    gloss: 'Daniel spune: Înțeleg. Fiecare are altă părere.'
    note: O modalitate naturală și prietenoasă de a încheia o diferență de păreri.
