  en.a1.unit55.lesson02.teach.id_like_to_buy_a_ticket:
    title: I'd like to buy a ticket, please.
    gloss: Aș dori să cumpăr un bilet, vă rog.
    note: '*I''d like to* (forma scurtă de la *I would like to*) este modul politicos de a cere ceva.'
  en.a1.unit55.lesson02.teach.where_are_the_lockers:
    title: Where are the lockers?
    gloss: Unde sunt dulapurile?
    note: '*Where are...?* folosește ordinea inversată (verbul înaintea subiectului), tipică pentru întrebările în engleză.'
  en.a1.unit55.lesson02.teach.what_time_do_you_open:
    title: What time do you open?
    gloss: La ce oră deschideți?
    note: '*do you open* folosește auxiliarul *do* pentru forma de întrebare.'
  en.a1.unit55.lesson02.teach.its_five_dollars_for_one_ticket:
    title: It's five dollars for one ticket.
    gloss: Costă cinci dolari un bilet.
    note: '*for one ticket* înseamnă „pentru un bilet”.'
  en.a1.unit55.lesson02.teach.do_i_need_a_swim_cap:
    title: Do I need a swim cap?
    gloss: Am nevoie de cască de înot?
    note: '*Do I need...?* folosește auxiliarul *do* pentru forma de întrebare.'
  en.a1.unit55.lesson02.teach.we_close_at_eight:
    title: We close at eight o'clock.
    gloss: Noi închidem la ora opt.
    note: '*at eight o''clock* – engleza folosește *at* pentru o oră fixă, ca „la” în română.'
  en.a1.unit55.lesson03.teach.dialogue_line1:
    title: Salvatorul salută
    gloss: 'Salvatorul spune: Bună ziua! Veniți să înotați astăzi?'
    note: '*Are you here to swim today?* folosește *to swim* pentru a arăta scopul – ca „să înotați” în română.'
  en.a1.unit55.lesson03.teach.dialogue_line2:
    title: Biletele lui Daniel
    gloss: 'Daniel spune: Da, două bilete, vă rog.'
    note: O cerere scurtă și directă pentru două bilete.
  en.a1.unit55.lesson03.teach.dialogue_line3:
    title: Prețul
    gloss: 'Salvatorul spune: Sigur! Costă cinci dolari un bilet.'
    note: 'O singură informație: prețul unui bilet.'
  en.a1.unit55.lesson03.teach.dialogue_line4:
    title: Mia întreabă despre casca de înot
    gloss: 'Mia spune: Avem nevoie de cască de înot?'
    note: '*Do we need...?* – din nou auxiliarul *do* pentru forma de întrebare.'
  en.a1.unit55.lesson03.teach.dialogue_line5:
    title: Regula cu casca de înot
    gloss: 'Salvatorul spune: Da, casca de înot este obligatorie în piscină.'
    note: '*swim caps are required* este o formă pasivă – o modalitate formală de a enunța o regulă, folosită adesea pe panourile de la piscină și de către personal. Și în română se poate spune „casca de înot este obligatorie” sau „trebuie să purtați cască de înot”.'
  en.a1.unit55.lesson03.teach.dialogue_line6:
    title: Daniel întreabă despre dulapuri
    gloss: 'Daniel spune: Unde sunt dulapurile?'
    note: O întrebare scurtă, fără o informație nouă despre preț sau oră.
  en.a1.unit55.lesson03.teach.dialogue_line7:
    title: Locul dulapurilor
    gloss: 'Salvatorul spune: Dulapurile sunt lângă intrare.'
    note: 'O singură informație: unde sunt dulapurile – altceva decât ce le trebuie dulapurilor ca să funcționeze.'
  en.a1.unit55.lesson03.teach.dialogue_line8:
    title: Ce funcționează cu dulapurile
    gloss: 'Salvatorul spune: Au nevoie de o monedă de un dolar.'
    note: '*a dollar coin* este format din două cuvinte englezești (*dollar* + *coin*), scrise separat. În română se spune „o monedă de un dolar”.'
  en.a1.unit55.lesson03.teach.dialogue_line9:
    title: Mia întreabă despre ora de închidere
    gloss: 'Mia spune: La ce oră închideți?'
    note: '*What time do you close?* folosește auxiliarul *do* pentru forma de întrebare.'
  en.a1.unit55.lesson03.teach.dialogue_line10:
    title: Ora de închidere
    gloss: 'Salvatorul spune: Noi închidem la ora opt.'
    note: 'A patra informație, separată: ora de închidere.'
  en.a1.unit55.lesson04.teach.reading_passage:
    title: 'Text: O zi la piscină'
    gloss: 'Într-o după-amiază fierbinte de iulie, Daniel și Mia s-au hotărât să se răcorească la piscina comunității. Lângă intrare, un panou enumera regulile piscinei: nu alergați și casca de înot este obligatorie în piscină. Au cerut salvatorului două bilete. Un bilet costa cinci dolari. Salvatorul le-a explicat că dulapurile sunt lângă intrare și funcționează cu o monedă de un dolar. Daniel și Mia și-au pus gențile într-un dulap și au înotat aproape două ore. Înainte să plece, au verificat panoul încă o dată: piscina se închide la ora opt. Mia a spus că vrea să revină weekendul viitor și să încerce trambulina.'
    note: '*required* este o formă pasivă – *swim caps are required* înseamnă „casca de înot este obligatorie”.'
