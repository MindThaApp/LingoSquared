    note: '*fire department* înseamnă pompieri.'
    example_gloss: Pompierii sunt aici.
  en.a1.unit45.lesson02.teach.call_911:
    title: Call 911!
    gloss: Sună la 911!
    note: În SUA, în caz de urgență se sună la *911*, nu la *112* ca în România -- o diferență importantă de ținut minte.
  en.a1.unit45.lesson02.teach.i_need_help:
    title: I need help!
    gloss: Am nevoie de ajutor!
    note: '*I need help!* înseamnă „Am nevoie de ajutor!”'
  en.a1.unit45.lesson02.teach.send_the_police:
    title: Send the police, please.
    gloss: Trimiteți poliția, vă rog.
    note: '*Send the police, please.* înseamnă „Trimiteți poliția, vă rog.”'
  en.a1.unit45.lesson02.teach.send_an_ambulance:
    title: Send an ambulance, please.
    gloss: Trimiteți o ambulanță, vă rog.
    note: '*Send an ambulance, please.* înseamnă „Trimiteți o ambulanță, vă rog.”'
  en.a1.unit45.lesson02.teach.theres_a_fire:
    title: There's a fire!
    gloss: Este un incendiu!
    note: '*There''s a fire!* înseamnă „Este un incendiu!”'
  en.a1.unit45.lesson02.teach.whats_your_emergency:
    title: What's your emergency?
    gloss: Care este urgența dumneavoastră?
    note: Aceasta este întrebarea standard a unui dispecer american de urgență de îndată ce suni la 911.
  en.a1.unit45.lesson03.teach.dialogue_line1:
    title: Leila simte miros de fum
    gloss: 'Leila întreabă: Daniel, arde ceva? Simt miros de fum!'
    note: '*smell* + substantiv, fără prepoziție: *I smell smoke* înseamnă „simt miros de fum”. Atenție: *I smell of smoke* înseamnă altceva („miros a fum”).'
  en.a1.unit45.lesson03.teach.dialogue_line2:
    title: Explicația lui Daniel
    gloss: 'Daniel spune: O, nu, a luat foc tigaia! Pregăteam cina.'
    note: '*caught fire* este o expresie fixă pentru a lua foc brusc.'
  en.a1.unit45.lesson03.teach.dialogue_line3:
    title: Instrucțiunile Leilei
    gloss: 'Leila spune: Calmează-te. Închide aragazul! Chem eu ajutor.'
    note: '*call for help* înseamnă „a chema ajutor”. Nu omite cuvântul *for* aici.'
  en.a1.unit45.lesson03.teach.dialogue_line4:
    title: Avertismentul lui Daniel
    gloss: 'Daniel spune: Grăbește-te, focul se face tot mai mare!'
    note: '*getting bigger* înseamnă „a deveni mai mare” -- *get* + adjectiv exprimă o schimbare.'
  en.a1.unit45.lesson03.teach.dialogue_line5:
    title: Leila sună la numărul de urgență
    gloss: 'Leila spune: Bună ziua, este o urgență. Este un incendiu în bucătăria prietenului meu. Vă rog să trimiteți pompierii.'
    note: 'Așa sună o convorbire cu dispeceratul de urgență din SUA: acolo se sună la 911, nu la 112.'
  en.a1.unit45.lesson03.teach.dialogue_line6:
    title: Ușurarea lui Daniel
    gloss: 'Daniel spune: Slavă Domnului. Cred că s-a stins acum, dar hai să așteptăm afară, pentru orice eventualitate.'
    note: '*just in case* înseamnă „pentru orice eventualitate”.'
  en.a1.unit45.lesson03.teach.dialogue_line7:
    title: Sfatul Leilei
    gloss: 'Leila spune: Bună idee. Este mai sigur să așteptăm afară până vin ei.'
    note: '*safer* este comparativul lui *safe*, format cu *-er*, ca la multe adjective scurte (de exemplu *big* -> *bigger*). În română, comparativul se face cu „mai”: mai sigur.'
  en.a1.unit45.lesson04.teach.reading_passage:
    title: Text despre măsurile de urgență
    gloss: 'În caz de incendiu: În primul rând, rămâi calm. În al doilea rând, părăsește imediat clădirea. Nu folosi liftul; folosește scările. În al treilea rând, după ce ai ieșit, sună la 911 și spune adresa. În final, așteaptă afară până sosesc pompierii. După incendiul din bucătăria lui Daniel, el și Leila au așteptat afară, exact cum scria în anunț. Pompierii au sosit repede și s-au asigurat că totul este în siguranță. Mai târziu, Mia a venit să vadă cum se simt și a fost ușurată că nimeni nu a fost rănit.'
    note: '*elevator* este cuvântul american pentru lift. În engleza britanică se spune *lift*.'
