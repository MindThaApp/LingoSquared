teaching:
  en.a1.unit61.lesson01.teach.sorry:
    title: sorry
    gloss: scuze / îmi pare rău
    note: '*sorry* este cuvântul obișnuit pentru a-ți cere scuze.'
    example_gloss: Îmi pare rău.
  en.a1.unit61.lesson01.teach.late:
    title: late
    gloss: târziu / cu întârziere
    note: '*late* înseamnă care nu este la timp.'
    example_gloss: Am întârziat.
  en.a1.unit61.lesson01.teach.excuse:
    title: excuse
    gloss: motiv / scuză
    note: '*excuse* este un motiv pe care îl dai pentru o problemă.'
    example_gloss: Aceasta este scuza mea.
  en.a1.unit61.lesson01.teach.traffic:
    title: traffic
    gloss: trafic
    note: '*traffic* înseamnă circulația de pe drum.'
    example_gloss: Traficul este aglomerat.
  en.a1.unit61.lesson01.teach.mistake:
    title: mistake
    gloss: greșeală
    note: '*mistake* înseamnă greșeală.'
    example_gloss: Am făcut o greșeală.
  en.a1.unit61.lesson01.teach.problem:
    title: problem
    gloss: problemă
    note: '*problem* înseamnă problemă.'
    example_gloss: Nicio problemă.
  en.a1.unit61.lesson02.teach.im_sorry:
    title: I'm sorry.
    gloss: Îmi pare rău.
    note: '*I''m sorry* este fraza standard pentru a-ți cere scuze.'
  en.a1.unit61.lesson02.teach.im_late:
    title: I'm late.
    gloss: Am întârziat.
    note: '*late* înseamnă aici cu întârziere, nu târziu în noapte.'
  en.a1.unit61.lesson02.teach.bus_is_late:
    title: The bus is late.
    gloss: Autobuzul întârzie.
    note: 'În engleză folosești aceeași structură pentru o persoană și pentru un autobuz: *is late*.'
  en.a1.unit61.lesson02.teach.thats_okay:
    title: That's okay.
    gloss: Nu-i nimic.
    note: '*That''s okay* acceptă o scuză într-un mod prietenos.'
  en.a1.unit61.lesson02.teach.no_problem:
    title: No problem.
    gloss: Nicio problemă.
    note: '*No problem* este un răspuns scurt și informal la o scuză sau la o mulțumire.'
  en.a1.unit61.lesson02.teach.made_mistake:
    title: I made a mistake.
    gloss: Am făcut o greșeală.
    note: În engleză se spune *make a mistake*, nu *do a mistake*. Verbul make corespunde lui „a face”, ca în „a face o greșeală”.
  en.a1.unit61.lesson03.teach.dialogue_line1:
    title: "Daniel își cere scuze"
    gloss: 'Daniel spune: Bună, Mia. Îmi pare rău că am întârziat.'
    note: '*I''m sorry I''m late* îmbină cererea de scuze cu motivul.'
  en.a1.unit61.lesson03.teach.dialogue_line2:
    title: Mia acceptă scuzele
    gloss: 'Mia spune: Nu-i nimic.'
    note: '*That''s okay* este prietenos și simplu.'
  en.a1.unit61.lesson03.teach.dialogue_line3:
    title: Autobuzul întârzie
    gloss: 'Daniel spune: Autobuzul întârzie.'
    note: Această propoziție dă motivul.
  en.a1.unit61.lesson03.teach.dialogue_line4:
    title: Mia spune că putem aștepta
    gloss: 'Mia spune: Nicio problemă. Putem aștepta.'
    note: '*We can wait* înseamnă că putem aștepta.'
  en.a1.unit61.lesson03.teach.dialogue_line5:
    title: Daniel a greșit ora
    gloss: 'Daniel spune: Am făcut o greșeală cu ora.'
    note: '*with the time* înseamnă cu ora, în privința orei.'
  en.a1.unit61.lesson03.teach.dialogue_line6:
    title: Cursul începe la trei
    gloss: 'Mia spune: Nu-i nimic. Cursul începe la ora trei.'
    note: '*at three* folosește *at* înaintea unei ore.'
  en.a1.unit61.lesson03.teach.dialogue_line7:
    title: Daniel îi mulțumește Miei
    gloss: 'Daniel spune: Mulțumesc că ai așteptat.'
    note: '*Thank you for waiting* folosește *for* urmat de forma cu -ing.'
  en.a1.unit61.lesson04.teach.class_note:
    title: Mesaj despre curs
    gloss: 'Mesaj despre curs: Cursul începe la ora 3:00. Te rog să vii la timp. Dacă întârzii, trimite un mesaj.'
    note: Mesajul spune ce trebuie să faci dacă întârzii.
  en.a1.unit61.lesson04.teach.reading_passage:
    title: 'Text: Scuze înainte de curs'
    gloss: 'Scuze înainte de curs: Daniel a întârziat la curs pentru că autobuzul a întârziat. A întâlnit-o pe Mia în fața sălii de curs. Daniel a spus că îi pare rău. A mai spus că a făcut o greșeală cu ora. Mia a spus că nu-i nimic. Cursul era la ora 3:00. Daniel i-a trimis profesorului un mesaj scurt. În mesaj scria: „Îmi pare rău că am întârziat. Autobuzul întârzie.”'
    note: '*because* arată motivul: pentru că autobuzul a întârziat.'
