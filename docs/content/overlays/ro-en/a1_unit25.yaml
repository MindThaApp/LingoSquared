    note: '*always* înseamnă întotdeauna; stă înaintea verbului: *I always go running*.'
  en.a1.unit30.lesson02.teach.often:
    title: often
    gloss: des
    note: '*often* înseamnă des. Observă ordinea cuvintelor în engleză: *She often cooks dinner* (subiect, *often*, verb). În română poți spune atât «Ea gătește des cina pentru familie», cât și «Des gătește ea cina»; în engleză adverbul de frecvență stă de obicei între subiect și verb.'
