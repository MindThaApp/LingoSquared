    gloss: Ce faci în timpul liber?
    note: '*free time* înseamnă timp liber.'
  en.a1.unit30.lesson03.teach.i_like_pattern:
    title: I like reading.
    gloss: Îmi place cititul.
    note: '*I like* + un verb în forma cu *-ing* folosești ca să spui că îți place o activitate.'
  en.a1.unit30.lesson03.teach.dialogue_line1:
    title: Întrebarea Leilei
    gloss: 'Leila întreabă: Ce faci tu în timpul liber, Daniel?'
    note: Leila deschide conversația cu o întrebare directă adresată lui Daniel.
  en.a1.unit30.lesson03.teach.dialogue_line2:
    title: "Răspunsul lui Daniel"
    gloss: 'Daniel spune: Merg des la alergat. Și uneori gătesc. Dar tu?'
    note: Daniel numește două hobby-uri cu frecvența lor și întoarce întrebarea cu *What about you?*
  en.a1.unit30.lesson03.teach.dialogue_line3:
    title: Leila despre pictat
    gloss: 'Leila spune: Iubesc pictatul. Pictez aproape în fiecare weekend.'
    note: '*almost every weekend* înseamnă aproape în fiecare weekend.'
  en.a1.unit30.lesson03.teach.dialogue_line4:
    title: Întrebarea următoare a lui Daniel
    gloss: 'Daniel spune: Grozav! Joci uneori jocuri video?'
    note: Cu *Do you ever...?* întrebi dacă cineva face vreodată ceva.
  en.a1.unit30.lesson03.teach.dialogue_line5:
    title: Ultimul răspuns al Leilei
    gloss: 'Leila spune: Rareori. Prefer să citesc o carte.'
    note: '*I prefer...* înseamnă: prefer să..., îmi place mai mult să...'
  en.a1.unit30.lesson04.teach.reading_passage:
    title: Text despre hobby-uri
    gloss: Daniel și Leila au hobby-uri diferite. Daniel merge întotdeauna la alergat sâmbătă dimineața și uneori gătește pentru prietenii lui. Leila nu aleargă niciodată, dar pictează des în weekend. Amândurora le plac jocurile video, dar rareori joacă împreună.
    note: Acest text compară direct hobby-urile lui Daniel și ale Leilei și cât de des le fac.
