    title: sometimes
    gloss: uneori
    note: '*sometimes* înseamnă uneori. În engleză, subiectul rămâne înaintea verbului chiar dacă *sometimes* stă la începutul propoziției: *Sometimes I go running*. Nu schimbi ordinea subiect-verb, ca în întrebări.'
