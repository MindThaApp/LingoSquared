teaching:
  en.a1.unit16.lesson01.teach.wake_up:
    title: Wake up
    gloss: a se trezi
    note: '*wake up* înseamnă a te trezi. Este format dintr-un verb și o particulă (*up*) și se scrie în două cuvinte separate.'
  en.a1.unit16.lesson01.teach.get_dressed:
    title: Get dressed
    gloss: a se îmbrăca
    note: '*get dressed* înseamnă a te îmbrăca. În engleză nu există un „te” separat ca în română: nu spui *get yourself dressed*.'
  en.a1.unit16.lesson01.teach.go_to_work:
    title: Go to work
    gloss: a merge la serviciu
    note: '*go to work* înseamnă a merge la serviciu. În această expresie fixă nu există articol înaintea cuvântului *work*.'
  en.a1.unit16.lesson01.teach.have_dinner:
    title: Have dinner
    gloss: a lua cina
    note: '*have dinner* înseamnă a lua cina. Mesele se folosesc fără articol: *have breakfast*, *have lunch*, *have dinner*.'
  en.a1.unit16.lesson01.teach.go_to_bed:
    title: Go to bed
    gloss: a merge la culcare
    note: '*go to bed* înseamnă a merge la culcare, ca să dormi. Nici aici nu există articol înaintea cuvântului *bed*.'
  en.a1.unit16.lesson02.teach.what_time_wake_up:
    title: What time do you wake up?
    gloss: La ce oră te trezești?
    note: 'Cu *What time do you wake up?* întrebi la ce oră se trezește cineva. Întrebarea cu *do* cere un verb auxiliar: nu spui *What time wake you up*.'
  en.a1.unit16.lesson02.teach.i_wake_up_at:
    title: I wake up at seven every day.
    gloss: Mă trezesc la ora șapte în fiecare zi.
    note: '*every day* se folosește pentru un obicei zilnic. Se așază la sfârșitul sau la începutul propoziției.'
  en.a1.unit16.lesson02.teach.in_the_morning:
    title: I get dressed in the morning.
    gloss: Mă îmbrac dimineața.
    note: '*in the morning* arată o parte a zilei, nu o oră exactă. Românescul „dimineața” se exprimă prin *in the morning*.'
  en.a1.unit16.lesson02.teach.usually_at_night:
    title: I usually go to bed at eleven.
    gloss: De obicei mă culc la ora unsprezece.
    note: '*usually* înseamnă de obicei; descrie un obicei care nu este mereu exact la fel. Fii atent la ordinea cuvintelor: în engleză, *usually* stă înaintea verbului principal (*I usually go*). Spre deosebire de română, unde „de obicei” se poate muta liber în propoziție, în engleză nu se mișcă așa; *I go usually to bed* este greșit.'
  en.a1.unit16.lesson03.teach.then:
    title: Then
    gloss: apoi / după aceea
    note: '*then* înseamnă apoi sau după aceea; arată ordinea evenimentelor.'
    example_gloss: Mănânc micul dejun, apoi merg la serviciu.
  en.a1.unit16.lesson03.teach.routine_text:
    title: Text despre o zi obișnuită
    gloss: În fiecare zi mă trezesc la ora șapte. Apoi mă îmbrac și iau micul dejun.
    note: Aceasta este o scurtă descriere a unei dimineți obișnuite.
  en.a1.unit16.lesson04.teach.after_that:
    title: What do you do after that?
    gloss: Ce faci după aceea?
    note: Cu *What do you do after that?* întrebi ce urmează în programul zilei.
  en.a1.unit16.lesson04.teach.q_wake_time:
    title: Întrebare despre ora trezirii
    gloss: 'Leila întreabă: La ce oră te trezești?'
    note: Aceeași întrebare ca înainte.
  en.a1.unit16.lesson04.teach.a_wake_seven:
    title: Răspuns despre trezire
    gloss: 'Daniel spune: Mă trezesc la șapte în fiecare zi.'
    note: Un răspuns complet spune și ora, și repetarea zilnică.
  en.a1.unit16.lesson04.teach.q_after_that:
    title: Întrebare despre ce urmează
    gloss: 'Leila întreabă: Ce faci după aceea?'
    note: Această întrebare continuă firesc conversația despre programul zilei.
  en.a1.unit16.lesson04.teach.a_full_routine:
    title: Descrierea întregii zile
    gloss: 'Daniel spune: Mă îmbrac, iau micul dejun și merg la serviciu. De obicei mă culc la ora unsprezece.'
    note: Daniel enumeră mai multe activități, în ordinea corectă.
