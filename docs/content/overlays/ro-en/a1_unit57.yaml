teaching:
  en.a1.unit57.lesson01.teach.cinema:
    title: cinema
    gloss: cinema
    note: '*cinema* înseamnă cinematograf.'
    example_gloss: Acest cinema este foarte popular.
  en.a1.unit57.lesson01.teach.ticket:
    title: ticket
    gloss: bilet
    note: '*ticket* înseamnă bilet.'
    example_gloss: Trebuie să cumpăr un bilet.
  en.a1.unit57.lesson01.teach.showtime:
    title: showtime
    gloss: ora de începere (a filmului)
    note: '*showtime* înseamnă ora de începere – momentul în care începe filmul.'
    example_gloss: La ce oră începe filmul?
  en.a1.unit57.lesson01.teach.seat:
    title: seat
    gloss: loc / scaun
    note: '*seat* înseamnă loc sau scaun.'
    example_gloss: Este liber acest loc?
  en.a1.unit57.lesson01.teach.screen:
    title: screen
    gloss: ecran
    note: '*screen* înseamnă ecran.'
    example_gloss: Ecranul este foarte mare.
  en.a1.unit57.lesson01.teach.popcorn:
    title: popcorn
    gloss: floricele de porumb
    note: '*popcorn* înseamnă floricele de porumb.'
    example_gloss: Cumpărăm mereu floricele de porumb la cinema.
  en.a1.unit57.lesson02.teach.what_time_does_the_film_start:
    title: What time does the film start?
    gloss: La ce oră începe filmul?
    note: '*does the film start* folosește auxiliarul *does* pentru întrebare, pentru că verbul principal este *start*.'
  en.a1.unit57.lesson02.teach.two_tickets_for_the_seven_oclock_show:
    title: Two tickets for the seven o'clock show, please.
    gloss: Două bilete pentru reprezentația de la ora șapte, vă rog.
    note: '*for the seven o''clock show* leagă biletele de o anumită reprezentație.'
  en.a1.unit57.lesson02.teach.can_i_have_some_popcorn:
    title: Can I have some popcorn, please?
    gloss: Pot să iau niște floricele de porumb, vă rog?
    note: '*Can I have...?* este o formă directă și foarte folosită pentru a comanda ceva.'
  en.a1.unit57.lesson02.teach.how_much_is_that_in_total:
    title: How much is that in total?
    gloss: Cât face în total?
    note: '*in total* înseamnă în total și se folosește pentru a întreba prețul final.'
  en.a1.unit57.lesson02.teach.thats_twenty_dollars:
    title: That's twenty dollars, please.
    gloss: Fac douăzeci de dolari, vă rog.
    note: '*That''s* + preț este o formulă fixă pentru a spune o sumă.'
  en.a1.unit57.lesson02.teach.i_really_liked_it:
    title: I really liked it!
    gloss: Mi-a plăcut foarte mult!
    note: În engleză se folosește aici verbul *like* cu complementul *it*. În română spunem „Mi-a plăcut”, cu construcția „a-i plăcea”, în care lucrul plăcut este subiectul. Învață fraza ca întreg, nu cuvânt cu cuvânt.
  en.a1.unit57.lesson03.teach.dialogue_line1:
    title: Daniel întreabă ora de începere
    gloss: 'Daniel spune: Bună! La ce oră începe filmul?'
    note: '*does the film start* folosește auxiliarul does pentru întrebare.'
  en.a1.unit57.lesson03.teach.dialogue_line2:
    title: Ora de începere
    gloss: 'Casiera spune: Următoarea reprezentație este la ora șapte.'
    note: '*at seven o''clock* folosește prepoziția *at* pentru o oră – în română spunem „la ora șapte”, deci prepoziția corespunde aici lui „la”.'
  en.a1.unit57.lesson03.teach.dialogue_line3:
    title: Daniel comandă bilete
    gloss: 'Daniel spune: Perfect. Putem lua două bilete, vă rog?'
    note: 'Un fapt separat: numărul de bilete (două).'
  en.a1.unit57.lesson03.teach.dialogue_line4:
    title: Prețul biletelor
    gloss: 'Casiera spune: Desigur. Fac șaisprezece dolari.'
    note: 'Un fapt separat: prețul celor două bilete împreună.'
  en.a1.unit57.lesson03.teach.dialogue_line5:
    title: Leila comandă floricele
    gloss: 'Leila spune: Putem lua niște floricele de porumb, vă rog?'
    note: O cerere, nu un nou fapt despre preț.
  en.a1.unit57.lesson03.teach.dialogue_line6:
    title: Prețul floricelelor
    gloss: 'Casiera spune: Sigur. Floricelele costă patru dolari.'
    note: 'Un alt fapt separat: prețul floricelelor, nu al biletelor.'
  en.a1.unit57.lesson03.teach.dialogue_line7:
    title: Daniel întreabă totalul
    gloss: 'Daniel spune: Cât face în total?'
    note: '*in total* întreabă suma tuturor prețurilor.'
  en.a1.unit57.lesson03.teach.dialogue_line8:
    title: Suma totală
    gloss: 'Casiera spune: Fac douăzeci de dolari, vă rog.'
    note: 'Un al treilea fapt separat: suma totală, diferită de prețurile separate ale biletelor și floricelelor.'
  en.a1.unit57.lesson03.teach.dialogue_line9:
    title: Leila abia așteaptă
    gloss: 'Leila spune: Mulțumesc! Abia aștept să-l văd.'
    note: '*I can''t wait to...* este o expresie fixă pentru entuziasm.'
  en.a1.unit57.lesson04.teach.cinema_schedule:
    title: Programul cinematografului
    gloss: 'Programul cinematografului: Star Journey - 7:00, $8. The Great Race - 5:00, $10. Funny Family - 9:00, $6.'
    note: Programul arată trei filme, cu ora de începere și prețul lor.
  en.a1.unit57.lesson04.teach.reading_passage:
    title: 'Text: O seară la cinema'
    gloss: Într-o seară, Daniel și Leila au hotărât să meargă împreună la un film la cinema. Au întrebat la ce oră începe, iar casiera a spus că următoarea reprezentație, Star Journey, este la ora șapte. Au cumpărat două bilete cu șaisprezece dolari și o pungă de floricele cu patru dolari. Au plătit douăzeci de dolari în total. Au văzut filmul împreună, iar acesta a fost despre exploratori spațiali. A fost foarte amuzant. Când s-a terminat, Leila a spus că i-a plăcut foarte mult, iar Daniel a spus că vrea să vadă și următorul.
    note: '*watched* este forma de trecut a verbului *watch* (a se uita la).'
