    title: You can get a refund.
    gloss: Poți primi banii înapoi.
    note: '*get a refund* înseamnă a primi banii înapoi.'
  en.a1.unit65.lesson03.teach.dialogue_line1:
    title: Daniel vrea să returneze ceva
    gloss: 'Daniel spune: Bună ziua. Vreau să returnez această cămașă.'
    note: '*return this shirt* înseamnă a returna această cămașă.'
  en.a1.unit65.lesson03.teach.dialogue_line2:
    title: Angajatul cere bonul
    gloss: 'Angajatul spune: Aveți bonul?'
    note: '*Do you have...?* întreabă dacă cineva are ceva la el.'
  en.a1.unit65.lesson03.teach.dialogue_line3:
    title: Daniel are bonul
    gloss: 'Daniel spune: Da, poftiți. Mărimea este prea mică.'
    note: '*Here it is* înseamnă poftiți, iată-l.'
  en.a1.unit65.lesson03.teach.dialogue_line4:
    title: Angajatul propune schimbul
    gloss: 'Angajatul spune: Îl putem schimba cu o mărime mai mare.'
    note: '*for a larger size* arată cu ce se schimbă articolul.'
  en.a1.unit65.lesson03.teach.dialogue_line5:
    title: "Daniel spune da"
    gloss: 'Daniel spune: Da, vă rog.'
    note: '*Yes, please* este o confirmare politicoasă.'
  en.a1.unit65.lesson03.teach.dialogue_line6:
    title: Există o mărime mai mare
    gloss: 'Angajatul spune: Avem o mărime mai mare, în albastru.'
    note: '*We have...* spune ce este disponibil.'
  en.a1.unit65.lesson03.teach.dialogue_line7:
    title: Daniel nu are nevoie de rambursare
    gloss: 'Daniel spune: Perfect. Nu am nevoie de rambursare.'
    note: '*I do not need* înseamnă nu am nevoie de.'
  en.a1.unit65.lesson04.teach.return_note:
    title: Notă de returnare
    gloss: 'Notă de returnare: Cămașă albastră. Mărimea mică. Schimb cu o mărime mai mare. Bonul este obligatoriu.'
    note: Nota indică articolul, mărimea, acțiunea și bonul.
  en.a1.unit65.lesson04.teach.reading_passage:
    title: 'Text: Un schimb la magazin'
    gloss: 'Un schimb la magazin: Daniel a cumpărat o cămașă albastră, dar mărimea era prea mică. S-a întors la magazin cu bonul. Angajatul a cerut bonul și i-a oferit o mărime mai mare. Daniel a schimbat cămașa. Nu a avut nevoie de rambursare, pentru că cămașa albastră mai mare i se potrivea.'
    note: '*exchanged* este forma de trecut a verbului *exchange*.'
