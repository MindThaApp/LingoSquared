  en.a1.unit59.lesson02.teach.i_need_cash:
    title: I need cash.
    gloss: Am nevoie de bani numerar.
    note: '*need* înseamnă a avea nevoie de; complementul vine direct după el: *need cash*.'
  en.a1.unit59.lesson02.teach.where_is_the_atm:
    title: Where is the ATM?
    gloss: Unde este bancomatul?
    note: '*Where is...?* este forma obișnuită de întrebare pentru a afla un loc.'
  en.a1.unit59.lesson02.teach.check_my_balance:
    title: I want to check my balance.
    gloss: Vreau să îmi verific soldul.
    note: '*check my balance* este o expresie fixă de la bancă pentru a-ți verifica soldul.'
  en.a1.unit59.lesson02.teach.can_i_use_this_card:
    title: Can I use this card?
    gloss: Pot folosi acest card?
    note: '*Can I use...?* întreabă dacă ceva este posibil sau permis.'
  en.a1.unit59.lesson02.teach.enter_your_pin:
    title: Please enter your PIN.
    gloss: Te rog să introduci codul PIN.
    note: '*enter* înseamnă aici a introduce. *PIN* este chiar codul.'
  en.a1.unit59.lesson02.teach.atm_outside:
    title: The ATM is outside.
    gloss: Bancomatul este afară.
    note: '*outside* stă la sfârșit: *is outside*.'
  en.a1.unit59.lesson03.teach.dialogue_line1:
    title: Mia întreabă de bancomat
    gloss: 'Mia spune: Bună! Unde este bancomatul?'
    note: '*Where is...?* întreabă despre loc.'
  en.a1.unit59.lesson03.teach.dialogue_line2:
    title: Locul bancomatului
    gloss: 'Angajatul spune: Bancomatul este afară.'
    note: '*outside* înseamnă afară, în exterior.'
  en.a1.unit59.lesson03.teach.dialogue_line3:
    title: Leila întreabă de cardul ei
    gloss: 'Leila spune: Pot folosi acest card?'
    note: '*this card* se referă la cardul pe care îl are la ea.'
  en.a1.unit59.lesson03.teach.dialogue_line4:
    title: Cardul funcționează
    gloss: 'Angajatul spune: Da, poți folosi cardul acela.'
    note: '*Yes* înseamnă da; *that card* se referă la cardul Leilei.'
  en.a1.unit59.lesson03.teach.dialogue_line5:
    title: Mia vrea să își verifice soldul
    gloss: 'Mia spune: Vreau să îmi verific soldul.'
    note: '*want to check* folosește *to* pentru al doilea verb.'
  en.a1.unit59.lesson03.teach.dialogue_line6:
    title: Codul PIN
    gloss: 'Angajatul spune: Te rog să introduci codul PIN.'
    note: '*Please* face rugămintea politicoasă.'
  en.a1.unit59.lesson03.teach.dialogue_line7:
    title: Și Leila are nevoie de numerar
    gloss: 'Leila spune: Și eu am nevoie de bani numerar.'
    note: '*too* înseamnă și, de asemenea, și stă aici la sfârșit.'
  en.a1.unit59.lesson03.teach.dialogue_line8:
    title: Retragerea a douăzeci de dolari
    gloss: 'Angajatul spune: Poți retrage douăzeci de dolari.'
    note: '*take out* înseamnă aici a retrage bani.'
  en.a1.unit59.lesson03.teach.dialogue_line9:
    title: Mia îi mulțumește angajatului
    gloss: 'Mia spune: Mulțumesc! Mă ajută foarte mult.'
    note: '*helpful* înseamnă de ajutor, folositor.'
  en.a1.unit59.lesson04.teach.bank_notice:
    title: Anunțul băncii
    gloss: 'Anunțul băncii: Deschis între 9:00 și 16:00. Bancomat afară. Limita de retragere astăzi: 100 de dolari. Se acceptă carduri.'
    note: Anunțul indică programul, locul bancomatului și limita.
  en.a1.unit59.lesson04.teach.reading_passage:
    title: 'Text: O scurtă oprire la bancă'
    gloss: 'O scurtă oprire la bancă: Într-o dimineață, Mia și Leila au mers împreună la bancă. Mia voia să își verifice soldul, iar Leila avea nevoie de bani numerar. Angajatul a spus că bancomatul este afară. Leila și-a folosit cardul și a retras douăzeci de dolari. Mia și-a introdus codul PIN și și-a verificat soldul. Înainte să plece, au citit anunțul. Banca era deschisă între 9:00 și 16:00, iar limita pentru numerar era de 100 de dolari. Mia a spus că vizita a fost simplă.'
    note: '*took out* este forma de trecut a verbului *take out* cu sensul a retrage bani.'
