  en.a1.unit51.lesson03.teach.dialogue_line1:
    title: Farmacistul salută
    gloss: 'Farmacistul spune: Bună ziua, vă pot ajuta?'
    note: '*Hi, can I help you?* înseamnă „Bună ziua, vă pot ajuta?”.'
  en.a1.unit51.lesson03.teach.dialogue_line2:
    title: Simptomele Leilei
    gloss: 'Leila spune: Da, am o tuse puternică și îmi curge nasul.'
    note: Repetarea unei fraze învățate mai devreme.
  en.a1.unit51.lesson03.teach.dialogue_line3:
    title: Farmacistul recomandă un sirop
    gloss: 'Farmacistul spune: Am un sirop de tuse care ar trebui să ajute. Luați-l înainte de culcare.'
    note: '*before bed* înseamnă „înainte de culcare” – se referă la siropul de tuse, nu la tablete.'
  en.a1.unit51.lesson03.teach.dialogue_line4:
    title: Întrebarea lui Daniel
    gloss: 'Daniel întreabă: Aveți și ceva pentru durerea în gât?'
    note: '*too* la sfârșitul propoziției înseamnă „și”, „de asemenea”.'
  en.a1.unit51.lesson03.teach.dialogue_line5:
    title: Farmacistul recomandă tablete
    gloss: 'Farmacistul spune: Da, aceste tablete sunt bune pentru durerea în gât. Luați câte una la fiecare patru ore.'
    note: 'Aici este vorba despre doza tabletelor: la fiecare patru ore. Siropul se ia la alt moment, înainte de culcare.'
  en.a1.unit51.lesson03.teach.dialogue_line6:
    title: Decizia Leilei
    gloss: 'Leila spune: Excelent, le iau pe amândouă. Cât costă?'
    note: '*I''ll take both.* înseamnă „Le iau pe amândouă.”.'
  en.a1.unit51.lesson03.teach.dialogue_line7:
    title: Prețul
    gloss: 'Farmacistul spune: Sunt nouă dolari.'
    note: Repetarea unei fraze învățate mai devreme.
  en.a1.unit51.lesson03.teach.dialogue_line8:
    title: Leila plătește
    gloss: 'Leila spune: Poftiți. Mulțumesc!'
    note: '*Here you go.* înseamnă „Poftiți.”, când dai cuiva ceva.'
  en.a1.unit51.lesson04.teach.reading_passage:
    title: Text despre o vizită la farmacie
    gloss: 'O vizită la farmacie: La câteva zile după excursia ei la munte cu Mia, Leila s-a răcit. Avea o tuse puternică și îi curgea nasul, iar o durea și gâtul. Daniel a însoțit-o la farmacia de lângă apartamentul ei. Farmacistul a ascultat simptomele Leilei și i-a recomandat sirop de tuse și tablete. Farmacistul i-a spus să ia siropul de tuse înainte de culcare și câte o tabletă la fiecare patru ore. Leila a plătit nouă dolari pentru amândouă. În drum spre casă, Daniel i-a cumpărat și o cutie de șervețele. Leila a luat medicamentele în seara aceea, iar până la sfârșitul săptămânii tusea era mult mai ușoară.'
    note: '*by the weekend* înseamnă „până la sfârșitul săptămânii”.'
