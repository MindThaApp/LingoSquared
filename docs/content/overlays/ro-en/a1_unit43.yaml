    gloss: alb
    note: '*white* înseamnă alb.'
    example_gloss: Tricoul ei este alb.
  en.a1.unit43.lesson02.teach.dark_blue:
    title: dark blue
    gloss: albastru închis
    note: '*dark blue* se scrie în engleză cu două cuvinte separate: *dark* arată nuanța, iar *blue* culoarea.'
    example_gloss: El poartă o cămașă albastru închis.
  en.a1.unit43.lesson02.teach.light_green:
    title: light green
    gloss: verde deschis
    note: '*light green* se scrie, ca și *dark blue*, cu două cuvinte separate: *light* arată nuanța, iar *green* culoarea.'
    example_gloss: Ea și-a vopsit dormitorul în verde deschis.
  en.a1.unit43.lesson02.teach.goes_well_with:
    title: goes well with
    gloss: se potrivește bine cu
    note: '*goes well with* înseamnă că două culori sau două piese de îmbrăcăminte se potrivesc bine.'
    example_gloss: Această cămașă albastră se potrivește bine cu pantalonii negri.
  en.a1.unit43.lesson02.teach.too_bright:
    title: too bright
    gloss: prea strident
    note: '*too bright* înseamnă prea strident sau prea țipător ca nuanță.'
    example_gloss: Galbenul este o culoare veselă, dar prea țipătoare pentru serviciu.
  en.a1.unit43.lesson02.teach.whats_your_favorite_color:
    title: What's your favorite color?
    gloss: Care este culoarea ta preferată?
    note: '*What''s your favorite ...?* întreabă despre preferința cuiva.'
  en.a1.unit43.lesson02.teach.my_favorite_color_is:
    title: My favorite color is blue.
    gloss: Culoarea mea preferată este albastrul.
    note: '*My favorite ... is ...* este modul obișnuit de a spune ce preferi.'
  en.a1.unit43.lesson03.teach.dialogue_line1:
    title: Întrebarea lui Daniel
    gloss: 'Daniel întreabă: Am nevoie de o cămașă nouă pentru prezentarea noastră de săptămâna viitoare. Mă poți ajuta să aleg o culoare?'
    note: '*Can you help me* + verb*?* cere ajutor.'
  en.a1.unit43.lesson03.teach.dialogue_line2:
    title: Întrebarea Miei
    gloss: 'Mia spune: Sigur! Ce culori îți plac?'
    note: '*What colors do you like?* întreabă ce culori preferă cineva.'
  en.a1.unit43.lesson03.teach.dialogue_line3:
    title: "Răspunsul lui Daniel"
    gloss: 'Daniel spune: Îmi plac albastrul și verdele, dar nu știu sigur ce arată profesionist.'
    note: '*I''m not sure what looks professional* înseamnă: nu știu sigur ce arată profesionist.'
  en.a1.unit43.lesson03.teach.dialogue_line4:
    title: Sfatul Miei
    gloss: 'Mia spune: Albastrul închis este o alegere excelentă. Arată profesionist și se potrivește bine cu pantalonii negri.'
    note: '*It looks professional* înseamnă: arată profesionist.'
  en.a1.unit43.lesson03.teach.dialogue_line5:
    title: Întrebarea lui Daniel
    gloss: 'Daniel întreabă: Dar cea galbenă asta?'
    note: '*What about ...?* propune o alternativă.'
  en.a1.unit43.lesson03.teach.dialogue_line6:
    title: Sfatul Miei
    gloss: 'Mia spune: Galbenul este o culoare veselă, dar prea țipătoare pentru o prezentare. Eu aș alege cămașa albastru închis.'
    note: '*I''d choose* înseamnă: eu aș alege.'
  en.a1.unit43.lesson03.teach.dialogue_line7:
    title: Decizia lui Daniel
    gloss: 'Daniel spune: Mulțumesc, Mia. Atunci, albastru închis!'
    note: '*Dark blue it is!* este o modalitate informală de a confirma o decizie.'
  en.a1.unit43.lesson04.teach.reading_passage:
    title: Text despre trei culori preferate
    gloss: Daniel, Leila și Mia au culori preferate diferite. Culoarea preferată a lui Daniel este albastrul. El spune că este o culoare calmă și că se potrivește cu aproape tot ce poartă la serviciu. Culoarea preferată a Leilei este verdele, culoarea plantelor și a grădinilor pe care îi place să le picteze. Verdele deschis i se pare deosebit de frumos. Culoarea preferată a Miei este galbenul, pentru că îi amintește de soare și o face mereu fericită. Chiar dacă fiecare iubește altă culoare, toți trei sunt de acord că culorile fac fiecare zi mai plăcută.
    note: '*reminds her of the sun* înseamnă: îi amintește de soare.'
