teaching:
  en.b1.unit05.lesson01.teach.responsible_for:
    title: responsible for
    gloss: responsabil de
    note: '*responsible for* înseamnă că este sarcina ta să te ocupi de ceva.'
    example_gloss: Sunt responsabil de raportul lunar.
  en.b1.unit05.lesson01.teach.update:
    title: update
    gloss: actualizare, informații noi
    note: '*update* înseamnă informații noi despre cum merg lucrurile.'
    example_gloss: Îi dau echipei mele o actualizare în fiecare săptămână.
  en.b1.unit05.lesson01.teach.deadline:
    title: deadline
    gloss: termen-limită
    note: '*deadline* înseamnă data până la care ceva trebuie să fie gata.'
    example_gloss: Termenul-limită pentru raport este vineri.
  en.b1.unit05.lesson01.teach.report:
    title: report
    gloss: raport
    note: '*report* înseamnă un document scris despre muncă sau rezultate.'
    example_gloss: Scriu în fiecare lună un raport de vânzări.
  en.b1.unit05.lesson01.teach.on_schedule:
    title: on schedule
    gloss: conform planificării
    note: '*on schedule* înseamnă că ceva merge conform planului și nu întârzie.'
    example_gloss: Proiectul se încadrează în grafic.
  en.b1.unit05.lesson01.teach.behind_schedule:
    title: behind schedule
    gloss: în întârziere față de grafic
    note: '*behind schedule* înseamnă că ceva înaintează mai încet decât s-a planificat.'
    example_gloss: Săptămâna asta suntem puțin în urmă cu graficul.
  en.b1.unit05.lesson02.teach.responsible_for_report:
    title: Eine Zuständigkeit nennen
    gloss: Sunt responsabil de raportul lunar.
    note: '*I''m responsible for...* este o modalitate directă de a descrie o sarcină la serviciu.'
  en.b1.unit05.lesson02.teach.project_on_schedule:
    title: Sagen, dass etwas im Zeitplan liegt
    gloss: Proiectul se încadrează în grafic.
    note: '*on schedule* înseamnă că nu există nicio întârziere.'
  en.b1.unit05.lesson02.teach.behind_schedule_finish_friday:
    title: Eine Statusmeldung geben
    gloss: Sunt puțin în întârziere, dar termin până vineri.
    note: '*I''m a little behind schedule, but I''ll finish by...* este o modalitate sinceră de a anunța o întârziere și de a spune un termen concret.'
  en.b1.unit05.lesson02.teach.grammar_status_update:
    title: Statusmeldungen geben
    gloss: Sunt responsabil de raport. Proiectul se încadrează în grafic. Sunt în întârziere.
    note: Aceste trei propoziții sunt formulări standard pentru a vorbi la serviciu despre responsabilități și progres.
  en.b1.unit05.lesson03.teach.team:
    title: team
    gloss: echipă
    note: '*team* înseamnă un grup de oameni care lucrează împreună.'
    example_gloss: Îi dă echipei lui un scurt raport de stadiu în fiecare săptămână.
  en.b1.unit05.lesson03.teach.technical_problem:
    title: technical problem
    gloss: problemă tehnică
    note: '*technical problem* înseamnă o problemă cu echipamentele sau cu software-ul.'
    example_gloss: Este în întârziere din cauza unei probleme tehnice.
  en.b1.unit05.lesson03.teach.reading_passage:
    title: 'Lesetext: Daniels Wochenbericht'
    gloss: Daniel este responsabil de raportul lunar de vânzări. În fiecare săptămână le dă colegilor din echipă un scurt raport de stadiu. Săptămâna asta este puțin în urmă cu graficul din cauza unei probleme tehnice, dar se așteaptă să termine până vineri. Le spune mereu adevărul colegilor despre întârzieri.
    note: Un text scurt despre cum vorbește Daniel sincer despre o întârziere.
  en.b1.unit05.lesson04.teach.q_could_you_help_review:
    title: Daniel bittet Mia um Hilfe
    gloss: 'Daniel spune: Mia, m-ai putea ajuta să verific raportul ăsta înainte să îl trimit?'
    note: '*could you help me...* este o modalitate politicoasă de a cere ajutorul unui coleg.'
  en.b1.unit05.lesson04.teach.a_of_course_what_help:
    title: Mia sagt zu
    gloss: 'Mia spune: Sigur. Cu ce ai nevoie de ajutor?'
    note: '*of course* este o modalitate prietenoasă și directă de a spune da.'
  en.b1.unit05.lesson04.teach.q_make_sure_numbers:
    title: Daniel erklärt, was er braucht
    gloss: 'Daniel spune: Vreau să mă asigur că cifrele sunt corecte.'
    note: '*make sure* înseamnă a verifica dacă ceva este corect.'
  en.b1.unit05.lesson04.teach.a_check_this_afternoon:
    title: Mia verspricht, es durchzusehen
    gloss: 'Mia spune: Nicio problemă. Mă uit după-amiază la el și îți trimit observațiile mele.'
    note: '*I''ll check it this afternoon* este o promisiune concretă, cu moment precizat.'
  en.b1.unit05.lesson04.teach.q_thank_you_appreciate:
    title: Daniel bedankt sich bei Mia
    gloss: 'Daniel spune: Mulțumesc, chiar apreciez asta.'
    note: '*I really appreciate it* este o modalitate sinceră de a-ți exprima recunoștința.'
  en.b1.unit05.lesson04.teach.a_youre_welcome_let_me_know:
    title: Mia bietet weitere Hilfe an
    gloss: 'Mia spune: Cu plăcere. Spune-mi dacă mai ai nevoie de ceva.'
    note: '*let me know if...* lasă ușa deschisă pentru alt ajutor.'
