teaching:
  en.a1.unit66.lesson01.teach.symptom:
    title: symptom
    gloss: simptom / suferință
    note: '*symptom* înseamnă un simptom sau o suferință pe care o simți. Ortografia diferă de română: *symptom* se scrie cu *y*, nu cu *i*.'
    example_gloss: Acesta este un simptom.
  en.a1.unit66.lesson01.teach.cough:
    title: cough
    gloss: tuse
    note: '*cough* înseamnă tuse. Pronunția este *kof*; grupul *gh* se pronunță aici ca *f*.'
    example_gloss: Am o tuse.
  en.a1.unit66.lesson01.teach.fever:
    title: fever
    gloss: febră
    note: '*fever* înseamnă febră. Cuvântul este înrudit cu cel românesc, dar ortografia diferă.'
    example_gloss: Ai febră?
  en.a1.unit66.lesson01.teach.throat:
    title: throat
    gloss: gât
    note: '*throat* înseamnă gât în sensul de gât interior, gâtlej; pentru gâtul exterior se spune *neck*.'
    example_gloss: Mă doare gâtul.
  en.a1.unit66.lesson01.teach.headache:
    title: headache
    gloss: durere de cap
    note: '*headache* înseamnă durere de cap (în engleză, la singular).'
    example_gloss: Mă doare capul.
  en.a1.unit66.lesson01.teach.medicine:
    title: medicine
    gloss: medicament
    note: '*medicine* înseamnă medicament sau medicină. Cuvântul este nenumărabil: *some medicine*.'
    example_gloss: Ia acest medicament.
  en.a1.unit66.lesson02.teach.have_cough:
    title: I have a cough.
    gloss: Am tuse.
    note: În engleză spui *have a cough*, cu *a*; în română de obicei nu există articol („Am tuse”).
  en.a1.unit66.lesson02.teach.throat_hurts:
    title: My throat hurts.
    gloss: Mă doare gâtul.
    note: '*hurts* înseamnă „doare”. În engleză, partea corpului este subiectul (*my throat hurts*), deci nu apare un „mă” ca în română.'
  en.a1.unit66.lesson02.teach.have_headache:
    title: I have a headache.
    gloss: Mă doare capul.
    note: În engleză spui *have a headache*, cu *a*; în română spui „mă doare capul”, cu un verb diferit.
  en.a1.unit66.lesson02.teach.have_medicine:
    title: Do you have medicine?
    gloss: Aveți un medicament?
    note: '*Do you have...?* întreabă dacă există ceva.'
  en.a1.unit66.lesson02.teach.with_water:
    title: Take this with water.
    gloss: Luați asta cu apă.
    note: '*with water* stă la sfârșitul propoziției.'
  en.a1.unit66.lesson02.teach.ask_doctor:
    title: Please ask a doctor.
    gloss: Vă rog să întrebați un medic.
    note: '*Please* face propoziția politicoasă.'
  en.a1.unit66.lesson03.teach.dialogue_line1:
    title: Leila spune un simptom
    gloss: 'Leila spune: Bună ziua. Am tuse.'
    note: '*I have a cough* spune o suferință.'
  en.a1.unit66.lesson03.teach.dialogue_line2:
    title: Farmacistul întreabă despre febră
    gloss: 'Farmacistul spune: Aveți febră?'
    note: '*Do you have a fever?* este o întrebare cu răspuns da sau nu.'
  en.a1.unit66.lesson03.teach.dialogue_line3:
    title: Leila nu are febră
    gloss: 'Leila spune: Nu, nu am febră. Mă doare gâtul.'
    note: '*No, I do not have...* neagă o suferință. În engleză negi cu *do not*, nu cu „nu” înaintea verbului ca în română.'
  en.a1.unit66.lesson03.teach.dialogue_line4:
    title: Farmacistul întreabă despre durerea de cap
    gloss: 'Farmacistul spune: Vă doare capul?'
    note: '*headache* înseamnă durere de cap.'
  en.a1.unit66.lesson03.teach.dialogue_line5:
    title: Leila are dureri de cap
    gloss: 'Leila spune: Da, mă doare capul.'
    note: '*Yes* înseamnă da.'
  en.a1.unit66.lesson03.teach.dialogue_line6:
    title: Sfatul farmacistului
    gloss: 'Farmacistul spune: Luați acest medicament cu apă. Vă rog să întrebați un medic dacă vă simțiți mai rău.'
    note: '*if you feel worse* înseamnă „dacă vă simțiți mai rău”.'
  en.a1.unit66.lesson03.teach.dialogue_line7:
    title: Leila mulțumește
    gloss: 'Leila spune: Mulțumesc.'
    note: '*Thank you* este formula scurtă de mulțumire.'
  en.a1.unit66.lesson04.teach.pharmacy_note:
    title: Bilet de la farmacie
    gloss: 'Bilet de la farmacie: Tuse și durere în gât. Fără febră. Luați medicamentul cu apă. Întrebați un medic dacă se agravează.'
    note: Biletul menționează simptomele și sfaturi simple.
  en.a1.unit66.lesson04.teach.reading_passage:
    title: 'Text: O vizită la farmacie'
    gloss: 'O vizită la farmacie: Leila a mers la farmacie pentru că avea tuse și o durea gâtul. Farmacistul a întrebat-o dacă are febră. Leila a spus că nu are febră, dar că o doare capul. Farmacistul i-a dat un medicament și i-a spus să-l ia cu apă. Pe bilet scria să întrebe un medic dacă se simte mai rău.'
    note: '*felt worse* este forma de trecut a lui *feel worse*.'
