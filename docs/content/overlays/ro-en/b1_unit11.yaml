teaching:
  en.b1.unit11.lesson01.teach.would:
    title: would
    gloss: ar (condițional)
    note: '*would* + forma de bază exprimă un rezultat imaginat sau o preferință exprimată politicos.'
    example_gloss: M-aș înscrie dacă aș avea mai mult timp.
  en.b1.unit11.lesson01.teach.would_rather:
    title: would rather
    gloss: ar prefera să, mai degrabă
    note: '*would rather* înseamnă că preferi să faci ceva în loc de altceva.'
    example_gloss: Aș prefera să urmez cursul de weekend.
  en.b1.unit11.lesson01.teach.if_i_were:
    title: if I were
    gloss: dacă aș fi
    note: '*if I were* introduce o situație ireală despre tine însuți.'
    example_gloss: Dacă aș fi liber în seara asta, aș merge.
  en.b1.unit11.lesson01.teach.opportunity:
    title: opportunity
    gloss: ocazie, șansă
    note: '*opportunity* înseamnă o ocazie bună de a face ceva.'
    example_gloss: Acest curs este o ocazie bună pentru Leila.
  en.b1.unit11.lesson01.teach.regret:
    title: regret
    gloss: regret
    note: '*regret* înseamnă părere de rău pentru o alegere din trecut.'
    example_gloss: 'Are un singur regret: că nu a început mai devreme să economisească.'
  en.b1.unit11.lesson01.teach.take_a_chance:
    title: take a chance
    gloss: a risca, a încerca
    note: '*take a chance* înseamnă a încerca ceva chiar dacă reușita nu e sigură.'
    example_gloss: Dacă cursul ar fi mai ieftin, ar risca.
  en.b1.unit11.lesson02.teach.more_time_course:
    title: O situație ireală în prezent
    gloss: Dacă aș avea mai mult timp, aș urma un curs de design.
    note: 'Pentru o situație ireală în prezent, după *if* se folosește trecutul: *If I had more time*. În română, această idee se exprimă cu condiționalul: „dacă aș avea”, „dacă ar fi”.'
  en.b1.unit11.lesson02.teach.cheaper_sign_up:
    title: if it were cheaper
    gloss: Dacă ar fi mai ieftin, m-aș înscrie azi.
    note: '*were* sună natural într-o condiție ireală, chiar și după *it*.'
  en.b1.unit11.lesson02.teach.grammar_unreal_present:
    title: Condiții ireale în prezent
    gloss: Dacă ar fi mai ieftin, m-aș înscrie.
    note: 'Formă: *if* + trecut, apoi *would* + forma de bază.'
  en.b1.unit11.lesson03.teach.sooner:
    title: sooner
    gloss: mai devreme
    note: '*sooner* înseamnă mai devreme decât momentul în care s-a întâmplat de fapt ceva.'
    example_gloss: Dacă ar fi aflat mai devreme, ar fi economisit mai mulți bani.
  en.b1.unit11.lesson03.teach.confident:
    title: confident
    gloss: încrezător, sigur pe sine
    note: '*confident* înseamnă că ai sentimentul că te pricepi bine la ceva.'
    example_gloss: Dacă s-ar alătura și Daniel, Leila s-ar simți mai încrezătoare.
  en.b1.unit11.lesson03.teach.reading_passage:
    title: 'Text de citit: o ocazie ratată'
    gloss: 'Leila a găsit un curs de design pe care chiar vrea să îl urmeze. Este util, dar scump. Dacă ar fi mai ieftin, s-ar înscrie azi. Dacă s-ar alătura și Daniel cursului, s-ar simți mai încrezătoare. Singurul ei regret ține de momentul ales: dacă ar fi aflat mai devreme despre curs, ar fi economisit mai mulți bani.'
    note: Un text scurt cu condiții ireale în prezent și în trecut.
  en.b1.unit11.lesson04.teach.q_take_if_cheaper:
    title: Mia pune o întrebare ipotetică
    gloss: 'Mia spune: Leila, ai urma cursul de design dacă ar fi mai ieftin?'
    note: O întrebare ipotetică, formulată politicos cu *would*.
  en.b1.unit11.lesson04.teach.a_sign_up_today:
    title: Leila spune rezultatul imaginat
    gloss: 'Leila spune: Sigur. Dacă ar fi mai ieftin, m-aș înscrie azi.'
    note: '*If it were cheaper, I would...* descrie ce ar face într-o altă situație.'
  en.b1.unit11.lesson04.teach.q_daniel_joined:
    title: Mia propune încă un scenariu
    gloss: 'Mia spune: Și dacă s-ar alătura și Daniel?'
    note: '*What if...* introduce o posibilitate imaginată.'
  en.b1.unit11.lesson04.teach.a_more_confident:
    title: Leila își descrie sentimentul
    gloss: 'Leila spune: Dacă s-ar alătura Daniel, m-aș simți mai încrezătoare.'
    note: '*joined* este la trecut pentru că situația este doar imaginată.'
  en.b1.unit11.lesson04.teach.q_would_rather_weekend:
    title: Mia își spune preferința
    gloss: 'Mia spune: Aș prefera să urmez cursul de weekend decât pe cel de seară.'
    note: '*would rather ... than ...* compară două preferințe.'
  en.b1.unit11.lesson04.teach.a_known_sooner:
    title: Leila vorbește despre un regret din trecut
    gloss: 'Leila spune: Și eu. Dacă aș fi aflat mai devreme, aș fi economisit mai mulți bani.'
    note: '*if + past perfect, would have + participiu* descrie o situație ireală în trecut.'
