teaching:
  en.b1.unit06.lesson01.teach.while:
    title: while
    gloss: în timp ce
    note: '*while* înseamnă că ceva se întâmplă în același timp cu altceva.'
    example_gloss: În timp ce conduceam, a început să plouă.
  en.b1.unit06.lesson01.teach.flat_tire:
    title: flat tire
    gloss: pană de cauciuc, roată dezumflată
    note: '*flat tire* înseamnă o roată fără aer, care nu mai funcționează.'
    example_gloss: Mi s-a dezumflat roata pe autostradă.
  en.b1.unit06.lesson01.teach.pull_over:
    title: pull over
    gloss: a trage pe dreapta
    note: '*pull over* înseamnă a opri mașina pe marginea drumului.'
    example_gloss: A trebuit să trag imediat pe dreapta.
  en.b1.unit06.lesson01.teach.stranger:
    title: stranger
    gloss: necunoscut, străin
    note: '*stranger* înseamnă o persoană pe care nu o cunoști.'
    example_gloss: Un necunoscut s-a oprit să mă ajute.
  en.b1.unit06.lesson01.teach.mechanic:
    title: mechanic
    gloss: mecanic, mecanic auto
    note: '*mechanic* înseamnă o persoană care repară mașini.'
    example_gloss: Mecanicul mi-a reparat repede roata.
  en.b1.unit06.lesson01.teach.said_that:
    title: said that
    gloss: a spus că
    note: '*said that* se folosește pentru a reda ce a spus altcineva.'
    example_gloss: A spus că poate ajuta.
  en.b1.unit06.lesson02.teach.while_driving_tire_went_flat:
    title: Acțiunea de fundal cu 'while'
    gloss: În timp ce mergeam spre serviciu, mi s-a dezumflat roata.
    note: '*while* + trecut cu *was/were* + -ing descrie acțiunea de fundal, întreruptă de altceva.'
  en.b1.unit06.lesson02.teach.when_pulled_over_stranger_helped:
    title: Un eveniment următor cu 'when'
    gloss: Când am tras pe dreapta, s-a oprit un necunoscut să mă ajute.
    note: '*when* introduce următorul eveniment din poveste.'
  en.b1.unit06.lesson02.teach.grammar_while_when_sequencing:
    title: '''while'' și ''when'' într-o poveste'
    gloss: În timp ce conduceam, mi s-a dezumflat roata. Când am tras pe dreapta, m-a ajutat un necunoscut.
    note: '*while* marchează fundalul (o acțiune în desfășurare); *when* marchează următorul eveniment, mai scurt, care se petrece în acest cadru.'
  en.b1.unit06.lesson03.teach.had_already_called:
    title: had already called
    gloss: sunase deja
    note: '*had already* + participiul trecut descrie ceva ce se întâmplase deja înaintea unui alt moment din trecut.'
    example_gloss: Când a ajuns el, îl sunasem deja pe Daniel.
  en.b1.unit06.lesson03.teach.kept_his_word:
    title: kept his word
    gloss: și-a ținut cuvântul
    note: '*kept his word* înseamnă că cineva a făcut ceea ce promisese.'
    example_gloss: Și-a ținut cuvântul și a reparat-o în zece minute.
  en.b1.unit06.lesson03.teach.reading_passage:
    title: 'Text de citit: povestea cu pana de cauciuc'
    gloss: Ieri dimineață, în timp ce Leila conducea spre serviciu, i s-a dezumflat brusc roata. A tras pe dreapta pe o stradă liniștită. Un necunoscut și-a oprit mașina și s-a oferit să o ajute. Când a ajuns mecanicul, Leila îl sunase deja pe Daniel ca să-i spună că va întârzia. Mecanicul a spus că poate repara roata în zece minute. Și-a ținut cuvântul, iar Leila a ajuns la serviciu cu doar douăzeci de minute întârziere.
    note: O poveste la trecut, cu acțiune de fundal (*while*), succesiune în timp (*when*) și ceva ce se întâmplase deja înainte (*had already*).
  en.b1.unit06.lesson04.teach.q_youre_late_what_happened:
    title: Daniel observă că Leila întârzie
    gloss: 'Daniel spune: Ai întârziat! Ce s-a întâmplat?'
    note: O întrebare directă, îngrijorată, cu care începe povestea.
  en.b1.unit06.lesson04.teach.a_tire_went_flat_suddenly:
    title: Leila își începe povestea
    gloss: 'Leila spune: În timp ce mergeam spre serviciu, mi s-a dezumflat brusc roata.'
    note: '*while* marchează acțiunea de fundal în timpul căreia s-a întâmplat altceva.'
  en.b1.unit06.lesson04.teach.q_oh_no_what_did_you_do:
    title: Daniel întreabă mai departe
    gloss: 'Daniel spune: Vai! Ce ai făcut?'
    note: O întrebare scurtă de continuare, ca să afle mai multe din poveste.
  en.b1.unit06.lesson04.teach.a_pulled_over_stranger_helped:
    title: Leila continuă povestea
    gloss: 'Leila spune: Am tras pe dreapta și s-a oprit un necunoscut să mă ajute.'
    note: Următorul eveniment din poveste, după acțiunea de fundal.
  en.b1.unit06.lesson04.teach.q_kind_of_him_call_mechanic:
    title: Daniel reacționează și întreabă mai departe
    gloss: 'Daniel spune: A fost drăguț din partea lui. Ai sunat un mecanic?'
    note: '*that was kind of him* este o reacție naturală la amabilitatea cuiva.'
  en.b1.unit06.lesson04.teach.a_had_already_called_mechanic_said:
    title: Leila încheie povestea
    gloss: 'Leila spune: Da, sunasem deja unul înainte să ajungă necunoscutul. Mecanicul a spus că poate repara roata în zece minute și chiar a făcut-o!'
    note: '*had already called* arată ce se întâmplase deja înainte să ajungă necunoscutul.'
