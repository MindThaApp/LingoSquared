  en.a1.unit60.lesson01.teach.free:
    title: free
    gloss: liber / disponibil
    note: '*free* înseamnă aici liber, disponibil, nu gratuit.'
    example_gloss: Ești liber?
  en.a1.unit60.lesson02.teach.are_you_free:
    title: Are you free on Saturday?
    gloss: Ești liber sâmbătă?
    note: '*on Saturday* folosește *on* înaintea unei zile a săptămânii. În română spunem pur și simplu „sâmbătă” sau „în ziua de sâmbătă”.'
  en.a1.unit60.lesson02.teach.would_you_like_dinner:
    title: Would you like to come to dinner?
    gloss: Ai vrea să vii la cină?
    note: '*Would you like to...?* este o modalitate politicoasă de a invita pe cineva.'
  en.a1.unit60.lesson02.teach.bring_a_drink:
    title: Please bring a drink.
    gloss: Te rog să aduci o băutură.
    note: '*bring* înseamnă aici a aduce ceva la întâlnire.'
  en.a1.unit60.lesson02.teach.i_can_come:
    title: I can come.
    gloss: Pot să vin.
    note: Această propoziție acceptă o invitație, pe scurt și clar.
  en.a1.unit60.lesson02.teach.cant_come:
    title: Sorry, I can't come.
    gloss: Îmi pare rău, nu pot să vin.
    note: '*can''t* este forma contrasă de la *cannot*.'
  en.a1.unit60.lesson02.teach.see_you_at_six:
    title: See you at six.
    gloss: Ne vedem la șase.
    note: '*at six* folosește *at* înaintea unei ore. În română spunem „la șase”, deci prepoziția corespunde lui „la”.'
  en.a1.unit60.lesson03.teach.dialogue_line1:
    title: Leila întreabă dacă Daniel este liber
    gloss: 'Leila spune: Bună, Daniel! Ești liber sâmbătă?'
    note: '*Are you free...?* întreabă dacă cineva este disponibil.'
  en.a1.unit60.lesson03.teach.dialogue_line2:
    title: Daniel este liber
    gloss: 'Daniel spune: Da, sunt liber.'
    note: '*I am free* înseamnă că ești disponibil.'
  en.a1.unit60.lesson03.teach.dialogue_line3:
    title: Leila îl invită pe Daniel
    gloss: 'Leila spune: Ai vrea să vii la cină?'
    note: '*Would you like to come...?* este politicos și prietenos.'
  en.a1.unit60.lesson03.teach.dialogue_line4:
    title: Daniel acceptă
    gloss: 'Daniel spune: Da, cu mare plăcere.'
    note: '*I''d love to* este o modalitate caldă de a spune da.'
  en.a1.unit60.lesson03.teach.dialogue_line5:
    title: Leila cere o băutură
    gloss: 'Leila spune: Te rog să aduci o băutură.'
    note: '*Please bring...* este o rugăminte politicoasă.'
  en.a1.unit60.lesson03.teach.dialogue_line6:
    title: Daniel întreabă ora
    gloss: 'Daniel spune: Sigur. La ce oră?'
    note: '*What time?* este o întrebare scurtă și naturală.'
  en.a1.unit60.lesson03.teach.dialogue_line7:
    title: Leila spune ora șase
    gloss: 'Leila spune: Ne vedem la șase.'
    note: '*at six* folosește *at* înaintea unei ore.'
  en.a1.unit60.lesson03.teach.dialogue_line8:
    title: Daniel îi mulțumește Leilei
    gloss: 'Daniel spune: Perfect. Mulțumesc pentru invitație.'
    note: '*Thank you for...* folosește *for* pentru motivul mulțumirii.'
  en.a1.unit60.lesson04.teach.invitation_message:
    title: Invitație
    gloss: 'Invitație la cină: sâmbătă la ora 6:00. Te rog să aduci o băutură. Adresa: Park Street 18.'
    note: Invitația spune ziua, ora, ce trebuie să aducă Daniel și adresa.
  en.a1.unit60.lesson04.teach.reading_passage:
    title: 'Text: Cina acasă la Leila'
    gloss: 'Cina acasă la Leila: Leila l-a invitat pe Daniel la cină sâmbătă. Ea l-a rugat să aducă o băutură. Daniel a spus că poate veni. În invitație scria că cina este la ora 6:00, la Park Street 18. Daniel a scris adresa în telefon. Voia să ajungă la timp. Leila era fericită pentru că prietenul ei putea veni.'
    note: '*invited Daniel to dinner* înseamnă că Leila l-a invitat pe Daniel la cină.'
