teaching:
  en.a1.unit31.lesson01.teach.tall:
    title: tall
    gloss: înalt
    note: '*tall* înseamnă înalt (pentru statura unei persoane).'
    example_gloss: Fratele meu este înalt.
  en.a1.unit31.lesson01.teach.short:
    title: short
    gloss: scund
    note: '*short* înseamnă aici scund (pentru o persoană); *short* înseamnă și „scurt”, de exemplu pentru păr.'
    example_gloss: Sora mea este scundă.
  en.a1.unit31.lesson01.teach.hair:
    title: hair
    gloss: păr
    note: '*hair* înseamnă păr. În engleză este nenumărabil: *her hair is long*, nu *her hairs are long*.'
    example_gloss: Ea are părul lung.
  en.a1.unit31.lesson01.teach.blond:
    title: blond
    gloss: blond
    note: '*blond* înseamnă blond.'
    example_gloss: Părul lui este blond.
  en.a1.unit31.lesson01.teach.curly:
    title: curly
    gloss: buclat
    note: '*curly* înseamnă buclat sau creț.'
    example_gloss: Leila are părul buclat.
  en.a1.unit31.lesson02.teach.eyes:
    title: eyes
    gloss: ochi
    note: '*eyes* înseamnă ochi (la plural).'
    example_gloss: Am ochii căprui.
  en.a1.unit31.lesson02.teach.blue:
    title: blue
    gloss: albastru
    note: '*blue* înseamnă albastru.'
    example_gloss: Ochii ei sunt albaștri.
  en.a1.unit31.lesson02.teach.brown:
    title: brown
    gloss: căprui
    note: '*brown* înseamnă maro sau căprui.'
    example_gloss: Ochii mei sunt căprui.
  en.a1.unit31.lesson02.teach.green:
    title: green
    gloss: verde
    note: '*green* înseamnă verde.'
    example_gloss: El are ochii verzi.
  en.a1.unit31.lesson02.teach.glasses:
    title: glasses
    gloss: ochelari
    note: '*glasses* înseamnă ochelari. Cuvântul este întotdeauna la plural, ca „ochelarii” în română; *wears glasses* înseamnă „poartă ochelari”.'
    example_gloss: Tatăl meu poartă ochelari.
  en.a1.unit31.lesson02.teach.what_look_like:
    title: What does she look like?
    gloss: Cum arată ea?
    note: 'Atenție la construcția întrebării: în română întrebi pur și simplu „Cum arată ea?”, fără verb auxiliar. În engleză, cu un verb obișnuit (*look*) ai nevoie întotdeauna de *does* sau *do*: *What does she look like?*, niciodată *What looks she like?*. Verbul auxiliar *does* este cel pe care vorbitorii de română îl uită cel mai des.'
  en.a1.unit31.lesson03.teach.dialogue_line1:
    title: Începutul Leilei
    gloss: 'Leila spune: Avem azi o nouă colegă. O cheamă Mia.'
    note: '*starting today* înseamnă „începând de azi”.'
  en.a1.unit31.lesson03.teach.dialogue_line2:
    title: Întrebarea lui Daniel
    gloss: 'Daniel întreabă: Cum arată ea?'
    note: 'Din nou *does*: nu-l omite și nu forma întrebarea ca în română, doar prin intonație sau ordinea cuvintelor.'
  en.a1.unit31.lesson03.teach.dialogue_line3:
    title: Descrierea Leilei
    gloss: 'Leila spune: Este înaltă și are părul buclat și blond.'
    note: '*She''s* este forma scurtă de la *she is*.'
  en.a1.unit31.lesson03.teach.dialogue_line4:
    title: Întrebarea următoare a lui Daniel
    gloss: 'Daniel întreabă: Poartă ochelari?'
    note: 'Și aici ai nevoie de *does*: *Does she wear glasses?*, nu *Wears she glasses?*.'
  en.a1.unit31.lesson03.teach.dialogue_line5:
    title: Răspunsul Leilei
    gloss: 'Leila spune: Da, poartă. Are și ochii verzi.'
    note: '*Yes, she does* este un răspuns scurt afirmativ, în care se repetă verbul auxiliar *does*.'
  en.a1.unit31.lesson03.teach.dialogue_line6:
    title: Ultima remarcă a lui Daniel
    gloss: 'Daniel spune: Bine, cred că o văd acum la ușă.'
    note: '*at the door* înseamnă la ușă.'
  en.a1.unit31.lesson04.teach.reading_passage:
    title: Text despre Daniel și Leila
    gloss: Daniel și Leila sunt prieteni buni, dar nu arată la fel. Daniel este înalt și are părul scurt și negru. Poartă ochelari. Leila este scundă și are părul lung, buclat și șaten. Ea are ochii albaștri, iar Daniel are ochii căprui. Amândurora le place să râdă mult.
    note: '*don''t look the same* înseamnă „nu arată la fel”. Și aici ai nevoie de *do* (*don''t* = *do not*), chiar și la negație.'
