teaching:
  en.a1.unit15.lesson01.teach.cash:
    title: Cash
    gloss: numerar
    note: '*cash* înseamnă bani lichizi (bancnote și monede). În engleză este nenumărabil: spui *some cash*, niciodată *a cash*.'
    example_gloss: Am niște numerar.
  en.a1.unit15.lesson01.teach.card:
    title: Card
    gloss: card
    note: '*card* este cuvântul general pentru orice card de plată din plastic.'
    example_gloss: Cardul meu este albastru.
  en.a1.unit15.lesson01.teach.credit_card:
    title: Credit card
    gloss: card de credit
    note: '*credit card* este un card cu care împrumuți bani și îi returnezi mai târziu. Cuvântul corespunde exact termenului românesc „card de credit”.'
  en.a1.unit15.lesson01.teach.debit_card:
    title: Debit card
    gloss: card de debit
    note: '*debit card* este un card prin care banii sunt scoși imediat din contul tău. Cardul obișnuit de salariu sau de cont curent din România este un *debit card*.'
  en.a1.unit15.lesson01.teach.total:
    title: Total
    gloss: suma totală
    note: '*total* este suma întreagă pe care trebuie s-o plătești.'
    example_gloss: Care este suma totală?
  en.a1.unit15.lesson02.teach.do_you_take_cards:
    title: Do you take credit cards?
    gloss: Acceptați carduri de credit?
    note: '*Do you take credit cards?* este întrebarea obișnuită înainte de plată. Aici *take* înseamnă „a accepta”.'
  en.a1.unit15.lesson02.teach.cash_only:
    title: Sorry, cash only.
    gloss: Îmi pare rău, doar numerar.
    note: '*Sorry, cash only.* este răspunsul obișnuit al magazinelor care nu acceptă carduri.'
  en.a1.unit15.lesson02.teach.ill_pay_by_card:
    title: Yes, I'll pay by card.
    gloss: Da, plătesc cu cardul.
    note: '*Yes, I''ll pay by card.* este alegerea finală a metodei de plată. După *by*, *card* nu are articol.'
  en.a1.unit15.lesson03.teach.tax:
    title: Tax
    gloss: taxă
    note: '*tax* este taxa sau impozitul; în majoritatea magazinelor din SUA se adaugă la casă la preț, deci nu este inclusă în prețul de pe etichetă, spre deosebire de TVA-ul din România.'
    example_gloss: Taxa este un dolar.
  en.a1.unit15.lesson03.teach.receipt_text:
    title: Textul bonului
    gloss: 'Cafea: 3 dolari. Sandviș: 6 dolari. Taxă: 1 dolar. Total: 10 dolari.'
    note: Acesta este un bon real.
  en.a1.unit15.lesson03.teach.total_summary_sentence:
    title: The total is $10.
    gloss: Totalul este 10 dolari.
    note: Această propoziție rezumă totalul de pe bon într-o propoziție completă.
  en.a1.unit15.lesson04.teach.q_total:
    title: Întrebare despre suma totală
    gloss: Leila întreabă care este suma totală
    note: '*How much is the total?* este întrebarea obișnuită despre suma finală. *is* este la singular, pentru că *the total* este o sumă.'
  en.a1.unit15.lesson04.teach.a_fifteen:
    title: Răspuns despre suma totală
    gloss: 'Casierul spune: Face cincisprezece dolari.'
    note: '*It''s fifteen dollars.* este un răspuns complet la întrebarea despre suma totală.'
  en.a1.unit15.lesson04.teach.q_cards:
    title: Întrebare despre plata cu cardul
    gloss: Leila întreabă dacă se acceptă carduri de credit
    note: Aceeași întrebare ca înainte.
  en.a1.unit15.lesson04.teach.a_yes_we_do:
    title: Răspuns despre plata cu cardul
    gloss: 'Casierul spune: Da, acceptăm.'
    note: '*Yes, we do.* este un răspuns scurt complet. În engleză se repetă verbul auxiliar *do*, în loc să spui doar „da”.'
  en.a1.unit15.lesson04.teach.closing_pay_by_card:
    title: Alegerea finală a plății
    gloss: 'Leila spune: Perfect, plătesc cu cardul.'
    note: Această propoziție încheie conversația cu alegerea finală a metodei de plată.
