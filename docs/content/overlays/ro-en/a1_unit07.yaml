    title: Leila comandă
    gloss: 'Leila: Bună, aș dori o cafea și un sandviș, vă rog.'
    note: '*Hi* este un salut relaxat, potrivit pentru o cafenea.'
  en.a1.unit07.lesson04.teach.a_anything_else:
    title: Întrebarea suplimentară a chelnerului
    gloss: 'Ospătar: Sigur. Altceva?'
    note: '*Sure* înseamnă aici „sigur” sau „cu plăcere”.'
  en.a1.unit07.lesson04.teach.reply_thats_all:
    title: Răspunsul lui Leila
    gloss: 'Leila: Nu, asta e tot, mulțumesc.'
    note: Un răspuns complet confirmă că toată comanda este încheiată.
  en.a1.unit07.lesson04.teach.q_for_here:
    title: Întrebarea chelnerului
    gloss: 'Ospătar: Aici sau la pachet?'
    note: Întrebarea aceasta se aude des în cafenelele americane, după ce ai comandat.
  en.a1.unit07.lesson04.teach.reply_for_here:
    title: Răspunsul lui Leila
    gloss: 'Leila: Aici, vă rog.'
    note: '*For here* arată că Leila vrea să rămână în cafenea.'
