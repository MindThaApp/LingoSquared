    title: Cafe Menu
    gloss: 'Meniul cafenelei: Cafea - 3 dolari. Ceai - 2 dolari. Supă - 5 dolari. Sandviș - 6 dolari.'
    note: Semnul dolarului stă ÎNAINTEA numărului (*$3*), nu după el.
