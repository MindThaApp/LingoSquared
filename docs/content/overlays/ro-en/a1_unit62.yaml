course:
  title: Engleză A1
  description: Engleză pentru începători, cu explicații clare în română și accent pe conversațiile de zi cu zi.
units:
  en.a1.unit62.phone_calls:
    title: Convorbiri la telefon
lessons:
  en.a1.unit62.lesson01.phone_words:
    title: Cuvinte pentru convorbirile telefonice
  en.a1.unit62.lesson02.phone_phrases:
    title: Propoziții la telefon
  en.a1.unit62.lesson03.dialogue_on_the_phone:
    title: 'Conversație: La telefon'
  en.a1.unit62.lesson04.phone_message:
    title: 'Citim: Un mesaj telefonic'
teaching:
  en.a1.unit62.lesson01.teach.phone:
    title: phone
    gloss: telefon
    note: '*phone* înseamnă telefon. În vorbirea de zi cu zi, *phone* înseamnă de obicei telefonul mobil.'
    example_gloss: Telefonul meu este aici.
  en.a1.unit62.lesson01.teach.call:
    title: call
    gloss: a suna / apel
    note: '*call* poate fi un apel sau poate însemna „a suna”: *a call* (substantiv), *to call* (verb).'
    example_gloss: Te pot suna.
  en.a1.unit62.lesson01.teach.message:
    title: message
    gloss: mesaj
    note: '*message* înseamnă mesaj.'
    example_gloss: Lasă un mesaj.
  en.a1.unit62.lesson01.teach.voicemail:
    title: voicemail
    gloss: mesagerie vocală
    note: '*voicemail* înseamnă un mesaj vorbit lăsat la telefon (căsuța vocală).'
    example_gloss: Mesajul vocal este scurt.
  en.a1.unit62.lesson01.teach.repeat:
    title: repeat
    gloss: a repeta
    note: '*repeat* înseamnă a spune încă o dată.'
    example_gloss: Te rog să repeți asta.
  en.a1.unit62.lesson01.teach.slowly:
    title: slowly
    gloss: încet
    note: '*slowly* înseamnă încet. Este un adverb cu terminația *-ly*; în română „încet” este același cuvânt ca adjectivul, dar în engleză *slow* (adjectiv) și *slowly* (adverb) sunt diferite.'
    example_gloss: Te rog să vorbești încet.
  en.a1.unit62.lesson02.teach.this_is_leila:
    title: Hello, this is Leila.
    gloss: Alo, sunt Leila.
    note: La telefon, în engleză se spune *this is...* ca să spui cine sună. *My name is...* sună nefiresc la telefon.
  en.a1.unit62.lesson02.teach.speak_to_mia:
    title: Can I speak to Mia?
    gloss: Pot vorbi cu Mia?
    note: '*speak to* înseamnă a vorbi cu cineva. Românescul „cu” devine aici *to*.'
  en.a1.unit62.lesson02.teach.repeat_that:
    title: Please repeat that.
    gloss: Te rog să repeți asta.
    note: '*Please repeat that* cere politicos să se repete ceva.'
  en.a1.unit62.lesson02.teach.speak_slowly:
    title: Please speak slowly.
    gloss: Te rog să vorbești încet.
    note: '*slowly* stă aici după verbul *speak*.'
  en.a1.unit62.lesson02.teach.leave_message:
    title: Leave a message.
    gloss: Lasă un mesaj.
    note: '*leave a message* este expresia fixă pentru „a lăsa un mesaj”.'
  en.a1.unit62.lesson02.teach.call_back_later:
    title: I'll call back later.
    gloss: Te sun înapoi mai târziu.
    note: '*call back* înseamnă a suna înapoi. Particula *back* stă după verb.'
  en.a1.unit62.lesson03.teach.dialogue_line1:
    title: Mia răspunde la telefon
    gloss: 'Mia spune: Alo, sunt Mia.'
    note: '*this is Mia* sună firesc la telefon.'
  en.a1.unit62.lesson03.teach.dialogue_line2:
    title: Leila spune cine sună
    gloss: 'Leila spune: Bună, Mia, sunt Leila.'
    note: Folosește *this is* pentru a te prezenta la telefon.
  en.a1.unit62.lesson03.teach.dialogue_line3:
    title: Leila nu aude bine
    gloss: 'Leila spune: Nu te aud bine.'
    note: '*can''t hear you well* înseamnă „nu te aud bine”.'
  en.a1.unit62.lesson03.teach.dialogue_line4:
    title: Leila cere să vorbească mai încet
    gloss: 'Leila spune: Te rog să vorbești încet.'
    note: '*Please speak slowly* este o rugăminte politicoasă.'
  en.a1.unit62.lesson03.teach.dialogue_line5:
    title: Mia spune ora
    gloss: 'Mia spune: Sigur. Ședința este la ora patru.'
    note: '*at four* folosește *at* pentru o oră.'
  en.a1.unit62.lesson03.teach.dialogue_line6:
    title: Leila cere o repetare
    gloss: 'Leila spune: Te rog să repeți asta.'
    note: '*repeat that* se referă la ce tocmai s-a spus.'
  en.a1.unit62.lesson03.teach.dialogue_line7:
    title: Mia repetă ora patru
    gloss: 'Mia spune: Ora patru.'
    note: '*Four o''clock* este o oră fixă.'
  en.a1.unit62.lesson03.teach.dialogue_line8:
    title: Leila sună înapoi mai târziu
    gloss: 'Leila spune: Mulțumesc. Te sun înapoi mai târziu.'
    note: '*I''ll* este forma scurtă de la *I will*.'
  en.a1.unit62.lesson04.teach.phone_note:
    title: Mesaj telefonic
    gloss: 'Mesaj telefonic: Mia a sunat la 3:00. Ședință în Camera 5. Te rog să suni înapoi.'
    note: Mesajul spune cine a sunat, la ce oră, în ce cameră e ședința și ce trebuie făcut.
  en.a1.unit62.lesson04.teach.reading_passage:
    title: 'Text: Un scurt apel telefonic'
    gloss: 'Un scurt apel telefonic: Mia a sunat-o pe Leila după-amiază. Sunetul nu era clar, așa că Leila a rugat-o pe Mia să vorbească încet. Mia a spus că ședința este la ora patru în Camera 5. Leila a rugat-o pe Mia să repete ora. Mai târziu, Leila a scris un mesaj telefonic. În mesaj scria că Mia a sunat la 3:00 și a rugat-o să sune înapoi.'
    note: '*called* este forma de trecut a lui *call*.'
