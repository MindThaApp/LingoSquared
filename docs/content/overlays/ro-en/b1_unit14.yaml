teaching:
  en.b1.unit14.lesson01.teach.would_it_be_possible_to:
    title: would it be possible to
    gloss: ar fi posibil să
    note: '*would it be possible to* întreabă politicos dacă ceva este posibil în principiu.'
    example_gloss: Ar fi posibil să mutăm ședința pe joi?
  en.b1.unit14.lesson01.teach.i_was_wondering_if:
    title: I was wondering if
    gloss: mă gândeam dacă
    note: '*I was wondering if* face o rugăminte mai indirectă și mai prudentă.'
    example_gloss: Mă gândeam dacă ai putea să te uiți azi peste raportul meu.
  en.b1.unit14.lesson01.teach.could_we_possibly:
    title: could we possibly
    gloss: am putea cumva
    note: '*could we possibly* cere politicos ceva ce ați face împreună.'
    example_gloss: Am putea cumva să începem ședința cu cinci minute mai târziu?
  en.b1.unit14.lesson01.teach.i_would_appreciate_it_if:
    title: I would appreciate it if
    gloss: aș aprecia dacă
    note: '*I would appreciate it if* spune că ai fi recunoscător dacă cineva face ceva.'
    example_gloss: Aș aprecia dacă ai putea trimite în curând minuta ședinței.
  en.b1.unit14.lesson01.teach.agenda:
    title: agenda
    gloss: ordine de zi
    note: '*agenda* înseamnă o listă de subiecte care urmează să fie discutate într-o ședință.'
    example_gloss: Daniel a mai adăugat un punct pe ordinea de zi.
  en.b1.unit14.lesson01.teach.follow_up:
    title: follow up
    gloss: a reveni, a relua legătura
    note: '*follow up* înseamnă a contacta din nou pe cineva după o ședință sau o sarcină.'
    example_gloss: Mia va reveni cu un e-mail după ședință.
  en.b1.unit14.lesson02.teach.move_meeting_thursday:
    title: would it be possible to + Verb
    gloss: Ar fi posibil să mutăm ședința pe joi?
    note: '*would it be possible to* + forma de bază cere politicos o schimbare.'
  en.b1.unit14.lesson02.teach.review_report_today:
    title: I was wondering if + could
    gloss: Mă gândeam dacă ai putea să te uiți azi peste raportul meu.
    note: '*I was wondering if you could* este un mod indirect și politicos de a cere ceva.'
  en.b1.unit14.lesson02.teach.grammar_softened_requests:
    title: Abgeschwächte Bitten bei der Arbeit
    gloss: În rugămințile formale de la serviciu, folosește o formă de condițional atenuată, de exemplu Would it be possible to... sau I was wondering if..., în loc de un ordin direct. Aceste forme sună mai politicos decât Move the meeting sau Review my report.
    note: 'Formă: folosește o formă atenuată de condițional în loc de un ordin direct.'
  en.b1.unit14.lesson03.teach.budget_update:
    title: budget update
    gloss: actualizare de buget
    note: '*budget update* înseamnă un raport despre cum sunt cheltuiți banii.'
    example_gloss: Daniel a pregătit actualizarea de buget pentru ședință.
  en.b1.unit14.lesson03.teach.afterward:
    title: afterward
    gloss: după aceea, ulterior
    note: '*afterward* înseamnă mai târziu, după altceva.'
    example_gloss: Putem trece în revistă notițele după aceea.
  en.b1.unit14.lesson03.teach.reading_passage:
    title: 'Lesetext: eine Nachricht vor dem Meeting'
    gloss: Salut, Daniel, sper că ești bine. Ar fi posibil să adaugi actualizarea de buget pe ordinea de zi a ședinței de mâine? Aș aprecia dacă ai putea să aduci cu tine cele mai recente cifre. Am putea cumva să începem cu zece minute mai devreme, ca să avem după aceea timp pentru întrebări? Mulțumesc, Mia
    note: Un mesaj scurt și profesionist, cu rugăminți formulate politicos.
  en.b1.unit14.lesson04.teach.q_start_budget_update:
    title: Die Teamleitung eröffnet das Meeting höflich
    gloss: 'Șeful echipei spune: Bună dimineața, Mia. Ar fi posibil să începem azi cu actualizarea de buget?'
    note: '*would it be possible to* întreabă politicos despre ordinea din ședință.'
  en.b1.unit14.lesson04.teach.a_add_new_client:
    title: Mia macht eine zusätzliche Bitte
    gloss: 'Mia spune: Desigur. Mă gândeam dacă am putea adăuga pe ordinea de zi și noul client.'
    note: '*I was wondering if we could* este un mod indirect și politicos de a face o propunere.'
  en.b1.unit14.lesson04.teach.q_keep_thirty_minutes:
    title: Die Teamleitung bittet um ein kurzes Meeting
    gloss: 'Șeful echipei spune: Bună idee. Am putea cumva să ținem ședința sub treizeci de minute?'
    note: '*could we possibly* cere politicos ceva ce faceți amândoi împreună.'
  en.b1.unit14.lesson04.teach.a_questions_in_advance:
    title: Mia bittet um etwas für das nächste Mal
    gloss: 'Mia spune: Fac tot posibilul. Aș aprecia dacă toți ar trimite întrebările dinainte data viitoare.'
    note: '*I would appreciate it if* spune că ai fi recunoscător.'
  en.b1.unit14.lesson04.teach.q_fair_request_followup:
    title: Die Teamleitung stimmt zu und verspricht nachzufassen
    gloss: 'Șeful echipei spune: Este o cerere rezonabilă. Voi reveni cu un memento înainte de următoarea ședință.'
    note: '*follow up* înseamnă aici: a reveni mai târziu asupra subiectului.'
  en.b1.unit14.lesson04.teach.a_send_updated_agenda:
    title: Mia schließt mit einer Bestätigung
    gloss: 'Mia spune: Mulțumesc. Voi trimite azi după-amiază ordinea de zi actualizată.'
    note: O încheiere scurtă și politicoasă a conversației.
