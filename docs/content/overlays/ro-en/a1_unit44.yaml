    note: '*What''s your favorite season?* întreabă care este anotimpul preferat al cuiva.'
  en.a1.unit44.lesson02.teach.my_favorite_season_is:
    title: My favorite season is fall.
    gloss: Anotimpul meu preferat este toamna.
    note: '*My favorite season is ...* este modul obișnuit de a spune ce preferi.'
  en.a1.unit44.lesson03.teach.dialogue_line1:
    title: Întrebarea Miei
    gloss: 'Mia întreabă: Care este anotimpul tău preferat, Leila?'
    note: '*What''s your favorite ...?* întreabă despre preferința cuiva.'
  en.a1.unit44.lesson03.teach.dialogue_line2:
    title: "Răspunsul lui Leila"
    gloss: 'Leila spune: Toamna. Frunzele își schimbă culoarea și e vreme minunată să pictezi afară.'
    note: '*great weather for painting outside* înseamnă: vreme minunată să pictezi afară.'
  en.a1.unit44.lesson03.teach.dialogue_line3:
    title: Reacția Miei
    gloss: 'Mia spune: Sună frumos. Anotimpul meu preferat este primăvara.'
    note: '*My favorite season is spring* înseamnă: anotimpul meu preferat este primăvara.'
  en.a1.unit44.lesson03.teach.dialogue_line4:
    title: Întrebarea Leilei
    gloss: 'Leila întreabă: De ce primăvara?'
    note: '*Why spring?* este o formă scurtă de a întreba motivul.'
  en.a1.unit44.lesson03.teach.dialogue_line5:
    title: "Răspunsul lui Mia"
    gloss: 'Mia spune: Florile înfloresc și îmi place să le fotografiez pentru cursul meu de fotografie.'
    note: '*I love taking photos* înseamnă: îmi place să fac fotografii.'
  en.a1.unit44.lesson03.teach.dialogue_line6:
    title: Întrebarea Leilei
    gloss: 'Leila spune: Se înțelege! Primăvara este caldă sau rece unde locuiești tu?'
    note: '*That makes sense!* este o reacție firească la o explicație bună.'
  en.a1.unit44.lesson03.teach.dialogue_line7:
    title: "Răspunsul lui Mia"
    gloss: 'Mia spune: De obicei, caldă, cu puțină ploaie. Perfectă pentru plimbări în aer liber.'
    note: '*with a little rain* înseamnă: cu puțină ploaie.'
  en.a1.unit44.lesson04.teach.reading_passage:
    title: Text despre trei anotimpuri preferate
    gloss: Daniel, Leila și Mia au anotimpuri preferate diferite. Anotimpul preferat al lui Daniel este vara. Îi place să joace fotbal și să alerge când vremea este caldă și însorită. Anotimpul preferat al Leilei este toamna, pentru că îi place să picteze frunzele în timp ce își schimbă culoarea. Anotimpul preferat al Miei este primăvara. Ea fotografiază florile pentru cursul ei de fotografie. Chiar dacă fiecare iubește alt anotimp, își găsesc mereu timp să se bucure împreună de aerul liber.
    note: '*even though* înseamnă: chiar dacă, deși.'
