  en.a1.unit67.lesson04.teach.reading_passage:
    title: 'Text: Vești bune din familie'
    gloss: 'Vești bune din familie: Mia l-a întrebat pe Daniel despre familia lui. Daniel a spus că sunt bine. Apoi a împărtășit o veste bună: sora lui a născut un bebeluș. Mia a spus că vestea este minunată. Daniel a spus că el și familia lui vor veni în vizită în curând. Era mândru de sora lui. Mai târziu, Mia a trimis un mesaj scurt: Mă bucur pentru familia ta.'
    note: '*shared good news* înseamnă că a împărtășit o veste bună.'
