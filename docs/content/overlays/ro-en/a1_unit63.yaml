teaching:
  en.a1.unit63.lesson01.teach.help:
    title: help
    gloss: a ajuta / ajutor
    note: '*help* poate fi verbul „a ajuta” sau substantivul „ajutor”. Atenție: după *help* nu urmează un dativ ca în română, deci nu există *to*: *help me* (mă ajuți), nu *help to me*.'
    example_gloss: Mă poți ajuta?
  en.a1.unit63.lesson01.teach.carry:
    title: carry
    gloss: a căra
    note: '*carry* înseamnă a ține ceva și a-l duce dintr-un loc în altul.'
    example_gloss: Pot s-o car.
  en.a1.unit63.lesson01.teach.heavy:
    title: heavy
    gloss: greu
    note: '*heavy* înseamnă greu (ca greutate).'
    example_gloss: Este greu.
  en.a1.unit63.lesson01.teach.bag:
    title: bag
    gloss: geantă
    note: '*bag* înseamnă geantă, dar și pungă sau sac.'
    example_gloss: Această geantă este grea.
  en.a1.unit63.lesson01.teach.door:
    title: door
    gloss: ușă
    note: '*door* înseamnă ușă.'
    example_gloss: Deschide ușa.
  en.a1.unit63.lesson01.teach.shelf:
    title: shelf
    gloss: raft
    note: '*shelf* înseamnă raft sau etajeră, de exemplu pe perete sau într-un dulap. Pluralul este *shelves*.'
    example_gloss: Pune-o pe raft.
  en.a1.unit63.lesson02.teach.can_you_help:
    title: Can you help me?
    gloss: Mă poți ajuta?
    note: '*Can you...?* este un mod direct și obișnuit de a cere ajutor.'
  en.a1.unit63.lesson02.teach.bag_heavy:
    title: This bag is heavy.
    gloss: Această geantă este grea.
    note: Folosește *this bag* pentru geanta care se află lângă tine.
  en.a1.unit63.lesson02.teach.open_door:
    title: Could you open the door?
    gloss: Ai putea deschide ușa?
    note: '*Could you...?* sună mai politicos decât *Can you...?*. Corespunde condiționalului românesc „Ai putea ...?”.'
  en.a1.unit63.lesson02.teach.i_can_help:
    title: I can help.
    gloss: Pot să ajut.
    note: Această propoziție oferă ajutor.
  en.a1.unit63.lesson02.teach.thank_you_help:
    title: Thank you for your help.
    gloss: Mulțumesc pentru ajutor.
    note: '*Thank you for...* folosește *for* pentru motivul mulțumirii, ca în „mulțumesc pentru”.'
  en.a1.unit63.lesson02.teach.put_on_shelf:
    title: Put it on the shelf.
    gloss: Pune-o pe raft.
    note: '*put it on...* înseamnă a pune sau a așeza ceva pe ceva. Engleza nu face aici diferența dintre „a pune” și „a așeza”: ambele sunt *put*.'
  en.a1.unit63.lesson03.teach.dialogue_line1:
    title: Leila cere ajutor
    gloss: 'Leila spune: Bună, Daniel. Mă poți ajuta?'
    note: '*Can you help me?* este propoziția de bază pentru a cere ajutor.'
  en.a1.unit63.lesson03.teach.dialogue_line2:
    title: Daniel întreabă de ce are nevoie
    gloss: 'Daniel spune: Sigur. De ce ai nevoie?'
    note: '*Of course* înseamnă desigur.'
  en.a1.unit63.lesson03.teach.dialogue_line3:
    title: Geanta este grea
    gloss: 'Leila spune: Geanta aceasta este grea.'
    note: '*heavy* arată de ce este nevoie de ajutor.'
  en.a1.unit63.lesson03.teach.dialogue_line4:
    title: Daniel poate căra geanta
    gloss: 'Daniel spune: Pot s-o car.'
    note: '*carry it* se referă la geantă. Engleza folosește *it* pentru lucruri; în română, geanta este „ea”, dar în engleză nu se spune *she*.'
  en.a1.unit63.lesson03.teach.dialogue_line5:
    title: Leila cere să deschidă ușa
    gloss: 'Leila spune: Ai putea deschide și ușa?'
    note: '*Could you...?* face rugămintea politicoasă.'
  en.a1.unit63.lesson03.teach.dialogue_line6:
    title: Daniel întreabă despre raft
    gloss: 'Daniel spune: Da. Pot pune geanta pe raft?'
    note: Cu *Can I ...?* Daniel se oferă să pună geanta pe raft.
  en.a1.unit63.lesson03.teach.dialogue_line7:
    title: Leila îi mulțumește lui Daniel
    gloss: 'Leila spune: Da, te rog. Mulțumesc pentru ajutor.'
    note: '*Thank you for your help* este o formulă fixă de mulțumire.'
  en.a1.unit63.lesson03.teach.dialogue_line8:
    title: Daniel răspunde
    gloss: 'Daniel spune: Nicio problemă.'
    note: '*No problem* este un răspuns scurt și prietenos.'
  en.a1.unit63.lesson04.teach.help_note:
    title: Biletul de ajutor
    gloss: 'Biletul de ajutor: Geanta albastră este grea. Te rog s-o pui pe raftul de lângă ușă.'
    note: Biletul spune despre care geantă este vorba și unde trebuie pusă.
  en.a1.unit63.lesson04.teach.reading_passage:
    title: 'Text: Un vecin săritor'
    gloss: 'Un vecin săritor: Leila avea o geantă albastră grea. L-a văzut pe Daniel lângă ușă și i-a cerut ajutorul. Daniel a dus geanta înăuntru. Leila l-a rugat să deschidă și ușa. Apoi Daniel a pus geanta pe raftul de lângă ușă. Leila i-a mulțumit lui Daniel pentru ajutor. Daniel a spus: Nicio problemă. Mai târziu, Leila a scris un bilet scurt: Geanta albastră este pe raft.'
    note: '*carried* este forma de trecut a lui *carry*.'
