teaching:
  en.a1.unit39.lesson01.teach.neighborhood:
    title: neighborhood
    gloss: cartier
    note: '*neighborhood* înseamnă cartier: zona din jurul casei tale, cu străzile și clădirile din apropiere.'
    example_gloss: Îmi place cartierul meu.
  en.a1.unit39.lesson01.teach.neighbor:
    title: neighbor
    gloss: vecin / vecină
    note: '*neighbor* înseamnă vecin: o persoană care locuiește lângă tine sau aproape de tine.'
    example_gloss: Vecinul meu este foarte săritor.
  en.a1.unit39.lesson01.teach.nearby:
    title: nearby
    gloss: în apropiere / aproape
    note: '*nearby* înseamnă în apropiere.'
    example_gloss: Este un parc în apropiere.
  en.a1.unit39.lesson01.teach.quiet:
    title: quiet
    gloss: liniștit
    note: '*quiet* înseamnă liniștit, fără prea mult zgomot.'
    example_gloss: Strada mea este foarte liniștită noaptea.
  en.a1.unit39.lesson01.teach.noisy:
    title: noisy
    gloss: zgomotos
    note: '*noisy* înseamnă plin de zgomote puternice.'
    example_gloss: Strada de lângă a mea este zgomotoasă.
  en.a1.unit39.lesson01.teach.friendly:
    title: friendly
    gloss: prietenos
    note: '*friendly* înseamnă prietenos.'
    example_gloss: Vecinii mei sunt foarte prietenoși.
  en.a1.unit39.lesson02.teach.live_in_a_neighborhood:
    title: live in a neighborhood
    gloss: a locui într-un cartier
    note: '*live in a neighborhood* înseamnă a locui într-un cartier.'
    example_gloss: Locuiesc într-un cartier liniștit.
  en.a1.unit39.lesson02.teach.get_along_with_your_neighbors:
    title: get along with your neighbors
    gloss: a te înțelege bine cu vecinii
    note: '*get along with your neighbors* înseamnă a avea o relație bună și prietenoasă cu oamenii care locuiesc în apropierea ta.'
    example_gloss: Mă înțeleg bine cu vecinii mei.
  en.a1.unit39.lesson02.teach.close_to:
    title: close to
    gloss: aproape de
    note: '*close to* înseamnă aproape de (un loc).'
    example_gloss: Apartamentul meu este aproape de un supermarket.
  en.a1.unit39.lesson02.teach.a_five_minute_walk:
    title: a five-minute walk
    gloss: cinci minute de mers pe jos
    note: '*a five-minute walk* este un tipar englezesc fix: număr + substantiv, cu cratimă, iar substantivul *walk* rămâne la singular. În română spunem pur și simplu „cinci minute de mers pe jos”.'
    example_gloss: Parcul este la cinci minute de mers pe jos de casa mea.
  en.a1.unit39.lesson02.teach.say_hello_to:
    title: say hello to
    gloss: a spune bună ziua (cuiva)
    note: '*say hello to* înseamnă a saluta pe cineva.'
    example_gloss: Îmi salut întotdeauna vecinul dimineața.
  en.a1.unit39.lesson02.teach.whats_your_neighborhood_like_question:
    title: What's your neighborhood like?
    gloss: Cum este cartierul tău?
    note: '*What''s ... like?* cere o descriere, nu o preferință.'
  en.a1.unit39.lesson03.teach.dialogue_line1:
    title: Întrebarea Leilei
    gloss: 'Leila spune: Poate mă mut în curând. Cum este cartierul tău, Mia?'
    note: '*might* + verb exprimă o posibilitate: poate da, poate nu.'
  en.a1.unit39.lesson03.teach.dialogue_line2:
    title: "Răspunsul lui Mia"
    gloss: 'Mia spune: Chiar îmi place. Este liniștit și este un parc în apropiere.'
    note: '*there''s a park nearby* înseamnă că este un parc în apropiere.'
  en.a1.unit39.lesson03.teach.dialogue_line3:
    title: Întrebarea Leilei
    gloss: 'Leila spune: Sună bine. Este aproape de un supermarket?'
    note: '*That sounds nice* este o reacție firească la o veste bună.'
  en.a1.unit39.lesson03.teach.dialogue_line4:
    title: "Răspunsul lui Mia"
    gloss: 'Mia spune: Da, este unul la doar cinci minute de mers pe jos de blocul meu.'
    note: 'Aici, *just* înseamnă doar: subliniază cât de mică este distanța.'
  en.a1.unit39.lesson03.teach.dialogue_line5:
    title: Întrebarea Leilei
    gloss: 'Leila întreabă: Dar vecinii tăi? Sunt prietenoși?'
    note: '*What about ...?* este o modalitate firească de a introduce un subiect nou.'
  en.a1.unit39.lesson03.teach.dialogue_line6:
    title: "Răspunsul lui Mia"
    gloss: 'Mia spune: Foarte prietenoși! Vecinul meu, domnul Lopez, îmi udă plantele când sunt plecată.'
    note: '*waters my plants* înseamnă îmi udă plantele; în engleză, aici *water* este verb.'
  en.a1.unit39.lesson03.teach.dialogue_line7:
    title: Reacția Leilei
    gloss: 'Leila spune: Ce drăguț. Cred că mi-ar plăcea să locuiesc lângă tine!'
    note: '*I''d like to* + verb înseamnă: aș vrea să + verb.'
  en.a1.unit39.lesson04.teach.reading_passage:
    title: Text despre trei cartiere
    gloss: Daniel, Leila și Mia locuiesc toți trei în cartiere diferite. Cartierul lui Daniel este aglomerat, cu restaurante și magazine aproape de blocul lui. Își cunoaște mai mulți vecini și îi salută des pe hol. Leila locuiește într-un cartier liniștit, aproape de piscina unde înoată. Vecina ei de peste drum are un câine mare care latră mult. Cartierul Miei este și el liniștit, cu un supermarket la cinci minute de mers pe jos de blocul ei. Vecinul ei, domnul Lopez, este foarte prietenos și îi udă plantele când este plecată. După conversația cu Mia, Leila a hotărât că vrea să caute un apartament lângă Mia.
    note: '*decided she wants to look for* înseamnă: a hotărât că vrea să caute un apartament.'
