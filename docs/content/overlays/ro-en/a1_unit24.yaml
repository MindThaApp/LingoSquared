teaching:
  en.a1.unit24.lesson01.teach.bedroom:
    title: bedroom
    gloss: dormitor
    note: '*bedroom* înseamnă dormitor. Este format din *bed* (pat) și *room* (cameră), dar în engleză se pronunță și se accentuează ca două cuvinte separate.'
    example_gloss: Dormitorul meu este lângă baie.
  en.a1.unit24.lesson01.teach.kitchen:
    title: kitchen
    gloss: bucătărie
    note: '*kitchen* înseamnă bucătărie. Pronunția este *KITCH-en*; litera *t* nu se pronunță separat.'
    example_gloss: Bucătăria este lângă sufragerie.
  en.a1.unit24.lesson01.teach.bathroom:
    title: bathroom
    gloss: baie
    note: '*bathroom* înseamnă baie. În SUA este adesea și cuvântul pentru toaletă.'
    example_gloss: Baia are un duș.
  en.a1.unit24.lesson01.teach.living_room:
    title: living room
    gloss: sufragerie
    note: '*living room* înseamnă sufragerie sau living. Sunt două cuvinte separate.'
    example_gloss: Ne uităm la televizor în sufragerie.
  en.a1.unit24.lesson01.teach.garden:
    title: garden
    gloss: grădină
    note: '*garden* înseamnă grădină. În SUA, pentru grădina din spatele casei se spune adesea și *yard*.'
    example_gloss: Nu există grădină, dar există un balcon.
  en.a1.unit24.lesson01.teach.the_kitchen_is_a_room:
    title: This is the kitchen.
    gloss: Aceasta este bucătăria.
    note: 'Cu *This is ...* arăți spre ceva. *the* arată ceva anume: bucătăria acestui apartament.'
  en.a1.unit24.lesson02.teach.how_many_rooms:
    title: How many rooms are there?
    gloss: Câte camere sunt?
    note: Cu *How many...are there?* întrebi despre o cantitate. *many* se folosește cu lucruri numărabile la plural; *are* apare pentru că *rooms* este la plural.
  en.a1.unit24.lesson02.teach.there_is_a_kitchen:
    title: There's a small kitchen.
    gloss: Există o bucătărie mică.
    note: Cu *There's...* (*there is*) spui că există ceva într-un loc. Corespunde expresiei românești „există” sau „este”; pentru mai multe lucruri se spune *there are*.
  en.a1.unit24.lesson02.teach.next_to:
    title: next to
    gloss: lângă
    note: '*next to* înseamnă lângă. Sunt două cuvinte și rămân mereu împreună.'
    example_gloss: Scaunul este lângă masă.
  en.a1.unit24.lesson03.teach.apartment:
    title: apartment
    gloss: apartament
    note: '*apartment* înseamnă apartament (în engleza americană; în cea britanică se spune *flat*).'
    example_gloss: Apartamentul lui Daniel are două dormitoare.
  en.a1.unit24.lesson03.teach.home_text:
    title: Text despre un apartament
    gloss: Apartamentul meu are două dormitoare și o baie. Există o bucătărie mică lângă sufragerie.
    note: În acest text scurt, cineva își descrie apartamentul și spune câte camere are.
  en.a1.unit24.lesson04.teach.favorite_room:
    title: What's your favorite room?
    gloss: Care este camera ta preferată?
    note: '*favorite* înseamnă preferat.'
  en.a1.unit24.lesson04.teach.q_tell_me_about:
    title: Întrebare despre apartament
    gloss: 'Leila spune: Povestește-mi despre apartamentul tău.'
    note: Cu *Tell me about...* rogi pe cineva să descrie ceva.
  en.a1.unit24.lesson04.teach.a_two_bed_one_bath:
    title: Răspunsul lui Daniel
    gloss: 'Daniel spune: Are două dormitoare și o baie. Există o bucătărie mică lângă sufragerie.'
    note: Daniel spune câte camere are și unde este bucătăria.
  en.a1.unit24.lesson04.teach.q_is_there_garden:
    title: Întrebare despre grădină
    gloss: 'Leila întreabă: Există grădină?'
    note: Cu *Is there...?* întrebi dacă există ceva.
  en.a1.unit24.lesson04.teach.a_no_but_balcony:
    title: Răspunsul lui Daniel
    gloss: 'Daniel spune: Nu, nu există, dar există un balcon mic.'
    note: Daniel spune mai întâi nu și apoi menționează o alternativă.
  en.a1.unit24.lesson04.teach.a_living_room_near_kitchen:
    title: Ultimul răspuns al lui Daniel
    gloss: 'Daniel spune: Camera mea preferată este sufrageria. Este aproape de bucătărie, așa că este ușor să iei cina acolo.'
    note: Daniel spune care este camera lui preferată și dă motivul.
