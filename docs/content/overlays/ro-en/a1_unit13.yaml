  en.a1.unit13.lesson01.teach.worried:
    title: worried
    gloss: îngrijorat
    note: '*worried* înseamnă îngrijorat sau neliniștit din cauza a ceva ce s-ar putea întâmpla.'
    example_gloss: Este îngrijorat din cauza zilei de mâine.
  en.a1.unit13.lesson02.teach.how_are_you_feeling:
    title: How are you feeling today?
    gloss: Cum te simți astăzi?
    note: '*How are you feeling?* întreabă anume despre starea de moment, spre deosebire de *How are you?*, care este mai general.'
  en.a1.unit13.lesson02.teach.im_worried_because:
    title: I'm a little worried because I have a big test tomorrow.
    gloss: Sunt puțin îngrijorat, pentru că mâine am un examen important.
    note: '*because* înseamnă „pentru că” și introduce motivul sentimentului.'
  en.a1.unit13.lesson02.teach.im_happy_because:
    title: I'm happy because the class is almost over.
    gloss: Sunt fericit, pentru că cursul se termină aproape.
    note: '*almost over* înseamnă „aproape terminat”.'
  en.a1.unit13.lesson03.teach.message_text:
    title: Eine Nachricht über Gefühle
    gloss: Bună, sunt puțin îngrijorat, pentru că mâine am un examen important. Dar sunt și entuziasmat, pentru că este ultimul din acest an!
    note: Într-un mesaj poți exprima mai multe sentimente, chiar opuse, în propoziții scurte legate între ele.
  en.a1.unit13.lesson03.teach.writer_summary:
    title: The writer is worried and excited.
    gloss: Autorul mesajului este îngrijorat și entuziasmat.
    note: '*writer* înseamnă persoana care a scris mesajul.'
  en.a1.unit13.lesson04.teach.i_understand:
    title: Oh, I understand.
    gloss: Aha, înțeleg.
    note: '*I understand* înseamnă „înțeleg” și arată empatie când asculți.'
  en.a1.unit13.lesson04.teach.q_feeling:
    title: Frage von Leila
    gloss: 'Leila: Cum te simți astăzi?'
    note: Leila începe conversația întrebându-l pe Daniel cum se simte.
  en.a1.unit13.lesson04.teach.a_worried_test:
    title: Antwort von Daniel
    gloss: 'Daniel: Sunt puțin îngrijorat, pentru că mâine am un examen important.'
    note: Daniel spune ce simte și care este motivul.
  en.a1.unit13.lesson04.teach.acknowledge_and_ask:
    title: Reaktion von Leila
    gloss: 'Leila: Aha, înțeleg. Ești și entuziasmat?'
    note: Leila arată că înțelege și întreabă despre un alt sentiment.
  en.a1.unit13.lesson04.teach.a_yes_happy_class:
    title: Antwort von Daniel
    gloss: 'Daniel: Da, puțin. Sunt bucuros că cursul se termină aproape.'
    note: Daniel confirmă scurt și numește un al doilea sentiment, pozitiv.
