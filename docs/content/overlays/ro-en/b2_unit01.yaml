teaching:
  en.b2.unit01.lesson01.teach.claim:
    title: claim
    gloss: poziție susținută, afirmație
    note: '*claim* este poziția pe care o aperi. Aici nu înseamnă reclamație sau cerere de despăgubire.'
    example_gloss: Poziția ei este că planul trebuie să continue.
  en.b2.unit01.lesson01.teach.evidence:
    title: evidence
    gloss: dovezi, argumente factuale
    note: '*evidence* sunt fapte, cifre sau exemple cu care îți susții poziția.'
    example_gloss: Acest exemplu îi oferă Miei dovezi pentru poziția ei.
  en.b2.unit01.lesson01.teach.counterargument:
    title: counterargument
    gloss: contraargument
    note: '*counterargument* este un punct care merge împotriva poziției tale. În engleză se scrie ca un singur cuvânt.'
    example_gloss: Daniel aduce un contraargument.
  en.b2.unit01.lesson01.teach.rebut:
    title: rebut
    gloss: a combate, a respinge (un argument)
    note: '*rebut* înseamnă că răspunzi la un contraargument fără să renunți la propria poziție.'
    example_gloss: Mia combate îngrijorarea cu dovezi.
  en.b2.unit01.lesson01.teach.concede:
    title: concede
    gloss: a recunoaște, a admite (parțial)
    note: '*concede* înseamnă că recunoști că o parte din punctul celuilalt este rezonabilă. Nu înseamnă să renunți la toată poziția.'
    example_gloss: Poți recunoaște o îngrijorare fără să renunți la poziția ta principală.
  en.b2.unit01.lesson01.teach.outweigh:
    title: outweigh
    gloss: a cântări mai mult decât
    note: '*outweigh* folosești când un avantaj, un risc sau un motiv este mai important decât altceva.'
    example_gloss: Dovezile solide pot cântări mai mult decât o îngrijorare.
  en.b2.unit01.lesson02.teach.position_with_evidence:
    title: Recunoaște riscul și păstrează-ți poziția
    gloss: Sunt de acord că planul are riscuri, dar dovezile încă pledează pentru a merge mai departe.
    note: '*I agree..., but...* recunoaște mai întâi punctul celuilalt. Apoi *but the evidence still supports...* arată că poziția ta rămâne neschimbată.'
  en.b2.unit01.lesson02.teach.strongest_reason:
    title: Numește motivul tău cel mai puternic
    gloss: Cel mai puternic motiv este că rezultatele sondajului au fost consecvente.
    note: '*The strongest reason is that...* introduce argumentul tău principal. Atenție la ordinea din engleză după *that*: subiectul înaintea verbului.'
  en.b2.unit01.lesson02.teach.fair_concern:
    title: Recunoaște o îngrijorare rezonabilă
    gloss: Este o îngrijorare întemeiată; totuși, datele indică în sens opus.
    note: '*That is a fair concern; however,...* sună profesionist: recunoști îngrijorarea, dar o combați cu date.'
  en.b2.unit01.lesson02.teach.grammar_argument_shape:
    title: Apărarea unei poziții
    gloss: Formulează-ți poziția, oferă dovezi, recunoaște cel mai puternic contraargument și combate-l. Expresii precum That is a fair concern și However te fac să pari rezonabil fără să renunți la poziția ta.
    note: 'Păstrează ordinea engleză a cuvintelor în propoziție: *the data points in the other direction*, nu o ordine calchiată după româna.'
  en.b2.unit01.lesson03.teach.retention:
    title: retention
    gloss: păstrarea angajaților
    note: '*retention* înseamnă aici că angajații rămân în loc să plece.'
    example_gloss: O păstrare mai bună a angajaților înseamnă că mai puțini angajați părăsesc echipa.
  en.b2.unit01.lesson03.teach.collaboration:
    title: collaboration
    gloss: colaborare
    note: '*collaboration* înseamnă a lucra împreună la o sarcină sau la un proiect, fără încărcătura negativă, istorică, a cuvântului românesc colaboraționism.'
    example_gloss: O colaborare bună ajută echipa să termine munca.
  en.b2.unit01.lesson03.teach.reading_passage:
    title: 'Text de citit: apărarea unui program hibrid'
    gloss: 'Mia susține că firma ar trebui să păstreze programul hibrid și trimestrul viitor. Poziția ei principală este că munca hibridă îmbunătățește păstrarea angajaților fără să scadă performanța. Cea mai puternică dovadă este sondajul printre angajați: cei din echipele hibride au spus mai rar că își caută alt loc de muncă. Cel mai puternic contraargument este că colaborarea poate avea de suferit dacă oamenii nu sunt la birou în fiecare zi. Mia recunoaște această îngrijorare, dar o combate cu date din proiecte: echipele hibride au livrat la timp, iar scorurile lor de evaluare au fost ușor mai bune. Din acest motiv, ea concluzionează că avantajele cântăresc mai mult decât riscurile.'
    note: 'Textul construiește un argument complet: poziție, dovezi, contraargument, combatere și concluzie.'
  en.b2.unit01.lesson04.teach.q_keep_hybrid:
    title: Mia își formulează poziția
    gloss: 'Mia spune: Cred că ar trebui să păstrăm programul hibrid pentru trimestrul următor.'
    note: Mia începe cu o poziție clară, care poate fi apărată.
  en.b2.unit01.lesson04.teach.a_strongest_reason:
    title: Daniel întreabă despre motiv
    gloss: 'Daniel spune: Care este cel mai puternic motiv al tău?'
    note: Daniel nu cere o părere în general, ci argumentul cel mai important.
  en.b2.unit01.lesson04.teach.q_retention_survey:
    title: Mia oferă dovezi
    gloss: 'Mia spune: Cel mai puternic motiv este păstrarea angajaților. În sondajul printre angajați, cei care lucrau hibrid au spus mai rar că își caută alt loc de muncă.'
    note: Mia folosește rezultatele sondajului ca dovadă, nu doar o impresie.
  en.b2.unit01.lesson04.teach.a_collaboration_weaker:
    title: Daniel prezintă contraargumentul
    gloss: 'Daniel spune: Unii manageri spun că colaborarea este mai slabă atunci când oamenii nu sunt la birou în fiecare zi.'
    note: Acesta este contraargumentul la care Mia va trebui să răspundă imediat.
  en.b2.unit01.lesson04.teach.q_data_rebuttal:
    title: Mia combate cu date
    gloss: 'Mia spune: Este o îngrijorare întemeiată. Dar datele din proiecte nu o susțin. Echipele hibride și-au livrat munca la timp, iar scorurile lor de evaluare au fost ușor mai bune.'
    note: '*does not support it* folosește *does* pentru că negația în engleză cere verbul auxiliar *do*.'
  en.b2.unit01.lesson04.teach.a_benefits_outweigh:
    title: Daniel rezumă poziția
    gloss: 'Daniel spune: Deci poziția ta este că avantajele cântăresc mai mult decât riscurile?'
    note: '*outweigh* exprimă balanța dintre avantaje și riscuri.'
  en.b2.unit01.lesson04.teach.q_improve_routines:
    title: Mia încheie cu o soluție
    gloss: 'Mia spune: Exact. Ar trebui să îmbunătățim obiceiurile de ședință, nu să renunțăm la program.'
    note: Mia apără planul, dar propune și o îmbunătățire practică.
