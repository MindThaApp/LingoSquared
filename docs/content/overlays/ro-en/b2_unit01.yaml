course:
  title: Engleză B2
  description: Învață engleza la nivel B2 pentru conversații nuanțate, argumentare, ipoteze și discuții profesionale, cu explicații în română.
units:
  en.b2.unit01.argumentation:
    title: The evidence still supports it
lessons:
  en.b2.unit01.lesson01.argument_structure:
    title: Poziție, dovezi și combatere
  en.b2.unit01.lesson02.building_an_argument:
    title: I agree there are risks, but...
  en.b2.unit01.lesson03.reading_an_argument:
    title: 'Lectură: apărarea unui program hibrid'
  en.b2.unit01.lesson04.the_argument_dialogue:
