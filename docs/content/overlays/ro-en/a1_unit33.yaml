teaching:
  en.a1.unit33.lesson01.teach.bus:
    title: bus
    gloss: autobuz
    note: '*bus* înseamnă autobuz. Verbul care îl însoțește este *take*: *take the bus*. Atenție: în română spui la fel pentru orice mijloc de transport (merg cu autobuzul, cu trenul), dar în engleză fiecare mijloc de transport are propriul verb (*take*, *drive*, *ride*). Pe acestea le înveți separat.'
    example_gloss: Merg cu autobuzul.
  en.a1.unit33.lesson01.teach.train:
    title: train
    gloss: tren
    note: '*train* înseamnă tren. Ca la *bus*, folosești aici *take*: *take the train*.'
    example_gloss: Ea merge cu trenul.
  en.a1.unit33.lesson01.teach.car:
    title: car
    gloss: mașină
    note: '*car* înseamnă mașină. Pentru mașină nu folosești *take*, ci *drive*: *drive my car*. Este un alt verb decât la autobuz sau la tren.'
    example_gloss: Merg la serviciu cu mașina mea.
  en.a1.unit33.lesson01.teach.bike:
    title: bike
    gloss: bicicletă
    note: '*bike* înseamnă bicicletă. Aici folosești din nou alt verb: *ride a bike* (nu *take* și nu *drive*).'
    example_gloss: Merg cu bicicleta la serviciu în fiecare zi.
  en.a1.unit33.lesson01.teach.walk:
    title: walk
    gloss: a merge pe jos
    note: '*walk* înseamnă a merge pe jos. Aici nu ai nevoie de un verb în plus, ca *take*, *drive* sau *ride*, pentru că *walk* este chiar verbul: *walk to work*, nu *take a walk to work*.'
    example_gloss: Merg pe jos la serviciu.
  en.a1.unit33.lesson02.teach.how_get_to:
    title: How do you get to work?
    gloss: Cum ajungi la serviciu?
    note: Această întrebare începe cu auxiliarul *do*, pentru că verbul propriu-zis este *get*. În română nu ai nevoie de niciun auxiliar în întrebare („Cum ajungi la serviciu?”), dar în engleză îl pui obligatoriu.
  en.a1.unit33.lesson02.teach.usually:
    title: usually
    gloss: de obicei
    note: '*usually* înseamnă de obicei. În engleză, acest adverb stă de regulă între subiect și verbul principal: *I usually take the bus*.'
    example_gloss: De obicei merg cu autobuzul.
  en.a1.unit33.lesson02.teach.minutes:
    title: minutes
    gloss: minute
    note: '*minutes* înseamnă minute. În *It takes twenty minutes*, *it* este un subiect gol, fără sens propriu; el doar ocupă locul subiectului. În română subiectul lipsește pur și simplu („Durează douăzeci de minute”), dar în engleză nu poți omite *it*. Ține minte acest lucru la propozițiile despre durată.'
    example_gloss: Durează douăzeci de minute.
  en.a1.unit33.lesson02.teach.late:
    title: late
    gloss: târziu, cu întârziere
    note: '*late* înseamnă târziu, cu întârziere (a ajunge mai târziu decât era de așteptat): *The bus is often late.*'
    example_gloss: Autobuzul are des întârziere.
  en.a1.unit33.lesson02.teach.faster:
    title: faster
    gloss: mai rapid
    note: '*faster* înseamnă mai rapid: comparativul lui *fast*, cu *-er*. Pentru comparație folosești *than*: *faster than the bus*.'
    example_gloss: Trenul este mai rapid decât autobuzul.
  en.a1.unit33.lesson03.teach.dialogue_line1:
    title: Întrebarea Leilei
    gloss: 'Leila întreabă: Cum ajungi la serviciu, Daniel?'
    note: Începutul conversației, cu *How do you get to work?*
  en.a1.unit33.lesson03.teach.dialogue_line2:
    title: "Răspunsul lui Daniel"
    gloss: 'Daniel spune: De obicei merg cu autobuzul. Durează cam douăzeci de minute.'
    note: 'Două lucruri deodată: verbul *take* pentru autobuz și subiectul gol *it* în *It takes about twenty minutes*.'
  en.a1.unit33.lesson03.teach.dialogue_line3:
    title: Întrebarea Leilei
    gloss: 'Leila întreabă: Îți place?'
    note: Întrebare cu răspuns da/nu, formată cu *Do*.
  en.a1.unit33.lesson03.teach.dialogue_line4:
    title: "Răspunsul lui Daniel"
    gloss: 'Daniel spune: E în regulă, dar autobuzul are des întârziere. Dar tu?'
    note: '*How about you?* înseamnă „Dar tu?”: o modalitate scurtă de a întoarce întrebarea.'
  en.a1.unit33.lesson03.teach.dialogue_line5:
    title: "Răspunsul Leilei"
    gloss: 'Leila spune: Eu merg cu mașina. Este mai rapid, dar parcarea este dificilă.'
    note: Pentru mașină folosești verbul *drive*, nu *take*.
  en.a1.unit33.lesson04.teach.reading_passage:
    title: Text despre Leila și Daniel
    gloss: Leila merge cu mașina la serviciu în fiecare zi. Drumul durează cam cincisprezece minute, dar parcarea lângă biroul ei este dificilă. Daniel nu are mașină, așa că merge cu autobuzul. Drumul lui cu autobuzul durează douăzeci de minute și autobuzul are uneori întârziere, dar nu trebuie să-și facă griji pentru parcare.
    note: 'Atenție: *take* folosești pentru autobuz și tren, *drive* pentru mașină.'
