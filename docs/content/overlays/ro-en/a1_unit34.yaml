teaching:
  en.a1.unit34.lesson01.teach.soccer:
    title: soccer
    gloss: fotbal
    note: '*soccer* înseamnă fotbal. Verbul care îl însoțește este *play*: *play soccer*. În română poți spune „joc fotbal”, dar în engleză trebuie să reții pentru fiecare tip de sport verbul potrivit: *play*, *go* sau *do*.'
    example_gloss: Jucăm fotbal sâmbăta.
  en.a1.unit34.lesson01.teach.tennis:
    title: tennis
    gloss: tenis
    note: '*tennis* înseamnă tenis. Ca la *soccer*, folosești aici *play*: *play tennis*. În engleză spui întotdeauna *play tennis*.'
    example_gloss: Ea joacă tenis în fiecare weekend.
  en.a1.unit34.lesson01.teach.basketball:
    title: basketball
    gloss: baschet
    note: '*basketball* înseamnă baschet. Și aici folosești *play*: *play basketball*, ca la *soccer* și *tennis*. Pentru sporturile cu minge, engleza folosește mereu *play* + numele sportului.'
    example_gloss: Ei joacă baschet în parc.
  en.a1.unit34.lesson01.teach.swimming:
    title: swimming
    gloss: înot
    note: '*swimming* înseamnă înot. Aici verbul se schimbă: *go swimming* (nu *play swimming*). Engleza folosește *go* + forma în *-ing* pentru activități precum înotul sau alergatul. În română spui simplu „înot” sau „merg la înot”, dar în engleză trebuie să folosești construcția cu *go*.'
    example_gloss: Merg la înot de două ori pe săptămână.
  en.a1.unit34.lesson01.teach.yoga:
    title: yoga
    gloss: ioga
    note: '*yoga* înseamnă ioga. Verbul este *do*: *do yoga*. Engleza folosește *do* pentru activități individuale precum ioga, nu *play* și nu *go*. Și în română spui „fac ioga”, deci verbul corespunde. Ține minte totuși că engleza are trei verbe (*play*, *go*, *do*) pe care le înveți după tipul de sport.'
    example_gloss: El face ioga dimineața.
  en.a1.unit34.lesson01.teach.exercise:
    title: exercise
    gloss: a face mișcare, a face sport
    note: '*exercise* înseamnă a face mișcare sau sport: un cuvânt general pentru activitatea fizică. Spre deosebire de *soccer*, *swimming* și *yoga*, poți folosi *exercise* chiar ca verb, fără *play*, *go* sau *do*: *Do you exercise every day?*'
    example_gloss: Faci mișcare în fiecare zi?
  en.a1.unit34.lesson02.teach.twice_a_week:
    title: twice a week
    gloss: de două ori pe săptămână
    note: '*twice a week* înseamnă de două ori pe săptămână. Cuvântul *a* nu înseamnă aici „un/o”, ci „pe”: număr + *a* + unitate de timp arată cât de des se întâmplă ceva în perioada respectivă. În română spui la fel „de două ori pe săptămână”, deci *a* corespunde lui „pe”.'
    example_gloss: El joacă tenis de două ori pe săptămână.
  en.a1.unit34.lesson02.teach.three_times_a_week:
    title: three times a week
    gloss: de trei ori pe săptămână
    note: '*three times a week* înseamnă de trei ori pe săptămână. Ca la *twice a week*, *a* înseamnă aici „pe”, nu „un/o”: *times* (ori) plus *a week* (pe săptămână) arată cât de des pe săptămână.'
    example_gloss: Ea înoată de trei ori pe săptămână.
  en.a1.unit34.lesson02.teach.on_weekends:
    title: on weekends
    gloss: în weekend
    note: '*on weekends* înseamnă în weekend. Engleza folosește *on* pentru zile și weekenduri, în timp ce româna folosește „în” (în weekend).'
    example_gloss: Jucăm baschet în weekend.
  en.a1.unit34.lesson02.teach.gym:
    title: gym
    gloss: sală de sport
    note: gym înseamnă sală de sport, un loc cu aparate și cursuri pentru sport.
    example_gloss: El face ioga la sala de sport.
  en.a1.unit34.lesson02.teach.pool:
    title: pool
    gloss: piscină
    note: pool înseamnă piscină, un loc plin cu apă pentru înot.
    example_gloss: Înot la piscină.
  en.a1.unit34.lesson02.teach.how_often_question:
    title: How often do you exercise?
    gloss: Cât de des faci mișcare?
    note: 'Această întrebare începe cu *how often* (cât de des). Urmează auxiliarul *do*, pentru că verbul principal este *exercise*: este același *do* ca în alte întrebări din engleză.'
  en.a1.unit34.lesson03.teach.dialogue_line1:
    title: Întrebarea lui Daniel
    gloss: 'Daniel întreabă: Vrei să joci fotbal cu noi sâmbătă?'
    note: Începutul conversației, cu o invitație la fotbal. La *soccer* folosești *play*.
  en.a1.unit34.lesson03.teach.dialogue_line2:
    title: "Răspunsul lui Leila"
    gloss: 'Leila spune: Nu prea îmi place fotbalul. Prefer înotul.'
    note: '*don''t really like* înseamnă „nu prea îmi place”: o modalitate mai blândă de a spune nu.'
  en.a1.unit34.lesson03.teach.dialogue_line3:
    title: "Răspunsul lui Daniel"
    gloss: 'Daniel spune: Perfect! Cât de des mergi la înot?'
    note: '*go swimming*: pentru înot folosești *go*, nu *play* sau *do*.'
  en.a1.unit34.lesson03.teach.dialogue_line4:
    title: "Răspunsul lui Leila"
    gloss: 'Leila spune: De două ori pe săptămână, de obicei la piscina de lângă casa mea.'
    note: '*Twice a week*: și aici *a* înseamnă „pe”.'
  en.a1.unit34.lesson03.teach.dialogue_line5:
    title: "Răspunsul lui Daniel"
    gloss: 'Daniel spune: Frumos! Și eu fac uneori ioga, dar alergatul rămâne preferatul meu.'
    note: '*do yoga*: la ioga folosești *do*, separat de *play* și *go*.'
  en.a1.unit34.lesson04.teach.reading_passage:
    title: Text despre Daniel, Leila și Mia
    gloss: Daniel, Leila și Mia rămân activi, fiecare în felul lui. Daniel merge la alergat în fiecare dimineață, înainte de serviciu. Leila preferă înotul; merge la piscină de două ori pe săptămână. Mia este nouă în echipă, dar joacă deja tenis în fiecare duminică cu vecina ei. Sâmbăta joacă uneori fotbal împreună în parc, dar fotbalul nu este sportul preferat al nimănui.
    note: 'Textul folosește toate cele trei verbe: *goes running* (*go*), *plays tennis* și *play soccer* (*play*). Fiecare sport are propriul verb.'
