teaching:
  en.a2.unit35.lesson01.teach.pharmacy:
    title: pharmacy
    gloss: farmacie
    note: '*pharmacy* este magazinul de unde îți iei medicamentele.'
    example_gloss: Lângă cabinetul medicului este o farmacie.
  en.a2.unit35.lesson01.teach.pharmacist:
    title: pharmacist
    gloss: farmacist / farmacistă
    note: '*pharmacist* este persoana care îți dă medicamentele.'
    example_gloss: Farmacistul mi-a explicat cum să iau medicamentul.
  en.a2.unit35.lesson01.teach.tablet:
    title: tablet
    gloss: tabletă / pastilă
    note: '*tablet* este o bucată solidă de medicament pe care o înghiți.'
    example_gloss: Dimineața iau o tabletă și seara încă una.
  en.a2.unit35.lesson01.teach.dose:
    title: dose
    gloss: doză
    note: '*dose* este cantitatea de medicament pe care o iei deodată.'
    example_gloss: Doza este o tabletă, de două ori pe zi.
  en.a2.unit35.lesson01.teach.refill:
    title: refill
    gloss: reînnoire a rețetei / pachet nou
    note: '*refill* este un pachet nou din același medicament, fără să mai mergi la medic.'
    example_gloss: Am nevoie de un pachet nou, pentru că tabletele mele aproape s-au terminat.
  en.a2.unit35.lesson01.teach.side_effects:
    title: side effects
    gloss: efecte secundare
    note: '*side effects* sunt efectele suplimentare pe care le poate avea un medicament asupra corpului.'
    example_gloss: Farmacistul mi-a explicat efectele secundare ale acestui medicament.
  en.a2.unit35.lesson01.teach.grammar_frequency:
    title: Sagen, wie oft man etwas einnimmt
    gloss: o dată pe zi, de două ori pe zi, de trei ori pe zi, la fiecare opt ore
    note: '*once a day* = o dată pe zi, *twice a day* = de două ori pe zi, *three times a day* = de trei ori pe zi, *every eight hours* = la fiecare opt ore.'
  en.a2.unit35.lesson02.teach.pick_up_prescription:
    title: Sagen, weshalb man am Tresen steht
    gloss: Aș vrea să ridic o rețetă.
    note: '*I''d like to...* este formula politicoasă obișnuită pentru a spune ce vrei.'
  en.a2.unit35.lesson02.teach.take_one_tablet:
    title: Die Dosierung, die man zu hören bekommt
    gloss: Luați o tabletă de două ori pe zi, în timpul mesei.
    note: '*with food* înseamnă în timpul mesei, deci nu pe stomacul gol.'
  en.a2.unit35.lesson02.teach.ask_how_many_days:
    title: Fragen, wie lange man es einnehmen muss
    gloss: Câte zile trebuie să-l iau?
    note: '*How many...?* se folosește pentru lucruri numărabile, cum sunt zilele.'
  en.a2.unit35.lesson02.teach.ask_side_effects:
    title: Nach Nebenwirkungen fragen
    gloss: Are efecte secundare?
    note: '*Are there any...?* este modul obișnuit de a întreba dacă există ceva.'
  en.a2.unit35.lesson02.teach.grammar_should:
    title: should und shouldn't für Anweisungen
    gloss: Ar trebui să-l luați în timpul mesei. Nu ar trebui să opriți tratamentul prea devreme.
    note: '*should* dă un sfat sau o indicație; *shouldn''t* este forma negativă.'
  en.a2.unit35.lesson03.teach.before_bed:
    title: before bed
    gloss: înainte de culcare
    note: '*before bed* înseamnă înainte să te culci.'
    example_gloss: Unele medicamente acționează mai bine dacă le iei înainte de culcare.
  en.a2.unit35.lesson03.teach.label_text:
    title: Das Apothekenetikett
    gloss: 'Medicament pentru răceală. Luați o tabletă de două ori pe zi, în timpul mesei, timp de cinci zile. Nu opriți tabletele prea devreme. Posibile efecte secundare: vă puteți simți obosit. Reînnoiri: una.'
    note: 'O etichetă de farmacie este scurtă și la obiect: propoziții scurte, fără formule de politețe.'
  en.a2.unit35.lesson03.teach.do_not_stop_early:
    title: Der Warnhinweis auf dem Etikett
    gloss: Nu opriți tabletele prea devreme.
    note: '*Do not...* este interdicția la imperativ, așa cum o vezi pe etichete și pe panouri.'
  en.a2.unit35.lesson04.teach.q_pick_up:
    title: Daniel meldet sich am Tresen
    gloss: 'Daniel spune: Bună, aș vrea să ridic o rețetă.'
    note: '*Hi* este mai relaxat decât *Hello*, dar la ghișeu se folosește fără probleme.'
  en.a2.unit35.lesson04.teach.a_what_is_your_name:
    title: Der Apotheker fragt nach dem Namen
    gloss: 'Farmacistul spune: Desigur. Cum vă numiți?'
    note: '*Of course* înseamnă aici: desigur, nicio problemă.'
  en.a2.unit35.lesson04.teach.q_doctor_gave_me_medicine:
    title: Daniel nennt den Grund für das Medikament
    gloss: 'Daniel spune: Daniel. Medicul mi-a dat un medicament pentru o răceală zdravănă.'
    note: 'Se leagă de vizita la medic din unitatea 28: aceeași răceală.'
  en.a2.unit35.lesson04.teach.a_here_it_is:
    title: Der Apotheker nennt die Dosierung
    gloss: 'Farmacistul spune: Poftiți. Luați o tabletă de două ori pe zi, în timpul mesei.'
    note: '*Here it is* se spune când îi întinzi cuiva ceva.'
  en.a2.unit35.lesson04.teach.q_how_many_days:
    title: Daniel fragt, wie lange
    gloss: 'Daniel întreabă: Câte zile trebuie să-l iau?'
    note: Aceeași întrebare ca în lecția 2.
  en.a2.unit35.lesson04.teach.a_five_days_no_stopping:
    title: Die Antwort des Apothekers
    gloss: 'Farmacistul spune: Cinci zile. Nu opriți tabletele prea devreme.'
    note: Aceeași indicație ca pe eticheta din lecția 3.
  en.a2.unit35.lesson04.teach.q_any_side_effects:
    title: Daniel fragt nach Nebenwirkungen
    gloss: 'Daniel întreabă: Are efecte secundare?'
    note: Aceeași întrebare ca în lecția 2.
  en.a2.unit35.lesson04.teach.a_you_may_feel_tired:
    title: Der Apotheker nennt die Nebenwirkung
    gloss: 'Farmacistul spune: S-ar putea să vă simțiți obosit, dar atât.'
    note: '*but that''s all* înseamnă aici: dar nimic mai mult.'
  en.a2.unit35.lesson04.teach.q_thank_you:
    title: Daniel bedankt sich beim Apotheker
    gloss: 'Daniel spune: Vă mulțumesc mult.'
    note: '*very much* face mulțumirea mai apăsată.'
