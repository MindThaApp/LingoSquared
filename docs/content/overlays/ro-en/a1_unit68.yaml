  en.a1.unit68.lesson03.teach.dialogue_line1:
    title: Leila cere umbrela
    gloss: 'Leila spune: Bună, Mia. Pot să-ți iau umbrela cu împrumut?'
    note: '*Can I borrow your umbrella?* este cererea.'
  en.a1.unit68.lesson03.teach.dialogue_line2:
    title: Mia împrumută umbrela
    gloss: 'Mia spune: Da, ți-o pot da cu împrumut.'
    note: '*lend it to you* arată că Mia o dă cu împrumut.'
  en.a1.unit68.lesson03.teach.dialogue_line3:
    title: Leila îi mulțumește Miei
    gloss: 'Leila spune: Mulțumesc. Plouă astăzi.'
    note: '*It is raining today* explică de ce are nevoie de umbrelă.'
  en.a1.unit68.lesson03.teach.dialogue_line4:
    title: Mia cere să i-o dea înapoi
    gloss: 'Mia spune: Te rog să o dai înapoi mâine.'
    note: '*tomorrow* spune când trebuie dată umbrela înapoi.'
  en.a1.unit68.lesson03.teach.dialogue_line5:
    title: Leila întreabă de încărcător
    gloss: 'Leila spune: Sigur. Ai nevoie de un încărcător?'
    note: '*Of course* înseamnă desigur.'
  en.a1.unit68.lesson03.teach.dialogue_line6:
    title: Mia vrea un încărcător cu împrumut
    gloss: 'Mia spune: Da, poți să-mi dai cu împrumut un încărcător?'
    note: '*Can you lend me...?* cere să primești ceva cu împrumut.'
  en.a1.unit68.lesson03.teach.dialogue_line7:
    title: Leila îi dă unul cu împrumut
    gloss: 'Leila spune: Sigur. Îți pot da unul cu împrumut.'
    note: '*one* se referă la un încărcător.'
  en.a1.unit68.lesson04.teach.borrowing_note:
    title: Notă despre împrumut
    gloss: 'Notă despre împrumut: Leila are astăzi umbrela Miei. O dă înapoi mâine. Mia are încărcătorul Leilei.'
    note: Nota spune cine are fiecare obiect și când trebuie dată umbrela înapoi.
  en.a1.unit68.lesson04.teach.reading_passage:
    title: 'Text: Prieteni care împart'
    gloss: 'Prieteni care împart: Ploua, așa că Leila i-a cerut Miei o umbrelă. Mia a spus că i-o poate da cu împrumut Leilei. Mia a rugat-o pe Leila să o dea înapoi mâine. Apoi Mia a avut nevoie de un încărcător. Leila i-a dat Miei cu împrumut un încărcător. Cele două prietene au scris o notă scurtă, ca să-și amintească ce trebuie să dea înapoi.'
    note: '*lent* este forma de trecut a verbului *lend*.'
  en.a1.unit68.lesson04.teach.borrowed_umbrella:
    title: I borrowed your umbrella.
    gloss: Ți-am luat umbrela cu împrumut.
    note: '*borrowed* este forma de trecut a verbului *borrow*.'
  en.a1.unit68.lesson04.teach.will_return_tomorrow:
    title: I will return it tomorrow.
    gloss: O dau înapoi mâine.
    note: '*will* + verb descrie ceva ce vei face în viitor.'
