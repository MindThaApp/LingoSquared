course:
  title: Engleză B1
  description: Învață engleza la nivel B1, pentru obligații, posibilități, situații ipotetice și povestiri de zi cu zi, cu explicații detaliate în română.
units:
  en.b1.unit15.complaints:
    title: I'm writing to complain about...
lessons:
  en.b1.unit15.lesson01.complaints_vocabulary:
    title: Cuvinte pentru o reclamație
  en.b1.unit15.lesson02.complaint_sentences:
    title: I'm writing to complain about a damaged product
  en.b1.unit15.lesson03.reading_a_complaint_email:
    title: 'Citire: o reclamație despre un scaun de birou'
  en.b1.unit15.lesson04.the_complaint_call_dialogue:
    title: Would you like a refund or a replacement?
teaching:
  en.b1.unit15.lesson01.teach.complain:
    title: complain
    gloss: a reclama, a se plânge
    note: '*complain* înseamnă a spune oficial că ceva nu este în regulă sau nu este satisfăcător.'
    example_gloss: Mia a hotărât să reclame scaunul deteriorat.
  en.b1.unit15.lesson01.teach.damaged:
    title: damaged
    gloss: deteriorat
    note: '*damaged* descrie un produs stricat sau avariat.'
    example_gloss: Scaunul a ajuns deteriorat.
  en.b1.unit15.lesson01.teach.refund:
    title: refund
    gloss: rambursare
    note: '*refund* înseamnă banii returnați pentru un produs înapoiat sau defect.'
    example_gloss: Mia a cerut rambursarea banilor.
  en.b1.unit15.lesson01.teach.replacement:
    title: replacement
    gloss: înlocuire, produs de schimb
    note: '*replacement* înseamnă un articol nou în locul unui articol defect.'
    example_gloss: Firma a oferit în schimb un produs de înlocuire.
  en.b1.unit15.lesson01.teach.resolve:
    title: resolve
    gloss: a rezolva
    note: '*resolve* înseamnă a rezolva complet o problemă.'
    example_gloss: Angajatul a promis că va rezolva rapid problema.
  en.b1.unit15.lesson01.teach.issue:
    title: issue
    gloss: problemă, situație de rezolvat
    note: '*issue* înseamnă o problemă de care trebuie să te ocupi.'
    example_gloss: Mia a explicat clar problema.
  en.b1.unit15.lesson02.teach.writing_to_complain:
    title: I'm writing to complain about + substantiv
    gloss: Vă scriu pentru a reclama un produs deteriorat.
    note: '*I''m writing to complain about* deschide politicos o reclamație scrisă.'
  en.b1.unit15.lesson02.teach.would_like_refund:
    title: I would like + substantiv
    gloss: Aș dori rambursarea banilor pentru acest articol.
    note: '*I would like a refund for* cere politicos returnarea banilor.'
  en.b1.unit15.lesson02.teach.grammar_complaint_structure:
    title: Structura unei reclamații politicoase
    gloss: 'O reclamație scrisă politicoasă are de obicei trei părți: numești problema (I''m writing to complain about...), spui ce s-a întâmplat deja (it arrived damaged / it stopped working) și ceri o rezolvare concretă (I would like a refund / I would like a replacement).'
    note: 'Formă: numești problema, spui ce s-a întâmplat, ceri o rezolvare concretă.'
  en.b1.unit15.lesson03.teach.desk_chair:
    title: desk chair
    gloss: scaun de birou
    note: '*desk chair* înseamnă un scaun pe care stai la birou.'
    example_gloss: Mia a comandat un scaun de birou nou pentru biroul ei de acasă.
  en.b1.unit15.lesson03.teach.as_soon_as_possible:
    title: as soon as possible
    gloss: cât mai repede posibil
    note: '*as soon as possible* înseamnă fără întârzieri inutile.'
    example_gloss: Mia a cerut un produs de înlocuire cât mai repede posibil.
  en.b1.unit15.lesson03.teach.reading_passage:
    title: 'Text de citit: o reclamație despre un scaun de birou'
    gloss: Stimată echipă GreenDesk, vă scriu pentru a reclama un produs deteriorat. Săptămâna trecută am comandat un scaun de birou pentru biroul meu de acasă, dar a ajuns cu o roată ruptă. Aș dori un produs de înlocuire cât mai repede posibil. Vă rog să-mi spuneți cum trebuie să procedez. Vă mulțumesc, Mia
    note: O scrisoare de reclamație scurtă și politicoasă.
  en.b1.unit15.lesson04.teach.q_calling_to_complain:
    title: Mia sună ca să se plângă de scaunul de birou
    gloss: 'Mia spune: Bună ziua, vă sun pentru a reclama un scaun de birou pe care l-am comandat.'
    note: '*I''m calling to complain about* deschide politicos o reclamație telefonică.'
  en.b1.unit15.lesson04.teach.a_whats_the_issue:
    title: Angajatul întreabă care e problema
    gloss: 'Angajatul spune: Îmi pare rău să aud asta. Care este problema?'
    note: '*I''m sorry to hear that* este o reacție politicoasă și empatică.'
  en.b1.unit15.lesson04.teach.q_broken_wheel_cant_use:
    title: Mia descrie problema
    gloss: 'Mia spune: A ajuns cu o roată ruptă, așa că nu pot să-l folosesc.'
    note: '*it arrived with a broken wheel* explică ce s-a întâmplat deja.'
  en.b1.unit15.lesson04.teach.a_refund_or_replacement:
    title: Angajatul propune o soluție
    gloss: 'Angajatul spune: Înțeleg. Ați dori rambursarea banilor sau un produs de înlocuire?'
    note: '*would you like... or...* îi oferă clientului o alegere.'
  en.b1.unit15.lesson04.teach.q_prefer_replacement:
    title: Mia alege o înlocuire
    gloss: 'Mia spune: Aș prefera un produs de înlocuire, dacă este posibil.'
    note: '*I would prefer a replacement, if that''s possible* exprimă politicos o preferință.'
  en.b1.unit15.lesson04.teach.a_resolve_send_friday:
    title: Angajatul confirmă soluția
    gloss: 'Angajatul spune: Bineînțeles. Vom rezolva situația și vă vom trimite un scaun nou până vineri.'
    note: '*we''ll resolve this and send... by Friday* este o promisiune concretă, cu dată.'
