    note: '*corner* înseamnă colț, locul în care se întâlnesc două străzi.'
    example_gloss: Virați la stânga la colț.
  en.a1.unit10.lesson02.teach.how_do_i_get_to:
    title: How do I get to the bank?
    gloss: Cum ajung la bancă?
    note: '*How do I get to...?* întreabă cum ajungi la un anumit loc.'
  en.a1.unit10.lesson02.teach.go_straight_then_left:
    title: Go straight, then turn left at the corner.
    gloss: Mergeți drept înainte, apoi virați la stânga la colț.
    note: '*then* leagă două indicații care se succed.'
  en.a1.unit10.lesson02.teach.is_it_far:
    title: Is it far?
    gloss: Este departe?
    note: O întrebare scurtă despre distanță.
  en.a1.unit10.lesson02.teach.two_minutes:
    title: It's just two minutes from here.
    gloss: Sunt doar două minute de aici.
    note: '*just* subliniază aici că este foarte aproape.'
  en.a1.unit10.lesson02.teach.cant_miss_it:
    title: You can't miss it.
    gloss: Nu aveți cum să-l ratați.
    note: '*You can''t miss it* este o expresie fixă care asigură că un loc se găsește ușor.'
  en.a1.unit10.lesson03.teach.first_street:
    title: Take the first street on the left.
    gloss: Luați prima stradă la stânga.
    note: '*Take the first street* înseamnă „luați prima stradă”, adică virați pe prima stradă.'
  en.a1.unit10.lesson03.teach.second_street:
    title: Take the second street on the right.
    gloss: Luați a doua stradă la dreapta.
    note: '*second* înseamnă „al doilea” sau „a doua”.'
  en.a1.unit10.lesson03.teach.route_text:
    title: Indicații spre farmacie
    gloss: 'Descrierea drumului până la farmacie: Mergeți drept înainte. Luați prima stradă la stânga. Farmacia este în partea dreaptă.'
    note: Descrierile scrise ale drumului înșiră propoziții scurte, la imperativ, câte un pas pe rând.
  en.a1.unit10.lesson04.teach.q_bank:
    title: Întrebarea lui Daniel
    gloss: 'Daniel: Scuzați-mă, cum ajung la bancă?'
    note: Daniel i se adresează politicos Leilei cu *Excuse me*.
  en.a1.unit10.lesson04.teach.a_route:
    title: Răspunsul lui Leila
    gloss: 'Leila: Mergeți drept înainte, apoi virați la stânga la colț.'
    note: Leila dă o indicație în doi pași.
  en.a1.unit10.lesson04.teach.confirm_route:
    title: Întrebarea suplimentară a lui Daniel
    gloss: 'Daniel: La colț la stânga, bine. Este departe?'
    note: Daniel repetă indicația ca să fie sigur că a înțeles-o corect.
  en.a1.unit10.lesson04.teach.a_close_cant_miss:
    title: Răspunsul lui Leila
    gloss: 'Leila: Nu, sunt doar două minute de aici. Nu aveți cum să-l ratați.'
    note: 'Leila îl liniștește pe Daniel: drumul este scurt și locul se găsește ușor.'
