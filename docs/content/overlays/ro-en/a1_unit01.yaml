course:
  title: Engleză A1
  description: Învață engleza la nivel A1, pentru salutări și conversații scurte de zi cu zi, cu explicații detaliate în română.
units:
  en.a1.unit01.greetings:
    title: Salutări și conversații scurte
lessons:
  en.a1.unit01.lesson01.everyday_greetings:
    title: Salutări de zi cu zi
  en.a1.unit01.lesson03.wellbeing:
    title: Cum întrebi și cum spui ce mai faci
  en.a1.unit01.lesson05.noun_phrases_and_closings:
    title: Despărțiri prietenoase
teaching:
  en.a1.unit01.lesson01.teach.hello:
    title: Hello
    gloss: Bună
    note: '*Hello* este salutul neutru, universal – se potrivește în aproape orice situație.'
    example_gloss: Bună, Daniel!
  en.a1.unit01.lesson01.teach.hi:
    title: Hi
    gloss: Salut
    note: '*Hi* este mai relaxat decât *Hello*, asemănător cu „Salut” între prieteni.'
    example_gloss: Salut, Leila!
  en.a1.unit01.lesson01.teach.good_morning:
    title: Good morning
    gloss: Bună dimineața
    note: '*Good morning* se folosește dimineața, la fel ca „Bună dimineața” în română.'
  en.a1.unit01.lesson01.teach.good_afternoon:
    title: Good afternoon
    gloss: Bună ziua / Bună după-amiaza
    note: '*Good afternoon* se folosește după-amiaza – în engleză nu există un echivalent direct pentru „Bună ziua”, care se potrivește toată ziua.'
  en.a1.unit01.lesson01.teach.good_evening:
    title: Good evening
    gloss: Bună seara
    note: '*Good evening* se folosește seara, la fel ca „Bună seara”.'
  en.a1.unit01.lesson01.teach.goodbye:
    title: Goodbye
    gloss: La revedere
    note: '*Goodbye* este formula neutră, universală de rămas-bun.'
    example_gloss: La revedere, ne vedem mâine!
  en.a1.unit01.lesson01.teach.bye:
    title: Bye
    gloss: Pa
    note: '*Bye* este mai relaxat decât *Goodbye*, asemănător cu „Pa” între prieteni.'
    example_gloss: Pa, pe curând!
  en.a1.unit01.lesson03.teach.how_are_you:
    title: How are you?
    gloss: Ce mai faci? / Ce mai faceți?
    note: '*How are you?* se potrivește în engleză și în situații formale, și în cele informale – în română alegi între „Ce mai faci?” și „Ce mai faceți?”, dar în engleză *you* rămâne mereu la fel.'
  en.a1.unit01.lesson03.teach.im_fine:
    title: I'm fine, thanks.
    gloss: Sunt bine, mulțumesc.
    note: Un răspuns simplu, neutru.
  en.a1.unit01.lesson03.teach.im_good:
    title: I'm good, thanks.
    gloss: Mă simt bine, mulțumesc.
    note: Înseamnă același lucru ca *I'm fine, thanks* – ambele sunt la fel de frecvente în viața de zi cu zi.
  en.a1.unit01.lesson03.teach.not_bad:
    title: Not bad, thanks.
    gloss: Nu rău, mulțumesc.
    note: Un răspuns relaxat, ușor rezervat – nici deosebit de bine, nici rău.
  en.a1.unit01.lesson03.teach.and_you:
    title: And you?
    gloss: Dar tu? / Dar dumneavoastră?
    note: Întorci întrebarea – merge în orice registru, fără deosebire între formal și informal.
  en.a1.unit01.lesson03.teach.are_you_okay:
    title: Are you okay?
    gloss: E totul în regulă?
    note: '*Are you okay?* întreabă mai degrabă dacă îi lipsește ceva cuiva în acel moment, nu este o întrebare generală de salut ca *How are you?*'
  en.a1.unit01.lesson05.teach.nice_to_meet_you:
    title: Nice to meet you.
    gloss: Încântat să te cunosc. / Încântat să vă cunosc.
    note: Se spune când cunoști pe cineva pentru prima dată.
  en.a1.unit01.lesson05.teach.nice_to_meet_you_too:
    title: Nice to meet you too.
    gloss: Și mie îmi pare bine.
    note: Răspunsul potrivit la *Nice to meet you*.
  en.a1.unit01.lesson05.teach.see_you_later:
    title: See you later.
    gloss: Pe mai târziu.
    note: Se folosește când o să revezi persoana în aceeași zi, la fel ca „Pe mai târziu” în română.
  en.a1.unit01.lesson05.teach.have_a_good_day:
    title: Have a good day.
    gloss: O zi bună!
    note: O urare prietenoasă de rămas-bun, care îi dorește cuiva o zi bună în continuare.
