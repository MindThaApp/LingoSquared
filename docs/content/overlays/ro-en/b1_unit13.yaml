teaching:
  en.b1.unit13.lesson01.teach.who:
    title: who
    gloss: care (despre persoane)
    note: '*who* se referă la o persoană într-o propoziție relativă.'
    example_gloss: Daniel, care s-a alăturat echipei în martie, conduce deja două proiecte.
  en.b1.unit13.lesson01.teach.which:
    title: which
    gloss: care (despre lucruri)
    note: '*which* se referă la un lucru într-o propoziție relativă.'
    example_gloss: Cursul de design pe care l-a ales Leila începe în iunie.
  en.b1.unit13.lesson01.teach.that_relative:
    title: that
    gloss: care (determinativ)
    note: '*that* se referă la o persoană sau la un lucru într-o propoziție relativă determinativă.'
    example_gloss: Clientul care a sunat azi-dimineață vrea o întâlnire.
  en.b1.unit13.lesson01.teach.whose:
    title: whose
    gloss: al cărui, a cărei
    note: '*whose* arată posesia într-o propoziție relativă.'
    example_gloss: Clientul al cărui proiect îl finalizează acum a aprobat deja designul.
  en.b1.unit13.lesson01.teach.where:
    title: where
    gloss: unde
    note: '*where* se referă la un loc într-o propoziție relativă.'
    example_gloss: Biroul în care lucrează Daniel este în centru.
  en.b1.unit13.lesson01.teach.coworker:
    title: coworker
    gloss: coleg, colegă
    note: '*coworker* înseamnă o persoană cu care lucrezi.'
    example_gloss: Mia are o colegă care învață spaniolă seara.
  en.b1.unit13.lesson02.teach.colleague_organized:
    title: who în propoziția relativă determinativă
    gloss: Colega care stă lângă Mia este foarte organizată.
    note: '*who* introduce aici o informație necesară ca să știi despre cine e vorba.'
  en.b1.unit13.lesson02.teach.daniel_leads_projects:
    title: who în propoziția relativă nedeterminativă
    gloss: Daniel, care s-a alăturat echipei în martie, conduce deja două proiecte.
    note: Virgulele arată că propoziția relativă adaugă o informație în plus, nu una necesară pentru identificare.
  en.b1.unit13.lesson02.teach.grammar_defining:
    title: Propoziții relative determinative și nedeterminative
    gloss: 'Folosește o propoziție relativă determinativă, fără virgule, ca să spui exact la ce persoană sau lucru te referi: The colleague who sits next to Mia is organized. Folosește una explicativă, cu virgule, ca să adaugi informații în plus despre cineva deja cunoscut: Daniel, who joined in March, already leads two projects. Ca în română, virgulele apar doar la propoziția explicativă; cea determinativă nu se desparte prin virgule.'
    note: 'Formă: determinativă = fără virgule, spune despre cine/ce este vorba; explicativă = cu virgule, adaugă o informație în plus.'
  en.b1.unit13.lesson03.teach.deadline:
    title: deadline
    gloss: termen limită
    note: '*deadline* înseamnă data sau ora până la care trebuie terminat ceva.'
    example_gloss: Colega care stă lângă Mia își respectă mereu termenele limită.
  en.b1.unit13.lesson03.teach.approve:
    title: approve
    gloss: a aproba
    note: '*approve* înseamnă a accepta ceva în mod oficial.'
    example_gloss: Clientul a aprobat deja primul design.
  en.b1.unit13.lesson03.teach.reading_passage:
    title: 'Text de citit: noul birou'
    gloss: Mia lucrează cu mai mulți oameni care îi ușurează munca. Daniel, care s-a alăturat echipei în martie, conduce deja două proiecte. Colega care stă lângă Mia este foarte organizată și își respectă mereu termenele limită. Biroul lor, care este la etajul cinci, are o bucătărie mică unde toți iau prânzul împreună. Clientul al cărui proiect îl finalizează acum a aprobat deja primul design.
    note: Un text scurt cu propoziții relative determinative și explicative.
  en.b1.unit13.lesson04.teach.q_met_the_woman:
    title: Mia o prezintă pe noua colegă
    gloss: 'Mia spune: Leila, ai cunoscut-o pe femeia care tocmai s-a alăturat echipei noastre?'
    note: '*who* se referă aici la *the woman*.'
  en.b1.unit13.lesson04.teach.a_whose_desk:
    title: Leila întreabă unde stă noua colegă
    gloss: 'Leila spune: Încă nu. Este persoana al cărei birou e lângă fereastră?'
    note: '*whose* arată posesia: *whose desk*.'
  en.b1.unit13.lesson04.teach.q_the_designer_who:
    title: Mia o descrie pe noua colegă
    gloss: 'Mia spune: Da, ea e. Este designerița care a terminat proiectul cu logoul.'
    note: '*who* se referă la *the designer*.'
  en.b1.unit13.lesson04.teach.a_which_won_award:
    title: Leila își amintește de proiect
    gloss: 'Leila spune: A, îmi amintesc. Este proiectul care a câștigat premiul luna trecută?'
    note: '*which* se referă la *the project*.'
  en.b1.unit13.lesson04.teach.q_office_smaller:
    title: Mia povestește despre fostul ei birou
    gloss: 'Mia spune: Exact. Biroul în care lucra înainte era mult mai mic decât al nostru.'
    note: '*where* se referă la un loc: *the office*.'
  en.b1.unit13.lesson04.teach.a_kitchen_where:
    title: Leila înțelege de ce îi place bucătăria
    gloss: 'Leila spune: Asta explică de ce îi place atât de mult bucătăria în care toți iau prânzul împreună.'
    note: '*where* se referă la *the kitchen*.'
