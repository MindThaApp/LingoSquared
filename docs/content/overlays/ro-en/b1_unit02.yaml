teaching:
  en.b1.unit02.lesson01.teach.be_able_to:
    title: be able to
    gloss: a fi în stare să / a putea
    note: '*be able to* înseamnă că ai capacitatea sau ocazia de a face ceva.'
    example_gloss: Pot să-mi reînnoiesc permisul online.
  en.b1.unit02.lesson01.teach.manage_to:
    title: manage to
    gloss: a reuși să faci ceva
    note: '*manage to* înseamnă că ceva a reușit, adesea cu oarecare efort.'
    example_gloss: Am reușit să completez formularul în zece minute.
  en.b1.unit02.lesson01.teach.renew:
    title: renew
    gloss: a reînnoi / a prelungi
    note: '*renew* înseamnă a prelungi valabilitatea unui document înainte să expire.'
    example_gloss: Trebuie să-mi reînnoiesc permisul de conducere.
  en.b1.unit02.lesson01.teach.license:
    title: license
    gloss: permis de conducere
    note: '*license* înseamnă aici un document oficial care îți dă dreptul să conduci (prescurtare de la *driver''s license*). Engleza britanică scrie substantivul *licence*.'
    example_gloss: Permisul meu de conducere expiră luna aceasta.
  en.b1.unit02.lesson01.teach.online:
    title: online
    gloss: online
    note: '*online* înseamnă prin internet, nu într-un loc fizic.'
    example_gloss: Acum îl poți reînnoi online.
  en.b1.unit02.lesson01.teach.in_person:
    title: in person
    gloss: personal / la fața locului
    note: '*in person* înseamnă să te duci tu însuți undeva, nu online.'
    example_gloss: Anul trecut a trebuit să merg personal.
  en.b1.unit02.lesson02.teach.am_able_to_renew_online:
    title: eine gegenwärtige Möglichkeit ausdrücken
    gloss: Acum îmi pot reînnoi permisul online.
    note: '*I am able to* exprimă o posibilitate în prezent.'
  en.b1.unit02.lesson02.teach.was_not_able_to_last_year:
    title: eine vergangene Möglichkeit verneinen
    gloss: Anul trecut nu am putut face asta online.
    note: '*was not able to* exprimă că o posibilitate nu exista în trecut.'
  en.b1.unit02.lesson02.teach.managed_to_finish:
    title: sagen, dass etwas gelungen ist
    gloss: Am reușit să completez formularul în zece minute.
    note: '*managed to* subliniază că ceva a reușit, adesea cu efort.'
  en.b1.unit02.lesson02.teach.grammar_present_past:
    title: Gegenwart und Vergangenheit mit 'be able to'
    gloss: Îl pot reînnoi. L-am putut reînnoi. Aș putea să te ajut.
    note: '*am able to* (prezent), *was able to* (trecut), *would be able to* (ipotetic sau ca ofertă) sunt forme ale aceleiași construcții.'
  en.b1.unit02.lesson03.teach.friend:
    title: friend
    gloss: prieten / prietenă
    note: '*friend* înseamnă prieten sau prietenă.'
    example_gloss: Prietena mea și-a reînnoit permisul săptămâna trecută.
  en.b1.unit02.lesson03.teach.system:
    title: system
    gloss: sistem
    note: '*system* înseamnă un mod organizat de a face ceva.'
    example_gloss: Noul sistem este mult mai rapid.
  en.b1.unit02.lesson03.teach.reading_passage:
    title: 'Lesetext: das neue System'
    gloss: Anul trecut, oamenii nu puteau să-și reînnoiască permisele online. Toți trebuiau să meargă personal la birou. Anul acesta, sistemul s-a schimbat. Acum oamenii pot reînnoi totul de acasă. Prietena mea Mia a reușit să-l termine pe al ei în zece minute.
    note: Un text scurt despre cum noul sistem face reînnoirea mai simplă.
  en.b1.unit02.lesson04.teach.q_were_you_able:
    title: Leila fragt nach dem Führerschein
    gloss: 'Leila spune: Ai putut să-ți reînnoiești permisul online?'
    note: '*were you able to* întreabă despre o posibilitate din trecut.'
  en.b1.unit02.lesson04.teach.a_wasnt_able_office:
    title: 'Daniels Antwort: online ging es nicht'
    gloss: 'Daniel spune: Nu, n-am putut. A trebuit să merg personal la birou.'
    note: '*wasn''t able to* este forma scurtă, vorbită, a lui *was not able to*.'
  en.b1.unit02.lesson04.teach.q_really_managed:
    title: Leila erzählt von ihrer Erfahrung
    gloss: 'Leila spune: Serios? Eu am reușit să o fac online în zece minute.'
    note: '*managed to* subliniază că Leila a reușit repede și fără probleme.'
  en.b1.unit02.lesson04.teach.a_next_time_save:
    title: Daniel denkt an nächstes Mal
    gloss: 'Daniel spune: Data viitoare aș putea economisi timp dacă aș face-o și eu online.'
    note: '*would be able to* exprimă aici o posibilitate ipotetică în viitor.'
  en.b1.unit02.lesson04.teach.q_would_help:
    title: Leila bietet Hilfe an
    gloss: 'Leila spune: Data viitoare te-aș putea ajuta, dacă vrei.'
    note: '*would be able to* este folosit aici pentru o ofertă politicoasă.'
  en.b1.unit02.lesson04.teach.a_thanks:
    title: Daniel bedankt sich
    gloss: 'Daniel spune: Mulțumesc, mi-ar plăcea.'
    note: '*I''d like that* este o modalitate naturală de a accepta o ofertă cu recunoștință.'
