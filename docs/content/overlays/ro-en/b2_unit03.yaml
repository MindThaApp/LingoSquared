teaching:
  en.b2.unit03.lesson01.teach.hedge:
    title: hedge
    gloss: a formula cu prudență
    note: '*hedge* înseamnă că faci o afirmație mai puțin categorică. Nu traduce automat românescul „puțin” prin *a little* când vrei să-ți atenuezi afirmația.'
    example_gloss: Leila folosește seems ca să-și formuleze cu mai multă prudență afirmația despre politică.
  en.b2.unit03.lesson01.teach.qualify:
    title: qualify
    gloss: a limita sau a nuanța
    note: '*qualify* înseamnă că limitezi o afirmație printr-o condiție sau o excepție.'
    example_gloss: Expresia 'provided we agree' îi limitează sprijinul Leilei.
  en.b2.unit03.lesson01.teach.emphasize:
    title: emphasize
    gloss: a sublinia, a accentua
    note: '*emphasize* înseamnă că dai mai multă greutate unei părți din mesajul tău.'
    example_gloss: Daniel subliniază problema volumului de muncă.
  en.b2.unit03.lesson01.teach.to_some_extent:
    title: to some extent
    gloss: într-o oarecare măsură
    note: '*to some extent* sună adesea mai natural decât folosirea peste tot a lui *a little*.'
    example_gloss: Într-o oarecare măsură, politica răspunde îngrijorărilor echipei.
  en.b2.unit03.lesson01.teach.broadly:
    title: broadly
    gloss: în linii mari, în general
    note: '*broadly* exprimă un sprijin general sau un adevăr general, cu loc pentru excepții.'
    example_gloss: Propunerea este utilă în linii mari, deși nu este perfectă.
  en.b2.unit03.lesson01.teach.provided:
    title: provided
    gloss: cu condiția ca
    note: '*provided* introduce o condiție. Corespunde lui „cu condiția ca”, dar în engleză sună adesea formal și profesionist.'
    example_gloss: Putem susține politica, cu condiția să fim de acord.
  en.b2.unit03.lesson02.teach.seems_but_does:
    title: Prudență plus accent
    gloss: Politica pare rezonabilă, dar chiar creează muncă suplimentară pentru echipă.
    note: '*seems* face afirmația pozitivă mai prudentă; *does create* subliniază că munca suplimentară apare cu adevărat. În română se obține un efect asemănător cu „chiar”: chiar creează muncă suplimentară.'
  en.b2.unit03.lesson02.teach.what_worries_me:
    title: Concentrare pe o îngrijorare
    gloss: Ceea ce mă îngrijorează este munca suplimentară a echipei.
    note: '*What worries me is...* pune un punct în față ca să-l evidențieze. Apoi păstrează ordinea din engleză: *is the extra work*.'
  en.b2.unit03.lesson02.teach.broadly_provided:
    title: Sprijin general cu condiție
    gloss: Este utilă în linii mari, cu condiția ca termenul să fie ajustat.
    note: '*broadly useful, provided...* exprimă sprijin cu o condiție clară.'
  en.b2.unit03.lesson02.teach.grammar_stance:
    title: Nuanțare și accent
    gloss: Folosește seems, broadly sau to some extent ca să atenuezi sau să limitezi o afirmație. Folosește do sau does înaintea verbului principal ca să accentuezi că ceva este adevărat. Folosește What matters is... sau What worries me is... ca să îndrepți atenția spre un singur punct.
    note: 'Pentru vorbitorii de română, cel mai nou este *does create*: nu înseamnă „face să creeze”, ci dă accent lui *create*, asemănător cu „chiar creează” în română.'
  en.b2.unit03.lesson03.teach.overall:
    title: overall
    gloss: în ansamblu
    note: '*overall* privește lucrurile în ansamblu, chiar dacă există detalii sau excepții.'
    example_gloss: În ansamblu, Leila susține politica.
  en.b2.unit03.lesson03.teach.condition:
    title: condition
    gloss: condiție
    note: '*condition* este ceva ce trebuie îndeplinit înainte ca ceva să fie valabil.'
    example_gloss: Condiția ei este ca termenul să fie ajustat.
  en.b2.unit03.lesson03.teach.reading_passage:
    title: 'Text de citit: sprijin cu condiții'
    gloss: 'Feedbackul Leilei este pozitiv, dar nuanțat cu grijă. Ea spune că politica de revizuire pare rezonabilă în ansamblu, ceea ce atenuează afirmația și evită un ton categoric. Mai spune că este utilă în linii mari, cu condiția ca termenul să fie ajustat. Această condiție îi limitează sprijinul: ea nu acceptă politica exact așa cum este scrisă. Daniel subliniază un alt punct printr-o construcție de focalizare: ceea ce îl îngrijorează este munca suplimentară a echipei. Ambii vorbitori susțin politica în principiu, dar limbajul lor arată niveluri diferite de angajament.'
    note: Textul arată cum poți face același conținut de bază mai blând, mai puternic sau mai condiționat.
  en.b2.unit03.lesson04.teach.q_policy_seems:
    title: Leila se exprimă cu prudență
    gloss: 'Leila spune: Noua politică de revizuire pare rezonabilă în ansamblu.'
    note: '*seems reasonable overall* este mai pozitiv decât o critică, dar nu este categoric.'
  en.b2.unit03.lesson04.teach.a_not_fully_ready:
    title: Daniel observă prudența
    gloss: 'Daniel spune: Sună cam prudent. Vrei să spui că nu este încă pe deplin gata?'
    note: Daniel observă că Leila nu spune pur și simplu *it is ready*.
  en.b2.unit03.lesson04.teach.q_workable_deadlines:
    title: Leila nuanțează mai departe
    gloss: 'Leila spune: Exact. Se poate să fie aplicabilă, dar are nevoie de termene mai clare.'
    note: '*may be workable* lasă loc de îndoială; *but* numește limita.'
  en.b2.unit03.lesson04.teach.a_what_worries:
    title: Daniel pune accent
    gloss: 'Daniel spune: Sunt de acord. Ceea ce mă îngrijorează este munca suplimentară a echipei.'
    note: '*What worries me is...* pune accentul pe o îngrijorare.'
  en.b2.unit03.lesson04.teach.q_does_create_checks:
    title: Leila accentuează cu does
    gloss: 'Leila spune: Așa e. Politica chiar creează verificări de calitate mai bune, dar adaugă și un nou pas de aprobare.'
    note: '*does create* subliniază că acest avantaj există cu adevărat, în ciuda limitării de mai târziu.'
  en.b2.unit03.lesson04.teach.a_support_conditions:
    title: Daniel rezumă condiția
    gloss: 'Daniel spune: Deci ar trebui să o susținem cu condiții?'
    note: El rezumă sprijinul nuanțat al Leilei.
  en.b2.unit03.lesson04.teach.q_broadly_useful:
    title: Leila oferă sprijin condiționat
    gloss: 'Leila spune: Da. Aș spune că este utilă în linii mari, cu condiția ca termenul să fie ajustat.'
    note: '*provided* înseamnă aici „cu condiția ca”: sprijinul se aplică doar dacă este îndeplinită condiția.'
  en.b2.unit03.lesson04.teach.same_content_triad:
    title: Același conținut, trei grade de intensitate
    gloss: Politica creează muncă suplimentară. Politica pare să creeze muncă suplimentară. Politica chiar creează muncă suplimentară.
    note: Cele trei propoziții exersează varianta neutră, varianta mai prudentă cu *seems to* și varianta mai apăsată cu *does*.
