teaching:
  en.a1.unit08.lesson01.teach.a_pound_of:
    title: a pound of apples
    gloss: o livră de mere
    note: '*a pound* este o unitate de greutate (circa 454 de grame), folosită în SUA pentru fructe și legume; în română i se spune „livră”.'
  en.a1.unit08.lesson01.teach.a_dozen:
    title: a dozen eggs
    gloss: o duzină de ouă
    note: '*a dozen* înseamnă douăsprezece bucăți.'
  en.a1.unit08.lesson01.teach.a_bottle_of:
    title: a bottle of water
    gloss: o sticlă de apă
    note: '*a bottle of* înseamnă „o sticlă de...”.'
  en.a1.unit08.lesson01.teach.a_bag_of:
    title: a bag of rice
    gloss: o pungă de orez
    note: '*a bag of* înseamnă „o pungă de...”, pentru produse vrac, cum este orezul.'
  en.a1.unit08.lesson01.teach.a_kilo_of:
    title: a kilo of tomatoes
    gloss: un kilogram de roșii
    note: '*a kilo of* înseamnă un kilogram; în SUA, în viața de zi cu zi se cântărește mai ales în *pounds*, iar *kilo* se aude mai rar.'
  en.a1.unit08.lesson02.teach.how_much_are:
    title: How much are the apples?
    gloss: Cât costă merele?
    note: '*How much are...?* întreabă prețul unor lucruri la plural.'
  en.a1.unit08.lesson02.teach.two_dollars_a_pound:
    title: They're two dollars a pound.
    gloss: Costă doi dolari livra.
    note: '*a pound* la finalul propoziției înseamnă aici „pe livră”, exact ca *per pound*.'
  en.a1.unit08.lesson02.teach.can_i_have_two_pounds:
    title: Can I have two pounds, please?
    gloss: Pot să iau două livre, vă rog?
    note: '*Can I have...?* este o formulă politicoasă de cerere la cumpărături.'
  en.a1.unit08.lesson02.teach.is_it_fresh:
    title: Is it fresh?
    gloss: Este proaspăt?
    note: O întrebare utilă pentru alimente proaspete, cum sunt fructele sau legumele.
  en.a1.unit08.lesson03.teach.per_pound:
    title: per pound
    gloss: pe livră
    note: '*per pound* arată prețul pentru o unitate de greutate, de exemplu pe etichete.'
    example_gloss: Merele costă doi dolari pe livră.
  en.a1.unit08.lesson03.teach.label_text:
    title: Eticheta de preț
    gloss: 'Mere: 2 dolari pe livră. Ouă: 4 dolari duzina. Orez: 3 dolari punga.'
    note: Semnul dolarului stă ÎNAINTEA numărului (*$2*), nu după el.
  en.a1.unit08.lesson04.teach.thats_x_dollars:
    title: That's eight dollars.
    gloss: Fac opt dolari.
    note: '*That''s X dollars* corespunde lui „Fac X dolari.”'
  en.a1.unit08.lesson04.teach.q_price:
    title: Întrebarea lui Daniel
    gloss: 'Daniel: Cât costă merele?'
    note: Daniel începe conversația cu o întrebare despre preț.
  en.a1.unit08.lesson04.teach.a_price:
    title: Răspunsul lui Leila
    gloss: 'Leila: Costă doi dolari livra.'
    note: Leila spune prețul pe livră.
  en.a1.unit08.lesson04.teach.q_two_pounds:
    title: Comanda lui Daniel
    gloss: 'Daniel: Bine, pot să iau două livre, vă rog?'
    note: '*OK* arată că Daniel acceptă prețul înainte să comande.'
  en.a1.unit08.lesson04.teach.a_sure_anything_else:
    title: Întrebarea suplimentară a lui Leila
    gloss: 'Leila: Sigur. Altceva?'
    note: '*Sure* înseamnă aici „sigur” sau „cu plăcere”.'
  en.a1.unit08.lesson04.teach.q_eggs_too:
    title: Comanda suplimentară a lui Daniel
    gloss: 'Daniel: Da, și o duzină de ouă.'
    note: '*too* la finalul propoziției înseamnă „și”, „de asemenea”.'
  en.a1.unit08.lesson04.teach.a_total:
    title: Încheierea lui Leila
    gloss: 'Leila: Fac opt dolari.'
    note: Leila spune prețul total pentru mere și ouă la un loc.
