teaching:
  en.a1.unit64.lesson01.teach.nice:
    title: nice
    gloss: frumos / drăguț / amabil
    note: '*nice* înseamnă frumos, drăguț sau amabil, în funcție de situație.'
    example_gloss: Asta e drăguț.
  en.a1.unit64.lesson01.teach.great:
    title: great
    gloss: grozav
    note: '*great* este mai puternic decât *nice* și înseamnă grozav.'
    example_gloss: Arăți grozav.
  en.a1.unit64.lesson01.teach.lovely:
    title: lovely
    gloss: încântător / foarte frumos
    note: '*lovely* sună cald și prietenos.'
    example_gloss: Ce zâmbet încântător.
  en.a1.unit64.lesson01.teach.kind:
    title: kind
    gloss: amabil
    note: '*kind* înseamnă prietenos și bun cu ceilalți.'
    example_gloss: Este foarte amabil din partea ta.
  en.a1.unit64.lesson01.teach.smile:
    title: smile
    gloss: zâmbet
    note: '*smile* înseamnă zâmbet.'
    example_gloss: Ce zâmbet încântător.
  en.a1.unit64.lesson01.teach.jacket:
    title: jacket
    gloss: jachetă / geacă
    note: '*jacket* înseamnă jachetă sau geacă.'
    example_gloss: Îmi place jacheta ta.
  en.a1.unit64.lesson02.teach.that_is_nice:
    title: That is nice.
    gloss: Asta e drăguț.
    note: '*That is nice* este o reacție pozitivă scurtă.'
  en.a1.unit64.lesson02.teach.you_look_great:
    title: You look great.
    gloss: Arăți grozav.
    note: '*look* înseamnă aici a arăta, a avea un aspect, nu a se uita.'
  en.a1.unit64.lesson02.teach.like_your_jacket:
    title: I like your jacket.
    gloss: Îmi place jacheta ta.
    note: '*I like your...* este o modalitate obișnuită de a face un compliment pentru ceva ce aparține cuiva.'
  en.a1.unit64.lesson02.teach.lovely_smile:
    title: What a lovely smile.
    gloss: Ce zâmbet încântător.
    note: '*What a...* se folosește pentru a face un compliment sub formă de exclamație.'
  en.a1.unit64.lesson02.teach.very_kind:
    title: That is very kind.
    gloss: Este foarte amabil din partea ta.
    note: '*very* întărește sensul lui *kind*.'
  en.a1.unit64.lesson02.teach.thank_you_much:
    title: Thank you very much.
    gloss: Îți mulțumesc foarte mult.
    note: '*Thank you very much* este o formulă de mulțumire politicoasă și caldă.'
  en.a1.unit64.lesson03.teach.dialogue_line1:
    title: "Mia face un compliment"
    gloss: 'Mia spune: Bună, Leila. Arăți grozav astăzi.'
    note: '*You look great* este un compliment direct.'
  en.a1.unit64.lesson03.teach.dialogue_line2:
    title: Leila îi mulțumește Miei
    gloss: 'Leila spune: Mulțumesc, Mia.'
    note: '*Thank you* înseamnă mulțumesc.'
  en.a1.unit64.lesson03.teach.dialogue_line3:
    title: Mia vorbește despre jacheta verde
    gloss: 'Mia spune: Îmi place jacheta ta verde.'
    note: '*I like your green jacket* face un compliment pentru haine.'
  en.a1.unit64.lesson03.teach.dialogue_line4:
    title: Leila răspunde prietenos
    gloss: 'Leila spune: Este foarte amabil din partea ta.'
    note: '*That is very kind* este răspunsul la ceva frumos pe care îl spune cineva.'
  en.a1.unit64.lesson03.teach.dialogue_line5:
    title: Mia vorbește despre zâmbet
    gloss: 'Mia spune: Ce zâmbet încântător ai și tu! Uite, aceasta este fotografia mea.'
    note: '*too* înseamnă aici și, de asemenea.'
  en.a1.unit64.lesson03.teach.dialogue_line6:
    title: Leila face un compliment fotografiei
    gloss: 'Leila spune: Îți mulțumesc foarte mult. Fotografia ta este frumoasă.'
    note: '*Your photo is nice* întoarce complimentul.'
  en.a1.unit64.lesson03.teach.dialogue_line7:
    title: Mia explică fotografia
    gloss: 'Mia spune: Mulțumesc. Este pentru Daniel.'
    note: '*Thanks* este mai scurt decât *thank you*.'
  en.a1.unit64.lesson04.teach.message:
    title: Mesaj drăguț
    gloss: 'Mesaj drăguț: Jacheta ta verde este încântătoare. Fotografia ta este frumoasă. Mulțumesc că ești amabilă.'
    note: Mesajul conține două complimente și îi mulțumește cuiva.
  en.a1.unit64.lesson04.teach.reading_passage:
    title: 'Text: Un compliment pentru o prietenă'
    gloss: 'Un compliment pentru o prietenă: Mia a văzut-o pe Leila într-o jachetă verde. Mia a spus că Leila arată grozav. A mai spus că Leila are un zâmbet încântător. Leila i-a mulțumit Miei. Apoi Leila s-a uitat la fotografia Miei și a spus că este frumoasă. Mia era fericită, pentru că fotografia era pentru Daniel. Mai târziu, Leila a scris un mesaj scurt: Jacheta ta verde este încântătoare.'
    note: '*looked great* este forma de trecut a expresiei *look great*.'
