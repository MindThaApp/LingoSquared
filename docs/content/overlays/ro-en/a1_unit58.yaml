teaching:
  en.a1.unit58.lesson01.teach.museum:
    title: museum
    gloss: muzeu
    note: '*museum* înseamnă muzeu – în română, cuvântul este aproape la fel.'
    example_gloss: Acest muzeu este foarte vechi.
  en.a1.unit58.lesson01.teach.ticket:
    title: ticket
    gloss: bilet
    note: '*ticket* înseamnă bilet, adică dovada plății care îți dă voie să intri.'
    example_gloss: Am nevoie de un bilet, vă rog.
  en.a1.unit58.lesson01.teach.exhibition:
    title: exhibition
    gloss: expoziție
    note: '*exhibition* înseamnă o colecție de opere de artă sau de obiecte care pot fi vizitate.'
    example_gloss: Este o expoziție nouă.
  en.a1.unit58.lesson01.teach.painting:
    title: painting
    gloss: tablou
    note: '*painting* înseamnă o operă de artă făcută cu vopsea.'
    example_gloss: Tabloul acesta îmi place foarte mult.
  en.a1.unit58.lesson01.teach.sculpture:
    title: sculpture
    gloss: sculptură
    note: '*sculpture* înseamnă o operă de artă făcută din piatră, lemn sau metal – în română, cuvântul este foarte asemănător: sculptură.'
    example_gloss: Și această sculptură este foarte veche.
  en.a1.unit58.lesson01.teach.guide:
    title: guide
    gloss: ghid
    note: '*guide* înseamnă o persoană care îi poartă pe vizitatori prin muzeu și le explică lucruri.'
    example_gloss: Este un ghid astăzi?
  en.a1.unit58.lesson02.teach.what_time_does_the_museum_open:
    title: What time does the museum open?
    gloss: La ce oră se deschide muzeul?
    note: Această întrebare începe cu *what time*, urmat de auxiliarul *does*, pentru că verbul principal este *open*.
  en.a1.unit58.lesson02.teach.what_time_does_the_museum_close:
    title: What time does the museum close?
    gloss: La ce oră se închide muzeul?
    note: Aceeași structură de întrebare ca la *What time does the museum open?*, dar cu *close* în loc de *open*.
  en.a1.unit58.lesson02.teach.two_tickets_please:
    title: Two tickets, please.
    gloss: Două bilete, vă rog.
    note: '*please* la sfârșit face cererea politicoasă, ca atunci când comanzi mâncare.'
  en.a1.unit58.lesson02.teach.is_there_a_guide_for_the_exhibition:
    title: Is there a guide for the exhibition?
    gloss: Există un ghid pentru expoziție?
    note: '*Is there...?* se folosește pentru a întreba dacă ceva există sau este prezent – aici, un ghid.'
  en.a1.unit58.lesson02.teach.the_museum_is_open_every_day:
    title: The museum is open every day.
    gloss: Muzeul este deschis în fiecare zi.
    note: '*every day* înseamnă în fiecare zi și stă la sfârșitul propoziției.'
  en.a1.unit58.lesson02.teach.i_really_enjoyed_the_paintings:
    title: I really enjoyed the paintings!
    gloss: Mi-au plăcut foarte mult tablourile!
    note: '*enjoyed* este forma de trecut a verbului *enjoy* (a se bucura de), folosită pentru a privi înapoi la ceva plăcut.'
  en.a1.unit58.lesson03.teach.dialogue_line1:
    title: Întrebarea lui Daniel
    gloss: 'Daniel spune: Bună! La ce oră se închide muzeul?'
    note: '*Hi!* este un salut informal.'
  en.a1.unit58.lesson03.teach.dialogue_line2:
    title: Răspunsul angajatului
    gloss: 'Angajatul spune: Ne închidem la ora cinci.'
    note: '*at* + oră arată când se întâmplă ceva, ca în *at five o''clock*.'
  en.a1.unit58.lesson03.teach.dialogue_line3:
    title: Cererea Miei
    gloss: 'Mia spune: Perfect. Putem lua două bilete, vă rog?'
    note: '*Can we have...?* este o modalitate politicoasă de a comanda sau de a cere ceva.'
  en.a1.unit58.lesson03.teach.dialogue_line4:
    title: Prețul
    gloss: 'Angajatul spune: Desigur. Fac doisprezece dolari.'
    note: '*That''s* + sumă se folosește pentru a spune un preț.'
  en.a1.unit58.lesson03.teach.dialogue_line5:
    title: Întrebarea lui Daniel despre ghid
    gloss: 'Daniel întreabă: Există un ghid pentru expoziție?'
    note: Aceeași structură *Is there...?* pe care ai învățat-o mai devreme.
  en.a1.unit58.lesson03.teach.dialogue_line6:
    title: Angajatul despre ghid
    gloss: 'Angajatul spune: Da, este un ghid lângă intrare.'
    note: '*there''s* este forma contrasă de la *there is*.'
  en.a1.unit58.lesson03.teach.dialogue_line7:
    title: Mia întreabă numele
    gloss: 'Mia întreabă: Cum se numește expoziția?'
    note: '*What is ... called?* este modul obișnuit de a întreba numele unui lucru.'
  en.a1.unit58.lesson03.teach.dialogue_line8:
    title: Numele expoziției
    gloss: 'Angajatul spune: Se numește Colors of the City.'
    note: '*It''s called...* este răspunsul la întrebarea *What is ... called?*.'
  en.a1.unit58.lesson03.teach.dialogue_line9:
    title: Încheierea lui Daniel
    gloss: 'Daniel spune: Mulțumesc! Abia aștept să văd tablourile.'
    note: '*can''t wait to...* înseamnă că abia aștepți să faci ceva.'
  en.a1.unit58.lesson04.teach.museum_notice:
    title: Panoul muzeului
    gloss: 'Muzeul Orașului: deschis în fiecare zi, între 9:00 și 17:00. Bilet adulți: 6 dolari. Expoziția actuală: Colors of the City, Sala 2.'
    note: Panoul arată programul de vizitare, prețul și numele expoziției.
  en.a1.unit58.lesson04.teach.reading_passage:
    title: Text despre Daniel și Mia
    gloss: 'O vizită la muzeu: Într-o sâmbătă după-amiază, Daniel și Mia au hotărât să viziteze împreună Muzeul Orașului. La intrare, angajatul le-a spus că muzeul se închide la ora cinci. Au cumpărat două bilete cu doisprezece dolari. Daniel a întrebat de un ghid, iar angajatul a spus că există unul lângă intrare. Au vizitat expoziția Colors of the City și au văzut multe tablouri frumoase în Sala 2. Lui Daniel i-a plăcut un tablou cu piața veche a orașului, iar Miei i-a plăcut un tablou cu râul la apus. Când au plecat, Mia a spus că data viitoare vrea să viziteze expoziția de sculptură.'
    note: '*decided to visit* folosește *to* + infinitiv după *decided*, pentru a arăta ce a hotărât cineva să facă.'
