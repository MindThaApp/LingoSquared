teaching:
  en.a2.unit30.lesson01.teach.experience:
    title: experience
    gloss: experiență
    note: '*experience* înseamnă experiență, mai ales experiență profesională.'
    example_gloss: Am doi ani de experiență în marketing.
  en.a2.unit30.lesson01.teach.position:
    title: position
    gloss: post
    note: '*position* înseamnă postul sau funcția dintr-o companie.'
    example_gloss: Acest post este pentru un coordonator de marketing.
  en.a2.unit30.lesson01.teach.availability:
    title: availability
    gloss: disponibilitate
    note: '*availability* înseamnă când ai timp, de exemplu ca să începi munca.'
    example_gloss: Recrutoarea m-a întrebat despre disponibilitatea mea.
  en.a2.unit30.lesson01.teach.strength:
    title: strength
    gloss: punct forte
    note: '*strength* înseamnă ceva ce faci deosebit de bine.'
    example_gloss: Unul dintre punctele mele forte este că sunt bine organizat.
  en.a2.unit30.lesson01.teach.requirement:
    title: requirement
    gloss: cerință
    note: '*requirement* înseamnă ceva ce se cere pentru post.'
    example_gloss: Doi ani de experiență profesională sunt o cerință pentru acest post.
  en.a2.unit30.lesson02.teach.two_years_experience:
    title: Descrierea propriei experiențe
    gloss: Am doi ani de experiență în marketing pe rețelele sociale.
    note: Cu această propoziție îți descrii experiența profesională la interviu.
  en.a2.unit30.lesson02.teach.one_strength_organized:
    title: Menționarea unui punct forte
    gloss: Unul dintre punctele mele forte este că sunt bine organizat.
    note: '*One of my strengths is...* este modul obișnuit de a spune un punct forte la interviu.'
  en.a2.unit30.lesson02.teach.available_next_monday:
    title: Spunerea disponibilității tale
    gloss: Pot începe luni viitoare.
    note: Cu *I'm available to start...* spui de când poți începe.
  en.a2.unit30.lesson03.teach.resume:
    title: resume
    gloss: CV
    note: '*resume* înseamnă CV. Cuvântul se folosește mai ales în engleza americană.'
    example_gloss: Te rugăm să aduci CV-ul la interviu.
  en.a2.unit30.lesson03.teach.deadline:
    title: deadline
    gloss: termen limită
    note: '*deadline* înseamnă termenul până la care trebuie să fie gata ceva. În română se folosește des și cuvântul „deadline”.'
    example_gloss: La serviciu îmi respect întotdeauna termenele.
  en.a2.unit30.lesson03.teach.posting_text:
    title: Textul anunțului de angajare
    gloss: 'Bright Path Marketing caută un coordonator de marketing. Cerințe: doi ani de experiență profesională, abilități bune de scriere și disponibilitate de a începe imediat. Vă rugăm să aduceți CV-ul la interviu.'
    note: Un anunț de angajare oficial, cu cerințe și o indicație.
  en.a2.unit30.lesson03.teach.i_meet_deadlines:
    title: Vorbirea despre propriul mod de lucru
    gloss: Îmi respect termenele și lucrez bine în echipă.
    note: '*I meet deadlines* și *I work well in a team* sunt propoziții utile pentru a-ți descrie felul de a munci.'
  en.a2.unit30.lesson04.teach.q_tell_me_experience:
    title: Intervievatoarea întreabă despre experiență
    gloss: 'Recrutoarea spune: Vă mulțumesc că ați venit astăzi. Îmi puteți vorbi despre experiența dumneavoastră?'
    note: '*Thank you for coming in today* este o formulă politicoasă de început de interviu.'
  en.a2.unit30.lesson04.teach.a_two_years_managed_team:
    title: Răspunsul lui Mia despre experiență
    gloss: 'Mia spune: Am doi ani de experiență în marketing pe rețelele sociale. De asemenea, am condus o echipă mică.'
    note: 'Aceeași propoziție despre experiență ca în lecția 2, cu un detaliu în plus: a condus o echipă.'
  en.a2.unit30.lesson04.teach.q_what_strength:
    title: Întrebarea despre un punct forte
    gloss: 'Recrutoarea spune: Excelent. Care este unul dintre punctele dumneavoastră forte?'
    note: Recrutoarea reacționează pozitiv și apoi pune următoarea întrebare.
  en.a2.unit30.lesson04.teach.a_organized_deadlines:
    title: Răspunsul lui Mia despre punctul ei forte
    gloss: 'Mia spune: Sunt foarte organizată și îmi respect termenele.'
    note: Mia spune punctul ei forte (organizarea) și un exemplu concret (respectarea termenelor).
  en.a2.unit30.lesson04.teach.q_have_questions:
    title: Întrebarea dacă mai sunt întrebări
    gloss: 'Recrutoarea întreabă: Aveți întrebări despre acest post?'
    note: O întrebare obișnuită la sfârșitul unui interviu.
  en.a2.unit30.lesson04.teach.a_wondering_typical_week:
    title: Mia pune o întrebare proprie
    gloss: 'Mia spune: Da, aș vrea să știu cum arată o săptămână obișnuită pe acest post.'
    note: '*I was wondering...* este o formă politicoasă de a pune chiar tu o întrebare.'
