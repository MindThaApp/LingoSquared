  en.a1.unit56.lesson02.teach.is_this_table_free:
    title: Is this table free?
    gloss: Este liberă masa aceasta?
    note: '*free* înseamnă aici „liber”, „neocupat” – la fel ca în română.'
  en.a1.unit56.lesson02.teach.can_i_order_now:
    title: Can I order now?
    gloss: Pot comanda acum?
    note: '*Can I...?* este o modalitate directă de a cere ceva – mai puțin formală decât *could*.'
  en.a1.unit56.lesson02.teach.id_like_the_salad:
    title: I'd like the salad, please.
    gloss: Aș dori salata, vă rog.
    note: '*I''d like* (forma scurtă de la *I would like*) este modul politicos de a comanda.'
  en.a1.unit56.lesson02.teach.how_much_is_the_salad:
    title: How much is the salad?
    gloss: Cât costă salata?
    note: '*How much is...?* întreabă prețul.'
  en.a1.unit56.lesson02.teach.could_we_have_the_bill:
    title: Could we have the bill, please?
    gloss: Am putea primi nota de plată, vă rog?
    note: '*Could we have...?* este modul politicos de a cere. În română se spune „Am putea primi nota?” sau „Ne aduceți nota, vă rog?”; în engleză, *could* este varianta naturală și politicoasă.'
  en.a1.unit56.lesson02.teach.enjoy_your_meal:
    title: Enjoy your meal!
    gloss: Poftă bună!
    note: '*Enjoy your meal!* este o formulă fixă pe care ospătarul o spune înainte să începi să mănânci. Literal înseamnă „bucurați-vă de masă”, dar în română se spune „Poftă bună!”. Învață formula ca pe un tot, nu cuvânt cu cuvânt.'
  en.a1.unit56.lesson03.teach.dialogue_line1:
    title: Leila întreabă despre masă
    gloss: 'Leila spune: Bună ziua! Este liberă masa aceasta?'
    note: '*Is this table free?* folosește *free* cu sensul „liber”, „neocupat”.'
  en.a1.unit56.lesson03.teach.dialogue_line2:
    title: Ospătarul arată o masă
    gloss: 'Ospătarul spune: Da, poftiți, luați loc aici.'
    note: '*please sit here* este o invitație scurtă și politicoasă.'
  en.a1.unit56.lesson03.teach.dialogue_line3:
    title: Mia cere meniul
    gloss: 'Mia spune: Aș putea vedea meniul, vă rog?'
    note: '*Could I see...?* – din nou *could*, politicos, ca în *could we have the bill*.'
  en.a1.unit56.lesson03.teach.dialogue_line4:
    title: Ospătarul aduce meniul
    gloss: 'Ospătarul spune: Desigur, poftiți.'
    note: '*Of course, here you are* este o formulă obișnuită când întinzi cuiva ceva.'
  en.a1.unit56.lesson03.teach.dialogue_line5:
    title: Comanda Leilei
    gloss: 'Leila spune: Aș dori puiul, vă rog.'
    note: 'O singură informație: Leila a comandat pui.'
  en.a1.unit56.lesson03.teach.dialogue_line6:
    title: Comanda Miei
    gloss: 'Mia spune: Aș dori salata, vă rog.'
    note: 'O singură informație: Mia a comandat salată.'
  en.a1.unit56.lesson03.teach.dialogue_line7:
    title: Ospătarul urează poftă bună
    gloss: 'Ospătarul spune: Alegere bună! Poftă bună!'
    note: '*Enjoy your meal!* – formula obișnuită spusă înainte ca oaspeții să înceapă să mănânce.'
  en.a1.unit56.lesson03.teach.dialogue_line8:
    title: Leila întreabă prețul puiului
    gloss: 'Leila spune: Cât costă puiul?'
    note: '*How much is...?* întreabă prețul.'
  en.a1.unit56.lesson03.teach.dialogue_line9:
    title: Prețul puiului
    gloss: 'Ospătarul spune: Puiul costă doisprezece dolari.'
    note: 'O singură informație: prețul puiului, separat de salată și de nota totală.'
  en.a1.unit56.lesson03.teach.dialogue_line10:
    title: Mia întreabă prețul salatei
    gloss: 'Mia spune: Cât costă salata?'
    note: '*How much is...?* – aceeași formă de întrebare ca la pui.'
  en.a1.unit56.lesson03.teach.dialogue_line11:
    title: Prețul salatei
    gloss: 'Ospătarul spune: Salata costă șapte dolari.'
    note: 'A doua informație separată: prețul salatei.'
  en.a1.unit56.lesson03.teach.dialogue_line12:
    title: "Leila cere nota"
    gloss: 'Leila spune: Am putea primi nota de plată, vă rog?'
    note: '*Could we have...?* – din nou *could*, politicos.'
  en.a1.unit56.lesson03.teach.dialogue_line13:
    title: Nota totală
    gloss: 'Ospătarul spune: Sunt nouăsprezece dolari, vă rog.'
    note: 'A treia informație separată: nota totală, diferită de prețurile individuale ale puiului și ale salatei.'
  en.a1.unit56.lesson04.teach.restaurant_menu:
    title: Meniu
    gloss: 'Meniul restaurantului: Pui - $12. Salată - $7. Pizza - $10. Suc - $3.'
    note: Meniul arată patru produse cu prețurile lor.
  en.a1.unit56.lesson04.teach.reading_passage:
    title: 'Text: O masă la restaurant'
    gloss: Într-o seară, Leila și Mia s-au hotărât să încerce un restaurant nou din centru. Un ospătar le-a condus la o masă de lângă fereastră. El le-a adus un meniu cu pui, salată, pizza și suc. Leila a comandat puiul, iar Mia a comandat salata. Puiul costa doisprezece dolari, iar salata costa șapte dolari. Cât timp au mâncat, au vorbit despre cursul de fotografie al Miei. Când au terminat, ospătarul a adus nota de plată. Era nouăsprezece dolari pentru amândouă. Leila a spus că restaurantul a fost excelent, iar Mia a spus că vrea să-l aducă pe Daniel aici data viitoare.
    note: '*ordered* este trecutul lui *order* („a comanda”).'
