  nl.a1.unit43.lesson03.teach.ik_vind_grammar:
    title: Ik vind の文型
    gloss: '*Ik vind* + 季節 + 特徴で、その季節をどう思うかを言います：夏が好きです。'
    note: すでに学んだ *Ik vind X Y*(「XはYだと思う」)の言い方(Ik vind koffie lekker、Ik vind Fenna nieuwsgierig)をそのまま使います。新しい文法ではなく、使う場面が増えただけです。主語が *Ik*(一人称)なので、ここでは *vind* に -t は付きません。疑問文 *Welk seizoen vind jij mooi?* でも、*jij* が動詞の後ろに来る(倒置)ため -t は付きません。三人称の *vindt*(*Omar vindt ...* など)は別の文法項目で、まだ学びません。
