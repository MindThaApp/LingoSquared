teaching:
  nl.a1.unit10.lesson01.teach.opstaan:
    title: 起きる
    gloss: 起きる → 私は起きます
    note: '*Opstaan* は主文で分かれます：*Ik sta op*。接頭辞の *op* が文末に移ります。'
  nl.a1.unit10.lesson01.teach.aankleden:
    title: 服を着る
    gloss: 服を着る → 私は服を着ます
    note: '*Zich aankleden* は再帰動詞で、分離動詞でもあります。*ik* のときは *me* を使い、*aan* を文末に置きます：*Ik kleed me aan*。'
  nl.a1.unit10.lesson01.teach.ontbijten:
    title: 朝食をとる
    gloss: 朝食をとる → 私は朝食をとります
    note: '*Ontbijten* は分かれません：*Ik ontbijt*。'
  nl.a1.unit10.lesson01.teach.werken:
    title: 仕事
    gloss: 働く → 私は働きます
    note: '*Werken* は分かれません：*Ik werk*。'
  nl.a1.unit10.lesson01.teach.eten:
    title: 食べる
    gloss: 食べる → 食べます
    note: '*eten* の *ik* の形は *eet* です：*Ik eet*。'
  nl.a1.unit10.lesson01.teach.afwassen:
    title: 皿洗いをする
    gloss: 皿を洗う → 皿を洗います
    note: '*Afwassen* は分かれます：*Ik was af*。接頭辞の *af* が文末に移ります。'
  nl.a1.unit10.lesson01.teach.slapen:
    title: 寝る
    gloss: 寝る → 寝ます
    note: '*Slapen* は分かれません。*ik* の形では母音が長くなります：*Ik slaap*。'
  nl.a1.unit10.lesson02.teach.split_rule:
    title: 分離のパターン
    gloss: ふつうの主文では、前の部分が文末に移ります：opstaan → Ik sta op。
    note: '*Ik opsta* とは言いません。基本の動詞を活用させ、短い接頭辞を主文の最後に置きます。'
  nl.a1.unit10.lesson02.teach.opstaan_split:
    title: 文の中の Opstaan
    gloss: 起きる：7時に起きます。
    note: 時を表す語句は、*sta* と文末の接頭辞 *op* の間に入ります。
  nl.a1.unit10.lesson02.teach.aankleden_split:
    title: 文の中の Aankleden
    gloss: 服を着る：服を着ます。
    note: 語順は *Ik* + *kleed* + *me* + *aan* です。*Aan* は文末に残ります。
  nl.a1.unit10.lesson02.teach.afwassen_split:
    title: 文の中の Afwassen
    gloss: 皿洗いをする：食べた後に皿を洗います。
    note: '*Na het eten* は、*was* と文末の接頭辞 *af* の間に入ります。'
  nl.a1.unit10.lesson02.teach.contrast:
    title: 分かれない動詞
    gloss: 分離しない動詞：朝食を食べます。働きます。眠ります。文末に来る部分はありません。
    note: '*Ontbijten*、*werken*、*slapen* は、これらの主文では1つの動詞の形のままです。'
  nl.a1.unit10.lesson03.teach.get_up_time:
    title: 7時半に起きる
    gloss: 7時30分に起きます。
    note: オランダ語の時刻の言い方を思い出しましょう。*half acht* は「8時に向かって半分」、つまり7時30分です。*Op* は文末に残ります。
  nl.a1.unit10.lesson03.teach.dress_time:
    title: 8時15分前に服を着る
    gloss: 7時45分に服を着ます。
    note: 時刻は、文末の分離する接頭辞 *aan* の前に置きます。
  nl.a1.unit10.lesson03.teach.breakfast_time:
    title: 8時に朝食を食べる
    gloss: 8時に朝食を食べます。
    note: 時刻の前には *om* を使います。*Ontbijt* は分かれません。
  nl.a1.unit10.lesson03.teach.work_time:
    title: 9時から5時まで働く
    gloss: 9時から5時まで働きます。
    note: '*Van ... tot ...* で、開始時刻と終了時刻を表します。'
  nl.a1.unit10.lesson03.teach.eat_time:
    title: 6時半に食事をする
    gloss: 午後6時30分に食事をします。
    note: '*''s Avonds* で夜だとはっきり分かるので、ここでの *half zeven* は18時30分です。'
  nl.a1.unit10.lesson03.teach.sleep_time:
    title: 11時に寝る
    gloss: 11時に寝ます。
    note: 時刻の前には *om* を使います：*om elf uur*。
  nl.a1.unit10.lesson04.teach.eerst_dan_daarna:
    title: まず、次に、その後
    gloss: まず、次に、その後
    note: '*Eerst* は最初の活動、*dan* は次の活動、*daarna* は前のことに続くことを表します。'
    example_gloss:
    - まず起きます。
    - 次に服を着ます。
    - その後、朝食を食べます。
  nl.a1.unit10.lesson04.teach.sequence:
    title: 朝の3ステップ
    gloss: まず起きます。次に服を着ます。その後、朝食を食べます。
    note: 分離する接頭辞は、やはり文の最後に来ます：*sta ik op*、*kleed ik me aan*。
  nl.a1.unit10.lesson04.teach.sequence_order_note:
    title: ikの前に来る動詞
    gloss: eerst、dan、daarnaの後では、動詞が ik の前に来ます：Daarna ontbijt ik。
    note: 順序を表す語で文を始めると、*Ik ontbijt* が *Daarna ontbijt ik* になります。
  nl.a1.unit10.lesson05.teach.routine_text:
    title: 私の一日
    gloss: 私の一日 — 7時30分に起きます。その後、服を着て、8時に朝食を食べます。9時から5時まで働きます。午後6時30分に食事をします。その後、皿を洗います。11時に寝ます。
    note: 活動の順番と時刻の両方に注意して読みましょう。分離動詞の文では、文末の *op*、*aan*、*af* にも注目してください。
    glosses:
      Mijn: 私の
      dag: 日
      sta: 起きる(opとともに)
      half: 次の時刻へ向かって半分(half acht = 7時30分)
      acht: '8'
      Daarna: その後
      kleed: 服を着る(me ... aanとともに)
      uur: 〜時
      ontbijt: 朝食をとる
      werk: 働く
      negen: '9'
      vijf: '5'
      zeven: '7'
      avonds: 夕方に
      eet: 食べる
      was: 食器を洗う(afとともに)
      elf: '11'
      slaap: 眠る
  nl.a1.unit10.lesson06.teach.question:
    title: 一日について尋ねる
    gloss: ロッテ：オマル、あなたの一日はどんな感じ？
    note: '*Hoe ziet jouw dag eruit?* は、相手に一日の様子を話してもらうときのくだけた言い方です。*Eruitzien* は分離動詞で、*ziet ... eruit* となります。'
  nl.a1.unit10.lesson06.teach.morning:
    title: オマルの朝
    gloss: オマル：7時30分に起きます。その後、服を着て、8時に朝食を食べます。
    note: オマルは朝の3つの活動をつなげていて、*op* と *aan* をそれぞれの文末に置いています。
  nl.a1.unit10.lesson06.teach.work:
    title: オマルの仕事の日
    gloss: ロッテ：いつ働いているの？オマル：9時から5時まで働いています。
    note: ロッテとオマルは、お互いにくだけた *je* を使っています。
  nl.a1.unit10.lesson06.teach.evening:
    title: オマルの夜
    gloss: オマル：午後6時30分に食事をします。その後、食器を洗います。11時に寝ます。
    note: 時刻や *daarna* で文を始めると、動詞が *ik* の前に来ます：*eet ik*、*was ik*、*slaap ik*。*Af* は文末に残ります。
  nl.a1.unit10.lesson06.teach.lotte:
    title: ロッテの朝
    gloss: ロッテ：6時に起きますが、朝食は6時30分になってから食べます。
    note: ここでの *Pas* は「〜になってやっと」という意味です。ロッテは起きる時刻と朝食の時刻を対比させています。
