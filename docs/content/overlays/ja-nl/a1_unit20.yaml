teaching:
  nl.a1.unit20.lesson01.teach.jas_trui:
    title: コート、セーター
    gloss: コート、セーター
    note: '*De jas* も *de trui* も通性名詞です。'
    example_gloss:
    - コートを探しています。
    - セーターを持っています。
  nl.a1.unit20.lesson01.teach.broek_schoenen:
    title: ズボン、靴
    gloss: ズボン、靴
    note: '*Broek* は文法上は単数です。ズボン1本なら *een broek* と言い、*broeken* は複数形です。*Schoenen* は *schoen* の複数形で、靴はたいてい複数形で言います。'
    example_gloss:
    - 私はズボンを探しています。
    - 靴を探しています。
  nl.a1.unit20.lesson01.teach.zoek_jas:
    title: 探しているものを言う
    gloss: コートを探しています。
    note: '*Zoeken*(探す)は、ここでは前置詞を付けずに目的語を直接取ります。(*Zoeken naar* という言い方もありますが、目的語をそのまま続ける形がいちばん簡単です。)'
  nl.a1.unit20.lesson02.teach.maat:
    title: サイズ
    gloss: サイズ
    note: 通性名詞です：*de maat*。
    example_gloss: サイズはいくつですか？
  nl.a1.unit20.lesson02.teach.welke_maat:
    title: サイズをたずねる
    gloss: サイズはいくつですか？
    note: '*Welke*(どの)を使うのは、*maat* の答えがS、M、Lや数字など、限られた選択肢の中から決まるからです。'
  nl.a1.unit20.lesson02.teach.heb_maat_m:
    title: 自分のサイズを言う
    gloss: 私はMサイズです。
    note: 日本語では「Mサイズです」と言いますが、オランダ語ではここで *hebben*(持つ)を使い、「Mサイズを持っている」という形で言います。
  nl.a1.unit20.lesson03.teach.zwart_blauw:
    title: 黒、青
    gloss: 黒、青
    note: このレッスンで学ぶ、基本の色を表す形容詞2つです。
    example_gloss:
    - 黒のコートがほしいです。
    - これの青もありますか？
  nl.a1.unit20.lesson03.teach.wil_in_zwart:
    title: 色を頼む
    gloss: 黒のコートがほしいです。
    note: '*In het* + 色は、服を注文したり頼んだりするときに色を指定する標準的な言い方です。'
  nl.a1.unit20.lesson03.teach.ook_in_blauw:
    title: 別の色についてたずねる
    gloss: これの青もありますか？
    note: '*Ook*(〜も)を使って、別の色もあるかどうかを尋ねています。丁寧な *u* を使った言い方です。'
  nl.a1.unit20.lesson04.teach.past_deze_jas:
    title: サイズが合うかたずねる
    gloss: このコートはサイズが合いますか？
    note: '*Passen*(合う)は服のサイズが合うかを言うときの自然な動詞で、「試着する」の意味の *passen* とは別の使い方です。'
  nl.a1.unit20.lesson04.teach.past_goed:
    title: ぴったりだと伝える
    gloss: ぴったり合います。
    note: '*Goed*(よく)は、服がどのくらい合っているかを表します。'
  nl.a1.unit20.lesson04.teach.te_klein:
    title: 小さすぎる
    gloss: 小さすぎます。
    note: '*Te*(〜すぎる)は形容詞の前に置いて、度を超えていることを表します。'
  nl.a1.unit20.lesson04.teach.te_groot:
    title: 大きすぎる
    gloss: 大きすぎます。
    note: 前のカードの *te klein* と同じ、*te* + 形容詞の型です。
  nl.a1.unit20.lesson05.teach.negentig:
    title: '90'
    gloss: '90'
    note: '*Negentig* は90という数字で、ここではコートの値段に使われています。'
    example_gloss: そのコートは90ユーロです。
  nl.a1.unit20.lesson05.teach.kost_negentig:
    title: 値段を言う
    gloss: そのコートは90ユーロです。
    note: '*Kost* は *kosten*(値段がかかる)の三人称単数の形です。'
  nl.a1.unit20.lesson05.teach.bonnetje:
    title: お店のレシートを読む
    gloss: 冬のコート：サイズM、色は黒。価格：90ユーロ。このコートはサイズがぴったりで、暖かいです。
    note: サイズ、色、価格、そしてコートについて述べられている2つの特徴に注目しましょう。
    glosses:
      Winterjas: 冬のコート
      maat: サイズ
      kleur: 色
      zwart: 黒い
      Prijs: 料金
      negentig: '90'
      euro: ユーロ
      jas: コート
      past: 合う
      warm: 暖かい
  nl.a1.unit20.lesson06.teach.lotte_notice:
    title: Lotteがコートに目を留める
    gloss: 'Lotte：このコート、すてき！サイズは何？'
    note: '*Mooi*(すてき)は、これまでのユニットでも出てきた、ほめるときの一般的な言葉です。'
  nl.a1.unit20.lesson06.teach.omar_ask_try:
    title: Omarが試着をお願いする
    gloss: 'Omar: Mサイズだよ。試着してもいい？'
    note: '*Mag ik ...?*(〜してもいいですか)は、許可を求める標準的な丁寧な言い方です。ここでの *passen* は「合う」ではなく「試着する」の意味です。'
  nl.a1.unit20.lesson06.teach.lotte_ask_fit:
    title: Lotteが着心地を尋ねる
    gloss: 'Lotte：もちろん。サイズは合ってる？'
    note: '*Hij*(彼/それ)は *de jas* を指しています。de jas は de を取る名詞(通性名詞)です。'
  nl.a1.unit20.lesson06.teach.omar_confirm_fit:
    title: Omarが答える
    gloss: 'Omar：うん、ちょうどいいし、暖かいよ。'
    note: レッスン5で読んだレシートの内容とまったく同じで、同じコートです。
  nl.a1.unit20.lesson06.teach.lotte_ask_color:
    title: Lotteが色を尋ねる
    gloss: 'Lotte：いいね！黒と青、どっちにする？'
    note: '*Wil je... of...?* は、ユニット13の好みのレッスンで出てきた、選択肢を示して尋ねる型をもう一度使っています。'
  nl.a1.unit20.lesson06.teach.omar_choose_black:
    title: Omarが決める
    gloss: 'Omar：黒にするよ。'
    note: '*Nemen*(取る)は、買うものを最終的に決めるときの自然な動詞で、レシートに書かれた色とも合っています。'
  nl.a1.unit20.lesson06.teach.neemt_form:
    title: Neem と neemt
    gloss: Neem は nemen(取る)の「私」の形で、neemt は「彼/彼女」の形です。
    note: 規則的な現在形の型です：*ik neem, jij/hij/zij neemt*。
