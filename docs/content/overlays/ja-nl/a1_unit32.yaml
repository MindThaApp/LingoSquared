  nl.a1.unit32.lesson04.teach.hardlopen_note:
    title: hardlopen も分離動詞
    gloss: Hardlopen は分離動詞です。uitlaten、opstaan、aankleden と同じです：ik loop hard、hij loopt hard。
    note: 普通の文では動詞が分かれます。*loop* は2番目の位置に置かれ、*hard* は文末に移ります。日課やペットのレッスンで学んだ分離動詞と同じです。
