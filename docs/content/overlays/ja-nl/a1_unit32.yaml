    title: Zullen we ...?
    gloss: Zullen we ...? は、一緒に何かをしようと提案するときの表現で、前のレッスンで学びました。
    note: 予定についての課で学んだ、何かを一緒にしようと提案する構文をそのまま使っています。
  nl.a1.unit32.lesson06.teach.fenna_ja_leuk:
