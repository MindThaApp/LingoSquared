    title: 私はサッカーをします
    gloss: 私はサッカーをします。
    note: 直訳は「私はサッカーにおいて行う」。doen aan +スポーツは一般的な言い方です。文法ノートを見てください。
  nl.a1.unit32.lesson01.teach.doen_aan_note:
    title: Doen aan + sport
    gloss: doen aan +スポーツは、どのスポーツにも使えて「何のスポーツをしているか」を言う一般的な表現です：doen aan voetbal、doen aan yoga、doen aan hardlopen、doen aan zwemmen。
    note: この段階では、スポーツごとに別の動詞を覚える必要はありません。一つの構文で、どのスポーツも言い表せます。
  nl.a1.unit32.lesson02.teach.keer_per_week:
    title: 週に～回
    gloss: 週に～回
    example_gloss: 私は週に2回ヨガをします。
  nl.a1.unit32.lesson02.teach.frequency_note:
    title: keer per week と elke dag/vaak
    gloss: elke dag(毎日)と vaak(よく)はもう知っていますね。Twee keer per week(週に2回)は、頻度をより具体的に言う新しい表現です。
    note: 趣味の単元ですでに学んだ頻度の表現をさらに広げます。
  nl.a1.unit32.lesson02.teach.lotte_yoga_freq:
    title: 私は週に2回ヨガをします
    gloss: 私は週に2回ヨガをします。
  nl.a1.unit32.lesson02.teach.omar_voetbal_vaak:
    title: オマルはよくサッカーをする
    gloss: オマルはよくサッカーをします。
    note: 前のユニットで日課のときに学んだ *vaak*(よく)を再び使っています。
  nl.a1.unit32.lesson03.teach.sporten_note:
    title: sporten と doen aan +スポーツ
    gloss: sporten は趣味のレッスンですでに出てきました(Ik sport op zaterdag ――私は土曜日に運動します)。Doen aan +スポーツは具体的なスポーツ名を挙げる言い方です：Ik doe aan voetbal。どちらも正しいオランダ語です。
    note: Sporten はユニット29の趣味の動詞で既習です。新しい doen aan +スポーツの形と比べてみましょう。一方は一般的な、もう一方は具体的な運動の話し方です。
