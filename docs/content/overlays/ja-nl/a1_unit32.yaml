  nl.a1.unit32.lesson05.teach.tekst:
    title: ロッテとフェナのスポーツの話
    gloss: ロッテは週に2回ヨガをしています。ゆったり体を動かすのが好きです。フェナはヨガはしませんが、水泳が大好きです。フェナはよく泳ぎ、ほぼ毎週泳いでいます。あなたはどんなスポーツをしていますか？
    note: 2つの異なるスポーツと2つの異なる頻度の表現を対比しています。ユニット31の動物比較の読み物と同じ構成です。
    glosses:
      doet: する
      twee: '2'
      keer: 回
      week: 週
      yoga: ヨガ
      houdt: 大好きである
      rustig: 穏やかに
      bewegen: 動く
      zwemmen: 泳ぐこと
      zwemt: 泳ぐ
      vaak: よく
      bijna: ほとんど
      Welke: どの
      sport: スポーツ
