teaching:
  nl.a1.unit17.lesson01.teach.wat_doe_je:
    title: 相手の仕事をたずねる
    gloss: 仕事は何をしていますか？
    note: 職業をたずねるときの、標準的でくだけた言い方です。
  nl.a1.unit17.lesson01.teach.beroep_kok:
    title: 職業/料理人
    gloss: 職業；料理人
    note: '*Het beroep*(職業)は中性名詞です。*Kok*(料理人)は性別を問わず使える職業名で、*een kok*、*de kok*のように言います。'
    example_gloss:
    - あなたの仕事は何ですか？
    - 私は料理人として働いています。
  nl.a1.unit17.lesson01.teach.werk_als_kok:
    title: 料理人だと言う
    gloss: 私は料理人として働いています。
    note: 仕事を言うときは「*werken als* + 職業」が基本の形で、職業を表す名詞の前に冠詞は付けません。
  nl.a1.unit17.lesson01.teach.verpleegkundige:
    title: 看護師
    gloss: 看護師
    note: この職業を表す現代的な語で、性別を問わず使われます。
    example_gloss: 私は看護師として働いています。
  nl.a1.unit17.lesson01.teach.werk_als_verpleegkundige:
    title: 看護師だと言う
    gloss: 私は看護師として働いています。
    note: '*kok*の場合と同じ*werken als*の形です。'
  nl.a1.unit17.lesson02.teach.waar_werk_je:
    title: 職場をたずねる
    gloss: どこで働いていますか？
    note: '*Wat doe je voor werk?*に続けてよく使う質問です。'
  nl.a1.unit17.lesson02.teach.werk_restaurant:
    title: レストランで働いていると言う
    gloss: 私はレストランで働いています。
    note: たくさんあるレストランの中の一つなので、*een restaurant*のように不定冠詞を使います。
  nl.a1.unit17.lesson02.teach.ziekenhuis:
    title: 病院
    gloss: 病院
    note: 中性名詞なので、*het ziekenhuis*となります。
    example_gloss: 私は病院で働いています。
  nl.a1.unit17.lesson02.teach.werk_ziekenhuis:
    title: 病院で働く
    gloss: 私は病院で働いています。
    note: '*Het ziekenhuis*には定冠詞が付きます。特定の、お互いに分かっている施設として扱われるためです。'
  nl.a1.unit17.lesson02.teach.kantoor:
    title: オフィスで働く
    gloss: オフィスで働く人もいます。
    note: '*Op kantoor*(職場で)は冠詞を付けない決まった表現で、*in een restaurant*や*in het ziekenhuis*とは異なります。'
  nl.a1.unit17.lesson03.teach.begin_negen:
    title: 始業時間
    gloss: 私は9時に始めます。
    note: '*Begin*は*beginnen*(始める)のikに対する形で、ユニット4の時刻の言い方を使っています。'
  nl.a1.unit17.lesson03.teach.maandag_vrijdag:
    title: 勤務日
    gloss: 私は月曜日から金曜日まで働いています。
    note: '*Van... tot...*は、ユニット3で学んだ曜日の範囲の言い方を使っています。'
  nl.a1.unit17.lesson03.teach.pauze:
    title: 休憩
    gloss: 休憩
    note: 通性名詞なので、*de pauze*となります。
    example_gloss: 12時に休憩があります。
  nl.a1.unit17.lesson03.teach.heb_pauze:
    title: 休憩を取る
    gloss: 12時に休憩があります。
    note: '*Pauze hebben*(休憩を取る)は自然な決まった言い方です。'
  nl.a1.unit17.lesson03.teach.stop_vijf:
    title: 終業時間
    gloss: 私は5時に終わります。
    note: '*Stop*は*stoppen*(やめる、終える)のikに対する形です。'
  nl.a1.unit17.lesson03.teach.begin_en_stop:
    title: 一日の仕事
    gloss: 私は9時に始めて、5時に終わります。
    note: '*begin*と*stop*を*en*でつないで、1日の仕事を1つの文で表しています。'
  nl.a1.unit17.lesson04.teach.third_person_rule:
    title: 三人称の動詞の語尾
    gloss: 彼や彼女が主語のとき、動詞には通常-tが付きます：彼は働く、彼女は働く。
    note: '*Werk*は、*hij*や*zij*のとき*werkt*になります。オランダ語の規則的な現在形の三人称の形です。'
  nl.a1.unit17.lesson04.teach.lotte_werkt:
    title: ロッテの仕事
    gloss: ロッテは看護師として働いています。
    note: 主語が*ik*ではなく三人称の名前なので、*werk*ではなく*werkt*になります。
  nl.a1.unit17.lesson04.teach.omar_werkt:
    title: オマルの仕事
    gloss: オマルは料理人として働いています。
    note: '*Lotte werkt als verpleegkundige*と同じ、三人称の-tの語尾です。'
  nl.a1.unit17.lesson04.teach.pronouns_workplaces:
    title: 代名詞を使う
    gloss: 彼女は病院で働いています。彼はレストランで働いています。
    note: '*Zij*と*hij*はロッテとオマルの名前の代わりですが、動詞は同じ三人称の-tの形のままです。'
  nl.a1.unit17.lesson05.teach.profiel:
    title: 二人の仕事のプロフィールを読む
    gloss: ロッテは病院で看護師として働いています。7時に始まり、月曜日から金曜日まで働きます。オマルはレストランで料理人として働いています。11時に始まり、4時に休憩があります。
    note: それぞれの人の仕事、職場、勤務時間を分けて確認しましょう。
    glosses:
      werkt: 働いています
      verpleegkundige: 看護師
      ziekenhuis: 病院
      begint: 始まり
      zeven: '7'
      maandag: 月曜日
      vrijdag: 金曜日
      kok: 料理人
      restaurant: レストラン
      elf: '11'
      pauze: 休憩
  nl.a1.unit17.lesson06.teach.lotte_curious:
    title: ロッテが仕事について尋ねる
    gloss: ロッテ：こんにちは、オマル！気になっていたんだけど、ところでどんな仕事をしているの？
    note: '*Eigenlijk*(ところで、実は)を入れると、問い詰めるのではなく、親しみのある好奇心を込めた質問になります。'
  nl.a1.unit17.lesson06.teach.omar_answer:
    title: オマルが答える
    gloss: オマル：レストランで料理人として働いているよ。あなたは？
    note: '*En jij?*は、同じ質問を相手に返すときの決まった言い方です。'
  nl.a1.unit17.lesson06.teach.lotte_answer:
    title: ロッテが答える
    gloss: ロッテ：病院で看護師として働いているの。
    note: これまでの課で出てきた、カミーユの職業と職場と同じです。
  nl.a1.unit17.lesson06.teach.omar_ask_hours:
    title: オマルが勤務時間について尋ねる
    gloss: オマル：勤務時間はどんな感じ？
    note: '*Uren maken*(直訳：時間を作る)は、勤務時間を説明するときの決まった言い回しです。'
  nl.a1.unit17.lesson06.teach.lotte_hours:
    title: ロッテが勤務時間を話す
    gloss: ロッテ：7時に始めて、月曜日から金曜日まで働いているわ。
    note: これまでの読み物のプロフィールで出てきた勤務時間と同じです。
  nl.a1.unit17.lesson06.teach.omar_reaction:
    title: オマルの反応
    gloss: オマル：早いね！僕はもっと遅くて、11時に始めるよ。
    note: すでに前のレッスンで出てきたオマルの始業時間と同じです。
  nl.a1.unit17.lesson06.teach.lotte_closing:
    title: ロッテが話をまとめる
    gloss: ロッテ：仕事にはそれぞれ自分のリズムがあるのよね。
    note: 自然で考えさせる締めくくりの一言です。意味が分かれば十分で、そのまま言えるようにする必要はありません。
