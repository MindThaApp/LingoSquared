  nl.a1.unit11.lesson03.teach.half_three_review:
    title: half drie は2時半
    gloss: half drie ＝ 2時半。om half drie は約束の時刻を表します。
    note: オランダ語は次の時間に向かって数えます。*half drie* は3時の半分手前、つまり2時半です。
