teaching:
  nl.a1.unit11.lesson01.teach.samen:
    title: いっしょに
    gloss: いっしょに
    note: '*Samen* は、人々がその活動を一緒にすることをはっきり示します。'
    example_gloss: いっしょにコーヒーを飲みましょうか。
  nl.a1.unit11.lesson01.teach.koffie_drinken:
    title: コーヒーを飲む
    gloss: コーヒーを飲む
    note: オランダ語では *koffie drinken*、つまり「コーヒーを飲む」と言います。
  nl.a1.unit11.lesson01.teach.naar_de_film:
    title: 映画を見に行く
    gloss: 映画を見に行く
    note: '*Naar de film gaan* は、新しい場所の言葉を出さずに映画に行くことを表す、よく使われる言い方です。'
  nl.a1.unit11.lesson01.teach.zullen_we:
    title: コーヒーを飲みましょうか。
    gloss: コーヒーを飲みましょうか。
    note: '*Zullen we ...?* は、一緒にする活動を提案するときの標準的なオランダ語の型です。'
  nl.a1.unit11.lesson01.teach.zullen_note:
    title: Zullen we の使い方
    gloss: Zullen we + 活動？は、何かを一緒にしようと提案するときの普通の言い方です。
    note: '*we* のあとに活動を置き、動詞は最後に置きます。*Zullen we koffie drinken?*'
  nl.a1.unit11.lesson01.teach.zin_om:
    title: 映画を見に行きたい気分ですか。
    gloss: 映画を見に行きたい気分ですか。
    note: '*Heb je zin om ...?* は、相手がその活動をしたい気分かどうかを気軽にたずねる表現です。ここでは *gaan* の前に *te* を使います。'
  nl.a1.unit11.lesson02.teach.ja_leuk:
    title: うん、いいね！
    gloss: うん、いいね！
    note: '*Ja, leuk!* は、短く元気に受ける返事です。'
  nl.a1.unit11.lesson02.teach.goed_idee:
    title: いい考え
    gloss: いい考えだね！
    note: '*Goed idee!* は、提案を良いと評価して受ける返事です。'
  nl.a1.unit11.lesson02.teach.goed_plan:
    title: それはいい計画だ
    gloss: それはいい計画ですね。
    note: これは、もう少し丁寧に前向きな気持ちを伝える返事です。
  nl.a1.unit11.lesson02.teach.sorry_reason:
    title: 理由を添えて断る
    gloss: ごめんなさい、仕事をしているので行けません。
    note: '*Sorry* で断りをやわらげ、*want* で短い理由を続けます。'
  nl.a1.unit11.lesson02.teach.no_time:
    title: 時間がない
    gloss: 時間がありません。
    note: '*Ik heb geen tijd* は、率直ですが普通の断る理由です。'
  nl.a1.unit11.lesson02.teach.polite_decline:
    title: 感じのよい断り方
    gloss: Sorry + 行けません + 短い理由で、感じのよい断り方になります。
    note: 会話では理由は省いてもかまいませんが、添えるとこの型が使いやすく、丁寧になります。
  nl.a1.unit11.lesson03.teach.afspreken:
    title: 会う約束をする
    gloss: 会う約束をする
    note: '*Zullen we* のあとでは、*afspreken* は1語で書きます。*We spreken vrijdag af* では *spreken* と *af* に分かれます。'
