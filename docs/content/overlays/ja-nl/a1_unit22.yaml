teaching:
  nl.a1.unit22.lesson01.teach.bellen:
    title: 電話する
    gloss: 電話する
    note: 電話をかけることを表す動詞の不定詞です。
    example_gloss: あなたに電話しなければなりません。
  nl.a1.unit22.lesson01.teach.ik_bel_je:
    title: 電話すると伝える
    gloss: あなたに電話します。
    note: '*Bel* は *bellen* の ik の形です。オランダ語ではここで現在形を使い、「これから電話する」という未来の意味を表します。'
  nl.a1.unit22.lesson01.teach.met_lotte:
    title: 電話に出る
    gloss: もしもし、ロッテです。
    note: '*Met* +名前(直訳は「名前と」)は、オランダ語で電話に出たときに名乗る標準的な言い方です。'
  nl.a1.unit22.lesson01.teach.met_omar:
    title: オマルも同じように名乗る
    gloss: もしもし、オマルです。
    note: '*Hallo, met Lotte* と同じ、*met* +名前の型です。'
  nl.a1.unit22.lesson02.teach.met_wie:
    title: 誰からの電話か尋ねる
    gloss: どちら様ですか？
    note: '*Met wie spreek ik?* は、知らない相手からの電話で使う標準的な丁寧な言い方です。'
  nl.a1.unit22.lesson02.teach.u_spreekt_met:
    title: 丁寧に名乗る
    gloss: ロッテと話しています。
    note: '*U spreekt met* +名前は、くだけた *met* +名前に対する丁寧な言い方です。'
  nl.a1.unit22.lesson03.teach.kun_je_herhalen:
    title: もう一度言ってもらう
    gloss: それをもう一度言ってもらえますか？
    note: '*Kun je* ...?(~できますか？)+ *herhalen*(繰り返す)+ *dat*(それ)。'
  nl.a1.unit22.lesson03.teach.spreek_niet_snel:
    title: ゆっくり話してもらう
    gloss: そんなに速く話さないでください。
    note: '*Niet zo* +形容詞は、動詞ではなく程度を否定します。「そんなに速くない」であり、「話さないで」ではありません。'
  nl.a1.unit22.lesson03.teach.hoor_niet_goed:
    title: よく聞こえないと伝える
    gloss: よく聞こえません。
    note: '*Horen*(聞こえる)に *niet goed*(よく~ない)を添えると、聞こえにくいことを表します。*verstaan*(理解する)とは別です。'
  nl.a1.unit22.lesson04.teach.sms:
    title: メッセージ
    gloss: メッセージ
    note: 通称の名詞で、*de sms* と言います。国際的な略語をそのまま借りた語です。
    example_gloss: ロッテからのメッセージです。
  nl.a1.unit22.lesson04.teach.stuur_sms:
    title: メッセージを送ると伝える
    gloss: あなたにメッセージを送ります。
    note: '*Sturen*(送る)は、直接目的語(*een sms*)の前に間接目的語(*je*)を置きます。'
  nl.a1.unit22.lesson04.teach.bel_later_terug:
    title: かけ直すと伝える
    gloss: 後でかけ直します。
    note: '*Terug*(戻して)は、文末に置く分離動詞の前つづりの型をまた使っています。*bellen* + *terug* で「かけ直す」の意味になります。'
  nl.a1.unit22.lesson05.teach.sms_gesprek:
    title: メッセージのやり取りを読む
    gloss: オマル：やあロッテ、電話してくれる？伝えたいことがあるんだ。ロッテ：うん、もちろん。5分後にかけ直すね。
    note: オマルが何を頼んでいるか、その理由、ロッテがいつかけ直すと言っているかを読み取りましょう。
    glosses:
      Hoi: やあ
      kun: できる
      bellen: 電話する
      moet: ~しなければならない
      iets: 何か
      vertellen: 伝える
      natuurlijk: もちろん
      bel: 電話する
      vijf: '5'
      minuten: 分
      terug: 折り返す
  nl.a1.unit22.lesson06.teach.lotte_open_call:
    title: オマルが電話に出る
    gloss: オマル：もしもし、オマルです。
    note: 前のレッスンで学んだ *met* +名前の型を、実際の電話で使っています。電話に出た人が先に話し、名前を名乗ります。
  nl.a1.unit22.lesson06.teach.omar_answer_glad:
    title: ロッテが名乗る
    gloss: ロッテ：やあオマル、ロッテだよ。オマル：電話してくれて嬉しいよ！
    note: '*Fijn dat* ...(~で嬉しい)は、出来事に対する前向きな反応を表します。'
  nl.a1.unit22.lesson06.teach.lotte_ask_shift:
    title: ロッテが勤務について尋ねる
    gloss: ロッテ：初めてのシフトはどうでしたか？
    note: '*Was* は *zijn* の単純過去形です。第12課で学んだ完了形(hebben/zijn+過去分詞、例：*Ik heb gewerkt*)とは別の形です。次の行のあとの説明も見てください。'
  nl.a1.unit22.lesson06.teach.omar_report_good:
    title: オマルがうれしい報告をする
    gloss: オマル：とてもうまくいきました。思っていたよりよかったです。
    note: '*Ging* は *gaan*(行く。ここでは「事が運ぶ」の意味)の単純過去形で、*dacht* は *denken*(考える)の単純過去形です。'
  nl.a1.unit22.lesson06.teach.simple_past_note:
    title: Was、ging、dacht は単純過去形
    gloss: was → ~である・いる、ging → 行く、dacht → 考える
    note: '*Was*、*ging*、*dacht* は不規則な単純過去(verleden tijd)の形で、第12課の完了形(hebben/zijn+過去分詞)とは別のパターンです。まだ正式には学びません。今は、この課に出てくる場面で was/ging/dacht を決まった表現として覚えてください。単純過去の活用の規則は、のちのレベルで学びます。'
  nl.a1.unit22.lesson06.teach.lotte_proud:
    title: ロッテが誇らしく思う
    gloss: ロッテ：それはうれしいね！あなたのことを誇りに思うよ。
    note: '*Trots op*(~を誇りに思う)は決まった組み合わせで、*van* ではなく *op* を使います。'
  nl.a1.unit22.lesson06.teach.omar_thanks_means:
    title: オマルが感激する
    gloss: オマル：ありがとう。そう言ってもらえて、すごくうれしいです。
    note: '*Betekent* は *betekenen*(意味する)の三人称の形です。*voor me*(私にとって)は、誰にとって大切かを表します。'
  nl.a1.unit22.lesson06.teach.zijn_possessive:
    title: 彼の
    gloss: 彼の初めてのシフトはとてもうまくいきました。
    note: ここでの *Zijn* は動詞「である」ではなく、「彼の」という所有を表す語です。形は同じでも、文脈で見分けます。
