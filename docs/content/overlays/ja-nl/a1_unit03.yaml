    gloss: 5–8:5番目、6番目、7番目、8番目
    note: 日付に使うこれらの形は vijfde、zesde、zevende、achtste です。
    example_gloss:
    - 4月5日です。
    - 4月6日です。
    - 4月7日です。
    - 2026年4月8日です。
  nl.a1.unit03.lesson03.teach.ninth_twelfth:
    title: 9番目から12番目まで
    gloss: 9–12:9番目、10番目、11番目、12番目
    note: これらの形は、このユニットの後半で使う月初めの日付に当たります。
    example_gloss:
    - 4月9日です。
    - 4月10日です。
    - 4月11日です。
    - 4月12日です。
  nl.a1.unit03.lesson03.teach.thirteenth_nineteenth:
    title: 13番目から19番目まで
    gloss: 13–19:13番目、14番目、15番目、16番目、17番目、18番目、19番目
    note: これらの綴りで書く日の序数は -de で終わります。
    example_gloss:
    - 4月13日です。
    - 4月14日です。
    - 4月15日です。
    - 4月16日です。
    - 4月17日です。
    - 4月18日です。
    - 4月19日です。
  nl.a1.unit03.lesson03.teach.twentieth_twenty_fourth:
