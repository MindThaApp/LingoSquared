  nl.a1.unit03.lesson06.teach.dialogue_date:
    title: ロッテが日付をたずねる
    gloss: ロッテ:今日は何日ですか。 オマル:2026年4月8日です。
    note: オランダ語の話し言葉では、日にちに序数 de achtste を使います。2026年の4月8日は確かに水曜日で、前のやりとりと合っています。
  nl.a1.unit03.lesson06.teach.next:
    title: 次の
    gloss: 次の
