    gloss: 1月、2月、3月
    note: オランダ語の月の名前は、普通、小文字で始まります。
    example_gloss:
    - 私の誕生日は1月です。
    - 私は2月にオランダ語を勉強します。
    - 私の誕生日は3月です。
  nl.a1.unit03.lesson02.teach.apr_jun:
    title: 4月から6月まで
    gloss: 4月、5月、6月
