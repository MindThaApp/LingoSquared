    note: 答えは、op、小文字の曜日、日にち、小文字の月名の順に組み合わせます。2026年の4月10日は確かに金曜日で、8日の2日後です。
  nl.a1.unit03.lesson06.teach.dialogue_close:
    title: 会話を終える
    gloss: ロッテ:よかった、じゃあ金曜日に! オマル:その時にね!
    note: Tot vrijdag は、次に会う日の曜日を示します。
