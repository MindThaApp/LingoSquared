    gloss: 10月、11月、12月
    note: オランダ語の oktober は k を使って綴ります。
    example_gloss:
    - 私は10月にオランダ語を勉強します。
    - 私の誕生日は11月です。
    - 私は12月にオランダ語を勉強します。
