course:
  title: オランダ語 A1
  description: オランダでの自然な挨拶、自己紹介、初対面の会話のための初級オランダ語です。
units:
  nl.a1.unit01.greetings_and_introductions:
    title: あいさつと初対面
lessons:
  nl.a1.unit01.lesson01.jij_je_en_u:
    title: 親しい間柄の jij/je と丁寧な u
  nl.a1.unit01.lesson02.groeten_en_welzijn:
    title: 挨拶と調子のたずね方
  nl.a1.unit01.lesson03.namen:
    title: 名前を伝え合う
  nl.a1.unit01.lesson04.herkomst_en_taal:
    title: 出身と言語
  nl.a1.unit01.lesson05.taalcafe:
    title: 言語カフェで人と出会う
  nl.a1.unit01.lesson06.eerste_ontmoeting:
    title: 初対面の会話を締めくくる
teaching:
  nl.a1.unit01.lesson01.teach.hallo_hoi:
    title: こんにちは(Hallo と Hoi)
    gloss: こんにちは
    note: '*Hallo* は中立的で、くだけた場面でも改まった場面でも使えます。*Hoi* はよく使われるくだけた挨拶です。'
    example_gloss:
    - こんにちは、ここは初めてですか？
    - こんにちは、ノールです。
  nl.a1.unit01.lesson01.teach.jij_je_u:
    title: 「あなた」:くだけた形と丁寧な形
    gloss: あなた(くだけた形・強調)/あなた(くだけた形・弱形)/あなた(丁寧な形)
    note: '*Jij* はくだけた単数の形で、強調や対比のときに使います。*Je* は日常会話で強調しないときに使う、ふつうのくだけた単数形です。*U* は敬意や距離を示します。オランダでは、年配の初対面の人や明らかに改まった関係では自然ですが、お店や職場など、大人同士でも jij/je を使う場面が多くあります。'
    example_gloss:
    - ここは初めてですか？(くだけた形・強調)
    - ここは初めてですよね。(くだけた形・弱形)
    - ここは初めてですか？(丁寧な形)
  nl.a1.unit01.lesson01.teach.informal_new:
    title: 同じ立場の人に、初めてかたずねる
    gloss: ここは初めてですか？
    note: 疑問文では *jij bent* が *ben jij* になります。*jij* が動詞の後ろに来ると、語尾の -t がなくなります。
  nl.a1.unit01.lesson01.teach.formal_new:
    title: 丁寧に、初めてかたずねる
    gloss: ここは初めてですか？
    note: '*u* のときは *bent u* を使います。-t は残ります。'
  nl.a1.unit01.lesson01.teach.register_rule:
    title: 「あなた」の形の選び方
    gloss: jij/je：くだけた形 · u：丁寧・改まった形
    note: 友人、同年代の人、子どもには *jij/je* を使い、現代の気楽な場面でも多くはこれを使います。敬意や距離が求められる関係では *u* を使います。好みは人によって違うので、相手に合わせましょう。
  nl.a1.unit01.lesson02.teach.goedemorgen_tot_goedenavond:
    title: 朝・昼・晩の挨拶
    gloss: おはようございます/こんにちは(午後)/こんばんは
    note: '*Goedemorgen* は朝、おおよそ正午まで使います。*Goedemiddag* は正午ごろから午後にかけて使います。*Goedenavond* は夕方から夜の挨拶です。'
    example_gloss:
    - おはようございます！お元気ですか？
    - こんにちは、お元気ですか？(丁寧な形)
    - こんばんは！ここは初めてですか？
  nl.a1.unit01.lesson02.teach.hoe_gaat_het:
    title: 調子はどう？
    gloss: お元気ですか。
    note: '*Hoe gaat het?* は、相手の調子をたずねる一般的で中立的な言い方です。'
  nl.a1.unit01.lesson02.teach.hoe_gaat_met_je:
    title: お元気ですか？(くだけた形)
    gloss: お元気ですか。
    note: '*Met je* は、話しかける相手をはっきり示す、くだけた言い方です。'
  nl.a1.unit01.lesson02.teach.hoe_gaat_met_u:
    title: お元気ですか？(丁寧な形)
    gloss: お元気ですか。
    note: 改まった場面では *met u* を使います。
  nl.a1.unit01.lesson02.teach.goed_dank_je:
    title: 元気です、ありがとう(くだけた形)
    gloss: 元気です、ありがとう。
    note: '*Dank je* はくだけた呼びかけに合う形です。'
  nl.a1.unit01.lesson02.teach.goed_dank_u:
    title: 元気です、ありがとうございます(丁寧な形)
    gloss: 元気です、ありがとう。
    note: '*Dank u* は丁寧な呼びかけに合う形です。'
  nl.a1.unit01.lesson02.teach.prima:
    title: いいですね
    gloss: いいね/元気
    note: '*Prima* は短くて前向きな返事です。'
    example_gloss: いいですよ、ありがとう。
  nl.a1.unit01.lesson02.teach.niet_slecht:
    title: 悪くないです
    gloss: 悪くない
    note: '*Niet slecht* は、たいてい少し前向きな返事です。'
  nl.a1.unit01.lesson02.teach.en_met_jou:
    title: あなたは？(くだけた形)
    gloss: あなたは？
    note: '*Jou* は *met* の後ろで使う、強調のくだけた形です。'
  nl.a1.unit01.lesson02.teach.en_met_u:
    title: あなたは？(丁寧な形)
    gloss: あなたは？
    note: '*U* を使うと、聞き返す質問も丁寧になります。'
  nl.a1.unit01.lesson03.teach.hoe_heet_je:
    title: 親しい相手に名前をたずねる
    gloss: お名前は何ですか。
    note: '*Hoe heet je?* は、名前をたずねる普通のくだけた言い方です。'
  nl.a1.unit01.lesson03.teach.hoe_heet_u:
    title: 丁寧に名前をたずねる
    gloss: お名前は何ですか。
    note: '*Hoe heet u?* は丁寧な言い方です。ここでは扱いませんが、*Wat is uw naam?* というもっと事務的な響きの丁寧な言い方もあります。'
  nl.a1.unit01.lesson03.teach.ik_heet_noor:
    title: 自分の名前を言う
    gloss: 私の名前はノールです。
    note: '*Ik heet ...* は、名前を伝える直接的で標準的な言い方です。'
  nl.a1.unit01.lesson03.teach.ik_ben_noor:
    title: 自然に自己紹介する
    gloss: ノールです。
    note: '*Ik ben ...* は、話し言葉の自己紹介で特によく使われます。'
  nl.a1.unit01.lesson03.teach.mijn_naam:
    title: 私の名前は…です
    gloss: 私の名前はノールです。
    note: '*Mijn naam is ...* は正しい言い方ですが、*Ik ben ...* や *Ik heet ...* よりやや改まった印象です。'
  nl.a1.unit01.lesson03.teach.leuk_ontmoeten:
    title: お会いできてうれしいです
    gloss: はじめまして。
    note: 初対面でも親しみがあり、自然な言い方です。
  nl.a1.unit01.lesson03.teach.aangenaam:
    title: はじめまして
    gloss: はじめまして
    note: '*Aangenaam* は決まり文句で、*Leuk je te ontmoeten* より改まっています。'
    example_gloss: はじめまして！ノールです。
  nl.a1.unit01.lesson04.teach.where_from_informal:
    title: 出身をたずねる
    gloss: どちらのご出身ですか。
    note: '*Kom je* はくだけた疑問文の形です。'
  nl.a1.unit01.lesson04.teach.where_from_formal:
    title: 丁寧に出身をたずねる
    gloss: どちらのご出身ですか。
    note: '*u* のときは動詞が *komt* になります：*Waar komt u vandaan?*'
  nl.a1.unit01.lesson04.teach.from_netherlands:
    title: オランダ出身
    gloss: オランダから来ました。
    note: 出身の国の前では *uit* を使います。
  nl.a1.unit01.lesson04.teach.from_belgium:
    title: ベルギー出身
    gloss: ベルギーから来ました。
    note: '*België* は2つ目の e にトレマ(¨)が付きます。'
  nl.a1.unit01.lesson04.teach.from_germany:
    title: ドイツ出身
    gloss: 私はドイツ出身です。
    note: '*Duitsland* は国の名前で、*Duits* は言語の名前です。'
  nl.a1.unit01.lesson04.teach.dutch_nationality:
    title: オランダ人であること
    gloss: 私はオランダ人です。
    note: '*Nederlands* は、国籍にもオランダ語という言語にも使えます。日本語の「オランダ人」と「オランダ語」のように語が分かれていません。'
  nl.a1.unit01.lesson04.teach.belgian_nationality:
    title: ベルギー人であること
    gloss: 私はベルギー人です。
    note: ここでは *Belgisch* はベルギーの国籍を表します。
  nl.a1.unit01.lesson04.teach.speak_dutch:
    title: オランダ語を話す
    gloss: 私はオランダ語を話します。
    note: オランダ語では、言語名は大文字で書き始めます。
  nl.a1.unit01.lesson04.teach.speak_english:
    title: 英語を話す
    gloss: 私は英語を話します。
    note: '*Engels* は英語を表すオランダ語です。'
  nl.a1.unit01.lesson04.teach.speak_german:
    title: ドイツ語を話す
    gloss: 私はドイツ語を話します。
    note: '*Duits* はドイツ語を表すオランダ語です。'
  nl.a1.unit01.lesson05.teach.taalcafe_bibliotheek:
    title: 言語カフェと図書館
    gloss: 言語カフェ/図書館
    note: '*taalcafé* は、ほかの人とオランダ語を気軽に練習する集まりです。オランダの公共図書館では、言語カフェなど地域の催しがよく開かれます。'
    example_gloss:
    - 言語カフェに来ました。
    - 図書館でオランダ語を勉強しています。
  nl.a1.unit01.lesson05.teach.location:
    title: 集合場所
    gloss: 言語カフェは図書館で開かれます。
    note: この場面の舞台を示す文です。
  nl.a1.unit01.lesson05.teach.here_for:
    title: 同じ目的か確かめる
    gloss: 言語カフェに来たんですか？
    note: 同じ活動に来た二人が話しかけるときの、自然でくだけた切り出し方です。
  nl.a1.unit01.lesson05.teach.yes_here_for:
    title: 目的を答える
    gloss: はい、言語カフェに来ました。
    note: 答えでは、目的をはっきり繰り返しています。
  nl.a1.unit01.lesson05.teach.learning:
    title: 何を学んでいるか伝える
    gloss: オランダ語を勉強しています。
    note: '*Leer* は *leren*(学ぶ)の一人称の形です。'
  nl.a1.unit01.lesson05.teach.me_too:
    title: 私もです
    gloss: 私もです。
    note: '*Ik ook* は、共通点を伝える短くて自然な言い方です。'
  nl.a1.unit01.lesson05.teach.first_time:
    title: 初めてかどうかたずねる
    gloss: 今回が初めてですか？
    note: 定期的な活動での、親しみのある世間話です。
  nl.a1.unit01.lesson05.teach.first_time_answer:
    title: 初めてだと伝える
    gloss: はい、これが初めてです。
    note: '*Mijn* は「私の」という意味です。'
  nl.a1.unit01.lesson06.teach.lotte_opening:
    title: ロッテが会話を始める
    gloss: ロッテ：こんにちは、ロッテです。お名前は？
    note: ロッテは、このくだけた集まりなので親しい形の *je* を使っています。
  nl.a1.unit01.lesson06.teach.omar_name:
    title: オマールが名前を言う
    gloss: オマール：オマールです。はじめまして。
    note: 名前の質問に答え、出会えたことにも触れています。
  nl.a1.unit01.lesson06.teach.lotte_origin_question:
    title: ロッテが出身を尋ねる
    gloss: ロッテ：こちらこそ！どこの出身ですか？
    note: '*Jou ook!* は *Leuk je te ontmoeten* に対する自然な短い返事です。'
  nl.a1.unit01.lesson06.teach.omar_origin:
    title: オマールが出身を答える
    gloss: オマール：エジプトです。あなたは？
    note: '*En jij?* は同じ質問をくだけた言い方で相手に返す表現です。'
  nl.a1.unit01.lesson06.teach.lotte_context:
    title: ロッテが雑談を続ける
    gloss: ロッテ：私はオランダ出身です。言語カフェに来るのは初めてですか？
    note: '*Bij het taalcafé* は、活動としての言語カフェに「参加して」という意味です。'
  nl.a1.unit01.lesson06.teach.omar_language:
    title: オマールが答え、学んでいることを話す
    gloss: オマール：はい、これが初めてです。オランダ語を勉強しています。
    note: ロッテの質問に答えてから、基本的な自己紹介を一つ付け加えています。
  nl.a1.unit01.lesson06.teach.tot_ziens:
    title: さようなら
    gloss: さようなら！
    note: '*Tot ziens* は、場面を選ばず使える別れのあいさつです。'
  nl.a1.unit01.lesson06.teach.closing:
    title: 自然な締めくくり
    gloss: ロッテ：よかった！また来週。 オマール：また来週！
    note: 二人とも次回も来る予定のときは、*Tot volgende week* を繰り返すのが自然です。
exercises:
  nl.a1.unit01.lesson01.exercise01.choose_informal:
    instruction: 親しい相手に使う「あなた」の単数形が二つ入っている選択肢はどれですか。
    correct_option: jij / je
    distractors:
    - u
    - jij / u
    - je / u
    accepted_answers:
    - value: jij / je
      status: correct
    feedback: Jij と je は親しい間柄で使う単数形で、u は改まった形です。
  nl.a1.unit01.lesson01.exercise02.choose_formal:
    instruction: 質問を完成させる、改まった「あなた」を選んでください。
    correct_option: u
    distractors:
    - jij
    - je
    - ik
    accepted_answers:
    - value: u
      status: correct
    feedback: Bent u nieuw hier? は改まった呼びかけの言い方です。
  nl.a1.unit01.lesson01.exercise03.listen_formal:
    instruction: 音声を聞いて、この質問に合う場面を選んでください。
    correct_option: 改まった相手に、ここは初めてかどうか尋ねている。
    distractors:
    - 同年代の相手に、ここは初めてかどうか尋ねている。
    - 改まった相手に、ここに住んでいるかどうか尋ねている。
    - 改まった相手に、ここの出身かどうか尋ねている。
    accepted_answers:
    - value: 改まった相手に、ここは初めてかどうか尋ねている。
      status: correct
    feedback: Bent u nieuw hier? は、改まった言い方として u と bent を使っています。
  nl.a1.unit01.lesson01.exercise04.match_register:
    instruction: それぞれのオランダ語の形を、合う丁寧さの度合いと組み合わせてください。
    accepted_answers:
    - value:
      - left: jij / je
        right: informeel
      - left: u
        right: formeel of beleefd
      status: correct
    feedback: Jij/je は親しい間柄で、u は改まった丁寧な形です。
    pairs:
    - left: jij / je
      right: informeel
    - left: u
      right: formeel of beleefd
  nl.a1.unit01.lesson01.exercise05.order_formal:
    instruction: 語を並べ替えて、改まった言い方で「ここは初めてですか？」と尋ねましょう。
    accepted_answers:
    - value:
      - Bent
      - u
      - nieuw
      - hier
      status: correct
    feedback: 改まった質問は Bent u nieuw hier? です。
  nl.a1.unit01.lesson01.exercise06.listen_order_informal:
    instruction: 音声を聞いて、親しい相手に向けた質問を正しい順に並べてください。
    accepted_answers:
    - value:
      - Ben
      - jij
      - nieuw
      - hier
      status: correct
    feedback: 音声は Ben jij nieuw hier? と言っています。
  nl.a1.unit01.lesson01.exercise07.complete_formal:
    instruction: 改まった質問を完成させてください。
    accepted_answers:
    - value: Bent
      status: correct
    - value: bent
      status: correct
    feedback: u には bent を使います：Bent u nieuw hier?
  nl.a1.unit01.lesson01.exercise08.listen_type_formal:
    instruction: 音声を聞いて、オランダ語の質問を全文入力してください。
    accepted_answers:
    - value: Bent u nieuw hier?
      status: correct
    - value: Bent u nieuw hier
      status: correct
    - value: bent u nieuw hier?
      status: correct
    - value: bent u nieuw hier
      status: correct
    feedback: 音声は Bent u nieuw hier? と言っています。
  nl.a1.unit01.lesson02.exercise01.choose_morning:
    instruction: 8時30分に合う、時間帯別のあいさつを選んでください。
    correct_option: Goedemorgen
    distractors:
    - Goedemiddag
    - Goedenavond
    - Hoi
    accepted_answers:
    - value: Goedemorgen
      status: correct
    feedback: Goedemorgen は朝に使う、時間帯別のあいさつです。
    prompt_blocks:
    - 08:30
  nl.a1.unit01.lesson02.exercise02.listen_evening:
    instruction: 音声を聞いて、日本語の意味を選んでください。
    correct_option: こんばんは
    distractors:
    - おはようございます
    - こんにちは
    - さようなら
    accepted_answers:
    - value: こんばんは
      status: correct
    feedback: Goedenavond は「こんばんは」という意味です。
  nl.a1.unit01.lesson02.exercise03.choose_formal_question:
    instruction: 年配のお客さんに話しかけていて、改まった呼びかけを選びます。どの質問が合いますか。
    correct_option: Hoe gaat het met u?
    distractors:
    - Hoe gaat het met je?
    - Hoe gaat het met jou?
    - Hoe gaat het met jij?
    accepted_answers:
    - value: Hoe gaat het met u?
      status: correct
    feedback: Met u を使うと、質問が改まった言い方になります。
  nl.a1.unit01.lesson02.exercise04.match_times:
    instruction: それぞれのあいさつを、ふさわしい時間帯と組み合わせてください。
    accepted_answers:
    - value:
      - left: Goedemorgen
        right: 08:30
      - left: Goedemiddag
        right: '14:00'
      - left: Goedenavond
        right: '20:00'
      status: correct
    feedback: 朝・午後・夜のあいさつは、時間帯によって使い分けます。
    pairs:
    - left: Goedemorgen
      right: 08:30
    - left: Goedemiddag
      right: '14:00'
    - left: Goedenavond
      right: '20:00'
  nl.a1.unit01.lesson02.exercise05.listen_order_formal:
    instruction: 音声を聞いて、改まった体調の質問を正しい順に並べてください。
    accepted_answers:
    - value:
      - Hoe
      - gaat
      - het
      - met
      - u
      status: correct
    feedback: 音声は Hoe gaat het met u? と言っています。
  nl.a1.unit01.lesson02.exercise06.reply_informal:
    instruction: くだけた言い方で自然に答え、同じ質問を相手に返してください。
    accepted_answers:
    - value: Goed, dank je. En met jou?
      status: correct
    - value: Prima, dank je. En met jou?
      status: correct
    - value: Niet slecht, dank je. En met jou?
      status: correct
    - value: Goed dank je, en met jou?
      status: correct
    - value: Goed. En met jou?
      status: correct
    - value: Prima. En met jou?
      status: correct
    - value: Niet slecht. En met jou?
      status: correct
    - value: Goed, dank je. En jij?
      status: correct
    - value: Prima, dank je. En jij?
      status: correct
    - value: Niet slecht, dank je. En jij?
