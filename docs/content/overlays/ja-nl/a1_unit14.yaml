teaching:
  nl.a1.unit14.lesson01.teach.comparative_rule:
    title: 比較級の作り方
    gloss: 比較では、形容詞に -er を付け、dan を使うことがよくあります。
    note: '*Dan* は「〜より」にあたるオランダ語です。必ず比較級の形容詞の後に置きます。'
  nl.a1.unit14.lesson01.teach.groot_klein:
    title: 大きい、小さい
    gloss: 大きい、小さい
    note: '*Groot* と *klein* は、-er を付ける前の基本の形容詞です。'
    example_gloss:
    - リュックは大きいです。
    - バッグは小さいです。
  nl.a1.unit14.lesson01.teach.rugzak_groter:
    title: リュックのほうが大きい
    gloss: リュックはバッグより大きいです。
    note: '*Groter* は *groot* + *er* で、*dan* は比べるもう一方を導きます。'
  nl.a1.unit14.lesson01.teach.tas_kleiner:
    title: バッグのほうが小さい
    gloss: バッグはリュックより小さいです。
    note: '*Kleiner* は *klein* + *er* で、同じパターンです。'
  nl.a1.unit14.lesson02.teach.rugzak_price:
    title: リュックの値段
    gloss: リュックは45ユーロです。
    note: '*Kost* は *kosten*(費用がかかる)の三人称単数形です。'
  nl.a1.unit14.lesson02.teach.tas_price:
    title: バッグの値段
    gloss: バッグは20ユーロです。
    note: リュックより安い値段で、このあとの比較につながります。
  nl.a1.unit14.lesson02.teach.duur_goedkoop:
    title: 高い、安い
    gloss: 高い、安い
    note: '*Duur* と *goedkoop* は、*-der*/*-er* を付ける前の基本の形容詞です。'
    example_gloss:
    - リュックは高いです。
    - バッグは安いです。
  nl.a1.unit14.lesson02.teach.rugzak_duurder:
    title: リュックのほうが高い
    gloss: リュックはバッグより高いです。
    note: '*Duurder* は *duur* + *der* です。すでに r で終わる形容詞には、*-er* を重ねず *-der* を付けます。'
  nl.a1.unit14.lesson02.teach.tas_goedkoper:
    title: バッグのほうが安い
    gloss: バッグはリュックより安いです。
    note: '*Goedkoper* は *goedkoop* + *er* で、前の文と対になる形です。'
  nl.a1.unit14.lesson03.teach.equality_rule:
    title: 同じ程度に比べる
    gloss: net zo + 形容詞 + als を使って、二つのものを同じ程度として比べます。
    note: 日本語の「〜と同じくらい…」にあたるオランダ語の表現です。
  nl.a1.unit14.lesson03.teach.mooi:
    title: 同じくらいきれい
    gloss: このリュックはあのバッグと同じくらいきれいです。
    note: '*Mooi*(きれい)は *net zo* と *als* の間にそのままの形で入ります。このパターンでは -er は付きません。'
  nl.a1.unit14.lesson03.teach.praktisch:
    title: 同じくらい実用的
    gloss: リュックはバッグと同じくらい実用的です。
    note: どんな基本の形容詞も、この *net zo ... als* の位置に入れられます。
  nl.a1.unit14.lesson04.teach.superlative_rule:
    title: 最上級の作り方
    gloss: 最上級では、het + 形容詞 + st を使うことがよくあります。
    note: '*is* の後で使うこの形は、名詞の性にかかわらず *het* を取ります。'
  nl.a1.unit14.lesson04.teach.duurst:
    title: 二つのうち一番高い
    gloss: この二つのうち、リュックのほうが一番高いです。
    note: '*Duurst* は *duur* + *st* です。オランダ語では、選択肢が二つだけの場合でも最上級を使えます。'
  nl.a1.unit14.lesson04.teach.irregular_rule:
    title: 不規則：goed, beter, best
    gloss: Goed, beter, best は不規則です。これが最良の選択です。Veel, meer, meest も同じ仕組みです。
    note: '*goed/beter/best* も *veel/meer/meest* も、規則的な -er/-st のパターンにはあてはまりません。'
  nl.a1.unit14.lesson04.teach.beste_keuze:
    title: 旅行に最適な選択
    gloss: このリュックは長い電車旅行に最適な選択です。
    note: '*Beste* は名詞の前で使う形で、オランダ語の形容詞が名詞の前で通常取る -e が付いています。'
  nl.a1.unit14.lesson04.teach.meer_ruimte:
    title: より多くの容量
    gloss: リュックはバッグより容量があります。
    note: '*Meer* は *veel*(たくさん)の不規則な比較級で、規則的な -er の形にはなりません。'
  nl.a1.unit14.lesson05.teach.advertentie:
    title: お店の広告を読む
    gloss: リュック Bergsport:45ユーロ。このリュックは大きくて丈夫です。ショルダーバッグ Stad:20ユーロ。このバッグはリュックより小さくて軽いですが、丈夫さは劣ります。長い旅行には、リュックが最適な選択です。より丈夫で、容量も大きいからです。
    note: 二つの商品の値段、大きさ、そして広告がどちらをなぜすすめているかをつかみましょう。
    glosses:
      Rugzak: リュックサック
      vijfenveertig: '45'
      euro: ユーロ
      groot: 大きい
      sterk: 丈夫な
      Schoudertas: ショルダーバッグ
      twintig: '20'
      tas: バッグ
      kleiner: より小さい
      lichter: より軽い
      minder: より少ない
      lange: 長い
      reis: 旅
      beste: 一番よい
      keuze: 選択
      sterker: より強い
      ruimte: スペース
  nl.a1.unit14.lesson06.teach.lotte_open:
    title: ロッテが大きさを指摘する
    gloss: ロッテ：ほら、このリュックはあのかばんより大きいよ。
    note: '*Kijk*（見て）は、相手の注意を何かに向けさせるときによく使う言い方です。'
  nl.a1.unit14.lesson06.teach.omar_room:
    title: オマルが必要な理由を説明する
    gloss: オマル：うん、それに容量も大きいしね。電車の旅には大きいかばんが必要なんだ。
    note: '*Nodig hebben*（必要とする）は決まった組み合わせで、必要なものは *hebben* と *nodig* の間に入ります。'
  nl.a1.unit14.lesson06.teach.lotte_best_choice:
    title: ロッテが選択に同意する
    gloss: ロッテ：それなら、リュックがあなたにとって一番いい選択ね。
    note: ここでの *Dan* は「それなら」という意味で、比較の *dan*（〜より）とは別の使い方です。同じつづりで両方の意味を表します。
  nl.a1.unit14.lesson06.teach.omar_question:
    title: オマルがロッテの意見を尋ねる
    gloss: オマル：その通り。君はどのかばんが一番素敵だと思う？
    note: '*Vind jij het mooist* は、第13ユニットの *vinden* のレッスンで出てきた意見を言う型を、そのまま使っています。'
  nl.a1.unit14.lesson06.teach.lotte_choice:
    title: ロッテがショルダーバッグを選ぶ
    gloss: ロッテ：私はこのショルダーバッグが一番素敵だと思う。それに軽いしね。
    note: '*Licht*（重さが軽い）は新しい便利な形容詞で、かばんや荷物を説明するときに使えます。'
  nl.a1.unit14.lesson06.teach.omar_close:
    title: 二人が決定をまとめる
    gloss: オマル：よし、じゃあ僕はリュックを買って、君はショルダーバッグを買うんだね。
    note: 二つ目の節では、繰り返しになる動詞 *koop* が省かれています。文脈から分かるときには、話し言葉でよく起こります。
  nl.a1.unit14.lesson06.teach.koopt_form:
    title: Koop と koopt
    gloss: Koop は kopen（買う）の ik に対する形で、koopt は hij・zij に対する形です。
    note: 規則的な現在形の型：*ik koop*、*jij/hij/zij koopt*。
