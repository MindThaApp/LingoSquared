    - Ninaは鳥を飼っています。
  nl.a1.unit31.lesson01.teach.heb_je_huisdier:
    title: ペットを飼っていますか？
    gloss: ペットを飼っていますか？
    note: これまでのユニットで学んだ *Heb je ...?* と同じ疑問文のパターンです。
  nl.a1.unit31.lesson01.teach.antwoord_ja:
    title: はい、犬を飼っています
    gloss: はい、犬を飼っています。
    note: このユニットの新しい語彙を使った、簡単な肯定の答えです。
  nl.a1.unit31.lesson01.teach.antwoord_nee_geen:
    title: いいえ、ペットは飼っていません
    gloss: いいえ、ペットは飼っていません。
    note: '*Geen* は不定の名詞 *een huisdier* を否定します。文法ノートを参照してください。'
  nl.a1.unit31.lesson01.teach.geen_note:
    title: Geen:不定の名詞の否定
    gloss: Geen は不定の名詞を否定します。すでに学んだ Ik heb geen tijd や、ここでの Ik heb geen huisdier がその例です。
    note: '*Ik heb geen tijd* で学んだ *geen* のパターンと同じです。新しい文法ではなく、別の名詞に使うだけです。'
  nl.a1.unit31.lesson02.teach.uitlaten:
    title: （動物を）散歩させる
    gloss: （動物を）散歩させる
    note: 分離動詞です。文法メモを確認しましょう。
    example_gloss: 私は毎日犬を散歩させます。
