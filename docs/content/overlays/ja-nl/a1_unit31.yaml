    title: オマル、フェナ、サンダーと動物
    gloss: オマルとフェナは二人とも動物が好きですが、どちらもペットは飼っていません。オマルは犬が好きで、フェナは猫が好きです。サンダーはペットを飼っています。猫です。サンダーはよく猫と遊び、毎日猫にえさをあげています。あなたはペットを飼っていますか。
    note: 動物が好きなことと、実際に飼っていることの違いを対比しています。これがこの学習目標で伝えたいポイントです。
    glosses:
      houden: 愛する
      allebei: 両方とも
      dieren: 動物
      beiden: 両方とも
      huisdier: ペット
      honden: 犬たち
      katten: 猫たち
      kat: 猫
      speelt: 遊ぶ
      geeft: 与える
      elke: 毎～
      eten: 餌
