    title: Uitlaten は分離動詞です
    gloss: Uitlaten は、前の課で学んだ opstaan や aankleden と同じく分離動詞です:ik laat de hond uit。
    note: 日課を表す動詞で学んだ分離動詞の形「語幹＋…＋文末の前つづり」を、そのまま使います。
  nl.a1.unit31.lesson02.teach.eten_geven:
