teaching:
  nl.a1.unit05.lesson01.teach.vader_moeder:
    title: 父と母
    gloss: 父/母
    note: '*Vader* は「父」を表す標準的な中立の語です。*Moeder* は「母」を表す標準的な中立の語です。'
    example_gloss:
    - こちらは私の父です。
    - あれは私の母です。
  nl.a1.unit05.lesson01.teach.ouders_broer_zus:
    title: 両親、兄(弟)、姉(妹)
    gloss: 両親/兄(弟)/姉(妹)
    note: この意味の *Ouders* は常に複数形です。*de broer* と *de zus* はどちらも *de* がつきます。
    example_gloss:
    - 両親はユトレヒトに住んでいます。
    - 私には兄(弟)がいます。
    - 私には姉(妹)がいます。
  nl.a1.unit05.lesson01.teach.kind_kinderen:
    title: 子どもと子どもたち
    gloss: 子ども/子どもたち
    note: '*Kind* は het 名詞で、*het kind* と言います。複数形の *kinderen* には、単数の *kind* が *het* をとるのに、*de* がつきます。'
    example_gloss:
    - 私の姉(妹)には子どもが1人います。
    - 私のおじとおばには子どもが2人います。
  nl.a1.unit05.lesson01.teach.have_sentence:
    title: 私には兄(弟)と姉(妹)がいます
    gloss: 私には兄(弟)と姉(妹)がいます。
    note: '*Ik heb ...* は、どんな家族がいるかを言うときの基本の言い方です。'
  nl.a1.unit05.lesson02.teach.opa_oma_oom_tante:
    title: 祖父、祖母、叔父(伯父)、叔母(伯母)
    gloss: おじいさん/おばあさん/おじさん/おばさん
    note: '*Opa* は祖父を表す日常的な言葉で、*grootvader* はより改まった書き言葉です。*Oma* は祖母を表す日常的な言葉で、*grootmoeder* はより改まった書き言葉です。*De oom*。*De tante*。'
    example_gloss:
    - 私の祖父と祖母はロッテルダムに住んでいます。
    - 私の祖母は99歳です。
    - 私の叔父はアムステルダムに住んでいます。
    - 私のおじとおばには子どもが2人います。
  nl.a1.unit05.lesson02.teach.neef_nicht_note:
    title: いとこと甥姪の呼び方は意味が2つあります
    gloss: neef = 男のいとこ、または甥/nicht = 女のいとこ、または姪
    note: オランダ語では、いとこと甥・姪を別の単語で区別しません。どちらを指すかは文脈でわかります。この単元の練習問題には出てきませんが、後で見たときにわかるようにここで触れておきます。
    target_text: neef = 男のいとこ、または甥；nicht = 女のいとこ、または姪
  nl.a1.unit05.lesson02.teach.gezin:
    title: 家族(世帯)
    gloss: 家族(世帯)
    note: '*Gezin* は一緒に暮らしている世帯(たいてい両親と子ども)を指します。*familie* は親戚全体を含む、より広い意味の言葉です。'
    example_gloss: 私の家族はユトレヒトに住んでいます。
  nl.a1.unit05.lesson02.teach.opa_oma_sentence:
    title: 私の祖父母はロッテルダムに住んでいます
    gloss: 私の祖父と祖母はロッテルダムに住んでいます。
    note: '*Wonen in* のあとに都市名を置いて、住んでいる場所を表します。'
  nl.a1.unit05.lesson02.teach.oom_tante_sentence:
    title: 私の叔父と叔母には子どもが2人います
    gloss: 私のおじとおばには子どもが2人います。
    note: '*oom en tante* は2人を指すので、*hebben* を使います。'
  nl.a1.unit05.lesson03.teach.mijn_je_jouw:
    title: 「私の」と「あなたの」(弱形と強形)
    gloss: 私の/あなたの(弱形)/あなたの(強形)
    note: '*Mijn* は、de 名詞の前でも het 名詞の前でも、単数でも複数でも形が変わりません。*Je* は、誰のものかを強調しないときに使う普通のくだけた形で、どの名詞の前でも形は同じです。*Jouw* は *je* より強く、ある人の家族と別の人の家族を対比するときに必要です。これもどの名詞の前でも形は変わりません。'
    example_gloss:
    - こちらは私の兄(弟)です。
    - こちらはあなたのお姉さん(妹さん)ですか？
    - あちらはあなたのお姉さん(妹さん)ですか？
  nl.a1.unit05.lesson03.teach.je_jouw_note:
    title: je と jouw の違い
    gloss: je も jouw も、くだけた言い方の「あなたの」
    note: 特に強調しないときは *je* を使います。誰のものかを強調するとき、特に対比するときは *jouw* を使います。対比がなくても完全な形の *jouw* は使えますが、その場合は *je* のほうが普通です。
    target_text: je と jouw はどちらも、くだけた言い方の「あなたの」です。強調しないときは je がふつうで、jouw は強い言い方であり、対比するときに必要です。どちらも、どの名詞の前でも形は変わりません。
  nl.a1.unit05.lesson03.teach.dit_is_mijn_broer:
    title: こちらは私の兄(弟)です
    gloss: こちらは私の兄(弟)です。
    note: '*Dit is ...* は、近くにいる人を紹介するときに使います。'
  nl.a1.unit05.lesson03.teach.is_dat_jouw_zus:
    title: あちらはあなたのお姉さん(妹さん)ですか？
    gloss: あちらはあなたのお姉さん(妹さん)ですか？
    note: '*Dat is ...* は、離れたところにいる人や、すでに話に出た人を指すときに使います。'
  nl.a1.unit05.lesson04.teach.zijn_haar:
    title: 「彼の」と「彼女の」
    gloss: 彼の/彼女の
    note: '*Zijn* は *mijn*、*je*、*jouw* と同じく、形が常に変わりません。*Haar* も常に同じ形です。'
    example_gloss:
    - こちらは彼のお父さんです。
    - あの人は彼女の母親です。
  nl.a1.unit05.lesson04.teach.zijn_haar_note:
    title: zijn と haar の違い
    gloss: zijn = 彼の、haar = 彼女の
    note: これらの例では、持ち主が男性なら *zijn*、女性なら *haar* を選びます。あとに続く家族を表す語によって選び方は変わりません。*zijn vader* と *zijn moeder*、*haar vader* と *haar moeder* のようになります。
    target_text: zijn = 彼の、haar = 彼女の。どちらも、後ろに来る名詞に関係なく形は変わりません。
  nl.a1.unit05.lesson04.teach.dit_is_zijn_vader:
    title: こちらは彼のお父さんです
    gloss: こちらは彼のお父さんです。
    note: '*Zijn vader* は「彼のお父さん」という意味です。'
  nl.a1.unit05.lesson04.teach.dat_is_haar_moeder:
    title: あちらは彼女のお母さんです
    gloss: あの人は彼女の母親です。
    note: '*Haar moeder* は「彼女のお母さん」という意味です。'
  nl.a1.unit05.lesson05.teach.heet:
    title: 〜という名前です
    gloss: 〜という名前だ
    note: '*Ik heet...* や *Hij heet...* は、名前を言うときの基本の言い方で、第1単元ですでに出てきました。'
    example_gloss: 私の名前はロッテです。
  nl.a1.unit05.lesson05.teach.sander_fenna_jan_marieke:
    title: 家族の名前：Sander、Fenna、Jan、Marieke
    gloss: サンダー(オランダの男性の名前)/フェナ(オランダの女性の名前)/ヤン(オランダの男性の名前)/マリーケ(オランダの女性の名前)
    note: 4つとも、オランダでよくある名前です。Sander と Jan は男性の名前、Fenna と Marieke は女性の名前です。
    example_gloss:
    - 私の兄(弟)の名前はサンダーです。
    - 私の姉(妹)の名前はフェナです。
    - 私の父の名前はヤンです。
    - 私の母の名前はマリーケです。
  nl.a1.unit05.lesson05.teach.rotterdam:
    title: Rotterdam
    gloss: ロッテルダム
    note: オランダの大都市の一つです。
    example_gloss: ロッテの祖父と祖母はロッテルダムに住んでいます。
  nl.a1.unit05.lesson05.teach.profile:
    title: Lotte の家族紹介
    gloss: 私の名前はロッテです。私には兄(弟)と姉(妹)がいます。兄(弟)の名前はサンダーで、姉(妹)の名前はフェナです。父の名前はヤンで、母の名前はマリーケです。祖父と祖母はロッテルダムに住んでいます。
    note: ロッテが家族について話す短い自己紹介です。この単元のこれまでのレッスンで学んだ語彙を使っています。
  nl.a1.unit05.lesson06.teach.egypte:
    title: エジプト
    gloss: エジプト
    note: オマルの出身国です。これまでの単元と同じ設定です。
    example_gloss: 私の両親はエジプトに住んでいます。
  nl.a1.unit05.lesson06.teach.elke_maand:
    title: 毎月
    gloss: 毎月
    note: '*Elke* + 単数名詞で「毎〜」「〜ごとに」という意味を表します。'
    example_gloss: はい、毎月です。
  nl.a1.unit05.lesson06.teach.lines01_04:
    title: 兄弟姉妹はいますか？
    gloss: ロッテ：オマル、あなたには兄弟か姉妹はいますか？オマル：はい、姉妹が2人います。兄弟はいません。あなたは？ロッテ：私には兄(弟)と姉(妹)がいます。
    note: '*Broers of zussen* は複数形を使った「兄弟または姉妹」という言い方です。'
  nl.a1.unit05.lesson06.teach.lines05_08:
    title: あなたの両親もオランダに住んでいますか？
    gloss: オマル：あなたの両親もオランダに住んでいますか？ロッテ：はい、私の両親はユトレヒトに住んでいます。あなたの家族は？オマル：両親はエジプトに住んでいますが、叔父がここアムステルダムに住んでいます。
    note: '*Wonen ook in* は「〜にも住んでいる」という意味で、同じことが相手にも当てはまるかをたずねるときに使います。'
  nl.a1.unit05.lesson06.teach.lines09_10:
    title: 彼にはよく会いますか？
    gloss: ロッテ：いいですね！彼によく会うのですか？オマル：はい、毎月会います。
    note: '*Zie je hem vaak?* は、会う頻度をたずねる自然でよく使われる言い方です。'
