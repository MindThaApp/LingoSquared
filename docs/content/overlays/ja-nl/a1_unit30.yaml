course:
  title: オランダ語 A1
  description: 人の基本的な外見を説明する初級オランダ語です。背の高さや年齢の印象、髪と目の色、基本の質問 Hoe ziet ... eruit?、二人の外見の比較を学びます。
units:
  nl.a1.unit30.appearance:
    title: 外見を説明する
lessons:
  nl.a1.unit30.lesson01.lang_klein_oud_jong:
    title: 背が高い、背が低い、年を取った、若い
  nl.a1.unit30.lesson02.haar_beschrijven:
    title: 髪について説明する
  nl.a1.unit30.lesson03.ogen_en_eruitzien:
    title: 目と人の外見の尋ね方
  nl.a1.unit30.lesson04.taalcafe_nina:
    title: ロッテがニナを説明する
  nl.a1.unit30.lesson05.sander_fenna_vergelijken:
    title: サンダーとフェナを比べる
  nl.a1.unit30.lesson06.taalcafe_herkenning:
    title: オマルがニナに気づく
teaching:
  nl.a1.unit30.lesson01.teach.lang_klein:
    title: 背が高い、背が低い
    gloss: 背が高い／背が低い
    note: '*Lang* は背が高い人、*klein* は背が低い人を表します(klein は、このコースの別の場所では小さい物にも使われています)。'
    example_gloss:
    - フェナは背が高いです。
    - サンダーは背が低いです。
  nl.a1.unit30.lesson01.teach.oud_jong:
    title: 年を取った、若い
    gloss: 年を取った／若い
    note: '*Oud* と *jong* は、ここでは正確な年数ではなく、全体的な見た目の印象を表します。'
    example_gloss:
    - おじいさんは年を取っています。
    - オマルは若いです。
  nl.a1.unit30.lesson01.teach.oud_note:
    title: Oud:年数か、印象か
    gloss: Oud は、正確な年数を表すこともあれば(Hoe oud ben je? の場合)、数を伴わない全体的な印象を表すこともあります(Opa is oud. の場合)。
    note: '*oud* は、正確な年齢をたずねる表現(*Hoe oud ben je?*)ですでに習っています。ここでは、数字は使わず、その人が何歳くらいに「見えるか」を表します。'
  nl.a1.unit30.lesson01.teach.fenna_sander_phrase:
    title: フェナは背が高くて、サンダーは背が低いです
    gloss: フェナは背が高くて、サンダーは背が低いです。
    note: '*en*(〜と、そして)を使った簡単な複文で、このあとの二人を直接比べる練習につなげます。'
  nl.a1.unit30.lesson02.teach.haar_noun:
    title: 髪
    gloss: 髪
    note: '*Haar* は冠詞 het をとる名詞です:*het haar*。'
    example_gloss: オマルは短い黒髪です。
  nl.a1.unit30.lesson02.teach.haar_kleuren:
    title: 金色、茶色、灰色
    gloss: 金色の／茶色の／灰色の
    note: 髪の色を表す3つの言葉です。*Zwart*(黒)は以前に服の単元で出てきましたが、ここでは髪に使います。
    example_gloss:
    - ロッテは金髪です。
    - サンダーは茶色の髪です。
    - おじいさんは白髪です。
  nl.a1.unit30.lesson02.teach.haar_lengte:
    title: 長い髪と短い髪
    gloss: 長い／短い（髪）
    note: '*Lang*(長い)は lesson01 で出てきた身長の言葉ですが、ここでは髪の長さを表します。*Kort*(短い)はここで初めて出てきます。'
    example_gloss:
    - フェナは髪が長いです。
    - サンダーは髪が短いです。
  nl.a1.unit30.lesson02.teach.haar_agreement_note:
    title: haar の前の形容詞は語尾がつかない
    gloss: Haar は冠詞のない het 語なので、形容詞は語尾がつかないままです:kort haar, lang haar, blond haar, bruin haar, grijs haar, zwart haar.
    note: 冠詞のないこの形では、*haar* の前に -e はつきません。lesson03 の *ogen* では -e がつくので、違いに注意しましょう。
  nl.a1.unit30.lesson02.teach.haar_homoniem_note:
    title: Haar:二つの意味
    gloss: Haar には「髪」(この課の新しい名詞)と「彼女の」(ユニット5で学んだ所有を表す語。例:haar moeder)の二つの意味があります。どちらの意味かは文脈でわかります。
    note: オランダ語の同形異義語です。名詞の *haar*(髪)と、所有を表す *haar*(彼女の)は綴りが同じです。文のほかの部分から、どちらの意味かいつもわかります。
    target_text: Haar には二つの意味があります。「髪」(この課の新しい名詞)と「彼女の」(所有を表す語。例:haar moeder)です。どちらの意味かは文脈で分かります。
  nl.a1.unit30.lesson02.teach.omar_kort_zwart:
    title: オマルは短い黒髪です
    gloss: オマルは短い黒髪です。
    note: ユニット20の服の単元で出てきた *zwart*(黒)をもう一度使います。
  nl.a1.unit30.lesson02.teach.lotte_lang_blond:
    title: ロッテは長い金髪です
    gloss: ロッテは長い金髪です。
    note: このレッスンで学ぶ長さと色の語彙を、自然な1つの文に組み合わせています。
  nl.a1.unit30.lesson03.teach.ogen_noun:
    title: 目
    gloss: 目
    note: '*Ogen* は *het oog* の複数形です。複数形には必ず *de* がつきます。'
    example_gloss: オマルは茶色の目をしています。
  nl.a1.unit30.lesson03.teach.oog_kleuren:
    title: 青、茶色、緑
    gloss: 青い／茶色い／緑色の
    note: '*Blauw*(青)は以前に服の単元で出てきました。*bruin*(茶色)は lesson02 で髪について学んだばかりです。*groen*(緑)はここで初めて出てきます。'
    example_gloss:
    - ロッテは青い目をしています。
    - サンダーは茶色い目をしています。
    - フェナは緑の目をしています。
  nl.a1.unit30.lesson03.teach.ogen_agreement_note:
    title: ogen には -e がつく
    gloss: ogen(複数形)では、形容詞に -e がつきます:blauwe ogen, bruine ogen, groene ogen.
    note: lesson02 の *haar* では形容詞に語尾がつきませんでしたが、複数形では de 語か het 語かに関係なく、いつも -e がつきます。
  nl.a1.unit30.lesson03.teach.hoe_ziet_eruit:
    title: ロッテはどんな外見ですか?
    gloss: ロッテはどんな外見ですか?
    note: '*Hoe ziet ... eruit?* はこのユニットの中心となる質問です。誰の外見でも、これでたずねられます。'
  nl.a1.unit30.lesson03.teach.antwoord_patroon:
    title: ロッテは長い金髪で、青い目をしています
    gloss: ロッテは長い金髪で、青い目をしています。
    note: 髪と目を *en* でつないで一つの文にした答えの例です。
  nl.a1.unit30.lesson04.teach.lotte_intro_nina:
    title: ロッテがニナを紹介する
    gloss: ロッテ:新しい女の子が taalcafé に来ます。名前はニナです。
    note: '*Er komt*(来る)は、新しい人をその場面に登場させる言い方です。'
  nl.a1.unit30.lesson04.teach.omar_ask_eruit:
    title: オマルがどんな外見かたずねる
    gloss: オマル:いいね!どんな外見の子?
    note: このユニットの中心の質問を、名前の代わりに *ze*(彼女)で使っています。
  nl.a1.unit30.lesson04.teach.lotte_klein_kort_blond:
    title: ロッテがニナの身長と髪を説明する
    gloss: ロッテ:背が低くて、短い金髪だよ。
    note: lesson01 の *klein* と lesson02 の髪の言葉を組み合わせています。
  nl.a1.unit30.lesson04.teach.omar_ask_ogen:
    title: オマルが目についてたずねる
    gloss: オマル:目は?
    note: ここでの *haar* は「彼女の」(ユニット5で学んだ所有を表す語)で、「髪」ではありません。lesson02 の同形異義語の説明を見てください。
  nl.a1.unit30.lesson04.teach.lotte_groene_ogen:
    title: ロッテがニナの目を説明する
    gloss: ロッテ:緑の目をしているよ。
    note: lesson03 の *groene ogen* をもう一度使っています。
  nl.a1.unit30.lesson04.teach.omar_bedankt_herken:
    title: オマルは彼女がわかる
    gloss: オマル:ありがとう!それならすぐ見分けられるよ。
    note: '*Herken ik haar wel*(「彼女ならちゃんとわかるよ」)の *haar* も、「髪」ではなく「彼女を」という代名詞です。'
  nl.a1.unit30.lesson05.teach.vergelijking:
    title: サンダーとフェナを比べる
    gloss: サンダーとフェナは兄と妹(姉と弟)ですが、見た目が違います。サンダーは背が低く、短い茶色の髪と茶色の目をしています。フェナはサンダーより背が高く、長い茶色の髪と緑の目をしています。あなたはどんな外見ですか?
    note: これまでに学んだ色や長さを表す語を使って人の見た目を比べ、最後に自分の見た目について答えます。
    glosses:
      broer: 兄弟
      zus: 姉妹
      zien: ～に見える
      anders: 異なる
      klein: 背が低い
      kort: 背が低い
      bruin: 茶色の
      haar: 髪
      bruine: 茶色の
      ogen: 目
      langer: より背が高い
      lang: 長い
      groene: 緑色の
      eruit: (eruit zien =「~に見える」の一部)
  nl.a1.unit30.lesson05.teach.comparatief_note:
    title: 比較の型をもう一度使う
    gloss: このパターンは比較ですでに学びました。形容詞+er+dan です。ここでは人について使います:Fenna is langer dan Sander.(フェナはサンダーより背が高いです。)
    note: 第14課のバックパックの買い物で学んだ、形容詞 + *-er + dan* とまったく同じパターンです。今回は物ではなく人を説明するのに使います。
  nl.a1.unit30.lesson05.teach.langer_haar:
    title: フェナはサンダーより髪が長いです
    gloss: フェナはサンダーより髪が長いです。
    note: '*Langer* は、het 語の *haar* の前では語尾がつきません。lesson02 の語尾の説明と同じ規則で、比較の形でも変わりません。'
  nl.a1.unit30.lesson05.teach.ik_heb_haar:
    title: 私は短い茶色の髪をしています
    gloss: 私は短い茶色の髪をしています。
    note: '*Ik heb ...* を使った一人称の例文です。自分の外見を説明するときにそのまま使えます。'
  nl.a1.unit30.lesson06.teach.omar_kijk_is_dat_nina:
    title: オマルがニナを見つける
    gloss: オマル:見て、あれがニナ?短い金髪で緑の目をしているね。
    note: '*Kijk*(見て)は、ユニット14の会話でも同じように使われました。'
  nl.a1.unit30.lesson06.teach.lotte_ja_dat_is_nina:
    title: ロッテが認める
    gloss: ロッテ:うん、あれがニナだよ!
    note: 短く自然に、そうだと伝える表現です。
  nl.a1.unit30.lesson06.teach.nina_ben_jij_omar:
    title: ニナがオマルにあいさつする
    gloss: ニナ:こんにちは、あなたがオマル?
    note: '*ben jij ...?* を使った、くだけたあいさつの簡単な質問です。'
  nl.a1.unit30.lesson06.teach.omar_leuk_je_te_zien:
    title: オマルもあいさつを返す
    gloss: オマル:うん!会えてうれしいよ、ニナ。
    note: '*Leuk je te ontmoeten* は、初対面のときの決まった言い方です(ユニット1参照)。すでに知っている人には *leuk je te zien* を使います。'
  nl.a1.unit30.lesson06.teach.nina_leuk_je_ook:
    title: Ninaもあいさつを返します
    gloss: Nina：こちらこそ、はじめまして！
    note: 会話の締めくくりです。オマルはロッテの説明のおかげで、ニナを見分けることができました。
