    - コーヒーをお願い。(親しい間柄)
  nl.a1.unit06.lesson03.teach.please_note:
    title: Alstublieft と alsjeblieft の違い
    gloss: alstublieft = 丁寧な「お願いします」、alsjeblieft = 親しい間柄の「お願い」
    note: '*u* には *alstublieft*、*jij* や *je* には *alsjeblieft* を使います。'
    target_text: alstublieft = 丁寧な「お願いします」(u と一緒に使う); alsjeblieft = くだけた「お願いします」(jij/je と一緒に使う)
