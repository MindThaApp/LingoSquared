    example_gloss: コーヒーをすぐお持ちします!
  nl.a1.unit06.lesson06.teach.lines01_03:
    title: こんにちは、お飲み物は何になさいますか?
    gloss: 店員:こんにちは、お飲み物は何になさいますか? ロッテ:コーヒーをお願いします。
    note: 丁寧な接客の場面です。ロッテはオマルとの親しい会話とは違い、店員には *alstublieft* を使っています。
