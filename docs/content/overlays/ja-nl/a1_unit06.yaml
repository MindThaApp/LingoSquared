  nl.a1.unit06.lesson02.teach.ik_wil_graag_koffie:
    title: コーヒーをください
    gloss: コーヒーを1杯お願いします。
    note: '*Een* は「一つの」を表す語で、オランダ語ではどの名詞の前でも同じ形です。日本語の名詞に付く数の言い方(「一杯の」「一つの」など)のような使い分けはありません。'
  nl.a1.unit06.lesson02.teach.ik_wil_graag_broodje:
    title: チーズサンドをください
    gloss: チーズサンドをください。
