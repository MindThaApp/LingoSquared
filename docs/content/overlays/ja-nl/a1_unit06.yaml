  nl.a1.unit06.lesson04.teach.wilt_wil_note:
    title: Wilt と wil の違い
    gloss: wilt u ... だが wil je/jij ...
    note: 動詞が主語の前に来る疑問文では、*wilt u* ですが *wil je*、*wil jij* となります。*wilt je* や *wilt jij* とは言いません。
    target_text: wilt u(丁寧)に対して wil je(くだけた形)— wil が je や jij の前に来るときは、t がつきません
  nl.a1.unit06.lesson04.teach.appelsap:
