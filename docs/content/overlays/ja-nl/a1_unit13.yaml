teaching:
  nl.a1.unit13.lesson01.teach.lekker_vinden:
    title: 食べ物と飲み物に使う Lekker vinden
    gloss: 食べ物や飲み物については、オランダ語ではよく lekker vinden を使います。
    note: 日本語の「好き」は、オランダ語では1つの表現に対応するわけではありません。味については *Ik vind ... lekker* と言い、直訳すると「それをおいしいと思う」という意味です。
  nl.a1.unit13.lesson01.teach.koffie:
    title: コーヒーが好き
    gloss: コーヒーが好きです。
    note: 食べ物や飲み物は *vind* と *lekker* の間に入れます。
  nl.a1.unit13.lesson01.teach.thee:
    title: 紅茶が好きではない
    gloss: 紅茶は好きではありません。
    note: 味を否定するときは、*lekker* の前に *niet* を置きます。
  nl.a1.unit13.lesson01.teach.question:
    title: 味について尋ねる
    gloss: トマトスープは好きですか?
    note: くだけた疑問文では、*vind* が *je* の前に来ます。このコースで学んでいる *jij/je* の使い方の続きです。
  nl.a1.unit13.lesson02.teach.leuk_vinden:
    title: 活動に使う Leuk vinden
    gloss: 活動については、オランダ語ではよく leuk vinden を使います。例:サイクリングが好きです。
    note: サイクリングのような活動には、*lekker* ではなく *leuk* を使います。
  nl.a1.unit13.lesson02.teach.walking:
    title: 散歩が好き
    gloss: 散歩が好きです。
    note: 活動の *wandelen* は *vind* と *leuk* の間に入ります。
  nl.a1.unit13.lesson02.teach.dislike:
    title: 買い物が好きではない
    gloss: 買い物は好きではありません。
    note: '*Niet* は *leuk* の前に来ます。'
  nl.a1.unit13.lesson02.teach.activity_question:
    title: 活動について尋ねる
    gloss: 何をするのが好きですか?
    note: '*Wat vind je leuk om te doen?* は、相手が好む活動を尋ねる自然で一般的な質問です。'
  nl.a1.unit13.lesson03.teach.strong_like:
    title: より強い、または一般的な好き
    gloss: Houden van は、強い好意や一般的な好みを表します。
    note: 使うのは限定的にしましょう。特定の食べ物や活動に対する普通の反応は、*lekker vinden* や *leuk vinden* のほうが自然です。
  nl.a1.unit13.lesson03.teach.music:
    title: 音楽が大好き
    gloss: 音楽が大好きです。
    note: '*Houd* は *houden* の *ik* の形で、後ろに *van* が続きます。'
  nl.a1.unit13.lesson03.teach.films:
    title: 映画が好きではない
    gloss: 映画は好きではありません。
    note: 否定文では、*niet* は *houd* と *van* の間に入ります。
  nl.a1.unit13.lesson03.teach.contrast:
    title: 自然な表現を選ぶ
    gloss: 普通の味については、コーヒーが好きです、と言います。活動については、散歩が好きです、と言います。
    note: 日本語の「好き」をすべて機械的に *houden van* に置き換えてはいけません。
  nl.a1.unit13.lesson04.teach.choice_question:
    title: 2つの選択肢を示す
    gloss: コーヒーと紅茶、どちらがいいですか?
    note: '*Wil je ... of ...?* は、相手に選んでもらう言い方です。'
  nl.a1.unit13.lesson04.teach.want_prefer:
    title: どちらがいいか伝える
    gloss: 紅茶のほうがいいです。
    note: このような普通の選択の型では、*liever* は *wil* の後に来ます。
  nl.a1.unit13.lesson04.teach.have_prefer:
    title: 1つのものを選ぶ
    gloss: 青いセーターのほうがいいです。
    note: '*Ik heb liever ...* は、あるものを別のものより選ぶときにも自然に使えます。'
  nl.a1.unit13.lesson04.teach.liever_note:
    title: Liever は好ましいほうを示す
    gloss: Liever は、1つの選択肢を別のものより選ぶことを表します。
    note: 会話の中で両方の選択肢が明らかなときは、比べる相手を言わなくてもかまいません。
  nl.a1.unit13.lesson05.teach.message:
    title: いくつかの好みを読む
    gloss: こんにちは、ロッテ。私は映画がいいと思うけれど、オマルは映画が好きではありません。彼は公園に行くほうがいいそうです。私も散歩が好きです。
    note: 誰が映画を気に入っているか、誰が映画を好まないか、オマルがどちらを選ぶかに注意しましょう。
    glosses:
      Hoi: やあ
      vind: 好き・思う
      film: 映画
      leuk: 楽しい
      maar: でも
      houdt: 好きだ(houdt van)
      films: 映画(複数)
      wil: 欲しい
      liever: むしろ・のほうがいい
      park: 公園
      wandelen: 散歩
  nl.a1.unit13.lesson06.teach.food_question:
    title: Lotteが2つの食べ物を勧める
    gloss: Lotte:何が食べたい、Omar?パンとトマトスープ、どっちがいい?
    note: 2つ目の質問で、2つの選択肢が示されています。
  nl.a1.unit13.lesson06.teach.omar_choice:
    title: Omarがスープを選ぶ
    gloss: Omar:トマトスープのほうがいいな。トマトスープはおいしいと思うよ。君は?
    note: Omarはまず *liever* で選択を述べ、次に *lekker* で味の好みとして理由を説明しています。
  nl.a1.unit13.lesson06.teach.lotte_choice:
    title: Lotteがパンを選ぶ
    gloss: Lotte:私はパンのほうがいいな。トマトスープはあまりおいしいと思わないの。
    note: '*Niet zo lekker* は否定をやわらげる言い方で、親しい会話では自然です。'
  nl.a1.unit13.lesson06.teach.activity:
    title: 次にすることを選ぶ
    gloss: Omar:食べたあと、何をしたい?Lotte:私は散歩が好きだな。
    note: '*Leuk* は活動 *wandelen* について「楽しい」と述べています。'
  nl.a1.unit13.lesson06.teach.plan:
    title: 好みが同じ
    gloss: Omar:僕もだよ。散歩が大好きなんだ。公園に行こうか?Lotte:いいね。
    note: ここでは、ユニット11で学んだ、くだけた予定の立て方が再び出てきます。
