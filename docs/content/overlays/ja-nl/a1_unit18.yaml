teaching:
  nl.a1.unit18.lesson01.teach.appartement_woonkamer_slaapkamer:
    title: アパート、リビング、寝室
    gloss: アパート、リビング、寝室
    note: '*Het appartement*は中性名詞、*de woonkamer*と*de slaapkamer*は通性名詞です。'
    example_gloss:
    - 私はアパートを持っています。
    - 私の家にはリビングがあります。
    - 私の家には寝室があります。
  nl.a1.unit18.lesson01.teach.keuken_badkamer:
    title: キッチン、バスルーム
    gloss: キッチン、バスルーム
    note: '*De keuken*と*de badkamer*はどちらも通性名詞です。'
    example_gloss:
    - 私の家にはキッチンがあります。
    - 私の家にはバスルームがあります。
  nl.a1.unit18.lesson01.teach.appartement_utrecht:
    title: アパートを持っていると言う
    gloss: 私はアパートを持っています。
    note: '*Hebben*(持っている)は、どんな家に住んでいるかを言うときに自然な動詞です。日本語では「ある」や「持っている」を使い分けますが、オランダ語ではここではhebbenを使います。これは一般的な例で、オマールの具体的なアパート(ユトレヒト)はこのユニットの後半で出てきます。'
  nl.a1.unit18.lesson01.teach.rooms_list:
    title: すべての部屋を挙げる
    gloss: リビングと寝室とキッチンとバスルームがあります。
    note: このレッスンの4つの部屋をすべて1文に並べています。カンマで区切り、最後の前に*en*を置きます。
  nl.a1.unit18.lesson02.teach.hoeveel_kamers:
    title: 部屋の数をたずねる
    gloss: 部屋はいくつありますか?
    note: '*Hoeveel*(いくつ・どれくらい)は、これまでの数のレッスンで出てきた数量をたずねる型と同じです。'
  nl.a1.unit18.lesson02.teach.twee_slaapkamers:
    title: 部屋の数を言う
    gloss: 寝室が2つあります。
    note: '*Slaapkamers*は*slaapkamer*の複数形で、規則的に-sをつけて作ります。'
  nl.a1.unit18.lesson02.teach.drie_kamers:
    title: 部屋の合計数を言う
    gloss: そのアパートは3部屋です。
    note: '*Kamers*は寝室に限らず、部屋全般を指す言葉です。'
  nl.a1.unit18.lesson03.teach.balkon_tuin:
    title: バルコニー、庭
    gloss: バルコニー、庭
    note: '*Het balkon*は中性名詞、*de tuin*は通性名詞です。'
    example_gloss:
    - バルコニーがあります。
    - 庭はありません。
  nl.a1.unit18.lesson03.teach.er_is_balkon:
    title: あるものを言う
    gloss: バルコニーがあります。
    note: '*Er is*は「~がある」と存在を表すオランダ語の標準的な構文です。'
  nl.a1.unit18.lesson03.teach.geen_tuin:
    title: ないものを言う
    gloss: 庭はありません。
    note: '*Geen*は不定の名詞を否定します。*geen tuin*と言い、*niet een tuin*とは言いません。'
  nl.a1.unit18.lesson04.teach.gezellig:
    title: 居心地のよい
    gloss: 居心地のよい
    note: 心地よく温かい雰囲気を表す、とてもよく使われるオランダ語らしい形容詞です。日本語の一語にぴったり当てはまる言葉はありません。
    example_gloss: そのアパートは小さいけれど居心地がよいです。
  nl.a1.unit18.lesson04.teach.klein_maar_gezellig:
    title: よくある描写のパターン
    gloss: そのアパートは小さいけれど居心地がよいです。
    note: '*Klein maar gezellig*は、コンパクトな家を好意的に表すときにオランダ人がよく使う自然な言い方です。'
  nl.a1.unit18.lesson04.teach.woonkamer_groot:
    title: 部屋の広さを描写する
    gloss: リビングは広いです。
    note: '*Groot*は、家全体ではなく特定の部屋について述べています。'
  nl.a1.unit18.lesson04.teach.keuken_klein:
    title: 別の部屋の広さを描写する
    gloss: キッチンは狭いです。
    note: 前のカードの*groot*と同じ型で、別の部屋に*klein*を使っています。
  nl.a1.unit18.lesson05.teach.advertentie:
    title: 物件広告を読む
    gloss: ユトレヒトのアパート:寝室1つ、リビング、キッチン、バスルーム。バルコニーはありますが、庭はありません。アパートは小さいけれど居心地がよいです。
    note: 部屋の数、あるものとないもの、そして全体の印象に注目しましょう。
    glosses:
      Appartement: アパート
      slaapkamer: 寝室
      woonkamer: リビング
      keuken: キッチン
      badkamer: 浴室
      balkon: バルコニー
      tuin: 庭
      klein: 小さい
      gezellig: 居心地のよい
  nl.a1.unit18.lesson06.teach.lotte_ask:
    title: ロッテがアパートについてたずねる
    gloss: ロッテ:こんにちは、オマール。ユトレヒトの新しいアパートはどう?
    note: '*Nieuwe*は*nieuw*(新しい)の語尾がついた形で、名詞の前で使います。'
  nl.a1.unit18.lesson06.teach.omar_describe:
    title: オマールが説明する
    gloss: オマール:小さいけれど居心地がいいよ。寝室が1つ、リビング、キッチン、バスルームがあるんだ。
    note: レッスン5で読んだ住宅広告とまったく同じ内容です。これがオマールの実際のアパートです。
  nl.a1.unit18.lesson06.teach.lotte_ask_balcony:
    title: ロッテがバルコニーについてたずねる
    gloss: ロッテ:バルコニーはある?
    note: これまでのユニットに出てきた*heb je ...?*を使った、はい・いいえで答える直接的な質問です。
  nl.a1.unit18.lesson06.teach.omar_balcony_answer:
    title: オマールが答える
    gloss: オマール:うん、バルコニーはあるけど、庭はないんだ。
    note: 先ほどの広告にあった、バルコニーはあるが庭はないという内容と一致しています。
  nl.a1.unit18.lesson06.teach.hij_pronoun_note:
    title: オマールの代わりに hij を使う
    gloss: Omarの代わりにhijと言うこともできます:彼にはバルコニーがあります。
    note: 会話の中でオマールがすでに紹介されたあとは、名前の代わりに*hij*(彼)を使うことができます。
  nl.a1.unit18.lesson06.teach.lotte_reaction:
    title: ロッテが温かく反応する
    gloss: ロッテ:いいね!近いうちに遊びに行くよ。
    note: '*Komen langs*(立ち寄る・訪ねる)は分離動詞で、*langs*は節の最後に移動します。'
  nl.a1.unit18.lesson06.teach.omar_welcome:
    title: オマールが歓迎する
    gloss: オマール:嬉しいな、いつでも歓迎だよ。
    note: '*Altijd welkom*は、また来てほしいと伝える温かく自然な言い方です。'
