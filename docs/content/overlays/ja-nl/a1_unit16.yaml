teaching:
  nl.a1.unit16.lesson01.teach.niet_lekker:
    title: 気分が悪いとき
    gloss: 気分がよくありません。
    note: ここでは *voelen* は再帰動詞として使います(*je*/*me voelen*)。*niet lekker* は、どこか調子が悪いことを表す、一般的でやわらかい言い方です。
  nl.a1.unit16.lesson01.teach.ziek:
    title: 病気の
    gloss: 病気の
    note: 基本の形容詞で、*zijn*(~である)と一緒に使います。
    example_gloss: 私は病気です。
  nl.a1.unit16.lesson01.teach.ben_ziek:
    title: 病気であること
    gloss: 私は病気です。
    note: '*Ziek* は *niet lekker* より、もっと全般的で重い状態を表します。'
  nl.a1.unit16.lesson01.teach.hoofdpijn:
    title: 頭痛
    gloss: 頭痛
    note: '*hebben* の後では冠詞をつけずに使います。*Ik heb hoofdpijn* であり、*Ik heb een hoofdpijn* とは言いません。'
    example_gloss: 頭が痛いです。
  nl.a1.unit16.lesson01.teach.heb_hoofdpijn:
    title: 頭が痛いとき
    gloss: 頭が痛いです。
    note: オランダ語では、症状は通常 *hebben*(持つ)と一緒に使います。
  nl.a1.unit16.lesson01.teach.buikpijn:
    title: 腹痛
    gloss: 腹痛
    note: '*hoofdpijn* と同じく、冠詞をつけません。'
    example_gloss: お腹が痛いです。
  nl.a1.unit16.lesson01.teach.heb_buikpijn:
    title: お腹が痛いとき
    gloss: お腹が痛いです。
    note: '*hoofdpijn* と同じ *hebben* のパターンです。'
  nl.a1.unit16.lesson02.teach.wat_is_er:
    title: 広く尋ねる
    gloss: どうしたの?
    note: 何かあったのかを尋ねるときに使える、万能な言い方です。
  nl.a1.unit16.lesson02.teach.wat_scheelt:
    title: よく使われる慣用表現
    gloss: どうしたの?
    note: '*Scheelt eraan* は決まった言い回しです。文字どおりに訳さないようにしましょう。'
  nl.a1.unit16.lesson02.teach.keelpijn:
    title: のどの痛み
    gloss: のどの痛み
    note: '*hoofdpijn*/*buikpijn* と同じく、冠詞をつけません。'
    example_gloss: のどが痛いです。
  nl.a1.unit16.lesson02.teach.heb_keelpijn:
    title: のどが痛いとき
    gloss: のどが痛いです。
    note: ほかの症状と同じ *hebben* のパターンです。
  nl.a1.unit16.lesson02.teach.gaat_het:
    title: 相手の様子を尋ねる
    gloss: 大丈夫ですか?いいえ、気分がよくありません。
    note: '*Gaat het?* は、友だち同士でよく使う、気軽な様子うかがいの質問です。'
  nl.a1.unit16.lesson03.teach.koorts:
    title: 熱
    gloss: 熱
    note: ほかの症状と同じく、*hebben* の後では冠詞をつけません。
    example_gloss: 熱があります。
  nl.a1.unit16.lesson03.teach.heb_koorts:
    title: 熱があるとき
    gloss: 熱があります。
    note: '*hebben* のパターンです。'
  nl.a1.unit16.lesson03.teach.verkouden:
    title: 風邪をひいている
    gloss: 風邪をひいている
    note: '*zijn* と一緒に使う形容詞です。*hebben* と使う名詞ではありません。間違えやすいので注意しましょう。'
    example_gloss: 風邪をひいています。
  nl.a1.unit16.lesson03.teach.ben_verkouden:
    title: 風邪をひいたと伝える
    gloss: 風邪をひいています。
    note: オランダ語では「風邪をひいている」を *zijn* + *verkouden* で表します。*Ik heb een verkouden* とは言いません。
  nl.a1.unit16.lesson03.teach.zijn_note:
    title: zijn と hebben の使い分けは、期間ではなく品詞で決まる
    gloss: Ziek と verkouden は形容詞なので zijn を使います(ik ben ziek、ik ben verkouden)。Koorts と hoofdpijn は名詞なので hebben を使います。
    note: '*zijn* と *hebben* の選択は、状態がどれだけ一時的かではなく、品詞(形容詞か、症状を表す名詞か)で決まります。*koorts*(名詞)は *verkouden*(形容詞)と同じくらい一時的ですが、*zijn* ではなく *hebben* を使います。'
  nl.a1.unit16.lesson04.teach.apotheek:
    title: 薬局
    gloss: 薬局
    note: de 語(通性名詞)です:*de apotheek*。
    example_gloss: 薬局に行きます。
  nl.a1.unit16.lesson04.teach.waarmee_helpen:
    title: 薬剤師のあいさつ
    gloss: どうされましたか?
    note: '*Waarmee kan ik u helpen?* は、お店や窓口での標準的で丁寧な声かけです。ユニット1・15で学んだ *u* の丁寧な言い方が続いています。'
  nl.a1.unit16.lesson04.teach.iets_tegen:
    title: 症状に合うものを頼む
    gloss: 頭痛に効くものはありますか?
    note: '*Iets tegen* + 症状は、薬をたのむときの自然な言い方です。'
  nl.a1.unit16.lesson04.teach.tablet:
    title: 錠剤
    gloss: 錠剤
    note: het 語(中性名詞)で *het tablet* ですが、ここでは不定の *een tablet* の形で使っています。
    example_gloss: 錠剤を1錠飲みます。
  nl.a1.unit16.lesson04.teach.neem_tablet:
    title: 服用の指示
    gloss: 錠剤を1日2回、1錠飲んでください。
    note: '*Neem* は *nemen*(取る、飲む)の命令形で、指示するときに使います。'
  nl.a1.unit16.lesson04.teach.register_note:
    title: 薬局での話し方
    gloss: 薬局では、丁寧な形 u を使います。
    note: 薬剤師は面識のないサービス業の大人なので、ユニット15の切符売り場と同じ丁寧さのルールになります。
  nl.a1.unit16.lesson05.teach.advies:
    title: 薬局のアドバイスのメモを読む
    gloss: アドバイス:錠剤を1日2回、水と一緒に飲んでください。よく休んで、水をたくさん飲んでください。3日たってもまだ気分がよくありませんか?それなら医者に行ってください。
    note: 服用の回数、薬以外の2つのすすめ、そして医者に行くタイミングに注目しましょう。
    glosses:
      Advies: アドバイス
      neem: 飲む
      keer: 回
      dag: 日
      tablet: 錠剤
      Rust: 休む
      drink: 飲む
      Voel: 感じる
      steeds: まだ
      lekker: 上手に
      huisarts: 医者・かかりつけ医
  nl.a1.unit16.lesson06.teach.lotte_ask:
    title: Lotte が様子を聞く
    gloss: Lotte:やあ Omar、調子はどう? もう少しよくなった?
    note: '*Al*(もう)は、前に話したときから Omar がよくなったかどうかを Lotte が気にしていることを表します。'
  nl.a1.unit16.lesson06.teach.omar_still_bad:
    title: Omar はまだ具合が悪い
    gloss: Omar:まだあまりよくないよ。まだ頭が痛くて、疲れているんだ。
    note: '*Nog steeds*(まだ)は、前からの頭痛が治っていないことを表します。*moe*(疲れた)は新しく覚える便利な形容詞です。'
  nl.a1.unit16.lesson06.teach.lotte_ask_tablet:
    title: Lotte が薬のことを聞く
    gloss: Lotte:錠剤は飲んだ?
    note: '*Genomen* は *nemen* の過去分詞で、ユニット12で学んだ *heb* + 過去分詞のパターンです。'
  nl.a1.unit16.lesson06.teach.omar_took_tablet:
    title: Omar が答える
    gloss: Omar:うん、錠剤を飲んだよ。これから休むね。
    note: '*Ga nu rusten*(これから休む)は、近い未来を表す *gaan* + 不定詞のパターンです。'
  nl.a1.unit16.lesson06.teach.lotte_wish:
    title: Lotte が気づかう
    gloss: Lotte:いい考えだね。ゆっくり休んで。お大事に!
    note: '*Beterschap!* は、早い回復を願うときの決まり文句です。'
  nl.a1.unit16.lesson06.teach.omar_thanks:
    title: Omar が挨拶して終える
    gloss: Omar:ありがとう、また明日!
    note: '*Tot morgen!* は、これまでのユニットの別れの挨拶と同じ *tot* + 時を表す言葉のパターンです。'
