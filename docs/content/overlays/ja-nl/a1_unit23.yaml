teaching:
  nl.a1.unit23.lesson01.teach.hoeveel_totaal:
    title: 合計金額をたずねる
    gloss: 合計でいくらですか？
    note: '*In totaal*(合計で)を付けると、1品だけの値段ではなく全部を合わせた金額を知りたいことがはっきりします。'
  nl.a1.unit23.lesson01.teach.kost_vijfentwintig:
    title: 合計金額を伝える
    gloss: 合計で25ユーロです。
    note: '*Kost* は *kosten*(値段がする)の三人称単数の形です。'
  nl.a1.unit23.lesson02.teach.pinnen_contant:
    title: カードや現金で支払う
    gloss: カードで支払う、現金で支払う
    note: '*Pinnen* はカード払いを表すオランダ語特有の動詞で、支払いの承認に使う暗証番号(PIN)に由来します。*contant betalen*(直訳は「現金で支払う」)は現金払いにあたる表現で、*contant* が副詞として *betalen* の前に来ます。'
    example_gloss:
    - ここでカードで支払えますか？
    - 現金で支払います。
  nl.a1.unit23.lesson02.teach.kan_ik_pinnen:
    title: カードが使えるかたずねる
    gloss: ここでカードで支払えますか？
    note: '*Hier*(ここで)は、今いる場所での話だと示しています。'
  nl.a1.unit23.lesson02.teach.wilt_u_betalen:
    title: 支払い方法の希望をたずねる
    gloss: 現金とカード、どちらでお支払いですか？
    note: '*Wilt u* ...? は *wil je* ...? の丁寧な形で、ここでは初対面の店員が使っています。'
  nl.a1.unit23.lesson03.teach.rekening:
    title: お会計
    gloss: そのお会計
    note: de を取る名詞(通性名詞)です：*de rekening*。
    example_gloss: 割り勘にしましょうか？
  nl.a1.unit23.lesson03.teach.rekening_delen:
    title: 割り勘を提案する
    gloss: 割り勘にしましょうか？
    note: '*Zullen we* ...? は、第11課と第19課で学んだ、提案をするときの言い方と同じです。'
  nl.a1.unit23.lesson03.teach.apart_afrekenen:
    title: 別々に支払いたいとたずねる
    gloss: 別々に支払ってもいいですか？
    note: '*Apart*(別々に)は *afrekenen*(会計を済ませる)を修飾します。afrekenen は *betalen* に近い語で、特に支払いを締めくくるときに使います。'
  nl.a1.unit23.lesson04.teach.wisselgeld:
    title: おつり
    gloss: おつり
    note: het を取る名詞(中性名詞)です：*het wisselgeld*。*wisselen*(交換する)と *geld*(お金)を合わせた複合語です。
    example_gloss: こちらがおつりです。
  nl.a1.unit23.lesson04.teach.hier_wisselgeld:
    title: おつりを渡す
    gloss: こちらがおつりです。
    note: '*Uw* は「あなたの」の丁寧な形で、レジやカウンターでのあらたまった場面に合っています。'
  nl.a1.unit23.lesson04.teach.geen_wisselgeld_nodig:
    title: おつりを断る
    gloss: おつりはいりません。
    note: '*Nodig hebben*(必要とする)は、第14課の *rugzak nodig hebben* と同じ形です。'
  nl.a1.unit23.lesson05.teach.vijfendertig:
    title: '35'
    gloss: '35'
    note: '*Vijfendertig*(直訳は「5と30」)は、複合の数で一の位を十の位より先に言う、オランダ語の標準的な型に従っています。'
    example_gloss: 35ユーロです。
  nl.a1.unit23.lesson05.teach.bonnetje:
    title: レストランのお会計を読む
    gloss: お会計：メインディッシュ2つとコーヒー2つ。合計：35ユーロ。カードで支払い済み。
    note: 注文した物、合計金額、支払い方法に注目しましょう。
    glosses:
      Rekening: お会計
      twee: '2'
      hoofdgerechten: メインディッシュ
      koffies: コーヒー
      Totaal: 合計
      vijfendertig: '35'
      euro: ユーロ
      Betaald: 支払い済み
      pin: カード
  nl.a1.unit23.lesson06.teach.lotte_ask_bill:
    title: ロッテが会計を頼む
    gloss: ロッテ：お会計をお願いしましょうか？
    note: '*Vragen*(頼む)は、*de rekening* を直接目的語に取ります。'
  nl.a1.unit23.lesson06.teach.omar_ask_total:
    title: オマルが合計金額を尋ねる
    gloss: オマル：うん、いい考えだね。全部でいくらですか？
    note: lesson01 に出てきた *hoeveel kost het in totaal?* という質問をもう一度使っています。
  nl.a1.unit23.lesson06.teach.lotte_state_total:
    title: ロッテが合計を伝える
    gloss: ロッテ：35ユーロだよ。割り勘にしようか？
    note: '*Delen*(分ける)は、文脈から *de rekening* を指しています。'
  nl.a1.unit23.lesson06.teach.omar_offer_pay:
    title: オマルが払うと言い張る
    gloss: オマル：いや、今日は僕に払わせて。いろいろ助けてもらったから。
    note: '*Laat mij* ...(私に~させて)は、何かを申し出るときの標準的な言い方です。*geholpen* は *helpen*(助ける)の過去分詞です。'
  nl.a1.unit23.lesson06.teach.lotte_thanks:
    title: ロッテが感激する
    gloss: ロッテ：優しいね！ありがとう。
    note: '*Lief van je*(優しいね)は、気前のよい行いに対して使う、温かくてよく使われるほめ言葉です。'
  nl.a1.unit23.lesson06.teach.omar_ask_card:
    title: オマルがカード払いについて尋ねる
    gloss: オマル：ここでカード払いはできますか？
    note: lesson02 に出てきた *kan ik hier pinnen?* という質問を、今度は実際のレストランで使っています。
  nl.a1.unit23.lesson06.teach.betaalt_form:
    title: Betaalt：三人称単数(彼・彼女)の形
    gloss: Omarが会計を払います。
    note: '*Betaalt*は*betalen*(支払う)の三人称単数の形です。'
