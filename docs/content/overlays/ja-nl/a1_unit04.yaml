teaching:
  nl.a1.unit04.lesson01.teach.hour:
    title: 時間
    gloss: 時(1時間)
    note: ちょうどの時刻は、数字の後に *uur* を付けます。*twee uur* は2時です。
    example_gloss: 2時です。
  nl.a1.unit04.lesson01.teach.two_oclock:
    title: 2時
    gloss: 2:00 — 2時
    note: ちょうどの時刻は、数字の後に *uur* を付けて言います。
  nl.a1.unit04.lesson01.teach.three_oclock:
    title: 3時
    gloss: 3:00 — 3時
    note: '*Drie uur* はちょうど3:00です。'
  nl.a1.unit04.lesson01.teach.half_three:
    title: 3時に向かう半分
    gloss: 2:30 — 2時半
    note: 重要な違い：日本語の「2時半」は2時を基準にしますが、オランダ語の *half drie* は次の時刻(3時)を基準にします。意味は2:30で、3:30ではありません。
  nl.a1.unit04.lesson01.teach.half_rule:
    title: halfは次の時刻を指す
    gloss: 3時の半分手前 = 3時に向かう途中 = 2:30
    note: '*half* + 時刻は、その時刻の半分手前と考えます。したがって *half vier* は3:30です。'
  nl.a1.unit04.lesson01.teach.half_four:
    title: 4時に向かう半分
    gloss: 3:30 — 3時半
    note: '*Half vier* は4時の半分手前なので、3:30を意味します。'
  nl.a1.unit04.lesson01.teach.time_answer:
    title: 半を言う
    gloss: 2時半です。
    note: '*Het is ...* は、今の時刻を言うときの普通の形です。'
  nl.a1.unit04.lesson02.teach.quarter:
    title: 15分
    gloss: 15分(4分の1時間)
    note: '*Kwart* は、決まった時刻表現 *kwart over* と *kwart voor* で使います。'
    example_gloss: 1クォーターアワーは15分です。
  nl.a1.unit04.lesson02.teach.quarter_past_two:
    title: 2時15分
    gloss: 2:15 — 2時15分
    note: '*Kwart over twee* は2時の15分後です。'
  nl.a1.unit04.lesson02.teach.past_rule:
    title: overは「過ぎ」
    gloss: 過ぎ = ちょうどの時刻の後
    note: 時刻の表現では、*over* は過ぎたばかりの時刻から数えます。
  nl.a1.unit04.lesson02.teach.quarter_to_three:
    title: 3時15分前
    gloss: 2:45 — 3時15分前
    note: '*Kwart voor drie* は3時の15分前なので、2:45です。'
  nl.a1.unit04.lesson02.teach.to_rule:
    title: voorは「前」
    gloss: 前 = 次のちょうどの時刻の前
    note: 時刻の表現では、*voor* は次の時刻に向かって数えます。
  nl.a1.unit04.lesson02.teach.quarter_past_three:
    title: 3時15分
    gloss: 3:15 — 3時15分
    note: '*Over* は過ぎたばかりの時刻を使います。*kwart over drie* です。'
  nl.a1.unit04.lesson02.teach.quarter_to_four:
    title: 4時15分前
    gloss: 3:45 — 4時15分前
    note: '*Voor* は近づいている時刻を示します。*kwart voor vier* は3:45です。'
  nl.a1.unit04.lesson03.teach.ask_time:
    title: 時刻をたずねる
    gloss: 何時ですか？
    note: '*Hoe laat is het?* は、今の時刻を尋ねる標準的な日常の表現です。'
  nl.a1.unit04.lesson03.teach.tell_time:
    title: 時刻を言う
    gloss: 2時半です。
    note: オランダ語の時刻を表す語 *drie* は「3」を指すので、これは2時30分になります。
  nl.a1.unit04.lesson03.teach.ask_start:
    title: 活動が始まる時間をたずねる
    gloss: 語学カフェは何時に始まりますか？
    note: '*Hoe laat* は、時刻をたずねる疑問文の最初に使います。'
  nl.a1.unit04.lesson03.teach.at_quarter:
    title: 2時15分に
    gloss: 2時15分です。
    note: 出来事がいつ起こるかを言うときは、時刻の前に *om* を使います。
  nl.a1.unit04.lesson03.teach.at_rule:
    title: 出来事の時刻にはomを使う
    gloss: ~に+時刻：2時に、2時半に
    note: '*Het is* で現在の時刻を言うだけのときは、*om* は使いません。'
  nl.a1.unit04.lesson03.teach.late:
    title: 遅刻かどうかをたずねる
    gloss: 私は遅刻ですか？
    note: ここでの *laat* は「遅い、遅れた」という意味です。時間に関するやり取りでよく使うフレーズです。
  nl.a1.unit04.lesson03.teach.on_time:
    title: 時間どおりだと伝える
    gloss: いいえ、時間どおりですよ。
    note: '*Op tijd* は「時間どおりに」という意味です。*Je* を使うと、くだけた言い方になります。'
  nl.a1.unit04.lesson04.teach.twenty_four_hour:
    title: 14時
    gloss: 14:00 — 14時
    note: 時刻表やアナウンスでは、24時間制がよく使われます。*Veertien uur* は14:00を誤解なく読み上げる言い方です。
  nl.a1.unit04.lesson04.teach.eighteen_hour:
    title: 18時
    gloss: 18:00 — 18時
    note: '*Achttien uur* は、午後6時を表す24時間制の言い方です。'
  nl.a1.unit04.lesson04.teach.morning:
    title: 朝の7時
    gloss: 7:00 — 朝の7時
    note: '*''s Ochtends* は「朝に」という意味です。先頭の *''s* は決まった表現の一部です。'
  nl.a1.unit04.lesson04.teach.afternoon:
    title: 午後の2時
    gloss: 14:00 — 午後の2時
    note: '*''s Middags* は正午ごろから始まる午後を表します。12時間制で話すときに、14:00と2:00を区別できます。'
  nl.a1.unit04.lesson04.teach.evening:
    title: 夜の8時
    gloss: 20:00 — 夜の8時
    note: '*''s Avonds* は夕方から夜、真夜中ごろまでの時間帯に使います。'
  nl.a1.unit04.lesson04.teach.night:
    title: 夜中の2時
    gloss: 2:00 — 夜中の2時
    note: '*''s Nachts* は夜間の時間帯に使います。2:00は *twee uur ''s nachts* と言うのが自然です。'
  nl.a1.unit04.lesson04.teach.day_parts:
    title: 一日の時間帯
    gloss: 朝 · 午後 · 夕方・夜 · 夜中
    note: オランダ語の時間帯の区切りはおおまかです。*ochtend* は正午ごろまで、*middag* は正午から午後いっぱい、*avond* は夜のうち早い時間帯、*nacht* は夜間を表します。
    example_gloss:
    - 私は朝にコーヒーを飲みます。
    - 語学カフェは午後にあります。
    - 私は夜に読書をします。
    - 私は夜中に眠ります。
  nl.a1.unit04.lesson05.teach.schedule:
    title: 予定表
    gloss: スケジュール
    note: '*Rooster* には、活動とその時間が並んでいます。'
    example_gloss: スケジュールを読みます。
  nl.a1.unit04.lesson05.teach.opening_hours:
    title: 語学カフェの営業時間
    gloss: 語学カフェ営業：14:00~16:00
    note: オランダの時刻表では、時と分の間に点を使うことがよくあります。14.00は14:00と同じ時刻です。
  nl.a1.unit04.lesson05.teach.welcome:
    title: ようこその時間
    gloss: 14:15 ようこそ
    note: 14.15は、12時間制の日常会話では *kwart over twee* と言えます。
  nl.a1.unit04.lesson05.teach.workshop:
    title: ワークショップの時間
    gloss: 14:45 ワークショップ
    note: 14.45は *kwart voor drie* で、3時の15分前です。
  nl.a1.unit04.lesson05.teach.break:
    title: 休憩の時間
    gloss: 15:30 休憩
    note: 15.30は *half vier* です。4時に向かって半分という考え方で、4時半ではありません。
  nl.a1.unit04.lesson05.teach.ask_schedule:
    title: 予定表の時間をたずねる
    gloss: ワークショップは何時に始まりますか。
    note: '*Begint* は、活動がいつ始まるかをたずねる動詞です。'
  nl.a1.unit04.lesson05.teach.workshop_answer:
    title: ワークショップの時間を答える
    gloss: 3時15分前に。
    note: 予定表の14.45は *kwart voor drie* にあたります。
  nl.a1.unit04.lesson06.teach.start_turn:
    title: 語学カフェの時間を確認する
    gloss: ロッテ：金曜日、語学カフェは何時に始まりますか？オマル：2時15分です。つまり14時15分ですね。
    note: オマルは両方の言い方をはっきり言っています。*kwart over twee* と14.15は同じ時刻です。予定表の「ようこそ」の時間とも一致します。
  nl.a1.unit04.lesson06.teach.workshop_turn:
    title: ワークショップについてたずねる
    gloss: ロッテ：ワークショップは何時に始まりますか？オマル：3時15分前です。
    note: '*Kwart voor drie* は14:45で、予定表と一致します。'
  nl.a1.unit04.lesson06.teach.arrival_turn:
    title: 到着時刻を伝える
    gloss: ロッテ：わかりました。では、2時にそこへ行きます。
    note: ロッテは14:00に着くつもりで、14:15の開始の15分前です。
  nl.a1.unit04.lesson06.teach.close_turn:
    title: 約束を締めくくる
    gloss: オマル：了解、では金曜日の午後に！
    note: '*Vrijdagmiddag* は「金曜日の午後」を表す、自然な複合語です。'
