    example_gloss: ユトレヒトまでの切符をお願いします。
  nl.a1.unit15.lesson01.teach.wil_graag:
    title: 切符を頼む
    gloss: ユトレヒトまでの切符をお願いします。
    note: '*Wil graag* は依頼をやわらかくする表現で、ユニット6の食べ物の注文で使ったのと同じ型です。'
  nl.a1.unit15.lesson01.teach.enkele_of_retour:
    title: 窓口の人が種類をたずねる
    gloss: 片道切符になさいますか、それとも往復ですか？
    note: '*Wilt u* は *willen* の丁寧な二人称の形で、ここでは初対面の駅員さんに対して使っています。'
  nl.a1.unit15.lesson01.teach.retour_alstublieft:
    title: 丁寧に答える
    gloss: 往復でお願いします。
    note: '*Alstublieft* は丁寧な「お願いします」で、このやりとりの *u* の丁寧さに合わせた表現です。'
  nl.a1.unit15.lesson01.teach.register_note:
    title: 窓口での言葉づかい
    gloss: 窓口では、たいてい丁寧な形の u を使います。
    note: ユニット1で学んだ *jij*/*je* と *u* の使い分けの続きです。接客の場面の知らない人には、基本的に *u* を使います。
  nl.a1.unit15.lesson02.teach.perron:
    title: ホーム
    gloss: ホーム
    note: '*Het perron* は中性名詞です。*de* ではなく *het* を使います。'
    example_gloss: ユトレヒト行きの電車は何番線から出ますか？
  nl.a1.unit15.lesson02.teach.welk_perron:
    title: ホームをたずねる
    gloss: ユトレヒト行きの電車は何番線から出ますか？
    note: '*Van welk perron* はホームを具体的にたずねる表現で、場所全般をたずねるのとは違います。'
  nl.a1.unit15.lesson02.teach.vertrektijd:
    title: 出発の情報を伝える
    gloss: 電車は10時15分前に5番ホームから出ます。
    note: '*Kwart voor tien* は、ユニット4の時刻の言い方と同じ型です。'
  nl.a1.unit15.lesson02.teach.hoe_laat_aan:
    title: 到着時刻をたずねる
    gloss: 電車は何時に到着しますか？
    note: '*Komt ... aan* は分離動詞(*aankomen*)で、*aan* は疑問文の最後に来ます。'
  nl.a1.unit15.lesson02.teach.aankomsttijd:
    title: 到着時刻を伝える
    gloss: 電車は11時に到着します。
    note: '*Komt aan* も、分離動詞の2つの部分が文の中で離れる例です。'
  nl.a1.unit15.lesson03.teach.op_tijd_de_vertraging:
    title: 定刻に/遅れ
    gloss: 定刻に；遅れ
    note: '*Op tijd* は、予定どおりに起こることを表す決まった表現です。*De vertraging*(遅れ)は de をとる名詞です。'
    example_gloss:
    - 電車は定刻に出発しません。
    - ご案内します。ユトレヒト行きの電車は遅れています。
  nl.a1.unit15.lesson03.teach.let_op:
    title: アナウンス
    gloss: ご案内します。ユトレヒト行きの電車は遅れています。
    note: '*Let op*(直訳は「注意を払って」)は、駅のアナウンスの冒頭で使い、日本語の「お知らせします」「ご案内します」に近い表現です。'
  nl.a1.unit15.lesson03.teach.niet_op_tijd:
    title: 「定刻に」を否定する
    gloss: 電車は定刻に出発しません。
    note: '*Niet* は *op tijd* の直前に置き、表現全体を否定します。'
  nl.a1.unit15.lesson03.teach.ander_perron:
    title: ホームの変更
    gloss: 電車は5番ホームではなく3番ホームから出ます。
    note: '*In plaats van* は「〜の代わりに」という意味です。'
  nl.a1.unit15.lesson03.teach.tien_minuten_vertraging:
    title: 遅れの長さを伝える
    gloss: 電車は10分遅れています。
    note: '*Heeft vertraging*(直訳は「遅れを持っている」)は、遅れていることを言う自然な表現で、形容詞 *vertraagd* もあります。'
  nl.a1.unit15.lesson04.teach.ingang_uitgang_wachtruimte:
    title: 入口、出口、待合室
    gloss: 入口；出口；待合室
    note: '*De ingang*、*de uitgang*、*de wachtruimte* はどれも de をとる名詞です。'
    example_gloss:
    - 入口はどこですか？
    - 出口はどこですか？
    - 待合室はどこですか？
  nl.a1.unit15.lesson04.teach.waar_perron_zeven:
    title: ホームの場所をたずねる
    gloss: 7番線はどこですか。
    note: ユニット9の道案内のレッスンで学んだ *Waar is...?* の型をもう一度使っています。
  nl.a1.unit15.lesson04.teach.rechtdoor_rechts:
    title: 道を教える
    gloss: まっすぐ行って、それから右です。
    note: '*Rechtdoor* と *rechts* はユニット9で学んだ方向の言葉で、ここでは駅の場面で再び使っています。'
  nl.a1.unit15.lesson04.teach.waar_wachtruimte:
    title: 待合室についてたずねる
    gloss: 待合室はどこですか？
    note: 同じ質問の型を、新しい場所に使っています。
  nl.a1.unit15.lesson05.teach.kaartje_tekst:
    title: 印刷された切符を読む
    gloss: 切符：アムステルダム中央駅からユトレヒト中央駅。出発：10時10分、7番線。到着：10時50分。往復。料金：12ユーロ40セント。
    note: 出発時刻とホーム、到着時刻、切符の種類、料金を読み取りましょう。
    glosses:
      Kaartje: 入場券
      Vertrek: 出発
      tien: '10'
      perron: ホーム
      zeven: '7'
      Aankomst: 到着
      elf: '11'
      Retour: 往復切符
      Prijs: 料金
      twaalf: '12'
      euro: ユーロ
      veertig: '40'
  nl.a1.unit15.lesson06.teach.omar_open:
    title: オマールが予定を話す
    gloss: オマール：7番線に行かなきゃ。電車は10時10分に出るよ。
    note: '*Moeten*(〜しなければならない)は、ここでは厳しい義務ではなく、実際に必要なことを表します。'
  nl.a1.unit15.lesson06.teach.lotte_sign:
    title: ロッテが案内板を読む
    gloss: ロッテ：見て、そこに案内板があるよ。遅延、10分だって。
    note: '*Daar staat*(直訳は「そこに立っている」)は、案内板に何かが表示されていると言うときの自然な言い方です。'
  nl.a1.unit15.lesson06.teach.omar_coffee:
    title: オマールは落ち着いている
    gloss: オマール：問題ないよ、コーヒーを飲む時間はまだあるし。
    note: '*Geen probleem* は、気軽に安心させるときによく使う表現です。'
  nl.a1.unit15.lesson06.teach.lotte_train_arrives:
    title: 電車が到着する
    gloss: ロッテ：いいね。あ、もう電車が来てるよ。7番線、ぴったり！
    note: '*Al*(もう)は、遅延が知らされた直後なのに、電車が思ったより早く着いたことを表します。'
  nl.a1.unit15.lesson06.teach.omar_board:
    title: 電車に乗る
    gloss: オマール：さあ、乗ろう。ユトレヒト、いま行くよ！
    note: '*Stappen in*(乗り込む)は分離動詞で、*in* は節の最後に来ます。*We komen eraan*(直訳は「私たちはそれに向かって来ている」)は、「いま行くよ」と言う自然なオランダ語の言い方で、直訳すると不自然に聞こえます。'
