teaching:
  nl.a1.unit07.lesson01.teach.markt_winkel_kraam:
    title: 市場、店、屋台
    gloss: 市場、店、屋台
    note: '*De markt* は市場全般、または定期的に開かれる屋外の市場を指します。*De winkel* は店のことです。*Kraam* は屋外の市場にある屋台です。'
    example_gloss:
    - 市場に行きます。
    - 店に行きます。
    - その屋台ではりんごを売っています。
  nl.a1.unit07.lesson01.teach.appels_peren_tomaten_paprikas:
    title: りんご、洋なし、トマト、パプリカ
    gloss: りんご、洋なし、トマト、パプリカ
    note: 単数形は *appel*、複数形は *appels* です。単数形は *peer*、複数形は *peren* です。単数形は *tomaat*、複数形は *tomaten* です。オランダ語の *paprika* はピーマンに似た大きな野菜(パプリカ)のことで、書くときの複数形は *paprika's* です。日本語では名詞の形は変わりませんが、オランダ語では単数形と複数形で語形が変わります。
    example_gloss:
    - りんごをください。
    - 洋なしをください。
    - トマトをください。
    - パプリカをください。
  nl.a1.unit07.lesson02.teach.kilo:
    title: 1キロ
    gloss: 1キロ
    note: '*Een kilo* は1キログラムのことです。'
    example_gloss: りんごを1キロください。
  nl.a1.unit07.lesson02.teach.per_kilo:
    title: Per kilo
    gloss: 1キロあたり
    note: 市場の値札は、1キロあたりの値段で書かれていることがよくあります。
  nl.a1.unit07.lesson02.teach.ask_apples:
    title: りんご1キロはいくらですか。
    gloss: りんご1キロはいくらですか。
    note: '*Hoeveel kost ...?* は値段をたずねる表現です。ここで値段がつくものは *een kilo* なので、単数形の *kost* を使います。'
  nl.a1.unit07.lesson02.teach.answer_apples:
    title: りんご1キロは €2,50 です
    gloss: りんご1キロは €2,50 です。
    note: オランダでは値段の小数点にコンマを使います：€2,50。日本語の「2.50」のようなピリオドではありません。
  nl.a1.unit07.lesson02.teach.spoken_price:
    title: 2ユーロ50
    gloss: €2,50 ― 2ユーロ50
    note: €2,50 は、*en* や *cent* を付けずに *twee euro vijftig* と言うのが普通です。
  nl.a1.unit07.lesson03.teach.gram_pond_stuk_stuks:
    title: グラム、ポンド、1個、2個
    gloss: 100グラム、1ポンド(500グラム)、1個、2個
    note: 数字のあとでは、ここでは *grammen* ではなく *gram* を使います。日常のオランダ語では *een pond* は500グラムのことで、昔からの口語的な言い方であり、正式なメートル法の単位ではありません(英米のポンドは約454グラムです)。*Per stuk* は1個ごとに値段がつくという意味です。1より大きい数で個数だけを言うときは、*twee stuks* のように *stuks* を使います。
    example_gloss:
    - チーズを100グラムください。
    - りんごを1ポンドお願いします。
    - 1ついただけますか。
    - 2つお願いします。
