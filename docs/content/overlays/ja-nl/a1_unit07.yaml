  nl.a1.unit07.lesson05.teach.take_pears:
    title: では、洋梨を1キロください
    gloss: では、洋梨を1キロください。
    note: '*Dan neem ik ...*は、値段を聞いたあとに買うものを決めるときの自然な言い方です。'
  nl.a1.unit07.lesson05.teach.anything_else:
    title: ほかに何かありますか？
    gloss: ほかに何かありますか？
    note: 売り手がよく使う、短い続きの質問です。
  nl.a1.unit07.lesson05.teach.no_thanks:
    title: いいえ、結構です
    gloss: いいえ、結構です。
    note: '*Dank u*は、売り手に対して使う丁寧な*u*の言い方に合っています。'
  nl.a1.unit07.lesson05.teach.total:
    title: 合計で€3.00です
    gloss: 合計で€3.00です。3ユーロです。
    note: '*Dat is dan ...*は、売り手が合計金額を伝えるときによく使う言い方です。書かれた価格€3,00は、*drie euro*と読みます。'
  nl.a1.unit07.lesson05.teach.pin:
    title: カードで払えますか？
    gloss: カードで払えますか？
    note: '*Pinnen*は、端末でデビットカードやクレジットカードを使って支払うことを表す、オランダ語の日常的な動詞です。'
  nl.a1.unit07.lesson06.teach.opening:
    title: あいさつと値段の質問
    gloss: 店員：こんにちは。何にしますか？ Lotte：こんにちは。りんご1キロはいくらですか？
    note: これは、客と売り手の親しみのある丁寧なやり取りです。
  nl.a1.unit07.lesson06.teach.purchase:
    title: 量を決める
    gloss: 店員：1キロ2ユーロ50セントです。 Lotte：では、1キロください。
    note: 前の発言でりんごの話だと分かっているので、Lotteは単に*een kilo*と言えます。
  nl.a1.unit07.lesson06.teach.payment:
    title: カードで支払う
    gloss: 店員：合計で2ユーロ50セントです。 Lotte：カードで払えますか？ 店員：はい、もちろんです。
    note: '*Kan ik pinnen?*は、支払いの場面で使う、ごく普通の実用的な質問です。'
  nl.a1.unit07.lesson06.teach.closing:
    title: やり取りを終える
    gloss: Lotte：ありがとうございます。さようなら！ 店員：さようなら！
    note: '*Tot ziens*は、このような丁寧な接客のやり取りを締めくくるのにふさわしい言い方です。'
