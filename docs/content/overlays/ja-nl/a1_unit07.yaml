    note: 店の人は丁寧な *u* を使います。*Hoeveel* は重さにも個数にも使えます。
  nl.a1.unit07.lesson03.teach.pond_tomatoes:
    title: トマトを1ポンドお願いします
    gloss: トマトを1ポンド(500 g)お願いします。
    note: 店の人に *Hoeveel wilt u?* と聞かれたときの、完結した自然な短い答え方です。
  nl.a1.unit07.lesson04.teach.prijskaartje:
