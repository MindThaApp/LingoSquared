    gloss: りんご：1キロ €2,50。洋なし：1キロ €3,00。トマト：1キロ €2,00。パプリカ：1個 €1,00。
    note: '*per kilo*は「1キロあたり」、*per stuk*は「1個あたり」と読みます。オランダの値札では、価格の小数点にコンマを使います。'
    glosses:
      Appels: りんご
      kilo: キログラム
