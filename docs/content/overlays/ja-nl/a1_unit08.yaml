teaching:
  nl.a1.unit08.lesson01.teach.station_supermarkt_bibliotheek_ziekenhuis:
    title: 駅、スーパー、図書館、病院
    gloss: 駅、スーパー、図書館、病院
    note: '*station* には *het* を使います:*het station*。オランダ語では *supermarkt* は1語で書きます:*de supermarkt*。*bibliotheek* には *de* を使います:*de bibliotheek*。オランダ語では *ziekenhuis* は1語で書きます:*het ziekenhuis*。'
    example_gloss:
    - 駅はどこですか。
    - スーパーは駅の隣にあります。
    - 図書館は駅の向かいにあります。
    - 病院は図書館の後ろにあります。
  nl.a1.unit08.lesson01.teach.bank_postkantoor_bushalte:
    title: 銀行、郵便局、バス停
    gloss: 銀行、郵便局、バス停
    note: 金融機関の銀行は *de bank* と言います。*postkantoor* は1語で書き、*het* を使います:*het postkantoor*。*bushalte* も1語で書き、*de* を使います:*de bushalte*。
    example_gloss:
    - 銀行はスーパーの隣にあります。
    - 郵便局は図書館と病院の間にあります。
    - バス停は駅の前にあります。
  nl.a1.unit08.lesson02.teach.naast_tegenover:
    title: 隣、向かい
    gloss: ~の隣に、~の向かいに
    note: '*Naast* は、あるものが別のもののすぐ横にあることを表します。*Tegenover* は、通りや広場をはさんで2つの場所が向かい合っていることを表します。'
    example_gloss:
    - 銀行はスーパーの隣にあります。
    - 図書館は駅の向かいにあります。
  nl.a1.unit08.lesson02.teach.supermarket_next:
    title: スーパーは駅の隣にあります
    gloss: スーパーは駅の隣にあります。
    note: '*Naast* は「すぐ横に」という意味です:*De supermarkt is naast het station*。'
  nl.a1.unit08.lesson02.teach.library_opposite:
    title: 図書館は駅の向かいにあります
    gloss: 図書館は駅の向かいにあります。
    note: '*station* には *het* をつけたままにします:*tegenover het station*。'
  nl.a1.unit08.lesson03.teach.achter_voor:
    title: 後ろ、前
    gloss: ~の後ろに、~の前に
    note: '*Achter* は、ある場所が別の場所の後ろにあることを表します。ここでの *voor* は「~の前に」という意味ですが、他の文では別の意味にもなります。'
    example_gloss:
    - 病院は図書館の後ろにあります。
    - バス停は駅の前にあります。
  nl.a1.unit08.lesson03.teach.hospital_behind:
    title: 病院は図書館の後ろにあります
    gloss: 病院は図書館の後ろにあります。
    note: '*achter* は基準になる場所の前に置きます:*achter de bibliotheek*。'
  nl.a1.unit08.lesson03.teach.stop_in_front:
    title: バス停は駅の前にあります
    gloss: バス停は駅の前にあります。
    note: ここでは *voor* はバス停の場所を表しています。
  nl.a1.unit08.lesson04.teach.waar_is:
    title: ~はどこですか
    gloss: ~はどこですか。
    note: '*Waar is ...?* は、1つの場所がどこにあるかを尋ねるときに使います。'
  nl.a1.unit08.lesson04.teach.where_post_office:
    title: 郵便局はどこですか
    gloss: 郵便局はどこですか。
    note: この質問でも、*postkantoor* には *het* をつけたままにします。
  nl.a1.unit08.lesson04.teach.tussen_bij:
    title: 間、近く・そば
    gloss: ~の間に、~の近くに・~のそばに
    note: '*tussen ... en ...* は、ある場所が2つの場所の間にあることを表します。*Bij* は、ある場所が別の場所の近くにあることを表し、*naast* ほど正確ではありません。'
    example_gloss:
    - 郵便局は図書館と病院の間にあります。
    - スーパーは駅の近くにあります。
  nl.a1.unit08.lesson04.teach.in_de_buurt_van:
    title: 近く
    gloss: ~の近く
    note: '*in de buurt van* は、全体で「ある場所の近く」という意味になります。'
  nl.a1.unit08.lesson04.teach.post_office_between:
    title: 郵便局は2つの場所の間にあります
    gloss: 郵便局は図書館と病院の間にあります。
    note: 他の2つの場所の間に *en* を入れます。
  nl.a1.unit08.lesson04.teach.supermarket_near:
    title: スーパーは駅の近くにあります
    gloss: スーパーは駅の近くにあります。
    note: '*Bij* は、建物がすぐ隣にあるとまでは言わずに、近くにあることを表します。'
  nl.a1.unit08.lesson04.teach.library_vicinity:
    title: 図書館は駅の近くにあります
    gloss: 図書館は駅の近くにあります。
    note: '*in de buurt van* はひとまとまりで覚えましょう:*in de buurt van het station*。'
  nl.a1.unit08.lesson05.teach.kaart_buurtkaart:
    title: 地図、近隣地図
    gloss: 地図、近隣地図
    note: '*De kaart* は地図の意味にも、他の種類のカードの意味にもなります。ここでは地図の意味です。*buurtkaart* は1語で書きます:*de buurtkaart*。'
    example_gloss:
    - 地図はどこですか。
    - ここに近隣地図があります。
  nl.a1.unit08.lesson05.teach.map_labels:
    title: 近隣地図の表示
    gloss: 図書館:駅の向かい。病院:図書館の後ろ。郵便局:図書館と病院の間。スーパー:駅の隣。銀行:スーパーの隣。バス停:駅の前。
    note: それぞれの表示は、場所の名前とその場所がどこにあるかを示しています。
    glosses:
      BUURTKAART: 近隣地図
