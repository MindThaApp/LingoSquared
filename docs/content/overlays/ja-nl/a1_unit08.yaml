  nl.a1.unit08.lesson06.teach.opening:
    title: 地図を見る
    gloss: ロッテ:見て、ここに近隣地図があるよ。オマル:いいね。バス停はどこ?
    note: ロッテとオマルはいつものようにくだけた話し方をしています。
  nl.a1.unit08.lesson06.teach.stop_location:
    title: バス停の場所を伝える
    gloss: ロッテ:バス停は駅の前だよ。
    note: ロッテは場所を一文ではっきり答えています。
  nl.a1.unit08.lesson06.teach.more_places:
    title: スーパーの場所を伝える
    gloss: オマル:それで、スーパーはどこですか。 ロッテ:スーパーは駅の隣、銀行の近くです。
    note: この答えでは、スーパーの場所を二つの場所との位置関係で説明しています。
  nl.a1.unit08.lesson06.teach.library:
    title: 図書館の場所を伝える
