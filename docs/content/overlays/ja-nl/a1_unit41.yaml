    title: Nina がみんなについて聞きます
    gloss: Ninaはtaalcafé(言語カフェ)に来たばかりです。ほかの人たちがどんな人か、Omarに尋ねます。Omarが教えてくれます。Lotteは親切で辛抱強く、看護師として働いています。Sanderは面白くて、スペイン語の講座を受けています。Fennaは好奇心が強く、新しいことを学ぶのが好きです。Omar自身は落ち着いた人です。
    note: ここでは、グループのみんなの性格を比較しながら復習します。
