teaching:
  nl.a1.unit02.lesson01.teach.zero_to_four:
    title: 0から4
    gloss: 0 — ゼロ、1 — 一、2 — 二、3 — 三、4 — 四
    note: オランダ語の nul はゼロのことで、電話番号の最初の数字にも使います。één のアクセント記号は、書くときに数字と冠詞の een を区別するためのものです。意味が明らかな場合、ふつうの文章では省略されることもあります。
    example_gloss:
    - 0ユーロ持っています。
    - 本を1冊持っています。
    - 椅子を2脚持っています。
    - 本を3冊持っています。
    - 4人います。
  nl.a1.unit02.lesson01.teach.five_to_eight:
    title: 5から8
    gloss: 5 — 五、6 — 六、7 — 七、8 — 八
    note: Vijf、zes、zeven、acht も、0から4と同じ単純なパターンです。
    example_gloss:
    - 5ユーロ持っています。
    - 本を6冊持っています。
    - 椅子を7脚持っています。
    - 8人います。
  nl.a1.unit02.lesson01.teach.nine_to_twelve:
    title: 9から12
    gloss: 9 — 九、10 — 十、11 — 十一、12 — 十二
    note: Negen、tien、elf、twaalf で、12までの数字がそろいます。
    example_gloss:
    - 9ユーロ持っています。
    - 椅子を10脚持っています。
    - 本を11冊持っています。
    - 12人います。
  nl.a1.unit02.lesson01.teach.how_many:
    title: 数を尋ねる
    gloss: いくつ?
    note: Hoeveel は数や量を尋ねる言葉です。
  nl.a1.unit02.lesson02.teach.teens:
    title: 13から19
    gloss: 13–19:十三、十四、十五、十六、十七、十八、十九
    note: 13から19のオランダ語の形は、-tien で終わります。
    example_gloss:
    - 13歳です。
    - 14ユーロ持っています。
    - 15歳です。
    - 本を16冊持っています。
    - 17人います。
    - 18歳です。
    - 椅子を19脚持っています。
  nl.a1.unit02.lesson02.teach.tens:
    title: 10の倍数
    gloss: 20–90:二十、三十、四十、五十、六十、七十、八十、九十
    note: これらの十の位の数は、もっと大きな2桁の数を作る土台として覚えましょう。
    example_gloss:
    - 20歳です。
    - それは30ユーロです。
    - 40ユーロ持っています。
    - 50人います。
    - 60歳です。
    - それは70ユーロです。
    - 80人います。
    - 90ユーロ持っています。
  nl.a1.unit02.lesson02.teach.inversion_rule:
    title: 一の位が十の位の前に来る
    gloss: 21–99(30、40などちょうどの十の位を除く):一の位 + en + 十の位
    note: 日本語では「四十二」のように十の位を先に言いますが、オランダ語では通常、一の位を先に言います。42は文字どおり「2と40」です。ちょうど十の倍数のときは、十の位の語だけを使います。
  nl.a1.unit02.lesson02.teach.twenty_one:
    title: '21'
    gloss: 21 — 二十一
    note: Eenentwintig は een + en + twintig を1語につなげて書いたものです。
    example_gloss: 言語カフェは21号室です。
  nl.a1.unit02.lesson02.teach.twenty_two:
    title: '22'
    gloss: 22 — 二十二
    note: tweeëntwintig の ë の2つの点は、隣り合う母音が別々の音節の始まりであることを示します。
    example_gloss: 22歳です。
  nl.a1.unit02.lesson02.teach.thirty_two:
    title: '32'
    gloss: 32 — 三十二
    note: Tweeëndertig は1語で書き、つなぎの ë に2つの点が付きます。
    example_gloss: Omar は32歳です。
  nl.a1.unit02.lesson02.teach.forty_two:
    title: '42'
    gloss: 42は四十二です。
    note: 十の位より先に一の位を言います。twee-en-veertig と言い、つなげて tweeënveertig と書きます。
  nl.a1.unit02.lesson02.teach.forty_eight:
    title: '48'
    gloss: 48 — 四十八
    note: Achtenveertig は acht + en + veertig で、一語で書きます。
    example_gloss: 私は48番地に住んでいます。
  nl.a1.unit02.lesson02.teach.seventy_five:
    title: '75'
    gloss: 75 — 七十五
    note: Vijfenzeventig は vijf(5)を zeventig(70)の前に置きます。
    example_gloss: それは75セントです。
  nl.a1.unit02.lesson02.teach.ninety_nine:
    title: '99'
    gloss: 99 — 九十九
    note: Negenennegentig は一つの複合語です。
    example_gloss: 私は99歳です。
  nl.a1.unit02.lesson03.teach.ask_phone:
    title: 電話番号をたずねる
    gloss: 電話番号は何番ですか?
    note: Je を使うとくだけた聞き方になります。ロッテとオマルの言語カフェの場面に合っています。
  nl.a1.unit02.lesson03.teach.phone_number:
    title: オランダの携帯電話番号を伝える
    gloss: 私の電話番号は06 21 43 65 87です。
    note: オランダの携帯電話番号は06で始まり、ふつう06の後に8桁の数字を続けて表記します。
  nl.a1.unit02.lesson03.teach.phone_spoken:
    title: 電話番号をグループに分けて言う
    gloss: ゼロ六、二十一、四十三、六十五、八十七
    note: 電話番号の区切り方は人によってさまざまです。このコースでは06の後に2桁ずつ区切るやり方を使いますが、はっきり伝えたいときは1桁ずつ言うのも普通です。
  nl.a1.unit02.lesson03.teach.ask_house_number:
    title: 番地を尋ねる
    gloss: 番地は何番ですか?
    note: Huisnummer は、住所の中で家や建物につけられた番号のことです。
  nl.a1.unit02.lesson03.teach.house_number:
    title: 番地を答える
    gloss: 私の番地は48です。
    note: 書いた住所や用紙では、数字で書くのが自然です。
  nl.a1.unit02.lesson03.teach.live_number:
    title: 番地で住んでいる場所を伝える
    gloss: 私は48番地に住んでいます。
    note: 通りの名前がすでにわかっているとき、Op nummer ... は番地を言う自然な言い方です。
  nl.a1.unit02.lesson03.teach.repeat:
    title: 繰り返しをお願いする
    gloss: それをもう一度言ってもらえますか?
    note: 口頭で言われた電話番号が速すぎて聞き取れなかったときに便利です。
  nl.a1.unit02.lesson04.teach.ask_age:
    title: くだけた言い方で年齢を尋ねる
    gloss: 何歳ですか。
    note: くだけた je を使っています。年齢を尋ねるのは、場面上それが自然なときだけにしましょう。
  nl.a1.unit02.lesson04.teach.age_twenty_eight:
    title: 年齢を言う
    gloss: 私は28歳です。
    note: 日本語では「〜歳です」と言いますが、オランダ語では Ik ben ... jaar と言います。直訳すると「私は…年です」にあたる形です。
  nl.a1.unit02.lesson04.teach.age_thirty_two:
    title: オマルの年齢を言う
    gloss: Omar は32歳です。
    note: 年齢を言うとき、数の後ろの jaar には複数形の語尾がつきません。
  nl.a1.unit02.lesson04.teach.how_many_people:
    title: 人数を尋ねる
    gloss: 何人いますか?
    note: Hoeveel は名詞 mensen の直前に置きます。
  nl.a1.unit02.lesson04.teach.twelve_people:
    title: 人数を答える
    gloss: 12人います。
    note: Er zijn は、複数のものが「ある・いる」ときの普通の言い方です。
  nl.a1.unit02.lesson04.teach.three_books:
    title: 本を数える
    gloss: 本を3冊持っています。
    note: 1より大きい数の後では、boek は複数形の boeken になります。
  nl.a1.unit02.lesson04.teach.seven_chairs:
    title: 椅子を数える
    gloss: 椅子7脚
    note: Stoelen は stoel の複数形です。
  nl.a1.unit02.lesson05.teach.euro:
    title: Euro
    gloss: ユーロ
    note: 金額を言うとき、euro はふつう単数形のままです。twee euro であって、twee euro's ではありません。
    example_gloss: それは2ユーロです。
  nl.a1.unit02.lesson05.teach.cent:
    title: Cent
    gloss: セント
    note: 値段を言うとき、cent も数の後でふつう単数形のままです。
    example_gloss: それは50セントです。
  nl.a1.unit02.lesson05.teach.ask_price:
    title: 値段を尋ねる
    gloss: これはいくらですか?
    note: Hoeveel は量や金額を尋ね、kost は「(値段が)かかる」という意味です。
  nl.a1.unit02.lesson05.teach.two_fifty:
    title: 2ユーロ50セント
    gloss: €2.50 — 2ユーロ50セント
    note: 日本語では小数点にピリオドを使いますが、オランダ語では小数点にコンマを使います。日常の会話では €2,50 はふつう twee euro vijftig と言い、en は入れません。
  nl.a1.unit02.lesson05.teach.seventy_five_cents:
    title: 75セント
    gloss: €0.75 — 75セント
    note: 金額が1ユーロ未満のときは、セントだけを言うのが自然です。
  nl.a1.unit02.lesson05.teach.twelve_euros:
    title: 12ユーロ
    gloss: €12 — 12ユーロ
    note: ちょうどのユーロ金額には、セントの表現は必要ありません。
  nl.a1.unit02.lesson05.teach.four_fifty:
    title: 4ユーロ50セント
    gloss: €4.50 — 4ユーロ50セント
    note: ほかのユーロとセントの値段でも、同じ言い方が使えます。
  nl.a1.unit02.lesson05.teach.costs:
    title: 値段を答える
    gloss: それは2ユーロ50セントです。
    note: Dat kost ... は、Hoeveel kost dit? にそのまま答える言い方です。
  nl.a1.unit02.lesson06.teach.opening:
    title: オマルが申し込む
    gloss: 職員:こんにちは。言語カフェに来られましたか?オマル:はい、申し込みたいです。
    note: この場面は、第1ユニットで始まったオマルの図書館の言語カフェ通いの続きです。
  nl.a1.unit02.lesson06.teach.phone_turn:
    title: 電話番号を伝える
    gloss: 職員:わかりました。電話番号は何番ですか?オマル:06 21 43 65 87です。
    note: オマルは、先ほど練習した2桁ずつの区切りで番号を言っています。
  nl.a1.unit02.lesson06.teach.house_turn:
    title: 番地を答える
    gloss: 職員:それから、番地は何番ですか?オマル:48です。
    note: 質問で状況がわかっているときは、数字だけの短い答えが自然です。
  nl.a1.unit02.lesson06.teach.fee_turn:
    title: 参加費を理解する
    gloss: 職員:参加費は2ユーロ50セントです。オマル:わかりました。
    note: 口に出して言う値段は、日常的な「ユーロ+セント」の形になります。
  nl.a1.unit02.lesson06.teach.group_turn:
    title: グループの人数を尋ねる
    gloss: オマル:グループには何人いますか?職員:12人です。
    note: この場面では、このユニットで先に学んだ Hoeveel mensen ... の質問の形をもう一度使っています。
  nl.a1.unit02.lesson06.teach.room_turn:
    title: 部屋の番号を見つける
    gloss: 職員:言語カフェは21号室です。
    note: Zaal は、活動のために使う部屋やホールのことです。
  nl.a1.unit02.lesson06.teach.lotte_turn:
    title: ロッテのテーブルを見つける
    gloss: ロッテ:こんにちは、オマル!私たちは7番テーブルに座っているよ。
    note: この会話は、同じくだけた場面で、オマルがロッテと再会して終わります。
