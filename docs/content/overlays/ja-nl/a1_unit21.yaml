teaching:
  nl.a1.unit21.lesson01.teach.blij_verdrietig_boos:
    title: うれしい、悲しい、怒っている
    gloss: うれしい、悲しい、怒っている
    note: 気持ちを表す、基本的でよく使う3つの単語です。zijn(である)と一緒に使って、自分の気持ちを言います。
    example_gloss:
    - 私はうれしいです。
    - 私は悲しいです。
    - 私は怒っています。
  nl.a1.unit21.lesson01.teach.ben_blij:
    title: うれしいと言う
    gloss: 私はうれしいです。
    note: '*Zijn*(である)+ 気持ちを表す形容詞が基本の型で、日本語の「〜です」にあたります。'
  nl.a1.unit21.lesson01.teach.niet_boos:
    title: 気持ちを対比させる
    gloss: 私は怒っていません、悲しいんです。
    note: '*Niet* は *boos* を直接否定し、2つ目の文で本当の気持ちを述べています。'
  nl.a1.unit21.lesson02.teach.waarom_blij:
    title: 理由をたずねる
    gloss: どうしてうれしいの？
    note: '*Waarom*(なぜ)は、理由を尋ねるときの標準的な疑問詞です。'
  nl.a1.unit21.lesson02.teach.blij_omdat_appartement:
    title: 理由を言う
    gloss: 新しいアパートがあるので、私はうれしいです。
    note: '*Omdat*(〜から)は理由を表す節を導き、その節では動詞が最後に来ます(*heb* が *appartement* の後ろに移ります)。'
  nl.a1.unit21.lesson02.teach.verdrietig_omdat_regent:
    title: よくない理由
    gloss: 雨が降っているので、私は悲しいです。
    note: 天気のユニットで出てきた *regent*(雨が降る)を、理由の節でもう一度使っています。
  nl.a1.unit21.lesson03.teach.zenuwachtig:
    title: 緊張している
    gloss: 緊張している
    note: 緊張を表す基本的な言葉です。
    example_gloss: 初めてのシフトの前で、私は緊張しています。
  nl.a1.unit21.lesson03.teach.eerste_dienst:
    title: 何に緊張しているかを言う
    gloss: 初めてのシフトの前で、私は緊張しています。
    note: 緊張の対象は *voor*(直訳は「〜のために」)で表します。日本語では「〜について」「〜に」などで言うところです。
  nl.a1.unit21.lesson03.teach.geen_zorgen:
    title: 相手を安心させる
    gloss: 心配しないで。
    note: '*Maak je geen zorgen*(直訳は「自分に心配を作らないで」)は、安心させるときの決まり文句です。'
  nl.a1.unit21.lesson04.teach.hoe_voelt_omar:
    title: 相手の気持ちをたずねる
    gloss: Omarはどう感じていますか？
    note: '*Voelen zich*(感じる、再帰動詞)は、気持ちの状態を尋ねたり述べたりするときの標準的な言い方で、ユニット16の健康のレッスンで使った、体の感覚を表す *voelen* とは別です。'
  nl.a1.unit21.lesson04.teach.hij_voelt_zich:
    title: 人の気持ちを説明する
    gloss: 彼は緊張しています。
    note: '*Zich*(自分自身)は三人称の再帰代名詞で、*voelt* と組み合わせて使います。'
  nl.a1.unit21.lesson04.teach.waarom_voelt_hij:
    title: 人がなぜそう感じるのかをたずねる
    gloss: なぜ彼は緊張しているのですか。
    note: '*waarom* と、*Hij voelt zich zenuwachtig* の *voelt zich* の型を組み合わせています。'
  nl.a1.unit21.lesson05.teach.bericht:
    title: 気持ちについてのメッセージを読む
    gloss: こんにちは、Lotte。初めて一人で入るシフトが少し不安です。でも、新しい仕事と新しいアパートができたので、うれしくもあります。きっとうまくいくと思います。
    note: 書き手が何に緊張しているか、何がうれしいのか、全体としてどう見通しているかをつかみましょう。
    glosses:
      beetje: 少し
      zenuwachtig: 緊張している
      eerste: 最初の
      dienst: シフト
      alleen: ひとりで
      blij: うれしい
      want: なぜなら
      nieuwe: 新しい
      baan: 仕事
      nieuw: 新しい
      appartement: アパート
      denk: 思う
      komt: うまくいく
  nl.a1.unit21.lesson06.teach.lotte_ask_feeling:
    title: LotteがOmarの気持ちを尋ねる
    gloss: 'Lotte：こんにちは、Omar。初めてのシフトについて、今どんな気持ち？'
    note: '*Voor je eerste dienst*(初めてのシフトについて)は、レッスン3で出てきた *voor* + 名詞の型をもう一度使っています。'
  nl.a1.unit21.lesson06.teach.omar_admit_nervous:
    title: Omarが緊張していると打ち明ける
    gloss: 'Omar：正直に言うと、少し緊張しているよ。'
    note: '*Eerlijk gezegd*(正直に言うと)は、打ち明け話の調子をやわらげます。'
  nl.a1.unit21.lesson06.teach.lotte_reassure:
    title: ロッテが安心させる
    gloss: ロッテ：心配しないで、きっとうまくできるよ！
    note: '*Je kunt het goed*(直訳は「あなたはそれをうまくできる」)は、励ますときの決まった言い方です。'
  nl.a1.unit21.lesson06.teach.omar_thanks_helps:
    title: オマルがお礼を言う
    gloss: オマル：ありがとう、本当に助かるよ。
    note: '*Helpt* は *helpen*(助ける)の三人称単数の形です。'
  nl.a1.unit21.lesson06.teach.lotte_predict:
    title: ロッテが結果を予想する
    gloss: ロッテ：そのあとは、きっととても嬉しくて誇らしい気持ちになるよ。
    note: '*Vast*(きっと)は自信のある予想を表します。*trots*(誇らしい)は新しい便利な形容詞です。'
  nl.a1.unit21.lesson06.teach.omar_agree:
    title: オマルが同意する
    gloss: オマル：うん、僕もそう思う。
    note: '*Dat denk ik ook*(直訳は「それを私も思う」)は、相手の意見に賛成するときの自然な言い方です。'
  nl.a1.unit21.lesson06.teach.summary_pronouns:
    title: is、zijn、hem でまとめる
    gloss: オマルは初めての勤務で緊張しています。ロッテは彼を助けます。
    note: '*Is* は *zijn*(~である)の三人称単数の形です。ここでの *zijn* は「彼の」(所有を表す語)で、*hem* は「彼を・彼に」(目的語の代名詞)です。他の人について話すときに欠かせない、小さな三つの語です。'
