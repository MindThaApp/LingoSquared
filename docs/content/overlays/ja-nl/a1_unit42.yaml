    title: ニナとロッテ、チューリップを買う
    gloss: ニナとロッテは土曜日にフラワーマーケットへ行きます。ロッテはどの色がほしいですか。ロッテは赤がほしいです。ニナはどの色がほしいですか。ニナは黄色がほしいです。二人はチューリップを5本買います。10ユーロです。チューリップはとてもきれいです！
    note: 土曜日の花市場へのお出かけを振り返る文章です。家庭、近所、郵便、料理、性格を扱う各単元と同じく、学んだ表現を比べながら確認できる構成になっています。
