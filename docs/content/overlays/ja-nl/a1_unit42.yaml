    note: すでに学んだ *Ik wil graag ...* の構文(Ik wil graag appels, Ik wil graag een koffie)をそのまま使います。新しい文法ではなく、使い方が増えるだけです。色はいつも *wil* の目的語として、または *zijn* の後の述語として使い、名詞の直前には直接置きません。名詞の前では色の語の語尾が変わる(*rood* が *rode* になる)ため、その変化のルールはこのコースではまだ扱いません。
