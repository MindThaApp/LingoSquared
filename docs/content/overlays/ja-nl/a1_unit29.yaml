teaching:
  nl.a1.unit29.lesson01.teach.hobbies_set1:
    title: 読書、運動、料理
    gloss: 読む、運動する／スポーツをする、料理する
    note: よく使う趣味の動詞が三つ:*lezen*(読む)、*sporten*(運動する、スポーツをする)、*koken*(料理する)。
    example_gloss:
    - 私は本を読むのが好きです。
    - 私は土曜日に運動します。
    - 私は友達のために料理するのが好きです。
  nl.a1.unit29.lesson01.teach.vrije_tijd:
    title: 自由時間
    gloss: 空いている時間
    note: '*De vrije tijd*(自由時間)はdeを使う名詞なので、*de vrije tijd*の形で覚えましょう。趣味について話すときの重要なフレーズです。'
    example_gloss: 私は自由時間に読書をするのが好きです。
  nl.a1.unit29.lesson01.teach.in_vrije_tijd:
    title: 自由時間にすることを伝える
    gloss: 私は自由時間に読書をするのが好きです。
    note: '*Lees*は*lezen*(読む)の一人称単数の形です。'
  nl.a1.unit29.lesson02.teach.hobbies_set2:
    title: 音楽、絵、ゲーム
    gloss: 音楽を聴く、絵を描く、ゲームをする
    note: 趣味の動詞をさらに三つ:*muziek luisteren*(音楽を聴く)、*tekenen*(絵を描く)、*gamen*(ゲームをする。外来語から来たオランダ語でよく使われる言葉です)。
    example_gloss:
    - 私は音楽を聴くのが好きです。
    - 私はよく絵を描きます。
    - 私は友達とゲームをするのが好きです。
  nl.a1.unit29.lesson02.teach.luister_muziek:
    title: 音楽を聴くのが好きだと伝える
    gloss: 私は音楽を聴くのが好きです。
    note: '*Luisteren naar*(〜を聴く)は、目的語の前に必ず*naar*を置きます。'
  nl.a1.unit29.lesson02.teach.game_vrienden:
    title: 友達とゲームをするのが好きだと伝える
    gloss: 私は友達とゲームをするのが好きです。
    note: '*Met vrienden*(友達と)の*vrienden*は、第1課で出てきた単語です。'
  nl.a1.unit29.lesson03.teach.frequency_set1:
    title: いつも、よく、ときどき、決して～ない
    gloss: いつも、よく、ときどき、決して～ない
    note: 基本となる頻度の副詞が四つ。*Vaak*は第5ユニットの*Zie je hem vaak?*ですでに出てきました。ほかの三つはここで初めて出てきます。
    example_gloss:
    - 私は毎週土曜日に運動します。
    - 私はよく本を読みます。
    - 私はときどき絵を描きます。
    - 私はゲームをまったくしません。
  nl.a1.unit29.lesson03.teach.frequency_set2:
    title: 毎週、毎週末
    gloss: 毎週、毎週末
    note: '*Elke week*と*elk weekend*はどちらも「毎〜」という意味ですが、名詞の性によって形が変わります。次のカードを見てください。'
    example_gloss:
    - 私は毎週、友達のために料理をします。
    - 私は毎週末、運動します。
  nl.a1.unit29.lesson03.teach.elke_elk_grammar:
    title: Elke と elk
    gloss: weekのような de の名詞には elke を、weekendのような het の名詞には elk を使います。
    note: '*Week*は de の名詞(*de week*)なので*elke*を取り、*weekend*は het の名詞(*het weekend*)なので*elk*を取ります。第23ユニットの*de rekening*と*het wisselgeld*と同じ、de と het の使い分けです。'
  nl.a1.unit29.lesson03.teach.vrije_tijd_vraag:
    title: 余暇の過ごし方を尋ねる
    gloss: 自由時間には何をしますか？
    note: これはこのユニットの中心となる質問です。相手の趣味を尋ねるときに使ってみましょう。
  nl.a1.unit29.lesson04.teach.lotte_callback:
    title: Lotteが趣味の話を切り出す
    gloss: Lotte:私たち、よくいっしょに散歩するよね。でも Omar、自由時間にはほかに何をしているの?
    note: '*We wandelen vaak samen*は第13ユニットを受けた表現で、そこではLotteもOmarも*wandelen*が好きだと言っていました。'
  nl.a1.unit29.lesson04.teach.omar_cook_sport:
    title: Omarの趣味
    gloss: Omar:料理が好きだよ、家でもね。それに、よく運動もしているよ。
    note: '*Ook thuis*(家でも)は、Omarが料理をするのはレストランの仕事のときだけでなく、楽しみでもあることを表しています。'
  nl.a1.unit29.lesson04.teach.lotte_surprised:
    title: Lotteは驚く
    gloss: Lotte:家でも料理するの?仕事で一日中もう料理しているのに!
    note: '*Al de hele dag*(もう一日中)は、Omarが仕事ですでにたくさん料理していることを強調しています。'
  nl.a1.unit29.lesson04.teach.omar_relaxing:
    title: Omarの説明
    gloss: Omar:うん、でも料理はリラックスできるんだ。君は?何をするのが好き?
    note: '*Koken vind ik ontspannend*は、強調のために目的語の*koken*を文頭に出しています。直訳すると「料理は、私にはリラックスできると思える」です。'
  nl.a1.unit29.lesson04.teach.lotte_reads_music:
    title: Lotteの趣味
    gloss: Lotte:読書が好きで、よく音楽を聴くよ。
    note: 第1〜2課の趣味の動詞二つを、*en*(〜と、そして)でつないだ一文です。
  nl.a1.unit29.lesson04.teach.omar_ask_game:
    title: Omarがゲームについて尋ねる
    gloss: Omar:ゲームもする?
    note: 第2課の*gamen*を使った、短いはい・いいえ疑問文です。
  nl.a1.unit29.lesson04.teach.lotte_no_game_draw:
    title: Lotteの答え
    gloss: Lotte:ううん、ゲームは全然しない。でも、ときどき絵は描くよ!
    note: 第3課の*nooit*(決して〜ない)と*soms*(ときどき)を、一つの答えの中で対比させています。
  nl.a1.unit29.lesson05.teach.vergelijking:
    title: 趣味を比べる
    gloss: Omarと私はよくいっしょに散歩します。でも、ほかにも趣味があります。Omarは料理が好きで、家でもしますし、よく運動もします。私は読書が好きで、よく音楽を聴きます。ときどき絵を描きますが、ゲームは全然しません。あなたは自由時間に何をするのが好きですか?
    note: Lotteのメッセージは第4課の内容をまとめ、このユニットの中心となる質問で終わっています。
    glosses:
      wandelen: 散歩する
      vaak: よく
      samen: 一緒に
      andere: ほかの
      kookt: 料理する
      graag: ～するのが好き
      thuis: 家で
      sport: 運動する
      lees: 読む
      luister: 聴く
      muziek: 音楽
      teken: 絵を描く
      soms: 時々
      game: ビデオゲームをする
      nooit: 決して〜ない
      vrije: 自由な
      tijd: 時間
  nl.a1.unit29.lesson06.teach.omar_ask_weekend:
    title: Omarが週末の予定を尋ねる
    gloss: Omar:今週末は何をするの?
    note: '*Dit weekend*(今週末)は、第19ユニットで出てきた時を表す表現をもう一度使っています。'
  nl.a1.unit29.lesson06.teach.lotte_unsure:
    title: Lotteはまだ決めていない
    gloss: Lotte:まだわからない。読書も好きだけど、外にも出たいな。
    note: '*Naar buiten*(外へ。文字どおりには「外に向かって」)は、家を出たいときによく使う言い方です。'
  nl.a1.unit29.lesson06.teach.omar_suggest_walk_cook:
    title: オマルが計画を提案する
    gloss: オマル:一緒に散歩しませんか?そのあと、私が二人分の料理を作りますよ。
    note: '*Daarna*(そのあと)は、ユニット10で習った *eerst, dan, daarna* の順序を表す言葉をもう一度使ったものです。'
  nl.a1.unit29.lesson06.teach.lotte_agree_both:
    title: ロッテが賛成する
    gloss: ロッテ:いい考えですね!散歩も料理も、どちらも好きです。
    note: '*Allebei*(どちらも)は、ロッテが二つのことを同じくらい好きで、どちらかを特に好むわけではないことを表します。'
  nl.a1.unit29.lesson06.teach.omar_confirm_saturday:
    title: オマルが確認する
    gloss: オマル:いいですね。では、土曜日に会いましょう!
    note: '*zaterdag*(土曜日)の約束を確認する、親しみのある締めくくりの一言です。'
