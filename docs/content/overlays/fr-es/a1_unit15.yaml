teaching:
  es.a1.unit15.lesson01.teach.mas_que:
    title: Plus… que
    gloss: plus… que
    note: '*Más...que* sert à comparer deux quantités ou deux éléments différents : consulte la note de grammaire ci-dessous.'
    example_gloss: Le nouvel appartement est plus grand que l’ancien.
  es.a1.unit15.lesson01.teach.menos_que:
    title: Moins… que
    gloss: moins… que
    note: '*Menos...que* est le contraire de *más...que*.'
    example_gloss: L’ancien appartement est moins grand que le nouveau.
  es.a1.unit15.lesson01.teach.tan_como:
    title: Aussi… que
    gloss: aussi… que
    note: '*Tan...como* compare deux éléments ÉGAUX : il s’agit d’une construction réellement différente de *más/menos*, et non d’une autre façon d’exprimer la même chose.'
    example_gloss: Mateo cuisine aussi bien qu’Elena.
  es.a1.unit15.lesson01.teach.mas_menos_tan_note:
    title: Inégalité et égalité
    gloss: La différence entre más/menos...que et tan...como.
    note: Consulte le texte de la carte.
    target_text: '*Más...que* (plus...que) et *menos...que* (moins...que) comparent deux choses ou quantités DIFFÉRENTES. *Tan...como* (aussi...que) compare deux choses ÉGALES : il s’agit d’une construction différente, et non d’un simple synonyme de *más/menos*.'
  es.a1.unit15.lesson02.teach.el_nuevo_es_mas_grande:
    title: Comparer le nouvel appartement
    gloss: Le nouvel appartement est plus grand que l’ancien.
    note: '*Más grande que* (plus grand que) insère *grande* (grand) dans la structure *más...que*.'
  es.a1.unit15.lesson02.teach.el_viejo_es_mas_pequeno:
    title: Comparer l’ancien appartement
    gloss: L’ancien appartement est plus petit que le nouveau.
    note: '*Más pequeño que* (plus petit que) emploie *pequeño* (petit) pour présenter la comparaison dans le sens inverse.'
  es.a1.unit15.lesson03.teach.cual_apartamento_es_mas_grande:
    title: Demander lequel est le plus grand
    gloss: Quel appartement est le plus grand ?
    note: '*¿Cuál...?* (quel… ?) suivi d’un adjectif au comparatif est la manière habituelle de poser une question pour comparer.'
  es.a1.unit15.lesson03.teach.el_nuevo_es_mas_grande_reply:
    title: Répondre lequel est le plus grand
    gloss: Le nouveau est plus grand que l’ancien.
    note: Il s’agit de la même comparaison, cette fois en réponse directe à la question avec *¿cuál...?* ; *el nuevo* (le nouveau) permet de ne pas répéter le nom.
  es.a1.unit15.lesson04.teach.mateo_cocina_tan_bien_como_elena:
    title: Comparer les talents culinaires à égalité
    gloss: Mateo cuisine aussi bien qu’Elena.
    note: '*Tan bien como* (aussi bien que) suit la structure *tan* + adverbe + *como* : la comparaison d’égalité porte ici sur la manière d’accomplir une action plutôt que sur la taille d’un objet.'
  es.a1.unit15.lesson04.teach.somos_un_buen_equipo:
    title: Dire que vous formez une bonne équipe
    gloss: Nous formons une bonne équipe.
    note: '*Somos* (nous sommes) + *un buen equipo* (une bonne équipe) est une conclusion naturelle après une comparaison d’égalité.'
  es.a1.unit15.lesson05.teach.comparacion_reading:
    title: Comparer les deux appartements
    gloss: L’ancien appartement de Mateo a une petite cuisine. Le nouvel appartement est plus grand, et sa cuisine est également plus grande. L’ancien est plus petit que le nouveau, et c’est pour cela que Mateo veut déménager. Le nouveau offre plus d’espace pour cuisiner.
    note: Un résumé réaliste qui compare les deux appartements.
    glosses:
      viejo: ancien
      tiene: a (du verbe tener)
      pequeña: petit
      nuevo: nouveau
      grande: grand
      también: aussi / également
      pequeño: petit
      eso: cela
      quiere: veut (du verbe querer)
      mudarse: déménager
      espacio: espace
      cocinar: cuisiner
  es.a1.unit15.lesson05.teach.por_eso_note:
    title: Por eso (c’est pourquoi)
    gloss: Comment por eso relie une raison à son résultat.
    note: Consulte le texte de la carte.
    target_text: '*Por eso* (c’est pourquoi/pour cette raison) relie une cause à son résultat : la petite cuisine explique pourquoi Mateo veut déménager, selon la même logique de cause à effet que celle que tu as déjà vue avec *porque*.'
  es.a1.unit15.lesson06.teach.line01:
    title: Demander s’il l’a déjà vu
    gloss: Elena demande à Mateo s’il a déjà vu le nouvel appartement.
    note: '*¿Ya viste...?* (as-tu déjà vu… ?) est une nouvelle forme interrogative au passé.'
  es.a1.unit15.lesson06.teach.line02:
    title: Confirmer qu’il est plus grand
    gloss: Mateo confirme qu’il est plus grand que l’ancien, y compris la cuisine.
    note: Une comparaison avec *más...que*, prolongée par *la cocina también* (la cuisine aussi).
  es.a1.unit15.lesson06.teach.line03:
    title: Demander lequel est le plus petit
    gloss: Elena demande alors quel appartement est le plus petit.
    note: '*Entonces* (alors/donc) est un connecteur logique que tu as déjà rencontré ; la question reprend la structure *¿Cuál...?* avec *pequeño* à la place de *grande*.'
  es.a1.unit15.lesson06.teach.line04:
    title: Répondre et expliquer
    gloss: Mateo dit que l’ancien est plus petit et que c’est pour cela qu’il veut déménager.
    note: '*El viejo es más pequeño que el nuevo*, suivi de *por eso quiero mudarme* (c’est pour cela que je veux déménager).'
  es.a1.unit15.lesson06.teach.line05:
    title: Reconnaître que c’est logique
    gloss: 'Elena dit que c’est logique : le nouveau offre plus d’espace pour cuisiner.'
    note: '*Tiene mucho sentido* (c’est tout à fait logique) est une nouvelle expression pour marquer son accord ; *más espacio para cocinar* signifie plus d’espace pour cuisiner.'
  es.a1.unit15.lesson06.teach.line06:
    title: Poursuivre le raisonnement
    gloss: Mateo approuve et ajoute que, puisque Elena cuisine aussi bien que lui, ils ont besoin d’espace pour deux.
    note: '*Tan bien como* (aussi bien que) est maintenant employé dans une conversation avec *tú cocinas* (tu cuisines).'
  es.a1.unit15.lesson06.teach.line07:
    title: Rendre le compliment
    gloss: Elena approuve avec enthousiasme et dit qu’il cuisine aussi bien qu’elle.
    note: '*¡Es verdad!* (c’est vrai !) + *tú cocinas tan bien como yo* (tu cuisines aussi bien que moi) : la même comparaison avec *tan bien como* est cette fois adressée à Mateo.'
  es.a1.unit15.lesson06.teach.line08:
    title: Conclure sur l’esprit d’équipe
    gloss: Mateo conclut qu’ils forment une bonne équipe.
    note: '*Somos un buen equipo* (nous formons une bonne équipe) conclut le dialogue.'
