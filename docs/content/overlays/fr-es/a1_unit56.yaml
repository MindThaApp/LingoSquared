    title: Le programme de Lucía
    gloss: 'Lucía : Je préfère nager, mais je viens aussi au parc.'
    note: 'Réutilise *prefiero* (je préfère) : dans *Prefiero nadar*, le verbe est suivi d’un infinitif.'
