  es.a1.unit56.lesson04.teach.ya_conoces_hasta:
    title: Hasta luego et Hasta + un jour
    gloss: 'Tu connais déjà ¡Hasta luego! Tu peux aussi indiquer un jour : ¡Hasta el sábado!, ¡Hasta mañana!'
    note: Étend la formule d’au revoir de l’unité sur les salutations à un jour précis.
  es.a1.unit56.lesson05.teach.elena_llama_a:
    title: Qui utilise quoi ?
    gloss: Elena appelle Mateo tous les jours. Elle utilise son téléphone, pas une application. Mateo n’a pas d’ordinateur chez lui, mais il utilise Internet sur son téléphone. Diego consulte les prévisions météo tous les matins. Ensuite, il va courir. Lucía envoie souvent un message à Elena. Toi aussi, tu utilises ton téléphone tous les jours ?
    note: Compare les habitudes des quatre personnages en matière d’appareils, sur le modèle du texte comparatif de l’unité sur le sport.
