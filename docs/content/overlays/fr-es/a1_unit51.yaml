teaching:
  es.a1.unit51.lesson01.teach.el_billete:
    title: Le billet
    gloss: le billet
    note: '*El billete* est masculin : on dit donc *un billete*, et non *una*.'
    example_gloss: Je voudrais un billet pour Tolède.
  es.a1.unit51.lesson01.teach.quisiera_un_billete:
    title: Demander un billet
    gloss: Je voudrais un billet pour Tolède.
    note: '*Quisiera* (« je voudrais ») adoucit la demande et est plus poli que *quiero*.'
  es.a1.unit51.lesson01.teach.quiere_un_billete:
    title: L’agent demande quel type de billet vous souhaitez
    gloss: Vous voulez un billet aller simple ou aller-retour ?
    note: '*Quiere* est la forme de *querer* correspondant au vouvoiement avec *usted*, employée ici pour s’adresser poliment à une personne que l’on ne connaît pas.'
  es.a1.unit51.lesson01.teach.ida_y_vuelta:
    title: Répondre poliment
    gloss: Un aller-retour, s’il vous plaît.
    note: '*Por favor* signifie « s’il vous plaît » ; la demande reste polie et concise.'
  es.a1.unit51.lesson01.teach.en_la_taquilla:
    title: Le registre au guichet
    gloss: Au guichet, on emploie généralement la forme de politesse usted.
    note: Dans une situation de service, on s’adresse aux personnes que l’on ne connaît pas avec *usted*, et non *tú*.
  es.a1.unit51.lesson02.teach.el_anden:
    title: Le quai
    gloss: le quai
    note: '*El andén* est masculin : *un andén*, *el andén*.'
    example_gloss: De quel quai part le train pour Tolède ?
  es.a1.unit51.lesson02.teach.de_que_anden:
    title: Demander de quel quai part le train
    gloss: De quel quai part le train pour Tolède ?
    note: '*¿De qué andén ...?* sert à demander précisément le quai, et non un emplacement de manière générale.'
  es.a1.unit51.lesson02.teach.el_tren_sale:
    title: Indiquer les détails du départ
    gloss: Le train part à dix heures moins le quart du quai cinq.
    note: '*Las diez menos cuarto* reprend la manière d’indiquer l’heure avec « moins le quart », vue dans la leçon sur l’heure.'
  es.a1.unit51.lesson02.teach.a_que_hora:
    title: Demander l’heure d’arrivée
    gloss: À quelle heure le train arrive-t-il ?
    note: '*¿A qué hora llega ...?* sert à demander une heure d’arrivée ; *llegar* est régulier et s’emploie avec *a las* devant l’heure.'
  es.a1.unit51.lesson02.teach.el_tren_llega:
    title: Indiquer l’heure d’arrivée
    gloss: Le train arrive à onze heures.
    note: '*Llega a las once* emploie *llegar* (« arriver ») avec *a las* devant l’heure.'
  es.a1.unit51.lesson03.teach.a_tiempo_el:
    title: À l’heure / le retard
    gloss: à l’heure ; le retard
    note: '*A tiempo* est une expression figée indiquant que quelque chose a lieu à l’heure prévue. *El retraso* (« le retard ») est masculin.'
    example_gloss:
    - Le train ne part pas à l’heure.
    - 'Attention : le train pour Tolède a du retard.'
  es.a1.unit51.lesson03.teach.atencion_el_tren:
    title: Une annonce
    gloss: 'Attention : le train pour Tolède a du retard.'
    note: '*Atención* introduit une annonce en gare, comme « Attention, voyageurs » en français.'
  es.a1.unit51.lesson03.teach.el_tren_no:
    title: Dire que le train n’est pas à l’heure
    gloss: Le train ne part pas à l’heure.
    note: '*No* se place juste devant le verbe et met toute la phrase à la forme négative : *no sale a tiempo*.'
  es.a1.unit51.lesson03.teach.el_tren_sale:
    title: Un changement de quai
    gloss: Le train part du quai trois au lieu du quai cinq.
    note: '*En lugar de* signifie « au lieu de ».'
  es.a1.unit51.lesson03.teach.el_tren_lleva:
    title: Indiquer la durée du retard
    gloss: Le train a dix minutes de retard.
    note: '*Lleva retraso* (littéralement « porte du retard ») est une manière naturelle de dire qu’un moyen de transport a du retard.'
  es.a1.unit51.lesson04.teach.la_entrada_la:
    title: Entrée, sortie, salle d’attente
    gloss: l’entrée ; la sortie ; la salle d’attente
    note: '*La entrada*, *la salida* et *la sala de espera* sont tous des noms féminins.'
    example_gloss:
    - Où est l’entrée ?
    - Où est la sortie ?
    - Où est la salle d’attente ?
  es.a1.unit51.lesson04.teach.donde_esta_el:
    title: Demander où se trouve un quai
    gloss: Où se trouve le quai numéro sept ?
    note: Cette phrase reprend la structure *¿Dónde está ...?* vue dans les leçons sur les indications de direction.
  es.a1.unit51.lesson04.teach.todo_recto_y:
    title: Indiquer le chemin
    gloss: Tout droit, puis à droite.
    note: '*Todo recto* et *a la derecha* sont des expressions vues dans les leçons sur les indications de direction et réutilisées ici dans une gare.'
  es.a1.unit51.lesson04.teach.donde_esta_la:
    title: Demander où se trouve la salle d’attente
    gloss: Où est la salle d’attente ?
    note: La même structure interrogative est appliquée à un nouveau lieu.
  es.a1.unit51.lesson05.teach.billete_madrid_atocha:
    title: Lire un billet imprimé
    gloss: 'Billet : Madrid Atocha–Tolède. Départ : dix heures dix, quai sept. Arrivée : onze heures moins dix. Aller-retour. Prix : douze euros quarante.'
    note: Repère l’heure et le quai de départ, l’heure d’arrivée, le type de billet et le prix.
    glosses:
      Billete: billet
      Salida: départ
      diez: dix
      andén: quai
      siete: sept
      Llegada: arrivée
      once: onze
      vuelta: billet aller-retour
      Precio: prix
      doce: douze
      euros: euros
      cuarenta: quarante
  es.a1.unit51.lesson06.teach.mateo_tenemos_que:
    title: Mateo présente le programme
    gloss: 'Mateo : Nous devons aller au quai sept. Le train part à dix heures dix.'
    note: '*Tenemos que* + infinitif (« nous devons ») exprime une nécessité pratique.'
  es.a1.unit51.lesson06.teach.elena_mira_ahi:
    title: Elena lit le panneau
    gloss: 'Elena : Regarde, voilà le panneau : retard, dix minutes.'
    note: '*Ahí está* (« le voilà ») sert à désigner le panneau ; *el panel* est le panneau d’information.'
  es.a1.unit51.lesson06.teach.mateo_no_hay:
    title: Mateo garde son calme
    gloss: 'Mateo : Pas de problème, nous avons encore le temps de prendre un café.'
    note: '*No hay problema* est une formule courante et familière pour rassurer quelqu’un.'
  es.a1.unit51.lesson06.teach.elena_buena_idea:
    title: Le train arrive
    gloss: 'Elena : Bonne idée. Ah, voilà déjà le train ! Quai sept, exactement !'
    note: '*Ya* (« déjà ») indique que le train est arrivé plus tôt que prévu, compte tenu du retard qui vient d’être annoncé.'
  es.a1.unit51.lesson06.teach.mateo_vamos_que:
    title: Ils montent dans le train
    gloss: 'Mateo : Allez, tout le monde monte ! Tolède, nous voilà !'
    note: '*Suben* (« ils montent ») vient de *subir*, monter à bord ; *¡Allá vamos!* est une manière naturelle d’exprimer l’enthousiasme au moment de partir.'
