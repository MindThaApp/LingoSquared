teaching:
  es.a1.unit45.lesson01.teach.cuanto_cuesta_en:
    title: Demander le prix total
    gloss: Combien cela coûte-t-il au total ?
    note: '*En total* précise que tu demandes le prix cumulé de l’ensemble, et non celui d’un seul article.'
  es.a1.unit45.lesson01.teach.cuesta_veinticinco_euros:
    title: Indiquer un prix total
    gloss: Cela coûte vingt-cinq euros au total.
    note: '*Cuesta* est la troisième personne du singulier de *costar* (coûter) ; la voyelle du radical passe de *o* à *ue* lorsqu’elle porte l’accent tonique.'
  es.a1.unit45.lesson02.teach.pagar_con_tarjeta:
    title: Payer par carte ou en espèces
    gloss: payer par carte, payer en espèces
    note: '*Pagar con tarjeta* (payer par carte) et *pagar en efectivo* (payer en espèces) emploient des prépositions différentes : *con* pour l’instrument, *en* pour la forme de monnaie.'
    example_gloss:
    - Puis-je payer par carte ici ?
    - Je paie en espèces.
  es.a1.unit45.lesson02.teach.puedo_pagar_con:
    title: Demander s’il est possible de payer par carte
    gloss: Puis-je payer par carte ici ?
    note: '*Puedo* (je peux) est la forme de *poder* à la première personne du singulier, *yo* ; *aquí* (ici) situe la question à l’endroit où l’on se trouve.'
  es.a1.unit45.lesson02.teach.quiere_pagar_en:
    title: Demander le moyen de paiement souhaité
    gloss: Souhaitez-vous payer en espèces ou par carte ?
    note: '*Quiere* est la forme de politesse avec *usted* du verbe *querer*, employée ici par une personne à la caisse qui ne connaît pas le client ; avec un ami, tu dirais *¿quieres pagar...?*'
  es.a1.unit45.lesson03.teach.la_cuenta:
    title: L’addition
    gloss: l’addition
    note: 'C’est un nom féminin : *la cuenta*. Au restaurant, il désigne l’addition ; à la banque, le compte.'
    example_gloss: On partage l’addition ?
  es.a1.unit45.lesson03.teach.dividimos_la_cuenta:
    title: Proposer de partager l’addition
    gloss: On partage l’addition ?
    note: '*¿Dividimos...?* emploie la forme de *nosotros* pour faire une proposition, comme « on… ? » en français.'
  es.a1.unit45.lesson03.teach.puedo_pagar_por:
    title: Demander à payer séparément
    gloss: Puis-je payer séparément ?
    note: '*Por separado* (séparément) indique la manière de payer ; *pagar* (payer) est le verbe courant utilisé dans ce contexte.'
  es.a1.unit45.lesson04.teach.el_cambio:
    title: La monnaie
    gloss: la monnaie
    note: 'Un nom masculin : *el cambio*. Il désigne aussi tout type de changement, comme dans *un cambio de planes*.'
    example_gloss: Voici votre monnaie.
  es.a1.unit45.lesson04.teach.aqui_tiene_su:
    title: Rendre la monnaie
    gloss: Voici votre monnaie.
    note: '*Su* est le possessif qui correspond à la forme de politesse *usted* (« votre ») ; *Aquí tiene* est la formule de politesse couramment employée pour tendre quelque chose.'
  es.a1.unit45.lesson04.teach.no_necesito_cambio:
    title: Refuser la monnaie
    gloss: Je n’ai pas besoin de monnaie.
    note: '*Necesitar* (avoir besoin de) prend directement son complément, sans préposition : *necesito cambio* ; *no* sert à nier le verbe.'
  es.a1.unit45.lesson05.teach.treinta_y_cinco:
    title: Trente-cinq
    gloss: trente-cinq
    note: '*Treinta y cinco* (trente-cinq) : de 31 à 99, l’espagnol relie les dizaines et les unités avec *y*, en mots séparés.'
    example_gloss: Cela coûte trente-cinq euros.
  es.a1.unit45.lesson05.teach.cuenta_dos_platos:
    title: Lire une addition de restaurant
    gloss: 'Addition : deux plats principaux et deux cafés. Total : trente-cinq euros. Payé par carte.'
    note: Repère ce qui a été commandé, le total et le moyen de paiement.
    glosses:
      Cuenta: addition
      dos: deux
      platos: plats principaux
      cafés: cafés
      Total: total
      treinta: trente-cinq
      euros: euros
      Pagado: payé
      tarjeta: carte
  es.a1.unit45.lesson06.teach.elena_pedimos_la:
    title: Elena demande l’addition
    gloss: 'Elena : On demande l’addition ?'
    note: '*Pedir* (demander, commander) prend *la cuenta* comme complément d’objet direct : *pedimos la cuenta* (nous demandons l’addition).'
  es.a1.unit45.lesson06.teach.mateo_si_buena:
    title: Mateo demande le total
    gloss: 'Mateo : Oui, bonne idée. Combien cela coûte-t-il au total ?'
    note: Cette phrase reprend la question *¿cuánto cuesta en total?* de la leçon 01.
  es.a1.unit45.lesson06.teach.elena_son_treinta:
    title: Elena indique le total
    gloss: 'Elena : Cela fait trente-cinq euros. On partage ?'
    note: '*Son* s’emploie avec les sommes d’argent : dans *son treinta y cinco euros*, le verbe est au pluriel parce que la somme est exprimée au pluriel.'
  es.a1.unit45.lesson06.teach.mateo_no_deja:
    title: Mateo insiste pour payer
    gloss: 'Mateo : Non, laisse-moi payer aujourd’hui. Tu m’as beaucoup aidé.'
    note: '*Deja que pague yo* (laisse-moi payer) emploie le subjonctif *pague* après *que* ; pour l’instant, retiens cette expression comme une formule toute faite. *Me has ayudado* est au passé composé (tu m’as aidé).'
  es.a1.unit45.lesson06.teach.elena_que_amable:
    title: Elena est touchée
    gloss: 'Elena : C’est très gentil ! Merci beaucoup.'
    note: '*¡Qué amable eres!* (« comme c’est gentil ! ») emploie *qué* + un adjectif pour réagir chaleureusement à un geste généreux ; *muchas gracias* est un *merci* plus appuyé.'
  es.a1.unit45.lesson06.teach.mateo_puedo_pagar:
    title: Mateo demande s’il peut payer par carte
    gloss: 'Mateo : Puis-je payer par carte ici ?'
    note: Cette phrase reprend la question *¿puedo pagar con tarjeta aquí?* de la leçon 02, cette fois dans une vraie situation au restaurant.
  es.a1.unit45.lesson06.teach.mateo_paga_la:
    title: 'Paga : la forme avec il ou elle'
    gloss: Mateo paie l’addition.
    note: '*Paga* est la troisième personne du singulier de *pagar* (payer) : *Mateo paga la cuenta*.'
