  es.a1.unit06.lesson06.el_almuerzo_dialogue:
    title: Le déjeuner d’Elena et Mateo
teaching:
  es.a1.unit06.lesson01.teach.sandwich_ensalada:
    title: Sandwich, salade
    gloss: sandwich, salade
    note: 'Ces deux noms sont des emprunts ou des adaptations : *sándwich* est directement emprunté à l’anglais et s’écrit avec un accent pour marquer la syllabe accentuée.'
    example_gloss:
    - Je veux un sandwich.
    - La salade contient de la tomate.
  es.a1.unit06.lesson01.teach.sopa:
    title: Soupe
    gloss: soupe
    note: '*Sopa* est féminin, comme la plupart des noms espagnols qui se terminent par -a.'
    example_gloss: La soupe est très bonne.
  es.a1.unit06.lesson01.teach.agua_cafe:
    title: Eau, café
    gloss: eau, café
    note: '*Agua* est un nom féminin, mais prend l’article masculin *el* (et non *la*) au singulier, car il commence par un *a* accentué. C’est une particularité de l’espagnol, pas une faute de frappe.'
    example_gloss:
    - Je veux de l’eau, s’il vous plaît.
    - Pour moi, un café.
  es.a1.unit06.lesson02.teach.quiero_un_sandwich:
    title: Je veux un sandwich
    gloss: Je veux un sandwich.
    note: '*Quiero* (je veux) est la première personne du singulier de *querer*, un nouveau verbe de cette unité.'
  es.a1.unit06.lesson02.teach.para_mi_un_cafe:
    title: Pour moi, un café
    gloss: Pour moi, un café.
    note: '*Para mí* (pour moi) est une autre formule courante pour commander : elle permet de nommer ce que l’on souhaite sans répéter de verbe. Consulte la note de grammaire suivante.'
  es.a1.unit06.lesson02.teach.que_quieres_comer:
    title: Demander ce que quelqu’un veut manger
    gloss: Qu’est-ce que tu veux manger ?
    note: '*Quieres* est la forme de *querer* employée avec *tú*, le registre informel utilisé entre amis.'
  es.a1.unit06.lesson02.teach.quiero_vs_para_mi_note:
    title: Quiero ou Para mí
    gloss: Deux façons tout aussi naturelles de commander.
    note: '*Quiero un café* et *Para mí, un café* conviennent toutes deux pour commander.'
  es.a1.unit06.lesson03.teach.el_menu:
    title: Le menu
    gloss: le menu
    note: '*Menú* porte un accent écrit, car l’accent tonique tombe sur la dernière syllabe.'
    example_gloss: Pouvons-nous voir le menu ?
  es.a1.unit06.lesson03.teach.podemos_ver_el_menu:
    title: Demander à voir le menu
    gloss: Pouvons-nous voir le menu ?
    note: '*Podemos* (nous pouvons) est la première personne du pluriel de *poder*, un nouveau verbe de cette unité.'
  es.a1.unit06.lesson03.teach.aqui_tiene:
    title: Voici
    gloss: Voici.
    note: '*Aquí tiene* est la formule courante qu’un serveur emploie lorsqu’il tend quelque chose à un client. Elle utilise la forme de politesse avec *usted*, même si le reste de l’échange est informel : c’est une formule de courtoisie figée, et non un changement de registre.'
  es.a1.unit06.lesson03.teach.buen_provecho:
    title: Bon appétit
    gloss: Bon appétit
    note: '*Buen provecho* est la formule courante avant que quelqu’un commence à manger ; elle correspond au français « bon appétit ».'
    example_gloss: Voici. Bon appétit.
  es.a1.unit06.lesson04.teach.el_postre:
    title: Dessert
    gloss: dessert
    note: '*Postre* est masculin.'
    example_gloss: En dessert, je veux du gâteau.
  es.a1.unit06.lesson04.teach.de_postre_quiero_pastel:
    title: Commander un dessert
    gloss: En dessert, je veux du gâteau.
    note: '*De postre* (en dessert) introduit ce que l’on commande pour terminer le repas, sur le même modèle que *para mí* pour introduire une commande principale.'
  es.a1.unit06.lesson04.teach.la_cuenta_por_favor:
    title: Demander l’addition
    gloss: L’addition, s’il vous plaît.
    note: '*La cuenta* (l’addition) est la formule courante pour demander à payer à la fin d’un repas.'
  es.a1.unit06.lesson05.teach.menu_reading:
    title: Lire le menu
    gloss: 'Menu : sandwich, cinq. Salade, huit. Soupe, trois. Café ou eau, inclus. Dessert : gâteau.'
    note: Un format réaliste de menu imprimé, qui reprend le vocabulaire des aliments de cette unité en indiquant les prix.
    glosses:
      Menú: carte
      sándwich: sandwich
      Ensalada: salade
      Sopa: soupe
      Café: café
      agua: eau
      incluido: compris
      Postre: dessert
      pastel: gâteau
  es.a1.unit06.lesson05.teach.incluido_note:
    title: Incluido (compris)
    gloss: Ce que cela signifie lorsqu’une boisson est indiquée comme comprise.
    note: '*Incluido* = compris, sans supplément.'
  es.a1.unit06.lesson06.teach.line01:
    title: Saluer et demander la commande
    gloss: Le serveur salue Elena et Mateo et leur demande ce qu’ils veulent manger.
    note: '*Buenas tardes* (bonjour) s’emploie à partir de midi et convient donc à l’heure du déjeuner.'
  es.a1.unit06.lesson06.teach.line02:
    title: Elena commande
    gloss: Elena commande une salade et de l’eau.
    note: '*Una ensalada y agua* = une salade et de l’eau.'
  es.a1.unit06.lesson06.teach.line03:
    title: Mateo commande
    gloss: Mateo commande un sandwich et un café pour lui.
    note: Il emploie *Para mí* au lieu de répéter *Quiero*.
  es.a1.unit06.lesson06.teach.line04:
    title: Proposer un dessert
    gloss: Le serveur acquiesce et leur demande s’ils souhaitent un dessert.
    note: '*¿Algo de postre?* (un dessert ?) est une manière naturelle et concise de proposer un dessert.'
  es.a1.unit06.lesson06.teach.line05:
    title: Commander un dessert à partager
    gloss: Elena répond oui et commande un gâteau pour eux deux.
    note: '*Para los dos* (pour nous deux) indique qu’ils partagent un seul dessert, un choix courant dans la vie quotidienne.'
  es.a1.unit06.lesson06.teach.line06:
    title: Approuver et demander l’addition
    gloss: Mateo approuve et demande l’addition.
    note: '*La cuenta, por favor* = l’addition, s’il vous plaît.'
  es.a1.unit06.lesson06.teach.line07:
    title: Remettre l’addition
    gloss: Le serveur leur remet l’addition.
    note: On dit *Aquí tiene* lorsqu’on remet quelque chose à quelqu’un.
  es.a1.unit06.lesson06.teach.line08:
    title: Conclure chaleureusement
    gloss: Elena remercie le serveur et dit que le repas était délicieux.
    note: '*¡Qué buena comida!* suit la même tournure exclamative *¡Qué ...!* que *¡Qué bien!* et *¡Qué bonito!*.'
