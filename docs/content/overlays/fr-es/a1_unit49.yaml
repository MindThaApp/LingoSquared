teaching:
  es.a1.unit49.lesson01.teach.levantarse_me_levanto:
    title: Se lever
    gloss: se lever → je me lève
    note: '*Levantarse* est pronominal : le pronom *me* se place avant le verbe, *Me levanto*.'
  es.a1.unit49.lesson01.teach.vestirse_me_visto:
    title: S’habiller
    gloss: s’habiller → je m’habille
    note: '*Vestirse* est également pronominal : *Me visto*. Ici, *me* signifie « me ».'
  es.a1.unit49.lesson01.teach.desayunar_desayuno:
    title: Prendre le petit-déjeuner
    gloss: prendre le petit-déjeuner → je prends le petit-déjeuner
    note: '*Desayunar* n’est pas pronominal : *Desayuno*, sans *me*.'
  es.a1.unit49.lesson01.teach.trabajar_trabajo:
    title: Travailler
    gloss: travailler → je travaille
    note: '*Trabajar* est un verbe régulier en -ar : à la forme *yo*, il se termine par -o, *trabajo*.'
  es.a1.unit49.lesson01.teach.comer_como:
    title: Manger
    gloss: manger → je mange
    note: '*Comer* est un verbe régulier en -er : à la forme *yo*, il se termine par -o, *como*.'
  es.a1.unit49.lesson01.teach.lavar_los_platos:
    title: Faire la vaisselle
    gloss: faire la vaisselle → je fais la vaisselle
    note: '*Lavar los platos* n’est pas pronominal : *Lavo los platos*. Le complément *los platos* reste après le verbe.'
  es.a1.unit49.lesson01.teach.dormir_duermo:
    title: Dormir
    gloss: dormir → je dors
    note: '*Dormir* change de voyelle dans son radical à la forme *yo* : *duermo* (o devient ue).'
  es.a1.unit49.lesson02.teach.con_levantarse_y:
    title: La construction pronominale
    gloss: 'Avec levantarse et vestirse, le pronom se place avant le verbe : levantarse → Me levanto.'
    note: 'Avec les verbes pronominaux, place *me* avant le verbe conjugué : dis *Me levanto*, et non *Levanto me*.'
  es.a1.unit49.lesson02.teach.levantarse_me_levanto:
    title: Levantarse dans une phrase
    gloss: 'se lever : je me lève à sept heures.'
    note: 'L’expression de l’heure se place après le verbe : *Me levanto a las siete*.'
  es.a1.unit49.lesson02.teach.vestirse_me_visto:
    title: Vestirse dans une phrase
    gloss: 's’habiller : je m’habille.'
    note: 'La construction est *me* + *visto* : le pronom reste juste devant le verbe.'
  es.a1.unit49.lesson02.teach.lavar_los_platos:
    title: Lavar los platos dans une phrase
    gloss: 'faire la vaisselle : je fais la vaisselle après avoir mangé.'
    note: '*Después de comer* (« après avoir mangé ») se construit avec *de* suivi d’un infinitif et peut se placer à la fin.'
  es.a1.unit49.lesson02.teach.sin_pronombre_desayuno:
    title: Les verbes sans me
    gloss: 'Sans pronom : je prends mon petit-déjeuner. Je travaille. Je dors. Ces verbes ne sont pas pronominaux.'
    note: '*Desayuno*, *trabajo* et *duermo* ne s’emploient pas avec *me* : ces verbes ne sont pas pronominaux.'
  es.a1.unit49.lesson03.teach.me_levanto_a:
    title: Se lever à sept heures et demie
    gloss: Je me lève à 7 h 30.
    note: 'En espagnol, on emploie *y media* pour dire « et demie » : *las siete y media* correspond à 07:30. Place *a las* avant l’heure.'
  es.a1.unit49.lesson03.teach.me_visto_a:
    title: S’habiller à huit heures moins le quart
    gloss: Je m’habille à 7 h 45.
    note: '*Las ocho menos cuarto* décompte le quart d’heure à partir de l’heure suivante : 07:45.'
  es.a1.unit49.lesson03.teach.desayuno_a_las:
    title: Prendre le petit-déjeuner à huit heures
    gloss: Je prends mon petit-déjeuner à huit heures.
    note: 'Place *a las* avant l’heure : *a las ocho*. Pour une heure, on dit *a la una*.'
  es.a1.unit49.lesson03.teach.trabajo_de_nueve:
    title: Travailler de neuf heures à dix-sept heures
    gloss: Je travaille de neuf heures à dix-sept heures.
    note: '*De ... a ...* indique une heure de début et une heure de fin : *de nueve a cinco*.'
  es.a1.unit49.lesson03.teach.como_a_las:
    title: Manger à six heures et demie
    gloss: Je mange à 18 h 30.
    note: '*De la tarde* précise qu’il s’agit de la fin de journée : ici, *las seis y media* correspond donc à 18:30.'
  es.a1.unit49.lesson03.teach.duermo_a_las:
    title: Dormir à onze heures
    gloss: Je dors à onze heures.
    note: 'Place *a las* avant l’heure : *a las once*.'
  es.a1.unit49.lesson04.teach.primero_luego_despues:
    title: D’abord, puis, ensuite
    gloss: d’abord, puis, ensuite
    note: '*Primero* indique la première activité, *luego* la suivante et *después* celle qui vient après.'
    example_gloss:
    - D’abord, je me lève.
    - Puis, je m’habille.
    - Ensuite, je prends mon petit-déjeuner.
  es.a1.unit49.lesson04.teach.primero_me_levanto:
    title: Une matinée en trois étapes
    gloss: D’abord, je me lève. Puis, je m’habille. Ensuite, je prends mon petit-déjeuner.
    note: 'Les verbes pronominaux gardent *me* devant le verbe : *me levanto*, *me visto*.'
  es.a1.unit49.lesson04.teach.primero_luego_y:
    title: Les mots qui indiquent une succession
    gloss: 'Primero, luego et después permettent d’ordonner tes actions ; le verbe ne change pas : Después desayuno.'
    note: 'Les mots qui indiquent une succession se placent en début de phrase sans modifier la forme du verbe : *Después desayuno*.'
  es.a1.unit49.lesson05.teach.mi_dia_me:
    title: Ma journée
    gloss: Ma journée — Je me lève à 7 h 30. Ensuite, je m’habille et, à huit heures, je prends mon petit-déjeuner. Je travaille de neuf heures à dix-sept heures. À 18 h 30, je mange. Ensuite, je fais la vaisselle. À onze heures, je dors.
    note: Repère à la fois l’ordre des activités et leurs horaires. Remarque *me levanto* et *me visto* avec *me*.
    glosses:
      Mi: mon, ma
      día: journée
      levanto: se lever (me levanto)
      media: et demie (y media = et demie)
      ocho: huit
      Después: ensuite
      visto: s’habiller (me visto)
      las: 'le, la (devant l’heure : las ocho)'
      desayuno: prendre le petit-déjeuner
      Trabajo: travailler
      nueve: neuf
      cinco: cinq
      siete: sept
      tarde: le soir
      como: manger
      lavo: faire la vaisselle (lavo los platos)
      once: onze
      duermo: dormir
  es.a1.unit49.lesson06.teach.elena_como_es:
    title: Demander à quelqu’un de décrire sa journée
    gloss: 'Elena : À quoi ressemble ta journée, Mateo ?'
    note: '*¿Cómo es tu día?* est une manière informelle de demander à quelqu’un de décrire sa journée ; *tu* est l’adjectif possessif informel qui signifie « ton » ou « ta ».'
  es.a1.unit49.lesson06.teach.mateo_me_levanto:
    title: La matinée de Mateo
    gloss: 'Mateo : Je me lève à 7 h 30. Ensuite, je m’habille et, à huit heures, je prends mon petit-déjeuner.'
    note: Mateo relie trois activités matinales avec *después* et *y*.
  es.a1.unit49.lesson06.teach.elena_cuando_trabajas:
    title: La journée de travail de Mateo
    gloss: 'Elena : Quand travailles-tu ? Mateo : Je travaille de neuf heures à dix-sept heures.'
    note: 'Elena et Mateo se parlent de manière informelle et emploient les formes de *tú* : *¿Cuándo trabajas?*'
  es.a1.unit49.lesson06.teach.mateo_a_las:
    title: La soirée de Mateo
    gloss: 'Mateo : À 18 h 30, je mange. Ensuite, je fais la vaisselle. À onze heures, je dors.'
    note: '*Después* se place en début de phrase, mais la forme du verbe ne change pas : *después lavo*.'
  es.a1.unit49.lesson06.teach.elena_me_levanto:
    title: La matinée d’Elena
    gloss: 'Elena : Je me lève à six heures, mais je ne prends mon petit-déjeuner qu’à 6 h 30.'
    note: '*No ... hasta* signifie « ne… que ». Elena oppose l’heure à laquelle elle se lève à celle de son petit-déjeuner.'
