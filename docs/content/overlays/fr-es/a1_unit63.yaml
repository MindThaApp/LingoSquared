    title: Nina découvre la personnalité de chacun
    gloss: Nina est nouvelle au café des langues. Elle demande à Mateo comment sont les autres. Mateo le lui explique. Elena est sympathique et patiente ; elle travaille comme infirmière. Diego est drôle et suit un cours d’espagnol. Lucía est curieuse ; elle aime apprendre de nouvelles choses. Mateo lui-même est calme.
