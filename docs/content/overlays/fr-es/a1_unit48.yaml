answer_policy:
  accent_marks: Display and teach all Spanish accent marks. In typed A1 answers, accept a variant without acute accents when every other letter and word is correct. Do not treat n as a substitute for ñ because ñ is a separate Spanish letter. Inverted question and exclamation marks may be omitted in typed answers, but the fully punctuated form remains the model answer.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal and place names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation.
course:
  title: Espagnol A1
  description: 'Cours d’espagnol pour débutants consacré aux activités de loisir : vocabulaire des loisirs, expressions de fréquence, questions et réponses sur ce que fait une personne pendant son temps libre et comparaison des loisirs de deux personnes.'
units:
  es.a1.unit48.hobbies:
    title: Les loisirs et le temps libre
lessons:
  es.a1.unit48.lesson01.leer_hacer_deporte_y:
    title: Lire, faire du sport et cuisiner
  es.a1.unit48.lesson02.musica_dibujar_y_videojuegos:
    title: Musique, dessin et jeux vidéo
  es.a1.unit48.lesson03.que_haces_en_tu:
    title: Que fais-tu pendant ton temps libre ?
  es.a1.unit48.lesson04.elena_y_mateo_hablan:
    title: Elena et Mateo parlent de leurs loisirs
  es.a1.unit48.lesson05.mateo_y_elena_comparan:
    title: Mateo et Elena comparent leurs loisirs
  es.a1.unit48.lesson06.planear_un_fin_de:
    title: Organiser un week-end ensemble
teaching:
  es.a1.unit48.lesson01.teach.leer_hacer_deporte:
    title: Lire, faire du sport, cuisiner
    gloss: lire, faire de l’exercice / du sport, cuisiner
    note: 'Trois verbes couramment employés pour parler des loisirs : *leer* (lire), *hacer deporte* (faire de l’exercice ou du sport) et *cocinar* (cuisiner).'
    example_gloss:
    - J’aime lire un livre.
    - Je fais du sport le samedi.
    - J’aime cuisiner pour des amis.
  es.a1.unit48.lesson01.teach.el_tiempo_libre:
    title: Le temps libre
    gloss: temps libre
    note: '*El tiempo libre* est un groupe nominal masculin et l’expression clé pour parler des loisirs.'
    example_gloss: Pendant mon temps libre, j’aime lire.
  es.a1.unit48.lesson01.teach.en_mi_tiempo:
    title: Dire ce que tu fais pendant ton temps libre
    gloss: Pendant mon temps libre, j’aime lire.
    note: '*Me gusta leer* (j’aime lire) se construit avec *gustar* suivi d’un infinitif ; *me gusta* reste identique quelle que soit l’activité.'
  es.a1.unit48.lesson02.teach.escuchar_musica_dibujar:
    title: Musique, dessin, jeux vidéo
    gloss: écouter de la musique, dessiner, jouer aux jeux vidéo
    note: 'Trois autres verbes couramment employés pour parler des loisirs : *escuchar música* (écouter de la musique), *dibujar* (dessiner) et *jugar videojuegos* (jouer aux jeux vidéo).'
    example_gloss:
    - J’aime écouter de la musique.
    - Je dessine souvent.
    - J’aime jouer aux jeux vidéo avec des amis.
  es.a1.unit48.lesson02.teach.me_gusta_escuchar:
    title: Dire que tu aimes écouter de la musique
    gloss: J’aime écouter de la musique.
    note: '*Escuchar* est directement suivi de son complément, sans préposition : *escuchar música*. En français, « écouter » se construit de la même manière.'
  es.a1.unit48.lesson02.teach.me_gusta_jugar:
    title: Dire que tu aimes jouer aux jeux vidéo avec des amis
    gloss: J’aime jouer aux jeux vidéo avec des amis.
    note: '*Con amigos* (avec des amis) reprend la préposition *con* vue dans les leçons précédentes.'
  es.a1.unit48.lesson03.teach.siempre_a_menudo:
    title: Toujours, souvent, parfois, jamais
    gloss: toujours, souvent, parfois, jamais
    note: Les quatre principaux adverbes de fréquence sont *siempre* (toujours), *a menudo* (souvent), *a veces* (parfois) et *nunca* (jamais). Ils se placent généralement avant le verbe ou au début de la phrase.
    example_gloss:
    - Je fais toujours du sport le samedi.
    - Je lis souvent un livre.
    - Je dessine parfois.
    - Je ne joue jamais aux jeux vidéo.
  es.a1.unit48.lesson03.teach.cada_semana_cada:
    title: Chaque semaine, chaque week-end
    gloss: chaque semaine, chaque week-end
    note: '*Cada semana* et *cada fin de semana* contiennent tous deux le mot « chaque » ; *cada* est invariable.'
    example_gloss:
    - Je cuisine pour des amis chaque semaine.
    - Je fais du sport chaque week-end.
  es.a1.unit48.lesson03.teach.con_palabras_femeninas:
    title: Cada est invariable
    gloss: 'Cada reste identique : cada semana, cada fin de semana.'
    note: '*Cada* est invariable : sa forme est la même devant un nom féminin (*semana*) et devant un nom masculin (*fin de semana*).'
  es.a1.unit48.lesson03.teach.que_haces_en:
    title: Poser une question sur le temps libre
    gloss: Que fais-tu pendant ton temps libre ?
    note: 'C’est la question centrale de cette unité : réutilise-la pour interroger quelqu’un sur ses loisirs.'
  es.a1.unit48.lesson04.teach.elena_a_menudo:
    title: Elena aborde le sujet des loisirs
    gloss: 'Elena : Nous nous promenons souvent ensemble. Mais que fais-tu d’autre pendant ton temps libre, Mateo ?'
    note: '*A menudo paseamos juntos* (nous nous promenons souvent ensemble) : *paseamos* est la forme de *pasear* correspondant à *nosotros*.'
  es.a1.unit48.lesson04.teach.mateo_me_gusta:
    title: Les loisirs de Mateo
    gloss: 'Mateo : J’aime cuisiner, à la maison aussi. Et je fais souvent du sport.'
    note: '*También en casa* (à la maison aussi) montre que Mateo cuisine pour le plaisir et pas seulement dans le cadre de son travail au restaurant.'
  es.a1.unit48.lesson04.teach.elena_cocinas_tambien:
    title: Elena est surprise
    gloss: 'Elena : Tu cuisines aussi à la maison ? Tu cuisines déjà toute la journée au travail !'
    note: '*Todo el día* (toute la journée) souligne que Mateo cuisine déjà beaucoup au travail.'
  es.a1.unit48.lesson04.teach.mateo_si_pero:
    title: Mateo s’explique
    gloss: 'Mateo : Oui, mais je trouve que cuisiner est relaxant. Et toi, qu’est-ce que tu aimes faire ?'
    note: '*Cocinar me parece relajante* signifie littéralement « cuisiner me semble relaxant » : *me parece* suivi d’un adjectif est une tournure naturelle pour exprimer une opinion.'
  es.a1.unit48.lesson04.teach.elena_me_gusta:
    title: Les loisirs d’Elena
    gloss: 'Elena : J’aime lire et j’écoute souvent de la musique.'
    note: Cette phrase réunit avec *y* (et) deux verbes liés aux loisirs vus dans les leçons précédentes.
  es.a1.unit48.lesson04.teach.mateo_tu_tambien:
    title: Mateo pose une question sur les jeux vidéo
    gloss: 'Mateo : Toi aussi, tu joues aux jeux vidéo ?'
    note: Une courte question fermée qui reprend *jugar videojuegos* de la leçon 2 ; *tú también* (toi aussi) emploie le pronom informel *tú*.
  es.a1.unit48.lesson04.teach.elena_no_nunca:
    title: Elena répond
    gloss: 'Elena : Non, je ne joue jamais aux jeux vidéo. Mais je dessine parfois !'
    note: '*Nunca* (jamais) et *a veces* (parfois), vus dans la leçon 3, sont mis en contraste dans une même réponse.'
  es.a1.unit48.lesson05.teach.mateo_y_yo:
    title: Comparer des loisirs
    gloss: Mateo et moi nous promenons souvent ensemble. Mais nous avons aussi d’autres loisirs. Mateo aime cuisiner, à la maison aussi, et il fait souvent du sport. J’aime lire et j’écoute souvent de la musique. Je dessine parfois, mais je ne joue jamais aux jeux vidéo. Qu’est-ce que tu aimes faire pendant ton temps libre ?
    note: Le message d’Elena récapitule des informations de la leçon 04 et se termine par la question centrale de l’unité, adressée au lecteur.
    glosses:
      paseamos: se promener
      menudo: souvent
      juntos: ensemble
      otras: autre
      cocinar: cuisine
      gusta: aime
      casa: à la maison
      deporte: fait du sport
      leer: lire
      escucho: écouter
      música: musique
      dibujo: dessiner
      veces: parfois
      videojuegos: jouer aux jeux vidéo
      nunca: jamais
      libre: libre
      tiempo: temps
  es.a1.unit48.lesson06.teach.mateo_que_haces:
    title: Mateo pose une question sur le week-end
    gloss: 'Mateo : Qu’est-ce que tu fais ce week-end ?'
    note: '*Este fin de semana* (ce week-end) s’emploie avec *este*, car *fin de semana* est un nom masculin.'
  es.a1.unit48.lesson06.teach.elena_todavia_no:
    title: Elena hésite
    gloss: 'Elena : Je ne sais pas encore. J’aime lire, mais j’ai aussi envie de sortir.'
    note: '*Quiero salir* (j’ai envie de sortir) est une manière courante de dire qu’on veut sortir de chez soi.'
  es.a1.unit48.lesson06.teach.mateo_paseamos_juntos:
    title: Mateo propose quelque chose
    gloss: 'Mateo : On se promène ensemble ? Après, je cuisinerai pour nous.'
    note: '*Después* (après) sert à ordonner des actions : *primero*, *luego*, *después*.'
  es.a1.unit48.lesson06.teach.elena_buena_idea:
    title: Elena accepte
    gloss: 'Elena : Bonne idée ! J’aime autant me promener que cuisiner.'
    note: '*Las dos cosas* (les deux choses) indique qu’Elena aime autant ces deux activités, sans en préférer une à l’autre.'
  es.a1.unit48.lesson06.teach.mateo_perfecto_entonces:
    title: Mateo confirme
    gloss: 'Mateo : Parfait ! Alors, on se voit samedi !'
    note: Cette formule amicale confirme le rendez-vous pour *el sábado* (samedi) ; en espagnol, on emploie *el* devant un jour précis.
