    title: Elena et Mateo achètent des tabliers
teaching:
  es.a1.unit11.lesson01.teach.la_camisa:
    title: La chemise
    gloss: la chemise
    note: '*Camisa* est féminin.'
    example_gloss: J’aime cette chemise.
  es.a1.unit11.lesson01.teach.el_pantalon:
    title: Le pantalon
    gloss: le pantalon
    note: Comme en français, *pantalón* est grammaticalement singulier en espagnol.
    example_gloss: Le pantalon coûte vingt.
  es.a1.unit11.lesson01.teach.la_chaqueta:
    title: La veste
    gloss: la veste
    note: '*Chaqueta* est féminin.'
    example_gloss: J’ai besoin d’une veste pour l’hiver.
  es.a1.unit11.lesson01.teach.los_zapatos:
    title: Les chaussures
    gloss: les chaussures
    note: Comme en français, *zapatos* est au pluriel.
    example_gloss: Ces chaussures sont confortables.
  es.a1.unit11.lesson01.teach.el_delantal:
    title: Le tablier
    gloss: le tablier
    note: '*Delantal* est masculin : c’est précisément l’article dont Elena et Mateo ont besoin pour l’atelier.'
    example_gloss: Nous avons besoin d’un tablier pour l’atelier.
  es.a1.unit11.lesson02.teach.que_talla_usas:
    title: Demander la taille
    gloss: Quelle taille portes-tu ?
    note: '*¿Qué talla usas?* est la façon habituelle de demander à quelqu’un quelle taille il fait.'
  es.a1.unit11.lesson02.teach.uso_la_talla_mediana:
    title: Indiquer ta taille
    gloss: Je fais du M.
    note: '*Uso* (je porte) + *la talla* (la taille) + le mot indiquant la taille.'
  es.a1.unit11.lesson02.teach.me_queda_bien:
    title: Dire que cela te va bien
    gloss: Ça me va bien.
    note: '*Me queda bien* emploie *quedar* (aller, convenir) : consulte la remarque grammaticale suivante.'
  es.a1.unit11.lesson02.teach.me_queda_mal:
    title: Dire que cela te va mal
    gloss: Il me va mal.
    note: 'C’est le contraire de *me queda bien* : *bien* est remplacé par *mal*.'
  es.a1.unit11.lesson02.teach.queda_note:
    title: Quedar bien/mal
    gloss: Comment quedar décrit la façon dont un vêtement va, et non sa qualité générale.
    note: Consulte le texte de la carte.
  es.a1.unit11.lesson03.teach.cuanto_cuesta_este_delantal:
    title: Demander le prix du tablier
    gloss: Combien coûte ce tablier ?
    note: Cette phrase suit la structure *¿Cuánto cuesta?* et désigne un article précis avec *este* (ce).
  es.a1.unit11.lesson03.teach.cuesta_doce:
    title: Indiquer le prix
    gloss: Ça coûte douze.
    note: '*Cuesta* suivi d’un nombre permet d’indiquer le prix.'
  es.a1.unit11.lesson03.teach.este_vs_esta_note:
    title: Este ou esta
    gloss: Comment le démonstratif s’accorde en genre avec le nom.
    note: Consulte le texte de la carte.
  es.a1.unit11.lesson04.teach.me_gusta_este:
    title: Dire que tu aimes celui-ci
    gloss: J’aime celui-ci.
    note: Ici, *este* est employé seul comme pronom (« celui-ci ») et reprend l’article qui vient d’être mentionné.
  es.a1.unit11.lesson04.teach.voy_a_comprarlo:
    title: Dire que tu vas l’acheter
    gloss: Je vais l’acheter.
    note: '*Voy a* + infinitif exprime le futur proche ; dans *comprarlo*, le pronom complément *lo* (le) est rattaché à l’infinitif *comprar*.'
  es.a1.unit11.lesson04.teach.compramos_dos:
    title: Dire que vous en achetez deux
    gloss: Nous en achetons deux.
    note: '*Compramos* (nous achetons) est la forme de *nosotros*, employée lorsqu’Elena et Mateo prennent ensemble leur décision.'
  es.a1.unit11.lesson05.teach.precios_reading:
    title: Lire une liste de prix
    gloss: 'Dans ce magasin, la chemise coûte quinze, le pantalon coûte vingt, la veste coûte trente et les chaussures coûtent vingt-cinq. Le tablier est le moins cher : il ne coûte que douze.'
    note: 'Une liste de prix dans un magasin : *cuesta* (coûte) s’emploie pour un seul article et *cuestan* (coûtent) pour des articles au pluriel comme *los zapatos*.'
    glosses:
      tienda: magasin
      camisa: chemise
      cuesta: coûte (de costar)
      quince: quinze
      pantalón: pantalon
      veinte: vingt
      chaqueta: veste
      treinta: trente
      zapatos: chaussures
      cuestan: coûtent (de costar)
      veinticinco: vingt-cinq
      delantal: tablier
      barato: bon marché
      solo: seulement
      doce: douze
  es.a1.unit11.lesson05.teach.el_mas_barato_note:
    title: El más barato (le moins cher)
    gloss: Comment el/la + más + adjectif forme un superlatif.
    note: Consulte le texte de la carte.
  es.a1.unit11.lesson06.teach.line01:
    title: Exprimer le besoin
    gloss: Elena dit qu’ils ont besoin de tabliers pour l’atelier.
    note: '*Delantales* est le pluriel de *el delantal*.'
  es.a1.unit11.lesson06.teach.line02:
    title: Être d’accord et proposer un magasin
    gloss: Mateo est d’accord et propose d’aller dans ce magasin-là.
    note: '*Tienes razón* signifie « tu as raison » ; *esa tienda* signifie « ce magasin-là ».'
  es.a1.unit11.lesson06.teach.line03:
    title: Le vendeur les salue
    gloss: Le vendeur les salue et leur propose son aide.
    note: '*¿Los ayudo?* (« puis-je vous aider ? », au pluriel) est une formule courante employée dans les magasins ; le vendeur s’adresse à Elena et Mateo ensemble.'
  es.a1.unit11.lesson06.teach.line04:
    title: Dire ce qu’ils cherchent
    gloss: Elena répond qu’ils cherchent des tabliers.
    note: '*Buscamos* (nous cherchons) est la forme de *nosotros* du verbe *buscar*.'
  es.a1.unit11.lesson06.teach.line05:
    title: Le vendeur leur montre plusieurs modèles et demande leur taille
    gloss: L’employé montre des tabliers et demande leur taille.
    note: '*¿Qué talla usan?* emploie le pluriel *usan* (vous portez), car la question s’adresse aux deux personnes, contrairement au singulier *usas*.'
  es.a1.unit11.lesson06.teach.line06:
    title: Indiquer une taille
    gloss: Mateo dit qu’il porte une taille moyenne.
    note: '*Uso la talla mediana* répond à *¿Qué talla usan?* en ce qui le concerne.'
  es.a1.unit11.lesson06.teach.line06b:
    title: Elena est d’accord
    gloss: Elena dit qu’elle fait la même taille.
    note: '*Yo también* signifie « moi aussi ».'
  es.a1.unit11.lesson06.teach.line07:
    title: Demander le prix
    gloss: Mateo demande combien coûte le tablier.
    note: '*Este* (celui-ci) désigne le tablier qui se trouve devant lui.'
  es.a1.unit11.lesson06.teach.line07b:
    title: Indiquer le prix
    gloss: L’employé dit qu’il coûte douze.
    note: '*Cuesta* suivi d’un nombre permet d’indiquer le prix.'
  es.a1.unit11.lesson06.teach.line08:
    title: Confirmer que la taille convient et décider d’acheter
    gloss: Elena dit que le tablier lui va bien, qu’il lui plaît et qu’elle va l’acheter.
    note: Cette réplique enchaîne *me queda bien*, *me gusta este* et *voy a comprarlo*.
  es.a1.unit11.lesson06.teach.line09:
    title: Être d’accord et en acheter deux
    gloss: Mateo dit que le tablier lui va bien aussi, puis ils en achètent deux.
    note: '*A mí también* (« moi aussi », avec insistance) reprend la structure d’accord avec *también* en ajoutant un pronom tonique ; *compramos dos* conclut la scène.'
