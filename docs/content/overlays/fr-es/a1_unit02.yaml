course:
  title: Espagnol A1
  description: Les nombres de 0 à 100, l’âge, les numéros de téléphone et les quantités dans les recettes, dans la suite des aventures d’Elena et Mateo à l’atelier de cuisine de l’unité 1. Des explications destinées aux francophones mettent en évidence l’expression de l’âge avec tener et l’accord en genre dans les expressions de quantité.
