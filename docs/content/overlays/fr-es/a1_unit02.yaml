teaching:
  es.a1.unit02.lesson01.teach.cero:
    title: Zéro
    gloss: zéro
    note: '*Cero* s’emploie aussi bien pour désigner le nombre lui-même que comme chiffre lorsque l’on lit à voix haute une suite de chiffres.'
  es.a1.unit02.lesson01.teach.uno:
    title: Un
    gloss: un
    note: '*Uno* devient *un* devant un nom masculin singulier (*un huevo*, un œuf) et *una* devant un nom féminin (*una taza*, une tasse). Employé seul, notamment pour compter, il reste *uno*.'
  es.a1.unit02.lesson01.teach.dos:
    title: Deux
    gloss: deux
    note: '*Dos* ne change jamais de forme, quel que soit le genre du nom.'
  es.a1.unit02.lesson01.teach.tres:
    title: Trois
    gloss: trois
    note: '*Tres*, comme *dos*, est invariable.'
  es.a1.unit02.lesson01.teach.cuatro:
    title: Quatre
    gloss: quatre
    note: '*Cuatro* est invariable.'
  es.a1.unit02.lesson01.teach.cinco:
    title: Cinq
    gloss: cinq
    note: '*Cinco* est invariable.'
  es.a1.unit02.lesson01.teach.seis:
    title: Six
    gloss: six
    note: '*Seis* est invariable.'
  es.a1.unit02.lesson01.teach.siete:
    title: Sept
    gloss: sept
    note: '*Siete* est invariable.'
  es.a1.unit02.lesson01.teach.ocho:
    title: Huit
    gloss: huit
    note: '*Ocho* est invariable.'
  es.a1.unit02.lesson01.teach.nueve:
    title: Neuf
    gloss: neuf
    note: '*Nueve* est invariable.'
  es.a1.unit02.lesson01.teach.diez:
    title: Dix
    gloss: dix
    note: '*Diez* est invariable.'
  es.a1.unit02.lesson02.teach.once:
    title: Onze
    gloss: onze
    note: De *once* à *quince* (11 à 15), chaque nombre s’écrit en un seul mot et doit être appris avec les autres ; de seize à dix-neuf, les nombres se construisent à partir de *diez* (*dieciséis*, *diecisiete*…).
  es.a1.unit02.lesson02.teach.doce:
    title: Douze
    gloss: douze
    note: '*Doce* s’écrit en un seul mot ; il ressemble à *dos*, mais possède sa propre orthographe.'
  es.a1.unit02.lesson02.teach.trece:
    title: Treize
    gloss: treize
    note: '*Trece* s’écrit en un seul mot ; il ressemble à *tres*, mais possède sa propre orthographe.'
  es.a1.unit02.lesson02.teach.catorce:
    title: Quatorze
    gloss: quatorze
    note: '*Catorce* s’écrit en un seul mot ; il ressemble à *cuatro*, mais possède sa propre orthographe.'
  es.a1.unit02.lesson02.teach.quince:
    title: Quinze
    gloss: quinze
    note: '*Quince* est le dernier nombre de cette série à avoir une forme propre avant le changement de construction à partir de seize.'
  es.a1.unit02.lesson02.teach.veinte:
    title: Vingt
    gloss: vingt
    note: '*Veinte* possède sa propre forme. À partir de *veintiuno* (21), les dizaines et les unités s’unissent en un seul mot jusqu’à vingt-neuf. Ce cours reprend cette construction avec *veintiocho* dans la leçon 3.'
  es.a1.unit02.lesson02.teach.treinta:
    title: Trente
    gloss: trente
    note: À partir de trente, les dizaines et les unités sont reliées par *y* (« et ») et s’écrivent en trois mots distincts, contrairement aux nombres de la vingtaine.
  es.a1.unit02.lesson02.teach.treinta_y_cuatro:
    title: Trente-quatre
    gloss: trente-quatre
    note: '*Treinta y cuatro* s’écrit en trois mots distincts : la dizaine, *y* et l’unité.'
  es.a1.unit02.lesson02.teach.cien:
    title: Cent
    gloss: cent
    note: '*Cien* est la forme employée lorsque 100 apparaît exactement et seul ; lorsqu’un nombre se poursuit au-delà, on emploie *ciento* (*ciento uno*, 101), une forme qui n’est pas encore abordée dans cette unité.'
  es.a1.unit02.lesson03.teach.cuantos_anos_tienes:
    title: Demander l’âge dans un registre familier
    gloss: Quel âge as-tu ?
    note: Comme en français, l’espagnol demande littéralement combien d’années une personne possède et emploie *tener* (« avoir »), et non *ser* ou *estar*.
  es.a1.unit02.lesson03.teach.tengo_veintiocho:
    title: Donner son âge
    gloss: J’ai vingt-huit ans.
    note: '*Tengo* est la forme de *tener* à la première personne du singulier. Une réponse complète comprend normalement *años* (« ans ») ; quand l’âge est déjà le sujet de la conversation, ce mot peut être omis, comme dans *Tengo treinta y uno*.'
  es.a1.unit02.lesson03.teach.cuantos_anos_tiene_usted:
    title: Demander l’âge dans un registre formel
    gloss: Quel âge as-tu ?
    note: '*Tiene* est la forme de *tener* employée avec *usted*, conformément au registre formel présenté dans l’unité 1.'
  es.a1.unit02.lesson03.teach.tengo_treinta_y_uno:
    title: Donner un âge composé
    gloss: J’ai trente et un ans.
    note: Ici, *treinta y uno* conserve *uno* (et non *un*), car aucun nom ne le suit directement dans cette réponse.
  es.a1.unit02.lesson03.teach.y_tu_cuantos:
    title: Retourner la question sur l’âge
    gloss: Et toi, quel âge as-tu ?
    note: Une fois le sujet établi, employer *tienes* sans répéter *años* est une abréviation naturelle et courante.
  es.a1.unit02.lesson04.teach.cual_es_tu_numero:
    title: Demander un numéro de téléphone
    gloss: Quel est ton numéro de téléphone ?
    note: '*Cuál*, et non *qué*, est le choix naturel lorsqu’on demande à quelqu’un d’indiquer un élément précis parmi plusieurs possibilités, comme un numéro de téléphone.'
  es.a1.unit02.lesson04.teach.numero_elena:
    title: Un numéro lu chiffre par chiffre
    gloss: Six, un, cinq, zéro, deux, neuf, sept, trois
    note: 'Un numéro de téléphone peut se lire chiffre par chiffre, comme ici. Beaucoup d’hispanophones regroupent aussi les chiffres par deux : sois attentif aux deux façons de faire.'
  es.a1.unit02.lesson04.teach.es_el:
    title: Introduire le numéro
    gloss: C’est le…
    note: On emploie *el* (article défini masculin), car *número* est un nom masculin.
  es.a1.unit02.lesson04.teach.puedes_repetir:
    title: Demander de répéter
    gloss: Peux-tu répéter, s’il te plaît ?
    note: '*Puedes* est la forme de *poder* (pouvoir) avec *tú*. Elle est utile chaque fois qu’un nombre prononcé trop vite t’échappe.'
  es.a1.unit02.lesson04.teach.claro:
    title: Accepter volontiers
    gloss: Bien sûr
    note: '*Claro* est une façon courante et amicale d’accepter une demande.'
  es.a1.unit02.lesson05.teach.necesito_tres_huevos:
    title: Indiquer une quantité nécessaire
    gloss: J’ai besoin de trois œufs.
    note: '*Necesito* est la forme de la première personne du singulier de *necesitar* (avoir besoin de). *Huevos* (œufs) reste au pluriel après tout nombre supérieur à un.'
  es.a1.unit02.lesson05.teach.cuantos_huevos_necesitas:
    title: Demander quelle quantité est nécessaire
    gloss: De combien d’œufs as-tu besoin ?
    note: '*Cuántos* s’accorde en genre et en nombre avec le nom sur lequel porte la question. *Huevos* est masculin pluriel : on emploie donc *cuántos* (et non *cuántas*).'
  es.a1.unit02.lesson05.teach.dos_tazas_harina:
    title: Indiquer une quantité mesurée
    gloss: Deux tasses de farine
    note: '*De* relie l’unité de mesure (*tazas*, tasses) à ce qui est mesuré (*harina*, farine), comme en français dans « tasses de farine ».'
  es.a1.unit02.lesson05.teach.media_taza:
    title: Indiquer une demi-quantité
    gloss: Une demi-tasse de sucre
    note: '*Media* s’accorde avec le nom féminin *taza* ; avec un nom masculin, on emploie plutôt la forme masculine *medio*.'
  es.a1.unit02.lesson05.teach.tengo_cuatro_huevos:
    title: Indiquer ce qu’on a sous la main
    gloss: J’ai quatre œufs sur la table.
    note: '*Tengo* (j’ai) indique ce qui est déjà disponible, contrairement à *necesito* (j’ai besoin de), qui indique ce qui manque encore.'
  es.a1.unit02.lesson06.teach.line01:
    title: Demander combien d’œufs sont nécessaires
    gloss: Elena demande à Mateo de combien d’œufs il a besoin pour la recette.
    note: Le registre avec *tú* employé entre les deux camarades, comme dans l’unité 1, se poursuit ici.
  es.a1.unit02.lesson06.teach.line02:
    title: Indiquer les ingrédients
    gloss: Mateo dit qu’il a besoin de trois œufs et de deux tasses de farine.
    note: '*Necesito* indique ce dont on a encore besoin pour la recette.'
  es.a1.unit02.lesson06.teach.line03:
    title: Proposer ce qu’on a sous la main
    gloss: Elena dit qu’elle a quatre œufs sur la table et demande à Mateo s’il a aussi besoin de sucre.
    note: '*Tengo* indique ce qu’Elena a déjà à sa disposition, indépendamment de ce dont Mateo a dit avoir besoin.'
  es.a1.unit02.lesson06.teach.line04:
    title: Confirmer une petite quantité
    gloss: Mateo répond que oui, il en faut un peu, environ une demi-tasse.
    note: Ici, *Como* signifie « environ » ou « à peu près », et non « comme », son sens le plus courant.
  es.a1.unit02.lesson06.teach.line05:
    title: Demander un numéro de téléphone
    gloss: Elena dit « parfait », puis demande son numéro de téléphone à Mateo afin de pouvoir lui écrire au sujet du prochain cours.
    note: '*Así te escribo* (« comme ça, je peux t’écrire ») explique pourquoi elle pose la question. C’est une tournure naturelle avant de demander des coordonnées.'
  es.a1.unit02.lesson06.teach.line06:
    title: Donner le numéro de téléphone
    gloss: Mateo lit son numéro chiffre par chiffre.
    note: '*Es el* introduit le numéro et s’accorde avec le nom masculin *número*.'
  es.a1.unit02.lesson06.teach.line07:
    title: Le remercier et lui demander son âge
    gloss: 'Elena le remercie, puis lui pose une dernière question : elle lui demande son âge.'
    note: '*Una pregunta más* (« une dernière question ») marque naturellement un changement de sujet au cours de la même conversation.'
  es.a1.unit02.lesson06.teach.line08:
    title: Indiquer son âge
    gloss: Mateo dit qu’il a vingt-huit ans et retourne la question à Elena.
    note: '*Tengo veintiocho años* emploie la forme contractée des nombres de la vingtaine, conformément au modèle de la leçon 02.'
  es.a1.unit02.lesson06.teach.line09:
    title: Indiquer son âge
    gloss: Elena dit qu’elle a trente et un ans.
    note: Dans *Tengo treinta y uno*, *años* est omis parce que le sujet, l’âge, est déjà clair. Cette abréviation est naturelle une fois le sujet établi et suit le modèle de la leçon 03, où l’on retourne la question sans répéter *años*.
