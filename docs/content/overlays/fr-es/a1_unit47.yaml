teaching:
  es.a1.unit47.lesson01.teach.llamar:
    title: Appeler
    gloss: appeler
    note: L’infinitif du verbe qui signifie passer un appel téléphonique.
    example_gloss: Je dois t’appeler.
  es.a1.unit47.lesson01.teach.te_llamo:
    title: Dire que tu appelleras
    gloss: Je t’appellerai.
    note: '*Llamo* est la forme à la première personne du singulier (*yo*) de *llamar* ; avec *te*, cela signifie « je t’appelle ». En espagnol, on emploie ici le présent pour parler d’une action future proche.'
  es.a1.unit47.lesson01.teach.hola_soy_elena:
    title: Répondre au téléphone
    gloss: Bonjour, c’est Elena.
    note: Au téléphone, on se présente en espagnol avec *soy* suivi de son prénom, alors qu’en français on dit généralement « c’est » suivi de son prénom.
  es.a1.unit47.lesson01.teach.hola_soy_mateo:
    title: Mateo répond de la même manière
    gloss: Bonjour, c’est Mateo.
    note: La même construction avec *soy* suivi du prénom que dans *Hola, soy Elena*.
  es.a1.unit47.lesson02.teach.con_quien_hablo:
    title: Demander qui appelle
    gloss: À qui ai-je l’honneur ?
    note: '*¿Con quién hablo?* est la formule habituelle quand on ne sait pas qui appelle.'
  es.a1.unit47.lesson02.teach.habla_con_elena:
    title: Se présenter de manière formelle
    gloss: Vous parlez avec Elena.
    note: '*Habla con* suivi du prénom emploie la forme de politesse *usted* du verbe *hablar* : c’est l’équivalent poli de la présentation avec *soy* suivi du prénom.'
  es.a1.unit47.lesson03.teach.puedes_repetir_eso:
    title: Demander de répéter
    gloss: Peux-tu répéter cela ?
    note: '*¿Puedes...?* (est-ce que tu peux… ?) est suivi de *repetir* (répéter), puis de *eso* (cela).'
  es.a1.unit47.lesson03.teach.no_hables_tan:
    title: Demander à quelqu’un de parler moins vite
    gloss: Ne parle pas si vite, s’il te plaît.
    note: '*No hables* est l’impératif négatif informel de *hablar* ; *tan rápido* (si vite) indique le degré.'
  es.a1.unit47.lesson03.teach.no_te_oigo:
    title: Dire que tu entends mal
    gloss: Je ne t’entends pas bien.
    note: '*Oír* (entendre), accompagné de *no ... bien* (ne pas bien), indique un problème d’audition, contrairement à *entender* (comprendre) ; *te oigo* signifie « je t’entends ».'
  es.a1.unit47.lesson04.teach.el_mensaje:
    title: SMS
    gloss: le SMS
    note: 'C’est un nom masculin : *el mensaje*. On dit aussi *el SMS* ou *el texto* en espagnol, mais *mensaje* est le terme neutre.'
    example_gloss: Le SMS vient d’Elena.
  es.a1.unit47.lesson04.teach.te_envio_un:
    title: Dire que tu enverras un SMS
    gloss: Je t’enverrai un message.
    note: '*Enviar* (envoyer) est précédé du pronom *te* (à toi) : *te envío un mensaje*.'
  es.a1.unit47.lesson04.teach.te_llamo_mas:
    title: Dire que tu rappelleras
    gloss: Je te rappellerai plus tard.
    note: '*Más tarde* (plus tard) se place à la fin de la phrase : *te llamo más tarde*.'
  es.a1.unit47.lesson05.teach.mateo_hola_elena:
    title: Lis un échange de SMS
    gloss: 'Mateo : Salut Elena, tu peux m’appeler ? Je dois te dire quelque chose. Elena : Oui, bien sûr, je te rappelle dans cinq minutes.'
    note: Repère ce que Mateo demande, pourquoi il le demande et quand Elena dit qu’elle le rappellera.
    glosses:
      Hola: salut
      puedes: pouvoir
      llamarme: appeler
      Tengo: devoir
      algo: quelque chose
      contarte: dire
      claro: bien sûr
      llamada: appeler
      cinco: cinq
      minutos: minutes
      devuelvo: rappeler
  es.a1.unit47.lesson06.teach.mateo_hola_soy:
    title: Mateo répond à l’appel
    gloss: 'Mateo : Allô, c’est Mateo.'
    note: 'La même construction avec *soy* suivi du prénom que dans la première leçon est maintenant employée dans un véritable appel : la personne qui décroche parle la première et donne son prénom.'
  es.a1.unit47.lesson06.teach.elena_hola_mateo:
    title: Elena se présente
    gloss: 'Elena : Salut Mateo, c’est Elena. Mateo : Merci d’appeler !'
    note: '*Gracias por llamar* (merci d’appeler) se construit avec *gracias por* suivi de l’infinitif.'
  es.a1.unit47.lesson06.teach.elena_como_ha:
    title: Elena pose une question sur le service
    gloss: 'Elena : Comment s’est passé ton premier service ?'
    note: '*Ha ido* est le passé composé de *ir* (ici, « se passer ») : *ha* suivi du participe passé *ido*.'
  es.a1.unit47.lesson06.teach.mateo_ha_ido:
    title: Mateo annonce une bonne nouvelle
    gloss: 'Mateo : Ça s’est très bien passé, mieux que je ne le pensais.'
    note: '*Ha ido muy bien* reprend le passé composé de la question ; *mejor de lo esperado* (mieux que prévu) forme une comparaison avec *de lo*.'
  es.a1.unit47.lesson06.teach.ha_ido_ir:
    title: Ha ido, es et esperado sont présentés avec leur infinitif
    gloss: ha ido → ir (aller), es → ser (être), esperado → esperar (attendre)
    note: '*Ha ido*, *es* et *esperado* sont présentés avec leurs infinitifs : *ir*, *ser*, *esperar*. Pour l’instant, retiens *ha ido muy bien* comme une expression toute faite ; le passé composé sera étudié en détail plus tard.'
  es.a1.unit47.lesson06.teach.elena_que_bien:
    title: Elena est fière
    gloss: 'Elena : Ça fait plaisir à entendre ! Je suis fière de toi.'
    note: '*Orgulloso/a de* (fier ou fière de) est une construction fixe avec *de* ; l’adjectif s’accorde avec la personne qui parle (*orgullosa* pour Elena).'
  es.a1.unit47.lesson06.teach.mateo_muchas_gracias:
    title: Mateo est touché
    gloss: 'Mateo : Merci beaucoup, ça compte beaucoup pour moi.'
    note: '*Significa* est la forme de *significar* (signifier) à la troisième personne du singulier ; *para mí* (pour moi) indique pour qui cela compte.'
  es.a1.unit47.lesson06.teach.su_primer_turno:
    title: Son
    gloss: Son premier service s’est très bien passé.
    note: Ici, *Su* est un possessif qui peut signifier « son », « sa » ou « votre » avec *usted* ; le contexte indique de qui il s’agit.
