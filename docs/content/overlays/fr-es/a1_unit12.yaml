teaching:
  es.a1.unit12.lesson01.teach.nervioso:
    title: Nerveux
    gloss: nerveux
    note: '*Nervioso* (masculin) / *nerviosa* (féminin) : un couple d’adjectifs classique en -o/-a.'
    example_gloss:
    - Mateo est nerveux.
    - Elena est nerveuse.
  es.a1.unit12.lesson01.teach.contento:
    title: Heureux
    gloss: heureux / content
    note: '*Contento/contenta* décrit le fait de se sentir heureux ou satisfait, et non un trait de caractère permanent.'
    example_gloss:
    - Mateo est heureux.
    - Elena est contente.
  es.a1.unit12.lesson01.teach.cansado:
    title: Fatigué
    gloss: fatigué
    note: '*Cansado/cansada* vient de *cansar* (fatiguer).'
    example_gloss:
    - Après l’atelier, je suis fatigué. (masculin)
    - Après l’atelier, je suis fatiguée. (féminin)
  es.a1.unit12.lesson01.teach.preocupado:
    title: Inquiet
    gloss: inquiet
    note: '*Preocupado/preocupada* vient de *preocupar* (inquiéter).'
    example_gloss:
    - Mateo est inquiet.
    - Elena est inquiète.
  es.a1.unit12.lesson01.teach.orgulloso:
    title: Fier
    gloss: fier
    note: '*Orgulloso/orgullosa* : *estoy orgulloso/a de...* (je suis fier/fière de…) se construit avec *de* devant ce dont on est fier.'
    example_gloss:
    - Je suis fier de toi. (masculin)
    - Je suis fière de toi. (féminin)
  es.a1.unit12.lesson02.teach.estoy_nervioso:
    title: Je suis nerveux (masculin)
    gloss: Je suis nerveux.
    note: '*Estoy* (je suis, du verbe *estar*) + l’adjectif au masculin.'
  es.a1.unit12.lesson02.teach.estoy_nerviosa:
    title: Je suis nerveuse (féminin)
    gloss: Je suis nerveux.
    note: La même construction avec l’adjectif au féminin.
  es.a1.unit12.lesson02.teach.estoy_contento:
    title: Je suis heureux (masculin)
    gloss: Je suis heureux.
    note: '*Estoy contento* : la même structure, *estar* + adjectif.'
  es.a1.unit12.lesson02.teach.estar_vs_ser_note:
    title: Estar ou ser pour les sentiments
    gloss: Pourquoi les sentiments s’expriment normalement avec estar et non avec ser.
    note: Consulte le texte de la carte.
  es.a1.unit12.lesson03.teach.como_te_sientes:
    title: Demander à quelqu’un comment il se sent
    gloss: Comment te sens-tu ?
    note: '*¿Cómo te sientes?* emploie *sentirse* (se sentir), un verbe pronominal, et non la structure *estar* + adjectif.'
  es.a1.unit12.lesson03.teach.me_siento_nervioso_pero_contento:
    title: Décrire des sentiments partagés
    gloss: Je me sens un peu nerveux, mais heureux.
    note: '*Me siento* (je me sens) + adjectif, avec *pero* (mais) pour opposer deux sentiments éprouvés en même temps : c’est une réponse naturelle à *¿Cómo te sientes?*.'
  es.a1.unit12.lesson04.teach.algo_se_quema:
    title: Quelque chose brûle
    gloss: Quelque chose brûle !
    note: '*Se quema* est la forme pronominale de *quemar* (brûler) : c’est la manière naturelle de dire que quelque chose brûle sans préciser qui en est responsable.'
  es.a1.unit12.lesson04.teach.estoy_preocupado:
    title: Je suis inquiet (masculin)
    gloss: Je suis inquiet.
    note: '*Preocupado* suit la structure *estoy* + adjectif.'
  es.a1.unit12.lesson04.teach.no_te_preocupes:
    title: Ne t’inquiète pas
    gloss: Ne t’inquiète pas.
    note: Consulte la note de grammaire suivante.
  es.a1.unit12.lesson04.teach.podemos_empezar_de_nuevo:
    title: Proposer de recommencer
    gloss: Nous pouvons recommencer.
    note: '*Podemos* (nous pouvons) + infinitif ; *de nuevo* (de nouveau) est une expression courante pour dire qu’on refait quelque chose.'
  es.a1.unit12.lesson04.teach.no_te_preocupes_note:
    title: No te preocupes
    gloss: La structure de l’impératif négatif dans « ne t’inquiète pas ».
    note: Consulte le texte de la carte.
  es.a1.unit12.lesson05.teach.reflexion_reading:
    title: Retour sur le cours
    gloss: Avant le cours, Elena et Mateo étaient un peu nerveux. Pendant le cours, quelque chose a brûlé et ils étaient tous les deux inquiets. Mais ils ont recommencé et, finalement, le gâteau était parfait. Maintenant, ils sont tous les deux très fiers et heureux.
    note: '*Estaban* (ils étaient) décrit ce qu’ils ressentaient alors ; *están* (ils sont) décrit ce qu’ils ressentent maintenant.'
    glosses:
      Antes: avant
      clase: cours
      estaban: étaient (du verbe estar)
      poco: un peu
      nerviosos: nerveux
      Durante: pendant
      algo: quelque chose
      quemó: a brûlé (du verbe quemarse)
      dos: tous les deux / deux
      preocupados: inquiet
      Pero: mais
      empezaron: ont commencé (du verbe empezar)
      nuevo: de nouveau
      final: fin
      pastel: gâteau
      salió: s’est révélé (du verbe salir)
      perfecto: parfait
      Ahora: maintenant
      están: sont (du verbe estar)
      orgullosos: fier
      contentos: content
  es.a1.unit12.lesson05.teach.plural_adjective_note:
    title: Accord des adjectifs au pluriel
    gloss: Pourquoi un groupe mixte prend des adjectifs au masculin pluriel.
    note: Consulte le texte de la carte.
  es.a1.unit12.lesson06.teach.line01:
    title: Demander à Mateo comment il se sent
    gloss: Elena demande à Mateo comment il se sent avant le cours.
    note: '*¿Cómo te sientes?* sert à demander à quelqu’un comment il se sent.'
  es.a1.unit12.lesson06.teach.line02:
    title: Exprimer des sentiments partagés
    gloss: Mateo dit qu’il se sent un peu nerveux, mais heureux.
    note: Mateo emploie les formes masculines *nervioso* et *contento*.
  es.a1.unit12.lesson06.teach.line03:
    title: Réagir à l’incident
    gloss: Elena dit qu’elle ressent la même chose, puis remarque que quelque chose brûle.
    note: '*¡Ay, no!* (oh non !) est une exclamation courante pour exprimer l’alarme.'
  es.a1.unit12.lesson06.teach.line04:
    title: Exprimer son inquiétude
    gloss: Mateo dit qu’il est inquiet et demande quoi faire.
    note: '*¿Qué hacemos?* (qu’est-ce qu’on fait ?) est une question pratique.'
  es.a1.unit12.lesson06.teach.line05:
    title: Rassurer et proposer une solution
    gloss: 'Elena lui dit de ne pas s’inquiéter : ils peuvent recommencer.'
    note: Cette phrase associe *no te preocupes* et *podemos empezar de nuevo*.
  es.a1.unit12.lesson06.teach.line06:
    title: Être d’accord et réessayer
    gloss: Mateo est d’accord et propose de réessayer.
    note: '*Vamos a intentarlo otra vez* (essayons encore une fois) reprend la construction *vamos a* + infinitif vue dans les unités précédentes, cette fois avec le pronom complément *lo*.'
  es.a1.unit12.lesson06.teach.line07:
    title: Annoncer la réussite
    gloss: Elena annonce que le gâteau est maintenant parfait.
    note: '*¡Mira!* (regarde !) est une interjection qui attire l’attention ; *el pastel* (le gâteau) est le plat au cœur de l’incident.'
  es.a1.unit12.lesson06.teach.line08:
    title: Célébrer et exprimer sa fierté
    gloss: Mateo se réjouit et dit qu’il est fier d’eux deux.
    note: '*¡Qué bien!* (génial !) reprend la structure exclamative *¡Qué...!*, comme dans *¡Qué calor!* ; *de nosotros* (de nous) étend *estoy orgulloso de ti* à un groupe.'
  es.a1.unit12.lesson06.teach.line09:
    title: Partager cette fierté
    gloss: 'Elena dit qu’elle aussi est fière : ils ont réussi ensemble.'
    note: '*Lo logramos juntos* (nous avons réussi ensemble) conclut naturellement le dialogue et introduit *lograr* (réussir à accomplir quelque chose).'
