course:
  title: Espagnol A1
  description: 'Demander et suivre un itinéraire simple, dans la suite de l’histoire d’Elena et Mateo : après l’unité 8, Elena guide Mateo jusqu’à la bibliothèque. Des explications précisent que doblar et girar sont des variantes régionales interchangeables et qu’il ne s’agit pas d’une différence de sens.'
