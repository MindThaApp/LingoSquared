teaching:
  es.a1.unit09.lesson01.teach.la_calle:
    title: La rue
    gloss: la rue
    note: '*Calle* est féminin.'
    example_gloss: J’habite dans cette rue.
  es.a1.unit09.lesson01.teach.la_esquina:
    title: Le coin
    gloss: le coin
    note: '*Esquina* est féminin.'
    example_gloss: La banque est au coin de la rue.
  es.a1.unit09.lesson02.teach.seguir_derecho:
    title: Aller tout droit
    gloss: Va tout droit.
    note: '*Sigue* est l’impératif informel de *seguir* (suivre/continuer), réutilisé tout au long de cette unité pour indiquer un itinéraire.'
  es.a1.unit09.lesson02.teach.doblar_izquierda:
    title: Tourner à gauche
    gloss: Tourne à gauche.
    note: '*Dobla* est l’impératif informel de *doblar* (tourner/plier). Consulte la note de grammaire suivante sur *doblar* et *girar*.'
  es.a1.unit09.lesson02.teach.girar_derecha:
    title: Tourner à droite
    gloss: Tourne à droite.
    note: '*Gira* est l’impératif informel de *girar* (tourner/pivoter), entièrement interchangeable avec *doblar*.'
  es.a1.unit09.lesson02.teach.cruzar_la_calle:
    title: Traverser la rue
    gloss: Traverse la rue.
    note: '*Cruza* est l’impératif informel de *cruzar* (traverser).'
  es.a1.unit09.lesson02.teach.doblar_vs_girar_note:
    title: Doblar ou girar
    gloss: Deux verbes tout aussi naturels pour dire « tourner ».
    note: Consulte le texte de la fiche.
  es.a1.unit09.lesson03.teach.como_llego_a_la_biblioteca:
    title: Demander comment aller quelque part
    gloss: Comment puis-je aller à la bibliothèque ?
    note: '*Cómo llego a* (comment puis-je aller à) est la tournure courante pour demander son chemin vers un lieu précis.'
  es.a1.unit09.lesson03.teach.es_facil:
    title: Dire que c’est facile
    gloss: C’est facile.
    note: Une expression courante et rassurante employée avant d’indiquer le chemin.
  es.a1.unit09.lesson03.teach.sigue_derecho_por_esta_calle:
    title: Aller tout droit dans cette rue
    gloss: Va tout droit dans cette rue.
    note: '*Por esta calle* (dans cette rue) précise quelle rue suivre.'
  es.a1.unit09.lesson03.teach.dobla_a_la_izquierda_en_la_esquina:
    title: Tourner à gauche au coin de la rue
    gloss: Tourne à gauche au coin de la rue.
    note: '*En la esquina* (au coin de la rue) indique où il faut tourner.'
  es.a1.unit09.lesson04.teach.esta_bien_asi:
    title: Demander confirmation
    gloss: C’est bien comme ça ?
    note: '*¿Está bien así?* (c’est bien comme ça ?) permet de vérifier que l’on a bien compris après avoir répété l’itinéraire : c’est la suite naturelle lorsque quelqu’un vient de nous indiquer le chemin.'
  es.a1.unit09.lesson04.teach.si_asi_es:
    title: Confirmer
    gloss: Oui, c’est bien ça.
    note: '*Así es* (c’est bien ça) est une confirmation brève et naturelle.'
  es.a1.unit09.lesson04.teach.no_te_pierdas:
    title: Ne pas se perdre
    gloss: Ne te perds pas !
    note: '*No te pierdas* est l’impératif négatif informel de *perderse* (se perdre), une formule de départ chaleureuse et familière.'
  es.a1.unit09.lesson05.teach.direcciones_reading:
    title: Lire un itinéraire
    gloss: 'Pour aller à la bibliothèque depuis le marché : va tout droit dans cette rue. Tourne à gauche au coin de la rue. Ensuite, traverse la rue. La bibliothèque se trouve à droite.'
    note: 'Dans des indications écrites, les étapes sont données dans l’ordre : *Para llegar a...* (pour arriver à…) indique la destination, puis chaque étape emploie l’impératif à la forme *tú* (*sigue*, *dobla*, *cruza*), et *después* (ensuite) relie les étapes.'
    glosses:
      llegar: arriver
      biblioteca: bibliothèque
      desde: depuis
      mercado: marché
      sigue: continue / va
      derecho: tout droit
      calle: rue
      Dobla: tourne
      izquierda: gauche
      esquina: coin
      Después: ensuite / après
      cruza: traverse
      está: se trouve
      derecha: droite
  es.a1.unit09.lesson05.teach.desde_note:
    title: Desde (depuis)
    gloss: Comment desde indique le point de départ d’un itinéraire.
    note: Consulte le texte de la fiche.
  es.a1.unit09.lesson06.teach.line01:
    title: Demander son chemin
    gloss: Mateo demande à Elena comment aller à la bibliothèque depuis le marché.
    note: 'Il s’agit de la même question, *¿Cómo llego a...?*, que précédemment dans cette unité, mais avec désormais un point de départ : *desde el mercado* (depuis le marché).'
  es.a1.unit09.lesson06.teach.line02:
    title: Donner la première indication
    gloss: Elena dit que c’est facile et donne la première indication.
    note: '*Es fácil* (c’est facile) rassure avant la première indication.'
  es.a1.unit09.lesson06.teach.line03:
    title: Répéter et demander la suite
    gloss: Mateo répète l’indication et demande ce qu’il faut faire ensuite.
    note: '*Sigo derecho* (je vais tout droit) emploie la première personne de *seguir* et montre que Mateo confirme activement l’itinéraire à mesure qu’il l’écoute.'
  es.a1.unit09.lesson06.teach.line04:
    title: Donner la deuxième indication
    gloss: Elena lui dit de tourner à gauche au coin de la rue.
    note: '*Dobla* (tourne) : *gira* aurait ici le même sens.'
  es.a1.unit09.lesson06.teach.line05:
    title: Répéter et demander confirmation
    gloss: Mateo répète qu’il faut tourner et demande si c’est bien cela.
    note: '*Doblo* (je tourne) fait écho à son précédent *Sigo derecho* : Mateo répète chaque étape à la forme *yo* pour vérifier qu’il a bien compris.'
  es.a1.unit09.lesson06.teach.line06:
    title: Confirmer et donner les dernières indications
    gloss: 'Elena confirme, puis lui dit de traverser la rue : la bibliothèque sera à droite.'
    note: '*Sí, así es* (oui, c’est bien ça) confirme, puis *después* (ensuite) introduit les dernières étapes de l’itinéraire.'
  es.a1.unit09.lesson06.teach.line07:
    title: Remercier Elena
    gloss: Mateo remercie chaleureusement Elena.
    note: '*Muchas gracias* (merci beaucoup) est une formule plus chaleureuse que le simple *gracias*.'
  es.a1.unit09.lesson06.teach.line08:
    title: Répondre et prendre congé
    gloss: Elena lui répond qu’il n’y a pas de quoi et lui dit de ne pas se perdre.
    note: '*De nada* (de rien) est la réponse habituelle à *gracias*.'
