teaching:
  es.a1.unit46.lesson01.teach.no_me_siento:
    title: Ne pas se sentir bien
    gloss: Je ne me sens pas bien.
    note: '*Sentirse* est pronominal (*me siento*, *te sientes*) ; *no me siento bien* est une façon générale et modérée de dire que quelque chose ne va pas.'
  es.a1.unit46.lesson01.teach.enfermo:
    title: Malade
    gloss: malade
    note: 'Un adjectif courant, employé avec *estar* (être, pour un état) : *estoy enfermo*.'
    example_gloss: Je suis malade.
  es.a1.unit46.lesson01.teach.estoy_enfermo:
    title: Être malade
    gloss: Je suis malade.
    note: '*Enfermo* désigne un état plus général et plus marqué que *no me siento bien* ; il s’accorde avec le genre de la personne qui parle (*enferma*).'
  es.a1.unit46.lesson01.teach.dolor_de_cabeza:
    title: Mal de tête
    gloss: un mal de tête
    note: 'En espagnol, on emploie *dolor de cabeza* avec *tener* et sans article : *tengo dolor de cabeza*.'
    example_gloss: J’ai mal à la tête.
  es.a1.unit46.lesson01.teach.tengo_dolor_de:
    title: Avoir mal à la tête
    gloss: J’ai mal à la tête.
    note: 'Les symptômes s’emploient avec *tener* (avoir) : *tengo dolor de cabeza*, comme en français « j’ai mal à la tête ».'
  es.a1.unit46.lesson01.teach.dolor_de_estomago:
    title: Mal au ventre
    gloss: mal au ventre
    note: 'Même construction sans article que *dolor de cabeza* : *dolor de estómago*.'
    example_gloss: J’ai mal au ventre.
  es.a1.unit46.lesson01.teach.tengo_dolor_de_2:
    title: Avoir mal au ventre
    gloss: J’ai mal au ventre.
    note: Suit la même construction avec *tener* que *dolor de cabeza*.
  es.a1.unit46.lesson02.teach.que_pasa:
    title: Demander de manière générale
    gloss: Qu’est-ce qui ne va pas ?
    note: Une formule générale qui convient dans toutes les situations pour demander si quelque chose ne va pas.
  es.a1.unit46.lesson02.teach.que_te_pasa:
    title: Une expression courante
    gloss: Qu’est-ce qui ne va pas ?
    note: '*¿Qué te pasa?* est la manière naturelle de demander ce qui ne va pas (littéralement « qu’est-ce qui t’arrive ? ») ; ne traduis pas cette expression mot à mot.'
  es.a1.unit46.lesson02.teach.dolor_de_garganta:
    title: Mal de gorge
    gloss: mal à la gorge
    note: 'Même construction que *dolor de cabeza* et *dolor de estómago* : *dolor de garganta*.'
    example_gloss: J’ai mal à la gorge.
  es.a1.unit46.lesson02.teach.tengo_dolor_de:
    title: Avoir mal à la gorge
    gloss: J’ai mal à la gorge.
    note: Suit la même construction avec *tener* que les autres symptômes.
  es.a1.unit46.lesson02.teach.estas_bien_no:
    title: Prendre des nouvelles de quelqu’un
    gloss: Ça va ? Non, je ne me sens pas bien.
    note: '*¿Estás bien?* est une question familière très courante pour prendre des nouvelles d’un ami ; avec quelqu’un que l’on vouvoie avec *usted*, elle devient *¿Está bien?*.'
  es.a1.unit46.lesson03.teach.fiebre:
    title: Fièvre
    gloss: de la fièvre
    note: 'S’emploie sans article après *tener*, comme les autres symptômes : *tengo fiebre*.'
    example_gloss: J’ai de la fièvre.
  es.a1.unit46.lesson03.teach.tengo_fiebre:
    title: Avoir de la fièvre
    gloss: J’ai de la fièvre.
    note: Suit la construction avec *tener*.
  es.a1.unit46.lesson03.teach.resfriado:
    title: Avoir un rhume
    gloss: être enrhumé
    note: '*Resfriado* est un adjectif employé avec *estar* ; tu peux aussi dire *tengo un resfriado*, où *resfriado* est un nom.'
    example_gloss: Je suis enrhumé.
  es.a1.unit46.lesson03.teach.estoy_resfriado:
    title: Dire que l’on est enrhumé
    gloss: Je suis enrhumé.
    note: En espagnol, on dit *estoy resfriado* avec un adjectif, tandis qu’en français on peut aussi employer l’adjectif « enrhumé » ; l’adjectif espagnol s’accorde avec le genre de la personne qui parle (*resfriada*).
  es.a1.unit46.lesson03.teach.enfermo_y_resfriado:
    title: Le choix entre estar et tener dépend de la nature du mot
    gloss: 'Enfermo et resfriado sont des adjectifs et s’emploient avec estar : je suis malade, je suis enrhumé. Fiebre et dolor de cabeza sont des noms et s’emploient avec tener : j’ai de la fièvre, j’ai mal à la tête.'
    note: 'Le choix entre *estar* et *tener* dépend de la nature du mot : les adjectifs (*enfermo*, *resfriado*) s’emploient avec *estar*, et les noms désignant des symptômes (*fiebre*, *dolor de cabeza*) avec *tener*.'
  es.a1.unit46.lesson04.teach.la_farmacia:
    title: La pharmacie
    gloss: la pharmacie
    note: 'Un nom féminin : *la farmacia*.'
    example_gloss: Je vais à la pharmacie.
  es.a1.unit46.lesson04.teach.en_que_puedo:
    title: L’accueil du pharmacien
    gloss: Comment puis-je vous aider ?
    note: '*¿En qué puedo ayudarle?* est une formule de service polie courante ; dans *ayudarle*, *le* est le pronom complément correspondant au vouvoiement avec *usted*.'
  es.a1.unit46.lesson04.teach.tiene_algo_para:
    title: Demander quelque chose contre un symptôme
    gloss: Avez-vous quelque chose contre le mal de tête ?
    note: '*Algo para* + symptôme est la manière naturelle de demander un remède : *algo para el dolor de cabeza*.'
  es.a1.unit46.lesson04.teach.una_pastilla:
    title: Un comprimé
    gloss: un comprimé
    note: 'Un nom féminin : *la pastilla* ; *una pastilla* désigne une pilule ou un comprimé.'
    example_gloss: Je prends un comprimé.
  es.a1.unit46.lesson04.teach.toma_una_pastilla:
    title: Instructions de dosage
    gloss: Prends un comprimé deux fois par jour.
    note: '*Toma* est l’impératif familier de *tomar* (prendre), employé pour donner des instructions.'
  es.a1.unit46.lesson04.teach.en_la_farmacia:
    title: Le registre à la pharmacie
    gloss: À la pharmacie, on emploie la forme de politesse usted.
    note: 'Le pharmacien est un adulte que tu ne connais pas et qui exerce un métier de service ; tu le vouvoies donc avec *usted* : *¿Tiene algo...?* au lieu de *¿Tienes algo...?*.'
  es.a1.unit46.lesson05.teach.consejo_toma_una:
    title: Lis les conseils de la pharmacie
    gloss: 'Conseil : prends un comprimé deux fois par jour avec de l’eau. Repose-toi bien et bois beaucoup d’eau. Tu ne te sens toujours pas bien au bout de trois jours ? Alors va chez le médecin.'
    note: Repère le dosage, les deux recommandations sans médicament et le moment où il faut consulter un médecin.
    glosses:
      Consejo: conseil
      toma: prendre
      veces: fois
      día: jour
      pastilla: comprimé
      Descansa: se reposer
      bebe: boire
      sentirte: se sentir
      sigues: encore
      bien: bien
      médico: médecin généraliste
  es.a1.unit46.lesson06.teach.elena_hola_mateo:
    title: Elena prend des nouvelles
    gloss: 'Elena : Salut Mateo, comment vas-tu ? Tu te sens déjà mieux ?'
    note: '*Ya* (déjà, maintenant) montre qu’Elena cherche à savoir si l’état de Mateo s’est amélioré depuis leur dernière conversation ; *te sientes* est la forme familière avec *tú* du verbe *sentirse*.'
  es.a1.unit46.lesson06.teach.mateo_todavia_no:
    title: Mateo ne va toujours pas bien
    gloss: 'Mateo : Toujours pas très bien. J’ai encore mal à la tête et je suis fatigué.'
    note: '*Sigo con* (j’ai encore) indique que le mal de tête n’a pas disparu ; *cansado* (fatigué) est un nouvel adjectif utile qui s’accorde avec le genre (*cansada*).'
  es.a1.unit46.lesson06.teach.elena_has_tomado:
    title: Elena pose une question sur le médicament
    gloss: 'Elena : Tu as pris un comprimé ?'
    note: '*Has tomado* est au passé composé espagnol : *has* + le participe passé *tomado*, selon la même construction que *me has ayudado*.'
  es.a1.unit46.lesson06.teach.mateo_si_he:
    title: Mateo confirme
    gloss: 'Mateo : Oui, j’ai pris un comprimé. Maintenant, je vais me reposer.'
    note: '*Voy a descansar* (je vais me reposer) suit la construction du futur proche *ir a* + infinitif.'
  es.a1.unit46.lesson06.teach.elena_buena_idea:
    title: Elena lui souhaite un bon rétablissement
    gloss: 'Elena : Bonne idée. Repose-toi bien. Bon rétablissement !'
    note: '*¡Que te mejores!* est la formule consacrée pour souhaiter un prompt rétablissement à quelqu’un ; elle emploie le subjonctif *mejores*.'
  es.a1.unit46.lesson06.teach.mateo_gracias_hasta:
    title: Mateo prend congé
    gloss: 'Mateo : Merci, à demain !'
    note: '*Hasta mañana* suit la construction *hasta* + indication de temps, comme dans les formules d’au revoir telles que *hasta luego*.'
