answer_policy:
  accent_marks: Display and teach all Spanish accent marks. In typed A1 answers, accept a variant without acute accents when every other letter and word is correct. Do not treat n as a substitute for ñ.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal and place names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation.
course:
  title: Espagnol A1
  description: Le vocabulaire de la famille proche et élargie, les adjectifs possessifs et la description du foyer, dans la suite de l’histoire de l’atelier de cuisine d’Elena et Mateo commencée aux unités 01 et 02. Des explications mettent en évidence les registres des adjectifs possessifs (mi/tu/su) et le genre des noms désignant les membres de la famille.
units:
  es.a1.unit03.family:
    title: Les familles d’Elena et de Mateo
lessons:
  es.a1.unit03.lesson01.immediate_family:
    title: La famille proche
  es.a1.unit03.lesson02.possessives_and_asking:
    title: 'Les possessifs : mi, tu, su'
  es.a1.unit03.lesson03.extended_family:
    title: La famille élargie
  es.a1.unit03.lesson04.describing_family_size:
    title: Combien de personnes vivent à la maison ?
  es.a1.unit03.lesson05.reading_a_family_profile:
    title: Lire un profil familial
  es.a1.unit03.lesson06.family_photos_dialogue:
    title: Les photos de famille d’Elena et de Mateo
teaching:
  es.a1.unit03.lesson01.teach.madre:
    title: Mère
    gloss: mère
    note: '*Madre* est féminin. *Mamá* est plus courant dans la vie quotidienne au sein de la famille, tandis que *madre* est neutre et employé dans les listes de vocabulaire de ce cours.'
  es.a1.unit03.lesson01.teach.padre:
    title: Père
    gloss: père
    note: '*Padre* est masculin. *Papá* est l’équivalent courant dans la vie quotidienne, comme *mamá* par rapport à *madre*.'
  es.a1.unit03.lesson01.teach.hermano:
    title: Frère
    gloss: frère
    note: '*Hermano* est masculin singulier.'
  es.a1.unit03.lesson01.teach.hermana:
    title: Sœur
    gloss: sœur
    note: '*Hermana* est féminin singulier.'
  es.a1.unit03.lesson01.teach.hijo:
    title: Fils
    gloss: fils
    note: '*Hijo* est masculin singulier.'
  es.a1.unit03.lesson01.teach.hija:
    title: Fille
    gloss: fille
    note: '*Hija* est féminin singulier.'
  es.a1.unit03.lesson01.teach.padres:
    title: Parents
    gloss: parents
    note: '*Padres* (masculin pluriel) désigne un groupe mixte formé de la mère et du père. En espagnol, le masculin pluriel s’emploie généralement dès qu’un groupe comprend au moins un homme.'
  es.a1.unit03.lesson01.teach.hermanos:
    title: Frères et sœurs
    gloss: frères et sœurs ; frères
    note: '*Hermanos* peut signifier « frères » pour un groupe entièrement masculin ou « frères et sœurs » pour un groupe mixte, selon la même règle du masculin pluriel que *padres*.'
  es.a1.unit03.lesson02.teach.mi_familia:
    title: Ma famille
    gloss: ma famille
    note: '*Mi* (sans accent) est l’adjectif possessif signifiant « mon », « ma » ou « mes ». Il ne varie pas selon le genre, seulement selon le nombre (*mis* devant un nom pluriel).'
  es.a1.unit03.lesson02.teach.tu_familia:
    title: Ta famille
    gloss: ta famille
    note: '*Tu* (sans accent, contrairement au pronom *tú*) est le possessif familier correspondant au tutoiement avec *tú* vu dans l’unité 1.'
  es.a1.unit03.lesson02.teach.su_familia:
    title: Votre famille / sa famille
    gloss: sa famille / votre famille
    note: '*Su* peut signifier « son », « sa », « ses » ou le possessif de politesse « votre » avec *usted*. L’espagnol ne distingue pas ces sens par le seul possessif : c’est le contexte qui les précise.'
  es.a1.unit03.lesson02.teach.tienes_hermanos:
    title: Poser une question sur les frères et sœurs
    gloss: As-tu des frères et sœurs ?
    note: '*Tienes* est la forme de *tener* employée avec *tú*, le même verbe qui sert à exprimer l’âge dans l’unité 2.'
  es.a1.unit03.lesson02.teach.tengo_dos_hermanas:
    title: Indiquer son nombre de frères et sœurs
    gloss: J’ai deux sœurs.
    note: La structure habituelle pour parler de ses frères et sœurs associe *Tengo* (« j’ai »), un nombre et le nom du membre de la famille.
  es.a1.unit03.lesson02.teach.tu_familia_es_grande:
    title: Demander si une famille est grande
    gloss: Ta famille est-elle grande ?
    note: '*Grande* ne varie pas selon le genre, seulement selon le nombre (*grandes*).'
  es.a1.unit03.lesson02.teach.mi_familia_es_pequena:
    title: Décrire une petite famille
    gloss: Ma famille est petite.
    note: '*Pequeña* s’accorde avec le nom féminin *familia* ; avec un nom masculin, on emploierait la forme *pequeño*.'
  es.a1.unit03.lesson03.teach.abuelo:
    title: Grand-père
    gloss: grand-père
    note: '*Abuelo* est masculin singulier.'
  es.a1.unit03.lesson03.teach.abuela:
    title: Grand-mère
    gloss: grand-mère
    note: '*Abuela* est féminin singulier.'
  es.a1.unit03.lesson03.teach.abuelos:
    title: Les grands-parents
    gloss: grands-parents
    note: '*Abuelos* (masculin pluriel) désigne un couple mixte, selon le même modèle que *padres* et *hermanos*.'
  es.a1.unit03.lesson03.teach.tio:
    title: L’oncle
    gloss: oncle
    note: '*Tío* porte un accent écrit, car l’accent tonique tombe sur le *í*, ce qui sépare deux voyelles qui formeraient sinon une diphtongue.'
  es.a1.unit03.lesson03.teach.tia:
    title: La tante
    gloss: tante
    note: '*Tía* suit le même modèle d’accentuation que *tío*, pour la même raison.'
  es.a1.unit03.lesson03.teach.primo:
    title: Le cousin
    gloss: cousin
    note: '*Primo* est masculin singulier ; comme en français, l’espagnol indique le genre du cousin ou de la cousine.'
  es.a1.unit03.lesson03.teach.prima:
    title: La cousine
    gloss: cousine
    note: '*Prima* est féminin singulier.'
  es.a1.unit03.lesson03.teach.mis_abuelos:
    title: Mes grands-parents
    gloss: mes grands-parents
    note: '*Mis* est la forme plurielle de *mi* ; elle est obligatoire lorsque le nom qu’elle détermine est au pluriel, quel que soit son genre.'
  es.a1.unit03.lesson04.teach.cuantos_hermanos_tienes:
    title: Demander combien quelqu’un a de frères et sœurs
    gloss: Combien as-tu de frères et sœurs ?
    note: '*Cuántos* s’accorde avec le nom sur lequel porte la question : il est au masculin pluriel, car *hermanos* peut désigner un groupe mixte.'
  es.a1.unit03.lesson04.teach.somos_cinco:
    title: Indiquer le nombre de personnes dans le foyer
    gloss: Nous sommes cinq à la maison.
    note: En espagnol, *Somos* (nous sommes) est la tournure naturelle pour indiquer le nombre total de personnes dans le foyer, comme en français dans « nous sommes cinq à la maison ».
  es.a1.unit03.lesson04.teach.mi_familia_es_grande:
    title: Décrire une famille nombreuse
    gloss: Ma famille est grande.
    note: Ici, *Grande* qualifie *familia* (féminin), mais garde la même forme *grande* avec les noms masculins, car les adjectifs en -e comme *grande* ne varient pas en genre.
  es.a1.unit03.lesson04.teach.tengo_muchos_primos:
    title: Dire que tu as beaucoup de cousins
    gloss: J’ai beaucoup de cousins.
    note: On emploie *Muchos* au masculin pluriel, car *primos*, comme *hermanos* et *padres*, peut désigner un groupe mixte.
  es.a1.unit03.lesson04.teach.vives_cerca_de_tus_padres:
    title: Demander si quelqu’un habite près de ses parents
    gloss: Habites-tu près de tes parents ?
    note: '*Tus* est le pluriel de *tu* ; cette forme est obligatoire parce que *padres* est au pluriel.'
  es.a1.unit03.lesson04.teach.vivo_con_mis_abuelos:
    title: Dire avec qui tu habites
    gloss: J’habite avec mes grands-parents.
    note: '*Con* (avec) introduit les personnes avec qui quelqu’un vit ; *vivo* est la forme de *vivir* à la première personne du singulier, *yo*, déjà vue dans l’unité 1 avec *vivo en Londres*.'
  es.a1.unit03.lesson05.teach.profile_reading:
    title: Présentation de la famille d’Elena
    gloss: 'Je m’appelle Elena. J’ai trente et un ans et j’habite avec mes grands-parents en Espagne. Ma mère et mon père habitent à Barcelone. J’ai une sœur et un frère : nous sommes cinq à la maison. Ma petite sœur s’appelle Sofía et elle a vingt ans.'
    note: Cette présentation réutilise le vocabulaire et les structures des leçons 01 à 04 dans un court texte suivi plutôt que dans des phrases isolées. Elle permet de s’entraîner à identifier les liens entre les personnes, comme dans l’évaluation de compréhension écrite de cette unité.
    glosses:
      llamo: m’appelle (de llamarse)
      Tengo: j’ai (de tener)
      treinta: trente
      años: ans
      vivo: j’habite (de vivir)
      abuelos: grands-parents
      madre: mère
      padre: père
      viven: j’habite (de vivir)
      hermana: sœur
      hermano: frère
      somos: nous sommes (de ser)
      cinco: cinq
      casa: maison
      menor: plus jeune
      tiene: a (de tener)
      veinte: vingt
  es.a1.unit03.lesson05.teach.hermana_menor:
    title: Petite sœur
    gloss: petite sœur
    note: '*Menor* (plus jeune) se place après le nom qu’il qualifie et ne change pas de forme selon le genre.'
  es.a1.unit03.lesson05.teach.vive_third_person:
    title: Habite (troisième personne)
    gloss: habite
    note: '*Vive* est la troisième personne du singulier de *vivir*. Cette forme sert à parler de quelqu’un (*Elena vive*...), contrairement à *vivo*, vu pour la première fois dans la leçon 04 de l’unité 1, puis de nouveau dans la leçon 04 de cette unité.'
  es.a1.unit03.lesson05.teach.sus_third_person_plural:
    title: Son, sa ou leur devant un nom pluriel
    gloss: ses ou leurs
    note: '*Sus* est le pluriel de *su*. Comme *su* peut signifier « son », « sa » ou « votre » devant un nom singulier, le sens dépend du contexte : lorsqu’on parle d’Elena à la troisième personne, *sus abuelos* signifie « ses grands-parents ».'
  es.a1.unit03.lesson06.teach.line01:
    title: Montrer des photos de famille
    gloss: Elena montre une photo à Mateo et lui présente ses parents et sa petite sœur.
    note: '*Estos son* (ce sont, masculin ou groupe mixte au pluriel) introduit les parents ; *esta es* (c’est, féminin singulier) introduit la sœur.'
  es.a1.unit03.lesson06.teach.line02:
    title: Réagir et poser une question sur les frères et sœurs
    gloss: Mateo réagit chaleureusement et demande à Elena si elle a d’autres frères et sœurs.
    note: '*Qué bonito* est une réaction naturelle et chaleureuse lorsqu’on voit une photo, avec une fonction semblable à celle de *Qué bien*, vu dans l’unité 1.'
  es.a1.unit03.lesson06.teach.line03:
    title: Indiquer la taille du foyer et retourner la question
    gloss: Elena dit qu’elle a une sœur et un frère — ils sont cinq à la maison — puis interroge Mateo sur sa famille.
    note: '*Somos cinco en casa* indique le nombre total de personnes dans le foyer, selon le modèle de la leçon 04.'
  es.a1.unit03.lesson06.teach.line04:
    title: Décrire une famille plus petite
    gloss: 'Mateo dit que sa famille est plus petite — ils ne sont que trois : ses parents et lui — mais qu’il a beaucoup de cousins.'
    note: '*Pero* (mais) marque le contraste entre une petite famille proche et de nombreux membres dans la famille élargie.'
  es.a1.unit03.lesson06.teach.line05:
    title: Demander si quelqu’un habite près de ses parents
    gloss: Elena demande à Mateo s’il habite près de ses parents.
    note: '*Cerca de* (près de) est une expression courante pour indiquer une proximité physique.'
  es.a1.unit03.lesson06.teach.line06:
    title: Expliquer la distance et le maintien du contact
    gloss: Mateo répond que non, que ses parents habitent en Colombie et qu’ils se parlent au téléphone chaque semaine.
    note: 'Ce passage reprend une information établie dans l’unité 1 : Mateo vient de Colombie, mais habite à Londres, tandis que ses parents sont restés en Colombie.'
  es.a1.unit03.lesson06.teach.line07:
    title: Exprimer de l’empathie et parler de ta propre situation
    gloss: Elena dit qu’elle comprend et qu’elle habite avec ses grands-parents, ici, en Espagne.
    note: '*Entiendo* (je comprends) est une manière naturelle et brève de réagir à ce que quelqu’un vient de dire avant d’ajouter une information personnelle en rapport avec le sujet.'
  es.a1.unit03.lesson06.teach.line08:
    title: Terminer par une remarque chaleureuse
    gloss: Mateo dit qu’il est agréable d’avoir sa famille près de soi.
    note: '*Qué bien tener a la familia cerca* conclut l’échange sur une note chaleureuse et réfléchie, en reprenant le modèle *qué bien*/*qué bonito* employé tout au long du dialogue.'
