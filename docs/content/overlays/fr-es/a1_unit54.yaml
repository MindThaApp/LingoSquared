  es.a1.unit54.lesson06.teach.lucia_si_que:
    title: Lucía accepte
    gloss: 'Lucía : Oui, super ! J’adore nager.'
  es.a1.unit54.lesson06.teach.mateo_prefiero_jugar:
    title: Mateo préfère le football
    gloss: 'Mateo : Je préfère jouer au football.'
  es.a1.unit54.lesson06.teach.diego_y_a:
    title: Diego aime courir
    gloss: 'Diego : Et moi, j’aime courir.'
  es.a1.unit54.lesson06.teach.elena_entonces_esta:
