  es.a1.unit54.lesson01.teach.juego_al_futbol:
    title: Je joue au football
    gloss: Je joue au football.
    note: '*Jugar al fútbol* se construit avec *jugar a* + un sport (*a* + *el* devient *al*) ; d’autres sports s’emploient avec *hacer*, comme dans *hago yoga*. Consulte la note de grammaire.'
  es.a1.unit54.lesson01.teach.con_el_futbol:
    title: Jugar a et hacer avec les sports
    gloss: 'On emploie jugar a avec des sports comme le football et hacer avec d’autres comme le yoga : juego al fútbol, hago yoga.'
    note: 'Une même construction s’emploie avec tous les deportes : à ce niveau, tu n’as pas besoin d’apprendre un verbe différent pour chaque deporte.'
  es.a1.unit54.lesson02.teach.veces_por_semana:
    title: Fois par semaine
    gloss: fois par semaine
    example_gloss: Je fais du yoga deux fois par semaine.
  es.a1.unit54.lesson02.teach.ya_conoces_todos:
    title: Veces por semana ou todos los días/a menudo
    gloss: Tu connais déjà todos los días (tous les jours) et a menudo (souvent). Dos veces por semana (deux fois par semaine) est une nouvelle façon, plus précise, d’indiquer la fréquence.
    note: Cette expression enrichit le vocabulaire de la fréquence déjà vu dans l’unité sur les loisirs.
  es.a1.unit54.lesson02.teach.hago_yoga_dos:
    title: Je fais du yoga deux fois par semaine
    gloss: Je fais du yoga deux fois par semaine.
  es.a1.unit54.lesson02.teach.mateo_juega_a:
    title: Mateo joue souvent au football
    gloss: Mateo joue souvent au football.
    note: Cette phrase reprend *a menudo* (souvent), déjà vu dans les unités précédentes.
  es.a1.unit54.lesson03.teach.ya_conoces_hacer:
    title: Hacer deporte ou un sport précis
    gloss: 'Tu connais déjà hacer deporte grâce à la leçon sur les loisirs (Hago deporte los sábados — je fais du sport le samedi). Jugar al fútbol ou hacer yoga permet de préciser le sport pratiqué : Juego al fútbol.'
    note: '*Hacer deporte*, déjà vu dans la leçon sur les loisirs, a un sens général ; *jugar al fútbol* et *hacer yoga* désignent un sport précis.'
  es.a1.unit54.lesson03.teach.hacer_deporte:
