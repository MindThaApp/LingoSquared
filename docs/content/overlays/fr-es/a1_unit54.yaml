    title: Correr est régulier
    gloss: 'Correr est un verbe régulier : yo corro, tú corres, él corre.'
    note: '*Correr* est un verbe régulier en -er : *yo corro*, *él corre*.'
  es.a1.unit54.lesson04.teach.mateo_que_bien:
    title: Mateo réagit
    gloss: 'Mateo : Super ! Moi, j’y joue souvent au football.'
  es.a1.unit54.lesson05.teach.elena_hace_yoga:
    title: Elena et Lucía parlent de sport
    gloss: Elena fait du yoga deux fois par semaine. Elle adore bouger tranquillement. Lucía ne fait pas de yoga, mais elle adore nager. Lucía nage souvent, presque toutes les semaines. Quel sport pratiques-tu ?
    note: Ce texte oppose deux sports et deux expressions de fréquence, sur le modèle du texte précédent consacré aux animaux.
