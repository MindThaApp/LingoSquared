  es.a1.unit54.lesson06.teach.ya_conoces_tomamos:
    title: ¿Hacemos ...?
    gloss: Tu connais déjà ¿Tomamos ...? pour proposer de faire quelque chose ensemble ; pour le sport, tu peux dire ¿Hacemos deporte?
