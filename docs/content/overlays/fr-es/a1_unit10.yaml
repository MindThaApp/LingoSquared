teaching:
  es.a1.unit10.lesson01.teach.el_tiempo:
    title: Le temps
    gloss: le temps
    note: '*Tiempo* signifie aussi « temps » au sens chronologique : le contexte permet de distinguer les deux sens.'
    example_gloss: Quel temps fait-il aujourd’hui ?
  es.a1.unit10.lesson01.teach.el_sol:
    title: Le soleil
    gloss: le soleil
    note: '*Sol* est masculin.'
    example_gloss: Il y a beaucoup de soleil aujourd’hui.
  es.a1.unit10.lesson01.teach.la_lluvia:
    title: La pluie
    gloss: la pluie
    note: '*Lluvia* est féminin.'
    example_gloss: Je n’aime pas la pluie.
  es.a1.unit10.lesson01.teach.el_viento:
    title: Le vent
    gloss: le vent
    note: '*Viento* est masculin.'
    example_gloss: Il y a beaucoup de vent aujourd’hui.
  es.a1.unit10.lesson01.teach.la_nube:
    title: Le nuage
    gloss: le nuage
    note: '*Nube* est féminin.'
    example_gloss: Il n’y a pas un seul nuage.
  es.a1.unit10.lesson02.teach.hace_calor:
    title: Il fait chaud
    gloss: Il fait chaud.
    note: '*Hace calor* (littéralement « il fait chaleur ») est l’expression habituelle pour dire qu’il fait chaud.'
    example_gloss: Il fait très chaud en juillet.
  es.a1.unit10.lesson02.teach.hace_frio:
    title: Il fait froid
    gloss: Il fait froid.
    note: '*Hace frío* suit la même construction avec *hace* + nom que *hace calor*.'
    example_gloss: En décembre, il fait froid.
  es.a1.unit10.lesson02.teach.hace_sol:
    title: Il y a du soleil
    gloss: Il y a du soleil.
    note: '*Hace sol* emploie *el sol* (le soleil) dans la même construction idiomatique.'
  es.a1.unit10.lesson02.teach.llueve:
    title: Il pleut
    gloss: Il pleut.
    note: '*Llueve* est une forme verbale à part entière, issue de *llover* (pleuvoir), et ne suit pas la construction avec *hace* ; consulte la note grammaticale suivante.'
  es.a1.unit10.lesson02.teach.esta_nublado:
    title: Le ciel est couvert
    gloss: Le ciel est couvert.
    note: '*Está nublado* emploie *estar* + adjectif : c’est une troisième construction distincte pour parler du temps.'
  es.a1.unit10.lesson02.teach.hace_vs_esta_note:
    title: 'Hace, llueve, está : trois constructions'
    gloss: Trois constructions grammaticales différentes pour décrire le temps.
    note: Consulte le texte de la carte.
    target_text: 'Les expressions météorologiques avec *hace* (hace calor, hace frío, hace sol) sont des tournures figées qui signifient littéralement « il fait chaleur/froid/soleil ». *Llueve* (il pleut) est une forme verbale à part entière, tandis que *está nublado* (le ciel est nuageux) emploie *estar* + adjectif : trois constructions différentes pour exprimer la même idée, décrire le temps.'
  es.a1.unit10.lesson03.teach.que_tiempo_hace_hoy:
    title: Demander quel temps il fait
    gloss: Quel temps fait-il aujourd’hui ?
    note: '*¿Qué tiempo hace hoy?* est la manière habituelle de demander quel temps il fait, avec *el tiempo* (le temps).'
  es.a1.unit10.lesson03.teach.hace_mucho_calor_y_sol:
    title: Décrire un temps chaud et ensoleillé
    gloss: Il fait très chaud et il y a du soleil.
    note: Cette phrase associe deux expressions avec *hace* au moyen de *y* (et).
  es.a1.unit10.lesson03.teach.hace_calor_pero_hay_viento:
    title: Décrire un temps chaud et venteux
    gloss: Il fait chaud, mais il y a du vent.
    note: '*Pero* (mais) oppose deux caractéristiques du temps — la chaleur et le vent — en employant *hay* + nom, comme dans *hay mucho viento*.'
  es.a1.unit10.lesson04.teach.en_invierno_hace_frio_en_madrid:
    title: Parler de l’hiver à Madrid
    gloss: En hiver, il fait très froid à Madrid.
    note: '*En invierno* (en hiver) introduit le nom d’une saison, par opposition à *en julio* ci-dessous.'
  es.a1.unit10.lesson04.teach.en_julio_hace_demasiado_calor:
    title: Parler de la chaleur en juillet
    gloss: En juillet, il fait trop chaud.
    note: '*Demasiado* (trop) renforce *calor* au-delà de *mucho* (beaucoup).'
  es.a1.unit10.lesson04.teach.necesitamos_agua:
    title: Expliquer pourquoi tu as besoin d’eau
    gloss: Nous avons besoin d’eau parce qu’il fait chaud.
    note: '*Porque* (parce que) relie un besoin à sa cause météorologique : une phrase pratique et utile pour le cours de cuisine.'
  es.a1.unit10.lesson05.teach.pronostico_reading:
    title: Lire des prévisions météo
    gloss: Aujourd’hui, 22 juillet, il fait très chaud et il y a du soleil. Il n’y a pas un seul nuage. Il y a aussi un peu de vent. C’est une bonne journée pour aller au cours de cuisine, mais il est important d’emporter de l’eau.
    note: De brèves prévisions pour le 22 juillet, jour du cours de cuisine.
    glosses:
      Hoy: aujourd’hui
      veintidós: vingt-deuxième
      julio: juillet
      hace: il fait / le temps est (de hacer)
      calor: chaleur
      sol: ensoleillé / soleil
      hay: il y a (de haber)
      nube: nuage
      También: aussi
      poco: peu
      viento: vent
      buen: bon
      día: jour
      ir: aller
      taller: atelier
      cocina: cuisine
      importante: important
      llevar: apporter / porter
      agua: eau
  es.a1.unit10.lesson05.teach.un_poco_de_note:
    title: Un poco de (un peu de)
    gloss: Comment un poco de exprime une petite quantité.
    note: Consulte le texte de la carte.
    target_text: '*Un poco de* (un peu de) s’emploie avec des quantités de nourriture et décrit ici une petite quantité de vent : c’est la même construction avec un nouveau nom.'
  es.a1.unit10.lesson06.teach.line01:
    title: Faire une remarque sur la chaleur
    gloss: Elena fait remarquer qu’il fait très chaud aujourd’hui.
    note: '*¡Qué calor hace hoy!* (qu’est-ce qu’il fait chaud aujourd’hui !) est une tournure exclamative construite avec l’expression *hace calor*.'
  es.a1.unit10.lesson06.teach.line02:
    title: Approuver et ajouter une précision
    gloss: Mateo approuve et fait remarquer qu’il n’y a pas un seul nuage.
    note: Cette réplique associe *hace mucho calor y hace sol* à *no hay ni una nube*.
  es.a1.unit10.lesson06.teach.line03:
    title: Proposer d’apporter de l’eau
    gloss: Elena dit qu’ils ont besoin d’eau pour le trajet.
    note: '*El camino* (le chemin) désigne leur trajet jusqu’à l’atelier.'
  es.a1.unit10.lesson06.teach.line04:
    title: Approuver et signaler un magasin
    gloss: Mateo approuve et mentionne un magasin à proximité.
    note: '*Cerca de aquí* (près d’ici) emploie la locution *cerca de* (près de).'
  es.a1.unit10.lesson06.teach.line05:
    title: Comparer l’hiver et l’été
    gloss: Elena oppose les hivers froids de Madrid à la chaleur excessive de ce jour de juillet.
    note: Cette réplique associe les deux phrases saisonnières *en invierno hace mucho frío* et *en julio hace demasiado calor*.
  es.a1.unit10.lesson06.teach.line06:
    title: Exprimer une préférence
    gloss: 'Mateo dit qu’il préfère la chaleur : à Londres, il pleut presque tous les jours.'
    note: '*Prefiero* (je préfère) est une nouvelle forme verbale à la première personne ; *casi todos los días* (presque tous les jours) est une expression de fréquence utile.'
  es.a1.unit10.lesson06.teach.line07:
    title: Approuver et presser le pas
    gloss: Elena approuve et dit qu’ils doivent partir, sinon ils seront en retard au cours.
    note: '*Es verdad* signifie « c’est vrai » ; ici, *o* (ou) introduit une conséquence et signifie « sinon ».'
  es.a1.unit10.lesson06.teach.line08:
    title: Donner raison et partir
    gloss: Mateo reconnaît qu’elle a raison et ils partent.
    note: '*Tienes razón* (tu as raison) est une expression courante pour marquer son accord.'
