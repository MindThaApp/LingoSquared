      bici: vélo (va en bici = va à vélo)
      normalmente: habituellement
      llueve: pleut
      va: prend
      conducir: conduire (conducir)
      prefiere: préfère
      coche: voiture
      vive: habite
      cerca: tout près
      camina: marche
      viajas: voyager
