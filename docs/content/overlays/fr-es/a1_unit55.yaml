    title: Qui se déplace comment ?
    gloss: Elena va au travail en train tous les jours. Mateo y va habituellement à vélo, mais quand il pleut, il prend aussi le train. Diego préfère conduire la voiture. Lucía habite tout près et va au travail à pied. Et toi, comment vas-tu au travail ?
    note: Présente quatre façons différentes d’aller au travail et une condition, la pluie, sur le modèle du texte précédent consacré au sport.
