teaching:
  es.a1.unit07.lesson01.teach.el_mercado:
    title: Le marché
    gloss: le marché
    note: '*Mercado* est masculin.'
    example_gloss: Allons au marché.
  es.a1.unit07.lesson01.teach.fruta_verdura:
    title: Fruits, légumes
    gloss: fruit, légume(s)
    note: '*Verdura* désigne les légumes en général, souvent les légumes verts. C’est un nom féminin singulier qui peut aussi s’employer dans un sens collectif, comme « verdure » en français.'
    example_gloss:
    - Je veux acheter des fruits.
    - Les légumes sont frais.
  es.a1.unit07.lesson01.teach.huevos_pan:
    title: Œufs, pain
    gloss: œufs, pain
    note: '*Huevos* est déjà au pluriel ; son singulier est *huevo*. *Pan* désigne le pain comme une matière et ne s’emploie généralement pas au pluriel dans son sens courant.'
    example_gloss:
    - J’ai besoin d’œufs.
    - Le pain est de ce matin.
  es.a1.unit07.lesson02.teach.cuanto_cuesta:
    title: Demander le prix
    gloss: Combien ça coûte ?
    note: '*Cuesta* est la forme de la troisième personne du singulier de *costar* (coûter), un nouveau verbe de cette unité.'
  es.a1.unit07.lesson02.teach.cuanto_es:
    title: Une autre façon de demander le prix
    gloss: Ça fait combien ?
    note: Consulte la note grammaticale suivante, qui compare cette expression à *¿Cuánto cuesta?*.
  es.a1.unit07.lesson02.teach.cuesta_dos:
    title: Indiquer un prix
    gloss: Ça coûte deux.
    note: 'C’est une réponse courte mais complète : la monnaie ou l’unité se déduit du contexte, comme lorsqu’on répond simplement par un nombre pendant un achat en français.'
  es.a1.unit07.lesson02.teach.cuanto_cuesta_vs_es_note:
    title: Cuánto cuesta ou Cuánto es
    gloss: Deux façons tout aussi naturelles de demander un prix.
    note: Consulte le texte de la carte.
    target_text: '*¿Cuánto cuesta?* (combien cela coûte-t-il ?) et *¿Cuánto es?* (combien cela fait-il ?) sont deux manières naturelles de demander un prix et sont interchangeables dans ce contexte courant d’achat.'
  es.a1.unit07.lesson03.teach.una_docena_de_huevos:
    title: Demander une douzaine d’œufs
    gloss: Une douzaine d’œufs, s’il vous plaît.
    note: En espagnol, *Docena* (douzaine) est un nom toujours suivi de *de*, puis de l’article acheté, comme dans la construction française « une douzaine de ».
  es.a1.unit07.lesson03.teach.un_kilo_de_tomates:
    title: Demander un kilo de tomates
    gloss: Un kilo de tomates, s’il vous plaît.
    note: '*Kilo* suit la même construction avec *de* et le produit que *docena*.'
  es.a1.unit07.lesson03.teach.medio_kilo:
    title: Un demi-kilo
    gloss: un demi-kilo
    note: '*Medio* (demi) précède le nom qu’il détermine et s’accorde avec lui en genre : *medio kilo* au masculin, mais *media docena* au féminin.'
    example_gloss: Un demi-kilo de pain, s’il vous plaît.
  es.a1.unit07.lesson03.teach.un_poco_de:
    title: Un peu de
    gloss: un peu de
    note: '*Un poco de* s’emploie pour une petite quantité indéterminée, lorsqu’il n’est pas nécessaire d’en préciser la quantité exacte.'
    example_gloss: Je veux un peu de fruits.
  es.a1.unit07.lesson04.teach.necesita_algo_mas:
    title: Demander s’il faut autre chose
    gloss: Avez-vous besoin d’autre chose ?
    note: '*Necesita* est la forme de *necesitar* correspondant à *usted*, le registre de politesse qu’un marchand emploie généralement avec un client.'
  es.a1.unit07.lesson04.teach.no_creo_que_ya_tenemos_todo:
    title: Dire qu’on a tout
    gloss: Non, je crois que nous avons déjà tout.
    note: '*Creo que* (je crois que) est une tournure courante qui permet de nuancer une affirmation ; ici, elle sert à confirmer que la liste de courses est complète.'
  es.a1.unit07.lesson04.teach.gracias_vendedor:
    title: Remercier le marchand
    gloss: Parfait, merci.
    note: Une formule courte et naturelle pour conclure un achat.
  es.a1.unit07.lesson05.teach.etiquetas_reading:
    title: Lire les étiquettes de prix
    gloss: 'Le stand de Rosa : tomates, deux le kilo. Œufs, quatre la douzaine. Pain, six. Fruits frais tous les jours.'
    note: Une étiquette de prix typique d’un stand de marché indique le produit, son prix, puis l’unité à laquelle ce prix s’applique (*el kilo*, *la docena*). *Puesto* désigne un stand de marché ; celui-ci est tenu par Rosa.
    glosses:
      Puesto: stand / étal
      tomates: tomates
      kilo: kilo
      Huevos: œufs
      docena: douzaine
      Pan: pain
      Fruta: fruit
      fresca: frais
      todos: tous les
      días: jours
  es.a1.unit07.lesson05.teach.el_kilo_note:
    title: El kilo au sens de « le kilo »
    gloss: Comment une unité placée après un prix signifie que ce prix s’applique à cette unité.
    note: Consulte le texte de la carte.
    target_text: '*El kilo* après un prix (« tomates, dos el kilo ») signifie « le kilo » : le prix s’applique à chaque kilo acheté.'
  es.a1.unit07.lesson06.teach.line01:
    title: Proposer d’aller au marché
    gloss: Elena propose d’aller au marché acheter les ingrédients du prochain cours.
    note: '*Para la próxima clase* signifie « pour le prochain cours », c’est-à-dire la prochaine séance de l’atelier de cuisine.'
  es.a1.unit07.lesson06.teach.line02:
    title: Accepter et demander ce qu’il faut
    gloss: Mateo approuve et demande ce dont ils ont besoin.
    note: '*¿Qué necesitamos?* emploie la forme de *necesitar* correspondant à *nosotros*, c’est-à-dire « nous avons besoin ».'
  es.a1.unit07.lesson06.teach.line03:
    title: Faire remarquer la fraîcheur des tomates
    gloss: Elena dit qu’il faut d’abord des légumes et fait remarquer à quel point les tomates ont l’air fraîches.
    note: '*¡Qué tomates tan frescos!* (quelles tomates fraîches !) est une exclamation construite avec *qué*, comme *¡Qué bonito!* dans l’unité 3, mais avec un nom : *qué* + nom + *tan* + adjectif.'
  es.a1.unit07.lesson06.teach.line04:
    title: Le marchand demande la quantité
    gloss: Le marchand demande à Elena quelle quantité elle veut.
    note: '*Señorita* est une façon polie de s’adresser à une jeune femme, qui correspond au registre de *usted* employé par le marchand avec une cliente. Certains hispanophones la trouvent aujourd’hui un peu vieillie.'
  es.a1.unit07.lesson06.teach.line05:
    title: Commander un kilo et demander le prix
    gloss: Elena demande un kilo, puis le prix.
    note: Cette réplique associe naturellement *un kilo* et *¿Cuánto cuesta?*, vus précédemment dans cette unité.
  es.a1.unit07.lesson06.teach.line06:
    title: Indiquer le prix
    gloss: Le marchand dit que cela coûte deux.
    note: '*Cuesta dos* est une réponse courte indiquant le prix ; la monnaie se déduit du contexte.'
  es.a1.unit07.lesson06.teach.line07:
    title: Mateo commande des œufs et du pain
    gloss: Mateo dit qu’il lui faut une douzaine d’œufs et du pain.
    note: Cette réplique associe *huevos*, *pan* et *una docena de*, vus précédemment dans cette unité. *Yo* est facultatif et ajoute une légère insistance (« moi, j’ai besoin de… »).
  es.a1.unit07.lesson06.teach.line08:
    title: Le marchand indique les deux prix
    gloss: Le vendeur dit que les œufs coûtent quatre et le pain, six.
    note: '*Cuestan* (au pluriel, « coûtent ») s’accorde avec le sujet pluriel *los huevos*, contrairement au singulier *cuesta* employé pour les tomates.'
  es.a1.unit07.lesson06.teach.line09:
    title: Remercier le marchand
    gloss: Mateo dit « parfait, merci ».
    note: C’est la même brève formule de conclusion que précédemment dans cette unité.
  es.a1.unit07.lesson06.teach.line10:
    title: Demande à un ami s’il lui faut autre chose
    gloss: Elena demande à Mateo s’il lui faut autre chose.
    note: '*¿Necesitas...?* est la forme avec *tú*, employée avec un ami ; la forme *¿Necesita...?* du vendeur s’emploie avec *usted*.'
  es.a1.unit07.lesson06.teach.line11:
    title: Dire qu’on a tout
    gloss: Mateo répond que non et qu’il pense qu’ils ont déjà tout.
    note: '*Creo que* (« je pense que ») adoucit la réponse ; *ya* signifie « déjà ».'
