  es.a1.unit01.lesson06.cooking_workshop_dialogue:
    title: Première rencontre dans un atelier de cuisine
teaching:
  es.a1.unit01.lesson01.teach.usted:
    title: Le « vous » de respect
    gloss: vous, formel ou respectueux
    note: En français, on distingue généralement « tu » et « vous » selon la relation. L’espagnol marque lui aussi ce choix social. Usted convient pour s’adresser à un adulte que l’on ne connaît pas ou lorsqu’un ton respectueux est de mise. Bien qu’il signifie « vous », il se conjugue comme él ou ella.
  es.a1.unit01.lesson01.teach.tu:
    title: Le « tu » informel
    gloss: tu, informel singulier
    note: Tú s’emploie avec un ami, une personne de même statut, un enfant ou quelqu’un avec qui la relation est informelle. L’accent distingue le pronom tú du possessif tu, qui signifie « ton », « ta » ou « tes ».
  es.a1.unit01.lesson01.teach.como_esta_usted:
    title: Demander poliment comment va quelqu’un
    gloss: Comment allez-vous ?
    note: Está est la forme de estar employée avec usted. Ici, l’espagnol utilise estar pour parler de l’état actuel d’une personne. Cómo porte un accent parce que c’est un mot interrogatif.
  es.a1.unit01.lesson01.teach.como_estas:
    title: Demander familièrement comment va quelqu’un
    gloss: Comment allez-vous ?
    note: 'Estás est la forme de estar employée avec tú. Comme le français, l’espagnol change la forme du verbe selon que l’on tutoie ou vouvoie : está devient estás avec tú.'
  es.a1.unit01.lesson01.teach.bien_gracias:
    title: Une réponse concise
    gloss: Bien, merci.
    note: En espagnol, on peut répondre simplement par bien, sans répéter de sujet ni de verbe.
  es.a1.unit01.lesson01.teach.muy_bien:
    title: Une réponse positive
    gloss: Très bien, merci.
    note: Muy renforce bien et reste invariable.
  es.a1.unit01.lesson01.teach.and_usted:
    title: Retourner la question avec politesse
    gloss: Et vous ?
    note: Conserve usted lorsque tu retournes une question formulée sur un ton respectueux.
  es.a1.unit01.lesson01.teach.and_tu:
    title: Retourner la question de manière informelle
    gloss: Et vous ?
    note: Emploie tú lorsque l’échange est informel. L’accent écrit est important, car tu sans accent signifie « ton », « ta » ou « tes ».
  es.a1.unit01.lesson02.teach.hola:
    title: Une salutation passe-partout
    gloss: bonjour ; salut
    note: Hola convient à toute heure de la journée, dans les rencontres formelles comme informelles.
  es.a1.unit01.lesson02.teach.buenos_dias:
    title: Saluer le matin
    gloss: bonjour
    note: 'Comme en français, les noms espagnols ont un genre grammatical. Días est masculin pluriel : l’adjectif prend donc la forme buenos.'
  es.a1.unit01.lesson02.teach.buenas_tardes:
    title: Saluer l’après-midi
    gloss: bonjour
    note: 'Tardes est féminin pluriel : buenas s’accorde donc avec ce nom. Le passage de buenos à buenas est un accord grammatical et ne traduit pas un changement de politesse.'
  es.a1.unit01.lesson02.teach.buenas_noches:
    title: Saluer le soir ou la nuit
    gloss: bonsoir ; bonne nuit
    note: Noches est féminin pluriel et s’emploie donc avec buenas. Cette expression peut servir à saluer quelqu’un le soir ou à prendre congé avant d’aller dormir.
  es.a1.unit01.lesson02.teach.adios:
    title: Prendre congé directement
    gloss: au revoir
    note: Adiós est neutre, mais peut sembler plus définitif qu’une formule signifiant que l’on se reverra plus tard.
  es.a1.unit01.lesson02.teach.hasta_luego:
    title: À plus tard
    gloss: à plus tard
    note: 'Hasta luego est une formule consacrée pour prendre congé : il n’est pas nécessaire de l’interpréter mot à mot.'
  es.a1.unit01.lesson02.teach.nos_vemos:
    title: Prendre congé amicalement
    gloss: à bientôt
    note: Littéralement, nos vemos signifie plutôt « nous nous voyons ».
  es.a1.unit01.lesson02.teach.good_day:
    title: Un souhait poli pour prendre congé
    gloss: Passez une bonne journée.
    note: Tenga est la forme employée avec usted dans ce souhait poli. Buen est la forme abrégée du masculin singulier bueno devant día.
  es.a1.unit01.lesson03.teach.formal_name_question:
    title: Demander poliment le nom de quelqu’un
    gloss: Comment vous appelez-vous ?
    note: Comme en français, l’espagnol exprime littéralement cette question par « comment vous appelez-vous ? ». Se accompagne llama, la forme formelle employée avec usted.
  es.a1.unit01.lesson03.teach.my_name_lucia:
    title: Donner son nom
    gloss: Je m’appelle Lucía.
    note: 'Me llamo signifie littéralement « je m’appelle ». La terminaison du verbe indique déjà qui parle : l’espagnol omet donc normalement yo ici.'
  es.a1.unit01.lesson03.teach.informal_name_question:
    title: Demander familièrement le nom de quelqu’un
    gloss: Comment vous appelez-vous ?
    note: Te s’emploie avec le pronom informel tú, et llamas porte la terminaison -as propre à tú. Compare la forme formelle se llama à la forme informelle te llamas.
  es.a1.unit01.lesson03.teach.i_am_diego:
    title: Se présenter avec ser
    gloss: Je suis Diego.
    note: Soy est la première personne du singulier de ser. L’espagnol emploie ser pour l’identité. En français, « être » sert aussi à décrire de nombreux états temporaires, tandis que l’espagnol répartit ces emplois entre ser et estar.
  es.a1.unit01.lesson03.teach.mucho_gusto:
    title: Exprimer son plaisir de rencontrer quelqu’un
    gloss: Enchanté.
    note: Mucho gusto est une expression figée comprise dans tout le monde hispanophone. Contrairement aux adjectifs encantado et encantada, elle ne change pas selon le genre de la personne qui parle.
  es.a1.unit01.lesson03.teach.igualmente:
    title: Répondre de même
    gloss: De même.
    note: Igualmente est une réponse concise à Mucho gusto.
  es.a1.unit01.lesson03.teach.este_carlos:
    title: Présenter un homme
    gloss: Voici Carlos.
    note: 'Comme le français, l’espagnol marque ici le genre : on emploie este lorsque la personne ou le nom désigné est grammaticalement masculin.'
  es.a1.unit01.lesson03.teach.esta_ana:
    title: Présenter une femme
    gloss: Voici Ana.
    note: Emploie esta pour un référent féminin. Ici, Esta ne porte pas d’accent ; está avec un accent est une forme de estar et signifie « est » ou « se trouve ».
  es.a1.unit01.lesson04.teach.formal_origin_question:
    title: Demander poliment l’origine de quelqu’un
    gloss: D’où venez-vous ?
    note: Es est la forme de ser employée avec usted. Pour indiquer l’origine, l’espagnol utilise ser et non estar. Dónde porte un accent dans une question directe.
  es.a1.unit01.lesson04.teach.from_mexico:
    title: Indiquer son origine
    gloss: Je viens du Mexique.
    note: Soy est la forme de ser employée avec yo. Le sujet yo est inutile, car soy indique déjà qui parle.
  es.a1.unit01.lesson04.teach.informal_origin_question:
    title: Demander familièrement l’origine de quelqu’un
    gloss: D’où venez-vous ?
    note: Eres est la forme de ser employée avec tú. Compare la forme formelle es usted à la forme informelle eres. Comme en français, le verbe change selon que l’on tutoie ou vouvoie.
  es.a1.unit01.lesson04.teach.from_colombia:
    title: Une autre façon d’indiquer son origine
    gloss: Je viens de Colombie.
    note: Pour indiquer ton origine, emploie soy de suivi d’un lieu.
  es.a1.unit01.lesson04.teach.live_london:
    title: Indiquer où l’on habite
    gloss: J’habite à Londres.
    note: Vivo est la forme de vivir employée avec yo. L’espagnol n’a pas besoin de yo, car la terminaison -o indique qui parle.
  es.a1.unit01.lesson04.teach.speak_spanish:
    title: Demander poliment si quelqu’un parle espagnol
    gloss: Parlez-vous espagnol ?
    note: En espagnol, l’intonation et les points d’interrogation suffisent à transformer cette phrase en question fermée. Habla est la forme employée avec usted.
  es.a1.unit01.lesson04.teach.yes_a_little:
    title: Connaissances limitées
    gloss: Oui, un peu.
    note: Sí avec un accent signifie « oui ». Si sans accent signifie « si », mais cette orthographe sans accent est ici acceptée comme variante de tolérance de saisie au niveau A1.
  es.a1.unit01.lesson04.teach.still_learning:
    title: Décrire une situation en cours
    gloss: Je suis encore en train d’apprendre.
    note: Estoy est la forme de estar employée avec yo. Ici, estar sert à exprimer une activité en cours, tandis que soy dans Soy de Colombia exprime l’origine ou l’identité. En français, le verbe « être » peut apparaître dans les deux types de constructions.
  es.a1.unit01.lesson05.teach.formal_first_time:
    title: Demander poliment s’il s’agit d’une première visite
    gloss: Est-ce la première fois que vous venez ici ?
    note: Su signifie « votre » lorsque l’on s’adresse à quelqu’un avec usted. Comme le français distingue « votre » de « ton » ou « ta », l’espagnol oppose su à tu pour préserver le choix entre vouvoiement et tutoiement.
  es.a1.unit01.lesson05.teach.informal_first_time:
    title: Demander familièrement s’il s’agit d’une première visite
    gloss: Est-ce la première fois que vous venez ici ?
    note: Tu sans accent est le possessif informel qui signifie « ton », « ta » ou « tes ». Compare-le au pronom tú, qui porte un accent.
  es.a1.unit01.lesson05.teach.first_time_answer:
    title: Confirmer qu’il s’agit de sa première visite
    gloss: Oui, c’est la première fois.
    note: Primera est féminin parce qu’il s’accorde avec vez. En français aussi, de nombreux adjectifs s’accordent avec le genre du nom.
  es.a1.unit01.lesson05.teach.cooking_workshop:
    title: Indiquer sa destination
    gloss: Je viens pour l’atelier de cuisine.
    note: Vengo est la forme de venir employée avec yo et signifie « je viens ». Al est la contraction obligatoire de a et el.
  es.a1.unit01.lesson05.teach.me_too:
    title: Être dans la même situation
    gloss: Moi aussi.
    note: Yo también est utile lorsque ce que dit l’autre personne vaut également pour toi.
  es.a1.unit01.lesson05.teach.like_cooking:
    title: Poser une question sur un centre d’intérêt
    gloss: Aimes-tu cuisiner ?
    note: Avec gustar, l’ordre des mots diffère de celui du français. Te désigne la personne qui éprouve ce goût, tandis que cocinar est ce qui lui plaît. Le verbe reste gusta, car l’activité est considérée comme singulière.
  es.a1.unit01.lesson05.teach.yes_very_much:
    title: Exprimer un vif intérêt
    gloss: Oui, beaucoup.
    note: Mucho indique ici le degré et reste invariable.
  es.a1.unit01.lesson05.teach.thats_good:
    title: Réagir positivement
    gloss: C’est super.
    note: Qué porte un accent dans cette exclamation. Il introduit une réaction positive et non une question.
  es.a1.unit01.lesson06.teach.line01:
    title: Engager la conversation
    gloss: Elena salue Mateo et lui demande si c’est la première fois qu’il vient ici.
    note: Les deux personnes emploient les formes informelles de tú, car elles se rencontrent sur un pied d’égalité dans le cadre de la même activité.
  es.a1.unit01.lesson06.teach.line02:
    title: 'Engager la conversation : la réponse'
    gloss: Mateo confirme que c’est sa première fois et explique qu’il est là pour l’atelier de cuisine.
    note: Vengo al taller indique la raison de sa présence en employant le présent pour une situation en cours.
  es.a1.unit01.lesson06.teach.line03:
    title: Échanger les prénoms
    gloss: Elena indique que c’est aussi sa première fois, donne son prénom et demande celui de Mateo.
    note: Me llamo est une manière naturelle de donner son prénom. En espagnol, on omet généralement yo, car la forme du verbe suffit déjà à identifier la personne qui parle.
  es.a1.unit01.lesson06.teach.line04:
    title: 'Échanger les prénoms : la réponse'
    gloss: Mateo donne son prénom et dit qu’il est ravi de faire sa connaissance.
    note: 'Soy est une autre manière naturelle de donner son prénom : on emploie ser au lieu du verbe pronominal llamarse.'
  es.a1.unit01.lesson06.teach.line05:
    title: Demander l’origine
    gloss: Elena lui retourne la politesse avec « Pareillement » et demande à Mateo d’où il vient.
    note: De dónde eres sert à demander l’origine d’une personne en employant la forme informelle de tú.
  es.a1.unit01.lesson06.teach.line06:
    title: 'Demander l’origine : la réponse'
    gloss: Mateo vient de Colombie, mais vit à Londres, puis pose la même question à Elena.
    note: Soy de exprime l’origine, tandis que vivo en indique le lieu de résidence actuel. Pero marque le contraste entre ces deux faits.
  es.a1.unit01.lesson06.teach.line07:
    title: Parler d’un centre d’intérêt
    gloss: Elena dit qu’elle vient d’Espagne et demande à Mateo s’il aime cuisiner.
    note: Soy décrit l’origine selon la même structure que Mateo vient d’employer.
  es.a1.unit01.lesson06.teach.line08:
    title: 'Parler d’un centre d’intérêt : la réponse'
    gloss: Mateo dit qu’il aime beaucoup cuisiner, mais qu’il est encore en train d’apprendre.
    note: Estoy aprendiendo décrit une activité en cours. En espagnol, on emploie estar avec le gérondif pour insister sur son déroulement actuel.
  es.a1.unit01.lesson06.teach.line09:
    title: Terminer l’échange
    gloss: Elena indique qu’elle aussi est encore en train d’apprendre et dit qu’ils se retrouveront à l’intérieur.
    note: Nos vemos annonce que l’on prévoit de se revoir plus tard, et dentro précise où.
  es.a1.unit01.lesson06.teach.line10:
    title: 'Terminer l’échange : la réponse'
    gloss: Mateo acquiesce et confirme qu’ils se retrouveront plus tard.
    note: Sí confirme simplement la proposition d’Elena avant la répétition de nos vemos.
exercises:
  es.a1.unit01.lesson01.exercise01.select_formal_pronoun:
    instruction: Quelle forme de « tu » est respectueuse ou formelle ?
    correct_option: usted
    distractors:
    - tú
    - tu
    accepted_answers:
    - usted
    feedback: Usted est la forme de politesse au singulier et s’emploie avec les formes verbales de la troisième personne.
  es.a1.unit01.lesson01.exercise02.select_informal_pronoun:
    instruction: Quelle forme emploie-t-on pour s’adresser de manière informelle à un ami ou à une personne de son âge ?
    correct_option: tú
    distractors:
    - usted
    - tu
    accepted_answers:
    - tú
    feedback: Le pronom s’écrit tú avec un accent ; sans accent, tu signifie « ton » ou « ta ».
  es.a1.unit01.lesson01.exercise03.listen_formal_question:
    instruction: Écoute et sélectionne la phrase que tu entends.
    correct_option: ¿Cómo está usted?
    distractors:
    - ¿Cómo estás?
    - Et vous ?
    accepted_answers:
    - ¿Cómo está usted?
    - Como esta usted
  es.a1.unit01.lesson01.exercise04.listen_informal_question:
    instruction: Écris la question informelle que tu entends.
    accepted_answers:
    - ¿Cómo estás?
    - Cómo estás
    - Como estas
  es.a1.unit01.lesson01.exercise05.order_formal_question:
    instruction: Remets la question formelle dans l’ordre.
    correct_response:
    - Cómo
    - está
    - usted
  es.a1.unit01.lesson01.exercise06_choose_formal_return:
    instruction: Sélectionne la question en retour qui conserve le registre de politesse.
    correct_option: ¿Y usted?
    distractors:
    - Et toi ?
    - ¿Cómo estás?
    accepted_answers:
    - ¿Y usted?
    - Y usted
  es.a1.unit01.lesson01.exercise07_choose_informal_return:
    instruction: Sélectionne la question en retour adaptée à un ami ou à une personne de ton âge.
    correct_option: ¿Y tú?
    distractors:
    - Et vous ?
    - ¿Cómo está usted?
    accepted_answers:
    - ¿Y tú?
    - Y tú
    - Y tu
  es.a1.unit01.lesson01.exercise08.check_informal_agreement:
    instruction: Corrige la question informelle.
    accepted_answers:
    - ¿Cómo estás?
    - Cómo estás
    - Como estas
    - ¿Cómo estás tú?
    - Como estas tu
    feedback: Tú exige estás ; está s’emploie avec usted.
  es.a1.unit01.lesson01.exercise09.reply_formally:
    instruction: Réponds poliment à la question.
    accepted_answers:
    - Bien, gracias.
    - Bien, gracias
    - Muy bien, gracias.
    - Muy bien, gracias
    - Bien, gracias. ¿Y usted?
    - Muy bien, gracias. ¿Y usted?
  es.a1.unit01.lesson01.exercise10.speak_informally:
    instruction: Réponds de manière informelle, remercie la personne, puis retourne-lui la question.
    accepted_answers:
    - Muy bien, gracias. ¿Y tú?
    - Muy bien, gracias. Y tú?
    - Muy bien, gracias. Y tu?
    - Muy bien, gracias, ¿y tú?
    - Bien, gracias. ¿Y tú?
    - Bien, gracias. Y tu?
    - Bien, gracias, ¿y tú?
  es.a1.unit01.lesson02.exercise01.listen_hola:
    instruction: Écoute et sélectionne la salutation.
    correct_option: Hola
    distractors:
    - Adiós
    - Hasta luego
    accepted_answers:
    - Hola
  es.a1.unit01.lesson02.exercise02.listen_morning:
    instruction: Écris la salutation du matin que tu entends.
    accepted_answers:
    - Buenos días
    - Buenos dias
  es.a1.unit01.lesson02.exercise03.order_afternoon:
    instruction: Remets la salutation de l’après-midi dans l’ordre.
    correct_response:
    - Buenas
    - tardes
  es.a1.unit01.lesson02.exercise04.select_night:
    instruction: Que signifie cette expression lorsqu’on salue quelqu’un le soir ?
    correct_option: Bonsoir.
    distractors:
    - Bonjour.
    - À plus tard.
    accepted_answers:
    - Bonsoir.
  es.a1.unit01.lesson02.exercise05.listen_night:
    instruction: Écoute et sélectionne l’expression que tu entends.
    correct_option: Buenas noches
    distractors:
    - Buenos días
    - Buenas tardes
    accepted_answers:
    - Buenas noches
  es.a1.unit01.lesson02.exercise06.choose_farewell:
    instruction: À quoi sert ce mot ?
    correct_option: Il sert à prendre congé.
    distractors:
    - Il sert à demander le prénom de quelqu’un.
    - Il sert à remercier.
    accepted_answers:
    - Il sert à prendre congé.
  es.a1.unit01.lesson02.exercise07.listen_until_later:
    instruction: Remets dans l’ordre la formule pour prendre congé que tu entends.
    correct_response:
    - Hasta
    - luego
  es.a1.unit01.lesson02.exercise08.reply_to_afternoon:
    instruction: Réponds à la salutation, puis termine ce bref échange.
    accepted_answers:
    - Buenas tardes. Hasta luego.
    - Buenas tardes, hasta luego.
    - Buenas tardes. Adiós.
    - Buenas tardes. Nos vemos.
    - Buenas tardes. Que tenga un buen día.
  es.a1.unit01.lesson02.exercise09.order_good_day:
    instruction: Construis la formule polie pour souhaiter une bonne journée.
    correct_response:
    - Que
    - tenga
    - un
    - buen
    - día
  es.a1.unit01.lesson02.exercise10.speak_friendly_closing:
    instruction: Prends congé amicalement en disant que vous vous reverrez.
    accepted_answers:
    - Nos vemos.
    - Nos vemos
  es.a1.unit01.lesson03.exercise01.listen_formal_name:
    instruction: Écoute et choisis ce que demande la personne.
    correct_option: La personne demande respectueusement le nom de quelqu’un.
    distractors:
    - La personne demande où quelqu’un habite.
    - La personne demande de manière informelle comment quelqu’un va.
    accepted_answers:
    - La personne demande respectueusement le nom de quelqu’un.
  es.a1.unit01.lesson03.exercise02.order_name_answer:
    instruction: Construis la phrase dans laquelle Lucía donne son prénom.
    correct_response:
    - Me
    - llamo
    - Lucía
  es.a1.unit01.lesson03.exercise03.listen_informal_name:
    instruction: Écris la question informelle sur le prénom que tu entends.
    accepted_answers:
    - ¿Cómo te llamas?
    - Cómo te llamas
    - Como te llamas
  es.a1.unit01.lesson03.exercise04.reply_as_diego:
    instruction: Tu es Diego. Réponds à la question.
    accepted_answers:
    - Soy Diego.
    - Soy Diego
    - Me llamo Diego.
