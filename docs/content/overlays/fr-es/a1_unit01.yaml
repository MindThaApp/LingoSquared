answer_policy:
  accent_marks: Display and teach all Spanish accent marks. In typed A1 answers, accept a variant without acute accents when every other letter and word is correct. Do not treat n as a substitute for ñ because ñ is a separate Spanish letter. Inverted question and exclamation marks may be omitted in typed answers, but the fully punctuated form remains the model answer.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal and place names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation.
course:
  title: Espagnol A1
  description: Apprends les salutations, les présentations et les formules de conversation courante neutres et comprises dans tout le monde hispanophone pour une première rencontre. Des explications adaptées aux francophones mettent en évidence les niveaux de langue en espagnol, les accords, l’omission du sujet et les formes verbales.
units:
  es.a1.unit01.greetings:
    title: Salutations et premières rencontres
lessons:
  es.a1.unit01.lesson01.tu_and_usted:
    title: Choisir entre tú et usted
  es.a1.unit01.lesson02.greetings_by_time:
    title: Salutations et formules pour prendre congé au fil de la journée
  es.a1.unit01.lesson03.names_and_introductions:
    title: Noms et présentations
  es.a1.unit01.lesson04.origin_and_language:
    title: Origine, lieu de résidence et langue
  es.a1.unit01.lesson05.shared_activity_small_talk:
