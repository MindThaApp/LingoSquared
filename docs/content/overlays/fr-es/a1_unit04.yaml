  es.a1.unit04.lesson01.dias_de_la_semana:
    title: Les jours de la semaine
  es.a1.unit04.lesson02.los_meses_del_ano:
    title: Les mois de l’année
  es.a1.unit04.lesson03.preguntar_y_decir_la_fecha:
    title: Demander et indiquer la date
  es.a1.unit04.lesson04.el_cumpleanos:
    title: Les anniversaires d’Elena et Mateo
  es.a1.unit04.lesson05.leer_el_horario_del_taller:
    title: Lire le programme de l’atelier
  es.a1.unit04.lesson06.planear_la_proxima_clase_dialogue:
    title: Elena et Mateo organisent le prochain cours
teaching:
  es.a1.unit04.lesson01.teach.dias_entre_semana:
    title: Du lundi au vendredi
    gloss: Lundi, mardi, mercredi, jeudi, vendredi
    note: En espagnol comme en français, les noms des jours s’écrivent avec une minuscule, sauf en début de phrase.
    example_gloss:
    - L’atelier de cuisine a lieu le mardi.
    - Le jeudi, j’étudie l’espagnol.
  es.a1.unit04.lesson01.teach.fin_de_semana:
    title: Samedi, dimanche
    gloss: Samedi, dimanche
    note: '*Sábado* et *domingo* sont les deux seuls jours de la semaine qui prennent un -s au pluriel (*los sábados*, *los domingos*) ; les noms des jours de semaine restent identiques au singulier et au pluriel.'
    example_gloss:
    - Le samedi, je vais au marché.
    - Le dimanche, je me repose.
  es.a1.unit04.lesson01.teach.hoy_es_viernes:
    title: Aujourd’hui, c’est vendredi
    gloss: Aujourd’hui, c’est vendredi.
    note: '*Hoy* (aujourd’hui), suivi de *es* (c’est), puis du nom du jour, permet d’indiquer directement quel jour on est, sans article.'
  es.a1.unit04.lesson01.teach.el_taller_es_los_martes:
    title: L’atelier a lieu le mardi
    gloss: L’atelier de cuisine a lieu le mardi.
    note: '*Los martes* (avec l’article pluriel *los*) signifie « le mardi » lorsqu’il s’agit d’une activité récurrente, et non d’un mardi précis.'
  es.a1.unit04.lesson02.teach.meses_primer_semestre:
    title: Janvier-juin
    gloss: janvier, février, mars, avril, mai, juin
    note: Contrairement au français, les noms des jours et des mois s’écrivent avec une minuscule en espagnol, sauf en début de phrase.
    example_gloss:
    - Mon anniversaire est en mars.
    - En juin, il fait chaud.
  es.a1.unit04.lesson02.teach.meses_segundo_semestre:
    title: Juillet-décembre
    gloss: juillet, août, septembre, octobre, novembre, décembre
    note: '*Septiembre* a la même origine que « septembre » ; la plupart des noms de mois espagnols ressemblent beaucoup à leurs équivalents français.'
    example_gloss:
    - L’atelier de cuisine commence en juillet.
    - En décembre, je rends visite à ma famille.
  es.a1.unit04.lesson02.teach.mi_cumpleanos_es_en_marzo:
    title: Mon anniversaire est en mars
    gloss: Mon anniversaire est en mars.
    note: '*En* (en) s’emploie avec le seul nom du mois, sans jour précis.'
  es.a1.unit04.lesson03.teach.que_fecha_es_hoy:
    title: Demander la date d’aujourd’hui
    gloss: Quelle est la date d’aujourd’hui ?
    note: '*Qué fecha* (quelle date) est la formulation habituelle pour demander une date du calendrier, à la différence de *qué hora* (quelle heure), qui sera abordé dans une prochaine unité.'
  es.a1.unit04.lesson03.teach.hoy_es_el_veintidos_de_julio:
    title: Indiquer une date
    gloss: Aujourd’hui, nous sommes le vingt-deux juillet.
    note: '*El veintidós de julio* se construit littéralement comme « le vingt-deux de juillet » : l’espagnol emploie un nombre cardinal, tandis que le français dit simplement « le vingt-deux juillet ».'
  es.a1.unit04.lesson03.teach.formato_fecha_note:
    title: La formulation des dates en espagnol
    gloss: Comment indiquer une date du calendrier en espagnol.
    note: Nombre cardinal + de + mois. Pour le premier jour du mois, *el primero* est courant, surtout en Amérique latine ; *el uno* s’emploie également, notamment en Espagne.
    target_text: 'En espagnol, une date s’exprime avec un nombre cardinal + de + le mois, et non avec un nombre ordinal comme « le quinze » en français : el veintidós de julio signifie littéralement « le vingt-deux de juillet ». Pour le premier jour du mois, de nombreux locuteurs, surtout en Amérique latine, disent *el primero* (le premier) ; *el uno* est également courant, surtout en Espagne.'
  es.a1.unit04.lesson03.teach.cuando_es_el_taller:
    title: Demander quand a lieu l’atelier
    gloss: Quand a lieu l’atelier ?
    note: '*Cuándo* (quand) permet de poser une question générale sur le moment ; *qué fecha* (l’autre question de cette leçon) porte précisément sur une date du calendrier. Les deux formulations sont naturelles ici.'
  es.a1.unit04.lesson03.teach.el_taller_es_el_veintidos_de_julio:
    title: Indiquer la date de l’atelier
    gloss: L’atelier a lieu le vingt-deux juillet.
    note: Cette phrase reprend la structure de date de *hoy es el veintidós de julio*, avec simplement un autre sujet (*el taller*).
  es.a1.unit04.lesson04.teach.cuando_es_tu_cumpleanos:
    title: Demander la date d’anniversaire de quelqu’un
    gloss: Quand est ton anniversaire ?
    note: '*Tu cumpleaños* (ton anniversaire) emploie le registre informel de *tú*, utilisé entre amis.'
  es.a1.unit04.lesson04.teach.mi_cumpleanos_es_el_diez_de_marzo:
    title: Indiquer la date de ton anniversaire
    gloss: Mon anniversaire est le dix mars.
    note: Contrairement à *en marzo* (en mars, avec le mois seulement), une date d’anniversaire complète se construit avec *el* suivi du numéro du jour, comme dans *el veintidós de julio*.
  es.a1.unit04.lesson04.teach.el_de_mateo_es_el_veintidos_de_agosto:
    title: Indiquer l’anniversaire d’une autre personne
    gloss: L’anniversaire de Mateo est le vingt-deux août.
    note: '*El cumpleaños de Mateo* (l’anniversaire de Mateo) emploie *de* pour exprimer la possession, comme dans *la familia de Elena*.'
  es.a1.unit04.lesson04.teach.felicidades:
    title: Félicitations !
    gloss: Félicitations ! / Joyeux anniversaire !
    note: '*¡Felicidades!* est une formule générale de félicitations, couramment employée pour les anniversaires comme pour d’autres bonnes nouvelles.'
    example_gloss: Joyeux anniversaire, Elena ! Aujourd’hui, c’est ton anniversaire.
  es.a1.unit04.lesson05.teach.horario_reading:
    title: Lire le programme de l’atelier
    gloss: L’atelier de cuisine a lieu le mardi. Le prochain cours est le vingt-deux juillet. Ensuite, il y a un cours le vingt-neuf juillet. L’atelier se termine le douze août.
    note: Ce court programme réunit dans un même texte les noms des jours de la semaine et la structure des dates que tu as appris.
    glosses:
      taller: atelier
      cocina: cuisine
      martes: les mardis
      próxima: prochain
      clase: cours
      veintidós: vingt-deux
      julio: Juillet
      Después: ensuite
      hay: il y a (verbe haber)
      veintinueve: vingt-neuf
      termina: se termine (verbe terminar)
      doce: douze
      agosto: Août
  es.a1.unit04.lesson05.teach.la_proxima_clase:
    title: Le prochain cours
    gloss: le prochain cours
    note: '*Próxima* (prochaine) s’accorde avec le nom féminin *clase* ; la forme masculine serait *próximo*.'
  es.a1.unit04.lesson05.teach.despues_note:
    title: Después (après)
    gloss: Comment *después* relie des événements qui se succèdent.
    note: '*Después* = après, ensuite.'
    target_text: '*Después* (après, ensuite) relie deux événements qui se suivent : d’abord une chose, puis la suivante.'
  es.a1.unit04.lesson06.teach.line01:
    title: Demander quand a lieu le prochain cours
    gloss: Mateo demande à Elena quand a lieu le prochain cours de l’atelier.
    note: '*La próxima clase del taller* = le prochain cours de l’atelier.'
  es.a1.unit04.lesson06.teach.line02:
    title: Indiquer la date
    gloss: Elena confirme que c’est le vingt-deux juillet, un mardi.
    note: Elena ajoute *un martes* (un mardi) après la date, ce qui confirme que le cours a lieu le jour habituel de l’atelier, le mardi.
  es.a1.unit04.lesson06.teach.line03:
    title: Demander quand se termine l’atelier
    gloss: Mateo demande quand se termine l’atelier.
    note: '*Perfecto* (parfait) est une réaction brève et naturelle avant de poser une autre question.'
  es.a1.unit04.lesson06.teach.line04:
    title: Indiquer la date de fin
    gloss: Elena dit que l’atelier se termine le douze août.
    note: C’est la même date de fin que celle indiquée sur le programme imprimé.
  es.a1.unit04.lesson06.teach.line05:
    title: Demander la date d’un anniversaire au cours d’une conversation
    gloss: Mateo dit « au fait », puis demande à Elena quand est son anniversaire.
    note: '*Por cierto* (au fait) permet d’introduire naturellement un changement de sujet au cours d’une conversation.'
  es.a1.unit04.lesson06.teach.line06:
    title: Indiquer la date et retourner la question
    gloss: Elena répond le dix mars, puis demande « et le tien ? »
    note: '*¿Y el tuyo?* (et le tien ?) emploie le pronom possessif *tuyo*, une nouvelle forme courte qui permet de retourner une question à propos d’un élément déjà nommé (*cumpleaños*, masculin, d’où *tuyo* et non *tuya*).'
  es.a1.unit04.lesson06.teach.line07:
    title: Indiquer la date d’anniversaire de Mateo
    gloss: Mateo répond le vingt-deux août.
    note: C’est une réponse courte et complète qui reprend la structure de la date sans répéter « mi cumpleaños es », ce qui est naturel dans un échange oral rapide.
  es.a1.unit04.lesson06.teach.line08:
    title: Réagir et situer l’événement dans le temps
    gloss: Elena réagit chaleureusement en remarquant que son anniversaire tombe après la fin de l’atelier.
    note: '*Es después del taller* (c’est après l’atelier) : le 22 août vient après la fin de l’atelier, le 12 août.'
