answer_policy:
  accent_marks: Display and teach all Spanish accent marks. In typed A1 answers, accept a variant without acute accents when every other letter and word is correct. Do not treat n as a substitute for ñ because ñ is a separate Spanish letter. Inverted question and exclamation marks may be omitted in typed answers, but the fully punctuated form remains the model answer.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal and place names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation.
course:
  title: Espagnol A1
  description: 'Espagnol débutant pour décrire les principales caractéristiques physiques d’une personne : la taille, l’impression donnée par son âge, la couleur de ses cheveux et de ses yeux, la question essentielle ¿Cómo es ...? et la comparaison de l’apparence de deux personnes.'
units:
  es.a1.unit52.appearance:
    title: Décrire l’apparence physique
lessons:
  es.a1.unit52.lesson01.alto_bajo_mayor_y:
    title: Grand, petit, âgé et jeune
  es.a1.unit52.lesson02.describir_el_pelo:
    title: Décrire les cheveux
  es.a1.unit52.lesson03.los_ojos_y_como:
    title: Les yeux et demander à quoi ressemble quelqu’un
  es.a1.unit52.lesson04.elena_describe_a_nina:
    title: Elena décrit Nina
  es.a1.unit52.lesson05.comparar_a_diego_y:
    title: Comparer Diego et Lucía
  es.a1.unit52.lesson06.mateo_reconoce_a_nina:
    title: Mateo reconnaît Nina
teaching:
  es.a1.unit52.lesson01.teach.alto_bajo:
    title: Grand et petit
    gloss: grand / petit
    note: '*Alto* décrit une personne grande et *bajo* une personne petite ; tous deux s’accordent avec la personne : *alta*, *baja*.'
    example_gloss:
    - Lucía est grande.
    - Diego est petit.
  es.a1.unit52.lesson01.teach.mayor_joven:
    title: Âgé et jeune
    gloss: âgé / jeune
    note: '*Mayor* et *joven* donnent une impression générale de l’âge, sans indiquer un nombre d’années précis.'
    example_gloss:
    - Grand-père est âgé.
    - Mateo est jeune.
  es.a1.unit52.lesson01.teach.para_dar_la:
    title: 'Mayor : une impression, pas un nombre'
    gloss: Pour indiquer un âge exact, on utilise tener años, comme dans ¿Cuántos años tienes? ; mayor donne une impression générale sans indiquer de nombre, comme dans El abuelo es mayor.
    note: 'Pour indiquer un âge exact, on dit *tener años* : *¿Cuántos años tienes?* *Mayor* ne donne qu’une impression générale, sans indiquer de nombre.'
  es.a1.unit52.lesson01.teach.lucia_es_alta:
    title: Lucía est grande et Diego est petit
    gloss: Lucía est grande et Diego est petit.
    note: Une phrase simple réunie par *y* (« et »), qui prépare la comparaison directe d’une prochaine leçon.
  es.a1.unit52.lesson02.teach.el_pelo:
    title: Les cheveux
    gloss: les cheveux
    note: '*El pelo* est masculin et reste au singulier lorsque l’on parle de l’ensemble de la chevelure d’une personne.'
    example_gloss: Mateo a les cheveux courts et noirs.
  es.a1.unit52.lesson02.teach.rubio_castano_gris:
    title: Blond, châtain et gris
    gloss: blond / châtain / gris
    note: 'Trois couleurs de cheveux : *rubio* (blond), *castaño* (châtain) et *gris* (gris). *Rubio* s’accorde avec le nom : *pelo rubio*, *melena rubia*.'
    example_gloss:
    - Elena a les cheveux blonds.
    - Diego a les cheveux châtains.
    - Grand-père a les cheveux gris.
  es.a1.unit52.lesson02.teach.largo_corto:
    title: Cheveux longs et courts
    gloss: long / court (cheveux)
    note: '*Largo* (long) est réutilisé après la leçon sur la taille, cette fois pour la longueur des cheveux ; *corto* (court) est nouveau : *el pelo largo*, *el pelo corto*.'
    example_gloss:
    - Lucía a les cheveux longs.
    - Diego a les cheveux courts.
  es.a1.unit52.lesson02.teach.el_adjetivo_va:
    title: Les adjectifs se placent après le nom
    gloss: 'L’adjectif se place après le nom : el pelo corto, el pelo largo, el pelo rubio, el pelo castaño, el pelo gris, el pelo negro.'
    note: 'En espagnol, l’adjectif se place après le nom et s’accorde avec lui : *el pelo corto*, *el pelo rubio*.'
  es.a1.unit52.lesson02.teach.pelo_y_cabello:
    title: Pelo et cabello
    gloss: 'Pelo et cabello ont le même sens. Dans ce cours, on emploie pelo : el pelo largo.'
    note: '*Pelo* et *cabello* signifient tous deux « cheveux » dans l’espagnol courant ; ce cours emploie *pelo*.'
  es.a1.unit52.lesson02.teach.mateo_tiene_el:
    title: Mateo a les cheveux courts et noirs
    gloss: Mateo a les cheveux courts et noirs.
    note: Réutilise *negro* (noir), vu dans l’unité sur les vêtements.
  es.a1.unit52.lesson02.teach.elena_tiene_el:
    title: Elena a les cheveux longs et blonds
    gloss: Elena a les cheveux longs et blonds.
    note: Combine le vocabulaire de la longueur et de la couleur de cette leçon dans une phrase naturelle.
  es.a1.unit52.lesson03.teach.los_ojos:
    title: Les yeux
    gloss: les yeux
    note: '*Los ojos* est le pluriel de *el ojo* ; les deux sont masculins.'
    example_gloss: Mateo a les yeux marron.
  es.a1.unit52.lesson03.teach.azul_marron_verde:
    title: Bleu, marron et vert
    gloss: bleu / marron / vert
    note: '*Azul* (bleu) et *verde* (vert) ont la même forme aux deux genres ; *marrón* (marron) est le mot habituel pour la couleur des yeux, tandis que pour les cheveux, on emploie *castaño*.'
    example_gloss:
    - Elena a les yeux bleus.
    - Diego a les yeux marron.
    - Lucía a les yeux verts.
  es.a1.unit52.lesson03.teach.con_ojos_plural:
    title: Ojos exige un adjectif au pluriel
    gloss: 'Avec ojos (au pluriel), l’adjectif est aussi au pluriel : ojos azules, ojos marrones, ojos verdes.'
    note: 'Les adjectifs s’accordent en nombre : *ojos* est au pluriel, donc *azules*, *marrones*, *verdes*.'
  es.a1.unit52.lesson03.teach.como_es_elena:
    title: À quoi ressemble Elena ?
    gloss: À quoi ressemble Elena ?
    note: '*¿Cómo es ...?* est la question essentielle de cette unité ; réutilise-la pour demander à quoi ressemble quelqu’un.'
  es.a1.unit52.lesson03.teach.elena_tiene_el:
    title: Elena a les cheveux longs et blonds et les yeux bleus
    gloss: Elena a les cheveux longs et blonds et les yeux bleus.
    note: Une réponse modèle qui combine les cheveux et les yeux dans une même phrase avec *y*.
  es.a1.unit52.lesson04.teach.elena_viene_una:
    title: Elena présente Nina
    gloss: 'Elena : Une nouvelle fille va venir au café des langues. Elle s’appelle Nina.'
    note: '*Viene* (« va venir ») introduit une nouvelle personne ; *se llama* signifie « s’appelle ».'
  es.a1.unit52.lesson04.teach.mateo_genial_como:
    title: Mateo demande à quoi elle ressemble
    gloss: 'Mateo : Génial ! À quoi ressemble-t-elle ?'
    note: 'Réutilise la question essentielle de cette unité sans nom : *¿Cómo es?*'
  es.a1.unit52.lesson04.teach.elena_es_baja:
    title: Elena décrit la taille et les cheveux de Nina
    gloss: 'Elena : Elle est petite et elle a les cheveux courts et blonds.'
    note: Combine *baja*, vu dans la première leçon, avec le vocabulaire des cheveux ; *baja* est au féminin parce que Nina est une fille.
  es.a1.unit52.lesson04.teach.mateo_y_los:
    title: Mateo demande de quelle couleur sont ses yeux
    gloss: 'Mateo : Et ses yeux ?'
    note: '*¿Y los ojos?* reprend le sujet avec l’article défini : en espagnol, *sus* n’est donc pas nécessaire ici.'
  es.a1.unit52.lesson04.teach.elena_tiene_los:
    title: Elena décrit les yeux de Nina
    gloss: 'Elena : Elle a les yeux verts.'
    note: Réutilise *los ojos verdes*, vu dans la leçon sur les yeux.
  es.a1.unit52.lesson04.teach.mateo_gracias_entonces:
    title: Mateo va la reconnaître
    gloss: 'Mateo : Merci ! Alors, je la reconnaîtrai.'
    note: '*La reconoceré* (« je la reconnaîtrai ») est au futur ; *la* signifie « la » et se place avant le verbe.'
  es.a1.unit52.lesson05.teach.diego_es_el:
    title: Comparer Diego et Lucía
    gloss: Diego et Lucía sont frère et sœur, mais ils sont différents. Diego est petit et a les cheveux courts et châtains et les yeux marron. Lucía est plus grande que Diego et a les cheveux longs et châtains et les yeux verts. Et toi, à quoi ressembles-tu ?
    note: Une courte comparaison qui réutilise tous les mots de couleur et de longueur appris jusqu’ici et se termine par la question essentielle de l’unité, adressée au lecteur.
    glosses:
      hermano: frère
      hermana: sœur
      eres: apparence
      diferentes: différent
      bajo: petit
      corto: petit
      castaño: châtain
      pelo: cheveux
      marrones: châtain
      ojos: yeux
      alta: plus grand
      largo: long
      verdes: vert
      cómo: '(dans « cómo es » = à quoi ressemble…) '
  es.a1.unit52.lesson05.teach.ya_conoces_el:
    title: Réutiliser la structure comparative
    gloss: 'Tu connais déjà la structure de la comparaison : más + adjectif + que. Ici, tu l’emploies pour des personnes : Lucía est plus grande que Diego.'
    note: La structure *más + adjective + que*, vue dans l’unité sur les comparaisons, s’applique maintenant aux personnes plutôt qu’aux objets.
  es.a1.unit52.lesson05.teach.lucia_tiene_el:
    title: Lucía a les cheveux plus longs que Diego
    gloss: Lucía a les cheveux plus longs que Diego.
    note: '*Más largo que* sert à comparer deux choses : *el pelo más largo que Diego* ; *largo* reste au masculin parce que *pelo* est masculin.'
  es.a1.unit52.lesson05.teach.tengo_el_pelo:
    title: J’ai les cheveux courts et châtains
    gloss: J’ai les cheveux courts et châtains.
    note: Une phrase modèle à la première personne avec *tengo*, que tu peux réutiliser pour te décrire.
  es.a1.unit52.lesson06.teach.mateo_mira_es:
    title: Mateo aperçoit Nina
    gloss: 'Mateo : Regarde, c’est Nina ? Elle a les cheveux courts et blonds et les yeux verts.'
    note: '*Mira* (« regarde ») est l’impératif informel de *mirar*, employé ici pour attirer l’attention sur quelque chose.'
  es.a1.unit52.lesson06.teach.elena_si_esa:
    title: Elena confirme
    gloss: 'Elena : Oui, c’est Nina !'
    note: Une confirmation courte et naturelle.
  es.a1.unit52.lesson06.teach.nina_hola_eres:
    title: Nina salue Mateo
    gloss: 'Nina : Bonjour, tu es Mateo ?'
    note: 'Une question simple pour saluer quelqu’un de manière informelle : *¿Eres ...?*'
  es.a1.unit52.lesson06.teach.mateo_si_encantado:
    title: Mateo salue Nina à son tour
    gloss: 'Mateo : Oui ! Enchanté de faire ta connaissance, Nina.'
    note: '*Encantado de conocerte* est la formule habituelle lors d’une première rencontre ; une femme dit *Encantada*.'
  es.a1.unit52.lesson06.teach.nina_encantada_de:
    title: Nina lui répond
    gloss: 'Nina : Enchantée de faire ta connaissance, moi aussi !'
    note: 'Conclut le dialogue : Mateo a bien reconnu Nina grâce à la description faite plus tôt par Elena.'
