  es.a1.unit14.lesson01.el_apartamento_vocabulario:
    title: L’appartement
  es.a1.unit14.lesson02.buscar_apartamento_vocabulario:
    title: Louer un appartement
  es.a1.unit14.lesson03.cuantos_dormitorios_tiene:
    title: Combien de chambres y a-t-il ?
  es.a1.unit14.lesson04.quiero_una_cocina_grande:
    title: Je veux une grande cuisine
  es.a1.unit14.lesson05.leer_el_anuncio:
    title: L’annonce de l’appartement
  es.a1.unit14.lesson06.buscar_apartamento_dialogue:
    title: Elena et Mateo cherchent un appartement
teaching:
  es.a1.unit14.lesson01.teach.el_apartamento:
    title: L’appartement
    gloss: l’appartement
    note: '*Apartamento* est masculin.'
    example_gloss: J’habite dans un petit appartement.
  es.a1.unit14.lesson01.teach.la_cocina:
    title: La cuisine
    gloss: la cuisine
    note: Consulte la note de grammaire ci-dessous sur l’autre sens de ce mot, « cuisine » au sens d’activité.
    example_gloss: Ma cuisine est très petite.
  es.a1.unit14.lesson01.teach.el_dormitorio:
    title: La chambre
    gloss: la chambre
    note: '*Dormitorio* est masculin et vient de *dormir* (dormir).'
    example_gloss: Il y a un grand lit dans la chambre.
  es.a1.unit14.lesson01.teach.el_bano:
    title: La salle de bains
    gloss: la salle de bains
    note: '*Baño* est masculin.'
    example_gloss: L’appartement a une salle de bains.
  es.a1.unit14.lesson01.teach.la_sala:
    title: Le salon
    gloss: le salon
    note: '*Sala* est féminin.'
    example_gloss: Nous regardons la télévision dans le salon.
  es.a1.unit14.lesson01.teach.cocina_ambiguity_note:
    title: 'Cocina : pièce ou activité'
    gloss: La différence entre la cocina (la cuisine comme pièce) et cocinar (cuisiner).
    note: Consulte le texte de la carte.
    target_text: 'Ici, *La cocina* signifie « la cuisine » en tant que pièce, un sens différent de *cocina*/*cocinar* (cuisine/cuisiner), déjà employés tout au long de cette histoire pour parler de l’atelier. Le contexte permet de les distinguer : dans *taller de cocina*, il s’agit de l’activité de cuisiner ; *la cocina* d’une maison ou d’un appartement désigne la pièce ; *cocinar* est le verbe « cuisiner ».'
  es.a1.unit14.lesson02.teach.alquilar:
    title: Louer
    gloss: louer
    note: Le verbe à l’infinitif, employé dans *quiero alquilar* (je veux louer).
  es.a1.unit14.lesson02.teach.el_edificio:
    title: L’immeuble
    gloss: l’immeuble
    note: '*Edificio* est masculin.'
    example_gloss: L’immeuble est près du parc.
  es.a1.unit14.lesson02.teach.desocupado:
    title: Libre / vacant
    gloss: libre / vacant
    note: '*Desocupado* décrit un logement à louer actuellement vide et disponible.'
  es.a1.unit14.lesson02.teach.grande:
    title: Grand
    gloss: grand
    note: '*Grande* ne change pas selon le genre, contrairement aux adjectifs en -o/-a.'
  es.a1.unit14.lesson02.teach.pequeno:
    title: Petit
    gloss: petit
    note: '*Pequeño/pequeña* est le contraire de *grande*.'
  es.a1.unit14.lesson03.teach.cuantos_dormitorios_tiene:
    title: Demander le nombre de chambres
    gloss: Combien de chambres y a-t-il ?
    note: '*¿Cuántos...tiene?* (combien en a-t-il ?) est une tournure courante pour poser une question sur les caractéristiques d’un lieu.'
  es.a1.unit14.lesson03.teach.tiene_dos_dormitorios_y_una_cocina_grande:
    title: Décrire les chambres et la cuisine
    gloss: Il y a deux chambres et une grande cuisine.
    note: '*Tiene* (il/elle a) + nombre + nom, ici avec *dormitorio*, *cocina* et *grande*.'
  es.a1.unit14.lesson04.teach.quiero_alquilar_un_apartamento_con_una_cocina_grande:
    title: Indiquer le type de logement recherché
    gloss: Je veux louer un appartement avec une grande cuisine.
    note: '*Quiero* (je veux) + l’infinitif *alquilar*, avec *con* (avec) pour introduire la caractéristique souhaitée.'
  es.a1.unit14.lesson04.teach.asi_puedes_cocinar_en_casa:
    title: Expliquer l’avantage
    gloss: Comme ça, tu peux aussi cuisiner chez toi.
    note: '*Así* (comme ça/ainsi) + *puedes* (tu peux) + infinitif relie le choix du logement au thème de la cuisine présent tout au long de l’histoire.'
  es.a1.unit14.lesson05.teach.anuncio_reading:
    title: Lire une annonce immobilière
    gloss: Appartement libre dans un immeuble près du parc. Il comprend deux chambres, une salle de bains, un salon et une grande cuisine. Il est parfait pour quelqu’un qui veut cuisiner chez soi.
    note: Une annonce réaliste rédigée dans le style des petites annonces.
    glosses:
      desocupado: libre / vacant
      edificio: immeuble
      cerca: près / proche
      parque: parc
      Tiene: a (verbe tener)
      dormitorios: chambres
      baño: salle de bains
      sala: salon
      grande: grand
      perfecto: parfait
      quiere: veut (verbe querer)
      cocinar: cuisiner
  es.a1.unit14.lesson05.teach.para_alguien_que_note:
    title: Para alguien que...
    gloss: Comment une proposition relative décrit le locataire idéal.
    note: Consulte le texte de la carte.
    target_text: '*Para alguien que quiere* (pour quelqu’un qui veut) emploie *alguien* (quelqu’un) + *que* (qui) pour introduire une proposition relative : une construction courante dans les petites annonces décrivant le locataire idéal.'
  es.a1.unit14.lesson06.teach.line01:
    title: Présenter le problème et l’objectif
    gloss: Mateo dit que sa cuisine est très petite et qu’il veut louer un appartement avec une grande cuisine.
    note: Cette phrase associe *mi cocina es muy pequeña* (ma cuisine est très petite) à l’objectif *quiero alquilar un apartamento con una cocina grande*.
  es.a1.unit14.lesson06.teach.line02:
    title: Proposer de consulter les annonces
    gloss: 'Elena propose de regarder dans le journal : il y a beaucoup d’annonces.'
    note: '*El periódico* (le journal) et *anuncios* (les annonces) sont de nouveaux mots tirés du vocabulaire concret des petites annonces.'
  es.a1.unit14.lesson06.teach.line03:
    title: Trouver une annonce
    gloss: Mateo trouve un immeuble où un appartement est libre.
    note: '*Este edificio* (cet immeuble) et *desocupado* (libre, vacant).'
  es.a1.unit14.lesson06.teach.line04:
    title: Demander le nombre de chambres
    gloss: Elena demande combien il y a de chambres.
    note: C’est la question habituelle pour demander les caractéristiques d’un logement.
  es.a1.unit14.lesson06.teach.line05:
    title: Répondre en donnant les détails
    gloss: Mateo dit qu’il y a deux chambres et une grande cuisine.
    note: '*Tiene* (il/elle a) + nombre + nom.'
  es.a1.unit14.lesson06.teach.line06:
    title: Confirmer les autres caractéristiques
    gloss: Elena est ravie et remarque qu’il y a aussi une salle de bains et un salon.
    note: '*Baño* (salle de bains) et *sala* (salon) complètent la liste des pièces ; *también* (aussi) se place à la fin.'
  es.a1.unit14.lesson06.teach.line07:
    title: Décider d’appeler
    gloss: Mateo décide d’appeler l’agence aujourd’hui.
    note: '*Voy a llamar* (je vais appeler) + *hoy mismo* (aujourd’hui même) ; *la agencia* désigne l’agence immobilière.'
  es.a1.unit14.lesson06.teach.line08:
    title: Approuver et conclure
    gloss: Elena approuve et souligne qu’il pourra aussi cuisiner chez lui.
    note: '*Así puedes cocinar en casa también* (comme ça, tu peux aussi cuisiner chez toi) conclut la scène.'
